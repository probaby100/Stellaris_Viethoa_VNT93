l_english:

############
# Cloaking #
############

# Technologies
 tech_cloaking_1:0 "Trường Tàng Hình Cơ Bản"
 tech_cloaking_1_desc:0 "Một trường hạt được tinh chỉnh có thể \"che giấu\" hạm đội của chúng ta một cách hiệu quả giữa không gian rộng mở. Tuy nhiên, cái giá phải trả là sự mất ổn định của lá chắn năng lượng vốn có nhiệm vụ bảo vệ con tàu."
 tech_cloaking_2:0 "Trường Tàng Hình Tiên Tiến"
 tech_cloaking_2_desc:0 "Những tiến bộ trong công nghệ chế tác thấu kính pha lê hiếm có thể cải thiện đáng kể hiệu suất tàng hình."
 tech_cloaking_3:0 "Trường Tàng Hình Tinh Nhuệ"
 tech_cloaking_3_desc:0 "Công nghệ tàng hình điển hình trước đây thường gây ra hư hỏng nghiêm trọng cho các thiết bị tương đối tinh vi trên tàu. Nhưng sự xuất hiện của trường tàng hình tinh nhuệ đã biến nỗi lo lắng này thành dĩ vãng."
 tech_cloaking_dark_matter:0 "Trường Tàng Hình Vật Chất Tối"
 tech_cloaking_dark_matter_desc:0 "Thiết bị này sử dụng vật chất tối để bóp méo không thời gian xung quanh con tàu, khiến nó cực kỳ khó bị phát hiện."
 tech_cloaking_psi:0 "Máy Phát Trường Pha Tâm Linh"
 tech_cloaking_psi_desc:0 "Máy phát trường pha tâm linh có thể tập trung tiềm năng tâm linh của phi hành đoàn, qua đó đưa một phần con tàu lặn vào Cõi Màn Sương. Điều này sẽ khiến con tàu chỉ có thể bị phát hiện bởi những mảng cảm biến tối tân nhất, mặc dù trong hoàn cảnh đó, tốt nhất là không nên nhắc đến những gì phi hành đoàn buộc phải đối mặt."
 tech_detection_array:0 "Mảng Phát Hiện"
 tech_detection_array_desc:0 "$sm_detection_array_desc$"
 tech_dark_matter_detection:0 "Phát Hiện Vật Chất Tối"
 tech_dark_matter_detection_desc:0 "Buồng cộng hưởng vật chất tối có thể cải thiện đáng kể hiệu suất của mảng phát hiện của chúng ta."
 tech_assisted_detection:0 "Thuật Toán Phát Hiện Tiên Tiến"
 tech_assisted_detection_desc:0 "Việc kết hợp mảng phát hiện với máy tính trên tàu khoa học có thể nâng cao đáng kể độ phân giải quét."
 feature_assist_cloaking_detection_unlocked:0 "$ASSIST_CLOAKING_DETECTION_ORDER$"
 feature_assist_cloaking_detection_unlocked_desc:0 "$ASSIST_CLOAKING_DETECTION_ORDER_DESC$"
 feature_active_reconnaissance_unlocked:0 "$ACTIVE_RECONNAISSANCE_ORDER$"
 feature_active_reconnaissance_unlocked_desc:0 "$ACTIVE_RECONNAISSANCE_ORDER_TECH_DESC$"

