 # Insight Technologies

 tech_unusual_senses:0 "Cảm Biến Dị Thường"
 tech_unusual_senses_desc:0 "Không có gì sáng tạo hơn sự tiến hóa tự nhiên. Bằng cách nghiên cứu cách mà các xã hội văn minh Tiền-FTL nhìn nhận thế giới của họ, chúng ta đã thiết kế ra những phương pháp mới để phát hiện những con tàu không mời mà đến."
 tech_unusual_senses_effect:1 "§HTrạm Lắng Nghe§! sẽ cung cấp §G+1§! Cường độ Phát hiện và Phạm vi Phát hiện cho mỗi §Y3§! §H$sm_detection_array_plural$§!"
 sm_listening_post_unusual_senses_desc:0 "Mỗi §Y3§! §H$sm_detection_array_plural$§! cung cấp:\n$t$Cường độ Phát hiện: §G+1§!\n$t$Phạm vi Phát hiện: §G+1§!"
 tech_new_numbers:0 "Những Con Số Mới"
 tech_new_numbers_desc:0 "Thông qua việc nghiên cứu một vài nền văn minh Tiền-FTL, chúng ta nhận ra rằng còn có rất nhiều cách để đo lường vũ trụ. Điều này thậm chí có thể đưa những con số mới vào hệ thống toán học của chúng ta."
 tech_trinary_computing:0 "Công Nghệ Điện Toán Tam Phân"
 tech_trinary_computing_desc:0 "Các xã hội khác nhau đã phát triển những giải pháp khác nhau để thích nghi với logic và công nghệ máy tính của họ. Cách tư duy của những người ngoài hành tinh này có thể giúp chúng ta dễ dàng thích ứng với cấu trúc xã hội của các đế chế ngoại lai hơn."

 tech_atmospheric_orbital_mechanics:0 "Cơ Học Quỹ Đạo Khí Quyển"
 tech_atmospheric_orbital_mechanics_desc:0 "Nhờ vào kinh nghiệm vận hành quy mô lớn các trạm quan sát quanh các hành tinh Tiền-FTL, chúng ta đã phát hiện ra một số không gian có thể tối ưu hóa. Bằng cách mở rộng những sự tối ưu hóa này ra phạm vi toàn quốc gia, chúng ta có thể cắt giảm triệt để chi phí bảo trì cần thiết cho các trạm không gian."
 mod_stations_upkeep_mult:0 "Chi Phí Bảo Trì Trạm Không Gian"

 tech_predatory_tactics:0 "Chiến Thuật Thú Săn Mồi"
 tech_predatory_tactics_desc:0 "Giống như cách những nền văn minh Tiền-FTL thông minh vận động để che giấu lẫn nhau khi đối mặt với kẻ thù, các phi công của chúng ta có thể học cách bay nhanh hơn mà không làm nhiễu trường tàng hình."
 tech_predatory_tactics_effect:0 "Giảm tốc độ bay dưới ánh sáng do tàng hình gây ra: §G-50%§!"
 very_low_cloaking_predator:0 "$tech_predatory_tactics$"
 low_cloaking_predator:0 "$tech_predatory_tactics$"
 medium_cloaking_predator:0 "$tech_predatory_tactics$"
 high_cloaking_predator:0 "$tech_predatory_tactics$"
 very_high_cloaking_predator:0 "$tech_predatory_tactics$"
 exceptional_cloaking_predator:0 "$tech_predatory_tactics$"

 tech_satisfying_insults:0 "Kỹ Năng Lăng Mạ Thỏa Mãn"
 tech_satisfying_insults_desc:0 "Không có gì mạnh mẽ hơn một lời lăng mạ đúng chỗ đúng lúc, giờ đây chúng ta đã biết cách dùng nhiều ngôn ngữ khác nhau để chửi rủa tổ tiên của một giống loài khác."
 tech_satisfying_insults_effect:0 "Mỗi §Ynăm năm§! nhận được lợi ích từ việc làm nhục một đế chế khác."
 satisfying_insult_cooldown:1 "\n\nChúng ta sẽ không được hưởng những lợi ích từ việc §HLàm Nhục Thỏa Mãn§! cho đến khi hiệu ứng hiện tại hết hạn."
 gain_satisfying_insult_recently:0 "\n\nChúng ta sẽ nhận được hiệu ứng §HLàm Nhục Thỏa Mãn§!, kéo dài trong 5 năm, đồng thời nhận được §G50§! £influence£ Sức ảnh hưởng."
 MESSAGE_SATISFYING_INSULTS_TITLE:0 "Kỹ Năng Lăng Mạ Thỏa Mãn Đã Khả Dụng"
 MESSAGE_SATISFYING_INSULTS:0 "[Root.GetLinguists] của chúng ta đã hoàn thiện một kỹ năng lăng mạ thỏa mãn mới. Giờ đây, việc chúng ta cần làm chỉ là tìm một mục tiêu để sử dụng nó."
 satisfying_insult_recently:0 "Kỹ Năng Lăng Mạ Thỏa Mãn"
 satisfying_insult_recently_desc:0 "Thật đúng là miệng lưỡi dẻo quẹo!"

 tech_compact_living:0 "Sống Trong Không Gian Hẹp"
 tech_compact_living_desc:0 "Mặc dù chưa có nền văn minh nào tìm ra giải pháp hoàn hảo cho những thách thức ngày càng lớn trong việc quản lý một quốc gia đang trên đà phát triển, nhưng chúng ta đã tìm ra được những giải pháp một phần. Sau khi nghiên cứu một vài giống loài và chính phủ của họ, chúng ta đã phát hiện ra sự cân bằng tuyệt vời giữa tính linh hoạt và tính năng."

 tech_alien_topography:0 "Địa Hình Học Dị Hành Tinh"
 tech_alien_topography_desc:0 "Các nền văn minh thường phát triển mạnh mẽ ở những vị trí có thể thúc đẩy sự tăng trưởng của họ, thông qua việc phân tích các địa điểm định cư và phát triển chính yếu của nền văn minh tiền vũ trụ, các thuộc địa của chúng ta có thể học hỏi được rất nhiều điều."

 tech_xeno_aesthetics:0 "Mỹ Học Dị Tinh"
 tech_xeno_aesthetics_desc:0 "Sau khi phân tích vô số nghệ sĩ đến từ những nền văn hóa hoàn toàn khác biệt, chúng ta đã đúc kết được một lý thuyết mang tính phổ quát. Thông qua việc nghiên cứu nghệ thuật và văn hóa của một nền văn minh, chúng ta có thể chiếm ưu thế trong các trận chiến chống lại họ."

 tech_lost_building_methods:0 "Phương Pháp Xây Dựng Bị Thất Truyền"
 tech_lost_building_methods_desc:0 "Bất kỳ nền văn minh nào có bề dày lịch sử đủ dài đều sở hữu những kỳ quan được xây dựng bởi các nền văn minh cổ đại đã chìm vào quên lãng, những kỳ quan này đã không thể được tái hiện lại nữa. Thật may mắn, chúng ta sở hữu kho lưu trữ về những vương quốc cổ đại từng xuất hiện trên những thế giới Tiền-FTL này."

 tech_supreme_alloy:0 "Hợp Kim Tối Thượng"
 tech_supreme_alloy_desc:0 "Hợp kim mà chúng ta từng cho là tốt nhất, hóa ra lại kém xa sự thật. Nhờ phân loại quy trình tinh luyện của vô số nền văn minh Tiền-FTL, giờ đây chúng ta đã có thể tổng hợp được một loại kim loại vô song."

 tech_ordered_retreat:0 "Rút Lui Có Trật Tự"
 tech_ordered_retreat_desc:0 "Mặc dù nghiên cứu những kẻ chiến thắng trong các trận chiến có lẽ là cách rõ ràng nhất để đúc kết kinh nghiệm, nhưng việc quan sát những kẻ thua cuộc trong nền văn minh Tiền-FTL cũng đã dạy cho chúng ta cách tổ chức rút lui sao cho hiệu quả hơn."

 tech_temple_of_transportation:0 "Đền Thờ Giao Thông"
 tech_temple_of_transportation_desc:0 "Mạng lưới giao thông kết nối con người lại với nhau: đây là một cảm nhận chung mà chúng ta quan sát được từ rất nhiều nền văn minh. Mặc dù chúng ta không còn sử dụng động cơ hơi nước nữa, nhưng mạng lưới chuyển tiếp siêu không gian của chúng ta cũng đóng vai trò tương tự."

 SENSOR_DEVICE_VALUE:0 "Cảm Biến Căn Cứ Không Gian: §G+$VALUE|0$§!"
 HYPERLANE_DETECTION_RANGE_DESC:0 "§E§H$HYPERLANE_RANGE$§! là khoảng cách tối đa có thể phát hiện tuyến đường siêu không gian tính từ căn cứ không gian này.§!"
 SENSOR_RANGE_DESC:0 "§E§H$SENSOR_RANGE$§! là khoảng cách tối đa mà cảm biến của căn cứ không gian này có thể phát huy tác dụng.§!"

 MESSAGE_FLEET_FORCED_TO_DECLOAK_MESSAGE_TYPE_TITLE: "Buộc Phải Hủy Tàng Hình"
 MESSAGE_FLEET_FORCED_TO_DECLOAK: "Hệ thống phát hiện trong hệ sao $SYSTEM|H$ đã buộc $FLEET$ phải hủy tàng hình!"

 GO_TO_preFTL_PLANET:0 "Đến Hành Tinh"
 GO_TO_preFTL_PLANET_tt:0 "Nhấp để đi đến hành tinh Tiền-FTL."
 GO_TO_OBSERVATION_POST:0 "Đến Trạm Quan Sát"
 GO_TO_OBSERVATION_POST_tt:0 "Nhấp để đi đến trạm quan sát xoay quanh hành tinh Tiền-FTL này."

 CLOAKING_DETECTION_TITLE:0 "Phát Hiện Tàng Hình"
 CLOAKING_DETECTION_SENSOR_tt:0 "Hệ sao này nằm trong phạm vi phát hiện của một căn cứ không gian được trang bị mảng phát hiện. Các hạm đội tàng hình có cường độ tàng hình thấp sẽ bị phát hiện."
 CLOAKING_DETECTION_DECLOAK_tt:0 "Hạm đội của bạn sẽ bị phát hiện và buộc phải hủy tàng hình trong hệ sao này."
