 CLOAKING_PENALTY_MODS:0 "§Y$MOD_SHIP_SPEED_MULT$§! và §Y$MOD_SHIP_WINDUP_MULT$§!"
 CLOAKING_EXCEPTIONAL_DESC:0 "\nHạm đội này có khả năng tạo ra một trường tàng hình cực kỳ ổn định, không bị hạn chế bởi bất kỳ $CLOAKING_PENALTY_MODS$ nào."
 CLOAKING_EXCEPTIONAL_CAN_BE_IMPROVED:0 "\n\nTiếp tục cải tiến có thể giúp hạm đội né tránh được sự phát hiện của các mảng phát hiện ngày càng tiên tiến hơn."
 CLOAKING_STRENGTH_UNKNOWN:0 "§gKhông Rõ§!"
 CLOAKING_STRENGTH_0:0 "§gKhông Có§!"
 CLOAKING_STRENGTH_1:0 "§YCực Thấp§!"
 CLOAKING_STRENGTH_2:0 "§YThấp§!"
 CLOAKING_STRENGTH_3:0 "§YTrung Bình§!"
 CLOAKING_STRENGTH_4:0 "§YCao§!"
 CLOAKING_STRENGTH_5:0 "§YCực Cao§!"
 CLOAKING_STRENGTH_6:0 "§MTối Thượng (Cấp 1)§!"
 CLOAKING_STRENGTH_7:0 "§MTối Thượng (Cấp 2)§!"
 CLOAKING_STRENGTH_8:0 "§MTối Thượng (Cấp 3)§!"
 CLOAKING_STRENGTH_9:0 "§MTối Thượng (Cấp 4)§!"
 CLOAKING_STRENGTH_10:0 "§MTối Thượng (Cấp 5)§!"
 CLOAKING_STRENGTH_UNKNOWN_DESC:0 "Bạn có quá ít thông tin tình báo để có thể phán đoán khả năng của trường tàng hình của hạm đội này."
 CLOAKING_STRENGTH_UNKNOWN_STARBASE_DESC:0 "Tin tức tình báo quá ít, không thể xác định sức mạnh trường tàng hình của trạm không gian này."
 CLOAKING_STRENGTH_0_DESC:0 "\nHạm đội này không thể tạo ra trường tàng hình."
 CLOAKING_STRENGTH_1_DESC:0 "\nHạm đội này có thể tạo ra một trường tàng hình cực kỳ không ổn định, chịu sự hạn chế rất lớn của $CLOAKING_PENALTY_MODS$."
 CLOAKING_STRENGTH_2_DESC:0 "\nHạm đội này có thể tạo ra một trường tàng hình không ổn định, chịu sự hạn chế rất lớn của $CLOAKING_PENALTY_MODS$."
 CLOAKING_STRENGTH_3_DESC:0 "\nHạm đội này có thể tạo ra một trường tàng hình cơ bản ổn định, chịu sự hạn chế đôi chút của $CLOAKING_PENALTY_MODS$."
 CLOAKING_STRENGTH_4_DESC:0 "\nHạm đội này có thể tạo ra một trường tàng hình khá ổn định, chịu sự hạn chế nhỏ của $CLOAKING_PENALTY_MODS$."
 CLOAKING_STRENGTH_5_DESC:0 "\nHạm đội này có thể tạo ra một trường tàng hình cực kỳ ổn định, chịu sự hạn chế đáng kể của $CLOAKING_PENALTY_MODS$."
 CLOAKING_STRENGTH_6_DESC:0 "$CLOAKING_EXCEPTIONAL_DESC$ $CLOAKING_EXCEPTIONAL_CAN_BE_IMPROVED$"
 CLOAKING_STRENGTH_7_DESC:0 "$CLOAKING_EXCEPTIONAL_DESC$ $CLOAKING_EXCEPTIONAL_CAN_BE_IMPROVED$"
 CLOAKING_STRENGTH_8_DESC:0 "$CLOAKING_EXCEPTIONAL_DESC$ $CLOAKING_EXCEPTIONAL_CAN_BE_IMPROVED$"
 CLOAKING_STRENGTH_9_DESC:0 "$CLOAKING_EXCEPTIONAL_DESC$ $CLOAKING_EXCEPTIONAL_CAN_BE_IMPROVED$"
 CLOAKING_STRENGTH_10_DESC:0 "$CLOAKING_EXCEPTIONAL_DESC$"

 STARBASE_CLOAKING_STRENGTH_DESC: "§E§HSức mạnh tàng hình§! là thước đo độ vững vàng của trường tàng hình do trạm không gian này tạo ra. Càng vững vàng, đối phương càng cần những dàn cảm biến tân tiến hơn mới có thể phát hiện ra trạm.§!"
 CLOAKING_EXCEPTIONAL_STARBASE_DESC: "\nTrạm không gian này có thể tạo ra một trường tàng hình biến chuyển liên tục, khiến các dàn cảm biến thông thường hoàn toàn không thể phát hiện ra."
 CLOAKING_EXCEPTIONAL_STARBASE_CAN_BE_IMPROVED: "Cải tiến thêm sẽ giúp trạm né tránh được sự dò quét từ những dàn cảm biến ngày càng tối tân hơn."
 CLOAKING_STRENGTH_0_STARBASE_DESC: "\nTrạm không gian này không thể tạo ra trường tàng hình."
 CLOAKING_STRENGTH_1_STARBASE_DESC: "\nTrạm không gian này có thể tạo ra một trường tàng hình chập chờn, chỉ vừa đủ để qua mắt những cảm biến thô sơ nhất."
 CLOAKING_STRENGTH_2_STARBASE_DESC: "\nTrạm không gian này có thể tạo ra một trường tàng hình đơn giản, đủ sức né tránh các hệ thống dò tìm cơ bản."
 CLOAKING_STRENGTH_3_STARBASE_DESC: "\nTrạm không gian này có thể tạo ra trường tàng hình ở mức trung bình, đủ để qua mắt các dàn cảm biến tiêu chuẩn."
 CLOAKING_STRENGTH_4_STARBASE_DESC: "\nTrạm này có thể tạo ra trường tàng hình biến đổi linh hoạt, đủ sức né tránh các mạng lưới cảm biến tân tiến."
 CLOAKING_STRENGTH_5_STARBASE_DESC: "\nTrạm không gian này có thể tạo ra một trường tàng hình cực kỳ phức tạp, đánh lừa được gần như mọi hệ thống dò tìm, trừ những thiết bị tối tân nhất."
