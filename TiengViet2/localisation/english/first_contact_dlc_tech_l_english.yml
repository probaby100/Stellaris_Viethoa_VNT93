 CLOAKING_DETECTION_1_DESC:0 "\nTrạm không gian này có thể xuyên thủng các trường tàng hình cực kỳ bất ổn."
 CLOAKING_DETECTION_2_DESC:0 "\nTrạm không gian này có thể xuyên thủng các trường tàng hình bất ổn."
 CLOAKING_DETECTION_3_DESC:0 "\nTrạm không gian này có thể xuyên thủng các trường tàng hình tương đối ổn định."
 CLOAKING_DETECTION_4_DESC:0 "\nTrạm không gian này có thể xuyên thủng các trường tàng hình có độ ổn định cao."
 CLOAKING_DETECTION_5_DESC:0 "\nTrạm không gian này có khả năng xuyên thủng một Trường Tàng Hình cực kỳ ổn định."
