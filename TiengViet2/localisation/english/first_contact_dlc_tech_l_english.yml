# Detection Array
 sm_detection_array:0 "Mảng Phát Hiện"
 sm_detection_array_plural:0 "Các Mảng Phát Hiện"
 sm_detection_array_desc:0 "Một hệ thống cảm biến bên ngoài mạnh mẽ, có khả năng phát hiện các hạm đội tàng hình.\n"

 sm_dark_matter_detector:0 "Buồng Cộng Hưởng Vật Chất Tối"
 sm_dark_matter_detector_desc:0 "Bằng cách kích thích vật chất tối đạt trạng thái cộng hưởng, buồng này có thể tăng cường đáng kể mảng phát hiện của chúng ta.\n"
 sm_dark_matter_detector_desc_modifier:1 "Mỗi §Y3§! §H$sm_detection_array_plural$§! cung cấp:\n$t$Cường độ Phát hiện: §G+1§!"

 sm_dark_matter_listening_post:0 "Trạm Lắng Nghe Vật Chất Tối"
 sm_dark_matter_listening_post_desc:0 "Trạm lắng nghe này có khả năng phát hiện tàng hình đặc biệt, bộ cảm biến mạnh mẽ của nó được tăng cường bởi một buồng cộng hưởng vật chất tối độc lập.\n"

 # Cloaking Strength and Detection Levels
 CLOAKING_STRENGTH:0 "Cường độ Tàng hình"
 CLOAKING_STRENGTH_VALUE:0 "$CLOAKING_STRENGTH$: $VALUE|0$"
 FLEET_CLOAKING_STRENGTH_DESC:0 "§E§HCường độ Tàng hình§! là thước đo đánh giá sự ổn định của trường tàng hình bao phủ mọi con tàu trong hạm đội. Trường tàng hình càng ổn định, hạm đội càng ít phải chịu hình phạt khi tàng hình. Độ ổn định tối đa của trường tàng hình trong hạm đội phụ thuộc vào con tàu có cường độ tàng hình thấp nhất trong hạm đội đó.§!"
 SHIP_CLOAKING_STRENGTH_DESC:0 "$FLEET_CLOAKING_STRENGTH_DESC$"
 CLOAKING_DETECTION:0 "Cường độ Phát hiện"
 CLOAKING_DETECTION_VALUE:0 "$CLOAKING_DETECTION$: $VALUE|0$"
 CLOAKING_DETECTION_DESC:0 "§E§HCường độ Phát hiện§! dùng để đo độ nhạy của mảng phát hiện được trang bị trên căn cứ không gian. Độ nhạy của mảng phát hiện càng cao, nó càng có khả năng xuyên thấu các trường tàng hình mạnh mẽ.§!"
 CLOAKING_DEVICE_VALUE:0 "Máy Phát Trường Tàng Hình: §G+$VALUE|0$§!"
 FLEET_CLOAKING_ACTIVE_EFFECTS:0 "Khi tàng hình, hạm đội này sẽ phải chịu các hình phạt sau:"
 FLEET_CLOAKING_LEVEL_THRESHOLDS:1 "Nâng cao khả năng tàng hình sẽ giảm bớt toàn bộ hình phạt.\nGiảm khả năng tàng hình sẽ làm tăng toàn bộ hình phạt.\n\n$SHIP_SHIELD_REDUCTION_CLOAKING$ sẽ có hiệu lực riêng rẽ đối với từng con tàu, tùy thuộc vào linh kiện máy phát trường tàng hình được trang bị."
 FLEET_VIEW_ACTIVATE_CLOAK:0 "Kích Hoạt Tàng Hình"
 FLEET_VIEW_ACTIVATE_CLOAK_DESC:0 "Hạm đội này §Yđang không tàng hình§!.\nRa lệnh cho hạm đội kích hoạt trạng thái tàng hình, né tránh sự phát hiện của các cảm biến truyền thống. $CLOAKING_COOLDOWN_TOOLTIP$"
 STARBASE_ACTIVATE_CLOAK_DESC: "Trạm không gian này §Ychưa tàng hình§!\nRa lệnh cho trạm kích hoạt tàng hình, né tránh sự dò tìm của các cảm biến thông thường. $CLOAKING_COOLDOWN_TOOLTIP$"
 FLEET_VIEW_DEACTIVATE_CLOAK:0 "Tắt tàng hình"
 FLEET_VIEW_DEACTIVATE_CLOAK_DESC: "Hạm đội này §Yđang tàng hình§!.\nRa lệnh cho hạm đội tắt trạng thái tàng hình, khiến nó có thể bị dò tìm bởi các cảm biến thông thường. $CLOAKING_COOLDOWN_TOOLTIP$"
 STARBASE_DEACTIVATE_CLOAK_DESC: "Trạm không gian này §Yđang tàng hình§!.\nRa lệnh cho trạm tắt trạng thái tàng hình, khiến nó có thể bị dò tìm bởi các cảm biến thông thường. $CLOAKING_COOLDOWN_TOOLTIP$"
 CLICK_TO_DEACTIVATE_CLOAKING: "§GNhấp để tắt tàng hình§!"
 CLICK_TO_ACTIVATE_CLOAKING: "§GNhấp để kích hoạt tàng hình§!"
 FLEET_SHIPS_CANT_CLOAK:0 "§RCác tàu trong hạm đội không thể tàng hình§!"
 STARBASE_CANT_CLOAK: "§RTrạm không gian này không thể tàng hình§!"
 FLEET_SHIPS_CANT_CLOAK_COOLDOWN: "§RMáy tạo trường tàng hình đang nạp năng lượng. Khả năng tàng hình sẽ khả dụng sau §Y$VALUE$§! ngày nữa.§!"
 FLEET_SHIPS_CANT_CLOAK_COMBAT:0 "§RHạm đội đang giao chiến không thể tàng hình§!"
 STARBASE_CANT_CLOAK_COMBAT: "§RTrạm không gian đang giao chiến không thể tàng hình§!"
 FLEET_CLOAKED_ICON:0 "£outliner_fleet_cloaked£"
 CLOAKING_COOLDOWN_TOOLTIP:1 "Sau khi tắt tàng hình, máy phát trường tàng hình cần §Y120§! ngày để có thể kích hoạt trở lại. $CLOAKING_COOLDOWN_MODIFIER$"
