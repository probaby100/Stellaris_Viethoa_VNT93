 CLOAKING_DETECTION_EXCEPTIONAL_DESC:0 "\nKhả năng dò tìm của trạm không gian này có thể xuyên thủng các trường tàng hình cực kỳ ổn định."
 CLOAKING_DETECTION_EXCEPTIONAL_CAN_BE_IMPROVED:0 "\n\nNâng cấp thêm sẽ giúp trạm không gian xuyên thủng những trường tàng hình ngày càng tối tân hơn."
 CLOAKING_DETECTION_UNKNOWN_DESC:0 "Bạn có quá ít tình báo để xác định khả năng dò tìm tàng hình của trạm không gian này."
