l_english:
 observer.15.name:0 "Sự Trở Lại Của Đại Khả Hãn"
 observer.15.desc:0 "Sau khi thất bại trong chiến trận, Đại Khả Hãn đã tập hợp thêm một hạm đội nữa và hiện đang quay trở lại tiền tuyến."
 observer.24.name:0 "Lính Đánh Thuê [marauder_mercenary_country.GetSpeciesName]"
 observer.24.desc:0 "Lính đánh thuê [marauder_mercenary_country.GetSpeciesName] hiện đã sẵn sàng để thuê mướn."
 observer.56.desc:0 "Các nhà khảo cổ học từ §H[From.GetName]§! đã suy luận ra vị trí bí mật của hệ sao quê hương người §HVultaum§!!"
 observer.57.desc:0 "Các nhà khảo cổ học từ §H[From.GetName]§! đã suy luận ra vị trí bí mật của hệ sao quê hương người §HYuht§!!"
 observer.58.desc:0 "Các nhà khảo cổ học từ §H[From.GetName]§! đã suy luận ra vị trí bí mật của hệ sao quê hương §HLiên Minh Thứ Nhất§!!"
 observer.59.desc:0 "Các nhà khảo cổ học từ §H[From.GetName]§! đã suy luận ra vị trí bí mật của hệ sao quê hương người §HIrassian§!!"
 observer.60.desc:0 "Các nhà khảo cổ học từ §H[From.GetName]§! đã suy luận ra vị trí bí mật của hệ sao quê hương người §HCybrex§!!"
 observer.61.desc:0 "Đế chế §H[From.GetName]§! đã thu thập tất cả hiểu biết cần thiết để mở khóa §HMạng Lưới L-Cổng§!! Khi đã nghiên cứu xong công nghệ L-Cổng và hoàn thành dự án đặc biệt để mở L-Cổng trong biên giới của mình, họ sẽ có thể tiếp cận Cụm Sao L."
 observer.63.desc:0 "Đế chế §H[From.GetName]§! đã khôi phục thành công quyền tiếp cận Cụm Sao L! Những sinh vật khổng lồ được gọi là §H$nanite_space_dragon_baby_plural$§! đang xuất hiện từ mọi L-Cổng hiện có, mặc dù chúng dường như chưa có dấu hiệu thù địch."
 observer.66.name:0 "Liên Hiệp Dessanu"
 observer.66.desc:0 "Đế chế §H[From.GetName]§! đã mở khóa thành công Cụm Sao L, nhưng chỉ để phát hiện ra rằng nơi này đã có một nền văn minh tiên tiến sinh sống mang tên §HLiên Hiệp Dessanu§!!"
 observer.68.desc:1 "Những kẻ ngu xuẩn bất cẩn của §H[From.GetName]§! đã can thiệp vào những thế lực vượt quá hiểu biết của mình, giải phóng một Hóa Thân Cõi Tâm Linh đầy thù hận và hùng mạnh trong hệ sao §H[shroud_spawn_system.GetName]§!!"
 observer.70.name:0 "Tín Hiệu Chân Trời"
 observer.70.desc:0 "Các nhà khoa học từ §H[From.Owner.GetName]§! đã bắt được một tín hiệu bí ẩn dường như phát ra từ tâm của một lỗ đen..."
 observer.71.name:0 "Sâu Chờ Đợi"
 observer.71.desc:0 "Sâu Chờ Đợi (Worm-in-Waiting) đã tái tạo hệ sao quê hương của §H[From.Owner.GetName]§! thành một thứ gì đó... khác biệt."
 observer.72.desc:0 "Sâu Chờ Đợi (Worm-in-Waiting) đã hiện hình trong hệ sao quê hương của §H[From.Owner.GetName]§!. Cuộc chiến đã bắt đầu..."

