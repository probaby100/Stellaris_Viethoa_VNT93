 custodian_request_friendly:0 "Nhờ có những người bạn của chúng ta tại $COUNTRY$, chúng ta mới có thể khôi phục lại vinh quang và sự toàn vẹn của Cộng đồng Ngân hà."
 custodian_request_friendly_0:0 "Phiền các bạn hãy giúp chúng tôi nói lý lẽ với những người khác. Là Người Giám Hộ, chúng tôi cần mọi sự trợ giúp có thể."
 custodian_request_friendly_1:0 "Quả thực, nếu không nhờ công lao to lớn của $COUNTRY$, Cộng đồng Ngân hà có lẽ đã sụp đổ từ lâu. Các bạn khiến chúng tôi cảm thấy tự hào khi giữ cương vị Người Giám Hộ."
 custodian_request_neutral:0 "Với tư cách là Người Giám Hộ, chúng tôi tin rằng nghị án này đại diện cho lợi ích tốt nhất của toàn bộ thiên hà."
 custodian_request_neutral_0:0 "Vai trò Người Giám Hộ mang trên mình một trọng trách to lớn, nhưng nếu chúng ta có thể thông qua cuộc cải cách này, thì những nỗ lực của chúng ta sẽ không hề uổng phí."
 custodian_request_neutral_1:0 "Chúng tôi dự định sử dụng tư cách Người Giám Hộ để cải tổ lại Cộng đồng, biến nó trở nên tốt đẹp hơn."
 custodian_request_hostile:0 "Nếu không phải vì có những kẻ phá bĩnh như $COUNTRY$, thì Cộng đồng đã chẳng cần phải thiết lập vị trí Người Giám Hộ làm gì. Bây giờ, hãy làm chút việc có ích và ủng hộ nghị án này đi."
 custodian_request_hostile_0:0 "Là Người Giám Hộ, chúng tôi chiến đấu để bảo vệ Cộng đồng khỏi những thứ cặn bã không gian như các ngươi. Chúng tôi sẽ sử dụng quyền lực của mình để kìm hãm tầm ảnh hưởng của các ngươi từ mọi phía, tránh để Cộng đồng bị các ngươi phá hoại."
 custodian_request_hostile_1:0 "Các ngươi có chắc là muốn duy trì mối quan hệ thù địch với Người Giám Hộ Thiên Hà không? Hãy suy nghĩ cho kỹ, việc phản đối nghị án này liệu có mang lại lợi ích tốt nhất cho các ngươi hay không..."
 emperor_request_friendly:1 "$COUNTRY$ là một trong những chư hầu trung thành nhất của Đế chế, do đó, chúng ta rất mong đợi sự ủng hộ của các ngươi trong vấn đề này."
 emperor_request_friendly_1:1 "Đế chế luôn trông cậy vào một $COUNTRY$ hùng mạnh sẽ đưa ra quyết định đúng đắn, đó là ủng hộ nghị án của chúng ta."
 emperor_request_friendly_2:1 "Đoàn kết một lòng, chúng ta sẽ kiến tạo nên một đế chế ngày càng hùng cường hơn."
 emperor_request_neutral:0 "Đây là thông báo chính thức. Yêu cầu các ngươi hãy thể hiện sự ủng hộ đối với luật pháp của đế chế."
 emperor_request_neutral_0:1 "Nghị án này đóng vai trò then chốt trong việc củng cố thế lực của Đế chế và đập tan những mưu hèn kế bẩn của kẻ thù... dù là kẻ thù bên trong hay bên ngoài."
 emperor_request_neutral_1:1 "Đế chế Ngân hà cần chữ ký của các ngươi."
 emperor_request_hostile:0 "Là một chư hầu của Đế chế, chúng ta yêu cầu các ngươi phải tỏ ra phục tùng trong vấn đề này."
 emperor_request_hostile_0:0 "Các ngươi vì chút lợi lộc cỏn con mà dám làm tổn hại đến uy quyền của chúng ta. Tương lai của $COUNTRY$ sẽ phụ thuộc rất lớn vào những gì các ngươi hành động ngay lúc này và ở đây."
 emperor_request_hostile_1:1 "Ồ. Lại là $COUNTRY$... cái hố xí của Đế chế Ngân hà."
 custodian_warning_friendly:0 "Chúng tôi yêu cầu các bạn hãy cân nhắc lại. Với tư cách là Người Giám Hộ, chúng tôi có thể tác động đến các bạn trên rất nhiều phương diện."
 custodian_warning_friendly_0:0 "Tôi có thể đảm bảo rằng, chúng tôi luôn đặt lợi ích tối cao của $COUNTRY$ ở trong tim! Xin hãy suy nghĩ lại đi."
 custodian_warning_friendly_1:0 "Bạn hiền ơi, chắc chắn là có hiểu lầm gì đó rồi. Chúng tôi đang rất trông chờ vào sự ủng hộ của các bạn đấy!"
 custodian_warning_neutral:0 "Sự phản đối của các vị đang đe dọa làm suy yếu quyền lực của Người Giám Hộ Thiên Hà."
 custodian_warning_neutral_0:0 "Nghị án này có liên quan mật thiết đến tương lai của Cộng đồng Ngân hà. Là Người Giám Hộ, chúng tôi tuyệt đối không dễ dàng đưa ra những phán quyết như thế này đâu!"
 custodian_warning_neutral_1:0 "Nếu không có được sự trợ giúp dù là tối thiểu, chúng tôi không thể nào cải tổ lại Cộng đồng được. Lẽ nào các vị thực sự muốn nhìn thấy thể chế cao quý này sụp đổ, mặc cho Cộng đồng chìm trong mớ hỗn độn và sự thối nát cứ thế dần lan rộng sao?"
 custodian_warning_hostile:0 "Bọn bay đúng là một lũ ngu ngốc khi dám phản đối Người Giám Hộ Thiên Hà."
 custodian_warning_hostile_1:0 "Các ngươi tốt nhất là nên biết thân biết phận, và phải luôn khắc cốt ghi tâm rằng Người Giám Hộ chúng ta nắm trong tay sức mạnh rất lớn... và sức mạnh này hoàn toàn có thể được dùng để giáng xuống đầu các ngươi."
 custodian_warning_hostile_2:0 "Việc bọn bay phản đối ta cũng chẳng có gì đáng ngạc nhiên cả! Suy cho cùng, nếu ta cải tổ lại Cộng đồng và quét sạch mọi sự mục nát, thì những con bọ gậy như bọn bay biết chui lủi vào đâu để trốn đây?"
 emperor_warning_friendly:1 "Cẩn thận cái thái độ đấy. Trước đây, các ngươi vẫn luôn được xem là những thần dân trung thành của Đế chế cơ mà."
 emperor_warning_friendly_0:1 "Các ngươi có chắc là muốn vì chuyện này mà vứt bỏ vị thế được ân sủng trong Đế chế không? Thật sự muốn vậy sao?"
 emperor_warning_friendly_1:0 "Sau khi chúng ta đã ban phát cho các ngươi biết bao nhiêu ân huệ, các ngươi lại chọn đúng thời khắc này để phản trắc sao? Các ngươi điên hết cả rồi à?"
 emperor_warning_neutral:1 "Các quốc gia thành viên của Đế chế Ngân hà có thể được chia thành hai loại: những kẻ đã giành được sự sủng ái của chúng ta... và những kẻ không được sủng ái."
 emperor_warning_neutral_0:1 "Phản đối nghị án này sẽ gây tổn hại đến Đế chế, và nói cách khác, chính là đang làm hại đến $COUNTRY$. Chúng ta vô cùng chắc chắn về điều đó."
 emperor_warning_neutral_1:1 "Nếu Đế chế muốn giành chiến thắng, chúng ta phải đồng tâm hiệp lực và cùng nhìn về một hướng. Xin hãy suy nghĩ cho thật kỹ."
 emperor_warning_hostile:0 "Ngươi dám?"
 emperor_warning_hostile_0:1 "$COUNTRY$ quả thực là một tỉnh lị hèn hạ và đê tiện nhất của Đế chế. Tại sao trong biển sao của chúng ta lại có thể tồn tại một góc xó xỉnh tà ác và lười biếng đến nhường này cơ chứ."
 emperor_warning_hostile_1:1 "Chỉ có những kẻ thù của Đế chế Ngân hà mới đi phản đối nghị án này... mà khoan, có lẽ cách mô tả đó lại vô cùng phù hợp với $COUNTRY$ chăng?"
 custodian_consequence_friendly:0 "Chúng tôi đã hoàn thành được việc này nhờ có sự ủng hộ của các bạn. Nếu không có sự giúp sức hết mình từ những người bạn cũ đắc lực nhất, thì Người Giám Hộ như chúng tôi có thể làm được trò trống gì cơ chứ?"
 custodian_consequence_neutral:0 "Cộng đồng Ngân hà hoàn toàn có thể trở nên tốt đẹp hơn ngày hôm nay rất nhiều. Lẽ nào các vị không nhận ra điều đó sao?"
 custodian_consequence_hostile:0 "Lũ ngốc nghếch. Bất kể có sự trợ giúp của $COUNTRY$ hay không, chúng ta vẫn sẽ tiến hành cải tổ lại Cộng đồng Ngân hà."
 emperor_consequence_friendly:0 "Các ngươi lại đi phản đối nghị án của chúng ta tại Thượng viện, làm vậy thì sao chúng ta có thể tuyên dương $COUNTRY$ như một tấm gương mẫu mực về đức hạnh và lòng trung thành của Đế chế được nữa? Các ngươi làm chúng ta khó xử quá đấy."
 emperor_consequence_neutral:1 "Lên tiếng phản đối nghị án của chúng ta là một sai lầm chí mạng. Đế chế kỳ vọng các ngươi sẽ thể hiện tốt hơn thế."
 emperor_consequence_hostile:1 "Lũ cặn bã bất trung. Những nỗ lực hòng làm suy yếu Đế chế của bọn bay chỉ là phí công vô ích thôi, Đế chế sẽ trường tồn mãi mãi."
 custodian_appreciation_friendly:0 "Chúng tôi biết ngay là có thể trông cậy vào sự ủng hộ của $COUNTRY$ mà. Với sự giúp sức của các bạn, Cộng đồng Ngân hà nhất định sẽ được cải tổ và vươn lên một tầm cao mới trong tương lai."
 custodian_appreciation_neutral:0 "Cảm ơn các vị đã ủng hộ những công việc khó khăn của chúng tôi trên cương vị Người Giám Hộ. Vẫn còn rất nhiều nghị án đang chờ được thông qua đấy."
 custodian_appreciation_hostile:0 "Rất mừng vì các vị đã có thể gác lại những tranh chấp song phương để tập trung vào các công việc trọng đại của chúng tôi với tư cách là Người Giám Hộ Thiên Hà."
 emperor_appreciation_friendly:1 "$COUNTRY$ đang đóng một vai trò vô cùng quan trọng trong sự thành công rực rỡ và bền vững của Đế chế. Thật sự xứng đáng với danh hiệu đó!"
 emperor_appreciation_neutral:1 "Đế chế đã ghi nhận sự ủng hộ trung thành tuyệt đối của $COUNTRY$."
 emperor_appreciation_hostile:0 "Gần đây các ngươi đã bày tỏ sự ủng hộ đối với nghị án của chúng ta, đó là một tín hiệu rất tích cực. Lãng tử quay đầu, việc trở lại làm những thần dân trung thành và có nhiều cống hiến cho Đế chế vẫn chưa phải là quá muộn đâu."
