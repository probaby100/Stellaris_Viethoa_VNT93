 STRENGTHEN_EMPIRE_NOT_MEMBER_INSTANT:1 "§HCử đặc phái viên đoàn kết Đế chế§!\n§RBạn cần phải là một thành viên của Đế chế Ngân hà mới có thể cử đặc phái viên§!"
