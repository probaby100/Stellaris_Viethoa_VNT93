 IMPERIAL_AUTHORITY_INSTANT:3 "§HUy quyền Đế chế§! hiện tại là $VAL|2Y$.\nThay đổi mỗi tháng: $MONTHLY_CHANGE|+=$\nĐoàn kết: $SUPPORTERS|G$\nSuy yếu: $DISSENTERS|R$\n\n§HĐặc phái viên được cử đi§!$SUPPORTERS_LIST$\n$DISSENTERS_LIST$"
 IMPERIAL_AUTHORITY_DELAYED:4 "§HUy quyền Đế chế§E thể hiện mức độ kiểm soát của quốc gia lãnh đạo đối với toàn bộ Đế chế Ngân hà. Mỗi tháng, các đặc phái viên được cử đi có thể tăng chỉ số này lên §G+$CHANGE$§! hoặc giảm $NEG_CHANGE|R$ nhân với §Ycấp độ kỹ năng§!. Điều này cũng ảnh hưởng đến đánh giá về quốc gia lãnh đạo đế chế.§!§!\n\n§HNếu dưới §Y50§!:§!\nCác thành viên có thể kích hoạt một cuộc nổi dậy chống lại quốc gia lãnh đạo thông qua một chiến dịch tình báo.\n\n§HNếu trên §Y100§!:§!\nToàn bộ đế chế sẽ sát cánh cùng quốc gia lãnh đạo trong các cuộc chiến phòng thủ chống lại kẻ thù bên ngoài.\n\n§HNếu trên §Y140§!:§!\nCó thể phát động Thập tự chinh Vĩ đại, ép buộc quốc gia mục tiêu sáp nhập vào Đế chế Ngân hà.\n\n§HNếu trên §Y180§!:§!\nCó thể đề xuất nghị án \"Hòa bình dưới thời Đế chế Ngân hà\", nghiêm cấm chiến tranh giữa các chư hầu của đế chế."
 strengthen_imperial_authority:0 "Củng cố Uy quyền Đế chế"
 strengthen_imperial_authority_desc:1 "Cử một đặc phái viên của chúng ta đi đoàn kết Đế chế Ngân hà sẽ làm tăng dần Uy quyền Đế chế.\n\nHọ cũng sẽ gia tăng §HTrọng lượng Ngoại giao§! của chúng ta khi thực hiện nhiệm vụ này!"
 undermine_imperial_authority:0 "Làm suy yếu Uy quyền Đế chế"
 undermine_imperial_authority_desc:1 "Cử một đặc phái viên của chúng ta đi phá hoại Đế chế Ngân hà sẽ làm giảm dần Uy quyền Đế chế.\n\nHọ cũng sẽ gia tăng §HTrọng lượng Ngoại giao§! của chúng ta khi thực hiện nhiệm vụ này!"
