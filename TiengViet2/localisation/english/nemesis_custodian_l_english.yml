 GALACTIC_DEFENSE_FORCE_DESC:0 "§HHạm đội Phòng vệ Ngân hà§! là một lực lượng tác chiến đặc biệt dưới quyền chỉ huy của Người Giám Hộ Thiên Hà. Chúng được tinh chỉnh trong §HTrình thiết kế Tàu Lực lượng Phòng vệ Ngân hà§! và có thể ứng dụng bất kỳ công nghệ nào mà các thành viên Cộng đồng Ngân hà đã nghiên cứu thành công. Hạm đội Phòng vệ Ngân hà không tốn phí bảo trì, nhưng quy mô không được vượt quá §HSức chứa Hải quân của Lực lượng Phòng vệ Ngân hà§!, vốn được điều chỉnh dựa trên các nghị án của Cộng đồng."
 IMPERIAL_ARMADA_DESC:1 "§HHạm đội Đế chế§! là một lực lượng tác chiến đặc biệt dưới quyền chỉ huy trực tiếp của quốc gia lãnh đạo Đế chế Ngân hà. Chúng được tinh chỉnh trong §HTrình thiết kế Tàu Hạm đội Đế chế§! và có thể ứng dụng bất kỳ công nghệ nào mà các thành viên Đế chế Ngân hà đã nghiên cứu thành công. Hạm đội Đế chế không tốn phí bảo trì, nhưng quy mô không được vượt quá §HSức chứa Hải quân của Hạm đội Đế chế§!, vốn được điều chỉnh dựa trên các nghị án của Đế chế Ngân hà."
