 UNDERMINE_EMPIRE_NOT_MEMBER_INSTANT:1 "§HCử đặc phái viên làm suy yếu Đế chế§!\n§RBạn cần phải là một thành viên của Đế chế Ngân hà mới có thể cử đặc phái viên§!"
 STRENGTHEN_UNDERMINE_EMPIRE_DELAYED:1 "§EĐặc phái viên có thể công khai chỉ trích hoặc ủng hộ đế chế và các chính sách của nó tại Thượng viện Đế chế. Hành động này sẽ từ từ làm tăng hoặc giảm §HUy quyền Đế chế§E, và ảnh hưởng đến mối quan hệ với quốc gia lãnh đạo đế chế.§!§!§!"
