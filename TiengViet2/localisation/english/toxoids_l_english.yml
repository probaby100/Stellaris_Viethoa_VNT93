l_english:

 TOXOIDS_TITLE: "Gói Chủng Tộc Sinh Vật Độc Tố (Toxoids)" # Do not translate
 DLC_TOXOIDS_RECOMMENDATION_DESC:1 "Trong §SToxoids§!, hãy khẳng định vị thế của bạn cùng chủng tộc kiên cường, lì lợm nhất lịch sử Stellaris! Khai thác các thế giới độc hại, đánh cược tương lai tinh cầu vì lợi ích trước mắt, và chấp nhận những hy sinh gian khổ cần thiết để sinh tồn giữa một thiên hà đầy hiểm nguy."
 DLC_TOXOIDS_RECOMMENDATION_COSMETICS:1 "Chúng tôi đề xuất Toxoids vì nhận thấy bạn rất yêu thích các gói tùy biến ngoại quan."
 DLC_TOXOIDS_RECOMMENDATION_POST_APOCALYPTIC:1 "Chúng tôi đề xuất Toxoids vì bạn đã chọn một đế chế có chủ đề tận thế."
 DLC_TOXOIDS_RECOMMENDATION_ENVIRONMENTALIST:1 "Chúng tôi đề xuất Toxoids như một giải pháp thay thế cho đế chế bạn đã chọn, dựa trên mối quan hệ giữa đế chế đó với môi trường tự nhiên."
 DLC_TOXOIDS_RECOMMENDATION_WASTEFUL_ADAPTIVE:1 "Chúng tôi đề xuất Toxoids vì chủng tộc của bạn rất phù hợp với chủ đề xả thải và khả năng thích nghi cao."
 DLC_TOXOIDS_RECOMMENDATION_VOID_DWELLERS:1 "Chúng tôi đề xuất Toxoids vì Khởi nguyên $origin_toxic_knights$ mang đến lối chơi mới dựa trên các Trạm Không Gian."

 #Knights of the Toxic God

 origin_toxic_knights:0 "Kỵ Sĩ Thần Độc"
 origin_toxic_knights_desc:2 "Nhiều thế kỷ trước, quê nhà của chủng tộc này đã bị một Thực Thể Độc Tố viếng thăm. Thảm họa sinh thái giáng xuống sau đó đã hủy diệt phân nửa thế giới, nhưng cũng giúp những người sống sót sớm thống nhất lại trong lòng sùng kính dành cho Thần Độc. Một Kỵ Sĩ Đoàn đã được thành lập để truy tìm Thần Độc, và dẫu vạn vật đã đổi thay, đại thí luyện tìm kiếm vẫn tiếp diễn."
