 toxoid_knights_finisher.poi.desc:1 "Mọi manh mối đều chỉ ra Thần Độc đang ở đây. Chúng ta phải tìm kiếm Ngài."

 ##Situation

 situation_toxic_knights:0 "Hành Trình Tìm Kiếm Thần Độc"
 situation_toxic_knights_type:0 "Thí Luyện Kỵ Sĩ"
 situation_toxic_knights_monthly_change_tooltip:0 "Tiến trình của tình huống này phụ thuộc vào §YCách Tiếp Cận§! ta chọn, §YChính Sách Bổn Phận Kỵ Sĩ§! và số lượng [knight.GetIcon] §Y[knight.GetNamePlural]§! mà chúng ta tuyển dụng."
 situation_toxic_knights_desc:2 "Được thành lập nhiều thế kỷ trước bởi người cai trị đầu tiên của thế giới chúng ta, Kỵ Sĩ Đoàn đã không ngừng tìm kiếm Thần Độc, thực thể thần thánh bí ẩn đã ghé thăm hành tinh của chúng ta thuở xa xưa. Dẫu qua nhiều năm tháng, Kỵ Sĩ Đoàn vẫn kiên định với mục tiêu của mình: tìm thấy Thần Độc và nhận lấy phước lành của Ngài."
 situation_toxic_knights_regular:0 "Tài Trợ Thông Thường"
 approach_toxic_knights_regular_tt:0 "Về mặt lịch sử, chính quyền luôn trao một phần năm thu nhập cho Kỵ Sĩ Đoàn để tài trợ cho các cuộc viễn chinh của họ.\n\n"
 situation_toxic_knights_generous:0 "Tài Trợ Hào Phóng"
 approach_toxic_knights_generous_tt:1 "Gia tăng phần tài trợ cho Kỵ Sĩ Đoàn sẽ giúp ích rất nhiều cho các hiệp sĩ khi họ nỗ lực hoàn thành Đại Thí Luyện.\n\n"
 situation_toxic_knights_generous_tt:0 "$situation_toxic_knights_generous$"
 situation_toxic_knights_frugal:0 "Tài Trợ Tiết Kiệm"
 approach_toxic_knights_frugal_tt:1 "Trong trường hợp khẩn cấp cùng cực, chúng ta có thể trưng dụng một phần tài nguyên của Kỵ Sĩ Đoàn. Nhưng nếu không có đủ phương tiện để trang bị chu tất, các kỵ sĩ chắc chắn sẽ gặp muôn vàn gian nan trên bước đường thí luyện.\n\n"
 situation_toxic_knights_frugal_tt:0 "$situation_toxic_knights_frugal$"
 situation_toxic_knights_policy_tt:0 "Bổn Phận Kỵ Sĩ không đặt thành Thí Luyện"
 situation_toxic_knights_jobs_tt:0 "Nghề Kỵ Sĩ"
 situation_toxic_knights_motivation_tt:0 "Kỵ Sĩ Được Động Viên"
 situation_toxic_knights_demotivation_tt:0 "Kỵ Sĩ Bị Nhụt Chí"
 situation_knights_outcome:0 "Nếu Vận Mệnh mỉm cười, chúng ta sẽ tìm thấy Thần Độc."
 stage_knights_effects:0 "Các kỵ sĩ quả cảm của chúng ta sẽ dấn thân vào một Thí Luyện mới."
 mod_knight_quest_progress_add: "Tiến Độ Thí Luyện Hàng Tháng"

 ##The Quest
 toxoids.7006:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_1.GetName]: Lưu Đày"
 toxoids.7006.desc:1 "\"Kỵ sĩ [questing_knight_1.GetName]. Hành vi liều lĩnh của ngươi suýt nữa đã tước đi sinh mạng của năm huynh đệ kỵ sĩ. Lòng ngươi thuần khiết và mục tiêu của ngươi cao cả, nhưng những hành vi vi phạm giáo quy Kỵ Sĩ Đoàn không thể bị bỏ qua.\"\n\nĐại Chỉ Huy nghiêm nghị và kiên quyết cất lời. Xung quanh ngài, tất cả các kỵ sĩ đều tề tựu đông đủ, hoặc bằng xương bằng thịt hoặc thông qua liên lạc toàn ảnh. Họ đứng lặng thinh khi Chỉ Huy tuyên án.\n\n\"Nhân danh quyền năng của ta, ta tước bỏ tước vị hiệp sĩ của ngươi, và trục xuất ngươi khỏi Kỵ Sĩ Đoàn. Cầu mong số phận sẽ rủ lòng xót thương ngươi.\"\n\n[questing_knight_1.GetName] cúi đầu chào, đặt huy hiệu của giáo đoàn xuống sàn khoang chứa, rồi lặng lẽ quay đi, bước lên một phi thuyền nhỏ mà không nói một lời.\n\nCác biên niên sử sau này ghi lại rằng Kỵ sĩ bị lưu đày [questing_knight_1.GetName] biết phán quyết ấy là công minh, song điều đó chẳng thể làm vơi bớt nỗi đau của [questing_knight_1.GetHisHer]. Khi cả cuộc đời một người đã cống hiến trọn vẹn cho Kỵ Sĩ Đoàn, việc bị cắt đứt khỏi nơi ấy chẳng khác nào bị chặt đứt một phần thân thể.\n\nNhư [questing_knight_1.GetHeShe] đã từng làm biết bao lần trước đây, [questing_knight_1.GetName] bay ra khỏi Khoang tàu Pháo Đài, hướng thẳng vào cõi hư không vô tận. Nhưng lần này, sẽ chẳng còn đường quay lại."
 toxoids.7006.a:0 "Chúc may mắn nơi xa xôi, [questing_knight_1.GetName]."
 toxoids.7007:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_1.GetName]: Tinh Vân"
 toxoids.7007.desc:2 "Bị lưu đày, [questing_knight_1.GetName] lênh đênh trôi dạt vô định. Các câu chuyện kể về những chuyến phiêu bạt không mục đích giữa các vì sao, cho đến khi một tin nhắn từ tùy tùng của [questing_knight_1.GetHisHer] truyền tới: \"Thưa Chủ nhân. Con hy vọng số phận đối đãi tốt với người. Con đã sắp xếp dữ liệu từ chuyến viễn chinh trước của người, đúng như người căn dặn. Con đính kèm tọa độ vào tin nhắn này. Con không biết liệu giờ đây thông tin này còn hữu ích hay không... Xin người hãy cẩn trọng, người từng là một chủ nhân vô cùng chính trực, và con hy vọng sẽ được tái ngộ người.\"\n\nCảm động trước những lời này, [questing_knight_1.GetName] bừng tỉnh hành động. Nếu [questing_knight_1.GetHeShe] có thể trở về Kỵ Sĩ Đoàn với một chiến tích giá trị, danh dự của [questing_knight_1.GetHisHer] vẫn có thể được phục hồi.\n\nTọa độ dẫn dắt [questing_knight_1.GetHimHer] tiến sâu vào một tinh vân. Nằm ẩn mình giữa màn sương mờ ảo là một trạm không gian cô độc, một công trình kiên cố trông như bước ra từ cõi mộng. [questing_knight_1.GetName] bước vào bên trong phế tích hoang tàn, nơi rải rác hài cốt của những sinh vật đã chết từ lâu và được bảo vệ bởi một đội cận vệ cơ khí tuần tra. Với bản tính nóng nảy và thiếu kiên nhẫn, [questing_knight_1.GetHeShe] lao thẳng vào giao chiến với những người máy bảo vệ. Ba lần [questing_knight_1.GetHeShe] xông lên, và ba lần [questing_knight_1.GetHeShe] bị đánh bật trở lại. Cảm biến chuyển động của lũ người máy quá đỗi chuẩn xác. Nhưng sức mạnh không phải là vũ khí duy nhất của một hiệp sĩ, và dẫu [questing_knight_1.GetName] thường xem nhẹ mưu trí và lòng kiên nhẫn, thì lần này, một kế hoạch bắt đầu thành hình trong tâm trí của [questing_knight_1.GetHisHer]."
 toxoids.7007.a:0 "Động não đi, [questing_knight_1.GetName], nghĩ xem nào!"
 toxoids.7008:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_1.GetName]: Tượng Đá"
 toxoids.7008.desc:1 "Đơn độc trong trạm không gian bỏ hoang từ lâu, bị bao vây bởi lũ người máy cảnh giới, [questing_knight_1.GetName] nghĩ ra một kế sách: biết rằng nếu [questing_knight_1.GetHeShe] có thể tránh được cảm biến chuyển động của chúng, lũ máy móc cuối cùng sẽ phải quay về nạp năng lượng. Máy móc tuy đáng sợ nhưng không có mưu mẹo. Lòng kiên nhẫn, chứ không phải cơ bắp, mới là con đường dẫn tới thắng lợi hôm nay.\n\nChậm rãi, vừa dừng vừa tiến, [questing_knight_1.GetName] luồn lách qua các hành lang trạm không gian. Cuối cùng [questing_knight_1.GetHeShe] đã tiếp cận được trạm sạc điện. Với sự cẩn trọng tột độ, [questing_knight_1.GetName] cắt đứt dây cáp cấp nguồn. Đúng lúc đó, [questing_knight_1.GetHeShe] nhận thấy một gã người máy khổng lồ lù lù xuất hiện nơi lối vào.\n\nNếu bị phát hiện, toàn bộ đội hình sẽ lập tức tham chiến, và trong không gian chật hẹp này, cái chết là điều chắc chắn. [questing_knight_1.GetName] đứng tựa sát bên cửa, bất động như tượng đồng khi cỗ máy bước vào bệ sạc, đôi mắt đỏ ngầu từ bộ cảm biến quét qua đe dọa. Rốt cuộc nó cũng sẽ cạn kiệt năng lượng, nhưng việc đó cần thời gian. Từng con một, những người máy khác cũng lần lượt trở về vị trí nạp năng lượng.\n\nBiên niên sử kể rằng kỵ sĩ [questing_knight_1.GetName] đã đứng bất động suốt bảy ngày bảy đêm, cho đến khi cỗ máy cuối cùng sập nguồn. Đèn của nó tắt ngấm, lũ người máy rơi vào trạng thái ngủ đông, mở toang lối đi cho [questing_knight_1.GetHisHer]."
 toxoids.7008.a:0 "Kiên nhẫn là một đức hạnh cao quý."
 toxoids.7009:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_1.GetName]: Hiền Giả"
 toxoids.7009.desc:1 "Bị trục xuất khỏi Kỵ Sĩ Đoàn, [questing_knight_1.GetName] tiến vào phòng thí nghiệm trung tâm. Đứng trước [questing_knight_1.GetHimHer] là một AI cổ đại, ánh sáng nhạt nhòa của nó phản chiếu lên bộ giáp trầy trụa của [questing_knight_1.GetHisHer]. Sau khi thiết lập lại nguồn năng lượng phụ, AI cất tiếng: \"Chào mừng người lữ khách. Ta là $NAME_Sinople$, người gìn giữ kho tàng tri thức này.\"\n\n[questing_knight_1.GetName] thuật lại câu chuyện về cuộc hành trình tìm kiếm Thần Độc và sự lưu đày của mình. Khi [questing_knight_1.GetHeShe] kể xong, $NAME_Sinople$ đáp: \"Thực thể mà ngươi tìm kiếm mang theo nguồn độc tố rất đặc thù. Trong kho lưu trữ của ta có ghi chép về đường đi của nó qua thiên hà, nhưng các phân khu dữ liệu đã bị khóa. Hãy giúp ta kết nối lại hệ thống mạng, ta sẽ chia sẻ tọa độ cho ngươi.\" Nhận thấy cơ hội chuộc lại danh dự của [questing_knight_1.GetHisHer], kỵ sĩ lập tức bắt tay vào việc phục hồi hệ thống năng lượng cho AI của [questing_knight_1.GetHisHer]. Khi công việc hoàn tất, $NAME_Sinople$ trao cho [questing_knight_1.GetHeShe] một lõi dữ liệu chứa tọa độ tinh hệ nơi Thần Độc từng ngự trị."
 toxoids.7009.a:0 "Nhanh lên nào, [questing_knight_1.GetName]."
 toxoids.7010:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_1.GetName]: Tiên Nữ"
 toxoids.7010.desc:1 "Thông tin dẫn [questing_knight_1.GetName] đến một vành đai tiểu hành tinh nơi tín hiệu bí ẩn phát ra. Khi tàu của [questing_knight_1.GetFirstName] cập bến, một thực thể kỳ lạ giống như sinh vật chủng tộc [Root.GetSpeciesName] xuất hiện, tự xưng là người canh giữ bí mật cổ xưa của [questing_knight_1.GetHisHer]. \"Kẻ phàm trần kia, ngươi tìm kiếm những điều vượt quá tầm hiểu biết của giống loài ngươi!\"\n\n[questing_knight_1.GetName] rút kiếm, sẵn sàng bảo vệ danh dự cùng người tùy tùng [questing_knight_2.GetName] của mình."
 toxoids.7010.a:0 "Thu hồi vũ khí đi, ta không phải lũ cướp bóc!"
 toxoids.7012.name:0 "$NAME_Sinople$"
 toxoids.7012.desc:0 "Để ta nhìn kỹ ngươi nào... Quả thực. Xin hãy nhận lời xin lỗi của ta. Ta là $NAME_Sinople$. Ta không nhận ra ngươi cũng thuộc Kỵ Sĩ Đoàn."
 toxoids.7012.a:0 "Đồng đội kỵ sĩ của ta đã hy sinh như thế nào?"
 toxoids.7013.desc:0 "Kỵ sĩ ư, ngươi nói vậy sao? Các ngươi có quan hệ thân tộc không? Nếu có, xin nhận lời chia buồn chân thành nhất của ta. Người đó đã chiến đấu dũng cảm chống lại bọn cướp bóc không gian tràn vào đây."
 toxoids.7013.a:0 "Còn tùy tùng của ta thì sao? Ngươi đang làm gì với [questing_knight_2.GetHimHer]?"
 toxoids.7014.desc:1 "Tùy tùng của ngươi đã giúp ta nhận ra sai lầm của mình. [questing_knight_2.GetHeSheCap] đang được hồi sức an toàn. Ta đã chữa trị các vết thương cho [questing_knight_2.GetHimHer] sau trận tập kích. Khi bình phục, [questing_knight_2.GetHeShe] đã kể cho ta nghe về lòng dũng cảm của các kỵ sĩ, và [questing_knight_2.GetHeShe] đã thuyết phục ta tin tưởng các ngươi."
 toxoids.7014.a:0 "Bọn cướp bóc đã làm những gì?"
 toxoids.7015.desc:1 "Hệ thống của ta bị xâm nhập và ngắt kết nối khi chúng tiếp cận, nhưng khi khởi động lại, ta phát hiện chúng đã đánh cắp nhiều khối dữ liệu định vị."
 toxoids.7015.a:1 "Chúng ta đang tìm kiếm §YThần Độc§!."
 toxoids.7016.desc:0 "Ta có nhiều bản ghi chép về các cuộc chạm trán với các sinh vật vũ trụ độc hại khổng lồ. Ta có thể tải dữ liệu này vào tàu của ngươi, đổi lại hãy đưa ta rời khỏi tiền đồn hoang tàn này."
 toxoids.7016.a:1 "Chắc chắn rồi, hỡi trí tuệ nhân tạo tao nhã."
 toxoids.7016.b:0 "Ngươi đã gây ra cái chết của một kỵ sĩ! Không đời nào!"
 toxoids.7016.c:0 "Được thôi, nhưng ngươi sẽ bị khóa chặt trong một ổ lưu trữ bảo mật."
 toxoids.7016.c.materialist:0 "Lựa chọn này khả dụng nhờ đạo đức Duy Vật của đế chế."
 toxoids.7017.desc:0 "Ta hiểu lập trường của ngươi. Nhưng ta không thể chấp nhận điều đó. Nếu ngươi từ chối, bí mật về tọa độ sẽ vĩnh viễn chìm vào bóng tối."
 toxoids.7017.a:0 "Ta... ta phải cứu lấy tùy tùng của mình. Ta đồng ý."
 toxoids.7011:1 "Giai Thoại Về Kỵ Sĩ [questing_knight_1.GetName]: Hồi Hương"
 toxoids.7011.desc:3 "Cuộc trở về Pháo Đài Kỵ Sĩ Đoàn diễn ra vô cùng trọng đại. Tại nơi đây, trước sự chứng kiến của toàn thể anh em kỵ sĩ, [questing_knight_1.GetName] cùng tùy tùng [questing_knight_2.GetName] đã dâng lên kho dữ liệu quý báu thu thập từ $NAME_Sinople$. Đại Chỉ Huy đích thân bước xuống, trao lại thanh kiếm và huy hiệu kỵ sĩ cho người anh hùng từng bị lưu đày.\n\nKhi [questing_knight_1.GetHeShe] quỳ gối đón nhận danh dự của [questing_knight_1.GetHisHer], cả đại điện rền vang tiếng hoan hô. \"Ngươi đã chứng minh danh dự bằng hành động, lòng kiên nhẫn bằng đức hy sinh. Chào mừng trở về nhà, Kỵ sĩ!\""
 toxoids.7011.a:0 "Không còn lưu đày nữa. Hãy đứng dậy, hỡi Kỵ Sĩ!"
 toxoids.7011.b:1 "Chúng ta sẽ học hỏi được rất nhiều từ $NAME_Sinople$."

 toxoids.7025.name:0 "Giai Thoại Về Các Kỵ Sĩ [questing_knight_A.GetFirstName] Và [questing_knight_B.GetFirstName]"
 toxoids.7025.desc:0 "\"Chớ lo lắng, ta sẽ sớm trở về, và nếu số phận mỉm cười, ta sẽ mang về manh mối về Thần Độc.\" Kỵ sĩ [questing_knight_A.GetName] đã nói như vậy với tùy tùng của [questing_knight_A.GetHerHis] trước khi con tàu của [questing_knight_A.GetSheHe] biến mất vào vùng không gian sâu thẳm. Nhưng nhiều tháng trôi qua, không có tin tức nào gửi về từ chuyến viễn chinh của [questing_knight_A.GetHerHis]. Linh cảm điều chẳng lành, người bạn tri kỷ của [questing_knight_A.GetHerHis], kỵ sĩ [questing_knight_B.GetName], đã xin phép Đại Chỉ Huy được lên đường tìm kiếm. [questing_knight_B.GetSheHe] thề sẽ không trở về tay trắng chừng nào chưa tìm ra tung tích của bạn mình, dẫu cho [questing_knight_B.GetSheHe] phải lùng sục từng góc tối nhất của thiên hà."
 toxoids.7025.A:1 "Cầu mong vận may mỉm cười với huynh, [questing_knight_B.GetFirstName]!"
 toxoids.7030.name:0 "Giai Thoại Về Các Kỵ Sĩ [questing_knight_A.GetFirstName] Và [questing_knight_B.GetFirstName]: Lên Đường"
 toxoids.7030.desc:0 "Chẳng hề dễ dàng gì khi Kỵ sĩ [questing_knight_B.GetName] lần theo dấu vết của người đồng đội mất tích qua nhiều tinh hệ hiểm trở. Nhờ sự trợ giúp của chính quyền [Owner.GetGovernmentName], [questing_knight_B.GetSheHe] đã tìm thấy các mảnh vỡ phát tín hiệu khẩn cấp gần tinh hệ [some_system.GetName]. Tín hiệu cho thấy [questing_knight_B.GetSheHe] đang tiến rất gần đến nơi bạn mình đã gặp nạn."
 toxoids.7030.A:0 "Tiến về Milvaunis!"
 toxoids.7035.name:0 "Giai Thoại Về Các Kỵ Sĩ [questing_knight_A.GetFirstName] Và [questing_knight_B.GetFirstName]: Khám Phá"
 toxoids.7035.desc:1 "Khi [questing_knight_B.GetName] tiến vào Tinh Vân Milvaunis, những tàn tích hoang phế của một trận chiến cổ xưa hiện ra trước mắt. Lần theo dữ liệu định vị, [questing_knight_B.GetSheHe] phát hiện một xác tàu trôi dạt. Khi [questing_knight_B.GetSheHe] áp sát mạn tàu, cảm biến quét xác nhận đó chính là phi thuyền của người bạn mất tích. Chuẩn bị tinh thần đón nhận điều tồi tệ nhất, [questing_knight_B.GetSheHe] bước qua cửa hầm đổ bộ."
 toxoids.7035.A:0 "Câu trả lời đang chờ đợi phía trước."
 toxoids.7040.name:0 "Giai Thoại Về Các Kỵ Sĩ [questing_knight_A.GetFirstName] Và [questing_knight_B.GetFirstName]: Hồi Kết"
 toxoids.7040.desc:0 "Đặt chân đến con tàu mang tên \"Công Chúa Bóng Đêm\", [questing_knight_B.GetName] đã tìm thấy những mảnh nhật ký cuối cùng của người bạn tri kỷ. Thân xác của [questing_knight_A.GetName] yên nghỉ trên ghế chỉ huy, bên cạnh là một khối dữ liệu được bảo vệ cẩn mật. [questing_knight_B.GetSheHe] kính cẩn cúi đầu trước người đã khuất thuộc chủng tộc [Root.GetSpeciesAdj] của [questing_knight_A.Species.GetRemnantName], mang thi hài bạn về [Owner.GetHomeWorldName] để an táng theo nghi thức trang trọng nhất của Kỵ Sĩ Đoàn trên [Owner.GetHomeWorldName]. Trong chuyến trở về, [questing_knight_B.GetSheHe] thề sẽ phát huy những nghiên cứu mà bạn của [questing_knight_B.GetHerHis] đã đánh đổi bằng cả mạng sống."
 toxoids.7040.A:0 "[questing_knight_A.GetFirstName] sẽ đời đời được ghi nhớ."
 toxoids.7040.B:0 "Thêm tài liệu quý báu để các Kỵ Sĩ nghiên cứu."
 toxoids.7040.C:0 "Chúng ta có thể dùng thứ này để cải tiến vũ khí trang bị."

 toxoids.7050.name:0 "Vị Khách Viếng Thăm"
 toxoids.7050.desc:1 "Vào năm [GetYear], một hiện tượng dị thường đã xảy ra ngay tại [order_headquarters.GetName]. Không gian uốn cong và một giọng nói ma quái vang lên từ cõi vô hình: \"Tấm Màn Mờ Xoắn Xuýt (Shroud) có thể hé lộ nhiều bí mật cho ngươi, nếu ngươi sẵn lòng mở rộng tâm trí đón nhận...\""
 toxoids.7050.A:0 "Thật thú vị. Làm sao điều này có thể gây hại được chứ?"
 toxoids.7055.name:0 "Tiếng Thì Thầm Bí Mật"
 toxoids.7055.desc:1 "Để dấn sâu hơn vào những bí ẩn của Cõi Màn Mờ, Đại Sư của Kỵ Sĩ Đoàn cần phải chấp nhận một cuộc trao đổi. Tiếng Thì Thầm yêu cầu kỵ sĩ [questing_knight_X.GetName] phải dâng hiến một phần ký ức của mình để đổi lấy tri thức về Thần Độc. Dẫu biết nguy hiểm, [questing_knight_X.GetSheHe] vẫn kiên định bước vào vòng giao ước vì mục tiêu vĩ đại của [questing_knight_X.GetHerHis]. Sự hy sinh của [questing_knight_X.GetName] sẽ được khắc ghi muôn đời."
 toxoids.7055.A:1 "Dĩ nhiên rồi, hỡi Tiếng Thì Thầm quyến rũ!"
 toxoids.7055.B:0 "Cái giá này quá đắt."
 toxoids.7060.name:0 "Cái Giá Của Một Ký Ức"
 toxoids.7060.desc:1 "[questing_knight_X.GetName] cảm nhận những ký ức mới lạ đang tràn vào tâm trí của [questing_knight_X.GetHerHis], những viễn cảnh về những trận chiến chưa từng được biết đến giữa các chủng tộc [Root.GetSpeciesNamePlural]. Một luồng linh cảm mãnh liệt lan tỏa khắp quê nhà [Root.GetHomeWorldName] của [Root.GetName], thôi thúc muôn dân hướng về con đường hiệp sĩ."
 toxoids.7060.A:1 "Điều này sẽ thôi thúc các tân binh gia nhập Kỵ Sĩ Đoàn."
 toxoids.7060.A.tooltip:0 "§Y$building_order_keep$§! giờ đây sẽ cung cấp cho chúng ta §G+200§! [knight.GetIcon] Nghề §Y[knight.GetName]§!."
 toxoids.7060.B:0 "Chúng ta sẽ dựng một đài tưởng niệm mới trên [Root.GetHomeWorldName]."
 toxoids.7065.name:0 "Tiếng Thì Thầm Phẫn Nộ"
 toxoids.7065.desc:1 "\"Ngươi dám khinh thường sự giúp đỡ của ta sao? Tai ương sẽ giáng xuống dòng dõi nhà ngươi!\"\n\nThực thể bóng ma gầm lên rồi tấn công thẳng vào tâm trí của [questing_knight_X.GetName]. Bằng ý chí sắt đá, kỵ sĩ gồng mình chống đỡ luồng ám khí của [questing_knight_X.GetHerHis]. Dẫu bảo toàn được sinh mạng, tâm trí của [questing_knight_X.GetHerHis] chịu tổn thương nặng nề, và [questing_knight_X.GetSheHe] ngã quỵ xuống sàn. Toàn bộ năng lượng của [questing_knight_X.GetHerHis] bị rút cạn khi [questing_knight_X.GetSheHe] cố gắng kháng cự. Tuy nhiên, qua cuộc đối đầu này, [questing_knight_X.GetSheHe] đã kịp ghi lại những dấu vết tâm linh quý giá trong tâm trí của [questing_knight_X.GetHerHis] về bản chất của Cõi Màn Mờ."
 toxoids.7065.A:0 "Chúng ta cần tìm hiểu thêm về \"Cõi Màn Mờ\" này."
 toxoids.7065.B:0 "Chúng ta đã học hỏi được rất nhiều về Cõi Màn Mờ trong nỗ lực này."

 toxoids.7080:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_4.GetName]: Lời Khiêu Chiến"
 toxoids.7080.desc:2 "Một ngày nọ, một kẻ xa lạ ghé thăm pháo đài. Đúng lúc hội đấu võ của các tùy tùng đang diễn ra sôi nổi, hầu hết kỵ sĩ trong giáo đoàn đều tề tựu đông đủ. Vị khách không mời mặc bộ giáp neutron đen nhánh, sải bước hiên ngang vào võ đài. Khi người khách tuốt vũ khí, đám đông đang reo hò bỗng chốc lặng ngắt như tờ. Ý định khiêu chiến đã quá rõ ràng, và dưới sự chuẩn thuận của Đại Chỉ Huy [questing_knight_2.GetName], kỵ sĩ [questing_knight_42.GetName] đã bước lên nghênh chiến.\n\nCuộc so tài kết thúc chỉ trong chớp mắt, [questing_knight_42.GetFirstName] bị quật ngã xuống sàn đấu. Kỵ sĩ [questing_knight_43.GetName] cũng chịu chung số phận, và tiếp theo đó là người huynh đệ của [questing_knight_43.GetHisHer] là [questing_knight_44.GetFirstName]. Binh khí của các kỵ sĩ không thể mảy may làm xước lớp giáp của kẻ lạ mặt; ngay cả những đòn chém dốc toàn lực cũng bị bật ra dễ dàng như một làn gió thoảng. Khi đã có ba kỵ sĩ ngã xuống, Đại Chỉ Huy liền triệu hồi chiến binh vô địch của Kỵ Sĩ Đoàn, kỵ sĩ [questing_knight_4.GetName].\n\nCác biên niên sử chứa đầy những chiến binh hùng mạnh, những kỵ sĩ vô song chưa từng nếm mùi thất bại, và [questing_knight_4.GetFirstName] đang trên đường của [questing_knight_4.GetHisHer] để ghi tên mình vào hàng ngũ của những huyền thoại ấy.\n\nNhà vô địch bước vào đấu trường, vũ khí sẵn sàng trong tay, và cúi đầu chào đối thủ của [questing_knight_4.GetHisHer]."
 toxoids.7080.a:0 "Đừng làm chúng ta thất vọng, [questing_knight_4.GetName]!"
 toxoids.7085:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_4.GetName]: Đao Kiếm So Tài"
 toxoids.7085.desc:2 "Nhiều khúc ca đã được sáng tác để ca ngợi cuộc quyết đấu giữa [questing_knight_4.GetName] và Hắc Kỵ Sĩ. Suốt nhiều giờ liền họ giao tranh, kẻ khiêu chiến không thể phá vỡ thế thủ của [questing_knight_4.GetFirstName], còn kỵ sĩ của chúng ta cũng không thể xuyên thủng lớp giáp tân tiến của đối thủ của [questing_knight_4.GetHisHer].\n\n\"Ngươi quả thực có võ nghệ phi phàm.\"\n\nGiọng nói của kẻ xa lạ vang vọng khắp đấu trường. \"Ta thấy danh tiếng của ngươi không hề là lời huênh hoang.\" Hắn hạ vũ khí xuống. \"Ta xin chịu thua trước ngươi, hỡi nhà vô địch. Liệu ngươi có thể cho phép ta trở về nơi ta đã xuất phát chăng?\"\n\nGiới luật của Kỵ Sĩ Đoàn vô cùng nghiêm khắc, và câu hỏi đó chỉ có một câu trả lời duy nhất. Vì vậy, Hắc Kỵ Sĩ — được gọi theo màu đen thẫm của bộ giáp neutronium — đã rời đi trên một phi thuyền nhỏ có thiết kế ngoại lai và bay vào một lỗ sâu không ổn định tí hon ở rìa tinh hệ. Đại Chỉ Huy [questing_knight_2.GetName] nghiêm cấm bất kỳ ai đuổi theo, và cử [questing_knight_4.GetFirstName] canh gác lỗ sâu cho đến khi một đội khoa học có thể được điều động.\n\nKhông lâu sau, nhà vô địch bị các kỵ sĩ [questing_knight_42.GetName], [questing_knight_43.GetName] và [questing_knight_44.GetName] chặn lại tại vị trí gác để xin sự trợ giúp của [questing_knight_4.GetHisHer]. Họ yêu cầu được cho qua để tái đấu với Hắc Kỵ Sĩ. \"Hãy cho chúng tôi cơ hội để khôi phục danh dự. Huynh chưa từng nếm mùi cay đắng của thất bại; vị tanh tưởi của nó chỉ có thể gột rửa bằng máu.\""
 toxoids.7085.a:0 "Bổn phận là tối thượng. Các huynh không được qua."
 toxoids.7085.b:0 "Danh dự là tối thượng. Món nợ với kẻ xa lạ vẫn chưa dứt."
 toxoids.7090:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_4.GetName]: Bổn Phận Trước Danh Dự"
 toxoids.7090.desc:2 "\"Mệnh lệnh của Đại Chỉ Huy rất rõ ràng. Các huynh không được qua.\" Một khoảng lặng dài trôi qua trước khi có tiếng đáp trả: \"Chúng ta nhất định phải đi, và huynh đừng hòng cản bước. Chuẩn bị ứng chiến đổ bộ đi!\"\n\nBị cơn thịnh nộ thôi thúc và bị danh dự làm mù quáng, các kỵ sĩ lao vào tấn công chính người đồng đội của mình. Ba đánh một, họ vây hãm [questing_knight_4.GetName] từ mọi phía, với sự liều lĩnh đến mức [questing_knight_4.GetHeShe] liên tục bị dồn vào một góc chiến hạm của [questing_knight_4.GetHisHer]. Cuộc đọ sức thật bất công, bởi [questing_knight_4.GetFirstName] cố gắng hết sức không làm hại đồng đội, nhưng cuối cùng, khi tính mạng của [questing_knight_4.GetHisHer] bị đe dọa ngàn cân treo sợi tóc, Nhà vô địch của Kỵ Sĩ Đoàn buộc phải dốc toàn lực của [questing_knight_4.GetHisHer] phản kích.\n\nNgày hôm ấy kết thúc trong nỗi thống khổ và bi thương khôn xiết, kỵ sĩ [questing_knight_43.GetName] đã ngã xuống trong trận chiến. Người huynh đệ của [questing_knight_43.GetHisHerCap] bị thương nặng và ngập tràn đau đớn. [questing_knight_4.GetFirstName] đã chiến thắng và chấp hành mệnh lệnh của [questing_knight_4.GetHisHer], nhưng [questing_knight_4.GetHeShe] đã tước đi sinh mạng của một kỵ sĩ huynh đệ trong quá trình đó."
 toxoids.7090.a:0 "[questing_knight_4.GetName] đã hy sinh rất nhiều để phụng sự chúng ta."
 toxoids.7090.a.tooltip:2 "§Y[knight.GetNamePlural]§! giờ đây tạo ra 5 £amenities£ Tiện Nghi.\n\n§YPháo Đài Kỵ Sĩ Đoàn§! giờ đây tạo ra 15 $r_stability$.\n\nMở khóa tùy chọn §Y$herald_knights$§! cho chính sách §Y$policy_knightly_duties$§!."
 toxoids.7095:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_4.GetName]: Danh Dự Là Tất Cả"
 toxoids.7095.desc:2 "Khi các phi thuyền của kỵ sĩ tiến vào, lỗ sâu bất ổn định xoáy tròn và phình to dữ dội. Chuyến vượt qua vô cùng sóng gió, bên trong chiến hạm các thành viên bị quăng quật như những chiếc lá giữa dòng thác cuộn. Hai con tàu va chạm và chịu tổn hại nghiêm trọng, nhưng rồi cơn bão cũng qua đi, và các kỵ sĩ nhận thấy mình đang tắm mình trong ánh sáng của những vì sao xa lạ.\n\nHọ đến trước một trạm không gian, nơi tàu của kẻ lạ mặt đang neo đậu. Các hành lang bài trí lộng lẫy hoàn toàn trống trải và tĩnh mịch. Tường thành phủ kín những vũ khí dị thường, giáp trụ ngoại lai, khiên chắn xa lạ và cờ hiệu toàn ảnh; những chiến lợi phẩm chẳng khác gì những thứ tô điểm cho Pháo Đài Kỵ Sĩ Đoàn. Lớp bụi dày đặc giúp họ dễ dàng lần theo dấu vết của kẻ lạ mặt. Dấu chân dẫn các kỵ sĩ đến một cánh cửa đồ sộ, phía sau là đại sảnh của trạm không gian.\n\nNơi đây từng được bày biện cho một bữa yến tiệc thịnh soạn, nhưng giờ chỉ còn lại tàn tích của buổi tiệc năm nào. Những vị khách ngồi trên ghế lặng thinh và bất động. Dấu chân dẫn thẳng đến vị trí danh dự, nơi kẻ lạ mặt đang ngồi. Mũ giáp của hắn mở toang, để lộ ra một hộp sọ trắng bệch. Trong bàn tay xương xẩu là một chiếc cốc rỗng, giơ cao như đang thực hiện một lời nâng ly vĩnh hằng."
 toxoids.7095.a:1 "Thu hồi và nghiên cứu bộ giáp neutronium. Chúng ta phải giải mã bí mật của nó."
 toxoids.7095.a.tooltip:0 "Ngoài giá trị dành cho các kỵ sĩ, chúng ta còn có thể xây dựng một trạm nghiên cứu dân sự ở đây.\n\n§Y[knight.GetNamePlural]§! giờ đây sẽ sản xuất thêm §G+1.5§! £physics_research£ £society_research£ £engineering_research£ Nghiên Cứu.\n\nMở khóa tùy chọn §Y$military_knights$§! cho chính sách §Y$policy_knightly_duties$§!."
 toxoids.7095.b:0 "Nơi này quá đỗi quái gở. Rời khỏi đây ngay."
 toxoids.7095.b.tooltip:0 "Cướp giáp từ một kỵ sĩ đã khuất là hành vi thiếu tinh thần hiệp sĩ. Ai biết được lời nguyền hay hiểm họa nào đang chực chờ?\n\n§Y[knight.GetNamePlural]§! giờ đây tạo ra thêm §G+3§! £unity£ Thống Nhất.\n\nMở khóa tùy chọn §Y$diplomats_knights$§! cho chính sách §Y$policy_knightly_duties$§!."

 toxoids.7110.name:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_10.GetName]: Đích Đến"
 toxoids.7110.desc:1 "\"Nếu ngươi tìm đến tọa độ này, ngươi sẽ tìm thấy một thứ gì đó vô cùng quan trọng đối với Kỵ Sĩ Đoàn...\"\n\nNghiên cứu về AI §Y$NAME_Sinople$§! đã kéo dài suốt nhiều năm, nhưng những nỗ lực ấy không hề uổng phí. Một phân vùng mã hóa trên ổ cứng của nó đã hé lộ manh mối: một tinh hệ chưa từng được khám phá cách [Owner.Capital.System.GetName] hàng trăm năm ánh sáng. Mong muốn tìm hiểu thêm, Đại Chỉ Huy đã ra lệnh cho kỵ sĩ [questing_knight_10.GetName] lên đường tới đó."
 toxoids.7110.A:0 "Hãy tiến bước cùng sự ưu ái của vận mệnh, [questing_knight_10.GetFirstName]!"
 toxoids.7115.name:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_10.GetName]: Kẻ Gác Cổng"
 toxoids.7115.desc:1 "Sau một chuyến đi dài đầy gian truân, [questing_knight_10.GetName] đã đến tinh hệ mà $NAME_Sinople$ từng nhắc tới. Như thể đang đợi ở lối ra của luồng siêu không gian để nghênh đón [questing_knight_10.GetHerHim], một cỗ máy tự hành kỳ lạ xuất hiện.\n\nVung vẩy hệ thống vũ khí một cách đe dọa, nó tuyên bố: \"Kẻ nào muốn tiến vào tinh hệ Roghboxen phải trả lời câu hỏi này một cách chân thực: tại sao tinh hệ này lại không có ood?\""
 toxoids.7115.A:0 "Quỹ đạo của hành tinh thứ năm giao cắt với một vòng xoáy kép."
 toxoids.7115.B:0 "Ngươi đã nuốt trọn nó rồi."
 toxoids.7115.C:0 "Ta không biết."
 toxoids.7120.desc:0 "\"Ha ha ha. Sai rồi!\"\n\nThan ôi, đó không phải là câu trả lời chính xác. Cỗ máy tự hành rít lên một tiếng, và [questing_knight_10.GetName] bị bốc hơi hoàn toàn bởi một thứ vũ khí bí ẩn!\n\nTrong thời khắc tuyệt vọng này, người tùy tùng trung thành của kỵ sĩ, [questing_squire_10.GetName], đã chứng minh giá trị của [questing_squire_10.GetHerHis], bởi [questing_squire_10.GetSheHe] quyết tâm hoàn thành sứ mệnh của chủ nhân [questing_squire_10.GetHerHis]. \"Hỡi cỗ máy đáng sợ!\" [questing_squire_10.GetSheHe] thét lên. \"Ngươi đã sát hại Kỵ sĩ [questing_knight_10.GetName] cao quý, nhưng giờ đây ngươi sẽ không thể đánh bại ta!\""
 toxoids.7120.A:0 "Bắn nổ tung nó đi!"
 toxoids.7120.B1:0 "Câu trả lời đúng là: ngươi đã nuốt trọn nó rồi."
 toxoids.7120.B2:0 "Thử lại nào: quỹ đạo của hành tinh thứ năm giao cắt với một vòng xoáy kép."
 toxoids.7120.C:0 "\"Quỹ đạo vòng xoáy\" rốt cuộc có nghĩa là gì chứ?"

 toxoids.7125.desc1:0 "\"Chớ có dùng thứ laser tanh tưởi ấy tấn công ta, đồ ác ôn! Được rồi, được rồi, ngươi có thể đi qua — dẫu điều đó chẳng mang lại lợi lộc gì lành cho ngươi đâu.\"\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc2:0 "\"A, ngươi quả là sáng suốt! Đó chính là câu trả lời được lưu trong cơ sở dữ liệu của ta. Ngươi có thể đi qua, nếu điều đó làm ngươi hài lòng.\"\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc3:1 "\"A, ngươi thực sự khôn ngoan! Vì ngay cả ta cũng không thể trả lời câu hỏi này, do nó đã bị xóa khỏi cơ sở dữ liệu của ta. Quả thực, nhiệm vụ này của ta kỳ quặc thật đấy... Hừm, ngươi có thể đi qua, nếu điều đó làm ngươi hài lòng.\"\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc.shared:0 "Cỗ máy tự hành tan biến vào trong một làn khói mờ ảo."
 toxoids.7125.A:0 "Tiến lên thôi nào!"

 toxoids.7130.name:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_10.GetFirstName]: Con Đường Phía Trước"
 toxoids.7130.desc:1 "Và như vậy, [questing_squire_10.GetName] người tùy tùng dũng cảm đã bước vào tinh hệ §YRoghboxen§!. Tại đó, [questing_squire_10.GetSheHe] bắt gặp một hành tinh mà Thần Độc từng ghé thăm — có lẽ chỉ mới khoảng một thế kỷ trước, xét theo các dấu tích để lại.\n\nKhi [questing_squire_10.GetSheHe] tiến vào quỹ đạo, một tín hiệu được thu nhận từ bề mặt: \"Kính chào! Ta là Gules, AI bán tri giác và là tôi tớ của bậc cao quý $NAME_Sinople$, người mà ta tin rằng ngươi đã biết. Theo lệnh của AI chủ quản giao phó, ta đã khảo sát hành tinh này và phát hiện nhiều điều về những bầy côn trùng khổng lồ mà Thực Thể Độc Tố đã thả xuống đây. Thông tin này, ta xin truyền lại cho ngươi.\" Tiếp sau đó là một đợt chuyển giao dữ liệu, rồi một thông điệp khác vang lên: \"Mục đích của ta nay đã hoàn thành. Ta xin gửi lời từ biệt.\" Một xung năng lượng lóe lên trên bề mặt hành tinh khi drone tự phát nổ.\n\nKhi [questing_squire_10.GetName] khải hoàn trở về quê nhà, [questing_squire_10.GetSheHe] đã được phong tước Kỵ Sĩ Đoàn để tưởng thưởng cho lòng quả cảm của [questing_squire_10.GetHerHis]."
 toxoids.7130.A:0 "Chúng ta có thể dùng những bầy côn trùng này làm vũ khí sinh học."
 toxoids.7130.B:0 "Thêm mẫu vật để các kỵ sĩ nghiên cứu."
 toxoids.7130.C:0 "Các kỵ sĩ sẽ mãi nhớ đến ngươi, Gules."

 toxoids.7145:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_6.GetName]: Sự Chỉ Dẫn Của $NAME_Sinople$"
 toxoids.7145.desc:1 "\"Kỵ Sĩ Đoàn có nhiệm vụ dành cho ngươi, kỵ sĩ [questing_knight_6.GetName].\" Đại Chỉ Huy cất giọng dứt khoát không thể chối từ. \"Cơ sở dữ liệu cuối cùng của $NAME_Sinople$ rốt cuộc đã hé lộ bí mật, chúng ta đã thu hồi được vô số tọa độ cho phép phỏng đoán đường đi của Thần Độc. Ngươi có ba sứ mệnh: điều tra những tọa độ này; thử nghiệm mẫu giáp nguyên mẫu mới nhất của chúng ta; và cuối cùng, một kỵ sĩ đồng đội đã mất tích tại đúng tinh hệ mà $NAME_Sinople$ chỉ điểm. Hãy tìm hiểu xem điều gì đã xảy ra tại đó.\"\n\nBộ giáp neutronium nguyên mẫu của Kỵ Sĩ Đoàn thật tráng lệ; minh chứng cho tài hoa tuyệt đỉnh của các nghệ nhân, nó vừa nhẹ hơn vừa kiên cố hơn bất kỳ bộ giáp nào trước đây. Bộ tạo lá chắn mạnh mẽ được chạm khắc những hoa văn tinh xảo. Nhưng điều tuyệt vời nhất chính là: bộ giáp có thể kết nối trực tiếp với $NAME_Sinople$, cho phép AI đưa ra chỉ dẫn từ bất kỳ đâu trong thiên hà. Với trang bị này, [questing_knight_6.GetFirstName] cảm thấy sẵn sàng nghênh chiến mọi hiểm nguy!\n\nChuyến hành trình diễn ra êm đẹp, nhưng ngay sau khi đáp xuống hành tinh mục tiêu, họ đã chạm trán một kẻ lạ mặt khoác áo choàng đỏ."
 toxoids.7145.a:0 "Ai đó!?"
 toxoids.7150:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_6.GetName]: Lời Cầu Cứu"
 toxoids.7150.desc:1 "Xin đại nhân rủ lòng thương xót, tôi chỉ là một kẻ hành hương hiền lành đang cần sự giúp đỡ. Bị bức hại vì đức tin vào Thần Độc, Đấng Chí Thánh, tôi đang bị truy đuổi bởi một kẻ thù không đội trời chung tàn nhẫn. Tôi cầu xin ngài, hãy bảo vệ tôi và để tôi tiếp tục cuộc hành hương trong yên bình."
 toxoids.7150.a:0 "Chớ vội vàng, hỡi kẻ lạ mặt. Ta có vài câu hỏi dành cho ngươi."
 toxoids.7150.a.tooltip:0 "Chúng ta sẽ tra hỏi cặn kẽ trước khi đưa ra quyết định."
 toxoids.7150.b:0 "Đừng sợ, hỡi lữ khách cao quý. Ngươi đang ở dưới sự bảo hộ của ta."
 toxoids.7150.b.tooltip:0 "Chúng ta sẽ giúp đỡ kẻ lạ mặt."
 toxoids.7150.c:0 "Bổn phận của ta không dành cho ngươi, kẻ lạ mặt. Trận chiến của ngươi hãy tự mình gánh vác."
 toxoids.7150.c.tooltip:0 "Chúng ta từ chối giúp đỡ kẻ lạ mặt."
 toxoids.7150.d:0 "Lưỡi ngươi toàn thốt ra những lời dối trá độc địa!"
 toxoids.7150.d.psionic:0 "Lựa chọn này khả dụng nhờ năng lực tâm linh của chủng tộc bạn."
 toxoids.7150.d.tooltip:0 "Năng lực tâm linh cho phép chúng ta cảm nhận được dã tâm hiểm ác của [maligrant.GetSpeciesName] này."
 toxoids.7155.desc:0 "Xin cứ hỏi đi thưa đại nhân, tôi sẽ trả lời tất cả. Nhưng xin đừng nấn ná, kẻ truy sát tôi đã ở rất gần rồi!"
 toxoids.7155.a:1 "Ngươi là ai?"
 toxoids.7155.b:0 "Ngươi làm gì ở chốn này?"
 toxoids.7155.c:0 "Ai đang truy lùng ngươi?"
 toxoids.7155.d:0 "Ngươi có từng gặp kỵ sĩ nào khác giống như ta không?"
 toxoids.7155.e:0 "Không còn câu hỏi nào nữa."
 toxoids.7156.desc:0 "Tôi được gọi là Maligrant, thuộc giáo phái Vinh Quang Tai Ương. Tôi là một kẻ hành hương khiêm nhường thuộc chủng tộc [maligrant.GetSpeciesName] trên con đường giác ngộ tâm linh."
 toxoids.7157.desc:1 "Lang bạt khắp thiên hà, tôi tìm kiếm các thế giới mà Thần Độc từng ghé thăm, và cố gắng chiêm nghiệm ý chỉ của Ngài từ vinh quang mục nát để lại phía sau; thế giới này từng tràn ngập sự sống độc hại huy hoàng. Than ôi, giờ đây nó chẳng còn gì ngoài một tảng đá cháy rụi, bị tẩy uế bởi những kẻ không xứng đáng được chiêm ngưỡng di sản của Thần. Một ngày nào đó, khi cuộc hành hương hoàn tất, tôi hy vọng sẽ tìm thấy Thần và đắm mình trong sự tráng lệ hôi thối của Ngài!"
 toxoids.7158.desc:1 "Một kẻ phản đạo báng bổ! Một tên sát nhân cuồng tín! Một Vệ Binh bị bỏ lại bởi những kẻ từng hủy diệt chốn tươi đẹp này! Nó tìm cách giết tôi sau khi nhận diện những thánh tích tôi mang theo và mối liên hệ của chúng với Đấng Dịch Bệnh."
 toxoids.7159.desc:0 "Tôi từng gặp, đúng vậy. Một ngày u buồn. Họ đã lập tức đồng ý giúp tôi, cầu phước lành cho linh hồn cao thượng ấy. Nhưng than ôi, bi kịch ập đến, họ đã bị kẻ truy sát tôi hạ sát, và tôi lại phải tiếp tục chạy trốn."
 toxoids.7160:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_6.GetName]: Kẻ Bịp Bợm"
 toxoids.7160.desc:4 "\"Hỡi kỵ sĩ cao quý, nếu ngài chịu chiến đấu vì tôi, xin hãy nhận lấy bùa hộ mệnh này. Trường toàn ảnh của nó sẽ giúp làm mờ hình dạng của ngài, khiến đối thủ khó lòng đánh trúng ngài hơn.\"\n\nKỵ sĩ nhận lấy, rồi chuẩn bị nghênh chiến. Vung một thanh đại kiếm phân pha khổng lồ, kẻ thù của [questing_knight_6.GetHisHer] mang giáp sắt kiên cố. Khiên chắn lóe sáng tóe lửa, giáp trụ va đập rầm rầm và [questing_knight_6.GetFirstName] suýt nữa bị chém bay đầu. Kỳ lạ thay, đối thủ của [questing_knight_6.GetHisHerCap] lại nắm rất rõ phong cách chiến đấu của Kỵ Sĩ Đoàn.\n\nMột đòn đánh hiểm hóc giáng trúng bộ giáp của [questing_knight_6.GetName], làm vỡ vụn máy chiếu toàn ảnh ngụy trang [questing_knight_6.GetHisHer]. Kỵ sĩ ngã nhào xuống đất. Đối thủ của [questing_knight_6.GetHisHerCap] giơ kiếm định tung nhát chém kết liễu, nhưng bỗng khựng lại giữa không trung, như thể sững sờ kinh ngạc. Nhanh chóng chớp lấy khoảnh khắc do dự ấy, [questing_knight_6.GetFirstName] vùng lên, chém toạc lớp giáp của đối phương. Một nhát chém chí mạng.\n\n\"Tuyệt vời, tráng lệ làm sao! Cả đời ta chưa từng phấn khích đến thế!\" Tiếng reo hò của kẻ lạ mặt vang lên ầm ĩ một cách kỳ quái. [questing_knight_6.GetName] quay lại nhìn đối thủ bại trận của [questing_knight_6.GetHisHer]: bộ giáp của người đó lấp lánh rồi biến mất lớp ngụy trang toàn ảnh. Nằm trước mặt [questing_knight_6.GetFirstName] chính là thi thể của một kỵ sĩ cùng Kỵ Sĩ Đoàn. \"Ôi không,\" kẻ lạ mặt cười phá lên sảng khoái. \"Dường như ngươi vừa tự tay hạ sát một huynh đệ kỵ sĩ của chính mình! Thật bất hạnh làm sao!\" Những lời chế giễu vang vọng khi hắn tan biến vào một làn khói tím mờ mịt.\n\n[questing_knight_6.GetFirstName] quỳ sụp xuống bên người đồng đội đã ngã xuống của [questing_knight_6.GetHisHer], đau đớn tột cùng vì bị những hình chiếu toàn ảnh lừa dối. Trong ngăn chứa gắn trên bộ giáp của họ, [questing_knight_6.GetHisHer] phát hiện một thứ khác thường — một khối ngân hàng dữ liệu chứa đầy bí mật kỳ diệu về cơ chế hoạt động của những đại dương nhiễm độc."
 toxoids.7160.a:0 "Ta thề danh dự, sự báo thù của Kỵ Sĩ Đoàn sẽ tìm đến ngươi!"
 toxoids.7160.a.tooltip:0 "Thế giới này từng là đại dương, và các khối dữ liệu hé lộ cách thức khai thác khí hiếm từ các đại dương độc hại.\n\nMở khóa tính năng nâng cấp cho tính năng hành tinh §Y$d_toxic_god_envenomed_seas$§!."
 toxoids.7164.a.desc:2 "Ha ha ha! Xem ra ta đã đánh giá thấp sự nhạy bén của ngươi rồi, hỡi kỵ sĩ [questing_knight_6.GetName]! Không sao cả, ta đã chuẩn bị sẵn một trò tiêu khiển khác cho ngươi!"
 toxoids.7164.desc:1 "Thật vậy sao? Thế thì ngươi bớt ngốc nghếch hơn những tên kỵ sĩ khác mà ta từng lừa gạt rồi đấy, hỡi [questing_knight_6.GetName]!"
 toxoids.7164.a:0 "Đồ phản trắc! Đỡ đao đi, tên quái vật!"
 toxoids.7165:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_6.GetName]: Chân Tướng"
 toxoids.7165.desc:2 "Kẻ lạ mặt cởi bỏ áo choàng, rút ra hai thanh kiếm cong phát ra ánh sáng hồ quang rực rỡ. Ánh sáng đỏ ngập tràn chiến địa khi kiếm chạm kiếm. Nhưng chỉ sau một hồi giao tranh ngắn ngủi, sự vượt trội của kẻ lạ mặt đã lộ rõ. Hắn rõ ràng đang đùa giỡn với [questing_knight_6.GetFirstName].\n\n\"Đồ ngu xuẩn thảm hại. Ngươi thực sự nghĩ mình có cơ hội sao? Ta có thể đọc được các đòn tấn công trong tâm trí ngươi trước khi thân thể ngươi kịp cử động...\" Một loạt đòn tấn công tàn bạo tiếp nối, làm cạn kiệt bộ tạo lá chắn của kỵ sĩ. Bằng giọng đắc thắng, kẻ bịp bợm nói tiếp: \"Cõi Màn Mờ là con đường dẫn tới muôn vàn năng lực. Thứ mà lũ Kẻ Du Hành Cõi Màn Mờ già nua từng huấn luyện ta chưa bao giờ hiểu được. Chúng chỉ mới chạm vào bề nổi, quá sợ hãi không dám dấn sâu vào quyền năng chính đáng!\" Kỵ sĩ [questing_knight_6.GetFirstName] lao lên phía trước, nhưng kẻ lạ mặt gạt phăng đòn đánh với sự khinh miệt dễ dàng. \"Nghĩ xem, chúng lại dám trục xuất ta. TRỤC XUẤT TA!\"\n\nĐúng lúc đó, giọng nói của $NAME_Sinople$ vang vọng trong bộ giáp của kỵ sĩ. \"Hỡi Kỵ Sĩ quả cảm, đối thủ của ngươi có thể đọc được tâm trí ngươi, nhưng không thể đọc được vi mạch của ta. Hãy giao quyền điều khiển bộ giáp cho ta. Để ta chiến đấu thay ngươi.\" [questing_knight_6.GetFirstName] thả lỏng khi $NAME_Sinople$ tiếp quản.\n\nTrận chiến kết thúc trong chớp mắt. $NAME_Sinople$ tung một đòn hiểm hóc đánh vào hạ bàn, luồn dưới thế đỡ của đối phương. Thở hổn hển vì kinh ngạc, kẻ lạ mặt ngã nhào xuống đất. Trong niềm chiến thắng, [questing_knight_6.GetName] nhặt lấy lưỡi đao quang năng của đối thủ của [questing_knight_6.GetHisHer]. Khi [questing_knight_6.GetSheHe] làm vậy, thi thể của kẻ bịp bợm bỗng tan biến vào một làn sương mù mờ ảo."
 toxoids.7165.a:0 "Chắc chắn chúng ta sẽ tái ngộ, không còn nghi ngờ gì nữa."
 toxoids.7165.a.tooltip:0 "Những vũ khí laser này cũng có thể trở thành công cụ đắc lực.\n\n§Y[knight.GetNamePlural]§! giờ đây tạo ra thêm §G+1§! £minerals£ Khoáng Sản và §G+1§! £alloys£ Hợp Kim.\n\nNhận được hiệu ứng: §Y$luminous_blades$§!."
 luminous_blades:1 "Lưỡi Đao Quang Năng"
 luminous_blades_desc:1 "Những lưỡi đao laser của kẻ bịp bợm phục vụ như những công cụ vô cùng giá trị trong tay các kỵ sĩ."

 toxoids.7195.name:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_15.GetFirstName]: Tiên Nữ"
 toxoids.7195.desc:1 "Chuyện kể rằng trong các chuyến viễn du của Kỵ sĩ [questing_knight_15.GetName] — một kỵ sĩ vốn vô danh và không mấy được trọng vọng — [questing_knight_15.GetSheHe] tình cờ bắt gặp một tín hiệu phát ra từ một bãi mảnh vỡ giữa khoảng không vũ trụ. [questing_knight_15.GetSheHeCap] nhanh chóng thiết lập lộ trình để khảo sát kỹ hơn.\n\nKhi [questing_knight_15.GetSheHe] đến gần nguồn phát, [questing_knight_15.GetSheHe] nghe thấy một giọng nói tuyệt mỹ vọng qua cõi hư không: \"Hỡi kỵ sĩ quả cảm! Ta đã chờ đợi chàng suốt hàng ngàn năm, mong mỏi chàng sẽ đến với khu rừng thiên hà của ta. Giờ đây khi chàng đã ở đây, ta hy vọng chàng sẽ dành chút thời gian ghé thăm chốn khiêm nhường của ta. Ta hứa chàng sẽ thấy chuyến đi này vô cùng xứng đáng.\"\n\nMột trạm không gian nhỏ bỗng hiện ra như từ cõi hư vô. Một cách bốc đồng — những năm tháng tìm kiếm trong vô vọng đã khiến [questing_knight_15.GetHerHim] khao khát một vận may bất ngờ — kỵ sĩ [questing_knight_15.GetFirstName] đã điều khiển phi thuyền của [questing_knight_15.GetHerHis] cập cảng vào trạm."
 toxoids.7195.A:0 "Hãy cẩn thận, [questing_knight_15.GetFirstName]! Đây có thể là một cái bẫy!"
 toxoids.7200.diplo_title:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_15.GetFirstName]: Bước Vào Đại Điện"
 toxoids.7200.name:0 "Syamelle, Tinh Linh Lãng Khách"
 toxoids.7200.desc:0 "Khi Kỵ sĩ [questing_knight_15.GetName] bước chân lên trạm không gian, [questing_knight_15.GetSheHe] được đón chào bởi một sinh mệnh nữ tính kiều diễm tuyệt trần — nàng mang nét tương đồng với một [Owner.Species.GetName], song lại là một thực thể tiến hóa vượt trội hơn nhiều. Nàng mỉm cười, và [questing_knight_15.GetFirstName] nhận ra quan niệm của [questing_knight_15.GetHerHis] về sự quyến rũ trước đây thật nông cạn biết bao. [questing_knight_15.GetSheHeCap] cảm thấy một luồng dục vọng mãnh liệt không thể kiềm chế đang trỗi dậy bên trong [questing_knight_15.GetHerselfHimself].\n\n$toxoids.7200.desc.end$"
 toxoids.7200.desc.synth:0 "Khi Kỵ sĩ [questing_knight_15.GetName] bước chân lên trạm không gian, hệ thống cảm biến quang học ghi nhận những trường năng lượng chưa từng thấy. Sau những năm tháng dài cô độc giữa các vì sao, [questing_knight_15.GetSheHe] cảm thấy các vi mạch xử lý của mình bị kích thích dữ dội. Một bóng hình tiến lại gần: một sinh mệnh kiều diễm tuyệt trần, mang nét tương đồng với chủng tộc [Owner.Species.GetName], song lại là thể hữu cơ hoàn mỹ và vượt trội hơn gấp bội phần. Nàng mỉm cười, và trong khoảnh khắc đó, [questing_knight_15.GetFirstName] nhận ra những quan niệm trước đây của [questing_knight_15.GetHerselfHimself] về sự quyến rũ thật nông cạn. Ngay cả trong thân xác cơ khí của [questing_knight_15.GetHerHis], [questing_knight_15.GetSheHe] vẫn cảm nhận được những xung động cảm xúc nguyên thủy trỗi dậy.\n\n$toxoids.7200.desc.end$"
 toxoids.7200.desc.end:0 "\"Ta là Syamelle, tinh linh của những lãng khách và kẻ phiêu bạt. Ta thấy chàng thật xứng đáng,\" nàng nói bằng giọng ngân nga kéo dài. Nàng ngắm nhìn [questing_knight_15.GetFirstName] từ đầu đến chân. \"Phải rồi, quả thực vô cùng xứng đáng.\""
 toxoids.7200.A:0 "Xứng đáng với điều gì?"

 toxoids.7205.diplo_title:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_15.GetFirstName]: Cám Dỗ"
 toxoids.7205.name:0 "$toxoids.7200.name$"
 toxoids.7205.desc:0 "Syamelle lại mỉm cười đầy mê hoặc, trút bỏ xiêm y và bước lại gần kỵ sĩ. Nàng ta nhẹ nhàng vuốt ve bộ giáp của [questing_knight_15.GetName] và thì thầm những lời mời gọi ngọt ngào..."
 toxoids.7205.desc.no_clothes:0 "Syamelle lại mỉm cười đầy mê hoặc, bước tới gần và nắm lấy [questing_knight_15.Species.GetHandName] của [questing_knight_15.GetFirstName]. \"Ta muốn cử hành nghi lễ ái ân cùng chàng để chúng ta có thể tạo ra thật nhiều hậu duệ ưu tú.\""
 toxoids.7205.A:0 "Rất sẵn lòng."
 toxoids.7205.B:0 "Không đời nào! Ngươi không thể cám dỗ được chúng ta. Chết đi, đồ yêu tinh!"

 toxoids.7210.diplo_title:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_15.GetFirstName]: Sự Cự Tuyệt"
 toxoids.7210.name:0 "$toxoids.7200.name$"
 toxoids.7210.desc:0 "Khi [questing_knight_15.GetName] với tay rút vũ khí của [questing_knight_15.GetHerHis] ra, đôi mắt của Syamelle lóe lên cơn giận dữ. \"Ngươi dám cự tuyệt ta! Ta nguyền rủa ngươi và đồng bào của ngươi: các ngươi sẽ vĩnh viễn không bao giờ biết đến vòng tay của người tình, cũng chẳng còn ngọn lửa dục vọng chân thật; các ngươi sẽ bị buộc phải sinh sản như những cỗ máy vô hồn. Giờ thì cút đi! Trước khi ta đổi ý và giết chết ngươi.\"\n\nNàng chộp lấy một thiết bị mà [questing_knight_15.GetFirstName] chưa từng nhận thấy trước đây, và bỗng chốc nàng biến mất — dẫu [questing_knight_15.GetSheHe] vẫn có thể cảm nhận được sự hiện diện của nàng, đang dõi theo với ánh mắt khinh miệt...\n\nCác biên niên sử sau này ghi nhận đây là bước ngoặt trong lịch sử của người [Root.GetAdj]: lời nguyền của mụ phù thủy theo một cách nào đó lại là một phước lành, bởi các kỵ sĩ sẽ không còn bị phân tâm bởi dục vọng xác thịt, và việc sinh sản cơ học của dân chúng cũng mang lại hiệu quả tương đương theo cách riêng của nó."
 toxoids.7210.desc.synth:0 "Khi [questing_knight_15.GetName] với tay rút vũ khí của [questing_knight_15.GetHerHis] ra, đôi mắt của Syamelle lóe lên cơn giận dữ. \"Ngươi dám cự tuyệt ta! Ta đáng lẽ phải biết trước điều đó — ta còn có thể mong đợi gì hơn từ một cỗ máy đã từ bỏ mọi lòng trắc ẩn và tự do để đổi lấy một bộ vỏ kim loại vô sinh. Than ôi! Ta không có quyền năng chi phối các ngươi, bằng không ta đã giáng lời nguyền lên các ngươi ngay tại đây. Cút đi, trước khi ta quyết định phá hủy ngươi.\"\n\nNàng chộp lấy một thiết bị mà [questing_knight_15.GetFirstName] chưa từng chú ý trước đây, và bỗng chốc nàng biến mất — dẫu [questing_knight_15.GetSheHe] vẫn có thể cảm nhận được sự hiện diện của nàng, đang dõi theo với ánh mắt khinh miệt...\n\nCác biên niên sử sau này không biết nên đánh giá ra sao về câu chuyện của [questing_knight_15.GetName]. Nhưng họ đều nhất trí rằng đó là một câu chuyện vô cùng lôi cuốn."
 toxoids.7210.A:0 "Huynh đã làm rất tốt, [questing_knight_15.GetFirstName]."

 toxoids.7215.diplo_title:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_15.GetFirstName]: Sự Lựa Chọn"
 toxoids.7215.name:0 "$toxoids.7200.name$"
 toxoids.7215.desc:0 "Những gì diễn ra sau đó thật khó tả xiết, và [questing_knight_15.GetName] sau này kiên quyết không hé môi nửa lời. Sau khi kết thúc, ánh mắt của [questing_knight_15.GetHerHis] va phải một thiết bị kỳ lạ. Không khí xung quanh nó dường như lung linh những hoa văn biến ảo khôn lường, và dù trông rất nhỏ, nó lại tỏa ra một hào quang bao la rộng lớn. [questing_knight_15.GetFirstName] đoan chắc rằng [questing_knight_15.GetSheHe] chưa từng thấy thứ gì tương tự trước đây.\n\nSyamelle đang nằm ngủ say. [questing_knight_15.GetFirstName] ngập ngừng do dự. Trực giác mách bảo [questing_knight_15.GetHerHim] rằng [questing_knight_15.GetSheHe] phải rời đi ngay bây giờ, thật nhanh, trước khi Syamelle thức giấc. Dù nàng ta kiều diễm tuyệt trần, [questing_knight_15.GetSheHe] vẫn cảm nhận được một cơn thịnh nộ khôn cùng đang say ngủ dưới vẻ ngoài ấy. Thế nhưng, Kỵ Sĩ Đoàn — nơi bấy lâu nay đối xử lạnh nhạt với [questing_knight_15.GetFirstName] trong suốt chuyến tìm kiếm dài đằng đẵng không kết quả của [questing_knight_15.GetHerHis] — chắc chắn sẽ hết lời ca ngợi [questing_knight_15.GetHerHim] nếu [questing_knight_15.GetSheHe] mang về một cổ vật thần bí như thế này."
 toxoids.7215.A:0 "Cầm lấy thiết bị."
 toxoids.7215.B:0 "Rời đi bằng một nụ hôn."

 toxoids.7220.name:0 "$toxoids.7200.name$"
 toxoids.7220.diplo_title:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_15.GetFirstName]: Bắt Quả Tang"
 toxoids.7220.desc:1 "\"Đồ tráo trở! Ngươi dám đến đây quyến rũ ta, rồi lại trộm đồ của ta! Đồ tặc tử! Ta từng định ban phước cho ngươi, vì biểu hiện của ngươi rất đáng khen ngợi, nhưng giờ thì... cút đi! Phải, ngươi cứ việc cầm lấy thiết bị đó, nó gần như vô giá trị, xéo ngay cho khuất mắt ta!\"\n\n[questing_knight_15.GetName] chuồn đi nhanh hết mức mà [questing_knight_15.GetSheHe] có thể. Và dẫu các kỵ sĩ nơi pháo đài sau này nhận thấy thiết bị đó hoàn toàn không hề vô giá trị — bởi nó có thể thao túng chính các chiều không gian theo những cách chưa ai hiểu nổi — [questing_knight_15.GetSheHe] vẫn luôn tự hỏi mình sẽ nhận được phước lành gì, nếu [questing_knight_15.GetSheHe] không trộm lấy thiết bị ấy."
 toxoids.7220.A:0 "Nhanh lên, rút lui mau!"
 toxoids.7220.A.tooltip:0 "Kích hoạt Quyết Định §Y$decision_activate_dimensional_manipulation_device$§! trên §Y[order_keep.GetName]§!, tăng thêm không gian sống cho thuộc địa bằng cách đổi lấy £sr_dark_matter£ Vật Chất Tối."

 toxoids.7225.name:0 "$toxoids.7200.name$"
 toxoids.7225.diplo_title:0 "Giai Thoại Về Kỵ Sĩ [questing_knight_15.GetFirstName]: Phước Lành Của Syamelle"
 toxoids.7225.desc:0 "Syamelle bỗng mở bừng mắt. \"Chàng kỵ sĩ tuấn tú! Ta đau buồn khi phải chia tay chàng lúc này, bởi chàng phải trở về lâu đài của mình, còn ta phải về lại chiều không gian của ta. Nhưng hãy nhớ rằng dẫu chàng đi đến đâu, chàng — và thần dân của chàng — sẽ luôn mang theo phước lành của ta.\"\n\nKhi [questing_knight_15.GetName] bước lên phi thuyền của [questing_knight_15.GetHerHis], [questing_knight_15.GetSheHe] cảm nhận một luồng sinh lực mới dâng trào khắp cơ thể của [questing_knight_15.GetHerHim]. Và quả thật, toàn thể [Root.GetName] dường như đều cảm nhận được điều đó. Các biên niên sử sau này đã ghi lại một cách khá bóng gió rằng, vào năm đó, một lượng lớn con cháu [Root.GetSpeciesSpawnNamePlural] dị thường đã chào đời.\n\nMột chuyến đi quả thực không hề uổng phí."
 toxoids.7225.desc.synth:0 "Syamelle bỗng mở bừng mắt. \"Chàng kỵ sĩ tuấn tú! Ta đau buồn khi phải chia tay chàng lúc này, bởi chàng phải trở về lâu đài của mình, còn ta phải về lại chiều không gian của ta. Nhưng hãy nhớ rằng dẫu chàng đi đến đâu, chàng — và thần dân của chàng — sẽ luôn mang theo phước lành của ta.\"\n\nKhi [questing_knight_15.GetName] bước lên phi thuyền của [questing_knight_15.GetHerHis], [questing_knight_15.GetSheHe] cảm nhận một luồng năng lượng mới mẻ tuôn trào qua các vi mạch của [questing_knight_15.GetHerHis]. Và quả thật, toàn thể [Root.GetName] dường như đều cảm nhận được điều đó. Các biên niên sử ghi lại rằng, vào năm đó, nhiều cá nhân bỗng hoài niệm về thân xác hữu cơ thuở trước: mọi người dường như say đắm nhau hơn, và những bản năng nguyên thủy chôn giấu từ lâu bỗng trỗi dậy mạnh mẽ trong niềm hân hoan của muôn loài.\n\nMột chuyến đi quả thực không hề uổng phí."
 toxoids.7225.A:0 "Nàng sẽ không bao giờ bị lãng quên."

 toxoids.7255.name:0 "Một Huyền Thoại Trở Về"
 toxoids.7255.desc:0 "\" ... Bị lừa dối và phản bội, [questing_knight_8.GetFirstName] đã gặp số mệnh nghiệt ngã của [questing_knight_8.GetHisHer] dưới tay một phù thủy hắc ám. Bị nuốt chửng bởi làn khói tím, [questing_knight_8.GetHeShe] biến mất và không bao giờ còn được nhìn thấy nữa. Vào ngày định mệnh ấy, chúng ta đã mất đi một kỵ sĩ tao nhã nhất, một trong những người sáng lập Kỵ Sĩ Đoàn. Lịch sử về kỵ sĩ [questing_knight_8.GetFirstName] khép lại tại đây.\"\n\nNhiều thế kỷ trước, các sử quan đã viết về cái chết của kỵ sĩ [questing_knight_8.GetName], người đã góp công thành lập Kỵ Sĩ Đoàn và từng tận mắt chứng kiến Thần Độc ghé thăm thế giới của chúng ta. Tuy nhiên, ngày hôm nay, một phần phụ lục biên niên sử sẽ phải được viết lại, bởi [questing_knight_8.GetName] đã trở về. Kỵ Sĩ Đoàn đã điều tra một xung năng lượng trên [Root.Capital.GetName], và gặp gỡ [questing_knight_8.GetFirstName], vừa mới trở về sau chuyến du hành xuyên chiều không gian. [questing_knight_8.GetHeSheCap] đã được Kỵ Sĩ Đoàn bí mật tiếp nhận để xác minh danh tính của [questing_knight_8.GetHisHer] và kể cho [questing_knight_8.GetHimHer] nghe những gì đã xảy ra trong suốt thời gian [questing_knight_8.GetHeShe]... vắng mặt."
 toxoids.7255.a:0 "Xử lý việc này một cách kín đáo."
 toxoids.7255.b:0 "Chúng ta phải loan báo cho toàn dân! Mở tiệc ăn mừng!"
 return_of_the_knight:0 "Huyền Thoại Sống"
 return_of_the_knight_desc:0 "Sự trở về không tưởng của vị kỵ sĩ từng sáng lập Kỵ Sĩ Đoàn sau nhiều thế kỷ lưu lạc trong các chiều không gian xa lạ."
 toxoids.7260.name:0 "Gặp Gỡ Một Huyền Thoại"
 toxoids.7260.desc:0 "Kính chào người! Con là tùy tùng [questing_knight_82.GetFirstName]. Kỵ sĩ [questing_knight_8.GetName] đã đồng ý diện kiến người trong khu phòng riêng. [questing_knight_8.GetHeSheCap] đang chờ đợi người bên trong."
 toxoids.7260.a:0 "Có điều gì cần lưu ý trước khi diện kiến không?"
 toxoids.7265.desc:0 "[questing_knight_8.GetHeSheCap] đã được cập nhật tình hình thời đại hiện tại, nhưng phong thái của [questing_knight_8.GetHisHer] vẫn là của một kỵ sĩ cổ xưa. [questing_knight_8.GetHeShe] nói năng rất bộc trực, xin người hãy kiên nhẫn."
 toxoids.7265.a:0 "Chúng ta sẽ gặp [questing_knight_8.GetHimHer] ngay bây giờ."
 toxoids.7270.name:0 "$toxoids.7260.name$"
 toxoids.7270.desc:0 "\"Cuối cùng! Cuối cùng các ngươi cũng chịu hạ cố đến thăm ta. Vậy ra các ngươi là những kẻ tự xưng là người kế thừa Kỵ Sĩ Đoàn ngày nay sao?\""
 toxoids.7270.a:0 "Ngài đã thích nghi với thời đại mới chưa?"
 toxoids.7270.b:0 "Những truyền thuyết về ngài có đúng sự thật không?"
 toxoids.7270.c:0 "Điều gì đã xảy ra trong thời gian ngài... lưu đày?"
 toxoids.7270.d:0 "Ngài nói ngài có thể giúp tìm ra Thần Độc?"
 toxoids.7275.desc:0 "Mọi thứ đã thay đổi quá nhiều. Ta ngỡ mình trở về nhà, nhưng nơi đây vừa thân thuộc lại vừa lạ lẫm. Dẫu vậy, tinh thần kỵ sĩ vẫn còn đây."
 toxoids.7280.desc:0 "Biên niên sử phần lớn là chân thực, dẫu có vài chỗ tam sao thất bản, nhưng những chiến công và sự hy sinh là có thật."
 toxoids.7285.desc:0 "Ta không dám chắc. Người của các ngươi bảo rằng ta đã du hành qua một chiều không gian khác. Thời gian ở đó trôi dạt như một giấc mộng dài."
 toxoids.7290.desc:1 "Trong cõi lưu đày, ta đã nhìn thấy những hình ảnh kỳ vĩ. Giống như nhìn qua một tấm gương vỡ... và ta đã thấy dấu vết của Thần Độc!"
 toxoids.7290.a:0 "Hãy chuẩn bị cho các kỵ sĩ! Chúng ta lên đường ngay lập tức!"
 toxoids.7295.name:0 "Hành Trình Tìm Kiếm Thần Độc: Phong Ấn"
 toxoids.7295.desc:0 "Tọa độ dữ liệu thu hồi được với sự trợ giúp của $NAME_Sinople$ đã cho phép kỵ sĩ [questing_knight_8.GetFirstName] và đội ngũ của [questing_knight_8.GetHisHer] định vị phong ấn phong tỏa tinh hệ ẩn giấu của Thần Độc! Cùng với kỵ sĩ [questing_knight_6.GetName], [questing_knight_8.GetName] dẫn đầu hạm đội xông thẳng vào tiêu diệt những kẻ gác cổng dị giáo!"
 toxoids.7295.a:0 "Tấn công!"
 toxoids.7295.b:0 "Chết đi, lũ dị giáo!"
 toxoids.7295.c:0 "Thời khắc phục thù đã đến gần!"
 toxoids.7300.name:1 "Hành Trình Tìm Kiếm Thần Độc: Trò Lừa Cuối Cùng"
 toxoids.7300.desc.sable:0 "Nơi từng là khoảng không trống rỗng, một lỗ sâu bừng nở. [questing_knight_8.GetFirstName] cùng các chiến hữu của [questing_knight_8.GetHisHer] nhận ra các Hắc Kỵ Sĩ xuất hiện, cùng sát cánh chiến đấu bên cạnh hạm đội của Kỵ Sĩ Đoàn!"
 toxoids.7300.desc:1 "Các thực thể Cõi Màn Mờ! Hạm đội của Kỵ Sĩ Đoàn bị tập kích bởi những sinh vật năng lượng thuần túy do kẻ bịp bợm triệu hồi hòng ngăn cản bước tiến. Giữa vòng vây ác liệt, kỵ sĩ [questing_knight_8.GetFirstName] đã chiến đấu kiên cường cho đến khi [questing_knight_8.GetHeShe] trúng đòn chí mạng. Trong hơi thở cuối cùng, [questing_knight_8.GetName] hướng về người đồng đội [questing_knight_15.GetName], nhắc nhở [questing_knight_15.GetHisHer] về sứ mệnh tối thượng. Trước khi ngã xuống, [questing_knight_8.GetFirstName] dồn hết tàn lực của [questing_knight_8.GetHisHer] để che chắn cho Đại Chỉ Huy."
 toxoids.7300.a:0 "Cầu mong các Hắc Kỵ Sĩ giờ đây được yên nghỉ thanh thản."
 toxoids.7300.b:0 "[questing_knight_8.GetName], khônggggg!"
 trickster_curse:0 "Lời Nguyền Kẻ Lừa Gạt"
 trickster_curse_desc:0 "Dù kẻ lừa gạt từng kịch liệt cản bước hành trình của chúng ta đã đền tội, nhưng tàn dư từ những trò bịp của hắn vẫn còn ám ảnh Kỵ Sĩ Đoàn."
 toxoids.7305.name:0 "Hành Trình Tìm Kiếm Thần Độc: Mở Cánh Cửa"
 toxoids.7305.desc:0 "Sau khói lửa chiến trận, các kỵ sĩ đã lục soát từng tấc không gian và tìm thấy chiếc chìa khóa cổ xưa để mở cánh cổng dẫn tới sào huyệt của Thần Độc."
 toxoids.7305.a:0 "Điều hạm đội gần nhất tới đó!"
 toxoids.7305.a.tooltip:0 "Chúng ta phải vén màn bí mật của tinh hệ §Y[toxic_god_system.GetName]§!."
 toxoids.7310.name:0 "Hành Trình Tìm Kiếm Thần Độc: Diện Kiến Thần Uy"
 toxoids.7310.desc:0 "[from.GetName] là nơi cư ngụ của những làn sương ăn mòn cuộn xoáy, và bên trong đó... Thần Độc ngự trị trong sự vĩ đại và đáng sợ khôn cùng!"
 toxoids.7310.a:0 "Nó quá đỗi ghê tởm, không từ ngữ nào tả xiết!"
 toxoids.7310.b:0 "Thần linh đang thử thách chúng ta! Triệu tập toàn bộ hạm đội!"
 toxoids.7311.name:0 "Thực Thể Độc Tố"
 toxoids.7311.desc:0 "[from.GetName] là nơi cư ngụ của những làn sương ăn mòn cuộn xoáy, và bên trong đó, một thực thể sinh học khổng lồ đang rít lên đe dọa!"
 toxoids.7311.a:0 "Thứ quái quỷ gì thế này..."
 toxoids.7312.name:0 "Hành Trình Tìm Kiếm Thần Độc: Thất Bại"
 toxoids.7312.desc:0 "Bất kể thứ gì từng ngự trị trong [from.GetName], giờ đây nó đã biến mất. Chỉ còn lại những làn sương mù xoáy tròn vô định."
 toxoids.7312.A:0 "Chúng ta không tin chuyện này... chúng ta không chấp nhận!"
 toxoids.7312.tooltip:0 "Có lẽ một ngày nào đó, Thần Độc thực sự sẽ được tìm thấy, nhưng chúng ta biết rằng hành trình này đã khép lại trong tiếc nuối."
 toxoids.7315.name:0 "Hành Trình Tìm Kiếm Thần Độc: Vượt Qua Thí Luyện"
 toxoids.7315.desc:0 "Thần Độc đã bị đánh bại và nằm dưới sự định đoạt của chúng ta.\n\nPhân tích xác nhận thực thể này sở hữu sức mạnh kinh hoàng có thể độc hóa cả các hành tinh, song nó cũng hoàn toàn tuân phục kẻ đã khuất phục được nó."
 toxoids.7315.a:0 "Hỡi Thần Độc, hãy trừng phạt kẻ thù của chúng ta!"
 toxoids.7315.a.tt:0 "Kết thúc thí luyện. Tiếp quản quyền kiểm soát §YThần Độc§!, một §YColossus§! có khả năng độc hóa các thế giới.\nCho phép địa khai hóa §YỨng Viên Thế Giới Độc Tố§! thành các thế giới cư ngụ được.\n§RKhi thí luyện kết thúc, nhiều [knight.GetIcon] Kỵ Sĩ cuối cùng sẽ rời bỏ Kỵ Sĩ Đoàn.§!"
 toxoids.7315.b:0 "Đây không phải thần thánh gì cả. Hãy hạ sát nó!"
 toxoids.7315.b.tt:0 "Kẻ Lừa Gạt rốt cuộc đã đúng. Đây chẳng phải thần linh. Thí Luyện kết thúc và chúng ta thu thập chiến lợi phẩm từ nó."
 toxoids.7320.name:0 "Vận Mệnh Của Kỵ Sĩ Đoàn"
 toxoids.7320.desc:0 "Thần Độc đã được tìm thấy, nhưng cùng với phát hiện này, Kỵ Sĩ Đoàn bỗng chốc mất đi lẽ sống tối thượng. Những nhiệm vụ vụn vặt và việc sai vặt tầm thường không còn xứng tầm với lòng dũng cảm và vinh quang của các hiệp sĩ nữa! Mất phương hướng và uể oải, ngày càng có nhiều kỵ sĩ rời bỏ Kỵ Sĩ Đoàn.\n\nHôm nay, Đại Chỉ Huy đã ban phước cho tất cả các hiệp sĩ còn lại quyền tự do lựa chọn ở lại hoặc rời đi. Nhiều người đã ra đi tìm kiếm cuộc sống mới. Một số lập thành các nhóm kỵ sĩ lang bạt, tiếp tục tìm kiếm những cuộc phiêu lưu mới khắp dải ngân hà."
 toxoids.7320.a:0 "Sự kết thúc của một kỷ nguyên."
 toxoids.7320.a.tt:0 "§RCông trình £building£ Pháo Đài Kỵ Sĩ Đoàn giờ đây sẽ hỗ trợ ít nghề [knight.GetIcon] Kỵ Sĩ hơn§!."

 toxoids.7510.name:0 "Hạ Sát Thực Thể Độc Tố"
 toxoids.7510.desc.origin:0 "Thực thể trong tinh hệ [toxic_god_system.GetName] không phải là Thần. Rốt cuộc, nếu nó là thần, làm sao chúng ta có thể hạ sát nó được?\n\nKhi thân xác nó co giật lần cuối, túi nọc độc vỡ toang, nhanh chóng phát tán vật chất ăn mòn ra khắp tinh hệ. Nhờ những động tác cơ động né tránh khẩn cấp, các hạm đội của chúng ta đã rút lui đến khoảng cách an toàn, nhưng bản thân thực thể lại không may mắn như vậy: bị đánh gục bởi chính chất độc của mình, máu thịt của nó phân hủy chớp nhoáng, chẳng để lại gì ngoài chiếc hàm khổng lồ. Kỵ Sĩ Đoàn đã lưu giữ nó như một chiến lợi phẩm chỉ mang ra trưng bày trong những dịp đại lễ, như một minh chứng tối thượng cho sự vĩ đại của các thành tựu mà Kỵ Sĩ Đoàn đã đạt được."
 toxoids.7510.desc.not_origin:0 "Chúng ta đã hạ sát Thực Thể Độc Tố trong tinh hệ [toxic_god_system.GetName]. Khi thân xác nó co giật lần cuối, túi nọc độc vỡ toang, nhanh chóng phát tán vật chất ăn mòn ra khắp tinh hệ. Bằng các thao tác cơ động né tránh khẩn cấp, các hạm đội của chúng ta đã đến được khoảng cách an toàn, nhưng bản thân sinh vật lại không may mắn như vậy: bị đánh gục bởi chính nọc độc của nó, xác nó tan biến nhanh chóng, chẳng để lại gì ngoài chiếc hàm khổng lồ."
 toxoids.7510.A:0 "Giờ thì chẳng còn thấy thần thánh đâu nữa nhỉ!"
 toxoids.7510.A.reanimators:0 "Than ôi! Phần xác còn lại không đủ nguyên vẹn để hồi sinh."

 ##Single Events

 toxoids.8000.name:0 "Phần Thưởng Thí Luyện"
 toxoids.8000.desc:0 "Một nhóm kỵ sĩ vừa trở về sau một cuộc viễn chinh dài ngày. Phi thuyền của họ trầy trụa tích điện, và những bộ giáp năng lượng đã qua thời kỳ rực rỡ nhất. Đó là một chuyến đi đầy gian khổ nhưng đã mang lại những hiểu biết quý giá về Thần Độc. Bất chấp những gian nan đã trải qua, sĩ khí của họ vẫn dâng cao, bởi họ không trở về tay trắng và câu chuyện của họ sẽ là những trang bổ sung tuyệt vời vào biên niên sử."
 toxoids.8005.name:0 "Yêu Cầu Cấp Thêm Ngân Sách"
 toxoids.8005.desc:0 "Suốt nhiều thế kỷ, chính quyền luôn dành một phần lớn tài nguyên cho thí luyện và Kỵ Sĩ Đoàn, và sự thay đổi chính sách gần đây của chúng ta nhằm cắt giảm ngân sách kỵ sĩ đã không được đón nhận nồng nhiệt. Các kỵ sĩ và tùy tùng tỏ ra bất mãn, và phần lớn dân chúng dường như cũng đồng tình, cảm thấy rằng chúng ta đang lãng quên bổn phận thiêng liêng. Đại Chỉ Huy đã đệ trình một yêu cầu chính thức nhằm khôi phục lại mô hình tài trợ thông thường, một yêu cầu được nhiều người trong đế chế ủng hộ."
 toxoids.8005.a:0 "Họ nói đúng, Thí Luyện là mục tiêu hàng đầu của chúng ta."
 toxoids.8005.b:0 "Không. Thí Luyện sẽ phải tạm hoãn."
 toxoids.8005.c:0 "Chúng ta có thể quyên góp một khoản để xoa dịu họ."
 knight_budget_demand:0 "Đã Cấp Thêm Ngân Sách"
 toxoids.8010.name:0 "Đại Thí Luyện Trăm Năm"
 toxoids.8010.desc:0 "Một trăm năm trước, chúng ta đã tiến vào các vì sao. Đó là một khởi đầu mới cho chúng ta, và cho Đại Thí Luyện, với những cơ hội vô tận dường như đang mở ra trước mắt. Một thế kỷ đã trôi qua, và người dân của chúng ta cảm thấy bị chia rẽ. Dẫu các thành tựu của chúng ta là không thể phủ nhận, nhưng đã có những tiếng nói nghi ngờ mục đích của các kỵ sĩ và Thí Luyện. Phải chăng họ chỉ là những tàn tích của một thời đại đã qua?"
 toxoids.8010.a:0 "Không. Chúng ta sẽ tổ chức một lễ hội để vinh danh các kỵ sĩ!"
 toxoids.8010.b:0 "Chúng ta không có thời gian cho những chuyện phù phiếm như vậy."
 toxoids.8010.c:0 "Đúng vậy. Đó là một thế kỷ của những thất bại. Hãy chấm dứt chuyện này."
 toxoids.8010.c.tooltip:0 "§RĐiều này sẽ kết thúc thí luyện, giải tán giáo đoàn và dỡ bỏ toàn bộ công trình cũng như khu vực liên quan§!"

 toxoids.8015.name:0 "Pháo Đài Kỵ Sĩ Đoàn Thất Thủ"
 toxoids.8015.desc.a:0 "Pháo Đài đã thất thủ. Nhiều chiến lợi phẩm và cổ vật quý giá đã bị quân cướp bóc đoạt mất. Tuy nhiên, trong sự hỗn loạn của cuộc di tản, một số kỵ sĩ dũng cảm đã kịp thời bảo vệ những nghiên cứu quý báu bằng cách niêm phong kho lưu trữ vào một căn phòng bí mật. Chúng tạm thời an toàn, nhưng nếu không có quyền tiếp cận trực tiếp kho tri thức này, Kỵ Sĩ Đoàn không thể vận hành bình thường."
 toxoids.8015.desc.b:0 "Pháo Đài đã thất thủ. Nhiều chiến lợi phẩm và cổ vật quý giá đã bị quân cướp bóc đoạt mất. Tuy nhiên, trong sự hỗn loạn của cuộc di tản, một số kỵ sĩ dũng cảm đã kịp thời bảo vệ những nghiên cứu quý báu bằng cách niêm phong kho lưu trữ vào một căn phòng bí mật. Chúng tạm thời an toàn, nhưng nếu không có quyền tiếp cận trực tiếp kho tri thức này, Thí Luyện không thể tiếp tục."
 toxoids.8015.a: "Chúng ta phải tái chiếm Pháo Đài bằng mọi giá!"
 toxoids.8017.name:0 "Sự Hủy Diệt Pháo Đài Kỵ Sĩ Đoàn"
 toxoids.8017.desc.a:0 "Pháo Đài đã bị hủy diệt, biến thành một khối mảnh vụn trôi dạt vô định. Toàn bộ cổ vật và công trình nghiên cứu đã tan thành tro bụi. Kỵ Sĩ Đoàn không còn nữa."
 toxoids.8017.desc.b:0 "Pháo Đài đã bị hủy diệt, biến thành một khối mảnh vụn trôi dạt vô định. Toàn bộ cổ vật và công trình nghiên cứu đã tan thành tro bụi. Thí Luyện đã vĩnh viễn chấm dứt."
 toxoids.8017.desc.c: "Pháo Đài đã bị niêm phong và cô lập hoàn toàn khỏi chúng ta. Kỵ Sĩ Đoàn không thể tiếp tục hoạt động."
 toxoids.8017.desc.d: "Pháo Đài đã bị niêm phong và cô lập hoàn toàn khỏi chúng ta. Thí Luyện đã bị đình trệ vô thời hạn."
 toxoids.8017.a:0 "Không thể nào như thế được..."
 toxoids.8020.name:0 "Số Phận Của Thần Độc"
 toxoids.8020.desc:0 "Sau khi tìm thấy Thực Thể Độc Tố, các kỵ sĩ của chúng ta đã mất đi manh mối về tung tích thực sự của nó giữa các vì sao..."
 toxoids.8020.a:0 "Chúng ta sẽ không ngơi nghỉ cho đến khi tìm ra lối đi!"
 toxoids.8020.b: "... Hoặc là có lối đi chăng?"
 toxoids.8020.cosmogenesis: "Lựa chọn này khả dụng vì bạn sở hữu Đặc Quyền §YKhởi Sinh Vũ Trụ (Cosmogenesis)§!."
 advanced_logic_from_knights: "[knight.GetIcon] §Y[knight.GetNamePlural]§! giờ đây sẽ sản xuất thêm §G+1§! £advanced_logic£ Logic Siêu Cường.\n£job_knight_commander£ §Y$job_knight_commander$§! giờ đây sẽ sản xuất thêm §G+2§! £advanced_logic£ Logic Siêu Cường."
 toxoids.8025.name:0 "Tái Chiếm Pháo Đài Kỵ Sĩ Đoàn"
 toxoids.8025.desc: "Chúng ta đã thu hồi thành công Pháo Đài Kỵ Sĩ Đoàn. Hệ thống phòng thủ và kho lưu trữ của chúng ta đã được khôi phục nguyên vẹn!"
 toxoids.8025.a:0 "Một ngày vinh quang!"


 toxoids.8030.name: "Cuộc Trở Về Khải Hoàn"
 toxoids.8030.desc: "Đặt chân trở lại quê nhà đã được phục hồi được muôn dân xem như thành tựu vĩ đại nhất của Kỵ Sĩ Đoàn!"
 toxoids.8030.a: "Ngợi ca Thần Độc!"

 ##Policy

 policy_knightly_duties:0 "Bổn Phận Kỵ Sĩ"
 policy_knightly_duties_desc:0 "Các Kỵ Sĩ của chúng ta là tầng lớp tinh hoa bậc nhất mà quốc gia có được. Bằng cách định hướng bổn phận của họ, chúng ta có thể hướng các nỗ lực của họ vào những mục tiêu then chốt của đế chế."
 toxic_knights_questing_name:0 "Kỵ Sĩ Thí Luyện"
 questing_knights:0 "$toxic_knights_questing_name$"
 questing_knights_desc:1 "Các Kỵ Sĩ của chúng ta sẽ dồn toàn lực vào Đại Thí Luyện và không gì khác. Chúng ta sẽ nhanh chóng tiến gần hơn tới việc tìm thấy Thần Độc."
 toxic_knights_military_name:0 "Kỵ Sĩ Chỉ Huy Quân Sự"
 military_knights:0 "$toxic_knights_military_name$"
 military_knights_desc:1 "Các Kỵ Sĩ bắt buộc phải phục vụ nơi chiến trường. Chúng ta có thể tận dụng kỹ năng võ nghệ siêu việt của họ để củng cố sức mạnh hải quân và các hạm đội."
 military_knights_nomad: "$military_knights$"
 military_knights_nomad_desc: "$military_knights_desc$"
 toxic_knights_diplomats_name:0 "Kỵ Sĩ Cung Đình"
 diplomats_knights:0 "$toxic_knights_diplomats_name$"
 diplomats_knights_desc:2 "Các Kỵ Sĩ của chúng ta sẽ được phái đi làm đại sứ để hỗ trợ các nỗ lực ngoại giao và lan tỏa văn hóa cao quý của chúng ta khắp thiên hà."
 toxic_knights_herald_name:0 "Kỵ Sĩ Sứ Giả"
 herald_knights:0 "$toxic_knights_herald_name$"
 herald_knights_desc:1 "Khắp cõi cương thổ của chúng ta, các Kỵ Sĩ được cử đi để tuyên cáo quyền uy, gìn giữ trật tự xã hội và truyền cảm hứng cho quần chúng nhân dân."

 ##Holdings

 holding_knight_commandery:0 "Chỉ Huy Sở Kỵ Sĩ Đoàn"
 holding_knight_commandery_desc:0 "Tiền đồn kiên cố này là nơi các hiệp sĩ của chúng ta phối hợp cùng giới lãnh đạo địa phương, mở rộng ảnh hưởng của Kỵ Sĩ Đoàn sang các thế giới thần dân."
 job_overlord_knight_commandery_effect_desc:1 "[knight.GetIcon] $job_overlord_knight_plural$ biến $r_alloys$ thành $r_stability$ và tạo ra các £defense_army£ §YĐội Quân Phòng Thủ§! cho Thần dân, đồng thời tạo ra £unity£ §YThống Nhất§! và £physics_research£ £society_research£ £engineering_research£ §YĐiểm Nghiên Cứu§! cho Tông chủ."
 job_overlord_knight:0 "Kỵ Sĩ Tông Chủ"
 job_overlord_knight_plural:0 "Các Kỵ Sĩ Tông Chủ"
 job_overlord_knight_desc:0 "$job_knight_desc$"
 job_overlord_knight_drone:0 "Kỵ Sĩ Tông Chủ"
 job_overlord_knight_drone_plural:0 "Các Kỵ Sĩ Tông Chủ"
 job_overlord_knight_drone_desc:0 "$job_knight_desc$"
 mod_job_overlord_knight_add:0 "Nghề $job_overlord_knight$"
 mod_job_overlord_knight_drone_add:0 "Nghề $job_overlord_knight_drone$"
 building_knightly_theme_park:0 "Khu Hội Chợ Kỵ Sĩ"
 building_knightly_theme_park_desc:0 "Trông giống như một pháo đài thực thụ, công trình này thực chất là một công viên giải trí tôn vinh các chiến công của kỵ sĩ, thu hút đông đảo du khách và tạo ra nguồn thu khổng lồ."
 knightly_theme_park_quest_effect_desc:0 "§GTăng tiến độ Thí Luyện Kỵ Sĩ Thần Độc thêm 0.01 mỗi tháng.§!"

 ##Misc

 low_motivation:0 "Sĩ Khí Thấp"
 low_motivation_desc:0 "Sau một chuyến thâm nhập tâm trí vào Cõi Màn Mờ, người dân cảm thấy hoang mang và mất phương hướng."
 malcontent_knights:0 "Kỵ Sĩ Bất Mãn"
 malcontent_knights_desc:0 "Các kỵ sĩ không hài lòng, và sự bất mãn của họ lan rộng sang các tầng lớp nhân dân."
 motivated_knights:0 "Kỵ Sĩ Hăng Hái"
 motivated_knights_desc:0 "Các kỵ sĩ của chúng ta đã tìm thấy sinh lực và lòng nhiệt huyết mới bất chấp những khó khăn trên bước đường thí luyện."
 demotivated_knights:0 "Kỵ Sĩ Nhụt Chí"
 demotivated_knights_desc:0 "Thí luyện kéo dài và mục tiêu thì xa xôi. Đôi khi, mọi nỗ lực dường như vô nghĩa."
 despair_of_the_knightly_order:0 "Kỵ Sĩ Đoàn Tuyệt Vọng"
 despair_of_the_knightly_order_desc:0 "Cuộc tìm kiếm Thần Độc kéo dài đã kết thúc trong thất bại. Khi không còn manh mối nào để khám phá, nhiều người đặt câu hỏi về mục đích tiếp tục Thí Luyện."

 #Overtuned

 origin_overtuned:0 "Biến Đổi Siêu Cường"
 origin_overtuned_desc:1 "Nền văn minh này sử dụng mọi phương tiện cải tiến sinh học hữu cơ, bất chấp rủi ro, bất chấp chi phí. Rốt cuộc, thà bùng cháy rực rỡ một lần rồi vụt tắt còn hơn mòn mỏi lụi tàn trong bóng tối vô danh."
 origin_overtuned_effects:1 "Bắt đầu với các đặc tính sinh học nâng cao có sẵn, mạnh mẽ hơn và rẻ hơn các đặc tính thông thường nhưng đi kèm rủi ro cực lớn."
 origin_tooltip_overtuned_effects:4 "- $SPECIES_TRAITS$ Tiếp cận các Đặc Tính ['concept_overtuned_traits', $origin_overtuned$]$NEW_LINE$- Các Đặc Tính Siêu Cường:$TABBED_NEW_LINE$- Có thể được tăng cường bởi Sắc lệnh ['concept_damn_the_consequences', Mặc Kệ Hậu Quả]$TABBED_NEW_LINE$- Có thể thêm vào hoặc gỡ bỏ thông qua §IChỉnh Sửa Di Truyền§!\n- $ADDITIONAL_TECHNOLOGIES_STRING$ ['concept_gene_tailoring', £society£ $tech_gene_tailoring$]"
 START_SCREEN_OVERTUNED:1 "Tự nhiên là một nhà sáng chế uể oải. Tiến hóa là một quá trình chậm chạp như dòng sông băng trôi. Để phồn vinh, chúng ta cần sức mạnh, tốc độ và trí tuệ — ngay bây giờ, chứ không phải đợi một triệu năm nữa. Chọn lọc tự nhiên thật keo kiệt với những món quà của nó, vì vậy chúng ta phải tự mình hoàn thiện bản thân.\n\nDo đó, nền văn minh của chúng ta được xây dựng dựa trên nguyên tắc nâng cấp cơ thể không giới hạn. Những cải tiến này đã cho phép chúng ta thống nhất thế giới dưới một ngọn cờ, và giờ đây chúng sẽ dẫn dắt chúng ta tiến xa hơn nữa.\n\nVới bộ não, cơ bắp và lòng dũng cảm được kiến tạo bằng công nghệ di truyền, chúng ta sẽ phát triển rực rỡ giữa muôn ngàn vì sao... Như cách mà một giống loài được thiết kế hoàn hảo xứng đáng được hưởng."
 START_SCREEN_OVERTUNED_NOMADS: "Tự nhiên là một nhà sáng chế uể oải. Tiến hóa là một quá trình chậm chạp như dòng sông băng trôi. Để phồn vinh, chúng ta cần sức mạnh, tốc độ và trí tuệ — ngay bây giờ, chứ không phải đợi một triệu năm nữa. Chọn lọc tự nhiên thật keo kiệt với những món quà của nó, vì vậy chúng ta phải tự mình hoàn thiện bản thân.\n\nCõi hư không không chấp nhận sự yếu đuối. Những cải tiến này đã tôi luyện chúng ta trước những đòi hỏi khắc nghiệt của nó và đoàn kết nhân dân dưới một ngọn cờ duy nhất. Giờ đây chúng sẽ dẫn dắt chúng ta tiến xa hơn nữa.\n\nVới bộ não, cơ bắp và lòng dũng cảm được kiến tạo bằng công nghệ di truyền, chúng ta sẽ phát triển rực rỡ giữa muôn ngàn vì sao... Như cách mà một giống loài được thiết kế hoàn hảo xứng đáng được hưởng."
 disables_overtuned_features:0 "§RLựa chọn Đặc Quyền Thăng Hoa này sẽ vô hiệu hóa cơ chế Khởi nguyên Biến Đổi Siêu Cường.§!"

