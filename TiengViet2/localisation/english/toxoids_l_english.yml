 building_toxic_bath_machine:0 "Bể Siêu Bôi Trơn"
 building_toxic_bath_desc:0 "Dẫu Bể Suối Biến Dị là những trung tâm trị liệu tân tiến với các lợi ích sức khỏe được ghi chép rõ ràng, đối với nhiều người, phương pháp áp dụng ở đây vẫn thật kinh tởm. Mỗi giọt dung dịch tắm còn chứa nhiều độc chất gây biến dị hơn cả hầu hết các chất cấm trong thiên hà."
 building_toxic_bath_hive_desc:1 "Hồ Tái Cấu Trúc Biến Dị là biểu hiện hoàn hảo cho đỉnh cao mà một ý thức bầy đàn có thể đạt tới, khi tập trung toàn lực vào mục tiêu sản sinh thêm nhiều thể xác mới cho ý thức không ngừng bành trướng."
 building_toxic_bath_machine_desc:0 "Bể Siêu Bôi Trơn là câu trả lời hợp lý nhất cho các vấn đề ma sát, quá nhiệt và tĩnh điện phát sinh trong quá trình sản xuất các đơn vị cơ khí mới."

