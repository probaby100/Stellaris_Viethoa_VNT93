 civic_toxic_baths_desc:0 "Nền văn minh này thực hiện các nghi thức ngâm mình biến dị, với các nhân viên chuyên nghiệp giám sát việc sử dụng các chất cực kỳ nguy hiểm. Quá trình 'tiếp thêm sinh lực' này có thể khiến những kẻ ngoài cuộc chưa từng biết đến phải rùng mình kinh hãi."
 civic_corporate_toxic_baths_desc:0 "Nền văn minh này tổ chức các dịch vụ ngâm mình biến dị, với các nhân viên chuyên nghiệp giám sát việc sử dụng các hợp chất nguy hiểm cao độ. Quá trình 'tiếp thêm sinh lực' này được tiếp thị như một bước không thể thiếu để nâng cao sức sống và sự nghiệp đỉnh cao."
 civic_hive_toxic_baths_desc:1 "Ý thức bầy đàn này sử dụng các hồ chứa biến dị, với các drone chuyên biệt theo dõi quá trình biến đổi để tối ưu hóa sự phát triển thể chất của các thế hệ mới."
 civic_machine_toxic_baths_desc:0 "Đế chế máy móc này đã cải tiến dây chuyền sản xuất vỏ drone cơ bản bằng cách ngâm chúng vào các bể siêu bôi trơn chuyên dụng, giảm hao mòn cơ học và tối ưu hóa năng suất vận hành."

