 building_order_keep_desc:1 "Trụ sở của Kỵ Sĩ Đoàn là ngôi nhà của các kỵ sĩ. Nơi đây sở hữu các bãi phóng huấn luyện, kho dữ liệu đồ sộ và chứa đầy những chiến lợi phẩm thu thập được trong suốt chiều dài lịch sử vẻ vang của giáo đoàn."
