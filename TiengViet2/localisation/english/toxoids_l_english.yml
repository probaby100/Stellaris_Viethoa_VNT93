 concept_toxic_blocker: "Vật Cản Độc Tố"
 concept_toxic_blocker_desc: "£blocker£ §H$concept_toxic_blockers$§! là tàn dư của quá trình giải độc, để lại khi một hành tinh §H$pc_toxic$§! được ['concept_terraforming', Địa Khai Hóa] thành một ['concept_habitable_world', Thế Giới Cư Ngụ Được].\n\nChúng bao gồm:\n- $d_tainted_snowcaps$\n- $d_poisonous_algae$\n- $d_venomous_insects$\n- $d_unpleasant_atmosphere$\n- $d_rotten_soil$"
 concept_toxic_blockers: "Các Vật Cản Độc Tố"
 concept_toxic_blockers_desc: "$concept_toxic_blocker_desc$"
 arkship_knights_detox_desc: "§LBầu trời độc hại không thể cản bước đức tin kiên cường. Tàu Phương Châu mang lại sự thanh tẩy cho các thế giới ô uế, biến chúng thành nơi sinh sống mới cho nhân dân.§!"
