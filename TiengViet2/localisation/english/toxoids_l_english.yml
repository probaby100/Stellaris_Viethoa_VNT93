 decision_activate_dimensional_manipulation_device:0 "Kích Hoạt Thiết Bị Thao Túng Chiều Không Gian"
 decision_activate_dimensional_manipulation_device_desc:0 "Những gì bên ngoài trông nhỏ bé có thể được biến thành rộng lớn hơn ở bên trong nhờ thiết bị đoạt được từ tiên nữ Syamelle."
 d_dimensional_manipulation_device:0 "Thiết Bị Thao Túng Chiều Không Gian"
 d_dimensional_manipulation_device_desc:0 "Một thiết bị trộm được từ tiên nữ Syamelle, có thể thao túng chính các chiều không gian và khiến nơi chật hẹp bên ngoài trở nên vô cùng khoáng đạt bên trong."
 dimensional_manipulation_device_tooltip:0 "Mỗi $district_orders_demesne_plural$ giờ đây sẽ cung cấp thêm cho chúng ta §G+0.5§! Ô Công Trình và §G+1§! Nhà ở."
 dimensional_manipulation_device_tooltip_short:0 "£mod_planet_max_buildings_add£§G+0.5§! £housing£§G+1§! mỗi $district_orders_demesne$"
 syamelles_curse:0 "Lời Nguyền Của Syamelle"
 syamelles_curse_desc:0 "Một thực thể bí ẩn đã nguyền rủa chúng ta vĩnh viễn không bao giờ biết đến tình yêu và dục vọng đích thực nữa. Nhưng đổi lại, ả cho phép chúng ta duy trì nòi giống bằng các phương tiện cơ giới hơn."
 syamelles_curse_habitat:0 "Bệnh Dịch Ái Tình"
 syamelles_curse_habitat_desc:0 "Tác động của Lời nguyền Syamelle được cảm nhận rõ nhất tại Tổng hành dinh Kỵ Sĩ Đoàn. Việc tiếp xúc thân mật trở nên quá đỗi kỳ dị khiến các Tùy Tùng buộc phải tìm phương pháp mới để gia tăng dân số."
 syamelles_curse_habitat_tooltip:0 "$MOD_POP_GROWTH_SPEED_REDUCTION$: §R100%§!\n£mod_bonus_pop_growth£ $MOD_BONUS_POP_GROWTH$ mỗi $pop_group_unit$ [squire.GetIcon] [squire.GetNamePlural]: §G+0.10§!"
 syamelles_blessing:0 "Phước Lành Của Syamelle"
 syamelles_blessing_desc:0 "Một thực thể bí ẩn đã ban phước cho chúng ta sau một cuộc hạnh ngộ ngắn ngủi nhưng nồng nàn. Một luồng sinh lực mới tuôn trào trong cơ thể, và mỗi cuộc tương phùng dường như đều mở ra những khả năng mới..."
 syamelles_blessing_synth:0 "$syamelles_blessing$"
 syamelles_blessing_synth_desc:0 "$syamelles_blessing_desc$"

 r_toxic_god:0 "Miệng Há Của Thực Thể Độc Tố"
 r_toxic_god_desc:0 "Vài kẻ tin rằng thực thể mà chiếc miệng khổng lồ này từng thuộc về sở hữu quyền năng thần thánh. Giờ đây không còn là Thần nữa, sinh vật này đã bị hạ sát, và chiến lợi phẩm này là đài tưởng niệm duy nhất đánh dấu sự diệt vong của nó."
 r_toxic_god_knights_passive_effect: "§YMở khóa Trạm Không Gian Quỹ Đạo:§! $major_orbital_knights$"
 r_toxic_god_knights_effect:0 "Mở khóa một §YQuyết Định§! để §YThánh Hóa Thuộc Địa§! và xây dựng một §Y$building_order_castle$§! tại đó."

 building_order_castle:0 "Lâu Đài Kỵ Sĩ Đoàn"
 building_order_castle_desc:0 "Kỵ Sĩ Đoàn Thần Độc đã dựng lên một tòa lâu đài trên Thuộc địa này. Một đội ngũ kỵ sĩ và tùy tùng đã thiết lập căn cứ tại đây."

 decision_consecrate_habitat_knights:0 "Thánh Hóa Trạm Không Gian"
 decision_consecrate_habitat_knights_desc:0 "Chúng ta sẽ thánh hóa trạm không gian bằng một cổ vật thu hồi được trong hành trình thí luyện. Từ nay trở đi, nơi đây sẽ được xem là căn cứ kỵ sĩ, và Kỵ Sĩ Đoàn sẽ dựng lâu đài cùng lãnh địa mới tại đây."
 decision_consecrate_habitat_knights_effect:1 "Chuyên môn hóa trạm không gian này với một §Y$zone_habitat_knights$§! và £building£ §Y$building_order_castle$§!.\n§Y$building_order_castle$§! cung cấp các nghề Kỵ Sĩ [knight.GetIcon] và Tùy Tùng [squire.GetIcon].\n§RKhông thể bị phá hủy.§!"
 decision_consecrate_arkship_knights: "Thánh Hóa Tàu Phương Châu"
 decision_consecrate_arkship_knights_desc: "Chúng ta sẽ thánh hóa Tàu Phương Châu bằng một cổ vật thu hồi được trong hành trình thí luyện. Từ nay trở đi, nơi đây sẽ được xem là căn cứ kỵ sĩ, và Kỵ Sĩ Đoàn sẽ dựng lâu đài cùng lãnh địa mới tại đây."
 decision_consecrate_arkship_knights_effect: "Chuyên môn hóa Tàu Phương Châu này với một §Y$zone_habitat_knights$§! và £building£ §Y$building_order_castle$§!.\n§Y$building_order_castle$§! cung cấp các nghề Kỵ Sĩ [knight.GetIcon] và Tùy Tùng [squire.GetIcon].\n§RKhông thể bị phá hủy.§!"
 requires_another_consecration:1 "$TRIGGER_FAIL$Yêu cầu thêm một lần kích hoạt §Y$r_toxic_god$§!"

