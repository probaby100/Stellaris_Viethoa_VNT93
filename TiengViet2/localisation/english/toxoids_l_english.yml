 civic_relentless_industrialists:0 "Kẻ Công Nghiệp Không Khoan Nhượng"
 civic_relentless_industrialists_desc:0 "Sống là phải bóc lột. Nền văn minh này được xây dựng xung quanh nguyên tắc tận hưởng cuộc sống trọn vẹn nhất, theo nghĩa vắt kiệt lợi nhuận tối đa từ từng gram vật chất và từng mẩu mô sinh học cuối cùng có thể khai thác được."
