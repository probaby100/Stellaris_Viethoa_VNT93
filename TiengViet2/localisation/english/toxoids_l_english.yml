 d_toxic_god_pools_most_venemous:0 "Đầm Độc Cực Đại"
 d_toxic_god_pools_most_venemous_desc:0 "Sau khi Thần Độc đi qua, nhiều đầm lầy cực độc đã đọng lại, nơi đây có thể thu thập tàn tích chất độc của Ngài."
 d_toxic_god_pools_most_venemous_upgraded:1 "Độc Tố Kịch Độc"
 d_toxic_god_pools_most_venemous_upgraded_desc:0 "Sau khi Thần Độc đi qua, nhiều đầm lầy cực độc đã đọng lại, nơi đây có thể thu hồi tàn tích chất độc của Ngài. Nhờ nỗ lực của các Kỵ Sĩ Thần Độc, giờ đây chúng ta có thể thu hoạch và ứng dụng loại độc dược cực mạnh này vào nhiều mục đích."
 d_toxic_god_pestilential_wasteland:0 "Vùng Hoang Ô Nhiễm"
 d_toxic_god_pestilential_wasteland_desc:0 "Không phải ai cũng được hưởng phước lành của Thần Độc. Những vùng đất rộng lớn đã bị hủy hoại hoàn toàn khi Ngài đi qua, vĩnh viễn không thể phục hồi."
 d_toxic_god_pestilential_wasteland_upgraded:1 "Vùng Dịch Khai Khẩn"
 d_toxic_god_pestilential_wasteland_upgraded_desc:0 "$d_toxic_god_pestilential_wasteland_desc$ Tuy nhiên, các bộ giáp mà các kỵ sĩ thu hồi được đã mang lại cho chúng ta phương tiện để làm việc an toàn tại những khu vực này."
 d_toxic_god_deitys_swarms:0 "Bầy Côn Trùng Của Thần"
 d_toxic_god_deitys_swarms_desc:0 "Sau bước chân của Thần Độc, những loài côn trùng chưa từng xuất hiện trên thế giới này đã sinh sôi nhanh chóng, phát triển mạnh mẽ tại nhiều khu vực bị ảnh hưởng. Sự hiện diện dịch bệnh của chúng tiếp tục thử thách chúng ta trong việc canh tác những vùng đất này."
 d_toxic_god_deitys_swarms_upgraded:1 "Bầy Đã Thuần Phục"
 d_toxic_god_deitys_swarms_upgraded_desc:0 "Sau bước chân của Thần Độc, những loài côn trùng chưa từng xuất hiện trên thế giới này đã sinh sôi nhanh chóng, phát triển mạnh mẽ tại nhiều khu vực bị ảnh hưởng. Chúng ta đã tinh thông kỹ nghệ chăn nuôi chúng để lấy thịt mọng nước và nọc độc cực mạnh."
 d_toxic_god_blight_upon_the_land:0 "Đất Đai Ô Uế"
 d_toxic_god_blight_upon_the_land_desc:1 "Người ta kể rằng chính tại nơi đây, Thần Độc đã giáng cơn thịnh nộ đầu tiên xuống mặt đất. Hầu như chẳng còn gì sót lại của những thứ từng tồn tại nơi đây."
 d_toxic_god_blight_upon_the_land_upgraded:1 "Ký Ức Tai Ương"
 d_toxic_god_blight_upon_the_land_upgraded_desc:1 "Người ta kể rằng chính tại nơi đây, Thần Độc đã giáng cơn thịnh nộ đầu tiên xuống mặt đất. Hầu như chẳng còn gì sót lại của quá khứ, nhưng một đài tưởng niệm đã được dựng lên, các đường nét được tái hiện từ ký ức của chúng ta về khoảnh khắc lịch sử đó."
 d_toxic_god_envenomed_seas:0 "Đại Dương Nhiễm Độc"
 d_toxic_god_envenomed_seas_desc:1 "Ngay cả đại dương cũng không thoát khỏi cái chạm mang lại tai ương của Thần Độc."
 d_toxic_god_envenomed_seas_upgraded:1 "Lợi Tức Đại Dương"
 d_toxic_god_envenomed_seas_upgraded_desc:1 "Các Kỵ Sĩ của chúng ta đã mang về công nghệ cần thiết để khai thác các loại khí hiếm từ những vùng biển từng được Thần Độc chạm tới."

 d_knights_calibrator: "Máy Định Chuẩn X Của Kỵ Sĩ Đoàn"
 d_knights_calibrator_desc: "Cổ vật được tôn kính nhất của Kỵ Sĩ Đoàn, duy trì sự tồn tại của toàn bộ Pháo Đài."

