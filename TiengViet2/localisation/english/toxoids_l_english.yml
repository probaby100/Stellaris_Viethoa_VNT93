 SETTLE_BLOCKED_BY_KNIGHTS_QUEST: "$TRIGGER_FAIL$§RKỵ Sĩ Đoàn sẽ không định cư cho đến khi Thí Luyện hoàn tất.§!"
 START_SCREEN_TOXIC_KNIGHTS:1 "Thuở xa xưa, hành tinh của chúng ta từng bị chia cắt. Những tiểu vương tranh giành quyền lực liên miên, tài nguyên cạn kiệt, dân chúng lầm than. Thế rồi một ngày nọ, một Thực Thể Độc Tố khổng lồ bay ngang qua bầu trời.\n\nCả thế giới ngỡ ngàng khi thực thể bay qua các lục địa, để lại sau lưng một vệt khói độc dày đặc biến nửa hành tinh thành phế tích. Thế giới của chúng ta rơi vào hoảng loạn, nhưng cũng trong thảm kịch đó, chúng ta đã tìm thấy sự thống nhất.\n\nDẫu Thần Độc đã rời đi, nhưng nọc độc của Ngài vẫn tiếp tục lan rộng, đe dọa biến toàn bộ hành tinh thành nơi không thể sinh sống. Không nản lòng, Đấng Tối Cao đã cho xây dựng một Trạm Không Gian Quỹ Đạo khổng lồ phía trên thế giới của chúng ta để làm nơi trú ẩn cho những ai có thể trốn thoát, và thành lập một Kỵ Sĩ Đoàn để tìm kiếm Ngài.\n\nSuốt nhiều thế kỷ, những linh hồn dũng cảm ấy đã rong ruổi khắp các vì sao nhưng chưa thu được kết quả. Thần Độc đã rời xa thế giới chúng ta quá lâu. Giờ đây, khi các kỵ sĩ chuẩn bị dấn thân sâu hơn vào cõi hư vô, một chương mới trong Đại Thí Luyện sắp sửa mở ra."
 START_SCREEN_TOXIC_KNIGHTS_CORPORATE:0 "Thuở xa xưa, hành tinh của chúng ta từng bị chia cắt. Các nghiệp đoàn tranh giành thị phần liên miên, tài nguyên cạn kiệt, dân chúng lầm than. Thế rồi một ngày nọ, một Thực Thể Độc Tố khổng lồ bay ngang qua bầu trời.\n\nCả thế giới ngỡ ngàng khi thực thể bay qua các lục địa, để lại sau lưng một vệt khói độc dày đặc biến nửa hành tinh thành phế tích. Thế giới của chúng ta rơi vào khủng hoảng, nhưng cũng trong thảm kịch đó, chúng ta đã tìm thấy sự thống nhất.\n\nDẫu Thần Độc đã rời đi, nhưng nọc độc của Ngài vẫn tiếp tục lan rộng, đe dọa biến toàn bộ hành tinh thành nơi không thể sinh sống. Không chịu khuất phục trước bờ vực phá sản sinh thái, Hội đồng Quản trị đã quyết định đầu tư xây dựng một Trạm Không Gian Quỹ Đạo khổng lồ để làm nơi trú ẩn, đồng thời thành lập một Kỵ Sĩ Đoàn để tìm kiếm Ngài.\n\nSuốt nhiều thế kỷ, những hiệp sĩ quả cảm ấy đã lùng sục khắp các vì sao nhưng chưa mang lại lợi nhuận nào. Thần Độc đã rời xa thế giới chúng ta quá lâu. Giờ đây, khi các kỵ sĩ chuẩn bị dấn thân sâu hơn vào cõi hư vô, một chương mới trong Đại Thí Luyện sắp sửa mở ra."
 START_SCREEN_TOXIC_KNIGHTS_NOMADS:1 "Thuở xa xưa, hành tinh của chúng ta từng bị chia cắt. Những tiểu vương tranh giành quyền lực liên miên, tài nguyên cạn kiệt, dân chúng lầm than. Thế rồi một ngày nọ, một Thực Thể Độc Tố khổng lồ bay ngang qua bầu trời.\n\nCả thế giới ngỡ ngàng khi thực thể bay qua các lục địa, để lại sau lưng một vệt khói độc dày đặc biến nửa hành tinh thành phế tích. Thế giới của chúng ta rơi vào hoảng loạn, nhưng cũng trong thảm kịch đó, chúng ta đã tìm thấy sự thống nhất.\n\nDẫu Thần Độc đã rời đi, nhưng ảnh hưởng của Ngài vẫn tiếp tục lan rộng, nhanh chóng khiến toàn bộ hành tinh không thể cư ngụ. Quyết tâm cứu lấy đồng bào, Đấng Tối Cao đã thành lập một Kỵ Sĩ Đoàn. Suốt nhiều thế kỷ, những linh hồn dũng cảm ấy miệt mài tìm kiếm nhưng công cốc. Thần Độc đã rời xa quê hương chúng ta từ quá lâu. Chương tiếp theo của Đại Thí Luyện sẽ được viết nên giữa muôn ngàn vì sao. Nhờ một cổ vật hùng mạnh, Kỵ Sĩ Đoàn đã đóng nên con Tàu Phương Châu đầu tiên của đế chế chúng ta. Con tàu kiêm pháo đài di động này sẽ bảo vệ những cư dân cuối cùng khi chúng ta giương buồm vượt qua vũ trụ bao la."
