 concept_industrialist_civics: "Kẻ Công Nghiệp Không Khoan Nhượng"
 concept_industrialist_civics_desc: "Các Quốc Thể $concept_industrialist_civics$ bao gồm: \n- ['civic:civic_relentless_industrialists']$NEW_LINE$- ['civic:civic_corporate_relentless_industrialists']"

 toxoids.5.name:0 "Khai Thác Quá Mức Trên [Root.GetName]"
 toxoids.5.desc:0 "Việc khai thác của chúng ta trên [Root.GetName] đã gây ra những tổn hại sinh thái đáng kể — và có lẽ là không thể đảo ngược — đối với môi trường thế giới. Ô nhiễm công nghiệp đã gây ra sự gián đoạn khí hậu nghiêm trọng thông qua hiệu ứng nhà kính mất kiểm soát, và các vụ rò rỉ phóng xạ tràn lan đã khiến phần lớn diện tích của [Root.GetPlanetMoon] không thể cư ngụ bằng các biện pháp thông thường.\n\nQuá trình này hiện đã chạm tới ngưỡng bùng phát. Trừ phi chúng ta thay đổi phương thức và bắt đầu giảm thiểu tác động lên môi trường hành tinh, chúng ta sẽ không thể ngăn chặn một thảm họa toàn diện: một thế giới thù địch và ngập tràn phóng xạ đúng như những lời cảnh báo tồi tệ nhất của các nhà tiên tri ngày tận thế, với những biển độc cuộn sóng và những vùng hoang tàn không một bóng sinh linh."

 relentless_industrialists_situation:0 "Suy Thoái Môi Trường Của [Target.GetName]"
 relentless_industrialists_situation_type:0 "Suy Thoái Môi Trường"
 relentless_industrialists_situation_desc:0 "Nếu chúng ta không hành động, việc khai thác tài nguyên trên [Target.GetName] cuối cùng sẽ biến hành tinh này thành một Thế Giới Lăng Mộ hoang tàn."
 relentless_industrialists_situation_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_approaches_dependent$\nNgoài ra, nhận thêm tiến độ theo từng công trình §Y$building_coordinated_fulfillment_center_1$§! nếu có Quốc Thể §Y$civic_relentless_industrialists$§!."
 approach_take_no_action:0 "Không Hành Động"
 approach_climate_do_nothing_tooltip:0 "Hành tinh sẽ trở thành một §YThế Giới Lăng Mộ§!. Các công trình §Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta sẽ tiếp tục hoạt động hết công suất."
 approach_cleanup_efforts:0 "Phát Động Nỗ Lực Dọn Dẹp"
 approach_climate_cleanup_efforts_tooltip:0 "Hành tinh sẽ KHÔNG trở thành một §YThế Giới Lăng Mộ§!. Tuy nhiên, các công trình §Y$building_coordinated_fulfillment_center_1_plural$§! sẽ bị giảm hiệu suất và tốn thêm chi phí duy trì bằng £unity£ Thống Nhất."
 approach_embrace_change:0 "Đón Nhận Biến Đổi"
 approach_climate_embrace_change_tooltip:0 "Chúng ta sẽ nghiên cứu quy trình để tìm hiểu cách thức biến đổi các thế giới thành Thế Giới Lăng Mộ một cách an toàn mà không làm giảm quá mức độ thích nghi của cư dân từ §Y$building_coordinated_fulfillment_center_1_plural$§!."
 approach_become_environmentalist:0 "Trở Thành Nhà Bảo Vệ Môi Trường"
 stage_cleanup:0 "Nỗ Lực Dọn Dẹp"
 stage_cataclysm_1:0 "Biến Động Môi Trường"
 stage_cataclysm_2:0 "Thảm Họa Không Thể Đảo Ngược"
 relentless_industrialists_situation_cleanup_tooltip:0 "Các thế giới của chúng ta sẽ không còn nguy cơ biến thành §YThế Giới Lăng Mộ§! nữa, nhưng §Y$building_coordinated_fulfillment_center_1_plural$§! sẽ tốn thêm £unity£ Thống Nhất."
 relentless_industrialists_situation_completion_tooltip:0 "§Y[Target.GetName]§! sẽ trở thành một §YThế Giới Lăng Mộ§!.\nSự suy thoái môi trường sâu hơn có thể gây ra những biến động xã hội nghiêm trọng."
 relentless_industrialists_situation_locked_tooltip:0 "§RGiờ đã quá muộn để thay đổi Cách Tiếp Cận đối với Tình Huống này.§!"

 toxoids.10.name:0 "Đã Chạm Ngưỡng Bùng Phát"
 toxoids.10.desc:0 "Tổn hại môi trường trên [Target.GetName] giờ đây đã không thể đảo ngược. Các luồng bức xạ độc hại đã bao phủ khắp bề mặt [Target.GetPlanetMoon]. Bầu khí quyển đặc quánh khí độc và các cơn mưa axit đang bắt đầu trút xuống các đô thị."
 toxoids.10.A:0 "Thật đáng tiếc khi họ không nhìn thấy các ưu tiên lớn lao của chúng ta."
 toxoids.10.A.tooltip:0 "Chúng ta sẽ chịu giảm độ ổn định trong khi các hành tinh đang bị biến thành Thế Giới Lăng Mộ."

 toxoids.15.name:0 "$toxoids.10.name$"
 toxoids.15.desc:0 "Tổn hại môi trường trên [Target.GetName] giờ đây đã không thể đảo ngược. Những làn sóng bức xạ và ô nhiễm trên [Target.GetPlanetMoon] đang phá hủy dần hệ sinh thái."
 toxoids.15.A:0 "Đúng như dự liệu."

 toxoids.25.name:0 "Vì Mục Tiêu Tiến Bộ"
 toxoids.25.desc:0 "Quá trình biến đổi đã hoàn tất: [Target.GetName] giờ đây là một thế giới hoang tàn phóng xạ, một Thế Giới Lăng Mộ thực sự. Nền công nghiệp của chúng ta đã chiến thắng sự ngáng đường của tự nhiên."
 toxoids.25.A:0 "Một cái giá rất xứng đáng."
 toxoids.25.A.tooltip:0 "Các công trình §Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta giờ đây sẽ đạt sản lượng tối đa vĩnh viễn trên thế giới này."

 toxoids.30.name:0 "Tri Thức Chuyển Đổi"
 toxoids.30.desc:0 "Quá trình biến đổi đã hoàn tất: [Target.GetName] giờ đây là một vùng đất hoang tàn phóng xạ. Các [Owner.GetResearchers] của chúng ta đã nghiên cứu kỹ lưỡng quy trình này và cam kết có thể tái tạo nó an toàn trên các thế giới khác."
 toxoids.30.desc.thisisfine:0 "Quá trình biến đổi đã hoàn tất: [Target.GetName] giờ đây là một vùng đất hoang tàn phóng xạ. Các [Owner.GetResearchers] của chúng ta đã nắm vững quy trình và sẵn sàng triển khai khi có nhu cầu."
 toxoids.30.A:0 "Tri thức là sức mạnh."
 toxoids.30.A.tooltip:0 "Giờ đây chúng ta có thể địa khai hóa các hành tinh thành §YThế Giới Lăng Mộ§!."

 toxoids.35.name:0 "[Target.GetName] Được Phục Hồi"
 toxoids.35.desc:0 "Những nỗ lực dọn dẹp sâu rộng của chúng ta đã đưa môi trường sinh thái của [Target.GetName] trở lại trạng thái cân bằng an toàn. Bầu trời đã quang đãng và các mối nguy đã bị loại bỏ."
 toxoids.35.A:0 "Mọi sự kết thúc tốt đẹp là điều tuyệt vời nhất."
 toxoids.35.A.tooltip:0 "Các công trình §Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta giờ đây sẽ tiêu tốn thêm chi phí duy trì £unity£ $unity$."

 TOMB_WORLD_FROM_INDUSTRY_MESSAGE_TYPE_TITLE:0 "Khai Thác Không Khoan Nhượng"
 TOMB_WORLD_FROM_INDUSTRY_MESSAGE_TYPE_DESC:0 "Sau nhiều năm hủy hoại môi trường do lòng tham công nghiệp không khoan nhượng, §Y[This.GetName]§! đã trở thành một §YThế Giới Lăng Mộ§!."
 relentless_industrialists_tomb:0 "Suy Thoái Môi Trường"
 relentless_industrialists_tomb_desc:0 "Việc khai thác quá mức đã biến hành tinh này thành một vùng hoang tàn phóng xạ, phá hủy hệ sinh thái nguyên bản."
 requires_not_relentless_industrialists_situation:0 "$TRIGGER_FAIL$§RKhông thể địa khai hóa [This.GetName] do đang diễn ra Tình Huống §Y$relentless_industrialists_situation_type$§!.§!"

 relentless_industrialists_policies_activated:0 "Giờ đây chúng ta có thể điều chỉnh Chính Sách §Y$policy_relentless_industrialists_policy$§!."

 policy_relentless_industrialists_policy:0 "Chủ Nghĩa Công Nghiệp"
 policy_relentless_industrialists_policy_desc:0 "Sống là phải khai thác. Nhưng khai thác đến mức độ biến thế giới thành vùng đất chết là một lựa chọn chiến lược cần được cân nhắc kỹ lưỡng."
 relentless_industrialists_full_steam_ahead_name:0 "Tăng Tốc Toàn Lực"
 relentless_industrialists_full_steam_ahead:0 "$relentless_industrialists_full_steam_ahead_name$"
 relentless_industrialists_full_steam_ahead_desc:0 "Các ngành công nghiệp của chúng ta sẽ không chịu bất kỳ sự ràng buộc nào.\n\nGia tăng phần thưởng sản lượng từ §Y$building_coordinated_fulfillment_center_1_plural$§!."
 relentless_industrialists_study_name:0 "Vì Khoa Học!"
 relentless_industrialists_study:0 "$relentless_industrialists_study_name$"
 relentless_industrialists_study_desc:0 "Có rất nhiều điều để học hỏi từ quá trình chiếu xạ một hành tinh.\n\nCho phép chúng ta địa khai hóa các hành tinh thành §YThế Giới Lăng Mộ§!.\nGiảm hình phạt thích nghi từ §Y$building_coordinated_fulfillment_center_1_plural$§!."
 relentless_industrialists_cleanup_name:0 "Dọn Dẹp Thanh Lọc"
 relentless_industrialists_cleanup:0 "$relentless_industrialists_cleanup_name$"
 relentless_industrialists_cleanup_desc:0 "Chúng ta sẽ thực hiện các biện pháp để giảm thiểu dấu chân môi trường.\n\nCác hành tinh có §Y$building_coordinated_fulfillment_center_1_plural$§! sẽ không còn biến thành §YThế Giới Lăng Mộ§! theo thời gian nữa, nhưng công trình sẽ tốn thêm chi phí duy trì bằng £unity£ §YThống Nhất§!."

 RELENTLESS_INDUSTRIALISTS_STUDY_PROJECT:0 "Bí Quyết Bức Xạ An Toàn Hơn"
 RELENTLESS_INDUSTRIALISTS_STUDY_PROJECT_DESC:0 "Chúng ta sẽ nghiên cứu cách thức chiếu xạ một hành tinh một cách an toàn mà không gây bất tiện quá mức cho dân cư địa phương."

 toxoids.45.desc:0 "Các [This.GetResearchers] của chúng ta đã nghiên cứu kỹ lưỡng các quy trình chiếu xạ mà ngành công nghiệp áp dụng, và cam kết rằng giờ đây họ có thể chuyển đổi an toàn các hệ sinh thái sống động thành môi trường phóng xạ mà không gây hại quá mức cho cư dân bản địa."

 ### Scavengers
 civic_scavengers:0 "Kẻ Thu Gom Phế Liệu"
 civic_scavengers_desc:0 "Trong xã hội này, không có gì bị bỏ phí, ngay cả trong những thời khắc chiến tranh tàn khốc nhất: không công nghệ nào của kẻ thù bị bỏ sót, khi các đội thu gom tháp tùng các hạm đội chiến tranh luôn cạo sạch mọi mảnh vỡ chiến hạm có giá trị trục vớt."
 civic_scavengers_effects:0 "- Nghiên cứu §HMảnh Vỡ Chiến Trận§! mang lại cả $r_research$ và một phần §YChi Phí Tài Nguyên§! của hạm đội bị tiêu diệt\n- Có thể trục vớt và phục hồi trực tiếp §HChiến Hạm§! từ một số §HMảnh Vỡ§!"
 civic_corporate_scavengers_effects: "$civic_scavengers_effects$\n- Công trình £building£ §Y$building_industrial_subsidiary$§! $megacorp_civic_branch_office_building_effect$"
 civic_corporate_scavengers:1 "Ban Tân Trang Thiết Bị"
 civic_corporate_scavengers_desc:0 "$civic_scavengers_desc$"

 trait_incubator:0 "Buồng Ấp Nở"
 incubator_tooltip:1 "Tăng từ §G+30%§! đến §R-10%§! Tốc Độ Tăng Trưởng Dân Số, tỷ lệ nghịch với số lượng Pop hiện có trên hành tinh."
 trait_incubator_desc:1 "§LKhi bị cô lập hoặc có số lượng ít ỏi, một giống loài có đặc tính này sẽ tự nhiên thích ứng và tập trung sinh sản với mức độ mãnh liệt mà người khác coi là cực đoan. Tuy nhiên, khi dân số đông đúc, hiệu ứng này bị đảo ngược và việc sinh sản trở nên khó khăn hơn.§!"

 trait_inorganic_breath:0 "Hơi Thở Vô Cơ"
 inorganic_breath_tooltip:2 "Mỗi $pop_group_unit$ £pop£ §HPop§! làm việc ở tầng lớp Nô lệ trở lên tạo ra 0.02 £exotic_gases£ §Y$exotic_gases$§! mỗi tháng."
 trait_inorganic_breath_desc:0 "§LPhương thức tiêu hóa hơi độc của giống loài này đã dẫn đến việc hơi thở của họ có thành phần khí hiếm cực kỳ đậm đặc.§!"

 trait_noxious:0 "Độc Tính"
 noxious_tooltip:2 "Hạnh phúc đối với các Pop không có đặc tính Độc Tính: §R$@noxious_happiness_penalty|%$§!\n    - Hạnh phúc nhận thêm trên mỗi Pop không có Độc Tính (không bao gồm các Pop không chịu ảnh hưởng của Hạnh phúc): §G$@noxious_happiness_bonus|%$§! (tối đa: §G+40%§!)"
 trait_noxious_desc:1 "§LCực kỳ khó chịu khi ở gần, những sinh vật có đặc tính này lại cảm thấy hả hê khi trở thành nỗi kinh hoàng không thể chịu nổi đối với tất cả những kẻ khác.§!"
 noxious_stock:0 "Pop Độc Tính không thể bị dùng làm gia súc lấy thịt"
 mod_pop_non_noxious_happiness:0 "Hàng Xóm Độc Hại"

 trait_exotic_metabolism:0 "Trao Đổi Chất Dị Biệt"
 exotic_metabolism_tooltip:2 "£exotic_gases£ Chi phí duy trì Khí Hiếm: §R+0.125§!\n$t$- £mod_logistic_growth_mult£ $MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!\n$t$- £mod_pop_environment_tolerance£ $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+25%§!"
 trait_exotic_metabolism_desc:0 "§LMột hệ trao đổi chất dựa trên các loại khí hiếm — và đắt đỏ — đã gia tăng vượt bậc các khả năng sinh học của giống loài này.§!"

 ap_detox:0 "Giải Độc Tinh Cầu"
 ap_detox_desc:1 "Những tiến bộ mới nhất của chúng ta trong kỹ nghệ địa khai hóa cho phép chúng ta thổi bùng sự sống mới vào một nhóm hành tinh từng bị coi là vĩnh viễn chết chóc và không thể cứu vãn."
 detox_tox_worlds:2 "Cho phép địa khai hóa §YỨng Viên Thế Giới Độc Tố§! thành các thế giới cư ngụ được.\nChúng ta có §Y[This.num_toxic_terraform_candidates]§! ứng viên như vậy bên trong biên giới của mình."
 MESSAGE_TOXIC_TERRAFORM_FOUND_TITLE:0 "$toxoids.500.name$"
 MESSAGE_TOXIC_TERRAFORM_FOUND_DESC:0 "Thế giới độc hại [From.GetName] hóa ra lại là một ứng viên tiềm năng đầy hứa hẹn cho việc địa khai hóa, nếu chúng ta nắm vững công nghệ giải độc phù hợp."
 MESSAGE_TERRAFORMING_EVENT_TITLE:0 "Sự Kiện Địa Khai Hóa"

 toxoids.500.name:0 "Phát Hiện Ứng Viên Địa Khai Hóa Độc Tố"
 toxoids.500.desc.intro:2 "Khảo sát chi tiết của chúng ta về [From.GetName] đã tiết lộ rằng dẫu hiện tại không phù hợp cho sự sống do các loại khí độc hiện diện trong khí quyển, nó vẫn có khả năng duy trì một bầu khí quyển thân thiện. Thông qua nỗ lực phối hợp, chúng ta có thể phân giải các độc tố của [From.GetPlanetMoon] thành những hợp chất ít gây chết người hơn."
 toxoids.500.desc.1:0 "$toxoids.500.desc.intro$\n\nĐịa khai hóa thế giới [From.GetPlanetMoon] này sẽ là một kỳ tích kỹ thuật vĩ đại, mở ra một môi trường sống mới cho đế chế của chúng ta."
 toxoids.500.desc.2:0 "$toxoids.500.desc.intro$\n\nChi phí năng lượng sẽ vô cùng tốn kém, nhưng chúng ta thực sự có phương tiện để từng bước địa khai hóa [From.GetPlanetMoon] này thành nơi có thể nuôi dưỡng sự sống một lần nữa."
 toxoids.500.a: "Tiềm năng thức tỉnh thật kỳ diệu..."
 TOXIC_TERRAFORMING_CANDIDATE_EFFECT:1 "§Y[From.GetName]§! có thể được địa khai hóa nếu chúng ta chọn Đặc Quyền Thăng Hoa §H$ap_detox$§!."

 d_tainted_snowcaps:0 "£blocker£ Băng Tuyết Nhiễm Độc"
 d_poisonous_algae:0 "£blocker£ Tảo Độc"
 d_venomous_insects:0 "£blocker£ Côn Trùng Có Nọc Độc"
 d_unpleasant_atmosphere:0 "£blocker£ Khí Quyển Khó Chịu"
 d_rotten_soil:0 "£blocker£ Đất Mục Nát"
 d_tainted_snowcaps_desc:0 "Những tàn tích độc hại cuối cùng của các ngọn núi băng chứa độc từng sừng sững trên thế giới này trước khi được giải độc."
 d_poisonous_algae_desc:1 "Loại tảo độc hại này đã sống sót sau đợt thanh tẩy ban đầu của thế giới, bám chặt vào các nguồn nước ngầm."
 d_venomous_insects_desc:0 "Các ổ sâu bọ mang nọc độc còn sót lại mà chúng ta từng hy vọng đã tuyệt diệt trong quá trình cải tạo khí quyển."
 d_unpleasant_atmosphere_desc:1 "Mùi vị và hương khí khó chịu trong không khí là những gì còn sót lại từ bầu khí quyển độc hại trước đây."
 d_rotten_soil_desc:1 "Ngay cả lớp đất mục nát này cũng sẽ hữu ích cho chúng ta, một khi đã được xử lý và phân hóa thành khoáng chất bổ dưỡng."

 ### Overtuned

 trait_spliced_adaptability:0 "Thích Nghi Ghép Nối"
 trait_spliced_adaptability_desc:1 "§LVài đường cắt ghép di truyền đơn giản ở đây đó và họ có thể hít thở bất kỳ bầu không khí nào mà không cần phàn nàn.§!"
 spliced_adaptability_tooltip:0 "Độ Thích Nghi: §G+20%§!"
 trait_juiced_power:0 "Sức Mạnh Bơm Năng Lượng"
 trait_juiced_power_desc:1 "§LAdrenaline được giải phóng theo nhu cầu kết hợp cùng hormone tăng trưởng cực mạnh cho phép cơ bắp đạt lực bộc phát phi thường.§!"
 juiced_power_tooltip:1 "$BONUS_WORKFORCE_FOR$ Lao Động Phổ Thông: §G+5%§!$TABBED_NEW_LINE$- $soldier_jobs_bonus_workforce_mult$: §G+15%§!"
 trait_crack_miner:1 "Thợ Mỏ Chuyên Tâm"
 trait_crack_miner_desc:0 "§LSự phối hợp tay mắt siêu đẳng, sức bền dường như vô tận và khả năng chịu áp lực cao khiến họ trở thành cỗ máy khai khoáng hoàn hảo.§!"
 crack_miner_tooltip:0 "$BONUS_WORKFORCE_FOR$ ['concept_planet_miners', Thợ Mỏ]: §G+15%§!"
 trait_farm_hands:0 "Chi Canh Tác"
 trait_farm_hands_desc:1 "§LCàng nhiều chi phụ, năng suất làm nông càng cao. Một vài cánh tay phụ được tinh chỉnh chuyên biệt cho việc thu hoạch mùa màng.§!"
 farm_hands_tooltip:0 "$BONUS_WORKFORCE_FOR$ ['concept_planet_farmers', Nông Dân]: §G+15%§!"
 trait_technical_skill:0 "Tài Năng Kỹ Thuật"
 trait_technical_skill_desc:0 "§LCác cơ quan nội tạng bổ sung mang lại sự nhạy cảm bẩm sinh vượt trội đối với dòng điện và mạch năng lượng.§!"
 technical_skill_tooltip:0 "$BONUS_WORKFORCE_FOR$ ['concept_planet_technician', Kỹ Thuật Viên]: §G+15%§!"
 trait_commercial_genius: "Thiên Tài Thương Mại"
 trait_commercial_genius_desc: "§LBằng cách tinh chỉnh sự hòa nhã và hạ thấp lòng trắc ẩn, người ta có thể tạo ra những thương nhân hoàn hảo không bao giờ chùn bước trước lợi nhuận.§!"
 trait_commercial_genius_tooltip: "$BONUS_WORKFORCE_FOR$ ['concept_planet_traders', Thương Nhân]: §G+25%§!"
 trait_crafted_smiles:0 "Nụ Cười Được Kiến Tạo"
 trait_crafted_smiles_desc:0 "§LĐường nét khuôn mặt được tái định hình nhẹ nhàng, một sự kết hợp hoàn hảo giữa các cử chỉ tự nhiên và nụ cười được lập trình sẵn nhằm chiếm trọn lòng tin của đối phương.§!"
 crafted_smiles_tooltip:0 "$BONUS_WORKFORCE_FOR$ ['concept_planet_influential', Giới Có Tầm Ảnh Hưởng]: §G+15%§!"
 trait_low_maintenance:0 "Chi Phí Duy Trì Thấp"
 trait_low_maintenance_desc:1 "§LGiảm thiểu nhu cầu tiêu thụ, bài tiết và thời gian nghỉ ngơi đã tạo nên những cá thể vận hành cực kỳ tiết kiệm tài nguyên.§!"
 low_maintenance_tooltip:0 "Chi Phí Hàng Tiêu Dùng Cho Pop: §G-10%§!"
 trait_artificial_intelligence:1 "Trí Tuệ Tăng Cường"
 trait_artificial_intelligence_desc:0 "§LCàng nhiều mô não đồng nghĩa với càng nhiều năng lực tư duy. Các thùy não bổ sung được kết nối trực tiếp để giải quyết những phương trình phức tạp nhất.§!"
 artificial_intelligence_tooltip:0 "$BONUS_WORKFORCE_FOR$ ['concept_planet_researchers', Nhà Nghiên Cứu]: §G+10%§!"
 trait_gene_mentorship:0 "Chỉ Dẫn Di Truyền"
 trait_gene_mentorship_desc:2 "§LBằng cách kết hợp 'tri thức bản năng' được tái thiết kế về mặt di truyền với khả năng tiếp thu nhanh, các thế hệ đi trước có thể truyền thụ kinh nghiệm cho hậu bối chỉ trong tích tắc.§!"
 gene_mentorship_tooltip:0 "Điểm Kinh Nghiệm Lãnh Đạo Nhận Được: §G+30%§!"
 trait_expressed_tradition:0 "Biểu Hiện Truyền Thống"
 trait_expressed_tradition_desc:0 "§LSự cuồng tín theo yêu cầu: đức tin chẳng qua chỉ là một ly cocktail hormone được chúng ta hoàn thiện. Nơi mà đức tin đó dẫn tới là việc của sự dẫn dắt tiếp theo.§!"
 expressed_tradition_tooltip:0 "$BONUS_WORKFORCE_FOR$ ['concept_planet_bureaucrats', Quan Chức]: §G+10%§!"
 trait_elevated_synapses:0 "Khớp Thần Kinh Nâng Cao"
 trait_elevated_synapses_desc:0 "§LNhư một cỗ máy tính toán, bộ não sinh học thường không chạy ở 100% công suất. Tuy nhiên, chúng ta đã vượt xa mức sử dụng tiêu chuẩn đó. Nếu gặp sự cố, hãy thử tắt đi bật lại xem sao.§!"
 elevated_synapses_tooltip:1 "$BONUS_WORKFORCE_FOR$ ['concept_planet_researchers', Nhà Nghiên Cứu]: §G+20%§!"
 trait_preplanned_growth:0 "Tăng Trưởng Định Sẵn"
 trait_preplanned_growth_desc:1 "§LLên lịch khả năng sinh sản, lên lịch ham muốn, lên lịch mức độ tương thích. Dân số tăng trưởng theo đúng kế hoạch cho một xã hội hùng mạnh và ổn định — chỉ với vài chỉnh sửa nhỏ ở đây đó. Những cá nhân có tính đố kỵ sẽ được chuyển đến Trung Tâm Sinh Sản gần nhất để huấn luyện bắt buộc.§!"
 preplanned_growth_tooltip:0 "Tốc Độ Tăng Trưởng Dân Số: §G+30%§!$TABBED_NEW_LINE$- Sử Dụng Nhà Ở Của Pop: §G-10%§!"
 trait_excessive_endurance:0 "Sức Chịu Đựng Vượt Trội"
 trait_excessive_endurance_desc:0 "§LNhững gen thích nghi mạnh mẽ nhất đã được biểu hiện siêu cường trên những cá thể này. Tỷ lệ đột biến khoảng 30% cho thấy một thí nghiệm tương đối ổn định và thành công rực rỡ.§!"
 excessive_endurance_tooltip:0 "Độ Thích Nghi: §G+30%§!$TABBED_NEW_LINE$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!"

 edict_damn_the_consequences:0 "Mặc Kệ Hậu Quả!"
 edict_damn_the_consequences_desc:1 "Sắc lệnh này đẩy các chỉnh sửa di truyền của chúng ta lên giới hạn tuyệt đối, nhân đôi hiệu quả tích cực của chúng nhưng cũng làm gia tăng hàng loạt tác dụng phụ khủng khiếp, bao gồm cả hiện tượng tự bốc cháy thảm khốc.\n\n§RMặc Kệ Hậu Quả bỏ qua ['concept_edict_fund', Quỹ Sắc Lệnh] và sẽ luôn tiêu tốn 80% thu nhập $unity_with_icon$ Thống Nhất hàng tháng của bạn!§!"
 edict_damn_the_consequences_effects:0 "Mọi hiệu ứng tích cực từ các Đặc Tính §HBiến Đổi Siêu Cường§! được nhân đôi."

