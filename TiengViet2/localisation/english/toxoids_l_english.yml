 building_coordinated_fulfillment_center_1_desc:0 "Dẫu một số người có thể coi các quy trình được áp dụng tại cơ sở này là quá mức hà khắc, kết quả mang lại là không thể bàn cãi. Công nhân được điều phối nhịp nhàng theo chu kỳ hiệu suất tối đa, biến từng giây phút lao động thành sản phẩm thiết thực."
 building_coordinated_fulfillment_center_2:0 "Cơ Sở Đồng Bộ Năng Suất Toàn Diện" #N.B. Corporate speak, doesn't need to mean anything...
 building_coordinated_fulfillment_center_2_desc:0 "Thông qua việc xử lý số liệu không ngừng nghỉ và các đánh giá hiệu suất liên tục, cơ sở này đạt được năng suất lao động tối ưu vượt qua mọi rào cản sinh lý thông thường."
 building_coordinated_fulfillment_center_tooltip:0 "§RThế giới này sẽ bị khai thác không thương tiếc. Rốt cuộc, nó sẽ biến thành một §YThế Giới Lăng Mộ§!.§!"

