 exploration.500.success: "£trigger_yes£$exploration.500.req$"

 exploration.505.name: "Sản xuất 1000 Điểm Nghiên cứu hàng tháng"
 exploration.505.desc: ""
 exploration.505.hint: "Xây thêm ['building:building_research_lab_1']. Ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'], hãy chuyển ['concept_designation'] thành §H$col_research$§!.$focus_other$"
 exploration.505.lore: "§L“Rõ ràng 'sản lượng sáng tạo' quý này của chúng ta đang sụt giảm. Khéo bớt họp hành đi lại moi ra được nhiều đột phá hơn đấy.”§!"
