 conquest.111.lore: "§L“Nặn nhào một sinh mệnh thành thứ binh khí... kẻ gọi là thành tựu, người chê là bất kính. Cơ mà lịch sử thì chỉ vinh danh kẻ sống sót.” —— Tiến sĩ Hask Zumon, Di truyền học và Nghệ thuật Chiến tranh.§!"
