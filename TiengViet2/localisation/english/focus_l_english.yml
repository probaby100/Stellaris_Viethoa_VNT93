 exploration.100.name: "Khảo sát Dị thường"
 exploration.100.desc: ""
 exploration.100.hint: "Sau khi phát hiện £anomaly£['concept_anomaly'], hãy cử một £scientist£['concept_scientist'] để tiến hành khảo sát toàn diện."
 exploration.100.lore: "§L“Chẳng có tín hiệu nào là bình thường sất. Mỗi nhịp nhấp nháy, mỗi tiếng vọng đều có ẩn ý. Vấn đề duy nhất là: ẩn ý đó là gì.”§!"
 exploration.100.req: "Đã khảo sát một dị thường"
 exploration.100.fail: "£trigger_no£$exploration.100.req$"
 exploration.100.success: "£trigger_yes£$exploration.100.req$"

 exploration.105.name: "Khảo sát Hệ Sao"
 exploration.105.desc: ""
 exploration.105.hint: "Dùng £science_ship£['concept_science_ship'] để khảo sát toàn bộ một £system£['concept_system'] mới."
 exploration.105.lore: "§L“Sự bành trướng sẽ dậm chân tại chỗ nếu ta không nắm rõ tường tận những ngôi sao mà mình muốn chiếm giữ.” —— Nhập môn Vẽ Bản đồ Thiên hà, Tái bản lần thứ Bảy.§!"
 exploration.105.req: "Đã khảo sát một hệ sao"
 exploration.105.fail: "£trigger_no£$exploration.105.req$"
 exploration.105.success: "£trigger_yes£$exploration.105.req$"

 exploration.110.name: "Hoàn thành Dự án Đặc biệt"
 exploration.110.desc: ""
 exploration.110.hint: "Ở thẻ $situation_log_view_tab_situation_log$ trong £interface£['concept_situation_log_view'], tìm một ['concept_special_project'] và tiến hành nghiên cứu."
 exploration.110.lore: "§L“Chắc anh nghĩ phân tích dữ liệu là khâu khó nhất chứ gì. Sai rồi, khó nhất là làm sao thuyết phục người ta tin rằng mớ lý thuyết này có tí tác dụng cơ.”§!"
 exploration.110.req: "Đã hoàn thành một dự án đặc biệt"
 exploration.110.fail: "£trigger_no£$exploration.110.req$"
 exploration.110.success: "£trigger_yes£$exploration.110.req$"

 exploration.115.name: "Phát hiện Sinh vật Ngoài Hành tinh"
 exploration.115.desc: ""
 exploration.115.hint: "Dùng £science_ship£['concept_science_ship'] khám phá các £system£['concept_systems'] mới cho đến khi tìm thấy sự sống ngoài hành tinh."
 exploration.115.lore: "§L“Săn lùng sự sống ngoài hành tinh không phải chuyện 'có hay không', mà là 'khi nào'. Còn lúc tìm thấy rồi thì lại phải tự hỏi: chúng ta có nhận ra nổi tụi nó là cái giống gì không?”§!"
 exploration.115.req: "Đã phát hiện sinh vật ngoài hành tinh"
 exploration.115.fail: "£trigger_no£$exploration.115.req$"
 exploration.115.success: "£trigger_yes£$exploration.115.req$"

 exploration.120.name: "Nhận Tùy chọn Nghiên cứu Vĩnh viễn"
 exploration.120.desc: ""
 exploration.120.hint: "Khảo sát £anomaly£['concept_anomalies'], £archaeology£['concept_archaeology_site'] và ['concept_debris'] sau các trận hải chiến. Vài sự kiện sẽ cho bạn một §HTùy chọn Nghiên cứu Vĩnh viễn§! luôn có sẵn cho tới khi hoàn tất nghiên cứu."
 exploration.120.lore: "§L“Bước tiến thực sự không đến từ những cú nhảy vọt, mà là vô vàn những bước đi dò dẫm vào chốn chưa tường.” —— Nguyên lý Khám phá Khoa học, Tập III.§!"
 exploration.120.req: "Đã nhận tùy chọn nghiên cứu vĩnh viễn"
 exploration.120.fail: "£trigger_no£$exploration.120.req$"
 exploration.120.success: "£trigger_yes£$exploration.120.req$"

 exploration.125.name: "Tuyển Nhà khoa học"
 exploration.125.desc: ""
 exploration.125.hint: "Tại £interface£['concept_leaders_view'], hãy tuyển một ['concept_leader'] thuộc nhóm £scientist£['concept_scientist'].$focus_other$"
 exploration.125.lore: "§L“Cái gì cơ, sếp muốn một người vừa biết lập bản đồ kỳ dị lượng tử lại vừa biết tằn tiện ngân sách à? Thế thì chúc sếp may mắn nhé.”§!"
 exploration.125.req: "Đã tuyển một nhà khoa học"
 exploration.125.fail: "£trigger_no£$exploration.125.req$"
 exploration.125.success: "£trigger_yes£$exploration.125.req$"

 exploration.200.name: "Khai quật xong Di chỉ Khảo cổ"
 exploration.200.desc: ""
 exploration.200.hint: "Cử £scientist£['concept_scientist'] tới một £archaeology£['concept_archaeology_site'] và chỉ đạo họ hoàn tất chuỗi sự kiện."
 exploration.200.lore: "§L“Lại thêm một đế chế cổ đại, thêm một tấm gương tày liếp. Anh nghĩ thời nay có ai buồn rút kinh nghiệm không?”§!"
 exploration.200.req: "Đã khai quật xong một di chỉ khảo cổ"
 exploration.200.fail: "£trigger_no£$exploration.200.req$"
 exploration.200.success: "£trigger_yes£$exploration.200.req$"

 exploration.205.name: "Nâng cấp Nhà khoa học"
 exploration.205.desc: ""
 exploration.205.hint: "Phân công một £science_ship£['concept_science_ship'] do £scientist£['concept_scientist'] chỉ huy đi khảo sát £system£['concept_systems'], nghiên cứu £anomaly£['concept_anomalies']. Cũng có thể bổ nhiệm làm ['concept_governor'] hoặc vào ['concept_council'].\n\nMỗi nhiệm vụ đều giúp tích lũy kinh nghiệm, giúp họ nâng cấp và nhận các ['concept_leader_traits'] mới."
 exploration.205.lore: "§L“Tri thức không phải là đích đến, mà là một cây cầu — nó chỉ vươn dài ra khi ta có gan bước lên.” —— Con đường Học giả: Thấu hiểu sinh Trưởng thành.§!"
 exploration.205.req: "Đã nâng cấp nhà khoa học"
 exploration.205.fail: "£trigger_no£$exploration.205.req$"
 exploration.205.success: "£trigger_yes£$exploration.205.req$"

 exploration.210.name: "Quan sát Văn minh Tiền siêu quang"
 exploration.210.desc: ""
 exploration.210.hint: "Dùng £construction_ship£['concept_construction_ship'] để xây §HTrạm Quan sát§! trên quỹ đạo hành tinh có §HVăn minh Tiền siêu quang§!."
 exploration.210.lore: "§L“Tỉ lệ đám này tự san phẳng nhà mình trước khi bay được vào vũ trụ là một phần ba. Đặt cược đi anh em.”§!"
 exploration.210.req: "Đã quan sát văn minh tiền siêu quang"
 exploration.210.fail: "£trigger_no£$exploration.210.req$"
 exploration.210.success: "£trigger_yes£$exploration.210.req$"

 exploration.215.name: "Bổ nhiệm Nhà khoa học làm Thống đốc"
 exploration.215.desc: ""
 exploration.215.hint: "Ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'] hoặc tại £interface£['concept_planets_and_sector_view'], hãy bổ nhiệm một £scientist£['concept_scientist'] làm ['concept_governor'] cho một £sector£['concept_sector'] hay £planet£['concept_planet']."
 exploration.215.lore: "§L“Khoa học không uốn mình theo truyền thống, cũng chẳng dập khuôn sáo rỗng. Hành tinh do nhà khoa học cai quản ắt sẽ tràn ngập sinh khí.” —— Giám tuyển Rosha Tosh, Tiếng vọng Lãnh đạo.§!"
 exploration.215.req: "Đã bổ nhiệm một nhà khoa học làm thống đốc"
 exploration.215.fail: "£trigger_no£$exploration.215.req$"
 exploration.215.success: "£trigger_yes£$exploration.215.req$"

 exploration.220.name: "Vượt Lỗ hổng Vũ trụ"
 exploration.220.desc: ""
 exploration.220.hint: "Sau khi nghiên cứu công nghệ £physics£§H$tech_wormhole_stabilization$§!, hãy điều một £science_ship£['concept_science_ship'] tới khám phá và xuyên qua một §HLỗ sâu§!."
 exploration.220.lore: "§L“Lưu ý: hợp đồng bảo hiểm nhân thọ của Học viện không đền bù cho trường hợp bị xóa sổ bởi nghịch lý du hành thời gian đâu nhé.”§!"
 exploration.220.req: "Đã vượt lỗ hổng vũ trụ"
 exploration.220.fail: "£trigger_no£$exploration.220.req$"
 exploration.220.success: "£trigger_yes£$exploration.220.req$"

 exploration.225.name: "Ký Hiệp định Nghiên cứu"
 exploration.225.desc: ""
 exploration.225.hint: "Ở thẻ $contacts_view_tab_contacts$ trong £interface£['concept_contacts_view'], hãy đề xuất ['concept_diplomatic_pact'] này với một ['concept_empire'] khác."
 exploration.225.lore: "§L“Hai cái đầu lúc nào cũng giải toán nhanh hơn một. Còn hai nền văn minh ư? Cùng bắt tay nhau thì chả biết sẽ đào ra những thứ quái quỷ gì nữa.”§!"
 exploration.225.req: "Đã ký hiệp định nghiên cứu"
 exploration.225.fail: "£trigger_no£$exploration.225.req$"
 exploration.225.success: "£trigger_yes£$exploration.225req$"

 exploration.230.name: "Hoàn thành một Hợp đồng $contract_deep_scan$"
 exploration.230.desc: ""
 exploration.230.hint: "Chấp nhận một hợp đồng §H$contract_deep_scan$§! trên £interface£ ['concept_galaxy_map'], sau đó điều phái một £arkship£ ['concept_arkship'] thực hiện lệnh hạm đội §H$arkship_deep_scan$§! tại ['concept_system'] được chỉ định."
 exploration.230.lore: "§L“Chúng ta đã có thể cảm nhận được những rung động trọng lực nhỏ nhất, hay tiếng ngân nga khe khẽ từ những phiến đá xa xôi nhất. Vũ trụ luôn đền đáp những ai biết chú tâm quan sát.”§!"
 exploration.230.req: "Đã hoàn thành một Hợp đồng $contract_deep_scan$"
 exploration.230.fail: "£trigger_no£$exploration.230.req$"
 exploration.230.success: "£trigger_yes£$exploration.230.req$"

 exploration.300.name: "Xây Đám mây Dyson"
 exploration.300.desc: "(Sản lượng tối thiểu\n30 £physics£, £society£ hoặc £engineering£)"
 exploration.300.hint: "Sau khi nghiên cứu công nghệ £physics£§H$tech_dyson_swarm$§!, tìm một ['concept_star'] phù hợp và dùng £construction_ship£['concept_construction_ship'] để xây £megastructure£['concept_megastructure'] §H$tech_dyson_swarm$§!."
 exploration.300.lore: "§L“Đứng trước đài quan sát và chứng kiến mảng vệ tinh đầu tiên từ từ dang rộng... bạn sẽ thấy thế giới quan của mình sụp đổ. Cái cảm giác thuần phục được ánh sáng của một ngôi sao mới mê đắm làm sao.” —— Tigg Bauri, Kỹ sư Trưởng tàu ISS Di Tuma.§!"
 exploration.300.req: "Đã xây một Đám mây Dyson sản xuất tối thiểu §Y30§! £physics£, £society£ hoặc £engineering£"
