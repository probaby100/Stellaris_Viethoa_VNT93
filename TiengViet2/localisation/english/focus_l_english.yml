 core.126.desc: ""
 core.126.hint: "Để sản xuất £alloys£['concept_alloys'], cần xây £district£['concept_industrial_districts'] ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'].\n\nHoặc có thể mua £alloys£§H$concept_alloys$§! trên £market£['concept_market'] hay từ các ['concept_empires'] khác.$focus_other$"
 core.126.lore: "§L“Hợp kim có thể không lấp lánh cho lắm, nhưng cứ thử đóng một chiếc tàu chiến bằng niềm tin xem.”§!"
