###################
# Core Focus Cards
###################

 core.100.name: "Lập Thuộc địa"
 core.100.desc: ""
 core.100.hint: "Trong thẻ $colony_view_tab_planet_summary$ của £interface£ ['concept_colony_view'], hãy nhấp vào một §HÔ Công Trình§! trống và chọn một £building£ ['concept_building'] để xây dựng."
 core.100.lore: "§L“Một hành tinh mới không chỉ là việc lớn của quốc gia, mà còn là trách nhiệm không thể chối từ.” —— Sổ tay Vận hành Thuộc địa, bản thứ 223.§!"
 core.100.req: "Đã lập một thuộc địa"
 core.100.fail: "£trigger_no£$core.100.req$"
 core.100.success: "£trigger_yes£$core.100.req$"

 core.102.name: "Thiết lập Loại hình Thuộc địa"
 core.102.desc: "(Ngoài thủ đô)"
 core.102.hint: "Dùng một £colony_ship£ ['concept_colony_ship'] để định cư trên một £planet£ ['concept_planet'] có thể sinh sống."
 core.102.lore: "§L“Nói theo kiểu nhà nước thì phân loại thuộc địa giúp tăng hiệu suất. Nhưng xui thay, đây chỉ là cách nói hoa mỹ để biến việc ‘tùy cơ ứng biến’ trông giống một chiến lược kinh tế nào đó.”§!"
 core.102.req: "Đã đổi phân loại thuộc địa cho một hành tinh"
 core.102.fail: "£trigger_no£$core.102.req$"
 core.102.success: "£trigger_yes£$core.102.req$"

 core.104.name: "Xây Trạm Khai thác"
 core.104.desc: ""
 core.104.hint: "Dùng £construction_ship£['concept_construction_ship'] xây một £mining_station£['concept_mining_station'] trên một ['concept_celestial_object'] phù hợp."
 core.104.lore: "§L“Nhiều người chỉ thấy một cục đá trôi nổi. Còn trong mắt chúng tôi, đó là một đống tiền với hình thù hơi cồng kềnh.”§!"
 core.104.req: "Đã xây một Trạm Khai thác"
 core.104.fail: "£trigger_no£$core.104.req$"
 core.104.success: "£trigger_yes£$core.104.req$"

 core.104_1.name: "Xây dựng một trạm tiếp vận"
 core.104_1.desc: ""
 core.104_1.hint: "Sử dụng £construction_ship£ ['concept_logistic_ship'] để xây một £waystation£ ['concept_waystation'] tại một £system£ ['concept_system'] thích hợp."
 core.104_1.lore: "§L“Người du hành khôn ngoan không cản lối dòng sông. Uống ngụm nước mát, xếp đầy hành trang, rồi lại cất bước lên đường.”§!"
 core.104_1.req: "Xây xong một trạm tiếp vận"
 core.104_1.fail: "£trigger_no£$core.104_1.req$"
 core.104_1.success: "£trigger_yes£$core.104_1.req$"

 core.106.name: "Xây Công trình"
 core.106.desc: ""
 core.106.hint: "Tại một thuộc địa không phải thủ đô, hãy chuyển đến thẻ $colony_view_tab_planet_summary$ của £interface£ ['concept_colony_view'] và thay đổi ['concept_designation']."
 core.106.lore: "§L“Công trường hôm nay, văn minh ngày mai.”§!"
 core.106.req: "Đã xây một Công trình"
 core.106.fail: "£trigger_no£$core.106.req$"
 core.106.success: "£trigger_yes£$core.106.req$"

 core.106_1.name: "Thiết lập chỉ định thuộc địa"
 core.106_1.desc: "(Ngoại trừ thủ đô)"
 core.106_1.hint: "Trên một £arkship£ ['concept_arkship'] không phải là thủ đô, hãy đi tới thẻ $colony_view_tab_planet_summary$ của £interface£ ['concept_colony_view'] và thay đổi ['concept_designation']."
 core.106_1.lore: "§L“Mỗi boong tàu đều có chức năng riêng, và việc vạch rõ nhiệm vụ sẽ giúp sự phân công đó trở nên rõ ràng hơn.”§!"
 core.106_1.req: "Thay đổi chỉ định thuộc địa của một con tàu di cư"
 core.106_1.fail: "£trigger_no£$core.106_1.req$"
 core.106_1.success: "£trigger_yes£$core.106_1.req$"

 core.108.name: "Xây Mô-đun Căn cứ Sao"
 core.108.desc: ""
 core.108.hint: "Ở thẻ $starbase_view_tab_command$ trong £interface£['concept_starbase_view'], chọn xây một §HMô-đun Căn cứ Sao§! đang có."
 core.108.lore: "§L“Họ hứa hẹn đủ trò phiêu lưu, nhưng giấu tịt đi vụ phải chịu đựng mấy tháng trời im lặng ngột ngạt cùng hệ thống lọc khí xài đi xài lại. Mãi đến khi Trung tâm Thương mại đi vào hoạt động — rốt cuộc cũng có lý do để nán lại nơi này.”§!"
 core.108.req: "Đã xây một Mô-đun Căn cứ Sao"
 core.108.fail: "£trigger_no£$core.108.req$"
 core.108.success: "£trigger_yes£$core.108.req$"

 core.110.name: "Xây Công trình Căn cứ Sao"
 core.110.desc: ""
 core.110.hint: "Ở thẻ $starbase_view_tab_command$ trong £interface£ ['concept_starbase_view'], chọn xây một §HCông trình Căn cứ Sao§! đang có."
 core.110.lore: "§L“Vị trí trong hệ sao quyết định chức năng của căn cứ; còn các công trình bên trong sẽ mài giũa chức năng đó.” — Kỹ thuật Quỹ đạo: Lý thuyết và Ứng dụng.§!"
 core.110.req: "Đã xây một Công trình Căn cứ Sao"
 core.110.fail: "£trigger_no£$core.110.req$"
 core.110.success: "£trigger_yes£$core.110.req$"

 core.112.name: "Tiếp thu Truyền thống"
 core.112.desc: ""
 core.112.hint: "Ở thẻ $society_management_view_tab_traditions$ trong £interface£['concept_society_management_view'], hãy tiếp thu một ['concept_tradition']."
 core.112.lore: "§L“Thiếu truyền thống thì mất gốc, bám rịt lề thói thì dậm chân tại chỗ. Kẻ khôn ngoan biết tự chọn lối đi riêng.”§!"
 core.112.req: "Đã tiếp thu một Truyền thống"
 core.112.fail: "£trigger_no£$core.112.req$"
 core.112.success: "£trigger_yes£$core.112.req$"

 core.114.name: "Ban hành Sắc lệnh"
 core.114.desc: ""
 core.114.hint: "Ở thẻ §H$government_view_tab_policies_and_edicts$§! trong £interface£['concept_government_view'], hãy ban hành một ['concept_edict']."
 core.114.lore: "§L“Hỡi các công dân: Sắc lệnh 827-B đã chính thức có hiệu lực. Chi tiết xem tại trang 34, mục 12. Chúc một ngày làm việc hiệu quả!”§!"
 core.114.req: "Đã ban hành Sắc lệnh"
 core.114.fail: "£trigger_no£$core.114.req$"
 core.114.success: "£trigger_yes£$core.114.req$"

 core.116.name: "Hoàn thành 3 Nghị trình"
 core.116.desc: ""
 core.116.hint: "Khi ['concept_agenda'] hoàn tất, hãy công bố nó ở thẻ $government_view_tab_council$ trong £interface£['concept_government_view'] và chọn nghị trình mới."
 core.116.lore: "§L“Nhà lãnh đạo thiếu nghị trình cũng như phi thuyền không có đường bay.”§!"
 core.116.req: "Đã hoàn thành 3 Nghị trình"
 core.116.fail: "£trigger_no£$core.116.req$"
 core.116.success: "£trigger_yes£$core.116.req$"

 core.118.name: "Tích lũy 1000 Năng lượng"
 core.118.desc: ""
 core.118.hint: "Để thu thập £energy£['concept_energy'], cần xây £district£['concept_generator_districts'] ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'].\n\nHoặc có thể xây £mining_station£['concept_mining_stations'] trên các ['concept_celestial_objects'] có năng lượng, hay mua £energy£§H$concept_energy$§! trên £market£['concept_market'] hoặc từ các ['concept_empires'] khác.$focus_other$"
 core.118.lore: "§L“Năng lượng không mua được niềm vui, nhưng giao thương thì có thể!”§!"
 core.118.req: "Đã có 1000 Năng lượng"
 core.118.fail: "£trigger_no£$core.118.req$"
 core.118.success: "£trigger_yes£$core.118.req$"

 core.118_1.name: "Có dưới 10000 Dự trữ Vận hành"
 core.118_1.desc: ""
 core.118_1.hint: "Để tiêu hao £operational_reserves£ ['concept_operational_reserves'], cần phải thiết lập §HPhương án giải quyết Tình huống§! thành §H$situation_nomad_economy_full_spending$§!, đồng thời không để £arkship£ ['concept_arkship'] hoặc £construction_ship£ ['concept_logistic_ship'] sử dụng ['scripted_action:arkship_harvest_resources']. $focus_other$"
 core.118_1.lore: "§L“Hãy tận dụng mọi thứ có thể. Chỉ cần biết nơi nào có vùng đất màu mỡ, thì vụ mùa bội thu tiếp theo chắc chắn sẽ không còn xa.”§!"
 core.118_1.req: "Có 10000 Dự trữ Vận hành"
 core.118_1.fail: "£trigger_no£$core.118_1.req$"
 core.118_1.success: "£trigger_yes£$core.118_1.req$"

 core.120.name: "Tích lũy 1000 Khoáng thạch"
 core.120.desc: ""
 core.120.hint: "Để thu thập £minerals£['concept_minerals'], cần xây £district£['concept_mining_districts'] ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'].\n\nHoặc có thể xây £mining_station£['concept_mining_stations'] trên các ['concept_celestial_objects'] giàu khoáng, hay mua £minerals£§H$concept_minerals$§! trên £market£['concept_market'] hoặc từ các ['concept_empires'] khác.$focus_other$"
 core.120.lore: "§L“Hít sâu quá thì lấp phổi, thở cạn quá thì nghẹt thở. Cứ yên tâm về viện phí, tập đoàn sẽ trừ thẳng vào lương của anh.”§!"
 core.120.req: "Đã có 1000 Khoáng thạch"
 core.120.fail: "£trigger_no£$core.120.req$"
 core.120.success: "£trigger_yes£$core.120.req$"

 core.120_1.name: "Có hơn 50000 Dự trữ Vận hành"
 core.120_1.desc: ""
 core.120_1.hint: "Để tăng lượng £operational_reserves£['concept_operational_reserves'], có thể cho £arkship£ ['concept_arkship'] hoặc £construction_ship£['concept_logistic_ship'] sử dụng tính năng ['scripted_action:arkship_harvest_resources'].\n\nHoặc có thể mua £energy£§H$concept_energy$§! hay £minerals£§H$concept_minerals$§! trên £market£ ['concept_market']. $focus_other$"
 core.120_1.lore: "§L“Một sĩ quan hậu cần kỳ cựu từng nói: Của để dành hôm nay chính là lối thoát cho lúc nguy nan ngày mai.”§!"
 core.120_1.req: "Có 50000 Dự trữ Vận hành"
 core.120_1.fail: "£trigger_no£$core.120_1.req$"
 core.120_1.success: "£trigger_yes£$core.120_1.req$"

 core.122.name: "Tích lũy 1000 Lương thực"
 core.122.desc: ""
 core.122.hint: "Để thu thập £food£['concept_food'], cần xây £district£['concept_farming_districts'] ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'].\n\nHoặc có thể mua £food£§H$concept_food$§! trên £market£['concept_market'] hay từ các ['concept_empires'] khác.$focus_other$"
 core.122.lore: "§L“Kho lúa đầy thì nước mới mạnh. Bụng mà đói meo thì quốc gia sớm muộn cũng tiêu tùng.”§!"
 core.122.req: "Đã có 1000 Lương thực"
 core.122.fail: "£trigger_no£$core.122.req$"
 core.122.success: "£trigger_yes£$core.122.req$"

 core.122_1.name: "Có 3000 Thức ăn"
 core.122_1.desc: ""
 core.122_1.hint: "Để thu thập £food£['concept_food'], cần phải xây dựng £district£['concept_farming_districts'] tại thẻ $colony_view_tab_planet_summary$ của £interface£['concept_colony_view'].\n\nHoặc có thể mua £food£§H$concept_food$§! trên £market£['concept_market'] hay từ các ['concept_empires'] khác. $focus_other$"
 core.122_1.lore: "§L“Đi nhanh thì cũng phải ăn no, ngôi sao tiếp theo đâu có gần như vẻ bề ngoài của nó.”§!"
 core.122_1.req: "Đã có 3000 Thức ăn"
 core.122_1.fail: "£trigger_no£$core.122_1.req$"
 core.122_1.success: "£trigger_yes£$core.122_1.req$"

 core.124.name: "Tích lũy 1000 Hàng Tiêu dùng"
 core.124.desc: ""
 core.124.hint: "Để sản xuất £consumer_goods£['concept_consumer_goods'], cần xây £district£['concept_industrial_districts'] ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'], hoặc mua £consumer_goods£§H$concept_consumer_goods$§! trên £market£['concept_market'] hay từ các ['concept_empires'] khác.$focus_other$"
 core.124.lore: "§L“Hàng tiêu dùng thúc đẩy sáng tạo, nâng tầm văn hóa và thỏa mãn nhu cầu của dân chúng. Rốt cuộc nó là cái gì? Hàng xa xỉ? Đồ nghề cao cấp? Hay chỉ là một chiếc mũ đẹp? Tất cả những thứ đó.”§!"
 core.124.req: "Đã có 1000 Hàng Tiêu dùng"
 core.124.fail: "£trigger_no£$core.124.req$"
 core.124.success: "£trigger_yes£$core.124.req$"

 core.124_1.name: "Có 2000 Hàng tiêu dùng"
 core.124_1.desc: ""
 core.124_1.hint: "Để thu thập £consumer_goods£ ['concept_consumer_goods'], cần phải xây dựng £district£ ['concept_industrial_districts'] tại thẻ $colony_view_tab_planet_summary$ của £interface£ ['concept_colony_view'], hoặc có thể mua £consumer_goods£ §H$concept_consumer_goods$§! trên £market£ ['concept_market'] hay từ các ['concept_empires'] khác. $focus_other$"
 core.124_1.lore: "§L“Trên con tàu di cư, mỗi sợi dây, mạch điện, cho đến những món đồ tiện nghi đều có hai cuộc đời: lần đầu là khi được tạo ra, và lần sau là nhờ vào sự gìn giữ bảo quản.”§!"
 core.124_1.req: "Đã có 2000 Hàng tiêu dùng"
