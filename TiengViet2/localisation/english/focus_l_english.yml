 development.335.name: "Khai thác lộ thiên Hành tinh"
 development.335.desc: ""
 development.335.hint: "Tại £interface£ §HGóc nhìn Hạm đội§! của £arkship£ ['concept_arkship'], hãy nhấp vào lệnh hạm đội §H$arkship_strip_mine$§!, sau đó chọn một ['concept_planet'] thích hợp."
 development.335.lore: "§L“Nói lịch sự là khai thác. Nói thật lòng là bòn rút cho bằng sạch. Dù sao đi nữa, các khoang chứa hàng cũng đã đầy ắp.”§!"
 development.335.req: "Đã tiến hành khai thác lộ thiên trên một hành tinh"
 development.335.fail: "£trigger_no£$development.335.req$"
 development.335.success: "£trigger_yes£$development.335.req$"

 development.400.name: "Liên bang Cấp 5"
 development.400.desc: ""
 development.400.hint: "Bố trí một £official£['concept_official'] sang làm đại diện ở ['concept_federation'] để cày §HKinh nghiệm Liên bang§!."
 development.400.lore: "§L“Trải qua năm vòng ban bệ, qua tay mấy trăm cái ủy ban, chém gió mất mấy nghìn cuộc họp — thế quái nào mà phe ta lại phất lên cơ chứ.”§!"
 development.400.req: "Trở thành thành viên Liên bang cấp 5"
 development.400.fail: "£trigger_no£$development.400.req$"
 development.400.success: "£trigger_yes£$development.400.req$"

 development.405.name: "Xây Quả cầu Dyson"
 development.405.desc: ""
 development.405.hint: "Sau khi nghiên cứu công nghệ £physics£§H$tech_dyson_sphere$§!, hãy nâng cấp £megastructure£['concept_megastructure'] §H$tech_dyson_swarm$§! lên thành §H$tech_dyson_sphere$§!.$focus_other$" # With Machine Age
 development.406.hint: "Sau khi nghiên cứu công nghệ £physics£§H$tech_dyson_sphere$§!, tìm một ['concept_star'] phù hợp và phái £construction_ship£['concept_construction_ship'] tới xây £megastructure£['concept_megastructure'] §H$tech_dyson_sphere$§!.$focus_other$" # Without Machine Age
 development.405.lore: "§L“Nền văn minh chóp bu chả rảnh đi giành giật tài nguyên, tụi nó ngồi kẻ vạch xem tài nguyên là cái khỉ gì cơ.” —— Bước ngoặt của Tầng thứ Ba.§!"
 development.405.req: "Đã xây Quả cầu Dyson"
 development.405.fail: "£trigger_no£$development.405.req$"
 development.405.success: "£trigger_yes£$development.405.req$"

 development.410.name: "Xây Thế giới Nhẫn"
 development.410.desc: ""
 development.410.hint: "Sau khi nghiên cứu công nghệ £physics£§H$tech_ring_world$§!, tìm một ['concept_star'] phù hợp và phái £construction_ship£['concept_construction_ship'] tới xây £megastructure£['concept_megastructure'] §H$tech_ring_world$§!.$focus_other$"
 development.410.lore: "§L“Tắm trong ánh sáng của mặt trời quê hương, thế giới nhẫn mĩ miều là thế. Có ai dè bóng ma quân thù lại ập đến...” —— Nhật ký Adeaf Youvi-Wadiv, Tiêu chuẩn 174.§!"
 development.410.req: "Đã xây Thế giới Nhẫn"
 development.410.fail: "£trigger_no£$development.410.req$"
 development.410.success: "£trigger_yes£$development.410.req$"

 development.415.name: "Có 3 Quan chức Cấp 5"
 development.415.desc: ""
 development.415.hint: "$development.230.hint$"
 development.415.lore: "§L“Hàng chục năm kinh nghiệm đè đầu cưỡi cổ dân chúng giúp họ nhuyễn đến mức thượng thừa mấy trò làm luật, ngã giá và đá quả bóng trách nhiệm.”§!"
 development.415.req: "Đã có 3 quan chức cấp 5"
 development.415.fail: "£trigger_no£$development.415.req$"
 development.415.success: "£trigger_yes£$development.415.req$"

 development.420.name: "Sở hữu Tuyến trạm"
 development.420.desc: "(Ít nhất 5 trạm tiếp vận)"
 development.420.hint: "Xây dựng £waystation£ ['concept_waystations'] ở các hệ sao lân cận để tạo thành một £wayline£ ['concept_wayline']."
 development.420.lore: "§L“Một trạm tiếp vận đơn lẻ chỉ như tiếng thì thầm. Hãy kết nối chúng lại, rồi cả thiên hà sẽ nghe thấy tiếng nói của bạn.”§!"
 development.420.req: "Có một Tuyến trạm với độ dài bằng 5"
 development.420.fail: "£trigger_no£$development.420.req$"
 development.420.success: "£trigger_yes£$development.420.req$"

 development.425.name: "Sở hữu 3 Tàu di cư"
 development.425.desc: ""
 development.425.hint: "Để xây dựng một £arkship£ ['concept_arkship'] mới, hãy chọn một §H$concept_arkship$§! hiện có, sau đó nhấp vào §HXây dựng Siêu cấu trúc§!. Cuối cùng, chọn loại Tàu di cư mà bạn muốn xây dựng."
 development.425.lore: "§L“Một cánh cung hướng về rìa thiên hà, một cánh hướng vào lõi rực lửa của nó, và một cánh hướng đến những nơi chưa hề được đặt tên trên bản đồ sao.”§!"
 development.425.req: "Đã có 3 Tàu di cư"
 development.425.fail: "£trigger_no£$development.425.req$"
 development.425.success: "£trigger_yes£$development.425.req$"

 development.435.name: "Xây dựng $civilian_arkship_name$"
 development.435.desc: ""
 development.435.hint: "Để xây dựng một §H$civilian_arkship_name$§! mới, hãy chọn một £arkship£ ['concept_arkship'] hiện có, sau đó nhấp vào §HXây dựng Siêu cấu trúc§!. Cuối cùng, chọn loại Tàu di cư mà bạn muốn xây dựng."
 development.435.lore: "§L“Các thành phố luôn khao khát được vươn mình mở rộng, còn những con Tàu di cư lại mơ về những chốn vô định ở phía trước.” —— Chuyên viên lưu trữ Thor Ennara, trích 'Bàn về bản chất của Quê hương'§!"
 development.435.req: "Đã xây xong một $civilian_arkship_name$"
 development.435.fail: "£trigger_no£$development.435.req$"
 development.435.success: "£trigger_yes£$development.435.req$"

 development.500.name: "Xây Hội trường Vĩ mô"
 development.500.desc: ""
 development.500.hint: "Sau khi nghiên cứu công nghệ £society£§H$tech_interstellar_assembly$§!, tìm một ['concept_star'] phù hợp và phái £construction_ship£['concept_construction_ship'] tới xây £megastructure£['concept_megastructure'] §H$tech_interstellar_assembly$§!.$focus_other$"
 development.500.lore: "§L“Nắm được cái loa liên lạc là nắm luôn cả guồng quay lịch sử.” —— Ái nữ của Tối cao Tổng lý Sagu Subu.§!"
 development.500.req: "Đã xây Hội trường Vĩ mô"
 development.500.fail: "£trigger_no£$development.500.req$"
 development.500.success: "£trigger_yes£$development.500.req$"

 development.505.name: "Sản lượng Hàng Tiêu dùng +3000/tháng"
 development.505.desc: ""
 development.505.hint: "Để chế tạo £consumer_goods£['concept_consumer_goods'], hãy xây £district£['concept_industrial_districts'] và £building£['building:building_factory_1'] ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view']. Bạn cũng có thể mua £consumer_goods£§H$concept_consumer_goods$§! trên £market£['concept_market'] hoặc từ các ['concept_empires'] khác."
 development.505.lore: "§L“Đám đó chả nhét cái của nợ này vào bụng, cũng chả đắp vào cỗ máy chiến tranh. Có thứ lại chỉ mang về... để ngắm. Sự cồng kềnh thảm hại của từng cá thể thực sự làm người ta phát điên.”§!"
 development.505.req: "Sản lượng hàng tiêu dùng hàng tháng đạt +3000"
 development.505.fail: "£trigger_no£$development.505.req$"
 development.505.success: "£trigger_yes£$development.505.req$"

 development.510.name: "Có Quan hệ +200 với 10 Đế chế"
 development.510.desc: ""
 development.510.hint: "$development.100.hint$"
 development.510.lore: "§L“Nhân duyên rộng quá đâm ra cũng hao tâm tổn trí phết đấy.”§!"
 development.510.req: "Đã đạt quan hệ +200 với 10 đế chế"
 development.510.fail: "£trigger_no£$development.510.req$"
 development.510.success: "£trigger_yes£$development.510.req$"

 development.515.name: "Nhúng Trứng Siêu thú Xơi sao"
 development.515.desc: ""
 development.515.hint: "Để ấp §HTrứng Siêu thú Xơi sao§!, chọn ['concept_construction_ship'] rồi ấn §HXây Cấu trúc Khổng lồ§!. Chọn cái Trứng trong danh sách, tìm một §HKhí khổng lồ§! ưng mắt và chôn cái trứng ngay trên quỹ đạo nó."
 development.515.lore: "§L“Mục sở thị cái bóng đen khổng lồ đè kín mặt trăng kia. Chẳng phải tàu chiến, chẳng phải bão tố. Đó là thứ gì vĩ đại hơn nhiều... một thực thể sống.” —— Lời khai, Thuộc địa E-91.§!"
 development.515.req: "Đã nhúng Trứng Siêu thú Xơi sao"
 development.515.fail: "£trigger_no£$development.515.req$"
 development.515.success: "£trigger_yes£$development.515.req$"

 development.520.name: "Xây Viện Khảo cứu Bệ Gen"
 development.520.desc: ""
 development.520.hint: "Xây §HViện Khảo cứu Bệ Gen§! trên một ô ['concept_building'] còn trống tại một trong số các hành tinh của bạn."
 development.520.lore: "§L“Mã gen mà sinh ra không phải để người ta vọc vạch, thì tại sao nó lại dễ thọc gậy bánh xe thế hả?”§!"
 development.520.req: "Đã xây Viện Khảo cứu Bệ Gen"
 development.520.fail: "£trigger_no£$development.520.req$"
 development.520.success: "£trigger_yes£$development.520.req$"

 development.525.name: "Xây Dựng Xưởng Tàu Chủ Lực"
 development.525.desc: "(Bệ Pháo Trục Chính Tàu Phương Châu)"
 development.525.hint: "Để lắp §HBệ Pháo Trục Chính§! lên £arkship£ ['concept_arkship'], hãy mở tab §H$ARKSHIP_CONTROLS$§! trong £interface£ ['concept_colony_view'] trên một §HTàu Phương Châu§! đã nâng cấp tối đa. Bấm vào §HÔ Lắp Bệ Pháo Trục Chính§! và chọn §HXưởng Tàu Chủ Lực§! từ danh sách."
 development.525.lore: "§L\"Mỗi lần chỉnh hướng, mỗi vòng quỹ đạo, mỗi cú trôi dạt: xưởng tàu đều vận hành bền bỉ vượt qua tất cả.\"§!"
 development.525.req: "Đã lắp Xưởng Tàu Chủ Lực"
 development.525.fail: "£trigger_no£ $development.525.req$"
 development.525.success: "£trigger_yes£ $development.525.req$"

