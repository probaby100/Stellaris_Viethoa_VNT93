 exploration.300.success: "£trigger_yes£$exploration.300.req$"

 exploration.305.name: "Nhận Viện trợ Nghiên cứu của Vùng không gian"
 exploration.305.desc: ""
 exploration.305.hint: "Sau khi thiết lập liên lạc, mở thẻ $contacts_view_tab_contacts$ trong $concept_contacts_view$ để đề nghị §HHỗ trợ Nghiên cứu§! từ §HKhu biệt lập Giám tuyển§!."
 exploration.305.lore: "§L“Tôi từng hỏi Hội Giám tuyển xem đâu là phát kiến khoa học vĩ đại nhất lịch sử. Họ chỉ cười nhạt rồi đáp: Cái tiếp theo.”§!"
 exploration.305.req: "Đã nhận viện trợ nghiên cứu của vùng không gian"
 exploration.305.fail: "£trigger_no£$exploration.305.req$"
 exploration.305.success: "£trigger_yes£$exploration.305.req$"

 exploration.310.name: "Xây 5 $building_research_lab_1$"
 exploration.310.desc: ""
 exploration.310.hint: "Ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'], hãy xây năm $building_research_lab_1$ rải rác trên một hoặc nhiều £colony£['concept_colonies']."
 exploration.310.lore: "§L“Mới quất có năm cái phòng thí nghiệm thôi mà đống ngân sách cấp cho chúng tôi đã bốc hơi đi đâu mất rồi.”§!"
