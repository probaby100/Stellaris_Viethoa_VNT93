 core.128.name: "Xây Khu Đô thị"
 core.128.desc: ""
 core.128.hint: "Ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'], hãy xây £district£['concept_city_district']."
 core.128.lore: "§L“Đường chân trời của thành phố là thước đo cho tham vọng của người dân. Xây càng cao, khát vọng càng vươn xa.”§!"
