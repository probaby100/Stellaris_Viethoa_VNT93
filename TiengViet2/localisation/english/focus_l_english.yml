 core.127.hint: "Xây một £district£['concept_hive_district'] tại £colony£['concept_colony']."
 core.127.lore: "§L“Thêm chút đường hầm, thêm vài ong thợ, thêm tổ đàn, cứ thế mà đắp thêm.”§!"
