 exploration.415.success: "£trigger_yes£$exploration.415.req$"

 exploration.420.name: "Có 3 Nhà khoa học Cấp 5"
 exploration.420.desc: ""
 exploration.420.hint: "$exploration.205.hint$"
 exploration.420.lore: "§L“Ba nhà khoa học, ba học thuyết, và ba lý do để bất kỳ hai người nào cũng không sao tiêu hóa nổi những gì người thứ ba đang nói.”§!"
 exploration.420.req: "Đã có 3 nhà khoa học cấp 5"
 exploration.420.fail: "£trigger_no£$exploration.420.req$"
 exploration.420.success: "£trigger_yes£$exploration.420.req$"

 exploration.425.name: "Xây dựng một $science_arkship_name$"
 exploration.425.desc: ""
 exploration.425.hint: "Để xây dựng một §H$science_arkship_name$§! mới, hãy chọn một £arkship£ ['concept_arkship'] hiện có và nhấp vào §HXây dựng Siêu cấu trúc§!. Tại đó, hãy chọn loại chỉ định tàu di cư để tiến hành xây dựng."
 exploration.425.lore: "§L“Thư viện xây trên hành tinh rồi cũng sẽ vỡ vụn, còn xây trên phi thuyền thì sẽ đồng hành cùng ta đi muôn nơi. Trước khi sự tò mò của chúng ta cạn kiệt, mọi bí ẩn của vũ trụ sẽ được phơi bày.” —— Diễn văn tốt nghiệp tại Học viện Khoa học Tàu di cư của Giáo sư Lien Toladi§!"
 exploration.425.req: "Đã xây xong một $science_arkship_name$"
 exploration.425.fail: "£trigger_no£$exploration.425.req$"
 exploration.425.success: "£trigger_yes£$exploration.425.req$"

 exploration.500.name: "Xây Nút mạng Khoa học"
 exploration.500.desc: ""
 exploration.500.hint: "Sau khi nghiên cứu công nghệ £physics£§H$tech_mega_shipyard$§!, tìm một £planet£['concept_planet'] hoặc ['concept_star'] phù hợp và phái £construction_ship£['concept_construction_ship'] tới xây £megastructure£['concept_megastructure'] §H$tech_mega_shipyard$§!."
 exploration.500.lore: "§L“Với trung tâm này, miễn là giải pháp đó tồn tại trong thời đại của chúng ta, thì không có gì là không thể làm được.”§!"
 exploration.500.req: "Đã xây Nút mạng Khoa học"
