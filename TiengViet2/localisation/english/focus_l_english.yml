 exploration.510.success: "£trigger_yes£$exploration.510.req$"

 exploration.600.name: "Phát hiện Quái thú Không gian"
 exploration.600.desc: ""
 exploration.600.hint: "Dùng £science_ship£['concept_science_ship'] khám phá các £system£['concept_systems'] chưa biết, cho đến khi phát hiện ra một siêu thú không gian."
 exploration.600.lore: "§L“Truy tìm siêu thú là việc rất rủi ro. Nhưng lỡ mà chạm trán rồi thì phải tự hỏi: Đứng trước sức mạnh nhường này, làm sao mới sống sót nổi?”§!"
