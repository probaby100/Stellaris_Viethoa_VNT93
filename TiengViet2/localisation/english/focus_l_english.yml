 exploration.315.success: "£trigger_yes£$exploration.315.req$"

 exploration.320.name: "Có Nhà khoa học Lão luyện"
 exploration.320.desc: "(Đạt cấp 4)"
 exploration.320.hint: "$exploration.205.hint$"
 exploration.320.lore: "§L“Nhà khoa học đích thực không chỉ tích lũy kiến thức, mà là mở mang tầm nhìn.”§!"
 exploration.320.req: "Đã có một nhà khoa học lão luyện"
 exploration.320.fail: "£trigger_no£$exploration.320.req$"
 exploration.320.success: "£trigger_yes£$exploration.320.req$"

 exploration.325.name: "Cải tạo Môi trường 3 Hành tinh"
 exploration.325.desc: ""
 exploration.325.hint: "Sau khi nghiên cứu công nghệ £society£§H$tech_terrestrial_sculpting$§!, tìm một £planet£['concept_planet'] phù hợp để ['concept_terraforming'] và tiến hành cải tạo."
 exploration.325.lore: "§L“Đọc xong bản cập nhật mới nhất của chu trình cải tạo môi trường chưa? Bọn họ vừa thêm bãi biển vào đấy!”§!"
 exploration.325.req: "Đã cải tạo môi trường 3 hành tinh"
 exploration.325.fail: "£trigger_no£$exploration.325.req$"
 exploration.325.success: "£trigger_yes£$exploration.325.req$"

 exploration.400.name: "Nghiên cứu Công nghệ Tuần hoàn"
 exploration.400.desc: ""
 exploration.400.hint: "Trong £interface£['concept_technology_view'], tìm và nghiên cứu một §HCông nghệ Tuần hoàn§! (nhận biết qua viền biểu tượng đặc biệt)."
 exploration.400.lore: "§L“Lại thêm một đột phá, thêm một bước tiến. Nhưng chân trời thì sao? Chẳng hề xích lại gần thêm tẹo nào.” —— Nhà khoa học Trưởng Eri Canto.§!"
 exploration.400.req: "Đã nghiên cứu một công nghệ tuần hoàn"
 exploration.400.fail: "£trigger_no£$exploration.400.req$"
 exploration.400.success: "£trigger_yes£$exploration.400.req$"

 exploration.405.name: "Chiếm Công trình Đế chế Sụp đổ"
 exploration.405.desc: ""
 exploration.405.hint: "Đánh bại một ['concept_fallen_empire'].$focus_other$"
 exploration.405.lore: "§L“Thấy chưa, đây chính là sự huy hoàng của lịch sử. Nếu như ta biết cách xài chúng...”§!"
 exploration.405.req: "Đã chiếm được công trình đế chế sụp đổ"
 exploration.405.fail: "£trigger_no£$exploration.405.req$"
 exploration.405.success: "£trigger_yes£$exploration.405.req$"

 exploration.410.name: "Nghiên cứu Mảnh vỡ Đế chế Sụp đổ"
 exploration.410.desc: ""
 exploration.410.hint: "Sau một trận hải chiến với ['concept_fallen_empire'], hãy cử một £science_ship£['concept_science_ship'] đến điều tra ['concept_special_project']."
 exploration.410.lore: "§L“Mỗi khi nhắc về những huyền thoại cổ xưa, người ta hay tự hỏi: Nước mất là do ngoại xâm quá mạnh, hay do chính bản thân nó tự diệt?” —— Vương Miện Vỡ Nát: Khảo luận về sự Suy tàn của Thiên hà.§!"
 exploration.410.req: "Đã nghiên cứu mảnh vỡ đế chế sụp đổ"
 exploration.410.fail: "£trigger_no£$exploration.410.req$"
 exploration.410.success: "£trigger_yes£$exploration.410.req$"

 exploration.415.name: "Nghiên cứu Mảnh vỡ Khủng hoảng"
 exploration.415.desc: ""
 exploration.415.hint: "Sau một trận hải chiến với §HKhủng hoảng§!, hãy cử một £science_ship£['concept_science_ship'] đến điều tra ['concept_special_project']."
 exploration.415.lore: "§L“Thấu hiểu món vũ khí là bước đầu tiên để sử dụng nó. Vấn đề chỉ là bạn có đủ tỉnh táo để nghĩ lại hay không mà thôi.” —— Tư lệnh Hask Vargan, Hiệu ứng Quy mô của Quyền lực.§!"
 exploration.415.req: "Đã nghiên cứu mảnh vỡ khủng hoảng"
