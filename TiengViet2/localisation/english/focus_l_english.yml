 exploration.510.name: "Kích hoạt 10 lần Thánh tích"
 exploration.510.desc: "(Một hoặc nhiều Thánh tích)"
 exploration.510.hint: "Ở thẻ $discoveries_view_tab_relics$ trong £interface£['concept_discoveries_view'], hãy kích hoạt ['concept_relics'] tổng cộng 10 lần."
 exploration.510.lore: "§L“Hướng dẫn chi tiết của món thánh tích này được tìm thấy trên một diễn đàn điện tử cổ đại. Kích hoạt nó chắc cũng xơi kẹo thôi.”§!"
