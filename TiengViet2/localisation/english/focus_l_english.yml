 exploration.310.success: "£trigger_yes£$exploration.310.req$"

 exploration.315.name: "Khám phá xong Rãnh nứt Tinh giới"
 exploration.315.desc: ""
 exploration.315.hint: "Sau khi nghiên cứu công nghệ £physics£§H$tech_rift_sphere$§!, hãy cử £scientist£['concept_scientist'] tới một ['concept_astral_rift'] và chỉ đạo họ hoàn tất chuỗi sự kiện."
 exploration.315.lore: "§L“Nó chà đạp vật lý, xé nát thời gian, và có khi còn xóa sổ luôn sự tồn tại của chúng ta. Nhưng làm sao kiềm được sự tò mò muốn chọc ngoáy vào nó chứ.”§!"
 exploration.315.req: "Đã hoàn tất khám phá rãnh nứt tinh giới"
