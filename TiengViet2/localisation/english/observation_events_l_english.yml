 observation.1406.end:0 "Trong khi các nhà nghiên cứu của ta đang quan sát từ quỹ đạo an toàn, cuộc xung đột đã nhanh chóng phát triển thành một đợt tấn công bằng vũ khí hạt nhân lẫn nhau trên phạm vi toàn cầu.\n\n[pre_ftl_planet.GetPlanetHabitat] đã bị tàn phá nghiêm trọng, toàn bộ các thành phố lớn đều bị phá hủy, 90% dân số bị tiêu diệt. Những người sống sót lẻ tẻ hiện diện từ trong đống đổ nát, nhưng các nhà nghiên cứu của ta dự đoán nền văn minh [pre_ftl_planet.GetPlanetHabitat] sẽ thoái lui về một trạng thái kém phát triển hơn nhiều so với hiện tại."
 observation.1406.gestalt.end:0 "Trong khi các [root.GetIndividualNamePlural] quan sát của ta đang quan sát từ quỹ đạo an toàn, cuộc xung đột đã nhanh chóng phát triển thành một đợt tấn công bằng vũ khí hạt nhân lẫn nhau trên phạm vi toàn cầu.\n\n[pre_ftl_planet.GetPlanetHabitat] đã bị tàn phá nghiêm trọng, toàn bộ các thành phố lớn đều bị phá hủy, 90% dân số bị tiêu diệt. Những người sống sót lẻ tẻ hiện diện từ trong đống đổ nát, nhưng chúng ta dự đoán nền văn minh [pre_ftl_planet.GetPlanetHabitat] sẽ thoái lui về một trạng thái kém phát triển hơn nhiều so với hiện tại."

