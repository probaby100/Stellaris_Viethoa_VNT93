 #Refactored Observation Events

 observation.2011.name:2 "Khai sáng công nghệ: Trở ngại trên [pre_ftl_planet.GetName]"
 observation.2011.desc:1 "Các cố vấn của ta trên [pre_ftl_planet.GetName] đã cố gắng giáo dục cư dân địa phương nhằm nâng cao trình độ công nghệ của họ, nhưng nhiệm vụ này đã gặp phải một số trở ngại. Nhiều [pre_ftl_planet.Owner.GetSpeciesNamePlural] từ chối tiếp xúc với ta, thậm chí những người hiếu học trong số họ cũng giữ thái độ hoài nghi và chán ghét đối với các nhà khoa học của ta.\n\nTâm lý bài ngoại này đã làm chậm trễ lịch trình của chúng ta. Việc giáo dục các [pre_ftl_planet.Owner.GetSpeciesNamePlural] tốn nhiều thời gian hơn chúng ta dự tính."
 observation.2014.name:1 "Phát triển công nghệ: Tiến triển trên [pre_ftl_planet.GetName]"
 observation.2014.desc:1 "Cư dân trên [pre_ftl_planet.GetName] cảm thấy vui mừng vì những công nghệ mà chúng ta chia sẻ. Họ nườm nượp kéo tới các vùng biệt lập mà ta thiết lập trên hành tinh của họ, hỏi dồn dập các câu hỏi liên quan đến văn hóa và lịch sử của chúng ta.\n\nSự khao khát học hỏi từ chúng ta của các [pre_ftl_planet.Owner.GetSpeciesNamePlural] đã thúc đẩy tiến độ nhiệm vụ nâng cao trình độ công nghệ của nền văn minh này, vì thế chúng ta đã sửa đổi đánh giá ban đầu về thời gian cần thiết cho nhiệm vụ."
 observation.2014.tt:0 "§Y[pre_ftl_country.GetName]§!: §G+20%§! tiến bộ công nghệ."
 observation.2016.name:1 "Phát triển công nghệ: Trở ngại trên [pre_ftl_planet.GetName]"
 observation.2016.desc:1 "Thật không may, chúng ta phát hiện các [pre_ftl_species.GetName] trên [pre_ftl_planet.GetName] rất khó giáo dục. Các cố vấn khoa học báo cáo rằng, những người ngoài hành tinh này chuyển biến rất chậm chạp trong việc từ bỏ truyền thống của bản thân để tiếp nhận những khái niệm và lý niệm mới. Xem ra thời gian nhiệm vụ của chúng ta sẽ dài hơn dự kiến một chút."
 observation.2016.tt:0 "§Y[pre_ftl_country.GetName]§!: §R-20%§! tiến bộ công nghệ."
 observation.2018.name:1 "Phát triển công nghệ: Trở ngại trên [pre_ftl_planet.GetName]"
 observation.2018.desc:1 "Chúng ta đã gặp khó khăn trong việc sắp xếp các nhà khoa học đi thực hiện nhiệm vụ phát triển công nghệ trên [pre_ftl_planet.GetName]. Bởi vì [pre_ftl_species.GetName] sở hữu ngoại hình và mùi hương... độc lạ, nói sao nhỉ, việc có thể đứng vững trước mặt họ thôi cũng đã không dễ dàng gì rồi.\n\nViệc đi thực hiện nhiệm vụ trên bề mặt [pre_ftl_planet.GetName] bị mọi người coi như một hình phạt. Điều này không may đã kéo lùi tiến độ nhiệm vụ của chúng ta."
 observation.2018.tt:0 "§Y[pre_ftl_country.GetName]§!: §R-20%§! tiến bộ công nghệ."
 observation.2020.desc:1 "Các [pre_ftl_species.GetNamePlural] trên [pre_ftl_planet.GetName] là những nhà khoa học bẩm sinh. Các cố vấn đồn trú trên hành tinh mẹ của chúng cảm thấy kinh ngạc trước những tiến bộ mà chúng đạt được. Các cố vấn cho biết trong báo cáo rằng, nhiệm vụ thúc đẩy nền văn minh [pre_ftl_species.GetName] tiến vào kỷ nguyên không gian của chúng ta có thể sẽ được hoàn thành sớm hơn thời hạn."
 observation.2022.desc:0 "Nhiệm vụ mang lại sự phát triển công nghệ cho các [pre_ftl_species.GetNamePlural] trên [pre_ftl_planet.GetName] của chúng ta đã có tiến độ vượt kế hoạch so với lịch trình, phần lớn là nhờ vào trí tuệ phi thường của họ. Mặc dù nền văn minh này còn rất non trẻ, nhưng các cố vấn khoa học của ta đã nhìn thấy tiềm năng to lớn ở [pre_ftl_species.GetName]."
 observation.2030.name:0 "Thay đổi tư tưởng trên [pre_ftl_planet.GetName]"
 observation.2030.desc:0 "Sau một thời gian dài tiếp xúc với các nhà khoa học mà ta phái tới [pre_ftl_planet.GetName], mức độ tiếp nhận các giống loài và nền văn hóa khác của thổ dân địa phương đã tăng lên rất nhiều. Các [pre_ftl_species.GetNamePlural] không còn dễ dàng tỏ thái độ bài trừ đối với những thứ từ bên ngoài nữa."
 observation.2031.desc:1 "Sau khi hợp tác chặt chẽ với các nhà khoa học và cố vấn mà ta phái tới [pre_ftl_planet.GetName], các [pre_ftl_species.GetNamePlural] đã nảy sinh sự hứng thú nồng nhiệt đối với mọi khía cạnh liên quan đến những thứ ngoài hành tinh."
 observation.2031.tt:0 "Người dân trên [pre_ftl_planet.GetName] sẽ trở nên thiên về chủ nghĩa thân ngoại."
 observation.social.intro:0 "Các cố vấn của ta báo cáo rằng, thổ dân trên [pre_ftl_planet.GetName] không chỉ bị mê hoặc bởi công nghệ của chúng ta, mà thậm chí họ còn đang bắt chước cử chỉ và điệu bộ của ta."
 observation.2032.desc:0 "$observation.social.intro$\n\nHọ có vẻ về tổng thể đã chấp nhận triết lý tôn sùng hòa bình và phi bạo lực của chúng ta. Kể từ khi chúng ta tới đây, các cuộc xung đột giữa các nhóm văn hóa [pre_ftl_species.GetName] khác nhau gần như đã chấm dứt."
 observation.2032.tt:0 "Người dân trên [pre_ftl_planet.GetName] sẽ trở nên thiên về chủ nghĩa hòa bình."
 observation.2033.desc:1 "$observation.social.intro$\n\nVới những loại vũ khí kiểu mới mà ta trao cho, các [pre_ftl_species.GetNamePlural] đã có nhận thức mới về con đường chiến tranh. Kể từ sau khi chúng ta tới đây, xã hội của họ đã quân sự hóa một cách thần tốc."
 observation.2033.tt:0 "Người dân trên [pre_ftl_planet.GetName] sẽ trở nên thiên về chủ nghĩa quân phiệt."
 observation.2034.desc:0 "$observation.social.intro$\n\nChúng ta đã trở thành một tấm gương tuyệt vời, dạy cho họ giá trị của một ban lãnh đạo mạnh mẽ và đoàn kết. Giờ đây các [pre_ftl_species.GetNamePlural] đã nhận ra rằng, đây là con đường tất yếu để khiến một nền văn minh trở nên vĩ đại."
 observation.2034.tt:0 "Người dân trên [pre_ftl_planet.GetName] sẽ trở nên thiên về chủ nghĩa uy quyền."
 observation.2035.desc:1 "$observation.social.intro$\n\nSau khi được truyền cảm hứng từ nghệ thuật và văn hóa của chúng ta, xã hội [pre_ftl_species.GetName] dường như đã phát triển một nhận thức hoàn toàn mới về chủ nghĩa bình đẳng. Kể từ khi chúng ta tới đây, mức độ tự do cá nhân của họ đã tăng lên đáng kể."
 observation.2035.tt:0 "Người dân trên [pre_ftl_planet.GetName] sẽ trở nên thiên về chủ nghĩa bình đẳng."
 observation.2036.desc:0 "$observation.social.intro$\n\nNhiệm vụ truyền bá quan điểm khoa học của chúng ta cho [pre_ftl_species.GetName] đã gây ra tác động sâu rộng đến xã hội của họ. Tôn giáo có tổ chức đang suy tàn, nhiều hủ tục mê tín đã bị mọi người từ bỏ."
 observation.2036.tt:0 "Người dân trên [pre_ftl_planet.GetName] sẽ trở nên thiên về chủ nghĩa duy vật."
 observation.2037.desc:1 "$observation.social.intro$\n\nSau khi chứng kiến sức mạnh từ niềm tin của chúng ta, nhiều [pre_ftl_species.GetNamePlural] đã rầm rộ quay trở lại với tôn giáo cổ xưa của nền văn minh mình, đồng thời còn dung hợp một số yếu tố trong tín ngưỡng của ta với niềm tin của riêng họ."
 observation.2037.tt:0 "Người dân trên [pre_ftl_planet.GetName] sẽ trở nên sùng đạo hơn."
 observation.2038.desc:0 "Một bộ phận các nhà khoa học mà ta phái tới [pre_ftl_planet.GetName] để thực hiện công tác tư vấn cho các [pre_ftl_species.GetNamePlural] đã bắt đầu hoài nghi về tính sáng suốt của nhiệm vụ này. Họ báo cáo rằng, thổ dân địa phương dường như chỉ nảy sinh sự hứng thú đối với việc sở hữu công nghệ vũ khí mới.\n\nThật không may, hành vi biến những công nghệ hòa bình mà ta mang tới thành công cụ chiến tranh của họ đã kéo lùi tiến độ nhiệm vụ của chúng ta."
 observation.2039.desc:1 "Nhiệm vụ khai sáng nền văn minh thổ dân trên [pre_ftl_planet.GetName] của chúng ta đã không diễn ra theo đúng kế hoạch. Khi chúng ta truyền thụ cho họ công nghệ vũ khí mới, các nhà khoa học [pre_ftl_species.GetName] thường cảm thấy kinh hãi.\n\nDo các cố vấn khoa học của ta đã trình chiếu màn mô phỏng kích nổ một quả bom nhiệt hạch trên bầu trời thành phố đông dân cư, nên họ phải mất tới mấy tuần lễ mới xoa dịu được cảm xúc của thổ dân. Thật không may, việc này đã làm chậm trễ tiến độ của ta rất nhiều."
 observation.2040.desc:0 "Chúng ta đã gặp phải một số khó khăn khi triển khai công tác nâng cao trình độ văn minh cho người dân trên [pre_ftl_planet.GetName]. Các [pre_ftl_species.GetNamePlural] thực tế vô cùng mê tín, có rất nhiều người dân ôm khư khư truyền thống tôn giáo cổ hủ không chịu buông tay, từ chối tiếp nhận các bằng chứng duy vật, điều này khiến các cố vấn khoa học của ta cảm thấy vô cùng nản lòng.\n\nThật không may là, dự tính của chúng ta đối với nhiệm vụ này có vẻ đã quá mức lạc quan."
 observation.2041.desc:1 "Kế hoạch khai sáng các [pre_ftl_species.GetNamePlural] và dẫn dắt họ tiến bước tới các vì sao theo đúng con đường đã gặp phải trở ngại. Các cố vấn tôn giáo và khoa học của ta trên [pre_ftl_planet.GetName] báo cáo rằng, thổ dân không có niềm tin để dựa vào, điều này khiến người ta cảm thấy lo ngại. Họ rất sẵn lòng tiếp nhận công nghệ của ta, nhưng đối với những lời dạy bảo tinh thần cần thiết để sử dụng các công nghệ này một cách có trách nhiệm, họ lại không muốn tiếp nhận.\n\nViệc này đã gây cản trở rất lớn cho nhiệm vụ dẫn dắt khai sáng các [pre_ftl_species.GetNamePlural]. Phen này kế hoạch của ta lại phải trì hoãn rồi."
 observation.2042.desc:0 "Xã hội độc tài, áp bức trên [pre_ftl_planet.GetName] đã cản trở nhiệm vụ thúc đẩy tiến bộ công nghệ của các [pre_ftl_species.GetNamePlural]. Tư tưởng độc lập và tinh thần khai phá — vốn là những phẩm chất cần thiết để khoa học phát triển rực rỡ — lại rất hiếm thấy ở các [pre_ftl_species.GetNamePlural].\n\nChủ nghĩa uy quyền hống hách này đã kéo lùi tiến độ nhiệm vụ của chúng ta —— các cố vấn khoa học phái tới địa phương báo cáo rằng, thời gian thực tế tiêu tốn đã vượt quá dự kiến."
 observation.2043.desc:1 "Chế độ vô chính phủ đang thịnh hành ở thế giới mặt đất [pre_ftl_planet.GetName], các cố vấn của ta đã gặp rất nhiều khó khăn khi truyền thụ khoa học hiện đại cho các [pre_ftl_species.GetNamePlural]. Đôi khi, mỗi nhà khoa học dường như đều có quan điểm khác nhau về dự án này, hoàn toàn không màng tới nhu cầu của đội ngũ hay lợi ích công cộng.\n\nNhiệm vụ khai sáng của chúng ta vẫn đang tiếp tục, dân chúng địa phương vì bị dẫn dắt sai lệch nên đã biểu hiện một mức độ chủ nghĩa bình đẳng nhất định, vì thế nhiệm vụ cần nhiều thời gian hơn dự kiến mới có thể hoàn thành."

 ### New events which fire before nuclear war/apocalypse gatekeepers, giving the player a final chance to stop pre-FTLs from blowing themselves up! ###
 # This event appears prior to observation.107 (religious nuclear war) #
 observation.3205.name:0 "Ngày tận thế cận kề trên [pre_ftl_planet.GetName]"
 observation.3205.desc:0 "Sau khi chứng kiến màn hiển linh của Đấng Cứu Thế của mình, cư dân trên [pre_ftl_planet.GetName] đã rơi vào cảnh khốn cùng. Xã hội nảy sinh sự chia rẽ, cục diện căng thẳng đã leo thang tới mức không thể chịu đựng nổi nữa.\n\nNếu chúng ta không hành động, họ sẽ lợi dụng công nghệ của chúng ta để phát động một cuộc chiến tranh tôn giáo trên toàn hành tinh khiến nó bị xẻ nghé tan đàn."
 observation.3205.a:0 "Thu hồi công nghệ của chúng ta."
 observation.3205.b:0 "Chúng ta không thể mạo hiểm gây thêm ô nhiễm văn hóa."
 # This event appears prior to observation.204 (nuclear war following downed shuttle and stolen tech) #
 observation.3210.name:0 "Thảm họa bao trùm [pre_ftl_planet.GetName]"
 observation.3210.desc:0 "Công nghệ được thu lượm từ phi thuyền bị rơi của ta trên [pre_ftl_planet.GetName] đang đe dọa đến mọi mạng sống trên hành tinh này. Do họ thiếu đi sự thấu hiểu khoa học tương ứng, họ có thể dễ dàng lợi dụng công nghệ của ta để tự hủy diệt chính mình.\n\nTrừ phi chúng ta can thiệp, nếu không đây sẽ là một thảm họa."
 observation.3210.a:0 "Kích hoạt chức năng tự hủy của tàu con thoi."
 observation.3210.b:0 "Tổn thất đã gây ra rồi."
 # This event appears prior to observation.1400 (random nuclear war) #
 observation.3215.name:0 "Chiến tranh hạt nhân đang cận kề trên [pre_ftl_planet.GetName]"
 observation.3215.desc:0 "Tình hình căng thẳng đang nhen nhóm trên [pre_ftl_planet.GetName]. Chiến tranh hạt nhân đang cận kề. Nếu chúng ta không làm gì, họ sẽ tự hủy diệt chính mình.\n\nChúng ta là hy vọng duy nhất của họ."
 observation.3215.a:0 "Bí mật thâm nhập, xoa dịu tình hình."
 observation.3215.b:0 "Không cần thiết phải tiến hành các hoạt động gián điệp thêm nữa."

