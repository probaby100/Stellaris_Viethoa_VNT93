# Research Proposal
 observation.1501.name:1 "Đề xuất nghiên cứu"
 observation.1501.desc:2 "Các nhà khoa học trên trạm quan sát quỹ đạo [pre_ftl_planet.GetName] xin cấp một tàu nghiên cứu để họ thu thập mẫu vật từ bề mặt [pre_ftl_planet.GetPlanetHabitat]. Vì mục đích nghiên cứu, họ muốn bí mật bắt cóc một bộ phận [GetPreFTLLowerPlural] và tiến hành thử nghiệm trên người chúng. Sau đó, chúng sẽ được đưa trở lại bề mặt một cách an toàn, với toàn bộ trí nhớ bị xóa sạch."
 observation.1501.a:1 "Việc này có thể giúp chúng ta tìm hiểu sâu hơn về họ."
 observation.1501.b:1 "Không, chúng ta nên để họ thuận theo tự nhiên."
 observation.1501.b.tt:0 "§Y$mission_passive_observation$§! giờ đây sẽ sản sinh §G+2§! $r_unity$\n$t$§RSẽ bị khóa vào $mission_passive_observation$!§!"
 observation.1502.desc:2 "[Root.GetName] đã hoàn thành nhiệm vụ khoa học trên [pre_ftl_planet.GetName]. Các tàu con thoi phái đi từ tàu nghiên cứu đã bay lướt qua mặt đất ở độ cao thấp trong đêm, sử dụng xung điện từ để làm tê liệt những chiếc xe động cơ đốt trong lỗi thời mà các [GetPreFTLLowerPlural] sử dụng. Những người lái xe sau đó bị đông lạnh và thu thập, trong khi các đội tiền trạm khác thu thập mẫu vật bằng cách giải phẫu gia súc địa phương.\n\nNhiệm vụ của chúng ta có vẻ không gây ra quá nhiều sự chú ý từ người dân trên [pre_ftl_planet.GetPlanetHabitat], dẫu có vài báo cáo về \"những ánh sáng lạ\", ngoài ra một thành viên phi hành đoàn tàu con thoi của ta đã cố ý dùng động cơ đẩy để tạo ra các hoa văn hình tròn trên cánh đồng lúa mì gây ra sự cố. Những người này đã bị cảnh cáo."
 observation.1502.a:0 "Làm tốt lắm."

# Special Projects for events above.
 EXTRACT_MISSING_SCIENTIST:1 "Bắt giữ nhà khoa học mất tích"
 EXTRACT_MISSING_SCIENTIST_DESC:1 "Một nhà khoa học của chúng ta đã đào tẩu, và đang được các [GetPreFTLLowerPlural] địa phương trên [pre_ftl_planet.GetName] tôn thờ như một vị thần. Phải có hành động để đưa [missing_scientist.GetHimHer] đi — nếu cần có thể dùng vũ lực."
 SHUTTLE_INTERCEPTED:1 "Giải cứu những người sống sót trên tàu con thoi"
 SHUTTLE_INTERCEPTED_DESC:1 "Một tàu con thoi của ta đã bị thổ dân [pre_ftl_country.GetName] bắn hạ, chúng ta phải cứu toàn bộ những người sống sót trước khi họ bị quân đội địa phương bắt giữ."
 ABDUCT_SCIENTIST_PROJECT:1 "Bắt cóc nhà khoa học [GetPreFTLUpper]"
 ABDUCT_SCIENTIST_PROJECT_DESC:1 "Chúng ta đã phát hiện ra một nhà khoa học tài năng trong số các [GetPreFTLLower] [pre_ftl_country.GetSpeciesNamePlural] trên [pre_ftl_planet.GetName]. Tài năng xuất chúng của [abducted_scientist.GetHisHerCap] đang bị phí hoài trong nền văn minh [abducted_scientist.GetHisHer] [GetPreFTLLower], nhưng [abducted_scientist.GetHeShe] sẽ có tác dụng thúc đẩy to lớn cho các dự án nghiên cứu của chính chúng ta. Kế hoạch bắt cóc [abducted_scientist.GetHisHer] và \"thuyết phục\" [abducted_scientist.GetHisHer] làm việc cho chúng ta đã được đưa vào chương trình nghị sự."
 DEFENSE_FORCE_STRIKE_PROJECT:1 "Phá hủy lực lượng phòng vệ thổ dân"
 DEFENSE_FORCE_STRIKE_PROJECT_DESC:1 "Các quốc gia dân tộc [pre_ftl_country.GetSpeciesName] từ [pre_ftl_planet.GetName] đã liên minh lại và thành lập lực lượng quân sự phản kháng người ngoài hành tinh, sứ mệnh của họ là cản trở hành động của ta trên hành tinh này. Đây là điều không thể dung thứ. Chúng ta phải thực hiện một đòn đánh trừng phạt vào căn cứ chính của chúng."
 IMPLANT_MALFUNCTIONS_PROJECT:1 "Tháo bỏ thể cấy ghép bị lỗi"
 IMPLANT_MALFUNCTIONS_PROJECT_DESC:1 "Sau khi gắn các thể cấy ghép não bộ cho vài đối tượng thử nghiệm [GetPreFTLLowerPlural] [pre_ftl_country.GetSpeciesNamePlural] trên [pre_ftl_planet.GetName], chúng ta đã gặp phải một số vấn đề. Họ nảy sinh hàng loạt vấn đề về lỗi chức năng, gây ra các hành vi bạo lực của người thử nghiệm, thậm chí dẫn đến cái chết của người bị thử nghiệm. Chúng ta cần tháo bỏ những thể cấy ghép này trước khi phát sinh thêm nhiều vấn đề khác."
 PROBE_ALIENS_PROJECT:1 "Thăm dò người ngoài hành tinh"
 PROBE_ALIENS_PROJECT_DESC:1 "Các nhà khoa học của chúng ta muốn tìm kiếm đối tượng thí nghiệm từ nền văn minh thổ dân trên [pre_ftl_planet.GetName] để thu thập dữ liệu. Sau khi thử nghiệm xong, đối tượng mục tiêu sẽ bị xóa trí nhớ và đưa trở lại bề mặt [pre_ftl_planet.GetPlanetHabitat]."

