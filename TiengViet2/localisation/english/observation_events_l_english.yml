 observation.209.name:1 "Vũ khí mới trên [pre_ftl_planet.GetName]"

 observation.209.reg_pre_ftl.desc:0 "Quốc gia bắn hạ tàu con thoi của ta trên [pre_ftl_planet.GetName] đã ép buộc các nhà khoa học bị bắt của ta thiết kế vũ khí kiểu mới cho quân đội của họ. Nhờ vào những trang bị này, họ đã xâm lược thành công vài nước láng giềng, và giờ đây đang hừng hực khí thế thâu tóm toàn bộ [pre_ftl_planet.GetPlanetHabitat] dưới sự thống trị của mình."
 observation.209.hive_pre_ftl.desc:0 "Ý thức đã bắn hạ tàu con thoi của ta trên [pre_ftl_planet.GetName] đã ép buộc các nhà khoa học bị bắt của ta thiết kế vũ khí kiểu mới cho quân đội của họ. Nhờ vào những trang bị này, họ đã xâm lược thành công vài ý thức bầy đàn lân cận, và giờ đây đang hừng hực khí thế thâu tóm toàn bộ [pre_ftl_planet.GetPlanetHabitat] dưới sự thống trị của mình."
 observation.209.reg_pre_ftl.desc.gestalt:0 "Quốc gia bắn hạ tàu con thoi của ta trên [pre_ftl_planet.GetName] đã ép buộc các cá thể con bị bắt của ta thiết kế vũ khí kiểu mới cho quân đội của họ. Nhờ vào những trang bị này, họ đã xâm lược thành công vài nước láng giềng, và giờ đây đang hừng hực khí thế thâu tóm toàn bộ [pre_ftl_planet.GetPlanetHabitat] dưới sự thống trị của mình."
 observation.209.hive_pre_ftl.desc.gestalt:0 "Ý thức đã bắn hạ tàu con thoi của ta trên [pre_ftl_planet.GetName] đã ép buộc các [root.GetIndividualName] bị bắt của ta thiết kế vũ khí kiểu mới cho quân đội của họ. Nhờ vào những trang bị này, họ đã xâm lược thành công vài ý thức bầy đàn lân cận, và giờ đây đang hừng hực khí thế thâu tóm toàn bộ [pre_ftl_planet.GetPlanetHabitat] dưới sự thống trị của mình."

 observation.209.a:1 "Thật không thể nhẫn nhịn thêm được nữa!"

 observation.211.name:1 "Trao đổi con tin"

 observation.211.reg.start:0 "Quốc gia đã bắn hạ tàu con thoi của ta trên [pre_ftl_planet.GetName] đã thông qua một vệ tinh của họ để phát tín hiệu công khai vào không gian. Có vẻ như nó được gửi cho chúng ta."
 observation.211.hive_mind.start:0 "Ý thức đã bắn hạ tàu con thoi của ta trên [pre_ftl_planet.GetName] đã thông qua một vệ tinh của họ để phát tín hiệu công khai vào không gian. Có vẻ như nó được gửi cho chúng ta."
 observation.211.end:0 "Họ yêu cầu chúng ta chia sẻ một số công nghệ tiên tiến với họ, đổi lại mạng sống của các nhà khoa học bị bắt tại điểm rơi tàu. Nếu chúng ta từ chối, những nhà khoa học của chúng ta sẽ bị hành quyết công khai thông qua hệ thống truyền hình vô tuyến thô sơ của họ."
 observation.211.gestalt.end:0 "Họ yêu cầu chúng ta chia sẻ một số công nghệ tiên tiến với họ, đổi lại mạng sống của các [GetIndividualNamePlural] bị bắt tại điểm rơi tàu. Nếu chúng ta từ chối, những [GetIndividualNamePlural] của chúng ta sẽ bị hành quyết công khai thông qua hệ thống truyền hình vô tuyến thô sơ của họ."

 observation.211.reg_pre_ftl.desc:0 "$observation.211.reg.start$\n\n$observation.211.end$"
 observation.211.hive_pre_ftl.desc:0 "$observation.211.hive_mind.start$\n\n$observation.211.end$"
 observation.211.reg_pre_ftl.desc.gestalt:0 "$observation.211.reg.start$\n\n$observation.211.gestalt.end$"
 observation.211.hive_pre_ftl.desc.gestalt:0 "$observation.211.hive_mind.start$\n\n$observation.211.gestalt.end$"
 observation.211.a:1 "Sự an toàn của nhân dân ta phải được đặt lên hàng đầu."
 observation.211.a.gestalt:1 "Phải ưu tiên hàng đầu sự an toàn của các đơn vị tự chủ."
 observation.211.b:1 "Lúc này họ chưa thể tiếp cận những công nghệ này."

 observation.212.name:1 "Con tin bị hành quyết"

 observation.212.desc:1 "Trong một cảnh tượng mà chúng ta chỉ có thể dùng từ thô thiển để mô tả, những nhà khoa học bị bắt của chúng ta trên [pre_ftl_planet.GetName] đã bị đem đi diễu phố thị chúng như \"những kẻ ngoài hành tinh đáng ghê tởm\" dưới ống kính truyền hình trực tiếp."
 observation.212.desc.mach:1 "Trong một cảnh tượng mà chúng ta chỉ có thể dùng từ thô thiển để mô tả, những đơn vị khoa học bị bắt của chúng ta trên [pre_ftl_planet.GetName] đã bị đem đi diễu phố thị chúng như \"những cỗ máy đáng ghê tởm từ phương trời xa\" dưới ống kính truyền hình trực tiếp."
 observation.212.a:1 "Thật bi thảm làm sao!"

# Smuggler Outpost
 observation.301.name:1 "Trạm canh gác của bọn buôn lậu"
 observation.301.desc:1 "Trạm quan sát phía trên [pre_ftl_planet.GetName] của chúng ta đã phát hiện một điểm định cư trái phép trên bề mặt [pre_ftl_planet.GetPlanetHabitat]. Có thể đây là trạm canh gác do một số kẻ buôn lậu [Root.GetSpeciesName] hoặc các phần tử bất hảo của [Root.GetName] thiết lập.\n\nVì thi thoảng những kẻ buôn lậu này đụng độ với các [GetPreFTLLowerPlural] địa phương, nên đã xảy ra một số sự cố lẻ tẻ — vài sự cố thậm chí còn leo thang thành hành vi bạo lực. Chúng ta cần hành động nhanh chóng để đưa những phần tử bất hảo này đi trước khi chúng gây ra tổn thất lớn hơn."
 observation.301.a:1 "Dọn dẹp sạch bọn chúng."
 observation.301.b:1 "Chỉ là vài tên buôn lậu thôi mà, có thể làm gì được chứ?"
 observation.302.name:1 "Đột kích bọn buôn lậu"
 observation.302.desc:1 "Trong một chiến dịch đột kích chớp nhoáng, quân đội mặt đất của chúng ta đã thực hiện cuộc tấn công vào trạm canh gác của bọn buôn lậu trên [pre_ftl_planet.GetName]. Sau một cuộc đấu súng ngắn ngủi, những tên tội phạm còn sống sót đã bị bắt giữ và chuyển lên quỹ đạo. Sau đó chúng ta đã xóa sổ tòa nhà trống rỗng này khỏi mặt đất bằng cách kích nổ thuốc nổ.\n\nChúng ta tin rằng đã giảm thiểu tối đa sự ô nhiễm văn hóa, quân đội của ta cũng đã tịch thu được lượng lớn hàng cấm. Toàn bộ lợi nhuận từ việc tịch thu đã được nộp vào ngân khố quốc gia."
 observation.302.a:1 "Thắng lợi lớn."
 observation.303.name:1 "Buôn lậu vũ khí"
 observation.303.desc:3 "Đã quá muộn. Những kẻ buôn lậu trên [pre_ftl_planet.GetName] đã bắt đầu dùng vũ khí tiên tiến và thuốc kích thích ảo giác rẻ tiền để đổi lấy kim loại quý và nô lệ từ các [GetPreFTLLowerPlural] địa phương.\n\nNhiều nhóm [GetPreFTLLower] đã nổ ra chiến tranh. Do có vũ khí công nghệ cao trong tay, thương vong của đôi bên vô cùng nặng nề. Sự việc diễn biến đến nước này, hậu quả xấu do ô nhiễm văn hóa gây ra đã không thể cứu vãn được nữa."
 observation.303.a:1 "Đây là một thảm họa."

# Scientist Abduction
 observation.1001.name:0 "Đề xuất bắt cóc"
 observation.1001.desc:1 "Chúng ta đã phát hiện ra một nhà khoa học [owner.GetPreFTLLower] [pre_ftl_country.GetSpeciesNamePlural] đầy triển vọng trên [pre_ftl_planet.GetName]. Những nghiên cứu xuất chúng của [abducted_scientist.GetHisHerCap] đã bỏ xa các đồng nghiệp của mình, trong đó có vài thành quả nghiên cứu có tính cách mạng ngay cả khi đánh giá theo tiêu chuẩn của chúng ta.\n\nMặc dù công việc của [abducted_scientist.GetHisHer] thực sự đã thúc đẩy tiến bộ công nghệ của [pre_ftl_country.GetSpeciesNamePlural], nhưng tiềm năng của [abducted_scientist.GetHisHer] hoàn toàn bị phí hoài trong nền văn minh [owner.GetPreFTLLower] của họ. Trong phòng thí nghiệm tiên tiến của chúng ta, [abducted_scientist.GetHeShe] sẽ có cơ hội được làm khoa học thực thụ."
 observation.1001.a:0 "Hoạch định phương án bắt cóc."
 observation.1001.b:1 "[abducted_scientist.GetHeSheCap] vẫn là một [owner.GetPreFTLLower]. Hãy để [abducted_scientist.GetHimHer] ở lại cùng đồng bào của [abducted_scientist.GetHisHer]."
 observation.1002.name:0 "Bắt cóc thành công"
 observation.1002.desc:2 "Các đặc vụ của chúng ta đã bắt cóc thành công nhà khoa học [pre_ftl_country.GetName] khỏi tay lũ [owner.GetPreFTLLower]! Một tàu con thoi mặt đất của ta đã chặn được xe hơi của [abducted_scientist.GetHisHer], lúc đó [abducted_scientist.GetHeShe] đang tăng ca muộn và chuẩn bị về nhà, chúng ta đã dùng vụ nổ điện từ để khiến xe hơi bị hỏng.\n\nNhà khoa học đã bị chúng ta tạm thời làm tê liệt các chức năng cơ thể và được đưa lên tàu con thoi, đồng thời trí nhớ của vệ sĩ của [abducted_scientist.GetHisHer] cũng đã bị xóa sạch. Chúng ta tự tin có thể \"thuyết phục\" nhà khoa học ưu tú này làm việc cho mình."
 observation.1002.tt:0 "Nhận được một §YNhà khoa học [pre_ftl_country.GetSpeciesName] cấp 6§!, sở hữu đặc điểm §Y$leader_trait_spark_of_genius$§!."
 observation.1003.name:0 "Bắt cóc thất bại"
 observation.1003.desc:2 "Thật không may, nỗ lực bắt cóc nhà khoa học [pre_ftl_country.GetName] khỏi tay lũ [owner.GetPreFTLLower] đã thất bại. Một tàu con thoi mặt đất của ta đã chặn được xe mô tô của [abducted_scientist.GetHisHer], nhưng khi chúng ta dùng tia nâng để khống chế nhà khoa học đang chết khiếp này thì một chiếc tiêm kích nội khí quyển của [pre_ftl_country.GetSpeciesName] đột ngột có mặt tại hiện trường.\n\nTàu con thoi của ta đã tháo chạy an toàn về quỹ đạo, nhưng tia nâng đã bị cắt đứt, và nhà khoa học... à thì, đó là một cú rơi khá dài đấy. Hy vọng cái chết của [abducted_scientist.GetHisHer] sẽ được đổ lỗi cho đế chế thù địch của [pre_ftl_country.GetSpeciesName]."
 observation.1004.name:0 "Đột phá trên [pre_ftl_planet.GetName]!"
 observation.1004.desc:0 "Nhà khoa học mà ban đầu chúng ta phát hiện trên [pre_ftl_planet.GetName] đã phát triển thành một nhân tài kiệt xuất. Nền tảng nghiên cứu phá vỡ các quy tắc thông thường cùng lối tư duy phân tích cực cao của [abducted_scientist.GetHisHer] đã thúc đẩy mạnh mẽ sự phát triển công nghệ của [pre_ftl_country.GetName]."
 observation.1004.a:0 "Làm tốt lắm!"

# Defense Force
 observation.1101.name:1 "[pre_ftl_planet.GetName]: Biệt đội Phản ứng Ngoại lai"
 observation.1101.desc:1 "Sau khi phát hiện ra các hoạt động của ta trên hành tinh [GetPreFTLLower] của chúng, nhiều quốc gia [pre_ftl_country.GetSpeciesName] trên [pre_ftl_planet.GetName] đã tạm gác lại những tranh chấp đôi bên để cùng nhau thành lập một tổ chức quân sự xuyên biên giới.\n\nTheo báo cáo từ truyền thông địa phương, trách nhiệm chính của biệt đội này là bảo vệ [pre_ftl_planet.GetPlanetHabitat] của họ khỏi \"các hoạt động thù địch của thế lực ngoài hành tinh vô danh nhằm vào toàn thể [pre_ftl_country.GetSpeciesName]\"."
# Interceptions
 observation.1102.name:1 "[pre_ftl_planet.GetName]: Hành động của Biệt đội"
 observation.1102.desc:1 "Hình ảnh dò tìm từ trạm quan sát phía trên [pre_ftl_planet.GetName] của chúng ta cho thấy, trên bề mặt [pre_ftl_planet.GetPlanetHabitat] đã mọc lên hàng loạt căn cứ quân sự và cơ sở radar mới, những doanh trại này đều thuộc quyền quản lý của Biệt đội Phản ứng Ngoại lai xuyên biên giới do các [pre_ftl_country.GetSpeciesNamePlural] thành lập.\n\nChúng ta nhận thấy, những quốc gia này đang hợp tác chặt chẽ với nhau ở mức độ chưa từng có, các phi thuyền được ta phái đi thực hiện nhiệm vụ bắt cóc giờ đây thường xuyên bị các tiêm kích tầng khí quyển của lực lượng này chặn đánh. Dù chúng ta chiếm ưu thế về công nghệ, nhưng số lượng của chúng quá đông đảo, vẫn có thể bắn hạ được vài chiếc tàu con thoi bắt cóc của ta!"
 observation.1102.a:0 "Việc này sẽ gây cản trở cho các hoạt động quan sát chủ động của chúng ta."
# Observation Post Lost
 observation.1103.name:1 "[pre_ftl_planet.GetName]: Mất Trạm Quan sát"
 observation.1103.desc:1 "Trạm quan sát phía trên [pre_ftl_planet.GetName] của chúng ta đã bị hủy! Một căn cứ quân sự dưới quyền kiểm soát của Biệt đội Phản ứng Ngoại lai [pre_ftl_country.GetSpeciesName] đã phóng một quả tên lửa đất đối không khổng lồ bắn trúng trạm quan sát của ta.\n\nCân nhắc tới việc trước đó chúng ta đã áp dụng hàng loạt biện pháp phòng ngừa để che giấu sự hiện diện của trạm quan sát với các [pre_ftl_country.GetSpeciesNamePlural], chúng ta lúc này vẫn chưa thể xác định được rốt cuộc chúng dùng phương pháp gì để lần ra vị trí của trạm. Có ý kiến cho rằng, thổ dân đã xoay sở để chiếm đoạt được một số công nghệ thông qua việc đảo ngược kỹ thuật từ chiếc tàu con thoi bị bắn hạ của ta."
 observation.1103.a:0 "Thật không ra thể thống gì cả!"
# Strike
 observation.1105.name:1 "[pre_ftl_planet.GetName]: Đòn đánh chính xác"
 observation.1105.desc:1 "Nhân viên trên trạm quan sát quỹ đạo [pre_ftl_planet.GetName] yêu cầu chúng ta hỗ trợ xử lý Biệt đội Phản ứng Ngoại lai do các [pre_ftl_country.GetSpeciesNamePlural] thành lập vì các hoạt động quan sát quyết liệt của ta. Mặc dù so với tiêu chuẩn của chúng ta thì tổ chức này khá nguyên thủy, nhưng nó đã phát triển đến mức có thể gây can thiệp vào các hoạt động bắt cóc của ta.\n\nCăn cứ chính của chúng đã được xác định nằm sâu trong [pre_ftl_planet.GetAMountainFeature] trên bề mặt [pre_ftl_planet.GetPlanetHabitat]. Oanh tạc quỹ đạo không mấy hiệu quả, nhưng một đợt tập kích chớp nhoáng bởi đội đột kích tinh nhuệ được trang bị tận răng sẽ có thể đánh úp chúng. Nếu có thể phá hủy nó, đây sẽ là một đòn chí tử giáng vào Biệt đội [pre_ftl_country.GetSpeciesName] ngoan cố."
 observation.1105.a:1 "Cứ làm thế đi."
 observation.1105.b:1 "Không, chúng ta nên tránh khiêu khích chúng thêm nữa..."
 observation.1106.name:2 "[pre_ftl_planet.GetName]: Tấn công thành công"
 observation.1106.desc:2 "Nhiệm vụ phá hủy căn cứ chính của Biệt đội xuyên biên giới [pre_ftl_country.GetSpeciesName] đã thắng lợi vẻ vang! Đội đột kích của ta đã xâm nhập được vào căn cứ, trước mặt các đặc vụ được huấn luyện bài bản của ta, lũ lính canh căn cứ với những vũ khí thô lậu hoàn toàn không phải là đối thủ.\n\nSau khi đặt xong thuốc nổ bên trong căn cứ, đội đột kích của ta đã được vài chiếc tàu con thoi chờ sẵn đón đi. Biệt đội [pre_ftl_country.GetSpeciesName] phiền phức đó giờ đây chẳng còn lại gì nữa."
 observation.1106.a:1 "Nhiệm vụ thành công."
 observation.1107.name:3 "[pre_ftl_planet.GetName]: Tấn công thất bại"
 observation.1107.desc:2 "Nhiệm vụ phá hủy căn cứ chính của Biệt đội xuyên biên giới [pre_ftl_country.Owner.GetSpeciesName] đã kết thúc trong thất bại thảm hại! Vài chiếc tàu con thoi chở đội đột kích của ta đã bị các ụ pháo phòng không ngụy trang bắn hạ trước khi kịp tới căn cứ. Những đặc vụ còn lại khi tới lối vào căn cứ đã gặp phải sự kháng cự ngoan cường nằm ngoài kế hoạch.\n\nCân nhắc tới việc quân viện trợ của [pre_ftl_country.Owner.GetSpeciesName] đang tới gần, chỉ huy đội đột kích cuối cùng đã hạ lệnh rút lui. Tuy nhiên thật không may, những tàu con thoi trở về quỹ đạo của ta đã bị số lượng lớn tiêm kích tầng khí quyển chặn đánh trên đường đi. Tổn thất vô cùng nặng nề."
 observation.1107.a:1 "Đây quả thực là một thảm họa!"
# Disbanded
 observation.1104.name:1 "[pre_ftl_planet.GetName]: Biệt đội giải tán"
 observation.1104.desc:1 "Biệt đội xuyên biên giới do các quốc gia [pre_ftl_country.GetSpeciesName] thành lập nhằm cản trở hành động của ta trên [pre_ftl_planet.GetName] đã giải tán! Mặc dù trong các chiến dịch nhắm vào tàu con thoi và đội bắt cóc của ta, họ đã xoay sở đạt được vài thắng lợi then chốt, nhưng một vài quốc gia sáng lập đã quyết định ngừng cấp vốn và rút khỏi kế hoạch này.\n\nThông tin tình báo cho thấy, bước ngoặt ngoài dự kiến này là do những cuộc nội chiến và tranh chấp ngoại giao giữa các quốc gia [pre_ftl_country.GetSpeciesName]."
 observation.1104.a:1 "Dù nằm ngoài dự kiến, nhưng diễn biến như vậy cũng khá tốt."

# Malfunctioning Implants
 observation.1201.name:1 "[pre_ftl_planet.GetName]: Thể cấy ghép bị lỗi"
 observation.1201.desc:1 "Là một phần trong kế hoạch quan sát [pre_ftl_planet.GetName], đội bắt cóc đã dùng phương thức phẫu thuật để gắn các thể cấy ghép vào não bộ của một bộ phận [pre_ftl_country.GetSpeciesName], nhằm theo dõi vị trí và giám sát hành vi của chúng. Thật không may, do một số khiếm khuyết trong khâu sản xuất, nhiều thể cấy ghép đã bị hỏng, và giờ đây... trên người các đối tượng thử nghiệm của chúng ta đã xuất hiện một số tác dụng phụ.\n\nVài đối tượng thử nghiệm đã tự sát, và có ít nhất ba đối tượng rơi vào trạng thái cuồng loạn bạo lực. Các [root.GetResearcherPlural] trên trạm quan sát của ta yêu cầu hỗ trợ để kiểm soát những đối tượng thử nghiệm còn lại, nhằm tháo bỏ thể cấy ghép trước khi có thêm nhiều sự cố xảy ra."
 observation.1201.a:0 "Chúng ta phải dọn dẹp đống hỗn độn này."
 observation.1201.b:0 "Đây đâu phải vấn đề của chúng ta."
 observation.1202.name:3 "[pre_ftl_planet.GetName]: Đã tháo bỏ thể cấy ghép"
 observation.1202.desc:2 "Đội bắt cóc trên trạm quan sát [pre_ftl_planet.GetName] đã hợp tác với nhân sự của [Root.GetName], nhanh chóng tập trung tất cả các đối tượng thử nghiệm [pre_ftl_country.GetSpeciesName] có thể cấy ghép bị lỗi lại.\n\nNhân viên phẫu thuật trên trạm đã thay thế bằng các thể cấy ghép hoạt động bình thường, và đưa các đối tượng thử nghiệm quay trở lại bề mặt [pre_ftl_planet.GetPlanetHabitat]. Không chỉ có vậy, đặc viên khoa học [Root.GetLeaderName] còn thành công trích xuất được lượng lớn dữ liệu từ những thể cấy ghép bị tháo bỏ — dẫu cho chúng bị lỗi."
 observation.1202.a:0 "Ít nhất thì cũng có chuyện tốt xảy ra."
 observation.1203.name:3 "[pre_ftl_planet.GetName]: Chưa tháo bỏ thể cấy ghép"
 observation.1203.desc:2 "Nhóm đối tượng thử nghiệm [pre_ftl_country.GetSpeciesName] cuối cùng của chúng ta trên [pre_ftl_planet.GetName], do sự hiện diện của các thể cấy ghép bị lỗi trong não bộ, đã rơi vào trạng thái điên loạn hoàn toàn. Nhiều người trở nên cực kỳ hung hãn, miệng gào thét những đoạn mã mà [Root.GetSpeciesName] lập trình cho thể cấy ghép, điên cuồng tấn công bất cứ ai hay bất cứ thứ gì xung quanh họ."
 observation.1203.a:0 "Sao chuyện như vậy lại có thể xảy ra chứ?"
 observation.1205.name:0 "[pre_ftl_planet.GetName]: Tiếp nhận thể cấy ghép"
 observation.1205.desc:1 "Các [pre_ftl_country.GetSpeciesName] trên [pre_ftl_planet.GetName] đã tự mình tiến hành nghiên cứu những thể cấy ghép mà chúng ta để lại. Không hiểu bằng cách nào, các nhà nghiên cứu [GetPreFTLLower] đã thành công thiết kế ra các bộ phận cơ thể nhân tạo kỹ thuật, có khả năng tương thích với đặc điểm sinh học của [pre_ftl_country.GetSpeciesName] tốt hơn cả phiên bản do chúng ta thiết kế."
 observation.1205.a:0 "Làm tốt lắm!"
 observation.1205.tt:0 "§Y[pre_ftl_country.GetSpeciesName]§! đã chấp nhận khái niệm về §YThân thể Nhân tạo§!."

# Ethic Shifts
 observation.1301.name:1 "[pre_ftl_planet.GetName]: Tư tưởng thay đổi"
 observation.1301.xenophobe:0 "Chúng ta nhận thấy đã có một sự thay đổi rõ rệt xảy ra với những [GetPreFTLLower] [pre_ftl_country.GetSpeciesNamePlural] trên [pre_ftl_planet.GetName]. Xã hội của họ đã chuyển sang xu hướng bế quan tỏa cảng, họ không còn dễ dàng chấp nhận những thứ xa lạ như trước nữa.\n\nHành vi quan sát chủ động cùng các chiến dịch bắt cóc được thực hiện trên khắp [pre_ftl_planet.GetPlanetHabitat] của ta có vẻ là một phần nguyên nhân dẫn đến tình trạng này, khiến các [pre_ftl_country.GetSpeciesNamePlural] cảnh giác hơn với những thứ chưa biết."
 observation.1301.xenophile:0 "Chúng ta nhận thấy đã có một sự thay đổi rõ rệt xảy ra với những [GetPreFTLLower] [pre_ftl_country.GetSpeciesNamePlural] trên [pre_ftl_planet.GetName]. Xã hội của họ bắt đầu chuyển sang xu hướng mở cửa, dân chúng cũng bắt đầu tiếp nhận những thứ xa lạ.\n\nCác chuyến bay quan sát được thực hiện trên khắp [pre_ftl_planet.GetPlanetHabitat] của ta có vẻ là một phần nguyên nhân dẫn đến tình trạng này, khiến các [pre_ftl_country.GetSpeciesNamePlural] khao khát tìm hiểu những thứ chưa biết hơn."
 observation.1301.spiritualist:0 "Vài đội bắt cóc thuộc trạm quan sát trên quỹ đạo [pre_ftl_planet.GetName] của ta, đã cố ý dùng động cơ đẩy của tàu con thoi để đốt cháy những vòng tròn khổng lồ và hoa văn phức tạp trên những cánh đồng lúa mì của các [GetPreFTLLower] [pre_ftl_country.GetSpeciesNamePlural], những thổ dân trên [pre_ftl_planet.GetPlanetHabitat].\n\nVì trò đùa này, phi hành đoàn tàu con thoi của ta đã bị khiển trách nghiêm khắc, nhưng những vòng tròn trên cánh đồng có vẻ mang một tầm quan trọng tâm linh nào đó đối với thổ dân. Nhờ những hoa văn này, một tôn giáo mới đang được hình thành, và nó đang ngày càng trở nên phổ biến trong cộng đồng [pre_ftl_country.GetSpeciesNamePlural] với tốc độ đáng kinh ngạc."
 observation.1301.materialist:0 "Vài đội bắt cóc thuộc trạm quan sát trên quỹ đạo [pre_ftl_planet.GetName] của ta, đã cố ý dùng động cơ đẩy của tàu con thoi để đốt cháy những vòng tròn khổng lồ và hoa văn phức tạp trên những cánh đồng lúa mì của các [GetPreFTLLower] [pre_ftl_country.GetSpeciesNamePlural], những thổ dân trên [pre_ftl_planet.GetPlanetHabitat].\n\nVì trò đùa này, phi hành đoàn tàu con thoi của ta đã bị khiển trách nghiêm khắc, nhưng thổ dân có vẻ tin chắc rằng các vòng tròn trên cánh đồng tồn tại một ý nghĩa toán học nào đó. Một phong trào khoa học tận lực nghiên cứu những hoa văn này bắt đầu trỗi dậy, và nó đang ngày càng trở nên phổ biến trong cộng đồng [pre_ftl_country.GetSpeciesNamePlural] với tốc độ đáng kinh ngạc."

# Nuclear War, everyone dead, planet is a tomb world
 observation.1402.name:0 "[pre_ftl_planet.GetName] rơi vào chiến tranh hạt nhân"

 observation.1402.reg.start:0 "Gần đây, một cuộc chiến tranh quy mô lớn đã nổ ra giữa vài cường quốc trên [pre_ftl_planet.GetName]."
 observation.1402.hive_mind.start:0 "Gần đây, một cuộc chiến tranh quy mô lớn đã nổ ra giữa vài ý thức trên [pre_ftl_planet.GetName]."
 observation.1402.end:0 "Trong khi các nhà nghiên cứu của ta đang quan sát từ quỹ đạo an toàn, cuộc xung đột đã nhanh chóng phát triển thành một đợt tấn công bằng vũ khí hạt nhân lẫn nhau trên phạm vi toàn cầu.\n\nToàn bộ dân số của [pre_ftl_planet.GetPlanetHabitat] có vẻ đều đã diệt vong trong hỏa tiễn hạt nhân, môi trường tự nhiên cũng bị tàn phá nặng nề."
 observation.1402.gestalt.end:0 "Trong khi các [root.GetIndividualNamePlural] quan sát của ta đang quan sát từ quỹ đạo an toàn, cuộc xung đột đã nhanh chóng phát triển thành một đợt tấn công bằng vũ khí hạt nhân lẫn nhau trên phạm vi toàn cầu.\n\nToàn bộ dân số của [pre_ftl_planet.GetPlanetHabitat] có vẻ đều đã diệt vong trong hỏa tiễn hạt nhân, môi trường tự nhiên cũng bị tàn phá nặng nề."

