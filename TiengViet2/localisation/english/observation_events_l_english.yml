l_english:

# Observation Events from base game
# Refactored as part of the 3.7 "Canis Minor" update.

# Asteroid Sighted!
 observation.2.name:1 "Tiểu hành tinh đang tiếp cận [pre_ftl_planet.GetName]"
 observation.2.desc:2 "Phòng thí nghiệm thiên thể nhỏ trên trạm quan sát quỹ đạo của chúng ta tại [pre_ftl_planet.GetName] đã phát hiện một tiểu hành tinh cấp 4 đang tiến lại gần. Nếu không hành động, nó sẽ va chạm với lực cực lớn vào bán cầu [GetRandomCompassDirection] của [pre_ftl_planet.GetPlanetHabitat], đủ để gây ra một sự kiện tuyệt chủng.\n\nNhiệm vụ của chúng ta là quan sát thụ động, thông thường chúng ta không được phép can thiệp, nhưng nhiều nhà khoa học cho rằng nên phá lệ trong trường hợp này. Nếu không làm gì, [pre_ftl_country.GetName] trên [pre_ftl_planet.GetName] chắc chắn sẽ diệt vong."
 observation.2.a:1 "Tình hình không mấy lạc quan."
# Asteroid Impacts Pre-FTL planet.
 observation.4.name:1 "Tiểu hành tinh va chạm với [pre_ftl_planet.GetName]"
 observation.4.desc:1 "Đúng như dự đoán, tiểu hành tinh bay về phía [pre_ftl_planet.GetName] đã va chạm vào bề mặt [pre_ftl_planet.GetPlanetHabitat], gây ra những thiệt hại không thể cứu vãn cho hệ sinh thái. Các nhà khoa học trên trạm quan sát chỉ có thể lặng lẽ đứng nhìn phần lớn nền văn minh [GetPreFTLLower] mà họ nghiên cứu bấy lâu nay bị xóa sổ dưới tác động của cú va chạm."
 observation.4.a:1 "Thật bi thảm, nhưng chúng ta không có quyền can thiệp."
 observation.4.a.tt:0 "§Y[pre_ftl_country.GetName]§!: Thoái lui về §YThời đại Đồ đá§!."
# Asteroid Collides with Observation Post.
 observation.5.name:1 "Trạm Quan sát bị phá hủy"
 observation.5.desc:1 "Các nhà nghiên cứu trên trạm quan sát phía trên [pre_ftl_planet.GetName] đã điều khiển động cơ đẩy quỹ đạo, khiến trạm va chạm trực diện với tiểu hành tinh đang lao tới. Sự hy sinh của họ đã giúp tiểu hành tinh chệch hướng khỏi quỹ đạo [pre_ftl_planet.GetPlanetHabitat] một cách an toàn, nhưng không một ai trên trạm sống sót.\n\nRõ ràng, họ không nỡ nhìn nền văn minh mà mình dành cả đời nghiên cứu bị diệt vong như vậy."
 observation.5.a:1 "Một đòn giáng nặng nề vào khoa học!"
# Observing Empire Destroys Asteroid
 observation.7.name:1 "Tiểu hành tinh bị phá hủy"
 observation.7.desc:1 "Tiểu hành tinh bay về phía [pre_ftl_planet.GetName] đã bị phá hủy trước khi kịp chạm tới bề mặt [pre_ftl_planet.GetPlanetHabitat]. Các mảnh vỡ đều đã cháy rụi an toàn khi đi vào bầu khí quyển mà không gây ra bất kỳ thiệt hại thực chất nào.\n\nNhững người ngoài hành tinh [GetPreFTLLower] của [pre_ftl_country.GetName] đã được chiêm ngưỡng một trận mưa sao băng cực kỳ tráng lệ, mà hoàn toàn không hay biết mình vừa thoát khỏi một thảm họa diệt vong..."
 observation.7.a:1 "Họ sẽ không bao giờ phát hiện ra đâu."
# Third Party Destroys Asteroid (Event for Third Party)
 observation.8.name:0 "$observation.7.name$"
 observation.8.desc:0 "$observation.7.desc$"
 observation.8.a:0 "$observation.7.a$"
# Third Party Destroys Asteroid (Event for Observing Empire)
 observation.9.name:0 "$observation.7.name$"
 observation.9.desc:0 "$observation.7.desc$"
 observation.9.a:0 "$observation.7.a$"
# Pre-FTL civilization Diverts Asteroid (Event for Observing Empire)
 observation.10.name:0 "Tiểu hành tinh đã chệch hướng"
 observation.10.desc:0 "Để cứu lấy [pre_ftl_planet.GetName] trong một nỗ lực tuyệt vọng, [pre_ftl_country.GetName] đã phóng vài tên lửa hạt nhân vào tiểu hành tinh. Dù những tên lửa này không đủ để phá hủy nó, nhưng những [GetPreFTLLowerPlural] trên [pre_ftl_planet.GetName] vẫn thành công khiến tiểu hành tinh chệch khỏi quỹ đạo bay."
 observation.10.a:0 "Làm tốt lắm!"
 observation.10.a.tt:0 "§Y[pre_ftl_country.GetName]§! nhận được: §G+25%§! tiến bộ công nghệ trong 24 tháng."

# Missing Scientist
 observation.101.name:1 "Nhà khoa học mất tích"
 observation.101.desc:2 "Một trong những nhà khoa học làm việc tại Trạm Quan Sát trên quỹ đạo [pre_ftl_planet.GetName] vừa được báo cáo là mất tích. [missing_scientist.GetHeSheCap] trước đó tham gia một nhiệm vụ bí mật nhằm thu thập các mẫu thực vật trên bề mặt [pre_ftl_planet.GetPlanetHabitat], nhưng đã không trở lại tàu con thoi cùng các thành viên khác trong đội của [missing_scientist.GetHisHer].\n\nChúng ta đã tiến hành tìm kiếm trong phạm vi giới hạn để tránh đánh động các [GetPreFTLLowerPlural], nhưng cho đến nay vẫn chưa có kết quả."
 observation.101.a:1 "Tiếp tục tìm kiếm."
 observation.102.name:1 "Phát hiện nhà khoa học đã tử nạn"
 observation.102.desc:1 "Cuối cùng chúng ta cũng tìm thấy di hài của nhà khoa học mất tích trên [pre_ftl_planet.GetName]... hay ít nhất là những gì còn sót lại. Có vẻ như [missing_scientist.GetHeShe] đã trở thành bữa tối cho một loài thú săn mồi cỡ lớn tại địa phương. Đây là một tổn thất lớn cho đội ngũ nghiên cứu, nhưng ít nhất các [GetPreFTLLowerPlural] vẫn hoàn toàn không hay biết về sự tồn tại của chúng ta."
 observation.102.a:1 "Ít nhất thì cũng không vi phạm chỉ thị."
 observation.103.name:1 "Báo cáo bất thường từ [pre_ftl_planet.GetName]"
 observation.103.desc:1 "Trạm quan sát phía trên [pre_ftl_planet.GetName] đã gửi về những báo cáo kỳ lạ. Một vương quốc địa phương dường như đang tập hợp dưới trướng một nhân vật tôn giáo huyền bí, và có dấu hiệu cho thấy họ đang sử dụng công nghệ cao vượt xa trình độ phát triển hiện tại. Chẳng lẽ việc này có liên quan đến nhà khoa học mất tích của chúng ta?"
 observation.104.desc:1 "Chào các bạn, những người bạn cũ. Đã lâu rồi nhỉ.\n\nTrước hết, tôi chân thành xin lỗi vì tất cả những gì các bạn đã bỏ ra để tìm kiếm tôi. Việc tôi mất tích trên [pre_ftl_planet.GetName] hoàn toàn là cố ý.\n\nCác [GetPreFTLLowerPlural] ở đây đến yết kiến tôi, tôn thờ tôi như thần thánh... và tại sao họ lại không làm thế chứ? Sau khi cân nhắc kỹ lưỡng, tôi đã quyết định mang nền văn minh thực thụ đến cho những [GetPreFTLLowerPlural] này."
 observation.104.a:1 "Anh bị cái quái gì ám thế này?!"
 observation.104.a.response:1 "Tôi mệt rồi. Tôi đã phát chán với những hạn chế đạo đức hẹp hòi, phát chán với việc bị đồng nghiệp chế nhạo. Quan trọng nhất là, tôi đã phát chán với việc quan sát \"thụ động\".\n\nThật nực cười! Can thiệp vào văn hóa [GetPreFTLLower] mới là sứ mệnh của chúng ta — dẫn dắt họ, nhào nặn họ theo con đường chúng ta chọn. Khoanh tay đứng nhìn một cách trơ trẽn chẳng qua chỉ là trốn tránh trách nhiệm mà thôi."
 observation.104.b:1 "Rút lui ngay lập tức cho tôi!"
 observation.104.b.response:1 "E là đã quá muộn rồi. Tôi đã quyết định không nghe lệnh từ những kẻ thấp kém hơn mình nữa. Trí tuệ của tôi vốn dĩ để phục vụ các người, nhưng các người lại phí hoài nó.\n\nỞ đây, tôi nhận được sự tôn trọng mà tôi xứng đáng có. Nơi đây giờ là nhà của tôi. Với kiến thức và công nghệ tôi mang tới, tôi sẽ khiến nền văn minh này nhảy vọt thần tốc, tiến tới thời đại hoàng kim."
 observation.104.c:1 "Anh điên thật rồi."
 observation.104.c.response:1 "Ngược lại mới đúng! Tôi chưa bao giờ tỉnh táo hơn thế! Sự diệt vong của [Root.GetName] là không thể tránh khỏi. Nếu không nhìn ra hàng loạt điềm báo đó thì các người mù quáng thật rồi.\n\nÀ thì, toàn bộ quá trình có thể mất hàng chục, thậm chí hàng trăm năm, nhưng ngày tàn của các người đang tới gần. Sau khi các người tự hủy hoại mình vì thói lười biếng và trì trệ, toàn bộ dải ngân hà sẽ được tiếp quản bởi những nền văn minh đầy sức sống, như nền văn minh mà tôi đang gầy dựng đây.\n\nChẳng còn gì để nói nữa. Vĩnh biệt. "
 observation.105.name:1 "Nhà khoa học phản bội củng cố quyền lực"
 observation.105.desc:2 "Chúng ta nhận được vài báo cáo cảnh báo từ bề mặt [pre_ftl_planet.GetName]. Có vẻ như nhà khoa học phản bội đang tiếp tục củng cố uy quyền của mình — [missing_scientist.GetHeShe] đã gửi vũ khí tiên tiến cho một trong những vương quốc phong kiến, và giờ họ đang nhân danh [missing_scientist.GetHisHer] để chinh phạt phần còn lại của [pre_ftl_planet.GetPlanetMoon].\n\nChúng ta đã đề xuất một kế hoạch bắt giữ cưỡng chế [missing_scientist.GetHimHer], nhưng kế hoạch này cần sự phối hợp của lực lượng mặt đất khổng lồ. Vì nhiều người địa phương coi [missing_scientist.GetHimHer] là thần thánh, nên chưa rõ kế hoạch này sẽ ảnh hưởng đến dân chúng địa phương như thế nào."
 observation.105.a:1 "Phê duyệt hành động. Loại bỏ [missing_scientist.GetHimHer]."
 observation.105.b:1 "Làm vậy chỉ tổ khiến mọi chuyện tệ thêm..."
 observation.106.name:1 "Bắt giữ thành công"
 observation.106.desc:1 "Chúng ta đã bắt được nhà khoa học phản bội rời khỏi [pre_ftl_planet.GetName] thành công! Trong chiến dịch, hàng trăm [owner.GetPreFTLLowerPlural] đã mở các đợt tấn công tự sát vào quân đội của ta để bảo vệ \"thiên nhân\" của chúng, buộc lòng chúng ta phải tiêu diệt họ. Thật là một bi kịch.\n\nHệ thống tư pháp của chúng ta hiện đang xử lý nhà khoa học này, nhưng chuỗi sự kiện này chắc chắn đã gây ra tác động nghiêm trọng đến nền văn minh [pre_ftl_planet.GetPlanetHabitat]. Họ vẫn đang nắm giữ một phần công nghệ của chúng ta, và \"thiên nhân\" của họ thì vừa bị những kẻ xâm lược từ các vì sao bắt đi mất..."
 observation.106.a:1 "Ít nhất thì một vấn đề đã được giải quyết."
 observation.107.name:1 "Xung đột tôn giáo trên [pre_ftl_planet.GetName]"
 observation.107.desc:1 "Sau khi chúng ta bắt nhà khoa học phản bội đi, [pre_ftl_planet.GetName] đã rơi vào loạn lạc. Đế chế mà [missing_scientist.GetHeShe] gầy dựng đã tan rã thành nhiều phe phái thù địch lẫn nhau, mỗi phe lại có cách diễn giải khác nhau về các giáo điều tôn giáo của [missing_scientist.GetHisHer].\n\nVũ khí mà thổ dân sử dụng hiện nay có sức hủy diệt rất lớn, khiến cuộc chiến diễn ra vô cùng khốc liệt. Các phe đối lập đã phóng vài quả \"bom bẩn\" phóng xạ vào nhau, và xem chừng chiến sự sẽ còn leo thang dữ dội."
 observation.107.a:1 "Chuyện này không thể kết thúc êm đẹp được..."
 observation.108.name:1 "Sự việc trên [pre_ftl_planet.GetName] đã lắng xuống"
 observation.108.desc:1 "Sau khi chúng ta bắt giữ thành công nhà khoa học phản bội, tình hình trên [pre_ftl_planet.GetName] có vẻ đã bình ổn lại. Thiếu đi sự giải thích dữ liệu của [missing_scientist.GetHimHer], các nguyên mẫu công nghệ mà [missing_scientist.GetHeShe] mang tới trở nên vô dụng đối với người dân trên [pre_ftl_planet.GetName]. Các [GetPreFTLLowerPlural] đã bắt đầu dần quay trở lại lối sống ban đầu."
 observation.108.a:1 "Cuối cùng cũng có tin tốt."
 observation.109.name:1 "Tên lửa bắn trúng trạm quan sát!"
 observation.109.desc:1 "Sáng sớm hôm nay, một loạt tên lửa đất đối không đã rời bệ phóng từ bề mặt [pre_ftl_planet.GetName], bắn thẳng vào trạm quan sát của chúng ta! Trạm không gian lập tức bị phá hủy, không một ai sống sót.\n\nKhông còn nghi ngờ gì nữa, nền văn minh [GetPreFTLLower] trên bề mặt [pre_ftl_planet.GetPlanetHabitat] đang tiếp tục phát triển với tốc độ khó tin — dù chúng ta đã xóa bỏ ảnh hưởng từ cái gọi là \"thần\" của họ. Công nghệ mà [missing_scientist.GetHeShe] trao cho họ chắc chắn đã kích hoạt một cuộc cách mạng khoa học bền bỉ."
 observation.109.a:1 "Bởi vậy mới nói, sự tồn tại của chỉ thị không can thiệp là vô cùng cần thiết."
 observation.110.desc:1 "Thánh linh phù hộ! Dù các người trông y hệt như Thánh Cứu Thế của chúng tôi, nhưng vẫn có sự khác biệt rõ rệt. [missing_scientist.GetHeSheCap] từng nói rằng, ác quỷ sẽ giả mạo diện mạo của [missing_scientist.GetHimHerCap], rồi một ngày nào đó từ trên trời giáng xuống bắt [missing_scientist.GetHimHerCap] đi. Lời tiên tri đã ứng nghiệm, không nghi ngờ gì nữa chính các người là kẻ thủ ác.\n\nThánh Cứu Thế của chúng tôi đang ở đâu, lũ sinh vật độc ác kia? Ta yêu cầu thả [missing_scientist.GetHimHerCap] ngay lập tức!"
 observation.110.a:1 "\"Thánh Cứu Thế\" của các người là một nhà khoa học ngoài hành tinh."
 observation.110.a.response:1 "Ngừng ngay hành vi báng bổ đó lại! Xúc phạm danh dự Thánh Cứu Thế là trọng tội không thể tha thứ, có thể bị xử tử. Nền văn minh của chúng tôi chỉ có được ngày hôm nay nhờ sự khai sáng từ thánh vật của [missing_scientist.GetHisHerCap]. Chỉ cần các người trả lại Thánh Cứu Thế cho chúng tôi, phía chúng tôi sẽ tha thứ cho sự báng bổ của các người."
 observation.110.b:1 "[missing_scientist.GetHeSheCap] đã bị xử tử vì những tội ác của [missing_scientist.GetHisHer] đối với người dân các bạn."
 observation.110.b.response:1 "Lũ đao phủ. Lũ ác quỷ hèn hạ, bội tín.\n\nHãy nhớ lấy lời ta: tội ác này sẽ không thể trốn thoát. Dù có mất cả ngàn năm, chúng ta cuối cùng cũng sẽ san bằng cả đế chế độc ác của các người."
 observation.110.c:1 "Rất tốt. [missing_scientist.GetHeSheCap] sẽ được thả và bàn giao cho các người giam giữ."
 observation.110.c.response:1 "Ác quỷ, nguyện Thánh Cứu Thế rộng lòng tha thứ cho tội ác của ngươi. Có lẽ ngươi vẫn chưa đến mức không thể cứu vãn."
 observation.111.desc:1 "Tôi nghĩ, tôi nên cảm ơn vì đã đưa tôi quay lại với những môn đồ của mình. Mặc dù tôi đã phải chịu sự đối đãi bất công, bị giam giữ cũng như những bài đánh giá tâm lý nực cười, nhưng tôi sẵn lòng để quá khứ ngủ yên. Chỉ cần các người đừng động đến tôi và nhân dân của tôi, chúng ta có thể tìm ra cách để cùng tồn tại. Dù sao thì, vũ trụ này rộng lớn lắm."
 observation.111.a:1 "Cứ chống mắt lên mà xem."
 observation.112.desc:1 "Một loạt tên lửa đất đối không phóng lên từ bề mặt [pre_ftl_planet.GetName], trực tiếp bắn trúng trạm quan sát trên quỹ đạo cao của chúng ta! Trạm quan sát lập tức bị phá hủy, không một ai sống sót.\n\nCó vẻ như nền văn minh trên bề mặt [pre_ftl_planet.GetPlanetHabitat] đang phát triển thần tốc với tốc độ khó tin — không nghi ngờ gì nữa, tất cả đều nhờ ơn nhà khoa học phản bội của chúng ta. Chúng ta không thể coi họ là nền văn minh nguyên thủy nữa, và chúng ta cũng chẳng còn cơ hội nào để lật đổ nhà khoa học đó khỏi ngai vàng quyền lực nữa rồi."

# Shuttle Intercepted
 observation.201.name:1 "Tàu con thoi rơi xuống [pre_ftl_planet.GetName]"
 observation.201.reg_pre_ftl.desc:0 "Trong một nhiệm vụ bí mật thực hiện trên bề mặt [pre_ftl_planet.GetName], một tàu con thoi của ta đã bị phi đội tiêm kích tầng khí quyển của một quốc gia địa phương chặn đánh. Một quả tên lửa may mắn đã bắn trúng động cơ tàu, khiến nó rơi xuống vùng hoang dã hẻo lánh.\n\nNếu muốn cứu toàn bộ những người sống sót trước khi các [GetPreFTLLowerPlural] tiếp cận được địa điểm rơi, chúng ta phải hành động thật nhanh. Mọi bằng chứng về sự tồn tại của chúng ta đều phải bị xóa sạch!"
 observation.201.hive_pre_ftl.desc:0 "Trong một nhiệm vụ bí mật thực hiện trên bề mặt [pre_ftl_planet.GetName], một tàu con thoi của ta đã bị phi đội tiêm kích khí quyển danh tính bất minh chặn đánh. Một quả tên lửa may mắn đã bắn trúng động cơ và làm nó tê liệt, khiến tàu rơi xuống vùng hoang dã hẻo lánh.\n\nNếu muốn cứu toàn bộ những người sống sót trước khi các [GetPreFTLLowerPlural] tiếp cận địa điểm rơi, chúng ta phải hành động thật nhanh. Mọi bằng chứng về sự tồn tại của chúng ta đều phải bị xóa sạch!"
 observation.201.reg_pre_ftl.desc.gestalt:0 "Tàu con thoi XB-23-968H, trong khi đang tới [pre_ftl_planet.GetName] thực hiện nhiệm vụ quan sát bí mật V45-BM, đã bị phi đội tiêm kích tầng khí quyển của một quốc gia danh tính bất minh chặn đánh, và báo cáo đã xảy ra tình trạng mất kiểm soát nghiêm trọng. Chúng ta đã lần theo được vị trí rơi của nó.\n\nTrước khi bất kỳ [GetPreFTLLowerPlural] nào tiếp cận điểm rơi, toàn bộ drone tự chủ phải được sơ tán, và phải xóa sạch mọi bằng chứng về sự tồn tại của chúng ta."
 observation.201.hive_pre_ftl.desc.gestalt:0 "Tàu con thoi của chúng ta, trong khi đang tới [pre_ftl_planet.GetName] thực hiện nhiệm vụ quan sát bí mật, đã bị phi đội tiêm kích tầng khí quyển chặn đánh, và báo cáo đã xảy ra tình trạng mất kiểm soát nghiêm trọng. Chúng ta đã lần theo được vị trí rơi của nó.\n\nTrước khi [GetPreFTLLowerPlural] tiếp cận điểm rơi, toàn bộ các [GetIndividualNamePlural] tự chủ phải được sơ tán, và phải xóa sạch mọi bằng chứng về sự tồn tại của chúng ta."
 observation.201.a:1 "Hành động ngay."

 observation.202.name:1 "Đặc vụ trên [pre_ftl_planet.GetName] đã được cứu"

 observation.202.start:0 "Các đặc vụ của [Root.GetName] đã cứu thoát thành công nhiều người sống sót từ chiếc tàu con thoi rơi trên [pre_ftl_planet.GetName]. Phần xác tàu còn lại đã bị phá hủy trong một vụ nổ có kiểm soát, chỉ để lại một hố nhỏ cho các [GetPreFTLLowerPlural] tìm kiếm."
 observation.202.gestalt.start:0 "Các đặc vụ của [Root.GetName] đã cứu thoát thành công nhiều cá thể con tự chủ từ chiếc tàu con thoi rơi trên [pre_ftl_planet.GetName]. Phần xác tàu còn lại đã bị phá hủy trong một vụ nổ có kiểm soát, chỉ để lại một hố nhỏ cho các [GetPreFTLLowerPlural] tìm kiếm."
 observation.202.reg.end:0 "Quốc gia nơi xảy ra sự cố này chắc chắn sẽ đổ lỗi cho các nước láng giềng vì hành vi xâm phạm biên giới, hy vọng thiệt hại gây ra cho quá trình phát triển tự nhiên của họ từ sự kiện này sẽ được giảm thiểu tối đa."
 observation.202.hive_mind.end:0 "Ý thức tập thể nơi xảy ra sự cố này chắc chắn sẽ đổ lỗi cho các nước láng giềng vì hành vi xâm phạm biên giới, hy vọng thiệt hại gây ra cho quá trình phát triển tự nhiên của họ từ sự kiện này sẽ được giảm thiểu tối đa."

 observation.202.reg_pre_ftl.desc:0 "$observation.202.start$\n\n$observation.202.reg.end$"
 observation.202.hive_pre_ftl.desc:0 "$observation.202.start$\n\n$observation.202.hive_mind.end$"
 observation.202.reg_pre_ftl.desc.gestalt:0 "$observation.202.gestalt.start$\n\n$observation.202.reg.end$"
 observation.202.hive_pre_ftl.desc.gestalt:0 "$observation.202.gestalt.start$\n\n$observation.202.hive_mind.end$"

 observation.203.name:1 "Đặc vụ trên [pre_ftl_planet.GetName] bị bắt"

 observation.203.start:0 "Quân đội [GetPreFTLUpper] của [pre_ftl_planet.GetName] đã tới điểm rơi trước khi chúng ta tìm thấy đội ngũ nghiên cứu bị nạn, toàn bộ những người sống sót đã bị bắt giữ."
 observation.203.gestalt.start:0 "Quân đội [GetPreFTLUpper] của [pre_ftl_planet.GetName] đã tới điểm rơi trước khi chúng ta tìm thấy đội ngũ nghiên cứu bị nạn, toàn bộ các cá thể con đặc vụ tự chủ đã bị bắt giữ."
 observation.203.reg.end:0 "Các [GetPreFTLLowerPlural] đã thiết lập vành đai phòng thủ quanh xác tàu con thoi, những nhà khoa học giỏi nhất của họ chắc chắn đang tiến hành phân tích nó.\n\nGiờ đây họ đã có bằng chứng xác thực rằng, ngoài hành tinh của chính họ cũng tồn tại sự sống. Việc này rốt cuộc sẽ gây ra tác động gì đến xã hội của họ thì vẫn còn phải chờ xem..."
 observation.203.hive_mind.end:0 "Các [GetPreFTLLowerPlural] đã thiết lập vành đai phòng thủ quanh xác tàu, họ không nghi ngờ gì nữa đang tiến hành phân tích nó.\n\nGiờ đây họ đã có bằng chứng xác thực rằng, sự sống tồn tại bên ngoài hành tinh của chính họ. Việc này rốt cuộc sẽ gây ra tác động gì đến xã hội của họ thì vẫn còn phải chờ xem..."

 observation.203.reg_pre_ftl.desc:0 "$observation.203.start$\n\n$observation.203.reg.end$"
 observation.203.hive_pre_ftl.desc:0 "$observation.203.start$\n\n$observation.203.hive_mind.end$"
 observation.203.reg_pre_ftl.desc.gestalt:0 "$observation.203.gestalt.start$\n\n$observation.203.reg.end$"
 observation.203.hive_pre_ftl.desc.gestalt:0 "$observation.203.gestalt.start$\n\n$observation.203.hive_mind.end$"
 observation.203.a:1 "Chuyện này không ổn rồi."

# Nuclear War, everyone dead, planet is a tomb world
 observation.205.name:0 "[pre_ftl_planet.GetName] rơi vào chiến tranh hạt nhân"

 observation.205.reg.start:0 "Vài quốc gia trên [pre_ftl_planet.GetName] đã liên minh lại để chống lại quốc gia đã bắn hạ tàu con thoi của ta, bởi quốc gia đó từ chối chia sẻ những công nghệ thu hồi được từ hiện trường vụ rơi tàu."
 observation.205.hive_mind.start:0 "Một bước ngoặt chưa từng có đã xảy ra, vài ý thức trên [pre_ftl_planet.GetName] bắt đầu hợp nhất để đối đầu với ý thức đã bắn hạ tàu con thoi của ta, phía sau đã từ chối chia sẻ công nghệ mà họ thu hồi được từ địa điểm rơi tàu."
 observation.205.end:0 "Sau một cuộc chiến tranh quy ước ngắn ngủi, đôi bên đã phóng một lượng lớn tên lửa hạt nhân vào nhau, phá hủy hoàn toàn phần lớn các khu vực của [pre_ftl_planet.GetPlanetHabitat].\n\nKhông tìm thấy bất kỳ ai sống sót trên bề mặt, bao gồm cả những nhà khoa học bị bắt của chúng ta, và môi trường cũng bị tàn phá rõ rệt."
 observation.205.gestalt.end:0 "Sau một cuộc chiến tranh quy ước ngắn ngủi, đôi bên đã phóng một lượng lớn tên lửa hạt nhân vào nhau, phá hủy hoàn toàn phần lớn các khu vực của [pre_ftl_planet.GetPlanetHabitat].\n\nKhông tìm thấy bất kỳ ai sống sót trên bề mặt, bao gồm cả những [GetIndividualNamePlural] bị bắt của chúng ta, và môi trường cũng bị tàn phá rõ rệt."

 observation.205.reg_pre_ftl.desc:0 "$observation.205.reg.start$\n\n$observation.205.end$"
 observation.205.hive_pre_ftl.desc:0 "$observation.205.hive_mind.start$\n\n$observation.205.end$"
 observation.205.reg_pre_ftl.desc.gestalt:0 "$observation.205.reg.start$\n\n$observation.205.gestalt.end$"
 observation.205.hive_pre_ftl.desc.gestalt:0 "$observation.205.hive_mind.start$\n\n$observation.205.gestalt.end$"

 observation.205.a:1 "Giá như tàu con thoi của chúng ta không bị rơi..."

# Nuclear War, everyone dead, planet is a toxic world
 observation.206.name:0 "$observation.205.name$"

 observation.206.reg.start:0 "$observation.205.reg.start$"
 observation.206.hive_mind.start:0 "$observation.205.hive_mind.start$"
 observation.206.end:0 "Sau một cuộc chiến tranh quy ước ngắn ngủi, đôi bên đã phóng một lượng lớn tên lửa hạt nhân vào nhau, phá hủy hoàn toàn phần lớn các khu vực của [pre_ftl_planet.GetPlanetHabitat].\n\nMọi người trên bề mặt đã bị xóa sổ sạch sành sanh, [pre_ftl_planet.GetName] không còn khả năng duy trì sự sống nữa. Những nhà khoa học bị bắt của chúng ta cũng nằm trong số hàng tỷ người đã khuất."
 observation.206.gestalt.end:0 "Sau một cuộc chiến tranh quy ước ngắn ngủi, đôi bên đã phóng một lượng lớn tên lửa hạt nhân vào nhau, phá hủy hoàn toàn phần lớn các khu vực của [pre_ftl_planet.GetPlanetHabitat].\n\nMọi người trên bề mặt đã bị xóa sổ sạch sành sanh, [pre_ftl_planet.GetName] không còn khả năng duy trì sự sống nữa. Những [GetIndividualNamePlural] bị bắt của chúng ta cũng nằm trong số hàng tỷ người đã khuất."

