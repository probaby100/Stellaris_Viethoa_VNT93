# Nuclear War, pre-ftls regress to stone age, planet is a tomb world
 observation.207.name:0 "$observation.205.name$"

 observation.207.reg.start:0 "$observation.205.reg.start$"
 observation.207.hive_mind.start:0 "$observation.205.hive_mind.start$"
 observation.207.end:0 "Sau một cuộc chiến tranh quy ước ngắn ngủi, đôi bên đã phóng một lượng lớn tên lửa hạt nhân vào nhau, phá hủy hoàn toàn phần lớn các khu vực của [pre_ftl_planet.GetPlanetHabitat].\n\n[pre_ftl_planet.GetPlanetHabitat] đã bị tàn phá nghiêm trọng, toàn bộ các thành phố lớn đều bị phá hủy, hơn 90% dân số thiệt mạng. Dẫu có vài người sống sót lẻ tẻ hiện diện từ trong đống đổ nát, nhưng các nhà nghiên cứu của chúng ta dự đoán nền văn minh [pre_ftl_planet.GetPlanetHabitat] sẽ thoái lui về một trạng thái cực kỳ kém phát triển nào đó. Những nhà khoa học bị bắt của chúng ta cũng nằm trong số hàng tỷ người đã khuất."
 observation.207.gestalt.end:0 "Sau một cuộc chiến tranh quy ước ngắn ngủi, đôi bên đã phóng một lượng lớn tên lửa hạt nhân vào nhau, phá hủy hoàn toàn phần lớn các khu vực của [pre_ftl_planet.GetPlanetHabitat].\n\n[pre_ftl_planet.GetPlanetHabitat] đã bị tàn phá nghiêm trọng, toàn bộ các thành phố lớn đều bị phá hủy, hơn 90% dân số thiệt mạng. Dẫu có vài người sống sót lẻ tẻ hiện diện từ trong đống đổ nát, nhưng chúng ta dự đoán nền văn minh [pre_ftl_planet.GetPlanetHabitat] sẽ thoái lui về một trạng thái cực kỳ kém phát triển nào đó. Những [root.GetIndividualNamePlural] bị bắt của chúng ta cũng nằm trong số hàng tỷ người đã khuất."

