 distar.51.more:0 "Những cái tên này tệ thật đấy. Chúng ta nên nghĩ ra cái tên nào hay hơn."
 distar.52.name:0 "Mất Trùng Biến Hình Non"
 distar.52.desc:0 "Các nhà nghiên cứu báo cáo rằng con Trùng Biến Hình non tìm thấy gần [From.From.GetName] không còn bám theo tàu khoa học của chúng ta nữa. Sau nhiều nỗ lực lẩn tránh không ngừng của chúng ta, sinh vật này dường như đã chán nản và bơi đi nơi khác trong khoảng không sâu thẳm."
 distar.53.name:0 "Mổ Xẻ Trùng Biến Hình Non"
 distar.53.desc.base:0 "Quá trình mổ xẻ mẫu vật Trùng Biến Hình non đã hoàn tất. Mặc dù phần lớn cấu trúc mô đã bị phá hủy trong quá trình bắt giữ, các nghiên cứu sinh học ngoài hành tinh trên phần còn lại vẫn tiết lộ khả năng tái tạo mô đáng kinh ngạc."
 distar.53.desc.lacks_tech:0 "$distar.53.desc.base$\n\nNói một cách đơn giản, sinh vật này tái tạo mô không chỉ thông qua quá trình phân chia tế bào mà còn nhờ vào một chủng vi khuẩn gốc silicon độc đáo hoạt động cộng sinh trong cơ thể."
 distar.53.desc.has_tech:1 "$distar.53.desc.base$\n\nNhững phát hiện này hoàn toàn trùng khớp với các nghiên cứu trước đây của chúng ta về đặc tính phục hồi mô bắt nguồn từ mối quan hệ cộng sinh giữa Trùng Biến Hình và vi khuẩn gốc silicon."
 distar.54.name:0 "Trùng Biến Hình Non Đào Tẩu"
 distar.54.desc:0 "Do chúng ta chậm trễ trong việc triển khai kế hoạch mổ xẻ, con Trùng Biến Hình non dường như đã chạy thoát. Cảm biến cho thấy vài giờ trước nó đã kích hoạt một dạng động cơ siêu không gian sinh học thô sơ và nhảy vọt sang hệ sao khác."
 distar.55.name:0 "Tên Gọi Có Ý Nghĩa Gì?"
 distar.55.desc:0 "Linh vật mà không có tên thì ra thể thống gì? Chúng ta phải nghĩ ra một biệt danh xứng đáng cho người bạn ngoài hành tinh của mình."
