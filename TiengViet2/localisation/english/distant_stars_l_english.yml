 distar.56.desc:0 "Chúng ta có khả năng phá vỡ mọi ranh giới của không gian và thời gian, du hành nhanh hơn ánh sáng. Ấy thế mà chúng ta lại không thể thống nhất nổi một cái tên cho con Trùng Biến Hình.\n\nĐây là cơ hội cuối cùng của chúng ta."
