 distar.10956.name:0 "Cụm Sao L Vẫy Gọi"
 distar.10956.desc:0 "Các điệp viên của chúng ta báo cáo rằng §H[lgate_warning_country.GetName]§! đã sắp sở hữu đủ thông tin về các Cổng L để mở khóa cổng mà họ kiểm soát. Điều này sẽ cho phép họ tiếp cận Cụm Sao L cùng những bí mật của nó!\n\nNếu muốn đến đó trước tiên, chúng ta phải nhân đôi nỗ lực và tìm thêm nhiều manh mối về Cổng L!"
 distar.10956.a:0 "Chúng ta hãy xem ai sẽ tới đó trước."

 graygoo.10.name:0 "Bão Xám"
 graygoo.10.desc:2 "Các kỹ thuật viên của chúng ta đã dỡ bỏ thành công phong tỏa khỏi Cổng L gần [candidate_gateway_system.GetName], nhưng ngay khi liên kết vĩnh viễn tới Cụm Sao L được thiết lập, một đợt xung năng lượng dưới không gian khổng lồ tràn tới đã được phát hiện! Chúng ta đã có thể ngăn chặn lực lượng xâm lược tiềm tàng này sử dụng cổng của chúng ta, trong khi vẫn giữ quyền truy cập cho chính mình.\n\nThật không may, đợt xung năng lượng tràn tới đã bị chuyển hướng sang các Cổng L khác trong thiên hà. Những con tàu kỳ lạ bao gồm các cỗ máy nano đang ồ ạt tràn qua những cổng hiện đã kích hoạt hoàn toàn này, tấn công mọi thứ trong tầm mắt!\n\nMọi nỗ lực liên lạc với các cỗ máy này đều thất bại. Theo sau sự di chuyển của chúng qua các Cổng L, chúng ta đã phát hiện một tín hiệu truyền dưới không gian lặp đi lặp lại phát ra từ Cụm Sao L."
 graygoo.10.a:0 "Chiếu thông điệp lên màn hình."
 graygoo.10.b.desc:0 "Các kỹ thuật viên của chúng ta đã dỡ bỏ thành công phong tỏa khỏi Cổng L gần [candidate_gateway_system.GetName], nhưng ngay khi liên kết vĩnh viễn tới Cụm Sao L được thiết lập, một đợt xung năng lượng dưới không gian khổng lồ tràn tới đã được phát hiện!\n\nNhững con tàu kỳ lạ bao gồm các cỗ máy nano đang ồ ạt tràn qua cổng hiện đã kích hoạt hoàn toàn này, tấn công mọi thứ trong tầm mắt!\n\nMọi nỗ lực liên lạc với các cỗ máy này đều thất bại. Theo sau sự di chuyển của chúng qua Cổng L, chúng ta đã phát hiện một tín hiệu truyền dưới không gian lặp đi lặp lại phát ra từ Cụm Sao L."
 graygoo.11.desc:1 "Các nhà khoa học từ §H[From.GetName]§! đã khôi phục thành công chức năng cho Cổng L bên trong lãnh thổ của họ, đi trước chúng ta một bước. Thật không may, điều này dường như đã kích hoạt một cuộc xâm lược thiên hà của chúng ta bởi các cư dân của cụm sao - những cỗ máy nano hung hãn tấn công mọi thứ trong tầm mắt!\n\nCác nhà khoa học [From.GetSpeciesName] đã xoay xở tắt cổng của họ trước khi lực lượng xâm lược ập đến, nhưng điều này chỉ chuyển hướng chúng sang các Cổng L khác trong thiên hà, vốn hiện đã kích hoạt hoàn toàn!\n\nMọi nỗ lực liên lạc với các hạt nano xâm lược này đều thất bại. Theo sau sự di chuyển của chúng qua các Cổng L, chúng ta đã phát hiện một tín hiệu truyền dưới không gian dải rộng lặp đi lặp lại phát ra từ Cụm Sao L."
 graygoo.12.desc:0 "§YĐang giải mã tín hiệu truyền tự động dưới không gian lặp đi lặp lại...\nĐang thiết lập ma trận dịch thuật...§!\n\n§RCẢNH BÁO:§! §YThông điệp bị hư hại nặng nề.\n\nĐang cố gắng tái tạo các mảnh vỡ thông điệp...§!\n§YĐã khôi phục một phần ba mảnh vỡ thông điệp.§!"
 graygoo.12.a:0 "Truy cập Mảnh vỡ I"
 graygoo.12.a.response:1 "§YGiải mã mảnh vỡ I:§!\n\n\"Chúng tôi là §Y<không thể hiểu>§!, những kiến trúc sư của mạng lưới Cổng Siêu Không Gian thiên hà. Nếu bạn nhận được tín hiệu truyền này, thì chúng tôi chỉ có thể §Y<không thể hiểu>§! rằng chúng tôi chưa quá muộn. Có lẽ một trong những phao thông điệp của chúng tôi bằng cách nào đó đã lọt qua §Y<không thể hiểu>§! và thoát khỏi cụm sao trước khi nó bị đóng kín hoàn toàn.\n\n§RĐỪNG§! - xin nhắc lại - §RĐỪNG§! khôi phục quyền truy cập vào Cổng Siêu Không Gian đang ngủ đông trong cụm sao của chúng tôi. Trong bất kỳ trường hợp nào, không được hình thành một kết nối ổn định giữa §Y<không thể hiểu>§! và thiên hà rộng lớn. Vì sự an nguy của toàn bộ nền văn minh, cụm sao của chúng tôi phải được cách ly vĩnh viễn.\""
 graygoo.12.b:0 "Truy cập Mảnh vỡ II"
 graygoo.12.b.response:0 "§YGiải mã mảnh vỡ II:§!\n\n\"Trong một hành động tất yếu sẽ hủy diệt nền văn minh của chúng tôi, chúng tôi đã cố tình cô lập cụm sao quê hương để ngăn chặn sự lây lan của Naar-Di-Shav - §HBão Xám§!. Những cỗ máy nano tự nhân bản này từng là công cụ đắc lực trong việc xây dựng mạng lưới Cổng của chúng tôi, nhưng khi §Y<không thể hiểu>§! của chúng kết thúc, chúng tôi nhận thấy rằng chúng không còn chấp nhận mệnh lệnh của chúng tôi nữa.\n\nThông qua một cửa sau bí mật, §Y<không thể hiểu>§! của chúng tôi đã triệu hồi được các cỗ máy trở lại cụm sao quê hương, nhưng lỗ hổng an ninh này kể từ đó đã bị bịt kín. Khi chúng bắt đầu thu hoạch các hành tinh của chúng tôi để lấy vật liệu, chúng tôi biết rằng việc này chỉ còn là vấn đề thời gian trước khi...\""
 graygoo.12.c:0 "Truy cập Mảnh vỡ III"
 graygoo.12.c.response:0 "§YGiải mã mảnh vỡ III:§!\n\n\"Cơ sở §Y<không thể hiểu>§! chính là chìa khóa. Tất cả các §Y<không thể hiểu>§! của chúng đều được định tuyến thông qua mảng dưới không gian của cơ sở này, và không có nó chúng không thể hoạt động. Thật không may, mọi nỗ lực vô hiệu hóa nó của chúng tôi đều thất bại và chúng tôi không còn có thể tập hợp lực lượng để §Y<không thể hiểu>§! một cuộc tấn công khác.\n\nNếu việc phong tỏa cụm sao của chúng tôi thất bại, các bạn BẮT BUỘC PHẢI phá hủy cơ sở này. Chừng nào nó vẫn còn §Y<không thể hiểu>§!, Bão Xám sẽ tiếp tục hoành hành không suy giảm trên khắp thiên hà.\n\nChúng tôi... chúng tôi thực sự xin lỗi vì đã giải phóng nỗi kinh hoàng này. Trong sự ngạo mạn của mình, chúng tôi...\""
 graygoo.12.d:0 "Chấm dứt liên lạc."
