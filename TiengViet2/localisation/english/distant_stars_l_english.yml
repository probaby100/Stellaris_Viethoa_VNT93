 action.92.part1:0 "Tàu [Root.GetName] đã phát hiện dấu vết của một §HTài Nguyên Chiến Lược§! mới, được gọi là "
 action.92.part2:0 ", trong quá trình khảo sát [From.GetName]."

 action.92.generic:0 "\n\nChúng ta chắc chắn sẽ tìm thấy nhiều loại tài nguyên này hơn khi tiếp tục khám phá thiên hà, mỗi loại đều có những đặc tính và ứng dụng độc đáo."

 action.92.a: "Có tiềm năng hữu ích."

 action.92.name:0 "§Y[Root.GetName]§!: Phát Hiện Tài Nguyên Mới"
 action.92.garanthium:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HQuặng Garanthium§!. Nó dường như là một vật liệu tuyệt vời để sử dụng trong đóng tàu, giúp gia cường đáng kể thân tàu."
 action.92.lythuric:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HKhí Lythuric§!. Khí này có thể được sử dụng để tối ưu hóa hiệu suất của các lá chắn năng lượng trên tàu."
 action.92.teldar:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HTinh Thể Teldar§!. Các tinh thể này sở hữu độ cứng đáng kinh ngạc, rất lý tưởng để chế tạo đạn động năng xuyên phá."
 action.92.yurantic:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HTinh Thể Yurantic§!. Cấu trúc tinh thể đặc biệt của nó cho phép khuếch đại sức công phá của vũ khí năng lượng."
 action.92.aldar:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HTinh Thể Aldar§!. Sự giãn nở nổ tung của nó khi bị nứt vỡ khiến nó trở thành thành phần hoàn hảo cho các đầu đạn nổ phân mảnh."
 action.92.orillium:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HQuặng Orillium§!. Chất nổ chiết xuất từ quặng này có sức công phá vô cùng khủng khiếp."
 action.92.pitharan:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HBụi Pitharan§!. Chất aerosol này có thể được dùng làm chất xúc tác trong các lò phản ứng năng lượng hành tinh."
 action.92.engos:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HHơi Engos§!. Hơi này có thể kích thích đáng kể sự phát triển và trao đổi chất của các sinh vật hữu cơ."
 action.92.neutronium:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HQuặng Neutronium§!. Mật độ siêu đặc của nó làm cho nó trở thành vật liệu giáp bảo vệ tối thượng."
 action.92.zro.common: "Tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §H$sr_zro$§! trong hệ sao §Y[Root.Fleet.GetStarName]§!."
 action.92.zro: "$action.92.zro.common$ Đây là một loại aerosol quý hiếm không rõ nguồn gốc, và khi được [Root.Owner.GetIngestedLoc], nó sẽ tăng cường năng lực của các [Root.Owner.GetIndividualNamePlural] có năng khiếu tâm linh.$action.92.part3$"
 action.92.dark_matter:1 "Tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HVật Chất Tối§! trong hệ sao §Y[Root.Fleet.GetStarName]§!. Nó dường như bất chấp nhiều quy luật tự nhiên, và có tiềm năng cách mạng hóa nền khoa học."
 action.92.satramene:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HKhí Satramene§!. Loại khí kích thích tự nhiên này có tác dụng làm dịu hầu hết các sinh vật, thường thúc đẩy các hành vi tìm kiếm sự đồng thuận trong tập thể. Nó có tiềm năng gây nghiện."
 action.92.living_metal:1 "Tàu [Root.GetName] đã phát hiện một tài nguyên chiến lược chưa từng được biết đến trước đây mang tên §HKim Loại Sống§! trong hệ sao §Y[Root.Fleet.GetStarName]§!. Nó có những đặc tính thường chỉ thấy ở các dạng sống sinh học, và sẽ luôn cố gắng tái sinh trở lại hình dạng mà nó đã được định hình ổn định."
 action.92.terraform_liquids:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện những mỏ lớn chứa nhiều loại §HChất Lỏng Cải Tạo Địa Hình§! quý hiếm. Việc tiếp cận các chất lỏng này sẽ hỗ trợ đắc lực cho quá trình cải tạo địa hình các hành tinh."
 action.92.terraform_gases:1 "Trong quá trình khảo sát [From.GetName], tàu [Root.GetName] đã phát hiện những mỏ lớn chứa nhiều loại §HKhí Cải Tạo Địa Hình§! quý hiếm. Với nguồn cung cấp ổn định các loại khí này, quá trình cải tạo địa hình các hành tinh sẽ trở nên ít tốn kém hơn."
 action.92.has_tech:0 "\nChúng ta có công nghệ - nếu kiểm soát hệ sao này, chúng ta có thể khai thác tài nguyên này.$action.92.generic$"
 action.92.no_tech:0 "\nChúng ta chưa thể khai thác tài nguyên này, nhưng chúng ta có thể thiết lập quyền kiểm soát hệ sao để khai thác trong tương lai.$action.92.generic$"

 action.92.zro.mindwarden: "$action.92.zro.common$\n\nCác đặc tính của loại aerosol hiếm này đã được ghi nhận là thể hiện tác động xâm lấn thần kinh dị thường, và do đó đã được chỉ định là chất bị kiểm soát cấp alpha. Nó vẫn có thể chứng minh là có giá trị trong việc phát triển các công nghệ cách ly tinh thần.$action.92.generic$"

 action.942.name: "Phát Hiện Mỏ $sr_zro$"
 action.942.desc: "Tàu [Root.GetName] đã phát hiện các mỏ tài nguyên chiến lược ID: §H'$sr_zro$'§! trong hệ sao §H[Root.Fleet.GetStarName]§!.\n\nLoại aerosol hiếm này có nhiều ứng dụng. Phân tích đã chỉ ra rằng các mẫu đã qua xử lý thậm chí có thể ảnh hưởng đến hoạt động của các đơn vị [Owner.GetSpeciesAdj] có đặc tính 'tâm linh', chẳng hạn như Shroud-Forged. Với công nghệ $tech_mine_zro$ của chúng ta, chúng ta sẽ có khả năng khai thác tài nguyên này nếu kiểm soát hệ sao [Root.Fleet.GetStarName].$action.92.generic$"
 action.942.a: "Một phát hiện tối ưu."

