 LARGE_TIYANKI_ARMOR:0 "Giáp Tiyanki Lớn"

# MODIFIERS:
 in_paradise:0 "Nơi Lạc Viên"
 in_paradise_desc:2 "Công dân của chúng ta hân hoan khi cuối cùng đã định cư trên thế giới thiên đường tuyệt mỹ này."
 paradise_planet:0 "Paridayda"
 paradise_planet_desc:0 "Một thế giới tựa chốn bồng lai tiên cảnh với vẻ đẹp vô song."
 mega_computer:0 "Robot Hầm Ngục"
 mega-computer_desc:0 "Chúng ta có một robot hầm ngục đang hỗ trợ đắc lực cho bộ phận kỹ thuật của chúng ta."
 a_hitchikers_guide_to_the_galaxy_desc:0 "Một cuốn cẩm nang du hành thiên hà của người ngoài hành tinh đã truyền cảm hứng mạnh mẽ cho người dân của chúng ta."
 a_hitchikers_guide_to_the_galaxy:0 "Cẩm Nang Thiên Hà Ngoại Tộc"
 littering_loitering_liability:0 "Gánh Nặng Rác Rưởi Và Lêu Lổng"
 littering_loitering_liability_desc:0 "Lũ ngoại tộc dơ dáy..."
 ancient_harvesters:0 "Máy Thu Hoạch Cổ Đại"
 ancient_harvesters_desc:0 "Những cỗ máy thu hoạch cổ đại chạy bằng năng lượng mặt trời đang hỗ trợ việc thu hoạch mùa màng trên hành tinh."
 seismological_phenomena:0 "Hiện Tượng Địa Chấn"
 seismological_phenomena_desc:0 "Thế giới này đang phải chịu đựng những hiện tượng địa chấn bất thường và nguy hiểm."
 seismological_phenomena_2:0 "$seismological_phenomena$"
 seismological_phenomena_2_desc:0 "$seismological_phenomena_desc$"
 egg_rifts:0 "Các Khe Nứt"
 egg_rifts_desc:0 "Chất nhầy độc hại và khí gas liên tục rỉ ra từ các khe nứt sâu hoắm kéo dài khắp bề mặt hành tinh. Toàn bộ thế giới nồng nặc mùi lưu huỳnh trứng thối."
