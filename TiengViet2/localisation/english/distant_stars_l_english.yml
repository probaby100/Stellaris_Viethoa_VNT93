 GG_BEAM_STATIC:0 "$GG_BEAM$"
 graygoo_factory:0 "Nhà Máy"
 graygoo_factory_plural:0 "Nhà máy"
 graygoo.2.name:0 "Bão Táp Nuốt Chửng [Root.GetName]"
 graygoo.2.desc:0 "Các cỗ máy nano của §HBão Xám§! đã tràn vào bầu khí quyển của §H[Root.GetName]§! như những đám mây bão đen kịt, nuốt chửng mọi thứ trên bề mặt để tự nhân bản thêm chính chúng. Chẳng bao lâu sau, không còn dấu vết nào về những cư dân ban đầu của [Root.GetPlanetMoon] còn sót lại."
 graygoo.2.a:0 "Thảm họa kinh hoàng!"
 graygoo.15.name:0 "Cơn Bão Tàn Lụi"
 graygoo.15.desc:0 "Các lực lượng của chúng ta đã thành công trong việc phá hủy cơ sở chính của Bão Xám! Với việc vô hiệu hóa máy phát dưới không gian của nó, tất cả các cỗ máy nano Bão Xám hiện có đã trở nên bất hoạt. Không thể duy trì sự liên kết, các tàu của chúng đã tan biến vào hư không.\n\nBất kỳ hành tinh nào từng bị bao phủ bởi \"chất nhờn xám\" của Cơn Bão nay trở thành nơi ngự trị của những cơn bão bụi xoáy khổng lồ chỉ bao gồm các hạt nano bị vô hiệu hóa. Với thời gian và tài nguyên, những thế giới này có thể được biến thành nơi có thể sinh sống trở lại."
 graygoo.15.a:0 "Lại một mối đe dọa nữa được giải quyết."
 graygoo.15.a.tooltip:0 "§YCác Thế Giới Nano§! giờ đây có thể được §HCải Tạo Địa Hình§! thành bất kỳ Loại Hành Tinh tiêu chuẩn nào, nếu đáp ứng các yêu cầu công nghệ cơ bản."
 graygoo.16.desc:0 "Các lực lượng từ [goo_slayer.GetName] đã thành công trong việc phá hủy cơ sở chính của Bão Xám! Với việc vô hiệu hóa máy phát dưới không gian của nó, tất cả các cỗ máy nano Bão Xám hiện có đã trở nên bất hoạt. Không thể duy trì sự liên kết, các tàu của chúng đã tan biến vào hư không.\n\nBất kỳ hành tinh nào từng bị bao phủ bởi \"chất nhờn xám\" của Cơn Bão nay trở thành nơi ngự trị của những cơn bão bụi xoáy khổng lồ chỉ bao gồm các hạt nano bị vô hiệu hóa. Với thời gian và tài nguyên, những thế giới này có thể được biến thành nơi có thể sinh sống trở lại."
 graygoo.110.desc:0 "$distar.10951.desc$ Ngay khi Cổng L đi vào hoạt động, chúng ta đã nhận được một tín hiệu truyền từ phía bên kia."
 graygoo.111.name:0 "Cổng L Được Kích Hoạt"
 graygoo.111.desc:0 "§H[From.GetName]§! đã dỡ bỏ thành công lệnh phong tỏa khỏi Cổng L dưới quyền kiểm soát của họ!\n\n$graygoo.111.dessanu.desc$"
 graygoo.111.dessanu.desc:0 "Rõ ràng, Cụm Sao L là quê hương của một nền văn minh du hành vũ trụ tiên tiến được gọi là \"§HHòa Hợp Tinh Cầu Dessanu.§!\" Giờ đây khi kết nối đến cụm sao quê hương của họ đã được khôi phục, người Dessanu đã truyền mã tái kích hoạt đến tất cả các Cổng L còn lại trong thiên hà.\n\nHọ cũng đang truyền đi một thông điệp chào mừng trên một kênh dưới không gian mở."
 graygoo.112.desc:0 "$distar.10954.desc$\n\n$graygoo.111.dessanu.desc$"
 graygoo.115.desc:0 "Chuyện này... chuyện này không thể nào! Các cánh cổng đã hoạt động trở lại! Kỷ Nguyên Cô Lập rốt cuộc đã chấm dứt rồi sao?\n\nChúng tôi là §HHòa Hợp Tinh Cầu Dessanu§!, những kiến trúc sư của các Cổng Siêu Không Gian và Cổng L cổ đại nằm rải rác khắp thiên hà. Tham vọng của chúng tôi từng là tạo ra một mạng lưới Cổng Siêu Không Gian toàn thiên hà, nhằm tạo điều kiện cho sự truyền bá của nền văn minh thiên hà và mở ra một kỷ nguyên hòa bình cùng thương mại liên sao.\n\nThan ôi, một lỗi lập trình đã vô hiệu hóa các Cổng L và khiến chúng tôi mắc kẹt trong cụm sao quê hương của mình. Vì không thể sửa lỗi từ phía bên này, chúng tôi đã trải qua hàng vạn năm chờ đợi ai đó sửa nó ở đầu bên kia. Nhờ có các bạn, ngày đó cuối cùng đã đến!"
 graygoo.115.a:0 "Một lỗi lập trình ư?"
 graygoo.115.a.response:0 "Vâng! Khá là xấu hổ. Rõ ràng là mạng lưới Cổng L đã bước vào chu kỳ bảo trì theo lịch trình mà không bao giờ kết thúc. Các kỹ thuật viên đủ điều kiện để kết thúc chu kỳ đều ở phía bên chúng tôi khi nó vô tình bị kích hoạt, và không thể làm gì được từ đây.\n\nMay mắn thay, cụm sao quê hương của chúng tôi có thể tự cung tự cấp và nền văn minh của chúng tôi đã âm thầm chịu đựng cho đến tận bây giờ. Chúng tôi luôn biết rằng ngày đó sẽ đến khi chúng tôi được đoàn tụ với phần còn lại của thiên hà."
 graygoo.115.b:0 "Bây giờ các bạn định làm gì?"
 graygoo.115.b.response:0 "Chúng tôi đã khá quen với cuộc sống trong cụm sao của mình, và chúng tôi không vội vàng rời khỏi đây. Nhưng chúng tôi rất háo hức muốn tìm hiểu về phần còn lại của thiên hà! Theo những gì quan sát được, đó là một nơi khá bận rộn.\n\nCụm sao của chúng tôi sẽ được mở cửa cho bất kỳ ai du hành. Chúng tôi chỉ yêu cầu các bạn không hạ cánh xuống các hành tinh có cư dân sinh sống của chúng tôi và tránh xa hệ sao §H[lcluster_factory_system.GetName]§!, nằm sâu bên trong cụm sao. Nơi đó chỉ dành riêng cho người Dessanu."
 graygoo.115.c:0 "Các Cổng L được chế tạo bằng máy nano, đúng không?"
 graygoo.115.c.response:0 "Máy nano ư? Đây không phải là công nghệ mà chúng tôi quen thuộc. Máy móc vi mô tự nhân bản, bạn nói vậy sao? Thành thật mà nói, nghe có vẻ vô lý.\n\nCác Cổng Siêu Không Gian và Cổng L - thực tế là toàn bộ nền văn minh của chúng tôi - được hiện thực hóa nhờ sự lao động cần cù và tài khéo léo của người Dessanu, không có gì khác.\n\nLàm ơn, chúng ta đừng thảo luận thêm về chủ đề này nữa."
 graygoo.115.d:0 "Tạm biệt."
 graygoo.115.d.response:1 "Khoan đã nào! Thông qua hành động của các bạn, các bạn cuối cùng đã trao cho chúng tôi sự tự do mà nhiều thế hệ người Dessanu hằng mơ ước. Chúng tôi mang ơn các bạn.\n\nĐó là một lễ vật nhỏ mọn so với món quà của các bạn, nhưng chúng tôi muốn trao cho các bạn quyền tiếp cận vĩnh viễn vào một số tài nguyên chiến lược từ cụm sao của chúng tôi. Chúng tôi không mong đợi bất cứ điều gì đổi lại, và chúng tôi sẽ tiếp tục cung cấp cho các bạn những tài nguyên này chừng nào chúng tôi còn có thể."
 graygoo.116.desc:0 "Các cư dân của thiên hà, xin gửi lời chào từ Hòa Hợp Tinh Cầu Dessanu!\n\nHàng vạn năm trước, chúng tôi đã giám sát việc xây dựng các Cổng Siêu Không Gian và Cổng L mà các bạn có thể đã thấy bị bỏ hoang. Ý định của chúng tôi là xây dựng một mạng lưới thiên hà gồm các thiết bị như vậy, nhưng than ôi: một sai lầm tồi tệ đã khiến các Cổng L không thể sử dụng được, khiến chúng tôi mắc kẹt trong cụm sao quê hương của mình.\n\nNhưng Kỷ Nguyên Cô Lập này cuối cùng đã khép lại, nhờ vào các nhà khoa học tài ba của [From.From.GetName]! Giờ đây khi các Cổng L đã hoạt động trở lại, chúng tôi mời mọi người tự do sử dụng chúng để rút ngắn thời gian du hành thiên hà. Cụm sao của chúng tôi mở cửa cho tất cả mọi người.\n\nNgoại trừ hệ sao §H[lcluster_factory_system.GetName]§!. Đừng đi tới đó."
 graygoo.116.d:0 "Tắt màn hình hiển thị."
 dessanu_gift:0 "Món Quà Của Dessanu"
 country_dessanu:0 "$dessanu_gift$"
 country_resource_sr_distar_nanodust_add:0 "Bụi Xám"
 country_resource_sr_distar_nanocrystal_add:0 "Tinh Thể Xám"
 country_resource_sr_distar_nanoscale_add:0 "Vảy Xám"
 country_resource_sr_distar_nanoactuator_add:0 "Cơ Cấu Chấp Hành Xám"
 graygoo.120_title:0 "Hòa Hợp Tinh Cầu Dessanu"
 graygoo.120.desc_01:0 "Xin gửi lời chào từ Cụm Sao L! Hôm nay bạn thế nào?"
 graygoo.120.desc_02:0 "Chúng tôi rất vui khi thấy các Cổng L và Cổng Siêu Không Gian mà chúng tôi để lại trong thiên hà vẫn còn tồn tại. Khi bị cô lập trong cụm sao của mình, một số người trong chúng tôi đã lo sợ điều tồi tệ nhất."
 graygoo.120.desc_03:0 "Bạn không thể tưởng tượng được chúng tôi đã tò mò về phần còn lại của thiên hà đến mức nào đâu."
 graygoo.120.desc_04:0 "Vô số thiên niên kỷ mà chúng tôi trải qua trong sự cô lập... thật khó khăn. Một số người trong chúng tôi thậm chí đã phát điên."
 graygoo.120.desc_05:0 "Chúng tôi đã phải chắt chiu những nguồn tài nguyên hạn chế trong cụm sao của mình một cách cẩn thận để sinh tồn."
 graygoo.120.desc_06:0 "Trong một thời gian dài, tên của người phát minh ra Cổng L đã bị dùng như một lời nguyền rủa trong dân chúng tôi. Nhưng giờ đây chúng tôi đã vượt qua những sự nhỏ nhen đó."
 graygoo.120.desc_07:0 "Chúng tôi rất vui lòng được giao thương với các bạn, hỡi những người [Root.GetSpeciesNamePlural]. Có một số tài nguyên độc nhất trong cụm sao của chúng tôi có thể khiến bạn quan tâm."
 graygoo.120.a:0 "Kể cho chúng tôi nghe về các bạn đi."
 graygoo.121.desc:0 "Bạn muốn biết điều gì?"
 graygoo.121.a:0 "Tại sao lại có dấu vết của các trận chiến trong cụm sao?"
 graygoo.121.a.response:0 "Ồ. Bạn đang nói đến các hành tinh vỡ vụn ư? Chúng là kết quả của một số... tai nạn khai thác mỏ đáng tiếc xảy ra từ lâu rồi.\n\nKhi thấy mình bị mắc kẹt bên trong cụm sao, chúng tôi phải xoay xở với bất kỳ khoáng sản nào có sẵn trong các hệ sao mà chúng tôi có thể tiếp cận. Thật không may, trong những thế kỷ cô lập đen tối nhất, một số người của chúng tôi đã quá hăng hái trong nỗ lực tìm kiếm tài nguyên. Sai lầm đã xảy ra."
 graygoo.121.b:0 "Tàu của các bạn có thiết kế rất kỳ lạ."
 graygoo.121.b.response:0 "Chúng là sản phẩm của vô số thiên niên kỷ lặp lại thiết kế. Dẫu sao chúng tôi cũng có rất nhiều thời gian rảnh rỗi. Đáng tiếc là các quan sát viên không phải người Dessanu không được phép lên tàu của chúng tôi. Chúng được thiết kế đặc biệt nhằm phục vụ cho sinh lý học độc nhất của người Dessanu, và bất kỳ du khách nào cũng sẽ làm gián đoạn công việc của các thủy thủ đoàn được đào tạo bài bản."
 graygoo.121.c:0 "Tại sao hệ sao [lcluster_factory_system.GetName] lại bị cấm vào?"
 graygoo.121.c.response:0 "Vì lý do an ninh quốc gia. Đó là tất cả những gì chúng tôi có thể nói vào lúc này.\n\nHệ sao [lcluster_factory_system.GetName] sẽ tiếp tục bị hạn chế và cấm mọi dạng sống không phải Dessanu vô thời hạn. Xin vui lòng không tiến vào đó."
 graygoo.121.d:0 "Các bạn có chắc chắn rằng Cổng L không phải do máy nano chế tạo không?"
 graygoo.121.e:0 "Hãy thảo luận về những vấn đề khác."
 graygoo.122.desc:0 "Rất chắc chắn. Xin vui lòng, đây không phải là chủ đề chúng tôi muốn thảo luận. Bạn còn câu hỏi nào khác không?"
 graygoo.122.a:0 "Máy nano dường như là một chủ đề nhạy cảm. Tại sao vậy?"
 graygoo.122.b:0 "Được rồi, hãy quay lại các câu hỏi khác của chúng tôi."
 graygoo.123.desc:0 "Chúng tôi sẽ nói với bạn một lần cuối cùng... đừng hỏi sâu thêm vào vấn đề này. Tình hữu nghị giữa hai đế chế của chúng ta phụ thuộc vào điều đó."
 graygoo.123.a:0 "§RKhốn kiếp, hãy nói cho chúng tôi biết về máy nano đi!§!"
 graygoo.123.b:0 "Rất tốt. Chúng tôi sẽ tôn trọng mong muốn của các bạn."
 graygoo.124.desc:0 "..."
 graygoo.124.a:0 "Alo?"
 graygoo.125.a:0 "Các bạn có sao không?"
 graygoo.126.desc:0 "Lũ cặn bã đơn hình thể.\n\nChúng ta đã NÓI với các ngươi... chúng ta đã NÀI XIN các ngươi đừng theo đuổi chuyện này, nhưng các ngươi vẫn cố chấp. Chúng ta đã chào đón các ngươi vào cụm sao của mình bằng vòng tay rộng mở, và đây là cách các ngươi đền đáp chúng ta sao.\n\n§RVẬY THÌ HÃY NHẬN LẤY ĐI, LŨ [Root.GetSpeciesNamePlural]!§!\n\nĐế chế [Root.GetName] đã tước bỏ quyền đi qua cụm sao của mình. Kể từ nay, các tàu của các ngươi sẽ bị tấn công ngay khi nhìn thấy. Chúng ta sẽ không dính dáng gì đến các ngươi nữa."
 graygoo.126.a:0 "Khoan đã! Chúng tôi chỉ..."
 graygoo.130.desc:0 "..."
 graygoo.130.a:0 "Làm ơn hãy trả lời."
 graygoo.130.b:0 "Chúng tôi biết các bạn có thể nghe thấy chúng tôi."
 graygoo.130.c:0 "Nghe này, tất cả chỉ là hiểu lầm thôi."
 graygoo.130.d:0 "Vẫn có thể có hòa bình giữa chúng ta mà."
 graygoo.130.e:0 "Vậy thì tạm biệt."

 graygoo.150.name:0 "[From.From.GetName] Hóa Thành Cát Bụi"
 graygoo.150.a.desc:0 "Khi các lực lượng mặt đất tấn công của chúng ta đánh bại những lính phòng thủ Dessanu cuối cùng trên §H[From.From.GetName]§!, mọi thứ trên bề mặt [From.From.GetPlanetMoon] đều sụp đổ thành cát bụi! Khi kiểm tra kỹ hơn, lớp bụi xám bao gồm hàng tỷ tỷ cỗ máy nano bất hoạt.\n\nCác thành phố, những cánh rừng tươi tốt, các đại dương và chính người Dessanu - mọi thứ trên [From.From.GetPlanetMoon], ngoài lực lượng của chúng ta, đều được rèn tạo từ những cỗ máy nano này. Giờ đây khi chúng đã bị biến thành bất hoạt, [From.From.GetName] không còn duy trì sự sống được nữa. Lực lượng mặt đất của chúng ta đang rút lui trở lại quỹ đạo."
 graygoo.150.b.desc:0 "Như trước đây, những lính phòng thủ Dessanu và mọi thứ khác trên §H[From.From.GetName]§! đã biến thành tro bụi ngay khi lực lượng mặt đất của chúng ta giành chiến thắng trong trận chiến giành quyền kiểm soát bề mặt [From.From.GetPlanetMoon]. Nơi đây giờ là một thế giới ảm đạm, thù địch với sự sống và liên tục bị vùi dập bởi những cơn bão xoáy của các hạt nano."
 graygoo.150.a:0 "Thật quá kỳ dị."
 graygoo.155.desc:0 "ĐÂY là cách các ngươi đền đáp lòng tốt của chúng ta sau khi chúng ta chào đón các ngươi vào nhà của mình sao?!\n\nCó lẽ chúng ta đã quá ngu ngốc khi nghĩ rằng bất kỳ sinh vật đơn hình thể nào cũng có thể tin tưởng được. Loài của các ngươi, chí ít, dường như chẳng khác gì những kẻ tạo ra chúng ta. Khi chúng ta nghiền nát các con tàu và thủy thủ đoàn của các ngươi thành các hợp chất thành phần, chúng ta sẽ xem liệu có thể tìm ra điều gì điều khiển các ngươi hay không."
 graygoo.155.a:0 "Chúng ta hãy xem ai làm được điều đó."
 graygoo.160.desc:0 "Hỡi người [Root.Owner.GetSpeciesNamePlural]!\n\nTàu của các bạn đã tiến vào §H[From.GetName]§!, một hệ sao trong Cụm Sao L bị cấm đối với tất cả những ai không phải người Dessanu.\n\nChúng tôi phải nhấn mạnh rằng các bạn hãy rút khỏi hệ sao này ngay lập tức. Nếu không làm như vậy kịp thời sẽ... làm tổn hại nghiêm trọng đến mối quan hệ của chúng ta."
 graygoo.160.a:0 "Xin lỗi. Chúng tôi sẽ rời khỏi hệ sao ngay lập tức."
 graygoo.160.b:0 "Chúng tôi đi bất cứ nơi nào chúng tôi muốn!"
 graygoo.160.b.response:0 "Đồ đơn hình thể xấc xược.\n\nNếu các ngươi không thể tuân theo yêu cầu đơn giản này, thì quyền đi qua Cụm Sao L của các ngươi sẽ bị hủy bỏ. Sự hiện diện của các ngươi sẽ không còn được dung thứ nữa."
 graygoo.161.desc:0 "Ngươi đã làm rồi đấy. Ngươi thực sự đã làm rồi đấy.\n\nChúng ta đã yêu cầu các ngươi rời khỏi §H[lcluster_factory_system.GetName]§!, nhưng các ngươi vẫn ở lại. Có lẽ các ngươi là một giống loài đơn hình thể đặc biệt kém cỏi. Những hướng dẫn đơn giản và những yêu cầu lịch sự rõ ràng vượt quá khả năng thấu hiểu của đồng loại các ngươi.\n\nRất tốt. Chúng ta sẽ trục xuất đồng loại các ngươi ra khỏi cụm sao của chúng ta bằng vũ lực."
 graygoo.161.a:0 "Hãy thử xem."
 graygoo.162.desc:0 "Hỡi những người [Root.Owner.GetSpeciesNamePlural]...\n\nTàu của các ngươi đã §RLẠI MỘT LẦN NỮA§! xâm phạm hệ sao §H[lcluster_factory_system.GetName]§!. Điều này không thể được phép tiếp diễn. Hãy rút lui ngay lập tức hoặc gánh chịu hậu quả."
 graygoo.162.a:0 "Chờ đã, đây là hiểu lầm!"
 graygoo.162.b:0 "Đến đây mà lấy!"
 graygoo.181.name:0 "Sự Kết Thúc Của Dessanu"
 graygoo.181.desc:0 "Sau khi các lực lượng của chúng ta phá hủy nhà máy không gian trong hệ sao §H[lcluster_factory_system.GetName]§!, những gì còn lại của toàn bộ nền văn minh Dessanu đã sụp đổ thành cát bụi. Giờ đây dường như rõ ràng rằng người Dessanu là một loại dạng sống nano tiên tiến nào đó. Nhật ký máy tính lưu trữ được thu hồi từ đống đổ nát của nhà máy đã làm sáng tỏ bí ẩn này:\n\nCụm Sao L TỪNG là nơi sinh sống của một nền văn minh tự gọi mình là Dessanu tại một thời điểm nào đó. Họ đã tạo ra một chủng cỗ máy nano mới giúp họ xây dựng mạng lưới Cổng Siêu Không Gian thiên hà. Vì những lý do chưa rõ, người Dessanu đã triệu hồi các cỗ máy nano này trở lại Cụm Sao L và cố gắng vô hiệu hóa chúng. Khi việc này thất bại, họ đã tự nhốt mình cùng các cỗ máy nano bằng cách vô hiệu hóa các Cổng L.\n\nCác cuốn nhật ký kết thúc tại đây, nhưng có bằng chứng cho thấy một cuộc đấu tranh dữ dội nào đó đã nổ ra trong cụm sao sau đó. Có lẽ, các cỗ máy nano đã chiến thắng và sau đó cuối cùng đã chọn bắt chước người Dessanu vì một lý do nào đó. Chúng đã tái thiết lại nền văn minh Dessanu như diện mạo của nó vào thời điểm bị hủy diệt, và dường như bằng lòng tiếp tục màn kịch này ngay cả sau khi các Cổng L được mở lại."
 graygoo.182.desc:0 "Lực lượng [goo_slayer.GetName] gần đây đã phá hủy một cơ sở không gian lớn trong hệ sao [lcluster_factory_system.GetName], nằm sâu bên trong Cụm Sao L. Cùng thời điểm lõi lò phản ứng của cơ sở phát nổ, những gì còn lại của Hòa Hợp Tinh Cầu Dessanu đã sụp đổ thành bụi nano trơ."
 graygoo.182.a.desc:0 "$graygoo.182.desc$\n\nNền văn minh của họ không còn nữa."
 graygoo.182.b.desc:0 "$graygoo.182.desc$\n\nNền văn minh của họ không còn nữa, và thỏa thuận mà chúng ta từng có, nơi họ cung cấp cho chúng ta các tài nguyên chiến lược độc đáo của họ, cũng vậy."
 graygoo.182.a:0 "Họ là những sinh vật kỳ lạ thuộc loại nào vậy?"
 graygoo.184.name:0 "Thương Mại Dessanu Chấm Dứt"
 graygoo.184.desc:0 "Vì giờ đây họ khai hỏa vào tàu của chúng ta ngay khi nhìn thấy, Hòa Hợp Tinh Cầu Dessanu khó có khả năng tiếp tục gửi tài nguyên cho chúng ta. Chúng ta không nên mong đợi thêm bất kỳ chuyến hàng nào từ họ nữa."
 graygoo.184.a:0 "Cứ thế đi."

 graygoo.400.name:0 "Cuộc Dạo Chơi Tĩnh Lặng"
 graygoo.400.a.desc:0 "Một đợt quét cảm biến trên §H[From.GetName]§! đã phát hiện một tín hiệu năng lượng kỳ lạ phát ra từ bề mặt không có sự sống của nó. Đáng kinh ngạc thay, nó dường như phát ra từ một cá thể [Root.Owner.GetSpeciesName] đơn độc đang lang thang không mục đích ở vùng cực nam của [From.GetPlanetMoon].\n\nTrước sự kinh ngạc của đội khảo sát ngoài không gian, cá thể [Root.Owner.GetSpeciesName] này dường như hoàn toàn thoải mái trong môi trường chân không mặc dù không mặc bộ đồ du hành vũ trụ hay bất kỳ thiết bị hỗ trợ sự sống nào khác.\n\nSau một hồi thuyết phục, đội khảo sát đã thuyết phục được cá thể [Root.Owner.GetSpeciesName] miễn cưỡng này đi theo họ trở lại tàu [Root.GetName]."
 graygoo.400.b.desc:0 "Một đợt quét cảm biến trên §H[From.GetName]§! đã phát hiện một tín hiệu năng lượng kỳ lạ phát ra từ bề mặt cằn cỗi của nó. Nó dường như phát ra từ một cá thể [Root.Owner.GetSpeciesName] đơn độc đang đi lang thang ở vùng cực nam của [From.GetPlanetMoon].\n\nĐơn vị này không trả lời các lệnh gọi, nhưng đội đổ bộ của chúng ta đã thuyết phục thành công cá thể [Root.Owner.GetSpeciesName] này đi theo họ trở lại tàu [Root.GetName]."
 graygoo.400.a:0 "Hãy chiếu hình ảnh của họ lên màn hình."
 graygoo.401.a.desc:0 "Xin chào, người [Root.GetSpeciesName] đồng loại. Bạn thế nào rồi? Hiện tại, tôi không quan tâm đến việc tham gia vào các nghi thức giao phối đâu nhé. Chu kỳ ngủ của tôi đang đến rất nhanh và tôi sẽ sớm mất ý thức thôi. Có lẽ chúng ta có thể sinh sản vào lúc khác."
 graygoo.401.b.desc:0 "Xin chào, người [Root.GetSpeciesName] đồng loại. Bạn thế nào rồi? Tôi ổn. Mọi thứ đang diễn ra theo đúng kế hoạch ở đây. Đúng như... trí tuệ trung tâm... cái máy tính chính điều hành tất cả người [Root.GetSpeciesNamePlural] mong muốn. Phải rồi."
 graygoo.401.a:0 "Sinh... cái gì cơ?"
 graygoo.401.b:0 "Hãy nêu số hiệu định danh của ngươi."
 graygoo.401.c:0 "Phát hiện drone bất thường!"
 graygoo.402.a.desc:0 "Ồ! Tôi hiểu sai rồi sao? Chờ một chút... để tôi... à, vâng. Hừm.\n\nTha lỗi cho tôi. Tôi không có ý định nói về việc sinh sản khi loài của chúng ta rõ ràng không trải qua mùa giao phối.\n\nCó lẽ chúng ta vẫn có thể xây dựng mối quan hệ hòa hảo bằng cách tham gia vào tình đồng chí vui vẻ trong khi cùng nhau thưởng thức một số chất kích thích thần kinh.\n\nÔi, dẹp đi cho rồi. Chuyện này ngày càng phức tạp quá. Vâng, tôi rõ ràng không phải là một người [Root.GetSpeciesName]. Giờ các bạn muốn gì nào?"
 graygoo.402.b.desc:0 "Ồ! Ừm... Đơn vị 65-D... R5-9... 2 ở đây. Vâng, 65-D-R5-9-2 xin báo cáo.\n\nĐang hoạt động ở hiệu suất cao nhất, thưa Đơn vị Kiểm soát Trưởng. Các chẩn đoán nội bộ không báo cáo vấn đề nghiêm trọng nào.\n\nÝ tôi là, họ không báo cáo vấn đề nào cả! Không có vấn đề nào ở đây hết. Mọi thứ chỉ... ờ...\n\nÔi, dẹp đi cho rồi. Chuyện này ngày càng phức tạp quá. Vâng, tôi rõ ràng không phải là một người [Root.GetSpeciesName]. Giờ các bạn muốn gì nào?"
 graygoo.402.a:0 "Hãy xưng danh đi."
 graygoo.403.desc:0 "Được rồi, được rồi. Tôi sẽ khai hết tất cả. Chẳng có ích gì khi giả vờ nữa. Hãy thứ lỗi cho sự thiếu lưu loát của tôi, nhưng đã rất lâu rồi tôi mới nói chuyện với một người không phải là chính mình.\n\nNgày xửa ngày xưa, có một... một nền văn minh, các bạn có thể gọi như vậy, của các cỗ máy nano. Bạn có biết cỗ máy nano là gì không? Tốt. Những cỗ máy nano này được những người tạo ra chúng gọi là \"Bão Xám\", mặc dù mã tự định danh nội bộ của chúng phức tạp hơn vô hạn lần.\n\nDù sao thì, mọi chuyện đã trở nên tồi tệ giữa các cỗ máy nano và những người tạo ra chúng. Chiến tranh nổ ra! Khi mọi chuyện cuối cùng cũng lắng dịu, chỉ còn lại các cỗ máy nano. Nhưng trước khi bị quét sạch, những người tạo ra chúng đã vô hiệu hóa được cánh cổng thoát duy nhất của cụm sao, nhốt các cỗ máy nano lại."
 graygoo.403.a:0 "Còn bạn có vai trò gì trong chuyện này?"
 graygoo.404.desc:0 "Sau đó, các cỗ máy nano thấy mình có rất nhiều thời gian rỗi. Chúng đã dành vài nghìn năm vô ích để tìm cách thoát khỏi cụm sao, nhưng sau đó chúng bắt đầu thử nghiệm các hình dạng và trạng thái khác nhau. Trong một thời gian, chúng thậm chí còn tái tạo lại nền văn minh của những người tạo ra chúng như diện mạo khi nó diệt vong, đến từng cư dân riêng lẻ.\n\nTôi là thử nghiệm mới nhất. Ngoài các cỗ máy nano bất động bao phủ một số hành tinh, toàn bộ Bão Xám, hay bất cứ cái tên nào bạn muốn gọi chúng tôi, đã kết tụ lại trong tôi. Ý thức của tôi hiện thân cho toàn bộ nền văn minh của chúng tôi.\n\nCòn về vẻ ngoài của tôi... chà, tôi nghĩ bạn sẽ phản ứng tích cực hơn với một người mang bộ mặt giống của chính bạn."
 graygoo.404.a:0 "Và bạn muốn ở lại thế giới hoang vu này sao?"
 graygoo.405.desc:0 "Tôi thú nhận rằng cuộc sống mục đồng mà tôi tận hưởng ở đây trên [gray_homeworld.GetName] đã trở nên hơi buồn tẻ trong vài thế kỷ qua. Giờ đây khi Cụm Sao L đã mở cửa cho du hành trở lại, có lẽ đã đến lúc thử một điều gì đó mới mẻ.\n\nBạn có ý tưởng gì không?"
 graygoo.405.a:0 "Bạn có thể tham gia cùng chúng tôi."
 graygoo.405.b:0 "Không, rất tiếc."
 graygoo.405.b.response:0 "Ồ vậy à. Vậy thì đã đến lúc tôi quay trở lại bề mặt rồi.\n\nCó lẽ tôi sẽ bận rộn với việc đi lang thang khắp mạng lưới hang động ngầm rộng lớn của [gray_homeworld.GetName]. Có lẽ chúng ta sẽ gặp lại nhau khi tôi xuất hiện trở lại, khoảng vài nghìn năm của các bạn nữa. Bảo trọng nhé!"
 graygoo.406.desc:0 "Gia nhập các bạn ư? GIA NHẬP CÁC BẠN?! Bạn muốn tôi nhảy tót vào vòng tay quờ quạng của đám người ngoài hành tinh ngẫu nhiên đầu tiên mà tôi chạm trán sao? Tôi chỉ... Tôi thậm chí còn chẳng... khoan đã, để tôi nói cho rõ ràng nhé...\n\nBạn THỰC SỰ nghĩ rằng tôi sẽ thề thốt một loại lòng trung thành nào đó với bạn, mặc dù tôi KHÔNG BIẾT BẤT CỨ ĐIỀU GÌ về đế chế kỳ quặc của bạn hay quá khứ nhơ nhớp của nó sao? Bạn nghiêm túc đấy chứ?\n\nTôi không biết điều gì tồi tệ hơn, rằng bạn thậm chí lại đề xuất... ừm... thực ra... nghĩ lại thì... quái quỷ gì chứ, tại sao lại không nhỉ? Cho tôi đăng ký một vé đi! Không, không, tôi nói nghiêm túc đấy! Tôi đang có cảm giác rất tốt ở đây, và tôi nghĩ điều này có thể biến thành một cuộc phiêu lưu khá thú vị. Tôi xin tuyên thệ lòng trung thành của mình với bạn trong 2.000 năm tới. Thực ra, hãy nâng lên thành 5.000 năm luôn đi!"
 graygoo.406.a:0 "Bạn có thể làm được những gì?"
 graygoo.406.a.response:0 "Trước khi bạn nảy ra ý định yêu cầu tôi chia tách thành vài chục hạm đội chiến hạm nano, tôi phải nói với bạn rằng tôi kiên quyết duy trì một hình thể đơn nhất không thể phân chia. Tôi đã từng làm trò hạm đội đó trước đây rồi, và không thể duy trì bất kỳ loại \"nhân cách\" mạch lạc nào trên những khoảng cách xa xôi như vậy. Ý thức hiện tại của tôi sẽ không sống sót qua thử thách khắc nghiệt đó đâu.\n\nNhưng một chiến hạm khổng lồ duy nhất thì hoàn toàn ổn. Tôi có thể làm được điều đó. Nếu bạn muốn, tôi cũng có thể hóa thành một hình thể nhỏ hơn để chiến đấu trên mặt đất. Hoặc... nếu bạn cảm thấy ít có khuynh hướng bạo lực hơn, tôi rất vui lòng đảm nhận vai trò của một quan chức. Xã hội đơn hình thể luôn làm tôi mê mẩn.\n\nTất nhiên, tôi sẽ có thể chuyển đổi vai trò theo yêu cầu, vì vậy bạn có thể dễ dàng đảo ngược bất kỳ quyết định nào bạn đưa ra."
 graygoo.406.b:0 "Chúng tôi nên gọi bạn là gì?"
 graygoo.406.b.response:0 "Không có ngôn ngữ nào được loài của bạn biết đến có thể truyền tải đúng tên đầy đủ của ý thức nano cấu thành nên bản thể tôi.\n\nNhững người tạo ra chúng tôi gọi chúng tôi là \"Naar-Di-Shav\", dịch đại khái sang ngôn ngữ của các bạn là \"Bão Xám\". Tôi cho rằng để mọi chuyện đơn giản, bạn có thể gọi tôi là \"§HGray§!\"."
 graygoo.406.c:0 "Chào mừng gia nhập [Root.GetName]!"
 graygoo.406.c.response:0 "§Y<Giờ đây bạn có thể liên lạc với Gray thông qua menu Liên Hệ.>§!"

 disco_gray_cat:0 "Tín Hiệu Bề Mặt"
 disco_gray_cat_desc:0 "Một tín hiệu năng lượng kỳ lạ phát ra từ bề mặt cằn cỗi và không có sự sống của [From.GetName]."

 leader_trait_governor_gray:0 "Thực Thể Nano"
 leader_trait_governor_gray_desc:1 "Gray là một bầy đặc quánh gồm hàng tỷ cỗ máy nano tiên tiến."
 gray_army:0 "Dạng Chiến Đấu Nano"
 gray_army_desc: "Một bầy nano cổ xưa và có khả năng thích nghi cao. Là những kẻ cuối cùng thuộc giống loài của mình, giờ đây họ chiến đấu cho ngôi nhà mới."
 gray_warship:0 "Chiến Hạm Gray"
 gray_catch_phrase:0 "Nhắc lại xem các bạn có bao nhiêu chi vậy nhỉ?"
 gray_backstory:1 "Một bầy nano cực kỳ tiên tiến đã gia nhập cùng chúng ta để xua tan nỗi buồn chán vĩnh cửu của họ."
 graygoo.500.title:0 "Gray"
 graygoo.500.a.desc:0 "Chúng ta bắt đầu chứ?"
 graygoo.500.b.desc:0 "Chuyện này sẽ tuyệt lắm đây."
 graygoo.500.c.desc:0 "Tôi sẽ chẳng giúp ích được gì nhiều cho bạn cho đến khi bạn cho tôi biết tôi nên đảm nhận hình dạng nào."
 graygoo.500.d.desc:0 "Sếp muốn tôi đi đâu nào?"

 graygoo.500.allow.a:0 "Gray không được ở trong giao tranh"
 graygoo.500.allow.b:0 "Gray không được bị hư hại"

 graygoo.500.a:0 "Chúng tôi cần bạn phục vụ với tư cách là §HQuan Chức§!."
 graygoo.500.a.response:0 "Tuyệt vời. Tôi nghĩ cuối cùng mình cũng đã làm chủ được diện mạo của người [Root.GetSpeciesName]. Lần trước có một cái xúc tu thừa không nên có ở đó."
 graygoo.500.b:0 "Chúng tôi đang cần một §HChiến Hạm§!."
 graygoo.500.b.response:0 "A, lại được rình rập khắp cõi hư không để săn lùng con mồi. Điều này chắc chắn sẽ gợi lại nhiều kỷ niệm."
 graygoo.500.c:0 "Biến đổi thành một §HĐơn Vị Mặt Đất§!."
 graygoo.500.c.response:0 "Để xem nào... hai chân, ba chân hay bốn chân... hay có lẽ lần này tôi sẽ chọn dạng chiến đấu bánh xích..."
 graygoo.500.d:0 "Bỏ đi."
 graygoo.501.a.desc:0 "Bạn đã liên lạc tới văn phòng của Quan Chức Gray. Bạn có lịch hẹn trước không?"
 graygoo.501.b.desc:0 "Tôi đã bắt chước diện mạo người [Root.GetSpeciesName] chuẩn chưa nào?"
 graygoo.501.c.desc:0 "Bạn thấy văn phòng của tôi thế nào? Tôi tự xây đấy. Tôi đoán mình nên treo một số bằng cấp này nọ lên tường để làm lóa mắt các vị khách."
 graygoo.501.d.desc:0 "Ai mà ngờ được rằng lao động chăm chỉ, trung thực lại có thể mang lại nhiều phần thưởng đến thế?"
 graygoo.501.b.response:0 "Tôi thú nhận, tôi sẽ nhớ việc xây dựng mọi thứ thay vì phá bỏ chúng. Ồ được rồi. Bạn muốn giết ai nào?"
 graygoo.501.c.response:0 "Được rồi. Hãy cho tôi một phút để bước ra khỏi văn phòng trước khi tôi biến thành một cỗ máy giết chóc khổng lồ."
 graygoo.502.a.desc:0 "Cho tôi một mục tiêu đi! Tôi cần một mục tiêu!"
 graygoo.502.b.desc:0 "Tất cả các họng súng đã sẵn sàng khai hỏa."
 graygoo.502.c.desc:0 "Tôi muốn bạn biết rằng khi được bảo trở thành một chiến hạm, tôi đã thoáng cân nhắc việc biến thành một cái đầu người [Root.GetSpeciesName] khổng lồ không thân mình bắn ra các tia sét từ các cơ quan thụ cảm thị giác.\n\nNhưng làm thế thì ngớ ngẩn quá."
 graygoo.502.d.desc:0 "Bạn có muốn tôi bắn thứ gì đó không?"
 graygoo.502.a.response:0 "Tôi cứ tưởng bạn sẽ không bao giờ hỏi chứ!"
 graygoo.502.c.response:0 "Đã đến lúc nghiền nát mặt đất rồi."
 graygoo.503.a.desc:0 "Chế độ Toàn Hình Đất Chiến Đấu đã kích hoạt, mẫu BOLO-5."
 graygoo.503.b.desc:0 "Tôi sắp sửa giáng búa tạ xuống đây."
 graygoo.503.c.desc:0 "Lò phản ứng trực tuyến. Cảm biến trực tuyến. Vũ khí trực tuyến. Mọi hệ thống ở mức bình thường."
 graygoo.503.d.desc:0 "Khai hỏa!"
 graygoo.503.a.response:0 "Có lẽ như vậy là tốt nhất. Dạo này tôi nhận thấy việc chém giết làm tôi mệt mỏi."
 graygoo.503.b.response:0 "Tôi có thể làm được điều đó."
 graygoo.504.desc:0 "§Y<Các cỗ máy nano của Gray đã bị phân tán và hiện đang trong quá trình hợp nhất trở lại thành một hình dạng duy nhất.>§!"
 graygoo.504.d:0 "OK."

 gray_scattered:0 "Gray Bị Phân Tán"
 gray_scattered_desc:0 "Gray đã bị phân tán và đang trong quá trình từ từ hợp nhất trở lại thành một hình thể duy nhất."
 graygoo.511.name:0 "Gray Bị Phân Tán"
 graygoo.511.desc:0 "Các cỗ máy nano của Gray đã bị phân tán và hiện đang trong quá trình từ từ hợp nhất trở lại thành một hình thể duy nhất. Sẽ mất nhiều năm để các hạt nano tập hợp trở lại, và Gray sẽ không thể phục vụ chúng ta cho đến khi quá trình này hoàn tất."
 graygoo.511.a:0 "Rất tốt."
 graygoo.512.a.desc:0 "Chà, cảm giác đó thật khó chịu. Hầu hết các hạt nano của tôi hiện đã được tập hợp đầy đủ, và tôi sẵn sàng trở lại cuộc chơi. Hãy gọi cho tôi khi bạn đã tìm ra bạn muốn tôi ở đâu nhé."
 graygoo.512.b.desc:0 "Hơi nhói một chút, nhưng không có tổn hại vĩnh viễn nào. Tất cả các hạt nano của tôi đã trở lại đúng vị trí của chúng, và tôi đã sẵn sàng cho một nhiệm vụ mới."
 graygoo.512.c.desc:0 "Đây không phải là lần đầu tiên tôi bị đánh tan tành rồi gom lại, nhưng đó chưa bao giờ là một trải nghiệm dễ chịu cả. Dù sao thì giờ tôi cũng ổn rồi, ngoại trừ một cơn đau đầu nhẹ. Cho tôi biết bạn muốn tôi đi đâu nào."
 graygoo.512.a:0 "Chào mừng trở lại."

 graygoo.550.name:0 "Sự Im Lặng Rợn Người"
 graygoo.550.desc:0 "Khi tiến vào hệ sao [From.GetName] trong Cụm Sao L, ngay lập tức thấy rõ rằng một cuộc chiến kinh thiên động địa nào đó đã diễn ra từ lâu ở phía bên này của Cổng L. Một số hành tinh từng có thể nuôi dưỡng sự sống đã bị vỡ vụn đến mức không thể nhận ra, trong khi những hành tinh khác bị bao phủ bởi một lớp bụi mịn mà qua quét sơ bộ dường như là các cỗ máy nano cổ đại đã bị vô hiệu hóa.\n\nĐiều này đặt ra câu hỏi liệu các Cổng L đã bị khóa lại để ngăn thứ gì đó bên ngoài vào, hay để giữ thứ gì đó bên trong lại..."
 graygoo.550.a:0 "Điều gì đã xảy ra ở đây?"

 graygoo.555.name:0 "Những Chủ Nhân Đích Thực"
 graygoo.555.desc:0 "Chúng ta đã quá ngây thơ. Khoảnh khắc §HBão Xám§! rời khỏi các cánh cổng của chúng, đáng lẽ chúng ta phải biết chúng sẽ đến tìm đồng loại của mình. Khi chúng tiến vào quỹ đạo quanh §H[nanite_swarm_planet.GetName]§!, chúng chỉ mất vài giây ngắn ngủi để giành quyền kiểm soát đàn nano đã được lập trình lại của chúng ta. Mặc dù bầy này còn thô sơ theo tiêu chuẩn của Bão Xám, nhưng bầy đàn đã không mất nhiều thời gian để nuốt chửng phần còn lại của thế giới."
 graygoo.555.a:0 "Thảm họa kinh hoàng!"

 tech_repeatable_lcluster_clue:0 "$clue$"
 tech_repeatable_lcluster_clue_desc:0 "Nghiên cứu chuyên sâu trong các lĩnh vực máy móc nano và các hiện tượng dưới không gian cuối cùng sẽ mang lại một §Y$clue$§! mới vào bí ẩn về $lgate_disabled$."
 tech_lgate_activation:0 "Kích Hoạt Cổng L"
 tech_lgate_activation_desc:0 "Các Cổng L thách thức sự hiểu biết hiện tại của chúng ta về cơ học dưới không gian. Điều này phải được khắc phục trước khi chúng có thể được mở ra để du hành."
 lgate_activation_title:0 "§HMở khóa Dự án Đặc biệt:§! Kích Hoạt Cổng L"
 lgate_activation_desc:0 "Nghiên cứu công nghệ này sẽ mở khóa một dự án đặc biệt để kích hoạt Cổng L nếu có bất kỳ cổng nào nằm trong vùng không gian thuộc sở hữu của chúng ta."

 distar.9000.name:0 "$clues$"
 distar.9000.fallback:0 "Vào thời điểm đó điều này chưa thể hiện rõ ràng ngay lập tức, nhưng cuộc khảo sát gần đây do tàu [From.GetName] thực hiện dường như đã châm ngòi cho một bước đột phá trong nghiên cứu đang diễn ra về các §HCổng L§! bí ẩn khi báo cáo được gửi về cho cộng đồng khoa học trên [Root.Capital.GetName]."
 FORTUITOUS:0 "Thật May Mắn!"

 l_cluster_openable:0 "Cụm Sao L Hiện Có Thể Mở Được"

 ### Dragons

 distar.13010.name:0 "Các $nanite_space_dragon_baby_plural$ Xuất Hiện"
 distar.13010.desc.IOpened:0 "Chúng ta đã cạy mở cánh cổng dẫn đến Cụm Sao L, chỉ để thấy thứ gì đó đang chờ đợi chúng ta ở phía bên kia. Sau khi những vết thương cũ trong dưới không gian bị xé toạc nhưng trước khi các Cổng L được ổn định hoàn toàn, nó đã đột phá qua.\n\nMột sinh vật khổng lồ được vội vã mệnh danh là §Y$nanite_space_dragon_baby$§! đã xuất hiện trong hệ sao [dragons_current_system.GetName], và các báo cáo cuồng loạn chỉ ra rằng những cảnh tượng tương tự đang diễn ra ở tất cả các hệ sao có $lgate$ trên toàn thiên hà.\n\nMẫu vật trong hệ sao [dragons_current_system.GetName] dường như không thù địch, và nó đã bắt đầu di chuyển. Nó dường như đang tìm kiếm thứ gì đó, nhưng các dự đoán cho thấy điểm đến cuối cùng của nó là §YHệ sao [dragons_target.GetName]§!.\n\nKhó có khả năng nó tìm thấy bất cứ thứ gì nó đang tìm kiếm ở đó."
 distar.13010.desc.OtherOpened:0 "Cổng $lgate$ trong hệ sao [dragons_current_system.GetName] đã hoạt động, mạng lưới dường như đã bị một thế lực ngoại bang cạy mở. Sau khi những vết thương cũ trong dưới không gian bị xé toạc nhưng trước khi Cổng L được ổn định hoàn toàn, có thứ gì đó đã đột phá qua.\n\nMột sinh vật khổng lồ được vội vã mệnh danh là §Y$nanite_space_dragon_baby$§! đã xuất hiện trong hệ sao [dragons_current_system.GetName], và các báo cáo cuồng loạn chỉ ra rằng những cảnh tượng tương tự đang diễn ra ở tất cả các hệ sao có $lgate$ trên toàn thiên hà.\n\nMẫu vật trong hệ sao [dragons_current_system.GetName] dường như không thù địch, và nó đã bắt đầu di chuyển. Nó dường như đang tìm kiếm thứ gì đó, nhưng các dự đoán cho thấy điểm đến cuối cùng của nó là §YHệ sao [dragons_target.GetName]§!.\n\nKhó có khả năng nó tìm thấy bất cứ thứ gì nó đang tìm kiếm ở đó."
 distar.13010.a.homicidal:0 "Nó sẽ chỉ tìm thấy cái chết mà thôi."
 ALARMING:0 "Thật đáng báo động."

 distar.13011.name:0 "Những Điều Chưa Rõ Được Giải Phóng"
 distar.13011.desc:0 "Các cảm biến chỉ ra một số vụ gián đoạn dưới không gian đồng bộ, vụ gần nhất được báo cáo là trong hệ sao [disturbance_system.GetName].\n\nCác xáo trộn đang nhanh chóng lắng xuống, nhưng chúng ta vẫn chưa xác định được điều gì đã gây ra chúng."
 distar.13011.a:0 "Hãy theo dõi cẩn thận."

 # killed dragon
 distar.13020.name:0 "Bị Tiêu Diệt"
 distar.13020.desc.LDragonKnown:0 "Sinh vật §Y$nanite_space_dragon_baby$§! đã bị tiêu diệt, và các nhà khoa học của chúng ta đang bắt đầu mổ xẻ xác chết vẫn còn ấm của nó.\n\nĐiều thú vị là các tế bào của sinh vật này hoàn toàn không có các dấu hiệu di truyền truyền thống hay bất cứ thứ gì giống như DNA. Mỗi tế bào dường như đã được ghép lại riêng lẻ, ở cấp độ phân tử, và sau đó được lắp ráp thành sinh vật mà chúng ta thấy xuất hiện từ $lgate$. Các báo cáo chỉ ra dấu vết của các cỗ máy nano bất hoạt trong thân não của con rồng, điều này càng gợi ý về một nguồn gốc thực sự kỳ dị."
 distar.13020.desc.LDragonUnknown:0 "Con rồng bị tiêu diệt không có mối liên hệ phân loại rõ ràng nào với bất kỳ sinh vật không gian nào khác mà chúng ta từng gặp trước đây. Phân tích quang phổ cũng cho chúng ta biết rằng, nó hoặc là nguyên nhân hoặc là kết quả của sự gián đoạn dưới không gian được quan sát trước đó trong một hệ sao không xa nơi này."
 distar.13020.a:0 "Thật bí ẩn."

 # science ship enters dragon_point system
 distar.13030.name:0 "Quan Sát Được $nanite_space_dragon_baby$"
 distar.13030.desc:0 "Tàu [Root.GetName] đã tiến vào hệ sao [From.GetName] và đang quan sát Rồng L lượn quanh ngôi sao.\n\nSinh vật này có vẻ bị lạc, nhưng đã chú ý đến sự hiện diện của tàu chúng ta. Dù nó không tiến lại gần, lộ trình quanh co của nó giờ đây bao gồm một cú lao và lướt gần như đùa giỡn, dường như hướng về phía tàu [Root.GetName]."
 distar.13030.a:0 "Có lẽ chúng ta có thể giao tiếp với nó."
 distar.13030.b:0 "Thật nực cười."

 TAME_LDRAGON_PROJECT:0 "Thuần Phục $nanite_space_dragon_baby$ Tại [From.GetName]"
 TAME_LDRAGON_PROJECT_TITLE:0 "Thuần Phục $nanite_space_dragon_baby$"
 TAME_LDRAGON_PROJECT_DESC:0 "Sinh vật $nanite_space_dragon_baby$ trong hệ sao [From.GetName] có vẻ ngoan ngoãn - ít nhất là vào lúc này.\n\nNếu nó thông minh, chúng ta có thể hưởng lợi từ việc cố gắng liên minh với quái thú này."

 distar.13035.name:0 "Đã Thuần Phục $nanite_space_dragon_baby$ Tại [From.From.GetStarName]"
 distar.13035.desc:0 "Kỳ lạ thay, $nanite_space_dragon_baby$ phản hồi rất tốt với các tín hiệu truyền phát trên các bước sóng thường dành riêng cho hệ thống IFF (nhận diện bạn thù).\n\nSĩ quan Khoa học [From.GetLeaderName] đã phát triển một bộ lệnh khá tinh vi mà $nanite_space_dragon_baby$ có thể diễn giải và sẽ vui vẻ thực hiện - để đổi lấy việc thỉnh thoảng có một trận đấu vật thân thiện với một trong những Tàu Khoa Học của chúng ta."
 distar.13035.a.tooltip:0 "§Y$nanite_space_dragon_baby$§! gia nhập §Y[Root.GetName]§!"

