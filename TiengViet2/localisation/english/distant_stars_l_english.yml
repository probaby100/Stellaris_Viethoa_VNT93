 distar.5072.d:0 "Chấm dứt thăng hoa thủ công."
 distar.5072.d.response:0 "$distar.5072.desc$"
 distar.5072.e:0 "Cử một đội ngũ kỹ sư tới."
 distar.5072.e.response:0 "$distar.5072.desc$"
 distar.5073.name:0 "Sửa Chữa Hoàn Tất"
 distar.5073.desc:0 "Các kỹ sư của chúng ta đã ổn định thành công BALDOR XXXXIII, quá trình nâng tầm đã quay trở lại đúng quỹ đạo và người dân của chúng ta đã phần nào miễn cưỡng quay trở lại với giấc ngủ bình thường. Phương pháp thôi miên đã bắt đầu cho thấy những kết quả đầy hứa hẹn, khi các công dân ngày càng quan tâm nhiều hơn đến khoa học."
 distar.5074.name:0 "Được Nâng Tầm Một Phần"
 distar.5074.desc:0 "Quá trình thăng hoa đã hoàn tất, nhưng chúng ta vẫn chưa thực sự thăng hoa trọn vẹn do tình trạng suy thoái nhanh chóng của BALDOR XXXXIII. Dù phần lớn dân số vẫn phải chịu đựng những cơn ác mộng dữ dội về đêm, phương pháp thôi miên dường như đã mang lại một số kết quả khả quan khi họ giờ đây thể hiện sự thành thạo chưa từng thấy trong nghiên cứu khoa học và học tập. Đối với những công dân kém may mắn bị mắc kẹt trong trạng thái sống thực vật, tình hình tồi tệ hơn... Dù hầu hết đã hồi phục ý thức, tâm trí của họ dường như đã sụp đổ dưới áp lực khổng lồ.\n\nĐây có thể không phải là một sự thăng hoa toàn vẹn, nhưng ít nhất nó cũng là... một điều gì đó."
 distar.5074.a:0 "Đáng lẽ mọi chuyện đã có thể tồi tệ hơn nhiều."
 distar.5078.name:0 "Thăng Hoa Bí Ẩn Bị Chấm Dứt"
 distar.5078.desc:0 "Trong hậu quả hỗn loạn của việc mất [FromFromFrom.GetName] vào tay các lực lượng xâm lược của [From.GetSpeciesName], BALDOR XXXXIII đã phi vật chất hóa và sự thăng hoa của người dân chúng ta đã bị chấm dứt hoàn toàn. Chúng ta tin rằng thực thể ngoài hành tinh hình ống này, vốn đã ở trong tình trạng hư hại nặng nề, đã vô tình trúng phải hỏa lực của đối phương và chịu tổn thất nghiêm trọng đối với các chức năng cốt lõi. Khi biến mất, nó đã phát đi một thông điệp cầu cứu cuối cùng: \"Ta là BALDOR XXX.\""
 distar.5078.a:0 "[From.GetSpeciesName] sẽ phải trả giá."
 trait_enigmatic_intelligence_poor:0 "Được Nâng Tầm Một Phần"
 trait_enigmatic_intelligence_poor_desc:1 "Giống loài này đã được một trí tuệ nhân từ ngoài thiên hà nâng tầm một phần và đã bỏ lại phía sau một phần cội nguồn bán tri giác của mình."
 trait_enigmatic_intelligence_failed:0 "Nâng Tầm Thất Bại"
 trait_enigmatic_intelligence_failed_desc:0 "Giống loài này phải gánh chịu những hậu quả bi thảm từ một quá trình nâng tầm xảy ra sự cố."
 trait_enigmatic_intelligence:0 "Được Nâng Tầm"
 trait_enigmatic_intelligence_desc:1 "Giống loài này đã được một trí tuệ nhân từ ngoài thiên hà nâng tầm và đã hoàn toàn bỏ lại phía sau cội nguồn tiền tri giác của mình."
 ENIGMATIC_UPLIFTING:0 "Thăng Hoa Bí Ẩn"
 ENIGMATIV_UPLIFTING_DESC:1 "Thực thể ngoài hành tinh BALDOR XXXXIII tuyên bố rằng nó có thể nâng tầm người dân của chúng ta bằng cách sử dụng phương pháp thôi miên học tập trong giấc ngủ. Các nhà nghiên cứu của chúng ta sẽ phải theo dõi sát sao quá trình này."
 ENIGMATIC_UPLIFTING_DESC:0 "$ENIGMATIV_UPLIFTING_DESC$"
 ENIGMATIC_REPAIR:0 "Sửa Chữa BALDOR XXXXIII"
 ENIGMATIC_REPAIR_DESC:1 "Quá trình thăng hoa của chúng ta đang bị đe dọa bởi một lỗi phần cứng nghiêm trọng bên trong BALDOR XXXXIII. Thực thể này cần được sửa chữa khẩn cấp."
 enigmatic_fatigue:0 "Kiệt Sức"
 enigmatic_fatigue_desc:0 "Các Pop của chúng ta đang bị ảnh hưởng bởi sự mệt mỏi do quá trình thôi miên trong giấc ngủ gây ra."
 enigmatic_sadness:0 "Vô Tri Là Hạnh Phúc"
 enigmatic_sadness_desc:0 "Các Pop của chúng ta đang phải thích nghi với những tác dụng phụ của một trí thông minh trên mức trung bình."
 enigmatic_madness:0 "PTSD"
 enigmatic_madness_desc:0 "Pop này vẫn đang bị hành hạ bởi những cơn ác mộng dai dẳng sau một quá trình nâng tầm không thành công."
 enigmatic_slumber:0 "Sống Thực Vật"
 enigmatic_slumber_desc:0 "Pop này đã bị mắc kẹt trong cơn hôn mê sâu do thôi miên trong giấc ngủ gây ra."

 SUPERFLARE_PROJECT:0 "Lá Chắn Siêu Bùng Phát"
 SUPERFLARE_PROJECT_DESC:0 "Các cảm biến trên [Root.GetName] chỉ ra rằng [From.GetStarName] đang chuẩn bị cho một đợt siêu bùng phát khác, không khác gì đợt bùng phát từng hủy diệt nền văn minh cổ đại trên [From.From.GetName]. Chúng ta cần tìm cách che chắn cho thuộc địa của mình trước khi ngọn lửa bùng nổ."

 PRIMITIVE_ROBOT_PROJECT:0 "Những Đấng Tạo Hóa Biến Mất"
 PRIMITIVE_ROBOT_PROJECT_DESC:0 "Các nhà nghiên cứu cảm thấy bối rối trước sự thiếu vắng lời giải thích cho sự biến mất của nền văn minh quá khứ trên [From.GetName]. Họ đề xuất tiến hành phân tích phần cứng chuyên sâu hơn đối với những robot cổ xưa mà họ bỏ lại, nhằm làm sáng tỏ bí ẩn này.\n\nPhần thưởng: £society£ §GKhảo Cứu Xã Hội§!"

 RETROVIRUS_PROJECT:0 "Hành Vi Bất Thường Trên Bề Mặt"
 RETROVIRUS_PROJECT_DESC:0 "Một chuỗi các hành vi bất tuân dân sự không thể giải thích đang quét qua [From.GetName]. Các cư dân thuộc địa đang thể hiện hành vi kỳ lạ, thất thường thường bắt đầu bằng sự bối rối chung và dần leo thang thành sự kích động cùng bạo lực cực đoan. Chúng ta phải tìm ra nguyên nhân của hành vi này trước khi mọi chuyện vượt tầm kiểm soát."

 DARK_FLOW_PROJECT:0 "Dị Thường Trắc Trọng Lực"
 DARK_FLOW_PROJECT_DESC:0 "Các chỉ số trọng lực bất khả thi đã được ghi nhận trong hệ sao [from.GetStarName]. Chắc chắn phải có thứ gì đó đang gây nhiễu các cảm biến của chúng ta."

 DISSECTION_PROJECT:0 "Mổ Xẻ Ấu Trùng Quái Thú Hư Không"
 DISSECTION_PROJECT_DESC:0 "Chúng ta đã quyết định trích xuất dữ liệu sinh học từ con Trùng Biến Hình Không Gian non nớt bị lạc bằng các biện pháp sinh tử. Chúng ta sẽ phái một đội đặc nhiệm đi bắt giữ sinh vật này, và mổ xẻ xác của nó."

 CRYO_CLONES_PROJECT:0 "Đánh Thức Người Nhân Bản"
 CRYO_CLONES_PROJECT_DESC:0 "Chúng ta có cơ hội hồi sinh một nhóm người nhân bản ngoài hành tinh được tìm thấy trong trạng thái ngủ đông tại một trạm vũ trụ bị bỏ hoang trên quỹ đạo của [From.GetName]."

 RECOVER_WARFORM_PROJECT:0 "Kích Hoạt Lại Dạng Chiến Đấu Cổ Đại"
 RECOVER_WARFORM_PROJECT_DESC:0 "Một chiến hạm cổ đại tự hành cực kỳ tiên tiến nằm bất động trên bề mặt [From.GetName]. Các kỹ sư của chúng ta tin rằng họ có thể sửa chữa và tái kích hoạt các hệ thống bị hỏng của nó."

 BRAINSLUG_PROJECT:0 "Nghiên Cứu Thần Kinh Sên Não"
 BRAINSLUG_PROJECT_DESC:0 "Các nhà sinh học của chúng ta muốn nghiên cứu sâu hơn về mối quan hệ cộng sinh thần kinh kỳ lạ giữa loài sên bản địa và các vật chủ hữu cơ trên [From.GetName]."

 KETLING_PROJECT_1:0 "Nghiên Cứu $NAME_Ketlings$ Trên §Y[ratling_capital.GetName]§!"
 KETLING_PROJECT_1_DESC:1 "Các sinh vật có tri giác đã xuất hiện từ những đống phế liệu trên §Y[ratling_capital.GetName]§!. Các nhà khoa học của chúng ta rất tò mò liệu những sinh vật ngoài hành tinh này, được mệnh danh là $NAME_Ketlings$, là hậu duệ của nền văn minh du hành vũ trụ từng bao trùm các hệ sao này, hay họ có một nguồn gốc hoàn toàn khác.\n\nChúng ta có thể chọn bất kỳ hành tinh nào có $NAME_Ketlings$ tự trị sinh sống để tiến hành nghiên cứu này."
 KETLING_PROJECT_2:0 "Nghiên Cứu $NAME_Ketlings$ Trên §Y[ratling_planet_2.GetName]§!"
