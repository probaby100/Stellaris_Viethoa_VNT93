 ### Trojan Asteroid ###
 distar.3000.name:0 "Cơ Cấu Bên Trong"
 distar.3000.desc:0 "Đúng như dự đoán, tiểu hành tinh [From.GetName] chứa đựng bên trong một khối lượng kim loại lớn và thực sự ẩn giấu một cỗ máy cơ khí nào đó.\n\nDữ liệu thu thập được cho thấy rõ ràng rằng các bộ phận cấu thành của nó chứa một lượng lớn năng lượng dự trữ, nhưng mục đích của nó vẫn chưa được biết."
 distar.3000.a:0 "Tiến hành cẩn thận."
 distar.3000.a.tooltip:0 "Khai quật nhẹ nhàng tiểu hành tinh."
 distar.3000.b:0 "Thăm dò nó."
 distar.3000.b.tooltip:0 "Phái một đầu dò khoan để thu thập mẫu vật."
 distar.3001.desc:0 "Sự thận trọng đã chứng minh là hoàn toàn đúng đắn. Ẩn bên trong [trojan_asteroid.GetName] là một đàn drone khai thác mỏ cũ kỹ được lập trình để tấn công ngay khi nhìn thấy mục tiêu.\n\nMay mắn thay, Sĩ quan Khoa học [Root.GetLeaderName] đã phát hiện ra điều này từ sớm và có thể gây nhiễu các cảm biến của drone đủ lâu để vô hiệu hóa chúng.\n\nLõi của các drone quả thực đã cũ, nhưng vẫn giữ được một lượng lớn năng lượng để chúng ta hút lấy."
 distar.3002.desc:0 "Việc khoan thăm dò thô bạo của [Root.GetName] đã dẫn đến kết quả đáng tiếc. Ẩn bên trong tiểu hành tinh là một đàn drone khai thác mỏ cũ kỹ, được lập trình để tấn công ngay khi nhìn thấy mục tiêu.\n\nCác drone này đã phát hiện sự hiện diện của [Root.GetName] và đang bắt đầu rục rịch chuyển động.\n\nVẫn có thể còn thời gian để thực hiện thao tác né tránh, nếu [Root.GetName] hành động thật nhanh chóng."
 distar.3003.desc:0 "Tin tức về các sự kiện liên quan đến tiểu hành tinh [trojan_asteroid.GetName] đã truyền tới mạng lưới của [Root.Capital.GetName]. Cộng đồng khoa học đã phản ứng với sự tò mò, đặt ra câu hỏi tại sao các drone ban đầu lại được đặt bên trong tiểu hành tinh.\n\nLiệu chúng có đang bảo vệ thứ gì đó không?"
 distar.3005.desc:0 "Đúng như cộng đồng khoa học trên [Root.Owner.Capital.GetName] đã giả thuyết, các drone được tìm thấy trong tiểu hành tinh [trojan_asteroid.GetName] thực sự đã che giấu điều gì đó.\n\nNhững nỗ lực dũng cảm của thủy thủ đoàn tàu [Root.GetName] đã khai quật được các mỏ khoáng sản phong phú trong lõi tiểu hành tinh, trước đây bị che khuất bởi sự hiện diện của các drone."

 ### Impossible Organism ###
 distar.3010.desc:1 "Các chỉ số sự sống đáng kinh ngạc từ [impossible_organism_planet.GetName] đã được xác định là do một sinh vật nhỏ bé có sức sống cực kỳ bền bỉ. Thủy thủ đoàn của tàu [Root.GetName] không chắc chắn cách phân loại dạng sống này, nhưng khả năng sinh tồn gần như không cần bất kỳ chất dinh dưỡng nào của nó thực sự đáng kinh ngạc. Xét theo niên đại của hành tinh, hoàn toàn có khả năng sinh vật này đã chống chọi với môi trường độc hại suốt hàng thiên niên kỷ, dẫu đây chỉ là một phỏng đoán có cơ sở nhất mà thôi.\n\nSĩ quan Khoa học [Root.GetLeaderName] đã yêu cầu được phép thu thập các mẫu vật của sinh vật chưa xác định này để có thể tiến hành nghiên cứu."
 distar.3010.a:0 "Rất tốt, hãy lấy mẫu vật."
 distar.3010.b:0 "Không. Hãy quan sát nó từ xa."
 distar.3010.b.tooltip:0 "Thêm hiệu ứng điều chỉnh §YSinh Vật Bất Khả Thi§! cho [From.GetName]:\n£society£ §G+3§!"
 distar.3011.desc:0 "Các nghiên cứu về dạng sống bí ẩn đang tiến triển rất tốt. Cộng đồng khoa học vô cùng kinh ngạc trước tiềm năng phát triển của nó. Giờ đây nó đã có thể nhìn thấy bằng mắt thường và phản ứng với các kích thích bên ngoài, đồng thời dường như có khả năng hấp thụ năng lượng và dinh dưỡng từ hầu hết mọi thứ, bất kể là hữu cơ hay vô cơ.\n\nTuy nhiên, các quá trình di truyền, tế bào và sinh hóa của nó vẫn vượt quá tầm hiểu biết của chúng ta."
 distar.3011.a:1 "Chúng ta nên tiếp tục nghiên cứu nó."
 distar.3011.a.phobe:0 "Kinh tởm! Hãy dùng que chọc vào nó xem..."
 distar.3011.b:0 "Sinh vật ngoại lai này quá nguy hiểm."
 distar.3011.b.tooltip:0 "Bắn dạng sống này vào không gian sâu."

 distar.3012.name:0 "Nấm Bất Khả Thi"
 distar.3012.desc:0 "Sau những đột phá gần đây, dạng sống kỳ lạ này không còn là một điều bí ẩn hoàn toàn nữa! Cộng đồng khoa học trên [Root.Capital.GetName] đang xôn xao trước tin tức này.\n\nSinh vật đã được phân loại là một loài nấm - điều này phần nào giải thích khả năng hấp thụ các phân tử để lấy dinh dưỡng của nó. Nó đã phát triển vượt bậc, hiện có kích thước tương đương một cá thể [Root.GetSpeciesName] mới sinh, và tỏ ra vừa tò mò vừa thông minh. Rất may, cho đến nay nó chưa biểu hiện bất kỳ dấu hiệu hung hăng nào.\n\nCác nhà khoa học tin rằng bước tiếp theo là cố gắng giao tiếp với nó, mặc dù có thể phải mất nhiều tháng trước khi có bất kỳ tiến triển nào trên mặt trận này."
 distar.3012.a:1 "Tiến hành các nỗ lực giao tiếp."
 distar.3012.a.tooltip:1 "Tiếp tục nghiên cứu loài nấm.\n\nCó thể mất vài tháng trước khi có bất kỳ tiến triển nào để báo cáo."
 distar.3012.b:1 "$distar.172.b$. Xả mẫu vật ra cửa thoát khí."
 distar.3012.b.tooltip:0 "Bắn loài nấm này vào không gian sâu."

 distar.3013.name:0 "Nấm Bất Khả Thi: Những Từ Đầu Tiên"
 distar.3013.desc:0 "Sinh vật nấm nhỏ gần đây đã bắt đầu phát ra âm thanh!\n\nNhững từ đầu tiên của nó là một âm thanh trầm đục từ cổ họng: \"nivlac\". Không mạch lạc, nhưng được lặp đi lặp lại một cách nhiệt thành. Và vì vậy các nhà khoa học đã tự hào đặt tên cho loài nấm này là §Y$NAME_Nivlac$§!. Kể từ đó, ngôn ngữ của nó đã phát triển với tốc độ ngoạn mục và hiện nay nó đã có thể truyền đạt thành công bảy cảm xúc nguyên thủy - và thường xuyên làm điều đó với các con non của chính mình. Nó sinh sản - bằng cách phát tán bào tử - như một thói quen thường nhật, và phòng thí nghiệm sẽ sớm không còn đủ chỗ để chứa các sinh vật nấm này.\n\n$NAME_Nivlac$ vẫn chưa biểu hiện bất kỳ dấu hiệu hung hăng nào."
 distar.3013.a.xenophile:0 "Thật đáng kinh ngạc. Mỗi người [Root.GetSpeciesName] nên có một con!"
 distar.3013.a:0 "Tuyệt vời. Xã hội [Root.GetAdj] có thể sử dụng chúng."
 distar.3013.a.swarm:0 "Xã hội [Root.GetAdj] có thể sử dụng chúng... làm thức ăn gia súc."
 distar.3013.a.serv:0 "Những sinh vật hữu cơ quý giá. Người [Root.GetSpeciesNamePlural] chúng ta sẽ chăm sóc chúng."
 distar.3013.a.assi:0 "Tuyệt vời. Chúng sẽ được đồng hóa."
 distar.3013.a.assi.tooltip:0 "Tối đa §Y500§! £pop£ §HPop $NAME_Nivlac$§! sẽ xuất hiện trên [nivlac_joint_planet.GetName]."
 distar.3013.a.tooltip:2 "Lấp đầy các khu nhà ở trống trên [nivlac_joint_planet.GetName] bằng £pop£ §HPop $NAME_Nivlac$§!."
 distar.3013.b:1 "Chúng nên có một ngôi nhà của riêng mình."
 distar.3013.b.no_room.kill:0 "Chúng ta không còn chỗ. Hãy thiêu rụi chúng và kết thúc chuyện này."
 distar.3013.b.no_room.kill.tooltip:0 "Tiêu diệt các sinh vật nấm."
 distar.3013.b.tooltip:1 "Các nhà khoa học của chúng ta sẽ di dời các cá thể $NAME_Nivlacs$ từ phòng thí nghiệm tới một hành tinh thích hợp của riêng chúng.\n\nSẽ mất một thời gian trước khi có báo cáo cập nhật."

 distar.3015.name:0 "Sinh Vật Bất Khả Thi: $NAME_Nivlac$"
 distar.3015.desc:0 "Dạng sống ngoài hành tinh từng được phát hiện trên hành tinh độc hại [impossible_organism_planet.GetName], và sau đó bị bắn vào không gian sâu vì bị coi là quá nguy hiểm, dường như đã đáp xuống bề mặt [nivlac_planet.GetName] một thời gian sau đó.\n\nNó không chỉ sống sót sau vụ va chạm, mà còn xoay xở để biến hành tinh mới thành ngôi nhà của mình. Nó đã phát triển, sinh sôi và phân chia thành một quần thể nhỏ, đến mức tự mình trở thành một loài du hành vũ trụ.\n\nChúng tự gọi mình là $NAME_Nivlac$, và đáng tiếc là dường như vẫn nhớ sự coi thường của chúng ta đối với sự sống còn của chúng trước đây."

 distar.3016.name:0 "$NAME_Nivlac$"
 distar.3016.desc:1 "Các nhà khoa học của chúng ta vui mừng báo cáo rằng việc di dời $NAME_Nivlac$ đến một hành tinh phù hợp đã thành công tốt đẹp.\n\nKể từ khi sinh vật nấm non trẻ đến [nivlac_planet.GetName], rõ ràng là sự phát triển bùng nổ của nó vẫn tiếp tục. Nó đã tự thiết lập thành một cộng đồng nhỏ, và gần đây thậm chí đã phát triển được công nghệ FTL - chắc chắn là nhờ sự trợ giúp của công nghệ mà chúng ta để lại.\n\nChúng ta sẽ háo hức tiếp tục theo dõi sự phát triển của chúng."

 distar.3017.name:0 "[Root.Owner.GetSpeciesName] và $NAME_Nivlac$"
 distar.3017.desc:0 "Việc tích hợp loài nấm $NAME_Nivlac$ vào xã hội [Root.Owner.GetAdj] đang được tiến hành.\n\nSự tương tác giữa các $NAME_Nivlacs$ và [Root.Owner.GetSpeciesNamePlural] tiếp tục diễn ra tích cực, và hai giống loài của chúng ta dường như đang cùng nhau hướng tới một tương lai đầy hứa hẹn."
 distar.3017.desc.assim:0 "Việc đồng hóa loài nấm $NAME_Nivlac$ vào xã hội [Root.Owner.GetAdj] đang được tiến hành.\n\nMặc dù các $NAME_Nivlac$ có sự kháng cự đối với quá trình này, ý thức của chúng cuối cùng sẽ được thăng hoa hòa nhập vào thể thống nhất [Root.GetAdj] của chúng ta."
 distar.3017.a.tooltip:2 "£pop£ §HPop $NAME_Nivlac$§! đã được thêm vào [nivlac_joint_planet.GetName]."
 distar.3017.a.assi.tooltip:1 "£pop£ §HPop $NAME_Nivlac$§! đã được thêm vào [nivlac_joint_planet.GetName]."
 distar.3017.a.serv.tooltip:0 "£pop£ §HPop $NAME_Nivlac$§! đang được chăm sóc nuông chiều tại những khu bảo tồn mới xây dựng trên [nivlac_joint_planet.GetName]."

 ### Stranded Scientist ###
 distar.3020.name:0 "Nhà Khoa Học Mắc Kẹt"
 distar.3020.desc:2 "Xác tàu đắm trên tiểu hành tinh [From.GetName] là tàn tích của một con tàu thuộc về một nhà khoa học hiện đang bị mắc kẹt - [stranded_scientist_leader.GetName] - người tự nhận mình thuộc giống loài [stranded_scientist_species.GetName] chưa từng được biết đến trước đây.\n\nTừ giữa đống đổ nát, bằng cách nào đó cô đã liên lạc được với [Root.GetLeaderName], Sĩ quan Khoa học đóng quân trên tàu [Root.GetName], và đang yêu cầu được giải cứu. Cô giải thích rằng vụ va chạm là do các cảm biến định vị bị trục trặc, và cô đã không thể rời khỏi tiểu hành tinh này trong nhiều năm.\n\nCô khẳng định kiến thức khoa học của mình là vô song, và cô sẽ là một tài sản quý giá. Cô chỉ ra sự sinh tồn của mình như một bằng chứng cho điều đó."
 distar.3020.a:0 "Chào mừng gia nhập hàng ngũ khoa học của chúng ta!"
 distar.3020.a.tooltip:0 "§Y[stranded_scientist_leader.GetName]§!, một $scientist_with_icon$ Cấp 6, gia nhập [Root.Owner.GetName] và sẽ chia sẻ kiến thức công nghệ của mình."
 stranded_scientist_background: "§Y[Root.GetName]§! được tìm thấy mắc kẹt trên hành tinh [Root.GetHomeWorldBiome] §Y[Root.GetBackgroundPlanet]§!."
 distar.3020.b:0 "Chúng ta không thể tin tưởng một người lạ ngoài hành tinh."
 distar.3020.b.tooltip:0 "[stranded_scientist_leader.GetName] bị bỏ mặc với số phận của cô."

 distar.3021.name:0 "Nhà Khoa Học Bị Bỏ Rơi"
 distar.3021.desc:0 "Nhà khoa học mới gia nhập gần đây, [stranded_scientist_leader_clone.GetName], đã vận dụng tốt kiến thức công nghệ của mình. Những hiểu biết sâu sắc mà cô chia sẻ đã thúc đẩy nghiên cứu vật lý của chúng ta lên những tầm cao mới."
 distar.3021.a.tooltip:0 "Nghiên cứu của chúng ta về các §YCông Nghệ§! £physics£ được thúc đẩy."

 ### Molluscoid Miners ###
 distar.3030.name:0 "Cư Dân Thân Mềm"
 distar.3030.desc:0 "Quan sát kỹ hơn tại [molluscoid_miners_planet.GetName] cho thấy các cấu trúc dạng túp lều trên hành tinh này là nơi sinh sống của một loài thân mềm. Những túp lều là nơi trú ẩn thô sơ, được xây dựng từ đất và các chất bài tiết dạng bán phân.\n\nLoài thân mềm này có vẻ mang bán tri giác với trí thông minh hạn chế. Ngoài việc sinh tồn, xã hội và cuộc sống của họ xoay quanh việc khai quật các khoáng sản rồi trưng bày chúng, dường như để nâng cao vị thế xã hội của người tìm ra.\n\nTuy nhiên, phương thức định vị các khoáng sản này của họ vẫn chưa rõ ràng, và Sĩ quan Khoa học [Root.GetLeaderName] rất kinh ngạc trước khả năng xác định vị trí các mỏ khoáng sản lớn của họ.\n\nMặc dù kém cỏi về mặt công nghệ, việc nghiên cứu những sinh vật thân mềm này rất có thể sẽ nâng cao năng lực khai khoáng của chúng ta."
 distar.3030.a:0 "Hãy nghiên cứu phương pháp khai thác của chúng."
 distar.3030.b:0 "Chúng là những sinh vật nguyên thủy vô giá trị."

 distar.3031.desc:0 "Loài sinh vật thân mềm cư trú trên [molluscoid_miners_planet.GetName] sử dụng một phương pháp kỳ lạ để tìm kiếm các khoáng chất mà chúng thèm muốn.\n\nHiện tại có vẻ như chúng tiết ra một chất dịch từ da, ngấm vào đất và thẩm thấu sâu hơn. Bằng cách nào đó, chất dịch này có khả năng cảm biến, chừng nào sợi liên kết còn duy trì, nó sẽ truyền thông tin về cho sinh vật thân mềm. Bằng cách này, chúng có thể lập bản đồ các cấu trúc ngầm quy mô lớn và xác định vị trí các mạch khoáng chất mà chất dịch chạm tới.\n\nNếu chúng ta tích hợp loài thân mềm này vào xã hội của mình, hoặc đơn giản là cải tiến quy trình sản xuất bằng kiến thức này, các doanh nghiệp khai thác khoáng sản của chúng ta có thể sẽ được hưởng lợi rất lớn."
 distar.3031.a:0 "Được chấp thuận. Bắt đầu quá trình tích hợp."
 distar.3031.a.evopre: "Đừng bận tâm tới khoáng sản, hãy thu hoạch DNA của chúng."
 distar.3031.b:0 "Được, chúng ta sẽ sử dụng kiến thức này."
 distar.3031.c:0 "Không. Hãy khai thác hành tinh của chúng."

 distar.3032.name:0 "Tích Hợp Loài Thân Mềm"
 distar.3032.desc:0 "Việc tích hợp loài sinh vật thân mềm vào xã hội [Root.Owner.GetAdj] đã hoàn tất.\n\nĐể tạo điều kiện thuận lợi cho việc tích hợp, họ đã được đặt tên là §Y[molluscoid_miners_species.GetName]§!. Người [molluscoid_miners_species.GetName] rất ngoan ngoãn và chăm chỉ, và sản lượng khoáng sản của chúng ta đã ghi nhận sự gia tăng rõ rệt."
 distar.3032.a.tooltip:1 "§Y600§! £pop£ §HPop [molluscoid_miners_species.GetName]§! đã được thêm vào §Y[Root.Capital.GetName]§!."
 distar.3032.b:0 "Họ ở đây... Đâu đó quanh đây."
 distar.3032.b.tooltip:0 "Do mật độ dân số cao trên [Root.Capital.GetName], loài [molluscoid_miners_species.GetName] chiếm tỷ lệ không đáng kể về mặt thống kê và đáng tiếc là phần lớn không liên quan đến đời sống xã hội."

 distar.3033.name:0 "Bản Đồ Khoáng Sản"
 distar.3033.desc:0 "Một hệ thống cho phép chúng ta nhanh chóng lập biểu đồ địa hình dưới lòng đất và các khoáng sản chứa bên trong đã được triển khai.\n\nBằng cách phân tích phản xạ hành tinh của các tia mặt trời và tia vũ trụ đặc thù vốn không thể xuyên qua hầu hết các khoáng chất, chúng ta có thể thu thập dữ liệu về thành phần khoáng chất của lớp vỏ. Điều này cho phép chụp X-quang một thiên thể mục tiêu, dù là một tiểu hành tinh hay một phần của hành tinh.\n\nCác nhà khoa học của chúng ta đã mệnh danh nó là Bản Đồ Khoáng Sản, và nó sẽ cải thiện đáng kể sản lượng khai thác khoáng sản của chúng ta."

 ### Alien Machine ###
 distar.3040.name:0 "Cỗ Máy Ngoại Lai"
 distar.3040.desc:0 "Các lần quét sâu hơn cho thấy cỗ máy vẫn đang hoạt động, mặc dù mục đích của nó vẫn hoàn toàn chưa rõ ràng.\n\nSĩ quan Khoa học [Root.GetLeaderName] chưa bao giờ nhìn thấy bất cứ thứ gì giống như vậy. Một số vật liệu trông quen thuộc, nhưng hầu hết đều xa lạ và hoàn toàn dị biệt như chính thiết kế các thành phần của nó.\n\nCỗ máy có thứ dường như là một bảng điều khiển, với một chi tiết đặc biệt nổi bật: một chiếc cần gạt lớn bị cong queo bằng vật liệu chưa rõ."
 distar.3040.a:0 "Gạt cần."
 distar.3040.a.tooltip:0 "Sĩ quan Khoa học [Root.GetLeaderName] gạt chiếc cần kỳ lạ."
 distar.3040.b:0 "Tháo dỡ nó."
 distar.3040.b.tooltip:0 "Cỗ máy bị tháo dỡ và các bộ phận của nó được thu hồi."

 distar.3041.name:0 "Cỗ Máy Ngoại Lai"
 distar.3041.desc:0 "Không rõ chuyện gì đã xảy ra khi chiếc cần gạt của cỗ máy bị kéo xuống.\n\nBảng điều khiển nhấp nháy, các rung động mạnh mẽ có thể cảm nhận được, rồi một làn sóng năng lượng dâng trào từ cỗ máy, lan tỏa ra không gian sâu. Các nhà khoa học đứng gần đó cảm nhận được làn sóng này tràn qua họ, nhưng không ghi nhận được bằng chứng cảm quan nào khác về sự đi qua của nó.\n\nSĩ quan Khoa học [Root.GetLeaderName] không chắc chắn phải hiểu chuyện này như thế nào. Bản thân cỗ máy đã trở lại trạng thái không hoạt động ngay sau đó, và không còn trả về bất kỳ chỉ số năng lượng nào nữa."
 distar.3041.a:0 "Thật kỳ lạ. Giờ hãy tháo dỡ nó."
 distar.3041.b:0 "Hấp dẫn đấy. Hãy nghiên cứu cỗ máy."
 distar.3041.b.tooltip:1 "Thêm hiệu ứng điều chỉnh §YCỗ Máy Ngoại Lai§! vào [asteroid_target.GetName]:\n£physics£ §G+7§!"

 distar.3042.name:0 "Xung Năng Lượng"
 distar.3042.desc:2 "Khi các nhà khoa học của chúng ta gạt chiếc cần, cỗ máy đã phát ra một vụ nổ năng lượng khổng lồ nhân lên thành các sóng xung kích, xoắn vặn và gợn sóng qua hư không, xé toạc một lỗ sâu tại §Y[system_one.GetName]§!.\n\nSau khi năng lượng dư thừa khuếch tán, lỗ sâu và khu vực xung quanh nó đã lắng dịu và giờ đây dường như đủ ổn định để di chuyển an toàn. Còn về những gì đang chờ đón chúng ta ở phía bên kia, các nhà khoa học của chúng ta vẫn chưa chắc chắn.\n\nBản thân cỗ máy từ đó đã trở lại trạng thái không hoạt động và không còn phát ra bất kỳ chỉ số dị thường nào."

 ### Orbital Speed Demon ###
 distar.3050.name:0 "Ác Quỷ Tốc Độ Quỹ Đạo"
 distar.3050.desc:0 "Các nỗ lực quét vật thể đang quay ở quỹ đạo tốc độ cao quanh [From.GetName] đã không thành công. Vật thể nhanh chóng lặn xuống dưới đường chân trời của [From.GetName] và các thiết bị của tàu [Root.GetName] đơn giản là không thể theo kịp.\n\nMặc dù lực hút trọng lực của [From.GetName] rất mạnh, điều đó một mình nó cũng khó có thể giải thích được động lượng cực lớn của vật thể. Hoặc bản thân vật thể sở hữu một số đặc tính phi thường, hoặc có hiện tượng trọng lực nào đó đang diễn ra ở đây.\n\nVận tốc của vật thể dường như đang tăng dần theo thời gian, và Sĩ quan Khoa học [Root.GetLeaderName] nghi ngờ rằng nó có thể sớm bị văng ra khỏi quỹ đạo, ngay cả khi không có sự can thiệp từ bên ngoài."
 distar.3050.a:0 "Cố gắng làm chậm nó lại."
 distar.3050.a.tooltip:0 "Phái một drone và cố gắng bám vào vật thể để giảm động lượng của nó."
 distar.3050.b:0 "Cố gắng chặn đứng nó."
 distar.3050.b.tooltip:0 "Phóng các mảnh vỡ ra để va chạm với vật thể, hy vọng chặn đứng nó trên quỹ đạo."
 distar.3050.c:0 "Tránh xa nó ra."
 distar.3050.c.tooltip:0 "Tránh khỏi vùng nguy hiểm và để mặc số phận của vật thể."
 distar.3051.name:0 "Ác Quỷ Tốc Độ Bị Chặn Đứng"
 distar.3051.desc:0 "Các mảnh vỡ phóng ra đã va chạm thành công với vật thể, làm giảm tốc độ của nó xuống mức có thể khôi phục được. Giờ đây khi đã nằm trong khoang chứa của tàu [Root.GetName], nó hóa ra là một chiếc hộp nhỏ bằng kim loại được bọc kín hoàn toàn và không có bất kỳ ổ khóa hay bản lề nào có thể nhìn thấy được."
 distar.3051.desc.1:0 "Drone bám giữ đã thành công trong việc giảm tốc độ của vật thể xuống mức an toàn. Khi được đưa lên tàu [Root.GetName], nó được xác định là một chiếc hộp kim loại bí ẩn với cấu trúc siêu bền, không thể mở bằng các phương pháp thông thường."
 distar.3051.a:0 "Mở nó ra."
 distar.3051.b:0 "Nghiên cứu nó."
 distar.3051.c:0 "Bán nó đi."
 distar.3051.c.tooltip:0 "Bán chiếc hộp cho người trả giá cao nhất."
 distar.3052.name:0 "Vật Thể Biến Mất"
 #distar.3052.desc: "The drone successfully latched onto the unknown object, but the added mass of the drone and the change in trajectory soon caused both drone and object to be pulled out of orbit, tumbling into deep space at high speed."
 #distar.3052.desc.1: "The ejected debris successfully collided with the unknown object. Unfortunately, instead of reducing its velocity, the debris knocked the object out of orbit, tumbling into deep space at high speed."
 distar.3055.name:0 "Các Lọ Thuốc Ngoại Lai"
 distar.3055.desc:0 "Các nhà khoa học của chúng ta cuối cùng đã mở được chiếc hộp bí ẩn! Bên trong là ba lọ dung dịch phát quang kỳ lạ: một lọ màu đỏ, một lọ màu xanh lục và một lọ màu xanh lam. Các phân tích ban đầu cho thấy đây là những huyết thanh biến đổi gen cực kỳ tinh vi, có khả năng nâng cấp các đặc tính sinh học của người sử dụng."
 distar.3055.desc.1:0 "Do một nguyên nhân chưa rõ, các dung dịch bắt đầu phân rã nhanh chóng sau khi được lấy ra khỏi khoang chứa bảo vệ. Chúng ta chỉ có đủ thời gian để tổng hợp và sử dụng một trong ba lọ dung dịch này trước khi chúng mất hoàn toàn hoạt tính."
 distar.3055.a:0 "Sử dụng dung dịch §Rđỏ§!."
 distar.3055.a.tooltip:0 "Biến đổi loài [Root.Owner.GetSpeciesName] bằng dung dịch đỏ."
 distar.3055.b:0 "Sử dụng dung dịch §Gxanh lục§!."
 distar.3055.b.tooltip:0 "Biến đổi loài [Root.Owner.GetSpeciesName] bằng dung dịch xanh lục."
 distar.3055.c:0 "Sử dụng dung dịch §Bxanh lam§!."
 distar.3055.c.tooltip:0 "Biến đổi loài [Root.Owner.GetSpeciesName] bằng dung dịch xanh lam."
 distar.3055.d.evopred: "Không có thời gian cho các biện pháp nửa vời, hãy dùng tất cả!"
 distar.3055.d.evopred.tooltip: "§YMột trong 2 khả năng sẽ xảy ra:§!\n§Y50%§! cơ hội nhận được lợi ích từ tất cả các dung dịch.\n§Y50%§! cơ hội không có chuyện gì xảy ra."
 distar.3055.d:0 "Bán sạch."
 distar.3055.d.tooltip:0 "Bán các lọ dung dịch cho người trả giá cao nhất."
 distar.3056.name:0 "Thành Phần Bên Trong Hộp Ngoại Lai"
 distar.3056.desc:1 "Cuối cùng, các [Root.GetScientistPlural] của chúng ta đã có thể nhìn trộm vào bên trong chiếc hộp ngoại lai mà không làm ảnh hưởng đến chính vật chứa. Bằng cách sử dụng một loại sóng siêu âm tiên tiến, họ đã có thể xác định được thành phần bên trong.\n\nNhững gì bên trong thật khó hiểu, hoặc ít nhất là ngoài dự đoán. Chiếc hộp chứa ba lọ nhỏ, mỗi lọ chứa một chất lỏng chưa rõ danh tính.\n\nChiếc hộp an toàn để mở, nhưng sẽ cần nghiên cứu thêm để hiểu cách mở."
 distar.3056.a:0 "Mở nó ra."
 distar.3056.a.tooltip:0 "\nNghiên cứu chiếc hộp đã đẩy nhanh\nkiến thức £physics£ §YVật Lý§! của chúng ta."
 # Above "\n" is intended, to put "Physics"-word and -symbol on the same line
 distar.3056.b:0 "Bán nó đi."
 distar.3056.b.tooltip:0 "Bán chiếc hộp cho người trả giá cao nhất."
 distar.3056.c:0 "Chiếu xạ nó."
 distar.3056.c.tooltip:0 "Thông qua phân tích kích hoạt neutron, chúng ta có thể hiểu rõ hơn những vật liệu nào đã được sử dụng để làm nên chiếc hộp và các thành phần bên trong."

 distar.3057.name:0 "Biến Đổi Gen Hoàn Tất"
 distar.3057.desc.all: "Là bậc thầy trong việc tổng hợp và triển khai các bộ gen độc nhất, kết quả chưa bao giờ phải nghi ngờ. Chúng ta đã xoay xở áp dụng đồng thời các dung dịch §Rđỏ§!, §Gxanh lục§!, và §Bxanh lam§! lên loài [root.GetSpeciesName].\n\nGiống loài của chúng ta giờ đây trở nên hòa đồng hơn, dễ thích nghi hơn và có tuổi thọ cao hơn."
 distar.3057.desc.stronger:1 "Dung dịch biến đổi gen màu §Rđỏ§! đã được tiêm thành công cho người [Root.GetSpeciesName].\n\nDựa trên những quan sát sơ bộ đối với các đối tượng ban đầu, dung dịch dường như khiến chúng ta trở nên hòa đồng hơn."
 distar.3057.desc.adaptive:0 "Dung dịch biến đổi gen màu §Gxanh lục§! đã được tiêm thành công cho người [Root.GetSpeciesName].\n\nDựa trên những quan sát sơ bộ đối với các đối tượng ban đầu, dung dịch dường như cải thiện khả năng thích nghi của chúng ta với môi trường."
 distar.3057.desc.longlived:0 "Dung dịch biến đổi gen màu §Bxanh lam§! đã được tiêm thành công cho người [Root.GetSpeciesName].\n\nDựa trên những quan sát sơ bộ đối với các đối tượng ban đầu, dung dịch dường như giúp kéo dài tuổi thọ tiềm năng của chúng ta."
 distar.3057.desc:0 "Nỗ lực biến đổi gen đáng tiếc đã thất bại bất chấp những kết quả ban đầu đầy hứa hẹn, do các dung dịch tỏ ra không tương thích với bộ gen [Root.GetSpeciesAdj] nói chung."


 ### Breathing Rift ###
 distar.3060.name:0 "Vết Nứt Hô Hấp"
 distar.3060.desc:0 "Dị thường được tìm thấy gần [breathing_rift_object.GetName], dù khó tin đến đâu, dường như là một loại vết nứt trong không gian. Có thể khối lượng khổng lồ của [breathing_rift_object.GetName] bằng cách nào đó đã gây ra nó, nhưng bản chất của nó vượt quá tầm hiểu biết của chúng ta.\n\nVết nứt không chỉ khúc xạ và chặn ánh sáng, mà dường như thực sự hút ánh sáng vào rồi đẩy nó ra, lặp đi lặp lại - như thể nó đang hít thở các hạt photon.\n\nRất có thể lực hấp dẫn khổng lồ của vết nứt tại một thời điểm nào đó cũng đã hút những thứ khác vào bên trong. Chúng ta nên thận trọng."
 distar.3060.a:0 "Theo dõi chặt chẽ cho đến khi chúng ta biết nhiều hơn."
 distar.3060.a.tooltip:0 "Phái một đầu dò quan sát để giám sát vết nứt."
 distar.3060.b:0 "Có thể nghiên cứu nó từ một khoảng cách an toàn."
 distar.3060.c:0 "Tàu [Root.GetName] đang gặp rủi ro. Rời đi ngay."

 distar.3061.name:0 "Vết Nứt Hô Hấp - Khoáng Sản"
 distar.3061.desc:0 "Nhiều tháng đã trôi qua kể từ khi phát hiện vết nứt gần [breathing_rift_object.GetName] mà không có điều gì bất thường xảy ra. Nhưng giờ đây, chúng ta nhận được báo cáo về một lượng lớn các tảng đá giàu khoáng sản tràn ra từ nó.\n\nChúng hoàn toàn thuộc về chúng ta.\n\nViệc quan sát vết nứt sẽ tiếp tục."
 distar.3061.desc.repeat:0 "Một lần nữa, vết nứt gần [breathing_rift_object.GetName] lại giải phóng một khối lượng lớn vật phẩm. Lần này là tàn dư của một tiểu hành tinh, nhiều mảnh trong số đó chứa đầy khoáng sản.\n\nChúng hoàn toàn thuộc về chúng ta.\n\nViệc quan sát vết nứt sẽ tiếp tục."
 distar.3061.a:0 "Tuyệt vời. Hãy thu thập chúng thật nhanh chóng."

 distar.3062.name:0 "Vết Nứt Hô Hấp - Mảnh Vỡ"
 distar.3062.desc:0 "Nhiều tháng bình lặng đã trôi qua kể từ khi phát hiện vết nứt gần [breathing_rift_object.GetName]. Nhưng giờ đây, chúng ta đã nhận được báo cáo về một dòng mảnh vỡ lớn tràn ra từ nó. Chúng hoàn toàn thuộc về chúng ta.\n\nViệc quan sát vết nứt sẽ tiếp tục."
 distar.3062.desc.repeat:0 "Lại một lần nữa, vết nứt gần [breathing_rift_object.GetName] phun ra một thứ gì đó mới. Lần này chủ yếu là các mảnh vỡ kim loại, có lẽ từ một trận chiến cổ đại nào đó. Chúng hoàn toàn thuộc về chúng ta.\n\nViệc quan sát vết nứt sẽ tiếp tục."
 distar.3062.a:0 "Thu hồi những mảnh vỡ còn nguyên vẹn nhất."

 #distar.3063.name: "Breathing Rift - Unknown Creature"
 #distar.3063.desc: "A significant spike in energy levels has been seen in recent readings from the rift near [breathing_rift_object.GetName].\n\nWhat followed immediately after has thrown our scientists into a state of panic. An unknown, colossal creature escaped the rift, drifting into the solar system.\n\nWe should proceed with extreme caution, no matter our course of action."

 distar.3064.name:0 "Vết Nứt Biến Mất"
 distar.3064.desc:0 "Báo cáo dữ liệu mới nhất từ đầu dò quan sát vết nứt cho biết vết nứt đã biến mất. Sau khi hít vào hơi thở cuối cùng, vết nứt đã khép lại và thậm chí không để lại một chút dấu vết nào về năng lượng của nó."
 distar.3064.a:0 "Thật không may."
 distar.3064.a.tooltip:0 "Tuy nhiên, dữ liệu thu thập được theo thời gian đã thúc đẩy các nghiên cứu §YVật Lý§! £physics£ của chúng ta."

 ####################################
 # Special Projects
 ####################################

 ### Trojan Asteroid ###
 trojan_asteroid_project:0 "Tiểu Hành Tinh Trojan"
 trojan_asteroid_project_DESC:0 "Một khi các drone đã bị tiêu diệt, tiểu hành tinh mà chúng ẩn nấp có thể được điều tra kỹ lưỡng hơn."

 ### Impossible Organism ###
 impossible_organism_project_1:0 "Sinh Vật Bất Khả Thi: Lấy Mẫu"
 impossible_organism_project_1_DESC:1 "Tàu [impossible_organism_science_ship.GetName] đã thu hồi thành công một mẫu vật của sinh vật cực kỳ kiên cường được tìm thấy trên bề mặt độc hại của [impossible_organism_planet.GetName].\n\nCác nhà sinh học của chúng ta muốn nghiên cứu nó chi tiết hơn."

 impossible_organism_project_2:0 "Sinh Vật Bất Khả Thi: Tiếp Tục"
 impossible_organism_project_2_DESC:1 "Dạng sống được tìm thấy trên [impossible_organism_planet.GetName] đã cho thấy khả năng phát triển phi thường trong môi trường khắc nghiệt.\n\nCần phải nghiên cứu sâu hơn nếu các nhà sinh học của chúng ta muốn làm sáng tỏ những bí ẩn về các quá trình di truyền, tế bào và sinh hóa của nó."

 ### Molluscoid Miners ###
 molluscoid_miners_project_1:0 "Thợ Mỏ Thân Mềm"
 molluscoid_miners_project_1_DESC:0 "Nghiên cứu giống loài thân mềm và cố gắng khám phá cách thức chúng xác định vị trí các mỏ khoáng sản một cách dễ dàng như vậy."
 molluscoid_miners_project_2:0 "Tích Hợp Loài Thân Mềm"
 molluscoid_miners_project_2_DESC:0 "Bắt đầu tích hợp các thợ mỏ thân mềm vào xã hội [Root.Owner.GetAdj]."
 molluscoid_miners_project_3:0 "Sản Xuất Khoáng Sản"
 molluscoid_miners_project_3_DESC:0 "Bắt đầu nghiên cứu và triển khai một hệ thống có khả năng nhanh chóng lập biểu đồ địa hình dưới lòng đất, với mục tiêu cuối cùng là cải thiện sản lượng khoáng sản."

 ### Orbital Speed Demon ###
 speed_demon_open_box_project:0 "Mở Chiếc Hộp Ngoại Lai"
 speed_demon_open_box_project_DESC:0 "Bắt đầu những nỗ lực mở chiếc hộp ngoại lai được tìm thấy trên quỹ đạo của [speed_demon_orbit_body.GetName]."
 speed_demon_learn_more_project:0 "Nghiên Cứu Chiếc Hộp Ngoại Lai"
 speed_demon_learn_more_project_DESC:0 "Nghiên cứu chiếc hộp ngoại lai được tìm thấy trên quỹ đạo của [speed_demon_orbit_body.GetName] để xác định những gì bên trong nó."

 ### Breathing Rift ###
 breathing_rift_project:0 "Hít Vào, Thở Ra"
 breathing_rift_project_DESC:0 "Quan sát vết nứt trong không gian được phát hiện gần [breathing_rift_object.GetName] và chờ đợi bất cứ thứ gì phát sinh từ nó, nếu có."


 story.101.aa:0 "$story.201.aa$"
 story.101.bb:0 "$story.201.bb$"
 story.101.bb.exter:0 "Một cuộc nghiên cứu có thể xúc tiến việc tiêu diệt trong tương lai."
 story.101.cc:0 "$story.201.cc$"
 story.101.aa.amoebahunt:0 "§G+1000§! £energy£ cho mỗi hạm đội Trùng Biến Hình Không Gian bị tiêu diệt"

 story.105.bb:0 "Các lông roi thật hấp dẫn."
 story.105.aa:0 "Thu hồi một số mẫu mô."

 story.107.name:0 "Trùng Biến Hình Đã An Hóa"
 story.107.desc:0 "Tạm thời hạn chế xả một số khí thải nhất định từ lõi lò phản ứng của tàu chúng ta khi ở gần các đàn Trùng Biến Hình Không Gian dường như là đủ để không khơi dậy cơn thịnh nộ của chúng.\n\nVới quy chuẩn mới này được áp dụng, chúng không còn là mối đe dọa nữa, và chúng ta đã có thể nghiên cứu chúng ở cự ly gần."
 story.107.a:0 "Xuất sắc."
 story.107.a.tooltip:0 "Thêm hiệu ứng điều chỉnh §Y$pacified_amoebas$§!, mang lại các hiệu ứng sau:\nCác hạm đội §HTrùng Biến Hình Không Gian§! trở nên §Gphi thù địch§!"
 pacified_amoeba_tt: "Các hạm đội §HTrùng Biến Hình Không Gian§! trở nên §Gphi thù địch§!"

 story.201.aa:0 "Con mồi béo bở."
 story.201.aa.crystalhunt:0 "§G+500§! £minerals£ cho mỗi hạm đội Thực Thể Tinh Thể bị tiêu diệt"
 story.201.bb:0 "Những sinh vật hấp dẫn."
 story.201.cc:0 "Chúng ta có thể học cách cùng chung sống."

 story.207.name:0 "Tinh Thể Đã An Hóa"
 story.207.desc:0 "Các Thực Thể Tinh Thể dường như cộng hưởng để phản ứng với một điều gì đó; một trong số ít tương tác của chúng với môi trường. Bản chất chính xác và mục đích rộng hơn có thể có của dạng sóng phát ra này vẫn chưa được xác định, nhưng hiện tại các tàu của chúng ta có thể xấp xỉ nó bằng các tín hiệu vô tuyến, về cơ bản là ngụy trang thành các Tinh Thể đồng loại."
 story.207.a:0 "Thật cộng hưởng."
 story.207.a.tooltip:0 "Thêm hiệu ứng điều chỉnh §Y$pacified_crystals$§!, mang lại các hiệu ứng sau:\nCác hạm đội §HThực Thể Tinh Thể§! trở nên §Gphi thù địch§!"

 # crystal station destroyed
 story.222.name:0 "Tinh Thể Vỡ Tan"
 story.222.desc:0 "Chúng ta đã phá hủy cấu trúc tinh thể trong hệ sao [FromFrom.solar_system.GetName]. Nó tỏ ra kiên cường hơn mong đợi, và một số mảnh vỡ đã được thu hồi để nghiên cứu. Chúng ta có thể mô phỏng các đặc tính tái thiết của mạng tinh thể quan sát được trong trận chiến."

 story.305.aa:0 "$story.201.aa$"
 story.305.bb:0 "Những cỗ máy tự hành thật hấp dẫn."

 # drone station destroyed
 story.332.name:1 "$story.333.name$"
 story.332.desc:1 "Chúng ta đã phá hủy căn cứ Drone Khai Mỏ, và thu hồi được phần lớn kho dự trữ khoáng sản đã qua chế biến cùng các hợp kim quý giá của nó."
 story.332.a:0 "Sự giàu có khôn xiết."
 story.332.b:0 "...và một thiết bị kỳ lạ..."

 CRYSTALS_PROJECT:0 "Nghiên Cứu Tinh Thể"
 CRYSTALS_PROJECT_DESC:0 "$CRYSTALS_1_PROJECT_DESC$"
 CRYSTALS_PACIFICATION_PROJECT:0 "An Hóa Thực Thể Tinh Thể"
 CRYSTALS_PACIFICATION_PROJECT_DESC:0 "Các Thực Thể Tinh Thể được quan sát thấy trong một số hệ sao rất dễ kích động và tiềm ẩn nguy hiểm."

 DRONES_PROJECT:0 "Nghiên Cứu Drone"
 DRONES_PROJECT_DESC:0 "$DRONES_1_PROJECT_DESC$"

 AMOEBAS_PROJECT:0 "Nghiên Cứu Trùng Biến Hình Không Gian"
 AMOEBAS_PROJECT_DESC:0 "$AMOEBAS_1_PROJECT_DESC$"
 AMOEBAS_PACIFICATION_PROJECT:0 "An Hóa Trùng Biến Hình"
 AMOEBAS_PACIFICATION_PROJECT_DESC:0 "Có điều gì đó ở hạm đội của chúng ta dường như kích động các Trùng Biến Hình Không Gian. Nếu bằng cách nào đó chúng ta có thể cô lập điều này, chúng ta có thể giảm bớt sự hung hăng của Trùng Biến Hình hoặc thậm chí che giấu hoàn toàn các con tàu của mình khỏi các giác quan của chúng."

 CLOUDS_PROJECT:0 "Nghiên Cứu Mây Hư Không"
 CLOUDS_PROJECT_DESC:0 "$CLOUDS_1_PROJECT_DESC$"

 crystal_hunting_buff:0 "Thợ Săn Tinh Thể"
 crystal_hunting_buff_desc:0 "Các mảnh vỡ vụn của Thực Thể Tinh Thể sẽ tự động được thu hồi sau trận chiến, mang lại £minerals£ §G500§! cho mỗi hạm đội bị tiêu diệt."
 crystal_focus:0 "Tiêu Điểm Tinh Thể"
 crystal_focus_desc:0 "Môi trường truyền dẫn cải tiến được mô phỏng theo các cấu trúc bên trong độc đáo của Thực Thể Tinh Thể giúp giảm thiểu tổn thất điện trở trong quá trình sản xuất và phân phối năng lượng."
 pacified_crystals:0 "An Hóa Thực Thể Tinh Thể"
 pacified_crystals_desc:0 "Các buổi phát sóng ngắn ở một số tần số nhất định sẽ ngụy trang hiệu quả các hạm đội của chúng ta thành các Thực Thể Tinh Thể đồng loại, và các sinh vật không gian sẽ không còn nhận diện chúng ta là mối đe dọa."

 amoeba_hunting_buff:0 "Thợ Săn Trùng Biến Hình"
 amoeba_hunting_buff_desc:0 "Xác Trùng Biến Hình được thu gom sau trận chiến và các cơ quan nội tạng của chúng được thu hoạch để lấy các hợp chất hữu cơ có giá trị, mang lại £energy£ §G1000§! cho mỗi hạm đội bị tiêu diệt."
 pacified_amoebas:0 "An Hóa Trùng Biến Hình"
 pacified_amoebas_desc:0 "Các hạm đội điều chỉnh việc xả bức xạ khi tiếp cận Trùng Biến Hình Không Gian, và các sinh vật không gian sẽ không còn nhận diện chúng ta là mối đe dọa."

 drone_hunting_buff:0 "Kẻ Hủy Diệt Drone"
 drone_hunting_buff_desc:0 "Các Drone Khai Mỏ rõ ràng được sản xuất hàng loạt. Một điểm yếu được tìm thấy ở một con là điểm yếu có ở tất cả các con."
 drone_mining_techniques: "Kỹ Thuật Khai Mỏ Drone"
 drone_mining_techniques_desc: "Việc sử dụng các kỹ thuật bắt nguồn từ Drone Khai Mỏ cho phép chúng ta khai thác hiệu quả các mạch khoáng sản mà trước đây được coi là không đáng để bận tâm."
 drone_mining_techniques_nomad: "Kỹ Thuật Thu Hoạch Drone"
 drone_mining_techniques_nomad_desc: "Các kỹ thuật bắt nguồn từ Drone Khai Mỏ giúp chúng ta thu hoạch tài nguyên hiệu quả hơn trong các chuyến hành trình của mình."

 cloud_hunting_buff:0 "Kẻ Hủy Diệt Mây Hư Không"
 cloud_hunting_buff_desc:0 "Điện tích của Mây Hư Không dao động theo chu kỳ nhanh nhưng có thể quan sát được. Tấn công với thời điểm chính xác sẽ làm mất ổn định đáng kể những nguồn năng lượng bí ẩn duy trì sự sống cho các thực thể này."
 void_loops:0 "Vòng Lặp Hư Không"
 void_loops_desc:0 "Bản chất dị thường của Mây Hư Không mở ra những khả năng mới trong nghiên cứu vật lý."

