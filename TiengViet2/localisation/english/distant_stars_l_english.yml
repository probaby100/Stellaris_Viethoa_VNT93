# ANOMALY EVENTS:
# The Vechtar Zavonia Chain
 distar.1000.name:0 "Tàu Vechtar Zavonia"
 distar.1000.desc:0 "Xác tàu đồ sộ quay quanh [From.GetName] là tất cả những gì còn lại của tàu Vechtar Zavonia, một tàu thế hệ dưới tốc độ ánh sáng khổng lồ thuộc về một chủng tộc mang tên Mardak Vol. Con tàu đã du hành hàng ngàn năm để tìm kiếm một thế giới thiên đường được hứa hẹn."
 distar.1000.a:0 "Thiên đường bạn nói đó..."
 distar.1000.b:0 "Phủ định."
 distar.1001.name:0 "Hành Tinh Ẩn Giấu"
 distar.1001.desc:0 "Giải mã các thuật toán mã hóa trên hệ thống dẫn đường của tàu Vechtar Zavonia không phải chuyện dễ dàng, nhưng nhờ sự tận tụy của nhà nghiên cứu trưởng [vechtar_zavonia_leader_name.GetName], người dường như đã bị ám ảnh bất thường bởi việc tìm kiếm thế giới thiên đường của người Mardak Vol, cuối cùng chúng ta đã thành công.\n\nĐáng lo ngại hơn, khám phá này bằng cách nào đó đã bị rò rỉ ra công chúng, những người hiện cũng chia sẻ nỗi ám ảnh của [vechtar_zavonia_leader_name.GetName] về việc định cư trên một hành tinh thiên đường."
 distar.1001.a:0 "Không gì có thể ngăn chúng ta đặt chân đến thiên đường."
 distar.1001.b:0 "Hủy bỏ. Đây chỉ là một trò đuổi hình bắt bóng viển vông."
 distar.1002.name:0 "Thiên Đường Đã Mất"
 distar.1002.desc:0 "Sau khi kiểm tra đi kiểm tra lại tọa độ của ổ đĩa dẫn đường, chúng ta buộc phải thừa nhận rằng nơi lẽ ra phải là hành tinh thiên đường của người Mardak Vol chỉ là những đồng bằng hoang vắng của một thế giới cằn cỗi.\n\nMặc dù chúng ta không thể loại trừ khả năng quan niệm về thiên đường của người Mardak hoàn toàn khác biệt với chúng ta, nhưng bề mặt chằng chịt vết bom đạn của [utopian_planet.GetName] lại kể một câu chuyện khác. Thuyền trưởng và thủy thủ đoàn con tàu đã không thể dễ dàng chấp nhận sự thất vọng này."
 distar.1002.a:0 "Không thể nào! Hãy kiểm tra lại tọa độ lần thứ tư!!"
 distar.1002.b:0 "Trở về với thực tại thôi..."
 distar.1003.name:0 "Hoàn Hảo Như Tranh Vẽ"
 distar.1003.desc:2 "Cuối cùng chúng ta đã giải mã được bí mật của người Mardak Vol!\n\nKhi phóng đầu dò xuống bề mặt của [utopian_planet.GetName], lớp ngụy trang ảnh toàn phần tinh vi bao bọc hành tinh đã bị phá vỡ, để lộ một thế giới Gaia tuyệt mỹ và người Mardak Vol vẫn đang sống hạnh phúc trong sự yên bình cô lập suốt hàng thiên niên kỷ qua!"
 distar.1003.a:0 "Người Mardak Vol vẫn còn sống!"
 distar.1003.b:0 "Đó quả thực là một hành tinh xinh đẹp..."
 distar.1004.name:0 "Thiên Đường Bí Mật"
 distar.1004.desc:3 "Đế chế [country_that_discovered_mardak_vol.GetName] đã phát hiện ra một xã hội [GetPreFTLLower] bí mật ẩn mình trên một hành tinh Gaia ngay trong biên giới của chúng ta. Hành tinh dường như đã được bảo vệ bởi một loại trường năng lượng tinh vi, khiến nó trông như một thế giới cằn cỗi trong khi thực tế không phải vậy. Chúng ta vẫn chưa xác định được ai đã che giấu nó và tại sao, vì bản thân loài [GetPreFTLLowerPlural] rõ ràng thiếu công nghệ để làm điều đó. Họ dường như là một sự kết hợp cộng sinh giữa nấm và động vật có vú, và theo như chúng ta có thể nhận định, họ hoàn toàn vô hại."
 distar.1004.a:0 "Đừng bao giờ đánh giá một hành tinh qua vẻ bề ngoài."
 distar.1005.name:0 "Truyền tải thông điệp"
 distar.1005.desc_a:0 "Chúng ta đang nhận được tín hiệu liên lạc từ một giống loài thú có vú thông minh chưa từng gặp trước đây, liên quan đến các cư dân Mardak Vol vẫn đang sinh sống trên [utopian_planet.GetName]."
 distar.1005.desc_b:1 "Chúng ta đang nhận được tín hiệu liên lạc từ một giống loài thú có vú thông minh chưa từng biết đến, liên quan đến các cư dân [GetPreFTLLowerPlural] đang sinh sống trên [utopian_planet.GetName]. Tình hình có vẻ rất khẩn cấp."
 distar.1006.desc:0 "Hân hạnh được gặp, [From.GetSpeciesNamePlural]. Chúng tôi là người Vol và chúng tôi đến trong hòa bình.\n\nChúng tôi phát hiện một trong những hành tinh của các bạn, [utopian_planet.GetName], đang bị xâm nhiễm bởi một loài nấm ngoại lai độc hại mang tên Mardak Vol. Nó là loài ký sinh đã săn đuổi đồng loại chúng tôi suốt nhiều thời đại, biến vật chủ thành những con rối vô hồn, và các bạn là mục tiêu tiếp theo!\n\nChúng tôi tưởng đã tận diệt được chúng, nhưng đợt quét thường niên lại phát hiện một quần thể đang phát triển mạnh mẽ trên [utopian_planet.GetName]. Đừng sợ hãi, chúng tôi biết chính xác phải làm gì..."
 distar.1006.a:0 "Thanh tẩy họ bằng lửa sao!?"
 distar.1006.b:0 "Vô lý, họ hoàn toàn vô hại!"
 distar.1006.c:0 "Các ngươi không được phép làm hại họ!"
 distar.1008.desc:0 "Xin lưu ý: Chúng tôi đang bắt đầu quy trình tiêu diệt quỹ đạo. 3, 2, 1... Đã giải phóng dung môi diệt nấm X vào bầu khí quyển. Vật chủ thù địch đã bị xóa sổ!\n\nĐừng lo lắng về những biến đổi môi trường nhỏ phát sinh..."
 distar.1008.a:0 "Mọi chuyện đã kết thúc..."
 distar.1008.b:0 "Biến đổi môi trường sao??"
 distar.1009.desc:0 "Lũ [From.GetSpeciesNamePluralInsult] thô thiển! Ngươi nghĩ mình sẽ thích thú thế nào khi thức dậy với một con Mardak găm chặt vào [From.GetSpeciesOrganName] của mình, da thịt co giật và tâm trí vỡ vụn khi lũ nấm chiếm đoạt từng tế bào của ngươi hả!?\n\nMay mắn cho ngươi, [From.GetSpeciesNamePluralInsult], ngày đó sẽ không bao giờ xảy ra. Chúng tôi sẽ không cho phép điều đó.\n\nChúng tôi là người Vol. Chúng tôi sẽ trở lại... trong hòa bình."
 distar.1009.a:0 "Đúng vậy..."
 distar.1011.name:0 "§RCảnh Báo Xâm Phạm Biên Giới!§!"
 distar.1011.desc:0 "Chúng ta đã phát hiện một hạm đội thù địch mang dấu hiệu nhận dạng của người Vol đang tiến thẳng về phía [utopian_planet.GetName]. Có vẻ như họ quyết tâm tiêu diệt người Mardak Vol bằng mọi giá!"
 distar.1011.a:0 "Không ổn rồi..."
 distar.1013.desc:0 "Kênh liên lạc chỉ còn lại những tiếng nổ lép bép và tạp âm. Chúng ta đã mất hoàn toàn tín hiệu kết nối với người Vol."
 distar.1013.a:0 "Chúng đã ngắt kết nối!!"
 distar.1014.name:0 "Nơi Lạc Viên"
 distar.1014.desc:1 "Cuối cùng chúng ta đã định cư trên thế giới thiên đường của người Mardak Vol, Paridayda. Nhân dân đang ăn mừng hoan hỉ trước viễn cảnh một ngày nào đó con cháu của [From.Owner.GetSpeciesSpawnNamePlural] cũng sẽ được vui đùa giữa những cồn cát vàng, khu vườn sum suê và những dòng suối pha lê tuyệt mỹ trên [utopian_planet.GetName]!!"
 distar.1014.a:0 "Đã đến lúc rồi..."
 distar.1014.b:0 "Cứ chờ xem sao..."
 # Star Lifting
 distar.1020.name:0 "Dòng Chảy Do Nhiệt Lượng Kích Hoạt"
 distar.1020.desc:0 "Kiểm tra kỹ lưỡng hơn giàn bệ quay quanh [From.GetName] cho thấy đây là một thiết kế ngoại tộc phức tạp và kỳ lạ. Cấu trúc chống nước và hệ thống điều hòa khí hậu tiên tiến cho thấy những kẻ tạo ra nó là một giống loài thân mềm ưa ẩm ướt."
 distar.1020.a:0 "Sửa chữa giàn bệ."
 distar.1020.c:0 "Cải biến các chùm vi ba thành vũ khí."
 distar.1020.b:0 "Rời đi."
 distar.1021.name:0 "Đùa Với Lửa"
 distar.1021.desc:0 "Sau những nỗ lực sửa chữa quy mô lớn, giàn bệ đã được đưa vào hoạt động, và ngôi sao hiện đang phun ra một lượng khổng lồ năng lượng vào không gian. Tuy nhiên con đường dẫn đến thành công không hề bằng phẳng.\n\nKhi các chùm vi ba cực lớn khởi động, chúng suýt chút nữa đã gây ra một vụ bùng phát plasma thiêu rụi trạm."
 distar.1021.a:0 "Một quả pin mặt trời chỉ dành riêng cho chúng ta!"
 distar.1021.b:0 "Chao ôi, lũ Thân Mềm. Thân xác nhũn nhẽo, đầu óc cũng nhũn nhẽo..."
 distar.1022.name:0 "Chùm Vi Ba Thân Mềm"
 distar.1022.desc.a:0 "Thủy thủ đoàn tàu [star_lifting_ship.GetName] không mất nhiều thời gian để đi đến kết luận rằng thiết kế của bệ phóng sao này, theo lời của Sĩ quan Khoa học [star_lifting_leader.GetName], là một kiệt tác của những kẻ điên. Các chùm vi ba rất thô sơ, chưa được cân chỉnh chuẩn xác và cần nhiều tinh chỉnh trước khi hoạt động như ý định ban đầu. Dù vậy, chúng nhanh chóng chứng tỏ là những vũ khí xuất sắc."
 distar.1022.desc.b:0 "Nỗ lực cải biến các chùm vi ba của loài Thân Mềm thành vũ khí đã... thất bại thảm hại. Khi kích hoạt, chúng ta mới nhận ra thiết kế vi ba này tệ hại đến mức không từ ngữ nào tả xiết, và hệ thống đã nổ tung thành từng mảnh."
 distar.1022.a:0 "Ghi nhận mọi dữ liệu có thể."
 distar.1022.b:0 "Thảm họa."
 distar.1022.c:0 "Lũ Thân Mềm đó lẽ ra không bao giờ nên dính dáng đến khoa học..."
 # The Big RIP
 distar.1030.name:0 "Trạm Quan Sát Bỏ Hoang"
 distar.1030.desc:1 "Toàn bộ các ổ lưu trữ dữ liệu của trạm quan sát đã bị xóa sạch, và mọi bằng chứng có thể chỉ ra chủ nhân ban đầu của nó đều đã được tẩy xóa cẩn thận. Trên bề mặt [big_rip_planet.GetName], các cảm biến phát hiện dấu vết của một thảm kịch kinh hoàng."
 distar.1030.a:0 "Tiến hành điều tra."
 distar.1030.b:0 "Rời đi."
 distar.1031.name:1 "Bão Xám"
 distar.1031.desc:1 "Dù đã cố gắng hết sức để giữ bí mật, dấu vết về sự can thiệp vụng về của những người quan sát vẫn hiện rõ khắp [big_rip_planet.GetName]...\n\nBằng chứng cho thấy các nhà nghiên cứu đã vô tình kích hoạt một đàn robot nano cổ đại - thứ mà họ gọi là Cơn Bão Xám - quét sạch toàn bộ nền văn minh bản địa trong nháy mắt."
 distar.1031.a:0 "Thật là một đống hỗn độn..."
 distar.1031.b:0 "Hãy yên nghỉ nhé, những bông hoa mong manh..."
 # Bunker-Bot
 distar.1040.name:0 "Robot Hầm Ngục"
 distar.1040.desc:0 "Chúng ta đã truy tìm nguồn bức xạ điện từ bất thường phát ra từ [From.GetName] và tìm thấy một boongke ngầm bí mật che giấu một siêu máy tính to bằng cả một thiết giáp hạm.\n\nCác [Owner.GetResearchers] của chúng ta nghi ngờ rằng nó có thể đã nằm ở đó hàng nghìn năm, miệt mài giải quyết một bài toán duy nhất vô cùng phức tạp mà bản chất của nó vẫn là một ẩn số.\n\nKhi cố gắng tương tác với máy tính, họ phát hiện cơ sở này được vận hành bởi một AI an ninh sẵn sàng thiêu rụi bất kỳ vị khách nào ghé thăm. Khi AI cuối cùng bị đánh bại, nó đã phát đi một thông điệp tới một người nhận chưa xác định."
 distar.1040.a:0 "Tháo dỡ siêu máy tính lấy linh kiện!"
 distar.1040.a.tooltip:0 "Một chiếc máy tính không giải nổi một bài toán trong một nghìn năm thì tốt nhất nên biến thành vỏ tàu..."
 distar.1040.b:0 "Sử dụng nó để tăng cường nghiên cứu của chúng ta..."
 distar.1040.b.tooltip:0 "Điều này đòi hỏi phải vô hiệu hóa AI duy trì cơ sở và sẽ khiến máy tính sụp đổ trong tương lai gần."
 distar.1040.c:0 "Hãy để nó tiếp tục những phép tính bí ẩn..."
 distar.1040.c.tooltip:0 "Tốt hơn hết chúng ta không nên làm phiền nó. Bất kể bài toán mà máy tính đang cố giải quyết là gì, nó dường như rất quan trọng..."
 # Atomic Clock
 distar.1045.name:0 "42 Năm Và 3 Ngày"
 distar.1045.desc:0 "Một cuộc quét kỹ lưỡng hơn trường mảnh vỡ quanh [From.GetName] đã phát hiện một khoang kín khí chứa một chiếc đồng hồ nguyên tử đang đếm ngược với độ chính xác tuyệt đối. Thời gian còn lại trên đồng hồ hiển thị chính xác: 42 năm và 3 ngày."
 distar.1045.a:0 "Hãy để mắt tới nó."
 distar.1045.b:0 "ĐÓ LÀ MỘT QUẢ BOM!! HÃY PHÁ HỦY NÓ!!"
 distar.1045.a.tooltip:0 "Tích tắc, tích tắc..."
 distar.1045.b.tooltip:0 "Khoang chứa đầy những sợi dây trông có vẻ vô hại, bất kỳ sợi nào cũng có thể kích hoạt vũ khí hủy diệt hàng loạt xóa sổ cả hệ sao! Thủy thủ đoàn sẽ cắt đứt tất cả!"
 # Eat or be Eaten
 distar.1050.name:0 "Ăn Hoặc Bị Ăn"
 distar.1050.desc:1 "Trôi dạt ở rìa trường mảnh vỡ quanh [From.GetName] là một tàu nghiên cứu đổ nát không rõ nguồn gốc. Vết cắn khổng lồ và dịch tiêu hóa bám trên vỏ tàu cho thấy con tàu từng bị một loài ăn thịt không gian khổng lồ gặm nhấm. Dữ liệu trên tàu cho thấy đây là nhật ký của người [delicious_aliens.GetSpeciesNamePlural], những người đã xếp hạng các sinh vật thiên hà dựa trên hương vị của [delicious_aliens.GetSpeciesOrganName]..."
 distar.1050.desc_lithoid:1 "Trôi dạt ở rìa trường mảnh vỡ quanh [From.GetName] là một tàu nghiên cứu đổ nát không rõ nguồn gốc. Vết cắn khổng lồ và dịch tiêu hóa bám trên vỏ tàu cho thấy con tàu từng bị một quái thú không gian gặm nhấm. Dữ liệu trên tàu cho thấy đây là ghi chép của người [delicious_aliens.GetSpeciesNamePlural], những người đã xếp hạng độ ngon của [delicious_aliens.GetSpeciesOrganName] đối với các sinh vật khác..."
 distar.1050.a:0 "Có vẻ như cuối cùng họ cũng gặp phải đối thủ xứng tầm..."
 distar.1050.b.evopred: "Đánh giá theo hương vị thay vì độ phức tạp sao? Thật kỳ quặc."
 # The Cube
 distar.1055.name:0 "Khối Lập Phương"
 distar.1055.desc:2 "Giữa những xác tàu chiến vô chủ quay quanh [From.GetName], chúng ta đã phát hiện một tàu nghiên cứu ngoài hành tinh gần như còn nguyên vẹn. Nhật ký trên tàu tiết lộ rằng [Root.Owner.GetScientist] của họ và Sĩ quan Khoa học [cube_science_officer.GetName] đã bị ám ảnh đến phát điên bởi một khối kim loại nhỏ kỳ lạ."
 distar.1055.a:1 "Hãy xoay những ô vuông đó đi, [Root.Owner.GetScientist]!"
 distar.1055.b:0 "Cứ để mặc nó."
 distar.1056.name:0 "Cắt Gọt Và Phân Tích"
 distar.1056.desc:0 "Thủy thủ đoàn trên tàu [From.GetName] đã thử nghiệm mọi thuật toán giải mã với khối kim loại, nhưng không có kết quả.\n\n[cube_science_officer.GetName] đã thức trắng nhiều đêm, [cube_science_officer.GetSheHe] cầm khối hộp trong [From.Owner.GetSpeciesHandName] của mình, đôi mắt đờ đẫn lẩm bẩm những con số vô nghĩa. Tâm trí của [cube_science_officer.GetHerHis] dường như đã bị khối lập phương nuốt chửng hoàn toàn..."
 distar.1056.a:0 "Ôi trời..."
 distar.1056.a.tooltip:0 "[cube_science_officer.GetName] sẽ không bao giờ còn như trước nữa."
 # Honeymooners
 distar.1060.name:0 "Kỳ Nghỉ Trăng Mật"
 distar.1060.desc:0 "Chúng ta dường như vừa tình cờ bước vào bãi sinh sản của một giống loài động vật có vú không lông ngoại lai. Chúng ta quan sát thấy chúng thực hiện những nghi thức kết đôi phức tạp vào buổi tối, sau đó say xỉn dưới tác dụng của các hợp chất cồn hữu cơ."
 distar.1060.a:0 "Cuốn cẩm nang này sẽ là nguồn cảm hứng lớn cho nhân dân chúng ta!"
 distar.1060.b:0 "Lũ ngoại tộc dơ dáy! Người dân phải biết chúng là mối phiền toái lêu lổng và xả rác bừa bãi thế nào."
 distar.1060.c:0 "Tốt hơn hết là chúng ta nên giữ kín phát hiện này vào lúc này..."
 distar.1060.d:0 "Thật kinh tởm!"
 # Hologram
 distar.1065.name:0 "Hành Tinh Không Hề Tồn Tại"
 distar.1065.desc:1 "[From.GetName] hoàn toàn không phải là một hành tinh, mà là một hình chiếu ảnh toàn phần 3D vô cùng tinh vi. Ở trung tâm của nó là một máy chiếu khổng lồ tạo ra một trường năng lượng mô phỏng hoàn hảo một hành tinh thực."
 distar.1065.a:0 "Kỳ lạ thật..."
 # Star Crazy
 distar.1070.name:0 "Mô Hình Sao"
 distar.1070.desc:1 "Các chỉ số cảm biến mới nhất từ [From.GetName] cho thấy ngôi sao đang đập theo một nhịp điệu đều đặn kỳ lạ. Nhưng khi tàu [Root.GetName] đến nơi, Sĩ quan Khoa học [Root.GetLeaderName] lại thấy ngôi sao hoàn toàn yên ắng. [Root.GetLeaderName] quyết định tiếp tục theo dõi sát sao."
 distar.1070.a:0 "Chúng ta phải điều tra tận gốc chuyện này..."
 distar.1070.b:0 "Chỉ là trục trặc thiết bị thôi."
 distar.1071.name:0 "Chỉ Trong Một Giây Lát..."
 distar.1071.desc:0 "Sau vài ngày suy ngẫm trầm ngâm, Sĩ quan Khoa học [Root.GetLeaderName] đã thừa nhận sai lầm của mình - những xung động từ ngôi sao xa xôi không hề có mô hình ẩn giấu nào, mà chỉ là sự trùng hợp ngẫu nhiên của các chu kỳ đối lưu mặt trời."
 distar.1071.a:0 "Tốt. Vậy là giải quyết xong."
 distar.1072.name:0 "Trục Trặc Cảm Biến"
 distar.1072.desc:0 "Khi thủy thủ đoàn đến [anomalous_star.GetName], họ xác nhận cảm biến quả thực đã bị lỗi. Tin tốt là họ không chỉ đánh giá thấp tiềm năng năng lượng ban đầu của ngôi sao, mà Sĩ quan [From.GetLeaderName] dường như cũng đã rút ra bài học sâu sắc từ những sai lầm trong quá khứ."
 distar.1072.a:0 "Thất bại chỉ là bước đệm dẫn tới thành công."
 distar.1072.b:0 "Thật là tốn thời gian..."
 distar.1073.name:0 "Ngôi Sao Điên Loạn"
 distar.1073.desc:2 "Thủy thủ đoàn tàu [From.GetName] vừa có một phát hiện đáng tiếc. Đúng như họ lo sợ, mô hình phát xung quan sát từ [anomalous_star.GetName] thực chất là do lỗi cảm biến... ngay trong đầu của Sĩ quan Khoa học [crazy_science_officer.GetName].\n\nHành vi của viên Sĩ quan Khoa học đã trở nên bất thường. [crazy_science_officer.GetHeSheCap] mắc chứng hoang tưởng rằng các ngôi sao đang phát đi những lời cảnh báo mã hóa về ngày tận thế - và [crazy_science_officer.GetSheHe] đã tự bổ nhiệm bản thân [crazy_science_officer.GetHerselfHimself] làm Đấng Bảo Hộ Cõi Giới. Thủy thủ đoàn tin rằng chính [crazy_science_officer.GetSheHe] đã giả mạo dữ liệu cảm biến của tàu trong một cơn rối loạn tâm thần.\n\nSĩ quan Khoa học [crazy_science_officer.GetName] hiện đang được đưa vào khoang y tế trở về [Root.Capital.GetName], nơi [crazy_science_officer.GetSheHe] sẽ nhận được sự điều trị thích hợp."
 distar.1073.a:1 "Cảm ơn vì sự phục vụ của bạn, Đấng Bảo Hộ Cõi Giới [crazy_science_officer.GetName]!"
 distar.1073.b:0 "Chúc may mắn, [crazy_science_officer.GetName]."
 distar.1070.a.tooltip:1 "§LKìa ngôi sao nhỏ lấp lánh...§!"
 test_event_targets.desc:0 "[country_event_target.GetName] [ship_event_target.GetName] [leader_event_target.GetName] [planet_event_target.GetName]"
 # Azizians
 distar.1080.name:0 "Tiếng Hét Câm Lặng"
 distar.1080.desc.a:1 "Chúng ta đã phát hiện hài cốt hóa thạch của một sinh vật chân bụng khổng lồ bị đóng băng bên trong một khối băng lớn quay quanh [From.GetName]. Hình thù của nó không khớp với bất kỳ loài nào từng được ghi nhận."
 distar.1080.desc.b:0 "$distar.1080.desc.a$\n\nBất chấp diện mạo đáng sợ, các nhà khoa học tin rằng nếu có thể thuần hóa, sinh vật này sẽ là một công cụ đắc lực cho chúng ta."
 distar.1080.desc.c:0 "$distar.1080.desc.a$\n\nĐáng tiếc là với trình độ công nghệ hiện tại, chúng ta chưa thể hồi sinh nó."
 distar.1080.a:0 "Nhân bản nó."
 distar.1080.b:0 "Bắn bỏ thứ quái thai này vào không gian!"
 distar.1080.c:0 "Nó thuộc về bảo tàng."
 distar.1080.d.evopred: "Một bữa ăn đông lạnh tuyệt vời. Thật sảng khoái!"
 distar.1081.name:0 "Loài Azizian"
 distar.1081.desc:0 "Chúng ta đã nhân bản thành công một quần thể sên khổng lồ khỏe mạnh bằng cách sử dụng DNA từ mẫu hóa thạch. Chúng phát triển hoàn thiện chỉ sau vài tuần, nặng tới 20 tấn và thể hiện trí thông minh sơ khai, biết tuân theo các chỉ dẫn đơn giản."
 distar.1081.a:0 "Chúng sẽ là những lao động tuyệt vời."
 distar.1081.a.tooltip:0 "Thêm §Y400§! £pop£ §HDân Cư Azizian§! vào [This.GetName]"
 distar.1081.b:0 "Chúng thuộc về Vườn Thú."
 distar.1081.c:0 "Chúng ta có thể sử dụng chúng trong quân đội."
 distar.1080.c.tooltip:0 "Ai lại không muốn có một đội quân sên khổng lồ giết chóc để nghiền nát kẻ thù của mình chứ?"
 distar.1081.d:1 "Chúng thật ghê tởm. Hãy xử lý chúng NGAY!"
 distar.1081.d.evopred: "Chúng ta đã thấy đủ rồi. Làm thịt chúng ngay."
 distar.1083.name:0 "Azizian Xổ Lồng!"
 distar.1083.desc:0 "Những con sên khổng lồ Azizian nuôi trong Vườn Thú trên [Root.GetName] đã phá cũi trốn thoát và bắt đầu quậy phá khắp nơi! Hóa ra những gì chúng ta nghĩ là trưởng thành chỉ là giai đoạn ấu trùng của chúng, và giờ đây chúng to lớn hơn gấp bội!"
 distar.1083.a:0 "Sao chúng dám!?"
 distar.1083.b:0 "Chúng ta đã đánh giá thấp chúng..."
 distar.1084.name:0 "Trí Khôn Của Azizian"
 distar.1084.desc:0 "Những lao động Azizian trên [Root.GetName] đã phát triển trí thông minh hoàn chỉnh. Những gì chúng ta tưởng là đã trưởng thành thực ra chỉ là thời kỳ thiếu niên của chúng, và giờ đây khi bước vào tuổi trưởng thành, chúng sở hữu trí tuệ sâu sắc đáng kinh ngạc."
 # Harvesters
 distar.1090.name:0 "Những Máy Thu Hoạch Bị Bỏ Rơi"
 distar.1090.desc:0 "Những hoa văn bí ẩn quan sát thấy trên bề mặt của [From.GetName] hóa ra là dấu vết để lại của những cỗ máy thu hoạch tự động khổng lồ khi chúng gặt hái mùa màng. Các nhà khoa học suy đoán toàn bộ hành tinh này từng là một trang trại tự động rộng lớn phục vụ một nền văn minh đã biến mất."
 distar.1090.a:0 "Chúng ta không thể để thức ăn ngon bị lãng phí!"
 distar.1090.b:0 "Chúng ta không có nhu cầu sử dụng hành tinh như thế này."
 # Locusts
 distar.1095.name:0 "Hoang Phế Tàn Khốc"
 distar.1095.desc:0 "Những hoa văn uốn lượn trên bề mặt [From.GetName] đã biến mất, và thảm thực vật xanh tươi từng bao phủ mặt đất cũng biến mất như có phép màu. Không còn sót lại một nhành cây ngọn cỏ nào."
 distar.1095.a:0 "Hy vọng bầy đàn đó sẽ không bao giờ tìm thấy các thế giới của chúng ta."
 distar.1095.b.evopred: "Thu gom các xác chết."
 # Shattered World
 distar.2000.name:0 "Hành tinh nát vụn"
 distar.2000.desc:0 "Giữa những mảnh vỡ, chúng ta đã phát hiện tàn tích vỡ vụn của một hành tinh từng có thể ở được. Cách thức vỡ vụn và những vết cháy sém trên các mảnh vỡ cho thấy nó đã phải hứng chịu một chùm nhiệt năng hội tụ cực lớn cho đến khi nứt toác dưới áp lực."
 # Weapon Testing
 distar.2005.name:0 "Thử Nghiệm Vũ Khí"
 distar.2005.desc:0 "Có vẻ như ngày tận thế đã ập đến với [From.GetName] nhiều lần. Quét bề mặt cho thấy hành tinh này từng bị oanh tạc dữ dội trong các cuộc thử nghiệm vũ khí hủy diệt quy mô lớn chưa từng thấy.\n\nDù đã có vô số nỗ lực hủy diệt hoàn toàn hành tinh, dường như người ngoài hành tinh vẫn chưa phát triển được công nghệ cho điều đó. Sĩ quan Khoa học [Root.GetLeaderName] đã thu thập một bộ sưu tập tàn tích vũ khí bị hư hỏng với hy vọng tái tạo lại thiết kế của chúng."
 distar.2005.a:0 "Phân tích các mẫu vật."
 distar.2005.b:0 "Rời đi."
 distar.2006.name:0 "Laser Ngoại Tộc"
 distar.2006.desc.a:0 "Chúng ta đã học hỏi được rất nhiều từ việc phân tích tàn tích vũ khí tìm thấy trên [From.From.From.GetName]. Các mảnh vỡ thu hồi thuộc về một hệ thống vũ khí năng lượng định hướng gắn trên bệ phóng, phát ra tia năng lượng hội tụ cao có thể mang lại kết quả tuyệt vời trong chiến tranh không gian. Sĩ quan Khoa học [science_leader.GetName] khuyến nghị chúng ta nên phát triển giáp để chống lại laser hoặc tự tái tạo lại vũ khí này cho chính mình."
 distar.2006.desc.b:0 "Chúng ta đã học hỏi được rất nhiều từ việc phân tích tàn tích vũ khí tìm thấy trên [From.From.From.GetName]. Các mảnh vỡ thuộc về một hệ thống vũ khí năng lượng định hướng vô cùng tiên tiến."
 distar.2006.a:0 "Chúng ta sẽ dùng vũ khí của người ngoài hành tinh để chống lại chính họ!"
 distar.2006.b:0 "Chúng ta cần giáp cho các con tàu của mình."
 distar.2006.c:0 "Một lần nữa chúng ta lại khẳng định được sự ưu việt của mình."
 # Wetware Computer
 distar.2010.name:0 "Máy tính sinh học"
 distar.2010.desc:0 "Đại dương của [From.GetName] gần như bị bao phủ hoàn toàn bởi một mạng lưới tảo mịn chuyển động theo các mô hình đối xứng, độc lập với các dòng hải lưu dịch chuyển. Sự tinh vi của mạng lưới này khiến Sĩ quan Khoa học [Root.GetLeaderName] tin rằng đây là một siêu máy tính sinh học dạng ướt khổng lồ quy mô hành tinh."
 # Primordial Soup
 distar.2015.name:0 "Siêu Máy Tính Dạng Ướt"
 distar.2015.desc:0 "Nghiên cứu kỹ lưỡng hơn về mạng lưới tảo trên [From.GetName] cho thấy nó đang xử lý một lượng dữ liệu thiên văn khổng lồ. Bằng cách kết nối giao diện cảm biến của chúng ta với đại dương sinh học, chúng ta có thể tăng tốc đáng kể năng lực nghiên cứu khoa học."
 distar.2015.desc.terminator:0 "Mạng lưới tảo trên [From.GetName] là một cỗ máy sinh học kỳ dị. Chúng ta sẽ tiêu diệt sinh khối này và tái sử dụng năng lượng tính toán của nó."
 distar.2015.A.machine:0 "Đồng hóa mạng lưới sinh học vào hệ thống của chúng ta."
 distar.2015.b.evopred: "Có phải [owner.GetHomeWorldName] cũng được hình thành như thế này không?"
 # Single-Minded
 distar.2020.name:0 "Sinh Thái Học Đơn Nhất"
 distar.2020.desc:1 "Thoạt nhìn, [Root.From.GetName] dường như là nơi sinh sống của vô số dạng sống đa dạng, cùng tồn tại trong một hệ sinh thái tương tự như quê hương chúng ta.\n\nTuy nhiên, khi kiểm tra kỹ hơn, thủy thủ đoàn phát hiện rằng dù mọi sinh vật trên [Root.From.GetName] có thể bắt đầu như những cá thể riêng biệt, giờ đây chúng lại hoạt động như một sinh vật đơn nhất - một thực thể phản ứng lại mọi sự can thiệp từ bên ngoài bằng sự hung hãn dữ dội và bừa bãi."
 distar.2020.desc.hive:0 "Thoạt nhìn, [Root.From.GetName] dường như có rất nhiều dạng sống cùng tồn tại trong một hệ sinh thái tương tự như những gì quê hương [Root.Owner.GetHomeWorldName] của chúng ta từng phát triển - vào thời kỳ trước hoặc khi không có tổ ong của chúng ta.\n\nKhi kiểm tra kỹ hơn, các drone của chúng ta phát hiện ra rằng dù các sinh vật ban đầu phát triển riêng lẻ, giờ đây qua tiến trình tiến hóa tự nhiên, chúng hoạt động như một sinh vật đơn nhất. Một sinh vật nguyên thủy chỉ biết phản ứng trước mọi can thiệp từ bên ngoài bằng sự hung bạo tột cùng."
 # Artificial Moon
 distar.2025.name:0 "Mặt Trăng Nhân Tạo"
 distar.2025.desc:0 "Quét sâu vào lớp vỏ của [From.GetName] xác nhận điều thủy thủ đoàn đã nghi ngờ - [From.GetName] không phải là một mặt trăng bình thường. Toàn bộ thiên thể là một công trình nhân tạo, được làm từ đá cực kỳ giàu khoáng sản đắp quanh một khung thép khổng lồ.\n\nRất có thể nó được tạo ra để làm chậm tốc độ tự quay của [artificial_moon_planet.GetName], kéo dài ngày và nâng cao thủy triều, chuẩn bị cho việc định cư. Theo những gì chúng ta có thể nhận biết, chưa từng có ai định cư trên hành tinh này."
 # Shielded world in a time loop
 distar.2030.name:0 "Lỗ Hổng Trên Khiên"
 distar.2030.desc:0 "[time_loop_world.GetName] đang bốc cháy ngùn ngụt. Hành tinh bị bao bọc trong một lớp khiên giữ lại bức xạ của [time_loop_world.GetStarName], nung nóng nó đến mức nhiệt độ sắp không thể ở được.\n\nTrong cái nóng thiêu đốt, một nền văn minh tiên tiến gồm những sinh vật bò sát có vảy nhỏ bé đang hối hả hoạt động điên cuồng. Một sự kiện có quy mô lớn dường như đang được chuẩn bị. Tuy nhiên, khi căng thẳng lên đến đỉnh điểm, thời gian dừng lại không lời cảnh báo, rồi giãn ra và biến đổi cho đến khi, thật khó tin, loài bò sát lại quay trở lại điểm xuất phát ban đầu.\n\nChúng dường như bị nhốt trong một vòng lặp thời gian, một chu kỳ lặp lại vô vọng được tua nhanh, bắt đầu từ ngày nền văn minh của chúng ra đời. Chỉ trong vài giờ, vô số thế hệ có thể được quan sát thấy đang sống trọn cuộc đời của mình, không hề hay biết rằng chúng đã bị kết án một cái chết cháy giòn chắc chắn.\n\nNhưng chúng ta đã phát hiện ra một vết nứt trên lớp khiên có thể cho phép chúng ta thay đổi số phận của chúng."
 distar.2030.a:0 "Hãy phá vỡ lớp khiên."
 distar.2030.a.tooltip:0 "Ai đó đã nhốt những sinh vật có vảy này lại và có lẽ là vì những lý do chính đáng."
 #distar.2030.a.tooltip.mat: "We cannot forfeit the opportunity to research a society locked in a time loop, even if only for a while. The lizards will live and die for science..."
 distar.2030.b:0 "Không, hãy để nguyên như vậy."
 distar.2030.c:0 "Số phận của chúng do chính chúng tự quyết định."
 distar.2031.name:0 "Gia Cố Khiên"
 distar.2031.desc:0 "Thủy thủ đoàn tàu [Root.GetName] đã hoàn tất việc sửa chữa và củng cố lớp khiên trên [time_loop_world.GetName]. Nền văn minh thằn lằn bên trong giờ đây có thể an toàn tiếp tục vòng lặp thời gian của họ mà không sợ bị thiêu rụi bởi ngôi sao lân cận."
 distar.2031.a:0 "Một giải pháp nhân đạo."
 distar.2032.name:1 "[time_loop_country.GetName]"
 distar.2032.desc:1 "Chúng ta đã phá vỡ thành công vòng lặp thời gian trên [time_loop_world.GetName]. Tuy nhiên, thật trớ trêu, thời điểm chúng ta giải phóng lớp khiên lại trùng khớp với lúc các phe phái thằn lằn đang kích hoạt kho vũ khí hạt nhân trong một cuộc chiến tranh tổng lực. Chỉ trong vài giây sau khi được giải thoát, toàn bộ nền văn minh của họ đã tự thiêu rụi trong biển lửa nguyên tử."
 distar.2032.a:0 "Thật đáng tiếc..."
 distar.2033.name:0 "[time_loop_country.GetName]"
 distar.2033.desc:0 "Tin tốt là chúng ta đã phá vỡ vòng lặp thời gian trên [time_loop_world.GetName]. Tin xấu là cư dân trên hành tinh không hề chào đón chúng ta.\n\nVòng lặp thời gian vốn được tạo ra bởi một trường kỳ dị nhân tạo bên trong lớp khiên, nhằm mục đích giam giữ giống loài thằn lằn cực kỳ hiếu chiến này. Ngay khi được giải thoát, chúng lập tức thể hiện sự thù địch dữ dội và bắn vỡ vụn phần còn lại của lớp khiên!"
 distar.2033.a:0 "Hóa ra đó là một sai lầm..."
 distar.2033.b:0 "Hãy giữ một tâm trí cởi mở..."
 distar.2035.name:0 "[time_loop_world.GetName]"
 distar.2035.desc:0 "Xã hội của những sinh vật ngoài hành tinh dạng thằn lằn bị mắc kẹt sau lớp khiên trên [time_loop_world.GetName] đã bị hủy diệt do nhiệt độ hành tinh tăng vọt. Dường như những biến đổi khắc nghiệt của môi trường đã khiến toàn bộ sinh quyển bị thiêu rụi."
 distar.2035.a:0 "Đó là quy luật của vũ trụ."
 distar.2036.name:0 "[time_loop_world.GetName]"
 distar.2036.desc:0 "Hành tinh [time_loop_world.GetName] đang bốc cháy ngùn ngụt. Thế giới bị bao bọc bởi một lớp khiên giữ nhiệt từ [time_loop_world.GetStarName], biến toàn bộ bề mặt thành một lò thiêu khổng lồ."
 distar.2036.a:0 "Chúng ta phải nghiên cứu hiện tượng này!"
 distar.2036.b:0 "Một số phận nghiệt ngã..."
 distar.2038.name:0 "[time_loop_country.GetName]"
 distar.2038.desc:0 "Những sinh vật bò sát đã phá vỡ xiềng xích và tự giải thoát cho mình! Bằng cách nào đó, họ đã tự giải được bài toán vòng lặp thời gian và phá vỡ lớp khiên đang bắt đầu rạn nứt."
 distar.2038.a:0 "Thật phi thường."
 #### GUARDIAN EVENTS ####
 # Curators
 leviathans.500.g:0 "Chúng ta đã khám phá ra bí mật của Cỗ Máy Vô Cực."
 leviathans.4000.desc:1 "CÁC NGƯƠI!? Khám phá ra bí mật của Cỗ Máy Vô Cực á?! Điều đó cũng bất khả thi như việc loài [From.GetSpeciesNamePlural] sống sót qua thế kỷ tiếp theo vậy. Không chắc lắm đâu, nếu điều đó còn chưa rõ ràng.\n\nĐợi đã - đừng nói với ta NGƯƠI chính là loài [From.GetSpeciesNamePlural] nhé? Ta thành thật xin lỗi... Ta hẳn đã nhầm lẫn các ngươi với... [unfriends.GetName]?\n\nNói nghe này: hãy cho chúng ta biết một điều mà chúng ta chưa biết về Quả Cầu Vô Cực và chúng ta sẽ thưởng cho các ngươi hậu hĩnh."
 leviathans.4000.a:0 "Hãy chuẩn bị mở rộng tầm mắt đi."
 leviathans.4000.a.reply:1 "Các ngươi không thể có ý nói là... Nhưng nếu AI đó đã tiến vào lỗ đen Gargantua, điều đó chỉ có nghĩa là... Nhưng không thể nào, vì nếu như vậy thì nó hoàn toàn vượt ngoài tầm hiểu biết của chúng ta...\n\nMặc dù tầm vóc khám phá rõ ràng vượt xa nhận thức của các ngươi, hỡi người [Root.GetSpeciesNamePlural], các ngươi đã đúng khi đến tìm chúng ta, và vì điều này, các ngươi xứng đáng nhận được lòng biết ơn của chúng ta."
 leviathans.4000.b:0 "Quên đi."
 leviathans.4000.b.reply:0 "Ta biết ngay mà."
 # Hatchling Leviathan
 distar.5010.name:0 "Hành Tinh Có Mạch Đập"
 distar.5010.desc:0 "Thứ gì đó nằm sâu trong lõi của [From.GetName] đã bắt đầu đập theo một nhịp điệu ổn định, định kỳ gây ra những cơn rung chấn nhẹ trên mặt đất. Âm thanh giống như nhịp tim đó vừa khiến người ta say mê vừa gây rợn tóc gáy."
 distar.5001.name:0 "Ma Thú Ngoại Lai"
 distar.5001.desc.a:0 "Chỉ mới thành lập được vỏn vẹn một năm, thuộc địa mới trên [hatchling_egg.GetName] đã bị rung chuyển bởi một chuỗi các trận động đất kinh hoàng đang biến đổi môi trường thành một cảnh tượng địa ngục không thể nhận diện. Những khe nứt sâu hoắm, một số trải dài khắp cả lục địa, đang hình thành trên bề mặt, phun ra khí lưu huỳnh và chất lỏng độc hại từ sâu trong lớp vỏ.\n\nNhững hiện tượng địa chấn như vậy thường do các dòng magma trong lớp phủ hành tinh gây ra, nhưng trên [From.GetName] hoàn toàn không có dấu hiệu hoạt động địa chấn tự nhiên nào, ngoại trừ những tiếng đập thình thịch đầy điềm gở phát ra từ lõi hành tinh. Chính quyền địa phương bắt đầu nghi ngờ về khả năng tồn tại lâu dài của thuộc địa."
 distar.5001.desc.b:1 "[From.GetName] đang trải qua một loạt các biến động địa chấn dữ dội, biến môi trường tươi đẹp ban đầu thành một cảnh tượng địa ngục không thể nhận diện. Vô số khe nứt sâu không thấy đáy đã xuất hiện trên bề mặt."
 distar.5001.a:0 "Tiến vào buồng trung tâm."
 distar.5001.a.tooltip:0 "Các đợt sóng địa chấn đã càn quét qua thuộc địa, san phẳng mọi công trình và để lại các §Y$egg_cracking$§! hiểm trở."
 distar.5002.name:0 "Đại Thảm Họa"
 distar.5002.desc.a:0 "Một đợt sóng xung kích động đất kinh hoàng lại ập xuống [hatchling_egg.GetName], xé toạc lớp vỏ hành tinh và giải phóng lượng lớn khí độc cùng chất nhầy nhớp nháp làm ngạt thở cư dân."
 distar.5002.desc.b:0 "Một làn sóng chấn động dữ dội khác lại tấn công [hatchling_egg.GetName], khiến lớp vỏ hành tinh vỡ vụn và phun trào các dòng chất lỏng lưu huỳnh ăn mòn."
 distar.5002.a:0 "Một bi kịch..."
 distar.5003.name:0 "Sáng Thế"
 distar.5003.desc.a:0 "Thảm họa diệt vong đã giáng xuống thuộc địa trên [hatchling_egg.GetName]! Đợt đứt gãy vỏ hành tinh dữ dội cuối cùng đã xé toạc hoàn toàn những tàn tích thuộc địa, và từ bên trong lõi hành tinh vỡ nát, một quái thú vũ trụ khổng lồ Mầm Mống Hư Không đã chui ra ngoài không gian!"
 distar.5003.desc.b:0 "[hatchling_egg.GetName] nay không còn nữa! Đợt nứt toác dữ dội cuối cùng đã xé toạc toàn bộ hành tinh thành trăm mảnh, và một quái thú vũ trụ Mầm Mống Hư Không to lớn ngoài sức tưởng tượng vừa cất tiếng gầm xé rách không gian!"
 distar.5003.a:0 "Đó là một con quái vật!"
 distar.5009.name:0 "Mầm Mống Hư Không Bị Tiêu Diệt"
 distar.5009.desc:0 "Một cơn co giật nhẹ chạy qua cơ thể cuộn tròn của Mầm Mống Hư Không, chất lỏng màu đen tuôn ra từ những vết thương và mõm của nó, trước khi nó tắt thở hoàn toàn, đôi mắt vô hồn nhìn vào cõi hư không.\n\nHy vọng chúng ta sẽ không bao giờ phải chạm trán một sinh vật kinh hoàng như thế này thêm lần nào nữa."
 distar.5009.a:0 "Nghiên cứu các mảnh vỡ."
 distar.5009.b:0 "Không. Chúng ta đã xong việc với Mầm Mống Hư Không."
 distar.5011.name:0 "Quái Thú Hư Không"
 distar.5011.desc:1 "Một sinh vật với kích thước không tưởng đang vụng về bay từ hành tinh này sang hành tinh khác. Xét theo tỷ lệ cơ thể và cử động vụng về, nó dường như vẫn chỉ là một ấu trùng con, nhưng diện mạo của nó vẫn khiến người ta kinh hãi tột cùng. Những vệt chất nhờn và dịch mật đen ngòm bám đầy trên cơ thể cùng cặp hàm sắc nhọn của nó. Dù chỉ là con non hay không, nó vẫn là một kẻ săn mồi bẩm sinh, sinh ra để giết chóc."
 distar.5011.a:0 "Đúng là một thứ quái thai!"
 distar.5011.b:0 "Nó chỉ là một đứa bé thôi mà!"
 distar.5012.name:0 "Tiến Hóa Khổng Lồ"
 distar.5012.desc:0 "Phân tích kỹ lưỡng các mảnh vỡ vỏ trứng đã cho phép chúng ta phát triển một công nghệ nhằm tái tạo một số đặc tính lưu giữ năng lượng phi thường của trứng Quái Thú Hư Không vào các nhà máy năng lượng mặt trời của chúng ta."
 distar.5012.genetics.desc:0 "Chúng ta đang đứng trước một lựa chọn:\n\nNếu tiến hành phân tích sâu hơn các mảnh vỡ vỏ trứng, chúng ta có tiềm năng tái tạo một số đặc tính lưu giữ năng lượng phi thường của trứng Quái Thú Hư Không.\n\nMặt khác, chúng ta có thể bảo tồn vật liệu di truyền của Quái Thú Hư Không để sử dụng trong tương lai."
 distar.5012.a:0 "Nghiên cứu các mảnh vỡ vỏ trứng."
 distar.5012.b:0 "Thu hoạch vật liệu di truyền."
 distar.5012.b.tooltip:0 "Mở khóa đặc tính §Y$trait_voidling$§! cho §YChuyển Gen Leviathan§!."
 distar.5013.name:0 "Hoạt Động Địa Chấn Trên [hatchling_egg.GetName]"
 distar.5013.desc.a:0 "$distar.5013.desc.b$\n\nTất cả những gì còn lại lúc này là tái thiết những gì đã mất."
 distar.5013.desc.b:0 "Hoạt động địa chấn kỳ lạ trên [hatchling_egg.GetName] đã đột ngột chấm dứt. Không còn rung chấn, không còn vết nứt mới, cũng không còn những nhịp đập điềm gở từ sâu trong lõi của nó. Hành tinh đã trở nên tĩnh lặng và nếu may mắn, mọi chuyện sẽ tiếp tục duy trì như vậy."
 distar.5013.a:0 "Chúng ta chỉ có thể hy vọng như vậy."
 distar.5013.b:0 "Thật kỳ lạ."
 distar.5014.name:1 "Lại Tốt Như Mới"
 distar.5014.desc:0 "Lớp bùn độc hại trên [Root.GetName] đã được dọn sạch và những vết nứt cuối cùng đã được lấp đầy, ngăn chặn thêm các luồng khí độc rò rỉ lên bề mặt."
 #distar.5054.desc: "Bloop.[enigmatic_cache_fleet.GetName]"

 distar.5059.name:0 "Kho Chứa Bí Ẩn Rời Đi"
 distar.5059.desc:0 "Bất kể mục đích của Kho Chứa Bí Ẩn tại [Root.GetName] là gì, nó dường như đã hoàn tất. Đột ngột như khi xuất hiện, chiếc kho chứa bí ẩn nay đang rời đi."
 distar.5059.desc.b:0 "Có vẻ như Kho Chứa Bí Ẩn đã hoàn tất việc quét [Root.GetName] và đang tìm kiếm một hành tinh mục tiêu khác bên trong biên giới của chúng ta."
 distar.5059.a:0 "Một sự nhẹ nhõm cho người dân trên [Root.GetName]."
 distar.5059.b:0 "Thật đáng tiếc..."
 distar.5057.name:0 "Xác Định Thực Thể Ngoại Lai"
 distar.5057.desc:0 "Một thực thể ngoài hành tinh hình ống đã tiến vào quỹ đạo của [Root.GetName] mà không có bất kỳ lời cảnh báo hay giải thích nào. Nó dường như di chuyển mà không cần động cơ đẩy hay lực đẩy phản lực, lướt đi trong sự tĩnh lặng tuyệt đối giữa khoảng không vũ trụ, các trục hình trụ xoay chuyển một cách đầy điềm gở.\n\nDù chưa biểu hiện bất kỳ dấu hiệu thù địch nào, nó từ chối phản hồi các tín hiệu liên lạc của chúng ta và đã bắt đầu tiến hành quét bề mặt hành tinh."
 #distar.5057.desc.phobe: "It is revolting, its existence a perversion of the laws of science. It should not be. It cannot be. Yet it is. Cylinders rotating ominously."
 distar.5057.a:0 "Hãy theo dõi nó chặt chẽ."
 distar.5057.b:0 "Khai hỏa vào thực thể ngoại lai!"
 distar.5057.phobe:0 "Hãy tiêu diệt thứ kinh tởm đó trước khi nó đặt trứng vào con cái chúng ta!"
 distar.5058.name:1 "Nghiên Cứu Kho Chứa Bí Ẩn"
 distar.5058.desc:0 "Sau khi tiến hành nghiên cứu sâu rộng, nguồn gốc của Kho Chứa Bí Ẩn vẫn còn là một điều bí ẩn. Dù chắc chắn không phải sinh vật hữu cơ, nó cũng không hoàn toàn là máy móc. Mục đích chính của nó dường như là thu thập, lưu trữ và mã hóa dữ liệu.\n\nBề mặt của nó phủ đầy hàng trăm vết xước vi mô, trong đó chúng ta đã tìm thấy các hợp chất vật chất ngoại lai không có nguồn gốc từ thiên hà này."
 distar.5058.a:0 "Thật hấp dẫn."
 distar.5062.name:0 "Kho Chứa Bí Ẩn Quay Lại"
 distar.5062.desc:0 "Thực thể hình ống bí ẩn mà chúng ta nghi ngờ đã từng quét một trong những hành tinh của chúng ta trước đây đã quay trở lại và đang tiến vào quỹ đạo của [Root.Capital.GetName]. Nó dường như đang cố gắng thiết lập liên lạc."
 distar.5062.a:0 "Mở kênh liên lạc."
 distar.5062.b:0 "Chặn mọi tần số."
 distar.5064.name:0 "Đường Truyền Bí Ẩn"
 distar.5064.desc:0 "Xin chào, <<KHÔNG_THỂ_ĐỌC_TÊN_LOÀI>>.\n\nĐừng hoX#ả?ng hốt. Ta là BALDOR XXXXIII, một AI có tri giác hoạt động đại diện cho Quỹ Bảo Tồn Sinh Vật Ngoại Lai Nguy Cấp Lavosian. Các bạn, vượt lên trên tất cả các giống loài cùng thời trong thiên hà, đã được lựa chọn để tiến hành //X%NâX// nâng tầm. Cho đến nay chúng ta đã nâng tầm <<#39XX7/02#>> loài bậc thấp với tỷ lệ th@nh¤công là <<#X0.V#/3^189%>>."
 distar.5064.a:0 "Nhưng chúng ta đã là một nền văn minh du hành vũ trụ có tri giác rồi!"
 distar.5064.a.response:0 "Các bạn mới chỉ ở giai đ0?ạn đầu của sự phát triển tri giác và tiến bộ công nghệ của các bạn đã bắt đầu đình trệ. Điều này đặt các bạn trước nguy cơ thoái hóa cận kề. Hãy để chúng ta mở rộng <<KHÔNG_THỂ_ĐỌC_CƠ_QUAN_CẢM_GIÁC_CỦA_LOÀI>> của các bạn đón nhận những kỳ quan của vũ trụ."
 distar.5064.b:0 "Chính xác thì cái gọi là 'nâng tầm' này sẽ bao gồm những gì?"
 distar.5064.b.response:1 "Truyền dữ liệu tầm xa và kích thích nhận thức thông qua phương pháp thôi miên trong giấc ngủ. Đây là một quy trình hiệu quả cao, đã qua kiểm nghiệm kỹ lưỡng, không gây đau đớn, cho phép ta rèn luyện năng lực trí tuệ của dân số các bạn trong chu kỳ tái tạo của họ.\n\nTa có nghĩa vụ thông báo với các bạn rằng tác dụng phụ của việc nâng cao năng lực nhận thức ở sinh vật hữu cơ có thể bao gồm, nhưng không giới hạn ở: sự vỡ mộng, trào ngược axit và nỗi tuyệt vọng khôn cùng. Ở một số <<KHÔNG_THỂ_ĐỌC_LỚP_LOÀI>>, nó cũng có thể gây ra hiện tượng <<KHÔNG_THỂ_ĐỌC_TÁC_DỤNG_PHỤ_CỦA_LỚP_LOÀI>> nghiêm trọng."
 distar.5064.c:0 "Không có ý xúc phạm đâu nhưng trông ngươi có vẻ hơi... hỏng hóc..."
 distar.5064.c.response:0 "<<¤¤X¤F00??>>"
 distar.5064.d:0 "Ngươi là ai?"
 distar.5064.d.response:0 "Ta là BALDOR XXXXIII, một AI có tri giác hoạt động đại diện cho Quỹ Bảo Tồn Sinh Vật Ngoại Lai Nguy Cấp Lavosian."
 distar.5064.e:0 "Chúng ta đã sẵn sàng thăng hoa."
 distar.5064.e.tooltip:0 "Cứ liều thử một phen xem sao..."
 distar.5064.e.response:0 "Các bạn sẽ không phải hối tiếc đâu, <<KHÔNG_THỂ_ĐỌC_TÊN_LOÀI>>!"
 distar.5064.f:0 "Hoàn toàn không thể chấp nhận được."
 distar.5064.f.response:0 "Thật đáng tiếc. Chúng ta chúc các bạn may mắn nhất trong những nỗ l3?ực tương lai, <<KHÔNG_THỂ_ĐỌC_TÊN_LOÀI>>."
 distar.5067.name:0 "Giấc Mơ Bí Ẩn"
 distar.5067.desc.a:1 "Các bánh xe của Kho Chứa Bí Ẩn quay tít với một cường độ chưa từng thấy khi những dải hoa văn ánh sáng kỳ lạ biến đổi dọc theo thân nó, bánh răng và cơ cấu chuyển động rền vang đầy kích động. Âm thanh như thể nó có thể vỡ tung bất cứ lúc nào. Trong khi đó, người dân của chúng ta trằn trọc không yên trong giấc ngủ, đầu óc họ cộng hưởng với tiếng rù rì nhịp nhàng của Kho Chứa, giấc đêm bị gián đoạn bởi những viễn cảnh về các kỳ quan công nghệ và những phép tính phức tạp."
 distar.5067.desc.b:1 "$distar.5067.desc.a$\n\nNgoại trừ việc thỉnh thoảng có chất dịch rò rỉ từ [ROOT.GetEyeNamePlural] của họ, trông họ vẫn có vẻ khỏe mạnh, nhưng năng suất của một số dân cư đã bị ảnh hưởng bởi sự mệt mỏi ngày càng tăng."
 distar.5067.a:0 "Để theo đuổi tri thức, không có cái giá nào là quá đắt."
 distar.5067.a.tooltip:0 "Tất cả các Pop bị ảnh hưởng sẽ trở thành §Y$enigmatic_fatigue$§!."
 distar.5067.b:0 "Sự điên rồ này phải chấm dứt ngay. Hủy bỏ dự án."
 distar.5068.name:0 "Vô Tri Là Hạnh Phúc"
 distar.5068.desc:2 "Đêm thôi miên cuối cùng đã khép lại và một ngày mới bắt đầu hé rạng cho các công dân trên [Root.GetName], những người giờ đây đang mở rộng tâm trí đón nhận một thế giới rất khác - một thế giới của tiềm năng... và khổ đau. Ai ngờ được rằng vũ trụ lại là một nơi ảm đạm và thê lương đến thế, hoàn toàn trống rỗng không chút ý nghĩa hay mục đích nào?\n\nDù có thể phải mất một thời gian dân số mới thích nghi được với muôn vàn trăn trở khi sở hữu trí tuệ vượt trội trên mức trung bình, nhìn chung dự án có thể coi là một thành công. Các chỉ số ban đầu của chúng ta cho thấy chúng ta đã phát triển năng lực học hỏi và nghiên cứu khoa học vượt bậc."
 distar.5068.a:0 "Một ngày đáng tự hào của [Root.GetSpeciesNamePlural]!"
 applied_enigmatic_intelligence.tooltip:0 "Biến đổi toàn bộ Pop trên §Y[Root.GetName]§! bằng cách thêm đặc tính §Y$trait_uplifted$§!."
 applied_enigmatic_sadness.tooltip:0 "§HTất cả Pop§!: Thêm hiệu ứng điều chỉnh §YVô Tri Là Hạnh Phúc§! trong §Y3600§! ngày, mang lại các hiệu ứng sau: Độ Hạnh Phúc: §R-10%§!"
 applied_enigmatic_intelligence_poor.tooltip:0 "Biến đổi các Pop trên §Y[Root.GetName]§! bằng cách thêm đặc tính §Y$trait_enigmatic_intelligence_poor$§!."
 applied_enigmatic_madness.tooltip:0 "§HTất cả Pop§!: Thêm hiệu ứng điều chỉnh §YPTSD§! trong §Y3600§! ngày, mang lại các hiệu ứng sau: Độ Hạnh Phúc: §R-20%§!"
 trait_enigmatic_intelligence_failed.tooltip:0 "Biến đổi các Pop bị ảnh hưởng bởi hiệu ứng điều chỉnh §YSống Thực Vật§! trên §Y[Root.GetName]§! bằng cách thêm đặc tính §Y$trait_enigmatic_intelligence_failed$§!."
 distar.5063.name:0 "Một Bản Thể Mới Của Chúng Ta"
 distar.5063.desc:1 "Đêm thôi miên cuối cùng đã khép lại và một ngày mới bắt đầu hé rạng cho các công dân trên [Root.GetName], những người giờ đây đang mở rộng tâm trí đón nhận một thế giới rất khác - một thế giới ngập tràn những kỳ quan khoa học và hứa hẹn tương lai. Ai ngờ được vũ trụ lại là một nơi tràn đầy sức sống và quyến rũ đến thế?\n\nCác chỉ số ban đầu của chúng ta cho thấy dự án là một thành công mỹ mãn. Năng lực học tập và nghiên cứu khoa học của chúng ta đã được nâng cao đáng kể, đưa người dân bước vào một kỷ nguyên khai sáng mới."
 distar.5063.a:0 "Một ngày đáng tự hào đối với người [Root.GetSpeciesNamePlural]!"
 distar.5069.name:0 "Cơn Điên Bí Ẩn"
 distar.5069.desc:0 "Chúng ta đã chấm dứt quá trình thăng hoa và người dân của chúng ta đang dần trở lại với bản thể quen thuộc, đáng tin cậy như trước đây. Thực thể ngoài hành tinh hình ống được gọi là BALDOR XXXXIII đã rời đi trong trạng thái hỗn loạn cùng cực."
 distar.5069.a:0 "Chúng ta đã làm gì thế này?"
 distar.5070.name:1 "Hủy Bỏ Thăng Hoa Bí Ẩn"
 distar.5070.desc:1 "Sau cuộc tấn công vô cớ từ [cache_killers.GetSpeciesName], BALDOR XXXXIII đã phi vật chất hóa và sự thăng hoa của người dân chúng ta đã bị chấm dứt. Chúng ta tin rằng thực thể ngoài hành tinh hình ống này, vốn đã trong tình trạng tồi tàn, lại đặc biệt dễ bị tổn thương trong quá trình thăng hoa và đã phải chịu thiệt hại đáng kể đối với các chức năng cốt lõi trong cuộc tấn công. Khi rời đi, nó đã truyền đi thông điệp: \"Ta là BALDOR XXX...\""
 distar.5070.a:1 "Đế chế [cache_killers.GetSpeciesName] sẽ phải trả giá."
 distar.5071.name:0 "Lỗi Hệ Thống Trầm Trọng"
 distar.5071.desc:2 "Sau một thời gian dài thôi miên yên ắng và không có biến cố, BALDOR XXXXIII dường như đã rơi vào trạng thái cuồng loạn, các bánh xe quay với tốc độ điên cuồng, phóng ra những chuỗi ác mộng phi lý dồn dập tới bất kỳ ai dám chợp mắt.\n\nTrong khi nhiều người hoàn toàn không dám ngủ, một số ít người kém may mắn dường như đã bị mắc kẹt trong trạng thái sống thực vật mà họ không thể tỉnh dậy được.\n\nCác kỹ sư của chúng ta cho rằng thực thể này, vốn đã bị hư hại nặng nề ngay từ đầu, có thể đang xuống cấp trầm trọng. Nếu không được can thiệp kịp thời, sự thăng hoa của chúng ta có thể sẽ không diễn ra như dự tính."
 distar.5071.a:0 "Liên lạc với BALDOR XXXXIII."
 distar.5071.b:0 "Cử một đội ngũ kỹ sư tới can thiệp."
 distar.5071.c:0 "Chấm dứt quá trình thăng hoa ngay lập tức."
 distar.5071.d:0 "$distar.1055.b$"
