# ANOMALY CATEGORIES:
 debris_gasgiant_category_temp:0 "Xác Tàu Cổ Đại"
 debris_gasgiant_category_temp_desc:0 "Một xác tàu đắm khổng lồ mang thiết kế cổ xưa đang quay quanh [From.GetName]."
 star_lifting_category:0 "Bệ Phóng Sao Hoang Phế"
 star_lifting_category_desc:0 "Một bệ phóng bị lỗi mang thiết kế ngoại tộc đang trôi dạt vô định quanh một ngôi sao. Nghiên cứu kỹ hơn có thể tiết lộ mục đích của nó."
 abandoned_outpost_category:0 "Trạm Quan Sát Bỏ Hoang"
 abandoned_outpost_category_desc:0 "Một trạm quan sát cũ kỹ tơi tả quay quanh [big_rip_planet.GetName] nhưng không có dấu hiệu nào của sự sống thông minh trên bề mặt của nó. Điều tra kỹ hơn có thể cho chúng ta câu trả lời tại sao."
 ast_debris_field_1_cat_2:0 "$AST_DEBRIS_FIELD_1_CAT$"
 gaia_planet_cat:0 "Hoạt Động Ngoại Tộc"
 gaia_planet_cat_desc:0 "Cảm biến của chúng ta ghi nhận những đợt phát xạ năng lượng cho thấy có dấu hiệu hoạt động của người ngoài hành tinh trên [Root.GetName]."
 corrupt_data_cat:0 "Dữ Liệu Khảo Sát Bị Hỏng"
 corrupt_data_cat_desc:0 "Thứ gì đó trong hệ sao [From.System.GetName] đang làm hỏng dữ liệu cảm biến của chúng ta. Nguồn gốc của sự bất thường này dường như xuất phát từ [From.GetName]."
 irregular_energy_cat:0 "Phát Xạ Năng Lượng Bất Thường"
 irregular_energy_cat_desc:0 "Cảm biến của chúng ta chỉ ra những điểm bất thường kỳ lạ trong mô hình phát xạ năng lượng của [From.GetName]."
 peculiar_patterns_cat:0 "Hoa Văn Kỳ Lạ"
 peculiar_patterns_cat_desc:0 "Những hoa văn kỳ lạ, có thể nhìn thấy rõ ràng ngay cả từ ngoài không gian, đang hình thành trên bề mặt của [Root.GetName]."
 tomb_world_cat:0 "Thế giới Mộ địa"
 tomb_world_cat_desc:0 "Các chỉ số bất thường cho thấy thế giới hoang tàn này có thể ẩn chứa nhiều điều hơn những gì thể hiện bên ngoài."
 alien_life_cat:0 "Sự Sống Ngoại Tộc"
 alien_life_cat_desc:0 "Các chỉ số cảm biến ban đầu từ [From.GetName] cho thấy nó có thể hỗ trợ sự sống ngoài hành tinh."
 moon_cat:0 "Mặt Trăng Bất Thường"
 moon_cat_desc:0 "Có điều gì đó không bình thường về mặt trăng này."
 time_loop_world:0 "Hành tinh có lá chắn"
 time_loop_world_desc:0 "Vì những lý do chưa rõ, [Root.GetName] đã bị phong ấn bên trong một lớp khiên bất khả xâm phạm, và lớp khiên này hiện đang bắt đầu rạn nứt."

