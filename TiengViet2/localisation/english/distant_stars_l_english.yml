 amoeba_speed_boost:0 "Áp Dụng Tốc Độ Trùng Biến Hình"
 building_blocks:0 "Cái Nôi Của Sự Sống"
 building_blocks_desc:0 "Hành tinh này chứa đầy các loại khí và phân tử được cho là bao gồm các thành phần và điều kiện quan trọng cho các dạng sống dựa trên carbon và amoniac. Mặc dù không có sinh vật sống thực tế nào được tìm thấy trên bề mặt của nó, đây có thể là một cái nôi hoàn hảo cho sự xuất hiện dần dần của sự sống sinh học."

