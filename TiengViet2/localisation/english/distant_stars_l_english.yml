 SPORE_LAUNCHER:0 "$STRANGE_COMPONENTS_DESC$"
 SPORE_ARTILLERY:0 "$STRANGE_COMPONENTS_DESC$"

# EVENTS

 distar.9000.lcluster_clue_desc_1:1 "Các nhà khoa học của chúng ta đã phân tích cẩn thận các dữ liệu vi mô thu được."

 distar.9000.lcluster_clue_desc_2:1 "Trong số các vật phẩm thu hồi được từ tàn tích trên [big_rip_planet.GetName] có một hình chiếu ba chiều bị trục trặc từ một xã hội từng can thiệp vào các [GetPreFTLLowerPlural] dạng thực vật. Mặc dù hầu hết dữ liệu đã bị hư hỏng hoặc không thể hiểu được do tiếng rít không ngừng và trạng thái hoảng loạn của người gửi, chúng ta đã xoay xở khôi phục được một số mảnh vỡ chứa thông tin có giá trị về mạng lưới Cổng Siêu Không Gian.\n\nTuy nhiên, phần lớn hình chiếu ba chiều dành cho những điềm báo kinh hoàng về Bão Xám và cái chết rùng rợn sẽ nối gót theo sau nó."

 distar.9000.lcluster_clue_desc_3:0 "Một mảnh ghép khác của câu đố Cụm Sao L đã được lắp vào vị trí."

# Invisible Death
 distar.2040.name:0 "Các Phòng Thí Nghiệm Xvan"
 distar.2040.desc:0 "Con tàu vũ trang được phát hiện trên quỹ đạo của [From.GetName] là một tàu vũ trụ quân sự bị bỏ hoang mang tên Nefri's Pride. Khung thân nhẹ và phần cứng né tránh của nó cho thấy nó được chế tạo cho các nhiệm vụ tuần tra tầm xa, nhưng sau đó đã được trang bị lại thành một máy bay ném bom tàng hình tầm xa.\n\nCác hồ sơ liên lạc của tàu tiết lộ nó đã bị một lực lượng du kích nổi dậy cướp khi đang trên đường thực hiện cuộc tấn công nhằm vào một khu phức hợp bí mật mang tên Các phòng thí nghiệm Xvan, nơi được cho là nắm giữ thứ vũ khí mạnh đến mức có thể giúp họ chiến thắng cuộc chiến, khi họ bị bắn hạ. Chúng ta đã trích xuất được điểm đến của con tàu từ ổ đĩa định vị của nó."
 distar.2040.a:0 "Hãy cẩn thận thu hồi các mẫu vật nghiên cứu."
 distar.2040.b:0 "Chúng ta không có nhu cầu về một loại vũ khí như vậy."
 distar.2041.name:0 "Cái Chết Vô Hình"
 distar.2041.desc:0 "Các nhà khoa học của chúng ta đã trở về từ các phòng thí nghiệm Xvan an toàn với đoạn phim thu được từ các camera an ninh của cơ sở. Đoạn phim cho thấy các nhà khoa học của phòng thí nghiệm bị trói và bịt miệng khi các binh lính du kích cạy mở chiếc hộp sắt chứa vũ khí. Nhưng trước sự thất vọng của họ, chiếc hộp trống rỗng.\n\nChỉ vài phút sau, người ta thấy quân nổi loạn quằn quại trên sàn nhà trong nỗi đau đớn tột cùng, những mảng tối sưng tấy khắp cơ thể họ, sau đó da của họ rách toạc ra và một chất xám không thể nhận dạng tràn ra.\n\nChất này tiếp tục nở to, xoáy tròn đầy thôi miên quanh họ, cho đến khi một trong các nhà khoa học kích hoạt hệ thống khẩn cấp. Các vòi phun dập tắt căn phòng trong chất lỏng và một xung điện chạy qua đó hành quyết tất cả các sinh vật sống. Tại đây đoạn phim kết thúc. Thủy thủ đoàn của chúng ta có thể xác nhận rằng chiếc hộp sắt thực sự trống rỗng."
 distar.2041.a:0 "Thật rùng rợn."
 distar.2041.a.tooltip:0 "Chuyến thám hiểm vào các phòng thí nghiệm Xvan đã thúc đẩy nghiên cứu kỹ thuật của chúng ta."

 # GATE HIJACKERS
 distar.2045.name:0 "Những Kẻ Cướp Cổng Siêu Không Gian"
 distar.2045.desc:0 "Tín hiệu bắt nguồn từ một tập hợp các tàu quân sự bị phá hủy trên quỹ đạo quanh [From.GetName]. Có vẻ như một thế lực ngoài hành tinh đi trước nền văn minh của chúng ta hàng ngàn năm, được gọi là Đế chế Sujin, đã cố gắng cướp mạng lưới cổng bằng cách sử dụng một loại chùm tia gây nhiễu nào đó, khi họ bị gián đoạn một cách thô bạo. Mặc dù chùm tia vẫn hoạt động và được hiệu chỉnh trên mạng lưới bảo mật của cổng, nó đã bị hư hại trong cuộc tấn công. Có lẽ các nhà khoa học của chúng ta có thể sửa chữa nó."
 distar.2045.a:0 "Điều đó chắc chắn rất đáng để thử."
 distar.2045.b:0 "Rời đi."
 distar.2046.name:0 "Hiểu Biết Sâu Sắc Về Sujin"
 distar.2046.desc:0 "Mặc dù các nhà khoa học của chúng ta không thể xuyên thủng hệ thống an ninh của cổng, chúng ta đã thu được một số hiểu biết rất có giá trị về cách thức mạng lưới hoạt động. Đế chế Sujin đã bị ám ảnh bởi các cánh cổng trong nhiều thế kỷ, và đã thu thập tất cả dữ liệu họ có thể tìm thấy trong nỗ lực đột phá."
 distar.2046.a:0 "Không tệ, xét về mọi mặt."

 # Vechtar Zavonia
 distar.1016.name:0 "Thiên Đường Đã Mất"
 distar.1016.desc:0 "Người Vol không đánh cược với an ninh quốc gia. Sau khi giải phóng toàn bộ kho vũ khí hạt nhân của họ xuống Paridayda, biến quê hương từng tươi tốt của người Mardak Vol thành tro tàn, họ đã dội thuốc diệt nấm lên đống đổ nát rực lửa, hòa tan những tàn tích cuối cùng của người Mardak Vol thành một bãi bùn độc hại. Dù nguy hiểm hay không, những sinh vật nấm ký sinh không còn tồn tại nữa."
 distar.1016.a:0 "Sao họ dám làm vậy!?"

 # The other side - a nation is attempting to get access to the gateways. An anomaly on a planet in a gateway system. They were preparing to launch an attack through the gateway, and had been attempting to reopen the network.

 # Azizians
 distar.1080.d:0 "Trích xuất và lưu trữ mẫu DNA để sử dụng trong tương lai."
 distar.1085.name:0 "Sinh Vật Ngoài Hành Tinh Trong Băng"
 distar.1085.desc:0 "Sau bước đột phá gần đây của chúng ta trong lĩnh vực nhân bản vô tính, các nhà khoa học của chúng ta đã mang DNA của sinh vật ngoài hành tinh được cho là đã tuyệt chủng, được tìm thấy bên trong một tảng băng, ra khỏi nơi lưu trữ. Hồi sinh sinh vật bí ẩn này từng là giấc mơ lâu dài của bộ phận nghiên cứu, nay đã trở thành hiện thực nhờ điều kỳ diệu của khoa học."
 distar.1085.a:0 "Cho phép họ tiến hành."
 distar.1085.b:0 "Họ sẽ không được làm điều như vậy."

 DISTAR_NANOCITY_CAT:0 "Cấu Trúc Tinh Thể Kim Loại"
 DISTAR_NANOCITY_CAT_DESC:0 "Cảnh quan địa chất của [From.GetName] bị chi phối bởi thứ nhìn từ quỹ đạo giống như những tinh thể kim loại màu bạc với kích thước chưa từng thấy trước đây. Từ quỹ đạo, chúng trông giống như những tòa nhà chọc trời một cách kỳ lạ. Cần phải nghiên cứu kỹ hơn."
 DISTAR_NANOSAND_CAT:0 "Cát Kim Loại"
 DISTAR_NANOSAND_CAT_DESC:0 "Máy quét chỉ ra rằng các cồn cát trên [From.GetName] hầu như hoàn toàn bao gồm các hạt kim loại hiếm. Có lẽ một số tài nguyên quý giá có thể được trích xuất từ chúng."
 DISTAR_MEDGAS_CAT:0 "Lõi Đặc"
 DISTAR_MEDGAS_CAT_DESC:0 "Bất chấp những dự đoán dự kiến, [From.GetName] có một lõi rắn đặc biệt lớn bên dưới lớp phủ khí quyển vô cùng dày đặc gồm các loại khí độc đáo. Các nhà khoa học của chúng ta khuyên nên điều tra sâu hơn."
 KETLING_PROJECT_6:0 "Nghiên Cứu $NAME_Ketlings$ Trên §Y[ratling_planet_6.GetName]§!"
 KETLING_PROJECT_6_DESC:1 "Các sinh vật có tri giác đã xuất hiện từ những đống phế liệu trên §Y[ratling_planet_6.GetName]§!. Các nhà khoa học của chúng ta rất tò mò liệu những sinh vật ngoài hành tinh này, được mệnh danh là $NAME_Ketlings$, là hậu duệ của nền văn minh du hành vũ trụ từng bao trùm các hệ sao này, hay họ có một nguồn gốc hoàn toàn khác.\n\nChúng ta có thể chọn bất kỳ hành tinh nào có $NAME_Ketlings$ tự trị sinh sống để tiến hành nghiên cứu này."

 distar.242.desc.jump:0 "Tàu [Root.GetName] đã chạm trán một sinh vật khổng lồ bằng năng lượng thuần khiết trong Hệ sao [From.GetName]! Là một cơn lốc thực sự của các lực lượng tâm linh, thực thể này chỉ nên được tiếp cận với sự thận trọng tối đa.\n\nKỳ lạ thay, bản thân hệ sao [From.GetName] dường như hoàn toàn không có bất kỳ kết nối nào với mạng lưới tuyến siêu không gian dưới không gian. Liệu sự hiện diện của thực thể này đã cắt đứt các kết nối siêu không gian của hệ sao, hay những dao động dưới không gian bất ngờ đã bẫy nó ở đây thì vẫn chưa rõ.\n\nTuy nhiên, có một điều được biết: chúng ta đang bắt được một tín hiệu lặp đi lặp lại trong hệ sao này, bắt nguồn từ [tanker_planet.GetName] - mặc dù chúng ta có thể cần phải đối phó với thực thể trước khi có thể tiếp cận nó."
 distar.275.name:0 "Mạng Tinh Thể Nano"
 distar.275.desc.comms:1 "Phân tích chi tiết về các tinh thể kim loại khổng lồ thống trị cảnh quan của [From.GetName] đã vượt qua mọi kỳ vọng. Sĩ quan Khoa học [Root.GetLeaderName] rất hào hứng tiết lộ rằng những tinh thể quá khổ này trên thực tế được cấu thành từ hàng nghìn tỷ cỗ máy nano đã bị vô hiệu hóa!\n\nCấu trúc phân tử của chúng không khớp với bất kỳ dấu hiệu công nghệ nano nào của các đế chế đã biết, khiến điểm xuất phát của chúng không thể xác định được. Chúng có thể đã được những người du hành vũ trụ chưa rõ danh tính thả xuống hành tinh vì một mục đích không rõ ràng.\n\nTheo như [Root.GetLeaderName] có thể nhận định, các cỗ máy nano đã tự biên dịch thành các mạng tinh thể có định hướng hoàn hảo và nhân bản cho đến thời điểm chúng bị vô hiệu hóa. Mặc dù các tinh thể mà chúng tạo ra trên thực tế giống như các tòa nhà, nhưng chúng hoàn toàn đồng nhất về thành phần và không thể phục vụ bất kỳ mục đích nào như vậy."
 distar.275.desc.nocomms:1 "Phân tích chi tiết về các tinh thể kim loại khổng lồ thống trị cảnh quan của [From.GetName] đã vượt qua mọi kỳ vọng. Sĩ quan Khoa học [Root.GetLeaderName] rất hào hứng tiết lộ rằng những tinh thể quá khổ này trên thực tế được cấu thành từ hàng nghìn tỷ cỗ máy nano đã bị vô hiệu hóa!\n\nKhông có bằng chứng nào cho thấy [From.GetName] từng có một bầu khí quyển đủ dày để hỗ trợ sự sống như chúng ta biết tại bất kỳ thời điểm nào trong quá khứ. Các cỗ máy nano có thể đã được những người du hành vũ trụ chưa rõ danh tính thả xuống hành tinh vì một mục đích không rõ ràng.\n\nTheo như [Root.GetLeaderName] có thể nhận định, các cỗ máy nano đã tự biên dịch thành các mạng tinh thể có định hướng hoàn hảo và nhân bản cho đến thời điểm chúng bị vô hiệu hóa. Mặc dù các tinh thể mà chúng tạo ra trên thực tế giống như các tòa nhà, nhưng chúng hoàn toàn đồng nhất về thành phần và không thể phục vụ bất kỳ mục đích nào như vậy."
 distar.280.name:0 "Cát Nano"
 distar.280.desc:0 "Tàu [Root.GetName] đã báo cáo một phát hiện bất ngờ trên bề mặt của [From.GetName]. Không chỉ các cồn cát phong phú trên hành tinh được cấu thành từ các hạt kim loại hiếm: bản thân cát gần như hoàn toàn bao gồm vô số các cỗ máy nano bị hỏng hóc!\n\nNhững cỗ máy vi mô này đã hàng triệu năm tuổi, cấu trúc của chúng bị suy thoái vượt xa bất kỳ cơ hội nào để kích hoạt lại. Mặc dù chúng ta không thể xác định nguồn gốc của những cỗ máy nano này, nhưng xã hội tạo ra chúng chắc chắn phải có nền công nghệ rất tiên tiến.\n\n[Owner.GetScientistCapital] [Root.GetName] phỏng đoán rằng các cỗ máy nano có thể đã được sử dụng để cải tạo bề mặt [From.GetName], hàng triệu năm trước."
 distar.285.name:0 "Khu Phức Hợp Y Tế Cổ Đại"
 distar.285.desc:0 "Tin tức đáng kinh ngạc từ tàu [Root.GetName]: các bản quét sâu đã tiết lộ lõi rắn lớn bất ngờ của [From.GetName] được bao phủ bởi tàn tích bị nén của một khu phức hợp y tế trải rộng, hàng triệu năm tuổi!\n\nMặc dù áp suất lớp phủ dữ dội của hành tinh khí khổng lồ hạn chế nghiêm trọng lượng dữ liệu chúng ta có thể trích xuất từ bề mặt của lõi, [Owner.GetScientistCapital] [Root.GetLeaderName] báo cáo rằng các cấu trúc ẩn giấu này khớp, không còn nghi ngờ gì nữa, với công nghệ được sử dụng trong các §HCổng L§! bí ẩn.\n\nCó thể [From.GetName] là một cơ sở y tế cấp hành tinh được những Người Xây Cổng tạo ra hàng thiên niên kỷ trước. Tại một thời điểm nào đó, khu phức hợp đã bị bỏ hoang, và các máy nhân bản khí tự động của nó đã chạy không kiểm soát trong vô số thế kỷ, dần biến hành tinh này thành một hành tinh khí khổng lồ."

 distar.9000.lcluster_clue_sonic:0 "Một bước đột phá nào đó đã đạt được trong cộng đồng khoa học [Root.GetSpeciesAdj] liên quan đến tín hiệu âm thanh hóa ngoài thiên hà mà một trong những Tàu Khoa Học của chúng ta gần đây đã phân tích.\n\nMặc dù toàn bộ ý nghĩa của phương trình âm thanh hóa được nhúng trong tín hiệu vẫn còn lẩn tránh chúng ta, các [Root.GetScientistPlural] [Root.GetSpeciesAdj] trên thế giới quê hương của chúng ta đã có thể đối chiếu đủ dữ liệu của tín hiệu truyền về sóng hài dưới không gian với công nghệ được quan sát thấy trong các §HCổng L§! bí ẩn!\n\nĐược kiểm tra riêng lẻ, tín hiệu này hầu như không có ích gì thêm cho chúng ta. Tuy nhiên, việc phân tích nó cùng với những hiểu biết sâu sắc khác về những Người Xây Cổng Cổ Đại có thể mang lại dữ liệu có giá trị về cách các Cổng L này có thể được kích hoạt lại."

#In events_l_english.yml
 living_sea_poi:2 "Kiểm soát hệ sao §Y[living_planet_tar.GetStarName]§!"
 living_sea_poi_desc:2 "Để tiếp tục nghiên cứu của chúng ta về vùng biển sống bao phủ §Y[living_planet_tar.GetName]§!, hành tinh này phải nằm trong biên giới của chúng ta."
