 l_cluster_chain_title:1 "Cụm Sao L"
 l_cluster_chain_desc:0 "Chúng ta đã biết về một cụm sao bí ẩn ở đâu đó ngay ngoài rìa thiên hà của chúng ta. Nó chỉ có thể tiếp cận được thông qua §HCổng L§!, các cổng nhân tạo dưới không gian được tìm thấy trong một số hệ sao nhất định.\n\nNhững Cổng này đã bị ai đó cố tình vô hiệu hóa, và hiện tại chúng ta thiếu hiểu biết cần thiết về cơ học dưới không gian chi phối việc sử dụng chúng để dỡ bỏ lệnh phong tỏa."
