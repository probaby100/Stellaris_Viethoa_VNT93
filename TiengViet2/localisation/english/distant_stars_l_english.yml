 mineral_mapping:0 "Bản Đồ Khoáng Sản"
 mineral_mapping_desc:0 "Một hệ thống cho phép chúng ta nhanh chóng lập biểu đồ địa hình dưới lòng đất và lập bản đồ chính xác các mạch khoáng sản."
 disregard_for_alien_life:0 "Coi Thường Sự Sống Ngoại Lai"
 disregard_for_alien_life_desc:0 "Hành động theo cách không phù hợp với một người yêu chuộng ngoại lai, không tôn trọng sự sống ngoài hành tinh và tính đa dạng sinh học của thiên hà."

 ####################################
 # Anomaly Categories
 ####################################
 # FROM = planet scope
 # ROOT = ship scope

 ### Trojan Asteroid ###
 disco_trojan_asteroid_cat:0 "Nội Tạng Chưa Rõ"
 disco_trojan_asteroid_cat_desc:0 "Các lần quét ban đầu của tiểu hành tinh [From.GetName] cho thấy một khối lượng kim loại gia công đậm đặc bên trong nó, có lẽ là một phần của cỗ máy hoặc công nghệ nào đó. Cần quét thêm để có dữ liệu chi tiết hơn."

 ### Impossible Organism ###
 disco_impossible_organism_cat:0 "Sinh Vật Bất Khả Thi"
 disco_impossible_organism_cat_desc:0 "Các dấu hiệu sự sống bất ngờ đã được phát hiện trong cuộc khảo sát hành tinh độc hại [From.GetName]. Tuy nhỏ bé, nhưng vô cùng ý nghĩa."

 ### Stranded Scientist ###
 disco_stranded_scientist_cat:0 "Tàn Tích Tàu Vũ Trụ"
 disco_stranded_scientist_cat_desc:0 "Các mảnh vụn kim loại nằm rải rác trên bề mặt của [From.GetName], bao quanh thứ trông giống như xác của một con tàu. Đống đổ nát dường như hoang vắng, nhưng các chỉ số năng lượng vẫn còn tồn tại."

 ### Molluscoid Miners ###
 disco_molluscoid_miners_cat:0 "Cư Dân Tiềm Năng"
 disco_molluscoid_miners_cat_desc:0 "Các lần quét quang học đối với hành tinh [From.GetName] đã phát hiện những cấu trúc dạng túp lều nhỏ nằm rải rác trên các phần bề mặt của nó, cho thấy nơi đây có người sinh sống."

 ### Alien Machine ###
 disco_alien_machine_cat:0 "Cỗ Máy Ngoại Lai"
 disco_alien_machine_cat_desc:0 "Trên bề mặt của [From.GetName] có thứ dường như là một cỗ máy lớn, không rõ nguồn gốc và mục đích."

 ### Orbital Speed Demon ###
 disco_speed_demon_cat:0 "Ác Quỷ Tốc Độ Quỹ Đạo"
 disco_speed_demon_cat_desc:0 "Bị cuốn vào quỹ đạo quanh [From.GetName] là một vật thể nhỏ, chưa rõ danh tính đang di chuyển với tốc độ cao đến khó tin."

 ### Breathing Rift ###
 disco_breathing_rift_cat:0 "Hiện Tượng Ánh Sáng"
 disco_breathing_rift_cat_desc:0 "Một hiện tượng chưa rõ đã được phát hiện gần [From.GetName]. Nó đang khiến ánh sáng bị khúc xạ thường xuyên và đôi khi thậm chí bị chặn hoàn toàn."

