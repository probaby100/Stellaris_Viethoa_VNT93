l_english:

 DISTANT_STARS_TITLE: "Gói Nội Dung Distant Stars" # Do not translate
 DLC_DISTANT_STARS_RECOMMENDATION_DESC:1 "§SDistant Stars§! là gói nội dung cốt truyện làm sống động thiên hà bằng những câu chuyện về các cuộc chạm trán và sinh vật kỳ lạ, tại những chiều sâu chưa từng được khám phá của không gian."
 DLC_DISTANT_STARS_RECOMMENDATION_SCIENCE_REC:1 "Chúng tôi khuyên dùng §SDistant Stars§! vì một số tùy biến bạn chọn phù hợp với nội dung của nó, xoay quanh việc khám phá không gian và thực hiện các khám phá khoa học mới."

 AIANOM_LUMP_CAT:0 "Rác vũ trụ"
 AIANOM_LUMP_CAT_desc:0 "Cảm biến ghi nhận các thực thể có tiềm năng đáng chú ý trên quỹ đạo của [Root.GetName]."
 AIANOM_MININGDEPO_CAT:0 "Tín Hiệu Bề Mặt"
 AIANOM_MININGDEPO_CAT_desc:0 "Cảm biến ghi nhận các phát hiện tiềm năng trên bề mặt của [Root.GetName]."
 AIANOM_RESEARCHDEPO_CAT:0 "$AIANOM_MININGDEPO_CAT$"
 AIANOM_RESEARCHDEPO_CAT_desc:0 "$AIANOM_MININGDEPO_CAT_desc$"
 AIANOM_CLUE_CAT:0 "$clue$"
 AIANOM_CLUE_CAT_desc:0 "$l_cluster_chain_desc$"

 aianom.minerallump.name:0 "Kho tích trữ Khoáng sản"
 aianom.minerallump.desc:0 "Tàu [Root.GetName] đã phát hiện một kho khoáng sản."
 aianom.energylump.name:0 "Năng Lượng Tín Dụng"
 aianom.energylump.desc:0 "Tàu [Root.GetName] đã phát hiện một kho tín dụng năng lượng."
 aianom.physicslump.name:0 "Nghiên Cứu Vật Lý"
 aianom.physicslump.desc:0 "Tàu [Root.GetName] đã phát hiện một kho dữ liệu nghiên cứu vật lý."
 aianom.societylump.name:0 "Nghiên Cứu Xã Hội"
 aianom.societylump.desc:0 "Tàu [Root.GetName] đã phát hiện một kho dữ liệu nghiên cứu xã hội."
 aianom.engineeringlump.name:0 "Nghiên Cứu Kỹ Thuật"
 aianom.engineeringlump.desc:0 "Tàu [Root.GetName] đã phát hiện một kho dữ liệu nghiên cứu kỹ thuật."
 aianom.mineraldepo.name:0 "Mỏ quặng"
 aianom.mineraldepo.desc:0 "Tàu [Root.GetName] đã phát hiện một trữ lượng khoáng sản trên [From.GetName]."
 aianom.energydepo.name:0 "Trữ Lượng Năng Lượng"
 aianom.energydepo.desc:0 "Tàu [Root.GetName] báo cáo đã tìm thấy một cấu trúc tinh thể quy mô hành tinh trên [From.GetName], mang điện tích tự nhiên và liên tục tái tạo năng lượng."
 aianom.physicsdepo.name:0 "Điểm Nghiên Cứu Vật Lý"
 aianom.physicsdepo.desc:0 "Tàu [Root.GetName] đã phát hiện một địa điểm nghiên cứu vật lý trên [From.GetName]."
 aianom.societydepo.name:0 "Điểm Nghiên Cứu Xã Hội"
 aianom.societydepo.desc:0 "Tàu [Root.GetName] đã phát hiện một địa điểm nghiên cứu xã hội trên [From.GetName]."
 aianom.engineeringdepo.name:0 "Điểm Nghiên Cứu Kỹ Thuật"
 aianom.engineeringdepo.desc:0 "Tàu [Root.GetName] đã phát hiện một địa điểm nghiên cứu kỹ thuật trên [From.GetName]."

 pc_time_loop_world_desc:0 "Toàn bộ thế giới này được bao bọc trong một loại trường năng lượng bất khả xâm phạm."

 ####################################
 # Anomaly Categories
 ####################################
 # FROM = planet scope
 # ROOT = ship scope

 DISTAR_WRECK_CAT:0 "Xác Tàu Tiếp Tế"
 DISTAR_WRECK_CAT_DESC:0 "Cảm biến báo cáo đã phát hiện một xác tàu đắm không rõ nguồn gốc trôi dạt trên quỹ đạo của [Root.GetName]."
 DISTAR_FLARE_CAT:0 "Dấu Vết Văn Minh"
 DISTAR_FLARE_CAT_DESC:0 "Mặc dù hành tinh [From.GetName] thiếu khí quyển, trên bề mặt vẫn có bằng chứng về các công trình nhân tạo, cho thấy trước đây từng có người sinh sống."
 DISTAR_RAINBOW_CAT:0 "Cầu vồng trong bóng tối"
 DISTAR_RAINBOW_CAT_DESC:0 "Đĩa bồi tụ xung quanh [From.GetName] thể hiện quang phổ khúc xạ tuyệt đẹp, không khác gì cầu vồng. Điều gì có thể gây ra hiện tượng này?"
 DISTAR_HOLO_CAT:0 "Tín Hiệu Hạm Đội"
 DISTAR_HOLO_CAT_DESC:0 "Các chỉ số cho thấy sự hiện diện của một hạm đội lạ trên quỹ đạo [From.GetName]. Dù đã phát tín hiệu chào hỏi, chúng ta vẫn không nhận được phản hồi."
 DISTAR_ROBO_CAT:0 "Cấu Trúc Đối Xứng"
 DISTAR_ROBO_CAT_DESC:0 "Máy quét phát hiện mức độ đối xứng cao bất thường trên bề mặt [From.GetName]."
 DISTAR_NANO_CAT:0 "Chất Xám"
 DISTAR_NANO_CAT_DESC:0 "Thiên thể [From.GetName] dường như bị bao phủ bởi một loại chất màu xám sở hữu những đặc tính kỳ lạ và thành phần kim loại biến đổi phức tạp."
 DISTAR_FLOW_CAT:0 "Chỉ Số Nặng Nề"
 DISTAR_FLOW_CAT_DESC:0 "Các chỉ số trọng lực bất thường bao quanh [From.GetName]."
 DISTAR_LOST_CAT:0 "Chuyển Động Trong Mây"
 DISTAR_LOST_CAT_DESC:0 "Có chuyển động ở tầng thượng quyển của [From.GetName], dường như một con tàu đang di chuyển với tốc độ cao giữa các tầng mây dày đặc."
 DISTAR_TIME_CAT:0 "Mảnh Vỡ Phi Thuyền"
 DISTAR_TIME_CAT_DESC:0 "Có những mảnh vỡ của một con tàu vô danh nằm trên quỹ đạo cận kề của [From.GetName]."
 DISTAR_CLONE_CAT:0 "Bồn Chứa Mờ Đục"
 DISTAR_CLONE_CAT_DESC:0 "Hình ảnh sơ bộ về Thế Giới Vành Đai hoang phế [From.GetName] cho thấy nhiều bồn chứa nguyên vẹn trên một số phân khu đổ nát. Những gì chứa bên trong vẫn còn là một ẩn số."
 DISTAR_GEODE_CAT:0 "Trái Tim Ẩn Giấu"
 DISTAR_GEODE_CAT_DESC:0 "Hình ảnh cộng hưởng của tiểu hành tinh [From.GetName] cho thấy bên trong có chứa các tinh thể hiếm."
 DISTAR_DEAD_GOD_CAT:0 "Kẻ Khổng Lồ Câm Lặng"
 DISTAR_DEAD_GOD_CAT_DESC:0 "[From.GetName] có hình thù phi cầu rõ rệt, sở hữu các cấu trúc địa chất khổng lồ hoàn toàn lệch chuẩn."
 DISTAR_ELECTRO_CAT:0 "Mạng Lưới Phát Sáng"
 DISTAR_ELECTRO_CAT_DESC:0 "Những mạng lưới phát sáng không rõ nguồn gốc định kỳ thắp sáng bề mặt của [From.GetName]."
 DISTAR_RUM_CAT:0 "Hợp Chất Quen Thuộc"
 DISTAR_RUM_CAT_DESC:0 "Quang phổ phát xạ của [From.GetName] cho thấy hành tinh khí khổng lồ này chứa một lượng lớn các hợp chất có cấu trúc phân tử giống hệt một loại đồ uống phổ biến."
 DISTAR_SOOTHE_CAT:0 "Tinh Thể Cộng Hưởng"
 DISTAR_SOOTHE_CAT_DESC:0 "Quét [From.GetName] phát hiện lớp vỏ lục địa chứa đầy tinh thể cộng hưởng có thể khai thác sử dụng."
 DISTAR_SOOTHE_GC_CAT:0 "Lực Hút Kỳ Lạ"
 DISTAR_SOOTHE_GC_CAT_DESC:0 "Từ quyển của [From.GetName] tạo ra sức hút khó hiểu đối với các drone nghiên cứu của chúng ta. Chúng ta nên tiến hành điều tra kỹ hơn."
 DISTAR_EXO_CAT:0 "Thảm Thực Vật Kỳ Dị"
 DISTAR_EXO_CAT_DESC:0 "Toàn bộ các lục địa trên [From.GetName] được bao phủ bởi một thảm thực vật kỳ lạ, không hề giống với bất kỳ thứ gì khác trên hành tinh."
 DISTAR_ICE_CAT:0 "Chỉ Số Mâu Thuẫn"
 DISTAR_ICE_CAT_DESC:0 "Nhiệt độ bề mặt đo được của [From.GetName] lên tới hàng trăm độ, dù thiên thể này dường như là một khối băng vĩnh cửu. Nguyên nhân gây ra sự mâu thuẫn này là gì?"
 DISTAR_METAL_CAT:0 "Mây Mù Bất Khả Xuyên Thấu"
 DISTAR_METAL_CAT_DESC:0 "Khí quyển của [From.GetName] phản xạ mọi tín hiệu vô tuyến từ các cảm biến của chúng ta. Dưới lớp mây đó, có thứ gì đó đang gây nhiễu liên tục."
 DISTAR_OCEAN_CAT:0 "Đường Hầm Sâu Thẳm"
 DISTAR_OCEAN_CAT_DESC:0 "Quét bề mặt cho thấy một hệ thống đường hầm chằng chịt ẩn dưới đại dương của [From.GetName]. Ai đã đào nên chúng?"
 DISTAR_COLLAPSE_CAT:0 "Trạm Không Gian Đổ Nát"
 DISTAR_COLLAPSE_CAT_DESC:0 "Mang trên mình những vết sẹo từ nhiều thế kỷ va chạm mảnh vỡ, một trạm vũ trụ đổ nát vẫn trôi dạt vô định quanh [From.GetName]. Trạng thái hoang tàn của nó cho thấy con tàu có thể sắp rã vụn bất cứ lúc nào."
 DISTAR_FOES_CAT:0 "Bản Sao Trùng Hợp"
 DISTAR_FOES_CAT_DESC:0 "Các sinh vật nguyên thủy đang chật vật sinh tồn trên những đồng bằng tro bụi của [From.GetName] có sự tương đồng đáng kinh ngạc với một loài mà chúng ta từng gặp ở một thế giới chết chóc khác trong cùng hệ sao."
 DISTAR_DIAMOND_CAT:0 "Xung Động Nặng Nề"
 DISTAR_DIAMOND_CAT_DESC:0 "[From.GetName] phát xung đều đặn, biểu hiện địa chấn học thiên thể cho thấy mật độ bên trong đặc hơn rất nhiều so với dự kiến. Cấu tạo của nó là gì?"
 DISTAR_MOLTEN_CAT:0 "Miệng Phun Núi Lửa"
 DISTAR_MOLTEN_CAT_DESC:0 "Một chuỗi khí gas đáng chú ý đang phun ra từ các miệng phun trên [From.GetName], điều này rất hiếm gặp ở các hành tinh nóng chảy và có giá trị công nghiệp cao."
 DISTAR_MERCURY_CAT:0 "Hang Động Sâu Thẳm"
 DISTAR_MERCURY_CAT_DESC:0 "Hình ảnh quét lòng đất của [From.GetName] cho thấy các hang động ngầm khổng lồ, xứng đáng để chúng ta điều tra kỹ lưỡng."
 DISTAR_WARFORM_CAT:0 "Cấu Trúc Bí Ẩn"
 DISTAR_WARFORM_CAT_DESC:0 "Một dạng cấu trúc nhân tạo nào đó nhô lên giữa những đám mây độc hại trên bề mặt [From.GetName]."
 DISTAR_BRAINSLUG_CAT:0 "Khu Định Cư Bị Bỏ Rơi"
 DISTAR_BRAINSLUG_CAT_DESC:0 "Quét [From.GetName] phát hiện các dấu tích có vẻ là khu định cư bị bỏ hoang của cư dân bản địa. Chuyện gì đã xảy ra với những người xây dựng nên chúng?"
 DISTAR_THIRSTY_CAT:0 "Hẻm Núi Khô Cằn"
 DISTAR_THIRSTY_CAT_DESC:0 "Những hẻm núi sâu đến mức có thể nhìn thấy từ quỹ đạo rạch ngang bề mặt [From.GetName], nhưng hành tinh này lại khô cằn như bụi cát. Liệu nước từng chảy qua đây?"
 DISTAR_FLYTRAP_CAT:0 "Đại Thực Vật"
 DISTAR_FLYTRAP_CAT_DESC:0 "Đời sống thực vật với tỷ lệ khổng lồ thống trị cảnh quan trên [From.GetName]. To lớn và rực rỡ sắc màu, chúng thu hút sự quan tâm tột độ của các nhà sinh vật học ngoài hành tinh."
 DISTAR_LIVING_CAT:0 "Biển Cả Ám Ảnh"
 DISTAR_LIVING_CAT_DESC:0 "Có điều gì đó bất thường, gần như thôi miên trong những đợt sóng nhấp nhô êm dịu trên đại dương của [From.GetName]. Các chuyển động này không tuân theo bất kỳ mô hình thủy triều nào mà chúng ta từng biết."
 DISTAR_ZONE_CAT:0 "Phế Tích Cô Độc"
 DISTAR_ZONE_CAT_DESC:0 "Cảm biến chỉ ra một chấm nhỏ cấu trúc nhân tạo cô lập trên bề mặt [From.GetName]."
 DISTAR_RAT_CAT:0 "Thủ Đô Hoang Tàn"
 DISTAR_RAT_CAT_DESC:0 "Khảo sát ban đầu trên [From.GetName] cho thấy hành tinh này từng là thủ đô của đế chế đã tuyệt diệt mà chúng ta từng gặp bãi phế liệu của họ trước đây. Các cuộc điều tra trên mặt đất có thể mang lại những phát hiện thú vị."
 DISTAR_MED_CAT:0 "Tàu Chở Dầu Bí Ẩn"
 DISTAR_MED_CAT_DESC:0 "Một tàu chở dầu vô chủ không rõ nguồn gốc đang bay quanh [From.GetName], bên trong chứa đầy một loại vật chất hữu cơ bí ẩn."
 DISTAR_POD_CAT:0 "Khoang Đổ Bộ Vô Danh"
 DISTAR_POD_CAT_DESC:0 "Ban đầu tưởng là các tiểu hành tinh, nhưng thực chất là một vành đai các khoang đổ bộ bất động trôi nổi trên quỹ đạo của [From.GetName]."
 DISTAR_PHASE_CAT:0 "Hành Tinh Biến Pha"
 DISTAR_PHASE_CAT_DESC:0 "Các chỉ số năng lượng bí ẩn bao quanh [From.GetName], như thể toàn bộ hành tinh đang chập chờn dịch chuyển giữa các chiều không gian."
 DISTAR_SOY_CAT:0 "Phế Tích Rậm Rạp"
 DISTAR_SOY_CAT_DESC:0 "Cảm biến cho thấy có các cấu trúc nhân tạo bị chôn vùi dưới thảm thực vật dày đặc trên [From.GetName]."
 DISTAR_SIGNAL_CAT:0 "Hiện Tượng Nhiễu"
 DISTAR_SIGNAL_CAT_DESC:1 "Cảm biến tàu đang bắt được một mô hình nhiễu sóng chưa rõ nguyên nhân trong hệ sao [From.GetStarName]."
 DISTAR_PUZZLE_CAT:1 "Vật Thể Kháng Quét"
 DISTAR_PUZZLE_CAT_DESC:1 "Một vật thể làm chệch hướng cảm biến của chúng ta đã được phát hiện trong vành đai tiểu hành tinh của [From.GetStarName], gần [From.GetName]."

 ####################################
 # Anomaly Events
 ####################################

 distar.1.name:0 "Xác Định Danh Tính Xác Tàu"
 distar.1.desc:0 "Thủy thủ đoàn trên tàu [Root.GetName] báo cáo rằng xác tàu trên [From.GetName] có vẻ là nạn nhân của một cơn bão từ trường sao dữ dội ngoài dự tính."
 distar.1.desc.contact: "$distar.1.desc$ - tuy nhiên, thuyền trưởng tàu [Root.GetName] cảnh báo rằng cấu trúc tàu mang thiết kế của §Y[wreckage_owner.GetAdj]§!.\n\nRất có khả năng số khoáng sản này thuộc về §Y[wreckage_owner.GetName]§!, và họ có thể sẽ không hài lòng nếu chúng ta chiếm đoạt lô hàng của họ."
 distar.1.desc.nocontact: "$distar.1.desc$."
 distar.1.a:0 "Chúng ta cần số khoáng sản đó."
 distar.1.a.tooltip:0 "Điều này sẽ làm phật lòng §Y[wreckage_owner.GetName]§!."
 distar.1.b:0 "Chúng ta sẽ không mạo hiểm gây xích mích."
 distar.1.b.tooltip:0 "Trả lại khoáng sản cho §Y[wreckage_owner.GetName]§!.\nĐiều này sẽ khiến họ rất hài lòng và mang lại cho chúng ta £influence£ §G20§! Độ Ảnh Hưởng."
 distar.2.name:0 "Hàng Hóa Trên Xác Tàu Tiếp Tế"
 distar.2.desc:0 "[Root.GetSpeciesNamePlural]. Chúng tôi được biết một tàu tiếp tế §Y[wreckage_owner.GetAdj]§! bị mất tích đã chịu thiệt hại chí mạng trên đường đến §Y[wreckage_owner.Capital.GetName]§! và trôi dạt vào không gian [Root.GetAdj], nơi hàng hóa của nó lập tức bị các bạn lấy trộm không kiêng nể.\n\nCác bạn thực sự nghĩ rằng hành vi xâm phạm này sẽ không bị phát hiện sao? §Y[wreckage_owner.GetName]§! yêu cầu bồi hoàn ngay lập tức số hàng tiếp tế của chúng tôi."
 distar.2.desc.machi:0 "[Root.GetSpeciesNamePlural]. Chúng tôi phát hiện một tàu tiếp tế §Y[wreckage_owner.GetAdj]§! mất tích đã chịu hư hại chí mạng trên đường tới §Y[wreckage_owner.Capital.GetName]§!. Cảm biến của chúng tôi báo cáo con tàu đã tiến vào hệ sao [From.From.GetName], nơi giống loài của các bạn đã dỡ sạch hàng hóa để phục vụ mục đích riêng.\n\nKhông thể chấp nhận được. Hãy trao trả hàng hóa của chúng tôi ngay lập tức, [Root.GetSpeciesNamePlural]."
 distar.2.a:0 "Tàu tiếp tế nào? Làm gì có tàu nào?"
 distar.2.b:0 "Chúng tôi sẽ trả lại hàng tiếp tế cho các bạn."
 distar.3.name:0 "Đã Trao Trả Hàng Hóa"
 distar.3.desc:0 "[Root.GetSpeciesNamePlural]! Chúng tôi đã nhận được tin về hàng hóa trên con tàu tiếp tế bị rơi. Chúng tôi muốn gửi lời cảm ơn các bạn vì đã dành thời gian thu hồi nó mà không cần đến sự can thiệp của [wreckage_owner.GetAdj]."
 distar.3.a:0 "Rất hân hạnh, [wreckage_owner.GetSpeciesNamePlural]."

 distar.6.name:0 "Đóng Băng Theo Thời Gian"
 distar.6.desc:0 "Thủy thủ đoàn tàu [Root.GetName] rất ngạc nhiên khi phát hiện tàn tích của một nền văn minh thời kỳ công nghiệp trên [From.GetName]. Nghiên cứu chỉ ra [From.GetName] từng duy trì bầu khí quyển suốt hàng triệu năm, cho đến khi các siêu bão lửa khổng lồ từ bề mặt bất ổn của ngôi sao [From.GetStarName] dẫn đến tình trạng ion hóa mất kiểm soát và làm cạn kiệt khí quyển hành tinh.\n\nKhi không còn khí quyển, các thành phố không sự sống trên [From.GetName] đã bị đóng băng trong thời gian suốt hàng thiên niên kỷ, như những tượng đài câm lặng tưởng niệm vụ đại tuyệt chủng từng diễn ra tại đây.\n\nSĩ quan Khoa học [Root.GetLeaderName] cảnh báo rằng bất kỳ thuộc địa nào trong hệ sao [From.GetStarName] đều có thể phải hứng chịu những cơn thịnh nộ thất thường từ ngôi sao này."
 distar.7.name:0 "Siêu Bão Lửa"
 distar.7.desc:0 "Cảm biến trên [Root.GetName] chỉ ra rằng [Root.GetStarName] đang biểu hiện sự hỗn loạn bề mặt điển hình báo trước một siêu bão lửa. Nhìn vào số phận của nền văn minh cổ đại trên [frozen_in_time_planet.GetName], các [Root.Owner.GetScientistPlural] của chúng ta đang gấp rút thiết kế một ma trận khiên có khả năng chống chọi đợt phóng plasma khổng lồ sắp ập đến."
 distar.7.desc.nocol:0 "Cảm biến đã ghi nhận sự gia tăng đột biến về độ sáng của [Root.GetStarName]. Có vẻ như ngôi sao này sắp giải phóng một siêu bão lửa, tương tự như hiện tượng từng hủy diệt sự sống trên [frozen_in_time_planet.GetName] hàng thế kỷ trước.\n\nMay mắn thay, các nhà khoa học của [Root.GetAdj] tin rằng hệ sao này vẫn có thể được khai thác an toàn mà không cần dựng lá chắn tốn kém, miễn là chúng ta chuẩn bị trước cho các trạm khai thác vũ trụ."
 distar.7.a:0 "Chúng ta phải bảo vệ người dân của mình!"
 distar.7.b:0 "Đã rõ."
 distar.9.name:0 "Lá Chắn Siêu Bão Lửa Thành Công"
 distar.9.desc:0 "Chính quyền hành tinh vui mừng báo cáo rằng lưới lá chắn chống siêu bão lửa được triển khai quanh [Root.GetName] đã hoạt động hoàn hảo. Cư dân không chỉ an toàn trước các luồng bức xạ nguy hiểm mà các trạm sạc còn tích lũy được một lượng lớn năng lượng dồi dào."
 distar.10.name:1 "Siêu Bão Lửa Tấn Công [fromfromfrom.GetName]"
 distar.10.desc:1 "Một siêu bão lửa từ [fromfromfrom.GetStarName] đã quét qua thượng tầng khí quyển của [fromfromfrom.GetName], gây thiệt hại nặng nề cho các cơ sở hạ tầng bề mặt."

 distar.15.name:0 "Quang Phổ Năng Lượng"
 distar.15.desc:0 "Thành phần khí gas trong đĩa bồi tụ bao quanh [From.GetName] dường như là nguyên nhân gây ra quang sai quanh lỗ đen. Đĩa bồi tụ khúc xạ và phản xạ ánh sáng trên bề mặt, tạo ra hiệu ứng thị giác rực rỡ đầy mê hoặc."

 distar.20.name:0 "Ảnh Toàn Phần"
 distar.20.desc:0 "Cuộc điều tra về các tín hiệu hạm đội chưa xác định trong hệ sao [From.GetName] đã mang lại kết quả bất ngờ. Hạm đội này thực tế không hề neo đậu ở vùng an toàn của lỗ đen. Sĩ quan Khoa học [Root.GetLeaderName] đã phát hiện đây chỉ là hình ảnh toàn phần lập thể được chiếu từ một máy phát cổ xưa trôi dạt gần đó."

 distar.25.name:0 "Robot Thô Sơ"
 distar.25.desc:0 "Khi nghiên cứu bề mặt của [From.GetName], thủy thủ đoàn tàu [Root.GetName] đã phát hiện tàn tích của một nền văn minh du hành vũ trụ sơ khai. Dù nền văn minh đó đã sụp đổ từ lâu, hàng loạt robot tự hành thô sơ vẫn tiếp tục lặp lại các công việc bảo trì hàng ngày không ngừng nghỉ."
 distar.25.a.tooltip:0 "Đã phát hiện §G300§! £pop£ §HDân Cư Máy Móc§! trên [From.GetName]."
 distar.25.b.tooltip:0 "Đã phát hiện §G400§! £pop£ §HDân Cư Máy Móc§! trên [From.GetName]."
 distar.26.name:0 "Robot Thô Sơ"
 distar.26.desc:0 "Các cư dân khai hoang trên [Root.GetName] sẽ phải quyết định cách xử lý những cỗ máy cổ xưa trên bề mặt, vốn vẫn hoạt động theo quán tính kể từ khi những kẻ tạo ra chúng biến mất."
 distar.26.a:0 "Đưa chúng vào làm việc."
 distar.26.a.tooltip:0 "Nhận được £pop£ §HDân Cư Máy Móc§! trên [Root.GetName]."
 distar.26.b:0 "Tháo dỡ chúng lấy khoáng sản."
 distar.26.c:0 "Chính sách của chúng ta cấm sử dụng AI vì lý do chính đáng."
 distar.26.d:0 "Chúng ta không cần chúng, nhưng phá hủy chúng thì thật lãng phí."
 distar.26.d.tooltip:0 "Di dời £pop£ §HDân Cư Máy Móc§! trên [Root.GetName]."
 distar.26.spir:0 "Chúng ta không thể cùng tồn tại với những thứ vô hồn."
 distar.26.mach:0 "Chúng sẽ được đồng hóa."
 distar.27.name:0 "Những Kẻ Tạo Ra Đã Mất Tích"
 distar.27.desc:0 "Các [Root.Owner.GetScientistPlural] của [Root.Owner.GetAdj] bày tỏ sự hứng thú với việc giải mã ký ức còn sót lại của những cỗ máy trên [Root.GetName], với hy vọng tìm hiểu danh tính và số phận của những kẻ đã tạo ra chúng."
 distar.27.a:0 "Chúng ta sẽ cân nhắc điều đó."
 distar.28.name:0 "Những Kẻ Tạo Ra Đã Mất Tích"
 distar.28.desc:0 "Dấu ấn dữ liệu phục hồi từ các ổ lưu trữ vỡ nát trên [From.From.GetName] rất khó giải mã. Thông tin bên trong không mang lại thêm manh mối nào về nguồn gốc hay số phận của những người đã chế tạo chúng."
 distar.28.a:0 "Lại thêm một sự bất toàn của sự sống hữu cơ."
 distar.29.name:0 "Những Kẻ Tạo Ra Đã Mất Tích"
 distar.29.desc:0 "Trong quá trình quét sâu các robot thô sơ trên [From.From.GetName], nhà khoa học [Root.GetLeaderName] đã khôi phục thành công một nhật ký dữ liệu một phần từ một ổ lưu trữ bị hư hại."
 distar.29.a:0 "Vậy thì xem thử đi."
 distar.30.name:0 "Nhật Ký Hư Hỏng"
 distar.30.desc:0 "Báo cáo Hiểm họa Sinh học §G>>'%§!ort X175\n\nBộ phận Nghiên cứu Trưởng§G?'>*§! - Nhật ký cá nhân của Su§G(:=}§!\n\n§G<</-&*§!nhóm khảo sát đã quay trở lại. Họ mang theo một thứ gì đó§G::?&;^§!mẫu vật từ khe nứt sâu. Nó dường như đang §G*#?!;§!sống, nhưng không phản ứng với nhiệt hay kích thích điện..."
 distar.30.a:0 "Hiển thị mục đầu tiên."
 distar.30.b:0 "Hiển thị mục thứ hai."
 distar.30.b.response:0 "§G<</<#?^&}|>!^/§!ngủ say, bên dư§G!+<;§!ới bề mặt.§G*;'_>!?;*}<}/(§!\n\n§G#;!*:^#§!mẫu vật đã thức tỉnh. Nó không phải là một sinh vật đơn lẻ... nó là một tập hợp. Nó lan truyền qua không khí. Không ai được phép r§G%:>~;<§!ời khỏi cơ sở. Lệnh phong tỏa được ban b§G>!?=:'§!ố."
 distar.30.c:0 "Hiển thị mục cuối cùng."
 distar.30.c.response:0 "§G<<%/}} >!^*:+};=#(^&+<-|;/-<;// +-?<((#<-:?;&>-&|=:/<#% (*@#~<>>§!không còn hy vọng nào nữa. Các cánh cửa đã sụp đổ. Nó đang ở trong tâm trí chúng tôi. Chúng tôi chỉ có thể ra lệnh cho các robot tiếp tục làm việc... mãi mãi...§G**?:~|:!@§!"
 distar.30.d:0 "Phát lại đoạn ghi âm."
 distar.30.d.response:0 "\n§H<< Đoạn ghi âm chỉ có tiếng gào thét của nhiều giọng nói ngoài hành tinh, rồi sau một tiếng va đập lớn, tất cả chìm vào im lặng. >>§!"
 distar.30.e:0 "Đóng nhật ký."
 distar.31.name:0 "Hiện Tượng Kỳ Quái"
 distar.31.desc:0 "Chúng ta nhận được các báo cáo đáng lo ngại về hành vi bất thường của một số cư dân trên [Root.GetName]. Tình trạng này dao động từ lú lẫn, mất phương hướng đến hưng phấn cực độ và ảo giác."
 distar.31.a:0 "Phải điều tra đến tận cùng sự việc này."
 distar.32.name:0 "Căng Thẳng Gia Tăng"
 distar.32.desc:0 "Ngày càng nhiều cư dân trên [Root.GetName] rơi vào trạng thái bấn loạn và lo âu, dần thể hiện các hành vi kỳ quái tương tự nhóm người bị cách ly vài tuần trước. Các [Owner.GetScientistPlural] của chúng ta vẫn đang nỗ lực tìm kiếm câu trả lời."
 distar.33.name:0 "Bạo Lực Bùng Phát"
 distar.33.desc:0 "Tình hình trên [Root.GetName] đang vượt ngoài tầm kiểm soát. Tỷ lệ dân chúng bị chi phối bởi cơn thịnh nộ và lo âu đã đạt ngưỡng tới hạn. Đáng lo ngại hơn, một số người dân có vũ trang đã bắt đầu tấn công người khác."
 distar.33.a:0 "Sự điên rồ này bắt nguồn từ đâu?"
 distar.33.a.tooltip:0 "Những người dân giận dữ đang tấn công chính những người bạn định cư trên [Root.GetName]!"
 distar.34.name:0 "Đã Trấn Áp Bạo Lực"
 distar.34.desc.a:0 "Những cư dân giận dữ trên [From.From.GetName] đã bị lực lượng an ninh của chúng ta trấn áp. Đáng tiếc là nguyên nhân gây ra hành vi bất thường này vẫn chưa được xác định, và nguy cơ tái bùng phát vẫn hiện hữu."
 distar.34.desc.b:0 "Những cư dân bạo loạn trên [From.From.GetName] đã bị lực lượng phòng thủ trấn áp thành công. Tuy nhiên, các [Owner.GetScientistPlural] vẫn chưa thể giải thích được căn nguyên dẫn đến vụ bùng phát cuồng nộ bất ngờ này."
 distar.34.a:0 "Chúng ta phải tìm ra nguyên nhân."
 distar.35.name:0 "Virus Cuồng Nộ"
 distar.35.desc:0 "Bi kịch đã ập xuống nhóm nghiên cứu phụ trách điều tra nguồn gốc của hành vi bất thường trên [Root.GetName]. Dù đã thực hiện các biện pháp phòng ngừa nghiêm ngặt, họ vẫn bị nhiễm một loại retrovirus đột biến tấn công hệ thần kinh trung ương."
 distar.35.a:0 "Thời gian không còn nhiều!"
 distar.36.name:0 "Đã Bào Chế Vắc-xin Kháng Cuồng Nộ"
 distar.36.desc:0 "Quá trình nghiên cứu vắc-xin điều trị dịch bệnh cuồng nộ hoành hành cư dân trên [Root.GetName] đã hoàn tất mỹ mãn. Công tác phân phối vắc-xin đã bắt đầu, và [Root.GetName] đang dần khôi phục lại trật tự bình thường.\n\nNghiên cứu cho thấy retrovirus gây ra sự bất ổn này đã tiến hóa trên [Root.GetName] từ hàng triệu năm trước. Chúng ngủ đông trong các sinh khối bị đóng băng và tái xuất hiện khi các chỏm băng tan chảy.\n\nRất có thể loại virus này đã dẫn đến sự diệt vong của những kẻ tạo ra robot cổ đại hàng thế kỷ trước. Thật may mắn, [Owner.GetName] được trang bị tốt hơn để xử lý các tác nhân lây nhiễm. Việc phát triển loại vắc-xin này thậm chí còn thúc đẩy một số bước tiến trong lĩnh vực y học của chúng ta."

 distar.40.name:0 "Chất Xám"
 distar.40.desc:0 "Sau khi phân tích chi tiết, Sĩ quan [Root.GetLeaderName] đã phát hiện ra rằng lớp vật chất kim loại kỳ lạ bao phủ bề mặt [From.GetName] thực chất bao gồm hàng tỷ robot nano siêu nhỏ, tất cả đều đang ở trạng thái ngừng hoạt động."

 distar.45.name:0 "Bất Thường Trọng Lực"
 distar.45.desc:0 "Khi nghiên cứu các chỉ số kỳ dị xung quanh [From.GetName], thủy thủ đoàn tàu [Root.GetName] phát hiện các chỉ số trắc địa trọng lực của toàn hệ sao đều vượt ngoài thang đo. Sĩ quan Khoa học [Root.GetLeaderName] nghi ngờ rằng cổng không gian tại [From.GetName] đang gây nhiễu dữ liệu cảm biến, hoặc chính là nguyên nhân tạo ra khối lượng chưa xác định trong hệ sao.\n\nMột cuộc nghiên cứu chi tiết hơn về cánh cổng này có thể đem lại nhiều hiểu biết sâu sắc hơn."
 distar.46.name:0 "Dòng Chảy Tối"
 distar.46.desc:0 "Việc kiểm tra cổng không gian [From.GetStarName] không diễn ra suôn sẻ như dự kiến. Cảm biến phát hiện các hiệu ứng trọng lực vượt xa tính toán, buộc Sĩ quan Khoa học [Root.GetLeaderName] phải giữ khoảng cách an toàn trước hiện tượng mà họ gọi là 'Dòng Chảy Tối'."

 distar.50.name:0 "Trùng Biến Hình Lạc Lối"
 distar.50.desc:0 "Tàu [Root.GetName] đã định vị được nguồn gốc của chuyển động trong thượng tầng khí quyển của [From.GetName]. Thật đáng kinh ngạc, không hề có con tàu nào ẩn nấp trong mây, mà là một cá thể Trùng Biến Hình Không Gian non nớt, không thấy mẹ của nó đâu.\n\nKhông có cách nào biết được làm thế nào con non này lại lạc mất mẹ hoặc đồng loại, nhưng có một điều chắc chắn: nó dường như đã hình thành ấn tượng gắn bó khắc sâu đối với tàu [Root.GetName]. Khi thủy thủ đoàn hoàn tất cuộc khảo sát [From.GetName], họ nhận ra con Trùng Biến Hình đang bám theo mình. Rất khó để cắt đuôi nó, và [Root.GetLeaderName] thực sự rất thích thú trước sự kiên trì của sinh vật nhỏ này.\n\nSĩ quan Khoa học của chúng ta đề xuất cho phép sinh vật non nớt này tiếp tục bám theo con tàu, tin chắc rằng chúng ta có thể tìm hiểu thêm về loài Trùng Biến Hình Không Gian trong suốt quá trình này."
 distar.50.desc.first_enc:1 "Tàu [Root.GetName] đã định vị được nguồn gốc chuyển động trong thượng tầng khí quyển [From.GetName]. Thật bất ngờ, không hề có con tàu nào ẩn nấp trong mây, mà là một dạng sống ngoài hành tinh hiền lành. Bất chấp kích thước đồ sộ, sinh vật mà thủy thủ đoàn [Root.GetName] gọi là Trùng Biến Hình Không Gian này dường như chỉ là một con non.\n\nKhông có cách nào biết được làm sao con non này lại lạc bầy, nhưng có một điều chắc chắn: nó dường như đã gắn bó sâu sắc với tàu [Root.GetName]. Khi thủy thủ đoàn hoàn thành việc khảo sát [From.GetName], họ phát hiện sinh vật này đang bơi theo sau. Việc cắt đuôi nó hóa ra rất khó khăn, và [Root.GetLeaderName] tỏ ra vô cùng yêu mến sự kiên định của sinh vật non này.\n\nSĩ quan Khoa học của chúng ta đề xuất cho phép sinh vật non đi theo tàu, tin chắc rằng chúng ta có thể nghiên cứu sâu hơn về giống loài này trong hành trình."
 distar.50.a:0 "Được thôi..."
 distar.50.b:0 "Tuyệt đối không. Cứ tiếp tục tránh xa nó."
 distar.50.b.tooltip:0 "Cố gắng cắt đuôi con Trùng Biến Hình non đang bám theo tàu [Root.GetName]."
 distar.50.c:0 "Chúng ta chắc chắn có thể nghiên cứu nó. Hãy ra lệnh mổ xẻ."
 distar.51.name:0 "Lông Cánh Đầy Đủ"
 distar.51.desc:0 "Con Trùng Biến Hình non gia nhập hạm đội của chúng ta một thời gian trước dường như đã trưởng thành hoàn toàn. Giờ đây đã là một cá thể trưởng thành ấn tượng, cô nàng vẫn giữ nguyên lòng trung thành với các con tàu đã cho mình một mái nhà mới khi bị mắc kẹt trên [From.From.GetName].\n\nKhoảng thời gian sống cùng hạm đội dường như đã hình thành ở nó những hành vi thích ứng không thường thấy ở loài Trùng Biến Hình Không Gian hoang dã, biến nó thành một sự hiện diện đáng gờm trên chiến trường hơn hẳn các đồng loại. Khắp [Root.Owner.GetName], hình ảnh của nó đã trở thành một biểu tượng linh vật cho tinh thần của [Root.Owner.GetAdj].\n\nChỉ còn lại một câu hỏi duy nhất: chúng ta nên đặt tên cho nó là gì?"
 distar.51.a:0 "$NAME_Bubbles$."
