 abandoned_wormhole_station:0 "Trạm Lỗ Sâu Bỏ Hoang"
 abandoned_wormhole_station_desc:0 "Một trạm không gian bỏ hoang quay những vòng chậm rãi tại cửa ngõ của lỗ sâu này."
 mysterious_tanker_object:0 "Tàu Chở Dầu Bí Ẩn"
 mysterious_tanker_object_desc:0 "Một con tàu vô chủ chở đầy các bồn chứa lơ lửng trên quỹ đạo tầm thấp của hành tinh này."
 droppod_01_object:0 "Khoang Đổ Bộ Bỏ Hoang"
 droppod_01_object_desc:0 "Một khoang đổ bộ bị vứt bỏ trôi dạt trong không gian, những sinh vật ngoài hành tinh mà nó vận chuyển từ lâu đã chỉ còn là những cái xác khô khốc."
 droppod_02_object:0 "$droppod_01_object$"
 droppod_02_object_desc:0 "Một khoang đổ bộ bị vứt bỏ trôi dạt trong không gian. Cảm biến của chúng ta ghi nhận những dấu vết hoạt động yếu ớt bên trong."
 NAME_Caretaker:0 "Người Trông Nom AX7-b"
 caretaker_leader:0 "$NAME_Caretaker$"
 caretaker_leader_desc:0 "Một cỗ máy chuyên trách chăm sóc người khác. Những thất bại trong quá khứ đã in sâu vào ngân hàng ký ức của nó."
 caretaker_leader_catch_phrase:0 "$distar.249.desc$"
 leader_trait_govenor_caretaker:0 "Người Trông Coi"
 leader_trait_govenor_caretaker_desc:0 "Đảm bảo đầy đủ dinh dưỡng, nơi làm việc sạch sẽ và các đối tượng được chăm sóc nhận được sự kích thích thích hợp đều nằm trong phạm vi trách nhiệm của Người Trông Nom."
 leader_trait_govenor_caretaker_node:0 "Lời Dạy Của Người Trông Nom"
 leader_trait_govenor_caretaker_node_desc:0 "Kiến thức độc đáo của Người Trông Nom nay đã trở thành của chúng ta."

## l_english.yml
 trait_presapient_docile_livestock:0 "Gia Súc Ngoan Ngoãn"
 trait_presapient_docile_livestock_desc:0 "§LNgoan ngoãn và ngon miệng! Giống loài này đã bị triệt tiêu các chức năng não bộ bậc cao để trở thành một loài gia súc vô hại, tự chăm sóc bản thân mà không cần đến sự phức tạp của đời sống xã hội hay ý chí tự quyết.§!"
 trait_brainslug:0 "Vật Chủ Sên Não"
 trait_brainslug_desc:0 "§LGiống loài này đang tận hưởng sự cộng sinh thần kinh: một loài sên lành tính bám vào thân não của vật chủ.§!"
 leader_trait_scientist_brainslug:0 "$trait_brainslug$"
 leader_trait_scientist_brainslug_desc:0 "Nhà lãnh đạo này đang hưởng lợi từ một thực thể cộng sinh thần kinh: một loài sên hữu ích bám vào thân não của vật chủ."
 leader_trait_admiral_brainslug:0 "$trait_brainslug$"
 leader_trait_admiral_brainslug_desc:0 "$leader_trait_scientist_brainslug_desc$"
 leader_trait_governor_brainslug:0 "$trait_brainslug$"
 leader_trait_governor_brainslug_desc:0 "$leader_trait_scientist_brainslug_desc$"
 leader_trait_ruler_brainslug:0 "$trait_brainslug$"
 leader_trait_ruler_brainslug_desc:0 "$leader_trait_scientist_brainslug_desc$"
 leader_trait_general_brainslug:0 "$trait_brainslug$"
 leader_trait_general_brainslug_desc:0 "$leader_trait_scientist_brainslug_desc$"
 leader_trait_brainslug:0 "$trait_brainslug$"
 leader_trait_brainslug_desc:0 "$leader_trait_scientist_brainslug_desc$"
 leader_trait_admiral_hells_heart:0 "Trái Tim Địa Ngục"
 leader_trait_admiral_hells_heart_desc:0 "Khi bước vào chiến tranh, nhà lãnh đạo này tỏ ra tàn nhẫn đến mức ám ảnh và kiên định đến cùng."
 hells_heart_effect:0 "$t$Nhận thêm §G50%§! tài nguyên từ §H$leader_trait_corsair$§! và §H$leader_trait_shipbreaker$§!"
 d_vast_unity_deposit:0 "£unity£ +3\n"
 d_vast_unity_deposit_desc: "$d_vast_unity_deposit$"
 trait_bioadaptability:0 "Khả Năng Thích Ứng Sinh Học"
 trait_bioadaptability_desc:0 "§LGiống loài này đã được biến đổi gen để tăng nhẹ khả năng thích ứng môi trường, giúp họ chịu đựng được những vùng khí hậu khắc nghiệt hơn.§!"
 trait_social_pheromones:0 "Pheromone Xã Hội"
 trait_social_pheromones_desc:0 "§LGiống loài này đã được biến đổi để trở nên hòa đồng hơn và dễ dàng chấp nhận cuộc sống bầy đàn đông đúc.§!"
 trait_limited_regeneration:0 "Tái Sinh Hạn Chế"
 trait_limited_regeneration_desc:1 "§LGiống loài này đã được biến đổi để vết thương lành nhanh hơn, giúp họ kiên cường hơn trong giao tranh và tăng nhẹ tuổi thọ.§!"

 ## technology_l_english.yml
 SCAVENGER_SECONDARY_WEAPON:0 "$STRANGE_COMPONENTS_DESC$"
 SCAVENGER_MAIN_WEAPON:0 "Bệ Phóng Phế Liệu"
 tech_nanite_repair_system:0 "Hệ Thống Sửa Chữa Robot Nano"
 tech_nanite_repair_system_desc:0 "Một hệ thống tự động sửa chữa thân tàu cực kỳ hiệu quả bao gồm hàng tỷ robot nano siêu nhỏ được tìm thấy từ xác của Cỗ Máy Thu Gom Phế Liệu, nay đã được cải tiến để phục vụ chúng ta."
 tech_neuroregeneration:0 "Kỹ Thuật Mô Thần Kinh"
 tech_neuroregeneration_desc:0 "Khi được điều chỉnh cho phù hợp với hệ gen của một giống loài, dạng công nghệ mô này thể hiện đặc tính tái tạo thần kinh mạnh mẽ, đẩy nhanh đáng kể sự hình thành tế bào thần kinh, sợi trục và khớp thần kinh."
 AUTO_REPAIR_2:0 "$tech_nanite_repair_system$"
 tech_nanite_autocannon:0 "Pháo Tự Động Robot Nano"
 tech_nanite_autocannon_desc:0 "Các pháo tự động tối tân có khả năng bắn ra những đầu đạn phát nổ thành các đám mây robot nano khi tiếp cận mục tiêu, làm quá tải khiên chắn và gặm nhấm thân tàu địch."
 AUTOCANNON_4:0 "$tech_nanite_autocannon$"
 AUTOCANNON_4_DESC:0 "$tech_nanite_autocannon_desc$"
