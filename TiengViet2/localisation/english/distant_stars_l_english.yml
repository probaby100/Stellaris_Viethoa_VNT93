 sr_aldar:0 "Tinh Thể Aldar"
 sr_aldar_desc:0 "Làm mẻ một tinh thể Aldar sẽ khiến mảnh vỡ tạo ra nở to và cứng lại với tốc độ nổ, biến nó thành vật liệu lý tưởng cho các ma trận phân mảnh trong đạn dược phát nổ."
 tech_mine_aldar:0 "Đánh Bóng Aldar"
 tech_mine_aldar_desc:0 "Aldar dễ bay hơi chỉ được tìm thấy lẫn trong các loại quặng phổ biến hơn. Việc chiết xuất thành công các tinh thể Aldar từ những ma trận khoáng sản này - mà không gây hư hại đáng kể cho thiết bị và người vận hành - đòi hỏi các máy móc xúc giác tự động tiên tiến."

