 KETLING_PROJECT_4_DESC:1 "Các sinh vật có tri giác đã xuất hiện từ những đống phế liệu trên §Y[ratling_planet_4.GetName]§!. Các nhà khoa học của chúng ta rất tò mò liệu những sinh vật ngoài hành tinh này, được mệnh danh là $NAME_Ketlings$, là hậu duệ của nền văn minh du hành vũ trụ từng bao trùm các hệ sao này, hay họ có một nguồn gốc hoàn toàn khác.\n\nChúng ta có thể chọn bất kỳ hành tinh nào có $NAME_Ketlings$ tự trị sinh sống để tiến hành nghiên cứu này."
 KETLING_PROJECT_5:0 "Nghiên Cứu $NAME_Ketlings$ Trên §Y[ratling_planet_5.GetName]§!"
 KETLING_PROJECT_5_DESC:1 "Các sinh vật có tri giác đã xuất hiện từ những đống phế liệu trên §Y[ratling_planet_5.GetName]§!. Các nhà khoa học của chúng ta rất tò mò liệu những sinh vật ngoài hành tinh này, được mệnh danh là $NAME_Ketlings$, là hậu duệ của nền văn minh du hành vũ trụ từng bao trùm các hệ sao này, hay họ có một nguồn gốc hoàn toàn khác.\n\nChúng ta có thể chọn bất kỳ hành tinh nào có $NAME_Ketlings$ tự trị sinh sống để tiến hành nghiên cứu này."

 SEALED_SYSTEM_PROJECT:0 "Trạm Lỗ Sâu Bỏ Hoang"
 SEALED_SYSTEM_PROJECT_DESC:0 "Một trạm không gian bỏ hoang đang quay tròn tại cửa ngõ của lỗ sâu Hệ sao §Y[From.GetName]§!. Một cuộc điều tra sâu hơn có thể giải thích ai đã xây dựng nó và tại sao lỗ sâu này dường như hoàn toàn không thể đi qua."

 PHASESHIFT_PROJECT:0 "Đóng Băng Dịch Chuyển Pha"
 PHASESHIFT_PROJECT_DESC:1 "§Y[phaseshift_planet.GetName]§!, một hành tinh trong Hệ sao §Y[phaseshift_planet.GetStarName]§! đã được quan sát thấy dịch chuyển pha giữa §Y$pc_shrouded$§! và §Y$pc_gaia$§! theo chu kỳ ba tháng.\n\nCác nhà vật lý của chúng ta có thể nghĩ ra cách để khóa hành tinh ở một trong các trạng thái của nó, đóng băng nó vĩnh viễn thành §Y$pc_gaia$§! và ngăn nó dịch chuyển trở lại."

