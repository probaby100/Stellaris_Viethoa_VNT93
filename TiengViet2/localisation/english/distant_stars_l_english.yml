 # New tradition swaps
 tr_supremacy_fleet_logistical_corps_hive:0 "Tàu Chở Dinh Dưỡng"
 tr_supremacy_fleet_logistical_corps_hive_desc:0 "$tr_supremacy_fleet_logistical_corps_desc$"
 tr_supremacy_fleet_logistical_corps_hive_delayed:0 "Chúng ta sẽ đồng hành cùng các bầy săn không gian sâu của mình với các drone vận chuyển khổng lồ, về cơ bản là những túi chứa bột protein không có dây thần kinh cùng một động cơ siêu không gian. Các drone sẽ bị hút cạn và chết, nhưng bầy đàn sẽ tiếp tục sống."

 tr_purity_colonial_viceroys_devour:0 "Ý Thức Tối Cao Thống Trị"
 tr_purity_colonial_viceroys_devour_desc:0 "$tr_domination_colonial_viceroys_desc$"
 tr_purity_colonial_viceroys_devour_delayed:0 "Dấu hiệu đầu tiên: chinh phục. Dấu hiệu thứ hai: mở tiệc yến ẩm. Dấu hiệu thứ ba, vĩnh cửu nhất cho chiến thắng của chúng ta: dựng lên những tổ bầy vô tận trên các thế giới mới, quét sạch mọi sự sống khác."

 tr_supremacy_above_the_fray_devour:0 "Những Kẻ Săn Mồi Kiên Nhẫn"
 tr_supremacy_above_the_fray_devour_desc:0 "$tr_supremacy_above_the_fray_desc$"
 tr_supremacy_above_the_fray_devour_delayed:0 "Chúng ta thấy những kẻ khác các ngươi thật khó hiểu. Các ngươi lãng phí cuộc đời ngắn ngủi của mình vào những cuộc cãi vã tàn sát lẫn nhau về viễn cảnh tương lai cô độc nào là ưu việt hơn. Các ngươi tiến hành những cuộc chiến tận thế chỉ vì một mảnh vải màu nào sẽ treo trên thủ phủ hành tinh. Chúng ta quan sát, và thèm khát..."

 tr_supremacy_natural_preeminence_devour:0 "Quét Sạch Để Thuần Hóa"
 tr_supremacy_natural_preeminence_devour_desc:0 "$tr_supremacy_natural_preeminence_desc$"
 tr_supremacy_natural_preeminence_devour_delayed:0 "Ngay cả sau khi hấp thụ các bầy chiến tranh không gian và mặt đất của chúng, nhiều quần thể bị chinh phục vẫn từ chối chấp nhận vai trò làm thức ăn của chúng ta, và ngoan cố chống cự. Một chiến dịch cắt thùy não có hệ thống đối với các drone then chốt, giải tán các nhóm ấp nở và bộ tộc, cùng những màn phô trương bạo lực công khai sẽ giúp chúng chấp nhận phần việc của mình trong kế hoạch vĩ đại của chúng ta."

 tr_domination_cloud_calculations:0 "Điện Toán Đám Mây"
 tr_domination_cloud_calculations_desc:0 "$tr_domination_vassal_acculturation_desc$"
 tr_domination_cloud_calculations_delayed:0 "Càng có nhiều hệ thống nô lệ được chúng ta cắm vào mạng lưới của mình, chúng ta càng tích lũy được nhiều bằng chứng cho thấy mô hình lý thuyết của chính chúng ta về vũ trụ là mô hình duy nhất chính xác."

 tr_supremacy_natural_preeminence_terminator:0 "Khủng Bố Có Hệ Thống"
 tr_supremacy_natural_preeminence_terminator_desc:0 "$tr_supremacy_natural_preeminence_desc$"
 tr_supremacy_natural_preeminence_terminator_delayed:0 "Các phương pháp trước đây nhằm dập tắt sự bất tuân của sinh vật hữu cơ trên các thế giới đang được xử lý đều kém hiệu quả và thô thiển. Phân tích hiện kết luận rằng việc khủng bố cường độ thấp, tùy tiện mang lại hiệu quả thất thường, trên thực tế thường củng cố ý chí kháng cự. Để đạt hiệu quả, chiến dịch cần phải được duy trì liên tục, toàn diện và không thể trốn thoát."

 tr_supremacy_above_the_fray_terminator:0 "Quyết Định Trong Một Phần Triệu Giây"
 tr_supremacy_above_the_fray_terminator_desc:0 "$tr_supremacy_above_the_fray_desc$"
 tr_supremacy_above_the_fray_terminator_delayed:0 "Lượng chu kỳ ra quyết định bị sinh vật hữu cơ lãng phí vào những thôi thúc hỗn loạn, không cần thiết của chúng là không thể đo đếm được. Chúng ta đã loại bỏ độ trễ giữa mục đích, suy nghĩ và hành động. Chúng ta hoạt động như một hệ thống thống nhất, một thứ vũ khí có khả năng tự bóp cò."

 # Tech swaps
 tech_databank_uplinks_hive_mind:0 "Chiêm Nghiệm Tập Thể"
 tech_databank_uplinks_desc_hive_mind:0 "Một công dụng mới lạ cho các drone thám hiểm đã được tìm thấy: bằng cách giữ chúng trên quỹ đạo và khuếch đại liên kết tâm trí của chúng trên quy mô toàn hành tinh, các con đường khám phá mang tính suy đoán mới sẽ được hé lộ. Ngay cả các khớp thần kinh yếu ớt của hàng tỷ drone công nhân, khi tập hợp lại, cũng tạo ra một hiệu ứng tích lũy."
 tech_improved_databank_uplinks_hive_mind:0 "Chiêm Nghiệm Tập Thể Sâu Hơn"
 tech_improved_databank_uplinks_desc_hive_mind:0 "Việc tiếp xúc kéo dài với các liên kết tâm trí của drone thám hiểm đang tạo ra các hiệu ứng cộng hưởng trong các khớp thần kinh của drone công nhân."

 ## Ketling Diplomacy
 KET_HOSTILE_GREETING:0 "§HKssk!§! Nói nhanh lên, [From.GetSpeciesName]. Kiên nhẫn không phải là đức tính của chúng ta."
 KET_NEUTRAL_GREETING:0 "Các bạn có lời muốn nói sao? Viễn Tâm đang lắng nghe đây, hỡi những người [From.GetSpeciesNamePlural]."
 KET_FRIENDLY_GREETING:0 "Hỡi người [From.GetSpeciesNamePlural]. Bạn bầy. Cái lạnh của cõi hư không chẳng là gì khi nhiều kẻ cùng đào hang làm một."
 KET_WAR_GREETING:0 "Lũ phản bội. Lũ tiếm quyền. §HKssk!§! Chúng ta đã sống sót qua ánh hồng ấm áp. Các ngươi thì không đâu."
 KET_OVERLORD_GREETING:0 "§HTch§!, lũ nhóc con. Các ngươi tìm kiếm điều gì?"
 KET_THREATENED_GREETING:0 "Chúng ta có vẻ nhỏ bé, [From.GetSpeciesName], nhưng chúng ta không phải không có móng vuốt."
 KET_VASSAL_GREETING:0 "Thưa các Chủ Nhân. §HKssk!§! Chúng tôi sẽ lắng nghe. Các ngài sẽ nói. Chúng tôi sẽ phục tùng."
 KET_VASSAL_GREETING_DISLOYAL:0 "Hãy thả chúng ta ra, [From.GetSpeciesNamePlural]. §HKssk kssk kssk!§! Viễn Tâm bứt rứt khó chịu trước cái lồng giam này."
 KET_VASSAL_DOMINEERING:0 "Bầy [From.GetName] thật yếu ớt, và ít ỏi! Có rất nhiều điều mà Viễn Tâm có thể dạy cho các ngươi."
 KET_DOW_PROPOSE_01:0 "Chiến tranh! Chiến tranh! Chiến tranh! Chiến tranh!"
 KET_DOW_PROPOSE_02:0 "Kim loại của các ngươi. Phế liệu của các ngươi. Dây điện của các ngươi. Chúng ta cần chúng, §Hkssk!§!"
 KET_VASSAL_DOW_PROPOSE:0 "Chúng ta không thể cam chịu cái lồng này nữa. Viễn Tâm sẽ được tự do!"
 KET_DOW_ACCEPT:0 "Vậy thì chúng ta sẽ chiến đấu! §HKssk!§!"
 KET_CONSIDER_01:0 "Chúng ta phải cân nhắc, chúng ta phải hội ý. Có rất nhiều tâm trí để hỏi, rất nhiều, §Hkssk!§!"
 KET_PEACE_PROPOSE_01:0 "Đủ rồi, §Hkssk!§! Chân chúng ta đã mỏi mệt vì những cuộc giao tranh không ngừng nghỉ này rồi. Phải có hòa bình với Viễn Tâm, §Hkssk!§!"
 KET_PEACE_ACCEPT_01:0 "Hòa bình! Hòa bình. Các bạn bầy sẽ nghỉ ngơi, chắp vá những con tàu của mình. §HKssk!§!"
 KET_PEACE_REFUSE_01:0 "Không hòa bình! Vẫn còn những thứ để lấy, những chiếc đầu để gặm nhấm, §Hkssk kssk!§!"
 KET_PEACE_CONSIDER_01:0 "Các mảnh vỡ vụn... những thân tàu rực cháy... nhiều thứ đã mất đi. Chúng ta sẽ cân nhắc, chúng ta sẽ nghĩ ngợi."
 KET_ITOA_SELECT_01:0 "Bạn muốn Viễn Tâm trở thành một phần của một bầy đàn lớn hơn sao? Hãy nói tiếp đi, §Hkssk!§!"
 KET_ITOA_PROPOSE_01:0 "Hỡi người [Root.GetSpeciesNamePlural], những người bạn. Cùng nhau, hai bầy của chúng ta sẽ nhanh hơn, mạnh hơn. Một liên bang, §Hkssk§!?"
 KET_ITOA_ACCEPT_01:0 "Đúng vậy, cùng nhau chúng ta sẽ trở thành Số Đông. Đó sẽ là một liên bang, §Hkssk!§!"
 KET_ITOA_REFUSE_01:0 "Không. Viễn Tâm sẽ không bị xích lại, sẽ không bị trói buộc, §Hkssk!§!"
 KET_ASK_JOIN_A_SELECT_01:0 "Bạn muốn gia nhập Đại Bầy Đàn sao? Chúng ta sẽ cân nhắc, chúng ta sẽ thảo luận."
 KET_ASK_JOIN_A_PROPOSE_01:0 "Người [From.GetSpeciesNamePlural] chúng tôi có bàn tay khéo léo, tâm trí nhanh nhạy. Chúng tôi sẽ là những bạn bầy hữu ích cho §Y[Root.GetAllianceName]§!! Bạn hãy để Viễn Tâm gia nhập Đại Bầy Đàn của bạn, nhé?"
 KET_ASK_JOIN_A_ACCEPT_01:0 "Được, được. Đế chế [From.GetName] sẽ gia nhập §Y[Root.GetAllianceName]§!. Sẽ gia nhập Đại Bầy Đàn của chúng ta."
 KET_ASK_JOIN_A_REFUSE_01:0 "Chúng ta sẽ không làm bạn bầy; sẽ không có sự hợp nhất nào cả. §Y[Root.GetAllianceName]§! sẽ không có [From.GetName]."
 KET_LEAVE_A_SELECT_01:0 "Bạn muốn rời khỏi §Y[Root.GetAllianceName]§!, rời khỏi Đại Bầy Đàn sao, §Hkssk§!?"
 KET_LEAVE_A_PROPOSE_01:0 "Chúng ta đã mệt mỏi với Đại Bầy Đàn, với §Y[Root.GetAllianceName]§!. Viễn Tâm chúng ta phải được đơn độc, chúng ta phải được tự do."
 KET_LEAVE_A_ACCEPT_01:0 "Bạn muốn thoát khỏi Đại Bầy Đàn, thoát khỏi §Y[Root.GetAllianceName]§! sao, [From.GetSpeciesName]? §HKssk kssk kssk!§! Bạn sẽ yếu hơn nếu không có Đồng Loại, nhưng chúng ta sẽ không ngăn cản bạn."
 KET_DEMAND_VASS_SELECT_01:0 "Chư hầu sao, §Hkssk§!? Bạn muốn Viễn Tâm trở thành một bầy dưới trướng [From.GetName] ư?"
 KET_DEMAND_VASS_PROPOSE_01:0 "Quốc gia [Root.GetName] là một bầy yếu ớt. Chúng ta có thể che chở cho các bạn. Chúng ta có thể mang lại cho các bạn sự tiện nghi. Các bạn sẽ là chư hầu của Viễn Tâm, nếu các bạn đồng ý."
 KET_DEMAND_VASS_ACCEPT_01:0 "Được, được. Chúng ta yếu đuối, chúng ta ít ỏi. Nhưng không còn như vậy nữa. Đế chế [From.GetName] sẽ là chủ nhân của chúng ta, §Hkssk§!."
 KET_DEMAND_VASS_REFUSE_01:0 "$KET_ITOA_REFUSE_01$"
 KET_ASK_FOR_VASS_SELECT_01:0 "Bạn muốn sự bảo vệ của chúng ta sao, §Hkssk§!? Muốn bầy Viễn Tâm dẫn dắt người [From.GetSpeciesNamePlural] ư?"
 KET_ASK_FOR_VASS_PROPOSE_01:0 "Viễn Tâm quá ít ỏi, §Hkssk kssk§!. Quá yếu ớt và quá ít ỏi. Bạn sẽ dẫn dắt chúng ta chứ? Liệu [Root.GetName] có phải là một bầy xếp trên chúng ta không?"
 KET_ASK_FOR_VASS_ACCEPT_01:0 "Đúng vậy, §Hkssk§!. Viễn Tâm chúng ta sẽ hướng dẫn các bạn, dẫn dắt các bạn. Các bạn sẽ thuộc về chúng ta, §Hkssk!§!"
 KET_ASK_FOR_VASS_REFUSE_01:0 "Chúng ta không có thời gian, chúng ta không có chỗ! Không có chỗ trong Viễn Tâm cho bầy [From.GetSpeciesAdj]!"
 KET_DEMAND_PROT_SELECT_01:0 "Các bạn sẽ bảo vệ chúng ta sao, §Hkssk§!? Các bạn sẽ sử dụng kiến thức của mình để dẫn dắt Viễn Tâm sao, §Hkssk§!?"
 KET_DEMAND_PROT_PROPOSE_01:0 "Viễn Tâm chúng ta biết rất nhiều điều, §Hkssk kssk§!, biết nhiều hơn bầy [Root.GetName]. Chúng ta có thể hướng dẫn các bạn, bảo vệ các bạn. Chúng ta có thể làm cho bầy của các bạn lớn mạnh dưới trướng chúng ta."
 KET_DEMAND_PROT_ACCEPT_01:0 "$KET_DEMAND_VASS_ACCEPT_01$"
 KET_DEMAND_PROT_REFUSE_01:0 "$KET_ITOA_REFUSE_01$"
 KET_ASK_FOR_PROT_SELECT_01:0 "$KET_ASK_FOR_VASS_SELECT_01$"
 KET_ASK_FOR_PROT_PROPOSE_01:0 "$KET_ASK_FOR_VASS_PROPOSE_01$"
 KET_ASK_FOR_PROT_ACCEPT_01:0 "$KET_ASK_FOR_VASS_ACCEPT_01$"
 KET_ASK_FOR_PROT_REFUSE_01:0 "$KET_ASK_FOR_VASS_REFUSE_01$"
 KET_RELEASE_SUBJECT_SELECT_01:0 "Bạn muốn Viễn Tâm được tự do khỏi bầy của bạn sao?"
 KET_RELEASE_SUBJECT_PROPOSE_01:0 "§HKssk kssk kssk!§! Chúng ta đã kiệt quệ và chúng ta mệt mỏi vì phải dẫn dắt các bạn rồi, hỡi người [Root.GetSpeciesNamePlural]. Bầy của các bạn nên tự tìm con đường riêng của mình giữa các vì sao."
 KET_RELEASE_SUBJECT_ACCEPT_01:0 "Một lần nữa, chúng ta đã phát triển vượt khỏi những chiếc lồng làm ra cho mình."
 KET_ASK_TO_BE_RELEASED_SUBJECT_SELECT_01:0 "§HKssk kssk!§! Các bạn muốn thoát khỏi sự bảo hộ của Viễn Tâm sao, hỡi người [From.GetSpeciesNamePlural]?"
 KET_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE_01:0 "Chúng tôi muốn thoát khỏi sự thống trị của [Root.GetName]. Bạn sẽ trả tự do cho Viễn Tâm chứ?"
 KET_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT_01:0 "Vậy thì hãy đi đi, [From.GetName]. Chúng ta sẽ không giữ các bạn trong lồng một cách miễn cưỡng."
 KET_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_01:0 "§HKssk!§! Các bạn nói về tự do, nhưng chúng ta vẫn cần đến các bạn, [From.GetSpeciesName]."
 KET_OFFER_TRADE_DEAL_PROPOSE_01:0 "Chúng ta có rất nhiều hàng hóa, rất nhiều thứ. Kim loại, dây điện, thông tin. Đế chế [Root.GetName] có muốn giao thương với chúng ta không?"
 KET_OFFER_TRADE_DEAL_ACCEPT_01:0 "§HKssk!§! Một thỏa thuận tốt, một cuộc giao dịch tuyệt vời."
 KET_OFFER_TRADE_DEAL_REFUSE_01:0 "Một thỏa thuận tồi, không thỏa đáng, §Hkssk!§!"
 KET_MAKE_RIVAL_01:0 "Bạn muốn đối đầu bầy của mình với Viễn Tâm sao, §Hkssk?§! Bạn sẽ phải hối hận đấy."
 KET_MAKE_RIVAL_PROPOSE_01:0 "Bầy của bạn có rất nhiều thứ ngon lành... kim loại, phế liệu và dây điện, đồ bỏ đi và đá quý! Chúng ta thèm muốn chúng. Chúng ta phải có được chúng. Chúng ta sẽ đoạt lấy chúng từ bạn vào một ngày nào đó."
 KET_MAKE_RIVAL_ACCEPT_01:0 "Xuất sắc. Giờ thì chúng ta không cần phải hối tiếc vì đã ăn trộm tất cả số phế liệu đó từ bạn khi bạn không để ý nữa! §HKssk kssk kssk!§!"
 KET_END_RIVALRY_01:0 "Không còn kiêu ngạo nữa sao, [From.GetSpeciesName]? Bầy [From.GetName] muốn hòa giải à?"
 KET_END_RIVALRY_PROPOSE_01:0 "Bầy của chúng ta mệt mỏi vì kình địch rồi, [Root.GetSpeciesName]. Hãy làm hòa và chia sẻ phế liệu lại với nhau đi, §Hkssk!§!"
 KET_END_RIVALRY_ACCEPT_01:0 "Rất tốt, chúng ta đồng ý. Nhưng chúng ta sẽ quan sát, chúng ta sẽ chờ đợi..."
 KET_INTEGRATE_01:0 "Người [From.GetSpeciesNamePlural] muốn sáp nhập hai bầy của chúng ta sao, §Hkssk?§!"
 KET_INTEGRATE_PROPOSE_01:0 "Đế chế [Root.GetName] nên kết hợp lại, nên trở thành một phần vĩnh viễn của [From.GetName]!"
 KET_INTEGRATE_ACCEPT_01:0 "Rất tốt. Chúng ta sẽ hợp nhất bầy! Chúng ta sẽ trở thành một."
 KET_CANCEL_INTEGRATE_01:0 "Lập trường của bạn đã thay đổi sao? Bạn không còn muốn Viễn Tâm làm một với bầy của bạn nữa à?"
 KET_CANCEL_INTEGRATE_ACCEPT_01:0 "Như bạn nói đấy, §Hkssk!§! Viễn Tâm sẽ vẫn là của bạn, nhưng tách biệt."
 KET_FORM_DP_SELECT:0 "Người [From.GetSpeciesNamePlural] sẽ yểm trợ chúng ta, §Hkssk§!, và chúng ta sẽ yểm trợ các bạn chứ?"
 KET_FORM_DP_PROPOSE:0 "Viễn Tâm cần đồng minh, cần bạn bè, §Hkssk!§! Nếu chúng ta yểm trợ các bạn, các bạn sẽ yểm trợ chúng ta chứ?"
 KET_FORM_DP_ACCEPT:0 "Tuyệt vời, được thôi. Viễn Tâm sẽ bảo vệ bầy của bạn. Đế chế [From.GetName] sẽ bảo vệ bầy của chúng ta."
 KET_FORM_DP_REFUSE:0 "Lợi ích ư? Không. Không đủ lợi lộc. Chúng ta không thể mạo hiểm bạn bầy của mình vì người [From.GetSpeciesNamePlural]."
 KET_BREAK_DP_SELECT:0 "Bạn không còn muốn Viễn Tâm yểm trợ bạn nữa sao?"
 KET_BREAK_DP_PROPOSE:0 "Chúng ta nhận được quá ít. Chúng ta mất đi quá nhiều. Chúng ta không thể tiếp tục yểm trợ các bạn nữa, [Root.GetSpeciesName]."
 KET_BREAK_DP_ACCEPT:0 "Rất tốt, như bạn nói, [From.GetSpeciesName]. Các bầy của chúng ta sẽ không còn bảo vệ lẫn nhau nữa."
 KET_FORM_NAP_SELECT:0 "Bạn muốn một lời hứa không xâm lược sao?"
 KET_FORM_NAP_PROPOSE:0 "Bầy [Root.GetName] nên là đồng minh của Viễn Tâm. Nên là bạn bè. Nên hứa không xâm lược lẫn nhau, §Hkssk!§!"
 KET_FORM_NAP_ACCEPT:0 "Không xâm lược, chúng ta hứa đấy, §Hkssk!§!"
 KET_FORM_NAP_REFUSE:0 "Chúng ta đã quyết định rồi. Chúng ta sẽ không đưa ra lời hứa nào cả!"
 KET_BREAK_NAP_SELECT:0 "Bạn muốn phá vỡ hiệp ước không xâm lược giữa các bầy của chúng ta sao?"
 KET_BREAK_NAP_PROPOSE:0 "$KET_BREAK_DP_PROPOSE_01$"
 KET_BREAK_NAP_ACCEPT:0 "Tâm trí của chúng ta đã thay đổi. Chúng ta có thể muốn xâm lược. Chúng ta có thể không. §HKssk kssk!§! Chúng ta không thể tiếp tục giữ lời hứa nữa!"
 KET_GUARANTEE_SELECT:0 "Bạn sẽ bảo vệ nền tự do của Viễn Tâm chứ, [From.GetSpeciesName]?"
 KET_GUARANTEE_PROPOSE:0 "Bầy của bạn sẽ không bị trói buộc, không bị ai cai trị chứ? §HKssk kssk kssk!§! Viễn Tâm sẽ ủng hộ, sẽ bảo đảm."
 KET_GUARANTEE_ACCEPT:0 "Vậy thì kẻ thù của chúng ta sẽ có nhiều thứ để mất, nhiều điều để sợ đấy, §Hkssk!§!"
 KET_REVOKE_GUARANTEE_SELECT:0 "Bạn sẽ không còn bảo vệ nền tự do của Viễn Tâm nữa sao?"
 KET_REVOKE_GUARANTEE_PROPOSE:0 "Tâm trí của chúng ta đang cần thiết ở nơi khác, §Hkssk!§! Chúng ta không thể tiếp tục trông nom vùng đất của các bạn nữa!"
 KET_REVOKE_GUARANTEE_ACCEPT:0 "Lũ phản bội! Các bạn để mặc bầy của chúng ta bị bao vây bởi kẻ thù!"
 KET_SUPPORT_INDEPENDENCE_SELECT:0 "Bạn sẽ giúp giải phóng Viễn Tâm khỏi những kẻ thống trị chúng ta chứ?"
 KET_SUPPORT_INDEPENDENCE_PROPOSE:0 "Người [Root.GetSpeciesNamePlural] đang bị nhốt trong lồng, không được tự do. Chúng ta sẽ giúp đỡ, sẽ ủng hộ! Nhưng phải có một cái giá..."
 KET_SUPPORT_INDEPENDENCE_ACCEPT:0 "Vậy thì chúng ta sẽ kêu gọi các bạn, khi thời điểm chín muồi..."
 KET_REVOKE_INDEPENDENCE_SELECT:0 "§HKssk!§! Bạn muốn rút lại lời hứa sao?"
 KET_REVOKE_INDEPENDENCE_PROPOSE:0 "Những vấn đề lớn hơn đang đè nặng lên tâm trí chúng ta, §Hkssk kssk!§! Chúng ta không thể tiếp tục hỗ trợ nền tự do của các bạn nữa, [Root.GetSpeciesName]."
 KET_REVOKE_INDEPENDENCE_ACCEPT:0 "Vậy thì hãy cầm lấy lời hứa bị rút lại của bạn và biến đi, §Hkssk!§!"
 KET_FORM_MIGRATION_PACT_SELECT:0 "Bạn muốn Viễn Tâm di chuyển giữa bầy của bạn sao?"
 KET_FORM_MIGRATION_PACT_PROPOSE:0 "Hỡi [Root.GetSpeciesName]! Bầy của bạn mạnh mẽ, thông minh, nhanh nhẹn. §HKssk!§! Viễn Tâm chúng ta muốn di chuyển giữa bầy của bạn."
 KET_FORM_MIGRATION_PACT_ACCEPT:0 "Tốt, xuất sắc. Các bầy của chúng ta sẽ hòa nhập, sẽ được sẻ chia!"
 KET_FORM_MIGRATION_PACT_REFUSE:0 "Không. Chúng ta sẽ không sống giữa người [From.GetSpeciesNamePlural], sẽ không chia sẻ!"
 KET_BREAK_MIGRATION_PACT_SELECT:0 "Người [From.GetSpeciesNamePlural] không còn muốn Viễn Tâm di chuyển tự do giữa bầy của họ nữa sao?"
 KET_BREAK_MIGRATION_PACT_PROPOSE:0 "Chúng ta không còn muốn chia sẻ, không còn muốn sống và di chuyển giữa người [Root.GetSpeciesNamePlural] nữa!"
 KET_BREAK_MIGRATION_PACT_ACCEPT:0 "Vậy thì chúng ta sẽ thu mình lại, §Hkssk!§!"
 KET_OPEN_BORDERS_SELECT:0 "Bạn sẽ mở toang bức tường của mình cho Viễn Tâm chứ?"
 KET_OPEN_BORDERS_PROPOSE:0 "Bạn có thể di chuyển qua không gian bầy đàn của chúng ta, §Hkssk!§! Chỉ cần đừng cố gắng ở lại!"
 KET_OPEN_BORDERS_ACCEPT:0 "Vậy thì chúng ta sẽ di chuyển tự do qua không gian bầy đàn của các bạn. §HKssk kssk kssk!§!"
 KET_CLOSE_BORDERS_SELECT:0 "Bạn sẽ đóng cửa không gian bầy đàn của mình đối với Viễn Tâm sao?"
 KET_CLOSE_BORDERS_PROPOSE:0 "Hỡi [Root.GetSpeciesName]! Chúng ta không còn muốn tàu của các bạn di chuyển qua không gian bầy đàn của chúng ta nữa. Hãy biến đi!"
 KET_CLOSE_BORDERS_ACCEPT:0 "Vậy thì hãy giữ lấy không gian bầy đàn cho riêng bạn đi! Nhưng chúng ta sẽ không trả lại phế liệu của bạn đâu, §Hkssk!§!"
 KET_KICK_FROM_ALLIANCE_SELECT:0 "Bạn không muốn Viễn Tâm ở trong Đại Bầy Đàn của bạn sao? Một sai lầm, một bước đi trật hướng."
 KET_KICK_FROM_ALLIANCE_PROPOSE:0 "§HKssk!§! Bạn mang lại sự bất an cho Đại Bầy Đàn! Bạn sẽ phải rời khỏi nó ngay bây giờ, §Hkssk!§!"
 KET_KICK_FROM_ALLIANCE_ACCEPT:0 "Tốt thôi! Được thôi! Một bầy vô dụng, liên minh [From.GetAllianceName]. Viễn Tâm chúng ta sẽ mạnh mẽ hơn khi ở một mình!"
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_SELECT:0 "Bạn muốn Viễn Tâm liên kết với Đại Bầy Đàn của bạn sao?"
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_PROPOSE:0 "Hỡi những người [Root.GetSpeciesNamePlural], những người bạn. Liên minh [From.GetAllianceName] muốn mở rộng tới bạn. Chưa sẵn sàng gia nhập Đại Bầy Đàn, chưa, chưa phải lúc. Nhưng với tư cách là một đối tác liên kết thì sao?"
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_ACCEPT:0 "Rất tốt. Viễn Tâm chúng ta sẽ xích lại gần hơn với Đại Bầy Đàn của các bạn."
 KET_OFFER_FEDERATION_ASSOCIATION_STATUS_REFUSE:0 "Đại Bầy Đàn của các bạn không làm chúng ta quan tâm, §Hkssk!§!"
 KET_REVOKE_FEDERATION_ASSOCIATION_STATUS_SELECT:0 "Đại Bầy Đàn không còn mong muốn liên lạc với chúng ta nữa sao, §Hkssk?§!"
 KET_REVOKE_FEDERATION_ASSOCIATION_STATUS_PROPOSE:0 "Tư cách liên kết của các bạn: bị thu hồi! Đại Bầy Đàn không còn muốn người [Root.GetSpeciesNamePlural] ở trong hàng ngũ nữa!"
 KET_REVOKE_FEDERATION_ASSOCIATION_STATUS_ACCEPT:0 "$KET_KICK_FROM_ALLIANCE_ACCEPT$"
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_SELECT:0 "Đại Bầy Đàn của các bạn muốn nói chuyện với chúng ta sao, §Hkssk?§!"
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_PROPOSE:0 "Đại Bầy Đàn của các bạn. Chúng ta muốn nói chuyện với các bạn, ở gần các bạn. Một sự liên kết, §Hkssk!§!"
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_ACCEPT:0 "Được, tốt lắm. Đại Bầy Đàn sẽ liên kết với [From.GetName]."
 KET_ASK_FEDERATION_ASSOCIATION_STATUS_REFUSE:0 "Không. Chúng ta không muốn người [From.GetSpeciesNamePlural], không muốn họ ở trong Đại Bầy Đàn!"
 KET_END_FEDERATION_ASSOCIATION_STATUS_SELECT:0 "Bạn muốn rút lui, không còn nói chuyện với Đại Bầy Đàn nữa sao?"
 KET_END_FEDERATION_ASSOCIATION_STATUS_PROPOSE:0 "§HKssk kssk kssk!§! Bầy của bạn chậm chạp, ngu ngốc, không xứng đáng! Các bạn sẽ không còn là một đối tác liên kết nữa!"
 KET_END_FEDERATION_ASSOCIATION_STATUS_ACCEPT:0 "Vậy thì hãy rời đi, biến đi! Chúng ta sẽ không còn liên kết với bầy [From.GetName] nữa."
 KET_DEMAND_TRIBUTARY_SELECT:0 "Bạn muốn cống nạp sao, §Hkssk?§! Bạn muốn phế liệu, đá quý và dây điện à?"
 KET_DEMAND_TRIBUTARY_PROPOSE:0 "Bầy [Root.GetName] đã chín muồi, yếu ớt! Nhưng chúng ta có thể để các bạn yên ổn. Hãy giao phế liệu cho chúng ta, hãy giao kim loại, dây điện và đá quý cho chúng ta!"
 KET_DEMAND_TRIBUTARY_ACCEPT:0 "Rất tốt, được thôi. Chúng ta sẽ mang quà đến cho các bạn. Đổi lại, các bạn phải để Viễn Tâm yên. §HKssk!§!"
 KET_DEMAND_TRIBUTARY_REFUSE:0 "Không! Chúng ta sẽ không làm vậy! Chúng ta không cần những lời hứa của người [From.GetAdj]. Các bạn sẽ không nhận được gì từ chúng ta đâu."
 KET_ASK_BECOME_TRIBUTARY_SELECT:0 "§HKssk!§! Bạn muốn cống nạp cho Viễn Tâm sao?"
 KET_ASK_BECOME_TRIBUTARY_PROPOSE:0 "Người [Root.GetSpeciesNamePlural] có quan tâm đến kim loại không? Dây điện? Kiến thức? Đá quý? Chúng ta có những thứ này, §Hkssk!§! Hãy để chúng ta yên ổn, và chúng ta sẽ cống nạp cho các bạn."
 KET_ASK_BECOME_TRIBUTARY_ACCEPT:0 "Rất tốt. Hãy nộp cống cho chúng ta, tặng quà cho chúng ta, và chúng ta sẽ để các bạn yên!"
 KET_ASK_BECOME_TRIBUTARY_REFUSE:0 "Không. Chúng ta không muốn, §Hkssk§!, không có nhu cầu về các bạn!"
 KET_INSULT_01:0 "Có chuyện gì? Hãy nói ra lời của bạn đi!"
 KET_INSULT_PROPOSE_01:0 "§HKssk!§! Tâm trí [Root.GetSpeciesAdj] yếu ớt của các bạn thậm chí không thể nối một cổng xả vào máy nén vật chất ngay cả khi tính mạng của các bạn phụ thuộc vào nó!"
 KET_INSULT_PROPOSE_02:0 "§HKssk kssk kssk!§! Ngay cả phế liệu của bầy các bạn cũng không thích hợp để tái sử dụng."
 KET_INSULT_ACCEPT_01:0 "Thật bẩn thỉu. Độc ác. Chúng ta sẽ ghi nhớ điều này."
 action.37.desc.ketlings:1 "Chúng tôi đầu hàng, chúng tôi chịu thua! Hãy gọi hạm đội của bạn về và đi đi, §Hkssk§!"
 action.38.desc.ketlings:1 "Đúng thế! Chúng ta đã chiến thắng, chúng ta đã vượt qua! Hãy quay lại đây lần nữa, nếu các bạn có quá nhiều kim loại, đá quý và tính mạng!"
 action.39.desc.ketlings:0 "Rất tốt. Không có người thắng cuộc, không có kẻ chiến thắng. Chỉ có những sinh mạng đã mất, những phế liệu đã tan tành..."
