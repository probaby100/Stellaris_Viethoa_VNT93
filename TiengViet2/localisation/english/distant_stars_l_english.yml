 MEDIUM_AUTOCANNON_4:0 "$AUTOCANNON_4$"
 MEDIUM_AUTOCANNON_4_DESC:0 "$AUTOCANNON_4_DESC$"
 LARGE_AUTOCANNON_4:0 "$AUTOCANNON_4$"
 LARGE_AUTOCANNON_4_DESC:0 "$AUTOCANNON_4_DESC$"
 tech_nanite_flak_batteries:0 "Pháo Phòng Không Robot Nano"
 tech_nanite_flak_batteries_desc:0 "Cải tiến dựa trên các thiết kế trước đây bằng cách phóng ra các ống chứa đầy robot nano háu ăn, xé toạc các phi đội tàu bay chiến đấu của đối phương."
 FLAK_BATTERY_4:0 "$tech_nanite_flak_batteries$"
 FLAK_BATTERY_4_DESC:0 "$tech_nanite_flak_batteries_desc$"
 TIYANKI_ARMOR:0 "Giáp Tiyanki"
 TIYANKI_ARMOR_DESC:0 "Lớp da của Tiyanki Đầu Đàn đã được tôi luyện và chai sạn qua năm tháng cùng các quá trình sinh học kỳ diệu."
 SMALL_TIYANKI_ARMOR:0 "Giáp Tiyanki Nhỏ"
