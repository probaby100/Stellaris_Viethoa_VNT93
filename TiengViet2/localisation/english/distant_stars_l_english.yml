 ketling_army:0 "$NAME_Ketling_Army$"
 ketling_army_desc: "Một lực lượng chiến đấu dũng mãnh gồm các chiến binh Ketling tinh nhuệ, được trang bị vũ khí tái chế nhưng vô cùng nguy hiểm."

