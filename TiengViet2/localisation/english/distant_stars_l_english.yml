 apoc.1.b.desc:0 "Chúng ta đã chạm trán một Cổng Siêu Không Gian bị bỏ hoang khác, lần này là trong hệ sao §H[gateway_system.GetName]§!. Không giống như cổng trước đó, Cổng này không bị thay đổi theo bất kỳ cách rõ ràng nào và các bản quét của chúng ta chỉ ra rằng nó vẫn được kết nối với phần còn lại của mạng lưới. Tuy nhiên, nó hiện không thể hoạt động do tình trạng xuống cấp nghiêm trọng."
 apoc.3.b.desc:0 "Chúng ta đã chạm trán một Cổng Siêu Không Gian bị bỏ hoang khác, lần này ở gần §H[gateway_system.GetName]§!. Nó dường như được chế tạo hoàn toàn bởi các §HCỗ Máy Nano§! vi mô với thiết kế chưa từng được biết đến.\n\nKhông giống như cấu trúc trước, Cổng này đã bị thay đổi đáng kể kể từ lần xây dựng ban đầu. Kết nối của nó với phần còn lại của mạng lưới đã bị cắt đứt - thay vào đó, điểm đến hợp lệ duy nhất là một nhóm sao chưa được lập bản đồ ngay ngoài rìa thiên hà của chúng ta, được các nhà thiên văn học của chúng ta đặt tên là §HCụm Sao L§!.\n\nMặc dù Cổng phát ra một tín hiệu năng lượng yếu ớt, nó đã bị cố tình khóa vào một loại vòng lặp bảo trì ngăn cản việc kích hoạt nó. Cho đến khi chúng ta tìm ra cách hủy bỏ quy trình này, Cụm Sao L sẽ vẫn nằm ngoài tầm với của chúng ta."
 pirate.26.desc:0 "Tàu [pirate_slayers.GetName] đã phá hủy một trạm cướp biển trong hệ sao [pirate_slayers.GetStarName], và thu hồi mô-đun phòng kiên cố của nó.\n\nNgoài các tài nguyên bị đánh cắp khác nhau, mô-đun này còn chứa một thiết bị dữ liệu cổ xưa với các sơ đồ một phần của thứ dường như là một Cổng Siêu Không Gian dưới không gian. Không có hồ sơ nào về nơi bọn cướp biển thu được thiết bị dữ liệu bí ẩn này, nhưng nó đã nâng cao hiểu biết của chúng ta về cách thức hoạt động của mạng lưới Cổng thiên hà."
 LCLUSTER_PROJECT:0 "Kích Hoạt Cổng L"
 LCLUSTER_PROJECT_DESC:0 "Các nhà khoa học của chúng ta hiện tin tưởng rằng kiến thức của chúng ta về các Cổng L và công nghệ đằng sau chúng đã đủ để hủy bỏ chu kỳ bảo trì mà chúng bị khóa vào. Nếu nỗ lực thành công, Cổng L trong hệ sao §H[candidate_gateway_system.GetName]§! sẽ cho phép tiếp cận ngay lập tức đến Cụm Sao L xa xôi.\n\nBất kỳ Cổng L bổ sung nào trong thiên hà có khả năng cũng sẽ đi vào hoạt động trong vòng vài năm, nhưng điều này sẽ mang lại cho chúng ta một bước khởi đầu đáng kể."
 distar.10904.name:0 "Đã Thu Thập Manh Mối Cổng L"
 distar.10904.desc:0 "Chúng ta hiện đã thu thập đủ manh mối Cổng L để nghiên cứu công nghệ đằng sau chúng. Khi điều này hoàn tất, một trong những Tàu Khoa Học của chúng ta sẽ có thể hủy bỏ chu kỳ bảo trì vĩnh viễn mà chúng đang mắc kẹt.\n\nCụm Sao L gần như đã nằm trong tầm tay của chúng ta!"
 distar.10905.name:0 "Mở Khóa Cụm Sao L"
 distar.10905.desc:0 "Các nhà khoa học của chúng ta hiện tin tưởng rằng kiến thức của chúng ta về các Cổng L và công nghệ đằng sau chúng đã đủ để hủy bỏ chu kỳ bảo trì của chúng. Nếu nỗ lực thành công, Cổng L trong hệ sao §H[candidate_gateway_system.GetName]§! sẽ cho phép tiếp cận ngay lập tức đến Cụm Sao L xa xôi.\n\nKhi chu kỳ bảo trì kết thúc, bất kỳ Cổng L bổ sung nào trong thiên hà có khả năng cũng sẽ đi vào hoạt động trong vòng vài năm khi phần mềm tự hiệu chỉnh của chúng tái điều chỉnh. Tuy nhiên, điều này sẽ mang lại cho chúng ta một bước khởi đầu đáng kể để khám phá cụm sao mà không bị cản trở."
 distar.10905.a:0 "Chuẩn bị dự án."
 distar.10951.name:0 "Liên Kết Được Thiết Lập"
 distar.10951.desc:0 "Sau khi tiến hành một quy trình phức tạp bao gồm các vụ nổ ion có định hướng và các lệnh ghi đè giao thức cấp thấp, chúng ta đã khởi động lại thành công Cổng L trong hệ sao §H[candidate_gateway_system.GetName]§! và hủy bỏ chu kỳ bảo trì của nó.\n\nChúng ta sẽ là những người đầu tiên tiến vào Cụm Sao L từ thiên hà của chúng ta sau hàng vạn năm!"
 distar.10951.a:0 "Một ngày tuyệt vời!"
 distar.10952.name:0 "Dự Án Thất Bại"
 distar.10952.desc:0 "Đế chế §H[From.GetName]§! đã dỡ bỏ thành công phong tỏa khỏi Cổng L dưới quyền kiểm soát của họ! Họ hiện có toàn quyền tiếp cận §HCụm Sao L§! xa xôi.\n\nThật không may, điều này đã làm đình trệ dự án kích hoạt Cổng L của chính chúng ta. Ngoài cổng đang hoạt động, tất cả các Cổng L khác trong thiên hà hiện đã kích hoạt một loại phần mềm tự sửa lỗi có thể chấm dứt chu kỳ bảo trì của chúng trong vòng vài năm.\n\nTuy nhiên, hiện tại cách duy nhất để đến được cụm sao là thông qua cổng thuộc về [From.GetName]!"
 distar.10952.a:0 "Nhưng chúng ta đã ở rất gần rồi mà!"
 distar.10953.name:0 "Đã Tiếp Cận Cụm Sao L"
 distar.10953.desc:0 "Đế chế §H[From.GetName]§! đã dỡ bỏ thành công phong tỏa khỏi Cổng L dưới quyền kiểm soát của họ! Họ hiện có toàn quyền tiếp cận Cụm Sao L xa xôi.\n\nNhư một tác dụng phụ rõ ràng của điều này, tất cả các Cổng L khác trong thiên hà cũng đang có dấu hiệu gia tăng hoạt động. Với tốc độ mà phần mềm tự sửa lỗi của chúng đang thực hiện điều chỉnh, chu kỳ bảo trì của chúng cũng sẽ kết thúc trong vòng vài năm."
 distar.10953.a:0 "Họ đã đi trước chúng ta một bước."
 distar.10954.desc:0 "Bằng cách khôi phục năng lượng cho một loại cổng dưới không gian cổ đại bên trong biên giới của họ, đế chế §H[From.GetName]§! đã có quyền tiếp cận vào một cụm sao biệt lập ở rìa thiên hà của chúng ta! Nhóm sao này, mà họ gọi là \"Cụm Sao L\", không thể tiếp cận bằng các tuyến siêu không gian - chỉ có thể qua các Cổng L này."
 graygoo.13.desc:0 "Các nhà khoa học từ §H[From.GetName]§! bằng cách nào đó đã thiết lập được kết nối vĩnh viễn tới một nhóm sao xa xôi, được các nhà thiên văn học của họ gọi là \"Cụm Sao L\", vốn trước đây bị cô lập khỏi thiên hà. Thật không may, điều này đã kích hoạt một cuộc xâm lược thiên hà của chúng ta bởi các cư dân của cụm sao - những cỗ máy nano hung hãn tấn công mọi thứ trong tầm mắt!\n\nChúng đang tràn ra từ các cổng dưới không gian được chỉ định là Cổng L, và mọi nỗ lực liên lạc với chúng đều thất bại. Theo sau sự di chuyển của chúng qua các cổng, chúng ta đã phát hiện các tín hiệu phát ra từ cụm sao mà chúng xuất phát."
 begin_lcluster_chain:0 "Cập Nhật Nhật Ký Tình Hình: Cụm Sao L"
 distar.10901.title:0 "Cần Cổng L"
 distar.10901.desc:0 "Mặc dù chúng ta đã tích lũy được rất nhiều thông tin về các Cổng L và công nghệ của chúng, chúng ta lại không sở hữu một cánh cổng thực tế nào.\n\nTrước khi dự án này có thể tiếp tục, chúng ta phải giành được quyền sở hữu một hệ sao có Cổng L."
 distar.10901.a:0 "Vậy thì chúng ta sẽ đảm bảo một Cổng L."
 distar.10901.b:0 "Một sự chuyển hướng thú vị, nhưng nó kết thúc ở đây."

 # SHIPS & FLEETS:
 leviathan_01_voidspawn:0 "Quái Thú Hư Không"
 leviathan_01_voidspawn_cap: "$leviathan_01_voidspawn$"
 leviathan_01_voidspawn_plural:0 "Quái Thú Hư Không"

 # MODIFIERS:
 hatchling_power:0 "Sức Mạnh Quái Thú Hư Không"
 curator_buff_hatchling:0 "Lớp Phủ Bảo Vệ"
 curator_buff_hatchling_desc:0 "Tuân theo lời khuyên của Người Giám Quản, chúng ta đã phủ lên các con tàu của mình một lớp bảo vệ che chở chúng khỏi nước bọt ăn mòn và những chiếc gai của Quái Thú Hư Không."
 enigmatic_cache_in_orbit:0 "Nghiên Cứu Ngoại Lai"
 enigmatic_cache_in_orbit_desc:0 "Chừng nào kho chứa bí ẩn còn nằm trên quỹ đạo, các nhà khoa học của chúng ta sẽ có nhiều cơ hội để nghiên cứu."
 enigmatic_cache_in_orbit_phobe:0 "Nỗi Dằn Vặt Hình Ống"
 enigmatic_cache_in_orbit_phobe_desc:0 "Người dân của chúng ta sẽ không thể có một giấc ngủ trọn vẹn chừng nào thứ khí cụ ngoài hành tinh tồi tàn đó còn lơ lửng trên quỹ đạo."

 # ANOMALY CATEGORIES
 stolen_ship_cat:0 "Chiến Hạm Vũ Trang"
 stolen_ship_cat_desc:0 "Các bản quét sơ bộ đối với [From.GetName] chỉ ra rằng một con tàu vũ trang hạng nặng đang nằm trên quỹ đạo của tiểu hành tinh. Sẽ là khôn ngoan nếu tiến hành thận trọng."
 transmitter_cat:0 "Liên Lạc Mã Hóa"
 transmitter_cat_desc:0 "Chúng ta đã bắt gặp một luồng dữ liệu được mã hóa truyền đi từ một địa điểm trên [From.GetName]."

 # PROJECTS
 INVISIBLE_DEATH:0 "Các Phòng Thí Nghiệm Xvan"
 INVISIBLE_DEATH_DESC:0 "Chúng ta đã xác định được vị trí của Các Phòng Thí Nghiệm Xvan - một tập hợp ẩn giấu gồm các cấu trúc hình kim tự tháp được xây dựng từ một vật liệu chưa rõ, bị chìm ngập dưới các lớp cát và bụi. Chúng ta sẽ phải khai quật các cơ sở trước khi có thể khám phá chúng, nhưng nếu các giả định của quân nổi loạn là chính xác, số vũ khí bên trong sẽ rất đáng để bỏ công sức."
 ICE_ALIEN:0 "Sinh Vật Ngoài Hành Tinh Trong Băng"
 ICE_ALIEN_DESC:0 "Bị mắc kẹt bên trong một tảng băng khổng lồ là hài cốt của một dạng sống, thuộc loại chưa từng thấy trước đây. Ai biết được nó đã du hành bao xa qua không gian và thời gian.\n\nCác nhà nghiên cứu của chúng ta đã chuẩn bị những bước cần thiết để hồi sinh nó."
 ENIGMATIC_CACHE_PROJECT:1 "Một Vị Khách Bí Ẩn"
 ENIGMATIC_CACHE_PROJECT_DESC:0 "Một thực thể ngoài hành tinh bí ẩn đã tiến vào quỹ đạo của [Root.GetName]. Sẽ là khôn ngoan nếu xác định mục đích của nó ở đây càng sớm càng tốt."
 distar.1050.a.tooltip:0 "Kích hoạt liên lạc với người [delicious_aliens.GetName], loài sinh vật ngoài hành tinh ngon lành nhất thiên hà."
 GATEWAY_INTERFERENCE:0 "Gây Nhiễu Cổng Siêu Không Gian"
 GATEWAY_INTERFERENCE_DESC:0 "Một đế chế chưa rõ từng cố gắng xâm nhập vào Mạng lưới Cổng L cổ đại bằng chùm tia gây nhiễu khi họ bị tấn công và chùm tia bị hư hại. Có lẽ chùm tia này có thể được phục hồi."

# PLANET CLASSES
 pc_egg_cracked:0 "Thế Giới Vỡ Vụn"
 pc_egg_cracked_desc:0 "Các mảnh vỡ vụn của một quả trứng khổng lồ có kích thước bằng cả hành tinh."

