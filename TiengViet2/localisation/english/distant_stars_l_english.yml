# PROJECTS:
 GENERATION_SHIP:0 "Tàu Thế Hệ"
 GENERATION_SHIP_DESC:0 "Một tàu thế hệ khổng lồ thuộc về một chủng tộc ngoài hành tinh đã chết từ lâu, thiết bị dẫn đường của nó có thể chứa tọa độ của một hành tinh hoàn hảo."
 HIDDEN_PLANET:0 "Cố Đấm Ăn Xôi"
 HIDDEN_PLANET_DESC:1 "Phóng một đầu dò xuống bề mặt hành tinh sẽ cho phép chúng ta giải mã xem liệu thế giới cằn cỗi vô hồn trước mắt có thực sự là thiên đường trong truyền thuyết của người Mardak Vol hay không."
 STAR_LIFTING:0 "Bệ Phóng Sao Bỏ Hoang"
 STAR_LIFTING_DESC:0 "Một giàn bệ đổ nát mang thiết kế cổ xưa của người ngoài hành tinh đang quay quanh [star_lifting_star.GetName]. Nếu chúng ta có thể sửa chữa nó, cơ sở này có thể khai thác trực tiếp vật chất từ ngôi sao."
 STAR_LIFTING_WEAPONS:0 "Bệ Phóng Sao Bỏ Hoang"
 STAR_LIFTING_WEAPONS_DESC:0 "Một giàn bệ đổ nát mang thiết kế cổ xưa của người ngoài hành tinh đang quay quanh [star_lifting_star.GetName]. Nó sở hữu một số công nghệ chùm vi ba mang tính thử nghiệm rất cao, có thể cải biến thành một vũ khí đáng gờm."
 BIG_RIP:0 "Trạm Quan Sát Bỏ Hoang"
 BIG_RIP_DESC:0 "Các ổ lưu trữ dữ liệu trên trạm quan sát quay quanh [big_rip_planet.GetName] đã bị xóa sạch. Chúng ta phải cử người xuống bề mặt hành tinh mới có thể tìm hiểu chuyện gì đã xảy ra với những người quan sát."
 THE_CUBE:0 "Khối Lập Phương"
 THE_CUBE_DESC:0 "Việc phát hiện ra một khối kim loại nhỏ với các mặt màu sắc khác nhau đã thu hút sự tò mò vô tận của Sĩ quan Khoa học [cube_science_officer.GetName]."
 STAR_CRAZY:0 "Những Ngôi Sao Đập Theo Nhịp"
 STAR_CRAZY_DESC:0 "Một vài ngôi sao trong thiên hà đã bắt đầu nhấp nháy phát xung kỳ lạ. Thủy thủ đoàn lo sợ đây là do lỗi thiết bị, nhưng Sĩ quan Khoa học [Root.GetLeaderName] muốn điều tra kỹ lưỡng."
 WEAPONS_TESTING:0 "Vũ Khí Ngoại Tộc"
 WEAPONS_TESTING_DESC:0 "Chúng ta đã thu thập tàn tích của các vũ khí ngoài hành tinh từng được thử nghiệm quy mô lớn trên [From.GetName] để phân tích."
 SHATTERED_EGG:0 "Mảnh Vỡ Vỏ Trứng"
 SHATTERED_EGG_DESC:0 "Bằng cách nào đó, trứng của Mầm Mống Hư Không đã tiến hóa để sống sót trong không gian khắc nghiệt nhờ hấp thụ nhiệt từ ngôi sao gần đó. Có lẽ những mảnh vỡ này sẽ tiết lộ bí mật của nó."
 MEND_SHIELD:0 "Phục Hồi Khiên Hành Tinh"
 MEND_SHIELD_DESC:0 "Lớp khiên cổ đại bao bọc nền văn minh bò sát có tri giác trên [time_loop_world.GetName] đang rạn nứt do nhiệt lượng và thiếu bảo trì. Chúng ta phải sửa chữa nó trước khi quá muộn."
 STOP_TIME_LOOP:0 "Phá Vỡ Vòng Lặp Thời Gian"
 STOP_TIME_LOOP_DESC:0 "Tập trung hỏa lực vào điểm suy yếu của lớp khiên bao bọc [time_loop_world.GetName] có thể phá vỡ hoàn toàn vòng lặp thời gian giam cầm thế giới này."
 # AMBIENT OBJECTS:
 broken_star_lifting_platform:0 "Bệ Phóng Sao Bỏ Hoang"
 broken_star_lifting_platform_desc:0 "Một bệ phóng bỏ hoang mang thiết kế ngoại tộc chưa xác định đang trôi dạt vô định quanh một ngôi sao."
