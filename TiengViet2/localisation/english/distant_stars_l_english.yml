 sr_distar_nanodust:0 "Bụi Xám"
 sr_distar_nanodust_desc:0 "Một hỗn hợp các nguyên tố bị phân rã thành vật chất dạng hạt. Khi được phân tán khắp một thế giới, Bụi Xám có thể được kích hoạt bởi các cỗ máy nano để nhanh chóng làm thay đổi các điều kiện hành tinh."
 sr_distar_nanocrystal:0 "Tinh Thể Xám"
 sr_distar_nanocrystal_desc:0 "Sản phẩm phụ dạng tinh thể từ hoạt động nhất định của robot nano thể hiện các tương tác kỳ lạ với các vật liệu nano khác, gợi ý về những sự thật ẩn giấu vượt ra ngoài thang đo Planck."
 sr_distar_nanoscale:0 "Vảy Xám"
 sr_distar_nanoscale_desc:0 "Phân bón nhân tạo đậm đặc được thiết kế để hồi sinh các sinh quyển bị tàn phá."
 sr_distar_nanoactuator:0 "Cơ Cấu Chấp Hành Xám"
 sr_distar_nanoactuator_desc:0 "Các cơ cấu chấp hành nano đơn giản nhưng mạnh mẽ, cho phép thực hiện các thao tác và thí nghiệm phức tạp ở thang đo trung mô."

