 KETLING_PROJECT_3_DESC:1 "Các sinh vật có tri giác đã xuất hiện từ những đống phế liệu trên §Y[ratling_planet_3.GetName]§!. Các nhà khoa học của chúng ta rất tò mò liệu những sinh vật ngoài hành tinh này, được mệnh danh là $NAME_Ketlings$, là hậu duệ của nền văn minh du hành vũ trụ từng bao trùm các hệ sao này, hay họ có một nguồn gốc hoàn toàn khác.\n\nChúng ta có thể chọn bất kỳ hành tinh nào có $NAME_Ketlings$ tự trị sinh sống để tiến hành nghiên cứu này."
