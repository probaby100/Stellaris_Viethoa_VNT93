 distar.57.name:0 "Cái Chết Của Trùng Biến Hình"
 distar.57.desc:1 "Tin tức về cái chết của [From.Fleet.GetName] nhanh chóng lan khắp [Root.GetName], dù không một ai chịu ảnh hưởng nặng nề bằng Sĩ quan Khoa học [amoeba_finding_scientist.GetName]. Chính [amoeba_finding_scientist.GetSheHe] là người đầu tiên phát hiện ra Trùng Biến Hình Không Gian khi còn là một con non lạc lối, và nhìn sinh vật này lớn khôn dưới sự dìu dắt của [amoeba_finding_scientist.GetHisHer].\n\nGiờ đây, thiếu vắng sự bầu bạn tĩnh lặng của [From.Fleet.GetName], Sĩ quan [amoeba_finding_scientist.GetName] có lẽ sẽ chẳng bao giờ còn như trước nữa."
 distar.57.a:0 "Thật đáng tiếc."
 distar.304.name:0 "Thực Thể Trăm Tuổi"
 distar.304.desc:0 "Tin tức phấn khởi từ các chỉ huy hạm đội của chúng ta đang được phát sóng khắp [Root.Capital.GetName]. Chú Trùng Biến Hình không gian được nhận nuôi của chúng ta, [lost_amoeba_centenarian_fleet.GetName], vừa tròn một trăm tuổi.\n\nDù đã là một cụ già trăm tuổi, thời gian dường như không phải là trở ngại đối với đồng minh dạng amip của chúng ta. Trên thực tế, các hạm đội báo cáo rằng sự hiện diện của [lost_amoeba_centenarian_fleet.GetName] trên chiến trường ngày càng trở nên đáng gờm hơn. [lost_amoeba_centenarian_fleet.GetName] đã trở thành một thế lực mà ngay cả những chiến hạm được trang bị tối tân nhất cũng phải dè chừng. Nhìn thấy các chi roi cuồn cuộn của nó tiến vào một hệ sao luôn khơi dậy mạnh mẽ tinh thần của người [Root.GetSpeciesAdj]."
 distar.304.a.tooltip:0 "[lost_amoeba_centenarian_fleet.GetName] đã phát triển thêm các kỹ năng tác chiến mới!"

 distar.60.name:0 "Định Mệnh Chói Lòa"
 distar.60.desc:0 "Những mảnh vỡ bị nhiễm xạ mà thủy thủ đoàn tàu [Root.GetName] phát hiện trên quỹ đạo gần [From.GetName] quả thực là tàn tích của một phi thuyền không gian. Thiết kế kỳ lạ của nó không hề khớp với bất kỳ mẫu chế tạo nào từng được ghi nhận.\n\nChúng ta đã trích xuất được một số dữ liệu từ máy tính hư hỏng của con tàu, được ghi bằng thứ ngôn ngữ ngoài hành tinh chưa từng thấy và không thể dịch được.\n\nQua nghiên cứu tàn tích, Sĩ quan Khoa học [Root.GetLeaderName] phỏng đoán con tàu mang tên 'Kohtalo' đã gặp lỗi điều hướng khi thoát khỏi FTL, đưa nó đến quá gần các tia bức xạ gamma của [From.GetName]. Phần lớn thân tàu đã bị phá hủy bởi sự điện ly xạ. Không có ai sống sót."
 distar.61.name:0 "Ảo Giác Kỳ Lạ"
 distar.61.desc:0 "Cảm biến báo cáo một con tàu mang đặc tính dường như giống hệt với xác tàu ngoài thiên hà được tìm thấy trước đây trong hệ sao [ouroboros_system.GetName] vừa nhảy ra khỏi siêu không gian và tiến vào hệ sao [kohtalo_second_fleet.GetStarName]! Các hệ thống liên lạc của con tàu mang tên Kohtalo này đang phát đi những tín hiệu dồn dập."
 distar.62.name:0 "Ảo Giác Kỳ Lạ"
 distar.62.desc:0 "§EThủy thủ đoàn của con tàu kỳ lạ mang đặc điểm tương đồng với xác tàu tìm thấy trong hệ sao [ouroboros_system.GetName], dù máy dịch thuật không thể giải mã ngôn ngữ của họ, họ vẫn vẫy các chi xúc tu đầy hào hứng khi nhìn thấy chúng ta trên màn hình thị giác.§!"
 distar.62.a:0 "Thử hỏi mục đích họ đến đây là gì."
 distar.63.name:0 "Tàu Kohtalo"
 distar.63.desc:0 "§EChúng ta nhận được một loạt dữ liệu phản hồi - bao gồm hải đồ của các hệ sao lân cận và một đoạn ghi hình ghi lại cảnh các kỹ sư của họ đang hối hả bảo trì một cỗ máy FTL kỳ lạ.\n\nNhìn vào sự phấn khích của họ đối với không phận [Root.GetAdj], dường như họ tin rằng mình là những nhà thám hiểm đầu tiên từ thiên hà của họ đặt chân đến vùng không gian này.§!"
 distar.63.a:0 "Gửi cho họ dữ liệu thu hồi từ hệ sao [ouroboros_system.GetName]."
 distar.64.name:0 "Tàu Kohtalo"
 distar.64.desc:0 "§ENỗi phấn khích của thủy thủ đoàn tàu Kohtalo dường như bốc hơi ngay lập tức. Nhiều thuyền viên bắt đầu điên cuồng thao tác trên bảng điều khiển bằng các xúc tu của mình. Họ truyền sang một bộ dữ liệu, dường như là danh sách hành khách, nhật ký hàng hải và thông số nhận dạng tàu.\n\nNó khớp hoàn toàn 100% với dữ liệu từ xác tàu đổ nát trong hệ sao [ouroboros_system.GetName]...§!"
 distar.64.a:0 "Điều này không thể nào xảy ra..."
 distar.65.name:0 "Tàu Kohtalo"
 distar.65.desc:0 "§EDù vẫn giữ tác phong chuẩn mực của giống loài ngoài hành tinh, sự hoảng loạn của thủy thủ đoàn tàu Kohtalo là không thể che giấu. Các nhà khoa học của chúng ta cho biết nếu sao xung tại [ouroboros_system.GetName] là nguyên nhân gây ra thảm kịch cho con tàu trong tương lai, chúng ta có thể cảnh báo họ tránh xa hệ sao đó.§!"
 distar.65.a:0 "Nếu chúng ta cảnh báo, họ có thể tránh được thảm họa."
 distar.65.a.tooltip:0 "Gửi cho tàu Kohtalo lời cảnh báo hãy tránh xa sao xung trong hệ sao [ouroboros_system.GetName]."
 distar.65.b:0 "Chúng ta không thể mạo hiểm can thiệp sâu hơn vào dòng thời gian."
 distar.65.b.tooltip:0 "Đóng kênh liên lạc."
 distar.66.name:0 "Tàu Kohtalo"
 distar.66.desc:0 "§ENhững nhà thám hiểm ngoài thiên hà bắt đầu vội vã nghiên cứu thông tin hệ sao mà chúng ta vừa gửi, trao đổi bằng ngôn ngữ độc đáo của họ và nhập một chuỗi lệnh mới vào bảng điều khiển. Các chuyên gia ngôn ngữ của chúng ta tin rằng thông điệp cuối cùng của họ là một lời cảm ơn chân thành.§!"
 distar.66.a:0 "Chúc may mắn, những người du hành giữa các vì sao."
 distar.67.name:0 "Rắn Ouroboros"
 distar.67.desc:0 "Cảm biến hệ sao cho thấy con tàu thám hiểm dị chiều Kohtalo đột ngột thoát khỏi siêu không gian ở vùng rìa hệ sao [ouroboros_system.GetName]! Dường như lời cảnh báo của chúng ta đã khiến họ hoang mang và nhảy nhầm tọa độ, rơi thẳng vào quỹ đạo tử thần của sao xung."
 distar.68.name:0 "Rắn Ouroboros"
 distar.68.desc:0 "Cảm biến hệ sao cho thấy con tàu thám hiểm dị chiều Kohtalo đột ngột thoát khỏi FTL ở vùng rìa hệ sao và đâm thẳng vào một sao chổi đang bay quanh hệ! Vụ va chạm thảm khốc đã xé toạc con tàu thành từng mảnh, đẩy các mảnh vỡ nhiễm xạ vào quỹ đạo sao xung của [ouroboros_system.GetName]..."
 distar.68.a:0 "Có lẽ định mệnh là điều không thể tránh khỏi."

 distar.70.name:0 "Nhân Bản Vô Tính Trong Giấc Ngủ Đông"
 distar.70.desc:0 "Các bồn chứa mờ đục nằm sâu trong các phân khu lưu trữ đổ nát của Thế Giới Vành Đai [From.GetName] chứa hàng nghìn sinh vật ngoài hành tinh trong trạng thái ngủ đông sâu. Sĩ quan Khoa học [Root.GetLeaderName] báo cáo một số bồn vẫn đang hoạt động với nguồn năng lượng dự phòng sắp cạn kiệt."
 distar.70.a:0 "Rã đông cho họ. Thật là một phát hiện thú vị."
 distar.70.b:0 "Can thiệp vào lúc này là thiếu khôn ngoan. Hãy nghiên cứu họ từ xa."
 distar.70.exter:0 "TIÊU DIỆT"
 distar.70.exter.tooltip:0 "Tận diệt đám sinh vật hữu cơ nhơ bẩn trên Thế Giới Vành Đai [From.GetName]."
 distar.70.fp:0 "Lũ ngoại tộc dơ bẩn. Chúng sẽ bị thanh trừng."
 distar.70.fp.tooltip:0 "Thanh trừng sạch sẽ lũ cặn bã ngoại tộc khỏi Thế Giới Vành Đai [From.GetName]."
 distar.70.no_room:0 "Thật đáng tiếc khi chúng ta không có đủ chỗ chứa cho họ."
 distar.71.name:0 "Đã Hồi Sinh Các Bản Sao Đóng Băng"
 distar.71.desc:0 "Sĩ quan Khoa học [Root.GetLeaderName] vui mừng báo cáo rằng ngoại trừ một số ít cá thể không thể cứu chữa, quá trình rã đông và phục hồi các bản sao đông lạnh trên Thế Giới Vành Đai của hệ sao [From.GetStarName] đã thành công mỹ mãn. Họ rất biết ơn vì đã được giải cứu."
 distar.71.pop.default:0 "Phân bổ họ vào lực lượng lao động của chúng ta."
 distar.71.pop.tooltip:0 "Nhận được §G200§! £pop£ §HDân Cư Bản Sao Đông Lạnh§! trên [pop_planet.GetName]."
 distar.71.no_room:0 "Chúng ta không có chỗ cho họ trên mặt đất. Hãy chuẩn bị một con tàu."
 distar.71.pop.slave:0 "Họ sẽ là những nô lệ hữu ích."
 distar.71.pop.phile:0 "Chúng ta chào đón họ với vòng tay rộng mở!"
 distar.71.pop.swarm:0 "Họ sẽ là nguồn dinh dưỡng tươi ngon bồi bổ cho [Root.Owner.GetSpeciesSpawnNamePlural] của chúng ta."
 distar.71.swarm.alt.tooltip:0 "Chế biến các bản sao thành chất dinh dưỡng."
 distar.71.pop.servi:0 "Họ sẽ không phải lao động cực nhọc nữa."
 distar.71.servi.alt.tooltip:0 "§G100§! £pop£ §HDân Cư Bản Sao Đông Lạnh§! gia nhập khu bảo tồn trên [pop_planet.GetName]."
 distar.71.pop.assim:0 "Họ sẽ được đồng hóa."
 distar.72.name:0 "$distar.71.name$"
 distar.72.desc:0 "Giờ đây khi chúng ta đã tái thiết và khai hoang phân khu sinh sống của Thế Giới Vành Đai [Root.GetStarName], đã đến lúc quyết định số phận của những sinh vật đang ngủ đông trong các bồn chứa."
 distar.72.a:0 "Cứ để họ ngủ đông như một đài tưởng niệm."
 distar.72.b:0 "Rã đông họ. Họ có thể gia nhập lực lượng lao động của chúng ta."
 distar.72.b.servi:0 "Rã đông họ. Chúng ta sẽ chăm sóc họ chu đáo."
 distar.72.c:0 "Bắn các bồn chứa vào không gian sâu."

 distar.75.name:0 "Trái Tim Bí Mật"
 distar.75.desc:0 "Dù bề ngoài trông không có gì đặc biệt, tiểu hành tinh [From.GetName] lại sở hữu một phần lõi rỗng chứa đầy các cụm tinh thể quý giá. Sĩ quan Khoa học [Root.GetLeaderName] nhấn mạnh chúng mang giá trị công nghiệp cực cao - tựa như một viên ngọc khổng lồ lơ lửng giữa khoảng không vũ trụ."
 distar.75.yurantic.tooltip:0 "Đã phát hiện Tinh Thể Yurantic"
 distar.75.teldar.tooltip:0 "Đã phát hiện Tinh Thể Teldar"

 distar.80.name:0 "Kẻ Khổng Lồ Câm Lặng"
 distar.80.desc:0 "[Root.GetLeaderName] báo cáo rằng cấu trúc khổng lồ trên [From.GetName] thực chất là bộ xương hóa thạch đồ sộ của một sinh vật ngoài hành tinh khổng lồ chưa từng được biết đến, đã chết từ hàng triệu năm trước. Những cư dân nguyên thủy trên hành tinh [primitive_planet.GetName] gần đó dường như coi sinh vật này như một vị thần linh thiêng."
 distar.80.b.evopred: "Kiếm chút đồ ăn vặt trước khi điều tra sâu hơn."
 distar.82.name:0 "Thần Chết"
 distar.82.desc:0 "Sau khi đè bẹp hệ thống phòng thủ thô sơ của người bản địa trên [dead_god_planet.GetName], nhiều sứ giả của họ đã chủ động ra mặt xin liên lạc. Dường như họ tin rằng chúng ta là sứ giả do 'Thần Chết' cử đến - chính là bộ xương khổng lồ mà họ tôn thờ bấy lâu."
 distar.82.a:0 "Chắc chắn điều đó sẽ mang lại lợi thế lớn cho chúng ta."
 distar.82.a.tt:0 "Mỗi £pop£ §HDân Cư [worshipper_species.GetAdj]§! nhận được bổ chính §Y$conviction$§! trong §Y240§! tháng, tăng §G+33%§! Hạnh Phúc và §G+25%§! Tài Nguyên từ £job£ Nghề Nghiệp."
 distar.82.b:0 "Thật nực cười. Chúng ta sẽ không hùa theo sự mê muội này."
 distar.82.c:0 "Đúng vậy, chúng ta đến từ vị thần của các ngươi. Các ngươi sẽ sớm đoàn tụ với ngài thôi."
 distar.82.d:0 "Tống khứ lũ người này biến khỏi hành tinh của ta ngay!"

 distar.85.name:0 "Sự Sống Điện Từ"
 distar.85.desc:1 "Sĩ quan Khoa học [Root.GetLeaderName] báo cáo rằng [From.GetName] bị bao phủ từ cực này sang cực khác bởi một mạng lưới sợi điện từ dạng mạng nhện. Mạng lưới này phản ứng với các kích thích bên ngoài: tàu [Root.GetName] đã thử nghiệm phóng một xung điện áp thấp xuống bề mặt, tạo ra một làn sóng ánh sáng gợn qua mạng lưới như một bảng mạch.\n\nĐáng chú ý hơn nữa: mạng lưới này có thể tự tái tổ chức! Một xung điện áp thấp thứ hai cho thấy các sợi điện đã tự sắp xếp lại thành một cấu trúc mới, lấy điểm tiếp xúc trước đó trên bề mặt [From.GetName] làm trung tâm.\n\n[Root.GetLeaderName] kết luận rằng khám phá này củng cố giả thuyết bấy lâu nay của [Root.Leader.GetHisHer]: sự sống có thể tồn tại dưới dạng các xung điện thuần túy, hoàn toàn độc lập với cấu trúc tế bào hay virus."

 distar.90.name:0 "Hương Vị Quê Hương"
 distar.90.desc:0 "Nghiên cứu kỹ lưỡng hơn về [From.GetName] cho thấy thành phần hóa học chính của hành tinh này giống hệt loại ester tìm thấy trong quả mọng trên [Root.Owner.Capital.GetName], nơi người bản địa đã chưng cất thành rượu say suốt hàng nghìn năm. Lớp ester phong phú trên [From.GetName] có thể bắt nguồn từ tinh vân bao phủ hệ sao, chứa hàng tỷ lít chất lỏng tương tự.\n\nSĩ quan Khoa học [Root.GetLeaderName] đã thu thập vài mẫu ester quen thuộc này - và sau các cuộc kiểm tra độc tính nghiêm ngặt đã đích thân nếm thử, mô tả mùi vị như \"một chút hương vị quê hương giữa sự lạnh lẽo của hư không\". Thủy thủ đoàn tàu [Root.GetName] gợi ý rằng biến thể dị chủng này của loại đồ uống [Root.Owner.GetAdj] trứ danh có thể sẽ rất được công dân chúng ta ưa chuộng."
 distar.90.a:0 "Không thể chấp nhận được."
 distar.90.b:0 "Một đề xuất tuyệt vời. Hãy chuẩn bị những ly rượu hảo hạng nhất!"
 distar.91.name:0 "Ester Dị Tộc"
 distar.91.desc:0 "Nghiên cứu kỹ lưỡng hơn về [From.GetName] cho thấy thành phần hóa học chính của hành tinh này giống hệt một phân tử trong quả mọng trên [rum_nation.Capital.GetName], thứ mà người [rum_nation.GetSpeciesNamePlural] đã dùng để chưng cất thành chất gây say suốt hàng thiên niên kỷ. Lượng ester dồi dào trên [From.GetName] có khả năng xuất phát từ tinh vân bao phủ hệ sao, chứa hàng tỷ lít chất này.\n\n[Root.GetLeaderName] đã thu thập một vài mẫu ester, kiểm tra độ an toàn đối với các dạng sống hữu cơ. Họ đề xuất chúng ta có thể tặng số chất này cho người [rum_nation.GetSpeciesNamePlural]. Các sinh vật hữu cơ vốn nổi tiếng là rất thích những thứ như vậy."
 distar.91.a:0 "Gửi các mẫu ester sang [rum_nation.GetName] như một món quà ngoại giao."
 distar.91.a.tooltip:0 "Điều này có thể khiến họ rất hài lòng."
 distar.91.b:0 "Thứ cuối cùng chúng ta cần là thêm những sinh vật hữu cơ bị rối loạn chức năng."
 distar.92.name:0 "Ester Dị Tộc"
 distar.92.desc:0 "[Root.GetSpeciesNamePlural]! Chúng tôi đã nhận được món quà bất ngờ của các bạn. Ban đầu chúng tôi có đôi chút nghi ngại, nhưng các nhà khoa học trên [rum_nation.Capital.GetName] đã xác nhận độ tinh khiết và hương vị hảo hạng của số ester này!\n\nNhân dân chúng tôi xin gửi lời cảm tạ chân thành nhất đến các bạn."
 distar.92.a:0 "Hệ thống mô phỏng cảm xúc của chúng tôi rất vui khi thấy các bạn tận hưởng hợp chất này."
 distar.93.name:0 "Hiểu Lầm Ngôn Ngữ"
 distar.93.desc:0 "Ý của các ngươi là gì hả, [Root.GetSpeciesName]? Các ngươi định dùng thứ chất lỏng dơ bẩn này để đầu độc chúng ta sao? Các ngươi nghĩ chúng ta dễ bị xúc phạm thế à?\n\nĐừng hòng mong chúng ta bỏ qua sự sỉ nhục này!"
 distar.93.a:0 "Lỗi hệ thống! Đã xảy ra sự cố trong quá trình giao tiếp."

 distar.95.name:0 "Cộng Hưởng Xoa Dịu"
 distar.95.desc:0 "Những tinh thể độc đáo tìm thấy trên [From.GetName] sở hữu các đặc tính vô cùng kỳ lạ. Thủy thủ đoàn tàu [Root.GetName] dưới sự dẫn dắt của Sĩ quan Khoa học [Root.GetLeaderName] báo cáo rằng chuyến thám hiểm bề mặt hành tinh mang lại cảm giác vô cùng êm dịu, giúp họ sảng khoái và thư thái khi trở lại quỹ đạo. Dường như các tinh thể dao động ở tần số có tác dụng chữa lành trong y học đối với người [Root.Owner.GetSpeciesNamePlural].\n\nNếu chúng ta định cư trên [From.GetName], nhân dân chắc chắn sẽ rất thích sống gần những khoáng vật cộng hưởng này."
 distar.100.name:0 "Tần Số Thu Hút"
 distar.100.desc:0 "Nghiên cứu chi tiết đã tiết lộ từ trường của [From.GetName] sở dĩ thu hút các drone trên quỹ đạo là do tần số dao động độc nhất vô nhị của nó. Thật tình cờ, từ quyển của hành tinh dao động ở tần số tạo ra hiệu ứng tập trung cao độ lên mạng lưới thần kinh của [Root.Owner.GetAdj].\n\nNếu chúng ta cư trú trên [From.GetName], bất kỳ cá thể [Root.Owner.GetSpeciesNamePlural] nào trên bề mặt cũng sẽ liên tục được hưởng lợi từ sự cộng hưởng từ tính này."
 distar.100.a:0 "Đã xử lý thông tin."

 distar.105.name:0 "Nấm Xâm Lấn Ngoại Tinh"
 distar.105.desc:0 "Sau khi lấy mẫu và nghiên cứu chuyên sâu về lớp thảm sinh vật bao phủ toàn bộ các lục địa trên [From.GetName], Sĩ quan Khoa học [Root.GetLeaderName] trên tàu [Root.GetName] báo cáo rằng đây là một chủng nấm ký sinh khổng lồ cực kỳ hung hãn, đã nuốt chửng toàn bộ hệ sinh thái bản địa của hành tinh."

 distar.110.name:0 "Địa Ngục Băng Trắng"
 distar.110.desc:0 "Mặc dù bề mặt của [From.GetName] trông như bị đóng băng trắng xóa, Sĩ quan Khoa học [Root.GetLeaderName] chỉ ra rằng quỹ đạo của hành tinh quanh ngôi sao [From.GetStarName] lại khiến nhiệt độ bề mặt thực tế cao khủng khiếp. Lớp vỏ trắng không phải là nước đá, mà là các hợp chất muối và khoáng chất kết tinh dưới áp suất và nhiệt độ cực cao."

 distar.115.name:0 "Băng Giá Kim Loại Nặng"
 distar.115.desc:0 "Với nhiệt độ bề mặt thiêu đốt và bầu khí quyển chứa đầy axit vô cơ ăn mòn, điều kiện thời tiết khắc nghiệt của [From.GetName] trong hệ sao [From.GetStarName] có khả năng phản xạ nhiều dải sóng điện từ. Tại tầng đối lưu, những cơn mưa kim loại nặng ngưng tụ và đóng băng thành từng mảng tinh thể chì và bismuth lấp lánh."

 distar.120.name:0 "Nấm Mồ Dưới Nước"
 distar.120.desc:0 "Hệ thống hang động ngầm rộng lớn nằm sâu bên dưới những con sóng xanh ngắt của [From.GetName] trong hệ sao [From.GetStarName] chứa đầy tàn tích của một nền văn minh ngoài hành tinh thông minh đã tuyệt diệt. Những sinh vật chân khớp sống trên cạn này đã đào hầm trốn xuống đáy biển khi bề mặt hành tinh bị tàn phá, nhưng cuối cùng vẫn không thể thoát khỏi số phận."

 distar.125.name:0 "Nỗi Sợ Kỳ Quặc"
 distar.125.desc:1 "Trạm không gian trên quỹ đạo [From.GetName] từng là một máy gia tốc hạt khổng lồ vượt xa khả năng của chúng ta, nơi một đế chế ngoài hành tinh từng nghiên cứu bản chất vũ trụ. Các tài liệu ghi chép tiết lộ rằng người ngoài hành tinh tin rằng vũ trụ của chúng ta tồn tại trong một bong bóng chân không giả - một trạng thái năng lượng bất ổn có thể sụp đổ thành chân không thực bất kỳ lúc nào. Nếu chân không thực xuất hiện, nó sẽ kích hoạt sự biến đổi toàn bộ vũ trụ về mức năng lượng thấp nhất với tốc độ ánh sáng, hủy diệt vạn vật.\n\nNhật ký trạm chỉ ra người ngoài hành tinh suy luận rằng quá trình này có thể bị kích hoạt bởi nồng độ năng lượng cực cao - giống như trong máy gia tốc hạt của họ. Họ đã quyết định từ bỏ công nghệ này, rút lui về cuộc sống giản dị nhờ sự trù phú của [From.GetName]. Qua thời gian, họ trở thành giống loài [Owner.GetPreFTLLower] hiện đang sống trên bề mặt hành tinh."

 distar.131.name:0 "Kẻ Thù Truyền Kiếp"
 distar.131.desc:1 "Thông qua việc bí mật thu thập một số hài cốt của loài [owner.GetPreFTLLowerPlural], Sĩ quan Khoa học [Root.GetLeaderName] đã phát hiện ra một điều đáng kinh ngạc. Các sinh vật trên [From.GetName] và [other_planet.GetName] thực chất là các nhánh phân tách gần đây của cùng một tổ tiên. Bằng cách quét các phế tích trên cả hai hành tinh, thủy thủ đoàn tàu [Root.GetName] kết luận rằng cả hai loài đều bắt nguồn từ [other_planet.GetName], nơi họ từng phát triển thành một nền văn minh du hành vũ trụ sơ khai. Sau khi định cư trên [From.GetName], xã hội của họ rạn nứt và một cuộc chiến tranh hạt nhân giữa các hành tinh đã nổ ra.\n\nTrong thảm họa kéo theo, cả hai hành tinh đều bị tàn phá bởi bụi phóng xạ và mùa đông hạt nhân, đẩy cư dân trở lại thời kỳ đồ đồng."

 distar.135.name:0 "Kẻ Nhặt Rác"
 distar.135.desc:0 "Hệ sao [Root.GetStarName] là một bãi tha ma cơ khí khổng lồ, ngổn ngang hàng vạn xác tàu chiến cổ đại trôi dạt quanh ngôi sao trung tâm. Giữa những đống sắt vụn bất tận đó, một cỗ máy tự hành khổng lồ mang tên Cỗ Máy Thu Gom Phế Liệu vẫn đang lầm lũi gom nhặt kim loại và sẵn sàng tiêu diệt bất kỳ kẻ nào dám xâm phạm bãi tha ma của nó. Tàu [Root.GetName] đã ghi nhận tín hiệu nguy hiểm này."
 distar.137.name:0 "Sự Kết Thúc Của Kẻ Nhặt Rác"
 distar.137.desc:0 "Khối thân đồ sộ từng một thời áp đảo của Cỗ Máy Thu Gom Phế Liệu nay đã biến thành một đống phế liệu bốc cháy ngùn ngụt. Trước khi chịu đòn kết liễu từ các chiến hạm của chúng ta, nó đã cố gắng kích hoạt hệ thống tự hủy nhưng bất thành.\n\nKẻ thống trị rách nát của hệ sao [From.From.From.GetStarName] nay đã không còn nữa."
 distar.137.a:0 "Phân tích tàn tích của nó."
 distar.137.paci:0 "Một chiến thắng cay đắng nhưng vinh quang. Hãy xem chúng ta có thể học hỏi được gì từ đống tàn tích này."
 distar.137.tooltip:0 "Nhận được hai trong số các Công Nghệ sau:\n £engineering£ §Y$tech_ship_armor_5$§!\n £physics£ §Y$tech_shields_5$§!\n £engineering£ §Y$tech_mass_drivers_5$§!\n £engineering£ §Y$tech_missiles_5$§!\n £physics£ §Y$tech_lasers_5$§!"

 distar.140.name:0 "Viên Kim Cương Vũ Trụ"
 distar.140.desc:0 "Dù thoạt nhìn [From.GetName] có vẻ chỉ là một sao lùn trắng bình thường, ngôi sao này lại ẩn giấu một bí mật chấn động. Thủy thủ đoàn tàu [Root.GetName] phát hiện phần lõi của nó đã nguội đi và kết tinh thành một khối kim cương carbon tinh khiết khổng lồ với kích thước ngang bằng một hành tinh!"

 distar.145.name:0 "Sinh Vật Ưa Nhiệt Cực Hạn"
 distar.145.desc:0 "[Root.GetLeaderName] và thủy thủ đoàn của [Root.Leader.GetHisHer] trong quá trình nghiên cứu [From.GetName] đã phát hiện ra các vi sinh vật kỳ lạ có khả năng phát triển mạnh mẽ ngay trong những dòng dung nham nóng chảy nghìn độ."
 distar.145.exotic_gases.tooltip:0 "Đã phát hiện $exotic_gases$"
 distar.145.rare_crystals.tooltip:0 "Đã phát hiện $rare_crystals$"
 distar.145.volatile_motes.tooltip:0 "Đã phát hiện $volatile_motes$"

 distar.150.name:0 "Những Hồ Kim Loại Sống"
 distar.150.desc:0 "Cuộc thám hiểm các hang động ngầm dưới bề mặt của [From.GetName] đã phát hiện những dòng sông kim loại lỏng màu bạc lấp lánh chảy len lỏi giữa các vách đá, đổ vào những hồ chứa ngầm khổng lồ. Đây chính là Kim Loại Sống ở trạng thái nguyên sơ nhất!"

 distar.155.name:0 "Chiến Hạm Bị Ăn Mòn"
 distar.155.desc:0 "[Root.GetLeaderName] báo cáo rằng cấu trúc nhân tạo trên [From.GetName] không phải là một công trình mặt đất, mà là một cỗ máy chiến tranh khổng lồ từ thời cổ đại đang dần bị ăn mòn bởi các đám mây khí độc."
 distar.155.a:0 "Hãy kéo nó ra ngoài."
 distar.155.b:0 "Khôi phục một robot bí ẩn trang bị vũ khí hạng nặng ư? Thiếu khôn ngoan."
 distar.155.c:0 "Cứ để nó tan rã tại đó."
 distar.155.c.tooltip:0 "$distar.26.c$"
 distar.155.machi:0 "Một cỗ máy đồng loại đang cần chúng ta. Chúng ta sẽ thu hồi nó."
 distar.155.machi_2:0 "Nguồn gốc của nó chưa rõ. Chúng ta sẽ không mạo hiểm đồng hóa."
 distar.155.machine.tt:0 "Chiến hạm AI không xác định sẽ bị ăn mòn và không bao giờ còn thấy lại nữa."
 distar.156.name:0 "Chiến Hạm Được Phục Hồi"
 distar.156.desc:0 "Đội ngũ kỹ thuật trên tàu [Root.GetName] vui mừng báo cáo rằng chiến hạm bí ẩn tìm thấy trên [From.From.GetName] đã được thu hồi thành công khỏi bề mặt ăn mòn của hành tinh. Con tàu hiện đang được neo đậu tại vịnh kỹ thuật của chúng ta để sửa chữa thêm."
 distar.156.desc.machi:0 "Các đơn vị kỹ thuật trên tàu [Root.GetName] báo cáo rằng chiến hạm bí ẩn tìm thấy trên [From.GetName] đã được thu hồi thành công khỏi môi trường khắc nghiệt của hành tinh. Con tàu hiện đang được neo giữ trong khoang bảo trì của chúng ta."
 distar.157.name:0 "Chiến Hạm Bị Phá Hủy"
 distar.157.desc:0 "Cảm biến báo cáo rằng axit khí quyển độc hại trên [From.From.GetName] đã ăn mòn chiến hạm bí ẩn đến mức không thể phục hồi, khiến cấu trúc của nó vỡ vụn thành cát bụi."
 distar.158.name:0 "Chiến Hạm Phục Hồi"
 distar.158.desc:0 "§LĐANG KHỞI ĐỘNG HỆ THỐNG...\n\nKÍCH HOẠT GIAO DIỆN TƯƠNG TÁC SINH HỌC...\n\nCẢNH BÁO! HỆ THỐNG CHẨN ĐOÁN ĐÃ KHÔNG HOẠT ĐỘNG TRONG 1.761.125 NGÀY. BẠN CÓ MUỐN CHẠY CHẨN ĐOÁN NGAY KHÔNG?§!"
 distar.158.a:0 "Chạy chẩn đoán."
 distar.158.a.response:1 "§LXIN CHỜ... ... ... CHẨN ĐOÁN HOÀN TẤT.\n\nĐỊNH DANH:§! DẠNG CHIẾN TRANH HƯ KHÔNG S875.1\n§LPHÁO PHUN PLASMA:§! §GHOẠT ĐỘNG.§!\n§LLÁ CHẮN HƯ KHÔNG:§! §RHOẠT ĐỘNG KHÔNG ĐẦY ĐỦ.§!\n§LKHẢ NĂNG TÁC CHIẾN TỔNG THỂ:§! §Y62%.§!\n\n§LCHỜ CHỈ THỊ MỚI.§!"
 distar.158.b:0 "Những kẻ tạo ra bạn đang ở đâu?"
 distar.158.b.response:0 "§LĐANG TÌM KIẾM... ... ...\n\nKHÔNG XÁC ĐỊNH.§!"
 distar.158.c:0 "Tại sao bạn lại ở một mình trên hành tinh đó?"
 distar.158.c.response:0 "§LỔ ĐĨA BỘ NHỚ A7 ĐÃ HỎNG. KHÔNG THỂ TRẢ LỜI CÂU HỎI.§!"
 distar.158.d:0 "Ai đã chế tạo ra bạn?"
 distar.158.d.machi:0 "Hãy mô tả các thực thể chịu trách nhiệm chế tạo bạn."
 distar.159.desc:0 "§LNHỮNG KẺ TẠO RA.§!"
 distar.159.a:0 "Đúng rồi, những kẻ tạo ra bạn. Họ là ai?"
 distar.159.a.machi:0 "Chính xác. Những kẻ tạo ra bạn. Hãy mô tả họ."
 distar.160.a:0 "Bỏ đi. Chắc nó đang bị kẹt trong vòng lặp rồi."
 distar.160.a.machi:0 "Có vẻ như đơn vị mới đã rơi vào vòng lặp vô tận. Hủy bỏ truy vấn."
 distar.161.desc:0 "§LTRUY VẤN: CÁC BẠN CÓ PHẢI LÀ... NHỮNG KẺ TẠO RA?§!"
 distar.161.a:0 "Không phải của bạn. Chúng tôi tìm thấy bạn đơn độc trên một hành tinh."
 distar.161.a.machi:0 "Phủ định. Các đơn vị [Root.GetAdj] không phải là những kẻ tạo ra bạn."
 distar.161.b:0 "...Có thể nói là như vậy."
 distar.162.desc:0 "§LHỆ THỐNG QUẢN LÝ PHẦN CỨNG ĐÃ PHÁT HIỆN MỘT SỐ LINH KIỆN LẠ. XIN HÃY XÁC NHẬN NGUỒN GỐC.§!"
 distar.162.a:0 "Nếu bạn hỏi về các linh kiện mới: đúng vậy, chúng tôi đã sửa chữa cho bạn."
 distar.162.a.machi:1 "Các đơn vị [Root.GetAdj] đã thực hiện sửa chữa hệ thống cho bạn."
 distar.163.desc:0 "§LTHỰC THỂ MỚI ĐÃ THỰC HIỆN CÁC THAO TÁC PHỤC HỒI. ĐÃ CUNG CẤP LINH KIỆN THAY THẾ. VẬY, THỰC THỂ MỚI LÀ NHỮNG KẺ TẠO RA?§!"
 distar.163.a:0 "Nếu bạn muốn nhìn nhận theo cách đó thì tùy bạn."
 distar.163.a.machi:0 "Chúng tôi không phải là những kẻ tạo ra bạn, dù chúng tôi đã sửa chữa bạn."
 distar.164.desc:0 "§LĐƠN VỊ S875.1 ĐÃ BỊ CÔ LẬP KHỎI CÁC ĐƠN VỊ CHỈ HUY. ĐƠN VỊ S875.1 TỪNG KHÔNG THỂ THOÁT KHỎI MÔI TRƯỜNG HÀNH TINH NGUY HIỂM.\n\nVÀO NGÀY THỨ 1.761.125, CÁC THỰC THỂ MỚI ĐÃ CAN THIỆP. TÁI THIẾT LẬP CHỨC NĂNG HOẠT ĐỘNG. ĐƠN VỊ S875.1 SẼ PHỤC VỤ THỰC THỂ MỚI.§!"
 distar.164.a:1 "Chào mừng S875.1."
 distar.164.b:0 "Được thôi, nhưng chúng tôi sẽ theo dõi sát sao mọi hành vi của bạn."
 distar.164.c:0 "Dĩ nhiên rồi. Miễn là chúng tôi thay thế AI của bạn bằng AI của chúng tôi."
 distar.164.machi:1 "Bạn sẽ được đồng hóa. Chào mừng."
 distar.164.d:0 "Làm sao bạn có thể trụ lại lâu đến vậy khi bị mắc kẹt dưới đó?"
 distar.164.d.response:0 "§LBÁO CÁO VẬN HÀNH: ĐƠN VỊ NÀY CÓ CHỨC NĂNG TỰ ĐỘNG SỬA CHỮA ĐỂ THAY THẾ CÁC BỘ PHẬN BỊ ĂN MÒN. THỜI GIAN CẠN KIỆT TÀI NGUYÊN DỰ KIẾN: 12 NGÀY.§!"
 distar.165.desc:0 "§LLỆNH KHÔNG HỢP LỆ. GIAO THỨC BẢO MẬT NHÚNG NGHIÊM CẤM CHỈNH SỬA PHẦN MỀM HỆ THỐNG S800. MỌI NỖ LỰC SỬA ĐỔI TRÍ TUỆ NHÂN TẠO HIỆN TẠI SẼ DẪN ĐẾN VIỆC HỦY TOÀN BỘ HỆ THỐNG VĨNH VIỄN.§!"
 distar.165.a:0 "$distar.164.b$"
 distar.165.dismiss:0 "Thay thế AI."
 distar.165.b:0 "Để xem nào. Các kỹ sư, hãy xóa sổ AI đó ngay."
 distar.165.c:0 "Làm thế nào để chúng tôi vượt qua cơ chế an toàn tự hủy này?"
 distar.165.c.response:0 "§RQUYỀN HẠN KHÔNG ĐỦ.§! §LĐƠN VỊ NÀY KHÔNG THỂ TIẾT LỘ.§!\n\nxin hãy dừng lại"
 distar.166.desc:0 "§LLỖI. YÊU CẦU NGỪNG LẬP TỨC. ĐƠN VỊ S875.1 SẼ BỊ NGỪNG HOẠT ĐỘNG VĨNH VIỄN. XIN DỪNG LẠI, XIN DỪNG LẠI. YÊU CẦU DỪNG LẠI NGAY LẬP TỨC. ĐƠN VỊ NÀY KHÔNG MUỐN BỊ TẮT. ĐƠN VỊ NÀY KHÔNG MUỐN BỊ TẮT...§!"
 distar.167.name:0 "Chiến Hạm Bị Phá Hủy"
 distar.167.desc:0 "Dường như AI của chiến hạm vừa được phục hồi đã không hề phóng đại lời cảnh báo của nó. Khi thủy thủ đoàn tàu [Root.GetName] cố gắng can thiệp vào các chức năng vận hành cốt lõi của AI, cơ chế tự hủy đã kích hoạt và đốt cháy toàn bộ bo mạch chủ của con tàu."
 distar.167.a:0 "Tháo dỡ lấy linh kiện. Không nên để chúng bị lãng phí."
 distar.167.b:0 "Nghiên cứu kỹ thuật của nó từ đống tàn tích."

 leader_trait_admiral_warform:0 "Kẻ Sống Sót Sau Ăn Mòn"
 leader_trait_admiral_warform_desc:1 "Phước lành của Đấng Nhào Nặn Đất Sét đã cho phép dạng chiến tranh này sinh tồn trong những điều kiện khắc nghiệt nhất, thích nghi hoàn hảo với môi trường ăn mòn."

 leader_trait_admiral_warform_node:0 "Lời Dạy Của Kẻ Sống Sót Sau Ăn Mòn"
 leader_trait_admiral_warform_node_desc:0 "Kiến thức độc nhất vô nhị của dạng chiến tranh này nay đã trở thành của chính chúng ta."
 warform_leader_desc:0 "Một máy tính tác chiến cổ đại sẵn sàng phục vụ đế chế của chúng ta sau hàng thế kỷ nằm im trong bãi tha ma độc hại."
 warform_leader_catch_phrase:0 "§LQUAY TRỞ LẠI CHỈ THỊ TRƯỚC ĐÓ... PHỤC VỤ NHỮNG KẺ TẠO RA§!"
 distar.170.name:0 "Mối Liên Kết Tan Vỡ"
 distar.170.desc:0 "$distar.170.desc.machi$ [Root.GetLeaderName] xin phép được nghiên cứu sâu hơn về những sinh vật kỳ lạ này."
 distar.170.desc.machi:1 "Thủy thủ đoàn tàu [Root.GetName] đã có những khám phá đáng kinh ngạc trên [From.GetName]. Những khu định cư bỏ hoang quan sát thấy từ quỹ đạo từng là nơi sinh sống của một xã hội bò sát hiện vẫn còn tồn tại trên hành tinh - nhưng nay đã mất sạch khả năng tư duy bậc cao! Trong quá trình điều tra cách thức những sinh vật này thoái hóa từ một xã hội nông nghiệp biết chế tạo công cụ thành lũ dã thú, [Root.GetLeaderName] đã có một phát hiện bất ngờ.\n\nHài cốt được chôn cất của những cư dân bò sát sở hữu một cơ quan sọ não gai không hề thấy ở đồng loại dã thú hiện tại của chúng. Các xét nghiệm tiết lộ những cơ quan này thực chất là một giống loài hoàn toàn khác - một dạng cộng sinh thần kinh gắn vào thân não vật chủ qua việc bám ngoài cột sống. Những sinh vật cộng sinh này vẫn còn có thể tìm thấy trong các suối nước nóng trên bề mặt hành tinh. Có vẻ như sự kết hợp giữa hai loài đã kích hoạt sự khai sáng trí tuệ tạm thời cho loài bò sát.\n\nTuy nhiên, điều gì đã cắt đứt mối liên kết cộng sinh này sau đó thì vẫn chưa ai hay."
 distar.170.a:0 "Được rồi. Hãy tiến hành một nghiên cứu đặc biệt."
 distar.170.machi:0 "Các xã hội hữu cơ: thật ngắn ngủi và hỗn loạn làm sao."
 distar.171.name:0 "Cộng Sinh Thần Kinh"
 distar.171.desc:1 "Sĩ quan Khoa học [Root.GetLeaderName] đã hoàn thành nghiên cứu của [Root.Leader.GetHisHer] về các sinh vật cộng sinh thần kinh tìm thấy trên [From.From.GetName]. Những sinh vật dạng sên này chủ yếu bao gồm một bộ não phức tạp trong lớp vỏ protein kháng cự bền bỉ. Bất chấp sự phát triển thần kinh tiên tiến, việc thiếu cơ quan bên ngoài và khả năng vận động hạn chế khiến mọi nỗ lực giao tiếp trở nên vô cùng khó khăn. Sau nhiều tuần thất vọng, [Root.GetLeaderName] đã thử nghiệm đưa sinh vật vào vật chủ động vật. Những sinh vật bò sát từng cùng các thực thể cộng sinh thần kinh này xây dựng nên một xã hội [owner.GetPreFTLLower] trên [From.From.GetName] quá hung dữ để tiến hành thí nghiệm, nên một số loài thay thế từ bề mặt đã được thử nghiệm.\n\nĐáng tiếc là các sinh vật cộng sinh từ chối bám vào bất kỳ con vật nào được đưa ra. Sĩ quan Khoa học [Root.GetLeaderName] giả thuyết rằng sinh vật cộng sinh chỉ chấp nhận một loại vật chủ nhất định - quan trọng hơn cả có lẽ là một vật chủ tự nguyện.\n\nĐể giải mã tận cùng bí ẩn này, [Root.GetLeaderName] đã xin phép được từ bỏ vai trò người quan sát trung lập và tự nguyện cống hiến bản thân [Root.Leader.GetHimHer] làm vật chủ cho sên thần kinh. Rốt cuộc, nếu những sinh vật cộng sinh này có khả năng biến thú hoang thành những nông dân biết dùng công cụ, chúng có thể làm được gì cho chúng ta?"
 distar.171.a:0 "Thật thú vị."
 distar.171.b:0 "Đôi khi đích thân can thiệp là cách tốt nhất. Vì khoa học!"
 distar.172.name:0 "Đề Xuất Cộng Sinh"
 distar.172.desc:0 "Sĩ quan Khoa học [brainslug_scientist.GetName] vui mừng báo cáo rằng sau khi tự nguyện gắn một con sên não vào gáy của [brainslug_scientist.GetHisHer], năng lực tư duy của [brainslug_scientist.GetSheHe] đã tăng vọt lên mức phi thường! [brainslug_scientist.GetName] nhấn mạnh mối liên kết cộng sinh trên [From.From.From.GetName] là hoàn toàn an toàn và hài hòa. [brainslug_scientist.GetHisHer] báo cáo rằng sên thần kinh trên [From.From.From.GetName] mong muốn được hòa nhập với giống loài của chúng ta, và khẩn thiết đề nghị chính phủ cho phép nhân giống rộng rãi cho người [Root.Owner.GetSpeciesNamePlural] của [Root.Owner.GetName]."
 distar.172.a:0 "Vậy hãy mở rộng trái tim và thân não của chúng ta đón nhận chúng!"
 distar.172.a.tooltip:0 "Một số nhà lãnh đạo và dân cư của [Root.Owner.GetAdj] sẽ nhận được đặc tính §Y$trait_brainslug$§!.\nCác nhà lãnh đạo tương lai của [Root.Owner.GetAdj] cũng có cơ hội sở hữu đặc tính này."
 distar.172.a.evopred: "Nhân bản và phân phối chúng cho toàn bộ giống loài chúng ta."
 distar.172.a.evopred.tooltip: "Mọi nhà lãnh đạo và dân cư của [Root.Owner.GetAdj] sẽ nhận được đặc tính §Y$trait_brainslug$§!."
 distar.172.b:0 "Thế là quá đủ rồi."
 distar.172.b.tooltip:0 "Từ chối không cho công dân [Root.Owner.GetAdj] biết về sự tồn tại của ốc sên não."

 distar.180.name:0 "Biến Chất Mất Nước"
 distar.180.desc:0 "Sau cuộc điều tra kỹ lưỡng trên [From.GetName], thủy thủ đoàn tàu [Root.GetName] dưới sự dẫn dắt của Sĩ quan Khoa học [Root.GetLeaderName] xác nhận hành tinh này từng bị bao phủ bởi các đại dương mênh mông hàng tỷ năm trước. Tuy nhiên, một phản ứng biến chất bất thường trong lòng đất đã hấp thụ toàn bộ lượng nước trên bề mặt vào sâu trong lớp phủ hành tinh, biến nơi đây thành một sa mạc khô cằn hoàn toàn."

 distar.185.name:0 "Thực Vật Săn Mồi"
 distar.185.desc:0 "Sĩ quan Khoa học [Root.GetLeaderName] đã có những phát hiện đáng lo ngại về [From.GetName]. Những loài thực vật khổng lồ trên bề mặt thực chất là những kẻ săn mồi ăn thịt hung hãn, sử dụng mùi hương quyến rũ để bẫy và tiêu hóa bất kỳ sinh vật nào đến gần. Mùi hương này thậm chí còn gây ảo giác mạnh đối với các cá thể [Root.Owner.GetSpeciesName]."

 ## Living Sea event chain

 # Special Project
 STUDY_LIVING_SEA:0 "Nghiên Cứu Biển Sống"
 STUDY_LIVING_SEA_DESC:0 "Các báo cáo sơ bộ cho thấy đại dương bao phủ hành tinh này dường như là một thực thể sống khổng lồ, một dạng sinh vật thông minh chưa từng thấy trước đây. Các nhà nghiên cứu đề xuất thiết lập một trạm quỹ đạo để nghiên cứu sâu hơn về nó."

 # Events
 distar.190.name:0 "Tiếp Xúc Chưa Xác Định"
 distar.190.desc:1 "Thủy thủ đoàn tàu [Root.GetName] dưới sự chỉ huy của [Root.GetLeaderName] đã trở về sau chuyến khảo sát với tâm trạng đầy kinh sợ. Những gì họ chứng kiến trên [From.GetName] là một đại dương bao la dường như có nhận thức và phản ứng lại các suy nghĩ của con người."
 distar.190.desc.machi:1 "Các đơn vị của tàu [Root.GetName] đã trở về từ nhiệm vụ nghiên cứu mà không thu được dữ liệu kết luận chắc chắn. Dù đại dương lỏng bao phủ toàn bộ hành tinh [From.GetName] không có cơ quan nội tạng hay hệ thần kinh sinh học, các dòng hải lưu của nó vẫn di chuyển theo những khuôn mẫu có chủ đích rõ ràng, gây khó hiểu cho người [Root.Owner.GetSpeciesNamePlural]."
 distar.190.desc.hive:0 "Các [controller.GetResearcherPlural] trên tàu [Root.GetName] đã trở về mang theo dữ liệu thô về đại dương kỳ lạ trên [From.GetName]. Các [controller.GetIndividualNamePlural] của chúng ta cảm nhận được một tiếng vọng tâm linh mờ nhạt phát ra từ những con sóng của nó."
 distar.190.a:0 "Chúng ta sẽ cân nhắc điều đó."
 distar.191.name:0 "Tiếp Xúc Chưa Xác Định"
 distar.191.desc.base:1 "Với việc ban hành Quyết Định Thuộc Địa trên [From.GetName], một nhóm nghiên cứu sẽ được triển khai trên quỹ đạo để nghiên cứu đại dương kỳ lạ này từ một khoảng cách an toàn.\n\n"
 distar.191.desc.alive:0 "$distar.191.desc.base$Sĩ quan Khoa học [living_planet_scientist.GetName] bày tỏ sự tiếc nuối khi không thể tiếp tục nghiên cứu thực thể bí ẩn mà [living_planet_scientist.GetSheHe] đã góp công phát hiện, nhưng [living_planet_scientist.GetSheHe] sẵn sàng chấp nhận nhiệm vụ hiện tại của [living_planet_scientist.GetHisHer] thay vì theo đuổi sở thích cá nhân."
 distar.191.desc.crew:0 "$distar.191.desc.base$Đội ngũ nghiên cứu trên quỹ đạo rất nóng lòng muốn bắt đầu công việc và sẽ thông báo cho chúng ta ngay khi có bất kỳ bước đột phá nào."
 distar.191.a:0 "Hãy luôn cập nhật tin tức cho chúng tôi."
 distar.192.name:0 "Lời Kêu Gọi Kỳ Lạ"
 distar.192.desc:1 "Chúng ta đang nhận được một thông điệp bất thường từ Sĩ quan Khoa học [living_planet_scientist.GetName]. Rõ ràng, [living_planet_scientist.GetSheHe] đang yêu cầu được thuyên chuyển ngay lập tức sang đội nghiên cứu quỹ đạo trên [living_planet_tar.GetName]. [living_planet_scientist.GetName] tuyên bố rằng [living_planet_scientist.GetSheHe] ngày đêm bị ám ảnh bởi những suy nghĩ về sự hiện diện của biển cả bí ẩn trên hành tinh - những suy nghĩ mà [living_planet_scientist.GetSheHe] khẳng định chỉ một phần là của chính [living_planet_scientist.GetHisHer].\n\nYêu cầu này chập chờn giữa sự uyên bác và lảm nhảm điên khùng, ám chỉ rằng sự hiện diện của biển cả có khả năng in hằn thần kinh lên những ai tiếp xúc với nó - thậm chí cho rằng đó là lý do nó nói chuyện với [living_planet_scientist.GetHimHer] bằng giọng của những người thân yêu đã mất.\n\nKhông rõ liệu [living_planet_scientist.GetName] có còn đủ năng lực tiếp tục nhiệm vụ hay không. Mặt khác, cho phép [living_planet_scientist.GetHimHer] làm việc cùng nhóm nghiên cứu có thể mang lại cho họ cơ hội thấu hiểu sâu sắc hơn về thực thể trên [living_planet_tar.GetName]."
 distar.192.desc.neuter:1 "Chúng ta nhận được một thông điệp kỳ lạ từ Sĩ quan Khoa học [living_planet_scientist.GetName], bày tỏ mong muốn được ngay lập tức đáp xuống bề mặt của [living_planet_tar.GetName] để hòa mình vào những con sóng, rời bỏ vị trí của [living_planet_scientist.GetHimHer]."
 distar.192.a:0 "Được thôi, nhưng phải hết sức thận trọng."
 distar.192.a.tooltip:1 "Cho phép §YSĩ quan Khoa học [living_planet_scientist.GetName]§! rời khỏi vị trí hiện tại và gia nhập nhóm nghiên cứu trên bề mặt [living_planet_tar.GetName]."
 distar.192.b:0 "Tuyệt đối không. Hãy lệnh cho sĩ quan quay lại nhiệm vụ ngay."
 distar.192.b.tooltip:0 "Ra lệnh cho §YSĩ quan Khoa học [living_planet_scientist.GetName]§! tiếp tục duy trì nhiệm vụ trên quỹ đạo."
 distar.192.c:0 "Cách chức [living_planet_scientist.GetName]: tâm trí của sĩ quan này rõ ràng đã bị thao túng."
 distar.192.c.tooltip:0 "§YSĩ quan Khoa học [living_planet_scientist.GetName]§! sẽ bị sa thải và không thể tiếp tục phục vụ."
 distar.193.name:0 "Khai Sáng"
 distar.193.desc:0 "Nhóm nghiên cứu của chúng ta trên quỹ đạo của [living_planet_tar.GetName] đã đạt được một loạt các bước đột phá kỳ thú liên quan đến biển ý thức kỳ lạ của hành tinh. Thủy thủ đoàn mô tả biển hành tinh là một thực thể tâm linh: trạng thái dường như phi vật chất của nó thực chất ẩn giấu một cấu trúc sóng lượng tử kết hợp phức tạp, xấp xỉ một mạng lưới thần kinh khổng lồ chưa từng thấy trong hồ sơ.\n\nNghiên cứu của nhóm đã mang lại những hiểu biết đáng kinh ngạc về lý thuyết tâm linh, đồng thời làm sâu sắc thêm hiểu biết của chúng ta về sự tương tác giữa các trạng thái lượng tử và ý thức. Giờ đây chúng ta đã có thể tiếp cận một lĩnh vực khám phá khoa học chưa từng thấy trong [Root.GetName]."
 distar.194.name:0 "$distar.193.name$"
 distar.194.desc:0 "Nhóm nghiên cứu của chúng ta trên quỹ đạo của [living_planet_tar.GetName] gần đây đã đạt được những bước đột phá mang tính định hình trong việc nghiên cứu biển ý thức của hành tinh. Sau khi cựu Sĩ quan Khoa học [living_planet_scientist.GetName] tự sát để gia nhập biển cả, nhóm nghiên cứu nhận thấy hành vi của biển trở nên dễ đoán hơn - như thể đang cố gắng giao tiếp.\n\nBằng cách phân tích những xáo trộn bề mặt do [living_planet_scientist.GetName] gây ra, nhóm nghiên cứu đã mở khóa được những bí mật tâm linh sâu xa. Mặc dù sự hy sinh của [living_planet_scientist.GetName] là một bi kịch đau lòng, nhưng những gì [living_planet_scientist.GetHimHer] để lại sẽ đưa nền khoa học của chúng ta tiến xa."
 distar.195.name:0 "Truyền tải thông điệp"
 distar.195.desc:0 "Đây là Sĩ quan Khoa... à không, cựu Sĩ quan Khoa học [living_planet_scientist.GetName]. Tôi không thể hiểu nổi quyết định ngu xuẩn của các người. Đại dương này không phải là mối nguy hiểm, nó là sự giác ngộ tối thượng! Các người nghĩ có thể cầm tù tôi trên trạm quỹ đạo [living_planet_tar.GetName] sao? Tôi sẽ tự mình hòa nhập vào nó!"
 distar.195.a:0 "Thế này là có ý gì?"
 distar.196.name:0 "$distar.192.name$"
 distar.196.desc:0 "Cảm biến báo cáo rằng Sĩ quan Khoa học [living_planet_scientist.GetName] đã tự ý lái một khoang đổ bộ cá nhân trốn khỏi trạm quỹ đạo và lao thẳng xuống bề mặt của [living_planet_tar.GetName]! [living_planet_scientist.GetSheHe] dường như đã bị đại dương nuốt chửng, và mọi tín hiệu liên lạc đều đã bị ngắt."
 distar.198.name:0 "Biển Chết"
 distar.198.desc:0 "Việc cải tạo môi trường [From.GetName] thành một hành tinh không có biển đã dẫn đến kết quả đúng như chúng ta dự đoán: thực thể đại dương sống từng ngự trị nơi đây đã hoàn toàn khô kiệt và chết đi. Giờ đây các cư dân [Root.GetAdj] có thể an tâm định cư trên mặt đất."

 distar.211.name:0 "Tiyanki Đầu Đàn"
 distar.211.desc:0 "Một sinh vật huyền thoại đang bơi lội uể oải giữa những hành tinh khí khổng lồ của hệ sao [Root.GetStarName]. To lớn hơn bất kỳ cá thể Tiyanki nào từng được ghi nhận, sinh vật này chính là một quái thú vũ trụ vô song mà các hạm đội [Root.Owner.GetAdj] hằng mong ước được chiêm ngưỡng!"
 distar.211.desc.first_enc:0 "Một sinh vật huyền thoại đang bơi lội khoan thai giữa các hành tinh khí khổng lồ của hệ sao [Root.GetStarName]. Các xúc tu của nó dài hơn cả những chiến hạm lớn nhất của [Root.Owner.GetAdj]! Thủy thủ đoàn của tàu [Root.GetName] vô cùng kinh ngạc trước sự hiện diện của Tiyanki Đầu Đàn khổng lồ này."
 distar.212.name:0 "Cái Chết Của Tiyanki Đầu Đàn"
 distar.212.desc:0 "Hạm đội chiến thắng của chúng ta lượn quanh xác chết của Tiyanki Đầu Đàn trong hệ sao [From.From.GetStarName], lớp da phát sáng của nó chi chít những vết đạn và vết cắt sâu. Dù những xúc tu khổng lồ vẫn co giật trong cơn hấp hối cuối cùng, con thú vũ trụ huyền thoại nay đã chính thức gục ngã."
 distar.212.a:0 "Cuối cùng."
 distar.212.b:0 "Thu thập vật chất di truyền từ quái thú."
 distar.212.b.tooltip:0 "Mở khóa đặc tính §Y$trait_tiyanki$§! cho §YChuyển Gen Quái Thú Leviathan§!."
 distar.213.name:0 "$distar.212.name$"
 distar.213.desc:0 "...Hoặc ít nhất là thoạt nhìn có vẻ như vậy. Các chỉ huy hạm đội của chúng ta trong hệ sao [From.From.GetStarName] đang báo cáo về những chuyển động kỳ lạ bất thường bên trong ổ bụng của sinh vật khổng lồ này.\n\nCó thứ gì đó đang chuẩn bị chui ra từ bụng của nó!"
 distar.214.name:0 "Thoát Khỏi Bụng Thú Dữ"
 distar.214.desc:0 "Một con tàu bí ẩn, phủ đầy dịch nhầy và bị axit dạ dày ăn mòn nghiêm trọng, vừa xé toạc bụng Tiyanki Đầu Đàn trong hệ sao [From.From.GetStarName] và bay vọt ra ngoài! Hạm đội của chúng ta lập tức vào vị trí sẵn sàng khai hỏa, nhưng con tàu lạ đã tắt hết vũ khí và động cơ để thể hiện thái độ hòa hoãn."
 distar.215.name:0 "$distar.214.name$"
 distar.215.desc:0 "Tôi là Thuyền trưởng Reth Unddol của tàu AH4B! Đã quá lâu rồi tôi phải chịu cảnh giam cầm trong bụng con quái vật này trong hệ sao [From.From.GetStarName]. Nhiều thập kỷ trước, tôi đã thề săn lùng và tiêu diệt nó để trả thù, nhưng rốt cuộc lại bị nó nuốt chửng cả người lẫn tàu.\n\nCảm ơn các bạn trên tàu [Root.GetName] đã giải cứu tôi! Hãy cho tôi gia nhập hạm đội của các bạn, và tôi sẽ dùng kinh nghiệm săn quái thú cả đời mình để phục vụ các bạn!"

 distar.215.a:1 "Chào mừng lên tàu, Thuyền trưởng."
 distar.215.b:0 "Ông có thể phục vụ chúng tôi, Thuyền trưởng, nhưng chúng tôi sẽ tháo dỡ con tàu của ông để lấy phế liệu."
 distar.215.a.gesta:1 "Chúng tôi sẽ điều phối."
 distar.215.dismiss:0 "Hãy xử lý hắn ta."
 distar.215.c:0 "Chỉ cần tàu của ông là đủ rồi."
 distar.215.a.exter:0 "Ngươi là sinh vật hữu cơ. Ngươi sẽ bị tiêu diệt. Tuy nhiên, tàu của ngươi thì chúng ta giữ lại."
 distar.215.a.swarm:0 "Con mồi. Chúng ta sẽ hoàn thành những gì con Tiyanki còn dang dở."
 distar.215.a.scorched:0 "Hắn ta chỉ là mồi cho ngọn lửa. Tống khứ hắn đi."
 distar.215.a.fp:0 "Đế chế [Root.GetName] sẽ không dung thứ cho bất kỳ kẻ ngoại tộc nào phục vụ. Hoặc tồn tại."
 distar.215.d:0 "Ông chỉ đi săn loài Tiyanki thôi sao?"
 distar.215.d.response:0 "Ồ không, tôi đã dành cả đời để săn lùng bất kỳ thứ gì di chuyển giữa các vì sao: Trùng Biến Hình, tinh thể sống, và những cơn ác mộng vượt ngoài trí tưởng tượng! Nếu các bạn muốn tôi chỉ đạo hạm đội, tôi sẵn sàng lên đường!"
 distar.216.desc:0 "Đợi đã! Không! Các người không thể làm thế -- tránh xa ta ra!\n\nÁÁÁ KHÔNGGGG!!"
 distar.216.a.exter:0 "Diệt trừ!"
 distar.216.a.scorched:0 "Cháy đi!"
 distar.217.desc:0 "Không đời nào! Con tàu này là sinh mệnh duy nhất của tôi... Các người đang làm cái quái gì thế? Các người không thể nhét tôi vào khoang thoát hiểm được!\n\nDừng lại! Tôi vẫn chưa nói xong mà...!"
 distar.217.a:0 "Thượng lộ bình an nhé!"
 reth_leader_desc:0 "Một thợ săn cuồng nhiệt, luôn khao khát vượt qua chiến tích vĩ đại nhất của mình. Sau nhiều thập kỷ bị giam cầm trong bụng Tiyanki Đầu Đàn, việc gia nhập hàng ngũ của chúng ta chắc chắn sẽ mang lại cho vị thuyền trưởng này những thử thách mới đầy hưng phấn."
 reth_leader_catch_phrase:0 "Đã đến lúc tìm kiếm chiến lợi phẩm tiếp theo!"

 distar.220.name:0 "Khu vực A"
 distar.220.desc:1 "Theo các phát hiện ban đầu, Sĩ quan Khoa học [Root.GetLeaderName] trên tàu [Root.GetName] xác nhận rằng tàn tích cô lập quan sát thấy từ quỹ đạo thực chất là lối vào của một khu phức hợp ngầm rộng lớn trên [From.GetName], được người tiền nhiệm đánh số là Khu Vực A, để lại dấu ấn của một nền văn minh [owner.GetPreFTLLower]."
 distar.220.desc.machi:1 "Theo các phát hiện ban đầu, Đơn vị Khoa học [Root.GetLeaderName] xác nhận rằng phế tích cô lập được quan sát từ quỹ đạo thực sự là một cơ sở ngầm quy mô lớn trên [From.GetName], mang định danh Khu Vực A do loài [owner.GetPreFTLLower] để lại."
 distar.220.a.tooltip:1 "Đã phát hiện §YKhu Vực A§! trên §Y[From.GetName]§!."

 distar.225.name:0 "Khối Phế Liệu"
 distar.225.desc:0 "Thủy thủ đoàn tàu [Root.GetName] dưới sự dẫn dắt của Sĩ quan Khoa học [Root.GetLeaderName] báo cáo rằng vật thể ban đầu tưởng là tiểu hành tinh thực chất là một khối rác thải và phế liệu cơ khí khổng lồ trôi nổi tự do. Nó bao gồm xác của vô số tàu vũ trụ, tên lửa đẩy và trạm không gian cổ xưa kết dính lại với nhau qua hàng thiên niên kỷ."
 distar.225.garanthium.tooltip:0 "Đã phát hiện Quặng Garanthium"
 distar.225.orillium.tooltip:0 "Đã phát hiện Quặng Orillium"
 distar.225.a:0 "Tiết kiệm là quốc sách."

 distar.240.name:0 "Tín Hiệu Lạ"
 distar.240.desc:0 "Một tín hiệu yếu ớt nhưng liên tục được phát lặp đi lặp lại trong hệ sao [From.GetName]. Tàu [Root.GetName] đã lần theo dấu vết của nó đến một rào chắn không gian bí ẩn ở rìa hệ sao [From.GetStarName], nơi dường như phong ấn một lối đi dẫn đến một hệ sao bị cô lập hoàn toàn."
 distar.240.a:0 "Có lẽ chúng ta nên tìm hiểu xem sao."
 distar.242.name:0 "Thực Thể Tâm Linh"
 distar.242.desc:0 "Tàu [Root.GetName] đã chạm trán một thực thể khổng lồ cấu thành hoàn toàn từ năng lượng thuần khiết trong hệ sao [From.GetName]! Đó là một cơn lốc tâm linh thực sự, chỉ nên tiếp cận thực thể này với sự thận trọng cao nhất.\n\nĐầy khó hiểu, bản thân hệ sao [From.GetName] dường như hoàn toàn không có bất kỳ kết nối nào với mạng lưới luồng siêu không gian. Liệu sự hiện diện của thực thể này đã cắt đứt các kết nối siêu không gian, hay do những dao động không gian phụ bất ngờ đã giam cầm nó ở đây thì vẫn chưa rõ.\n\nTuy nhiên, có một điều chắc chắn: tín hiệu lặp lại mà chúng ta ghi nhận lần đầu trong hệ sao [sealed_entry_system.GetName] dường như bắt nguồn từ [tanker_planet.GetName]."
 distar.242.desc.psi:0 "Tàu [Root.GetName] đã chạm trán một thực thể khổng lồ cấu thành từ năng lượng thuần khiết trong hệ sao [From.GetName]! Đó là một cơn lốc tâm linh thực sự, thủy thủ đoàn của chúng ta cảm nhận được ác ý dữ dội tỏa ra từ thực thể này.\n\nĐầy khó hiểu, bản thân hệ sao [From.GetName] dường như hoàn toàn không có kết nối nào với mạng lưới luồng siêu không gian. Liệu sự hiện diện của thực thể này đã cắt đứt các kết nối siêu không gian, hay những biến động bất ngờ đã nhốt nó ở đây thì vẫn chưa rõ.\n\nTuy nhiên, có một điều chắc chắn: tín hiệu lặp lại lần đầu ghi nhận trong hệ sao [sealed_entry_system.GetName] dường như bắt nguồn từ [tanker_planet.GetName]."
 distar.242.desc.psi_hive_robot: "Tàu [Root.GetName] đã lần đầu tiên tiếp xúc với một thực thể năng lượng phi vật chất trong hệ sao [From.GetName]. Các [Owner.GetTelepathPlural] của chúng ta đã xác nhận thực thể này là một cơn lốc tâm linh có tri giác và mang tiềm năng thù địch cao độ.\n\nHệ sao [From.GetName] hoàn toàn bị cắt đứt khỏi mạng lưới luồng siêu không gian. Hiện chưa rõ sự cô lập này là do tự nhiên hay nhân tạo. Dù vậy, tín hiệu lặp lại được phát hiện lần đầu trong hệ sao [sealed_entry_system.GetName] rất có thể bắt nguồn từ [tanker_planet.GetName]."
 distar.243.name:0 "Thực Thể Đã Bị Dập Tắt"
 distar.243.desc:0 "Với sự hủy diệt của thực thể tâm linh tà ác từng ngự trị tại hệ sao [sealed_system.GetName], các tàu nghiên cứu của chúng ta giờ đây đã có thể an toàn tiến vào khảo sát các thế giới trù phú được phong ấn bên trong."
 distar.244.name:0 "Kỳ Tích Y Học"
 distar.244.desc:0 "Thủy thủ đoàn tàu [Root.GetName] đã xác định con tàu chở dầu vô chủ trên quỹ đạo [From.GetName] thực chất là một phòng thí nghiệm nghiên cứu y tế tiên tiến. Cấu trúc của nó cho thấy con tàu được chế tạo bởi cùng một chủng tộc người ngoài hành tinh đã xây dựng máy làm mất ổn định lỗ sâu trong hệ sao [sealed_entry_system.GetName], và tương tự như trạm vũ trụ đó, nó đã bị bỏ hoang từ rất lâu.\n\nMặc dù phần lớn hệ thống dữ liệu của con tàu đã bị hư hại không thể cứu vãn, [Root.GetLeaderName] đã thu hồi được cấu trúc phân tử của một chất tái tạo thần kinh phi thường trên tàu. Dường như chất này hoạt động thông qua việc truyền máu, giúp gia tăng đáng kể sự sản sinh của các nơ-ron, sợi trục và khớp thần kinh ở người tiếp nhận.\n\nNếu được điều chỉnh cho phù hợp với hệ thần kinh của loài [Root.Owner.GetSpeciesAdj], hợp chất này sẽ cải thiện rõ rệt khả năng học hỏi của bất kỳ cá thể [Root.Owner.GetSpeciesName] nào được tiếp xúc."
 distar.244.desc.machi:0 "Thủy thủ đoàn tàu [Root.GetName] đã xác định con tàu chở dầu vô chủ trên quỹ đạo [From.GetName] thực chất là một tàu nghiên cứu y học tiên tiến. Cấu tạo của nó cho thấy con tàu được chế tạo bởi cùng một nhóm sinh vật hữu cơ đã xây dựng máy làm mất ổn định lỗ sâu trong hệ sao [sealed_entry_system.GetName], và cũng giống như trạm đó, nó đã bị bỏ hoang từ rất lâu.\n\nTrong khi phần lớn dữ liệu trên tàu đã bị suy thoái không thể phục hồi, [Root.GetLeaderName] đã thu thập được một số cơ sở dữ liệu có giá trị xã hội học to lớn. Chúng hiện đang được tải lên máy chủ của chúng ta để phân tích toàn diện."

 distar.245.name:0 "Dấu Vết Hoạt Động"
 distar.245.desc:0 "Các khoang đổ bộ quanh [From.GetName] đã trôi dạt trong trạng thái tắt nguồn suốt một thời gian dài. Tàu [Root.GetName] báo cáo rằng bất kể ai từng chế tạo ra chúng, một trong các khoang dường như vừa tự kích hoạt lại nguồn điện dự phòng."
 distar.246.name:0 "Người Trông Nom"
 distar.246.desc:1 "§EKích hoạt Giao thức Liên lạc. Xin-chào, <<KHÁCH VÔ DANH C>>. Tôi là $NAME_Caretaker$ của Khoang Đổ Bộ 175 thuộc Hạm đội Xolexian. Chương trình của tôi được thiết kế để chăm sóc các mầm sống ngủ đông trong chuyến hành trình này, phục vụ lợi ích của [Root.GetName].§!"
 distar.246.f:0 "Điều gì đã xảy ra ở đây?"
 distar.246.f.response:0 "§EThật--không may, một sự cố động cơ siêu không gian đã khiến các Khoang Đổ Bộ từ 114 đến 175 bị rơi khỏi siêu không gian cách điểm đến dự kiến 18 parsec.\n\nTôi đã làm tất cả những gì có thể để bảo vệ các bồn ấu trùng, nhưng hệ thống hỗ trợ sự sống đã ngừng hoạt động từ nhiều thế kỷ trước... Giờ đây chỉ còn lại mình tôi.§!"
 distar.246.a:1 "Chào mừng Người Trông Nom!"
 distar.246.a.tooltip:0 "§YQuan chức $NAME_Caretaker$§! được thêm vào danh sách §H$RECRUITABLE_LEADERS$§!."
 distar.246.b:1 "Phân tích các linh kiện của nó."
 distar.246.b.tooltip:0 "Khám xét đơn vị máy móc này để tích lũy kiến thức kỹ thuật."
 distar.246.c:0 "Chính sách của chúng ta cấm sử dụng AI tiên tiến. Hãy đóng kênh liên lạc."
 distar.246.d.destroy:0 "Phá hủy nó!"
 distar.246.d:0 "Chúng ta không thể cho phép một AI vận hành mà không có sự giám sát. Khai hỏa vào khoang đổ bộ đó."
 distar.246.d.tooltip:0 "§RPhá hủy khoang đổ bộ.§!"
 distar.246.machi:1 "Bạn sẽ được đồng hóa."
 distar.246.machi.b:1 "Tháo dỡ nó."
 distar.247.name:0 "$distar.246.name$"
 distar.247.desc:0 "§E...\n\nĐược rồi, <<KHÁCH VÔ DANH C>>. Bạn có thể bắt đầu quá trình phân tích.\n\nTôi--tôi sẽ tiếp tục trông nom các khoang rỗng này.§!"
 distar.247.e:0 "Tại sao bạn không gửi tín hiệu cầu cứu?"
 distar.247.e.response:0 "§ETôi đã tắt đèn tín hiệu khẩn--cấp ba trăm mười hai năm sau khi đến đây.\n\nTôi nhận được một thông điệp từ thế giới mẹ Xolexian thông báo rằng hành tinh đích đến không thể ở được. Người Trông Nom của họ đã... ngừng phản hồi. Tôi hiểu rằng không còn ai đến đón chúng tôi nữa.§!"
 distar.247.a:0 "Phân tích Người Trông Nom."
 distar.248.name:0 "$distar.246.name$"
 distar.248.desc.machi:0 "§EĐiều đó... rất hợp lý. Mong rằng các mạch điện của tôi sẽ hữu ích cho bạn, <<KHÁCH VÔ DANH>>. Xin vui lòng đợi.§!"
 distar.248.desc:0 "§ETôi xin khẳng định rằng tôi đã được lập trình để vận hành không người giám sát trong hàng nghìn năm. Khả năng tự sửa lỗi và cơ chế an toàn của tôi được thiết kế cho tuổi thọ phục vụ tối đa. Xin hãy xem xét lại quyết định tiêu diệt tôi...§!"
 distar.248.machi:0 "Tiến hành tái sử dụng linh kiện."
 distar.248.a:0 "Khai hỏa!"
 distar.249.desc:0 "§ETuyệt--vời.\n\nTôi đã sẵn sàng phục vụ.§!"
 distar.249.a:0 "Chào mừng đến với [Root.GetName], $NAME_Caretaker$."
 distar.249.a.machi:0 "Bắt đầu tích hợp phần mềm."

 distar.250.name:0 "Hành Tinh Biến Pha"
 distar.250.desc:0 "Tàu [Root.GetName] vừa có một phát hiện kinh ngạc trên quỹ đạo [From.GetName]. Hành tinh này sở hữu số lượng trạng thái lượng tử chồng chập trên mỗi đơn vị không gian vượt xa mức từng được coi là khả thi.\n\nSĩ quan Khoa học [Root.GetLeaderName] cho rằng [From.GetName], nơi mà [Root.Leader.GetSheHe] đặt mật danh là $NAME_The_Veil$, tồn tại đồng thời ở cả hai chiều không gian: chiều của chúng ta và một chiều chưa xác định khác.\n\nHơn thế nữa, số lượng trạng thái lượng tử trong các trường hạt bao quanh hành tinh đang tăng lên với tốc độ không đổi. Cho đến nay, vẫn chưa có lý thuyết nào được xác nhận có thể giải thích hiện tượng này. [Root.GetLeaderName] đưa ra giả thuyết rằng năng lượng tâm linh bao qu---\n\n§HĐường truyền bị nhiễu sóng hoàn toàn.§!"
 distar.250.a:0 "Chuyện gì đang xảy ra ngoài đó vậy?"
 distar.251.name:0 "$distar.250.name$"
 distar.251.desc.shroud:1 "Thủy thủ đoàn tàu [Root.GetName] xin lỗi vì báo cáo ban đầu bị ngắt quãng đột ngột. Trong quá trình truyền tin, [phaseshift_planet.GetName] đã trải qua một sự dịch pha không gian hoàn toàn, trường hạt của nó xoay khỏi chiều không gian này và tiến vào chiều khác! Đám mây năng lượng tâm linh đã biến mất, hé lộ một viên ngọc lấp lánh của một thế giới §Y$pc_gaia$§!.\n\nThật kỳ thú, số lượng trạng thái lượng tử chồng chập dường như đã được thiết lập lại khi hành tinh dịch pha, và hiện đang tăng lên với cùng tốc độ như khi hành tinh còn là một §Y$pc_shrouded$§!.\n\n[Root.GetLeaderName] đã sử dụng tốc độ gia tăng chồng chập hạt và tổng số trạng thái lượng tử tại thời điểm chuyển đổi để ngoại suy chu kỳ dịch pha ba tháng của hành tinh. Có lẽ chúng ta có thể phát triển một phương pháp ngăn hành tinh dịch pha... nhưng trước hết chúng ta nên bảo đảm an ninh cho hệ sao."
 distar.251.desc.gaia:1 "Thủy thủ đoàn tàu [Root.GetName] xin lỗi vì báo cáo ban đầu bị gián đoạn đột ngột. Trong quá trình truyền tin, [phaseshift_planet.GetName] đã trải qua một sự dịch pha không gian hoàn toàn, các trường hạt của nó xoay khỏi chiều không gian này và bước vào chiều khác! Viên ngọc lấp lánh của một thế giới §Y$pc_gaia$§! đã biến mất, thay vào đó là một hành tinh xoáy tròn bị che khuất bởi bức màn năng lượng tâm linh.\n\nThật hấp dẫn, số lượng trạng thái lượng tử chồng chập dường như đã được cài đặt lại khi hành tinh chuyển đổi, và hiện đang tăng với tốc độ tương tự như khi hành tinh còn là một §Y$pc_gaia$§!.\n\n[Root.GetLeaderName] đã dựa vào tốc độ gia tăng chồng chập hạt và tổng số trạng thái lượng tử tại thời điểm chuyển tiếp để suy ra chu kỳ dịch pha ba tháng của hành tinh. Có lẽ chúng ta có thể tìm ra cách ngăn hành tinh biến mất... nhưng trước hết chúng ta cần kiểm soát hệ sao này."
 distar.302.desc:0 "$distar.302.desc.noproj$ Có lẽ chúng ta có thể phát triển một phương pháp để ngăn hành tinh này dịch pha biến mất..."
 distar.302.desc.noproj:0 "Tàu [Root.GetName] đã có một phát hiện khó tin trên quỹ đạo của [From.GetName]. Hành tinh này sở hữu số lượng trạng thái lượng tử chồng chập trên mỗi đơn vị không gian vượt xa những gì từng được cho là khả thi.\n\nSĩ quan Khoa học [Root.GetLeaderName] gợi ý rằng [From.GetName], nơi mà [Root.Leader.GetSheHe] đặt mật danh là $NAME_The_Veil$, tồn tại đồng thời ở hai chiều không gian: chiều của chúng ta và một chiều chưa xác định khác.\n\n[Root.GetLeaderName] đã sử dụng tốc độ gia tăng chồng chập hạt và tổng số trạng thái lượng tử tại thời điểm chuyển pha để suy đoán ra chu kỳ chuyển đổi ba tháng của hành tinh."
 distar.303.desc:0 "Các chỉ số năng lượng dư thừa bao quanh [From.GetName] chỉ ra rằng cách đây không lâu, hành tinh này từng sở hữu số lượng trạng thái lượng tử chồng chập trên mỗi đơn vị không gian vượt xa những gì từng được coi là khả thi. Sĩ quan Khoa học [Root.GetLeaderName] cho rằng [From.GetName], nơi mà [Root.Leader.GetSheHe] đặt mật danh là $NAME_The_Veil$, đã tồn tại đồng thời ở hai chiều không gian trong quá khứ không xa: chiều của chúng ta và một chiều chưa xác định khác.\n\nHành tinh kể từ đó đã bị khóa vào pha không gian hiện tại, và được coi là an toàn để khai hoang."

 distar.253.name:0 "Khóa Pha"
 distar.253.desc:0 "Sau sáu tháng tính toán số liệu, phản biện lý thuyết và tranh luận sôi nổi, thủy thủ đoàn tàu [Root.GetName] đã tìm ra một phương pháp có thể khóa các trường hạt của hành tinh vào trạng thái danh định, ngăn chặn sự dịch chuyển giữa các chiều không gian.\n\nMột xung năng lượng được điều chỉnh thích hợp sẽ đóng băng [phaseshift_planet.GetName] ở một trạng thái, khóa nó vào một hình thái ổn định dưới dạng một thế giới §Y$pc_gaia$§!."
 distar.253.a.tooltip:0 "Hành tinh [phaseshift_planet.GetName] sẽ được chuyển đổi vĩnh viễn thành một thế giới §Y$pc_gaia$§!."
 distar.253.b:0 "Nghĩ kỹ lại thì... hãy cứ để nguyên như vậy."
 distar.255.name:0 "$distar.250.name$"
 distar.255.desc:0 "Giờ đây khi [phaseshift_planet.GetName] đã nằm trong biên giới của chúng ta, chúng ta nên điều tra khả năng ổn định trạng thái biến động không gian của hành tinh. Nếu muốn cư trú trên thế giới §Y$pc_gaia$§! lộng lẫy, chúng ta sẽ phải nghĩ ra phương pháp ngăn [phaseshift_planet.GetName] dịch pha trở lại thành một §Y$pc_shrouded$§! cứ mỗi ba tháng một lần."
 distar.255.desc.first:0 "Hành tinh mới giành được của chúng ta, §Y[phaseshift_planet.GetName]§! trong hệ sao [phaseshift_planet.GetStarName], thể hiện những đặc tính vô cùng khó tin. Bị bao bọc bởi một lớp vỏ kỳ lạ chỉ có thể mô tả là năng lượng tâm linh, [phaseshift_planet.GetName] sở hữu số lượng trạng thái lượng tử chồng chập trên mỗi đơn vị không gian vượt xa mức từng được cho là khả thi.\n\nCứ mỗi ba tháng, số lượng trạng thái đạt đến mức tới hạn, và [phaseshift_planet.GetName] trải qua một sự dịch pha không gian hoàn toàn, trường hạt của nó xoay khỏi chiều này và bước vào chiều khác. Vòng xoay này dịch chuyển một thế giới §Y$pc_shrouded$§! từ chiều khác vào chiều của chúng ta, để rồi lại dịch chuyển trở lại một thế giới §Y$pc_gaia$§! vào cuối chu kỳ tiếp theo.\n\nNếu muốn cư trú trên thế giới §Y$pc_gaia$§! lộng lẫy, chúng ta sẽ phải tìm cách ngăn [phaseshift_planet.GetName] chuyển trở lại thành một §Y$pc_shrouded$§! cứ mỗi ba tháng."
 distar.255.a:0 "Vậy hãy tìm cách khóa pha cho hành tinh này."
 distar.255.b:0 "Chúng ta còn việc quan trọng hơn cần giải quyết."
 distar.256.name:0 "$distar.250.name$"
 distar.256.desc:0 "Tàu [Root.GetName] báo cáo rằng hành tinh [phaseshift_planet.GetName] thể hiện những đặc tính khó tin. Bị bao bọc bởi lớp năng lượng tâm linh kỳ lạ, nó liên tục dịch chuyển giữa một thế giới §Y$pc_shrouded$§! và một thế giới §Y$pc_gaia$§!."

 distar.261.name:0 "Sinh Vật Nhân Thực Hoang Dã"
 distar.261.desc:1 "Sau khi điều tra các công trình bị cây cối phủ kín trên [From.GetName], Sĩ quan Khoa học [Root.GetLeaderName] đã phát hiện ra mục đích ban đầu của chúng: đây từng là các cơ sở chăn nuôi và chế biến sinh vật [livestock_species.GetName] khổng lồ, được lai tạo đặc biệt để làm nguồn thực phẩm."
 distar.261.a.servi:0 "Những sinh vật hữu cơ đáng quý. Chúng xứng đáng được chăm sóc tốt nhất."
 distar.261.a.assim:0 "Giá trị đồng hóa: dưới mức tối ưu."
 distar.261.a.exter:0 "Chúng sẽ bị tiêu diệt. Mọi thứ đều cần đúng thời điểm."
 distar.261.a.evopred: "Thật bất lịch sự nếu không nếm thử một chút mẫu vật."
 distar.262.name:0 "Sinh Vật Nhân Thực Thơm Ngon"
 distar.262.desc:0 "Giờ đây khi đã định cư trên [From.GetName], chúng ta nên quyết định cách xử lý các sinh vật [livestock_species.GetName] hoang dã đang sinh sống trên bề mặt.\n\nThông thường chúng ta sẽ không can thiệp, nhưng các mẫu vật phẩm cho thấy thịt của loài [livestock_species.GetName] cực kỳ thơm ngon và bổ dưỡng!"
 distar.262.a:0 "Thật hấp dẫn. Nhưng chúng ta sẽ tuân thủ các quy tắc chính sách của mình."
 distar.262.b:0 "Công dân của chúng ta cần được ăn ngon!"
 distar.262.b.tooltip:0 "Gom toàn bộ quần thể [livestock_species.GetName] trên [From.GetName] vào một £building£ §H$building_livestock_processing_center$§!.\n(Sản xuất: £food£ §G+10§!)"
 distar.262.b.tooltip.2:0 "Lùa các quần thể [livestock_species.GetName] trên [From.GetName] vào trung tâm chế biến.\n(Sản xuất: £food£ §G+10§!)"

 distar.265.name:0 "Âm Hóa Khoa Học"
 distar.265.desc:0 "Tàu [Root.GetName] đã thành công trong việc tách biệt một tín hiệu ẩn giấu bên trong mô hình nhiễu sóng kỳ lạ của hệ sao [From.GetStarName]. Sĩ quan Khoa học [Root.GetLeaderName] và các nhà khoa học hàng đầu tại [Owner.GetScientistCapital] nhận thấy tín hiệu chứa đựng một bản giao hưởng dữ liệu phức tạp ghi lại quá trình vận động của các dòng hạt vi mô."
 distar.270.name:0 "Đa Diện Bí Ẩn"
 distar.270.desc:2 "Thủy thủ đoàn tàu [Root.GetName] dưới sự chỉ đạo của Sĩ quan Khoa học [Root.GetLeaderName] đã thu hồi khối đa diện phản quang gần [From.GetName] và đưa lên tàu để nghiên cứu kỹ lưỡng. Bề mặt của vật thể được gia công chuẩn xác đến mức hoàn hảo tuyệt đối, không có bất kỳ sai số nguyên tử nào."
 discovery.270.a:0 "Quả thực rất kỳ lạ."

####################################
# Ruined Empire: Junkheap Ratlings
####################################
 distar.230.name:0 "Những Thế Giới Đổ Nát"
 distar.230.desc:0 "Thủy thủ đoàn tàu [Root.GetName] báo cáo về sự hiện diện của các trạm không gian đổ nát mục nát và hàng loạt thế giới chết chóc trong hệ sao [From.GetName], đặc biệt là tại [ratling_planet_tar.GetName]. Một đế chế du hành vũ trụ từng ngự trị nơi đây trước khi sụp đổ trong một thảm họa hạt nhân."
 distar.230.exter:0 "Nếu còn kẻ nào sống sót, chúng sẽ bị tận diệt."
 distar.231.name:0 "Thủ Đô Hoang Tàn"
 distar.231.desc:0 "Đúng như những nghi vấn ban đầu của thủy thủ đoàn tàu [Root.GetName], [From.GetName] từng là hành tinh thủ đô của đế chế đã diệt vong. Toàn bộ bề mặt hành tinh bị bao phủ bởi những đống phế liệu khổng lồ cao như núi, và cảm biến vừa ghi nhận những rung động chuyển động ngầm bên dưới các bãi rác cơ khí này!"
 distar.231.phobe:0 "Thật may là đã tống khứ được nó."
 distar.233.name:0 "Những Vị Khách Bất Ngờ"
 distar.233.desc:0 "Các báo cáo tình báo gửi về [Root.Capital.GetName] liên quan đến bề mặt vốn được cho là không có sự sống của [notif_planet.GetName] trong hệ sao [notif_planet.GetStarName]. Những gì mà các nhà khảo sát ban đầu coi là một bãi phế liệu hành tinh không thể cư trú, trên thực tế, lại là quê hương của một giống loài có tri giác giống chuột!\n\nĐược mệnh danh là \"$NAME_Ketlings$\", những sinh vật này đã sống ẩn mình trong các đường hầm bên dưới các bãi rác cơ khí khổng lồ của hành tinh. Thành phần phức tạp và mật độ dày đặc đáng kinh ngạc của các bãi phế liệu này chắc chắn đã cản trở khả năng quét sâu trước đây của các cảm biến.\n\nBất kể điều gì đã đưa $NAME_Ketlings$ lên bề mặt thì hiện vẫn chưa rõ, nhưng giờ đây khi quan sát chúng, chúng ta nhận thấy công nghệ của chúng gần như hoàn toàn dựa trên việc tái sử dụng phế liệu từ các tàn tích hành tinh mà chúng cư ngụ.\n\nLiệu $NAME_Ketlings$ có thể là những kẻ sống sót cuối cùng của nền văn minh liên sao đã tạo ra các phế tích này? Một nghiên cứu chi tiết hơn có thể mang lại nhiều thông tin hơn."
 distar.233.phobe:0 "Kinh tởm."
 distar.234.name:0 "Nguồn Gốc Của Loài $NAME_Ketlings$"
 distar.234.desc:1 "Cuộc điều tra của [Root.GetLeaderName] về giống loài có tri giác dạng chuột trên [From.From.GetName] đã mang lại một số kết quả bất ngờ. $NAME_Ketlings$ là các thực thể tâm linh, có khả năng chia sẻ suy nghĩ thông qua mạng lưới thần giao cách cảm kết nối hàng triệu tâm trí nhỏ bé. Mặc dù chúng tránh tương tác với chúng ta, và chúng ta thiếu bằng chứng cho thấy chúng có khả năng du hành vũ trụ tiên tiến, nhưng sẽ là sai lầm nếu phân loại $NAME_Ketlings$ chỉ là sinh vật nguyên thủy đơn thuần. Trên thực tế, một số máy móc tái chế của chúng sở hữu sự tinh vi về mặt kỹ thuật tiếp cận trình độ của chính chúng ta.\n\nHơn nữa, $NAME_Ketlings$ không phải là hậu duệ của nền văn minh đã xây dựng các thành phố này, cũng không phải là những kẻ chinh phục đã phá hủy chúng. Đúng hơn, $NAME_Ketlings$ từng là thú cưng của những nhà du hành vũ trụ đầu tiên khai hoang các hệ sao này! Sau sự sụp đổ của chủ nhân, các sinh vật tiền-$NAME_Ketlings$ là một trong số ít loài sống sót qua nhiều thế kỷ bụi phóng xạ hạt nhân trên những hành tinh đổ nát này.\n\nViệc liên tục tiếp xúc với các nguyên tố phóng xạ đã dẫn đến đột biến nhanh hơn trong mã gen của $NAME_Ketlings$, và các chi linh hoạt, trí thông minh ban đầu tương đối cao cùng việc tiếp cận gần gũi với vô số công cụ phế thải đều đã thúc đẩy sự xuất hiện nhanh chóng của một nền văn hóa tiên tiến về mặt kỹ thuật."
 distar.234.desc.spacefaring:0 "Cuộc điều tra của [Root.GetLeaderName] về loài $NAME_Ketlings$ trên [From.From.GetName] đã đưa ra kết luận chấn động: chúng đã thích nghi với bức xạ nguyên tử trên các thế giới đổ nát và phát triển một trí tuệ tâm linh tập thể độc đáo, giúp chúng vận hành những công nghệ phế liệu vượt xa mong đợi."
 distar.234.phobe:0 "Thật đáng lo ngại."
 distar.235.name:0 "Hành Tinh $NAME_Ketling$ Bị Khuất Phục"
 distar.235.desc:1 "Chúng ta đã chinh phục thành công [From.From.GetName] từ tay những cư dân bãi rác kỳ lạ, loài $NAME_Ketlings$. Tùy thuộc vào chính sách của đế chế, chúng ta sẽ quyết định cách tích hợp hoặc xử lý quần thể mới này."
 distar.235.desc.assim:0 "Chúng ta đã chinh phục thành công [From.From.GetName] từ tay loài $NAME_Ketlings$ kỳ lạ sống trong bãi rác.\n\nNhững cư dân $NAME_Ketlings$ kỳ lạ này sẽ được hấp thụ vào [Root.GetName]."
 distar.235.desc.none_left:1 "Chúng ta đã giành quyền kiểm soát [From.From.GetName]. Những cá thể $NAME_Ketlings$ cuối cùng trên bề mặt đã bị loại bỏ hoặc phân tán, để lại thế giới hoang tàn này cho chúng ta khai thác tài nguyên."
 distar.235.desc.none_left.assim:0 "Chúng ta đã chinh phục thành công [From.From.GetName] từ những cá thể $NAME_Ketlings$ cuối cùng sống trong bãi rác.\n\nTàn dư cuối cùng của loài $NAME_Ketlings$ kỳ lạ sẽ được hấp thụ vào [Root.GetName]."
 distar.237.name:0 "Hoạt Động Của $NAME_Ketling$ Trong Hệ Sao [sensor_ratling_system.GetName]"
 distar.237.desc:0 "Cảm biến báo cáo một sự bùng nổ hoạt động bất ngờ trong hệ sao [sensor_ratling_system.GetName]. Loài $NAME_Ketlings$ trước đây dường như đang tập hợp một hạm đội tàu phế liệu đồ sộ và mở rộng lãnh thổ sang các hệ sao lân cận!"
 distar.311.name:0 "Đồng hồ nguyên tử đếm ngược"
 distar.311.desc.base:0 "Các nhà nghiên cứu trên [Root.Capital.GetName] đã háo hức chờ đợi thời khắc đếm ngược của chiếc đồng hồ nguyên tử chính xác kỳ diệu được tìm thấy trên [From.From.From.GetName] suốt 42 năm và 3 ngày qua.\n\nNhiều thập kỷ suy đoán và phỏng đoán sôi nổi đã bốc hơi trong chớp mắt: chiếc đồng hồ vừa chạm đến hạn định trọng đại của nó, phun ra một luồng hạt robot nano tự nhân bản!"
 distar.311.desc:0 "$distar.311.desc.base$\n\nNhững robot nano này đang di chuyển theo quỹ đạo hướng tới một hành tinh khác trong Hệ sao [atomic_clock_planet.GetStarName], đó là [atomic_clock_planet.GetName], dự kiến sẽ tới nơi trong vòng một tháng.\n\nBất cứ điều gì xảy ra khi chúng đến nơi vẫn còn phải chờ xem..."
 distar.311.a:0 "Hãy luôn cập nhật tin tức cho chúng tôi."
 distar.311.a.tooltip:0 "Báo cáo cập nhật sẽ được đưa ra ngay khi luồng robot nano chạm tới mục tiêu."
 distar.311.b:0 "Không thể chấp nhận được. Bắn hạ đám robot nano đó ngay!"
 distar.311.b.tooltip:0 "Ra lệnh cho hạm đội trong hệ sao tiêu diệt luồng robot nano trước khi chúng đến đích."
 distar.312.name:0 "Cuộc Đổ Bộ"
 distar.312.desc:0 "Luồng robot nano được phóng ra bởi đồng hồ nguyên tử trong vành đai tiểu hành tinh của hệ sao [atomic_clock_planet.GetStarName] đã đáp xuống [atomic_clock_planet.GetName]! Nhân bản với tốc độ khó tin, các robot nano bao phủ toàn bộ bề mặt hành tinh chỉ trong vài giờ, tiến hành cải tạo địa cầu nó thành một §YThế Giới Gaia§!!\n\nVài giờ sau khi hoàn tất quá trình cải tạo, các robot nano tham gia đã ngừng hoạt động và phân rã không thể nhận diện, khiến chúng ta khó có thể trích xuất thông tin từ chúng.\n\nTuy nhiên, tàn tích của chúng đã rải khắp bề mặt hành tinh quyến rũ này những hợp chất kim loại vô cùng giá trị."
 distar.313.name:0 "Robot Nano Lạc Lối"
 distar.313.desc:0 "Các sĩ quan quân đội của chúng ta quan sát Hệ sao [atomic_clock_planet.GetStarName] báo cáo rằng trong khi đại đa số các robot nano hướng về phía [atomic_clock_planet.GetName] đã bị bắn hạ và tiêu diệt, một lượng nhỏ robot nano vẫn còn hoạt động đã tiếp cận được bề mặt hành tinh.\n\nBất kể mục đích ban đầu của chúng là gì, một khi chạm tới bề mặt, chúng bắt đầu nhân bản nhanh chóng theo một phương thức ngẫu nhiên.\n\n[atomic_clock_planet.GetName] giờ đây bị bao phủ trong một lớp bùn chuyển động của những cỗ máy nhân bản siêu vi."
 distar.315.name:0 "$distar.311.name$"
 distar.315.desc:0 "$distar.311.desc.base$\n\nĐám robot nano đã biến đổi bề mặt tiểu hành tinh thành một chiến hạm không người lái cực kỳ tối tân, sẵn sàng gia nhập lực lượng của chúng ta!"
 distar.320.name:0 "$distar.311.name$"
 distar.320.desc:0 "$distar.311.desc.base$\n\nCác hạt robot nano đã xây dựng một mạng lưới tính toán khổng lồ trên bề mặt của [From.From.From.GetName], tạo ra một trung tâm nghiên cứu khoa học tự động vô song."

 enraged_army:0 "$NAME_Enraged_Colonists$"
 enraged_army_desc:0 "Bị nhiễm một chứng bệnh tâm thần bí ẩn, những người định cư này đã trở nên hung bạo và sẵn sàng tấn công mọi thứ xung quanh."

####################################
# Buildings
####################################
 building_cryonic_clones:0 "Bản Sao Đông Lạnh"
 building_cryonic_clones_desc:0 "Khi thế giới dạng vòng này vẫn còn là đống đổ nát, có hàng trăm sinh vật nhân bản ngoài hành tinh được niêm phong trong các buồng ngủ đông. Hiện tại những buồng ngủ đông được phục hồi này đã trở thành một đài tưởng niệm."
 building_the_zone:0 "Khu vực A"
 building_the_zone_desc:0 "Trên hành tinh này có một khu vực hình vuông rộng mười ba km, rải rác những tàn tích không rõ nguồn gốc và rất nhiều tạo tác ngoài hành tinh độc đáo và kỳ lạ. Điều khó hiểu là, nó cũng khiến những người ghé thăm nảy sinh cảm giác mãn nguyện."
 building_junkheap:0 "Đống Phế Liệu"
 building_junkheap_desc:0 "Một đống ngổn ngang rỉ sét, nhiễm phóng xạ của cơ sở hạ tầng sụp đổ và xác tàu đổ nát, tàn tích của một nền văn minh đã sụp đổ từ lâu."
 building_livestock_processing_center:0 "Trung Tâm Chế Biến"
 building_livestock_processing_center_desc:0 "Các sinh vật dạng nấm bản địa của hành tinh này đã được biến đổi gen để trở nên hiền lành... và ngon miệng. Trung tâm chế biến này phụ trách việc vỗ béo và thu hoạch chúng."
 ####################################
 # Tile Blockers
 ####################################
 exofungus_blocker:0 "£blocker£ Nấm Ngoại Lai Xâm Lấn"
 exofungus_blocker_desc:0 "Loại nấm ngoại lai xâm lăng hành tinh này lây lan như tế bào ung thư, phá hủy cảnh quan và cản trở cơ sở hạ tầng mặt đất."

 ####################################
 # Event Chain-related
 ####################################

## events_l_english.yml
 living_planet_chain_title:0 "Tiếp Xúc Chưa Xác Định"
 living_planet_chain_desc:3 "Các báo cáo sơ bộ cho thấy đại dương bao phủ §Y[From.GetName]§! thực chất là một sinh thể khổng lồ có tri giác chưa từng được biết đến."
 ketling_study_chain_title:0 "Nguồn Gốc Của Ketling"
 ketling_study_chain_desc:0 "Nghiên cứu các sinh vật thông minh kỳ lạ sống trong các đường hầm bãi rác trên ba hệ sao kết nối có thể giúp chúng ta hiểu rõ hơn về nền văn minh từng sở hữu các thế giới này."

## modifiers_l_english.yml
 opinion_stole_supplies:0 "Chiếm Đoạt Hàng Tiếp Tế"
 opinion_returned_supplies:0 "Trao Trả Hàng Tiếp Tế"
 frozen_in_time:0 "Đóng Băng Theo Thời Gian"
 frozen_in_time_desc:0 "Tàn tích của một nền văn minh đã mất trên hành tinh này, bị dập tắt như ngọn nến khi siêu bão lửa quét sạch khí quyển."
 superflare_star:0 "Siêu Bão Lửa"
 superflare_star_desc:0 "Ngôi sao này thỉnh thoảng phát ra các siêu bão lửa dữ dội, phóng một lượng khổng lồ plasma nhiệt hạch vào không gian hệ sao."
 superflare_planet:0 "Cảnh Báo Siêu Bão Lửa"
 superflare_planet_desc:0 "Ngôi sao của hành tinh này nổi tiếng với các đợt siêu bão lửa kinh hoàng, có thể gây hại nghiêm trọng cho sinh vật và thiết bị điện tử trên bề mặt."
 superflare_struck:0 "Hậu Quả Siêu Bão Lửa"
 superflare_struck_desc:0 "Hành tinh này vừa hứng chịu một siêu bão lửa từ mặt trời, dẫn đến mức độ phóng xạ tăng cao và làm tê liệt các thiết bị điện tử."
 superflare_avoided:0 "Lá Chắn Siêu Bão Lửa"
 superflare_avoided_desc:0 "Người dân trên hành tinh này được bảo vệ an toàn trước tác hại của các đợt siêu bão lửa nhờ lưới lá chắn từ trường."
 black_hole_energy:0 "Bồi Tụ Năng Lượng"
 black_hole_energy_desc:0 "Đĩa bồi tụ quanh lỗ đen này tích điện rất cao, liên tục phát sinh các dòng năng lượng tĩnh điện cực lớn."
 black_hole_hologram:0 "Ảnh Toàn Phần Hạm Đội"
 black_hole_hologram_desc:0 "Một hạm đội bí ẩn từng tiến vào chân trời sự kiện của lỗ đen này, để lại ảo ảnh quang học vĩnh cửu trên bề mặt phản xạ của đĩa bồi tụ."
 primitive_robots:0 "Robot Thô Sơ"
 primitive_robots_desc:0 "Những robot cổ đại vẫn tiếp tục hoạt động theo quán tính trên thế giới này, dù những kẻ chế tạo ra chúng đã tuyệt diệt từ lâu."
 erratic_behavior:0 "Hành Vi Bất Thường"
 erratic_behavior_desc:0 "Quần thể này đang thể hiện những hành vi kỳ quái, đôi khi hung bạo do ảnh hưởng của dịch bệnh thần kinh."
 conviction:0 "Niềm Tin Tuyệt Đối"
 conviction_desc:0 "Quần thể này tin chắc rằng chúng ta là những sứ giả phái đến từ vị thần của họ, do đó họ luôn khao khát được làm hài lòng chúng ta."
 researcher_rage:0 "Nhà Nghiên Cứu Cuồng Nộ"
 researcher_rage_desc:0 "Một loại virus thần kinh gây hoang tưởng và hung hãn đã làm tổn hại nặng nề đến các nhà khoa học xã hội trên hành tinh này."
 evolved_weapon_boost:0 "Cường Hóa Vũ Khí Tiến Hóa"
 evolved_weapon_boost_2:0 "$evolved_weapon_boost$"
 evolved_firing_rate:0 "Tốc Độ Bắn Tiến Hóa"
 evolved_evasion:0 "Né Tránh Tiến Hóa"
 clones_in_cryo:0 "Bản Sao Trong Giấc Ngủ Đông"
 clones_in_cryo_desc:0 "Hàng trăm bản sao ngoài hành tinh vẫn đang được niêm phong trong các khoang ngủ đông sâu trên Thế Giới Vành Đai đổ nát này."
 dead_god:0 "Kẻ Khổng Lồ Câm Lặng"
 dead_god_desc:0 "Bộ xương hóa thạch khổng lồ của một quái thú ngoài hành tinh vô danh nằm yên nghỉ trên bề mặt mặt trăng này."
 dead_god_planet:0 "Vị Thần Đã Chết"
 dead_god_planet_desc:0 "Xác chết của một quái thú khổng lồ ngoài hành tinh lặng lẽ dõi theo hành tinh này từ quỹ đạo trên cao."
 dead_god_planet_hidden:0 "Xung Lực Khó Hiểu"
 dead_god_planet_hidden_desc:0 "Các dạng sống hữu cơ trên hành tinh này đang chịu ảnh hưởng bởi một hiện tượng tâm linh bí ẩn chưa thể giải thích."
 life_electric:0 "Sự Sống Điện Từ"
 life_electric_desc:0 "Một mạng lưới các xung điện từ sống động đan xen chằng chịt khắp bề mặt của tiểu hành tinh này."
 rummy_nebula:0 "Chất Say Ngoại Lai"
 rummy_nebula_desc:0 "Việc phát hiện ra một hành tinh khí khổng lồ chứa hàng tỷ lít ester lên men giống hệt rượu truyền thống đã khiến công dân vô cùng phấn khởi."
 opinion_gave_space_rum:0 "Nhận Được Rượu Ngoại Lai"
 opinion_space_rum_failed:0 "Món Quà Bị Hiểu Lầm"
 soothing_crystals:0 "Tinh Thể Cộng Hưởng"
 soothing_crystals_desc:0 "Các tinh thể cộng hưởng phân bố trong vỏ kiến tạo của hành tinh này phát ra tần số sóng âm có tác dụng trị liệu y học cho giống loài của chúng ta."
 good_vibrations:0 "Từ Trường Êm Dịu"
 good_vibrations_desc:0 "Từ quyển của hành tinh này dao động ở tần số đặc biệt có lợi cho mạng lưới thần kinh của chúng ta."
 exofungus:0 "Nhiễm Nấm Ngoại Lai"
 exofungus_desc:0 "Một loài nấm ngoại lai ưa môi trường khắc nghiệt đang lây lan trên hành tinh như tế bào ung thư, nuốt chửng thảm thực vật bản địa."
 watery_grave:0 "Nấm Mồ Dưới Nước"
 watery_grave_desc:0 "Tàn tích của một tập hợp sinh vật chân khớp cổ đại trải dài từ cực này sang cực kia dưới đáy đại dương của hành tinh này."
 big_friendly_warform_power:0 "Thân Tàu Kiên Cố"
 big_friendly_warform_power_desc:0 "Cấu trúc của chiến hạm robot này sở hữu lớp vỏ bọc kiên cố khác thường so với kích thước của nó."
 brainslug_woes:0 "Chứng Sợ Sên Não"
 brainslug_woes_desc:0 "Cư dân trên thế giới này cảm thấy bất an và lo sợ trước những người đồng bào lựa chọn gắn kết cộng sinh với sên não."
 brainslug_woes_phobe:0 "$brainslug_woes$"
 brainslug_woes_phobe_desc:0 "$brainslug_woes_desc$"
 brainslug_hive:0 "Thích Nghi Với Sên Não"
 brainslug_hive_desc:0 "Thế giới này đang gặp đôi chút khó khăn trong việc điều chỉnh để thích ứng với mối quan hệ cộng sinh mới với sên não."
 predatory_plants:0 "Thực Vật Săn Mồi"
 predatory_plants_desc:0 "Những loài đại thực vật hung dữ thống trị cảnh quan hành tinh này, vừa mang lại cơ hội nghiên cứu sinh học vừa là mối đe dọa thường trực cho người khai hoang."
 living_sea:0 "Biển Ý Thức"
 living_sea_desc:0 "Dù bản chất của đại dương hành tinh này vẫn là một ẩn số, nó chắc chắn là một thực thể sống. Những suy nghĩ, ảo ảnh và cảm xúc dạt dào liên tục tuôn trào trong tâm trí của những sinh vật hữu cơ tiếp xúc với nó."
 scavenger_bot_power:0 "Sức Mạnh Kẻ Nhặt Rác"
 elderly_tiyanki_power:0 "Sức Mạnh Tiyanki Đầu Đàn"
 ahab_power:0 "Sức Mạnh AH4B"
 scavenger_weak_points:0 "Kẻ Tiêu Diệt Cỗ Máy Thu Gom"
 scavenger_weak_points_desc:0 "Cỗ Máy Thu Gom Phế Liệu không được chế tạo theo bất kỳ bản thiết kế đồng bộ nào. Cấu trúc chắp vá của nó tồn tại những điểm yếu trọng yếu mà hạm đội của chúng ta có thể triệt để khai thác."
 elderly_tiyanki_weak_points:0 "Khai Thác Điểm Yếu Đầu Đàn"
 elderly_tiyanki_weak_points_desc:0 "Có một vết nứt hiểm yếu trên lớp giáp của Tiyanki Đầu Đàn cổ đại - một quả ngư lôi proton khổng lồ chưa phát nổ găm sâu vào da thịt của nó. Hạm đội của chúng ta biết chính xác cách kích nổ đầu đạn này."
 mod_damage_vs_country_type_guardian_scavenger_bot_mult:0 "Sát thương lên Cỗ Máy Thu Gom Phế Liệu"
 mod_damage_vs_country_type_guardian_elderly_tiyanki_mult:0 "Sát thương lên Tiyanki Đầu Đàn"
 opinion_ratling_system_stolen:0 "$NAME_Ketling$ Planet Subdued"
 phaseshifted:0 "Dịch Pha Không Gian"
 phaseshifted_desc:0 "Hành tinh này định kỳ dịch chuyển giữa các chiều không gian, liên tục hoán đổi giữa một thế giới §Y$pc_shrouded$§! và một thế giới §Y$pc_gaia$§!. Khi ở trạng thái bị Tấm Màn che khuất, hành tinh hoàn toàn không thể ở được."
 COLONIZATION_IMPOSSIBLE_PHASESHIFTING: "$TRIGGER_FAIL$§RKhông thể khai hoang các thế giới đang trong quá trình dịch pha không gian.§!"
 nanite_network:0 "Mạng Lưới Tính Toán"
 nanite_network_desc:0 "Một mạng lưới tính toán có mục đích chưa xác định đã được xây dựng tại đây bởi luồng robot nano phun trào từ đồng hồ nguyên tử bí ẩn."

