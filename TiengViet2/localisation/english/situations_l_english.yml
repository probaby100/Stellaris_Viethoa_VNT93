 ### The Kaleidoscope
 ### By Giada Zavarise

 ## Situation
 situation_kaleidoscope: "Kính Vạn Hoa"
 situation_kaleidoscope_type: "Kính Vạn Hoa"
 situation_kaleidoscope_desc: "Một loài ký sinh năng lượng đầy màu sắc đang lây nhiễm vào lưới điện của chúng ta, ngấu nghiến các nguồn cung cấp năng lượng. Chúng ta có thể nuông chiều nó, hoặc sử dụng một §YChiến Dịch Gián Điệp§! để chuyển vấn đề này sang đế chế khác.\n\n[GetKaleidoscopeMood]."
 situation_kaleidoscope_monthly_change_tooltip: "Bỏ đói §HKính Vạn Hoa§! sẽ làm giảm §Ytâm trạng§! của nó, tăng khả năng xảy ra các sự kiện tiêu cực. Nuôi ăn nó sẽ cải thiện tâm trạng, giữ cho nó được xoa dịu và hiền hòa."

 situation_unknown_outcome_kaleidoscope: "§YTâm trạng§! của Kính Vạn Hoa sẽ quyết định kết cục cuối cùng."

 approach_no_food: "Không Nuôi Nó"
 approach_no_food_tooltip: "Làm giảm §Ytâm trạng§!. Kính Vạn Hoa bị bỏ đói sẽ nổi cơn thịnh nộ và gây rắc rối cho chúng ta."
 approach_little_food: "Cho Nó Ăn"
 approach_little_food_tooltip: "Cải thiện §Ytâm trạng§!. Kính Vạn Hoa no đủ sẽ tạo ra ánh sáng dễ chịu và ít gây rắc rối."
 approach_a_lot_of_food: "Cho Ăn Quá No"
 approach_a_lot_of_food_tooltip: "Cải thiện vượt bậc §Ytâm trạng§!. Kính Vạn Hoa no nê quá mức sẽ không gây bất kỳ rắc rối nào, nhưng nó sẽ tiêu tốn của chúng ta rất nhiều năng lượng."
 kaleidoscope_progress: "Quá Tải"

 # Strings for GetKaleidoscopeMood trigger loc script
 kaleidoscope_mood_angry: "Kính Vạn Hoa đang §Ptức giận§! và sẵn sàng bộc phát bất cứ lúc nào."
 kaleidoscope_mood_neutral: "Kính Vạn Hoa đang §Sthanh thản§!. Chừng nào nó nhận được thức ăn, nó sẽ không làm loạn."
 kaleidoscope_mood_happy: "Kính Vạn Hoa đang §Bhân hoan§!. Màu sắc của nó rực rỡ như chính tâm trạng của nó."

