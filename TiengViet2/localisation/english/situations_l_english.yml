#Operations

 operation_consume_star:0 "Nuốt Chửng Ngôi Sao"
 operation_consume_star_desc:0 "Với $devourers_plasma$ trong đế chế, chúng ta có quyền tiếp cận một bầy Quái Thú Nuốt Sao tí hon. Chúng ta chỉ cần quyết định xem sẽ nuốt chửng ngôi sao nào."
 operation_consume_star_on_success:1 "$IF_SUCCESSFUL|E$\nNhiễm Quái Thú Nuốt Sao vào ngôi sao thủ đô của [target.GetName], chúng sẽ từ từ nuốt chửng ngôi sao đó."
 operation_consume_star_black_hole:0 "Thủ đô của đế chế mục tiêu quay quanh một lỗ đen, khiến bầy Quái Thú Nuốt Sao của chúng ta không có gì để ăn."
 operation_consume_star_no_dysonsphere:0 "Chúng ta không thể tiếp cận ngôi sao vì nó đã bị niêm phong bên trong một Quả Cầu Dyson."
 operation_consume_star_already_know:0 "Đế chế này đã tìm ra cách khắc chế bầy Quái Thú Nuốt Sao của chúng ta."
 operation_consume_star_already_infested:0 "Ngôi sao thủ đô của đế chế này đã bị nhiễm Quái Thú Nuốt Sao rồi."

