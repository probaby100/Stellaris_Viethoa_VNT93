 ## Intro
 # The Kaleidoscope appears on your capital
 situation.2003.name: "Sắc Màu Ngoài Không Gian"
 situation.2003.desc: "Mọi ngọn đèn trên §H[capital_scope.GetName]§! bỗng nhiên vụt tắt. Các nhà máy tối om, giao thông tê liệt, và các thiết bị liên lạc không phản hồi. Đó là một đợt mất điện đột ngột trên toàn cầu, tức thì và khó hiểu.\n\nKhi sự tĩnh lặng và bóng tối bao trùm hành tinh của chúng ta, những ánh sáng kỳ lạ nở rộ trên bầu trời, bao bọc hệ sao thủ đô của chúng ta trong một làn sương vạn hoa. Hai sự kiện này chắc chắn có liên quan, nhưng các [root.GetTechnicianPlural] của chúng ta vẫn đang hoàn toàn mò mẫm trong bóng tối - vâng, theo nghĩa đen."
 situation.2003.a: "Khôi phục lưới điện của chúng ta."

 # Notify other countries about the Kaleidoscope
 situation.2004.name: "$situation.2003.name$"
 # first time
 situation.2004.desc: "Các cảm biến của chúng ta báo cáo sự xuất hiện của các hoa văn ánh sáng vạn hoa trong hệ sao §H[kaleidoscope_system.GetName]§!. Bản chất của hiện tượng này vẫn chưa rõ ràng."
 # moved again
 situation.2004.desc.again: "Ảo ảnh vạn hoa mà chúng ta quan sát trước đây đã di chuyển tới hệ sao §H[kaleidoscope_system.GetName]§!."

 # Project - mid-event
 situation.2005.name: "Mất Điện"
 situation.2005.desc: "Chúng ta không thể tìm thấy bất kỳ khiếm khuyết nào trong lưới điện của mình. Các máy phát điện vẫn đang sản xuất năng lượng, nhưng có thứ gì đó... đang hấp thụ nó. Đây có thể là kết quả của các hoa văn ánh sáng được chứng kiến trên bầu trời của chúng ta, bản chất hình học của chúng hé lộ một thiết kế có chủ ý.\n\nLiệu thứ này - một §YKính Vạn Hoa§! sống động - là một thực thể hiểm độc, hay chỉ là một làn sương vô tri giác? Câu trả lời vẫn chưa rõ ràng."
 situation.2005.a: "Cố gắng tách nó ra khỏi lưới điện của chúng ta."

 # Project - end (first time)
 situation.2010.name: "Khởi Động Đen" # Translators note: https://en.wikipedia.org/wiki/Black_start
 situation.2010.desc: "Nhờ nỗ lực phối hợp của các [owner.GetTechnicianPlural] và [owner.GetScientistPlural], loài ký sinh năng lượng đã bị cắt đứt khỏi lưới điện của chúng ta. Đêm dài nhất của chúng ta đã qua, nhưng §YKính Vạn Hoa§! vẫn tỏa sáng trên đầu chúng ta, khao khát năng lượng.\n\nChúng ta không có cách nào giao tiếp với nó, và vũ khí thông thường sẽ không có tác dụng với một sinh thể thuộc loại này. Các lựa chọn còn lại của chúng ta là cho nó ăn vừa đủ để giữ cho nó được xoa dịu, hoặc cố gắng bỏ đói nó. Các đặc vụ của chúng ta cũng đề xuất tổ chức một §YChiến Dịch Gián Điệp§! để dụ nó sang một đế chế khác. Hãy để kẻ khác giải quyết nó."
 situation.2010.desc.again: "Những gì người dân chúng ta nhìn thấy từ quỹ đạo là sự lặp lại của một khuôn mẫu quen thuộc: toàn bộ nguồn điện trên §H[capital_scope.GetName]§! tắt ngấm, thủ đô của chúng ta hứng chịu một đợt mất điện toàn cầu trong khi những dải ánh sáng lung linh nhảy múa trên bầu trời.\n§YKính Vạn Hoa§! đã quay trở lại! Loài ký sinh năng lượng mà chúng ta từng trút sang cho kẻ khác đã bị gửi trả lại cho chúng ta.\n\nTheo các chuyên gia của chúng ta, việc đầu tư vào một §Y$building_planetary_shield_generator$§! sẽ ngăn thủ đô của chúng ta trở thành mục tiêu một lần nữa, nhưng lúc này thì đã quá muộn: loài ký sinh năng lượng ở đây và sẽ không đi đâu cả."
 situation.2010.a: "Quái vật phi tự nhiên này không có chỗ đứng trong hệ sao của chúng ta!"
 situation.2010.b: "Chúng ta phải kết thân với sinh vật kỳ diệu này!"
 situation.2010.c: "Nó muốn năng lượng sao? Cứ để nó nghẹn ứ đi."
 situation.2010.tooltip: "Mở khóa Chiến Dịch Gián Điệp §Y$operation_kaleidoscope$§!"

 # Project - end (subsequent times)
 situation.2011.name: "$situation.2010.name$"
 situation.2011.desc: "Tuân theo các quy trình đã được kiểm chứng và thử nghiệm, chúng ta đã tách Kính Vạn Hoa ra khỏi lưới điện của §H[root.GetName]§!, khôi phục lại điện năng cho thủ đô của chúng ta."

 ## Espionage Operation
 # Operation - phase 1
 situation.2020.name: "Thâm Nhập Lưới Điện"
 situation.2020.desc: "Bằng cách cải trang thành các kỹ thuật viên, các đặc vụ của chúng ta đã thâm nhập thành công vào các khu vực năng lượng của §H[target.GetName]§!. Nhiệm vụ tiếp theo của họ là lắp đặt một đèn hiệu dẫn đường để dụ sinh thể ký sinh năng lượng tới hành tinh này."

 # Operation - phase 2
 situation.2021.name: "Bầu Trời Trong Xanh"
 situation.2021.desc: "Những luồng ánh sáng đã tan biến khỏi bầu trời của chúng ta, báo trước điều mà các đặc vụ tình báo sau đó đã xác nhận: các nhân viên của chúng ta đã kích hoạt đèn hiệu năng lượng, dụ §YKính Vạn Hoa§! rời đi!\n\nBây giờ hãy để §H[target.GetName]§! giải quyết nó."

 situation.2025.name: "Đẩy Lùi Rắc Rối"
 situation.2025.desc: "Theo các báo cáo gián điệp của chúng ta, §H[kaleidoscope_new_owner.GetName]§! hiện đang phải chịu cảnh thiếu hụt năng lượng. §YKính Vạn Hoa§! mà chúng ta trao tặng cho họ dường như là nguyên nhân chính gây ra những rắc rối kinh tế của họ."

 ## Random events
 # Negative 1 - infests another planet
 situation.2030.name: "Lây Nhiễm Nhẹ"
 situation.2030.desc: "Một Kính Vạn Hoa bị bỏ đói đã cắm sâu những chiếc răng hàm ẩn dụ của nó vào lưới điện của §H[event_target:infested_planet.GetName]§!. Đợt mất điện trên toàn thuộc địa sau đó diễn ra rất kịch tính, nhưng không khác mấy so với các đợt tấn công trước đây. Chúng ta biết cách giải quyết việc này."

 # Negative 2 - eats energy building
 situation.2031.name: "Sốc Điện"
 situation.2031.desc: "Một Kính Vạn Hoa háu đói đang cố gắng ép mình kết nối vào một trong các §YĐầu Mối Năng Lượng§! của chúng ta trên §H[target.GetName]§!. Điều này mang lại một cơ hội đáng chú ý để nghiên cứu các khả năng độc nhất của sinh thể này, nhưng chúng ta dự kiến công trình sẽ bị hư hại nghiêm trọng do hậu quả đó."
 situation.2031.a: "Cứ để nó ăn năng lượng của chúng ta. Vì Khoa Học!"
 situation.2031.b: "Đánh cắp lại một ít năng lượng."

 # Negative 3 - unnerving patterns (- pop happiness)
 situation.2032.name: "Hoa Văn Đáng Lo Ngại"
 situation.2032.desc: "Kính Vạn Hoa run rẩy lo lắng, lấp đầy bầu trời của chúng ta bằng những hoa văn ánh sáng chói tai, không đồng đều. Người dân chúng ta không khỏi cảm thấy cảnh tượng này thật đáng lo ngại."

 # Negative 4 - ominous patterns (spiritualists)
 situation.2033.name: "Hoa Văn Điềm Gở"
 situation.2033.desc: "Kính Vạn Hoa co bóp như một vết thương hở, lấp đầy bầu trời của chúng ta bằng những hoa văn điềm gở, bệnh hoạn. Các giáo sĩ của chúng ta tin rằng đó là một điềm xấu. Có lẽ điều khôn ngoan là hiến tế một ít năng lượng cho sinh vật này, để làm dịu cơn đói của nó và xoa dịu nỗi sợ hãi của người dân chúng ta."
 situation.2033.a: "Cung Cấp Năng Lượng Cho Kính Vạn Hoa."
 situation.2033.b: "Chúng ta sẽ không cúi đầu trước ý chí của nó."

 # Negative 5 - slow ships
 situation.2034.name: "Hoa Văn Ám Ảnh"
 situation.2034.desc: "Đói năng lượng, Kính Vạn Hoa đã học được cách bòn rút năng lượng từ hạm đội của chúng ta. Lượng điện năng bị rút là tối thiểu, nhưng lại có tác động rõ rệt đến tốc độ tàu của chúng ta."

 # Positive 1 - soothing patterns (unity)
 situation.2037.name: "Hoa Văn Xoa Dịu"
 situation.2037.desc: "Một Kính Vạn Hoa hạnh phúc tràn ngập bầu trời [owner.capital_scope.GetName] với những hình thù dễ chịu, những phân mảnh fractal tan chảy vào những phân mảnh fractal khác trong những làn sóng kỳ diệu biến đổi không ngừng.\n\nHành tinh ngừng lại. Chiêm ngưỡng. Thở sâu."

 # Positive 2 - dazzling patterns (science)
 situation.2038.name: "Hoa Văn Chói Lóa"
 situation.2038.desc: "Liệu các hoa văn biến đổi của Kính Vạn Hoa có thể là một hình thức giao tiếp? Hay chúng là một quá trình tự phát, tương tự như việc hít thở? Các [root.GetScientistPlural] của chúng ta vẫn chưa có câu trả lời. Kính Vạn Hoa đang cung cấp cho chúng ta một lượng dữ liệu khoa học vô giá."

 ## Endings
 # Kaleidoscope explodes! - Good ending
 situation.2041.name: "Kính Vạn Hoa Đơm Hoa"
 situation.2041.desc: "Chúng ta đã có diễm phúc trải nghiệm màn trình diễn ánh sáng lộng lẫy nhất thiên hà: những cánh hoa vạn hoa tự gập vào nhau; đơm hoa; bùng nổ! Tuy nhiên, các thiết bị của chúng ta lại kể một câu chuyện kém huy hoàng hơn.\n\nSinh thể năng lượng trở nên tràn trề năng lượng đến mức nó tự sụp đổ vào trong như một ngôi sao đang lụi tàn. Từ đống đổ nát, các tàu thăm dò của chúng ta đã thu hồi được một cụm tinh thể, có hình dáng rất giống một đóa hoa đang nở rộ. Theo các nghiên cứu sơ bộ, 'đóa hoa' này có thể phóng đại cường độ của tia sáng yếu nhất, phá vỡ một vài định luật vật lý đã biết trong quá trình này. Các [root.owner.GetScientistPlural] của chúng ta giả thuyết rằng đóa hoa chỉ là phần nhìn thấy được của một cấu trúc lớn hơn - một ngôi nhà gương đa chiều nơi các chùm ánh sáng được phản chiếu và tái kết hợp vô tận."

 # Kaleidoscope explodes! - Good ending - Notifying other countries
 situation.2042.name: "$situation.2041.name$"
 situation.2042.desc: "Các cảm biến báo cáo hoa văn vạn hoa trong hệ sao §H[kaleidoscope_system.GetName]§! vừa nở hoa, biến mất trong một đợt bùng nổ cuối cùng của các hoa văn rực rỡ sắc màu. Chắc hẳn đó là một cảnh tượng vô cùng ngoạn mục."

 # Kaleidoscope explodes! - Bad ending
 situation.2043.name: "Kính Vạn Hoa Phát Nổ"
 situation.2043.desc: "Khi Kính Vạn Hoa gập lại vào chính nó, chỉ trong một giây, nó trông giống như đóa hoa tinh thể mỏng manh nhất. Tuy nhiên, vụ nổ sau đó lại chẳng hề dịu dàng chút nào: một tiếng nổ chói lòa thiêu rụi hệ sao và làm quá tải tất cả các thiết bị điện tử của chúng ta, nướng chín lưới điện.\n\nCông tác sửa chữa đã được tiến hành, nhưng sẽ mất một khoảng thời gian để chúng ta quen với bầu trời trống trải vừa xuất hiện."

 # Kaleidoscope explodes! - Bad ending - Notifying other countries
 situation.2044.name: "$situation.2043.name$"
 situation.2044.desc: "Các cảm biến báo cáo hoa văn vạn hoa trong hệ sao §H[kaleidoscope_system.GetName]§! vừa phát nổ, giải phóng một sóng xung kích năng lượng chắc chắn đã làm hư hại mọi công trình trong hệ sao."

 # Kaleidoscope fades away - owner
 situation.2040.name: "Bầu Trời Trong Xanh"
 situation.2040.desc: "Sau một đợt bùng nổ cuối cùng của các hoa văn lượn sóng màu đỏ, Kính Vạn Hoa đã mờ dần rồi tan biến, những xúc tu đầy màu sắc của nó tản ra như sương mù.\n\nSau bao nhiêu thời gian sống dưới ánh sáng của nó, bầu trời của chúng ta trông gần như trống rỗng."

 # Kaleidoscope fades away - notifying other countries
 situation.2045.name: "Bầu Trời Trong Xanh"
 situation.2045.desc: "Các cảm biến báo cáo hoa văn vạn hoa mà chúng ta phát hiện trong hệ sao [kaleidoscope_system.GetName] đã tan biến."

 # Kaleidoscope could get a Dyson sphere?
 situation.2048.name: "Cơn Đói Bất Tận"
 situation.2048.desc: "Kính Vạn Hoa đã chứng tỏ là một người hàng xóm hòa nhã kỳ lạ, nhưng giữ cho nó no đủ lại là một thử thách khó khăn. Liệu một Quả Cầu Dyson có thể làm thỏa mãn cơn khát năng lượng vô tận của nó không?"
 situation.2048.a: "Tùy biến một Quả Cầu Dyson cho Kính Vạn Hoa."
 situation.2048.a.tooltip: "Mở khóa một cấp nâng cấp Quả Cầu Dyson mới."
 situation.2048.b: "Chúng ta không thể phung phí năng lượng."

 # DiScO EnDiNg
 situation.2049.name: "Quả Cầu Kỳ Diệu"
 situation.2049.desc: "Kính Vạn Hoa đã bám chặt vào Quả Cầu Dyson tùy biến mà chúng ta cung cấp, tiêu thụ năng lượng của một ngôi sao và xòe rộng những cánh hoa rực rỡ để bao trọn toàn bộ hệ sao. Theo dữ liệu của chúng ta, sinh thể năng lượng hiện đang ở trong trạng thái quá tải liên tục và có kiểm soát, không ngừng đâm chồi mới rồi nổ tung trong một chu kỳ bất tận tương tự như cái chết và sự tái sinh.\n\nChúng ta không biết liệu sinh thể này có khả năng tư duy hay không, nhưng chúng ta hy vọng sự tồn tại của nó lúc này cũng dễ chịu như những hoa văn ánh sáng mà nó tạo ra."


 ## Projects and Operations
 # Project (first time)
 KALEIDOSCOPE_INFESTATION_FIRST: "Mất Điện"
 KALEIDOSCOPE_INFESTATION_FIRST_DESC: "Sự cố sập lưới điện toàn cầu đã nhấn chìm thủ đô của chúng ta vào bóng tối hoàn toàn. Chúng ta phải khôi phục cơ sở hạ tầng điện năng của §H[root.GetName]§! và xác định điều gì đang diễn ra."

 # Project (following times)
 KALEIDOSCOPE_INFESTATION: "Rỉ Sắc Màu"
 KALEIDOSCOPE_INFESTATION_DESC: "Một lần nữa, Kính Vạn Hoa đã bám vào lưới điện của chúng ta, tiêu thụ năng lượng và nhấn chìm hành tinh vào bóng tối.\n\nMay mắn thay, giờ đây chúng ta đã biết cách ứng phó."

 # Espionage Operation
 operation_kaleidoscope: "Dụ Dỗ Kính Vạn Hoa"
 operation_kaleidoscope_desc: "Bằng cách gài một đèn hiệu dẫn đường trong các khu năng lượng của đế chế khác, chúng ta có thể điều động sinh thể năng lượng đến lây nhiễm một cường quốc thiên hà khác."
 operation_kaleidoscope_shielded_world: "Thế giới thủ đô của họ được bảo vệ bởi một §Y$building_planetary_shield_generator$§!."
 operation_kaleidoscope_previous_owner: "Họ sẽ không để chúng ta vượt qua hệ thống an ninh của họ một lần nữa sớm như vậy đâu."
 operation_kaleidoscope_on_success: "$IF_SUCCESSFUL|E$\nKính Vạn Hoa sẽ được chuyển sang cho [root.target.GetName], lây nhiễm thủ đô của họ."
