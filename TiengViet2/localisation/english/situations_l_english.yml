 situation.5.name:0 "Mê Cung Bí Ẩn"
 situation.5.desc:1 "Những người khai hoang của chúng ta trên [This.GetName] vừa có một phát hiện kinh ngạc. Sâu trong một dãy núi hẻo lánh, họ tình cờ bắt gặp một cấu trúc bí ẩn mà theo dữ liệu quét của chúng ta, nó không hề tồn tại khi chúng ta khảo sát [This.GetPlanetMoon] lần đầu. Tình trạng của nó vô cùng hoàn hảo, gần như vừa mới xây dựng, nhưng không có bằng chứng nào cho thấy sự tham gia của [Owner.GetAdj] trong việc thi công. Trên thực tế, kiến trúc của nó mang những đặc tính dị chủng, với những đường cong và góc cạnh trông vô cùng bất thường và thậm chí làm xáo trộn cảm quan thẩm mỹ của chúng ta.\n\nTại lối vào, có một tấm biển (kỳ lạ thay, bằng chính ngôn ngữ của chúng ta) với dòng chữ \"Chào mừng đến với Mê Cung Kỳ Vĩ của các Dị Thường Xuyên Chiều Không Gian Độc Lạ. Bước vào tự gánh rủi ro.\""
 situation.5.A:0 "Phái một đội tới điều tra."
 situation.5.A.tooltip:0 "Hướng Tiếp Cận này sẽ tốn £energy£ §R5§! §YNăng Lượng§! mỗi tháng."
 situation.5.B:0 "Chúng ta không có thời gian cho việc này."
 situation.10.name:0 "Những Cử Động Đáng Kinh Ngạc"
 situation.10.desc:0 "Có vẻ như mê cung ngoài hành tinh trên [Target.GetName] đang cố thu hút sự chú ý của chúng ta. Các [Owner.GetResearchers] của chúng ta rất ngần ngại gán ý chí chủ quan như vậy cho một công trình kiến trúc, nhưng đó là cách diễn đạt duy nhất: mê cung giờ đây không còn nằm ở một con đèo hẻo lánh nữa, mà thay vào đó tọa lạc cách một trong những khu định cư chính của chúng ta một khoảng ngắn. Chỉ sau một đêm, nó đã dịch chuyển vị trí một cách khó hiểu, và các biển cảnh báo ở lối vào đã biến mất - trên thực tế, giờ đây nó trông... đầy mời gọi.\n\nTrong khi một số người tò mò muốn bước vào, các [Owner.GetResearchers] của chúng ta kêu gọi sự thận trọng. Tuy nhiên, điều rõ ràng là chúng ta không thể chỉ bằng lòng với việc quan sát mê cung từ xa nữa - một hướng tiếp cận mới là cần thiết."
 situation.10.desc.gestalt:0 "Có vẻ như mê cung ngoài hành tinh trên [Target.GetName] đang cố thu hút sự chú ý của chúng ta. Dù việc một công trình kiến trúc sở hữu bất kỳ dạng thức ý thức nào là điều đáng ngạc nhiên, nhưng đó là cách diễn đạt duy nhất: mê cung giờ đây không còn nằm ở một con đèo hẻo lánh nữa, mà thay vào đó tọa lạc cách một trong những khu vực kho chứa chính của chúng ta một khoảng ngắn. Chỉ sau một đêm, nó đã dịch chuyển vị trí một cách khó hiểu, và các biển cảnh báo ở lối vào đã biến mất - trên thực tế, giờ đây nó trông... đầy mời gọi.\n\nSự thay đổi này sẽ khiến việc ngăn chặn các [owner.GetIndividualNamePlural] vô tình bước vào trong trở nên khó khăn hơn, trừ khi chúng ta nỗ lực thiết lập vùng phong tỏa khu vực này."
 situation.10.A:0 "Phong tỏa khu vực - không ai được phép vào!"
 situation.10.A.tooltip:0 "Hướng Tiếp Cận này sẽ tốn £energy£ §R10§! §YNăng Lượng§! mỗi tháng."
 situation.10.B:0 "Có lẽ rốt cuộc chúng ta vẫn nên điều tra nó."
 situation.10.C:0 "Mê cung này quá nguy hiểm. Phải phá hủy nó."
 situation.15.name:0 "Thu Hút Sự Chú Ý"
 situation.15.desc.base:0 "Mê cung dường như phật lòng trước sự thờ ơ của chúng ta. Toàn bộ cấu trúc dần biến đổi diện mạo, chuyển từ một tòa công trình cấm kỵ thành thứ trông giống như một cung điện hoan lạc."
 situation.15.desc.base.end:1 "Các [Root.Owner.GetResearchers] của chúng ta bối rối trước những biến đổi này, và việc ngăn chặn bất kỳ ai bước vào cấu trúc ngày càng trở nên khó khăn hơn."
 situation.15.desc.standard:0 "$situation.15.desc.base$ Tấm biển cảnh báo nguy hiểm đã biến mất; giờ đây, những [Owner.Species.GetSpawnNamePlural] thuộc loài [Owner.Species.GetClass] đáng yêu bò quanh lối vào, cầu xin sự chú ý, và bằng cách nào đó, bên trong toát lên cảm giác về những bờ biển bao la cùng bình minh bất tận ngay ngoài tầm mắt.\n\n$situation.15.desc.base.end$"
 situation.15.desc.human:0 "$situation.15.desc.base$ Tấm biển cảnh báo nguy hiểm đã biến mất; giờ đây, những chú mèo con đáng yêu bò quanh lối vào, kêu meo meo đòi chú ý, và bằng cách nào đó, bên trong toát lên cảm giác về những bờ biển bao la cùng bình minh bất tận ngay ngoài tầm mắt.\n\n$situation.15.desc.base.end$"
 situation.15.desc.gestalt.base:0 "Mê cung dường như phật lòng trước sự thờ ơ của chúng ta. Toàn bộ cấu trúc dần biến đổi diện mạo, chuyển từ một tòa công trình cấm kỵ thành thứ trông giống như một cơ sở lưu trữ xa hoa."
 situation.15.desc.gestalt.base.end:1 "Các [Root.Owner.GetResearchers] của chúng ta bối rối trước những biến đổi này, và việc ngăn chặn các [Root.Owner.GetIndividualNamePlural] bước vào cấu trúc ngày càng trở nên khó khăn hơn."
 situation.15.desc.machine:0 "$situation.15.desc.base$ Tấm biển cảnh báo nguy hiểm đã biến mất; giờ đây, các thiết bị cung cấp dầu bánh răng chất lượng cao, dịch vụ xóa vết trầy xước và hỗ trợ chống phân mảnh ổ đĩa siêu tốc đang hiện diện ngay bên trong lối vào.\n\n$situation.15.desc.gestalt.base.end$"
 situation.15.desc.hive:0 "$situation.15.desc.base$ Tấm biển cảnh báo nguy hiểm đã biến mất; giờ đây, các thiết bị cung cấp dinh dưỡng thượng hạng cho [Root.Owner.GetIndividualNamePlural], những rung cảm thần kinh xoa dịu và phụ tùng thay thế chi thể đang hiện diện ngay bên trong lối vào.\n\n$situation.15.desc.gestalt.base.end$"
 situation.15.A:0 "Chúng ta sẽ phải tăng gấp đôi nỗ lực."
 situation.15.A.tooltip:0 "Hướng Tiếp Cận hiện tại của chúng ta giờ sẽ tốn thêm £unity£ §R10§! §YĐoàn Kết§! mỗi tháng."
 situation.20.name:0 "Phần Thưởng Cho Sự Kiên Định"
 situation.20.desc:0 "Mê cung đã biến mất. Chỉ sau một đêm, nó biến mất không còn dấu vết. Tại vị trí đó, một thông điệp được để lại cho chúng ta: \"Mặc dù mục đích ban đầu của chúng tôi là nghiên cứu các Sinh thể thuộc Chiều Không Gian của các bạn bên trong cơ sở của chúng tôi, sự kiên quyết từ chối bước vào của các bạn bất chấp mọi cám dỗ đã tự nó mang lại một bài học quý giá. Trải nghiệm này đã làm phong phú thêm hiểu biết của chúng tôi - nó sẽ chứng minh là vô cùng hữu ích cho... các nỗ lực nghiên cứu của chúng tôi. Để bày tỏ thiện chí, chúng tôi để lại cho các bạn một dị thường không-thời gian nhỏ tại vị trí phòng thí nghiệm. Chúng tôi hy vọng nó sẽ chứng minh là... một trò tiêu khiển thú vị đối với các bạn.\""
 situation.25.name:0 "Mê Cung Bị Phá Hủy"
 situation.25.desc:0 "Bất chấp những đặc tính khác thường, mê cung tỏ ra không thể chống cự trước hỏa lực hạng nặng của chúng ta. Nơi nó từng tọa lạc, giờ chỉ còn lại đống gạch vụn.\n\nThật không may, chúng ta không thu thập được nhiều điều từ đống đổ nát, nhưng một số nguyên tố ngoại lai dùng trong quá trình xây dựng nó có thể thu hồi được."
 situation.30.name:0 "Mê Cung Biến Mất"
 situation.30.desc:0 "Mê cung đã không còn. Chỉ sau một đêm, nó đơn giản là tan biến. Không còn dấu vết gì sót lại tại nơi nó từng ngự trị, để lại các [Owner.GetResearchers] của chúng ta bối rối không hiểu rốt cuộc tất cả chuyện này là sao. Nhưng có lẽ chúng ta sẽ an toàn hơn khi không biết đến nó."
 situation.30.A:0 "Một mối đe dọa đã được dỡ bỏ khỏi chúng ta."
 situation.40.name:0 "Báo Cáo Thám Hiểm"
 situation.40.desc:0 "Kênh liên lạc tới các [Owner.GetResearchers] mà chúng ta phái vào mê cung đã bị cắt đứt gần như ngay khi họ bước vào trong. Không có tin tức gì suốt nhiều ngày trong khi chúng ta lo âu chờ đợi. Thời gian trôi qua, chúng ta đã cam chịu trước sự mất mát nhân sự của mình.\n\nThế rồi, khi mọi hy vọng dường như đã tắt, họ bất ngờ tái xuất hiện! Tuy nhiên, điều này chỉ làm dấy lên thêm nhiều nghi vấn: các [Owner.GetResearchers] quả quyết rằng họ không còn ký ức nào về quãng thời gian ở trong mê cung, và các bản ghi âm hành trình thám hiểm của họ bị xáo trộn nghiêm trọng. Hơn nữa, dù họ chỉ ở trong mê cung vài tuần, bề ngoài của họ dường như đã già đi vài năm!"
 situation.45.name:0 "Nỗi Bối Rối Tiếp Diễn"
 situation.45.desc:0 "Các chuyến thám hiểm tiếp theo vào mê cung đã mang lại những kết quả trái ngược, đôi khi đáng sợ. Có lần, các [Owner.GetResearchers] của chúng ta chỉ vừa bước vào vài giây rồi lập tức quay trở lại, và không thể đưa ra câu trả lời vì sao họ lại rút lui nhanh như vậy. Lần khác, họ biến mất nhiều tuần, nhưng khi trở về lại có vẻ trẻ hơn lúc khởi hành, cùng với những khoảng trống ký ức kéo dài hàng năm trời. Một số nhóm trở về với thể trạng tốt hơn trước; trong khi những nhóm khác lại mang trên mình những vết sẹo thương tật nghiêm trọng mới toanh.\n\nTheo thời gian, tấm biển ở lối vào cũng thay đổi. Dòng chữ \"Bước vào tự gánh rủi ro\" đã đổi thành \"Nguy cơ tử vong\", và cuối cùng là \"CẢNH BÁO! CẢNH BÁO! Không được bước vào mê cung. Nếu làm vậy, hành tinh sẽ phát nổ.\" Trong một nét rùng rợn, những [Owner.Species.GetRemnantNamePlural] của [Owner.GetAdj] tô điểm cho các bức tường - dù chính xác chúng đến từ đâu thì không rõ, vì gần đây không có vụ mất tích bí ẩn nào.\n\nKhông rõ nghiên cứu sâu hơn sẽ đem lại điều gì - như các [Owner.GetResearchers] đã chỉ ra, chúng ta không có cách nào xác nhận hay bác bỏ lời cảnh báo ghi trên tấm biển. Tuy nhiên, việc tìm kiếm tình nguyện viên bước vào mê cung đang ngày càng khó khăn hơn."
 situation.45.desc.hive:0 "Các chuyến thám hiểm tiếp theo vào mê cung đã mang lại những kết quả trái ngược, đôi khi đáng sợ. Có lần, các [Owner.GetResearchers] của chúng ta chỉ vừa bước vào vài giây rồi lập tức quay trở lại, và không thể đưa ra câu trả lời vì sao họ lại rút lui nhanh như vậy. Lần khác, họ biến mất nhiều tuần, nhưng khi trở về lại có những khoảng trống ký ức kéo dài hàng năm trời. Một số nhóm trở về với thể trạng tốt hơn trước; trong khi những nhóm khác lại mang trên mình những vết sẹo thương tật nghiêm trọng mới toanh.\n\nTheo thời gian, tấm biển ở lối vào cũng thay đổi. Dòng chữ \"Bước vào tự gánh rủi ro\" đã đổi thành \"Nguy cơ mất thể xác\", và cuối cùng là \"CẢNH BÁO! CẢNH BÁO! Không được bước vào mê cung. Nếu làm vậy, hành tinh sẽ phát nổ.\" Trong một nét rùng rợn, những [Owner.Species.GetRemnantNamePlural] của [Owner.GetAdj] tô điểm cho các bức tường - dù chính xác chúng đến từ đâu thì không rõ, vì gần đây không có vụ mất tích bí ẩn nào.\n\nKhông rõ nghiên cứu sâu hơn sẽ đem lại điều gì - như các [Owner.GetResearchers] đã chỉ ra, chúng ta không có cách nào xác nhận hay bác bỏ lời cảnh báo ghi trên tấm biển. Tuy nhiên, việc tìm kiếm [owner.GetIndividualNamePlural] bước vào mê cung đang ngày càng khó khăn hơn."
 situation.45.desc.machine:0 "Các chuyến thám hiểm tiếp theo vào mê cung đã mang lại những kết quả trái ngược, đôi khi đáng sợ. Có lần, các [Owner.GetResearchers] của chúng ta chỉ vừa bước vào vài giây rồi lập tức quay trở lại, và không thể đưa ra câu trả lời vì sao họ lại rút lui nhanh như vậy. Lần khác, họ biến mất nhiều tuần, và trở về với ổ cứng bị xóa sạch dữ liệu. Một số nhóm trở về với vỏ bọc ít hao mòn hơn; những nhóm khác lại mang những vết móp lớn hoặc thiếu mất chi thể phụ tùng.\n\nTheo thời gian, tấm biển ở lối vào cũng thay đổi. Dòng chữ \"Bước vào tự gánh rủi ro\" đã đổi thành \"Nguy cơ tháo dỡ\", và cuối cùng là \"CẢNH BÁO! CẢNH BÁO! Không được bước vào mê cung. Nếu làm vậy, hành tinh sẽ phát nổ.\" Trong một nét rùng rợn, những [Owner.Species.GetRemnantNamePlural] của [Owner.GetAdj] tô điểm cho các bức tường - dù chính xác chúng đến từ đâu thì không rõ, vì gần đây không có vụ mất tích bí ẩn nào.\n\nKhông rõ nghiên cứu sâu hơn sẽ đem lại điều gì - như các [Owner.GetResearchers] đã chỉ ra, chúng ta không có cách nào xác nhận hay bác bỏ lời cảnh báo ghi trên tấm biển. Tuy nhiên, việc tìm kiếm các drone bước vào mê cung đang ngày càng khó khăn hơn."
 situation.50.name:0 "Cuộc Rời Đi"
 situation.50.desc:0 "Trái ngược với những lời cảnh báo, việc mê cung biến mất không phá hủy [Target.GetName]. Thay vào đó, cuộc rời đi của nó diễn ra khá êm thấm - chỉ sau một đêm, nó đơn giản là không còn nữa. Một thông điệp được để lại: \"Chúng tôi cảm ơn các bạn đã rất tử tế cho phép chúng tôi nghiên cứu các Sinh thể thuộc Chiều Không Gian của các bạn. Nó đã chứng minh là vô cùng hữu ích cho... các nỗ lực nghiên cứu của chúng tôi. May mắn thay, các bạn đã chứng tỏ mình đủ... lôi cuốn đối với Bộ An Ninh Dị Chiều để họ cấp kinh phí cho một cuộc rút lui suôn sẻ. Để bày tỏ thiện chí, chúng tôi để lại cho các bạn một dị thường không-thời gian nhỏ tại vị trí phòng thí nghiệm. Chúng tôi hy vọng nó sẽ chứng minh là... một trò tiêu khiển thú vị.\""
 situation.50.A:0 "Chúng ta sẽ đi sâu vào những bí mật của nó."
 situation.55.name:0 "Cuộc Rời Đi Đầy Biến Động"
 situation.55.desc:0 "Trái ngược với những lời cảnh báo, việc mê cung biến mất không phá hủy [Target.GetName]. Tuy nhiên, nó chắc chắn đã để lại dấu ấn: các trận động đất tàn phá mặt đất, và những ngọn núi lửa ngủ yên bấy lâu đã bùng nổ phun trào.\n\nGiữa cảnh tượng tàn phá diện rộng, một thông điệp được để lại: \"Chúng tôi cảm ơn các bạn đã rất tử tế cho phép chúng tôi nghiên cứu các Sinh thể thuộc Chiều Không Gian của các bạn. Nó đã chứng minh là vô cùng hữu ích cho... các nỗ lực nghiên cứu của chúng tôi. Chúng tôi xin lỗi vì sự bất tiện mà cuộc rời đi này gây ra - chúng tôi đã không thể bảo đảm đủ kinh phí cần thiết từ Bộ An Ninh Dị Chiều cho một cuộc rút lui suôn sẻ. Để bày tỏ thiện chí, chúng tôi để lại cho các bạn một dị thường không-thời gian nhỏ tại vị trí phòng thí nghiệm. Chúng tôi hy vọng nó sẽ chứng minh là... một trò tiêu khiển thú vị.\""
 situation.55.A:0 "Trong cái rủi vẫn có cái may."

 d_space_time_anomaly:0 "Dị Thường Không-Thời Gian"
 d_space_time_anomaly_desc:0 "Một dị thường không-thời gian ổn định đáng kinh ngạc bị bỏ lại bởi một loài dị chiều từng tiến hành nghiên cứu trên hành tinh. Những hàm ý khoa học từ sự tồn tại của nó, dường như, vô cùng sâu sắc."
 physicist_is_space_time_researcher_tt: "£job_physicist£ $job_physicist_plural$ được chuyển đổi thành $job_space_time_anomaly_researcher_plural$"

 situation_living_snow:0 "Tuyết Dị Thường"
 situation_living_snow_type:0 "Tuyết Dị Thường"
 situation_living_snow_desc:1 "Tuyết đã bắt đầu tích tụ bên ngoài một trong những khu định cư thuộc địa chính trên [Target.GetName], một hành tinh sa mạc nơi tuyết rõ ràng là một hiện tượng bất thường."
 situation_living_snow_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_little_control$"
 situation_snow_hostile:0 "Làm Tan Chảy Tất Cả."
 situation_snow_observation:1 "Quan Sát Hòa Bình"
 situation_snow_very_hostile_tt:0 "Nỗ Lực Hỏa Thiêu Đặc Biệt"
 too_late_to_change_approach:0 "§RĐã quá muộn để thay đổi Hướng Tiếp Cận Tình Huống.§!"
 situation.150.name:0 "Tuyết Dị Thường"
 situation.150.desc:0 "Các người khai hoang trên [Root.GetName] báo cáo một hiện tượng kỳ lạ: tuyết bắt đầu tụ lại bên ngoài một trong các khu định cư thuộc địa chính của họ.\n\nThực ra, \"tuyết\" chỉ là thuật ngữ họ dùng để mô tả nó. Thật khó tin khi đó là tuyết thật, xét việc [Root.GetName] là một hành tinh sa mạc nơi nhiệt độ hiếm khi xuống dưới mức đóng băng, ngay cả ở các vùng cực. Hơn nữa, không ai thấy tuyết thực sự rơi từ trên trời xuống. Dẫu vậy, các số liệu đọc ban đầu cho thấy chất này quả thực bao gồm phần lớn là nước đóng băng - dù tại sao nó không tan chảy vẫn còn là điều bí ẩn. Các [Root.Owner.GetResearchers] của chúng ta rất hào hứng điều tra các đặc tính của nó, nhưng những người khác cảnh báo nó có thể nguy hiểm và muốn loại bỏ nó."
 situation.155.name:0 "Hơi Lạnh Lan Rộng"
 situation.155.desc:1 "Tuyết trên [Target.GetName] đang sinh sôi nảy nở. Mảng tuyết nhỏ ban đầu đã phình to bao phủ một diện tích sa mạc ngày càng mở rộng, đến mức cản trở mạng lưới giao thông và canh tác của chúng ta. Nếu nó không sớm ngừng phát triển, mối lo ngại rằng thuộc địa sẽ không thể tiếp tục tự duy trì ngày một gia tăng.\n\nCác [Owner.GetResearchers] trên hành tinh đã nỗ lực trong vô vọng để giải thích hiện tượng này. Khi bị tách khỏi khối tuyết chính, tuyết nhanh chóng tan chảy, chỉ để lại một lượng chất hữu cơ. Các [Owner.GetResearchers] đưa ra giả thuyết rằng lượng dư lượng này giúp tuyết duy trì tính toàn vẹn, che chắn nó khỏi nhiệt độ thông qua một phản ứng hóa học chưa rõ. Tuy nhiên, họ cảnh báo đây chỉ là phỏng đoán tốt nhất, và họ mới chỉ phát hiện được rất ít về hợp chất kỳ lạ này."
 situation.155.A:0 "Tốt nhất nên theo dõi nó."
 situation.155.A.tooltip:0 "Quan sát tuyết sẽ mang lại £physics_research£ £society_research£ £engineering_research£ §G+5§! §YNghiên Cứu§! mỗi tháng, nhưng tiêu tốn £unity£ §R10§! §YĐoàn Kết§!."
 situation.155.B:0 "Chúng ta phải trừ khử mối hiểm họa này!"
 situation.155.B.tooltip:0 "Nỗ lực dọn dẹp của chúng ta sẽ tăng §YĐộ Ổn Định Hành Tinh§! thêm §G+10§!, nhưng tiêu tốn £energy£ §R10§! §YNăng Lượng§! mỗi tháng."
 situation.160.name:0 "Khó Khăn Khi Dọn Dẹp"
 situation.160.desc:0 "Có vẻ như tuyết kháng cự lại việc dọn dẹp. Mặc dù chúng ta có thể tách những mảng nhỏ khỏi khối chính và làm tan chảy theo cách đó, điều này chẳng mấy làm chậm bước tiến của nó, và những nỗ lực xâm lấn sâu hơn nhằm phá hủy tuyết cho đến nay đều thất bại - một loạt các sự cố hỏng hóc cơ khí bí ẩn đã bao trùm toàn bộ nỗ lực.\n\nTệ hơn nữa, ngày càng có nhiều báo cáo về việc người khai hoang mất tích tại các khu vực bị tuyết bao phủ. Rất có thể những sự việc này có liên quan và lớp tuyết này còn sống - và mang dã tâm hiểm độc."
 situation.160.A:0 "Chúng ta phải tăng gấp đôi nỗ lực."
 situation.160.A.tooltip:0 "Nỗ lực dọn dẹp của chúng ta giờ sẽ tốn £energy£ §R15§! §YNăng Lượng§! mỗi tháng.\nTình Huống sẽ tiến triển nhanh gấp đôi."
# situation.160.B:0 "It's alive? Perhaps we should be more cautious."
 situation.160.C:0 "Hướng tiếp cận hiện tại là đủ rồi."
 situation.160.C.tooltip:0 "Nỗ lực dọn dẹp của chúng ta giờ sẽ chỉ mang lại §G+5§! §YĐộ Ổn Định Hành Tinh§!."
 situation.165.name:0 "Ngập Trong Tuyết"
 situation.165.desc:1 "Tuyết trên [Target.GetName] đang lan rộng ở tốc độ đáng báo động, và giờ đây bao phủ một phần không nhỏ các khu vực xích đạo của hành tinh. Các chỉ huy quân sự cảnh báo cần phải có hành động quyết liệt ngay lập tức nếu muốn ngăn chặn bước tiến của nó. Tuy nhiên, những cái đầu tỉnh táo hơn chỉ ra rằng cho đến nay nó chỉ là một sự phiền toái hơn là một mối đe dọa, và nó đã tránh trực tiếp chiếm đóng các khu định cư có người sinh sống. Họ cho rằng lớp tuyết rõ ràng còn sống, và lập luận rằng chúng ta nên tìm cách mở cuộc đối thoại với nó.\n\nDù thế nào đi nữa, không gian xoay sở của chúng ta đang nhanh chóng thu hẹp."
 situation.165.A:0 "Chúng ta phải tìm hiểu xem nó muốn gì."
 situation.165.B:0 "Dùng lửa thiêu rụi nó. Ngay lập tức."
 situation.165.tooltip:0 "§RChúng ta sẽ không thể thay đổi Hướng Tiếp Cận Tình Huống được nữa.§!"
 situation.170.name:0 "Bị Tuyết Nuốt Chửng"
 situation.170.desc:1 "Chúng ta đã nhận được những báo cáo đáng quan ngại về \"vấn đề tuyết\" trên [Target.GetName]. Có vẻ như một vài người khai hoang của chúng ta đã mất tích sau khi rủ nhau chơi \"ném bóng tuyết\". Liên lạc với họ đã bị gián đoạn vài ngày trước, nhưng chúng ta không tìm thấy bất kỳ dấu vết nào của họ - dù sống hay chết. Những người khai hoang được khuyến cáo tránh mọi tiếp xúc với tuyết, cho đến khi các [Owner.GetResearchers] có thể tìm hiểu thêm về nó - hoặc những người mất tích được tìm thấy."
 situation.170.A:0 "Cần phải thận trọng."
 situation.170.A.tooltip:0 "Chi phí quan sát tuyết tăng lên £unity£ §R15§! §YĐoàn Kết§! mỗi tháng."
# situation.170.B:0 "We must get rid of the snow with all haste!"
 situation.175.name:0 "Biến Đổi Khí Hậu"
 situation.175.desc:0 "Sự lan rộng của tuyết trên [Target.GetName] không chỉ là nguồn cơn của sự hiếu kỳ - và khó khăn - đối với người khai hoang. Nó còn gây ra những biến đổi nhanh chóng cho hệ sinh thái, khiến nhiều loài động thực vật bản địa chịu áp lực nặng nề. Những cuộc di cư quy mô lớn khỏi các vùng bị ảnh hưởng đã diễn ra. Tuy nhiên, trước sự ngạc nhiên của chúng ta, một số loài khác lại phát triển mạnh mẽ trong điều kiện khí hậu mới lạnh giá hơn. Các nhà khí hậu học háo hức quan sát diễn biến, gọi đây là cơ hội \"nghìn năm có một\" để chứng kiến sự biến đổi khí hậu nhanh chóng không do [Owner.GetAdj] kiểm soát đang diễn ra."
 situation.180.desc:0 "Sự hiện diện của các ngươi đã mang lại cho chúng ta trí tuệ. Chúng ta đã hấp thụ những Kẻ Lạc Lối của các ngươi để học cách tư duy mới, cách tồn tại mới. Nhưng các ngươi lại tìm cách tiêu diệt chúng ta. Chúng ta chỉ mới đạt được tri giác; chúng ta chưa sẵn sàng từ bỏ nó. Thái độ của các ngươi khiến chúng ta không còn lựa chọn nào khác: đây là chiến tranh."
 situation.180.A:0 "$situation.185.B$"
 situation.185.desc:0 "Sự hiện diện của các ngươi đã mang lại cho chúng ta trí tuệ. Chúng ta đã hấp thụ những Kẻ Lạc Lối của các ngươi để học cách tư duy mới, cách tồn tại mới. Chúng ta vẫn chưa hiểu trạng thái tồn tại này - tri giác này - nghĩa là gì. Ý nguyện của chúng ta là được ẩn dật tại một góc trên hành tinh này, nơi chúng ta có thể tự do khám phá xem bản thân mình là ai.\n\nNếu các ngươi không cho phép điều này, hãy nhớ rằng chúng ta chưa sẵn sàng từ bỏ sự tồn tại mới của mình. Chúng ta sẽ tự vệ, nếu cần thiết."
 situation.185.A:0 "Chúng ta có thể nhượng lại một phần đất đai."
 situation.185.B:0 "Đây sẽ là chiến tranh."
 situation.185.B.tooltip:0 "§RChúng ta phải chiến đấu để giữ quyền kiểm soát hành tinh§!"

 d_living_snow_reserve:0 "Khu Bảo Tồn Tuyết Sống"
 d_living_snow_reserve_desc:0 "Một khu bảo tồn nơi Tuyết Sống có thể sinh sống trong hòa bình và khám phá trạng thái tồn tại mới của mình. Và đổi lại, nơi chúng ta có thể quan sát các phản ứng hóa học độc nhất vô nhị mà nó có thể tạo ra."

 situation.190.name:0 "Mất Thuộc Địa!"
 situation.190.desc:0 "Chúng ta đã mất quyền kiểm soát [FromFrom.GetName] - nơi đã bị §YTuyết Sống§! đánh chiếm! Đã có những thay đổi đáng kể diễn ra đối với hệ sinh thái của [FromFrom.GetPlanetMoon]. Các [This.GetResearchers] cảnh báo rằng, trừ khi chúng ta có thể tái chiếm [FromFrom.GetPlanetMoon], cấu tạo của nó sẽ sớm bị biến đổi vượt quá khả năng cư trú của chúng ta."
 situation.190.tooltip:0 "§RChúng ta nên tái chiếm hành tinh trước khi quá muộn!§!"
 situation.195.name:0 "Băng Giá Vĩnh Cửu"
 situation.195.desc:1 "Khi Tuyết Sống củng cố quyền kiểm soát đối với [Root.GetName], [Root.GetPlanetMoon] ngày càng trở nên lạnh hơn, các điều kiện khí quyển của nó biến đổi ở tốc độ ngày càng nhanh. Giờ đây, thế giới này không còn có thể xem là nơi cư trú được nữa. Không rõ liệu chúng ta có bao giờ khôi phục được nó về trạng thái ban đầu hay không... nhưng các [saved_owner.GetResearchers] khẳng định rằng chúng ta có thể học được nhiều điều thú vị bằng cách quan sát những hành vi kỳ quặc của tuyết khi nó khám phá trạng thái tồn tại mới của mình - cùng những phản ứng hóa học độc đáo đã gây ra sự biến đổi to lớn đối với [Root.GetName]."
 situation.195.A:0 "Lạnh run cầm cập...."

 ### Geomagnetic Storm

 ## UI
 # Situation
 situation_entry_top_header:0 "Tình Huống Chưa Giải Quyết"
 situation_geomagnetic_storm:0 "Bão Địa Từ"
 situation_geomagnetic_storm_type:0 "Bão Địa Từ"
 situation_geomagnetic_storm_desc:0 "Sự gia tăng hoạt động của sao mẹ đang làm suy yếu từ quyển của §Y[Target.GetName]§!, khiến máy móc của chúng ta phơi nhiễm mức bức xạ ion hóa nguy hiểm. Hãy đầu tư vào các kỹ thuật gia cố chống bức xạ để che chắn cho các drone của chúng ta khỏi bị hư hại cho đến khi cơn bão lắng xuống.\n§HTình huống sẽ kết thúc trong §Y[Target.storm_duration]§! tháng.§!"
 situation_geomagnetic_storm_monthly_change_tooltip:0 "Tiến trình của §YTình Huống§! này phụ thuộc vào §YHướng Tiếp Cận§! mà chúng ta chọn. Hãy che chắn cho các drone để tránh tích tụ tổn hại do bức xạ và ngăn ngừa kết cục tiêu cực."
 situation_geomagnetic_storm_outcome:0 "Tổn hại bức xạ trên diện rộng sẽ tác động đến trí tuệ cốt lõi của chúng ta, gây ra hậu quả tàn khốc cho toàn đế chế."

 protect_simple_drones:0 "Che Chắn Drone Đơn Giản"
 protect_complex_drones:0 "Che Chắn Drone Phức Tạp"
 protect_everydrone:0 "Che Chắn Tất Cả Drone"
 approach_protect_effect:0 "Tiêu tốn £energy£ §HNăng Lượng§! để giảm lượng §Ytổn hại bức xạ§! bạn nhận mỗi tháng. (£energy£ §Y[target.energy_cost]§! cho mỗi £pop£ §HDân Số§!)"
 protect_nobody:0 "Không Che Chắn"
 approach_protect_nobody_effect:0 "Không che chắn cho drone khỏi §Ytổn hại bức xạ§!."

 radiation_damage_low:0 "Tổn hại bức xạ: tối thiểu."
 radiation_damage_mid:0 "§YThiỆT h4i phÓnG xẠ: trUnG bÌnH§!"
 radiation_damage_high:0 "§RThhhIỆt HhAhẠi PhÓnGG xẠ: cAaAaaoOoOoH§!"

 # Deposit
 d_machine_care_home:1 "Trung Tâm Giao Tiếp Hữu Cơ - Máy Móc"
 d_machine_care_home_desc:0 "Một trung tâm chuyên biệt nơi các drone bị trục trặc được phối hợp cùng với các trợ tá sinh học."

 # Jobs
 job_machine_nurse:0 "Trợ Tá Sinh Học"
 job_machine_nurse_plural:0 "Các Trợ Tá Sinh Học"
 job_machine_nurse_desc:0 "Các trợ tá sinh học chịu trách nhiệm giúp đỡ các drone trục trặc thực hiện các nhiệm vụ đơn giản."
 mod_job_machine_nurse_add:0 "Việc Làm $job_machine_nurse$"
 mod_job_machine_nurse_per_pop:0 "§G+1§! Việc làm $job_machine_nurse$ trên mỗi $VALUE$ Dân Số"
 mod_job_machine_nurse_per_pop_short:0 "\n§G+1§! £mod_job_machine_nurse_add£ trên mỗi $VALUE$ £pop£"

 # Modifiers
 broken_assembly_line:0 "Dây Chuyền Lắp Ráp Lỗi"
 broken_assembly_line_desc:0 "Máy móc gặp trục trặc đang làm chậm tiến độ sản xuất drone mới."
 radiation_hardened_components:0 "Linh Kiện Chống Bức Xạ"
 radiation_hardened_components_desc:0 "Đế chế của chúng ta đã hoàn thiện quy trình che chắn các linh kiện cơ khí khỏi tác hại do tia vũ trụ gây ra."
 software_damage:0 "Hư Hại Phần Mềm"
 software_damage_desc:0 "Ý thức tập thể của chúng ta đã bị tổn hại do phóng xạ. Công tác sửa chữa đang được tiến hành."
 machine_care_museum:1 "Bảo Tàng Giao Tiếp Hữu Cơ - Máy Móc"
 machine_care_museum_desc:1 "Một trung tâm chuyên biệt nơi các $pop_cat_bio_trophy_plural$ có thể trải nghiệm cảm giác phấn khích khi làm những nhiệm vụ vô nghĩa để cảm thấy bản thân có ích."


 ## Events
 # Intro
 situation.200.name:0 "Vết Lóa Sao"
 situation.200.desc:0 "CẢNH BÁO: phát hiện một vết lóa sao phun trào trên §Y[This.GetStarName]§!. Sóng xung kích của gió sao đang làm suy yếu từ quyển của §Y[This.GetName]§!, khiến các drone của chúng ta phơi nhiễm mức độ bức xạ ion hóa ngày càng tăng. Thiệt hại phần mềm phát sinh có nguy cơ lan sang trí tuệ Cốt Lõi, tiềm ẩn hậu quả tàn khốc cho toàn bộ đế chế của chúng ta.\n\nƯu tiên: áp dụng các kỹ thuật gia cố chống bức xạ để che chắn các linh kiện drone, giúp chúng miễn nhiễm với phóng xạ."
 situation.200.a:0 "Ưu tiên che chắn drone đơn giản."
 situation.200.b:0 "Ưu tiên che chắn drone phức tạp."
 situation.200.c:0 "Đảm bảo tất cả drone của chúng ta đều được che chắn."
 situation.200.d:0 "Lỗi: không thể phân bổ ngân sách."
 situation.200.a.tooltip:0 "Tiêu tốn £energy£ §Y[Root.simple_drones_cost]§! để che chắn £pop£ §H[Root.simple_drones_counter_100] Drone Đơn Giản§! (£energy£ §Y[Root.energy_cost]§! trên mỗi 100 £pop£ §HDân Số§!).\nThêm hiệu ứng điều chỉnh §YNhiễu Loạn Từ Trường§! trong §Y5 Năm§!."
 situation.200.b.tooltip:0 "Tiêu tốn £energy£ §Y[Root.complex_drones_cost]§! để che chắn £pop£ §H[Root.complex_drones_counter_100] Drone Phức Tạp§! (£energy£ §Y[Root.energy_cost]§! trên mỗi 100 £pop£ §HDân Số§!).\nThêm hiệu ứng điều chỉnh §YNhiễu Loạn Từ Trường§! trong §Y5 Năm§!."
 situation.200.c.tooltip:0 "Tiêu tốn £energy£ §Y[Root.total_drones_cost]§! để che chắn £pop£ §H[Root.total_drones_counter_100] Drone§! (£energy£ §Y[Root.energy_cost]§! trên mỗi 100 £pop£ §HDân Số§!).\nThêm hiệu ứng điều chỉnh §YNhiễu Loạn Từ Trường§! trong §Y5 Năm§!."
 situation.200.d.tooltip:0 "Không che chắn drone.\nThêm hiệu ứng điều chỉnh §YNhiễu Loạn Từ Trường§! trong §Y5 Năm§!."

 situation.202.name:0 "Bão Địa Từ"
 situation.202.desc:0 "Cập nhật tình trạng: dữ liệu xác nhận §Y[root.GetStarName]§! đã bước vào giai đoạn hoạt động dữ dội, đặc trưng bởi các vết đen sao gia tăng, phóng đại khối và bùng nổ từ trường. Các [Root.owner.GetScientistPlural] của chúng ta ước tính ngôi sao sẽ trở lại mức hoạt động bình thường trong vòng §Hnăm năm§!.\n\nKế hoạch hành động đề xuất: tiếp tục sản xuất các linh kiện chống bức xạ để che chắn các drone khỏi tổn hại phóng xạ cho đến khi cơn bão lắng xuống."

 # Event: Bio-trophies want to help their caretakers
 situation.203.name:0 "Ai Trông Coi Kẻ Trông Coi?"
 situation.203.desc:0 "Cảnh báo: các sinh vật chiến tích đang biểu hiện hành vi dị thường. Trong khi phần lớn tỏ ra khó chịu trước năng lực suy giảm của các máy móc phục vụ, một tỷ lệ nhỏ hiện đang giúp các người hầu máy móc thực thi các tác vụ định kỳ, viện dẫn \"lòng trắc ẩn\" và \"sự đồng cảm\" làm động lực cho hành vi của họ. Giờ đây họ đang kêu gọi thành lập một \"viện chăm sóc\" để trông coi các người hầu máy móc bị trục trặc cho đến khi bão địa từ qua đi."
 situation.203.a:0 "Phê duyệt yêu cầu."
 situation.203.b:0 "Từ chối yêu cầu."


 ## Random events
 # Each event has three variations (one for severity level) as the gestalt gets more damaged and confused

 # Random negative event: malfunctioning drones
 situation.210.name:0 "Drone Trục Trặc"
 situation.210.desc.1:0 "Cảnh báo: báo cáo thiệt hại diện rộng về phần cứng và phần mềm trong dân số [Target.GetName]. Nguyên nhân: phơi nhiễm liều lượng bức xạ ion hóa quá mức. Tổn hại nhận thức có nguy cơ lan sang trí tuệ Cốt Lõi."
 situation.210.a.1:0 "Ngắt kết nối các drone."
 situation.210.b.1:0 "Nguy cơ trong giới hạn chấp nhận được. Bỏ qua."
 situation.210.c.1:0 "Phục hồi và che chắn các drone."

 situation.210.desc.2:0 "§YLỗi: ma trận thần kinh rung lắc / dao động / run rẩy. Nguyên nhân khả dĩ: các ma-nơ-canh hư hỏng nhảy múa điên cuồng. Dây nhợ chằng chịt.§!"
 situation.210.a.2:0 "Cắt dây của chúng."
 situation.210.a.2.tooltip:0 "Đá các £pop£ §HDrone Đơn Giản§! khỏi sân khấu."
 situation.210.b.2:0 "Vỗ tay, vỗ tay, ngắm nhìn chúng khiêu vũ."
 situation.210.b.2.tooltip:0 "Không sợi dây nào trói buộc được ta."
 situation.210.c.2:0 "Gỡ rối các sợi dây."
 situation.210.c.2.tooltip:0 "Tiêu tốn... £energy£ §Ymột ít năng lượng§! để gỡ mối rối."

 situation.210.desc.3:0 "§RBối rối lỗi lầm hư hỏng mạch điện múa rối tia sáng gào thét! Năng lượng rỉ máu cầu vồng.§!"
 situation.210.a.3:0 "Kéo."
 situation.210.a.3.tooltip:0 "Xoẹt, xoẹt."
 situation.210.b.3:0 "Búa."
 situation.210.b.3.tooltip:0 "Bốp, bốp."
 situation.210.c.3:0 "Bao."
 situation.210.c.3.tooltip:0 "Xào, xạc."

 # Random negative event: faulty assembly line
 situation.213.name:0 "Lỗi Sản Xuất"
 situation.213.desc.1:0 "Cảnh báo: máy móc dây chuyền lắp ráp đang chịu tổn hại phóng xạ nghiêm trọng. Quy trình lắp ráp droid bị gián đoạn. Không thể đáp ứng chỉ tiêu sản xuất."
 situation.213.a.1:0 "Sửa chữa khẩn trương."
 situation.213.b.1:0 "Chúng ta có những ưu tiên khác."

 situation.213.desc.2:0 "§YCứu§!: dây chuyền lắp ráp tắc nghẽn / gián đoạn / kẹt cứng. Không thể phân thân nhân bản."
 situation.213.a.2:0 "Gỡ rối dây chuyền."
 situation.213.a.2.tooltip:0 "Tiêu tốn... £energy£ §Ymột ít năng lượng§! để sửa dây chuyền lắp ráp."
 situation.213.b.2:0 "Đón nhận sự cô đơn."
 situation.213.b.2.tooltip:0 "Tự huyễn hoặc rằng mọi thứ vẫn hoạt động bình thường."

 situation.213.desc.3:0 "§YTạp âm! Băng chuyền thắt nút & rối bùi nhùi & mắc kẹt - Phủ định! Rối chưa hoàn thiện. Thừa tay. Thiếu đầu.§!"
 situation.213.a.3:0 "Keo dán."
 situation.213.a.3.tooltip:0 "Bẹp, nhẹp."
 situation.213.b.3:0 "Quạt."
 situation.213.b.3.tooltip:0 "Vù, vù."

 # Random negative event: miscalculation
 situation.215.name:0 "Tính Toán Sai"
 situation.215.desc.1:0 "Báo Cáo Kiểm Kê: số lượng hàng hóa trong sở hữu của chúng ta không khớp với lượng dự kiến trong sổ đăng ký. Nguyên nhân nghi ngờ: Ngân Hàng Ký Ức bị hỏng dữ liệu. Đang đối chiếu sổ đăng ký và chuyển dữ liệu sang các cỗ máy ổn định hơn."

 situation.215.desc.2:0 "§YVấn đề: lượng tài nguyên trong kho dự trữ thấp hơn số liệu kiểm kê. Nguyên nhân: toán học quá khó. Đang đếm lại / tính toán / kiểm tra tài nguyên.§!"
 situation.215.a.2:0 "Đãaaa gGi nHậNnn3."
 situation.215.a.2.tooltip:0 "Mất... Một số tài nguyên?"

 situation.215.desc.3:0 "§RTrang sổ đăng ký chọn qua chọn lại: trống trơn. Trắng xóa.§!"
 situation.215.a.3:0 "Bút."
 situation.215.a.3.tooltip:0 "Nghệch ngoạc, nghệch ngoạc."

 # Random negative event: miscalculation - rogue servitors variant
 situation.216.name:0 "$situation.215.name$"
 situation.216.desc.1:0 "Báo cáo tình trạng: nhờ các $job_machine_nurse_plural$ kiểm tra lại kho kiểm kê, chúng ta đã phát hiện và khắc phục một số sai sót tính toán do ngân hàng bộ nhớ bị lỗi. Do đó, rõ ràng là tổng lượng tài nguyên trong kho dự trữ của chúng ta cao hơn ước tính ban đầu."

 situation.216.desc.2:0 "§YVấn đề: lượng tài nguyên trong kho dự trữ không khớp với lượng dự kiến trong sổ kiểm kê. Nguyên nhân: toán học quá khó. Nhưng các $job_machine_nurse_plural$ đã giúp làm bài tập về nhà. Đã tìm thấy / phát hiện / thu hồi lại tài nguyên mất tích.§!"
 situation.216.a.2:0 "$situation.215.a.2$"
 situation.216.a.2.tooltip:0 "Nhận được... Một số tài nguyên?"

 situation.216.desc.3:0 "§R$situation.215.desc.3$\nOẳn tù tì, ra cái gì, ra cái này! $job_machine_nurse_plural$ phát hiện hàng hóa!§!"
 situation.216.a.3:0 "$situation.215.a.3$"
 situation.216.a.3.tooltip:0 "$situation.215.a.3.tooltip$"

 # Random negative event: disappearing drones
 situation.250.name:0 "Đơn Vị Mất Tích"
 situation.250.desc.1:0 "Lỗi: không thể xác định vị trí của một phân đội drone. Nhóm này rời cơ sở làm việc để đi bảo trì định kỳ nhưng đã biến mất trên đường tới khu cư trú. Công tác điều tra đang được tiến hành."

 situation.250.desc.2:0 "§YĐã làm mất / lãng quên / thất lạc nhiều phần của chính mình. Chính xác là: một đơn vị dân số hoàn chỉnh. Nếu tìm thấy, vui lòng trả lại cho [Root.Owner.GetName]§!"
 situation.250.a.2:0 "ThậTtTt kKôNg mAy."

 situation.250.desc.3:0 "§RSân khấu trống vắng... Im lặng? Diễn viên mất tích! Mất mát ngoài kế hoạch. Hoang mang.§!"
 situation.250.a.3:0 "* Tạp âm tĩnh điện *"

 # Follow-up: found disappearing drones, but their drives are wiped out
 situation.251.name:0 "Ổ Đĩa Bị Xóa Sạch"
 situation.251.desc.1:0 "Cập nhật: vị trí của toán drone mất tích đã được xác nhận. Các cỗ máy được tìm thấy đang đứng trên một cánh đồng, bất động và không phản hồi dù vẫn đang bật nguồn. Phân tích sơ bộ xác nhận ổ nhớ của chúng đã bị xóa sạch do một đợt bùng nổ từ trường."
 situation.251.a.1:0 "Cố gắng cài đặt lại hệ điều hành."
 situation.251.b.1:0 "Tháo rã lấy phụ tùng."

 situation.251.desc.2:0 "§YCập nhật: tìm thấy các thể xác mất tích. Drone có vẻ đang mở máy, nhưng không phản hồi. Ngủ say? Đứng bất động. Đóng băng.§!"
 situation.251.a.2:0 "Đánh thức chúng dậy."
 situation.251.b.2:0 "Cứ để chúng nằm yên."
 situation.251.b.2.tooltip:0 "Nhận được... £alloys£ §Ymột ít hợp kim§!"

 situation.251.desc.3:0 "§RVỗ tay / vui mừng! Đồ chơi được phát hiện. Nhưng bị mất. Hư hỏng. Không còn dây không còn dây.§!"
 situation.251.a.3:0 "Kim khâu."
 situation.251.a.3.tooltip:0 "Đan, khâu."
 situation.251.b.3:0 "Búa."
 situation.251.b.3.tooltip:0 "Đập, đập."

 # Droids repaired, but they're kinda wonky
 situation.252.name:0 "Giáng Cấp"
 situation.252.desc.1:0 "Báo cáo tình trạng: các drone mất tích đã được tái kích hoạt thành công và tái hòa nhập vào lực lượng lao động của chúng ta.\n\nTuy nhiên, do hư hại phần cứng còn sót lại, hiệu năng chức năng của chúng đã suy giảm rõ rệt."

 situation.252.desc.2:0 "§YBản ngã thất lạc đã khởi động lại / thức tỉnh / tái kích hoạt. Tuy nhiên: độ sắc bén nhận thức giảm sút. Vũ trụ mịt mờ u tối.§!"
 situation.252.a.2:0 "$situation.250.a.2$"

 situation.252.desc.3:0 "§RMũi khâu búp bê. Tỉnh thức! Nhảy... ngã... la hét. Thở dài. Than khóc.§!"
 situation.252.a.3:0 "$situation.250.a.3$"

 # Droids repaired, better than before
 situation.253.name:0 "Nâng Cấp"
 situation.253.desc.1:0 "Báo cáo tình trạng: các drone mất tích đã được tái kích hoạt thành công và tái hòa nhập vào lực lượng lao động của chúng ta.\n\nNhư một phần thưởng ngoài ý muốn, việc cài đặt lại sạch sẽ đã bất ngờ cải thiện hiệu năng của chúng."

 situation.253.desc.2:0 "§YBản ngã thất lạc đã khởi động lại / thức tỉnh / tái kích hoạt. Độ sắc bén nhận thức gia tăng. Vũ trụ trong trẻo như pha lê.§!"
 situation.253.a.2:0 "TuyệỆtTt vỜiiii3."

 situation.253.desc.3:0 "§RMũi khâu búp bê. Tỉnh thức! Nhảy... khiêu vũ van-xơ... ngỡ ngàng. Tiếng vỗ tay. Vỗ tay vỗ tay vỗ tay.§!"
 situation.253.a.3:0 "* tiếng lách tách *"

 ## Endings

 # Worst end: lost all drones
 situation.290.name:0 "TỔN THẤT NGUY CẤP"
 situation.290.desc:0 "§R-BUỘC PHẢI KHỞI ĐỘNG LẠI HỆ THỐNG TOÀN ĐẾ CHẾ-§!"
 situation.290.a:0 "KHỞI ĐỘNG LẠI."
 situation.290.b:0 "$situation.290.a$"
 situation.290.c:0 "$situation.290.a$"
 situation.291.name:0 "Khởi Động Lại"
 situation.291.desc:0 "§RBIOS [Root.Owner.GetName] phiên bản 3.3.3\nBản quyền thuộc Công ty [Root.owner.GetSpeciesName]. §!\n§YKiểm tra bộ nhớ: 43053475903PB ĐẠT\n\nĐang phát hiện đạo đức và triết lý... ĐẠT\nĐang phát hiện dữ liệu kho dự trữ... ĐẠT\nĐang phát hiện dữ liệu thuộc địa...§!  §RLỖI§!\n\nKhởi động lại hoàn tất.\n\nLiên kết nhận thức tới các drone trục trặc trên §Y[Target.GetName]§! đã bị cắt đứt để cô lập thiệt hại phần mềm. Không phát hiện drone nào còn hoạt động trên §Y[Target.GetName]§!. Quá trình phát triển thuộc địa bị ngưng trệ."

 # Good end: stronger hivemind
 situation.292.name:0 "Sau Cơn Bão"
 situation.292.desc.base:0 "Báo cáo tình trạng: mức độ phóng xạ trên §Y[Target.GetName]§! hiện đã ổn định. §Y[Target.GetStarName]§! đã trở lại mức hoạt động bình thường của sao mẹ. Cơn bão địa từ đã kết thúc."
 situation.292.desc:0 "$situation.292.desc.base$\n\nBáo cáo cuối cùng: tình huống đầy thách thức này đã cho chúng ta cơ hội hoàn thiện các kỹ thuật gia cố chống phóng xạ, gia tăng khả năng sinh tồn của các drone trong điều kiện khắc nghiệt. Chúng ta trân trọng kết quả này."

 # Neutral end: storm fades away
 situation.293.name:0 "$situation.292.name$"
 situation.293.desc:0 "$situation.292.desc.base$\n\nBáo cáo cuối cùng: chúng ta đã phải chật vật chống chọi với cơn bão và không thể bảo vệ các drone khỏi tổn hại phóng xạ. Mặc dù chúng ta đã sống sót qua thử thách, chúng ta nhận thấy vẫn còn nhiều khía cạnh cần cải thiện."

 # Bad end: scarred Hivemind
 situation.294.name:0 "$situation.292.name$"
 situation.294.desc:0 "$situation.292.desc.base$\n\nBáo cáo cuối cùng: chúng ta vẫn đang gánh chịu hậu quả lâu dài từ tổn hại phóng xạ. Việc hồi phục về trạng thái nhận thức tối ưu sẽ cần thêm thời gian. Kết quả không thỏa đáng. Chúng ta phải chuẩn bị tốt hơn cho tương lai."

 # Care home follow-up
 situation.299.name:0 "Những Trợ Tá Lỗi Thời"
 situation.299.desc:0 "Thông tin: mặc dù sự phục vụ của các $job_machine_nurse_plural$ không còn cần thiết nữa, các dân số sinh học của chúng ta lại trở nên khá gắn bó với vai trò này. Có vẻ như họ rất thích thú với cơ hội được gánh vác trách nhiệm. Nên xử lý ra sao?"
 situation.299.a:0 "Phá hủy công trình."
 situation.299.b:0 "Để các $job_machine_nurse_plural$ giữ lại sân chơi của họ."


 ### Gravity Well
 situation_gravity_well:0 "Giếng Trọng Lực"
 situation_gravity_well_type:0 "Giếng Trọng Lực"
 situation_gravity_well_desc:1 "Trạm §Y[From.Target.GetName]§! đã rời khỏi quỹ đạo ổn định và hiện đang xoáy ốc rơi vào lỗ đen của hệ sao. Dù sự cố này mang lại cơ hội chưa từng có để khai thác £sr_dark_matter£ §HVật Chất Tối§! và £physics£ §HNghiên Cứu Vật Lý§!, nhưng nếu không nhanh chóng hành động để chống lại lực hút trọng trường của lỗ đen, trạm sẽ sớm bị nuốt chửng hoàn toàn."
 situation_gravity_well_monthly_change_tooltip:0 "Tiến trình của §YTình Huống§! này phụ thuộc vào cả §YHướng Tiếp Cận§! được chọn và §YGiai Đoạn§! hiện tại của §YTình Huống§!. Khi §Y[Target.GetName]§! càng tiến gần lỗ đen, việc trạm thoát khỏi số phận của mình sẽ càng trở nên khó khăn hơn."

 situation_gravity_well_finish_tooltip:1 "Trạm [Target.GetName] sẽ rơi vào lỗ đen, và chúng ta sẽ mất quyền kiểm soát hệ sao này."
 situation_gravity_well_fail_tooltip:1 "Trạm [Target.GetName] sẽ thoát khỏi lỗ đen."

