 deficit.100.name:0 "Thâm Hụt Xoắn Ốc"
 deficit.100.desc:0 "Thâm hụt năng lượng của chúng ta đã mất kiểm soát! [Owner.GetFinancialAdvisorAgencyCap] yêu cầu chúng ta phải có hành động quyết liệt để kiểm soát tình hình, nếu không việc cắt giảm chi tiêu nghiêm ngặt sẽ trở nên tất yếu chỉ trong vài tháng."
 deficit.100.desc.gestalt:0 "Thâm hụt năng lượng của chúng ta đã mất kiểm soát! Các drone phân bổ tài nguyên của chúng ta ngày càng kích động trước các chỉ số đo lường về mức độ an toàn của chuỗi cung ứng. Chúng dự báo rằng việc cắt giảm chi tiêu quyết liệt sẽ là cần thiết chỉ trong vài tháng trừ khi có hành động lớn được thực hiện."
 deficit.100.A:0 "Chúng ta có thể vay từ những người ủng hộ mình."
 deficit.100.B:0 "Tái phân bổ tài nguyên từ [looted_planet.GetName]."
 deficit.100.C:0 "Mọi thứ vẫn đang diễn ra đúng theo kế hoạch."
 BANKRUPTCY:0 "Phá Sản!"
 deficit.110.desc:0 "Chúng ta đã thất bại trong việc ngăn chặn phá sản. Sau nhiều tháng thiếu hụt năng lượng đến mức vô phương cứu vãn, chúng ta không còn lựa chọn nào khác ngoài việc vỡ nợ và cắt giảm mạnh tay các khoản chi tiêu."
 deficit.110.desc.gestalt:0 "Chúng ta đã thất bại trong việc tái cân bằng các khoản chi tiêu. Sau nhiều tháng thiếu hụt năng lượng đến mức vô phương cứu vãn, chúng ta không còn lựa chọn nào khác ngoài việc thực thi tái phân bổ quy mô lớn đối với các hệ thống phân phối tài nguyên."
 end_deficit_effect_tooltip:0 "§RTất cả công trình đã nâng cấp bị giáng cấp.\nToàn bộ lục quân tấn công bị giải tán.\n50% tàu quân sự bị giải thể.§!"
 end_other_deficit_situations_tooltip:0 "Tất cả các Tình Huống Thâm Hụt khác đều kết thúc như một phần của cuộc tái cấu trúc Đế Chế."

 deficit.125.name:0 "$deficit.100.name$"
 deficit.125.desc:1 "Tình trạng thiếu hụt khoáng sản của đế chế chúng ta ngày càng trở nên nghiêm trọng trong những tháng gần đây. [Owner.GetFinancialAdvisorAgencyCap] đã chuyển từ lo ngại sang phẫn nộ trước các dự báo hiện tại, cho thấy chúng ta sẽ sớm cạn kiệt tài nguyên để trả nợ. Họ dự đoán rằng việc cắt giảm mạnh tay sẽ là điều tất yếu chỉ trong vài tháng trừ khi có hành động lớn được thực hiện."
 deficit.125.desc.gestalt:0 "Tình trạng thiếu hụt khoáng sản của đế chế chúng ta ngày càng trở nên nghiêm trọng trong những tháng gần đây. Các drone phân bổ tài nguyên của chúng ta đã bị kéo căng tới cực hạn, và không thể đảm bảo ngăn ngừa sự sụp đổ của hệ thống hậu cần. Chúng dự báo rằng việc cắt giảm mạnh tay sẽ là điều tất yếu chỉ trong vài tháng trừ khi có hành động lớn được thực hiện."
 deficit.130.desc:0 "Chúng ta đã thất bại trong việc ngăn chặn phá sản. Sau nhiều tháng thiếu hụt khoáng sản đến mức vô phương cứu vãn, chúng ta không còn lựa chọn nào khác ngoài việc vỡ nợ và cắt giảm mạnh tay các khoản chi tiêu."
 deficit.130.desc.gestalt:0 "Chúng ta đã thất bại trong việc tái cân bằng các khoản chi tiêu. Sau nhiều tháng thiếu hụt khoáng sản đến mức vô phương cứu vãn, chúng ta không còn lựa chọn nào khác ngoài việc thực thi tái phân bổ quy mô lớn đối với các hệ thống phân phối tài nguyên."

 deficit.140.name:0 "Thiếu Hụt Lương Thực Trầm Trọng"
 deficit.140.desc:0 "Tình trạng thiếu hụt lương thực ập xuống đế chế của chúng ta đang ngày càng trở nên nan giải. Rõ ràng chúng ta sẽ phải hành động quyết đoán, nếu không tình trạng thiếu hụt sẽ đến mức vô phương cứu vãn chỉ trong vài tháng."
 deficit.140.A:0 "Vô Hiệu Hóa Thùng Nhân Bản"
 deficit.140.A.tooltip:0 "Tất cả Thùng Nhân Bản đang hoạt động bị vô hiệu hóa. Chúng ta sẽ không còn phải trả chi phí duy trì của chúng."
 deficit.140.B:0 "Vô Hiệu Hóa Lò Phản Ứng Sinh Học"
 deficit.140.B.tooltip:0 "Tất cả Lò Phản Ứng Sinh Học đang hoạt động bị vô hiệu hóa. Chúng ta sẽ không còn phải trả chi phí duy trì của chúng."
 deficit.145.desc:0 "Khoản nợ lương thực của chúng ta đã đến mức vô phương cứu vãn. Những đợt cắt giảm mạnh tay sẽ bị cưỡng chế thực thi, vì chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận phá sản và vỡ nợ trước các nghĩa vụ."
 deficit.145.desc.gestalt:0 "Lương thực của chúng ta đã cạn kiệt. Chúng ta đơn giản là không thể cung cấp bất kỳ nguồn dưỡng chất nào cho các drone và các thực thể khác cần nó để vận hành. Các biện pháp cắt giảm mạnh tay sẽ được thực thi, vì chúng ta không còn lựa chọn nào khác ngoài việc tiến hành tái phân bổ quy mô lớn đối với hệ thống phân phối tài nguyên."
 deficit.145.desc.wilderness: "Thứ mà có lẽ chúng ta trân quý nhất - sự cân bằng của các tài nguyên tự nhiên - đã sụp đổ. Nguồn dự trữ thức ăn của chúng ta đã cạn kiệt, gây ra nỗi thống khổ trên toàn bộ chuỗi thức ăn. Giờ đây chúng ta phải viện đến chế độ phân phối định lượng hà khắc và tái phân bổ tài nguyên trên quy mô lớn để bảo đảm cơ hội sinh tồn cao nhất."

 deficit.155.name:0 "Chủ Nghĩa Tiêu Dùng Phá Sản"
 deficit.155.desc:0 "Tình trạng thiếu hụt hàng tiêu dùng đã dẫn đến sự sụt giảm nghiêm trọng mức sống trong [Root.Owner.GetName]. Những tiếng nói bất mãn ngày càng trở nên dữ dội, và những lời kêu gọi hành động khẩn cấp ngày càng lan rộng khi rõ ràng là sự sụp đổ hoàn toàn về nguồn cung chỉ còn cách vài tháng."
 deficit.155.desc.gestalt:0 "Tình trạng thiếu hụt hàng tiêu dùng đã dẫn đến sự sụt giảm nghiêm trọng mức sống của các dạng sống cá thể cư trú bên trong [Root.Owner.GetName]. Những tiếng nói bất mãn ngày càng trở nên gay gắt, khi các drone hậu cần của chúng ta cảnh báo rằng sự sụp đổ hoàn toàn về nguồn cung chỉ còn tính bằng tháng."
 deficit.155.A:0 "Thời kỳ gian khó đã ập đến. Thiết lập chế độ phân phối định lượng."
 deficit.160.desc:0 "Tình trạng thiếu hụt hàng tiêu dùng đã tăng đến mức không còn biện pháp thực tế nào để bù đắp thâm hụt. Những đợt cắt giảm mạnh tay sẽ bị cưỡng chế thực thi, vì chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận phá sản và vỡ nợ trước các nghĩa vụ."

 deficit.170.name:1 "$deficit.100.name$"
 deficit.170.desc:1 "[Owner.GetFinancialAdvisorAgencyCap] ngày càng lo ngại về tình trạng thiếu hụt hợp kim đang giáng xuống đế chế của chúng ta. Việc không thể bù đắp các chi phí sẽ mang lại sự gián đoạn trên diện rộng cho khu vực công nghiệp của chúng ta."
 deficit.170.desc.machine:1 "Cảnh báo ngân sách: chi tiêu hợp kim vượt quá định mức chi tiêu trong nhiều tháng liên tiếp. Việc không thể giải quyết tình trạng thiếu hụt sẽ mang lại sự gián đoạn trên diện rộng cho khu vực công nghiệp của chúng ta."
 deficit.170.A:1 "Tháo dỡ các người máy trên §Y[robots_planet.GetName]§! để lấy linh kiện."
 deficit.170.A.tooltip:2 "Tháo dỡ toàn bộ người máy trên [robots_planet.GetName] (£pop£ §H[robots_planet.recycled_robots] Drone§!) để nhận £alloys£ §Y[robots_planet.total_alloys_gained] Hợp Kim§!"
 deficit.170.B:1 "Hợp nhất. Tái chế. Tháo dỡ các droid trên §Y[robots_planet.GetName]§!."
 deficit.170.B.tooltip:2 "Tháo dỡ một nửa dân số trên [robots_planet.GetName] (£pop£ §H[robots_planet.recycled_robots] Drone§!) để nhận £alloys£ §Y[robots_planet.total_alloys_gained] Hợp Kim§!"

 deficit.175.desc:1 "Thất bại trong việc giải quyết tình trạng thiếu hụt hợp kim, chúng ta đã buộc phải tuyên bố phá sản và vỡ nợ. [Owner.GetFinancialAdvisorAgencyCap] đang soạn thảo một kế hoạch thắt lưng buộc bụng mới để cắt giảm chi tiêu và ngăn chặn tình trạng này tái diễn."

 deficit.185.name:0 "Thâm Hụt Pha Lê Hiếm Trầm Trọng"
 deficit.185.desc:0 "Pha lê hiếm đang ngày càng trở nên khan hiếm trong [Root.Owner.GetName]. Tình trạng thiếu hụt đã được báo cáo trong nhiều lĩnh vực, từ quân nhu thiết yếu cho đến các linh kiện quan trọng dùng trong nhiều quy trình sản xuất tiên tiến. [Owner.GetFinancialAdvisorAgencyCap] cảnh báo cần phải cải cách chuỗi cung ứng trong vòng vài tháng, nếu không sẽ phải cắt giảm mạnh tay."
 deficit.185.A:0 "Thu hồi pha lê từ [looted_planet.GetName]."
 deficit.185.A.nomad: "Hút pha lê hiếm từ Thuyền Hạm Thủ Phủ."
 deficit.185.B:0 "Chúng ta sẽ phải khai thác quá mức các mỏ của mình."
 deficit.185.C:0 "Chúng ta có thể chấp nhận việc pha lê ngày càng hiếm hơn."
 deficit.190.desc:0 "Nguồn cung pha lê hiếm của chúng ta đã sụt giảm đến mức ngay cả các hệ thống quan trọng cũng không còn có thể duy trì được nữa. [Owner.GetFinancialAdvisorAgencyCap], nơi đã đề xuất đổi tên chúng thành \"pha lê hiếm nhất\", đang thực thi những đợt cắt giảm hà khắc để đưa mức sử dụng trở lại giới hạn bền vững."
 deficit.190.desc.wilderness: "Nguồn cung $rare_crystals$ của chúng ta đã sụt giảm đến mức chúng ta không còn có thể duy trì nhiều chức năng thiết yếu. Trong những trường hợp cực đoan, chúng ta mạo hiểm cả mạng sống của những sinh vật cộng sinh chuyên biệt phụ thuộc vào nguồn tài nguyên quý giá này.\n\nĐể ngăn chặn tổn thất thêm về nhân mạng và năng suất, chúng ta giờ đây phải viện đến các biện pháp quyết liệt để đảm bảo tái lập trạng thái cân bằng."

 deficit.200.name:1 "Thâm Hụt Bụi Dễ Cháy Trầm Trọng"
 deficit.200.desc:1 "Do quản lý yếu kém và chi tiêu liều lĩnh, kho dự trữ Bụi Dễ Cháy của chúng ta đã bốc hơi hoàn toàn! Nguồn tài nguyên chiến lược này được sử dụng rộng rãi trong nhiều lĩnh vực, từ sản xuất hợp kim cho đến phát triển quân sự. Bổ sung nguồn cung là điều tối quan trọng để bảo đảm sự thịnh vượng kinh tế của đế chế."
 deficit.200.A:1 "Thu hồi bụi dễ cháy từ [looted_planet.GetName]."
 deficit.200.A.nomad: "Hút bụi dễ cháy từ Thuyền Hạm Thủ Phủ."
 deficit.200.B:1 "Chúng ta sẽ phải khai thác quá mức các mỏ của mình."
 deficit.200.C:1 "Chúng ta có thể chấp nhận việc bụi dễ cháy ngày càng khó tìm hơn."
 deficit.205.desc:1 "Tình trạng thiếu hụt bụi dễ cháy kéo dài đã dẫn đến một cuộc khủng hoảng kinh tế trên toàn đế chế. Không thể hoàn trả các khoản thâm hụt, chúng ta buộc phải tuyên bố phá sản và từ bỏ các khoản nợ. [Owner.GetFinancialAdvisorAgencyCap] đang soạn thảo một kế hoạch tài chính mới, thực thi những đợt cắt giảm hà khắc để tái cân bằng ngân sách."
 deficit.205.desc.gestalt:0 "Tình trạng thiếu hụt bụi dễ cháy kéo dài đã dẫn đến sự sụp đổ chuỗi cung ứng trên toàn đế chế. Rõ ràng là chúng ta không còn có thể duy trì việc sử dụng vật liệu này. [Owner.GetFinancialAdvisorAgencyCap] đang soạn thảo một kế hoạch tài chính mới, thực thi những đợt cắt giảm hà khắc để tái cân bằng ngân sách."
 deficit.205.desc.wilderness: "Tình trạng thiếu hụt $volatile_motes$ trên khắp các thế giới của chúng ta đã gây ra sự gián đoạn trên diện rộng, đặc biệt đối với những sinh vật cộng sinh lao động ưa môi trường khắc nghiệt mà sự sống của chúng phụ thuộc vào nguồn tài nguyên này. Để ngăn chặn mất mát thêm về sinh mạng và năng suất, chúng ta giờ đây phải thực thi những thay đổi quyết liệt để đảm bảo duy trì sự sống cơ bản, với hy vọng sớm tìm lại sự cân bằng."


 deficit.215.name:1 "Thâm Hụt Khí Ngoại Lai Trầm Trọng"
 deficit.215.desc:1 "Khí Ngoại Lai đã trở thành một sự hiện diện xa lạ trong kho dự trữ của đế chế - và sự vắng mặt liên tục của chúng đang tác động lên toàn bộ quy trình sản xuất phụ thuộc nhiều vào chúng. [Owner.GetFinancialAdvisorAgencyCap] khuyến nghị mạnh mẽ chúng ta nên xem xét lại các ưu tiên ngân sách để chấm dứt tình trạng kỳ quặc này."
 deficit.215.A:1 "Thu hồi khí từ [looted_planet.GetName]."
 deficit.215.A.nomad: "Hút khí ngoại lai từ Thuyền Hạm Thủ Phủ."
 deficit.215.B:1 "Chúng ta sẽ phải khai thác quá mức các mỏ của mình."
 deficit.215.C:1 "Chúng ta có thể chấp nhận việc khí của mình ngày càng thoáng qua mau biến."
 deficit.220.desc:2 "Đế chế của chúng ta không còn có thể chống chọi với tình trạng thiếu hụt khí ngoại lai đang làm gián đoạn các quy trình sản xuất. [Owner.GetFinancialAdvisorAgencyCap] đã buộc phải tuyên bố phá sản, cho phép chúng ta xóa bỏ các nghĩa vụ nợ nần. Việc cắt giảm mạnh tay sẽ được thực thi để chúng ta có thể từ từ gầy dựng lại kho tài nguyên của mình."
 deficit.220.desc.gestalt:0 "Đế chế của chúng ta không còn có thể chống chọi với tình trạng thiếu hụt khí ngoại lai đang làm gián đoạn các quy trình sản xuất. [Owner.GetFinancialAdvisorAgencyCap] đã buộc phải tuyên bố phá sản, cho phép chúng ta tái tổ chức hệ thống phân phối để có thể từ từ gầy dựng lại kho tài nguyên của mình."

 deficit_situation_finish_tooltip:0 "Tất cả các hình phạt liên quan đến §Y[This.GetName]§! đang diễn ra sẽ bị gỡ bỏ."
 deficit_situation_extra_defaulted_tooltip:0 "Tài nguyên sẽ được giải phóng từ các tài sản bị thanh lý để cho phép chúng ta tái thiết."

 #Leviathan situations
 leviathan_celebration_opportunity:0 "Cơ Hội [This.GetLeviathanParadeName]"
 leviathan_celebration_opportunity_type:0 "Cơ Hội Diễu Hành Thần Thú"
 leviathan_celebration_opportunity_desc:1 "Sau khi đánh bại §Y[This.GetLeviathanTargetName]§!, chúng tôi tin rằng một đợt [Owner.GetParadeStudy] trên §Y[Target.GetName]§! tập trung vào [Root.GetTrophyName] mà chúng ta thu được sẽ mang lại lợi ích to lớn cho đế chế."
 leviathan_celebration_opportunity_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_approaches_dependent$"
 leviathan_celebration_default:0 "Cho Phép Tổ Chức Lễ Hội"
 leviathan_celebration_do_nothing_effect:0 "Đợt [Owner.GetParadeStudy] sẽ diễn ra khi [Target.GetName] tổ chức."
 leviathan_celebration_encourage:0 "Khuyến Khích Lễ Hội"
 leviathan_celebration_discourage:0 "Ngăn Cản Lễ Hội"
 approach_reorganize: "Tái Tổ Chức"
 approach_reorganize_effect: "Tạm dừng tình huống và mở khóa một §YQuyết Sách Thuộc Địa§! đặc biệt để chuyển đợt [Owner.GetParadeStudy] tới đó."
 leviathan_celebration_encourage_effect:0 "Bằng cách khuyến khích ăn mừng kỳ tích vĩ đại này, chúng ta chắc chắn sẽ có thêm nhiều cơ hội để biến sự kiện này thành một kỷ niệm đáng nhớ."
 leviathan_celebration_discourage_effect:1 "Không có giá trị gì trong một đợt [Owner.GetParadeStudy] phù phiếm. Tài nguyên của chúng ta nên được đặt vào nơi khác tốt hơn."
 leviathan_celebration_voidspawn_effect:0 "Đợt [Owner.GetParadeStudy] này bị tạm hoãn cho đến khi tình trạng ô nhiễm [Owner.GetWaterCoolantLower] được xử lý xong."

 leviathan_celebration_opportunity_finish_tooltip:0 "Chúng ta tổ chức một đợt [Owner.GetParadeStudy], cường hóa vĩnh viễn [Target.GetName]."
 leviathan_celebration_opportunity_fail_tooltip:0 "Chúng ta sẽ hủy bỏ đợt [Owner.GetParadeStudy]."
 situation_tainted_voidspawn_finish_effect:0 "Chúng ta sẽ làm sạch [Target.GetName] và tiếp tục đợt [Owner.GetParadeStudy]."

 stage_leviathan_2_tooltip:0 "§Y[This.GetTrophyName]§! sẽ được mang đến §Y[Target.GetName]§!."
 stage_leviathan_3_tooltip:0 "Các khâu chuẩn bị cuối cùng sẽ được tiến hành."

 situation_tainted_voidspawn:0 "Ô Nhiễm [Owner.GetWaterCoolantUpper] Trên [Target.GetName]"
 situation_tainted_voidspawn_type:1 "Chất Ô Nhiễm Quái Vật Hư Không"
 situation_tainted_voidspawn_desc:0 "Nguồn cung cấp [Owner.GetWaterCoolantLower] của chúng ta đã bị nhiễm nọc độc axit từ Quái Vật Hư Không."
 situation_tainted_voidspawn_monthly_change_tooltip:0 "§YTình Huống§! này sẽ tiến triển chậm hơn nếu chúng ta chọn nghiên cứu chất ô nhiễm, nhưng chúng ta sẽ nhận được nghiên cứu trong suốt tiến trình từ §YHướng Tiếp Cận§! đó."
 approach_clean_the_contaminant:1 "Làm Sạch Nó"
 approach_clean_the_contaminant_effect:1 "Chúng ta cần làm sạch chất ô nhiễm nhanh nhất có thể để có thể quay lại đợt [Owner.GetParadeStudy]."
 approach_study_the_contaminant:1 "Nghiên Cứu Nó"
 approach_study_the_contaminant_effect:1 "Đừng lãng phí cơ hội quý giá này, hãy nghiên cứu chất ô nhiễm trước khi quay lại đợt [Owner.GetParadeStudy]."

 situation_stellarite_infested_star:0 "Ngôi Sao [Target.GetName] Bị Nhiễm Khuẩn"
 situation_stellarite_infested_star_type:0 "Ngôi Sao Bị Nhiễm Khuẩn"
 situation_stellarite_infested_star_desc:0 "Ngôi sao của chúng ta, [Target.GetName], gần đây hoạt động vô cùng kỳ lạ, tạo ra ít năng lượng hơn bình thường rất nhiều. Nếu điều này không sớm được khắc phục, chúng ta có thể phải đối mặt với thảm họa sinh thái!"
 situation_stellarite_infested_star_fail_tooltip:0 "[Target.GetName] sẽ bị dập tắt, khiến hệ sao trở thành nơi không thể sinh sống."
 situation_stellarite_infested_star_finish_tooltip:0 "[Target.GetName] sẽ trở lại trạng thái bình thường."
 situation_stellarite_infested_star_monthly_change_tooltip:0 "Tiến trình của §YTình Huống§! này phụ thuộc vào khả năng tìm kiếm phương thuốc chữa trị của chúng ta."
 approach_search_for_a_cure:1 "Tìm Kiếm Phương Thuốc Chữa Trị"
 approach_search_for_a_cure_effect:0 "Chúng ta cần mọi nhà khoa học sẵn có để nghiên cứu các vết đen kỳ lạ trên sao mẹ. Thủ Phủ của chúng ta phụ thuộc vào việc này."
 approach_cure_it:1 "Chữa Trị Cho Ngôi Sao"
 approach_cure_it_effect:0 "Giờ đây chúng ta đã có phương thuốc chữa trị. Chúng ta chỉ có thể hy vọng rằng chưa quá muộn."

 decision_reorganize_leviathan_parade: "Dời Địa Điểm Diễu Hành"
 decision_reorganize_leviathan_parade_desc: "Không phải thế giới nào cũng có thể đăng cai một sự kiện hoành tráng như đợt [Owner.GetParadeStudy]. Sau khi cân nhắc kỹ lưỡng, chúng ta quyết định [GetName] sẽ là địa điểm thích hợp hơn."
 #Events
 situation.1000.name:0 "[This.GetLeviathanTargetName]"
 situation.1000.desc.small:0 "Ngày ấy đã đến. Các [Owner.GetSensoryWorkers] của chúng ta đã vào vị trí và sẵn sàng cung cấp cho chúng ta một cuộc khám phá thấu đáo về §Y[This.GetTrophyName]§!. Khi cuộc nghiên cứu bắt đầu, một phần nhỏ ý thức của chúng ta tập trung vào §Y[Target.GetName]§! để tiếp thu cuộc nghiên cứu về vật thể dị thường. Tuy nhiên, những điều khám phá được không thú vị như chúng ta kỳ vọng khi kéo tàn tích về [Target.GetPlanetHabitat].\n\nÍt lâu sau khi quá trình bắt đầu, chúng ta quyết định chuyển cuộc nghiên cứu về trung tâm cụm trên [Target.GetName], nơi các [Owner.GetSensoryWorkers] chuyên trách sẽ liên tục quan sát nó. Hy vọng điều gì đó tốt hơn sẽ xuất hiện."
 situation.1000.desc.standard:0 "Ngày ấy đã đến. Các [Owner.GetSensoryWorkers] của chúng ta đã vào vị trí và sẵn sàng cung cấp cho chúng ta một cuộc khám phá thấu đáo về §Y[This.GetTrophyName]§!. Khi cuộc nghiên cứu bắt đầu, một phần đáng kể ý thức của chúng ta tập trung vào §Y[Target.GetName]§! để tiếp thu tầm quan trọng của vật thể dị thường này. Năng suất lao động tại [Owner.GetName] đã giảm trọn vẹn §H0.2%§! trong ngày hôm đó.\n\nDữ liệu cảm quan sau đó được lưu trữ sâu trong ý thức trước khi được đặt tại trung tâm cụm trên [Target.GetName], nơi các [Owner.GetSensoryWorkers] chuyên trách sẽ liên tục quan sát nó."
 situation.1000.desc.large:0 "Ngày ấy đã đến. Một lượng khổng lồ các [Owner.GetSensoryWorkers] đã vào vị trí và sẵn sàng mang lại cho chúng ta một cuộc thám hiểm tỉ mỉ về §Y[This.GetTrophyName]§!. Khi cuộc nghiên cứu bắt đầu, trong giây lát, toàn bộ ý thức của chúng ta tập trung vào §Y[Target.GetName]§! để tiếp thu nghiên cứu về vật thể dị thường vốn đã chiếm trọn tâm trí chúng ta. Một vài [owner.GetIndividualNamePlural] đang trong tình huống nguy hiểm đã bị thương do sự phân tâm nhất thời này, và một số thậm chí đã mất mạng. Sự mê hoặc của chúng ta lớn đến mức như thế.\n\nSau khi nghiên cứu ban đầu hoàn tất, chúng ta quyết định chuyển nó đến trung tâm cụm trên [Target.GetName], nơi các [Owner.GetSensoryWorkers] chuyên trách sẽ liên tục quan sát nó. Chúng ta đặt nó xuống với sự tôn kính gần như sùng bái, và tiếp tục dành một phần ý thức để quan sát."
 situation.1000.a:0 "Kết Quả Đáng Thất Vọng."
 situation.1000.b:0 "Chúng ta sẽ ghi nhớ [This.GetLeviathanTargetName]."
 situation.1000.c:1 "Trong [This.GetTrophyName], chúng ta đã tìm thấy chính mình."
 situation.1005.name:0 "[This.GetLeviathanParadeName]"
 situation.1005.desc.small:0 "Một ngày u ám đã đón chào đám đông thưa thớt tại thủ phủ của §Y[Target.GetName]§! hôm nay. Đoàn diễu hành mang theo bằng chứng về sự tiêu diệt của §Y[This.GetLeviathanTargetName]§! chậm rãi đi qua những người qua đường tản mạn. Tiến trình diễu hành được phát sóng trên toàn đế chế, nhưng mức độ hào hứng khá thấp vì [This.GetTrophyName] dường như không mấy lôi cuốn như chúng ta kỳ vọng.\n\nSau khi kết thúc chuyến lưu diễn quanh thế giới, [This.GetTrophyName] được đặt tại một khu trưng bày chuyên biệt ở trung tâm thủ đô để truyền cảm hứng cho các thế hệ mai sau."
 situation.1005.desc.standard:0 "Một ngày tươi sáng đã đón chào đám đông ken đặc trên §Y[Target.GetName]§! hôm nay khi đoàn diễu hành mang theo bằng chứng về sự tiêu diệt §Y[This.GetLeviathanTargetName]§! di chuyển khắp nơi. Tiến trình của cuộc diễu hành được phát sóng trên toàn đế chế tới hàng tỷ khán giả. [This.GetTrophyName] dường như đã trở thành một biểu tượng chính yếu của văn hóa [Owner.Species.GetAdj], truyền cảm hứng cho các nghệ sĩ và nhà sáng tạo trên khắp [Owner.GetName].\n\nSau khi kết thúc chuyến lưu diễn quanh thế giới, [This.GetTrophyName] được đặt tại một khu trưng bày chuyên biệt ở trung tâm thủ đô để truyền cảm hứng cho các thế hệ mai sau."
 situation.1005.desc.large:0 "Thời tiết trên §Y[Target.GetName]§! hôm nay tuyệt vời một cách khác thường, đúng như mong đợi, xét việc chúng ta đã vận hành hệ thống kiểm soát khí quyển ở mức tối đa. Mọi thành phố trên [Target.GetPlanetHabitat] đều chật kín công suất, và vẫn còn những con tàu du lịch quay quanh thế giới chỉ để trở thành một phần của ngày trọng đại này. Đại lễ diễu hành lần lượt đi qua từng khu định cư, và được chào đón bởi những con phố ken đặc người dân [Owner.GetSpeciesNamePlural]. Mọi thành phố có khả năng trưng dụng màn hình ảnh ba chiều trong đế chế của chúng ta cũng tràn ngập khán giả theo dõi các buổi tái phát sóng ba chiều hoành tráng. Khi tâm điểm của cuộc diễu hành, [This.GetTrophyName], tiến vào thủ đô của [Target.GetName], người dân đã bắt đầu bàn tán về việc biến ngày hôm nay thành một ngày lễ thường niên lấy cảm hứng từ §Y[This.GetLeviathanTargetName]§!. [This.GetTrophyName] sau đó được đặt tại một khu trưng bày chuyên biệt ở trung tâm thủ đô để truyền cảm hứng cho các thế hệ mai sau."
 situation.1005.a:0 "Nếu họ không buồn đến xem, tại sao lại yêu cầu tổ chức lễ ăn mừng?"
 situation.1005.b:0 "Hôm nay là một ngày tuyệt vời cho toàn thể [Owner.GetSpeciesNamePlural]."
 situation.1005.c:0 "Hôm nay chúng ta cùng đứng bên nhau, như một thể thống nhất."

 situation.1045.name:0 "Răng Nanh Mất Ổn Định"
 situation.1045.desc:0 "Để chuẩn bị cho ngày trọng đại, chúng ta đã vận chuyển một trong những §YRăng Nanh Của Rồng Ether§! đến §Y[Target.GetName]§!. Đưa chúng vào tàu vận tải là một thách thức lớn, vì sinh học độc nhất vô nhị của Rồng Ether dường như không tuân theo các định luật vật lý. Chiếc răng nanh phản ứng đặc biệt kỳ lạ khi tàu vận tải tiến vào bầu khí quyển của [Target.GetPlanetHabitat]: nó bắt đầu rã rời trước mắt chúng ta, và nếu tàu vận tải không phản ứng kịp thời, chúng ta có thể đã đánh mất cổ vật quý giá này."
 situation.1045.a:0 "Chế tạo một buồng chứa tốt hơn và đưa chiếc răng nanh xuống mặt đất."
 situation.1045.b:1 "Phản ứng này thú vị hơn nhiều so với bất kỳ đợt [Owner.GetParadeStudy] nào."
 situation.1045.b.tooltip:1 "Hủy bỏ đợt [Owner.GetParadeStudy] để tập trung nghiên cứu phản ứng này."
 situation.1045.c:0 "Thay thế chiếc răng nanh bằng một bản sao."
 situation.1045.c.tooltip:0 "Điều này sẽ làm giảm lượng đoàn kết mà cơ hội này tạo ra."
 situation.1050.name:0 "Kẻ Giám Sát"
 situation.1050.desc:0 "Việc bóc tách §YCon Mắt Của Shard§! là một quy trình lộn xộn với một vài lần khởi đầu hỏng. May mắn thay, con quái thú khổng lồ có rất nhiều mắt để chúng ta thực hành. Sau đó chúng ta lai dắt nhãn cầu tới hệ sao [Target.Solar_System.GetName], và một điều vừa hấp dẫn vừa ghê tởm đã xảy ra: con mắt bắt đầu tự gắn kết và tích hợp vào mảng cảm biến địa phương trông ra §Y[Target.GetName]§!. Nguyên nhân của hiện tượng này chưa rõ, nhưng xét cho cùng, phần lớn đặc điểm sinh lý của Rồng đều vượt quá tầm hiểu biết của chúng ta.\n\nQuá trình hợp nhất vẫn chưa hoàn tất, nhưng các [Owner.GetScientistPlural] của chúng ta tin rằng nó phải được ngăn chặn ngay lúc này nếu chúng ta muốn tiếp tục các kế hoạch trước đó."
 situation.1050.a:0 "Hãy để chúng ta nhìn bằng tầm nhìn của Shard!"
 situation.1050.a.tooltip:1 "Hủy bỏ đợt [Owner.GetParadeStudy] để sử dụng con mắt cho một mục đích khác."
 situation.1050.b:0 "Cạo sạch nó đi, chúng ta sắp hết hạn rồi."
 situation.1050.c:0 "Gỡ bỏ nó thật cẩn thận, chúng ta không muốn làm hỏng nó."
 situation.1055.name:0 "Xung Điện Đột Biến"
 situation.1055.desc:0 "§YLò Phản Ứng Của Thiết Giáp Hạm§! từng là một khối hàng rất ngoan ngoãn cho đến khi nó đến §Y[Target.GetName]§!, nơi chúng ta đặt nó trong nhà kho chờ ngày trọng đại. Chính tại đó rắc rối bắt đầu: khi không ai để ý, lò phản ứng đã tự khởi động lại. Nhà kho rực sáng từ bên trong khi nó phóng ra những luồng hồ quang plasma khổng lồ, đe dọa làm tan chảy toàn bộ công trình.\n\nHành động nhanh chóng của các [Owner.GetScientistPlural] của chúng ta vừa đủ để cứu vãn nó vào phút chót, với kết quả là giờ đây chúng ta có một lò phản ứng đang hoạt động để sử dụng tùy ý."
 situation.1055.a:0 "Đấu nối nó vào lưới điện của [Target.GetPlanetHabitat]."
 situation.1055.b:0 "Đưa nó vào buổi biểu diễn."
 situation.1055.b.tooltip:0 "Điều này sẽ tăng lượng đoàn kết mà cơ hội này tạo ra."
 situation.1055.c:0 "Tìm công tắc tắt nguồn."
 situation.1060.name:0 "Chi Thể Tự Tái Tạo"
 situation.1060.desc:0 "Ngay cả khi đã áp dụng các biện pháp phòng ngừa ô nhiễm ngoại lai, sự cố vẫn xảy ra. Khi §YChi Thể Của Mẫu Thể§! tiến vào thủ phủ của §Y[Target.GetName]§!, nó bằng cách nào đó đã tiếp xúc với một trong những người xử lý, và ngay lập tức, chi thể bắt đầu phản ứng. Những phần phụ rung giật xé toạc bắt đầu mọc ra từ Chiến Tích, ban đầu tạo thành một khối thịt nhào lộn vô định. Theo thời gian nó trở nên rõ nét hơn, và trước sự ngạc nhiên của chúng ta, nó mang hình dáng của người xử lý xấu số! Có vẻ như năng lực tái tạo của Mẫu Thể đã tiếp nhận DNA của giống loài chúng ta và hiện đang trong quá trình sinh ra thêm nhiều [Owner.GetSpeciesNamePlural]."
 situation.1060.a:0 "Dùng thứ này làm thức ăn nuôi đám đông người xem!"
 situation.1060.b:0 "Để phản ứng tự do diễn tiến."
 situation.1060.c:0 "Dùng nhiệt đốt cháy Chi Thể."
 situation.1065.name:0 "Cuộc Truy Đuổi Lông Vũ Bất Tận"
 situation.1065.desc:0 "Trong khi mang §YBộ Lông Của Rồng Bầu Trời§! về nhà, tàu vận tải của chúng ta nhận thấy rằng siêu làn đường mà họ di chuyển qua có một sự biến dạng thứ hai ngoài con tàu. Ban đầu bị xem nhẹ chỉ như một dị thường, phải đến khi con tàu tiến vào §Y[Target.Solar_System.GetName]§! thì mới rõ ràng rằng một nhóm thực thể truy đuổi đang gây ra sự giãn nở siêu làn đường: một đàn rồng con đã tiến vào hệ sao của chúng ta để ráo riết đuổi theo tàu vận tải. Chắc hẳn chúng đã phục kích gần điểm nhảy và bám theo lối ra của chúng ta. Lũ rồng con dường như không sở hữu năng lực trí tuệ của tổ tiên chúng và dường như chỉ đang bám theo chúng ta một cách vô định, hay chính xác hơn, bám theo bộ lông vũ."
 situation.1065.a:0 "Tiêu diệt lũ sâu bọ."
 situation.1065.b:0 "Chúng ta nên thiết lập một khu bảo tồn cho chúng tại [Target.Solar_System.GetName]."
 situation.1065.b.tooltip:1 "Hủy bỏ đợt [Owner.GetParadeStudy] để nhường một tiểu hành tinh cho bầy rồng con cư trú."
 situation.1065.c:1 "Hãy tưởng tượng việc có các đối tượng sống cho đợt [Owner.GetParadeStudy]!"
 situation.1065.d:0 "Bắn một vài phát súng cảnh cáo, xua đuổi chúng đi!"
 situation.1070.name:0 "Kim Loại Đậm Đặc Nhất"
 situation.1070.desc:0 "Sáng nay, một bất ngờ đón chờ chúng ta trên §Y[Target.GetName]§! khi §YMáy Ép Của Người Máy Phế Liệu§! nhả ra tác phẩm cuối cùng của nó vào cơ sở kho chứa của chúng ta. Khối hợp kim lớn đậm đặc và nén chặt hơn bất cứ thứ gì chúng ta từng hy vọng sản xuất được, chứa đủ kim loại trong vài mét khối để đóng trọn một chiến hạm thiết giáp. Diễn biến kỳ diệu này khiến các [Owner.GetScientistPlural] của chúng ta tin rằng họ có thể làm cho máy ép hoạt động trở lại ở hiệu suất §G0.001%§!, nếu chúng ta mong muốn."
 situation.1070.a:0 "Đập vỡ nó ra và sử dụng cho việc xây dựng."
 situation.1070.b:1 "Đưa vào đợt [Owner.GetParadeStudy]."
 situation.1070.c:0 "Đưa Máy Ép trở lại không gian và để nó làm việc."
 situation.1070.c.tooltip:1 "Hủy bỏ đợt [Owner.GetParadeStudy] để tái kích hoạt máy ép và nhận một mỏ $d_alloys_10$ trên quỹ đạo của [Target.GetName]."
 situation.1075.name:0 "Túi Khí Rò Rỉ"
 situation.1075.desc:0 "Ánh sáng nhấp nháy của §YTúi Phân Tán Của Bóng Ma Tinh Tú§! khiến người ta phải xao nhãng khi nhìn vào, xao nhãng đến mức phải mất một lúc mới phát hiện ra rằng chiếc túi mà Bóng Ma dùng để tạo lá chắn tự nhiên đang bị rò rỉ. Sau khi nhanh chóng xác nhận việc tiếp xúc với các hóa chất bên trong sẽ không gây ra sự sụp đổ sinh thái hoàn toàn trên §Y[Target.GetName]§!, các [Owner.GetScientistPlural] của chúng ta tập trung vào phân tích tác động của khí này lên bầu khí quyển.\n\nCó vẻ như các hóa chất phát tán đã hòa quyện với tầng trung lưu và phân tán các năng lượng tập trung một cách đáng ngạc nhiên. Tốt đến mức nếu chúng ta giải phóng phần còn lại bên trong túi phân tán, khả năng phòng thủ của hành tinh sẽ gia tăng đáng kể."
 situation.1075.a:0 "Chiết xuất phần khí còn lại và để phản ứng hoàn tất."
 situation.1075.a.tooltip:1 "Hủy bỏ đợt [Owner.GetParadeStudy] để truyền $wraiths_energy_disperser$ vào bầu khí quyển của [Target.GetName]."
 situation.1075.b:0 "Bịt kín nó lại."
 situation.1075.c:0 "Đưa nó vào buổi biểu diễn."
 situation.1080.name:0 "Điềm Báo Kinh Hoàng"
 situation.1080.desc:0 "Các [Owner.GetTeamMemberPlural] của chúng ta đã báo cáo về những hiện tượng kỳ lạ trên con tàu vận chuyển §YKhối Nghịch Đảo Kinh Hoàng§! tới [Target.Solar_System.GetName]. Những cánh cửa sổ mở vào thế giới của nỗi đau đớn thuần túy cùng những lời thì thầm hủy diệt chỉ là một vài trong số những lời kể đáng sợ mà chúng ta nhận được. Người ta tin rằng khối vật chất của [This.GetLeviathanTargetName] là thủ phạm, và chúng ta có lý do chính đáng để lo lắng điều gì sẽ xảy ra nếu mang hàng hóa trên tàu tới §Y[Target.GetName]§!."
 situation.1080.a:0 "Trả nó về nơi nó xuất phát."
 situation.1080.a.tooltip:0 "Hủy bỏ đợt [Owner.GetParadeStudy] để bảo vệ sự an toàn và tỉnh táo của [Owner.GetSpeciesNamePlural] trên [Target.GetName]."
 situation.1080.b:0 "Không! Chúng ta cần phải nghiên cứu thứ này."
 situation.1080.c:0 "Ngăn chặn nó, chúng ta không thể để hiện tượng này lan rộng."
 situation.1080.d:0 "Nó có thể dạy cho chúng ta về Đấng Thiêng Liêng."
 situation.1085.name:0 "Cái Nhìn Thoáng Qua Về Vực Thẳm"
 situation.1085.desc.study:0 "Những gì trước đây chỉ là tin đồn giờ đã được xác nhận: §YKhối Nghịch Đảo Kinh Hoàng§! trên §Y[This.GetName]§! đã và đang xé toạc các lỗ hổng trong chính thực tại của chúng ta, mở ra những vết nứt vào một thế giới khác. Hiện tượng này đã chọc thủng các quy trình phong tỏa và dường như đang lan rộng vào thủ phủ của [This.GetName]. Mọi tiếp xúc với chiều không gian đó, ngay cả vô tình qua thấu kính thiết bị quan sát, đều gây ra sự hoảng loạn tột độ cho [Owner.GetTeamMember] quan sát. Các [Owner.GetScientistPlural] lo ngại điều này có thể lan rộng hơn nữa nhưng cũng cam đoan rằng chỉ cần thêm một chút thời gian họ có thể mở khóa các bí mật của chiều không gian kia."
 situation.1085.desc.deify:0 "Những gì trước đây chỉ là tin đồn giờ đã được xác nhận: §YKhối Nghịch Đảo Kinh Hoàng§! trên §Y[This.GetName]§! đã xé toạc các lỗ hổng trong chính thực tại của chúng ta dẫn vào một thế giới của tội ác thuần túy. Bất kỳ ai chỉ liếc nhìn vào một trong các vết nứt cũng cần hàng giờ biệt lập chỉ để ngừng la hét. Vì các giáo sĩ của chúng ta đã suy ngẫm về sự tồn tại của thực thể mà chúng ta đánh bại trong nhiều năm mà chưa có sự khai sáng lớn lao nào, họ nói rằng giờ họ đang tiến gần đến một sự khai sáng. \"Chúng tôi chỉ cần thêm một chút thời gian!\" Họ khẩn cầu, trong khi các nhà khoa học cảnh báo rằng quy trình này có thể không thể đảo ngược nếu chúng ta để nó tiếp diễn thêm nữa."
 situation.1085.a:0 "Những phát hiện này rất đáng để mạo hiểm!"
 situation.1085.b.divine:0 "Chúng ta cần thấy khải tượng chân thật của Đấng Thiêng Liêng."
 situation.1085.b.anathema:0 "Chúng ta phải thấu hiểu Nỗi Nguyền Rủa để đánh bại nó."
 situation.1085.c:0 "Không, mối nguy hiểm là quá lớn."
 situation.1090.name:0 "Ngưỡng Cửa Dẫn Vào Hư Không"
 situation.1090.desc.study:0 "Có lẽ sự ngạo mạn của chúng ta là quá lớn. §Y[This.GetName]§! đang bị xé toạc từ bên trong khi §YKhối Nghịch Đảo Kinh Hoàng§! vẫn còn bị cô lập trên đó. Dù những đột phá khoa học có được từ việc nghiên cứu chiều không gian khác mang tính cách mạng, áp lực đè nặng lên thế giới là vô cùng to lớn. Rất ít [Owner.GetScientistPlural] tin rằng họ vẫn có thể ổn định phản ứng, nhưng cơ hội vẫn còn! Khi cư dân của [This.GetName] lên các tàu vận tải để rời khỏi [This.GetPlanetHabitat], vô số vết nứt đang mở ra. Điểm không thể quay đầu đang nhanh chóng cận kề."
 situation.1090.desc.deify:0 "Có lẽ sự ngạo mạn của chúng ta là quá lớn. §Y[This.GetName]§! đang bị xé toạc từ bên trong khi §YKhối Nghịch Đảo Kinh Hoàng§! vẫn còn bị giam giữ trên đó. Dù chúng ta đã học được nhiều điều về chiều không gian của nỗi đau thuần túy, áp lực đè nặng lên thế giới là vô cùng khủng khiếp. Rất ít giáo sĩ còn tin rằng họ có thể thanh tẩy khối vật chất, nhưng cơ hội vẫn còn! Khi cư dân của [This.GetName] lên tàu vận tải để rời khỏi [This.GetPlanetHabitat], vô số vết nứt đang mở ra. Điểm không thể quay đầu đang nhanh chóng cận kề."
 situation.1090.a:0 "Chúng ta đã đi quá xa để chứng kiến nó kết thúc lúc này."
 situation.1090.b:0 "Nếu chúng ta dừng lại bây giờ, Nỗi Nguyền Rủa sẽ chiến thắng!"
 situation.1090.c:0 "Loại bỏ nó, bằng mọi giá cần thiết!"
 situation.1095.name:0 "Một Sự Kết Thúc"
 situation.1095.desc:0 "Bầu trời đã biến mất. Nó không phải bị mây che phủ. Nó đã bị thay thế bởi một vùng hư không thuần khiết. Tất cả những gì còn sót lại của §Y[This.GetName]§! là những mảng đất giữa đại dương hư vô. Mọi người còn ở lại trên [This.GetPlanetHabitat] đều phải chịu đựng nỗi thống khổ tột cùng theo từng khoảnh khắc trôi qua. Chúng ta đã câu thêm nhiều thời gian nhất có thể cho các chuyên gia. Một giọng nói méo mó và ghê rợn vang vọng từ thế giới bên kia: §R\"ĐúnG rồi, hÃy quAy vỀ vỚi tA-.\"§!"
 situation.1095.a:0 "Bây giờ hoặc không bao giờ, hỡi các [Owner.GetScientistPlural]!"
 situation.1095.b:0 "Bây giờ hoặc không bao giờ, hỡi các giáo sĩ!"
 black_hole_arkship_name: "[Root.GetName]"
 situation.1100.name:0 "Pháo Đài Thoát Hiểm"
 situation.1100.desc:0 "Sau khi đánh bại Pháo Đài Bí Ẩn, một phần của nó trôi nổi trong không gian, vì vậy chúng ta quyết định mang nó tới [Target.Solar_System.GetName] để trở thành một phần của đợt [Owner.GetParadeStudy]. Một vài [Owner.GetSpeciesNamePlural] đã mất tích bên trong chiều sâu của §YCăn Phòng Thuộc Pháo Đài§!. Kể từ khi nó đến §Y[Target.GetName]§!, chúng ta đã để các [Owner.GetTeamMemberPlural] khám phá nó hàng ngày, thế nhưng có điều gì đó bên trong cấu trúc đã biến đổi vào đầu ngày hôm nay. Những cánh cửa tự gập lại, chỉ để lại những bức tường dựng đứng trơ trọi để các đặc vụ của chúng ta va đập trong vô vọng. Chúng ta vẫn có thể liên lạc với những người [Owner.GetSpeciesNamePlural] bị mắc kẹt, nhưng chúng ta không có ý tưởng rõ ràng nào để đưa họ ra ngoài mà không làm hư hại cấu trúc. Có vẻ như Pháo Đài Bí Ẩn vẫn còn một bí mật cuối cùng."
 situation.1100.a:0 "Không bỏ lại bất kỳ [Owner.GetSpeciesName] nào phía sau!"
 situation.1100.b:0 "Chúng ta không thể mạo hiểm hủy hoại Căn Phòng."
 situation.1100.c.auth:0 "Chúng ta có thể sử dụng công nghệ này để giam giữ những kẻ không mong muốn."
 situation.1100.c.regular:0 "Thiết lập cấu trúc như một phòng giải đố cho người tham gia diễu hành khám phá."
 situation.1100.c.gestalt:0 "Khám phá bí mật của căn phòng!"

 situation.1110.name:0 "Rò Rỉ Thảm Họa"
 situation.1110.desc.base:0 "Buồng chứa §YTuyến Nọc Độc Của Quái Vật Hư Không§! đã bị rò rỉ! Lượng nọc độc tàn phá giờ đã đầu độc nguồn cung cấp [Owner.GetWaterCoolantLower] của chúng ta trên §Y[Target.GetName]§!, buộc chúng ta phải vận chuyển [Owner.GetWaterCoolantLower] từ các thế giới khác để xoa dịu cơn hạn hán tự chuốc lấy này."
 situation.1110.desc.reg:1 "$situation.1110.desc.base$ Nọc độc vốn tiến hóa để làm tê liệt các Sinh Vật Không Gian khổng lồ và làm tan chảy lớp vỏ giáp tàu, đã chứng minh là có độc tính cực cao đối với bất kỳ [Owner.GetSpeciesName] nào nuốt phải. $situation.1110.desc.end$"
 situation.1110.desc.lithoid:1 "$situation.1110.desc.base$ Nọc độc vốn tiến hóa để làm tê liệt các Sinh Vật Không Gian khổng lồ và làm tan chảy lớp vỏ giáp tàu, đã chứng minh là có tính ăn mòn cực mạnh đối với bất kỳ [Owner.GetSpeciesName] nào dính phải trên lớp da trầm tích của họ. $situation.1110.desc.end$"
 situation.1110.desc.machine:1 "$situation.1110.desc.base$ Nọc độc vốn tiến hóa để làm tê liệt các Sinh Vật Không Gian khổng lồ và làm tan chảy lớp vỏ giáp tàu, đã chứng minh là có phản ứng ăn mòn khi tiếp xúc với chất làm mát của chúng ta. Bất kỳ đơn vị nào sử dụng chất làm mát bị nhiễm độc đều nhanh chóng ngừng hoạt động. $situation.1110.desc.end$"
 situation.1110.desc.end:0 "Giờ đây chúng ta phải quyết định cách xử lý cuộc khủng hoảng này.\n\nLiệu chúng ta nên tiến hành thanh lọc phân tử toàn bộ DNA Quái Vật Hư Không trên [Target.GetPlanetHabitat], hay từ từ lọc nọc độc ra để chúng ta có thể tiếp tục đợt [Owner.GetParadeStudy]?"
 situation.1110.a:0 "Kiểm soát sự lây lan nhưng không hủy bỏ đợt [Owner.GetParadeStudy]."
 situation.1110.a.tooltip:0 "Tạm dừng đợt [Owner.GetParadeStudy] cho đến khi chất ô nhiễm được dọn sạch."
 situation.1110.b:0 "Thanh tẩy thế giới khỏi chất ô nhiễm và túi nọc độc!"
 situation.1110.b.tooltip:0 "Hủy bỏ đợt [Owner.GetParadeStudy] để nhanh chóng làm sạch thế giới."
 situation.1115.name:0 "[Target.GetName] Đã Được Làm Sạch"
 situation.1115.desc:1 "Sau nhiều tháng nỗ lực, nguồn cung cấp [Owner.GetWaterCoolantLower] của chúng ta trên §Y[Target.GetName]§! cuối cùng đã sạch bóng Chất Ô Nhiễm Quái Vật Hư Không. Đó không phải là một nỗ lực lãng phí, khi chúng ta đã học được nhiều điều từ sinh học dị chủng hiện diện trong [Owner.GetWaterCoolantLower] và giờ đã sẵn sàng tiếp tục đợt [Owner.GetParadeStudy]. Các [Owner.GetScientistPlural] của chúng ta tin rằng họ có thể cải thiện đời sống trên [Target.GetName] bằng những phát hiện này một khi đợt [Owner.GetParadeStudy] kết thúc."

 situation.1120.name:0 "Tia Lửa Cuối Cùng"
 situation.1120.desc:1 "Các thiết bị thăm dò quan sát chúng ta để lại tại nơi Quái Thú Nuốt Sao bị tiêu diệt báo cáo rằng các phần của cơ thể đã bắt đầu hợp nhất trở lại vào ngôi sao. Năng lượng dường như đã làm tăng hoạt động của sao, nhưng việc lấy đi §YTúi Trứng§! khiến các tính toán của chúng ta chỉ ra rằng điều đó là không đủ để khôi phục hệ sao §Y[dead_stellarite.solar_system.GetName]§! về vẻ rực rỡ trước đây. Nếu chúng ta quay tàu vận tải trở lại ngay bây giờ, chúng ta vẫn có khả năng thắp sáng lại ngôi sao."
 situation.1120.a:0 "Trả lại Túi Trứng và xem những gì có thể làm được."
 situation.1120.a.tooltip:0 "Hủy bỏ đợt [Owner.GetParadeStudy] để cố gắng thắp sáng lại ngôi sao [dead_stellarite.system.GetName]."
 situation.1120.b:0 "Không, chúng ta sẽ mang Túi Trứng đến [Target.GetName]."

 situation.1125.name:0 "Định Hướng Ngang Tinh Cầu"
 situation.1125.desc.base:0 "\n\nHàng hóa của họ - hàng triệu Quái Thú Nuốt Sao tí hon - được bảo quản ở độ không tuyệt đối, giúp giữ chúng ngoan ngoãn và bất hoạt cho đến khi sẵn sàng được đưa vào ngôi sao chính của hệ sao. Tàu vận tải sẽ phải ngắt tín hiệu vô tuyến một thời gian khi họ thâm nhập sâu hơn vào thủ đô của [Target.GetSpeciesAdj]."
 situation.1125.desc.binary:0 "Ánh sáng từ các ngôi sao song sinh của [Target.GetAdj] chiếu rọi xuống tàu vận tải khi nó tiến vào hệ sao [Target.capital_scope.Solar_System.GetName].$situation.1125.desc.base$"
 situation.1125.desc.trinary:0 "Bộ ba nguồn sáng tạo nên trái tim của [Target.GetName] lấp lánh trên thân tàu vận tải khi nó tiến vào hệ sao [Target.capital_scope.Solar_System.GetName].$situation.1125.desc.base$"
 situation.1125.desc.regular:0 "Sau khi hoàn thành chặng đầu tiên trong hành trình tới ngôi sao mang lại sự sống [Target.capital_star.GetName], tàu vận tải của chúng ta tiến sâu hơn vào không phận của [Target.GetName].$situation.1125.desc.base$"

 situation.1130.name:0 "Mật Mã Cũ"
 situation.1130.desc:0 "Tàu vận chuyển Quái Thú Nuốt Sao của chúng ta đã vượt qua vòng kiểm tra an ninh hệ sao - các mật mã an ninh mà $role_spymaster$ [spynetwork.leader.GetName] thu thập được đóng vai trò sống còn để vượt qua hệ thống kiểm soát. Các đặc vụ của chúng ta đã bắt đầu quy trình làm ấm để đánh thức đàn Quái Thú Nuốt Sao con. Chúng sẽ lại nhắm tới ngôi sao chính của hệ sao trong chuyến hải trình cuối cùng của tàu vận tải."

 situation.1135.name:0 "Rời Khỏi Tàu Vận Tải, Lao Vào Plasma Rực Cháy"
 situation.1135.desc:0 "Chúng ta đã nhận được tin báo từ $role_spymaster$ [spynetwork.leader.GetName]: mọi thứ đã sẵn sàng. Các đặc vụ của chúng ta đã bắt đầu rời khỏi tàu vận tải, chỉ để lại một thủy thủ đoàn rút gọn phía sau. Khi con tàu đạt tới tốc độ dưới ánh sáng tối đa, họ cũng sẽ thoát ra ngay trước khi tàu vận tải lao thẳng vào ngôi sao chính của hệ sao, đảm bảo chúng ta không để lại bất kỳ bằng chứng nào.\n\nĐàn Quái Thú Nuốt Sao đã bắt đầu trở nên khá kích động. Nếu chúng ta không sớm bắt đầu chiến dịch, chúng có thể tự tìm đường chui vào nguồn cung cấp nhiên liệu của tàu vận tải."

 situation.1140.name:0 "Nhiễm Khuẩn Thành Công"
 situation.1140.desc:0 "Bằng chứng cuối cùng về sự can thiệp của chúng ta đã nhanh chóng tan chảy bên trong vành nhật hoa của ngôi sao. Các cảm biến của chúng ta bốc cháy chỉ vài khoảnh khắc sau va chạm, nhưng điều đó là đủ để xác nhận rằng chúng ta đã thả ấu trùng nhiễm khuẩn thành công vào §Y[From.target.capital_star.GetName]§!.\n\nChúng ta có lẽ vừa kết án cả một hệ sao vào cái chết lạnh giá, tàn nhẫn."
 situation.1140.a:0 "Bây giờ chúng ta chờ đợi."

 situation.1145.name:0 "Năng Lượng Sao Mẹ Suy Kiệt"
 situation.1145.desc.base:1 "Chúng ta đang trải qua một chu kỳ hoạt động yếu kém bất thường từ sao mẹ [capital_star.GetName]. Các vết đen xuất hiện với số lượng chưa từng thấy do nhiệt độ của ngôi sao giảm xuống, dẫn đến sự sụt giảm rõ rệt về bức xạ mặt trời."
 situation.1145.desc.regular:1 "$situation.1145.desc.base$\n\nCư dân trên [capital_scope.GetName] đã bắt đầu tích trữ chăn chạy bằng năng lượng phân hạch và hạn chế tối đa các chuyến đi ra ngoài. Hy vọng chúng ta sẽ sớm trở lại thời kỳ ấm áp hơn."
 situation.1145.desc.gestalt:1 "$situation.1145.desc.base$\n\nChúng ta đã phân bổ thêm năng lượng vào ngân sách sưởi ấm và hướng dẫn tất cả các drone tụm lại gần nhau hơn để giữ nhiệt. Chúng ta sẽ vượt qua thử thách này."
 situation.1145.desc.wilderness: "$situation.1145.desc.base$\n\nDù sự nhiễu loạn này gieo rắc nỗi sợ hãi vào cốt lõi bản năng chung, khi biết trước những tổn hại mà ngôi sao quê hương từng gây ra: chúng ta sẽ kiên cường vượt qua. Chúng ta đã phân bổ thêm năng lượng để sưởi ấm các nơi trú ẩn, và các sinh vật cộng sinh sẽ học cách rúc sát vào nhau để tìm kiếm hơi ấm."
 situation.1145.a:0 "Bật tối đa máy sưởi."

 situation.1150.name:0 "Đại Hàn Tinh Cầu"
 situation.1150.desc:1 "Phản ứng chuỗi nhiệt hạch bên trong §Y[capital_star.GetName]§! hiện đã trên đà suy giảm liên tục trong một khoảng thời gian chưa từng có. Đang có các thảm họa sinh thái diễn ra trên [capital_scope.GetName] do lượng bức xạ giảm sút, và nếu tình trạng này tiếp diễn, chúng ta có thể phải đối mặt với một kỷ băng hà. Tất cả các trạm và các khu định cư khác trong hệ sao đều chịu những vấn đề tương tự. Các [owner.GetScientistPlural] của chúng ta chắc chắn rằng có điều gì đó bất thường đang diễn ra và mong muốn điều tra [capital_star.GetName]."
 situation.1150.a:0 "Tìm hiểu xem chuyện gì đang xảy ra!"

 situation.1160.name:0 "Phát Hiện Ký Sinh Trùng"
 situation.1160.desc:0 "§R[capital_star.GetName] đã bị nhiễm đàn Quái Thú Nuốt Sao tí hon!§! Chúng ta hoàn toàn không biết làm cách nào những quái thú sơ sinh này lại đến được ngôi sao của mình, vì chúng dường như không sở hữu bất kỳ năng lực FTL nào. Chúng ta có thể tìm hiểu điều đó sau. Bây giờ, chúng ta cần tìm cách ngăn chặn lũ ký sinh trùng trước khi thủ đô đóng băng hoàn toàn."
 situation.1160.a:0 "Mau tống khứ chúng ra khỏi đó!"

 situation.1170.name:1 "[Target.GetName] Đã Bị Dập Tắt"
 situation.1170.desc.base:1 "Hôm nay là một ngày tồi tệ đối với [owner.GetName], khi ngôi sao thủ đô §Y[target.GetName]§! của chúng ta đã lụi tàn. Dù đã sơ tán hàng triệu sinh mạng, điều đó chỉ làm dịu đi phần nào cú sốc. Thủ đô của chúng ta mãi mãi rơi vào một kỷ băng hà mới và vĩnh cửu. Bản thân [target.GetName] đã co lại thành một sao lùn nâu, đồng nghĩa với việc sự sống còn lại trong hệ sao sẽ vĩnh viễn suy tàn."
 situation.1170.desc.notknows:0 "$situation.1170.desc.base$\nĐáng buồn thay, hiện tượng kỳ dị đưa lũ Quái Thú Nuốt Sao đến hệ sao của chúng ta sẽ mãi là một bí ẩn. Giờ đây, chúng ta phải tái thiết."
 situation.1170.desc.knows:0 "$situation.1170.desc.base$\nChúng ta biết rằng những kẻ nuốt sao này đã bị cố tình đưa vào ngôi sao của chúng ta bởi §Y[star_infesters.GetName]§! - và giờ đây chúng sẽ phải trả giá."
 situation.1170.a:0 "Một bi kịch khủng khiếp."
 situation.1170.b:0 "Đế chế [star_infesters.GetName] sẽ phải đền tội."

 #Modifiers

 ether_trophy:0 "$drakes_scale$"
 ether_trophy_desc:0 "Chiếc răng nanh của một §YRồng Ether§! là tâm điểm tại thủ đô của thế giới này."
 studying_decaying_fang:0 "Nghiên Cứu Chiếc Nanh Đang Phân Rã"
 studying_decaying_fang_desc:0 "Nghiên cứu chiếc răng nanh của §YRồng Ether§! khi nó phân rã gần bầu khí quyển mang lại cho chúng ta những hiểu biết sâu sắc về bất cứ thứ gì từng tồn tại trước vũ trụ này."

 all_seeing_shard:0 "Mảnh Shard Toàn Tri"
 all_seeing_shard_desc:0 "Nhờ sự hợp nhất kỳ dị giữa máy móc và sinh học dị chủng, các mảng cảm biến trong hệ sao này có thể vươn xa hơn nhiều so với khả năng thông thường của chúng ta."
 shard_trophy:0 "$eye_of_the_shard$"
 shard_trophy_desc:0 "Dưới ánh mắt dõi theo của §YShard§!, cư dân trên thế giới này dường như làm việc chăm chỉ hơn."

 dread_trophy:0 "$dreadnoughts_reactor$"
 dread_trophy_desc:0 "Một lò phản ứng từ §YThiết Giáp Hạm Tự Động§! cung cấp một phần năng lượng cho thế giới này."
 reactor_overdrive:0 "Lò Phản Ứng Ép Xung"
 reactor_overdrive_desc:0 "Một nguồn lợi tạm thời từ lò phản ứng của §YThiết Giáp Hạm Tự Động§! đang giúp cấp năng lượng cho mọi công việc trên thế giới này."

 tiyanki_trophy:0 "$matriarchs_flagella$"
 tiyanki_trophy_desc:0 "Roi bơi của §YMẫu Thể Tiyanki§!, ban đầu bất hoạt, đã bắt đầu sinh ra các bản sao của cư dân trên thế giới này."
 burnt_tiyanki_trophy:0 "$matriarchs_flagella$ Bị Cháy Sém"
 burnt_tiyanki_trophy_desc:0 "Tàn tích bị đốt cháy của §YRoi Bơi Mẫu Thể Tiyanki§! tô điểm cho thủ đô của thế giới này."

 sky_dragon_trophy:0 "$sky_dragons_plume$"
 sky_dragon_trophy_desc:1 "Đặc tính chống trọng lực của §YRồng Bầu Trời§! mang lại cho chúng ta thêm không gian sống trên thế giới và đem lại những hiểu biết khoa học sâu sắc về hiện tượng này."

 scavenger_trophy:0 "$scavenger_bots_compactor$"
 scavenger_trophy_desc:0 "Máy ép của §YNgười Máy Phế Liệu§! giúp chúng ta tối ưu hóa các quy trình luyện kim."

 wraith_trophy:0 "$wraiths_energy_disperser$"
 wraith_trophy_desc:0 "Ánh sáng nhấp nháy từ Túi Phân Tán mang lại cảm giác rất dễ chịu và thư giãn."
 infused_atmosphere:0 "Bầu Khí Quyển Thấm Nhuần Năng Lượng Bóng Ma"
 infused_atmosphere_desc:0 "Bầu khí quyển này đã được thấm nhuần năng lượng tự nhiên của Bóng Ma Tinh Tú, khiến các đợt bắn phá quỹ đạo kém hiệu quả hơn."

 horror_study_trophy:0 "$horrific_inverse_mass$"
 horror_study_trophy_desc:0 "Tàn tích của một thực thể đến từ chiều không gian khác, chính sự hiện diện của nó trên thế giới này dường như là một sự sỉ nhục đối với trật tự tự nhiên."
 horror_deify_trophy:0 "$horrific_inverse_mass$"
 horror_deify_trophy_desc:0 "$horror_study_trophy_desc$"
 horror_study_trophy2:0 "$horrific_inverse_mass$ Bị Mất Ổn Định"
 horror_study_trophy2_desc:0 "Khối nghịch đảo đã phản ứng tiêu cực với chiều không gian của chúng ta và dường như đang chủ động tìm cách xé toạc thế giới của chúng ta."
 horror_deify_trophy2:0 "$horror_study_trophy2$"
 horror_deify_trophy2_desc:0 "$horror_study_trophy2_desc$"
 horror_too_late:0 "§RĐÃ QUÁ MUỘN§!"
 horror_too_late_desc:0 "Chúng ta đã chờ đợi quá lâu. Số phận của thế giới này không còn nằm trong tay chúng ta quyết định nữa."
 horror_stabilized:0 "$horrific_inverse_mass$ Đã Ổn Định"
 horror_stabilized_desc:0 "Một phép màu đã xảy ra trên [Root.GetName]: bất chấp mọi trở ngại, §YKhối Nghịch Đảo§! đã ổn định và giờ đây có thể được nghiên cứu mà không gặp bất kỳ nguy hiểm nào."

 fortress_trophy:0 "$fortress_hull_plates$"
 fortress_trophy_desc:0 "[This.GetPlanetHabitat] này chứa một Căn Phòng từ Pháo Đài Bí Ẩn, hầu hết thời gian có khả năng tự tái tạo cho bất kỳ thứ gì cư dân cần."

 voidspawn_contaminant:0 "Chất Ô Nhiễm Quái Vật Hư Không"
 voidspawn_contaminant_desc:0 "Thế giới này đã bị vấy bẩn bởi $voidspawns_chitin$ và giờ đây phải được dọn dẹp sạch sẽ."
 voidspawn_trophy:0 "$voidspawns_chitin$ Đã Được Thanh Lọc"
 voidspawn_trophy_desc:0 "Tuyến Nọc Độc của Quái Vật Hư Không đã được thanh lọc tô điểm cho thế giới này. Sau khi một vụ rò rỉ ban đầu ngăn cản nó được trưng bày, giờ đây nó có thể được chiêm ngưỡng bởi tất cả mọi người."

 stellar_devourer_trophy:0 "$devourers_plasma$"
 stellar_devourer_trophy_desc:0 "Tập hợp Trứng Quái Thú Nuốt Sao cuối cùng trong thiên hà."
 stellar_devourer_operation_trophy:0 "§HCho phép chúng ta tiến hành Chiến Dịch §Y$operation_consume_star$§!.§!"

 low_stellar_output_1:0 "Bức Xạ Sao Mẹ Yếu"
 low_stellar_output_1_desc:0 "Thế giới này đang phải chịu mức phát xạ thấp bất thường từ ngôi sao của mình, khiến cuộc sống trở nên khá khó chịu."
 low_stellar_output_2:0 "$low_stellar_output_1$"
 low_stellar_output_2_desc:0 "Thế giới này đang phải chịu mức phát xạ thấp nghiêm trọng từ ngôi sao của mình."
 low_stellar_output_3:0 "$low_stellar_output_1$"
 low_stellar_output_3_desc:0 "Thế giới này đang phải chịu mức phát xạ thấp nguy hiểm từ ngôi sao của mình do sự xâm nhập của Quái Thú Nuốt Sao."

 #Projects

 STELLARITE_INFESTED_STAR_PROJECT:0 "Tìm Kiếm Phương Thuốc Cho Tình Trạng Nhiễm Quái Thú Nuốt Sao"
 STELLARITE_INFESTED_STAR_PROJECT_DESC:0 "§Y[This.GetName]§! đã bị nhiễm Quái Thú Nuốt Sao. Chúng ta không chắc chúng đến từ đâu, nhưng chúng cần phải được dọn sạch sớm nếu không mọi sự sống trong hệ sao có thể sẽ chấm dứt."

