 ## Relic
 r_vacuum_flower: "Hoa Chân Không"
 r_vacuum_flower_desc: "Bông hoa nở của Kính Vạn Hoa là một cụm hoa mỏng manh với những cánh hoa biến ảo không ngừng, sở hữu khả năng điều khiển, hấp thụ và phản xạ sóng ánh sáng."
