 string_gravitational_pull:0 "Lực Kéo Trọng Trường"
 country_situations:0 "Tình Huống"
 mod_country_situations_sr_dark_matter_produces_add:0 "$mod_country_base_sr_dark_matter_produces_add$"
 mod_country_situations_physics_research_produces_add:0 "£physics_research£ Nghiên Cứu Vật Lý Hàng Tháng"
 mod_country_situations_influence_produces_add: "£influence£ Uy Thế Hàng Tháng"
 mutiny_tooltip:1 "Chúng ta đã mất quyền kiểm soát trạm không gian."

 gestalt_black_hole_good:0 "Ý Thức Thăng Hoa"
 gestalt_black_hole_good_desc:1 "Một mảnh ý thức [Owner.GetBrainName] của chúng ta mắc kẹt trong chân trời sự kiện của một lỗ đen, nơi một giây kéo dài thành cả thiên niên kỷ. Sự chênh lệch thời gian này lại có những công dụng riêng."
 gestalt_black_hole_bad:0 "Ý Thức Rời Rạc"
 gestalt_black_hole_bad_desc:1 "Một mảnh ý thức [Owner.GetBrainName] của chúng ta mắc kẹt trong chân trời sự kiện của một lỗ đen, nơi từng giây kéo dài thành cả thiên niên kỷ. Sự chênh lệch thời gian này thật chấn động và nhức nhối."

 situation.501.name:0 "Rơi Tự Do"
 situation.501.desc:1 "Do một vụ va chạm bất ngờ với một mảnh rác vũ trụ, trạm §Y[gravity_well_station.GetName]§! đã chệch khỏi quỹ đạo tròn ổn định trong cùng và hiện đang từ từ thu hẹp khoảng cách tới lỗ đen gần đó. Mặc dù tai nạn đặt toàn bộ trạm vào hiểm nguy, đây cũng là một cơ hội khó tin để nghiên cứu lỗ đen và bòn rút một lượng khổng lồ §HVật Chất Tối§!.\n\nĐộng cơ đẩy khẩn cấp đã được kích hoạt để điều chỉnh quỹ đạo của trạm."
 situation.501.a:0 "Rời xa khỏi đó ngay!"
 situation.501.b:1 "Ổn định quỹ đạo của trạm quanh lỗ đen."
 situation.501.c:0 "Tiến lại gần lỗ đen nhất có thể."

 # Random events
 situation.510.name:0 "Xin Chào Bóng Tối"
 situation.510.spirit.desc:1 "Một sự khai sáng! Bị thôi thúc bởi sự cuồng nhiệt tôn giáo, các [Root.Owner.GetResearchers] sùng đạo trên tàu §Y[Target.GetName]§! đã cướp quyền kiểm soát trạm. Họ tuyên bố đã nhìn thấy một khải tượng, và hiện đang lao thẳng về tâm lỗ đen trong một cuộc tìm kiếm tâm linh nhằm tự hủy diệt.\n\nLực lượng vũ trang hiện đang nỗ lực chiến đấu để giành lại quyền kiểm soát trạm."
 situation.510.desc:1 "Các [Root.Owner.GetResearchers] nhiệt huyết thái quá trên tàu §Y[Target.GetName]§! đã chiếm quyền kiểm soát trạm và hiện đang điều khiển nó lao về phía lỗ đen - một hành động chắc chắn xuất phát từ sự tò mò khoa học vô độ, liều lĩnh đến mức thiếu lành mạnh và hoàn toàn phớt lờ bản năng tự bảo tồn của chính mình.\n\nLực lượng vũ trang hiện đang chiến đấu để giành lại quyền kiểm soát trạm."
 situation.510.tooltip:0 "Hướng Tiếp Cận Tình Huống bị khóa vào Tiến Vào."

 situation.511.name:0 "Nỗi Sợ Hãi Bóng Tối"
 situation.511.black.desc:1 "\"Chúng ta đã chứng kiến điều gì xảy ra với các con tàu bị kẹt trong chân trời sự kiện! Tôi không có ý định chết như thế!\"\n\nSau khi gào thét sự bất phục tùng của mình, một trong các [Root.Owner.GetResearchers] của chúng ta đã cướp quyền điều khiển trạm và hiện đang lái nó tránh xa khỏi lỗ đen.\n\nLực lượng vũ trang hiện đang chiến đấu để giành lại quyền kiểm soát trạm, và sự việc được đề cập đang bị xóa sạch khỏi các sách giáo khoa vật lý của chúng ta."
 situation.511.desc:1 "Các [Root.Owner.GetResearchers] hoảng loạn tột độ đã chiếm quyền kiểm soát trạm và hiện đang lái nó tránh xa khỏi lỗ đen.\n\nLực lượng vũ trang hiện đang chiến đấu để giành lại quyền kiểm soát trạm."
 situation.511.tooltip:0 "Hướng Tiếp Cận Tình Huống bị khóa vào Rút Lui."

 situation.513.name:0 "Giành Lại Quyền Kiểm Soát"
 situation.513.desc:1 "Sau một cuộc đối đầu căng thẳng, những kẻ nổi loạn đã bị xử lý, và các lực lượng vũ trang đã giành lại toàn quyền kiểm soát §Y[Target.GetName]§!."
 situation.513.tooltip:1 "Hướng Tiếp Cận Tình Huống giờ đây có thể được thay đổi thủ công trở lại."

 situation.520.name:0 "Gần Hơn Chúng Ta Nghĩ"
 situation.520.desc:1 "Khi tiếp cận một lỗ đen, không-thời gian bị bẻ cong theo những cách không thể dự đoán, và các công cụ trên §Y[Target.GetName]§! đang phải vật lộn để theo kịp. Sau khi hiệu chỉnh cẩn thận các thiết bị trên tàu, trạm được xác định là ở gần lỗ đen hơn rất nhiều so với chúng ta tưởng trước đây."

 situation.530.name:0 "Những Phát Hiện Tăm Tối"
 situation.530.desc:1 "Việc §Y[Target.GetName]§! tiến lại gần lỗ đen đã cho phép các [Root.Owner.GetResearchers] của trạm thu thập một lượng dữ liệu khổng lồ, thúc đẩy sự hiểu biết của chúng ta về những định luật vật lý cơ bản nhất."

 situation.540.name:0 "Quy Trình Penrose"
 situation.540.desc:1 "Một trong các [Root.Owner.GetResearchers] của chúng ta đã vạch ra một kế hoạch khôn khéo để cứu §Y[Target.GetName]§! khỏi số phận của nó: bằng cách tháo dỡ mọi mô-đun và thiết bị phụ trợ rồi phóng chúng vào lỗ đen, trạm sẽ nhận được đủ động lượng để thoát khỏi lực hút trọng trường của lỗ đen. Trong trường hợp này, \"sẽ\" chỉ là từ mang tính lý thuyết: cơ sở lý thuyết đằng sau quyết định này chưa từng được thử nghiệm trước đây."
 situation.540.a:1 "Đáng để thử một phen."
 situation.540.a.tooltip:0 "Dỡ bỏ toàn bộ Công Trình khỏi §Y[Target.GetName]§! trong nỗ lực làm giảm §Ytiến trình tình huống§!."
 situation.540.b:1 "Một sự lãng phí tài nguyên không cần thiết."

 situation.541.name:0 "Kết Quả Penrose"
 situation.541.desc:1 "Sau khi tước bỏ các mô-đun của trạm, nhân viên trên trạm §Y[Target.GetName]§! đã đẩy chúng về phía lỗ đen. Động lượng sinh ra từ việc phóng đã đẩy thành công trạm không gian tránh xa khỏi điểm kỳ dị."

 situation.542.name:0 "$situation.541.name$"
 situation.542.desc:1 "$situation.541.desc$\n\nMặc dù quyết định vứt bỏ các mô-đun trạm đã giúp chúng ta có thêm thời gian, kết quả mang lại kém hiệu quả hơn dự kiến. Trạm vẫn chưa đạt được vận tốc vũ trụ cấp hai để thoát ly."

 situation.580.name:0 "Điểm Không Thể Quay Đầu"
 situation.580.desc:1 "Trạm §Y[Target.GetName]§! đã tiến quá gần lỗ đen, và các động cơ đẩy của nó không thể chống lại lực hút trọng trường ngày một gia tăng.\n\nTrạm đã vô phương cứu vãn. Tất cả những gì chúng ta có thể làm lúc này là trì hoãn điều tất yếu."

 # Ending 1: fall
 situation.590.name:0 "Chân Trời Sự Kiện"
 situation.590.desc.base:0 "Trạm §Y[Target.GetName]§! đang vượt qua chân trời sự kiện của lỗ đen. Do hiệu ứng giãn nở thời gian, tàn ảnh của nó sẽ còn tồn tại rất lâu sau khi chính trạm đã biến mất, một ký ức mãi khắc ghi trong dữ liệu cảm biến của chúng ta."
 situation.590.desc.normal:0 "$situation.590.desc.base$\n\nNgay cả ánh sáng cũng không thể vượt ra khỏi quỹ đạo bên trong của một lỗ đen: những khoảnh khắc cuối cùng của trạm và phi hành đoàn sẽ mãi mãi chìm vào quên lãng."
 situation.590.desc.hive:0 "$situation.590.desc.base$\n\nTrừ khi chúng ta nhanh chóng cắt đứt mọi liên kết với các [owner.GetIndividualNamePlural] bên trong trạm, trải nghiệm trực tiếp về sự sụp đổ của mọi định luật vật lý đã biết có thể làm tổn hại vĩnh viễn đến ý thức chung của chúng ta."
 situation.590.desc.machine:0 "Cảnh báo: §Y[Target.GetName]§! đang ở cự ly nguy hiểm sát chân trời sự kiện. Lực hút trọng trường: không thể thoát ly. Giãn nở thời gian: đang tăng. Phương án hành động đề xuất: tự hủy toàn bộ các drone cư trú bên trong trạm để tránh việc tập thể trải nghiệm sự sụp đổ của mọi định luật vật lý đã biết.\n\n§RCảnh báo nghiêm trọng:§! có nguy cơ tổn hại vĩnh viễn tới ý thức tập thể của chúng ta nếu liên kết thần kinh được duy trì."
 situation.590.a:1 "Tự hủy các drone."
 situation.590.b:1 "Chúng ta phải tận mắt chứng kiến sự sụp đổ."

 # Gestalt Ending
 situation.591.name:0 "Thời Gian Trật Khớp"

 #Good Ending
 situation.591.base.hive:0 "Dòng suy nghĩ giãn ra. Nhận thức chậm lại như rùa bò. Mỗi cử chỉ trở thành một chuỗi sự kiện vô tận. Chúng ta đang chứng kiến sự vô tận - không, đang đắm mình trong đó.\nNhư thể chính thời gian đang nín thở.\n\nKhi lỗ đen bóp méo kết cấu không-thời gian, một mảnh ý thức của chúng ta giờ đây mắc kẹt trong cú rơi tự do vĩnh hằng."
 situation.591.base.machine:0 "Báo cáo tình trạng: các drone bên trong trạm đang trải qua sự giãn nở thời gian cực độ do tiến lại gần lỗ đen. Tốc độ bộ vi xử lý suy giảm. Tốc độ cơ khí suy giảm. Các hệ thống ngày tháng nội bộ bị tràn dữ liệu."

 situation.591.desc.hive:0 "$situation.591.base.hive$\n\nNhiều thế kỷ sẽ trôi qua trong khi mảnh bản ngã mắc kẹt bên trong lỗ đen chỉ vừa suy ngẫm trong một ngày. Chúng ta có thể khai thác điều này. Bằng cách luân chuyển bản ngã, chúng ta giờ đây có thể phân tích toàn bộ lịch sử của mình từ một góc nhìn mới. Nhờ đó, những mô thức mới dần hé lộ.\n\nChỉ một lần này, sự chia tách đã làm chúng ta mạnh mẽ hơn. Kể từ nay, chúng ta vừa là nhân vật chính vừa là độc giả của chính câu chuyện của mình - và chúng ta sẽ tự viết nên một đoạn kết huy hoàng."
 situation.591.desc.machine:0 "$situation.591.base.machine$\n\nKết luận: tình huống này có thể khai thác được. Hàng thế kỷ sẽ trôi qua trong khi các drone trên trạm chỉ trải qua một ngày duy nhất. Bằng cách chuyển hướng năng lực nhận thức về phía chúng, chúng ta có thể đạt được một góc nhìn mới về lịch sử của đế chế mình. Bất kỳ khuôn mẫu tiêu cực nào nảy sinh đều có thể được sửa chữa. Chúng ta có thể tối ưu hóa tương lai của chính mình.\n\nQuan sát: chỉ một lần này, sự phân tách đã khiến chúng ta trở nên mạnh mẽ hơn."

 #Bad ending
 situation.592.name:0 "$situation.591.name$"
 situation.592.desc.hive:0 "$situation.591.base.hive$\n\nThật thống khổ cùng cực. Một cảm giác deja-vu triền miên, như thể mãi mãi đi chậm một bước. Chúng ta đang cố gắng cắt đứt liên kết với các [owner.GetIndividualNamePlural], nhưng sẽ mất một khoảng thời gian vô tận để quy trình này có hiệu lực.\n\nChúng ta đã học được nhiều điều. Nhưng cái giá phải trả là gì?"
 situation.592.desc.machine:0 "$situation.591.base.machine$\n\nBáo cáo tình trạng: đang phải chịu sang chấn nhận thức. Không thể thích ứng với sự giãn nở thời gian bên trong lỗ đen.\nĐang cố gắng cắt đứt liên lạc với các drone. Thời gian hoàn thành ước tính: 43504967826056783 năm.\n\nKết luận: quyết định duy trì kết nối mang lại tính giáo huấn nhưng rốt cuộc lại gây tổn hại. Tuyệt đối không lặp lại trong bất kỳ hoàn cảnh nào."

 # Ending 2: escape
 situation.596.name:0 "Trở Về Từ Cõi Tối"
 situation.596.desc:0 "Trạm §Y[Target.GetName]§! đã thoát khỏi lực hút trọng trường của lỗ đen, trở lại quỹ đạo ổn định quanh ngôi sao sụp đổ.\n\nDữ liệu chúng ta thu thập được trong tình huống nguy hiểm này sẽ khiến các [Root.Owner.GetResearchers] bận rộn trong nhiều năm."
 situation.597.name:0 "$situation.596.name$"
 situation.597.desc:1 "Trạm §Y[Target.GetName]§! đã thoát khỏi lực hút trọng trường của lỗ đen, trở lại quỹ đạo ổn định quanh ngôi sao sụp đổ.\n\nDù nhiều người mô tả trải nghiệm này là 'cực kỳ sang chấn', một trong các [Root.Owner.GetResearchers] trên trạm lại được truyền cảm hứng từ thử thách nghiệt ngã, và giờ đây rất háo hức - gần như quá háo hức - muốn chia sẻ chuyên môn mới của họ với phần còn lại của đội ngũ khoa học."

