l_english:

 ### RESOLUTION COMMENTS - REQUESTS
 ### Request - Militarist
 ethic_militarist_request_friendly:0 "Chúng ta có cùng chí hướng trong chuyện này, phải không?"
 ethic_militarist_request_friendly_0:0 "$GREETER$ yêu cầu sự ủng hộ từ $COUNTRY$."
 ethic_militarist_request_friendly_1:0 "Liệu các bạn có trở thành đồng minh vững chắc của $GREETER$ không?"
 ethic_militarist_request_friendly_2:0 "An ninh của cả hai đế chế chúng ta phụ thuộc vào kết quả của nghị quyết này."
 ethic_militarist_request_friendly_3:0 "$GREETER$ đang trông cậy vào sự ủng hộ của các bạn."
 ethic_militarist_request_friendly_4:0 "Chúng tôi sẽ rất vinh dự nếu những người bạn tại $COUNTRY$ cùng sát cánh với chúng tôi trong việc này."
 ethic_militarist_request_neutral:0 "Sự ủng hộ từ $COUNTRY$ sẽ rất được hoan nghênh."
 ethic_militarist_request_neutral_0:0 "Hãy tham gia cùng chúng tôi — vì danh dự."
 ethic_militarist_request_neutral_1:0 "Sự ủng hộ của các bạn sẽ thể hiện sức mạnh."
 ethic_militarist_request_neutral_2:0 "Đã đến lúc phải hành động dứt khoát. Hãy dành cho chúng tôi sự ủng hộ của các bạn!"
 ethic_militarist_request_neutral_3:0 "Chúng tôi sẽ không làm phiền các bạn bằng những lời ngoại giao sáo rỗng vô nghĩa... giá trị của nghị quyết này tự nó đã quá rõ ràng."
 ethic_militarist_request_neutral_4:0 "Nghị quyết này là lựa chọn đúng đắn không chỉ cho chúng tôi, mà cho toàn thể thiên hà. Hãy ủng hộ nó."
 ethic_militarist_request_hostile:0 "Chúng tôi không trông mong sự ủng hộ của các người trong chuyện này, nhưng những điều kỳ lạ hơn cũng từng xảy ra..."
 ethic_militarist_request_hostile_0:0 "Chúng tôi sẽ không bao giờ hạ mình đi van xin sự ủng hộ. Nhưng nếu các người sẵn lòng trao nó, điều đó sẽ được ghi nhận..."
 ethic_militarist_request_hostile_1:0 "Đây là cơ hội để $COUNTRY$ chứng minh danh dự của mình — hoặc chứng minh các người chẳng có chút danh dự nào."
 ethic_militarist_request_hostile_2:0 "Chỉ có kẻ đại ngu ngốc mới phản đối nghị quyết này."
 ethic_militarist_request_hostile_3:0 "Ngay cả những kẻ ngu xuẩn ở $COUNTRY$ ắt hẳn cũng phải thấy được giá trị của việc thông qua nghị quyết này."
 ethic_militarist_request_hostile_4:0 "Sự khinh miệt của chúng tôi dành cho $COUNTRY$ có thể sẽ giảm bớt phần nào nếu các người ủng hộ nghị quyết này..."



 ### Request - Pacifist
 ethic_pacifist_request_friendly:0 "$GREETER$ mong đợi sự ủng hộ từ những người bạn đáng quý tại $COUNTRY$."
 ethic_pacifist_request_friendly_0:0 "Chúng tôi tin tưởng rằng $COUNTRY$ sẽ hành động đúng đắn."
 ethic_pacifist_request_friendly_1:0 "$GREETER$ hoàn toàn đặt niềm tin vào $COUNTRY$ trong cuộc bỏ phiếu sắp tới."
 ethic_pacifist_request_friendly_2:0 "Chúng ta hãy cùng chung tay làm cho thiên hà này trở nên an toàn hơn."
 ethic_pacifist_request_friendly_3:0 "Xin hãy giúp chúng tôi làm cho những người khác nhận ra sự sáng suốt của nghị quyết này."
 ethic_pacifist_request_friendly_4:0 "Bất kể các bạn bỏ phiếu ra sao, $COUNTRY$ sẽ luôn được coi là người bạn đáng tin cậy của chúng tôi. Nhưng xin hãy bỏ phiếu thuận."
 ethic_pacifist_request_neutral:0 "Chúng tôi xin nhã nhặn đề nghị sự ủng hộ của các bạn trong cuộc bỏ phiếu sắp tới."
 ethic_pacifist_request_neutral_0:0 "Cùng nhau. Có từ nào đẹp đẽ hơn thế nữa không?"
 ethic_pacifist_request_neutral_1:0 "$GREETER$ khiêm nhường khẩn cầu sự ủng hộ của các bạn trong cuộc bỏ phiếu sắp tới."
 ethic_pacifist_request_neutral_2:0 "Chúng tôi tin chắc rằng $COUNTRY$ sẽ nhận ra những giá trị đích thực của đề xuất này."
 ethic_pacifist_request_neutral_3:1 "Với sự trợ giúp của các bạn, chúng ta có thể dẫn dắt [global_event_country.GetGalCommunityOrGalImperium] hướng tới sự chung sống hòa bình."
 ethic_pacifist_request_neutral_4:0 "Hãy ủng hộ nghị quyết của chúng tôi, và cùng nhau, chúng ta sẽ biến chiến tranh cùng mọi khổ đau đi kèm trở thành quá khứ man rợ của thiên hà."
 ethic_pacifist_request_hostile:0 "Hãy làm điều đúng đắn. Dù chỉ một lần này thôi."
 ethic_pacifist_request_hostile_0:0 "Vẫn chưa quá muộn để các người từ bỏ con đường lầm lạc của mình."
 ethic_pacifist_request_hostile_1:0 "Hãy chống lại những bản năng thấp hèn của các người và làm điều đúng đắn dù chỉ một lần."
 ethic_pacifist_request_hostile_2:0 "Việc phản đối nghị quyết này sẽ chỉ chứng minh những dã tâm thâm độc của $COUNTRY$ cho toàn bộ thiên hà thấy."
 ethic_pacifist_request_hostile_3:0 "Chúng tôi sẽ chứng kiến nghị quyết này được thông qua, dù có hay không có sự ủng hộ từ $COUNTRY$!"
 ethic_pacifist_request_hostile_4:0 "Lịch sử sẽ không bao dung cho $COUNTRY$ nếu các người phản đối nghị quyết này."

 ### Request - Authoritarian
 ethic_authoritarian_request_friendly:0 "Các bạn cũng tán thành những giá trị không thể phủ nhận trong nghị quyết của chúng tôi, đúng không?"
 ethic_authoritarian_request_friendly_0:0 "Các triều đại của chúng ta hợp tác với nhau rất ăn ý, phải không nào?"
 ethic_authoritarian_request_friendly_1:0 "$COUNTRY$ đã giành được lòng tin của chúng tôi. Chúng tôi tin chắc quý quốc sẽ đưa ra lựa chọn đúng đắn trong cuộc bỏ phiếu sắp tới."
 ethic_authoritarian_request_friendly_2:0 "Thiên hà này cần sự dẫn dắt kiên định của $GREETER$ và $COUNTRY$. Chúng ta hãy cùng nhau biến nghị quyết này thành hiện thực."
 ethic_authoritarian_request_friendly_3:0 "Mục tiêu của chúng tôi hoàn toàn đồng điệu với $COUNTRY$. Chúng ta hãy mang trật tự trở lại để dẹp tan hỗn loạn đang bao trùm thiên hà."
 ethic_authoritarian_request_friendly_4:0 "Chúng tôi luôn ngưỡng mộ sự lãnh đạo của $COUNTRY$. Chắc chắn quý quốc sẽ nhận ra những lợi ích từ nghị quyết của chúng tôi."
 ethic_authoritarian_request_neutral:0 "Hãy ủng hộ chúng tôi trong việc này. Ngay bây giờ."
 ethic_authoritarian_request_neutral_0:0 "Chúng tôi dẫn dắt. Các người noi theo. Trong chuyện này, cũng như trong mọi việc khác."
 ethic_authoritarian_request_neutral_1:0 "Chống lại trật tự tự nhiên của vạn vật chỉ là một nỗ lực vô ích."
 ethic_authoritarian_request_neutral_2:0 "Vì mục tiêu duy trì trật tự thiên hà, nghị quyết này bắt buộc phải được thông qua."
 ethic_authoritarian_request_neutral_3:0 "Ý nguyện của chúng tôi là ngăn chặn bước trượt chậm chạp của thiên hà vào tình trạng vô chính phủ và hỗn loạn. Nghị quyết này chỉ là một bước trên lộ trình đó."
 ethic_authoritarian_request_neutral_4:0 "Hòa bình và trật tự sẽ sớm được tái lập trên khắp thiên hà. Hãy làm tròn phận sự của mình bằng cách ủng hộ Nghị Quyết 34-X."
 ethic_authoritarian_request_hostile:0 "Các người sẽ phải ủng hộ chúng tôi trong việc này. Không, đây không phải một lời thỉnh cầu thân thiện đâu."
 ethic_authoritarian_request_hostile_0:0 "Hãy chấp nhận thứ bậc tự nhiên của vạn vật và phục tùng sự dẫn dắt của chúng tôi trong việc này."
 ethic_authoritarian_request_hostile_1:0 "Sự ủng hộ của các người trong cuộc bỏ phiếu sắp tới — chúng tôi ra lệnh yêu cầu điều đó."
 ethic_authoritarian_request_hostile_2:0 "Chúng tôi lệnh cho các người phải ủng hộ nghị quyết này."
 ethic_authoritarian_request_hostile_3:1 "$COUNTRY$ là một mầm mống bại hoại trong [global_event_country.GetGalCommunityOrGalImperium]. Đừng gieo rắc nọc độc của các người tới các đặc sứ của những thành viên khác."
 ethic_authoritarian_request_hostile_4:0 "Chống đối là điều không được phép."

 ### Request - Egalitarian
 ethic_egalitarian_request_friendly:0 "Cùng với $COUNTRY$, chúng ta có thể biến điều này thành hiện thực."
 ethic_egalitarian_request_friendly_0:0 "$GREETER$ tin tưởng rằng $COUNTRY$ sẽ ủng hộ chúng tôi trong việc này."
 ethic_egalitarian_request_friendly_1:0 "Chẳng phải đây là một ngày tuyệt vời để cùng nhau đứng lên vì công lý và bình đẳng sao?"
 ethic_egalitarian_request_friendly_2:0 "Các bạn của tôi, chúng ta sẽ cùng nhau mở ra một kỷ nguyên dân chủ mới... nơi mà toàn thể thiên hà sẽ cùng được thụ hưởng."
 ethic_egalitarian_request_friendly_3:0 "Có những thế lực nham hiểm đang hoạt động trong thể chế này không cùng chung lý tưởng với hai quốc gia vĩ đại của chúng ta. Chúng ta phải tương trợ lẫn nhau."
 ethic_egalitarian_request_friendly_4:0 "A, $COUNTRY$! Ít nhất thì sự ủng hộ của các bạn luôn là chỗ dựa đáng tin cậy!"
 ethic_egalitarian_request_neutral:0 "Tại sao các bạn không dùng quyền tự do dân chủ của mình để ủng hộ chúng tôi?"
 ethic_egalitarian_request_neutral_0:0 "Lựa chọn sau cùng là thuộc về các bạn, nhưng xin hãy cân nhắc ủng hộ chúng tôi trong việc này."
 ethic_egalitarian_request_neutral_1:0 "Kính thưa các đồng nghiệp đáng kính tại $COUNTRY$, chúng tôi kêu gọi lương tri công bằng của các bạn."
 ethic_egalitarian_request_neutral_2:0 "Hãy nhớ rằng, bỏ phiếu là nghĩa vụ công dân của các bạn."
 ethic_egalitarian_request_neutral_3:0 "Chúng tôi tha thiết khẩn cầu các bạn ủng hộ nghị quyết này... nó chắc chắn sẽ cải thiện số phận của hàng triệu sinh linh có tri giác."
 ethic_egalitarian_request_neutral_4:0 "Hãy giúp chúng tôi làm cho thiên hà này trở thành một nơi tốt đẹp hơn."
 ethic_egalitarian_request_hostile:0 "Tôi đoán rằng thật ngớ ngẩn khi mong đợi $COUNTRY$ nhận thấy giá trị của sự đoàn kết."
 ethic_egalitarian_request_hostile_0:0 "Hãy ủng hộ chúng tôi trong việc này. Ít nhất thì vẫn chưa quá muộn để tìm thấy tiếng nói chung trong một vài vấn đề."
 ethic_egalitarian_request_hostile_1:0 "Bất chấp những bất đồng, $GREETER$ vẫn chủ động mở lời với $COUNTRY$. Xin hãy đồng hành cùng chúng tôi trong việc này."
 ethic_egalitarian_request_hostile_2:0 "Điều này trọng đại hơn cả $GREETER$ lẫn $COUNTRY$. Chúng ta hãy tạm gác lại những bất đồng."
 ethic_egalitarian_request_hostile_3:0 "Dù các người có nghĩ gì về chúng tôi đi nữa, ủng hộ nghị quyết này là một bước đi đúng đắn."
 ethic_egalitarian_request_hostile_4:0 "Liệu chúng tôi có đánh giá sai về $COUNTRY$ chăng? Liệu các người có phải là một quốc gia tốt hơn chúng tôi nghĩ? Các người sẽ ủng hộ nghị quyết của chúng tôi chứ?"

 ### Request - Xenophile
 ethic_xenophile_request_friendly:0 "Chúng ta hãy cùng sát cánh trong cuộc bỏ phiếu sắp tới và cho toàn thiên hà thấy thế nào là sự đoàn kết!"
 ethic_xenophile_request_friendly_0:0 "$GREETER$ rất mong muốn có được sự ủng hộ của $COUNTRY$ trong vấn đề này."
 ethic_xenophile_request_friendly_1:0 "Thật đáng tiếc nếu một lá phiếu nhỏ nhen lại chia rẽ hai đế chế vĩ đại của chúng ta, phải không nào?"
 ethic_xenophile_request_friendly_2:1 "Những người bạn ơi, thành tựu của chúng ta sẽ không có giới hạn nếu chúng ta hỗ trợ lẫn nhau trong [global_event_country.GetGalCommunityOrGalImperium]."
 ethic_xenophile_request_friendly_3:0 "Chẳng phải quá kỳ diệu sao? Diễn đàn thiên hà này đã chứng minh rằng các loài khác nhau trong thiên hà có thể dựng xây nên những điều vĩ đại khi cùng chung sức làm việc."
 ethic_xenophile_request_friendly_4:0 "Đây là bước tiếp theo trong kế hoạch của chúng tôi nhằm cải thiện thiên hà này cho toàn thể các giống loài có tri giác đang cư ngụ. Hãy dang tay ủng hộ chúng tôi, những người bạn!"
 ethic_xenophile_request_neutral:0 "Xin chào! $GREETER$ khuyến khích các bạn đồng hành cùng chúng tôi trong cuộc bỏ phiếu sắp tới."
 ethic_xenophile_request_neutral_0:0 "Xin chào, người bạn tương lai! Các bạn có muốn ủng hộ chúng tôi trong cuộc bỏ phiếu sắp tới không?"
 ethic_xenophile_request_neutral_1:0 "Đây có thể là sự khởi đầu của một tình bạn đẹp."
 ethic_xenophile_request_neutral_2:0 "Hãy ủng hộ chúng tôi trong việc này, và chúng tôi sẽ chứng minh cho toàn thiên hà thấy giá trị của sự hợp tác."
 ethic_xenophile_request_neutral_3:0 "Liệu $COUNTRY$ có ủng hộ những nỗ lực của chúng tôi nhằm biến thiên hà này thành một nơi tốt đẹp hơn cho tất cả mọi người, bất kể chủng tộc của họ là gì không?"
 ethic_xenophile_request_neutral_4:1 "Không ủng hộ nghị quyết này sẽ đi ngược lại tinh thần của chính những nguyên lý nền tảng mà [global_event_country.GetGalCommunityOrGalImperium] được lập nên."
 ethic_xenophile_request_hostile:0 "$COUNTRY$ không thể nhận ra giá trị của sự hòa hợp sao?"
 ethic_xenophile_request_hostile_0:0 "Ủng hộ nghị quyết này sẽ là bước đi đầu tiên trong việc hàn gắn mối quan hệ giữa hai quốc gia chúng ta."
 ethic_xenophile_request_hostile_1:0 "Dù xảy ra bất cứ chuyện gì, $GREETER$ vẫn muốn mở rộng vòng tay tới $COUNTRY$. Xin hãy ủng hộ chúng tôi trong việc này."
 ethic_xenophile_request_hostile_2:0 "Điều này sẽ mang lại lợi ích cho tất cả chúng ta... ngay cả $COUNTRY$ cũng phải nhìn ra điều đó."
 ethic_xenophile_request_hostile_3:0 "Diễn đàn này lập ra nhằm phá vỡ các rào cản và thúc đẩy sự hợp tác giữa muôn loài cùng sinh sống trong thiên hà."
 ethic_xenophile_request_hostile_4:0 "$COUNTRY$ đang lo sợ điều gì cơ chứ? Dù chỉ một lần, các người không thể nhượng bộ bước tới nửa đường sao?"

 ### Request - Xenophobe
 ethic_xenophobe_request_friendly:0 "Việc chúng ta sát cánh bên nhau khi cần thiết là vì danh dự và lợi ích của cả hai đế chế vĩ đại."
 ethic_xenophobe_request_friendly_0:0 "A, $COUNTRY$! Thật hiếm hoi mới tìm thấy một kẻ đáng được chúng tôi tôn trọng trong cái hố phân ngoại chủng này."
 ethic_xenophobe_request_friendly_1:0 "Chúng tôi chẳng hề thích thú gì khi phải thỉnh cầu sự ủng hộ từ những kẻ ngoại tộc, nhưng $COUNTRY$ được xem là bạn bè."
 ethic_xenophobe_request_friendly_2:0 "Thật khó chịu khi phải hiện diện ở đây giữa lũ dị chủng này, nhưng bất kỳ đại diện nào đến từ $COUNTRY$ đều được xem là bằng hữu."
 ethic_xenophobe_request_friendly_3:0 "Cuối cùng cũng có một kẻ biết điều! Nơi này tràn ngập lũ ngoại chủng ghê tởm nhất có thể tưởng tượng được, nhưng được gặp đại diện của $COUNTRY$ luôn là một điều dễ chịu."
 ethic_xenophobe_request_friendly_4:1 "Chúng ta hãy cùng nhau đưa [global_event_country.GetGalCommunityOrGalImperium] này trở lại đúng quỹ đạo."
 ethic_xenophobe_request_neutral:0 "Chỉ cần ủng hộ chúng tôi trong việc này, rồi chúng tôi sẽ vui vẻ để các người được yên."
 ethic_xenophobe_request_neutral_0:0 "Chúng tôi đề xuất thế này: các người ủng hộ chúng tôi trong cuộc bỏ phiếu sắp tới, và sau đó hãy để chúng tôi yên. Các người có đồng ý không?"
 ethic_xenophobe_request_neutral_1:0 "Bị vây quanh bởi tất cả những... sinh vật này... là một sự căng thẳng tột cùng, nên làm ơn đừng bắt tôi phải van xin sự ủng hộ của các người."
 ethic_xenophobe_request_neutral_2:0 "Chúng ta hãy chờ xem điều tốt đẹp gì có thể nảy sinh từ một nơi như thế này, nơi lũ người ngoài hành tinh tự do trà trộn và lây lan dịch bệnh. Hiện tại, chúng tôi sẽ tận dụng nó hết mức."
