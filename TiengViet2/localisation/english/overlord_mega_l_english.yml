 CAN_CREATE_ORBITAL_STATION_ALREADY_EXISTS_ORBITAL_DEFENCE:1 "Một trạm không gian phòng thủ quỹ đạo đã bay quanh $CLASS$ này rồi"
 CANNOT_BOMBARD_ORBITAL_DEFENCE_PROTECTED:0 "Không thể oanh tạc một hành tinh được trạm không gian phòng thủ quỹ đạo bảo vệ."
 requires_not_hostile_or_primitive:1 "$TRIGGER_FAIL$Không thể xây dựng quanh hành tinh thù địch hoặc của nền văn minh tiền siêu quang tốc."

 tech_quantum_catapult:0 "Máy Phóng Lượng Tử"
 tech_quantum_catapult_desc:1 "§YMáy Phóng Lượng Tử§! sử dụng năng lượng của sao neutron hoặc pulsar để bóp méo kết cấu không gian, dịch chuyển hạm đội đi một khoảng cách cực xa."

 requires_neutron_star_or_pulsar:0 "$TRIGGER_FAIL$Phải được xây dựng quanh một $pc_neutron_star$ hoặc $pc_pulsar$."
 requires_no_existing_quantum_catapult:0 "$TRIGGER_FAIL$Chỉ có thể xây dựng tối đa một Máy Phóng Lượng Tử."
 requires_no_existing_quantum_catapul_two:0 "$TRIGGER_FAIL$Chỉ có thể xây dựng tối đa hai Máy Phóng Lượng Tử."

 quantum_catapult_0_MEGASTRUCTURE_DETAILS:1 "Một thiết bị dùng để tập trung lực hấp dẫn của sao neutron hoặc pulsar nhằm bóp méo không gian, dịch chuyển hạm đội đi khoảng cách rất xa."
 quantum_catapult_0_CONSTRUCTION_INFO_DELAYED:1 "Mỗi lần kích hoạt Máy Phóng Lượng Tử sẽ đưa hạm đội đến một hệ sao §Hnằm ngoài§! điểm đến dự kiến. \"§YBán kính phân tán§!\" này có thể được giảm bớt thông qua các lần nâng cấp sau."

 quantum_catapult_0:0 "Khung $quantum_catapult_3$"
 quantum_catapult_0_DESC:1 "Kho tiếp tế nhỏ gọn này tập trung mọi nhân lực và vật lực, dùng để xây dựng dự án giai đoạn một của thấu kính hội tụ siêu lớn cần thiết cho Máy Phóng Lượng Tử."
 quantum_catapult_1:0 "Mảng đơn $quantum_catapult_3$"
 quantum_catapult_1_DESC:1 "Kết quả mô phỏng cho thấy, ngay cả một thấu kính chỉ cung cấp lực xoắn vừa đủ dùng, miễn là được lắp đặt ở đúng vị trí trên ngôi sao, cũng có thể dẫn luồng năng lượng đủ để sử dụng một đường parabol bán ổn định xuyên qua không gian giữa các vì sao."
 quantum_catapult_2:0 "Thấu kính xoắn kép $quantum_catapult_3$"
 quantum_catapult_2_DESC:1 "Thấu kính xoắn kép được đặt theo thiết kế đối xứng, có thể dùng để cải thiện luồng năng lượng sao được dẫn hướng, đóng vai trò như một phương tiện giao thông."
 quantum_catapult_3:0 "Máy Phóng Lượng Tử"
 quantum_catapult_3_DESC:1 "Các thấu kính xoắn được kết nối dạng lồng đặt quanh một ngôi sao, có thể đảm bảo thông lượng năng lượng tối ưu, bảo đảm năng lượng thu được từ ngôi sao có thể được giải phóng triệt để, dùng làm phương tiện du hành giữa các vì sao."
 quantum_catapult_ruined:0 "$quantum_catapult_3$ bị phá hủy"
 quantum_catapult_ruined_DESC:1 "Mảng thấu kính khổng lồ này dùng để tập trung năng lượng từ ngôi sao mà nó xoay quanh. Nguồn năng lượng mạnh mẽ như vậy đủ để phóng tàu xuyên qua không gian giữa các vì sao — miễn là mảng này được hiệu chỉnh chính xác; nhưng rõ ràng mảng thấu kính này hiện đang cần được sửa chữa."
