l_english:
 orbital_ring_tier_1_MEGASTRUCTURE_DETAILS:0 "§Y$orbital_ring_tier_1$§! là một căn cứ sao hình vành đai bay quanh hành tinh, có thể cung cấp khả năng phòng thủ và nhiều chức năng chuyên biệt khác."
 orbital_ring_tier_1_CONSTRUCTION_INFO_DELAYED:1 "Vành đai Quỹ đạo có thể cung cấp lợi ích phòng thủ cho hành tinh, trên đó có thể xây dựng nhiều mô-đun và công trình căn cứ sao, đồng thời có các mô-đun cư trú hoặc cơ sở sản xuất trên quỹ đạo."
 orbital_ring_tier_1:0 "Vành đai Quỹ đạo"
 orbital_ring_tier_1_DESC:1 "Một căn cứ sao bay quanh hành tinh, cung cấp không gian để lắp đặt mô-đun, công trình và nền tảng phòng thủ."
