 sm_ring_energy_hub:0 "Lưới Nhiệt Ion Hóa Tầng Bình Lưu"
 sm_ring_energy_hub_desc:1 "Các thiết bị này giúp giảm thiểu đáng kể thất thoát năng lượng trong quá trình truyền tải, nâng cao sản lượng điện tổng thể."
 sm_ring_food_hub:0 "Trạm Tối Ưu Hóa Khí Hậu"
 sm_ring_food_hub_desc:1 "Việc giám sát chi tiết các điều kiện khí tượng địa phương có nghĩa là chúng ta có thể tác động đến khí hậu hành tinh ở cấp độ khu vực, tăng sản lượng nông nghiệp."
 sm_ring_minerals_hub:0 "Nhà máy tinh luyện khổng lồ trọng lực thấp"
 sm_ring_minerals_hub_desc:1 "Việc tập trung các cơ sở tinh luyện khoáng sản lên Vành đai Quỹ đạo cho phép áp dụng các công nghệ tăng sản lượng khoáng sản mới."
 sm_ring_consumer_goods_hub:0 "Hệ thống hậu cần quỹ đạo"
 sm_ring_consumer_goods_hub_desc:0 "Hệ thống tự động chuyển các hoạt động hậu cần lên Vành đai Quỹ đạo, cho phép $planet_buildings_factories$ trên hành tinh duy trì hoạt động ở hiệu suất tối đa."
 sm_ring_alloys_hub:0 "Nhà máy xử lý Hợp kim"
 sm_ring_alloys_hub_desc:1 "Hợp kim sản xuất trên mặt đất được xử lý thêm trên quỹ đạo, tạo ra nhiều vật liệu sử dụng được hơn từ các sản phẩm phụ vốn có thể bị lãng phí."
 sm_ring_trade_hub:0 "Trung tâm thương mại siêu khổng lồ"
 sm_ring_trade_hub_desc:1 "Bằng cách chuyển tất cả các cơ sở mua sắm và thương mại lên Vành đai Quỹ đạo, chúng ta có thể thực hiện các hoạt động kinh doanh tốt hơn với hiệu suất cao chưa từng có."
 sm_ring_trade_hub_effect:0 "£amenities£Tiện nghi tạo ra từ mỗi $pop_group_unit$ [trader.GetIcon][trader.GetNamePlural]: §G+100§!"
 sm_ring_bureaucracy_hub:0 "Hệ thống lưu trữ quỹ đạo"
 sm_ring_bureaucracy_hub_desc:1 "Sự hiệu quả và tiến bộ sẽ lại nằm trong tầm tay, các quan chức của chúng ta giờ đây có thể lấy được bất kỳ loại tài liệu văn thư nào cần thiết cho công việc gần như ngay lập tức."
 sm_ring_synapse_hub:0 "Trung Tâm Khớp Thần Kinh"
 sm_ring_synapse_hub_desc:0 "Một số khu vực trên vành đai quỹ đạo đã được cải tạo để tăng cường tín hiệu khớp thần kinh, cải thiện khả năng kiểm soát của chúng ta đối với các drone trên mặt đất."
 sm_ring_synapse_hub_effect:1 "£unity£Đoàn kết tạo ra từ mỗi $pop_group_unit$ £job_synapse_drone£$job_synapse_drone_plural$: §G+1§!"
 sm_ring_maintenance_hub:0 "Hệ thống thả vật tư bảo trì quỹ đạo"
 sm_ring_maintenance_hub_desc:0 "Vật liệu bảo trì được đóng gói sẵn vào các kén thả, mang theo các drone phân phát tương ứng, có thể được thả từ quỹ đạo đến bất cứ nơi nào cần thiết, luôn sẵn sàng khi được gọi."
 sm_ring_maintenance_hub_effect:0 "£amenities£Tiện nghi tạo ra từ mỗi $pop_group_unit$ [maintenance_drone.GetIcon][maintenance_drone.GetNamePlural]: §G+100§!"

 sm_ring_psi_corps:0 "Quân đoàn Ngoại cảm quỹ đạo"
 sm_ring_psi_corps_desc:0 "Một khu vực trên $orbital_ring$ chuyên dùng để rèn luyện $individuals_key$ có năng lực ngoại cảm, giúp Quân đoàn Ngoại cảm luôn giữ cảnh giác đối với hành tinh bên dưới.\n\n§YQuân đoàn Ngoại cảm là $FRIEND_DEFAULT$ đáng tin cậy nhất của bạn, hãy tin tưởng họ.§!\n\n£job_telepath£$job_telepath_plural$ tạo ra £unity£§Y$unity$§!, giảm £crime£§Y$PLANET_CRIME_TITLE$§!, và cung cấp lợi ích năng suất cho toàn bộ hành tinh.\n\n$mod_psionic_pop_bonus_workforce_mult$ được quyết định bởi số lượng công việc £job_telepath£$job_telepath$\n"
 sm_ring_psi_corps_machine_intelligence:0 "$sm_ring_psi_corps$"
 sm_ring_psi_corps_desc_machine_intelligence:0 "Một khu vực trên $orbital_ring$ chuyên dùng để rèn luyện $units_key$ có năng lực ngoại cảm, giúp Quân đoàn Ngoại cảm luôn giữ cảnh giác đối với hành tinh bên dưới.\n\n§YQuân đoàn Ngoại cảm là $FRIEND_GESTALT$ đáng tin cậy nhất của bạn, hãy tin tưởng họ.§!\n\n$job_telepath_drone_effect_desc$\n\n$mod_psionic_pop_bonus_workforce_mult$ được quyết định bởi số lượng công việc £job_telepath£$job_telepath$\n"
 sm_ring_psi_corps_hive_mind:0 "$sm_ring_psi_corps$"
 sm_ring_psi_corps_desc_hive_mind:0 "Một khu vực trên $orbital_ring$ chuyên dùng để rèn luyện $drones_key$ có năng lực ngoại cảm, giúp Quân đoàn Ngoại cảm luôn giữ cảnh giác đối với hành tinh bên dưới.\n\n§YQuân đoàn Ngoại cảm là $FRIEND_GESTALT$ đáng tin cậy nhất của bạn, hãy tin tưởng họ.§!\n\n$job_telepath_drone_effect_desc$\n\n$mod_psionic_pop_bonus_workforce_mult$ được quyết định bởi số lượng công việc £job_telepath£$job_telepath$\n"
 sm_ring_orbital_shield_generator:0 "Máy tạo lá chắn quỹ đạo"
 sm_ring_orbital_shield_generator_desc:0 "Lá chắn tăng cường phòng thủ quỹ đạo cũng sẽ ảnh hưởng đến lá chắn của hành tinh, giúp chúng có khả năng chống chọi với những vũ khí mạnh mẽ hơn."
 sm_ring_galactic_stock_exchange:0 "Sở Giao dịch Chứng khoán quỹ đạo"
 sm_ring_galactic_stock_exchange_desc:0 "$building_galactic_stock_exchange_desc$\n\n$job_merchant_effect_desc$\n"
 sm_ring_embassy_complex:0 "Tổ hợp Đại sứ quán quỹ đạo"
 sm_ring_embassy_complex_desc:0 "Tổ hợp quỹ đạo này nhằm mục đích gieo rắc sự kính sợ cho những người nhìn thấy, khiến họ sẵn lòng đạt được thỏa thuận hơn trong các cuộc đàm phán.\n\nDo phải giao tiếp chặt chẽ với chính phủ, công trình này chỉ có thể được xây dựng trên Vành đai Quỹ đạo ở thủ đô của chúng ta.\n"
 sm_ring_noble_estates:0 "Dinh thự Quý tộc"
 sm_ring_noble_estates_desc:0 "Tận dụng hiệu ứng trọng lực thấp trên quỹ đạo, các tòa nhà tráng lệ được xây dựng để làm nơi sinh sống cho tầng lớp quý tộc địa phương. Một đoạn lớn của vành đai được dành riêng cho họ để phục vụ cho những ý tưởng bất chợt.\n\n$job_noble_effect_desc$\n"
 sm_ring_slave_processing_facility:0 "Cơ sở xử lý Nô lệ quỹ đạo"
 sm_ring_slave_processing_facility_desc:0 "Một cơ sở quỹ đạo dùng để xử lý lao động nô lệ trên hành tinh bên dưới, triệt tiêu mọi mầm mống của ý chí tự do.\n\n$building_slave_processing_slave_army_effect_desc$"

 over.1.name:0 "$quantum_catapult_1$"
 over.1.desc:1 "Giai đoạn một của $quantum_catapult_3$ của chúng ta đã hoàn tất. Các thiết bị thấu kính xoắn chính xác đang nạp năng lượng từ ngôi sao, nguồn năng lượng này có thể được giải phóng một cách mãnh liệt để dịch chuyển tàu đến những khoảng cách cực xa."
 over.5.name:0 "$quantum_catapult_2$"
 over.5.desc:1 "Thiết bị thấu kính xoắn thứ hai của $quantum_catapult_3$ đã được lắp đặt vào vị trí, và được cân bằng với thiết bị thứ nhất. Tầm bắn và độ chính xác đều đã được cải thiện."
 over.10.name:0 "$quantum_catapult_3$ trực tuyến"
 over.10.desc:1 "Việc tinh chỉnh lần cuối cho $quantum_catapult_3$ đã hoàn tất, và nó hiện đã đi vào hoạt động hoàn toàn. Tầm bắn và độ chính xác đã được cải thiện thêm."
 over.10.a:0 "Bay qua khoảng không vô tận!"

 # Encountering Ruined Quantum Catapult
 over.20.name:0 "$quantum_catapult_ruined$"
 over.20.a.desc:0 "Tại hệ sao [quantum_catapult_system.GetName], có một bãi mảnh vỡ khổng lồ bao quanh một pulsar. Phân tích của các nhà khoa học chúng ta cho thấy, phần cấu trúc nguyên vẹn còn sót lại ở khu vực dày đặc nhất bên trong bãi mảnh vỡ dường như đã sử dụng sức mạnh của ngôi sao theo một cách nào đó, có khả năng dịch chuyển vật thể đến một khoảng cách cực xa.\n\nNếu chúng ta nắm được kiến thức về cách sửa chữa cấu trúc khổng lồ, chúng ta sẽ có thể khôi phục lại §Y$quantum_catapult_3$§! này."
 over.20.b.desc:0 "Tại hệ sao [quantum_catapult_system.GetName], có một bãi mảnh vỡ khổng lồ bao quanh một pulsar, với cấu trúc cốt lõi tương tự như thiết kế §Y$quantum_catapult_3$§! của chúng ta. Sau khi sửa chữa triệt để, chúng ta có thể làm cho nó hoạt động trở lại."
 over.20.a:0 "Hãy tưởng tượng viễn cảnh chúng ta sở hữu hai Máy Phóng Lượng Tử!"

 # Quantum Catapult Restored
 over.25.name:0 "Đã sửa chữa $quantum_catapult_3$"
 over.25.a.desc:0 "$over.25.desc$ Chúng ta đã có những hiểu biết hoàn toàn mới về công nghệ của nó, sau vài vòng thử nghiệm, chúng ta tin tưởng rằng có thể sử dụng nó một cách an toàn."
 over.25.desc:0 "$quantum_catapult_ruined$ trong hệ sao [quantum_catapult_system.GetName] đã được sửa chữa đến trạng thái có thể hoạt động, hiện đã có thể dịch chuyển hạm đội của chúng ta vượt qua biển sao."
 #over.25.a:0 "$over.15.a$" #Pointed at an inexistant string. Replaced with EXCELLENT

 # Yuht Hyper Relay Project
 over.50.name:0 "Chỉ số dị thường"
 over.50.desc:0 "Phân tích sâu hơn về dữ liệu thu thập từ hệ sao §Y[yuhtaan.GetName]§! cho thấy sự tồn tại của một mô hình năng lượng tinh vi lẫn trong tiếng ồn nền, bắt nguồn từ tiểu hành tinh [jabbardeeni_cache.GetName]."
 over.50.a:0 "Đến [yuhtaan.GetName] nào!"
 YUHT_JABBARDEENI_CACHE:0 "Tín hiệu năng lượng yếu ớt"
 YUHT_JABBARDEENI_CACHE_DESC:0 "Một đặc điểm năng lượng yếu ớt nhưng lặp đi lặp lại được phát ra từ tiểu hành tinh này mỗi khi có tàu bay qua hệ sao."

 over.60.name:0 "Kho lưu trữ dữ liệu Jabbardeeni"
 over.60.desc:0 "Một trạm gác nhỏ có lịch sử bắt nguồn từ thời kỳ đại chiến Yuht-Jabbardeeni, được người Jabbardeeni xây dựng ngay sau khi chiến tranh bùng nổ để giám sát §Y[yuhtaan.GetName]§!, phòng ngừa người Yuht quay trở lại hệ sao quê hương của họ, và ẩn sâu bên trong tiểu hành tinh này là một kho dữ liệu khổng lồ.\n\nTrong những thế kỷ sau đó, người Jabbardeeni đã cải tạo trạm gác này thành nơi thử nghiệm cho các thí nghiệm mới nhất của họ về du hành siêu quang tốc. Mặc dù hầu hết những dữ liệu này chỉ mang tính lý thuyết, nhưng vẫn có một số có thể mang ra sử dụng."

