 orbital_ring_ruined_DESC:0 "Trạm không gian hình vành đai từng quay quanh hành tinh này đã cung cấp nhiều loại lợi ích hạ tầng và phòng thủ. Sự mục nát và lão hóa đã phá hủy tính toàn vẹn cấu trúc của nó, có giữ lại được chút gì hay không cũng là niềm hy vọng mong manh."
