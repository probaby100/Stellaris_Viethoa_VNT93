 # Hyper Relay Event
 over.100.title:1 "Đã hoàn thành mạng lưới Trạm Tiếp Sóng"
 over.100.a.desc:0 "Công trình đã hoàn tất. Hôm nay, chúng ta tự hào giao nộp bảng thành tích vĩ đại nhất của mình cho thiên hà: mạng lưới Trạm Tiếp Sóng Siêu Không Gian của chúng ta đã được kết nối chặt chẽ với người bạn thân thiết §Y[from.GetName]§!.\n\nCác buổi lễ kỷ niệm hoành tráng đang được tổ chức khắp nơi trên [root.GetName], nhất trí tuyên bố về mạng lưới mới mà cả hai chúng ta đều tự hào. Người ta nói rằng ngay lúc này, chúng ta đã gạt bỏ mọi hiềm khích; buông bỏ mọi sự kiêu ngạo và định kiến. Chúng ta mong muốn được tiếp tục chia sẻ niềm tự hào và hào hùng này trong những ngày tháng sắp tới. Thông qua sự hợp tác thân thiết, chúng ta đã phá vỡ rào cản từng được cho là không thể vượt qua, mở ra một kỷ nguyên mới của tình hữu nghị và sự thịnh vượng chung."
 over.100.b.desc:0 "Hôm nay, chúng ta đã khắc sâu tên mình vào lịch sử huy hoàng vô song của thiên hà. Với việc mạng lưới Trạm Tiếp Sóng Siêu Không Gian của chúng ta được kết nối hoàn toàn với mạng lưới của §Y[from.GetName]§!, công dân của chúng ta hiện có thể đi lại tự do không gặp trở ngại nào đến những hệ sao lân cận đó.\n\nMặt khác, [from.GetAdj] cũng nhiệt liệt đón nhận sức ảnh hưởng của [root.GetAdj] chúng ta. Tin rằng nền văn hóa dùng để tạo nên các hệ sao rực rỡ và huy hoàng của chính chúng ta cũng sẽ mang lại lợi ích cho họ."
 over.100.c.desc:0 "Hôm nay, thêm một trở ngại trong thiên hà đã bị xóa bỏ đối với chúng ta, sự hợp tác của chúng ta với [from.GetName] đã đạt được những thành quả phong phú. Mắt xích cuối cùng trong mạng lưới tiếp sóng siêu không gian liền kề của chúng ta đã trực tuyến, từ nay hai bên có thể dễ dàng đi lại qua biên giới của nhau.\n\nTrải ra trước mắt chúng ta là một hành trình đi vào chốn vô định, bởi vì những cơ hội và thách thức mà cấu trúc này mang lại sẽ là ngang nhau cho cả chúng ta và [from.GetName]. Chúng ta sẽ chờ xem các nước láng giềng nhìn nhận thế nào về biểu tượng của sự tin tưởng lẫn nhau này."
 over.100.a:1 "Đây là một ngày đáng để mọi người tự hào."
 over.100.b:1 "Lợi nhuận không có biên giới!"
 over.100.c:0 "Cứ chờ mà xem."

 edict_relay_network_dummy:0 "Kết nối mạng lưới tiếp sóng"
 edict_relay_network_dummy_desc:0 "mạng lưới tiếp sóng có thể được sử dụng để phục vụ các thuộc địa của chúng ta."
 edict_relay_network_dummy_tooltip:0 "Bổ sung phí bảo trì tài nguyên chiến lược cho Trạm Tiếp Sóng Siêu Không Gian, đổi lại cung cấp các hiệu ứng bổ sung cho các thuộc địa trong cùng một hệ sao."

 edict_relay_network_stability:0 "Kiểm soát Mạng lưới"
 edict_relay_network_stability_desc:0 "mạng lưới tiếp sóng siêu không gian cho phép ý chí của chúng ta được áp đặt lên các thuộc địa một cách hiệu quả hơn."
 relay_network_stability_edict_modifier:0 "$edict_relay_network_stability$"

 edict_relay_network_movement:0 "Di cư qua Mạng lưới"
 edict_relay_network_movement_desc:0 "mạng lưới tiếp sóng siêu không gian có thể thúc đẩy các chuyến bay qua lại, khuyến khích sự di cư dân số trong nước."
 relay_network_movement_edict_modifier:0 "$edict_relay_network_movement$"

 edict_relay_network_amenities:0 "Giải trí qua Mạng lưới"
 edict_relay_network_amenities_desc:0 "mạng lưới tiếp sóng siêu không gian đã được cải tạo để phát sóng các hoạt động giải trí được chính phủ cho phép đến với công chúng."
 relay_network_amenities_edict_modifier:0 "$edict_relay_network_amenities$"
 edict_relay_network_amenities_gestalt:0 "$edict_relay_network_amenities$"
 edict_relay_network_amenities_gestalt_desc:0 "Việc kết nối mạng lưới tiếp sóng siêu không gian với chuỗi hậu cần và tiếp tế của chúng ta có thể cải thiện hiệu quả của các hoạt động bảo trì."
 relay_network_amenities_gestalt_edict_modifier:0 "$edict_relay_network_amenities$"

 RELAY_NETWORK_EFFECTS:0 "§YHiệu ứng mạng lưới Trạm Tiếp Sóng Siêu Không Gian:§!"

