 hyper_relay_DESC:1 "Mặc dù không có tác dụng nếu đứng đơn lẻ, nhưng khi tạo thành một chuỗi, các Trạm Tiếp Sóng Siêu Không Gian có thể cung cấp khả năng di chuyển nhanh chóng giữa các hệ sao liền kề."
 hyper_relay_MEGASTRUCTURE_DETAILS:1 "Mặc dù không có tác dụng nếu đứng đơn lẻ, nhưng khi tạo thành một §Ychuỗi Trạm Tiếp Sóng Siêu Không Gian§!, chúng có thể giảm đáng kể thời gian di chuyển giữa các hệ sao liền kề."
