 FLEETORDER_QUANTUM_CATAPULT_DESC:0 "Phóng hạm đội từ một hệ sao có xây dựng §YMáy Phóng Lượng Tử§!."
 QUANTUM_CATAPULT_PENALTY:1 "Độ chính xác của §YMáy Phóng Lượng Tử§! sẽ giảm ở khoảng cách xa, hạm đội sẽ xuất hiện tại một hệ sao ngẫu nhiên trong bán kính phân tán được chỉ định.\n\nHạm đội được phóng theo cách này sẽ nhận lợi ích tăng [GetQuanticAmbushBonus] §YTốc độ bắn§!, kéo dài trong £time£§Y120 ngày§!."
 QUANTUM_CATAPULT_MAP_TOOLTIP_LEFT_CLICK:0 "§GNhấp chuột trái vào một hệ sao trên bản đồ để chọn làm mục tiêu.§!"
