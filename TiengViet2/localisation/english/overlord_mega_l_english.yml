 MESSAGE_FLEET_ORDER_CATAPULT_WINDUP_COMPLETE_TITLE:0 "Dịch chuyển bằng Máy Phóng Lượng Tử hoàn tất"
 MESSAGE_FLEET_ORDER_CATAPULT_WINDUP_COMPLETE_DESC:1 "Hạm đội $FLEET|Y$ đã hoàn thành dịch chuyển qua Máy Phóng Lượng Tử và đến được $SYSTEM|Y$."

 MESSAGE_FLEET_ORDER_CATAPULT_POTENTIAL_CLOSED_BORDERS_TITLE:1 "Biên giới có thể bị đóng"
 MESSAGE_FLEET_ORDER_CATAPULT_POTENTIAL_CLOSED_BORDERS_DESC:2 "$FLEET|Y$ có khả năng sẽ đi vào lãnh thổ của một đế chế đã đóng cửa biên giới với chúng ta."

 MESSAGE_CAPITALS_CONNECTED_RELAY_NETWORK_TITLE:0 "Thủ đô đã kết nối"
 MESSAGE_CAPITALS_CONNECTED_RELAY_NETWORK_DESC:0 "Chúng ta đã thiết lập được mạng lưới kết nối §YTrạm Tiếp Sóng Siêu Không Gian§! giữa thủ đô của mình và $OTHER|Y$."

 MESSAGE_CAPITALS_DISCONNECTED_RELAY_NETWORK_TITLE:0 "Thủ đô bị ngắt kết nối"
 MESSAGE_CAPITALS_DISCONNECTED_RELAY_NETWORK_DESC:0 "Thủ đô của chúng ta không còn được kết nối với thủ đô của $OTHER|Y$ thông qua mạng lưới §YTrạm Tiếp Sóng Siêu Không Gian§! nữa."

 sm_orbital_ring_habitation:0 "Khu Cư Trú"
 sm_orbital_ring_habitation_desc:1 "Hệ thống thang máy không gian tốc độ cao cho phép hành tinh này mở rộng không gian sống, kho chứa tài nguyên và các cơ sở tinh chế lên quỹ đạo.\n"
 orbital_ring_habitation_districts_maxed_out:2 "§RCác quận do $sm_orbital_ring_habitation$ này cung cấp đang được sử dụng trên [planet.GetName]§!."
