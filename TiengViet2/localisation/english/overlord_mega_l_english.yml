 hyper_relay_ruined_DESC:0 "Cấu trúc đổ nát này từng là một phần của mạng lưới Trạm Tiếp Sóng Siêu Không Gian có thể cung cấp khả năng di chuyển nhanh chóng dọc theo tuyến đường."
