 tech_hyper_relays:0 "Trạm Tiếp Sóng Siêu Không Gian"
 tech_hyper_relays_desc:0 "§YTrạm Tiếp Sóng Siêu Không Gian§! có thể được xây dựng bên ngoài giếng trọng lực của một hệ sao và tạo thành mạng lưới. Nó cho phép di chuyển nhanh chóng giữa các trạm mà không cần phải điều khiển tàu đến cửa vào tuyến siêu không gian tương ứng."
 feature_hyper_relay_construction:0 "Xây dựng Trạm Tiếp Sóng Siêu Không Gian"
 feature_hyper_relay_construction_desc:0 "Xây dựng một §YTrạm Tiếp Sóng Siêu Không Gian§! bên ngoài giếng trọng lực của một hệ sao. $hyper_relay_DESC$"

