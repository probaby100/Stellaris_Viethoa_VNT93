 tech_orbital_ring_tier_1:0 "Vành đai Quỹ đạo"
 tech_orbital_ring_tier_1_desc:0 "Có thể xây dựng một căn cứ sao khổng lồ hình vành đai xung quanh quỹ đạo ổn định của một hành tinh đã được thuộc địa hóa."

