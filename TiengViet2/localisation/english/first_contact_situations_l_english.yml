 preftl.2167.name:0 "Trật Tự Thế Giới Mới"
 preftl.2167.desc:0 "Rao giảng một học thuyết cấp tiến về việc thống nhất hành tinh, một nhà lãnh đạo đầy mị lực đã xuất hiện trên [from.owner.capital_scope.GetName]. Giờ đây, chỉ còn một nhóm phiến quân nhỏ với trang bị thô sơ đứng lên chống lại sự thống trị của phe đa số."
