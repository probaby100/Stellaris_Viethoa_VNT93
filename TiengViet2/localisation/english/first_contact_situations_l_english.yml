 arm_them_tt:0 "Cung cấp vũ khí tiên tiến sẽ làm gia tăng cơ hội thành công thêm một tỷ lệ đáng kể."

 preftl.2170.name:0 "Củng Cố Quyền Lực"
 preftl.2170.desc:0 "Đối với lực lượng phiến quân trên [Target.GetName], tương lai dường như vô cùng ảm đạm: dưới sự lãnh đạo đầy cảm hứng của [Target.Owner.GetRulerName], các lực lượng ủng hộ thống nhất đã giành quyền kiểm soát phần lớn các trung tâm dân cư của hành tinh. Sự thống nhất được thiết lập bằng một bàn tay sắt. Mọi tiếng nói bất đồng đều bị dập tắt nhanh chóng."
 preftl.2170.a:0 "Gia tăng viện trợ cho quân phiến loạn."
 preftl.2170.b:0 "Chúng ta có thể làm nhiều hơn nữa để hỗ trợ lực lượng ủng hộ thống nhất."

 preftl.2175.name:0 "Tội Ác Chiến Tranh"
 preftl.2175.desc:1 "Các trận chiến dữ dội nổ ra trên [Target.GetName], nơi phe ủng hộ thống nhất và quân phiến loạn tiếp tục xâu xé lẫn nhau. Trong cuộc chiến này, không có vũ khí hay chiến thuật nào bị cấm đoán, và tội ác chiến tranh đã được thực hiện bởi cả hai phía."
 preftl.2175.a:0 "Quân phiến loạn lúc này cần sự giúp đỡ của chúng ta hơn bao giờ hết."
 preftl.2175.b:0 "Tăng cường hỗ trợ cho lực lượng ủng hộ thống nhất."

 preftl.2180.name:0 "No Nê và Thỏa Mãn"
 preftl.2180.a.desc:0 "Khi cuộc nội chiến tiếp tục hoành hành trên [Target.GetName], lực lượng ủng hộ thống nhất đang trên bờ vực của chiến thắng.\n\nTuy nhiên, cách xa chiến tuyến, các quan chức địa phương đang tận dụng mọi cơ hội để vơ vét làm giàu cho bản thân. Hiện tại, những lời chỉ trích vẫn bị bóp nghẹt, nhưng sự thối nát tham nhũng đã không thoát khỏi tai mắt của người dân địa phương."
 preftl.2180.b.desc:0 "Trên [Target.GetName], cuộc chiến giữa phe ủng hộ thống nhất và phiến quân đã biến thành một cỗ máy xay thịt giằng co đẫm máu. Với chiến tuyến cố thủ vững chắc, các lãnh chúa địa phương ở cả hai bên đang vơ vét làm giàu thông qua tham nhũng và hối lộ. Điều này sẽ tác động ra sao đến cục diện chiến sự vẫn còn phải chờ xem."
 preftl.2180.a:0 "Kích động sự bất mãn của công chúng."
 preftl.2180.b:0 "Cho điệp viên của chúng ta hợp thức hóa tính chính danh của chế độ."

 preftl.2185.name:0 "Trấn Áp và Tiêu Diệt"
 preftl.2185.a.desc:0 "Sự bất ổn bắt nguồn từ những nhà lãnh đạo địa phương tham nhũng và bất tài trên [Target.GetName] đã thúc đẩy sự ủng hộ của công chúng nghiêng về chính nghĩa của quân phiến loạn.\n\nTại các đô thị lớn trên hành tinh, [Target.Owner.GetRulerName] đã ra lệnh cho quân đội thực hiện hàng loạt cuộc càn quét tàn bạo từng con phố để nhổ cỏ tận gốc lực lượng kháng chiến."
 preftl.2185.b.desc:0 "Các nhà lãnh đạo địa phương ngày càng tham nhũng và bất lực trên [Target.GetName] đã làm suy giảm sự ủng hộ của quần chúng đối với cuộc chiến. Ở cả hai phe, các tướng lĩnh quân đội buộc phải tiến hành các chiến dịch chống nổi dậy để dập tắt các cuộc bất ổn dân sự."
 preftl.2185.a:0 "Tăng cường hỗ trợ hậu cần của chúng ta."

 preftl.2190.name:0 "Ván Cờ Quyền Lực"
 preftl.2190.a.desc:0 "Khắp [Target.GetName], quân phiến loạn đang trên đà thoái lui, và [Target.Owner.GetRulerName] đang ngự trị tối cao.\n\nThế nhưng, ngay cả khi một trật tự thế giới mới đang dần định hình, những rạn nứt đã bắt đầu xuất hiện; các quan chức cấp cao tranh giành quyền lực với các tướng lĩnh thắng trận, và những kẻ cận thần hám lợi lượn lờ trong các hành lang danh vọng.\n\n[Target.Owner.GetRulerName] sắp phải đối mặt với thử thách trên một chiến trường hoàn toàn mới."
 preftl.2190.b.desc:0 "Trước sự thất bại của tất cả các phe phái trong việc giành quyền kiểm soát [Target.GetName], hành tinh đã rơi vào tình cảnh hỗn loạn vô chính phủ. Các lãnh chúa địa phương tranh giành quyền lực, và các phong trào xã hội ngày càng cấp tiến mọc lên như nấm sau mưa. Trong khi hành tinh tiếp tục trải qua cuộc biến động lớn nhất lịch sử, hòa bình vẫn chỉ là một giấc mơ xa vời."
 preftl.2190.a:0 "Bắt đầu trang bị vũ khí cho lực lượng phiến quân."

 preftl.2195.name:0 "Cách Mạng Toàn Diện"
 preftl.2195.a.desc:0 "Lên án sự suy đồi và tham nhũng của những quan chức chóp bu trên hành tinh, người dân trên [Target.GetName] đã đồng lòng đứng lên sát cánh cùng lực lượng phiến quân. Ở khắp mọi thị trấn và làng mạc, ngọn lửa cách mạng đang bùng cháy rực trời."
 preftl.2195.b.desc:0 "Trên [Target.GetName], sự hỗn loạn đang ngự trị.\n\nCác toán quân ô hợp lang thang khắp vùng nông thôn trong cơn tuyệt vọng tìm kiếm thức ăn. Tại thủ đô, [Target.Owner.GetRulerName] vẫn bám víu lấy quyền lực, nhưng quyền uy đã suy kiệt đến mức hầu như không thể vượt ra khỏi cánh cổng hoàng cung.\n\nTrừ khi có một bước ngoặt cấp tiến diễn ra, phe ủng hộ thống nhất dường như đang tiến thẳng đến bờ vực thất bại."
 preftl.2195.a:0 "Bắt đầu trang bị vũ khí cho lực lượng ủng hộ thống nhất."

 preftl.2200.name:0 "Bàn Tay Sắt Của Kẻ Độc Tài"
 preftl.2200.desc:0 "Trong một màn phô diễn chiến lược kinh ngạc, [Target.Owner.GetRulerName] đã đè bẹp hoàn toàn lực lượng kháng chiến trên hành tinh. Các điệp viên ngầm nằm vùng trong hàng ngũ phiến quân đã kích hoạt một cuộc tổng tiến công phối hợp trên quy mô toàn cầu. Trước khi các tướng lĩnh phiến quân kịp hiểu chuyện gì đang xảy ra, các vị trí của họ đã bị tràn ngập.\n\n[Target.GetName] giờ đây là một thế giới thống nhất."
 preftl.2200.a:0 "Nguyện cho những người ngã xuống được đời đời ghi nhớ."

 preftl.2205.name:0 "Năm Khởi Nguyên"
 preftl.2205.a.desc:0 "Trong một bước ngoặt kinh ngạc của thời cuộc, [Target.Owner.GetRulerName] đã bị phế truất.\n\nBằng việc liên minh với nhiều vị tướng cơ hội bên trong chế độ, lực lượng phiến quân đã thành công trong việc phát động một cuộc tấn công phối hợp trên quy mô toàn cầu. Trước khi các chỉ huy phe ủng hộ thống nhất kịp nhận ra chuyện gì đang diễn ra, các căn cứ của họ đã bị đánh chiếm.\n\nBị trói bằng xích và bêu riếu khắp các đường phố thủ đô, [Target.Owner.GetRulerName] đã nhanh chóng bị xử tử. Lực lượng phiến quân chiến thắng đã trao cho các vùng lãnh thổ trên hành tinh quyền tự quyết công việc của mình. Sau bao năm chiến tranh loạn lạc, một nền hòa bình mong manh cuối cùng đã buông màn."
 preftl.2205.b.desc:0 "[Target.Owner.GetRulerName] đã bị phế truất.\n\nBị trói bằng xích và bêu riếu khắp các đường phố thủ đô, cựu lãnh chúa này đã nhanh chóng bị xử tử. Lực lượng phiến quân chiến thắng đã trao cho các vùng lãnh thổ trên hành tinh quyền tự quyết công việc của mình. Sau bao năm chiến tranh loạn lạc, một nền hòa bình mong manh cuối cùng đã buông màn."
 preftl.2205.a:0 "Theo thời gian, có thể họ sẽ thấy nhớ [Target.Owner.GetRulerName]."

 nwo_situation_01:0 "Kẻ Độc Tài Khải Hoàn"
 nwo_situation_01_desc:0 "Sức mạnh mang lại thống nhất; thống nhất mang lại hạnh phúc."
 nwo_situation_02:0 "Những Ngọn Cờ Tự Do"
 nwo_situation_02_desc:0 "Một xã hội đa dạng mang lại hạnh phúc. Hạnh phúc mang lại sự thống nhất."
 nwo_situation_03:0 "Tăng Cường Viện Trợ"
 nwo_situation_03_desc:0 "Những tài nguyên này sẽ đảm bảo một kết cục nhanh chóng và công bằng cho cuộc xung đột."
