 refugees.1.name:0 "Người Tị Nạn [Root.GetSpeciesName] Đã Đến"
 refugees.1.desc.1:0 "Một đoàn tàu vận tải dân sự chở những người tị nạn §Y[Root.GetSpeciesName]§! từ §Y[RefugeeEscapedFrom.GetName]§! đã đến không phận của chúng ta. Họ đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững kẻ bị ruồng bỏ bất hạnh này đã bị chính quyền [RefugeeEscapedFrom.GetSpeciesName] trục xuất thô bạo khỏi quê nhà. Họ đã phải lang bạt từ hệ sao này sang hệ sao khác kể từ đó, trong nỗ lực tuyệt vọng tìm kiếm ngôi nhà mới trước khi những nguồn tiếp tế ít ỏi cuối cùng cạn kiệt."
 refugees.1.desc.2:0 "Một hạm đội tơi tả gồm các tàu dân sự nhỏ chở những người tị nạn §Y[Root.GetSpeciesNamePlural]§! trốn chạy khỏi §Y[RefugeeEscapedFrom.GetName]§! đã đến không phận của chúng ta. Sau khi chúng ta cung cấp lương thực và chăm sóc y tế cho những người bị thương, những người tị nạn đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững người tị nạn rách rưới và sợ hãi này là những người sống sót sau chương trình tận diệt do chính quyền [RefugeeEscapedFrom.GetSpeciesName] thực hiện chống lại giống loài của họ. Họ chỉ thoát ra được nhờ vào nỗ lực của một mạng lưới ngầm được tổ chức vội vã và một vài thuyền trưởng buôn bán giàu lòng trắc ẩn."
 refugees.1.desc.2.b:0 "Một hạm đội tơi tả gồm các tàu dân sự nhỏ chở những người tị nạn §Y[Root.GetSpeciesNamePlural]§! trốn chạy khỏi §Y[RefugeeEscapedFrom.GetName]§! đã đến không phận của chúng ta. Sau khi chúng ta cung cấp lương thực và chăm sóc y tế cho những người bị thương, những người tị nạn đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững người tị nạn rách rưới và sợ hãi này là những người sống sót sau cuộc tấn công khốc liệt do tâm thức [RefugeeEscapedFrom.GetSpeciesAdj] tàn nhẫn tiến hành. Họ chỉ thoát ra được nhờ một vụ đánh cắp táo bạo nhiều tàu vũ trụ đã ngừng hoạt động được cất giữ trong một xưởng hải quân cũ trên hành tinh của họ."
 refugees.1.desc.3:0 "Một hạm đội tơi tả gồm các tàu dân sự nhỏ chở những người tị nạn §Y[Root.GetSpeciesNamePlural]§! trốn chạy khỏi §Y[RefugeeEscapedFrom.GetName]§! đã đến không phận của chúng ta. Sau khi chúng ta cung cấp lương thực và chăm sóc y tế cho những người bị thương, những người tị nạn đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững người tị nạn rách rưới và sợ hãi này đang trốn chạy sự tàn phá của §H[RefugeeEscapedCrisis.GetName]§! trong không phận của [RefugeeEscapedFrom.GetSpeciesName]. Họ chỉ vừa kịp trốn thoát khỏi hành tinh quê nhà §H[RefugeeEscapedPlanet.GetName]§! trước khi cuộc tấn công của [RefugeeEscapedCrisis.GetSpeciesAdj] ập tới, bỏ lại hầu hết tài sản cá nhân trên thế giới đã bị định đoạt số phận."
 refugees.1.a:0 "Họ được chào đón tại đây."

