l_english:

 ####################################
 # Event Chains
 ####################################

 test_chain_title:0 "Bí Ẩn Trên [Root.GetName]"
 test_chain_desc:0 "Một số hiện tượng kỳ lạ đã được phát hiện trên [Root.GetName]."
 test_chain_2_title:0 "Bí Ẩn Trên [Root.GetName]"
 test_chain_2_desc:0 "Một số hiện tượng kỳ lạ đã được phát hiện trên [Root.GetName]."
 test_counter:0 "Bộ đếm thử nghiệm"
 migrating_forests_chain_title:0 "Rừng Di Cư Trên [Root.GetName]"
 migrating_forests_chain_desc:0 "Những khu rừng di cư trên [Root.GetName] đang cản trở sự phát triển của thuộc địa chúng ta. Phải tìm ra giải pháp cho vấn đề này nếu chúng ta muốn phồn vinh trên thế giới này."
 subterranean_civilization_chain_title:1 "Nền Văn Minh [Root.owner.GetSubMantleUpper]"
 subterranean_civilization_chain_desc:0 "Một nền văn minh ngoài hành tinh dưới lòng đất trên [Root.GetName] đang đào đường hầm hướng về thuộc địa của chúng ta trên bề mặt. Số lượng và ý đồ của chúng vẫn là ẩn số đối với chúng ta, và chúng có thể là một mối đe dọa đáng kể."
 abandoned_terraforming_chain_title:0 "Dự Án Địa Cầu Hóa Bị Bỏ Hoang"
 abandoned_terraforming_chain_desc:0 "[Root.GetName] từng được một ai đó địa cầu hóa một phần từ hàng ngàn năm trước, nhưng tiến trình đã bị gián đoạn vì lý do không rõ. Kết quả là một hệ thống khí hậu và sinh quyển cực kỳ bất ổn định. Chúng ta đã xác định được vị trí các thiết bị địa cầu hóa bị bỏ hoang, và phải quyết định nên làm gì với chúng."
 vultaum_chain_title:0 "Tiền Bối - Vultaum"
 vultaum_chain_desc:0 "Chúng ta đã thu hồi được các cổ vật từ Hội Đồng Sao Vultaum. Họ là một nền văn minh ngoài hành tinh từng hoạt động cách đây khoảng 12 triệu năm. Dẫu diện mạo chính xác của họ đã thất lạc trong màn sương thời gian, chúng ta đã suy luận từ tàn tích của họ rằng họ là những sinh vật dạng giun đốt, dài chừng ba đến bốn mét. Họ dường như giao tiếp với nhau chủ yếu thông qua các rung động truyền dọc theo cơ thể phân đốt.\n\nNếu có thể tìm thấy đủ di tích từ nền văn minh của họ, chúng ta có thể xác định chính xác vị trí hệ sao quê nhà của họ."
 vultaum_artifacts:0 "Cổ Vật Vultaum Đã Thu Hồi"
 vultaum_homeworld_chain_title:0 "Hệ Sao Quê Nhà Vultaum"
 vultaum_homeworld_chain_desc:0 "Chúng ta đã phát hiện ra vị trí thất lạc từ lâu của hệ sao quê nhà Vultaum. Một đoàn thám hiểm phải được cử đến đó càng sớm càng tốt, trước khi kẻ khác khám phá ra những bí mật của họ!"
 yuht_chain_title:0 "Tiền Bối - Yuht"
 yuht_chain_desc:0 "Chúng ta đã thu hồi được các cổ vật từ Đế Chế Yuht. Họ là một nền văn minh ngoài hành tinh từng cư ngụ tại một góc của thiên hà cách đây khoảng sáu triệu năm. Về mặt thể chất, loài Yuht là những sinh vật dạng chân khớp rất lớn và dẹt. Một cá thể trưởng thành có thể đạt chiều dài gần một trăm mét, và rõ ràng là cực kỳ hiếm khi có nhiều hơn hai hoặc ba cá thể Yuht cùng du hành trên một con tàu vũ trụ.\n\nNếu chúng ta tìm thấy đủ di tích từ nền văn minh của họ, có thể xác định được vị trí hệ sao quê nhà của họ."
 yuht_artifacts:0 "Cổ Vật Yuht Đã Thu Hồi"
 yuht_homeworld_chain_title:0 "Hệ Sao Quê Nhà Yuht"
 yuht_homeworld_chain_desc:0 "Chúng ta đã phát hiện ra vị trí thất lạc từ lâu của hệ sao quê nhà Yuht. Một đoàn thám hiểm phải được cử đến đó càng sớm càng tốt, trước khi kẻ khác khám phá ra những bí mật của họ!"
 first_league_chain_title:0 "Tiền Bối - Liên Minh Đầu Tiên"
 first_league_chain_desc:0 "Chúng ta đã thu hồi được các cổ vật từ Liên Minh Đầu Tiên (First League). Họ là một liên bang lớn gồm các chủng tộc ngoài hành tinh từng cùng chung sống trong hòa bình tương đối cách đây khoảng hai triệu năm. Biên giới của Liên Minh Đầu Tiên có thể đã mở rộng bao trùm một phần đáng kể của thiên hà trước khi sụp đổ.\n\nNếu chúng ta tìm thấy đủ di tích từ nền văn minh của họ, có thể xác định được vị trí hệ sao thủ đô của họ."
 first_league_artifacts:0 "Cổ Vật Liên Minh Đầu Tiên Đã Thu Hồi"
 first_league_homeworld_chain_title:0 "Hệ Sao Thủ Đô Liên Minh Đầu Tiên"
 first_league_homeworld_chain_desc:0 "Chúng ta đã phát hiện ra vị trí thất lạc từ lâu của hệ sao thủ đô Liên Minh Đầu Tiên, nơi đặt Đại Viện Nguyên Lão của họ. Một đoàn thám hiểm phải được cử đến đó càng sớm càng tốt, trước khi kẻ khác khám phá ra những bí mật của họ!"
 irassian_chain_title:0 "Tiền Bối - Irassian"
 irassian_chain_desc:0 "Chúng ta đã thu hồi được các cổ vật từ Khối Hiệp Ước Irassian. Họ là một thế lực liên sao từng thống trị một phần thiên hà cách đây hơn một triệu năm. Loài Irassian là động vật có vú sáu chi có hệ miễn dịch yếu bất thường, khiến họ đặc biệt dễ bị tổn thương trước các căn bệnh ngoài hành tinh. Một số tài liệu cho rằng người Irassian đã tuyệt chủng bởi Dịch Đậu Mùa Javorian, một trận dịch thảm khốc đã quét qua đế chế của họ.\n\nNếu chúng ta tìm thấy đủ di tích từ nền văn minh của họ, có thể xác định được vị trí hệ sao quê nhà của họ."
 irassian_artifacts:0 "Cổ Vật Irassian Đã Thu Hồi"
 irassian_homeworld_chain_title:0 "Hệ Sao Quê Nhà Irassian"
 irassian_homeworld_chain_desc:0 "Chúng ta đã phát hiện ra vị trí thất lạc từ lâu của hệ sao quê nhà Irassian. Một đoàn thám hiểm phải được cử đến đó càng sớm càng tốt, trước khi kẻ khác khám phá ra những bí mật của họ!"
 cybrex_chain_title:0 "Tiền Bối - Cybrex"
 cybrex_chain_desc:0 "Chúng ta đã thu hồi được các cổ vật từ Cybrex trên [From.GetName]. Họ là một tâm thức máy móc liên kết từng kiểm soát góc thiên hà này khoảng 600.000 năm trước. Nguồn gốc và bản chất chính xác của họ vẫn chìm trong bí ẩn, nhưng được biết họ từng phát động một cuộc thập tự chinh chống lại toàn bộ sự sống hữu cơ có tri giác kéo dài nhiều thế kỷ và cướp đi sinh mạng của hàng nghìn tỷ sinh linh.\n\nNếu chúng ta tìm thấy đủ di tích từ nền văn minh của họ, có thể xác định được vị trí hệ sao quê nhà của họ."
 cybrex_artifacts:0 "Cổ Vật Cybrex Đã Thu Hồi"
 cybrex_homeworld_chain_title:0 "Hệ Sao Quê Nhà Cybrex"
 cybrex_homeworld_chain_desc:0 "Chúng ta đã phát hiện ra vị trí thất lạc từ lâu của hệ sao quê nhà Cybrex. Một đoàn thám hiểm phải được cử đến đó càng sớm càng tốt, trước khi kẻ khác khám phá ra những bí mật của họ!"
 sublight_probes_chain_title:0 "Đầu Dò Thám Hiểm Dưới Vận Tốc Ánh Sáng"
 sublight_probes_chain_desc:0 "Nhiều đầu dò thám hiểm dưới vận tốc ánh sáng đã được phóng từ [Root.Capital.GetName] đến các hệ sao lân cận trước khi chúng ta làm chủ công nghệ du hành FTL. Chúng phải được thu hồi trước khi rơi vào tay kẻ thù."
 probes_recovered:0 "Đầu Dò Đã Thu Hồi"
 survey_habitable_worlds_chain_title:0 "Khảo Sát Thế Giới Có Thể Sinh Sống"
 survey_habitable_worlds_chain_desc:0 "Các nhà sinh học vũ trụ của chúng ta đã thúc giục chúng ta khảo sát bất kỳ thế giới nào có sinh quyển đang hoạt động mà chúng ta bắt gặp. Họ rất háo hức tìm hiểu thêm về các hệ sinh thái ngoài hành tinh đa dạng trên khắp thiên hà."
 habitable_worlds_surveyed:0 "Thế Giới Có Thể Sinh Sống Đã Khảo Sát"
 specimen_procurement_chain_title:0 "Thu Thập Sinh Vật Ngoài Hành Tinh"
 specimen_procurement_chain_desc:0 "Bảo tàng Sinh học Ngoại lai trên [Root.Capital.GetName] đã yêu cầu giúp đỡ trong việc thu thập một số dạng sống ngoài hành tinh quý hiếm đã được xác định trên nhiều thế giới khác nhau."
 specimens_collected:0 "Sinh Vật Đã Thu Thập"
 radical_cult_title:0 "Tà Giáo [radical_cult.GetName]"
 radical_cult_desc:0 "Các thành viên của một giáo phái cực đoan tự xưng là \"[radical_cult.GetName]\" đang tìm cách làm suy yếu chính phủ của chúng ta và lôi kéo dân chúng theo tôn giáo méo mó của chúng. Sau nhiều thế kỷ âm thầm gầy dựng lực lượng trên [Root.Capital.GetName], các thủ lĩnh của chúng nay đã trốn vào vũ trụ để tiếp tục cuộc thập tự chinh chống lại chúng ta."
 survey_home_system_title:0 "Khảo Sát Hệ Sao Quê Nhà"
 survey_home_system_desc:0 "Trước khi mạo hiểm tiến vào phần còn lại của thiên hà, chúng ta nên tiến hành khảo sát toàn diện hệ sao [home_system.GetName]. Sân sau của chính chúng ta tuyệt đối không thể để chưa được khám phá."
 establish_colony_title:0 "Thành Lập Thuộc Địa Đầu Tiên"
 establish_colony_desc:0 "Loài [This.GetSpeciesName] cần phải vươn ra ngoài [This.Capital.GetName] để đảm bảo sự sinh tồn lâu dài. Hãy thành lập thuộc địa đầu tiên của chúng ta và cắm lá cờ của [This.GetName] lên bề mặt của một thế giới ngoài hành tinh."
 first_colony:0 "Thuộc Địa Đầu Tiên Đã Thành Lập"
 asteroid_sighted_chain_title:0 "Phát Hiện Tiểu Hành Tinh"
 asteroid_sighted_chain_desc:0 "Một tiểu hành tinh lớn đã được phát hiện đang trên quỹ đạo va chạm với [Root.GetName]. Nó phải bị phá hủy trước khi va vào bề mặt!"
 asteroid_destroyed:0 "Tiểu Hành Tinh Đã Bị Phá Hủy"
 coming_storm_chain_title:0 "Cơn Bão Đang Tới"
 coming_storm_chain_desc:0 "Một cụm tín hiệu hạ không gian bí ẩn đã được phát hiện trên một vectơ tiếp cận thiên hà của chúng ta. Có vẻ như chúng ta sắp sửa đón tiếp những vị khách lạ..."
 prethoryn_scourge_chain_title:0 "Mối Họa Của Hư Không"
 prethoryn_scourge_chain_desc:0 "Thiên hà của chúng ta đã bị xâm lăng bởi một bầy đàn sinh vật du hành vũ trụ phàm ăn dường như có ý định nuốt chửng mọi sự sống trên đường đi của chúng. Cuộc tàn sát của những kẻ xâm lược Prethoryn này phải bị ngăn chặn trước khi số lượng của chúng áp đảo chúng ta."
 extradimensional_invasion_chain_title:1 "Kẻ Xâm Lược Dị Chiều (The Unbidden)"
 extradimensional_invasion_chain_desc:0 "Một vết rách khổng lồ trong cấu trúc không gian đã xuất hiện trong thiên hà của chúng ta, đóng vai trò như một đường ống dẫn một chiều giữa thực tại của chúng ta và một thực tại khác. Những phi thuyền thanh tao kỳ lạ đang tràn qua cánh cổng không gian này, và chúng dường như hút cạn năng lượng đến mức gây tử vong cho bất kỳ ai không may lọt vào đường đi của chúng."
 star_power_chain_title:0 "Vật Chất Sao Kỳ Lạ"
 star_power_chain_desc:0 "Tìm kiếm các chỉ số bức xạ kỳ lạ."
 hunting_hyacinth_title:0 "Cuộc Tìm Kiếm Tàu Hyacinth"
 hunting_hyacinth_desc:0 "Con tàu Hyacinth, một tàu chị em với tàu cứu thế đã đưa tổ tiên chúng ta đến [Root.Capital.GetName], từng được dự định đi theo chúng ta từ Trái Đất cách đây một thế kỷ. Chúng ta phải tìm hiểu xem chuyện gì đã xảy ra với nó."
 nomads_observation_chain_title:0 "Những Kẻ Du Hành Vũ Trụ Kỳ Lạ"
 nomads_observation_chain_desc:1 "Chúng ta đã phát hiện những người ngoài hành tinh kỳ lạ, những kẻ mà chúng ta không thể thâm nhập đường truyền liên lạc, đã xuất hiện trong biên giới của chúng ta. Vì không thể dịch được ngôn ngữ của họ, chúng ta chỉ có thể chờ xem họ là ai và họ muốn gì."
 shrouded_ship_chain_title:0 "Lạc Lối Giữa Shroud"
 shrouded_ship_chain_desc:0 "Một trong các tàu của chúng ta đã thất lạc trong Chiều Không Gian Shroud."

 ####################################
 # Points of Interest
 ####################################

 hijacked_cult_fleet_poi:0 "Hạm Đội Tà Giáo"
 hijacked_cult_fleet_poi_desc:0 "Các tín đồ tà giáo đã chế tạo được một hạm đội tàu vũ trụ nhỏ tại một cơ sở bí mật trên [Root.Capital.GetName]. Khi bị phát hiện, những kẻ tà đạo đã bỏ trốn trên các con tàu của chúng đến [hijacked_fleet_planet.GetName]. Chúng phải bị tiêu diệt trước khi có thể gây thêm thiệt hại!"
 cultist_search_1_poi:1 "Lục Soát [cultists_1.GetName]"
 cultist_search_1_poi_desc:0 "Chúng ta đã phát hiện các vệt ion từ các tàu tà giáo đang tháo chạy ở vùng phụ cận hệ sao này. Nơi đây cần được trinh sát bằng lực lượng mạnh mẽ."
 cultist_search_2_poi:1 "Lục Soát [cultists_2.GetName]"
 cultist_search_3_poi:1 "Lục Soát [cultists_3.GetName]"
 cultist_shipyard_poi:0 "Phá Hủy Xưởng Đóng Tàu Tà Giáo"
 cultist_shipyard_poi_desc:0 "Cuối cùng chúng ta đã xác định được nguồn gốc của các chiến hạm tà giáo — một loại xưởng đóng tàu ngoài hành tinh cổ xưa mà chúng đã chiếm giữ trong hệ sao [cult_planet.GetStarName]! Công trình không gian này phải bị phá hủy trước khi những kẻ cuồng tín có cơ hội khai mở tiềm năng thực sự của nó."
 cultist_flagship_poi:0 "Tìm Soái Hạm Tà Giáo"
 cultist_flagship_poi_desc:0 "Soái hạm tà giáo thoắt ẩn thoắt hiện được cho là đang lẩn trốn ở đâu đó trong hệ sao này. Chúng ta nên phái một hạm đội vũ trang hạng nặng đến đối đầu với nó."
 probe_search_1_poi:1 "Lục Soát [probe_system_1.GetName]"
 probe_search_1_poi_desc:0 "Dựa trên quỹ đạo bay ra và thời gian kể từ khi nó rời khỏi hệ sao quê nhà, chúng ta nghi ngờ rằng một trong các đầu dò dưới vận tốc ánh sáng bị mất tích của chúng ta có thể được tìm thấy ở đâu đó bên trong hệ sao này."
 probe_search_2_poi:1 "Lục Soát [probe_system_2.GetName]"
 probe_search_3_poi:1 "Lục Soát [probe_system_3.GetName]"
 probe_search_4_poi:1 "Lục Soát [probe_system_4.GetName]"
 probe_ion_trail_poi:0 "Đi Theo Vệt Ion"
 probe_ion_trail_poi_desc:0 "Một vệt ion thuộc về một trong các đầu dò mất tích của chúng ta dẫn đến hệ sao này."
 probe_subspace_anomaly_poi:2 "Bị Cản Trở Bởi Kẻ Thù"
 probe_subspace_anomaly_poi_desc:1 "Kẻ thù ngăn cản chúng ta tiếp cận đầu dò hạ không gian trong hệ sao này."
 coming_storm_poi_1_poi:0 "Điểm Xuyên Thủng"
 coming_storm_poi_1_poi_desc:0 "Xét theo vectơ hiện tại của chúng, chúng ta ước tính rằng khối tín hiệu hạ không gian đang tiếp cận sẽ đi vào thiên hà của chúng ta ở đâu đó trong vùng phụ cận của các hệ sao này."
 systems_visited_poi:0 "Hệ Sao Đã Thăm"
 hunting_hyacinth_poi:0 "Khảo Sát Các Hệ Sao"
 hunting_hyacinth_poi_desc:0 "Chúng ta cần hoàn tất khảo sát các hệ sao này và tìm kiếm dấu hiệu đi qua của tàu Hyacinth. Động cơ thô sơ của con tàu cứu thế có thể đã để lại một vệt ion tàn dư."
 hunting_hyacinth_2_poi:0 "Điều Tra Hệ Sao"
 hunting_hyacinth_2_poi_desc:0 "Vệt ion của tàu Hyacinth đã được lần ra tới hệ sao này. Chúng ta phải điều tra."
 extradimensional_invasion_1_poi:0 "Cổng Chiều Không Gian"
 extradimensional_invasion_1_poi_desc:0 "Cổng không gian mà từ đó những kẻ xâm lăng dị chiều đang tràn ra đã được phát hiện trong hệ sao [extradimensional_system.GetName]. Chúng sẽ có thể liên tục tăng viện quân số cho đến khi cánh cổng bị phá hủy."
 extradimensional_invasion_2_poi:0 "Cổng Thứ Hai"
 extradimensional_invasion_2_poi_desc:0 "Cổng không gian thứ hai đã xuất hiện trong hệ sao [second_portal_system.GetName]. Giống như cổng đầu tiên, nó liên tục đưa các tàu chiến dị chiều thù địch vào thiên hà của chúng ta."
 extradimensional_invasion_3_poi:0 "Cổng Thứ Ba"
 extradimensional_invasion_3_poi_desc:0 "Cổng thứ ba đã được phát hiện trong hệ sao [third_portal_system.GetName]. Ngay lúc này, nó đang tuôn ra những chiến hạm dị chiều thù địch vào cõi tồn tại của chúng ta."
 vultaum_1_poi:0 "Vultaumar"
 vultaum_1_poi_desc:0 "Chúng ta nay đã có tọa độ của hệ sao quê nhà Vultaum."
 yuht_1_poi:0 "Yuhtaan"
 yuht_1_poi_desc:0 "Quê nhà cổ xưa của loài Yuht cuối cùng đã được định vị."
 first_league_1_poi:0 "Fen Habbanis"
 first_league_1_poi_desc:0 "Hệ sao Fen Habbanis từng là trung tâm chính trị, hành chính và kinh tế của Liên Minh Đầu Tiên cổ đại."
 irassian_1_poi:0 "Irass"
 irassian_1_poi_desc:0 "Hệ sao Irass từng là trái tim của Khối Hiệp Ước Irassian cổ đại."
 cybrex_1_poi:0 "Cybrex Alpha"
 cybrex_1_poi_desc:0 "Lực lượng Cybrex dường như đã rút lui về hệ sao này."
 nomad_poi_1:0 "Vị Trí Định Vị"
 nomad_poi_1_desc:1 "Những kẻ du hành vũ trụ kỳ lạ đang ở đây. Mọi nỗ lực liên lạc với họ đều chỉ nhận lại sự im lặng, vì vậy chúng ta chỉ có thể chờ xem điều gì sẽ xảy ra tiếp theo."
 extradimensional_invasion_4_poi:0 "Mỏ Neo Chiều Không Gian"
 extradimensional_invasion_4_poi_desc:0 "Những kẻ xâm lược đang xây dựng một loại trạm không gian lớn đóng vai trò như các \"mỏ neo\" chiều không gian — các đường dẫn gia tăng khả năng di chuyển tàu chiến qua lỗ sâu của chúng. Chúng càng kích hoạt nhiều Mỏ Neo, chúng sẽ càng thường xuyên đưa được quân tăng viện từ cõi của chúng sang.\n\nNhững Mỏ Neo này dường như cũng tăng cường đáng kể tính toàn vẹn hạ không gian của Cổng Chiều Không Gian. Cánh Cổng sẽ hoàn toàn miễn nhiễm trước vũ khí chừng nào còn bất kỳ Mỏ Neo nào đang hoạt động!"
 extradimensional_invasion_chain_2_title:0 "Kẻ Sai Lệch (The Aberrant)"
 extradimensional_invasion_chain_2_desc:0 "Phe xâm lược dị chiều thứ hai đã xuất hiện trong thiên hà của chúng ta, hung hãn không kém phe trước đó. May mắn thay, các thực thể dị chiều dường như cũng đang giao chiến lẫn nhau."
 extradimensional_invasion_chain_3_title:0 "Kẻ Mãnh Liệt (The Vehement)"
 extradimensional_invasion_chain_3_desc:0 "Phe dị chiều thứ ba đã xuất hiện từ một lỗ sâu khác. Dẫu chúng cũng có ý định nuốt chửng mọi sự sống trong thiên hà của chúng ta, chúng dường như đang tham gia vào một cuộc chiến tay ba với các phe phái khác từ chiều không gian của chúng."

