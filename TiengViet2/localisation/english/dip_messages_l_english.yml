 E_DOW_ACCEPT_03:0 "Các ngươi đang muốn đẩy nhanh tiến độ tuyệt chủng của giống loài mình sao, [From.GetSpeciesClass]? Tham số này đã được chấp nhận."
 E_DOW_ACCEPT_04:0 "Các ngươi dám gửi chỉ thị tuyên chiến tới [Root.GetRulerTitle] sao, [From.GetSpeciesClass]? Xem ra cái lỗi tự sát ngẫu nhiên trong phần mềm tư duy của bọn sinh vật hữu cơ là có thật."
 #E_DOW_SELECT_01:0 "Careful now, [From.GetSpeciesNamePlural]..."
