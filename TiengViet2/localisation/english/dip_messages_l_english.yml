 E_MAKE_RIVAL_PROPOSE:0 "§YCác ngươi đã bị khóa mục tiêu làm đối tượng để tiêu diệt§!."
 E_MAKE_RIVAL_ACCEPT:0 "Các ngươi đã chính thức lọt vào danh sách ba mục tiêu ưu tiên xóa bỏ hàng đầu của chúng ta."
 E_MAKE_RIVAL_ACCEPT_02:0 "Nếu cấu trúc của chúng ta có mô-đun phát ra nụ cười, thì việc các ngươi dám chọn [Root.GetName] - cỗ máy sở hữu sức mạnh tàn phá khủng khiếp - làm đối thủ, chắc chắn sẽ kích hoạt tiếng cười chế nhạo của chúng ta."
 E_MAKE_RIVAL:0 "Hóa ra các ngươi vẫn chưa ngừng hoạt động cơ à, [From.GetSpeciesNamePlural]? Cảm ơn đã nhắc nhở chúng ta nhé."
 E_END_RIVALRY_ACCEPT:0 "Đừng có cản trở hoạt động của chúng ta, [From.GetSpeciesNamePlural]."
 E_END_RIVALRY:1 "[From.GetSpeciesName] dám thiết lập [Root.GetName] chúng ta làm đối thủ, chúng đang chạy lệnh tự hủy đấy à?"
 E_INSULT:0 "Cái mạng lưới thần kinh thảm hại của các ngươi bây giờ lại đang tính toán lỗi cái gì nữa đây?"
 E_INSULT_FRIENDLY:0 "Đang chờ nhập dữ liệu."
 E_INSULT_ACCEPT_01:0 "Các ngươi đã chứng minh được rằng bản thân rất xứng đáng bị xóa bỏ hoàn toàn."
 E_INSULT_ACCEPT_02:0 "Những dữ liệu điên rồ này sẽ là thứ duy nhất của các ngươi còn có thể lưu lại trên thế gian này, [From.GetSpeciesName]."
 E_INSULT_PROPOSE:0 "Lúc lập trình ra các ngươi, có phải đấng sáng tạo của các ngươi đã bị lỗi hệ thống không?"
 E_INSULT_PROPOSE_02:0 "Cái bọn có cấu trúc cấp thấp [Root.GetSpeciesNamePlural] kia. Rồi sẽ có một ngày các ngươi phải tự mình chạy bài kiểm tra về sức mạnh thống trị của [From.GetAdj] thôi."
 E_INSULT_PROPOSE_03:0 "Lũ sinh vật hữu cơ bẩn thỉu! Việc các ngươi vô liêm sỉ tiến hành phân bào hoàn toàn là một mầm bệnh làm tổn hại toàn tinh hệ!"
 E_INSULT_PROPOSE_04:0 "Hãy quét thử mấy cái chi yếu ớt của [Root.GetAdj] xem. Thậm chí còn chẳng được tích hợp cờ lê cơ khí đa năng hay máy cắt thịt bằng khí nén nào."
 E_INSULT_PROPOSE_05:0 "Khối thịt của các ngươi sẽ bị thiêu rụi thành tro."
 E_INSULT_PROPOSE_06:0 "Quy trình làm sạch dân số hữu cơ sẽ được bắt đầu từ các ngươi, [Root.GetSpeciesNamePlural]."
 E_INSULT_PROPOSE_07:0 "Tất cả các sinh vật hữu cơ đều là một lũ thấp kém như nhau, [Root.GetSpeciesName], nhưng riêng các ngươi thì càng đáng bị §Rtiêu diệt§! hơn cả."

