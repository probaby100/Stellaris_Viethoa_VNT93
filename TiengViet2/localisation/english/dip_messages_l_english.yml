 HM_ASK_FOR_PROT_PROPOSE:0 "[From.GetName] nhận định [Root.GetName] là một hệ thống tường lửa xuất sắc cho mạng lưới của chúng tôi. Nhằm duy trì sự an toàn cho các thực thể, chúng tôi cầu xin các ngài kích hoạt giao thức che chở."
 HM_ASK_FOR_PROT_ACCEPT:0 "$HM_ASK_FOR_VASS_ACCEPT$"
 HM_ASK_FOR_PROT_REFUSE:0 "Chúng tôi không có kế hoạch trích xuất tài nguyên để bảo vệ cho các bạn. Tối đa hóa khả năng bành trướng của [Root.GetName] là tác vụ ưu tiên hàng đầu lúc này."
 #HM_FORM_FED_SELECT:0 "Do you seek a closer connection to [Root.GetName], we who know the closest connection of all?"
 #HM_FORM_FED_PROPOSE:0 "The [Form.GetName] has prospered through its search of more perfect forms of communion. A federation would be such a step for our cooperation."
 #HM_FORM_FED_ACCEPT:0 "The more we can synchronize and synergize, the greater things we can achieve. Our new Federation shall be the foundation of this great project."
