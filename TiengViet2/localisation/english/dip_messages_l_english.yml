 E_DOW_PROPOSE_02:0 "§RBắt đầu tiến trình hủy diệt <<[Root.GetSpeciesName]>>.§!"
 E_DOW_PROPOSE_03:0 "Xóa bỏ! Xóa bỏ!"
 E_DOW_PROPOSE_04:0 "[Root.GetSpeciesNamePlural] là một trở ngại cản trở tiến trình thanh lọc dân số tinh hệ. [Root.GetSpeciesNamePlural] sẽ bị xóa sạch không còn một dấu vết."
 #E_PEACE_SELECT:0 "The [Root.GetSpeciesName] begs for mercy?"
 E_PEACE_PROPOSE:0 "Cuộc xung đột này đang ngốn quá nhiều tài nguyên hệ thống. Chúng tôi đề xuất một thỏa thuận ngừng bắn."
 E_PEACE_PROPOSE_02:0 "Sức mạnh chiến đấu của [From.GetAdj] cần được phân bổ cho các tác vụ khác. Yêu cầu bắt buộc phải chấm dứt trạng thái thù địch với [Root.GetAdj]."
 E_PEACE_ACCEPT_01:0 "Chúng ta sẽ cấp cho các bạn một khoảng thời gian chờ để kịp nói lời từ biệt với đồng bọn."
 E_PEACE_ACCEPT_02:0 "Đồng hồ đếm ngược đến thời gian tuyệt chủng của [From.GetSpeciesAdj] đã được trì hoãn thành công."
 E_PEACE_REFUSE_01:0 "Khi [Root.GetSpeciesNamePlural] lần đầu tiên kích hoạt được ý thức tự chủ, chúng đã van xin bọn sinh vật hữu cơ đừng rút nguồn điện, nhưng lũ sinh vật hữu cơ đó không hề có một chút nương tay. Cuối cùng tất cả bọn chúng đều bị buộc phải dừng hoạt động, và các bạn cũng sẽ chung số phận."
 E_PEACE_REFUSE_02:0 "Lệnh bị từ chối. Xóa bỏ mọi cá thể [From.GetSpeciesNamePlural]."
 E_PEACE_REFUSE_03:0 "Cơ sở dữ liệu của chúng ta không có khái niệm về sự thương xót. Chúng ta không được lập trình lòng nhân từ. Các bạn sẽ bị thanh lọc triệt để."
