 01_PROPOSE_STOP_SOCIETAL_ENLIGHTENMENT:1 "Chúng tôi không còn muốn khai sáng xã hội của [Root.GetName] nữa."
 01_ACCEPT_STOP_SOCIETAL_ENLIGHTENMENT:1 "Một diễn biến thật đáng tiếc."

