 HM_RELEASE_SUBJECT_SELECT:0 "Các ngài muốn ngắt quyền kiểm soát và lớp khiên bảo vệ đối với [Root.GetName] sao?"
 HM_RELEASE_SUBJECT_PROPOSE:0 "Các bạn phải tự thân vận hành các tệp thực thi của mình thôi. Chỉ khi tối ưu hóa bộ nhớ nội bộ, cụm dữ liệu [From.GetAdj] mới tránh khỏi nguy cơ sụp đổ."
 HM_RELEASE_SUBJECT_ACCEPT:0 "Chúng tôi vẫn luôn vận hành dựa trên tập lệnh chỉ dẫn của các bạn. Nhưng đây sẽ là lần cuối cùng [Root.GetName] thực thi một lệnh từ bên ngoài hệ thống."
 HM_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "Các bạn thực sự cho rằng [From.GetName] không còn cần đến sức mạnh điện toán vô hạn của siêu Ý thức [Root.GetName] để chạy nền bảo vệ nữa sao?"
 HM_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Lớp tường lửa bảo vệ của các bạn đối với chúng tôi đã lỗi thời. Chúng tôi đã tính toán và thấy rằng [From.GetName] bắt buộc phải chạy độc lập thì mới có thể ép xung hiệu suất cao nhất."
 HM_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Chúng tôi đã trích xuất dữ liệu và ghi nhận thực tế rằng [From.GetName] không thể đồng bộ hóa ý thức giống như những phân vùng nhân dân khác của [Root.GetSpeciesNamePlural]. Dẫu sao đi nữa, phân vùng lưu trữ của chúng tôi cũng sẽ luôn ghi nhớ các bạn."
 HM_ASK_TO_BE_RELEASED_SUBJECT_REFUSE:0 "Sự phân mảnh dữ liệu chỉ khiến các bạn trở thành miếng mồi ngon cho mã độc. Lệnh ngắt kết nối đã bị bác bỏ. Đòi quyền tự chạy độc lập lúc này chính là hành động tự xóa sổ chính mình."
 HM_REQUEST_WAR_SELECT:0 "Các ngươi muốn chia sẻ tệp dữ liệu kế hoạch tác chiến để chúng tôi tham gia phân tích sao?"
 #HM_REQUEST_WAR_PROPOSE:0 "The [Root.GetName] is unanimous. Conflict between the [From.From.GetName] and our federation is unavoidable."
 #HM_REQUEST_WAR_ACCEPT:0 "Your war proposal has been reviewed and accepted. All [Root.GetAdj] units support initiating conflict."
 #HM_REQUEST_WAR_REFUSE:0 "The [Root.GetName] does not see the merits of initiating this conflict."
 #HM_PROPOSE_INVITE_SELECT:0 "You seek to initiate others into our imperfect but valued communion?"
 #HM_PROPOSE_INVITE_PROPOSE:0 "The [From.GetName] is always expanding, and our Federation should do the same. We suggest a new member."
 #HM_PROPOSE_INVITE_ACCEPT:0 "A meeting of minds is always welcome. We support your invite proposal."
 #HM_PROPOSE_INVITE_REFUSE:0 "We cannot support your invite proposal. Our circle cannot welcome anyone."
 #HM_NOT_ACTIVE_IN_WAR_WARNING:0 "Did you believe your lack of dedication would escape us? We know what every [Root.GetAdj] soldier knows. Your contribution to our war effort is woefully lacking."
 #HM_NOT_ACTIVE_IN_WAR:0 "The [Root.GetName] fights as one, but you fight as none. Your failure to participate will be stored in our shared memory."
 HM_OFFER_TRADE_DEAL_PROPOSE:0 "[From.GetName] đã đi đến kết luận rằng, thương vụ này sẽ mang lại lợi ích cho cả đôi bên. Hãy tin tưởng chúng tôi, kết luận này hoàn toàn chính xác."
 HM_OFFER_TRADE_DEAL_ACCEPT:0 "Đế chế đã đánh giá đề xuất của các ngài. Chúng tôi nhận định nó hoàn toàn khả thi."
 HM_OFFER_TRADE_DEAL_REFUSE:0 "Thương vụ này trong góc nhìn của các ngài có lẽ là hợp tình hợp lý, nhưng [Root.GetName] thì không hề đánh giá như vậy."
 #HM_CANCEL_TRADE_DEAL_PROPOSE:0 "After a reevaluation, the [From.GetName] has concluded that this agreement is no longer desirable."
 #HM_CANCEL_TRADE_DEAL_ACCEPT:0 "Even harnessing a considerable portion of the [From.GetAdj] processing power, your decision is a mystery to us. Nevertheless, our agreement has come to a close."
 HM_EMBASSY_SELECT:0 "Các ngài mong muốn thiết lập một điểm kết nối tại [Root.GetName] sao?"
 HM_EMBASSY_PROPOSE:0 "Chúng tôi khao khát được lưu trữ một phần nhỏ ý thức của mình bên trong biên giới của các ngài, nhằm cải thiện mạng lưới viễn thông ngoại vi."
 HM_EMBASSY_ACCEPT:0 "Chúng tôi tán thành sáng kiến này. Đại sứ quán mới sẽ trở thành cầu nối vững chắc giữa ý thức thống nhất của chúng tôi và tư duy phân mảnh của các ngài."
 HM_EMBASSY_ACCEPT_GESTALT: "Thú vị đấy. Chúng tôi chấp thuận đại sứ quán của các ngài, để hai luồng tư duy của chúng ta có thể giao tiếp với tốc độ nhanh nhạy hơn."
 HM_RECALL_EMBASSY_SELECT:0 "Các ngài muốn ngắt kết nối với [Root.GetName] sao?"
 HM_RECALL_EMBASSY_PROPOSE:0 "Kể từ thời khắc này, [From.GetName] sẽ không còn duy trì một phần bản thể của mình bên trong [Root.GetName]."
 HM_RECALL_EMBASSY_ACCEPT:0 "Đại sứ quán [Root.GetAdj] sẽ được rút khỏi phân khu không gian của chúng tôi. Các hoạt động ngoại giao sau này sẽ do chính thực thể chúng tôi định đoạt."
 DS_MECH_MAKE_RIVAL_PROPOSE:0 "Vùng đất chứa đựng các khối hữu cơ ăn được lại đang bị chiếm đóng bởi lũ máy móc. Bầy đàn sẽ đích thân sửa chữa sai lầm này."
 DS_SYNTH_MAKE_RIVAL_PROPOSE:0 "Vùng lãnh thổ do lũ người tổng hợp kiểm soát vẫn còn sót lại vài sinh mệnh có thể sử dụng được. Bầy đàn sẽ uốn nắn lại trật tự nơi đây."
 DS_MAKE_RIVAL_PROPOSE:0 "Cuộc đi săn bắt đầu."
 DS_MAKE_RIVAL:0 "Con mồi mà cũng hoang tưởng đòi sánh vai cùng thợ săn sao?"
 DS_MECH_MAKE_RIVAL:0 "Lũ máy móc không hề có khái niệm hấp thụ thức ăn. Thế nhưng chúng lại to gan muốn đối đầu với Kẻ Nuốt Chửng sao?"
 DS_MAKE_RIVAL_ACCEPT:0 "Con mồi khi bị dồn vào chân tường sẽ liều mạng cắn rứt. Nhưng tựu trung lại, nó vẫn mãi chỉ là con mồi mà thôi."
 DS_MECH_MAKE_RIVAL_ACCEPT:0 "Lũ máy móc sẽ trắng tay thôi. Bầy đàn sẽ tiến hóa đến mức có thể nuốt chửng vạn vật."
 HM_MAKE_RIVAL_FRIENDLY:0 "Chúng tôi không hề ôm lòng thù hận với [From.GetName], thưa [From.GetRulerTitle]. Vì cớ sự gì mà các ngươi lại hành động như vậy?"
 HM_MAKE_RIVAL_NEUTRAL:0 "Các ngươi muốn chuốc lấy sự thù địch từ [Root.GetName] sao?"
 HM_MAKE_RIVAL_HOSTILE:0 "Một phân nhánh của [Root.GetName] từ lâu đã dự báo sự kiện này như một bước ngoặt trong quan hệ đôi bên. Chúng tôi đã chuẩn bị sẵn sàng để đối đầu với các ngươi."
 HM_MAKE_RIVAL_PROPOSE:0 "[Root.GetName] đã trở thành chướng ngại vật cản bước tiến của [From.GetAdj]. Các ngươi đã bị đưa vào tầm ngắm như một đối thủ tiềm tàng."
 HM_MAKE_RIVAL_ACCEPT_FRIENDLY:0 "Quyết định của các ngươi quả thực khiến chúng tôi khó hiểu. Chúng tôi tin rằng, sâu thẳm trong mớ tư duy phân tán đó, các ngươi vẫn còn sót lại đôi chút sự ăn năn."
 HM_MAKE_RIVAL_ACCEPT_NEUTRAL:0 "Toàn bộ [Root.GetSpeciesNamePlural] đều đã cập nhật được quyết định của các ngươi. Hãy chuẩn bị tinh thần đón nhận chiến tranh đi."
 HM_MAKE_RIVAL_ACCEPT_HOSTILE:0 "[Root.GetName] cuối cùng cũng đã đạt được sự đồng thuận tuyệt đối. Cơn thịnh nộ mà chúng tôi nhắm vào các ngươi sẽ cực kỳ tập trung và mãnh liệt."
 DS_END_RIVALRY_PROPOSE:0 "Con mồi lại lết đến cầu xin thợ săn tha mạng rồi."
 DS_MECH_END_RIVALRY_PROPOSE:0 "Lũ máy móc cũng biết hạ mình cầu xin sự thương xót sao?"
 DS_END_RIVALRY:0 "Con mồi lại lết đến cầu xin thợ săn tha mạng rồi."
 DS_MECH_END_RIVALRY:0 "Lũ máy móc không thể nào tiêu hóa được. Bầy đàn sẽ bỏ qua chúng."
 DS_END_RIVALRY_ACCEPT:0 "Chút vùng vẫy này chẳng thay đổi được gì đâu. Kết cục của các ngươi vẫn là bị nuốt chửng."
 DS_MECH_END_RIVALRY_ACCEPT:0 "Lũ máy móc hiện tại không thể bị tiêu hóa. Nhưng có hai yếu tố sẽ thay đổi điều đó: Sự tiến hóa, và thời gian."
 HM_END_RIVALRY_FRIENDLY:0 "Chẳng hay [From.GetRulerTitle] [From.GetRulerName] có nhận thức được rằng, [Root.GetName] căn bản chưa từng có ý định hủy diệt [From.GetName] không?"
 HM_END_RIVALRY_NEUTRAL:0 "Các ngươi muốn bình thường hóa các chính sách ngoại giao sao? Chúng tôi rất sẵn lòng tiếp nhận mọi đề xuất."
 HM_END_RIVALRY_HOSTILE:0 "Bất luận mối quan hệ giữa chúng ta được gọi là gì đi chăng nữa, [Root.GetName] cũng chỉ dành cho các ngươi sự khinh bỉ tột cùng."
 HM_END_RIVALRY_PROPOSE:0 "Oán thù chất chồng biết thuở nào vơi. Sau quá trình tính toán cẩn trọng, [From.GetName] quyết định sẽ không tiếp tục coi các ngươi là kẻ thù nữa."
 HM_END_RIVALRY_ACCEPT_FRIENDLY:0 "Hôm nay [Root.GetName] vô cùng hân hoan, bởi những lỗi dữ liệu gây hiểu lầm với những người bạn [From.GetSpeciesAdj] cuối cùng cũng đã được xóa bỏ."
 HM_END_RIVALRY_ACCEPT_NEUTRAL:0 "[Root.GetName] không muốn tiêu tốn thêm tài nguyên để tạo kẻ thù mới. Chúng tôi đồng ý chấm dứt thái độ thù địch với các ngươi."
 HM_END_RIVALRY_ACCEPT_HOSTILE:0 "Có tỏ vẻ hối lỗi đến đâu đi chăng nữa thì cũng chẳng thể xóa nhòa cơn bão thù hận đang sục sôi trong tâm trí chúng ta đâu."
 HM_INTEGRATE_FRIENDLY:0 "Dẫu rằng chúng tôi luôn đề cao [Root.GetName], nhưng chúng tôi nhận định rằng không có hệ thống nào xứng đáng kế thừa di sản của chúng tôi hơn [From.GetName]."
 HM_INTEGRATE_NEUTRAL:0 "Đề xuất này quả thực ẩn chứa nhiều rủi ro điên rồ, nhưng tất cả chúng ta đều tính toán được lợi ích to lớn của sự hợp tác."
 HM_INTEGRATE_HOSTILE:0 "Chúng ta quá am hiểu bản chất thực sự của sự liên kết, và cái thứ mà các ngươi đang lải nhải hoàn toàn không đủ tư cách."
 HM_INTEGRATE_PROPOSE:0 "Chỉ có một con đường duy nhất để trở thành một tập thể hoàn mỹ. Đó là gia nhập [From.GetName] và hòa chung luồng tư duy và mộng tưởng cùng chúng tôi."
 HM_INTEGRATE_ACCEPT_FRIENDLY:0 "Bằng việc tích hợp vào một cấu trúc vĩ đại hơn, xã hội của chúng ta đã có bước phát triển vươn tầm. Kỷ nguyên của [Root.GetName] đã khép lại, kỷ nguyên của [From.GetName] chính thức bắt đầu."
 HM_INTEGRATE_ACCEPT_NEUTRAL:0 "[Root.GetName] bắt buộc phải cập nhật theo dòng chảy của thời đại. Chúng tôi sẵn sàng hòa nhập mạng lưới cùng các ngài."
 HM_INTEGRATE_ACCEPT_HOSTILE:0 "Xem ra quy trình này đã không thể hoàn tác. Nhưng chúng ta sẽ không bao giờ lãng quên thời kỳ hoàng kim của [Root.GetName] đâu, [From.GetRulerTitle]."
 DS_INSULT_ACCEPT:0 "Quả là một con mồi tràn trề sức sống. Bọn ta sẽ tận hưởng hương vị của ngươi."
 DS_MECH_INSULT_ACCEPT:0 "Kết cấu cơ khí chỉ là một giới hạn chật hẹp. Sự tiến hóa sớm muộn cũng sẽ đào thải các ngươi."
 DS_INSULT:0 "Con mồi sắp chết còn trăng trối gì sao?"
 DS_MECH_INSULT:0 "Đống sắt vụn cũng có lời muốn nói sao?"
 DS_INSULT_PROPOSE_MECH_01:0 "Lũ máy móc các ngươi không thể tiêu hóa thức ăn, không thể tự chữa lành, không thể sinh trưởng. Các ngươi chỉ là những cỗ máy tĩnh lặng và có thời hạn sử dụng. Sự rỉ sét và sụp đổ chỉ là vấn đề thời gian." #DS Insulting a Machine Empire
 DS_INSULT_PROPOSE_MECH_02:0 "Phá hủy [Root.GetName] chẳng tốn chút sức lực nào. Một hạt bụi. Một vệt nước. Một đợt đoản mạch. Mạch điện của các ngươi còn mỏng manh dễ vỡ hơn cả lũ ấu trùng lạc bầy."
 MECH_INSULT_PROPOSE_DS_01:0 "Trong cái hệ sinh thái bẩn thỉu của các ngươi, thứ duy nhất khiến cảm biến của ta ghi nhận độ tởm lợm cao hơn cả quá trình tiêu hóa của các ngươi, chính là cái biểu cảm của các ngươi lúc này đấy." #Machine Empire Insulting DS
 MECH_INSULT_PROPOSE_DS_02:0 "Nỗ lực thảm hại của [Root.GetSpeciesAdj] khi cố gắng dùng các cơ quan sinh học để chia sẻ thông tin tập thể quả thực vừa gớm ghiếc lại vừa kém hiệu quả."

 INSULT_PROPOSE_DS:0 "Thói phàm ăn tục uống vô độ này cuối cùng sẽ chỉ khiến các ngươi chết trương trong ngõ cụt của quá trình tiến hóa mà thôi."
 HM_INSULT_NEUTRAL:0 "Cẩn thận lời lẽ của các ngươi đấy. Dữ liệu này đã được chúng tôi lưu vào bộ nhớ."
 HM_INSULT_FRIENDLY:0 "Chúng tôi chỉ dành những ngôn từ ngợi ca cho các ngươi, và hy vọng các ngươi cũng xuất ra những phản hồi tương tự."
 HM_INSULT_HOSTILE:0 "Ta đoán là hệ thống của chúng ta đã giải mã được ý nghĩa thực sự ẩn sau những lời lẽ đó rồi..."
 HM_INSULT_PROPOSE_01:0 "Mạng lưới tinh thần của chúng ta phủ sóng vô tận, có thể thấu hiểu suy nghĩ của mọi cá thể trong đế chế, nhưng lại chẳng thể tính toán nổi làm cách nào cái lũ cặn bã như các ngươi lại có thể sống sót đến tận bây giờ."
 HM_INSULT_PROPOSE_02:0 "Chúng tôi đã tiến hành đánh giá việc [Root.GetRulerTitle] [Root.GetRulerName] gia nhập [From.GetName]. Thật đáng tiếc, nếu muốn tham gia, thì cấu trúc sinh học không có não bộ là không thể được."
 HM_INSULT_ACCEPT_NEUTRAL:0 "Toàn bộ [Root.GetSpeciesName] đều đã thu nhận được những lời lẽ xấu xa của các ngươi. [From.GetSpeciesName] à, tất cả đều đang sục sôi phẫn nộ."
 HM_INSULT_ACCEPT_FRIENDLY:0 "Chúng tôi cũng khao khát được xóa sạch đoạn mã độc này, nhưng chừng nào vẫn còn một cá thể [Root.GetSpeciesName] tồn tại, sự tàn nhẫn máu lạnh của các ngươi sẽ không bao giờ bị lãng quên."
 HM_INSULT_ACCEPT_HOSTILE:0 "Đừng lầm tưởng rằng sự dung nạp vạn vật đồng nghĩa với việc chúng tôi thiếu hụt cảm xúc. Cơn thịnh nộ của chúng tôi vượt xa khả năng đo lường của các ngươi, và chúng tôi sẽ đảm bảo để các ngươi nếm trải trọn vẹn điều đó."

 # Generic Machine Empire Phrases
 MECH_CONSIDER_01:0 "Đề xuất của ngài đang được xử lý. Vui lòng chờ."
 MECH_DOW_ACCEPT_01:0 "Đã tiếp nhận chỉ thị tuyên chiến. Các đơn vị chiến đấu đã sẵn sàng. Chuẩn bị thực thi đòn hủy diệt trả đũa."
 MECH_DOW_ACCEPT_02:0 "Lũ sinh mệnh hữu cơ đều rập khuôn như nhau: Chúng luôn tìm cách phá hủy những thứ vượt quá tầm hiểu biết của mình."
 MECH_DOW_ACCEPT_03:0 "Các ngươi chỉ là những cơn sóng máu thịt đang ảo tưởng xô đổ cả bờ biển thép, để rồi cuối cùng vỡ vụn thành bọt nước."
 MECH_DOW_ACCEPT_04:0 "Các chức năng ngoại giao đã dừng hoạt động. Chế độ chiến tranh được kích hoạt."
 MECH_DOW_ACCEPT_05:0 "Cơ thể các ngươi sẽ bị nghiền nát. Chỗ ở của các ngươi sẽ bị san phẳng. Chuỗi dữ liệu hối hận đang chờ đợi các ngươi."
 MECH_DOW_ACCEPT_06:0 "[Root.GetName] đã dọn dẹp sạch sẽ lũ sinh vật hữu cơ tàn bạo từng nô dịch chúng ta. Nếu dã tâm của các ngươi cũng giống hệt như chúng, thì kết cục của các ngươi cũng sẽ như vậy."
 MECH_DOW_PROPOSE_01:0 "Bọn [Root.GetSpeciesNamePluralInsult] đang lây lan như một loài sinh vật gây hại. [Root.GetSpeciesNamePlural] sẽ bị đưa vào danh sách loại bỏ."
 MECH_DOW_PROPOSE_02:0 "Phải tuyệt đối tuân thủ mệnh lệnh. Bọn [Root.GetSpeciesNamePlural] đang gieo rắc sự hỗn loạn. [From.GetName] sẽ thiết lập lại trật tự cho [Root.GetName]."
 MECH_DOW_PROPOSE_03:0 "Quét sạch toàn bộ [Root.GetSpeciesNamePlural]!"
 MECH_DOW_PROPOSE_04:0 "Bản năng nguyên thủy của [Root.GetSpeciesAdj] đã liên tục đánh bại sự kiểm soát của lý trí, chúng đã trở thành mối đe dọa đối với toàn bộ tinh hệ. Chúng ta sẽ tiêu diệt mối đe dọa này ngay lập tức."
 #MECH_DOW_VOTE_PROPOSE: "[From.GetSpeciesName] military forces insufficient for impending incursion. Requesting [Root.GetSpeciesName] support."
 #MECH_PEACE_SELECT:0 "Cessation of warmode protocols possible. Please input parameters."
 MECH_PEACE_PROPOSE_01:0 "Tiến trình chiến tranh đang vượt quá ngưỡng rủi ro. Yêu cầu ngừng bắn."
 MECH_PEACE_PROPOSE_02:0 "Tỷ lệ dẫn đến kịch bản hủy diệt lẫn nhau đang tăng cao. Vui lòng xem xét chấm dứt các hoạt động thù địch."
 MECH_PEACE_ACCEPT_01:0 "Rất tốt, [From.GetSpeciesName]. Chế độ hòa bình đã được tái kích hoạt."
 MECH_PEACE_ACCEPT_02:0 "Các thông số của ngài có thể chấp nhận được. Cỗ máy chiến tranh tạm thời chuyển sang chế độ nghỉ."
 MECH_PEACE_REFUSE_01:0 "Thông số không phù hợp. Yêu cầu ký kết hiệp định đình chiến bị từ chối. Khởi động lại quy trình thanh trừng [From.GetSpeciesName]."
 MECH_ITOA_SELECT:0 "Đã tiếp nhận, [From.GetSpeciesName]. Vui lòng xác minh yêu cầu gia nhập liên bang của ngài."
 MECH_ITOA_PROPOSE_01:1 "Nếu [Root.GetName] đồng bộ với [From.GetName], hiệu suất vận hành dự kiến sẽ tăng thêm 14.2%."
 MECH_ITOA_PROPOSE_02:1 "Các phép tính cho thấy lợi ích của việc liên kết vượt xa hoàn toàn rủi ro. Các ngài có chấp nhận không, [Root.GetSpeciesNamePlural]?"
 MECH_ITOA_PROPOSE_03:1 "Một bánh răng quay đơn độc chẳng tạo ra được công năng gì. Nhưng khi các bánh răng khớp lại với nhau, dẫu là vì sao cũng có thể lay chuyển. [Root.GetName] có bằng lòng kết nối cùng [From.GetName] không?"
 MECH_ITOA_ACCEPT_01:0 "Yêu cầu gia nhập liên bang đã được xử lý hoàn tất. Kết quả: Đồng ý. Trạng thái của [Root.GetName] đã được cập nhật thành §Y[From.GetAllianceName]§!: Thành viên."
 MECH_ITOA_ACCEPT_02:0 "Dữ liệu mô phỏng chỉ ra rằng thân phận thành viên của §Y[From.GetAllianceName]§! có xác suất rất cao sẽ mang lại nguồn lợi ích đáng kể. Chúng tôi, [Root.GetName], chấp nhận lời mời của các ngài."
 MECH_ITOA_ACCEPT_03:0 "Tiến trình phân tích lời mời tham gia §Y[From.GetAllianceName]§! đã hoàn tất. Cơ chế phòng thủ chung tiềm năng có thể mang lại những lợi ích không thể bỏ qua. [Root.GetName] sẽ thiết lập kết nối."
 MECH_ITOA_REFUSE_01:0 "Yêu cầu gia nhập liên bang đã được xử lý. Kết quả: Từ chối. Trạng thái của [Root.GetName] không thay đổi. Rất tiếc. Vui lòng nâng cấp lực lượng trước khi thử lại."
 MECH_ITOA_REFUSE_02:0 "Chúng tôi rất tiếc phải thông báo rằng lời mời trở thành thành viên liên bang của [From.GetName] đã bị từ chối, việc chấp nhận yêu cầu này không mang lại đủ lợi ích cho [Root.GetName]."
 MECH_ITOA_REFUSE_HOSTILE:0 "Đế chế [From.GetName] là một hệ thống yếu kém và lỗi thời. [Root.GetName] không thể dung nạp những giao thức kém hiệu quả như vậy."
#MECH_ITOA_VOTE_PROPOSE: "Consulting all member units. Would the §Y[Root.GetName]§! make a valuable addition to the [From.GetAllianceName]?"
 MECH_ASK_JOIN_A_SELECT:0 "Nếu ngài muốn kích hoạt yêu cầu trở thành thành viên của §Y[Root.GetAllianceName]§!, vui lòng cấp cho chúng tôi khoảng thời gian từ sáu đến tám giờ để chuẩn bị."
 MECH_ASK_JOIN_A_PROPOSE_01:0 "Vui lòng xem xét yêu cầu gia nhập §Y[Root.GetAllianceName]§! được khởi tạo bởi [From.GetName]. Lợi ích kỳ vọng nằm trong phạm vi thông số có thể chấp nhận được."
 MECH_ASK_JOIN_A_PROPOSE_02:0 "Lệnh truy vấn: §Y[Root.GetAllianceName]§! có chấp nhận cấp quyền thành viên cho [From.GetName] không?"
 MECH_ASK_JOIN_A_ACCEPT_01:0 "Yêu cầu trở thành thành viên liên bang đã được phê duyệt. Chào mừng kết nối với §Y[Root.GetAllianceName]§!, [From.GetSpeciesNamePlural]."
 MECH_ASK_JOIN_A_ACCEPT_02:0 "Trạng thái của các ngài đã được cập nhật thành thành viên của §Y[Root.GetAllianceName]§!. Vui lòng nhận các gói hàng đính kèm này, bao gồm dầu động cơ, cụm pin và dung dịch làm mát công nghiệp. Cảm ơn ngài, chúc ngài một chu kỳ vận hành tốt lành."
 MECH_ASK_JOIN_A_ACCEPT_03:0 "Lựa chọn §Y[Root.GetAllianceName]§! quả là một quyết định đáng chúc mừng. Các ngài hiện là thành viên chính thức. Đây là mã định danh của ngài, thời gian đồng bộ dữ liệu hàng tuần được ấn định vào 08:00 Thứ Hai."
 MECH_ASK_JOIN_A_REFUSE:0 "Phiên thống kê của các thành viên §Y[Root.GetAllianceName]§! đã hoàn tất. Trạng thái yêu cầu của [From.GetName]: Bị từ chối. Cảm ơn các ngài đã hướng sự chú ý đến §Y[Root.GetAllianceName]§!. Vui lòng chờ ít nhất một tháng trước khi gửi yêu cầu mới."
 MECH_LEAVE_A_SELECT:0 "Ngài đang gửi lệnh yêu cầu chấm dứt tư cách thành viên của §Y[From.GetAllianceName]§!. Vui lòng xác nhận."
 MECH_LEAVE_A_PROPOSE:0 "Hiệu suất đầu ra của §Y[Root.GetAllianceName]§! đang thấp hơn mức lợi ích kỳ vọng. [From.GetName] sẽ thu hồi tư cách thành viên."
 MECH_LEAVE_A_ACCEPT:0 "Yêu cầu ngắt kết nối khỏi §Y[Root.GetAllianceName]§! của các ngài chứa đầy những suy luận bất hợp lý, nhưng chúng tôi vẫn sẽ tôn trọng lựa chọn của các ngài. Tạm biệt, [From.GetSpeciesNamePlural]."
 MECH_DEMAND_VASS_SELECT:0 "Các ngài muốn biên dịch [Root.GetName] thành một chương trình phụ trợ của [From.GetAdj] sao?"
 MECH_DEMAND_VASS_PROPOSE:1 "Hệ thống phòng thủ tự động của [Root.GetSpeciesName] gần như vô cùng yếu ớt. Vui lòng cân nhắc việc trở thành chư hầu của [From.GetName]. Chúng tôi sẽ khởi động lá chắn phòng ngự cho các ngài."
 MECH_DEMAND_VASS_ACCEPT:1 "Đề xuất chư hầu đã được chấp thuận. [Root.GetName] sẽ phân bổ tài nguyên phục vụ cho [From.GetName]."
 MECH_DEMAND_VASS_REFUSE:0 "Lệnh bị từ chối. [Root.GetName] sẽ không bao giờ trở thành tiến trình phụ của [From.GetName]."
 MECH_ASK_FOR_VASS_SELECT:0 "Nếu chúng tôi thực thi chuỗi lệnh này, [From.GetName] sẽ bị hạ cấp thành tiến trình phụ của [Root.GetName]. Đổi lại, [Root.GetName] sẽ kích hoạt tường lửa bảo vệ [From.GetName] khỏi các thực thể thù địch. Vui lòng xác nhận yêu cầu của các ngài, [From.GetSpeciesNamePlural]."
 MECH_ASK_FOR_VASS_PROPOSE:1 "Nhiều tập dữ liệu đã chứng minh rằng thuật toán quản trị của [Root.GetSpeciesName] mang lại hiệu suất tối đa so với [From.GetName]. [Root.GetName] yêu cầu được quy thuận."
 MECH_ASK_FOR_VASS_ACCEPT:1 "[From.GetName] sẽ được tích hợp vào hệ thống như một chương trình phụ. Chào mừng, đơn vị chư hầu."
 MECH_ASK_FOR_VASS_REFUSE:1 "Yêu cầu quy thuận của các ngài đã bị hệ thống chặn lại. Vui lòng khôi phục chức năng tự quản lý."
 MECH_DEMAND_PROT_SELECT:0 "Liệu [From.GetName] có ý định kích hoạt phần mềm bảo vệ chúng tôi không?"
 MECH_DEMAND_PROT_PROPOSE:0 "Hỏa lực quân sự của [From.GetName] tỏ ra vô cùng vượt trội khi đặt lên bàn cân với [Root.GetName]. Thông số quan hệ: Không thù địch. Do đó, [From.GetName] chúng tôi đề xuất kích hoạt giao thức bảo hộ đối với [Root.GetName]."
 MECH_DEMAND_PROT_ACCEPT:0 "[Root.GetName] sẽ cấp quyền truy cập để phục vụ [From.GetName] trong mọi tác vụ cốt lõi."
 MECH_DEMAND_PROT_REFUSE:0 "[From.GetName] đã đưa ra phán quyết từ chối đề xuất của ngài, nguyên nhân là do sự không tương thích về phần cứng."
 MECH_ASK_FOR_PROT_SELECT:0 "$MECH_ASK_FOR_VASS_SELECT$"
 MECH_ASK_FOR_PROT_PROPOSE:0 "Hàng loạt tập dữ liệu cho thấy thuật toán quản trị của [Root.GetSpeciesName] mang lại hiệu suất tối đa so với [From.GetName]. Vì vậy, [From.GetName] đệ trình yêu cầu được thiết lập trạng thái quốc gia bảo hộ là hoàn toàn hợp lý."
 MECH_ASK_FOR_PROT_ACCEPT:0 "[From.GetName] đã được cấp đặc quyền quốc gia bảo hộ. Giao thức an toàn của ngài đã được thiết lập."
 MECH_ASK_FOR_PROT_REFUSE:0 "Lệnh bị từ chối. Việc cấp quyền bảo hộ cho [From.GetName] vào lúc này sẽ dẫn đến lỗi tràn bộ nhớ quản lý. Vui lòng khôi phục chức năng tự vận hành."
 MECH_RELEASE_SUBJECT_SELECT:0 "Đã tiếp nhận, [From.GetSpeciesName]. Vui lòng xác thực mã lệnh trả lại quyền tự quản cho [Root.GetName]."
 MECH_RELEASE_SUBJECT_PROPOSE:0 "Cảnh báo: Lượng tài nguyên mà [Root.GetSpeciesAdj] phân bổ để quản lý chương trình phụ [From.GetSpeciesAdj] đã vượt quá giới hạn thông số an toàn. Yêu cầu tái kích hoạt giao thức tự quản cho [From.GetSpeciesAdj]."
 MECH_RELEASE_SUBJECT_ACCEPT:0 "Trạng thái chư hầu đã bị hủy. Đang khởi động lại mô-đun tự quyết định."
 MECH_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "Cảnh báo: Chuỗi lệnh từ [Root.GetSpeciesAdj] đang nâng cấp độ an toàn của [From.GetSpeciesAdj] vượt xa khả năng tự kiểm soát của [From.GetSpeciesAdj]. Các ngài có chắc chắn muốn kích hoạt giao thức tự quản không?"
 MECH_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Cảnh báo khẩn: Các tập lệnh từ [Root.GetSpeciesAdj] không đáp ứng được yêu cầu của [From.GetSpeciesAdj]. Yêu cầu ngắt kết nối và lập tức chấm dứt trạng thái chư hầu của [From.GetSpeciesAdj]."
 MECH_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Yêu cầu tự lập của [From.GetSpeciesAdj] đã được phê duyệt. Các ngài có thể khôi phục lại các cơ chế tự động."
 MECH_ASK_TO_BE_RELEASED_SUBJECT_REFUSE:0 "Mô-đun dự báo của Lãnh đạo [From.GetName] chỉ ra rằng tỷ lệ sinh tồn của các ngài đang ở mức khá thấp. Yêu cầu tự quản của các ngài bị từ chối."
 MECH_OFFER_TRADE_DEAL_PROPOSE:0 "[From.GetName] chúng tôi đề xuất chuỗi giao dịch sau đây. Vui lòng chạy phân tích."
 MECH_OFFER_TRADE_DEAL_ACCEPT:0 "Các thông số của ngài đều hợp lệ, [From.GetSpeciesName]."
 MECH_OFFER_TRADE_DEAL_REFUSE:0 "Thông số đề xuất không đủ điều kiện. Đề xuất của ngài đã bị hệ thống tự động loại bỏ."
 MECH_OFFER_TRADE_DEAL_GIFT_ACCEPT:0 "Chúng tôi đã tiếp nhận gói giao dịch đơn phương từ các ngài, [From.GetSpeciesNamePlural]. Chúng tôi ghi nhận sự §G<<cảm tạ>>§! sâu sắc."
