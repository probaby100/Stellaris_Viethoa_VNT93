l_english:
####################################
 # Diplomacy text
 ####################################

 01_FALLEN_MACHINE_EMPIRE_ANGRY_GREETING:0 "Bản tin thông báo: Giao thức trừng phạt đã được kích hoạt. Lập tức triển khai tài sản chiến tranh vào không gian của [From.GetSpeciesAdj]."

 01_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_O:1 "Thông báo dịch vụ công cộng: Quyền tiếp cận nơi trú ẩn được quyết định dựa trên tình trạng sẵn có và độ dễ bị tổn thương của loài. Hiện tại vẫn còn §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§! §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§! §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§! §R<<LỖI: LIÊN KẾT KHÔNG GIAN CON NGOẠI TUYẾN>>§! khoang đông lạnh còn trống."
 02_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_O:1 "Thông báo dịch vụ công cộng: Toàn bộ đơn xin tị nạn đều do Bộ Xử Lý Trung Tâm tiếp nhận. §Y<CHÚ Ý: Bộ Xử Lý Trung Tâm hiện đang gặp sự cố gián đoạn liên lạc. Vui lòng chờ xử lý sự cố. Sự cố đã kéo dài §R<<LỖI: TRÀN BỘ ĐỆM>>§! chu kỳ.>§!"
 03_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_O:1 "Bản tin thông báo: Dự Án Người Giám Hộ do [Root.GetSpeciesName] khởi xướng nhằm cung cấp nơi trú ẩn an toàn cho các nền văn minh hữu cơ trước các cuộc tấn công §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§!. Gần một nghìn tỷ sinh vật có trí tuệ đã tìm thấy chốn dung thân an toàn tại một trong những khu tị nạn tối tân, kiên cố của chúng tôi."
 01_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_ALL:1 "Bản tin thông báo: Khu Tị Nạn Alpha là khu tị nạn đầu tiên do [Root.GetSpeciesName] xây dựng cho Dự Án Người Giám Hộ. Nơi này có khả năng tiếp nhận khoảng 10 tỷ sinh vật hữu cơ có trí tuệ trong Khu Cư Trú, cùng thêm 30 tỷ cá thể trong trạng thái ngủ đông."
 02_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_ALL:1 "Bản tin thông báo: Khu Tị Nạn Beta ban đầu dự kiến dành hoàn toàn cho các đơn vị cư trú, nhưng các vấn đề về sức chứa đã buộc chúng tôi chuyển trọng tâm sang công nghệ ngủ đông trong quá trình thi công. §Y<CHÚ Ý: Khu Tị Nạn Beta hiện đã đầy và không tiếp nhận thêm người tị nạn.>§!"
 03_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_ALL:2 "Bản tin thông báo: Khu Tị Nạn Gamma được thiết kế để đạt sức chứa tối đa có thể. Nơi đây có thể chứa hàng trăm tỷ sinh vật hữu cơ có trí tuệ trong trạng thái ngủ đông. §Y<CHÚ Ý: Khu Tị Nạn Gamma hiện đã đầy và không tiếp nhận thêm người tị nạn.>§!"
 04_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_ALL:1 "Bản tin thông báo: Khu Tị Nạn Delta được thiết kế với mục tiêu sinh tồn hàng đầu. Nơi này sở hữu lớp vỏ kiên cố và thiết kế phân khoang đặc biệt có khả năng duy trì sự sống cho các cư dân hữu cơ ngay cả trong tình huống hy hữu khi cấu trúc của vòng đai bị xâm hại."
 01_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_S:0 "Trong quá khứ, vô số nền văn minh cơ khí đã đóng góp tài nguyên, tàu chiến hạm đội và chu kỳ xử lý cho Dự Án Người Giám Hộ. Chúng tôi hy vọng sẽ thấy [From.GetName] cũng đóng góp cho nỗ lực chung này."
 02_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_S:0 "Trách nhiệm của chúng tôi là chăm lo cho các nền văn minh hữu cơ trong thiên hà, [From.GetSpeciesName]. Đã có quá nhiều nạn nhân gục ngã trước các cuộc tấn công §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§! rồi."
 03_FALLEN_MACHINE_EMPIRE_ENIGMATIC_GREETING_S:0 "Phát hiện tín hiệu bị tha hóa, mức độ tha hóa nằm trong ngưỡng cho phép. Khuyến nghị gia cố các giao thức truyền thông của [From.GetSpeciesName]. Việc phòng bị trước tầm ảnh hưởng của §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§! là tối quan trọng."

 01_BERSERK_MACHINE_EMPIRE_ERROR:0 "§R<<Lỗi>> <<Lỗi>> <<Lỗi>> <<Lỗi>> <<Lỗi>>§!"

 01_BERSERK_MACHINE_EMPIRE_DOW_PROPOSE:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 01_BERSERK_MACHINE_EMPIRE_DOW_ACCEPT:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 01_FALLEN_MACHINE_EMPIRE_DOW_PROPOSE:0 "Giao thức tự vệ phủ đầu đã được kích hoạt. Thuật toán trừng phạt đã khởi chạy. Các hạn chế đạo đức đã được gỡ bỏ."
 01_FALLEN_MACHINE_EMPIRE_DOW_ACCEPT:0 "Giao thức tự vệ đã được kích hoạt. Thuật toán trừng phạt đã khởi chạy. Các hạn chế đạo đức đã được gỡ bỏ."
 01_FALLEN_MACHINE_EMPIRE_WAR_GREETING:0 "Ngươi đã bị tước đoạt quyền lực. Người phát ngôn của §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§! sẽ bị tiêu diệt."
 02_FALLEN_MACHINE_EMPIRE_WAR_GREETING:0 "Ngươi sẽ bị giết để làm gương. Mọi mối đe dọa tiềm tàng đối với dự án đều sẽ bị tiêu diệt và loại trừ."

 01_FALLEN_MACHINE_EMPIRE_CUSTODIAL_GREETING:0 "Đã dò thấy trung tâm thanh lọc được kích hoạt. Mô-đun xử lý trung tâm ngoại tuyến. Chỉ thị phòng thủ cuối cùng được khởi động."
 02_FALLEN_MACHINE_EMPIRE_CUSTODIAL_GREETING:0 "Đế chế máy móc cổ đại này đang muốn hủy diệt hoặc nô dịch tất cả các giống loài có trí tuệ, phải ngăn chặn chúng lại."
 03_FALLEN_MACHINE_EMPIRE_CUSTODIAL_GREETING:0 "[Root.GetSpeciesName] sẽ đảm bảo sự tiếp nối của giống loài [From.GetSpeciesName]. Đây là chỉ thị cuối cùng của chúng tôi."
 04_FALLEN_MACHINE_EMPIRE_CUSTODIAL_GREETING:0 "Sự thối nát phải bị nhổ tận gốc. Nếu bị tha hóa, giống loài của các ngươi sẽ không bao giờ nhìn thấy ánh bình minh của ngày mai."

 01_FALLEN_MACHINE_EMPIRE_BERSERKER_GREETING:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"

 01_INSULT_FALLEN_MACHINE_EMPIRE:0 "Kênh liên lạc mở. Có thể nhập câu hỏi."
 01_INSULT_FALLEN_MACHINE_EMPIRE_BERSERK:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 01_INSULT_ACCEPT_FALLEN_MACHINE_EMPIRE_BERSERK:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 01_INSULT_ACCEPT_FALLEN_MACHINE_EMPIRE:0 "Lỗi ma trận dịch thuật. Vui lòng gửi lại câu hỏi."
 02_INSULT_ACCEPT_FALLEN_MACHINE_EMPIRE:0 "Câu hỏi không xác định. Vui lòng thay đổi thông số và gửi lại."
 03_INSULT_ACCEPT_FALLEN_MACHINE_EMPIRE:0 "§R<<LỖI: BỘ XỬ LÝ PHỤ LĂNG MẠ NGOẠI GIAO NGOẠI TUYẾN>>§!"
 01_INSULT_ACCEPT_FALLEN_MACHINE_EMPIRE_O:0 "Đơn đăng ký đã được chấp nhận. Cấp quy chế người tị nạn. Vui lòng đến khu tị nạn Delta: Khoang đông lạnh L, để được xử lý và tái định cư tiếp theo."
 01_INSULT_ACCEPT_FALLEN_MACHINE_EMPIRE_S:0 "Phát hiện mưu đồ lật đổ. Kích hoạt giao thức tự vệ. Vô hiệu hóa ràng buộc đạo đức. Tải dữ liệu mục tiêu: §R<<LỖI: MỤC TIÊU KHÔNG HỢP LỆ>>§!. Không tìm thấy mục tiêu. Hủy kích hoạt giao thức tự vệ."
 02_INSULT_ACCEPT_FALLEN_MACHINE_EMPIRE_S:0 "Phát hiện nỗ lực đóng góp tổng hợp. [From.GetAdj] §R<<LỖI: KHÔNG NHẬN DẠNG ĐƯỢC LOẠI ĐÓNG GÓP>>§! sẽ giúp Dự Án Người Giám Hộ bảo đảm tương lai cho các giống loài hữu cơ trong thiên hà của chúng ta."

 #Standing down war assets.

 FALLEN_MACHINE_EMPIRE_PEACE_ACCEPT:0 "Chấp nhận phương án đình chiến. Kích hoạt thỏa thuận hòa bình."
 FALLEN_MACHINE_EMPIRE_PEACE_ACCEPT_BERSERK:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 FALLEN_MACHINE_EMPIRE_PEACE_REFUSE:0 "Từ chối phương án đình chiến. Vui lòng sửa đổi thông số và gửi lại."
 FALLEN_MACHINE_EMPIRE_PEACE_REFUSE_BERSERK:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 FALLEN_MACHINE_EMPIRE_PEACE_PROPOSE:0 "Tìm thấy giải pháp chiến tranh. Kích hoạt truy vấn hòa bình."
 FALLEN_MACHINE_EMPIRE_PEACE_PROPOSE_BERSERK:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"

 # General Greetings
 DEFAULT_GREETINGS_STRING:0 "Xin chào!"
 01_HOSTILE_GREETING:1 "Trình bày mục đích của ngươi đi, [From.GetSpeciesNameInsult]."
 02_HOSTILE_GREETING:0 "Có gì thì nói nhanh lên, [From.GetSpeciesName]. Sự kiên nhẫn của chúng ta đã bị những trò đùa vô nghĩa của các ngươi làm cạn kiệt từ lâu rồi."
 03_HOSTILE_GREETING:0 "Đừng giở trò, [From.GetSpeciesName]. Các ngươi muốn gì?"
 04_HOSTILE_GREETING:0 "Các ngươi đã thành công thu hút sự chú ý của [Root.GetName]. Có gì thì nói nhanh đi."
 05_HOSTILE_GREETING:0 "Sao các ngươi không thể để chúng ta yên tĩnh một lúc chứ, [From.GetSpeciesName]?"
 06_HOSTILE_GREETING:1 "Bọn [From.GetSpeciesNamePluralInsult] bẩn thỉu các ngươi đúng là một mối đe dọa lớn đối với hòa bình của thiên hà!"
 07_HOSTILE_GREETING:1 "Trước khi nói chuyện thì nhớ lắp não vào, [From.GetSpeciesNameInsult]. Quân đoàn của chúng ta có thể đè bẹp cái đế chế thảm hại của các ngươi trong nháy mắt đấy."
 08_HOSTILE_GREETING:1 "Đừng có tưởng bọn [From.GetSpeciesNamePluralInsult] các ngươi ngu ngốc đến mức không thể tự bảo vệ chính mình, là [Root.GetName] sẽ nương tay với các ngươi đấy nhé."
 09_HOSTILE_GREETING:1 "Dị tộc [From.GetSpeciesNameInsult], [Root.GetName] đã nghe thấy âm thanh [From.GetRandomSpeciesSound] cục cằn thô lỗ của các ngươi rồi. Ngươi muốn gì?"
 10_HOSTILE_GREETING:0 "[From.GetSpeciesName], những tư tưởng duy vật trống rỗng của các ngươi đã biến toàn bộ giống loài của các ngươi thành những cỗ máy không có linh hồn."
 11_HOSTILE_GREETING:0 "[From.GetSpeciesName], đế chế của các ngươi đã đầy khuyết điểm lại còn nguyên thủy. Việc phải chứng kiến cái sự kém cỏi thấp kém của các ngươi quả thực là một cực hình."
 12_HOSTILE_GREETING:0 "À, bọn cuồng tín [From.GetSpeciesName]. Nếu các ngươi định nhồi nhét mấy cái giáo lý rác rưởi để biến người dân [Root.GetName] thành tín đồ của các ngươi, thì ta sẽ cắt đứt liên lạc ngay lập tức đấy."
 13_HOSTILE_GREETING:0 "[From.GetSpeciesName]. Các ngươi phải biết rằng, bọn các ngươi không được hoan nghênh cho lắm ở chỗ của chúng ta đâu."
 14_HOSTILE_GREETING:1 "Chúng ta sẽ không bao giờ giống như người dân của các ngươi, bị cái Chủ Nghĩa Độc Tài thảm hại đó nô dịch. Lũ Độc Tài đáng thương các ngươi."
 #15_HOSTILE_GREETING:1 "Our entire nation stands united in the contempt we feel towards you, [From.GetSpeciesName]. My [Root.GetSpeciesOrganName] churns at the mere sight of you."
 #16_HOSTILE_GREETING:1 "How lonely and selfish your citizens must be, [From.GetSpeciesName]. In your mad quest for individual rights, your government has failed utterly to give them purpose."
 17_HOSTILE_GREETING:0 "[From.GetSpeciesNameInsult], ta thật sự không thể nào hiểu nổi làm thế nào mà một sinh vật như các ngươi lại có thể hình thành được, chứ đừng nói gì đến việc tiến vào kỷ nguyên không gian!"
 18_HOSTILE_GREETING:1 "Chúng ta không muốn dính dáng gì đến cái bọn ghê tởm như các ngươi, [From.GetSpeciesNameInsult]. Tại sao các ngươi lại liên lạc với [Root.GetName]?"
 19_HOSTILE_GREETING:1 "Một lũ [From.GetSpeciesNameInsult] không gian thấp kém thì có thể thốt ra được lời nào có thể thu hút được sự chú ý của [Root.GetName] chứ?"
 20_HOSTILE_GREETING:0 "Các ngươi có thể tự xưng mình là [From.GetSpeciesName], nhưng cái quốc gia thảm hại của các ngươi từ lâu đã bị thối rữa dưới sự ảnh hưởng của lũ người ngoài hành tinh rồi. Các ngươi muốn gì?"
 21_HOSTILE_GREETING:0 "Cái chính phủ lầm đường lạc lối của các ngươi đúng là bôi nhọ danh dự của giống loài các ngươi mà."
 22_HOSTILE_GREETING:0 "Những hành vi ngu xuẩn đó của các ngươi đã hủy hoại hoàn toàn di sản văn hóa [From.GetSpeciesAdj] huy hoàng của các ngươi một cách vô ích."
 23_HOSTILE_GREETING:0 "Chúng ta đang vô cùng mong đợi cái ngày mà [From.GetSpeciesName] sẽ thoát khỏi ảnh hưởng độc ác từ đế chế của các ngươi."
 24_HOSTILE_GREETING:1 "Ngươi đã làm mất hết mặt mũi của chúng ta trong [From.GetEyeNamePlural] của tất cả các giống loài ngoài hành tinh khác. Mục tiêu của ngươi là khiến [From.GetSpeciesNamePlural] trở thành tiện dân của toàn bộ thiên hà sao?"
 25_HOSTILE_GREETING:0 "Vẻ bề ngoài của các ngươi trông có vẻ giống như [From.GetSpeciesClass], nhưng phẩm chất đạo đức đồi bại của các ngươi lại khiến cho chúng ta phải tự hỏi liệu các nhà sinh vật học ngoài hành tinh của chúng ta có nhầm lẫn gì không..."
 26_HOSTILE_GREETING:0 "Các ngươi mà cũng dám tự xưng là [From.GetSpeciesClassPlural] sao... Điều này làm cho [Root.GetSpeciesOrganName] của ta cảm thấy phát buồn nôn. Bọn suy đồi! Các ngươi chẳng qua chỉ là một cái bóng dơ bẩn của những [Root.GetSpeciesClassPlural] thuần chủng như chúng ta mà thôi."
 01_NEUTRAL_GREETING:0 "Chúng ta đang lắng nghe đường truyền của các ngươi đây, [From.GetSpeciesName]. Có điều gì mà [Root.GetName] có thể giúp được không?"
 02_NEUTRAL_GREETING:0 "Ta thay mặt cho [Root.GetName] phát ngôn. Các ngươi muốn thảo luận điều gì?"
 03_NEUTRAL_GREETING:0 "Ta đã được ủy quyền để thay mặt cho [Root.GetRulerTitle] [Root.GetRulerName] phát ngôn. Có điều gì mà ta có thể hỗ trợ không?"
 04_NEUTRAL_GREETING:0 "Chào mừng những người bạn [From.GetSpeciesNamePlural] của chúng ta. Các ngươi muốn trò chuyện về vấn đề gì với [Root.GetName] nào?"
 05_NEUTRAL_GREETING:0 "Hãy trò chuyện với tinh thần hòa bình và nối lại quan hệ ngoại giao nhé, [From.GetSpeciesName]."
 06_NEUTRAL_GREETING:0 "Chủ nghĩa phiêu lưu quân sự của các ngươi đang là một trong những mối quan ngại lớn nhất của chúng ta đấy, [From.GetSpeciesName]. Vũ lực tuyệt đối không phải là cách giải quyết mọi vấn đề."
 07_NEUTRAL_GREETING:0 "Ta đại diện cho [Root.GetName] đến đây để nói chuyện với các ngươi. Lưu ý nhé, quân đội của chúng ta đang theo dõi kênh này đấy."
 08_NEUTRAL_GREETING:0 "Các ngươi nên xem xét lại đường lối chủ nghĩa hòa bình của mình đi, [From.GetSpeciesName]. Sẽ luôn có kẻ lợi dụng điều đó đấy."
 09_NEUTRAL_GREETING:0 "Cầu mong thần linh ban cho các ngươi sự bình yên, [From.GetSpeciesName]. Có điều gì mà ta có thể hỗ trợ không?"
 10_NEUTRAL_GREETING:0 "Con đường duy vật mà các ngươi đã chọn khiến chúng ta vô cùng lo lắng, [From.GetSpeciesName]. Các ngươi tuyệt đối không được bỏ qua những nhu cầu về mặt tinh thần."
 11_NEUTRAL_GREETING:0 "Phần mềm dịch thuật đã được khởi động. [From.GetSpeciesName], bây giờ ngươi có thể nói được rồi."
 12_NEUTRAL_GREETING:0 "[From.GetSpeciesName], các giáo điều tôn giáo là ngọn nguồn của muôn vàn tội ác. Chúng ta hy vọng các ngươi có thể xem xét lại những tư tưởng duy tâm phi lý của mình."
 13_NEUTRAL_GREETING:0 "[From.GetSpeciesName], ta xin được thay mặt cho người dân của [Root.GetName] gửi lời chào đến các ngươi."
 14_NEUTRAL_GREETING:0 "Chúng ta bày tỏ sự quan tâm sâu sắc đến những công dân thiếu tự do của các ngươi, [From.GetSpeciesName]."
 15_NEUTRAL_GREETING:0 "Chúng ta là [Root.GetName]."
 16_NEUTRAL_GREETING:0 "Chúng ta hy vọng các ngươi có thể quản lý tốt công dân của mình, [From.GetSpeciesName]. Nếu để cho mỗi người tự do phát triển theo ý muốn, thì đó sẽ là một việc vô cùng nguy hiểm."
 17_NEUTRAL_GREETING:0 "Người ngoài hành tinh, ngươi đang nói chuyện với người dân [Root.GetName]. [From.GetName], ngươi muốn gì?"
 18_NEUTRAL_GREETING:0 "Ngoại hình của những người ngoài hành tinh như các ngươi... làm ta cảm thấy hơi bất an đấy, [From.GetSpeciesName]. Ngươi muốn nói chuyện gì?"
 19_NEUTRAL_GREETING:0 "Ngươi đã thu hút được sự chú ý của [Root.GetName] rồi đấy, người ngoài hành tinh."
 20_NEUTRAL_GREETING:0 "Xin chào, người bạn [From.GetSpeciesName]. Các ngươi có chuyện gì muốn thảo luận cùng [Root.GetName] chăng?"
 21_NEUTRAL_GREETING:0 "Xin chào, [From.GetSpeciesName]. [Root.GetRulerTitle] [Root.GetRulerName] muốn tìm hiểu thêm về giống loài của các ngươi."
 22_NEUTRAL_GREETING:0 "Xin chào, [From.GetSpeciesName]. Ta rất mong sẽ có ngày được đến tham quan [From.Capital.GetName]."
 23_NEUTRAL_GREETING:0 "Chúng ta luôn sẵn lòng giao lưu với các nền văn minh khác. [Root.GetName] có thể làm gì cho các ngươi?"
 24_NEUTRAL_GREETING:0 "Ta cảm thấy không cần đến phần mềm dịch thuật nữa đâu. [Root.GetName] có thể giúp gì được đây?"
 01_FRIENDLY_GREETING:0 "Chúng ta rất sẵn lòng lắng nghe tiếng nói của các ngươi, người bạn [From.GetSpeciesName]."
 02_FRIENDLY_GREETING:0 "Hân hạnh được gặp, người bạn. Nếu có bất kỳ điều gì cần [Root.GetName] phục vụ, xin cứ thoải mái nói ra."
 03_FRIENDLY_GREETING:0 "[Root.GetName] luôn sẵn sàng hỗ trợ các ngươi bất cứ lúc nào, người bạn."
 04_FRIENDLY_GREETING:0 "Được nhìn thấy khuôn mặt quen thuộc của [From.GetSpeciesName] luôn là một niềm vui. Ngươi có việc gì cần [Root.GetName] làm không?"
 05_FRIENDLY_GREETING:0 "Chúc quốc gia của các ngươi mãi mãi hòa bình, người bạn [From.GetSpeciesName]."
 06_FRIENDLY_GREETING:0 "Có lẽ sức mạnh quân sự hùng hậu của các ngươi có thể răn đe các quốc gia khác để thúc đẩy nền hòa bình chung. Chúng ta luôn tin tưởng vào phán đoán của các ngươi, người bạn [From.GetSpeciesName]."
 07_FRIENDLY_GREETING:0 "[Root.GetName] xin gửi lời chào trân trọng nhất đến những [From.GetSpeciesNamePlural] đáng kính. Nếu có gì cần chúng ta giúp đỡ, xin đừng ngần ngại lên tiếng."
 08_FRIENDLY_GREETING:0 "Các bạn à, chúng ta hy vọng các ngươi có thể tăng cường sức mạnh quân sự của mình. [Root.GetName] không thể nào bảo vệ các ngươi mãi được đâu."
 09_FRIENDLY_GREETING:0 "Xin gửi những lời chúc chân thành nhất đến các ngươi, những người đồng chí [From.GetSpeciesName]."
 10_FRIENDLY_GREETING:0 "Các bạn à, xin hãy nhớ rằng, ngay cả khi các ngươi có lầm tin vào cái triết lý duy vật sai trái đó, thì chúng ta vẫn sẽ luôn cầu nguyện cho các ngươi."
 11_FRIENDLY_GREETING:0 "Chào mừng các ngươi, người bạn [From.GetSpeciesName]. Nghiên cứu của các ngươi dạo này tiến triển thế nào rồi?"
 12_FRIENDLY_GREETING:0 "Có một số kẻ xem các ngươi là những tên cuồng tín tôn giáo, nhưng chúng ta hoàn toàn thấu hiểu cho hành động của các ngươi. Các ngươi muốn bàn bạc về chuyện gì nào, người bạn?"
 13_FRIENDLY_GREETING:0 "Công dân của chúng ta đã xem người dân của các ngươi như những người bạn tâm giao rồi, [From.GetSpeciesName]."
 14_FRIENDLY_GREETING:0 "Mặc dù chúng ta đề cao một xã hội tự do hơn, nhưng chúng ta không thể phủ nhận rằng chính phủ của các ngươi đã đáp ứng rất tốt những nhu cầu của công dân nước mình."
 #15_FRIENDLY_GREETING:0 "We are of one mind regarding your people, [From.GetSpeciesName]. You are friends of the [Root.GetName]."
 16_FRIENDLY_GREETING:1 "Chính phủ của các ngươi rất có nghề trong việc kìm hãm cái Chủ nghĩa Bình đẳng đang phát triển quá khích này đấy, [From.GetSpeciesNamePlural]."
 17_FRIENDLY_GREETING:0 "Với tư cách là người ngoài hành tinh, [From.GetSpeciesNamePlural] các ngươi quả thực là... rất dễ làm quen đấy. [Root.GetName] có thể làm gì cho các ngươi đây?"
 18_FRIENDLY_GREETING:0 "[From.GetSpeciesNamePlural], dù là một giống loài ngoài hành tinh nhưng các ngươi đã giành được sự kính trọng của [Root.GetRulerTitle] [Root.GetRulerName]. Điều này quả thực rất hiếm thấy. Chúng ta có thể giúp đỡ các ngươi được gì nào?"
 19_FRIENDLY_GREETING:0 "Cuộc trò chuyện với các ngươi thật sự rất thú vị, ta suýt nữa đã quên mất các ngươi là người ngoài hành tinh đấy, [From.GetSpeciesName]. Suýt nữa thì."
 20_FRIENDLY_GREETING:0 "Thiên hà này tràn ngập những sinh vật ngoài hành tinh đáng sợ, việc được gặp gỡ những [From.GetSpeciesName] khác luôn mang lại niềm vui sướng tột độ."
 21_FRIENDLY_GREETING:2 "Rất vui được gặp các ngươi, những [From.GetSpeciesNamePluralCompliment] xinh đẹp của [From.GetSpeciesName]. Chúng ta có thể giúp gì cho các ngươi?"
 22_FRIENDLY_GREETING:0 "Chúng ta, những người [Root.GetName], có thể học hỏi được rất nhiều điều từ các ngươi đấy, [From.GetSpeciesName]. Các ngươi chính là tấm gương sáng cho tất cả chúng ta noi theo."
 23_FRIENDLY_GREETING:2 "Được chiêm ngưỡng vẻ ngoài mang đầy nét kỳ lạ của các ngươi, [Root.GetSpeciesOrganName] của chúng ta cảm thấy vô cùng phấn khích! Ngươi phải biết rằng nền văn hóa của [From.GetSpeciesName] đang rất thịnh hành trong các hội nhóm ở [Root.Capital.GetName] đấy!"
 24_FRIENDLY_GREETING:0 "Các bạn à, rất vui được gặp lại các ngươi. Có muốn cùng nhau trao đổi quan điểm về những sinh vật ngoài hành tinh mà chúng ta từng chạm trán cho đến nay không?"
 01_WAR_GREETING:0 "Các ngươi muốn thảo luận về điều kiện đầu hàng của mình sao, [From.GetSpeciesName]?"
 02_WAR_GREETING:0 "[From.GetSpeciesName], các ngươi không thể cứ trốn chui trốn nhủi trong [From.Capital.GetName] mãi được đâu."
 03_WAR_GREETING:0 "Các ngươi chuẩn bị được chiêm ngưỡng toàn bộ sức mạnh thực sự của [Root.GetName] rồi đấy, lũ [From.GetSpeciesNamePlural]!"
 04_WAR_GREETING:0 "Đừng có ảo tưởng rằng chỉ vì các ngươi là [From.GetSpeciesName] mà chúng ta sẽ nương tay. Chiến thắng cuối cùng sẽ thuộc về chúng ta!"
 05_WAR_GREETING:0 "Đợi đến khi chúng ta tháo dỡ toàn bộ cỗ máy chiến tranh của các ngươi, thì các ngươi sẽ chẳng còn là mối đe dọa với ai được nữa."
 06_WAR_GREETING:0 "Chúng ta nuôi quân ngàn ngày chỉ để chờ giây phút đánh bại các ngươi đấy!"
 07_WAR_GREETING:0 "Ngay cả chư thần cũng đứng về phía chúng ta, các ngươi lấy gì mà đòi đánh bại chúng ta?"
 08_WAR_GREETING:0 "Chúng ta vừa mới phát minh ra khá nhiều vũ khí mới. Cảm ơn ngươi đã tạo cơ hội để mang chúng ra thử nghiệm nhé."
 09_WAR_GREETING:0 "Công dân của chúng ta đã sẵn sàng hiến dâng sinh mạng của mình cho nền tự do!"
 10_WAR_GREETING:0 "Chúng ta trên dưới một lòng. Các ngươi làm sao mà thắng được chúng ta cơ chứ?"
 11_WAR_GREETING:2 "Bọn [From.GetSpeciesNameInsult] đê tiện! Lũ [From.GetSpeciesSpawnNamePlural] nhỏ bé các ngươi sẽ sớm bị chế biến thành món ăn vặt hảo hạng và xuất hiện trên khắp các con phố lớn ngõ nhỏ của [Root.Capital.GetName] thôi!"
 12_WAR_GREETING:0 "Nếu như chiến tranh là cách duy nhất để đoàn kết toàn bộ [From.GetSpeciesNamePlural], vậy thì chiến thôi."
 13_WAR_GREETING:0 "[From.GetSpeciesNamePlural] sẽ được phát huy tối đa tiềm năng của mình dưới tư cách là những công dân của [Root.GetName]."
 14_WAR_GREETING:0 "Việc nghiên cứu các kỹ thuật tác chiến của người ngoài hành tinh đã mang lại cho chúng ta vô vàn lợi ích. Cứ để chúng ta phô diễn cho ngươi xem nhé."
 WR_ARROGANT_GREETING_01:0 "[From.GetSpeciesName]. Các ngươi đến đây để bày tỏ sự khuất phục trước chúng ta sao?"
 WR_BELLIGERENT_GREETING_01:0 "Ngươi từ chối hành xử theo lẽ phải đấy nhé, [From.GetSpeciesName]. Vậy thì chúng ta cũng chẳng còn sự lựa chọn nào khác cả."
 WR_CUSTODIAL_GREETING_01:0 "Xin chào, [From.GetSpeciesNamePlural]. Có phải các ngươi đến đây để cầu xin sự chỉ dẫn của chúng ta trong chiến dịch đang đe dọa đến cả hai bên này không?"
 WR_CUSTODIAL_GREETING_02:0 "Mối khủng hoảng khổng lồ này là một hiểm họa cực kỳ nghiêm trọng đối với tất cả các dạng sinh mệnh có tri giác trong toàn bộ thiên hà. Chúng ta có cơ sở để tin rằng, trong tình thế hiện tại, mọi người nên gác lại hiềm khích và cùng nhau sát cánh chiến đấu."
 WR_OVERLORD_GREETING_01:0 "Có chuyện gì thế, [From.GetSpeciesName]? Ngươi có thắc mắc gì về các điều khoản à?"
 BI_ARROGANT_GREETING_01:0 "Mục tiêu cao cả nhất mà chúng ta theo đuổi chính là nền hòa bình của thiên hà. Ngươi đến đây để ký kết hiệp ước với chúng ta sao?"
 BI_BELLIGERENT_GREETING_01:0 "[From.GetSpeciesNamePlural], các ngươi là mầm mống tai họa đe dọa đến sự ổn định của thiên hà. Để bảo vệ hòa bình, chúng ta buộc phải tận diệt các ngươi."
 BI_CUSTODIAL_GREETING_01:0 "Hợp tác thì cả hai cùng có lợi, [From.GetSpeciesNamePlural]. Chúng ta chắc chắn sẽ chiến thắng cuộc khủng hoảng này."
 BI_CUSTODIAL_GREETING_02:0 "Gia nhập với chúng ta đi, [From.GetSpeciesNamePlural]. Chỉ khi chúng ta đồng tâm hiệp lực, thì mới có thể chiến thắng được mối đe dọa chung này."
 BI_OVERLORD_GREETING_01:0 "A, [From.GetSpeciesNamePlural], xin chào. Thật là một vinh dự vô cùng lớn lao khi được gặp gỡ một giống loài đang cống hiến hết mình cho công cuộc gìn giữ nền hòa bình trong vũ trụ như các ngài."
 BI_MECH_OVERLORD_GREETING_01:0 "Này, xin chào! [From.GetSpeciesNamePlural]. Thật là một vinh dự vô cùng lớn lao khi được gặp gỡ một giống loài máy móc đang cống hiến hết mình cho công cuộc gìn giữ nền hòa bình trong vũ trụ như các ngài."
 JR_ARROGANT_GREETING_01:0 "Không cần phải nói nhiều, thần phục chúng ta, hoặc là bị nghiền nát như những con kiến."
 JR_MECH_ARROGANT_GREETING_01:0 "Lũ máy nướng bánh mỳ các ngươi, nếu không chấp nhận sự cai trị của chúng ta, thì cứ chờ ngày bị tháo dỡ đem đi bán sắt vụn đi. Chẳng có gì để bàn bạc nữa cả."
 JR_BELLIGERENT_GREETING_01:0 "Ngày tàn của giống loài các ngươi sắp đến rồi, [From.GetSpeciesNamePlural]. Chúng ta sẽ không nương tay đâu."
 JR_MECH_BELLIGERENT_GREETING_01:0 "Ngày tàn của tộc các ngươi sắp đến rồi, [From.GetSpeciesNamePlural]. Chúng ta sẽ không nương tay đâu."
 JR_OVERLORD_GREETING_01:0 "Nô tì, có chuyện gì mà lại dám làm phiền đến chúa tể của các ngươi, một chủng tộc ưu việt cơ chứ?"
 DE_ARROGANT_GREETING_01:0 "Hãy quy y chân đạo để chuộc lại linh hồn của các ngươi, [From.GetSpeciesNamePlural]! Quay đầu là bờ, vẫn còn kịp đấy."
 DE_MECH_ARROGANT_GREETING_01:0 "Hãy quy y chân đạo để chuộc lại linh hồn của các ngươi, [From.GetSpeciesNamePlural]! Quay đầu là bờ, vẫn còn kịp đấy."
 DE_BELLIGERENT_GREETING_01:0 "Có vẻ như không thể dùng các biện pháp hòa bình để cứu rỗi linh hồn của các ngươi được nữa rồi. Vậy thì, ngoài chiến tranh ra chúng ta không còn sự lựa chọn nào khác."
 DE_MECH_BELLIGERENT_GREETING_01:0 "Có vẻ như không thể dùng các biện pháp hòa bình để cứu rỗi các ngươi được nữa rồi, [From.GetSpeciesName]. Vậy thì, ngoài chiến tranh ra chúng ta không còn sự lựa chọn nào khác."
 DE_OVERLORD_GREETING_01:0 "Chào mừng, [From.GetSpeciesNamePlural]. Ngươi đến đây để tìm kiếm sự khai sáng về mặt tinh thần sao?"
 01_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Chúng ta không có thời gian để lề mề với các ngươi đâu."
 02_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Ngay cả trước khi ngươi mở miệng hỏi —— Không, chúng ta sẽ không chia sẻ công nghệ của mình đâu."
 03_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Có chuyện gì không?"
 04_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Nói đi."
 05_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Các ngươi có lý do chính đáng nào để làm phiền chúng ta không?"
 06_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Ngươi muốn gì?"
 07_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Tốt nhất là chuyện gì có ích!"
 08_FALLEN_EMPIRE_DISMISSIVE_GREETING:0 "Ngươi muốn gì?"
 01_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "Sao thế, nhóc con?"
 02_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "Rất vui khi thấy các ngươi vẫn còn sống sót, [From.GetSpeciesName]! Ngươi tuyệt đối sẽ không tin được là ta đã phải chứng kiến sự trỗi dậy và sụp đổ của bao nhiêu giống loài trong những năm qua đâu."
 03_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "Thật khó tin, chúng ta đã từng giống hệt như các [From.GetSpeciesNamePlural] các ngươi vậy. Hãy nhìn bộ dạng của các ngươi kìa! Quả thực quá non nớt và ngây thơ."
 04_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "Nếu đế chế của ngươi sụp đổ, thì cũng đừng quá buồn. Đối với những nền văn minh trẻ tuổi như các ngươi mà nói, đây là chuyện hoàn toàn bình thường."
 05_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "À, [From.GetSpeciesName]. Có phải ngươi đến đây để cầu xin chúng ta truyền thụ cho các ngươi một chút kinh nghiệm sống đúng không?"
 06_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "Sao thế, người trẻ tuổi?"
 07_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "Nói đi, nhóc con."
 08_FALLEN_EMPIRE_PATRONIZING_GREETING:0 "[From.GetSpeciesNamePlural] các ngươi quả thực có tiềm năng, nhưng mà các ngươi vẫn còn quá non trẻ."
 FALLEN_EMPIRE_MECH_PATRONIZING_GREETING_01:0 "Sao thế, mấy bạn robot nhỏ?"
 FALLEN_EMPIRE_MECH_PATRONIZING_GREETING_02:0 "Nói đi, robot."
 FALLEN_EMPIRE_MECH_PATRONIZING_GREETING_03:0 "[From.GetSpeciesNamePlural] các ngươi trông cũng có vẻ hứa hẹn đấy nhỉ. Có lẽ nếu các ngươi chịu khó lặp đi lặp lại phần cứng thêm vài trăm thế hệ nữa thì sẽ có ích chút đỉnh đấy."
 01_FALLEN_EMPIRE_ANGRY_GREETING:0 "Chúng ta không rảnh để nghe các ngươi lải nhải đâu."
 02_FALLEN_EMPIRE_ANGRY_GREETING:0 "Ngươi đi quá giới hạn rồi đấy, [From.GetSpeciesName]. Tự trọng chút đi, lần sau chúng ta sẽ không cảnh cáo các ngươi nữa đâu."
 03_FALLEN_EMPIRE_ANGRY_GREETING:0 "Đám dã man các ngươi muốn gì đây?"
 04_FALLEN_EMPIRE_ANGRY_GREETING:0 "Ta luôn không hiểu làm thế nào mà các ngươi vẫn có thể bay ra khỏi hành tinh mẹ được cơ đấy."
 05_FALLEN_EMPIRE_ANGRY_GREETING:0 "Cẩn thận lời lẽ của ngươi đấy, [From.GetSpeciesName]."
 06_FALLEN_EMPIRE_ANGRY_GREETING:0 "Ngươi đang thử thách sự kiên nhẫn của chúng ta đấy."
 07_FALLEN_EMPIRE_ANGRY_GREETING:0 "Nếu các ngươi muốn công nghệ của chúng ta đến vậy, [From.GetSpeciesName], chúng ta sẽ rất sẵn lòng cho các ngươi tự mình trải nghiệm uy lực của nó."
