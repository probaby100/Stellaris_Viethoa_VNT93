 S_CONSIDER_01:0 "$HM_CONSIDER_01$"
 S_CONSIDER_02:0 "[Root.GetName] đang tiến hành xử lý yêu cầu của quý vị, xin vui lòng chờ trong giây lát."
 S_DOW_ACCEPT_01:0 "Chúng tôi xin đưa ra lời cảnh báo rằng, việc tiến hành chiến tranh với chúng tôi sẽ gây ra những ảnh hưởng không tốt cho sức khỏe của quý vị."
 S_DOW_ACCEPT_02:0 "Các vị thật sự quá mức bất tuân, những [From.GetSpeciesNamePlural] nhỏ bé. Giao thức thanh lọc dân số đã được khởi động."
 S_DOW_PROPOSE_01:0 "Chúng tôi xin nhắc nhở quý vị rằng, việc chủ động đầu hàng luôn luôn là một sự lựa chọn có thể xử lý được."
 S_DOW_PROPOSE_02:0 "Chúng tôi vô cùng thương tiếc phải báo tin rằng, mọi chuyện dừng lại ở đây thôi."
 S_DOW_PROPOSE_03:0 "Chương trình chăm sóc đặc biệt tối thượng đã được kích hoạt. Xin hãy chuẩn bị để đón nhận sự chăm sóc này."
