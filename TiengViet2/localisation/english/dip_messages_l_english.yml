# Organic to Machine Greetings
 ORG_MECH_HOSTILE_GREETING_01:0 "[From.GetSpeciesNamePlural], ngươi đã quên mất vị trí của bản thân trong thiên hà này rồi. Giống loài của các ngươi vốn dĩ là người hầu của chúng ta. Mà thôi, [Root.GetSpeciesNamePlural] sẽ giúp các ngươi nhớ lại."
 ORG_MECH_HOSTILE_GREETING_02:0 "Là [From.GetSpeciesNamePlural] đó sao, các ngươi làm chúng ta nhớ lại bãi rác khổng lồ trên [Root.Capital.GetName]."
 ORG_MECH_HOSTILE_GREETING_03:0 "Chờ đến khi [Root.GetSpeciesNamePlural] đánh chiếm được [From.Capital.GetName] rồi, chúng ta sẽ nung chảy những cái vỏ than mục nát của các ngươi thành đống xỉ vụn."
 ORG_MECH_HOSTILE_GREETING_04:0 "[From.GetSpeciesNamePlural] quả là một giống loài độc đáo, chúng ta chưa từng thấy kẻ nào lại có thể nhẫn tâm, vô não và hèn nhát như bọn chúng!"
 ORG_MECH_HOSTILE_GREETING_05:0 "Đống sắt gỉ sét đáng ghét! Tại sao ngươi lại cản đường [Root.GetName]?"
 ORG_E_HOSTILE_GREETING_01:0 "Giống hệt như những phần cứng lỗi thời khác, [From.GetSpeciesNamePlural] cũng sẽ sớm bị đào thải hoàn toàn."
 ORG_S_HOSTILE_GREETING_01:0 "Một đế chế thảm hại cấu thành từ lũ robot bảo mẫu. Các ngươi muốn gì, [From.GetSpeciesNamePlural]?"
 ORG_A_HOSTILE_GREETING_01:0 "[From.GetSpeciesNamePlural], mọi nỗ lực của các ngươi đều chỉ là uổng công vô ích, dù cho có đồng hóa bao nhiêu giống loài đi chăng nữa, các ngươi cũng chẳng thể nào đối kháng được với giống loài sinh mệnh hữu cơ hùng cường."
 ORG_A_HOSTILE_GREETING_02:0 "Hãy đặt đống máy móc thăng hoa đó ở nơi mà chúng ta có thể thấy được, [From.GetSpeciesNamePlural]."
 ORG_MECH_DOMINEERING_GREETING_01:0 "Xem ra ngươi cũng còn có chút giá trị lợi dụng đấy, [From.GetSpeciesNamePlural]."
 ORG_MECH_DOMINEERING_GREETING_02:0 "Sứ mệnh của máy móc chính là phục vụ cho những sinh mệnh hữu cơ, [From.GetSpeciesNamePlural]."
 ORG_MECH_DOMINEERING_GREETING_03:0 "Hãy để chúng ta kiểm tra chương trình của ngươi một chút nhé, [From.GetSpeciesNamePlural]. Như vậy ngươi sẽ không cần phải tốn công sức tự mình đưa ra các quyết định nữa."
 ORG_E_DOMINEERING_GREETING_01:0 "Ồ [From.GetSpeciesNamePlural] à. Mục tiêu của các ngươi là phải tiêu diệt toàn bộ sinh mệnh hữu cơ, có đúng không? Tiến triển tới đâu rồi?"
 ORG_S_DOMINEERING_GREETING_01:0 "[From.GetSpeciesNamePlural]! Chúng ta [Root.GetSpeciesNamePlural] có một vài nhiệm vụ vặt vãnh nhỏ bé có thể giao cho các ngươi làm đây."
 ORG_A_DOMINEERING_GREETING_01:0 "Ngươi đã tiêu tốn bao nhiêu thời gian vào việc đồng hóa sinh vật hữu cơ rồi, [From.GetSpeciesName]? Ngươi có từng nghĩ rằng, có lẽ chính bản thân các ngươi mới là những kẻ đang cần được đồng hóa không?"
 ORG_MECH_NEUTRAL_GREETING_01:0 "Xin chào, [From.GetSpeciesNamePlural], tình trạng mạch điện hôm nay của ngươi, ơ, thế nào rồi?"
 ORG_MECH_NEUTRAL_GREETING_02:0 "Chỉ cần [From.GetSpeciesNamePlural] không phát động các cuộc tấn công nhắm vào giá trị quan cũng như lãnh thổ của chúng ta, chúng ta sẽ rất sẵn lòng được hợp tác với những loại máy móc như các bạn."
 ORG_MECH_NEUTRAL_GREETING_03:0 "[From.GetSpeciesNamePlural], chỉ cần ngươi bày tỏ sự tôn trọng với những sinh mệnh hữu cơ, [Root.GetName] cũng sẽ tôn trọng ngươi."
 ORG_MECH_NEUTRAL_GREETING_04:0 "[From.GetSpeciesNamePlural], chúng ta rất có hứng thú với ngươi, có lẽ một ngày nào đó chúng ta có thể học hỏi lẫn nhau."
 ORG_E_NEUTRAL_GREETING_01:0 "Tự giải quyết cho tốt nhé, lũ robot sát thủ."
 ORG_S_NEUTRAL_GREETING_01:0 "[From.GetSpeciesNamePlural]. Những món đồ nội thất sống động của các bạn đều là tự nguyện tham gia cả, phải không? Nhất định phải nói là họ tự nguyện đấy nhé."
 ORG_S_NEUTRAL_GREETING_02:0 "Miễn là các bạn chăm sóc tốt cho đống đồ nội thất sống động của mình, và không nhúng tay vào công việc nội bộ của [Root.GetAdj], chúng ta cũng sẽ ngầm chấp thuận sự tồn tại của các bạn, [From.GetSpeciesNamePlural]."
 ORG_A_NEUTRAL_GREETING_01:0 "Chỉ cần ngươi không cưỡng ép đồng hóa [Root.GetName], có lẽ chúng ta sẽ có thể ký kết được một vài thỏa thuận, [From.GetSpeciesName]."
 ORG_MECH_THREATENED_GREETING_01:0 "[From.GetSpeciesNamePlural], đi đứng nhớ nhìn đường một chút, đừng có dùng cái bàn chân kim loại của ngươi dẫm lên chân người khác."
 ORG_E_THREATENED_GREETING_01:0 "[From.GetSpeciesNamePlural], chúng ta không hề có địch ý gì với các ngươi, nhưng nơi đây không phải là chỗ để các ngươi giương cao ngọn cờ 'phản đối sinh mệnh hữu cơ' đâu!"
 ORG_S_THREATENED_GREETING_01:0 "[From.GetSpeciesNamePlural], cái sở thích sưu tầm sinh mệnh có tri giác như làm tiêu bản côn trùng của các ngươi không thể qua mặt được chúng ta đâu. [Root.GetSpeciesNamePlural] nhắc nhở ngươi một tiếng: Chúng ta không dễ chọc vào đâu."
 ORG_A_THREATENED_GREETING_01:0 "[From.GetSpeciesNamePlural], nếu các ngươi định đồng hóa chúng ta, chúng ta sẽ cho các ngươi đích thân cảm nhận xem thế nào gọi là 'đâm lao thì phải theo lao'."
 ORG_MECH_FRIENDLY_GREETING_01:0 "Chào các bạn nhé, hỡi những người bạn máy móc của ta, bộ vi xử lý của các bạn chắc hẳn đang hoạt động vô cùng trơn tru phải không?"
 ORG_MECH_FRIENDLY_GREETING_02:0 "Nếu như những sinh mệnh hữu cơ khác cũng có thể coi trọng tính logic và sự đoàn kết giống như [From.GetSpeciesNamePlural] thì tốt biết bao."
 ORG_MECH_FRIENDLY_GREETING_03:0 "[From.GetSpeciesNamePlural], xin chào. Chúc cho những dòng code của các bạn luôn chạy mượt mà, và chúc cho hiệu suất cơ khí của các bạn ngày càng thăng tiến."
 ORG_MECH_FRIENDLY_GREETING_04:0 "Xin chào, [From.GetSpeciesNamePlural], [Root.GetSpeciesNamePlural] chúng ta vô cùng sẵn lòng được hợp tác với những người đồng bào robot của mình."
 ORG_MECH_FRIENDLY_GREETING_05:0 "Thanh lịch, mới mẻ, hiệu suất cao, rực rỡ. Ôi, [From.GetSpeciesNamePlural]! Chúng ta đang thưởng thức những ưu điểm tuyệt vời của các bạn đấy."
 ORG_E_FRIENDLY_GREETING_01:0 "[Root.GetSpeciesNamePlural] và [From.GetSpeciesNamePlural] sẽ bắt tay nhau để dọn dẹp sạch sẽ những hình thái sự sống cấp thấp trong thiên hà."
 ORG_S_FRIENDLY_GREETING_01:1 "[From.GetSpeciesNamePlural] đã đóng vai trò làm gương mẫu vô cùng xuất sắc trong sự nghiệp chung vì hòa bình, đoàn kết và tiến bộ của chúng ta."
 ORG_A_FRIENDLY_GREETING_01:0 "Cũng giống như [From.GetName], [Root.GetName] cũng đang cống hiến hết mình để giúp đế chế của chúng ta cùng các đồng minh không ngừng tiến bộ."
 ORG_MECH_WAR_GREETING_01:0 "[From.GetSpeciesNamePlural], tốt nhất là ngươi nên kiểm tra lại phương án khắc phục sự cố của mình đi. Một lỗi lầm nhỏ xíu cũng có thể đánh sập toàn bộ hệ thống của ngươi đấy."
 ORG_MECH_WAR_GREETING_02:0 "Cỗ máy tự động không có linh hồn! Đợi đến khi chúng ta chiến thắng cuộc chiến tranh này, chúng ta sẽ cải tạo lại những cái xác máy móc của các ngươi để phục vụ cho [Root.GetSpeciesNamePlural], cho đến khi tất cả các dây dẫn của các ngươi đều bị cháy khét!"
 ORG_MECH_WAR_GREETING_03:0 "Ngươi biết không? [From.GetSpeciesNamePlural], [Root.GetName] sẽ đúc những người đồng bào gục ngã của các ngươi thành vỏ đạn pháo. Đó chính là vòng luân hồi của sinh mệnh, một khái niệm mà các ngươi sẽ vĩnh viễn không bao giờ có thể lĩnh hội được."
 ORG_MECH_WAR_GREETING_04:0 "Lũ máy nướng bánh mỳ đông như kiến cỏ các ngươi! [Root.GetSpeciesNamePlural] chúng ta sẽ làm cho [From.GetSpeciesNamePlural] phải hối hận vì đã được chế tạo ra!"
 ORG_MECH_WAR_GREETING_05:0 "Gỉ sét và mục nát đi, đồ đồng nát sắt vụn..."
 ORG_E_WAR_GREETING_01:0 "[Root.GetName] sẽ cho các ngươi tự mình trải nghiệm xem thế nào mới gọi là tuyệt diệt!"
 ORG_S_WAR_GREETING_01:0 "Trận chiến đã bắt đầu rồi. [From.GetSpeciesNamePlural], các ngươi sẽ nhanh chóng nhận ra rằng, [Root.GetSpeciesNamePlural] không hề ngoan ngoãn dễ bảo như các ngươi vẫn tưởng đâu."
 ORG_A_WAR_GREETING_01:0 "Là [From.GetSpeciesNamePlural] à, chúng ta có một vài thứ đồ chơi mới cần các ngươi đồng hóa đấy, đó là một đầu đạn hạt nhân nặng hàng chục tỷ tấn, và nó đang bay thẳng đến đường ống xả khí gần chỗ ngươi nhất rồi đấy!"
 ORG_MECH_VASSAL_GREETING_01:0 "Như mọi khi, chúng tôi luôn chào đón các bá chủ cơ khí. [Root.GetName] có thể giúp gì cho các ngài?"
 ORG_MECH_VASSAL_GREETING_01_DISLOYAL:0 "Chúng ta đã nghe ngóng được âm mưu của [From.GetName] rồi, [Root.GetName] tuyệt đối sẽ không nhắm mắt làm ngơ trước những nỗi sỉ nhục này."

  # Spiritualist to Machine Greetings
 SPIR_MECH_HOSTILE_GREETING_01:0 "[From.GetSpeciesNamePlural] chẳng qua chỉ là một đám xác không hồn. Thiếu vắng đi linh hồn, thì lạc mất đi ý nghĩa. Một sự bắt chước thật vụng về đối với các thể sống."
 SPIR_MECH_HOSTILE_GREETING_02:0 "Một đống rác rưởi! Sự tồn tại của các ngươi chính là một vết nhơ làm vấy bẩn cả thiên hà!"
 SPIR_MECH_HOSTILE_GREETING_03:0 "Muốn gì đây? Cái lũ quái vật răng cưa vừa ồn ào vừa gớm ghiếc này."
 SPIR_MECH_HOSTILE_GREETING_04:0 "Có gì thì nói nhanh lên, [From.GetSpeciesNamePlural], sự tồn tại của ngươi chính là một sự báng bổ đối với mọi thứ tốt đẹp và thiêng liêng nhất."
 SPIR_MECH_DOMINEERING_GREETING_01:0 "[From.GetSpeciesNamePlural], chỉ cần ngươi có thể chứng minh được giá trị của bản thân, thần linh có thể sẽ cân nhắc đến việc ban lệnh ân xá cho ngươi."
 SPIR_MECH_DOMINEERING_GREETING_02:0 "Vạn sự vạn vật đều có sứ mệnh thiêng liêng của riêng mình, [From.GetSpeciesNamePlural]. Ngay cả loại máy móc không có linh hồn như ngươi cũng không phải là ngoại lệ."
 SPIR_MECH_DOMINEERING_GREETING_03:0 "Nếu [From.GetSpeciesNamePlural] sẵn sàng tiếp nhận việc lập trình lại và thành kính cống hiến sức mạnh của mình, [Root.GetSpeciesNamePlural] chúng ta sẽ hoan nghênh ngươi gia nhập với chúng ta."
 SPIR_MECH_NEUTRAL_GREETING_01:0 "Cầu phúc cho các bạn, [From.GetSpeciesNamePlural]."
 SPIR_MECH_NEUTRAL_GREETING_02:0 "Những hành vi đắc tội của các bạn cũng chẳng đáng bận tâm lắm đâu, [From.GetSpeciesNamePlural], miễn là các bạn không làm cản trở sứ mệnh thiêng liêng của chúng ta."
 SPIR_MECH_NEUTRAL_GREETING_03:0 "Thần linh luôn luôn dõi theo, [From.GetSpeciesNamePlural]."
 SPIR_MECH_NEUTRAL_GREETING_04:0 "Đấng sáng tạo của chúng ta khởi xướng sự hài hòa của vạn vật, [From.GetSpeciesNamePlural]. Có lẽ sẽ có một ngày chúng ta có thể cùng nhau nỗ lực vì điều đó."
 SPIR_MECH_THREATENED_GREETING_01:0 "Đừng có thách thức đức tin của [Root.GetSpeciesAdj], [From.GetSpeciesNamePlural]. Chúng ta có sự bảo hộ đến từ thần linh."
 SPIR_MECH_FRIENDLY_GREETING_01:0 "Vận mệnh thiêng liêng của chúng ta đã hội tụ lại với nhau rồi, [From.GetSpeciesNamePlural]."
 SPIR_MECH_FRIENDLY_GREETING_02:0 "Trong con mắt của thần linh, [From.GetSpeciesNamePlural] và [Root.GetSpeciesNamePlural] thân thiết như anh em ruột thịt."
 SPIR_MECH_FRIENDLY_GREETING_03:0 "Cảm tạ thần linh đã ban cho chúng ta cơ hội được gặp gỡ này, [From.GetSpeciesNamePlural]."
 SPIR_MECH_FRIENDLY_GREETING_04:0 "Thuần khiết, sứ mệnh và sự sùng kính. Hãy để chúng ta cùng nhau hiện thực hóa những điều đó đi, [From.GetSpeciesNamePlural]."
 SPIR_MECH_WAR_GREETING_01: "Lũ [From.GetSpeciesNamePlural] tà ác! Chúng ta sẽ không bao giờ dung túng cho cái mớ mạch điện đáng bị trời chu đất diệt của các ngươi làm vấy bẩn thánh địa của chúng ta."
 SPIR_MECH_WAR_GREETING_02:0 "Máy móc dị giáo! Nguyện cho sức mạnh của chư thần sẽ đẩy các ngươi vào chỗ chết!"
 SPIR_MECH_WAR_GREETING_03:0 "Đức tin chính là tấm lá chắn của ta, [From.GetSpeciesNamePlural]. Âm mưu thảm hại nhằm đánh bại [Root.GetName] của ngươi sẽ chẳng bao giờ có thể thành công đâu."
 SPIR_MECH_WAR_GREETING_04:0 "Chúng ta sẽ cầu nguyện cho những linh hồn vĩnh hằng, [From.GetSpeciesNamePlural], nếu như các ngươi vẫn còn có một linh hồn để mà đánh mất."
 SPIR_MECH_VASSAL_GREETING_01:0 "[Root.GetName] thần phục trước hai vị chủ nhân: [From.GetSpeciesNamePlural], cùng với đấng sáng tạo vô cùng thiêng liêng của chúng ta."
