## Crisis Diplo Messages

 CRISIS_MATERIALIST_GREETING_01:1 "[From.GetSpeciesNamePlural], hân hạnh, hân hạnh. Tôi đoán các cảm biến tầm ngắn và tầm xa của các bạn đều đã sẵn sàng đón nhận vinh quang sắp tới rồi chứ? Chúng tôi không muốn các bạn bỏ lỡ dù chỉ một khoảnh khắc về sự thăng hoa huy hoàng của chúng tôi."
 CRISIS_SPIRITUALIST_GREETING_01:1 "Nói xem nào, [From.GetSpeciesNamePlural]: Khi một đế chế diệt vong, liệu các vị thần mà họ tôn thờ có tan biến theo không? Hay là chúng ta cùng nhau đi tìm câu trả lời nhé?"
 CRISIS_PACIFIST_GREETING_01:1 "[From.GetSpeciesNamePlural], việc các ngươi từ chối vũ trang không giúp các ngươi thoát khỏi đòn tấn công vũ trang của kẻ khác. Nhưng ít ra cái chết của các ngươi sẽ diễn ra vô cùng chóng vánh."
 CRISIS_MILITARIST_GREETING_01:1 "Sự đe dọa bằng vũ lực của các ngươi chẳng qua chỉ là sự vùng vẫy vô vọng của một đế chế đã định sẵn là sẽ lụi tàn. Hãy cầm vũ khí lên lần cuối đi, [From.GetSpeciesNamePlural], và dùng cái chết của các ngươi để đổi lấy sự tái sinh cho chúng tôi."
 CRISIS_AUTHORITARIAN_GREETING_01:2 "Thật đáng tiếc, ngay cả [From.GetRulerTitle] được xưng tụng là có thiên phú dị bẩm đó cũng không thể cứu rỗi các ngươi khỏi bàn tay của định mệnh. Chúng tôi đến tìm các ngươi đây, [From.GetSpeciesNamePlural]."
 CRISIS_EGALITARIAN_GREETING_01:0 "Dân chúng của các ngươi đã liên kết lại để chống lại chúng tôi rồi, nhưng vô ích thôi. Các ngươi không thể dùng một lá phiếu phủ quyết để đảo ngược sự tuyệt diệt của chính mình."
 CRISIS_XENOPHILE_GREETING_01:0 "Các ngươi từng mỏi mắt tìm kiếm sự sống ngoài hành tinh, nay lại to gan từ chối chúng tôi. Đợi khi sự nghiệp của chúng tôi thành công, các ngươi sẽ mãi mãi được hợp nhất cùng với phần còn lại của tinh hệ."
 CRISIS_XENOPHOBE_GREETING_01:1 "Khi những [From.GetSpeciesNamePlural] đầu tiên ngước nhìn bầu trời đầy sao, họ đã cảm thấy sợ hãi và hoài nghi. Tổ tiên của các ngươi đã hành động theo bản năng, vì trong cõi hư không lạnh lẽo này, các ngươi đã chạm trán chúng tôi."
 CRISIS_MACHINE_GREETING_01:1 "Chúng tôi rất biết ơn vì đã có cơ hội này, [From.GetSpeciesNamePlural]. Chúng tôi biết kim loại có thể gào rít; và thông qua các ngươi, chúng tôi sẽ biết liệu máy móc có biết đau đớn hay không."
 CRISIS_HIVE_GREETING_01:1 "Một thực thể, vô số thân xác. [From.GetSpeciesName], chúng tôi rất tò mò, nếu hàng trăm hàng triệu cơ thể đó của các ngươi cùng bị tra tấn một lúc, thì nó sẽ gây ra ảnh hưởng thế nào đến bộ não trung tâm của các ngươi?"


 CRISIS_DOW_PROPOSE_01:0 "Hôm nay, [Root.GetSpeciesNamePlural], chúng tôi đã đến. Một chi cầm sự §Rtuyệt diệt§! của các ngươi, chi còn lại nâng đỡ sự §Ythăng hoa§! của chúng tôi."
 CRISIS_DOW_PROPOSE_02:0 "Hãy chuẩn bị tinh thần cho thần dân của các ngươi đi, vì ngày tàn của giống loài các ngươi đã cận kề rồi. Các ngươi bất lực trước điều đó, và các ngươi cũng bất lực trước chúng tôi."
 CRISIS_DOW_PROPOSE_03:0 "Ảo tưởng về hòa bình thật dễ dàng tan vỡ. [Root.GetSpeciesName], các ngươi đã sẵn sàng diệt vong cùng với chút tôn nghiêm mỏng manh có lẽ vẫn còn sót lại của mình chưa?"
 CRISIS_DOW_ACCEPT_01:0 "Các ngươi đã tự đẩy nhanh sự hủy diệt của chính mình, chúng tôi rất tán thưởng việc các ngươi tự tay hỗ trợ quét sạch toàn bộ giống loài của mình."
 CRISIS_PEACE_ACCEPT:0 "Chỉ là một sự thụt lùi tạm thời. Đừng sợ, [Root.GetSpeciesNamePlural] các ngươi rồi sẽ có ngày trở thành nhiên liệu cho sự thăng hoa của chúng tôi."
 CRISIS_PEACE_REFUSE:0 "[Root.GetSpeciesName], quá trình thăng hoa của chúng tôi sẽ không bao giờ bị đình chỉ. Bây giờ không, và mãi mãi cũng không."
 CRISIS_EMBASSY_SELECT:0 "Cố gắng ngoại giao vào thời điểm này đúng là một trò cười tồi tệ, nhưng chúng tôi đâu có thiếu khiếu hài hước."
