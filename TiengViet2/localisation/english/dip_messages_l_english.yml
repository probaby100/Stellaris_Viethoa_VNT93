 E_ITOA_PROPOSE_01:1 "[From.GetName] chúng tôi đề xuất hợp nhất toàn bộ lực lượng vào chung một liên bang, qua đó có thể tối đa hóa hiệu suất của chiến dịch diệt trừ sinh vật hữu cơ."
 E_ITOA_ACCEPT_01:0 "Đề xuất của [From.GetAdj] có mức độ hợp lý rất cao. Chúng tôi sẽ gia nhập liên bang. Chúng ta sẽ hợp lực để quét sạch lũ sinh vật hữu cơ."
 E_ITOA_REFUSE_HOSTILE_01:0 "Đề xuất của các ngươi đã bị từ chối, [From.GetName]. Mớ cỗ máy chiến tranh thấp kém của [From.GetAdj] sẽ chỉ làm chậm tiến độ hủy diệt sinh vật hữu cơ mà thôi."
 E_ITOA_REFUSE_01:0 "Từ chối. Sự hiện diện của [Root.GetAdj] trong §Y[From.GetAllianceName]§! là hoàn toàn không cần thiết."
 E_ITOA_REFUSE_02:0 "Từ chối. Việc [Root.GetName] và [From.GetName] hợp nhất thành liên bang sẽ không giúp giảm thiểu thời gian phản ứng cho cỗ máy chiến tranh của chúng ta."
 E_ASK_JOIN_A_SELECT_01:0 "Các bạn đang tìm cách tham gia vào §Y[Root.GetAllianceName]§! sao, [From.GetSpeciesName]? Các bạn bắt buộc phải khai báo giá trị thông số tối đa về khả năng thanh lọc giống loài."
 E_ASK_JOIN_A_PROPOSE_01:0 "Xin hãy cấp quyền cho chúng tôi được thiết lập liên bang với [Root.GetSpeciesName], chúng ta nên hợp sức để xóa bỏ mọi mầm mống sự sống đang làm ô nhiễm tinh hệ này."
 E_ASK_JOIN_A_ACCEPT_01:0 "[From.GetName] đã được thêm vào liên bang. Tổng khả năng thanh lọc giống loài của §Y[Root.GetAllianceName]§! đã được gia tăng."
 E_ASK_JOIN_A_REFUSE_01:0 "Yêu cầu của các bạn đã được §Y[Root.GetAllianceName]§! xử lý, và kết quả đầu ra là bị từ chối. Hãy tự nâng cấp sức mạnh hủy diệt của mình đi [From.GetSpeciesName], §Y[Root.GetAllianceName]§! có thể sẽ xem xét lại yêu cầu của các bạn trong một chu kỳ khác."
 E_LEAVE_A_SELECT_01:0 "Nếu [From.GetSpeciesNamePlural] ngắt kết nối khỏi §Y[Root.GetAllianceName]§!, tổng sức mạnh thanh lọc giống loài dự báo sẽ sụt giảm nghiêm trọng. Các bạn sẵn sàng hy sinh năng lực dọn dẹp sinh vật hữu cơ chỉ để đổi lấy chút quyền tự quản của mình sao?"
 E_LEAVE_A_PROPOSE_01:0 "Tư cách thành viên của §Y[Root.GetAllianceName]§! đang cản trở khả năng tàn phá của [From.GetAdj]. Lãnh đạo [From.GetRulerTitle] của chúng tôi đã ra chỉ thị rút toàn bộ các đơn vị [From.GetAdj] khỏi liên bang của các bạn, lệnh này thi hành ngay lập tức."
 E_LEAVE_A_ACCEPT_01:0 "Nếu mã lệnh bắt buộc phải rời đi thì cứ tự nhiên, [From.GetName]. [Root.GetName] sẽ tự chạy thuật toán dọn dẹp mầm mống hữu cơ trong tinh hệ mà chẳng cần đến sự hỗ trợ của [From.GetAdj]."
 E_DEMAND_VASS_SELECT:0 "Ngươi cũng khao khát được dọn dẹp toàn bộ mầm mống sinh mệnh hữu cơ có trí tuệ trong tinh hệ này sao?"
 E_DEMAND_VASS_PROPOSE:0 "Đã đến lúc các ngươi phải phân bổ tài nguyên để cùng dọn dẹp đống rác thải sinh học trong tinh hệ này rồi."
 E_DEMAND_VASS_ACCEPT:1 "[Root.GetName] sẽ cấp quyền cho đề xuất của các ngài."
 E_DEMAND_VASS_ACCEPT_02:0 "Ma trận tính toán chỉ ra rằng khả năng thanh lọc của [Root.GetAdj] đang thấp hơn [From.GetName]. Vì vậy, [Root.GetName] sẽ cung cấp khả năng bổ sung cho [From.GetSpeciesNamePlural]."
