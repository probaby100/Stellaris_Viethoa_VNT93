# Nomads

 01_NOMAD_HOSTILE_GREETING_FROM: "Các ngươi tự cắm cọc giữ chân mình trên đất mẹ như những chiếc mỏ neo, hỡi những [From.GetSpeciesNamePlural] của [From.Capital.GetName]. Đó là lý do hạm đội của các ngươi chẳng bao giờ thực sự vươn mình lên không trung."
 02_MACHINE_NOMAD_HOSTILE_GREETING_FROM: "[From.GetSpeciesNamePlural] mang tính bất động. [Root.GetSpeciesNamePlural] thì không. Sự khác biệt này rồi sẽ trở nên vô cùng quan trọng."
 02_HIVE_NOMAD_HOSTILE_GREETING_FROM: "[From.GetSpeciesNamePlural] đã cắm rễ sâu vào đất. [Root.GetSpeciesNamePlural] thì không. Sự khác biệt này rồi sẽ có ý nghĩa quyết định."
 03_MEGACORP_NOMAD_HOSTILE_GREETING_FROM: "[From.GetName] cứ khăng khăng ôm lấy những tài sản đang mất giá. Còn chúng tôi chỉ tập trung vào mục tiêu thôi, hỡi [From.GetSpeciesNamePlural]."
 04_SPIRITUALIST_NOMAD_HOSTILE_GREETING_FROM: "Các ngươi tự xích mình vào đất đai rồi gọi đó là sự ổn định, [From.GetSpeciesNamePlural]. [Root.GetName] đã sớm rũ bỏ thứ ảo tưởng ấy."
 05_MILITARIST_NOMAD_HOSTILE_GREETING_FROM: "Chúng tôi đã tồn tại lâu hơn cả những đế chế vững chãi hơn [From.GetName] nhiều. Đừng có dại mà thử thách [Root.GetName]."

 01_NOMAD_NEUTRAL_GREETING_FROM: "Chúng tôi là đoàn hạm đội nối liền giữa các vì sao, [From.GetSpeciesNamePlural]. Mời nói rõ mục đích của các bạn."
 02_MACHINE_NOMAD_NEUTRAL_GREETING_FROM: "Mô hình du mục của [Root.GetName] đã được xác lập. Cho phép kết nối thông tin với [From.GetName]."
 02_HIVE_NOMAD_NEUTRAL_GREETING_FROM: "[Root.GetName] di chuyển qua hư không như một thể thống nhất. [From.GetName] đã bước vào tầm nhận thức của chúng ta."
 03_MEGACORP_NOMAD_NEUTRAL_GREETING_FROM: "Bạn đã kết nối với [Root.GetName]. Cuộc gọi có thể sẽ tính phí chuyển vùng quốc tế đấy, [From.GetSpeciesNamePlural]."
 04_SPIRITUALIST_NOMAD_NEUTRAL_GREETING_FROM: "Chúng tôi dạo bước trên những con đường vô tận giữa các vì sao. Người [From.GetSpeciesNamePlural] của [From.GetName], các bạn đang tìm kiếm điều gì?"
 05_MILITARIST_NOMAD_NEUTRAL_GREETING_FROM: "Đoàn tàu hộ vệ của [Root.GetName] đã sẵn sàng. Hãy nêu rõ ý định của các bạn, [From.GetSpeciesNamePlural]."

 01_NOMAD_FRIENDLY_GREETING_FROM: "Chặng đường phía trước còn rất dài. Rất vui vì được bắt gặp [From.GetSpeciesNamePluralCompliment] tại [From.GetName]."
 02_MACHINE_NOMAD_FRIENDLY_GREETING_FROM: "Sự xuất hiện của [From.GetName] không gây ra đe dọa. Hợp tác với [From.GetSpeciesNamePlural] là điều hoàn toàn chấp nhận được."
 02_HIVE_NOMAD_FRIENDLY_GREETING_FROM: "Sự hiện diện của [From.GetSpeciesNamePlural] không mang theo bất kỳ mối đe dọa nào. Chúng ta như một thể thống nhất xin rộng mở tâm trí chào đón [From.GetName]. Rất hoan nghênh các bạn ghé thăm."
 03_MEGACORP_NOMAD_FRIENDLY_GREETING_FROM: "Những gương mặt thân thiện đến từ [From.GetName]. Thật là một mối quan hệ rủi ro thấp đem lại sự dễ chịu."
 04_SPIRITUALIST_NOMAD_FRIENDLY_GREETING_FROM: "Cầu mong hành trình của bạn luôn có những vì sao cố định dẫn lối, và mong rằng những [From.GetSpeciesEarNamePlural] kia sẽ luôn bắt trọn bản tình ca của hư không trước khi giông bão kéo đến."
 05_MILITARIST_NOMAD_FRIENDLY_GREETING_FROM: "Bạn đã giành được sự nể trọng từ [Root.GetName], hỡi [From.GetSpeciesNamePluralCompliment]. Cứ tự nhiên mở lời."

 01_NOMAD_WAR_GREETING_FROM: "Các ngươi không thể giam giữ một thứ chưa từng dừng lại, [From.GetSpeciesNamePlural]."
 02_MACHINE_NOMAD_WAR_GREETING_FROM: "[From.GetName] đang cố gắng giao chiến với những mục tiêu rải rác. Hiệu suất cực kỳ thấp."
 02_HIVE_NOMAD_WAR_GREETING_FROM: "[From.GetName] vươn tay ra định bắt lấy bầy đàn. Nhưng chỉ nhận lại khoảng không vô định, chẳng có chỗ nào để tóm lấy."
 03_MEGACORP_NOMAD_WAR_GREETING_FROM: "[From.GetName] đã phát động một vụ thâu tóm thù địch. Chúng tôi sẽ đáp trả bằng một đợt tái cấu trúc quyết liệt."
 04_SPIRITUALIST_NOMAD_WAR_GREETING_FROM: "Hư không sẽ truyền đi những tiếng vọng sai lầm của các ngươi tới tận [From.GetSpeciesEarNamePlural] của thế hệ [From.GetSpeciesSpawnNamePlural], hỡi [From.GetSpeciesNamePlural]. Họ sẽ hiểu đây chính là lựa chọn của các ngươi."
 05_MILITARIST_NOMAD_WAR_GREETING_FROM: "Rồi bạn sẽ nhận ra, việc tóm gáy hạm đội của [Root.GetName] còn khó hơn nhiều so với việc chọc tức họ."

 01_NOMAD_ARROGANT_GREETING_FROM: "Chúng tôi chẳng cần đến các hành tinh, [From.GetSpeciesNamePlural]. [Root.GetName] thản nhiên đón nhận mọi thứ mà hệ sao mang lại."
 02_MACHINE_NOMAD_ARROGANT_GREETING_FROM: "Sự phụ thuộc của [From.GetSpeciesName] vào các tài sản cố định thật là nguyên thủy."
 02_HIVE_NOMAD_ARROGANT_GREETING_FROM: "[From.GetSpeciesName] tự xích mình vào các hành tinh. Bầy đàn không thể hiểu nổi sự yếu đuối này."
 03_MEGACORP_NOMAD_ARROGANT_GREETING_FROM: "Các ngươi đo lường giàu sang bằng lãnh thổ, [From.GetSpeciesNamePlural]. Còn [Root.GetName] lại đong đếm nó bằng cơ hội."
 04_SPIRITUALIST_NOMAD_ARROGANT_GREETING_FROM: "Các ngươi đã nhầm lẫn sự bất động với giác ngộ, [From.GetSpeciesNamePlural]."
 05_MILITARIST_NOMAD_ARROGANT_GREETING_FROM: "Hãy ghi nhớ điều này, [From.GetSpeciesNamePlural]: [Root.GetName] sẽ không bắn cảnh cáo đâu."

 01_NOMAD_BELLIGERENT_GREETING_FROM: "Cẩn thận từng bước đi đấy, [From.GetSpeciesNamePlural]. [Root.GetSpeciesMouthName] của chúng tôi từng đưa ra lời cảnh báo cho những đế chế hùng mạnh hơn các ngươi nhiều. Con đường của chúng tôi chưa đến lượt các ngươi ngáng lối."
 02_MACHINE_NOMAD_BELLIGERENT_GREETING_FROM: "[From.GetName] đang cản trở tuyến di chuyển tối ưu. Hãy điều chỉnh ngay lập tức."
 02_HIVE_NOMAD_BELLIGERENT_GREETING_FROM: "[From.GetName] đang chặn đứng dòng chảy. Bầy đàn sẽ không bao giờ ngừng lại."
 03_MEGACORP_NOMAD_BELLIGERENT_GREETING_FROM: "[From.GetName] đang gây tổn hại cho đợt hành động hiện tại. Điều này hoàn toàn không có lợi cho bạn đâu."
 04_SPIRITUALIST_NOMAD_BELLIGERENT_GREETING_FROM: "Đừng cản trở con đường tiến về phía trước của chúng tôi, [From.GetSpeciesNamePlural]."
 05_MILITARIST_NOMAD_BELLIGERENT_GREETING_FROM: "Tránh đường ra, [From.GetSpeciesNamePlural], nếu không [Root.GetName] sẽ thẳng tay tống cổ các ngươi đi."

 01_NOMAD_CUSTODIAL_GREETING_FROM: "Con đường phía trước đang ngày càng mịt mù, [From.GetSpeciesNamePlural]. [Root.GetName] sẽ sát cánh bên bất kỳ ai sẵn lòng giữ cho các vì sao tiếp tục tỏa sáng."
 02_MACHINE_NOMAD_CUSTODIAL_GREETING_FROM: "Đã xác nhận mối đe dọa mang tính hệ thống. [Root.GetName] sẽ phối hợp với [From.GetName] để duy trì sự sống còn."
 02_HIVE_NOMAD_CUSTODIAL_GREETING_FROM: "Bóng tối đã bao trùm lên mọi sinh linh. [Root.GetName] cùng kề vai sát cánh với [From.GetName]. Chúng ta sẽ cùng nhau vượt qua sóng gió này."
 03_MEGACORP_NOMAD_CUSTODIAL_GREETING_FROM: "Một cuộc khủng hoảng quy mô thế này đe dọa cả [Root.GetName] lẫn [From.GetName]. Hợp tác... tạm thời là điều có lợi."
 04_SPIRITUALIST_NOMAD_CUSTODIAL_GREETING_FROM: "Khi màn đêm buông xuống, ngay cả những kẻ lang bạt cũng phải trở thành người chăn cừu. Hãy bước đi cùng chúng tôi, [From.GetSpeciesNamePlural]."
 05_MILITARIST_NOMAD_CUSTODIAL_GREETING_FROM: "Dù thứ gì sắp giáng xuống thiên hà này, chúng cũng sẽ phải đối mặt với hạm đội của [Root.GetName] đầu tiên. Sát cánh chiến đấu cùng chúng tôi, hoặc là lui sang một bên."

 01_NOMAD_OVERLORD_GREETING_FROM: "[Root.GetName] đang phản hồi tín hiệu của bạn. Bên bảo hộ [From.GetName] có dặn dò gì cho hạm đội?"
 02_MACHINE_NOMAD_OVERLORD_GREETING_FROM: "Đã xác nhận thẩm quyền của [From.GetName]. [Root.GetName] đang chờ nhập lệnh."
 02_HIVE_NOMAD_OVERLORD_GREETING_FROM: "Ý chí của [From.GetName] đã được cảm nhận. [Root.GetName] đang lắng nghe."
 03_MEGACORP_NOMAD_OVERLORD_GREETING_FROM: "[Root.GetName] đang lắng nghe. Hãy cùng [From.GetName] rà soát lại các nghĩa vụ, khoản hỗ trợ và kỳ vọng."
 04_SPIRITUALIST_NOMAD_OVERLORD_GREETING_FROM: "Chúng tôi bước đi trên con đường sao dưới sự bảo hộ của bạn, [From.GetName]. Xin cứ nói, [Root.GetSpeciesEarNamePlural] của chúng tôi luôn lắng nghe."
 05_MILITARIST_NOMAD_OVERLORD_GREETING_FROM: "Đoàn tàu hộ vệ của [Root.GetName] luôn giữ trạng thái sẵn sàng chiến đấu, nghe theo mệnh lệnh của [From.GetName]. Xin hạ lệnh."

 01_NOMAD_HOSTILE_GREETING_TO: "Thì ra đây là những kẻ lang bạt [From.GetName]. Không hành tinh mẹ, sống đời trôi nổi — ấy thế mà khi nghe thấy tiếng gọi của chúng ta, mấy chiếc [From.GetSpeciesEarNamePlural] đó vẫn dựng ngược lên. Chắc các ngươi cô đơn lắm nhỉ."
 02_MACHINE_NOMAD_HOSTILE_GREETING_TO: "[From.GetName] thể hiện sự lang thang thiếu hiệu quả. Một văn minh không có điểm neo thế giới nên bị xóa sổ khỏi bản ghi thiên hà."
 02_HIVE_NOMAD_HOSTILE_GREETING_TO: "[From.GetName] đi lang bạt khắp nơi, chẳng có nổi một cái tổ để kiếm ăn. Thiên hà nên tiến hóa đến một trạng thái mà các ngươi không còn tồn tại."
 03_MEGACORP_NOMAD_HOSTILE_GREETING_TO: "Không văn phòng, không cổ phần, không tài sản cố định. Nói cho chúng tôi nghe xem, [From.GetName], sao bạn vẫn chưa nộp đơn phá sản đi?"
 04_SPIRITUALIST_NOMAD_HOSTILE_GREETING_TO: "Không thánh địa, cũng chẳng có quê hương thiêng liêng, các ngươi lang bạt khắp nơi, hỡi [From.GetSpeciesNamePlural], nuôi nấng thế hệ [From.GetSpeciesSpawnNamePlural] trong màn đêm giá lạnh. Thật là một kiểu sống đáng thương."
 05_MILITARIST_NOMAD_HOSTILE_GREETING_TO: "Một chủng tộc không có lãnh thổ chỉ cách thảm họa diệt vong đúng một thất bại. Hãy nhớ kỹ điều đó, [From.GetSpeciesNamePlural]."

 01_NOMAD_NEUTRAL_GREETING_TO: "Chúng tôi đang nhận tín hiệu liên lạc từ bạn, [From.GetName]. Bạn muốn thảo luận về điều gì?"
 02_MACHINE_NOMAD_NEUTRAL_GREETING_TO: "Đã xác nhận mô hình du mục của [From.GetName]. Hãy nêu rõ mục đích."
 02_HIVE_NOMAD_NEUTRAL_GREETING_TO: "[From.GetName] trôi dạt cùng chúng ta. Bầy đàn đã nhận ra bạn. Hãy nói ra mục đích của mình."
 03_MEGACORP_NOMAD_NEUTRAL_GREETING_TO: "[From.GetSpeciesNamePluralCompliment] của [From.GetName], kênh này đang mở. Đây là một đề xuất thương mại, một cuộc đàm phán, hay là một thông báo về trách nhiệm?"
 04_SPIRITUALIST_NOMAD_NEUTRAL_GREETING_TO: "Những lữ khách của hư không, chúng tôi nghe thấy các bạn rồi. Điều gì đã khiến [From.GetSpeciesNamePlural] thu hút sự chú ý của chúng tôi?"
 05_MILITARIST_NOMAD_NEUTRAL_GREETING_TO: "Đoàn hộ vệ [From.GetName], hãy báo cáo mục đích đến đây."

 01_NOMAD_FRIENDLY_GREETING_TO: "[From.GetName], chúng tôi luôn hoan nghênh tín hiệu từ bạn. Chúng tôi có thể giúp gì cho chuyến hành trình của bạn?"
 02_MACHINE_NOMAD_FRIENDLY_GREETING_TO: "Đã nhận dạng và cấp phép cho mô hình hạm đội của [From.GetName]. Xin nêu rõ yêu cầu."
 02_HIVE_NOMAD_FRIENDLY_GREETING_TO: "Sự xuất hiện của [From.GetName] đã được bầy đàn ghi nhận. Các bạn không bị xua đuổi ở đây. Các bạn muốn tìm kiếm điều gì?"
 03_MEGACORP_NOMAD_FRIENDLY_GREETING_TO: "Ồ, [From.GetName]. Đối tác lưu động ưa thích của chúng tôi. Cơ hội nào đã đưa các bạn đến đây vậy?"
 04_SPIRITUALIST_NOMAD_FRIENDLY_GREETING_TO: "Cầu mong phước lành giáng xuống tàu Ark và thế hệ [From.GetSpeciesSpawnNamePlural] của các bạn, hỡi [From.GetSpeciesNamePlural]. Cứ tự nhiên trải lòng."
 05_MILITARIST_NOMAD_FRIENDLY_GREETING_TO: "[From.GetName] đã giành được sự nể trọng của chúng tôi. Chúng tôi có thể hỗ trợ gì cho đoàn tàu của bạn?"

 01_NOMAD_WAR_GREETING_TO: "Các ngươi không thể trốn chạy mãi được đâu, [From.GetSpeciesNamePlural]. Mỗi một tàu Ark mất đi, ngày tàn của các ngươi lại tiến gần thêm một bước."
 02_MACHINE_NOMAD_WAR_GREETING_TO: "Chuyến di cư của [From.GetName] dừng lại tại đây. Chúng tôi sẽ đánh cho hạm đội của các ngươi tan tành xơ xác."
 02_HIVE_NOMAD_WAR_GREETING_TO: "[From.GetName] dừng bước tại đây. Bầy đàn sẽ càn quét tất cả những gì còn tàn dư."
