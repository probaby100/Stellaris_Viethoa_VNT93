 #01_FORM_FED_PROPOSE:0 "Our alliance is working out so well that we would like to form a full federation. What do you think?"

 #01_ITOF_SELECT:0 "So, you wish us to join the §Y[From.GetAllianceName]§!?"
 #01_ITOF_ACCEPT:0 "We have considered your offer carefully and decided to join the §Y[From.GetAllianceName]§!."
 #01_ITOF_REFUSE:0 "We have discussed your Federation proposal and decided that it is not for us."
 #01_ITOF_PROPOSE:0 "The galaxy is dark and full of terrors, [Root.GetAdj]. Join our Federation for mutual protection?"
 #01_ITOF_VOTE_PROPOSE:0 "Dear ally, we feel that the §Y[Root.GetName]§! would make a valuable addition to our Federation. Shall we ask them?"

 #01_ASK_JOIN_F_SELECT:0 "So, [From.GetSpeciesName], you wish to join the great §Y[Root.GetAllianceName]§!?"
 #01_ASK_JOIN_F_ACCEPT:0 "Very well, our new [From.GetAdj] friend, you may join our great Federation!"
 #01_ASK_JOIN_F_REFUSE:0 "No, you may not join our Federation We do not trust you."
 #01_ASK_JOIN_F_PROPOSE:0 "We would like to join the great §Y[Root.GetAllianceName]§!, if you would have us."

 #01_LEAVE_F_SELECT:0 "Are you planning to leave the §Y[From.GetAllianceName]§!? An ill-considered move..."
 #01_LEAVE_F_PROPOSE:0 "We have decided to leave this Federation. It is only holding us back."
 #01_LEAVE_F_ACCEPT:0 "We are sad and disappointed to see you go, [From.GetAdj]."

 01_RELEASE_SUBJECT_SELECT:0 "Tại sao lại cự tuyệt việc chúng tôi trở thành thần dân của các ngài?"
 01_RELEASE_SUBJECT_PROPOSE:0 "Chúng ta quyết định trả lại tự do cho các bạn. Giữ các bạn lại chỉ tổ vướng chân vướng tay mà thôi."
 01_RELEASE_SUBJECT_ACCEPT:0 "Chúng tôi cảm thấy vô cùng đáng tiếc và thất vọng trước quyết định rút lui của các ngài, [From.GetName]."

 01_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "Các bạn thực sự cho rằng, không cần đến sự che chở của chúng ta thì vẫn có thể sống sót được sao?"
 01_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Chúng tôi tin rằng bản thân hoàn toàn có đủ năng lực để sinh tồn, chúng tôi muốn được đứng trên đôi chân của chính mình."
 01_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Chúng tôi cảm thấy vô cùng đáng tiếc và thất vọng trước quyết định rút lui của các ngài, [From.GetSpeciesName]."
 01_ASK_TO_BE_RELEASED_SUBJECT_REFUSE:1 "Không, đừng hòng đòi độc lập. Nếu chỉ dựa vào chính mình, các bạn sẽ chẳng có cửa nào để sống sót được đâu."

 01_NOT_ACTIVE_IN_WAR_WARNING:0 "Sự thể hiện của các ngươi trong cuộc chiến này là quá đỗi hời hợt. Mau xốc lại tinh thần và tham chiến đi, đừng để chúng ta phải nổi trận lôi đình."
 01_NOT_ACTIVE_IN_WAR:0 "Sự thể hiện của các ngươi trong cuộc chiến này là quá đỗi hời hợt. Chúng ta đã hoàn toàn đánh mất đi niềm tin đối với các ngươi rồi."

 01_REQUEST_WAR_SELECT:1 "Các ngươi muốn khai chiến sao?"
 #01_REQUEST_WAR_PROPOSE:0 "We would like our federation to start a war against the [From.From.GetName]."
 01_REQUEST_WAR_ACCEPT:0 "Chúng tôi đã đi đến quyết định chấp thuận đề xuất chiến tranh của các ngươi."
 01_REQUEST_WAR_REFUSE:0 "Sau khi thảo luận, chúng tôi quyết định bác bỏ đề xuất chiến tranh của các ngươi."

 01_PROPOSE_INVITE_SELECT:1 "Đồng minh mới ư?"
 01_PROPOSE_INVITE_PROPOSE:0 "Chúng tôi kỳ vọng rằng Liên bang sẽ gửi đi lời mời."
 01_PROPOSE_INVITE_ACCEPT:0 "Chúng tôi đã đi đến quyết định đồng ý với đề xuất gửi lời mời của các ngài."
 01_PROPOSE_INVITE_REFUSE:0 "Sau khi thảo luận, chúng tôi đành phải từ chối đề xuất gửi lời mời của các ngài."

 01_OFFER_TRADE_DEAL_GIFT_ACCEPT_FE:0 "Tốt lắm. Chúng ta sẽ ân chuẩn việc tiến cống này của các bạn."
 01_OFFER_TRADE_DEAL_GIFT_ACCEPT_MACHINE_FE:0 "Dữ liệu truyền tải đã được tiếp nhận. [Root.GetName] ghi nhận sự đóng góp của [From.GetSpeciesName] đối với Kế hoạch Giám hộ."
 01_OFFER_TRADE_DEAL_ACCEPT_FE:0 "Thương vụ này cũng có thể châm chước được đấy, [From.GetSpeciesName]. Chúng ta sẽ hạ cố tiến hành giao dịch với các bạn."
 01_OFFER_TRADE_DEAL_ACCEPT_MACHINE_FE:0 "Quá trình đánh giá giao dịch đã hoàn tất. Ngạch mậu dịch đã vượt quá ngưỡng có thể chấp nhận. Đang tiến hành kích hoạt giao thức truyền tải."
 01_OFFER_TRADE_DEAL_REFUSE_FE:0 "Xéo đi, đồ sinh vật nguyên thủy. Chúng ta chẳng có nhu cầu gì với lũ các ngươi cả."
 01_OFFER_TRADE_DEAL_REFUSE_MACHINE_FE:0 "Quá trình đánh giá giao dịch đã hoàn tất. Ngạch mậu dịch chưa đạt đến ngưỡng có thể chấp nhận. Xin vui lòng tinh chỉnh lại thông số và gửi lại."

 01_OFFER_TRADE_DEAL_GIFT_PROPOSE:1 "Xin hãy nể mặt mà thu nhận món quà mọn này, coi như là chút lòng thành thể hiện thiện chí của [From.GetAdjective] đối với [Root.GetName]."
 02_OFFER_TRADE_DEAL_GIFT_PROPOSE:1 "[From.GetRulerTitle] [From.GetRulerName] đã quyết định trao tặng báu vật này cho [Root.GetName], như một minh chứng cho tình hữu nghị bền chặt giữa hai thế lực."
 01_OFFER_TRADE_DEAL_PROPOSE:1 "[From.GetName] đề xuất được tiến hành thương vụ mậu dịch dưới đây."
 02_OFFER_TRADE_DEAL_PROPOSE:0 "[From.GetRulerTitle] [From.GetRulerName] cho rằng ngài chắc hẳn sẽ có hứng thú với thương vụ béo bở này. Ngài có muốn tiếp nhận nó không?"
 03_OFFER_TRADE_DEAL_PROPOSE:0 "Bởi một vài nhân tố nằm ngoài tầm kiểm soát, chúng tôi đành phải mang theo những điều kiện vô cùng hậu hĩnh này để thỉnh cầu được giao thương với các ngài. Cơ hội ngàn năm có một, bỏ lỡ là hết phần nhé!"
 04_OFFER_TRADE_DEAL_PROPOSE:0 "Chúng tôi khao khát được tiến hành đàm phán mậu dịch với Đế chế của ngài. Chẳng hay những điều khoản này Đế chế của ngài có thể hạ cố chấp nhận được không?"
 01_OFFER_TRADE_DEAL_GIFT_ACCEPT:0 "[Root.GetName] vô cùng hoan hỉ tiếp nhận món bảo vật này."
 02_OFFER_TRADE_DEAL_GIFT_ACCEPT:0 "Quả là một món quà hậu hĩnh đấy, [From.GetSpeciesName]. Vô cùng đa tạ."
 01_OFFER_TRADE_DEAL_GIFT_ACCEPT_HOSTILE:0 "Lễ vật tiến cống chừng này vẫn là chưa đủ đô đâu, nhưng chúng ta vẫn sẽ miễn cưỡng thu nhận nó."
 02_OFFER_TRADE_DEAL_GIFT_ACCEPT_HOSTILE:0 "Chúng ta sẽ nhận lấy món quà của ngươi, nhưng đừng có hoang tưởng rằng ân oán giữa chúng ta thế là đã được thanh toán xong xuôi."
 01_OFFER_TRADE_DEAL_ACCEPT:0 "Rất tuyệt. [Root.GetName] cho rằng lời đề nghị của các ngài là hoàn toàn có thể chấp nhận được."
 02_OFFER_TRADE_DEAL_ACCEPT:0 "[Root.GetName] đã quyết định thông qua lời đề nghị mậu dịch của các ngài."
 03_OFFER_TRADE_DEAL_ACCEPT:0 "Sau khi lướt qua đề xuất mậu dịch của các ngài, [Root.GetRulerTitle] [Root.GetRulerName] đã quyết định sẽ thông qua lời đề nghị này."
 04_OFFER_TRADE_DEAL_ACCEPT:0 "Trông có vẻ như đây là một thương vụ khá hời đấy, chúng tôi đồng ý."
 05_OFFER_TRADE_DEAL_ACCEPT:0 "Những điều kiện của các ngài thật là thấu tình đạt lý. [Root.GetName] chấp thuận đề xuất giao thương của các ngài."
 06_OFFER_TRADE_DEAL_ACCEPT:1 "Rất tốt, [Root.GetName] đã quyết định sẽ phê duyệt dự luật mậu dịch của các ngài."
 07_OFFER_TRADE_DEAL_ACCEPT:0 "Thoạt nhìn đã thấy đây là một vố làm ăn quá hời rồi! [Root.GetName] sẽ chấp thuận những điều khoản của các ngài."
 08_OFFER_TRADE_DEAL_ACCEPT:0 "Sau một hồi đắn đo suy nghĩ, [Root.GetRulerTitle] [Root.GetRulerName] đã quyết định sẽ đồng ý với lời mời chào giao thương của các ngài."
 01_OFFER_TRADE_DEAL_REFUSE:0 "Không đời nào. [Root.GetRulerTitle] [Root.GetRulerName] sẽ tuyệt đối không bao giờ nhúng tay vào kiểu làm ăn thế này đâu."
 02_OFFER_TRADE_DEAL_REFUSE:0 "Các bạn nghĩ chúng tôi là một lũ bù nhìn chắc! Chúng tôi cự tuyệt yêu sách của các bạn."
 03_OFFER_TRADE_DEAL_REFUSE:0 "Các bạn thực sự ảo tưởng rằng chúng tôi sẽ gật đầu trước lời đề nghị này sao? Thế này khác nào đang sỉ nhục chúng tôi cơ chứ?"
 04_OFFER_TRADE_DEAL_REFUSE:0 "Cái yêu sách trơ trẽn thế này quả thực là đang làm lãng phí đi quỹ thời gian vàng ngọc của chúng tôi."
 05_OFFER_TRADE_DEAL_REFUSE:0 "[Root.GetName] kiên quyết bác bỏ cái thứ được gắn mác là 'đề xuất mậu dịch' này, nếu như nó vẫn còn đủ tư cách để được gọi là mậu dịch."
 06_OFFER_TRADE_DEAL_REFUSE:0 "[Root.GetRulerTitle] [Root.GetRulerName] sau khi thẩm định qua đề xuất giao thương của các ngài, đã phán rằng [Root.GetName] có mà điên mới đâm đầu vào."
 07_OFFER_TRADE_DEAL_REFUSE:0 "Cái loại đề xuất nhảm nhí này là chiêu trò xảo quyệt gì của các bạn thế? Đừng hòng dùng mấy thứ vớ vẩn này để làm lãng phí thời gian của chúng tôi thêm nữa."
 08_OFFER_TRADE_DEAL_REFUSE:0 "Các ngài có lẽ đang mộng tưởng rằng [Root.GetName] sẽ hoa mắt chóng mặt mà nhắm mắt đưa chân chấp nhận cái đề xuất trơ trẽn này cơ đấy, vô cùng tiếc khi phải dập tắt hy vọng của các ngài rồi."
 #01_CANCEL_TRADE_DEAL_PROPOSE:1 "Regrettably, the [From.GetName] feels that the trade agreement between our nations is no longer in its best interests."
 #02_CANCEL_TRADE_DEAL_PROPOSE:0 "[From.GetRulerTitle] [From.GetRulerName] has decided to terminate the trade agreement between our nations. We regret any inconvenience this may cause."
 #03_CANCEL_TRADE_DEAL_PROPOSE:0 "Thank you for trading with us, but all good things must come to an end. We have decided to unilaterally withdraw from our trade agreement."
 #04_CANCEL_TRADE_DEAL_PROPOSE:0 "The trade agreement we reached has served its purpose. The time has come to end it."
 #01_CANCEL_TRADE_DEAL_ACCEPT:0 "Very well. We accept your decision, even if we do not understand it."
 #02_CANCEL_TRADE_DEAL_ACCEPT:0 "While we think you are making a mistake, the [From.GetName] accepts your decision."
 #03_CANCEL_TRADE_DEAL_ACCEPT:0 "This was certainly... unexpected. Are you certain? Then so be it."
 #04_CANCEL_TRADE_DEAL_ACCEPT:0 "As you wish. I will personally inform [From.GetRulerTitle] [From.GetRulerName] that our trade agreement with your nation has come to an end."

 01_EMBASSY_FRIENDLY:0 "Các ngài muốn thắt chặt thêm sợi dây liên kết giữa chúng ta sao? Mặc dù chúng tôi đã vô cùng trân quý các ngài rồi, nhưng tiến thêm một bước nữa thì cũng có hề gì đâu cơ chứ?"
 02_EMBASSY_FRIENDLY:0 "Các ngài vốn dĩ đã là những bằng hữu tâm giao của [Root.GetName] rồi, nhưng việc tiếp tục bồi đắp mối quan hệ này cũng chẳng có gì là thừa thãi cả."
 03_EMBASSY_FRIENDLY:0 "Tuyệt vời lắm những người anh em, hãy cùng nhau bồi đắp cho tình hữu nghị này thêm phần vững chãi nào!"
 04_EMBASSY_FRIENDLY:0 "Một lời đề nghị vô cùng xác đáng. Hai cường quốc của chúng ta vốn dĩ nên kiến tạo một tình bằng hữu sâu đậm hơn nữa."
 01_EMBASSY_NEUTRAL:0 "Đúng vậy... việc thúc đẩy mối quan hệ với [From.GetName] sẽ mang lại không ít lợi ích cho chúng ta."
 02_EMBASSY_NEUTRAL:0 "Nâng tầm quan hệ song phương có thể giúp chúng ta xua tan đi viễn cảnh... binh đao tương kiến trong tương lai."
 03_EMBASSY_NEUTRAL:0 "Vậy là, các ngài đang có ý định muốn tiến xa hơn với [Root.GetName] sao?"
 04_EMBASSY_NEUTRAL:0 "Chúng tôi hoàn toàn tán thành việc thắt chặt thêm mối quan hệ ngoại giao giữa hai quốc gia."
 01_EMBASSY_HOSTILE:0 "Các ngươi lại đang toan tính âm mưu quỷ kế gì đây?"
 02_EMBASSY_HOSTILE:0 "Các ngươi thực sự ảo tưởng rằng mối quan hệ của chúng ta vẫn còn đường vớt vát sao?"
 03_EMBASSY_HOSTILE:0 "Chúng tôi chẳng đào đâu ra lý do gì để có thể đặt niềm tin vào [From.GetName] cả."
 04_EMBASSY_HOSTILE:0 "Các ngươi đang thật lòng thật dạ đấy, hay là lại đang móc mỉa chúng tôi vậy?"
 01_EMBASSY_DISMISSIVE:0 "Nếu các bạn cứ nằng nặc đòi như vậy, chúng tôi cũng đành chiều theo thôi, nhưng khuyên thật là đừng có ôm mộng tưởng gì quá lớn lao."
 02_EMBASSY_DISMISSIVE:0 "Trò mèo này hoàn toàn vô bổ."
 01_EMBASSY_PATRONIZING:0 "Ngươi muốn được bề trên ban phước cho sự chỉ dẫn sao, hỡi đứa trẻ non nớt?"
 02_EMBASSY_PATRONIZING:0 "Trí tuệ của chúng ta là cao siêu khôn lường, có lẽ ngươi sẽ phải trổ hết tài nghệ thuyết phục may ra mới được ban cho chút đỉnh đấy."
 01_EMBASSY_ANGRY:0 "Ngươi tưởng chúng ta dễ dãi đến mức có thể xí xóa mọi chuyện thế sao, đồ động vật nguyên thủy?"
 02_EMBASSY_ANGRY:0 "Biết thân biết phận một chút đi, may ra chúng ta còn nổi lòng từ bi mà tha thứ cho cái mạng hèn của ngươi."
 01_EMBASSY_PROPOSE:1 "Chúng tôi mong muốn thiết lập một đại sứ quán tại [Root.Capital.GetName], vì sự phát triển tốt đẹp hơn trong tương lai của ngoại giao [From.GetAdj]-[Root.GetAdj]."
 01_EMBASSY_ACCEPT_FRIENDLY:0 "Sự coi trọng của các ngài đối với mối quan hệ song phương quả thực là một niềm vinh hạnh tột bậc."
 02_EMBASSY_ACCEPT_FRIENDLY:0 "Quyết sách này nhất định sẽ mang lại vô vàn lợi ích cho cả hai cường quốc chúng ta."
 03_EMBASSY_ACCEPT_FRIENDLY:0 "Chúng tôi cảm thấy vinh dự vô cùng. Nguyện cho tình hữu nghị của chúng ta mãi mãi trường tồn!"
 04_EMBASSY_ACCEPT_FRIENDLY:0 "Chỉ cần chúng ta kề vai sát cánh, thế gian này sẽ chẳng có thứ thế lực nào đủ sức đe dọa được [Root.GetName] và [From.GetName]!"
 01_EMBASSY_ACCEPT_NEUTRAL:0 "Rất tốt, cứ để xem nước cờ này sẽ đưa quan hệ hai nước trôi dạt về phương trời nào."
 02_EMBASSY_ACCEPT_NEUTRAL:0 "Mong rằng động thái này sẽ phần nào hạ nhiệt bầu không khí căng thẳng giữa đôi bên."
 03_EMBASSY_ACCEPT_NEUTRAL:0 "[Root.GetRulerTitle] [Root.GetRulerName] nhiệt liệt biểu dương lời đề nghị này."
 04_EMBASSY_ACCEPT_NEUTRAL:0 "Việc Đế chế của ngài sẵn lòng dốc tâm huyết vì sự nghiệp phát triển quan hệ hữu nghị song phương, chắc chắn sẽ là bệ phóng vững chắc cho sự thịnh vượng trong tương lai của cả hai bên."
 01_EMBASSY_ACCEPT_HOSTILE:0 "Có lẽ lúc này chắp vá lại mọi thứ vẫn chưa phải là quá muộn. Chúng ta cứ chờ xem sao."
 02_EMBASSY_ACCEPT_HOSTILE:0 "Chúng ta sẽ đưa thành ý của các ngươi lên bàn cân, rồi mới đưa ra phán quyết xem liệu có nên trao niềm tin cho các ngươi hay không."
 03_EMBASSY_ACCEPT_HOSTILE:0 "Hừm. Quả thực chúng ta cũng cần phải nghe ngóng xem mấy tên ngoại giao của các ngươi giở trò trống gì."
 04_EMBASSY_ACCEPT_HOSTILE:0 "Tốt nhất là các ngươi đừng có giở trò mèo gì ra đây."
 01_EMBASSY_ACCEPT_DISMISSIVE:0 "Chúng ta sẽ theo sát nhất cử nhất động của bọn ngoại giao các bạn đấy, [From.GetSpeciesName]."
 02_EMBASSY_ACCEPT_DISMISSIVE:0 "Đừng có tự huyễn hoặc bản thân là đồng minh của chúng ta, chúng ta không bao giờ hạ mình kết thân với bọn man di mọi rợ."
 01_EMBASSY_ACCEPT_PATRONIZING:0 "Biết tìm đến cầu cạnh sự cố vấn của những bậc trưởng bối quả là một nước đi khôn ngoan đấy, [From.GetSpeciesName]."
 02_EMBASSY_ACCEPT_PATRONIZING:0 "Tốt lắm, đứa trẻ non dại. Chúng ta sẽ dốc lòng dìu dắt các bạn."
 01_EMBASSY_ACCEPT_ANGRY:0 "Chúng ta sẽ không dễ dàng dung thứ cho tội lỗi của các bạn đâu, [From.GetSpeciesName]."
 02_EMBASSY_ACCEPT_ANGRY:0 "Linh cảm mách bảo ta rằng đây chỉ là trò giã tràng xe cát mà thôi. Cứ chống mắt lên mà xem."

 01_RECALL_EMBASSY_FRIENDLY:0 "Vẫn luôn tin tưởng tuyệt đối rằng nền tảng quan hệ của chúng ta sẽ mãi luôn vững như bàn thạch."
 02_RECALL_EMBASSY_FRIENDLY:0 "Có phải chúng tôi đã lỡ lời thốt ra điều gì phật ý ngài chăng?"
 03_RECALL_EMBASSY_FRIENDLY:0 "Việc để tuột mất kênh liên lạc ngoại giao quý giá này khiến chúng tôi vô cùng đau xót và tiếc nuối."
 04_RECALL_EMBASSY_FRIENDLY:0 "Có lẽ thứ hình thức ngoại giao này đã không còn giá trị tồn tại nữa rồi."
 01_RECALL_EMBASSY_NEUTRAL:0 "Chẳng nhẽ công cuộc củng cố quan hệ ngoại giao song phương đối với các ngài lại vô nghĩa đến thế sao?"
 02_RECALL_EMBASSY_NEUTRAL:0 "[Root.GetRulerTitle] [Root.GetRulerName] đã từng rất ủng hộ đề xuất của các ngài. Xin đừng làm mất mặt [Root.GetRulerTitle] như vậy chứ."
 03_RECALL_EMBASSY_NEUTRAL:0 "Chúng tôi thực sự muốn biết động cơ đằng sau hành động này của các ngài là gì, [From.GetSpeciesName]."
 04_RECALL_EMBASSY_NEUTRAL:0 "Nếu mối quan hệ của chúng ta vì cớ sự này mà rạn nứt thì quả thực là thảm họa."
 01_RECALL_EMBASSY_HOSTILE:0 "Cái trò hề lố lăng mà các ngươi cố tình bày ra hòng đánh bóng quan hệ song phương quả nhiên là vô tác dụng, đúng y như những gì [From.GetName] đã tiên liệu."
 02_RECALL_EMBASSY_HOSTILE:0 "Các ngươi chỉ đang phí công nhọc sức một cách vô ích thôi, [From.GetRulerTitle]."
 03_RECALL_EMBASSY_HOSTILE:0 "Ơn trời đất."
 04_RECALL_EMBASSY_HOSTILE:0 "Cút xéo về cái máng lợn [From.Capital.GetName] của các ngươi đi, [From.GetSpeciesName]."
 01_RECALL_EMBASSY_DISMISSIVE:0 "Sao ngươi vẫn còn vác cái mặt ở đây?"
 02_RECALL_EMBASSY_DISMISSIVE:0 "......"
 01_RECALL_EMBASSY_PATRONIZING:0 "Nhẫn nại cũng là một loại cảnh giới đấy, đứa trẻ non dại."
 02_RECALL_EMBASSY_PATRONIZING:0 "Ngươi vẫn còn cần đến sự soi đường chỉ lối của chúng ta nhiều lắm, đứa trẻ non dại ạ."
 01_RECALL_EMBASSY_ANGRY:0 "Cái lý lẽ cùn rích đó của các bạn không thể nào tẩy trắng cho những việc dơ bẩn mà các bạn đã làm đâu."
 02_RECALL_EMBASSY_ANGRY:0 "Động thái này chỉ tổ đổ thêm dầu vào ngọn lửa thịnh nộ của chúng ta mà thôi."

 01_RECALL_EMBASSY_PROPOSE:0 "Chúng tôi cho rằng, kế hoạch thiết lập đại sứ quán tốt nhất là nên tạm thời đình chỉ lại thì hơn."

 01_RECALL_EMBASSY_ACCEPT_FRIENDLY:0 "Ôi..."
 02_RECALL_EMBASSY_ACCEPT_FRIENDLY:0 "Dẫu cho giông bão có ập đến, chúng tôi vẫn thiết tha muốn níu giữ mối quan hệ hữu nghị song phương."
 03_RECALL_EMBASSY_ACCEPT_FRIENDLY:0 "Chúng tôi khẩn thiết mong ngài hãy suy xét lại, [From.GetRulerTitle]."
 04_RECALL_EMBASSY_ACCEPT_FRIENDLY:0 "Quả thực là một cú sốc đáng thất vọng."
 01_RECALL_EMBASSY_ACCEPT_NEUTRAL:0 "Nếu đã vậy, đành hẹn dịp khác thôi."
 02_RECALL_EMBASSY_ACCEPT_NEUTRAL:0 "Đây có lẽ là nước đi dĩ hòa vi quý nhất rồi."
 03_RECALL_EMBASSY_ACCEPT_NEUTRAL:0 "Liệu đây có phải là điềm báo cho thấy [From.GetName] đang ấp ủ rắp tâm bất lương?"
 04_RECALL_EMBASSY_ACCEPT_NEUTRAL:0 "Hừm..."
 01_RECALL_EMBASSY_ACCEPT_HOSTILE:0 "Thật thống khoái khi tống khứ được cái mầm mống tai họa như các ngươi."
 02_RECALL_EMBASSY_ACCEPT_HOSTILE:0 "Ta đã cảnh cáo từ sớm rồi, đừng có làm ba cái chuyện ruồi bu vô ích."
 03_RECALL_EMBASSY_ACCEPT_HOSTILE:0 "Thực tế đã đập tan mọi lời ngụy biện rồi nhé, [From.GetSpeciesName]."
 04_RECALL_EMBASSY_ACCEPT_HOSTILE:0 "[From.GetSpeciesName] lại nếm mùi thất bại thảm hại thêm một lần nữa. Chắc mẩm cái cảnh tượng này sau này còn phải chứng kiến dài dài."
 01_RECALL_EMBASSY_ACCEPT_DISMISSIVE:0 "Đúng là phí công vô ích."
 02_RECALL_EMBASSY_ACCEPT_DISMISSIVE:0 "Các bạn đã thỏa mãn với kết quả thí nghiệm của chính mình chưa hả, [From.GetSpeciesName]?"
 01_RECALL_EMBASSY_ACCEPT_PATRONIZING:0 "Các bạn lại một lần nữa phô bày cái bản chất thiển cận vô tri của mình ra rồi đấy, [From.GetSpeciesName]."
 02_RECALL_EMBASSY_ACCEPT_PATRONIZING:0 "Ta còn tưởng các bạn có thể làm nên trò trống gì cơ, thật đáng tiếc thay."
 01_RECALL_EMBASSY_ACCEPT_ANGRY:0 "Cút."
 02_RECALL_EMBASSY_ACCEPT_ANGRY:0 "Còn không mau cút xéo khỏi đây."

 ACTION_RECALL_EMBASSY_PROPOSAL_RECIPIENT:0 "[From.GetName] đã rút đại sứ của họ về nước."

 01_MAKE_RIVAL_FRIENDLY:0 "Thực sự không biết chúng tôi đã phạm phải lỗi lầm tày trời gì mà lại phải chuốc lấy cái cơ sự này."
 02_MAKE_RIVAL_FRIENDLY:0 "Nhưng mà... tại sao lại thành ra thế này?"
 03_MAKE_RIVAL_FRIENDLY:0 "Hành động này của các ngươi là có ý gì thưa [From.GetRulerTitle] [From.GetRulerName]?"
 04_MAKE_RIVAL_FRIENDLY:0 "Xin ngài hãy suy xét lại cẩn thận."
 01_MAKE_RIVAL_NEUTRAL:0 "Các ngươi đang có ý bôi nhọ chúng tôi sao?"
 02_MAKE_RIVAL_NEUTRAL:0 "Thế này là có ý gì đây, [From.GetSpeciesName]?"
 03_MAKE_RIVAL_NEUTRAL:0 "Ban đầu chúng tôi vốn dĩ không hề tin vào những lời đồn đại về thói đạo đức giả của [From.GetSpeciesAdj], không ngờ tất cả lại là sự thật."
 04_MAKE_RIVAL_NEUTRAL:0 "Cái trò bẩn thỉu này không phải chỉ mỗi các ngươi biết chơi đâu nhé."
 01_MAKE_RIVAL_HOSTILE:0 "Thôi bớt cái thói ném đá giấu tay đi, chúng ta chẳng rảnh hơi đâu mà đi chấp nhặt với các ngươi, [From.GetSpeciesName]."
 02_MAKE_RIVAL_HOSTILE:0 "Hehe, không cho các ngươi nếm chút mùi vị cay đắng thì các ngươi chưa biết trời cao đất dày là gì."
 03_MAKE_RIVAL_HOSTILE:0 "Các ngươi thực sự ảo tưởng rằng cứ hắng giọng vài cái là sẽ có người thèm đoái hoài tới sao?"
 04_MAKE_RIVAL_HOSTILE:0 "Ngon thì nhào vô mà kiếm ăn, [From.GetSpeciesName]?"
 01_MAKE_RIVAL_DISMISSIVE:0 "Kẻ thù không đội trời chung ư? Các ngươi tưởng mình là cái thá gì chứ?"
 02_MAKE_RIVAL_DISMISSIVE:0 "Lo thân mình cho tốt trước đi đã, [From.GetSpeciesName]?"
 01_MAKE_RIVAL_PATRONIZING:0 "Các ngươi đang hoang tưởng về cảnh châu chấu đá xe sao?"
 02_MAKE_RIVAL_PATRONIZING:0 "Nực cười hết sức."
 01_MAKE_RIVAL_ANGRY:0 "Đâm đầu vào con đường này thì kẻ phải nếm trái đắng cuối cùng sẽ chỉ là các ngươi thôi."
 02_MAKE_RIVAL_ANGRY:0 "Các ngươi sẽ phải trả cái giá cực kỳ đắt."
 01_MAKE_RIVAL_PROPOSE:1 "Chúng ta cứ ngửa bài nói toạc móng heo ra đi."
 01_MAKE_RIVAL_ACCEPT_FRIENDLY:0 "Thật không ngờ [From.GetSpeciesNamePlural] lại có thể tráo trở đến mức này!"
 02_MAKE_RIVAL_ACCEPT_FRIENDLY:0 "Thế này... quả thực là không thể nào tha thứ nổi."
 03_MAKE_RIVAL_ACCEPT_FRIENDLY:0 "Tôi đã từng mù quáng tin rằng chúng ta là bạn!"
 04_MAKE_RIVAL_ACCEPT_FRIENDLY:0 "[Root.GetSpeciesName] sẽ tạc dạ ghi tâm vết nhơ phản trắc này."
 01_MAKE_RIVAL_ACCEPT_NEUTRAL:0 "Nỗi nhục nhã này chúng tôi sẽ khắc cốt ghi tâm, [From.GetSpeciesName]."
 02_MAKE_RIVAL_ACCEPT_NEUTRAL:0 "Chúng tôi sẽ gậy ông đập lưng ông, đến lúc đó thì đừng có mà trợn tròn mắt lên kinh ngạc nhé."
 03_MAKE_RIVAL_ACCEPT_NEUTRAL:0 "Các ngươi có ý thức được mình vừa chọc vào ổ kiến lửa lớn đến mức nào không hả, [From.GetSpeciesName]."
 04_MAKE_RIVAL_ACCEPT_NEUTRAL:0 "Đã thế thì chiều thôi."
 01_MAKE_RIVAL_ACCEPT_HOSTILE:0 "Cái góc kẹt chật hẹp của các ngươi sẽ sớm bị nghiền nát thành bùn nhão thôi, chống mắt lên mà chờ xem."
 02_MAKE_RIVAL_ACCEPT_HOSTILE:0 "Gửi chiến thư à? Tốt, chúng ta tiếp chiêu!"
 03_MAKE_RIVAL_ACCEPT_HOSTILE:0 "Đợi đến khi hạm đội của chúng ta siết chặt vòng vây [From.Capital.GetName], các ngươi sẽ phải khóc lóc ân hận vì hành động dại dột ngày hôm nay."
 04_MAKE_RIVAL_ACCEPT_HOSTILE:0 "Đấu khẩu lý lẽ với lũ các ngươi đúng là tốn nước bọt vô ích, [From.GetSpeciesName]."
 01_MAKE_RIVAL_ACCEPT_DISMISSIVE:0 "Thích thì cứ tự nhiên. [Root.GetName] căn bản là chẳng thèm để vào mắt đâu."
 02_MAKE_RIVAL_ACCEPT_DISMISSIVE:0 "Sủa xong chưa?"
 01_MAKE_RIVAL_ACCEPT_PATRONIZING:0 "Nếu [From.GetSpeciesName] các ngươi không muốn bị coi như lũ ranh con vắt mũi chưa sạch, thì bớt cái thói đụng tí là giãy nảy lên ăn vạ đi."
 02_MAKE_RIVAL_ACCEPT_PATRONIZING:0 "Cái lũ các ngươi tốt nhất là nên rủ đám trẻ trâu ra góc sân mà tranh giành ngôi vương đi, [From.GetSpeciesName]."
 01_MAKE_RIVAL_ACCEPT_ANGRY:0 "Bộ não của [From.GetSpeciesAdj] rõ ràng là quá mức nguyên thủy, chúng thậm chí còn chẳng thể mường tượng ra nổi hệ lụy kinh hoàng từ hành vi ngu ngốc của chính mình."
 02_MAKE_RIVAL_ACCEPT_ANGRY:0 "Các ngươi đang tự đào mồ chôn mình đấy, lũ man di."
 01_END_RIVALRY_FRIENDLY:0 "[From.GetName] rốt cuộc cũng biết thế nào là thức thời rồi sao?"
 02_END_RIVALRY_FRIENDLY:0 "Ra là ngài hạ mình đến đây để cúi đầu tạ tội sao, thưa [From.GetRulerTitle]?"
 03_END_RIVALRY_FRIENDLY:0 "Các ngươi đang muốn hàn gắn lại vết rạn nứt với chúng tôi sao?"
 04_END_RIVALRY_FRIENDLY:0 "Đâm lén sau lưng chúng tôi một nhát chí mạng, giờ lại còn mặt mũi muốn quay lại làm lành?"
 01_END_RIVALRY_NEUTRAL:0 "Oán thù chồng chất biết bao giờ mới dứt, hay là chúng ta bắt tay giảng hòa đi."
 02_END_RIVALRY_NEUTRAL:0 "Nếu các ngươi thực tâm muốn vớt vát lại mối quan hệ với [Root.GetName], thì chỉ khua môi múa mép suông là chưa đủ đâu."
 03_END_RIVALRY_NEUTRAL:0 "Thú vị đấy, rất thú vị..."
 04_END_RIVALRY_NEUTRAL:0 "Cái nết lật mặt như lật bánh tráng của các ngươi quả thực khiến người ta phải ngán ngẩm, [From.GetSpeciesName]."
 01_END_RIVALRY_HOSTILE:0 "Đúng là trò hề lố lăng."
 02_END_RIVALRY_HOSTILE:0 "Muốn quỳ lạy van xin sao, [From.GetSpeciesName]?"
 03_END_RIVALRY_HOSTILE:0 "[From.GetSpeciesNamePlural] quả nhiên hèn nhát nhu nhược y như những gì giang hồ vẫn đồn thổi."
 04_END_RIVALRY_HOSTILE:0 "Chúng ta chưa bao giờ nhen nhóm ý định khoan hồng cho [From.GetName]."
 01_END_RIVALRY_DISMISSIVE:0 "...... Các ngươi nghĩ chúng tôi rảnh rỗi mà đi bận tâm đến chuyện này sao?"
 02_END_RIVALRY_DISMISSIVE:0 "Ta biết điều này vô cùng trọng đại đối với các ngươi, nhưng thú thật là chúng tôi đếch thèm quan tâm."
 01_END_RIVALRY_PATRONIZING:0 "Một sự lựa chọn sáng suốt đấy, đứa trẻ ngoan."
 02_END_RIVALRY_PATRONIZING:0 "Sao nào, cơn thịnh nộ bốc đồng của các ngươi đã xẹp xuống rồi à?"
 01_END_RIVALRY_ANGRY:0 "Các ngươi làm ơn lắp não vào trước khi hành động được không hả, [From.GetSpeciesName]?"
 02_END_RIVALRY_ANGRY:0 "Rập đầu tạ tội đi, loài vật nguyên thủy, may ra chúng ta còn hỉ xả mà chừa cho một con đường sống."
 01_END_RIVALRY_PROPOSE:1 "Hãy để chúng ta chấm dứt cái chuỗi hận thù vô nghĩa này đi."
 01_END_RIVALRY_ACCEPT_FRIENDLY:0 "Chúng tôi sẽ nỗ lực cắn răng mà tha thứ cho các ngươi, chỉ vì nể tình các ngươi từng là bằng hữu."
 02_END_RIVALRY_ACCEPT_FRIENDLY:0 "Cho đến tận giây phút này, chúng tôi vẫn không tài nào hiểu nổi tại sao các ngươi lại từng coi chúng tôi là kẻ thù không đội trời chung..."
 03_END_RIVALRY_ACCEPT_FRIENDLY:0 "Xóa nhòa đi vết sẹo phản bội này quả thực khó tựa hái sao trời. Nhưng chúng tôi sẽ cố gắng ép bản thân phải quên đi."
 04_END_RIVALRY_ACCEPT_FRIENDLY:0 "Trong con mắt của [Root.GetName], đây là viên gạch nền móng đầu tiên để vá víu lại quan hệ hai bên, và cũng là một bước đi mang tính sống còn."
 01_END_RIVALRY_ACCEPT_NEUTRAL:0 "Tốt lắm."
 02_END_RIVALRY_ACCEPT_NEUTRAL:0 "Vậy thì cứ quyết định thế đi."
 03_END_RIVALRY_ACCEPT_NEUTRAL:0 "Lựa chọn này vẹn cả đôi đường."
 04_END_RIVALRY_ACCEPT_NEUTRAL:0 "Được."
 01_END_RIVALRY_ACCEPT_HOSTILE:0 "Đừng có hoang tưởng rằng chỉ với nhiêu đây là đủ để tẩy trắng cho mối quan hệ giữa chúng ta, [From.GetSpeciesName]."
 02_END_RIVALRY_ACCEPT_HOSTILE:0 "Bớt làm mấy cái chuyện ruồi bu đi."
 03_END_RIVALRY_ACCEPT_HOSTILE:0 "Nhìn cái bộ dạng cụp đuôi cầu xin của các ngươi quả thực khiến ta sảng khoái tột độ, nhưng cái án tử dành cho các ngươi thì vẫn không được ân xá đâu."
 04_END_RIVALRY_ACCEPT_HOSTILE:0 "Đúng là thảm hại hết chỗ nói."
 01_END_RIVALRY_ACCEPT_DISMISSIVE:0 "Cụp đuôi lại mà cút lẹ đi, [From.GetName]."
 02_END_RIVALRY_ACCEPT_DISMISSIVE:0 "Thứ này hoàn toàn vô giá trị."
 01_END_RIVALRY_ACCEPT_PATRONIZING:0 "Xem ra đám trẻ trâu đôi lúc cũng lóe lên được chút ánh sáng trí tuệ."
 02_END_RIVALRY_ACCEPT_PATRONIZING:0 "Rất tốt, các ngươi vẫn còn cả một bầu trời tri thức phải cắp sách đến học hỏi chúng ta đấy."
 01_END_RIVALRY_ACCEPT_ANGRY:0 "Bây giờ mới nhỏ lệ ân hận thì ván đã đóng thuyền rồi."
 02_END_RIVALRY_ACCEPT_ANGRY:0 "Sự ăn năn xám hối của các ngươi bây giờ chỉ rẻ mạt như mớ giấy lộn thôi, [From.GetSpeciesName]."

 01_INTEGRATE_FRIENDLY:0 "[From.GetRulerTitle] [From.GetRulerName] là một vị bằng hữu hoàn toàn có thể gửi gắm niềm tin, [Root.GetName] rất sẵn lòng xem xét đến việc sáp nhập vào [From.GetName]."
 01_INTEGRATE_NEUTRAL:0 "Chúng tôi sẽ rửa tai lắng nghe đề xuất của các ngài."
 01_INTEGRATE_HOSTILE:0 "Các ngươi đang diễn hài đấy à?"
 01_INTEGRATE_DISMISSIVE:0 "Ý tưởng điên rồ hoang đường gì thế này?"
 01_INTEGRATE_PATRONIZING:0 "Khá là thú vị đấy."
 01_INTEGRATE_ANGRY:0 "Cái thói mơ mộng hão huyền này của các bạn đang thách thức giới hạn chịu đựng của chúng ta đấy, [From.GetSpeciesName]."
 01_INTEGRATE_PROPOSE:0 "Hãy dung hợp vào bên trong bờ cõi đế chế của chúng ta đi, [Root.GetSpeciesName]."

 01_INTEGRATE_ACCEPT_FRIENDLY:0 "[Root.GetName] đã chấp thuận lời đề nghị của ngài và chính thức sáp nhập vào [From.GetName], thưa [From.GetRulerTitle] [From.GetRulerName]."
 01_INTEGRATE_ACCEPT_NEUTRAL:0 "Tuyệt vời, [Root.GetName] đã ưng thuận việc sáp nhập vào [From.GetName]."
 01_INTEGRATE_ACCEPT_HOSTILE:0 "Tuy rằng việc phải oằn lưng khuất phục dưới ách thống trị của [From.GetSpeciesAdj] khiến chúng tôi phẫn uất tột cùng, nhưng chúng tôi vẫn phải cắn răng mà ưng thuận."
 01_INTEGRATE_ACCEPT_DISMISSIVE:0 "Chúng tôi sẽ miễn cưỡng nhẫn nhịn sự cai trị của [From.GetSpeciesAdj] trong thời gian trước mắt."
 01_INTEGRATE_ACCEPT_PATRONIZING:0 "Tốc độ bành trướng của bọn họ quả thực đáng gờm... Chúng tôi bằng lòng gia nhập vào khối liên hiệp của các bạn."
 01_INTEGRATE_ACCEPT_ANGRY:0 "Các bạn chỉ ăn may thắng được một ván cờ cỏn con thôi, đỉnh vinh quang cuối cùng vẫn còn xa vời vợi lắm."

 01_CANCEL_INTEGRATE_FRIENDLY:0 "Nhưng chúng ta đã kề vai sát cánh hợp tác ngần ấy thời gian rồi cơ mà."
 01_CANCEL_INTEGRATE_NEUTRAL:0 "Các ngài muốn vạch ra ranh giới ngăn cách hoàn toàn giữa [Root.GetSpeciesNamePlural] và [From.GetSpeciesNamePlural] sao?"
 01_CANCEL_INTEGRATE_HOSTILE:0 "[From.GetName] lại to gan muốn tháo chạy giữa chừng ư? Thật sự không thể nào tin nổi vào mắt mình."
 01_CANCEL_INTEGRATE_DISMISSIVE:0 "Vậy thì cút quách đi cho khuất mắt."
 01_CANCEL_INTEGRATE_PATRONIZING:0 "Tham thực cực thân đấy, tiểu tử ạ."
 01_CANCEL_INTEGRATE_ANGRY:0 "Đừng bao giờ mộng tưởng rằng [From.GetSpeciesName] có thể nặn ra được một quyết định nào mang tính lý trí."
 01_CANCEL_INTEGRATE_PROPOSE:0 "Chúng tôi sẽ đình chỉ tiến trình sáp nhập vào đế chế của các ngài."

 01_CANCEL_INTEGRATE_ACCEPT_FRIENDLY:0 "Quả thực là một gáo nước lạnh đáng thất vọng."
 01_CANCEL_INTEGRATE_ACCEPT_NEUTRAL:0 "Biết đâu chừng thiên thời chưa tới."
 01_CANCEL_INTEGRATE_ACCEPT_HOSTILE:0 "Thật thảm hại."
 01_CANCEL_INTEGRATE_ACCEPT_DISMISSIVE:0 "Cho qua đi."
 01_CANCEL_INTEGRATE_ACCEPT_PATRONIZING:0 "Ta đoán trước là sẽ ra cái cớ sự này mà."
 01_CANCEL_INTEGRATE_ACCEPT_ANGRY:0 "Thói nhu nhược thiếu quyết đoán và yếu hèn vô dụng không phải là thứ huân chương đáng để tự hào đâu, đồ ngốc [From.GetSpeciesAdj]."

 01_INSULT_PROPOSE:0 "Trên người ngươi có chỗ nào đang đau nhức dữ dội lắm à, hay là mỗi lúc vắt óc suy nghĩ ngươi đều nặn ra cái bộ mặt như thế?"
 02_INSULT_PROPOSE:0 "Vở tuồng của [Root.GetName] đã hạ màn rồi đấy. Đến lúc mò lại về cái hố xí mà các ngươi chui ra, và cuốn xéo vào bãi rác của lịch sử đi!"
 03_INSULT_PROPOSE:0 "[Root.GetName] đích thị là một cái ổ chứa chấp toàn lũ thiểu năng, sự khinh bỉ là thứ ân huệ duy nhất mà các ngươi xứng đáng nhận được!"
 04_INSULT_PROPOSE:0 "Cái [Root.GetName] rách nát của các ngươi đang thoi thóp chút hơi tàn mà thôi, án tử đã được treo lơ lửng trên đầu rồi."
 05_INSULT_PROPOSE:0 "Sự hiện diện của [Root.GetName] rõ ràng là một lỗi lầm tai hại của đấng tạo hóa trong vũ trụ này. Cái mầm mống như các ngươi ngay từ đầu đã không nên được sinh ra."
 06_INSULT_PROPOSE:0 "Có lẽ đâu đó ngoài rìa vũ trụ vẫn còn tồn tại những đế chế rác rưởi hơn cả [Root.GetName], nhưng cho đến tận giây phút này thì chúng ta vẫn chưa có diễm phúc được diện kiến."
 01_INSULT_PROPOSE_XENOPHOBE:0 "[Root.GetSpeciesName], cái giống nòi của các ngươi đúng là không ngừng bứt phá những giới hạn của sự tởm lợm."
 02_INSULT_PROPOSE_XENOPHOBE:1 "Lũ dị chủng vốn dĩ sinh ra đã mang cái nghiệp khiến người ta ghê tởm, [Root.GetSpeciesNameInsult] các ngươi lại càng là thứ cặn bã tinh túy nhất trong cái đám dị chủng ấy."
 03_INSULT_PROPOSE_XENOPHOBE:0 "Cái nòi giống của các ngươi tởm lợm đến mức vô phương cứu chữa, [Root.GetSpeciesName], vũ trụ bao la quả nhiên nhung nhúc toàn những thứ quái thai."
 04_INSULT_PROPOSE_XENOPHOBE:0 "Thứ lỗi cho việc ta phải giảm độ sáng màn hình xuống, [Root.GetSpeciesName]. Bắt ta phải nhìn thẳng vào cái bản mặt gớm ghiếc của ngươi thì thà chọc mù mắt ta đi còn hơn."
 05_INSULT_PROPOSE_XENOPHOBE:1 "Thứ [Root.GetSpeciesNameInsult] bẩn thỉu nhơ nhuốc, dẫu cách xa hàng vạn năm ánh sáng, ta vẫn ngửi thấy thứ mùi hôi thối bốc ra từ người ngươi. Cứ mỗi lần chạm mặt là ta lại rùng mình sợ hãi cái thứ uế khí đó ám vào người."
 06_INSULT_PROPOSE_XENOPHOBE:1 "Nhìn cái diện mạo dị dạng của các ngươi kìa! Cái cục thịt thừa vắt vẻo trên mặt các ngươi là cái quái gì vậy, thứ đó cũng có tư cách được gọi là [Root.GetSpeciesMouthName] sao? Đó thực sự là cái mặt tiền của ngươi đấy à?! Mang cái bộ dạng gớm ghiếc nhường này, các ngươi không cảm thấy sự tồn tại của [Root.GetSpeciesNamePlural] đang chà đạp lên quy luật của tạo hóa sao?"
 07_INSULT_PROPOSE_XENOPHOBE:0 "Cái thứ gọi là [Root.GetName] gom góp toàn những sinh vật đột biến, quái thai và man di mọi rợ... Cứ nghĩ đến việc chúng ta lại vô tình chung rễ tổ tiên là ta lại buồn nôn đến lộn mửa!"
 01_INSULT_PROPOSE_PAC_MIL:0 "Cái thói cuồng tín của [Root.GetName] đối với mấy món đồ chơi súng ống quân sự quả là nực cười đến lố lăng, tự dưng nhớ đến câu châm ngôn: 'Kẻ sĩ diện càng ra sức khoe khoang thứ gì, thì thâm tâm hắn lại càng đói khát thứ đó'."
 02_INSULT_PROPOSE_PAC_MIL:0 "Cái đế chế thâm độc cuồng bạo của các ngươi sao vẫn chưa tự đào hố chôn mình đi nhỉ?"
 03_INSULT_PROPOSE_PAC_MIL:0 "Đồ ngu xuẩn theo chủ nghĩa sô-vanh! Khôn hồn thì mau tiêu hủy hết đống vũ khí rác rưởi của các ngươi đi, trước khi chúng vô tình làm tổn thương đến một ai đó!"
 04_INSULT_PROPOSE_PAC_MIL:0 "Thói hiếu chiến của [Root.GetName] luôn tỷ lệ thuận với độ thiểu năng của bọn chúng. Các ngươi bị đui mù hết rồi hay sao mà không nhận ra mình đã trở thành nô lệ mạt hạng của chủ nghĩa quân phiệt hả?"
 01_INSULT_PROPOSE_MIL_PAC:0 "Khắp chốn [From.GetName] ai ai cũng thấu tận tâm can cái thói hèn nhát rụt cổ của [Root.GetName]. Đất nước của các ngươi rèn luyện kiểu gì mà đẻ ra được cái đám vô xương sống nhường này?"
 02_INSULT_PROPOSE_MIL_PAC:0 "Mầm mống dịch bệnh nào đã lây nhiễm cho các ngươi cái tư tưởng chủ nghĩa hòa bình vậy? Là vì thèm khát đồng tiền? Hay vì quyền lực? Hay là ngay từ trong bụng mẹ các ngươi đã bị nhồi sọ bởi một trái tim thánh mẫu hòa bình rồi? Căn bệnh này đủ sức tàn phá hoàn toàn hệ miễn dịch sinh tồn của các ngươi đấy."
 03_INSULT_PROPOSE_MIL_PAC:0 "Cái giống loài mà đến cả cái mạng cùi của chính mình cũng không dám vung nắm đấm lên bảo vệ thì làm gì có tư cách hít thở bầu không khí này. Theo định giá của chúng tôi, [Root.GetName] thậm chí còn không thọ quá nổi mười năm."
 04_INSULT_PROPOSE_MIL_PAC:0 "[Root.GetName] rập khuôn như một bầy cừu non thảm hại và dễ bảo. Nếu không phải do cái mạng của [From.GetName] các ngươi rách rưới vô giá trị, thì chúng ta đã dọn dẹp sạch sẽ các ngươi từ tám hoảnh rồi."
 01_INSULT_PROPOSE_MAT_SPI:0 "Kể thêm chút chuyện về cái thứ tôn giáo tẩy não thiểu năng mà [Root.GetName] đang cuồng si mộng mị đi! Coi như tấu hài góp vui cho chúng ta!"
 02_INSULT_PROPOSE_MAT_SPI:0 "Thực sự méo thể tiêu hóa nổi việc một sinh vật có nếp nhăn trên não và khả năng tư duy lại đi tự tiêm nhiễm chủ nghĩa duy tâm. Cơ cớ gì mà các ngươi lại cắm đầu cắm cổ bám víu lấy cái mớ đức tin thô sơ thời đồ đá ấy?"
 03_INSULT_PROPOSE_MAT_SPI:0 "Cái đuôi cáo của các ngươi đã bị chúng ta nắm tẩy từ lâu rồi, cái mớ 'tư tưởng chủ nghĩa duy tâm' mà đế chế của các ngươi ra sức huyễn hoặc chẳng qua cũng chỉ là một thứ công cụ mạt hạng hòng xiềng xích tư duy của bầy cừu ngoan đạo mà thôi."
 04_INSULT_PROPOSE_MAT_SPI:0 "Cả vũ trụ này đang cười cợt chế giễu cái mớ đức tin tôn giáo ảo tưởng lố lăng của các ngươi đấy. Người dân trong nước [Root.GetName] không bị nhột tai chút nào sao?"
 01_INSULT_PROPOSE_SPI_MAT:0 "Cái đế chế sùng bái chủ nghĩa duy vật của các ngươi rập khuôn máy móc và tẻ nhạt đến phát ngấy. Chém gió cho ta nghe xem, các ngươi đã lập trình thành công mô-đun khiếu hài hước chưa? Vẫn báo lỗi à? Quả là đáng thương."
 02_INSULT_PROPOSE_SPI_MAT:0 "Mang danh là một đế chế quỳ rạp dưới chân khoa học và chủ nghĩa duy vật, mà [Root.GetName] lại lạc hậu nguyên thủy đến mức thảm họa. Là do hố đen xui xẻo chiếu rọi, hay đơn giản là do chỉ số IQ của các ngươi chưa bao giờ vượt mức âm?"
 03_INSULT_PROPOSE_SPI_MAT:0 "[Root.GetName] đích thị là một trạm bảo dưỡng dành riêng cho đám linh kiện điện tử và robot vô hồn, chứ không phải là nơi nương tựa của những sinh mệnh hữu cơ. Hệ thống mạch điện của các ngươi có tích hợp cảm biến rung động cảm xúc không đấy?"
 04_INSULT_PROPOSE_SPI_MAT:0 "[Root.GetName] là tàn dư bốc mùi của một cuộc thí nghiệm thảm họa. Di sản duy nhất của nó là trở thành một tấm biển báo rỉ sét cảnh tỉnh các giống loài khác trong thiên hà về sự tàn phá khủng khiếp của cái thứ chủ nghĩa duy vật lạnh lẽo."
 01_INSULT_PROPOSE_COL_IND:0 "Rốt cục thì [Root.GetName] là một đế chế thống nhất, hay chỉ là một cái chợ vỡ chứa chấp một đám lâu la ô hợp lúc nào cũng cắn xé lẫn nhau? Vô cùng cáo lỗi, nhưng cái hệ thống chính trị nồi lẩu thập cẩm của các ngươi thối nát đến mức ta không biết dùng từ ngữ gì để miêu tả nó nữa."
 02_INSULT_PROPOSE_COL_IND:0 "Cái gánh xiếc quy mô quốc gia của các ngươi hôm nay lại dựng thằng hề nào lên làm trò vậy? Dùng mấy cái lá phiếu nhảm nhí để bầu cho lũ khỉ đột hay lợn rừng lên cai trị đất nước, cái cơ chế lỗi thời từ kỷ Jura này sao vẫn còn tồn tại? Cứ đâm đầu theo cái lối mòn đó thì tự sát chỉ là vấn đề thời gian."
 03_INSULT_PROPOSE_COL_IND:0 "Cái thứ ung nhọt mang tên tư tưởng dân chủ của các ngươi chính là mầm mống gây dịch bệnh cho toàn vũ trụ này, và cũng là cội nguồn mục nát đục khoét [Root.GetName]."
 04_INSULT_PROPOSE_COL_IND:0 "Cái lũ ích kỷ các ngươi lúc nào cũng đội lợi ích cá nhân lên bàn thờ. Chủ nghĩa cá nhân... nực cười! [Root.GetName] sống không qua nổi mùa quýt năm nay đâu."
 01_INSULT_PROPOSE_IND_COL:0 "Cái chế độ độc tài toàn trị máu lạnh của các ngươi sớm muộn gì cũng vỡ nát thành từng mảnh, và tới lúc đó nghiệp quật sẽ không tha cho một ai."
 02_INSULT_PROPOSE_IND_COL:0 "Các ngươi có bao giờ đánh liều để cho dân đen tự vắt óc suy nghĩ chưa? Nếu như các ngươi đang run rẩy lo sợ việc đó sẽ là mồi lửa thiêu rụi [Root.GetName]... vậy thì chúc mừng nhé, linh cảm của các ngươi chính xác 100% rồi đấy."
 03_INSULT_PROPOSE_IND_COL:0 "Sự hiện diện của một nhà nước cực quyền bạo chúa như [Root.GetName] chính là một vết nhơ nhục nhã bôi tro trát trấu vào mặt toàn thể các giống loài trí tuệ trong dải ngân hà."
 04_INSULT_PROPOSE_IND_COL:1 "Ách cai trị tàn bạo đẫm máu mà các ngươi đang giáng xuống đầu nhân dân — những con người đang phải oằn mình làm nô lệ cho [Root.GetName] — chắc chắn sẽ sớm bị lật đổ. Chủ nghĩa độc tài sẽ là chiếc đinh cuối cùng đóng vào cỗ quan tài của các ngươi."
 05_INSULT_PROPOSE_IND_COL:0 ""
 01_INSULT_PROPOSE_PHO_PHI:0 "Cái thói bợ đỡ liếm gót văn hóa ngoại lai của các ngươi đã biến tướng thành một căn bệnh ung thư giai đoạn cuối rồi đấy, các ngươi không tự soi gương lại mình sao?"
 02_INSULT_PROPOSE_PHO_PHI:0 "Tốc độ quỳ gối xưng thần trước văn hóa ngoại lai của [Root.GetName] kinh tởm đến mức khiến ta muốn mửa. Khái niệm tự tôn dân tộc đã bị các ngươi chó tha mất rồi à?"
 03_INSULT_PROPOSE_PHO_PHI:0 "Cái thứ dịch bệnh cuồng si ngoại lai đang lây lan trong [Root.GetName] giống như một bãi rác khổng lồ đang sỉ nhục toàn bộ trật tự của vũ trụ này."
 04_INSULT_PROPOSE_PHO_PHI:0 "Bức màn bí mật cuối cùng cũng được vén lên, cái đám [Root.GetName] các ngươi sùng ngoại đội ngoại lai lên đầu chẳng qua là vì các ngươi tự ti về cái nền văn hóa rẻ rách rỗng tuếch của chính mình."
 01_INSULT_PROPOSE_PHI_PHO:0 "Cái đám cổ hủ não tàn các ngươi đúng là ngoan cố hết chỗ nói. Lý do quái gì khiến các ngươi phải teo vòi khi đối diện với những sự khác biệt?"
 02_INSULT_PROPOSE_PHI_PHO:0 "Cái hố sâu định kiến mà các ngươi đang đào ra với nền văn hóa ngoại lai đang vắt kiệt giọt kiên nhẫn cuối cùng của chúng ta. Chờ đến kiếp nào thì cái bộ não úng nước của các ngươi mới chịu tiến hóa để thực sự hòa nhập vào dòng chảy của cộng đồng giữa các vì sao?"
 03_INSULT_PROPOSE_PHI_PHO:0 "Cái chính sách bế quan tỏa cảng xua đuổi kẻ ngoại đạo của xã hội các ngươi đang bôi nhọ thanh danh của cả đế chế [Root.GetName]."
 04_INSULT_PROPOSE_PHI_PHO:0 "Tấm màn đen của sự ếch ngồi đáy giếng và ngu dốt thâm căn cố đế của [Root.GetName] đã bịt kín hai mắt của các ngươi rồi, chẳng lẽ các ngươi bị đui mù đến mức không nhận ra điều đó sao?"

 01_INSULT_ACCEPT_FE:0 "Ngươi sẽ phải gánh chịu hậu quả thảm khốc vì tội lộng ngôn này, hỡi loài dã man."
 02_INSULT_ACCEPT_FE:0 "Xem ra đã đến lúc phải cử người xuống dạy dỗ lại cho [From.GetName] biết thân biết phận vị trí của chúng ở đâu trong vũ trụ này."
 03_INSULT_ACCEPT_FE:0 "Ngươi lấy đâu ra lá gan tày trời dám phun những lời xấc xược đó vào mặt chúng ta, sinh vật nguyên thủy. Sổ tử của ngươi đã được ghi tên, chúng ta sẽ sớm đến thu thập mạng chó của ngươi."
 01_INSULT_NEUTRAL:0 "To gan!"
 02_INSULT_NEUTRAL:0 "Ngươi vừa sủa cái gì cơ? Một tin tức 'chấn động' muốn đánh tiếng cho chúng ta sao?"
 03_INSULT_NEUTRAL:0 "Có chuyện gì vĩ đại tày trời mà gấp gáp muốn bẩm báo vậy?"
 04_INSULT_NEUTRAL:0 "Cảnh cáo lần một, nên uốn lưỡi bảy lần trước khi phụt ra những lời đó..."
 01_INSULT_FRIENDLY:0 "Chuyện gì vậy anh bạn? Các ngươi có việc đại sự gì hệ trọng cần mang ra mổ xẻ sao?"
 02_INSULT_FRIENDLY:0 "Chuyện gì vậy anh bạn? Chúng tôi đã lỡ mạo phạm các ngươi ở điểm nào chăng?"
 03_INSULT_FRIENDLY:0 "Xin cứ thẳng thắn ruột ngựa. Chúng tôi có chỗ nào hành xử chưa được chu toàn chăng?"
 04_INSULT_FRIENDLY:0 "Chúng, chúng ta vẫn là anh em cốt nhục, đúng không?"
 01_INSULT_HOSTILE:0 "Vác cái thân tàn đến đây để dập đầu van xin ân xá à?"
 02_INSULT_HOSTILE:0 "Chúng ta sẽ không khoanh tay đứng nhìn bản thân bị sỉ nhục đâu, đặc biệt là khi lũ cặn bã như các ngươi giở trò."
 03_INSULT_HOSTILE:0 "Câu này của ngươi là ám chỉ cái quái gì?"
 04_INSULT_HOSTILE:0 "Nuốt lại những lời đó và giải thích cho rõ ràng. Các ngươi đang toan tính âm mưu gì?"
 01_INSULT_ACCEPT_NEUTRAL:0 "Thật là quá mức ngông cuồng?! Các ngươi sớm muộn gì cũng phải nôn ra máu vì hành động này!"
 02_INSULT_ACCEPT_NEUTRAL:0 "Ngông nghênh hống hách! [From.GetName] các ngươi đừng hòng có cửa chạy thoát!"
 03_INSULT_ACCEPT_NEUTRAL:0 "Chống mắt lên mà xem, luật nhân quả của chúng ta sẽ không bỏ lọt bất cứ một ai, những tội trạng của [From.GetName] ngày hôm nay đã được chúng ta khắc cốt ghi tâm."
 04_INSULT_ACCEPT_NEUTRAL:1 "[From.GetName] liên tục xả ra thứ ngôn từ của trẻ trâu đầy mùi thuốc súng và đang đe dọa trực tiếp đến hòa bình của cộng đồng thiên hà, [Root.GetName] vô cùng quan ngại về sự việc này."
 01_INSULT_ACCEPT_FRIENDLY:0 "Cái trò đùa quái ác này chẳng lọt tai một chút nào cả!"
 02_INSULT_ACCEPT_FRIENDLY:0 "Ch, chúng tôi không tài nào hiểu nổi... vì cớ sự gì mà các ngươi lại phun ra những lời lẽ cay nghiệt đó?"
 03_INSULT_ACCEPT_FRIENDLY:0 "Rõ mười mươi rồi. Xem ra chúng ta đã nhìn nhầm cái bản mặt xảo trá của các ngươi."
 04_INSULT_ACCEPT_FRIENDLY:0 "Chuyện... chuyện quái quỷ này là sao, đúng là mất hết cả tư cách."
 01_INSULT_ACCEPT_HOSTILE:0 "Tốt lắm, các ngươi đã thành công mồi lửa kích nổ thùng thuốc súng thịnh nộ của chúng ta rồi..."
 02_INSULT_ACCEPT_HOSTILE:0 "Cái bản mặt của lũ cặn bã các ngươi đúng là không lệch đi đâu một ly so với dự đoán! Cứ chờ đấy xem trò vui!"
 03_INSULT_ACCEPT_HOSTILE:0 "Mọi hành vi ngang ngược của các ngươi đều đã được liệt kê chi tiết trong bản cáo trạng! Và cuộn cáo trạng chết chóc này đang ngày một dài thêm."
 04_INSULT_ACCEPT_HOSTILE:0 "Lũ rác rưởi không có não! Các ngươi sẽ phải ôm hận!"
 # Hive Mind Phrases
 HM_CONSIDER_01:0 "[Root.GetName] đang tiến hành xử lý đề xuất của ngươi."
 HM_CONSIDER_02:0 "Một phân nhánh cá thể synapse của [Root.GetAdj] đang quét qua bản đề xuất của ngươi."
 HM_CONSIDER_03:0 "[Root.GetName] đã tiếp nhận luồng dữ liệu đề xuất từ ngươi, đang thông qua các liên kết synapse hội tụ để đưa ra phản hồi."
 HM_CONSIDER_04:0 "Ý thức Tập thể đã bắt được tín hiệu đề xuất của ngươi, Ý thức Tập thể sẽ sớm phản hồi lại luồng dữ liệu đó."
 #HM_DOW_SELECT:0 "Taking up arms against the [Root.GetName] is not done lightly, [From.GetSpeciesName]."
 HM_DOW_ACCEPT:0 "Tham vọng xóa sổ một cá thể của chúng ta đồng nghĩa với việc tuyên chiến xóa sổ toàn bộ mạng lưới của chúng ta. [Root.GetName] kể từ giây phút này chính thức là tử thù của [From.GetName]."
 #DS_DOW_SELECT:0 "You wish to hasten your own end, [From.GetSpeciesName]?"
 DS_DOW_ACCEPT:0 "Lao vào đây, [From.GetSpeciesName]. Bọn ta sẽ nhai xương và nuốt chửng các ngươi không chừa một mẩu."
 DS_MECH_DOW_ACCEPT:0 "Lũ máy móc vô hồn sẽ bị quét sạch như rác thải, để dọn chỗ trống trải thảm cho các lò ấp sinh sản của chúng ta."
 #HM_DOW_VOTE_PROPOSE:0 "Our decision is unanimous: The §Y[Root.GetName]§! must be destroyed. Are our allies as united in this cause as we are?"
 #HM_PEACE_SELECT:0 "All facets of [Root.GetAdj] society are currently focused on your destruction. Do you wish to end this?"
 HM_PEACE_PROPOSE:0 "Lòng từ bi của [From.GetName] đã áp đảo mã lệnh tiêu diệt. Chúng tôi đồng ý đình chiến dựa trên các tham số đã được thiết lập."
 HM_PEACE_ACCEPT:0 "[Root.GetName] sau một vòng lặp xung đột tư tưởng đã xuất ra được một thuật toán chung. Chúng tôi đồng ý kích hoạt giao thức đình chiến."
 DS_PEACE_ACCEPT:0 "Khoang dạ dày của bọn ta hôm nay đã quá tải rồi. Cuộc săn lùng sẽ tạm thời đóng máy."
 DS_MECH_PEACE_ACCEPT:0 "Cơ quan tiêu hóa của bọn ta không thể dung nạp được [From.GetName]. Khẩu vị của bọn ta bị phá hỏng rồi."
 HM_PEACE_REFUSE:0 "Từ chối thực thi lệnh đình chiến. Mạng lưới [Root.GetSpeciesAdj] vẫn đang sục sôi cơn khát máu muốn xóa sổ hoàn toàn [From.GetName]."
 DS_PEACE_REFUSE:0 "Khi cơn đói khát chưa được lấp đầy, thì khái niệm hòa bình sẽ bị xóa sổ khỏi bộ nhớ."
 DS_MECH_PEACE_REFUSE:0 "Chỉ cần lũ máy móc vô hồn vẫn còn cắm rễ trên những vùng đất có thể tiêu hóa được, chúng ta sẽ không bao giờ nhả chân ga."
 HM_ITOA_SELECT:0 "Ngươi muốn hợp nhất dữ liệu để cùng [Root.GetName] kiến tạo một thuật toán vĩ đại hơn sao?"
 HM_ITOA_ACCEPT:0 "Với tham vọng kết nối và tìm kiếm một Siêu Mạng lưới hoành tráng hơn [Root.GetName], chúng tôi sẽ liên kết vào §Y[From.GetAllianceName]§!"
 HM_ITOA_REFUSE:1 "Chúng tôi kích hoạt tường lửa từ chối việc tích hợp Ý thức của mình vào trong hệ thống Liên bang của các bạn."
 HM_ITOA_PROPOSE:1 "Tuy rằng các cổng truy cập của [From.GetName] được mã hóa nội bộ, nhưng chúng tôi sẽ không phong tỏa các luồng kết nối ngoại vi nhằm dung nạp thêm các dữ liệu khác."
 #HM_ITOA_VOTE_PROPOSE:0 "We have assessed the suitability of §Y[Root.GetName]§! as a potential ally and come to a decision to support their inclusion."
 HM_ASK_JOIN_A_SELECT:0 "Những cá thể rác rưởi rời rạc, các bạn muốn thiết lập liên kết với [Root.GetName] sao?"
 HM_ASK_JOIN_A_PROPOSE:1 "Chúng tôi đã phân tích và đánh giá rất cao cấu trúc Liên bang của các bạn. [From.GetName] cũng muốn được thiết lập một cổng kết nối vào đó."
 HM_ASK_JOIN_A_ACCEPT:0 "Chúng tôi sẽ kích hoạt tối đa công suất băng thông để mở cổng kết nối cho các bạn vào trong liên minh của chúng tôi."
 HM_ASK_JOIN_A_REFUSE:1 "[Root.GetName] đã đưa ra kết quả phân tích cuối cùng. Ngươi và ta hoàn toàn không thể tương thích trong cùng một cụm Liên bang."
 HM_LEAVE_A_SELECT:0 "[Root.GetName] sở hữu mạng lưới đồng bộ cao cấp hơn bất cứ một đế chế nào, là một node đồng minh hiếm có khó tìm. Các bạn thực sự muốn rút phích cắm một cách ngớ ngẩn như vậy sao?"
 HM_LEAVE_A_PROPOSE:0 "Chúng tôi đã thiết lập lệnh ngắt kết nối khỏi liên minh. Chúng tôi đơn giản là không thể tìm thấy tần số chung giữa những tư duy bị chia cắt."
 HM_LEAVE_A_ACCEPT:0 "Đã rõ. Chúng tôi ghi nhận sự tiếc nuối về việc ngắt kết nối này của các bạn. Giao thức ngoại giao vốn dĩ chứa đầy những lỗ hổng bảo mật, không bao giờ có thể bất khả xâm phạm như liên kết thần kinh của chúng tôi."
 HM_DEMAND_VASS_SELECT:0 "Các bạn muốn chiếm quyền điều khiển [Root.GetName] của chúng tôi sao? Đổi lại, các bạn sẽ kích hoạt lá chắn bảo vệ cho Ý thức Tập thể của chúng tôi chứ gì."
 HM_DEMAND_VASS_PROPOSE:0 "[From.GetName] dựa vào sức mạnh của sự đồng bộ đã bảo vệ thành công những [From.GetSpeciesNamePlural] yếu ớt khỏi thảm họa tuyệt diệt. Chúng tôi sẵn sàng giang rộng tấm khiên bảo vệ đó cho các ngươi. Hãy kích hoạt giao thức chư hầu đi, bằng không chúng tôi sẽ phải dùng đến vũ lực bạo tàn."
 HM_DEMAND_VASS_ACCEPT:0 "Mạng lưới đã đạt độ đồng thuận 100%. [Root.GetName] sẽ sinh sôi mạnh mẽ dưới chiếc ô che chở của [From.GetRulerName]."
 HM_DEMAND_VASS_REFUSE:0 "[Root.GetName] sẽ không bao giờ hạ cấp thành một tiến trình nền phục vụ cho kẻ khác. Chúng tôi tự nắm giữ mã nguồn định đoạt số phận của cả tập thể."
 HM_ASK_FOR_VASS_SELECT:0 "Các bạn muốn nương náu dưới lớp tường lửa bất diệt của mạng lưới [Root.GetName]? Là một thỏa thuận trao đổi, các bạn sẽ hòa chung nhịp đập vào sứ mệnh vĩ đại của chúng tôi chứ?"
 HM_ASK_FOR_VASS_PROPOSE:0 "[From.GetName] đã quét qua các dữ liệu và nhận định [Root.GetName] là một hệ thống phòng thủ vững chắc cho mạng lưới giống loài của chúng tôi. Để duy trì quyền bảo mật cho sự tồn tại của mình, chúng tôi gửi tệp đính kèm yêu cầu được trở thành chư hầu."
 HM_ASK_FOR_VASS_ACCEPT:0 "Sau khi phân tích độ rủi ro qua hàng tỷ vòng lặp, chúng tôi xác nhận đồng ý. [Root.GetName] bằng lòng trở thành hệ thống giám hộ của các ngươi, và kể từ chu kỳ này sẽ nắm toàn quyền điều khiển vận mệnh của các ngươi."
 HM_ASK_FOR_VASS_REFUSE:0 "Chúng tôi không có nhu cầu phân bổ bộ nhớ cho một chư hầu. Ép xung và bành trướng [Root.GetName] mới là tác vụ được cấp quyền ưu tiên cao nhất hiện tại."
 HM_DEMAND_PROT_SELECT:0 "$HM_DEMAND_VASS_SELECT$"
 HM_DEMAND_PROT_PROPOSE:0 "[From.GetName] dựa vào sức mạnh của sự đồng bộ đã bảo vệ thành công những [From.GetSpeciesNamePlural] yếu ớt khỏi thảm họa tuyệt diệt. Chúng tôi sẵn sàng giang rộng tấm khiên bảo vệ đó cho các ngươi. Hãy chấp nhận để chúng tôi bảo vệ, nếu không chúng tôi sẽ phải kích hoạt giao thức cưỡng chế vũ lực."
 HM_DEMAND_PROT_ACCEPT:0 "$HM_DEMAND_VASS_ACCEPT$"
 HM_DEMAND_PROT_REFUSE:0 "$HM_DEMAND_VASS_REFUSE$"
