 01_PROPOSE_OPEN_TECHNOLOGICAL_ENLIGHTENMENT:1 "Chúng tôi sẽ chia sẻ công nghệ của mình với [Root.GetName]."
 01_ACCEPT_OPEN_TECHNOLOGICAL_ENLIGHTENMENT:1 "Chúng tôi xin tiếp nhận công nghệ của phe bạn."

