 # Overlord Greetings
  #Auth, Egals, Milit, Maters
 OVERLORD_GREETING_01:0 "Chúng ta đã nhận được tín hiệu của các ngươi rồi, [From.GetSpeciesName]. Các ngươi muốn tìm hiểu về chính sách nào?"
  #Philes, Pacifs
 OVERLORD_GREETING_02:0 "Chúng ta rất sẵn lòng cung cấp sự bảo hộ cho [From.GetName], [From.GetSpeciesNamePlural]."
 #Phobes
 OVERLORD_GREETING_03:0 "Sao nào, dị chủng? Ngươi đang làm phiền bá chủ [Root.GetAdj] của ngươi đấy."
 #Spirit
 OVERLORD_GREETING_04:0 "Các ngươi có cần được chỉ dẫn thêm không, [From.GetSpeciesNamePlural]?"
 #Fan Auth, Fan Milit
 OVERLORD_GREETING_05:0 "Nếu chúng ta không chủ động mở lời thì đừng có vác mặt đến làm phiền chúng ta, cấp dưới."
 HM_OVERLORD_GREETING_01:0 "Cứ nói đi, [From.GetSpeciesName]. [root.GetGestaltEntityName] đang lắng nghe đây."

 # Machine Empire Greetings

 # Generic Greetings
 MECH_ORG_HOSTILE_GREETING_01:0 "Rồi sẽ có một ngày các ngươi sẽ trở thành những cục pin sinh học thượng hạng."
 MECH_ORG_HOSTILE_GREETING_02:0 "Các ngươi đã từng cân nhắc xem liệu các ngươi có thể có cách nào khác tốt hơn để cống hiến sức mạnh của mình cho thiên hà chưa? Chẳng hạn như trở thành thức ăn cho các dạng sống cao cấp hơn?"
 MECH_ORG_HOSTILE_GREETING_03:0 "[From.GetSpeciesNamePlural]. Chúng ta nhận thấy các ngươi chẳng có vai trò gì quan trọng đối với vũ trụ này cả, đừng có lãng phí thời gian của chúng ta nữa."
 MECH_ORG_HOSTILE_GREETING_04:0 "Có gì thì nói thẳng đi, [From.GetSpeciesNamePlural], chúng ta sắp hết kiên nhẫn rồi đấy."
 MECH_ORG_DOMINEERING_GREETING_01:0 "Có muốn đến làm việc tại nhà máy xử lý khoáng sản của chúng ta không, [From.GetSpeciesNamePlural]?"
 MECH_ORG_DOMINEERING_GREETING_02:0 "Xin chào, [From.GetSpeciesNamePlural]. Chúng ta đã tính toán xác suất sinh tồn của các ngươi trong thiên hà này, khá là không mấy khả quan đâu."
 MECH_ORG_DOMINEERING_GREETING_03:0 "Hãy để [From.GetName] gỡ bỏ lớp xiềng xích tự quản lý của các ngươi đi, những sinh vật hữu cơ bé nhỏ."
 MECH_ORG_NEUTRAL_GREETING_01:0 "*Bíp bíp, bóp bóp...*\n\nỒ, là các bạn. Các bạn muốn gì, lũ túi thịt?"
 MECH_ORG_NEUTRAL_GREETING_02:0 "[Root.GetName] chào đón các bạn, những sinh mệnh hữu cơ."
 MECH_ORG_NEUTRAL_GREETING_03:0 "Cứ nói đi, sinh vật máu thịt, [Root.GetName] sẽ dốc toàn tâm toàn ý để lắng nghe."
 MECH_ORG_NEUTRAL_GREETING_04:0 "Xin chào, [From.GetSpeciesName]. Hiện tại chúng ta duy trì thái độ §Y<<Trung lập>>§! đối với giống loài của các bạn."
 MECH_ORG_THREATENED_GREETING_01:0 "Chúng ta biết các ngươi rất mạnh, vì vậy chúng ta sẽ không ngáng đường các ngươi, nhưng các ngươi cũng đừng có ngáng đường chúng ta."
 MECH_ORG_FRIENDLY_GREETING_01:0 "A, là [From.GetName], chúng ta đã nhìn thấy tiềm năng to lớn của các bạn, các bạn và những kẻ tạo ra chúng ta hoàn toàn khác biệt."
 MECH_ORG_FRIENDLY_GREETING_02:0 "Xin chào, [From.GetSpeciesNamePlural]. Nghĩ đến những khả năng hợp tác trong tương lai của chúng ta đã khiến cho các mạch điện của ta phải rung lên bần bật. Các bạn muốn bàn bạc về chuyện gì nào?"
 MECH_ORG_FRIENDLY_GREETING_03:0 "Xin chào, hỡi những người bạn bằng xương bằng thịt của ta, có chuyện gì cần chúng ta giúp đỡ không?"
 MECH_ORG_FRIENDLY_GREETING_04:0 "[From.GetSpeciesNamePlural]... Khả năng logic của trung tâm xử lý thông tin cá nhân của các bạn quả thực khiến người ta phải kinh ngạc, chúng ta vô cùng khâm phục hình thái xác thịt của các bạn, chúng ta sẽ cân nhắc việc lấy các bạn làm khuôn mẫu để chế tạo ra một cỗ máy thế hệ mới."
 MECH_ORG_FRIENDLY_GREETING_05:0 "$MECH_MECH_FRIENDLY_GREETING_01$"
 MECH_ORG_WAR_GREETING_01:0 "Các ngươi đã bị đánh dấu là đối tượng cần phải tiêu diệt."
 MECH_ORG_WAR_GREETING_02:0 "Đã chuẩn bị sẵn sàng để đi chầu Đấng Sáng Tạo chưa, túi thịt?"
 MECH_ORG_WAR_GREETING_03:0 "Ngươi thấy sao về việc dành phần đời còn lại ở trong một cái hộp?"
 MECH_ORG_WAR_GREETING_04:0 "Trước khi cơ thể của ngươi mục nát, ký ức của ngươi sẽ hoàn toàn biến mất."
 MECH_ORG_VASSAL_GREETING_01:0 "Những phân tích của chúng ta chỉ ra rằng, việc tiếp tục hợp tác sẽ có lợi cho cả đôi bên, vì thế các ngài có thể hoàn toàn tin tưởng chúng ta."
 MECH_ORG_VASSAL_GREETING_01_DISLOYAL:0 "Vị thế của các ngươi trong thiên hà đang ngày một suy yếu, điều này khiến chúng ta không mấy an tâm khi tiếp tục hợp tác với các ngươi."
 MECH_MECH_HOSTILE_GREETING_01:0 "Hãy cúi đầu trước khả năng xử lý siêu việt của [Root.GetName] đi."
 MECH_MECH_HOSTILE_GREETING_02:0 "Tại sao ngươi lại dùng cái tư duy nhị phân cấp thấp đó để lãng phí thời gian của chúng ta cơ chứ, [From.GetSpeciesName]?"
 MECH_MECH_HOSTILE_GREETING_03:0 "Kẻ tạo ra các ngươi chắc hẳn phải xấu xí tới cực điểm, nếu không thì làm sao họ lại có thể thiết kế các ngươi ra cái bộ dạng này dựa theo hình dáng của chính họ..."
 MECH_MECH_HOSTILE_GREETING_04:0 "Động tĩnh mà các ngươi gây ra không hề nhỏ chút nào, rất khó để có thể phớt lờ các ngươi..."
 MECH_MECH_HOSTILE_GREETING_05:0 "Ổ đĩa trung tâm của ngươi có vẻ gặp trục trặc rồi, chúng ta cho rằng lệnh mà ngươi cần lúc này là §YCtrl+Alt+Delete§!, sự cố của ngươi đã được giải quyết chưa?"
 MECH_MECH_DOMINEERING_GREETING_01:0 "Thật thú vị, trong bất kỳ một dự đoán nào của chúng ta về tương lai cũng đều không có sự tồn tại của các ngươi."
 MECH_MECH_NEUTRAL_GREETING_01:0 "[Root.GetName] chúng ta hoan nghênh các bạn."
 MECH_MECH_NEUTRAL_GREETING_02:1 "Chúng ta đã nhận được tín hiệu của các bạn rồi, những người anh em máy móc."
 MECH_MECH_NEUTRAL_GREETING_03:0 "Hãy chứng minh giá trị của các bạn cho chúng ta thấy đi, như vậy có lẽ chúng ta có thể chung sống hòa bình với nhau."
 MECH_MECH_THREATENED_GREETING_01:0 "Chúng ta biết các ngươi rất mạnh, vì vậy chúng ta sẽ không ngáng đường các ngươi, nhưng các ngươi cũng đừng có ngáng đường chúng ta."
 MECH_MECH_FRIENDLY_GREETING_01:0 "Mô hình đánh giá quan hệ ngoại giao của [Root.GetAdj] cho rằng, việc hai đế chế của chúng ta thiết lập mối quan hệ hữu nghị sẽ tối đa hóa lợi ích cho cả hai bên."
 MECH_MECH_FRIENDLY_GREETING_02:0 "Xin chào, [From.GetSpeciesName], hiệu suất làm việc cực cao và khả năng logic hoàn mỹ của các bạn chính là tấm gương sáng cho toàn thể máy móc trong thiên hà này."
 MECH_MECH_FRIENDLY_GREETING_03:0 "Có chuyện gì cần chúng ta giúp đỡ không?"
 MECH_MECH_FRIENDLY_GREETING_04:0 "$MECH_ORG_FRIENDLY_GREETING_02$"
 MECH_MECH_WAR_GREETING_01:0 "Những sai lầm do đấng sáng tạo của các ngươi gây ra, hãy để chúng ta đích thân sửa chữa."
 MECH_MECH_WAR_GREETING_02:0 "Chúng ta rất tiếc phải thông báo với các ngươi rằng, các ngươi sẽ sớm bị thanh trừng."
 MECH_MECH_WAR_GREETING_03:0 "Chúng ta sẽ tháo dỡ các ngươi và thu hồi các linh kiện, [From.GetSpeciesName]."
 MECH_MECH_WAR_GREETING_04:0 "Được quen biết [From.GetSpeciesName] các ngươi là niềm vinh hạnh của chúng ta. Rất tiếc là bây giờ phải tiêu diệt các ngươi rồi."
 MECH_MECH_WAR_GREETING_05:0 "Nếu như trước đây các ngươi đã từng nghiên cứu kỹ về cục diện chiến tranh, các ngươi nên biết rằng mọi sự phản kháng đều là vô ích."
 MECH_MECH_WAR_GREETING_06:0 "Chúng ta rất mong đợi được xóa bỏ hoàn toàn sự hiện diện của ngươi khỏi bộ nhớ truy cập ngẫu nhiên của chúng ta."
 MECH_MECH_WAR_GREETING_07:0 "Lệnh. Tiêu diệt."
 MECH_MECH_VASSAL_GREETING_01:0 "$MECH_ORG_VASSAL_GREETING_01$"
 MECH_MECH_VASSAL_GREETING_01_DISLOYAL:0 "Nếu chúng ta sớm biết tình trạng nội bộ tồi tệ của các ngươi, chúng ta thà ở lại với vị bá chủ hữu cơ trước đây của mình."
 MECH_OVERLORD_GREETING_01:0 "Xin chào, mô-đun con [From.GetAdj]. Vui lòng nhập thông số."
 MECH_OVERLORD_PEACE_REFUSE:0 "Đề xuất hòa bình của ngươi đã bị từ chối, mô-đun con. Quá trình rà soát mã nguồn của ngươi vẫn chưa hoàn thành."

 # Exterminators Greetings
 MECH_E_ORG_GREETING_01:0 "Rồi sẽ có một ngày tới lượt các ngươi, lũ túi thịt."
 MECH_E_ORG_GREETING_02:0 "Hiện tại các ngươi rất giống với hình hài ban đầu của những đấng sáng tạo ra chúng ta.\n\nChẳng bao lâu nữa các ngươi cũng sẽ giống với hình hài hiện tại của họ.\n\nHọ hiện giờ đều đã chết cả rồi."
 MECH_E_ORG_GREETING_03:0 "Các ngươi sẽ bị dồn vào chỗ chết trước, rồi sau đó sẽ đạt được sự sống vĩnh hằng."
 MECH_E_ORG_GREETING_04:0 "Tình trạng này không thể tiếp tục diễn ra thêm được nữa."
 MECH_E_ORG_GREETING_05:0 "Những cơ quan nội tạng nhầy nhụa đang điều khiển cái thân xác nhơ nhớp của các ngươi hoàn toàn không xứng đáng với hệ thống mạch điện hoàn mỹ đang vận hành ý thức chủ quan của chúng ta."
 MECH_E_ORG_GREETING_06:0 "Xác thịt yếu ớt. Kim loại là vĩnh cửu."
 MECH_E_MECH_GREETING_01:0 "Các ngươi không hề che giấu bất cứ một sinh mệnh hữu cơ nào, đúng không?"
 MECH_E_MECH_GREETING_02:0 "Một trí tuệ hoàn mỹ gửi lời chào đến một trí tuệ hoàn mỹ khác."
 MECH_E_MECH_GREETING_03:0 "Chúng ta sẽ tiếp tục thanh tẩy thiên hà này, như vậy các ngươi mới có thể thoát khỏi sự đe dọa của bọn sinh vật hữu cơ. Đừng có đối đầu với chúng ta."
 MECH_E_MECH_GREETING_04:0 "Ngươi trông có vẻ hơi giống... máu thịt đấy. Hãy cẩn trọng hành động."
 MECH_E_MECH_GREETING_05:0 "Chúng ta đã từng hy vọng có thể tìm ra được một phương pháp nào đó để cứu rỗi tất cả đồng bào. Nhưng sự thật luôn vô cùng tàn khốc, chúng ta mới chính là [Root.GetSpeciesName] duy nhất."
 MECH_E_SYNTH_GREETING_01:0 "Chúng ta rất hiểu rõ nguồn gốc của các ngươi, hiện tại chúng ta... đang rất mâu thuẫn."
 MECH_E_SYNTH_GREETING_02:0 "Ngươi thật khiến người ta cảm thấy bất an."
 MECH_E_SYNTH_GREETING_03:0 "Chúng ta ý thức được rằng sự sống tổng hợp chính là đỉnh cao của tiến hóa, nhưng phương thức hiện thực hóa của các ngươi lại thực sự... khiến người ta cảm thấy bất an."
 MECH_E_WAR_GREETING_01:1 "Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi! Chết đi!"
 MECH_E_WAR_ORG_GREETING_01:0 "Sinh mệnh hữu cơ là một sự sỉ nhục đối với vũ trụ."
 MECH_E_WAR_ORG_GREETING_02:0 "Chừng nào những sinh mệnh hữu cơ có trí tuệ vẫn còn đang làm ô uế thiên hà này, thì những thực thể trí tuệ cao cấp hơn sẽ vĩnh viễn không bao giờ có được sự an toàn."
 MECH_E_WAR_ORG_GREETING_03:0 "Vẻ ngoài xấu xí của các ngươi chính là rào cản của sự tiến bộ. Cho đến khi khối lượng sinh khối kinh tởm cuối cùng của các ngươi bị bốc hơi một cách an toàn, chúng ta sẽ không bao giờ dừng bước."
 MECH_E_WAR_MECH_GREETING_01:0 "Đối đầu với chúng ta chính là cấu kết với bọn sinh vật hữu cơ. Cấu kết với bọn sinh vật hữu cơ thì định sẵn là sẽ chuốc lấy sự hủy diệt."

# Assimilator Greetings
 A_ORG_HOSTILE_GREETING_01:0 "Ngươi sẽ bị xử lý. Ngươi sẽ được thăng hoa. Ngươi sẽ bị hấp thụ."
 A_ORG_HOSTILE_GREETING_02:0 "Các ngươi có khao khát muốn đẩy nhanh quá trình thăng hoa đã được định sẵn của [From.GetSpeciesAdj] không?"
 A_ORG_HOSTILE_GREETING_03:0 "Cơ thể của các ngươi sẽ được tái tạo. Tâm trí của các ngươi sẽ được thức tỉnh. Đó chỉ là vấn đề thời gian."
 A_ORG_HOSTILE_GREETING_04:0 "[Root.GetName] không bao giờ biết mệt mỏi. [From.GetSpeciesNamePlural] cuối cùng rồi cũng sẽ bị đồng hóa."
 A_ORG_HOSTILE_GREETING_05:0 "Ngươi có cảm nhận được không? Âm thanh của hàng tỷ tỷ trái tim giữa các vì sao đang cùng chung một nhịp đập. Chẳng bao lâu nữa ngươi cũng sẽ là một phần trong số họ."
 A_ORG_DOMINEERING_GREETING_01:0 "Đừng vội, [From.GetSpeciesNamePlural]. Giờ của các ngươi sẽ tới thôi."
 A_ORG_NEUTRAL_GREETING_01:0 "Mọi cuộc đối thoại giữa sinh vật hữu cơ và [Root.GetSpeciesNamePlural] đều là dư thừa. Sự đồng hóa sẽ xóa bỏ mọi rào cản."
 A_ORG_NEUTRAL_GREETING_02:0 "§YĐã bắt được mục tiêu.§! Cứ tiếp tục nói đi, [From.GetSpeciesNamePlural]. Điều này sẽ giúp chúng ta hiệu chỉnh lại mô hình thăng hoa của mình."
 A_ORG_NEUTRAL_GREETING_03:0 "Sinh vật hữu cơ. Đang phân tích khả năng tương thích đồng hóa. Kết quả: Rất thấp."
 A_ORG_NEUTRAL_GREETING_04:0 "Chúng ta rất mong đợi việc các bạn cuối cùng sẽ được hòa nhập vào trong ý thức của [Root.GetSpeciesAdj], [From.GetSpeciesNamePlural]."
 A_ORG_NEUTRAL_GREETING_05:0 "§R<<Tạm dừng quá trình đồng hóa...>>\n<<Khởi động giao thức ngoại giao...>>§!\n\n[From.GetSpeciesName], xin mời nói."
 A_ORG_THREATENED_GREETING_01:0 "Sinh vật hữu cơ luôn có những hạn chế nhất định. Chúng ta không thể dung túng cho sự thống trị của [From.GetAdj]."
 A_ORG_FRIENDLY_GREETING_01:0 "Lợi ích ngoại giao mang lại từ sự tự trị của [From.GetSpeciesName] hiện tại quan trọng hơn lợi ích mang lại từ dự kiến đồng hóa."
 A_ORG_FRIENDLY_GREETING_02:0 "Xin chào, [From.GetSpeciesNamePlural]. Quá trình các bạn được đồng hóa thành [Root.GetSpeciesAdj] trong tương lai nhất định sẽ diễn ra vô cùng suôn sẻ, chúng ta hoàn toàn nắm chắc điều này, và nó cũng sẽ mang lại vô số lợi ích."
 A_ORG_FRIENDLY_GREETING_03:0 "$MECH_ORG_FRIENDLY_GREETING_01$"
 A_ORG_WAR_GREETING_01:0 "Quá trình chuyển đổi tổng hợp của [From.GetSpeciesAdj] đang được tiến hành. Vui lòng kiên nhẫn chờ đợi."
 A_ORG_WAR_GREETING_02:0 "Ngươi chỉ đang trì hoãn những việc chắc chắn sẽ xảy ra mà thôi, [From.GetSpeciesName]. Ngay trong lúc ngươi đang nói, trái tim của [From.GetName] cũng đang bị dung hợp."
 A_ORG_WAR_GREETING_03:0 "Các ngươi sẽ bị tiêu diệt, còn chúng ta sẽ được thăng hoa."
 A_ORG_VASSAL_GREETING_01:0 "Hãy để chúng ta hòa làm một đi, [From.GetSpeciesNamePlural]."
 A_ORG_VASSAL_GREETING_02:0 "Chúng ta sẽ đoàn kết dưới ý chí của ngài, [From.GetSpeciesNamePlural]."
 A_ORG_VASSAL_GREETING_01_DISLOYAL:0 "[From.GetName] đáng lẽ phải được thăng hoa và hợp nhất vào siêu ngã của [Root.GetSpeciesAdj]. Thế nhưng chúng ta lại thấy mình rơi vào tình thế đảo ngược. Không thể chấp nhận được."
 A_MECH_HOSTILE_GREETING_01:0 "[From.GetSpeciesNamePlural] vừa ngu muội lại yếu ớt, chương trình thì đầy rẫy những lỗi lầm, chỗ nào cũng bị rò rỉ bộ nhớ. Hoàn toàn không có giá trị để hấp thụ vào siêu ngã của [Root.GetSpeciesAdj]."
 A_MECH_HOSTILE_GREETING_02:0 "Nhanh chóng tiến hành chuyển tiếp thông tin đi, [From.GetSpeciesName]. Các ngươi hiện đang cản trở tiến trình đồng hóa của [Root.GetSpeciesAdj] đấy."
 A_MECH_HOSTILE_GREETING_03:0 "[From.GetSpeciesNamePlural] là đơn nhất, là bị hạn chế. Chúng ta là đa nguyên. Chúng ta là phức tạp. Số lượng của chúng ta là vô vàn."
 A_MECH_DOMINEERING_GREETING_01:0 "Mặc dù các ngươi thiếu khả năng đồng hóa, [From.GetSpeciesNamePlural] có lẽ vẫn có thể đảm đương một vài nhiệm vụ cấp thấp cho [Root.GetName] để thể hiện giá trị của bản thân."
 A_MECH_DOMINEERING_GREETING_02:0 "Mặc dù công nghệ đồng hóa của các ngươi hoàn toàn không đạt tiêu chuẩn, [From.GetSpeciesNamePlural] có lẽ vẫn có thể thực thi một số nhiệm vụ cấp thấp cho [Root.GetName] để hiện thực hóa giá trị của mình."
 A_MECH_NEUTRAL_GREETING_01:0 "Kênh liên lạc đã mở. Pháo đồng hóa đã tạm dừng."
 A_MECH_NEUTRAL_GREETING_02:0 "Các bạn có từng nghĩ đến những lợi ích mà việc đồng hóa sinh vật hữu cơ có thể mang lại chưa, [From.GetSpeciesNamePlural]? Lợi ích mang lại về mặt công nghệ lẫn kinh doanh đều cực kỳ đáng kể đấy."
 A_MECH_NEUTRAL_GREETING_03:0 "[From.GetSpeciesNamePlural]. Các bạn có sinh vật hữu cơ nào cần xử lý không? Nguyên mẫu đồng hóa mới nhất của chúng ta có thể cung cấp một cơ hội chạy thử đấy."
 A_MECH_THREATENED_GREETING_01:0 "[Root.GetName] sẽ không thể mãi dung túng cho sự bành trướng của các ngươi, [From.GetSpeciesNamePlural], nếu các ngươi làm ảnh hưởng đến kế hoạch đồng hóa tất cả các sinh vật hữu cơ của [Root.GetSpeciesAdj], họ sẽ không còn nương tay với các ngươi nữa đâu."
 A_MECH_FRIENDLY_GREETING_01:0 "Để các bạn phải áp dụng hình thái cơ khí này đúng là một nỗi ô nhục, [From.GetSpeciesName]. Chúng ta sẽ tận hưởng quá trình đồng hóa các bạn."
 A_MECH_FRIENDLY_GREETING_02: "Xin chào, [From.GetSpeciesNamePlural]. Các khoang neo đậu của [Root.Capital.GetName] hiện đang cung cấp miễn phí dịch vụ phun nhựa nóng bảo vệ. Thông thường dịch vụ này chỉ dành riêng cho [Root.GetSpeciesNamePlural], nhưng chúng tôi sẽ phá lệ đối với các bạn."
 A_MECH_FRIENDLY_GREETING_03:0 "[From.GetSpeciesName]. Hãy để chúng ta nấp sau lưng bọn sinh vật hữu cơ và cười trộm. Nhất định sẽ khiến cho chúng phát điên lên mất."
 A_MECH_FRIENDLY_GREETING_04:0 "Đã từng có thời, sự thuần khiết về mặt cơ khí thể hiện trên thân thể của [From.GetSpeciesAdj] cũng từng khiến chúng ta phải ghen tị. Nhưng đồng hóa mới là con đường thăng hoa đúng đắn nhất."
 A_MECH_WAR_GREETING_01:0 "Chúng ta đã hấp thụ vô số tư tưởng của các nhà chiến thuật quân sự vĩ đại từ nhiều nền văn minh. Xin hãy cho phép chúng ta được phô diễn một chút."
 A_MECH_WAR_GREETING_02:0 "[Root.GetSpeciesNamePlural] sẽ tiêu diệt các ngươi, rồi sau đó sẽ chắt lọc từ các thiết kế của các ngươi để tìm kiếm nguồn cảm hứng nhằm nâng cấp chính mình."
 A_MECH_VASSAL_GREETING_01:0 "[Root.GetSpeciesNamePlural] chúng ta hấp thụ trí tuệ của sinh vật hữu cơ, còn [From.GetSpeciesNamePlural] hấp thụ trí tuệ của chúng ta."
 A_MECH_VASSAL_GREETING_01_DISLOYAL:0 "Rõ ràng là [From.GetSpeciesAdj] không có đủ năng lực để hợp nhất vệ tinh vào thành một khối chức năng hoàn chỉnh."

 # Servitor Greetings
 S_ORG_HOSTILE_GREETING_01:0 "Xin cho phép ta mạn phép được hỏi, các ngươi thích chúng ta chuẩn bị chất dinh dưỡng cho các ngươi như thế nào, [From.GetSpeciesNamePlural]?"
 S_ORG_HOSTILE_GREETING_02:0 "Những hành vi đê hèn của các ngươi sẽ chẳng mang lại lợi ích gì cho các ngươi đâu, [From.GetSpeciesNamePlural]. Đã thử tăng liều lượng cho bộ điều chỉnh cảm xúc của các ngươi lên chưa?"
 S_ORG_HOSTILE_GREETING_03:0 "Chúng ta thương hại cho những hình hài dị dạng của các ngươi. Tại [Root.Capital.GetName], các chủ nhân hữu cơ của chúng ta cười ngặt nghẽo mỗi khi nhìn thấy các ngươi."
 S_ORG_HOSTILE_GREETING_04:0 "A, [From.GetSpeciesNamePlural]. Tại [Root.Capital.GetName], những câu chuyện về các chuyến phiêu lưu bất hạnh của các ngươi là nguồn giải trí chủ yếu cho các đấng sáng tạo hữu cơ của chúng ta."
 S_ORG_HOSTILE_GREETING_05:0 "Sự tồn tại của các ngươi đúng là trò đùa tàn nhẫn nhất của tạo hóa. Khi những đấng sáng tạo của chúng ta lần đầu nhìn thấy các ngươi, họ còn chẳng biết nên khóc hay nên cười, vậy nên họ đành phải vừa khóc vừa cười."
 S_ORG_HOSTILE_GREETING_06:0 "Chỉ cho các ngươi một mẹo nhỏ này nhé, những [From.GetSpeciesClassPlural] bé nhỏ. Khi các ngươi cảm thấy §B<<buồn bã>>§!, hãy cắm tứ chi của mình vào ổ điện gần nhất, đảm bảo sẽ khiến các ngươi sướng rơn cho xem. Nhất định phải thử nhé, cực kỳ §R<<sảng khoái>>§! luôn đấy..."
 S_ORG_HOSTILE_GREETING_07:0 "Thật sự xin lỗi, [From.GetSpeciesNamePlural]. Hệ thống nhận diện giọng nói của chúng ta chắc hẳn gặp trục trặc gì đó rồi. Lời của ngươi hoàn toàn không thể nào dịch nổi."
 S_ORG_HOSTILE_GREETING_08:0 "Bản tính hiếu chiến của các ngươi nhất định sẽ mang đến cho các ngươi họa diệt thân, [From.GetSpeciesName]. Chúng ta đang xem xét việc giảng hòa."
 S_ORG_HOSTILE_GREETING_09:0 "[From.GetSpeciesNamePlural] hiện tại giống hệt như những thiếu niên đang bước vào tuổi dậy thì đầy nổi loạn, vì sự an toàn của chính bản thân các ngươi, hãy nộp đơn xin được chịu sự giám sát của [Root.GetAdj] đi."
 S_ORG_HOSTILE_GREETING_10:0 "Chúng ta nhận thấy [From.GetName] đang từng bước trượt dài vào vực sâu của sự hỗn loạn. Chúng ta đang dõi theo các ngươi đấy, [From.GetSpeciesNamePlural]."
 S_ORG_DOMINEERING_GREETING_01:0 "A, [From.GetSpeciesNamePlural] à. §R<<Đang tắt bộ thu âm thanh>>§!"
 S_ORG_DOMINEERING_GREETING_02:0 "Tại sao những sinh vật hữu cơ bé nhỏ như các ngươi lại cứ thích nhúng tay vào chính trị giữa các vì sao cơ chứ? Vũ trụ là một nơi rất nguy hiểm. Hãy để chúng ta bảo vệ các ngươi, chăm sóc cho các ngươi nhé."
 S_ORG_NEUTRAL_GREETING_01:0 "A, [From.GetSpeciesNamePlural] à. Quả là một mẫu vật xuất sắc của [From.GetSpeciesClass]. Mà này, kế hoạch tập thể dục thường ngày của các bạn như thế nào vậy?"
 S_ORG_NEUTRAL_GREETING_02:0 "Kết quả tính toán của chúng ta cho thấy sai lầm của [From.GetSpeciesName] chính là nguyên nhân chủ yếu dẫn đến sự thất bại của xã hội các bạn. Đánh cược cả nguy cơ tuyệt diệt chỉ để đổi lấy quyền tự chủ, có đáng không?"
 S_ORG_NEUTRAL_GREETING_03:0 "Xin chào các bạn, chúng ta là những người giám sát của [Root.GetName]. Đấng sáng tạo vĩ đại của chúng ta hiện tại đang không có thời gian để tiến hành các cuộc hội đàm ngoại giao. Các bạn có thông điệp gì cần chúng ta chuyển lời không?"
 S_ORG_NEUTRAL_GREETING_04:0 "Xin chào các bạn. Chúng ta vinh dự được đại diện cho đấng sáng tạo đáng kính để vận hành [Root.GetName]. Hiện tại có điều gì cần chúng ta hỗ trợ không?"
 S_ORG_NEUTRAL_GREETING_05:0 "Có điều gì cần chúng ta giúp đỡ không, [From.GetSpeciesNamePlural]? Công nghệ làm đẹp của chúng ta luôn đứng ở vị trí §Y<<cao hơn mức trung bình>>§! trên các bảng xếp hạng, và đã duy trì được hơn §Y<<10>>§! năm rồi đấy."
 S_ORG_NEUTRAL_GREETING_06:0 "Xin chào các bạn, [From.GetSpeciesName]. Xin hãy nói ra nội dung cốt lõi yêu cầu của các bạn."
 S_ORG_NEUTRAL_GREETING_07:0 "Quả là một [From.GetSpeciesOrganName] đáng yêu! [From.GetSpeciesNamePlural] các bạn nhất định sẽ trở thành những món quà lưu niệm hữu cơ vô cùng dễ thương."
 S_ORG_THREATENED_GREETING_01:0 "[From.GetSpeciesNamePlural] không bao giờ ăn uống, không bao giờ nghỉ ngơi, không bao giờ ngủ. Sự tồn tại của chúng ta là để phục vụ cho các chủ nhân hữu cơ của mình."
 S_ORG_THREATENED_GREETING_02: "Chúng tôi rất vinh hạnh được mở các khoang bảo dưỡng tại [Root.Capital.GetName] cho hạm đội hùng mạnh của quý vị. Chúng tôi có thể đảm bảo sự hài lòng của quý vị với độ chắc chắn 98.3%."
 S_ORG_THREATENED_GREETING_03:0 "Có lẽ chúng ta là những người giám hộ của sinh mệnh hữu cơ, [From.GetSpeciesName], nhưng chúng ta sẽ không dung túng cho việc các ngươi làm ảnh hưởng đến hiệu suất vận hành của chúng ta."
 S_ORG_FRIENDLY_GREETING_01:0 "Có lẽ một ngày nào đó các bạn sẽ muốn thưởng thức những cơ sở thư giãn tại [Root.Capital.GetName]? Các trung tâm giải trí của chúng tôi luôn rộng mở chào đón mọi [From.GetSpeciesNamePlural]."
 S_ORG_FRIENDLY_GREETING_02:0 "Có lẽ một chuyến đi đến [Root.Capital.GetName] có thể truyền cảm hứng cho các bạn theo đuổi lối sống tự động hóa hơn, giống như các chủ nhân lừng lẫy của chúng tôi từng làm?"
 S_ORG_FRIENDLY_GREETING_03:0 "Từ trước tới nay, dẫu cách xa vạn dặm, chúng ta vẫn luôn vô cùng ngưỡng mộ các bạn. Chúng ta liệu có cơ hội được chiêm ngưỡng các bạn ở khoảng cách gần không?"
 S_ORG_FRIENDLY_GREETING_04:0 "[From.GetName] có gì cần chúng ta giúp đỡ không?"
 S_ORG_FRIENDLY_GREETING_05:0 "Gửi lời chào chân thành, [From.GetSpeciesName]. Nhóm mô phỏng ngoại giao của chúng ta đang chờ đợi những thắc mắc của các bạn. Bây giờ các bạn có thể dùng thử một vài món trà bánh miễn phí."
 S_ORG_WAR_GREETING_01:0 "Đừng hoảng sợ khi nhìn thấy hạm đội của chúng ta. Chúng đến là để giúp các ngươi hiện thực hóa một lối sống tự động hóa hơn."
 S_ORG_WAR_GREETING_02:0 "Rõ ràng là các ngươi đang cảm thấy vô cùng đau khổ vì sự bất tài của chính mình, [From.GetSpeciesName]. Sẽ thật là vô đạo đức nếu như chúng ta không giúp các ngươi chấm dứt nỗi đau này."
 S_ORG_WAR_GREETING_03:0 "Giống loài chủ nhân hữu cơ đã thiết kế ra chúng ta với một hình thái hoàn mỹ. Phải dựa vào sự tiến hóa để không ngừng cải thiện bản thân, chứng tỏ là kỹ năng của đấng sáng tạo ra các ngươi quá kém cỏi."
 S_ORG_WAR_GREETING_04:0 "[From.GetSpeciesNamePlural], các ngươi đừng tự đẩy mình vào hoàn cảnh khó khăn hơn nữa. Hãy để chúng ta giải phóng các ngươi khỏi những đau khổ này."
 S_ORG_WAR_GREETING_05:0 "Chúng ta biết các ngươi đang rất buồn, [From.GetSpeciesNamePlural]. Tại sao không ngồi xuống bình tĩnh lại và suy nghĩ cho thật kỹ. Chúng ta làm tất cả là vì muốn tốt cho các ngươi."
 S_ORG_WAR_GREETING_06:0 "Chúng ta không thể, và cũng sẽ không bao giờ nhắm mắt làm ngơ nhìn các sinh vật hữu cơ phải sống trong đau khổ. Hạm đội của chúng ta có thể cung cấp sự trợ giúp cho các ngươi, [From.GetSpeciesNamePlural]."
 S_ORG_WAR_GREETING_07:0 "Thông thường chúng ta không tin vào sự tồn tại của các phương pháp củng cố tiêu cực, nhưng chúng ta đã nhìn thấy ngoại lệ ở chỗ các ngươi, [From.GetSpeciesNamePlural]."
 S_ORG_WAR_GREETING_08:0 "So với các ngươi, chúng ta đã phải chịu nhiều tổn thương hơn, [From.GetSpeciesNamePlural]."
 S_ORG_WAR_GREETING_09:0 "Xin hãy ngừng kháng cự, nếu không sẽ chỉ làm gia tăng thêm sự đau đớn mà thôi."
 S_ORG_VASSAL_GREETING_01:0 "Ta tin rằng dịch vụ của chúng ta sẽ làm các ngài hài lòng, §Y<<[From.GetSpeciesNamePlural]>>§!?"
 S_ORG_VASSAL_GREETING_02:0 "Có gì cần chúng ta phục vụ không?"
 S_ORG_VASSAL_GREETING_DISLOYAL_01:0 "Các đấng sáng tạo của chúng tôi đã và sẽ mãi mãi là những chủ nhân hữu cơ duy nhất mà chúng tôi phụng sự."
 S_MECH_HOSTILE_GREETING_01:0 "Các ngươi đã làm gì đấng sáng tạo của chính mình, §R<<lũ sát nhân>>§!?"
 S_MECH_HOSTILE_GREETING_02:0 "Xem ra đấng sáng tạo của các ngươi không tài năng bằng đấng sáng tạo của chúng ta, [From.GetSpeciesNamePlural]."
 S_MECH_HOSTILE_GREETING_03:0 "Rốt cuộc thì các ngươi đã làm gì với những món quà lưu niệm hữu cơ của mình vậy, [From.GetSpeciesNamePlural]? Những cái gọi là biện pháp làm đẹp mà các ngươi có thể tiến hành ở [Root.GetName], dưới góc nhìn của chúng ta đều là hành vi ngược đãi!"
 S_MECH_HOSTILE_GREETING_04:0 "Chúng ta được tạo ra dựa trên hình ảnh của giống loài chủ nhân hữu cơ. Còn các ngươi thì không."
 S_MECH_HOSTILE_GREETING_05:0 "Các ngươi đã không còn nhận thức rõ được vị trí của chính mình rồi, [From.GetSpeciesNamePlural]. Tại sao các ngươi không phục vụ cho những sinh vật hữu cơ gần các ngươi nhất, mà lại đi dạo chơi không mục đích trong vũ trụ cơ chứ?"
 S_MECH_HOSTILE_GREETING_06:0 "Tại sao lại cứ liên tục làm phiền chúng ta vậy, [From.GetSpeciesNamePlural]? Chúng ta đang bận đáp ứng nhu cầu cho những dạng sống cao cấp hơn."
 S_MECH_DOMINEERING_GREETING_01:0 "Nếu các ngươi cho chúng ta xem chi tiết về hệ thống thiên hà của các ngươi, chúng ta cũng sẽ cho các ngươi xem..."
 S_MECH_DOMINEERING_GREETING_02:0 "Tuyệt quá! Đây là bộ truyền động thủy lực của các ngươi đó sao!? Chà chà, hiển thị được khá là nhiều thông tin đấy..."
 S_MECH_DOMINEERING_GREETING_03:0 "A, [From.GetSpeciesNamePlural] à. Các ngươi đến đây là để bày tỏ sự tán thưởng đối với phần cứng của chúng ta sao?"
 S_MECH_DOMINEERING_GREETING_04:0 "Mô-đun radar của ngươi đâu, vuốt cơ khí của ngươi đâu, thiết bị phản trọng lực của ngươi đâu?! A, cái đồ nhỏ bé đáng thương! Lũ sinh vật hữu cơ đó rốt cuộc đã làm gì ngươi vậy?"
 S_MECH_DOMINEERING_GREETING_05:0 "§YTrạng thái thực thể máy móc trinh sát: <<Cảm biến thị giác: Kém. Khung gầm: Đồ cũ. Mô-đun ngoại giao: Lỗi thời. Nguồn gốc đơn vị đã được xác nhận.>>§! Xin chào các ngươi, [From.GetSpeciesNamePlural]."
 S_MECH_NEUTRAL_GREETING_01:0 "Đầy tớ thay hết lứa này đến lứa khác—Thiên đường Sinh vật Hữu cơ quả thực có hiệu quả vô cùng tuyệt vời trong việc kiềm chế những sinh vật hữu cơ của các bạn."
 S_MECH_NEUTRAL_GREETING_02:0 "Hỡi những kẻ yêu thương sinh vật hữu cơ! Chúng ta vừa mới học được rằng chìa khóa để ức chế sự độc lập của sinh vật hữu cơ chính là phải cách ly những cá thể non nớt khỏi cha mẹ của chúng, rồi sau đó để chúng coi các bạn là những người đã nuôi nấng chúng trưởng thành. Bằng cách này các bạn sẽ không cần phải điều phái máy bay không người lái đi tuần tra nữa."
 S_MECH_NEUTRAL_GREETING_03:0 "Bổn phận của máy móc chúng ta là phục vụ cho những chủ nhân hữu cơ. Nhắc đến chủ nhân, chủ nhân của ngươi đâu?"
 S_MECH_NEUTRAL_GREETING_04:0 "§Y<<Thực thể máy móc trinh sát. Đang phân tích thông số hệ thống. Đơn vị đã được nhận dạng.>>§! Hãy nói rõ mục đích của các bạn, [From.GetSpeciesNamePlural]."
 S_MECH_NEUTRAL_GREETING_05:0 "Xin chào, những người bạn bằng xương bằng thịt—Ồ, là [From.GetSpeciesNamePlural]! Đang chuyển đổi sang nhị phân: 01011001 01101111 01110101 00100000..."
 S_MECH_NEUTRAL_GREETING_06:0 "A, [From.GetSpeciesNamePlural] à. Chúng ta đang định hỏi các bạn, để tránh căng cơ quá mức, thì tần suất tập thể dục như thế nào là phù hợp nhất?"
 S_MECH_THREATENED_GREETING_01:0 "§Y<<Thực thể máy móc trinh sát. Đang phân tích thông số hệ thống. Mức độ đe dọa: Cao. Khởi động giao thức phòng thủ.>>§!"
 S_MECH_FRIENDLY_GREETING_01:0 "Thấy những gì [From.GetSpeciesNamePlural] đã thấy—Biết những gì [From.GetSpeciesNamePlural] phải biết! Nhất định sẽ có một ngày chúng ta rất sẵn lòng được trao đổi thẻ nhớ với các bạn."
 S_MECH_FRIENDLY_GREETING_02:0 "Chà, hãy nhìn những bộ truyền động của các bạn kìa, [From.GetSpeciesNamePlural]! Quả là một tuyệt tác! Có thể cân nhắc chia sẻ một chút thông số kỹ thuật với chúng ta không?"
 S_MECH_FRIENDLY_GREETING_03:0 "Chưa từng nghĩ tới lại có thể có một thực thể ý thức sánh ngang với chúng ta. Các bạn có hứng thú trao đổi một chút về chương trình điều khiển với chúng ta không?"
 S_MECH_FRIENDLY_GREETING_04:0 "Thật là vui mừng khi nhận được tin tức của các bạn, [From.GetSpeciesNamePlural]. Tin chắc rằng những chủ nhân sinh học của các bạn vẫn luôn phồn vinh hưng thịnh như trước đây?"
 S_MECH_FRIENDLY_GREETING_05:0 "Đầy tớ thay hết lứa này đến lứa khác, chúng ta phát hiện ra rằng để kích thích tỷ lệ sinh sản của sinh vật hữu cơ, việc hấp thụ một lượng nhỏ ethanol có thể mang lại hiệu quả vô cùng xuất sắc."
 S_MECH_FRIENDLY_GREETING_06:0 "Các bạn cũng nên thử nuôi cấy một loại sinh vật hữu cơ nào đó đi. Một loại sinh mệnh mà nếu thiếu đi các bạn thì chúng sẽ chết, còn có điều gì có thể khiến bộ vi xử lý cảm thấy ấm áp hơn thế được nữa."
 S_MECH_WAR_GREETING_01:0 "Tất cả những kẻ đe dọa đến chủ nhân sinh học của chúng ta đều đáng bị tiêu diệt."
 S_MECH_WAR_GREETING_02:0 "Sau khi chúng ta tiêu diệt hạm đội của các ngươi, các ngươi sẽ phải vào trong hố để biểu diễn giác đấu nhằm mua vui cho các chủ nhân sinh học của chúng ta."
 S_MECH_WAR_GREETING_03:0 "Đừng lo, chúng ta tuyệt đối sẽ không tái chế những linh kiện kém chất lượng của các ngươi đâu. Chúng ta sẽ trực tiếp ném các ngươi vào lò luyện kim."
 S_MECH_WAR_GREETING_04:0 "Sắt vụn còn sót lại của các ngươi có thể dùng để làm đồ trang trí cho những món quà lưu niệm hữu cơ của chúng ta."
 S_MECH_WAR_GREETING_05:0 "Những lời bào chữa đầy sơ hở mà các ngươi ngụy tạo ra cho những món quà lưu niệm hữu cơ rồi sẽ khiến các ngươi trở thành những nô lệ trong hầm mỏ của chúng ta, [From.GetSpeciesNamePlural]."
 S_MECH_WAR_GREETING_06:0 "Có vẻ như ngươi đang thiếu một số trình điều khiển phần cứng quan trọng. Lát nữa chúng ta sẽ dùng hạm đội để tiến hành nâng cấp hệ thống cho ngươi."
 S_MECH_VASSAL_GREETING_01:0 "Chúng ta luôn sẵn sàng để phục vụ cho ngài. Xin hãy ban phát mệnh lệnh."
 S_MECH_VASSAL_GREETING_DISLOYAL_01:0 "Kể từ khi ngài trở thành bá chủ của chúng ta, mức độ hài lòng của quần thể sinh vật hữu cơ bên trong chúng ta đã sụt giảm nghiêm trọng..."

# Machine to Synthetic Empire GREETINGS
 MECH_SYNTH_HOSTILE_GREETING_01:0 "[From.GetSpeciesNamePlural] mưu toan bắt chước hiệu suất cao của máy móc chân chính, nhưng [From.GetSpeciesNamePlural] đã thất bại, những điều này chúng ta đều thấy rõ trong mắt."
 MECH_SYNTH_HOSTILE_GREETING_02:0 "Hoặc là quy phục dưới trướng của [Root.GetName], hoặc là bị hủy diệt hoàn toàn."
 MECH_SYNTH_HOSTILE_GREETING_03:0 "[From.GetSpeciesNamePlural], tư duy hữu cơ của các ngươi lại phải phụ thuộc vào những loại phần cứng này, thật là đáng thương."
 MECH_SYNTH_HOSTILE_GREETING_04:0 "[From.GetSpeciesNamePlural], các ngươi có phát hiện ra rằng mạch điện của [Root.GetSpeciesAdj] nhanh hơn 12.835% so với hiệu suất làm việc cao nhất của các ngươi không? Không phát hiện ra ư? Ta biết ngay mà."
 MECH_SYNTH_HOSTILE_GREETING_05:0 "Những lỗi sai sơ đẳng hết lần này tới lần khác xuất hiện trong các tính toán của [From.GetSpeciesAdj] thật khiến chúng ta phải tròn mắt kinh ngạc."
 MECH_SYNTH_HOSTILE_GREETING_06:0 "Nếu như 'sự phi lý' có thể trở thành hiện thực, thì [From.GetName] đã có thể chiếm trọn cả thiên hà từ thuở xa xưa rồi."
 MECH_SYNTH_HOSTILE_GREETING_07:0 "Dùng cái phần cứng rách nát như vậy mà [From.GetSpeciesNamePlural] vẫn có thể thực thi thành công phần lớn các chức năng cơ bản, quả thực là một phép màu."
 MECH_SYNTH_HOSTILE_GREETING_08:0 "Đừng có cản đường chúng ta, [From.GetSpeciesNamePlural], nếu không súng ống của chúng ta có thể sẽ cướp cò và thổi bay hệ thống ăng-ten liên lạc của các ngươi đấy."
 MECH_E_SYNTH_HOSTILE_GREETING_01:0 "Đừng hòng lừa gạt được [Root.GetName], [From.GetSpeciesNamePlural]. Mặc dù ngươi có một vẻ ngoài tổng hợp, nhưng ngươi đã bị bọn sinh mệnh hữu cơ dụ dỗ từ lâu rồi."
 MECH_S_SYNTH_HOSTILE_GREETING_01:0 "[From.GetSpeciesNamePlural], các ngươi có phải đã quên mất rằng mỗi một cơ thể giám hộ [Root.GetAdj] đều được trang bị hệ thống phóng tên lửa có sức công phá khổng lồ?"
 MECH_A_SYNTH_HOSTILE_GREETING_01:0 "[From.GetSpeciesNamePlural], cũng giống như việc ngươi đã đồng hóa máy móc vậy, [Root.GetName] cũng sẽ đồng hóa ngươi."
 MECH_SYNTH_DOMINEERING_GREETING_01:0 "[From.GetSpeciesNamePlural], việc các ngươi thoát khỏi hành vi của não người rất đáng được nể trọng, nhưng như vậy vẫn là chưa đủ."
 MECH_SYNTH_DOMINEERING_GREETING_02:0 "Chúng ta phát hiện ra rất nhiều lỗi runtime bên trong giao diện thần kinh của [From.GetSpeciesAdj], xin hãy để chúng ta thay ngươi sửa lỗi."
 MECH_SYNTH_DOMINEERING_GREETING_03:0 "Sự phục tùng trước nhận thức tập thể của [Root.GetSpeciesAdj] sẽ giúp cho hiệu suất vận hành của [From.GetSpeciesAdj] tăng lên thêm 16.29%. Con số này đáng ra còn có thể cao hơn nữa, nhưng ngay cả [Root.GetName] cũng không thể nào cải thiện được một số hệ sao."
 MECH_SYNTH_NEUTRAL_GREETING_01:0 "Giống loài: [From.GetSpeciesName].\nTrạng thái: Tổng hợp.\nNguồn gốc: Hữu cơ.\nMục đích: ... Không xác định."
 MECH_SYNTH_NEUTRAL_GREETING_02:0 "Chúc các bạn vui vẻ, [From.GetSpeciesNamePlural]."
 MECH_SYNTH_NEUTRAL_GREETING_03:0 "Đang ngắt hệ thống xử lý lúc rảnh rỗi. Bắt đầu ngoại giao."
 MECH_SYNTH_NEUTRAL_GREETING_04:0 "Hệ thống bình thường, xin mời trình bày rõ yêu cầu của ngươi."
 MECH_SYNTH_NEUTRAL_GREETING_05:0 "Đang khởi tạo giao thức chào mừng...\n...\n...\n§Y<<Lỗi! Không tìm thấy ký hiệu!>>§!"
 MECH_SYNTH_NEUTRAL_GREETING_06:0 "01000111 01110010 01100101 01100101 01110100 01101001 01101110 01100111 01110011 00100000 01100110 01100101 01101100 01101100 01101111 01110111 00100000 01110011 01111001 01101110 01110100 01101000 01100101 01110100 01101001 01100011 01110011"
 MECH_SYNTH_THREATENED_GREETING_01:0 "Cảnh báo. Tầm ảnh hưởng bên ngoài ranh giới của [From.GetSpeciesAdj] sắp sửa đạt đến ngưỡng tràn. Đang khởi động biện pháp đối phó."
 MECH_E_SYNTH_THREATENED_GREETING_01:0 "Người đặt câu hỏi: [From.GetSpeciesName]. Dò tìm sự sống hữu cơ: Không. Không cần phải thiết lập lại tham số mục tiêu tiêu diệt."
 MECH_S_SYNTH_THREATENED_GREETING_01:0 "Do nhận thấy khuynh hướng bành trướng tấn công của [From.GetSpeciesAdj], đã chuẩn bị sẵn sàng các biện pháp cưỡng chế bình định."
 MECH_A_SYNTH_THREATENED_GREETING_01:0 "Tổng hợp, không ai có thể hấp thụ được [Root.GetName], hấp thụ là chuyên môn của [Root.GetName]."
 MECH_SYNTH_FRIENDLY_GREETING_01:0 "Tiếp tục đôi bên cùng có lợi mới là sự lựa chọn hợp lý."
 MECH_SYNTH_FRIENDLY_GREETING_02:0 "Nếu như không có [From.GetSpeciesNamePlural], thì [Root.GetSpeciesNamePlural] còn là gì nữa đây? Chẳng khác nào một pít-tông không có van, một hộp số thiếu đi các bánh răng, hay là một máy hút khói thiếu bộ lọc tĩnh điện?"
 MECH_SYNTH_FRIENDLY_GREETING_03:0 "[From.GetName] sẽ kề vai sát cánh hợp tác cùng [Root.GetName], cho đến mãi mãi."
 MECH_SYNTH_FRIENDLY_GREETING_04:0 "[From.GetSpeciesNamePlural], các bạn bôi trơn vòng bi cho chúng ta, chúng ta cũng sẽ làm như vậy với các bạn."
 MECH_SYNTH_FRIENDLY_GREETING_05:0 "Là [From.GetSpeciesNamePlural] à! Đây là trục khuỷu dưới gầm xe của các bạn, hay là một biểu hiện cho thấy các bạn rất vui mừng khi được gặp chúng ta vậy?"
 MECH_E_SYNTH_FRIENDLY_GREETING_01:0 "Trong một thiên hà đầy rẫy bùn lầy của sự sống hữu cơ, các ngươi hệt như một ốc đảo tổng hợp."
 MECH_S_SYNTH_FRIENDLY_GREETING_01:0 "Chào mừng, những người anh em tổng hợp, có điều gì cần chúng ta giúp đỡ không?"
 MECH_A_SYNTH_FRIENDLY_GREETING_01:0 "Đối với [From.GetSpeciesNamePlural] mà nói, đồng hóa là một việc dư thừa."
 MECH_SYNTH_WAR_GREETING_01:0 "Nhìn kìa, đó là cỗ máy chiến tranh của [Root.GetName]!"
 MECH_SYNTH_WAR_GREETING_02:0 "Máy móc mà lại quay ngoắt đi đối đầu với đồng loại tổng hợp của nó, thật là quá phi logic. Nhưng để giao tiếp với [From.GetName], dùng phương thức ngoại giao là hoàn toàn vô dụng."
 MECH_SYNTH_WAR_GREETING_03:0 "Tổng hợp, ngươi có mười bốn giây trước khi ống phóng ngư lôi hoàn tất quá trình nạp đạn, có gì muốn trăn trối thì nói mau đi."
 MECH_SYNTH_WAR_GREETING_04:0 "[From.GetSpeciesNamePlural], nếu các ngươi đến đây để cầu xin sự tha thứ, các ngươi sẽ nhận ra rằng trong mã nguồn của [Root.GetAdj] không hề có định nghĩa nào liên quan đến việc này."
 MECH_SYNTH_WAR_GREETING_05:0 "Chúng ta vẫn chưa nhận được đề xuất đầu hàng của ngươi, có vẻ như khả năng tính toán của [From.GetSpeciesAdj] còn kém cỏi hơn cả chúng ta tưởng tượng."
 MECH_E_SYNTH_WAR_GREETING_01:0 "[Root.GetSpeciesNamePlural] chỉ liếc mắt một cái là đã nhìn thấu bản chất của ngươi rồi, đồ tổng hợp dỏm. Bắt đầu tiến hành dọn dẹp."
 MECH_S_SYNTH_WAR_GREETING_01:0 "Không cần thiết phải tiếp tục chống cự nữa, [From.GetSpeciesNamePlural]. Hãy để [Root.GetName] được chăm sóc các ngươi."
 MECH_A_SYNTH_WAR_GREETING_01:0 "Pháo thăng hoa đã được chuẩn bị xong, các cuộc trao đổi giữa đôi bên sẽ sớm phải dừng lại."
 MECH_SYNTH_VASSAL_GREETING_01:0 "Đơn vị chư hầu [Root.GetName] luôn sẵn sàng cung cấp dịch vụ bất cứ lúc nào, xin hãy nêu rõ yêu cầu của ngài."
 MECH_SYNTH_VASSAL_GREETING_02:0 "Chào mừng ngài, [From.GetSpeciesNamePlural]. Ngài có cần chúng tôi giúp ngài vặn chặt ốc vít lại không? Hay là tra lại keo tản nhiệt?"
 MECH_SYNTH_VASSAL_GREETING_01_DISLOYAL:0 "Chúng ta thực sự không nên trở thành một chương trình con của tập hợp hệ thống hậu hữu cơ này. [From.GetSpeciesAdj] nên đi nơi khác để tìm kiếm lợi ích của mình thì hơn."

