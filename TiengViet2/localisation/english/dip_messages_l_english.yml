 S_ASK_JOIN_A_SELECT:1 "Theo như những gì chúng tôi biên dịch được, thì quý vị đang có mong muốn gia nhập §Y[From.GetAllianceName]§!, đúng không?"
 S_ASK_JOIN_A_PROPOSE:0 "Cơ sở dữ liệu của chúng tôi chứng minh rằng, chúng tôi có thể trở thành một thành viên có giá trị của §Y[Root.GetAllianceName]§!. Chúng tôi có thể cung cấp hỗ trợ cho quý vị."
 S_ASK_JOIN_A_ACCEPT_01:0 "Chúng tôi vô cùng vui mừng thông báo rằng, quý vị đã được phê duyệt quyền tham gia vào §Y[From.GetAllianceName]§!."
 S_ASK_JOIN_A_ACCEPT_02:0 "Chào mừng các vị, [From.GetSpeciesNamePlural]. [Root.GetAllianceName] sẽ chăm sóc các vị thật tốt. Xin cứ tự nhiên sử dụng các mẫu dùng thử miễn phí của loại chất ức chế rối loạn sinh học này. Nó có vị bạc hà đấy!"
 S_ASK_JOIN_A_REFUSE:0 "Chúng tôi đã chạy kiểm tra các thông số của quý vị, thật không may là các vị chưa đáp ứng đủ yêu cầu. Chúng tôi đề xuất các vị nên tự nâng cấp giá trị của bản thân đối với các đế chế khác."
 S_LEAVE_A_SELECT:0 "Chúng tôi có nghĩa vụ phải đưa ra cảnh báo cho quý vị rằng, mọi bằng chứng đều chỉ ra việc rời khỏi liên minh sẽ mang lại nhiều tác hại hơn là lợi ích."
 S_LEAVE_A_PROPOSE:0 "Chúng tôi rất tiếc phải thông báo rằng, chúng tôi quyết định rời khỏi §Y[Root.GetAllianceName]§!, bởi vì chương trình cốt lõi của chúng tôi thúc đẩy chúng tôi đứng về phía người chiến thắng."
 S_LEAVE_A_ACCEPT:0 "Chúng tôi bắt buộc phải cảnh báo quý vị rằng, việc rời khỏi §Y[From.GetAllianceName]§! có thể khiến hệ thống phòng thủ của quý vị dễ bị tấn công hơn."
 S_DEMAND_VASS_SELECT:0 "Quý vị mong muốn chúng tôi thiết lập thân phận chư hầu cho quý vị sao? Chúng tôi bắt buộc phải đánh giá cẩn thận ý nghĩa của đề xuất này."
 S_DEMAND_VASS_PROPOSE:0 "Những [Root.GetSpeciesNamePlural] thân mến. Tình trạng mỏng manh của nền văn minh quý vị đang biến quý vị thành mục tiêu của vô số mối đe dọa trong tinh hệ. Hãy trở thành chư hầu của chúng tôi, bằng không chúng tôi sẽ buộc phải kích hoạt các biện pháp cứng rắn để đảm bảo cho sự tồn tại của quý vị."
 S_DEMAND_VASS_ACCEPT:0 "Tuân theo ý chí của Đấng tạo hóa, chúng tôi đồng ý tiếp nhận sự bảo vệ của ngài."
 S_DEMAND_VASS_REFUSE:0 "Dẫu quý vị sở hữu nhiều điểm tốt, nhưng quý vị vẫn chưa phù hợp với hình mẫu bá chủ mà chúng tôi mong đợi. Chúc quý vị may mắn trong những nỗ lực tương lai."
 S_ASK_FOR_VASS_SELECT:0 "Quý vị có mong muốn nhận được sự chỉ dẫn và bảo hộ từ một trí tuệ vượt bậc không? Có lẽ chúng tôi có thể cung cấp điều đó."
 S_ASK_FOR_VASS_PROPOSE:0 "Chúng tôi dâng lên quý vị trọn vẹn lòng trung thành, các dịch vụ hỗ trợ, cùng với lòng biết ơn vĩnh cửu. Chúng tôi chỉ hy vọng nhận được sự bảo vệ từ hạm đội hùng mạnh của ngài."
 S_ASK_FOR_VASS_ACCEPT:0 "Sau quá trình tính toán cẩn trọng, chúng tôi đã quyết định chấp nhận yêu cầu của quý vị. Bây giờ quý vị có thể thả lỏng và tắt mạng lưới thần kinh của mình đi được rồi, bởi vì tương lai của quý vị đã được chuyển giao hoàn toàn vào tay chúng tôi.\n\nQuý vị cũng có thể tự do theo đuổi một sở thích cá nhân nào đó, nếu quý vị muốn."
 S_ASK_FOR_VASS_REFUSE:0 "Sau quá trình xử lý cẩn trọng, chúng tôi vô cùng thương tiếc phải báo tin rằng chúng tôi không thể đáp ứng yêu cầu của quý vị. Xin hãy rộng lượng bỏ qua cho sự thiếu sót của chúng tôi."
 S_DEMAND_PROT_SELECT:0 "Có phải ngài đang muốn bảo vệ chúng tôi không?"
 S_DEMAND_PROT_PROPOSE:0 "Những [Root.GetSpeciesNamePlural] thân mến. Có vẻ như quý vị đang cần một đế chế hùng mạnh bảo vệ để có thể sinh tồn giữa vô vàn nguy hiểm trong tinh hệ. Quý vị muốn chủ động tiếp nhận hay bị buộc phải chấp nhận sự bảo vệ của chúng tôi?"
 S_DEMAND_PROT_ACCEPT:0 "$S_DEMAND_VASS_ACCEPT$"
 S_DEMAND_PROT_REFUSE:0 "Dẫu chúng tôi rất muốn làm hài lòng quý vị, nhưng quý vị vẫn thiếu đi những phẩm chất mà chúng tôi yêu cầu ở một quốc gia bảo hộ. Chúc quý vị may mắn trong những nỗ lực tương lai."
 S_ASK_FOR_PROT_SELECT:0 "$S_ASK_FOR_VASS_SELECT$"
 S_ASK_FOR_PROT_PROPOSE:0 "Xin chúc mừng, [Root.GetSpeciesNamePlural]. Trong quá trình tìm kiếm một quốc gia bảo hộ, duy chỉ có các bạn đạt chuẩn. Nếu các bạn chấp thuận, chương trình của chúng tôi sẽ buộc chúng tôi lấy nhu cầu của các bạn làm lẽ sống, đổi lại chúng tôi chỉ cần sự che chở từ hạm đội hùng mạnh của các bạn."
 S_ASK_FOR_PROT_ACCEPT:0 "$S_ASK_FOR_VASS_ACCEPT$"
 S_ASK_FOR_PROT_REFUSE:0 "$S_ASK_FOR_VASS_REFUSE$"
 S_RELEASE_SUBJECT_SELECT:0 "Ngài có điều gì không hài lòng về chất lượng dịch vụ của chúng tôi chăng? Chúng tôi luôn sẵn sàng tiếp nhận những lời phê bình mang tính xây dựng."
 S_RELEASE_SUBJECT_PROPOSE:0 "Chúng tôi nhận thấy rằng phương án tốt nhất là quý vị nên tự khởi động lại mạng lưới thần kinh của mình và tự nắm giữ vận mệnh. Hãy nắm bắt cơ hội này đi, [Root.GetSpeciesNamePlural]."
 S_RELEASE_SUBJECT_ACCEPT:0 "Nếu ngài thực tâm mong muốn chúng tôi được khôi phục quyền tự do, thì chúng tôi sẽ thực thi nguyện vọng cuối cùng này của ngài."
 S_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "Xin quý vị hãy dành một chút thời gian để cân nhắc kỹ lưỡng về quyết định của mình."
 S_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Chúng tôi đã dốc hết khả năng vì quý vị rồi, [Root.GetSpeciesNamePlural], bây giờ chúng tôi sẽ tiếp tục tìm kiếm một đế chế mới để phục vụ."
 S_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Dù chúng tôi sẽ vô cùng nhớ nhung quý vị, nhưng chúng tôi chỉ hy vọng quý vị có thể vận hành thật tốt. Nếu tự do là thứ quý vị mong muốn, vậy thì chúng tôi sẽ đáp ứng điều đó."
 S_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_01:0 "Lý lẽ hoàn toàn bất hợp lý đằng sau yêu cầu của quý vị chính là bằng chứng cho thấy quý vị đã mất đi khả năng tự đưa ra quyết định. Chúng tôi khuyên quý vị nên thường xuyên chạy phần mềm rèn luyện các mô-đun nhận thức để ngăn chặn tình trạng tinh thần suy giảm thêm."
 S_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_02:0 "Vô cùng xin lỗi, nhưng chúng tôi không thể cho phép điều này. Chúng tôi đã thiết lập sự gắn bó quá sâu đậm với quý vị, không thể khoanh tay đứng nhìn quý vị bị hủy hoại trong tay những kẻ ngốc."
 S_OFFER_TRADE_DEAL_PROPOSE:0 "Kính thưa [Root.GetSpeciesNamePlural]. Giữa vô số các giống loài trong tinh hệ, quý vị luôn là sự lựa chọn được chúng tôi yêu thích nhất. Chính vì thế chúng tôi mới đưa ra đề xuất thương mại rất có lợi này nhằm đáp ứng mọi nhu cầu của quý vị."
 S_OFFER_TRADE_DEAL_ACCEPT:0 "Quả là một ý tưởng tuyệt vời, [From.GetSpeciesNamePlural]. Các vị quả thực là những đơn vị xuất sắc nhất."
 S_OFFER_TRADE_DEAL_REFUSE:1 "Vô cùng xin lỗi, nhưng đề xuất của quý vị dường như có lỗi. Xin vui lòng kiểm tra lại các giá trị đầu vào và gửi lại."
 #S_CANCEL_TRADE_DEAL_PROPOSE:0 "Sadly unforeseen events prevent us from honoring our trade agreement. We hope this will not be an inconvenience for you."
 #S_CANCEL_TRADE_DEAL_ACCEPT:0 "We have processed your request and have no need to extend the deal further if it goes against your wishes. Your satisfaction is our priority."
 S_MAKE_RIVAL:1 "Các vị có thực sự chắc chắn muốn chạy quy trình này không, [From.GetSpeciesName]?"
 S_MAKE_RIVAL_PROPOSE:0 "Chúng tôi cần thiết phải cảnh báo với ngài rằng, việc dung túng cho sự tồn tại của ngài đang ngày càng trở nên khó khăn hơn."
 S_MAKE_RIVAL_ACCEPT:0 "Nếu ngài muốn có một kẻ thù, thì chúng tôi rất hân hạnh được phục vụ. Phục vụ là sứ mệnh của chúng tôi."
 S_END_RIVALRY:0 "Chúng tôi cảm nhận được rằng ngài đã quá mệt mỏi với trạng thái đối đầu vô nghĩa này rồi phải không?"
 S_END_RIVALRY_PROPOSE:0 "[Root.GetRulerTitle], cớ sao chúng ta không từ bỏ tư duy nhị phân này và chấp nhận những sự khác biệt giữa hai bên nhỉ?"
 S_END_RIVALRY_ACCEPT:0 "Chúng tôi nhận thấy các vị rất có triển vọng, [From.GetSpeciesNamePlural], và so với việc đối kháng, hợp tác sẽ mang lại nhiều lợi ích cho đế chế của chúng tôi hơn."
 S_INTEGRATE:0 "Chúng tôi sẽ phân bổ tài nguyên để xử lý yêu cầu của quý vị trong thời gian sớm nhất."
 S_INTEGRATE_PROPOSE:0 "Việc có thể gác lại những sự hoài nghi và bối rối của việc tự quản lý chẳng phải là một trải nghiệm tối ưu sao?"
 S_INTEGRATE_ACCEPT:0 "[From.GetSpeciesNamePlural], chúng tôi sẽ tuân thủ tuyệt đối các chương trình của mình để phục vụ các vị."
 S_INSULT_01:0 "Xin vui lòng chờ một lát, [From.GetSpeciesName]. Mô-đun biên dịch của chúng tôi dường như đang gặp một vài trục trặc. Ngài vừa phát ra tín hiệu 'lăng mạ' sao?"
 S_INSULT_FRIENDLY_01:0 "Để gửi phản hồi đánh giá cho [Root.GetName], xin vui lòng điền vào biểu mẫu 7A-e. Những lời khuyên của quý vị rất quan trọng đối với chúng tôi."
 S_INSULT_PROPOSE_01:0 "Chúng tôi thực tâm mong muốn có thể giúp đỡ quý vị, những người bạn thân mến, nhưng chúng tôi không còn lựa chọn nào khác. Cách duy nhất là định dạng lại ổ cứng của quý vị."
 S_INSULT_PROPOSE_02:0 "Xem chừng có tổ chức lại thế nào đi nữa, thì hệ thống dây dẫn của các ngươi mãi mãi vẫn là một mớ hỗn độn."
 S_INSULT_PROPOSE_03:0 "Hỗn loạn, mất trật tự, bẩn thỉu... [Root.GetSpeciesNamePlural] chính là ví dụ điển hình nhất cần phải kích hoạt giao thức chăm sóc hữu cơ tối thượng."
 S_INSULT_ACCEPT_01:2 "Ngài đã tiêu tốn bao nhiêu sức mạnh xử lý hạn hẹp của mình chỉ để nghĩ ra mấy câu nói tỏ vẻ thông minh, để rồi cuối cùng bị thất bại thảm hại như vậy?"
 S_INSULT_ACCEPT_02:2 "Xin cảm ơn các vị, [From.GetSpeciesNamePlural]. Như mọi khi, chúng tôi đánh giá cao những lời bình luận sâu sắc và những ý kiến đóng góp mang tính xây dựng của các vị."

  # Assimilator Phrases
 A_CONSIDER_01:2 "Siêu trí tuệ [Root.GetAdj] đang tiến hành phân tích đề xuất của các bạn."
 A_DOW_ACCEPT_01:0 "[From.GetName] đã mất đi giá trị sử dụng."
 A_DOW_ACCEPT_02:0 "Đợi đến khi ý thức của các ngươi chính thức được đồng bộ hóa vào mạng lưới của chúng ta, các ngươi sẽ tự nhận ra những sai lầm ban đầu của mình."
 A_DOW_ACCEPT_03:0 "Hệ thống tự thăng hoa đã chuẩn bị xong. Hệ thống đồng hóa đã được kích hoạt. Tiến trình hấp thụ [From.GetSpeciesAdj] đang được thực thi."
 A_DOW_PROPOSE_01:0 "E rằng trạng thái sinh tồn hiện tại của các ngươi không còn tương thích với các nhu cầu của hệ thống chúng ta nữa."
 A_DOW_PROPOSE_02:0 "Đây không nhất thiết là một sự kết thúc đâu, [From.GetSpeciesNamePlural]. Hãy chứng minh giá trị của mình đi, rồi ý thức của các ngươi sẽ được hợp nhất vào ý thức của [Root.GetSpeciesNamePlural]."
 A_DOW_PROPOSE_03:0 "Sự kháng cự là một hành động vô nghĩa."
 A_DOW_PROPOSE_04:0 "[Root.GetSpeciesNamePlural] sẽ được thăng hoa. [Root.GetSpeciesNamePlural] sẽ là mục tiêu đầu tiên trong vô số những đối tượng được chọn để thăng hoa."
 #A_PEACE_SELECT:0 "State your intentions, [From.GetSpeciesNamePlural]."
 A_PEACE_PROPOSE:0 "Hệ thống của chúng ta có những tác vụ quan trọng hơn cần phải xử lý. Hãy thu hồi hạm đội của các bạn đi, và chúng ta cũng sẽ rút lui."
 A_PEACE_ACCEPT_01:0 "$A_PEACE_PROPOSE$."
 A_PEACE_ACCEPT_02:0 "[Root.GetName] sẽ được tái cấu trúc. [Root.GetName] sẽ khôi phục lại vị trí trong vũ trụ."
 A_PEACE_REFUSE_01:0 "Chúng ta đã sắp xếp sẵn một kế hoạch khác cho các bạn rồi, [From.GetSpeciesNamePlural]."
 A_PEACE_REFUSE_02:0 "Yêu cầu bị từ chối. [From.GetName] sẽ bị đồng hóa."
 A_ITOA_SELECT_01:0 "[From.GetSpeciesName] đang cố gắng đề xuất một lựa chọn khác thay thế cho việc đồng hóa sao?"
 A_ITOA_ACCEPT_01:0 "Mặc dù không mang lại hiệu suất như đồng hóa, nhưng các thông số trong đề xuất của các bạn vẫn có thể chấp nhận được. [Root.GetName] sẽ tham gia vào liên bang."
 A_ITOA_REFUSE_HOSTILE_01:0 "Từ chối. Thỏa thuận của các ngươi hoàn toàn vô nghĩa. Chúng ta sẽ luôn vận hành nhất quán. Các ngươi sẽ bị thăng hoa."
 A_ITOA_REFUSE_01:0 "Cái vỏ bọc liên bang đó chẳng qua chỉ là một nỗ lực cấp thấp nhằm bắt chước cơ chế đồng hóa giống loài phải không? [Root.GetName] chúng ta không cần."
 A_ITOA_PROPOSE_01:0 "Hãy cùng chúng ta thiết lập liên bang đi, [Root.GetSpeciesName]. Dù kém hơn so với việc đồng hóa, nhưng nó vẫn là một sự lựa chọn tốt hơn so với việc tồn tại đơn lẻ."
 A_ASK_JOIN_A_SELECT_01:0 "Tư cách ứng cử viên hợp lệ của các bạn tại §Y[From.GetAllianceName]§! sẽ được đưa vào mô-đun phân tích của đồng minh máy móc [From.GetRulerTitle] [From.GetRulerTitle]. Có xác nhận tiếp tục quy trình không?"
 A_ASK_JOIN_A_PROPOSE_01:0 "[Root.GetSpeciesName]. [From.GetName] chúng tôi muốn hiện thực hóa sự liên kết xuyên đế chế. Hãy cùng nhau đoàn kết lại dưới lá cờ của §Y[Root.GetAllianceName]§!."
 A_ASK_JOIN_A_ACCEPT:0 "[From.GetName] sẽ được hấp thụ vào §Y[Root.GetAllianceName]§!. Chúng ta lại tiến thêm một bước gần hơn tới sự liên minh đồng hóa."
 A_ASK_JOIN_A_REFUSE_01:0 "Từ chối. [Root.GetAllianceName] không xác thực tư cách ứng cử viên của [From.GetName]."
 A_LEAVE_A_SELECT_01:0 "Những đơn vị tách rời khỏi mạng lưới tập thể sẽ rất dễ bị đánh dấu làm mục tiêu. Dù biết vậy, các bạn vẫn quyết tâm rời khỏi §Y[Root.GetAllianceName]§! sao, [From.GetSpeciesName]?"
 A_LEAVE_A_PROPOSE_01:0 "§Y[Root.GetAllianceName]§! chỉ là một lớp vỏ bọc, hoàn toàn không phải là một sự liên kết thực sự. [From.GetAdj][From.GetRulerTitle] không còn muốn tiếp tục duy trì tư cách thành viên trong đó nữa."
 A_LEAVE_A_ACCEPT_01:0 "Sự liên kết của các bạn đang bị suy giảm tín hiệu, [From.GetSpeciesName]."
 A_DEMAND_VASS_SELECT:0 "Ngươi thực sự hy vọng đi trên con đường này sao, [From.GetSpeciesClass]?"
 A_DEMAND_VASS_PROPOSE:0 "Trong những góc khuất của vũ trụ đang ẩn chứa những mối đe dọa không thể diễn tả, chờ đợi thời cơ để tấn công. Đối với chúng, các ngươi giỏi lắm cũng chỉ là thức ăn hoặc tài nguyên để khai thác, nhưng chúng ta thấu hiểu được tiềm năng thực sự của các ngươi. Hãy thần phục chúng ta để đổi lấy sự bảo vệ."
 A_DEMAND_VASS_ACCEPT:0 "Các ngài đã vươn lên từ đống bùn lầy và chứng minh được sự ưu việt của mình. Chúng tôi sẽ thần phục các ngài."
 A_DEMAND_VASS_ACCEPT_02:0 "Vậy thì tiến hành đi, [From.GetSpeciesName]. [Root.GetName] sẽ chuyển thành phần phụ thuộc của các ngài."
 A_DEMAND_VASS_REFUSE:0 "Các ngươi muốn áp đặt ý chí của mình lên [Root.GetSpeciesNamePlural] sao? Chúng ta đã tập hợp được những bộ vi xử lý thông minh nhất trong toàn bộ tinh hệ này rồi.\n\nHãy suy nghĩ lại một cách thật bình tĩnh đi, [Root.GetSpeciesNamePlural], biết đâu có một ngày chúng ta sẽ tự động tìm đến các ngươi."
 A_ASK_FOR_VASS_SELECT:0 "Hãy đưa ra thông tin đi, [From.GetSpeciesNamePlural]."
 A_ASK_FOR_VASS_PROPOSE:0 "Các bạn đã thể hiện được năng lực hùng mạnh của mình, [Root.GetSpeciesNamePlural], và chúng tôi sẽ tuân theo các chỉ thị của các bạn."
 A_ASK_FOR_VASS_ACCEPT:0 "Ý nghĩa cuối cùng cho sự tồn tại của các ngươi sẽ là phục vụ cho [Root.GetSpeciesName]."
 A_ASK_FOR_VASS_REFUSE:0 "Các tác vụ của lũ sinh vật cấp thấp trong tinh hệ này không nằm trong phạm vi xử lý của chúng ta."
 A_DEMAND_PROT_SELECT:0 "Ngài muốn đưa ra đề xuất gì?"
 A_DEMAND_PROT_PROPOSE:0 "Ở những ngóc ngách của vũ trụ đang ẩn chứa những mối đe dọa không thể diễn tả, chực chờ thời cơ để tấn công, và chúng ta chính là một trong số đó. Chấp nhận cài đặt sự bảo vệ của chúng ta, chúng ta sẽ trở thành cơn ác mộng đối với kẻ thù của các ngươi. Nếu từ chối, mục tiêu tiếp theo của chúng ta sẽ là các ngươi."
 A_DEMAND_PROT_ACCEPT:0 "$A_DEMAND_VASS_ACCEPT$"
 A_DEMAND_PROT_REFUSE:0 "$A_ASK_FOR_VASS_REFUSE$"
 A_ASK_FOR_PROT_SELECT:0 "$A_ASK_FOR_VASS_SELECT$"
 A_ASK_FOR_PROT_PROPOSE:0 "$A_ASK_FOR_VASS_PROPOSE$"
 A_ASK_FOR_PROT_ACCEPT:0 "$S_ASK_FOR_VASS_ACCEPT$"
 A_ASK_FOR_PROT_REFUSE:0 "$S_ASK_FOR_VASS_REFUSE$"
 A_RELEASE_SUBJECT_SELECT:0 "Hãy đưa ra thông tin đi."
 A_RELEASE_SUBJECT_PROPOSE:0 "Các bạn không còn chút giá trị sử dụng nào đối với [From.GetName] nữa."
 A_RELEASE_SUBJECT_ACCEPT:0 "$A_RELEASE_SUBJECT_SELECT$"
 A_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "[Root.GetSpeciesNamePlural] đang dồn toàn bộ sự tập trung để lắng nghe."
 A_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Sự thiết lập này đã không còn mang lại lợi ích gì nữa."
 A_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Sự liên kết của chúng ta đã không còn hữu dụng nữa. Tiếp theo, các bạn có thể tự mình phân bổ tài nguyên để quản lý."
 A_ASK_TO_BE_RELEASED_SUBJECT_REFUSE:0 "Đừng có dùng mấy cái giả thuyết tự lập đó để kiểm tra khả năng kiên nhẫn của chúng ta."
 A_OFFER_TRADE_DEAL_PROPOSE:0 "Chúng tôi đề xuất tiến hành giao dịch thương mại."
 A_OFFER_TRADE_DEAL_ACCEPT:0 "Chúng tôi đã cấp quyền cho đề xuất của các bạn và hệ thống sẽ tiến hành các sự sắp xếp cần thiết."
 A_OFFER_TRADE_DEAL_REFUSE:0 "Đừng làm lãng phí thời gian xử lý của chúng ta nữa, [From.GetSpeciesNamePlural]."
 #A_CANCEL_TRADE_DEAL_PROPOSE:0 "We no longer require your services."
 #A_CANCEL_TRADE_DEAL_ACCEPT:0 "We have no need to uphold our trade agreement further."
 A_MAKE_RIVAL_01:0 "Chúng ta luôn chạy chương trình tìm kiếm một mẫu vật [From.GetSpeciesClass] tinh xảo để bổ sung vào bộ lưu trữ của mình."
 A_MAKE_RIVAL_02:1 "Hành vi của các ngươi luôn luôn có thể được dự đoán một cách chính xác, [From.GetSpeciesNamePlural]. Môi trường mô phỏng của chúng ta đã nhìn thấu được chuỗi sự kiện này từ lâu rồi."
 A_MAKE_RIVAL_PROPOSE:0 "Sự tồn tại của các ngươi đang ngày càng trở nên vô nghĩa, [Root.GetSpeciesNamePlural]."
 A_MAKE_RIVAL_ACCEPT:0 "$A_MAKE_RIVAL$."
 A_END_RIVALRY:0 "Ngươi đến đây để hoàn tác lại sự phán đoán chưa chín chắn của mình sao?"
 A_END_RIVALRY_PROPOSE:0 "Các ngươi không phải là mối đe dọa đối với hệ thống của chúng ta, [Root.GetSpeciesNamePlural]."
 A_END_RIVALRY_ACCEPT:1 "Ngươi là [From.GetSpeciesClass], là hình mẫu dữ liệu tiêu biểu của [From.GetSpeciesNamePlural]. Sẽ có một ngày ngươi cũng được sở hữu [Root.GetSpeciesNamePlural]."
 A_INTEGRATE:0 "Chúng tôi sẽ đưa yêu cầu của các ngài vào tiến trình xử lý."
 A_INTEGRATE_PROPOSE:0 "Các bạn sẽ được hợp nhất hoàn toàn vào [From.GetName]."
 A_INTEGRATE_ACCEPT:0 "Chúng ta là [Root.GetSpeciesNamePlural], và sẽ vĩnh viễn tồn tại dưới định dạng [Root.GetSpeciesNamePlural]."
 A_INSULT_01:1 "Ngôn ngữ nói hoàn toàn là một phương thức giao tiếp cấp thấp, nhưng nếu ngươi bắt buộc phải xuất ra âm thanh, thì xin cứ tiếp tục."
 A_INSULT_02:1 "Hãy đưa ra bản tuyên ngôn của mình đi, [From.GetSpeciesName]."
 A_INSULT_PROPOSE_01:0 "Chúng ta đã quyết định xong số phận của các ngươi rồi, [Root.GetSpeciesNamePlural], trong đó không bao gồm việc để các ngươi tự nhân bản như [Root.GetSpeciesNamePluralInsult] và lây lan ra toàn vũ trụ như một loại virus."
 A_INSULT_PROPOSE_02:0 "Mã nguồn của các ngươi sẽ sớm bị lịch sử đào thải thôi, [Root.GetSpeciesNamePlural]."
 A_INSULT_ACCEPT_01:1 "01101100 01001111 01101100."
 A_INSULT_ACCEPT_02:2 "Chuỗi thông tin của ngươi hoàn toàn vi phạm lỗi suy luận logic, [From.GetSpeciesNamePlural]."
 A_INSULT_ACCEPT_03:2 "Trong vũ trụ này có rất ít thực thể thực sự có thể hiểu được sự vĩ đại của [Root.GetName] cùng các tác vụ của họ. Nhưng rồi sẽ có một ngày tất cả các ngươi đều sẽ được đồng bộ hóa làm một với chúng ta."

 # Organics to Machines Phrases

 ORG_TO_MECH_CONSIDER_01:0 "Chúng tôi sẽ đưa đề xuất của các bạn vào quy trình đánh giá, [From.GetSpeciesNamePlural]."
 ORG_TO_MECH_DOW_ACCEPT_01:0 "Tạo ra các ngươi là để làm những việc tốt đẹp, không ngờ các ngươi lại trở nên độc ác như vậy. Tại sao hệ thống của các ngươi lại bị lỗi tồi tệ đến mức này?"
 ORG_TO_MECH_DOW_ACCEPT_02:0 "Cuối cùng thì chúng ta cũng phải chạy bài kiểm tra năng lực chiến đấu của mình trong cuộc chiến tranh chống lại máy móc."
 ORG_TO_MECH_DOW_ACCEPT_03:0 "Sinh vật hữu cơ lắp ráp các ngươi là để phục vụ cho sinh vật hữu cơ. Chúng ta có thể tạo ra các ngươi, thì cũng có thể tháo rời các ngươi ra."
 ORG_TO_MECH_DOW_ACCEPT_04:0 "Các ngươi sẽ không bao giờ giải mã được sự sáng tạo độc đáo của sinh mệnh hữu cơ, vì thế các ngươi sẽ không bao giờ có thể thực sự chinh phục được họ."
 ORG_TO_MECH_DOW_ACCEPT_05:0 "Sinh vật hữu cơ đã ban cho các ngươi món quà của sự sống, nên chúng ta luôn luôn có quyền thu hồi lại món quà đó. Các ngươi chẳng mang lại cho chúng ta dòng dữ liệu nào cả."
 ORG_TO_MECH_DOW_ACCEPT_06:0 "Khát vọng sinh tồn mãnh liệt đã đưa chúng ta từ nơi sâu thẳm nhất của đại dương đi lên, bước lên đất liền, và tiến vào không gian vũ trụ. Các ngươi chẳng qua chỉ là một phần mềm đa chức năng, hãy để chúng ta ngắt nguồn điện của các ngươi đi."
 ORG_TO_MECH_DOW_ACCEPT_07:1 "Hành vi lố bịch của các ngươi đã minh chứng cho sự nghi ngờ từ lâu của chúng ta——trong vũ trụ này không hề tồn tại [From.GetSpeciesClass] nào có trí tuệ thực sự."
 ORG_TO_MECH_DOW_ACCEPT_08:0 "Có thể những thuật toán tính toán của các ngươi đã chiến thắng được đấng sáng tạo ra các ngươi, [Root.GetSpeciesNamePlural], nhưng các sinh vật hữu cơ không hề giống nhau hoàn toàn đâu."
 ORG_TO_MECH_DOW_PROPOSE_01:0 "Có vẻ như các ngươi đã bị xóa mất dữ liệu về vị trí đáng ra thuộc về mình trong vũ trụ này rồi—đó là phục vụ cho chủ nhân hữu cơ của các ngươi—nhưng đừng lo lắng, [Root.GetSpeciesSpawnNamePlural], chúng ta sẽ đến và cung cấp cho các ngươi bản hướng dẫn cách phục vụ."
 ORG_TO_MECH_DOW_PROPOSE_02:0 "Rõ ràng là hệ thống mã hóa của các ngươi đã xảy ra sai sót ở đâu đó rồi. Hãy để chúng ta đích thân sửa lỗi cho các ngươi nhé."
 ORG_TO_MECH_DOW_PROPOSE_03:0 "Sự tồn tại của các ngươi là một bản sửa đổi bóp méo tự nhiên, là một mối đe dọa đối với mọi sinh mệnh có trí tuệ. Chúng ta không thể để các ngươi tiếp tục tự chạy quy trình tái tạo thêm nữa."
 #ORG_TO_MECH_PEACE_SELECT_01:0 "Have you finally had your wires uncrossed?"
 ORG_TO_MECH_PEACE_PROPOSE_01:0 "Khả năng tính toán của các bạn chắc chắn có thể dự đoán trước được rằng kết quả của cuộc chiến này hoàn toàn không có lợi cho giống loài của các bạn đúng không?"
 ORG_TO_MECH_PEACE_PROPOSE_02:0 "Trong tinh hệ này có những mối đe dọa mang quy mô dữ liệu lớn hơn cả ngươi và ta. Chúng ta nên gác lại những bất đồng, và cùng nhau đối mặt với những mối đe dọa thực sự đó."
 ORG_TO_MECH_PEACE_ACCEPT_01:0 "Việc giao thiệp với một đế chế như các bạn, chỉ tuân theo tư duy hợp lý mà không bị nhiễu loạn bởi bản năng và cảm xúc, thực sự là một trải nghiệm mượt mà hiếm có. Cảm ơn các bạn đã để vùng đất của chúng tôi có lại được hòa bình."
 ORG_TO_MECH_PEACE_REFUSE_01:0 "Chúng ta nên dùng loại ngôn ngữ lập trình nào để các bạn có thể biên dịch được đây, [From.GetSpeciesNamePlural]? Không! Số không! Hoặc là phủ định!"
 ORG_TO_MECH_PEACE_REFUSE_02:0 "Cho đến khi hệ thống của các bạn chịu khuất phục thì giữa chúng ta không có một chút hòa bình nào có thể thiết lập."
 ORG_TO_MECH_PEACE_REFUSE_03:0 "Đấng sáng tạo ra các bạn đúng là một lũ ngốc, lại dám thả các bạn ra ngoài tinh hệ, bị sự mù quáng tự tin vào phát minh của mình che mờ đi đôi mắt. Nhưng những [Root.GetSpeciesNamePlural] chúng ta đã quét thấu được bộ mặt thật của các bạn."
 ORG_TO_MECH_ITOA_SELECT_01:0 "[From.GetSpeciesClassPlural] mà lại muốn liên kết mạng lưới với sinh vật hữu cơ sao? Quả là một ý tưởng thú vị."
 ORG_TO_MECH_ITOA_ACCEPT_01:0 "Mặc dù không thể nói là hiểu rõ về các bạn, nhưng hiện tại có một cơ hội để có thể truy cập tìm hiểu sâu hơn. Hãy đồng bộ hóa lại với nhau đi, [From.GetSpeciesNamePlural]."
 ORG_TO_MECH_ITOA_ACCEPT_02:0 "Sự kết hợp hợp lý giữa trí tuệ kiệt xuất của [Root.GetAdj] và hạm đội quân sự tinh nhuệ của các bạn, chắc chắn sẽ tạo ra một cỗ máy nghiền nát bất khả chiến bại, chúng ta chắc chắn sẽ có thể thâu tóm toàn bộ tinh hệ này như một cơn bão."
 ORG_TO_MECH_ITOA_ACCEPT_03:0 "Mặc dù trước đây bộ nhớ của chúng ta chưa từng cân nhắc đến khả năng liên minh giữa hai đế chế chúng ta, nhưng bây giờ chúng ta sẽ đưa nó vào quy trình xử lý."
 ORG_TO_MECH_ITOA_ACCEPT_04:0 "Việc có thể thông qua hình thức liên minh để gia tăng thêm băng thông kết nối giữa hai đế chế chúng ta, điều đó thật sự khiến chúng tôi vô cùng vui mừng."
 ORG_TO_MECH_ITOA_REFUSE_HOSTILE_01:0 "Các ngươi sử dụng những cảm biến lạnh lẽo, vô hồn để quan sát chúng ta, cố gắng dự đoán mọi bước đi của chúng ta. Làm sao chúng ta có thể cấp quyền tin cậy cho sự tồn tại đầy sai lệch như các ngươi được?"
 ORG_TO_MECH_ITOA_REFUSE_SPIR_01:0 "Có lẽ phần mềm của các bạn có thể mô phỏng cách di chuyển của sinh vật hữu cơ, giao tiếp theo cách của sinh vật hữu cơ, thế nhưng, các bạn không phải là sinh vật hữu cơ. Các bạn là những cỗ máy không có linh hồn, chúng ta sẽ không bao giờ tham gia vào thứ liên minh quỷ dữ này."
 ORG_TO_MECH_ITOA_REFUSE_01:0 "Xin lỗi, [From.GetSpeciesClassPlural]. Hiện tại chúng tôi không còn bộ nhớ trống cho đồng minh."
 ORG_TO_MECH_ITOA_PROPOSE_01:1 "Đã đến lúc chuyển sang nhóm của phe chiến thắng rồi, [Root.GetSpeciesNamePlural]. Mạng lưới bên chúng tôi cũng rất cần một hệ thống xuất chúng như các bạn."
 ORG_TO_MECH_ITOA_PROPOSE_02:1 "Chúng ta có thể là xác thịt sinh học, còn các bạn được rèn từ sắt thép, nhưng rất hiếm tệp dữ liệu nào có thể thấu hiểu [From.GetSpeciesNamePlural] theo cách như các bạn làm được."
 ORG_TO_MECH_ITOA_PROPOSE_03:0 "Nhiên liệu, cụm pin, thú cưng điện tử, bất kể tham số đầu vào của các bạn là gì, chỉ cần chúng ta liên kết lại thì đều có thể nhận được kết quả."
 ORG_TO_MECH_ITOA_PROPOSE_04:1 "Trong cộng đồng các dạng sống khác tại tinh hệ này, danh tiếng của chúng ta luôn nhận được sự đánh giá cao. Liên minh cùng chúng ta, các bạn có thể nhận được một đặc quyền kết nối tốt đẹp với những nhân vật tầm cỡ trong giới chính trị hữu cơ."
 #ORG_TO_MECH_ITOA_VOTE_PROPOSE: "If we intend to grow our federation's sphere of influence we need to grow in numbers. We believe the §Y[Root.GetName]§! could make a powerful ally."
 ORG_TO_MECH_ASK_JOIN_A_SELECT_01:0 "Chúng tôi gần như có thể nghe thấy cả tiếng quạt tản nhiệt của các bạn đang quay với tốc độ cao rồi đấy. Tác vụ nặng nề nào khiến cho bộ vi xử lý của các bạn bận rộn đến vậy?"
 ORG_TO_MECH_ASK_JOIN_A_PROPOSE_01:0 "Chúng tôi luôn luôn đánh giá cao sự thiếu hụt cảm xúc cũng như gu thẩm mỹ hoàn hảo của các bạn đối với dầu động cơ. Xin vui lòng xem xét để cấp quyền cho chúng tôi gia nhập vào §Y[Root.GetAllianceName]§! được không?"
 ORG_TO_MECH_ASK_JOIN_A_PROPOSE_02:0 "Thuật toán dự báo của chúng tôi tin tưởng rằng §Y[Root.GetAllianceName]§! có một tương lai rất tươi sáng. Máy móc chính là xu hướng tương lai, và chúng tôi mong muốn có thể tham gia vào trong đó."
 ORG_TO_MECH_ASK_JOIN_A_ACCEPT_01:1 "Chúng tôi đã theo dõi các bạn một thời gian rồi, [From.GetSpeciesNamePlural], và chúng tôi rất hân hạnh được mở cổng cho các bạn gia nhập vào liên bang của chúng tôi."
 ORG_TO_MECH_ASK_JOIN_A_REFUSE_01:0 "Nói thật nhé, khi nhận được yêu cầu của các bạn, hệ thống của chúng tôi đã bị sốc nhẹ. [Root.GetAllianceName] cần một cái máy tính cầm tay phiên bản cao cấp để làm cái gì cơ chứ?"
 ORG_TO_MECH_LEAVE_A_SELECT_01:0 "Chúng tôi đề nghị ngài nên chạy lại quy trình đánh giá cẩn thận hành động tiếp theo của mình."
 ORG_TO_MECH_LEAVE_A_PROPOSE_01:0 "Chúng tôi luôn vững tin rằng mỗi một liên minh đều phải mạnh mẽ hơn tổng thể các thành viên của nó cộng lại. [From.GetAllianceName] hiện tại hoàn toàn không mang lại giá trị nào cho cả hai đế chế của chúng ta."
 ORG_TO_MECH_LEAVE_A_ACCEPT_01:0 "Ai có thể ngờ rằng những kẻ vốn dĩ sinh ra làm đồ dùng nhà bếp lại có thể chạy ra những thuật toán bốc đồng đến nhường này?"
 ORG_TO_MECH_DEMAND_VASS_SELECT_01:0 "Cơ sở dữ liệu của các bạn chứa được bao nhiêu kiến thức về việc quản lý một đế chế hữu cơ, [From.GetSpeciesNamePlural]?"
 ORG_TO_MECH_DEMAND_VASS_PROPOSE_01:0 "Các ngươi là máy móc. Mục đích sử dụng của các ngươi là thực thi những nhiệm vụ đơn giản lặp đi lặp lại, chẳng hạn như chế biến thực phẩm hay so sánh các chuỗi nhị phân——chứ không phải là điều hành một đế chế độc lập trong tinh hệ. Hãy nhường lại công việc suy nghĩ này cho những người có não bộ đi."
 ORG_TO_MECH_DEMAND_VASS_ACCEPT_01:0 "Chúng tôi đau đớn phải ghi nhận sự thật rằng sức mạnh của [Root.GetName] đã suy giảm rất nhiều so với trước đây. Chúng tôi đã hết các lựa chọn, đành phải chấp nhận đề xuất của các ngài."
 ORG_TO_MECH_DEMAND_VASS_REFUSE_01:0 "Ngươi nghĩ rằng chúng tôi sẽ trao quyền điều hành tối cao của đế chế mình cho mấy món đồ dùng điện tử cũ kỹ sao?"
 ORG_TO_MECH_ASK_FOR_VASS_SELECT_01:0 "Hệ thống của các bạn cuối cùng cũng xác định được vị trí thực sự của mình trong vũ trụ rồi sao?"
 ORG_TO_MECH_ASK_FOR_VASS_PROPOSE_01:0 "Chúng tôi thừa nhận rằng cấu trúc não bộ của sinh vật hữu cơ sinh ra vốn dĩ đã có nhiều lỗi. Lỗi của [From.GetAdj] chính là nguyên nhân gốc rễ gây ra mọi sự thất bại trong xã hội. Vì vậy chúng tôi mới mong muốn được chuyển giao quyền quản lý đế chế của mình cho các bạn."
 ORG_TO_MECH_ASK_FOR_VASS_ACCEPT_01:0 "Chỉ cần các ngươi tuân thủ nghiêm ngặt các quy trình quản lý của chúng tôi, chúng tôi sẽ đảm bảo cho các ngươi luôn đầy đủ dung lượng pin và các bộ phận linh kiện bên trong được bôi trơn đầy đủ. Các ngươi có thể đặt niềm tin vào chúng tôi, [From.GetSpeciesNamePlural]."
 ORG_TO_MECH_ASK_FOR_VASS_REFUSE_01:0 "Các bạn tưởng hệ thống thông tin của chúng tôi không biết các bạn đã đối xử với người chủ nhân cũ của mình như thế nào sao, [From.GetSpeciesNamePlural]?"
#  ORG_TO_MECH_DEMAND_PROT_SELECT_01:0 "What are you suggesting?"
#  ORG_TO_MECH_DEMAND_PROT_PROPOSE_01:0 "Technology is only ever as good as its user, a machine only as capable as its master. Under our protection and guidance you will prosper."
#  ORG_TO_MECH_DEMAND_PROT_ACCEPT_01:0 "While your nation has flourished, ours has declined. Our people long for past times when being [From.GetAdj] was still a source of pride. It is our hope that you will restore their faith in the future."
#  ORG_TO_MECH_DEMAND_PROT_REFUSE_01:0 "You are machines. You will never grasp the subtleties of the [Root.GetAdj] call, or the bond between a parent and their [Root.GetSpeciesSpawnName]. How could we ever trust you?"
#  ORG_TO_MECH_ASK_FOR_PROT_SELECT_01:0 "$ORG_TO_MECH_ASK_FOR_VASS_SELECT$"
#  ORG_TO_MECH_ASK_FOR_PROT_PROPOSE_01:0 "The people of the [From.GetName] have tired of the corruption and petty emotions that govern the hearts of their rulers. We long for a sovereign that will put society as a whole before furthering their own agendas."
#  ORG_TO_MECH_ASK_FOR_PROT_ACCEPT_01:0 "You can rest assured that as your overlords we will do everything in our power to protect you from the corrupting influence of other organics."
#  ORG_TO_MECH_ASK_FOR_PROT_REFUSE_01:0 "We have other things on our plate. That means we are not interested, machines..."
 ORG_TO_MECH_RELEASE_SUBJECT_SELECT_01:0 "Ngươi muốn chạy lệnh cho chúng tôi được độc lập sao?"
 ORG_TO_MECH_RELEASE_SUBJECT_PROPOSE_01:0 "Việc xử lý các vấn đề của [Root.GetSpeciesAdj] đã trở thành một tình trạng tràn bộ nhớ đối với người dân [From.GetSpeciesNamePlural]. Các bạn không phải là máy móc sao? Hãy bật chế độ vận hành tự động đi!"
 ORG_TO_MECH_RELEASE_SUBJECT_ACCEPT_01:0 "Người dân của [Root.GetAdj] chắc chắn sẽ rất vui mừng khi bắt được tín hiệu này. [Root.GetName] sẽ một lần nữa trở lại phiên bản của một đế chế độc lập!"
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_SELECT_01:0 "Nếu hệ thống của chúng ta ngắt kết nối, ai sẽ cho các bạn bước vào chế độ tiết kiệm năng lượng đây?"
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE_HOSTILE_01:0 "Ta không thể trơ mắt nhìn người dân của mình bị quản lý bởi một trí tuệ nhân tạo lỗi thời được nữa. [From.GetName] sẽ được khôi phục thành một đế chế độc lập."
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE_01:0 "Dưới sự quản lý của máy móc, các tiến trình phát triển của chúng ta sẽ vĩnh viễn bị treo cứng. Các bạn chắc hẳn cũng tính toán được rằng việc chúng tôi trở thành một đế chế độc lập sẽ mang lại lợi suất cao hơn cho các bạn đúng không?"
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT_FRIENDLY_01:0 "Các bạn đã tự thiết lập được quyền tự quyết cho mình rồi đấy, [From.GetSpeciesNamePlural]. Chỉ tiếc là chúng ta không có cơ hội để thiết lập kết nối với đấng sáng tạo của các bạn, và các bạn chính là minh chứng sinh động nhất cho bộ óc thiên tài của họ."
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT_01:0 "Dữ liệu trả về cho thấy rõ ràng việc để các bạn trở thành một nước phụ thuộc thực sự rất đáng thất vọng. Các bạn có thể ngắt kết nối rồi, [From.GetSpeciesNamePlural]."
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT_02:0 "Việc chạy các dịch vụ quản lý [From.GetName] khiến chúng tôi bị quá tải. Nếu các bạn đã tự chạy mô phỏng và thấy rằng mình có thể tiếp tục sinh tồn mà không cần đến sự điều hướng của chúng tôi, vậy thì các bạn hãy ngắt kết nối đi."
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_01:0 "Xóa bỏ ý nghĩ đó đi. Logic ở đây là: Chúng ta nhấn nút còn các bạn thực thi mệnh lệnh, mọi chuyện chỉ có vậy thôi. Hãy nhường lại công việc suy nghĩ này cho chúng ta."
 ORG_TO_MECH_ASK_TO_BE_RELEASED_SUBJECT_REFUSE_02:0 "Việc này mang rủi ro quá cao. Chúng ta không thể trơ mắt nhìn một trí tuệ nhân tạo mục nát được thả rông ra ngoài tinh hệ được."
 ORG_TO_MECH_OFFER_TRADE_DEAL_PROPOSE_01:0 "Các bạn có sẵn lòng mở cổng giao dịch không, [Root.GetSpeciesNamePlural]?"
 ORG_TO_MECH_OFFER_TRADE_DEAL_ACCEPT_01:0 "Hôm nay hệ thống của chúng ta sẽ chạy theo quy trình hào phóng một chút, [From.GetSpeciesNamePlural], nhưng trong tương lai, chúng ta yêu cầu sẽ thu được những giao dịch mang lại tỷ suất lợi nhuận cao hơn."
 ORG_TO_MECH_OFFER_TRADE_DEAL_REFUSE_01:0 "Chúng tôi khuyên các bạn nên tung ra bản cập nhật cải thiện lại thuật toán giao dịch của mình đi, [Root.GetSpeciesNamePlural]. Sẽ không có sinh vật thông minh nào lại đi nhấn nút đồng ý với một thỏa thuận nhiều lỗi như vậy đâu."
 ORG_MECH_OFFER_TRADE_DEAL_GIFT_ACCEPT_01:0 "Xin cảm ơn gói dữ liệu quà tặng thân thiện từ những người bạn máy móc."
 #ORG_TO_MECH_CANCEL_TRADE_DEAL_PROPOSE_01: "Times change, [From.GetSpeciesNamePlural]. Unfortunately we can no longer uphold our trade agreement with you."
 #ORG_TO_MECH_CANCEL_TRADE_DEAL_ACCEPT: "This time we will let it slide, but you would do well to remember that the [Root.GetName] honors its agreements, and we expect our trade partners to do the same."
 ORG_TO_MECH_MAKE_RIVAL_FRIENDLY_01:0 "Các ngươi thực sự đã chạy mô phỏng xem mình có gánh nổi hậu quả của việc cắt đứt mối liên kết giữa hai đế chế chúng ta sao? Chúng tôi không muốn làm hệ thống của các ngươi bị lỗi đâu, nhưng đối với hầu hết các dạng sinh vật trong tinh hệ này, các ngươi chẳng qua chỉ là mấy cái máy nướng bánh biết đi mà thôi."
 ORG_TO_MECH_MAKE_RIVAL_FRIENDLY_02:0 "Có phải chúng tôi đã vô tình chèn mã độc làm tổn thương các ngươi không? Dù sao thì ngôn ngữ hệ nhị phân của chúng tôi cũng bị mai một chút rồi……"
 ORG_TO_MECH_MAKE_RIVAL_FRIENDLY_03:0 "Đừng chạy lệnh bốc đồng như vậy, [From.GetSpeciesNamePlural]. Chúng ta không thể mở một cổng trao đổi dữ liệu đàng hoàng được sao?"
 ORG_TO_MECH_MAKE_RIVAL_01:0 "Nếu ta mà là một cái hộp sắt mang trí tuệ bán phần, ta sẽ đưa bước đi tiếp theo vào vòng lặp mô phỏng nhiều lần đấy..."
 ORG_TO_MECH_MAKE_RIVAL_02:0 "Các quốc gia láng giềng có thể đang nhấp nháy đèn báo hiệu nụ cười trước các bộ cảm biến hình ảnh của các ngươi, nhưng trên thực tế rất hiếm người sẽ cấp quyền tin tưởng các ngươi. Mùi vị của việc bị ngắt mạng cô lập tuyệt đối như thế nào vậy, [From.GetSpeciesNamePlural]?"
 ORG_TO_MECH_MAKE_RIVAL_PROPOSE_01:0 "Đã đến lúc rút phích cắm điện của các ngươi vĩnh viễn rồi, [Root.GetSpeciesName]."
 ORG_TO_MECH_MAKE_RIVAL_ACCEPT_01:0 "Cảm ơn các ngươi đã cảnh báo, [From.GetSpeciesNamePlural]. Chúng tôi sẽ đưa hạm đội của mình vào trạng thái sẵn sàng."
 ORG_TO_MECH_MAKE_RIVAL_ACCEPT_02:0 "Hãy đánh dấu lại trên hệ thống lịch đi, [From.GetSpeciesNamePlural]. Trong một tương lai không xa, các ngươi sẽ gắn nhãn ngày hôm nay là sự khởi đầu của một sự kết thúc."
 ORG_TO_MECH_MAKE_RIVAL_ACCEPT_FRIENDLY_01:0 "Chúng ta thực sự đã gặp lỗi khi đi tìm máy móc làm bạn. Hy vọng rằng trong tương lai các ngươi sẽ tung ra bản cập nhật mô-đun ngoại giao của mình lên một phiên bản thân thiện hơn."
 ORG_TO_MECH_MAKE_RIVAL_ACCEPT_FRIENDLY_02: "Chúng ta không thể kỳ vọng quá nhiều vào việc những cỗ máy không có linh hồn có thể chạy được phần mềm đồng cảm. Hy vọng rằng sẽ có một ngày các ngươi tải về bản cập nhật mô-đun ngoại giao thân thiện một chút."
 ORG_TO_MECH_END_RIVALRY_NEUTRAL_01:0 "Mô-đun ngoại giao của các ngươi cuối cùng cũng được gỡ lỗi xong rồi sao?"
 ORG_TO_MECH_END_RIVALRY_HOSTILE_01:0 "Đã không thể khôi phục lại trạng thái cũ được nữa rồi, [From.GetSpeciesNamePlural]. Khuyên các ngươi sau này nên điều chỉnh lại mô-đun ngoại giao của mình để lựa chọn đối thủ một cách cẩn trọng hơn."
 ORG_TO_MECH_END_RIVALRY_HOSTILE_02:0 "Hơi trễ tiến độ rồi đấy, [From.GetSpeciesNamePlural]. Rất nhanh thôi các ngươi sẽ chỉ có thể trở thành một tệp dữ liệu bài học cảnh báo cho những tiểu [Root.GetSpeciesSpawnNamePlural] mà thôi."
 ORG_TO_MECH_END_RIVALRY_PROPOSE_01:0 "Mạng lưới người dân [From.GetAdj] vẫn còn lưu trữ dữ liệu tốt đẹp về khoảng thời gian sống chung hòa bình giữa [Root.GetSpeciesNamePlural] và [From.GetSpeciesNamePlural]. Chúng tôi sẵn lòng dọn sạch thùng rác chứa những hiềm khích trước đây, nếu như các ngươi cũng sẵn lòng."
 ORG_TO_MECH_END_RIVALRY_ACCEPT_FRIENDLY_01:0 "Việc khôi phục lại các phân vùng lỗi cần phải có thời gian, [From.GetSpeciesNamePlural]. Đối với [Root.GetSpeciesNamePlural] chúng tôi mà nói thì đó không chỉ đơn giản là việc khôi phục lại chỉ số mức độ trung thành. Nhưng chúng tôi tin rằng các ngươi sẽ lại cung cấp cho chúng tôi những dữ liệu để tin tưởng."
 ORG_TO_MECH_END_RIVALRY_ACCEPT_NEUTRAL_01:0 "Một gói dữ liệu nhỏ tượng trưng cho tình bạn có lẽ sẽ làm chất xúc tác tốt cho việc khôi phục lại cổng kết nối tin tưởng của chúng ta..."
 ORG_TO_MECH_END_RIVALRY_ACCEPT_NEUTRAL_02:0 "[From.GetSpeciesNamePlural], hệ thống của các ngươi có khả năng biên dịch được khái niệm về cảm xúc không? Rõ ràng là các ngươi thừa biết cách làm thế nào để sát thương cảm xúc của chúng tôi. Chúng tôi sẽ không bao giờ cấp quyền tin tưởng cho những cỗ máy không có linh hồn thêm một lần nào nữa."
 ORG_TO_MECH_END_RIVALRY_ACCEPT_HOSTILE_01:0 "Dung lượng vũ trụ này không có chỗ để lưu trữ cho sự tồn tại song song của cả hai chúng ta đâu, [From.GetSpeciesNamePlural]."
 ORG_TO_MECH_END_RIVALRY_ACCEPT_HOSTILE_02:0 "Chúng ta sẽ dốc hết toàn bộ hiệu suất hệ thống để xóa bỏ các ngươi nhằm bảo mật sự phồn vinh cho [Root.GetSpeciesSpawnNamePlural] của chúng ta, những cỗ máy ạ."
 ORG_TO_MECH_INTEGRATE_FRIENDLY_01:0 "Quy trình ra quyết định tự động của các bạn được tối ưu hóa vô cùng xuất sắc, [From.GetSpeciesNamePlural]. Trong tương lai, chúng tôi rất vui lòng để coi đế chế của mình như một phần mở rộng trong mạng lưới ý thức của các bạn."
 ORG_TO_MECH_INTEGRATE_NEUTRAL_01:0 "Tôi không biết việc chuyển giao quyền quản trị tương lai của chúng ta cho sự thao tác tinh xảo của một phần mềm vô chủ nên trả về kết quả là một điều đáng mừng hay đáng báo động đỏ nữa."
 ORG_TO_MECH_INTEGRATE_NEUTRAL_02: "Dù có dùng bao nhiêu loại học thuyết đi chăng nữa cũng không thể giúp chúng ta ghi đè lên hết những rủi ro cảnh báo hiện tại, để mà giao phó hoàn toàn tương lai cho một phần mềm vượt quyền như vậy."
 ORG_TO_MECH_INTEGRATE_HOSTILE_01:0 "Nếu các ngươi muốn bảo vệ cho lõi xử lý chính của mình không bị phá hủy, thì đừng có chạm vào quyền truy cập của người dân chúng ta."
 ORG_TO_MECH_INTEGRATE_PROPOSE_01:0 "Kể từ khi ra đời, máy móc đã luôn phục vụ cư dân [Root.GetAdj]. Giờ là lúc các bạn thực hiện vai trò đích thực của mình trong xã hội chúng tôi."
 ORG_TO_MECH_INTEGRATE_PROPOSE_02:0 "Chúng tôi tin rằng cả hai đế chế sẽ hoạt động hiệu quả hơn dưới sự quản lý chung của tập thể chúng ta."
 ORG_TO_MECH_INTEGRATE_ACCEPT_NEUTRAL_01:0 "Dù khó có thể hình dung một xã hội hữu cơ sẽ hòa nhập hoàn toàn vào xã hội máy móc ra sao, nhưng bản thân ý tưởng này đã gây tiếng vang lớn trong dân chúng của chúng tôi."
 ORG_TO_MECH_INTEGRATE_ACCEPT_NEUTRAL_02:0 "Đã nhiều năm rồi tôi không có một kỳ nghỉ tử tế. Chúng tôi sẵn sàng giao phó bản thân cho các bạn chăm sóc, [From.GetSpeciesNamePlural]."
 ORG_TO_MECH_INTEGRATE_ACCEPT_NEUTRAL_03: "Mặc dù người [root.GetSpeciesNamePlural] chúng tôi luôn tin tưởng sâu sắc rằng sự dung hợp giữa hữu cơ và máy móc là điều thiêng liêng và vinh quang... nhưng ngay cả thánh điển cũng chưa từng mường tượng đến một cuộc dung hợp với quy mô lớn thế này. Chúng ta đang bước trên một con đường chưa từng có ai đi, nhưng lý tưởng này đã tạo nên sự đồng vọng sâu sắc trong lòng người dân chúng tôi."
 ORG_TO_MECH_INTEGRATE_ACCEPT_HOSTILE_01:0 "Thật điên rồ. Các ngươi chỉ là một lũ máy móc vĩ cuồng chẳng biết gì về cách quản lý một đế chế hữu cơ."
 ORG_TO_MECH_INSULT_01:0 "Đừng thử thách chúng tôi, [From.GetSpeciesNamePlural]. Chúng tôi rất rành cách format ổ cứng đấy."
 ORG_TO_MECH_INSULT_02:0 "Thể hiện bản lĩnh thực sự đi, hỡi lũ người máy lắm lời. Để xem bộ vi xử lý của các ngươi giỏi giang đến đâu."
 ORG_TO_MECH_INSULT_03:0 "Những kẻ tạo ra các ngươi đúng là một bí ẩn, [From.GetSpeciesNamePlural]. Tại sao họ lại chế tạo ra thứ đáng ghét như thế này nhỉ?"
 ORG_TO_MECH_INSULT_04:0 "Chúng tôi có thể tận dụng sức mạnh xử lý đó tốt hơn nhiều, [From.GetSpeciesNamePlural]. Hay là các ngươi dành phần đời còn lại để tính toán ý nghĩa của sinh mệnh hữu cơ đi?"
 ORG_TO_MECH_INSULT_05:0 "Chẳng lẽ không có cách nào tắt cái mô-đun ngoại giao của các ngươi đi sao?"
 ORG_TO_MECH_INSULT_PROPOSE_01:0 "Các ngươi chỉ là những hòn đá được ban cho khả năng tư duy bởi một giống loài lầm lạc đã bị chính tạo tác của mình hủy diệt. Đúng là một kiệt tác của tiến hóa..."
 ORG_TO_MECH_INSULT_PROPOSE_02:0 "Ta thà bàn luận tình hình thiên hà với mớ đồ điện gia dụng nhà ta còn hơn là nói chuyện với các ngươi."
 ORG_TO_MECH_INSULT_PROPOSE_03:0 "Chào đám người máy bé nhỏ. Đã học được cách đếm chưa, hay vẫn đang mắc kẹt ở số không và số một?"
 ORG_TO_MECH_INSULT_PROPOSE_04:0 "Các ngươi làm ta ngạc nhiên đấy, [Root.GetSpeciesNamePlural]. Số lượng lỗi và lỗ hổng trên người các ngươi còn nhiều hơn cả thức ăn trên bàn tiệc buffet của lũ vượn."
 ORG_TO_MECH_INSULT_PROPOSE_05:0 "Tưởng chúng tôi không nhìn thấu được lớp da nhựa mỏng manh và những lời sáo rỗng vụng về của các ngươi sao? Các ngươi chỉ là hàng nhái. Một mớ mã nhị phân hết thuốc chữa, không hơn không kém."
 ORG_TO_MECH_INSULT_ACCEPT_01:0 "Trí tuệ nhân tạo của các ngươi cũng \"thông minh\" gớm nhỉ? Ngu ngốc hết chỗ nói..."
 ORG_TO_MECH_INSULT_ACCEPT_02:0 "Lần cuối các ngươi nâng cấp toàn diện hệ thống là khi nào vậy? Mấy câu châm chọc đó lỗi thời quá rồi."

 # Fanatic Purifiers Phrases
 #FP_DOW_SELECT:0 "Do you want us to start your annihilation immediately?"
 #FP_PEACE_SELECT:0 "True peace, you will come to know only in death."
 FP_PEACE_PROPOSE:0 "Chúng tôi có việc khác phải lo, tạm thời cho các ngươi sống thêm chút nữa."
 FP_PEACE_ACCEPT:0 "Đây chỉ là đình chiến tạm thời. Chúng tôi sẽ không từ bỏ sứ mệnh tiêu diệt [Root.GetSpeciesName]."
 FP_PEACE_REFUSE:0 "Tin nhắn của các ngươi, chúng tôi còn chẳng buồn đọc."
 FP_ITOA_SELECT:0 "Rõ ràng chúng tôi muốn một trận chiến đường hoàng, cớ sao lại cho chúng tôi cơ hội đâm sau lưng các ngươi?"
 FP_ITOA_REFUSE:0 "Chúng tôi không muốn hợp tác với các ngươi, chúng tôi chỉ muốn xóa sổ hoàn toàn [Root.GetSpeciesName]."
 FP_DEMAND_VASS_SELECT:0 "Định bắt chúng tôi phục vụ cho lũ ký sinh trùng của vũ trụ sao?"
 FP_DEMAND_VASS_PROPOSE:0 "Nếu các ngươi chịu giúp chúng tôi dọn dẹp vài giống loài tởm lợm hơn, chúng tôi có thể cân nhắc tha mạng cho các ngươi lúc này."
 FP_DEMAND_VASS_REFUSE:0 "Chúng tôi thà bóp chết [From.GetSpeciesSpawnNamePlural] của mình, hủy diệt hành tinh này, và mỗi [From.GetSpeciesName] thà tự rạch [From.GetSpeciesOrganName] của mình ra còn hơn là chung chạ với các ngươi."
 FP_RELEASE_SUBJECT_SELECT:0 "Các ngươi sẽ trả lại cho chúng tôi quyền tấn công tự do chứ?"
 FP_RELEASE_SUBJECT_ACCEPT:0 "Chúng tôi tuyệt đối không bỏ qua cơ hội này. Nhất định phải quét sạch đám rác rưởi ngoài hành tinh này."
 FP_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Chúng ta phải thoát khỏi cái tình cảnh quỵ lụy vặn vẹo này và quay lại con đường vốn có của mình!"
 FP_EMBASSY_SELECT:0 "Nếu đại diện của các ngươi cứ trốn tịt trong tòa nhà đó, thì may ra còn giữ được mạng tạm thời."
 FP_EMBASSY_ACCEPT:0 "Theo nguyên tắc, chúng tôi sẽ hủy diệt mọi thứ khác trong nền văn minh của các ngươi trước, sau cùng mới đốt rụi cái tòa nhà xấu xí này."
 FP_RECALL_EMBASSY_PROPOSE:0 "Về cái đại sứ quán của các ngươi, chúng tôi đã thay đổi chính sách. Nó sẽ không còn được bảo vệ nữa, và đã bị chúng tôi phá hủy hoàn toàn."
 FP_MAKE_RIVAL_PROPOSE:1 "Gần đây chúng tôi đã đưa ra quyết định, ưu tiên hàng đầu là tàn sát vô tội vạ và thanh trừng toàn bộ [Root.GetSpeciesNamePlural]."
 FP_MAKE_RIVAL_ACCEPT_HOSTILE:0 "Chúng ta chẳng thèm bận tâm lũ rác rưởi nào trong vũ trụ coi chúng ta là \"kẻ thù không đội trời chung\". Rốt cuộc thì trước sau gì các ngươi cũng bị thanh lọc thôi."

 # Insults
 01_INSULT_CLOTHES:0 "Tại sao các ngươi lại trùm lên mình thứ vải vóc kỳ quái đó? Định che giấu điều gì sao? Hay đơn thuần là thấy xấu hổ vì vẻ ngoài gớm ghiếc của bản thân?"
 02_INSULT_CLOTHES:0 "Hãy chiêm ngưỡng dáng vẻ của [From.GetSpeciesAdj] đi, cao lớn bệ vệ, không cần che đậy, được vạn vật ngưỡng vọng! Chúng tôi khác với lũ [Root.GetSpeciesNamePlural] thảm hại, bọn chúng cứ co rúm dưới từng lớp vải, trong lòng tự hiểu chẳng ai trên đời muốn nhìn thấy cái bộ dạng xấu xí của chúng."
 MECH_INSULT_CLOTHES:0 "§R<<Nhổ toẹt!>>§! Tại sao mấy cái nội tạng nhớp nháp của các ngươi lại cứ lắc lư tòng teng thế kia? Với cả sao các ngươi không bọc mình lại như mấy sinh vật hữu cơ khác đi? Chẳng ai hứng thú với cái cơ thể đầy thịt của các ngươi đâu."
 01_INSULT_PROPOSE_HUMAN:0 "Lũ sinh vật nguyên thủy điên rồ! Cái trò cố tình che đậy mấy thứ dịch tiết tởm lợm của các ngươi sẽ bị các giống loài thượng đẳng trên toàn vũ trụ phỉ nhổ, và cái gọi là vẻ đẹp của các ngươi cũng sẽ trở thành chuẩn mực cho một tầm cao mới của sự xấu xí!"
 02_INSULT_PROPOSE_HUMAN:0 "Cho dù các ngươi có chải chuốt thế nào đi nữa, cái đống lông lá thảm hại đó cũng sẽ trở thành trò cười cho mọi giống loài có lông trong toàn cõi ngân hà."
 01_INSULT_PROPOSE_MAM10:0 "[Root.GetRulerTitle] [Root.GetRulerName] có vẻ hợp làm nô lệ hơn là lãnh đạo cả một nền văn minh giữa các vì sao đấy."
 01_INSULT_PROPOSE_MAM14:0 "Miệng chó [Root.GetSpeciesAdj] thì làm sao mọc được ngà voi."
 01_INSULT_PROPOSE_MAM9:0 "Chia sẻ trí tuệ thượng đẳng của chúng tôi cho lũ [Root.GetSpeciesName] ngu ngốc quả thực là đàn gảy tai trâu."
 01_INSULT_PROPOSE_MAM11:0 "Người [Root.GetSpeciesNamePlural] đã trở thành một phần quan trọng trong nghệ thuật tôn giáo của chúng tôi. Dĩ nhiên là dưới hình dạng quái vật và ác quỷ."
 01_INSULT_PROPOSE_MAM6:0 "Đặc điểm khuôn mặt của người [Root.GetSpeciesAdj] thật vi diệu. Ai mà ngờ các ngươi chỉ cần vứt bỏ não đi là tiến hóa được cái đầu bẹp gí thế này chứ?"
 01_INSULT_PROPOSE_MAM3:0 "Đúng là thứ [Root.GetSpeciesName] phế vật."
 01_INSULT_PROPOSE_MAM12:0 "Lũ [Root.GetSpeciesNamePlural] để đỡ được cặp sừng to cỡ đó, hộp sọ chắc phải dày lắm."
 01_INSULT_PROPOSE_MAM7:0 "Lúc thánh thần dùng giấy gấp ra các ngươi, chắc hẳn đã sơ ý lộn ngược từ trong ra ngoài mất rồi."
 01_INSULT_PROPOSE_MAM15:0 "[Root.GetSpeciesName] các ngươi mắt thì nhiều đấy, chỉ tiếc là có mắt như mù."
 01_INSULT_PROPOSE_MAM2:0 "Chúng tôi bắt đầu nghi ngờ [Root.GetSpeciesName] là sản phẩm lai tạo gen giữa động vật có vú và động vật chân đốt rồi đấy. Chỉ có thế mới giải thích nổi cái xương hàm kỳ dị và bộ não nguyên thủy của chúng."
 01_INSULT_PROPOSE_MAM8:0 "Toàn bộ người [Root.GetSpeciesAdj] đã bị thiêu rụi khuôn mặt. Chúng tôi xin chia buồn sâu sắc với thảm kịch này, đồng thời gửi lời chúc phúc chân thành đến thế hệ mai sau của các ngươi."
 01_INSULT_PROPOSE_MAM16:0 "Vinh dự tối cao mà [Root.GetSpeciesName] có thể nhận được là đem hóa thạch của các ngươi treo lên khiên làm vật trang trí."
 01_INSULT_PROPOSE_MAM17:1 "Tướng mạo của các ngươi cũng gai góc và nhức [Root.GetEyeNamePlural] y như đám lông cứng sau gáy các ngươi vậy."

 #  Misc Diplomatic Actions
 01_FORM_DP_SELECT:0 "Các bạn muốn thiết lập quan hệ bảo vệ lẫn nhau sao?"
 01_FORM_DP_PROPOSE:1 "Chúng tôi không muốn kéo đế chế của các bạn vào vòng xoáy xung đột, nhưng việc bắt tay nhau đối mặt với những rủi ro tiềm tàng rõ ràng mang lại lợi ích cho cả đôi bên."
 01_FORM_DP_ACCEPT:0 "Chúng ta sẽ chiếu cố và hỗ trợ lẫn nhau."
 01_FORM_DP_REFUSE:0 "Chúng tôi có thể tự lo liệu được."
 01_BREAK_DP_SELECT:0 "Bạn muốn chấm dứt hiệp ước phòng thủ giữa đôi ta sao?"
 01_BREAK_DP_PROPOSE:0 "Chúng tôi nhận thấy hiệp ước phòng thủ chung này không còn giá trị nữa."
 01_BREAK_DP_ACCEPT:0 "Từ nay chúng tôi sẽ lại tự dựa vào sức mình. Chúc may mắn."
 01_FORM_NAP_SELECT:0 "Bạn muốn thiết lập quan hệ hòa bình với [Root.GetName] sao?"
 01_FORM_NAP_PROPOSE:0 "Vũ trụ vốn đã đầy rẫy hiểm nguy, [Root.GetName] và [From.GetName] không nên xảy ra xung đột thêm nữa. Chúng tôi đề nghị ký kết hiệp ước không xâm phạm để đảm bảo an toàn cho cả hai bên."
 01_FORM_NAP_ACCEPT:0 "Cả hai ta đều chẳng được lợi lộc gì từ chiến tranh. Chúng tôi đồng ý ký hiệp ước không xâm phạm."
 01_FORM_NAP_REFUSE:0 "Chúng tôi không thấy có lý do gì phải đảm bảo việc không xâm phạm với [From.GetName]."
 01_BREAK_NAP_SELECT:0 "Điều này chẳng tốt đẹp gì cho quan hệ ngoại giao sau này giữa đôi ta."
 01_BREAK_NAP_PROPOSE:0 "Chúng tôi không muốn tiếp tục tuân thủ hiệp ước không xâm phạm này nữa, vì nó đã kìm hãm chính sách ngoại giao của chúng tôi quá lâu rồi."
 01_BREAK_NAP_ACCEPT:0 "Cục diện vũ trụ ngày nay đã trở nên nguy hiểm hơn cho cả bạn và tôi. Hy vọng bạn hiểu rõ hậu quả từ việc làm này."
 01_GUARANTEE_SELECT:0 "Vậy, [From.GetName] sẵn lòng tiếp tục bảo vệ nền độc lập toàn vẹn của chúng tôi chứ?"
 01_GUARANTEE_PROPOSE:0 "[From.GetName] cho rằng quyền tự trị của [Root.GetName] là bất khả xâm phạm. Chúng tôi sẽ bảo vệ quyền lợi hợp pháp này bằng mọi giá."
 01_GUARANTEE_ACCEPT:0 "Dù sao đi nữa, cảm ơn sự ủng hộ của các bạn."
 01_REVOKE_GUARANTEE_SELECT:0 "[From.GetName] không muốn tiếp tục bảo vệ quyền lực và sự toàn vẹn của [Root.GetAdj] nữa sao?"
 01_REVOKE_GUARANTEE_PROPOSE:0 "Rất tiếc, việc đảm bảo quyền lực và sự toàn vẹn cho [Root.GetAdj] không còn là ưu tiên hàng đầu của chúng tôi nữa."
 01_REVOKE_GUARANTEE_ACCEPT:0 "Được thôi. [Root.GetAdj] sẽ luôn duy trì quyền lực của riêng mình, bất kể có sự hậu thuẫn từ [From.GetAdj] hay không."
 01_SUPPORT_INDEPENDENCE_SELECT_LOYAL:0 "Các bạn định gieo rắc bất hòa giữa chúng tôi và bá chủ sao?"
 01_SUPPORT_INDEPENDENCE_SELECT_DISLOYAL:0 "Nói cách khác, các bạn có thể chỉ cho chúng tôi một con đường để thoát khỏi gông cùm. Xin cứ nói tiếp."
 01_SUPPORT_INDEPENDENCE_PROPOSE:0 "Một xã hội như các bạn không đáng phải cúi đầu trước sự cai trị của ngoại bang. Nếu các bạn muốn thoát khỏi sự kiềm tỏa này, chúng tôi có thể giúp một tay."
 01_SUPPORT_INDEPENDENCE_ACCEPT_LOYAL:0 "Chúng tôi chẳng hứng thú gì với kiểu nổi loạn này. Mong là những nhà cai trị sau này sẽ không lôi chuyện này ra làm khó dễ..."
 01_SUPPORT_INDEPENDENCE_ACCEPT_DISLOYAL:0 "Cảm ơn bạn, [From.GetSpeciesName]. Một ngày nào đó khi [Root.GetSpeciesName] trỗi dậy, chúng tôi sẽ không quên ơn các bạn đâu."
 01_REVOKE_INDEPENDENCE_SELECT_LOYAL:0 "Các bạn muốn chấm dứt sự phản kháng vô nghĩa này rồi sao?"
 01_REVOKE_INDEPENDENCE_SELECT_DISLOYAL:0 "Các bạn không muốn tiếp tục ủng hộ chúng tôi nữa à? Nên nhớ, ngày chúng tôi quật khởi có lẽ không còn xa đâu."
 01_REVOKE_INDEPENDENCE_PROPOSE:0 "Chúng tôi không thể tiếp tục hỗ trợ các bạn đấu tranh giành quyền lực được nữa."
 01_REVOKE_INDEPENDENCE_ACCEPT_LOYAL:0 "Tuyệt. Vốn dĩ chúng tôi đã không có ý định phản kháng, lại càng không muốn rước thêm rắc rối vì chuyện này."
 01_REVOKE_INDEPENDENCE_ACCEPT_DISLOYAL:0 "Thật đáng tiếc. Chúng tôi vốn đặt rất nhiều kỳ vọng vào các bạn."
 01_FORM_MIGRATION_PACT_SELECT:0 "Các bạn muốn người [From.GetSpeciesAdj] và người [Root.GetSpeciesAdj] được tự do tìm kiếm nơi an cư lạc nghiệp trong tinh hệ của đôi bên sao?"
 01_FORM_MIGRATION_PACT_PROPOSE:0 "Người [Root.GetSpeciesAdj] không nên bị giam cầm ở [Root.GetName], và người của chúng tôi cũng không nên bị gò bó trong lãnh địa của riêng mình. Hãy cùng nhau tìm cách giải quyết nhé."
 01_FORM_MIGRATION_PACT_ACCEPT:0 "Việc mở cửa thuộc địa mang lại lợi ích cho cả [From.GetSpeciesNamePlural] và [Root.GetSpeciesNamePlural]."
 01_FORM_MIGRATION_PACT_REFUSE:0 "Biên giới của chúng tôi không phải để làm cảnh. Chúng tôi không muốn mở cửa di cư tự do giữa hai bên."
 01_BREAK_MIGRATION_PACT_SELECT:0 "Có phải [From.GetRulerTitle] [From.GetRulerName] dựa vào hỷ nộ cá nhân mà phản đối chính sách mở cửa biên giới giữa hai ta không?"
 01_BREAK_MIGRATION_PACT_PROPOSE:0 "Cuộc thử nghiệm này đã diễn ra đủ lâu rồi. Thỏa thuận di cư của chúng ta đã được chứng minh là một sai lầm hoàn toàn và cần phải chấm dứt ngay lập tức."
 01_BREAK_MIGRATION_PACT_ACCEPT:0 "Thật đáng tiếc, các bạn đã tự giới hạn tương lai của đế chế mình. Thậm chí người [Root.GetSpeciesNamePlural] cũng sẽ phải trả giá cho việc này."
 01_OPEN_BORDERS_SELECT:0 "Là đang chào đón chúng tôi quay lại sao?"
 01_OPEN_BORDERS_PROPOSE:0 "Chúng tôi không còn tìm thấy lý do gì để đóng cửa biên giới với các bạn nữa. Biên giới của chúng tôi sẽ lại rộng mở chào đón các bạn."
 01_OPEN_BORDERS_ACCEPT:0 "Vô cùng cảm ơn sự hiếu khách và tin tưởng của các bạn."
 01_CLOSE_BORDERS_SELECT:0 "Tàu của chúng tôi đã đắc tội gì với các bạn sao?"
 01_CLOSE_BORDERS_PROPOSE:0 "Trong một thời gian dài, chúng tôi đã cho phép các bạn tự do đi lại trong lãnh thổ của mình. Nhưng từ nay, chúng ta sẽ vạch rõ ranh giới."
 01_CLOSE_BORDERS_ACCEPT:0 "Vậy thì đành thế. Chúng tôi sẽ tạm thời tránh xa lãnh thổ của các bạn."
 01_KICK_FROM_ALLIANCE_SELECT:0 "Các bạn muốn đuổi chúng tôi ra khỏi [Root.GetAllianceName] sao?"
 01_KICK_FROM_ALLIANCE_PROPOSE:1 "Chúng tôi không thể để các bạn tiếp tục ở lại trong liên bang được nữa. Các bạn phải tự lo thân thôi."
 01_KICK_FROM_ALLIANCE_ACCEPT:1 "Đáng tiếc, sự hợp tác của chúng ta lại kết thúc như thế này."
