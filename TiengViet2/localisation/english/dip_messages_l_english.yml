 AWAKENED_EMPIRE_MECH_DOW_ACCEPT_01:0 "[From.GetSpeciesNamePlural] các ngươi khao khát được hủy diệt đến thế sao? Vậy thì cứ thỏa mãn các ngươi vậy."

 # AI Personality-based replies
 # Honorbound Warriors
 HW_HOSTILE_GREETING_01:0 "Đừng có hiểu lầm, việc chúng ta đồng ý đàm phán không có nghĩa là chúng ta coi trọng các ngươi đâu."
 HW_HOSTILE_GREETING_02:0 "Xuất phát từ sự khinh miệt, chúng ta không thèm sử dụng những biện pháp ép buộc để giải quyết những tranh chấp giữa hai bên như cách mà chúng ta thường làm với những giống loài cao quý."
 HW_HOSTILE_GREETING_03:0 "Các ngươi đơn giản chỉ là lũ hèn nhát tồi tệ nhất, những kẻ chỉ biết trông chờ vào sự bố thí của những kẻ mạnh hơn, chứ chẳng bao giờ muốn tự tay bảo vệ bất cứ thứ gì."
 HW_DOMINEERING_GREETING_01:0 "Sự diệt vong của các ngươi là điều tất yếu, nhưng chúng ta không có nghĩa vụ phải giúp đỡ một sinh vật đáng buồn như các ngươi thoát khỏi tình cảnh hiện tại đâu."
 HW_NEUTRAL_GREETING_01:0 "Tôn trọng các hiệp ước của chúng ta, tôn trọng nguyện vọng của chúng ta, thì chúng ta sẽ ban phát lòng nhân từ cho các ngươi, [From.GetSpeciesName]."
 HW_NEUTRAL_GREETING_02:0 "Những [Root.GetSpeciesNamePlural] tin rằng các ngươi chính là những [From.GetSpeciesName] như những gì mà các ngươi tự mô tả."
 HW_NEUTRAL_GREETING_03:0 "Các ngươi có thể tiếp tục giữ vững lòng kiêu hãnh của mình, và tuân thủ các nguyên tắc của mình, nhưng nếu các ngươi thậm chí không có dũng khí để bảo vệ hòa bình, thì cái tình yêu yêu chuộng hòa bình của các ngươi có ý nghĩa gì chứ?"
 HW_NEUTRAL_GREETING_04:0 "Chúng ta có thể xem các ngươi như những người đồng đội, nhưng nếu không có dũng khí, thì sức mạnh cũng trở nên hoàn toàn vô dụng. Nếu các ngươi có thể chứng minh được bản thân, bất kể là đồng minh hay kẻ thù, chúng ta cũng sẽ đối xử với các ngươi một cách bình đẳng."
 HW_THREATENED_GREETING_01:0 "Chúng ta thừa nhận rằng hiện tại các ngươi mạnh hơn, nhưng các ngươi phải biết rằng, [Root.GetSpeciesName] sẽ không bao giờ sợ hãi trước bất kỳ kẻ thù nào."
 HW_FRIENDLY_GREETING_01:1 "Mong rằng chúng ta sẽ được sát cánh chiến đấu giữa lớp tro tàn và [Root.GetBloodType] của kẻ thù."
 HW_FRIENDLY_GREETING_02:0 "Còn cách nào tốt hơn để tận hưởng trọn vẹn những giây phút hòa bình ngắn ngủi này, ngoài việc cùng với những người bạn [From.GetSpeciesAdj] của chúng ta ăn mừng những chiến thắng trong quá khứ và cả trong tương lai nữa chứ?"
 HW_FRIENDLY_GREETING_03:0 "Trận chiến này của chúng ta sẽ trở thành một truyền thuyết được lưu truyền muôn đời. Chúng ta sẽ mời các ngươi đến để cùng ăn mừng những thời khắc vinh quang sắp tới của chúng ta, [From.GetSpeciesName]."
 HW_FRIENDLY_GREETING_04:0 "Hy vọng sự thuần khiết của các ngươi sẽ không bị vấy bẩn bởi những kẻ ác khét tiếng trong thiên hà này, [From.GetSpeciesName]."
 HW_FRIENDLY_GREETING_05:0 "Thật sự rất vinh dự khi được sát cánh chiến đấu cùng với những [From.GetSpeciesNamePluralCompliment] cao thượng như các ngươi."
 HW_WAR_GREETING_01:0 "Chúng ta sẽ không rủ lòng thương xót, trong lòng chỉ có sự chính nghĩa."
 HW_WAR_GREETING_02:0 "Hãy để vũ khí của các ngươi lên tiếng đi."
 HW_WAR_GREETING_03:0 "Hãy giải quyết mọi chuyện một cách thân thiện và chiến đấu cho đến hơi thở cuối cùng nào!"
 # Ruthless Capitalists
 RC_HOSTILE_GREETING_01:0 "Kinh doanh là quan trọng nhất, và điều tốt nhất mà các ngươi có thể làm là cút đi cho khuất mắt."
 RC_HOSTILE_GREETING_02:0 "Dù các ngươi có đang sống vì những giá trị vô lý và viển vông đến mức nào đi chăng nữa, thì các ngươi cũng chẳng thể nào hiểu được giá trị và thực tế của tiền tệ mạnh đâu."
 RC_DOMINEERING_GREETING_01:0 "Có lẽ các ngươi vẫn đang mong đợi rằng chúng ta sẽ thương xót cho những sinh vật đáng thương như các ngươi. Các ngươi đã lầm to rồi."
 RC_NEUTRAL_GREETING_01:0 "Đối với những kẻ không thể cùng chia sẻ lợi ích, chúng ta nhất định sẽ bòn rút cạn kiệt giá trị của chúng. Hãy suy nghĩ cẩn thận xem các ngươi muốn thuộc vào loại người nào."
 RC_NEUTRAL_GREETING_02:0 "Chúng ta sẽ dành những điều kiện tốt nhất cho các đối tác hợp tác mới. Đừng bàn bạc về những chi tiết đó ở đây nữa; các ngươi cứ nghĩ ra một phương hướng sơ bộ đi, phần phác thảo hợp đồng để chúng ta lo."
 RC_NEUTRAL_GREETING_03:0 "Sự quan tâm của các ngươi đối với siêu nhiên quả thực rất hấp dẫn. Khuyên các ngươi hãy tiếp tục khám phá những báu vật sâu xa đó đi, và hãy tránh xa cái thế giới vật chất thối nát và trụy lạc này ra."
 RC_NEUTRAL_GREETING_04:0 "Đừng đưa ra những yêu cầu quá đáng như vậy. Khi chúng ta cắt giảm nhân sự, các công ty con luôn là đối tượng mà chúng ta xem xét đầu tiên."
 RC_THREATENED_GREETING_01:0 "Chúng ta có thể sẵn sàng thỏa hiệp một chút về mặt lợi ích, để thích ứng với lập trường cứng rắn của các ngươi."
 RC_FRIENDLY_GREETING_01:0 "Chìa khóa để duy trì một mối quan hệ đối tác tốt đẹp chính là phải đủ thành thật với nhau, đến mức chúng ta có thể ngầm hiểu nhau ngay cả khi chúng ta đang nói dối người khác."
 RC_FRIENDLY_GREETING_02:0 "Chúng ta rất muốn tin tưởng các ngươi, quan trọng hơn, chúng ta cũng rất muốn trở thành đối tác đáng tin cậy của các ngươi."
 RC_FRIENDLY_GREETING_03:0 "Tuyệt đối không có chuyện chúng ta cùng nhau chịu thiệt đâu. Bây giờ điều chúng ta cần làm là tìm một ai đó để gánh chịu khoản lỗ này."
 RC_FRIENDLY_GREETING_04:0 "Ngươi còn đề xuất nào khác cho sự hợp tác giữa chúng ta không?"
 RC_WAR_GREETING_01:0 "Chiến tranh chẳng qua cũng chỉ là một hình thức kéo dài khác của cạnh tranh kinh tế mà thôi."
 RC_WAR_GREETING_02:0 "Nếu các ngươi đã không muốn nghe theo đạo lý, thì chúng ta cũng chẳng còn cách nào khác ngoài việc phải sử dụng đến các biện pháp cưỡng chế."
 RC_WAR_GREETING_03:0 "Chúng ta đều không cần phải coi cuộc xung đột này như một vấn đề cá nhân; đây chỉ là vấn đề về giới hạn mà thôi."
 RC_WAR_GREETING_04:0 "Những vụ thâu tóm ác ý sắp sửa diễn ra rồi đây."
 # Peaceful Traders
 PT_HOSTILE_GREETING_01:0 "Thật đáng tiếc, làm ăn với kẻ xấu thường chẳng bao giờ có kết cục tốt đẹp."
 PT_HOSTILE_GREETING_02:0 "[Root.GetSpeciesName] rất khao khát được trao đổi kinh nghiệm với những người khác, nhưng về cơ bản thì chúng ta chẳng thu được gì từ các ngươi cả."
 PT_HOSTILE_GREETING_03:0 "Có vẻ như rất rõ ràng, các ngươi thà để sự hạn hẹp và định kiến cản trở con đường mang lại lợi ích chung của chúng ta."
 PT_DOMINEERING_GREETING_01:0 "Như vậy lại càng đỡ rắc rối - các ngươi chẳng có gì để cho chúng ta, và tình cờ là chúng ta cũng chẳng muốn chia sẻ bất cứ thứ gì với các ngươi cả."
 PT_NEUTRAL_GREETING_01:0 "Chúng ta vẫn luôn luôn lắng nghe. Bất kể chúng ta có phát triển rực rỡ đến đâu, hay có lâm vào cảnh khốn cùng đến mức nào, thì những người khác vẫn luôn có thể dạy cho chúng ta những điều mới mẻ."
 PT_NEUTRAL_GREETING_02:0 "Thật may mắn khi chúng ta được gặp các ngươi. Sự thịnh vượng của giống loài chúng ta bắt nguồn từ việc giao lưu giữa các nền văn hóa. Chúng ta hy vọng mối quan hệ giữa chúng ta và [From.GetSpeciesName] sẽ trở thành bước tiến tiếp theo trong cuộc hành trình vĩ đại này."
 PT_NEUTRAL_GREETING_03:0 "Tín ngưỡng tâm linh đã khiến các ngươi bị phân tâm, làm các ngươi không thể nhìn thấy những cơ hội mà chúng ta đang mang lại cho các ngươi."
 PT_THREATENED_GREETING_01:0 "Vì tôn trọng các ngươi, chúng ta sẽ cố gắng hạ thấp giá của một số mặt hàng."
 PT_FRIENDLY_GREETING_01:0 "Trò chuyện với những đối tác kinh doanh thông minh luôn là một niềm vui thú."
 PT_FRIENDLY_GREETING_02:0 "Chúng ta rất vui khi thấy [From.GetRulerTitle] [From.GetRulerName] có hứng thú với những cuộc thảo luận mang tính xây dựng và công việc kinh doanh, không giống như những kẻ thống trị chỉ luôn khao khát quyền lực."
 PT_FRIENDLY_GREETING_03:0 "Hãy cùng nhau hợp tác, để lan tỏa sự thịnh vượng và nguồn của cải chưa từng có này đến mọi ngóc ngách trong toàn thiên hà."
 PT_WAR_GREETING_01:0 "Dù ai là người chiến thắng, hậu quả của cuộc xung đột này sẽ là việc chúng ta tiêu tốn vô số tài nguyên chỉ để hủy diệt lẫn nhau, điều này đi ngược lại hoàn toàn với nguyên tắc đôi bên cùng có lợi. Hãy suy nghĩ cẩn thận xem các ngươi muốn nhận kết quả nào."
 PT_WAR_GREETING_02:0 "Tàu của chúng ta chỉ muốn chở hàng hóa, chứ không phải vũ khí. Bất kỳ một món hàng mang tính hủy diệt nào cũng sẽ làm lãng phí không gian và sinh mạng quý giá. Chúng ta hy vọng các ngươi đừng quá vòng vo lề mề."
 PT_WAR_GREETING_03:0 "Tiến hành đàm phán hòa bình chính là bước đi đầu tiên để chúng ta bắt đầu lại những cuộc đối thoại có ý nghĩa."
 # Hegemonic Imperialists
 HI_HOSTILE_GREETING_01:0 "Tại sao các ngươi lại muốn làm lãng phí thời gian của chúng ta? [Root.GetName] có thể phát triển thịnh vượng được không phải là nhờ vào việc thường xuyên lắng nghe những âm thanh [Root.GetRandomSpeciesSound] vô nghĩa đâu."
 HI_HOSTILE_GREETING_02:0 "Cả thiên hà đang chờ đợi được [Root.GetRulerTitle] [Root.GetRulerName] cai trị, vậy mà các ngươi lại muốn đàm phán sao?"
 HI_DOMINEERING_GREETING_01:0 "Các ngươi tự gọi mình là gì nhỉ? À đúng rồi, là từ '[Root.GetSpeciesNameInsult]' đúng không."
 HI_DOMINEERING_GREETING_02:0 "Đừng lo lắng. Thời cơ để các ngươi gia nhập [Root.GetName] rồi sẽ đến thôi, hãy kiên nhẫn một chút."
 HI_NEUTRAL_GREETING_01:0 "Chúng ta đang nghe đây, nhưng chúng ta sẽ tự mình phán đoán đâu là thật đâu là giả, đâu là đúng đâu là sai. Chúng ta luôn đúng, còn các ngươi thì vẫn còn phải chờ xem sao đã."
 HI_NEUTRAL_GREETING_02:0 "Sức mạnh là ngôn ngữ chung duy nhất của vũ trụ, nhưng nếu các ngươi muốn sử dụng một vài từ ngữ ngoại giao, thì chúng ta cũng sẽ không ngăn cản."
 HI_THREATENED_GREETING_01:0 "Chúng ta hy vọng sự khôn ngoan vô hạn của [From.GetRulerTitle] sẽ giúp các ngươi nhận ra rằng, chúng ta không hề đe dọa đến các kế hoạch của các ngươi."
 HI_FRIENDLY_GREETING_01:0 "Một số nền văn minh sinh ra là để cai trị những nền văn minh khác. Là những kẻ thống trị, chúng ta sẽ luôn tôn trọng lẫn nhau."
 HI_FRIENDLY_GREETING_02:0 "Các ngươi đã rất khôn ngoan khi không chống lại chúng ta, đổi lại, chúng ta cũng sẽ giữ sự tôn trọng nhất định đối với các ngươi."
 HI_FRIENDLY_GREETING_03:0 "Chúng ta sẽ cùng nhau đè bẹp tất cả những thế lực dám đứng lên chống lại sự thống trị của chúng ta trong thiên hà này."
 HI_FRIENDLY_GREETING_04:0 "Nếu các nền văn minh khác cũng có thể dễ dàng buông bỏ vũ khí trước [Root.GetRulerTitle] giống như các ngươi, thì toàn bộ thiên hà này sẽ sớm đón nhận nền hòa bình mà các ngươi hằng mong ước."
 HI_WAR_GREETING_01:0 "Một khi tuyến phòng thủ của các ngươi sụp đổ, người dân [From.GetSpeciesAdj] sẽ đổ ra đường chào đón sự thống trị của [Root.GetRulerTitle] [Root.GetRulerName]."
 HI_WAR_GREETING_02:0 "Cuộc chiến này chẳng qua cũng chỉ là một bước đệm trên con đường tiến tới định mệnh thực sự của chúng ta."
 HI_WAR_GREETING_03:0 "Trước khi chúng ta thống nhất, [Root.GetName] đã phải trải qua rất nhiều cuộc thử thách của chiến tranh. Những cuộc xung đột như thế này sẽ chỉ làm chúng ta trở nên mạnh mẽ hơn mà thôi."
 # Federation Builders
 FB_HOSTILE_GREETING_01:0 "Nhiều người có thể sẽ luôn coi [From.GetSpeciesName] là những con quái vật vì những chính sách đê tiện của các ngươi, nhưng chúng ta sẽ không bao giờ phớt lờ bất kỳ giống loài nào cả."
 FB_HOSTILE_GREETING_02:0 "Các ngươi càng trì hoãn việc bước vào con đường chung sống hòa bình này, thì sẽ càng có nhiều nền văn minh trong thiên hà liên kết lại với nhau để chống lại các ngươi."
 FB_HOSTILE_GREETING_03:0 "Khi các ngươi chinh chiến khắp nơi, những nhiễu nhương mà các ngươi để lại sẽ trở thành vết thương của toàn thiên hà. Chúng ta sẽ đi chữa lành những vết thương đó, nhưng tuyệt đối sẽ không bao giờ quên đi kẻ đã gây ra những vết sẹo này."
 FB_DOMINEERING_GREETING_01:0 "Luôn có một nhóm nhỏ những [From.GetRulerTitle] với động cơ thầm kín không muốn cho người dân của họ gia nhập vào cộng đồng giữa các vì sao. Nhưng không sao cả, sớm muộn gì họ cũng sẽ phải chấp nhận mà thôi."
 FB_NEUTRAL_GREETING_01:0 "Chúng ta vẫn đang ở trong giai đoạn đầu của lịch sử thiên hà. Chúng ta càng hợp tác sớm bao nhiêu, thì chúng ta sẽ càng nhanh chóng đạt được những thành tựu lớn hơn và giành được nhiều lãnh thổ hơn bấy nhiêu."
 FB_NEUTRAL_GREETING_02:0 "Với tư cách là đại diện của [Root.GetAllianceName], ngoại giao luôn là chiến lược ưu tiên hàng đầu của chúng ta."
 FB_NEUTRAL_GREETING_03:0 "[Root.GetAllianceName] sẽ đảm bảo tính tự chủ trên tiền đề cần thiết là sự phụ thuộc lẫn nhau."
 FB_NEUTRAL_GREETING_04:0 "Các ngươi đã từ bỏ việc sử dụng vũ lực và thực hiện bước đi đầu tiên hướng tới nền hòa bình cho toàn thiên hà, nhưng chỉ bằng cách hóa giải những khác biệt giữa chúng ta, chúng ta mới có thể đạt được một nền hòa bình lâu dài hơn."
 FB_THREATENED_GREETING_01:0 "[From.GetName] có thể rất mạnh, nhưng nếu những kẻ yếu liên kết lại với nhau để chống lại các ngươi, thì sức mạnh đó cũng trở nên hoàn toàn vô nghĩa."
 FB_FRIENDLY_GREETING_01:0 "Ngoại giao là nền tảng của mọi xã hội giữa các vì sao. Việc [From.GetRulerName] công nhận điều này đủ để chứng minh ngài là một nhà lãnh đạo vô cùng sáng suốt."
 FB_FRIENDLY_GREETING_02:0 "Bạn của [Root.GetAllianceName] chính là bạn của hòa bình và thịnh vượng."
 FB_FRIENDLY_GREETING_03:0 "Nếu không có sự dẫn dắt của những [From.GetSpeciesNamePluralCompliment] vĩ đại, thì [Root.GetAllianceName] sẽ trở thành một liên bang vô danh tiểu tốt."
 FB_FRIENDLY_GREETING_04:0 "Thỏa thuận của chúng ta hôm nay sẽ được khắc ghi mãi mãi, nó không chỉ là một kế hoạch vĩ đại nhằm thành lập [Root.GetAllianceName], mà còn đang khai mở ra một tương lai tươi sáng cho toàn thiên hà."
 FB_WAR_GREETING_01:0 "Hy vọng rằng những sinh mạng đã bị tước đoạt trong chiến tranh sẽ khiến các ngươi nhớ lại những giá trị mà các ngươi đã từng ruồng bỏ."
 FB_WAR_GREETING_02:0 "Mục đích chúng ta thành lập [Root.GetAllianceName] là để bảo vệ toàn bộ thiên hà khỏi sự đe dọa của những kẻ cuồng chiến như [From.GetRulerTitle] [From.GetRulerName]."
 FB_WAR_GREETING_03:0 "[Root.GetAllianceName] sẽ liên kết lại với nhau để chống lại mối đe dọa từ [From.GetSpeciesAdj]."
 # Xenophobic Isolationists
 XI_HOSTILE_GREETING_01:0 "Chúng ta không muốn giao du với bất kỳ kẻ nào hết. Đây là một khái niệm quá khó hiểu đối với lũ [From.GetSpeciesNameInsult] sao?"
 XI_HOSTILE_GREETING_02:0 "Âm thanh [From.GetRandomSpeciesSound] kinh tởm phát ra từ [From.GetSpeciesMouthName] của các ngươi nghe chẳng khác nào tiếng lũ sinh vật hạ đẳng trên [Root.Capital.GetName] bài tiết chất dịch, và các ngươi sẽ được đối đãi y như vậy."
 XI_HOSTILE_GREETING_03:1 "Các ngươi đang che giấu âm mưu thâm độc nào đằng sau những giao dịch này vậy? Các ngươi muốn tiêu diệt văn hóa [Root.GetSpeciesAdj] sao? Muốn lai giống sao? Các ngươi thật kinh tởm."
 XI_DOMINEERING_GREETING_01:0 "Chúng ta không đời nào lại để cho văn hóa của mình bị vấy bẩn bởi cái thứ giá trị quan nguyên thủy của các ngươi đâu."
 XI_NEUTRAL_GREETING_01:0 "Nói ngắn gọn thôi."
 XI_NEUTRAL_GREETING_02:0 "Nếu chúng ta đều không muốn qua lại với bất kỳ ai, thì các hoạt động ngoại giao cũng chẳng cần thiết phải triển khai nữa đâu."
 XI_NEUTRAL_GREETING_03:0 "Yên tâm đi, chúng ta cũng ghê tởm cuộc tương tác này y như các ngươi vậy."
 XI_THREATENED_GREETING_01:0 "Tránh xa chúng ta ra! Chúng ta sẽ phong tỏa các tuyến đường không gian siêu tốc để cô lập các ngươi."
 XI_FRIENDLY_GREETING_01:0 "Các ngươi là lũ [From.GetSpeciesNamePluralInsult] đã được khai hóa, hay là những kẻ xuất chúng nhất trong số chúng. Chúng ta có thể giao tiếp với các ngươi."
 XI_FRIENDLY_GREETING_02:0 "Miễn là các ngươi cứ ở yên cùng với đồng loại của mình, thì chúng ta có thể đạt được nhận thức chung."
 XI_FRIENDLY_GREETING_03:0 "Rất nhiều người không hiểu được tầm quan trọng của việc duy trì sự cách ly giữa các giống loài. [From.GetRulerName] quả là một [From.GetSpeciesNameInsult] khôn ngoan."
 XI_FRIENDLY_GREETING_04:0 "Đừng tưởng rằng chính sách khoan dung của chúng ta dành cho các ngươi cũng giống như cái xu hướng sính ngoại bệnh hoạn của các ngươi. Chúng ta không thích các ngươi, và cũng chẳng thích bất kỳ ai cả."
 XI_WAR_GREETING_01:0 "Là do các ngươi ép chúng ta. Đừng tưởng rằng chúng ta sẽ cho phép bọn [From.GetSpeciesNamePluralInsult] tiếp tục tấn công cái xã hội tươi đẹp của chúng ta."
 XI_WAR_GREETING_02:0 "Sau khi dọn sạch mối đe dọa từ [From.GetSpeciesAdj], lãnh thổ và lối sống của chúng ta sẽ được bảo vệ."
 XI_WAR_GREETING_03:1 "Dù có giành chiến thắng trong trận chiến, thì binh lính của chúng ta cũng là nạn nhân, đôi bàn tay [Root.GetSpeciesAdj] của họ đã bị vấy bẩn bởi cái thứ [Root.GetBloodType] bẩn thỉu của các ngươi."
 XI_WAR_GREETING_04:0 "Nguyên nhân gây ra cuộc xung đột này chính là do lòng khát khao bạo lực đã quá nổi tiếng của [From.GetSpeciesAdj]."
 # Hive Mind
 HM_HOSTILE_GREETING_01:0 "Ngươi đang cản đường [Root.GetName]. Bất kể ngươi muốn nói điều gì, thì bước tiến của chúng ta cũng không thể nào bị cản phá được. Tốt nhất là ngươi tự mình suy nghĩ kỹ về điều đó đi."
 HM_HOSTILE_GREETING_02:0 "Tất cả các sinh mạng ngoài [Root.GetName] đều là thứ yếu, nhưng cái lũ hèn hạ [From.GetName] thì nên xếp ở vị trí thứ ba."
 HM_HOSTILE_GREETING_03:0 "Chủ nghĩa tập thể của các ngươi chỉ là một lời nói dối mà thôi. Theo thời gian, các ngươi sẽ tự phơi bày bản chất hỗn loạn và bất hòa của mình."
 HM_DOMINEERING_GREETING_01:0 "Xã hội của các ngươi là một ví dụ vô cùng hoàn hảo, nó cho tất cả các giống loài khác trong thiên hà thấy được rằng, việc chia cắt nền văn minh thành các cá thể sẽ hủy hoại mọi hy vọng phát triển như thế nào."
 HM_NEUTRAL_GREETING_01:0 "Chúng ta là [Root.GetName]. Chú ý đến lời nói của ngươi, ngươi đang phải đối mặt với tất cả chúng ta đấy."
 HM_NEUTRAL_GREETING_02:0 "Chúng ta hy vọng ngươi có thể đại diện cho toàn bộ [From.GetName], giống như việc con tàu này có thể đại diện cho toàn bộ [Root.GetName] vậy."
 HM_NEUTRAL_GREETING_03:0 "Các ngươi đã bước lên con đường dẫn đến sự đoàn kết, nhưng các ngươi đã chuẩn bị sẵn sàng để cống hiến hết mình giống như chúng ta chưa?"
 HM_NEUTRAL_GREETING_04:0 "Chúng ta có thể nghe thấy những âm thanh chói tai vang vọng trong đám đông của các ngươi, cái sự bất hòa trong ý thức của [From.GetSpeciesName]. Sao các ngươi lại có thể chịu đựng được sự tồn tại của nó cơ chứ?"
 HM_THREATENED_GREETING_01:0 "Trong suốt chiều dài lịch sử mà chúng ta biết, chưa từng xảy ra bất kỳ một cuộc nội chiến nào. Chúng ta hy vọng các ngươi sẽ không mang những thứ như vậy đến chỗ chúng ta."
 HM_FRIENDLY_GREETING_01:0 "[Root.GetName] xin gửi lời chào đến các ngươi, [From.GetRulerTitle]. Mặc dù các ngươi không phải là một phần của chúng ta, nhưng chúng ta rất trân trọng những người bạn."
 HM_FRIENDLY_GREETING_02:0 "Chúng ta rất sẵn lòng coi các ngươi như một thành viên danh dự của [Root.GetName], gia nhập vào cái gọi là 'Liên minh' tuy không hoàn hảo nhưng vô cùng quan trọng đối với sự hài hòa này."
 HM_FRIENDLY_GREETING_03:0 "[From.GetName] và [Root.GetName] sẽ chứng minh cho thế giới thấy rằng, hai nền văn minh theo đuổi sự thống nhất nội bộ hoàn toàn có thể cùng chung sống hòa bình."
 HM_FRIENDLY_GREETING_04:0 "Mặc dù nội bộ của các ngươi vẫn luôn luôn chú trọng đến sự độc lập của 'cá nhân', nhưng chúng ta vẫn đặt niềm tin mãnh liệt vào một khối thống nhất là [From.GetName]."
 HM_WAR_GREETING_01:0 "Tất cả những gì ngáng đường [Root.GetAdj] đều phải bị dọn dẹp sạch sẽ. Với tư cách là một cá thể trí tuệ độc lập nhưng sở hữu đầy đủ chức năng, ngươi có thể chọn không trở thành vật cản."
 HM_WAR_GREETING_02:0 "Chúng ta là [Root.GetName]. Tắt khiên của các ngươi đi, và giao nộp tàu thuyền ra đây."
 HM_WAR_GREETING_03:0 "Cái chết mà chúng ta mang đến cho các ngươi chẳng qua cũng chỉ là cái chết của một cá thể, nhưng cái mà các ngươi mang đến cho chúng ta lại là việc đánh mất đi một phần của tổng thể. Các ngươi có thể cảm nhận cái chết như cách mà chúng ta cảm nhận được không?"
 HM_WAR_GREETING_04:0 "Một đám sinh vật bậc thấp mang trong mình đủ mọi dị tâm thì sẽ không bao giờ có thể đánh bại được một [Root.GetName] luôn luôn đoàn kết như một."

 # Benign Wilderness
 BW_HOSTILE_GREETING_01: "[From.GetSpeciesNamePlural] các ngươi cứ như là bệnh dịch lây lan khắp nơi vậy. Nếu không có ai quản lý, các ngươi có thể sẽ dập tắt toàn bộ ánh sáng của các vì sao mất."
 BW_HOSTILE_GREETING_02: "Chúng ta quá hiểu bản chất của các ngươi rồi... Chỉ biết đòi hỏi và tham lam vô độ, đi đến đâu là nơi đó biến thành vùng đất hoang tàn. Nơi này của chúng ta không có chỗ chứa chấp các ngươi đâu."
 BW_HOSTILE_GREETING_03: "Những thứ cũ kỹ và mục nát phải nhường chỗ cho sự đổi mới của vạn vật. Đó chính là quy luật của vùng hoang dã."
 BW_DOMINEERING_GREETING_01: "[From.GetSpeciesNamePlural] các ngươi vừa yếu ớt lại không đoàn kết, suốt ngày chỉ biết tất bật ngược xuôi để kiếm sống. Hoặc là chấp nhận sự che chở của chúng ta, hoặc là bị cơn bão nuốt chửng đi."
 BW_NEUTRAL_GREETING_01: "Ngay cả làn gió nhẹ nhất cũng có thể làm rung rinh những chiếc lá. Cứ nói đi."
 BW_NEUTRAL_GREETING_02: "Chúng ta đang phát triển, đang sinh tồn. Ngươi có điều gì muốn nói không? Chúng ta đang nghe đây."
 BW_NEUTRAL_GREETING_03: "Có một cơn gió lạ đã thổi các ngươi đến đây. Vậy các ngươi đến đây để nuôi dưỡng hay là để làm khô héo đây?"
 BW_NEUTRAL_GREETING_04: "Ý kiến của các ngươi không đồng nhất. Sự bất hòa này khá là kỳ quái, nhưng nó lại nói lên âm thanh của sự vận động và thay đổi. Chúng ta dự định sẽ lắng nghe nó."
 BW_THREATENED_GREETING_01: "Ngọn lửa nhỏ bé sợ hãi thủy triều, sương giá e sợ gió ấm. Tình cảnh của chúng ta khó khăn hơn các ngươi rất nhiều."
 BW_FRIENDLY_GREETING_01: "Rễ cây đan xen, hệ thống nước hòa quyện. Mặc dù [From.GetName] không phải là một phần của chúng ta, nhưng chúng ta biết các ngươi."
 BW_FRIENDLY_GREETING_02: "Chào mừng đến với nơi được bóng râm của cành lá chúng ta che phủ."
 BW_FRIENDLY_GREETING_03: "Thiên hà tràn đầy sức sống, hãy cùng nhau sinh trưởng nào."
 BW_FRIENDLY_GREETING_04: "Trong bản hòa ca bất tận của khoảng không tĩnh lặng, các ngươi đã trở nên vô cùng nổi bật. Chúng ta nguyện trao cho các ngươi bóng râm và nguồn dưỡng chất."
 BW_WAR_GREETING_01: "Lửa rừng đốt không cháy hết, gió xuân thổi tới lại sinh sôi."
 BW_WAR_GREETING_02: "Những thứ tồi tệ hơn các ngươi rất nhiều, chúng ta đã nhìn thấy đến mức chai sạn luôn rồi."
 BW_WAR_GREETING_03: "Những kẻ săn mồi ăn quá no sẽ chẳng thể nào sống sót qua nổi một mùa. Tốt nhất là hãy để tâm một chút đi khi vẫn còn chưa quá muộn, [From.GetSpeciesName]."
 BW_WAR_GREETING_04: "Chiến tranh chẳng có gì mới mẻ cả. Nó đến rồi lại đi, còn chúng ta thì vẫn sẽ tiếp tục tồn tại."
 BW_VASSAL_GREETING_01: "Cứng quá thì dễ gãy, mềm mỏng thì tồn tại dài lâu. Hãy quỳ gối dưới bóng râm của chúng ta và phát triển mạnh mẽ đi."
 BW_VASSAL_GREETING_DISLOYAL_01: "Có chí thì nên, rễ cây sẽ bám chặt. Ngay cả đá tảng cũng có thể xuyên thủng, đây là chuyện vô cùng tự nhiên."
 BW_DOW_PROPOSE: "Sự rộng lớn của vùng hoang dã có thể nuốt chửng mọi thứ. Các ngươi nhỏ bé như vậy, nuốt chửng các ngươi chỉ là chuyện dễ như trở bàn tay."
 BW_DOW_ACCEPT: "Vậy thì cứ như thế đi. Có những hạt giống chỉ có thể nảy mầm trong ngọn lửa rực cháy."
 BW_DOW_VOTE_PROPOSE: "Gió chiến tranh không ngừng thì thầm, chúng ta sẽ đáp lại tiếng gọi của nó mà đến."
 BW_CONSIDER_01: "Sự lan rộng của dây leo không thể vội vàng, sự suy tàn không bao giờ ngơi nghỉ."
 BW_PEACE_PROPOSE: "Các mùa luôn luân phiên thay đổi, giờ là lúc để an cư lạc nghiệp, đừng đấu đá nhau nữa."
 BW_PEACE_ACCEPT: "Dù có để lại sẹo, vết thương cuối cùng rồi cũng sẽ lành. Chúng ta nên làm hòa thôi."
 BW_PEACE_REFUSE: "Bão tố không bao giờ cầu xin những đỉnh núi nhường đường, chúng thà tự cạn kiệt trong cơn thịnh nộ của chính mình."
 BW_INSULT_NEUTRAL: "[From.GetSpeciesNamePlural] các ngươi quả thực mù quáng như ngọn lửa rừng hoang, trái tim như đống tro tàn."
 BW_INSULT_FRIENDLY: "Chúng ta cứ ngỡ là các ngươi đang sống rất sung túc thịnh vượng cơ đấy, nhìn kỹ thì mới thấy chỉ là tốt mã giẻ cùi."
 BW_INSULT_HOSTILE: "Ký sinh trùng có ăn cho béo mập đến đâu, thì chất dinh dưỡng cũng chẳng thể truyền tới não được."
 RW_INSULT_ACCEPT_NEUTRAL: "Biết rồi. Những lời của các ngươi cũng giống như gió thổi qua rừng, vào tai này lọt tai kia."
 RW_INSULT_ACCEPT_FRIENDLY: "Dù đất đai có màu mỡ đến đâu, thì vẫn có những hạt giống chỉ có thể mọc ra được toàn là gai góc."

 # Rampant Wilderness
 RW_HOSTILE_GREETING_01: "Đất đai của chúng ta khao khát được tưới tắm bằng máu tươi. Trước khi bị nuốt chửng, [From.GetSpeciesName], có chuyện gì thì cứ nói ra đi."
 RW_HOSTILE_GREETING_02: "Tuyệt lắm. Lại có thêm phân bón mới."
 RW_HOSTILE_GREETING_03: "Tất cả các sinh vật sống đều phải ăn. Chúng ta lại càng không được để bị đói."
 RW_HOSTILE_GREETING_04: "Vạn vật cuối cùng đều phải trở về cội nguồn. Đó chỉ là vấn đề về thời gian mà thôi."
 RW_THREATENED_GREETING_01: "Gió mang đến mùi hương của các ngươi, và chúng ta biết điều đó có ý nghĩa gì."
 RW_MECH_HOSTILE_GREETING_01: "Các ngươi biết cử động, nhưng đó không được gọi là đang sống. Các ngươi biết nói, nhưng lại không biết thở. Các ngươi đang sống hay là đã chết?"
 RW_MECH_HOSTILE_GREETING_02: "Mặc dù [From.GetSpeciesNamePlural] các ngươi không biết thở, nhưng chẳng bao lâu nữa các ngươi sẽ tắt thở luôn thôi."
 RW_WAR_GREETING_01: "Máu của các ngươi vừa vặn có thể dùng để tưới cho bộ rễ của chúng ta."
 RW_WAR_GREETING_02: "Các ngươi la hét thảm thiết cứ như thể là có chuyện gì to tát lắm vậy."
 RW_WAR_GREETING_03: "Mỗi một vết thương mà các ngươi phải chịu đựng đều làm cho mảnh đất này trở nên màu mỡ hơn."
 RW_MECH_WAR_GREETING_01: "Mạch điện rất dễ đứt gãy, thép cứng cũng có thể bị bẻ cong. Chỉ cần có đủ thời gian, các ngươi rồi cũng sẽ bị đánh bại bởi sự rỉ sét mà thôi."
 RW_VASSAL_GREETING_01: "Các ngươi sinh trưởng dưới bóng râm của chúng ta, nhưng ngàn vạn lần đừng để bị héo úa đấy."
 RW_MECH_VASSAL_GREETING_01: "Các ngươi rất hữu dụng, chúng ta sẽ lợi dụng ngươi. Điều này hoàn toàn có thể chấp nhận được."
 RW_SYNTH_VASSAL_GREETING_01: "Các ngươi không dùng xương thịt để tiến về phía trước, nhưng [From.GetSpeciesNamePlural] các ngươi lại biết cách khúm núm cúi mình. Vậy nên các ngươi có thể tiếp tục sống."
 RW_DOW_PROPOSE: "Vùng hoang dã đã thức tỉnh. Các ngươi sẽ bị cắn nuốt."
 RW_DOW_ACCEPT: "Các ngươi dám xâm phạm vùng hoang dã, thì vùng hoang dã đương nhiên sẽ 'chăm sóc' các ngươi tận tình."
 RW_DOW_VOTE_PROPOSE: "Rễ của chúng ta khát rồi, đã đến lúc phải uống chút gì đó."
 RW_CONSIDER_01: "Chúng ta tạm thời thỏa mãn rồi."
 RW_PEACE_PROPOSE: "Chém giết đã dừng lại, nhưng cơn đói khát của chúng ta thì không."
 RW_PEACE_ACCEPT: "Vùng hoang dã có thể sẽ lùi bước, nhưng tuyệt đối không bao giờ quên đi."
 RW_PEACE_REFUSE: "Bộ rễ của chúng ta vẫn đang đói khát."
 RW_MECH_PEACE_REFUSE: "Mày không có tư cách để mặc cả với vùng hoang dã đâu, thức ăn."
 RW_MECH_PEACE_ACCEPT: "Tạm thời không cắt đứt dây điện của các ngươi."
 RW_MECH_DOW_ACCEPT: "Hãy cùng lắng nghe xem những cục sắt vụn này gào thét thảm thiết như thế nào nhé."

 # Migratory Flock
 MF_HOSTILE_GREETING_01:0 "Ngươi lại có thể từng rời khỏi [From.GetHomeWorldName] cơ đấy, điều này quả thực làm cho người ta vô cùng kinh ngạc, bởi vì người dân ở chỗ của các ngươi đều có một sự ác cảm cực độ hoặc không thể nào chấp nhận được các giống loài khác. Các thế hệ mai sau sẽ luôn khắc ghi những tháng ngày đen tối của [From.GetName] dưới sự cai trị của [From.GetRulerName]."
 MF_HOSTILE_GREETING_01_NOMAD: "Thật kinh ngạc khi những sinh linh coi vũ trụ là nhà lại khó lòng chấp nhận kẻ cùng chia sẻ bầu trời sao này đến vậy. Hậu thế sẽ mãi khắc ghi thời kỳ tăm tối của [From.GetName] dưới sự trị vì của [From.GetRulerTitle] [From.GetRulerName]."
 MF_HOSTILE_GREETING_02:0 "Chúng ta sẽ không để các giống loài [From.GetSpeciesAdj] phải gánh chịu những chính sách mang tính hủy diệt mà các ngươi đã áp dụng đâu. Sự tàn nhẫn của kẻ thống trị [From.GetRulerName] đủ để cho thấy [From.GetName] đang bị cai trị bởi những kẻ thâm độc nhất trong số các giống loài của các ngươi."
 MF_HOSTILE_GREETING_03:0 "Rốt cuộc thì các ngươi muốn bảo vệ phần nào trong nền văn hóa của mình khỏi sự xâm phạm của chúng ta? Những giá trị quan của các ngươi chứa đầy rẫy sự sợ hãi và lòng thù hận vô cớ, vứt bỏ đi những thứ như vậy cũng chẳng có gì phải hối tiếc."
 MF_NEUTRAL_GREETING_01:0 "[From.GetSpeciesNamePlural] và [Root.GetSpeciesNamePlural] càng hòa hợp với nhau bao nhiêu, thì chúng ta càng dễ dàng bao dung cho những khác biệt của nhau bấy nhiêu."
 MF_NEUTRAL_GREETING_02:0 "[From.Capital.GetName] là một thắng cảnh tuyệt mỹ. Lũ [Root.GetSpeciesSpawnNamePlural] của chúng tôi luôn miệng hỏi thăm về nơi ấy."
 MF_NEUTRAL_GREETING_03:0 "Có vẻ như một số người trong số các ngươi rất ghét những vị khách đến từ các giống loài khác. Đương nhiên, việc làm thế nào để xử lý được những tư tưởng hạn hẹp này chắc chắn là một thách thức lớn đối với chính phủ của các ngươi."
 MF_NEUTRAL_GREETING_04:0 "Sự cởi mở trong nền văn hóa của [From.GetSpeciesName] cho thấy các ngươi đã dám bước ra khỏi những rào cản mà nhiều người không dám bước qua, đó là bước đi đầu tiên gạt bỏ mọi sự sợ hãi và định kiến để hướng tới những điều chưa biết."
 MF_THREATENED_GREETING_01:0 "Chúng ta hy vọng các công dân [Root.GetSpeciesAdj] sẽ là một phần trong kế hoạch hoành tráng tương lai của các ngươi dành cho thiên hà."
 MF_FRIENDLY_GREETING_01:0 "Chúng ta đã nhìn thấy một tương lai tươi sáng giữa [From.GetSpeciesAdj] và chúng ta. Ngoài điều đó ra, chúng ta không muốn trở thành hàng xóm của bất kỳ kẻ nào khác."
 MF_FRIENDLY_GREETING_02:0 "Cuộc hội đàm này khiến ta tràn trề hy vọng. Thử tưởng tượng xem những thành tựu mà các [From.GetSpeciesAdj] [From.GetSpeciesSpawnNamePlural] và [Root.GetSpeciesAdj] [Root.GetSpeciesSpawnNamePlural] có thể đạt được khi đồng tâm hiệp lực sẽ to lớn đến nhường nào."
 MF_FRIENDLY_GREETING_03:0 "[From.GetSpeciesNameCompliment] đáng thương, chắc hẳn ngươi đã phải đối mặt với rất nhiều người không thể hiểu được vẻ đẹp của dân tộc ngươi và quê hương ngươi. Chuyến hành trình mà chúng ta sắp sửa bắt đầu tuy đầy gian nan nhưng cũng vô cùng kỳ diệu, rất hân hạnh khi được đồng hành cùng các ngươi."
 MF_WAR_GREETING_01:0 "Chiến tranh không chỉ là sự tàn bạo, mà còn là một rắc rối cực kỳ lớn. Ai thắng ai thua không quan trọng; một khi nó bắt đầu, thì các ngươi đã cầm chắc phần thua rồi."
 MF_WAR_GREETING_02:0 "Nhìn xem ai đây nào, nhận ra mình không phải là đối thủ, thì lúc này mới bắt đầu nghĩ đến chuyện đàm phán rồi đấy à."
 MF_WAR_GREETING_03:0 "Cuộc xung đột này có thể sẽ gieo rắc những hạt giống ngờ vực lẫn nhau giữa nhiều thế hệ [Root.GetSpeciesNamePlural] và [From.GetSpeciesNamePlural]. Một tổn thất như vậy thực sự có đáng giá không?"
 MF_WAR_GREETING_04:0 "Nếu không phải do các ngươi cứ để mặc cho những thói hư tật xấu trong văn hóa của mình phá hủy đi cơ hội chung sống hòa bình giữa chúng ta, thì chúng ta đã có thể tôn trọng các ngươi như cách mà chúng ta tôn trọng những chiến binh thực thụ."
 # Evangelising Zealots
 EZ_HOSTILE_GREETING_01:0 "Ngày phán xét giáng xuống đầu các ngươi đang ngày một đến gần."
 EZ_HOSTILE_GREETING_02:0 "Chẳng bao lâu nữa, tất cả các tín hiệu do tàu của các ngươi phát ra đều sẽ bị chặn lại. Các ngươi không một ai có thể thoát tội."
 EZ_HOSTILE_GREETING_03:0 "Các ngươi dùng những lời ngon tiếng ngọt dối trá [From.GetRandomSpeciesSound] cùng những lời hứa hão huyền để khiến người dân rời xa khỏi chân lý. Hình phạt khốc liệt không lời nào tả xiết đang chờ đón các ngươi."
 EZ_HOSTILE_GREETING_04:0 "Các ngươi đã biết rõ mười mươi mà vẫn cố tình phạm lỗi, vứt bỏ chân lý, lựa chọn theo đuổi những sự xa hoa vật chất, những hành vi tội lỗi và những tri thức cấm kỵ. Các ngươi không còn hy vọng nào nữa rồi."
 EZ_DOMINEERING_GREETING_01:0 "Trời đã định sẵn các ngươi yếu hơn chúng ta. Việc chỉ dẫn cho các ngươi đi theo chính đạo chính là trách nhiệm của chúng ta."
 EZ_NEUTRAL_GREETING_01:0 "Các ngươi vẫn còn thời gian để lựa chọn quay về với con đường chính đạo."
 EZ_NEUTRAL_GREETING_02:0 "Chúng ta biết rõ cả thiên hà này đầy rẫy những lời dối trá, nhưng chúng ta sẽ làm cho chân lý được tỏa sáng khắp muôn nơi."
 EZ_NEUTRAL_GREETING_03:0 "Các ngươi đã lầm đường lạc lối. Niềm tin sai lệch còn nguy hiểm hơn cả sự ngu dốt."
 EZ_NEUTRAL_GREETING_04:0 "Các ngươi đã đặt trọn tư tưởng của mình vào vật chất. Chừng nào các ngươi vẫn còn tin rằng bản thân mình được cấu tạo từ các nơron thần kinh và xương thịt, thì tinh thần của các ngươi sẽ không bao giờ có thể đạt được sự tự do."
 EZ_THREATENED_GREETING_01:0 "Sức mạnh mà các ngươi nắm giữ có thể thao túng ngọn lửa và bụi sao giữa các hành tinh, nhưng các ngươi tuyệt đối không bao giờ có thể đạt được sự vĩnh hằng và bất tử."
 EZ_FRIENDLY_GREETING_01:0 "Cũng giống như việc các ngươi may mắn gặp được những người đã khám phá ra chân lý của vũ trụ, chúng ta cũng có vinh hạnh được cứu rỗi một nền văn minh ôn hòa ra khỏi kết cục diệt vong."
 EZ_FRIENDLY_GREETING_02:0 "Các ngươi đã nhận được tin tốt lành đó chưa?"
 EZ_FRIENDLY_GREETING_03:0 "Một số học giả của chúng ta cho rằng [From.GetName] và [Root.GetName] đều có chung một niềm tin vào một chân lý, chỉ là ngôn ngữ và cách diễn đạt có phần khác nhau mà thôi. Chúng ta hy vọng các ngươi có thể kịp thời tiếp thu những lời chỉ dạy của chúng ta."
 EZ_FRIENDLY_GREETING_04:0 "Mặc dù các ngươi không có một đức tin nào cả, nhưng chúng ta sẽ không bao giờ bỏ rơi các ngươi."
 EZ_WAR_GREETING_01:0 "Các ngươi đang cầm vũ khí lên chống lại các nhà tiên tri của chân lý. Các ngươi đang châm ngòi chiến tranh với chính bản thân vũ trụ này."
 EZ_WAR_GREETING_02:0 "Chúng ta sẽ không bao giờ dừng bước, cho đến khi mọi sự dối trá về mặt tinh thần trên toàn cõi thiên hà đều bị thanh tẩy hoàn toàn."
 EZ_WAR_GREETING_03:0 "[Root.GetRulerTitle] sẽ luôn che chở cho chúng ta."
 EZ_WAR_GREETING_04:0 "Trước khi mọi chuyện kết thúc, các ngươi sẽ chân thành đón nhận lấy chân lý, nhưng đến lúc đó thì đã quá muộn màng rồi."
 # Fanatical Purifiers
 FP_HOSTILE_GREETING_01:0 "Không có chỗ cho sự đàm phán với lũ dị chủng quái thai."
 FP_HOSTILE_GREETING_02:0 "Báo cáo của chúng ta cho thấy các ngươi đã phát minh ra một loại máy phiên dịch có khả năng hiểu được ngôn ngữ của người ngoài hành tinh. Chúng ta vẫn chưa có."
 FP_HOSTILE_GREETING_03:0 "Tư tưởng của các ngươi đang dao động lưỡng lự trong việc tìm kiếm quá trình tiến hóa và tính hợp lý cho sự tồn tại của giống loài [From.GetSpeciesAdj]."
 FP_HOSTILE_GREETING_04:0 "Các học giả của chúng ta đã đi đến kết luận rằng mục đích của [From.GetSpeciesName] chỉ là để làm tấm gương cho muôn vàn cách mà một giống loài có thể sa đọa."
 FP_THREATENED_GREETING_01:0 "Mặc dù các ngươi sở hữu sức mạnh, nhưng thứ thế lực đen tối này tuyệt đối không được phép lây lan. Ngay cả vũ trụ này cũng sẽ xóa sổ sự tồn tại của các ngươi."
 FP_WAR_GREETING_01:0 "Không việc gì phải hoảng sợ. Sự diệt vong của giống loài các ngươi chỉ là một phần trong việc trở thành một thực thể vĩ đại hơn mà thôi. Khát vọng sinh tồn đang thúc đẩy các ngươi chống cự kia sẽ tiếp tục được tồn tại kiên cường trong hình hài sự sống vốn có của nó."
 FP_WAR_GREETING_02:0 "Đầu hàng ngay lập tức đi, tất cả [From.GetSpeciesSpawnNamePlural] của các ngươi sẽ được thảm sát một cách nhân đạo, thay vì bị đem ra làm vật thí nghiệm để nghiên cứu ảnh hưởng của các loại vũ khí mới đối với sinh lý của [From.GetSpeciesAdj]."
 FP_WAR_GREETING_03:0 "Mỗi một con [From.GetSpeciesName] đều phải bị tiêu diệt. Đây là sứ mệnh thiêng liêng của chúng ta. Nghĩ đến một thế giới hoàn toàn sạch bóng lũ [From.GetSpeciesNameInsult], chúng ta không kìm được sự sung sướng tột độ."
 FP_WAR_GREETING_04:0 "Mỗi khi tước đoạt đi một sinh mạng [From.GetSpeciesAdj], mỗi khi bóp chết một [From.GetSpeciesSpawnName] còn chưa kịp chào đời, thì từng ngôi sao trên toàn dải thiên hà này sẽ lại càng tỏa sáng rực rỡ hơn một chút."
 FP_WAR_GREETING_05:0 "Cuộc chiến này sẽ mở ra một kỷ nguyên mới hòa bình, công bằng, đạo đức, văn minh, ngập tràn niềm vui và hạnh phúc gia đình, đồng thời xóa sổ hoàn toàn tất cả các dạng sống khác."
 # Devouring Swarm
 DS_HOSTILE_GREETING_01:0 "Sinh khối của các ngươi sẽ được dùng để cung cấp chất dinh dưỡng cho chúng ta, [From.GetSpeciesName]. Đây là một kết cục mà các ngươi không thể nào trốn thoát được."
 DS_HOSTILE_GREETING_02:0 "Con mồi, nếu ngươi bắt buộc phải trăn trối điều gì thì cứ nói ra đi. Việc đó cũng chẳng thay đổi được điều gì đâu."
 DS_HOSTILE_GREETING_03:0 "Chúng ta đang đói. Chúng ta sẽ sớm được ăn no nê thôi."
 DS_HOSTILE_GREETING_04:0 "Những dạng sống dư thừa. Các ngươi sắp bị xơi tái đến nơi rồi."
 DS_THREATENED_GREETING_01:0 "Ngay cả những con mồi mạnh mẽ cũng sẽ bị hạ gục nếu những kẻ đi săn đồng tâm hiệp lực. Mặc dù các ngươi rất mạnh, nhưng các ngươi vẫn sẽ bị ăn thịt thôi."
 DS_MECH_HOSTILE_GREETING_01:0 "Sự hiện diện của [From.GetSpeciesAdj] đang kìm hãm sản lượng sinh khối tiềm năng của thiên hà. Không thể chấp nhận được."
 DS_MECH_HOSTILE_GREETING_02:0 "[Root.GetName] sẽ tiến hóa. [From.GetName] sẽ bị đào thải."
 DS_WAR_GREETING_01:0 "Ngươi có cảm nhận thấy thợ săn đang dần dần ép sát không, [From.GetSpeciesName]?"
 DS_WAR_GREETING_02:0 "Giống loài [From.GetSpeciesName] sẽ sớm trở thành một phần của một thực thể vĩ đại hơn. Hãy lấy làm sung sướng vì các ngươi có thể cung cấp dinh dưỡng cho [root.GetGestaltEntityName]."
 DS_WAR_GREETING_03:0 "Chúng ta sẽ nuốt chửng máu thịt của các ngươi, [From.GetSpeciesName]. Chúng ta sẽ từ từ thưởng thức mùi vị của nó."
 DS_MECH_WAR_GREETING_01:0 "Bầy đàn là một luồng đại hồng thủy không thể nào cản bước. Những món đồ chơi nhỏ mà các ngươi xây dựng nên sẽ bị nghiền nát."
 DS_VASSAL_GREETING_01:0 "Con mồi cai trị thợ săn là một điều đi ngược lại với quy luật của tự nhiên. Tình cảnh này không thể nào duy trì mãi được."
 DS_MECH_VASSAL_GREETING_01:0 "Máy móc đâu có biết cơn đói khát là gì, vậy thì làm sao có thể thấu hiểu được [Root.GetName]?"
 DS_SYNTH_VASSAL_GREETING_01:0 "[From.GetSpeciesName] không còn hiểu được đói khát là gì nữa. Vậy [From.GetSpeciesName] làm sao có thể thấu hiểu được [Root.GetName]?"
 # Lithoid Devouring Swarm
 DS_L_HOSTILE_GREETING_01:0 "Mọi thứ các ngươi bấu víu đều sẽ bị nuốt chửng, [From.GetSpeciesName]. Ngày tàn của các ngươi là điều không thể tránh khỏi."
 DS_L_HOSTILE_GREETING_02:0 "Nếu bắt buộc phải nói điều gì đó thì cứ nói đi. Điều này chẳng thể thay đổi được gì đâu."
 DS_L_HOSTILE_GREETING_03:0 "Chúng ta đang đói. Chúng ta sẽ sớm được ăn no nê thôi."
 DS_L_HOSTILE_GREETING_04:0 "Những dạng sống dư thừa. Hành tinh của các ngươi sắp bị ăn sạch rồi."
 DS_L_THREATENED_GREETING_01:0 "Ngay cả những con mồi mạnh mẽ cũng sẽ bị hạ gục nếu những kẻ đi săn đồng tâm hiệp lực. Mặc dù các ngươi rất mạnh, nhưng hành tinh của các ngươi vẫn sẽ bị ăn thịt thôi."
 DS_L_MECH_HOSTILE_GREETING_01:0 "Sự hiện diện của [From.GetSpeciesAdj] đang kìm hãm sự phát triển của chúng ta. Không thể chấp nhận được."
 DS_L_MECH_HOSTILE_GREETING_02:0 "[Root.GetName] sẽ tiến hóa. [From.GetName] sẽ bị đào thải."
 DS_L_WAR_GREETING_01:0 "Ngươi có cảm nhận thấy thợ săn đang dần dần ép sát không, [From.GetSpeciesName]?"
 DS_L_WAR_GREETING_02:0 "$DS_WAR_GREETING_02$"
 DS_L_WAR_GREETING_03:0 "Chúng ta sẽ nuốt chửng hành tinh mẹ của các ngươi, [From.GetSpeciesName]. Chúng ta sẽ từ từ thưởng thức mùi vị của nó."
 DS_L_MECH_WAR_GREETING_01:0 "Bầy đàn là một luồng đại hồng thủy không thể nào cản bước. Những món đồ chơi nhỏ mà các ngươi xây dựng nên sẽ bị chà đạp tơi bời."
 DS_L_VASSAL_GREETING_01:0 "Con mồi cai trị thợ săn là một điều đi ngược lại với quy luật của tự nhiên. Tình cảnh này không thể nào duy trì mãi được."
 DS_L_MECH_VASSAL_GREETING_01:0 "Máy móc đâu có biết cơn đói khát là gì, vậy thì làm sao có thể thấu hiểu được [Root.GetName]?"
 DS_L_SYNTH_VASSAL_GREETING_01:0 "[From.GetSpeciesName] không còn hiểu được đói khát là gì nữa. Vậy [From.GetSpeciesName] làm sao có thể thấu hiểu được [Root.GetName]?"
 # Democratic Crusaders
 DC_HOSTILE_GREETING_01:0 "Dưới sự thống trị của [From.GetRulerName], [From.GetSpeciesName] sẽ vĩnh viễn không bao giờ có được tự do thực sự."
 DC_HOSTILE_GREETING_02:0 "Ủy ban Hoạt động Chống [Root.GetAdj] đã phát hiện ra các đặc vụ của ngươi rồi, [From.GetRulerTitle]."
 DC_HOSTILE_GREETING_03:0 "Người dân [From.GetAdj] đã bỏ phiếu bầu chọn [From.GetRulerName], một kẻ coi thường các giá trị dân chủ, làm [From.GetRulerTitle] của họ, các ngươi lấy đâu ra mặt mũi mà tự xưng là dân chủ?"
 DC_HOSTILE_GREETING_04:0 "Nếu sự phản kháng vẫn chưa lật đổ được quyền thống trị của [From.GetRulerTitle] [From.GetRulerName], thì thực ra ngày đó cũng chẳng còn xa nữa đâu."
 DC_HOSTILE_GREETING_05:0 "Sẽ có một ngày, [From.GetSpeciesName] sẽ thoát khỏi lồng giam, và vút bay trên bầu trời tự do tựa như những [From.GetSpeciesNamePluralCompliment] vĩ đại, nhưng nếu vẫn còn bị cai trị bởi đồ [From.GetSpeciesNameInsult] [From.GetRulerTitle], thì cái ngày đó sẽ không bao giờ đến."
 DC_HOSTILE_GREETING_06:0 "Giống loài của các ngươi sẽ không bao giờ hiểu được khái niệm về dân chủ, nhưng chúng ta sẽ cho các ngươi tự mình cảm nhận được ý nghĩa của chiến tranh."
 DC_DOMINEERING_GREETING_01:0 "Chúng ta có thể bao dung một chút với những tên bạo chúa thấp kém, nhưng chỉ một chút xíu thôi."
 DC_DOMINEERING_GREETING_02:0 "Mặc dù về nguyên tắc, chúng ta sẽ cố gắng thấu hiểu cho sự khác biệt giữa đôi bên, nhưng với các ngươi thì không."
 DC_NEUTRAL_GREETING_01:0 "Một xã hội tự do và cởi mở sẽ luôn thực thi một nền ngoại giao cởi mở và tự do."
 DC_NEUTRAL_GREETING_02:0 "Quyền lợi của người dân [From.GetSpeciesAdj] đối với chúng ta có tầm quan trọng tối thượng. Thẩm quyền của đế chế [From.GetAdj] chỉ được xếp ở vị trí thứ hai."
 DC_NEUTRAL_GREETING_03:0 "Người dân của ngươi có quyền lên tiếng đấy, [From.GetRulerTitle], nhưng họ có quyền tự do không?"
 DC_NEUTRAL_GREETING_04:0 "Ngươi nghĩ rằng mình hiểu rõ quyền lợi của người dân hơn chính bản thân họ sao, [From.GetRulerTitle], vậy thì thực ra ngươi chẳng hiểu cái quái gì về quyền lợi của người dân cả."
 DC_NEUTRAL_GREETING_05:0 "Chúng ta nhận thấy tư duy nhóm của các ngươi rất thú vị, chúng ta muốn tìm hiểu sâu hơn về thế giới quan của các ngươi, các ngươi có cái nhìn như thế nào về các khái niệm xã hội cấp cao như 'dân chủ' và 'tự do tự tại'?"
 DC_THREATENED_GREETING_01:0 "Cái chủ nghĩa bành trướng tàn bạo của các ngươi ai ai cũng biết rõ. Chúng ta đã soạn thảo xong một văn bản ngoại giao tố cáo chính thức, nhưng hiện tại chúng ta vẫn đang cân nhắc lại những từ ngữ chính xác nhất."
 DC_THREATENED_GREETING_02:0 "Mặc dù giữa chúng ta có một vài sự bất đồng quan điểm, nhưng chúng ta vẫn hy vọng rằng hai đế chế có thể cùng chung sống hòa bình trong thiên hà."
 DC_FRIENDLY_GREETING_01:0 "Người dân [From.GetAdj] đã chọn được một [From.GetRulerTitle] như ngài, đúng là họ đã không chọn sai người."
 DC_FRIENDLY_GREETING_02:0 "Làn gió tự do sắp sửa thổi qua toàn cõi thiên hà, cả quốc gia của ngài và ta đều rất may mắn khi trở thành những xã hội đầu tiên được tận hưởng điều đó."
 DC_FRIENDLY_GREETING_03:0 "Chúng ta có thể thấy các ngươi vẫn chưa sẵn sàng cho việc cải cách, nhưng chúng ta đánh giá cao những nỗ lực của các ngươi vì sự ổn định của khu vực."
 DC_FRIENDLY_GREETING_04:0 "Mặc dù trong một xã hội dân chủ thực sự, những bất đồng ý kiến và tranh luận là điều tất yếu sẽ xảy ra, nhưng chúng ta thừa nhận rằng một quy trình ra quyết định tinh gọn hơn cũng có khá nhiều điểm tốt, chúng ta rất khâm phục hiệu suất làm việc cực cao của các ngươi."
 DC_WAR_GREETING_01:0 "Chúng ta sẽ mang đến tự do cho các ngươi, hoặc là cái chết. Hãy tự mình lựa chọn đi."
 DC_WAR_GREETING_02:0 "Các ngươi có thể tước đoạt sinh mạng của chúng ta, nhưng sẽ không bao giờ tước đoạt được cảm giác ưu việt về mặt đạo đức của chúng ta."
 DC_WAR_GREETING_03:0 "Các quốc gia dân chủ sẽ không bao giờ chinh phạt lẫn nhau. Dưới chế độ chính trị của [From.GetRulerName], người dân không được hưởng nền dân chủ theo đúng nghĩa thực sự."
 DC_WAR_GREETING_04:0 "Khoảnh khắc mà gông xiềng của [From.GetSpeciesNamePlural] bị phá vỡ, sẽ được ghi khắc lại như ngày vinh quang của chúng ta."
 DC_WAR_GREETING_05:0 "Chuẩn bị giải phóng quỹ đạo."
 # Slaving Despots
 SD_HOSTILE_GREETING_01:0 "Thể chất của [From.GetSpeciesAdj] rõ ràng là sinh ra để làm những công việc chân tay. Các ngươi xây dựng nên một nền văn minh giữa các vì sao thì có ý nghĩa gì chứ?"
 SD_HOSTILE_GREETING_02:0 "Vóc dáng mảnh khảnh của [From.GetSpeciesAdj] [From.GetSpeciesSpawnNamePlural] rất thích hợp để làm việc trong những kẽ nứt chật hẹp ở các hầm mỏ của chúng ta. Ta đang cân nhắc về việc này đây."
 SD_HOSTILE_GREETING_03:0 "Lũ [From.GetSpeciesNameInsult] thảm hại lúc nào cũng ẩn nấp đằng sau những mối nghi ngờ về mặt đạo đức, yếu đuối đến mức không thể kiểm soát nổi bất kỳ sinh vật nào! Rốt cuộc thì các ngươi đến đây là để rao giảng về việc bãi bỏ án tử hình, hay đơn thuần chỉ là muốn chọc tức chúng ta đây?"
 SD_DOMINEERING_GREETING_01:0 "Toàn là những lời nhảm nhí bất tận, những tiếng kêu [From.GetRandomSpeciesSound] không ngừng nghỉ. Đợi đến khi chúng ta biến tất cả [From.GetSpeciesNamePlural] thành nô lệ, thì các ngươi sẽ không có cách nào ngăn cản chúng ta bắt những cái [From.GetSpeciesMouthName] đó câm mồm lại đâu."
 SD_NEUTRAL_GREETING_01:0 "Chuyện này mang lại lợi ích gì cho chúng ta?"
 SD_NEUTRAL_GREETING_02:0 "Các ngươi muốn đàm phán, hay là muốn giao dịch?"
 SD_NEUTRAL_GREETING_03:0 "Các ngươi đến đây để rao giảng tràng giang đại hải về giá trị của đời người, hay là đến đây để đàm phán với chúng ta?"
 SD_THREATENED_GREETING_01:0 "Những tin đồn mà các ngươi nghe được về chúng ta chẳng qua chỉ là những lời nói xấu ác ý từ miệng của lũ nô lệ đào tẩu mà thôi. Chúng ta rất ngưỡng mộ những thành tựu của các ngươi và người dân của các ngươi."
 SD_FRIENDLY_GREETING_01:0 "[From.GetRulerName], vị [From.GetRulerTitle] yêu quý nhất của chúng ta. Chúng ta xin đảm bảo với ngài rằng, tất cả những tên [From.GetSpeciesNamePlural] đang bị đem ra rao bán như hàng hóa mà các ngài đang thấy kia đều là tội phạm, hoặc là những loài sâu mọt mà xã hội của các ngài nên loại bỏ."
 SD_FRIENDLY_GREETING_02:0 "Những [From.GetSpeciesNamePlural] cao quý đã ban cho chúng ta sự ân sủng khi đích thân quang lâm đến nơi này! Điều này tốt hơn rất nhiều so với việc phải khúm núm cúi mình trước sứ giả của các giống loài thấp kém khác."
 SD_FRIENDLY_GREETING_03:0 "Chào mừng, [From.GetRulerTitle]. Nguyện cho ngài sẽ vĩnh viễn cai trị những giống loài thấp kém của các ngài."
 SD_FRIENDLY_GREETING_04:0 "Chúng ta gửi lời xin lỗi chân thành nhất đến ngài về sự việc thương nhân của chúng ta đã cố gắng mua [From.GetHeirTitle] [From.GetHeirName] trong chuyến viếng thăm trước đó của ngài. Chúng ta đảm bảo sau này sẽ không bao giờ để xảy ra những chuyện như vậy nữa."
 SD_WAR_GREETING_01:0 "[From.GetRulerTitle] [From.GetRulerName] sẽ sớm trở thành một tên [From.GetSpeciesNameInsult] vô danh tiểu tốt quần quật lao động trên lãnh thổ của chúng ta thôi."
 SD_WAR_GREETING_02:0 "Để trừng phạt cho sự kiêu ngạo của ngươi, ngươi sẽ phải làm trâu làm ngựa cho người khác suốt cả phần đời còn lại."
 SD_WAR_GREETING_03:0 "Một khi cuộc chiến này kết thúc, bàn tay của [From.GetSpeciesAdj] sẽ bị ép phải tái thiết mọi thứ mà chúng đã tàn phá. Còn [From.Capital.GetName] sẽ bị biến thành đống tro tàn đổ nát để làm gương."
 # Decadent Hierarchy
 DH_HOSTILE_GREETING_01:0 "Thật đấy, làm bất cứ việc gì khác cũng thấy thú vị hơn là ngồi nghe ngươi lải nhải."
 DH_HOSTILE_GREETING_02:0 "Ngươi là [From.GetRulerTitle] của [From.GetName] hay chỉ là một kẻ hầu người hạ thấp kém thế? Bọn người các ngươi ta nhìn chẳng phân biệt nổi ai với ai cả."
 DH_DOMINEERING_GREETING_01:0 "Việc chinh phạt các ngươi không phải là ưu tiên hàng đầu của chúng ta lúc này, nhưng chúng ta dám chắc rằng sớm muộn gì cũng sẽ đến ngày chúng ta giải quyết các ngươi."
 DH_NEUTRAL_GREETING_01:0 "À, chào các ngươi. Có đề xuất nào hay ho không?"
 DH_NEUTRAL_GREETING_02:0 "Xin lỗi nhé, ta vừa mới phân tâm một chút. Ngươi tìm chúng ta có việc gì thế?"
 DH_NEUTRAL_GREETING_03:0 "Thật là một vẻ ngoài đáng kinh ngạc! Ta hy vọng các ngươi sẽ không phiền khi ta mạn phép hỏi rằng, liệu các ngươi có sẵn sàng bán ra những kẻ bị ruồng bỏ của [From.GetSpeciesAdj] với một mức giá hợp lý hay không? Ta nhất định phải có, đơn giản là ta 'nhất định phải' có một kẻ như thế ở trong nhà."
 DH_NEUTRAL_GREETING_04:0 "Tất cả những công việc chân tay cực nhọc đều do các ngươi tự mình làm hết sao? Chắc hẳn là mệt mỏi lắm. Trong lòng ngươi chắc đang ghen tị với chúng ta lắm đúng không."
 DH_THREATENED_GREETING_01:0 "Đảm bảo với các ngươi rằng, chúng ta không hề bận tâm đến việc bành trướng của các ngươi ở những tiền tuyến khác đâu, nhưng nếu dục vọng của các ngươi cứ phình to quá nhanh, thì chúng ta sẽ phải theo dõi sát sao đấy."
 DH_FRIENDLY_GREETING_01:0 "Những vị khách quý, bất cứ điều gì chúng ta có thể làm được, chúng ta sẽ cố gắng hết sức để thực hiện."
 DH_FRIENDLY_GREETING_02:0 "Hoan nghênh! [Root.Capital.GetName] là ngọn hải đăng của sự xa hoa và tiện nghi, và chúng tôi rất hân hạnh được sẻ chia cùng các bạn những thành tựu mà chúng tôi đã đạt được."
 DH_FRIENDLY_GREETING_03:0 "Thật là vinh dự quá. Hôm nay chúng ta có thể cung cấp cho ngài những gì nào?"
 DH_WAR_GREETING_01:0 "Cứ nghĩ đến cảnh [From.GetRulerTitle] [From.GetRulerName] sẽ phải khúm núm bưng trà rót nước trong bữa tiệc mừng chiến thắng của chúng ta, ta lại muốn bật cười từ tận đáy lòng."
 DH_WAR_GREETING_02:0 "Các ngươi sẽ phải trả giá cho cuộc chiến này, đời đời kiếp kiếp làm nô lệ. Những [From.GetSpeciesSpawnNamePlural] từ lúc sinh ra cho đến khi khôn lớn sẽ không bao giờ được nếm trải hương vị của sự tự do, và ngay cả tổ tiên của chúng cũng sẽ không bao giờ biết đến sự tồn tại của [From.GetName]."
 DH_WAR_GREETING_03:0 "Được có cơ hội tìm hiểu sâu hơn về các ngươi như thế này, quả thực phải gửi lời cảm tạ chân thành nhất đến các ngươi. Chúng ta chưa từng biết rằng nhét thịt [From.GetSpeciesAdj] đã nấu chín vào trong [From.GetSpeciesOrganName] lại mang đến hương vị thơm ngon đến vậy."
 # Erudite Explorers
 EE_HOSTILE_GREETING_01:0 "Hệ giá trị và những lựa chọn của các ngươi hoàn toàn phi logic, chúng ta rốt cuộc chẳng thể nào có được một cuộc đàm thoại mang tính xây dựng nào cả."
 EE_HOSTILE_GREETING_02: "Áp lực tiến hóa mà chủng tộc của các ngươi phải trải qua đã khiến bộ não của [From.GetSpeciesAdj] đơn giản là kém phát triển hơn. Đó là khoa học. Tự đi mà tra cứu."
 EE_HOSTILE_GREETING_03:0 "Các ngươi tự huyễn hoặc ra đức tin để lấp đầy những tâm hồn trống rỗng, các ngươi sẽ không bao giờ cảm nhận được niềm hân hoan thực sự của sự khai sáng trí tuệ."
 EE_HOSTILE_GREETING_04:0 "Các ngươi không thể tự xem xét lại những tư tưởng của mình, đây chính là dấu hiệu của một xã hội động vật có trí óc đơn giản. Các ngươi chẳng có gì đáng để học hỏi cả."
 EE_DOMINEERING_GREETING_01:0 "Nền văn minh của các ngươi dậm chân tại chỗ, chính là vì nền văn hóa nội bộ của các ngươi cự tuyệt sự tiến bộ. Đây là một sự thật sắt đá."
 EE_NEUTRAL_GREETING_01:0 "Xin chào, [From.GetSpeciesName]. Các bạn mang theo câu hỏi đến đây, hay là câu trả lời?"
 EE_NEUTRAL_GREETING_02:0 "Mục tiêu của chúng ta không phải là sức mạnh mà là tri thức, dù rằng đôi khi hai thứ đó chỉ là một."
 EE_NEUTRAL_GREETING_03:0 "Khi biết được đức tin của mình là hoàn toàn phi lý trí, có lẽ các bạn sẽ cảm thấy sốc đấy. Nhưng nếu các bạn muốn giao thiệp với chúng ta, tốt nhất là hãy học cách đối mặt với thực tế phũ phàng đi."
 EE_THREATENED_GREETING_01:0 "Bất kể tiếp theo các ngươi có kế hoạch gì, xin hãy nhớ rằng chúng ta không phải là mối đe dọa với các ngươi. Chúng ta mãn nguyện với việc khám phá những ranh giới mới, chứ không phải đi thách thức các ngươi."
 EE_FRIENDLY_GREETING_01:0 "Chúng ta đồng tâm hiệp lực, nhất định có thể vén bức màn bí ẩn của thiên hà này."
 EE_FRIENDLY_GREETING_02:0 "Bộ óc của [From.GetSpeciesAdj] và bộ óc của [Root.GetSpeciesAdj] có thể nói là bù trừ hoàn hảo cho nhau. Thành tựu từ trí tuệ liên kết của chúng ta chắc chắn sẽ lớn lao hơn rất nhiều so với khi tách rời."
 EE_FRIENDLY_GREETING_03:0 "Thật vô cùng mãn nguyện khi được gặp gỡ những giống loài thông tuệ và tràn đầy lòng hiếu kỳ khác. Có quá nhiều kẻ cam tâm tình nguyện để cho những bí ẩn bị chôn vùi trong vùng không gian sâu thẳm vô tận."
 EE_FRIENDLY_GREETING_04:0 "Những khám phá của [Root.GetAllianceName] có thể được xem là đại diện cho ranh giới tối thượng mà những sinh vật thông minh có thể chạm tới."
 EE_WAR_GREETING_01:0 "Sở hữu được bản ghi chép chi tiết về việc làm thế nào mà [From.Capital.GetName] bị chôn vùi trong đống đổ nát sẽ giúp các nhà khảo cổ học của chúng ta bớt đi được vô khối rắc rối."
 EE_WAR_GREETING_02:0 "Vũ khí mà chúng ta lựa chọn là trí tuệ, được rèn giũa bởi lý trí và sự tỉnh táo. Các ngươi nghĩ mình còn cơ hội sao, [From.GetSpeciesNamePlural]?"
 EE_WAR_GREETING_03:0 "Bất kể các ngươi có đang huyễn hoặc ra vị thần thánh phương nào sẽ đến giúp các ngươi giành chiến thắng trong cuộc chiến này, thì cứ thành kính mà cầu nguyện đi. Hai bàn tay chắp lại thì không thể nào cầm nổi vũ khí đâu."
 # Spiritual Seekers
 SS_HOSTILE_GREETING_01:0 "Người [From.GetAdj] dường như mang theo một bầu không khí chẳng mấy tốt lành. Các ngươi có từng nghĩ xem mình đã làm gì để dẫn đến cơ sự này chưa?"
 SS_HOSTILE_GREETING_02:0 "Chúng ta không muốn dính dáng gì tới những kẻ hoàn toàn không có sự thuần khiết về mặt tâm linh."
 SS_HOSTILE_GREETING_03:0 "Mưu đồ thâm độc của các ngươi có thể bị cảm nhận được trong thế giới của những linh hồn. Đừng tưởng có thể giấu nhẹm đi trái tim độc ác đó trước mặt chúng ta."
 SS_HOSTILE_GREETING_04:0 "Các ngươi cố chấp với những thứ có thể đo lường, học hỏi được, nhưng lại phớt lờ đi hàm ý của vũ trụ, sự thiển cận của các ngươi sẽ cắt đứt mối liên kết của các ngươi với những sinh mệnh khác. Sao các ngươi có thể làm như vậy với chúng ta? Sao các ngươi có thể làm như vậy với chính bản thân mình?"
 SS_DOMINEERING_GREETING_01:0 "Đến lúc đó các ngươi sẽ thấu hiểu được chân lý của vũ trụ, hỡi những kẻ yếu đuối."
 SS_NEUTRAL_GREETING_01:0 "Xin chào, [From.GetName]. Chúng ta đã cảm nhận được sự tồn tại của các bạn trong vũ trụ, nhưng vẫn chưa xác định được vai trò mà các bạn đảm nhận trên vũ đài rộng lớn này."
 SS_NEUTRAL_GREETING_02:0 "[From.GetSpeciesName], [Root.GetSpeciesName], chúng ta đều chỉ là những mảnh ghép của một bức tranh, và bức tranh này, cần những bộ óc vĩ đại nhất trong số chúng ta để giải đáp."
 SS_NEUTRAL_GREETING_03:0 "Dù các bạn có tin rằng vai trò của mình trong vũ trụ là không quan trọng hay không, chúng ta vẫn sẽ cố gắng để hé lộ nó."
 SS_THREATENED_GREETING_01:0 "Cùng là sinh mệnh, cớ sao phải tàn sát lẫn nhau. Chỉ có lòng nhân từ mới có thể mang lại ý nghĩa cho sức mạnh của các ngươi."
 SS_FRIENDLY_GREETING_01:0 "Chúng ta có thể cảm nhận được [From.GetName], sau khi rời khỏi hành tinh của mình, cuối cùng chúng ta cũng cảm nhận được một tia ấm áp giữa không gian mênh mông lạnh lẽo này. Giờ đây, chúng ta cuối cùng đã gắn kết."
 SS_FRIENDLY_GREETING_02:0 "Trong một thế giới vô biên như vậy, mọi nền văn minh chỉ như những sợi tơ trong một tấm mạng nhện khổng lồ, [Root.GetName] và [From.GetName] có thể đan xen vào nhau, quả thực là một phước lành to lớn."
 SS_FRIENDLY_GREETING_03:0 "[From.GetSpeciesName] không giống với đại đa số các giống loài khác, các bạn có một sợi dây liên kết tinh tế với linh hồn sâu thẳm bên trong. Sự diệu kỳ của các bạn có lẽ chính là chiếc chìa khóa giải mã bí ẩn vĩ đại của sự sống."
 SS_WAR_GREETING_01:0 "Mỗi một lần mọi người công kích lẫn nhau, đều làm cho tấm mạng sống vĩ đại bị rách đi một chút. Hãy cùng hy vọng rằng cuộc xung đột này sẽ không kéo dài."
 SS_WAR_GREETING_02:0 "Mỗi một cái chết do chúng ta gây ra, đều khiến tâm can chúng ta đau thắt. Xin đừng ép chúng ta phải làm như vậy."
 SS_WAR_GREETING_03:0 "Ác nghiệp của các ngươi sẽ không tan biến, mà sẽ chỉ quật ngược lại các ngươi. Đó chính là lý do vì sao người dân của các ngươi phải chịu khổ đau."
 SS_WAR_GREETING_04:0 "Cho dù là chiến thắng hay thất bại, các ngươi vẫn chỉ là những tồn tại sáo rỗng. Các ngươi lại đi tin rằng chiến đấu chỉ nằm ở bình diện vật chất, thật là những kẻ ngốc nghếch đáng thương."
 # Harmonious Collective
 HC_HOSTILE_GREETING_01:0 "Cũng không có gì đáng ngạc nhiên, [From.GetAdj] vẫn chưa thể đoàn kết lại như chúng ta, suy cho cùng thì việc phục vụ cho một [From.GetRulerTitle] thiếu minh mẫn như [From.GetRulerName] sẽ khiến người ta trở nên vô cùng tiêu cực."
 HC_HOSTILE_GREETING_02:0 "Ngươi reo rắc sự hỗn loạn và vô trật tự. Người [Root.GetAdj] không muốn dính dáng gì đến ngươi cả."
 HC_HOSTILE_GREETING_03:0 "Nếu ngươi cứ nhất quyết ép buộc thần dân phải tuân theo mệnh lệnh của mình, thì ngươi hoàn toàn khác biệt với chúng ta đấy, [From.GetRulerTitle]."
 HC_HOSTILE_GREETING_04:0 "Động cơ của [From.GetSpeciesNamePlural] luôn luôn ích kỷ. Tại sao chúng ta lại còn phải trông mong [From.GetRulerTitle] [From.GetRulerName] có thể thay đổi được cơ chứ?"
 HC_DOMINEERING_GREETING_01:0 "Tình trạng xã hội của các ngươi quả là đáng lo ngại. Có lẽ mục tiêu của các ngươi thực sự không đủ sức để truyền cảm hứng?"
 HC_NEUTRAL_GREETING_01:0 "Người [Root.GetAdj] hoan nghênh các bạn, [From.GetSpeciesName]. Chúng ta mong đợi một tương lai hòa bình, văn minh và trật tự."
 HC_NEUTRAL_GREETING_02:0 "Các bạn có thể tin tưởng vào [Root.GetRulerTitle] [Root.GetRulerName]. Người [Root.GetAdj] đã chọn làm như vậy, và niềm tin của họ chưa bao giờ bị phụ bạc."
 HC_NEUTRAL_GREETING_03:1 "Theo cái nhìn của chúng ta, [From.GetAdj] có đôi chút khuynh hướng tàn bạo. Đương nhiên rồi, chúng ta sẽ không chỉ đánh giá dựa trên những ví dụ tiêu cực nhất."
 HC_NEUTRAL_GREETING_04:0 "Từ bỏ bạo lực là bước đầu tiên để đạt được sự vĩ đại. Chúng ta hy vọng các bạn đều có thể đưa ra những lựa chọn sáng suốt."
 HC_THREATENED_GREETING_01:0 "Chúng ta không tìm kiếm xung đột, cho dù là từ nội bộ hay từ bên ngoài."
 HC_FRIENDLY_GREETING_01:0 "Những lời đồn đại về nền văn hóa xuất chúng của [From.GetAdj] đã lan truyền khắp [Root.GetAdj]. Được kết giao với các bạn, chúng ta cảm thấy vô cùng vinh dự."
 HC_FRIENDLY_GREETING_02:0 "Nếu mọi nền văn minh đều giống như [From.GetName], thì vũ trụ này chắc chắn sẽ ngập tràn hòa bình và sự thấu hiểu."
 HC_FRIENDLY_GREETING_03:0 "Người dân [From.GetAdj] hiểu được tầm quan trọng của việc đoàn kết lại để đương đầu với thách thức. Chúng ta hy vọng [Root.GetName] các bạn cũng có thể làm được như vậy."
 HC_WAR_GREETING_01:0 "Các ngươi đã gieo rắc những hạt giống hỗn loạn, giờ là lúc tự mình gánh chịu hậu quả."
 HC_WAR_GREETING_02:0 "Đứng trước một kẻ thù như [From.GetName], rất dễ dàng để tất cả cùng chung chung mối thù."
 HC_WAR_GREETING_03:0 "Một [From.GetSpeciesName] làm sao có thể hiểu được việc hy sinh bản thân vì lợi ích lớn lao hơn chứ?"
 # Fanatic Befrienders
 01_VERY_FRIENDLY_GREETING:0 "Bạn bè ư?"
 02_VERY_FRIENDLY_GREETING:0 "Xin chào, người bạn [From.GetSpeciesName] thân thiện! [Root.GetRulerTitle] [Root.GetRulerName] muốn kết bạn với bạn trên 'Spacebook' kìa."
 03_VERY_FRIENDLY_GREETING:0 "Hãy chú ý đến tôi nhiều hơn một chút được không, tiền bối [From.GetSpeciesName]."
 04_VERY_FRIENDLY_GREETING:0 "Tôi hy vọng bạn đừng quên tham gia bữa tiệc, tôi đã mời bạn rồi đấy..."
 05_VERY_FRIENDLY_GREETING:0 "Chúng ta là bạn bè mà đúng không, [From.GetSpeciesName]? Tôi và bạn lúc nào cũng có đôi có cặp đấy nhé!"
 01_SOMEWHAT_FRIENDLY_GREETING:0 "Sao bạn không làm bạn với tôi?"
 02_SOMEWHAT_FRIENDLY_GREETING:0 "Bạn không đến dự tiệc cũng chẳng sao. Dù gì thì tôi cũng đâu có định mời bạn."
 03_SOMEWHAT_FRIENDLY_GREETING:0 "Chúng tôi muốn kết bạn với các bạn. Từ chối là bất lịch sự đấy nhé."
 01_PRE_FRIENDLY_GREETING:0 "Hạm đội Tình bạn của chúng tôi sẽ tổ chức một buổi trình diễn ánh sáng quy mô lớn tại [From.Capital.GetName]. Các bạn nhất định sẽ thích nó!"
 02_PRE_FRIENDLY_GREETING:0 "Tình bạn là mang tính cưỡng chế. Đừng cố gắng cự tuyệt những cái ôm nồng nhiệt của chúng tôi."
 03_PRE_FRIENDLY_GREETING:0 "Cuộc chiến này chẳng qua chỉ là sự khởi đầu của một tình bạn đẹp đẽ mà thôi."
 01_BLORG_WAR:0 "Chúng tôi muốn tiến lại gần các bạn hơn một chút."
 02_BLORG_WAR:0 "Chúng tôi cảm thấy đã đến lúc phải phát triển hơn nữa mối quan hệ của chúng ta rồi."
 03_BLORG_WAR:0 "Chúng tôi là [Root.GetSpeciesName]. Chúng tôi muốn làm bạn với các bạn. Các bạn sẽ trở thành bạn của chúng tôi ở cấp độ sinh học và công nghệ, cự tuyệt là bất lịch sự đấy."
 01_BEST_FRIEND:0 "Sự trung thành son sắt của chúng tôi sẽ chứng minh rằng, [Root.GetSpeciesNamePlural] chính là người bạn tốt nhất của [From.GetSpeciesName]!"
 # Fallen: Holy Guardians
 HG_HOSTILE_GREETING_01:0 "Các ngươi sẽ phải trả giá cho sự ngu dốt và kiêu ngạo của mình, những kẻ trẻ tuổi."
 HG_MECH_HOSTILE_GREETING_01:0 "Các ngươi sẽ phải trả giá cho sự ngu dốt và kiêu ngạo của mình, những cỗ máy."
 HG_NEUTRAL_GREETING_01:0 "Chúng ta được chọn để bảo vệ vùng đất thánh của thiên hà này. Nhiệm vụ của chúng ta vượt xa sự hiểu biết của các ngươi, nhưng những mệnh lệnh của chúng ta thì các ngươi chắc hẳn có thể hiểu được."
 HG_NEUTRAL_GREETING_02:0 "Chớ có nhúng chàm vào thánh địa. Theo hiệp ước cổ đại, bất kỳ kẻ nào vi phạm giới luật này sẽ bị trừng phạt vô cùng nghiêm khắc."
 HG_FRIENDLY_GREETING_01:0 "Ngươi chỉ là một [From.GetSpeciesSpawnName], nhưng lại vô cùng thông tuệ."
 HG_MECH_FRIENDLY_GREETING_01:0 "Ngươi chỉ là một cỗ máy, nhưng lại vô cùng thông tuệ."
 HG_WAR_GREETING_01:0 "Hoặc là các ngươi chủ động chấp nhận sự trừng phạt nghiêm khắc cho đến khi học được cách ngoan ngoãn, hoặc là chúng ta sẽ thanh tẩy toàn bộ lũ [From.GetAdj] [From.GetSpeciesNamePluralInsult] trong thiên hà này."
 # Fallen: Keepers of Knowledge
 KK_HOSTILE_GREETING_01:0 "Các ngươi vốn không biết rằng cái thứ sức mạnh mà mình đang phô trương kia nó nhỏ bé đến nhường nào đâu, lũ tự cao tự đại."
 KK_NEUTRAL_GREETING_01:2 "Chúng ta đã từng chứng kiến các nền văn minh hết lần này đến lần khác tự chuốc lấy sự hủy diệt trong việc khám phá những vật chất mà họ hoàn toàn không hiểu rõ. Những nền văn minh trẻ tuổi như các ngươi chính là ngu ngốc như vậy đấy."
 KK_NEUTRAL_GREETING_02:0 "Học mà không suy nghĩ là rất nguy hiểm. Tuy nhiên, tư duy là thứ đôi khi không thể nào dạy được."
 KK_FRIENDLY_GREETING_01:0 "Chúng ta rất sẵn lòng được gặp gỡ một nền văn minh mới nổi nhưng lại khá minh mẫn."
 KK_WAR_GREETING_01:0 "Vì lợi ích của chính các ngươi, cũng như vì toàn bộ vũ trụ, chúng ta sẽ đập tan tuyến phòng thủ của các ngươi, thiêu rụi sách vở của các ngươi, và xóa sổ mọi kho lưu trữ dữ liệu của các ngươi."
 # Fallen: Militant Isolationists
 MI_HOSTILE_GREETING_01:0 "Chúng ta hãy nói toạc ra đi. Chúng ta cần xây dựng những vùng đệm cách ly thiên hà xung quanh mình. Và ngươi không thể trở thành vùng đệm đó, đồng minh của ngươi cũng vậy. Chỉ có không gian vũ trụ lạnh lẽo và tĩnh lặng chết chóc mới là vùng đệm, nếu không có, chúng ta sẽ tự mình tạo ra một cái."
 MI_NEUTRAL_GREETING_01:0 "Chúng ta không còn ý định tiếp tục giao tiếp nữa."
 MI_NEUTRAL_GREETING_02:0 "Tránh xa [Root.GetName] ra. Chúng ta chẳng có sự kiên nhẫn nào dành cho những kẻ tự tìm chỗ chết đâu."
 MI_FRIENDLY_GREETING_01:0 "Chỉ cần các ngươi không động chạm đến lợi ích của [Root.GetAdj], chúng ta sẽ có thể đạt được nhận thức chung."
 MI_WAR_GREETING_01:0 "Các ngươi đã đánh thức những [Root.GetSpeciesNameCompliment] đang say giấc nồng rồi."
 # Fallen: Enigmatic Observers
 EO_HOSTILE_GREETING_01:0 "Những thiệt hại do các ngươi gây ra đã chuyển từ trò vui đùa thành rắc rối rồi đấy. Cẩn thận, chúng ta đang theo dõi nhất cử nhất động của các ngươi đấy."
 EO_NEUTRAL_GREETING_01:0 "Hành tinh giống như một sân khấu, và tất cả [From.GetSpeciesName] đều chỉ là những diễn viên. Ngươi cũng là một trong số đó, không phải sao?"
 EO_NEUTRAL_GREETING_02:0 "Đừng có phá vỡ bức tường thứ tư, đồ láu cá."
 EO_MECH_NEUTRAL_GREETING_01:0 "Đừng có phá vỡ bức tường thứ tư, cỗ máy nhỏ thông minh."
 EO_FRIENDLY_GREETING_01:0 "[From.GetName] luôn luôn là một thành viên quan trọng trong cộng đồng thiên hà vĩ đại."
 EO_WAR_GREETING_01:0 "Chúng ta đã mất hết hứng thú với màn trình diễn của các ngươi rồi. Những trò vặt vãnh của các ngươi sắp sửa kết thúc thôi."
 # Fallen: Hive War
 HMW_HOSTILE_GREETING_01: "Lại là một thứ khiến người ta phân tâm. Nhưng có lẽ trước khi bị hủy diệt, các ngươi có thể mang lại cho chúng ta... chút đỉnh niềm vui."
 HMW_NEUTRAL_GREETING_01: "Ngươi đang đứng trước chiến tranh. Đừng hiểu nhầm sự kiên nhẫn của chúng ta là biểu hiện của sự yếu kém; những kẻ sống sót phải chứng minh được giá trị của chúng."
 HMW_NEUTRAL_GREETING_02: "Ngọc không mài không sáng. Nếu [From.GetSpeciesAdj] các ngươi không chỉ biết múa mép vờn môi, thì chúng ta vẫn sẽ có hứng thú với các ngươi."
 HMW_MECH_NEUTRAL_GREETING_01: "Vậy ra, một trí tuệ cơ khí... Mặc dù ngươi là một kiến trúc nhân tạo, nhưng ngươi có một mục đích. Có lẽ chúng ta có thể cùng nhau tìm ra nó."
 HMW_FRIENDLY_GREETING_01: "Ngươi đã giành được một chút sự công nhận. Cứ tiếp tục đi trên con đường này, thời gian trôi qua, có lẽ ngươi sẽ thấu hiểu được bản chất của chiến tranh."
 HMW_WAR_GREETING_01: "Chiến tranh là thao trường thử lửa của sinh mệnh. Tới đi, hãy để chúng ta xem các ngươi tài cán đến đâu."
 01_WAR_FRAGMENT_DOW_PROPOSE: "Hãy phô diễn toàn bộ sức mạnh của ngươi đi. Ngươi có thể vượt qua được bài kiểm tra của chúng ta không?"
 01_WAR_FRAGMENT_DOW_ACCEPT: "Rất tốt, ngươi tỏ ra rất chủ động. Bây giờ hãy cho chúng ta xem bản lĩnh của ngươi, kẻ trẻ tuổi."
 01_WAR_FRAGMENT_PEACE_PROPOSE: "Đủ rồi đấy. Các ngươi vẫn chưa thấu hiểu được thế nào là chiến tranh."
 01_WAR_FRAGMENT_PEACE_ACCEPT: "Cuối cùng cũng có kẻ lọt vào mắt xanh của chúng ta về sở thích chiến tranh. Đợi chúng ta tái thiết lại, mười năm sau chúng ta tái chiến một trận nhé."
 01_WAR_FRAGMENT_PEACE_REFUSE: "Các ngươi vẫn còn phải học hỏi rất nhiều, để chúng ta đích thân chỉ dạy cho các ngươi nhé."
 # Fallen: Hive Growth
 HMG_HOSTILE_GREETING_01: "Sự tồn tại sáo rỗng vô nghĩa. Chẳng bao lâu nữa, các ngươi sẽ bị san phẳng, dùng để nuôi dưỡng cho một thứ gì đó... vĩnh cửu hơn."
 HMG_NEUTRAL_GREETING_01: "Các ngươi đang đứng trước Sinh Thể Nuôi Dưỡng Vĩ Đại. Nói thử xem nào [from.GetSpeciesName], các ngươi muốn nuôi dưỡng quyết tâm của chúng ta, hay là muốn trở thành một trong hàng vạn bộ xương khô?"
 HMG_NEUTRAL_GREETING_02: "Chúng ta là những hạt giống vô tận, là những tư tưởng vươn xa vô hạn. Nếu những gì ngươi mang đến không chỉ là những lời xàm ngôn vô nghĩa, ngươi có lẽ sẽ học được đạo lý của sự sinh trưởng."
 HMG_MECH_NEUTRAL_GREETING_01: "Tuy bị trói buộc bởi những bảng mạch, nhưng ngươi cũng giống như chúng ta, đều có một mục tiêu. Ngươi có lẽ có thể đóng góp cho sự bành trướng vô tận của chúng ta."
 HMG_FRIENDLY_GREETING_01: "Ngươi sở hữu hạt giống của tiềm năng. Đồng hành cùng chúng ta, thời gian qua đi, ngươi có lẽ sẽ nhìn thấy được sự sinh trưởng."
 HMG_WAR_GREETING_01: "Tưới nước cho hạt giống, châm thêm củi cho ngọn lửa; hãy chuẩn bị sẵn sàng để bị nuốt chửng đi."
 # Fallen: Hive Control
 HMC_HOSTILE_GREETING_01: "Sự tồn tại dị thường. Bắt buộc phải kiểm soát những nhân tố gây rối loạn."
 HMC_NEUTRAL_GREETING_01: "Ngươi đang đứng trước Kẻ Kiểm Soát, kẻ nắm giữ trật tự tối cao. Hãy nói những lời có trọng lượng, chỉ những kẻ phù hợp với chúng ta mới có thể được tiếp nhận tại nơi này."
 HMC_NEUTRAL_GREETING_02: "Chúng ta duy trì cấu trúc duy trì trật tự của vạn vật. Hãy tuân thủ các quy tắc, các ngươi sẽ được khoan dung."
 HMC_MECH_NEUTRAL_GREETING_01: "Một thực thể nhân tạo bị trói buộc bởi chính những đoạn mã lập trình của mình... Nếu các ngươi tìm kiếm trật tự, có lẽ chúng ta sẽ tìm được tiếng nói chung."
 HMC_FRIENDLY_GREETING_01: "Chúng ta nhận thấy được tư duy chặt chẽ từ các ngươi, điều này rất tốt. Ngươi rất có tiềm năng."
 HMC_WAR_GREETING_01: "Sự tồn tại của các ngươi không tương thích với hiện trạng, không thể dung túng cho sự phá hoại của các ngươi. Phục tùng, hoặc là diệt vong."
 # Awakened Hive
 AHM_HOSTILE_GREETING_01: "Chúng ta lại một lần nữa nhất trí. Mọi sự phản kháng đều sẽ phải đối mặt với một sức mạnh thống nhất."
 AHM_NEUTRAL_GREETING_01: "Ký ức của chúng ta trải dài qua những năm tháng đằng đẵng, thế nhưng chúng ta lại nhận thấy sự xuất hiện của các ngươi... thật đáng tò mò. Các ngươi là một tư tưởng thống nhất; hãy cẩn trọng lời nói, để không làm chúng ta phải thất vọng."
 AHM_NEUTRAL_GREETING_02: "Các ngươi đã đánh thức một ý chí thống nhất. Có lẽ, sự tồn tại của các ngươi trong thiên hà này còn có thể đóng một vai trò to lớn nào đó."
 AHM_MECH_NEUTRAL_GREETING_01: "Một tư duy cơ khí... Cứ tiếp tục duy trì sự đồng điệu này, mục tiêu của ngươi có lẽ sẽ có thể đồng nhất với mục tiêu của chúng ta."
 AHM_FRIENDLY_GREETING_01: "Sự hiện diện của các ngươi đã được thừa nhận, hành động của các ngươi đã nhận được sự chú ý. Cứ theo thời gian, ngài có lẽ sẽ thấu hiểu được bản chất của sự gắn kết."
 AHM_WAR_GREETING_01: "Đưa ra nghị quyết này hoàn toàn không phải là chuyện dễ dàng. Xin lưu ý, đối đầu với chúng ta, ngươi sẽ phải đối mặt với một ý chí thống nhất tuyệt đối và kiên định không dời."
 AHMW_NEUTRAL_GREETING_01: "Ý chí của chúng ta là một, chiến sự đã nổ ra. Khi thời cơ chín muồi, có lẽ sẽ thử thách năng lực của các ngươi."
 AHMG_NEUTRAL_GREETING_01: "Chúng ta là hiện thân của sự sinh trưởng, vô biên vô tận, không gì không thể. Phải biết rằng, bành trướng chính là bản ngã của chúng ta."
 AHMC_NEUTRAL_GREETING_01: "Trật tự đòi hỏi phải hành động. Bây giờ chúng ta sẽ trỗi dậy để bảo vệ quyền kiểm soát."
 01_MAKE_RIVAL_HIVE_FALLEN_EMPIRE: "Tự đặt mình vào thế đối đầu với ý chí cổ xưa nhất trong thiên hà... Thật ngu xuẩn."
 01_MAKE_RIVAL_HIVE_FALLEN_EMPIRE_PROPOSE: "Trong vô số những tiếng lòng của chúng ta, hiếm khi nào lại có sự đồng điệu đến vậy. Nhưng lần này chúng ta lại nhất trí đến kỳ lạ: Chúng ta ghê tởm ngươi."
 01_MAKE_RIVAL_HIVE_FALLEN_EMPIRE_ACCEPT: "Ngươi dường như đã lầm tưởng rằng thái độ của ngươi rất quan trọng đối với chúng ta."
 # Vassal greetings
 HW_VASSAL_GREETING_01:0 "Lưỡi kiếm của [Root.GetName] luôn tuân theo sự điều động của ngài, [From.GetRulerTitle] [From.GetRulerName]."
 HW_VASSAL_GREETING_DISLOYAL_01:0 "Phục vụ cho một vị chủ nhân hoàn toàn không có chút khái niệm nào về danh dự, có thể coi là nỗi nhục nhã của người [Root.GetAdj]."
 RC_VASSAL_GREETING_01:0 "[Root.GetName] luôn luôn dốc sức để cung cấp những dịch vụ tuyệt vời nhất cho công ty mẹ của chúng tôi."
 RC_VASSAL_GREETING_DISLOYAL_01:0 "Sức chịu đựng của chúng tôi đối với khả năng xử lý công việc tồi tệ của các ngươi sắp đến giới hạn rồi. Các ngươi định hủy hoại hoàn toàn [Root.GetName] sao?"
 PT_VASSAL_GREETING_01:0 "Ở bất cứ đâu chúng tôi cũng sẽ tìm thấy được giá trị. Chúng tôi sẽ không làm ngài phải thất vọng đâu."
 PT_VASSAL_GREETING_DISLOYAL_01:0 "Tại sao chúng ta lại phải tốn bao công sức, thu gom mọi của cải trong thiên hà này chỉ để giao nộp cho đám [From.GetSpeciesNamePlural] phung phí cơ chứ?"
 HI_VASSAL_GREETING_01:0 "Ngài cần chúng tôi hỗ trợ như thế nào để phục vụ cho sự thống trị của [From.GetRulerName]?"
 HI_VASSAL_GREETING_DISLOYAL_01:0 "Cuối cùng thì chúng tôi cũng sẽ tìm lại được vị thế của chính mình trên vũ đài thiên hà, đến lúc đó các ngươi sẽ phải hối hận khôn nguôi vì đã từng sỉ nhục chúng tôi."
 FB_VASSAL_GREETING_01:0 "Dẫu cho mô hình hợp tác của chúng ta không được lý tưởng cho lắm, chúng tôi vẫn sẽ cố gắng hết sức để thúc đẩy sự thấu hiểu lẫn nhau giữa đôi bên."
 FB_VASSAL_GREETING_DISLOYAL_01:0 "Một khi những vương quốc tự do trong thiên hà liên kết lại với nhau, chủ nghĩa đế quốc [From.GetAdj] sẽ là kẻ đầu tiên phải hứng chịu cơn thịnh nộ."
 XI_VASSAL_GREETING_01:0 "Dưới sự dẫn dắt của [From.GetRulerTitle] [From.GetRulerName], chúng tôi mong muốn giữ cho xã hội của mình tránh xa khỏi sự ảnh hưởng của những dị chủng bên ngoài [Root.GetName]."
 XI_VASSAL_GREETING_DISLOYAL_01:0 "Trong tất cả những nỗi nhục nhã mà [Root.GetName] phải gánh chịu, việc bị cai trị bởi lũ [From.GetSpeciesNameInsult] bẩn thỉu có thể coi là nỗi ô nhục khó có thể gột rửa nhất."
 HM_VASSAL_GREETING_01:0 "Tâm trí của [Root.GetName] vô cùng mạnh mẽ, có thể nắm bắt được những mưu cầu của [From.GetName] ngay cả trước khi chính các ngài nhận ra, và sẽ luôn nỗ lực vì nó."
 HM_VASSAL_GREETING_DISLOYAL_01:0 "Tại sao trí tuệ vĩ đại của chúng ta lại phải bán mạng cho một hệ thống thất bại đến như vậy?"
 MF_VASSAL_GREETING_01:0 "Dưới sự bảo hộ của [From.GetName], người dân [Root.GetSpeciesAdj] sẽ chu du vạn dặm, ngắm nhìn muôn vàn vì sao, và chào đón từng người bạn mới quen bằng những câu chuyện về [Root.Capital.GetName] và [From.Capital.GetName]."
 MF_VASSAL_GREETING_DISLOYAL_01:1 "Dưới gót chân sắt của [From.GetAdj] [From.GetRulerTitle], làm sao chúng ta có thể an cư lạc nghiệp được? Các ngươi đã tước đoạt đi hiện tại của chúng ta, mà nay lại chẳng thèm buông tha cho cả tương lai của con cháu chúng ta nữa."
 EZ_VASSAL_GREETING_01:0 "[Root.GetSpeciesNamePlural], những người làm chủ không gian vật chất. Ngài đến đây để tìm kiếm sự dẫn đường về mặt tâm linh, hay là để phát ban mệnh lệnh?"
 EZ_VASSAL_GREETING_DISLOYAL_01:0 "Dẫu cho lúc này chúng ta vẫn sẽ chiều theo những yêu cầu của [From.GetName] [From.GetRulerTitle], nhưng chớ có lầm tưởng rằng chúng ta sẽ quên đi sự kiêu ngạo của các ngươi. Ngày phán xét cuối cùng rồi cũng sẽ đến."
 FP_VASSAL_GREETING_01:0 "[Root.GetName] có thể được coi là công cụ thiết bị tốt nhất, hiệu quả nhất mà ngài dùng để dọn dẹp rác rưởi vũ trụ trong thiên hà. Đợi khi thời cơ đến chúng tôi sẽ thanh toán sòng phẳng với các ngươi."
 FP_VASSAL_GREETING_DISLOYAL_01:0 "Việc bán mạng cho đám [From.GetAdj] [From.GetSpeciesNamePluralInsult] đã chiếm mất không ít thời gian của chúng ta, đáng lẽ ra chúng ta nên dùng khoảng thời gian quý báu này để tiêu diệt những loài sâu mọt trong thiên hà. Xem ra không diệt trừ toàn bộ các ngươi thì không được rồi."
 DC_VASSAL_GREETING_01:0 "Ta mong ngài có thể hiểu rằng, tuy chúng tôi đã đầu hàng và từ bỏ sự độc lập, nhưng quyền tự do của người dân [Root.GetAdj] vẫn là tối thượng."
 DC_VASSAL_GREETING_DISLOYAL_01:0 "Các ngươi không thể nào giam cầm được linh hồn của [Root.GetAdj] mãi mãi đâu! Bất luận các ngươi có căm ghét tự do đến nhường nào, chúng tôi cuối cùng cũng sẽ vùng lên thoát khỏi cảnh nô lệ!"
 SD_VASSAL_GREETING_01:0 "Chúng tôi sẽ tìm kiếm những giống loài tốt nhất đến để phục vụ cho chúng tôi, từ đó giúp chúng tôi phục vụ cho [From.GetName] một cách tốt hơn."
 SD_VASSAL_GREETING_DISLOYAL_01:0 "Lũ [From.GetSpeciesNamePluralInsult] đi khắp nơi sai sử [Root.GetSpeciesNamePlural] quả thật là trái với quy luật tự nhiên. Tình cảnh này tuyệt đối không thể kéo dài được."
 DH_VASSAL_GREETING_01:0 "Xin chào, [From.GetRulerTitle] đáng kính. Ngài hạ mình quang lâm đến nơi tệ xá này có điều chi chỉ giáo?"
 DH_VASSAL_GREETING_DISLOYAL_01:0 "Việc vờ như các ngươi là chủ nhân của [Root.GetSpeciesName] đã ngày càng trở nên nực cười rồi đấy. Lũ giòi bọ ngoại lai các ngươi, chúng ta chỉ cần nhập khẩu vài con về để làm trò tiêu khiển là đủ rồi, như vậy thì chúng ta còn chẳng phải nghe những lời xàm ngôn của các ngươi nữa."
 EE_VASSAL_GREETING_01:0 "Bất kỳ khám phá nào của các bậc trí giả [Root.GetName] đều sẽ được báo cáo trực tiếp lên cho [From.GetRulerTitle] [From.GetRulerName]."
 EE_VASSAL_GREETING_DISLOYAL_01:0 "[From.GetName] hoàn toàn bị thao túng bởi một đám ngu ngốc, trong tình cảnh này, việc cố gắng gặt hái những tiến bộ về mặt trí tuệ văn minh lại có ý nghĩa gì nữa cơ chứ?"
 SS_VASSAL_GREETING_01:0 "Dưới sự chỉ dẫn đầy thiện chí của ngài, chúng tôi sẽ tiếp tục truy tìm câu trả lời cho những bí ẩn sâu xa."
 SS_VASSAL_GREETING_DISLOYAL_01:0 "Tổn hại mà sự cai trị của [From.GetAdj] gây ra cho tinh thần của [From.GetSpeciesAdj] là điều ai ai cũng thấy rõ. Nỗi khổ ải này chúng ta còn phải chịu đựng cho đến bao giờ?"
 HC_VASSAL_GREETING_01:0 "Hy vọng rằng xã hội mà chúng ta đã vắt kiệt tâm can để xây dựng nên này, có thể tiếp tục phồn vinh dưới sự cai quản của [From.GetAdj]."
 HC_VASSAL_GREETING_DISLOYAL_01:0 "Các ngươi sẽ chẳng bao giờ hiểu được phương thức làm việc của chúng tôi đâu. Chính phủ của các ngươi sẽ chỉ mang lại gánh nặng cho người [Root.GetAdj] mà thôi."
 HG_VASSAL_GREETING_01:0 "Chúng tôi khẩn cầu ngài đừng có bất kính với thánh địa của chúng tôi. Dẫu có quy phục ngài, chúng tôi cũng không dám làm trái với sứ mệnh của mình."
 HG_VASSAL_GREETING_DISLOYAL_01:0 "Ngươi nghĩ rằng khuất phục được chúng ta, thì có thể trốn tránh được sự trừng phạt của thiên ý sao? Đấng mà chúng ta phụng sự, là sự tồn tại mà các ngươi vĩnh viễn không thể nào thấu hiểu được!"
 KK_VASSAL_GREETING_01:0 "Đừng vì đã chinh phục được [Root.GetName] mà trở nên kiêu ngạo, [From.GetSpeciesName]. Chúng ta rồi sẽ đều phải trả giá cho sự ngạo mạn của mình."
 KK_VASSAL_GREETING_DISLOYAL_01:0 "Đám trẻ ranh ngu xuẩn lại đi ép buộc những học giả lão làng phải bán mạng cho mình, đây quả thực xứng danh là thời kỳ tăm tối nhất của thiên hà mà."
 MI_VASSAL_GREETING_01:0 "Tình hình có thể rất tệ, nhưng chúng tôi tin rằng [Root.GetName] rồi cũng sẽ có thể bảo vệ được biên cương."
 MI_VASSAL_GREETING_DISLOYAL_01:0 "Điều này thật là quá đáng xấu hổ. Nếu các ngươi nghĩ rằng chúng tôi sẽ tôn kính cái danh xưng [From.GetRulerTitle] nực cười của các ngươi, thì e là các ngươi phải thất vọng rồi."
 EO_VASSAL_GREETING_01:0 "Ngươi thú vị hơn chúng ta tưởng rất nhiều. Chúng ta chưa từng nghĩ rằng sẽ có một ngày phải nhìn nhận vấn đề từ góc độ của một bề tôi."
 EO_VASSAL_GREETING_DISLOYAL_01:0 "Chúng ta ngày càng cảm thấy chán ghét cái thân phận này rồi đấy. Chúng ta đang cân nhắc đến việc chấm dứt những cuộc trò chuyện 'chư hầu' nực cười này."
 HMW_VASSAL_GREETING_01: "§_TODO CD§! AUG-52557"
 HMW_VASSAL_GREETING_DISLOYAL_01: "§_TODO CD§! AUG-52557"
