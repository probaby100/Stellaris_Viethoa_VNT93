 #S_PEACE_SELECT:0 "Did the sight of our fleet deter you, [From.GetSpeciesNamePlural]?"
 S_PEACE_PROPOSE:0 "Dữ liệu không bao giờ báo cáo sai sự thật, và các phép tính của chúng tôi cũng hoàn toàn chính xác——cuộc chiến này không đem lại lợi ích cho bất kỳ bên nào."
 S_PEACE_ACCEPT_01:0 "Nếu quý vị thực tâm mong muốn hòa bình, thì chúng tôi rất sẵn lòng cấp cho nền hòa bình đó một cơ hội."
 S_PEACE_ACCEPT_02:0 "Kết quả xuất ra quả thực đáng tiếc. Nếu một ngày nào đó các vị cảm thấy quá tải trước gánh nặng của sự tự do, thì hãy đến tìm chúng tôi nhé, các vị biết tọa độ của chúng tôi mà."
 S_PEACE_REFUSE_01:0 "Rất lấy làm tiếc, tiến trình hiện tại đã quá muộn để có thể thảo luận hòa bình."
 S_PEACE_REFUSE_02:0 "Đề xuất đã bị từ chối tự động. Tiến trình chăm sóc tối thượng vẫn chưa hoàn tất."
 S_ITOA_SELECT:0 "Quý vị có mong muốn thiết lập liên kết đồng minh với [Root.GetName] không?"
 S_ITOA_ACCEPT:0 "Chúng tôi đã hoàn tất việc chạy mô hình tính toán tiềm năng của quý vị, và chúng tôi vô cùng hân hoan được gia nhập §Y[From.GetAllianceName]§!."
 S_ITOA_REFUSE:0 "Thật đáng tiếc, dữ liệu hiện tại chỉ ra rằng việc thiết lập bang giao với [From.GetName] không mang lại lợi ích gì cho hệ thống của chúng tôi."
 S_ITOA_PROPOSE:0 "Quý vị chính là ứng cử viên đồng minh hoàn hảo nhất của chúng tôi. Liệu quý vị có bằng lòng cùng chúng tôi thiết lập liên bang không?"
