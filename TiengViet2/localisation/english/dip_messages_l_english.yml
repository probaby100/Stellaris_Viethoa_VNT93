 01_DEMAND_SIGNATORY_PROPOSE:0 "Hiệp ước này chính là chuẩn bị cho các bạn đấy. Vì sự phát triển của [Root.GetSpeciesName] và tất cả các nền văn minh khác, xin hãy mau chóng ký kết đi."
