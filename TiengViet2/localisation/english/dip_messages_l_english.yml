 CRISIS_RECALL_EMBASSY_PROPOSE:0 "[Root.GetSpeciesNamePlural], thời gian của các ngươi đã hết. Chúng tôi sẽ không dung thứ cho bất kỳ sự chậm trễ nào nữa. Mọi sinh vật đều phải trở thành nhiên liệu cho con đường vĩ đại của chúng tôi."
 CRISIS_RECALL_EMBASSY_ACCEPT:0 "Rất tốt, điều này sẽ giúp chúng ta đẩy nhanh §Rkế hoạch§!."
 CRISIS_MAKE_RIVAL:0 "Chỉ là một bản tuyên ngôn vô giá trị."
 CRISIS_MAKE_RIVAL_PROPOSE:0 "[Root.GetSpeciesName], các ngươi đã bị xem là một mối đe dọa đối với kế hoạch của chúng tôi. Đây thực sự là một vinh dự tột đỉnh —— các ngươi đã sẵn sàng hiến dâng mạng sống vì điều đó chưa?"
 CRISIS_MAKE_RIVAL_ACCEPT:0 "Các ngươi tưởng mình có thể ngồi chung mâm với chúng tôi sao?"
 CRISIS_END_RIVALRY:0 "[Root.GetSpeciesNamePlural], các ngươi thực sự tin rằng điều này sẽ tạo ra sự khác biệt sao?"
 CRISIS_END_RIVALRY_PROPOSE:0 "Dù rất không tình nguyện, chúng tôi sẵn sàng trì hoãn sự hủy diệt không thể tránh khỏi của các ngươi. Tạm thời là vậy."
 CRISIS_END_RIVALRY_ACCEPT:0 "Các hành động thù địch sẽ giảm bớt, trong một khoảng thời gian."

