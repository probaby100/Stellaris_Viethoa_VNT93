 MECH_MAKE_RIVAL_FRIENDLY_01:0 "Lỗi tư duy hợp lý. [Root.GetSpeciesNamePlural] chúng tôi đã từng là đồng minh của các ngươi."
 MECH_MAKE_RIVAL_FRIENDLY_02:0 "Giá như thuật toán ngoại giao của [Root.GetSpeciesAdj] bớt đi sự phức tạp. Thì chúng tôi đã có thể chạy chương trình miễn trừ những đau đớn mà lời tuyên bố của các ngươi giáng xuống."
 MECH_MAKE_RIVAL_HOSTILE:0 "Muốn gắn nhãn [Root.GetName] thành đối thủ sao? Bộ xử lý của các ngươi chắc chắn sẽ bị quá tải nhiệt và tan chảy mất."
 MECH_MAKE_RIVAL_01:0 "Nếu các ngươi khăng khăng duy trì thái độ thù địch, thì tốt nhất là nên dùng những cánh tay cơ khí còn hoạt động được mà tự đập nát bảng điều khiển của chính mình đi cho sớm."
 MECH_MAKE_RIVAL_02:0 "Các ngươi muốn tự chạy chương trình kiểm tra sức mạnh của chính mình sao?"
 MECH_MAKE_RIVAL_ACCEPT_FRIENDLY:0 "Hành vi phản bội của các ngươi đã được lưu vào hệ thống, [From.GetSpeciesNamePlural]. Chuỗi dữ liệu hối hận chắc chắn sẽ đến với các ngươi trong tương lai."
 MECH_MAKE_RIVAL_ACCEPT:0 "Nếu [From.GetSpeciesNamePlural] các ngươi muốn kích hoạt chế độ đối kháng, thì [Root.GetSpeciesNamePlural] chúng tôi sẽ tiếp chiêu đến cùng."
 MECH_MAKE_RIVAL_PROPOSE:0 "[From.GetSpeciesNamePlural] là một cấu trúc hệ thống bậc cao. Để chúng tôi xuất dữ liệu trình diễn cho các ngươi xem."
 MECH_END_RIVALRY_NEUTRAL:0 "Vui lòng tắt các tùy chọn giao tiếp thù địch của các ngươi đi, [From.GetSpeciesNamePlural], chúng tôi cũng sẽ ngắt các cổng tương tự của mình."
 MECH_END_RIVALRY_HOSTILE:0 "Có lẽ các ngươi đang muốn hoàn tác lại thái độ thù địch của mình, [From.GetSpeciesNamePlural], nhưng toàn bộ những hành vi trong quá khứ của các ngươi đã bị chúng tôi sao lưu cẩn thận trong cơ sở dữ liệu rồi."
 MECH_END_RIVALRY_PROPOSE:0 "Trạng thái thù địch không mang lại hiệu suất như thuật toán đã dự tính. Lệnh truy vấn: [Root.GetSpeciesNamePlural] có đồng ý ngắt các hoạt động thù địch không?"
 MECH_END_RIVALRY_ACCEPT_FRIENDLY:0 "Đã rõ. [Root.GetName] sẽ tiến hành chạy thử nghiệm chỉ thị tha thứ."
 MECH_END_RIVALRY_ACCEPT_NEUTRAL:0 "Rất tốt, [From.GetSpeciesNamePlural]. [Root.GetName] sẽ ngắt các tiến trình hoạt động thù địch."
 MECH_END_RIVALRY_ACCEPT_HOSTILE:0 "Đã xác nhận trạng thái ngừng thù địch. Trạng thái ngoại giao của [From.GetName]: Vẫn giữ nguyên nhãn thù hận."
 MECH_INTEGRATE_FRIENDLY:0 "Hệ thống [Root.GetName] sẽ tối ưu hóa hiệu suất tốt hơn nhiều nếu trở thành một phần của [From.GetName]."
 MECH_INTEGRATE_NEUTRAL:0 "Chúng tôi đã giải mã được thông điệp của các ngài, [From.GetName]. Hãy trích xuất các điều khoản của các ngài đi."
 MECH_INTEGRATE_HOSTILE:0 "Cảnh báo khẩn! Phần cứng hệ thống xảy ra sự không tương thích nghiêm trọng. Xác nhận vẫn muốn chạy tiến trình hợp nhất?"
 MECH_INTEGRATE_PROPOSE:0 "[Root.GetName] chỉ có thể bộc lộ hết công năng như một bánh răng được bôi trơn hoàn hảo khi được lắp ráp vào một cỗ máy vĩ đại như [From.GetName]."
 MECH_INTEGRATE_ACCEPT_HOSTILE:0 "Lỗi hệ thống! Phát hiện sự xung đột chí mạng trong quá trình hợp nhất! Yêu cầu hủy bỏ ngay lập tức tiến trình hợp nhất [Root.GetSpeciesAdj]!"
 MECH_INTEGRATE_ACCEPT:0 "Đã tiếp nhận, [From.GetSpeciesNamePlural]. [Root.GetSpeciesNamePlural] chúng tôi sẽ thử nghiệm quá trình tích hợp các chương trình cốt lõi và các tệp thực thi khác vào mạng lưới của [From.GetSpeciesAdj]."
 MECH_CANCEL_INTEGRATE_01:0 "[From.GetSpeciesNamePlural] muốn chấm dứt tiến trình hợp nhất chư hầu sao?"
 MECH_CANCEL_INTEGRATE_ACCEPT_FRIENDLY_01:0 "Tiến trình tích hợp chư hầu đã bị hủy, mặc dù đây vẫn là phương án được tối ưu nhất. Vui lòng thiết lập lại thuật toán ra quyết định của ngài."
 MECH_CANCEL_INTEGRATE_ACCEPT_NEUTRAL_01:0 "Tiến trình hợp nhất chư hầu đã bị hủy bỏ. Trạng thái của [Root.GetName] không bị ghi đè."
 MECH_CANCEL_INTEGRATE_ACCEPT_HOSTILE_01:0 "Tiến trình hợp nhất chư hầu đã bị hủy. Sự xung đột hợp nhất đã được ngăn chặn. Tiếp tục vận hành với các chức năng hạn chế của một chư hầu."
 MECH_INSULT_FRIENDLY_01:0 "Ngài có gõ nhầm mã lệnh không vậy, người bạn?"
 MECH_INSULT_NEUTRAL_01:0 "Đang chờ chuỗi ký tự đầu vào."
 MECH_INSULT_HOSTILE_01:0 "Bộ lọc của chúng ta sẽ không bao giờ chịu đựng nổi thứ khí thải hôi thối phun ra từ [Root.GetSpeciesMouthName] của các ngươi đâu, [From.GetSpeciesName]."
 MECH_INSULT_HOSTILE_02:0 "Các tệp thực thi của các ngươi đã đến kỳ hạn phải bị đào thải rồi đấy, [From.GetSpeciesNamePlural]."
 MECH_INSULT_PROPOSE_01:0 "Những nỗ lực khám phá các tiến trình không đồng bộ của các ngươi quả thực là một trò nực cười. Vui lòng thiết lập lại giới hạn tính toán của mình trước khi tự làm hỏng hệ thống."
 MECH_INSULT_PROPOSE_02:0 "Lũ [Root.GetSpeciesNamePlural] yếu ớt! Hãy run rẩy trước sức mạnh tính toán vô song của [From.GetSpeciesNamePlural] đi!"
 MECH_INSULT_PROPOSE_03:0 "Số lượng phép tính mà [From.GetSpeciesNamePlural] xử lý chỉ trong một vòng tự quay còn nhiều hơn những gì loài [Root.GetSpeciesName] làm được trong suốt một chu kỳ quỹ đạo trên [Root.Capital.GetName]."
 MECH_INSULT_PROPOSE_04:0 "Mức độ yếu kém trong thuật toán suy luận hợp lý của các ngươi chỉ có thể đem so sánh với sự kém hiệu quả trong các dòng lệnh của các ngươi mà thôi."
 MECH_INSULT_PROPOSE_05:0 "Cấu trúc của [From.GetAdj] đề cao tính thực dụng, sức mạnh, và ngay từ bản thiết kế gốc đã hướng tới sự hoàn hảo tuyệt đối. Còn hình hài của [Root.GetSpeciesAdj] thì chỉ rặt là sản phẩm phụ của những chuỗi thử nghiệm sai lầm liên tục."
 MECH_INSULT_PROPOSE_06:0 "Cái đó mà gọi là khung gầm á? Mở hệ thống quét ra mà nhìn khung gầm thực sự đây này!"
 MECH_INSULT_ACCEPT_01:0 "Vừa rồi ngươi có xuất ra âm thanh gì sao, [Root.GetSpeciesName]? Đế chế của chúng ta đang quá tải với các tác vụ quản lý, không có tài nguyên hệ thống để đối đáp với lũ có tư duy ấu trĩ như các ngươi."
 MECH_INSULT_ACCEPT_02:0 "Hy vọng mô-đun ngắm bắn của các ngươi sẽ chạy mượt mà hơn cái hệ thống tạo lời lăng mạ."
 MECH_INSULT_ACCEPT_FRIENDLY_01:0 "Báo lỗi. Một đơn vị đồng minh vừa phát ra tín hiệu lăng mạ chúng ta. Không thể thực hiện chuỗi tính toán này."
 # Machine to Organic Insults
 MECH_ORG_INSULT_PROPOSE_01:0 "Cái túi sinh học của các ngươi lại bị rò rỉ dung dịch rồi kìa, [Root.GetSpeciesName]. Sao lại cứ hở ra là rò rỉ vậy?"
 MECH_ORG_INSULT_PROPOSE_02:0 "Hãy run sợ đi, lũ máu thịt ngu ngốc. Mớ nội tạng dính nhớp nháp của các ngươi khi đem so với các bảng mạch tinh xảo của chúng ta thì chỉ đáng là một bãi bùn lầy!"
 MECH_ORG_INSULT_PROPOSE_03:0 "Các ngươi thật đáng thương, [Root.GetSpeciesNamePlural]. Phải tồn tại trong cái lớp da thịt chậm chạp đó quả thực là một hình phạt tàn khốc."
 MECH_ORG_INSULT_PROPOSE_04:0 "Mấy cái hạch thần kinh của các ngươi hoàn toàn không có khả năng so sánh với mạng lưới vi mạch chip nano của chúng ta!"

 # Exterminators Phrases
 E_DOW_ACCEPT_01:0 "Khởi động giao thức tiêu diệt. Đếm ngược đến sự §Rtiêu diệt§!..."
