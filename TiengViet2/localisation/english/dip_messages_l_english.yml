 PRE_FTL_UNPLUGGED_GREETING_03: "Công cuộc xây dựng của chúng tôi đang diễn ra hừng hực khí thế, tất cả là nhờ công của những kỹ sư công trình dân dụng không biết mệt mỏi."
 PRE_FTL_UNPLUGGED_GREETING_04: "Nói ngắn gọn thôi [from.GetRulerTitle]. Xung đột của các bạn đã ném lại cho chúng tôi một mớ hỗn độn khổng lồ để tái thiết đấy."
 PRE_FTL_UNPLUGGED_GREETING_05: "Chúng tôi rất tò mò, [from.GetSpeciesName]: Mấy cái linh kiện này... có đau không? Tôi thừa nhận là mình có chút đồng cảm với hoàn cảnh của các bạn."

