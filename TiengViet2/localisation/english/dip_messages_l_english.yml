 #HM_ASK_JOIN_F_SELECT:0 "$HM_ASK_JOIN_A_SELECT$"
 #HM_ASK_JOIN_F_PROPOSE:0 "We have found your Federation an elegant community. We would like to bring the [Root.GetName] into it."
