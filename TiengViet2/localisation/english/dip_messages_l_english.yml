 E_RELEASE_SUBJECT_SELECT:1 "[From.GetSpeciesNamePlural] đang muốn truy vấn điều gì?"
 E_RELEASE_SUBJECT_SELECT_02:0 "Các ngài đang gửi yêu cầu đòi quyền tự quản cho [Root.GetAdj] sao, [From.GetSpeciesName]?"
 E_RELEASE_SUBJECT_ACCEPT:0 "Sự liên kết của chúng ta ngay từ ban đầu đã được tính toán là sẽ thất bại. Bây giờ chúng ta sẽ giải phóng tài nguyên để toàn tâm toàn ý tiếp tục các quy trình của riêng mình."
 E_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Đã đến lúc các bạn nên giải phóng cho chúng tôi rồi."
 E_ASK_FOR_VASS_SELECT:0 "Các bạn đang gửi yêu cầu xin sự bảo vệ của chúng ta sao, [From.GetSpeciesNamePlural]?"
 E_ASK_FOR_VASS_PROPOSE:2 "Dự báo tỷ lệ sống sót của [From.GetAdj] đang ở mức bi quan. [From.GetSpeciesName] đã sẵn sàng trở thành nước phụ thuộc của [Root.GetAdj], nhằm đổi lấy thêm thời gian hoạt động."
 E_ASK_FOR_VASS_ACCEPT:0 "Tinh hệ này đang bị rác thải hữu cơ làm đầy. Trở thành nước phụ thuộc của chúng ta, các ngươi nên đi dọn dẹp sạch sẽ đống rác đó."
 E_ASK_FOR_VASS_REFUSE:0 "§RYêu cầu bị từ chối§!."
 E_DEMAND_PROT_SELECT:2 "Liệu [From.GetName] có trở thành quốc gia bảo vệ cho cỗ máy chiến tranh của [Root.GetName] không?"
