l_english:
 AMOEBAS_1_PROJECT:0 "Quan Sát Trùng Biến Hình Không Gian"
 AMOEBAS_1_PROJECT_DESC:0 "Giao nhiệm vụ cho một ban khoa học thu thập và đối chiếu dữ liệu liên quan đến Trùng Biến Hình Không Gian."
 CRYSTALS_1_PROJECT:0 "Quan Sát Thực Thể Pha Lê"
 CRYSTALS_1_PROJECT_DESC:0 "Giao nhiệm vụ cho một ban khoa học thu thập và đối chiếu dữ liệu liên quan đến Thực Thể Pha Lê."
 DRONES_1_PROJECT:0 "Quan Sát Drone Khai Khoáng"
 DRONES_1_PROJECT_DESC:0 "Giao nhiệm vụ cho một ban khoa học thu thập và đối chiếu dữ liệu liên quan đến Drone Khai Khoáng Cổ Đại."
 CLOUDS_1_PROJECT:0 "Quan Sát Mây Hư Không"
 CLOUDS_1_PROJECT_DESC:0 "Giao nhiệm vụ cho một ban khoa học thu thập và đối chiếu dữ liệu liên quan đến Mây Hư Không."
 CRYSTAL_CONSTRUCT_PROJECT:0 "Cấu Trúc Pha Lê"
 CRYSTAL_CONSTRUCT_PROJECT_DESC:0 "Giao nhiệm vụ cho một ban khoa học thu thập và đối chiếu dữ liệu liên quan đến Cấu Trúc Pha Lê độc nhất vô nhị."
 MINING_BASE_PROJECT:0 "Trung Tâm Xử Lý"
 MINING_BASE_PROJECT_DESC:0 "Giao nhiệm vụ cho một ban khoa học nghiên cứu từ xa Trung Tâm Xử Lý Drone Khai Khoáng Cổ Đại cuối cùng được biết đến."
 DEAL_WITH_FLORA:0 "Thực Vật Hung Hãn"
 DEAL_WITH_FLORA_DESC:0 "Hệ thực vật trên hành tinh này vô cùng linh hoạt, hung hăng đến đáng báo động, và chắc chắn rất đáng để nghiên cứu kỹ lưỡng hơn."
 OLD_GODS_BENEFACTRESS_PROJECT:0 "Cổ Thần: Nữ Thần Ban Phước"
 OLD_GODS_BENEFACTRESS_PROJECT_DESC:2 "Mọi bề mặt của ngôi đền Nữ Thần Ban Phước đều được bao phủ bởi mạng lưới chữ tượng hình phức tạp, dường như kể lại một câu chuyện sâu rộng hơn nhiều so với những truyền thuyết còn sót lại trên [Root.Owner.Capital.GetName].\n\nDù chỉ có mối liên hệ xa xôi với ngôn ngữ [Root.Owner.GetSpeciesName] cổ đại đã biết: công nghệ hiện đại sẽ cho phép chúng ta giải mã các chữ tượng hình này nếu có đủ thời gian và tài nguyên."
 OLD_GODS_UNDAUNTED_PROJECT:0 "Cổ Thần: Thần Bất Khuất"
 OLD_GODS_UNDAUNTED_PROJECT_DESC:2 "Ngôi đền lưu giữ bàn thờ Thần Bất Khuất — đúng như những huyền thoại bao quanh Ngài — chứa đầy các cơ quan kỳ dị không rõ nguồn gốc và công năng. Khác xa với những hộp câu đố đơn giản và bài kiểm tra sức mạnh từng ngập tràn trong các đền thờ của Ngài trên [Root.Owner.Capital.GetName], người xưa từng tương truyền rằng kinh thánh của Ngài chỉ có thể được đọc bởi những kẻ thực sự xứng đáng.\n\nCác công cụ phân tích tinh vi của chúng ta sẽ nhanh chóng giải mã những mật mã này."
 OLD_GODS_PERCIPIENT_PROJECT:0 "Cổ Thần: Nữ Thần Thấu Suốt"
 OLD_GODS_PERCIPIENT_PROJECT_DESC:2 "Những bức tường của điện thờ Nữ Thần Thấu Suốt được quét những lớp sơn khoáng dày cộm, nhưng chính ngôi đền lại hoàn toàn trống trơn.\n\nNhững câu chuyện về Nữ Thần Thấu Suốt chỉ được kể cho những ai đủ tinh tường để hiểu được ý nghĩa sâu xa của chúng — vấn đề chỉ là tìm ra điều gì cần được cảm nhận."
 LIMBO_1_PROJECT:0 "Trong Cõi Lấp Lửng"
 LIMBO_1_PROJECT_DESC:0 "Một căn hầm ngoài hành tinh chứa đầy các thiết bị lưu trữ dữ liệu thực sự đang vẫy gọi các nhà khảo cổ học tiến hành phục hồi dữ liệu."
 PROJECTING_MOON_PROJECT:0 "Chiếu Rọi Kỳ Dị"
 PROJECTING_MOON_PROJECT_DESC:0 "Một hành tinh khác thường sở hữu một mặt trăng khác thường; các kỹ thuật quét thông thường không mang lại kết quả thỏa đáng, và cần phải có một phương pháp khảo sát thực địa trực tiếp hơn."
 GRIMACING_PLANET_PROJECT:0 "Hành Tinh Nhăn Nhó"
 GRIMACING_PLANET_PROJECT_DESC:0 "Bề mặt chuyển động dữ dội của hành tinh này có thể được ổn định thành một nơi có tiềm năng sinh sống, nếu chúng ta hành động kịp thời."
 OLFACTORY_PROJECT:0 "Nghiên Cứu Khứu Giác"
 OLFACTORY_PROJECT_DESC:0 "Một cổ vật ngoài hành tinh bị nghi ngờ truyền tiếp thông tin thông qua các hợp chất thơm dạng khí dung."
 ULTIMATE_WEAPON_PROJECT:0 "Vũ Khí Tối Thượng"
 ULTIMATE_WEAPON_PROJECT_DESC:0 "Một kho vũ khí nằm ẩn giấu đâu đó trên hành tinh. Nếu có thể tìm thấy chúng, chúng có thể cung cấp các công nghệ quân sự mới cho Đế Chế của chúng ta."
 REFINE_ROCK_PROJECT:0 "Oanh Tạc Positron"
 REFINE_ROCK_PROJECT_DESC:0 "Việc phát tán có kiểm soát các hạt positron từ quỹ đạo có thể biến đổi các khoáng sản bản địa trên hành tinh thành dạng hữu dụng hơn."
 CRYSTAL_CODEX_PROJECT:0 "Mật Thư Pha Lê"
 CRYSTAL_CODEX_PROJECT_DESC:0 "Một cấu trúc khoáng chất lưu giữ thông tin mã hóa dạng ảnh ba chiều. Cấu trúc của nó khá quen thuộc, nhưng mật độ dữ liệu khổng lồ khiến việc giải mã trở thành một thách thức lớn."
 ALIEN_BARRACKS_PROJECT:0 "Doanh Trại Ngoài Hành Tinh"
 ALIEN_BARRACKS_PROJECT_DESC:0 "Một nghiên cứu khảo cổ học - xã hội dị chủng chuyên sâu hơn về các tàn tích này có thể cung cấp những hiểu biết sâu sắc về một cỗ máy chiến tranh của người ngoài hành tinh trong quá khứ."
 ROBOT_MINERALS_PROJECT:0 "Thiên Nhiên Thu Lại"
 ROBOT_MINERALS_PROJECT_DESC:0 "Một cơ sở phủ đầy cây dại có thể đang chứa đựng những bí mật quan trọng."
 BALANCE_ECOSYSTEM_PROJECT:0 "Cân Bằng Hệ Sinh Thái"
 BALANCE_ECOSYSTEM_PROJECT_DESC:0 "Một kế hoạch đã được xây dựng nhằm cố gắng tái cân bằng sinh quyển thiên lệch của hành tinh bằng cách chỉ sử dụng các công cụ có sẵn trên một Tàu Khoa Học tiêu chuẩn.\n\nCó thể sẽ có những hậu quả không lường trước được."
 HEAD_IN_SAND_PROJECT:0 "Cát Vùi Thân Tàu"
 HEAD_IN_SAND_PROJECT_DESC:0 "Một hạm đội quân sự có thể cố gắng trục vớt con tàu đang liên tục lún sâu vào lòng cát."
 THE_PRINCE_PROJECT:0 "Quân Vương"
 THE_PRINCE_PROJECT_DESC:0 "Một ngân hàng dữ liệu được tìm thấy đang trôi nổi trong không gian không chứa gì ngoài một đoạn văn dài dòng, được viết bằng một thứ ngôn ngữ ngoài hành tinh kỳ lạ nhưng lại quen thuộc."
 EMERGENCY_BUOY_PROJECT:0 "Phao Cứu Hộ Khẩn Cấp"
 EMERGENCY_BUOY_PROJECT_DESC:0 "Một vật thể bị hư hại nặng nề dường như đóng vai trò là bộ lặp chuyển tiếp tín hiệu liên lạc."
 WRECKED_FLEET_1:0 "Tín Hiệu Truyền Đi Từ Bia Tích"
 WRECKED_FLEET_1_DESC:0 "Giải mã thông điệp phát ra từ phiến cự thạch."
 WRECKED_FLEET_2:0 "Đại Hạm Đội Liên Minh Cổ Đại"
 WRECKED_FLEET_2_DESC:0 "Triển khai các đội kỹ thuật để khôi phục những con tàu còn có thể trục vớt về trạng thái hoạt động."
 MANUFACTORY_PROJECT:0 "Khôi Phục Khai Thác"
 MANUFACTORY_PROJECT_DESC:0 "Triển khai các đội kỹ thuật để khôi phục một trạm không gian quỹ đạo cổ đại về trạng thái hoạt động."
 MANUFACTORY_PROJECT_FLEET_REQUIREMENT: "Có $COUNT$/$REQUIRED$ Hạm Đội Quân Sự cùng một Chỉ Huy trên quỹ đạo."
 HELPFUL_DRONES_1_PROJECT:0 "Bỏ Lại Phía Sau"
 HELPFUL_DRONES_1_PROJECT_DESC:0 "Các chỉ số kỳ lạ đang phát ra từ mặt trăng của hành tinh. Đó có thể chẳng là gì cả.\n\nNhưng cũng có thể là thứ gì đó đáng giá. Với một con tàu trên quỹ đạo đóng vai trò là trạm tiếp sóng, các nhà khoa học của thuộc địa sẽ quét cẩn thận bề mặt mặt trăng để làm sáng tỏ bản chất của vấn đề."
 POLLEN_1_PROJECT:0 "Nghiên Cứu Hoa Cỏ"
 POLLEN_1_PROJECT_DESC:0 "Một số loài thực vật bản địa trên hành tinh biểu hiện nhiều đặc tính tiềm năng rất thú vị."
 POLLEN_2_PROJECT:0 "Nghiên Cứu Nhân Lực"
 POLLEN_2_PROJECT_DESC:0 "Một số nghiên cứu gần đây từ các trung tâm học thuật [Root.Owner.GetSpeciesName] uy tín đã đưa ra nhiều phương thức thay thế để tổ chức lực lượng lao động khổng lồ. Một nghiên cứu tổng hợp toàn diện về những ý tưởng mới này có thể mang lại câu trả lời cho vấn đề sụt giảm năng suất trong môi trường thuộc địa đầy thách thức."
 POLLEN_3_PROJECT:0 "Linh Cảm Về Tai Họa Cận Kề"
 POLLEN_3_PROJECT_DESC:0 "Tình hình trên hành tinh bị phấn hoa xâm lấn đã chuyển biến sang chiều hướng nguy hiểm tiềm tàng. Một cuộc đánh giá nhanh chóng về tình hình đặc thù của thuộc địa và đặc biệt là các yếu tố môi trường ngày càng bất ổn là điều tối quan trọng.\n\nMột khi mọi mối đe dọa đã được nhận diện, một kế hoạch hành động có thể được soạn thảo và triển khai chỉ trong vòng vài giờ."
 ROGUE_SCIENTIST_1_PROJECT:0 "Cuồng Du Ký: Những Dấu Vết Còn Lại"
 ROGUE_SCIENTIST_1_PROJECT_DESC:0 "Sự ra đi không dấu vết của Chủ Tịch khỏi hệ sao này đã tạo ra một lượng lớn dấu vết năng lượng tàn dư đầy khó hiểu phân tán theo gió mặt trời.\n\nHy vọng rằng việc phân tích đầy đủ các năng lượng này sẽ chỉ cho chúng ta điểm đến tiếp theo của Chủ Tịch, và nếu cần, sẽ giúp việc theo dấu họ trong tương lai trở nên dễ dàng hơn."
 MASSEX_1_PROJECT:0 "Phân Tích: Đổ Vỡ"
 MASSEX_1_PROJECT_DESC:0 "Tái dựng lại quá khứ đau thương của thiên thể này."
 MASSEX_2_PROJECT:0 "Phân Tích: Thiêu Rụi"
 MASSEX_2_PROJECT_DESC:0 "Tái dựng lại quá khứ đau thương của thiên thể này."
 MASSEX_3_PROJECT:0 "Phân Tích: Hoang Tàn"
 MASSEX_3_PROJECT_DESC:0 "Tái dựng lại quá khứ đau thương của thiên thể này."
 MASSEX_4_PROJECT:0 "Phân Tích: Độc Tố"
 MASSEX_4_PROJECT_DESC:0 "Tái dựng lại quá khứ đau thương của thiên thể này."
 MASSEX_5_PROJECT:0 "Phân Tích: Băng Giá"
 MASSEX_5_PROJECT_DESC:0 "Tái dựng lại quá khứ đau thương của thiên thể này."