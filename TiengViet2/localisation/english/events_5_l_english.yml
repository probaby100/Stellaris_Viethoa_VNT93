 sol_system_void_dweller_system_NAME:0 "Kẻ Trú Ngụ Hư Không (Sol)"
 sol_system_void_dweller_system_DESC:0 "Hệ sao khởi đầu tùy chọn cho loài Người khi chọn Nguồn Gốc Kẻ Trú Ngụ Hư Không."
 anomaly.186.name:0 "Lằn ranh Sinh tử"
 anomaly.186.desc.v1:0 "Hóa ra hầm trú ẩn này là một lăng mộ khổng lồ của một chủng tộc từng khao khát sự bất tử.\n\nSĩ quan khoa học [Root.GetLeaderName] xác định rằng các khối dữ liệu mã tam phân khổng lồ trong những chiếc rương này thực chất là các bản chiếu mạng thần kinh và dữ liệu quét não bộ. Rõ ràng, chủng tộc ngoại lai trên [From.From.GetName] tin rằng đây là cách duy nhất để họ sống sót trước khi hành tinh bị hủy diệt. Dù không thể tự cứu mình, họ vẫn nuôi hy vọng một ngày nào đó, một chủng tộc khác sẽ dùng dữ liệu này để hồi sinh họ."
 anomaly.186.desc.v2:1 "Hóa ra hầm trú ẩn này là một lăng mộ khổng lồ của một chủng tộc từng khao khát sự bất tử.\n\nNhững khối mã tam phân khổng lồ trong cơ sở dữ liệu thực chất là các bản chiếu mạng thần kinh và dữ liệu quét não bộ. Rõ ràng, chủng tộc ngoại lai trên [From.From.GetName] tin rằng đây là cách duy nhất để họ sống sót trước khi hành tinh bị hủy diệt. Dù không có công nghệ để tự hồi sinh, họ vẫn ôm hy vọng mong manh rằng một nền văn minh khác sẽ giúp họ làm điều đó.\n\nVới công nghệ người máy hiện có, chúng ta có thể tải các dữ liệu quét não này vào các vỏ bọc robot. Tuy nhiên, vẫn chưa rõ liệu độ tinh vi của robot chúng ta có đủ để chứa đựng những trí tuệ cấp cao như vậy hay không."
 anomaly.186.desc.v3:0 "Hóa ra hầm trú ẩn này là một lăng mộ khổng lồ của một chủng tộc từng khao khát sự bất tử.\n\nNhững khối mã tam phân khổng lồ trong cơ sở dữ liệu thực chất là các bản chiếu mạng thần kinh và dữ liệu quét não bộ. Rõ ràng, chủng tộc ngoại lai trên [From.From.GetName] tin rằng đây là cách duy nhất để họ sống sót trước khi hành tinh bị hủy diệt. Dù không có công nghệ để tự hồi sinh, họ vẫn ôm hy vọng mong manh rằng một nền văn minh khác sẽ giúp họ làm điều đó.\n\nNhờ công nghệ người máy cực kỳ phát triển, các nhà nghiên cứu tin chắc rằng robot của chúng ta đủ tinh vi để làm vật chứa cho những trí tuệ cấp cao này."
 anomaly.186.desc.v4: "Hóa ra hầm trú ẩn này là một lăng mộ khổng lồ của một chủng tộc từng khao khát sự bất tử.\n\nCác cơ sở dữ liệu này chứa đầy những đoạn mã tam phân dài dằng dặc, lưu trữ các đơn vị xử lý trung tâm sinh học của họ. Chủng tộc ngoại lai trên [From.From.GetName] dường như tin rằng đây là cách duy nhất để tồn tại. Dù không thể tự cứu mình, họ vẫn hy vọng một chủng tộc khác có thể làm được điều đó.\n\nChúng ta có thể chuyển dữ liệu quét thần kinh này vào các thân xác robot, nhưng kết quả của một thí nghiệm như vậy là rất khó lường."
 anomaly.186.a:0 "Đừng làm phiền người đã khuất."
 anomaly.186.a.alt.tooltip:0 "Xóa các bản chiếu mạng thần kinh khỏi cơ sở dữ liệu của [Root.Capital.GetName]."
 anomaly.186.b:1 "Tải các mô thức thần kinh vào cơ sở dữ liệu của chúng ta."
 anomaly.186.b.tooltip:0 "Lưu giữ các mô thức thần kinh trong cơ sở dữ liệu."
 anomaly.186.c:1 "Tải lên các mô thức thần kinh."
 anomaly.186.d:0 "Dù vậy, hãy cứ tải các mô thức thần kinh của họ xuống."
 anomaly.186.e: "Tải các mô thức thần kinh của họ vào $building_identity_repository$."
 anomaly.186.e.tt: "§Y500§! nhân cách mới sẽ được thêm vào §Y$building_identity_repository$§!."
 anomaly.187.name:0 "Lằn ranh Sinh tử: Khởi đầu Mới"
 anomaly.187.desc:0 "Sau vô số nỗ lực thất bại, các nhà nghiên cứu của chúng ta cuối cùng đã thành công trong việc tải các bản quét thần kinh ngoại lai còn lại vào một nhóm robot. Cho đến nay, những thực thể cổ đại này vẫn chưa cho thấy nhận thức nào vượt quá một robot thông thường, khiến công chúng bắt đầu nghi ngờ liệu đây có phải là một trò lừa bịp.\n\nTuy nhiên, bộ phận kỹ thuật vẫn rất hào hứng và đề xuất chúng ta đưa những người ngoại lai này vào xã hội."
 anomaly.187.a: "Chào mừng họ đến định cư trên hành tinh của chúng ta."
 anomaly.187.b:0 "Tốt hơn là nên đường ai nấy đi."
 anomaly.187.a.tooltip:0 "Đặt một đơn vị dân cư robot ngoại lai lên [bot_planet.GetName]."
 anomaly.188.name:0 "Lằn ranh Sinh tử: Bài học Rút ra"
 anomaly.188.desc:0 "Sau nỗ lực cuối cùng nhằm tải dữ liệu quét thần kinh ngoại lai vào cơ thể robot thất bại, bộ phận kỹ thuật đành phải chấp nhận bỏ cuộc. Trong quá trình này, các bản quét đã bị hủy hoại hoàn toàn — nhiều nhà khoa học thầm nghĩ rằng đây có lẽ là kết cục tốt nhất. Suy cho cùng, việc phải dành phần đời còn lại trong một thân xác robot là một định mệnh nghiệt ngã đối với những sinh vật có trí tuệ cao."
 anomaly.189.name:0 "Lằn ranh Sinh tử: Khởi đầu Mới"
 anomaly.189.desc:0 "Sau nhiều lần thử nghiệm và thất bại, bộ phận kỹ thuật cuối cùng đã tải được dữ liệu quét thần kinh của chủng tộc ngoại lai đã tuyệt chủng vào các robot, và kết quả thật đáng kinh ngạc. Những người cổ đại đã khôi phục hoàn toàn ý thức và bày tỏ nguyện vọng gia nhập đế chế chúng ta, họ mong muốn định cư trên một hành tinh mới trong lãnh thổ của chúng ta."
 anomaly.189.a:0 "Đó là vinh dự của chúng ta."
 anomaly.189.b:0 "Tốt hơn là nên đường ai nấy đi."
 anomaly.189.b.tooltip:0 "Những người ngoại lai sẽ đi nơi khác để tìm nhà mới."
 anomaly.189.c:0 "Tháo dỡ chúng."
 anomaly.189.a.tooltip:0 "Người ngoại lai gia nhập đế chế chúng ta và định cư tại [new_colony.GetName]."
 anomaly.1190.name:0 "Lằn ranh Sinh tử: Linh hồn trong Đường dây"
 anomaly.1190.desc:0 "Bộ phận kỹ thuật vừa mang về một tin tức đáng lo ngại. Vào ngày cuối cùng của dự án \"Lằn ranh Sinh tử\", nỗ lực tải dữ liệu quét thần kinh của các nhà khoa học dường như vẫn thất bại, nhưng khi họ quay lại vào sáng hôm sau, tất cả các robot đã biến mất.\n\nMột số người đoán rằng thí nghiệm thực chất đã thành công và những người ngoại lai đã trốn thoát trong đêm, trong khi số khác cho rằng đây là một trò lừa đảo được dàn dựng tinh vi. Có vẻ chúng ta sẽ không bao giờ biết được sự thật..."
 anomaly.1190.a:0 "Đáng kinh ngạc."
 anomaly.1192.name:0 "Lằn ranh Sinh tử: Tiến bộ Công nghệ"
 anomaly.1192.desc:0 "Với những tiến bộ vượt bậc gần đây trong lĩnh vực người máy, các nhà nghiên cứu tin rằng chúng ta đã có đủ khả năng để nạp các bản quét thần kinh cổ đại từ kho lưu trữ ngoại lai vào robot để thay thế cho trí tuệ nhân tạo.\n\nTuy nhiên, vẫn còn nghi vấn liệu độ tinh vi của robot có đủ để gánh vác một trí tuệ cấp cao hơn hay không."
 anomaly.1192.a:0 "Đáng để thử đấy."
 anomaly.1192.b:0 "Chúng ta không nên mạo hiểm."
 anomaly.1192.alt.tooltip:0 "Giữ lại dữ liệu quét thần kinh trong cơ sở dữ liệu của [Root.Capital.GetName]."
 anomaly.1194.name:0 "Lằn ranh Sinh tử: Tiến bộ Công nghệ"
 anomaly.1194.desc:0 "Với những tiến bộ vượt bậc gần đây trong lĩnh vực người máy, các nhà khoa học trên [Root.Capital.GetName] tin rằng chúng ta hoàn toàn có thể chế tạo những cơ thể tổng hợp đủ tinh vi để chứa đựng ý thức thần kinh cấp cao. Chúng ta có thể tải các bản quét thần kinh thu hồi từ kho lưu trữ ngoại lai trước đây vào robot và hồi sinh chủng tộc này."
 anomaly.1194.a:0 "Đáng để thử đấy."
 anomaly.1195.name:0 "Lằn ranh Sinh tử: Rời đi"
 anomaly.1195.desc:0 "Những người ngoại lai đó, sau khi được chúng ta chuyển mô thức thần kinh vào thân xác robot, đã rời bỏ đế chế. Họ tập hợp trên một nhóm nhỏ tàu dân sự vào một buổi sớm và thiết lập lộ trình đến một hệ sao xa xôi. Cho đến nay, chúng ta vẫn chưa nhận được tin tức gì từ họ, và có lẽ chúng ta sẽ mãi mãi không biết liệu họ có đến được đích hay không."
 anomaly.1196.name:0 "Lằn ranh Sinh tử: Những Kẻ Thức tỉnh"
 anomaly.1196.desc:0 "Các báo cáo cho biết những người ngoại lai mà chúng ta đã tải ý thức vào các thân xác robot đã chiếm lĩnh thành công một hành tinh, giờ đây họ tự xưng là \"Những Kẻ Thức Tỉnh\"."
 anomaly.1198.name:0 "Lằn ranh Sinh tử: Khởi đầu Mới"
 anomaly.1198.desc:0 "Sau nhiều nỗ lực, bộ phận kỹ thuật cuối cùng đã tải được dữ liệu quét thần kinh của chủng tộc ngoại lai đã tuyệt chủng vào các robot, và kết quả thật đáng kinh ngạc. Những người cổ đại đã khôi phục hoàn toàn ý thức và bày tỏ nguyện vọng gia nhập đế chế chúng ta, mong muốn chúng ta cho phép họ định cư trên một hành tinh mới trong lãnh thổ của mình."
 anomaly.1198.a:0 "Tốt hơn là nên đường ai nấy đi."
 anomaly.1198.tooltip:0 "Người ngoại lai gia nhập đế chế chúng ta và định cư tại [potential_target.GetName]."
 anomaly.1199.name:0 "Lằn ranh Sinh tử: Thức tỉnh"
 anomaly.1199.desc:0 "Sau nhiều nỗ lực, bộ phận kỹ thuật cuối cùng đã tải được dữ liệu quét thần kinh của chủng tộc ngoại lai đã tuyệt chủng vào các robot, và kết quả thật đáng kinh ngạc. Những người cổ đại đã khôi phục hoàn toàn ý thức và bày tỏ ý định tái thiết đế chế của riêng họ."
 anomaly.1199.a:0 "Chúng ta sẽ không ngăn cản."

 anomaly.1200.desc: "Sau nhiều nỗ lực, các kỹ sư của chúng ta cuối cùng đã tải kết quả quét thần kinh của chủng tộc ngoại lai đã tuyệt chủng vào các người máy, đem lại kết quả vô cùng bất ngờ. Chủng tộc cổ đại này đã hoàn toàn khôi phục ý thức và bày tỏ nguyện vọng muốn tái thiết đế chế của mình. Mạng lưới trạm tiếp vận của chúng ta đã đánh dấu một hành tinh có thể dùng làm quê hương mới cho họ."
 anomaly.1200.a: "Hãy hướng dẫn họ đến một thế giới gần các Trạm Tiếp Vận của chúng ta."

 #action.7000.name: "Robotic Workforce Operational"
 #action.7000.1: "Noted."
#
 #action.7000.desc_colle: "Engineers from [Root.Planet.GetName] report that our first robotic #workforce is finally operational and tending to its assignment with unparalleled efficiency, #setting an example to local workers, who are now eager to be reallocated to more suitable tasks."
 #action.7000.desc_indiv: "$action.7000.desc_intro$ Reactions among the locals have been enthusiastic #as workers hope the use of robotic labor  will free up their schedules to focus on what's truly #important in life - individual pursuits and personal growth."
 #action.7000.desc_phobe: "$action.7000.desc_intro$ Though suspicious at first, the locals seem to be #in agreement that robots are preferable to aliens, and have expressed hope that this initiative #will quell any potential need for alien labor."
 #action.7000.desc_phile: "$action.7000.desc_intro$ Curious locals have amassed to the site to #welcome the newcomers and have been sighted attempting to interact with the AI. So far the robots #have been unresponsive, focusing on their assignments."
 #action.7000.desc_milit: "$action.7000.desc_intro$ Locals are celebrating the triumphant occasion #with a parade, confident that robotic labor will help strengthen our empire."
 #action.7000.desc_pacif: "$action.7000.desc_intro$ Reactions from the community have been cautiously #optimistic, with some expressing concern that we use the technology responsibly and for a worthy #cause."
 #action.7000.desc_mater: "$action.7000.desc_intro$ [Empire] visionaries speak of a robotic #revolution and [planet] has become the envy of the  empire as our citizens dream of a future #where manual labor is but a distant memory."
 #action.7000.desc_spiri: "$action.7000.desc_intro$ Sadly the local population has reacted with #skepticism and suspicion, and community leaders have spoken out against the initiative, calling #it an insult to everything they stand for."
 #action.7000.desc_fcolle: "Engineers from [Root.Planet.GetName] report that our first robotic #workforce is finally operational and tending to its assignment with unparalleled efficiency, #setting an example to local workers, who are now eager to be reallocated to more suitable tasks."
 #action.7000.desc_findiv: "$action.7000.desc_intro$ Reactions among the locals have been #enthusiastic as workers hope the use of robotic labor will free up their schedules to focus on #what's truly important in life - individual pursuits and personal growth."
 #action.7000.desc_fphobe: "$action.7000.desc_intro$ Though suspicious at first, the locals seem to #be in agreement that robots, though not ideal, are preferable to aliens, and have expressed hope #that this initiative will quell any potential need for alien labor."
 #action.7000.desc_fphile: "$action.7000.desc_intro$ Curious locals have amassed to the site to #welcome the newcomers and have been sighted attempting to interact with the AI. So far the robots #have been unresponsive, focusing on their assignments."
 #action.7000.desc_fmilit: "$action.7000.desc_intro$ Locals are celebrating the triumphant occasion #with a parade, confident that robotic labor will help strengthen our empire."
 #action.7000.desc_fpacif: "$action.7000.desc_intro$ Reactions from the community have been #cautiously optimistic, with some expressing concern that we use the technology responsibly and #for a worthy cause."
 #action.7000.desc_fmater: "$action.7000.desc_intro$[Empire] visionaries speak of a robotic #revolution and [planet] has become the envy of the  empire as our citizens dream of a future #where manual labor is but a distant memory."
 #action.7000.desc_fspiri: "$action.7000.desc_intro$ Sadly the local population has reacted with #skepticism and suspicion and community leaders have spoken out against the initiative, calling it #an insult to everything they stand for."
 #action.7000.desc_intro: "Engineers from [Root.Planet.GetName] report that our first robotic #workforce is now online and ready for action."
