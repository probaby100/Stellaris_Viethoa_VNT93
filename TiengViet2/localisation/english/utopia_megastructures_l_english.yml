l_english:

 utopia.1.name:0 "Đưa ra yêu cầu với [ringworld_builder.GetName]"
 utopia.1.desc.v1:0 "Một số cơ quan tình báo của chúng ta đã phát hiện ra các tài liệu chỉ ra rằng thế giới vành đai của [ringworld_builder.GetName] có thể là bệ phóng bí mật cho vũ khí hủy diệt hàng loạt. Dù tính xác thực của các tài liệu này chưa được kiểm chứng, nhưng nhận định này đã bám rễ trong nước, và công chúng đang đòi hỏi chúng ta phải hành động. Chắc chắn là nếu [ringworld_builder.GetName] không có gì để giấu, họ sẽ cho phép các chuyên gia vũ khí của chúng ta kiểm tra nền tảng này."
 utopia.1.desc.v2:0 "Kể từ khi [ringworld_builder.GetName] bắt đầu xây dựng thế giới vành đai, vài kỹ sư trưởng của chúng ta đã luôn theo dõi dự án này từ xa và cực kỳ ấn tượng với tiến độ của họ. Các kỹ sư tin rằng chúng ta có thể học hỏi được nhiều kiến thức từ công nghệ xây dựng của họ nếu được quan sát cận cảnh tại hiện trường, và đề xuất chúng ta gửi yêu cầu đến quốc gia đang xây dựng, cử một nhóm nghiên cứu đến đóng quân tại địa điểm thi công."
 utopia.1.desc.v4:0 "Các nhà tiên tri trên toàn đế chế đang bị hành hạ bởi những viễn cảnh đáng sợ về cái chết và sự hủy diệt, gắn liền với sự xuất hiện của một vật thể hình vòng khổng lồ trên bầu trời. Xâu chuỗi những sự kiện này lại, các nhà lãnh đạo tôn giáo của chúng ta lo sợ rằng tham vọng xây dựng thế giới vành đai của [ringworld_builder.GetName] đã chọc giận các vị thần, và đề xuất cử một phái đoàn đến phong thánh cho dự án này trước khi quá muộn."
 utopia.1.a:0 "Trình bày yêu cầu của chúng ta cho [ringworld_builder.GetName]."
 utopia.1.b:0 "Không có gì để bàn cãi."
 utopia.1.b.tooltip.phobe:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_xenophobe$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip.phile:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_xenophile$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip.mater:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_materialist$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip.spiri:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_spiritualist$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip.autho:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_authoritarian$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip.egali:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_egalitarian$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip.milit:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_militarist$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip.pacif:0 "Thêm bổ trợ §Y$megastructure_demands_rejected$§! cho dân số £pop£§H$ethic_pacifist$§!:\n$utopia.1.b.tooltip$"
 utopia.1.b.tooltip:2 "£happiness£ Mức độ hạnh phúc §R-20%§!"
 utopia.2.name:0 "Yêu cầu từ [From.From.GetName]"
 utopia.2.a:0 "Chấp nhận yêu cầu."
 utopia.2.a.tooltip:0 "Điều này sẽ làm hài lòng [From.From.GetName]."
 utopia.2.b:0 "Từ chối yêu cầu."
 utopia.2.b.tooltip:0 "Điều này sẽ khiến [From.From.GetName] bất mãn."
 utopia.2.c:0 "Đó sẽ là vinh hạnh của chúng tôi."
 utopia.2.desc.v1:0 "[From.From.GetName] tuyên bố họ nắm được tình báo bí mật về việc chúng ta đang xây dựng bệ phóng bí mật cho vũ khí hủy diệt hàng loạt trên thế giới vành đai, và yêu cầu chúng ta cho phép thanh tra công trường xây dựng.\n\nCác cố vấn quân sự của chúng ta chưa xác nhận được đây là sự nhầm lẫn vô ý hay lời vu khống ác ý, nhưng dù thế nào chúng ta cũng phải xử lý tình huống này một cách thận trọng."
 utopia.2.desc.v2:1 "Các [From.From.GetEngineerPlural] của [From.From.GetName] vẫn luôn theo dõi tiến độ xây dựng thế giới vành đai của chúng ta từ xa và cực kỳ ấn tượng với những tiến triển chúng ta đạt được. Họ xin phép đóng quân một đội [From.From.GetEngineerPlural] tại hiện trường để học hỏi kỹ thuật công trình của chúng ta."
 utopia.2.desc.v4:0 "Các nhà tiên tri từ [From.From.GetName] đang bị hành hạ bởi những viễn cảnh đáng sợ về cái chết và sự hủy diệt, gắn liền với sự xuất hiện của vật thể hình vòng khổng lồ trên bầu trời. Họ lo ngại việc chúng ta xây dựng thế giới vành đai mà không có sự cho phép của thần linh sẽ chọc giận các ngài, và đã xin phép chúng ta được phong thánh cho thế giới vành đai trước khi quá trình xây dựng hoàn tất."
 utopia.3.name:0 "Yêu cầu được chấp nhận"
 utopia.3.desc.v1:0 "Để thể hiện thiện chí, [From.GetName] đã đồng ý cho chúng ta phái các chuyên gia vũ khí đến tìm kiếm bệ phóng bí mật được giấu trên thế giới vành đai của họ. Một nhóm các chuyên gia vũ khí xuất sắc nhất đã được lựa chọn kỹ lưỡng và lên đường, sự thật sẽ sớm được phơi bày."
 utopia.3.desc.v2:0 "Thật đáng phấn khởi cho cộng đồng khoa học của chúng ta, chúng ta nhận được thông báo từ [From.GetName] rằng họ rất vinh hạnh được đón tiếp nhóm nghiên cứu của chúng ta trên thế giới vành đai đang xây dựng của họ. Kỹ sư trưởng của chúng ta đã tập hợp một nhóm kỹ sư giỏi nhất nhanh chóng lên đường đến thế giới vành đai để báo cáo về tiến độ xây dựng."
 utopia.3.desc.v4:0 "[From.GetName] đã gửi lời chào nồng nhiệt đến chuyến viếng thăm cấp cao của chúng ta, cam kết tạm dừng thi công thế giới vành đai cho đến khi các nhà lãnh đạo tôn giáo của chúng ta cảm thấy hài lòng và xác nhận thế giới vành đai không đi ngược lại ý muốn của thần linh.\n\nMột số giáo sĩ được tuyển chọn kỹ lưỡng đã lập tức khởi hành đến hiện trường để đảm bảo những lời tiên tri tàn khốc sẽ không bao giờ trở thành sự thật."
 utopia.3.a:0 "Tuyệt vời."
 utopia.4.name:0 "Yêu cầu bị từ chối"
 utopia.4.desc:0 "Thật không may, [From.GetName] đã không đồng ý với đề xuất của chúng ta, động thái này đã làm xấu đi mối quan hệ giữa hai đế chế."
 utopia.4.a:0 "Thật đáng tiếc."
 utopia.5.name:0 "Nhiệm vụ hoàn thành"
 utopia.5.desc.v1:0 "Các chuyên gia được cử đi kiểm tra thế giới vành đai của [From.GetSpeciesName] đã lật tung cả công trường để tìm kiếm bệ phóng bí mật, nhưng không hề tìm thấy bất cứ thứ gì chứng minh cho cáo buộc của chúng ta. Chúng ta đành phải kết luận rằng cơ quan tình báo của mình có lỗ hổng, lần sau cần phải kiểm tra kỹ càng hơn các nguồn tin của mình."
 utopia.5.desc.v2:0 "Các nhà nghiên cứu được chúng ta cử đến thế giới vành đai của [From.GetSpeciesName] đã mang về nhiều kiến thức mới trong lĩnh vực kỹ thuật. Tuy ban đầu hai bên có chút hiểu lầm do khác biệt văn hóa, nhưng cả hai đều rất hài lòng với việc trao đổi tri thức và đã học hỏi được rất nhiều từ đối phương."
 utopia.5.desc.v4:0 "Các giáo sĩ được chúng ta cử đi phong thánh cho thế giới vành đai của [From.GetName] đã trở về sau nhiệm vụ, mang theo nhiều câu hỏi hơn là câu trả lời. Sau khi thiền định trên công trường, họ đã tiến vào trạng thái thông linh sâu và phát hiện ra thế giới vành đai hoàn toàn không phải là ngọn nguồn của những viễn cảnh đáng sợ đó. Dù không thể giải mã được ý nghĩa thực sự của những viễn cảnh, nhưng họ vẫn trấn an chúng ta rằng: \"Những chuyện có thể xảy ra, cũng có thể sẽ chẳng bao giờ xảy ra...\""
 utopia.5.b:0 "Tuyệt vời."
 utopia.6.name:0 "Yêu cầu về Thế Giới Vành Đai: Kết luận"
 utopia.6.desc.v1:0 "Sau khi lục tung gần như toàn bộ công trường xây dựng, các chuyên gia vũ khí đến từ [From.From.GetName] rốt cuộc cũng đành phải thừa nhận rằng thế giới vành đai của chúng ta hoàn toàn không có cái gọi là bệ phóng vũ khí bí mật. Chúng ta đã hỗ trợ hết mình rồi, chỉ cần họ chịu tin là được..."
 utopia.6.desc.v2:0 "Sau vài tuần lưu lại trên thế giới vành đai, các kỹ sư đến từ [From.From.GetName] nay đã rời đi. Dù có sự khác biệt về văn hóa, nhưng cả hai bên đều cảm thấy hài lòng với việc trao đổi tri thức và đã học hỏi được rất nhiều từ đối phương."
 utopia.6.desc.v4:0 "Trong lúc thiền định trên công trường xây dựng, các nhà lãnh đạo tôn giáo từ [From.From.GetName] tuyên bố họ đã tiến vào trạng thái thông linh sâu, qua đó họ phát hiện ra thế giới vành đai hoàn toàn không phải là nguyên nhân của những viễn cảnh chẳng lành, dù không muốn đưa ra lời giải thích cuối cùng cho ý nghĩa thực sự của những viễn cảnh đó, nhưng họ đã để lại những lời trấn an: \"Chuyện có thể làm, cũng có thể không làm...\"\n\nTạ ơn trời đất, công việc xây dựng cuối cùng cũng có thể tiếp tục."
 utopia.21.name:0 "Điều kiện thuận lợi"
 utopia.21.desc:0 "Dưới sự dẫn dắt xuất sắc của người quản lý thi công thế giới vành đai, chúng ta đã tối ưu hóa được quy trình xây dựng, giúp đẩy nhanh tiến độ đáng kể."
 utopia.22.name:0 "Mỏ quặng"
 utopia.22.desc:0 "Đội ngũ xây dựng thế giới vành đai của chúng ta đã phát hiện ra một dải mỏ quặng lớn nằm kẹt trong lớp đá cực cứng, và mỏ quặng này sẽ bị phá nát trong quá trình thi công. Dù rất dễ bị vỡ, nhưng các mẫu vật cho thấy mỏ quặng này rất đáng để chúng ta tạm dừng thi công thế giới vành đai để khai thác."
 utopia.22.a:0 "Khai thác mỏ quặng."
 utopia.22.b:0 "Chúng ta không thể làm chậm trễ tiến độ xây dựng."
 utopia.27.name:0 "Công nhân mất tích"
 utopia.27.desc:0 "Kể từ khi công việc xây dựng thế giới vành đai bắt đầu, một nhóm nhỏ công nhân đã mất tích. Có vẻ như họ đã tự ý lên một trong vô số những con tàu vận tải và rời đi mà không báo cáo với cấp trên, chúng ta đang tiến hành điều tra để tìm ra tung tích của họ. Đáng buồn là việc họ tự ý rời đi đã làm chậm tiến độ xây dựng một cách rõ rệt."
 utopia.27.a:0 "Thật không may."
 utopia.28.name:0 "Công nhân mất tích"
 utopia.28.desc:0 "Với sự xuất hiện của những công nhân thay thế, công việc xây dựng thế giới vành đai rốt cuộc cũng đã đi vào quỹ đạo. Đáng tiếc là chúng ta vẫn chưa tìm thấy những người mất tích, gia đình của họ đã được thông báo."
 utopia.28.a:0 "Chúng ta luôn hướng về họ."
 utopia.23.name:0 "Thú cưng trên Thế Giới Vành Đai"
 utopia.23.desc:0 "Có vẻ như một trong những hành tinh chúng ta dùng để xây dựng thế giới vành đai không hề cằn cỗi như chúng ta tưởng tượng ban đầu. Một loài sinh vật có vẻ vô hại nhưng trước đây chưa từng được biết tới —— những con sâu không gian khổng lồ được gọi yêu là \"Co Co\" —— đã vô tình được chúng ta mang tới thế giới vành đai cùng với những mảnh vỡ từ hành tinh mẹ của chúng.\n\nNhờ bộ lông mềm mại và bản tính hiền lành, những sinh vật dễ thương này nhanh chóng trở thành con cưng của các công nhân, xét cho cùng thì họ phải sống xa gia đình và chịu cảnh cô đơn đằng đẵng ở đây, đặc biệt là vào thời điểm có công nhân mất tích như hiện nay.\n\nChúng ta có thể để cho những sinh vật này tiếp tục sống yên bình ở đây, hoặc thanh tẩy chúng, điều này sẽ làm chậm đáng kể tiến độ xây dựng."
#utopia.23.desc.v2: "One of the planets used to construct the ring world was not as uninhabited as we first thought. A seemingly harmless species of worm lives on the ring world. We could halt construction to remove them or allow them to continue their lives in peace. Our xenophile pops want to spare them."
 utopia.23.a:0 "Tiêu diệt chúng."
 utopia.23.b:0 "Tốt nhất là đừng quấy rầy chúng."
 utopia.25.name:0 "Phát hiện chấn động"
 utopia.25.desc:0 "Nằm ngoài dự đoán của tất cả mọi người, thế giới vành đai đã chứng kiến một màn bùng nổ màu sắc rực rỡ, hàng nghìn con sâu —— hay đúng hơn là ấu trùng, theo như hình dạng hiện tại của chúng —— đã lột xác thành những con bướm. Có vẻ như sự thay đổi này là do bầu khí quyển mới được hình thành tạo ra.\n\nNhưng niềm vui ngắn chẳng tày gang. Chúng ta đã phát hiện ra một mạng lưới đường hầm dưới lòng đất, và ở đó chúng ta thấy bọn \"Co Co\" đang đánh chén thi thể của những công nhân mất tích.\n\nCho đến khi đám sinh vật này bị tuyệt diệt, công việc xây dựng sẽ phải tạm dừng, nhưng chúng tôi dự tính quá trình thanh trừng sẽ diễn ra rất nhanh, bởi cơn thịnh nộ của các công nhân đang lên tới đỉnh điểm khi bản chất thật của \"Co Co\" bị phơi bày."
 utopia.25.a:0 "Ơn trời."
 utopia.26.name:0 "Phát hiện chấn động"
 utopia.26.desc:0 "Đội thanh trừng chịu trách nhiệm tiêu diệt lũ sâu không gian khổng lồ \"Co Co\" đã vấp phải sự cản trở bạo lực từ các công nhân xây dựng.\n\nMột thanh niên liều mạng cố gắng giấu con thú cưng của mình đi. Anh ta chạy đến một nơi đủ xa công trường và rơi xuống một mạng lưới đường hầm dưới lòng đất mới được đào, tại đó anh ta bắt gặp vài con \"Co Co\" đang đánh chén thi thể của những người thợ mất tích. Con thú cưng của anh ta cố phun dịch tiêu hóa vào anh ta, nhưng may mắn là anh ta đã thoát chết. Anh ta lập tức báo cho đội thanh trừng, và đội quân đã nhanh chóng tiêu diệt sạch lũ sâu ăn thịt này.\n\nBản chất thật của \"Co Co\" cuối cùng cũng bị phơi bày."
 utopia.26.a:0 "Một diễn biến thật tồi tệ."
 utopia.30.name:0 "Kẻ lang thang Độc nhãn"
 utopia.30.desc.v1:0 "Đế chế của chúng ta vô cùng bàng hoàng khi phát hiện [dysonsphere_builder.GetName] đang xây dựng một Quả Cầu Dyson bao quanh [dyson_system.GetName], ngôi sao trung tâm của chòm sao mà chúng ta yêu quý nhất —— Kẻ lang thang Độc nhãn, và Quả Cầu Dyson sẽ che khuất hoàn toàn ánh sáng của nó.\n\nKẻ lang thang Độc nhãn, bằng con mắt độc nhất của mình, đã dõi theo chúng ta từ thuở hồng hoang của nền văn minh, truyền thuyết về nó không chỉ dẫn lối cho hạm đội của chúng ta, mà còn cho cả những vì sao bơi lội trên bầu trời. Vậy mà giờ đây, [dysonsphere_builder.GetName], với sự kiêu ngạo nông cạn của họ, lại muốn dùng một Quả Cầu Dyson để che khuất nó, làm mù nó.\n\nDù phải mất nhiều năm nữa chúng ta mới có thể cảm nhận được sự thay đổi này tại quê nhà, nhưng nhân dân của chúng ta vẫn cảm thấy vô cùng chấn động khi biết rằng nó sẽ không thể tiếp tục dõi theo các thế hệ tương lai của chúng ta."
 utopia.30.a:0 "Chúng ta xứng đáng nhận được một lời xin lỗi chính thức."
 utopia.30.b:0 "Khoản bồi thường 1000 Năng lượng sẽ xoa dịu nỗi đau của chúng ta."
 utopia.30.c:0 "Đừng làm kinh động bằng hữu."
 utopia.31.name:0 "Kẻ lang thang Độc nhãn"
#utopia.31.desc: "We have received a complaint from our neighbors, the [dyson_sphere_neighbor.GetName], that our Dyson Sphere is blocking the light of a central star in one of their most beloved constellations, the One-eyed Wanderer.\n\nThey claim the Wanderer, with her single eye, has watched over their kind since the beginning of time. She guides not only their fleets, but the stars themselves in their journey across the sky, and in a stroke of bad luck we have built our Dyson Spherearound her eye, blinding her.\n\nThough it will take many years before they can tell the difference from their homeworld, the notion that she won't be watching over future generations has shaken the empire. They ask that we make a formal apology to their people, who see this as a horrible slight."
 utopia.31.intro:0 "Chúng tôi phát hiện đế chế của các người đang xây dựng Quả Cầu Dyson bao quanh ngôi sao trung tâm của chòm sao mà chúng tôi yêu quý nhất —— Kẻ lang thang Độc nhãn.\n\nKẻ lang thang Độc nhãn đã dùng con mắt độc nhất của nó để dõi theo chúng tôi từ thuở bình minh của nền văn minh, nó không chỉ dẫn đường cho hạm đội của chúng tôi, mà còn cho cả những vì sao ngao du trên bầu trời, vậy mà giờ các người lại muốn xây một Quả Cầu Dyson che lấp con mắt của nó, làm mù nó."
 utopia.31.desc:0 "$utopia.31.intro$\n\nDù phải đợi nhiều năm nữa chúng tôi mới cảm nhận được sự thay đổi trên hành tinh mẹ, nhưng tin tức về việc nó không thể tiếp tục dõi theo các thế hệ mai sau đã làm chấn động nhân dân chúng tôi, và giờ đây họ yêu cầu một lời xin lỗi chính thức."
 utopia.31.a:0 "Đưa ra lời xin lỗi chính thức."
 utopia.31.b:0 "Chia sẻ cho họ chút Năng lượng của chúng ta."
 utopia.31.c:0 "Chúng tôi chẳng thấy có gì phải tiếc nuối cả."
 utopia.32.name:0 "Kẻ lang thang Độc nhãn"
#utopia.32.desc: "We have received a complaint from our neighbors, the [dyson_sphere_neighbor.GetName], that our Dyson Sphere is blocking the light of a central star in one of their most beloved constellations, the One-eyed Wanderer.\n\nThey claim the Wanderer, with her single eye, has watched over their kind since the beginning of time. She guides not only their fleets, but the stars themselves in their journey across the sky, and in a stroke of bad luck we have built our Dyson Sphere around her eye, blinding her. Though it will take many years before they can tell the difference from their homeworld, the notion that she won't be watching over future generations has shaken the empire.\n\nThey suggest that since we'll soon have an abundance of energy, a small donation of 1000 credits might help alleviate the pain that we've caused."
 utopia.32.desc:0 "$utopia.31.intro$\n\nDù phải đợi nhiều năm nữa chúng tôi mới cảm nhận được sự thay đổi trên hành tinh mẹ, nhưng tin tức về việc nó không thể tiếp tục dõi theo các thế hệ mai sau đã làm chấn động nhân dân chúng tôi. Còn các người, mặt khác, sẽ sớm có được nguồn năng lượng như ý muốn. Một khoản bồi thường 1000 Năng lượng có lẽ sẽ xoa dịu được nỗi đau mà các người đã gây ra."
 utopia.32.a:0 "\"Quyên góp\" 1000 Năng lượng."
 utopia.32.b:0 "Chúng ta không có đủ năng lượng, đành đưa ra lời xin lỗi chính thức."
 utopia.32.c:0 "Chuyện chúng ta làm trong lãnh thổ của mình không liên quan gì đến họ."
 utopia.33.name:0 "Kẻ lang thang mù lòa"
 utopia.33.desc:0 "Hôm nay, [dysonsphere_builder.GetRulerTitle] [dysonsphere_builder.GetRulerName] của [dysonsphere_builder.GetName] đã có cuộc gặp kín với [dyson_sphere_neighbor.GetRulerTitle] [dyson_sphere_neighbor.GetRulerName] để xin lỗi về việc làm mù Kẻ lang thang Độc nhãn. Họ đã bày tỏ sự hối hận chân thành và khẳng định rằng dù Kẻ lang thang đã mất đi ánh sáng, nó sẽ vẫn tiếp tục dùng niềm tin và công lý để dẫn lối cho chúng ta như trước đây."
 utopia.33.a:0 "Nó sẽ mãi như thế."
 utopia.33.b:0 "Bọn họ vẫn chưa đủ chân thành."
 utopia.34.name:0 "Kẻ lang thang mù lòa"
#utopia.34.desc: "The [dysonsphere_builder.GetName] has denied our request, stating clearly that what happens within their borders does not concern us.\n\nThough visibly vexed [dyson_sphere_neighbor.GetRulerTitle] [dyson_sphere_neighbor.GetRulerName]  addressed the nation today with composure and dignity, in an attempt to calm the public.\n\nSadly it seems as though the fact that the [dysonsphere_builder.GetName] shares the Universe with others, has completely passed them by."
 utopia.34.desc:0 "Chúng tôi đã nhận được yêu cầu của các người, nhưng có vẻ các người đang hiểu lầm mối quan hệ giữa chúng ta, hãy làm rõ chuyện này: [dyson_system.GetName] là một ngôi sao nằm trong lãnh thổ của chúng tôi. Có lẽ các người khó mà hiểu được khái niệm này, nhưng những gì xảy ra trong vùng không gian của chúng tôi không phải việc của các người. Tương tự, chúng tôi cũng chẳng bận tâm các người có xoa dịu được dân chúng của mình hay không.\n\nĐể tránh thêm hiểu lầm, tốt nhất các người nên nhớ kỹ điều đó."
 utopia.34.a:0 "Không cần phản hồi bọn họ."
 utopia.34.b:0 "Hạ nhục chúng."
 utopia.34.b.tooltip:0 "\"Cái quốc gia nhỏ bé thảm hại của các người sẽ sớm nếm mùi cô lập giữa vũ trụ thôi...\""
 utopia.34.c:0 "Sẽ có ngày chúng ta khiến chúng phải hối hận."
#utopia.34.c: "Slam them on intergalactic media."
 utopia.35.name:0 "Kẻ lang thang mù lòa"
 utopia.35.desc:0 "Hôm nay, [dysonsphere_builder.GetRulerTitle] [dysonsphere_builder.GetRulerName] của [dysonsphere_builder.GetName] đã đích thân hội kiến [dyson_sphere_neighbor.GetRulerTitle] [dyson_sphere_neighbor.GetRulerName] để chính thức xin lỗi về việc làm mù Kẻ lang thang Độc nhãn. Họ còn bồi thường cho chúng ta 1000 Năng lượng nhằm bù đắp tổn thất, và khẳng định rằng dù Kẻ lang thang đã mất đi ánh sáng, nó sẽ vẫn tiếp tục dùng niềm tin và công lý để dẫn lối cho chúng ta như trước đây."
 utopia.35.a:0 "Nó sẽ mãi như thế."
 utopia.35.b:0 "Bọn họ vẫn chưa đủ chân thành."
 utopia.36.desc:0 "Hôm nay, [dysonsphere_builder.GetRulerTitle] [dysonsphere_builder.GetRulerName] của [dysonsphere_builder.GetName] đã đích thân hội kiến [dyson_sphere_neighbor.GetRulerTitle] [dyson_sphere_neighbor.GetRulerName] để chính thức xin lỗi về việc làm mù Kẻ lang thang Độc nhãn. Mặc dù lời xin lỗi của họ ngoài mặt có vẻ chân thành, nhưng họ đã từ chối chi trả khoản bồi thường thích đáng, với lý do không có năng lượng dư thừa."
 utopia.36.a:0 "Họ đã cố gắng hết sức rồi."
 utopia.36.b:0 "Bọn keo kiệt!"
 utopia.37.desc:0 "Do chúng ta đã vô ý xây dựng Quả Cầu Dyson trên ngôi sao được kính trọng nhất của quốc gia khác, để bù đắp những tổn thương gây ra cho nhân dân [dyson_sphere_neighbor.GetName], [dysonsphere_builder.GetRulerTitle] của chúng ta đã lặn lội đường xa đến tận hành tinh mẹ của họ để gửi lời xin lỗi chân thành, nhưng họ lại cho rằng mọi nỗ lực của chúng ta đều vô nghĩa."
 utopia.37.a:0 "Thật đáng tiếc."
 utopia.37.b:0 "Bọn chúng thật không biết điều."
 utopia.38.desc:0 "Nhằm bù đắp những tổn hại trong quan hệ giữa nước ta và [dyson_sphere_neighbor.GetName] do việc xây dựng Quả Cầu Dyson gây ra, [dysonsphere_builder.GetRulerTitle] của chúng ta đã lặn lội đường xa đến hành tinh mẹ của họ và gửi lời xin lỗi chân thành.\n\nMặc dù họ sẽ cần thêm thời gian để vượt qua nỗi đau này, nhưng họ trân trọng những nỗ lực của chúng ta. Chúng ta cũng kỳ vọng từ nay trở đi quan hệ hai nước sẽ được cải thiện."
 utopia.38.a:0 "Quả là tin tốt."
#utopia.39.desc: "An incoming transmission from the [dyson_sphere_neighbor.GetName] has made it clear that they are displeased with our refusal to apologize for, as they put it, \"brutally maiming\" the star constellation known as the One-eyed Wanderer.\n\nRegrettably this is only one of many ways in which they find us lacking. Our physique is unappealing, our scent unpleasing and our upbringing questionable. Moreover, if we keep this up, our pitiful empire will soon learn the meaning of being alone without a friend in the Universe."
 utopia.39.desc:0 "Cảm ơn các người đã cất công bỏ thời gian dài như vậy để nhắc nhở chúng tôi về bản tính thấp hèn ăn sâu trong giống loài các người, trước đây chúng tôi quả thực đã bị lừa gạt.\n\nCái quốc gia nhỏ bé thảm hại của các người sẽ sớm nếm mùi cô lập giữa vũ trụ thôi."
 utopia.39.a:0 "Chúng ta cứ chờ xem."
 utopia.39.b:0 "Chúng sẽ phải trả giá cho sự ngạo mạn của mình!"
 utopia.39.c:0 "Cuộc nói chuyện này thật vô bổ."
 utopia.40.desc:0 "Mật báo của chúng ta chỉ ra rằng nhân dân [dyson_sphere_neighbor.GetName] tỏ ra vô cùng bất mãn trước việc chúng ta từ chối xin lỗi chính thức về việc che lấp ngôi sao trung tâm thuộc chòm sao họ yêu quý. Mặc dù chúng ta chưa nhận được văn bản giải trình nào liên quan đến sự việc này, nhưng [dysonsphere_builder.GetRulerTitle] đã bày tỏ sự không hài lòng với đất nước chúng ta trong một bài phát biểu."
 utopia.40.a:0 "Thật không may."
 utopia.40.b:0 "Đó đâu phải vấn đề của chúng ta."
 utopia.51.name:0 "Suối nguồn Tuổi trẻ"
 utopia.51.desc:0 "Hội đồng của Trung tâm Khoa học vô cùng hào hứng tuyên bố họ sẽ mang đến một cơ hội hiếm có để chiêu mộ vị tiến sĩ Xhathor danh tiếng, một tên tuổi đã có tiếng vang từ lâu trong lĩnh vực kéo dài tuổi thọ.\n\nMột loại huyết thanh đã được chứng minh là có khả năng kéo dài tuổi thọ tuyệt vời do ông và nhóm của mình nghiên cứu đã bước vào giai đoạn cuối cùng, nhưng hiện tại họ đã tiêu sạch ngân sách nghiên cứu. Tuy nhiên, việc chiêu mộ tiến sĩ Xhathor đồng nghĩa với việc chúng ta sẽ không có đủ tài nguyên để tiếp tục nghiên cứu hiện tại về kỹ thuật hữu cơ do tiến sĩ Groink dẫn dắt. Cô ấy hiện đang cố gắng truyền tải nghiên cứu kỹ thuật với một siêu máy tính hữu cơ."
 utopia.51.a:0 "Dùng 1000 Năng lượng để chiêu mộ tiến sĩ Xhathor."
 utopia.51.b:0 "Ưu tiên nghiên cứu của tiến sĩ Groink."
 utopia.51.c:0 "Chúng ta không có đủ ngân sách để chiêu mộ tiến sĩ Xhathor."
 utopia.54.name:0 "Bức màn Bí ẩn"
 utopia.54.desc:0 "Tiến sĩ Xhathor và nhóm của ông đã công bố kết quả nghiên cứu của họ vào đầu tuần này. Theo như những gì được biết, họ đã chiết xuất được một loại huyết thanh từ tinh chất tìm thấy trên [missing_pops_planet.GetName], thứ mà khi bôi lên da sẽ kích hoạt quá trình tái tạo tế bào chưa từng có.\n\nĐáng tiếc là hiện đang có vài người phàn nàn về việc Xhathor nhận được tiền tài trợ. Tiến sĩ Groink giờ đây thậm chí còn cáo buộc Xhathor là một kẻ lừa đảo. Cô ấy đã gửi yêu cầu cùng ngân sách 500 Năng lượng để mở một cuộc điều tra bí mật. Nếu Xhathor phát hiện ra, ông ta có thể cảm thấy phản cảm và rời đi."
 utopia.54.a:0 "Chẳng có gì để chứng minh cho lời cáo buộc của cô ta cả."
 utopia.54.b:0 "Bắt đầu điều tra, cẩn tắc vô áy náy."
 utopia.54.c:0 "Ngân sách của chúng ta không đủ."
 utopia.55.name:0 "Tinh chất [ointment_name.GetName]"
 utopia.55.desc:0 "Cuộc điều tra của tiến sĩ Groink nhắm vào công trình của Xhathor đã đem lại những kết quả đầy thú vị. Tiến sĩ Xhathor không chỉ thổi phồng quá mức tác dụng của huyết thanh, mà còn che giấu sự thật rằng hiệu quả của nó chỉ là tạm thời. Hơn nữa, nếu lạm dụng huyết thanh này, tác dụng phụ để lại sẽ là vĩnh viễn.\n\nBản thân tinh chất cũng đã được làm rõ, nó được chiết xuất từ tuyến nội tiết của một giống loài bản địa tại hệ sao [ointment_name.GetName], qua điều tra, sinh vật đó chính là [target_country.GetSpeciesName] thuộc [target_country.GetName]. Xhathor thậm chí còn giam giữ một số [target_country.GetSpeciesNamePlural] trong buồng lạnh để đảm bảo nguồn cung cấp tinh chất. Rõ ràng là nếu họ phát hiện ra sự thật, quan hệ ngoại giao giữa chúng ta và đế chế của họ sẽ chịu tổn thất nặng nề."
 utopia.55.a:0 "Đình chỉ dự án và bắt giữ Xhathor. Chuyện này tuyệt đối không được để ai khác biết."
 utopia.55.b:0 "Bắt Groink ngậm miệng lại, quảng cáo sản phẩm này thành kem kéo dài tuổi thọ."
 utopia.55.b.tooltip:0 "Kết hợp với chiến lược quảng bá mạnh mẽ, sản phẩm này sẽ thu về lợi nhuận khổng lồ trong thời gian ngắn."
 utopia.56.name:0 "Suối nguồn Tuổi trẻ"
 utopia.56.desc:0 "Đáng tiếc là vị tiến sĩ Xhathor xảo quyệt đã luồn lách thoát khỏi sự truy bắt của chúng ta, bỏ mặc nhóm của mình và các vật thí nghiệm lại phía sau. Các [target_country.GetSpeciesNamePlural] đã được đánh thức, may mắn thay họ không hề nhớ chút gì về những trải nghiệm đã qua. Về phần Xhathor, có thể hắn đang lẩn trốn đến một hệ sao xa xôi nào đó, sử dụng một cái tên giả và toan tính cho mánh khóe lừa đảo tiếp theo. Chỉ cần không quá xui xẻo, chúng ta sẽ tóm gọn hắn trong lần thất bại kế tiếp.\n\nCòn về nhóm cộng sự bị mang tiếng xấu của hắn, có vẻ như họ đã bị sự quyến rũ cá nhân của hắn làm cho mê muội, giống như chúng ta vậy. Chúng ta có thể cho họ một cơ hội gia nhập Trung tâm Khoa học để chuộc lại lỗi lầm."
 utopia.56.a:0 "Bọn họ không đáng tin cậy."
 utopia.56.b:0 "Chúng ta chào đón họ gia nhập."
 utopia.56.c:0 "Bọn họ rõ ràng không phải là những ngôi sao sáng nhất của dải ngân hà..."
 utopia.57.name:0 "Suối nguồn Của cải"
 utopia.57.desc:1 "Sau khi sản phẩm được tung ra thị trường với cái tên \"Tuổi thọ Vô hạn\", tinh chất [ointment_name.GetName] đã tạo nên một cơn chấn động khắp dải ngân hà. Nhờ vào sự quyến rũ cá nhân của nhà phát minh và chiến lược tiếp thị bài bản, loại kem hữu cơ thần kỳ mới này đã nhận được vô vàn lời khen ngợi. Những người nổi tiếng của các cá thể trên mọi hệ sao đều thi nhau \"Tuổi thọ Vô hạn, kéo dài bất tận\".\n\nLàm thế nào mà vị tiến sĩ này lại kiếm được nhiều tuyến nội tiết của [target_country.GetSpeciesAdj] đến vậy để có thể sản xuất huyết thanh trên quy mô lớn, cho đến nay vẫn là một ẩn số."
 utopia.57.a:0 "Không biết là một đặc ân."
 utopia.100.name:0 "Sự mất tích bất thường trên [missing_pops_planet.GetName]."
 utopia.100.desc:0 "Do các vụ mất tích gần đây, tình hình bạo loạn trên [missing_pops_planet.GetName] đang ngày một trở nên nghiêm trọng. Trong hai tháng qua, đã có hàng nghìn cư dân mất tích, trong đó phần lớn là những nhóm người bị cô lập ở vùng sâu vùng xa. Điều này cũng lý giải tại sao sự việc đã diễn ra khá lâu mà mãi tới giờ chúng ta mới chú ý tới.\n\nCơ quan hành pháp địa phương đã yêu cầu cung cấp thêm tài nguyên để tiến hành điều tra sâu hơn và trấn áp bạo loạn."
 utopia.100.a:0 "Triển khai một tổ công tác đặc biệt đến [missing_pops_planet.GetName]."
 utopia.100.b:0 "Sự mất tích của họ chắc chắn phải có nguyên nhân..."
 utopia.101.name:0 "Thành phố trên Không"
 utopia.101.desc:0 "Chúng ta đã tìm thấy một vài manh mối liên quan đến các vụ mất tích trên [missing_pops_planet.GetName]. Tất cả họ đều nhận được một cơ hội việc làm tại sòng bạc không gian sắp khai trương mang tên Thành phố trên Không. Các nhân viên tại đó đều ăn mặc kỳ dị, nói một thứ ngôn ngữ ngoài hành tinh không thể hiểu nổi. Các cuộc điều tra sâu hơn cho thấy, nếu sòng bạc này thực sự tồn tại, thì nó không nằm trong bất kỳ khu vực nào được biết tới của hệ sao này.\n\nSự hiện diện của lực lượng truy quét chuyên biệt dường như đã khiến bọn bắt cóc không dám thực hiện hành động tiếp theo, chúng ta đã quyết định nới lỏng tuần tra để dụ rắn khỏi hang, tạo điều kiện cho cơ quan hành pháp địa phương bắt giữ nhóm bắt cóc."
 utopia.101.a:0 "Thật đáng lo ngại."
 utopia.102.name:0 "Tuổi thọ Vô hạn, cho bạn sinh mệnh vô tận"
 utopia.102.desc:0 "Các nhà khoa học của chúng ta đã lên tiếng cảnh báo rằng một nhà phân phối đáng ngờ đang rao bán một loại kem chống lão hóa hữu cơ mang tên Tuổi thọ Vô hạn ngay trong lòng đế chế.\n\nVới khẩu hiệu —— Tuổi thọ Vô hạn, cho bạn sinh mệnh vô tận, nguyên liệu làm nên loại dược mỹ phẩm vô cùng được ưa chuộng này là một loại chiết xuất thần kỳ bí ẩn, tinh chất [ointment_name.GetName].\n\nMặc dù nó có thể gây ra một vài tác dụng phụ đáng lo ngại, nhưng sản phẩm này đã cho thấy tiềm năng to lớn trong việc thúc đẩy tái tạo tế bào, ủy ban nghiên cứu đặc biệt khuyến nghị chúng ta nên đặt mua một lô sản phẩm mới này."
 utopia.102.a:0 "Cải thiện khả năng tái tạo tế bào nghe có vẻ rất hứa hẹn."
 utopia.102.b:0 "Làm giảm nếp nhăn đâu phải là một vấn đề mang tầm quốc gia."
 utopia.103.name:0 "Sự thật về Tinh chất [target_country.GetSpeciesName]"
 utopia.103.desc:0 "Nghiên cứu và phân tích chuyên sâu của chúng ta về loại kem chống lão hóa này đã phơi bày hoàn toàn bản chất của nguyên liệu thần kỳ bí ẩn đó, tinh chất [ointment_name.GetName] thực chất là một dạng chiết xuất lấy từ tuyến nội tiết của những cá thể sống [target_country.GetSpeciesNamePlural], không còn nghi ngờ gì nữa, đây là một hành vi man rợ vừa đau đớn vừa vô cùng nguy hiểm.\n\nCòn tin tốt là, qua đó chúng ta đã tìm ra một dạng tiêm có khả năng kích thích tuyến nội tiết, giúp cải thiện đáng kể tuổi thọ dự kiến, có vẻ như chiếc chìa khóa của sự tái tạo vẫn luôn ẩn giấu ngay bên trong cơ thể chúng ta!"
 utopia.103.a:0 "Hãy tìm cho ra cái sinh vật đê tiện đã gây ra tội ác tàn bạo này!"
 utopia.103.b:0 "Cứ tha thứ đi... và hãy quên đi..."
 utopia.104.name:0 "Kẻ trộm Tuyến nội tiết"
 utopia.104.desc:0 "Với những nỗ lực phối hợp giữa quân đội và bộ phận nghiên cứu xã hội học, chúng ta đã khóa được chuỗi cung ứng của kem chống lão hóa Tuổi thọ Vô hạn. Bên cung cấp là một Trung tâm Khoa học thuộc sở hữu của [fountain_of_youth_country.GetName], cơ quan này từng trực thuộc một chính phủ nào đó, bao gồm tiến sĩ Xhathor cùng nhóm nghiên cứu của ông ta.\n\n[fountain_of_youth_country.GetName] đã thu được lợi nhuận khổng lồ từ nó, tất nhiên, rất có thể họ không hề biết về nguồn gốc của nguyên liệu."
 utopia.104.a:0 "Bọn họ phải ngay lập tức thả nạn nhân và thu hồi toàn bộ sản phẩm!"
 utopia.104.a.tooltip:0 "Cử đặc phái viên đi nói lời ngon tiếng ngọt khuyên bảo."
 utopia.104.c:0 "Hành động luôn hiệu quả hơn lời nói."
 utopia.104.c.tooltip:0 "Đối với các vấn đề ngoại giao, mọi thứ đã quá muộn."
 utopia.104.d:0 "Chúng ta không thể nào châm ngòi cho một sự cố ngoại giao được."
 utopia.105.name:0 "Dự án Tuổi thọ Vô hạn bị rò rỉ"
 utopia.105.desc:0 "Theo thông tin nhận được, [target_country.GetSpeciesNamePlural] đã phát hiện ra bằng chứng về việc chúng ta bắt cóc và giam giữ một số thành viên trong giống loài của họ, và tuyên bố mục đích của chúng ta là chiết xuất một loại enzyme có khả năng tái tạo tế bào từ những cơ thể sống này.\n\nHọ yêu cầu chúng ta ngay lập tức giải phóng những vật thí nghiệm này và thu hồi toàn bộ sản phẩm, nếu không nền hòa bình giữa hai nước sẽ không được đảm bảo. Chấp nhận yêu cầu của họ đồng nghĩa với việc dự án thí nghiệm bí mật của chúng ta sẽ đổ sông đổ biển."
 utopia.105.a:0 "Đồng ý với yêu cầu của họ."
 utopia.105.b:0 "Phủ nhận tất cả!"
 utopia.105.c:0 "Chúng ta chẳng hề hứng thú gì với hòa bình."
 utopia.105.c.tooltip:0 "Phớt lờ yêu cầu của họ."
 utopia.106.name:0 "Bản chất của Công lý"
 utopia.106.desc:0 "Chúng ta đã giành chiến thắng trong cuộc chiến vì chính nghĩa này!\n\nMặc dù [fountain_of_youth_country.GetName] rõ ràng là đang nói dối, tuyên bố họ chưa từng biết loại tinh chất [ointment_name.GetName] này được tạo ra như thế nào, nhưng ít nhất họ đã thả các công dân của chúng ta trở về [missing_pops_planet.GetName].\n\nTiến sĩ Xhathor, người dẫn dắt dự án nghiên cứu này, đã âm thầm chạy trốn, nhưng các thành viên còn lại của nhóm nghiên cứu sẽ phải đối mặt với sự phán xét của công lý."
 utopia.106.a:0 "Có còn hơn không."
 utopia.107.name:0 "Cặn bã Vũ trụ"
 utopia.107.desc.a:0 "Chúng ta đã nhận được thư phản hồi chính thức từ [fountain_of_youth_country.GetName], họ nhất quyết phủ nhận việc tiến hành phát triển loại kem chống lão hóa này, đồng thời khuyên chúng ta nên tìm những \"phương thức thiết thực hơn để trút bỏ cảm giác thấp kém khi đứng trước những [fountain_of_youth_country.GetSpeciesNamePlural] thượng đẳng, thay vì giả mạo bằng chứng để đưa ra những lời cáo buộc vô nghĩa.\""
 utopia.107.a:0 "Lũ cặn bã vũ trụ!"
 utopia.107.desc.b:0 "Chúng ta vẫn chưa nhận được bất kỳ phản hồi nào từ [target_country.GetName] liên quan đến việc họ bắt cóc và tiến hành thử nghiệm trên cơ thể sống để chế tạo kem chống lão hóa. Tuy nhiên, theo nguồn tin đáng tin cậy, Xhathor đã bỏ trốn cùng với số tinh chất còn sót lại, đặt dấu chấm hết cho hành vi trục lợi của bọn chúng.\n\nMục tiêu của chúng ta rất rõ ràng, chúng ta phải đưa những nạn nhân vẫn đang phải chịu đựng đau khổ, cùng với gia đình của họ, trở về [missing_pops_planet.GetName]."
 utopia.108.name:0 "Tiến sĩ Xhathor đã tẩu thoát!"
 utopia.108.desc:0 "Các [target_country.GetSpeciesNamePlural] tỏ ra bất mãn trước việc chúng ta phủ nhận liên đới tới vụ bắt cóc. Hơn thế nữa, tiến sĩ Xhathor dường như đã đánh hơi được động tĩnh và ôm theo các vật thí nghiệm bỏ trốn, khiến chúng ta không thể sản xuất thêm kem chống lão hóa được nữa."
 utopia.108.a:0 "Khốn kiếp..."
 utopia.58.name:0 "Tinh chất rốt cuộc cũng hoàn không"
 utopia.58.desc:0 "Xhathor đã cuỗm theo mọi thành quả nghiên cứu và bỏ trốn, chỉ để lại nhóm cộng sự đang vô cùng hoảng loạn của mình. Bọn họ cũng bày tỏ sự hoang mang trước sự biến mất đột ngột của ông ta. Điều đó có nghĩa là, tất cả những ai từng vỗ ngực cho rằng mình am hiểu nhân cách của vị tiến sĩ này, nói ông ta là một thiên tài đầy sức hút, hào phóng và sẵn sàng làm mọi thứ vì cộng sự của mình, thì giờ đây những bằng chứng họ có thể đưa ra về các thành tựu huyền thoại của vị tiến sĩ cũng chỉ là những lời đồn thổi mà thôi.\n\nChúng ta đành phải thừa nhận rằng những lời buộc tội của tiến sĩ Groink cho rằng ông ta là kẻ lừa đảo là hoàn toàn chính xác, hoặc cũng có thể ông ta đã ôm theo loại tinh chất bí ẩn của mình đi tìm một người trả giá cao hơn rồi. Nếu ông ta còn giở lại mánh khóe này ở đâu đó, chúng ta nhất định sẽ tìm ra ông ta."
 utopia.58.a:0 "Tên khốn!"
 utopia.59.intro:0 "Tiến sĩ Groink và nhóm của cô ấy đã phát minh ra một ngân hàng thần kinh —— một loại máy tính hữu cơ có khả năng lưu trữ và sử dụng toàn bộ năng lực nhận thức của bộ não được tải lên ổ đĩa của nó, điều này có thể đẩy nhanh đáng kể tốc độ nghiên cứu của chúng ta. Tuy nhiên lại có một hạn chế: để vận hành hiệu quả, bộ não được tải lên phải được lấy ra khỏi cơ thể đối tượng và đặt vào một loại chất lỏng truyền dẫn. Đối tượng phải cắt đứt mọi liên kết với sự tồn tại vật chất."
 utopia.59.name:0 "Ngân hàng Thần kinh"
 utopia.59.desc:0 "$utopia.59.intro$\n\nĐúng như dự đoán, số lượng tình nguyện viên chẳng đến mức phải xếp hàng, cho đến nay mới chỉ có một người duy nhất —— nhà khoa học [volunteer_leader.GetName]."
 utopia.59.a:0 "Tải bộ não của [volunteer_leader.GetName] lên trung tâm."
 utopia.59.a.tooltip:1 "Trung tâm Khoa học giờ đây sẽ cung cấp thêm:\n£physics£§G50§!£society£§G50§!£engineering£§G50§!"
 utopia.59.b:0 "Thế thì vô đạo đức quá."
 utopia.59.c:0 "Không, [volunteer_leader.GetName] còn có giá trị ở lĩnh vực khác."
 utopia.60.name:0 "Ngân hàng Thần kinh"
 utopia.60.desc:0 "$utopia.59.intro$\n\nĐúng như dự đoán, số lượng tình nguyện viên chẳng đến mức phải xếp hàng, cho đến nay mới chỉ có một người duy nhất —— một nhà nghiên cứu khoa học trẻ xuất sắc thuộc nhóm của Groink. Thế nhưng, gia đình của cô ấy đã yêu cầu một khoản bồi thường 1000 Năng lượng."
 utopia.60.a:0 "Thật không may là chúng ta không trả nổi."
 utopia.60.b:0 "Nghe có vẻ khả thi đấy."
 utopia.60.c:0 "Thế thì vô đạo đức quá."
#utopia.61.name: "Neural Bank"
#utopia.61.desc: "We've had some crushing news from the Science Nexus regarding [volunteer_leader.GetName], the researcher whose brain was uploaded to the neural bank two years ago. [volunteer_leader.GetSheHeCap] [volunteer_leader.GetHasHave] continued to communicate with [volunteer_leader.GetHerHis] colleagues and family all this time via the bank's interface and sadly, has asked us to terminate [volunteer_leader.GetHerHis] brain, as [volunteer_leader.GetSheHe] find[volunteer_leader.GetSXX] [volunteer_leader.GetHerHis] current state of existence unbearable.\n\nDespite its many benefits Dr. Groink has decided to pull the plug on the brain tank for good, for ethical reasons."
 utopia.62.name:0 "[abducted_leader.GetName]"
 utopia.62.desc:0 "Vừa mới đây, toàn bộ nhân viên tại khoa vật lý của Trung tâm Khoa học đã chìm vào hôn mê trong gần 15 phút. Khi họ tỉnh lại, nhà vật lý học [abducted_leader.GetName] đã mất tích, văn phòng của [abducted_leader.GetHerHis] bị lục tung, bộ nhớ của [abducted_leader.GetHerHis] bị xóa sạch và ổ đĩa của [abducted_leader.GetHerHis] cũng bị thiêu rụi.\n\nCác đồng nghiệp của [abducted_leader.GetHerHisCap] cho rằng đó là nơi [abducted_leader.GetSheHe] lưu trữ tài liệu cho một dự án cá nhân mà [abducted_leader.GetSheHe] đang nghiên cứu. Mặc dù [abducted_leader.GetSheHe] rất kín tiếng về công trình của mình, nhưng có vẻ như nghiên cứu của [abducted_leader.GetHerHis] đã sắp đạt được bước đột phá lớn.\n\nMột vài nhân viên cho biết họ có nhìn thấy ánh sáng tím lấp lánh trước khi bất tỉnh, hiện tại chúng ta chưa có bất kỳ manh mối nào về tung tích của [abducted_leader.GetHerHis]."
 utopia.62.a:0 "Tiếp tục tìm."
 utopia.63.name:0 "[abducted_leader.GetName]"
 utopia.63.desc:0 "Sáng sớm nay, các nhân viên tại Trung tâm Khoa học đã bắt gặp nhà vật lý học mất tích [abducted_leader.GetName] đang ăn sáng trong nhà ăn, cứ như thể chưa từng có chuyện gì xảy ra.\n\n[abducted_leader.GetSheHeCap] khẳng định rằng [abducted_leader.GetSheHe] vừa mới thức dậy từ trên giường của [abducted_leader.GetHerHis], và hoàn toàn không có chút ký ức nào về việc đã từng rời khỏi Trung tâm Khoa học, nhưng nhiều đồng nghiệp của [abducted_leader.GetHerHis] lại cho rằng [abducted_leader.GetSheHe] đang khiến cho mọi người cảm thấy bất an, và [abducted_leader.GetSheHe] chỉ đang giả vờ không nhớ gì mà thôi.\n\nSau khi trở về, [abducted_leader.GetSheHeCap] dường như có hiểu biết tường tận đến khó tin về những lĩnh vực mà trước đây vốn hoàn toàn xa lạ đối với [abducted_leader.GetHerHim]. [abducted_leader.GetSheHe] hiện đang chờ phân công nhiệm vụ."
 utopia.63.a:0 "[abducted_leader.GetSheHeCap] sẽ là một nhân tài cực kỳ sáng giá."
 utopia.63.b:0 "[abducted_leader.GetSheHeCap] sẽ gây nguy hiểm cho những người khác."
 utopia.64.desc:0 "$utopia.59.intro$\n\nĐúng như dự đoán, số lượng tình nguyện viên chẳng đến mức phải xếp hàng, cho đến nay mới chỉ có một người duy nhất —— nhà khoa học [volunteer_leader.GetName]."
# Science Nexus/Think Tank Notification Events
 utopia.80.name:0 "Xây dựng Trung tâm Khoa học"
 utopia.80.desc:0 "Chúng ta đã bắt tay vào xây dựng Trung tâm Khoa học khổng lồ. Bệ đỡ đã vào vị trí, trục xoay chính cũng đã sẵn sàng. Những hứa hẹn về công nghệ đột phá và khả năng vượt qua những giả thuyết điên rồ nhất đang chờ đợi chúng ta phía trước. Chặng đường còn dài và gian nan, nhưng chúng ta sẽ không ngừng tìm tòi học hỏi.\n\nLiệu vô vàn những bí ẩn của vũ trụ cuối cùng có nằm trọn trong tầm kiểm soát của chúng ta?"
 utopia.80.a:0 "Tương lai thuộc về chúng ta."
# Neighbor's First Science Nexus
 utopia.82.name:0 "Siêu cấu trúc Ngoại lai"
 utopia.82.desc.a:2 "[From.GetName] đã bắt đầu thử thách xây dựng Trung tâm Khoa học —— một cơ sở nghiên cứu với công nghệ tiên tiến bậc nhất, đủ để tạo ra một cuộc cách mạng mang tính lật đổ tiến trình khoa học.\n\nHệ sao [think_tank_system.GetName] đang hừng hực khí thế, các kỹ sư đang tiến hành lắp ráp nền móng ban đầu của công trình. Bất luận họ có thành công hay không, riêng nỗ lực này thôi cũng đủ để đưa họ trở thành những người tiên phong của thời đại chúng ta."
# Neighbor's Second Science Nexus
 utopia.82.desc.b:0 "[From.GetName] đã bắt tay vào xây dựng một Trung tâm Khoa học khác, lần này là ở hệ sao [think_tank_system.GetName]."
 utopia.82.a:0 "Minh chứng cho trí tuệ của sự sống thông minh."
 utopia.82.b:0 "Vẫn như mọi khi, họ luôn đi trước thời đại."
 utopia.82.c:0 "Chúng ta sẽ nghiền nát bọn [From.GetSpeciesNamePlural], và nhấn chìm chúng trong biển lửa..."
 # Nexus Frame Built
 #utopia.83.name: "Science Nexus Platform Complete"
 #utopia.83.desc: "The Science Nexus platform is finally in place and the engineering team ready to begin the initial stages of construction, starting with the main hub."
 #utopia.83.a: "Excellent."
# Science Nexus partially completed
 utopia.83.name:0 "Cốt lõi Trung tâm Khoa học"
 utopia.83.desc:0 "Lõi trung tâm của Trung tâm Khoa học đã vào vị trí, lõi này được lắp đặt một lò phản ứng điểm kỳ dị với công nghệ tiên tiến nhất. Các kỹ sư của chúng ta đang chuẩn bị ráp nối phần tiếp theo, cũng là phân đoạn công trình đầy tính thử thách nhất —— bốn khu nghiên cứu phụ, đủ khả năng chống chịu cái nóng cực độ, những đợt sóng áp suất khủng khiếp, cũng như các mầm bệnh từ ngoài hành tinh. Các khu phụ này cũng cung cấp rất nhiều chỗ ở cho các nhà nghiên cứu."
 utopia.83.a:0 "Tiến độ của chúng ta đang rất thần tốc."
 # Science Nexus Wings pt 1
 utopia.85.name:0 "Khu nghiên cứu Trung tâm Khoa học"
 utopia.85.desc:0 "Mô-đun đầu tiên —— bốn khu nghiên cứu phụ đã vào vị trí, các nhà nghiên cứu và nhân viên đã chuyển đến khu vực sinh sống của họ. Bước tiếp theo và cũng là bước cuối cùng, chúng ta sẽ mở rộng các khu phụ, bổ sung thêm bốn phân khu phòng thí nghiệm để hỗ trợ cho những nghiên cứu nguy hiểm nhất của chúng ta. Chúng ta đã triển khai các biện pháp an ninh bổ sung để đảm bảo an toàn cho đội ngũ nhân viên."
 utopia.85.a:0 "Chúng ta sắp hoàn thành rồi"
# Science Nexus completed
 utopia.84.name:0 "Trung tâm Khoa học đã Hoàn thành"
 utopia.84.desc.a:0 "Hôm nay chúng ta tụ họp để ăn mừng sự khánh thành của Trung tâm Khoa học vĩ đại này. Sở hữu trang thiết bị nghiên cứu tối tân cùng những công nghệ mang tính cách mạng, chúng ta có thể dễ dàng thu hút những bộ óc kiệt xuất nhất của toàn cõi ngân hà, thậm chí là của cả vũ trụ, và đó chính xác là những gì chúng ta đang hướng tới. Thành tựu này sẽ là điểm khởi đầu cho một Kỷ nguyên Khai sáng mới.\n\nHôm nay sẽ là một ngày trọng đại trong lịch sử của giống loài chúng ta."
 utopia.84.desc.b:0 "Hôm nay chúng ta ăn mừng sự hoàn thành của một Trung tâm Khoa học khác. Nếu như những thành tựu trước đây vẫn chưa đủ, thì sự ra đời của Trung tâm Khoa học này chắc chắn sẽ đưa chúng ta lên vị thế tiên phong trong tiến trình phát triển khoa học của toàn vũ trụ. Những bước tiến khoa học của chúng ta cho phép chúng ta tự tay định đoạt tương lai của chính mình."
 utopia.84.a:0 "Hoàn toàn chính xác."
 # Completed neighbor notification
 utopia.86.name:0 "Siêu cấu trúc Ngoại lai đã Hoàn thành"
 utopia.86.desc:0 "[From.GetName] đã hoàn tất công cuộc xây dựng Trung tâm Khoa học. Giờ đây họ đã có đủ thực lực để đập tan mọi nghi ngờ của những kẻ không tin tưởng, và điều này cũng đưa họ lên vị thế tiên phong trong lĩnh vực tiến bộ khoa học. Có lẽ chúng ta nên cẩn chừng bọn họ, bởi việc hoàn thành một công trình như vậy chắc chắn sẽ mang lại lợi ích to lớn cho nền tảng công nghệ của họ trong tương lai, giúp họ giành được lợi thế trước nền văn minh của chúng ta."
 utopia.86.a:0 "Chúng ta tuyệt đối không thể tụt lại phía sau."

 utopia.2000.name:0 "Xây dựng Thế Giới Vành Đai"
 utopia.2000.desc:0 "Giờ đây chúng ta đang chuẩn bị bắt tay vào công trình vĩ đại này, xây dựng bộ khung sơ khởi của thế giới vành đai trong tương lai bao quanh ngôi sao của hệ sao [From.From.GetName].\n\nNguồn tài nguyên và khoáng sản cần thiết để tạo nên bộ khung này là một con số chưa từng có trong lịch sử, hàng trăm ngàn kỹ sư xuất sắc nhất của chúng ta đã sẵn sàng tháo dỡ các hành tinh trong hệ sao để lấy vật liệu cho công cuộc xây dựng thế giới vành đai."
 utopia.2000.a:0 "Chúng ta đang làm nên lịch sử."
 utopia.2002.name:0 "Dự án Thế Giới Vành Đai"
 utopia.2002.desc.a:0 "Chúng ta vừa nhận được tin báo rằng [From.GetName] đã khởi động một siêu dự án tại hệ sao [ringworld_system.GetName]. Tham vọng của họ là tạo ra một thế giới vành đai khổng lồ bao quanh ngôi sao của hệ sao này, và trong bước đi đầu tiên của dự án, họ đã bắt đầu chuyển hóa toàn bộ các hành tinh trong hệ sao thành bộ khung kim loại của siêu cấu trúc."
 utopia.2002.desc.b:0 "Chúng ta nhận được tin báo rằng [From.GetName] lại bắt tay vào xây dựng thêm một thế giới vành đai nữa, và lần này là ở hệ sao [ringworld_system.GetName]! Vẫn như cũ, các kỹ sư của họ đang tiến hành tháo dỡ toàn bộ các hành tinh trong hệ sao này, tận dụng tài nguyên và vật liệu của chúng để xây dựng thế giới vành đai."
 utopia.2002.a:0 "Liệu cái vòng đó có tráng lệ như của chúng ta không?"
 utopia.2002.b:0 "Một kỳ tích, nếu như có thể hoàn thành."
 utopia.2003.name:0 "Khung Thế Giới Vành Đai đã Hoàn thành"
 utopia.2003.desc:0 "Khung thế giới vành đai mà chúng ta xây dựng tại hệ sao [From.From.GetName] hiện đã được hoàn tất. Tuy vẫn còn ngổn ngang rất nhiều công đoạn tiếp theo, nhưng việc hoàn thành bộ xương kim loại với chu vi ngót nghét một tỷ km này chắc chắn là một chiến công hiển hách của ngành kỹ thuật.\n\nChúng ta đã sẵn sàng để kiến tạo nên những khu vực sống theo đúng nghĩa của nó."
 utopia.2003.a:0 "Vẫn còn rất nhiều việc đang chờ đón chúng ta."
 utopia.2004.name:0 "Thế Giới Vành Đai đã Hoàn thành"
 utopia.2004.desc.a:0 "Hôm nay, các kỹ sư và chuyên gia sinh thái hành tinh của chúng ta đã hoàn tất công đoạn xây dựng phân khu cư trú cuối cùng của thế giới vành đai đặt tại hệ sao [completed_ringworld_system.GetName]. Sự thành hình của siêu cấu trúc vĩ đại này chắc chắn sẽ trở thành một cột mốc lịch sử chói lọi của [Root.GetName]. Chúng ta đã hoàn thành một công trình mà chỉ một số ít nền văn minh mới có khả năng làm được.\n\nHãy để thế giới vành đai này trở thành minh chứng vĩnh cửu cho những gì mà chúng ta đã đạt được, kể từ khi giống loài [Root.GetSpeciesName] chập chững bước ra khỏi sự chở che an toàn của hành tinh mẹ cho đến tận ngày hôm nay."
 utopia.2004.desc.b:0 "Chúng ta đã hoàn thành việc xây dựng phân khu cư trú của thế giới vành đai nằm trong hệ sao [completed_ringworld_system.GetName], các kỹ sư và chuyên gia sinh thái của chúng ta lại một lần nữa biến điều không thể thành có thể.\n\n[Root.GetName] sẽ được vinh danh là một trong những nhà kiến thiết vĩ đại nhất trong lịch sử của toàn thể dải ngân hà."
 utopia.2004.a:0 "Quả là một ngày trọng đại."
 utopia.2005.name:0 "Thế Giới Vành Đai của [From.GetSpeciesName]"
 utopia.2005.desc.a:0 "[From.GetName] đã làm nên một kỳ tích mà chỉ một số ít nền văn minh trong lịch sử mới có thể hoàn thành —— họ đã hoàn tất công trình thế giới vành đai khổng lồ ngự trị tại hệ sao [completed_ringworld_system.GetName].\n\nPhép màu khoa học này sẽ trở thành minh chứng cho sự thần kỳ chấn động thế giới của giống loài [From.GetSpeciesName], từ những khởi đầu vô danh cho đến một chặng đường dài mà họ đã nỗ lực vượt qua."
 utopia.2005.desc.b:0 "[From.GetName] lại hoàn thành việc xây dựng thêm một thế giới vành đai nữa! Siêu cấu trúc hoành tráng này tọa lạc tại hệ sao [completed_ringworld_system.GetName], giờ đây các hành tinh thuộc hệ sao này đã hoàn toàn biến mất, chúng đã bị tháo dỡ để làm vật liệu xây dựng."
 utopia.2005.a:0 "Có lẽ chúng ta cũng nên cân nhắc xây thêm vài cái."
 utopia.2005.b:0 "Lại thêm một cái nữa? Tài nguyên của bọn họ tiêu xài mãi không hết sao?"


 utopia.4000.name:0 "Xây dựng Quả Cầu Dyson"
 utopia.4000.desc:0 "Nắm quyền kiểm soát nguồn năng lượng của các vì sao luôn là niềm khao khát cháy bỏng của các kỹ sư [Root.GetAdj], từ những ngọn lửa thô sơ cho đến sự bắt chước vụng về phản ứng nhiệt hạch của sao, và giờ đây chúng ta đã sẵn sàng để biến ước mơ ấy thành hiện thực. Hệ sao [From.From.GetName] là nơi đặt nền móng của chúng ta, và chúng ta sẽ tiến hành xây dựng Quả Cầu Dyson tại đó, bao bọc toàn bộ [From.From.GetName] và chiếm trọn sức mạnh khủng khiếp của ngôi sao."
 utopia.4000.a:0 "Biển sao vô tận."

 # Neighbor's First Dyson Sphere
 utopia.4002.name:0 "Siêu cấu trúc Ngoại lai"
 utopia.4002.desc.a:0 "Những hoạt động dữ dội tại hệ sao [dyson_system.GetName] đã vô tình tiết lộ dự án xây dựng §HQuả Cầu Dyson§! của [From.GetName].\n\nMặc dù vẫn đang trong giai đoạn phôi thai, nhưng khi hoàn tất, Quả Cầu Dyson sẽ che lấp toàn bộ ánh sáng của [dyson_system.GetName], và nguồn sáng đó sẽ được chuyển hóa thành kho dự trữ Năng lượng khổng lồ cho [From.GetAdj]."
 # Neighbor's Second Dyson Sphere
 utopia.4002.desc.b:0 "Mọi dữ liệu đều chỉ ra rằng, lại một hệ sao nữa là [dyson_system.GetName] chuẩn bị trở thành địa điểm tiếp theo cho dự án Quả Cầu Dyson của [From.GetName]. Mặc dù sẽ cần một khoảng thời gian khá dài, nhưng một khi siêu cấu trúc này thành hình, nó sẽ bao phủ toàn bộ ngôi sao của hệ."
 utopia.4002.a:0 "Tất cả các thế lực tinh tế cuối cùng rồi cũng sẽ thuần hóa được các vì sao."
 utopia.4002.b:0 "Dải ngân hà lại càng thêm ảm đạm."

 # Sphere Frame built
 utopia.4003.name:0 "Khung Quả Cầu Dyson"
 utopia.4003.desc:0 "Với việc bộ khung đã được định vị, quy mô đồ sộ của dự án này đã lộ diện rành rành.\n\n[From.From.GetName] đang rực cháy bên trong một chiếc lồng mong manh, nhưng sau cùng nó sẽ bị những tấm pin năng lượng mặt trời của người [Root.GetAdj] bao bọc trọn vẹn."
 utopia.4003.a:0 "Tuyệt mỹ."

 # Dyson Sphere partially completed
 utopia.4004.name:0 "Tấm pin Quả Cầu Dyson đã Lắp đặt"
 utopia.4004.desc:0 "Tuy chưa đạt mức hoàn thiện 100%, nhưng cùng với việc lắp đặt các bộ thu thập năng lượng mặt trời tiên tiến, chúng ta đã bắt đầu gặt hái những lợi ích thiết thực từ Quả Cầu Dyson tọa lạc tại hệ sao [From.From.GetName].\n\nSong song với tiến trình thi công, nguồn Năng lượng thu về sẽ tiếp tục tăng trưởng, và khi Quả Cầu Dyson được khánh thành, chúng ta sẽ nắm trong tay khả năng vận hành toàn diện."
 utopia.4004.a:0 "Tuyệt vời."

 # Dyson Sphere completed
 utopia.4005.name:0 "Quả Cầu Dyson [From.From.GetName] đã Hoàn thành"
 utopia.4005.desc:0 "Ngôi sao trung tâm của hệ sao [From.From.GetName] đã bị Quả Cầu Dyson của người [Root.GetAdj] ôm trọn.\n\nCác kỹ sư của chúng ta đang nâng ly ăn mừng cho thắng lợi này, và họ hoàn toàn xứng đáng với điều đó. Chúng ta đã làm nên một kỳ tích mà chỉ một số ít đế chế giữa các vì sao dám liều mình thử nghiệm —— bắt giữ hoàn toàn một ngôi sao."
 utopia.4005.a:0 "Sản lượng năng lượng dẫn đầu thiên hạ."

 # Completed neighbor notification
 utopia.4010.name:0 "Siêu cấu trúc Ngoại lai đã Hoàn thành"
 utopia.4010.desc:0 "Tia sáng cuối cùng từ ngôi sao của hệ [From.From.From.GetName] đã vụt tắt. [From.GetName] đã hoàn tất việc xây dựng Quả Cầu Dyson, lại thêm một khoảng không trống rỗng giữa bầu trời minh chứng cho trí tuệ và sự trù phú của người [From.GetAdj]."

 utopia.4100.name:0 "Xây dựng Mạng Lưới Cảm Biến Toàn Thiên Hà"
 utopia.4100.desc:0 "Ánh sáng từ các vì sao tuy mờ nhạt nhưng lại có thể xua tan đi màn đêm thăm thẳm của cõi hư không, và chỉ khi chúng ta học được cách vượt qua tốc độ ánh sáng, chúng ta mới nhận ra rằng những gì ánh sáng hé lộ chỉ là một góc nhỏ của sự thật.\n\nNgày hôm nay, chúng ta sẽ chấm dứt sự mù mờ của chính mình, Mạng Lưới Cảm Biến Toàn Thiên Hà mà chúng ta chuẩn bị xây dựng tại hệ sao [From.solar_system.GetName] sẽ trở thành một nhà ngục Panopticon vững chãi, cặp mắt của chúng ta sẽ dán chặt vào từng ngôi sao một."
 utopia.4100.a:0 "Thu hết vào tầm mắt."
 utopia.4100.a.tooltip:0 "§H$spy_orb_0$§! hiện đã vào vị trí, nhưng vẫn cần xây dựng thêm trước khi có thể đi vào hoạt động."

 utopia.4102.name:0 "$utopia.4002.name$"
 utopia.4102.desc:0 "Chúng ta nhận được tin báo rằng [From.GetName] đã khởi động xây dựng một Mạng Lưới Cảm Biến Toàn Thiên Hà tầm xa khổng lồ tại hệ sao [spy_system.GetName]. Tuy mới chỉ ở giai đoạn trứng nước, nhưng khi hoàn chỉnh, Mạng Lưới Cảm Biến Toàn Thiên Hà này sẽ trao cho họ toàn bộ bức tranh về các hoạt động giữa các vì sao trên khắp dải ngân hà."

 utopia.4103.name:0 "Trung tâm Mạng Lưới Cảm Biến Toàn Thiên Hà đã Lắp ráp"
 utopia.4103.desc:0 "Bản thân Trung tâm Mạng Lưới Cảm Biến Toàn Thiên Hà đã là minh chứng cho đỉnh cao công nghệ hiện tại, nó là sự kết hợp hoàn hảo giữa trạm nghe lén và kính viễn vọng không gian.\n\nThế nhưng đây mới chỉ là cột mốc đầu tiên của dự án vĩ đại này."
 utopia.4103.a.tooltip:0 "§H$spy_orb_1$§! đã đi vào hoạt động. Phạm vi thăm dò của cảm biến chúng ta đã được nâng cao."

 utopia.4104.name:0 "Mạng Lưới Cảm Biến Toàn Thiên Hà đã Hoàn thành"
 utopia.4104.desc:0 "Công nghệ được phong ấn bên trong các vòng bao quanh Mạng Lưới Cảm Biến Toàn Thiên Hà phải được bảo vệ cẩn mật để tránh bị rò rỉ.\n\nNhưng hiệu quả mà nó mang lại là điều không thể bàn cãi, giờ đây chúng ta gần như nắm trong tay quyền kiểm soát tuyệt đối đối với động thái của mọi hạm đội trong toàn cõi thiên hà."
 utopia.4104.a:0 "Nhìn rõ mồn một."
 utopia.4104.a.tooltip:0 "Phạm vi cảm biến được kích hoạt đến cấp thiên hà."

 utopia.4110.name:0 "$utopia.4010.name$"
 utopia.4110.desc:0 "Chúng ta nhận được hung tin rằng [From.GetName] đã hoàn tất công trình Mạng Lưới Cảm Biến Toàn Thiên Hà tọa lạc tại hệ sao [From.From.solar_system.GetName].\n\nChúng ta lo sợ rằng bọn họ giờ đây đã có thể nắm trọn trong lòng bàn tay thông tin tình báo về vị trí cũng như cơ cấu lực lượng hạm đội của chúng ta."

