 sol_system_unplugged_initializer_DESC: "Hệ sao khởi đầu tùy chọn cho loài người với Nguồn Gốc $origin_unplugged$."

 unplugged_injured_star_name: "Ath-Khui'achad"
 unplugged_injured_homeworld_name: "Intch'asket"

 unplugged_battlefield: "Thu Hồi Chiến Trường"
 unplugged_battlefield_desc: "Vô số sinh vật nửa người nửa máy và máy móc nằm la liệt trên khắp thế giới này sau một nỗ lực tận diệt tàn bạo. Các cá thể khỏe mạnh và cả những thương binh còn lê bước được đều có thể lục lọi thi thể của chúng để tìm kiếm linh kiện nâng cấp."

# Unique Species Traits
 trait_unplugged_cybernetic_positives_3: "Biệt Kích Cơ Khí"
 trait_unplugged_cybernetic_positives_3_desc: "$trait_unplugged_cybernetic_positives_desc$"
 trait_unplugged_cybernetic_positives_desc: "Việc thay thế toàn bộ chi thể và áo giáp lưới nano liên kết đảm bảo những cyborg này có thể tiến hành chiến tranh với hiệu quả tàn khốc. Do đó, một số chức năng cơ thể phi quân sự đã bị hy sinh."
 trait_unplugged_cybernetic_positives_3_tt: "Độ Hạnh Phúc Trong Thời Chiến và Khủng Hoảng: §G+30%§!\n$t$- §H$commander_plural_with_icon$§! Mang lại Tốc Độ Bắn Của Tàu: §G+20%§!"
 trait_unplugged_cybernetic_positives_2: "Lính Đột Kích Cơ Khí"
 trait_unplugged_cybernetic_positives_2_desc: "Những cyborg này được hưởng lợi từ phương pháp trang bị tổng thể linh hoạt. Thay vì áo giáp tích hợp toàn thân, các mô-đun cường hóa có thể hoán đổi cho phép duy trì một phần chức năng phi quân sự."
 trait_unplugged_cybernetic_positives_2_tt: "§Y$commander_plural_with_icon$§! Mang lại Tốc Độ Bắn Của Tàu: §G+10%§!"
 trait_unplugged_cybernetic_positives_1: "Binh Lính Cyborg"
 trait_unplugged_cybernetic_positives_1_desc: "Những cường hóa tinh tế đối với giác quan, tuyến nội tiết và dây thần kinh vận động của những cyborg này đảm bảo họ vẫn là những chiến binh dũng mãnh và thiện chiến trong khi chỉ ảnh hưởng không đáng kể đến khả năng sinh sản."
 trait_unplugged_cybernetic_positives_1_tt: "§Y$commander_plural_with_icon$§! Mang lại Tốc Độ Bắn Của Tàu: §G+5%§!"

 trait_unplugged_cybernetic_negatives_3: "Ngắt Kết Nối"
 trait_unplugged_cybernetic_negatives_3_desc: "$trait_unplugged_cybernetic_negatives_desc$"
 trait_unplugged_cybernetic_negatives_desc: "Nhiều mô-đun cường hóa của các cyborg này được thiết kế để sử dụng mạng lưới chiến trường nay không còn tồn tại, gây ra căng thẳng và khó chịu dữ dội."
 trait_unplugged_cybernetic_negatives_3_tt: "Độ Hạnh Phúc Khi Không Ở Trong Chiến Tranh Hoặc Khủng Hoảng: §R-10%§!"
 trait_unplugged_cybernetic_negatives_2: "Mất Liên Kết"
 trait_unplugged_cybernetic_negatives_2_desc: "Bản chất không tương thích của các mô-đun cường hóa quân sự bị cưỡng ép này làm giảm sút nghiêm trọng chất lượng cuộc sống của các cyborg và làm tăng nhu cầu thể chất trong thời gian phục hồi chức năng."
 trait_unplugged_cybernetic_negatives_1: "Ám Ảnh Tàn Dư"
 trait_unplugged_cybernetic_negatives_1_desc: "Ảo giác thính giác và những tiếng vọng giác quan khác từ ý thức máy móc trước đây vẫn còn ám ảnh các cyborg này, khiến họ phải chịu đựng những đợt trầm cảm và lo âu nghiêm trọng."

 trait_unplugged_decyberized: "Giải Trừ Cơ Khí"
 trait_unplugged_decyberized_desc: "Những cựu cyborg này đã vô hiệu hóa hoặc vứt bỏ các mô-đun cường hóa từng bị áp đặt lên họ, lấy lại nhiều thuộc tính hữu cơ di truyền nguyên bản của giống loài."

 trait_unplugged_neurocalmed: "Thần Kinh Điềm Tĩnh"
 trait_unplugged_neurocalmed_desc: "Những cyborg này đã được điều chỉnh giảm nồng độ Neuroxene, giảm tính bốc đồng và hung hãn, thôi thúc các cá nhân hạ bớt lợi ích cá nhân để tuân thủ các chuẩn mực xã hội."

 trait_unplugged_neurosavant: "Bác Học Thần Kinh"
 trait_unplugged_neurosavant_desc: "Những cyborg này được điều chỉnh tăng nồng độ Cognivex, tăng cường tính khả biến của khớp thần kinh, khả năng ghi nhớ thông tin và giải quyết vấn đề."

 trait_unplugged_regenoptimized: "Tối Ưu Hóa Tái Sinh"
 trait_unplugged_regenoptimized_desc: "Những cyborg này được điều chỉnh tăng nồng độ Regenol-X, hài hòa các hệ thống sinh học và tổng hợp, cho phép các bộ phận cấy ghép cơ học tự sửa chữa ở cấp độ phân tử."

# Unique Leader Traits ('positive' only)
 leader_trait_unplugged_cybernetic_positives: "[triggered_unplugged_leader_name]"
 leader_trait_unplugged_cybernetic_positives_desc: "[triggered_unplugged_leader_desc]"
 leader_trait_unplugged_cybernetic_positives_3: "Biệt Kích Cơ Khí"
 leader_trait_unplugged_cybernetic_positives_3_desc: "Nhà lãnh đạo này đã ủy thác một số chức năng cơ thể cốt lõi cho phần cứng ưu tiên nhận thức tác chiến."
 leader_trait_unplugged_cybernetic_positives_2: "Lính Đột Kích Cơ Khí"
 leader_trait_unplugged_cybernetic_positives_2_desc: "Nhà lãnh đạo này có khả năng tích hợp trực tiếp và liền mạch với các hệ thống quân sự và dân sự, với cái giá phải trả đáng kể là các giác quan hữu cơ."
 leader_trait_unplugged_cybernetic_positives_1: "Binh Lính Cyborg"
 leader_trait_unplugged_cybernetic_positives_1_desc: "Sự cường hóa đáng kể các giác quan và hệ thống miễn dịch của nhà lãnh đạo này đảm bảo tuổi thọ, độ tin cậy và chỉ mất đi một phần nhỏ chức năng sinh sản."

