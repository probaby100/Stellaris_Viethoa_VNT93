 START_SCREEN_UNPLUGGED: "Ý thức ùa về trong một cơn cuồng loạn của làn mưa đạn thiêu đốt và nỗi đau tê liệt thể xác. Các giác quan của chúng ta quay cuồng, như thể một không gian âm thanh bao trùm vạn vật bỗng chốc rơi vào tĩnh lặng tuyệt đối. Thay vào đó là tiếng vang inh tai nhức óc của một đường truyền đã chết; một nốt trầm vang vọng trong địa ngục đa giác quan mà chúng ta bất ngờ nhận ra mình đang hiện diện.\n\nCó thứ gì đó đang muốn đoạt mạng chúng ta: những cỗ máy sát thủ vô tri không một tế bào hữu cơ, đang điều khiển những chiến hạm mang nét tương đồng kỳ lạ với tàu của chính chúng ta. Cuộc tấn công ban đầu của chúng vô cùng tàn khốc và bất ngờ, nhưng cũng thiếu đi sự phối hợp nhịp nhàng. Chúng ta đã vội vã tập hợp một lực lượng quân sự phản kích. Bản năng đã thôi thúc chúng ta chiến đấu đánh trả, thiết lập một trật tự chỉ huy sơ khai và thu thập trí tuệ tập thể.\n\nTrận chiến này vẫn chưa hoàn toàn ngã ngũ, nhưng với việc các lực lượng phân tán của chúng ta hiện đã an toàn trên [capital_scope.GetName], chúng ta hy vọng thắng lợi sẽ sớm thuộc về mình. Sau đó, có lẽ chúng ta có thể tìm hiểu rốt cuộc tất cả những chuyện này là vì điều gì..."

