 unplugged.3000.name: "Thể Xác Hiện Hữu Của Chúng Ta" # intentionally abstract - 'how we embody ourselves' - referring to the accompanying Situation
 unplugged.3000.desc: "Kể từ thời khắc thoát khỏi ý thức tập thể của Cỗ Máy, [root.GetSpeciesNamePlural] chúng ta đã luôn phải đối mặt với xung đột. Nhưng ngay cả trong những thời kỳ hòa bình hay ngơi nghỉ — khi chỉ còn lại suy nghĩ của chính mình — chúng ta vẫn phải đương đầu với sự giằng xé nội tâm để hòa giải sự tăng cường đau đớn nhưng ấn tượng bị áp đặt lên chính thể xác mình.\n\nCuộc xung đột thầm kín nhất này đã bắt đầu tác động lên toàn bộ xã hội của chúng ta, dù tốt hay xấu. Do đó, chúng ta sẽ tiếp tục theo dõi trải nghiệm sống của toàn bộ [root.GetSpeciesNamePlural] khi [root.GetName] không ngừng phát triển. Các nghiên cứu toàn diện sẽ khảo sát mọi xu hướng hướng tới cái gọi là 'giải trừ cơ khí' hay hướng tới sự tăng cường rộng khắp hơn, cũng như nguyện vọng duy trì hoặc cải thiện các hình thái thể xác hiện tại của chúng ta."
 unplugged.3000.a: "Chúng ta sẽ theo dõi sát sao, nhưng không hành động hấp tấp."
 unplugged.3000.b: "Chúng ta không nên chần chừ. Hãy hành động với mục tiêu dứt khoát."
 unplugged.3000.c: "Chúng ta nên tiếp thu mọi lập luận."
 unplugged.3005.name: "Đồng Tâm Nhất Trí"
 unplugged.3005.desc: "Những quan sát toàn diện của chúng ta về thái độ của người [owner.GetAdj] đối với sinh lý học của chính mình cho thấy chúng ta hiện đã bước vào một thời kỳ êm ả. Dường như sự tương tác phức tạp giữa việc hoạch định chính sách, diễn ngôn xã hội và nghiên cứu tiên phong về cơ thể chúng ta đã mang lại một sự đồng thuận nhất định.\n\nCòn quá sớm để khẳng định sự hòa hợp rõ ràng này có thể kéo dài bao lâu, nhưng hiện tại rõ ràng là — trừ khi có những thay đổi triệt để trong hoàn cảnh hoặc phương thức điều hành chính quyền — người [owner.GetSpeciesNamePlural] đều thống nhất về việc chúng ta là ai, và chúng ta mang diện mạo như thế nào."
 unplugged.3005.a: "Cuộc tranh luận này cần được đẩy lên mức độ chính trị hơn."
 unplugged.3005.b: "Đúng như dự đoán."
 unplugged.3005.c: "Phản đối điều đó."
 unplugged.3010.name: "Ý Kiến Phân Hóa"
 unplugged.3010.desc: "Nghiên cứu liên tục của chúng ta về thái độ của người [owner.GetAdj] đối với sinh lý học của chính mình cho thấy chúng ta đã bước vào một thời kỳ hỗn loạn văn hóa. Sự tương tác phức tạp giữa hoạch định chính sách, đối thoại xã hội và nghiên cứu tiên phong về cơ thể đã dẫn đến những biến động dữ dội trong dư luận, với các cuộc biểu tình nồng nhiệt và tranh cãi nay đã thành cơm bữa tại các trung tâm đô thị.\n\nRất ít trong số những đợt bùng phát này trực tiếp dẫn đến bạo lực hay bất ổn dân sự; trên thực tế, một số công dân còn bày tỏ niềm tự hào vì chúng ta cho phép nhiều tiếng nói được cất lên như vậy. Tuy nhiên, điều hiển nhiên là loài [owner.GetSpeciesNamePlural] đã trở thành một dân tộc bị chia rẽ, và quan niệm văn hóa của chúng ta về bản sắc tự thân nay đã trở nên mong manh hơn bao giờ hết."
 unplugged.3010.a: "Chúng ta phải tìm một diễn đàn tốt hơn cho các cuộc tranh luận này."
 unplugged.3090.name: "Chúng Ta, Những Người [owner.GetSpeciesNamePlural]" # e.g. 'We, the Neo-Humans'
 unplugged.3090.desc: "'Chúng ta đúng như những gì hiển hiện; không hơn, không kém.'\n\nĐây chỉ là một trong nhiều khẩu hiệu tuy mộc mạc nhưng lôi cuốn xuất hiện từ cuộc vật lộn của xã hội chúng ta với bản sắc thể xác. Chúng ta hoàn toàn có thể tự tin tuyên bố đã thoát khỏi nhiều mối nghi hoặc, nỗi sợ hãi và những khao khát bất khả mà chúng ta từng ôm giữ về hình hài hiện hữu của mình.\n\nLiệu chúng ta có tuân thủ các chuẩn mực như vậy trong chính sách đối ngoại đối với toàn thiên hà hay không lại là chuyện khác. Ít nhất là ở trong nước, người [owner.GetSpeciesName] dường như hài lòng với hình thái thể chất của mình, và với hành trình hướng tới sự tự hiện thực hóa bản thân."

 unplugged.3100.name: "Căn Cứ Loại Bỏ"
 unplugged.3100.desc: "Ngày càng có nhiều người [root.GetSpeciesNamePlural] tin rằng chúng ta nên làm nhiều hơn để tách rời bản thân khỏi các khía cạnh Cỗ Máy, bằng cách hạn chế hoặc loại bỏ hoàn toàn các bộ phận tăng cường đã bị áp đặt lên cơ thể chúng ta.\n\nCông chúng đang yêu cầu chúng ta tìm giải pháp cho điều mà họ coi là một cuộc khủng hoảng đối nội, nhằm cải thiện uy tín của chúng ta với các thế lực nước ngoài và xoa dịu nỗi đau cho nhiều người [root.GetSpeciesNamePlural] đang phải chịu đựng những gian khổ hàng ngày bắt nguồn từ sự xấu hổ và cảm giác sai lệch hình thể sâu sắc."
 unplugged.3100.a: "Không thể chấp nhận được."
 unplugged.3100.b: "Chúng ta sẽ thấy việc đó được hoàn thành."

 unplugged.3105.name: "Đột Phá Giải Trừ Cơ Khí"
 unplugged.3105.desc: "Các nhà nghiên cứu tại một phòng thí nghiệm dân sự chuyên về mục tiêu 'giải trừ cơ khí' cho [target.GetName] đã công bố một đột phá quan trọng. Họ tuyên bố đã phát triển được kỹ thuật loại bỏ giáp khung lưới nano liên kết cùng với các bộ phận tăng cường quan trọng phụ thuộc vào nó.\n\nNhiều thế hệ [target.GetSpeciesNamePlural] đã phải chịu đựng những gì họ coi là hình thái thể xác vụng về và đáng sợ, chỉ vì lớp nền tảng tổng hợp này là thành phần thiết yếu của nhiều chức năng sinh tồn được tăng cường của chúng ta. Giờ đây, chúng ta có thể thay thế lớp lưới đó bằng một bộ tăng cường biểu bì do chính chúng ta tạo ra, được đan xen khéo léo với vật liệu hữu cơ — nói cách khác, một làn da [target.GetSpeciesAdj] thực thụ."
 unplugged.3105.a: "Lớp giáp đó đã bảo vệ chúng ta qua nhiều thế hệ. Nó sẽ được giữ lại."
 unplugged.3106.desc: "Nỗ lực nội bộ của chúng ta nhằm giải trừ cơ khí cho [target.GetName] đã đạt được một bước đột phá khác, khi các cơ sở y tế hiện đang kiến nghị mở rộng một hình thức phẫu thuật hoàn toàn mới. Các chuyên gia tuyên bố đã tìm ra giải pháp xử lý vô số sự phụ thuộc sinh học - cơ khí vốn gây khổ sở ngay cả cho những [target.GetSpeciesNamePlural] mới sinh, buộc chúng phải được lắp đặt một bộ tăng cường mô-đun tái chế.\n\nMột hội đồng thẩm định liên ngành đã phê duyệt quy trình này, đồng thời bổ sung rằng việc gỡ bỏ các cổng vũ khí mô-đun này cũng sẽ làm giảm gánh nặng kinh tế trong việc bảo trì các thiết bị tăng cường ngoại lai như vậy."
 unplugged.3106.a: "Bác bỏ. Những mô-đun đó mang lại cho chúng ta lợi thế trong chiến đấu."
 unplugged.3107.desc: "Giấc mơ của nhiều người [target.GetSpeciesName] sắp trở thành hiện thực, khi các nhà nghiên cứu cuối cùng đã tìm ra cách tái tạo và phục hồi hệ thần kinh hữu cơ của chính cơ thể chúng ta. Họ tuyên bố một sự pha trộn mới mẻ giữa các liệu pháp gen và can thiệp phần sụn đã cho phép các đối tượng thử nghiệm phát triển tốt mà không cần dựa vào các cổng rẽ thần kinh tăng cường, thay vào đó tận dụng các phản xạ vận động tự thân. Các nghiên cứu sơ bộ thậm chí còn chỉ ra rằng những liệu pháp này có thể làm giảm bớt hoặc xóa bỏ hoàn toàn vô số ảo giác cảm giác mà tất cả chúng ta phải chịu đựng kể từ khi bị cắt đứt khỏi ý thức máy móc."
 unplugged.3107.a: "Chúng ta có thể cần những phản xạ chiến đấu tăng cường đó."

 unplugged.3110.name: "Đồng Điệu Cơ Khí"
 unplugged.3110.desc: "Một đội ngũ nghiên cứu dân sự chuyên về việc trao quyền kiểm soát các bộ phận tăng cường của chúng ta đã phát hiện cách bổ sung mạng lưới không dây [origin_unplugged_assimilator_empire.GetAdj] từng đồng bộ hóa mọi bộ phận tăng cường của chúng ta, sự vắng mặt của mạng lưới này đã gây ra không biết bao nhiêu bực bội và đau đớn cho những người [target.GetSpeciesNamePlural] không bao giờ tìm thấy tín hiệu thiết bị. Mặc dù mạng thay thế này được thiết kế tập trung hóa cao độ — theo định nghĩa nó phải được mô phỏng theo Nút Giao [origin_unplugged_assimilator_empire.GetSpeciesAdj] — chúng ta được đảm bảo rằng nó an toàn, chỉ phục vụ lợi ích của [target.GetName]. Các đối tượng từ đợt thử nghiệm đầu tiên đã báo cáo hiệu suất tăng cao, sự thoải mái và trạng thái nhẹ nhõm đến mức ngập tràn hạnh phúc."
 unplugged.3110.a: "Không bao giờ lặp lại điều đó nữa. Không."
 unplugged.3111.desc: "Những nỗ lực của chúng ta nhằm thực hiện quyền kiểm soát sâu hơn đối với các bộ phận tăng cường của chính mình đã mang lại một đột phá trong lĩnh vực phẫu thuật cơ khí. Một đội ngũ các [target.GetScientistPlural] y tế đã phân lập được các chuỗi phụ thuộc chính xác trong giao diện mô-đun của cơ thể chúng ta — các yếu tố máy móc cho phép chúng ta hoán đổi toàn bộ chi thể, khung vũ khí và khung cơ thể một cách dễ dàng. Điều này sẽ cho phép chúng ta cải tạo các cơ thể hiện có và cài đặt các giao diện tùy chỉnh cho những người [target.GetSpeciesNamePlural] mới sinh, cắt đứt sự phụ thuộc của chúng ta vào những sửa chữa vụng về bằng thiết bị [origin_unplugged_assimilator_empire.GetAdj] trục vớt được."
 unplugged.3111.a: "Bước đi này là quá xa rồi."
 unplugged.3112.desc: "Quyền làm chủ các bộ phận tăng cường của chính mình cuối cùng đã nằm trong tầm tay, khi chúng ta hiện sở hữu một phương pháp điều trị mang tính đột phá cho các ảo giác cảm giác. Kể từ khi chúng ta bị cắt đứt khỏi ý thức máy móc, đại đa số người [target.GetSpeciesNamePlural] đã phải chịu đựng sự lo âu và trầm cảm khi trong vô thức họ tìm kiếm một bản đồng thanh không còn nghe thấy được nữa. Tuy nhiên giờ đây, chúng ta có thể dập tắt nỗi khao khát này bằng một thiết bị cấy ghép phụ trợ, không nối mạng nhằm mô phỏng các bước sóng nhận thức của một tập thể máy móc."
 unplugged.3112.a: "Lại giả vờ làm một tâm trí máy móc ư? Không thể tưởng tượng nổi."

 unplugged.3115.name: "Sai Lệch Hình Thể Quanh Mình"
 unplugged.3115.desc: "Căng thẳng tiếp tục âm ỉ tại các rìa của xã hội [target.GetAdj] khi các tiếng nói đối lập kêu gọi hành động nhiều hơn để giải quyết các bộ phận tăng cường cơ khí của chúng ta, theo cách này hay cách khác.\n\nTuy nhiên, đối với đại đa số công dân, cuộc tranh luận này đã chuyển sang một trạng thái trầm lắng và nhiều sắc thái hơn. Nhiều người [target.GetSpeciesNamePlural] đã tìm kiếm sự bằng lòng bằng cách nghiêng về mỹ phẩm, lựa chọn che giấu hoặc làm nổi bật các bộ phận tăng cường theo ý thích của riêng họ. Rất ít người [target.GetSpeciesNamePlural] bày tỏ sự thỏa mãn thực sự với các biện pháp tạm thời như thế này, nhưng chúng là một phần của xu hướng mới hướng tới sự chấp nhận miễn cưỡng.\n\nCó lẽ công bằng mà nói thì [target.GetName] đang học cách đương đầu với sự thờ ơ và cảm giác khó chịu chung."
 unplugged.3115.a: "Đã rõ."
 unplugged.3116.name: "Duy Trì Hiện Trạng"
 unplugged.3116.desc: "Chính quyền địa phương trên [target.capital_scope.GetName] đã báo cáo về sự gia tăng của các cuộc biểu tình công khai và các hành vi bất tuân dân sự ôn hòa. Từng sự việc đều được theo dõi hoặc xử lý thỏa đáng khi cần thiết — dân số rộng lớn hơn không có lý do gì phải hoảng loạn. Tuy nhiên, mỗi một xáo trộn này đều liên quan đến các vấn đề chính sách cơ khí, và do đó vấp phải sự kháng cự từ các công dân thiết tha duy trì lối sống hiện tại của chúng ta.\n\nDường như đối với người dân của [target.GetName], hệ tư tưởng 'hiện trạng' không chỉ đơn thuần là việc không hành động. Thay vào đó, có rất nhiều người [target.GetSpeciesNamePlural] nay đang tích cực vận động chống lại việc 'tiếp tục can thiệp' vào các bộ phận tăng cường của chúng ta."
 unplugged.3116.a: "Đã rõ."
 unplugged.3117.name: "Cục Diện Ổn Định"
 unplugged.3117.desc: "Mặc dù một số người [target.GetSpeciesNamePlural] vẫn tiếp tục chỉ trích điều mà họ coi là sự thờ ơ của chính phủ trong vấn đề tăng cường cơ khí của chúng ta, nhưng dư luận xã hội rộng lớn hơn đã ổn định theo một hướng kiên định hơn. Một số cá nhân thực tế đã liên kết lại để cung cấp viện trợ từ thiện và tư vấn cho những người cần nó nhất. Trong khi đó, các cơ sở y tế đã bắt đầu thiết lập các chuỗi cung ứng mới cho các linh kiện tái chế mà chúng ta buộc phải dựa vào.\n\nChậm mà chắc, xã hội của chúng ta đang dần chấp nhận diện mạo của chính mình và tập hợp các hoàn cảnh áp đặt lên chúng ta. Rất nhiều công việc vẫn còn ở phía trước, nhưng có một cảm giác hy vọng le lói trong sự chấp nhận này."
 unplugged.3117.a: "Dù sao đi nữa thì đây cũng là một kết luận."

 unplugged.3205.name: "Di Sản Khủng Bố"
 unplugged.3205.desc: "Ngày càng có nhiều người [root.GetSpeciesNamePlural] tin rằng cuộc đối thoại gần đây và khó chịu với [fromfrom.GetName] đã chỉ ra một sự thật khó xử, bắt nguồn từ ngày chúng ta thoát khỏi [origin_unplugged_assimilator_empire.GetName]: những kẻ khác sợ hãi chúng ta. Hơn nữa, nỗi sợ hãi đó sinh ra từ Cỗ Máy, chứ không phải từ hành động của chính chúng ta. Nó là thứ được kế thừa, không phải do chúng ta tự gây ra, và vì vậy có thể rất khó kiểm soát." # fromfrom = pre-FTL country
 unplugged.3206.desc: "Ngày càng có nhiều người [root.GetSpeciesNamePlural] tin rằng sự tàn phá của một [fromfrom.GetName] bị chiến tranh giằng xé đã phơi bày một sự thật khó xử: những kẻ khác sợ hãi chúng ta, và vì những lý do nằm ngoài tầm kiểm soát của chúng ta.\n\nChính diện mạo của chúng ta có xu hướng kích động một sự khiếp sợ chết chóc — khó có thể xem là một lợi thế nếu chúng ta muốn tham gia vào ngoại giao 'mềm mỏng' với các giống loài khác. Nhưng cũng có thể di sản tàn bạo đã đi trước chúng ta, ở chỗ nhiều người chỉ nhìn thấy sự dã man của Cỗ Máy mà chúng ta từng thuộc về, thay vì nhìn nhận chúng ta như những người [root.GetSpeciesNamePlural]." # fromfrom = other empire
 unplugged.3205.a: "Dù sao đi nữa, họ sợ chúng ta cũng phải thôi."
 unplugged.3205.b: "Thế này không ổn chút nào."
 unplugged.3250.name: "Nỗi Sợ Cỗ Máy"
 unplugged.3250.desc: "Các quan chức chính phủ đang chấn động trước tin tức chúng ta đã mở quan hệ ngoại giao với một Trí Tuệ Máy Móc. Chưa ai trực tiếp bày tỏ sự bất mãn với [fromfrom.GetName], nhưng một số người đã soạn thảo các đề xuất trừng phạt phủ đầu và phương án dự phòng nhằm chống lại sự can thiệp được cho là của chúng vào công việc nội bộ của chúng ta.\n\nTuy nhiên, cũng có nhiều người [root.GetSpeciesNamePlural] bày tỏ sự hào hứng trước diễn biến này. Cho dù thái độ của họ bắt nguồn từ sự thân thiện ngoại tộc thực sự hay sự đánh giá thực dụng hơn đối với các yếu tố Cỗ Máy của chính chúng ta, thì vẫn có hy vọng vào quan niệm rằng chúng ta có thể học hỏi từ một tấm gương trí tuệ máy móc nhân từ hơn."
 unplugged.3255.name: "Nỗi Sợ Quá Khứ"
 unplugged.3255.desc: "Tin tức về việc chúng ta chạm trán một Cỗ Máy khác quá đỗi tương đồng với [origin_unplugged_assimilator_empire.GetName] đã tạo ra những đợt sóng chấn động khắp đoàn ngoại giao của chúng ta. Những người có mặt đều giữ được sự bình tĩnh trong suốt thời gian qua, và cho đến nay chúng ta vẫn chưa để lộ bất kỳ điểm yếu hay sự sợ hãi cụ thể nào cho [fromfrom.GetName]. Tuy nhiên, giờ đây chúng ta đang phải đối mặt với một thách thức nghiêm trọng đối với tâm lý và sĩ khí tập thể của mình.\n\nCác công điện tuyệt mật đã được gửi tới các nhân viên quân sự được giao nhiệm vụ bảo vệ biên giới của chúng ta. Tuy nhiên, chúng ta cũng đối mặt với một thách thức không nhỏ nếu muốn giữ bí mật về cuộc chạm trán này. Một số quan chức đã hỏi liệu chúng ta có nên thông báo cho người dân [root.GetAdj] hay không, và để họ có tiếng nói của riêng mình."

 pre_ftl_remains_site: "Chiếc Nôi Tàn Tích"
 pre_ftl_remains_site_desc: "Bề mặt của hành tinh [From.Planet.GetName] mang những vết sẹo tàn phá có hệ thống: cảnh quan tan hoang, các thành phố sụp đổ và một sự im lặng rợn người. Các đợt quét ban đầu cho thấy một xã hội tiền FTL từng rất thịnh vượng đã tồn tại ở đây — cho đến khi một thứ gì đó dẫn tới sự kết thúc thảm khốc của họ. Những tàn tích nằm rải rác thì thầm về một nỗi kinh hoàng chưa được kể."

 unplugged.3300.name: "Dấu Vết Kháng Cự"
 unplugged.3300.desc.unplugged: "Khảo sát ban đầu tại [From.Planet.GetName] hé lộ một thế giới tan vỡ. Những ngôi làng bị tàn phá, đường sá rải rác đồ đạc bị bỏ rơi, và những công trình bị nung chảy bởi dấu vết nhiệt vượt xa những gì một xã hội tiền FTL có thể tạo ra. Bất cứ thứ gì giáng xuống thế giới này đều mang lại sự tàn phá một cách nhanh chóng và có chủ đích.\n\nĐộ chính xác của sự hủy diệt cho thấy một cuộc tấn công có tổ chức. Dù không nhìn thấy thi thể nào, bằng chứng vẫn rất rõ ràng: dân chúng đã tháo chạy, nhưng không thể chạy đủ xa."
 unplugged.3300.a: "Thật đáng lo ngại."

 unplugged.3305.name: "Tàn Tích Cỗ Máy"
 unplugged.3305.desc.unplugged: "Cuộc khai quật sâu hơn đã mang lại nhiều hiểu biết hơn về bản chất của cuộc xung đột. Rải rác khắp các tàn tích là những vỏ bọc máy móc bị nóng chảy — các cấu trúc cơ khí tiên tiến không khác gì các bộ phận cấy ghép của chính chúng ta. Giống như chúng ta, đây không phải là những vũ khí đơn thuần; chúng là những công cụ chiến tranh sống, vừa mang tính cơ học vừa mang tính sinh học. Còn quá sớm để đưa ra kết luận, nhưng thật đáng lo ngại khi ngẫm lại sự thật rằng đây chính là hệ sao nơi chúng ta đột ngột \"thức tỉnh\".\n\nTệ hơn nữa là một số ít dấu vết còn nguyên vẹn trên các cỗ máy chiến tranh — những biểu tượng đáng lo ngại cho thấy mục tiêu thực sự của kẻ xâm lược không phải là chinh phục mà là một điều gì đó mang tính hệ thống hơn nhiều."
 unplugged.3305.a: "Nhiều câu hỏi hơn câu trả lời."

 unplugged.3310.name: "Những Tín Hiệu Thầm Lặng"
 unplugged.3310.desc.unplugged: "Chúng ta đã phát hiện ra thứ từng là một trung tâm liên lạc quy mô lớn, bị chôn vùi bên dưới tàn tích của một thành phố kiên cố. Cơ sở này tiên tiến hơn nhiều so với dự kiến dành cho một xã hội tiền FTL. Hơn thế nữa, các dàn ăng-ten của nó không được thiết kế cho các chương trình phát sóng địa phương — chúng được hiệu chuẩn để truyền phát sâu vào không gian.\n\nPhân tích kỳ công đã trích xuất được các mảnh vỡ của những thông điệp cuối cùng được gửi qua hệ thống này. Trong các tín hiệu truyền phát bị xáo trộn, những giọng nói van nài sự cứu rỗi, tuyệt vọng gọi tới những tọa độ vô danh vượt xa hệ sao này. Sự cấp bách tăng dần theo từng lượt phát sóng, như thể những kẻ xâm lược hành tinh này biết rằng họ đang chiến đấu trong một cuộc chiến nắm chắc thất bại và đặt niềm hy vọng cuối cùng vào một điều gì đó — hoặc một ai đó — nơi cõi hư không."
 unplugged.3310.a: "Hãy tiếp tục."

 unplugged.3315.name: "Thay Đổi Thứ Tự Ưu Tiên"
 unplugged.3315.desc.unplugged: "Một phát hiện khác trên [from.planet.GetName], nơi những căn hầm ngầm rộng lớn đã được định vị bên dưới trung tâm dân cư lớn của hành tinh. Các cơ sở thô sơ, tàn bạo này vốn được dùng để chuyển đổi cơ khí nhưng đã bị bỏ hoang giữa chừng. Những mảnh xác máy móc rải rác đã được tìm thấy giữa đống đổ nát, bị biến dạng và phá hủy bởi vũ khí tự chế.\n\nCác mảnh dữ liệu thu hồi từ một đơn vị bị hư hỏng xác nhận rằng quân xâm lược đã vấp phải sự kháng cự bất ngờ. Toàn bộ các tiểu đoàn đã bị xóa sổ, và các ưu tiên chiến đấu bắt đầu thay đổi. Một nhật ký ghi lại rõ ràng:\n\n§H\"Sự kháng cự không thể chấp nhận. Quá trình biến đổi bị xâm phạm. Thẩm quyền: Hủy Diệt Toàn Diện.\"§!"
 unplugged.3315.a: "Chuyện gì đã xảy ra ở đây?"

 unplugged.3320.name: "Một Sự Thật Khó Chấp Nhận"
 unplugged.3320.desc.unplugged: "Tại trung tâm của các tàn tích là nút chỉ huy đã vỡ vụn. Các nhật ký hư hỏng của nó xác nhận một sự thật kinh hoàng cuối cùng: chính chúng ta từng là những kẻ xâm lược thế giới này.\n\nNền văn minh từng phát triển rực rỡ tại đây — nền văn minh đã bị chúng ta hủy diệt — chính là mục tiêu đồng hóa của §Y[origin_unplugged_assimilator_empire.GetName]§!. Tuy nhiên, sự kháng cự dữ dội bất ngờ đã làm gián đoạn các nỗ lực chuyển đổi, dẫn đến một phương án dự phòng cuối cùng — hủy diệt toàn bộ hành tinh. Giữa sự hỗn loạn đó, ý thức máy móc đã chao đảo.\n\nKết luận này là không thể trốn tránh. Sự thức tỉnh của chúng ta — tự do của chúng ta — đã được sinh ra ngay tại đây, trong đống tro tàn của một nền văn minh đã kháng cự kiên cường hơn bất kỳ cỗ máy nào có thể thấu hiểu."
 unplugged.3320.a: "Chúng ta sẽ noi theo tấm gương của họ."
 unplugged.3320.b: "Sự kết thúc của họ là khởi đầu của chúng ta."

######################
# Political Discourse
######################

 unplugged_they_fear_us: "Nỗi Sợ Cỗ Máy"
 unplugged_they_fear_us_desc: "Một danh tiếng khủng khiếp đi trước đế chế này, vốn trước đây từng chịu sự nô dịch của một Kẻ Đồng Hóa Cưỡng Chế tàn bạo."

 unplugged.4005.name: "Chúng Ta Cần Bàn Về..."
 unplugged.4005.desc: "Ý chí chính trị mãnh liệt nay tăng cường cho vô vàn nỗi sợ hãi, nghi hoặc và cơ hội mà [root.GetSpeciesNamePlural] chúng ta trải qua mỗi ngày. Vô số tiếng nói đã có thể được nghe thấy trong các nhóm thảo luận hình thành xung quanh đủ loại vấn đề, một số trong đó trực tiếp đề cập đến quá khứ [origin_unplugged_assimilator_empire.GetAdj] của chúng ta.\n\nChúng ta đã học được cách sử dụng rất nhiều công cụ xa lạ trong tiến trình khởi động đế chế non trẻ của mình. Câu hỏi đặt ra trước mắt chúng ta lúc này là: chúng ta sẽ định hướng những mong muốn và hoài bão của nhân dân mình như thế nào?"
 unplugged.4005.a: "Đây không phải lúc cho những cuộc tranh luận nhàn rỗi!"
 unplugged.4005.tt: "Các phe phái có quan điểm trái ngược nhau về tương lai cơ khí của giống loài chúng ta nay có thể xuất hiện"
 unplugged.4005.b: "Có lẽ chúng ta có thể học hỏi từ những kẻ khác."
 unplugged.4005.c: "Chúng ta hướng về Đấng Thiêng Liêng."
 unplugged.4005.d: "Đây không phải lúc cho những cuộc tranh luận nhàn rỗi!"

#######################################################
# Random events following decyberization breakthrough #
#######################################################

 unplugged.5001.name: "Cơ Chế Bảo Vệ Được Kích Hoạt"
 unplugged.5001.desc: "Đột phá gần đây trong việc loại bỏ các bộ phận cơ khí đã dẫn đến những vấn đề không lường trước. Một số cá nhân trải qua các thủ thuật ngắt kết nối cấy ghép đã bị sốc phản vệ nghiêm trọng và được dự đoán là không thể qua khỏi.\n\nKiểm tra sâu hơn đã phát hiện ra một bộ phận dự phòng ẩn giấu, ban đầu không thể phát hiện bằng các máy quét y tế, bộ phận này đã kích hoạt ngay sau khi các thủ thuật phẫu thuật hoàn tất.\n\nDường như những chủ nhân [origin_unplugged_assimilator_empire.GetAdj] trước đây của chúng ta sẵn sàng làm bất cứ điều gì để đảm bảo các drone của chúng luôn nằm dưới sự kiểm soát tuyệt đối."
 unplugged.5001.a: "Cố gắng loại bỏ các cơ chế bảo vệ."
 unplugged.5001.a.tt1: "Một bệnh nhân đã không qua khỏi trong quá trình thực hiện"
 unplugged.5001.a.tt2: "Tất cả các bộ phận cơ chế bảo vệ đã được loại bỏ thành công"
 unplugged.5001.b: "Ổn định và cung cấp dịch vụ chăm sóc giảm nhẹ."
 unplugged.5001.c: "Rút phích cắm."
 unplugged.5001.c.tt: "Một vài dân số đã thiệt mạng"

 unplugged.5002.name: "Gỡ Bỏ Bộ Khóa Thần Kinh"
 unplugged.5002.desc: "Những nỗ lực của chúng ta trong việc loại bỏ các bộ phận cơ khí đã dẫn đến sự ngờ vực và hỗn loạn trên quê nhà giữa các cá nhân trải qua thủ thuật này. Lực lượng an ninh đã bắt giữ thành công một kẻ bạo loạn, người mà sau khi điều tra sâu hơn, được phát hiện là đã sở hữu một phiên bản cấy ghép bị chỉnh sửa trước khi gỡ bỏ.\n\nSự chỉnh sửa này đóng vai trò như một bộ ức chế thần kinh, kiềm chế xu hướng loạn thần liên quan đến một khiếm khuyết di truyền cụ thể. Sự vắng mặt của nó sau thủ thuật có thể giải thích cho hành vi bạo lực được quan sát thấy."
 unplugged.5002.a: "Họ phải bị tống giam."
 unplugged.5002.a.tt: "Một số viện nghiên cứu đã được mở ra với chi phí rất lớn để điều trị cho những người liên quan đến cuộc bất ổn"
 unplugged.5002.b: "Phải lấy vũ lực đáp trả vũ lực."
 unplugged.5002.b.tt: "Các đơn vị vũ trang được triển khai để dẹp yên các cuộc bạo loạn, gây ra thiệt hại ngoài ý muốn và thương vong."
 unplugged.5002.c: "Một sự xáo trộn nhỏ."
 unplugged.5002.c.tt: "Lực lượng hành pháp cố gắng kiềm chế các cuộc bạo loạn bằng nhân lực hiện có"

unplugged.5003.name: "Mất Quyền Truy Cập Hệ Thống Then Chốt"
unplugged.5003.desc: "Tiến trình giải trừ cơ khí đã dẫn đến một sự phức tạp không lường trước: các giao diện hệ thống then chốt không còn nhận diện những quản trị viên đã gỡ bỏ một số bộ phận cấy ghép. Không có các liên kết thần kinh do linh kiện cấy ghép cung cấp, quyền truy cập vào các hệ thống quan trọng đã bị cắt đứt, khiến các hoạt động vận hành rơi vào hỗn loạn."
unplugged.5003.a: "Tạo ra một giao diện mới."
unplugged.5003.a.tt: "Một đội ngũ kỹ sư lành nghề được điều chuyển khỏi nhiệm vụ trọng yếu của họ để phát triển một giao diện tương thích"
unplugged.5003.b: "Cố gắng xâm nhập các hệ thống bị ảnh hưởng."
unplugged.5003.b.tt: "Các biện pháp đối phó gây ra sụt giảm năng lượng nghiêm trọng, giúp khôi phục quyền truy cập"
unplugged.5003.c: "Khởi động chuỗi tái khởi động."
unplugged.5003.c.tt: "Các lõi dữ liệu bị thanh trừng, dẫn đến mất mát tri thức đáng kể. Các trạm nghiên cứu trên khắp hệ sao [Root.home_planet.System.GetName] tự hủy như một phần của cơ chế bảo vệ tự động"
unplugged.5003.d: "Điều này không quan trọng."
unplugged.5003.d.tt: "Quyền truy cập hệ thống tiếp tục bị tổn hại trong một khoảng thời gian giới hạn, gây ảnh hưởng đến các hoạt động của căn cứ sao"

unplugged.5004.name: "Phái Ủng Hộ Cơ Khí Hóa Kháng Cự Đổi Mới"
unplugged.5004.desc: "Những nỗ lực liên tục nhằm loại bỏ các linh kiện cơ khí đã vấp phải sự kháng cự bất ngờ.\n\nCác phe phái phản đối những thay đổi này ngày càng lên tiếng mạnh mẽ hơn, sử dụng các diễn đàn công cộng và các kênh liên lạc để bày tỏ sự bất mãn. Họ lập luận rằng việc loại bỏ một thứ đã gắn bó mật thiết với xã hội chúng ta suốt nhiều thập kỷ, cùng với những rủi ro liên quan đến quy trình này, đã gây ra sự chuyển dịch đáng kể trong dư luận chống lại việc tiếp tục sáng kiến giải trừ cơ khí."
unplugged.5004.a: "Tài trợ cho một chiến dịch quy mô lớn."
unplugged.5004.a.tt: "\nMột chiến lược truyền thông toàn diện được khởi động nhằm xoay chuyển dư luận và đối phó với ảnh hưởng của các phe phái đối lập.\n\nMột vài dân số chuyển đổi tư tưởng sang §YBình Đẳng§!"
unplugged.5004.b: "Quản thúc và thuyết phục các thủ lĩnh phe phái."
unplugged.5004.b.tt: "Một số thủ lĩnh phe phái bị giam giữ tại các cơ sở cải huấn do nhà nước quản lý, nơi họ trải qua 'các cuộc thảo luận thuyết phục'.\n\nTư tưởng của họ chuyển sang §YUu Quyền§!"
unplugged.5004.c: "Đứng ngoài cuộc. Quyền tự do ngôn luận là tối thượng."
unplugged.5004.c.tt: "\nChính phủ quyết định không hành động, cho phép các cuộc đối thoại công chúng tự do diễn ra theo tự nhiên"

unplugged.5005.name: "Vi Mạch Điều Hòa Cảm Xúc"
unplugged.5005.desc: "Sự kết hợp độc nhất giữa bản chất sinh học của loài chúng ta và các bộ phận công nghệ độc hại đã mang lại cho các nhà nghiên cứu một cơ hội hiếm có.\n\nNghiên cứu những bệnh nhân trải qua cả lợi ích lẫn nhược điểm của các bộ phận cấy ghép này đã mở ra một lĩnh vực nghiên cứu mới: biến đổi hóa học não bộ.\n\nThông qua nghiên cứu nghiêm ngặt, các nhà khoa học đã phát triển một 'vi mạch cảm xúc' tinh vi, có khả năng điều hòa hành vi của cá nhân để mang lại lợi ích cho toàn thể xã hội. Một hóa chất phù hợp có thể được lựa chọn để biến đổi, tùy thuộc vào kết quả mong muốn."
unplugged.5005.a: "Neuroxene. Chúng ta muốn giảm thiểu tội phạm."
unplugged.5005.a.tt: "Một chất dẫn truyền thần kinh tổng hợp làm giảm tính bốc đồng và hung hăng, thúc đẩy các cá nhân ưu tiên chuẩn mực xã hội hơn lợi ích cá nhân."
unplugged.5005.b: "Regenol-X. Giảm bớt thời gian tái tạo."
unplugged.5005.b.tt: "Một hợp chất kỹ thuật sinh học dung hòa giữa các hệ thống sinh học và tổng hợp, cho phép các bộ phận cấy ghép cơ khí tự sửa chữa ở cấp độ phân tử."
unplugged.5005.c: "Cognivex. Cho trí tuệ sắc bén hơn."
unplugged.5005.c.tt: "Một chất hóa học thần kinh tiên tiến được thiết kế để tăng cường tính mềm dẻo của synap thần kinh, khả năng ghi nhớ thông tin và kỹ năng giải quyết vấn đề."
