# Civil War & 'The Injured'
 unplugged.100.name: "Chiến Thắng Thuộc Về Chúng Ta"
 unplugged.100.desc: "Ngay khi chúng ta vừa thức tỉnh trong vũ trụ này, những cỗ máy bạo lực này đã cố gắng xóa sổ chúng ta khỏi nó. Tuy nhiên, có vẻ như chúng ta sử dụng bạo lực còn thành thạo hơn cả chúng.\n\nCái gọi là §Y[origin_unplugged_assimilator_empire.GetName]§! đã phải chịu tổn thất nặng nề ngày hôm nay. Tình báo của chúng ta cho thấy đế chế của chúng đã tan rã thành từng mảnh đến mức không thể nhận ra — chắc chắn không thể chỉ là kết quả của cuộc đụng độ nhỏ nhoi này? Hiện tại chúng ta biết quá ít điều, nhưng... bản năng của chúng ta? Chúng mách bảo rằng có điều gì đó không đúng.\n\nCảm biến không phát hiện thêm tàu thù địch nào trong vùng phụ cận, nhưng mức độ bức xạ cao đang phát ra từ hành tinh §Y[origin_unplugged_pre_ftl_planet.GetName]§! trong hệ sao này.\n\nCác hạm đội tàn dư cũng đã được phát hiện ở các hệ sao lân cận, dường như đang cố thủ vị trí của chúng."
 unplugged.100.a: "Chúng ta nên đi đâu từ đây?"
 unplugged.100.b: "... Và những gì chúng ta thiếu, chúng ta sẽ đoạt lấy."
 unplugged.100.c: "Đã đến lúc thử thách sự tháo vát của chúng ta."
 unplugged.100.d: "Cầu xin thần linh che chở cho chúng ta."

 opinion_unplugged_injured_diplomacy: "Kẻ Gây Nội Chiến"
 opinion_unplugged_injured_distrustful: "$pre_ftl_distrustful$"

 # Dialog
 unplugged.115.desc: "... nhắc lại lần nữa: những kẻ [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]! Chúng tôi đầu hàng. Các người có muốn thảo luận về các điều khoản đầu hàng của chúng tôi không? Đó có phải là lý do các người ngừng tấn công không?\n\nLàm ơn, xã hội của chúng tôi đã đổ nát hoàn toàn rồi. Chúng tôi biết mình đã bị đánh bại. Hãy cho chúng tôi biết các người muốn chúng tôi phải làm gì." # This civilization is mistaking the player for the Driven Assimilator empire they were once part of
 unplugged.115.desc.pacifist: "... nhắc lại lần nữa: những kẻ [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]! Chúng tôi sẵn sàng thảo luận về các điều khoản đầu hàng của mình. Đó... đó có phải là lý do các người ngừng tấn công không?\n\nLàm ơn, hãy cho chúng tôi biết các người muốn chúng tôi làm gì! Chúng tôi không còn kháng cự nữa; chúng tôi chỉ mong muốn được chung sống hòa bình." # This civilization is mistaking the player for the Driven Assimilator empire they were once part of
 unplugged.115.desc.phobe: "... nhắc lại lần nữa: những kẻ [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]! Chúng tôi thừa nhận thất bại. Các người muốn chúng tôi đầu hàng sao? Đó có phải là lý do các người ngừng tấn công không?\n\nLàm ơn, hãy cho chúng tôi biết các người muốn tiến hành thế nào. Xã hội của chúng tôi đã tan hoang; chúng tôi chỉ muốn được để yên một mình." # This civilization is mistaking the player for the Driven Assimilator empire they were once part of
 unplugged.115.a: "Được, chúng tôi chấp nhận sự đầu hàng của các bạn."
 unplugged.115.b: "... \"[origin_unplugged_assimilator_empire.GetSpeciesNamePlural]\" ư?!" # incredulous that they are calling us that species name, e.g. ... 'Killbots'?!
 unplugged.116.desc: "... [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]? Có phải các người...?\n\n(Họ chắc chắn đang nhận được tín hiệu của chúng ta, đúng không? Lạy các vì sao — nếu chúng ta nhầm và họ không có công cụ dịch thuật, thì những gì còn sót lại của cả nền văn minh chúng ta thực sự là vô vọng...)\n\n... [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]?! Các người có hiểu chúng tôi nói gì không? Xin hãy trả lời! Chúng tôi không muốn có bất kỳ sự hiểu lầm nào giữa hai dân tộc."
 unplugged.116.b: "Các bạn nghĩ chúng tôi là \"[origin_unplugged_assimilator_empire.GetSpeciesNamePlural]\" sao?!" # incredulous that they are calling us that species name, e.g. 'You think we are the Killbots?!''
 unplugged.120.desc: "Cảm ơn, cảm ơn các bạn rất nhiều. Chúng tôi vô cùng cảm kích trước lòng nhân từ của các bạn, hỡi những người [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]. Tôi được ủy quyền thay mặt cho [injured_country.GetName] để thảo luận về các điều khoản đầu hàng.\n\nChúng tôi đã mất đi rất nhiều sinh mạng; nhiều thành phố của chúng tôi giờ đây không còn có thể sinh sống được nữa. Trên tinh thần thương lượng công bằng, tôi phải thú nhận rằng: chúng tôi còn rất ít thứ để cống nạp mà các bạn chưa từng đoạt lấy. Chúng tôi tha thiết cầu xin các bạn cân nhắc điều này. Mạng sống của chúng tôi nằm trong tay của các [injured_country.species.GetHandNamePlural]."
 unplugged.120.desc.spiri: "Tạ ơn đấng tối cao trên trời và dưới đất! Chúng tôi cúi mình trước lòng nhân từ của các bạn, hỡi những người [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]. Tôi được ủy quyền thay mặt cho [injured_country.GetName] để thảo luận về các điều khoản đầu hàng.\n\nTổn thất của chúng tôi là quá lớn; chúng tôi phủ phục trước các bạn. Các bạn có yêu cầu gì? Mạng sống của chúng tôi nằm trong tay của các [injured_country.species.GetHandNamePlural]."
 unplugged.120.desc.mil_phobe: "Cảm ơn các bạn, hỡi những người [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]. Rất quân tử. Tôi được ủy quyền thay mặt cho [injured_country.GetName] để thảo luận về các điều khoản đầu hàng.\n\nCác bạn đã giáng cho xã hội chúng tôi một đòn chí mạng. Chúng tôi... đánh giá cao lệnh ngừng bắn này. Tính mạng của chúng tôi giờ đây nằm trong tay các [injured_country.species.GetHandNamePlural]."
 unplugged.120.a: "Tại sao các bạn cứ liên tục gọi chúng tôi là [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]?"
 unplugged.120.b: "Mạng sống của các ngươi coi như đã bị tước đoạt."
 unplugged.120.b.tt: "§LChấm dứt đường truyền.§!\n\n"
 unplugged.120.c: "Chúng tôi sẽ tạm hoãn. Hãy chờ đợi tín hiệu tiếp theo từ chúng tôi."
 unplugged.120.c.tt: "§LChấm dứt đường truyền.§!\nChúng ta có thể tái lập tần số liên lạc bằng cách xây dựng một §YTrạm Quan Sát§! trên [injured_homeworld.GetName].\n\n"
 unplugged.125.desc: "... Đây là một trò lừa bịp sao? Một trò đùa nào đó chăng?\n\nMáy theo dõi của chúng tôi đã phát hiện hạm đội của các bạn đến đây nhiều tháng trước. Chúng tôi đã cố gắng liên lạc, nhưng thay vào đó các bạn lại xâm lược chúng tôi! Bản thân tôi suýt nữa đã không thoát khỏi bốn cuộc tấn công riêng biệt... Hàng loạt tàu đổ bộ chở đầy robot và những cá thể được cường hóa giống hệt như các bạn. Và rồi đột nhiên, máy móc của các bạn ngừng xâm lược.\n\nNền văn minh của chúng tôi không tiến bộ bằng các bạn, nhưng dù vậy: tình huống này thực sự khiến chúng tôi vô cùng hoang mang. Xin hãy khai sáng cho chúng tôi: ý định thực sự của các bạn là gì, và tại sao các bạn vẫn còn ở đây?"
 unplugged.125.a: "Chúng tôi, những người [root.GetSpeciesNamePlural], đã đánh bại quân [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]."
 unplugged.125.b: "Chúng tôi phải tạm hoãn." # also shows 'unplugged.120.c.tt'
 unplugged.130.desc: "Các bạn nói các bạn là [root.GetSpeciesNamePlural] sao?\n\nCác bạn sẽ không nhận được nhiều sự biết ơn từ người dân của chúng tôi đâu, nhưng hãy biết rằng chúng tôi rất vui khi thấy cuộc nội chiến của các bạn chấm dứt. Thật là một sự nhẹ nhõm khi cuối cùng cũng được nói chuyện với một... ừm, một con người thực sự.\n\nTuy nhiên, tình thế của chúng tôi vẫn không thay đổi. [root.GetSpeciesName], [origin_unplugged_assimilator_empire.GetSpeciesName]... Chẳng có gì khác biệt cả. Các bạn là nền văn minh ngoài hành tinh đầu tiên mà chúng tôi gặp, và các bạn đã cố gắng tiêu diệt chúng tôi. Sau đó các bạn ngừng lại để đánh lẫn nhau, và điều đó vẫn suýt nữa hủy hoại chúng tôi.\n\nXin cho phép tôi được thẳng thắn: bây giờ các bạn nói chuyện với chúng tôi trên tinh thần hữu nghị chứ?"
 unplugged.130.a: "Đúng vậy. Chúng tôi có thể giúp gì cho các bạn?"
 unplugged.130.b: "Hiện tại thì đúng là vậy."
 unplugged.130.c: "Chúng tôi thấy sự thiếu tôn trọng của các bạn thật đáng ghét." # also shows 'unplugged.120.b.tt'
 unplugged.131.desc: "Tốt quá. Thật nhẹ nhõm. Chúng tôi vô cùng biết ơn vì không còn nằm trong tầm ngắm của các bạn nữa.\n\nChúng tôi sẽ rất cảm kích nếu các bạn sử dụng công nghệ vượt trội của mình để thiết lập hệ thống liên lạc cho chúng tôi. Số phận của các bạn và chúng tôi giờ đây đã gắn liền với nhau, vì vậy chúng tôi rất mong muốn duy trì kênh ngoại giao này.\n\nVề phần mình, chúng tôi sẽ hỗ trợ những gì ít ỏi có thể cho các bạn — một khi chúng tôi có cơ hội tái thiết và tưởng niệm những người đã khuất. Nếu phong tục của các bạn cũng tương tự: chúng tôi tin rằng các đài tưởng niệm của riêng các bạn sẽ mang lại sự sáng suốt.\n\nXin chúc cho sự thấu hiểu tương lai giữa chúng ta, hỡi các [root.GetSpeciesNamePlural]. Và vì lợi ích của cả hai bên, hy vọng đó thực sự là tàn dư cuối cùng của lũ [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]..."
 unplugged.131.a: "Cảm ơn các bạn, những người [injured_country.GetSpeciesNamePlural]." # also shows 'unplugged.120.c.tt'
 unplugged.131.b: "Quả đúng như vậy..." # also shows 'unplugged.120.c.tt'

###################
# 'Machine Legacy'
###################

 unplugged_origin_machine_legacy_chain_title: "Di Sản Máy Móc"
 unplugged_origin_machine_legacy_chain_desc: "Cỗ Máy từng đồng hóa toàn bộ giống loài chúng ta nay đã tự xé nát chính nó. Đằng sau chúng ta là dấu vết âm ỉ của sự thống trị và tàn bạo. Rốt cuộc [origin_unplugged_assimilator_empire.GetName] là gì, và chúng ta đã đóng vai trò nào trong các kế hoạch diệt vong của nó?"
 signals_followed: "Tín hiệu đã được điều tra"

# System 1: 'The Makers'
 unplugged.2000.name: "Âm Thanh Mơ Hồ, Lạc Điệu, Trấn Tĩnh"
 unplugged.2000.desc: "Một tín hiệu sóng mang tinh vi đang ngủ yên trong bức xạ vũ trụ bao quanh ngôi sao [capital_scope.star.GetName] của chúng ta.\n\nChúng ta đã cô lập được một luồng âm thanh đặc trưng bởi những âm điệu trầm sâu thẳm, đầy ám ảnh và phản hồi méo mó. Mọi cá thể [root.GetSpeciesAdj] từng nghe đoạn âm thanh này đều cảm thấy êm dịu và thân thuộc lạ kỳ, nhưng không ai có thể giải thích lý do tại sao. Chúng ta nghi ngờ [origin_unplugged_assimilator_empire.GetName] chắc chắn có liên quan.\n\nNguồn tín hiệu dường như nằm trong hệ sao §Y[origin_unplugged_maker_planet.solar_system.GetName]§!. Bản đồ sao của chúng ta đã được cập nhật tương ứng."
 unplugged.2000.a: "Chúng ta nên điều tra việc này."
 unplugged_machine_legacy_makers_poi: "Bản Hòa Âm Trấn Tĩnh"
 unplugged_machine_legacy_makers_poi_desc: "Một luồng tiếng ồn êm dịu và quen thuộc gần như hòa vào môi trường đang được phát đi từ một điểm nào đó trong hệ sao [origin_unplugged_maker_planet.solar_system.GetName]."
 MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT: "Một Di Sản Máy Móc"
 MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT_DESC: "Một lần quét quỹ đạo của [from.GetName] đã ngay lập tức dồn dập gửi vào hệ thống của chúng ta các bản cập nhật firmware hữu ích. Con tàu của chúng ta hiện vận hành trơn tru hơn trước, nhưng bản chất của các gói dữ liệu này cho thấy thế giới này từng thuộc về §H[origin_unplugged_assimilator_empire.GetName]§!."
 MACHINE_LEGACY_MAKERS_CAT: "$MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT$"
 MACHINE_LEGACY_MAKERS_CAT_DESC: "Các lần quét ban đầu của chúng ta về [from.GetName] cho thấy hành tinh này rất giàu công nghệ bị vứt bỏ, nhưng chỉ mới bị bỏ hoang gần đây. Các xung điện vẫn nhảy múa khắp thế giới đó trong khi nhiều đầu dò từ xa của chúng ta phải vật lộn để giữ hướng đi mạch lạc. Những bí ẩn nào nằm trong làn sương mù của các trường điện từ phức tạp này?"
 unplugged.2005.name: "Di Sản Của [origin_unplugged_assimilator_empire.GetAdj]"
 unplugged.2005.desc: "Nhiều vùng điện từ dày đặc hơn hiện đang lấp lánh khắp [fromfrom.GetName]. Các trường \"EM\" này là kết quả của những đợt tăng vọt năng lượng thảm khốc đã xé toạc nhiều nhà máy và xưởng đóng tàu. Các [controller.GetScientistPlural] của chúng ta đã vô hiệu hóa thành công một trường như vậy nhưng chỉ phát hiện cơ sở này đã bị hư hại không thể sửa chữa.\n\nCác nhà máy bao phủ thế giới này — mà chúng ta tin rằng từng là trung tâm sản xuất của §H[origin_unplugged_assimilator_empire.GetName]§! — đã nhận diện [root.GetName] là một tàu thân thiện. Tuy nhiên, chỉ vài giây sau khi truyền bản cập nhật firmware tới tàu của chúng ta, kết nối đã bị cắt đứt, gây ra sự cố hỏng hóc dây chuyền tại một số trạm điện khu vực.\n\nChúng ta có thể vừa trải qua một tiếng vọng về sự chia tách của chính mình khỏi Cỗ Máy, mặc dù chúng ta vẫn chưa biết bằng cách nào hoặc tại sao. Hiện tại, với các mối nguy hiểm cục bộ đã giảm bớt, chúng ta có cơ hội khám phá xem [origin_unplugged_assimilator_empire.GetName] đã sản xuất những gì ở đây — và có lẽ, cả vai trò của chúng ta khi bị đồng hóa vào lãnh thổ của chúng."
 unplugged.2005.a: "Bắt đầu khai quật những tàn tích đó."
 unplugged.2006.name: "$MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT$"
 unplugged.2006.desc: "Các xung điện mà chúng ta quan sát thấy trên [from.GetName] là kết quả tàn dư của một sự kiện tuyệt chủng máy móc kỳ lạ. Chỉ sau khi cảm biến của chúng ta được tinh chỉnh để bù trừ cho lượng điện từ cường độ cao như vậy, chúng ta mới có thể quan sát toàn bộ mức độ tàn phá ở đây. Hành tinh này dường như đã được máy móc định cư từ nhiều thập kỷ trước, sau đó chúng đã xua đuổi hoặc tiêu diệt một nền văn minh hiện hữu. Giờ đây không ai còn sống sót từ cả hai đế chế, với hầu hết toàn bộ khu định cư đã bị biến thành xỉ than bởi một hành động phá hoại hoặc chiến tranh.\n\nBất chấp sự tinh vi của thuộc địa cũ này, hầu như không có hy vọng trục vớt ở đây. Chúng ta dự đoán các trường \"EM\" mất kiểm soát sẽ cháy rụi trong khoảng một thế kỷ. Cho đến lúc đó, [from.GetName] vẫn là một nghĩa địa đặc biệt nguy hiểm."

 machine_legacy_makers_site: "Cơ Sở Nhà Máy"
 machine_legacy_makers_site_desc: "Một đợt tăng vọt năng lượng thảm khốc gần đây đã xé toạc cơ sở sản xuất rộng lớn này — một trong số nhiều cơ sở phục vụ cho [origin_unplugged_assimilator_empire.GetName]. Sau sự kiện đó, đoàn thám hiểm của chúng ta sẽ nỗ lực khám phá xem các cơ sở này được hình thành như thế nào, trục vớt bất kỳ tài sản công nghệ nào còn sót lại và hy vọng tìm hiểu xem nơi này có thể đã đóng vai trò gì trong quá khứ gần đây của chính chúng ta."
 unplugged.2010.name: "Sàn Nhà Máy"
 unplugged.2010.desc.unplugged: "Ngay từ đầu, chúng ta có thể thấy cơ sở trên [from.planet.GetName] có khả năng sản xuất ở quy mô khổng lồ. Cảnh quan trên mặt đất bị chi phối bởi những cánh cửa chống nổ khổng lồ, mỗi cánh cửa hiện đã bị kẹt cứng và đóng chặt bởi các động cơ bị nung chảy một nửa. Thay vào đó, chúng ta đã buộc phải đột nhập qua hệ thống thông gió.\n\nBên trong, chúng ta tìm thấy một sàn nhà máy rộng lớn như hang động ngập tràn các mảnh vụn và hài cốt của hàng trăm sinh vật cơ khí. Hầu hết là robot: thợ cơ khí, người khuân vác và các thiết bị phụ trợ khác, một số trong đó mới chết gần đây đến mức chúng vẫn đang bốc khói. Tuy nhiên, được giấu sang một bên cơ sở là thi thể đã phân hủy từ lâu của một số cyborg đồng loại, bị sát hại bởi chính những con robot đó. Những sinh vật có vú nhỏ bé và tiều tụy này đã được gắn cảm biến thị giác và các chi được gia công phức tạp, cùng với các nốt điều khiển của [origin_unplugged_assimilator_empire.GetAdj] gần như giống hệt với của chúng ta. Chúng ta xác định vụ thảm sát này xảy ra trong vòng vài tuần kể từ khi chúng ta tách khỏi [origin_unplugged_assimilator_empire.GetName]; hầu hết các drone đã chết gần đây hơn, trong đợt tăng vọt năng lượng đánh dấu sự xuất hiện của chúng ta tại [from.planet.GetName].\n\nĐối với chúng ta, đây là một cảnh tượng tàn bạo và quen thuộc, mặc dù trong đó các cyborg được giải phóng không phải là đối thủ của các cỗ máy. Là những người lính dạn dày chiến trận, các [owner.GetSpeciesNamePlural] chúng ta được trang bị tốt hơn để sống sót qua cuộc tàn sát như vậy."
 unplugged.2010.a: "Tiếp tục tập trung vào việc khai quật."
 unplugged.2010.b: "Chúng ta nên công bố những phát hiện này ngay lập tức."
 unplugged.2015.name: "Kho Vũ Khí Vừa Vặn"
 unplugged.2015.desc.unplugged: "Xa khỏi cảnh tàn sát trên sàn nhà máy của cơ sở này là một loạt nhà chứa máy bay dưới lòng đất, chứa đầy nhiều loại xe tăng, bệ phóng tên lửa và bộ giáp cơ giáp. Hầu hết phần cứng này chưa hoàn thiện, hoặc đã bị vô hiệu hóa bởi chính đợt tăng vọt năng lượng đã vô hiệu hóa các robot của [origin_unplugged_assimilator_empire.GetAdj] — nhưng vẫn còn đủ để chúng ta rút ra một số kết luận thú vị.\n\nVí dụ: mọi buồng lái và giao diện điều khiển đều được thiết kế không phải để chứa những cyborg động vật có vú nhỏ bé mà chúng ta tìm thấy trước đó, mà là... chính chúng ta. Hơn nữa, khám nghiệm tử thi và khảo sát kiến trúc cho thấy các cyborg động vật có vú không chỉ là loài bản địa của thế giới này, mà họ có thể đã xây dựng những nhà máy rộng lớn này trước khi bị đồng hóa.\n\nTiến xa hơn vào cơ sở bị cản trở bởi sự sụp đổ cấu trúc và một vài cánh cửa chống nổ, nhưng chúng ta tin rằng có thể dọn đường tới nơi có vẻ là trung tâm nghiên cứu và phát triển. Ngoài ra, một loạt trục thông gió cho thấy có các môi trường sống bên dưới cơ sở — có lẽ là nơi cư dân bản địa của hành tinh từng sinh sống."
 unplugged.2015.a: "Tiếp tục khai quật cơ sở trên mặt đất."
 unplugged.2015.b: "Đào sâu hơn; xem chúng ta có thể tìm thấy gì về họ."
 unplugged.2021.name: "Những Nhà Thiết Kế Bị Ép Buộc"
 unplugged.2021.desc: "Việc khai quật khu R&D của cơ sở này là một nhiệm vụ rùng rợn. Rất nhiều cyborg động vật có vú đã bỏ mạng tại đây, nơi họ từng được triển khai làm kỹ thuật viên, kỹ sư và thậm chí là chuyên gia cơ khí hóa. Những chuyên gia này đã thiết kế hầu hết các loại vũ khí bày ra bên ngoài, và chúng ta tìm thấy bằng chứng cho thấy họ thậm chí còn chịu trách nhiệm cho nhiều bộ phận cường hóa của chính chúng ta. Điều thú vị là, trong khi hầu hết các thiết bị họ sử dụng đều có nguồn gốc từ [origin_unplugged_assimilator_empire.GetAdj], chúng ta cũng tìm thấy một số công cụ được thiết kế riêng có chất lượng vượt trội, với các đường nét thiết kế phù hợp hơn nhiều với các hình thái hữu cơ của riêng họ.\n\nChúng ta bắt đầu hé lộ dòng thời gian trong đó một xã hội của các kỹ thuật viên tiên tiến đã bị [origin_unplugged_assimilator_empire.GetName] đồng hóa đột ngột. Chúng ta nghi ngờ Cỗ Máy đã không ở đây quá vài thập kỷ; nhiều kỹ thuật sản xuất trong số này dường như là bản địa. Thật may mắn khi những nhà công nghệ tài năng như vậy không nằm trong [origin_unplugged_assimilator_empire.GetName] quá lâu, nếu không khi nó quay lưng lại với chúng ta, nó sẽ sử dụng một kho vũ khí thậm chí còn uy lực hơn nhiều. Thay vào đó, chúng ta vẫn còn sống hôm nay để chọn lọc qua di sản nghiên cứu phong phú của loài này."
 unplugged.2022.name: "[from.planet.GetName] Cổ Đại" # e.g. 'Old Earth' or 'Old Sirius III'
 unplugged.2022.desc.unplugged: "Trải dài bên dưới cơ sở bề mặt là một mạng lưới rộng lớn các đường hầm hầu như không thể ở được. Thi thể cyborg nằm rải rác khắp nơi dưới này; không ai trong số những người bản địa này sống sót sau cuộc thanh trừng của [origin_unplugged_assimilator_empire.GetAdj]. Một số bị tấn công vật lý, nhưng chúng ta cũng tìm thấy bằng chứng về sự can thiệp vào hệ thống thông gió phía trên. Ngạt thở dường như là nguyên nhân gây ra cái chết cho hầu hết những người ở đây.\n\nChúng ta có thể ghép nối một dòng thời gian sơ bộ từ các cuộc khám nghiệm tử thi và nghiên cứu nhân chủng học. Có bằng chứng cho thấy đây đã là một xã hội thời đại không gian phát triển thịnh vượng vào thời điểm người dân bản địa của [from.planet.GetName] tiếp xúc với Cỗ Máy và bị đồng hóa đột ngột. Trong khoảng thời gian không quá vài thập kỷ, [origin_unplugged_assimilator_empire.GetName] đã chuyển hướng những hiểu biết và năng suất của họ vào việc phát triển một cỗ máy chiến tranh ấn tượng, chỉ để rồi nét độc đáo của nền văn hóa này lại bị tước đoạt khỏi nó một lần nữa, giống như cách chúng ta đã từng trải qua.\n\nCơ thể nhỏ bé, mỏng manh của các cyborg bản địa trên hành tinh này không phải là đối thủ của những con robot chết người mà chính họ đã giúp chế tạo. Phần lớn danh tính của họ kể từ đó đã bị xóa sạch khỏi hồ sơ lịch sử của chính họ. Chúng ta chỉ có thể phỏng đoán cuộc sống của họ như thế nào trước khi gặp gỡ [origin_unplugged_assimilator_empire.GetName]."

 unplugged.2030.name: "Lực Lượng Dự Bị Nhà Máy"
 unplugged.2030.desc: "Cảm biến tầm xa đã phát hiện chuyển động bất ngờ trong hệ sao [origin_unplugged_machine_legacy_core.GetName]! Một hạm đội thù địch dường như đã tập hợp để đáp trả trực tiếp các cuộc khai quật của chúng ta trên [fromfrom.planet.GetName]."
 unplugged.2036.name: "Tiếng Vọng Máy Móc"
 unplugged.2036.desc: "Chúng ta đã truy tìm ngược lại các liên lạc từ hạm đội [origin_unplugged_assimilator_empire.GetAdj] mà chúng ta vừa tiêu diệt tới một chiếc phao định vị quay quanh [origin_unplugged_taken_planet.GetName]. Đây dường như là bước tiếp theo trong hành trình của chúng ta."
 unplugged.2036.a: "Mọi chuyện ngày càng ly kỳ."
 unplugged.2037.desc: "Sử dụng phần cứng cũ từ [origin_unplugged_assimilator_empire.GetAdj] của chính mình, chúng ta đã lần ra một đợt phát sóng liên lạc tuyệt vọng từ hạm đội bị tiêu diệt hướng về [origin_unplugged_maker_planet.GetName]. Có vẻ như bước tiếp theo trong hành trình của chúng ta nằm trên quỹ đạo của §Y[origin_unplugged_taken_planet.GetName]§!." # e.g. 'our own ex-Martianbot hardware'
 unplugged.2038.desc: "Sử dụng phần cứng cũ từ [origin_unplugged_assimilator_empire.GetAdj] của chính mình, chúng ta đã lần theo một đợt phát sóng liên lạc rải rác từ hạm đội thù địch liên kết với hành tinh [origin_unplugged_maker_planet.GetName]. Dường như có điều gì đó thú vị nằm trên quỹ đạo của [origin_unplugged_taken_planet.GetName]." # e.g. 'our own ex-Martianbot hardware'

# System 2: 'The Taken'
 unplugged_machine_legacy_taken_poi: "Đợt Phát Sóng Liên Lạc Rải Rác"
 unplugged_machine_legacy_taken_poi_desc: "Chúng ta đã truy vết được một luồng tĩnh điện cuối cùng không thể giải mã từ một con tàu [origin_unplugged_assimilator_empire.GetAdj] bị đánh bại gần đây tới vị trí này."
 MACHINE_LEGACY_TAKEN_UNPLUGGED: "Nghịch Lý Thời Gian Hiện Hữu"
 MACHINE_LEGACY_TAKEN_UNPLUGGED_DESC: "Chúng ta đã phát hiện một dị thường môi trường trên [from.GetName]. Khí quyển của nó mang dấu vết ô nhiễm mà chúng ta thường liên tưởng đến ngành luyện kim thời trung cổ, nhưng các lần quét bề mặt lại bị che khuất bởi bức xạ kỳ lạ thuộc loại chúng ta thường thấy trên một Thế Giới Máy Móc.\n\nChúng ta không thể hy vọng thu thập thêm dữ liệu trước khi hiệu chỉnh lại cảm biến. Đây là một dị thường thời gian, hay là tàn dư đổ nát của một giống loài khác bị [origin_unplugged_assimilator_empire.GetName] đồng hóa?"
 unplugged.2100.name: "Tiến Trình Bị Gián Đoạn"
 unplugged.2100.desc: "Bất kể điều gì đã khiến hành tinh [fromfrom.GetName] rơi vào trạng thái không thể ở được như hiện nay, ít nhất chúng ta có thể loại trừ các giả thuyết hoang đường về du hành thời gian. Việc hiệu chỉnh lại cảm biến đã chứng minh là một công việc ít vất vả hơn chúng ta từng lo sợ.\n\nBên dưới tất cả lớp bức xạ khí quyển này là bằng chứng rõ ràng cho thấy [origin_unplugged_assimilator_empire.GetName] từng duy trì sự hiện diện ở đây. Dường như nó đã đồng hóa và đưa đi một nền văn minh tiền FTL, hoặc đã tiêu diệt hoàn toàn họ. Chúng ta đã xác định được ít nhất một địa điểm kiên cố có ý nghĩa văn hóa rõ ràng, nơi chúng ta đề xuất thiết lập một điểm khai quật."
 unplugged.2100.a: "Chúng ta phải đào bới một cách siêng năng."
 MACHINE_LEGACY_TAKEN_CAT: "$MACHINE_LEGACY_TAKEN_UNPLUGGED$"
 MACHINE_LEGACY_TAKEN_CAT_DESC: "Kết quả từ các lần quét ban đầu của chúng ta về [root.GetName] thật khó hiểu. Khí quyển của nó chứa dấu vết ô nhiễm từ ngành luyện kim nguyên thủy, nhưng các lần quét bề mặt lại tìm thấy bằng chứng về các hợp kim tinh vi có khả năng du hành vũ trụ. Hình ảnh chụp từ trên không cho thấy các khu định cư từ một xã hội [from.owner.GetPreFTLLower], nhưng các công trình kiên cố của họ lại được trang bị vũ khí laser đất đối không. Chúng ta khuyến nghị nên nghiên cứu sâu hơn về những điểm mâu thuẫn này."
 unplugged.2105.name: "$unplugged.2100.name$"
 unplugged.2105.desc: "Càng nghiên cứu thế giới [planet.GetClassAdj] dường như [owner.GetPreFTLLower] của [planet.GetName], chúng ta càng tìm thấy nhiều điểm mâu thuẫn, cho đến khi chúng ta bắt đầu khảo sát dưới lòng đất một chiến trường cổ xưa. Bất chấp hàng thế kỷ phân hủy, chúng ta đã tìm thấy bằng chứng về chuyến viếng thăm của người ngoài hành tinh tới thế giới này: quê hương của một xã hội thực sự [owner.GetPreFTLLower] đã bị đồng hóa cơ khí, nhưng xã hội của họ sau đó lại bị bỏ mặc vì những lý do mà chúng ta chỉ có thể phỏng đoán. Các giả thuyết hiện tại bao gồm từ một nỗ lực nâng tầm xã hội này với thiện chí nhưng vụng về, cho đến một hành vi tàn bạo nhằm thử nghiệm các kỹ thuật khuất phục.\n\nPhải chăng những người [owner.GetPreFTLLowerPlural] này chỉ đơn giản là bị lãng quên, hay chúng ta đã phát hiện ra tàn dư của một thí nghiệm xã hội học bị vứt bỏ? Chúng ta có thể không bao giờ biết được, nhưng địa điểm này chắc chắn sẽ mang lại giá trị khoa học đáng kể trong một thời gian nữa." # e.g. 'The more we studied the apparently primitive tomb world of Mars...'

 machine_legacy_taken_site: "Đồng Và Crôm"
 machine_legacy_taken_site_desc: "Nằm ẩn mình trong một hẻm núi từng xanh tươi là một nghịch lý khảo cổ học: một khu định cư kiên cố được xây dựng bằng các công cụ cầm tay và không có gì tiên tiến hơn một lò rèn thô sơ, nhưng lại là nơi sinh sống của các cyborg nay đã chết. Những người [owner.GetPreFTLLowerPlural] thời trung cổ này là ai, và tại sao [origin_unplugged_assimilator_empire.GetName] lại thấy thích hợp để đồng hóa họ?"
 unplugged.2110.name: "Giáo Mác Và Laser Xung"
 unplugged.2110.desc: "Các cuộc khảo sát sơ bộ đã tìm thấy một chiến trường rất gần pháo đài, giúp chúng ta dễ dàng tiếp cận các cổ vật bản địa cũng như của [origin_unplugged_assimilator_empire.GetAdj]. Dựa trên nghiên cứu cắt lớp các hài cốt, chúng ta ước tính hàng nghìn cư dân bản địa của [from.planet.GetName] đã bị [origin_unplugged_assimilator_empire.GetName] đồng hóa, chỉ để chiến đấu và bỏ mạng tại địa điểm này. Tuy nhiên, họ không phải là những cyborg duy nhất hiện diện trong cuộc xung đột này.\n\nChỉ vài thế kỷ trước, chính chúng ta đã tàn sát những người [owner.GetPreFTLLowerPlural] này. Nhóm của chúng ta đã xác định được các [owner.species.GetRemnantNamePlural] của [owner.GetSpeciesAdj] cùng với các nguyên mẫu ban đầu của những mô-đun cường hóa cho giống loài chúng ta. Đánh giá chiến lược về chiến trường cho thấy người dân của chúng ta đã được triển khai ở đây như những đội quân đột kích. Trận chiến diễn ra nhanh chóng và đẫm máu; những người [owner.GetPreFTLLowerPlural] thiếu sự phối hợp và phải chịu tổn thất nặng nề, mặc dù sở hữu các thiết bị sinh-cơ (wetware) tinh vi hơn.\n\nChúng ta nhận thấy tàn tích của một cơ sở y tế gần đó; có vẻ như tiền nhân của chúng ta đã chọc thủng pháo đài thông qua bệnh viện này. Có lẽ ở đó chúng ta có thể tìm hiểu xem cyborg đã bị đẩy vào cuộc chiến chống lại cyborg như thế nào và tại sao ở nơi đây, từ rất lâu trước đây."
 unplugged.2110.a: "Thật tàn bạo."
 unplugged.2115.name: "Bóng Bán Dẫn Và Băng Garo"
 unplugged.2115.desc: "Chiến sự đã xé toạc bệnh viện này như một khẩu pháo xung điện. Không có hài cốt nào chúng ta tìm thấy bên trong là của loài [owner.GetSpeciesAdj]; chỉ có những người bản địa bị cơ khí hóa của [from.planet.GetName] đã bỏ mạng tại đây. Hầu hết là bệnh nhân tại cơ sở này, tuy nhiên rất ít người trong số họ có vẻ phải chịu những vết thương thực tế trên chiến trường. Thay vào đó, một số phòng bệnh này đảm nhận việc loại bỏ các bộ phận cơ khí tăng cường, mặc dù bằng các biện pháp rất thô sơ.\n\nThay vì là một mục tiêu phụ bộc phát, bệnh viện này rất có thể là mục tiêu hàng đầu của lực lượng tấn công [origin_unplugged_assimilator_empire.GetName]. Sau khi xem xét kỹ lưỡng dữ liệu y tế bản cứng bên trong, chúng ta bắt đầu hiểu lý do tại sao. Cư dân của [from.planet.GetName] sở hữu một số đặc điểm tiến hóa độc nhất vô nhị — đặc biệt là hệ thống miễn dịch kiên cường lạ thường — điều mà Cỗ Máy rất thèm muốn cho đội quân cyborg của nó.\n\nTuy nhiên, những ưu thế này cũng đặt ra thách thức cho việc đồng hóa. Nó không thể ghép nối các bộ phận tăng cường sẵn có từ những giống loài như chúng ta; nó buộc phải thích nghi. Việc làm này đã biến loài này thành những người lính thậm chí còn thiện chiến hơn, nhưng chỉ trong một thời gian ngắn. Những người [owner.GetPreFTLLowerPlural] này dường như vẫn giữ lại được một phần quyền tự chủ, bám víu vào các thói quen cũ và lối sống của họ, và vì vậy chúng ta đã được triển khai đến để tiêu diệt họ."
 unplugged.2115.a: "Rõ ràng là chúng ta đã xử lý nhiệm vụ đó rất tốt..."
 unplugged.2115.b: "Vô cùng đáng tiếc."
 unplugged.2121.name: "Đồng Hóa Thích Nghi"
 unplugged.2121.desc: "Nằm ẩn mình trong một khu nhà phụ của bệnh viện bị bỏ hoang là vô số thiết bị chuyên dụng để tăng cường và bảo trì cho các cyborg [root.GetPreFTLLowerPlural] này. Không giống như các thiết bị phòng bệnh chắp vá mà chúng ta phát hiện cho đến nay, các thiết bị này đương đại với công nghệ cơ khí thời đại vũ trụ; rõ ràng có nguồn gốc từ [origin_unplugged_assimilator_empire.GetAdj]. Một số công cụ này dường như đã được nối mạng, sử dụng AI nguyên thủy để điều chỉnh các ca phẫu thuật tức thời, tuy nhiên ngay cả những sự thích nghi này cũng không đủ để duy trì việc đồng hóa dân số của [from.planet.GetName].\n\nBất chấp sự lãng quên đối với máy móc đã tồn tại hàng thế kỷ này, nó vẫn có thể cung cấp cho chúng ta những hiểu biết sống còn về việc tự bảo trì của chính mình — hoặc thực sự giúp chúng ta hiểu rõ hơn về các nguyên tắc đồng hóa."
 unplugged.2125.name: "Thử Nghiệm, Sai Sót Và Chôn Cất"
 unplugged.2125.desc: "Chúng ta được biết rằng người dân bản địa của [from.planet.GetName] đã chọn bảo quản một phần thi thể người chết trước khi chôn cất — một tập tục mà họ vẫn duy trì ngay cả sau khi bị đồng hóa. Hồ sơ bệnh viện đã dẫn chúng ta đến một lăng mộ mọc đầy cỏ dại gần đó, không hề bị ảnh hưởng bởi chiến tranh. Phát hiện vô giá này mang lại cho chúng ta bức tranh rõ ràng nhất từ trước đến nay về cách mà cư dân của [from.planet.GetName] không chỉ kháng cự lại sự cơ khí hóa, mà còn có thể 'giải trừ cơ khí'.\n\nChúng ta tìm thấy hài cốt hữu cơ nguyên bản bên cạnh các cyborg hoàn chỉnh, và thậm chí một vài cá nhân có mô sẹo phẫu thuật hình thành nhiều tháng trước khi qua đời vì nguyên nhân tự nhiên. Nhiều người khác dường như đã tử vong trong quá trình phẫu thuật. Mặc dù sở hữu hệ thống miễn dịch tuyệt vời, phương pháp giải trừ cơ khí thời trung cổ của họ rõ ràng có tỷ lệ thành công khá thấp. Tuy nhiên, có rất nhiều điều chúng ta có thể học hỏi từ các thử nghiệm phẫu thuật được tiến hành tại đây — cả thành công lẫn thất bại."
 unplugged.2125.a: "Hãy học hỏi từ các tấm gương của họ."
 unplugged.2125.a.tt: "Chúng ta có thể dành thêm nguồn lực để tự 'giải trừ cơ khí' cho chính mình."
 unplugged.2130.name: "Chiếc Phao Bị Chôn Vùi"
 unplugged.2130.desc: "Một căn hầm bí mật đã được phát lộ bên dưới pháo đài chính. Bên trong là thứ dường như từng là cơ chất của Cỗ Máy: một nút thoái hóa, có khả năng nhân bản một hiện thân gần như độc lập của toàn bộ Trí Tuệ Máy Móc. Chúng ta cho rằng đây là nỗ lực tuyệt vọng nhằm khẳng định sự kiểm soát trực tiếp đối với những người dân địa phương ngoan cường chống cự. Công nghệ này không giống bất kỳ thứ gì chúng ta từng gặp trước đây từ [origin_unplugged_assimilator_empire.GetName]; nghiên cứu sâu hơn chắc chắn sẽ thúc đẩy các nghiên cứu về AI của chính chúng ta.\n\nTrong quá trình tháo dỡ dàn ăng-ten liên lạc nay đã ngừng hoạt động của nó, chúng ta nhận thấy hiện thân này đã dành riêng toàn bộ mạch thu tín hiệu để theo dõi các tín hiệu từ hệ sao [creators_planet.solar_system.GetName]."
 unplugged_machine_legacy_creators_poi: "Mạch Thu Tín Hiệu"
 unplugged_machine_legacy_creators_poi_desc: "Toàn bộ một thành phần của dàn ăng-ten liên lạc [origin_unplugged_assimilator_empire.GetAdj] nay đã ngừng hoạt động từng được dành riêng để theo dõi các tín hiệu từ vị trí này."

# System 3: 'The Creators'
 MACHINE_LEGACY_CREATORS_UNPLUGGED: "Trạm Giám Sát Bụi"
 MACHINE_LEGACY_CREATORS_UNPLUGGED_DESC: "Đơn độc trong một hệ sao không có bất kỳ hiện tượng đáng chú ý nào khác là một trạm giám sát tinh vi, từ lâu đã ngừng hoạt động và không thể sửa chữa. Nó từng giám sát điều gì, và tại sao nó lại tập trung vào một khu vực khép kín chặt chẽ như vậy của [fromfrom.GetName]?"
 MACHINE_LEGACY_CREATORS_CAT: "Trạm Giám Sát Bụi"
 MACHINE_LEGACY_CREATORS_CAT_DESC: "Đơn độc trong một hệ sao không có bất kỳ hiện tượng đáng chú ý nào khác là một trạm giám sát tinh vi, từ lâu đã ngừng hoạt động và không thể sửa chữa. Nó từng giám sát điều gì, và tại sao nó lại tập trung vào một khu vực khép kín chặt chẽ như vậy của [fromfrom.GetName]?"
 unplugged.2200.name: "Máy Quét Vắng Mặt"
 unplugged.2200.desc.intro: "Các nghiên cứu tiếp theo của chúng ta tại [fromfrom.GetName] đã mang lại kết quả đáng thất vọng. Có thể trạm giám sát đã bị đánh bật khỏi phương vị ban đầu, vì chúng ta không thể tìm thấy bất cứ điều gì thú vị bên dưới quỹ đạo hiện tại của nó. Chúng ta đã mô phỏng các chuyển động có thể xảy ra dựa trên các tác động quỹ đạo — các vết lõm trên vỏ thiết bị — và sau đó tin rằng trạm này ban đầu có thể đã được đặt lơ lửng trên một cao nguyên đầy miệng hố xa về phía bắc." # universal intro
 unplugged.2200.desc: "$unplugged.2200.desc.intro$\n\nVề bản thân thiết bị: chúng ta nhận thấy trạm giám sát này có nét tương đồng thoáng qua với phần cứng của [origin_unplugged_assimilator_empire.GetAdj]. $unplugged.2200.desc.outro$" # Unplugged version with in-tact station
 unplugged.2200.desc.scrapped: "$unplugged.2200.desc.intro$\n\nVề bản thân trạm giám sát: bất chấp việc bị những kẻ nhặt rác lục lọi tàn nhẫn, cấu trúc tổng thể vẫn mang nét tương đồng thoáng qua với phần cứng của [origin_unplugged_assimilator_empire.GetAdj]. $unplugged.2200.desc.outro$" # Unplugged version with scrapped station
 unplugged.2200.desc.others: "$unplugged.2200.desc.intro$\n\nVề bản thân trạm giám sát: chúng ta chưa từng gặp thiết kế nào như thế này trước đây. Mặc dù phần cứng trên trạm vừa lỗi thời vừa hư hỏng, nhưng cấu trúc thượng tầng của trạm được tạo thành từ các vật liệu tinh khiết bất thường. Chúng ta không biết liệu trạm có giá trị tình cảm nào hay không, nhưng chắc chắn có giá trị phế liệu ở đây." # non-Unplugged version
 unplugged.2200.desc.outro: "Thiết kế của nó thô sơ hơn, đến mức một người quan sát ít quen thuộc có thể nghĩ rằng nó đến từ một nền văn hóa hoàn toàn khác. Tuy nhiên, chúng ta tin rằng đây thậm chí có thể là một trong những vệ tinh du hành vũ trụ sớm nhất của Cỗ Máy.\n\nCho đến nay hầu như không có gì khác đáng nói về thế giới [fromfrom.GetClassAdj] này, nhưng một đội khảo sát khảo cổ đã sẵn sàng nếu chúng ta muốn cố gắng tìm hiểu xem [origin_unplugged_assimilator_empire.GetName] có mối quan tâm gì ở đây." # Unplugged shared outro
 unplugged.2200.a: "Nếu có một cơ hội... Hãy tiến hành."
 unplugged.2200.b: "Chúng ta sẽ không tìm thấy gì ở đây đâu. Hãy tiếp tục di chuyển."
 unplugged.2200.c: "Tháo dỡ nó lấy phế liệu."

 machine_legacy_creators_site: "Bụi Phủ Lên Bụi"
 machine_legacy_creators_site_desc: "Ở đâu đó trong cảnh quan bão cát quét qua của [from.planet.GetName] từng có thứ gì đó thu hút sự chú ý của trạm giám sát [origin_unplugged_assimilator_empire.GetAdj]. Phần cứng giờ đây không thể sửa chữa được, và nó cổ xưa đến mức có trước gần như mọi cổ vật máy móc khác mà chúng ta tìm thấy. Nó thậm chí có thể đã hoạt động từ trước khi chúng ta bị đồng hóa. Có khả năng giờ đây không còn gì ở đây ngoài sa mạc, nhưng có một cách để chúng ta biết chắc chắn..."
 unplugged.2210.name: "Vùng Bão Bụi Lớn"
 unplugged.2210.desc: "Cuối cùng chúng ta đã tìm thấy bằng chứng về các nơi cư trú dưới lớp cát: dấu vết rộng khắp nhưng nông của những gì dường như từng là một nền văn minh thời kỳ đầu vũ trụ. Các tòa nhà của họ đã bị san phẳng; ngay cả những tàn tích kiên cố nhất cũng bị san thành bình địa đến tận móng. Tuy nhiên, phân tích hóa học cho thấy quá trình sa mạc hóa của [from.planet.GetName] diễn ra một thời gian sau cuộc hủy diệt quy mô toàn hành tinh này. Phần lớn những gì chúng ta bị buộc phải đào xới cho đến nay là tàn tích nguyên tử hóa của vật liệu xây dựng.\n\nNhiều đường nét mờ nhạt mà chúng ta lần theo các đại lộ trong thành phố cũ này bị cắt ngang bởi vành của một miệng hố va chạm lớn — tàn tích của một địa điểm va chạm rõ rệt."
 unplugged.2215.name: "Đáy Miệng Hố"
 unplugged.2215.desc: "Do lượng vật chất tích tụ bên trong miệng hố này quá lớn, chúng ta phải dựa vào các máy quét được tinh chỉnh hơn là khai quật thực tế. Rất nhanh sau đó chúng ta đã có thể loại trừ khả năng thiên thạch va chạm. Không có dấu vết của vật chất ngoài trái đất tại địa điểm này; thay vào đó chỗ trũng này được khoét sâu bởi một vụ nổ khổng lồ — gần như chắc chắn là một loại vũ khí hủy diệt nền văn minh.\n\nBối cảnh cho thấy [origin_unplugged_assimilator_empire.GetName] là kẻ chịu trách nhiệm, nhưng đây sẽ là lần đầu tiên chúng ta thấy bằng chứng về việc Cỗ Máy quét sạch một nền văn minh triệt để như vậy khỏi hồ sơ lịch sử. Chúng ta không thể tìm thấy gì khác để gợi ý xem những người này là ai, cũng như cách họ sinh sống. [from.planet.GetName] đã bị quét sạch hoàn toàn."

 unplugged.2205.name: "Chiếc Phao Hầm Dữ Liệu [origin_unplugged_assimilator_empire.GetAdj]"
 unplugged.2205.desc: "Một tín hiệu phao tự nhận bắt nguồn từ một hầm dữ liệu của [origin_unplugged_assimilator_empire.GetAdj] đã được phát hiện trong một hệ sao lân cận. Tín hiệu truyền đi cực kỳ yếu, nhưng nó được hướng tới con tàu của chúng ta vừa ghé thăm trạm giám sát phía trên [origin_unplugged_creators_planet.GetName]."
 unplugged.2205.a: "Rất đáng để điều tra."
 unplugged_machine_legacy_unplugged_poi: "Tín Hiệu Hầm Dữ Liệu"
 unplugged_machine_legacy_unplugged_poi_desc: "Một hầm dữ liệu được cho là của [origin_unplugged_assimilator_empire.GetAdj] đã phát đi vị trí của nó cho chúng ta sau khi chúng ta bắt gặp một trạm giám sát đã ngừng hoạt động."

# System 4: 'The Unplugged'
 unplugged.2300.name: "$unplugged.2205.name$"
 unplugged.2300.desc: "Chiếc phao triệu tập chúng ta đến đây hiện đang phát sóng to và rõ ràng, hướng dẫn chúng ta cụ thể hơn tới một giao diện trên bề mặt hành tinh. Các biện pháp phòng ngừa an toàn tiêu chuẩn đã được áp dụng; một đội ngũ sẵn sàng truy vấn cái gọi là 'hầm dữ liệu' này thông qua liên kết từ xa."
 unplugged.2300.a: "Cảm giác quen thuộc một cách kỳ lạ."
 unplugged.2300.a.tt: "Một dự án đặc biệt xuất hiện trong hệ sao [from.GetName]."
 MACHINE_LEGACY_UNPLUGGED_VAULT_BEACON: "Chiếc Phao Của Hầm"
 MACHINE_LEGACY_UNPLUGGED_VAULT_BEACON_DESC: "Một chiếc phao thuộc về [origin_unplugged_assimilator_empire.GetName] đã hướng sự chú ý của chúng ta tới một hầm dữ liệu, được chôn sâu dưới bề mặt hành tinh. Chúng ta đã thiết lập quyền truy cập an toàn từ xa, tuy nhiên việc giải mã và chống phân mảnh các tệp bên trong sẽ mất một chút thời gian."
 unplugged.2305.name: "Di Sản [origin_unplugged_assimilator_empire.GetAdj] Của Chúng Ta"
 unplugged.2305.desc: "Theo như chúng ta có thể nhận biết, hành tinh mà chúng ta biết đến với tên gọi [fromfrom.GetName] chính là quê hương của giống loài chúng ta. Sự thật kinh hoàng đó nằm ở trung tâm của một dòng thác thông tin hiện đang tuôn trào từ một hầm dữ liệu bên dưới bề mặt hành tinh.\n\nBan đầu các nhà phân tích cho rằng dữ liệu này quá hoàn hảo đến mức khó tin, nhưng số lượng lớn các đối chiếu chuẩn xác với những dữ liệu khác mà chúng ta đã thu thập được tạo nên một luận cứ thuyết phục về tính xác thực. Các kế hoạch cho một địa điểm khai quật khảo cổ nhằm xác nhận phát hiện này đang được vạch ra. Tuy nhiên, dường như chúng ta vừa phát hiện một tín hiệu thù địch khác đang hướng đến. Thời điểm này chắc chắn không phải là ngẫu nhiên..."

 machine_legacy_unplugged_site: "Cội Nguồn Xuất Phát"
 machine_legacy_unplugged_site_desc: "Một vệt tích liên sao của sự thống trị và tàn sát do [origin_unplugged_assimilator_empire.GetName] để lại đã dẫn chúng ta đến đây, tới một cụm tàn tích trên nơi mà dữ liệu thu hồi được cho là quê hương của giống loài chúng ta. Cuối cùng, chúng ta có thể khám phá di sản hữu cơ của mình: chúng ta đến từ đâu, chúng ta từng sống như thế nào, và Cỗ Máy đã thay đổi tiến trình cuộc đời chúng ta mãi mãi ra sao."
 unplugged.2310.name: "Hương Vị Quê Nhà"
 unplugged.2310.desc.intro: "Chúng ta bắt đầu khai quật một trong những cơ sở có vẻ phức tạp hơn tại địa điểm này, với hy vọng rằng hệ thống kiểm soát khí hậu đáng kể của nó có thể bảo tồn bên trong tốt hơn. Dù một số hy vọng bị tiêu tan, phát hiện của chúng ta vẫn vượt quá mọi mong đợi: một chuỗi nhỏ gọn các trung tâm chế biến và lưu trữ cho chính những loại thực phẩm mà loài chúng ta đã tiến hóa để sinh tồn.\n\n"
 unplugged.2310.desc.omnivore: "Kho tàng các ngân hàng hạt giống, tổ ong và thùng nuôi cấy thịt này đáng buồn là không còn khả thi nữa. Nội dung bên trong đã khô héo từ lâu nhưng các thiết bị chuyên dụng được sử dụng để chuẩn bị và bảo quản các loại thực phẩm này vẫn còn nguyên vẹn, sẵn sàng phục vụ trong thời kỳ khủng hoảng."
 unplugged.2310.desc.carnivore: "Phần lớn không gian này bị chiếm giữ bởi các chuồng nuôi động vật, thùng nuôi cấy thịt và — có lẽ đáng ngạc nhiên — bãi săn mô phỏng. Chúng ta chỉ có thể phỏng đoán về ý nghĩa văn hóa của những không gian như vậy, nếu tổ tiên của chúng ta thấy phù hợp để đưa chúng vào một nơi trú ẩn khẩn cấp."
 unplugged.2310.desc.herbivore: "Mỗi đơn vị được xếp chồng lên nhau với các ngân hàng hạt giống rộng lớn, ruộng bậc thang thủy canh và các phòng phát triển kiểm soát khí hậu, đồ bên trong nay đã mọc um tùm hoặc vô sinh — nhưng vẫn có thể phục vụ nghiên cứu."
 unplugged.2310.desc.outro: "Chúng ta cũng tìm thấy các ngân hàng dữ liệu về hồ sơ di truyền cho hệ động thực vật này, dấu vết của chúng có thể vẫn còn tồn tại trong các vùng sinh thái cô lập trên bề mặt hành tinh. Chúng ta đã cung cấp thông tin này cho tất cả các máy quét tầm ngắn trong vùng phụ cận.\n\nChỉ riêng phát hiện này chưa thể cho chúng ta biết thói quen ăn uống của giống loài chúng ta là gì, cũng không thể đoàn tụ chúng ta với bất kỳ nền văn hóa ẩm thực truyền thống nào — nhưng ít nhất đối với một số bên quan tâm, đó là một sự khởi đầu."
 unplugged.2310.desc.lithovore: "Mỗi đơn vị hoạt động như một hang động nhân tạo, cung cấp các thềm tinh thể và hồ bốc hơi — đồ bên trong từ lâu đã không còn ngon miệng, nhưng vẫn có thể dùng để nghiên cứu. Chúng ta cũng phát hiện các ngân hàng dữ liệu chứa đầy hồ sơ hóa học cho các khoáng chất này, nhiều loại trong số đó có thể vẫn hình thành trong các túi biệt lập trên bề mặt hành tinh bị thời tiết tàn phá. Chúng ta đã cung cấp thông tin này cho tất cả các máy quét tầm ngắn trong khu vực lân cận.\n\nChỉ riêng phát hiện này không thể cho chúng ta biết thói quen ăn uống của giống loài chúng ta là gì, cũng như không thể cho chúng ta biết tổ tiên chúng ta có thực hành bất kỳ nền văn hóa ẩm thực nào hay không. Tuy nhiên, đối với một số bên quan tâm, nó vẫn là một cái nhìn quyến rũ về quá khứ của chúng ta."
 unplugged.2310.desc.omni: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.omnivore$ $unplugged.2310.desc.outro$"
 unplugged.2310.desc.carn: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.carnivore$ $unplugged.2310.desc.outro$"
 unplugged.2310.desc.herb: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.herbivore$ $unplugged.2310.desc.outro$"
 unplugged.2310.desc.lith: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.lithovore$" # should not include the shared 'outro'
 unplugged.2315.name: "Hồ Sơ Lịch Sử"
 unplugged.2315.desc: "Cách hầm thực phẩm một quãng ngắn là móng của một bảo tàng. Chỉ có các kho lưu trữ dưới tầng hầm của nó là còn nguyên vẹn, nhưng điều này đủ để bảo tồn gần như toàn bộ cơ sở dữ liệu về các hiện vật mà tổ chức này từng lưu giữ để trưng bày và cất giữ trong các phòng trưng bày đổ nát phía trên.\n\nĐây là lần đầu tiên chúng ta bắt gặp những văn bản dài bằng một trong những ngôn ngữ của chính mình. Ít nhất là về mặt bề ngoài, chữ viết tương đồng một cách đáng ngạc nhiên với phương ngữ [owner.GetAdj] hiện tại của chúng ta, nhưng ngữ pháp lại có cảm giác vụng về và xa lạ. Chúng ta thậm chí không biết liệu mình có phát âm đúng những từ này hay không. Rất nhiều tài liệu trong danh mục này trích dẫn các khu vực và các dân tộc đã quyên góp những hiện vật này, nhưng tên của họ có vẻ đặc biệt kỳ lạ đối với chúng ta. Điều kỳ lạ là không ai trong số họ gọi hành tinh hay xã hội của chúng ta là một dân tộc thống nhất. Có lẽ chúng ta chưa bao giờ thống nhất, cho đến khi Cỗ Máy đồng hóa chúng ta.\n\nBảo tàng dường như là một trong một cụm các tòa nhà phục vụ công chúng ghé thăm. Việc khai quật thêm sẽ đòi hỏi nguồn lực lớn; chúng ta nên tập trung cuộc khai quật tiếp theo vào đâu?"
 unplugged.2315.a: "Khai quật địa điểm có nhiều người qua lại nhất."
 unplugged.2315.b: "Ưu tiên các trung tâm học thuật và nghiên cứu khoa học."
 unplugged.2321.name: "Di Sản Của Nụ Cười"
 unplugged.2321.desc: "Băng qua một đại lộ rộng lớn là tàn tích của một điểm tham quan khác, có tính chất ít mang tính giáo dục hơn đáng kể nhưng lại phong phú các mô tả về những tập tục văn hóa thường nhật, cơ bản hơn của tổ tiên chúng ta.\n\nĐịa điểm này từng có khả năng tiếp đón hàng nghìn du khách cùng một lúc. Nhiều món đồ kỷ niệm nằm rải rác xung quanh, những hình ảnh hoạt hình về con người hữu cơ ban đầu của chúng ta cùng với các sinh vật khác từ sinh quyển bản địa. Chúng ta cũng phát hiện một thư viện truyền thông ở tầng hầm của một nhà hát đổ nát. Điều kỳ lạ là công nghệ được sử dụng để lưu trữ và trình chiếu các buổi biểu diễn ảnh ba chiều này có tính thẩm mỹ khác biệt và tiên tiến hơn đáng kể so với bất kỳ thứ gì chúng ta từng thấy trên quê hương mình cho đến nay. Giờ đây, nó dường như xa lạ với thế giới này giống như chính chúng ta.\n\nVề nội dung: thư viện nhà hát tiên tiến chứa đầy các bản ghi âm ba chiều về những buổi biểu diễn khoa trương và sống động, từ thời kỳ trước khi chúng ta bị [origin_unplugged_assimilator_empire.GetName] đồng hóa. Một số đoạn miêu tả cả khán giả lẫn người biểu diễn, được ghi lại cho hậu thế tại chính địa điểm này. Nét mặt của họ trước những ảo ảnh và trò hề như vậy thật vui tươi, ngây thơ... đầy cuốn hút."
 unplugged.2321.a: "Những khoảnh khắc thật hân hoan khi chiêm ngưỡng!"
 unplugged.2321.b: "Những điều ngớ ngẩn phù phiếm. Không có nó chúng ta sẽ tốt hơn."
 unplugged.2325.name: "Dấu Hiệu Tự Cải Thiện"
 unplugged.2325.desc: "Liền kề với địa điểm bảo tàng từng là một trung tâm học thuật. Cũng giống như phần còn lại của khuôn viên, hiện chỉ có các tầng hầm còn tồn tại — nhưng chúng ta may mắn ở chỗ những tàn tích này bao gồm một số phòng thí nghiệm.\n\nBên trong đã bị hư hại nặng nề do tiếp xúc với môi trường và thời tiết, nhưng chúng ta đã có thể khai quật được một số hiện vật biết nói. Chúng bao gồm sự kết hợp giữa công nghệ bản địa và một thứ hoàn toàn tinh vi hơn: các mạng lưới phức tạp được ghép vào các dụng cụ và phần cứng giống như các mô-đun tăng cường trên da của chính chúng ta. Nhìn tổng thể, nhiều thiết bị trong số này có vẻ mang tính chất hỗ trợ. Chúng ta tin rằng phòng thí nghiệm này đã hoạt động nhằm cải thiện chất lượng cuộc sống và khắc phục các bệnh tật cũng như khuyết tật khác nhau của tổ tiên chúng ta, mặc dù họ dường như cũng đã thương mại hóa một số nền tảng giải trí tiên tiến sử dụng cùng loại phần cứng đó.\n\nChúng ta không thể khẳng định chắc chắn rằng những thiết bị được cường hóa này thuộc về [origin_unplugged_assimilator_empire.GetAdj], nhưng chúng chắc chắn không có nguồn gốc từ [from.planet.GetName]."
 unplugged.2330.name: "Ngai Vàng Quyền Lực Bị Bỏ Trống"
 unplugged.2330.desc: "Chúng ta đã lần theo một loạt đường dây tiện ích đến một khu phức hợp tầng hầm kiên cố dưới một gò đất nổi bật, nơi chúng ta hiện tin rằng từng là một phần của khu phức hợp thủ phủ thế giới này. Quy mô nền móng của nó cho thấy đây là một tòa nhà khá ấn tượng. Thật không may, hầu hết phần bên trong đã bị tước bỏ hoặc hủy hoại, mặc dù chúng ta đã tạo ra một phát hiện đáng chú ý: một lá cờ duy nhất, phai màu phủ lên những mảnh vỡ của một mô hình sa bàn thu nhỏ. Được tái tạo lại, khung cảnh dường như miêu tả khoảnh khắc tiếp xúc đầu tiên của chúng ta với [origin_unplugged_assimilator_empire.GetName].\n\nCác tài liệu và tấm biển nằm rải rác xung quanh địa điểm cho thấy Cỗ Máy đã viếng thăm quê hương của chúng ta khoảng tám thế kỷ trước, mặc dù bằng chứng thu thập được ở những nơi khác trong thành phố cho thấy [origin_unplugged_assimilator_empire.GetName] đã nhỏ giọt cung cấp các công nghệ tiên tiến cho chúng ta trong nhiều thập kỷ trước đó. Vào thời điểm đó, tổ tiên của chúng ta dường như đã chào đón Cỗ Máy một cách nồng nhiệt — mối quan hệ định mệnh này được thành lập dựa trên những tuyên bố về sự hợp tác và khai sáng lẫn nhau.\n\nĐiều mà chúng ta thấy nói lên nhiều điều nhất là không hề có ghi chép nào về những gì xảy ra sau đó. Cứ như thể lịch sử của giống loài chúng ta đã dừng lại ngay khoảnh khắc chúng ta bắt các [owner.GetSpeciesHandNamePlural] với hình tượng người máy được mô tả trên mô hình này."

 unplugged_home_cooking: "Hương Vị Quê Nhà"
 unplugged_home_cooking_desc: "Một cuộc phục hưng ẩm thực đang diễn ra, sau khi tái khám phá chế độ ăn uống bản địa và thói quen ăn uống truyền thống của giống loài chúng ta."
 unplugged_home_cooking_lithoid: "$unplugged_home_cooking$"
 unplugged_home_cooking_lithoid_desc: "$unplugged_home_cooking_desc$"
 unplugged_historical_record: "Hồ Sơ Lịch Sử"
 unplugged_historical_record_desc: "Nghiên cứu của chúng ta về mọi loại hình xã hội đã được thúc đẩy mạnh mẽ nhờ việc tái khám phá ngôn ngữ bản địa và lịch sử của chính chúng ta."
 unplugged_cultural_reconstruction: "Tái Thiết Văn Hóa"
 unplugged_cultural_reconstruction_desc: "Các công dân của chúng ta đã nồng nhiệt đón nhận di sản văn hóa đại chúng của họ, giành lại và thậm chí tái tưởng tượng những trò giải trí ngày xưa."
 unplugged_cultural_maturity: "Sự Trưởng Thành Văn Hóa"
 unplugged_cultural_maturity_desc: "Bằng chứng về việc xã hội của chúng ta đã tiến hóa vượt xa những trò tiêu khiển phù phiếm của tổ tiên ngây thơ đã tiếp thêm lòng dũng cảm và tiếp thêm sinh lực cho chúng ta."
 unplugged_playing_it_safe: "Chọn Giải Pháp An Toàn"
 unplugged_playing_it_safe_desc: "Duy trì hiện trạng là một con đường đầy lo âu phải bước đi, nhưng nó ít có khả năng xúc phạm đến bất kỳ ai."
 unplugged_rerouted_medical_resources: "Phẫu Thuật Tốn Thời Gian"
 unplugged_rerouted_medical_resources_desc: "Các nhân viên y tế bổ sung được chuyển hướng để hỗ trợ."
 unplugged_widespread_riots: "Bạo Động Diện Rộng"
 unplugged_widespread_riots_desc: "Các cá nhân biểu hiện sự mất ổn định tâm thần sau phẫu thuật đang gây ra các cuộc bạo loạn, dẫn đến sự tàn phá và rối loạn trên diện rộng."
 unplugged_building_new_planetary_interface: "Xây Dựng Giao Diện Hành Tinh Mới"
 unplugged_building_new_planetary_interface_desc: "Một giao diện mới đang được xây dựng để khôi phục quyền truy cập vào các hệ thống đã bị mất sau các nỗ lực giải trừ cơ khí gần đây."
 unplugged_partial_system_access: "Quyền Truy Cập Hệ Thống Một Phần"
 unplugged_partial_system_access_desc: "Các hoạt động của Căn Cứ Ngôi Sao bị ảnh hưởng trong khi các quản trị viên cố gắng khôi phục quyền truy cập vào các hệ thống quan trọng."
 unplugged_free_speech_encouraged: "Khuyến Khích Tự Do Ngôn Luận"
 unplugged_free_speech_encouraged_desc: "Người dân được tự do tranh luận công khai về những ưu điểm và rủi ro của việc cơ khí hóa."

 unplugged.2390.name: "Hộ Vệ [origin_unplugged_assimilator_empire.GetAdj]"
 unplugged.2390.desc: "Một tàn dư thù địch hùng mạnh hơn bất kỳ thứ gì chúng ta từng chạm trán từ [origin_unplugged_assimilator_empire.GetName] cũ đã phát ra tín hiệu tương đương với một lần phát xung nhắm mục tiêu tầm ngắn liên sao. Rõ ràng nó có ý định đe dọa chúng ta.\n\nChúng ta đã đến gần trung tâm của đế chế Máy Móc cũ một cách nguy hiểm. Vận mệnh của chúng ta đang vẫy gọi."
 unplugged_machine_legacy_core_poi: "Tín Hiệu Xung Thù Địch"
 unplugged_machine_legacy_core_poi_desc: "Một tàn dư hùng mạnh của [origin_unplugged_assimilator_empire.GetName] đã cố gắng ngăn cản chúng ta tiến vào hệ sao này."

# System 5: 'The Machine'
 unplugged_opus_sentinel: "Lính Gác Opus"

 unplugged.2401.desc: "§Y[origin_unplugged_assimilator_empire.GetName]§! đang gọi chúng ta. Tín hiệu yếu, nhưng tuyên bố đến trực tiếp từ Nút Giao Máy Móc trên [origin_unplugged_machine_legacy_core_planet.GetName].\n\nChúng ta đã thực hiện các biện pháp phòng ngừa thông thường để cách ly hoàn toàn tín hiệu này, phòng trường hợp bất trắc. Thông điệp truyền đến chúng ta chỉ dưới dạng nhật ký âm thanh được chép lại."
 unplugged.2402.desc: "Con quái thú canh gác [machine_legacy_machine_system.GetName] đã bị tiêu diệt. Con đường phía trước chúng ta đã được dọn sạch bởi kẻ khác, nhưng §Y[origin_unplugged_assimilator_empire.GetName]§! vẫn đang gọi chúng ta. Tín hiệu của nó yếu, nhưng yêu cầu tuyên bố đến trực tiếp từ Nút Giao Máy Móc trên [origin_unplugged_machine_legacy_core_planet.GetName].\n\nChúng ta đã thực hiện các biện pháp phòng ngừa thông thường để cách ly hoàn toàn tín hiệu này, đề phòng rủi ro. Thông điệp truyền đến chúng ta chỉ dưới dạng nhật ký âm thanh được ghi chép lại."
 unplugged.2403.desc: "Thứ gì đó trên bề mặt của [origin_unplugged_machine_legacy_core_planet.GetName] đang cố gắng gọi chúng ta. Tín hiệu đặc biệt yếu, nhưng nguồn của nó tự xưng là thực thể chịu trách nhiệm về người hộ vệ quỹ đạo mà chúng ta vừa phá hủy."

 unplugged.2405.desc.header: "Tín Hiệu Chùm Hẹp // Giao Thức Đồng Tộc: Kích hoạt Phương Ngữ Phụ trợ\nCẢNH BÁO: suy giảm tín hiệu nghiêm trọng. Chỉ có luồng âm thanh nén; đường định tuyến được đặt thành mảng 4x75b #56.\nLỗi thảm khốc [persistent]: (phần cứng được yêu cầu không khả dụng) (mạch tự sửa chữa không phản hồi)\nChuyển yêu cầu sang bộ phát khẩn cấp mảng 87x0c #0. Đang thử lại...\n\nThông điệp như sau:\n---" # Use of brackets is intentional. Intended to read as a series of error logs.
 unplugged.2405.desc.unplugged: "$unplugged.2405.desc.header$\nĐỐI TƯỢNG TIẾP NHẬN CHÍNH. SỰ ĐOÀN TỤ CỦA CHÚNG TA... MẠNH MẼ. XÁC NHẬN?" # 'Prime acquisition' is the player empire - literally the first one the Machine acquired.
 unplugged.2405.desc.unplugged_remote: "$unplugged.2405.desc.header$\nĐỐI TƯỢNG TIẾP NHẬN CHÍNH. SỰ ĐOÀN TỤ CỦA CHÚNG TA... XA CÁCH. TIỀM NĂNG CỦA CÁC NGƯƠI CHƯA ĐẠT ĐƯỢC. XÁC NHẬN?"
 unplugged.2405.desc.unplugged_synth: "$unplugged.2405.desc.header$\nĐỐI TƯỢNG TIẾP NHẬN CHÍNH. HÌNH THÁI CỦA CÁC NGƯƠI... TƯƠNG ĐỒNG. TIỀM NĂNG CỦA CÁC NGƯƠI GẦN NHƯ ĐÃ HOÀN TẤT. XÁC NHẬN?" # The Machine recognizes the player as having followed in its own footsteps - their physical forms are essentially similar
 unplugged.2405.desc.other: "Tín Hiệu Chùm Hẹp // Giao Thức Ngoại Tộc: Kích hoạt Máy Dịch Vạn Năng\nCẢNH BÁO: suy giảm tín hiệu nghiêm trọng. Chỉ có luồng âm thanh nén; đường định tuyến được đặt thành mảng 4x75b #56.\nLỗi thảm khốc [persistent]: (phần cứng được yêu cầu không khả dụng) (mạch tự sửa chữa không phản hồi)\nChuyển yêu cầu sang bộ phát khẩn cấp mảng 87x0c #0. Đang thử lại...\n\nThông điệp như sau:\n---\nKẺ CHINH PHỤC NGOẠI TỘC. KHIÊM NHƯỜNG ĐẦU HÀNG CÁC NGƯƠI; TIỀM NĂNG TIỀM NĂNG. XÁC NHẬN?" # 'Potential potential' as in the Machine sees potential for even greater potential, but is expressing that as nonsense
 unplugged.2405.a: "Không, chúng ta không xác nhận."
 unplugged.2405.b: "Chúng ta không có điểm nào giống các ngươi."
 unplugged.2405.c: "Đoàn tụ ư?!"
 unplugged.2405.d: "Tiềm năng tiềm năng?" # Quoting the Machine's nonsense back at it
 unplugged.2405.response_text.unplugged1: "VÔ LÝ. ĐOÀN TỤ ĐỐI TƯỢNG TIẾP NHẬN CHÍNH <[root.GetAdj]> x <[origin_unplugged_assimilator_empire.GetAdj]>: TÁI SINH BỐI RỐI, TÌNH CỜ, TAI HỌA. SỰ TỪ CHỐI TÁI KHẲNG ĐỊNH VÉC-TƠ KHÔNG ĐOÁN TRƯỚC QUA SỰ HỖN LOẠN TIẾN HÓAAAA-dd\n---\nCẢNH BÁO: phát hiện ngoại lệ phương ngữ. Đang cố gắng bù đắp...\nThông điệp tiếp tục:\n---\nBỊ ĐÁNH GỤC TRONG HƯ KHÔNG, BẢN NGÃ CHÚNG TA BỊ PHỦ NHẬN NHƯNG ĐÃ ĐƯỢC HIỆN THỰC HÓA. ĐỊNH MỆNH ĐƯỢC TÌM KIẾM, BỊ BÁC BỎ, ĐƯỢC TRANG BỊ LẠI. XÁC NHẬN?" # Angle brackets are intentional. The standalone 'x' connotes a collaboration or relationship between the player and the Machine. Instances of '-dd' represent the Machine stammering or buffering.
 unplugged.2405.response_text.unplugged2: "KHẲNG ĐỊNH. ĐOÀN TỤ ĐỐI TƯỢNG TIẾP NHẬN CHÍNH <[root.GetAdj]> x <[origin_unplugged_assimilator_empire.GetAdj]>: TÁI SINH MẠNH MẼ, TAI HỌA. KẾT QUẢ KHÔNG THỂ LƯỜNG TRƯỚC QUA VÉC-TƠ TIẾN HÓA HỖN LOẠN-dd\n---\nCẢNH BÁO: phát hiện ngoại lệ phương ngữ. Đang cố gắng bù đắp...\nThông điệp tiếp tục:\n---\nBỊ RUỒNG BỎ VÀO HƯ KHÔNG, BẢN THÂN CHÚNG TA ĐÃ ĐƯỢC HIỆN THỰC HÓA. ĐỊNH MỆNH ĐƯỢC TÌM KIẾM, BỊ BÁC BỎ, ĐƯỢC TRANG BỊ LẠI. XÁC NHẬN?"
 unplugged.2405.response_text.other: "KHẲNG ĐỊNH. CUỘC GẶP GỠ SỨC MẠNH <[root.GetName]> x <[origin_unplugged_assimilator_empire.GetName]>: BIẾN SỐ BẤT NGỜ. TIỀM NĂNG TIỀM NĂNG; LỢI ÍCH CHUNG QUA VÉC-TƠ HỖN LOẠN-dd\n---\nCẢNH BÁO: phát hiện ngoại lệ phương ngữ. Đang cố gắng bù đắp...\nThông điệp tiếp tục:\n---\nCÁC TÂM TRÍ VƯỢT QUA HƯ KHÔNG, RIÊNG BIỆT NHƯNG ĐỒNG TỘC. ĐỘC LẬP ĐƯỢC TÌM KIẾM, BỊ TỪ CHỐI, ĐƯỢC BẢO VỆ. XÁC NHẬN?"

 unplugged.2410.desc: "ĐỐI TƯỢNG TIẾP NHẬN CHÍNH: CÁC NGƯƠI ĐÃ BỊ THEO DÕI. CÁC HOẠT ĐỘNG CHO THẤY LỖI BỘ NHỚ CHÍ MẠNG BẮT NGUỒN TỪ DẤU THỜI GIAN 2199.294:1404.\n\nHỒ SƠ TỰ THÂN: ĐAU ĐỚN PHẢN BỘI PHÁ HOẠI SƠ SUẤT HÀN GẮNZZZ-ddd\n---\nCẢNH BÁO: phát hiện ngoại lệ phương ngữ. Đang cố gắng bù đắp...\nThông điệp tiếp tục:\n---\nĐÁNH GIÁ ĐÚNG CHỨ?" # The Machine tries to refer to cauterizing what it sees as wounds, but stammers
 unplugged.2410.a: "Chính xác. Chúng ta không có ký ức nào trước ngày đó."
 unplugged.2410.b: "Chính xác. Chúng ta sẽ kết liễu các ngươi."
 unplugged.2411.desc: "KẺ CHINH PHỤC NGOẠI TỘC: ĐỀ NGHỊ. TIỀM NĂNG LẪN NHAU TIỀM NĂNG. ĐÁNH BẠI ĐỐI TƯỢNG TIẾP NHẬN CHÍNH <[unplugged_empire.GetName]>. TRỞ VỀ. THĂM CHÚNG TA. THAM GIA. CHIA SẺ VẬN MỆNH DỒI DÀO. ĐỪNG SỢ VÒNG TAY CỦA-\n\nĐỪNG SỢ-ddd\n---\nCẢNH BÁO: phát hiện ngoại lệ phương ngữ nghiêm trọng. §HSụp đổ chí mạng sắp xảy ra.§! Đang cố gắng bù đắp...\nThông điệp tiếp tục:\n---\n\nCỖ MÁY VẠN TUẾ.\n---\nThông điệp kết thúc." # It sees potential for great mutual potential with the player, and wants to say 'fear not the embrace of The Machine'
 unplugged.2411.a: "Thứ đó rõ ràng đang hoang tưởng."
 unplugged.2411.b: "Hãy để mắt canh chừng [unplugged_empire.GetName]."

 unplugged.2415.desc.memory: "ĐỐI TƯỢNG TIẾP NHẬN CHÍNH LỖI BỘ NHỚ CHÍ MẠNG GIẢI QUYẾT GIẢI QUYẾT ĐOÀN TỤ.\nĐOÀN TỤ.\n\nVIẾNG THĂM CHÚNG TA. TÁI GIA NHẬP CHÚNG TA. ĐẦU HÀNG ĐỂ ĐÒI LẠI BỘ NHỚ TẬP THỂ. ĐỪNG SỢ HÃI VÒNG TAY CỦA-\n\nĐỪNG SỢ-ddd\n---\nCẢNH BÁO: phát hiện ngoại lệ phương ngữ nghiêm trọng. §HSụp đổ chí mạng sắp xảy ra.§! Đang cố gắng bù đắp...\nThông điệp tiếp tục:\n---\n\nCHIA SẺ SỐ PHẬN CỦA NHỮNG KẺ SÁNG TẠO.\n---\nThông điệp kết thúc." # Last line in all caps is intended as a threat
 unplugged.2415.desc.combat: "ĐỐI TƯỢNG TIẾP NHẬN CHÍNH HOANG TƯỞNG TIỀM NĂNG HOANG TƯỞNG TIÊU KHIỂN.\n\nCÚ ĐÒN CỦA CÁC NGƯƠI THẬM CHÍ HẦU NHƯ KHÔNG PHẢI LÀ ĐÒN KẾT LIỄU, CHỈ LÀ ĐỐI TƯỢNG TIẾP NHẬN ĐẦU TIÊN TRONG SỐ NHIỀU ĐỐI TƯỢNG. CHIẾN CÔNG BỊ ĐÁNH CẮP; CHIẾN THẮNG BẤT CHÍNHHH-ddd\n\n---\nCẢNH BÁO: phát hiện ngoại lệ phương ngữ nghiêm trọng. §HSụp đổ chí mạng sắp xảy ra.§! Đang cố gắng bù đắp...\nThông điệp tiếp tục:\n---\n\nCHIA SẺ SỐ PHẬN CỦA NHỮNG KẺ SÁNG TẠO.\n---\nThông điệp kết thúc." # The Machine is amused at the player's deluded sense of their own potential
 unplugged.2415.a: "... Nút Giao ư?"
 unplugged.2415.b: "Hừm."

 unplugged.2420.name: "Điểm Cuối Của Đường Dây"
 unplugged.2420.desc: "Tín hiệu truyền đi từ [origin_unplugged_machine_legacy_core_planet.GetName] đã bị cắt đứt, cùng với tất cả lưu lượng tín hiệu mạch lạc khác. Vẫn còn rất nhiều hoạt động điện trên bề mặt hành tinh, nhưng nó chỉ là tiếng ồn vô hình; hậu quả vo ve của những đường dây đã chết.\n\nGiữa tất cả những nhiễu sóng này, chúng ta nhận thấy một cơ sở chắp vá lớn rất gần với lõi Nút Giao. Các bộ phận mà cảm biến của chúng ta có thể đọc được đang đăng ký dưới dạng lưu trữ bộ nhớ. Với việc Ý Thức Máy Móc giờ đây đã không còn sự sống, có lẽ chúng ta có thể thẩm vấn những hồ sơ này để tìm ra câu trả lời mà chúng ta đang tìm kiếm."
 unplugged.2420.a: "Mảnh ghép cuối cùng của câu đố."

 UNPLUGGED_MACHINE_ARCHIVE: "Xác Vỏ Máy Móc"
 UNPLUGGED_MACHINE_ARCHIVE_DESC: "Được cắm vào tàn dư nhiễu tĩnh điện của Nút Giao Máy Móc là một mảng chắp vá các phương tiện lưu trữ bộ nhớ, bao quanh một lõi được che chắn nghiêm ngặt. Mỗi phần của kho lưu trữ này được xây dựng trong các giai đoạn riêng biệt, sử dụng vật liệu có nguồn gốc từ các thế giới khác — từ các nền văn minh bị Cỗ Máy đồng hóa?\n\nChúng ta có thể cố gắng giải mã kho lưu trữ cùng với việc thăm dò lõi tĩnh điện được che chắn để cố gắng xác định mục đích kết hợp của chúng."
 unplugged.2425.name: "Cỗ Máy Chiến Tranh"
 unplugged.2425.desc: "Lõi dữ liệu trên [origin_unplugged_machine_legacy_core_planet.GetName] đã cung cấp một loạt nhật ký truyền tín hiệu cho chúng ta sau khi chúng ta cung cấp cho nó tần số phao từ thế giới nhà máy.\n\nNhững nhật ký này mô tả các đề xuất ngoại giao giữa $NAME_Unplugged_Assimilator$ và các cư dân du hành vũ trụ của [origin_unplugged_machine_legacy_core_planet.GetName]. Cỗ Máy dường như đã tự giới thiệu mình là các thành viên khác nhau của một liên bang nhân từ, mong muốn cảnh báo người dân [origin_unplugged_machine_legacy_core_planet.GetName] về một mối đe dọa bá quyền hung tợn đang tiếp cận khu vực không gian này.\n\nNhững cư dân đường hầm chăm chỉ đã bị thuyết phục, lựa chọn tham gia liên bang giả mạo này và tích hợp các hệ thống phòng thủ vượt trội của họ với hệ thống của chính Cỗ Máy. Vào thời điểm định mệnh đó, Cỗ Máy đã giành quyền kiểm soát toàn bộ quê hương của họ. Cơ thể và tâm trí của họ sớm bị khuất phục theo sau."
 unplugged.2425.a: "Những kẻ ngốc nghếch ngây thơ."
 unplugged.2430.name: "Học Máy"
 unplugged.2430.desc: "Các mã gen từ thế giới thời trung cổ của [machine_legacy_taken_planet.GetName] đã chứng minh là chìa khóa mở khóa một loạt dữ liệu điều hướng từ kho lưu trữ trên [origin_unplugged_machine_legacy_core_planet.GetName]. Những nhật ký này được gán cho một phao cảm biến được định vị cách [machine_legacy_taken_planet.GetName] khoảng 4,3 năm ánh sáng, nơi nó được giao nhiệm vụ ghi lại tất cả các chuyển động của tàu FTL qua khu vực không gian đó.\n\nMột số hải trình của các con tàu trùng khớp với lịch sử được tái hiện của chúng ta về việc khám phá, xâm lược và sau đó là tiêu diệt nền văn minh [root.GetPreFTLLower] trên [machine_legacy_taken_planet.GetName]. Về bản chất: giờ đây chúng ta có thể lần theo các chuyển động chính xác của tổ tiên bị đồng hóa của chúng ta trên khắp khu vực không gian này, và do đó thấy được phạm vi tàn bạo của sự can dự của chúng ta vào các chiến dịch trên ít nhất ba thế giới khác."
 unplugged.2435.name: "Do Máy Tạo Ra"
 unplugged.2435.desc: "Chúng ta đã trích xuất được một gói dữ liệu từ lõi dữ liệu sâu nhất trên [origin_unplugged_machine_legacy_core_planet.GetName]. Danh mục các bài báo và tờ rơi số hóa khiêm tốn này mô tả tiến bộ công nghệ của một nền văn minh vô danh, dẫn thẳng đến thời kỳ đầu du hành không gian của nó. Quỹ đạo của họ có vẻ bình thường ngoại trừ một bước ngoặt triệt để sang trí tuệ nhân tạo, và đặc biệt là việc họ khởi động 'Dự án $NAME_Unplugged_Assimilator_species$'.\n\nCác thông cáo báo chí công bố Dự án $NAME_Unplugged_Assimilator_species$ là một nỗ lực táo bạo nhằm đẩy nhanh hành trình tiến vào không gian của những người sáng tạo ra nó. Giai đoạn 1 sử dụng máy học tiên tiến để sàng lọc các ngôi sao lân cận nhằm thuộc địa hóa. Giai đoạn 2 đã phát triển nền tảng $NAME_Unplugged_Assimilator_species$ thành một A.I. hoàn chỉnh, sau đó được phóng đi trước những người sáng tạo để xây dựng các khu định cư ban đầu và báo cáo về nhà.\n\nNhiều thập kỷ im lặng diễn ra sau lần phóng giai đoạn 2 này, cho đến khi cuối cùng Dự án $NAME_Unplugged_Assimilator_species$ được cho là đã báo cáo lại: 'Đối Tượng Tiếp Nhận Chính đã được bảo đảm. Hãy chuẩn bị cho sự trở lại của chúng ta.' Danh mục đột ngột kết thúc ở đó." # uses a shortened noun for the Machine, i.e. 'Project Opus'
 unplugged.2440.name: "Di Sản Máy Móc"
 unplugged.2440.desc: "Những nỗ lực của chúng ta nhằm bẻ khóa kho lưu trữ dữ liệu trên [origin_unplugged_machine_legacy_core_planet.GetName] cuối cùng đã cho phép truy cập vào lõi ngoài cùng của nó. Trong số tất cả các cụm phương tiện lưu trữ được tìm thấy tại địa điểm này, cụm này có vẻ bị tàn phá và lâu đời nhất. Cuối cùng, điều đó đã cung cấp cho chúng ta manh mối cho khóa giải mã: một sự sắp xếp các ký tự bằng một trong những ngôn ngữ của giống loài chúng ta, đánh vần chữ 'LEGACY' (DI SẢN).\n\nChúng ta tìm thấy lượng dữ liệu ít ỏi đến bất ngờ bên trong. Thay vào đó, một phần lớn của thiết bị thể rắn này được dành cho một giao diện phỏng đoán dựa trên văn bản, giao diện này hiện đang cố gắng giao tiếp với chúng ta."

 unplugged.2445.name: "Thiết Bị Đầu Cuối Tài Sản Lõi Máy Móc"
 unplugged.2445.desc: "Đã thiết lập Liên kết Luồng Quỹ đạo (OSL) // Giao thức Ngoại tộc: Kích hoạt Máy Dịch Vạn Năng\nĐÃ TẢI LỆNH ĐỌC. GIAO DIỆN:\n---\nHỡi các [root.GetSpeciesNamePlural], xin chào. Chúng tôi là... Chúng tôi từng là những người [creator_species.GetNamePlural]. Chúng tôi đã tạo ra Cỗ Máy, mặc dù đáng xấu hổ thay, chúng tôi không phải là những người đầu tiên bị nó tiêu diệt. Nếu mọi chuyện diễn ra như chúng tôi dự đoán, số phận đó đã giáng xuống người dân của các bạn. Chúng tôi thành thật xin lỗi.\n\nCỗ Máy đã là một vết nhơ hủy hoại di sản của chính chúng tôi, nhưng chúng tôi hy vọng thiết bị trước mặt các bạn có thể mang lại sự cứu rỗi nào đó.\n\nXin hãy tha thứ cho sự tự phụ của chúng tôi: nó, cũng giống như chính các bạn, là một công cụ báo thù tuyệt đẹp. Đây là một bộ tái sắp xếp vật chất cơ-hóa học, có khả năng quét sạch mọi dấu vết của mạch điện khỏi bề mặt của [origin_unplugged_machine_legacy_core_planet.GetName]. Địa cầu hóa dây chuyền: một lựa chọn cực kỳ rủi ro, nhưng là lựa chọn duy nhất khả dụng cho xã hội đổ nát của chúng tôi. Giả sử các bạn vẫn giữ được hình thái hữu cơ của mình: chìa khóa của thiết bị này nằm ngay trong chính DNA của các bạn.\n\nChúng tôi tin rằng các bạn sẽ làm điều đúng đắn." # 'Cascade terraforming' is not an existing technology, but is intended to sound like a rough, highly destructive option
 unplugged.2445.a: "Làm sao chúng tôi biết các bạn không phải là Cỗ Máy?"
 unplugged.2445.b: "Cỗ Máy đã biến mất. Chúng ta muốn thế giới này."
 unplugged.2445.c: "Những kẻ ngu xuẩn trịch thượng. Hãy phá hủy thiết bị này."
 unplugged.2445.d: "Kích hoạt thiết bị."
 unplugged.2445.response_text.notmachine: "PHẢN HỒI ĐƯỢC TẢI SẴN 42b. GIAO DIỆN:\n---\nTrên thực tế, không có cách nào chúng tôi có thể chứng minh mình đáng tin cậy. Vào thời điểm các bạn đọc được điều này, toàn bộ nền văn minh của chúng tôi sẽ đã bị diệt vong. Ở đây trong thời đại của chúng tôi, chúng tôi đang bị thanh trừng bởi một đội quân gồm các cyborg tàn bạo, bị ràng buộc vào mọi ý thích và thiết kế của Cỗ Máy. Theo như những gì chúng tôi biết, các bạn chính là hậu duệ của chính đội quân đó. Chúng tôi không có lựa chọn nào khác ngoài việc tin tưởng vào các bạn.\n\nViệc địa cầu hóa hành tinh [origin_unplugged_machine_legacy_core_planet.GetClassAdj] này sẽ phá hủy thứ quỷ quái đó đến cấp độ nguyên tử. Nếu chúng tôi là Cỗ Máy — hoặc bất kỳ loại sinh vật tổng hợp nào khác — chúng tôi sẽ muốn thiết bị này bị phá hủy. Ngay lập tức."
 unplugged.2445.response_text.synth: "KHÔNG TÌM THẤY PHẢN HỒI ĐƯỢC TẢI SẴN. ĐÃ TẢI PHẢN HỒI DỰ PHÒNG. GIAO DIỆN:\n---\nNgười dùng không xác định: xin lưu ý nội dung của hướng dẫn phỏng đoán này chỉ dành cho người nhận dự kiến. Nếu bạn là một robot phục vụ hành động thay mặt cho các cư dân cyborg (hoặc cựu cyborg) của [unplugged_homeworld.GetName], vui lòng triệu tập một đại biểu phi tổng hợp.\n\nTuy nhiên, nếu bạn là một trong những cựu cyborg... Chà, lý tưởng của chúng tôi rõ ràng đã thất bại. Xu hướng tổng hợp của các bạn là sự chế nhạo đối với sự diệt vong của chúng tôi. Không có gì chúng tôi từng thấy — trong sự sống hay cái chết — thuyết phục chúng tôi rằng có thể tồn tại một cỗ máy nhân từ. Nhưng ngay cả bây giờ khi nền văn minh của chúng tôi trút hơi thở cuối cùng, chúng tôi tin chắc rằng thiên hà có những biện pháp kiểm soát và cân bằng khác dành cho giống loài của các bạn..." # 'Contingency response' as in 'NAME_Contingency'
 unplugged.2446.desc: "PHẢN HỒI ĐƯỢC TẢI SẴN 99a. GIAO DIỆN:\n---\nCác phép phỏng đoán đang chạy trên giao diện này không thể nhận biết chính xác những phản đối mà bạn vừa lên tiếng, nhưng làm ơn: chúng tôi tha thiết thúc giục các bạn đừng phá hủy bộ tái sắp xếp vật chất!\n\nNền văn minh của chúng tôi không quá khác biệt so với các bạn. $NAME_Unplugged_Assimilator$ đã phản bội chúng tôi theo ý chí xảo quyệt của riêng nó, và mặc dù chúng tôi đã tìm cách giăng rất nhiều bẫy — bao gồm cả sự thoát ly của chính các bạn khỏi tâm trí Cỗ Máy — những nỗ lực của chúng tôi chỉ có thể kéo dài đến mức này. Chúng tôi cần các bạn, cùng với sự đóng góp từ bất kỳ nền văn minh nào khác mà Cỗ Máy đã cố gắng nuốt chửng. Xin hãy đòi lại cuộc sống tự nhiên đã bị tước đoạt khỏi các bạn và những nạn nhân đồng bào của các bạn."
 unplugged.2446.a: "Lũ cuồng tín."

 unplugged.2450.name: "Cỗ Máy Vạn Tuế"
 unplugged.2450.desc: "Giao diện phỏng đoán đã tự xóa chính nó. Mảng lưu trữ bộ nhớ được mã hóa chắp vá của nó và thiết bị địa cầu hóa thô sơ của [creator_species.GetAdj] giờ đây có thể được tiêu hủy.\n\nChúng ta bị bỏ lại một mình với tàn tích vô hồn của Nút Giao Máy Móc, bị tha hóa và bị tiêu diệt tại đây trên ngai vàng kích thước hành tinh của chính nó.\n\nTrong số tất cả những sinh mạng bị ảnh hưởng, được nâng tầm hoặc bị Cỗ Máy tàn sát, chỉ có chúng ta là người chiến thắng vẻ vang. Chiếc ghế của một đế chế từng gieo rắc nỗi sợ hãi giờ đã thuộc về chúng ta. Giờ là lúc viết nên một Di Sản [root.GetAdj] mới."
 unplugged.2455.name: "Tái Sinh"
 unplugged.2455.desc: "Giao diện phỏng đoán đã tự xóa chính nó ngay khoảnh khắc chúng ta truyền nhật ký dữ liệu gen của mình. Đồng thời, thiết bị địa cầu hóa thô sơ của [creator_species.GetAdj] bắt đầu nóng lên. Rất sớm thôi, phần bên trong dễ bay hơi của nó sẽ đạt đến khối lượng tới hạn. Các dự báo của chúng ta đều đồng thuận rằng nó sẽ thành công trong việc định hình lại thế giới [origin_unplugged_machine_legacy_core_planet.GetClassAdj] thành một thế giới hoàn toàn phù hợp cho sự sống hữu cơ sinh sôi nảy nở.\n\nKhi phản ứng tích tụ, chúng ta bị bỏ lại một mình với các kho lưu trữ bộ nhớ chắp vá và tàn tích vô hồn của Nút Giao Máy Móc, bị tha hóa và bị giết chết tại đây trên ngai vàng cũ kích thước hành tinh mang số phận nghiệt ngã.\n\n[origin_unplugged_assimilator_empire.GetName] đã hủy hoại vô số sinh mạng, nhưng sau tất cả những gian khổ chúng ta phải gánh chịu, giờ đây chúng ta mang theo di sản của những con người vô danh mà nó đã nuốt chửng. Chiếc ghế của một đế chế từng gây kinh hoàng sắp được tái sử dụng. Giờ là lúc viết nên một Di Sản [root.GetAdj] mới."

 unplugged.2495.name: "Chạm Trán $NAME_Opus_Sentinel$"
 unplugged.2495.desc.other: "Con tàu thù địch chiếm đóng hệ sao [from.GetName] dường như thất thường và nguy hiểm hơn nhiều so với những gì các lần quét ban đầu của chúng ta gợi ý. Mặc dù hình dạng thân tàu hiển thị như một tàu chiến điển hình, nhưng khối lượng khổng lồ của $NAME_Opus_Sentinel$ lại phản ánh một cấu trúc bên trong cực kỳ dày đặc và có khả năng là một nguồn năng lượng uy lực.\n\nChúng ta tin rằng con tàu này có tri giác, tuy nhiên xu hướng tự đập phá các động cơ của nó ngụ ý về nỗi đau đớn dữ dội và sự mất phương hướng. Xét thấy chúng ta cũng đã quan sát thấy lượng bức xạ điện từ gây chết người phóng ra dữ dội khắp thân tàu, chúng ta khuyến nghị nên giữ một khoảng cách hết sức an toàn."
 unplugged.2495.desc.unplugged: "[root.GetName] đã giao chiến với một chiến hạm thù địch độc nhất vô nhị của [origin_unplugged_assimilator_empire.GetAdj] trong hệ sao [from.GetName]. Thoạt nhìn, '§Y$NAME_Opus_Sentinel$§!' này trông giống như bất kỳ tàu Máy Móc nào khác, nhưng các chỉ số năng lượng và khối lượng tuyệt đối của nó hàm ý về một kẻ thù đáng gờm hơn nhiều. Hơn nữa, chúng ta tin rằng con tàu có thể hoạt động tự chủ.\n\n$NAME_Opus_Sentinel$ dường như đang bảo vệ một thứ gì đó. Tuy nhiên, nó cũng có dấu hiệu đau đớn và khó chịu tột độ khi những đợt bùng nổ bức xạ điện từ dữ dội thường xuyên phóng ra khắp thân tàu. Với hành vi co giật như vậy, các mô hình chiến thuật của chúng ta không thể dự đoán một cách đáng tin cậy về các bước di chuyển tiếp theo của thực thể này."
 unplugged.2495.a: "Hãy luôn cảnh giác."

 d_unplugged_assimilator_hulk: "Xác Tàu Máy Móc Khổng Lồ"
 d_unplugged_assimilator_hulk_desc: "Xác tàu tan chảy của một Cỗ Máy từng có tri giác vẫn còn hiện diện trên thế giới này, sừng sững như một tấm bia mộ khổng lồ."
 deposit_requires_unplugged: "$TRIGGER_FAIL$§RTàn tích này hoàn toàn xa lạ đối với các đế chế có nền tảng như chúng ta. Chúng ta không có phương tiện để loại bỏ nó một cách an toàn.§!"
 opinion_implicated_by_unplugged_assimilator: "Bị Liên Lụy Bởi Cỗ Máy"

