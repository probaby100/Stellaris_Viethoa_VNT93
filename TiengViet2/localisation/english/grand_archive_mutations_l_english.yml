l_english:

 RED_EYE_BEAM: "Tia Mắt Đỏ"
 RED_EYE_BEAM_DESC: "Thủy tinh thể trong mắt sinh vật được cường hóa để phóng ra chùm tia laser đỏ cường độ cao. Việc biến đổi thêm bộ gen sẽ kích thích sự phát triển tự phát của các mắt phụ."
 RED_EYE_BEAM_SMALL: "$RED_EYE_BEAM$"
 RED_EYE_BEAM_MEDIUM: "$RED_EYE_BEAM$"
 RED_EYE_BEAM_LARGE: "$RED_EYE_BEAM$"
 RED_EYE_BEAM_EXTRA_LARGE: "$RED_EYE_BEAM$"

 BLUE_EYE_BEAM: "Tia Mắt Xanh"
 BLUE_EYE_BEAM_DESC: "Cải tiến bộ gen ở võng mạc cho phép các cơ quan thị giác phóng ra chùm tia năng lượng màu xanh mạnh mẽ hơn."
 BLUE_EYE_BEAM_SMALL: "$BLUE_EYE_BEAM$"
 BLUE_EYE_BEAM_MEDIUM: "$BLUE_EYE_BEAM$"
 BLUE_EYE_BEAM_LARGE: "$BLUE_EYE_BEAM$"
 BLUE_EYE_BEAM_EXTRA_LARGE: "$BLUE_EYE_BEAM$"

 UV_EYE_BEAM: "Tia Mắt Tử Ngoại"
 UV_EYE_BEAM_DESC: "Các bộ phóng tia tử ngoại bao bọc lấy võng mạc nhằm giải phóng chùm tia laser chuẩn xác và có sức tàn phá lớn hơn."
 UV_EYE_BEAM_SMALL: "$UV_EYE_BEAM$"
 UV_EYE_BEAM_MEDIUM: "$UV_EYE_BEAM$"
 UV_EYE_BEAM_LARGE: "$UV_EYE_BEAM$"
 UV_EYE_BEAM_EXTRA_LARGE: "$UV_EYE_BEAM$"

 XRAY_EYE_BEAM: "Tia Mắt Tia X"
 XRAY_EYE_BEAM_DESC: "Việc biến đổi sâu hơn võng mạc cho phép bắn ra các chùm laser có sức công phá cao hơn ở bước sóng ngắn hơn."
 XRAY_EYE_BEAM_SMALL: "$XRAY_EYE_BEAM$"
 XRAY_EYE_BEAM_MEDIUM: "$XRAY_EYE_BEAM$"
 XRAY_EYE_BEAM_LARGE: "$XRAY_EYE_BEAM$"
 XRAY_EYE_BEAM_EXTRA_LARGE: "$XRAY_EYE_BEAM$"

 GAMMA_EYE_BEAM: "Tia Mắt Gamma"
 GAMMA_EYE_BEAM_DESC: "Một cuộc đại tu toàn diện bộ gen của cơ quan thị giác đã tạo ra chùm tia có công suất phát và tiềm năng hủy diệt vô song."
 GAMMA_EYE_BEAM_SMALL: "$GAMMA_EYE_BEAM$"
 GAMMA_EYE_BEAM_MEDIUM: "$GAMMA_EYE_BEAM$"
 GAMMA_EYE_BEAM_LARGE: "$GAMMA_EYE_BEAM$"
 GAMMA_EYE_BEAM_EXTRA_LARGE: "$GAMMA_EYE_BEAM$"

 BIO_PLASMA_THROWER: "Súng Phóng Plasma Sinh Học"
 BIO_PLASMA_THROWER_DESC: "Biến đổi bộ gen này kích thích sự phát triển của các tuyến tạo plasma cùng những phần nhô ra dạng nòng súng để phóng plasma này đi xa."
 BIO_PLASMA_THROWER_SMALL: "$BIO_PLASMA_THROWER$"
 BIO_PLASMA_THROWER_MEDIUM: "$BIO_PLASMA_THROWER$"
 BIO_PLASMA_THROWER_LARGE: "$BIO_PLASMA_THROWER$"
 BIO_PLASMA_THROWER_EXTRA_LARGE: "$BIO_PLASMA_THROWER$"

 BIO_PLASMA_ACCELERATOR: "Bộ Gia Tốc Plasma Sinh Học"
 BIO_PLASMA_ACCELERATOR_DESC: "Tinh chỉnh các bộ gia tốc hữu cơ giúp tăng tầm bắn và ngăn rò rỉ plasma, tạo ra đầu đạn bay nhanh hơn và có sức tàn phá lớn hơn."
 BIO_PLASMA_ACCELERATOR_SMALL: "$BIO_PLASMA_ACCELERATOR$"
 BIO_PLASMA_ACCELERATOR_MEDIUM: "$BIO_PLASMA_ACCELERATOR$"
 BIO_PLASMA_ACCELERATOR_LARGE: "$BIO_PLASMA_ACCELERATOR$"
 BIO_PLASMA_ACCELERATOR_EXTRA_LARGE: "$BIO_PLASMA_ACCELERATOR$"

 BIO_PLASMA_CANNON: "Đại Bác Plasma Sinh Học"
 BIO_PLASMA_CANNON_DESC: "Gia tăng nồng độ plasma do sinh vật sản sinh cho phép sinh vật phóng ra các quả cầu hủy diệt với sức công phá đáng kinh ngạc."
 BIO_PLASMA_CANNON_SMALL: "$BIO_PLASMA_CANNON$"
 BIO_PLASMA_CANNON_MEDIUM: "$BIO_PLASMA_CANNON$"
 BIO_PLASMA_CANNON_LARGE: "$BIO_PLASMA_CANNON$"
 BIO_PLASMA_CANNON_EXTRA_LARGE: "$BIO_PLASMA_CANNON$"

 PARTICLE_BEAM: "Chùm Tia Hạt"
 PARTICLE_BEAM_DESC: "Một đột biến xâm lấn tạo ra các bộ phóng năng lượng hữu cơ gây sát thương hủy diệt từ tầm xa, nhưng phải trả giá bằng việc hạn chế khả năng cơ động."
 PARTICLE_BEAM_SMALL: "$PARTICLE_BEAM$"
 PARTICLE_BEAM_MEDIUM: "$PARTICLE_BEAM$"
 PARTICLE_BEAM_LARGE: "$PARTICLE_BEAM$"
 PARTICLE_BEAM_EXTRA_LARGE: "$PARTICLE_BEAM$"

 TACHYON_BEAM: "Chùm Tia Tachyon"
 TACHYON_BEAM_DESC: "Các bộ phóng năng lượng hữu cơ đã được cô đặc thành một ngọn giáo sinh học duy nhất, cho phép sinh vật bắn ra chùm tia tachyon cực mạnh."
 TACHYON_BEAM_SMALL: "$TACHYON_BEAM$"
 TACHYON_BEAM_MEDIUM: "$TACHYON_BEAM$"
 TACHYON_BEAM_LARGE: "$TACHYON_BEAM$"
 TACHYON_BEAM_EXTRA_LARGE: "$TACHYON_BEAM$"

 SHARP_EYE_LASER: "Laser Mắt Tinh Anh"
 SHARP_EYE_LASER_DESC: "Lấy cảm hứng từ laser cắt của Drone Khai Mỏ, đột biến này tạo ra chùm tia từ mắt chuyên dùng để xé toạc vỏ tàu ở cự ly gần."
 SHARP_EYE_LASER_SMALL: "$SHARP_EYE_LASER$"
 SHARP_EYE_LASER_MEDIUM: "$SHARP_EYE_LASER$"
 SHARP_EYE_LASER_LARGE: "$SHARP_EYE_LASER$"
 SHARP_EYE_LASER_EXTRA_LARGE: "$SHARP_EYE_LASER$"

 PROTON_THROWER: "Pháo Phóng Proton"
 PROTON_THROWER_DESC: "Đột biến này cho phép sinh vật tạo ra mật độ proton cô đặc cao làm đạn tấn công uy lực. Tuy nhiên, quá trình tích tụ năng lượng có thể khá tốn thời gian."
 PROTON_THROWER_SMALL: "$PROTON_THROWER$"
 PROTON_THROWER_MEDIUM: "$PROTON_THROWER$"
 PROTON_THROWER_LARGE: "$PROTON_THROWER$"
 PROTON_THROWER_EXTRA_LARGE: "$PROTON_THROWER$"

 NEUTRON_THROWER: "Pháo Phóng Neutron"
 NEUTRON_THROWER_DESC: "Nhờ khả năng khai thác sức mạnh của neutron nặng hơn đôi chút thay cho proton, các khối đạn cô đặc này trở nên có sức tàn phá khủng khiếp hơn."
 NEUTRON_THROWER_SMALL: "$NEUTRON_THROWER$"
 NEUTRON_THROWER_MEDIUM: "$NEUTRON_THROWER$"
 NEUTRON_THROWER_LARGE: "$NEUTRON_THROWER$"
 NEUTRON_THROWER_EXTRA_LARGE: "$NEUTRON_THROWER$"

 BIO_DISINTEGRATOR: "Bộ Phân Rã Sinh Học"
 BIO_DISINTEGRATOR_DESC: "Mô phỏng sức mạnh của máy phân rã vật chất từ Kẻ Không Mời (Unbidden), sinh vật trang bị vũ khí sinh học này có thể dễ dàng phân rã kẻ thù thành các thành phần nguyên tử cơ bản."
 BIO_DISINTEGRATOR_SMALL: "$BIO_DISINTEGRATOR$"
 BIO_DISINTEGRATOR_MEDIUM: "$BIO_DISINTEGRATOR$"
 BIO_DISINTEGRATOR_LARGE: "$BIO_DISINTEGRATOR$"
 BIO_DISINTEGRATOR_EXTRA_LARGE: "$BIO_DISINTEGRATOR$"

 MOLECULAR_DISRUPTOR: "Pháo Phá Hủy Phân Tử"
 MOLECULAR_DISRUPTOR_DESC: "Những vũ khí sinh học này vượt qua mọi hàng phòng thủ thông thường để nhắm thẳng vào các nguyên tử cấu thành của chính mục tiêu, bẻ gãy các liên kết phân tử nhằm gây sát thương nghiêm trọng cho thân tàu."
 MOLECULAR_DISRUPTOR_SMALL: "$MOLECULAR_DISRUPTOR$"
 MOLECULAR_DISRUPTOR_MEDIUM: "$MOLECULAR_DISRUPTOR$"
 MOLECULAR_DISRUPTOR_LARGE: "$MOLECULAR_DISRUPTOR$"
 MOLECULAR_DISRUPTOR_EXTRA_LARGE: "$MOLECULAR_DISRUPTOR$"

 ION_MOLECULAR_DISRUPTOR: "Pháo Phá Hủy Phân Tử Ion"
 ION_MOLECULAR_DISRUPTOR_DESC: "Các vũ khí sinh học này bắn ra những luồng hạt ion bất ổn định, giúp gia tăng lượng sát thương mà không làm giảm tốc độ bắn."
 ION_MOLECULAR_DISRUPTOR_SMALL: "$ION_MOLECULAR_DISRUPTOR$"
 ION_MOLECULAR_DISRUPTOR_MEDIUM: "$ION_MOLECULAR_DISRUPTOR$"
 ION_MOLECULAR_DISRUPTOR_LARGE: "$ION_MOLECULAR_DISRUPTOR$"
 ION_MOLECULAR_DISRUPTOR_EXTRA_LARGE: "$ION_MOLECULAR_DISRUPTOR$"

 PHASED_MOLECULAR_DISRUPTOR: "Pháo Phá Hủy Phân Tử Pha Lệch"
 PHASED_MOLECULAR_DISRUPTOR_DESC: "Vũ khí sinh học cực kỳ tiên tiến bắn ra các luồng năng lượng lượng tử không ổn định, đạt hiệu quả vô song trong việc xé toạc các liên kết phân tử của mục tiêu xấu số."
 PHASED_MOLECULAR_DISRUPTOR_SMALL: "$PHASED_MOLECULAR_DISRUPTOR$"
 PHASED_MOLECULAR_DISRUPTOR_MEDIUM: "$PHASED_MOLECULAR_DISRUPTOR$"
 PHASED_MOLECULAR_DISRUPTOR_LARGE: "$PHASED_MOLECULAR_DISRUPTOR$"
 PHASED_MOLECULAR_DISRUPTOR_EXTRA_LARGE: "$PHASED_MOLECULAR_DISRUPTOR$"

 LIGHTNING_BREATH: "Hơi Thở Sấm Sét"
 LIGHTNING_BREATH_DESC: "Biến đổi hệ hô hấp hiện có bằng các ống dẫn điện sinh học cho phép sinh vật có khả năng \"thở ra\" các vòng cung sét xuyên thấu."
 LIGHTNING_BREATH_SMALL: "$LIGHTNING_BREATH$"
 LIGHTNING_BREATH_MEDIUM: "$LIGHTNING_BREATH$"
 LIGHTNING_BREATH_LARGE: "$LIGHTNING_BREATH$"
 LIGHTNING_BREATH_EXTRA_LARGE: "$LIGHTNING_BREATH$"

 LIGHTNING_EMITTER: "Bộ Phát Sấm Sét"
 LIGHTNING_EMITTER_DESC: "Tích hợp thêm các ống dẫn năng lượng sinh học cho phép sinh vật điều khiển các vòng cung sét siêu nạp đầy hỗn loạn."
 LIGHTNING_EMITTER_SMALL: "$LIGHTNING_EMITTER$"
 LIGHTNING_EMITTER_MEDIUM: "$LIGHTNING_EMITTER$"
 LIGHTNING_EMITTER_LARGE: "$LIGHTNING_EMITTER$"
 LIGHTNING_EMITTER_EXTRA_LARGE: "$LIGHTNING_EMITTER$"

 FOCUSED_LIGHTNING_EMITTER: "Bộ Phát Sấm Sét Hội Tụ"
 FOCUSED_LIGHTNING_EMITTER_DESC: "Ổn định các cơ quan phát điện bị đột biến giúp tăng độ chính xác và cường độ, biến những vòng cung sét hoang dại thành những chùm tia hủy diệt thuần điện lực chuẩn xác."
 FOCUSED_LIGHTNING_EMITTER_SMALL: "$FOCUSED_LIGHTNING_EMITTER$"
 FOCUSED_LIGHTNING_EMITTER_MEDIUM: "$FOCUSED_LIGHTNING_EMITTER$"
 FOCUSED_LIGHTNING_EMITTER_LARGE: "$FOCUSED_LIGHTNING_EMITTER$"
 FOCUSED_LIGHTNING_EMITTER_EXTRA_LARGE: "$FOCUSED_LIGHTNING_EMITTER$"

 ENERGY_SIPHON: "Hút Năng Lượng"
 ENERGY_SIPHON_DESC: "Được phỏng theo vũ khí tự nhiên của loài Tiyanki, đột biến này bổ sung một cơ quan mới có khả năng bòn rút năng lượng từ những kẻ thù ở gần."
 ENERGY_SIPHON_SMALL: "$ENERGY_SIPHON$"
 ENERGY_SIPHON_MEDIUM: "$ENERGY_SIPHON$"
 ENERGY_SIPHON_LARGE: "$ENERGY_SIPHON$"
 ENERGY_SIPHON_EXTRA_LARGE: "$ENERGY_SIPHON$"

 NULL_VOID_SIPHON: "Hút Năng Lượng Thái Hư"
 NULL_VOID_SIPHON_DESC: "Một biến thể từ vũ khí tự nhiên của Trùng Biến Hình Không Gian (Space Amoeba), cơ quan này sản sinh các Chùm Tia Thái Hư với khả năng độc nhất là triệt tiêu năng lượng bằng một lực hỗn độn entropy tương đương."
 NULL_VOID_SIPHON_SMALL: "$NULL_VOID_SIPHON$"
 NULL_VOID_SIPHON_MEDIUM: "$NULL_VOID_SIPHON$"
 NULL_VOID_SIPHON_LARGE: "$NULL_VOID_SIPHON$"
 NULL_VOID_SIPHON_EXTRA_LARGE: "$null_void_siphon$"

 SHARD_ACCELERATOR: "Máy Gia Tốc Mảnh Xương"
 SHARD_ACCELERATOR_DESC: "Vũ khí hóa lực tĩnh điện tiềm ẩn, Máy Gia Tốc Mảnh Xương bắn ra các mảnh xương nhiễm từ với vận tốc cực lớn."
 SHARD_ACCELERATOR_SMALL: "$SHARD_ACCELERATOR$"
 SHARD_ACCELERATOR_MEDIUM: "$SHARD_ACCELERATOR$"
 SHARD_ACCELERATOR_LARGE: "$SHARD_ACCELERATOR$"
 SHARD_ACCELERATOR_EXTRA_LARGE: "$SHARD_ACCELERATOR$"

 BIO_COIL_SHARD_ACCELERATOR: "Máy Gia Tốc Mảnh Xương Cuộn Sinh Học"
 BIO_COIL_SHARD_ACCELERATOR_DESC: "Các đường dẫn thần kinh điện dạng cuộn giúp cải thiện khả năng nạp lại tĩnh điện, cho phép sinh vật phóng ra các mảnh xương nhiễm từ với vận tốc cao hơn."
 BIO_COIL_SHARD_ACCELERATOR_SMALL: "$BIO_COIL_SHARD_ACCELERATOR$"
 BIO_COIL_SHARD_ACCELERATOR_MEDIUM: "$BIO_COIL_SHARD_ACCELERATOR$"
 BIO_COIL_SHARD_ACCELERATOR_LARGE: "$BIO_COIL_SHARD_ACCELERATOR$"
 BIO_COIL_SHARD_ACCELERATOR_EXTRA_LARGE: "$BIO_COIL_SHARD_ACCELERATOR$"

 SHARD_RAIL_ACCELERATOR: "Máy Gia Tốc Mảnh Xương Dạng Ray"
 SHARD_RAIL_ACCELERATOR_DESC: "Các chi phụ dạng đường ray chuyển đổi hóa năng thành điện năng, tạo ra từ trường cực mạnh để phóng đi các mảnh đạn chết chóc."
 SHARD_RAIL_ACCELERATOR_SMALL: "$SHARD_RAIL_ACCELERATOR$"
 SHARD_RAIL_ACCELERATOR_MEDIUM: "$SHARD_RAIL_ACCELERATOR$"
 SHARD_RAIL_ACCELERATOR_LARGE: "$SHARD_RAIL_ACCELERATOR$"
 SHARD_RAIL_ACCELERATOR_EXTRA_LARGE: "$SHARD_RAIL_ACCELERATOR$"

 ADVANCED_SHARD_RAIL_ACCELERATOR: "Máy Gia Tốc Mảnh Xương Dạng Ray Tiên Tiến"
 ADVANCED_SHARD_RAIL_ACCELERATOR_DESC: "Các chi phụ phát điện bổ sung giúp tăng cường điện tích cho ray phóng, đẩy nhanh tốc độ đầu đạn để tăng khả năng sát thương."
 ADVANCED_SHARD_RAIL_ACCELERATOR_SMALL: "$ADVANCED_SHARD_RAIL_ACCELERATOR$"
 ADVANCED_SHARD_RAIL_ACCELERATOR_MEDIUM: "$ADVANCED_SHARD_RAIL_ACCELERATOR$"
 ADVANCED_SHARD_RAIL_ACCELERATOR_LARGE: "$ADVANCED_SHARD_RAIL_ACCELERATOR$"
 ADVANCED_SHARD_RAIL_ACCELERATOR_EXTRA_LARGE: "$ADVANCED_SHARD_RAIL_ACCELERATOR$"

 SHARD_GAUSS_ACCELERATOR: "Máy Gia Tốc Gauss Mảnh Xương"
 SHARD_GAUSS_ACCELERATOR_DESC: "Các chi phụ cuộn xoắn phức tạp khai thác một lượng lớn điện sinh học để phóng các mảnh đạn đi với tốc độ không gì sánh kịp."
 SHARD_GAUSS_ACCELERATOR_SMALL: "$SHARD_GAUSS_ACCELERATOR$"
 SHARD_GAUSS_ACCELERATOR_MEDIUM: "$SHARD_GAUSS_ACCELERATOR$"
 SHARD_GAUSS_ACCELERATOR_LARGE: "$SHARD_GAUSS_ACCELERATOR$"
 SHARD_GAUSS_ACCELERATOR_EXTRA_LARGE: "$SHARD_GAUSS_ACCELERATOR$"

 THORN_CANNON: "Đại Bác Gai Nhọn"
 THORN_CANNON_DESC: "Các lỗ phun bổ sung phóng ra những loạt dịch chất dễ nổ được bọc trong các mảnh xương cứng với tốc độ bắn ấn tượng."
 THORN_CANNON_SMALL: "$THORN_CANNON$"
 THORN_CANNON_MEDIUM: "$THORN_CANNON$"
 THORN_CANNON_LARGE: "$THORN_CANNON$"
 THORN_CANNON_EXTRA_LARGE: "$THORN_CANNON$"

 RIPPER_THORN_CANNON: "Đại Bác Gai Xé Toạc"
 RIPPER_THORN_CANNON_DESC: "Kéo dài nòng lỗ phun và cải thiện cấu trúc mảnh gai giúp các đại bác gai này bắn ra những loạt đạn nổ nguy hiểm hơn nữa."
 RIPPER_THORN_CANNON_SMALL: "$RIPPER_THORN_CANNON$"
 RIPPER_THORN_CANNON_MEDIUM: "$RIPPER_THORN_CANNON$"
 RIPPER_THORN_CANNON_LARGE: "$RIPPER_THORN_CANNON$"
 RIPPER_THORN_CANNON_EXTRA_LARGE: "$RIPPER_THORN_CANNON$"

 ACIDSTORM_THORN_CANNON: "Đại Bác Gai Bão Axit"
 ACIDSTORM_THORN_CANNON_DESC: "Việc tăng mạnh nồng độ chất lỏng dễ nổ cho phép loạt gai xương làm tan chảy lá chắn, ăn mòn kim loại và xé toạc da thịt với hiệu suất đáng kinh ngạc."
 ACIDSTORM_THORN_CANNON_SMALL: "$ACIDSTORM_THORN_CANNON$"
 ACIDSTORM_THORN_CANNON_MEDIUM: "$ACIDSTORM_THORN_CANNON$"
 ACIDSTORM_THORN_CANNON_LARGE: "$ACIDSTORM_THORN_CANNON$"
 ACIDSTORM_THORN_CANNON_EXTRA_LARGE: "$ACIDSTORM_THORN_CANNON$"

 NANITE_INFUSED_THORN_CANNON: "Đại Bác Gai Truyền Nanite"
 NANITE_INFUSED_THORN_CANNON_DESC: "Thay thế đạn hữu cơ bằng các nanite tự nhân bản, những khẩu pháo gai này có thể giải phóng xung điện từ EMP tầm ngắn và gặm nhấm mọi loại vật chất."
 NANITE_INFUSED_THORN_CANNON_SMALL: "$NANITE_INFUSED_THORN_CANNON$"
 NANITE_INFUSED_THORN_CANNON_MEDIUM: "$NANITE_INFUSED_THORN_CANNON$"
 NANITE_INFUSED_THORN_CANNON_LARGE: "$NANITE_INFUSED_THORN_CANNON$"
 NANITE_INFUSED_THORN_CANNON_EXTRA_LARGE: "$NANITE_INFUSED_THORN_CANNON$"

 CHITIN_BATTERY: "Dàn Pháo Chitin"
 CHITIN_BATTERY_DESC: "Đột biến cồng kềnh này mang lại khả năng tạo ra các thanh chitin đậm đặc và phóng chúng đi ở vận tốc cao từ khoảng cách rất xa."
 CHITIN_BATTERY_SMALL: "$CHITIN_BATTERY$"
 CHITIN_BATTERY_MEDIUM: "$CHITIN_BATTERY$"
 CHITIN_BATTERY_LARGE: "$CHITIN_BATTERY$"
 CHITIN_BATTERY_EXTRA_LARGE: "$CHITIN_BATTERY$"

 CHITIN_ARTILLERY: "Trọng Pháo Chitin"
 CHITIN_ARTILLERY_DESC: "Các chi phụ nâng đỡ bổ sung mang lại sơ tốc đầu nòng và độ ổn định cao hơn, tăng thêm uy lực cho dàn pháo hữu cơ."
 CHITIN_ARTILLERY_SMALL: "$CHITIN_ARTILLERY$"
 CHITIN_ARTILLERY_MEDIUM: "$CHITIN_ARTILLERY$"
 CHITIN_ARTILLERY_LARGE: "$CHITIN_ARTILLERY$"
