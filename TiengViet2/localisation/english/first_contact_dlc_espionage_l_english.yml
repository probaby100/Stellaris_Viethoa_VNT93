 espionage_pre_ftl_indoctrination:0 "Biến Động Xã Hội"
 espionage_pre_ftl_indoctrination_desc:0 "Một bộ phận người dân trong xã hội này gần đây đã thay đổi quan điểm về triển vọng chính trị, và chấp nhận một hệ tư tưởng mới hoàn toàn khác biệt."
