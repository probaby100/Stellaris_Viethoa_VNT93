l_english:
 ### Pre-FTL Espionage Operations
 diplomacy_wrong_interference_policy:0 "$TRIGGER_FAIL$§RChính Sách §Y$policy_interference$§! của chúng ta không cho phép chúng ta tiến hành Hoạt Động Gián Điệp ở đây.§!"

 operation_requires_observation_outpost:0 "$TRIGGER_FAIL$§RCần phải có một §YTrạm Quan Sát§! trên quỹ đạo quanh hành tinh mẹ của họ.§!"
 operation_has_disguise:0 " " # Intentionally empty string
 operation_no_disguise_bio:0 "§HViệc thiếu §Y$tech_gene_tailoring$§! sẽ khiến đặc vụ của chúng ta gặp nhiều khó khăn hơn trong việc ngụy trang thành người dân địa phương, điều này sẽ làm tăng xác suất kích hoạt các sự kiện tiêu cực ngẫu nhiên.§!"
 operation_no_disguise_machine:0 "§HViệc thiếu §Y$tech_robomodding$§! sẽ khiến các drone thâm nhập của chúng ta gặp nhiều khó khăn hơn trong việc ngụy trang thành người dân địa phương, điều này sẽ làm tăng xác suất kích hoạt các sự kiện tiêu cực ngẫu nhiên.§!"
 operation_wrong_tech_level:0 "$TRIGGER_FAIL$§RCấp độ công nghệ của nền văn minh này chưa đủ tiên tiến, vẫn chưa thể gia nhập đế chế của chúng ta.§!\n\n"
 operation_is_gestalt:0 "$TRIGGER_FAIL$§RHọ là §YÝ thức Gestalt§!. Họ không thể hòa nhập với các hình thái xã hội khác.§!\n\n"
 operation_gestalt_cant_indoctrinate:0 "$TRIGGER_FAIL$§RChúng ta là §YÝ thức Gestalt§!. Chúng ta không thể cải đạo cho họ.§!\n\n"
 operation_gestalt_mismatched:0 "$TRIGGER_FAIL$§RChúng ta không thể thâm nhập một đế chế quá khác biệt với mình.§!\n\n"
 operation_wrong_interference_policy:0 "$TRIGGER_FAIL$§RChính Sách §Y$policy_interference$§! của chúng ta không cho phép Chiến Dịch này.§!\n\n"
 operation_wrong_enlightenment_policy:0 "$TRIGGER_FAIL$§RChính Sách §Y$policy_enlightenment$§! của chúng ta không cho phép Chiến Dịch này.§!\n\n"
 operation_same_ethos:0 "$TRIGGER_FAIL$§RHệ tư tưởng của nền văn minh này đã giống với chúng ta.§!\n\n"
 operation_failed_infiltration:0 "$TRIGGER_FAIL$§RHoạt động gần đây của chúng ta đã khiến cư dân địa phương nâng cao cảnh giác.§!\n\n"

 operation_awareness_risk:0 "\nLàm tăng nguy cơ [from.target.GetName] đạt được £awareness£§YThức tỉnh§! trong quá trình hoạt động gián điệp của chúng ta." # event tooltip
 operation_random_event_resolved:0 "§YChiến dịch [from.GetName]§! sẽ tiếp tục theo kế hoạch."
 operation_random_event_resolved_poor:0 "§YChiến dịch [from.GetName]§! sẽ vượt qua trở ngại §Rtiêu cực§! này và tiếp tục tiến hành."
 operation_random_event_resolved_good:0 "§YChiến dịch [from.GetName]§! sẽ được khôi phục, và có xu hướng đạt được kết quả §Gtích cực§! hơn."
 operation_random_event_resolved_excellent:0 "§YChiến dịch [from.GetName]§! sẽ được khôi phục, và có thể đạt được kết quả §Gtích cực§!."

 operation_infiltrate_government:0 "Thâm Nhập Chính Phủ"
 operation_infiltrate_government_desc:0 "Các đặc vụ sẽ thâm nhập vào mọi khía cạnh trong xã hội của họ, dần dần thay thế các nhà lãnh đạo thế giới của họ, luôn sẵn sàng cho việc sáp nhập hành tinh."
 operation_infiltrate_government_on_success:0 "$IF_SUCCESSFUL|E$\nSáp nhập hành tinh này, đồng thời làm cho mức độ hạnh phúc của người dân địa phương tăng mạnh trong thời gian ngắn.\n\n[owner.GetDisguiseState]"

 operation_indoctrinate_society:0 "Truyền Bá Xã Hội"
 operation_indoctrinate_society_desc:1 "Bằng cách tác động đến một nhóm nhỏ người trong [target.GetName], các đặc vụ của chúng ta có thể dẫn dắt cách tư duy của toàn bộ xã hội họ đi theo con đường đúng đắn của chúng ta."
 operation_indoctrinate_society_on_success:0 "$IF_SUCCESSFUL|E$\nChuyển dịch hệ tư tưởng của dân số địa phương sang hệ tư tưởng của chúng ta.\n\n[owner.GetDisguiseState]"

 operation_plant_advanced_knowledge:0 "Gieo Mầm Tri Thức Tiên Tiến"
 operation_plant_advanced_knowledge_desc:0 "[target.GetName] có thể là một xã hội Tiền-FTL, nhưng họ có khả năng vươn tới các vì sao. Điều duy nhất họ cần là một cú hích nhẹ từ ai đó."
 operation_plant_advanced_knowledge_on_success:0 "$IF_SUCCESSFUL|E$\nThúc đẩy tiến độ công nghệ của mục tiêu.\n\n[owner.GetDisguiseState]"

 operation_increase_awareness:0 "Nâng Cao Mức Độ Thức Tỉnh"
 operation_increase_awareness_desc:0 "Đã đến lúc để [root.target.GetName] hiểu ra rằng, họ không hề đơn độc trong vũ trụ này."
 operation_increase_awareness_on_success:0 "$IF_SUCCESSFUL|E$\nNâng cao cấp độ thức tỉnh của [root.target.GetName].\n\n[owner.GetDisguiseState]"

 operation_spread_disinformation:0 "Phát Tán Thông Tin Sai Lệch"
 operation_spread_disinformation_desc:0 "Chân lý luôn ở đó, nhưng [root.target.GetName] vẫn chưa sẵn sàng để đối mặt với nó."
 operation_spread_disinformation_on_success:0 "$IF_SUCCESSFUL|E$\nGiảm cấp độ thức tỉnh của [root.target.GetName].\n\n[owner.GetDisguiseState]"

 operation_infiltrate_hive:0 "Thâm Nhập Tổ Đàn"
 operation_infiltrate_hive_desc:0 "Thông qua việc thay thế các cá thể nút mạng một cách có chiến lược, ý thức của chúng ta có thể dần dần tích hợp các chức năng then chốt của cụm tổ đàn địa phương."
 operation_infiltrate_hive_on_success:0 "$IF_SUCCESSFUL|E$\nHòa nhập các cá thể địa phương vào ý thức của chúng ta để từ đó sáp nhập hành tinh này.\n\n[owner.GetDisguiseState]"

### Operation Events

 preftl_operation.1000.name:0 "[from.GetName]: Đặc vụ đã sẵn sàng" # Operation name, i.e. 'Infiltrate Government'
 preftl_operation.1000.desc.okay:0 "Tất cả các nhà lãnh đạo quan trọng của [target.GetSpeciesName] tại [target.capital_scope.GetName] đều đã bị mật vụ của chúng ta đánh tráo. Giờ đây, các nhân sự thâm nhập đang củng cố những bước tiến của chúng ta trên [target.capital_scope.GetPlanetHabitat]. Đã đến lúc hành động."
 preftl_operation.1000.desc.good:0 "Hiện tại, chúng ta có hàng ngàn đặc vụ bí mật tại [target.capital_scope.GetName], và đã thâm nhập vào mọi ngóc ngách của [root.target.capital_scope.GetPlanetHabitat]. Một số đặc vụ đã vươn lên vị trí cao trong hệ thống quyền lực địa phương, và lợi dụng sức ảnh hưởng từ chức vụ của mình để tạo điều kiện thuận lợi cho các đặc vụ khác."
 preftl_operation.1000.desc.poor:0 "Mặc dù trên bề mặt, chúng ta có hàng ngàn đặc vụ tại [target.capital_scope.GetName], nhưng tiến độ vẫn luôn chậm chạp. Chúng ta từng cố gắng lật đổ một khu định cư chính do [target.GetName] tạo thành, nhưng kết cục lại vô cùng thê thảm. Các đặc vụ liên quan đều đã hy sinh hoặc tự sát.\n\nNhờ hành động dũng cảm của một nhóm điệp viên nằm vùng, chính quyền đã không tìm thấy xác chết, và không thể nhìn thấu các hoạt động của chúng ta trên hành tinh này."
 #preftl_operation.1001.name:1 "Shaping the Future"
 #preftl_operation.1001.desc:1 "Our operatives have successfully embedded themselves within the [infiltrated_country_species.GetAdj] political leadership. We now hold control over every world power, and can shape the future of [infiltrated_country_planet.GetName] to our will."
 #preftl_operation.1002.name:1 "Influencing Affairs"
 #preftl_operation.1002.desc:1 "Our operatives have covertly gained a foothold over the [infiltrated_country_species.GetAdj] political leadership. We are now in a position of great influence regarding the internal affairs of [infiltrated_country_planet.GetName]. The mission was a success."
 #preftl_operation.1003.name:1 "Minor Influence"
 #preftl_operation.1003.desc:1 "After a poor start, our operatives were able to infiltrate the governments of [infiltrated_country_planet.GetName]. We were unable to secure many high ranking roles within the political leadership, but we are now in a position to influence minor tactical decisions concerning the [infiltrated_country_species.GetName]."
#  observation.3008.desc:1 "While our agents have successfully replaced most of the local leaders on [root.target.GetSpeciesName], a stubborn few remain. A concerted effort is now underway to remove the last holdouts, but the date of our planned reveal will need to be pushed forward."
 preftl_operation.1005.name:0 "Đại Giá Quang Lâm"
 preftl_operation.1005.desc:1 "Sau khi hoàn toàn kiểm soát giới lãnh đạo chính trị cấp cao của [infiltrated_country_species.GetAdj], nhân sự thâm nhập của chúng ta đã chuẩn bị sẵn sàng để chào đón chuyến thăm chính thức đầu tiên của nhóm liên lạc.\n\nTại một buổi lễ quy mô lớn được tổ chức ở thủ đô mới của hành tinh, toàn bộ các nhà lãnh đạo của [infiltrated_country_planet.GetName] đã cùng ký vào lá đơn thỉnh cầu sáp nhập ngay lập tức [infiltrated_country_planet.GetPlanetHabitat] vào [root.GetName]. Đại sứ ngoại giao của chúng ta đã vô cùng độ lượng chấp nhận yêu cầu này. Người dân hân hoan đổ ra đường, reo hò chào đón những ân nhân ngoài hành tinh của họ."
 preftl_operation.1006.name:1 "Sự Đón Tiếp Nồng Nhiệt"
 preftl_operation.1006.desc:1 "Sau khi tạo được chỗ đứng vững chắc trong giới lãnh đạo chính trị của [infiltrated_country_species.GetAdj], đội ngũ thâm nhập của chúng ta đã dọn đường cho sự xuất hiện chính thức của đơn vị liên lạc đầu tiên. Tại một buổi lễ được tổ chức vô cùng trang trọng ở thủ đô hành tinh, đặc sứ của chúng ta đã khiêm tốn nhận lấy bản trần tình do đích thân thủ lĩnh của hành tinh [infiltrated_country_planet.GetName] ký tên. Tài liệu này vạch ra kế hoạch sáp nhập [infiltrated_country_planet.GetPlanetHabitat] vào [root.GetName]. Rất đông cư dân đã đổ ra đường để nồng nhiệt chào đón những người ân nhân ngoài hành tinh mới của họ."
 preftl_operation.1007.name:1 "Sự Đón Tiếp Lạnh Nhạt"
 preftl_operation.1007.desc:1 "Sau khi thâm nhập vào giới lãnh đạo chính trị của [infiltrated_country_species.GetAdj], các đặc vụ của chúng ta đã dọn đường cho sự xuất hiện của đơn vị liên lạc đầu tiên. Họ không hề có ý định tổ chức bất kỳ buổi lễ nào để chào đón sự xuất hiện của sứ thần ngoại giao của chúng ta. Tuy nhiên, chúng ta đã đạt được sự đồng thuận với tập đoàn lãnh đạo của [infiltrated_country_planet.GetName]. [infiltrated_country_planet.GetPlanetHabitat] của họ sẽ được sáp nhập vào [root.GetName]."
 preftl_operation.1005.tt:0 "§Y[infiltrated_country_planet.GetName]§! cùng toàn bộ cư dân sẽ gia nhập §Y[root.GetName]§!."
 preftl_operation.1008.name:0 "Chiến dịch [From.GetName] Thất bại"
 preftl_operation.1008.desc:0 "Việc chúng ta thâm nhập vào giới lãnh đạo chính trị của [infiltrated_country_species.GetAdj] hoàn toàn không hề triệt để như những gì chúng ta được nhồi sọ. Sau khi bước đầu thâm nhập vào các quốc gia chủ chốt thất bại, chúng ta đã cố gắng kích động đảo chính ở một số chế độ nhỏ hơn. Thế nhưng ngay cả khi làm như vậy, chúng ta vẫn không thể giành được sự ủng hộ của người dân.\n\nChúng ta đã rút toàn bộ các đặc vụ còn sống sót khỏi [infiltrated_country_planet.GetName]. Rõ ràng là cư dân địa phương sẽ tiếp tục duy trì sự cảnh giác cao độ trong nhiều năm tới."
 preftl_operation.failed_annaxation.tt:0 "§RChúng ta không thể phát động bất kỳ nhiệm vụ §H[From.GetName]§! nào nữa trong vòng 5 năm tới.§!"
 attempted_infiltration:0 "Thâm nhập bất thành"

# Operation Indoctrinate Society
 preftl_operation.1015.name:1 "Chuẩn bị lôi kéo [target.GetName]" # pre-FTL country name
 preftl_operation.1015.desc:1 "Công việc của chúng ta nhằm gây ảnh hưởng ngầm lên những cư dân [owner.GetPreFTLLower] tại [target.capital_scope.GetName] đã đạt đến đỉnh điểm. Các đặc vụ của chúng ta đã sẵn sàng để truyền bá các giá trị văn hóa của chúng ta vào xã hội người [target.GetSpeciesAdj]."

 preftl_operation.1016.name:1 "Tác động đến quần chúng"
 preftl_operation.1016.intro:0 "Mặc dù đà phát triển ban đầu có vẻ khá khả quan, nhưng chỉ có thời gian mới trả lời được những nỗ lực của chúng ta đối với §H[from.target.GetAdj]§! có thể duy trì được bao lâu. Những người ủng hộ [from.target.GetSpeciesNamePlural] đã hoàn toàn chấp nhận hệ tư tưởng của chúng ta và coi nó như của chính mình." # used for both pre- and post-industrial societies
 preftl_operation.1016.intro.good:0 "Công việc của chúng ta tại §H[from.target.GetName]§! đã đạt được những tiến bộ to lớn. Bằng cách thao túng cẩn thận các meme văn hóa và phong tục xã hội, chúng ta đã thúc đẩy một sự thay đổi văn hóa sâu sắc, và gần như khiến người ta nhầm tưởng đây là một hiện tượng hoàn toàn tự phát." # used for both pre- and post-industrial societies
 preftl_operation.1016.intro.poor:0 "Công việc của chúng ta tại §H[from.target.GetName]§! không hề thuận buồm xuôi gió, nhưng cuối cùng cũng đã thành công. Mặc dù những nỗ lực của chúng ta không thu hút được nhiều người ủng hộ địa phương như mong đợi, nhưng cũng đã đạt được một số kết quả tích cực." # used for both pre- and post-industrial societies

 preftl_operation.1016.autho:0 "Các đặc vụ của chúng ta đã vận dụng khéo léo những kinh nghiệm của các bậc tiền bối vinh quang để thiết lập một mô hình nguyên thủy mang màu sắc §YChủ nghĩa Độc đoán§! của [root.GetAdj]. Một nhóm người địa phương được sàng lọc kỹ càng đã được trao quyền cai trị những cộng đồng này, một số sẽ phát triển phồn vinh, trong khi một số khác sẽ dần lụi tàn. Và tất cả những điều này sẽ trở thành một bài học sâu sắc cho [from.target.GetSpeciesNamePlural], hướng dẫn họ học cách suy ngẫm về các hình thức tổ chức xã hội phù hợp." # pre-industrial societies only
 preftl_operation.1016.egali:0 "Các đặc vụ của chúng ta đã đi sâu vào cơ sở, giao lưu với các cộng đồng địa phương về các vấn đề công bằng và bình đẳng. Mặc dù sự hiểu biết của người [from.target.GetSpeciesAdj] về chính trị vẫn đang ở giai đoạn sơ khai, nhưng chúng ta đã thúc đẩy một số hoạt động thảo luận sâu hơn trong số những người dân địa phương. Chiến dịch [from.GetName] đã kết thúc, chúng ta sẽ để lại quyền tự quyết cho những người ủng hộ tại địa phương, để họ tự mình tìm ra con đường hướng tới §YChủ nghĩa Cá nhân§!." # pre-industrial societies only
 preftl_operation.1016.mater:0 "Các đặc vụ được chúng ta tuyển chọn kỹ lưỡng đều có kiến thức uyên thâm trong lĩnh vực nghệ thuật và giáo dục tư duy, họ đang thực hiện công cuộc khai sáng cho các cộng đồng khác nhau trên [from.target.capital_scope.GetPlanetHabitat]. Họ đã áp dụng phương pháp giáo dục tùy theo năng lực đối với các nền văn hóa [from.target.GetSpeciesAdj] khác nhau, và đã gặt hái được vô số thành quả dưới hình thức các salon, tác phẩm văn học nghệ thuật và tổ chức giáo dục. Những công cụ mang màu sắc §YChủ nghĩa Duy vật§! này đã được kế thừa lại cho [from.target.GetSpeciesNamePlural]." # pre-industrial societies only
 preftl_operation.1016.milit:0 "Ngày nay, trong nhiều nền văn hóa của người [from.target.GetSpeciesAdj], danh dự và sự dũng cảm đã trở thành những điều quan trọng hàng đầu. Các đặc vụ của chúng ta đã cải trang thành lính đánh thuê, quân khởi nghĩa và những kẻ buôn bán vũ khí, sử dụng các loại vũ khí nghi lễ tinh xảo, kỹ thuật chiến đấu đẹp mắt và một loạt các cuộc chạm trán được dàn dựng công phu để làm cho người dân địa phương phải há hốc mồm kinh ngạc. Tất cả những điều này đang truyền cảm hứng cho một [from.target.GetName] ngày càng mang đậm chất §YChủ nghĩa Quân phiệt§! hơn." # used for both pre- and post-industrial societies
 preftl_operation.1016.pacif:0 "Các đặc vụ được chúng ta tuyển chọn kỹ lưỡng đều rất thành thạo các kỹ năng hòa giải, họ đã tiến hành hòa giải giữa vô số các nhóm người địa phương, và bốc ra những phương thuốc mang đậm tính §YChủ nghĩa Hòa bình§! của [root.GetAdj] để chữa trị cho vô số căn bệnh xã hội thâm căn cố đế của người [from.target.GetSpeciesAdj]. Giờ đây, trong mắt những cộng đồng này, bạo lực đã không còn là sự lựa chọn ưu tiên hàng đầu nữa." # used for both pre- and post-industrial societies
 preftl_operation.1016.phile:0 "Các đặc vụ của chúng ta đã thúc đẩy tiến độ công việc một cách toàn diện, sử dụng những câu chuyện, nghệ thuật và các hoạt động cộng đồng để thúc đẩy sự tò mò và thái độ trân trọng đối với các nền văn hóa khác. Giờ đây, chiến dịch [from.GetName] đã kết thúc, các đặc vụ của chúng ta đặt nhiều kỳ vọng vào những kẻ §YThân ngoại§! tại địa phương, hy vọng họ có thể tiếp tục cuộc thảo luận, để [from.target.GetName] chuẩn bị sẵn sàng cho việc sinh sống trong một vũ trụ đa dạng." # used for both pre- and post-industrial societies
 preftl_operation.1016.phobe:0 "Nỗi sợ hãi và sự nghi ngờ rất dễ nảy sinh từ sự bốc đồng, nhưng lại rất khó để kiểm soát. Các đặc vụ của chúng ta đã cẩn thận biên soạn các bài phát biểu và tác phẩm nghệ thuật để thể hiện những mặt tích cực của việc tự bảo vệ bản thân, đồng thời dạy cho họ biết về những mối nguy hiểm từ các ảnh hưởng bên ngoài. Những người ủng hộ [from.target.GetSpeciesAdj] vô cùng tán thành các khóa học của các đặc vụ về các vấn đề §YBài ngoại§!." # pre-industrial societies only
 preftl_operation.1016.spiri:0 "Chúng ta đã tiến hành theo hai hướng, một mặt để cho một nhóm đặc vụ có sức lôi cuốn lãnh đạo một số giáo phái dựa trên tín ngưỡng địa phương, mặt khác lại phái một nhóm đặc vụ khác để bảo vệ những phong trào đang phát triển mạnh mẽ này khỏi sự can thiệp và chèn ép của chính trị. Những cộng đồng [from.target.GetSpeciesAdj] đã được khai sáng này đã chấp nhận một loại §YChủ nghĩa Duy tâm§! dựa trên nền tảng văn hóa địa phương. Họ sẽ tự mình bước lên con đường thần thánh." # used for both pre- and post-industrial societies

