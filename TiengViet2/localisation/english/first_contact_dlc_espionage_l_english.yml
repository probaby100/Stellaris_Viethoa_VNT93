 preftl_operation.1019.name:0 "Tác động đến công chúng"
 preftl_operation.1019.autho:0 "Các đặc vụ của chúng ta đã vận dụng những kinh nghiệm được truyền lại từ các bậc tiền bối vinh quang để thiết lập một mô hình thu nhỏ mang màu sắc §YChủ nghĩa Độc đoán§! của [root.GetAdj] trên [from.target.capital_scope.GetName]. Họ đã đúc kết lại một số tổ chức, sắp xếp vô số các tổ chức [from.target.GetSpeciesNamePlural] thành những tầng lớp được thiết kế tỉ mỉ. Không phải tất cả các cộng đồng đều có thể trụ lại đến cuối cùng, nhưng những cộng đồng thất bại sẽ trở thành những bài học kinh nghiệm quý giá, nuôi dưỡng trật tự xã hội của họ." # post-industrial societies only
 preftl_operation.1019.egali:0 "Các đặc vụ của chúng ta đã đi sâu vào cơ sở, giao lưu với các cộng đồng và cơ quan địa phương về các vấn đề công bằng và bình đẳng. Khoa học chính trị của người [from.target.GetSpeciesAdj] đã có xu hướng trưởng thành, nhưng chúng ta vẫn thúc đẩy một số phong trào, nhằm đẩy mạnh các cuộc tranh luận mang tính bao trùm hơn và các chính sách §YChủ nghĩa Bình đẳng§!." # post-industrial societies only
 preftl_operation.1019.mater:0 "Các đặc vụ được chúng ta tuyển chọn kỹ lưỡng đều có kiến thức uyên thâm trong lĩnh vực nghệ thuật và giáo dục tư duy, họ đang thực hiện công cuộc khai sáng cho các cộng đồng và cơ sở giáo dục trên [from.target.capital_scope.GetPlanetHabitat]. Những nỗ lực của họ đã hình thành nên một số trung tâm nghiên cứu, quỹ giáo dục và thậm chí là khởi đầu cho một phong trào văn hóa nghệ thuật mới. Những công cụ mang màu sắc §YChủ nghĩa Duy vật§! này đã được kế thừa lại cho [from.target.GetSpeciesNamePlural]." # post-industrial societies only
 preftl_operation.1019.phobe:0 "Nỗi sợ hãi và sự nghi ngờ rất dễ nảy sinh từ sự bốc đồng, nhưng lại rất khó để kiểm soát, đặc biệt là đối với một xã hội đã tiếp cận truyền thông trên diện rộng như thế này thì điều đó lại càng đúng hơn. Các đặc vụ của chúng ta đã âm thầm cấy ghép những luận điệu §YChủ nghĩa Bài ngoại§! và các phong trào văn hóa thể hiện những mặt tích cực của việc tự bảo vệ bản thân bám rễ vào nơi này, đồng thời dạy cho họ biết về những mối nguy hiểm từ các ảnh hưởng bên ngoài. Những người ủng hộ và các nhóm chính trị của người [from.target.GetSpeciesAdj] vô cùng tán thành các khóa học của các đặc vụ." # post-industrial societies only

