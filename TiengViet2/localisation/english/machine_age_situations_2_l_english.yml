 synth.1510.name: "Xã Hội Chuyển Giao Tâm Trí"
 synth.1510.desc.physical: "Tầng lớp tinh hoa của chúng ta đã hoàn thiện khả năng can thiệp trực tiếp vào các cơ thể máy móc để đảm bảo hiệu quả cai trị tối đa."
 synth.1510.desc.virtual: "Hội đồng cai trị của chúng ta giờ đây vận hành trong một ý thức cộng đồng ảo, ra quyết định với tốc độ ánh sáng."
 synth.1510.desc.neutral: "Đã đến lúc xác lập thể chế đầu sỏ của chúng ta trong kỷ nguyên mới."
 synth.1510.a: "Thiết lập Đầu Sỏ Thể Xác Đè Nén."
 synth.1510.a.tt: "$change_auth_tt$ ['concept_auth_synth_oligarchic_physical'] $synth_physical_traits$"
 synth.1510.b: "Thiết lập Đầu Sỏ Đồng Thuận Kỹ Thuật Số."
 synth.1510.b.tt: "$change_auth_tt$ ['concept_auth_synth_oligarchic_virtual'] $synth_virtual_trait$"
 synth.1510.c: "$synth_keep_auth_option$"
 synth.1510.c.tt: "$keep_auth_tt$ ['concept_auth_oligarchic']"
 synth.1515.name: "Xã Hội Chuyển Giao Tâm Trí"
 synth.1515.desc.physical: "Người dân của chúng ta không lùi bước trước lao động thể chất trung thực. Các công nhân của chúng ta đã được kết nối mạng và giờ đây có thể điều khiển từ xa nhiều cơ thể — gia tăng đáng kể định mức sản xuất trong quá trình này.\n\nBước phát triển này là một dấu hiệu rõ ràng cho thấy chúng ta đã đúng khi tin tưởng vào sự dẫn dắt của nhà lãnh đạo tối cao của chúng ta, §Y[From.GetRulerTitle] [From.GetRulerName]§!."
 synth.1515.desc.virtual: "Các thuật toán giám sát toàn diện đã đảm bảo sự vâng phục tuyệt đối trong toàn bộ không gian mạng của chúng ta."
 synth.1515.desc.neutral: "Dân số §Y[root.GetSpeciesAdj]§! vẫn chưa ngã ngũ về hình thái mà ý thức số hóa của chúng ta nên đón nhận. Những tiếng nói bảo thủ hơn muốn chúng ta bám rễ sâu vào các cơ thể hữu hình, trong khi những người khác lại phẫn nộ trước \"giải pháp nửa vời\" này giữa cũ và mới.\n\nTrách nhiệm đưa ra lựa chọn đó thuộc về chúng ta. Định hướng thể xác sẽ cho phép một công nhân đơn lẻ điều khiển nhiều cơ thể, trong khi sự tồn tại ảo sẽ cho phép kiểm soát xã hội ở quy mô chưa từng có."
 synth.1515.a: "Ban bố Độc Tài Thân Xác Tối Thượng."
 synth.1515.a.tt: "$change_auth_tt$ ['concept_auth_synth_dictatorial_physical'] $synth_physical_traits$"
 synth.1515.b: "Ban bố Độc Tài Giám Sát Thuật Toán."
 synth.1515.b.tt: "$change_auth_tt$ ['concept_auth_synth_dictatorial_virtual'] $synth_virtual_trait$"
 synth.1515.c: "$synth_keep_auth_option$"
 synth.1515.c.tt: "$keep_auth_tt$ ['concept_auth_dictatorial']"
 synth.1520.name: "Xã Hội Chuyển Giao Tâm Trí"
 synth.1520.desc.physical: "Ký ức của các hoàng đế cổ xưa đã hòa làm một với trí tuệ đương đại trong Lăng Tẩm Dữ Liệu Hoàng Gia."
 synth.1520.desc.virtual: "Người dân §Y[From.GetSpeciesAdj]§! sẵn sàng tiến xa hơn nữa, và ưa chuộng một sự tồn tại hoàn toàn ảo thay vì những biện pháp nửa vời của thế giới vật chất. Sự kiện trọng đại này sẽ tạo ra những làn sóng chấn động vang vọng sâu vào tương lai của chúng ta. Bằng cách tăng tốc độ và phạm vi chuyển giao bản sắc, chúng ta có thể triển khai việc thay thế nhanh chóng cho các cơ thể tổng hợp bị phá hủy trong các nhiệm vụ nguy hiểm.\n\nNhững bước phát triển mới này chắc chắn sẽ làm tăng hiệu quả của chúng ta trong các tình huống chiến tranh khác nhau, và mang lại vinh quang cho đế chế §Y[From.GetSpeciesAdj]§!!"
 synth.1520.desc.neutral: "Đế chế §Y[From.GetSpeciesAdj]§! đang đứng trước ngã ba đường. Một số người tin rằng các cơ thể vật lý được thiết kế riêng sẽ mang lại cho chúng ta sự an toàn và thân thuộc, trong khi những người khác lại phản đối việc không tận dụng tối đa quá trình chuyển giao tâm trí và tất cả những gì nó có thể mang lại.\n\nTập trung vào các khía cạnh thể xác sẽ cho phép chúng ta tái sử dụng kiến thức của các chức sắc mới bị phá hủy cho nỗ lực nghiên cứu của mình. Ngoài ra, con đường dẫn đến sự tồn tại ảo sẽ cho phép thay thế hàng loạt các cơ thể tổng hợp bị phá hủy thông qua việc chuyển giao bản sắc nhanh chóng."
 synth.1520.a: "Tận dụng ý thức của các bậc tiền nhân."
 synth.1520.a.tt: "$change_auth_tt$ ['concept_auth_synth_imperial_physical'] $synth_physical_traits$"
 synth.1520.b: "Kiến tạo các cơ thể vật lý dùng một lần."
 synth.1520.b.tt: "$change_auth_tt$ ['concept_auth_synth_imperial_virtual'] $synth_virtual_trait$"
 synth.1520.c: "$synth_keep_auth_option$"
 synth.1520.c.tt: "$keep_auth_tt$ ['concept_auth_imperial']"
 synth.1525.name: "Xã Hội Chuyển Giao Tâm Trí"
 synth.1525.desc.physical: "Phòng tiếp thị và nghiên cứu của chúng ta đã đưa ra một sáng kiến mới trong ứng dụng trí tuệ nhân tạo cho toàn bộ khách hàng. Cách tiếp cận cân bằng đối với sự tồn tại tổng hợp mới cho phép chúng ta phát triển các sản phẩm tận dụng lợi thế của thế giới ảo để phục vụ thế giới vật chất.\n\nChúng ta hiện có thể truyền các AI bị hạn chế vào các đồ vật vô tri và mang lại sự sống cho chúng một cách hiệu quả. Phân khúc sản phẩm mới này sau đó có thể được nhắm mục tiêu xa hơn tới người tiêu dùng, khu vực tư nhân và các bên quan tâm khác trên khắp thiên hà."
 synth.1525.desc.virtual: "Cam kết của chúng ta đối với không gian ảo đã mở ra một dòng sản phẩm hoàn toàn mới dựa trên ký ức. Các kỹ thuật viên chi nhánh của chúng ta có thể trích xuất chúng từ các đối tượng tự nguyện bất kể kiểu hình của họ.\n\nNhững dấu ấn này sau đó được bộ phận tình báo của chúng ta kiểm tra cẩn thận, cho phép chúng ta có được lợi thế cạnh tranh trước các đế chế khác trên mặt trận đó. Cuối cùng, những ký ức được kết hợp vào các quy trình tạo tâm trí tổng hợp của chúng ta để tăng đáng kể hiệu năng."
 synth.1525.desc.neutral: "Bất chấp các phân tích chi phí/lợi ích tỉ mỉ, việc chuyên môn hóa theo hướng vật lý hay ảo trong quá trình chuyển giao tâm trí đều chưa chiếm ưu thế tuyệt đối. Tuy nhiên, chúng ta không thể đứng yên bên lề những cơ hội như vậy và phải đưa ra một lộ trình rõ ràng cho các cổ đông.\n\nTập trung vào thế giới vật chất mang lại cho chúng ta khả năng truyền AI bị hạn chế vào các đồ vật vô tri để bán như một phiên bản đơn giản hóa của sự sống mới. Các khoản đầu tư vào thế giới ảo sẽ cho phép chúng ta thương mại hóa ký ức và các mẫu tư duy."
 synth.1525.a: "Phân phối các thực thể AI bị hạn chế."
 synth.1525.a.tt: "$change_auth_tt$ ['concept_auth_synth_corporate_physical'] $synth_physical_traits$"
 synth.1525.b: "Thương mại hóa ký ức của người dân."
 synth.1525.b.tt: "$change_auth_tt$ ['concept_auth_synth_corporate_virtual'] $synth_virtual_trait$"
 synth.1525.c: "$synth_keep_auth_option$"
 synth.1525.c.tt: "$keep_auth_tt$ ['concept_auth_corporate']"