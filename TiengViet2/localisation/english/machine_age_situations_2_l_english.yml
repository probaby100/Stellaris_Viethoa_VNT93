 computation_core_stability_name: "Phân Tích Ổn Định"
 computation_core_stability: "$computation_core_stability_name$"
 computation_core_stability_desc: "Phân bổ tài nguyên để giám sát luồng thông tin xã hội nhằm phát hiện những điều bất thường.$computation_core_stability_tt$"
