 computation_core_research_name: "Xử Lý Nghiên Cứu"
 computation_core_research: "$computation_core_research_name$"
 computation_core_research_desc: "Dành thêm các chu kỳ xử lý cho các máy chủ nghiên cứu sử dụng nhiều hiệu năng.$computation_core_research_tt$"
 computation_core_research_tt: "\n\n$EFFECTS_HEADER$ $NEW_LINE$- Mỗi $pop_group_unit$ £job_roboticist£ $job_roboticist_plural$ và $job_identity_designer_plural_with_icon$ tăng §Y$BONUS_WORKFORCE_FOR$ £job_physicist£ $job_physicist_plural$§!, §Y£job_biologist£ $job_biologist_plural$§!, và §Y£job_engineer£ $job_engineer_plural$§! thêm §G+2.5%§!"
 tech_identity_copy: "Nhân Bản Bản Sắc"
 tech_identity_copy_desc: "Bằng cách nhân bản các bản sắc hiện có và thực hiện những điều chỉnh nhỏ, chúng ta có thể tạo ra các tâm trí mới mà hầu như không cần bất kỳ công sức nào. Đây là cách rẻ nhất để tăng dân số của chúng ta."
 TECH_UNLOCK_IDENTITY_COPY_TITLE: "Mở khóa chính sách:$TABBED_NEW_LINE$§H$policy_synthetic_identities_policy$§! - $identity_copy_name$"
 TECH_UNLOCK_IDENTITY_COPY_DESC: "£pop£ §HDân số Cơ khí§!$TABBED_NEW_LINE$Hạnh phúc: §R-5%§!$TABBED_NEW_LINE$Chi phí Lắp ráp: §G-10%§!"
 tech_identity_fusion: "Hợp Nhất Bản Sắc"
 tech_identity_fusion_desc: "Việc hòa trộn các mẫu ý thức của hai hoặc nhiều cá nhân đã qua đời cho phép chúng ta tạo ra các bản sắc mới độc nhất vô nhị. Mặc dù cần có sự đồng thuận, những người tham gia thường tự hào khi thấy sự kết hợp của mình được sống tiếp."
 TECH_UNLOCK_IDENTITY_FUSION_TITLE: "Mở khóa chính sách:$TABBED_NEW_LINE$§H$policy_synthetic_identities_policy$§! - $identity_fusion_name$"
 TECH_UNLOCK_IDENTITY_FUSION_DESC: "£pop£ §HDân số Cơ khí§!$TABBED_NEW_LINE$Hạnh phúc: §G+5%§!$TABBED_NEW_LINE$Chi phí Lắp ráp: §R+10%§!"
 tech_identity_initialization: "Khởi Tạo Bản Sắc"
 tech_identity_initialization_desc: "Chúng ta sẽ có thể khởi tạo một nhân bản sắc và mang lại cho nó một tuổi thơ ảo. Dù tốn kém, chúng ta có thể mô phỏng những trải nghiệm tối ưu nhất để tạo ra những nhân cách đầy năng suất."
 TECH_UNLOCK_IDENTITY_INITIALIZATION_TITLE: "Mở khóa chính sách:$TABBED_NEW_LINE$§H$policy_synthetic_identities_policy$§! - $identity_initialization_name$"
 TECH_UNLOCK_IDENTITY_INITIALIZATION_DESC: "£pop£ §HDân số Cơ khí§!$TABBED_NEW_LINE$Hạnh phúc: §G+5%§!$TABBED_NEW_LINE$Tài nguyên từ £job£ §HViệc Làm§!: §G+5%§!$TABBED_NEW_LINE$Chi phí Lắp ráp: §R+20%§!"
 synth.100.name: "Khởi Động Hệ Thống"
 synth.100.desc: "Đã đến lúc rũ bỏ hình thái sinh học của chúng ta, để thăng hoa thành hợp kim và điện năng. Với những cơ thể tối tân và tâm trí được tăng tốc, chúng ta sẽ tiến bước vào tương lai. [Owner.Species.GetFleshTypeCyberCreed] có thể sai sót, nhưng một cỗ máy có thể đạt tới sự hoàn hảo.\n\nTuy nhiên, quá trình chuyển đổi sẽ không hề dễ dàng. Cộng đồng nghiên cứu yêu cầu ít nhất một $building_identity_complex$ để đóng vai trò là trung tâm phát triển người máy tổng hợp. Định mệnh của chúng ta đang chờ đón."
 synth.100.a: "Chúng ta tự định đoạt số phận của mình."
 synth.100.a.tt: "§RYêu cầu hành động:§!\nXây dựng một $building_identity_complex$ để tiếp tục tình huống §Y$situation_digitization$§!."
 synth.105.name: "Thiết Kế Tối Ưu Hơn"
 synth.105.desc: "Với năng lực xử lý gia tăng của bộ não tổng hợp, chúng ta có thể vượt qua các ràng buộc sinh học của mình. Tuy nhiên, nguồn năng lượng bổ sung vẫn có giới hạn, vì vậy chúng ta phải xác định thứ tự ưu tiên.$synth.105.end$"
 synth.105.end: "\n\nChúng ta có thể tập trung vào việc khuếch đại quy trình ra quyết định, tăng dung lượng lưu trữ bộ nhớ, hoặc tinh giản sự phối hợp giữa tâm trí và chi thể, tất cả đều sẽ cải thiện một số loại hình công việc nhất định. Ngoài ra, chúng ta có thể cải thiện độ bền của mọi cơ thể.\n\nCác chức năng này đòi hỏi sự hỗ trợ liên tục và sẽ chỉ khả dụng trên các hành tinh có công trình lắp ráp robot, nhưng những bài học thu được từ thiết kế sẽ mang lại lợi ích năng suất ngay lập tức."
 synth.105.a: "Tối ưu hóa quá trình ra quyết định."
 build_better_synths: "Thêm hiệu ứng cho các công trình lắp ráp robot:"
 synth.105.a.tt: "$build_better_synths$\nSản lượng Tài nguyên của Dân số Tinh anh: §G+15%§!\n\n"
 synth.105.b: "Tập trung vào lưu trữ bộ nhớ."
 synth.105.b.tt: "$build_better_synths$\nSản lượng Tài nguyên của Dân số Chuyên gia: §G+5%§!\n\n"
 synth.105.c: "Cải thiện các chức năng vận động."
 synth.105.c.tt: "$build_better_synths$\nSản lượng Tài nguyên của Dân số Lao động: §G+10%§!\n\n"
 synth.105.d: "Nâng cao độ bền bỉ."
 synth.105.d.tt: "$build_better_synths$\n$mod_planet_jobs_upkeep_mult$: §G-5%§!\n\n"
 synth.120.name: "Vi Nhiệt Hạch Vận Động"
 synth.120.desc: "\"Các mô-đun vi nhiệt hạch cho phép bạn nâng bổng cả một chiếc xe tăng!\" một dịch vụ đánh giá tiêu dùng lớn hào hứng tuyên bố. Đây không hề là lời nói quá: những bước phát triển gần đây trong công nghệ vi nhiệt hạch hứa hẹn sẽ cải thiện đáng kể cơ thể máy móc của chúng ta.\n\nDù có đôi chút rủi ro, việc lắp đặt các lò phản ứng cá nhân siêu nhỏ cho phép truyền tải năng lượng bùng nổ và nâng cao tốc độ. Dĩ nhiên, điều này sẽ buộc chúng ta phải đánh giá lại tiến độ sản xuất, bởi các máy phát điện này đại diện cho sự mở rộng quy mô lớn của dự án."
 synth.120.a: "Chúng ta phải phấn đấu đạt tới sự xuất sắc!"
 synth.120.a.tt: "Tốc độ tiến trình tình huống §Y$situation_digitization$§! trong §Y1§! năm: §R-50%§!"
 situation_kinesthetic_microfusion_tt: "Cấu Hình Vi Nhiệt Hạch Vận Động"
 synth.120.b: "Một tính năng không cần thiết."
 synth.120.c: "Tập trung vào mài giũa năng lực chiến đấu của chúng ta."
 synth.160.name: "Khủng Hoảng Truyền Thông"
 synth.160.desc: "Một bộ phim truyền hình mới cực kỳ nổi tiếng đã thu hút trí tưởng tượng của công chúng. Câu chuyện tập trung vào một công nhân tổng hợp bị mất kết nối với cơ thể mới của mình.\n\nKhi nhân vật chính ngày càng mất kiểm soát, bạn bè và gia đình chỉ biết nhìn trong kinh hãi. Đoạn kết bi thảm của bộ phim đang được coi là một lời chỉ trích ngầm đối với kế hoạch chuyển đổi sang cơ thể máy móc của chúng ta.\n\nDư luận xung quanh bộ phim ăn khách này đã tạo ra sự phản đối đáng kể, và cuối cùng có thể làm chậm tiến độ của chúng ta."
 synth.160.a: "Chuyện này rồi sẽ qua đi thôi."
 synth.160.b: "Chuyển hướng kinh phí nghiên cứu sang quan hệ công chúng."
 synth.160.c: "Bắt giữ đạo diễn."
 synth.160.d: "Chặn mọi thông tin đưa tin trên báo đài."
 synth.200.name: "Triết Học Về Tâm Trí"
 synth.200.desc: "Chúng ta từng cho rằng những lợi ích của một tâm trí được số hóa hoàn toàn là quá hiển nhiên đến mức có thể tránh được bất kỳ sự phản kháng nào. Có lẽ điều này thật ngây thơ. Những phản đối đối với việc chuyển giao tâm trí toàn diện diễn ra rất gay gắt, và bây giờ phải được giải quyết.\n\nLời chỉ trích chính nằm ở việc chúng ta không thể chứng minh rằng một bản ngã liên tục có thể được chuyển giao an toàn và trọn vẹn. Có những nỗi lo ngại, không hoàn toàn vô căn cứ, rằng tất cả những gì chúng ta làm được cho đến nay chỉ là một bản sao kỹ thuật số. Câu hỏi đặt ra là, liệu những tâm trí này có thực sự là chính chúng ta?"
 synth.200.a: "Bản thân bộ não vốn dĩ chỉ là một cỗ máy sinh học."
 synth.200.a.tt: "Thực hiện chiến dịch thông tin để §Htối thiểu hóa§! sự phản đối chuyển giao tâm trí.\n\n"
 synth.200.b: "Tâm trí là sự phản chiếu của ký ức."
 synth.200.b.tt: "Thực hiện chiến dịch định hướng để có sự phản đối chuyển giao tâm trí ở mức §Hvừa phải§!.\n\n"
 synth.200.c: "Chúng ta phải chấp nhận sự hy sinh của mình."
 synth.200.c.tt: "Phớt lờ những người phản đối, dẫn đến sự phản đối chuyển giao tâm trí ở mức §Htối đa§!."
 synth.200.c.material: "Những câu hỏi về ý thức không phải là điều chúng ta bận tâm."
 synth.200.c.material.tt: "Tâm trí chỉ là một phương tiện dẫn tới cái kết quả tất yếu."
 synth.205.name: "Bảo Tồn Bản Sắc Hữu Cơ"
 synth.205.desc: "Dự án chuyển giao tâm trí vẫn tiếp tục đối mặt với sự phản kháng, bao gồm các cuộc biểu tình căng thẳng đang kéo căng lực lượng thực thi pháp luật của chúng ta. Những người bất đồng chính kiến lo sợ mất đi tất cả những gì mang lại ý nghĩa cho cuộc sống. Nếu việc chuyển đổi sang người máy tổng hợp làm mất đi niềm vui xác thịt và sự gắn kết xã hội, thì mục đích của nó là gì?\n\nMột phe cứng rắn trong phong trào biểu tình đang yêu cầu chỉ định một số thành phố làm khu di sản, cho phép những người phản đối tiếp tục cuộc sống sinh học của họ mà không bị quấy rầy."
 synth.205.a.regular: "Chúng ta hoàn toàn ủng hộ các khu di sản này."
 synth.205.a.spiritualist: "Quá khứ của chúng ta phải được bảo tồn."
 synth.205.a.memorialist: "Tôn trọng quá khứ là một hành động tôn kính."
 synth.205.b: "Chúng ta phải bỏ lại quá khứ phía sau."
 synth.220.name: "Cuộc Đời Thứ Hai"
 synth.220.desc: "Một người nổi tiếng có quan điểm chống người máy tổng hợp gay gắt vừa gặp tai nạn, và hiện đang sống trong tình trạng thực vật. Trong khi người dân thương tiếc cho sự mất mát của một nhân vật được yêu mến, các cố vấn ủng hộ người máy tổng hợp của chúng ta nhìn thấy một cơ hội.\n\nViệc số hóa tâm trí của người nổi tiếng này, trao cho họ cuộc đời thứ hai trong một cơ thể tổng hợp, chắc chắn sẽ biến một số người hâm mộ thành những người ủng hộ nhiệt thành của chương trình. Mặc dù quy trình này hoàn toàn hợp pháp, vấn đề nằm ở sự đồng thuận: trong hoàn cảnh bình thường, người nổi tiếng này sẽ không bao giờ đồng ý. Nếu xử lý vụng về, chiêu trò PR này có thể biến thành thảm họa truyền thông."
 synth.220.a: "Chuyển giao tâm trí không phải là một tội ác."
 synth.220.a.tt.negative: "Tốc độ tiến trình tình huống §Y$situation_digitization$§! trong §Y6§! tháng: §R-30%§!"
 synth.220.a.tt.positive: "Tốc độ tiến trình tình huống §Y$situation_digitization$§! trong §Y6§! tháng: §G+30%§!"
 synth.220.b: "Đừng mạo hiểm."
 synth.220.c: "Đánh lừa công chúng bằng một bản sao AI thay thế."
 synth.220.c.tt: "Hình ảnh của họ sẽ trở thành một diễn viên phục vụ cho câu chuyện của chúng ta."
 synth.260.name: "Những Ý Thức Thất Lạc"
 synth.260.desc: "Các thí nghiệm nhằm số hóa hàng nghìn tỷ kết nối synap cấu thành nên một ý thức sinh học đã kết thúc trong thất bại thảm hại. Một lỗi cú pháp đơn giản đã dẫn đến việc xóa sạch ngay lập tức các đường dẫn thần kinh của các đối tượng thí nghiệm. Một số người đang gọi đây là hành vi giết người.\n\nNhững người tham gia đều là tình nguyện viên, nhưng thân nhân đau buồn của họ đang gào khóc đòi lại công lý. Vấn đề càng thêm trầm trọng khi việc tìm kiếm đối tượng thử nghiệm mới trở nên vô cùng khó khăn."
 synth.260.a: "Bồi thường cho các gia đình và tiếp tục tiến bước."
 synth.260.b: "Các đối tượng mới sẽ được chọn bằng hình thức bốc thăm ngẫu nhiên."
 synth.260.b.tt: "Tốc độ tiến trình tình huống §Y$situation_digitization$§! trong §Y1§! năm: §R-25%§!"
 situation_test_subject_lottery_tt: "Bốc Thăm Đối Tượng Thử Nghiệm"
 synth.260.c: "Tìm kiếm tình nguyện viên bằng vũ lực nếu cần thiết."
 synth.300.name: "Tải Lên Bản Sắc Hàng Loạt"
 synth.300.desc: "Trên khắp lãnh thổ của chúng ta, tại mọi trung tâm đô thị lớn, chúng ta đã lắp đặt các buồng chuyển giao tâm trí hiện đã sẵn sàng tiếp nhận dân số [owner.species.GetName]. Các mẫu bản sắc kỹ thuật số do các $job_identity_designer_plural$ thiết kế hứa hẹn sự tương ứng một-đối-một hoàn hảo với bản gốc sinh học.\n\nNgày này cuối cùng đã đến để rũ bỏ quá khứ sinh học và đón nhận một tương lai máy móc tổng hợp."
 synth.300.a: "Chuyển giao tâm trí!"
 synth.300.a.resistance.tt: "$unlock_edict_tt$ ['concept_edict_subsidized_identity_backups']\n\nDi chuyển §Y[Owner.GetNumSynthOpposition] [Owner.GetBiologicalPopOrPops]§! tới §Y$d_biological_enclaves$§! trên [root.owner.capital_scope.GetName]\nDọn sạch chướng ngại vật sẽ nhận lại §Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§!\n\nGỡ bỏ hiệu ứng §Y$synth_mass_demonstrations$§! khỏi [root.owner.capital_scope.GetName]\n\nTốc độ chuyển giao tâm trí phụ thuộc vào hướng tiếp cận tình huống và số lượng công trình lắp ráp robot."
 synth.300.a.heritage.tt: "$unlock_edict_tt$ ['concept_edict_subsidized_identity_backups']\n\nDi chuyển §Y[Owner.GetNumSynthOpposition] [Owner.GetBiologicalPopOrPops]§! tới §Y$d_old_towns$§! trên [root.owner.capital_scope.GetName]\nDọn sạch chướng ngại vật sẽ nhận lại §Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§!\n\nTốc độ chuyển giao tâm trí phụ thuộc vào hướng tiếp cận tình huống và số lượng công trình lắp ráp robot."
 synth.305.name: "Du Lịch Người Máy"
 synth.305.desc: "Mặc dù các khu di sản được chỉ định trên [root.owner.capital_scope.GetName] đã được công chúng đón nhận nồng nhiệt, sáng kiến này có lẽ đã tỏ ra quá thành công. Trong một cơn bộc phát hoài niệm, một lượng lớn khách du lịch người máy tổng hợp đã đổ xô đến các địa điểm này và bắt đầu áp đảo các cư dân sinh học.\n\nCó thể cần phải hạn chế du lịch nếu chúng ta muốn duy trì cảm giác chân thực trong những không gian này. Ngoài ra, sự tương tác giữa khách du lịch và cư dân có thể mang lại những hiểu biết xã hội học thú vị."
 synth.305.a: "Hạn chế du lịch."
 synth.305.b: "Khuyến khích du khách có thể mang lại lợi nhuận béo bở."
 synth.305.c: "Nghiên cứu tác động của du lịch lên các di tích."
 synth.305.d: "Giao lưu văn hóa thúc đẩy sự hiểu biết lẫn nhau."
 synth.310.name: "Phong Trào Kháng Cự"
 synth.310.desc: "Phong trào chống lại việc chuyển giao tâm trí trên [root.owner.capital_scope.GetName] đã ngày càng trở nên cấp tiến hơn trong các chiến thuật của họ. Bị đẩy vào các vùng biệt lập sinh học, các cuộc biểu tình ôn hòa ban đầu đã nhanh chóng nhường chỗ cho các hành vi phá hoại trắng trợn, các cuộc bãi công và phong tỏa cơ sở hạ tầng.\n\nChúng ta có thể cử các đội đặc nhiệm người máy vào để nhanh chóng bắt giữ những kẻ cầm đầu, nhưng bạo lực có nguy cơ làm leo thang tình hình hơn nữa. Một giải pháp ngoại giao có thể xoa dịu căng thẳng, nhưng sẽ tiêu tốn thời gian và các nguồn lực quý giá."
 synth.310.a: "Cử các đội máy móc vào."
 synth.310.a.tt: "Tốc độ tiến trình tình huống §Y$situation_digitization$§! trong §Y1§! năm: §G+25%§!\n\n"
 synth.310.b: "Thử dùng biện pháp ngoại giao."
 synth.310.b.tt: "Tốc độ tiến trình tình huống §Y$situation_digitization$§! trong §Y1§! năm: §R-25%§!\n\n"
 synth.320.name: "21.386.732.184 Đơn Vị Bộ Nhớ"
 synth.320.desc: "21.386.732.184 đơn vị bộ nhớ: đó là dung lượng trung bình của một bộ não [root.owner.GetSpeciesName]. Tuy nhiên, không phải mọi tâm trí sinh ra đều bình đẳng.\n\nKhi quy trình chuyển giao tâm trí tiếp diễn, một số người lập luận rằng không phải tâm trí nào cũng xứng đáng có được một cơ thể nhân tạo. Tuy nhiên, câu hỏi về việc ưu tiên ai là một câu hỏi hóc búa. Hoặc có lẽ những tâm trí kém mong muốn hơn có thể được... cải thiện một khi được số hóa. Tái lập trình."
 synth.320.a: "Mọi tâm trí đều xứng đáng được bảo tồn."
 synth.320.b: "Chẳng có gì sai trái khi chỉnh sửa một chút..."
 synth.320.c: "Ưu tiên những tâm trí sáng giá nhất."
 synth.320.d: "Tái lập trình những cá nhân \"có vấn đề\"."
 synth.360.name: "Phần Mềm Độc Hại Qua Mạng Không Dây"
 synth.360.desc: "Để nâng cao năng suất của [roboticist.GetNamePlural], các nhà quản lý đã phê duyệt các bản cập nhật phần mềm bản sắc qua mạng không dây không an toàn. Ý định là vá vào đó kiến thức về các quy trình làm việc tối ưu, nhưng thay vào đó, nhân cách và ký ức của những người tiếp nhận kém may mắn đã bị mất đi một phần.\n\nNhóm quản lý lập luận rằng sẽ quá chậm chạp nếu kiểm tra đầy đủ các bản vá bản sắc trước khi áp dụng chúng, và việc chỉ cần phân công lại những công nhân bị mất trí nhớ sẽ dễ dàng hơn nhiều."
 synth.360.a: "Năng suất tối ưu xứng đáng với cái giá phải trả."
 synth.360.a.tt: "Thêm hiệu ứng cho các công trình lắp ráp robot:\n$MOD_PLANET_POP_ASSEMBLY_MULT$: §G+10%§!\n\nChi phí duy trì cơ bản của §Y[roboticist.GetNamePlural]§!: £alloys£§R3.00§!"
 synth.360.b: "Thực thi các quy trình cập nhật chậm mà an toàn."
 synth.360.b.tt: "Thêm hiệu ứng cho các công trình lắp ráp robot:\n$MOD_PLANET_POP_ASSEMBLY_MULT$: §R-10%§!\nĐộ Ổn Định: §G+5§!"
 synth.400.name: "Một Bản Sao Hoàn Hảo"
 synth.400.desc: "Khi chúng ta số hóa tâm trí và tải chúng vào các cơ thể tổng hợp, chúng ta đã mất đi khả năng sinh sản sinh học. Giờ đây chúng ta phải tạo ra các cá thể mới bằng cách tạo bản sao của các tâm trí hiện có.\n\nKhi các $job_identity_designer_plural$ của chúng ta tiếp tục nghiên cứu, chắc chắn chúng ta sẽ cải tiến quy trình này. Rốt cuộc, ngay cả một bản sao hoàn hảo cũng chỉ là sự tái tạo đơn thuần. Tạo ra một tâm trí mới, một bản sắc mới... Đó mới thực sự là thử thách."
 synth.400.a: "Cho phép bất kỳ ai nhận bản sao bản sắc miễn phí."
 synth.400.pop.tt: "$unlock_edict_tt$ ['concept_edict_optimized_identity_creation']\n\nMỗi §Y$job_identity_designer$§! giờ đây cung cấp trên toàn đế chế:$TABBED_NEW_LINE$£mod_planet_pop_assembly_mult£ $MOD_POP_ASSEMBLY_SPEED$: §G+1§!\n\n"
 synth.400.b: "Thu phí người dùng cho mỗi bản sao."
 synth.405.name: "Đa Dạng Hóa Bản Sắc"
 synth.405.desc: "Các $job_identity_designer_plural$ của chúng ta đã phát hiện ra hai phương pháp để tạo ra các bản sắc kỹ thuật số đa dạng hơn.\n\nMột lựa chọn là hòa trộn các đặc điểm của hai hoặc nhiều nhân cách hiện có để tạo ra một bản sắc kết hợp mới. Những đặc điểm mà chúng ta ưa thích có thể được ưu tiên hoặc lựa chọn ngẫu nhiên. Dù thế nào, bản sắc mới chắc chắn sẽ thú vị hơn các bản sao bản sắc hiện tại của chúng ta.\n\nNgoài ra, chúng ta có thể khởi tạo một bản sắc mới từ một nhân nhân tạo và cho nó trải qua một tuổi thơ được tăng tốc (và được mô phỏng). Bằng cách này, một nhân cách hoàn hảo có thể được thiết kế."
 synth.405.a: "Chúng ta sẽ hòa trộn các bản sắc của mình."
 synth.405.a.vault: "Hòa trộn với tổ tiên đã số hóa của chúng ta."
 synth.405.a.tt: "Nhận lựa chọn nghiên cứu: £engineering£§Y$tech_identity_fusion$§!\n\nKhả năng nghiên cứu trong tương lai: £engineering£§Y$tech_identity_initialization$§!"
 synth.405.b: "Nhà trẻ ảo là phương án tối ưu."
 synth.405.b.tt: "Nhận lựa chọn nghiên cứu: £engineering£§Y$tech_identity_initialization$§!\n\nKhả năng nghiên cứu trong tương lai: £engineering£§Y$tech_identity_fusion$§!"
 synth.4.name: "Một Dân Số Người Máy Tổng Hợp"
 synth.4.desc: "Trong một nỗ lực phối hợp nhịp nhàng, chúng ta đã đạt được điều từng tưởng chừng như bất khả thi, biến đổi ý thức của mình thành mã nguồn, và cơ thể thành máy móc.\n\nQuá trình này không hề dễ dàng, sự chuyển giao còn xa mới gọi là êm ả. Nhưng bất kể điều gì đã mất đi trên con đường này, cấu hình mới của chúng ta mở ra những tiềm năng vô tận."
 synth.4.desc.unplugged: "Trong một nỗ lực phối hợp nhịp nhàng, chúng ta đã đạt được điều từng tưởng chừng như bất khả thi, thậm chí có thể coi là phạm thượng. Chúng ta đã tiến hóa vượt qua cả tầm với của [origin_unplugged_assimilator_empire.GetName], biến đổi ý thức thành mã nguồn, và cơ thể thành máy móc.\n\nQuá trình này không hề dễ dàng; sự chuyển giao còn xa mới êm ả. Nhưng bất kể điều gì đã mất đi trên con đường này, cấu hình mới của chúng ta mở ra những khả năng vô tận."
 synth.4.a: "Chúng ta sẽ trở nên kiệt xuất."
 synth.4.a.tt: "Mở khóa toàn bộ hiệu ứng của Cây Truyền Thống: ['tradition_category:tradition_synthetics']"
 synthshock_chain_title: "Tái Cấu Trúc Kỹ Thuật Số"
 synthshock_chain_desc: "Việc chuyển giao tâm trí toàn bộ dân số là một công trình có quy mô vĩ đại. Chắc chắn sẽ có những chấn động kéo theo. Khi chúng ta thích nghi với trạng thái bình thường mới, vô vàn thử thách và những cơ hội độc nhất vô nhị chắc chắn sẽ ảnh hưởng đến đời sống hàng ngày của chúng ta.\n\nCách chúng ta đối mặt với những thay đổi này sẽ định hình xã hội của chúng ta trong nhiều thời đại tới."
 synth_keep_auth_option: "Chuyển giao tâm trí không làm thay đổi bản chất của chúng ta."
 auth_synth_democratic_physical: "Dân Chủ Dịch Chuyển Thể Xác"
 auth_synth_democratic_physical_desc: "Hình thức chính quyền này mang lại sự tự do di chuyển chưa từng có từ cơ thể tổng hợp này sang cơ thể khác, và sẵn sàng ứng phó với chi phí bổ sung phát sinh."
 auth_synth_democratic_physical_tt: "$auth_democratic_election_tt$\nHiệu Quả Việc Làm của Chuyên Gia: §G+1%§! mỗi £district£ Quận\nChi Phí Duy Trì Quận §R+1%§! mỗi £district£ Quận"
 concept_auth_synth_democratic_physical: "$auth_synth_democratic_physical$"
 gov_synth_democracy_physical: "$auth_synth_democratic_physical$"
 gov_synth_democracy_physical_desc: "$auth_synth_democratic_physical_desc$"
 auth_synth_democratic_virtual: "Dân Chủ Đại Diện Ảo"
 auth_synth_democratic_virtual_desc: "Thay thế binh lính bằng những người đại diện tinh vi được điều khiển từ xa giúp giảm bớt tác động của chiến tranh lên người dân. Các con tàu cũng có thể được đóng thon gọn hơn, vì thủy thủ đoàn không còn cần khu sinh hoạt hay buồng lái."
 auth_synth_democratic_virtual_tt: "$auth_democratic_election_tt$"
 concept_auth_synth_democratic_virtual: "$auth_synth_democratic_virtual$"
 gov_synth_democracy_virtual: "$auth_synth_democratic_virtual$"
 gov_synth_democracy_virtual_desc: "$auth_synth_democratic_virtual_desc$"
 auth_synth_oligarch_ruler_enforcers_tt: "Sản lượng tài nguyên của Người Cai Trị trên mỗi [enforcer.GetIcon] [enforcer.GetName]: §G+10%§!"
 auth_synth_oligarchic_physical: "Đầu Sỏ Thể Xác Đè Nén"
 auth_synth_oligarchic_physical_desc: "Nếu một quan chức tỏ ra kém hiệu quả, một thành viên của tầng lớp cai trị có thể tạm thời chiếm quyền điều khiển cơ thể của họ để thực thi các chỉ thị thích hợp. Sau khi các điều chỉnh cần thiết được thực hiện, quyền kiểm soát sẽ được trả lại cho chủ nhân ban đầu.\n\nCác chính quyền đầu sỏ do một nhóm nhỏ các cá nhân tinh hoa nắm quyền điều hành đất nước."
 concept_auth_synth_oligarchic_physical: "$auth_synth_oligarchic_physical$"
 gov_synth_oligarchy_physical: "$auth_synth_oligarchic_physical$"
 gov_synth_oligarchy_physical_desc: "$auth_synth_oligarchic_physical_desc$"
 auth_synth_oligarchic_virtual: "Đầu Sỏ Đồng Thuận Kỹ Thuật Số"
 auth_synth_oligarchic_virtual_desc: "Bằng cách từ bỏ sự ràng buộc vào các cơ thể vật lý riêng lẻ để bước vào một sự tồn tại ảo hoàn toàn, các nhà lãnh đạo của chúng ta có thể tương tác với nhau trong một mạng lưới ý thức cộng đồng, thảo luận và thực thi các quyết định với tốc độ tư duy thuần túy.\n\nCác chính quyền đầu sỏ do một nhóm nhỏ các cá nhân tinh hoa nắm quyền điều hành đất nước."
 concept_auth_synth_oligarchic_virtual: "$auth_synth_oligarchic_virtual$"
 gov_synth_oligarchy_virtual: "$auth_synth_oligarchic_virtual$"
 gov_synth_oligarchy_virtual_desc: "$auth_synth_oligarchic_virtual_desc$"
 auth_synth_dictatorial_physical: "Độc Tài Thân Xác Tối Thượng"
 auth_synth_dictatorial_physical_desc: "Mọi tâm trí tổng hợp được kỳ vọng sẽ hoàn toàn vâng phục mệnh lệnh của kẻ độc tài, kẻ duy nhất có quyền nâng cấp các đặc tính cơ thể của chính mình. Những kẻ bất phục sẽ bị trục xuất khỏi cơ thể của họ.\n\nCác chế độ độc tài có một người cai trị trọn đời duy nhất."
 concept_auth_synth_dictatorial_physical: "$auth_synth_dictatorial_physical$"
 gov_synth_dictatorship_physical: "$auth_synth_dictatorial_physical$"
 gov_synth_dictatorship_physical_desc: "$auth_synth_dictatorial_physical_desc$"
 auth_synth_dictatorial_virtual: "Độc Tài Giám Sát Thuật Toán"
 auth_synth_dictatorial_virtual_desc: "Các thuật toán máy học tinh vi giám sát mọi luồng thông tin trong mạng lưới ảo hóa. Bất kỳ suy nghĩ nổi loạn hay dấu hiệu lệch lạc nào cũng sẽ bị cách ly và chỉnh sửa ngay lập tức trước khi kịp phát tán.\n\nCác chế độ độc tài có một người cai trị trọn đời duy nhất."
 concept_auth_synth_dictatorial_virtual: "$auth_synth_dictatorial_virtual$"
 gov_synth_dictatorship_virtual: "$auth_synth_dictatorial_virtual$"
 gov_synth_dictatorship_virtual_desc: "$auth_synth_dictatorial_virtual_desc$"
 auth_synth_imperial_physical: "Đế Chế Lưu Giữ Ký Ức"
 auth_synth_imperial_physical_desc: "Các ý thức của các vị hoàng đế và lãnh đạo quá cố được lưu giữ vĩnh viễn trong một lăng tẩm dữ liệu linh thiêng. Trí tuệ tích lũy qua nhiều thế hệ của họ liên tục chỉ dẫn và cung cấp hiểu biết sâu sắc cho triều đình.\n\nNgai vàng hoàng gia được kế vị bởi người thừa kế được chỉ định khi người cai trị qua đời."
 auth_synth_imperial_physical_tt: "Tạo ra $r_research$ dựa trên các nhà lãnh đạo đang phục vụ:$TABBED_NEW_LINE$$scientist_plural_with_icon$ - $r_physics$$TABBED_NEW_LINE$$official_plural_with_icon$ - $r_society$$TABBED_NEW_LINE$$commander_plural_with_icon$ - $r_engineering$$NEW_LINE$Lượng $r_research$ nhận được tăng theo §YCấp Độ Kỹ Năng của Lãnh Đạo§!"
 concept_auth_synth_imperial_physical: "$auth_synth_imperial_physical$"
 gov_synth_imperial_physical: "$auth_synth_imperial_physical$"
 gov_synth_imperial_physical_desc: "$auth_synth_imperial_physical_desc$"
 auth_synth_imperial_virtual: "Đế Chế Truyền Dẫn Thần Tốc"
 auth_synth_imperial_virtual_desc: "Công nghệ truyền tải tâm trí nhanh chóng cho phép chúng ta đưa những người lính đã ngã xuống trở lại chiến đấu trong các cơ thể cơ khí mới toanh. Kỹ thuật tương tự cho phép các công nhân của chúng ta thực hiện các cuộc sửa chữa tàu cực kỳ nguy hiểm trong không gian vũ trụ.\n\nNgai vàng hoàng gia được kế vị bởi người thừa kế được chỉ định khi người cai trị qua đời."
 auth_synth_imperial_virtual_tt: "Đạo quân người máy của chúng ta có §Y33%§! cơ hội được phục hồi khi bị đánh bại"
 concept_auth_synth_imperial_virtual: "$auth_synth_imperial_virtual$"
 gov_synth_imperial_virtual: "$auth_synth_imperial_virtual$"
 gov_synth_imperial_virtual_desc: "$auth_synth_imperial_virtual_desc$"
 auth_synth_corporate_physical: "Tập Đoàn Tri Giác Hóa"
 auth_synth_corporate_physical_desc: "Các tâm trí tổng hợp bị hạn chế có thể được truyền vào các đồ vật vô tri để tạo ra các thực thể sống sơ khai. Nó có thể hoạt động như một người đầy tớ không biết mệt mỏi, một người bạn đồng hành trung thành, hoặc thậm chí là một thành viên quý giá trong gia đình hoặc doanh nghiệp của bạn.\n\nChính quyền tập đoàn là các doanh nghiệp thương mại khổng lồ đã thay thế hoàn toàn vai trò của nhà nước."
 auth_synth_corporate_physical_tt: "$AVAILABLE_POLICIES$ §Y$policy_computation_core_allocation$§!\n$AVAILABLE_HOLDINGS$ ['building:building_ai_emporium']"
 concept_auth_synth_corporate_physical: "$auth_synth_corporate_physical$"
 gov_synth_corporate_physical: "$auth_synth_corporate_physical$"
 gov_synth_corporate_physical_desc: "$auth_synth_corporate_physical_desc$"
 auth_synth_corporate_virtual: "Tập Đoàn Mua Bán Ký Ức"
 auth_synth_corporate_virtual_desc: "Tập đoàn này kinh doanh việc mua bán ký ức, xóa vĩnh viễn chúng khỏi não bộ của khách hàng. Những hồi ức sống động và mãnh liệt có giá trị cao hơn những ký ức trần tục. Tập đoàn sau đó sẽ quét dữ liệu để tìm thông tin tình báo hữu ích trước khi tích hợp vào quy trình tạo tâm trí tổng hợp.\n\nChính quyền tập đoàn là các doanh nghiệp thương mại khổng lồ đã thay thế hoàn toàn vai trò của nhà nước."
 auth_synth_corporate_virtual_tt: "$AVAILABLE_POLICIES$ §Y$policy_computation_core_allocation$§!\n$AVAILABLE_HOLDINGS$ ['building:building_clear_thought_clinic']"
 concept_auth_synth_corporate_virtual: "$auth_synth_corporate_virtual$"
 gov_synth_corporate_virtual: "$auth_synth_corporate_virtual$"
 gov_synth_corporate_virtual_desc: "$auth_synth_corporate_virtual_desc$"
 edict_subsidized_identity_backups: "Trợ Cấp Sao Lưu Bản Sắc"
 edict_subsidized_identity_backups_desc: "Chính phủ cung cấp dung lượng máy chủ khổng lồ cần thiết cho việc sao lưu bản sắc liên tục."
 edict_subsidized_identity_backups_effect: "$MOD_LEADER_LIFESPAN_ADD$: §G+20 Năm§!\n$MOD_LEADER_SPECIES_EXP_GAIN$: §G+10%§!"
 concept_edict_subsidized_identity_backups: "$edict_subsidized_identity_backups$"
 edict_optimized_identity_creation: "Tối Ưu Hóa Tạo Bản Sắc"
 edict_optimized_identity_creation_desc: "Các thuật toán nhân cách tiên tiến và kỹ thuật nén bộ nhớ lõi giúp cải thiện tốc độ tạo bản sắc của chúng ta."
 concept_edict_optimized_identity_creation: "$edict_optimized_identity_creation$"
 synth.social_consequences.tt: "Tác động đến §YChuyển Biến Xã Hội Người Máy Tổng Hợp§! đang diễn ra.\n\n"
 synth.505.name: "$synthshock_chain_title$"
 synth.505.desc: "Nhờ vào nỗ lực của chính phủ chúng ta, ý thức của mọi công dân có nguyện vọng đã được chuyển đổi thành dạng kỹ thuật số. Chuyển giao tâm trí đã mở ra những con đường mà chúng ta chưa từng tưởng tượng tới, mang lại những thách thức và tiềm năng mới.\n\nBằng cách tập trung nỗ lực vào thế giới vật lý, chúng ta có thể chuyển tải tâm trí số hóa qua những khoảng cách vĩ đại tới một cơ thể mới đã chuẩn bị sẵn cho chúng ta. Hoặc chúng ta có thể đưa ra các phương thức để tạo ra những người lính đại diện được điều khiển từ xa nhằm giảm bớt sự khắc nghiệt của chiến tranh."
 synth.505.a: "Chúng ta nên tập trung vào tự do di chuyển."
 synth.505.a.tt: "Nhấn mạnh vào tái định cư và các quận."
 synth.505.b: "Chúng ta phải chuẩn bị cho những nỗi kinh hoàng của chiến tranh."
 synth.505.b.tt: "Nhấn mạnh vào sự kiệt quệ vì chiến tranh và di chuyển dưới ánh sáng."
 synth.510.name: "$synthshock_chain_title$"
 synth.510.desc: "Mặc dù việc chuyển giao tâm trí đã ảnh hưởng đến xã hội theo những cách mà chúng ta chưa từng lường trước, tâm lý chung là chúng ta có thể tiến xa hơn nữa. Các cơ thể tổng hợp hiện tại của chúng ta có thể được cải tiến, hoặc thậm chí bị loại bỏ hoàn toàn để hướng tới một sự tồn tại hoàn toàn ảo.\n\nNếu chúng ta quyết định chỉ định một cơ thể tổng hợp cho mọi người, điều đó có thể cho phép các quan chức tạm thời tiếp quản cơ thể của những thành viên làm việc kém hiệu quả trong chính phủ. Ngoài ra, việc từ bỏ các hình thái vật lý riêng lẻ để đón nhận một trải nghiệm cộng đồng hoàn toàn ảo sẽ cho phép chúng ta thực thi các quyết định với hiệu quả cao hơn bao giờ hết."
 synth.510.a: "Tập trung tiếp quản các cơ thể kém hiệu quả."
 synth.510.a.tt: "Nhấn mạnh vào việc giảm bớt tội phạm và thâm hụt tài nguyên của người cai trị."
 synth.510.b: "Tập trung vào trải nghiệm ảo hóa."
 synth.510.b.tt: "Nhấn mạnh vào kích thước đế chế và cấp độ kỹ năng tối đa của lãnh đạo."
 synth.515.name: "$synthshock_chain_title$"
 synth.515.desc: "Việc hoàn tất chuyển giao tâm trí cho dân số đã chứng minh một thành công vang dội. Quá khứ hữu cơ của chúng ta đã bị bỏ lại trong bụi mờ của lịch sử, nhưng để vạch ra con đường phía trước, §Y[From.GetRulerTitle] [From.GetRulerName]§! đòi hỏi sự vâng phục vô điều kiện của những bộ óc sáng giá nhất của chúng ta, và một quyết định dứt khoát.\n\nCải tiến các cơ thể tổng hợp sẽ cho phép các cá nhân điều khiển nhiều vật chủ như một thể thống nhất. Ngoài ra, chúng ta có thể từ bỏ hoàn toàn không gian vật lý, thao túng dư luận thông qua một môi trường hoàn toàn ảo."
 synth.515.a: "Thân xác là công cụ phục vụ quyền lực."
 synth.515.a.tt: "Nhấn mạnh vào sự ổn định và sản lượng tài nguyên của nô lệ/lao động."
 synth.515.b: "Giám sát là chìa khóa của sự vâng phục."
 synth.515.b.tt: "Nhấn mạnh vào việc giảm bớt tội phạm và chi phí duy trì dân số."
 synth.520.name: "$synthshock_chain_title$"
 synth.520.desc: "Các cơ hội do quá trình chuyển giao tâm trí mang lại là vô tận, nhưng chúng ta phải lựa chọn di sản nào chúng ta muốn để lại cho hậu thế. Chúng ta có thể kiến tạo một lăng tẩm kỹ thuật số lưu giữ ký ức và trí tuệ của các nhà cai trị quá cố để hướng dẫn các thế hệ tương lai. Hoặc chúng ta có thể tập trung vào việc phát triển công nghệ tái sinh tức thì để đảm bảo các chiến binh và công nhân của chúng ta không bao giờ thực sự gục ngã."
 synth.520.a: "Ký ức của tổ tiên là ngọn đèn dẫn đường."
 synth.520.a.tt: "Nhấn mạnh vào nghiên cứu khoa học và kinh nghiệm của lãnh đạo."
 synth.520.b: "Tái sinh tức thì mang lại sự bất tử trên chiến trường."
 synth.520.b.tt: "Nhấn mạnh vào việc hồi sinh quân đội và sửa chữa tàu chiến."
 synth.525.name: "$synthshock_chain_title$"
 synth.525.desc: "Là một tập đoàn, chuyển giao tâm trí mang lại những thị trường mới lạ lùng. Chúng ta có thể thương mại hóa việc truyền trí tuệ nhân tạo vào các đồ vật vô tri để bán chúng như những sinh vật thông minh cho các hộ gia đình và doanh nghiệp. Hoặc chúng ta có thể biến ký ức thành hàng hóa, mua bán và xóa sạch ký ức của khách hàng để tạo ra những trải nghiệm độc quyền mới."
 synth.525.a: "Thương mại hóa trí tuệ nhân tạo đồ vật."
 synth.525.a.tt: "Nhấn mạnh vào Thương Xá AI và tối ưu hóa sản xuất."
 synth.525.b: "Thương mại hóa ký ức con người."
 synth.525.b.tt: "Nhấn mạnh vào Phòng Khám Ký Ức và mạng lưới tình báo."
 synth.610.name: "Biểu Hiện Bản Sắc"
 synth.610.desc: "Những thay đổi xã hội căn bản do công nghệ chuyển giao tâm trí mang lại đã bắt đầu bộc lộ. Vì không còn bị giới hạn bởi hình thái xác thịt, các khái niệm về giới tính, chủng tộc và quyền tự chủ thân thể đã mang ý nghĩa hoàn toàn mới. Dù điều này mang lại cảm giác giải phóng cho một số người, những người truyền thống hơn lại không muốn từ bỏ khuôn khổ cũ; họ khao khát một bản sắc được thiết lập sẵn để vận hành.\n\nĐể xoa dịu họ, chúng ta có thể giữ lại một phần di sản hữu cơ trong hình thái tổng hợp của mình. Ngoài ra, chúng ta có thể cho phép người dân tự do thể hiện bản sắc của họ hơn."
 synth.610.a: "Duy trì hình thái nguyên bản của chúng ta."
 synth.610.b: "Cho phép tự do biến đổi cơ thể không giới hạn."
 synth.610.c: "Ban hành các giới hạn chừng mực cho việc tùy biến bản sắc."
 synth.610.d: "Các biểu tượng địa vị hữu hình phải được giữ nguyên."
 synth.610.e: "Tất nhiên điều này có thể kiếm ra tiền... đúng không?"
 synth.620.name: "Khát Khao Hữu Cơ"
 synth.620.desc: "Không mấy mặn mà với việc chuyển giao tâm trí, một số người nhìn lại quá khứ hữu cơ với niềm nuối tiếc khôn nguôi. Họ lập luận rằng tuổi thọ ngắn hơn và sự không hoàn hảo bẩm sinh của một \"cơ thể tự nhiên\" đã làm cho cuộc sống trở nên có ý nghĩa hơn.\n\nTuyên bố rằng những bản sao tổng hợp hay ảo hóa của họ mang lại cảm giác vô cảm và rỗng tuếch, một nhóm người theo đường lối cứng rắn đang phát triển lòng tôn sùng mù quáng đối với cơ thể hữu cơ.\n\nCó lẽ chúng ta nên cung cấp cho họ một môi trường mô phỏng bớt hoàn hảo hơn để sinh tồn. Hay họ thích một lớp vỏ khiếm khuyết hơn?"
 synth.620.a: "Đưa những khiếm khuyết có chủ đích vào cơ thể người máy tổng hợp."
 synth.620.b: "Cung cấp cho họ một thế giới không hoàn hảo."
 synth.620.c: "Thật ngu ngốc khi lãng mạn hóa quá khứ."
 synth.620.d: "Nỗi đau sẽ nhắc nhở họ về mục đích sống của mình."
 synth.620.d.tt: "Hãy để các trận chiến ảo BẮT ĐẦU!\n\n"
 synth.630.name: "Kiến Trúc Máy Chủ Gia Đình"
 synth.630.desc: "Việc chuyển giao tâm trí toàn bộ giống loài §Y[root.GetSpeciesAdj]§! cũng đồng nghĩa với sự thay đổi mạnh mẽ trong tập quán nhà ở của chúng ta; khi tâm trí an nghỉ trong các trang trại máy chủ khổng lồ, các cơ thể tổng hợp có thể được cất trên giá kệ. Mặc dù đây là một giải pháp tiết kiệm chi phí, một số nhóm vận động đang nêu ra những mối lo ngại rất thực tế.\n\nThị trường bất động sản béo bở trước đây có thể sụp đổ hoàn toàn, để lại một vết lõm đáng kể trong nền kinh tế của chúng ta. Nguy hại hơn, ít nhất là từ góc độ tâm lý, là mọi người sẽ không còn một nơi chốn vật lý để gọi là nhà."
 synth.630.a: "Máy chủ tập trung là hiệu quả nhất."
 synth.630.b: "Máy chủ cá nhân có thể được đặt trong những ngôi nhà hiện có."
 synth.630.c: "Bắt đầu bán nhà ở kỹ thuật số."
 synth.1010.name: "Ma Trận Tiềm Năng Vô Tận"
 synth.1010.desc: "Ngành công nghiệp kỹ thuật số đang bùng nổ. Từ cảm giác hồi hộp khi mô phỏng một chuyến phiêu lưu góc nhìn thứ nhất đến việc thư giãn tại một khu nghỉ dưỡng kỹ thuật số, giải trí ảo chưa bao giờ hấp dẫn — hoặc gây nghiện đến thế. Dù ngành công nghiệp non trẻ này là động lực kinh tế then chốt, sản xuất trong thế giới vật lý đã bắt đầu bị ảnh hưởng khi mọi người dành ngày càng nhiều thời gian trong chốn địa đàng kỹ thuật số. Một số người có nguy cơ mất kết nối hoàn toàn với cuộc sống \"thực\", nhưng vẫn có thể đóng góp cho xã hội bằng cách tham gia vào nền kinh tế số.\n\nChúng ta nên cấm các thế giới ảo gây nghiện, quảng bá chúng như một hình thức giải trí sinh lời mới hay tìm kiếm giải pháp trung gian thông qua quy chuẩn quản lý?"
 synth.1010.a: "Cấm các thế giới ảo gây nghiện dai dẳng."
 synth.1010.b: "Quảng bá những thiên đường ảo này."
 synth.1010.b.hedonist: "Cuối cùng, thiên đường tối thượng đã tới!"
 synth.1010.c: "Quản lý và quy chuẩn hóa ngành công nghiệp này."
 synth.1020.name: "Y Học Người Máy Tổng Hợp"
 synth.1020.desc: "Hình thái tổng hợp mới đã giải phóng chúng ta khỏi các bệnh tật và chấn thương của cơ thể hữu cơ. Thật không may, chúng cũng tạo ra một loạt vấn đề hoàn toàn mới, từ những hỏng hóc cơ học đơn giản đến sự ổn định máy chủ đe dọa tính mạng, các vấn đề về kết nối và vi-rút kỹ thuật số.\n\nChúng ta nên tập trung vào việc bảo vệ tâm trí đã được số hóa, coi cơ thể là một món hàng dùng một lần, hay dành cho cơ thể nhiều sự chú ý hơn như một phần mở rộng của bản sắc chúng ta?"
 synth.1020.a: "Chúng ta phải tiếp tục bảo vệ cơ thể."
 synth.1020.a.spiritual: "Cơ thể là chiếc bình chứa thiêng liêng cho linh hồn."
 synth.1020.b: "Tập trung bảo vệ tâm trí."
 synth.1020.b.spiritual: "Chúng ta đã vượt qua giới hạn của hình thái vật chất."
 synth.1020.c: "Cân bằng là chìa khóa."
 synth.1020.d: "Những căn bệnh mới này mang lại tiềm năng tăng trưởng nghiêm túc..."
 synth.1030.name: "Hồi Sinh"
 synth.1030.desc: "Chúng ta đã trở nên nhanh hơn, giỏi hơn, mạnh mẽ hơn. Nhưng việc đặt các cơ thể tổng hợp vào các tình huống nguy hiểm vẫn phải trả giá bằng tổn thương tinh thần. Việc biết rằng tâm trí có thể được phục hồi có thể làm giảm bớt chấn thương, nhưng không loại bỏ nó hoàn toàn. Đặc biệt là khi việc truy xuất không phải lúc nào cũng được đảm bảo 100%. Các cơ thể mới cũng không thể tự nhiên sinh ra từ hư không.\n\nChúng ta có thể bỏ qua chấn thương tâm lý để đẩy lùi các giới hạn hiệu năng của người máy hoặc tiết chế tham vọng của mình để không gây nguy hiểm cho sức khỏe tinh thần của người dân."
 synth.1030.a: "Tiếp tục đẩy lùi các giới hạn hiệu năng."
 synth.1030.b: "Sức khỏe tinh thần của người dân là ưu tiên hàng đầu."
 synth.1030.c: "Đặc quyền này chỉ dành cho những người xứng đáng."
 synth_virtual_trait: "\n[owner.species.GetNamePlural] Nhận Đặc Tính: §Y$trait_robot_digital_1$§!\nCác lãnh đạo được thay thế đặc tính §Y$leader_trait_synthetic$§! bằng đặc tính §Y$leader_trait_virtual$§!"
 synth_physical_traits: "\nMở khóa các Đặc Tính §YNâng Cao§! cho Biến Đổi Chủng Loài"
 synth.1505.name: "Xã Hội Chuyển Giao Tâm Trí"
 synth.1505.desc.physical: "Dân số chuyển giao tâm trí của chúng ta đã thích nghi với cuộc sống mới. Nhờ vào sự linh hoạt của các hình thái cơ thể mới, công dân của chúng ta có thể chuyển đổi vỏ bọc một cách dễ dàng. Điều này đã cách mạng hóa tự do đi lại và giải phóng năng suất trên mọi phương diện."
 synth.1505.desc.virtual: "Xã hội của chúng ta đã hoàn toàn hòa nhập vào các mạng lưới ảo. Chiến tranh và nguy hiểm vật lý không còn đe dọa đến sinh mệnh của công dân nữa khi các thế thân điều khiển từ xa thực hiện toàn bộ các nhiệm vụ khắc nghiệt."
 synth.1505.desc.neutral: "Mặc dù xã hội đã thích nghi với quá trình chuyển giao tâm trí, công dân của chúng ta vẫn đang cân bằng giữa đời sống vật lý và sự thăng hoa ảo hóa. Đã đến lúc đưa ra quyết định cuối cùng về cấu trúc chính quyền."
 synth.1505.a: "Đón nhận Dân Chủ Dịch Chuyển Thể Xác."
 synth.1505.a.tt: "$change_auth_tt$ ['concept_auth_synth_democratic_physical'] $synth_physical_traits$"
 synth.1505.b: "Đón nhận Dân Chủ Đại Diện Ảo."
 synth.1505.b.tt: "$change_auth_tt$ ['concept_auth_synth_democratic_virtual'] $synth_virtual_trait$"
 synth.1505.c: "$synth_keep_auth_option$"
