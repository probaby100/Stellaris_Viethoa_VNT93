 pops_are: "đang"
 building_identity_complex: "Tổ Hợp Bản Sắc"
 building_identity_complex_desc: "Một trung tâm tối tân phục vụ việc nghiên cứu và phát triển các bản sắc người máy tổng hợp."
 building_identity_complex_speed: "§G+100§! £pop£ §HDân số§!"
 building_identity_complex_effect_desc: "Tải lên $building_identity_complex_speed$ mỗi tháng."
 building_ai_emporium: "Thương Xá AI"
 building_ai_emporium_desc: "Tổ hợp mua sắm một điểm dừng đáp ứng mọi nhu cầu về Trí Tuệ Nhân Tạo của bạn. Hãy để các AI có tri giác biến những đồ vật bình thường thành những người bạn thông minh cho gia đình hoặc doanh nghiệp của bạn. AI có phần hơi tự ý thức quá mức? Hãy mang nó đến đây và các kỹ thuật viên lành nghề của chúng ta sẽ thiết lập lại nó nhanh hơn vận tốc dưới ánh sáng."
 building_ai_emporium_fail_tt: "$TRIGGER_FAIL$Chúng ta đã có một §Y$building_ai_emporium$§! tại §Y[planet.owner.GetName]§!"
 building_ai_emporium_outlawed_robots_tt: "$TRIGGER_FAIL$§Y[planet.owner.GetName]§! đã đặt robot ra ngoài vòng pháp luật"
 building_clear_thought_clinic: "Phòng Khám Xóa Bỏ Ký Ức"
 building_clear_thought_clinic_desc: "Bạn có những ký ức không còn cần đến nữa? Hãy biến chúng thành Năng Lượng Tín Dụng! Đội ngũ được đào tạo bài bản của chúng tôi sẽ loại bỏ chúng một cách an toàn và bảo mật! Ký ức càng vui tươi, số tiền chi trả càng lớn!\n\nThao tác này là vĩnh viễn và các mẫu tư duy không thể phục hồi một khi đã được trích xuất."
 clear_thought_clinic_modifier: "$building_clear_thought_clinic$"
 clear_thought_clinic_tt: "Hiệu Ứng Mạng Lưới Gián Điệp Không Cộng Dồn: $TABBED_NEW_LINE$$MOD_SPY_NETWORK_DAILY_VALUE_MULT$: §G+25%§! $TABBED_NEW_LINE$$MOD_SPY_NETWORK_LEVELS_ADD$: §G+10§!"
 m_pop_assembly: "£mod_planet_pop_assembly_add£ §Y$MOD_PLANET_POP_ASSEMBLY_ADD$§!"
 job_identity_designer: "Kỹ Sư Thiết Kế Bản Sắc"
 job_identity_designer_plural: "Kỹ Sư Thiết Kế Bản Sắc"
 job_identity_designer_plural_with_icon: "£job_identity_designer£ $job_identity_designer_plural$"
 job_identity_designer_converter_desc: "$job_identity_designer_plural$ tạo điều kiện thuận lợi cho việc chuyển đổi từ hình thái sinh học sang bản sắc kỹ thuật số, đảm bảo quá trình chuyển tiếp không đau đớn."
 job_identity_designer_converter_effect_desc: "$job_identity_designer_plural_with_icon$ cung cấp $i_engineering$ và $i_amenities$"
 job_identity_designer_desc: "$job_identity_designer_plural$ tỉ mỉ tạo ra các tâm trí người máy tổng hợp mới."
 job_identity_designer_effect_desc: "$job_identity_designer_plural_with_icon$ cung cấp $i_engineering$, $i_amenities$, và $m_pop_assembly$ trên toàn đế chế"
 mod_job_identity_designer_add: "Nghề $job_identity_designer$"
 job_roboticist_plural_and_job_identity_designer_plural: "[roboticist.GetNamePlural] và $job_identity_designer_plural$"
 job_roboticist_plural_with_icon_and_job_identity_designer_plural_with_icon: "$job_roboticist_plural_with_icon$ và $job_identity_designer_plural_with_icon$"
 councilor_ruler_imperial_synth: "$imperial_ruler$"
 councilor_ruler_imperial_synth_desc: "$imperial_ruler_desc$"
 synth_opposition_truth: "Chiến Dịch Thông Tin Chuyển Giao Tâm Trí"
 synth_opposition_truth_desc: "Thúc đẩy thông tin trung thực về mọi khía cạnh liên quan đến việc chuyển giao tâm trí."
 synth_opposition_deception: "Chiến Dịch Định Hướng Dư Luận Chuyển Giao Tâm Trí"
 synth_opposition_deception_desc: "Định hướng câu chuyện truyền thông đại chúng để nhấn mạnh các khía cạnh tích cực của việc chuyển giao tâm trí."
 synth_tinkering_with_minds: "Chỉnh Sửa Ý Thức"
 synth_tinkering_with_minds_desc: "Những tâm trí mới được số hóa sẽ trải qua quá trình tái lập trình chừng mực để phù hợp với tầm nhìn tương lai của chúng ta."
 synth_brightest_minds: "Ưu Tiên Tinh Anh"
 synth_brightest_minds_desc: "Chỉ những cá nhân kiệt xuất nhất mới được lựa chọn tham gia chương trình chuyển giao tâm trí của chúng ta."
 synth_reprogram_minds: "Tái Lập Trình Cưỡng Chế"
 synth_reprogram_minds_desc: "Chính phủ này đang tái lập trình trên diện rộng các cá nhân \"không phù hợp\" khi họ được số hóa."
 victim_compensation: "Bồi Thường Cho Nạn Nhân"
 victim_compensation_desc: "Khoản bồi thường được cung cấp cho gia đình của những người có tâm trí bị thất lạc trong quá trình chuyển giao tâm trí."
 synth_mandatory_volunteers: "Tình Nguyện Viên Bắt Buộc"
 synth_mandatory_volunteers_desc: "Các đối tượng thử nghiệm bị buộc phải tham gia vào các thí nghiệm số hóa ý thức sinh học."
 synth_mass_demonstrations: "Biểu Tình Quy Mô Lớn"
 synth_mass_demonstrations_desc: "Lực lượng lao động của hành tinh đang mải mê tham gia các cuộc biểu tình quy mô lớn phản đối quá trình chuyển đổi sang máy móc."
 synth_fund_heritage_sites: "Tài Trợ Khu Di Sản"
 synth_fund_heritage_sites_desc: "Các Khu Di Sản đặc biệt sẽ được xây dựng để hạn chế tác động của quá trình chuyển đổi tổng hợp lên các thành viên sinh học của loài chúng ta."
 synth_revere_the_past: "Tôn Kính Quá Khứ"
 synth_revere_the_past_desc: "Các nghi lễ tôn giáo sinh ra từ sự tồn tại sinh học của chúng ta vẫn rất quan trọng, và chúng ta phải bảo vệ những nơi thờ phụng này."
 synth_preserve_the_past: "Bảo Tồn Quá Khứ"
 synth_preserve_the_past_desc: "Việc đón nhận trọn vẹn một sự tồn tại mới không có nghĩa là chúng ta phải phá hủy những nơi chốn và đồ vật đã mang lại ý nghĩa cho quá khứ sinh học của mình."
 synth_resistance_fight: "Vây Bắt Thủ Lĩnh Phe Kháng Cự"
 synth_resistance_fight_desc: "Cử các biệt đội máy móc của chúng ta vào $d_biological_enclaves_no_icon$ để bắt giữ các thủ lĩnh phe kháng cự sẽ nhanh chóng dập tắt sự phản đối."
 synth_resistance_diplomacy: "Ngoại Giao Với Thủ Lĩnh Phe Kháng Cự"
 synth_resistance_diplomacy_desc: "Đến thăm $d_biological_enclaves_no_icon$ để gặp gỡ các thủ lĩnh phe kháng cự sẽ cải thiện sự thấu hiểu lẫn nhau."
 synth_character_force: "Mô Phỏng Thể Xác Hữu Cơ Cũ"
 synth_character_force_desc: "Hình thái truyền thống của loài chúng ta được bảo tồn trong thế giới kỹ thuật số."
 synth_character_customize: "Tự Do Biến Đổi Cơ Thể Tổng Hợp"
 synth_character_customize_desc: "Các cá thể có thể tự do biến đổi diện mạo kỹ thuật số mới của mình."
 synth_character_customize_elite: "Hạn Chế Biến Đổi Cơ Thể Tổng Hợp"
 synth_character_customize_elite_desc: "Để duy trì trật tự xã hội rõ ràng, chỉ tầng lớp thượng lưu mới được phép chỉnh sửa diện mạo của họ."
 synth_character_customize_corpo: "Thương Mại Hóa Biến Đổi Cơ Thể Tổng Hợp"
 synth_character_customize_corpo_desc: "Mọi người được tự do chỉnh sửa diện mạo kỹ thuật số của mình — miễn là họ có đủ khả năng chi trả."
 synth_cravings_imperfections: "Khiếm Khuyết Nhân Tạo Của Người Máy"
 synth_cravings_imperfections_desc: "Để tránh một sự tồn tại rỗng tuếch và vô cảm, các đặc điểm khiếm khuyết có chủ ý đang được đưa vào các cơ thể người máy tổng hợp."
 synth_cravings_simulation: "Cuộc Sống Trong Mô Phỏng"
 synth_cravings_simulation_desc: "Chúng ta nỗ lực tạo ra một cuộc sống chân thực hơn cho những người lựa chọn sống trong mô phỏng, bao gồm cả những gian nan vất vả."
 synth_cravings_stop: "Phớt Lờ Phe Cứng Rắn Sinh Học"
 synth_cravings_stop_desc: "Theo thời gian, người dân của chúng ta sẽ trân trọng cuộc sống hoàn hảo không còn những nỗi thống khổ sinh học."
 synth_cravings_pain: "Đấu Trường Ảo"
 synth_cravings_pain_desc: "Tham gia vào các trận chiến ảo đau đớn mang lại mục đích sống quen thuộc cho cả người tham gia lẫn khán giả."
 synth_health_physical: "Tập Trung Sức Khỏe Thể Chất Người Máy"
 synth_health_physical_desc: "Dịch vụ chăm sóc sức khỏe người máy của chúng ta sẽ ưu tiên giải quyết các hỏng hóc cục bộ."
 synth_health_virtual: "Tập Trung Sức Khỏe Tâm Thần Người Máy"
 synth_health_virtual_desc: "Đảm bảo sự an toàn của tâm trí chúng ta thông qua các bản cập nhật phần mềm liên tục là điều thiết yếu đối với sức khỏe."
 synth_health_both: "Chăm Sóc Sức Khỏe Người Máy Toàn Diện"
 synth_health_both_desc: "Giải quyết cả những bất ổn về phần mềm và phần cứng là điều cần thiết cho sự thịnh vượng của người dân chúng ta."
 synth_health_corporate: "Y Tế Hóa Người Máy"
 synth_health_corporate_desc: "Mở rộng chuyên môn của tập đoàn chúng ta vượt ra ngoài các loại thuốc truyền thống là điều tối quan trọng để điều trị vi-rút kỹ thuật số."
 synth_virtual_world_outlaw: "Cấm Các Thế Giới Ảo"
 synth_virtual_world_outlaw_desc: "Các khu nghỉ dưỡng ảo gây nghiện cao đã bị đặt ra ngoài vòng pháp luật vì là mối đe dọa đối với xã hội."
 synth_virtual_world_promote: "Khuyến Khích Các Thế Giới Ảo"
 synth_virtual_world_promote_desc: "Mọi người được tự do tận hưởng các hình thức giải trí gần như vô tận trong chốn địa đàng kỹ thuật số."
 synth_virtual_world_regulate: "Quy Chuẩn Các Thế Giới Ảo"
 synth_virtual_world_regulate_desc: "Các khu nghỉ dưỡng ảo gây nghiện cao được quản lý nghiêm ngặt để đảm bảo mọi người duy trì kết nối với thực tế."
 synth_home_centralized: "Trang Trại Máy Chủ Tập Trung"
 synth_home_centralized_desc: "Mỗi ý thức được số hóa được lưu trữ trong các trang trại máy chủ trung tâm thuộc sở hữu của nhà nước để đạt hiệu quả chi phí tối đa."
 synth_home_distributed: "Máy Chủ Gia Đình Phân Tán"
 synth_home_distributed_desc: "Các ý thức được số hóa được lưu trữ trong các tư gia cá nhân truyền thống."
 synth_digital_homes: "Bất Động Sản Kỹ Thuật Số"
 synth_digital_homes_desc: "Tương tự như thị trường nhà ở truyền thống, bất động sản kỹ thuật số mang lại nguồn thu gần như tương đương với chỉ một phần nhỏ chi phí."
 synth_respawn_push: "Nới Lỏng Tiêu Chuẩn An Toàn Người Máy"
 synth_respawn_push_desc: "Các tiêu chuẩn an toàn thể chất khoan dung đảm bảo một nền kinh tế kiên cường."
 synth_respawn_caution: "Tiêu Chuẩn An Toàn Người Máy"
 synth_respawn_caution_desc: "Bảo vệ các cơ thể tổng hợp và tâm trí bên trong chỉ có thể được thực hiện bằng các nguyên tắc nghiêm ngặt của chính phủ."
 synth_respawn_elite: "Đặc Quyền An Toàn Của Người Máy"
 synth_respawn_elite_desc: "Tầng lớp thượng lưu bị cấm làm việc trong các nhiệm vụ gây rủi ro cho thể xác hoặc tâm trí."
 synth_cultural_exchange: "Thấu Hiểu Văn Hóa"
 synth_cultural_exchange_desc: "Các chương trình giao lưu văn hóa đến và đi từ các khu di sản của chúng ta thúc đẩy sự hiểu biết lẫn nhau giữa các dân tộc."
 synth_combat_reactors: "Lò Phản Ứng Chiến Đấu"
 synth_combat_reactors_desc: "Công nghệ vi nhiệt hạch mới đã được bổ sung vào cơ thể máy móc của chúng ta, mang lại khả năng chiến đấu vượt trội hơn nhiều."
 synth_AI_actor: "Phát Ngôn Viên AI"
 synth_AI_actor_desc: "Sử dụng một bản sao truyền tải AI của một người nổi tiếng đã khuất, chúng ta đang thu hút sự ủng hộ cho chỉ thị chuyển giao tâm trí đang diễn ra."
 d_old_towns_no_icons: "Thị Trấn Cũ"
 d_old_towns: "£blocker£ $d_old_towns_no_icons$"
 d_old_towns_desc: "Khu vực này bị chi phối bởi các thành phố được bảo tồn tốt, nơi ở của các thành viên thuộc loài nguyên bản của chúng ta. Bằng cách tiêu tốn tài nguyên, chúng ta có thể khuyến khích những người cố thủ này chuyển đổi thành máy móc."
 d_old_towns_custom_tooltip: "§Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§! được tạo ra"
 d_biological_enclaves_no_icon: "Vùng Đất Sinh Học Biệt Lập"
 d_biological_enclaves: "£blocker£ $d_biological_enclaves_no_icon$"
 d_biological_enclaves_desc: "Khu vực này bị chi phối bởi các thành phố là nơi ở của những người phản đối việc chuyển đổi thành người máy tổng hợp."
 d_biological_enclaves_custom_tooltip: "§Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§! được tạo ra"
 policy_synthetic_identities_policy: "Bản Sắc Người Máy Tổng Hợp"
 policy_synthetic_identities_policy_desc: "Các bản sắc người máy tổng hợp mới phải được tạo ra để chúng ta sinh sôi nhân bản."
 identity_copy_name: "Nhân Bản Bản Sắc"
 identity_copy: "$identity_copy_name$"
 identity_copy_desc: "$tech_identity_copy_desc$\n\nCác bản sao chỉ cảm thấy một chút u sầu nhẹ do thiếu tính độc nhất.\n\n$TECH_UNLOCK_IDENTITY_COPY_DESC$\n\n§E$identity_copy_name$ $can_enable_mind_creation$§!"
 identity_fusion_name: "Hợp Nhất Bản Sắc"
 identity_fusion: "$identity_fusion_name$"
 identity_fusion_desc: "$tech_identity_fusion_desc$\n\n$TECH_UNLOCK_IDENTITY_FUSION_DESC$\n\n§E$identity_fusion_name$ $can_enable_mind_creation$§!"
 identity_initialization_name: "Khởi Tạo Bản Sắc"
 identity_initialization: "$identity_initialization_name$"
 identity_initialization_desc: "$tech_identity_initialization_desc$\n\n$TECH_UNLOCK_IDENTITY_INITIALIZATION_DESC$\n\n§E$identity_initialization_name$ $can_enable_mind_creation$§!"
 can_enable_mind_creation: "được áp dụng khi lắp ráp Người Máy Tổng Hợp"
 policy_computation_core_allocation: "Định Hướng Lõi Tính Toán"
 policy_computation_core_allocation_desc: "Các tập đoàn đã chuyển giao tâm trí có thể chuyển hướng chu kỳ tính toán từ các hệ thống cốt lõi để tối ưu hóa các lĩnh vực xã hội giá trị cao mà không có bất kỳ độ trễ nào."
 computation_core_production_name: "Tinh Gọn Sản Xuất"
 computation_core_production: "$computation_core_production_name$"
 computation_core_production_desc: "Tận dụng các chu kỳ xử lý nhàn rỗi để tinh gọn các quy trình sản xuất.$computation_core_production_tt$"
