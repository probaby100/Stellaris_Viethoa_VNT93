 situation_digitization_overclocked: "Ép Xung"
 approach_digitization_overclocked_tt: "Nguy cơ xảy ra các sự kiện đầy thách thức cao hơn.\n$situation_speed_tt$: §G+20%§!"
 situation_digitization_overclocked_approach_tt: "$situation_digitization_overclocked$ $situation_approach_tt$"
