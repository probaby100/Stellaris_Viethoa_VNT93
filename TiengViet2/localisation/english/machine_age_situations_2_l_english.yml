l_english:
 situation_digitization: "Chuyển Giao Tâm Trí"
 situation_digitization_type: "Tình Huống Thăng Hoa"
 situation_digitization_desc: "Đã đến lúc bỏ lại những thể xác sinh học đầy khiếm khuyết phía sau. Chúng ta phải chuẩn bị những cơ thể máy móc tiên tiến và thực hiện quy trình chuyển giao ý thức.\n\n§YDân số sẽ được số hóa vào tháng tới§!: §G[From.GetSynthPopsPerMonth]§!"
 situation_digitization_monthly_change_tooltip: "Tâm trí chúng ta sẽ trở thành kỹ thuật số, cơ thể chúng ta sẽ là máy móc."
 situation_digitization_outcome: "Một dân số người máy tổng hợp."
 stage_digitization_effects: "Chúng ta phải thiết kế một phiên bản kỹ thuật số đại diện cho bộ não, kiến tạo các cơ thể máy móc, và tự biến đổi chính mình."
 situation_digitization_errorcorrecting: "Sửa Lỗi"
 approach_digitization_errorcorrecting_tt: "Khả năng xảy ra các sự kiện có lợi cao hơn.\n$situation_speed_tt$: §R-20%§!"
