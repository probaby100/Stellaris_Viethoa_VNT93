 whisperers_covenant_chain_title:0 "Hư không Chi Mật ngữ"
 whisperers_covenant_chain_desc:0 "Chúng ta đã thiết lập một mối liên kết với một thực thể trong Hư cảnh mang tên $whisperers_in_the_void_color_article$. Cùng với những cảm giác mơ hồ, nó ban cho chúng ta những nguồn sức mạnh vụn vặt và yêu cầu chúng ta phải trả giá. Chắc chắn sẽ còn nhiều cuộc trao đổi tương tự như vậy trong tương lai.\n\nCác [GetTelepathPlural] của chúng ta đi đến kết luận rằng, mối liên kết này sẽ dễ dàng được củng cố hơn nếu những hành động của chúng ta đồng điệu với ý chí của Thượng đế.\n\nMật ngữ luôn khát khao những tri thức mới lạ, những bí mật ẩn giấu và những âm mưu đen tối. Bọn chúng đắm chìm trong một thứ khoái cảm đơn thuần, một thứ khoái cảm lấp đầy tâm trí và len lỏi qua từng kẽ hở."
 whisperers_covenant_chain_begin:0 "$BEGINS_EVENT_CHAIN$§Y$whisperers_covenant_chain_title$§!"
 whisperers_covenant_chain_end:0 "$ENDS_EVENT_CHAIN$§Y$whisperers_covenant_chain_title$§!"
 eater_covenant_chain_title:0 "Kẻ Nuốt chửng Thế giới"
 eater_covenant_chain_desc.intro:0 "Chúng ta đã thiết lập một mối liên kết với một thực thể trong Hư cảnh mang tên $the_eater_of_worlds_color_article$. Nó ban cho chúng ta những nguồn sức mạnh vụn vặt và yêu cầu chúng ta phải trả giá. Chắc chắn sẽ còn nhiều cuộc trao đổi tương tự như vậy trong tương lai.\n\nCác [GetTelepathPlural] của chúng ta suy đoán rằng, miễn là những hành động của chúng ta đồng điệu với ý chí của Thượng đế, mối liên kết này sẽ ngày càng được củng cố."
 eater_covenant_chain_desc:0 "$eater_covenant_chain_desc.intro$\n\nKẻ Nuốt chửng là một kẻ phàm ăn vô độ. Ngài khao khát chiến tranh, xung đột và hương vị ngọt ngào của những tiếng kêu gào thống thiết."
 eater_covenant_chain_begin:0 "$BEGINS_EVENT_CHAIN$§Y$eater_covenant_chain_title$§!"
 eater_covenant_chain_end:0 "$ENDS_EVENT_CHAIN$§Y$eater_covenant_chain_title$§!"
 composer_covenant_chain_title:0 "Sợi tơ Đời sống"
 composer_covenant_chain_desc.intro:0 "Chúng ta đã thiết lập một mối liên kết với một thực thể trong Hư cảnh mang tên $the_composer_of_strands_color_article$. Cùng với cảm giác được chở che, Ngài ban cho chúng ta những nguồn sức mạnh vụn vặt và yêu cầu chúng ta phải trả giá. Chắc chắn sẽ còn nhiều cuộc trao đổi tương tự như vậy trong tương lai.\n\nCác [GetTelepathPlural] của chúng ta suy đoán rằng, miễn là những hành động của chúng ta đồng điệu với ý chí của Thượng đế, mối liên kết này sẽ ngày càng được củng cố."
 composer_covenant_chain_desc:0 "$composer_covenant_chain_desc.intro$\n\nSợi tơ khao khát được thao túng mã gen và giải phóng cơ thể khỏi những giới hạn của tiến hóa. Ngài truyền dạy cho chúng ta lòng tôn kính đối với sự sống và tự nhiên, cũng như sự thiêng liêng của cơ thể."
 composer_covenant_chain_begin:0 "$BEGINS_EVENT_CHAIN$§Y$composer_covenant_chain_title$§!"
 composer_covenant_chain_end:0 "$ENDS_EVENT_CHAIN$§Y$composer_covenant_chain_title$§!"
 instrument_covenant_chain_title:0 "Khí cụ Dục vọng"
 instrument_covenant_chain_desc.intro:0 "Chúng ta đã thiết lập một mối liên kết với một thực thể trong Hư cảnh mang tên $the_instrument_of_desire_color_article$. Ngài ban cho chúng ta những nguồn sức mạnh vụn vặt và yêu cầu chúng ta phải trả giá. Chắc chắn sẽ còn nhiều cuộc trao đổi tương tự như vậy trong tương lai.\n\nCác [GetTelepathPlural] của chúng ta suy đoán rằng, miễn là những hành động của chúng ta đồng điệu với ý chí của Thượng đế, mối liên kết này sẽ ngày càng được củng cố."
 instrument_covenant_chain_desc:0 "$instrument_covenant_chain_desc.intro$\n\nKhí cụ khao khát chính niềm khao khát. Đắm chìm trong khoái lạc, sự băng hoại và sự áp bức, đó chính là những danh xưng khác của Khí cụ."
 instrument_covenant_chain_begin:0 "$BEGINS_EVENT_CHAIN$§Y$instrument_covenant_chain_title$§!"
 instrument_covenant_chain_end:0 "$ENDS_EVENT_CHAIN$§Y$instrument_covenant_chain_title$§!"

 utopia.2671.name:0 "Mối liên kết của Chúng ta Đã Trở nên Sâu sắc hơn"
 utopia.2671.desc:0 "Sự am hiểu của chúng ta về Thượng đế đang tiến triển từng ngày. Đối với Ngài, chúng ta chỉ như những ý nghĩ thoáng qua trong lúc rảnh rỗi. Giống như những con bọ trong một căn phòng. Mặc dù vậy, Ngài vẫn ban phước lành cho chúng ta, và đôi khi, một cách đầy ngẫu hứng, Ngài lại rủ lòng thương ban phát thêm cho chúng ta những giọt năng lượng quý giá.\n\nCác nhà ngoại cảm của chúng ta giờ đây ngày càng đồng điệu với Thượng đế, và được khích lệ bởi điều này, chúng ta dự định sẽ xây dựng một đài kỷ niệm để tôn vinh dấu ấn của Ngài, nơi các nhà ngoại cảm xuất chúng nhất của chúng ta có thể nỗ lực kết nối với §Y[GetShroudPatron]§!."
 utopia.2671.a:0 "Trong vòng tay của Sợi tơ, chúng ta cảm thấy yên bình hơn bao giờ hết."
 utopia.2671.a.tt:0 "$covenant_composer_telepath_utopia_rank_1_tt$\n\nGiờ đây chúng ta có thể xây dựng một £building£ ['building:building_composer_sanctum'] trên một trong các thuộc địa của mình."
 utopia.2671.b:0 "Cơn đói khát cũng đang bủa vây chúng ta. Chỉ có chiến tranh mới có thể thỏa mãn cơn đói này."
 utopia.2671.b.tt:0 "$covenant_eater_telepath_utopia_rank_1_tt$\n\nGiờ đây chúng ta có thể xây dựng một £building£ ['building:building_eater_sanctum'] trên một trong các thuộc địa của mình."
 utopia.2671.c:0 "Chẳng có gì có thể sánh được với vẻ đẹp của dục vọng."
 utopia.2671.c.tt:0 "$covenant_instrument_telepath_utopia_rank_1_tt$\n\nGiờ đây chúng ta có thể xây dựng một £building£ ['building:building_instrument_sanctum'] trên một trong các thuộc địa của mình."
 utopia.2671.d:0 "Một tâm trí đã đong đầy thì chẳng còn chỗ cho sự chần chừ."
 utopia.2671.d.tt:0 "$covenant_whisperers_telepath_utopia_rank_1_tt$\n\nGiờ đây chúng ta có thể xây dựng một £building£ ['building:building_whisperers_sanctum'] trên một trong các thuộc địa của mình."

 utopia.2676.name:0 "Giải phóng Tiềm năng"
 utopia.2676.desc:0 "Những điều huyền bí của §HHư cảnh§! vẫn luôn là một ẩn số kỳ dị và không thể lý giải đối với chúng ta, nhưng sự đồng điệu giữa chúng ta và §Y[GetShroudPatron]§! ngày càng trở nên hòa hợp hơn. Bất luận đi đến đâu, chúng ta đều có thể cảm nhận được sự hiện diện của nó đằng sau tâm trí, năng lượng của nó xuyên qua những kẽ hở trong tâm hồn để tràn vào thực tại của chúng ta."
 utopia.2676.a:0 "Ý chí của thể xác là một điều thiêng liêng."
 utopia.2676.b:0 "Xung động là một dạng cống hiến."
 utopia.2676.c:0 "Các ngươi nên khao khát."
 utopia.2676.d:0 "Sự kín đáo mới là an toàn."

 utopia.2681.name:0 "Tàn dư Năng lượng"
 utopia.2681.desc:0 "Thượng đế của chúng ta, §H[GetShroudPatron]§!, đã trích ra một phần năng lượng nhỏ từ §HHư cảnh§! để dự phòng. Mối quan hệ mật thiết với Thượng đế cho phép chúng ta hấp thụ nguồn năng lượng này một cách an toàn.\n\nChúng ta đã lựa chọn được một vài ứng cử viên, nhưng chỉ một người duy nhất mới có vinh dự được hấp thụ nguồn sức mạnh này của Thượng đế. Đã đến lúc chúng ta phải đưa ra quyết định."
 utopia.2681.a:0 "§H[leader_1.GetTitle]§! [leader_1.GetName]"
 utopia.2681.b:0 "§H[leader_2.GetTitle]§! [leader_2.GetName]"
 utopia.2681.c:0 "§H[leader_3.GetTitle]§! [leader_3.GetName]"
 utopia.2681.d:0 "§H[leader_4.GetTitle]§! [leader_4.GetName]"

 utopia.2682.name:0 "Thăng hoa"
 utopia.2682.desc.intro:0 "Mọi việc đã hoàn tất. Cùng với dòng sức mạnh được truyền vào [chosen_leader.GetName], những người xung quanh đều có thể [GetFeelLoc] được sức nặng của hiện diện tâm linh này. Nó đầy quyền uy và đòi hỏi sự tôn kính. [chosen_leader.GetHeSheCap] giờ đây sẽ là [GetImmortalLoc] "
 utopia.2682.desc.patron_champion:0 "$utopia.2682.desc.intro$ Người bảo hộ của §H[GetShroudPatron]§!."
 utopia.2682.desc.shroudshaper_champion:0 "$utopia.2682.desc.intro$ $leader_trait_shroudshaper$ của §H[This.GetName]§!."
 utopia.2682.desc.previous_chosen_killed:0 "Sự kiện này đã giáng một đòn chí mạng xuống kẻ dị giáo §H[previous_chosen_leader.GetName]§!, từng được coi là Kẻ Được Chọn của đấng bảo trợ cũ. Tại nơi lưu đày của [previous_chosen_leader.GetHisHer], [previous_chosen_leader.GetHeShe] lặng lẽ trút hơi thở cuối cùng khi những tàn dư quyền năng tâm linh cuối cùng tan biến khỏi thể xác tàn tạ của [previous_chosen_leader.GetHisHer]."
 utopia.2682.desc.previous_chosen_lost_patron:0 "Sự kiện này đã gây ra ảnh hưởng đáng kể đến §H[chosen_leader_lost_patron.GetName]§!. Dù cho [chosen_leader_lost_patron.GetHeShe] vẫn sở hữu nguồn năng lượng tâm linh mạnh mẽ, nhưng lại đánh mất đi sức mạnh được vị chúa tể cũ che chở trong thân xác [chosen_leader_lost_patron.GetHimHer]."
 utopia.2682.a:0 "Họ chính là những kẻ được chọn."
 utopia.2682.a.shroudshaper:0 "Đây là vận mệnh đã an bài của [chosen_leader.GetHisHer]."

 utopia.2686.name:0 "Vũ khí Được Ban phước"
 utopia.2686.desc:0 "Hội đồng ngoại cảm mật đã đạt được tiến bộ mang tính đột phá trong việc nghiên cứu cách thức tận dụng sức mạnh của Thượng đế §H[GetShroudPatron]§!. Trước đây, chỉ có những cá nhân khơi dậy được năng lực tâm linh mới có khả năng thấu hiểu trọn vẹn ý nghĩa của khế ước. Tuy nhiên, chúng ta đã phát minh ra một phương pháp cho phép nguồn sức mạnh này chảy xuyên qua toàn bộ chiến hạm, vươn tới một tầm cao chưa từng có.\n\nChỉ cần chúng ta muốn, sức mạnh của §H[GetShroudPatron]§! sẽ thúc đẩy hạm đội của chúng ta tiến xa hơn bao giờ hết."
 utopia.2686.a:0 "Nếu không có xác thịt, làm sao tạo nên thân tàu?"
 utopia.2686.b:0 "Chiến hạm của chúng ta cũng đang đói khát."
 utopia.2686.c:0 "Những chiến hạm này đang khao khát mục tiêu."
 utopia.2686.d:0 "Bí mật chính là thứ vũ khí vô địch."

 building_composer_sanctum:0 "Thánh sở Sợi tơ"
 building_composer_sanctum_desc:0 "Thánh sở là nơi chuyên dùng để giao tiếp với Sợi tơ Đời sống. [GetComposerSanctumDesc]"
 building_composer_sanctum_desc_default:0 "Tại đây, máu thịt cũng hoang dại và tự do như những ý nghĩ, Hư cảnh sở hữu quyền năng vượt xa khả năng của chúng ta để tái tạo lại chính mình."
 building_composer_sanctum_desc_machine:0 "Tại đây, sự vận hành của mạch điện không bị cản trở bởi các yếu tố vật lý. Hư cảnh có khả năng tối ưu hóa các bộ vi xử lý của chúng ta bằng những phương thức vượt ngoài các thông số truyền thống."
 building_eater_sanctum:0 "Thánh sở Kẻ Nuốt chửng"
 building_eater_sanctum_desc:0 "Thánh sở là nơi chuyên dùng để giao tiếp với Kẻ Nuốt chửng Thế giới. Tại đây, Hư cảnh chuẩn bị cho chúng ta bước vào cuộc chiến kế tiếp, hệt như việc chúng ta chuẩn bị cho [GetEaterSanctumDesc] kế tiếp vậy."
 building_eater_sanctum_desc_machine:0 "cuộc chinh phạt"
 building_eater_sanctum_desc_default:0 "Bữa tiệc máu"
 building_instrument_sanctum:0 "Thánh sở Khí cụ"
 building_instrument_sanctum_desc:0 "Thánh sở là nơi chuyên dùng để giao tiếp với Khí cụ Dục vọng. [GetInstrumentSanctumDesc]"
 building_instrument_sanctum_desc_gestalt:0 "Tại đây, những khát khao dư thừa được tích trữ, thanh lọc và phân bổ lại, nhằm thúc đẩy sự ổn định của tập thể chúng ta."
 building_instrument_sanctum_desc_default:0 "Tại đây, của cải được tích trữ, rồi lại tiêu tán trong cơn cuồng say mua sắm, đưa chúng ta đến gần hơn với sự thỏa mãn tột độ."
 building_whisperers_sanctum:0 "Thánh sở Mật ngữ"
 building_whisperers_sanctum_desc:0 "Thánh sở là nơi chuyên dùng để giao tiếp với Hư không Chi Mật ngữ. [GetWhisperersSanctumDesc]"
 building_whisperers_sanctum_desc_machine:0 "Tại đây, những bí mật được trao đổi một cách đầy bí ẩn, những tri thức mới được niêm phong, và tín hiệu của chúng ta đã hòa vào bản hòa ca."
 building_whisperers_sanctum_desc_default:0 "Tại đây, những bí mật được trao đổi bằng lời thì thầm, những tri thức mới được niêm phong, và tiếng ngâm nga của chúng ta đã hòa vào bản hòa ca."
 covenant_detection_first_contact:0 "$building_whisperers_sanctum$"
 covenant_detection_first_contact_effect:0 "§YCăn cứ Sao§! của chúng ta trong hệ sao này nhận được: §YCường độ Dò tìm§! §G+5§!\n\n"

