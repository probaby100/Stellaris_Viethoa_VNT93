 utopia.3400.name:0 "Đế vương Thiên tuyển"
 utopia.3400.desc:0 "Mặc dù từng là một người [chosen_one_species.GetName] bình thường, nhưng giờ đây đã vượt xa quá khứ, thực thể [GetImmortalLoc] mang tên §H[chosen_one.GetName]§! đã thu hút một lượng lớn tín đồ sùng đạo tại [Root.GetName]. Rất nhiều người đã tôn thờ ông ta như một vị thần tối cao, và chính phủ của chúng ta cũng đã chính thức phong tặng cho ông ta danh hiệu [chosen_one.GetTitle], trở thành vị quân vương vĩnh viễn của đế chế vĩ đại của chúng ta, kể từ giờ phút này cho đến tận mãi về sau."
 utopia.3400.a:0 "Là một nhà ngoại cảm quyền năng thì đúng, nhưng gọi là thần thánh ư? Thật là khó tin."
 utopia.3400.b:0 "Nguyện vương triều của [chosen_one.GetHerHis] trường tồn bất tận... và vươn xa hơn nữa!"
 reject_god_emperor:0 "[chosen_one.GetName] sẽ tiếp tục duy trì tước vị [chosen_one.GetTitle]."
 utopia.3401.name:0 "[chosen_one.GetTitle] Đăng cơ tại [From.Capital.GetName]"
 utopia.3401.desc.intro:0 "Sức mạnh khổng lồ của một [GetPsychicNoun] [chosen_one_species.GetAdj] đã nắm thâu tóm quyền lực tại §H[From.GetName]§!! Những tín đồ của sinh vật"
 utopia.3401.desc.outro:0 "này lén lút gọi [chosen_one.GetHerHis] là \"Kẻ được chọn\", và sáng nay đã chính thức đăng cơ trong một buổi lễ xa hoa tại [From.Capital.GetName]. Sau đó, tất cả các chính phủ giữa các vì sao đều nhận được một bản thông cáo chúc mừng sự thống trị vĩnh hằng của §H[chosen_one.GetRulerTitle] [chosen_one.GetRegnalName]§!."
