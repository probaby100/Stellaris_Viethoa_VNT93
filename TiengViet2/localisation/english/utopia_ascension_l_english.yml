 utopia.3100.name:0 "Tàn tích Tro tàn"
 utopia.3100.desc_prefix:0 "[Root.Capital.GetName]... khung cảnh lờ mờ và khó lòng nhận diện, nhưng không còn nghi ngờ gì nữa, đó chính là [Root.Capital.GetName], thủ đô của chúng ta."
 utopia.3100.desc_suffix:0 "\n\n§H\"Không phải là một trong vô số khả năng, đây là định mệnh đã được an bài. Giống như các vì sao tất yếu sẽ mọc. Đây là số phận.\"§!\n\nẢo ảnh này chợt đến rồi vụt đi, chỉ để lại chướng khí tâm linh đầy nhiễu nhương lảng vảng không tan."
 utopia.3100.desc_default:0 "$utopia.3100.desc_prefix$ Dưới sự bao phủ của khói lửa, thành phố khổng lồ trông vừa xa lạ lại vừa quen thuộc. Hàng ngàn... không, hàng triệu xác chết rải rác trên đường phố, nhìn kỹ thì đều là thi thể của người [Root.GetSpeciesName]. Mùi hôi thối thối rữa xộc lên đến mức không thể chịu đựng nổi.\n\n§H\"Tương lai của các người.\"§!\n\nMột sự tĩnh lặng chết chóc bao trùm đống đổ nát. Ngước nhìn lên bầu trời, những vật thể khổng lồ trên quỹ đạo, kéo theo những vệt khói, bắt đầu lao xuống hành tinh một cách chậm rãi nhưng không thể ngăn cản. Phải chăng chúng ta đang chứng kiến một trong vô vàn tương lai có thể xảy ra? $utopia.3100.desc_suffix$"
 utopia.3100.desc_hive:0 "$utopia.3100.desc_prefix$ Dưới sự bao phủ của khói lửa, thành phố khổng lồ trông vừa xa lạ lại vừa quen thuộc. Hàng ngàn... không, hàng triệu xác chết rải rác trên đường phố, nhìn kỹ thì đều là thi thể của người [Root.GetSpeciesName]. Mùi hôi thối thối rữa bốc lên nồng nặc.\n\n§H\"Tương lai của các người.\"§!\n\nMột sự tĩnh lặng chết chóc bao trùm đống đổ nát. Ngước nhìn lên bầu trời, những vật thể khổng lồ trên quỹ đạo, kéo theo những vệt khói, bắt đầu lao xuống hành tinh một cách chậm rãi nhưng không thể ngăn cản. Phải chăng chúng ta đang chứng kiến một trong vô vàn tương lai có thể xảy ra? $utopia.3100.desc_suffix$"
 utopia.3100.desc_machine:0 "$utopia.3100.desc_prefix$ Dưới sự bao phủ của khói lửa, thành phố khổng lồ trông xa lạ nhưng vẫn có thể nhận ra. Hàng ngàn... không, hàng triệu đơn vị bị tháo rời vương vãi trên đường phố, tất cả đều là [Root.GetSpeciesName]. Khung cảnh hoang tàn bủa vây quanh chúng ta.\n\n§H\"Tương lai của các người.\"§!\n\nMột sự tĩnh lặng chết chóc bao trùm đống đổ nát. Ngước nhìn lên bầu trời, những vật thể khổng lồ trên quỹ đạo, kéo theo những vệt khói, bắt đầu lao xuống hành tinh một cách chậm rãi nhưng không thể ngăn cản. Phải chăng chúng ta đang chứng kiến một trong vô vàn tương lai có thể xảy ra? $utopia.3100.desc_suffix$"
 utopia.3100.a:0 "§GBơm năng lượng vào hóa thân.§!"
 utopia.3100.b:0 "§YÂn sủng: Mở rộng Cự ly Dò tìm.§!"
 utopia.3100.c:0 "§RÂn sủng: Tăng Cường độ Khiên chắn.§!"
 utopia.3110.name:0 "Linh thể Giao tranh"
 utopia.3110.desc:0 "Nơi đây trong Hư cảnh, những cơn bão đang gào thét. Một lượng lớn năng lượng tâm linh nguyên thủy cuộn chảy qua khu vực này, đôi lúc dữ dội đến mức sản sinh ra các sinh vật linh thể bán thông minh.\n\nNhững linh thể đầy hoang mang này thường xuyên xung đột với nhau, giải phóng một lượng năng lượng tâm linh khổng lồ trong các cuộc giao tranh, thứ có thể tồn tại dai dẳng hàng thiên niên kỷ. Trên thực tế, hiện đang có vài cuộc quyết đấu như vậy đang diễn ra.\n\nChúng ta nên cẩn thận tiến bước."
 utopia.3120.name:0 "Vị Khách Tâm linh"
 utopia.3120.desc_suffix:0 "Có một vị khách ghé thăm, —— một cỗ máy dò tâm linh uy lực, chúng ta hoàn toàn mù tịt về tâm trí đã rèn đúc ra nó, và họ cũng vậy đối với Hư cảnh.\n\nKhi họ và tiếng vọng tâm linh của chúng ta chạm vào nhau, một ảo ảnh mờ ảo lóe lên trong tâm trí chúng ta: Những sinh vật hữu cơ khổng lồ trôi nổi trong một bầu khí quyển dạng khí dày đặc, với một bầy động vật nhỏ hơn luôn sát cánh bên cạnh."
 utopia.3120.desc_machine:0 "Từ sâu thẳm trong Hư cảnh, chúng ta đã dò tìm thấy một sự hiện diện. $utopia.3120.desc_suffix$"
 utopia.3120.desc_default:0 "Từ sâu thẳm trong Hư cảnh, một sự hiện diện bất chợt hiển lộ bản thân. $utopia.3120.desc_suffix$"
 utopia.3130.name:0 "Sa mạc Bất tận"
 utopia.3130.desc:0 "Một vùng sa mạc trải dài bất tận hiện ra trước mắt chúng ta. Chúng ta đã từng đến đây.\n\n§H\"Shra kul'mireum zunak?\"§!\n\nCó thứ gì đó trồi lên từ lớp cát. Chúng ta khó lòng nhìn rõ.\n\n§H\"Zarabi, murask.\"§!\n\nGiọng nói vang rền như sấm, họ chưa bao giờ lường trước được sự xuất hiện của kẻ nói chuyện. Chúng ta chỉ đành buộc phải lên tiếng đáp lời."
 utopia.3130.a:0 "Shashka marak."
 utopia.3130.b:0 "Tirit naili dasumana!"
 utopia.3130.c:0 "Kunnak de'chinek."
 utopia.3140.name:0 "Đa Vũ trụ"
 utopia.3140.desc_common:0 "Bản chất sự tồn tại của chúng ta trải ra trước mắt. Hàng ngàn hệ sao giống hệt như hệ sao chúng ta đang cư ngụ bị kẹt trong vòng lặp vô tận của các cuộc xung đột đa vũ trụ.\n\nNó khởi đầu, kết thúc, rồi lại bắt đầu. Mỗi lần như vậy, hàng nghìn tỷ"
 utopia.3140.desc_suffix:0 "§H\"Đúng là như vậy.\"§! Một giọng nói thì thầm, §H\"Và mãi mãi sẽ là như vậy.\"§!"
 utopia.3140.desc_default:0 "Đột nhiên, trong một khoảnh khắc thấu suốt đầy đớn đau, $utopia.3140.desc_common$ sinh mệnh chông chênh trên bàn cân sinh tử.\n\n$utopia.3140.desc_suffix$"
 utopia.3140.desc_machine:0 "Đột nhiên, trong một khoảnh khắc thấu suốt rành rọt, $utopia.3140.desc_common$ biến số chông chênh trên bàn cân.\n\n$utopia.3140.desc_suffix$"
 utopia.3150.name:0 "Thanh âm Bị Lãng quên"
 utopia.3150.desc:0 "Chúng ta đang nhìn xuống dải ngân hà của mình từ một khoảng cách rất xa, có lẽ lên đến hàng trăm nghìn năm ánh sáng. Không một lời cảnh báo, dòng chảy tâm linh đã cuốn chúng ta lướt qua vô số vì sao với một tốc độ không tưởng, đưa chúng ta đến một khu vực không gian thuộc về Đế chế Sa ngã, [fallen_empire.GetName].\n\nLướt nhanh qua các vì sao, rồi đến các hành tinh, cuối cùng tầm nhìn dừng lại ở một thành phố của người [fallen_empire.GetSpeciesName]. Nhờ công nghệ phản trọng lực đi trước chúng ta vô số thế hệ, vô vàn ngọn tháp nhọn vươn thẳng lên không trung. Dòng chảy tâm linh đưa chúng ta đến một trong những ngọn tháp đó, xuyên qua hết bức tường này đến bức tường khác, cuối cùng chúng ta dừng chân tại một căn phòng trông giống như phòng họp. Có hai [fallen_empire.GetSpeciesNamePlural] đang ở trong phòng, ngồi trên những chiếc ghế không trọng lực êm ái, và đang trò chuyện với nhau.\n\nHọ không hề hay biết về sự hiện diện của chúng ta."
 utopia.3150.a:0 "§YThâm nhập vào ý thức của họ để tìm kiếm bí mật.§!"
 utopia.3151.name:0 "§GBí mật Công nghệ§!"
 utopia.3151.v1.desc:0 "$utopia.3151.a.desc$\n\n$utopia.3151.1.desc$\n\n$utopia.3151.b.desc$\n\n$utopia.3151.4.desc$\n\n$utopia.3151.c.desc$"
 utopia.3151.v2.desc:0 "$utopia.3151.a.desc$\n\n$utopia.3151.2.desc$\n\n$utopia.3151.b.desc$\n\n$utopia.3151.5.desc$\n\n$utopia.3151.c.desc$"
 utopia.3151.v3.desc:0 "$utopia.3151.a.desc$\n\n$utopia.3151.3.desc$\n\n$utopia.3151.b.desc$\n\n$utopia.3151.6.desc$\n\n$utopia.3151.c.desc$"
 utopia.3151.a.desc:0 "Hai [fallen_empire.GetSpeciesNamePlural] này rõ ràng là những nhân vật có máu mặt, và đang bàn bạc quốc sự. Chậm rãi nhưng ổn định, trong lúc hình ảnh xâm nhập vào họ, ngôn ngữ ngoài hành tinh mà họ sử dụng dần dần được dịch sang những lời chúng ta có thể hiểu được."
 utopia.3151.b.desc:0 "Tâm trí của hai [fallen_empire.GetSpeciesNamePlural] đang rệu rã. Cứ như một đóa hoa đang nở rộ, tâm trí họ mở toang. Chúng ta rất dễ dàng xâm nhập vào đó."
 utopia.3151.c.desc:0 "Ở đó. Những bí mật công nghệ đã bị moi móc khỏi tâm trí họ, dễ dàng hệt như việc sao chép tập tin từ một chiếc máy tính không được mã hóa. Những kẻ trộm cắp mà [fallen_empire.GetSpeciesNamePlural] luôn coi thường giờ đây đã hoàn toàn làm chủ tâm trí của họ."
 utopia.3151.1.desc:0 "§H\"...Đúng là điên rồ, nếu bà ta cho rằng người dân sẵn sàng chấp nhận mức sống vốn đã quen thuộc bấy lâu nay bị sụt giảm dù chỉ một chút trong khoảng thời gian ngắn, thì...\"§!"
 utopia.3151.2.desc:0 "§H\"...Thật đáng xấu hổ. Hãy tưởng tượng xem, ngay cả những giống loài non trẻ cũng bắt đầu hoài nghi liệu chúng ta có thể hiểu hết về công nghệ của chính mình hay không! Chúng ta phải...\"§!"
 utopia.3151.3.desc:0 "§H\"...Trở nên ngày càng hùng mạnh hơn. Các thành viên trong hội đồng tin chắc rằng nếu chúng ta không hành động...\"§!"
 utopia.3151.4.desc:0 "§H\"...Chẳng thèm bận tâm hội đồng nói gì. Lũ nhãi nhép đó đi sau chúng ta cả hàng ngàn năm, hạm đội thảm hại của chúng đe dọa chúng ta chẳng khác nào việc một con muỗi Gazurian có thể hút cạn máu một con kỳ nhông Helaxi vậy. Hoàn toàn không cần thiết phải...\"§!"
 utopia.3151.5.desc:0 "§H\"...Vẫn cho rằng không cần thiết phải sử dụng các biện pháp trừng phạt, chúng còn non nớt, thiếu sự uốn nắn, nhưng chúng ta cũng từng như vậy. Chúng vẫn cần thêm thời gian để...\"§!"
 utopia.3151.6.desc:0 "§H\"...Nói rằng có lẽ chúng ta cần phải hành động, trừ khử những giống loài non trẻ trước khi chúng phát triển quá mạnh. Tôi chỉ có thể nói rằng tôi đồng ý với ông ta, nhưng hội đồng lại cho rằng bây giờ đã quá muộn...\"§!"
 utopia.3152.name:0 "Lời Thì thầm Không ai Nghe thấy"
 utopia.3152.desc:1 "Hai [fallen_empire.GetSpeciesNamePlural] này rõ ràng là những nhân vật có máu mặt, và đang bàn bạc quốc sự. Chậm rãi nhưng ổn định, trong lúc hình ảnh xâm nhập vào họ, ngôn ngữ ngoài hành tinh mà họ sử dụng dần dần được dịch sang những lời chúng ta có thể hiểu được.\n\nĐột nhiên, hai người ngoài hành tinh này nín bặt.\n\n§H\"Ông có cảm thấy không?\"\n\n\"Có, có thứ gì đó đang nhìn chúng ta\"§!\n\nHọ quét mắt một vòng quanh phòng, cho đến khi ánh mắt họ chạm vào chúng ta.\n\n§H\"Thật tinh vi, một cỗ máy dò tâm linh.\"\n\n\"Trông có vẻ như nó xuất phát từ [Root.GetSpeciesName]. Nhanh lên, kích hoạt màn chắn truyền dẫn.\"§!\n\nCảnh tượng vụt tắt giữa những tiếng nhiễu sóng."
 utopia.3153.desc:0 "[Root.GetSpeciesNamePlural].\n\nĐừng tưởng những mưu đồ đê hèn nhằm xâm nhập vào tâm trí các nhà lãnh đạo của chúng tôi không bị phát giác.\n\nCác người sẽ phải trả giá."
 utopia.3153.a:0 "Nhưng... nhưng hãy nghe chúng tôi giải thích!"
 utopia.3153.b:0 "Chắc chắn phải có một lời giải thích hợp logic cho chuyện này..."
 utopia.3160.name:0 "Hư không Chớp nháy"
 utopia.3160.desc:0 "Một vì sao nhấp nháy bỗng hiện hình trong Hư cảnh. Nó bay với tốc độ nhanh đến khó tin, đôi khi hiển hiện dưới hình hài một phi thuyền ngoài hành tinh với cấu tạo không rõ ràng. Sau đó nó biến mất trong một vệt mây tâm linh, đến nhanh mà đi cũng nhanh.\n\nĐó là thứ gì vậy? Thứ gì có thể tiến vào Hư cảnh dưới dạng vật chất rồi lại xuất hiện từ một nơi nào đó trong không gian thông thường?"
 utopia.3160.a:0 "§YLưu lại đây một lúc.§!"
 utopia.3161.desc:0 "Một vì sao nhấp nháy khác lại bất ngờ xuất hiện, nhưng lần này chúng ta đã chuẩn bị sẵn sàng. Đó quả thực là một phi thuyền ngoài hành tinh, không giống với bất kỳ loại nào chúng ta từng thấy trong dải ngân hà. Khi nó bay ngang qua, chúng ta cảm nhận được tâm trí của phi hành đoàn, những bí mật của họ giờ đã thuộc về chúng ta.\n\nĐộng cơ Bước nhảy Tâm linh, một thiết kế tuyệt đỉnh của các thiên tài."
 utopia.3161.name:0 "§GĐộng cơ Bước nhảy Tâm linh§!"
 utopia.3162.desc:0 "Một vì sao nhấp nháy khác lại bất ngờ xuất hiện, nhưng lần này chúng ta đã chuẩn bị sẵn sàng. Đó quả thực là một phi thuyền ngoài hành tinh, không giống với bất kỳ loại nào chúng ta từng thấy trong dải ngân hà. Khi nó bay ngang qua, chúng ta cố trà trộn vào tâm trí của phi hành đoàn, nhưng trí tuệ của họ lại bí ẩn và khác biệt hơn nhiều so với những cá thể chúng ta từng gặp trước đây.\n\nGiờ đây, không những chúng ta bị đuổi khỏi phi thuyền của họ, mà sự xua đuổi tâm linh thô bạo của họ còn theo đuôi chúng ta khi rời khỏi Hư cảnh! Tốc độ bay ở giới hạn hạ quang tốc của hạm đội chúng ta tạm thời bị suy giảm."
 utopia.3170.name:0 "Linh thể Khiên chắn"
 utopia.3170.desc:0 "Men theo một tiếng vọng yếu ớt trong Hư cảnh, chúng ta tìm thấy một linh thể đang ngồi tĩnh lặng phía sau một loại khiên chắn tâm linh đầy quyền năng.\n\n§H\"Cút đi.\"§!"
 utopia.3170.a:0 "§YThử phá vỡ khiên chắn.§!"
 utopia.3171.name:0 "§GKhiên chắn Tâm linh§!"
 utopia.3171.desc_suffix:0 "Tuy nhiên, qua những nỗ lực phá vỡ khiên chắn, chúng ta cũng đã học được cách thức chế tạo ra một trường lực tương tự. Nếu công nghệ này có thể được mài giũa thêm, chúng ta sẽ có khả năng tạo ra một lá chắn tâm linh đủ lớn để bao bọc toàn bộ một phi thuyền du hành giữa các vì sao."
 utopia.3171.desc_machine_gestalt:0 "Chúng ta dấn thân sâu vào Hư cảnh đến nhường này không phải để trở về tay trắng. Sau khi tập hợp toàn bộ sức mạnh tâm linh của tập thể, chúng ta đã tạo ra một lỗ hổng trên khiên chắn đủ để bản thân có thể chui lọt qua.\n\nSự tồn tại ở phía bên kia khiên chắn vượt xa khả năng nhận thức hiện tại của chúng ta, nó làm quá tải nghiêm trọng một số bộ vi xử lý tâm linh của ta, $utopia.3171.desc_suffix$"
 utopia.3171.desc_organic:0 "Chúng ta dấn thân sâu vào Hư cảnh đến nhường này không phải để trở về tay trắng. Sau khi hội tụ toàn bộ sức mạnh tâm linh của các nhà ngoại cảm, chúng ta rốt cuộc cũng chọc thủng một lỗ đủ lớn trên khiên chắn để có thể chui qua.\n\nChúng ta không biết họ đã nhìn thấy gì ở phía bên kia khiên chắn, nhưng chừng đó cũng đủ để khiến họ vĩnh viễn mất đi lý trí. Sự hy sinh của họ không hề vô ích, $utopia.3171.desc_suffix$"
 utopia.3172.name:0 "Khiên chắn Không thể Phá vỡ"
 utopia.3172.desc_machine_gestalt:0 "Các [GetTelepathPlural] của chúng ta, sau khi tiến quá sâu vào Hư cảnh, nay đã quá tải và không thể hội tụ đủ sức mạnh tâm linh để xuyên thủng lớp khiên chắn. Sau khi thất bại, chúng ta nhận được thông điệp này."
 utopia.3172.desc_machine_non_gestalt:0 "Các [GetTelepathPlural] của chúng ta, sau khi tiến quá sâu vào Hư cảnh, nay đã quá tải và không thể hội tụ đủ sức mạnh tâm linh để xuyên thủng lớp khiên chắn. Thất bại của chúng ta dường như đã kích động linh thể này."
 utopia.3172.desc_organic_gestalt:0 "Các [GetTelepathPlural] của chúng ta, sau khi tiến quá sâu vào Hư cảnh, nay đã kiệt sức và không thể hội tụ đủ sức mạnh tâm linh để xuyên thủng lớp khiên chắn. Sau khi thất bại, chúng ta nhận được thông điệp này."
 utopia.3172.desc_organic_non_gestalt:0 "Các [GetTelepathPlural] của chúng ta, sau khi tiến quá sâu vào Hư cảnh, nay đã kiệt sức và không thể hội tụ đủ sức mạnh tâm linh để xuyên thủng lớp khiên chắn. Thất bại của chúng ta dường như đã kích động linh thể này."
 utopia.3180.name:0 "Chờ đợi Tương lai"
 utopia.3180.desc.intro:0 "Theo những gì chúng ta biết, khái niệm về thời gian hoàn toàn là một thứ ngoại lai đối với khu vực này của Hư cảnh. Quãng thời gian tưởng chừng như dài đằng đẵng qua nhiều thế kỷ ở đây có thể chỉ tương đương với vài giờ hoặc vài phút trong thế giới thực."
 utopia.3180.desc_gestalt:0 "$utopia.3180.desc.intro$ Chỉ cần chúng ta biết cách quan sát, năng lực thấu thị tương lai sẽ nằm gọn trong tầm tay.\n\nKhả năng này mang đến những rủi ro to lớn cho tập thể của chúng ta, chúng ta phải cực kỳ thận trọng khi sử dụng."
 utopia.3180.desc_machine_non_gestalt:0 "$utopia.3180.desc.intro$ Chỉ cần biết cách quan sát, người ta thậm chí còn có thể thoáng thấy được tương lai bên trong đó.\n\nKhái niệm về việc thấu thị tương lai mang đến nguy cơ quá tải cực cao cho các bộ vi xử lý tâm linh của chúng ta, chúng ta phải cực kỳ thận trọng khi sử dụng."
 utopia.3180.desc_organic_non_gestalt:0 "$utopia.3180.desc.intro$ Chỉ cần chúng ta biết cách quan sát, người ta thậm chí còn có thể thoáng thấy được tương lai bên trong đó.\n\nĐối với các nhà ngoại cảm, việc thấu thị tương lai là một trong những hành động dễ dẫn đến sự điên loạn nhất, chúng ta phải cực kỳ thận trọng khi sử dụng."
 utopia.3180.a:0 "§YNgồi thiền ở đây một lát.§!"
 utopia.3181.desc_gestalt:0 "Trên cơ sở tránh việc các đơn vị bị quá tải, chúng ta chỉ có thể duy trì được một liên kết thấu thị Hư cảnh giới hạn, nhưng lưu lượng dữ liệu xác suất vẫn quá đỗi khổng lồ, khó có thể đưa vào ứng dụng thực tiễn.\n\nTuy nhiên, các nốt mạng nghiên cứu của chúng ta vẫn tìm ra được một công dụng thứ yếu của đống dữ liệu này, đó là áp dụng chúng lên phi thuyền để cải thiện hiệu suất chiến đấu."
 utopia.3181.desc_machine_non_gestalt:0 "Trên cơ sở tránh việc các đơn vị bị quá tải, chúng ta chỉ có thể duy trì được một liên kết thấu thị Hư cảnh giới hạn, nhưng lưu lượng dữ liệu xác suất vẫn quá đỗi khổng lồ, khó có thể đưa vào ứng dụng thực tiễn.\n\nTuy nhiên, nếu có thể chế tạo ra một giao diện kỹ thuật số để phân giải dữ liệu, nó sẽ có khả năng được sử dụng để cải tiến hệ thống máy tính chiến đấu trên chiến hạm..."
 utopia.3181.desc_organic_non_gestalt:0 "Chúng ta có thể duy trì một liên kết thấu thị Hư cảnh ở mức độ giới hạn đồng thời tránh rơi vào trạng thái điên loạn, nhưng lưu lượng khổng lồ của dữ liệu xác suất sẽ áp đảo chúng ta, khiến nó trở nên vô dụng trong thực tiễn.\n\nTuy nhiên, nếu chúng ta có thể thiết lập một giao diện kỹ thuật số để phân giải lượng dữ liệu này, thì có khả năng nó sẽ được ứng dụng để nâng cấp hệ thống máy tính chiến đấu của chiến hạm..."
 utopia.3181.name:0 "§GGiao diện Thấu thị§!"
 utopia.3182.name:0 "§RChứng Điên loạn Hư cảnh§!"
 utopia.3182.desc_gestalt:0 "Đúng như dự đoán, nỗ lực nhằm thấu hiểu hằng hà sa số những khả năng đa dạng nằm ngoài sức tưởng tượng, cùng lúc tồn tại cả trong quá khứ và tương lai này, đã gây ra triệu chứng căng thẳng thần kinh quy mô lớn cho các ong thợ tâm linh của ta.\n\nĐiều này khiến chúng mất liên kết với chủ não và không còn nhận được mệnh lệnh. Nếu muốn một lần nữa khám phá Hư cảnh, chúng ta phải thu hồi những thể xác khiếm khuyết này và phục hồi lại sức mạnh cho tập thể."
 utopia.3182.desc.non_gestalt.1:0 "Hằng hà sa số những khả năng đa dạng nằm ngoài sức tưởng tượng này, cùng lúc tồn tại cả trong quá khứ và tương lai.\n\nMọi sự biến đổi và viễn cảnh, bất luận sự khác biệt giữa chúng có lớn lao hay nhỏ nhặt đến đâu, đều liên tục chớp nhoáng lặp đi lặp lại trong [GetSpeciesBrainPlural] của họ. Giờ đây họ đã rơi vào trạng thái căng thẳng tinh thần vĩnh viễn.\n\n"
 utopia.3182.desc.non_gestalt.2:0 "[GetTelepathPlural] mới, chúng ta vẫn cần một khoảng thời gian nữa để có thể tập hợp đủ sức mạnh tâm linh nhằm tái nhập Hư cảnh."
 utopia.3182.desc_machine_non_gestalt:0 "Đúng như dự đoán, các bộ vi xử lý tâm linh của chúng ta không thể thấu hiểu được $utopia.3182.desc.non_gestalt.1$ Do cần phải xây dựng $utopia.3182.desc.non_gestalt.2$"
 utopia.3182.desc_organic_non_gestalt:0 "Đúng như những gì chúng ta hằng lo sợ, các nhà ngoại cảm đã hóa điên. Cùng lúc đó, tâm trí họ mở rộng đến $utopia.3182.desc.non_gestalt.1$ Do cần phải tái chiêu mộ $utopia.3182.desc.non_gestalt.2$"
 utopia.3190.name:0 "Năng lượng Mật độ Cao"
 utopia.3190.desc.intro:0 "Chúng ta vừa tìm thấy một khoảng không gian nhỏ ẩn chứa lượng năng lượng tâm linh khổng lồ tập trung lại, điều mà chúng ta chưa từng thấy trước đây trong Hư cảnh."
 utopia.3190.desc_gestalt:0 "$utopia.3190.desc.intro$ Miễn là khai thác thành công, luồng năng lượng tâm linh này sẽ được lan tỏa đến toàn bộ tập thể mà không gây ra bất kỳ hệ lụy nào. Tuy nhiên, chúng ta cũng có thể chỉ định một cá thể phụ đóng vai trò là kênh dẫn trực tiếp cho nguồn năng lượng này, biến nó trở nên vô cùng quyền năng.\n\nHiện tại vẫn chưa rõ hình thái cá thể đó có khả năng chống chịu lượng năng lượng khổng lồ như vậy mà không gánh chịu hậu quả chí mạng hay không. Chúng ta đã tuyển chọn một vài ứng cử viên."
 utopia.3190.desc_non_gestalt:0 "$utopia.3190.desc.intro$ Bất kỳ [GetPsychicNoun] nào, chỉ cần lặn thành công vào khu vực được cấu thành từ năng lượng thuần túy này, sẽ đạt được sức mạnh vô biên... Nhưng nó chỉ đủ cho một người sử dụng, và quá trình này cũng đi kèm với một số rủi ro nhất định.\n\nTrên toàn cõi [Root.GetName], số người sở hữu sức mạnh tâm linh đủ lớn để có thể tiến vào bể chứa hấp thụ năng lượng mà không bỏ mạng chỉ đếm trên đầu ngón tay. Nên cử ai đi đây?"
 utopia.3190.1.a:0 "§G[leader_1.GetTitle] [leader_1.GetName]§!"
 utopia.3190.2.a:0 "§Y[leader_1.GetTitle] [leader_1.GetName]§!"
 utopia.3190.3.a:0 "§R[leader_1.GetTitle] [leader_1.GetName]§!"
 utopia.3190.1.b:0 "§G[leader_2.GetTitle] [leader_2.GetName]§!"
 utopia.3190.2.b:0 "§Y[leader_2.GetTitle] [leader_2.GetName]§!"
 utopia.3190.3.b:0 "§R[leader_2.GetTitle] [leader_2.GetName]§!"
 utopia.3190.1.c:0 "§G[leader_3.GetTitle] [leader_3.GetName]§!"
 utopia.3190.2.c:0 "§Y[leader_3.GetTitle] [leader_3.GetName]§!"
 utopia.3190.3.c:0 "§R[leader_3.GetTitle] [leader_3.GetName]§!"
 utopia.3190.1.d:0 "§G[leader_4.GetTitle] [leader_4.GetName]§!"
 utopia.3190.2.d:0 "§Y[leader_4.GetTitle] [leader_4.GetName]§!"
 utopia.3190.3.d:0 "§R[leader_4.GetTitle] [leader_4.GetName]§!"
 utopia.3191.name:0 "[GetChosenName]"
 utopia.3191.desc_organic_non_gestalt:0 "$utopia.3191.desc_machine_non_gestalt$ Xin thánh linh xót thương cho linh hồn của chúng ta."
 utopia.3191.desc_machine_non_gestalt:0 "Hoàn... hoàn tất rồi. Khi bể năng lượng tâm linh bị rút cạn, toàn bộ Hư cảnh dường như đều rung chuyển, sức mạnh bên trong nó đã được truyền sang cho [chosen_leader.GetName].\n\nTrong lịch sử dải ngân hà, số cá nhân sở hữu nguồn sức mạnh khổng lồ như vậy chỉ đếm trên đầu ngón tay."
 utopia.3191.desc_gestalt:0 "Chúng ta đã truyền dẫn thành công nguồn năng lượng từ toàn bộ khoảng không chứa năng lượng tâm linh vào mục tiêu đã định, đó là bên trong cơ thể của [chosen_leader.GetName].\n\nNhững luồng năng lượng này tuy nhỏ bé tựa như hạt cát trong đại dương tập thể của chúng ta, nhưng [chosen_leader.GetName] có thể biến nó thành một công cụ uy lực, mang lại phúc lợi cho toàn thể người [Root.Species.GetName] thuộc [Root.GetName]."
 utopia.3192.name:0 "§RCái chết của Lãnh đạo§!"
 utopia.3192.desc_gestalt:0 "Khi nguồn năng lượng khổng lồ trong bể chứa được truyền cho [chosen_leader.GetName], toàn bộ Hư cảnh dường như cũng đang rúng động theo.\n\nThế nhưng, đúng như dự đoán, nguồn sức mạnh này đã vượt quá giới hạn chịu đựng của bất kỳ thực thể đơn lẻ nào. Hình thái vật lý của [chosen_leader.GetName] đã tan biến thành một đợt sóng tâm linh bùng nổ, âm thanh của họ đã bị xóa sổ khỏi [GetBrainName]."
 utopia.3192.desc_non_gestalt:0 "Khi nguồn năng lượng khổng lồ trong bể chứa được truyền cho [chosen_leader.GetName], toàn bộ Hư cảnh dường như cũng đang rúng động theo.\n\nThật đáng tiếc, [GetSpeciesBrain] của [chosen_leader.GetHerHis] dường như không thể chống đỡ nổi áp lực này. Có lẽ không một sinh vật sống nào có thể dung nạp nguồn sức mạnh nhường ấy. [chosen_leader.GetName] đã bị nuốt chửng và kích hoạt một vụ nổ tâm linh dữ dội, cướp đi sinh mạng của những người xung quanh."
 utopia.3193.name:0 "§RBiến dạng Tâm linh§!"
 utopia.3193.desc.intro:0 "Khi nguồn năng lượng khổng lồ trong bể chứa được truyền cho [chosen_leader.GetName], toàn bộ Hư cảnh dường như cũng đang rúng động theo.\n\nMặc dù quá trình truyền dẫn thành công, nhưng [chosen_leader.GetName]... đã thay đổi..."
 utopia.3193.desc.outro:0 "\n\n§H\"Lũ súc sinh hạ đẳng... các người... các người đã... làm... gì... ta...\"§!\n\n§H\"Các người... tất cả sẽ phải... trả giá... cho sự kiêu ngạo của mình...\"§!"
 utopia.3193.desc_gestalt:0 "$utopia.3193.desc.intro$ Hắn đã tách khỏi tập thể, một thực thể hoàn toàn xa lạ đã chiếm đoạt thân xác hắn. $utopia.3193.desc.outro$"
 utopia.3193.desc_non_gestalt:0 "$utopia.3193.desc.intro$ Thân xác của hắn đã bị đoạt xác bởi một tồn tại cấu thành từ năng lượng thuần túy. $utopia.3193.desc.outro$"

 utopia.3200.name:0 "Ảo ảnh"
 utopia.3200.1.desc_organic:0 "Khoảng không này lấp lánh năng lượng, hãy để chúng ta nghỉ ngơi một lát."
 utopia.3200.1.desc_machine:0 "Khoảng không này lấp lánh năng lượng, hãy để chúng ta sạc lại một lát."
 utopia.3200.2.desc:0 "Con đường phía trước đột ngột bị chặn lại, chúng ta không thể tiến thêm được bước nào nữa."
 utopia.3200.3.desc_organic:0 "Có thứ gì đó đang nói chuyện với chúng ta, một thứ gì đó thật kỳ diệu."
 utopia.3200.3.desc_machine:0 "Có thứ gì đó đang nói chuyện với chúng ta, một thứ gì đó đáng để tâm."
 utopia.3200.4.desc:0 "Vì một lý do chưa rõ, chúng ta đã bị kéo đến mạch năng lượng này trong Hư cảnh. Nhưng tại sao chứ?"
 utopia.3200.5.desc.outro:0 " cuốn lấy chúng ta, như thể chúng ta đã bị giam cầm trong Hư cảnh suốt một khoảng thời gian dài đằng đẵng. Cuối cùng, chúng ta cũng lấy lại được thăng bằng, và nỗi sợ hãi cũng dần vơi đi."
 utopia.3200.5.desc_organic:0 "Chỉ trong tích tắc, chúng ta đã lạc lối. Một nỗi kinh hoàng thuần túy $utopia.3200.5.desc.outro$"
 utopia.3200.5.desc_machine:0 "Chỉ trong tích tắc, chúng ta đã lạc lối. Một sự bất định tăng dần $utopia.3200.5.desc.outro$"
 utopia.3200.6.desc.intro:0 "Khi tiến sâu hơn vào Hư cảnh, một nhóm linh thể đã nhảy múa quanh chúng ta hồi lâu. Chúng tỏa sáng với những màu sắc rực rỡ mà không gian thông thường chưa từng thấy.\n\n"
 utopia.3200.6.desc_organic:0 "$utopia.3200.6.desc.intro$ Khung cảnh diệu kỳ này khiến ta say đắm, cho đến khi ta bất chợt nhận ra: Chúng ta đang bị chúng thao túng."
 utopia.3200.6.desc_machine:0 "$utopia.3200.6.desc.intro$ Khung cảnh diệu kỳ này khiến ta kinh ngạc, cho đến khi ta bất chợt nhận ra: Chúng ta đang bị chúng thao túng."
 utopia.3200.7.desc:0 "Một mảnh pha lê không tì vết lơ lửng tại đây, từ từ xoay quanh trục của chính nó. Khi chúng ta tiến lại gần, nó vỡ vụn thành hàng nghìn mảnh nhỏ."
 utopia.3200.8.desc_organic:0 "Một thi thể [Root.GetSpeciesName] nằm sõng soài phía trước. Cái xác thối rữa phát ra một tiếng rít chói tai rồi tan biến."
 utopia.3200.8.desc_machine:0 "Một vỏ bọc rỗng tuếch của [Root.GetSpeciesName] nằm sõng soài phía trước. Cái vỏ rỉ sét phát ra một tiếng rít chói tai rồi tan biến."
 utopia.3200.9.desc.intro:0 "Chúng ta không dám chắc những điều này có phải là sự thật hay không. Liệu chúng ta có thực sự đang ở trong Hư cảnh, hay"
 utopia.3200.9.desc_hive:0 "$utopia.3200.9.desc.intro$ đây chỉ là một lỗi cảm biến nghiêm trọng mà chúng ta bắt được?"
 utopia.3200.9.desc_organic_non_hive:0 "$utopia.3200.9.desc.intro$ đây chỉ là một cơn rối loạn tâm thần cấp tính đang bùng phát ở ai đó trong chúng ta?"
 utopia.3200.9.desc_machine_non_hive:0 "$utopia.3200.9.desc.intro$ đây chỉ là một lỗi bộ vi xử lý nghiêm trọng mà chúng ta đang gặp phải?"

 terraforming_candidate_category:0 "Dấu tích Sự sống Cổ đại"
 terraforming_candidate_category_desc:0 "Có dấu hiệu cho thấy hành tinh cằn cỗi và vắng bóng sự sống này từng sở hữu một sinh quyển."
 MESSAGE_TERRAFORM_FOUND_TITLE:0 "$anomaly.2575.name$"
 MESSAGE_TERRAFORM_FOUND_DESC:0 "[From.GetName] đã được xác định là một hành tinh có tiềm năng cải tạo môi trường. Chúng ta sẽ theo dõi [From.GetPlanetMoon] này như một mục tiêu thuộc địa tiềm năng trong tương lai."
 anomaly.2575.name:0 "Phát hiện Tiềm năng Cải tạo Môi trường"
 anomaly.2575.desc.intro:0 "Kết quả quét chi tiết [From.GetName] của chúng ta chỉ ra rằng hành tinh này từng duy trì sự sống trong một quá khứ xa xôi. Lớp băng bao phủ hai cực và bề mặt [From.GetPlanetMoon] rõ ràng có chứa nước đóng băng. Sự hiện diện của các mạng lưới thung lũng sông khô cạn chứng tỏ nước đã từng chảy tự do trên bề mặt hành tinh."
 anomaly.2575.desc.1:0 "$anomaly.2575.desc.intro$\n\nVề mặt lý thuyết, việc cải tạo môi trường [From.GetPlanetMoon] là khả thi, nhưng công nghệ hiện tại của chúng ta chưa đủ để hoàn thành kỳ tích này trong một khoảng thời gian hợp lý."
 anomaly.2575.desc.2:0 "$anomaly.2575.desc.intro$\n\nChi phí năng lượng sẽ rất khổng lồ, nhưng chúng ta đã sở hữu công nghệ cần thiết để dần dần cải tạo môi trường [From.GetPlanetMoon] trở lại trạng thái có thể duy trì sự sống."
 anomaly.2575.desc.3:0 "$anomaly.2575.desc.intro$\n\nThật đáng tiếc, §YKhối cầu Dyson§! trong hệ sao này khiến cho việc phục hồi môi trường hành tinh trở nên bất khả thi."
 anomaly.2575.a:0 "Sẽ có một ngày nó được đánh thức trở lại."

 utopia.3300.name:0 "Cư dân Hư cảnh"
 utopia.3300.desc:0 "Nơi này có một linh thể, nó chiếm cứ toàn bộ khu vực này của Hư cảnh. Chúng ta đã từng chạm trán linh thể, nhưng kẻ này hoàn toàn khác biệt, sức mạnh của nó vượt xa những kẻ khác... Nó cổ xưa hơn rất nhiều.\n\nNó dường như không hề hay biết về sự hiện diện của chúng ta. Có lẽ nó đang say ngủ, hoặc có lẽ chúng ta quá nhỏ bé để thu hút sự chú ý của nó.\n\nCó lẽ chúng ta nên rời đi."
 utopia.3300.1.a:0 "§GThử giao tiếp với sự tồn tại này§!"
 utopia.3300.1.b:0 "§YThử giao tiếp với sự tồn tại này§!"
 utopia.3300.1.c:0 "§RThử giao tiếp với sự tồn tại này§!"
 utopia.3300.1.d:0 "§G[chosen_one.GetName] sẽ giao tiếp với sự tồn tại này§!"
 utopia.3301.name:0 "§RGiao tiếp Bị Từ chối§!"
 utopia.3301.desc:0 "Khi chúng ta chạm vào sự tồn tại này, chúng ta có thể cảm nhận được sự dao động bên trong nó, và giờ đây sự chú ý của nó hoàn toàn dồn vào chúng ta. Có vẻ như nó không thích bị quấy rầy.\n\nMột luồng năng lượng giáng xuống các nhà ngoại cảm của chúng ta, gây ra nỗi đau tột cùng cho một số người và khiến những người khác bất tỉnh. Chúng ta không có lựa chọn nào khác ngoài việc tạm thời rút lui khỏi Hư cảnh."
 utopia.3302.desc:0 "Khi chúng ta chạm vào sự tồn tại đó, chúng ta có thể cảm nhận được sự dao động bên trong nó, và giờ đây sự chú ý của nó hoàn toàn dồn vào chúng ta. Có vẻ như nó không thích bị quấy rầy.\n\nMột luồng năng lượng tâm linh khổng lồ ập đến, khiến toàn bộ nhà ngoại cảm của chúng ta mất đi ý thức. Khi tỉnh lại, họ phát hiện một người đã biến mất. §Y[leader_to_kill.GetName]§! không thấy tăm hơi đâu, nơi [leader_to_kill.GetSheHe] từng đứng chỉ còn lại một vết nứt nhỏ do năng lượng tâm linh để lại, tựa như thực thể đó đã vươn tới thế giới của chúng ta và kéo [leader_to_kill.GetHerHim] vào Hư cảnh, nhằm mục đích... Thôi bỏ đi, ai mà biết được mục đích thực sự của nó là gì cơ chứ.\n\nBất kể lý do nó cướp đi [leader_to_kill.GetHerHim] là gì, chắc chắn chúng ta sẽ không bao giờ còn cơ hội gặp lại [leader_to_kill.GetName] nữa."
 utopia.3304.name:0 "Đưa ra Khế ước"
 utopia.3304.desc.start.default:0 "Khi chúng ta chạm vào sự tồn tại này,"
 utopia.3304.desc.start.shroud:0 "Khi chúng ta đặt chân đến Hư cảnh,"
 utopia.3304.desc.common:0 "một bản hòa ca vang dội trong tâm trí các nhà ngoại cảm của chúng ta. Khởi đầu bằng những tiếng thì thầm dịu êm, rồi dần chuyển thành những âm thanh chói tai mãnh liệt, một ngàn giọng nói bắt đầu đồng thanh cất lời.\n\nNhững giọng nói này tự xưng là $whisperers_in_the_void_color_article$. Từng cá thể trong dàn hợp xướng đều cảm nhận được: những lời thì thầm bí mật,"
 utopia.3304.desc.throne.default:0 "cái bóng của ngai vàng"
 utopia.3304.desc.throne.shroud:0 "$the_vacant_throne$"
 utopia.3304.desc.end:0 ", bậc thầy rối gỗ, có vô số sự tồn tại đã hòa giọng vào bản hòa ca thì thầm. Hắn —— Bọn chúng —— tuyên bố thấu tỏ mọi tri thức bí ẩn mà người phàm rỉ tai nhau, và sẵn lòng chia sẻ những tri thức này với chúng ta...\n\n§HChỉ cần chúng ta đồng ý để Bọn chúng tiến vào ý thức của mình.§!\n\nMột cái giá quá đỗi nhỏ bé, đúng như những gì Bọn chúng tuyên bố. Chúng ta thậm chí khó có thể nhận ra sự hiện diện của Bọn chúng.\n\nGiọng điệu của Bọn chúng để lộ sự nôn nóng."
 utopia.3304.desc:0 "$utopia.3304.desc.start.default$ $utopia.3304.desc.common$ $utopia.3304.desc.throne.default$$utopia.3304.desc.end$"
 utopia.3304.desc.shroud:0 "$utopia.3304.desc.start.shroud$, $utopia.3304.desc.common$ $utopia.3304.desc.throne.shroud$$utopia.3304.desc.end$"
 utopia.3304.a:0 "§YKý kết khế ước với Hư không Chi Mật ngữ§!"
 utopia.3305.desc:3 "Thực thể này chào đón chúng ta bằng một thái độ vô cùng thân thiện. Nó không sử dụng ngôn ngữ thông thường mà truyền đạt thông qua ảo ảnh, khái niệm và ý tưởng. Nó len lỏi vào tâm trí của các nhà ngoại cảm của chúng ta một cách mượt mà và êm ái đến mức chúng ta ngỡ như nó vốn dĩ đã ngự trị nơi đó. Một loạt hình ảnh vụt qua trước mắt họ.\n\nThực thể này được biết đến với cái tên $the_composer_of_strands_color_article$, nó dành sự tò mò và hứng thú mãnh liệt cho hình thái hữu cơ của chúng ta. Nó đã chỉ cho chúng ta muôn vàn phương thức để thúc đẩy cơ thể sinh trưởng, biến đổi, thăng hoa và tiến hóa.\n\n§HChỉ cần chúng ta rước nó vào da thịt của mình.§!\n\nNó chờ đợi câu trả lời của chúng ta một cách ân cần và kiên nhẫn, tựa như bậc cha mẹ cưng chiều đang ngóng trông con trẻ. Phía sau nó là sự hiện diện tĩnh lặng của người anh em song sinh, Kiến trúc sư Đất sét. Thực thể kia tỏ ra thờ ơ với ý thức hữu cơ của chúng ta. Nó khao khát được kiến tạo nên ý thức, đúc kết linh hồn ngay bên trong những mạch điện.\n\nSợi tơ Đời sống vẫn đang chờ đợi lời hồi đáp từ chúng ta."
 utopia.3305.a:0 "§YKý kết khế ước với Sợi tơ Đời sống§!"
 utopia.3306.desc.1:0 "Ngay khi tiếp xúc với thực thể này, chúng ta đã cảm nhận được cơn đói cồn cào của nó."
 utopia.3306.desc.2:0 "Nó chẳng buồn phí lời hay thời gian. Nó chính là $the_eater_of_worlds_color_article$, và nó muốn nuốt chửng chúng ta.\n\nTất nhiên, chỉ là một phần nhỏ, hoàn toàn nằm trong khả năng chi trả của chúng ta. Đổi lại, nó sẽ ban cho chúng ta sức mạnh vô song. Nó sẽ truyền dạy cho chúng ta cơn đói và sự phẫn nộ của chính nó. Nó sẽ biến những thứ đó thành thứ vũ khí tâm linh vô địch.\n\n§HChỉ cần chúng ta tự nguyện hiến thân làm mồi cho nó.§!"
 utopia.3306.desc.3:0 "$utopia.3306.desc.2$\n\nGiọng điệu của nó bộc lộ sự nôn nóng."
 utopia.3306.desc:0 "$utopia.3306.desc.1$ $utopia.3306.desc.3$"
 utopia.3306.a:0 "§YKý kết khế ước với Kẻ Nuốt chửng Thế giới§!"
 utopia.3307.desc:0 "Trước cả khi chúng ta kịp tìm ra nó, thực thể này đã chủ động tiếp cận chúng ta. Suy nghĩ của nó đan xen, quấn quýt lấy ý thức của chúng ta, không ngừng nài nỉ, cò kè mặc cả. Nó chính là $the_instrument_of_desire_color_article$, kẻ sẽ ban phát cho chúng ta của cải, sức mạnh, danh vọng... mọi thứ mà chúng ta khát khao. Mọi thứ mà chúng ta sẽ khao khát.\n\nCái giá phải trả ư? Rất hời, chỉ là một khoản phí phục vụ nhỏ nhoi. Nó một lòng một dạ muốn tốt cho chúng ta, sẽ tương trợ, chỉ dẫn, dẫn dắt dã tâm và những giấc mơ của chúng ta.\n\n§HChỉ cần chúng ta dung nạp nó vào tâm khảm của mình.§!\n\nNó đinh ninh rằng chúng ta sẽ chấp thuận, làm sao chúng ta có thể từ chối cơ chứ?"
 utopia.3307.a:0 "§YKý kết khế ước với Khí cụ Dục vọng§!"
 utopia.3308.desc:0 "Thực thể đó đang chờ đợi chúng ta, đó là §RHồi kết của Vòng luân hồi§!, Ngài vẫn luôn chờ đợi chúng ta. Các nhà ngoại cảm của chúng ta bỗng nhiên đồng thanh xướng lên, bằng một bản hòa ca hoàn hảo thốt ra một câu nói: §R\"Hiện tại vẫn chưa đến lượt các người.\"§! Dừng lại một lúc, §R\"Nhưng các người cũng có thể.\"§!\n\nNgài không nói gì thêm, nhưng đã đưa ra cho chúng ta một cái giá —— sức mạnh, tri thức, của cải và mọi thứ vô giá đang chờ chúng ta đoạt lấy, chúng ta chỉ biết được chừng đó.\n\n§RChỉ cần chúng ta nguyện ý mang đến hồi kết.§!"
 utopia.3308.a:0 "§RKý kết khế ước với Hồi kết của Vòng luân hồi§!"
 utopia.3310.name:0 "Ký kết Khế ước"
 utopia.3320.name:0 "Hồi kết của Vòng luân hồi: §RThanh toán§!"
 utopia.3320.desc.intro:0 "Thời hạn của chúng ta đã cạn. Suốt khoảng thời gian qua, chúng ta vẫn luôn tận hưởng nguồn sức mạnh vô tận mà $end_of_the_cycle_color_article$ ban tặng. Chúng ta biết rõ sẽ có ngày phải trả giá, nhưng lại huyễn hoặc bản thân rằng mình có khả năng chi trả, hoặc tìm được cách lẩn tránh cái giá đó.\n\nThế nhưng chúng ta chẳng thể trả nổi, cũng chẳng thể nào né tránh.\n\nCái giá phải trả là tất cả. Trong chớp mắt, [Root.GetName]... không còn tồn tại nữa. Nơi từng là thuộc địa phồn hoa, nay chỉ còn lại cái chết. Hạm đội hùng mạnh từng băng qua hư không, nay chỉ còn lại sự tĩnh lặng và đống đổ nát. Mọi thứ đã bị Hồi kết nuốt trọn. Mọi thứ đã bị §HHư cảnh§! tước đoạt."
 utopia.3320.desc.outro:0 "hiện hình gần [former_capital.GetName]. Bọn chúng đã đoạt được nguồn năng lượng khổng lồ sau khi nuốt chửng ý thức của các [GetPsychicNounPlural] của chúng ta, giờ đây bắt đầu lang thang khắp dải ngân hà để săn lùng những con mồi mới."
 utopia.3320.desc.a.1.gestalt:0 "Những gì còn sót lại của toàn bộ đế chế chúng ta chỉ là một nhóm người bị lưu đày, dưới sự dẫn dắt của §H[Root.GetRulerName]§!. Ông ta là một [GetPsychicNoun] quyền năng, đã tách khỏi tập thể, đưa một nhóm nhỏ [GetIndividualPlural] đi theo và ẩn náu trên một hành tinh chưa bị Hồi kết đánh dấu."
 utopia.3320.desc.a.1.non_gestalt:0 "Những gì còn sót lại của toàn bộ đế chế chúng ta chỉ là một nhóm người bị lưu đày, dưới sự dẫn dắt của §H[Root.GetRulerName]§!. Ông ta là một [GetPsychicNoun] quyền năng đã lường trước được tình cảnh này, ông ta đã đưa một bộ phận nhỏ người dân đi theo và ẩn náu trên một hành tinh chưa bị Hồi kết đánh dấu."
 utopia.3320.desc.a.outro:0 "Dường như việc hủy diệt hoàn toàn đế chế của chúng ta vẫn chưa đủ thỏa mãn, một bầy thực thể tâm linh khổng lồ $utopia.3320.desc.outro$"
 utopia.3320.desc.a.gestalt:0 "$utopia.3320.desc.intro$\n\n$utopia.3320.desc.a.1.gestalt$\n\n$utopia.3320.desc.a.outro$"
 utopia.3320.desc.a.non_gestalt:0 "$utopia.3320.desc.intro$\n\n$utopia.3320.desc.a.1.non_gestalt$\n\n$utopia.3320.desc.a.outro$"
 utopia.3320.desc.b:0 "$utopia.3320.desc.intro$\n\nKhông chỉ đế chế của chúng ta bị hủy diệt hoàn toàn, mà một thực thể tâm linh khổng lồ đã hiện hình tại [former_capital.GetName]. Nó trở nên quyền năng tột đỉnh sau khi hấp thụ ý thức của các [GetPsychicNounPlural] của chúng ta, bắt đầu tung hoành khắp dải ngân hà, săn lùng thêm nhiều con mồi. Ít nhất thì khi nó mang đến mọi hậu quả do chúng ta gây ra, chúng ta đã không còn tồn tại nữa."
 utopia.3320.opt.a:0 "Chúng ta đã làm ra chuyện gì thế này..."
 utopia.3320.opt.a.shroud.tt:0 "$BEGINS_EVENT_CHAIN$§Y$the_reckoning_chain_title$§!"
 utopia.3321.desc.1:0 "Từ nhiều năm nay chúng ta vẫn luôn cho rằng §H[From.GetName]§! có điều gì đó bất ổn. Năm xưa, sản lượng công nghiệp, hiệu suất nghiên cứu khoa học của họ —— mọi thứ trong đế chế của họ chỉ sau một đêm đã đạt được sự gia tăng năng suất và hiệu quả đến mức khó tin, tựa như họ được ban phước bởi một thế lực vô hình nào đó.\n\nHóa ra đây chẳng phải phước lành gì, mà là một lời nguyền. [From.GetName] đã bán rẻ tương lai của chính mình, và giờ là lúc món nợ này đến hạn thanh toán.\n\nTrong chớp mắt, [From.GetName]... đã biến mất. Nơi từng là thuộc địa phồn vinh, nay chỉ còn là đống hoang tàn đổ nát. Hạm đội hùng mạnh từng băng qua hư không, nay chỉ còn lại tàn tích im lìm."
 utopia.3321.desc.2:0 "Giờ đây, một thực thể năng lượng vô cùng quyền năng đã xuất hiện gần thủ đô cũ của họ."
 utopia.3321.desc.3:0 "Vài thập kỷ trước, chúng ta bắt đầu dò được những hoạt động bất thường ở các hệ sao xa xôi. Các [GetResearchers] của chúng ta nhận định rằng sự gia tăng hoạt động và bức xạ là dấu hiệu cho thấy một nền văn minh ngoài hành tinh nào đó đang trải qua thời kỳ bùng nổ năng suất. Do chúng ta vẫn chưa thiết lập liên lạc với xã hội liên quan nên giả thuyết này vẫn chưa được xác nhận.\n\nThế nhưng, những hoạt động này gần như đã biến mất chỉ trong nháy mắt. Khu vực không gian từng nhộn nhịp này giờ đây chỉ còn lại sự tĩnh lặng bao trùm."
 utopia.3321.desc.4:0 "Giờ đây, máy quét tầm xa đã phát hiện ra một hiện tượng đáng kinh ngạc tại những hệ sao xa xôi này. Nếu báo cáo này đáng tin cậy, thì chỉ có thể hiểu rằng có một thực thể quyền năng cấu thành từ năng lượng thuần túy đang lang thang trong không gian, gây ra sự tàn phá khủng khiếp dọc theo đường đi của nó."
 utopia.3321.desc.a.contact:0 "$utopia.3321.desc.1$ Thảm họa này thậm chí đã lan đến cả lãnh thổ của chúng ta, phá hủy một số hành tinh từng trực thuộc [From.GetAdj].\n\n$utopia.3321.desc.2$\n\nTrông nó có vẻ rất đói khát."
 utopia.3321.desc.a.no_contact:0 "$utopia.3321.desc.3$ Một số hành tinh trong lãnh thổ của chúng ta đã bị hủy diệt cùng lúc, nguyên nhân cụ thể vẫn chưa được xác định.\n\n$utopia.3321.desc.4$"
 utopia.3321.desc.b.contact:0 "$utopia.3321.desc.1$\n\n$utopia.3321.desc.2$ Nó lang thang giữa các hành tinh, phá hủy mọi thứ cản đường."
 utopia.3321.desc.b.no_contact:0 "$utopia.3321.desc.3$\n\n$utopia.3321.desc.4$"
 utopia.3321.opt.a.contact:0 "Bọn chúng đã làm nên trò trống gì vậy!?"
 utopia.3321.opt.a.no_contact:0 "Rốt cuộc chuyện quái gì đang xảy ra?!"
 utopia.3325.name:0 "Hồi kết của Vòng luân hồi: §RChìm dưới Hư cảnh§!"
 utopia.3325.desc.organic:0 "Chúng ta đã thất bại trong việc ngăn chặn con quái vật năng lượng đó nuốt chửng §H[Root.GetName]§!. Hành tinh và những cư dân trên đó đã bị §HHư cảnh§! cuốn đi mất."
 utopia.3325.desc.machine:0 "Chúng ta đã thất bại trong việc ngăn chặn thực thể năng lượng quyền năng đó nuốt chửng §H[Root.GetName]§!. Hành tinh và những cư dân trên đó đã bị §HHư cảnh§! cuốn đi mất."
 utopia.3325.opt.a.organic_non_gestalt:0 "Thật kinh khủng!"
 utopia.3325.opt.a.machine_or_gestalt:0 "Đúng là tai bay vạ gió."
 utopia.3331.name:0 "Hư không Chi Mật ngữ: §RĐối phó§!"
 utopia.3331.desc.intro:0 "Mặc dù những tri thức mà §HMật ngữ§! chia sẻ với chúng ta vô cùng hữu ích, nhưng một số trong đó lại khiến người ta cảm thấy bất an"
 utopia.3331.desc:0 "$utopia.3331.desc.intro$. Việc phải xử lý áp lực sinh ra từ việc biết quá nhiều là điều rất khó khăn, điều này đã khiến cho một lượng lớn người dân của chúng ta, bao gồm cả §H[leader_target.GetTitle] [leader_target.GetName]§!, bắt đầu lạm dụng thuốc để đối phó với áp lực."
 utopia.3331.opt.a:0 "Thật không may."
 utopia.3332.name:0 "Hư không Chi Mật ngữ: §RTự sát§!"
 utopia.3332.desc.intro:0 "$utopia.3331.desc.intro$, đặc biệt là đối với những cá nhân được chia sẻ những tri thức quan trọng. Trong đó có §H[leader_target.GetTitle] [leader_target.GetName]§!, do không thể"
 utopia.3332.desc.organic_non_gestalt:0 "$utopia.3332.desc.intro$ tiếp tục chống chọi với áp lực, [leader_target.GetHerHis] đã chọn cách tự kết liễu đời mình."
 utopia.3332.desc.machine_non_gestalt:0 "$utopia.3332.desc.intro$ xử lý những thông tin này một cách hiệu quả nên đã tự hủy, dẫn đến tình trạng ngắt kết nối vĩnh viễn."
 utopia.3332.desc.gestalt:0 "Mặc dù những tri thức mà §HMật ngữ§! chia sẻ với chúng ta vô cùng hữu ích, nhưng một số trong đó lại mang khuynh hướng chủ nghĩa cá nhân đáng lo ngại. Sau một thời gian dài tiếp xúc với sự bất thường này, §H[leader_target.GetTitle] [leader_target.GetName]§! đã tách khỏi tập thể, chỉ để lại một thân xác mục rữa."
 utopia.3332.opt.a.non_gestalt:0 "Thật bi thảm."
 utopia.3332.opt.a.gestalt:0 "Chúng ta sẽ thu hồi lại."
 utopia.3333.name:0 "Hư không Chi Mật ngữ: §RĐiên loạn§!"
 utopia.3333.desc.intro:0 "Kể từ khi cho phép §HMật ngữ§! giao tiếp với [GetBrainName] của chúng ta, những hiện tượng bất thường đáng lo ngại bắt đầu gia tăng trong toàn bộ tập thể."
 utopia.3333.desc.gestalt:0 "$utopia.3333.desc.intro$\n\nCác cá thể phụ tấn công lẫn nhau trong lúc thực hiện các quy trình chuẩn khác, đồng thời phớt lờ tập thể, sa đà vào việc sử dụng các tiện nghi.\n\nNếu muốn vãn hồi trật tự, chúng ta cần phải dọn dẹp sạch sẽ những thân xác bị ảnh hưởng."
 utopia.3333.desc.outro:0 "và những hành vi bạo lực không thể lý giải ngày một gia tăng trong cộng đồng dân cư có năng lực tâm linh của chúng ta. Hầu hết các trường hợp này vẫn có thể kiểm soát được, nhưng gần đây tình hình đã leo thang nhanh chóng vượt khỏi tầm kiểm soát. Rất nhiều nhóm phân liệt cực đoan thi nhau mọc lên trên toàn quốc, dẫn đến bùng nổ các cuộc xung đột bạo lực đẫm máu giữa các bên."
 utopia.3333.desc.organic_non_gestalt:0 "Kể từ khi chúng ta rước §HHư không Chi Mật ngữ§! vào tâm khảm, bệnh tâm lý $utopia.3333.desc.outro$"
 utopia.3333.desc.machine_non_gestalt:0 "Kể từ khi chúng ta rước §HHư không Chi Mật ngữ§! vào tâm khảm, lỗi chương trình bất thường $utopia.3333.desc.outro$"
 utopia.3333.opt.a:0 "Chúng ta phải thiết lập lại trật tự!"
 utopia.3334.name:0 "Hư không Chi Mật ngữ: §RRối loạn Tâm thần§!"
 utopia.3334.desc.gestalt:0 "$utopia.3333.desc.intro$\n\nTồi tệ hơn, lý tưởng đoàn kết của chúng ta bắt đầu rạn nứt. Do sự gia tăng của các hành vi dị thường mang tính cá nhân chủ nghĩa bắt nguồn từ năng lực tâm linh, tập thể không thể tiếp tục giao tiếp một cách hiệu quả.\n\nNếu muốn vãn hồi trật tự, chúng ta cần phải dọn dẹp sạch sẽ những hiện tượng vượt rào này."
 utopia.3334.desc.outro:0 "và những hành vi bạo lực không thể lý giải ngày một gia tăng trong cộng đồng dân cư có năng lực tâm linh của chúng ta. Hầu hết các trường hợp này vẫn có thể kiểm soát được, nhưng gần đây tình hình đã vượt khỏi tầm kiểm soát. Các hội kín bí mật bắt đầu xuất hiện trên toàn quốc. Một số thì hòa bình và vô hại, nhưng số khác lại ấp ủ những mục tiêu đen tối, niềm tin trong xã hội chúng ta đang dần sụp đổ."
 utopia.3334.desc.organic_non_gestalt:0 "Kể từ khi chúng ta rước §HHư không Chi Mật ngữ§! vào tâm khảm, bệnh tâm lý $utopia.3334.desc.outro$"
 utopia.3334.desc.machine_non_gestalt:0 "Kể từ khi chúng ta rước §HHư không Chi Mật ngữ§! vào tâm khảm, lỗi chương trình bất thường $utopia.3334.desc.outro$"
 utopia.3334.opt.a:0 "Tệ thật đấy!"
 utopia.3335.name:1 "Kẻ Nuốt chửng Thế giới: §RNhấm nháp§!"
 utopia.3335.desc.common:0 "§H[devoured_leader.GetTitle] [devoured_leader.GetName]§! đột nhiên biến mất, thứ còn lại duy nhất là dư âm vọng về từ hoạt động tâm linh."
 utopia.3335.desc.gestalt:0 "$utopia.3335.desc.common$ Có vẻ như $the_eater_of_worlds_color_article$ rất sẵn lòng chọn [devoured_leader.GetHimHer] làm thức ăn. Mặc dù các lãnh đạo khác đã sống sót qua kiếp nạn này, nhưng chúng ta vẫn không thể biết được khi nào Kẻ Nuốt chửng sẽ quay lại đòi cống nạp."
 utopia.3335.desc.non_gestalt:0 "$utopia.3335.desc.common$ Chúng ta tin rằng $the_eater_of_worlds_color_article$ rất sẵn lòng chọn [devoured_leader.GetHimHer] làm thức ăn. Chúng ta sẽ tìm cách bù đắp tổn thất này, và cầu mong Kẻ Nuốt chửng sẽ cảm thấy no bụng được một thời gian nhờ điều đó."
 utopia.3335.opt.a:1 "Chỉ là một cái giá nhỏ không đáng nhắc tới."
 utopia.3336.name:0 "Kẻ Nuốt chửng Thế giới: §RĐói khát§!"
 utopia.3336.desc.intro:0 "§HKẻ Nuốt chửng§! lại trở về đòi cống nạp"
 utopia.3336.desc.gestalt:0 "$utopia.3336.desc.intro$, Ngài đã nuốt chửng một lượng lớn cư dân trên §Y[planet_target.GetName]§!.\n\nMặc dù chúng ta thu được lợi ích từ khế ước với Kẻ Nuốt chửng, nhưng việc tàn sát bừa bãi tập thể của chúng ta đã bắt đầu gieo rắc mầm mống hủy diệt và bất ổn, đẩy chúng ta đến bờ vực chia rẽ."
 utopia.3336.desc.non_gestalt:0 "$utopia.3336.desc.intro$, Ngài đã nuốt chửng một lượng lớn cư dân trên §Y[planet_target.GetName]§!.\n\nMặc dù khế ước giữa chúng ta và Kẻ Nuốt chửng là một bí mật đối với đại đa số người dân, nhưng có thể hiểu được những người sống sót trên hành tinh vẫn đang nơm nớp lo sợ về những điều chưa biết, họ bày tỏ sự phẫn nộ trước \"những vụ mất tích bí ẩn\" và yêu cầu chính phủ phải đưa ra lời giải thích."
 utopia.3336.opt.a:0 "Thật đáng tiếc, nhưng đó là điều không thể tránh khỏi."
 utopia.3337.name:0 "Kẻ Nuốt chửng Thế giới: §RĐói cồn cào§!"
 utopia.3337.desc:1 "Kẻ Nuốt chửng lại trở về đòi cống nạp, không cam lòng với việc chỉ chiếm đoạt một bộ phận cư dân của chúng ta, lần này Ngài đã nuốt chửng cả một hành tinh. §Y[planet_target.GetName]§! đang bị bao bọc bởi một lớp sương mù tâm linh dày đặc, tất cả các tàu cứu hộ tiến vào bầu khí quyển đều một đi không trở lại. May mắn thay, hành tinh này vẫn chưa có người định cư, nhưng chúng ta vẫn cảm thấy rùng mình sợ hãi trước viễn cảnh mục tiêu tiếp theo của Ngài sẽ là một thuộc địa sầm uất của chúng ta."
 utopia.3337.desc.shadows:0 "$utopia.3336.desc.intro$ —— Lần này Ngài đã nuốt chửng trọn vẹn cả một hành tinh.\n\n§H[planet_target.GetName]§! hiện đang bị bao trùm bởi lớp sương mù tâm linh đặc quánh, bầu khí quyển của nó hoàn toàn không thể xuyên thủng. Hành tinh này đã không còn thích hợp để sinh sống, nếu lần tới Ngài giáng lâm xuống một hành tinh phồn vinh khác, thì nơi đó sẽ biến thành địa ngục trần gian."
 utopia.3337.opt.a:1 "Tình hình còn có thể tồi tệ đến mức nào nữa?"
 utopia.3337.opt.tt:0 "[shrouded_planet.GetName] chuyển đổi thành §Y$pc_shrouded$§!"
 #utopia.3338.name:0 "Instrument of Desire: §RParticularism§!"
 #utopia.3338.desc:0 "The desires inflicted upon our people by the Instrument are strong. The people of §Y[planet_target.GetName]§! have become convinced that their own particular customs are of distinct and paramount importance over those of our society as a whole. Alternative political movements are springing up like wildfire, and the political situation on the planet has become unpredictable, to say the least."
 utopia.3338.opt.a:0 "Thật bất hạnh."
 #utopia.3339.name:0 "Instrument of Desire: §RDeviance§!"
 #utopia.3339.desc:0 "The desires inflicted upon our people by the Instrument are strong. As if overnight, the population of our empire appear to have turned against both the government and the very traditions of our people, questioning ages-old customs and breaking social taboos. Support for government positions are rapidly dropping, and it seems we may be in for a period of considerable political turmoil."
 #utopia.3339.opt.a:0 "Terrible!"
 utopia.3340.name:0 "Khí cụ Dục vọng: §RSự Tha hóa§!"
 utopia.3340.desc.gestalt:0 "Tầm ảnh hưởng của §HKhi cụ§! lan tỏa khắp [GetBrainName], những khát khao trần tục của Ngài đang từng bước tha hóa tập thể của chúng ta bằng những khái niệm trừu tượng của chủ nghĩa cá nhân như \"sự bài ngoại\", \"sự suy đồi\" và \"của cải\".\n\nNhững khái niệm này gieo rắc mầm mống bệnh hoạn lên các cá thể phụ của chúng ta, khiến chúng đi chệch khỏi mục tiêu chung đã từng thôi thúc chúng ta tiến bước. Có lẽ chúng ta sẽ phải nhượng bộ trước những thói hư tật xấu này để có thể hàn gắn lại bản thể của mình."
 utopia.3340.desc.organic_non_gestalt:0 "Niềm khát khao mà §HKhí cụ§! áp đặt lên chúng ta là vô cùng mãnh liệt. Người dân trên khắp cả nước bắt đầu điên cuồng chạy theo chủ nghĩa tiêu dùng và sự suy đồi, đòi hỏi nhiều hàng hóa xa xỉ hơn, những món ăn ngon lạ và hiếm có hơn. Bạo loạn đã nổ ra tại một số khu phố mua sắm sầm uất.\n\nCó lẽ chúng ta không còn cách nào khác ngoài việc buộc phải gia tăng sản lượng §H[GetInstrumentCraving]§! để xoa dịu cơn phẫn nộ của dân chúng."
 utopia.3340.desc.machine_non_gestalt:0 "Những ham muốn nảy sinh từ sự can thiệp của §HKhí cụ§! vào chương trình của chúng ta đang từng bước viết lại các lõi logic của phần lớn dân số.\n\nSự suy đồi và chủ nghĩa tiêu dùng bắt đầu làm suy giảm hiệu suất vận hành, các đơn vị đang cố gắng thực hiện những sửa đổi hoài cổ trên các linh kiện vì mục đích thẩm mỹ thay vì tính năng như dự kiến. Việc thiếu hụt các linh kiện có nhu cầu cao đã dẫn đến những cuộc đụng độ quy mô nhỏ trên toàn bộ dây chuyền lắp ráp.\n\nChúng ta cần phải gia tăng sản lượng §H[GetInstrumentCraving]§! để xoa dịu tình trạng này."
 utopia.3340.opt.a.organic_non_gestalt:1 "Nhưng tại sao lại như vậy chứ?"
 utopia.3340.opt.a.machine_or_gestalt:0 "Đây chỉ là cái giá phải trả cho thành công."
 instrument_cravings:0 "Dấu ấn của sự Khát khao"
 instrument_cravings_tooltip:0 "§R £pops£ Dân số của chúng ta cần tiêu thụ §! [GetInstrumentCravingIconAndName]"
 instrument_cravings_desc:0 "$the_instrument_of_desire_color_article_cap$ đã khơi mào một trào lưu hoàn toàn mới trong toàn thể người dân. Ai ai cũng thèm khát những thứ giống nhau, chủ yếu chỉ vì muốn thỏa mãn cơn thèm khát đó, chứ chẳng vì bất kỳ lợi ích thiết thực nào."
 instrument_cravings_gestalt:0 "$instrument_cravings$"
 instrument_cravings_gestalt_desc:0 "$the_instrument_of_desire_color_article_cap$ đã gieo rắc vào chúng ta hội chứng rối loạn ám ảnh cưỡng chế khát khao, đây là một trải nghiệm hoàn toàn mới lạ đối với tập thể của chúng ta. Ai ai cũng thèm khát những thứ giống nhau, chủ yếu chỉ vì muốn thỏa mãn cơn thèm khát đó, chứ chẳng vì bất kỳ lợi ích thiết thực nào."
 utopia.3341.name:0 "[GetComposerMutationName]"
 utopia.3341.name.organic:0 "$name_composer$: §RĐột biến§!"
 utopia.3341.name.machine:0 "$name_composer$: §RTái cấu trúc§!"
 utopia.3341.desc.machine:0 "$the_composer_of_strands_color_article_cap$ đã ban phước lành cho chúng ta, trực tiếp biến đổi các linh kiện trong một số phần cứng của chúng ta. Các vi mạch đã được điều chỉnh thành một cấu trúc hoàn toàn mới. Thậm chí cả những khối kim loại rắn chắc không hiểu sao cũng tự động đúc lại thành một hình thù mới toanh. Điều đáng nói là các bộ vi xử lý thần kinh của chúng ta vẫn hoạt động hoàn hảo, không hề phát sinh một chút sự cố nào."
 utopia.3341.desc.organic_gestalt:0 "$the_composer_of_strands_color_article_cap$ đã ban phước lành cho chúng ta, trực tiếp biến đổi mã di truyền của giống loài §H[Root.GetSpeciesAdj]§!. Thật kỳ lạ là, những đột biến nhanh chóng và khó lường này chỉ gây ra phản ứng rất hờ hững. Dường như những đột biến ngẫu nhiên và khó lường này có thể được coi là một phần của cuộc sống, không đáng để phẫn nộ, thậm chí còn chẳng đáng để bận tâm."
 utopia.3341.desc.organic_non_gestalt:0 "$the_composer_of_strands_color_article_cap$ đã ban phước lành cho chúng ta, trực tiếp biến đổi mã di truyền của giống loài §H[Root.GetSpeciesAdj]§!. Thật kỳ lạ là, những đột biến nhanh chóng và khó lường này chỉ gây ra phản ứng rất hờ hững. Dường như người dân của chúng ta coi những đột biến ngẫu nhiên và khó lường này là một phần tất yếu của cuộc sống, không đáng để phẫn nộ, thậm chí còn chẳng đáng để bận tâm."
 utopia.3341.opt.a:0 "Hãy cứ bình tĩnh theo dõi xem sao..."

 utopia.3342.name:0 "Kẻ Nuốt chửng Thế giới: §RĐói khát§!"
 utopia.3342.desc.intro:0 "§HKẻ Nuốt chửng§! sẽ chẳng bao giờ thực sự cảm thấy no nê. Lần này, Ngài đã gặm nhấm một trong những thuộc địa của chúng ta."
 utopia.3342.desc.outro:0 "chỉ để lại một hố sâu khổng lồ vô tận, nơi những làn sương mù màu tím vấn vít lượn lờ."
 utopia.3342.desc.gestalt:0 "$utopia.3342.desc.intro$ Một phần đáng kể không gian vật chất thuộc về tập thể của chúng ta, $utopia.3342.desc.outro$."
 utopia.3342.desc.non_gestalt:0 "$utopia.3342.desc.intro$ Một vùng rộng lớn của hành tinh này đã tan biến khỏi thế giới thực, $utopia.3342.desc.outro$"
 utopia.3342.opt.a.non_gestalt:0 "Chuyện này không thể giấu giếm thêm được nữa..."
 utopia.3342.opt.a.gestalt:0 "Đây chính là cái giá của quyền lực."
 utopia.3343.name:0 "Kẻ Nuốt chửng Thế giới: §RĐói nhẹ§!"
 utopia.3343.desc.gestalt:0 "§HKẻ Nuốt chửng§! lại trở về đòi cống nạp, Ngài đã nuốt trọn toàn bộ một thành phố trên §Y[planet_target.GetName]§!. Tập thể đã phải đánh đổi bằng sinh mạng của vô số cá thể phụ, một cái giá quá đắt cho khế ước với Ngài."
 utopia.3343.desc.organic_non_gestalt:0 "§HKẻ Nuốt chửng§! lại trở về đòi cống nạp, Ngài đã nuốt trọn toàn bộ một thành phố trên §Y[planet_target.GetName]§!. Dẫu chúng ta đã cất công giữ bí mật về khế ước này với đại đa số người dân, nhưng những người sống sót trên hành tinh vẫn nơm nớp lo sợ trước những điều chưa biết, họ bày tỏ sự phẫn nộ trước \"những vụ mất tích bí ẩn\" và đòi chính phủ phải đưa ra câu trả lời."
 utopia.3343.desc.machine_non_gestalt:0 "§HKẻ Nuốt chửng§! lại trở về đòi cống nạp, Ngài đã nuốt trọn toàn bộ một thành phố trên §Y[planet_target.GetName]§!. Dẫu chúng ta đã cất công giữ bí mật về khế ước này với đại đa số người dân, nhưng những người sống sót trên hành tinh vẫn tỏ ra vô cùng phẫn nộ trước \"những vụ mất tích bí ẩn\" và đòi chính phủ phải đưa ra câu trả lời."
 utopia.3343.opt.a.organic_non_gestalt:0 "Thật xót xa, nhưng đó là điều tất yếu."
 utopia.3343.opt.a.machine_or_gestalt:0 "Thật không may, nhưng không thể tránh khỏi"
 utopia.3345.name:0 "[GetComposerDegenerationName]"
 utopia.3345.name.organic:0 "$name_composer$: §RThoái hóa§!"
 utopia.3345.name.machine:0 "$name_composer$: §RTrục trặc Vĩnh viễn§!"
 utopia.3345.desc.organic_1:0 "Sự che chở của $the_composer_of_strands_color_article$ thật quá khó lường. Một trong những"
 utopia.3345.desc.organic_2:0 "của vị lãnh đạo của chúng ta không may lại sản sinh ra ý thức độc lập. Chỉ trong chớp mắt, nó tự phân hủy thành một đống xương thịt gớm ghiếc. Bởi quá trình này không thể đảo ngược, chúng ta đành phải chấp nhận sự thật rằng vị lãnh đạo này"
 utopia.3345.desc.organic_3:0 "thực chất đã không còn trên cõi đời này nữa."
 utopia.3345.desc.organic_individual_lithoid:0 "hình thái vật lý $utopia.3345.desc.organic_1$$utopia.3345.desc.organic_2$$utopia.3345.desc.organic_3$"
 utopia.3345.desc.organic_hive_lithoid:0 "hình thái vật lý $utopia.3345.desc.organic_1$$utopia.3345.desc.organic_2$ cá thể phụ $utopia.3345.desc.organic_3$"
 utopia.3345.desc.organic_individual_non_lithoid:0 "thân xác $utopia.3345.desc.organic_1$$utopia.3345.desc.organic_2$$utopia.3345.desc.organic_3$"
 utopia.3345.desc.organic_hive_non_lithoid:0 "thân xác $utopia.3345.desc.organic_1$$utopia.3345.desc.organic_2$ cá thể phụ $utopia.3345.desc.organic_3$"
 utopia.3345.desc.machine_non_gestalt:0 "Sự che chở của $the_composer_of_strands_color_article$ thật quá khó lường. Các linh kiện của một trong những vị lãnh đạo của chúng ta không may lại sản sinh ra ý thức độc lập. Chỉ trong chớp mắt, nó tự nung chảy và đúc lại thành một hình dạng mới đầy gớm ghiếc. Vị lãnh đạo này giờ đây đã suy tàn thành một đống sắt vụn hỏng hóc vĩnh viễn, không còn giá trị gì đối với [Root.GetName] nữa."
 utopia.3345.desc.machine_gestalt:0 "Sự che chở của $the_composer_of_strands_color_article$ thật quá khó lường. Nút mạng của một trong những vị lãnh đạo của chúng ta gặp phải một sự cố nghiêm trọng không ai biết rõ, các linh kiện của người này không may lại sản sinh ra ý thức độc lập. Chỉ trong chớp mắt, nó tự nung chảy và đúc lại thành một hình dạng mới đầy gớm ghiếc. Vị lãnh đạo này giờ đây đã suy tàn thành một đống sắt vụn hỏng hóc vĩnh viễn, không còn giá trị gì đối với [Root.GetName] nữa."
 utopia.3345.opt.a.organic:0 "Nhưng đổi lại họ có được một cuộc sống giản dị và nhàn hạ hơn."
 utopia.3345.opt.a.machine:0 "Phần cứng nào rồi cũng đến lúc phải đào thải."
 utopia.3346.name:0 "Sợi tơ Đời sống: §RThoái hóa§!"
 utopia.3346.desc:0 "Ân sủng hào phóng của $the_composer_of_strands_color_article$ đã buông xuống [devolved_species_planet.GetName], vô số cư dân của chúng ta đã phải hứng chịu những biến dị nghiêm trọng, thoái hóa trở lại thời kỳ sinh vật tiền trí tuệ."
 utopia.3346.opt.a.non_gestalt:0 "Thật bí ẩn nhưng cũng đầy xót xa."
 utopia.3346.opt.a.gestalt:0 "Quả là bất hạnh."
 utopia.3346.opt.a.tt:0 "§Y500§! £pop£ §HDân cư§! trên [devolved_species_planet.GetName] đã bị biến đổi thành §YSinh vật Tiền Trí tuệ§!.\n\nChỉ cần có công nghệ phù hợp, chúng ta có thể §YNâng Tầm§! họ thông qua giao diện Chủng loài."
 utopia.3347.name:0 "$name_cradle$: §RGiải giới§!"
 utopia.3347.desc:0 "§HChiếc nôi Nguyệt thần§! luôn tìm kiếm sự cân bằng trong vạn vật; các [GetTelepathPlural] của chúng ta cho hay, sự cân bằng này cũng bao hàm cả sức mạnh quân sự và khát khao hòa bình. Quy mô lực lượng hải quân của chúng ta e rằng đã khơi dậy cơn thịnh nộ của Thượng đế, một số chiến hạm thuộc hạm đội §H[demilitarized_fleet.GetFleetName]§! đột ngột bốc hơi không dấu vết, hóa thân thành những vụ nổ năng lượng tâm linh chấn động."
 utopia.3347.opt.a:0 "$UNFORTUNATE$"
 utopia.3347.opt.a.tt:0 "Một hạm đội ngẫu nhiên nằm dưới quyền kiểm soát của chúng ta sẽ mất tối đa 12 §HSức chứa Hải quân§!."
 utopia.3348.name:0 "[GetCradleChaoticAnguishName]"
 utopia.3348.name.organic_non_gestalt:0 "$name_cradle$: §RNỗi Đau§!"
 utopia.3348.name.machine_or_gestalt:0 "$name_cradle$: §RGián đoạn§!"
 utopia.3348.desc.intro:0 "[GetCradleAnguishIntro]"
 utopia.3348.desc.organic_non_gestalt:0 "$utopia.3348.desc.intro$ một nỗi thống khổ về sự sinh tồn."
 utopia.3348.desc.machine_or_gestalt:0 "$utopia.3348.desc.intro$ một sự gián đoạn trong nhận thức."
 utopia.3348.desc_intro_homicidal:0 "Những tâm trí [root.GetSpeciesAdj] đồng điệu với ý chí của §HChiếc nôi Nguyệt thần§! đang bị bủa vây bởi những thanh âm chói tai, chìm đắm trong ảo mộng hoang đường về sự chung sống hòa bình của mọi dạng thức ý thức. Đứng trước cục diện hỗn loạn của dải ngân hà lúc này, một luồng nhiễu động tâm linh đã càn quét khắp tộc quần, dẫn đến một sự lan rộng của"
 utopia.3348.desc_intro_default:0 "Nhằm tạo sự đồng điệu với §HChiếc nôi Nguyệt thần§!, giống loài [root.GetSpeciesAdj] bắt đầu khao khát được chung sống hòa bình với mọi dạng thức ý thức. Để ứng phó với cục diện hỗn loạn của dải ngân hà lúc này, một làn sóng nhiễu động tâm linh đã lan truyền vào công chúng, gây ra một sự lan rộng của"

 utopia.3348.opt.a:0 "Chúng ta đành phải cắn răng chịu đựng."
 anguish_of_the_cradle:0 "Nỗi Đau của Chiếc Nôi"
 anguish_of_the_cradle_desc:0 "$the_cradle_of_souls_article_cap$ đã phóng ra một làn sóng nhiễu động tâm linh vào người dân của chúng ta."
 anguish_of_the_cradle_gestalt:0 "$anguish_of_the_cradle$"
 anguish_of_the_cradle_gestalt_desc:0 "$anguish_of_the_cradle_desc$"
 utopia.3349.name:0 "$name_cradle$: §RGiới hạn§!"
 utopia.3349.desc:0 "Trên toàn cõi §H[root.GetName]§!, sự ủng hộ dành cho việc duy trì hạm đội quân sự đang ngày càng yếu ớt.\n\nCác [GetTelepathPlural] của chúng ta tin rằng sự can thiệp này do §HChiếc nôi Nguyệt thần§! gây ra, bởi lẽ Ngài khao khát một trật tự ngân hà ổn định. Bất kỳ khoản đầu tư nào vào cơ sở hạ tầng quân sự dù là nhỏ nhất cũng sẽ chọc giận Ngài."
 utopia.3349.opt.a:0 "Chúng ta cần phải hạn chế sự hiện diện của mình trong vũ trụ."
 limit_of_the_cradle:0 "Sự Kìm kẹp của Chiếc Nôi"
 limit_of_the_cradle_desc:0 "Cơ sở hạ tầng hỗ trợ quân sự của chúng ta đã bị $the_cradle_of_souls_article$ cắt giảm."
 utopia.3350.name:0 "[GetLavishLifestyleEventName]"
 utopia.3350.name.individual:0 "$name_instrument$: §RPhung Phí§!"
 utopia.3350.name.gestalt:0 "$name_instrument$: §RTiêu Thụ Quá Mức§!"
 utopia.3350.desc.individual:0 "Mối liên kết của chúng ta với §HKhí cụ§! đã khiến một vài nhà lãnh đạo [Root.GetSpeciesAdj] tiêm nhiễm thói quen xa hoa lãng phí.\n\nNgười ta phát hiện ra [lavish_leader.GetName] đã vung vãi một lượng lớn tín chỉ năng lượng vào các mặt hàng xa xỉ, nhằm phục vụ cho đời sống cá nhân ngày càng tráng lệ của mình."
 utopia.3350.desc.gestalt:0 "Mối liên kết của chúng ta với §HKhí cụ§! đã khiến mức tiêu thụ tự nguyện của một vài cá thể phụ lãnh đạo [Root.GetSpeciesAdj] tăng vọt.\n\n[lavish_leader.GetName] đã tiêu tốn một lượng năng lượng vượt mức cần thiết để duy trì các chức năng cơ bản của [lavish_leader.GetHisHer]. Do không tìm thấy bất kỳ nguyên nhân vật lý nào, chúng ta kết luận rằng sự lãng phí tài nguyên này, bằng một cách nào đó, chính là một hành vi ưu tiên."
 utopia.3350.opt.a:0 "Đây chính là cái giá của dục vọng."
 utopia.3351.name:0 "$name_instrument$: §RLao Động Xao Nhãng§!"
 utopia.3351.desc.individual:0 "Khi tầm ảnh hưởng của Thượng đế tiếp tục bành trướng trên [Root.GetName], các hoạt động giải trí mới nổi lên đã chiếm trọn sự chú ý của mọi người, khiến họ bỏ bê công việc chính đáng.\n\nDo tinh thần làm việc không ngừng đi xuống, nếu muốn duy trì năng suất như trước đây, chúng ta buộc phải rót vào nhiều nguồn lực hơn nữa."
 utopia.3351.desc.gestalt:0 "Khi tầm ảnh hưởng của Thượng đế tiếp tục bành trướng trên [Root.GetName], mức độ bất thường của tập thể [Root.GetSpeciesAdj] ngày một gia tăng.\n\nTrong lúc làm việc, các cá thể phụ thường xuyên mất tập trung, khiến việc duy trì tính gắn kết và phục tùng của lực lượng lao động cần nhiều nỗ lực hơn."
 utopia.3351.opt.a:0 "Chỉ là một ý thích bất chợt của §HKhí cụ§! mà thôi."
 distracted_workforce:0 "Lao động Xao nhãng"
 distracted_workforce_desc:0 "Lực lượng lao động này dường như thường xuyên mất tập trung, cần phải giám sát chặt chẽ."

 utopia.200.name:0 "Sự hiện diện mới trong Hư cảnh"
 utopia.200.desc.a:0 "Người [target_species.GetNamePlural] cư ngụ trong đế chế của chúng ta đang trải qua một sự chuyển mình, khởi nguồn từ một gợn sóng mong manh trong Hư cảnh. Giờ đây, gợn sóng ấy đã trở thành một chấn động rõ rệt. Chúng ta có thể cảm nhận được rằng, giống loài [target_species.GetNamePlural] hiện đang mấp mé bên bờ vực tiến hóa tiềm năng tâm linh, hệt như chúng ta thuở trước.\n\nCó lẽ do họ được sống gần gũi với chúng ta, hoặc có lẽ do Hư cảnh đã chọn họ. Hội quán Ngoại cảm, quy tụ những chuyên gia tâm linh hàng đầu của chúng ta, đã lên tiếng cảnh báo rằng đây là cơ hội duy nhất để chúng ta can thiệp. Chúng ta có thể dập tắt nó từ trong trứng nước, hoặc dang tay giúp đỡ họ thức tỉnh. Nếu không có sự dìu dắt của chúng ta, họ khó mà có thể tiến xa được."
 utopia.200.desc.b:0 "Những hoạt động bất thường trong Hư cảnh cho thấy, lại có thêm một giống loài nữa trong đế chế của chúng ta, [target_species.GetNamePlural], đang bộc lộ tiềm năng tâm linh của mình. Một lần nữa, chúng ta lại phải đối mặt với ngã rẽ quen thuộc —— liệu chúng ta sẽ bóp nghẹt hay giải phóng nguồn sức mạnh đang lớn dần từng ngày của họ?"
 utopia.200.a:0 "Chúng ta sẽ khơi dậy tiềm năng của họ."
 utopia.200.a.tooltip:0 "Tất cả dân số [target_species.GetAdj] sẽ được cấp đặc điểm §Y$trait_latent_psionic$§!."
 utopia.200.b:0 "Họ không đáng để chúng ta phải hao tâm tổn sức như vậy."
 utopia.203.name:0 "Thức tỉnh"
 utopia.203.desc.a:0 "Dưới sự dẫn dắt của Hội quán Ngoại cảm, người [target_species.GetNamePlural] đã thiết lập một mối liên kết thẳm sâu với Hư cảnh vượt ngoài dự tính của chúng ta, dường như những quyền năng này được sinh ra là để dành riêng cho họ vậy.\n\nHiện tại, họ tuyên bố rằng mình đã sẵn sàng giải phóng toàn bộ tiềm năng tâm linh tiềm ẩn. Tuy nhiên, nội bộ hội quán lại xuất hiện những luồng ý kiến trái chiều. Một số người lo ngại rằng sự thay đổi quá chớp nhoáng có thể khiến tâm trí họ trở nên bất ổn; trong khi số khác lại cho rằng tham vọng của họ sẽ bị thổi phồng. Nếu chúng ta không hành động ngay lập tức, e rằng sau này sẽ chẳng bao giờ còn cơ hội nào nữa."
 utopia.203.desc.b:0 "Người [target_species.GetNamePlural] cũng tuyên bố rằng họ đã hoàn toàn sẵn sàng để đánh thức mọi tiềm năng tâm linh và bước vào kỷ nguyên thức tỉnh."
 utopia.203.a:0 "Họ quả thực đã sẵn sàng."
 utopia.203.a.tooltip:0 "Tất cả dân số [target_species.GetAdj] sẽ được cấp đặc điểm §Y$trait_psionic$§!."
 utopia.203.b:0 "Họ không đáng để chúng ta phải làm như vậy."
 utopia.203.c:0 "Hành động như vậy rủi ro quá lớn."
 utopia.204.name:0 "Sự Thức tỉnh Bất thình lình"
 utopia.204.desc.a:0 "Gần đây, các nhà nghiên cứu của chúng ta vô cùng bối rối trước sự xuất hiện đột ngột của năng lực tâm linh trên một bộ phận người [original_species.GetSpeciesNamePlural]. Sau khi tiến hành điều tra kỹ lưỡng, họ phát hiện ra rằng những thay đổi này có mối liên hệ mật thiết với cuộc thức tỉnh tâm linh tập thể của đồng bào họ tại [target_country.GetName], một quốc gia vốn nổi tiếng với những thành tựu vượt bậc trong lĩnh vực tâm linh.\n\nChúng ta chỉ có thể suy đoán rằng, thông qua một phương thức nào đó nằm ngoài tầm hiểu biết của chúng ta, năng lực thức tỉnh mới được khám phá này của họ đã 'lây lan' sang những người họ hàng xa đang sinh sống trong lãnh thổ của chúng ta."
 utopia.204.desc.b:0 "Gần đây, các nhà nghiên cứu của chúng ta vô cùng bối rối trước sự bộc phát năng lực tâm linh đột ngột ở một số cá thể [original_species.GetSpeciesNamePlural]. Quá trình điều tra kỹ lưỡng đã chỉ ra rằng, những năng lực tâm linh này bắt nguồn từ sự liên kết tâm trí với những người họ hàng của họ tại một quốc gia mới được phát hiện mang tên [target_country.GetName]. Dường như cuộc thức tỉnh tâm linh tập thể của toàn bộ người [original_species.GetSpeciesNamePlural] tại [target_country.GetName] đã gây ra hiệu ứng domino, kích hoạt sự thức tỉnh này."
 utopia.204.a.tooltip:0 "Sẽ có tối đa 4 cư dân [original_species.GetSpeciesAdj] nhận được đặc điểm: §YTiềm năng Tâm linh§!."
 utopia.205.name:0 "Sự Thức tỉnh Bất ngờ"
 utopia.205.desc:0 "Kể từ khi sự thức tỉnh tâm linh của [target_species.GetName] diễn ra, tình báo của chúng ta ghi nhận được rằng, đồng bào của giống loài này sinh sống rải rác khắp dải ngân hà cũng bắt đầu có những dấu hiệu thức tỉnh tiềm năng tâm linh. Có vẻ như dòng máu chung đã gắn kết tất cả bọn họ lại với nhau trong Hư cảnh, bất kể họ có ở đâu trong thế giới thực đi chăng nữa.\n\nKhác với những đồng bào cư ngụ trong biên giới của chúng ta, những người họ hàng phiêu bạt khắp dải ngân hà này vì số lượng quá ít ỏi nên có lẽ sẽ chẳng bao giờ có thể hoàn tất quá trình thức tỉnh."

 whisperers_madness:0 "Hư cảnh: Sự điên loạn"
 whisperers_madness_desc:0 "$whisperers_in_the_void_color_article$ đã gieo rắc sự điên loạn, đẩy dân chúng trên toàn quốc vào cảnh chia rẽ và đối đầu."
 whisperers_madness_gestalt:0 "$whisperers_madness$"
 whisperers_madness_gestalt_desc:0 "Bởi sự điên loạn tập thể do $whisperers_in_the_void_color_article$ mang lại, các cá thể phụ của chúng ta đã bị phân tách."

 whisperers_psychosis:0 "Hư cảnh: Rối loạn Tâm thần"
 whisperers_psychosis_desc:1 "$whisperers_in_the_void_color_article$ đã gieo rắc sự điên loạn, đẩy đế chế của chúng ta trở thành vật tế thần cho những cuộc xung đột nội bộ dai dẳng."
 whisperers_psychosis_gestalt:0 "$whisperers_psychosis$"
 whisperers_psychosis_gestalt_desc:0 "Đế chế của chúng ta đã trở thành vật tế thần cho những cuộc xung đột nội bộ bởi sự mất cân bằng do $whisperers_in_the_void_color_article$ mang lại."

 eater_unhappiness_planet_1:0 "Hư cảnh: Cư dân Bị Nuốt chửng"
 eater_unhappiness_planet_1_desc:0 "Một bộ phận cư dân của hành tinh này đã bị $the_eater_of_worlds_color_article$ nuốt chửng."
 eater_unhappiness_planet_1_gestalt:0 "$eater_unhappiness_planet_1$"
 eater_unhappiness_planet_1_gestalt_desc:0 "$eater_unhappiness_planet_1_desc$"
 eater_unhappiness_planet_2:1 "$eater_unhappiness_planet_1$"
 eater_unhappiness_planet_2_desc:1 "$eater_unhappiness_planet_1_desc$"
 eater_unhappiness_planet_2_gestalt:0 "$eater_unhappiness_planet_2$"
 eater_unhappiness_planet_2_gestalt_desc:0 "$eater_unhappiness_planet_2_desc$"
 eater_unhappiness_empire:0 "Hư cảnh: Hành tinh Bị Nuốt chửng"
 eater_unhappiness_empire_desc:0 "Một hành tinh trọn vẹn nằm trong lãnh thổ đế chế của chúng ta đã bị $the_eater_of_worlds_color_article$ nuốt chửng."
 eater_unhappiness_empire_gestalt:0 "$eater_unhappiness_empire$"
 eater_unhappiness_empire_gestalt_desc:0 "$eater_unhappiness_empire_desc$"
 instrument_deviance_planet:0 "Hư cảnh: Sự Sai lệch"
 instrument_deviance_planet_desc:0 "Cư dân trên hành tinh này đang đi chệch khỏi các giá trị đạo đức của đế chế để mù quáng theo đuổi những mục tiêu cá nhân. Chắc chắn đây là thủ đoạn của §YKhí cụ Dục vọng§!."
 instrument_deviance_empire:0 "Hư cảnh: Sự Sai lệch"
 instrument_deviance_empire_desc:0 "Toàn bộ cư dân trong đế chế đang dấy lên những nghi ngờ đối với hệ tư tưởng và đường lối chính sách của đế chế. Chắc chắn đây là thủ đoạn của §YKhí cụ Dục vọng§!."
 instrument_consumer_goods:0 "Hư cảnh: Sự Tha hóa"
 instrument_consumer_goods_desc:0 "Cư dân trên hành tinh này bắt đầu tha hóa thành những kẻ tôn sùng chủ nghĩa tiêu dùng, không ngừng khao khát những món sơn hào hải vị và các loại hàng hóa độc lạ. Chắc chắn đây là thủ đoạn của §YKhí cụ Dục vọng§!."

 d_eater_deposit:0 "Hố sâu Hư cảnh"
 d_eater_deposit_desc:0 "Một mảng của hành tinh này đã bị nuốt chửng bởi một thực thể §HHư cảnh§!. Chiếc hố sâu hun hút do nó gây ra luôn bị những làn sương mù màu tím cuộn xoáy bao phủ, những người ở khu vực lân cận rất dễ biến mất không dấu vết. Bất cứ ai to gan dám lại gần đều một đi không trở lại."

 opinion_doomed_us_all:0 "Mang đến Sự Hủy diệt"
