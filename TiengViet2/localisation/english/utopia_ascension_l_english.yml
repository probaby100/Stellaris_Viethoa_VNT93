 utopia.3000.name:0 "Hư cảnh"
 utopia.3000.a:0 "Tiến vào Hư cảnh."
 utopia.3000.intro.desc:0 "Hư cảnh. Nơi này kỳ dị vô cùng, đầy rẫy sự bất an, nhưng lại thoảng qua cảm giác... thân thuộc. Bất kỳ ai sở hữu năng lực tâm linh đều từng mường tượng về nơi này trong giấc mơ, dẫu lúc đó họ có thể chưa hay biết.\n\nGiờ đây, chúng ta đang đứng chênh vênh bên bờ vực thẳm của Hư cảnh, chỉ cách ranh giới không gian mỏng manh ngăn cách giữa Hư cảnh và không gian thông thường —— hay còn gọi là \"thế giới thực\" —— trong gang tấc.\n\nĐể dấn thân sâu hơn vào Hư cảnh, chúng ta cần phải tiêu hao một lượng lớn năng lượng và sự nỗ lực phi thường trong việc kết nối ngoại cảm, tuyệt đối không thể hành động bồng bột... Ngay cả lúc này, chúng ta vẫn đang bị dõi theo."
 utopia.3000.1.desc:0 "Hôm nay, Hư cảnh tĩnh lặng đến lạ thường."
 utopia.3000.2.desc:0 "Một thực thể nào đó đang chằm chằm quan sát chúng ta."
 utopia.3000.3.desc:0 "Nhìn từ phía bên này, mọi thứ thật quá đỗi khác biệt."
 utopia.3000.4.desc:0 "Lẽ ra họ nên cử một nhà thơ đến đây..."
 utopia.3000.5.desc:0 "Có một thế lực tăm tối nào đó đang kéo đến."
 utopia.3000.6.desc:0 "Chẳng lẽ chúng ta vẫn đang chìm trong cõi mộng?"
 utopia.3000.7.desc:0 "Chúng ta... chúng ta đã làm được! Chúng ta đã ở bên trong!"
 utopia.3000.8.desc:0 "Một... thực thể nào đó đang lảng vảng gần đây. Nó đang gọi mời chúng ta tiến sâu hơn vào Hư cảnh..."
 utopia.3000.9.desc:0 "Ngươi cũng nghe thấy âm thanh đó chứ?"
 utopia.3000.10.desc:0 "Nhịp đập của Hư cảnh vô cùng mạnh mẽ. Cảm giác hệt như... được trở về nhà."
 utopia.3000.11.desc:0 "Ngươi có nghĩ thứ mình đang hít thở lúc này là không khí không?"
 utopia.3000.12.desc:0 "Chúng ta nhìn, nhưng lại chẳng thấy gì, nơi này ẩn chứa quá nhiều điều mà chúng ta cần phải khám phá."
 utopia.3000.13.desc:0 "Chúng ta đã đánh mất giác quan nào vậy, tại sao chúng ta không thể nhìn thấy, không thể nghe thấy một thế giới khác đang bao quanh mình?"
 utopia.3000.14.desc:0 "Phải duy trì cảnh giác cao độ. Ở nơi này, ngay cả một ý nghĩ viển vông cũng có thể hóa thành thực thể hữu hình... và hơn thế nữa, chúng thường xuyên tấn công chúng ta."
 utopia.3000.15.desc:0 "Lẽ ra chúng ta không bao giờ nên đặt chân đến nơi này."
 utopia.3000.16.desc:0 "Năng lượng... quá... dồi dào..."
 utopia.3000.17.desc:0 "Giữ vững... sự tập trung..."
 utopia.3000.18.desc:0 "Phải chăng đây là nơi khởi nguồn của vạn vật?"
 utopia.3000.19.desc:0 "Sự kinh hoàng... một nỗi kinh hoàng hiện hữu."
 utopia.3000.b:0 "§MKhám phá nguồn sức mạnh hùng cường hơn.§!"

 utopia.3005.desc:0 "Chúng ta biết rõ nơi đây ẩn chứa nguồn sức mạnh vô tận. Dẫu từng bị ngó lơ, nhưng nếu khéo léo tận dụng sức mạnh của Zro, chúng ta có thể thử tiến hành thám hiểm. Các nhà ngoại cảm của chúng ta đã cảm nhận được những thực thể này rải rác khắp Hư cảnh. Chúng ta nên ghé thăm vị nào đây?"
 utopia.3005.a:0 "§GKẻ reo rắc núi xác biển máu.§!"
 utopia.3005.b:0 "§PKẻ gào thét vì trống rỗng và khát cầu.§!"
 utopia.3005.c:0 "§HKẻ thì thầm niềm khao khát và sự chiếm đoạt.§!"
 utopia.3005.d:0 "§BKẻ thưởng thức hương vị của niềm tin vỡ nát.§!"

 utopia.3010.desc:0 "Hội quán Ngoại cảm vẫn chưa hồi phục sau đợt tổn hao sinh lực từ chuyến viếng thăm Hư cảnh lần trước. Thiếu đi sự liên kết tâm linh của họ, chúng ta chỉ đành thoáng bắt được những hình ảnh mờ ảo của cõi thoảng qua này, xa xôi tựa như những mảnh ký ức vụn vỡ.\n\nVà điều này hiện tại chẳng giúp ích gì cho chúng ta, chúng ta chỉ có thể quay lại sau."


 boon.bestowed:0 "§GĐược ban Ân sủng§!"
 curse.bestowed:0 "§RBị giáng Lời nguyền§!"


 boon.psi.link.machine:0 "Năng lượng cường đại của §HHư cảnh§! tuôn trào vào trung tâm bộ xử lý tâm linh chung của các [Root.GetSpeciesNamePlural]."
 boon.psi.link.organic_non_gestalt:0 "Năng lượng cường đại của §HHư cảnh§! tuôn trào vào liên kết cộng đồng chung của toàn thể [Root.GetSpeciesNamePlural]."
 boon.psi.link.hive:0 "Năng lượng cường đại của §HHư cảnh§! tuôn trào vào liên kết tâm linh bầy đàn đang rạo rực bên trong chủ não [Root.GetAdjective]."
 boon.psi.link:0 "[GetBoonPsiLink]"
 boon.ship.link:0 "Các [GetTelepathPlural] của chúng ta đã cố gắng thiết lập một con đường truyền dẫn tạm thời giữa phi thuyền của chúng ta và §HHư cảnh§!."

 utopia.3030.desc.gestalt:0 "$boon.psi.link$\n\nNguồn năng lượng này luân chuyển trong mạng lưới bầy đàn, đảm bảo các cá thể phụ của chúng ta đạt được sự ổn định tối ưu khi thực hiện nhiệm vụ."
 utopia.3030.desc.organic_non_gestalt:0 "$boon.psi.link$\n\nMột nhận thức sâu sắc về sự tĩnh tâm nhanh chóng lan tỏa khắp [Root.GetName], ngay cả những người không có năng lực tâm linh cũng chịu ảnh hưởng."
 utopia.3030.desc.machine_non_gestalt:0 "$boon.psi.link$\n\nMột cảm giác cân bằng vận hành sâu sắc nhanh chóng lan tỏa khắp [Root.GetName], có vẻ như những đơn vị không có bộ phận tâm linh cũng bị ảnh hưởng."
 utopia.3031.desc:0 "$boon.ship.link$\n\nBất kể hồ sơ hoạt động ra sao, mọi dấu hiệu hao mòn trên hạm đội của chúng ta đều biến mất. Nhờ vậy, chi phí bảo trì của chúng ta đã giảm đi đáng kể."
 utopia.3032.desc.non_gestalt:0 "$boon.psi.link$\n\nCác [GetScientistPlural] của chúng ta đã thiết lập một cơ sở dữ liệu tri thức tập thể chia sẻ qua thần giao cách cảm, điều này sẽ nâng cao đáng kể hiệu suất làm việc của họ."
 utopia.3032.desc.organic_gestalt:0 "$boon.psi.link$\n\nCác nốt mạng tập trung nghiên cứu trong chủ não của [Root.GetSpeciesNamePlural] chúng ta đang hoạt động với mức độ đồng bộ tuyệt vời, giúp nâng cao hiệu suất nhận thức."
 utopia.3032.desc.machine_gestalt:0 "$boon.psi.link$\n\nVòng lặp kết xuất tâm linh đã đẩy ma trận nghiên cứu của chúng ta vượt mức hiệu suất tối đa, giúp nâng cao đáng kể hiệu suất học tập."
 utopia.3033.desc:0 "$boon.ship.link$\n\nPhi hành đoàn trên chiến hạm của chúng ta hiện đã có thể sử dụng năng lượng tâm linh để cường hóa hệ thống khiên chắn."
 utopia.3034.desc:0 "$boon.ship.link$\n\nThông qua việc sử dụng năng lượng tâm linh, phi hành đoàn của chúng ta hiện đã có thể cường hóa hệ thống vũ khí."
 utopia.3035.desc:0 "$boon.ship.link$\n\nThông qua việc sử dụng năng lượng tâm linh, phi hành đoàn của chúng ta hiện đã có thể đẩy nhanh tốc độ bắn của vũ khí."
 utopia.3036.desc.organic_non_gestalt:0 "$boon.psi.link$\n\nNhận thức về sự đoàn kết bắt đầu nảy nở trong tâm trí người dân, giờ đây họ có vẻ sẵn sàng đồng tâm hiệp lực hơn để hướng tới những mục tiêu mà chính phủ đề ra."
 utopia.3036.desc.machine_non_gestalt:0 "$boon.psi.link$\nNhận thức về sự đoàn kết bắt đầu nảy nở trong bộ vi xử lý của người dân, giờ đây họ có vẻ sẵn sàng đồng tâm hiệp lực hơn để hướng tới những mục tiêu mà chính phủ đề ra.\n"
 utopia.3036.desc.gestalt:0 "$boon.psi.link$\n\nNguồn năng lượng này đọng lại trong tập thể, tối ưu hóa hiệu suất của các cá thể phụ, làm giảm bớt các hành vi bất thường gây phân tán sự chú ý."
 utopia.3037.desc.organic_non_genocidal:0 "$boon.psi.link$\n\nSự đồng cảm của chúng ta mãnh liệt hơn bao giờ hết, mang lại cho chúng ta sức ảnh hưởng chính trị to lớn hơn."
 utopia.3037.desc.machine_non_genocidal:0 "$boon.psi.link$\n\nCác đơn vị ngoại giao của chúng ta đang hoạt động với hiệu suất đồng cảm tối đa, mang lại sức ảnh hưởng chính trị to lớn hơn."
 utopia.3037.desc.genocidal:0 "$boon.psi.link$\n\nÝ chí của chúng ta đã được áp đặt lên toàn bộ dải ngân hà với một sức mạnh chưa từng có."
 utopia.3038.desc.gestalt:0 "$boon.psi.link$\n\nChúng ta cảm nhận được sự sáng suốt và tinh thần đoàn kết chưa từng có."
 utopia.3038.desc.non_gestalt:0 "$boon.psi.link$\n\nChúng ta cảm nhận được tinh thần đoàn kết chưa từng có."
 utopia.3039.desc:0 "$boon.ship.link$\n\nThông qua việc sử dụng năng lượng tâm linh, phi hành đoàn của chúng ta hiện đã có thể trực tiếp can thiệp vào sự di chuyển của phi thuyền, giúp tăng tỷ lệ né tránh khi đối mặt với hỏa lực của địch."
 utopia.3040.desc.organic:0 "$boon.ship.link$\n\nThông qua việc sử dụng năng lượng tâm linh, phi hành đoàn chiến hạm của chúng ta hiện đã có thể thực hiện sửa chữa hạn chế trên chiến trường, dùng tâm trí để vá lấp các vết nứt trên thân tàu."
 utopia.3040.desc.machine:0 "$boon.ship.link$\n\nThông qua việc sử dụng năng lượng tâm linh, phi hành đoàn chiến hạm của chúng ta hiện đã có thể thực hiện sửa chữa hạn chế trên chiến trường, dùng bộ vi xử lý thần kinh để vá lấp các vết nứt trên thân tàu."
 utopia.3041.desc.machine:0 "$boon.psi.link$\n\nCác [GetTelepathPlural] của chúng ta đã dùng sức mạnh của họ để tạm thời làm chậm quá trình lão hóa của các đơn vị lãnh đạo xuất chúng nhất, kéo dài thời gian dự kiến báo hỏng của họ thêm vài thập kỷ. Đáng tiếc là chúng ta không có đủ năng lượng để ban tặng hiệu ứng này cho toàn bộ dân số."
 utopia.3041.desc.organic_gestalt:0 "$boon.psi.link$\n\nCác [GetTelepathPlural] của chúng ta đã dùng sức mạnh của họ để tạm thời làm chậm quá trình lão hóa của các cá thể phụ lãnh đạo xuất chúng nhất, kéo dài tuổi thọ tự nhiên của họ thêm vài thập kỷ. Đáng tiếc là chúng ta không có đủ năng lượng để ban tặng hiệu ứng này cho toàn bộ dân số."
 utopia.3041.desc.organic_non_gestalt:0 "$boon.psi.link$\n\nCác [GetTelepathPlural] của chúng ta đã tận dụng nguồn sức mạnh này để tạm thời làm chậm quá trình lão hóa của những lãnh đạo xuất chúng nhất, kéo dài thêm vài thập kỷ tuổi thọ tự nhiên. Đáng tiếc là chúng ta không có đủ năng lượng để ban tặng hiệu ứng này cho toàn bộ dân số."
 utopia.3041.tooltip:0 "Tất cả Lãnh đạo nhận được đặc điểm §Y$leader_trait_shroud_age$§!, tăng thêm §G+40§! năm tuổi thọ."
 utopia.3042.desc:0 "$boon.ship.link$\n\nThông qua việc sử dụng năng lượng tâm linh, phi hành đoàn của chúng ta hiện đã có thể cường hóa sức mạnh của động cơ đẩy, giúp cải thiện rõ rệt tốc độ bay ở giới hạn hạ quang tốc của phi thuyền."
 utopia.3043.desc.organic:0 "$boon.psi.link$\n\nNguồn sức mạnh này đã củng cố tâm trí của các binh sĩ, giờ đây họ sẵn sàng xông pha vào mọi hiểm nguy trên chiến trường. Tinh thần đồng đội của họ là vô song."
 utopia.3043.desc.machine_or_gestalt:0 "$boon.psi.link$\n\nNguồn sức mạnh này đã củng cố mức độ hoàn thành mục tiêu của các máy bay không người lái chiến đấu, tối ưu hóa hiệu suất trên chiến trường."
 utopia.3044.desc:0 "$boon.psi.link$\n\nGiờ đây chúng ta đã có thể cảm nhận được sự di chuyển của các phi thuyền ở khoảng cách xa hơn nhiều so với khả năng dò tìm của các mảng cảm biến truyền thống."

 utopia.3045.name:0 "Bị trục xuất khỏi Hư cảnh"
 utopia.3045.1.desc:0 "Con đường truyền dẫn mà các [GetTelepathPlural] của chúng ta dùng để kết nối với Hư cảnh đã tự sụp đổ, bởi lẽ một vài tầng năng lượng của Hư cảnh đã thay đổi mà không hề có bất kỳ dấu hiệu báo trước nào.\n\nChúng ta đã dễ dàng bị hất cẳng trở lại không gian thông thường."
 utopia.3045.2.desc:0 "Các [GetTelepathPlural] của chúng ta đã bị đè bẹp bởi áp lực tâm linh dữ dội khi giao tiếp với Hư cảnh.\n\nHọ không thể tiếp tục duy trì kết nối nữa."
 utopia.3045.3.desc_organic:0 "Ban đầu thì chậm chạp, rồi càng lúc càng nhanh, sự bám víu của chúng ta vào Hư cảnh dần nới lỏng. Các [GetTelepathPlural] của chúng ta mất đi điểm tựa trong Hư cảnh, gào lên đau đớn, và rồi chúng ta bị đẩy lùi về không gian thông thường."
 utopia.3045.3.desc_machine:0 "Ban đầu thì chậm chạp, rồi càng lúc càng nhanh, sự bám víu của chúng ta vào Hư cảnh dần nới lỏng. Các [GetTelepathPlural] của chúng ta mất đi điểm tựa trong Hư cảnh, bắt đầu gặp trục trặc, và rồi chúng ta bị đẩy lùi về không gian thông thường."

 curse.psi.link.organic:0 "Một luồng phản lực tâm linh cực mạnh quét dọc theo con đường truyền dẫn mà chúng ta đã thiết lập với Hư cảnh, đồng thời xâm nhập vào liên kết tâm linh chung được chia sẻ bởi toàn thể [Root.GetSpeciesNamePlural]."
 curse.psi.link.machine:0 "Một luồng phản lực thần kinh cực mạnh quét dọc theo con đường truyền dẫn mà chúng ta đã thiết lập với Hư cảnh, đồng thời xâm nhập vào liên kết tâm linh bầy đàn được chia sẻ bởi toàn thể [Root.GetSpeciesNamePlural]."
 curse.psi.link:0 "[GetCursePsiLink]"
 curse.ship.link:0 "Một luồng phản lực tâm linh cực mạnh quét dọc theo con đường truyền dẫn mà chúng ta đã thiết lập với Hư cảnh, và dường như nó đã tác động đến phi thuyền của chúng ta."

 utopia.3050.desc.gestalt:0 "$curse.psi.link$\n\nĐiều này gây ra sự xáo trộn bên trong tập thể [Root.GetName], dẫn đến sự bất ổn trên toàn cõi đế chế."
 utopia.3050.desc.non_gestalt:0 "$curse.psi.link$\n\nSự việc này dường như đã gây ra tác động tiêu cực sâu sắc đến mức độ hạnh phúc của người dân, giờ đây một nhận thức u sầu đang bao trùm khắp [Root.GetName]."
 utopia.3051.desc.gestalt:0 "$curse.psi.link$\n\nLàn sóng chấn động sinh ra vang vọng khắp tập thể, kích động những hành vi bất thường ở các cá thể phụ, dẫn đến những tình huống dị thường hết sức nan giải."
 utopia.3051.desc.non_gestalt:0 "$curse.psi.link$\n\nNguồn năng lượng tiêu cực này đã xâm chiếm trái tim của người dân chúng ta. Rất nhiều người bắt đầu hướng tới những hệ tư tưởng cực đoan trái ngược với đường lối của chính phủ. Sức ảnh hưởng này thậm chí còn lây lan sang cả những cư dân không có năng lực tâm linh!"
 utopia.3052.desc:0 "$curse.ship.link$\n\nLớp giáp của chúng trở nên giòn mỏng, khả năng chịu đựng sát thương kém hơn trước rất nhiều."
 utopia.3053.desc.machine:0 "$curse.psi.link$\n\nÁp lực đè nặng lên mạng lưới thần kinh của chúng ta đã gây ra tác động tiêu cực đáng kể đến việc chế tạo các đơn vị trên toàn [Root.GetName]."
 utopia.3053.desc.organic_gestalt:0 "$curse.psi.link$\n\nCảm giác đau đớn giáng xuống toàn bộ tập thể đã gây ra tác động tiêu cực đáng kể đến năng lực sinh sản các cá thể phụ mới."
 utopia.3053.desc.organic_non_gestalt:0 "$curse.psi.link$\n\nVì một lý do nào đó, sự việc này đã làm tổn hại đến tỷ lệ sinh sản trên toàn [Root.GetName]. Nó thậm chí còn tác động đến những giống loài không có năng lực tâm linh bẩm sinh!"
 utopia.3054.desc.machine_gestalt:0 "$curse.psi.link$\n\nVòng lặp phản hồi kết xuất tâm linh phát sinh từ đó đã ảnh hưởng đến việc vận hành toàn hiệu suất của ma trận nghiên cứu của chúng ta."
 utopia.3054.desc.machine_non_gestalt:0 "$curse.psi.link$\n\n[GetMindPhysicalLoc] của các nhà nghiên cứu đã bị quá tải, gây ảnh hưởng nghiêm trọng đến sự tập trung trong công việc của họ."
 utopia.3054.desc.organic_gestalt:0 "$curse.psi.link$\n\nCác nốt mạng tập trung nghiên cứu trong chủ não của [Root.GetSpeciesNamePlural] chúng ta đã bị quá tải, khiến chúng ta không thể xử lý hiệu quả những khám phá mới."
 utopia.3054.desc.organic_non_gestalt:0 "$curse.psi.link$\n\n[GetMindPhysicalLoc] của các nhà nghiên cứu đã bị che mờ, khiến họ không thể làm việc với sự tập trung và hiệu suất cao."
 utopia.3055.desc:0 "$curse.psi.link$\n\nTốc độ tích lũy sức ảnh hưởng chính trị của chúng ta đã bị sụt giảm rõ rệt."
 utopia.3056.desc.organic_non_gestalt:0 "$curse.psi.link$\n\nNhận thức về sự đoàn kết từng ngự trị trong tâm trí người dân chúng ta nay đã tan vỡ."
 utopia.3056.desc.machine_or_gestalt:0 "$curse.psi.link$\n\nNhận thức về sự đoàn kết từng ngự trị trong [Root.GetName] nay đã tan vỡ, dẫn đến tình trạng mất phối hợp trên diện rộng."
 utopia.3057.desc:0 "$curse.ship.link$\n\nKhi di chuyển, phi thuyền của chúng ta dường như bị một thế lực vô hình nào đó kéo giật lại, làm giảm đáng kể tốc độ bay ở giới hạn hạ quang tốc."
 utopia.3058.desc.organic_non_gestalt:0 "$curse.psi.link$\n\nNguồn năng lượng tiêu cực này đã bào mòn sĩ khí của lực lượng mặt đất, khiến hiệu suất chiến đấu của họ trên chiến trường suy giảm trong giai đoạn này."
 utopia.3058.desc.machine_or_gestalt:0 "$curse.psi.link$\n\nVòng lặp phản hồi do đợt sóng năng lượng này tạo ra đã cản trở hiệu suất hoạt động của lực lượng mặt đất."
 utopia.3059.desc:0 "Một luồng phản lực tâm linh cực mạnh quét dọc theo con đường truyền dẫn mà chúng ta đã thiết lập với Hư cảnh, và nó dường như đã gây nhiễu loạn các cảm biến giữa các vì sao của chúng ta.\n\nĐộ phân giải cảm biến nhận được từ mọi nguồn đều sụt giảm nghiêm trọng, dẫn đến cự ly dò tìm bị thu hẹp."

