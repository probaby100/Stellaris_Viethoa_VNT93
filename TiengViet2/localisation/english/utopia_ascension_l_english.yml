 venture.shroud.tooltip:0 "Tiêu hao Năng lượng để khám phá sâu hơn vào Hư cảnh. Sản lượng §HZro§! dưới quyền kiểm soát của chúng ta sẽ giúp giảm thiểu chi phí này, với mức giảm tối đa lên đến 4 cấp.\n\n"
 exit.shroud.tooltip:0 "Rời khỏi Hư cảnh, quay lại không gian thông thường."
 shroud.avatar:0 "Nếu thành công, một hóa thân cấu thành từ năng lượng tâm linh thuần túy sẽ hiển hiện trong vũ trụ của chúng ta, và nó sẽ hoàn toàn tuân theo sự kiểm soát của chúng ta."
 shroud.boon:0 "Nếu thành công, năng lượng từ Hư cảnh sẽ được dẫn dắt thành một luồng ân sủng to lớn, mang lại hiệu ứng tích cực cho toàn bộ đế chế của chúng ta."
 shroud.unknown:0 "Nếu thành công... ừm... thành thật mà nói, không ai biết chuyện gì sẽ xảy ra."

