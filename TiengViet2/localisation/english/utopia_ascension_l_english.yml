 utopia.2700.name:0 "Tiến hóa Có Thiết kế"
 utopia.2700.desc:0 "Đôi khi quá trình tiến hóa cần được đẩy một cú hích đi đúng hướng. Giờ đây chúng ta đã có công nghệ đủ tiên tiến để cải tạo cơ thể và tâm trí của mình ở cấp độ gen, nhằm đối phó với những thách thức chưa từng có do môi trường biến đổi không ngừng mang lại."
 utopia.2703.name:0 "Làm chủ Tiến hóa"
 utopia.2703.desc:0 "Cuối cùng thì chúng ta không còn phải lo lắng về sự sống còn của giống loài nữa. Những ngày người [Root.GetSpeciesName] bị tự nhiên chi phối tùy ý, tiến hóa gen hoàn toàn phó mặc cho số phận cuối cùng cũng đã kết thúc.\n\nCác kỹ sư thời đại chúng ta không làm việc với bê tông cốt thép, mà hàng ngày tiếp xúc với các trình tự gen. Nắm trong tay công nghệ cải tiến gen tiên tiến, chúng ta sẽ có thể đảm bảo một tương lai tươi sáng cho dân tộc."

 utopia.2600.name:0 "Tâm trí Vượt trên Vật chất"
 utopia.2600.desc:0 "Kể từ thuở sơ khai của nền văn minh, đã luôn có những truyền thuyết về các thuật sĩ hùng mạnh nắm giữ sức mạnh chỉ có thể diễn tả bằng hai chữ siêu nhiên. Những [Root.GetSpeciesNamePlural] hiếm hoi này có thể xâm nhập vào tâm trí đồng loại, nâng vật nặng chỉ bằng một ý niệm, hoặc biểu diễn các kỳ tích \"phép thuật\" khác. Mãi cho đến gần đây, những câu chuyện này mới chỉ là những câu \"chuyện\" xưa cũ.\n\nNgày nay, các nhà khoa học của chúng ta cuối cùng đã có được bằng chứng mang tính kết luận chứng minh một số cá thể [Root.GetSpeciesName] có tiềm năng tâm linh tiềm ẩn. Mặc dù chỉ một bộ phận rất nhỏ giống loài của chúng ta được trời phú cho tiềm năng tâm linh, nhưng số lượng của họ so với tổng dân số đã tăng đều đặn trong suốt vài thế kỷ qua.\n\nKhông rõ điều này là do một đợt bùng phát gia tăng nhất thời nào đó, hay do một thứ gì đó luôn tồn tại trong gen của chúng ta đã khơi dậy tiềm năng tâm linh, các nhà khoa học vẫn chưa thể lý giải."
 utopia.2600.desc.unplugged:0 "Mặc dù nền văn minh non trẻ của chúng ta có một lịch sử ngắn ngủi và bạo lực, nhưng những [root.GetSpeciesNamePlural] chúng ta đôi khi cũng để trí tưởng tượng bay bổng trong những câu chuyện viễn tưởng. Trong những ý niệm thú vị này, xuất hiện thường xuyên nhất là câu chuyện về các pháp sư hùng mạnh, những người sử dụng sức mạnh chỉ có thể miêu tả bằng từ siêu nhiên: thuật đọc tâm trí, dịch chuyển đồ vật bằng ý nghĩ, hoặc thể hiện vô vàn kỳ tích \"phép thuật\" khác.\n\nNhiều người tin rằng, những câu chuyện này đã được lưu truyền từ rất lâu trước khi chúng ta bị sáp nhập; chúng ẩn sâu trong vô thức tập thể của giống loài chúng ta. Cho đến gần đây, phần lớn [root.GetSpeciesNamePlural] vẫn còn coi đây là một mong muốn hão huyền. Tuy nhiên, các nhà khoa học của chúng ta hiện nay cuối cùng đã có được bằng chứng xác thực, chứng minh một số cá nhân [Root.GetSpeciesAdj] thực sự sở hữu tiềm năng tâm linh nội tại.\n\nMặc dù trong giống loài chúng ta dường như chỉ có một số lượng cực kỳ nhỏ có năng lực tâm linh, nhưng nghiên cứu di truyền học cho thấy, trong vài thế kỷ qua, số lượng của họ vẫn đang tăng lên đều đặn. Còn về việc liệu đây là do một sự tăng trưởng tiến hóa đột ngột nào đó hay do sự can thiệp của [origin_unplugged_assimilator_empire.GetName], các nhà khoa học vẫn chưa thể khẳng định chắc chắn."
 utopia.2600.a:0 "Có lẽ đó là cái nhìn thoáng qua về tương lai đang chờ đón chúng ta."
 utopia.2602.name:0 "[From.GetSpeciesNamePlural] Phô diễn Tiềm năng Tâm linh"
 utopia.2602.1.desc.1.non_gestalt_intro:0 "Theo thông tin rò rỉ từ chính phủ §Y[From.GetName]§!, sức mạnh tâm linh tiềm ẩn đã"
 utopia.2602.1.desc.1.non_gestalt_outro:0 "theo các báo cáo rò rỉ từ chính quyền §H[From.GetName]§!. Đây chắc chắn là một bước tiến mới xảy ra gần đây, bởi trước đó chúng ta chưa từng có ghi chép nào về việc [From.GetSpeciesNamePlural] phô diễn sức mạnh tâm linh."
 utopia.2602.1.desc.1.organic_non_gestalt:0 "$utopia.2602.1.desc.1.non_gestalt_intro$ xuất hiện ở một số cá thể của giống loài [From.GetSpeciesName]. $utopia.2602.1.desc.1.non_gestalt_outro$"
 utopia.2602.1.desc.1.machine_non_gestalt:0 "$utopia.2602.1.desc.1.non_gestalt_intro$ xuất hiện trên thân máy [From.GetSpeciesName]. $utopia.2602.1.desc.1.non_gestalt_outro$"
 utopia.2602.1.desc.1.gestalt_intro:0 "Theo thông tin rò rỉ từ chính phủ §H[From.GetName]§!, sức mạnh tâm linh tiềm ẩn đã xuất hiện trên một vài cá thể [From.GetSpeciesNamePlural]."
 utopia.2602.1.desc.1.gestalt_outro:0 "Họ còn sản sinh ra một năng lực siêu nhiên chưa từng thấy."
 utopia.2602.1.desc.1.organic_gestalt:0 "$utopia.2602.1.desc.1.gestalt_intro$ Dù trong giống loài của họ sự kết nối ý thức không phải là điều gì mới mẻ, nhưng các báo cáo này khẳng định $utopia.2602.1.desc.1.gestalt_outro$"
 utopia.2602.1.desc.1.machine_gestalt:0 "$utopia.2602.1.desc.1.gestalt_intro$ Giao tiếp qua mạng nơ-ron không phải là điều gì mới mẻ đối với họ, các báo cáo này khẳng định $utopia.2602.1.desc.1.gestalt_outro$"
 utopia.2602.1.desc.2.intro:0 "Nhìn chung, năng lực này vẫn chỉ giới hạn ở"
 utopia.2602.1.desc.2.outro:0 "Báo cáo không đưa ra bất kỳ lời giải thích nào cho hiện tượng này."
 utopia.2602.1.desc.2.organic:0 "$utopia.2602.1.desc.2.intro$ một phần rất nhỏ trong giống loài [From.GetSpeciesName]. $utopia.2602.1.desc.2.outro$"
 utopia.2602.1.desc.2.machine:0 "$utopia.2602.1.desc.2.intro$ một số ít [From.GetSpeciesNamePlural]. $utopia.2602.1.desc.2.outro$"
 utopia.2602.1.desc.machine_gestalt:0 "$utopia.2602.1.desc.1.machine_gestalt$\n\n$utopia.2602.1.desc.2.machine$"
 utopia.2602.1.desc.machine_non_gestalt:0 "$utopia.2602.1.desc.1.machine_non_gestalt$\n\n$utopia.2602.1.desc.2.machine$"
 utopia.2602.1.desc.organic_gestalt:0 "$utopia.2602.1.desc.1.organic_gestalt$\n\n$utopia.2602.1.desc.2.organic$"
 utopia.2602.1.desc.organic_non_gestalt:0 "$utopia.2602.1.desc.1.organic_non_gestalt$\n\n$utopia.2602.1.desc.2.organic$"
 utopia.2602.2.desc:0 "Dân số của [From.GetSpeciesName] đã bắt đầu có biểu hiện của những thay đổi tương tự, và những thay đổi trong quần thể của họ không chỉ giới hạn ở một khu vực nhỏ."
 utopia.2602.a.organic_non_gestalt:0 "Thật kỳ lạ."
 utopia.2602.a.hive_or_machine_non_gestalt:0 "Sức mạnh đặc biệt ư? Thật đáng ngờ."
 utopia.2602.a.machine_gestalt:0 "Ngừng tính toán."
 utopia.2602.b:0 "Năng lực tâm linh? Thật nực cười!"
 utopia.2602.c:0 "Mớ tà thuật của họ sẽ chẳng cứu được họ đâu."
 utopia.2602.d.organic:0 "Đúng vậy, chúng ta có thể cảm nhận được sóng tâm linh phát ra từ họ."
 utopia.2602.d.machine:0 "Đúng vậy, chúng ta đã lập danh mục các tần số tâm linh của họ."

 utopia.2605.name.organic_non_gestalt:0 "[psionic_leader.GetTitle] Thể hiện Năng lực Tâm linh"
 utopia.2605.name.machine_non_gestalt:0 "[psionic_leader.GetTitle] Được Xác định là Nhà Tâm linh"
 utopia.2605.name.gestalt:0 "[psionic_leader.GetName] Được Xác định là Nhà Tâm linh"
 utopia.2605.desc.organic_non_gestalt:0 "Mặc dù việc năng lực tâm linh bộc lộ ở tuổi trưởng thành là khá hiếm, nhưng không phải là chưa từng có. Những năng lực mà [psionic_leader.GetTitle] [psionic_leader.GetName] thể hiện gần đây, chúng ta nghi ngờ bản chất của chúng là tâm linh. Sau khi trải qua các bài kiểm tra siêu giác quan toàn diện, [psionic_leader.GetSheHe] đã được xác nhận sở hữu năng khiếu tâm linh cấp độ 4."
 utopia.2605.desc.machine_non_gestalt:0 "Dù khá hiếm, nhưng năng lực tâm linh đôi khi cũng tự phát sinh trên các phần cứng trước đây không hỗ trợ. [psionic_leader.GetTitle] [psionic_leader.GetName] gần đây đã bộc lộ những chức năng có thể được phân loại là năng lực tâm linh. Sau khi chẩn đoán toàn diện, [psionic_leader.GetSheHe] được đánh giá là sở hữu năng khiếu tâm linh cấp độ 4."
 utopia.2605.desc.gestalt:0 "Sức ảnh hưởng từ nguồn sức mạnh mới thu nhận của chúng ta đang tăng lên từng ngày. Thể chứa [GetBrainName] của chúng ta, [psionic_leader.GetName], gần đây đã bộc lộ những chức năng có thể được phân loại là năng lực tâm linh. Sau khi chẩn đoán toàn diện, [psionic_leader.GetSheHe] được xác định là một [GetPsychicNoun] cấp độ 4."
 utopia.2605.a:0 "Năng lực mới này sẽ giúp ích cho chúng ta rất nhiều."

 utopia.2652.name:0 "[This.GetSpeciesNamePlural] Thức tỉnh Năng lực Tâm linh"

 utopia.2652.desc.1.intro:0 "Những [This.GetSpeciesNamePlural] ở khắp nơi trong dải ngân hà đều đã trải qua một sự chuyển mình sâu sắc. Trước đây, năng lực tâm linh tiềm ẩn của họ chỉ"
 utopia.2652.desc.1.outro:0 "giải phóng được toàn bộ tiềm năng tâm linh của mình."
 utopia.2652.desc.1.organic:0 "$utopia.2652.desc.1.intro$ ban ơn cho một bộ phận rất nhỏ, giờ đây toàn bộ giống loài đã $utopia.2652.desc.1.outro$"
 utopia.2652.desc.1.machine:0 "$utopia.2652.desc.1.intro$ xuất hiện với số lượng ít, giờ đây tổng thể quần thể của họ đã $utopia.2652.desc.1.outro$"
 utopia.2652.desc.2.non_gestalt:0 "Mặc dù những thay đổi này có thể bắt nguồn từ [From.GetName], nhưng toàn bộ [GetSpeciesWord] của họ bất luận đang ở đâu đều đã bắt đầu bộc lộ."
 utopia.2652.desc.2.organic_non_gestalt:0 "$utopia.2652.desc.2.non_gestalt$\n\nBên cạnh việc phô diễn hàng loạt năng lực tâm linh mạnh mẽ, [This.GetSpeciesNamePlural] còn bắt đầu từ bỏ việc giao tiếp bằng ngôn ngữ với nhau, thay vào đó là sử dụng thần giao cách cảm."
 utopia.2652.desc.2.machine_non_gestalt:0 "$utopia.2652.desc.2.non_gestalt$\n\n$utopia.2652.desc.2.machine_gestalt$"
 utopia.2652.desc.2.gestalt.intro:0 "Bên cạnh việc phô diễn hàng loạt năng lực tâm linh mạnh mẽ, toàn bộ [This.GetSpeciesNamePlural] hiện tại còn có thể"
 utopia.2652.desc.2.organic_gestalt:0 "$utopia.2652.desc.2.gestalt.intro$ giao tiếp phi ngôn ngữ thông qua các kênh ngoài luồng."
 utopia.2652.desc.2.machine_gestalt:0 "$utopia.2652.desc.2.gestalt.intro$ giao tiếp bên ngoài các kênh tập thể hiện có."
 utopia.2652.desc.organic_non_gestalt:0 "$utopia.2652.desc.1.organic$\n\n$utopia.2652.desc.2.organic_non_gestalt$"
 utopia.2652.desc.machine_non_gestalt:0 "$utopia.2652.desc.1.machine$\n\n$utopia.2652.desc.2.machine_non_gestalt$"
 utopia.2652.desc.organic_gestalt:0 "$utopia.2652.desc.1.organic$\n\n$utopia.2652.desc.2.organic_gestalt$"
 utopia.2652.desc.machine_gestalt:0 "$utopia.2652.desc.1.machine$\n\n$utopia.2652.desc.2.machine_gestalt$"
 utopia.2652.b:0 "Chắc chắn phải có một lời giải thích hợp logic cho chuyện này."
 utopia.2652.c.organic:0 "Tiến hành một cách cẩn trọng."
 utopia.2652.c.machine:0 "Sự phát triển không tối ưu."
 utopia.2652.d.organic:0 "Chúng ta cảm nhận được nhiễu động tâm linh mạnh mẽ sau khi họ thức tỉnh."
 utopia.2652.d.machine:0 "Điều này giải thích cho nhiễu động tâm linh mà chúng ta đã phát hiện."

 utopia.2650.name:0 "Đại Thức tỉnh"
 utopia.2650.desc:0 "Giống loài [Root.GetSpeciesName] đã trải qua một sự lột xác chỉ có thể diễn tả bằng cụm từ \"Đại Thức tỉnh\". Trước kia, tiềm năng tâm linh vĩ đại của chúng ta vốn đã là một phần bản chất cố hữu của giống loài, tuy chỉ bộc lộ ở một thiểu số, nhưng giờ đây...\n\nGần như chỉ qua một đêm, những [Root.GetSpeciesNamePlural] ở khắp mọi nơi đã giải phóng toàn bộ tiềm năng tâm linh của mình, hệt như một bể năng lượng tâm linh chung của người [Root.GetSpeciesName] đã đạt đến ngưỡng kích hoạt, đánh thức tiềm năng tâm linh trong não bộ của tất cả chúng ta.\n\nThần giao cách cảm đã thay thế phần lớn việc giao tiếp bằng giọng nói giữa các [Root.GetSpeciesNamePlural], và đây chỉ là một trong vô số những thay đổi mà xã hội chúng ta đang phải đối mặt. Giờ đây, chúng ta đã được liên kết với nhau theo một cách mà trước đây không thể nào tưởng tượng nổi."
 utopia.2650.a:0 "Bức màn đã được vén lên."
 utopia.2655.name:0 "Hư cảnh"
 utopia.2655.desc:0 "Hệt như những lời thì thầm trầm đục trong một căn phòng tối, Hư cảnh cất tiếng gọi ta từ sâu thẳm trong tâm hồn. Đó là một cõi nguyên thủy được cấu thành từ năng lượng tâm linh thuần túy, tồn tại từ thuở hồng hoang. Mọi sinh vật được ban tặng năng lực tâm linh đều có thể, bằng cách này hay cách khác, dù chỉ là trong tiềm thức, hấp thụ năng lượng từ Hư cảnh.\n\nKể từ khi thăng thiên, chúng ta đã bắt đầu nhìn nhận Hư cảnh một cách rõ ràng hơn. Một vài họa tiết trong đó, ngay cả với những nhà ngoại cảm quyền năng nhất của chúng ta, cũng chỉ hiện lên như những vòng xoáy năng lượng vô định. Phía bên kia Hư cảnh, còn có những... tồn tại khác. Một dạng thực thể linh hồn, từ bờ bên kia đang đăm đăm nhìn chúng ta, đôi khi với vẻ tò mò, đôi khi mang ý thiện... và đôi khi đầy ác ý.\n\nChúng ta vẫn đang tiếp tục tìm hiểu những phương diện rộng lớn hơn của sức mạnh mới có được này, nhưng chúng ta vẫn có khả năng giao tiếp với những thực thể linh hồn này, điều này đòi hỏi sự chung sức của những nhà ngoại cảm mạnh nhất mà chúng ta có."
 utopia.2655.a:0 "Chúng ta phải khám phá Hư cảnh."
 BREACHING_SHROUD_PROJECT:0 "Tiến vào Hư cảnh"
 BREACHING_SHROUD_PROJECT_DESC:0 "Nếu muốn giao tiếp với các cư dân trong cõi tâm linh được gọi là \"Hư cảnh\", chúng ta phải giải phóng một luồng năng lượng tâm linh khổng lồ đến mức khó tin. Một buổi gọi hồn quy mô lớn đã được chuẩn bị, hội tụ những nhà ngoại cảm hùng mạnh nhất tại hội quán ngoại cảm mới được xây dựng trên [Root.Capital.GetName]."
 utopia.2656.name:0 "Lễ Gọi hồn"
 utopia.2656.desc:0 "Sau nhiều ngày miệt mài thực hiện gọi hồn thôi miên, các nhà ngoại cảm tại hội quán cuối cùng đã mở ra một cánh cổng chớp nhoáng dẫn đến Hư cảnh.\n\nGiờ đây, khi đã thiết lập được liên kết tâm linh ban đầu, chúng ta có thể giao tiếp với Hư cảnh thông qua menu §HLiên lạc§! về sau. Để thiết lập mối liên kết có ý nghĩa với cõi này và diện kiến những thực thể cư ngụ tại đó, chúng ta cần sử dụng một bộ phát tâm linh đặc biệt để khuếch đại tầm với tâm linh của mình, và việc này sẽ ngốn một lượng năng lượng khổng lồ."
 utopia.2656.a:0 "Đã đến lúc tiến vào, để xem chúng ta có thể tìm ra điều gì."

 utopia.2657.name:0 "Dòm ngó Trong gương"
 utopia.2657.desc:0 "Trong quá trình dần chọc thủng bức màn, chúng ta có thể cảm nhận được nó đang mỏng đi từng chút một dưới áp lực từ ý thức liên kết của chúng ta. Và hành động cố gắng tiến vào §HHư cảnh§! của chúng ta chẳng hề tĩnh lặng ở phía bên kia. Có thứ gì đó đang dõi theo chúng ta.\n\nThực thể này tỏa ra một sức mạnh cường đại cùng một ý đồ thâm sâu khó dò. Nó đang dần dần len lỏi vào những khe nứt trong tâm trí chúng ta.\n\nNó mới chỉ chú ý đến chúng ta, hệt như đang quan sát một giọt nước đọng trên cửa sổ kính vậy. Có lẽ thực thể này sẽ cho phép chúng ta tiến vào, như thế chúng ta mới có thể tiếp xúc với ý thức đầy bí ẩn của nó."
 utopia.2657.a:0 "Cố gắng giao tiếp với nó."
 utopia.2657.a.tt:0 "§GĐiều này sẽ khiến chúng ta ký kết một khế ước.§!"
 utopia.2657.b:0 "Chúng ta muốn tự mình khám phá."
 utopia.2657.c:0 "Đây không phải ý hay! Chúng ta cần phải cẩn thận."

 utopia.2658.name:0 "Lễ Thêm Sức"
 utopia.2658.desc:1 "Đã một thời gian trôi qua kể từ khi chúng ta ký kết khế ước với §H[GetShroudPatron]§!. Mối dây liên kết giữa đôi bên vẫn còn mong manh, do đó vẫn có cơ hội để phá vỡ hoặc củng cố nó."
 utopia.2658.a:0 "Ký kết khế ước chính thức."
 utopia.2658.b:0 "Từ bỏ §Y[GetShroudPatron]§!."

 utopia.2659.name:0 "Lối Vào"
 utopia.2659.desc:0 "Các nhà ngoại cảm của chúng ta đã không quản ngày đêm thử phá vỡ §HHư cảnh§! mà không cần đến sự trợ giúp từ những cư dân trong đó. Cuối cùng, họ đã tìm thấy một lối đi. Vực thẳm này đang réo gọi chúng ta. Chúng ta chỉ cần hít một hơi thật sâu và nhảy vào đó."
 utopia.2659.a:0 "Vậy chúng ta hãy lặn sâu vào Hư cảnh."

 FORM_COVENANT_PROJECT:0 "Giao tiếp với Kẻ Không thể Gọi tên"
 FORM_COVENANT_PROJECT_DESC:0 "Hội quán Ngoại cảm trên [Root.Capital.GetName] đang chuẩn bị một buổi rước lễ trọng thể nhằm tìm kiếm một thực thể ẩn náu sâu thẳm trong Hư cảnh."

 utopia.3020.name:0 "§GĐã Triệu hồi Hóa thân Tâm linh§!"
 utopia.3020.desc:0 "Năng lượng dồi dào của §HHư cảnh§! đã được rót thành công vào một hóa thân tâm linh dưới sự kiểm soát của chúng ta!\n\nSau khi được dịch chuyển đến chiều không gian của chúng ta, hóa thân mới hình thành này đã hợp nhất thành một thực thể không gian, và đang neo đậu trên quỹ đạo [Root.Capital.GetName]."
 utopia.3021.desc:0 "Năng lượng dồi dào của §HHư cảnh§! đã được rót thành công vào một hóa thân tâm linh dưới sự kiểm soát của chúng ta!\n\nSau khi được dịch chuyển đến chiều không gian của chúng ta, hóa thân mới hình thành này đã hợp nhất thành một chiến binh khổng lồ, và đang có mặt trên bề mặt [Root.Capital.GetName]."
 utopia.3022.name:0 "§RTriệu hồi Thất bại§!"
 utopia.3022.desc:0 "Việc truyền dẫn năng lượng tâm linh cần thiết để triệu hồi một hóa thân và đưa nó đến chiều không gian của chúng ta đã vượt quá năng lực hiện tại. Vì sự thất bại của chúng ta, năng lượng từ §HHư cảnh§! đã tan biến hoàn toàn."
 utopia.3023.name:0 "Thực thể Tâm linh Tấn công"
 utopia.3023.desc:0 "Nỗ lực triệu hồi hóa thân chỉ thành công một phần. Mặc dù tạo tác này đã hiện hình trong chiều không gian của chúng ta với hình dạng chuẩn xác, nhưng các [GetTelepathPlural] đã không thể khuất phục được nó!\n\nGiờ đây, chúng ta đang phải đối mặt với một thực thể tâm linh đầy thù địch, nó sẽ nghiền nát mọi thứ trên đường đi."

 utopia.3024.name:0 "Đội quân Hư cảnh Xâm lược"
 utopia.3024.desc:0 "Một tạo tác từ §HHư cảnh§! đã xé toạc rào cản không gian, và hiện hình thành công trong hệ sao [shroud_spawn_system.GetName]! Hóa thân tràn ngập hận thù này điều khiển một luồng năng lượng tâm linh cực lớn, và sẽ dùng nó để giáng đòn trừng phạt lên bất cứ ai hay thứ gì xui xẻo cản bước tiến phục thù của nó."
 utopia.3024.a:0 "Phải ngăn chặn nó!"
 utopia.3026.name:0 "Hóa thân Hư cảnh Bị Tiêu Tán"
 utopia.3026.desc:0 "Do sự sụt giảm năng lượng liên tục khi lưu lại trong chiều không gian này, hóa thân nằm tại hệ sao §H[shroud_spawn_system.GetName]§! đã chạm ngưỡng giới hạn không thể duy trì hình thái của mình.\n\nNó không thể tiếp tục giữ hình dạng thực thể nữa, và đã rút lui trở lại §HHư cảnh§!."
 utopia.3026.a.default:0 "Tạ ơn trời đất."
 utopia.3026.a.machine_or_hive:0 "Thu hoạch ngoài mong đợi."

