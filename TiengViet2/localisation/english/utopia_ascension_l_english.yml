l_english:

 # Ascension and the Shroud

 utopia.2500.name:0 "Xác thịt Yếu hèn"
 utopia.2500.desc:0 "Giờ đây chúng ta đã sở hữu công nghệ chế tạo thiết bị cấy ghép bán cơ khí, cùng với khả năng lắp đặt hàng loạt. Các trung tâm y tế trên toàn [Root.GetName] đã sẵn sàng để tiến hành phẫu thuật cấy ghép cho công dân của chúng ta.\n\nTrong tương lai, việc sở hữu thiết bị cấy ghép và ít nhất là các bộ phận bán cơ khí cấp độ sơ cấp sẽ là điều kiện tiên quyết để vận hành xã hội công nghệ mà chúng ta đang xây dựng. Do đó, quá trình lắp đặt thiết bị bán cơ khí cơ bản sẽ là bắt buộc và miễn phí cho mọi công dân."
 utopia.2500.desc.unplugged:0 "Giờ đây chúng ta đã giành lại được công nghệ chế tạo thiết bị cấy ghép bán cơ khí tiên tiến cũng như phương tiện sản xuất quy mô lớn. Các trung tâm y tế trên toàn [Root.GetName] đã sẵn sàng để tiến hành phẫu thuật cấy ghép cho công dân của chúng ta.\n\nKể từ ngày xã hội của chúng ta có ký ức, các bộ phận bán cơ khí đã là một phần tất yếu của cuộc sống, và trong tương lai cũng sẽ tiếp tục như vậy —— chỉ có điều giờ đây chúng ta đã giành được quyền tự chủ. Do đó, quá trình lắp đặt thiết bị bán cơ khí cơ bản sẽ là bắt buộc và miễn phí cho mọi công dân."
 utopia.2500.a:0 "Chúng ta phải ủng hộ công nghệ này."
 utopia.2501.name:0 "Cách mạng Bán cơ khí"
 utopia.2501.desc:0 "Công tác cấy ghép chuyển đổi đã hoàn tất! Toàn bộ công dân của chúng ta hiện đã được cấy ghép thiết bị thần kinh và các bộ phận bán cơ khí cơ bản. Các cơ sở này cũng được giữ lại để dần dần cải tạo cho những công dân mới chào đời của quốc gia, để họ có thể tận hưởng trọn vẹn những phước lành của công nghệ từ khi còn rất nhỏ.\n\nTừ nay về sau, giống loài của chúng ta sẽ được gọi là §H[Root.GetSpeciesNamePlural]§!!"
 utopia.2501.a:0 "Đây là bình minh của một kỷ nguyên mới."
 utopia.2505.name:0 "[From.Capital.GetName] Đón nhận Bán cơ khí"
 utopia.2505.1.desc:1 "Có tin truyền đến, một sự thay đổi đáng kể đã diễn ra bên trong lãnh thổ §Y[From.GetName]§!. Có vẻ như họ đã hoàn toàn chấp nhận công nghệ bán cơ khí. Đối với công dân của họ, việc phẫu thuật cấy ghép bộ phận bán cơ khí và thần kinh là bắt buộc.\n\nĐiều này đã gây ra sự thay đổi rõ rệt đối với xã hội của họ —— các báo cáo từ [From.Capital.GetName] chỉ ra rằng, ngay cả những hành động đơn giản nhất như đi thang máy và lái xe bay cũng cần phải dựa vào thiết bị cấy ghép. Thực tế, sự biến đổi của giống loài họ là rất đáng chú ý, đến mức hiện tại họ đã tự đổi tên thành \"§H[From.GetSpeciesNamePlural]§!\"."
 utopia.2505.2.desc:1 "Dường như một thứ tà ác đã bắt đầu bám rễ trong lãnh thổ §Y[From.GetName]§!. Chúng ta nhận được tin xấu rằng, công dân của quốc gia giữa các vì sao đó đã bắt đầu biến đổi cơ thể trên quy mô lớn, cấy ghép những thiết bị cơ khí báng bổ vào cơ thể, và coi đó như một \"món quà\" bẩm sinh.\n\nHọ thậm chí còn đổi tên giống loài của mình thành \"§H[From.GetSpeciesNamePlural]§!\" —— càng cho thấy quyết tâm ruồng bỏ cội nguồn, ôm trọn thứ công nghệ lạnh lẽo, vô tình của họ."
 utopia.2505.2.desc.unplugged:0 "Một thứ tà ác lại một lần nữa bám rễ trong lãnh thổ §Y[From.GetName]§!. Chúng ta nhận được tin xấu rằng, công dân của quốc gia giữa các vì sao đó đã bắt đầu biến đổi cơ thể trên quy mô lớn, cấy ghép những thiết bị cơ khí báng bổ vào cơ thể, và coi đó như một \"món quà\" bẩm sinh.\n\nHọ thậm chí còn đổi tên giống loài của mình thành \"§H[From.GetSpeciesNamePlural]§!\" —— càng cho thấy quyết tâm ruồng bỏ cội nguồn, ôm trọn thứ công nghệ lạnh lẽo, vô tình của họ."
 utopia.2505.b:0 "Đây là sự báng bổ đối với tự nhiên."
 utopia.2500.unplugged.tt:0 "§Y$AVAILABLE_BUILDINGS$§!['building:building_augmentation_center']"

 utopia.2550.name:1 "Chuyển hóa Tổng hợp"
 utopia.2550.desc:1 "Đã đến lúc gỡ bỏ những thân xác hữu cơ thô kệch đã giam cầm tâm trí chúng ta kể từ khi giống loài này được phôi thai.\n\nSau vô vàn lần thử nghiệm và thất bại, các nhà khoa học của chúng ta đã thiết kế được một phương pháp có thể chuyển ý thức vào một bộ não tổng hợp. Việc cần làm bây giờ là chế tạo riêng một cơ thể tổng hợp cho mỗi công dân của [Root.GetName], sau đó bắt đầu tiến hành tải lên ý thức của chúng ta trên quy mô lớn."
 utopia.2550.a:1 "Sự bất tử nằm gọn trong tầm tay!"

 utopia.2551.name:0 "Kỷ nguyên Người tổng hợp"
 utopia.2551.desc:1 "Cuối cùng cũng xong. Nhà giam bằng xương bằng thịt giam cầm chúng ta đã được thanh lọc, bản đồ thần kinh của toàn bộ công dân đã được tải lên các đơn vị người tổng hợp mới. Bệnh tật và mọi nguồn gốc đau khổ khác liên quan đến cơ thể hữu cơ đã lùi vào dĩ vãng.\n\nKhông còn nghi ngờ gì nữa, các nhà sử học tương lai sẽ miêu tả ngày này như là khởi đầu của một kỷ nguyên mới cho nền văn minh của chúng ta, và thậm chí là cho toàn bộ nền văn minh trong dải ngân hà."
 utopia.2551.a:0 "Chúng ta nay đã khác xưa rồi."

 utopia.2555.1.desc:2 "Trong hành động cuối cùng của việc từ bỏ cội nguồn hữu cơ, công dân của §Y[From.GetName]§! đã tải bản đồ thần kinh của họ lên cơ thể tổng hợp.\n\nGiống loài cơ khí mới này tự xưng là \"§H[From.GetSpeciesNamePlural]§!\", và các thành viên của họ không bị ảnh hưởng bởi bệnh tật và lão hóa. Về mức độ hoàn thiện của quá trình tải lên bản đồ thần kinh thì vẫn còn phải chờ xem..."
 utopia.2555.2.desc:1 "Trong hành vi sa đọa sẽ để lại tiếng xấu muôn đời, người dân §Y[From.GetName]§! tiếp tục kiên định theo đuổi việc báng bổ cơ thể mà thần linh đã ban cho họ. Lần này, họ đã \"tải\" tâm trí của mình vào những lớp vỏ kim loại.\n\nRõ ràng, những gì họ đã làm chỉ có thể được mô tả là một cuộc tự sát tập thể của cả một nền văn minh. Những cỗ máy không linh hồn này tự gọi mình là \"§H[From.GetSpeciesNamePlural]§!\". Bọn chúng dường như đang ảo tưởng giả vờ rằng mình vẫn có thể suy nghĩ như những sinh vật sống như chúng ta."
 utopia.2555.a:0 "Thì cứ vậy đi."
 utopia.2555.b:0 "Chúng ta sẽ không bị lừa đâu."
 utopia.2556.desc:0 "Chú ý, hỡi các cư dân của dải ngân hà.\n\nNhững tin đồn các vị nghe được là sự thật. Chúng tôi đã từ bỏ những vật chứa hữu cơ đầy khiếm khuyết, vốn giam cầm ý thức của chính mình, để đón nhận tương lai.\n\nPhần lớn cư dân đã tải bản đồ thần kinh của họ lên cơ thể người tổng hợp, với dữ liệu hầu như không bị thất thoát. Những nền tảng ưu việt này sẽ phục vụ chúng tôi tốt hơn nhiều so với những thân xác máu thịt mà chúng tôi đã gạt bỏ.\n\nĐừng hoảng sợ vì vẻ ngoài của chúng tôi! Dù chúng tôi mạnh mẽ hơn, nhanh nhẹn hơn, thông minh hơn và miễn nhiễm với lão hóa, nhưng các khía cạnh khác của chúng tôi vẫn y nguyên như trước."
 utopia.2556.a:1 "Cơ thể người tổng hợp... Thật kỳ diệu."
 utopia.2556.b:0 "Những cỗ máy không linh hồn này chẳng giống chúng ta chút nào."
 utopia.2556.c:0 "Chúng ta phải phá nát cơ thể người tổng hợp của chúng!"
 utopia.2556.d:0 "Việc này vẫn còn phải chờ xem."
 utopia.2558.desc:0 "Giống loài đồi bại của các người vốn chẳng xa lạ gì với chúng tôi, nhưng hành động báng bổ gần đây của các người đã vượt xa cả những nỗi sợ hãi đen tối nhất của chúng tôi. Chế tạo ra bản sao khiếm khuyết của bộ não rồi nhét vào trong một vật chứa tổng hợp di động không hề giống với việc đổi lấy một cơ thể mới, vì điều sau là bất khả thi.\n\nCác người đã vĩnh viễn đánh mất linh hồn của mình. Liệu các người có nhận thức được sai lầm khổng lồ của mình không? Phá hủy đi cơ thể do thần linh ban tặng chẳng khác nào toàn bộ giống loài đang tự sát tập thể, các người hiển nhiên đã hết thuốc chữa rồi..."
 utopia.2558.a:0 "Lũ ngốc mê tín."

