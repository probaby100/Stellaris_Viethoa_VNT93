 COMPOSER_MARK:0 "Dấu ấn Sợi tơ"
 COMPOSER_MARK_DESC:0 "Dấu ấn từ Thượng đế Hư cảnh đã cường hóa năng lực tâm linh của chúng ta, cho phép chúng ta khuếch trương tầm ảnh hưởng lên toàn bộ phi thuyền."
