 tech_covenant_composer:0 "$COMPOSER_MARK$"
 tech_covenant_composer_desc:0 "Chúng ta đã tìm ra phương thức lưu chuyển năng lượng tâm linh từ chiến hạm của mình. Dựa vào kiến thức này, chúng ta có thể truyền tải quyền năng của Thượng đế vào sâu bên trong thân tàu."
