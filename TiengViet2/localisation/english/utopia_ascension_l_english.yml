 covenant.tooltip:0 "§YMột số cái giá cuối cùng cũng phải trả.§!\n\n"
 covenant.cycle.tooltip:0 "§RĐừng làm như vậy.§!\n\n"
 covenant.whisperers.desc:0 "Đã hoàn tất, chúng ta đã kết thành khế ước với $whisperers_in_the_void_color_article$, và bọn chúng đã bắt đầu rỉ tai những bí mật cho các nhà khoa học cũng như các nhà lãnh đạo của chúng ta. Nguồn tri thức của bọn chúng mang lại cho chúng ta những lợi ích vô cùng to lớn.\n\nTuy nhiên, mặt trái duy nhất của việc này là tỷ lệ mắc bệnh tâm thần và tự tử trong toàn bộ dân chúng đột ngột tăng vọt, thêm vào đó, một vài hành tinh của chúng ta đang phải đối mặt với hàng loạt những vụ sát nhân và tấn công không thể giải thích được, trong khi những kẻ bị tình nghi lại có tâm lý cực kỳ ổn định và hòa nhập tốt với xã hội. Sự gia tăng đột biến của lượng bệnh nhân đã khiến các phòng khám và bệnh viện tâm thần của chúng ta rơi vào tình trạng quá tải nghiêm trọng."
 covenant.whisperers.option:0 "Chúng ta có khả năng xử lý ổn thỏa việc này."
 covenant.eater.desc:1 "Xong rồi, chúng ta đã ký kết khế ước với $the_eater_of_worlds_color_article$, và sức ảnh hưởng của Ngài đã lan tỏa đến lực lượng lục quân cũng như hải quân của chúng ta. Sự tàn bạo của các binh sĩ khi xông pha chiến trận chỉ xếp sau những kẻ man rợ, ngay cả mỗi loại vũ khí trên chiến hạm của chúng ta dường như cũng đang khát khao cái chết của kẻ địch.\n\nSự biến mất bí ẩn của toàn bộ dân số một thành phố trong thuộc địa của chúng ta chắc chắn có liên quan đến chuyện này, bởi lẽ, đó là vật tế thần mà chúng ta đã hứa dâng cho Kẻ Nuốt chửng.\n\nCó vẻ như cái giá mà chúng ta phải trả thật sự không đáng kể, dĩ nhiên, đó là trong trường hợp dục vọng vô đáy của Kẻ Nuốt chửng đã được thỏa mãn..."
 covenant.eater.option:0 "Hy vọng rằng Ngài đã no bụng."
 covenant.instrument.desc:1 "Thỏa thuận đã xong, chúng ta đã thiết lập khế ước với $the_instrument_of_desire_color_article$. Và cũng chẳng mất nhiều thời gian để chúng ta cảm nhận được hiệu quả của nó: các báo cáo cho thấy chúng ta đã phát hiện ra những quặng mỏ mới, phong phú hơn trong các hầm mỏ, những tập đoàn tưởng chừng như sắp phá sản bỗng chốc trỗi dậy chỉ sau một đêm, và những tài nguyên quý hiếm lại được tìm thấy trên những tiểu hành tinh mà trước đây chúng ta luôn mặc định chỉ có đá và băng tuyết.\n\nĐế chế của chúng ta dường như đang bước vào một kỷ nguyên vàng son của sự thịnh vượng và sung túc, cứ như thể chúng ta đã được Khí cụ ban phước. Nhưng, cái giá mà Ngài nhắc đến rốt cuộc là gì...?"
 covenant.instrument.option:0 "Tôi có linh cảm đó không phải là chuyện gì quá tồi tệ."
 covenant.composer.desc:2 "Thỏa thuận đã xong, chúng ta đã thiết lập khế ước với $the_composer_of_strands_color_article$. Và cũng chẳng mất nhiều thời gian để chúng ta cảm nhận được hiệu quả của nó: tỷ lệ sinh nở tăng vọt một cách rõ rệt chắc chắn là nhờ vào sự can thiệp của Sợi tơ Đời sống. Tuy nhiên, đi kèm với những tác động tích cực này, chúng ta cũng đang phải đối mặt với một làn sóng bùng nổ các ca đột biến nghiêm trọng: những đứa trẻ sinh ra mang theo những chi hoặc cơ quan thừa... một số khác thậm chí còn sinh ra những hình hài khác xa hoàn toàn với cấu tạo giải phẫu của chúng ta.\n\nMay mắn thay, một vài trường hợp tử vong do những biến dị này gây ra đã bị lu mờ hoàn toàn bởi tỷ lệ sinh cao ngất ngưởng và sự cải thiện đáng kể về tình trạng sức khỏe chung của người dân."
 covenant.composer.option:0 "Quyết định của chúng ta là hoàn toàn sáng suốt."
 covenant.cycle.desc:1 "Xong rồi, chúng ta đã thiết lập khế ước với §RHồi kết của Vòng luân hồi§!. Khi chúng ta lập giao ước với hắn, hắn chỉ thốt ra duy nhất ba từ §RNăm mươi năm§!. Sau đó, chỉ còn lại sự tĩnh lặng bao trùm, để lại chúng ta đắm chìm trong dòng suy nghĩ về những hậu quả mà quyết định này sẽ mang đến cho tương lai của chính mình."
 covenant.cycle.option:0 "Nguyện cầu các vị thần sẽ rủ lòng từ bi với chúng ta."
 covenant_shroud_marked:0 "Dấu ấn Hư cảnh"
 covenant_shroud_marked_desc:0 "Hành tinh này đã bị Hư cảnh khắc lên mình một dấu ấn.\n\n§RNhững tai ương khủng khiếp sắp sửa ập xuống nơi này.§!"

 covenant_whisperers_in_the_void:0 "Khế ước: Hư không Chi Mật ngữ"
 covenant_whisperers_in_the_void_0:0 "$covenant_whisperers_in_the_void$"
 covenant_whisperers_in_the_void_desc:0 "Chúng ta đã lập khế ước với một thực thể quyền năng ngự trị trong Hư cảnh, và giờ đây, chúng ta đang hưởng lợi từ những ân huệ mà Ngài ban tặng.\n\n§YNhưng sớm muộn gì chúng ta cũng phải trả một cái giá nào đó.§!"
