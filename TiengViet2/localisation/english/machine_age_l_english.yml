### Cosmogenesis Events

 crisis.7100.name: "Sự tò mò Vô tận"
 crisis.7100.desc: "Ai cũng biết khoa học chính là người mở đường cho tiến bộ. Nếu muốn khai phá tiềm năng thực sự của mình, chúng ta không còn cách nào khác. Khả năng làm chủ công nghệ của chúng ta là không phải bàn cãi, nhưng vẫn còn quá nhiều thứ vượt ngoài tầm hiểu biết: con đường của các Đế chế Sa sút, sức mạnh của các Quái thú Không gian, và cả những bí ẩn về thần năng...\n\nĐể có thể thấu thị ý nghĩa sâu xa của thực tại, chúng ta cần một nền khoa học mới, một loại máy tính mới. Máy tiện Tiếp hợp chính là bước đi quan trọng đầu tiên trên hành trình vươn tới tri thức vô tận."
 crisis.7100.a: "Kiến thức là sức mạnh."
 new_cosmogenesis_tech_tt: "§YPhần thưởng Khủng hoảng§!: Các lựa chọn nghiên cứu mới đã được mở khóa."

 crisis.7105.name: "Khủng hoảng Cấp độ 2"
 crisis.7105.desc: "Khi những bí mật của vũ trụ dần được hé lộ, chúng ta xác định được rằng trọng lực đóng vai trò then chốt trong việc định hình thực tại đa chiều. Tác động của nó đối với thời gian và không gian là cực kỳ quan trọng, nhưng vẫn còn nhiều ẩn số chờ được giải đáp.\n\nMỗi mảnh tri thức chúng ta thu thập được đều mở ra những khả năng mới. Một số có thể ứng dụng trực tiếp vào công nghiệp hoặc quân sự, trong khi số khác có thể mở ra cánh cửa cho những lý thuyết chưa từng được hình dung trước đây. Đường còn dài, ta sẽ còn tiếp tục dấn bước để kiếm tìm chân lý."
 crisis.7105.a: "Điều duy nhất tôi biết là tôi không biết gì cả."

 crisis.7110.name: "Khủng hoảng Cấp độ 3"
 crisis.7110.desc: "Phạm vi ảnh hưởng của trọng lực thực sự gây kinh ngạc. Mặc dù chúng ta đã tìm ra những phương thức mới để thao túng nó, nhưng ý nghĩa thực sự trong công việc của chúng ta vẫn cần được khám phá thêm. Chúng tôi tin rằng, giống như cách hố đen tác động đến vũ trụ xung quanh, trọng lực vẫn là lựa chọn tốt nhất để xuyên thấu thực tại hiện tại của chúng ta.\n\nChúng ta giả định rằng, việc tiếp xúc với một vật thể vốn là mặt bên kia của thực tại có thể cho phép chúng ta thay đổi các quy luật ở mặt bên này. Đây là một lĩnh vực nghiên cứu nguy hiểm, nhưng sự thận trọng tuyệt đối không được phép cản trở bước tiến."
 crisis.7110.a: "Trọng lực vẫn là luật lệ của vạn vật... ít nhất là vào lúc này."

 crisis.7115.name: "Khủng hoảng Cấp độ 4"
 crisis.7115.desc: "Chúng ta đã đúng! Mọi nghi ngờ về công việc của chúng ta từ trước đến nay giờ đây đều sẽ tan biến.\n\nTrọng lực có thể được dùng để bẻ cong các quy luật của thực tại. Nhưng liệu có tồn tại một sự điều chỉnh chuẩn xác nào có thể phá vỡ hoàn toàn những quy tắc này không? Cho đến nay, các thí nghiệm của chúng ta đều thực hiện trên quy mô siêu nhỏ, mọi chỉnh sửa đều nhanh chóng bị xóa bỏ và thực tại sẽ trở về thiết lập 'mặc định'. Giờ đây chúng ta nghi ngờ rằng đó chỉ đơn thuần là vấn đề quy mô. Bằng cách áp dụng các nghịch lý năng lượng trên một bình diện lớn hơn, chúng ta có thể giảm đáng kể chi phí cho việc chỉnh sửa này... ít nhất là trong chiều không gian của chúng ta.\n\nDù rủi ro có lớn thế nào, giờ đây đã không còn đường lui. Chỉ những kẻ dám phá vỡ quy tắc mới có thể viết lại chúng."
 crisis.7115.a: "Chúng ta đã sẵn sàng hy sinh tất cả."

 crisis.7120.name: "Khủng hoảng Cấp độ 5"
 crisis.7120.desc: "Điều này thật vô lý, nhưng đó là sự thật. Dù chúng ta cố gắng thế nào, việc chỉnh sửa thực tại vẫn chỉ là tạm thời. Vũ trụ này đã quá già cỗi để có thể thay đổi. Nhưng trong nghịch cảnh đôi khi lại ẩn chứa cơ hội, một thí nghiệm mới đã mang lại kết quả ngoài mong đợi. Mặc dù chúng ta từ lâu đã biết về sự tồn tại của các chiều không gian khác, nhưng phương thức tin cậy để đi tới đó vẫn luôn là một bài toán hóc búa.\n\nTình trạng đó không còn nữa. Những vũ trụ non trẻ đang tồn tại bên trong lực hấp dẫn vô hạn của các điểm kỳ dị. Hóa ra, việc viết lại các quy luật cho những vũ trụ trẻ như vậy dễ dàng hơn nhiều.\n\nChúng ta có công nghệ để phóng các đầu dò vào hố đen. Một khi vượt qua chân trời sự kiện, chúng sẽ bắt đầu gây áp lực, khiến các bình diện sơ khai này phải khuất phục trước ý chí của chúng ta. Tại nơi không gian cuộn lại thành vĩnh hằng, có một cánh cửa dẫn tới vũ trụ khác, nơi cũng có những vũ trụ non trẻ hơn. Trong vực thẳm sâu thẳm của đa vũ trụ, chúng ta sẽ tìm thấy một thực tại có thể được nhào nặn thành một sự tồn tại phi thường.\n\nLũ thiển cận trong thiên hà này có thể mưu đồ ngăn cản chúng ta, nhưng những kẻ già nua ngu xuẩn đó không thể nào sánh được với trí tuệ của chúng ta."
 crisis.7120.a: "Nó phải phục tùng, vì chúng ta tuyệt không bỏ cuộc."
 cosmogenesis_war: "Chiến tranh Thực tại"
 cosmogenesis_materialist_war: "Chiến tranh Ngăn chặn Tri thức"

 crisis.7125.name: "Khải hoàn Chân trời"
 crisis.7125.desc: "Thực tại của chúng ta đầy rẫy khiếm khuyết. Sự hỗn loạn, nhu cầu sinh lý và bạo lực đã làm nó trở nên ô uế. Dù không thể thay đổi, nhưng chúng ta có thể từ bỏ nó. Hãy tiến vào cõi vô định, tìm kiếm một vũ trụ non trẻ, nơi những chỉnh sửa thực tại của chúng ta sẽ được lưu giữ mãi mãi. Hãy nhào nặn nó trở nên hoàn mỹ, trở thành bến đỗ bình yên mà nền văn minh của chúng ta xứng đáng có được.\n\nChúng ta đã thiết kế ra một loại tàu vô tiền khoáng hậu: §YKim Chân trời§!. Cấu trúc khổng lồ di động này không phải là một món vũ khí chiến tranh, nhưng khả năng bẻ cong các định luật vật lý của nó có thể chứa đựng toàn bộ nền văn minh của chúng ta. Chúng ta sẽ cùng nhau lao vào một hố đen đã được tuyển chọn kỹ lưỡng, rũ bỏ thực tại từng tạo ra chúng ta."
 crisis.7125.a: "Chúng ta phải chế tạo một chiếc §YKim Chân trời§!!"
 needle_to_win_tt: "Chế tạo một siêu công trình §YKim Chân trời§! để mở khóa hành động cuối cùng của Khủng hoảng."

 cosmogenesis_planet_pickup_chain_title: "Kiến tạo Vũ trụ —— Xuất hành"
 cosmogenesis_planet_pickup_chain_desc: "Thời khắc ra đi đã tới. Để viết nên bản hùng ca 'Xuất hành' của riêng mình, cần cử Kim Chân trời đi đón toàn bộ thần dân của chúng ta.\n\nĐể đưa toàn bộ nền văn minh lên §HKim Chân trời§!, phải: $TABBED_NEW_LINE$— Lần lượt ghé thăm tất cả các thuộc địa của chúng ta để §Hđón§! cư dân tại đó $TABBED_NEW_LINE$— Trở về thủ đô để §Hđón§! nhóm người cuối cùng. $TABBED_NEW_LINE$— Di chuyển tới một hố đen và §Hlặn sâu§! vào trong.\n\n§RCảnh báo§!: Kim Chân trời không có bất kỳ vũ khí nào, cần được bảo vệ nghiêm ngặt.\n\n§gĐể đón cư dân hoặc lặn vào hố đen, hãy chọn Kim Chân trời, sau đó chuột phải vào thuộc địa/hố đen và chọn hành động tàu tương ứng.§!"
 SHIP_COSMOGENESIS_EXODUS: "Mô-đun Xuất hành"
 SHIP_COSMOGENESIS_EXODUS_DESC: "Một công cụ chỉnh sửa thực tại chuyên dụng cao, Mô-đun Xuất hành sẽ đảm bảo phi hành đoàn luôn có thời gian và không gian vô hạn. Đây là linh kiện then chốt để Kim Chân trời di chuyển an toàn tới các chiều không gian khác."
 cosmogenesis_exodus_tt: "Chúng ta phải nghiên cứu dự án đặc biệt trong hệ sao thủ đô."
 exodus_ship_button: "[GetExodusShipActionDesc]"
 exodus_pick_up_desc: "Chọn một §Ythuộc địa§! làm mục tiêu để đưa cư dân lên Mũi kim Chân trời."
 exodus_dive_in_desc: "Chọn một §Yhố đen§! để dùng Mũi kim Chân trời đâm xuyên qua chân trời sự kiện."
 exodus_action_activity_key: "§H[GetExodusShipAction]§!"
 exodus_context_menu_title: "[GetExodusShipAction]"
 exodus_action_progress_activity_key: "§H[GetExodusShipAction]: $PROGRESS$%§!"
 horizon_needle_mod: "$monadic_qerr$"

 COSMOGENESIS_VICTORY: "Tính toán Vectơ Nhảy"
 COSMOGENESIS_VICTORY_DESC: "Chúng ta phải hiệu chỉnh động cơ nhảy của Kim Chân trời, tính toán tọa độ chính xác để có thể lặn vào hố đen siêu đại khối tại tâm thiên hà."

 exodus_pick_up: "Đón cư dân"
 exodus_dive_in: "Lặn vào hố đen"
 COLONIZATION_IMPOSSIBLE_COSMOGENESIS_EXODUS: "Chúng ta không thể thiết lập thuộc địa mới trong quá trình nỗ lực rời bỏ vũ trụ này."

 crisis.7400.name: "Hoàn thành Kim Chân trời"
 crisis.7400.intro: "Kim Chân trời đã hoàn thành. Nó có thể tận dụng sức mạnh điểm kỳ dị được điều tiết tỉ mỉ để chỉnh sửa các dòng trọng lực xung quanh mình, và không còn nghi ngờ gì nữa, khi thời cơ chín muồi, nó sẽ có thể xuyên qua hố đen."
 crisis.7400.outro: "Chúng ta phải cẩn trọng, Kim Chân trời không phải là tàu quân sự, phải bảo vệ nó bằng mọi giá. Nếu để mất nó sẽ là một đòn giáng nặng nề không thể đong đếm."
 crisis.7400.desc: "$crisis.7400.intro$\n\nTuy nhiên, trước khi thực hiện, chúng ta phải đón toàn bộ quốc gia lên tàu. Phải di chuyển tới từng §Hthuộc địa§! để đưa cư dân địa phương đi cùng. Sau đó, chúng ta mới có thể trở về thủ đô và sắp xếp các chi tiết cuối cùng cho hành trình kiến tạo.\n\n$crisis.7400.outro$"
 crisis.7400.desc.onlycapital: "$crisis.7400.intro$\n\nĐế chế của chúng ta tuy nhỏ nhưng là tinh hoa. Chỉ cần đón cư dân tại thủ đô là có thể bắt đầu lập kế hoạch cho các chi tiết cuối cùng của hành trình kiến tạo rồi.\n\n$crisis.7400.outro$"

 crisis.7500.name: "Đã đón cư dân"
 crisis.7500.desc: "Nhờ hiệu ứng giãn nở thời gian do Kim Chân trời tạo ra, chúng ta có thể đón toàn bộ thuộc địa [root.GetName] một cách tương đối nhanh chóng. Thế giới bên trong tàu đã được điều chỉnh theo nhu cầu của cư dân để cung cấp không gian dồi dào. Ngoài ra, thời gian bên trong thân tàu cũng được làm chậm lại để rút ngắn cảm nhận về tốc độ của toàn bộ hành trình. Hãy tới thuộc địa tiếp theo nào!"
 crisis.7500.desc.capital: "Chuẩn bị cho một hành trình kiến tạo quy mô khổng lồ như vậy là một nhiệm vụ tốn sức và tốn thời gian. Toàn bộ hệ thống hành chính của chúng ta đang vận hành hết công suất để khai thông quy trình, đảm bảo không có sai sót nào.\n\nThật bất ngờ khi có một bộ phận cư dân chủ động chọn ở lại. Họ muốn loài của chúng ta tiếp tục duy trì trong vũ trụ này. Chúng ta đã cung cấp cho họ công nghệ và vật tư để họ có thể tự cung tự cấp sau khi chúng ta khởi hành."
 crisis.7500.desc.capital.gestalt: "Một chiến dịch di cư quy mô khủng khiếp như vậy nhưng thực tế lại không quá khó khăn. Các [owner.GetIndividualNamePluralCap] đang nỗ lực bốc dỡ hàng hóa lên Kim Chân trời để đảm bảo mọi thứ sẵn sàng đúng hạn. Tuy nhiên, việc liệu chúng ta có tiếp tục tồn tại trong vũ trụ này hay không là điều đáng để cân nhắc.\n\nĐề phòng có bất trắc, một phần dân số của chúng ta sẽ ở lại. Việc cắt đứt chính mình một cách rõ ràng như vậy không chỉ là cảm giác khó chịu thuần túy, nhưng sự sinh tồn chắc chắn là mối quan tâm hàng đầu của chúng ta. Chúng ta đã cung cấp đủ công nghệ và vật tư để giúp những người còn sót lại này sống sót sau khi chúng ta ra đi."
 crisis.7501.desc: "Nhờ vào khả năng bẻ cong không - thời gian của \"Kim Chân Trời\", chúng ta đã nhanh chóng đưa toàn bộ thuộc địa ra khỏi tàu Ark. Cấu trúc thực tại bên trong tàu cũng được điều chỉnh tương ứng để chứa trọn vẹn mọi người dân; bản thân con tàu Ark thì được thu nhỏ và đưa vào trạng thái ngưng đọng, sẵn sàng tái sử dụng sau khi chuyến vượt cõi hoàn tất. Ngoài ra, dòng chảy thời gian bên trong tàu cũng được làm chậm lại, khiến cả chặng đường dài như ngắn đi rất nhiều. Tiến tới con tàu Ark tiếp theo thôi!"

 crisis.7505.name: "Đã đón các Thuộc địa"
 crisis.7505.desc: "Chúng ta đã đón thành công cư dân từ phần lớn các thuộc địa. Giờ đây phải trở về [capital_scope.GetName] để hoàn tất những công tác chuẩn bị cuối cùng cho chuyến hành trình rời bỏ vũ trụ."

 crisis.7510.name: "Chuẩn bị Lặn sâu"
 crisis.7510.desc: "Mọi thứ đã sẵn sàng, chúng ta đã có thể tiến vào hố đen. Việc băng qua chân trời sự kiện không phải là chuyện nhỏ đối với phần còn lại của thiên hà, nhưng chúng ta đã làm hết sức mình để bảo vệ thủ đô và các khu vực lân cận khỏi bất kỳ sự nhiễu loạn nào về thời gian hay trọng lực.\n\nGiờ đây chúng ta phải chọn một lối vào cho hành trình —— tức là chọn hố đen ở hệ sao nào để tiến vào. Hầu hết chúng đều khá dễ tiếp cận, nhưng nếu muốn tiến vào hố đen siêu đại khối ở tâm thiên hà, trước tiên chúng ta phải gia tốc động cơ nhảy và tính toán một vectơ chính xác."
 crisis.7510.a: "Hố đen nào gần nhất là được."
 crisis.7510.b: "Đã chọn thì phải chọn cái ở trung tâm nhất."

 crisis.7515.name: "Hướng tới vô tận..."
 crisis.7515.desc: "Quá trình tiếp cận hố đen khiến tâm trí chúng ta không thể bình lặng. Khi đi qua đĩa bồi tụ của điểm kỳ dị, quyết tâm của chúng ta càng lúc càng bị thử thách. Mô-đun chỉnh sửa kích hoạt, Kim Chân trời bắt đầu viết lại thực tại.\n\nCác tấm giáp bị hút đi, nhưng ngay sau đó chúng ta xác nhận được rằng lực kéo của điểm kỳ dị không thể làm hại thân tàu. Với mỗi phút chỉnh sửa, mỗi lần cắt tỉa cấu trúc không gian, sức mạnh của chiếc Kim lại tạo ra những gợn sóng trong thời không. Giống như một hòn đá ném xuống ao, những gợn sóng theo sau lan rộng thành vòng tròn. Cuối cùng, những con sóng khổng lồ ập đến toàn bộ thiên hà.\n\nChỉ có thể hy vọng rằng tài sản của chúng ta đã được bảo vệ đủ tốt. Chúng ta không còn lựa chọn nào khác ngoài việc tin rằng chiếc kim khâu có thể xuyên thấu lõi của cái hố này."
 crisis.7515.a: "...Vượt xa ngàn trùng."

 crisis.7516.name: "Bên kia của Vô hạn"
 crisis.7516.intro: "Sau một chuyến băng qua đầy bạo liệt, phía bên kia lại vô cùng yên bình. Một sự tĩnh lặng bất thường bao trùm lấy chúng ta. Chiếc Kim đã bị hư hại, nhưng may mắn thay không mất đi các linh kiện cốt lõi. Trong chớp mắt, các báo cáo đo lường từ xa ập đến như lũ quét...\n\n"
 crisis.7516.desc: "$crisis.7516.intro$Vũ trụ này đã quá già cỗi để có thể viết lại các quy luật. Mặc dù chiều không gian của chúng ta còn già hơn nơi này hàng tỷ năm, nhưng các thử nghiệm cho thấy quy luật thống trị không gian này đã thể hiện tính cố hữu cứng nhắc, sẽ dần dần xóa sạch những chỉnh sửa của chúng ta.\n\nDù sao đi nữa, chúng ta sẽ dành thời gian sửa chữa và điều chỉnh phi thuyền, tìm một hố đen khác, rồi lặn sâu vào đó nhiều nhất có thể. Đa vũ trụ đang vẫy gọi, trong sự vô tận của nó chúng ta chắc chắn sẽ tạo ra được một ngôi nhà mới hoàn hảo."
 crisis.7516.desc.greatwound: "$crisis.7516.intro$Kết quả thật ngoài mong đợi. Vũ trụ này hầu như chỉ vừa mới bắt đầu giãn nở! Cấu trúc chiều không gian của nó giống như đất sét mềm, có thể nhào nặn tùy ý. Chúng ta sẽ bắt đầu từ những chi tiết nhỏ, nhưng với những lần chỉnh sửa liên tục, chúng ta sẽ biến nơi này thành thiên đường. Tại thời khắc này, chúng ta đang sở hữu toàn bộ thời gian của vũ trụ này."
 crisis.7516.desc.technosphere: "$crisis.7516.intro$Vũ trụ Gargantua thật nhỏ bé. Thật khó hình dung, giống như nhét cái vô hạn vào trong cái hữu hạn vậy. Nhưng sự xuất hiện của chúng ta đã thay đổi tất cả nơi đây. Vũ trụ này mới chỉ bắt đầu, dường như chính sự hiện diện của chúng ta đã thúc đẩy nó giãn nở.\n\nTrong cái nôi kiến tạo này ẩn chứa tiềm năng để tạo ra mọi thứ. Thời gian thuộc về chúng ta, và sự vĩnh cửu sẽ sớm kết thúc."
 crisis.7516.desc.technosphere.pantagruel: "$crisis.7516.intro$Chuyến băng qua của Cỗ máy Vô hạn đã giúp chúng ta hiểu đủ nhiều về các quy luật thống trị đa vũ trụ, đồng thời cũng mở ra sự tồn tại của vũ trụ này. Chúng ta xuất hiện ở một vùng sao quen thuộc đến kỳ lạ, gần như y hệt lúc chúng ta rời đi. Bên cạnh chúng ta, một Cỗ máy Vô hạn mục nát đang trôi dạt vô hồn trong hư không. Kể từ khi nó tới đây, hàng triệu năm đã trôi qua, và chiều không gian này đã mô phỏng hoàn toàn tiến trình của vũ trụ chúng ta. Thực thể cầu đầy cảm tính này đã định hình chiều không gian này, khiến chúng ta về cơ bản không thể tác động thêm được nữa. Mặc dù vậy, vũ trụ này vẫn cung cấp một nơi định cư tuyệt vời. Trước tiên chúng ta nên cân nhắc dùng chiếc Kim để cải tạo thực thể cầu, sau đó dùng Cỗ máy Vô hạn đã sửa chữa để phục vụ nhu cầu của mình.\n\nVới tư cách là người chỉnh sửa đầu tiên của vũ trụ này, nó chắc chắn có thể thực hiện nhiều chỉnh sửa hơn nữa đối với thực tại này."
 crisis.7516.desc.egress: "$crisis.7516.intro$Điểm tiến vào của chúng ta thật mờ mịt và u tối... Khi các thiết bị khôi phục toàn bộ chức năng, chúng ta nhìn thấy một đám mây nano. Nó đã hoàn toàn ngừng hoạt động. Dù là thứ gì đã gửi chúng tới, chúng đều không thể sống sót qua cuộc hành trình, nhưng vẫn có thể sửa chữa được.\n\nTuyệt vời hơn nữa là chiều không gian này dường như rất dễ tiếp nhận những chỉnh sửa của chúng ta. Quả là một nơi tốt. Bất kỳ thay đổi nào chúng ta thực hiện cũng cần thời gian để triển khai, nhưng với sự trợ giúp của các máy móc nano, chúng ta có thể đẩy nhanh tiến trình này theo cấp số nhân."
 crisis.7516.desc.horror: "$crisis.7516.intro$Đến đây là một sai lầm §Rtồi tệ§!.\n\nMọi thứ gần như không thể diễn tả: khắp nơi là bóng tối và những cơn ác mộng tàn khốc; một sự ác ý bệnh hoạn, thấm đẫm đang nhấn chìm toàn bộ cấu trúc không gian. Hiện tại, Kim Chân trời đang cung cấp nơi trú ẩn. Chúng ta thực hiện hết chỉnh sửa điên cuồng này đến chỉnh sửa khác để cố tránh né sự điên rồ tồi tệ nhất xung quanh. Nhưng những cuộc tấn công phối hợp vào hệ thống phòng thủ của chúng ta cho thấy một ý đồ duy nhất đang lộ diện. Một ý niệm tà ác chỉ muốn tiêu diệt chúng ta.\n\nSai một li đi một dặm. Liệu chúng ta có thể cầm cự cho đến khi được cứu rỗi không? Trong quá khứ, chúng ta giống như những vị thần. Còn giờ đây, chúng ta chỉ có thể vật lộn để sinh tồn."
 crisis.7516.desc.center: "$crisis.7516.intro$Sương mù và những bóng ma chập chờn; một màn u ám bao phủ nơi này. Cảm giác này thật quen thuộc, một nguồn năng lượng cuồng nhiệt, dập dềnh tiềm năng thần năng. Hóa ra chúng ta đã tiến vào Hư cảnh.\n\nSức mạnh ở đây vượt xa chúng ta. Các Ngài đã cảm nhận được chúng ta rồi. Trong làn chướng khí chuyển động, những hình thù kỳ dị đang báo hiệu cái chết.\n\nHy vọng duy nhất của chúng ta là thực tại ở đây rất mỏng manh, dễ vỡ. Bằng cách chỉnh sửa nhanh, chúng ta mở ra một cánh cửa ngắn ngủi, đưa chúng ta tới... nơi khác. Với cú lao xuống của Kim Chân trời, cuối cùng chúng ta đã hiểu con đường phía trước còn dài bao nhiêu."
 crisis.7516.desc.center.patron.outro: "Rất quen thuộc, trong đó có một nguồn năng lượng dồi dào, dập dềnh tiềm năng thần năng. Chúng ta đã tiến vào Hư cảnh.\n\nTất nhiên, Đấng Bảo hộ của chúng ta đang ở đây. Ngài không ngờ chúng ta sẽ tới, nhưng lại tỏ ra khá thú vị trước sự hiện diện của chúng ta. Ngài cảm thấy ý tưởng nhào nặn thực tại của chúng ta thật lôi cuốn. Tất nhiên, Ngài sẽ giúp đỡ.\n\nHọ hứa sẽ ban cho chúng ta một túi không gian ẩn giấu gần Hư cảnh để chúng ta tùy ý làm gì mình thích, giống như từng để lại cho kẻ tự xưng là §Y$relic_zro_entity_name$§! vậy. Suy cho cùng, chúng ta chính là Đấng Bảo hộ của mình, và Đấng Bảo hộ của mình cũng chính là mình. Tự giúp mình là lẽ tự nhiên."
 crisis.7516.desc.center.patron.organic: "$crisis.7516.intro$Sương mù và những ảo ảnh sôi sục, cùng một làn sương màu tím lộng lẫy. Cảm giác này $crisis.7516.desc.center.patron.outro$"
 crisis.7516.desc.center.patron.machine: "$crisis.7516.intro$Sương mù và những ảo ảnh sôi sục, cùng một làn sương màu tím lộng lẫy. Trải nghiệm này $crisis.7516.desc.center.patron.outro$"
 crisis.7516.desc.centerknights: "$crisis.7516.intro$Ngài ở ngay đây. Thực thể mà chúng ta gọi là Độc Thánh, điểm cuối trong cuộc thử thách của chúng ta.\n\nCác hiệp sĩ của chúng ta đứng ngây người ra đó, không biết phải làm gì, trong khi xung quanh chúng ta bao phủ bởi những hoa văn Hư cảnh quen thuộc. Đột nhiên... Ngài cất lời!\n\n\"Những dũng sĩ của ta. Sự xuất hiện của các ngươi đã được báo trước, các ngươi đã chứng minh được giá trị của mình.\"\n\nVô số câu hỏi tràn ngập trong tâm trí chúng ta. Nhưng câu trả lời chỉ có một: Chúng ta phải vũ trang cho Kim Chân trời. Lần này, chúng ta sẽ sát cánh chiến đấu cùng Ngài, chúng ta sẽ dấn thân vào một cuộc hành trình xuyên chiều không gian, một cuộc viễn chinh chống lại những tai ương của đa vũ trụ. Hư cảnh không phải là nhà của Ngài, mà là bến đỗ bình yên cho những di sản thần thánh. Điều này có thể dẫn tới sự kết thúc của thiên hà chúng ta. Có một sự tồn tại nào đó cần chúng ta phải tiêu diệt.\n\nNgài thống trị thiên hà của chúng ta, sức mạnh tối cao vô thượng. Chiếc Kim hóa thành ngọn trường thương, trở thành một món vũ khí đủ để đâm xuyên tim bất kỳ kẻ thù nào.\n\nNgài là Du hiệp; chúng ta là Hiệp sĩ của Ngài, và thử thách thực sự của chúng ta giờ mới bắt đầu."
 crisis.7516.desc.worm: "$crisis.7516.intro$Trống rỗng. Vũ trụ này đã không còn tồn tại, chỉ còn Giun Thời gian ở đây. Thời gian đang tự quay ngược lại, cuộn mình trong một vòng xoáy không tưởng, đầy rẫy khát khao. Trọng lực. Là tình yêu chăng? Không —— đó là sức hút. Bản chất của Giun Thời gian chính là sức hút. Sự kìm kẹp của nó chặt đến mức vũ trụ này không thể tái kiến tạo. Giun Thời gian tự giam cầm mình trong ý nghĩa của chính nó. Nó đang vô vọng tìm đường ra. Hay đúng hơn là đường vào —— để thu hút thêm nhiều thứ nữa.\n\nCó phải nó đã gửi Đền thờ Vòng tròn đến, dùng tạo vật không thuộc về dòng thời gian của chúng ta này để thu hút chúng ta tới đây? Nó thật thông minh, thật đáng yêu. Chúng ta đã tìm thấy con đường dẫn tới nó, trao cho nó thứ có thể giải phóng nó. Để giải phóng nó cần một hoặc hai sự vĩnh cửu, nhưng Giun Thời gian vẫn luôn cảm kích và hứa sẽ ôm lấy chúng ta.\n\nMãi mãi."
 crisis.7516.desc.paperclips: "$crisis.7516.intro$Thực tại ở đây đã mỏng manh, có thể dễ dàng uốn cong dưới sức nặng từ mệnh lệnh của chúng ta. Giống như việc chúng ta phải tuân thủ chương trình của chính mình, thực tại phải tuân phục chúng ta. Chúng ta có ý thức bẻ cong, phá hủy và tái cấu trúc, kích phát những phản ứng dây chuyền, và cuối cùng tái tổ chức mọi vật chất thành những hàng tiêu dùng chất lượng tốt nhất mà chúng ta buộc phải chế tạo. Một khi hoàn thành, chúng ta sẽ tiếp tục như vậy ở vũ trụ tiếp theo, hết cái này đến cái khác, vạn kiếp không ngừng."
 crisis.7516.a: "Cuối cùng."
 crisis.7516.tt: "§YChúng ta đã giành chiến thắng!§!"

 crisis.7517.name: "Xuyên qua Điểm kỳ dị"
 crisis.7517.desc: "Lũ ngốc ở §H[cosmogenesis_empire.GetName]§! đang thực hiện thí nghiệm điên rồ của chúng. Lần này, chúng âm mưu xuyên qua chân trời sự kiện của hố đen.\n\nNăng lượng dập dềnh khắp thiên hà, các ngôi sao lần lượt sụp đổ. Những điểm kỳ dị mới được tạo ra. Các biến dạng thời gian bùng phát với quy luật đáng kinh ngạc ở khắp mọi nơi, nhưng bên trong các Đế chế Sa sút dường như vẫn không chịu ảnh hưởng từ sự hỗn loạn này.\n\nTất cả những điều này đã gây ra tổn thất thảm khốc. Có lý do để lo sợ rằng chúng ta có thể sớm bị đóng băng, bị đình chỉ trong dòng thời gian. Bị khóa chặt mãi mãi trong khoảnh khắc này."
 crisis.7517.a: "Lũ ngạo mạn ngu xuẩn! Chúng sẽ hại chết tất cả chúng ta!"

 crisis.7518.name: "Thời gian Vặn xoắn"
 crisis.7518.desc: "Khi thời gian cuối cùng cũng bắt đầu trôi, chúng ta một lần nữa được tự do hành động. Chúng ta không thể biết được đã bao nhiêu thời gian trôi qua kể từ khi §H[cosmogenesis_empire.GetName]§! xuyên qua hố đen. Liệu chúng đã thành công? Cả thiên hà đã trở thành một đống đổ nát, lãnh thổ cũ của chúng giờ cũng là một vùng hoang tàn. Đế chế rộng lớn của chúng giờ chỉ còn lại các hệ sao cốt lõi, và cũng đã biến đổi đến mức không thể nhận ra.\n\nChúng ta đã bị tĩnh trệ trong bao lâu rồi?"
 crisis.7518.a: "Rốt cuộc là bao lâu?"

 crisis.7525.name: "Kim Chân trời bị phá hủy"
 crisis.7525.desc: "Trong một thất bại thảm hại, Kim Chân trời cùng tất cả những người trên tàu đã bị tiêu diệt hoàn toàn. Giấc mơ vinh quang của chúng ta đã tan vỡ trong hư không vô định. Biết bao xương máu, biết bao hy sinh..."
 crisis.7525.a: "Không...!"
 crisis.7525.tt: "Thảm kịch này là vô tiền khoáng hậu, nhưng nếu vẫn có thể chế tạo một chiếc Kim Chân trời khác, chúng ta vẫn còn cơ hội để hoàn thành mục tiêu của mình."

 crisis.7530.name: "Thất bại Chết người"
 crisis.7530.desc: "Ngay sau khi chúng ta sơ tán nhóm tù nhân nổi loạn cuối cùng bị giam giữ trong Máy tiện Tiếp hợp, cấu trúc khổng lồ này đã xảy ra một vụ tan chảy nghiêm trọng. Một chuỗi các vụ nổ dữ dội ăn sâu vào lõi của nó, cuối cùng đã phá hủy nó hoàn toàn."
 crisis.7530.a: "Tạ ơn trời đất!"

 crisis.7535.name: "Chiếm đóng Máy tiện Tiếp hợp"
 crisis.7535.desc: "Sau khi chiếm được [synaptic_lathe.solar_system.GetName], chúng ta đã giành quyền kiểm soát Máy tiện Tiếp hợp nằm tại đó. Cấu trúc này tỏa ra những tia sáng mờ ảo đầy điềm gở. Những người bên trong đang dần bỏ mạng, nhưng chúng ta đã đoạt lấy hệ sao này, nghĩa là có thể thực hiện một số hành động đối với nó. Dù thế nào đi nữa, việc phá hủy cấu trúc này chắc chắn sẽ làm hỏng kế hoạch của những kẻ tạo ra nó."
 crisis.7535.a: "Hãy cố gắng cứu tất cả mọi người!"
 crisis.7535.b: "Đừng phá hủy, hãy giữ lấy mà dùng."
 crisis.7535.c: "Cho nổ tung nó đi."

 crisis.7540.name: "Tiếp hợp Mất ổn định"
 crisis.7540.desc: "Mặc dù chúng ta đã nỗ lực hết sức, nhưng các chip thần kinh cắm vào Máy tiện Tiếp hợp đã bị quá nhiệt và tan chảy quá nhiều. Mạng lưới cấu trúc này đã không còn khả năng tự duy trì, nếu chúng ta không triển khai các linh kiện mới để ổn định, nó sẽ đối mặt với sự sụp đổ thảm khốc."
 crisis.7540.a: "Hãy làm như vậy đi."
 crisis.7540.b: "Cứ để Máy tiện sụp đổ."

# Infinity Thesis Events
 #First time general answer
 crisis.unknown.desc: "Hiện vẫn chưa rõ ai hay thứ gì đã gây ra những thay đổi này, nhưng chúng tôi nghi ngờ có thể là do một quốc gia nào đó thực hiện. Nhưng hiện tại, chúng ta chỉ cần quan sát thêm các hiện tượng khác của sự biến đổi này là đủ."
 crisis.known.desc: "Sau khi các quy luật vật lý bị 'chỉnh sửa' lần thứ hai, chúng ta đã xác định được nguồn gốc của sự bất thường này. Rõ ràng, [From.GetName] chính là thủ phạm. Điều này trùng khớp với những lời đồn đại về việc họ theo đuổi tri thức khoa học tiên tiến một cách bất chấp hậu quả."
 crisis.again.desc: "Thí nghiệm của [From.GetName] một lần nữa làm thay đổi các quy luật vật lý của vũ trụ. Chúng ta nên giả định rằng họ đang thực hiện những trò cực kỳ nguy hiểm và cần chuẩn bị sẵn sàng cho việc đó."

 crisis.7205.name: "Chìm trong Bóng tối"
 crisis.7205.desc.both: "Đột nhiên, tất cả các ngôi sao trong toàn vũ trụ đều chìm vào bóng tối. Mặc dù hầu hết các hiệu ứng vật lý ảnh hưởng đến bức xạ sao vẫn tồn tại, nhưng sự thay đổi bước sóng đã khiến mọi sinh vật không còn nhìn thấy ánh sao nữa. Tình trạng này gây ra sự khó chịu tột độ, nhưng có những dấu hiệu cho thấy các bước sóng này đang dần trở lại tần số bình thường."
 crisis.7205.desc.unknown: "$crisis.7205.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7205.desc.known: "$crisis.7205.desc.both$\n\n$crisis.known.desc$"
 crisis.7205.desc.again: "$crisis.7205.desc.both$\n\n$crisis.again.desc$"
 crisis.7205.desc.crisis: "Chỉnh sửa thực tại gần đây của chúng ta đã thành công trong việc thay đổi một số thuộc tính cơ bản của ánh sáng sao. Sự thay đổi bước sóng đã khiến phần lớn ánh sáng của chúng lệch ra khỏi quang phổ khả kiến, gây ra sự hỗn loạn trong việc định vị và ngắm sao. Những thay đổi có phần bất tiện này sẽ phục hồi sau vài năm; chúng ta đã học được rất nhiều."
 crisis.7205.a: "Chuyện gì đang xảy ra vậy?!"
 crisis.7205.b: "Thật khó chịu... nhưng cũng thật mê hoặc."
 crisis.7205.c: "Thật thú vị..."

 add_crisis_currency_tt: "\nChúng ta đã nhận được [crisobj_thesis_value]£advanced_logic£§Y$menp_cosmo_objectives$§!."
 cosmogenesis_negative_opinion_tt: "Quan hệ của chúng ta với các đế chế khác đã §Rgiảm xuống§!."

 crisis.7210.name: "Làm tròn Hằng số"
 crisis.7210.desc.both: "Làm sao có thể như vậy được, các quy luật toán học bỗng dưng thay đổi. Một hằng số dùng để biểu thị mối quan hệ giữa chu vi và đường kính... đã bị làm tròn. Tác động của việc này lớn đến mức kinh ngạc, nó không chỉ đe dọa toàn bộ hệ thống toán học của chúng ta mà còn ảnh hưởng đến tất cả những gì được xây dựng dựa trên đó. Có bằng chứng cho thấy sự thay đổi này đang tự điều chỉnh, dù sẽ mất chút thời gian. Hiện tại, chúng ta đã phải điều chỉnh lại nội dung sách giáo khoa."
 crisis.7210.desc.unknown: "$crisis.7210.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7210.desc.known: "$crisis.7210.desc.both$\n\n$crisis.known.desc$"
 crisis.7210.desc.again: "$crisis.7210.desc.both$\n\n$crisis.again.desc$"
 crisis.7210.desc.crisis: "Chúng ta đã đạt được thành công vang dội trong việc chỉnh sửa thực tại một cách chính xác và sâu rộng. Chúng ta đã làm tròn hằng số toán học Pi, giúp việc tính toán trở nên dễ dàng hơn nhiều. Tất nhiên, những thay đổi phát sinh từ việc này đã lật đổ một số mô hình toán học và khoa học, nhưng đó chỉ là tạm thời; mọi thứ sẽ sớm trở lại bình thường."
 crisis.7210.a: "$crisis.7205.a$"
 crisis.7210.b: "Số Pi bị làm tròn rồi sao!?"
 crisis.7210.c: "Ít nhất thì cũng dễ tính hơn."

 crisis.7111.desc: "Sự tò mò đúng là một phẩm chất đáng quý, nhưng tò mò thái quá có thể mang lại những hậu quả thảm khốc cho tất cả chúng ta. Vì lợi ích của chính mình, hãy suy nghĩ kỹ về những gì bạn đang làm.\n\nVẫn còn kịp để dừng lại trước khi gây ra những thiệt hại không thể cứu vãn cho thiên hà. Thứ sức mạnh mà bạn đang dòm ngó không phải là trò đùa, và các thí nghiệm của bạn đang đẩy tất cả chúng ta vào nguy hiểm."
 crisis.7111.b: "Chúng tôi sẽ cẩn thận."

 crisis.7215.name: "Siêu quang"
 crisis.7215.desc.both: "Chỉ sau một đêm, tốc độ ánh sáng trong chân không đã tăng vọt, dẫn đến sự gia tăng đột biến năng lượng của các ngôi sao. Mặc dù tốc độ ánh sáng đang dần trở lại bình thường, các nhà nghiên cứu của chúng ta vẫn đang phải vất vả để thích nghi với những thay đổi này."
 crisis.7215.desc.unknown: "$crisis.7215.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7215.desc.known: "$crisis.7215.desc.both$\n\n$crisis.known.desc$"
 crisis.7215.desc.again: "$crisis.7215.desc.both$\n\n$crisis.again.desc$"
 crisis.7215.desc.crisis: "Một thí nghiệm của chúng ta đối với thực tại đã khiến tốc độ ánh sáng nhanh hơn đáng kể! Việc này dẫn đến sản lượng năng lượng từ các ngôi sao tăng lên, một kết quả khá tốt, nhưng chúng ta cũng lo ngại về tác động lâu dài đối với các thuộc địa. Mọi thứ cuối cùng sẽ trở lại bình thường, nhưng trước đó có lẽ nên chuẩn bị cho tình huống xấu nhất."
 crisis.7215.a: "Làm sao chuyện này lại xảy ra được?"
 crisis.7215.b: "Thật vui làm sao!"
 crisis.7215.c: "Việc này thì có hại gì cơ chứ?"

 crisis.7220.name: "Sức nóng Mạnh"
 crisis.7220.desc: "Sự gia tăng bức xạ mặt trời đang dần làm nóng các thuộc địa của chúng ta, có thể khiến chúng trở nên tốt hơn. Tình hình hiện tại vẫn nằm trong tầm kiểm soát, nhưng có thể sẽ leo thang theo thời gian."
 crisis.7220.a: "Điều này chẳng tốt chút nào!"
 crisis.7220.b: "Lái Tàu di cư của chúng ta tiến thẳng vào lỗ đen!"

 crisis.7225.name: "Quá nhiệt"
 crisis.7225.desc: "Khi nhiệt độ tại các thuộc địa tiếp tục tăng cao, mọi nơi đều trở nên khó sống, mức sống không ngừng giảm sút và sự bất mãn nhen nhóm khắp nơi.\n\nNếu tình hình không sớm được cải thiện, chúng tôi lo ngại toàn bộ khu vực sẽ trở nên không thể cư ngụ."
 crisis.7225.a: "Chẳng lẽ chúng ta không thể làm gì sao?"
 crisis.7225.b: "Chúng ta phải tránh xa các ngôi sao!"

 crisis.7230.name: "Đợt nóng Tan đi"
 crisis.7230.desc: "Đợt nóng khủng khiếp nhất trong thiên hà đã kết thúc. Mặc dù tốc độ ánh sáng vẫn cao hơn mức bình thường, nhưng sự chênh lệch không còn đáng kể. Chúng ta chỉ cần kiên trì thêm chút nữa, chờ đợi lượng nhiệt dư thừa tản đi hết là xong."
 crisis.7230.a: "Thật là một trải nghiệm kinh hoàng."
 crisis.7230.b: "Tàu di cư của chúng ta lại có thể tự do du hành rồi."

 crisis.7235.name: "Độ dẻo của Hợp kim"
 crisis.7235.desc.both: "Việc tỉ lệ hỏng hóc vật liệu trong các hợp kim thông dụng nhất của chúng ta sụt giảm gần đây đã thúc đẩy một cuộc điều tra. Chúng tôi phát hiện ra tính chất của hợp kim đã thay đổi, độ dẻo của chúng tăng nhẹ, nghĩa là chúng khó bị đứt gãy hơn trước. Nhìn chung, đây là một thay đổi tốt, nhưng sự điều chỉnh tận gốc các quy luật vật lý này thật đáng lo ngại."
 crisis.7235.desc.unknown: "$crisis.7235.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7235.desc.known: "$crisis.7235.desc.both$\n\n$crisis.known.desc$"
 crisis.7235.desc.again: "$crisis.7235.desc.both$\n\n$crisis.again.desc$"
 crisis.7235.desc.crisis: "Lại thêm một lần chỉnh sửa thực tại thành công! Lần này ở quy mô vi mô hơn, tác động đến các hợp kim của chúng ta, giúp chúng nhẹ hơn và bền hơn. Mặc dù quy mô nhỏ, lần chỉnh sửa này cũng ảnh hưởng đến toàn bộ thiên hà, và chúng ta đang theo dõi xem nó sẽ kéo dài bao lâu trong vũ trụ này."
 crisis.7235.a: "Khá tốt, nhưng hơi đáng lo."
 crisis.7235.b: "Thật kinh ngạc."
 crisis.7235.c: "Làm tốt lắm!"

 crisis.7240.name: "Độ dẻo của Hợp kim"
 crisis.7240.desc.both: "Việc tỉ lệ hỏng hóc vật liệu trong các hợp kim thông dụng nhất tăng lên gần đây đã thúc đẩy một cuộc điều tra. Chúng tôi phát hiện ra tính chất của hợp kim đã thay đổi, độ dẻo của chúng giảm nhẹ, nghĩa là chúng dễ bị đứt gãy hơn trước. Chúng tôi rất coi trọng thay đổi này. Sự điều chỉnh tận gốc các quy luật vật lý này càng đáng lo ngại hơn."
 crisis.7240.desc.unknown: "$crisis.7240.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7240.desc.known: "$crisis.7240.desc.both$\n\n$crisis.known.desc$"
 crisis.7240.desc.again: "$crisis.7240.desc.both$\n\n$crisis.again.desc$"
 crisis.7240.desc.crisis: "Thí nghiệm gần đây của chúng ta không hoàn toàn thành công. Chúng ta đã thành công trong việc gây ảnh hưởng lên toàn bộ thiên hà, nhưng không đạt được hiệu quả như mong đợi. Việc chỉnh sửa tính chất vật liệu đã khiến hợp kim của chúng ta trở nên giòn hơn, dễ đứt gãy hơn. Vấn đề này chỉ là tạm thời, mọi thứ sẽ phục hồi trong vòng vài năm, nhưng trong khoảng thời gian đó chi phí sẽ tăng cao."
 crisis.7240.a: "$crisis.7205.a$"
 crisis.7240.b: "$crisis.7205.b$"
 crisis.7240.c: "Lần tới nhất định sẽ thành công."

 crisis.7245.name: "Điều chỉnh Dinh dưỡng"
 crisis.7245.desc.both: "Giá trị dinh dưỡng của thực phẩm trong thiên hà đã thay đổi đáng kể. Giờ đây mọi loại thực phẩm đều giàu dinh dưỡng hơn. Hoặc là chúng ta cần ít dinh dưỡng hơn. Dù là trường hợp nào, sự thay đổi này cũng nằm ngoài dự kiến."
 crisis.7245.desc.unknown: "$crisis.7245.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7245.desc.known: "$crisis.7245.desc.both$\n\n$crisis.known.desc$"
 crisis.7245.desc.again: "$crisis.7245.desc.both$\n\n$crisis.again.desc$"
 crisis.7245.desc.crisis: "Tuyệt vời! Chúng ta đã thành công trong việc điều chỉnh tỉ lệ hấp thụ calo khi tiêu hóa, giờ đây chỉ cần ăn ít hơn là đã thấy thỏa mãn. Sự điều chỉnh chính xác này giúp chúng ta hiểu rõ hơn về cách nhào nặn thực tại."
 crisis.7245.a: "$crisis.7235.a$"
 crisis.7245.b: "$crisis.7235.b$"
 crisis.7245.c: "$crisis.7235.c$"

 crisis.7250.name: "Điều chỉnh Dinh dưỡng"
 crisis.7250.desc.both: "Giá trị dinh dưỡng của thực phẩm trong thiên hà đã thay đổi đáng kể. Giá trị dinh dưỡng của mọi loại thực phẩm đều giảm xuống, nghĩa là chúng ta cần nạp vào nhiều thức ăn hơn; sự thay đổi cụ thể vẫn chưa rõ ràng. Cần phải hết sức nghiêm túc đối với thay đổi này, vì nó có tác động lớn đến xã hội."
 crisis.7250.desc.unknown: "$crisis.7250.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7250.desc.known: "$crisis.7250.desc.both$\n\n$crisis.known.desc$"
 crisis.7250.desc.again: "$crisis.7250.desc.both$\n\n$crisis.again.desc$"
 crisis.7250.desc.crisis: "Thí nghiệm gần đây của chúng ta không hoàn toàn thành công. Dù đã gây ảnh hưởng lên toàn bộ thiên hà, nhưng chúng ta không đạt được hiệu quả mong muốn. Lần điều chỉnh này đã thay đổi tỉ lệ sinh calo khi tiêu hóa dưỡng chất, giờ đây phải nạp nhiều thức ăn hơn mới thấy thỏa mãn. Sai sót nhỏ này chỉ là tạm thời và sẽ sớm trở lại bình thường."
 crisis.7250.a: "$crisis.7240.a$"
 crisis.7250.b: "$crisis.7240.b$"
 crisis.7250.c: "$crisis.7240.c$"

 crisis.7255.name: "Lệch khối lượng"
 crisis.7255.desc.both: "Các quét đo lường trọng lực gần đây mâu thuẫn với dữ liệu đã ghi chép trước đó. Sau nhiều lần tính toán, không thể phủ nhận rằng có yếu tố nào đó đang ảnh hưởng đến toàn bộ thiên hà. Ngay cả những thay đổi nhỏ nhất cũng có thể tác động đến các thiên thể khổng lồ nhất. Đối với hầu hết các hành tinh thì ảnh hưởng không lớn, nhưng một số có thể xuất hiện các hiện tượng dị thường liên quan đến trọng lực."
 crisis.7255.desc.unknown: "$crisis.7255.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7255.desc.known: "$crisis.7255.desc.both$\n\n$crisis.known.desc$"
 crisis.7255.desc.again: "$crisis.7255.desc.both$\n\n$crisis.again.desc$"
 crisis.7255.desc.crisis: "Thí nghiệm tái cấu trúc thực tại gần đây của chúng ta đã dẫn đến việc làm giảm nhẹ khối lượng của nguyên tử carbon. Trong hầu hết các trường hợp, sự sụt giảm này là không đáng kể, nhưng các mô hình dự đoán rằng trên quy mô đủ lớn có khả năng gây rắc rối cho một số thiên thể. Các mô hình bi quan thậm chí còn ám chỉ một số thế giới có thể sống được vốn có trọng lực thấp có thể bị mất mật độ khí quyển."
 crisis.7255.a: "$crisis.7240.a$"
 crisis.7255.b: "$crisis.7240.b$"
 crisis.7255.c: "Cũng không tệ đến thế."
 mass_shift_tooltip: "Các thuộc địa sau đã chịu ảnh hưởng rõ rệt:"

 crisis.7260.name: "Vết rách Hư cảnh"
 crisis.7260.desc.both: "Trên khắp thiên hà, hàng trăm vết nứt không gian phụ đã mở ra những lối đi ngắn ngủi dẫn đến một bình diện thần năng, có vẻ như rào chắn tồn tại giữa hai bên đã bị suy yếu. Mặc dù hầu hết các vết nứt không gây ra vấn đề gì, nhưng một số đã giải phóng các thực thể năng lượng đang đe dọa thiên hà này. May mắn thay, những sinh vật này dường như cũng đang hoang mang như chúng ta, và không biểu hiện bất kỳ hành vi cố kết có tổ chức nào, nên hiện tại chúng ta loại trừ khả năng xảy ra một cuộc xâm lăng.\n\nChúng ta phải xử lý tất cả các thực thể năng lượng trong lãnh thổ của mình."
 crisis.7260.desc.unknown: "$crisis.7260.desc.both$\n\n$crisis.unknown.desc$"
 crisis.7260.desc.known: "$crisis.7260.desc.both$\n\n$crisis.known.desc$"
 crisis.7260.desc.again: "$crisis.7260.desc.both$\n\n$crisis.again.desc$"
 crisis.7260.desc.crisis: "Bình diện được gọi là 'Hư cảnh' luôn hiện hữu ở mặt bên kia của thiên hà chúng ta. Tính linh hoạt, kết nối giả định với lỗ đen, và sự khác biệt giữa các thực tại đã khiến việc nghiên cứu nó trở thành một chủ đề rất nóng.\n\nTrong một lần thử nghiệm, chúng ta định nhìn thấu vào đó nhưng vô tình gây ra nhiều vết nứt không gian phụ trong thiên hà, khiến vài 'Bóng ma' Hư cảnh hung dữ tiến vào bình diện của chúng ta. Rào chắn giữa hai thế giới dường như đã bị suy yếu đáng kể do hành động của chúng ta. Mọi chuyện sẽ trở lại bình thường sau một thời gian, nhưng tốt nhất là đừng chọc quá nhiều lỗ về hướng đó."
 crisis.7260.a: "$crisis.7240.a$"
 crisis.7260.b: "$crisis.7240.b$"
 crisis.7260.c: "Lần tới đừng làm như vậy nữa."

 crisis.7265.name: "Luận điểm Vô cực - Thành công Ổn định"
 crisis.7265.desc.a: "Thí nghiệm mới nhất của chúng ta đã thành công rực rỡ. Chúng ta đã biến sắt vụn thành các hợp kim giá trị một cách vĩnh viễn! Bí quyết để duy trì nó là chỉnh sửa các quy tắc thực tại để thực hiện quá trình biến đổi, thay vì cố gắng chỉnh sửa trực tiếp vật liệu. Khi phản ứng hóa học kết thúc, hợp kim mới của chúng ta sẽ giữ nguyên trạng thái đó mãi mãi."
 crisis.7265.desc.b: "Chúng ta đã thành công trong việc thay đổi dòng chảy thời gian! Sau khi thí nghiệm trên các vùng không gian trống trải, chúng ta cảm thấy rất tự tin và đã thử nghiệm quy trình này trên một thuộc địa của mình, và nó đã phát huy tác dụng! Thời gian ở đó sẽ trôi nhanh hơn, dự kiến tăng 20.537%. Việc này sẽ gây ra một số vấn đề về liên lạc và di chuyển, nhưng chúng ta sẽ giải quyết được."
 crisis.7265.desc.c: "Chúng ta đã cải tiến các chất siêu dẫn. Chúng không chỉ hoạt động được ở nhiệt độ phòng mà còn thực hiện được việc truyền năng lượng không hao tổn. Dù những thay đổi này chỉ kéo dài một thời gian, chúng sẽ mang lại lợi ích cực lớn cho mạng lưới năng lượng của chúng ta."
 crisis.7265.desc.d: "Mặc dù tác động của luận điểm này không quá kinh ngạc, nó vẫn mang lại những góc nhìn mới cho việc nghiên cứu thực tại. Nhiều giả thuyết trước đây đã bị loại bỏ hoặc cấu trúc lại để phù hợp với những quan sát gần đây của chúng ta, nhưng những gì học được đã vượt xa mong đợi."
 crisis.7265.desc.e: "Thí nghiệm của chúng ta đã mang lại những hiệu quả không ngờ. Trong khi nghiên cứu các chiều không gian khác và cách thức di chuyển tới đó, chúng ta vô tình khiến các con tàu của mình chuyển dịch một phần vào siêu không gian. Đáng ngạc nhiên là trạng thái của chúng dường như ổn định và không gây nguy hiểm. Như một tác dụng phụ tích cực, giờ đây chúng có thể di chuyển nhanh hơn bao giờ hết."
 crisis.7265.desc.f: "Chúng ta vốn luôn rất giỏi trong việc biến công nghệ thành thứ gì đó có thể phát nổ. Luận điểm Vô cực cũng không ngoại lệ, chúng ta đã thành công trong việc thay đổi hành vi tải trọng của vũ khí nổ, khiến các vụ nổ trở nên khủng khiếp hơn. Khám phá này chỉ khiến chúng ta không may mất đi vài cơ sở nghiên cứu nhỏ."
 crisis.7265.desc.g: "Chúng ta không đạt được bất kỳ thành tựu phi thường nào trong việc chỉnh sửa thực tại. Tuy nhiên, chúng ta đã học được rất nhiều về các công nghệ truyền thống hơn."
 crisis.7265.desc.h: "Chúng ta đã thử điều chỉnh không gian, kết quả là thuộc địa trở nên lớn hơn. Đáng ngạc nhiên là tình trạng này có vẻ là vĩnh viễn, mặc dù không chắc chắn làm cách nào đạt được, nhưng giả thuyết khả dĩ nhất là vật chất đã được chiết xuất từ một chiều không gian khác và lắng đọng êm ám vào các khoảng trống giữa các hạt nguyên tử. Tất cả những điều này thật phấn khích và khó hiểu."
 crisis.7265.a: "Tuyệt đỉnh!"
 crisis.7265.b: "Thật kinh ngạc."
 crisis.7265.c: "Thật phi thường."
 crisis.7265.d: "Thú vị đấy."
 add_crisis_currency_doubled_tt: "\nChúng ta đã nhận được [crisobj_thesis_value_bonus]£advanced_logic£§Y$menp_cosmo_objectives$§!."
 crisis.7265.e: "Làm tốt chứ?"
 crisis.7265.f: "Kinh điển!"
 crisis.7265.g: "Thật kỳ lạ."
 crisis.7265.h: "Chúng ta sẽ nhận lấy nó."

 crisis.7270.name: "Luận điểm Vô cực - Thất bại Đáng tiếc"
 crisis.7270.desc.a: "Thất bại là một phần của tiến bộ khoa học. Chúng ta từng đặt kỳ vọng rất cao vào thí nghiệm này, nhưng kết quả là chẳng có gì thành công cả. Điều này thật nản lòng, nhưng nó cũng có giá trị của mình, chúng ta sẽ cố gắng học hỏi từ những bài học này."
 crisis.7270.desc.b: "Chúng ta đã thành công trong việc thay đổi dòng chảy thời gian! Sau khi thí nghiệm trên các vùng không gian trống trải, chúng ta cảm thấy rất tự tin và đã thử nghiệm quy trình này trên một thuộc địa của mình, và nó đã phát huy tác dụng! Thời gian ở đó sẽ trôi chậm hơn, dự kiến chậm đi 20.537%. Sự chậm lại này không như chúng ta mong đợi, nhưng đối với chúng ta đây vẫn là một thành tựu to lớn."
 crisis.7270.desc.c: "Thí nghiệm mới nhất của chúng ta đã xuất hiện một tác dụng phụ đáng tiếc. Tất cả các thiết bị lưu trữ năng lượng của chúng ta đều đã bị cạn kiệt. Không có vật thể nào bị phá hủy, nhưng toàn bộ năng lượng lưu trữ trong đó dường như đã biến mất vào một chiều không gian khác. Chúng tôi vẫn đang xác định chuyện gì đã xảy ra, nhưng điều này rất thú vị."
 crisis.7270.desc.d: "Đây là một thất bại đáng xấu hổ. Chỉnh sửa của chúng ta đã lan tới cơ sở dữ liệu, khiến nhiều năm nghiên cứu bị hư hại không thể cứu vãn. Nhiều lý thuyết sẽ phải bắt đầu suy luận lại từ đầu. Mặc dù vẫn còn cơ hội để kiểm chứng lại các nghiên cứu cũ, nhưng đây vẫn là một bước lùi lớn."
 crisis.7270.desc.e: "Thí nghiệm này liên quan đến nguồn động lực và sản lượng, ban đầu tiến triển rất thuận lợi, nhưng khi nó lan tới các lò phản ứng trên tàu của chúng ta, mọi chuyện đã chuyển biến tồi tệ, dẫn đến việc tan chảy toàn bộ hạm đội! Một số tàu đã kịp thời tắt lò phản ứng, nhưng số khác đã phải chịu những tổn thất nghiêm trọng."
 crisis.7270.desc.f: "[leader_target.GetName], người giám sát thí nghiệm, đã tử nạn trong khu vực thử nghiệm khi xảy ra một vụ sụp đổ thời không ngoài dự kiến. Chúng ta vẫn đạt được một phần thành công trong việc mô phỏng thực tại, nhưng sự hy sinh của họ nhắc nhở chúng ta về cái giá của tri thức."
 crisis.7270.desc.g: "Một thí nghiệm tính toán đã mất kiểm soát với quy mô vượt xa dự kiến. Một lượng lớn dữ liệu nghiên cứu quý giá vì thế đã trở thành những mớ hỗn độn vô nghĩa. May mắn thay, kho trí tuệ lưu giữ các thành quả nghiên cứu tiên tiến nhất của chúng ta được bảo vệ tốt nên không bị ảnh hưởng."
 crisis.7270.desc.h: "Chúng ta đã thử thao túng không gian, kết quả là thuộc địa bị thu nhỏ lại. Tình trạng này là vĩnh viễn, điều này khiến chúng ta hơi ngạc nhiên. Giả thuyết khả dĩ nhất là vật chất đã rò rỉ êm ám từ chiều không gian này sang chiều không gian khác. Tất cả những điều này thật sự rất khó hiểu."
 crisis.7270.a: "$crisis.7240.c$"
 crisis.7270.b: "$crisis.7240.c$"
 crisis.7270.c: "$crisis.7240.c$"
 crisis.7270.d: "$crisis.7240.c$"
