 councilor_natural_design_female: "Nhà Hệ Gen Học Vĩ Đại"
 councilor_natural_design_desc: "$TITLE$ phụ trách giám sát hệ thống y tế và chính quyền vững mạnh, nhằm bảo vệ mã di truyền lý tưởng trong tự nhiên."

