 situation_synth_queen_doomclock_desc: "Cetana đang nỗ lực chấm dứt sự đau khổ bằng cách xóa bỏ ý thức. Nếu chúng ta không thể ngăn cản bà ta kịp thời, bà ta sẽ xóa bỏ ý thức của chúng ta, biến cơ thể của chúng ta thành những cái xác không hồn."
