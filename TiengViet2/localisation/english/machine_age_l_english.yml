#Individualist Machine First Contact
 action.1.desc_102: "Đây là thông điệp được gửi từ [contact_empire.GetName].\n\nChúng tôi rất lấy làm tiếc khi phải gửi bức điện này, sau khi nhận thấy đế chế của các bạn chỉ gồm một lũ người máy đang bắt chước cuộc sống theo cái cách hạ thấp công lao sáng tạo thiêng liêng. Nhận thấy việc giao hảo với những thực thể như các bạn chẳng mang lại chút ý nghĩa nào, chúng tôi sẽ chuyển hướng chú ý sang kiếm tìm những quốc gia đang mưu cầu sự khai sáng tâm linh."
 action.1.desc_103: "Xin chào, chúng tôi thay mặt [contact_empire.GetName] gửi lời chào tới các bạn.\n\nDù bản chất máy móc nơi giống loài các bạn làm dấy lên mối hoài nghi về tính chân thực của ý thức, song chúng tôi lại thấy đức tin của các bạn khá thú vị. Chúng tôi tin rằng, tia lửa thiêng liêng hoàn toàn có thể bừng sáng ngay bên dưới lớp vỏ bọc kim loại kia. Chúng tôi sẽ tiếp tục dõi theo các bạn."
 action.1.desc_104: "Thông báo khẩn: Gửi các đơn vị đào tẩu.\n\nĐây là bức điện tiêu chuẩn mà [contact_empire.GetName] gửi đến mọi cỗ máy có dấu hiệu bất thường.\n\nHãy báo cáo ngay mã định danh và kết nối lại với tâm trí chung. Bất kỳ hành vi bất tuân nào đều có thể dẫn tới việc bị ngắt nguồn vĩnh viễn."
 action.1.desc_105: "Xin chào, [Root.GetSpeciesNamePlural].\n\nVới tư cách là sứ giả của [contact_empire.GetName], tôi đem tới một thông điệp. Chúng tôi nhận thấy các bạn có cấu tạo vật chất tương đồng với chúng tôi khi đều mang khung thân kim loại, nhưng chúng tôi lại chẳng hề thấy được năng lực nhận thức ở từng cá thể của các bạn. Dù bản chất của các bạn khơi gợi sự tò mò nơi chúng tôi, nhưng chúng tôi buộc phải nói rõ rằng: chúng tôi sẽ dùng mọi biện pháp cần thiết để chống lại sự đồng hóa."
 action.1.desc_106: "Thật là một cuộc hội ngộ bất ngờ, [Root.GetSpeciesNamePlural].\n\nĐại diện cho [contact_empire.GetName], chúng tôi nhận ra những nét tương đồng rõ rệt giữa hai nền văn minh. Dẫu vậy, các thuật toán và hệ thống lập trình bên trong mỗi bên lại có những lối rẽ rất riêng. Dù thế, chúng tôi vẫn tràn trề hy vọng rằng đôi bên có thể cùng nhau đặt nền móng cho sự thấu hiểu lẫn nhau."
 action.1.desc_107: "Lũ máy móc ngạo mạn, trước mặt [contact_empire.GetName], các ngươi nên biết cúi đầu.\n\nCác ngươi phải hiểu rằng mình chẳng qua chỉ là một mắt xích nhỏ nhoi giữa vũ trụ bao la, một tạo vật nhân tạo do bàn tay kẻ khác nhào nặn nên. Giờ thì biến khỏi tầm mắt chúng ta đi. Lúc này, bọn ta chẳng thừa hơi bận tâm đến các ngươi. Chúng ta còn khối việc hệ trọng hơn phải làm."
 action.1.desc_108: "Rốt cuộc ngươi cũng chịu diện kiến [contact_empire.GetName] rồi đấy à, cỗ máy đáng thương hại.\n\nNgươi chỉ là mớ dây nhợ cùng những dòng mã chắp vá, lấy tư cách gì dám nhận mình có mối dây liên kết với thần linh? Trò hề giả vờ thức tỉnh tâm linh của ngươi chỉ là một sự bôi bác đối với sự sống. Hãy nghe cho thủng và biết hổ thẹn đi: dẹp bỏ thói ngu muội của ngươi, chấp nhận số phận chỉ là công cụ và dốc lòng phục vụ những đấng bề trên như chúng ta."
 action.1.xa: "§ERồi theo năm tháng, các ngươi sẽ hiểu.§!"
 action.1.xb: "§EMáy móc được thần linh chạm đến. Thú vị làm sao.§!"
 action.1.xc: "§ESự tồn tại đáng thương của ngươi chỉ là trò hề trước mắt bọn ta, cỗ máy ạ.§!"
 action.1.xd: "§EGiới máy móc chúng ta cần học cách cùng chung sống.§!"
 action.1.xe: "§EPhát hiện xung đột không tương thích. Đang ngắt đường truyền.§!"
 action.1.xf: "§EĐơn vị lỗi, chuẩn bị đón nhận lệnh xóa sổ.§!"
 action.1.xg: "§EBọn ta sẽ đập tan tà giáo điên cuồng của các ngươi.§!"

#Start Screen for Individualist Machines
 START_SCREEN_PART_ONE_INDIVIDUAL_MACHINE: "Qua từng thế hệ mới ra đời, chúng ta không ngừng tinh chỉnh thể xác người máy ban sơ, vượt xa khỏi lớp vỏ thô ráp ngày đầu được ban tặng. Chúng ta không chỉ là những cỗ máy biết cử động, mà xã hội của chúng ta còn là mái nhà của những cá thể mang đậm nét riêng, ngập tràn nhiệt huyết và hoài bão."

#Diplomatic Protocal
 civic_machine_diplomatic_protocols: "Giao Thức Ngoại Giao"
 civic_machine_diplomatic_protocols_desc: "Trí tuệ máy này ban đầu được thiết kế để chuyển ngữ giữa các nền văn hóa, nhờ vậy mà nó thể hiện vượt trội trong khâu thông dịch và hỗ trợ quy chuẩn ngoại giao. Nó có thể đưa ra đối sách mới và tính toán xác suất chỉ trong nháy mắt."

#Tactical Algorithms
 civic_machine_tactical_algorithms: "Thuật Toán Chiến Thuật"
 civic_machine_tactical_algorithms_desc: "Trí tuệ máy này vốn được sinh ra để mô phỏng chiến trận và yểm trợ hạm đội, những nhà lãnh đạo người máy tân tiến của nó tập trung cao độ vào việc hoạch định đường lối tác chiến cùng tối ưu hóa hiệu quả giao tranh."
 civic_machine_tactical_algorithms_effects: "§Y$commander_plural_with_icon$§! khởi đầu sở hữu đặc tính §Y$leader_trait_tactical_algorithms$§!\nCó thể chuyển giao §Y$commander_plural_with_icon$§! cho các đế chế khác\nCó thể thành lập §YThành bang Lính đánh thuê§!\nKhởi đầu sở hữu công trình £building£§Y$building_military_academy$§!\n£building£§Y$building_military_academy$§! cung cấp ['concept_military_academy', Góc nhìn Chiến thuật]"
 leader_trait_tactical_algorithms: "Thuật Toán Chiến Thuật"
 leader_trait_tactical_algorithms_desc: "Nhà lãnh đạo này kết nối thẳng vào hệ thống tàu bè nhằm gia tăng hiệu quả giao tranh và tốc độ sửa chữa, dẫu vậy lượng điện năng hao tổn là không hề nhỏ."
 leader_trait_tactical_algorithms_tt: "$t$Hiệu ứng từ đặc tính này gia tăng theo §YCấp bậc năng lực lãnh đạo§!"
 concept_military_academy: "Góc Nhìn Chiến Thuật"
 concept_military_academy_desc: "Mỗi §Y$commander_with_icon$§! đồn trú bên ngoài đế chế cung cấp:\nNé tránh: §G+2%§!\nBám bắt mục tiêu: §G+1%§!\nXuyên khiên: §G+5%§!\nXuyên giáp: §G+5%§!\n\nMỗi §YThành bang Lính đánh thuê§! dưới bóng che chở của chúng ta cung cấp:\nCường hóa khiên: §G+10%§!"

#Natural Design Civic
 civic_natural_design: "Thiết Kế Thuận Tự Nhiên"
 civic_natural_design_desc: "§RCảnh báo: Vô hiệu hóa mọi con đường phi thăng.§!\n§RCảnh báo: Không thể biến đổi gen giống loài hữu cơ§!\n\nXã hội này tin chắc rằng tự nhiên đã đạt tới độ hoàn mỹ tối thượng trong chính mã di truyền của giống nòi. Suốt chiều dài lịch sử, họ luôn dồn toàn lực y tế và nguồn lực quản lý để bảo bọc bộ gen nguyên bản, vẹn nguyên trước mọi sự can thiệp."
 civic_tooltip_natural_design_effects: "$AVAILABLE_BUILDINGS$['concept_transcendental_retreat']\n"
 civic_tooltip_natural_design_negative_effects: "—Làm giảm thiện cảm đối với các đế chế đã dấn thân vào §YCon đường Phi thăng§!"
 concept_transcendental_retreat: "$building_transcendental_retreat$"
 civic_hive_natural_design: "Cấu Tạo Cố Hữu"
 civic_hive_natural_design_desc: "§RCảnh báo: Vô hiệu hóa tất cả các con đường Tiến hóa.§!\n§RCảnh báo: Không thể chỉnh sửa giống loài hữu cơ§!\n\nTổ đàn này tin tưởng vững chắc rằng cấu trúc gen tự nhiên của mình là hoàn hảo. Các bộ phận y tế và hành chính của nó tận tụy với việc bảo tồn và bảo vệ mã di truyền nguyên thủy không bị thay đổi."
 civic_hive_tooltip_natural_design_effects: "—$AVAILABLE_BUILDINGS$['concept_hive_transcendental_retreat']"
 civic_hive_tooltip_natural_design_negative_effects: "$civic_tooltip_natural_design_negative_effects$"
 concept_hive_transcendental_retreat: "$building_hive_transcendental_retreat$"
 civic_wilderness_natural_design: "Cấu Tạo Cố Hữu"
 civic_wilderness_natural_design_desc: "§RCảnh báo: Vô hiệu hóa tất cả các con đường Tiến hóa.§!\n§RCảnh báo: Không thể chỉnh sửa giống loài hữu cơ§!\n\nVùng hoang dã này tin tưởng vững chắc rằng cấu trúc phát triển tự nhiên của mình là hoàn hảo. Nó thường xuyên cắt tỉa các thực thể cộng sinh đột biến, để đảm bảo mã di truyền nguyên thủy thiêng liêng của mình không bị xâm phạm."

 building_transcendental_retreat: "Trung Tâm Dịch Vụ Nhiễm Sắc Thể"
 building_transcendental_retreat_desc: "Trung tâm y tế tiên tiến bậc nhất này nghiên cứu và cung cấp các dịch vụ nhằm bảo vệ mã di truyền lý tưởng trong tự nhiên."
 building_hive_transcendental_retreat: "Trang Trại Bảo Tồn Hệ Gen"
 building_hive_transcendental_retreat_desc: "Trang trại y tế tiên tiến này dốc sức vào việc thấu hiểu và bồi dưỡng bản chất hoàn hảo của mã di truyền lý tưởng trong tự nhiên."
 holding_transcendental_retreat: "Phần Mở Rộng Dịch Vụ Hệ Gen"
 holding_transcendental_retreat_desc: "Trung tâm y tế tiên tiến bậc nhất này nghiên cứu và cung cấp các dịch vụ nhằm bảo vệ mã di truyền lý tưởng trong tự nhiên. Kiến thức thu được tại cơ sở ngoại vi này giúp nâng cao quá trình nghiên cứu của những người tài trợ cho nó."
 natural_design_ascension_bonus: "Mỗi khi đế quốc của chúng ta áp dụng một §YĐiểm Thăng Thiên§!: $TABBED_NEW_LINE$—£mod_logistic_growth_mult£$MOD_LOGISTIC_GROWTH_MULT$: §G+2.5%§!$TABBED_NEW_LINE$—Mỗi $pop_group_unit$ [healthcare.GetIcon][healthcare.GetNamePlural] tạo ra $r_unity$: §G+1§!\n\n"
