 #Fallen Empire Reactions
 action.1.desc_111: "Đứa trẻ ngu ngốc, ngươi tự xưng là am hiểu sự thần thánh, nhưng lại xúc phạm đến [Owner.Species.GetFleshTypeCyberCreed] của mình. Cần biết rằng chúng ta là [contact_empire.GetName], giống loài được chọn của thiên hà này. Đừng để cơ thể ô uế của các ngươi chạm vào thánh địa của chúng ta, nếu không hãy chuẩn bị đón nhận sự hủy diệt chớp nhoáng."
 action.1.desc_110: "Chúng ta là [contact_empire.GetName], những người được chọn trong thiên hà này. Vài thế kỷ qua, chúng ta đã bỏ qua nhu cầu tinh thần của các giống loài hạ đẳng. Ngươi và vật chứa không thuần khiết của các ngươi chính là một ví dụ điển hình cho sai lầm của chúng ta. Hãy tiếp nhận giáo lý của chúng ta, quy y, nếu không sẽ bị nghiền nát thành tro bụi."

 #Cybernetic Situation Events
 machine_age.90.name: "Cấy Ghép Thần Thánh"
 machine_age.90.desc: "Các tín đồ đã tiết lộ những bí ẩn của công nghệ nghĩa thể cho tất cả mọi người. Tuy nhiên, hôm nay đánh dấu sự khởi đầu cho cuộc hành trình của chúng ta, giờ đây chúng ta phải toàn tâm toàn ý đón nhận sự dung hợp thần thánh."
 machine_age.90.a: "Đã đến lúc rồi."
 machine_age.90.a.tooltip: "Chúng ta phải chấp nhận nhánh truyền thống ['tradition_category:tradition_cybernetics'] để bắt đầu sự dung hợp thần thánh."
 machine_age.100.name: "Giáo Đoàn Dung Hợp"
 machine_age.100.desc: "Trong suốt tiến trình lịch sử, chúng ta từng sai lầm khi cố gắng cải tạo [Owner.Species.GetFleshTypeCyberCreed] của mình, dẫn đến những tổn thương không thể phục hồi đối với nhiều vật chứa thần thánh, gây ra sự xung đột giữa các tín ngưỡng khác nhau trong việc lý giải sự dung hợp thần thánh.\n\nCùng với việc công nghệ cuối cùng cũng đạt tới ngưỡng cường hóa hoàn toàn, các nhà lãnh đạo thiêng liêng trong đức tin của chúng ta—các Công Nghệ Hiển Thánh Sư, đã triệu tập một đại hội giáo đoàn để thiết lập các nguyên tắc cốt lõi cho giáo hội, hợp nhất các tín ngưỡng khác nhau thành một giáo lý duy nhất."
 machine_age.100.a: "Nguyện xin Thánh Linh dẫn dắt họ."
 machine_age.1000.name: "Sự Dung Hợp Của Đức Tin"
 machine_age.1000.desc: "Quá trình hình thành Giáo Đoàn Công Nghệ Hiển Thánh Sư diễn ra vô cùng gian nan, mỗi tín ngưỡng quan trọng nhất đều yêu cầu có đại diện trong giáo đoàn. Sau khi cân nhắc kỹ lưỡng, §Y$CYBERCREED_construction$§!, §Y$CYBERCREED_war$§!, §Y$CYBERCREED_research$§! và §Y$CYBERCREED_labor$§! đã được mời tham gia.\n\nGiáo đoàn hiện đang bắt tay vào nhiệm vụ thiêng liêng với niềm tin vững chắc. Sắc lệnh đầu tiên của họ yêu cầu dân chúng tăng thuế thập phân hoặc thực hiện nghĩa vụ phục vụ cộng đồng bắt buộc."
 machine_age.1000.a: "Chúng ta phải quyết định cách hỗ trợ giáo đoàn."
 machine_age.1000.a.tooltip: "Trong tình hình này sẽ có nhiều phương án đối phó khả dụng."
 machine_age.1010.name: "Tăng Cường Thánh Điển"
 machine_age.1010.desc: "Sắc lệnh thứ hai của Giáo Đoàn Công Nghệ Hiển Thánh Sư kêu gọi chính thức xác lập đức tin. Từ lâu, sự khác biệt giữa các giáo phái đã gây ra những xích mích trong xã hội của chúng ta.\n\nCác giáo phái lớn đều đưa ra những lý lẽ thuyết phục cho việc thống nhất đức tin của họ, trong khi những tiếng nói ôn hòa hơn lại chủ trương nên đi theo một con đường thực sự cởi mở và bao dung."
 machine_age.1010.a: "Sứ Đoàn Búa Khổng Lồ có thể đúc nên một tương lai cởi mở hơn."
 machine_age.1010.a.tooltip: "Giáo lý sẽ được hình thành xoay quanh §Y$CYBERCREED_construction$§!. $machine_age.1010.shared.tooltip$"
 machine_age.1010.b: "Thánh Vệ Thép có thể bảo vệ [Owner.Species.GetFleshTypeCyberCreed] của chúng ta."
 machine_age.1010.b.tooltip: "Giáo lý sẽ được hình thành xoay quanh §Y$CYBERCREED_war$§!.\n$machine_age.1010.shared.tooltip$"
 machine_age.1010.c: "Khúc Ca Tư Tưởng có thể xướng lên bài ca tiến bộ."
 machine_age.1010.c.tooltip: "Giáo lý sẽ được hình thành xoay quanh §Y$CYBERCREED_research$§!.\n$machine_age.1010.shared.tooltip$"
 machine_age.1010.d: "Kết Xã Lao Động có thể trao ý nghĩa cho những người công nhân của chúng ta."
 machine_age.1010.d.tooltip: "Giáo lý sẽ được hình thành xoay quanh §Y$CYBERCREED_labor$§!.\n$machine_age.1010.shared.tooltip$"
 machine_age.1010.e: "Chúng ta nên chấm dứt những giáo điều chia rẽ này."
 machine_age.1010.e.tooltip: "Thông qua cải cách để hợp nhất các giáo phái thành §Y$pft_cyber_creed_general$§!, để mỗi vật chứa sùng đạo đều có thể nhận được cải tạo nghĩa thể.\n$machine_age.1010.shared.tooltip$"
 machine_age.1010.shared.tooltip: "Tất cả các công trình liên kết với giáo phái khác đều sẽ bị thay thế bằng §YNgôi Đền§!.\nGiáo phái này sẽ trở thành §YPhe Phái Duy Tâm§! duy nhất.\nCác phe phái mang tư tưởng §YKhông Duy Tâm§! sẽ được phép xuất hiện."
 machine_age.1020.name: "Ngụy Tín"
 machine_age.1020.desc.pickedacreed: "Sau khi chọn §Y[GetCyberCreed]§!, tín đồ của các giáo phái khác đã lên tiếng phản đối. Nhiều người cho rằng hành động của giáo đoàn là sự phản bội lại đức tin \"thực sự\".\n\n$machine_age.1020.both$"
 machine_age.1020.desc.nocreed: "Tín đồ của các giáo phái đang biểu tình, cho rằng giáo đoàn đã cự tuyệt chân tín.\n\n$machine_age.1020.both$"
 machine_age.1020.both: "Tính đến hiện tại, mặc dù các hoạt động biểu tình diễn ra rầm rộ, nhưng nhìn chung vẫn giữ được sự ôn hòa. Chỉ có thời gian mới có thể trả lời được liệu những tia lửa này cuối cùng có bùng lên thành đám cháy bạo loạn hay không.\n\nBất luận chuyện gì xảy ra tiếp theo, chúng ta phải quyết định số phận của các giáo phái khác. Có người kêu gọi dứt khoát khai trừ họ khỏi giáo hội, gắn mác giáo lý của họ là tà giáo, và lấy những cuộc bạo loạn do họ gây ra làm bằng chứng để buộc tội họ phản đạo. Những người khác lại cho rằng, nhân từ mới là con đường tiến lên, họ kêu gọi chúng ta thể hiện sự khoan dung với những thành viên lầm đường lạc lối trong đức tin của mình."
 machine_age.1020.a: "Chỉ được phép có một chân tín duy nhất tồn tại."
 machine_age.1020.a.tooltip: "Công Nghệ Hiển Thánh Sư sẽ đàn áp tín đồ của các tín ngưỡng khác, điều này sẽ dẫn đến sự bất mãn."
 machine_age.1020.b: "Đức tin của chúng ta có thể bao dung tất cả."
 machine_age.1020.b.tooltip: "Dù chúng ta đã thiết lập giáo lý chính thức, nhưng các Công Nghệ Hiển Thánh Sư vẫn giữ thái độ khoan dung với phong tục của các giáo phái khác."
 machine_age.1030.name: "Tín Đồ Hỗn Loạn"
 machine_age.1030.desc: "Trên các hành tinh đã nổ ra những cuộc biểu tình của các nhóm thiểu số tôn giáo, nhiều người cáo buộc chúng ta đi chệch khỏi con đường đúng đắn của sự dung hợp thần thánh. Các Công Nghệ Hiển Thánh Sư cho rằng, sự hỗn loạn này chỉ là tạm thời, vì đa số chúng ta vẫn ủng hộ giáo lý thống nhất; tất cả chỉ là vấn đề thời gian, cho họ chút thời gian thì ngay cả những người biểu tình cuồng tín nhất cũng sẽ chấp nhận chân lý thần thánh."
 machine_age.1030.a: "Chỉ được phép có một chân tín duy nhất tồn tại."
 machine_age.1030.a.tooltip: "Lựa chọn đàn áp tín đồ của các tín ngưỡng khác sẽ dẫn đến sự bất mãn."
 machine_age.1040.name: "Tự Nguyện Quy Y"
 machine_age.1040.desc: "Việc tuân theo giáo lý thống nhất đã lan rộng trong dân chúng, phần lớn tín đồ của các giáo phái đã từ bỏ tín ngưỡng và lối sống cũ.\n\nNgoại trừ những kẻ cuồng tín thực sự, mọi người đều đang chuẩn bị [Owner.Species.GetFleshTypeCyberCreed] thần thánh của họ cho sự chuyển hóa cuối cùng."
 machine_age.1040.a: "Chân lý của sự dung hợp thần thánh của chúng ta cuối cùng sẽ chiến thắng."
 machine_age.1040.a.tooltip: "Chúng ta đã thống nhất đức tin thành công."
 machine_age.1050.name: "Tín Đồ Thỏa Mãn"
 machine_age.1050.desc: "Việc cho phép tín đồ của các giáo phái tự do bày tỏ là sự lựa chọn hài hòa nhất: chỉ có một số ít tiếng nói phản đối, chỉ có những thành viên cuồng tín nhất mới tham gia vào đó.\n\nĐa số tín đồ tuân theo giáo lý chính thức của chúng ta, chúng ta đã sẵn sàng tập trung sức lực vào sự dung hợp thần thánh."
 machine_age.1050.a: "Chúng ta là một đức tin không thể bị chia rẽ."
 machine_age.1050.a.tooltip: "Việc thực hiện chính sách khoan dung với các trường phái giáo lý khác nhau sẽ ngăn chặn sự bất mãn sinh sôi."
 machine_age.1060.name: "Thỏa Hiệp Vô Lý"
 machine_age.1060.desc: "Việc nhượng bộ trước những yêu cầu của chủ nghĩa cực đoan đã chọc giận đa số những người theo đường lối ôn hòa. Nhiều người cho rằng, mỗi giáo phái tín ngưỡng đều có một lịch sử bạo lực liên tôn giáo lâu đời, để cho các tín ngưỡng bên lề tồn tại mà không gặp sự phản đối là một sự lựa chọn sai lầm.\n\nPhần lớn kêu gọi cải cách chính thức các tín ngưỡng, loại bỏ một cách thực chất mọi tính độc lập vốn có của chúng."
 machine_age.1060.a: "Chân tín phải bao dung tất cả."
 machine_age.1060.a.tooltip: "Khoan dung với các giáo phái khác đã khiến phe ôn hòa trong đức tin của chúng ta cảm thấy không hài lòng, gây ra sự bất mãn."
 machine_age.1060.b: "Bắt đầu cải cách tín ngưỡng."
 machine_age.1060.b.tooltip: "Chân tín sẽ hấp thụ các giáo phái khác nhau, và xóa bỏ những tranh chấp giáo lý vụn vặt giữa chúng."
 machine_age.1070.name: "Thuế Thời Gian"
 machine_age.1070.desc: "Khi sự dung hợp trọng đại đang đến gần, chúng ta hãy nhìn lại truyền thống lâu đời trong đức tin của mình: thuế thập phân về thời gian.\n\nNhìn lại vô số thế hệ tổ tiên trong quá khứ, mỗi một thành viên trung thành trong xã hội đều cống hiến một phần thời gian và sức lực của họ cho giáo hội. Giống như sự dung hợp thần thánh, sự cống hiến này giúp củng cố cơ thể của đức tin.\n\nNhững tín đồ này nên hỗ trợ nâng cấp cường hóa thần thánh như thế nào mới là tốt nhất?"
 machine_age.1070.intro: "Hàng năm, những tín đồ trong dân chúng sẽ dành một phần thời gian"
 machine_age.1070.a: "Thuế khoáng sản."
 machine_age.1070.a.tooltip: "$machine_age.1070.intro$ tiến hành khai thác khoáng sản."
 machine_age.1070.b: "Thuế nông nghiệp."
 machine_age.1070.b.tooltip: "$machine_age.1070.intro$ làm nông nghiệp."
 machine_age.1070.c: "Thuế thép."
 machine_age.1070.c.tooltip: "$machine_age.1070.intro$ làm việc bên lò nung."
 machine_age.1070.d: "Thuế xây dựng."
 machine_age.1070.d.tooltip: "$machine_age.1070.intro$ xây dựng công trình và làm việc trong xưởng đóng tàu."
 machine_age.1070.e: "Thuế lục quân."
 machine_age.1070.e.tooltip: "$machine_age.1070.intro$ đi tòng quân trong lục quân."
 machine_age.1070.f: "Thuế hải quân."
 machine_age.1070.f.tooltip: "$machine_age.1070.intro$ đi tòng quân trong hải quân."
 machine_age.1070.g: "Thuế cường hóa."
 machine_age.1070.g.tooltip: "$machine_age.1070.intro$ nghiên cứu khoa học nghĩa thể thần thánh."
 machine_age.1070.h: "Thuế tri thức."
 machine_age.1070.h.tooltip: "$machine_age.1070.intro$ nghiên cứu những bí ẩn của vũ trụ."
 machine_age.1070.i: "Thuế lao động."
 machine_age.1070.i.tooltip: "$machine_age.1070.intro$ sản xuất nhu yếu phẩm."
 machine_age.1070.j: "Thuế tài phú."
 machine_age.1070.j.tooltip: "$machine_age.1070.intro$ tham gia buôn bán."
 machine_age.1070.k: "Thuế thủ công."
 machine_age.1070.k.tooltip: "$machine_age.1070.intro$ chế tác thủ công những món đồ tinh xảo."
 machine_age.1075.name: "Máu Và Mạch Điện"
 machine_age.1075.desc: "Thời khắc dung hợp thần thánh cuối cùng đã đến.\n\nChúng ta nên thiết lập §Y$building_augmentation_center$§! thần thánh trên hành tinh của mình để khởi động quá trình này."
 machine_age.1075.a: "$machine_age.1090.pray$"
 machine_age.1075.a.tooltip: "Cuộc cải tạo nâng cấp nghĩa thể toàn diện của các tín đồ đã bắt đầu. Mọi hoạt động khác của giáo đoàn sẽ bị đình chỉ cho đến khi sự dung hợp thần thánh hoàn tất.\n\n§RYêu cầu Hành động:§!\nXây dựng một $building_augmentation_center$ để cho cục diện §Y$situation_cybernetic_creed_cyberization$§! tiếp tục tiến triển."
 machine_age.1090.name: "Tương Lai Của Xác Thịt"
 machine_age.1090.desc: "Với việc kết thúc hành trình thần thánh, thân xác bằng máu thịt của chúng ta cuối cùng cũng đã đạt được sự dung hợp thiêng liêng giữa máy móc và [Owner.Species.GetFleshTypeCyberCreed]. Đối với các tín đồ, bước cuối cùng là lắp đặt các bộ phận cường hóa thần thánh."
 machine_age.1090.construction: "$machine_age.1090.desc$§Y$CYBERCREED_construction$§! yêu cầu thân xác của chúng ta phải trở thành một công cụ thần thánh.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1090.war: "$machine_age.1090.desc$§Y$CYBERCREED_war$§! yêu cầu tín đồ hóa thành vũ khí thần thánh.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1090.research: "$machine_age.1090.desc$§Y$CYBERCREED_research$§! sẽ tận dụng một bộ phận người được kết nối mạng với nhau để mở khóa những bí ẩn của vũ trụ.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1090.labor: "$machine_age.1090.desc$§Y$CYBERCREED_labor$§! cam kết sẽ làm cho bát cơm và nhà kho của chúng ta luôn đầy ắp.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1090.pray: "Dung hợp là thần thánh. Cường hóa là sùng bái."
 machine_age.1090.a: "[GetCyberCreed] sẽ đúc nên một kỷ nguyên hoàn toàn mới."
 machine_age.1090.a.tooltip: "$machine_age.geneslockedtooltip$\n$cyber.21.a.end$\n$machine_age.democraticgovtooltip$\nMở khóa sắc lệnh: §Y[GetCyberCreedEdict]§!"
 machine_age.1090.b.tooltip: "$machine_age.geneslockedtooltip$\n$cyber.21.a.end$\n$machine_age.oligarchicgovtooltip$\nMở khóa sắc lệnh: §Y[GetCyberCreedEdict]§!"
 machine_age.1090.c.tooltip: "$machine_age.geneslockedtooltip$\n$cyber.21.a.end$\n$machine_age.dictatorialgovtooltip$\nMở khóa sắc lệnh: §Y[GetCyberCreedEdict]§!"
 machine_age.1090.d.tooltip: "$machine_age.geneslockedtooltip$\n$cyber.21.a.end$\n$machine_age.imperialgovtooltip$\nMở khóa sắc lệnh: §Y[GetCyberCreedEdict]§!"
 machine_age.1090.e.tooltip: "$machine_age.geneslockedtooltip$\n$cyber.21.a.end$\n$machine_age.corporategovtooltip$\nMở khóa sắc lệnh: §Y[GetCyberCreedEdict]§!"
 machine_age.1100.name: "Tương Lai Của Đức Tin"
 machine_age.1100.desc: "Hôm nay, chúng ta trỗi dậy với tư thế hoàn toàn dung hợp, không chỉ là thân thể và tâm hồn, mà còn cả đức tin của chúng ta. Những tín điều giáo điều không còn thống trị nữa; sự dung hợp thần thánh sẽ là hành trình cá nhân của mọi tín đồ.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1100.a: "Đức tin của chúng ta dung hợp chặt chẽ giống như [Owner.Species.GetFleshTypeCyberCreed] của chúng ta."
 machine_age.1100.a.tooltip: "$machine_age.geneswaptooltip$\n$cyber.21.a.end$\n$machine_age.democraticgovtooltip$"
 machine_age.1100.b.tooltip: "$machine_age.geneswaptooltip$\n$cyber.21.a.end$\n$machine_age.oligarchicgovtooltip$"
 machine_age.1100.c.tooltip: "$machine_age.geneswaptooltip$\n$cyber.21.a.end$\n$machine_age.dictatorialgovtooltip$"
 machine_age.1100.d.tooltip: "$machine_age.geneswaptooltip$\n$cyber.21.a.end$\n$machine_age.imperialgovtooltip$"
 machine_age.1100.e.tooltip: "$machine_age.geneswaptooltip$\n$cyber.21.a.end$\n$machine_age.corporategovtooltip$"
 machine_age.govswapnotice: "Chính phủ của chúng ta sẽ hoàn toàn áp dụng khoa học nghĩa thể và tiến hành tái cơ cấu, thành lập §Y[Owner.GetGovernmentName]§!. Điều này sẽ hòa hợp với sự dung hợp cơ thể của chúng ta."
 machine_age.democraticgovtooltip: "Chế độ quyền lực của chúng ta sẽ được thay đổi thành §Y['concept_auth_cyber_creed_democratic']§! do nghĩa thể lãnh đạo."
 machine_age.oligarchicgovtooltip: "Chế độ quyền lực của chúng ta sẽ được thay đổi thành §Y['concept_auth_cyber_creed_oligarchic']§! do nghĩa thể lãnh đạo."
 machine_age.dictatorialgovtooltip: "Chế độ quyền lực của chúng ta sẽ được thay đổi thành §Y['concept_auth_cyber_creed_dictatorial']§! do nghĩa thể lãnh đạo."
 machine_age.imperialgovtooltip: "Chế độ quyền lực của chúng ta sẽ được thay đổi thành §Y['concept_auth_cyber_creed_imperial']§! do nghĩa thể lãnh đạo."
 machine_age.corporategovtooltip: "Chế độ quyền lực của chúng ta sẽ được thay đổi thành §Y['concept_auth_cyber_creed_corporate']§! do nghĩa thể lãnh đạo."
 machine_age.geneswaptooltip: "Tín đồ trong dân chúng hiện tại có thể tiến hành chỉnh sửa gen."
 machine_age.geneslockedtooltip: "Tín đồ sẽ nhận được diện mạo của [GetCyberCreed], đây là một loạt các nâng cấp cường hóa thần thánh không thể sửa đổi."

