 district_cosmogenesis_world_science: "Cổng Thần kinh"
 district_cosmogenesis_world_science_plural: "Cổng Thần kinh"
 district_cosmogenesis_world_science_desc: "Trí tưởng tượng của vô số cá thể cho phép chúng ta chạy mô phỏng siêu tốc cho các giả thuyết tân tiến. Cấu trúc phức tạp của các cổng logic và bộ đệm bộ nhớ hữu cơ mang lại độ chính xác vô song cho dữ liệu đầu ra."

 district_cosmogenesis_world_logic: "Khu Tư duy Mở rộng"
 district_cosmogenesis_world_logic_plural: "Khu Tư duy Mở rộng"
 district_cosmogenesis_world_logic_desc: "Là một kỳ tích của siêu hình học biện chứng, khu vực này sử dụng chip thần kinh để xác định tính đúng đắn của các mệnh đề về thực tại. Nói một cách đơn giản, nó cho phép tâm trí tập thể của những cư dân trong Máy tiện Tiếp hợp đưa ra đáp án có hoặc không cho cả những câu hỏi hóc búa nhất."

