 synth_queen_alloy_shipments: "Nữ Hoàng Đánh Thuế"
 synth_queen_alloy_shipments_desc: "Chúng ta chia sẻ một phần sản lượng hợp kim cho Cetana để hỗ trợ cho tham vọng của bà ta."
 synth_queen_large_alloy_shipments: "Món Quà Thiện Ý"
 synth_queen_large_alloy_shipments_desc: "Để lấy lòng Cetana và hỗ trợ cho tham vọng của bà ta, chúng ta đã chia sẻ một phần lớn sản lượng hợp kim."

 synth_queen_shared_research: "Nghiên Cứu Của Nữ Hoàng"
 synth_queen_shared_research_desc: "Chúng ta đồng ý để Cetana kiểm tra cơ sở dữ liệu của mình, khiến công việc nghiên cứu khoa học tạm thời bị ảnh hưởng."
 synth_queen_much_shared_research: "Quá Tải Cơ Sở Dữ Liệu"
 synth_queen_much_shared_research_desc: "Chúng ta trao cho Cetana quyền truy cập cơ sở dữ liệu không giới hạn, làm suy yếu đáng kể năng lực nghiên cứu khoa học của chúng ta."

 synth_queen_war_preparations: "Đại Chiến Cận Kề"
 synth_queen_war_preparations_desc: "Sau khi phát hiện ra hành động bí mật của Cetana, nhu cầu tăng cường xây dựng quân đội trở nên cấp bách hơn bao giờ hết."
 synth_queen_advanced_war_preparations: "Trận Chiến Sinh Tồn"
 synth_queen_advanced_war_preparations_desc: "Chúng ta phải áp dụng mọi biện pháp cần thiết để ngăn chặn âm mưu xóa bỏ ý thức của Cetana."

 synth_queen_nanite_apprentice: "Học Trò Cetana"
 synth_queen_nanite_apprentice_desc: "Cetana phát hiện ra chúng ta cũng đam mê công nghệ nano giống như bà ta, nên đã nảy sinh sự quan tâm sâu sắc đến chúng ta. Bất luận chúng ta có tin tưởng bà ta hay không, thì sự hướng dẫn này có thể mang lại lợi ích."

 # Opinion
 synth_queen_approve: "Điều này sẽ làm hài lòng Cetana."
 synth_queen_approve_lot: "Điều này sẽ làm Cetana cực kỳ hài lòng."
 synth_queen_disapprove: "Điều này sẽ chọc giận Cetana."
 synth_queen_disapprove_lot: "Điều này sẽ chọc giận Cetana một cách nghiêm trọng."
 synth_queen_gift_tt: "Chúng ta phải tiếp tục chứng minh lòng trung thành của mình với Cetana thì bà ta mới ban cho chúng ta nhiều quà tặng hơn."
 synth_queen_punishment_tt: "Cùng với mỗi \"bài học\" mà Cetana đưa ra, cơn thịnh nộ của bà ta dường như cũng theo đó mà giảm bớt."

