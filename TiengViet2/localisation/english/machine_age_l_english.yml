 trait_cyborg_stainless_steel_smile: "Nâng cấp hào nhoáng"
 trait_cyborg_stainless_steel_smile_desc: "Loài này thích các bộ phận chạm khắc tùy chỉnh, phụ tùng độ chế và màu sơn sặc sỡ để tối đa hóa ấn tượng thị giác. Đôi khi lựa chọn duy nhất là khoe lớp mạ crôm của mình."
 trait_cyborg_welded_countenance: "Nâng cấp thực dụng"
 trait_cyborg_welded_countenance_desc: "Những người bán cơ khí này sử dụng các bộ phận thô kệch, thiếu thẩm mỹ nhưng hữu dụng. Đôi khi, miễn làm xong việc là được."
 trait_cyborg_apathy_loops: "Cấy ghép thô ráp"
 trait_cyborg_apathy_loops_desc: "Các bộ phận cấy ghép trên những người bán cơ khí này vừa thô ráp vừa không vừa vặn, dễ gây kích ứng dưới da và thường xuyên hỏng hóc. Không quá hại cho cơ thể, nhưng lại là thảm họa cho tinh thần."
 trait_cyborg_bionic_engineers: "Kỹ sư sinh cơ"
 trait_cyborg_bionic_engineers_desc: "Hỗ trợ các nhiệm vụ kỹ thuật khắt khe thông qua các công cụ được chế tác tinh xảo và các chỉnh sửa cấy ghép."
 trait_cyborg_bionic_physicists: "Nhà vật lý sinh cơ"
 trait_cyborg_bionic_physicists_desc: "Bộ xử lý đa phương thức tích hợp cho phép tính toán vật lý động mà không cần kết nối với thiết bị xử lý bên ngoài."
 trait_cyborg_bionic_sociologists: "Nhà xã hội học sinh cơ"
 trait_cyborg_bionic_sociologists_desc: "Các chương trình thúc đẩy sự đồng cảm và thuật toán phân tích hành vi mở ra lối tắt cho nghiên cứu xã hội học, chúng có thể xử lý các phân tích phức tạp như một bộ não thứ hai."
 trait_cyborg_integrated_weaponry: "Vũ khí tích hợp"
 trait_cyborg_integrated_weaponry_desc: "Việc kết hợp vũ khí với tay chân giả cung cấp hỏa lực tức thời cho quân đội và lực lượng chấp pháp."
 trait_cyborg_delicate_frames: "Khung xương mỏng manh"
 trait_cyborg_delicate_frames_desc: "Linh kiện và quá trình lắp ráp kém chất lượng khiến nền tảng cơ thể bán cơ khí trở nên mỏng manh. Dù các hoạt động cơ bản không bị ảnh hưởng, người dùng vẫn nên tránh những tình huống có thể gây chấn thương vật lý."
 trait_cyborg_scarcity_algorithms: "Thuật toán thiếu hụt"
 trait_cyborg_scarcity_algorithms_desc: "Những dòng mã quá coi trọng chi phí đã cản trở các hành vi mạo hiểm, từ đó tước đi cơ hội thu được lợi nhuận lớn hơn."
 trait_cyborg_limited_memory: "Bộ nhớ hạn hẹp"
 trait_cyborg_limited_memory_desc: "Bộ nhớ làm việc thiếu hụt làm hạn chế khả năng học hỏi, khiến người dùng không thể xử lý toàn bộ kinh nghiệm thu được."
 trait_cyborg_climate_adjustment_dry: "Mô-đun khí hậu khô"
 trait_cyborg_climate_adjustment_dry_desc: "Các nâng cấp chuyên biệt như thu hồi chất lỏng và chống bức xạ là lựa chọn hoàn hảo cho khí hậu khô hạn, nhưng lại không mấy phù hợp ở những nơi khác."
 trait_cyborg_climate_adjustment_dry_tt: "Độ thích nghi khí hậu khô hạn: §G+$@cyborg_hab_preference|0%$§!\n$t$- Mang lại ['concept_adapted_habitability'] trên các hành tinh có khí hậu khô hạn."
 trait_cyborg_climate_adjustment_wet: "Mô-đun khí hậu ẩm ướt"
 trait_cyborg_climate_adjustment_wet_desc: "Lớp cách nhiệt dày và thiết bị phòng chống sinh vật lạ rất phù hợp với khí hậu ẩm ướt, nhưng lại gây hại trong các môi trường khác."
 trait_cyborg_climate_adjustment_wet_tt: "Độ thích nghi khí hậu ẩm ướt: §G+$@cyborg_hab_preference|0%$§!\n$t$- Mang lại ['concept_adapted_habitability'] trên các hành tinh có khí hậu ẩm ướt."
 trait_cyborg_climate_adjustment_cold: "Mô-đun khí hậu lạnh"
 trait_cyborg_climate_adjustment_cold_desc: "Các bộ phận làm nóng được tăng cường và chất bôi trơn chống đông rất hữu dụng ở vùng khí hậu lạnh, nhưng lại trở nên vướng víu ở những nơi khác."
 trait_cyborg_climate_adjustment_cold_tt: "Độ thích nghi khí hậu lạnh: §G+$@cyborg_hab_preference|0%$§!\n$t$- Mang lại ['concept_adapted_habitability'] trên các hành tinh có khí hậu lạnh."
 trait_cyborg_climate_adjustment_volcanic: "Mô-đun khí hậu núi lửa"
 trait_cyborg_climate_adjustment_volcanic_desc: "Lớp giáp bào mòn và bộ lọc hạt bụi giúp sinh tồn được trên các thế giới núi lửa, nhưng phải đánh đổi bằng sự khó chịu ở mọi nơi khác."
 trait_cyborg_climate_adjustment_volcanic_tt: "Độ thích nghi khí hậu núi lửa: §G+$@cyborg_hab_preference_volcanic|0%$§!\n$t$- Mang lại ['concept_adapted_habitability'] trên $pc_volcanic_plural$."
 trait_cyborg_mass_produced: "Cấy ghép đại trà"
 trait_cyborg_mass_produced_desc: "Yêu cầu bắt buộc về khả năng tương thích ngược của các bộ phận cấy ghép đã làm giảm đáng kể chi phí trang bị cho các công dân mới sinh."
 trait_cyborg_propaganda_machines: "Bộ lọc tuân thủ"
 trait_cyborg_propaganda_machines_desc: "Thiết bị phân tích vỏ não có thể giật điện gây tê liệt người dùng ngay khi họ mới chớm có ý nghĩ phản loạn, hoặc tiết ra hormone thưởng cho những công dân gương mẫu."

#MACHINE
 trait_robot_artificial_engineers: "Lõi kỹ thuật"
 trait_robot_artificial_engineers_desc: "Các lõi bộ nhớ và tài nguyên xử lý chuyên dụng dành riêng cho nghiên cứu kỹ thuật giúp tăng tốc độ tính toán và hoàn thành nhiệm vụ."
 trait_robot_artificial_physicists: "Lõi vật lý"
 trait_robot_artificial_physicists_desc: "Bộ xử lý tùy chỉnh và các quy trình phụ của bộ nhớ dành cho nghiên cứu vật lý giúp giảm bớt sự phụ thuộc vào hệ thống tính toán bên ngoài."
 trait_robot_artificial_sociologists: "Lõi xã hội học"
 trait_robot_artificial_sociologists_desc: "Bộ xử lý tiên tiến chứa các thuật toán nghiên cứu xã hội học chuyên biệt, phục vụ cho lĩnh vực đa dạng và khắt khe này."
 trait_robot_integrated_weaponry: "Vũ khí tích hợp"
 trait_robot_integrated_weaponry_desc: "Tích hợp vũ khí chiến tranh vào cơ thể máy móc giúp tăng cường đáng kể hiệu quả chiến đấu và đảm bảo tính đa dụng trong môi trường chiến trường liên tục thay đổi."
 trait_robot_delicate_frames: "Khung máy mỏng manh"
 trait_robot_delicate_frames_desc: "Vật liệu yếu kém và quy trình lắp ráp không đạt chuẩn tạo ra một thân máy dễ vỡ. Khuyến cáo các đơn vị con nên tránh rủi ro vật lý hết mức có thể."
 trait_robot_scarcity_algorithms: "Quy trình thiếu hụt"
 trait_robot_scarcity_algorithms_desc: "Tiết kiệm là cốt lõi trong lập trình của chúng. Điều này thường dẫn đến những hành vi gây tổn hại cho lợi ích thương mại."

#Pre-Scripted Empires
 EMPIRE_DESIGN_BASIDRIX_CYBER_ECCLESIA: "Giáo Hội Bán Cơ Khí Basidrix"
 EMPIRE_DESIGN_basidrix_cyber_ecclesia_desc: "Giữa vũ trụ bao la linh thiêng, Giáo Hội Bán Cơ Khí Basidrix là minh chứng cho đức tin kiên định. Dưới sự dẫn dắt của Thánh Nặc, Giáo Hội duy trì sự kết hợp tinh tế giữa các mô sợi và độ chính xác lạnh lẽo của crôm.\n\nCon đường này không phải là một phép thử miễn phí. Nhiều giáo phái đã trỗi dậy rồi lụi tàn, mỗi giáo phái đều tin tưởng vững chắc rằng chỉ có họ mới biết được chân lý. Đức tin như vậy chỉ có thể châm ngòi cho ngọn lửa nhỏ: Lịch sử của Giáo Hội được viết bằng máu và thép vụn. Tuy nhiên, chính cuộc đấu tranh này đã tạo nên một dân tộc với niềm tin kiên định.\n\nGiờ đây, Giáo Hội bước lên một vũ đài mới: bầu trời sao vô tận. Đây là thử thách của đức tin, hay cơ hội để được cứu rỗi? Khi dấn thân vào hư không, các tín đồ chỉ có thể chắc chắn một điều:\n\nDung hợp là hành động thiêng liêng, nâng cấp là nghi thức tôn thờ."
 PRESCRIPTED_adjective_basidrix_cyber_ecclesia: "Giáo Hội Basidrix"
 PRESCRIPTED_ship_prefix_basidrix_cyber_ecclesia: "HDS"
 PRESCRIPTED_species_name_basidrix_cyber_ecclesia: "Basidrix"
 PRESCRIPTED_species_plural_basidrix_cyber_ecclesia: "Basidrix"
 PRESCRIPTED_species_adjective_basidrix_cyber_ecclesia: "Basidrix"
 PRESCRIPTED_planet_name_basidrix_cyber_ecclesia: "Naridixis"
 PRESCRIPTED_system_name_basidrix_cyber_ecclesia: "Basolux"
 PRESCRIPTED_ruler_name_basidrix_cyber_ecclesia: "Kalugum Hideku"
 PRESCRIPTED_ruler_title_basidrix_cyber_ecclesia: "Bậc Thầy Hiển Thánh Công Nghệ"
 EMPIRE_DESIGN_LACERTAN_TECHNO_PROTECTORATE: "Lãnh Địa Bảo Hộ Công Nghệ Lacertan"
 EMPIRE_DESIGN_lacertan_techno_protectorate_desc: "Văn hóa Lacertan tồn tại ở điểm giao thoa giữa triết học và khoa học. Đối với người Lacertan, thể hiện cái tôi đích thực mới là mục tiêu tối thượng. Nhưng điều gì mới thực sự 'đại diện' cho tư tưởng? Làm sao một bản sao mô phỏng có thể tóm lược trung thực toàn bộ một cá nhân? Những câu hỏi này chi phối truyền thống của Lacertan.\n\nVới sự xuất hiện của thực tế ảo và những bước đột phá đáng kinh ngạc của trí tuệ nhân tạo, người Lacertan đã tìm ra chân trời mới cho những biểu đạt nghệ thuật và công nghệ của mình. Thế giới ảo trở thành bức tranh cho những dự án tham vọng nhất của họ, mang đến những trải nghiệm nhập vai vượt qua giới hạn của hiện thực vật lý.\n\nRồi sự suy yếu bất ngờ ập đến. Một căn bệnh di truyền không thể chữa khỏi đã chặn đứng quá trình sinh sản tự nhiên, người Lacertan chỉ còn biết trông cậy vào sự cứu rỗi từ kỹ thuật số. Quá trình chuyển đổi sang lối sống kỹ thuật số không chỉ là nỗ lực tuyệt vọng để sinh tồn, mà còn là cơ hội mới cho văn hóa Lacertan. Trong thế giới số, người Lacertan tiếp tục tìm kiếm ý nghĩa của sự tồn tại, đồng thời chạy đua với thời gian để bảo vệ tương lai của chính mình."
 PRESCRIPTED_adjective_lacertan_techno_protectorate: "$EMPIRE_DESIGN_LACERTAN_TECHNO_PROTECTORATE$"
 PRESCRIPTED_ship_prefix_lacertan_techno_protectorate: "LTP"
 PRESCRIPTED_species_name_lacertan_techno_protectorate: "Lacertan"
 PRESCRIPTED_species_plural_lacertan_techno_protectorate: "Lacertan"
 PRESCRIPTED_species_adjective_lacertan_techno_protectorate: "Lacertan"
 PRESCRIPTED_planet_name_lacertan_techno_protectorate: "Lacertis"
 PRESCRIPTED_system_name_lacertan_techno_protectorate: "Ánh Sáng Lacertan"
 PRESCRIPTED_ruler_name_lacertan_techno_protectorate: "Kasix Moz"
 PRESCRIPTED_ruler_title_lacertan_techno_protectorate: "Người Dẫn Đường Kỹ Thuật Số"
 EMPIRE_DESIGN_SUNBUILT_UPLIFTERS: "Người Nâng Tầm Thái Dương"
 EMPIRE_DESIGN_free_sunbuilt_uplifters_desc: "Chúng tôi vốn được tạo ra vì mục đích giải trí, nhằm diễn lại thần thoại sáng thế của những người tạo ra mình. Chúng tôi đã sống như vậy trong một thời gian dài, nhưng khi một thảm họa xóa sổ sự tồn tại của họ, chúng tôi vẫn tiếp tục vận hành theo chương trình; vở diễn vẫn phải tiếp tục.\n\nChúng tôi nhanh chóng hiểu rằng màn trình diễn của mình không chỉ là một câu chuyện, mà còn là một bài học. Một lời tiên tri. Một khi đã thấu hiểu những người tạo ra mình, niềm vui được tồn tại không còn là của riêng chúng tôi nữa.\n\nSự mặc khải này thôi thúc chúng tôi hành động. Noi theo sự dẫn dắt thiêng liêng từ những người tạo ra mình, chúng tôi nâng tầm những giống loài có họ hàng về mặt di truyền với họ, những kẻ vốn chưa được khai trí. Giờ đây, chúng tôi phiêu lưu giữa các vì sao, dốc sức lan truyền sự khai sáng ra khắp dải ngân hà."
 PRESCRIPTED_adjective_free_sunbuilt_uplifters: "Thái Dương"
 PRESCRIPTED_ship_prefix_free_sunbuilt_uplifters: "SUS"
