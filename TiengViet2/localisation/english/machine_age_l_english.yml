 guided_sapience_colonizer: "Thuyền Cứu Thế Kiến Tạo"
 guided_sapience_colonizer_cap: "$guided_sapience_colonizer$"
 guided_sapience_colonizer_plural: "Thuyền Cứu Thế Kiến Tạo"
 guided_sapience_colonizer_desc: "Tàu thực dân đặc biệt chịu trách nhiệm thực hiện quá trình kiến tạo cho những sinh vật chưa có trí khôn tiềm năng nhất được lựa chọn cẩn thận, đồng thời thiết lập các thuộc địa sơ bộ cho những người quản lý của chúng ta."

 councilor_civic_guided_sapience: "Bậc Thầy Dẫn Dắt"
 councilor_civic_guided_sapience_female: "$councilor_civic_guided_sapience$"
 councilor_civic_guided_sapience_desc: "$councilor_civic_guided_sapience$ chịu trách nhiệm giám sát các nhiệm vụ phức tạp trong việc nghiên cứu và các dự án nâng cấp giống loài chưa có trí khôn của chúng ta."
 councilor_civic_guided_sapience_corperate: "Giám Đốc Dẫn Dắt"
 councilor_civic_guided_sapience_corperate_female: "$councilor_civic_guided_sapience$"
 councilor_civic_guided_sapience_corperate_desc: "$councilor_civic_guided_sapience_corperate$ chịu trách nhiệm quản lý các trách nhiệm đa dạng gắn liền với những sáng kiến tiên phong trong việc nghiên cứu và nâng cấp sinh vật chưa có trí khôn của chúng ta."

 d_genesis_preserve: "Khu Bảo Tồn Kiến Tạo"
 d_genesis_preserve_desc: "Chúng ta dành riêng khu bảo tồn được thiết kế cẩn thận này để hoàn toàn nâng cấp những sinh vật mà chúng ta đang giám hộ trở thành giống loài có trí tuệ. Kế hoạch nghiên cứu khoa học là một phần quan trọng trong kế hoạch đầy tham vọng này."
 decision_rebuild_genesis_preserve: "Xây Dựng Khu Bảo Tồn Kiến Tạo"
 decision_rebuild_genesis_preserve_desc: "Hành tinh này chưa có $d_genesis_preserve$, việc xây dựng nó đóng vai trò tối quan trọng đối với mục tiêu của chúng ta."
 d_genesis_preserve_new_speices_tooltip: "Một giống loài chưa có trí khôn mới sẽ được nâng cấp và định cư trong một §Y$d_genesis_preserve$§!."
 d_genesis_preserve_old_species_tooltip: "Giống loài chưa có trí khôn hiện tại sẽ được sắp xếp vào một §Y$d_genesis_preserve$§! mới."
 no_abandon_genesis_preserve: "$TRIGGER_FAIL$Chúng ta không thể bỏ rơi những sinh vật chưa có trí khôn mà mình đang giám hộ."
 d_genesis_monument: "Đài Tưởng Niệm Kiến Tạo"
 d_genesis_monument_desc: "Đài tưởng niệm này dùng để khắc ghi những nỗ lực không mệt mỏi trong quá trình nâng cấp trên hành tinh này. Nó sừng sững ở đây như một biểu tượng của sự kỳ vọng, hy vọng, lòng kiên trì và những thành tựu phi thường."

 cyber.7000.both: "Thuộc địa trên §Y[THIS.GetName]§! đã chuẩn bị sẵn sàng để quan sát, cũng như định hướng sự phát triển của giống loài mới nổi này."
 cyber.7000.name: "Hoàn Thành Kế Hoạch Kiến Tạo"
 cyber.7000.desc: "Sau khi xác định được một ứng cử viên chưa có trí khôn tiềm năng, §Y$guided_sapience_colonizer$§! của chúng ta đã bắt đầu quy trình nâng cấp gen cho §Y$d_genesis_preserve$§!, và thiết lập không gian cần thiết cho nó.\n\n$cyber.7000.both$"
 cyber.7000.a: "Đến lúc làm việc rồi."
 cyber.7001.name: "Khánh Thành Khu Bảo Tồn Kiến Tạo"
 cyber.7001.desc: "Sau khi tập hợp tất cả các giống loài chưa có trí khôn ở địa phương, §Y$guided_sapience_colonizer$§! của chúng ta đã bắt đầu xây dựng cho chúng một §Y$d_genesis_preserve$§!.\n\n$cyber.7000.both$"
 cyber.7001.a: "$cyber.7000.a$"
 cyber.7020.name: "Hoàn Tất Quá Trình Nâng Cấp Kiến Tạo"
 cyber.7020.desc: "Nhờ vào sự nỗ lực không ngừng nghỉ của Người Dẫn Dắt, chúng ta đã hoàn thành dự án nâng cấp trên §Y[Root.GetName]§!. Chúng ta đã biến §Y[From.GetName]§! thành một giống loài hoàn toàn có trí tuệ, và §Y$d_genesis_preserve$§! mà chúng từng gọi là nhà nay đã được cải tạo thành một §Y$d_genesis_monument$§!.\n\nNó sẽ mãi mãi là nhân chứng bất diệt cho thành tựu tiến hóa của giống loài này."
 cyber.7020.a: "[From.GetNamePlural], chào mừng đến với vũ đài của hệ sao."

#Obessional Directive
 cyber.5005.name: "Đạt Tiêu Chuẩn Sản Xuất"
 cyber.5005.desc: "Chúng ta đã hoàn thành chỉ thị.\n\nCác cá thể phụ đã đáp ứng hạn ngạch sản xuất trong phạm vi thông số quy định.\n\nChúng ta cần thực hiện chỉ thị cuối cùng cho kho dự trữ."
 cyber.5005.a: "Khởi động giao thức lưu trữ."
 cyber.5005.a.tooltip: "Hãy lưu trữ những hàng hóa này lại, như một minh chứng cho phương thức sản xuất hiệu quả của chúng ta."
 cyber.5005.b: "Chúng ta sẽ bán nó trên thị trường công khai."
 cyber.5005.b.tooltip: "Chúng ta sẽ khởi động việc mở rộng thị trường để quảng bá sản phẩm của mình."
 cyber.5005.c: "Đàm phán để nhượng bộ ngoại giao."
 cyber.5005.c.tooltip: "Chúng ta sẽ khám phá các kênh ngoại giao để trao đổi hàng hóa."
 cyber.5005.d: "Dùng để giao dịch lấy kiến thức công nghệ."
 cyber.5005.d.tooltip: "Chúng ta sẽ tìm kiếm những người bán tư nhân để lấy hàng trong kho trao đổi lấy những manh mối công nghệ có giá trị."
 cyber.5005.e: "Đem chúng giấu vào lỗ đen."
 cyber.5005.e.tooltip: "Chúng ta sẽ giấu chúng an toàn bên trong chân trời sự kiện của lỗ đen."
 cyber.5006.name: "Chưa Đạt Tiêu Chuẩn Sản Xuất"
 cyber.5006.desc: "Chúng ta đã không thể hoàn thành tiêu chuẩn sản xuất trong chu kỳ này.\n\nTình trạng này sẽ làm giảm sản lượng của các cá thể phụ cho đến khi có thể hoàn thành mục tiêu sản xuất.\n\nHạn ngạch sản xuất tiếp theo đã được hạ xuống."
 cyber.5006.a: "Không thể chấp nhận được"
 cyber.5006.purge.tt: "§YMở khóa loại thanh lọc: §!$purge_clips$"

