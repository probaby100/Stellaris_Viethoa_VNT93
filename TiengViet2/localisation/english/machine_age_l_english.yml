 purge_cosmogenesis_tooltip_delayed: "§LMột bánh răng trong cỗ máy.§!"

 cosmogenesis_world_0: "$pc_cosmogenesis_world$"
 cosmogenesis_world_0_DESC: "Một cỗ máy tính khổng lồ đến mức khó có thể hiểu nổi, nó coi các sinh vật có tri giác như những con chip xử lý để tiến hành nghiên cứu và sản sinh ra Logic Siêu Việt, và dần dần lấy mạng bọn họ. Hiệu suất của nó sẽ cải thiện rõ rệt theo số lượng đơn vị được đưa vào."
 cosmogenesis_world_0_MEGASTRUCTURE_DETAILS: "Một cơ sở tính toán có khả năng tiêu thụ hiệu quả dân số để tạo ra §YĐiểm Nghiên Cứu§! và §YLogic Siêu Việt§!."
 cosmogenesis_world_ruined: "$pc_cosmogenesis_world$ Bị Phá Hủy"
 cosmogenesis_world_ruined_DESC: "Tàn tích của một Máy Lọc Synapse. Nó từng là một siêu máy tính dùng các giống loài có tri giác làm chip để vén màn những bí mật của vũ trụ."
