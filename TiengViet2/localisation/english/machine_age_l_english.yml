#Guided Sapience
 civic_guided_sapience: "Người Dẫn Dắt Kiến Tạo"
 civic_guided_sapience_desc: "Xã hội này tận tụy tạo ra sự trỗi dậy của những giống loài mới. Với tư cách là những nhà quản lý tiềm năng tiến hóa, họ phân bổ một phần các hành tinh để bảo vệ sự phát triển của các dạng sống chưa có trí khôn."
 civic_hive_guided_sapience: "Cộng Sinh Kiến Tạo"
 civic_hive_guided_sapience_desc: "Tập thể này tập trung vào việc thiết kế sự trỗi dậy của các giống loài mới. Với tư cách là những người giám sát tiềm năng tiến hóa, họ phân bổ một phần các hành tinh để bảo vệ sự phát triển của các dạng sống chưa có trí khôn."
 civic_machine_guided_sapience: "Cấu Trúc Kiến Tạo"
 civic_machine_guided_sapience_desc: "Trí tuệ máy móc này sử dụng các thuật toán được xây dựng chính xác để tạo ra những giống loài mới. Với tư cách là người giám sát tiềm năng tiến hóa chưa được khai phá này, họ đã phân chia các khu vực sao để đảm bảo sự tiến hóa của những dạng sống chưa có trí khôn."
 civic_corporate_guided_sapience: "Công Nghệ Kiến Tạo Giữa Các Vì Sao"
 civic_corporate_guided_sapience_desc: "Tập đoàn quy mô vũ trụ này không ngừng nỗ lực vào việc thiết kế sự trỗi dậy của những giống loài mới. Họ có chiến lược chỉ định những khu vực rộng lớn trên các hành tinh của mình để đảm bảo sự phát triển của các dạng sống chưa có trí khôn, và những công việc này đều được tiến hành trong khuôn khổ những cuộc phiêu lưu thương mại có trách nhiệm."
 civic_tooltip_guided_sapience_effects: "—Tàu thực dân khả dụng: §Y$guided_sapience_colonizer$§!$NEW_LINE$—Hành tinh được thực dân hóa bằng §Y$guided_sapience_colonizer_plural$§!: $TABBED_NEW_LINE$—$PRESAPIENT$ Dân số: §G+300§!$TABBED_NEW_LINE$—$PLANETARY_FEATURES$ §Y$d_genesis_preserve$§!$NEW_LINE$—Nâng cấp giống loài $PRESAPIENT$ sẽ nhận được $r_unity$"
