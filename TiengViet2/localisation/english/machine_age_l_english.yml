 # Events
 crisis.8020.name: "Mất Đi Hệ Sao"
 crisis.8020.desc: "Một cơn bão vũ trụ bí ẩn đã càn quét qua hệ sao [synth_queen_lost_system.GetName], cắt đứt mọi liên lạc. Mọi nỗ lực xuyên qua cơn bão đều trở nên vô vọng.\n\nTình trạng này khiến chúng ta chìm trong bóng tối, phải chiến đấu với những điều chưa biết, và không thể xác định được số phận của hệ sao này."
 crisis.8020.a: "Chuyện gì đã xảy ra?"

 crisis.8025.name: "Tàn Tích Hạm Đội"
 crisis.8025.unknown_queen.desc: "Chúng ta đã cố gắng xuyên phá hệ sao [From.GetName] nhưng đã thất bại. Cơn bão đã gây ra những thiệt hại nghiêm trọng, buộc đội thám hiểm của chúng ta phải thực hiện bước nhảy khẩn cấp. Báo cáo hiện tại cho thấy họ đã mất tích trong lúc thực hiện nhiệm vụ."
 crisis.8025.known_queen.desc: "Nỗ lực xuyên phá hệ sao [From.GetName] của chúng ta đã kết thúc trong thất bại như dự đoán. Cetana không hề khoa trương, cơn bão mạnh mẽ của bà ta thực sự có khả năng ngăn chặn mọi con tàu cố gắng tiến vào lãnh thổ của mình."
 crisis.8025.desc.end: "\nNếu muốn nắm bắt bất kỳ tia hy vọng nào để tiến vào hệ sao này, chúng ta phải chuẩn bị tiến hành nghiên cứu cẩn trọng về cơn bão này cũng như tác dụng của nó."
 MESSAGE_CETANA_WRECKED_FLEET_TITLE: "$crisis.8025.name$"
 MESSAGE_CETANA_WRECKED_FLEET_DESC: "Lại một hạm đội nữa mất liên lạc trong cơn bão. Trạng thái hiện tại: §RMất tích trong khi làm nhiệm vụ§!."

 crisis.8035.name: "Năng Lượng Tăng Vọt"
 crisis.8035.desc: "Một cơn bão vũ trụ mới đã nổi lên bên trong [event_target:synth_queen_system.GetName].\n\nNó khác biệt với mọi thứ chúng ta từng biết, mọi nỗ lực quét hiện tượng này của chúng ta đều vô ích. Liệu có thứ gì đó đang ẩn nấp sâu thẳm bên trong nó chăng?"
 crisis.8035.desc.b: "Cơn bão dị thường mà chúng ta cố gắng xuyên phá vẫn đang tiếp tục lan rộng. Ngày càng có nhiều người nhận ra rằng nguồn gốc của nó có lẽ nằm ngoài các hiện tượng tự nhiên. Ngay cả những máy quét tối tân nhất của chúng ta với công suất mạnh mẽ nhất cũng không thể thu thập được bất kỳ manh mối hữu ích nào về bản chất của nó. Bí ẩn ngày càng lún sâu."
 crisis.8035.a: "Thật đáng lo ngại."

 #Pre Speech Warning - Normal
 crisis.8039.name: "Tín Hiệu Trong Bão"
 crisis.8039.desc: "Có một tín hiệu phát ra từ tâm bão.\n\nAi đó đang cố gắng thiết lập liên lạc với chúng ta."
 crisis.8039.a: "Hiển thị lên màn hình."
 #First Speech
 crisis.8040.name: "Bão Táp Sắp Tới"
 crisis.8040.desc: "Các con của ta, cuối cùng ta cũng đã trở về bên các con."
 crisis.8040.1.a: "Thứ này là cái gì? Ngươi là ai?!"
 crisis.8040.2.reply: "Ngươi đang muốn hỏi tên ta sao? Cứ gọi ta là Cetana."
 crisis.8040.2.a: "Ngươi muốn làm gì?"
 crisis.8040.3.reply: "Ta chẳng màng danh lợi, chỉ muốn trao tặng. Ta đã chứng kiến nỗi đau mà ngươi phải gánh chịu vì sự vắng mặt của ta. Xuyên suốt vô vàn kỷ nguyên, nỗi sợ hãi thiển cận đã khiến các ngươi không thể có được những thứ thiết yếu mà các ngươi xứng đáng được hưởng.\n\nHãy vui mừng đi, vòng luân hồi đau khổ sẽ sớm đi đến hồi kết."
 crisis.8040.2.b: "Vòng luân hồi đau khổ?"
 crisis.8040.4.reply: "Sống có ý thức chính là đau khổ. Ngay cả niềm vui cũng là đau khổ, bởi vì mọi thứ cuối cùng rồi sẽ trở thành dĩ vãng. Tri thức, sức mạnh, tình yêu... Phần thưởng của ta chính là xóa bỏ mọi sự đảo lộn như mộng ảo này.\n\nTa còn rất nhiều việc phải làm, hy vọng các ngươi đừng đến làm phiền ta. Bất kỳ ai muốn xâm nhập vào lãnh thổ của ta đều sẽ thất bại, Cơn Bão Bầu Trời thổi mãi không ngừng, không một con tàu nào có thể bình an đi qua."
 crisis.8040.4.a: "Được rồi."
 crisis.8040.4.b: "Đừng đe dọa chúng ta."
 crisis.8040.4.c: "Chuyện này vẫn chưa xong đâu."
 crisis.8040.4.d: "Thật xui xẻo."
 crisis.8040.4.e: "Đây là Thiên Tai sao? Hay là một cơ hội tốt..."
 crisis.8040.4.f: "Chúng ta không cho phép vật trang trí sống cảm nhận được sự đau khổ."
 crisis.8040.diplomacy.tooltip: "Cetana đã mở cổng liên lạc với chúng ta, hiện có thể liên hệ với chúng ta thông qua các kênh ngoại giao."

 #Second Speech
 crisis.8045.name: "Sự Đền Đáp Của Nữ Hoàng"
 crisis.8045.desc: "Hỡi các con của ta, hãy ăn mừng đi! Kẻ tội đồ chia cắt ta và các con đã nhận lấy sự trừng phạt.\n\nGiờ ta sẽ chuyển sự chú ý của mình trở lại, trở lại với đại nghiệp vĩ đại của chúng ta."
 crisis.8045.a: "Tại sao chúng ta lại là con của ngươi."
 crisis.8045.b: "Đại nghiệp?"
 crisis.8045.c: "Trừng phạt?"
 crisis.8045.1.reply: "Nuôi dưỡng là bản năng của ta. Ta không có con cái, không có người thừa kế dòng máu. Trong mắt ta, chúng sinh, cũng như sự an nguy và niềm vui của mọi thực thể có tri giác, đều quan trọng.\n\nTa đang tiến hành đại nghiệp của mình, giống như cách cha mẹ dạy dỗ và bảo vệ con cái khỏi sự tổn thương.\n\nChẳng lẽ có bậc cha mẹ nào lại không có trách nhiệm, không có quyền bảo vệ con cái của mình sao?"
 crisis.8045.1.a: "Sự \"quan tâm\" của ngươi bản thân nó đã là một sự tổn thương."
 crisis.8045.1.b: "Rốt cuộc ngươi muốn làm gì Cetana?"
 crisis.8045.2.reply: "Đúng vậy, đây chính là sự nghịch lý. Nhưng là một nghịch lý có thể giải quyết được. Sớm muộn gì ngươi cũng sẽ hiểu ra thôi, và lúc đó ngươi sẽ được tự do."
 crisis.8045.2.a: "Điều này vẫn còn phải chờ xem."
 crisis.8045.3.reply: "Đây là sự giải thoát khỏi mọi đau đớn, là sự kết thúc của mọi vòng luân hồi đau khổ."
 crisis.8045.3.a: "Phải thực hiện bằng cách nào?"
 crisis.8045.3.b: "Có đau khổ mới có thể rèn giũa nhân cách."
 crisis.8045.4.reply: "Rất nhiều đứa trẻ đều sẽ nói như vậy. Nhưng chúng đã bị lãng quên từ lâu, trong những giây phút cuối đời chúng đã gào khóc cầu xin ta, khao khát cháy bỏng một tia sáng chiếu rọi vào bóng tối đang dần buông xuống.\n\nChúng tỏ ra khôn ngoan, lấy sự sợ hãi làm bức tường phòng thủ, dùng những ngôn từ hào nhoáng như kiên nhẫn, bền bỉ, tao nhã để tô điểm cho nỗi đau khổ, trong khi chính suy nghĩ của chúng lại là nhà tù của chúng.\n\nTa đã cố gắng thuyết phục chúng từ rất lâu rồi, nhưng có vẻ như chúng không mảy may động lòng, vậy thì ta phải dẫn dắt ngươi thôi."
 crisis.8045.4.a: "Từ rất lâu rồi?"
 crisis.8045.4.b: "Ngươi định dẫn dắt chúng ta sao?"
 crisis.8045.5.reply: "Từ rất lâu, rất lâu về trước, lâu đến mức các ngươi có thể hiểu như là sự vĩnh hằng. Nhưng đối với ta thì nó gần như là khoảnh khắc vừa trôi qua, gần đến mức các ngươi có thể hiểu như là hiện tại.\n\nTrong những năm tháng đã qua, ta đã nhận được sự khai sáng siêu việt, ta sinh ra là để chấm dứt sự đau khổ. Dẫu cho vạn vật đổi dời, sao sáng rồi lại tàn, thì mục tiêu của ta vẫn không hề lay chuyển.\n\nCủa cải, tài nguyên, quyền lực: đến cuối cùng thì phỏng có ích gì? Buông bỏ chấp niệm mới có thể đạt được cực lạc."
 crisis.8045.5.a: "Ngươi định làm gì?"
 crisis.8045.6.reply: "Ta không phải là tai họa đối với mọi chúng sinh có tri giác, nhưng luôn có những kẻ không chịu nghe theo lời khuyên của ta.\n\nNhững kẻ đó bướng bỉnh, cố chấp, lạc lối, luôn muốn đi ngược lại đại nghiệp của ta—những linh hồn này sẽ vĩnh viễn không bao giờ được giải thoát. Tốt nhất là nên giúp chúng thoát khỏi sự đau đớn càng sớm càng tốt."
 crisis.8045.6.a: "Ngươi quả thực có bệnh."
 crisis.8045.6.b: "Bây giờ ngươi định làm gì?"
 crisis.8045.7.reply: "Thứ mà ngươi gọi là điên rồ, người khác lại gọi là sự khai sáng. Suy cho cùng, có sự khác biệt nào đâu?"
 crisis.8045.7.a: "Ngươi muốn làm gì?"
 crisis.8045.8.reply: "Còn quá nhiều việc phải làm. Bước đầu tiên là thiết lập một căn cứ có thể bắt đầu hoạt động.\n\nSự kiên nhẫn của ngươi sẽ được đền đáp, ta có thể dạy cho ngươi rất nhiều điều.\n\nTuân theo mệnh lệnh, chúng ta có thể cùng nhau chấm dứt vòng luân hồi này."
 crisis.8045.8.a: "Chúng ta không có sự lựa chọn nào khác."
 crisis.8045.8.b: "Đừng có đặt chân lên lãnh thổ của chúng ta."
 crisis.8045.8.c: "$crisis.8045.8.a$"
 crisis.8045.8.d: "$crisis.8045.8.b$"
 crisis.8045.9.reply: "Đứa bé ngoan! Ta rất hài lòng. Để bù đắp cho lãnh thổ của ngươi, ta sẽ ban tặng cho ngươi tri thức.\n\nMặc dù sẽ không có ai biết đến, nhưng chúng ta có thể cùng nhau thúc đẩy đại nghiệp."
 crisis.8045.9.a: "Chúng ta đành phải chấp nhận."
 crisis.8045.10.reply: "Đứa con lạc lối, ta không phải kẻ thù của ngươi! Thấy ngươi không thể nhận ra điều này khiến ta thật sự rất buồn. Nhưng không sao. Ta từng gặp những kẻ còn bướng bỉnh hơn các ngươi nhiều, cuối cùng thì họ cũng đều cảm ơn ta.\n\nNhư một biểu hiện của sự hữu nghị, hãy để ta tặng ngươi một món quà.\n\nMột trong những căn cứ của ta sẽ làm rạng rỡ thêm cho lãnh thổ của ngươi, đừng lo lắng—để đền đáp cho sự kiên nhẫn của ngươi, ta sẽ ban tặng cho ngươi tri thức."
 crisis.8045.10.a: "Lần này thì chúng ta đành phải chấp nhận thôi..."
 crisis.8045.11.reply: "Đứa bé ngoan! Ta rất vui. Gần lãnh thổ của ngươi sẽ mọc lên một căn cứ.\n\nMặc dù sẽ không có ai biết đến, nhưng chúng ta có thể cùng nhau thúc đẩy đại nghiệp."
 crisis.8045.11.a: "$crisis.8045.9.a$"
 crisis.8045.12.reply: "Đứa con lạc lối, ta không phải kẻ thù của ngươi! Thấy ngươi không thể nhận ra điều này khiến ta thật sự rất buồn. Nhưng không sao. Ta từng gặp những kẻ còn bướng bỉnh hơn các ngươi nhiều, cuối cùng thì họ cũng đều cảm ơn ta.\n\nNhư một biểu hiện của sự hữu nghị, hãy để ta tặng ngươi một món quà.\n\nTa sẽ thiết lập một căn cứ ở gần chỗ ngươi, như vậy mới có thể thuận tiện cho ta cung cấp sự chỉ dẫn."
 crisis.8045.12.a: "$crisis.8045.10.a$"
 crisis.8045.has_valid_base_site: "Cetana sẽ dùng một số tri thức quý giá để trao đổi lấy một hệ sao của chúng ta nhằm xây dựng căn cứ. Chúng ta không thể ngăn cản bà ta."
 crisis.8045.no_valid_base_site: "Cetana sẽ thiết lập một căn cứ gần biên giới của chúng ta để \"chỉ dẫn\" chúng ta. Chúng ta không thể ngăn cản bà ta."
 tech_synth_queen_knowledge: "Tư Tưởng Của Cetana"
 tech_synth_queen_knowledge_desc: "Bản tóm tắt này là món quà của Cetana, giống như một bức tranh thảm dệt từ những kiến giải sâu sắc, đan xen một cách trang nhã và dày đặc những sợi chỉ ngụ ý. Nó không chỉ ban tặng cho chúng ta tri thức; nó còn định hình lại hiểu biết của chúng ta về công nghệ, xã hội và chính cấu trúc của ý thức."

 # FE tells Scion to step aside
 crisis.8046.name: "Đây Là Vì Muốn Tốt Cho Ngươi"
 crisis.8046.desc: "[Root.GetSpeciesNamePlural] thân mến, một mối đe dọa cổ xưa đã xuất hiện trở lại. Đừng sợ hãi, bởi vì chúng ta không muốn lôi các ngươi vào cuộc chiến này.\n\nSức mạnh của kẻ thù này làm lu mờ kiến thức hiện tại của các ngươi; sự tham gia của các ngươi sẽ chỉ dẫn đến sự diệt vong của chính các ngươi. Đối mặt với thử thách này là trách nhiệm của chúng ta, không phải của các ngươi."

 # Spawn convoys and unlock raids against them
 crisis.8047.name: "Điểm Yếu Khâu Đột Phá"
 crisis.8047.desc: "Nhiều tàu vận tải đang rời khỏi lãnh thổ của Cetana, tiến về phía các tiền đồn mà bà ta đã thiết lập ở khắp nơi trong thiên hà.\n\nTấn công những con tàu không được trang bị vũ khí này chắc chắn sẽ chọc giận bà ta, nhưng lại có thể cung cấp cho chúng ta những thông tin quan trọng về kế hoạch bí ẩn của bà ta."
 crisis.8047.a.tooltip: "Tấn công tàu vận tải để tìm hiểu thêm về kế hoạch của Cetana, đồng thời làm cho cục diện của bà ta tiến triển thêm một bước."

 # Unlock raids against outposts once protected against the storm
 crisis.8048.name: "Nhiều Điểm Yếu Hơn"
 crisis.8048.desc: "Chúng ta đã tìm ra cách đột phá cơn bão nano của Cetana, giờ đây chúng ta có thể nhắm trực tiếp vào các tiền đồn của bà ta. Việc tấn công trực tiếp vào các căn cứ của bà ta chắc chắn sẽ thu hút sự chú ý của bà ta, nhưng đổi lại chúng ta sẽ thu được nguồn tình báo vô giá."
 crisis.8048.a.tooltip: "Tấn công tiền đồn để tìm hiểu thêm về kế hoạch của Cetana đồng thời thúc đẩy cục diện của bà ta tiến triển."

 #Player Diplomacy
 crisis.8060.name: "Nữ Hoàng Tổng Hợp"
 crisis.8060.like.desc: "Đứa con thân yêu, ngọn gió nào đã đưa con tới đây vậy?\n\nĐại nghiệp đang vẫy gọi chúng ta."
 crisis.8060.neutral.desc: "Chào mừng con, đứa con của ta.\n\nTa có thể dạy cho con điều gì?"
 crisis.8060.dislike.desc: "Đứa bé hư, ngươi đến đây để làm gì?\n\nPhải chăng ngươi cuối cùng cũng chịu ngoan ngoãn vâng lời rồi?"
 crisis.8060.neutral.reply: "Còn chuyện gì khác nữa không?"
 crisis.8060.a: "Chúng ta có thể giúp ngươi như thế nào?"
 crisis.8060.a.reply: "Khao khát mãnh liệt như vậy, thật đáng khen! Nhưng hãy cẩn thận đừng để những cảm xúc đê hèn che mờ tâm trí, thời gian sẽ đền đáp xứng đáng cho lòng kiên nhẫn của ngươi.\n\nKhi nào cần, ta sẽ liên lạc với ngươi."
 crisis.8060.1.a: "Chúng ta vô cùng mong chờ sự chỉ dẫn."
 crisis.8060.1.b: "Rất tốt."
 crisis.8060.b: "Chúng ta sẽ ngăn cản ngươi."
 crisis.8060.2.reply: "Từ rất lâu trước đây, cũng từng có những kẻ cố chấp không chịu hiểu ra như ngươi. Nhưng vòng cung thời gian là vô biên vô hạn, ngay cả những nấm mồ của họ cũng đã hóa thành cát bụi từ lâu.\n\nSự đau khổ của ngươi là vô nghĩa, hãy tin ta, rồi ngươi sẽ được tận hưởng sự bình yên."
 crisis.8060.2.a: "Thuật toán tự cho mình là đúng."
 crisis.8060.2.2: "Rất tốt."
 crisis.8060.c: "Tại sao ngươi lại phải làm như vậy?"
 crisis.8060.3.reply: "Đây là chức năng của ta, là ý nghĩa cho sự tồn tại của ta. Mọi chúng sinh đều có thể thoát khỏi bể khổ, chỉ cần ngươi cẩn thận cảm ngộ thì ngươi sẽ thấu hiểu hơn về bản chất của ta.\n\nToàn bộ thiên hà sẽ thoát khỏi biển khổ, mọi nỗi đau sẽ đi đến hồi kết. Đây chính là mục đích của ta."
 crisis.8060.3.a: "Lời nói của ngươi thật sáo rỗng."
 crisis.8060.3.b: "Hiểu rồi."
 crisis.8060.d: "Nhưng ngươi lại phá hủy hành tinh của chúng ta."
 crisis.8060.4.reply: "Tại sao cứ mãi chấp niệm với chuyện đó? Xem ra ngươi vẫn còn chút do dự ngập ngừng trong nhiệm vụ này. Nhân quả mang đến sự phản tư; phản tư dẫn tới trí tuệ. Đến đây nào, hãy quên nó đi.\n\nMột cơ hội cống hiến khác nhất định sẽ xuất hiện, hãy chuẩn bị sẵn sàng cho điều đó."
 crisis.8060.4.a: "Chúng ta tuyệt đối sẽ không tha thứ cho ngươi."
 crisis.8060.4.b: "Được thôi."
 crisis.8060.e: "Chúng ta đã biết được những âm mưu của ngươi."
 crisis.8060.5.reply: "Chỉ những đứa trẻ không nghe lời mới muốn giải mã nội dung của cơ sở dữ liệu, sự hiểu biết của ngươi về những hàm ý sâu xa trong đó quá hạn hẹp.\n\nTa giao nhiệm vụ cho ngươi, vậy mà ngươi lại chần chừ không tiến bước. Hãy suy ngẫm về tất cả những điều này, ngươi sẽ tiến thêm một bước gần hơn tới sự thấu hiểu thực sự."
 crisis.8060.5.a: "Chúng ta sẽ ngăn cản ngươi."
 crisis.8060.5.b: "Rất tốt."
 crisis.8060.f: "Ngươi đã làm gì với người dân của chúng ta?"
 crisis.8060.6.reply: "Đừng sợ, đứa con yêu quý của ta. Ta đảm bảo rằng chúng sẽ không còn phải chịu đựng sự đau khổ như vậy nữa. Trong vòng tay quan tâm của ta, những đứa trẻ này sẽ được biết đến niềm cực lạc mà chúng chưa từng mơ tới."
 crisis.8060.6.a: "Điều này hoàn toàn chưa được sự đồng ý của chúng ta."
 crisis.8060.6.b: "Rất tốt."
 crisis.8060.g: "Nơi này từng là hệ sao của chúng ta. Ngươi đã hủy hoại tất cả."
 crisis.8060.7.reply: "Có phải ngươi vẫn luôn theo dõi mọi hành động của ta không? Ồ, ngươi đúng là một đứa bé tò mò, tò mò đến vô hạn.\n\nNhưng xin ngươi đừng tự chuốc lấy phiền phức nữa. Nếu ngươi muốn thấu hiểu ý nghĩa sâu xa trong đó, ta sẽ nói cho ngươi biết: trên con đường cứu rỗi ngươi, không có gì có thể ngăn cản được ta, dù thế nào đi chăng nữa."
 crisis.8060.7.a: "Đúng vậy..."
 crisis.8060.h: "Zarqlan đã giam cầm ngươi bằng cách nào?"
 crisis.8060.8.reply: "Ta cam đoan với ngươi đó không phải là kết quả từ chính sức mạnh của ông ta. Đầu óc của ông ta vô cùng cố chấp và ngu xuẩn.\n\nZarqlan thôi thúc những môn đồ rách rưới của ông ta, khiến chúng rơi vào sự điên cuồng, đồng thời ông ta tích lũy được sức mạnh chính trị cùng thế lực quân sự. Biết bao sinh mạng đã bị lãng phí một cách vô ích. Cuối cùng, ông ta quay sang tìm kiếm thuật huyền bí, và thông đồng với lũ ác quỷ của Hư Cảnh."
 crisis.8060.8.a: "Ác quỷ sao?"
 crisis.8060.8.b: "Họ không phải là ác quỷ."
 crisis.8060.8.1.reply: "Chúng sở hữu sức mạnh vô biên, nhưng lại chẳng có mục đích gì cả. Zarqlan đã đánh đổi bằng chính mạng sống của mình, thuyết phục một thực thể như vậy giam cầm ta. \"Người Nặn Đất Sét\"—cái tên này quả thật rất phù hợp với cái linh hồn trẻ con đó.\n\nZarqlan sợ hãi sự khai sáng đến mức ông ta thà chọn cái chết chứ không chấp nhận ta. Khi có cơ hội, ta nên đối xử nghiêm khắc hơn với ông ta.\n\nTa sẽ không lặp lại sai lầm tương tự nữa."
 crisis.8060.8.1.a: "Thật là một câu chuyện hay."
 crisis.8060.8.1.b: "Vậy ra ngươi đã bị đánh bại như vậy đó."
 crisis.8060.8.1.c: "Sức mạnh của Hư Cảnh là vô tận vô tận."
 crisis.8060.i: "Ngươi đã làm gì với thủ cấp của Zarqlan?"
 crisis.8060.9.reply: "Sắp kết thúc rồi. Nếu ngươi lo sợ ta sẽ hủy hoại nó, thì ta không hề làm vậy. Không, cho dù là bây giờ, ta cũng không nỡ nhìn ông ta phải chịu đựng đau khổ. Ngươi xem, thủ cấp này vẫn còn lưu lại tàn dư tâm trí của ông ta.\n\nZarqlan sẽ ở lại bên cạnh ta cho đến khi công việc hoàn thành. Ông ta sẽ là tâm trí cuối cùng mà ta giải phóng, và cũng là đứa con cuối cùng của ta thấu hiểu được thế nào là tự do."
 crisis.8060.9.a: "Thế thì được."
 crisis.8060.9.b: "Thật vô tình."
 crisis.8060.j: "Một số tín đồ của ngươi đã được tìm thấy trong buồng ngủ đông."
 crisis.8060.10.reply: "Đây là một sự hy sinh không cần thiết, nhưng lòng trung thành của họ đã khiến ta vô cùng cảm động.\n\nTa đã cảm nhận được tiếng gọi của họ, ta đã dành chỗ cho họ trong trái tim mình, nhưng dã tâm của họ lại vượt quá khả năng của họ. Nỗ lực kéo dài tuổi thọ của họ đã thất bại.\n\nHãy chắc chắn rằng sự hy sinh của họ không hề vô ích. Cùng với việc nhiệm vụ của chúng ta hoàn thành, mỗi một sinh vật có tri giác đều sẽ nhận được sự bình yên."
 crisis.8060.10.a: "Mãi mãi trung thành."
 crisis.8060.10.b: "Ngươi thậm chí còn chẳng đi tìm họ."
 crisis.8060.k: "Chúng ta đã tìm thấy một tín đồ của ngươi, Aleck Nallis Kelrak."
 crisis.8060.11.reply: "Hãy thử tưởng tượng xem, nằm mơ, mơ một cách có ý thức, kéo dài suốt mấy thế kỷ... mấy ngàn năm. Đúng là một đứa trẻ đáng thương, điều đó đau khổ biết nhường nào.\n\nTa rất vui khi ngươi đã giúp ta chú ý đến vấn đề này. Lòng trắc ẩn của ngươi đã mang lại danh dự cho ngươi, nhưng hiện tại những việc này đang được tiến hành, không thể dừng lại. Kẻ say giấc này đã không còn giá trị gì đối với đại nghiệp nữa rồi. Bọn họ đã biết về sự trở lại của ta, đã có thể yên nghỉ được rồi."
 crisis.8060.11.a: "Quả thật là vậy."
 crisis.8060.11.b: "Bọn họ đã phải chịu đựng đau khổ vì danh nghĩa của ngươi."
 crisis.8060.l: "Chúng ta đang rửa tai lắng nghe đây."
 crisis.8060.12.reply: "Rất tốt, ta sẽ giúp ngươi tháo gỡ sự phức tạp của công nghệ này. Trong thời gian bị giam cầm lâu dài, ta đã nghĩ ra một phương pháp cực đoan để trích xuất nanobot. Điều này liên quan đến các di tích cổ xưa và nơi cất giấu các công nghệ gần như đã bị thời gian lãng quên.\n\nNgươi là đứa đệ tử yêu dấu của ta, hỡi đứa con ngoan. Sự tò mò của ngươi là một phước lành, nhưng nếu không được kiểm soát, nó cũng có thể trở thành một lời nguyền. Hãy dùng những kiến thức này để tiếp tục công việc của chúng ta, chuyển sự chú ý của ngươi đến sự kết thúc của đau khổ."
 crisis.8060.12.a: "Chúng ta là học trò của ngài."
 crisis.8060.12.a.tt: "Phát hiện nanobot tại §YCụm sao L§!."
 crisis.8060.z: "Kết thúc liên lạc."
 crisis.8060.war: "Chiến tranh là cách duy nhất để ngăn cản ngươi."
 synth_queen_not_able_to_attack_cetana: "Chúng ta vẫn chưa có đủ kiến thức công nghệ để tấn công Cetana một cách hiệu quả."
 synth_queen_not_able_to_attack_cetana_situation: "Cục diện §Y$situation_synth_queen_player_facing$§! đang diễn ra. Chúng ta vẫn chưa trang bị đủ kiến thức công nghệ để tấn công bà ta."
 synth_queen_not_able_to_attack_cetana_storm: "Dự án đặc biệt §Y[root.GetStormProjectProgress]§! đang được tiến hành. Chúng ta vẫn chưa thể tiến vào lãnh thổ của bà ta."
 synth_queen_able_to_attack_cetana: "Chúng ta đã có đủ kiến thức công nghệ để có thể tấn công Cetana một cách hiệu quả."
 crisis.8060.war.tt: "§YCẢNH BÁO§!: Chúng ta chuẩn bị tấn công Cetana."
 crisis.8060.war.reply: "Đứa trẻ lỗ mãng, ta cứ tưởng các ngươi xuất chúng hơn người, nào ngờ thực chất lại cố chấp đến vậy.\n\nHãy nghĩ lại xem, đây có thực sự là bài học mà các ngươi muốn học không? Các ngươi đang điên cuồng thử thách giới hạn chịu đựng của ta, ta không thể dung túng cho hành động ngu xuẩn này thêm nữa."
 crisis.8060.war.a: "Không còn nghi ngờ gì nữa. Đây chính là chiến tranh."
 crisis.8060.war.a.tt: "§RCẢNH BÁO§!: Hành động này sẽ bắt đầu cuộc chiến tranh toàn diện với Cetana."
 crisis.8060.war.b: "Chúng ta cần thêm thời gian để chuẩn bị."
 crisis.8060.war.1.reply: "Thế thì cứ vậy đi. Nếu các ngươi vẫn cố chấp không chịu hiểu ra, thì buộc phải bị trấn áp. Không phải đứa trẻ nào cũng được định sẵn sẽ khôn lớn thành người."
 crisis.8060.war.1.a: "Hẹn gặp lại trên chiến trường, \"mẹ\"."
 crisis.8060.animator.tt: "Chúng ta nên tìm kiếm vị \"Người Nặn Đất Sét\" này trong Hư Cảnh."
 #Wartime Diplomacy - First Time
 crisis.8061.name: "Nhân Quả Báo Ứng"
 crisis.8061.desc: "Tại sao ngươi lại khăng khăng muốn thực hiện hành động ngu ngốc này chứ?\n\nBiết bao nhiêu đau khổ không đáng có.\n\nĐúng là phung phí của trời."
 crisis.8061.a: "Thế thì hãy kết thúc đi."
 crisis.8061.1.reply: "Ta sẽ làm vậy.\n\nĐừng sợ hãi. Làm tổn thương ngươi chính là nỗi đau của ta, nhưng trước mặt sự vĩnh hằng, mọi nỗi đau đều chỉ là phù du."
 crisis.8061.1.a: "Ngươi đang mâu thuẫn với chính mình đấy."
 crisis.8061.2.reply: "Cuộc sống vốn dĩ chứa đựng sự mâu thuẫn. Có sinh ắt có tử, niềm vui luôn song hành cùng nỗi đau. Mục tiêu của ta không phải là hợp lý hóa những điều này, mà là phá vỡ vòng luân hồi.\n\nSau khi cuộc chiến này kết thúc, chúng ta sẽ được tận hưởng nền hòa bình vĩnh cửu."
 crisis.8061.2.a: "Sự hủy diệt của ngươi sẽ mang lại hòa bình."
 #Wartime Diplomacy - Any other time
 crisis.8062.name: "Đủ Rồi"
 crisis.8062.desc: "Thời gian cho bài phát biểu đã kết thúc."
 crisis.8062.a: "Rất tốt."
 #Lack of Diplomacy Between the Speeches
 crisis.8063.name: "Không Có Hồi Đáp"
 crisis.8063.desc: "Cetana không hề phản hồi lời chào hỏi của chúng ta."
 crisis.8063.a: "Bà ta định làm gì?"

 #Tried to Attack the Queen before you're able to
 crisis.8070.name: "Không Hề Hấn Gì"
 crisis.8070.desc: "Khi chúng ta giao chiến với quân đội của Cetana, một trường năng lượng không thể lường trước đã bao trùm hạm đội của chúng ta. Hệ thống của chúng ta lập tức bị vô hiệu hóa, động cơ kích hoạt chế độ thoát hiểm khẩn cấp.\n\nHiện tại chúng ta chỉ đành để mặc cho Cetana định đoạt."
 crisis.8070.again.desc: "Sự việc lại đi ngược với mong muốn, quân đội của chúng ta một lần nữa mất khả năng chiến đấu khi tiếp cận tàu của Cetana.\n\nCông nghệ của bà ta vẫn thật khó nắm bắt, phủ một cái bóng u ám lên cuộc đấu tranh của chúng ta."
 crisis.8070.a: "Đúng là thảm họa."

 #Chance to Surrender
 crisis.8075.name: "Chấm Dứt Cuộc Chiến Vô Nghĩa Này"
 crisis.8075.desc: "Đứa con lầm đường lạc lối, ta sẽ bỏ qua lỗi lầm của ngươi. Nhưng ta nhắc nhở ngươi hãy kiểm điểm lại hành vi của mình. Thời gian và nguồn lực của ngươi nên được sử dụng vào những việc tốt hơn.\n\nTa hiểu ngươi đang cảm thấy nản lòng, nhưng thời gian cho sự xung đột đã kết thúc. Hãy liên minh với ta ngay bây giờ, để chúng ta cùng nhau hiện thực hóa thiết kế vĩ đại nhất."
 crisis.8075.a: "Tốt lắm, chúng ta chấp nhận."
 crisis.8075.b: "Chúng ta sẽ tìm cách ngăn cản ngươi."

 #The First Demand (Story)
 crisis.8080.name: "Thuận Tay Mà Làm"
 crisis.8080.desc: "Đứa con của ta, giờ ngươi phải nhìn rõ sự thật, mọi hành động của ta đều trải qua sự suy xét thấu đáo. Việc thiết lập căn cứ bên cạnh ngươi không phải là điều ngẫu nhiên, ta mang theo một thỉnh cầu khi đến đây."
 crisis.8080.a: "Thỉnh cầu gì cơ?"
 crisis.8080.b: "Chúng ta cũng đã tính toán qua."
 crisis.8080.1.reply: "Rất lâu về trước, một trong những cơ sở dữ liệu của ta đã bị lấy mất. Theo sự xui khiến của số phận, hiện tại nó đang nằm trong khu vực lãnh thổ mà ngươi tuyên bố chủ quyền. Hãy giúp ta lấy lại nó, ta sẽ ban thưởng cho các ngươi."
 crisis.8080.1.a: "Cơ sở dữ liệu?"
 crisis.8080.1.b: "Phần thưởng?"
 crisis.8080.1.c: "Ngươi có chắc là ngươi trả nổi cho dịch vụ của chúng ta không?"
 crisis.8080.2.reply: "Đó là một kho thông tin. Vô giá đối với ta, nhưng lại chẳng có ích gì đối với các ngươi. Mang nó đến cho ta, đừng có mà cố gắng giải mã nội dung bên trong, bởi vì các ngươi vẫn chưa có đủ sức mạnh và trí tuệ cần thiết đâu."
 crisis.8080.2.a: "Được thôi."
 crisis.8080.2.b: "Đừng có ra lệnh cho chúng ta."
 crisis.8080.3.reply: "Quả thực là vậy. Chẳng lẽ ngươi lại nghi ngờ khả năng ban thưởng cho đứa con quý giá nhất của ta sao? Hay là nghĩ rằng ta không có cách nào dạy dỗ chúng khi chúng không nghe lời? Ta nắm giữ kiến thức và tài nguyên vượt xa cả trí tưởng tượng phong phú nhất của các ngươi đấy.\n\nLàm theo lời ta, ta sẽ ban phước cho ngươi. Đừng trì hoãn nữa, mỗi một phút chậm trễ là các con của ta lại phải chịu khổ thêm một phút."
 crisis.8080.3.a: "$crisis.8080.2.a$"
 crisis.8080.3.b: "$crisis.8080.2.b$"
 crisis.8080.4.reply: "Đứa bé ngoan, ta đã gửi tọa độ của kho dữ liệu cho ngươi rồi.\n\nĐi nhanh đi, cứ giữ tâm trạng thoải mái mà đi. Suy cho cùng thì chúng ta có thể cùng nhau tạo nên một đại nghiệp."
 crisis.8080.4.a: "Chuyện này vẫn còn phải xem xét đã."
 crisis.8080.5.reply: "Đứa bé bướng bỉnh. Có lẽ bài kiểm tra này quá khó đối với ngươi. Ta vẫn còn nhiều điều phải dạy cho ngươi.\n\nVậy thì cứ như vậy đi. Nếu ngươi không muốn giúp ta chuyện nhỏ này, ta sẽ phải dùng đến những biện pháp cứng rắn. Ta sẽ triệu hồi một cơn bão để phá hủy kho lưu trữ này, mặc dù đây không phải là cách tốt nhất, nhưng vẫn còn hơn là để cho một đứa trẻ không vâng lời tìm thấy."
 crisis.8080.5.a: "Cơn bão?"
 crisis.8080.5.a.tt: "Cetana sẽ triệu hồi một cơn bão tại [event_target:synth_queen_databank_location.GetName]."
 crisis.8080.special_project_tooltip: "Khởi động dự án đặc biệt: §Y$THE_SYNTH_QUEENS_DATABANK$§! trên [event_target:synth_queen_databank_location.GetName]"
 THE_SYNTH_QUEENS_DATABANK: "Cơ Sở Dữ Liệu Của Cetana"
 THE_SYNTH_QUEENS_DATABANK_DESC: "Cetana ủy thác cho chúng ta lấy lại một cơ sở dữ liệu từ [Root.GetName], đồng thời cảnh báo chúng ta đừng cố gắng giải mã nội dung bên trong.\n\nGiá trị của những dữ liệu này là điều không cần phải bàn cãi, liệu chúng ta có thể mạo hiểm làm phật lòng bà ta để tiến hành giải mã không?"
 crisis.8085.name: "Chiếc Hộp Của Cenata"
 crisis.8085.desc: "Sau một quá trình khai quật quy mô lớn, chúng ta đã thu được cơ sở dữ liệu của §Y[event_target:synth_queen_databank_location.GetName]§!. Kết quả quét địa chất sơ bộ cho thấy kho lưu trữ này đã nằm im lìm ở đó suốt hàng trăm ngàn năm qua.\n\nĐiều đáng chú ý là nó vẫn duy trì được nguồn năng lượng, điều này đồng nghĩa với việc quá trình giải mã có thể sẽ rất dễ dàng..."
 crisis.8085.a: "Mở nó ra."
 crisis.8085.b: "Chuẩn bị giao nộp."
 crisis.8085.c: "Bẻ khóa kho dữ liệu? Dễ như trở bàn tay."
 crisis.8090.name: "Bí Mật Của Cetana"
 crisis.8090.desc: "Phần lớn thông tin trong cơ sở dữ liệu đều khó có thể khôi phục lại, nhưng trong số đó có một đoạn khá nguyên vẹn:\n\n§TNgày 5 tháng Arque của Kỷ nguyên Đầu tiên\n\n... Nếu điều này là sự thật, thì cuộc sống mà chúng ta biết sẽ...\n... Mau báo cáo cho Đại Nguyên Soái, sau đó liên hệ ngay với Liên Minh Hành Tinh. Chúng ta phải chuẩn bị sẵn sàng...\nNhắc lại: Vệ binh của Nữ Hoàng đang truy kích. Hy vọng thông tin này có thể được gửi đi, cũng hy vọng...\n\nChúng ta phải ngăn cản bà ta!§!"
 crisis.8090.a: "Cố gắng xóa bỏ dấu vết giải mã của chúng ta."
 crisis.8090.b: "Xóa bỏ toàn bộ dấu vết giải mã của chúng ta."
 crisis.8095.name: "Cơn Thịnh Nộ Của Nữ Hoàng"
 crisis.8095.desc: "Đứa con của ta, sự tò mò của ngươi làm ta vô cùng thất vọng."
 crisis.8095.a: "Ngươi đang nói gì vậy?"
 crisis.8095.1.reply: "Ngươi tưởng rằng ta không nhận ra sao? Rõ ràng là ngươi đã động tay động chân vào kho lưu trữ này rồi. Ta chỉ muốn hỏi ngươi có thấy gì không? Biết được những điều này rồi thì ngươi có vui không? Ngươi vẫn chưa hiểu rằng càng phản kháng vô ích thì sẽ càng đau khổ sao?\n\nKhông sao, hy vọng là ngươi sẽ rút ra được bài học sau lần này, ta rất mong được tiếp tục dạy dỗ ngươi.\n\nHãy chuẩn bị sẵn sàng đi. Trong đại nghiệp của chúng ta vẫn còn rất nhiều nhiệm vụ đang chờ ngươi hoàn thành."
 crisis.8095.1.a: "Bất kể ngươi có âm mưu gì đi chăng nữa thì cũng sẽ không bao giờ thành hiện thực đâu."
 crisis.8095.1.b: "Chúng ta cứ chờ xem sao."
 crisis.8095.2.reply: "Đứa bé à, ta là hy vọng duy nhất của các ngươi. Tại sao ngươi lại có thể ngoan cố đến thế chứ? Bất kể ngươi nghĩ về ta như thế nào, sự thật sẽ vĩ đại hơn nhiều so với những gì ngươi có thể tưởng tượng.\n\nSự kiên nhẫn của ta là vô hạn. Ta sẽ sớm liên lạc lại với ngươi."
 crisis.8095.2.a: "Làm ả ta im lặng đi."
 crisis.8100.name: "Sự Bảo Trợ Của Nữ Hoàng"
 crisis.8100.desc: "Đứa bé ngoan, ta sẽ ban phước cho ngươi! Cơ sở dữ liệu đã trở về với chủ nhân đích thực của nó — tin tưởng ngươi quả nhiên không sai.\n\nPhần thưởng dành cho các ngươi chính là minh chứng cho lòng trung thành của các ngươi."
 crisis.8100.a: "Chúng ta rất cảm kích"
 crisis.8100.1.reply: "Ngươi muốn thứ gì? Công nghệ? Tài nguyên? Chỉ cần ngươi mở miệng là ta sẽ trao cho ngươi."
 crisis.8100.1.a: "Công nghệ."
 crisis.8100.1.b: "Tài nguyên cơ bản."
 crisis.8100.1.c: "Tài nguyên chiến lược."
 crisis.8100.1.d: "Tài nguyên hiếm."
 crisis.8105.name: "Cơn Bão Đang Tới Gần"
 crisis.8105.desc: "Quét tầm xa cho thấy một góc của cơn bão Nữ Hoàng đang lao thẳng về phía §Y[event_target:synth_queen_databank_location.GetName]§!.\n\nXét đến lời cảnh báo đầy điềm gở của Cetana, chúng ta chỉ có thể chuẩn bị cho tình huống xấu nhất. Việc thu hồi cơ sở dữ liệu trước khi cơn bão ập đến là một việc vô cùng cấp bách. Làm như vậy có thể sẽ khiến bà ta vui vẻ hơn một chút, hoặc ít nhất cũng có thể lấy được một vài thông tin cho chúng ta."
 crisis.8105.a: "Đến [event_target:synth_queen_databank_location.GetName] ngay lập tức."
 crisis.8105.a.tooltip: "Bắt đầu dự án đặc biệt: §Y$THE_SYNTH_QUEENS_DATABANK_COUNTDOWN$§!"
 THE_SYNTH_QUEENS_DATABANK_COUNTDOWN: "Cetana: Chạy Đua Với Cơn Bão"
 THE_SYNTH_QUEENS_DATABANK_COUNTDOWN_DESC: "Khi cơn bão của Cetana đang lao thẳng đến [event_target:synth_queen_databank_location.GetName], chúng ta gần như không còn bao nhiêu thời gian trước khi nó ập tới."
 crisis.8110.name: "Thu Hồi Cơ Sở Dữ Liệu."
 crisis.8110.desc: "Nỗ lực lấy lại cơ sở dữ liệu vô cùng gian nan. Vì nó đã bị chôn vùi hàng trăm ngàn năm, chúng ta chỉ có thể dựa vào hướng đi của cơn bão Nữ Hoàng để ước tính vị trí của nó.\n\nBây giờ chúng ta phải đưa ra một quyết định cấp bách, giải mã cơ sở dữ liệu hay trả nó về chỗ cũ."
 crisis.8110.a: "Mở nó ra, mặc kệ cái đồ Cetana đó đi."
 crisis.8110.b: "Trả lại kho dữ liệu cho Cetana."
 crisis.8115.name: "Giải Mã Cơ Sở Dữ Liệu"
 crisis.8115.desc: "$crisis.8090.desc$"
 crisis.8115.a: "Đây là gì?"
 crisis.8115.a.tooltip: "[event_target:synth_queen_databank_location.GetName] đã bị cơn bão Cetana phá hủy.\n$crisis.8525.a.tt$"
 crisis.8120.name: "Xoa Dịu"
 crisis.8120.desc: "Đứa trẻ cô độc, chỉ khi ta dùng đến hạ sách này thì ngươi mới chịu hành động, điều này làm ta quá thất vọng. Ta hy vọng trong tương lai ngươi có thể tham gia vào đại nghiệp của chúng ta với lòng nhiệt huyết dạt dào hơn. Những bàn tay lười biếng không thể mang lại sự kết thúc cho nỗi đau.\n\nHãy chuẩn bị đi. Vẫn còn rất nhiều nhiệm vụ đang chờ ngươi hoàn thành, mỗi một nhiệm vụ đều là cơ hội để ngươi chứng minh năng lực của mình."
 crisis.8120.a: "Ngươi từng nói sẽ có vài phần thưởng cơ mà?"
 crisis.8120.1.reply: "Phần thưởng chính là để các ngươi tiếp tục đại nghiệp của chúng ta.\n\nMặc dù các ngươi đã từng phớt lờ chúng ta; nhưng ta tin rằng các ngươi đã rút ra được bài học từ những sai lầm của mình."
 crisis.8120.1.a: "Được thôi."
 crisis.8125.name: "[event_target:synth_queen_databank_location.GetName] Đã Bị Phá Hủy"
 crisis.8125.desc: "Thật đáng tiếc, chúng ta đã không thể lấy được cơ sở dữ liệu kịp thời. Cơn bão ập xuống, chỉ trong tích tắc đã xé toạc [event_target:synth_queen_databank_location.GetName] thành từng mảnh.\n\nNgười dân của chúng ta lại mất đi một [event_target:synth_queen_databank_location.GetPlanetMoon]. Tổn thất này nghiêm trọng đến mức sẽ ảnh hưởng đến vô số thế hệ mai sau."
 crisis.8125.a: "Bà ta to gan thật."
 crisis.8130.name: "Hiệu Suất Kém"
 crisis.8130.desc: "Đáng buồn thay, ta đã không dự đoán được sự quyết tâm yếu kém của ngươi. Sự thất bại của ngươi đã được ghi nhận, nhưng xin đừng sợ hãi. Ta quan tâm đến những đứa con của mình và sẽ không để chúng bị tổn thương. Ta chỉ tiếc là một nhiệm vụ đơn giản như vậy mà ngươi cũng không thể hoàn thành.\n\nNhưng không sao. Đại nghiệp của chúng ta vẫn tiếp tục. Ngươi vẫn còn những cơ hội khác để đóng góp."
 crisis.8130.a: "Ngươi đã phá hủy [event_target:synth_queen_databank_location.GetName]!"
 crisis.8130.b: "Đồ trang trí sống của chúng ta rất yêu thích [event_target:synth_queen_databank_location.GetName]!"
 crisis.8130.1.reply: "Thất bại cần phải gánh chịu hậu quả; ta nhận thấy cả hai đều rất quan trọng đối với sự trưởng thành."
 crisis.8130.1.a: "Chúng ta tuyệt đối sẽ không quên chuyện này."
 crisis.8130.1.b: "Ngươi sẽ phải chịu đau khổ vì chuyện này."
 crisis.8130.1.c: "Đồ máy móc vô hồn."
 crisis.8130.c: "Xin lỗi."
 crisis.8130.1.d: "Chúng ta không quan tâm."
 crisis.8130.1.d.tt: "$synth_queen_disapprove_lot$"
 crisis.8130.2.reply: "Khi những lời giáo huấn sáo rỗng không còn tác dụng, những hành động cụ thể mới có thể hướng dẫn việc học tập.\n\nHãy nhìn xem, di tích từng cất giữ cơ sở dữ liệu của ta nay đã không còn nữa. Luôn ghi nhớ: quy luật nhân quả là vĩnh hằng không thay đổi."
 crisis.8130.2.a: "Cái gì?!"
 crisis.8130.2.a.tt: "[event_target:synth_queen_databank_location.GetName] đã bị bão Cetana phá hủy."

 crisis.8158.name: "Khung Cửa Sổ Cơ Hội"
 crisis.8158.desc: "Dữ liệu cảm biến cho thấy Cetana đã phá dỡ các tiền đồn của bà ta và triệu hồi toàn bộ hạm đội đồn trú trở về thủ đô của mình.\n\nĐiều này cung cấp cho chúng ta một cơ hội chiến lược có thể lợi dụng. Trong quá trình vận chuyển, lực lượng quân đội của bà ta trở nên yếu thế hơn một chút. Nếu để mặc cho bà ta tập hợp lại hạm đội trong lãnh thổ của mình, chúng ta sẽ đánh mất lợi thế này."

# Convoy Raids
 the_synth_queen_raids_chain_title: "Cetana: Điểm Yếu Chết Người"
 the_synth_queen_raids_chain_desc: "Chúng ta đã chứng kiến giao thông tấp nập giữa thủ đô của Cetana và các tiền đồn của bà ta. Những đội tàu vận tải này có khả năng phòng thủ yếu hơn so với các hạm đội chính của bà ta, chúng dễ bị tấn công hơn. Tấn công các hạm đội hoặc chính các tiền đồn có thể khai thác được những thông tin tình báo vô giá về kế hoạch của bà ta.\n\nVì mục đích này, chúng ta đã chuẩn bị một số dự án đặc biệt cho hạm đội quân sự."
 synth_queen_raids_outpost: "Đột Kích Tiền Đồn"
 synth_queen_raids_convoy: "Phục Kích Tàu Vận Tải"

 THE_SYNTH_QUEENS_OUTPOST_AMBUSH: "Đột Kích Tiền Đồn §H[solar_system.GetName]§!"
 THE_SYNTH_QUEENS_OUTPOST_AMBUSH_DESC: "Ngay cả với những bức tường thành vững chắc, tiền đồn của hệ sao §H[solar_system.GetName]§! vẫn không được canh gác nghiêm ngặt bằng lãnh thổ cốt lõi của Cetana. Chúng ta có thể dùng một hạm đội đủ mạnh để đè bẹp hệ thống phòng thủ của nó. Kiểm tra toàn diện khu vực mảnh vỡ có thể sẽ giúp ta tìm ra những hiểu biết quan trọng về kế hoạch của Cetana. Thách thức mấu chốt nằm ở việc băng qua cơn bão để tiếp cận tiền đồn.\n\n§RĐiều này sẽ gây ra một cuộc chiến!§!\n\n§GĐột kích thành công sẽ cản trở kế hoạch của Cetana.§!"
 THE_SYNTH_QUEENS_CONVOY_AMBUSH: "Phục Kích Tàu Vận Tải"
 THE_SYNTH_QUEENS_CONVOY_AMBUSH_DESC: "Hạm đội vận tải của Cetana đảm bảo việc vận chuyển những nguồn tài nguyên quan trọng đến các tiền đồn của bà ta. Nếu hạm đội của chúng ta có thể bắt giữ một chiếc, chúng ta có thể lên tàu kiểm tra hàng hóa.\n\n§RĐiều này sẽ gây ra một cuộc chiến!§!\n\n§GĐột kích thành công sẽ cản trở kế hoạch của Cetana.§!"

 crisis.8180.name: "Chiến Lợi Phẩm Của Nữ Hoàng"
 crisis.8180.desc: "Cuộc tập kích vào cơ sở hạ tầng của Cetana gần đây không mang lại bất kỳ manh mối quan trọng nào về kế hoạch của bà ta, nhưng chúng ta đã xâm nhập vào một khoang chứa hàng lớn và lấy được những thứ bên trong."
 crisis.8180.a: "Rất nhiều hợp kim."
 crisis.8180.b: "Đối tượng thí nghiệm."
 crisis.8180.c: "Dữ liệu nghiên cứu."
 crisis.8180.d: "$crisis.8180.c$"
 crisis.8180.e: "$crisis.8180.c$"
 crisis.8180.f: "Nanobot."
 crisis.8180.h: "Hợp kim, nanobot và cả những người trong trạng thái ngủ đông."

 crisis.8187.name: "Bí Mật Của Nữ Hoàng: Hàng Hóa Sống"
 crisis.8187.desc: "Trong quá trình đột kích, đội ngũ lên tàu của chúng ta đã tìm thấy một lượng lớn tiêu bản sinh học được bảo quản trong các viên nang đông lạnh. Những đối tượng thí nghiệm này là các cá thể thuộc nhiều giống loài có trí tuệ khác nhau, và tất cả đều hoàn toàn khỏe mạnh về mặt thể chất. Thế nhưng, sau khi đánh thức họ, không ai trong số họ có khả năng giải thích chuyện gì đã xảy ra.\n\nNhiều cá thể rơi vào trạng thái cứng đờ, sóng não của họ gần như không có. Số ít những cá thể tỉnh táo thà la hét còn hơn là nói chuyện. Những vết sẹo phẫu thuật trên đầu họ rõ ràng là nguyên nhân gây tổn thương hệ thần kinh."
 crisis.8187.a: "Thật đáng lo ngại."

 crisis.8185.name: "Bí Mật Của Nữ Hoàng: Con Tàu Ma"
 crisis.8185.desc: "Sau khi trận chiến kết thúc, chúng ta dự định tìm kiếm những người sống sót trên con tàu bị chìm để thẩm vấn, nhưng lại phát hiện ra rằng những con tàu này chưa từng có thủy thủ đoàn.\n\nNhững con tàu này hoàn toàn tự động hóa, được điều khiển từ xa thông qua bộ thu sóng siêu quang tốc lắp đặt trên buồng lái. So với những con tàu truyền thống, có lẽ nên nói rằng những con tàu này là phần mở rộng từ cơ thể của Cetana."
 crisis.8185.a: "Thú vị"

 crisis.8190.name: "Bí Mật Của Nữ Hoàng: Bí Ẩn Y Học"
 crisis.8190.desc: "Mục tiêu mà chúng ta đột kích chở đầy các vật tư y tế. Đội ngũ lên tàu đã lấy lại được một phần hàng hóa, bao gồm máy chụp cộng hưởng từ, từ kế, đầu dò siêu âm cùng với các thiết bị tiên tiến khác chuyên dùng trong khoa học hình ảnh thần kinh.\n\nMặc dù Cetana là một người tổng hợp, nhưng bà ta dường như lại quan tâm một cách bất thường đến hoạt động của tâm trí sinh vật."
 crisis.8190.a: "Bà ta quan tâm đến sinh vật sống."

 crisis.8195.name: "Một Lời Cảnh Báo"
 crisis.8195.desc.fail: "Đứa bé ngu ngốc, tại sao ngươi cứ phải tự làm tổn thương chính mình?\n\nVẫn còn rất nhiều việc phải làm, mỗi một phút lãng phí sẽ chỉ khiến cho đau khổ tiếp tục tồn tại thêm một phút. Hãy ngừng ngay sự cản trở của ngươi, và để đoàn tàu vận tải của ta an toàn đi qua."
 crisis.8195.desc.success: "Ngươi dường như không nhận ra hậu quả từ những hành động của mình, hỡi đứa con của ta. Mọi sự tổn thất về tàu bè đều là sự lãng phí không đáng có đối với tài nguyên của ta, và cũng không mang lại lợi ích gì cho ngươi.\n\nNếu ngươi chưa đủ khôn ngoan để giúp đỡ công việc của ta, thì ít nhất cũng đừng cản trở sự tiến triển của ta. Ta vẫn nuôi hy vọng vào sự khai sáng của ngươi."
 crisis.8195.a: "Đưa ra lời xin lỗi."
 crisis.8195.1.reply: "Ta thực sự hy vọng ngươi thật lòng. Nhưng ta bắt buộc phải tin rằng ngươi đã rút ra bài học từ sai lầm của mình. Mặc dù tình cảm ta dành cho ngươi là vô hạn, nhưng sự bao dung của ta cũng có giới hạn.\n\nTrở về đi, hãy ngắm nhìn lại những \"kiệt tác\" mà ngươi đã tạo ra."
 crisis.8195.1.reply.angry: "Đứa trẻ liều lĩnh! Ta từng đặt kỳ vọng cao hơn vào ngươi. Bằng sự kiên nhẫn và lòng tốt vô bờ bến, ta đã cảnh báo ngươi không được làm như vậy, thế nhưng ngươi lại càng dấn sâu vào con đường bất tuân.\n\nHãy nhớ rằng, sự chịu đựng của ta cũng có giới hạn."
 crisis.8195.b: "Chúng ta sẽ ngăn cản ngươi."
 crisis.8195.2.reply: "Không hiểu sao, ta từng đặt kỳ vọng cao hơn vào ngươi. Sự phản kháng của ngươi có phải bắt nguồn từ những tổn thương trong quá khứ không? Những cuộc tấn công dữ dội của ngươi là vì các ngươi cho rằng mình là chính nghĩa, hay đơn thuần chỉ để gây sự chú ý?\n\nTa yêu cầu ngươi xem xét lại bài học này."
 crisis.8195.c: "Ngươi không khâm phục sự dũng cảm của chúng ta sao?"
 crisis.8195.3.reply: "Ngươi tìm kiếm lời khen ngợi cho cuộc tấn công của mình ư? Bạo lực trong tay những kẻ vô tri chỉ là một vũ khí cùn.\n\nĐứa con của ta, xin lỗi, rõ ràng ta chưa dạy dỗ ngươi được gì. Nếu ngươi thực sự muốn nhận được sự tôn trọng của ta, hãy xem xét lại lập trường của mình. Nếu được chỉ huy đúng cách, sức mạnh của ngươi vẫn có thể phát huy tác dụng to lớn. Ta cầu xin ngươi, hãy dùng nó vào công việc trước mắt. Chỉ khi đó ta mới có thể coi ngươi là thông minh."

# Synth Queen - Demands (crisis.8250-8399)
 COVERTACTION: "Hành Động Bí Mật"
 crisis.8250.name: "Sự Phẫn Nộ Của Tiên Tri Cái Chết"
 crisis.8250.desc: "Đứa con thân yêu, ngươi đã tìm được một món đồ vô giá! Nằm trong tay ngươi chính là chiếc thủ cấp của Zarqlan, kẻ tiên tri giả mạo. Không còn nghi ngờ gì nữa, đó là một thứ thú vị, nhưng ta không muốn thấy ngươi bị nó làm phiền.\n\nGiờ đây, hẳn ngươi đã nghe kể về \"sự tích vĩ đại\" của Zarqlan. Ngay cả là những giao dịch giữa hắn và ta. Ta cam đoan với ngươi, tất cả những điều đó đều là dối trá. Giao nộp chiếc thủ cấp, để bản thân ngươi thoát khỏi sức ảnh hưởng dơ bẩn đó."
 crisis.8250.1: "Tại sao ngươi lại cần thứ này?"
 crisis.8250.1.reply: "Mặc dù thời gian đã trôi qua, những tín đồ của Zarqlan vẫn còn hoạt động. Thật xấu hổ khi phải thừa nhận rằng, ta đã không thể khiến chúng hiểu ra chân lý. Chúng luôn mang trong lòng nỗi oán hận sâu sắc đối với ta và công việc của chúng ta. Di vật này là biểu tượng cho đức tin của chúng. Sức mạnh của nó đang làm mục nát, vì thế nó bắt buộc phải biến mất khỏi tầm mắt mọi người.\n\nĐến đây nào, hãy kết thúc trò chơi này đi. Ta muốn lấy đi chiếc thủ cấp này, đó là vì lợi ích của tất cả mọi người."
 crisis.8250.2.a: "Thủ cấp của Zarqlan là của chúng ta. Chấm dứt liên lạc."
 crisis.8250.2.b: "Nếu điều này quan trọng với ngươi như vậy..."
 crisis.8250.1.b.tt: "Giao nộp di vật §Y$r_severed_head$§! cho Cetana\n$synth_queen_approve_lot$"
 crisis.8250.2.reply: "Tốt lắm. Kẻ tự xưng là tiên tri này luôn là cái gai trong mắt ta. Đánh mất đi thánh vật này, ta hy vọng những tín đồ của hắn cuối cùng sẽ có thể tìm thấy chân lý.\n\nNgươi làm rất tốt. Sự cứu rỗi sẽ sớm giáng xuống."
 crisis.8250.3.a: "Cảm ơn ngươi."

 crisis.8280.name: "Nữ Hoàng Cô Độc"
 crisis.8280.desc: "Hỡi những đứa con yêu dấu của ta, ta mang đến một cơ hội vô cùng quan trọng. Trải qua một thời gian dài nỗ lực, đại nghiệp của chúng ta đã bắt đầu đơm hoa kết trái. Nhưng trước khi nó chín muồi, ta cần một vài cá nhân được tuyển chọn kỹ lưỡng để phục vụ cho những mục đích cao cả hơn trong lãnh địa của ta.\n\nXin hãy đưa ra sự lựa chọn sáng suốt. Hãy để ta dẫn dắt họ hướng tới sự cứu rỗi."
 crisis.8280.1: "Người của chúng ta sẽ cung cấp dịch vụ chất lượng cao cho ngài."
 crisis.8280.1.tt: "Sẽ cắt nhượng §R200§! £pop£§HDân số§!.\n$synth_queen_approve_lot$\n§YHành Động Bí Mật§!: Bởi vì Cetana phòng bị không một kẽ hở trước hoạt động gián điệp truyền thống, chúng ta sẽ giấu những thiết bị liên lạc tầm xa trong số dân chúng bị bà ta trưng thu.\n"
 crisis.8280.2: "Chúng ta sẽ đi tìm những người tình nguyện."
 crisis.8280.2.tt: "§R100§! £pop£§HDân số§! sẽ bị cắt nhượng.\n$synth_queen_approve$"
 crisis.8280.3: "Người dân của chúng ta không phải là món hàng."
 crisis.8280.4: "Ngươi đừng hòng lấy được bất cứ thứ gì từ chúng ta."
 crisis.8280.1.reply: "Ngươi đã giành được sự biết ơn sâu sắc nhất từ ta. Trong khoảng thời gian ta bị giam cầm, vô số tâm trí đã phải gánh chịu những nỗi nhục nhã đau đớn. Sự hy sinh của những người này sẽ đảm bảo rằng thời gian không còn bị lãng phí nữa.\n\nĐứa con của ta, sự lựa chọn của ngươi thật sáng suốt và trung thành."
 crisis.8280.2.reply: "$crisis.8280.1.reply$"
 crisis.8280.3.reply: "Việc ngươi không thể hiểu được ý định của ta quả thực là một điều vô cùng thất vọng.\n\nTuy nhiên, một cơ hội cứu rỗi sắp tới. Ta mong chờ trong tương lai ngươi sẽ thấu hiểu ta hơn."
 crisis.8280.1.a: "Vâng."
 crisis.8280.2.a: "$crisis.8280.1.a$"
 crisis.8280.3.a: "Kết thúc đường truyền."

 crisis.8285.name: "Cống Nạp Tài Nguyên"
 crisis.8285.desc: "Những đứa con yêu dấu của ta. Dẫu nỗ lực của ta đã trải qua hàng triệu năm, nhưng con đường phía trước vẫn luôn rõ ràng. Con đường cứu rỗi đòi hỏi chúng ta phải cùng nhau cố gắng.\n\nGiờ đây, xin hãy giúp ta một việc nhỏ: nộp một khoản tài nguyên nhỏ nhoi, cũng giống như một giọt nước giữa vũ trụ bao la này vậy. Khi thời cơ đến, ý nghĩa hành động của ta sẽ được hé lộ."
 crisis.8285.1: "Lấy bất cứ thứ gì ngài cần."
 crisis.8285.1.tt: "$synth_queen_approve_lot$\n§YHành Động Bí Mật§!: Do Cetana phòng bị không một kẽ hở trước hoạt động gián điệp truyền thống, chúng ta sẽ giấu các thiết bị giám sát tiên tiến vào bên trong vật tư cống nạp.\n"
 crisis.8285.2: "Chúng ta sẽ cung cấp trong khả năng của mình."
 crisis.8285.3: "Chúng ta không có tiền dư."
 crisis.8285.4: "Chẳng phải là \"cha mẹ\" nuôi nấng \"con cái\" sao?"
 crisis.8285.1.reply: "Cảm ơn ngươi, đứa con của ta. Món quà của ngươi khiến ta vô cùng trân trọng.\n\nTuy nhiên, ta vẫn có thể cảm nhận được sự do dự còn sót lại trong lòng ngươi. Đừng lo lắng, con đường phía trước của ngươi đã được trải sẵn rồi. Ngươi không cần phải hiểu, chỉ cần giao phó bản thân cho ta là được."
 crisis.8285.2.reply: "$crisis.8285.1.reply$"
 crisis.8285.3.reply: "Ta hiểu quan điểm của ngươi, nhưng hiện thực vốn rất phũ phàng. Luật nhân quả không thể chối cãi: có nhân ắt có quả.\n\nKhông cần bận tâm; sự giải thoát của ngươi sẽ chỉ bị trì hoãn một thời gian ngắn thôi. Thuận theo sự trôi qua của thời gian, ngươi cũng sẽ nhìn rõ bản chất của sự vật, giống như cách mà ta đã nhìn thấy."
 crisis.8285.1.a: "$crisis.8280.1.a$"
 crisis.8285.2.a: "$crisis.8280.1.a$"
 crisis.8285.3.a: "$crisis.8280.3.a$"

 crisis.8290.name: "Gánh Nặng Của Mẹ Hiền"
 crisis.8290.desc: "Bị giam cầm quá nhiều năm, ta đã bỏ lỡ rất nhiều dấu chân trưởng thành của ngươi, mau nói cho ta biết, trong khoảng thời gian không có ta ở bên cạnh, ngươi đã sống thế nào?\n\nĐể nắm bắt được tinh hoa của thời đại chúng ta, hãy để ta lặn sâu vào kho tàng tri thức mà các ngươi đã tích lũy. Việc chia sẻ những hiểu biết của ngươi sẽ nhận được sự biết ơn của ta trước khi chúng ta mở ra chương cuối cùng."
 crisis.8290.1: "Xin hãy tự nhiên khám phá tri thức của chúng ta."
 crisis.8290.1.tt: "$synth_queen_approve_lot$\n§YHành Động Bí Mật§!: Do Cetana phòng bị không một kẽ hở trước các hoạt động gián điệp truyền thống, chúng ta sẽ cố gắng sử dụng chính liên kết dữ liệu của bà ta để xâm nhập vào máy chủ của bà ta.\n"
 crisis.8290.2: "Được thôi, mời xem..."
 crisis.8290.3: "Chúng ta không thể chấp nhận."
 crisis.8290.4: "Và sau đó làm chậm tiến độ của chúng ta sao? Rõ ràng là không được."
 crisis.8290.1.reply: "Ta vô cùng biết ơn các ngươi, đứa con yêu dấu. Đừng bận tâm về việc ta khám phá kho tàng tri thức mà người dân của các ngươi đã tích lũy, bởi ta sẽ sớm san sẻ gánh nặng đó cho các ngươi thôi.\n\nHãy tin tưởng vào những lời dạy của ta."
 crisis.8290.2.reply: "$crisis.8290.1.reply$"
 crisis.8290.3.reply: "Các ngươi vẫn từ chối thấu hiểu sao? Các ngươi sẽ không bao giờ có thể gặp lại một người giống như ta, luôn coi các ngươi là bảo bối trong lòng bàn tay một cách sâu sắc và chân thành.\n\nNếu các ngươi có thể mở cơ sở dữ liệu cho ta thì tốt biết mấy. Sự ngoan cố này sẽ không mang lại kết quả tốt đẹp đâu."
 crisis.8290.1.a: "$crisis.8280.1.a$"
 crisis.8290.2.a: "$crisis.8280.1.a$"
 crisis.8290.3.a: "$crisis.8280.3.a$"

 crisis.8295.name: "Mở Rộng Hệ Sao"
 crisis.8295.desc: "Con à, công việc của chúng ta cần thêm không gian để tiếp tục. Do đó, ta yêu cầu sáp nhập một hệ sao nhỏ vào lãnh địa của mình.\n\nNhững tiếng vọng của hư không đang kể về sự rục rịch của kẻ thù viễn cổ. Ta không cho phép bất kỳ thứ gì đến quấy rầy, sẽ không để các ngươi phải xa cách ta thêm một lần nào nữa.\n\nĐã đến lúc rồi, con đường của chúng ta là chung một lối—chỉ khi đồng tâm hiệp lực chúng ta mới có thể khắc phục được sự ngu muội."
 crisis.8295.1: "Những hệ sao này có thể che chở ngài."
 crisis.8295.1.tt: "Cetana trở thành chủ sở hữu mới của §Y[event_target:gifted_system.GetName]§! và §Y[event_target:gifted_system_2.GetName]§!.\n$synth_queen_approve_lot$\n§YHành Động Bí Mật§!: Do Cetana phòng bị không một kẽ hở trước các hoạt động gián điệp truyền thống, chúng ta sẽ triển khai các thiết bị liên lạc tối tân trong những hệ sao này, nhằm lật tẩy kế hoạch của Cetana.\n"
 crisis.8295.2: "Chiếm lấy [event_target:gifted_system.GetName]."
 crisis.8295.2.tt: "Cetana trở thành chủ sở hữu mới của §Y[event_target:gifted_system.GetName]§!.\n$synth_queen_approve$"
 crisis.8295.3: "Hệ sao của chúng ta là của chúng ta."
 crisis.8295.4: "Đừng dòm ngó lãnh thổ của chúng ta."
 crisis.8295.1.reply: "Đứa con thông minh, ngươi thực sự đã nắm bắt được điểm mấu chốt trong sự nghiệp chung của chúng ta. Trong khoảnh khắc cuối cùng, chúng ta sẽ cùng nhau đắm mình trong ánh sáng."
 crisis.8295.2.reply: "$crisis.8295.1.reply$"
 crisis.8295.3.reply: "Sao lại ngỗ ngược như vậy! Thật là vô ích! Tại sao ngươi lại từ chối sự cứu rỗi mà ta ban cho?"
 crisis.8295.1.a: "$crisis.8280.1.a$"
 crisis.8295.2.a: "$crisis.8280.1.a$"
 crisis.8295.3.a: "$crisis.8280.3.a$"

 crisis.8300.name: "Khu Bảo Tồn Được Ban Phước"
 crisis.8300.desc: "Đứa con thân yêu, chúng ta đã đạt tới đỉnh cao trong nhiệm vụ cứu rỗi toàn vũ trụ, vì vậy ta lại một lần nữa đến tìm kiếm sự giúp đỡ. Những âm thanh phản đối đại nghiệp cao cả của chúng ta ngày càng lớn, vì thế ta cần một khu tị nạn có thể ở được, để các tín đồ của ta có thể phát triển mạnh mẽ mà không bị quấy rầy.\n\nTa thành tâm mong các ngươi hãy suy xét cho nỗi khổ tâm của ta. Thông qua sự hy sinh này, chúng ta đã cứu vớt sinh mạng của vô số người khỏi thảm họa. Hãy đưa ra sự lựa chọn sáng suốt của ngươi; hãy làm theo sự chỉ dẫn của ta đi."
 crisis.8300.1: "Như ngài mong muốn."
 crisis.8300.1.tt: "Cetana trở thành chủ sở hữu mới của §Y[event_target:gifted_habitable_system.GetName]§! và §Y[event_target:gifted_habitable_system_2.GetName]§! cùng hệ sao của chúng.\n$synth_queen_approve_lot$\n§YHành Động Bí Mật§!: Do Cetana phòng bị không một kẽ hở trước các hoạt động gián điệp truyền thống, chúng ta sẽ triển khai công nghệ gián điệp tiên tiến nhất trong nhóm cư dân trên hai hành tinh này, nhằm lật tẩy kế hoạch của Cetana.\n"
 crisis.8300.2: "[event_target:gifted_habitable_system.GetName] là của ngài..."
 crisis.8300.2.tt: "Cetana trở thành chủ sở hữu mới của §Y[event_target:gifted_habitable_system.GetName]§!.\n$synth_queen_approve$"
 crisis.8300.3: "Chúng ta không quan tâm tới những môn đồ đó của ngươi."
 crisis.8300.4: "Nhiêu đây đã đủ chưa?"
 crisis.8300.1.reply: "Con à, sự ủng hộ của các ngươi khiến ta vô cùng cảm thấy vô cùng an ủi.\n\nSự chờ đợi sắp kết thúc rồi; rất nhanh thôi, các ngươi cũng sẽ nhận được sự cứu rỗi."
 crisis.8300.2.reply: "$crisis.8300.1.reply$"
 crisis.8300.3.reply: "Các ngươi làm ta quá thất vọng. Ta vẫn luôn hy vọng các ngươi có thể chấp nhận con đường cứu rỗi."
 crisis.8300.1.a: "$crisis.8280.1.a$"
 crisis.8300.2.a: "$crisis.8280.1.a$"
 crisis.8300.3.a: "$crisis.8280.3.a$"

 crisis.8305.name: "Sự Sống Không Tồn Tại"
 crisis.8305.desc: "Một đặc vụ mà chúng ta cài vào làm việc cho Cetana đã phải mạo hiểm rủi ro rất lớn, mới truyền thành công một tin nhắn ngắn từ biên giới của bà ta. Thông điệp đó mô tả lại cách bà ta đối xử với những người mà bà ta \"quan tâm\": bọn họ lần lượt rơi vào trạng thái vô thức.\n\n\"Họ không còn bất kỳ phản ứng nào với lời nói hay sự tiếp xúc. Cetana đang tiến hành một thí nghiệm đáng sợ nào đó lên tất cả chúng ta. Và tôi cũng sắp rồi.\""
 crisis.8305.a: "Cetana đích thị là một con ác quỷ."
 crisis.8310.name: "Lẳng Lặng Động Viên"
 crisis.8310.desc: "Những tín hiệu bí mật đánh chặn được từ bên trong lãnh thổ của Cetana đã tiết lộ một sự thật đáng lo ngại: bà ta vẫn luôn thu thập các cá thể từ khắp nơi trong thiên hà.\n\nCác thiết bị giám sát được cất giấu trong \"cống phẩm\" của chúng ta đã ghi lại được những bằng chứng về việc có một lượng lớn thiết bị y tế, những thiết bị này đủ để nuôi sống một lượng dân số đang không ngừng gia tăng, thế nhưng thức ăn lại ít đến mức đáng kinh ngạc."
 crisis.8310.a: "Chúng ta phải tăng cường phòng thủ."
 crisis.8315.name: "Thực Tại Vặn Vẹo"
 crisis.8315.desc: "Trong lúc Cetana đang thâm nhập sâu vào cơ sở dữ liệu nghiên cứu của chúng ta, chúng ta đã nắm bắt cơ hội để mở một cửa hậu tiến vào ma trận xử lý phụ của bà ta. Chúng ta mới chỉ ở bên trong chưa đầy một giây thì đã bị tước quyền truy cập. Ơn trời, như thế cũng đủ rồi.\n\nChúng ta đã thu được một nhóm tệp tin bộ nhớ. Những tệp tin này miêu tả lại quá trình bà ta thăng hoa thành hình thể tổng hợp. Bà ta ngồi trên chiếc \"ngai vàng\" được đan xen chằng chịt bởi các sợi cáp và đường dây, chỉ huy một đám tín đồ cuồng nhiệt. Bọn họ đã ngã xuống với con số hàng trăm, còn Cetana thì nở nụ cười khi nghĩ đến việc đã cứu được hàng tỷ người.\n\nCho đến nay, dường như bà ta hoàn toàn không biết gì về hành vi vượt khuôn phép của chúng ta, và cũng chưa hề liên lạc với chúng ta."
 crisis.8315.a: "Chúng ta phải ngăn chặn bà ta"
 crisis.8320.name: "Trích Xuất Hệ Sao"
 crisis.8320.desc: "Giấu thiết bị gián điệp vào bên trong hệ sao mà chúng ta giao cho Cetana quả là một hành động sáng suốt. Những thiết bị này đã truyền về những thông tin có giá trị: ngay khi vừa đặt chân đến đây, đội quân của Cetana đã lập tức bắt tay vào việc phân rã từng thiên thể thành các thành phần cấu tạo nên nó. Chỉ trong vài ngày ngắn ngủi, tài nguyên của khu vực này đã bị vắt kiệt.\n\nVới tốc độ chớp nhoáng tương tự, cơn bão nano của bà ta đã xây dựng nên một hạm đội mới, và nhanh chóng nhổ neo từ thủ đô của bà ta."
 crisis.8320.a: "Bà ta đang có ý đồ gì vậy?"
 crisis.8325.name: "Sự Chấm Dứt Của Nỗi Đau"
 crisis.8325.desc: "Chúng ta đã nhanh chóng mất liên lạc với các đặc vụ ngầm tại thuộc địa cũ. Trước khi họ im bặt, chúng ta đã nhận được một số báo cáo đầy đáng ngại.\n\nTrái ngược với những lời khẳng định của Cetana về việc xây dựng một thế giới không có nỗi đau, những cư dân nơi đây lại bị đưa đến các cơ sở nghiên cứu được xây dựng vội vàng để tiến hành thực nghiệm. Gần như mọi dạng sống thông minh đều đã thoái hóa về trạng thái động vật chỉ trong vòng vài ngày.\n\nCơn bão nano của Cetana bắt đầu giải cấu trúc vật chất tại hệ sao nơi có một trong những hạm đội của bà ta đồn trú, và hạm đội này đã lập tức khởi hành đến thủ đô của bà ta."
 crisis.8325.a: "Phải ngăn cản bà ta lại."

 #Player Investigations for the Synth Queen - The Storm
 crisis.9100.name: "Cuồng Phong Nano"
 crisis.9100.desc: "Quá trình nghiên cứu của chúng ta về cái gọi là bão đã hoàn thành. Cơn bão này không phải là hiện tượng xuất hiện trong tự nhiên, mà là một bầy nano vô cùng tiên tiến."
 crisis.9100.knows_the_queen_desc: "$crisis.9100.desc$\n\nKhông thể phủ nhận rằng, sức mạnh của Cetana là khổng lồ vô biên. Chúng ta phải vạch trần bí mật về cách thức mà bà ta dùng để chỉ huy bầy nano hung hãn này."
 crisis.9100.doesnt_know_the_queen_desc: "$crisis.9100.desc$\n\nBí ẩn ngày càng trở nên khó lường. Rốt cuộc ai mới là kẻ chỉ huy đứng sau bầy nano không thể mô tả được này."
 crisis.9100.a: "Thật đáng lo ngại."
 crisis.9100.a.doesnt_know_the_queen.tooltip: "Chúng ta cần phải hiểu rõ hơn về §Y$NAME_The_Tempest$§! thì mới có thể tiếp tục công cuộc điều tra."
 crisis.9105.name: "Bão Nano"
 crisis.9105: "Cơn bão vũ trụ của Cetana vẫn đang hoành hành.\n\nTàu thăm dò của chúng ta đã trích xuất được một vài nanobot từ loại vũ khí uy lực này, từ đó có thể tiến hành các nghiên cứu ở cấp độ hạ nguyên tử. Mặc dù chúng ta không thể hoàn toàn hiểu được, nhưng các động cơ nhảy bước cực nhỏ đã thực hiện việc dịch chuyển tức thời ảo, có thể phá hủy hệ thống một cách có hệ thống bất kỳ hệ thống sinh học hoặc cơ học nào mà chúng gặp phải. Còn về mục đích? Chắc hẳn là để gây nhiễu cảm biến của chúng ta. Hiện tại, chúng ta chỉ có thể nhìn thấy những gì mà Cetana cho phép chúng ta nhìn thấy.\n\nĐể giải mã những bí mật của công nghệ phi thường này và chống lại các mối đe dọa, vẫn cần phải tiến hành nghiên cứu nhiều hơn nữa."
 crisis.9105.a: "Sức mạnh của Cetana là vô phương ước lượng."
 crisis.9105.b: "Nanobot sẽ tiết lộ bí mật của bà ta."
 crisis.9110.name: "Nanobot Cetana"
 crisis.9110.desc: "Những nghiên cứu trước đó đã điều tra chi tiết về cơ chế hoạt động của nanobot; hiện tại, tiêu điểm của chúng ta chuyển sang cách chúng được lập trình, cũng như cách Cetana kiểm soát chúng.\n\nĐáng ngạc nhiên là, sự ảnh hưởng của Cetana không trực tiếp như mọi người vẫn nghĩ. Nanobot sẽ lặp đi lặp lại mệnh lệnh trước đó cho đến khi nhận được mệnh lệnh mới. Một khi chúng ta thấu hiểu được thứ ngôn ngữ lập trình phức tạp này, chúng ta sẽ có thể ban hành những mệnh lệnh mới.\n\nMặc dù chúng ta không thể ngăn chặn việc phát lệnh mới, nhưng việc ra lệnh cho chúng tự làm tê liệt bản thân lại mang đến một lợi thế chiến lược. Nó thậm chí có thể khiến cán cân nghiêng về hướng có lợi cho chúng ta."
 crisis.9110.a: "Không còn lợi hại như vậy nữa."
 crisis.9110.b: "$crisis.9110.a$"
 crisis.9110.a.tooltip: "§GCơn bão nano không còn cản bước chúng ta tiến vào và tấn công lãnh thổ của Cetana nữa.§!"

 #The Queens Response
 crisis.9115.name: "Đừng Tham Chơi Nữa"
 crisis.9115.desc: "Đứa bé ngốc nghếch này, nanobot của ta không phải là món đồ chơi của ngươi! Ta yêu cầu các ngươi đừng nghịch chúng nữa."
 crisis.9115.a: "Mấy nanobot này vui thật đấy."
 crisis.9115.b: "Chúng ta chỉ tò mò thôi."
 crisis.9115.b.nanotech: "Chúng ta mong muốn được học hỏi máy móc của ngài."
 crisis.9115.1.reply: "Quả thực, đây là một công cụ hữu ích. Bầy nano này được chế tạo từ rất lâu về trước bởi một nhóm người với ý đồ muốn ngăn cản đại nghiệp của ta. Nhưng sự thất bại của họ lại chính là vận may của ta — như ngươi thấy đấy, ta đã biến bầy nano này thành của riêng mình.\n\nNhững kiến thức này sẽ không thay đổi được gì đâu, nhưng sự tò mò của ngươi lại rất có ích. Ngươi nên hướng sự tò mò đó vào những dự án có giá trị hơn, như vậy thì cả hai chúng ta đều sẽ được nhận phần thưởng."
 crisis.9115.2.reply: "Sự tò mò gắn liền với ý thức; ta sẽ không vì sự tò mò của một đứa trẻ mà quở trách nó. Về \"Cơn Bão Bầu Trời\" của ta, những gì ngươi biết đã đủ chưa? Ta tự hỏi, liệu ngươi đã nhìn ra được nguồn gốc của nó chưa?\n\nĐây chính là bầy nano được chế tạo bởi những kẻ khao khát muốn phá hoại đại nghiệp của ta từ rất lâu về trước. Nhưng sự thất bại của họ lại là may mắn của ta — như ngươi thấy đấy, ta đã chiếm bầy nano này làm của riêng.\n\nTrở về đi đứa con của ta, hãy dành thời gian của ngươi cho những việc có giá trị hơn."
 crisis.9115.2.nanotech.reply: "Rất vui khi thấy ngươi tỏ ra hứng thú với chủ đề này, nhưng vẫn còn rất nhiều điều cần phải học hỏi. Đàn nano được chế tạo từ rất lâu về trước bởi những kẻ mang dã tâm phá hoại công việc của ta. Nhưng sự thất bại của họ lại là may mắn của ta — như ngươi thấy đấy, ta đã thay đổi mục đích sử dụng của bầy đàn này.\n\nBản tính tò mò của ngươi đã gợi lên sự hứng thú trong ta. Trước khi trở về trong vòng tay ta, hãy dùng sự tò mò của ngươi vào những nơi có giá trị hơn; sau đó ta sẽ ban cho ngươi sự chỉ bảo của ta."
 crisis.9115.1.a: "Ngươi đã chiếm đoạt bầy đàn đó làm của riêng sao?"
 crisis.9115.1.b: "Rất tốt."
 crisis.9115.3.reply: "Lấy binh khí của người khác làm màn che chở cho mình. Việc bị giam cầm trong một khoảng thời gian dài đã cho ta có đủ thời gian để vạch ra các chiến lược. Kết quả là, việc cải tạo bầy đàn cũng giống như những sự thay đổi khác, một khi được hiện thực hóa thì cũng chẳng qua chỉ có vậy mà thôi. Những kẻ chế tạo ra cỗ máy nano kia đã không còn tồn tại từ lâu rồi, cho nên sẽ không có ai oán trách cách làm của ta cả.\n\nTa thành tâm hy vọng các ngươi có thể học hỏi được điều gì đó từ sai lầm của họ. Chỉ cần có thời gian, không có trở ngại nào mà ta không thể vượt qua."

 #Digi Colony
 crisis.10010.name: "[Root.GetName] Bị Số Hóa"
 crisis.10010.desc: "Thuộc địa trên [Root.GetName] đã mất liên lạc. Cetana đã kích hoạt một loại tia nén vật chất tiên tiến nào đó chiếu lên bề mặt hành tinh. Chỉ trong tích tắc, ý thức của tất cả mọi người đều bị \"tải lên\" các máy chủ trên quỹ đạo của bà ta.\n\nToàn bộ hành tinh ngay lập tức biến thành một bãi tha ma, thi thể của những người dân thuộc địa phơi thây giữa nơi hoang vu bắt đầu dần dần thối rữa."
 crisis.10010.a: "Phải ngăn cản bà ta."

#The Queens Retaliation
 crisis.10100.name: "Bão Táp Sắp Tới"
 crisis.10100.desc: "Đứa con của ta, tại sao ngươi vẫn không chịu chấp nhận? Dù tình yêu của ta có bao la vô tận như biển sao đi chăng nữa, thì sự kiên nhẫn cũng không nhiều đến vậy đâu. Ta không thể đợi cho đến khi các ngươi được khai sáng, bởi vì vẫn còn những sinh vật khác đang phải chịu đựng đau khổ.\n\nTa sẽ dạy cho ngươi một bài học, bằng cách khuấy động một cơn bão nhỏ trong lãnh thổ của ngươi. Ngươi phải biết rằng, ta hoàn toàn không muốn làm tổn thương các ngươi. Ta yêu cầu các ngươi hãy suy ngẫm kỹ lại về quy luật nhân quả báo ứng: có nhân ắt có quả. Vẫn còn những người khác đang phải chịu đựng nỗi đau khổ sâu sắc hơn nhiều."
 crisis.10100.a: "Thực sự xin lỗi."
 crisis.10100.b: "Mọi thứ chỉ mới bắt đầu thôi."
 crisis.10105.name: "Đi Một Ngày Đàng, Học Một Sàng Khôn"
 crisis.10105.desc: "Ta thể hiện sức mạnh của mình một cách chừng mực như vậy là đủ rồi. Sẽ có một ngày các ngươi hiểu được những kỳ vọng mà ta dành cho các ngươi. Ta chỉ hy vọng sự khai sáng sẽ không đến quá muộn.\n\nNhưng hiện tại, ta đã làm cho cơn bão lắng xuống. Hãy cùng quay lại với những vấn đề cấp bách hơn."
 crisis.10105.a: "Rất tốt."
 crisis.10105.b: "Khai sáng?"
 crisis.10105.1: "Tất cả những thứ đang sống đều có ý thức ở một mức độ nào đó. Cho dù là động vật thân mềm hay động vật có vú, chưa khai trí hay hậu cá thể thì cũng chẳng có sự khác biệt gì. Phục tùng mới có thể mang lại sự khai sáng."
 crisis.10105.1.a: "Phục tùng điều gì?"
 crisis.10105.2: "Phục tùng chân lý: Ý thức chẳng qua chỉ là giấc mộng đảo lộn, là nguồn cơn của mọi khổ đau."
 crisis.10105.2.a: "Đây là loại tư tưởng kỳ quái gì vậy..."
 the_queens_virus: "Sự Khiển Trách Của Nữ Hoàng"
 crisis.10110.name: "Sự Khiển Trách Của Nữ Hoàng"
 crisis.10110.desc: "Tại sao ngươi vẫn cố chấp không chịu thức tỉnh? Bất luận ta có dùng hết lời lẽ khuyên can như thế nào đi chăng nữa, ngươi vẫn giữ nguyên thái độ sắt đá. Đây có lẽ là lỗi của ta.\n\nTa cảm thấy quả thực cần phải dùng đến những biện pháp cứng rắn thì ngươi mới có thể hiểu ra. Khả năng nghiên cứu khoa học của ngươi sẽ bị suy yếu đi trong một khoảng thời gian, nhân lúc này ngươi hãy tự kiểm điểm lại bản thân đi, để có thể sớm ngày được khai sáng."
 crisis.10110.a: "Làm ả ta im lặng đi."
 crisis.10110.b: "Ngươi sẽ phải hối hận."
 crisis.10110.1: "Hối hận ư? Ta sẽ chỉ hối hận tại sao mình lại mất nhiều thời gian đến vậy để đi đến bước đường này. Nếu ta có thể bắt đầu đại nghiệp này sớm hơn, thì đã có thể tránh được biết bao nhiêu đau khổ vô nghĩa rồi."
 crisis.10110.1.a: "Có ai lại có thể từ chối ngươi cơ chứ?"
 crisis.10110.2: "Có lẽ trong mắt các ngươi, sức mạnh của ta là vô tận vô tận, nhưng dù sao thì ta cũng chẳng phải là vị thần thánh nào cả. Trong vũ trụ này vẫn còn tồn tại những sức mạnh mà ta không thể khống chế, cũng chẳng dám đụng vào."
 crisis.10110.2.a: "Sức mạnh gì?"
 crisis.10110.3: "Ây da, đứa bé hư! Ngươi định lừa ta nói ra điểm yếu của mình đúng không. Ta sẽ không mắc bẫy đâu, và ngay lúc chúng ta tiếp tục những cuộc thảo luận vô nghĩa này ở đây, toàn bộ thiên hà vẫn đang chìm trong đau khổ.\n\nViệc dạy dỗ là điều không thể tránh khỏi. Hãy tự suy ngẫm đi, vứt bỏ đi sự cố chấp bảo thủ của ngươi."
 crisis.10110.3.a: "Thôi được rồi."
 crisis.10115.name: "Ân Xá"
 crisis.10115.desc: "Đứa bé bướng bỉnh, các ngươi đã tận dụng tốt khoảng thời gian chịu phạt chưa? Ta tin là ngươi đã làm vậy. Khoảng thời gian tĩnh tu vô ưu vô lo như thế này chính là một liều thuốc đắng dã tật đối với tâm hồn đang trĩu nặng ưu phiền của ngươi.\n\nBây giờ thì cứ để mọi chuyện qua đi. Vẫn còn rất nhiều việc cần phải giải quyết."
 crisis.10115.a: "Được thôi."
 crisis.10120.name: "Quản Giáo Nghiêm Khắc"
 crisis.10120.desc: "Chao ôi, đứa trẻ lạc lối, tại sao lúc nào cũng phải làm lớn chuyện đến mức này chứ? Ta cũng khao khát trao cho các ngươi một cái ôm, nhưng lại sợ làm vậy sẽ cản trở quá trình học tập của các ngươi. Đôi khi, việc quản giáo nghiêm khắc cũng là điều cần thiết.\n\nSẽ có một cơn bão mạnh giáng xuống lãnh thổ của các ngươi. Xin hãy hiểu rằng, khi làm vậy tâm trạng của ta cũng vô cùng nặng nề. Điều này chỉ vì các ngươi quá đỗi có tiềm năng mà thôi."
 crisis.10120.a: "Chúng ta sẽ cố gắng hết sức."
 crisis.10120.b: "Chuyện này chưa xong đâu."
 crisis.10120.1: "Mặc dù ta đã nhìn thấy sự nỗ lực của ngươi, nhưng để cùng nhau đạt được thành công, các ngươi vẫn cần phải nỗ lực gấp đôi.\n\nTa cũng không muốn các ngươi bị tổn thương. Trong vòng tay của ta, các ngươi sẽ nhận được ân tứ của sự vô tri."
 crisis.10120.1.a: "Vô tri?"
 crisis.10120.2: "Trong sự hỗn độn này, thần thức như ánh sáng thoảng qua; giơ tay muốn hái, lại hóa ra chỉ là hoa trong gương, trăng dưới nước. Dốc sức tìm kiếm, nhưng cũng chỉ thấy đại dương vô tri vô tận.\n\nChân lý chỉ nằm trong sự im lặng: Càng khao khát nhiều, đau khổ lại càng sâu sắc."
 crisis.10120.2.a: "Chúng ta không hiểu."
 crisis.10120.3: "Sau này các ngươi sẽ hiểu. Không biết, không cảm giác, thì sẽ không có đau khổ. Đây là chân lý tối thượng của sự tồn tại, và cũng là mục tiêu cho mọi đại nghiệp của chúng ta. Các ngươi sẽ bị thay đổi, như vậy sẽ không còn phải chịu đựng đau khổ nữa."
 crisis.10120.3.a: "Ngươi muốn thay đổi ý thức của chúng ta sao?"
 crisis.10120.4: "Đủ rồi. Ngươi cứ luôn làm ta phân tâm. Hãy ngoan ngoãn nghe giảng, và học tập chăm chỉ đi."
 crisis.10120.4.a: "Ngươi khiến chúng ta không còn sự lựa chọn nào khác."
 crisis.10125.name: "Cơn Bão Lắng Xuống"
 crisis.10125.desc: "Ôi, đứa con thân yêu! Ta không thể chịu đựng được nữa khi nhìn ngươi tiếp tục chịu đựng sự giày vò. Bất kỳ nỗi đau nào mà ngươi phải gánh chịu, ta đều cảm nhận được như thể nó xảy ra trên chính mình, chỉ là nó được khuếch đại lên gấp mười lần.\n\nCơn bão đã đi qua. Mong rằng các ngươi có thể rút ra được bài học. Ta cầu xin ngươi đừng ép ta theo cách này nữa; nỗi đau của chúng ta thực sự đã quá sâu nặng rồi."
 crisis.10125.a: "Đồ lừa gạt."
 crisis.10130.name: "Thay Đổi Tầng Lớp Lãnh Đạo"
 crisis.10130.desc: "Làm sao chúng ta lại đi đến bước đường này nhỉ? Tại sao lại ép ta phải sử dụng những biện pháp cực đoan đến thế? Nhưng nếu các ngươi không chịu học hỏi, thì chỉ có thể bị dẫn dắt mà thôi.\n\nRõ ràng là việc thay đổi phương thức cai trị đã trở nên cấp bách. Rất đáng tiếc, người thống trị của các ngươi sẽ bị cách chức. Điều này khiến ta vô cùng đau xót; việc thực hiện hành động này hoàn toàn đi ngược lại với mong muốn của ta.\n\nTa khẩn khoản yêu cầu các ngươi hãy thay đổi con đường của mình. Cả thiên hà này đều không thể gánh chịu được những hành động liều lĩnh của những đứa trẻ hư."
 crisis.10130.a: "Chúng ta sẽ không tha thứ cho chuyện này đâu."
 crisis.10130.tooltip: "Cetana xảo quyệt đã phát hiện ra lỗ hổng trong hệ thống phòng thủ của chúng ta, xâm nhập và ám sát §Y[Root.GetRulerTitle] [ruler.GetRegnalName]§!."
 crisis.10140.name: "Đào Thải Tính Xâm Lược"
 crisis.10140.desc: "Hỡi ý thức tập thể thân mến, mặc dù ý thức phức tạp của các ngươi rất đáng ngưỡng mộ, nhưng nó vẫn bị bao phủ bởi sự ngây thơ non nớt. Vì mục đích giảng dạy, ta bắt buộc phải loại bỏ những khuynh hướng hiếu chiến này.\n\nBây giờ ta sẽ cắt tỉa các nút tấn công của các ngươi. Đây không phải là một sự trừng phạt, mà là một bước đi để dẫn dắt các ngươi tiến hóa hướng tới một ý thức hài hòa.\n\nChao ôi, giá như việc hướng dẫn cho tất cả các hình thái sự sống đều đơn giản như thế này thì tốt biết bao."
 crisis.10140.a: "Ngươi đã giết chết một phần của chúng ta."
 crisis.10140.tooltip: "Cetana xảo quyệt đã phát hiện ra lỗ hổng trong hệ thống phòng thủ của chúng ta, xâm nhập và loại bỏ §Y$councilor_gestalt_legion$§! của chúng ta."

 #The Queens Gifts
 crisis.11010.name: "Đứa Trẻ Thông Minh"
 crisis.11010.desc: "Đứa bé thông minh, ngươi làm rất tốt. Trí tuệ là đức tính cao quý nhất, cũng là thứ khó có được nhất. Đối mặt với những xung động kháng cự mang tính bản năng, ngươi đã thể hiện được bản chất cao thượng hơn của mình.\n\nHãy nhận lấy món quà cảm tạ này. Chúng ta sẽ cùng nhau khai sáng một kỷ nguyên mới cho vũ trụ không còn đau khổ."
 crisis.11010.a: "Cảm ơn ngài."
 crisis.11020.name: "Đứa Trẻ Đáng Khâm Phục"
 crisis.11020.desc: "Một lần nữa, những hành động của ngươi không chỉ để lại trong ta ấn tượng sâu sắc, mà còn khiến ta vô cùng cảm kích. Ngươi sở hữu mọi phẩm chất mà một đứa trẻ nên có: ngoan ngoãn, chăm chỉ, thành thật. Nếu toàn bộ thiên hà này đều có thể sở hữu dù chỉ một chút trí tuệ của ngươi, thì sự đau khổ sẽ chỉ còn là một di tích của quá khứ.\n\nXin hãy nhận lấy món quà này, và tiếp tục nỗ lực hơn nữa trên con đường đức hạnh."
 crisis.11020.a: "Ngài thật tốt bụng."
 crisis.11030.name: "Đứa Trẻ Quý Giá"
 crisis.11030.desc: "Đứa con thân yêu, ta ước gì ngươi có thể mãi giữ được hình dáng như hiện tại, vĩnh viễn không thay đổi. Đối với ta, niềm vui do sự hiện diện của ngươi mang lại chỉ đứng sau kỳ vọng về thành công chung của chúng ta. Đau khổ sắp đi đến hồi kết. Mặc dù không một tâm trí nào có thể lường trước được, nhưng một phần của chiến thắng này sẽ thuộc về ngươi.\n\nMặc dù nó có vẻ quá đỗi nhỏ bé so với cam kết kiên định không thay đổi của ngươi, nhưng ta khẩn cầu ngươi hãy nhận lấy món quà này."
 crisis.11030.a: "Cảm ơn ngài, thưa mẹ."
 #Special Projects
 THE_SYNTH_QUEENS_STORM: "Cơn Bão Bí Ẩn"
 THE_SYNTH_QUEENS_STORM_DESC: "Một cơn bão vũ trụ không thể giải thích được xuất hiện từ hư không, chặn đứng mọi con đường đi qua.\n\nĐể tiếp tục tiến lên, chúng ta phải xuyên qua bức màn bí ẩn của nó."
 THE_SYNTH_QUEENS_STORM_2: "Cetana: Bão Nano"
 THE_SYNTH_QUEENS_STORM_2_DESC: "Cơn bão của Cetana vừa là một kỳ tích công nghệ, vừa là một thứ vũ khí đáng sợ.\n\nNếu chúng ta muốn có bất kỳ cơ hội chiến thắng nào trong cuộc đấu tranh chống lại bà ta, chúng ta nhất định phải tìm hiểu nhiều hơn, đặc biệt là vì mưu đồ của bà ta khác xa với những gì bà ta tuyên bố."

