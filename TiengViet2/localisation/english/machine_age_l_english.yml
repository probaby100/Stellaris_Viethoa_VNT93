 leviathans.3102.c: "Tàu chiến có sự sợ hãi"
 tech_leviathan_techgenesis: "Kiến Tạo Công Nghệ Thú Vũ Trụ"
 tech_leviathan_techgenesis_desc: "Sử dụng những kiến thức rút ra từ Thú Vũ Trụ bị bắt giữ có thể mở khóa các nâng cấp hoàn toàn mới cho khung máy của chúng ta."
 TECH_UNLOCK_LEVIATHAN_MACHINE_TITLE: "§HMở khóa đặc điểm:§! Kiến Tạo Công Nghệ Thú Vũ Trụ"
 TECH_UNLOCK_LEVIATHAN_MACHINE_DESC: "Cho phép chúng ta thêm các đặc điểm của Thú Vũ Trụ vào giống loài người máy thông qua công nghệ chỉnh sửa giống loài."

 INTEGRATED_WEAPONRY_TT: "Sát thương lục quân: §G+100%§!\nHiệu suất việc làm [enforcer.GetIcon][enforcer.GetName]: §G+20%§!"
 INTEGRATED_WEAPONRY_CYBORG_TT: "$INTEGRATED_WEAPONRY_TT$\n$CYBORG_ENERGY_UPKEEP_EFFECT$"
 mod_planet_jobs_robot_worker_produces_mult: "Sản lượng tài nguyên của dân số [GetWorker] người máy"
 trait_robot_ancient_dreadnought: "Dreadnought Cổ Đại"
 trait_robot_ancient_dreadnought_desc: "Thông qua việc lắp đặt mô-đun năng lượng thu nhỏ, năng lực sản xuất công nghiệp và hỏa lực của vũ khí tích hợp trong khung máy được nâng cao đáng kể."
 trait_robot_enigmatic_fortress: "Pháo Đài Bí Ẩn"
 trait_robot_enigmatic_fortress_desc: "Quy trình tự sửa chữa bí ẩn có thể trực tiếp chiết xuất vật chất từ không gian con, giảm thiểu đáng kể lượng vật liệu tiêu hao trong quá trình bảo trì."
 trait_robot_infinity_sphere: "Quả Cầu Vô Cực"
 trait_robot_infinity_sphere_desc: "Mạch xử lý kháng trọng lực siêu hiệu quả giúp giảm thiểu tối đa tổn thất năng lượng, cắt giảm đáng kể chi phí xử lý."
 trait_robot_scavenger_bot: "Người Máy Nhặt Rác"
 trait_robot_scavenger_bot_desc: "Tính năng tái chế phân tử tiên tiến có thể chuyển hóa bất kỳ vật chất nào thành vật liệu cần thiết để chế tạo khung người máy."
