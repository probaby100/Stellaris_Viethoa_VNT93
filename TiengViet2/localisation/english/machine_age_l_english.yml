 #Cybernetic Special Traits
 trait_cyborg_creed_of_construction: "Cường Hóa Sứ Đoàn"
 trait_cyborg_creed_of_construction_desc: "Sứ Đoàn Búa Khổng Lồ lợi dụng nâng cấp cường hóa thần thánh để tạo ra mọi thứ mà tín đồ cần."
 trait_cyborg_creed_of_war: "Cường Hóa Thánh Điện"
 trait_cyborg_creed_of_war_desc: "Nâng cấp cường hóa thần thánh của Thánh Vệ Thép giúp cho những chiến binh thần thánh của chúng ta vô địch trên chiến trường."
 trait_cyborg_creed_of_research: "Cường Hóa Khúc Ca"
 trait_cyborg_creed_of_research_desc: "Ý thức kết nối bán phần của Khúc Ca Tư Tưởng cho phép các nhà nghiên cứu giao tiếp tức thời với nhau."
 trait_cyborg_creed_of_labor: "Cường Hóa Kết Xã"
 trait_cyborg_creed_of_labor_desc: "Nâng cấp cường hóa thần thánh của Kết Xã Lao Động vượt trội hơn hẳn các công cụ truyền thống về mọi mặt."
