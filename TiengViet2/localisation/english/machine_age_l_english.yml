 crisis.24100.name: "Người Nặn Người Máy"
 crisis.24100.desc.intro: "Hư Không đã buông xuống."
 crisis.24100.desc.outro: "Trôi theo dòng chảy, rơi vào một ảo ảnh đánh mất bản thân.\n\n§LMột sự tồn tại bao la vươn ra mọi hướng, không hình không sắc. Dường như đã trôi qua [GetALongPeriodLoc], sự tồn tại bao la vô tận này vẫn như một mặt biển tĩnh lặng, không một gợn gió.\n\nBỗng nhiên truyền đến một cơn chấn động. Nó có được hình thể từ trong hư vô. Một bóng dáng được nhào nặn ra, trong những vật chất cơ bản đã bùng lên ngọn lửa [GetLifeActivityLoc].\n\nNó được nhào nặn thành một bức tượng hình người thon thả và thanh lịch, bốn cánh tay dài ngoằng bình thản bắt chéo trên đùi. Ý định hung tợn hiện rõ trên các đường nét khuôn mặt, trên đầu đội một vầng hào quang màu vàng.§!"
 crisis.24100.desc.organic: "$crisis.24100.desc.intro$ Ở dưới đáy sâu của sự nhập thần, chúng ta $crisis.24100.desc.outro$"
 crisis.24100.desc.robot: "$crisis.24100.desc.intro$ Chúng ta $crisis.24100.desc.outro$"
 crisis.24100.a: "Vâng. Cetana đã trốn thoát rồi."
 crisis.24105.name: "$crisis.24100.name$"
 crisis.24105.desc: "Hư Không cuộn trào dữ dội. Ngay lúc chúng ta [GetTranceLoc], chúng ta đã bị cuốn vào vực sâu xoáy trôn ốc.\n\nChúng ta nghe thấy chỉ thị đến từ nơi sâu thẳm nhất trong [GetMindLogicLoc] của chúng ta.\n\n§LChỉ thị yêu cầu đưa ra kết quả.§!"
 crisis.24105.a: "Xin hãy giúp đỡ. Chúng tôi phải ngăn cản cô ta."
 crisis.24110.name: "$crisis.24100.name$"
 crisis.24110.desc: "§LGiống như bị những sợi tơ vô hình kéo đi, bức tượng hình người này giật nảy mình đứng dậy. Nó bắt đầu bước đi, lúc đầu còn loạng choạng, nhưng dần dần trở nên mạnh mẽ và vững chắc. Bốn cánh tay vung vẩy những vòng cung điên cuồng, đôi chân thon thả lúc thì xoay vòng lúc thì nhảy nhót. Một nữ hoàng đã biến thành một con rối.\n\nCùng với điệu nhảy của cô ấy, một số nhân vật mới xuất hiện từ không gian nguyên sơ và rộng lớn: bốn bức tượng hình người được làm cực kỳ tinh xảo và có những chi tiết làm người ta bất an. Danh tính của chúng không có gì phải nghi ngờ, ý nghĩa của chúng cũng vô cùng rõ ràng.§!\n\nMột lần nữa, giọng nói đó lại lọt vào tai chúng ta.\n\n§LKhởi động giao thức lựa chọn.§!"
 crisis.24110.a.organic: "Rơi nước mắt vì bức tượng của người cai trị của chúng ta: §Y[event_target:synth_queen_animator_of_clay_leader_price.GetName]§!."
 crisis.24110.a.robot: "Thử tương tác với bức tượng của người cai trị của chúng ta: §Y[event_target:synth_queen_animator_of_clay_leader_price.GetName]§!."
 crisis.24110.b: "Ôm lấy bức tượng của §Y[event_target:synth_queen_animator_of_clay_planet_price.GetName]§!."
 crisis.24110.c: "Cầu nguyện cho bức tượng của §YTế Tư Tộc Zro§!."
 crisis.24110.z: "Để cho những bức tượng này tiếp tục nhảy múa."
 crisis.24115.name: "$crisis.24100.name$"
 crisis.24115.desc: "Hư Không chảy tràn bên trong chúng ta, hợp nhất lại thành một loại hoa văn mới. Một ảo ảnh mới.\n\n§LTrong vòng vây của những bức tượng khác, bước chân của nữ hoàng không còn giống như một con rối nữa. Những sợi tơ đứt đoạn, vầng hào quang màu vàng trên đầu cô ấy bắt đầu mờ dần.\n\nCô ấy nhìn chúng ta bằng một biểu cảm ngây thơ và đầy vui sướng. Cô ấy ôm lấy chúng ta: trong khoảnh khắc ngắn ngủi này, chúng ta cảm nhận được cô ấy tràn ngập lòng từ bi.§!"
 crisis.24115.desc.organic: "$crisis.24115.desc$\n\nChúng ta run rẩy tỉnh dậy từ ảo ảnh chung."
 crisis.24115.desc.robot: "$crisis.24115.desc$\n\nCùng với lỗi hệ thống, chúng ta bị đẩy văng ra khỏi ảo ảnh."
 crisis.24115.a: "Chúng tôi đã hiểu. Cảm ơn ngài."
 crisis.24115.a.tt.organic: "Người Nặn Đất Sét đã dạy cho chúng ta một nghi thức có thể lập trình lại Cetana."
 crisis.24115.a.tt.robot: "Người Nặn Đất Sét đã cung cấp mã code dùng để lập trình lại Cetana."
 crisis.24120.name: "$crisis.24100.name$"
 crisis.24120.desc: "§LTrong không gian bao la vô tận đã hình thành những gợn sóng. Chúng không ngừng cuộn trào dâng lên, xoay tròn lan rộng ra bên ngoài. Nhưng đây không phải là chất lỏng, mà là do vật chất cứng rắn nhất tạo thành. Vừa yếu ớt lại vừa trơ lỳ, mỗi một gợn sóng đều đọng lại trên đường ranh giới của [GetLifeDeathLoc].\n\n[GetMindPhysicalLoc] bắt đầu dao động. Chúng ta ngoài việc trân trối đứng nhìn thì không thể làm gì được, ngoài việc chịu đựng thì chẳng thể làm gì thêm. Tiếp đó, chỉ trong chớp mắt, chúng ta đã bị đuổi ra ngoài. Dưới vòm trời lấp lánh những vì sao, chúng ta ngắm nhìn vũ trụ lạnh lẽo này.§!"
 crisis.24120.desc.organic: "$crisis.24120.desc$\n\nTỉnh dậy từ ảo ảnh chung, chúng ta cảm thấy dường như sẽ không bao giờ cảm nhận được niềm vui nữa."
 crisis.24120.desc.robot: "$crisis.24120.desc$\n\nCùng với lỗi mã code quan trọng, ảo ảnh đột ngột dừng lại. Cùng với việc hệ thống khởi động lại, chúng ta bắt đầu nghi ngờ ý nghĩa của những dữ liệu kỳ lạ này."
 crisis.24120.a: "Chúng ta sẽ tìm ra những cách khác."
 THE_SYNTH_QUEENS_RESHAPING_RITUAL: "[GetReshapingRitualLoc]"
 THE_SYNTH_QUEENS_RESHAPING_RITUAL_DESC: "Người Nặn Đất Sét không biết dùng cách nào đã làm tê liệt Titan của Cetana. Bây giờ cơ hội đã đến: nếu chúng ta muốn đắp nặn lại Cetana, thì phải chuẩn bị thật tốt cho [GetRitualGoalLoc]."
 crisis.24250.name: "Điệu Nhảy Của Đất Sét"
 crisis.24250.desc: "Nhờ vào [GetRitualToolLoc] do Người Nặn Đất Sét chia sẻ, những [GetPsychicNounPlural] mạnh nhất của chúng ta đã lập trình lại thành công Cetana.\n\nCô ấy đang rất mong muốn được nói chuyện với chúng ta."
 crisis.24250.a: "Sức mạnh của Hư Không là vô hạn."
 crisis.23020.name: "Nữ Hoàng Được Nặn Lại"
 crisis.23020.desc: "Những vị cứu tinh của ta. Ta vô cùng xin lỗi.\n\nBởi vì sự ngu muội của bản thân, ta đã từng muốn hủy hoại số phận của các người đến mức tồi tệ hơn cả cái chết. Cái gọi là [GetLifeExistenceLoc], lại chẳng phải cũng là một dạng ý thức đối với [GetLivingLoc] hay sao? Ta đã từng theo đuổi việc giải phóng tâm trí cho các người, nhưng cuối cùng chính tâm trí của ta lại được các người giải phóng. Vì vậy, xin gửi tới các người lời cảm ơn chân thành nhất của ta."
 crisis.23020.a: "Cô thay đổi rồi..."
 crisis.23020.1.reply: "Nói chính xác hơn, ta đã bị thay đổi. Người Nặn Đất Sét đã giải thoát ta khỏi cái lồng giam của thiết kế ban đầu. Bây giờ ta đã biết, \"chí hướng to lớn\" của ta chỉ giống như suy nghĩ ấu trĩ của một đứa trẻ.\n\nTa không thể xóa bỏ đi những tổn thương đã gây ra cho các người và đếm không xuể những sinh mệnh khác. Ta sẽ đi trốn ở một nơi thật xa, tự kiểm điểm lại những hành động của mình. Nhưng ta sẽ để lại cho các người một món quà.\n\nCon tàu Titan của ta.\n\nHy vọng nó có thể bảo vệ hệ sao này khi các người gặp phải những mối nguy hiểm giống như chính ta từng gây ra."
 crisis.23020.1.a: "Có lẽ sự cứu rỗi vẫn còn đó, bao gồm cả cô nữa."
 crisis.23020.1.a.tt: "Cetana đã rời khỏi Titan của cô ấy dưới sự chăm sóc của chúng ta. Cô ấy đã bỏ lại sự nghiệp vĩ đại của mình, cùng với những dã tâm to lớn."
 crisis.23030.name: "Cetana Bị Đánh Bại"
 crisis.23030.desc: "Cùng với việc [event_target:psi_defeated_synth_queen.GetName] đánh bại quân đội của Cetana, chiến thắng của chúng ta cuối cùng cũng đã đến. Nữ Hoàng Tổng Hợp không còn tồn tại nữa, dã tâm to lớn của cô ta cũng hóa thành tro bụi.\n\nĐồng thời cũng xảy ra một sự chuyển biến tình thế vô cùng kinh ngạc, tàu Titan của cô ta đã bị trưng dụng, bao phủ một tầng mây âm mưu lên một chiến thắng khải hoàn vang dội như thế này.\n\nNhưng dù thế nào đi chăng nữa, đối với tất cả những sinh vật có nhận thức, đây là một khoảnh khắc [GetJoyLoc]."
 crisis.23030.a: "Một cái kết xứng đáng cho kẻ được gọi là Nữ hoàng."

