 advanced_logic_current_value: "Giá trị hiện tại: §Y$VALUE|0$§!"
 advanced_logic_crisis_description_title: "Khởi Nguồn Vũ Trụ"
 advanced_logic_crisis_description: "$menace_crisis_description_intro$\n\nĐế chế Sa ngã sở hữu những kiến thức mà chúng ta đang theo đuổi, nhưng họ đã trở nên quá chậm chạp và tự mãn. Chúng ta có quyền áp dụng bất kỳ biện pháp cần thiết nào để vượt qua họ."
 advanced_logic_crisis_howto_title: "Logic và Đề Tài"
 advanced_logic_crisis_howto: "Với tư cách là Thiên Tai, hãy hoàn thành §HMục Tiêu Thiên Tai§! để sản xuất £advanced_logic£§HLogic Siêu Việt§!, qua đó mở khóa tiềm năng công nghệ của đế chế. Trên hành trình vượt qua Đế chế Sa ngã, chúng ta phải từng bước hoàn thành các §HĐề Tài§! và viết lại các quy luật của vũ trụ."

