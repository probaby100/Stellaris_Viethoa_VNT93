 col_cosmogenesis_world: "$pc_cosmogenesis_world$"
 pc_cosmogenesis_world_desc: "Một hệ thống máy tính bể dự trữ khổng lồ vô song. Nó sử dụng hệ thống cáp, bóng bán dẫn cùng buồng hỗ trợ sinh tồn phức tạp chằng chịt để kết nối hàng trăm triệu sinh vật có tri giác với nhau, bao gồm cả các thể hữu cơ lẫn thể tổng hợp. Sự vắt kiệt tàn khốc đối với các cơ quan xử lý của từng cá thể chắc chắn sẽ dẫn đến tổn thương não bộ cho một số 'linh kiện' kết nối mạng."
