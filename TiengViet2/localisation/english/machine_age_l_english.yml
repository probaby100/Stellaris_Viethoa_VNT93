 menp_cosmo_objectives: "Logic Siêu Việt"
 unlocks_cosmo_objectives: "Có thể bắt đầu tích lũy £advanced_logic£§Y$menp_cosmo_objectives$§! thông qua việc hoàn thành §HMục Tiêu Thiên Tai§!.\n\nMở khóa công nghệ §Y$tech_cosmogenesis_crisis_1$§!, đưa chúng ta tiến gần hơn đến mục tiêu.\n"
 menp_cosmo_objectives_desc: "Logic Siêu Việt đại diện cho sự hiểu biết cũng như khả năng tác động của chúng ta đối với các quy luật chi phối thực tại."
 menp_cosmo_buildings_1: "Kiến trúc Sinh thái Hoàn Hảo"
 unlocks_buildings_1: "Các công trình sơ cấp của Đế chế Sa ngã có thể xuất hiện trong Tùy chọn Nghiên cứu.\n"
 menp_cosmo_buildings_1_desc: "Đế chế Sa ngã có thể đã quên cách tái tạo lại công nghệ tiên tiến của họ, nhưng những bộ não kiệt xuất của chúng ta sẽ vén bức màn bí mật về thời kỳ hoàng kim đã bị bụi phủi của họ."
 menp_cosmo_techs_1: "Năng Lượng Phi Baryon"
 unlocks_techs_1: "Mở khóa công nghệ linh kiện phi thuyền §Y$tech_dark_matter_power_core$§!.\n"
 menp_cosmo_techs_1_desc: "Học cách khai thác năng lượng từ các hạt phản baryon là bước nhảy vọt tiếp theo trong việc sản xuất năng lượng siêu cô đặc."
 menp_cosmo_features_1: "Phần Cứng Sinh Học"
 unlocks_features_1: "Mở khóa công nghệ siêu kiến trúc §YMáy Lọc Synapse§!.\n"
 menp_cosmo_features_1_desc: "Máy Lọc Synapse khổng lồ vô song là một dạng máy tính bể dự trữ, sử dụng khả năng tính toán từ mạng lưới ý thức của dân cư chúng ta để tính toán và lưu trữ. Lợi thế của nó thì không cần phải bàn cãi, nhưng những giống loài có thế giới quan lệch lạc sẽ coi việc biến cá thể thành chip tính toán là một hành động có vấn đề về đạo đức."
 menp_cosmo_ship_2: "Tàu Hộ Tống Bí Ẩn"
 unlocks_ship_2: "Mở khóa công nghệ phi thuyền §YTàu Hộ Tống§! của Đế chế Sa ngã.\n"
 menp_cosmo_ship_2_desc: "[Get_menp_cosmo_ship_2]"
 menp_cosmo_ship_2_desc_regular: "Một phi thuyền không gian cỡ trung đã tối ưu hóa kiến thức về không-thời gian của chúng ta để đạt được sự siêu việt về mặt không gian, không gian bên trong của nó lớn hơn nhiều so với vẻ bề ngoài. So với các thiết kế tàu truyền thống, nó sở hữu hỏa lực tiên tiến đồng thời còn giảm thiểu chi phí hậu cần."
 menp_cosmo_buildings_2: "Thu Hoạch Tiên Tiến"
 unlocks_buildings_2: "Các công trình tiên tiến của Đế chế Sa ngã có thể xuất hiện trong Tùy chọn Nghiên cứu.\n"
 menp_cosmo_buildings_2_desc: "Khả năng sản xuất năng lượng của Đế chế Sa ngã từng khiến chúng ta bối rối, nhưng giờ đây mọi thứ đã sáng tỏ."
 menp_cosmo_techs_2: "Bước Tiến Phản Baryon"
 unlocks_techs_2: "Mở khóa công nghệ linh kiện phi thuyền §Y$tech_enigmatic_decoder$§! và §Y$tech_dark_matter_propulsion$§!.\n"
 menp_cosmo_techs_2_desc: "Sự thấu hiểu của chúng ta về vật chất tối cùng các ứng dụng của nó ngày càng sâu sắc hơn, mở ra một chân trời mới cho sự tiến bộ của khoa học."
 menp_cosmo_features_2: "Công Cụ Trọng Lực"
 unlocks_features_2: "Mở khóa công nghệ §Y$tech_cosmogenesis_crisis_2$§!, đưa chúng ta tiến gần hơn đến mục tiêu.\n"
 menp_cosmo_features_2_desc: "$tech_cosmogenesis_crisis_2_desc$\n"
 menp_cosmo_ship_3: "Tuần Dương Hạm Khó Hiểu"
 unlocks_ship_3: "Mở khóa công nghệ phi thuyền §YThiết Giáp Tuần Dương§! của Đế chế Sa ngã.\n"
 menp_cosmo_ship_3_desc: "[Get_menp_cosmo_ship_3]"
 menp_cosmo_ship_3_desc_regular: "Một loại phi thuyền không gian được tối ưu hóa khác, với kích thước lớn hơn, khiến các thiết giáp hạm hiện tại trông chẳng khác gì những mô hình tĩnh."
 menp_cosmo_buildings_3: "Cơ Sở Hạ Tầng Tổng Hợp"
 unlocks_buildings_3: "Các công trình tổng hợp của Đế chế Sa ngã có thể xuất hiện trong Tùy chọn Nghiên cứu.\n"
 menp_cosmo_buildings_3_desc: "Giờ đây chúng ta đã dần dần vén lên bức màn bí ẩn bao trùm Đế chế Sa ngã, chúng ta phải tiếp tục duy trì đà tiến này. Sớm muộn gì, mọi bí mật công nghệ của họ cũng sẽ bị chúng ta khám phá."
 menp_cosmo_techs_3: "Phản Baryon Kỳ Lạ"
 unlocks_techs_3: "Mở khóa công nghệ linh kiện phi thuyền §Y$tech_enigmatic_encoder$§! và §Y$tech_dark_matter_deflector$§!.\n"
 menp_cosmo_techs_3_desc: "Việc ứng dụng vật chất tối vào công nghệ phòng thủ và lĩnh vực mã hóa có thể tạo ra trường trung hòa cũng như các kênh liên lạc đáng tin cậy."
 menp_cosmo_features_3: "Bành Trướng Vĩnh Hằng"
 unlocks_features_3: "Mở khóa công nghệ §Y$tech_cosmogenesis_crisis_3$§!, đưa chúng ta tiến gần hơn đến mục tiêu.\n"
 menp_cosmo_features_3_desc: "$tech_cosmogenesis_crisis_3_desc$\n"
 menp_cosmo_ship_4: "Soái Hạm Khó Lường"
 unlocks_ship_4: "Mở khóa công nghệ phi thuyền §YTitan§! của Đế chế Sa ngã.\n"
 menp_cosmo_ship_4_desc: "[Get_menp_cosmo_ship_4]"
 menp_cosmo_ship_4_desc_regular: "Những con tàu mạnh mẽ này gần như là một pháo đài di động, chỉ những cuộc tấn công dữ dội nhất mới có khả năng làm sứt mẻ đôi chút vỏ ngoài của nó."
 menp_cosmo_buildings_4: "Thời Kỳ Hoàng Kim"
 unlocks_buildings_4: "Các công trình phi thường của Đế chế Sa ngã có thể xuất hiện trong Tùy chọn Nghiên cứu.\n"
 menp_cosmo_buildings_4_desc: "Những kiến giải của Đế chế Sa ngã đối với thao tác chiều không gian quả thật đáng kinh ngạc. Những công nghệ lâu đời nhất của họ dần trở nên sáng tỏ hơn theo mỗi khám phá mới."
 menp_cosmo_techs_4: "Giáo và Khiên"
 unlocks_techs_4: "Mở khóa công nghệ linh kiện phi thuyền §Y$tech_energy_lance_2$§! và §Y$tech_dragon_armor$§!.\n"
 menp_cosmo_techs_4_desc: "Tiến bộ công nghệ mới nhất cho phép chúng ta trang bị cho phi thuyền những ngọn giáo sắc bén nhất và những chiếc khiên vững chắc nhất."
 menp_cosmo_features_4: "Phá Vỡ Quy Luật"
 unlocks_features_4: "Mở khóa công nghệ §Y$tech_cosmogenesis_crisis_4$§!, đưa chúng ta tiến gần hơn đến mục tiêu.\nĐồng thời mở khóa công nghệ lặp lại §Y$tech_cosmogenesis_thesis$§!, để sản xuất một lượng đáng kể §YLogic Siêu Việt§!.\n"
 menp_cosmo_features_4_desc: "$tech_cosmogenesis_crisis_4_desc$"
 menp_cosmo_buildings_5: "Ghi Nhớ và Sáng Tạo"
 unlocks_buildings_5: "Các công trình huyền bí của Đế chế Sa ngã có thể xuất hiện dưới dạng Tùy chọn Nghiên cứu.\n"
 menp_cosmo_buildings_5_desc: "Những bí mật của Đế chế Sa ngã cuối cùng cũng đã được đưa ra ánh sáng, chúng sẽ mang đến cho chúng ta một kỷ nguyên hoàn toàn mới."
 menp_cosmo_techs_5: "Bầy Nanobot"
 unlocks_techs_5: "Mở khóa công nghệ linh kiện phi thuyền §Y$tech_nanite_repair_system$§!, §Y$tech_nanite_autocannon$§! và §Y$tech_nanite_flak_batteries$§!.\n"
 menp_cosmo_techs_5_desc: "Mỗi khi thay đổi góc nhìn, những cơ hội mới lại lần lượt hiện ra. Việc thực hiện những sửa đổi ở quy mô nhỏ nhất có thể mang lại những kết quả vĩ đại nhất."
 menp_cosmo_features_5: "Người Du Hành Hư Không"
 unlocks_features_5: "Mở khóa công nghệ §Y$tech_cosmogenesis_crisis_5$§!, cho phép chúng ta chế tạo một §YKim Xuyên Chân Trời§!, đưa chúng ta hoàn thành mục tiêu."
 menp_cosmo_features_5_desc: "$tech_cosmogenesis_crisis_5_desc$"

