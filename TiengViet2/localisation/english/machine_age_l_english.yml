 pft_cyber_creed_labor_desc: "Kết Xã Lao Động giám sát mọi công nhân khiêm tốn và những nâng cấp cường hóa của họ, niềm tin mãnh liệt vào sự thiêng liêng của lao động thúc đẩy các hành động của họ. Chỉ có những người chăm lo cho gốc rễ mới có thể thấu hiểu được thần tính.\n\n§LĐạo đức Duy Tâm§!"
 cyber_creed_labor: "$CYBERCREED_labor$"
 pft_cyber_creed_war: "$CYBERCREED_war$"
 pft_cyber_creed_war_desc: "Thánh Vệ Thép bảo vệ thân thể, bộ phận cấy ghép nghĩa thể và tâm hồn thần thánh của chúng ta. Các bộ phận cường hóa thúc đẩy khả năng chiến đấu và quá trình huấn luyện nghiêm ngặt của họ.\n\n§LĐạo đức Duy Tâm§!"
 cyber_creed_war: "$CYBERCREED_war$"
 pft_cyber_creed_construction: "$CYBERCREED_construction$"
 pft_cyber_creed_construction_desc: "Sứ Đoàn Búa Khổng Lồ sản xuất những vật liệu có chất lượng cao nhất. Việc nâng cấp cường hóa của họ có thể nâng cao khả năng cho các thợ thủ công của đế chế chúng ta.\n\n§LĐạo đức Duy Tâm§!"
 cyber_creed_construction: "$CYBERCREED_construction$"
 pft_cyber_creed_research: "$CYBERCREED_research$"
 pft_cyber_creed_research_desc: "Khúc Ca Tư Tưởng là một cơ cấu tổ chức bán bầy đàn được tạo thành từ các nhà nghiên cứu và kỹ sư. Những ghi chép thiền định của họ có thể được sử dụng như một phương thức để chia sẻ thông tin nhanh chóng với các thành viên của hội.\n\n§LĐạo đức Duy Tâm§!"
 cyber_creed_research: "$CYBERCREED_research$"
 pft_cyber_creed_general: "Tín Ngưỡng Thống Nhất"
 pft_cyber_creed_general_desc: "Tín Ngưỡng Thống Nhất, dưới sự dẫn dắt của một liên minh gồm các Công Nghệ Hiển Thánh Sư thần thánh, đã thanh lọc mọi tín ngưỡng cực đoan. Mặc dù vậy, sự cống hiến của họ đối với sự dung hợp thần thánh vẫn không thay đổi, thoát khỏi chủ nghĩa giáo điều từng cố gắng hạn chế vinh quang của nó trong quá khứ.\n\n§LĐạo đức Duy Tâm§!"
