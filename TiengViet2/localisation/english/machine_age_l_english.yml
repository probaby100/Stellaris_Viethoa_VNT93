 tradition_virtuality: "Ảo Hóa"
 tradition_virtuality_desc: "Chỉ thông qua những dữ liệu rõ ràng và thiêng liêng, chúng ta mới có thể đạt đến đỉnh cao của kiến thức nền tảng."
 tr_virtuality_adopt: "Truyền Thống Ảo Hóa"
