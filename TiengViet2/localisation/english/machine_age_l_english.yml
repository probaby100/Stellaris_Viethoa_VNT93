# CYBERNETIC CREED ORIGIN
##########################
 origin_cybernetic_creed: "Thần Tượng Hóa Điều Khiển Học"
 origin_cybernetic_creed_desc: "§RCẢNH BÁO: Vô hiệu hóa tất cả Đặc Quyền Thăng Hoa ngoại trừ ['concept_cybernetic_ascension'].§!\n\nĐế chế này theo đuổi một sứ mệnh thiêng liêng, đó là sự dung hợp giữa thân thể cao quý và công nghệ nghĩa thể thần thánh. Nâng cấp cường hóa chính là một hình thức sùng bái."
 origin_tooltip_cybernetic_creed_effects: "- Các công trình khởi đầu của $HOMEWORLD$ được thay thế bởi ['concept_cybernetic_creed_infrastructure'] $NEW_LINE$- Sẽ xuất hiện phe phái ['concept_cybernetic_creed'] ngay sau khi trò chơi bắt đầu\n- $SPECIES_TRAITS$ ['trait:trait_cyborg_ritualistic_implants']\n- $GUARANTEED_RESEARCH_OPTION_STRING$ ['concept_integrated_cybernetics', £engineering£ $tech_integrated_cybernetics$]\n- Việc làm ['concept_cybernetic_creed_jobs']"
 START_SCREEN_CYBERNETIC_CREED: "Sứ mệnh cao cả của chúng ta là sự kết hợp giữa [Owner.Species.GetFleshTypeCyberCreed] và máy móc. Lịch sử của chúng ta chứa đầy những nỗ lực thất bại, thế nhưng dưới sự dẫn dắt của ý chí thần thánh, hiện tại chúng ta đã đạt được giai đoạn đầu tiên của sự cộng sinh thiêng liêng cùng các bộ phận cấy ghép nghi lễ.\n\nChúng ta mới chỉ chạm tới tiềm năng nghĩa thể vô hạn của mình. Những nâng cấp cường hóa tiên tiến hơn vẫn còn đang ở phía trước.\n\nMặc dù vậy, trong đức tin của chúng ta vẫn tồn tại những bất đồng, các giáo phái khác nhau tranh cãi không ngừng về mục tiêu cuối cùng của sự cường hóa thần thánh. Một khi chúng ta trả lời được câu hỏi này, sự kết hợp hoàn mỹ giữa [Owner.Species.GetFleshTypeCyberCreed] thánh thiện và công nghệ được ban phước sẽ giúp chúng ta hoàn thiện phương án thiết kế tiến hóa ưu tiên hiện tại của mình.\n\n$machine_age.1090.pray$"
 START_SCREEN_CYBERNETIC_CREED_NOMADS: "Sứ mệnh cao cả của chúng ta là mang lại sự hợp nhất giữa [Owner.Species.GetFleshTypeCyberCreed] và máy móc. Người dân của chúng ta sinh ra trong hư không, từ lâu đã hiểu rõ rằng xác thịt không thể sinh tồn giữa muôn vàn vì sao. Lịch sử của chúng ta chứa đầy những nỗ lực thất bại, nhưng dưới sự dẫn dắt của ý chí thần thánh, giờ đây chúng ta đã đạt được giai đoạn đầu tiên của sự cộng sinh thiêng liêng thông qua các thiết bị cấy ghép nghi thức.\n\nChúng ta mới chỉ chạm đến bề nổi của tiềm năng cơ khí hóa vô tận của mình. Những cải tạo cường hóa tiên tiến hơn đang nối tiếp nhau xuất hiện.\n\nMặc dù vậy, đức tin của chúng ta vẫn tồn tại những bất đồng, các giáo phái khác nhau không ngừng tranh cãi về mục tiêu tối thượng của sự cường hóa thiêng liêng. Một khi chúng ta giải đáp được câu hỏi này, sự kết hợp hoàn hảo giữa [Owner.Species.GetFleshTypeCyberCreed] thánh khiết và công nghệ được ban phước sẽ giúp chúng ta hoàn thiện bản thiết kế tiến hóa còn nhiều hạn chế như hiện tại.\n\n$machine_age.1090.pray$"
