 tr_virtuality_5_modifier_desc: "Khi §YSự thăng thiên của hành tinh§! đạt cấp §G1§!, §G5§! và §G10§!, tòa nhà có thể cung cấp thêm §G+1§! §YĐặc khu tối đa§!"
 tr_virtuality_finisher_modifier_desc: "Tạo ra ngay lập tức £pop£ §HDân số ảo§! để lấp đầy nhu cầu việc làm £job£ của §YTòa nhà £building£§! và §YĐặc khu £district£§!.\n§R£pop£ Dân số ảo không thể trở thành người tị nạn, cũng không thể được lắp ráp.§!\nTất cả các nhà lãnh đạo §Y$trait_machine_unit$§! sẽ nhận được đặc điểm §Y$leader_trait_virtual$§!\nMở khóa quyết định hành tinh: $TABBED_NEW_LINE$§Y$decision_server_shut_down$§!"

