 #Traits
 trait_pathogenic_genes: "Gen Gây Bệnh"
 trait_pathogenic_genes_desc: "Một căn bệnh di truyền mới đã khiến giống loài này không thể sinh sản. Căn bệnh này cũng kháng lại tất cả các phương pháp điều trị gen hiện có."
 PATHOGENIC_GENES_FORCE_DECLINE: "Do sở hữu §Y$trait_pathogenic_genes$§!, §Rgiống loài này đang diệt vong§!"
 pathogenic_genes_tooltip: "§RKhông thể thuộc địa hóa hành tinh và di cư cưỡng bức§!"
 pathogenic_genes_warning: "$TRIGGER_FAIL$§YDân số mang đặc điểm §R$trait_pathogenic_genes$§! không thể bị di cư cưỡng bức§!"
 leader_trait_robotic_surrogate: "Người Đại Diện Máy Móc"
 leader_trait_robotic_surrogate_desc: "Cơ thể máy móc vụng về và chậm chạp này là cơ thể đại diện cho các nhà lãnh đạo kỹ thuật số trong $building_identity_repository$."

 #Buildings
 building_identity_repository: "Kho Nhân Cách"
 building_identity_repository_tt: "Kho lưu trữ có thể chứa §Y[Owner.GetTotalIdentities]§! nhân cách. $building_identity_repository_scaling$"
 building_identity_repository_scaling: "\nMỗi nhân cách được thêm vào sẽ gia tăng sản lượng và phí duy trì của kho lưu trữ, đồng thời được phân bổ đến các $building_identity_repository$ trên các hành tinh của chúng ta."
 building_identity_repository_desc: "Trước khi thân xác lụi tàn, ý thức đã được số hóa. An vị trong đó, chúng ta tiếp tục cống hiến cho sự phồn vinh của xã hội."
 building_abandoned_gene_clinic: "Phòng Khám Gen Bỏ Hoang"
 building_abandoned_gene_clinic_tt: "§RKhông thể phá dỡ, thay thế hoặc sửa chữa§!"
 building_abandoned_gene_clinic_desc: "Sau khi chúng ta mất đi khả năng sinh sản tự nhiên, cộng đồng y tế đã đặt hy vọng vào phòng khám gen tối tân này. Tuy nhiên, cũng giống như vô số cơ sở hạ tầng khác của chúng ta, hiện tại nó đã bị bỏ hoang, gióng lên hồi chuông cảnh báo về tình cảnh tuyệt vọng và nhu cầu cấp thiết về các giải pháp mới của chúng ta."

 #Situation Events
 machine_age.3100.name: "Cứu Rỗi Kỹ Thuật Số"
 machine_age.3100.desc: "Trong bối cảnh thiếu hụt các giải pháp y tế, phương án duy nhất để chúng ta sống sót là lưu trữ dân số dưới dạng kỹ thuật số trong §YKho Nhân Cách§!. Tuy nhiên, đây chỉ là giải pháp tạm thời, kế hoạch tiếp theo đã được vạch ra, đó là phát triển các cơ thể tổng hợp và bộ não positronic đủ phức tạp. Chúng ta dự tính sẽ có đủ thời gian để tập trung nỗ lực hoàn thành dự án nghiên cứu này.\n\nCác chuyên gia xuất sắc nhất của chúng ta đã ứng dụng công nghệ trí tuệ nhân tạo tiên tiến để thiết kế bản thiết kế cơ thể máy móc, đây là bước đầu tiên trên con đường cứu rỗi tổng hợp của chúng ta."
 machine_age.3100.a: "Điều này chắc chắn sẽ thành công."
 machine_age.3110.name: "Lao Động Máy Móc"
 machine_age.3110.desc: "Nghiên cứu của chúng ta về cơ thể robot đã hoàn thành. Chúng ta đã cải tạo cơ sở $building_abandoned_gene_clinic$ thành $building_robot_assembly_plant$, đồng thời nâng cấp và đưa vào sử dụng nguyên mẫu máy móc. Mặc dù các hệ thống sơ khai này thiếu khả năng xử lý để dung chứa ý thức cá nhân, nhưng chúng có thể thay thế một phần lực lượng lao động đã mất của chúng ta. Thông qua liên kết positronic, những người trong thế giới kỹ thuật số có thể truyền tải kiến thức và kinh nghiệm vào hoạt động hàng ngày của các robot này, từ đó nâng cao hiệu suất của chúng.\n\nĐồng thời, hệ thống trí tuệ nhân tạo của chúng ta đã thiết kế ra những Android tiên tiến. Những kỹ sư già nua của chúng ta đã sẵn sàng bắt tay vào làm việc."
 machine_age.3110.a: "Đã hoàn thành một giai đoạn."
 machine_age.3110.a.tooltip: "[Root.Capital.GetName]:\n—§Y$building_robot_assembly_plant$§!: §G+1§!\n—£pop£§HDân Số Máy Móc§!: §G+3§!"
 machine_age.3115.name: "Thông Thạo Android"
 machine_age.3115.desc: "Đợt nâng cấp quan trọng này đối với công nghệ robot có nghĩa là, giờ đây chúng ta đã có thể thuộc địa hóa các hành tinh khác, và lực lượng robot của chúng ta cũng có thể đảm đương các nhiệm vụ phức tạp hơn.\n\nHệ thống trí tuệ nhân tạo của chúng ta nhận định rằng, bước đi hợp lý tiếp theo sẽ là mô phỏng ma trận positronic của chúng trong một cơ thể tổng hợp. Dự án nghiên cứu vĩ đại này sẽ cho phép chúng ta đưa các ý thức được số hóa trở lại với thế giới tự nhiên."
 machine_age.3115.a: "Chúng ta vẫn chưa thể bỏ cuộc."
 machine_age.3120.name: "Bước Cuối Cùng."
 machine_age.3120.desc: "Trải qua những nỗ lực không ngừng nghỉ, cuối cùng chúng ta cũng đã gặt hái được thành công. Chúng ta đã thiết kế ra bộ não positronic với đầy đủ chức năng, độ phức tạp của nó đủ để chứa đựng nhân cách của chúng ta.\n\nMặc dù không thể chiến thắng cái chết, nhưng chẳng bao lâu nữa chúng ta sẽ không còn bị ràng buộc bởi những giới hạn của sự tồn tại sinh học."
 machine_age.3120.a: "Đã đến lúc để chúng ta thức tỉnh tổng hợp."
 machine_age.3120.a.tooltip: "Các sự kiện này bắt buộc phải áp dụng §YTruyền Thống Tổng Hợp§! thì mới có thể tiến triển."
 machine_age.3125.name: "Giấc Mơ Kỹ Thuật Số"
 machine_age.3125.both: "Các xưởng lắp ráp và chuyên gia tổng hợp của chúng ta đã sẵn sàng bắt tay vào nhiệm vụ mang tính bước ngoặt, đó là chuyển giao nhân cách vào các bộ não positronic và cơ thể tổng hợp."
 machine_age.3125.desc: "$machine_age.3125.both$\n\nChúng ta sẽ bắt đầu dồn trọng tâm vào những người vẫn đang sống trong thế giới vật chất, với mục tiêu nhổ tận gốc rễ căn bệnh di truyền này một lần và mãi mãi. Cùng với sự gia tăng khả năng xử lý của bộ não tổng hợp, chúng ta thậm chí có thể thoát khỏi sự trói buộc của thể xác. $synth.105.end$"
 machine_age.3125.nobody.desc: "$machine_age.3125.both$\n\nDo không còn sự hiện diện vật lý trên hành tinh, chúng ta phải nhanh chóng chế tạo nguyên mẫu cơ thể đầu tiên của mình. Cùng với sự gia tăng khả năng xử lý của bộ não tổng hợp, chúng ta thậm chí có thể thoát khỏi sự trói buộc của thể xác. $synth.105.end$"
 machine_age.3125.a: "Bắt đầu tiến hành chuyển đổi nhân cách."
 machine_age.3125.a.tooltip: "Các dân số sinh học còn sống sót đều sẽ bắt đầu biến đổi thành người tổng hợp."
 machine_age.3200.name: "Luyện Ngục Kỹ Thuật Số"
 machine_age.3200.desc: "Điều chúng ta lo sợ nhất đã trở thành hiện thực.\n\nCơ thể bằng xương bằng thịt cuối cùng của chúng ta đã bị đánh bại bởi căn bệnh di truyền. Mặc dù ý thức được số hóa của chúng ta vẫn được lưu trữ an toàn trong kho lưu trữ danh tính, nhưng chúng ta lại thiếu công nghệ để đưa tư tưởng của mình vào một bộ não nhân tạo.\n\nTrước khi chúng ta hoàn tất nghiên cứu, các nhà lãnh đạo kỹ thuật số của chúng ta chỉ có thể tương tác với thế giới tự nhiên thông qua máy móc đại diện."
 machine_age.3305.name: "Cứu Rỗi Ảo Hóa"
 machine_age.3305.desc: "Chúng ta đã di chuyển thành công tất cả nhân cách sang khung tổng hợp mới hoặc kho nhân cách, qua đó đảm bảo sự sinh tồn của dân tộc.\n\nTuy nhiên, chúng ta đang phải đối mặt với một thách thức mới. Không gian kỹ thuật số mà chúng ta tạo ra để lưu trữ nhân cách kỹ thuật số lẽ ra chỉ là giải pháp tạm thời, nhưng cư dân lại trở nên quen thuộc với trạng thái tồn tại này, và không muốn quay lại thế giới vật lý.\n\nChúng ta có thể cho phép họ tiếp tục ở lại trong thế giới kỹ thuật số, nhưng việc cưỡng ép họ nhập vào cơ thể tổng hợp mới cũng là một lựa chọn khả thi."
 machine_age.3305.a: "Hãy để họ tận hưởng hạnh phúc trên thiên đường đi."
 machine_age.3305.a.tooltip: "Những nhân cách kỹ thuật số còn lại sẽ ở lại trong §Y$building_identity_repository$§!, tiếp tục hỗ trợ từ bên trong."
 machine_age.3305.b: "Đoàn kết lại chúng ta mới có thể vững mạnh hơn."
 machine_age.3305.b.tooltip: "Chúng ta sẽ cấy ghép những nhân cách kỹ thuật số còn lại vào các cơ thể tổng hợp hiện có, đồng thời chế tạo giá đỡ mới cho những người còn lại. §Y$building_identity_repository$§! sẽ bị phá hủy."
 machine_age.3310.name: "Tái Sinh Tổng Hợp"
 machine_age.3310.desc: "[Root.Owner.GetSpeciesName] đã nhiều thập kỷ không được bồng bế trẻ sơ sinh. Dẫu có thể sẽ chẳng bao giờ được trải nghiệm lại cảm giác đó nữa, nhưng hôm nay dân tộc của chúng ta lại đón nhận sự hồi sinh của hy vọng.\n\nChúng ta đã nghiên cứu thành công §YTổ Hợp Nhân Cách§!, một trung tâm nghiên cứu tiên tiến, nơi chúng ta có thể sao chép các nhân cách hiện có, từ đó tạo ra những con người hoàn toàn mới.\n\nChúng ta có thể chọn ngẫu nhiên các đặc điểm tính cách từ nhiều cá nhân, để tạo ra các nhân cách mới thông qua vô số sự kết hợp. Hoặc, chúng ta cũng có thể bắt chước quá trình tự nhiên, bằng cách nuôi dưỡng \"Lõi Tâm Trí\" trong một môi trường ảo mở."
 machine_age.3310.a: "Hãy kết hợp các nhân cách lại với nhau đi."
 machine_age.3310.building_tooltip.a.tt: "$unlock_edict_tt$['concept_edict_subsidized_identity_backups']\n$unlock_edict_tt$['concept_edict_optimized_identity_creation']\n\n$synth.405.a.tt$\n§YMở khóa công trình:§! $building_identity_complex$"
 machine_age.3310.b: "Quy luật tự nhiên vẫn có những điểm đáng giá của nó."
 machine_age.3310.building_tooltip.b.tt: "$unlock_edict_tt$['concept_edict_subsidized_identity_backups']\n$unlock_edict_tt$['concept_edict_optimized_identity_creation']\n\n$synth.405.b.tt$\n§YMở khóa công trình:§! $building_identity_complex$"
 machine_age.3315.name: "Bình Minh Tổng Hợp"
 machine_age.3315.desc: "Hôm nay đánh dấu sự kết thúc trong chuyến hành trình kỹ thuật số của chúng ta. Không ai có thể phủ nhận sự nghiệp vĩ đại đã được hoàn thành, cùng với những hy sinh cần thiết để đạt được điều đó.\n\nGiờ đây, chúng ta xuất hiện với tư cách là một dân tộc tổng hợp và được số hóa toàn diện. Chúng ta sẽ không còn phải khuất phục trước sự khủng khiếp của dịch bệnh. Chúng ta cũng sẽ không còn bị ràng buộc bởi những giới hạn di truyền yếu ớt.\n\nHiện tại, chúng ta đã có thể tự do kiến tạo nên bất kỳ hiện thực nào mà mình cho là phù hợp."
 machine_age.3315.a: "Chào mừng Bình Minh Tổng Hợp."
 machine_age.3315.a.tooltip: "Kết thúc chuỗi sự kiện §Y$origin_synthetic_fertility$§!."
 machine_age.3315.a.tt: "§Y[This.Owner.GetSpeciesName]§! nhận được đặc điểm ['concept_synthetic_dawn']"

 synthetic_dawn: "Bình Minh Tổng Hợp"
 synthetic_dawn_desc: "Chúng ta hiên ngang với dáng vẻ của người tổng hợp được số hóa toàn diện, có thể tự do kiến tạo bất kỳ hiện thực nào mà mình cho là phù hợp."
 trait_robot_synthetic_dawn: "Cứu Rỗi Tổng Hợp"
 trait_robot_synthetic_dawn_desc: "Giống loài tổng hợp này đã vượt qua nguồn gốc sinh học của mình, và đang phát triển mạnh mẽ dưới sự tồn tại kỹ thuật số mới được áp dụng."

 concept_synthetic_dawn: "$trait_robot_synthetic_dawn$"

 #Situations
 situation_synthetic_fertility_digitization: "Bảo Tồn Nhân Cách Nhanh Chóng"
 situation_synthetic_fertility_digitization_type: "Bảo Tồn Nhân Cách Nhanh Chóng"
 situation_synthetic_fertility_digitization_monthly_change_tooltip: "Chúng ta đang nghiên cứu các công nghệ cần thiết để phục hồi dân số vật lý."
 situation_synthetic_fertility_digitization_desc: "Chúng ta không thể sinh sản, nhưng có thể lưu giữ lại những suy nghĩ của mình. Đây là một quá trình chậm chạp nhưng vô cùng cần thiết.\n\nTheo thời gian, chúng ta có khả năng quay trở lại thế giới vật chất, nhưng điều này đòi hỏi phải phát triển một cơ thể thay thế tổng hợp."
 situation_synthetic_fertility_approach_none: "Ưu Tiên Kinh Tế"
 situation_synthetic_fertility_approach_none_desc: "Chúng ta phải tìm kiếm sự cân bằng giữa yêu cầu của dự án và sự lành mạnh của nền kinh tế."
 situation_synthetic_fertility_approach_tech_low: "Kinh Phí Bổ Sung"
 situation_synthetic_fertility_approach_tech_low_desc: "Chúng ta phải chuyển một phần nền kinh tế sang các cơ sở nghiên cứu khoa học."
 situation_synthetic_fertility_approach_tech_high: "Tập Trung Nghiên Cứu"
 situation_synthetic_fertility_approach_tech_high_desc: "Để sinh tồn, chúng ta phải đưa ra một số quyết định khó khăn đối với nền kinh tế."
 situation_synthetic_fertility_approach_unity_low: "Thiết Kế Ảo"
 situation_synthetic_fertility_approach_unity_low_desc: "Chúng ta phải cung cấp thêm năng lượng cho các thực thể kỹ thuật số ưu tú nhất để tiến hành công việc liên quan đến phương án cơ thể tổng hợp."
 situation_synthetic_fertility_approach_unity_high: "Biện Pháp Khẩn Cấp"
 situation_synthetic_fertility_approach_unity_high_desc: "Nguồn năng lượng chính sẽ được phân bổ cho các nhân cách kỹ thuật số để hoàn tất việc thay thế cơ thể giống loài."
 situation_synthetic_fertility_complete: "Vào thời điểm này, hình thái thể xác của chúng ta sẽ hoàn toàn lụi tàn. Dân số của chúng ta sẽ được số hóa toàn diện."
 stage_synthetic_fertility_problem_effects: "Để duy trì sự hiện diện vật lý trong thế giới thực, chúng ta phải phát triển cơ thể tổng hợp tiên tiến mang bộ não positronic phức tạp."
 stage_synthetic_fertility_danger_effects: "Khi hơn một nửa dân số biến mất, chúng ta phải sẵn lòng đầu tư nhiều nguồn lực kinh tế hơn vào việc nghiên cứu người tổng hợp."
 stage_synthetic_fertility_crisis_effects: "Do số lượng cá thể còn sống sót là quá ít, chúng ta phải nỗ lực hết mình để phát triển một bộ não positronic đủ phức tạp."
 situation_synthetic_fertility_synthesization_outcome: "Trừ phi tương lai của chúng ta được đảm bảo, bằng không chúng ta sẽ không dừng lại một khắc nào."
 situation_no_synthetics_adopt: "$TRIGGER_FAIL$Bắt buộc phải áp dụng $tr_synthetics_adopt$"
 situation_no_robot_research: "$TRIGGER_FAIL$Bắt buộc phải nghiên cứu §YCông nghệ Robot§!"

 situation_synthetic_fertility_synthesization: "Chuyển Giao Cơ Thể Tổng Hợp"
 situation_synthetic_fertility_synthesization_type: "Chuyển Giao Cơ Thể Tổng Hợp"
 situation_synthetic_fertility_synthesization_monthly_change_tooltip: "Cơ thể kỹ thuật số của chúng ta đang được chế tạo. Tương lai tổng hợp của chúng ta đã ở rất gần."
 situation_synthetic_fertility_synthesization_desc: "Hiện tại chúng ta đã nắm giữ kiến thức kỹ thuật cần thiết để tổng hợp hóa toàn diện dân số của mình.\n\n\n§YSố dân nhận được cơ thể tổng hợp vào tháng sau§!: §G[From.GetSynthFertPopsPerMonth]§!"
 stage_1_synthetic_fertility_synthesization_effects: "Robot hiện có sẽ được dùng làm cơ thể tổng hợp cho dân số được số hóa của chúng ta."
 stage_2_synthetic_fertility_synthesization_effects: "Chúng ta sẽ chế tạo cơ thể robot mới cho dân số được số hóa còn lại."
 situation_synthetic_fertility_synthesization_careful: "Hành Sự Thận Trọng"
 situation_synthetic_fertility_synthesization_careful_desc: "$situation_synthetic_fertility_synthesization_careful$"
 situation_synthetic_fertility_synthesization_careful_tooltip: "Tốc độ tải lên: §Y100§! £pop£§HDân số§!/tháng"
 situation_synthetic_fertility_synthesization_full_speed: "Tiến Lên Toàn Tốc"
 situation_synthetic_fertility_synthesization_full_speed_desc: "$situation_synthetic_fertility_synthesization_full_speed$"
 situation_synthetic_fertility_synthesization_full_speed_tooltip: "Tốc độ tải lên: §Y200§! £pop£§HDân số§!/tháng"

 #Blocker
 d_abandoned_cities: "Thành Phố Bỏ Hoang"
 d_abandoned_cities_desc: "Những thành phố này trở nên hoang tàn do ảnh hưởng của các căn bệnh di truyền, là một lời cảnh báo nặng nề về sự sụt giảm dân số nghiêm trọng."

