 cosmogenesis_superlight_planet_1_desc: "Sự gia tăng năng lượng ánh sáng mặt trời đang tạo ra thách thức đối với các thuộc địa của chúng ta, nhiệt độ bề mặt đang tăng lên với tốc độ đáng báo động."
 cosmogenesis_superlight_planet_2: "Sự Bạo Ngược Của Vì Sao"
 cosmogenesis_superlight_planet_2_desc: "Ánh sáng, đang bốc cháy."
 cosmogenesis_alloy_ductility: "Chỉnh Sửa Tính Dễ Uốn Của Hợp Kim"
 cosmogenesis_alloy_ductility_desc: "Việc chỉnh sửa thực tại khiến cho tính dễ uốn của hợp kim trở nên tốt hơn."
 cosmogenesis_alloy_ductility_bad: "$cosmogenesis_alloy_ductility$"
 cosmogenesis_alloy_ductility_bad_desc: "Việc chỉnh sửa thực tại khiến cho hợp kim trở nên giòn hơn."
 cosmogenesis_altered_nutrition: "Điều Tiết Giá Trị Dinh Dưỡng"
 cosmogenesis_altered_nutrition_desc: "Việc chỉnh sửa thực tại khiến cho thực phẩm trở nên bổ dưỡng hơn."
 cosmogenesis_altered_nutrition_bad: "$cosmogenesis_altered_nutrition$"
 cosmogenesis_altered_nutrition_bad_desc: "Việc chỉnh sửa thực tại khiến cho giá trị dinh dưỡng của thực phẩm bị giảm xuống."
 cosmogenesis_shroud_tear: "Rào Cản Hư Cảnh Bị Suy Yếu"
 cosmogenesis_shroud_tear_desc: "Ranh giới giữa thực tại của chúng ta và Hư Cảnh đã bị suy yếu."
 supercharged_shroud_country: "Thực Thể Hư Cảnh Cuồng Bạo" #Not player facing
 leaking_atmosphere: "Rò Rỉ Khí Quyển"
 leaking_atmosphere_desc: "Việc sụt giảm khối lượng hành tinh đã ảnh hưởng đến khả năng duy trì bầu khí quyển của hành tinh này."
 COSMOGENESIS_LEAKING_ATMOSPHERE: "Ổn Định Khí Quyển"
 COSMOGENESIS_LEAKING_ATMOSPHERE_DESC: "Phái đi một đội ngũ để khắc phục sự biến đổi lực hấp dẫn của [root.location.getName], khôi phục bầu khí quyển của nó."
 cosmogenesis_sped_up: "Thời Gian Tăng Tốc"
 cosmogenesis_sped_up_desc: "Hành tinh này đã trượt vào một dòng thời gian hơi khác biệt đôi chút."
 cosmogenesis_superconductor: "Siêu Dẫn Ổn Định"
 cosmogenesis_superconductor_desc: "Chúng ta đã thực hiện chỉnh sửa đối với thực tại, cải tiến vật liệu siêu dẫn của mình."
 cosmogenesis_space_compression: "Không Gian Con Sụp Đổ"
 cosmogenesis_space_compression_desc: "Việc chuyển đổi một phần phi thuyền của chúng ta vào không gian con đã sụp đổ có thể gia tăng đáng kể tốc độ bay của chúng."
 cosmogenesis_higher_yield_payloads: "Tải Trọng Năng Lượng Cao Hơn"
 cosmogenesis_higher_yield_payloads_desc: "Chúng ta đã chỉnh sửa thực tại, nhằm gia tăng hỏa lực cho đầu đạn nổ của chúng ta."
 cosmogenesis_slightly_bigger: "Lớn Hơn Một Chút"
 cosmogenesis_slightly_bigger_desc: "Sau khi dịch chuyển pha vật chất tiến vào hành tinh này, quy mô của nó đã gia tăng vĩnh viễn."
 cosmogenesis_slowed_down: "Thời Gian Chậm Lại"
 cosmogenesis_slowed_down_desc: "$cosmogenesis_sped_up_desc$"
 cosmogenesis_slightly_smaller: "Nhỏ Đi Một Chút"
 cosmogenesis_slightly_smaller_desc: "Sau khi dịch chuyển pha vật chất ra khỏi hành tinh này, quy mô của nó đã bị thu hẹp vĩnh viễn."
 cosmogenesis_research_slowdown: "Mạng Lưới Nghiên Cứu Bị Rối Loạn"
 cosmogenesis_research_slowdown_desc: "Một cuộc thử nghiệm tính toán đã xảy ra sự cố, ảnh hưởng đến khả năng nghiên cứu của chúng ta."
 blipped_colony: "Hành Tinh Trẻ Hóa"
 blipped_colony_desc: "Hành tinh này chịu ảnh hưởng sâu sắc bởi sự dị thường của thời gian, khiến thời gian đảo ngược một chút."
 devastated_colony: "Thuộc Địa Bị Phá Hủy"
 devastated_colony_desc: "Thuộc địa này đã trở thành nạn nhân của một sự dị thường lực hấp dẫn vô cùng khắc nghiệt."
 cosmogenesis_victim: "Hậu Quả Sau Thảm Họa"
 cosmogenesis_victim_desc: "Sự dị thường lực hấp dẫn đã tàn phá toàn bộ thiên hà, gây ra những thiệt hại cực kỳ nghiêm trọng."

