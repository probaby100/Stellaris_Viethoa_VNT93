 concept_identity_repository: "$building_identity_repository$"
 concept_identity_repository_desc: "- Sản lượng:$TABBED_NEW_LINE$£physics£ 6.00 £society£ 6.00 £engineering£ 6.00 £unity£ 6.00 $NEW_LINE$- Chi phí duy trì: £energy£ 6.00 $NEW_LINE$- £trade£: §G+6§!\n\nKho lưu trữ này chứa §Y300§! Bản sắc. $building_identity_repository_scaling$\n\n§L$building_identity_repository_desc$§!"
