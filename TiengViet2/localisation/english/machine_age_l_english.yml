 pop_cat_chip_slave: "Linh Kiện Tính Toán"
 pop_cat_chip_slave_desc: "Những cá thể này bị sử dụng như những con chip trong một siêu máy tính khổng lồ. Họ chìm sâu trong trạng thái hôn mê nhân tạo, với buồng hỗ trợ sinh tồn đảm bảo cho họ tuổi thọ dài nhất có thể. Áp lực khổng lồ từ khối lượng tính toán khổng lồ cuối cùng sẽ dần làm cạn kiệt các cơ quan nhận thức của họ."
