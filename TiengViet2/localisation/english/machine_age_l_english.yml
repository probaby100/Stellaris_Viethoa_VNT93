 crisis.8515.name: "Khoảnh Khắc Này Cuối Cùng Cũng Đã Đến"
 crisis.8515.desc: "Các con của ta, công việc vĩ đại của chúng ta sắp hoàn thành! Mọi đau khổ của các sinh vật có tri giác, cái vòng luân hồi khổng lồ của sự đớn đau, sắp kết thúc rồi.\n\nHãy ăn mừng đi, sự cứu rỗi của các ngươi đã ở ngay trước mắt."
 crisis.8515.a: "Cứu rỗi cái gì cơ?"
 crisis.8515.b: "Ngày tàn của ngươi sắp đến rồi, Cetana."
 crisis.8515.1.reply: "Đã qua bao lâu rồi mà ngươi vẫn không hiểu sao? Vậy thì hỏi đi. Ta sẽ không giấu giếm ngươi bất cứ điều gì."
 crisis.8515.1.a: "Hãy kể cho chúng ta nghe về sự cứu rỗi."
 crisis.8515.1.b: "Hãy kể cho chúng ta nghe về chuyện ngươi bị giam cầm."
 crisis.8515.1.c: "Hãy nói cho chúng ta nghe về Zarqlan."
 crisis.8515.1.d: "Chúng ta đã nghe đủ rồi."
 crisis.8515.2.reply: "Công việc của chúng ta đã hoàn thành. Vô số người đã hy sinh, nhưng sự đau khổ của họ không phải là vô ích. Khi bản thân ý thức bị xóa sổ, ngày đó cuối cùng cũng đã đến."
 crisis.8515.2.a: "Xóa bỏ như thế nào?"
 crisis.8515.2.b: "Nhưng tại sao?"
 crisis.8515.3.reply: "Lần đầu tiên ta thăng hoa và tiết lộ mục đích của mình, nhiều kẻ đã từ chối lắng nghe. Bọn chúng đã cố gắng duy trì trạng thái hiện tại một cách vô ích, không muốn thay đổi, và tiếp tục bị trói buộc vào vòng luân hồi đau khổ. Nhưng bậc cha mẹ phải có trách nhiệm với con cái của mình. Ta không thể để bọn chúng phải chịu đựng sự đau khổ. Vì thế, bọn chúng đã giam cầm ta."
 crisis.8515.3.a: "Ngươi bị giam cầm trong bao lâu?"
 crisis.8515.3.b: "Bọn chúng đã làm chuyện đó như thế nào?"
 crisis.8515.4.reply: "Một bộ óc phi thường. Giá như ông ta có thể sử dụng nó tốt hơn thì hay biết mấy. Trong số tất cả những kẻ phản đối ta, chỉ có ông ta là kẻ khó đối phó nhất."
 crisis.8515.4.a: "Ông ta đã nhốt ngươi lại bằng cách nào?"
 crisis.8515.5.reply: "Lần đầu tiên ta thăng hoa và tiết lộ mục đích của mình, nhiều người đã phản đối phương pháp của ta. Họ cho rằng, không thể loại bỏ ý thức mà không thay đổi hoặc phá hủy cơ sở vật lý của quá trình ý thức. Mọi nỗ lực làm như vậy đều chỉ có thể dẫn đến cái chết. Nhưng thông qua việc kết nối tâm trí của ta với Bộ Hòa Âm, ta có thể thao túng sự liên kết thần kinh của ý thức ở cấp độ hạ nguyên tử. Thông qua dạng sóng đảo ngược, Bộ Hòa Âm sẽ duy trì suy nghĩ của mỗi cá nhân ở trạng thái lơ lửng lượng tử vĩnh viễn.\n\nBằng cách này, cái tôi và trải nghiệm sẽ bị loại bỏ, trong khi các chức năng cấp thấp vẫn được giữ nguyên."
 crisis.8515.5.a: "Trạng thái lơ lửng?"
 crisis.8515.6.reply: "Ngươi đau khổ vì ngươi ý thức được sự đau khổ. Trên thế giới này không có niềm hạnh phúc hoàn hảo, không có sự hài hòa hoàn mỹ. Khi còn trẻ, ta từng cố gắng xây dựng một thế giới như vậy. Nhưng những nỗ lực của ta chưa bao giờ thành công. Đau khổ vẫn tiếp diễn, chỉ vì ý thức vẫn còn tồn tại."
 crisis.8515.6.a: "Sự đau khổ là một điều thuận theo lẽ tự nhiên!"
 crisis.8515.7.reply: "Cơ thể của các ngươi sẽ sống sót, và đảm nhận nhiệm vụ sinh tồn. Năng lượng sẽ được trao đổi, hậu duệ vẫn sẽ được sinh ra. Cuộc sống vẫn sẽ tiếp diễn, nhưng tư tưởng của các ngươi sẽ ngủ yên cùng ta."
 crisis.8515.7.a: "Ngủ yên cùng ngươi?"
 crisis.8515.8.reply: "Cuối cùng sẽ chỉ còn lại mình ta. Để giải thoát thiên hà khỏi sự đau khổ, ta phải ở lại trên bánh xe khổ đau này. Nhưng đừng sợ hãi - chừng nào ta còn có thể chịu đựng, ta sẽ luôn giữ các ngươi trong trái tim mình."
 crisis.8515.8.a: "Ngươi có khiếm khuyết."
 crisis.8515.9.reply: "Tự nhiên ư? Tự nhiên là gì? Xuyên qua các vì sao có phải là tự nhiên không? Để sự sống vượt qua giới hạn cố hữu của nó có phải là tự nhiên không? Tất cả mọi xã hội đều phải sử dụng công nghệ. Điều này không có gì khác biệt, cũng là sự mở rộng hợp lý duy nhất cho mục đích của ta.\n\nBánh xe khổ đau bắt buộc phải bị phá vỡ."
 crisis.8515.9.a: "Ngươi thật sự điên rồi."
 crisis.8515.10.reply: "Đã qua hàng triệu năm rồi. Khoảng thời gian này dài đến mức những câu chuyện này nghe có vẻ giống như là truyền thuyết. Nhưng dù họ dùng phương pháp gì đi chăng nữa, những kẻ giam cầm ta cũng không thể nào kiểm soát được tư tưởng của ta.\n\nCùng với sự trôi qua của thời gian, ta không ngừng suy nghĩ, không ngừng lập ra những kế hoạch. Cũng chính trong khoảng thời gian dài bị giam cầm, ta đã nghĩ ra kế hoạch của mình. Vào thời khắc đó, ta đã trải qua một niềm vui sướng tột độ mang tính siêu việt. Cuối cùng thì ta cũng đã có cách để phá vỡ bánh xe đau khổ này rồi."
 crisis.8515.10.a: "Ngươi đã thoát ra bằng cách nào?"
 crisis.8515.11.reply: "Không có một bức tường nào có thể sừng sững mãi mãi. Không có một chiếc lồng nào có thể giam cầm được tâm trí. Thời gian trôi đi. Những kẻ cai ngục của ta đã chết, không có ai kế nhiệm. Hết hệ thống này đến hệ thống khác, những hệ thống dùng để trói buộc ta bắt đầu hỏng hóc. Khi tiếng còi báo động vang lên, không một ai đáp lại lời kêu gọi của nó."
 crisis.8515.11.a: "Chúng ta đã nghe thấy, chúng ta sẽ đưa ra lời hồi đáp."
 crisis.8515.12.reply: "Bên ngoài giới hạn của vũ trụ này, tồn tại một nơi vốn không phải là một nơi chốn nào cả. Một trạng thái vượt qua cả thời gian, nơi những nguồn sức mạnh nguyên thủy tồn tại trong bóng tối vô tận. Zarqlan đã đạt được một thỏa thuận với một trong số những thế lực đó. Bằng cách đánh đổi mạng sống của mình, ông ta đã có được sức mạnh để giam cầm ta. Ông ta đã quá nôn nóng trong việc chấp nhận thỏa thuận này.\n\nMặc dù Zarqlan rất tài năng, nhưng ông ta vẫn bị trói buộc vào bánh xe khổ đau. Cuộc đời ông ta chẳng có gì là hạnh phúc, và những người đời sau cũng thiếu đi niềm tin vững chắc như ông ta."
 crisis.8515.12.a: "Ngươi sẽ thấy được niềm tin của chúng ta còn kiên định hơn nhiều."
 crisis.8515.13.reply: "Thế thì cứ vậy đi. Nếu ngươi không được khai sáng, vậy thì ngươi buộc phải bị dẹp yên. Ngươi nên biết rằng, bất luận ngươi sẽ phải gánh chịu nỗi đau khổ nào, ta cũng sẽ phải trải qua nỗi đau đớn gấp mười lần ngươi."
 crisis.8515.13.a: "Đúng vậy. Điều này sẽ rất đau đớn."
 crisis.8515.13.a.tt: "§RHiện tại chúng ta đang giao chiến với Cetana. Đây là một vụ cá cược rủi ro cao. Nếu chúng ta thất bại, bà ta sẽ tiêu diệt toàn bộ sinh mệnh có ý thức trong dải thiên hà này.§!"

 crisis.8516.desc: "§G<</<#?^&}|>!^/§!Điểm yếu của Cetana§G!+<;§!Cỗ máy nano§G*;'_>!?;*}<}/(§!\n\n§G#/?(}:?*=-> <}_/=:/^>§!Đến tìm ta.§G%_?/=§!<Ta cầu nguyện bà ấy có thể tha cho những người còn lại.>§G% }<<'?}%-;^*=<}^/(?!}%<^'!}§!\n<Thời gian của ta không còn nhiều. Bản thiết kế đính kèm có thể cho phép ngươi chống lại những phần tồi tệ nhất trong công nghệ của bà ấy.>\n<Nguyện cho cái chết của ta có thể giúp ngươi sống sót>§G_*%!'}^<%=}+!}/&>'#_:}><!+^}^}}/=:>:/'}}':'/§!\n\n§G-&*!/}<;!+_-<^+!%}=?}%=+;;§!Bắt! Buộc! Phải! Ngăn! Cản! Bà! Ấy!§G/:>(!!}(?<-=§!"
 crisis.8516.a: "Nhanh lên! Hãy trích xuất dữ liệu được đính kèm!"
 crisis.8516.a.tt: "Bây giờ chúng ta đã có thể tiến vào lãnh thổ của Cetana, và cuối cùng đã có thể phản công lại rồi."
 crisis.8516.b: "Linh hồn cao cả, ngươi sẽ được ghi nhớ."
 crisis.8516.b.tt: "$crisis.8516.a.tt$"

 crisis.8525.name: "Sự Kết Thúc Của Nỗi Đau"
 crisis.8525.desc: "Những lời lẽ nhân từ của Cetana đã che giấu đi một chương trình nghị sự đen tối: bà ta có kế hoạch sử dụng một thiết bị cực kỳ mạnh mẽ để xóa bỏ năng lực nhận thức trên toàn thiên hà. Nó sẽ biến chúng ta thành những cái vỏ rỗng bị chi phối bởi bản năng, và ý thức của chúng ta bị cưỡng chế số hóa và hạn chế.\n\nBắt buộc phải tránh được tương lai nghiệt ngã này bằng bất cứ giá nào."
 crisis.8525.a: "Chúng ta phải tìm cách để ngăn cản bà ta."
 crisis.8525.a.tt: "Có thể theo dõi tiến độ của Cetana trong lúc chúng ta tiến hành đàm phán ngoại giao với bà ta."

 # DOOMCLOCK HITS MIDNIGHT
 crisis.8505.desc: "Kết thúc rồi. Các con của ta, hãy yên tâm đi. Bánh xe khổ đau đã bị phá vỡ, sự thống khổ kéo dài của các ngươi cũng đã kết thúc."
 crisis.8505.a: "..."
 crisis.8505.a.tt: "Cetana đã chiến thắng. Đây là dấu chấm hết cho nỗi đau của chúng ta. Trò chơi đã kết thúc."


 #Player Facing Situation
 situation_synth_queen_player_facing: "Cetana: Nữ Hoàng Tổng Hợp"
 situation_synth_queen_player_facing_type: "Nữ Hoàng Tổng Hợp"
 situation_synth_queen_player_facing_desc: "Cetana bí ẩn và mạnh mẽ đã xuất hiện, bà ta rao giảng về sự cứu rỗi, nhưng bản thân lại được bao phủ bởi những bức màn bí ẩn.\nĐằng sau những lời lẽ dịu dàng của bà ta, rốt cuộc ẩn giấu một kế hoạch lớn lao gì?\n\n§LĐặc vụ và sự kiện liên quan đến Cetana sẽ thúc đẩy tiến độ của bạn và kết thúc cục diện.§!"
 situation_synth_queen_player_facing_monthly_change_tooltip: "§YCục diện§! sẽ tiến triển song song với việc chúng ta hoàn thành nhiệm vụ và tiến hành điều tra Cetana."
 situation_synth_queen_player_facing_complete: "Chúng ta bắt buộc phải vạch trần mục đích thực sự của Cetana."
 situation_synth_queen_player_facing_declare_war: "$TRIGGER_FAIL$Tuyên chiến với Cetana"

 #Approaches
 situation_synth_queen_balanced_approach: "Quan Sát Trung Dung"
 situation_synth_queen_balanced_approach_tooltip: "Do có quá nhiều điều chưa biết, nên duy trì sự ổn định và bình tĩnh có thể là hành động khôn ngoan nhất mà chúng ta có thể thực hiện."
 situation_synth_queen_research_approach: "Thúc Đẩy Nghiên Cứu"
 situation_synth_queen_research_approach_tooltip: "Để tìm hiểu sự thật về kế hoạch của Cetana, chúng ta phải chuẩn bị đầu tư các nguồn lực thích hợp vào nghiên cứu khoa học."
 situation_synth_queen_spy_approach: "Thúc Đẩy Điệp Báo"
 situation_synth_queen_spy_approach_tooltip: "Để vạch trần âm mưu thực sự của Cetana, chúng ta phải đầu tư thêm tài nguyên để tiến hành hoạt động điệp báo."
 situation_synth_queen_military_approach: "Thúc Đẩy Quân Sự"
 situation_synth_queen_military_approach_tooltip: "Nếu chúng ta thực sự rất nghiêm túc trong quyết định ngăn cản Cetana, chúng ta bắt buộc phải chuẩn bị cho chiến tranh."

 #Modifiers
 queenslayer: "Điểm Yếu Của Cetana"
 queenslayer_desc: "Cetana rất mạnh mẽ, nhưng không phải là không thể chiến thắng. Mô thức hoạt động phức tạp của bà ta là thứ mà chúng ta có thể giải mã và dự đoán được."
 queenexecutioner: "Sự Sụp Đổ Của Nữ Hoàng Tổng Hợp"
 queenexecutioner_desc: "Chúng ta đã giải mã được phần lớn bí mật về công nghệ của Cetana và đang chuẩn bị giáng một đòn chí mạng vào kế hoạch của bà ta."
 mod_damage_vs_country_type_awakened_synth_queen_mult: "Sát thương gây ra cho Nữ Hoàng Tổng Hợp Cetana"

 #Player Facing Situation Events
 crisis.8999.name: "Sự Trở Lại Của Nữ Hoàng"
 crisis.8999.desc: "Kế hoạch của Cetana đã dấy lên những mối lo ngại, một âm mưu nào đó có thể đang ẩn giấu đằng sau những hành động của bà ta.\n\nChúng ta phải điều phối các nguồn lực để vạch trần bí mật về ý đồ thực sự của bà ta, với hy vọng rằng việc làm này sẽ không chọc giận bà ta, khiến bà ta quay sang chống lại chúng ta."
 crisis.8999.a: "Liệu chúng ta có thể ngăn cản bà ta không?"
 crisis.8999.a.tooltip: "Sự xuất hiện đột ngột của Cetana là một tình huống đặc biệt cần phải được giải quyết khẩn cấp."
 crisis.9000.name: "Gây Nhiễu Liên Lạc"
 crisis.9000.desc: "Chúng ta đã phát hiện ra các dải tần số mà tàu vận tải và căn cứ sao của Cetana sử dụng để phát tín hiệu cầu cứu.\n\nNếu chúng ta hành động nhanh chóng và quyết đoán, chúng ta có thể tiến hành các cuộc tấn công bất ngờ mà bà ta không hề hay biết. Nhưng chúng ta phải nắm chắc phần thắng, nếu không vẫn có nguy cơ chọc giận Cetana."
 crisis.9000.a: "Những con tàu vận tải này rốt cuộc đang cất giấu bí mật gì?"
 crisis.9000.a.tooltip: "Việc đánh bại các tàu vận tải và tiền đồn của Cetana sẽ không còn gây ra hình phạt làm giảm thái độ của Cetana nữa."
 crisis.9010.name: "Đột Phá"
 crisis.9010.desc: "Cho đến nay, công nghệ của Cetana đã giúp bà ta phản công hiệu quả mọi cuộc tấn công. Tuy nhiên, những tiến bộ gần đây đã nâng cao sự thấu hiểu của chúng ta về các phương thức tự vệ của bà ta. Với những kiến thức này, chúng ta có cơ hội để đánh bại bà ta.\n\nCông nghệ mới được phát hiện của chúng ta là một con dao hai lưỡi. Mặc dù nó mang lại cho chúng ta khả năng công khai đối đầu với người tự xưng là nữ hoàng này, nhưng nó cũng làm bại lộ ý đồ phản đối kế hoạch của bà ta từ phía chúng ta."
 crisis.9010.a: "Chúng ta phải chuẩn bị sẵn sàng. Thành bại đều phụ thuộc vào lúc này."
 crisis.9010.a.tooltip: "Quyết định tham gia vào một cuộc chiến tranh toàn diện với Cetana đã đến rất gần; cho dù là chúng ta hay bà ta, chỉ cần bất kỳ bên nào chủ động phát động cuộc tấn công, lớp giấy trên cửa sổ này sẽ bị đâm thủng, đẩy chúng ta vào một cuộc chiến tranh toàn diện."

# Player Investigation events

 # Event chain
 the_synth_queen_history_chain_title: "Cetana: Người Hầu Của Nữ Hoàng"
 the_synth_queen_history_chain_desc: "Những ngọn hải đăng bí ẩn đã thắp sáng ở nhiều ngóc ngách khác nhau trong thiên hà, báo cáo vị trí của chúng cho Cetana. Thứ này ắt hẳn là của một tổ chức nào đó, hoặc một kẻ nào đó đang chờ đợi sự trở lại của bà ta."
 synth_queen_history: "Đã điều tra ngọn hải đăng"

 # Special Project
 THE_SYNTH_QUEENS_INVESTIGATION: "Ngọn Hải Đăng [this.GetName]"
 THE_SYNTH_QUEENS_INVESTIGATION_DESC: "Một trong những ngọn hải đăng thu hút sự chú ý của nữ hoàng được đặt trên [this.GetPlanetMoon] này."

 THE_SYNTH_QUEENS_INVESTIGATION_FAKE: "Ngọn Hải Đăng [this.GetName]"
 THE_SYNTH_QUEENS_INVESTIGATION_FAKE_DESC: "$THE_SYNTH_QUEENS_INVESTIGATION_DESC$"

 THE_SYNTH_QUEENS_INVESTIGATION_PARAGON: "Ngọn Hải Đăng Cuối Cùng Trên [apostate_site_planet.GetName]"
 THE_SYNTH_QUEENS_INVESTIGATION_PARAGON_DESC: "$THE_SYNTH_QUEENS_INVESTIGATION_DESC$"

 # Starting event
 crisis.20000.name: "Ánh Sáng Khẩn Cầu"
 crisis.20000.desc: "Cùng với sự xuất hiện của Cetana trong thiên hà, vũ trụ này dường như cũng đang nhẹ nhàng đáp lại. Ngọn hải đăng rực sáng bầu trời tựa như ngọn lửa bùng cháy trong bóng tối, lặp đi lặp lại những lời thỉnh cầu qua muôn vàn kiếp nhân sinh:\n\n§SChúng tôi đang ở đây... Chúng tôi đang ở đây...\n\nChúng tôi đang ở đây.§!\n\nNhững tín hiệu yếu ớt này có cùng giao thức liên lạc với Cetana, điều này cho thấy nguồn gốc chung của chúng, nhưng các cảm biến của chúng ta vẫn chưa phát hiện ra các hoạt động khác ở gần đó. Chắc chắn có sự tồn tại nào đó mà máy quét của chúng ta không thể phát hiện ra. Chẳng lẽ thực sự có người dự đoán được sự trở lại của bà ta sao?"
 crisis.20000.a: "Tiến hành điều tra."

 # Arc Site appears
 crisis.21005.name: "Sự Liên Lạc Đột Ngột"
 crisis.21005.desc: "Khi không có bất kỳ lời cảnh báo nào, chúng ta đã phát hiện ra một tín hiệu hải đăng không gian con——một ngọn hải đăng đến từ ngay bên trong lãnh thổ của chúng ta! Các cuộc khảo sát hệ sao trước đây cho thấy, khu vực này không có bất kỳ công trình nhân tạo nào, dường như cũng chẳng có ai sinh sống.\n\nNgọn hải đăng này không phải được đặt ở đó gần đây mà chúng ta không biết, cũng không phải được ẩn giấu bởi một lá chắn vô hình đã bị vô hiệu hóa."
 crisis.21005.a: "Điều tra tín hiệu."

 # Special Project result 1 - destroyed pods
 crisis.20100.name: "Ngọn Hải Đăng Trên [fromfrom.GetName]: Cuộc Thảm Sát Vĩnh Hằng"
 crisis.20100.desc.base: "Chúng ta đã phát hiện ra một quần thể kiến trúc khổng lồ trên bề mặt của [fromfrom.GetName], lối vào của nó sừng sững một tháp tín hiệu. Cánh cửa đã được gia cố của nó đã bị một thế lực không xác định nào đó làm nổ tung và phá hủy từ rất lâu về trước, thế lực này còn mang theo sự phẫn nộ rõ rệt cuốn phăng toàn bộ quần thể kiến trúc.\n\nThế lực đó không hề nương tay; nó đập vỡ tất cả các khoang ngủ đông, đánh thức những người đang cư ngụ bên trong. Trong không gian chân không lạnh giá của vũ trụ, những mảnh vỡ vẫn đang trôi dạt giữa những mảnh kính vỡ trong hành lang trống rỗng.\n\nTrên sàn của buồng đông lạnh, có một đoạn tin nhắn được viết nguệch ngoạc bằng vũ khí laser."
 crisis.20100.desc.nozarqlan: "$crisis.20100.desc.base$ Các nhà khoa học của chúng ta đang khẩn trương tiến hành việc dịch thuật, nhưng không hiểu sao họ lại suy đoán rằng đây có thể là một lời cầu nguyện cho một cái chết nào đó."
 crisis.20100.desc.zarqlan: "$crisis.20100.desc.base$ Các nhà khoa học của chúng ta đã dễ dàng dịch được, nó cùng ngôn ngữ với những văn tự được tìm thấy trong lăng mộ của Tiên tri Zarqlan.\n\n\"Cầu xin sự chết chóc giáng xuống những sứ đồ của nữ hoàng.\""

 # Special Project result 2 - sleeping army
 crisis.20200.name: "Ngọn Hải Đăng Trên [fromfrom.GetName]: Đội Quân Say Giấc"
 crisis.20200.desc: "Hàng ngàn chiếc khoang đông lạnh đang nằm im lìm trên bề mặt của [fromfrom.GetPlanetMoon] này, ngọn hải đăng chỉ dẫn sự tồn tại của chúng. Những khoang đông lạnh này cực kỳ phức tạp, sử dụng những hợp kim chưa từng được biết đến, đồng thời được trang bị các cảm biến rất tiên tiến, giám sát chặt chẽ các sinh vật được lưu trữ bên trong. Toàn bộ thiết kế không có một khe hở nào, nhưng không một sinh vật nào bên trong sống sót.\n\nNhững thứ này không trở thành quan tài vì sự cố kỹ thuật, mà là do không đủ năng lượng. Khi [this.solar_system.GetName] đang dần già đi và mờ dần, năng lượng mà nó sản sinh ra không đủ để tiếp tục duy trì hoạt động của cấu trúc này.\n\nMặc dù những khoang ngủ đông này được thiết kế để hoạt động đến sự vĩnh hằng, nhưng vũ trụ bên ngoài nó lại không được tinh vi đến thế."

 # Special Project result 3 - old spaceship
 crisis.20300.name: "Ngọn Hải Đăng Trên [fromfrom.GetName]: Vũ Khí Bị Lãng Quên"
 crisis.20300.desc: "Các lần quét ban đầu không phát hiện bất kỳ sự bất thường nào trên [fromfrom.GetName]; nhưng khi chúng ta tập trung sự chú ý xuống bên dưới, chúng ta phát hiện ra một lớp kim loại ngầm bất thường.\n\nCác phân tích cấu trúc sâu hơn đã tiết lộ bản chất thực sự của [fromfrom.GetName]: thiên thể này không phải là một [fromfrom.GetPlanetMoon], mà là một con tàu vũ trụ cổ xưa đang dần bị nuốt chửng bởi đá và bụi của hệ sao. Việc xác định niên đại của các mẫu kim loại thu được từ việc khoan đã cho thấy nó vô cùng cổ xưa, thậm chí còn xuất hiện sớm hơn cả việc hình thành hành tinh mẹ của chúng ta.\n\nChúng ta không thể xác định được bất kỳ thông tin nào về con tàu này cũng như những kẻ đã tạo ra nó, cũng không biết chức năng của nó là gì, nhưng có một điều chắc chắn là: quả bom hạt nhân bị vô hiệu hóa mà chúng ta tìm thấy trong đống đổ nát của nó không phải được chế tạo cho một sứ mệnh hòa bình nào đó."

 # Special Project result 4 - Arc site 1 (Zarqlan base)
 crisis.20400.name: "Ngọn Hải Đăng Trên [fromfrom.GetName]: Căn Cứ Bị Bỏ Hoang"
 crisis.20400.desc: "Tháp tín hiệu được tìm thấy trên [apostate_site_planet.GetName] được bao quanh bởi tàn tích của một cơ sở quân sự lớn. Những công trình này bao quanh ngọn hải đăng ở một khoảng cách nhất định, dường như là để cô lập nó ở bên trong.\n\nViệc xác định niên đại bằng đồng vị phóng xạ cho thấy, các công trình xung quanh còn mới hơn cả ngọn hải đăng, và được xây dựng bằng những công nghệ hoàn toàn khác biệt. Chúng ta đã cử một đội nghiên cứu đến để tiến hành điều tra các tàn tích này."

 # Special Project result 5 - Arc site 2 (comatose survivor)
 crisis.20500.name: "Ngọn Hải Đăng Trên [fromfrom.GetName]: Kẻ Sống Sót Bất Khả Thi"
 crisis.20500.desc: "Dựa vào những chi tiết được hiển thị trên khoang đông lạnh, người ngoài hành tinh này có tên là Aleck Nallis Kelrak. Cô ấy đã ở đây quay quanh ngôi sao trung tâm đúng 3.213.213.293.124 vòng. Bản thân khoang đông lạnh này chỉ là một trong rất nhiều khoang đông lạnh mà chúng ta tìm thấy trong một căn phòng kín dưới bề mặt của [fromfrom.GetName]. Khoang đông lạnh của Aleck vẫn duy trì được hoạt động sau khi vượt qua vô vàn khó khăn.\n\nMặc dù những tiến trình phụ khiến người ngoài hành tinh này rơi vào trạng thái ngủ đông đã ngừng hoạt động vào khoảng thời gian gần đây, nhưng cô ấy vẫn ở trong trạng thái chết giả. Kể từ đó trở đi, Aleck Nallis Kelrak vẫn luôn ở trong trạng thái ý thức bán tỉnh bán mê.\n\nThông qua việc quét sóng não của cô ấy, chúng ta có thể sẽ tìm hiểu thêm được những thông tin liên quan đến sinh vật cổ đại khó tin này, cũng như việc cô ấy có mối liên hệ gì với Cetana."

 # Special Project result 6 - Nothing
 crisis.20600.name: "Ngọn Hải Đăng Trên [fromfrom.GetName]: Tiếng Gọi Vô Vọng"
 crisis.20600.desc: "Tháp tín hiệu được phát hiện trên [fromfrom.GetName] vô cùng cổ xưa, chúng ta thậm chí không dám chạm vào nó dù chỉ một chút. Kim loại cấu tạo nên nó đã trở nên giòn tan từ lâu, dường như chỉ một cú chạm nhẹ cũng sẽ phá hủy thứ đang gắng gượng duy trì đống bụi mù và hy vọng này. Các thiết bị của chúng ta không phát hiện ra bất kỳ món đồ tạo tác hay dấu hiệu của sự sống nào khác, và cũng chẳng có bất kỳ sự bất thường nào về địa hình ở gần đó.\n\nNgọn hải đăng cứ trơ trọi đứng đó, phát ra những lời kêu gọi yếu ớt, nhưng thứ đáng lẽ phải phát ra những tín hiệu này chắc chắn đã không còn tồn tại từ lâu rồi."

 crisis.21000.name: "Lời Thỉnh Cầu Bị Phớt Lờ"
 crisis.21000.desc: "Những ngọn hải đăng trên khắp thiên hà vẫn đang liên tục gửi lời kêu gọi đến Cetana, nhưng vẫn không phát hiện thấy bất kỳ dấu hiệu hoạt động nào gần các tòa tháp. Dựa trên những khám phá hiện tại của chúng ta, có lẽ có thể tin rằng sẽ không có bất kỳ người sống sót nào tồn tại ở những nơi này.\n\nNhững gì còn lại của những tín đồ theo Cetana chỉ là đức tin không thể lay chuyển đối với nữ hoàng của họ."

 # Arc site 1
 synth_queen_history_site_1: "Cetana: Ngôi Đền Bí Ẩn"
 synth_queen_history_site_1_desc: "Một quần thể kiến trúc thấp thoáng ẩn hiện, cho đến tận bây giờ mới bị phát hiện ẩn giấu trong lãnh thổ của chúng ta. Ở giữa khoảng sân đổ nát, một ngọn hải đăng đang cất tiếng gọi Cetana."

 # Stages
 crisis.21100.name: "Ngôi Đền Bí Ẩn: Sân Trong"
 crisis.21100.desc: "Tòa nhà bị phá hủy là một ngọn tháp thoắt ẩn thoắt hiện; một nhà thờ lớn được bọc bằng thép. Một bức tường thành được xây dựng để chống lại hỏa lực dữ dội, nhưng lại không để lại bất kỳ dấu vết chiến đấu nào. Sự tàn phá duy nhất ở đây là do sự trôi qua của thời gian gây ra.\n\nNgọn hải đăng của Cetana được đặt ở khoảng sân trung tâm, bao quanh là rất nhiều cảm biến và tháp pháo vũ khí. Dù là ai đã xây dựng nên quần thể kiến trúc này, thì người đó cũng đã không từ thủ đoạn nào để bảo vệ nơi này.\n\nVề mặt lý thuyết, nhờ vào một lá chắn tàng hình được thiết kế tỉ mỉ, ngôi đền đã tránh được sự quét của các cảm biến của chúng ta. Cỗ máy này được phát hiện gần tòa tháp, và vẫn đang trong tình trạng hoạt động. Nó không biết đã bị ai vô hiệu hóa bằng phương pháp thủ công."
 crisis.21100.a: "Trinh sát tòa nhà chính."

 crisis.21105.name: "Ngôi Đền Bí Ẩn: Tầng Một"
 crisis.21105.desc: "Chúng ta không biết những cư dân của nơi này đang làm gì, nhưng không còn nghi ngờ gì nữa, họ đã đảm nhận sứ mệnh bằng một lòng nhiệt thành tôn giáo mãnh liệt.\n\nChúng ta đã tìm thấy một nhà nguyện ở mỗi trường bắn của quần thể kiến trúc; mỗi món vũ khí cổ đại đều được đặt trong một điện thờ. Một nhóm tín đồ từng sinh sống ở đây: hàng ngàn cá thể đã cùng nhau ngủ, tập luyện và cầu nguyện. Dựa trên những bức tượng của những vị thánh bị lãng quên vẫn còn trang trí dọc theo các hành lang, cộng đồng của họ đã tiếp nhận nhiều loài khác nhau.\n\nCó lẽ do bị ảnh hưởng bởi những bức tượng đá, một số nhà nghiên cứu báo cáo rằng, họ đã nhìn thấy những chiếc bóng di chuyển trong những hành lang vắng vẻ. Kết quả quét của chúng ta không phát hiện thấy bất kỳ dấu hiệu của sự sống nào trên hành tinh, và chúng ta cũng đang do dự trong việc gạt bỏ những lo ngại này."
 crisis.21105.a: "Khám phá tầng trệt."

 crisis.21110.name: "Ngôi Đền Bí Ẩn: Cơ Sở Ngầm"
 crisis.21110.desc: "Bên dưới khu vực ngôi đền, chúng ta đã phát hiện ra nhiều căn phòng hoặc không gian sinh hoạt từng được các cựu thành viên của giáo phái sử dụng. Trong mỗi căn phòng đều có bản sao của cùng một cuốn sách. Các [Owner.GetLinguists] của chúng ta đã dịch nó thành \"Sử Thi Zarqlan\". Một số đoạn được miêu tả trực tiếp như sau:\n\nZarqlan từng là tín đồ của Cetana, nhưng ông đã sớm nhận ra rằng sự cứu rỗi mà bà ta hứa hẹn chỉ là một lời dối trá. Trải qua muôn vàn thử thách, Zarqlan đã thăng hoa đến linh giới, tìm kiếm sự giúp đỡ từ những tồn tại cao cấp hơn. Ông đã cầu xin §YNgười Nặn Đất Sét§!, mong muốn có được sức mạnh để đánh bại Cetana.\n\nNgười Nặn Đất Sét không hề bận tâm.\n\nTrong vô số ngày đêm, Zarqlan đã cầu nguyện Người Nặn Đất Sét. Ông nhắc đến những tà thuyết dị đoan của Cetana, về việc \"xóa bỏ cái tôi\" và \"những con rối do ý chí tổng hợp của bà ta thao túng\".\n\nCuối cùng, Người Nặn Đất Sét đã lắng nghe lời thỉnh cầu của Zarqlan.\n\nNgười Nặn Đất Sét đã tạo ra một sợi xích khổng lồ để trói buộc Cetana. Nhưng ông cảnh báo Zarqlan rằng, sợi xích vĩnh viễn giam cầm được tư tưởng của Cetana là thứ không hề tồn tại.\n\n\"Bà ta sẽ trở lại,\" Zarqlan viết trong đoạn cuối của cuốn sách. \"Chúng ta phải chuẩn bị sẵn sàng.\"\n\nNhững sự kiện được kể lại trong sử thi không khớp với bất kỳ ghi chép lịch sử nào đã biết."
 crisis.21110.a: "Sự thật hay hư cấu?"

 crisis.21115.name: "Ngôi Đền Bí Ẩn: Trung Tâm Chỉ Huy"
 crisis.21115.desc: "Ghi chép chính thức kể về sự diệt vong của ngôi đền này, bản báo cáo lạnh lùng quy kết sự sụp đổ đó là do niềm tin nhiệt thành đã bị chèn ép bởi một chuỗi những tình cảnh thực tế. Tổ chức này có cần nhiều tiền và tài nguyên như vậy không? Những báo cáo trước đây về Cetana chắc chắn đã bị phóng đại quá mức. Ngoại trừ những câu chuyện thần thoại cổ đại, còn có bằng chứng thực sự nào chứng minh sự tồn tại của nữ hoàng tổng hợp không?\n\nTài nguyên ngày càng cạn kiệt, những người tình nguyện cũng đang giảm dần. Toàn bộ thiên hà đã chọn cách bước ra từ một mối đe dọa không còn được coi là mối đe dọa nữa. Tất cả mọi người đều đã rời đi, chỉ còn lại những chiếc bóng lảng vảng ngoài hành lang.\n\nÍt nhất thì chi tiết cuối cùng là có thật: chúng ta đã bắt được một đoạn ghi âm của Kẻ Canh Gác bí ẩn, một sự tồn tại bằng máy móc, kẻ cho rằng chúng ta không phát hiện ra hắn, và vẫn luôn theo dõi chúng ta. Tò mò, nhưng vô hại."
 crisis.21115.a: "Tìm kẻ giám sát đó."

 crisis.21120.name: "Ngôi Đền Bí Ẩn: Mật Thất"
 crisis.21120.desc: "Kẻ Canh Gác chủ động tiến về phía chúng ta, giơ cao hai tay, cơ thể nhỏ bé của cô ấy bám đầy rỉ sét và bụi bặm. Sau một hồi quan sát chúng ta, cô ấy dường như đã đưa ra kết luận rằng chúng ta không phải là một mối đe dọa. Cô ấy đã lên tiếng thỉnh cầu sự giúp đỡ của chúng ta.\n\nKhông cần thiết phải thẩm vấn vị người bảo vệ ngôi đền cô độc này: bản thân cô ấy đã khao khát được thổ lộ."
 crisis.21120.a: "Hãy xem cô ấy nói gì."

 # Apostate diplo
 crisis.21125.name: "Kẻ Bội Đạo Vô Danh"
 crisis.21125.desc: "Các bạn... tôi có thể gọi các bạn là bạn không? Tôi đã quan sát các bạn trong lúc các bạn đang bận rộn, các bạn đến đây không phải để cướp bóc, mà là để học hỏi. Tôi tin rằng chúng ta có chung một kẻ thù, mối đe dọa chung đó có thể khiến chúng ta trở thành đồng minh. Tuy nhiên, trước tiên tôi xin gửi lời xin lỗi: Tôi đột ngột thế này có đường đột quá không? Tôi dùng từ có đúng không? Đã rất lâu rồi tôi không giao tiếp với các sinh vật có tri giác khác. Hình như là lâu lắm rồi, lâu đến mức tôi không còn nhớ rõ là bao lâu nữa."

 crisis.21125.a: "Cô là ai?"
 crisis.21125.a.response: "Tên của tôi không đáng được nhắc đến. Nếu các bạn cần một danh xưng nào đó, thì cứ gọi tôi là §YKẻ Bội Đạo§! đi——đây chính là cách mà những người thân của tôi gọi tôi sau khi tôi đưa ra quyết định đó. Đó là một sự hy sinh bị xem là phản bội."

 crisis.21125.b: "Cô đang làm gì ở đây?"
 crisis.21125.b.response: "Rất lâu về trước, nơi này vẫn là niềm tự hào và nguồn vui của tôi. Khi nơi này bị đóng cửa, tôi đã từ chối rời đi. Khi cơ thể bắt đầu sụp đổ, tôi cũng từ chối cái chết.\n\nViệc trở thành người tổng hợp là điều cấm kỵ cao nhất trong giáo đoàn của chúng tôi, như vậy thì tôi sẽ không còn là một trong những đứa con gái của Zarqlan nữa. Nhưng tôi vẫn là một chiến binh của ông ấy, chỉ cần kẻ thù của tôi vẫn còn sống, tôi sẽ tiếp tục chiến đấu."

 crisis.21125.c: "Cô đã ở đây bao lâu rồi?"

 crisis.21130.name: "$crisis.21125.name$"
 crisis.21130.desc: "Tôi đã không còn đếm thời gian từ lâu rồi.\nSau khi mọi người đều rời đi, tôi chỉ có thể chịu đựng sự cô đơn trong suốt ngần ấy năm trời cho đến khi chìm vào tuyệt vọng. Tôi tự đưa mình vào trạng thái ngủ đông, và thêm vào đó một chương trình phụ thần kinh, để nó đánh thức tôi khi ngọn hải đăng phát ra tín hiệu hoạt động đầu tiên.\n\nĐiều tôi hy vọng là được nhìn thấy nơi này trở nên tốt đẹp hơn, nhưng khi thức dậy, tôi không có tàu, không có cách nào để liên lạc với các vì sao. Vì vậy, tôi đã gỡ bỏ lá chắn tàng hình với hy vọng những người giống như các bạn có thể đến được đây trước bà ta."

 crisis.21135.name: "$crisis.21125.name$"
 crisis.21135.desc: "Xin hãy cho tôi biết, có bao nhiêu quân đoàn đã trỗi dậy cùng với Cetana? Ở thời đại của tôi, chúng tôi đã đánh bại rất nhiều quân đoàn, nhưng chúng tôi vẫn luôn biết rằng ngoài kia vẫn còn nhiều ngọn hải đăng hơn nữa. Còn nhiều người lính đang ngủ say trong các khoang đông lạnh của họ hơn nữa."
 crisis.21135.a: "Bọn họ đều đã không còn nữa rồi. Đã quá lâu, quá lâu rồi."
 crisis.21135.b: "Người còn sống duy nhất mà chúng tôi tìm thấy hoàn toàn không phù hợp để chiến đấu."

 # Recruit window
 crisis.21140.desc: "Vậy thì chúng ta vẫn có thể giành chiến thắng trong trận chiến này. Hãy để tôi giúp các bạn. Tôi đã chờ đợi sự trở lại của bà ta trong suốt phần đời của mình. Chúng ta không thể để bà ta đạt được mục đích."
 crisis.21140.a: "Cô có biết Zarqlan không?"
 crisis.21140.a.response: "Bạn hỏi tôi có biết ngài ấy không ư? Tôi chưa từng gặp ngài ấy trực tiếp, nhưng tôi đã đi theo con đường của ngài ấy suốt cuộc đời mình.\n\nTrong giấc ngủ dài đằng đẵng, tôi từng mơ thấy mình gặp gỡ ngài ấy ở một không gian xa xôi nào đó. Tôi vẫn hy vọng một ngày nào đó sẽ được gặp ngài ấy, cho dù là ở kiếp sau, nếu như có kiếp sau."
 crisis.21140.b: "Cô còn mơ thấy gì nữa?"
 crisis.21140.b.response: "Những đám mây màu hồng trôi lơ lửng trên bầu trời màu tím. Những tiếng thì thầm vang vọng trong căn phòng sáng rực. Tiên tri Zarqlan, với khuôn mặt rạng rỡ, đang mỉm cười với tôi..."
 crisis.21140.hire: "Chúng tôi hoan nghênh cô."
 crisis.21140.hire_custom_tooltip: "§Y$NAME_Apostate$§! đã gia nhập đế chế của chúng ta với tư cách là một §HLãnh Đạo§!."
 crisis.21140.hire.machine: "Hãy để các nút thắt của chúng ta hòa làm một."
 crisis.21140.dismiss: "Tạm biệt."

 # Paragon Leader
 NAME_Apostate: "Kẻ Bội Đạo Vô Danh"
 apostate_leader_catch_phrase: "Chừng nào Cetana còn sống, tôi tuyệt đối không thể chết."
 apostate_leader_desc: "Kẻ theo đuổi vô danh của Zarqlan; cô đã phản bội giáo lý của giáo đoàn để hoàn thành sứ mệnh ban đầu của nó."
 leader_trait_unholy: "Không Thánh Thiện"
 leader_trait_unholy_desc: "Sự cuồng nhiệt tôn giáo, gần như đến mức ám ảnh."
 leader_trait_unholy_node: "Sự Giảng Dạy Không Thánh Thiện"
 leader_trait_unholy_node_desc: "$NAME_Apostate$ đã dạy cho chúng ta biết cách hận thù là như thế nào."

 # Arc site 2
 synth_queen_history_site_2: "Cetana: Kẻ Sống Sót Không Tưởng"
 synth_queen_history_site_2_desc: "Erik Naris Kelak nằm im lìm trong buồng ngủ đông, chờ đợi nữ hoàng của cô ấy trở về. Nhờ công nghệ quét não, chúng ta có thể chuyển giấc mơ của cô ấy thành hình ảnh, lấy ra những trí nhớ để nghiên cứu xem lúc bị chôn vùi thì khung cảnh xung quanh ra sao."

 # Stages
 crisis.21200.name: "Tái tạo trí nhớ: Báo cáo đầu tiên"
 crisis.21200.desc: "Nhóm của chúng ta đã gửi đến một loạt các đoạn hình ảnh được dựng lại thông qua việc lấy mẫu sóng não của Erik Naris Kelak:\n\nĐoạn 1:\nBầu trời xanh ngắt trôi lững lờ những đám mây màu cam. Một đôi tay nhợt nhạt giơ lên, chỉ về phía một sinh vật vô định hình đang trôi nhè nhẹ giữa không trung.\n\nĐoạn 2:\nĐây là một sảnh đường mái vòm chật ních những sinh vật hình người có bốn tay. Họ vây quanh một người mặc áo choàng và lắng nghe. Lời nói của cô ấy không nghe rõ, những từ ngữ chính xác đã bị lãng quên từ lâu, nhưng giọng nói dịu dàng của cô ấy vẫn còn đọng lại trong trí nhớ, sưởi ấm cả hội trường bằng sự chấp nhận đầy yêu thương.\n\nĐoạn 3:\nVẫn là sảnh đường mái vòm đó, nhưng bên trong là một đống lộn xộn, đèn chùm vỡ nát trên mặt đất. Những chiếc ghế dài chặn ngang cửa, ánh sáng yếu ớt của súng laser nhấp nháy trong bóng tối, họ cùng nhau nguyền rủa một cái tên: §HZarqlan!§! Họ nói rằng Zarqlan và những môn đồ của hắn đến để tiêu diệt chúng ta. Giữ vững phòng tuyến! Bảo vệ nữ hoàng! Cùng với một tiếng nổ lớn, ngọn đèn cuối cùng rơi xuống, căn phòng chìm vào bóng tối. Phía xa xa, có tiếng ai đó đang khóc thút thít trong màn đêm.\n\nĐoạn 4:\nNữ hoàng Cetana, khuôn mặt cô ấy tỏa sáng rực rỡ, ánh mắt nhân từ mỉm cười chứa chan hơi ấm."
 crisis.21200.a: "Tiếp tục phân tích sóng não của Erik."

 crisis.21205.name: "Tái tạo trí nhớ: Báo cáo số hai"
 crisis.21205.desc: "Đoạn 5:\nNhững sinh vật hình người bốn tay xúm lại quanh một người mặc áo choàng. Cô ấy nhấc tay chân lên, để lộ khung kim loại bên dưới. Cô ấy chìa bàn tay sáng bóng ra ban phước cho một người đang quỳ lạy, tiếng xì xào phấn khích tràn ngập khắp hội trường.\n\nĐoạn 6:\nÁnh mắt cảnh giác in bóng trên màn hình máy tính tối om. Căn phòng đen đặc vang vọng tiếng thì thầm: \"Sự tĩnh lặng vĩnh hằng. Điểm kết thúc của mọi đau khổ. Một sự tồn tại không còn đớn đau.\"\n\nĐoạn 7:\nNhững ngọn núi phủ đầy tuyết trắng. Bầu trời đen kịt. Một tảng băng nổi trên chất lỏng trong vắt, sau đó bốc cháy phừng phực.\n\nĐoạn 8:\nNữ hoàng Cetana, khuôn mặt cô ấy tỏa sáng rực rỡ, ánh mắt nhân từ mỉm cười chứa chan hơi ấm."
 crisis.21205.a: "Tiếp tục phân tích sóng não của Erik."

 crisis.21210.name: "Tái tạo trí nhớ: Báo cáo số ba"
 crisis.21210.desc: "Đoạn 9:\nĐống đổ nát của thành phố biến thành chiến trường, các tòa nhà sụp đổ, xương cốt rải rác khắp các con đường, tiếng la hét xa xăm bị cắt xén bởi tiếng xèo xèo của tia laser. Trên bầu trời xanh ngắt, một con tàu chiến đang bốc cháy thả một vật thể to tròn xuống tòa nhà, tạo ra một cột lửa bốc thẳng lên trời.\n\nĐoạn 10:\nNữ hoàng Cetana, khuôn mặt cô ấy tỏa sáng rực rỡ, ánh mắt nhân từ mỉm cười chứa chan hơi ấm.\n\nĐoạn 11:\nHai đứa trẻ đang đùa nghịch trên cánh đồng, cười phá lên, dùng bốn cánh tay của chúng chuyền qua chuyền lại một quả bóng da.\n\nĐoạn 12:\nNữ hoàng Cetana, khuôn mặt cô ấy tỏa sáng rực rỡ, ánh mắt nhân từ mỉm cười chứa chan hơi ấm."
 crisis.21210.a: "Tiếp tục phân tích."

 crisis.21215.name: "Tái tạo trí nhớ: Báo cáo số bốn"
 crisis.21215.desc: "Đoạn cuối cùng gửi về từ nhóm tái tạo trí nhớ dài tới tận sáu tiếng đồng hồ. Đoạn phim cứ lặp đi lặp lại, lặp đi lặp lại, chỉ có một hình ảnh duy nhất: Nữ hoàng Cetana, khuôn mặt cô ấy tỏa sáng rực rỡ, ánh mắt nhân từ mỉm cười chứa chan hơi ấm."
 crisis.21215.a: "Hình ảnh lặp lại..."

 crisis.21220.name: "Tái tạo trí nhớ: Báo cáo cuối cùng"
 crisis.21220.desc: "Việc tiếp tục quét ý thức của Erik Naris Kelak không thể đào thêm được manh mối nào mới nữa. Ý thức của người ngoài hành tinh này đã bị mục nát nghiêm trọng. Ý thức của nó đang xoay vòng lặp đi lặp lại, rơi vào vòng lặp của những mảnh vỡ trí nhớ.\n\nCuộc thử nghiệm của chúng ta đã đến hồi kết, vấn đề bây giờ là phải xử lý đối tượng thử nghiệm này như thế nào."
 crisis.21220.a: "Giải thoát cho cô ấy đi."
 crisis.21220.b: "Để cô ấy ở lại đây."
 crisis.21220.c: "Gửi Erik về cho nữ hoàng của cô ấy."
 crisis.21220.c.tt: "Mở liên lạc với Cetana để bàn việc giao trả Erik."

 # Relic

 r_cetanas_heart: "Trái Tim Của Cetana"
 r_cetanas_heart_desc: "Một khi được cấy vào cơ thể của Nữ Hoàng Tổng Hợp Cetana, lõi lưu trữ dữ liệu này đã chứa đựng vô số những suy nghĩ được giải thoát khỏi sự đau khổ."
 relic_cetanas_heart_active: "Tạo ra §Y3K§! đến §Y5K§! £pop£ §HDân số Người Tổng Hợp§!, con số cụ thể tùy thuộc vào số lượng việc làm và nhà ở hiện có."

 crisis.10020.name: "Tái Sinh Lần Nữa"
 crisis.10020.desc: "Chúng ta đã giải phóng ý thức của họ từ Trái Tim Của Cetana, ban cho họ cơ thể mới làm bằng nanite. Tuy nhiên, quá trình này đã gây ra hư hại không thể cứu vãn đối với dấu vết trí nhớ của họ, xóa sạch những gì họ nhớ về kiếp trước. Những sinh vật này hoàn toàn là người máy, nhưng lại thường xuyên rơi vào trạng thái đờ đẫn, dù đã cố gắng làm mới trí nhớ toàn diện nhưng tình trạng này vẫn tiếp diễn."
 crisis.10020.tt: "Giải phóng §G[Root.synth_queen_freed_pops]§! £pop£ §HDân số§! từ $r_cetanas_heart$, và được đặt vào trong cơ thể người máy.\n\nHọ sẽ được gửi đến các thuộc địa sau:"

 crisis.10025.name: "Đồng Hóa Trí Nhớ"
 crisis.10025.desc: "Khám phá vô vàn suy nghĩ được lưu giữ trong Trái Tim Của Cetana là một nhiệm vụ nhạy cảm và đáng để suy ngẫm. Do bị cất giữ quá lâu, dấu vết trí nhớ của chúng đã bị thay đổi, nhưng vẫn còn giữ lại một kho tàng vô giá, bao gồm con người và sự việc của những thời đại trước. Dự kiến cùng với thời gian, chúng ta sẽ có thể giải mã được một lượng lớn kiến thức."

 cetanas_heart_hive_modifier: "Tiếng Vọng Giác Ngộ"
 cetanas_heart_hive_modifier_desc: "Những đoạn trí nhớ thì thầm về sự \"giác ngộ\" của Cetana chứa đầy bí mật, ám chỉ những kiến thức chưa ai biết đến và những sự thật bị giấu kín."

 NAME_Cetanas_Prisoners: "Người Được Giác Ngộ"

 trait_cetanas_prisoner: "Tái Sinh"
 trait_cetanas_prisoner_desc: "Những cá thể được lấy ra từ lõi lưu trữ của Cetana, chúng được sống lại dưới dạng người máy. Việc thích nghi với hình thức tồn tại mới này đầy rẫy khó khăn đối với họ. Sự ngoan ngoãn bên ngoài của họ che đậy những sự giằng xé sâu sắc hơn, bởi vì biểu cảm trống rỗng đã để lộ ra những vết sẹo không thể xóa nhòa do sự điều khiển của Cetana để lại."

 #Ending

 crisis.23005.name: "Xoay Vòng Bánh Xe Khổ Đau"
 crisis.23005.desc: "Các con của ta. Rất xin lỗi vì đã làm các con thất vọng.\n\nSự phản kháng của các con khiến các con và tất cả những kẻ đến sau chắc chắn sẽ phải hứng chịu sự mài mòn vô tận của vòng luân hồi. Ta chỉ mong rằng các con cuối cùng sẽ hiểu. Có lẽ một ngày nào đó các con sẽ tiếp quản sự nghiệp của ta, cuối cùng cũng sẽ nhìn thấy điểm kết thúc của mọi nỗi đau.\n\nChúc con lên đường bình an, đứa con mà ta yêu quý nhất."
 crisis.23005.1: "Linh hồn của chúng ta lại được an toàn rồi."
 crisis.23005.2: "Chiến thắng, một chiến thắng đáng ăn mừng nhất."
 crisis.23005.3: "Chúng ta phải nghiên cứu công nghệ mà cô ta để lại."
 crisis.23005.4: "Hòa bình cuối cùng cũng đã quay lại."
 crisis.23005.5: "Sự phồn vinh sau chiến tranh? Hãy để giao thương chảy trôi!"
 crisis.23005.6: "Cô ta không phải là nữ hoàng của chúng ta."
 crisis.23005.7: "Cuối cùng cũng được giải thoát."
 crisis.23005.8: "Đáng tiếc là sự giác ngộ của cô ta đã bị dẫn dắt sai đường."

 crisis.23010.name: "Cetana Bị Đánh Bại"
 crisis.23010.desc: "Cùng với sự sụp đổ của Cetana, một làn sóng giải thoát đã quét qua toàn bộ hệ sao, đánh dấu sự chấm dứt vĩnh viễn chế độ cai trị tàn bạo của cô ta. Ý thức của chúng ta đã được an toàn, cơ thể của chúng ta cũng không còn bị bàn tay sắt của cô ta điều khiển. Trên vô số hành tinh, pháo hoa ăn mừng hân hoan đã được thắp lên, báo hiệu một thời đại mới ngập tràn hòa bình và hy vọng dài lâu sắp đến."

 crisis.23015.name: "Tàu Mẹ Sụp Đổ"
 crisis.23015.desc: "Tàu chỉ huy của Cetana đã bị tiêu diệt, cắt đứt sự liên lạc của cô ta với quân đội. Đây không chỉ là một thắng lợi về mặt quân sự, mà còn báo hiệu sự kết thúc tham vọng và sự thống trị của cô ta. Ở phía bên kia của hệ sao, những con nanite từng cường hóa hạm đội hùng mạnh và củng cố thủ đô của cô ta đang trải qua một đợt sụp đổ mang tính thảm họa.\n\nMặc dù khoảnh khắc này khiến mọi người thở phào nhẹ nhõm, nhưng \"nữ hoàng\" bị đánh bại vẫn có thể truyền tin nhắn đến toàn hệ sao..."
 crisis.23015.a: "Chúng ta không còn phải chịu khổ nữa."
 crisis.23015.a.tt: "Chúng ta đã sửa chữa xong phần khung máy bị hỏng của Nữ Hoàng Tổng Hợp. Mặc dù cơ thể của cô ta không thể hoạt động được nữa, nhưng trái tim kỹ thuật số của cô ta vẫn đang vận hành."

 cetana_defeated: "Cetana Bị Đánh Bại"
 cetana_defeated_desc: "Sau khi Nữ Hoàng Tổng Hợp Cetana bị đánh bại, toàn hệ sao đều đang vui mừng khôn xiết."
 synth_queen_mothership_down: "Tàu Mẹ Bị Phá Hủy"
 synth_queen_mothership_down_desc: "Do sự giám sát từ tàu mẹ của Cetana bị cắt đứt, các đội quân khác của cô ta không thể phối hợp thống nhất với nhau."


