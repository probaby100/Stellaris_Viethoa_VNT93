 cybercreed_forced_cyberization_desc: "Những người không theo đạo trong xã hội không muốn bị ép buộc phải tiếp nhận sự dung hợp thần thánh."
 cybercreed_allowed_non_cyborgs: "Tự Do Lựa Chọn"
 cybercreed_allowed_non_cyborgs_desc: "Xã hội của chúng ta cho phép những người không sùng đạo tiếp tục sống mà không cần phải thực hiện các nâng cấp thần thánh. Điều này tạo ra một môi trường dư luận tốt cho tôn giáo."

