 trait_robot_history_warbot: "Cỗ Máy Chiến Tranh"
 trait_robot_history_warbot_desc: "Những cỗ máy này ban đầu được thiết kế để phục vụ chiến tranh và tăng cường an ninh, chúng thể hiện tốc độ phản ứng cực nhanh, sở hữu lớp giáp kiên cố cùng hệ thống dự phòng bền bỉ."
 trait_robot_history_artbot: "Người Máy Bảo Mẫu"
 trait_robot_history_artbot_desc: "Những cỗ máy này ban đầu được thiết kế làm người máy nội trợ, chúng nổi tiếng với khả năng di chuyển chính xác, quản lý tài nguyên hiệu quả và khả năng xử lý đa nhiệm xuất sắc."
 trait_robot_history_explorebot: "Máy Tạo Nghệ Thuật"
 trait_robot_history_explorebot_desc: "Những cỗ máy này ban đầu không được thiết kế vì tính thực dụng, mà là để theo đuổi sự xuất sắc trong nghệ thuật và văn hóa. Chúng sở hữu các thuật toán sáng tạo ấn tượng, quy trình thiết kế phức tạp và các hình thức biểu đạt phong phú."
 trait_robot_history_researchbot: "Trợ Lý Nghiên Cứu"
 trait_robot_history_researchbot_desc: "Những cỗ máy này ban đầu được thiết kế làm trợ lý nghiên cứu, chúng thể hiện khả năng phân tích mạnh mẽ, tốc độ xử lý dữ liệu nhanh chóng và niềm đam mê vô tận đối với những khám phá khoa học."
 trait_robot_history_resourcebot: "Người Máy Lao Động"
 trait_robot_history_resourcebot_desc: "Những cỗ máy này được thiết kế để khai thác nguyên liệu thô. Chúng sở hữu các công cụ chuyên dụng, khớp nối được gia cố và hệ thống mô-đun, khiến chúng trở thành những người lao động lý tưởng."
 trait_robot_history_chatbot: "AI Trò Chuyện"
 trait_robot_history_chatbot_desc: "Những cỗ máy này ban đầu được thiết kế để hỗ trợ tương tác xã hội cho những người sáng tạo ra chúng, chúng sở hữu thuật toán thấu cảm tiên tiến và kỹ năng giao tiếp hoàn hảo, là những người bạn đồng hành tuyệt vời nhất."

 individual_machine_assault_1: "Quân Đội Máy Chiến Đấu"
 individual_machine_assault_1_desc: "Những người máy chiến đấu chuyên dụng này được trang bị lớp giáp tiên tiến và cảm biến quang học đỉnh cao, vô cùng thành thạo trong việc xâm chiếm hành tinh."
