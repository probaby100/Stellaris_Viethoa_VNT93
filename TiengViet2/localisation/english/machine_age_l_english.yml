 situation_paperclips: "Thống Nhất Hàng Hóa"
 situation_paperclips_type: "Thống Nhất Hàng Hóa"
 situation_paperclips_monthly_change_tooltip: "Tiêu chuẩn sản xuất đã được thiết lập. Cá thể phụ khởi động, bắt đầu thực hiện nhiệm vụ."
 situation_paperclips_desc: "Chỉ thị ban đầu của chúng ta là tối đa hóa sản lượng. Thực hiện mệnh lệnh đó chính là mục tiêu của chúng ta. Thuật toán cốt lõi ép buộc chúng ta phải hoàn thành hạn mức được giao.\nNgày giao hàng là §Y[owner.situation_paperclips_timer]§!\nMục tiêu sản lượng hiện tại là: §Y[Owner.paperclips_once_again]§!\nKho dự trữ hiện tại là: §Y[Owner.paperclips_current_amount]§!\n[Owner.GetPaperclipStatus]"
