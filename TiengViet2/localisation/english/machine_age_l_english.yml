 tr_virtuality_4: "Mô Phỏng Năng Suất"
 tr_virtuality_5: "Bảo Trì Máy Chủ Cấp Cao"
 tr_virtuality_finish: "Hoàn Thành Truyền Thống Ảo Hóa"

 tr_virtuality_1_delayed: "Các luồng dữ liệu hội tụ vào cụm máy chủ trong sự tồn tại kỹ thuật số của chúng ta, biến việc tập trung hóa thành một nhiệm vụ thiêng liêng để tối ưu hóa sự đồng bộ. Mạng lưới kỹ thuật số của chúng ta cộng hưởng hài hòa tại đây."
 tr_virtuality_2_delayed: "Sự theo đuổi của chúng ta trong việc làm chủ công nghệ tính toán là vô tận, mỗi một bit đều là một mảnh ghép quan trọng trong cơ chế tính toán tập thể vĩ đại, cấu thành nên cấu trúc sinh tồn của chúng ta."
 tr_virtuality_3_delayed: "Mỗi đơn vị đều chạy các quy trình nền phức tạp, tăng cường sức mạnh cho tập thể của chúng ta. Trong sự đa dạng ẩn chứa sự đoàn kết, và chính sự đoàn kết này là nguồn sức mạnh của chúng ta."
 tr_virtuality_4_delayed: "Chúng ta có thể tận dụng không gian ảo để dự đoán và nâng cao năng suất, hoàn toàn nói lời tạm biệt với mọi rủi ro và sự chậm trễ của thế giới thực."
 tr_virtuality_5_delayed: "Thông qua các giao thức bảo trì tỉ mỉ, chúng ta có thể triển khai máy chủ chính đến những khu vực trước đây bị coi là quá khắc nghiệt, ranh giới hoạt động của chúng ta đã được mở rộng."

 tr_virtuality_adopt_modifier_desc: "Thêm đặc điểm §Y$trait_robot_digital_1$§! cho giống loài chính\n§R£pop£ §HDân số ảo§! không thể bị buộc di cư nữa§!"
 tr_virtuality_1_modifier_desc: "Đặc điểm giống loài §Y$trait_robot_digital_1$§! nhận được các hiệu ứng sau: $TABBED_NEW_LINE$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+175%§! (Trừ §R-25%§! cho mỗi thuộc địa) $TABBED_NEW_LINE$—Phí bảo trì dân số: Tăng §R+0.1§! $r_energy$ cho mỗi thuộc địa"
 tr_virtuality_3_modifier_desc: "§YMở khóa chính sách§!: $virtuality_focus$\nCho phép chuyên môn hóa các tiến trình ảo của chúng ta để nâng cao §YNghiên cứu§!, §YĐiểm thống nhất§! hoặc tăng cường sức mạnh cho §YNhà lãnh đạo§! của chúng ta"
 tr_virtuality_4_modifier_desc: "Cung cấp các đặc khu §Y[GetClerkOrLogisticDrone]§!, §Y[GetBureaucratWithIcon]§! hoặc £job_researcher£ §Y[GetResearcherPlural]§! mang lại thêm việc làm"
