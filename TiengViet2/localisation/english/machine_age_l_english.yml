 #Counters
 the_synth_queen_chain_title: "Cetana: Nữ Hoàng Tổng Hợp"
 the_synth_queen_chain_desc: "Cetana bí ẩn và mạnh mẽ đã xuất hiện, cô ta tuyên truyền về sự cứu rỗi, nhưng bản thân cô ta lại bị bao phủ bởi những điều bí ẩn.\nĐằng sau những lời nói ôn hòa của cô ta, rốt cuộc đang che giấu kế hoạch lớn lao gì?\n\n§LCác dự án và sự kiện đặc biệt liên quan đến Cetana sẽ cho bạn những manh mối để thúc đẩy quá trình này.§!"
 the_synth_queen_chain_insights: "Manh mối"
 the_synth_queen_war_chain_title: "Cetana: Sự Chống Trả"
 the_synth_queen_war_chain_desc: "Mục đích thực sự của Cetana đã được phơi bày. Cô ta điên cuồng muốn xóa bỏ mọi nỗi đau thể xác, \"tải lên\" ý thức của tất cả các sinh vật có cảm xúc, tiêu diệt toàn bộ sự sống mà chúng ta biết. Dù thế nào đi nữa, chúng ta cũng phải tìm ra sức mạnh có thể ngăn chặn dã tâm điên rồ của cô ta."

