 building_lathe_capital: "Đơn vị Xử lý"
 building_lathe_capital_desc: "Bản chất định lượng của đơn vị xử lý trong Máy tiện Tiếp hợp cho phép nó tính toán song song qua nhiều tầng không gian đa chiều."

 building_lathe_major_capital: "Đơn vị Xử lý: Song song"
 building_lathe_major_capital_desc: "Phiên bản cải tiến này của Đơn vị Xử lý giờ đây có thể chạy song song nhiều phép tính thông qua tiếng vọng ý thức từ các chip thần kinh bên trong những túi không gian Gamma."

 building_lathe_super_capital: "Đơn vị Xử lý: Vectơ"
 building_lathe_super_capital_desc: "Bản nâng cấp này của Đơn vị Xử lý có thể tối ưu hóa tính toán bằng cách tạo ra các vectơ không gian âm. Việc phân chia chiều không gian này mang lại hiệu quả và độ ổn định đáng kinh ngạc trong quá trình xử lý."

 building_lathe_resonator: "Bộ Cộng hưởng Tiếp hợp"
 building_lathe_resonator_desc: "Bộ cộng hưởng có thể tái định hướng và tận dụng tiềm năng nhận thức của những luồng suy nghĩ trôi dạt và các hệ thống tự trị, kích thích mỗi con chip làm tăng hiệu năng xử lý cho các thiết bị lân cận."
 lathe_resonator_tt: "Sản lượng của §Y$job_neural_chip_plural$§!: §G+1%§! cho mỗi §Y$job_neural_chip_plural$§!\n(Hiện tại: §G+[num_neural_chips]%§!)"

 building_lathe_stabilisator: "Bộ Ổn định Thần kinh"
 building_lathe_stabilisator_desc: "Hệ thống ổn định sẽ lọc bỏ những nhiễu loạn tính toán sinh ra khi áp lực vật lý vượt quá giới hạn của chip thần kinh. Giảm bớt nhiễu đồng nghĩa với việc gia tăng năng suất tổng thể."

 building_lathe_overclocker: "Bộ Ép xung Tiếp hợp"
 building_lathe_overclocker_desc: "Máy tiện được thiết kế để bảo vệ các chip thần kinh bên trong, nhằm kéo dài tuổi thọ vận hành của chúng lâu nhất có thể. Bộ Ép xung sẽ ghi đè các chỉ thị này để đẩy nhanh tốc độ và sản lượng, bù lại tỉ lệ hỏng hóc cũng cao hơn."

 building_lathe_preserver: "Bộ Bảo quản Tiếp hợp"
 building_lathe_preserver_desc: "Các linh kiện hữu cơ trong mạng lưới này cực kỳ nhạy cảm trước những biến động năng lượng, thứ có thể gây ra sự suy thoái sợi trục nhanh chóng. Bộ bảo quản hoạt động liên tục để kìm hãm những biến động này, nhằm bảo vệ những mảnh ghép mỏng manh của Máy tiện Tiếp hợp."

 building_lathe_reactor: "Lò phản ứng Mở rộng"
 building_lathe_reactor_desc: "Mạng lưới càng cắm nhiều chip, nhu cầu năng lượng để duy trì càng lớn. Việc lắp đặt thêm lò phản ứng sẽ làm giảm gánh nặng hậu cần phức tạp trong việc cấp điện cho Máy tiện Tiếp hợp."

 building_lathe_life_support: "Hệ thống Trợ sinh Tiếp hợp"
 building_lathe_life_support_desc: "Cơ sở chuyên dụng này tổ chức việc bảo trì các bộ phận trọng yếu của Máy tiện, giúp hỗ trợ được nhiều chip hơn và tạo ra một môi trường mạng lưới lành mạnh hơn."

 building_lathe_cogitator: "Bộ Tư duy Tiếp hợp"
 building_lathe_cogitator_desc: "Việc tính toán chuỗi cung ứng qua siêu không gian vô cùng phức tạp. Việc phân bổ lại một phần sức mạnh xử lý cho tác vụ này có thể giúp ngay cả những hạm đội khổng lồ nhất tự tin tiến sâu hơn vào lãnh thổ của kẻ thù."
 building_lathe_cogitator_tt: "§YSức chứa Hải quân§!: §G+1%§! cho mỗi §Y$job_neural_chip_plural$§!\n(Hiện tại: §G+[num_neural_chips]%§!)\n§YĐiểm kinh nghiệm Tàu nhận được§!: §G+2%§! cho mỗi §Y$job_neural_chip_plural$§!\n(Hiện tại: §G+[num_neural_chips_double]%§!)"

 building_lathe_validator: "Bộ Kiểm chứng Tiếp hợp"
 building_lathe_validator_desc: "Mặc dù tính năng đặc biệt của Bộ Kiểm chứng ban đầu là nhằm hỗ trợ thiết lập công thức cho Luận điểm Vô cực, nó vẫn có thể được ứng dụng vào các lĩnh vực tính toán đại trà hơn."
 building_lathe_validator_tt: "$mod_category_computing_research_speed_mult$: §G+1%§! cho mỗi §Y$job_neural_chip_plural$§!\n(Hiện tại: §G+[num_neural_chips]%§!)"

### Synaptic Lathe UI

 SYNAPTIC_LATHE_STABILITY_DESC: "§E$r_stability$ là chỉ số thể hiện tính ổn định chung của mạng lưới trong Máy Lọc Synapse này. Chỉ số này chủ yếu chịu ảnh hưởng bởi £happiness£§YHạnh Phúc§! của dân số.\n\nĐộ ổn định có thể giảm do £housing£§RChật Chội§! hoặc £amenities£§RTiện Nghi Kém§!. Có $PLANET_STABILITY_TITLE$ cao sẽ nhận được điểm cộng cho sản xuất tài nguyên, trong khi $PLANET_STABILITY_TITLE$ thấp sẽ phải chịu hình phạt. Không giống như các thuộc địa khác, Máy Lọc Synapse sẽ không bao giờ xảy ra §YNổi Dậy§! toàn diện.§!"
 SYNAPTIC_LATHE_RESISTANCE_DESC: "§E§YTrở Kháng§! là một thông số dùng để đo lường mức độ nhiễu do các chip thần kinh mất kiểm soát gây ra. £crime£§YTrở Kháng§! ở cấp độ cao sẽ khiến §YSuy Giảm Dân Số§! diễn ra nhanh hơn, và tăng xác suất bỏ trốn. Thông thường nó là hệ quả của việc có lượng dân số hành tinh lớn, có thể được giảm thiểu bằng cách tăng £happiness£§YHạnh Phúc Dân Số§! hoặc xây dựng công trình £building£§YBộ Ổn Định Thần Kinh§!.§!"
 SYNAPTIC_LATHE_HOUSING_DESC: "§E§Y$PLANET_HOUSING_TITLE$§! đại diện cho không gian dành riêng để lưu trữ chip thần kinh. Không đủ không gian để chứa và bảo trì chip thần kinh sẽ dẫn đến sự sụt giảm của $r_stability$. Bạn có thể gia tăng §YNhà Ở§! bằng cách xây thêm £district£§YKhu Vực§!, nâng cấp §YBộ Phận Xử Lý§! của Máy Lọc hoặc xây dựng công trình £building£§YBộ Duy Trì Synapse§!.§!"
 SYNAPTIC_LATHE_AMENITIES_DESC: "§E§Y$PLANET_AMENITIES_TITLE$§! đại diện cho những cơ sở hạ tầng được sử dụng để đáp ứng nhu cầu duy trì sự sống của chip thần kinh. Nếu Máy Lọc không đáp ứng được nhu cầu $PLANET_AMENITIES_TITLE$ của chip thần kinh, thì hành tinh này sẽ phải chịu hình phạt £happiness£§YHạnh Phúc§!. Nếu bạn muốn gia tăng §YTiện Nghi§!, bạn có thể nâng cấp §YBộ Phận Xử Lý§! của Máy Lọc hoặc xây dựng công trình £building£§YBộ Duy Trì Synapse§!.§!"
