# ARC WELDERS ORIGIN
##########################

 origin_arc_welders: "Thợ hàn Hồ quang"
 origin_arc_welders_desc: "Hành tinh của họ thì hoang vu, nhưng hệ sao quê hương lại chứa đầy kho báu. Để khai thác chúng, các công trình do những cỗ máy này xây dựng ngày càng trở nên khổng lồ. Ngày nay, một §H$tech_orbital_arc_furnace$§! hùng mạnh đã che khuất cả bầu trời, nhưng những bậc thầy kỹ sư này vẫn chưa hề thỏa mãn.\n\nThiên hà đang chờ đợi, với vô vàn khả năng vô tận. Chỉ có trí tuệ mới có thể vươn tới những vì sao."
 origin_tooltip_arc_builders_effects: "—['concept_mining_district', £district£ $district_mining_plural$] ban đầu của $HOMEWORLD$ được thay thế bằng ['concept_generator_district', £district£ $district_generator_plural$]$NEW_LINE$—$origin_tooltip_arc_builders_nomadic_effects$"
 origin_tooltip_arc_builders_negative_effects: "Kích thước $HOMEWORLD$ £planetsize£ 15$NEW_LINE$—$origin_tooltip_arc_builders_nomadic_negative_effects$"
 START_SCREEN_ARC_WELDERS: "Sự khai thác lâu dài đã khiến [Root.Capital.GetName] trở nên cằn cỗi. Nhưng bầu trời phía trên chúng ta vẫn ẩn chứa nguồn tài nguyên dồi dào, với tham vọng chỉ có thể sánh ngang bằng chính sự tài trí của chúng ta, giờ đây chúng ta đang tìm kiếm nguồn sống ngoài không gian.\n\nViệc xây dựng giai đoạn đầu của $tech_orbital_arc_furnace$ là một công trình vĩ đại, và tiềm năng của nó cũng vô cùng lớn. Bước tiếp theo rõ ràng là nâng cấp nó để vận hành hết công suất, bởi vì chúng ta cần khai thác tài nguyên trên phạm vi toàn hệ sao. Nhưng bên ngoài biên giới của chúng ta là gì? Có cơ hội khó tin nào đang chờ đợi những kỹ sư tài năng không?\n\nVới sự xuất hiện của du hành siêu quang tốc, các thiết kế của chúng ta không còn bị giới hạn trong một hệ sao đơn lẻ nữa. Toàn bộ thiên hà là bản vẽ của chúng ta, đã đến lúc bắt đầu sáng tác."
 origin_arc_welders_nomadic: "$origin_arc_welders$"
 origin_arc_welders_nomadic_desc: "Hạm đội của họ không ngừng di chuyển, nhưng lại phát hiện ra hệ sao mà mình đang dừng chân chứa đựng sự giàu có không thể chối từ. Để khai thác nó, các công trình do những cỗ máy này xây dựng ngày càng trở nên khổng lồ. Ngày nay, một §H$tech_orbital_arc_furnace$§! hùng mạnh đã bao quanh một hành tinh nóng chảy, nhưng những bậc thầy kỹ sư này vẫn chưa hề thỏa mãn.\n\nThiên hà đang chờ đợi, với vô vàn khả năng vô tận. Chỉ có trí tuệ mới có thể vươn tới những vì sao."
 origin_tooltip_arc_builders_nomadic_effects: "Có một ['concept_arc_furnace'] được xây dựng bao quanh một ['concept_pc_molten'] trong $HOME_SYSTEM$$NEW_LINE$—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_orbital_arc_furnace',£engineering_research£ $tech_orbital_arc_furnace$]$NEW_LINE$—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_mega_engineering', £engineering_research£ $tech_mega_engineering$] khi xây dựng Lò nung Hồ quang thứ hai"
 origin_tooltip_arc_builders_nomadic_negative_effects: "—$INITIAL_POPS$§R-300§!"
 START_SCREEN_ARC_WELDERS_NOMADIC: "Hạm đội của chúng ta chưa bao giờ bị giới hạn ở một hành tinh duy nhất, nhưng mức độ dồi dào tài nguyên của hệ sao này khiến chúng ta cần phải thiết lập một căn cứ lâu dài hơn tại đây. $tech_orbital_arc_furnace$ chính là giải pháp của chúng ta, một kỳ tích kỹ thuật biến năng lượng của hành tinh nóng chảy thành vật chất. Nâng cấp nó lên hình thái hoàn thiện là điều cốt yếu để thúc đẩy công cuộc bành trướng của chúng ta.\n\nNhưng tài nguyên mà một hệ sao có thể cung cấp là có hạn. Ở những nơi khác trong thiên hà, có lẽ vẫn còn những hành tinh nóng chảy khác đang chờ được khai phá, chúng ta phải tìm ra chúng và nâng cao hiệu suất.\n\nThiên hà chính là bản vẽ thiết kế của chúng ta, đã đến lúc bắt đầu hành động."

 concept_arc_furnace: "$orbital_arc_furnace_1$"
 concept_arc_furnace_desc: "$EFFECTS$$NEW_LINE$$orbital_arc_furnace_1_mod_tooltip$\n\n§L$tech_orbital_arc_furnace_desc$§!"

 concept_orbital_arc_furnace: "$tech_orbital_arc_furnace$"
 concept_orbital_arc_furnace_desc: "§IMở khóa Siêu kiến trúc:§! $orbital_arc_furnace_4$$DOUBLE_NEW_LINE$§L$tech_orbital_arc_furnace_desc$§!"

 concept_mega_engineering: "$tech_mega_engineering$"
 concept_mega_engineering_desc: "—$MOD_COUNTRY_RESOURCE_MAX_ADD$: §G+20000§!$NEW_LINE$—§I$UNLOCKS_FEATURE$§! Phục hồi Siêu kiến trúc$DOUBLE_NEW_LINE$§L$tech_mega_engineering_desc$§!"

 machine_age.3400.name: "Nhiên Liệu Của Lò Rèn"
 machine_age.3400.desc: "Ngay cả khi quan sát từ xa, [From.GetName] có vẻ cũng là một ứng cử viên lý tưởng. Sau khi chúng ta hoàn thành việc khảo sát hệ sao này, kết quả không còn gì để nghi ngờ: một hành tinh nóng chảy, một hành tinh khí khổng lồ, cùng với vô số tiểu hành tinh và vệ tinh—đây là vị trí lý tưởng để xây dựng một Lò Luyện Quang khác.\n\nBước tiếp theo chắc chắn là ra lệnh cho một tàu xây dựng bắt đầu công việc. Đã đến lúc châm ngòi cho lò rèn rồi."
 ideal_furnace_system_poi: "Hệ Sao Lò Rèn Lý Tưởng"
 ideal_furnace_system_name: "[From.GetName]"
 ideal_furnace_system_desc: "Hệ sao lý tưởng để xây dựng $tech_orbital_arc_furnace$ thứ hai."
 ideal_furnace_system: "Đã Xác Nhận Vị Trí Hệ Sao Lý Tưởng"
 ideal_furnace_chain_title: "Nhiên Liệu Của Lò Rèn"
 ideal_furnace_chain_desc: "Chúng ta đã xác định được hệ sao lý tưởng để xây dựng $tech_orbital_arc_furnace$ thứ hai."
 machine_age.3405.name: "Tầm Nhìn Đúc Kết"
 machine_age.3405.desc: "Lò Luyện Quang ở hệ sao mẹ của chúng ta là minh chứng tuyệt vời cho công nghệ, cũng là minh chứng cho tham vọng hùng vĩ và trí tuệ vô song của chúng ta. Ngày nay, trong hệ sao [from.GetName], lò rèn thứ hai đang hừng hực rực cháy giữa không gian hư không.\n\nCông trình này của chúng ta không chỉ tạo ra tài nguyên, mà còn mở ra cánh cửa dẫn đến việc xây dựng các dự án khổng lồ. Giờ đây chúng ta như đang đứng trên bờ vực thẳm, một chân trời rộng lớn đang từ từ mở ra trước mắt, cho phép chúng ta nhìn xa hơn nữa.\n\nGiới hạn duy nhất chính là trí tưởng tượng của chúng ta."

##########################
# SYNTHETIC FERTILITY
##########################
 #Event Chain
 synthetic_fertility_chain_title: "$origin_synthetic_fertility$"
 synthetic_fertility_chain_desc: "Chúng ta đã mất đi khả năng sinh sản. Trên hành tinh mẹ tràn ngập các trung tâm giáo dục bị bỏ hoang, các khu vui chơi không bóng người. Sự diệt vong do lão hóa chỉ còn là vấn đề thời gian. Hiện tại, chúng ta chỉ có thể đặt niềm hy vọng vào cơ sở dữ liệu lưu trữ nhân cách của mình.\n\nChúng ta phải phát triển các khung tổng hợp và bộ não positronic đủ phức tạp thì mới có hy vọng quay trở lại thế giới vật chất."

 #Origin Text
 origin_synthetic_fertility: "Sinh Sản Tổng Hợp"
 origin_synthetic_fertility_desc: "§RCẢNH BÁO: Vô hiệu hóa tất cả Con Đường Thăng Hoa ngoại trừ ['concept_synthetic_ascension'].§!\n\nGiống loài này từng có một xã hội phồn vinh, nhưng một loại bệnh di truyền mới đã tước đi khả năng sinh sản của họ. Đứng trước thảm họa diệt vong, họ không còn lựa chọn nào khác ngoài việc tìm kiếm sự cứu rỗi thông qua kỹ thuật số."
 origin_tooltip_synthetic_fertility_effects: "—$INITIAL_POPS$ §G+900§!$NEW_LINE$—$SPECIES_TRAITS$ ['concept_pathogenic_genes']\n—Hành Tinh Mẹ: $TABBED_NEW_LINE$—Quy mô: £planetsize£20$TABBED_NEW_LINE$—['concept_abandoned_cities', £blocker£$concept_abandoned_cities$]: +2$TABBED_NEW_LINE$—['concept_identity_repository',£building£$concept_identity_repository$]$TABBED_NEW_LINE$—['concept_abandoned_gene_clinic',£building£$concept_abandoned_gene_clinic$]$NEW_LINE$—Cục Diện: ['concept_identity_rescue']$NEW_LINE$—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_synth_ai']$NEW_LINE$—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_robotic_workers', £engineering_research£$tech_robotic_workers$]"
 origin_tooltip_synthetic_fertility_negative_effects: "—£pop£§HDân số§!: Đang diệt vong"
 START_SCREEN_SYNTHETIC_FERTILITY: "Những nỗ lực khám phá ban đầu của chúng ta về ý thức nhân tạo đã mang tính cách mạng, từ đó khai sinh ra một cộng đồng thuần kỹ thuật số, làm lu mờ ranh giới giữa thế giới vật chất và không gian ảo. Sự thành công vang dội đã khiến chúng ta tự mãn, tin tưởng rằng sẽ có vô số thế hệ con cháu để tiếp tục khám phá và sáng tạo.\n\nNhưng chúng ta đã nhầm.\n\nMã gen của chúng ta bị tấn công bởi một căn bệnh hoàn toàn mới, tước đi hoàn toàn khả năng sinh sản của chúng ta. Thậm chí các chuyên gia hàng đầu của chúng ta cũng không thể tìm ra phương pháp chữa trị, cùng với việc suy giảm dân số và sự già hóa, nỗi hoảng loạn ngày một dâng cao.\n\nBị đẩy đến bước đường cùng, chúng ta đã mở rộng không gian lưu trữ kỹ thuật số, tạo ra đủ \"không gian\" để lưu giữ nhân cách của mình. Nhưng đây có thực sự là hình thức tồn tại mà chúng ta mong muốn? Mối quan tâm của chúng ta hiện chuyển sang phát triển các cơ thể tổng hợp và bộ não positronic đủ phức tạp để có thể đưa bản thân trở lại thế giới thực."

