 # Galcom Resolutions
 resolution_galactic_focus_crisis_synth_queen: "Mục tiêu trọng tâm: Cetana"
 resolution_galactic_focus_crisis_synth_queen_desc: "Cetana là mối đe dọa đối với cả hệ sao. Nếu chúng ta không liên kết lại để ngăn cản cô ta, cô ta sẽ hủy diệt tất cả chúng ta. Chúng ta nên lấy việc đối phó với thảm họa này làm mục tiêu trọng tâm của cả hệ sao."
 resolution_galactic_focus_crisis_synth_queen_effect_success: "$resolution_galactic_focus_crisis_effect_success$"
 galactic_focus_crisis_synth_queen: "Đánh Bại Cetana"
