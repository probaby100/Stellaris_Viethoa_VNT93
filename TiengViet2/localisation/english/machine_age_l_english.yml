 trait_auto_mod_biological: "Hệ Gen Nghề Nghiệp"
 trait_auto_mod_biological_desc: "Chuỗi gen tiên tiến được trang bị các bộ kích hoạt ngoại di truyền thích ứng với nhu cầu nghề nghiệp, có thể điều chỉnh động quá trình biểu hiện gen dựa vào môi trường làm việc của người sở hữu."
 trait_auto_mod_cyborg: "Bộ Nâng Cấp Đa Năng"
 trait_auto_mod_cyborg_desc: "Cổng kết nối cắm và chạy đa năng cho phép thay thế các bộ nâng cấp theo nhu cầu, làm cho chức năng của chúng đồng bộ với những yêu cầu hoạt động hiện tại."
 trait_auto_mod_robotic: "Khung Thích Ứng"
 trait_auto_mod_robotic_desc: "Hệ thống tự động tái định cấu hình động này có thể điều chỉnh linh hoạt phần cứng theo yêu cầu hoạt động, nhằm tối ưu hóa hiệu suất cho đa dạng các nhiệm vụ khác nhau."
 trait_auto_mod_overtuned: "Sớm Nở Tối Tàn"
 trait_auto_mod_overtuned_desc: "Các bộ kích hoạt ngoại di truyền tiên tiến làm tăng cường hiệu suất thể chất và nhận thức tại nơi làm việc, đồng thời rút ngắn đáng kể tuổi thọ dự kiến. Dẫu sao thì, cháy hết mình trong rực rỡ còn hơn lụi tàn dần trong chậm chạp."
 concept_automodding_trait: "Đặc Điểm Tự Động Đổi"
 concept_automodding_traits: "Đặc Điểm Tự Động Đổi"
