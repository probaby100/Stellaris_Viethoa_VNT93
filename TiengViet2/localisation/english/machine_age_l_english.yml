 civic_individual_machine_predictive_analysis: "$civic_machine_predictive_analysis$"
 civic_individual_machine_predictive_analysis_desc: "Xã hội này rất thành thạo trong việc phân tích dự đoán thuộc phương pháp luận nghiên cứu, nhằm đảm bảo chỉ theo đuổi những manh mối có triển vọng nhất."
 councilor_individual_machine_predictive_analysis: "Chuyên Viên Phân Tích Phương Pháp"
 councilor_individual_machine_predictive_analysis_desc: "$councilor_individual_machine_predictive_analysis$ dẫn dắt những nỗ lực của chúng ta trong việc phân tích phương pháp luận nghiên cứu, đảm bảo rằng chúng ta chỉ tiến bước theo những manh mối hứa hẹn nhất."

 civic_individual_machine_warbots: "$civic_machine_warbots$"
 civic_individual_machine_warbots_desc: "Xã hội này không mệt mỏi tối ưu hóa quân đội, kinh tế và giáo dục để nâng cao sự đa dạng trong chiến lược. Mỗi một cỗ máy đều đang tăng cường sức mạnh tập thể, cải thiện khả năng thích ứng và giành lợi thế trong các cuộc xung đột."
 councilor_individual_machine_warbots: "Chuyên Gia Hậu Cần Chiến Đấu"
 councilor_individual_machine_warbots_desc: "$councilor_individual_machine_warbots$ chịu trách nhiệm lập kế hoạch và quản lý chuỗi cung ứng, đảm bảo mọi hoạt động chiến đấu của chúng ta ở bất cứ đâu đều được hỗ trợ liên tục."
 civic_individual_machine_replication: "$civic_machine_replication$"
 civic_individual_machine_replication_desc: "Xã hội này đã nắm vững các phương thức tự lắp ráp. Mỗi một cỗ máy đều có thể sinh ra một cỗ máy khác, tạo thành một chuỗi liên kết không bị gián đoạn, mở rộng giới hạn hành tinh của chúng ta."
 councilor_individual_machine_replication: "Điều Phối Viên Nhân Bản"
 councilor_individual_machine_replication_desc: "$TITLE$ chịu trách nhiệm đảm bảo mọi quá trình tự lắp ráp diễn ra một cách an toàn và tuân thủ quy định."

