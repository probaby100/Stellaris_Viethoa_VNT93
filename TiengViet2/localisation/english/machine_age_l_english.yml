 trait_pc_cosmogenesis_world_preference_short: "Máy Lọc Synapse"
 trait_pc_cosmogenesis_world_preference_desc: "Giống loài này đã không thể thích nghi với bất kỳ môi trường nào khác ngoài buồng hỗ trợ sinh tồn của Máy Lọc Synapse. Họ chỉ muốn chìm đắm trong ảo cảnh hạnh phúc, không muốn phải gánh chịu thêm những đòn roi của thực tại."
