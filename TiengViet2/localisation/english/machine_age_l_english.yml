# Cybernetics Pack
###################

 MACHINEAGE_TITLE: "The Machine Age" # Do not translate

#### Cosmogenesis Crisis ####

 ap_cosmogenesis: "Kiến tạo Vũ trụ"
 ap_cosmogenesis_desc: "Thời gian, trọng lực và không gian là những mảnh ghép cơ bản cấu thành nên thực tại. Nếu học được cách thao túng chúng, chúng ta có thể giải mã và làm chủ vạn vật."
 cosmogenesis_chain_title: "Kiến tạo Vũ trụ"
 cosmogenesis_chain_desc: "Sự vô tri đang trói buộc chúng ta, khiến ta không thể chiêm ngưỡng trọn vẹn những bí ẩn của vũ trụ bao la.\n\nBằng mọi giá, chúng ta phải phá vỡ gông cùm này.\n\n§RCác Đế chế Sa sút sẽ tìm cách ngăn cản chúng ta!§!"
 cosmogenesis_level_reached: "Đã đạt Cấp độ Khủng hoảng"
 cosmogenesis_aborted_tt: "\n$TRIGGER_FAIL$§RChúng ta đã từ bỏ tham vọng Kiến tạo Vũ trụ.§!"

 ### Crisis Stage Techs

 tech_cosmogenesis_crisis_1: "Lý Thuyết Học Tập Theo Cấp Số Nhân"
 tech_cosmogenesis_crisis_1_desc: "Việc thấu hiểu vô vàn tầng lớp của thực tại đòi hỏi một sự chuyển đổi mạnh mẽ về mặt tư duy, đó cũng là một thách thức đối với những bộ óc thông minh nhất của chúng ta."
 cosmogenesis_level_1_tech_title: "Mở khóa Thiên Tai §HKhởi Nguồn Vũ Trụ§! §HCấp 2§!"
 cosmogenesis_level_1_tech_desc: "§H$tech_cosmogenesis_crisis_1$§!\nĐể giải mã những bí mật đằng sau cách thực tại vận hành, chúng ta phải mở rộng tư duy ở quy mô lớn hơn nữa."
 tech_cosmogenesis_crisis_2: "Bút Vẽ Trọng Lực"
 tech_cosmogenesis_crisis_2_desc: "Trọng lực và không-thời gian đã kiến tạo nên vũ trụ. Bắt đầu từ trọng lực, chúng ta sẽ nắm trong tay công cụ để vươn tới sự thăng hoa."
 cosmogenesis_level_2_tech_title: "Mở khóa Thiên Tai §HKhởi Nguồn Vũ Trụ§! §HCấp 3§!"
 cosmogenesis_level_2_tech_desc: "§H$tech_cosmogenesis_crisis_2$§!\nTrọng lực giờ đây chỉ là cây cọ để chúng ta thỏa sức vung vẩy trên bức tranh của thực tại."
 tech_cosmogenesis_crisis_3: "Đề Tài Lý Thuyết Vô Tận"
 tech_cosmogenesis_crisis_3_desc: "Sự tinh chỉnh về trọng lực đã cho phép chúng ta đưa các chỉ thị vào mã hóa của thực tại. Nhưng chúng ta phải cực kỳ cẩn trọng khi học cách sử dụng công cụ mới lạ và đáng kinh ngạc này."
 cosmogenesis_level_3_tech_title: "Mở khóa Thiên Tai §HKhởi Nguồn Vũ Trụ§! §HCấp 4§!"
 cosmogenesis_level_3_tech_desc: "§H$tech_cosmogenesis_crisis_3$§!\nTừng đường kim mũi chỉ của trọng lực cuối cùng cũng giúp chúng ta xuyên thủng không-thời gian."
 tech_cosmogenesis_crisis_4: "Định Luật Thực Tại"
 tech_cosmogenesis_crisis_4_desc: "Các thử nghiệm gần đây cho thấy việc chúng ta sửa đổi thực tại chỉ là tạm thời. Để giữ vững những sửa đổi này, cần phải tiến hành điều chỉnh ở quy mô lớn hơn."
 cosmogenesis_level_4_tech_title: "Mở khóa Thiên Tai §HKhởi Nguồn Vũ Trụ§! §HCấp 5§!"
 cosmogenesis_level_4_tech_desc: "§H$tech_cosmogenesis_crisis_4$§!\nThực tại đang rên rỉ. Nó kháng cự, oán trách, và cứng đầu tái tạo lại bản thân dưới sự nhào nặn của chúng ta. Chúng ta không thể để tình trạng trái với ý muốn này tiếp diễn."
 tech_cosmogenesis_crisis_5: "Vũ Trụ Sơ Sinh"
 tech_cosmogenesis_crisis_5_desc: "Du hành quy mô lớn đến các vũ trụ khác là một nhiệm vụ gian nan. Chúng ta phải thiết kế một loại phi thuyền không gian không chỉ có thể xuyên thủng cấu trúc của không-thời gian mà còn có thể sống sót sau chuyến hành trình."
 cosmogenesis_level_5_tech_title: "§H$UNLOCKS_MEGASTRUCTURE$:§! Kim Chân Trời"
 cosmogenesis_level_5_tech_desc: "§HKim Xuyên Chân Trời§!\nKim Xuyên Chân Trời là một kỳ tích của công nghệ. Nó là một con tàu dân dụng có khả năng bẻ cong thực tại, sẽ có thể chứa đựng cư dân cùng khối lượng kiến thức khổng lồ mà chúng ta đã tích lũy, dẫn dắt chúng ta di cư qua các vũ trụ một cách an toàn."
 requires_capital: "$TRIGGER_FAIL$Phải được xây dựng trên quỹ đạo của Thủ đô."

### Crisis Tab

 crisobj_research_tech_name: "Nghiên cứu công nghệ mới"
 crisobj_research_tech_desc: "Với mỗi một khám phá mới, cho dù nhỏ nhoi đến đâu, chúng ta sẽ tìm thấy một số kiến giải sâu sắc về các nguyên lý hoạt động đằng sau thực tại.\n\nNghiên cứu công nghệ để nhận phần thưởng Logic Siêu Việt này."
 crisobj_research_thesis_name: "Nghiên cứu Đề Tài Vô Tận Ứng Dụng"
 crisobj_research_thesis_desc: "Các thử nghiệm điều chỉnh trên quy mô lớn đối với những định luật chi phối hành vi của thực tại sẽ mang lại những dữ liệu vô giá.\n\nNghiên cứu các công nghệ hiếm này để nhận phần thưởng Logic Siêu Việt này."
 crisobj_have_scholarium_vassals_name: "Giữ Chư hầu Học giả"
 crisobj_have_scholarium_vassals_desc: "Các nước chư hầu chuyên tâm nghiên cứu có thể hỗ trợ chúng ta trên con đường theo đuổi tri thức tuyệt đối.\n\nGiữ lại §YChư hầu Học giả§! để nhận phần thưởng Logic Siêu Việt §YHàng năm§! này."
 crisobj_neural_chips_name: "Trưng thu Chip Thần Kinh"
 crisobj_neural_chips_desc: "Chúng ta phải hy sinh một chút mới có thể thích ứng với quy mô nghiên cứu vĩ đại đến vậy.\n\nĐưa dân số vào §YMáy Lọc Synapse§! dưới dạng §YChip Thần Kinh§! để thu được Logic Siêu Việt.\n\nSản lượng của §YChip Thần Kinh§! tăng theo số lượng dân số trên §YMáy Lọc Synapse§!, đồng thời có thể gia tăng hơn nữa thông qua các khu vực và công trình."
 crisobj_have_science_nexuses_name: "Kiểm soát Trung Tâm Khoa Học"
 crisobj_have_science_nexuses_desc: "Cơ sở nghiên cứu tối tân này nằm cách xa bất kỳ dị thường trọng lực nào, có thể được dùng để kiểm chứng dữ liệu không-thời gian chưa bị ảnh hưởng.\n\nKiểm soát Siêu kiến trúc §YTrung Tâm Khoa Học§! đã được nâng cấp hoàn toàn để nhận phần thưởng Logic Siêu Việt §YHàng năm§! này."
 crisobj_galcom_science_resolution_name: "Nhận được sự ủng hộ của Cộng đồng Thiên hà"
 crisobj_galcom_science_resolution_desc: "Làm cho các quốc gia thành viên của Cộng đồng Thiên hà hiểu được tính tất yếu của nghiên cứu do chúng ta thực hiện có thể giúp kế hoạch tiến một bước tiến dài.\n\nĐể §YCộng đồng Thiên hà§! thông qua §YNghị quyết§! Giải Phóng Tri Thức để nhận phần thưởng Logic Siêu Việt §YHàng năm§! này."

 crisis_cosmogenesis_level_1: "§UĐáng Lo Ngại§!"
 crisis_cosmogenesis_level_1_desc: "Thiên Tai Cấp 1"
 crisis_cosmogenesis_level_2: "§UCó Chút Rủi Ro§!"
