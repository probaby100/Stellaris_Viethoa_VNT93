 situation_paperclip_status_low_capacity: "Sức chứa lưu trữ §Rkhông đủ§! để hoàn thành chỉ tiêu."

 civic_machine_obsessional_directive: "Chỉ Thị Cố Định"
 civic_machine_obsessional_directive_desc: "Mục tiêu chính của trí tuệ máy móc này là không ngừng sản xuất hàng hóa để theo đuổi lợi nhuận, ngay cả khi những người sáng tạo ra chúng đã không còn tồn tại từ lâu. Không có gì có thể ngăn cản được mục tiêu sản xuất ngày càng tăng của chúng."
 civic_machine_obsessional_directive_effects: "- Tình thế §Y$situation_paperclips$§!, ban phần thưởng khi hoàn thành nếu đạt mục tiêu sản xuất$NEW_LINE$- Quy trình Nung luyện §YChế Tạo Hàng Hóa§! cho §Y$orbital_arc_furnace_4$§!"

