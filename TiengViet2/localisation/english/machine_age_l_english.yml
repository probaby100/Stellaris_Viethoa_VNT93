 cybercreed_creeds_absorbed: "Hấp Thụ Giáo Phái"
 cybercreed_creeds_absorbed_desc: "Các Công Nghệ Hiển Thánh Sư hưởng ứng lời kêu gọi, hợp nhất các tín ngưỡng khác nhau thành một đức tin duy nhất."
