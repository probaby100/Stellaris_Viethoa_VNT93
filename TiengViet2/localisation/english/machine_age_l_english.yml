 crisis.7280.desc: "Chào các [Root.GetSpeciesNamePlural] thông minh. Giờ đây các bạn đã chạm tới một cột mốc công nghệ quan trọng, chúng tôi cảm thấy vô cùng tự hào về điều đó. Nhìn lại quá khứ, con đường không hề bằng phẳng, nhưng trong quá trình vượt qua những thử thách này, các bạn cũng không ngừng trưởng thành. Thực lực công nghệ mà các bạn thể hiện ngày hôm nay chứng minh rằng việc chúng tôi cung cấp chỉ dẫn cho các bạn khi xưa là một lựa chọn đúng đắn."

 crisis.7285.desc: "Lũ trẻ ranh! Những gì các ngươi làm ngày hôm nay đã vượt quá giới hạn chịu đựng của chúng ta. Những thí nghiệm bất chấp hậu quả này đang gây nguy hiểm cho tất cả mọi người. Chúng ta yêu cầu các ngươi chấm dứt ngay các loại thí nghiệm này, các ngươi căn bản không biết mình đang đùa với thứ gì đâu. Mặc dù sự tò mò là đáng khen ngợi, nhưng chúng ta không thể dung túng cho sự quậy phá ở quy mô này. Thế giới được xây dựng như hiện tại là có lý do của nó, đừng đụng vào nó nữa."

 crisis.7285.a: "Ngài nói đúng, việc này quá nguy hiểm."
 crisis.7285.a.tt: "Từ bỏ tham vọng 'Kiến tạo Vũ trụ' của bạn, mất quyền sử dụng hầu hết các công trình và tàu của Đế chế Sa sút.\n\n§RĐiều này sẽ ngăn cản chúng ta hoàn thành tiến trình Khủng hoảng!§!"

