 building_amphitheater_of_the_mind: "Điện Đường Tư Tưởng"
 building_amphitheater_of_the_mind_desc: "Ngôi đền có khả năng xử lý cục bộ này cho phép giáo phái Khúc Ca Tư Tưởng đang trong trạng thái kết nối bán phần có thể thảo luận, chia sẻ và khám phá những bí ẩn của thế giới vật chất với tốc độ ánh sáng."
 building_grand_concert_hall_of_the_mind: "Lễ Đường Tư Tưởng Khổng Lồ"
 building_grand_concert_hall_of_the_mind_desc: "Đại sảnh tiếng vang được trang bị mảng liên lạc tiên tiến nhất này cho phép giáo phái Khúc Ca Tư Tưởng cùng nhau giao tiếp, tìm kiếm thần tính. Họ kết nối với nhau thông qua thiết bị mạng, và dàn hợp xướng của họ sẽ vạch trần những giai điệu ẩn giấu của vũ trụ."
 building_forge_of_the_fellowship: "Lò Rèn Sứ Đoàn"
 building_forge_of_the_fellowship_desc: "Tại đây, xưởng đúc đầu tiên của Sứ Đoàn Búa Khổng Lồ chế tạo ra các vật liệu xây dựng với chất lượng cao nhất. Vô số nhát búa đã tấu lên một bản giao hưởng khi các tín đồ theo đuổi công việc thần thánh."
 building_grand_forge_of_the_fellowship: "Lò Rèn Sứ Đoàn Khổng Lồ"
 building_grand_forge_of_the_fellowship_desc: "Bên ngoài phòng máy của lò rèn khổng lồ, những tín đồ trung thành có thể nghe thấy âm thanh cầu nguyện phát ra từ các công cụ không bao giờ ngừng nghỉ của sứ đoàn. Ban đêm, ánh sáng rực rỡ phát ra từ thánh đường đúc tinh xảo còn vượt qua cả những vì sao trên đỉnh đầu, như thể ngọn lửa thánh khiết của chúng ta đang rực cháy vì thần linh."
 building_battlement_of_steel: "Doanh Trại Thép"
 building_battlement_of_steel_desc: "Pháo đài tín ngưỡng này vừa là nơi chứa vũ khí, vừa là thao trường huấn luyện hiệp sĩ của Thánh Vệ Thép. Họ luôn giữ vững cảnh giác, bảo vệ cơ thể thần thánh của chúng ta."
 building_grand_battlements_of_steel: "Thánh Doanh Thép"
 building_grand_battlements_of_steel_desc: "Nguyện cho pháo đài tín ngưỡng vĩ đại này cùng với bức tường thành cao ngất của nó sẽ không bao giờ sụp đổ. Trong kho vũ khí của nó chứa đầy các bộ phận cấy ghép của những hiệp sĩ Thánh Vệ Thép thần thánh, đang lặng lẽ chờ đợi một người tiên phong được xức dầu thánh. Trong những sảnh đường này, Thánh Linh ngự trị trên mặt tiếp xúc giữa xác thịt và thép."
 building_sanctuary_of_toil: "Thánh Sở Lao Động"
 building_sanctuary_of_toil_desc: "Thánh sở này cung cấp các dịch vụ điều phối, bảo trì, phục hồi thể xác và nâng cấp cường hóa cho Kết Xã Lao Động."
 building_grand_cathedral_of_toil: "Thánh Đường Lao Động"
 building_grand_cathedral_of_toil_desc: "Được cung cấp những người mình cần cho các tín đồ quả là một phước lành. Hãy để tâm hồn mệt mỏi của họ được an nghỉ trong Thánh Đường Lao Động vĩ đại. Các xưởng làm việc và trung tâm điều phối ở đây sẽ dẫn dắt và bảo vệ những người lao động sùng đạo, đồng thời cung cấp dịch vụ nâng cấp cường hóa trong lúc họ thực hiện nghĩa vụ thần thánh của mình."
 building_the_sanctum_of_augmentation: "Thánh Đường Cường Hóa"
 building_the_sanctum_of_augmentation_desc: "Mật thất thần thánh này là biểu tượng của sự đoàn kết trong tinh thần tín ngưỡng chung của chúng ta. Tại những căn phòng được ban phước lành này, các tín đồ luôn chăm sóc tận tình cho tâm hồn cũng như các bộ phận cường hóa của mọi người."
 building_the_united_sanctum_of_augmentation: "Thánh Đường Cường Hóa Liên Hợp"
 building_the_united_sanctum_of_augmentation_desc: "Trong niềm tôn kính đối với sự dung hợp thần thánh nhất, thánh đường trang nghiêm này chính là một phép màu sống. Tại những điện đường thần thánh này, các tín đồ tề tựu bên nhau, kiên định không ngừng tận tâm thúc đẩy sự nghiệp dung hợp thần thánh cao cả."

 #Advanced Cyber Creed Authorities
 auth_cyber_creed_democratic: "Cường Hóa Thể Dân Chủ"
 auth_cyber_creed_democratic_desc: "Chính phủ nghĩa thể dân chủ coi việc bỏ phiếu là một quyền lợi thiêng liêng, cho phép các công dân đã được cường hóa lên tiếng trên nhiều nghĩa thể chính trị khác nhau, để họ hoàn thành việc giao tiếp với Thánh Linh."
 concept_auth_cyber_creed_democratic: "$auth_cyber_creed_democratic$"
 auth_cyber_creed_oligarchic: "Thần Quyền Quả Đầu Cyber"
 auth_cyber_creed_oligarchic_desc: "Chính phủ nghĩa thể quả đầu đã chọn ra một nhóm cá nhân được cường hóa cao độ để nắm giữ toàn bộ quyền lực chính trị, dẫn dắt toàn bộ xã hội nghĩa thể với độ chính xác cực cao."
 concept_auth_cyber_creed_oligarchic: "$auth_cyber_creed_oligarchic$"
 auth_cyber_creed_dictatorial: "Thần Giáo Tổng Hợp Độc Tài"
 auth_cyber_creed_dictatorial_desc: "Chính phủ nghĩa thể độc tài chọn ra một nhà cai trị sống lâu, thông qua các bộ phận cấy ghép nghĩa thể tiên tiến để đạt được sự kiểm soát tuyệt đối, định đoạt vận mệnh của xã hội."
 concept_auth_cyber_creed_dictatorial: "$auth_cyber_creed_dictatorial$"
 auth_cyber_creed_imperial: "Đế Chế Cyber"
 auth_cyber_creed_imperial_desc: "Chính phủ nghĩa thể quân chủ có một nhà cai trị tối cao, người thừa kế do người đó chỉ định có thể đạt được sự chuyển giao quyền lực liền mạch. Người đó có thể kết hợp tâm linh với nghĩa thể tiên tiến để tạo thành một sự thống trị vững chắc."
 concept_auth_cyber_creed_imperial: "$auth_cyber_creed_imperial$"
 auth_cyber_creed_corporate: "Xí Nghiệp Công Nghệ Thần Thánh"
 auth_cyber_creed_corporate_desc: "Chính phủ nghĩa thể doanh nghiệp đã vượt qua vai trò của một quốc gia truyền thống nhờ vào các bộ phận cấy ghép tiên tiến cùng với sự dung hợp giữa đức tin và công nghệ, để từ đó tìm kiếm các cơ hội kinh tế thần thánh."
 concept_auth_cyber_creed_corporate: "$auth_cyber_creed_corporate$"

 #Advanced Cyber Creed Government Types
 gov_cyber_creed_monarchy: "Quốc Gia Chủ Quyền Nghĩa Thể"
 gov_cyber_creed_monarchy_desc: "Nhà cai trị và người thừa kế của chính phủ quân chủ công nghệ - duy tâm là biểu tượng cao quý của sự dung hợp thần thánh. Trong đó, giáo hội trực tiếp hỗ trợ cỗ máy quốc gia."
 gov_cyber_creed_dictatorship: "Quốc Gia Kỹ Trị Thần Thánh"
 gov_cyber_creed_dictatorship_desc: "Chính phủ độc tài công nghệ - duy tâm do một kẻ độc tài được cường hóa lãnh đạo, đóng vai trò là nhà lãnh đạo cao nhất của tầng lớp tôn giáo để cai trị một quốc gia được dẫn dắt bởi quốc giáo."
 gov_cyber_creed_oligarchy: "Giáo Đoàn Công Nghệ Hiển Thánh"
 gov_cyber_creed_oligarchy_desc: "Trong chính phủ quả đầu công nghệ - duy tâm, toàn bộ quyền lực chính trị của quốc gia đều nằm trong tay của một vài nhà lãnh đạo tôn giáo đầy quyền lực."
 gov_cyber_creed_democracy: "Cộng Hòa Siêu Việt"
 gov_cyber_creed_democracy_desc: "Trong chính phủ dân chủ công nghệ - duy tâm, hội đồng tôn giáo bao gồm các cá nhân được cường hóa sẽ đóng vai trò cố vấn để giám sát và hướng dẫn quá trình bầu cử."
 gov_cyber_creed_divine_empire: "Đế Chế Cường Hóa Thể Thần Thánh"
 gov_cyber_creed_divine_empire_desc: "Chính phủ này là một chế độ độc tài công nghệ - duy tâm, tất cả các vấn đề trong đời sống công cộng đều phải trải qua sự kiểm duyệt của quốc giáo, và nhà cai trị được cường hóa được xem như một vị chân thần dạo bước giữa chốn phàm trần."
 gov_cyber_creed_holy_tribunal: "Tòa Án Công Nghệ Hiển Thánh"
 gov_cyber_creed_holy_tribunal_desc: "Chính phủ này là một chế độ quả đầu công nghệ duy tâm, một hội đồng giáo sĩ dưới sự dẫn dắt của ý chỉ thần thánh sẽ kiểm soát mọi cơ cấu của quốc gia."
 gov_cyber_creed_megachurch: "Thương Đoàn Giáo Hội Cường Hóa Thể"
 gov_cyber_creed_megachurch_desc: "Chính phủ này là một hệ thống hỗn hợp chú trọng cả thương mại lẫn công nghệ - duy tâm, chức vị tổng giám mục và người đứng đầu doanh nghiệp đã được hợp nhất thành một vị trí duy nhất."
 gov_cyber_creed_subversive_cult: "Tà Giáo Cơ Khí"
 gov_cyber_creed_subversive_cult_desc: "Chính phủ này là một tập đoàn tôn giáo, duy trì sự tồn tại của bản thân thông qua nhiều tổ chức tội phạm và doanh nghiệp tập trung vào nghĩa thể."

 #Advanced Government Edicts
 edict_cybernetic_creed_construction_edict: "Chiếc Búa Của Đức Hạnh"
 edict_cybernetic_creed_construction_edict_desc: "Vì một xã hội thần thánh, chúng ta phải dốc toàn lực hỗ trợ Sứ Đoàn Búa Khổng Lồ, công việc của họ đóng vai trò tối quan trọng đối với việc xây dựng một tương lai xứng đáng được phong thánh."
 edict_cybernetic_creed_war_edict: "Thánh Quân Thép"
 edict_cybernetic_creed_war_edict_desc: "Để ngăn chặn ma quỷ tấn công vào cơ thể thần thánh của chúng ta, chúng ta phải dốc toàn lực hỗ trợ Thánh Vệ Thép, đảm bảo rằng các chiến binh của chúng ta luôn trong tư thế sẵn sàng."
 edict_cybernetic_creed_research_edict: "Khúc Ca Của Học Thức"
 edict_cybernetic_creed_research_edict_desc: "Chỉ thông qua những khúc ca học thức tràn đầy năng lượng, người dân của chúng ta mới có thể thực sự hiểu được Thánh Linh. Chúng ta phải hỗ trợ mọi nỗ lực của giáo phái Khúc Ca Tư Tưởng đầy trí tuệ."
 edict_cybernetic_creed_construction_labor: "Quần Chúng Lao Khổ"
 edict_cybernetic_creed_construction_labor_desc: "Sức mạnh thực sự ẩn chứa bên trong quần chúng lao khổ của chúng ta. Nếu chúng ta không có đủ sức mạnh để nâng đỡ họ, thì họ cũng không có đủ sức mạnh để đưa chúng ta tới tương lai."
 edict_cybernetic_creed_general_edict: "Tấm Gương Của Sự Hài Hòa"
 edict_cybernetic_creed_general_edict_desc: "Sự thống nhất của giáo hội đã mang lại nhiều kinh nghiệm. Nó làm cho đức tin của chúng ta trở nên vững chắc và sâu sắc hơn bao giờ hết."

 #Intro Events
 machine_age.2150.name: "Giáo Phái"
 machine_age.2150.desc: "Dưới sự dẫn dắt của Thánh Linh hướng tới những vì sao, nhiều tín ngưỡng khác nhau trong đức tin của chúng ta hiện sẽ có những ảnh hưởng nhất định đến chính phủ mới.\n\nMỗi giáo phái đều có sức ảnh hưởng đáng kể đối với các tín đồ, khuyến khích đưa các thành viên của mình lên những vị trí có sức ảnh hưởng, nhằm đáp ứng nhu cầu tâm linh độc đáo của họ.\n\nLiệu những áp lực khác nhau này sẽ đưa chúng ta đến gần hơn với sự thần thánh, hay sẽ đẩy chúng ta vào sự hỗn loạn, thì chỉ có thời gian mới có thể trả lời được."
 machine_age.2150.a: "Hy vọng rằng họ sẽ có ích."
 machine_age.2150.a.tooltip: "§YCác phe phái sau đã được thành lập§!:\n—$cyber_creed_labor$\n—$cyber_creed_war$\n—$cyber_creed_research$\n—$cyber_creed_construction$"
 cyber_creed_please_labor: "Hành động này sẽ làm hài lòng giáo phái §Y$cyber_creed_labor$§!\nHành động này sẽ chọc giận tất cả các giáo phái khác."
 cyber_creed_displease_labor: "Hành động này sẽ chọc giận giáo phái §Y$cyber_creed_labor$§!\nHành động này sẽ làm hài lòng tất cả các giáo phái khác."
 cyber_creed_please_war: "Hành động này sẽ làm hài lòng giáo phái §Y$cyber_creed_war$§!\nHành động này sẽ chọc giận tất cả các giáo phái khác."
 cyber_creed_displease_war: "Hành động này sẽ chọc giận giáo phái §Y$cyber_creed_war$§!\nHành động này sẽ làm hài lòng tất cả các giáo phái khác."
 cyber_creed_please_construction: "Hành động này sẽ làm hài lòng giáo phái §Y$cyber_creed_construction$§!\nHành động này sẽ chọc giận tất cả các giáo phái khác."
 cyber_creed_displease_construction: "Hành động này sẽ chọc giận giáo phái §Y$cyber_creed_construction$§!\nHành động này sẽ làm hài lòng tất cả các giáo phái khác."
 cyber_creed_please_research: "Hành động này sẽ làm hài lòng giáo phái §Y$cyber_creed_research$§!\nHành động này sẽ chọc giận tất cả các giáo phái khác."
 cyber_creed_displease_research: "Hành động này sẽ chọc giận giáo phái §Y$cyber_creed_research$§!\nHành động này sẽ làm hài lòng tất cả các giáo phái khác."
 machine_age.2205.name: "Viết Lại Lịch Sử"
 machine_age.2205.desc: "§YThánh Vệ Thép§! gần đây đã phát động một chiến dịch nhằm cấm xuất hiện mọi ghi chép về thất bại quân sự trong các tài liệu lịch sử và tôn giáo.\n\nGiáo phái này cho rằng, những điều ngụy biện này làm suy giảm tinh thần quân nhân, làm suy yếu sự ủng hộ của công chúng. Tuy nhiên, các nhà sử học của chúng ta đã bác bỏ quan điểm này, và nhắc nhở chúng ta rằng, những kẻ không học hỏi từ lịch sử sẽ phải lặp lại những sai lầm đó.\n\nChúng ta có nên chấp nhận góc nhìn tích cực hơn của họ về lịch sử hay không?"
 machine_age.2205.a: "Muốn giành được chiến thắng, chúng ta phải có tư duy của người chiến thắng."
 machine_age.2205.a.tooltip: "$cyber_creed_please_war$"
 machine_age.2205.b: "Không chấp nhận. Chúng ta phải học hỏi từ những sai lầm."
 machine_age.2205.b.tooltip: "$cyber_creed_displease_war$"
 machine_age.2210.name: "Thánh Hỏa Tắt Lụi"
 machine_age.2210.desc: "Thợ Cả Tối Cao, tức nhà lãnh đạo của §YSứ Đoàn Búa Khổng Lồ§!, đã đột ngột qua đời.\n\nMặc dù họ nổi tiếng vì những hành động bộc trực và quan điểm kiên quyết, nhưng vẫn có một nhóm tín đồ đi theo. Sứ đoàn yêu cầu tổ chức cho họ một lễ quốc tang chính thức, điều thường chỉ dành cho những vị lãnh đạo được kính yêu nhất của chúng ta.\n\nĐúng như dự đoán, các giáo phái khác yêu cầu quốc gia không nên dính líu đến đám tang của một nhà lãnh đạo tinh thần ăn nói thiếu chừng mực này.\n\nChúng ta nên xử lý yêu cầu của giáo phái này như thế nào?"
 machine_age.2210.a: "Cứ tiếp tục tổ chức tang lễ đi."
 machine_age.2210.a.tooltip: "$cyber_creed_please_construction$"
 machine_age.2210.b: "Không đáng để làm mất lòng các giáo phái khác."
 machine_age.2210.b.tooltip: "$cyber_creed_displease_construction$"
 machine_age.2215.name: "Di Vật Gây Tranh Cãi"
 machine_age.2215.desc: "Gần đây, một đội khảo cổ đã phát hiện ra một di chỉ tôn giáo cổ xưa. Sự tồn tại của nó giống như một huyền thoại, buộc chúng ta phải sửa đổi một vài phần trong ghi chép lịch sử tôn giáo.\n\nSự thật đáng ngạc nhiên nhất là, nhiều hiện vật lịch sử được khai quật có mang biểu tượng của §YKết Xã Lao Động§!. Thông tin này chứng minh rằng, Kết Xã Lao Động mới là hình thức ban đầu trong đức tin của chúng ta, và đây vốn là một chủ đề gây nhiều tranh cãi trong đức tin của chúng ta.\n\nViệc chính thức công nhận khám phá này sẽ làm hài lòng §YKết Xã Lao Động§!, nhưng sự im lặng có chọn lọc có thể sẽ khiến các giáo phái khác cảm thấy hài lòng."
 machine_age.2215.a: "Chúng ta không nên sợ hãi sự thật."
 machine_age.2215.a.tooltip: "$cyber_creed_please_labor$"
 machine_age.2215.b: "Việc chôn sâu dưới đất ắt hẳn có lý do của nó, hãy cứ coi như nó không tồn tại đi."
 machine_age.2215.b.tooltip: "$cyber_creed_displease_labor$"
 machine_age.2221.name: "Giáo Phái Nằm Vùng"
 machine_age.2221.desc: "Chúng ta phát hiện ra §Y[cyber_creed_undercover_leader.GetName]§! có mối liên hệ sâu sắc với §Y[GetCyberCreed]§!, và bị tình nghi biển thủ ngân quỹ cũng như phân bổ lại các dự án vào phạm vi thế lực của giáo phái đó.\n\nViệc chính phủ hiện tại có thể lạm quyền một cách trắng trợn như vậy đã khiến các giáo phái khác vô cùng phẫn nộ, và yêu cầu §Y[cyber_creed_undercover_leader.GetName]§! phải từ chức ngay lập tức.\n\nChúng ta nên xử lý nhà lãnh đạo cứng đầu này như thế nào?"
 machine_age.2221.a: "Hãy để [cyber_creed_undercover_leader.GetHerHim] từ chức."
 machine_age.2221.a.tooltip: "[cyber_creed_undercover_leader.GetName] đã bị tước đoạt quyền lực."
 machine_age.2221.b: "Những đóng góp xuất sắc mà [cyber_creed_undercover_leader.GetSheHe] đạt được đã lập công chuộc tội rồi."
 machine_age.2225.name: "Lễ Hội Năm Thánh Búa Khổng Lồ"
 machine_age.2225.desc: "Cuộc hành hương mừng Lễ Hội Năm Thánh của §YSứ Đoàn Búa Khổng Lồ§! sắp bắt đầu, vô số người hành hương sẽ xuất phát từ các xưởng rèn địa phương của họ để đi đến §Y$building_forge_of_the_fellowship$§! ở thủ đô.\n\nTrong quá khứ, sự kiện trọng đại này từng gây ra vô số vấn đề về hậu cần, và thường kết thúc bởi những cuộc đụng độ bạo lực giữa sứ đoàn và tín đồ của các giáo phái khác.\n\nCác giáo phái khác và cư dân ở thủ đô đều kêu gọi cấm triệt để hoạt động này."
 machine_age.2225.a: "Cấm vĩnh viễn các cuộc hành hương."
 machine_age.2225.a.tooltip: "$cyber_creed_displease_construction$"
 machine_age.2225.b: "Tự do tôn giáo là một quyền lợi."
 machine_age.2225.b.tooltip: "$cyber_creed_please_construction$"
 machine_age.2230.name: "Tuyên Bố Thiếu Đầu Tư Nghiên Cứu"
 machine_age.2230.desc: "Gần đây, người đứng đầu của giáo phái §YKhúc Ca Tư Tưởng§!, Đại Sư Khúc Ca, đã công khai bày tỏ sự lo ngại về việc giáo hội của chúng ta thiếu đầu tư vào quỹ nghiên cứu khoa học.\n\nMọi người cho rằng đây là một chiến lược do các thành viên của giáo phái này áp dụng nhằm tranh thủ nhận được nhiều quỹ tài trợ hơn. Nếu chấp thuận yêu cầu của họ, có thể sẽ bị coi là chúng ta đang dành cho §YKhúc Ca Tư Tưởng§! sự ưu đãi đặc biệt.\n\nLiệu chúng ta có nên cải thiện việc đầu tư ngân sách cho nghiên cứu khoa học không?"
 machine_age.2230.a: "Cứ để Đại Sư Khúc Ca tự biên tự diễn đi, một lát nữa sẽ tự câm miệng thôi."
 machine_age.2230.a.tooltip: "$cyber_creed_displease_research$"
 machine_age.2230.b: "Gia tăng một khoản ngân sách vừa phải, cho đến khi sóng gió qua đi."
 machine_age.2230.b.tooltip: "$cyber_creed_please_research$"
 machine_age.2230.c: "Chúng ta sẽ cải thiện đáng kể việc đầu tư."
 machine_age.2230.c.tooltip: "$cyber_creed_please_research$"

 cyber_creed_history_rewritten: "Viết Lại Lịch Sử"
 cyber_creed_history_rewritten_desc: "Chúng ta đã xóa sạch mọi ghi chép về các thất bại quân sự khỏi sách sử, khiến cho các nhà sử học vô cùng thất vọng."
 cyber_creed_history_repeating: "Lịch Sử Lặp Lại"
 cyber_creed_history_repeating_desc: "Chúng ta vẫn giữ lại mọi ghi chép về các thất bại quân sự trong lịch sử. Quyết định này đã khiến Thánh Vệ Thép vô cùng thất vọng."
 cyber_creed_no_choirmaster_funding: "Phớt Lờ Đại Sư Khúc Ca"
 cyber_creed_no_choirmaster_funding_desc: "Chúng ta đã phớt lờ lời kêu gọi tăng cường quỹ nghiên cứu khoa học của Khúc Ca Tư Tưởng."
 cyber_creed_low_choirmaster_funding: "Lắng Nghe Đại Sư Khúc Ca"
 cyber_creed_low_choirmaster_funding_desc: "Chúng ta đã điều phối thêm một chút ngân sách cho nghiên cứu để xoa dịu Khúc Ca Tư Tưởng."
 cyber_creed_high_choirmaster_funding: "Hỗ Trợ Đại Sư Khúc Ca"
 cyber_creed_high_choirmaster_funding_desc: "Chúng ta hoàn toàn ủng hộ yêu cầu cung cấp quỹ nghiên cứu khoa học của Khúc Ca Tư Tưởng."
 cyber_creed_state_funeral: "Quốc Tang Cho Thợ Cả Tối Cao"
 cyber_creed_state_funeral_desc: "Chúng ta đã tổ chức một buổi quốc tang cho vị lãnh đạo quá cố của Sứ Đoàn Búa Khổng Lồ."
 cyber_creed_no_state_funeral: "Không Cấp Quốc Tang"
 cyber_creed_no_state_funeral_desc: "Chúng ta đã từ chối yêu cầu tổ chức quốc tang cho vị lãnh đạo quá cố của Sứ Đoàn Búa Khổng Lồ."
 cyber_creed_relics_truth: "Sự Thật Phơi Bày"
 cyber_creed_relics_truth_desc: "Chúng ta cho phép công bố lịch sử thực sự về Kết Xã Lao Động cho công chúng, khiến cho các giáo phái khác cảm thấy phẫn nộ."
 cyber_creed_relics_hidden: "Chôn Vùi Sự Thật"
 cyber_creed_relics_hidden_desc: "Việc phớt lờ di vật đã làm cho đa số các giáo phái cảm thấy hài lòng, ngoại trừ việc phải hy sinh một chút uy tín của một số nhà lãnh đạo tôn giáo."
 cyber_creed_leader_removed: "Sa Thải Lãnh Đạo Cứng Đầu"
 cyber_creed_leader_removed_desc: "Lãnh đạo của chúng ta đã bị sa thải vì âm thầm quy y một giáo phái."
 cyber_creed_leader_stayed: "Giữ Lại Lãnh Đạo Cứng Đầu"
 cyber_creed_leader_stayed_desc: "Chúng ta đã giữ lại vị trí của vị lãnh đạo âm thầm quy y một giáo phái, phớt lờ những lời kêu gọi sa thải."
 cyber_creed_pilgrimage_allowed: "Phê Chuẩn Sứ Đoàn Hành Hương"
 cyber_creed_pilgrimage_allowed_desc: "Cuộc hành hương của Sứ Đoàn Búa Khổng Lồ đã được phê chuẩn. Đúng như chúng ta dự đoán, các vụ bạo lực và biểu tình phản đối đã xảy ra ngay sau các cuộc diễu hành."
 cyber_creed_pilgrimage_canceled: "Hủy Bỏ Sứ Đoàn Hành Hương"
 cyber_creed_pilgrimage_canceled_desc: "Yêu cầu hành hương của Sứ Đoàn Búa Khổng Lồ đã bị từ chối, nhằm tránh các vụ bạo lực có thể xảy ra. Sự việc này đã khiến các tín đồ cảm thấy thất vọng."

 POP_ATTRACTION_CYBER_CREED_WAR: "§G+ Tư tưởng được £empire£$CYBERCREED_war$ ủng hộ§!"
 POP_ATTRACTION_CYBER_CREED_RESEARCH: "§G+ Tư tưởng được £empire£$CYBERCREED_research$ ủng hộ§!"


