 situation_cybernetic_creed_cyberization_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_cybernetic_creed_cyberization_desc: "Xã hội của chúng ta từ lâu đã nỗ lực hướng tới sự kết hợp hoàn hảo giữa [Owner.Species.GetFleshTypeCyberCreed] và máy móc, và giờ là lúc họ thực hiện chuyến hành trình cuối cùng.\n$machine_age.1090.pray$\n\n§YDân số nhận bộ phận cấy ghép thần thánh trong tháng tới§!: §G[From.GetCyberCreedPopsPerMonth]§!"
 situation_cybernetic_creed_cyberization_complete: "Tín đồ sẽ hoàn thành hành trình tiến tới sự dung hợp hoàn hảo giữa [Owner.Species.GetFleshTypeCyberCreed] và máy móc."
 stage_cybernetic_creed_the_conclave_effects: "Giáo đoàn đang thảo luận về phương thức đúng đắn để hiện thực hóa sự dung hợp thần thánh."
 stage_cybernetic_creed_cyberization_effects: "Chúng ta đang dần dần thúc đẩy mục tiêu của mình, đó là hiện thực hóa sự dung hợp thần thánh giữa máy móc và [Owner.Species.GetFleshTypeCyberCreed], một mục tiêu mà chúng ta đã theo đuổi qua nhiều thế hệ."

 situation_cybernetic_creed_cyberization_no_funding: "Giáo Hội Tự Cấp"
 situation_cybernetic_creed_cyberization_no_funding_desc: "Giáo đoàn tiếp tục thúc đẩy công việc nâng cấp cường hóa, nhưng không có sự hỗ trợ từ bên ngoài."
