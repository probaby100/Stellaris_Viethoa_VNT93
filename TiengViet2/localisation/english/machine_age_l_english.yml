 tech_nanite_repair_system_synth_queen: "Nanite Của Cetana"
 tech_nanite_repair_system_synth_queen_desc: "Hệ thống nanite tiên tiến của Cetana sẽ không mệt mỏi sửa chữa và làm mới tàu không gian của chúng ta, với tốc độ vượt xa khả năng hiện tại của chúng ta."
