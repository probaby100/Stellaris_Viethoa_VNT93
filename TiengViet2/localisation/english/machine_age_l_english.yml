 building_augmentation_bazaars: "Chợ Cường Hóa"
 building_augmentation_bazaars_desc: "Ánh đèn neon thắp sáng những hành lang như mê cung, những nhà cung cấp bộ phận cấy ghép và các phòng khám phần cứng chui ở đây có thể đáp ứng mọi nhu cầu về bộ phận cấy ghép điều khiển, dù có được đưa ra ánh sáng hay không."
 concept_augmentation_bazaars: "$building_augmentation_bazaars$"
 building_augmentation_bazaars_branch: "Trung Tâm Cấy Ghép Ngoại Vực"
 building_augmentation_bazaars_branch_desc: "Muốn chạy nhanh hơn, nhảy cao hơn, suy nghĩ xa hơn? Giờ đây, tại Trung Tâm Cấy Ghép địa phương của bạn, bạn có thể mua được những bộ phận cấy ghép mới lạ đến từ khắp thiên hà."
 concept_augmentation_bazaars_branch: "$building_augmentation_bazaars_branch$"

 civic_augmentation_bazaars: "Chợ Cường Hóa"
 civic_augmentation_bazaars_desc: "§RCẢNH BÁO: Vô hiệu hóa tất cả Đặc Quyền Thăng Hoa ngoại trừ ['concept_cybernetic_ascension'].§!\n\nCông nghệ cải tạo nghĩa thể ngày nay đã tạo ra những khu chợ như mê cung, tràn ngập các cửa hàng nâng cấp cường hóa nghĩa thể giá rẻ, những phòng khám cải tạo cơ thể mờ ám cùng những biển quảng cáo sáng chói đến mức gây khó chịu. Bất kể mức thu nhập của bạn là bao nhiêu, bạn đều có thể trải nghiệm sự kết hợp giữa xác thịt và mạch điện."
 civic_tooltip_augmentation_bazaars_effects: "—$SPECIES_TRAITS$ cho phép chọn ['concept_universal_augmentations_traits']$NEW_LINE$—$AVAILABLE_BUILDINGS$['concept_augmentation_bazaars']$NEW_LINE$—$AVAILABLE_HOLDINGS$['concept_augmentation_bazaars_branch']$NEW_LINE$—£job_executive£§Y$job_executive_plural$§! được thay thế bằng £job_augmentation_merchant£§Y$job_augmentation_merchant_plural$§!"

 concept_basic_cyborg_trait: "Đặc Điểm Nghĩa Thể Cơ Bản"
 concept_basic_cyborg_trait_desc: "Các đặc điểm nghĩa thể cơ bản bao gồm: $NEW_LINE$—['trait:trait_cyborg_power_drills']$NEW_LINE$—['trait:trait_cyborg_harvesters']$NEW_LINE$—['trait:trait_cyborg_superconductive']"

 councilor_augmentation_bazaars: "Tổng Giám Đốc Cấy Ghép"
 councilor_augmentation_bazaars_female: "Tổng Giám Đốc Cấy Ghép"
 councilor_augmentation_bazaars_desc: "$TITLE$ đồng thời giám sát việc phát triển năng lực sản xuất và phân phối các bộ phận cấy ghép đến các khu Chợ Cường Hóa và Trung Tâm Cấy Ghép Ngoại Vực trên toàn thiên hà."

