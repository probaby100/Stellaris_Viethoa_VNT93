 civic_star_seekers: "Những Kẻ Tìm Kiếm Vì Sao"
 civic_star_seekers_desc: "Một nền văn minh khao khát được chiêm ngưỡng tận mắt mọi kỳ quan của vũ trụ, ghi chép lại mọi hiện tượng kỳ thú vào một cuốn nhật ký vĩ đại về các vì sao."
 civic_star_seekers_effect_tooltip: "Phương Thức Tiếp Cận Tình Huống khả dụng: ['concept_nomad_festival']\nMục Nhật Ký Tình Huống: ['concept_journey_tracker']"
 concept_journey_tracker: "Nhật Ký Vì Sao"
 concept_journey_tracker_desc: "Theo dõi ['concept_unique_encounters'] trên toàn thiên hà.\nCác cuộc gặp gỡ được theo dõi sẽ nâng cao hiệu quả của ['concept_nomad_festival']."
 concept_unique_encounters: "Cuộc Gặp Gỡ Độc Nhất"
 concept_unique_encounters_desc: "Các Ngôi Sao Độc Nhất, Hệ Sao Kỳ Lạ và Sinh Vật Đặc Dị."
 nomad_star_journal_chain_title: "Nhật Ký Vì Sao"
 nomad_star_journal_title: "Nhật Ký Vì Sao"
 nomad_star_journal_chain_desc: "Trong suốt cuộc đại hành trình, chúng ta theo dõi từng ngôi sao, hệ sao và sinh vật mới được phát hiện."
 nomad_star_journal_desc: "Trong suốt các chuyến du hành, chúng ta ghi chép lại mọi hệ sao, hành tinh và sinh vật mới phát hiện.\nCác mục Nhật Ký Đặc Biệt được tính gấp đôi"
 star_journal_progress: "Tiến Trình Nhật Ký Vì Sao"
 no_situation_progress: "$TRIGGER_FAIL$Yêu cầu §HDự Trữ Vận Hành§! phải ở mức §H$situation_nomad_economy_stage_2_stable$§! trở lên."
 civic_hive_star_seekers: "Bầy Đàn Tìm Sao"
 civic_hive_star_seekers_desc: "Sự hiếu kỳ đã khắc sâu vào DNA của bầy đàn này. Nó không ngừng tìm kiếm những vì sao xa lạ hơn, và say mê trong tri thức rằng ngoài kia luôn có những điều mới mẻ đang chờ đón."
 civic_machine_star_seekers: "Bộ Lưu Trữ Tinh Cầu"
 civic_machine_star_seekers_desc: "Mục đích rõ ràng của Trí Tuệ Nhân Tạo này là du hành qua hư không và lập danh mục mọi thứ. Không một ngôi sao nào bị bỏ qua, không một sinh vật nào sót lại. Cuốn Nhật Ký phải hoàn thiện và luôn được cập nhật."
 civic_corporate_star_seekers: "Công Ty Thám Hiểm Tinh Cầu"
 civic_corporate_star_seekers_desc: "Nhà tổ chức du lịch hàng đầu trong thiên hà! Tập đoàn này tự hào vì luôn mang đến những trải nghiệm mới lạ cho nhóm khách hàng độc quyền của mình."
 NOMAD_STAR_JOURNAL_BLACK_HOLES: "Nhật Ký Vì Sao: Hố Đen"
 NOMAD_STAR_JOURNAL_BLACK_HOLES_DESC: "Những viên ngọc tối tăm nhất của thiên hà, rực sáng bởi ngọn lửa của lực hấp dẫn vô hạn."
 NOMAD_STAR_JOURNAL_PULSAR: "Nhật Ký Vì Sao: Sao Xung"
 NOMAD_STAR_JOURNAL_PULSAR_DESC: "Những ngọn hải đăng của các nền văn minh, soi sáng hư không vô tận."
 NOMAD_STAR_JOURNAL_NEUTRON_STAR: "Nhật Ký Vì Sao: Sao Trung Tử"
 NOMAD_STAR_JOURNAL_NEUTRON_STAR_DESC: "Một số ngôi sao lụi tàn trong niềm đam mê rực cháy. Phần còn lại kiên định tồn tại với sự toàn vẹn phi thường."
 NOMAD_STAR_JOURNAL_BINARY_TRINARY: "Nhật Ký Vì Sao: Hệ Đa Sao"
 NOMAD_STAR_JOURNAL_BINARY_TRINARY_DESC: "Không phải mọi ngôi sao đều cô độc; một số khao khát có bạn đồng hành đến mức xé toạc lẫn nhau."
 NOMAD_STAR_JOURNAL_MIGHTY_BEASTS: "Nhật Ký Vì Sao: Thần Thú Leviathan"
 NOMAD_STAR_JOURNAL_MIGHTY_BEASTS_DESC: "Tại những vùng không gian sâu thẳm xa xôi, có những sinh vật lang thang vượt qua ranh giới giữa sinh học và huyền thoại một cách đầy tự nhiên."
 NOMAD_STAR_JOURNAL_UNKNOWN_SIGHTS: "Nhật Ký Vì Sao: Cảnh Tượng Chưa Từng Biết"
 NOMAD_STAR_JOURNAL_UNKNOWN_SIGHTS_DESC: "Sâu thẳm bên trong, chúng ta biết rằng ngoài kia vẫn còn nhiều điều kỳ diệu hơn thế."
