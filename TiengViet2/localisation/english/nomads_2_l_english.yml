 situation_nomad_economy_stage_critical: "Nguy Cấp"
 situation_nomad_economy_stage_critical_desc: "Các bể chứa dự trữ của chúng ta gần như trống rỗng. Những hình phạt kinh tế nặng nề làm tê liệt việc nghiên cứu và sản xuất cho đến khi chúng ta hồi phục."
