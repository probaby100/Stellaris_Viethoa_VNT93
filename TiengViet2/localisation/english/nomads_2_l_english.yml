 district_ark_city: "Boong Cư Trú"
 district_ark_city_plural: "$district_ark_city$"
 district_ark_city_desc: "Những phân khu rộng lớn trên tàu dành cho nhà ở, thương mại và đời sống cộng đồng. Trái tim sống của một nền văn minh không ngừng chuyển dịch."
 district_ark_generator: "Dãy Lò Phản Ứng"
 district_ark_generator_plural: "$district_ark_generator$"
 district_ark_generator_desc: "Các cụm lò phản ứng công suất cao bố trí dọc theo thân tàu phía dưới, truyền năng lượng thô tới từng hệ thống trên tàu."
 district_ark_basic: "Boong Tàu Phương Chu"
 district_ark_basic_name: "Nhà Ở Cơ Bản"
 district_ark_basic_plural: "$district_ark_basic$"
 district_ark_basic_desc: "Các tầng boong này của Tàu Phương Chu hiện được dùng làm nơi cư trú, nhưng có thể phát triển cho các mục đích chuyên môn hóa hơn."
 district_ark_military: "Kỹ Thuật Quân Khí"
 district_ark_military_plural: "$district_ark_military$"
 district_ark_military_desc: "Các phân khu kỹ thuật bọc thép là nơi ở của những chuyên gia phụ trách bảo trì vũ khí, hệ thống phòng thủ và độ bền vỏ tàu của Tàu Phương Chu."
 district_ark_military_name: "Lõi Kỹ Thuật"
 district_ark_military_flavor_desc: "$district_ark_military_desc$"
 pc_ark: "Tàu Phương Chu"
 mod_pc_ark_habitability: "Khả Năng Thích Nghi Tàu Phương Chu"
 job_ark_waystation_trader: "Trưởng Ban Kiểm Soát Trạm Dừng Chân"
 job_ark_waystation_trader_plural: "$job_ark_waystation_trader$"
 job_ark_waystation_trader_desc: "Quản lý từ xa các trạm là công việc đầy vất vả với nhu cầu hậu cần bất tận, nhưng bắt buộc phải có người đảm đương."
 job_ark_harvester: "Kỹ Thuật Viên Khai Thác Vũ Trụ"
 job_ark_harvester_plural: "$job_ark_harvester$"
 job_ark_harvester_desc: "Các Kỹ Thuật Viên Khai Thác Vũ Trụ đảm trách việc thu gom các mỏ tài nguyên trên quỹ đạo và xử lý chúng, gia tăng đáng kể sản lượng tài nguyên."
