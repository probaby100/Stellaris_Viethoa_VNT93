 mod_pop_ark_harvester_bonus_workforce_mult: "Hiệu Suất Việc Làm của $job_ark_harvester_plural$"
 zone_ark_missile_silos: "Giếng Phóng Tên Lửa"
 zone_ark_missile_silos_desc: "Các đội bảo trì chuyên trách giữ cho khoang tên lửa luôn sẵn sàng khai hỏa, chấp nhận tiêu hao năng lượng thô để đổi lấy hỏa lực phủ đầu."
 zone_ark_ammunition_lines: "Dây Chuyền Đạn Dược"
 zone_ark_ammunition_lines_desc: "Dây chuyền chế tạo đạn động năng hoạt động suốt ngày đêm đảm bảo các cỗ pháo không bao giờ im tiếng. Từng máy nạp, từng vỏ đạn, từng gram thuốc phóng đều được kiểm đếm chính xác."
 zone_ark_laser_capacitors: "Tụ Điện Laser"
 zone_ark_laser_capacitors_desc: "Các cụm tụ điện chu kỳ cao truyền năng lượng trực tiếp vào dàn chùm tia, duy trì tốc độ bắn mà bình thường sẽ khiến máy phát bị quá nhiệt."
 zone_ark_flight_decks: "Boong Phi Hành"
 zone_ark_flight_decks_desc: "Hoạt động huấn luyện liên tục cho phép chúng ta phối hợp nhịp nhàng giữa hỏa lực pháo chính và phi cơ tấn công với độ chính xác vô song."
