# Seize Waystation - operation_seize_waystation / nomads.8010 / 8015
 operation_seize_waystation: "Đoạt Lấy Trạm Dừng Chân"
 operation_seize_waystation_desc: "Hạm đội du mục chỉ mạnh khi mạng lưới trạm dừng chân nuôi dưỡng nó còn tồn tại. Đoạt lấy các trạm, bẻ gãy tầm vươn của chúng."
 operation_seize_waystation_on_success: "$IF_SUCCESSFUL|E$\nĐột kích một trạm dừng chân du mục, cướp tài nguyên trong kho dự trữ và tháo dỡ một mô-đun.\n\nChỉ định một §YĐặc Vụ§! cho chiến dịch này có thể giúp chúng ta phá hủy hoặc tiếp quản trạm."
 operation_seize_waystation_no_targets: "Đế chế mục tiêu không vận hành trạm dừng chân nào trong tầm quét của cảm biến."
 nomads.8010.name: "Tiếp Cận Mục Tiêu"
 nomads.8010.desc: "Các điệp viên của chúng ta đã thực hiện bước tiếp cận ban đầu tới trạm dừng chân mục tiêu. Các sơ đồ an ninh đã được lập bản đồ và tọa độ xâm nhập đã được xác định. Chúng ta sẵn sàng bước sang giai đoạn tiếp theo."
 nomads.8015.name: "Hệ Thống Bị Xâm Nhập"
 nomads.8015.desc: "Các điệp viên của chúng ta hiện đã cài cắm thành công vào đội ngũ thủy thủ, khách vãng lai và các hệ thống của trạm dừng chân. Các rơ-le an ninh chủ chốt đã bị vô hiệu hóa và thông tin liên lạc đang được chuyển qua các bộ lọc của riêng chúng ta. Số phận của trạm đã nằm trọn trong tay chúng ta."
 nomads.8020.name: "Cướp Đoạt Trạm Dừng Chân"
 nomads.8020.desc: "Mạng lưới tình báo của chúng ta đã xác định chính xác một trạm dừng chân mục tiêu. Các điệp viên đã vào vị trí và sẵn sàng. Lực lượng tăng viện đang ứng trực để đổ bộ lên trạm. Họ sẽ tấn công ngay khi có lệnh của chúng ta."
 nomads.8025.name: "Trạm Dừng Chân Bị Đột Kích"
 nomads.8025.desc: "Các điệp viên của chúng ta đã vô hiệu hóa lực lượng an ninh trên trạm §Y[target_waystation.GetName]§!, và chúng ta đang trong quá trình thu giữ tài nguyên của họ. Một khi hoàn tất, họ sẽ..."
 nomads.8025.a: "Ưu tiên bảo vệ nguồn tài nguyên dự trữ!"
 nomads.8025.a.tt: "§R[target_waystation.GetName]§! bị phá hủy."
 nomads.8025.b: "Bảo vệ các hệ thống của trạm bằng mọi giá!"
 nomads.8025.c: "Trục xuất những kẻ xâm nhập!"
 nomads.8030.name: "Phục Kích Trạm Dừng Chân"
 nomads.8030.intro: "Trạm §Y[target_waystation.GetName]§! đã bị xâm nhập! Những kẻ đột nhập đã dùng vũ lực chiếm quyền kiểm soát trạm và cướp sạch các kho dự trữ."
 nomads.8030.detected: "Những kẻ tấn công đã bị nhận diện là các điệp viên đến từ §Y[From.GetName]§!.\n\n"
 nomads.8030.anonymous: "Những kẻ tấn công đã che đậy kỹ tung tích của chúng, khiến chúng ta không thể xác định được thủ phạm đứng sau.\n\n"
 nomads.8030.destroyed: "Thiệt hại trong cuộc giao tranh quá nặng nề. Trạm dừng chân đã bị phá hủy hoàn toàn."
 nomads.8030.looted: "Một phần của trạm đã bị hư hại trong giao tranh, nhưng lực lượng an ninh của chúng ta đã giành lại quyền kiểm soát sau khi một toán địch rút lui cùng chiến lợi phẩm cướp được."
 nomads.8030.detected_destroyed.desc: "$nomads.8030.intro$ $nomads.8030.destroyed$\n\n$nomads.8030.detected$"
 nomads.8030.detected_looted.desc: "$nomads.8030.intro$ $nomads.8030.looted$\n\n$nomads.8030.detected$"
 nomads.8030.destroyed.desc: "$nomads.8030.intro$ $nomads.8030.destroyed$\n\n$nomads.8030.anonymous$"
 nomads.8030.looted.desc: "$nomads.8030.intro$ $nomads.8030.looted$\n\n$nomads.8030.anonymous$"
 nomads.8030.stolen.desc: "$nomads.8030.intro$ Giờ đây đã rõ ràng rằng §Y[From.GetName]§! chính là kẻ đứng sau chiến dịch này, khi chúng hiện đã trực tiếp nắm quyền kiểm soát trạm dừng chân, chia cắt nó hoàn toàn khỏi mạng lưới tuyến trạm của chúng ta."

