 # Aetherophasic Anchor Waystation Module
 sm_waystation_aetherophasic_anchor: "Mỏ Neo Dĩ Thái Tương"
 sm_waystation_aetherophasic_anchor_desc: "Công trình này neo hạm đội di động của chúng ta vào một điểm cố định trong vũ trụ. Bằng cách thả neo Trạm Dừng Chân tại đây, chúng ta chỉ định hệ sao này là tâm điểm để xây dựng §H$crisis_sphere_0$§!. Năng lượng chúng ta thu hoạch khắp các vì sao sẽ hội tụ tại đây, xé toạc ranh giới giữa các thế giới."
 requires_waystation_aetherophasic_anchor: "Các đế chế du mục phải chỉ định một mô-đun Trạm Dừng Chân §HMỏ Neo Dĩ Thái Tương§! trước khi kích hoạt giai đoạn cuối cùng. Hãy xây dựng mô-đun này trên một Trạm Dừng Chân để chọn hệ sao sẽ chứa §H$crisis_sphere_0$§!."

