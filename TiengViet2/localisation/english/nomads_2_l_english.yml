 concept_arkship_embark: "Đăng Thuyền Lên Tàu"
 concept_arkship_embarking: "Đang Đăng Thuyền"
 concept_arkship_embarkation: "$decision_nomad_embarkation$"
 concept_arkship_embark_desc: "£embark£ §H$concept_arkship_embark$§! là khi một £planet£ ['concept_settled_empire'] rời bỏ ['concept_habitable_world'] của họ và bước lên một £arkship£ ['concept_arkship'] để trở thành một £nomad£ ['concept_nomadic_empire'].\n\nĐiều này đòi hỏi phải hoàn thành nhánh truyền thống ['tradition_category:tradition_adaptability'] hoặc ['tradition_category:tradition_versatility'].\n\nĐể §HĐăng Thuyền Lên Tàu§!, hãy mở giao diện ['concept_decisions'] tại một £colony£ ['concept_colony'] và chọn §H$decision_nomad_embarkation$§!.\n\nNếu một đế chế sở hữu nhiều ['concept_colonies'], họ có thể chọn để chúng lại phía sau như một ['concept_subject'], hoặc thay vào đó giải phóng Đế Chế Du Mục mới thành lập như một §H$concept_subject$§!.\n\nToàn bộ ['concept_starbases'] sở hữu sẽ chuyển đổi thành £waystation£ ['concept_waystations'], và hành tinh đã đăng thuyền trở thành một §H$stripped_planet$§!."

