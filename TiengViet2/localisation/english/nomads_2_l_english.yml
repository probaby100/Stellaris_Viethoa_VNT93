 pc_ark_desc: "Thế giới của chúng ta hóa thành con tàu, và con tàu đã trở thành thế giới của chúng ta."
 zone_ark_military_eco: "Lò Rèn Hư Không"
 zone_ark_military_eco_desc: "Việc chuyên môn hóa một phần xưởng đúc của chúng ta để trực tiếp chế tạo các tấm giáp tiêu chuẩn mang lại nguồn cung linh kiện giáp bảo vệ thay thế sẵn có."
 zone_ark_shipwright: "Khu Xưởng Đóng Tàu"
 zone_ark_shipwright_desc: "Bằng cách đưa hoạt động đóng tàu và dịch vụ bảo trì vào lịch trình quân sự, chúng ta có thể điều động binh lính hỗ trợ các xưởng đóng tàu hải quân."
 zone_ark_shipwright_module_synergy_tt: "Việc làm $soldier_type_plural_with_icon$ từ các Mô-đun §H$sm_naval_support_cat$§!: §G+$@arkship_module_jobs|0$§!"
