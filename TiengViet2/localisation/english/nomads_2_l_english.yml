 # Singular: £nomad£ ['concept_nomadic_empire'] or £nomad£ §H$concept_nomadic_empire$§!
 # Plural: £nomad£ ['concept_nomadic_empires'] or £nomad£ §H$concept_nomadic_empires$§!
 concept_nomadic_empire: "Đế Chế Du Mục"
 concept_nomadic_empires: "Đế Chế Du Mục"
 concept_nomadic_empire_desc: "£nomad£ §H$concept_nomadic_empires$§! là các nền văn minh vận hành từ các £arkship£ ['concept_arkships'] cơ động thay vì các £colony£ ['concept_colonies'] cố định. Họ không tuyên bố chủ quyền đối với £system£ ['concept_systems'] hoặc thuộc địa hóa các £planet£ ['concept_planets'].\n\n§HĐế Chế Du Mục§! có thể xây dựng các £waystation£ ['concept_waystations'] để thu gom tài nguyên, và có thể tiếp nhận £contract£ ['concept_contracts'] từ các £planet£ ['concept_settled_empires']."

 # Singular: £district£ ['concept_district_ark_military'] or £district£ §H$concept_district_ark_military$§!
 # Plural: £district£ ['concept_district_ark_military_plural'] or £district£ §H$cconcept_district_ark_military_plural$§!
 concept_district_ark_military: "$district_ark_military$"
 concept_district_ark_military_plural: "$district_ark_military_plural$"
 concept_district_ark_military_desc: "- £housing£ ['concept_housing']: §G+200§!\n- Việc làm ['concept_technicians'] £mod_job_technician_add£: §G+200§!\n\n§L$district_generator_desc$§!"

 # Singular: ['concept_operational_reserves'] or §H$concept_operational_reserves$§!
 concept_operational_reserves: "Dự Trữ Vận Hành"
 concept_operational_reserves_desc: "§H$concept_operational_reserves$§! của £nomad£ ['concept_nomadic_empires'] là cái nhìn tổng hợp về cả £minerals£ ['concept_minerals'] lẫn £energy£ ['concept_energy'].\n\nVẫn có thu nhập và chi phí duy trì của £minerals£ §H$concept_minerals$§! cùng £energy£ §H$concept_energy$§!, nhưng được quản lý dưới dạng một ['concept_situation'].\n\nMột điểm §H$concept_operational_reserves$§! tương đương một £minerals£ §HKhoáng Sản§! hoặc một £energy£ §HNăng Lượng Tín Dụng§!.\n\n$nomad_max_reserves_breakdown$\n\nCác §HGiai Đoạn§! của tình huống sẽ ảnh hưởng đến £arkship£ ['concept_arkships'] của đế chế theo những cách khác nhau, và các §HPhương Thức Tiếp Cận§! có thể được chọn để tiết kiệm tài nguyên hoặc đốt nhanh chúng nhằm đạt năng suất cao hơn.\n\n£minerals£ §H$concept_minerals$§! và £energy£ §H$concept_energy$§! có thể mua trên £market£ ['concept_market'], nhưng không thể bán."
 operational_reserves_desc: "§t$concept_operational_reserves_desc$§!\n\n§GClick ['concept_operational_reserves'] để mở Cơ Sở Dữ Liệu\nClick £operational_reserves£ trong menu để mở ['concept_situation_log_view']§!"

 # Singular: £planet£ ['concept_settled_empire'] or £planet£ §H$concept_settled_empire$§!
 # Plural: £planet£ ['concept_settled_empires'] or £planet£ §H$concept_settled_empires$§!
 concept_settled_empire: "Đế Chế Định Cư"
 concept_settled_empires: "Đế Chế Định Cư"
 concept_settled_empire_desc: "£planet£ §H$concept_settled_empires$§! là các nền văn minh cai trị từ các £colony£ ['concept_colonies'] cố định trên các £planet£ ['concept_planets'], tuyên bố chủ quyền đối với các £system£ ['concept_systems'] và phòng thủ chúng bằng ['concept_starbases'].\n\nTừ góc nhìn của các £nomad£ ['concept_nomadic_empires'], §HĐế Chế Định Cư§! là những đối tác tiềm năng cho các £contract£ ['concept_contracts'] và ['concept_diplomatic_pacts'], mặc dù xích mích ngoại giao có thể phát sinh khi các hạm đội du mục băng qua biên giới của họ."

 # Singular: £contract£ ['concept_contract'] or £contract£ §H$concept_contract$§!
 # Plural: £contract£ ['concept_contracts'] or £contract£ §H$concept_contracts$§!
 concept_contract: "Hợp Đồng"
 concept_contracts: "Hợp Đồng"
 concept_contract_desc: "£contract£ §H$concept_contracts$§! là các nhiệm vụ được giao cho £nomad£ ['concept_nomadic_empires'] bởi £planet£ ['concept_settled_empires'], hoặc các nhiệm vụ nội bộ từ chính các bộ phận của §H$concept_nomadic_empire$§!.\n\nNhững nhiệm vụ này trải dài từ việc đột kích đối thủ cạnh tranh đến vận chuyển các nhà ngoại giao, và thường chỉ có thể hoàn thành bởi £arkship£ ['concept_arkships'].\n\n§HHợp Đồng§! được liệt kê trong tab $situation_log_view_tab_situation_log$ của giao diện £interface£ ['concept_situation_log_view']."

 # Singular: £waystation£ ['concept_waystation'] or £waystation£ §H$concept_waystation$§!
 # Plural: £waystation£ ['concept_waystations'] or £waystation£ §H$concept_waystations$§!
 concept_waystation: "$waystation$"
 concept_waystations: "$waystation_plural$"
 concept_waystation_desc: "£waystation£ §H$concept_waystations$§! là các trạm không gian do các £nomad£ ['concept_nomadic_empires'] xây dựng, có thể thu gom tài nguyên thiên thể và hình thành các tuyến đường thương mại liên sao gọi là £wayline£ ['concept_waylines'].\n\nTài nguyên thu gom được bởi §H$concept_waystations$§! được lưu giữ trong §HKho Dự Trữ Trạm Dừng Chân§! cho đến khi có một £construction_ship£ ['concept_logistic_ship'] hoặc £arkship£ ['concept_arkship'] ghé thăm.\n\n§H$concept_waystations$§! có thể được xây dựng trong các £system£ ['concept_systems'] mà không cần sự cho phép từ §HChủ Sở Hữu Hệ Sao§!, điều này sẽ gây ra Hình Phạt Ngoại Giao với Chủ Sở Hữu Hệ Sao, trao cho họ Mục Tiêu Chiến Tranh §H$war_goal_wg_expel_nomads$§!. Ký kết một ['concept_wayline_pact'] sẽ xóa bỏ các hình phạt này. $DOUBLE_NEW_LINE$Số lượng §H$concept_waystations$§! mà một đế chế có thể hỗ trợ bị giới hạn bởi ['concept_starbase_capacity'] của họ."

 # Singular: £wayline£ ['concept_wayline'] or £wayline£ §H$concept_wayline$§!
 # Plural: £wayline£ ['concept_waylines'] or £wayline£ §H$concept_waylines$§!
 concept_wayline: "Tuyến Trạm"
 concept_waylines: "Tuyến Trạm"
 concept_wayline_desc: "£wayline£ §H$concept_waylines$§! là các tuyến thương mại liên sao được hình thành bởi các £waystation£ ['concept_waystations'] tại các £system£ ['concept_systems'] lân cận.\n\n§HMô-đun Trạm Dừng Chân§! cung cấp các hiệu ứng và bộ điều chỉnh lan truyền dọc theo §H$concept_wayline$§! và được chia sẻ thông qua ['concept_wayline_pacts'] với §HChủ Sở Hữu Hệ Sao§!. Ví dụ, §H$sm_waystation_logistics_hub$§! cho phép thu gom tài nguyên dự trữ từ mọi £waystation£ §H$concept_waystations$§! dọc theo toàn bộ một §H$concept_wayline$§!."

 # Singular: ['concept_wayline_pact'] or §H$concept_wayline_pact$§!
 # Plural: ['concept_wayline_pacts'] or §H$concept_wayline_pacts$§!
 concept_wayline_pact: "$wayline_pact$"
 concept_wayline_pacts: "$wayline_pact_plural$"
 concept_wayline_pact_desc: "§H$concept_wayline_pacts$§! là ['concept_diplomatic_pacts'] được ký kết giữa một £nomad£ ['concept_nomadic_empire'] và một đế chế khác. Các thỏa thuận này cho phép cả hai Đế chế hưởng lợi từ các §HBộ Điều Chỉnh§! £wayline£ ['concept_wayline'] lan truyền dọc theo §HTuyến Trạm§!.\n\nNgoài ra, khi được ký giữa một §H$concept_nomadic_empire$§! và một £planet£ ['concept_settled_empire'], mọi Hình Phạt Ngoại Giao do §HTuyến Trạm§! gây ra sẽ được bỏ qua."

# Singular: £construction_ship£ ['concept_logistic_ship'] or £construction_ship£ §H['concept_logistic_ships']§!
# Plural: £construction_ship£ ['concept_logistic_ships'] or £construction_ship£ §H['concept_logistic_ships']§!
 concept_logistic_ship: "$nomads_constructor$"
 concept_logistic_ships: "$nomads_constructor_plural$"
 concept_logistic_ship_desc: "Một £construction_ship£ §H$concept_logistic_ship$§! có thể khai thác tài nguyên từ các thiên thể và vận chuyển chúng về $arkship_cap_plural$ của chúng ta.$tt_use$- ['scripted_action:logistic_harvest_resources'] từ Hành Tinh, Mặt Trăng và Tiểu Hành Tinh$NEW_LINE$- Xây dựng £waystation£ ['concept_waystations'] trong các hệ sao £system£ ['concept_systems'] để mở rộng £wayline£ ['concept_waylines'] của chúng ta$NEW_LINE$- Xây dựng ['concept_megastructures'] $NEW_LINE$- Thu gom tài nguyên từ £waystation£ §H$concept_waystations$§! $NEW_LINE$- Không thể đóng mới £arkship£ ['concept_arkships'], điều mà chỉ các §HTàu Phương Chu§! khác mới làm được $NEW_LINE$- Nghiên cứu một số ['concept_special_projects']$tt_gain$- Đóng §H$concept_logistic_ships$§! trên một £arkship£ ['concept_arkship']"

 # Singular: £arkship£ ['concept_arkship'] or £arkship£ §H$concept_arkship$§!
 # Plural: £arkship£ ['concept_arkships'] or £arkship£ §H$concept_arkships$§!
 concept_arkship: "$arkship_cap$"
 concept_arkships: "$arkship_cap_plural$"
 concept_arkship_desc: "£arkship£ §H$concept_arkships$§! là những con tàu khổng lồ chở các £nomad£ ['concept_nomadic_empires'] qua khoảng không vô tận của vũ trụ, vừa đóng vai trò như một £colony£ ['concept_colony'], ['concept_starbase'], vừa là một ['concept_military_ship']. $DOUBLE_NEW_LINE$- Với tư cách là §HThuộc Địa§!, chúng bao gồm các £district£ ['concept_districts'], £zone£ ['concept_district_specializations'], £building£ ['concept_buildings'] và £pop£ ['concept_pops']. $NEW_LINE$- Với tư cách là §HCăn Cứ Sao§!, chúng hoạt động như các ['concept_shipyards'] và có thể tùy chỉnh với các §HMô-đun Phương Chu§! và §HHệ Thống§!. $NEW_LINE$- §H$concept_arkships$§! có hàng đợi xây dựng chung cho tất cả các công trình §HThuộc Địa§! và §HCăn Cứ Sao§!. $NEW_LINE$- Với tư cách là §HTàu Quân Sự§!, §H$concept_arkships$§! sở hữu nhiều khoang chứa phi cơ và phòng thủ điểm, cùng lớp giáp và lá chắn kiên cố. $NEW_LINE$- §H$concept_arkships$§! có thể thu gom tài nguyên dự trữ từ các £construction_ship£ ['concept_logistic_ships'] và £waystation£ ['concept_waystations']. $NEW_LINE$- §H$concept_arkships$§! có thể thực hiện các hành động chiến lược bổ sung, bao gồm: $TABBED_NEW_LINE$- ['concept_survey'] $TABBED_NEW_LINE$- ['concept_megastructure', $BUILD_MEGASTRUCTURE_ORDER$] $TABBED_NEW_LINE$- ['scripted_action:arkship_harvest_resources'] $TABBED_NEW_LINE$- §HMô-đun Phương Chu§! mở khóa các hành động nâng cao hơn. $NEW_LINE$- Các §H$concept_arkships$§! mới có thể được chế tạo dưới dạng ['concept_megastructures'] bởi các §H$concept_arkships$§! khác sau khi nghiên cứu £engineering_research£ §Y$tech_arkship_construction$§!. $NEW_LINE$- §H$concept_arkships$§! có thể nâng cấp sau khi nghiên cứu £engineering_research£ §Y$tech_arkship_tier_2$§! và £engineering_research£ §Y$tech_arkship_tier_3$§!."

