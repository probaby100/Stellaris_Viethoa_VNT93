 neutron_star_nomad_init_NAME: "Tàn Dư Siêu Tân Tinh £nomad£"
 neutron_star_nomad_init_DESC: "$nomadic_system_initializer$Tàn tích vật chất đậm đặc sau một vụ nổ siêu tân tinh, bao bọc bởi những thế giới đá bị thiêu rụi và mảnh vụn nhiễm xạ nặng nề.\n\n$system_initializer_DESC$"

 blue_giant_nomad_init_NAME: "Sao Khổng Lồ Phát Quang £nomad£"
 blue_giant_nomad_init_DESC: "$nomadic_system_initializer$Một sao khổng lồ xanh rực rỡ dữ dội, đang thiêu đốt nhiên liệu của nó với tốc độ hủy diệt.\n\n$system_initializer_DESC$"

 xray_binary_nomad_init_NAME: "Hệ Đôi Sao Trung Tử £nomad£"
