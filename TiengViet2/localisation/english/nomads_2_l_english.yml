 concept_arkship_settle: "Định Cư"
 concept_arkship_settling: "Đang Định Cư"
 concept_arkship_settlement: "$arkship_settle$"
 concept_arkship_settle_desc: "£settle£ §H$concept_arkship_settle$§! là khi một £arkship£ ['concept_arkship'] định cư vĩnh viễn trên một thế giới, kết thúc hành trình du mục của nó.\n\nĐiều này đòi hỏi phải hoàn thành nhánh truyền thống ['tradition_category:tradition_adaptability'] hoặc ['tradition_category:tradition_versatility'].\n\nĐể §H$concept_arkship_settle$§!, hãy chọn một §HTàu Phương Chu§! và nhấp chuột phải vào một ['concept_habitable_world'] chưa có người định cư hoặc nhấp nút §HĐịnh Cư§! trong giao diện £interface£ ['concept_colony_view'].\n\nMột đế chế có thêm các §HTàu Phương Chu§! có thể chọn để chúng tiếp tục cuộc sống du mục và biến thế giới mới £planet£ ['concept_settled_empire'] thành một ['concept_subject'].\n\nCác £waystation£ ['concept_waystations'] trong các £system£ ['concept_systems'] vô chủ sẽ được chuyển đổi thành ['concept_outposts']."

 # Verb (action): £embark£ ['concept_arkship_embark'] or £embark£ §H$concept_arkship_embark$§!
