 zone_ark_reactor_physics: "Máy Gia Tốc Hạt Năng Lượng Cao"
 zone_ark_reactor_physics_desc: "Một cơ sở nghiên cứu vật lý năng lượng cao chuyên dụng khai thác năng lượng từ trung tâm Tàu Phương Chu."
 zone_ark_farm_society: "Quan Sát Xã Hội - Sinh Thái"
 zone_ark_farm_society_desc: "Các phòng thí nghiệm chuyên dụng này được các nhà nghiên cứu sử dụng để thực hiện các nghiên cứu quan sát trên cư dân của Tàu Phương Chu."
 zone_ark_military_engineering: "Khu Phức Hợp Nghiên Cứu Quân Sự"
 zone_ark_military_engineering_desc: "Sự trao đổi liên ngành giữa các nhà nghiên cứu của chúng ta và những người chịu trách nhiệm bảo trì Tàu Phương Chu mang lại những kết quả thực tiễn."
