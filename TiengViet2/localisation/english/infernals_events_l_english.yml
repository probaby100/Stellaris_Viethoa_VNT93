# RG Timeline events
 TIMELINE_EVENT_ORIGIN_RG_START: "$origin_red_giant$\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_START_TOOLTIP: "§HĐường Hầm Xuyên Sao§!\n§YSự Kiện Khởi Nguyên§!\n\nChúng ta phát hiện ra một loạt các nhiễu loạn á không gian. Cuộc tìm kiếm nguồn gốc sự bất ổn đầy hiểm nguy của ngôi sao đã bắt đầu."
 TIMELINE_EVENT_ORIGIN_RG_END_NOVA: "Cái Chết Của Kẻ Khổng Lồ\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_END_NOVA_TOOLTIP: "§HChứng Kiến Siêu Tân Tinh§!\n§YSự Kiện Khởi Nguyên§!\n\nNgôi sao của chúng ta đã nở rộng nuốt chửng toàn bộ hệ sao, biến các hành tinh thành phế tích nóng chảy và rải rác tài nguyên khắp hư không. Giờ đây chúng ta không còn lựa chọn nào khác ngoài việc kiến tạo một tương lai mới giữa các vì sao."
 TIMELINE_EVENT_ORIGIN_RG_END_STABLE: "Kẻ Khổng Lồ Được Xoa Dịu\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_END_STABLE_TOOLTIP: "§HCứu Lấy Quê Nhà§!\n§YSự Kiện Khởi Nguyên§!\n\nĐã đạt được sự ổn định kích thước sao, ngăn chặn sự sụp đổ thảm khốc. Sản lượng tăng cao của ngôi sao sẽ đòi hỏi sự thích nghi, nhưng khi vượt qua những thách thức này, chúng ta sẽ trỗi dậy mạnh mẽ hơn bao giờ hết."
 TIMELINE_EVENT_ORIGIN_RG_END_NORMAL: "Kẻ Khổng Lồ Bình Yên\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_END_NORMAL_TOOLTIP: "§HCứu Lấy Quê Nhà§!\n§YSự Kiện Khởi Nguyên§!\n\nChúng ta đã đảo ngược những biến đổi tàn khốc đối với ngôi sao quê hương, đưa nó trở lại trạng thái thanh bình nơi chúng ta đã tiến hóa. Chúng ta đã chứng minh rằng mình có thể vượt qua ngay cả hiểm họa tận thế tồi tệ nhất, và giờ đây sẵn sàng đối mặt với bất cứ điều gì mà vũ trụ giáng xuống."

# COSMIC DAWN
# All strings below are in order of their appearance ingame
 infernals.2500.name: "Tín Hiệu Trong Lòng Sâu" # intro
 infernals.2500.desc: "Các bản quét nhắm mục tiêu đã tìm thấy bằng chứng về các cơ sở phức tạp được chôn sâu bên dưới bề mặt của §Y[root.capital_scope.GetName]§!, ngày càng tăng về quy mô và độ phức tạp khi tiến gần đến lõi. Dấu vết vật chất và năng lượng của chúng khớp với những dấu vết của buồng ngủ đông nơi chúng ta thức tỉnh lần đầu tiên.\n\nĐây hẳn phải là những tàn tích của nền văn minh trước đây của chúng ta. Nếu có thể tiếp cận các cơ sở này, chúng ta có thể tìm thấy câu trả lời cho những câu hỏi lớn nhất về quá khứ của mình: chúng ta là ai, và điều gì đã xảy ra với chúng ta?"
 infernals.2500.a: "Hành trình của chúng ta bắt đầu."

 INF_ORIGIN_COSMIC_DAWN_DRILLING: "Khoan Sâu Vào Vỏ Địa Cầu" # from 2500
 INF_ORIGIN_COSMIC_DAWN_DRILLING_DESC: "Nếu muốn hiểu mình là ai, trước tiên chúng ta phải biết mình đến từ đâu. Chúng ta sẽ cần khai quật các cơ sở bị chôn vùi bên dưới bề mặt của §Y[owner.Capital.GetName]§!."
 infernals.2505.name: "Thêm Nhiều Đồng Loại Thức Tỉnh"
 infernals.2505.desc.a: "Chúng ta đã phát hiện thêm nhiều kén ngủ đông chứa các cá thể §Y[root.GetSpeciesNamePlural]§! còn sống. Chúng ta đang trong quá trình đánh thức họ, nhưng dường như họ cũng chẳng có nhận thức rõ ràng hơn về quá khứ so với chúng ta."
 infernals.2505.desc.b: "Chúng ta đã phát hiện thêm nhiều kén ngủ đông chứa các cá thể §Y[root.GetSpeciesNamePlural]§! còn sống. Ngay cả sau khi tích hợp, rõ ràng là họ hoàn toàn không có những ký ức hữu ích nào."
 infernals.2505.a: "Cho phép một cuộc khai quật toàn diện."
 infernals.2505.b: "Chỉ dỡ bỏ những gì thật sự cần thiết."
 infernals.2505.c: "Thuê các nhà thầu phụ để đào bới."

 situation_cosmic_dawn: "Khai Quật Tầng Sâu"
 situation_cosmic_dawn_type: "$situation_cosmic_dawn$"
 situation_cosmic_dawn_monthly_change_tooltip: "Tiến độ hiện tại của cuộc khai quật tầng sâu của chúng ta."
 situation_cosmic_dawn_desc: "Cuộc khai quật của chúng ta đã hé lộ các cơ sở dưới lòng đất chứa đựng công nghệ tiên tiến, dữ liệu lưu trữ và các kén ngủ đông chứa nhiều đồng loại đang say ngủ của chúng ta hơn. Chính lịch sử của chúng ta đang được chôn vùi tại đây; nếu chúng ta có thể đào nó lên toàn bộ, cuối cùng chúng ta có thể hiểu được mình thực sự là ai."
 situation_cosmic_dawn_finish_tt: "Để hiểu thêm về bản thân, chúng ta phải tái khám phá quá khứ xa xôi của mình."
 situation_cd_mod_mining: "$approach_cd_mining$"
 situation_cd_mod_drilling: "$approach_cd_drilling$"
 situation_cd_mod_financial: "$approach_cd_financial$"
 situation_cd_mod_storm: "$TRIGGER_FAIL$ Dự án đặc biệt §Y$INF_ORIGIN_COSMIC_DAWN_STORM$§! chưa hoàn thành"
 situation_cd_mod_bribe: "$TRIGGER_FAIL$ Dự án đặc biệt §Y$INF_ORIGIN_COSMIC_DAWN_BRIBE$§! chưa hoàn thành"

 sit_cd_stage1_tt: "Chúng ta đã bắt đầu xuyên thủng lớp vỏ của hành tinh."
 sit_cd_stage2_tt: "Từ độ sâu này, chúng ta không còn nhìn thấy bề mặt nữa."
 sit_cd_stage3_tt: "Đã đi được nửa chặng đường qua lớp vỏ, nhiệt độ đang tăng dần."
 sit_cd_stage4_tt: "Đã tiến sâu vào lớp vỏ tới mức này, chúng ta có thể nghe thấy tiếng cuộn trào của lõi hành tinh."
 sit_cd_stage5_tt: "Chúng ta không thể tiến xa hơn nữa trước khi bị nuốt chửng bởi lõi hành tinh."
 approach_cd_mining: "Khai Thác Lộ Thiên"
 approach_cd_mining_tt: "Huy động mọi người cùng đào bới. Trong khi ở dưới đó, chúng ta cũng có thể thu thập tài nguyên khoáng sản. \nTiến Độ Hàng Tháng: §Y+$@approach_cd_mining$§!\n\n"
 approach_cd_drilling: "Khoan Định Hướng"
 approach_cd_drilling_tt: "Triển khai những thiết bị khoan tốt nhất và chính xác nhất mà chúng ta có. Chỉ đào những gì bắt buộc phải đào. \nTiến Độ Hàng Tháng: §Y+$@approach_cd_drilling$§!\n\n"
 approach_cd_financial: "Khuyến Khích Tài Chính"
 approach_cd_financial_tt: "Chuyển hướng ủy quyền của các nhà thầu phụ khai khoáng sang lộ trình này, và giữ lại một phần lợi nhuận của họ cho chính chúng ta. \nTiến Độ Hàng Tháng: §Y+$@approach_cd_financial$§!\n\n"

# Stage 2
 infernals.2510.name: "Mất Trí Nhớ Và Dữ Liệu"
 infernals.2510.intro: "Khi chúng ta tiếp tục khám phá thêm các kén ngủ đông, chúng ta nhận thấy rằng sự mất mát ký ức gần như là triệt để."
 infernals.2510.desc.a: "$infernals.2510.intro$\n\nMột số đồng loại mới thức tỉnh của chúng ta đã hỏi đúng câu hỏi mà chúng ta hiện đang suy ngẫm: bạn là ai?\n\nBất chấp hàng thế kỷ lịch sử và một xã hội ngày càng phát triển, chúng ta không thể khẳng định mình tiến gần đến câu trả lời hơn họ.\n\n$infernals.2510.outro$"
 infernals.2510.desc.b: "$infernals.2510.intro$\n\nMột khi được đánh thức, những đồng loại đang ngủ này tiếp tục thiếu đi những ký ức thích hợp về nguồn gốc của chúng ta, cũng như những người khác. Trong sự thiếu vắng câu trả lời, chúng ta buộc phải tự vạch ra lộ trình của riêng mình qua dòng lịch sử.\n\n$infernals.2510.outro$"
 infernals.2510.outro: "Không giống như những người ngủ đông, cơ sở dữ liệu của họ chứa đựng những thông tin mới đáng kinh ngạc. Chúng ta đã lặp lại phân tích nhiều lần để xác nhận, nhưng kết quả là không thể chối cãi. Dữ liệu chỉ ra rằng hơn mười hai tỷ năm đã trôi qua kể từ khi chúng ta lần đầu tiên bước vào trạng thái ngủ đông.\n\nĐiều này đặt nguồn gốc của chúng ta gần với điểm khởi đầu của vũ trụ, giữa sự hình thành của những ngôi sao và hành tinh sớm nhất. Chúng ta có thể là một trong những giống loài có tri giác đầu tiên từng tiến hóa."
 infernals.2510.a: "Bắt kịp những gì chúng ta đã bỏ lỡ."
 infernals.2510.b: "Vũ trụ này đương nhiên là của chúng ta."

# Stage 3
 infernals.2515.name: "Hỏng Hóc Hệ Thống Hỗ Trợ Sinh Tồn"
 infernals.2515.desc: "Chúng ta đã khai quật được một bi kịch. Các bản nhật ký từ cơ sở kén ngủ đông nguyên vẹn này tiết lộ rằng §Y[event_target:homeworld.GetName]§! đã trôi dạt hàng tỷ năm trước khi bị ngôi sao hiện tại của nó bắt giữ. Sự bắt giữ đó đã kích hoạt một đợt triều cường khổng lồ.\n\nDù những lực lượng đó đã tôi rèn nên thiên đường núi lửa mà chúng ta hiện gọi là nhà, sóng xung kích ban đầu đã làm nứt vỡ nghiêm trọng các tế bào năng lượng của cơ sở. Các hệ thống tự động ưu tiên các cá nhân cấp cao, tắt các kén cấp thấp hơn và ngừng bảo trì cấu trúc. \n\nCác [GetScientistPlural] của chúng ta dự đoán rằng chỉ có thể cứu được một cá nhân trước khi việc kích hoạt làm tổn hại nguồn cung cấp năng lượng đang rò rỉ và dẫn đến sụp đổ toàn bộ đường hầm. \n\nNếu thứ bậc không quyết định quyền ưu tiên, chúng ta có thể đã cứu được nhiều người hơn."
 infernals.2515.a: "Tiến bộ khoa học là tối thượng."
 infernals.2515.a.tt: "Nhận được Lãnh đạo: £scientist£ §Y$scientist$§!"
 infernals.2515.b: "Ưu tiên các chuyên gia là một lựa chọn đúng đắn."
 infernals.2515.b.tt: "Nhận được Lãnh đạo: £official£ §Y$official$§!"
 infernals.2515.c: "Vô hiệu hóa các tế bào mà không kích hoạt."
 infernals.2515.c.tt: "Các cá nhân có thể thay thế được, nhưng đế chế của chúng ta cần không gian để phát triển."

 infernals.2520.name: "Nơi Trú Ẩn Liên Sao"
 infernals.2520.desc: "§Y[event_target:leader.GetName]§! đang tái thiết lập các kho lưu trữ ngủ đông của họ. Những phát hiện mới nhất của họ cho thấy vô số quần thể [root.GetSpeciesNamePlural] thiểu số có thể nằm rải rác khắp thiên hà, được bảo tồn trong trạng thái ngủ đông như chúng ta từng như vậy.\n\nCác kho lưu trữ đã ghi lại vị trí của những thế giới này, nhưng với toàn bộ các ngôi sao sinh ra và mất đi kể từ đó, việc định vị chúng bây giờ đòi hỏi phép nội suy phức tạp. Để chứng minh khái niệm, [event_target:leader.GetName] đã xác định được một hành tinh như vậy, nhưng việc dịch thuật toàn bộ tập dữ liệu chỉ mới bắt đầu.\n\nTrong khi đó, một suy nghĩ đáng lo ngại nảy sinh: [root.Capital.GetStarName] có thể không phải là ngôi sao quê hương thực sự của chúng ta, mà chỉ là một nơi trú ẩn trong số rất nhiều nơi. Nếu vậy, nguồn gốc của chúng ta ở đâu? Và điều đó liệu có còn quan trọng không?"
 infernals.2520.a: "Chúng ta phải tìm kiếm đồng loại của mình."
 infernals.2520.b: "Thế giới này nay đã là nhà của chúng ta."

 cosmic_dawn_anomalies_event_chain_title: "Nơi Trú Ẩn Liên Sao"
 cosmic_dawn_anomalies_event_chain_desc: "Vô số quần thể [root.GetSpeciesNamePlural] ẩn giấu có thể nằm rải rác khắp thiên hà, được bảo tồn trong trạng thái ngủ đông như chúng ta từng như vậy.\n\nCác kho lưu trữ đã ghi lại vị trí của những thế giới này, nhưng với toàn bộ các ngôi sao sinh ra và mất đi kể từ đó, việc định vị chúng bây giờ đòi hỏi phép nội suy phức tạp."

# Anomaly 2
 cosmic_dawn_sleepers_category: "Những Kẻ Ngủ Đông Cô Lập"
 cosmic_dawn_sleepers_category_desc: "Hành tinh tại tọa độ này được cho là che giấu một kho chứa những kẻ ngủ đông và công nghệ. Chúng ta nên điều tra kỹ lưỡng."
 infernals.2525.name: "$cosmic_dawn_sleepers_category$"
 infernals.2525.desc: "§Y[root.leader.GetName]§! đã phát hiện ra một cơ sở dưới lòng đất chứa nhiều đồng loại của chúng ta đang ngủ đông, và đã đánh thức họ thành công. Không giống như chúng ta, họ vẫn giữ được những ký ức mờ nhạt về tiền kiếp của mình, và được nâng đỡ bởi những câu chuyện về một đế chế không gian vĩ đại có thể một ngày nào đó sẽ quay trở lại giải cứu họ.\n\nHọ thận trọng nhưng nhận ra chúng ta là đồng loại. Chúng ta có thể thể hiện mình là những đấng cứu thế được mong đợi từ lâu, những người thừa kế vinh quang cổ xưa đó. Hoặc chúng ta có thể nói sự thật: chúng ta đang tôi rèn một điều gì đó hoàn toàn mới, và háo hức học hỏi từ họ cũng như chúng ta muốn chỉ dạy cho họ.\n\nNhững tài liệu tham khảo bổ sung trong các kho lưu trữ này đã cho phép chúng ta thu hẹp ứng viên thứ hai có các kén ngủ đông."
 infernals.2525.a: "Chúng ta là những đấng cứu thế cổ xưa của họ."
 infernals.2525.b: "Chúng ta đang kiến tạo một điều mới mẻ."
 infernals.2525.c: "Đồng hóa họ."

# Anomaly 3
 cosmic_dawn_sleepers2_category: "Những Kẻ Ngủ Đông Cảnh Giác"
 cosmic_dawn_sleepers2_category_desc: "$cosmic_dawn_sleepers_category_desc$"
 infernals.2530.name: "$cosmic_dawn_sleepers2_category$"
 infernals.2530.desc: "§Y[root.leader.GetName]§! đã phát hiện thêm nhiều đồng loại trong trạng thái ngủ đông và đã thành công đánh thức họ, nhưng họ đáp lại bằng sự sợ hãi, yêu cầu chúng ta rời đi. Họ không nhận chúng ta là đồng loại cũng chẳng hoan nghênh sự hiện diện của chúng ta.\n\nSau cuộc đàm phán căng thẳng, họ bày tỏ mong muốn rời đi và khám phá thiên hà. Chúng ta có thể cung cấp cho họ một con tàu đơn giản với chi phí vừa phải. Hoặc, trước nhu cầu lao động liên tục của mình, chúng ta di dời họ đến thuộc địa gần nhất. Có lẽ khi đó họ sẽ nhận ra lẽ phải.\n\nKho lưu trữ của cơ sở này hiển thị vị trí của một thế giới khác có nhiều kén ngủ đông hơn."
 infernals.2530.a: "Trao cho họ một con tàu."
 infernals.2530.b: "Mang họ về nhà."
 infernals.2530.b.tt: "Nhận được £pop£ $POPS$: §G+200§!"
 infernals.2530.c: "Đồng hóa họ."

# Ship returns
 infernals.2531.name: "Sự Trở Về"
 infernals.2531.desc: "Những kẻ ngủ đông đã nhận con tàu của chúng ta nay đã trở lại, trên một chiến hạm khổng lồ, không hơn không kém. Hành trình của họ qua thiên hà đã đưa họ vào cuộc xung đột với hải tặc, những kẻ mà họ đã dùng mưu mẹo vượt mặt và cuối cùng lật đổ.\n\nViệc đánh chiếm con tàu của kẻ thù đã làm bùng cháy điều gì đó trong họ: sở thích cướp bóc vũ trụ. Từ đó, các cuộc đột kích của họ ngày càng táo bạo hơn, mục tiêu của họ ngày càng mạnh hơn. Nhưng ngay cả nghề cướp biển thành công cũng không thể kéo dài mãi mãi.\n\nGiờ đây họ đã trở về nhà, tìm kiếm sự ổn định, và có lẽ là một điều gì đó vĩ đại hơn. Với con tàu, kinh nghiệm và chiến lợi phẩm của họ, họ vẫn có thể chứng minh là rất hữu ích."
 infernals.2531.a: "Nó hoàn toàn xứng đáng với cái giá đã bỏ ra."
 infernals.2531.a.tt: "Chúng ta có thể sử dụng tàu của họ trong hạm đội của mình. Chúng ta nhận được một Tuần Dương Hạm."
 infernals.2531.b: "Tái trang bị con tàu của họ để đi khai hoang một thế giới mới cho chúng ta."
 infernals.2531.b.tt: "Chúng ta nhận được một §H$colonizer$§!."
 infernals.2531.c: "Chúng ta có đủ không gian cho họ tại thủ đô."
 infernals.2531.c.tt: "Nhận được £pop£ $POPS$: §G+200§!"

# Anomaly 4
 cosmic_dawn_sleepers3_category: "Cảng Sao Ngủ Đông"
 cosmic_dawn_sleepers3_category_desc: "$cosmic_dawn_sleepers_category_desc$"
 infernals.2535.name: "$cosmic_dawn_sleepers3_category$"
 infernals.2535.desc: "§Y[root.leader.GetName]§! đã phát hiện ra một cơ sở ngủ đông nhỏ hơn, cùng với một cảng sao ẩn giấu chứa một tàu khoa học gần như hoạt động hoàn hảo. Chỉ cần sửa chữa nhỏ là đủ.\n\nĐịa điểm này cũng lưu giữ một kho dữ liệu khoa học khổng lồ, bao gồm các mẫu vật được bảo quản từ các giống loài khác[GetInterstellarRefugiaDesc2535] Không rõ liệu những mẫu vật này bị chiếm đoạt bằng vũ lực hay được hiến tặng tự nguyện, nhưng con tàu có chứa các buồng giam giữ được thiết kế cho hàng hóa có tri giác.\n\nChúng ta có thể thu được nhiều điều bổ ích bằng cách nghiên cứu chúng, có lẽ thậm chí vẫn còn nhiều dạng sống hơn nữa đang chờ được khám phá ngoài kia."
 infernals.2535.contact: ", một số loài có khả năng là tổ tiên của các sinh vật có tri giác hiện đại." # prints this in [GetInterstellarRefugiaDesc2535] above
 infernals.2535.nocontact: "." # Can't be empty, so holds the full stop.
 infernals.2535.a: "Nghiên cứu các mẫu vật."
 infernals.2535.b: "Trả lại các mẫu vật cho họ hàng của chúng."
 infernals.2535.c: "Hủy bỏ bằng chứng."

# Random Stasis Pods discovered
 infernals.2536.1: "Sau nhiều tháng nỗ lực, tất cả các cá thể [root.GetSpeciesNamePlural] mới đang ngủ say trên [planet.GetName] đã gia nhập hàng ngũ của chúng ta."
 infernals.2536.1.a: "Đặt lộ trình tiến vào hệ sao!"
 infernals.2536.1.b: "Chúng ta không còn thời gian cho những việc này nữa." # ends the chance to spawn more pods.
 infernals.2536.2: "Một kén ngủ đông khác đã được mở thành công và những cư dân bên trong đã được đưa về nhà."
 infernals.2536.3: "Chúng ta đã giải phóng thêm nhiều [root.GetSpeciesNamePlural], và đang giúp họ thích nghi với một vũ trụ lạnh giá hơn, nơi nhiệt lượng của các vì sao là điều kiện bắt buộc để sinh tồn."
 infernals.2536.4: "Thêm nhiều [root.GetSpeciesNamePlural] đã được đánh thức thành công trên [planet.GetName]."
 infernals.2536.5: "Một kén ngủ đông khác đã được định vị thành công."
 infernals.2536.6: "[root.leader.GetName] đã phát hiện thêm một kén ngủ đông, đưa thêm nhiều [root.GetSpeciesNamePlural] từ thuở xa xưa gia nhập hiện tại của chúng ta."
 infernals.2536.7: "[root.leader.GetName] đã định vị được một kén ngủ đông khác với các [root.GetSpeciesNamePlural] được bảo quản an toàn trong trạng thái ngủ đông."
 infernals.2536.8: "[root.leader.GetName] đã mở một kén ngủ đông cổ xưa trên [planet.GetName], và đang điều trị chứng sốc lạnh cho các cư dân bên trong."
 infernals.2536.9: "Một kén ngủ đông khác chứa các [root.GetSpeciesNamePlural] đã được tìm thấy trên [planet.GetName]."
 infernals.2536.10: "Thêm nhiều [root.GetSpeciesNamePlural] từ những kỷ nguyên xa xưa đã được đánh thức để cùng sát cánh với chúng ta."

# Stage 4
 infernals.2540.name: "Nhà Tù Cổ Xưa"
 infernals.2540.desc: "Cuộc khai quật mới nhất của chúng ta đã mang lại một sự bất ngờ: nhóm người ngủ đông này đã thức tỉnh từ nhiều thế kỷ trước, nhưng chưa từng rời khỏi cơ sở của họ.\n\nPhân tích kiến trúc cho thấy nó bị khóa từ bên ngoài, dường như là để giam giữ họ. Khi cắt qua những cánh cửa kiên cố, chúng ta ngay lập tức gặp phải sự thù địch, dù những người ngủ đông sau đó đã rút lui.\n\nCác kho lưu trữ có thể giải thích điều này, nhưng việc tiếp cận có nguy cơ kích động thêm nữa. Chúng ta có thể tấn công vũ lực cơ sở để chấm dứt sự việc nhanh chóng, hoặc cố gắng hối lộ họ để đổi lấy sự hợp tác."
 infernals.2540.a: "Đột kích tấn công cơ sở."
 infernals.2540.b: "Cung cấp quà tặng và tình hữu nghị."

 INF_ORIGIN_COSMIC_DAWN_STORM: "Tấn Công Cơ Sở Ngủ Đông"
 INF_ORIGIN_COSMIC_DAWN_STORM_DESC: "Chúng ta cần giành quyền tiếp cận cơ sở này, và những người ngủ đông đã thức tỉnh đang cản đường chúng ta. Hãy loại bỏ họ bằng vũ lực."
 infernals.2545.name: "Phá Vỡ Nhà Tù"
 infernals.2545.desc: "Lực lượng của chúng ta đã đột kích cơ sở và nhanh chóng khuất phục hầu hết các cư dân, chỉ gặp phải sự kháng cự yếu ớt.\n\nCác kho lưu trữ tiết lộ đây từng là một nhà tù. Những kẻ bị giam giữ là các phần tử cực đoan từng vận động cho các nỗ lực công nghệ cực đoan nhằm hâm nóng lại vũ trụ đang nguội lạnh, một số ý tưởng hoàn toàn viển vông, một số khác lại tiềm ẩn nguy cơ thảm họa.\n\nMột số thủ lĩnh nhà tù §Y[root.GetSpeciesNamePlural]§! đã cố thủ trong một căn phòng trung tâm cùng với thuốc nổ, yêu cầu tất cả cư dân phải ở lại và bị phong ấn trở lại.\n\nĐường hầm có thể được bơm đầy một loại khí vô hình làm trơ thuốc nổ để bảo toàn các cấu trúc, nhưng sẽ khiến hầu hết cư dân bị ngạt thở ngay sau đó."
 infernals.2545.a: "Xả khí độc vào đường hầm."
 infernals.2545.a.tt: "Nhận được £pop£ $POPS$: §G+100§!"
 infernals.2545.b: "Nhanh chóng sơ tán."
 infernals.2545.b.tt: "Nhận được £pop£ $POPS$: §G+400§!"

 INF_ORIGIN_COSMIC_DAWN_BRIBE: "Hối Lộ Cơ Sở Ngủ Đông"
 INF_ORIGIN_COSMIC_DAWN_BRIBE_DESC: "Nếu chúng ta có thể làm cho các cư dân của cơ sở này phụ thuộc vào mình, chúng ta sẽ có đòn bẩy để yêu cầu quyền tiếp cận cơ sở. Chúng ta nên cung cấp dồi dào các hàng hóa và tài nguyên thiết yếu, hữu ích cho họ."
 infernals.2550.name: "Phá Vỡ Nhà Tù"
 infernals.2550.desc: "Nhiều tháng buôn bán trao đổi đã khiến các cựu tù nhân ngủ đông phụ thuộc hoàn toàn vào nguồn tiếp tế của chúng ta. Khi chúng ta đe dọa chấm dứt việc này, họ hoảng loạn và nhượng lại quyền kiểm soát cơ sở.\n\nCác kho lưu trữ xác nhận đây từng là một nhà tù. Những cá nhân này từng thúc đẩy các công nghệ cực đoan nhằm hâm nóng lại vũ trụ đang nguội lạnh: một số ý tưởng ngớ ngẩn, một số khác lại khả thi đến mức nguy hiểm.\n\nMay mắn thay, họ không nhớ gì về điều này. Khi các nhà khoa học nghiên cứu địa điểm, các cựu tù nhân đang hòa nhập vào xã hội, tiến triển thuận lợi trên con đường đồng hóa."
 infernals.2550.a: "Làm tốt lắm."
 infernals.2550.a.tt: "Nhận được £pop£ $POPS$: §G+300§!"

# Stage 5
 infernals.2555.name: "Một Tai Nạn Bi Thảm"
 infernals.2555.intro: "Một tai nạn đã ập xuống địa điểm khai quật mới nhất. Trạm phát điện trong cơ sở đã bị hư hại, dù các kén ngủ đông tạm thời vẫn đang hoạt động."
 infernals.2555.outro: "Không rõ các hệ thống sẽ duy trì hoạt động được bao lâu nữa. Nếu muốn giải cứu những người ngủ đông, chúng ta cần hành động trước khi cơ sở cạn kiệt năng lượng."
 infernals.2555.desc.a: "$infernals.2555.intro$\n\nSự nghi ngờ đã đổ dồn vào một số người Ưa Nhiệt mới được đồng hóa gần đây từ cơ sở trước. Có tin đồn rằng họ có thể không phải là những công nhân chăm chỉ nhất.\n\n$infernals.2555.outro$"
 infernals.2555.desc.b: "$infernals.2555.intro$\n\nNghe về thảm họa này, cộng đồng người Ưa Nhiệt được giải cứu trước đó đã tình nguyện giúp đẩy nhanh tiến trình giải cứu.\n\n$infernals.2555.outro$"
 infernals.2555.a: "Thanh trừng bất kỳ công nhân bất trung nào."
 infernals.2555.b: "Trả tiền để thuê thêm người giúp đỡ."
 infernals.2555.c: "Lao vào ứng cứu khẩn cấp."
 infernals.2555.d: "Hành động thận trọng."

# Option events from above (Stage 4)
 infernals.2560.name: "Cứu Vãn Tình Thế"
 infernals.2560.desc: "Chúng ta hạn chế quyền tiếp cận chỉ dành cho những công nhân trung thành nhất, giảm thiểu tối đa sự gián đoạn đối với nỗ lực cứu hộ.\n\nThật không may, việc kiểm tra an ninh đã hạn chế nhân lực của chúng ta, và chúng ta đã không thể cứu vãn cơ sở. Những người ngủ đông đều đã thiệt mạng.\n\nNiềm an ủi duy nhất nằm ở việc nghiên cứu công nghệ này. Sự phân rã và ngừng hoạt động dần dần của nó có thể mang lại những hiểu biết quý giá."
 infernals.2560.a: "Thật đáng tiếc."

 infernals.2565.name: "$infernals.2560.name$"
 infernals.2565.desc: "Chúng ta đã treo phần thưởng tài chính cho công tác cứu hộ và nhận được một làn sóng người nộp đơn.\n\nThật không may, nỗ lực này đã bị phá hoại bởi các cựu tù nhân nhà tù, những kẻ phẫn uất trước việc chúng ta dùng tiền tài để gây áp lực kiểm soát. Vụ phá hoại đã dẫn đến cái chết của tất cả những người trong kén ngủ đông.\n\nMột niềm an ủi nhỏ là thiệt hại mang tính cục bộ có chủ đích. Chúng ta vẫn có thể nghiên cứu công nghệ và kho lưu trữ, và thất bại này đã phơi bày những lỗ hổng trong quy trình sàng lọc mà nay có thể được giải quyết."
 infernals.2565.a: "Thật là một hành động hèn hạ đáng khinh!"

 infernals.2570.name: "$infernals.2560.name$"
 infernals.2570.intro: "Một lượng lớn công nhân và đội cứu hộ đổ về cơ sở dưới lòng đất đã cho phép chúng ta đưa các cá thể [Species.GetName] đang say ngủ ra khỏi các kén ngủ đông sắp hỏng một cách nhanh chóng và an toàn. Những công dân mới này, khi chứng kiến số phận mà họ vừa thoát khỏi, vô cùng biết ơn vì cuộc giải cứu."
 infernals.2570.outro: "Thật không may, trong quá trình giải cứu vội vã, nhiều kén ngủ đông đã phải bị cắt mở hoặc phá hủy, làm hạn chế giá trị khoa học của chúng."
 infernals.2570.desc.a: "$infernals.2570.intro$\n\n$infernals.2570.outro$"
 infernals.2570.desc.b: "$infernals.2570.intro$\n\nNgoài ra, có vẻ như các tình nguyện viên từ đợt đồng hóa nhà tù đã hỗ trợ những người mới đến này bằng việc trò chuyện và cung cấp vật tư, giúp họ dễ dàng hòa nhập vào xã hội hơn.\n\n$infernals.2570.outro$"
 infernals.2570.a: "Thật tốt khi chúng ta có thêm những tình nguyện viên đó."
 infernals.2570.a.tt: "Nhận được £pop£ $POPS$: §G+400§!"
 infernals.2570.b: "Làm tốt lắm."
 infernals.2570.b.tt: "Nhận được £pop£ $POPS$: §G+400§!"
 infernals.2570.c: "$ACKNOWLEDGED$"
 infernals.2570.c.tt: "Nhận được £pop£ $POPS$: §G+400§!"

 infernals.2575.name: "$infernals.2560.name$"
 infernals.2575.desc: "Các nhà khoa học của chúng ta đã phân tích cẩn thận các hệ thống, bảo đảm rằng chúng ta có hiểu biết đầy đủ về những gì mình đang đối mặt trước khi nỗ lực giải cứu nhóm người đang ngủ say.\n\nĐáng buồn thay, quá trình từ phân tích, đến công bố, rồi nghiên cứu tiếp theo đã mất quá nhiều thời gian. Đến khi chúng ta sẵn sàng, hệ thống hỗ trợ sinh tồn đã hỏng, và tất cả sinh mạng đều đã mất.\n\nDù bi thảm, cuộc giải cứu đã mang lại những thành tựu khoa học lớn, và công nghệ thu hồi được đã chứng minh là rất có giá trị."
 infernals.2575.a: "May mắn thay những người còn sống vẫn có thể hưởng lợi."
 infernals.2575.b: "$ACKNOWLEDGED$"

# Situation completed
 infernals.2580.name: "Lịch Sử Của Chúng Ta Được Hé Lộ"
 infernals.2580.desc: "Cuối cùng chúng ta đã chạm tới lõi trung tâm, và quy mô của nó vượt xa mọi sức tưởng tượng. Một quần thể sinh thái ngầm khổng lồ nằm sâu bên trong hành tinh, được cung cấp năng lượng bởi magma và là nơi trú ngụ của hàng ngàn người ngủ đông.\n\nNó cũng lưu giữ những kho lưu trữ khổng lồ ghi lại quá khứ của chúng ta: sự trỗi dậy của đế chế thiên hà của chúng ta, và những tiếng nói từ kỷ nguyên đại nguội lạnh của vũ trụ. Một số người chọn ngủ đông, những người khác chiến đấu với điều tất yếu, và nhiều người chỉ đơn giản chối bỏ thực tế rồi diệt vong.\n\nKho báu này hé lộ những sự thật bị chôn vùi từ lâu. Một số người tin rằng nó chứng minh chúng ta thực sự là ai, và chúng ta có thể trở thành ai trong tương lai. Những người khác lập luận rằng chúng ta đã tôi rèn một bản sắc mới, thành công, và rằng xã hội của tổ tiên chúng ta không còn phù hợp với vũ trụ ngày nay nữa.\n\nDù thế nào đi nữa, mạng lưới đường hầm rộng lớn có thể được đưa vào sử dụng tùy theo lựa chọn của chúng ta."
 infernals.2580.a: "Chúng ta nên tái thiết đế chế cổ xưa của mình."
 infernals.2580.b: "Các đế chế khác nên tôn trọng di sản của chúng ta."
 infernals.2580.b.tt: "Nhận được Lãnh đạo: £commander£ §Y$commander$§! với cấp độ khởi đầu §G5§!"
 infernals.2580.c: "Chúng ta nên hướng tới tương lai."
 infernals.2580.d: "Điều quan trọng duy nhất là chúng ta làm việc thiện."

# Relic & Specimen
 r_pyroglyphic_codex: "Mật Mã Hỏa Tự"
 r_pyroglyphic_codex_desc: "Một mô hình tinh thể cơ học thiên văn phức tạp chứa đựng lượng thông tin phong phú về một nền văn minh từ thuở bình minh của thời gian. Nội dung của nó mang lại nhiều bài học về việc xây dựng một xã hội vĩ đại hơn."
 r_pyroglyphic_codex_effect_tt: "\nKích hoạt $r_pyroglyphic_codex$ lần §Yđầu tiên§! sẽ vĩnh viễn thêm chỉnh sửa §Y$infernal_library$§! vào thủ đô của chúng ta với các hiệu ứng sau: $TABBED_NEW_LINE$- $MOD_PLANET_MAX_DISTRICTS_ADD$: §G+5§! $TABBED_NEW_LINE$- $MOD_PLANET_HOUSING_MULT$: §G+20%§! $TABBED_NEW_LINE$- $MOD_PLANET_AMENITIES_ADD$: §G+10%§!"
 infernal_library: "Kiến Trúc Dưới Lòng Đất"
 infernal_library_desc: "Việc tái khám phá các kỹ thuật xây dựng cổ xưa trên thế giới này đã mở ra những tiềm năng mới cho việc xây dựng các thành phố hang động rộng lớn. Những chi tiết và kiến trúc chưa từng thấy trước đây thực sự là cảnh tượng ngoạn mục, nhắc nhở mọi công dân về nguồn gốc thực sự của họ."
 pyroglyphic_codex_mod: "$r_pyroglyphic_codex$"
 pyroglyphic_codex_mod_desc: "Những bí mật hấp dẫn được tìm thấy bên trong Mật Mã Hỏa Tự đang kích thích các hướng nghiên cứu mới, và sẽ tiếp tục làm như vậy trong vài năm tới."

 infernal_stasispod: "Kén Ngủ Đông Cổ Đại"
 infernal_stasispod_desc_short: "Một chiếc quách bằng đá nhân tạo được trang bị các nút điều khiển nhiệt độ chính xác đến đáng kinh ngạc"
 infernal_stasispod_desc_details: "Những kén này từng được các [Species.GetName] cổ xưa sử dụng để bước vào trạng thái ngủ đông hàng tỷ năm, và chỉ đánh thức những cư dân bên trong nếu nhiệt độ ấm lên đủ để duy trì sự sống cho họ. Chiếc kén này bắt nguồn từ một cơ sở nơi nhiều hệ thống đã hỏng hóc, và những người cư ngụ đều đã chết. Nó đóng vai trò như một lời nhắc nhở khắc nghiệt, trang nghiêm về những thử thách mà những người sống sót [Species.GetName] đã vượt qua."

####################################
# Colony Events
####################################

# Imminent Eruption
 infernals.3000.name: "Vụ Phun Trào Cận Kề"
 infernals.3000.desc: "Hệ thống cảnh báo địa chất cảnh báo rằng một vụ phun trào núi lửa gần khu định cư chính trên §Y[planet.GetName]§! có khả năng xảy ra trong vòng một năm tới.\n\nĐầu tư vào việc xả áp suất có kiểm soát có thể cho phép dòng dung nham được khai thác để sản xuất năng lượng. Các đội ngũ cũng có thể được đặt trong tình trạng sẵn sàng để thu hoạch magma trực tiếp từ vụ phun trào và lọc lấy kim loại quý. Ngoài ra, chúng ta có thể tập trung vào việc sơ tán dân thường và vật tư khỏi khu vực để giảm thiểu rủi ro.\n\nChúng ta cũng có thể tiếp tục theo dõi tình hình trước khi cam kết thực hiện bất kỳ hành động nào, phòng trường hợp các dự đoán không chính xác."
 infernals.3000.a: "Sơ tán!"
 infernals.3000.a.tt: "Có §Y500§! $energy$."
 infernals.3000.b: "Chờ đợi và quan sát."
 infernals.3000.c: "Tập trung vào phát điện."
 infernals.3000.d: "Thu hoạch magma."

 infernals.3005.name: "Vừa Kịp Lúc"
 infernals.3005.desc: "Việc sơ tán thuộc địa sớm hóa ra là một lựa chọn đúng đắn. Núi lửa phun trào sớm hơn dự kiến, làm hư hại nghiêm trọng các tòa nhà trong khu vực. Bây giờ khi áp suất núi lửa dưới lòng đất đã ở mức tối thiểu, những người định cư có thể quay trở lại và tái thiết an toàn."
 infernals.3010.name: "Cơn Thịnh Nộ Của Núi Lửa"
 infernals.3010.desc: "Núi lửa đã bùng nổ sớm, và thuộc địa đã không kịp chuẩn bị để đối phó với thảm họa. Thiệt hại lớn đã xảy ra đối với cơ sở hạ tầng, và tổn thất về nhân mạng là rất đáng kể."
 infernals.3015.name: "Chờ Đợi Và Quan Sát"
 infernals.3015.desc: "Sau vài tháng, hoạt động núi lửa gần thuộc địa §Y[planet.GetName]§! đã lắng dịu trở lại. Dù nguy cơ an toàn lâu dài chưa biến mất, nhưng có vẻ như thuộc địa hiện tại đã an toàn."
 infernals.3015.a: "Rủi ro đã được đền đáp."
 infernals.3020.name: "Lưới Điện Tăng Cường"
 infernals.3020.desc: "Các đội kỹ thuật đã có thể thiết lập một hệ thống an toàn để xả từ từ dung nham có áp suất từ các khoang dưới lòng đất, dẫn truyền nó qua các máy phát điện. Điều này đã mang lại một lợi ích ngắn hạn cho mạng lưới điện của thuộc địa."
 infernals.3025.name: "Thu Hoạch Magma"
 infernals.3025.desc: "Vụ phun trào núi lửa đã bị ngăn chặn bởi sự kết hợp giữa các thiết bị gây nhiễu siêu âm và các rào chắn vật lý, tạo ra một vùng magma lớn được giam giữ và đông cứng trên bề mặt. Các đội khai khoáng đã bắt đầu thu hoạch nguồn tài nguyên khoáng sản phong phú này."

# Lava Sports
 infernals.3030.name: "Thể Thao Nham Thạch"
 infernals.3030.desc: "Người ta có thể nghĩ rằng không một ai muốn dành thời gian ở gần các dòng dung nham chảy xiết, lộ thiên. Ít nhất là trên §Y[planet.GetName]§!, suy nghĩ đó hoàn toàn sai lầm.\n\nNhững người định cư đang đua các tàu lượn tiện ích dọc theo các dòng dung nham đang hoạt động, né tránh các tảng đá trôi nổi và tăng tốc vượt qua các thác dung nham. Những người khác đang cá cược vào kết quả của các cuộc đua này, và các sới bạc đã thu hút sự chú ý của tội phạm có tổ chức. Một vài phi công thậm chí đã thiệt mạng trong nhiều vụ tai nạn.\n\nThuộc địa không có luật lệ nào chống lại tập tục này, vì chưa từng ai tưởng tượng được rằng sẽ có kẻ làm điều như vậy. Chúng ta có thể đón nhận sự nhiệt tình của những người định cư và để họ làm theo ý muốn, nhưng điều này có thể dẫn đến những trò biểu diễn ngày càng nguy hiểm hơn, và một nguy cơ tội phạm tiềm tàng khi việc cờ bạc trong các sự kiện này đang gia tăng. Ngoài ra, chúng ta có thể quản lý môn thể thao này; dù điều này có thể gây ra một số lời càu nhàu, nhưng về lâu dài nó sẽ giảm thiểu thương vong và tội phạm. Hoặc chúng ta có thể cấm đoán hoàn toàn, điều này sẽ hiệu quả, nhưng tốn kém để thực thi."
 infernals.3030.a: "Cứ để nó tiếp diễn."
 infernals.3030.b: "Quản lý môn thể thao."
 infernals.3030.c: "Cấm trò ngu xuẩn này!"
 lava_surfboard: "Ván Lướt Nham Thạch"
 lava_surfboard_desc_short: "Một tấm thép thuôn dài với cơ cấu bay lượn tự chế được hàn vào mặt dưới"
 lava_surfboard_desc_details: "Dù rõ ràng được chắp vá từ các phụ tùng thay thế, tấm ván lướt sóng này được sử dụng trong các môn thể thao nham thạch của [Event.Planet.GetName] đã được chế tác với sự cẩn trọng và khéo léo khác thường. Hệ thống bay lượn và khả năng bảo vệ nhiệt của nó rất xuất sắc, và tính thẩm mỹ của nó gợi lên sự tự lực kiên cường gồ ghề của những người định cư vùng biên cương."

 infernals.3035.name: "Cứ Để Nó Tiếp Diễn!"
 infernals.3035.desc: "Cho phép những người định cư theo đuổi xu hướng này đã tạo ra một sự bùng nổ phấn khích xung quanh các môn thể thao nham thạch. Hình ảnh các phi công lướt chiếc tàu lượn của họ trên các dòng dung nham đang nhanh chóng trở thành biểu tượng cho văn hóa địa phương của §Y[planet.GetName]§!.\n\nThật không may, sự nhiệt tình đã làm lu mờ sự an toàn. Các báo cáo rải rác về những cái chết khi đua xe vẫn tiếp tục đổ về, và có vẻ như những kẻ cho vay nặng lãi tội phạm đang bóc lột thói quen cờ bạc của những người đam mê thể thao nham thạch. Mặc dù sự ủng hộ của công chúng đối với môn thể thao này vẫn ở mức cao, chúng ta nên tiếp tục theo dõi các hậu quả tiêu cực trong tương lai."
 infernals.3035.a: "Thật đáng lo ngại."
 infernals.3040.name: "Biện Pháp An Toàn"
 infernals.3040.desc: "Trong khi những người định cư ban đầu phẫn nộ khi chính quyền đế chế can thiệp quản lý trò tiêu khiển yêu thích của họ, các biện pháp an toàn mới bắt buộc trên các phương tiện đua đã gần như loại bỏ hoàn toàn các chấn thương và tử vong. Các phi công đua xe đang lên tiếng về lợi ích của những quy định này đối với sự an toàn của chính họ, điều này đang thuyết phục được công chúng đồng tình.\n\nTính minh bạch tài chính và việc đánh thuế cũng đã được áp dụng đối với hoạt động cờ bạc thể thao nham thạch, với số tiền thu được dùng để trang bị an toàn cho các tay đua. Các phần tử tội phạm phần lớn đã giải tán khỏi các sới bạc, dù một số người định cư phàn nàn rằng việc đánh thuế của chính quyền là bất công."
 infernals.3040.a: "Cẩn tắc vô áy náy."
 infernals.3045.name: "Môn Thể Thao Bị Cấm"
 infernals.3045.desc: "Lực lượng thực thi pháp luật đã được triển khai để chấm dứt hành vi nguy hiểm này. Sự phẫn nộ của công chúng đối với việc thực thi pháp luật rất mạnh mẽ và các cuộc biểu tình đã xảy ra khắp thuộc địa, nhưng với các dòng dung nham dưới sự giám sát liên tục và các tay đua không thể thi đấu, số ca tử vong đã giảm xuống con số không, và khung cảnh cờ bạc gần như đã tan biến hoàn toàn."
 infernals.3045.a: "Không có con đường nào khác."
 lava_sports_flow: "Thể Thao Nham Thạch: §GĐược Phép§!"
 lava_sports_flow_desc: "Cho phép những người định cư theo đuổi xu hướng này đã tạo ra sự bùng nổ phấn khích xung quanh các môn thể thao nham thạch."
 lava_sports_regulated: "Thể Thao Nham Thạch: §YĐược Quản Lý§!"
 lava_sports_regulated_desc: "Trong khi những người định cư ban đầu phẫn nộ khi chính quyền đế chế can thiệp quản lý trò tiêu khiển yêu thích của họ, các biện pháp an toàn mới bắt buộc trên các phương tiện đua đã gần như loại bỏ hoàn toàn các chấn thương và tử vong. Các phi công đua xe đang lên tiếng về lợi ích của những quy định này đối với sự an toàn của chính họ, điều này đang thuyết phục được công chúng đồng tình."
 lava_sports_banned: "Thể Thao Nham Thạch: §RBị Cấm§!"
 lava_sports_banned_desc: "Lực lượng thực thi pháp luật đã được triển khai để chấm dứt tập tục nguy hiểm này."

# Kindled Myths
 infernals.3055.name: "Thần Thoại Bùng Cháy"
 infernals.3055.desc: "Các thành viên của loài tiền FTL trên §Y[pre_ftl_planet.GetName]§! có những nét tương đồng nổi bật với những thực thể thần thoại từ một số câu chuyện thần thoại cổ xưa nhất của chúng ta. Một phần của điều này có thể được giải thích bởi các xu hướng rộng lớn trong tiến hóa hội tụ và tâm lý học, nhưng chúng ta càng tìm hiểu về loài này, chúng ta càng tìm thấy nhiều mối liên hệ hơn.\n\nLiệu đây có thể là cùng những thực thể từ các huyền thoại và truyền thuyết của chúng ta không? Sự hào hứng ngày càng tăng trước viễn cảnh này, và chúng ta có thể đầu tư để thúc đẩy nghiên cứu này sâu hơn. Nhưng đôi khi sự trùng hợp ngẫu nhiên dồn dập mà không có ý nghĩa sâu xa hơn, và việc tọc mạch quá nhiều có thể để lộ sự hiện diện của chúng ta trước xã hội này, gây ra những hậu quả không lường trước được."
 infernals.3055.a: "Bỏ qua sự trùng hợp ngẫu nhiên này."
 infernals.3055.b: "Điều tra sâu hơn."

 infernals.3060.name: "Giả Định Ngu Ngốc"
 infernals.3060.desc: "Bất chấp một số lời kêu gọi điều tra, sẽ là thiếu khôn ngoan nếu tiếp tục theo đuổi giả thuyết về những người ngoài hành tinh trong thần thoại này thêm nữa. Rốt cuộc thì giống loài này có những huyền thoại, truyền thuyết và cách nhìn nhận riêng về bản thân, những điều có thể không hoàn toàn phù hợp với những định kiến của chúng ta. Nghiên cứu về chủ đề này đã bị tạm dừng, với các khoản ngân sách được chuyển hướng sang những mối quan tâm khác."
 infernals.3060.a: "Quen thuộc, nhưng cũng thật xa lạ."

 infernals.3065.name: "Biến Động Nguyên Thủy"
 infernals.3065.desc: "Trong sự háo hức liên kết loài này với các thần thoại của chúng ta, các đặc vụ của chúng ta đã phớt lờ giao thức tiếp xúc tiền FTL an toàn. Khắp hành tinh, người dân địa phương đã ghi nhận nhiều lần quan sát thấy các con tàu của chúng ta, đã đánh cắp trang thiết bị, và trong một trường hợp, đã bắt cóc một trong những đặc vụ của chúng ta để nghiên cứu. Việc biết được sự tồn tại của chúng ta đã gây ra tình trạng bất ổn và các phản ứng phân cực.\n\nBất chấp sự hỗn loạn trong chiến dịch, sự phấn khích về các mối liên hệ thần thoại vẫn tiếp tục tồn tại trong lòng người dân chúng ta. Giống loài này đang được nhìn nhận qua lăng kính ngày càng mang tính tâm linh trên toàn đế chế."
 infernals.3065.a: "Đáng lẽ chúng ta nên cẩn thận hơn."

 infernals.3070.name: "Phát Hiện Kinh Ngạc"
 infernals.3070.desc: "Việc nghiên cứu chuyên sâu về các cư dân trên §Y[pre_ftl_planet.GetName]§! đã làm nguội lạnh giả thuyết thần thoại. Trong khi nhiều nét tương đồng được tìm thấy giữa những câu chuyện cổ nhất của chúng ta và các thực thể này, một số khác biệt không thể hòa giải cũng đã bị phát hiện.\n\nBất chấp bức tranh phức tạp hơn này, sự nhiệt tình đối với loài này vẫn còn. Người ta cho rằng họ có thể là một quần thể còn sót lại của các thực thể nguyên thủy trong các câu chuyện của chúng ta, và sự khác biệt có thể là do khoảng thời gian rộng lớn đã trôi qua kể từ đó. Dù buộc phải công nhận họ là xã hội độc lập ngày nay, nhiều người trong đế chế của chúng ta hiện cảm thấy một mối liên hệ tâm linh sâu sắc với họ."
 infernals.3070.a: "Một khoảnh khắc làm phong phú thêm tâm hồn cho tất cả chúng ta."

# Molten Core Grand Archive specimen
 infernals.3200.name: "Lõi Nóng Chảy"
 infernals.3200.desc: "Khi thuộc địa trên §Y[planet.GetName]§! phát triển, bằng chứng về một nền văn minh đã tuyệt chủng từng sử dụng $sr_living_metal$ cũng tăng theo, dẫu không có dấu vết nào về nơi họ thu được vật liệu này.\n\nMột câu trả lời gần đây đã lộ diện, dưới dạng một khối cầu lung linh kỳ lạ được bao bọc trong một trường lực nổi lên từ các dòng dung nham ở lõi sâu. Mục đích và cấu tạo ban đầu của nó không rõ ràng ngay lập tức, nhưng nó tạo ra một dòng nhỏ giọt ổn định của $sr_living_metal$ khi tiếp xúc với nhiệt độ cực cao. Dù điều này giải quyết gọn gàng câu đố khảo cổ học đó, nhưng giờ đây chúng ta phải quyết định làm gì với nó."
 infernals.3200.a: "Giữ lại cổ vật."
 infernals.3200.a.accept: "Vật thể gây tò mò này không giống bất kỳ thứ gì chúng ta từng phát triển. Nó không chỉ hữu ích như một nguồn cung cấp $sr_living_metal$, mà còn đóng vai trò như một sự tò mò về khoa học và lịch sử rất đáng để nghiên cứu."
 infernals.3200.b: "Ném nó trở lại vào nham thạch."
 infernals.3200.b.deny: "Chẳng có gì đáng ngưỡng mộ về một nền văn minh đã thất bại trong việc thích nghi và bị tuyệt chủng. Cổ vật cần bị vứt bỏ và lãng quên."
 infernal_molten_core: "Lõi Nóng Chảy"
 infernal_molten_core_desc_short: "Một quả cầu màu bạc với kết cấu chất lỏng gợn sóng, được bọc trong một trường lực phát ra tiếng rít khe khẽ"
 infernal_molten_core_desc_details: "Trường lực của lõi chỉ nới lỏng khi tiếp xúc với nhiệt độ cao, cho phép một giọt $r_living_metal$ thoát ra ngoài. Những người tạo ra nó ban đầu đã ra đi từ lâu, nhưng lõi này vẫn đứng vững như một minh chứng cho nền khoa học và sự khéo léo tài tình của họ."

# CD Timeline events
 TIMELINE_EVENT_ORIGIN_CD_START: "Những Tiếng Vọng Sâu Thẳm\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_CD_START_TOOLTIP: "§HTheo Dấu Vết§!\n§YSự Kiện Khởi Nguyên§!\n\nChúng ta đã phát hiện ra các tín hiệu phức tạp, yếu ớt phát ra từ sâu bên dưới bề mặt hành tinh. Chúng bắt nguồn từ một mạng lưới các cấu trúc cổ xưa nằm sâu trong lớp vỏ - những công trình có trước kỷ nguyên ngủ đông dài dặc của chúng ta."
 TIMELINE_EVENT_ORIGIN_CD_END: "Lịch Sử Được Hé Lộ\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_CD_END_TOOLTIP: "§HHoàn Tất Chuỗi Sự Kiện§!\n§YSự Kiện Khởi Nguyên§!\n\nChúng ta đã khám phá ra một cơ sở cổ xưa rộng lớn nằm sâu bên trong hành tinh, và trích xuất được một mật mã thông tin bị thất lạc từ một thời đại đã qua. Chúng ta là những người thừa kế một di sản cổ xưa và hùng mạnh, sẵn sàng khẳng định quyền thừa kế của mình."
