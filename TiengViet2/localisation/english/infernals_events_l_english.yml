 ####################################
 # Anomaly Events
 ####################################
 # useful refs:
 # [From.GetName] planet
 # [From.GetStarName]
 # [Leader.GetName] scientist

 spires_of_light_category: "Những Ngọn Tháp Ánh Sáng"
 spires_of_light_category_desc: "Các bản quét ban đầu phát hiện một loạt các cấu trúc phát quang cao chót vót vươn lên từ một cảnh quan vốn dĩ không có gì nổi bật. Nguồn gốc và mục đích của chúng vẫn chưa rõ ràng, nhưng ánh sáng quang phổ kỳ ảo của chúng gợi ý đây không đơn thuần là một hiện tượng tự nhiên."
 infernals.500.name: "$spires_of_light_category$"
 infernals.500.desc: "Các tàu thăm dò được phái đi điều tra những cột sáng rực rỡ đã xác định chúng được hình thành từ một loại magma silicat dễ uốn nắn. Vật chất này bị đẩy ngược lên qua các lỗ thông tầng đá gốc, đông kết lại ngay trước khi chạm tới bề mặt. Các cấu trúc hình thành có thể cao tới hàng trăm mét trước khi trọng lượng của chính chúng khiến chúng sụp đổ.\n\nKết quả là một rừng tháp thực thụ bao gồm thủy tinh núi lửa gần như tinh khiết và trong suốt, mỗi ngọn tháp đều khúc xạ ánh sáng màu cam ấm áp của dòng magma nóng chảy vẫn đang cuộn trào bên dưới.\n\nNhà khoa học [Leader.GetName] phỏng đoán rằng tàn tích của những ngọn tháp sụp đổ này có thể đóng vai trò như một nguồn tài nguyên quý giá."
#EXCELLENT:0 (first option has default answer)
 infernals.500.a: "Hãy để nơi thiêng liêng này được yên bình."
 infernals.500.b: "Đặt giá thầu cho giấy phép khai thác."
 infernals.500.c: "Dùng chúng để luyện tập bắn bia."

 lava_whirlpool_category: "Xoáy Nham Thạch"
 lava_whirlpool_category_desc: "Khảo sát đầu tiên về [Planet.GetName] đã phát hiện một hình thái kỳ lạ tựa cơn bão giữa đại dương nham thạch chính của hành tinh. Hiện tượng này hết sức dị thường và rất đáng để điều tra."
 infernals.56.name: "Xoáy Nham Thạch"
 infernals.56.desc: "[Leader.GetName] đã xác nhận hình thái kỳ lạ đó là một xoáy nham thạch. Hiện tượng này cực kỳ hiếm thấy, và chưa từng có xoáy nào với quy mô khổng lồ như thế này được ghi nhận. Quá đỗi kinh ngạc trước hiện tượng kỳ dị, [Leader.GetName] đã ra lệnh thực hiện một nhiệm vụ thu thập mẫu vật.\n\nCác mẫu vật tiết lộ rằng xoáy nham thạch này được duy trì một phần bởi một bể Kim Loại Sống ổn định, thứ liên tục bị các dòng chảy xé toạc rồi lại nỗ lực tự tái tổ hợp. Quá trình tái tổ hợp đó càng làm xáo trộn nham thạch, duy trì chuyển động không ngừng nghỉ của vùng xoáy. Việc lấy mẫu cũng chứng minh rằng lượng Kim Loại Sống này có thể được thu hoạch mà không tốn nhiều công sức."
 infernals.56.a: "Bắt đầu các hoạt động thu hoạch."

 outgassing_category: "Hiện Tượng Thoát Khí"
 outgassing_category_desc: "Một bản quét định kỳ trên [Planet.GetName] đã ghi nhận những dao động hóa học mạnh mẽ bất thường trong bầu khí quyển. Một cuộc khảo sát kỹ lưỡng hơn có thể giải thích những gì đang xảy ra tại đây."
 infernals.1001.name: "Hiện Tượng Thoát Khí"
 infernals.1001.desc: "Những dao động hóa học trong khí quyển đã được xác nhận cả về mặt thời gian lẫn trên bề mặt hành tinh. Sự dao động diễn ra mạnh mẽ nhất trên đại dương magma lộ thiên khổng lồ của hành tinh, do đó một tàu thăm dò đã được phái đi thu thập mẫu vật.\n\nSau khi phân tích kỹ lưỡng, [Leader.GetName] xác định rằng đại dương magma trên [Planet.GetName] đang thoát ra các loại khí kỳ dị vô cùng quý giá. Phát hiện bất ngờ này cho thấy hành tinh có thể đóng góp tiềm năng to lớn cho các ngành công nghiệp của chúng ta nếu ta có thể khai thác nó."
 infernals.1001.a: "Bắt đầu các quy trình khai thác."

 crystal_lava_lakes_category: "Các Hồ Nham Thạch Tinh Thể"
 crystal_lava_lakes_category_desc: "Hành tinh này dường như có những bể dung nham chảy tự do rộng lớn trên bề mặt. Chúng rất đáng để điều tra, phòng khi mang lại cơ hội thu hoạch tài nguyên."
 infernals.1002.name: "Các Hồ Nham Thạch Tinh Thể"
 infernals.1002.desc: "Những hình ảnh đầu tiên gửi về từ bề mặt [Planet.GetName] đã hé lộ các cấu tạo địa chất tuyệt đẹp và bất ngờ được gọi là 'các hồ nham thạch tinh thể'. Những khối magma tồn tại lâu đời này thấm đẫm các khoáng chất độc nhất vô nhị, vốn trong một khoảng nhiệt độ cụ thể, sẽ tự nhiên sắp xếp thành các ma trận tinh thể. Kết quả là tạo nên độ trong suốt vượt trội và ánh ngũ sắc quang phổ đỏ tuyệt mỹ khắp mặt hồ. Do quỹ đạo của hành tinh, hiệu ứng thị giác ấn tượng này biến chuyển tuần hoàn theo chu kỳ theo mùa khi nhiệt độ dao động.\n\nSức hấp dẫn thẩm mỹ của các hồ nham thạch tinh thể này có thể trở thành thỏi nam châm thu hút du khách mãnh liệt. Bản thân các khoáng chất tinh thể cũng có thể được vớt từ bề mặt trong mùa hoạt động của chúng, sau đó tận dụng đặc tính của chúng để làm vật liệu lưu trữ năng lượng."
 infernals.1002.a: "Phát triển địa điểm thành khu nghỉ dưỡng"
 infernals.1002.b: "Thu hoạch năng lượng từ các hồ"
 crystal_lava_resort: "Khu Nghỉ Dưỡng Nham Thạch Tinh Thể"
 crystal_lava_resort_desc: "Những hồ nước đẹp nao lòng trên hành tinh này đã được phát triển thành điểm đến du lịch sang trọng, thu hút du khách từ khắp mọi nơi trong thiên hà."

 bioadaptive_flora_category: "Thảm Thực Vật Thích Ứng Sinh Học"
 bioadaptive_flora_category_desc: "Mặc dù [Planet.GetName] dường như là một vùng đất hoang vu núi lửa điển hình, nhưng hàm lượng oxy ở đây lại cao đến kỳ lạ. Hẳn phải có thứ gì đó khác thường đang sản sinh ra lượng oxy đó."
 infernals.1003.name: "Thảm Thực Vật Thích Ứng Sinh Học"
 infernals.1003.desc: "Đánh giá ban đầu về [Planet.GetName] từng định hình nó như một thế giới của magma và lửa, nhưng các cuộc khảo sát đã hé lộ một hệ sinh thái bản địa gồm thảm thực vật phức tạp cư trú trong mạng lưới các thung lũng tách giãn khắp hành tinh. Những loài thực vật này sản sinh ra oxy và tích tụ chút hơi ẩm ít ỏi hiếm hoi, tạo nên những vùng vi khí hậu gần như ôn đới giữa một vùng đất hoang siêu nóng.\n\nCác quần xã sinh vật được nâng đỡ bởi thảm thực vật này có thể chứng minh là có thể sinh sống được cho các chủng loài vốn thường tránh định cư ở các thế giới núi lửa, và bản thân thảm thực vật có thể thích hợp cho nông nghiệp. Việc khám phá cặn kẽ những sinh vật đang sống trong các hẻm núi đó sẽ mang lại nhiều lợi ích cho những người định cư."
 infernals.1003.a: "Đánh dấu khu vực là vùng định cư khả thi"
 infernals.1003.tooltip_a: "Thêm một chỉnh sửa hành tinh giúp cải thiện Khả Năng Thích Nghi và Tăng Trưởng Dân Số."
 bioadaptive_flora_modifier: "Thảm Thực Vật Thích Ứng Sinh Học"
 bioadaptive_flora_modifier_desc: "Thảm thực vật bản địa kiên cường bao phủ các thung lũng tách giãn của hành tinh này, tạo ra các vi khí hậu mát mẻ hơn, thoáng khí và hỗ trợ khả năng sinh sống hạn chế ngay cả trong môi trường núi lửa."

 tectonic_icebreaker_category: "Kiến Tạo Phá Băng"
 tectonic_icebreaker_category_desc: "Những dị thường nhiệt độ thấp kỳ lạ đã được phát hiện trong lớp đất mặt của [Planet.GetName], gợi ý rằng một số quá trình hoặc vật thể nào đó có thể đang làm nguội các phần bề mặt. Một chuyến thám hiểm khoan sâu sẽ hé lộ nhiều điều hơn."
 infernals.1004.name: "Kiến Tạo Phá Băng"
 infernals.1004.desc: "[Leader.GetName] báo cáo rằng bên dưới bề mặt núi lửa của §Y[from.GetName]§! là những dòng sông băng rộng lớn. Chúng được bọc trong các khối đá bất thường bao gồm các khoáng chất có đặc tính cách nhiệt đặc biệt. Hoạt động kiến tạo đang từ từ làm suy thoái các lớp cách nhiệt này, và [Leader.GetName] dự đoán rằng nếu nhiệt độ giữa các sông băng và phần còn lại của hành tinh cân bằng lại, hành tinh sẽ nguội đủ để được coi là một thế giới khô cằn, thay vì một thế giới núi lửa.\n\nChúng ta có thể đẩy nhanh quá trình này để làm cho hành tinh dễ sống hơn đôi chút. Nhưng hiện tượng này cũng gây tò mò về mặt khoa học, và có thể có giá trị khi cho phép nghiên cứu diễn ra tự nhiên."
 infernals.1004.a: "Ổn định các mảng kiến tạo"
 infernals.1004.b: "Đẩy nhanh quá trình tan chảy"

 infernal_oasis_category: "Ốc Đảo Hỏa Ngục"
 infernal_oasis_category_desc: "Những hình ảnh đáng kinh ngạc về §Y[from.GetName]§! cho thấy một thế giới rực lửa, nóng chảy bị ngắt quãng bởi một dải màu xanh lục sáng rực rỡ có kích thước tương đương cả một lục địa. Cảnh tượng phi thường này cho thấy có điều gì đó hết sức bất thường trên bề mặt."
 infernals.505.name: "Nơi Trú Ẩn Giữa Những Biến Động"
 infernals.505.desc: "Thành phần và kiến tạo độc nhất vô nhị của §Y[from.GetName]§! đã tạo nên một kỳ quan không gì sánh bằng. Trong khi hầu hết hành tinh là một sa mạc thiêu đốt ngột ngạt với khói bụi núi lửa và nham thạch chảy tự do, thì một mảng lục địa đá rắn khổng lồ lại nhô cao hàng chục km so với bề mặt trung bình. Vùng cao nguyên hình thành từ đó, nằm cao tít bên trên các tầng mây độc hại, là ngôi nhà của một hệ sinh thái xanh tươi tốt gồm các loài động thực vật bản địa.\n\nCao nguyên này hoàn toàn có thể sinh sống dễ dàng đối với nhiều giống loài và có thể ẩn chứa vô số hiểu biết khoa học hấp dẫn nếu được nghiên cứu sâu hơn."
 infernals.505.a: "Một phát hiện đáng kinh ngạc."
 NAME_Vermilion: "Vermilion"
 NAME_Kira: "Kira"

 mysterious_ringing_category: "Tiếng Chuông Bí Ẩn"
 mysterious_ringing_category_desc: "Các nhà khoa học của chúng ta đã phát hiện những đỉnh sóng vô tuyến định kỳ phát ra từ một điểm duy nhất trên [Planet.GetName]. Chúng dường như trùng khớp với thời điểm mà nguồn phát tín hiệu chuyển giao từ đêm sang ngày."
 infernals.3210.name: "Tiếng Chuông Bí Ẩn"
 infernals.3210.desc: "Một đội ngũ khoa học đã đến [from.GetName] để lần theo dấu vết tín hiệu, và xác định rằng nó bắt nguồn từ một hệ thống hang động ngầm được trang bị các thiết bị quan sát khoa học.\n\n[Leader.GetName] đã dẫn đầu đội thâm nhập vào các hang động, nơi họ tìm thấy một căn phòng được phong ấn bằng các hợp kim xa lạ, với một tiếng chuông reng reng yếu ớt vọng ra từ bên trong. [GetMysteriousRingingDesc3210]\n\nSau khi các trang thiết bị bảo vệ thính giác được trang cấp, cả đội bước vào và phát hiện một sinh vật thuộc chủng loài chưa từng biết đang ngủ đông bên cạnh nguồn phát tín hiệu: một thiết bị hình trụ kỳ dị.\n\nPhân tích xác định thiết bị phát ra các xung vô tuyến định kỳ, theo sau là vài giờ tiếng ồn du dương hòa lẫn với những thanh âm phát âm, dường như tương thích với cấu tạo cơ quan phát âm của sinh vật. [Leader.GetName] suy đoán thiết bị có thể đang cố đánh thức sinh vật theo một lịch trình định sẵn."
 infernals.3210.individual: "Đội khảo sát đã tìm thấy một điểm yếu trong lớp phong ấn và xuyên phá qua, ngay thời điểm đó tiếng chuông reng reng trở nên chói tai đến đinh tai nhức óc, gây ra các cơn hoảng loạn và giận dữ bùng phát trong đội ngũ."
 infernals.3210.gestalt: "Đội khảo sát đã tìm thấy một điểm yếu trong lớp phong ấn và xuyên phá qua, ngay thời điểm đó tiếng chuông reng reng trở nên chói tai đến đinh tai nhức óc, gây quá tải cảm giác và suy sụp nhận thức nơi các máy bay không người lái."
 infernals.3210.a: "Sao chép nghiên cứu của họ rồi rời đi."
 infernals.3210.b: "Cố gắng đánh thức và chiêu mộ sinh vật này."
 infernals.3210.btt: "Nhận được Lãnh đạo: £scientist£ §Y$scientist$§! với cấp độ khởi đầu §G4§!."
 infernals.3210.c: "Đánh cắp thiết bị."
 infernals.3210.ctt: "Công nhân của chúng ta sẽ được hưởng lợi từ những lời nhắc nhở thường xuyên về việc quay lại làm việc. Mở khóa quyết sách tăng §G+10%§! sản lượng £job£ ['concept_jobs'] với cái giá §R-5%§! £happiness£ ['concept_happiness']."
 decision_planetary_workshift: "Cưỡng Chế Luân Phiên Làm Việc Toàn Hành Tinh"
 decision_planetary_workshift_desc: "$planetary_workshift_deployed_desc$"
 planetary_workshift_deployed: "Đã Cưỡng Chế Luân Phiên Làm Việc Toàn Hành Tinh"
 planetary_workshift_deployed_desc: "Bảo đảm toàn bộ hành tinh làm việc trên một múi giờ thống nhất duy nhất sẽ cải thiện khả năng giao tiếp và hiệu suất giữa các đội ngũ, với cái giá phải trả có thể chấp nhận được về sự hạnh phúc."

 ####################################
 # Origin Events
 ####################################

# Red Giant Origin
 infernals.45.name: "Xu Hướng Đáng Quan Ngại"
 infernals.45.desc: "Từ lâu chúng ta đã coi §Y[capital_star.GetName]§! như một sao khổng lồ đỏ điển hình, nhưng phân tích gần đây chỉ ra rằng kích thước và mức phát xạ bức xạ của nó đang gia tăng. Những biến đổi này đã và đang gây ra ảnh hưởng có thể đo lường được lên khí hậu của chúng ta và dân cư đang ngày càng hoang mang lo sợ.\n\nXu hướng này không có dấu hiệu dừng lại. Nếu giống loài chúng ta muốn sống sót, chúng ta phải điều tra nguyên nhân của hiện tượng này."
 infernals.45.desc.gestalt: "Từ lâu chúng ta đã coi §Y[capital_star.GetName]§! như một sao khổng lồ đỏ điển hình, nhưng phân tích gần đây chỉ ra rằng kích thước và mức phát xạ bức xạ của nó đang gia tăng. Những biến đổi này đã và đang gây ra ảnh hưởng có thể đo lường được lên khí hậu của chúng ta.\n\nXu hướng này không có dấu hiệu thay đổi. Nếu giống loài chúng ta muốn sống sót, chúng ta phải điều tra nguyên nhân của hiện tượng này."
 infernals.45.a: "Giữ bình tĩnh và hạ thấp mức độ nghiêm trọng của vấn đề."
 infernals.45.b: "Chúng ta phải nhanh chóng điều tra."
 infernals.45.c: "Chúng ta có các ưu tiên khác."
 infernals.45.d: "Giao việc này cho đội ngũ truyền thông đối ngoại."
 infernals.45.public.tt: "\n§HTình Huống:§! $situation_red_giant_expansion$ \n- Đặt phương thức tiếp cận tình huống thành §Y$approach_reassure_public$§! \n- Lượng Tài Nguyên Thu Hoạch Hàng Tháng: §G10§! £unity£"
 infernals.45.cause.tt: "\n§HTình Huống:§! $situation_red_giant_expansion$ \n- Đặt phương thức tiếp cận tình huống thành §Y$approach_find_the_cause$§!"
 infernals.50.name: "Tân Tinh Sao"
 infernals.50.desc: "[GetRedGiantEndingExplode]"
 infernals.50.totalIgnorance: "Bất kể thứ gì đã gây ra thảm họa Sao Khổng Lồ Đỏ giờ đây không còn quan trọng nữa, tất cả những gì chúng ta có thể làm lúc này là chấp nhận hiện trạng và tái thiết từ những mảnh vỡ còn sót lại."
 infernals.50.semiIgnorance: "Những xáo trộn từ vụ nổ bức xạ sao đã quét sạch mọi bằng chứng cần thiết để truy tìm thủ phạm.\n\nTất cả những gì chúng ta có thể làm lúc này là chấp nhận hiện trạng và tái thiết từ những gì còn lại."
 infernals.50.defaultEnding: "Quá trình được bắt đầu bởi một nhóm cư dân người ngoài hành tinh sót lại trong một trạm khai thác đổ nát cuối cùng đã đi đến hồi kết: §Y[Target.GetStarName]§! đã bùng nổ thành tân tinh, sau khi nuốt chửng gần như toàn bộ hệ sao. Dòng plasma đa sắc và bức xạ đã thiêu rụi §Y[event_target:red_giant_homeworld_tmp.GetName]§!, cùng với phần còn lại của hệ sao quê hương chúng ta.\n\n[GetMegacorpDesc50]\n\n[GetLususMiningDesc]"
 infernals.50.megacorp: "Quê nhà của chúng ta đã được chuyển đổi thành một vùng tài nguyên khoáng sản trù phú khổng lồ, nằm rải rác khắp hệ sao để dễ dàng tiếp cận. Chi phí khai thác những tài nguyên này thấp hơn nhiều so với việc chúng nằm sâu bên trong các hành tinh và vệ tinh tương ứng. Chúng ta có thể kỳ vọng lợi nhuận sẽ tăng vọt nhờ nguồn cung cấp tài nguyên giá rẻ này."
 infernals.50.nonmegacorp: "Mặc dù quê nhà của chúng ta nay đã trở thành một vùng đất hoang tàn, vụ nổ tân tinh đã phơi bày một kho tàng tài nguyên khoáng sản phong phú trên toàn hệ sao có thể dễ dàng tiếp cận bằng các thiết bị khai khoáng thông thường. Sự giàu có này có thể được dùng để kiến tạo một tương lai mới."
 infernals.50.lususExists: "Trạm không gian nhấp nháy phát ra một xung năng lượng cuối cùng trước khi ngừng hoạt động, bỏ mặc chúng ta đơn độc nhặt nhạnh những mảnh vụn của thế giới quê hương."
 infernals.50.lususGone: "Vì trạm không gian không còn tồn tại, §Y[event_target:red_giant_homeworld_tmp.GetName]§! có thể an tâm khi biết rằng điều này sẽ không bao giờ tái diễn nữa."
 infernals.50.a: "Chúng ta phải làm bất cứ điều gì có thể để khôi phục quê hương."
 infernals.51.name: "Tân Tinh Đã Được Giảm Thiểu"
 infernals.51.desc: "Sau những nỗ lực dọn dẹp phi thường, bề mặt của §Y[this.GetName]§! một lần nữa có thể sinh tồn được đối với $trait_infernal_plural$. Mặc dù một số vết sẹo vĩnh viễn sẽ luôn còn lại, chúng giờ đây có thể được tận dụng triệt để vì những cơ hội nghiên cứu độc nhất vô nhị."
 infernals.60.name: "Trở Lại Bình Thường"
 infernals.60.desc: "Bằng cách điều chỉnh ống hút năng lượng, chiết xuất hydro từ lớp vỏ và tinh chỉnh tỷ lệ nạp liệu của ngôi sao, chúng ta đã đảo ngược một cách an toàn sự giãn nở của §Y[Target.GetStarName]§!, đưa nó trở lại trạng thái êm dịu ban đầu như một Sao Khổng Lồ Đỏ ấm áp.\n\nChúng ta đã phát hiện sự ổn định khí hậu trên §Y[Target.GetStarName]§!, và chúng ta có thể hướng tới một tương lai dễ sống hơn, nơi hành tinh quê hương tiếp tục là trái tim của đế chế.\n\n[GetRedGiantEndingKalmStationStatus]"
 infernals.60.lususDestroyed: "Nếu không có trạm không gian trong tay [Owner.Species.GetHandNamePlural], chúng ta có thể không bao giờ hiểu chính xác những gì đã xảy ra, nhưng chúng ta có thể tận dụng tối đa bất kỳ vật chất nào được ngôi sao giải phóng khi nó co lại."
 infernals.60.lususAlive: "Bây giờ khi đã hiểu cách kiểm soát trạm không gian này, chúng ta có thể quyết định nó sẽ được sử dụng như thế nào tiếp theo."
 infernals.60.a: "Tháo dỡ trạm không gian."
 infernals.60.b: "Tiếp tục nghiên cứu trạm không gian."
 infernals.60.c: "Hãy để nó trở thành tượng đài chiến thắng của chúng ta."
 infernals.60.d: "Cuối cùng cũng được giải tỏa nhẹ nhõm."
 infernals.65.name: "Sự Giãn Nở Tinh Cầu"
 infernals.65.desc: "Các quan sát liên tục xác nhận rằng §Y[Target.system_star.GetName]§! đang giãn nở với tốc độ ngày càng nhanh. Các tác động vật lý từ việc gia tăng bức xạ cũng đang được ghi nhận. Trừ khi chúng ta có thể tìm ra cách ngăn chặn nó, §Y[Target.system_star.GetName]§! sẽ xóa sổ chúng ta rất lâu trước khi nó kịp nuốt chửng hành tinh.\n\n[GetMegacorpDesc65]"
 infernals.65.nonmegacorp: "Bảo vệ chống lại bức xạ sao có thể giúp chúng ta có thêm thời gian. Một kế hoạch nguy hiểm hơn nhưng có khả năng sinh lợi cao là khai thác lượng bức xạ gia tăng, thúc đẩy các ngành năng lượng và công nghiệp của chúng ta."
 infernals.65.megacorp: "Đầu tư vào việc bảo vệ hành tinh sẽ đóng vai trò như một bảo hiểm chống lại sự biến động, và sẽ giúp bảo đảm nền tảng tài sản của chúng ta. Nhưng chúng ta có thể thúc đẩy các chỉ số năng lượng và công nghiệp nếu xoay trục sang khai thác lượng bức xạ gia tăng."
 infernals.65.a: "Bảo vệ quê nhà của chúng ta."
 infernals.65.b: "Khai thác triệt để hiện tượng này."
 infernals.70.name: "Ngôi Sao Đói Khát"
 infernals.70.desc: "§Y[Target.GetName]§! đã cướp đi nạn nhân lớn đầu tiên, nuốt chửng thế giới trong cùng của hệ sao chúng ta. Dù các vật liệu thô vẫn còn đó, nhưng giờ chúng nằm ngoài tầm với trong lòng sâu rực lửa của ngôi sao.\n\nDù chúng ta có thể vượt qua thiệt hại kinh tế trước mắt, điều này mang lại một viễn cảnh đáng sợ về những gì đang chờ đợi §Y[Owner.Capital.GetName]§!."
 infernals.75.name: "Thiệt Hại Liên Đới"
 infernals.75.desc: "Sự phát triển chưa từng có của Sao Khổng Lồ Đỏ nay đã nuốt chửng thêm một hành tinh khác. Nguồn tài nguyên phong phú của nó sẽ vĩnh viễn không thể tiếp cận được, trừ khi ngôi sao rũ bỏ các lớp ngoài trong một vụ nổ tân tinh dữ dội."
 infernals.95.name: "Đường Hầm Xuyên Sao"
 infernals.95.desc: "Sự thật về §Y[capital_star.GetName]§! còn kỳ lạ hơn những gì chúng ta từng tưởng tượng. Các cuộc điều tra đang diễn ra đã hé lộ một cặp đường hầm á không gian song sinh nằm sâu bên trong ngôi sao của chúng ta.\n\nMột trong số đó dẫn truyền vật chất giàu hydro trực tiếp vào lớp vỏ ngoài, đẩy nhanh quá trình nhiệt hạch và tăng sản lượng heli. Quá trình này lẽ ra phải thúc đẩy sự nén lõi, nhưng đường hầm thứ hai lại chủ động hút cạn năng lượng, triệt tiêu quá trình đó. Kết quả là làm ngôi sao nở rộng ra.\n\nDữ liệu đo xa ban đầu từ cả hai đường hầm á không gian cho thấy chúng kết nối với nhiều điểm đầu cuối rải rác khắp thiên hà. Sự sống còn của chúng ta phụ thuộc vào việc điều tra những địa điểm này càng sớm càng tốt."
 infernals.95.a: "Chúng ta sẽ cần điều tra ba trong số các địa điểm này."
 infernals.95.a.tt: "Các mục tiêu khả thi để định vị tam giác điểm khởi nguồn á không gian đã được xác định vị trí."
 infernals.105.name: "Vết Sẹo Á Không Gian"
 infernals.105.desc: "Các bản quét trắc lượng thiên thể xung quanh §Y[FromFromFrom.GetName]§! đã tiết lộ những vết sẹo á không gian không thể giải thích được. Mặc dù hiện tại không có điểm thoát nào tại vị trí này, nhưng một đường hầm trong quá khứ có thể đã từng mở ra trên quỹ đạo quanh hành tinh khí khổng lồ này. Dữ liệu này đã cung cấp những hiểu biết sâu sắc về vật lý có thể ứng dụng trong các lĩnh vực khác.\n\nTrong thời gian này, chúng ta sẽ phải tìm kiếm ở nơi khác để xác định nguồn gốc của các đường hầm á không gian đang hoạt động bên trong ngôi sao của mình."
 infernals.105.a: "Tiếp tục tìm kiếm."
 infernals.110.name: "Phế Liệu Kim Loại Của Người Ngoài Hành Tinh"
 infernals.110.desc: "Các bản quét xung quanh §Y[FromFromFrom.GetName]§! cho thấy các vết sẹo á không gian. Chúng ta cũng đã xác định được các túi phế liệu kim loại cổ xưa gần hành tinh. Chúng bị khóa chặt trên quỹ đạo, và có thể liên quan đến các vết sẹo.\n\nCác bản quét liên tục về những dao động á không gian này sẽ giúp chúng ta tối ưu hóa các mảng pin mặt trời xung quanh ngôi sao quê hương.\n\nTrong khi dữ liệu này hữu ích, chúng ta cần ít nhất một địa điểm khảo sát nữa để chốt chặn nguồn gốc hiện tại của những vấn đề nan giải."
 infernals.110.a: "Bán đấu giá đống kim loại phế liệu."
 infernals.115.name: "Hoàn Tất Định Vị Tam Giác"
 infernals.115.desc: "Cuối cùng, một bước đột phá thực sự.\n\nNhững vết sẹo sâu hơn xung quanh §Y[FromFromFrom.GetName]§! đã cho phép chúng ta định vị tam giác điểm khởi nguồn xáo trộn ngôi sao đến một hệ sao chưa từng được phát hiện trước đây mang các dấu hiệu thù địch.\n\nCuộc điều tra này cuối cùng có thể giúp chúng ta khắc chế bất kỳ thứ gì đang ảnh hưởng đến ngôi sao của mình.\n\nMột khi tiến vào hệ sao §YLusus§!, chúng ta có thể thay đổi số phận của §Y[FromFromFromFrom.Target.solar_system.GetName]§!, và của toàn bộ nền văn minh của chúng ta."
 infernals.115.a: "Tiếp cận một cách thận trọng."
 infernals.115.b: "Chuẩn bị phô trương lực lượng."
 infernals.115.c: "Thực hiện nghi thức ban phước trước khi tiếp cận."
 red_giant_lusus_triangulated_tt: "Một hệ sao mới được hiển lộ."
 infernals.2115.name: "Lực Lượng Đột Kích"
 infernals.2115.desc: "Lực lượng của chúng ta đã nắm quyền kiểm soát trạm không gian. Những cư dân ở đây đã kháng cự yếu ớt, nhưng họ vũ trang nghèo nàn và dường như không được huấn luyện về chiến tranh. Khi quan sát kỹ hơn, nhiều người dường như vẫn còn vị thành niên. Những kẻ không bị tiêu diệt đã bị giam giữ.\n\nViệc phân tích đã bắt đầu về cách thức chúng ta có thể kiểm soát các đường hầm á không gian, thứ dường như là một loại ống hút khai thác năng lượng. Với thời gian, chúng ta có thể giải quyết tình hình ở hệ sao quê hương."
 infernals.2115.a: "Phá hủy nó."
 infernals.2115.b: "Thẩm vấn những kẻ sống sót."
 infernals.2115.c: "Bắt chúng làm nô lệ."
 infernals.2115.d: "Những kẻ sống sót là một mối nguy. Hãy thủ tiêu chúng."
 infernals.2115.e: "Nói chuyện với những kẻ sống sót."
 infernals.2115.f: "Thanh trừng trạm không gian."
 infernals.2115.g: "Ăn thịt chúng."
 infernals.400pops: "§G400§! £pop£ $POPS$ được tạo ra tại [this.GetName]"
 infernals.300pops: "§G300§! £pop£ $POPS$ được tạo ra tại [this.GetName]"
 infernals.2121.name: "Đã Tiêu Diệt Người Ngoài Hành Tinh"
 infernals.2121.desc: "Trạm khai thác á không gian đã bị phá hủy, giết chết tất cả những kẻ trên tàu.\n\nViệc phá hủy trạm đã kích nổ một chất lưu trữ năng lượng chưa rõ danh tính. Năng lượng giải phóng tràn qua đường hầm á không gian đang sụp đổ tiến vào §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!, làm trầm trọng thêm đáng kể tình hình quê nhà.\n\nDù vậy, việc vận chuyển hydro vào ngôi sao của chúng ta đã chấm dứt. Dù tình hình có tồi tệ đến đâu, nó sẽ không còn xấu đi nữa. Dù chúng ta có thể không bao giờ biết nguồn gốc hay thiết kế của trạm này, ít nhất chúng ta có thể yên tâm khi biết rằng quyền năng đó sẽ không bao giờ rơi vào tay các đối thủ.\n\nThật không may, chúng ta không có cách nào ngay lập tức để đưa §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§! trở lại trạng thái ban đầu. Nếu muốn tác động đến trạng thái của ngôi sao, chúng ta sẽ cần dựa vào các bản ghi chép để chắp vá lại những gì trạm không gian từng làm."
 infernals.2121.a: "Hãy dọn dẹp mớ hỗn độn này."
 infernals.2122.name: "Trạm Đã Bị Phá Hủy"
 infernals.2122.desc: "Khi tàn tích của trạm trôi dạt trong không gian, sự phá hủy của nó mang lại cho chúng ta cơ hội mới để thay đổi số phận của §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!, không phải bằng một cái búng tay, mà thông qua lao động gian khổ và tốn kém."
 infernals.2125.name: "Đàm Phán Với Người Ngoài Hành Tinh"
 infernals.2125.desc: "Sau một quá trình dài và đầy gian nan, chúng ta đã có một bộ máy dịch thuật thô sơ có thể giao tiếp với các cư dân trên trạm.\n\nTrạm đã hoạt động qua nhiều thế hệ, di chuyển từ hành tinh khí khổng lồ này sang hành tinh khí khổng lồ khác, sử dụng ống hút á không gian để chiết xuất năng lượng từ các ngôi sao xa xôi nhằm duy trì sự sống và động cơ bước nhảy mạnh mẽ của họ.\n\nNhững người ngoài hành tinh này không hoàn toàn hiểu rõ các hệ thống mà họ đang vận hành và không nhận ra rằng việc hút năng lượng của họ nhắm vào các ngôi sao và cuối cùng hủy diệt chúng.\n\nBất chấp sự bối rối, họ dường như rất háo hức được rời khỏi trạm. Họ đã hứa sẽ dạy cho chúng ta những gì họ biết để đổi lấy một nơi an toàn để sinh sống và nuôi dạy con non của họ."
 infernals.2125.a: "Cung cấp nơi trú ẩn cho họ."
 infernals.2125.b: "Trao cho họ một con tàu để tự tìm đường đi."
 infernals.2125.c: "Xả khí trạm không gian từ xa."
 infernals.2125.d: "Cho phép họ tự đưa ra phán xét về chúng ta."
 infernals.2130.name: "Hoạt Động Khai Thác Á Không Gian"
 infernals.2130.desc: "Trạm hút hydro từ một hành tinh khí khổng lồ và dẫn truyền nó qua á không gian vào lớp vỏ ngôi sao của chúng ta. Quá trình hợp hạch heli giải phóng năng lượng dư thừa, được chuyển đổi thành §Y$entropy_crystals$§! để cung cấp năng lượng cho trạm.\n\nSự bất ổn định của §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§! là kết quả của các lỗi hiệu chuẩn và sự xuống cấp của thiết bị mà cư dân hoặc không nhận thấy hoặc không biết cách sửa chữa.\n\nLàm việc với công nghệ cổ xưa của họ, chúng ta có thể đảo ngược quá trình này, nhưng sẽ không hề dễ dàng. Một phương án khác là ép ngôi sao của chúng ta bùng nổ thành tân tinh, phơi bày vô số mỏ khoáng sản biến di sản của chúng ta thành một kho tàng tài nguyên có thể khai thác."
 infernals.2130.a: "Đã đến lúc bắt tay vào việc."
 infernals.2131.desc: "Trạm hút hydro từ một hành tinh khí khổng lồ và dẫn truyền nó qua á không gian vào lớp vỏ ngôi sao của chúng ta. Quá trình hợp hạch heli giải phóng năng lượng dư thừa, được chuyển đổi thành §Y$entropy_crystals$§! để cung cấp năng lượng cho trạm.\n\nNhững cư dân trên trạm chỉ còn lưu giữ một truyền thống truyền miệng méo mó về các hoạt động của nó. Họ đã mất liên lạc với nền văn minh quê hương hàng ngàn năm trước, có lẽ vì nền văn minh đó đã sụp đổ hoặc bị tiêu diệt. Sự tích tụ của các lỗi hiệu chuẩn và thiết bị xuống cấp đã dẫn đến việc hút năng lượng ngày càng mất ổn định, đe dọa phá hủy §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!.\n\nLàm việc với công nghệ cổ xưa của họ, chúng ta có thể đảo ngược quá trình này, nhưng sẽ không hề dễ dàng. Một phương án khác là ép ngôi sao của chúng ta bùng nổ thành tân tinh, phơi bày vô số mỏ khoáng sản, biến di sản của chúng ta thành một kho tài nguyên có thể khai thác."
 infernals.2135.name: "Hồi Kết Cho Hiểm Họa"
 infernals.2135.desc: "Khi biết được tình cảnh khốn cùng của chúng ta, các cư dân trên trạm bày tỏ sự kinh hoàng và thất thần. Họ cứ ngỡ mình đơn độc, và không hề hay biết về các giống loài khác trong thiên hà.\n\nTrong cơn hối hận tột cùng và trước khi chúng ta kịp hiểu họ đang làm gì, họ đã bắt đầu tháo dỡ trạm, phá hủy vĩnh viễn hầu hết các bộ phận của nó.\n\nKết quả là việc kiểm soát sự giãn nở của ngôi sao sẽ rất khó khăn. Và chúng ta phải quyết định làm gì với những kẻ ngoài hành tinh thất thường này, và liệu có nên ban cho họ sự tha thứ mà họ mong muốn hay không."
 infernals.2135.a: "Thu nhận họ và trục vớt trạm."
 infernals.2135.b: "Thủ tiêu họ và phá hủy trạm."
 infernals.2135.c: "Bắt họ làm nô lệ và phá hủy trạm."
 infernals.2140.name: "Triển Vọng Ổn Định"
 infernals.2140.desc: "Sau những nỗ lực phi thường, chúng ta hiện nắm toàn quyền kiểm soát số phận của §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!. Nếu để mặc nó, nó sẽ tuân theo vòng đời tự nhiên ở kích thước hiện tại.\n\nThế nhưng trạm không gian cổ xưa và mục nát không thể chịu đựng những lần tái cấu hình liên tục. Mỗi lần điều chỉnh đều kéo căng cơ sở tới giới hạn của nó. Giờ đây, chúng ta chỉ có một sự lựa chọn.\n\nChúng ta có thể thu nhỏ ngôi sao trở lại kích thước ban đầu, hoặc ép nó nở rộng, biến hệ sao thành một cánh đồng rộng lớn chứa các tài nguyên dễ thu hoạch.\n\nCác [GetScientistPlural] của chúng ta sẽ cố gắng thực hiện một lần tái cấu hình cuối cùng. Sau đó, con đường duy nhất phía trước sẽ là tháo dỡ nhanh chóng, bằng ngoại lực."
 infernals.2140.a: "Cố định ngôi sao ở trạng thái hiện tại."
 infernals.2140.b: "Đẩy nhanh sự giãn nở của ngôi sao."
 infernals.2140.bdesc: "Chắc chắn làm phình to §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!."
 infernals.2140.c: "Đưa ngôi sao trở lại bình thường."
 infernals.2140.cdesc: "Chắc chắn thu nhỏ §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!."
 infernals.2145.name: "Đạt Được Ổn Định"
 infernals.2145.desc: "Với quyền kiểm soát toàn diện đối với kích thước và năng lượng dao động của ngôi sao, §Y[Target.GetStarName]§! đã hoàn toàn ổn định. Nó sẽ duy trì như hiện tại trong hàng triệu năm, và người dân của chúng ta một lần nữa có thể tận hưởng sự ổn định và khả năng dự đoán trong hệ sao quê hương.\n\nKích thước gia tăng của ngôi sao mang lại những hệ quả rõ ràng cho cách chúng ta quản lý cơ sở hạ tầng, và giờ đây chúng ta có thể tận dụng tối đa những thay đổi này, khai thác sản lượng năng lượng gia tăng của nó trong khi vẫn duy trì sự hiện diện bền vững trong hệ sao."
 infernals.2145.a: "Cuối cùng, chúng ta đã làm chủ vận mệnh của mình."
 infernals.2151.name: "Một Trạm Không Gian Bí Ẩn"
 infernals.2151.desc: "Khi tiến vào hệ sao, các chiến hạm của chúng ta gặp phải sự kháng cự hạn chế từ một nhóm drone tự động. Chúng nhanh chóng bị vô hiệu hóa, cho phép kiểm tra kỹ lưỡng hơn trạm ngoài hành tinh.\n\nCấu trúc này vẫn còn hoạt động, dẫu vỏ tàu mang dấu vết của những lần sửa chữa chắp vá chằng chịt. Khi cố gắng tiếp cận một trong các khoang cập cảng, chúng ta đã tiếp xúc với một chủng loài ngoài hành tinh chưa từng biết trước đây. Dù rào cản ngôn ngữ vẫn tồn tại, chúng ta đã xác nhận rằng cơ sở này là nguồn gốc của các đường hầm đang ảnh hưởng đến §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!.\n\nCác nỗ lực đang được tiến hành để thiết lập liên lạc. Một giải pháp ngoại giao có thể là khả thi. Nếu thất bại, chúng ta có thể buộc phải cân nhắc các biện pháp trực tiếp hơn, đổ bộ chiếm đóng cơ sở hoặc phá hủy hoàn toàn. Tuy nhiên, nếu không hiểu thấu đáo mục đích của nó, những hành động như vậy có thể mang lại rủi ro đáng kể cho ngôi sao của chúng ta."
 infernals.2151.a: "Dịch thuật ngôn ngữ của họ."
 infernals.2151.b: "Đổ bộ vũ lực chiếm đóng trạm."
 infernals.2151.c: "Phá hủy trạm không gian."
 infernals.2160.name: "Tia Lửa Khủng Hoảng"
 infernals.2160.desc: "Việc tiếp tục nghiên cứu trạm khai thác á không gian cho thấy nó lưu trữ một lượng nhiệt năng khổng lồ dưới một dạng kỳ dị, mà các [GetScientistPlural] của chúng ta gọi là §Y$entropy_crystals$§!. Nó tận dụng các vòng lặp phản hồi nhiệt để khuếch đại năng lượng đầu vào.\n\nBằng cách sao chép công nghệ này, chúng ta có thể học cách nắm giữ sức mạnh chưa từng tưởng tượng nổi trước đây mà nhiều người sẽ coi là phi tự nhiên và đầy nguy hiểm. Làm như vậy có thể tạo ra lượng nhiệt dư thừa khổng lồ, nhưng nếu chúng ta có thể tìm ra cách phát triển rực rỡ trong những điều kiện như vậy, thiên hà này có thể sẽ nằm trọn trong tay chúng ta."
 infernals.2160.a: "Hãy để chúng ta điều tra sâu hơn."
 infernals.2160.a.tt: "[GetRedgiantAlreadyHyperthermiaPickable]Phát hiện §Y$entropy_crystals$§! để thúc đẩy Chứng Tăng Nhiệt Thiên Hà."
 infernals.2160.a.ttunlock: "Cho phép lựa chọn Đặc Quyền Thăng Tiến $ap_galactic_hyperthermia$.\n"
 infernals.2160.b: "Công nghệ đó quá nguy hiểm để theo đuổi."
 infernals.2160.c: "Thật là một cách sử dụng §Y$entropy_crystals$§! thô sơ nguyên thủy."
 situation_red_giant_expansion: "Sự Giãn Nở Của Sao Khổng Lồ Đỏ"
 situation_red_giant_expansion_type: "$situation_red_giant_expansion$"
 situation_red_giant_expansion_desc: "Những thay đổi nhanh chóng trong các phát xạ của ngôi sao đe dọa sự ổn định của quê nhà chúng ta. Nếu tình trạng này tiếp diễn, §Y[Owner.Capital.GetStarName]§! cuối cùng sẽ biến thành tân tinh, nghiền nát toàn bộ hệ sao thành tro bụi nguyên tử."
 situation_red_giant_expansion_monthly_change_tooltip: "Tiến trình giãn nở phụ thuộc vào khả năng tìm kiếm và khắc chế nguyên nhân của chúng ta."
 situation_red_giant_expansion_fail_tooltip: "§Y[Target.solar_system.GetName]§! sẽ bùng nổ thành siêu tân tinh."
 situation_red_giant_expansion_finish_tooltip: "§Y[Target.solar_system.GetName]§! sẽ trở lại trạng thái bình thường."
 situation_red_giant_expansion_stage_1: "Ngôi sao của chúng ta tương đối yên ắng, nhưng sản lượng bức xạ của nó cao bất thường."
 situation_red_giant_expansion_stage_2: "Ngôi sao của chúng ta lớn hơn so với thời kỳ tiến hóa trong quá khứ, và điều này đang gây ra những tác động rõ rệt lên thế giới quê hương."
 situation_red_giant_expansion_stage_3: "Ngôi sao của chúng ta đã phình to đến mức nguy hiểm, và hoạt động cực độ của nó đang đe dọa sự ổn định của quê nhà chúng ta."
 situation_red_giant_expansion_stage_4: "Sao khổng lồ đỏ của chúng ta đang thiêu đốt phần lớn hệ sao, khiến sự sống trở nên vô cùng gian nan trắc trở."
 situation_red_giant_expansion_stage_5: "Ngôi sao của chúng ta đang trên bờ vực bùng nổ, điều này sẽ giáng một đòn hủy diệt thảm khốc lên mọi thứ trong hệ sao quê hương."
