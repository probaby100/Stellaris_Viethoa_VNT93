 approach_reassure_public: "Trấn An Dư Luận"
 approach_find_the_cause: "Tìm Kiếm Nguyên Nhân"
 approach_suppress_unrest2: "Trấn Áp Bất Ổn"
 approach_disrupt_subspace_tunnels2: "Phá Hủy Các Đường Hầm Á Không Gian"
 approach_add_fuel_to_the_fire3: "Thêm Dầu Vào Lửa"
 approach_wait_and_see3: "Chờ Đợi Và Quan Sát"
 approach_siphon_stellar_material3: "Hút Vật Chất Sao"
 approach_continue_siphoning4: "Tiếp Tục Hút Năng Lượng"
 approach_stabilize_the_star4: "Ổn Định Ngôi Sao"
 approach_cease_activity4: "Chấm Dứt Hoạt Động"
 approach_reverse_inflation4: "Đảo Ngược Sự Giãn Nở"
 approach_at_any_cost: "Bằng Mọi Giá"
 approach_reassure_public_effect: "Thông tin về cuộc khủng hoảng này có thể làm mất ổn định xã hội. Hãy giữ kín điều này.$rg_default_progress$"
 approach_find_the_cause_effect: "Sự giãn nở của ngôi sao không thể bị ngăn chặn. Việc điều tra ngay lập tức và toàn diện là mệnh lệnh cấp bách để xác định nguyên nhân sâu xa.$rg_default_progress$"
 approach_suppress_unrest2_effect: "Không thể giải quyết hiệu quả vấn đề giữa làn sóng bất ổn xã hội. Ưu tiên hàng đầu phải là khôi phục trật tự và sự ổn định.$rg_default_progress$"
 approach_disrupt_subspace_tunnels2_effect: "Bảo vệ sự toàn vẹn của ngôi sao đòi hỏi phải có các biện pháp đối phó ngay lập tức. Phá hủy các đường hầm á không gian là mệnh lệnh tối cao.$rg_small_progress$"
 approach_add_fuel_to_the_fire3_effect: "Diễn biến này mang lại cơ hội để khởi động các hoạt động khai thác sâu trên các hành tinh trong hệ sao quê hương, tối đa hóa việc thu gom khoáng sản.$rg_high_progress$"
 approach_wait_and_see3_effect: "Chúng ta phải ngừng đưa ra những quyết định hấp tấp. Thay vào đó, chúng ta nên kiên nhẫn và quan sát kỹ lưỡng.$rg_small_negative_progress$"
 approach_siphon_stellar_material3_effect: "Chúng ta có thể đẩy nhanh việc trở lại bình thường nếu trực tiếp loại bỏ vật chất khỏi ngôi sao.$rg_medium_negative_progress$"
 approach_continue_siphoning4_effect: "Chúng ta có thể sử dụng sức mạnh này để thiêu rụi hệ sao quê hương, cho phép chúng ta sàng lọc tàn tích để tìm kiếm của cải giàu sang.$rg_high_progress$"
 approach_stabilize_the_star4_effect: "Chúng ta có thể ổn định ngôi sao ở trạng thái hiện tại, duy trì các sự thích nghi hiện tại của chúng ta.$rg_no_progress$"
 approach_cease_activity4_effect: "Chúng ta có thể hủy kích hoạt giàn khai thác, và cho phép ngôi sao trở lại trạng thái êm dịu hơn.$rg_small_negative_progress$"
 approach_reverse_inflation4_effect: "Chúng ta có thể thu nhỏ ngôi sao trở lại kích thước trước đây, khôi phục khả năng sinh sống cho quê nhà.$rg_high_negative_progress$"
 approach_at_any_cost_effect: "Chúng ta phải ngăn chặn sự phình to để tránh thảm họa, bất kể cái giá phải trả là gì.\nTăng Trưởng Hàng Tháng: §G+0.5§!\n\n"
 INF_ORIGIN_RED_GIANT_TRIANGULATION: "Định Vị Tam Giác Nhiễu Loạn Á Không Gian"
 INF_ORIGIN_RED_GIANT_TRIANGULATION_DESC: "Địa điểm khả thi để định vị tam giác điểm khởi nguồn của sự can thiệp."
 INF_ORIGIN_RED_GIANT_PROTECT_HOMEWORLD: "Bảo Vệ Thế Giới Quê Hương"
 INF_ORIGIN_RED_GIANT_PROTECT_HOMEWORLD_DESC: "Trong khi nỗ lực không ngừng để đảo ngược các biến đổi của ngôi sao, chính thể xác của chúng ta cũng phải sẵn sàng đối mặt với sức nóng. Việc thích nghi dân số với nhiệt độ cao hơn sẽ giúp chúng ta phát triển thịnh vượng cùng tương lai rực lửa mới của ngôi sao."
 INF_ORIGIN_RED_GIANT_EXPLOIT: "Khai Thác Nhiệt Lượng"
 INF_ORIGIN_RED_GIANT_EXPLOIT_DESC: "Bức xạ mặt trời gia tăng gây ra các vấn đề nghiêm trọng về lâu dài, nhưng trong ngắn hạn, chúng ta có thể khai thác nó để tăng cường năng lực công nghiệp và năng lượng của mình."
 INF_ORIGIN_RED_GIANT_BOARD_STATION: "Đổ Bộ Lên Trạm"
 INF_ORIGIN_RED_GIANT_BOARD_STATION_DESC: "Những kẻ ngoài hành tinh liều lĩnh này đang bòn rút ngôi sao của chúng ta. Chúng ta phải đổ bộ lên trạm của chúng ngay lập tức và nắm quyền kiểm soát."
 INF_ORIGIN_RED_GIANT_PARLAY: "Ngôn Ngữ Học Ngoài Hành Tinh Khẩn Cấp"
 INF_ORIGIN_RED_GIANT_PARLAY_DESC: "Cư dân trên trạm kiểm soát ống hút á không gian đang phá hủy ngôi sao của chúng ta. Chúng ta phải thiết lập liên lạc để bảo đảm sự hợp tác của họ trong việc giải quyết vấn đề này."
 INF_THERMOPHILE_ADAPTATION: "Tiến Hóa Thích Nghi Ưa Nhiệt"
 INF_THERMOPHILE_ADAPTATION_DESC: "Chúng ta dấn thân vào con đường châm ngòi cả thiên hà, nhưng chính thể xác của chúng ta cũng phải sẵn sàng đối mặt với sức nóng. Thích nghi dân số với nhiệt độ cao hơn sẽ giúp chúng ta sinh sôi mạnh mẽ trong tương lai rực lửa mới. \n\n§HKhi Hoàn Tất:§!$TABBED_NEW_LINE$- Thêm chỉnh sửa §Y$crisis_thermophile_adaptation$§!$TABBED_NEW_LINE$- Tăng §Y$mod_pc_volcanic_habitability$§! thêm §G+50%§!"
