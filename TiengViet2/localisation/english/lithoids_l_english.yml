# Void Hive

 civic_void_hive:0 "Tổ Ong Hư Không"
 civic_void_hive_desc:0 "Ý thức bầy đàn này biến khoảng không vũ trụ thành một phần lãnh thổ của mình. Những con ong thợ tiến hóa đặc biệt có thể trải qua toàn bộ vòng đời mà không cần tiến vào bầu khí quyển của hành tinh."
 civic_tooltip_void_hive_effects:0 "- Cứ mỗi bốn tháng, tự động xây dựng §YTrạm Khai Thác§! và §YTrạm Nghiên Cứu§! trên một mỏ tài nguyên ngẫu nhiên chưa khai thác trong hệ sao ta sở hữu.\n- Thiếu công nghệ khai thác tài nguyên tương ứng sẽ giảm §R-75%§! sản lượng.\n- Trực tiếp xây dựng §YTrạm Khai Thác§! và §YTrạm Nghiên Cứu§! sẽ tốn thêm chi phí xây dựng là §R10§! $r_unity$."
