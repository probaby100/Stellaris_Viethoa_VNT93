# Selective Kinship
 civic_selective_kinship:0 "Tình Thân Có Chọn Lọc"
 civic_selective_kinship_desc:0 "Trong vũ trụ đầy rẫy những điều chưa biết này, chỉ có ruột thịt mới đáng tin cậy. Nền văn minh này chỉ đối xử bình đẳng với những đối tượng mà họ chọn."

