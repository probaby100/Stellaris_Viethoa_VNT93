l_english:

 rock_brain:0 "Bộ Não Đá"
 rock_brain_desc:0 "Tảng đá dường như đang... suy nghĩ. Liệu một điều như vậy có thể xảy ra sao?"
 cunning_flora:0 "Thực Vật Quỷ Quyệt"
 cunning_flora_desc:0 "Thực vật trên hành tinh này thể hiện cả tính hiếu chiến tột độ lẫn một trật tự xã hội tương đối phức tạp."
 genetic_library:0 "Thư Viện Di Truyền Bỏ Hoang"
 genetic_library_desc:0 "Cả cấu trúc lẫn nội dung của thư viện di truyền bỏ hoang này đều là những đối tượng nghiên cứu đầy giá trị."
 drone_space_elevator:0 "Thang Máy Vũ Trụ Cản Trở"
 drone_space_elevator_desc:0 "Những nỗ lực phá dỡ thang máy vũ trụ khổng lồ đang làm chậm lại quá trình sản xuất trên hành tinh này."
 drone_fl_satellite:0 "Vệ Tinh Liên Minh Đệ Nhất Rơi"
 drone_fl_satellite_desc:0 "Một vệ tinh cũ kỹ liên tục phát những tín hiệu liên lạc thời tiền sử vào không gian."
 drone_mineral_gift:0 "Món Quà Khoáng Sản Của Drone"
 drone_mineral_gift_desc:0 "Các drone từ một kỷ nguyên đã qua đã để lại một kho dự trữ khoáng sản ở đây. Rõ ràng là để phục vụ cho lợi ích của bạn."
 old_genetic_library:0 "Thư Viện Di Truyền Cổ Xưa"
 old_genetic_library_desc:0 "Tiểu hành tinh này chứa một cơ sở lưu trữ DNA cổ xưa."
 fascinating_flora:0 "Thực Vật Kỳ Diệu"
 fascinating_flora_desc:0 "Hành tinh này là ngôi nhà của loài hoa Mharin Kharin tuyệt đẹp."
 pheromoned_1:0 "Nhiễm Pheromone, Giai Đoạn Một"
 pheromoned_1_desc:0 "Phấn hoa trong bầu khí quyển tương tác với các thụ thể pheromone của người dân bạn, khiến họ cảm thấy hạnh phúc."
 pheromoned_2:0 "Nhiễm Pheromone, Giai Đoạn Hai"
 pheromoned_2_desc:0 "Phấn hoa trong bầu khí quyển tương tác với các thụ thể pheromone của người dân bạn, khiến năng suất lao động giảm sút."
 pheromoned_3:0 "Nhiễm Pheromone, Giai Đoạn Ba"
 pheromoned_3_desc:0 "Phấn hoa trong bầu khí quyển tương tác với các thụ thể pheromone của người dân bạn, khiến họ ít muốn di cư hơn."
 pheromoned_4:0 "Nhiễm Pheromone, Giai Đoạn Bốn"
 pheromoned_4_desc:0 "Phấn hoa trong bầu khí quyển tương tác với các thụ thể pheromone của người dân bạn, khiến họ làm việc năng suất hơn nhưng khó chịu với sự can thiệp từ bên ngoài."
 depheromoned_1:0 "Ứng Phó Pheromone"
 depheromoned_1_desc:0 "Các khuôn mẫu do ban quản lý cấp cao áp dụng tương tác với khả năng và sự sẵn sàng làm việc của người dân, khiến họ làm việc hiệu quả hơn."
 pheromoned_detox:0 "Giải Độc Pheromone"
 pheromoned_detox_desc:0 "Sự nở rộ của hoa Mharin Kharin đã quét sạch sinh quyển của hành tinh, cùng với mọi thứ bên trong nó. Một chu kỳ mới bắt đầu."
 pheromoned_grief:0 "Bi Kịch Pheromone"
 pheromoned_grief_desc:0 "Nỗi đau buồn vẫn còn đọng lại."
 zro_ice:0 "Băng Zro"
 zro_ice_desc:0 "Có các túi Zro bị kẹt trong bầu khí quyển cuộn xoáy của hành tinh băng khổng lồ."
 dark_matter_funnel:0 "Phễu Vật Chất Tối"
 dark_matter_funnel_desc:0 "Một lỗ sâu thu nhỏ cho phép tiếp cận Vật Chất Tối một cách dễ dàng."
 inspired_arts:0 "Nghệ Thuật Đầy Cảm Hứng"
 inspired_arts_desc:0 "Một nguồn cảm hứng táo bạo mới tiếp thêm sinh lực cho đế chế của bạn, cả về mặt văn hóa lẫn thương mại."
 uplift_rocky:0 "Khởi Đầu Gian Nan"
 uplift_rocky_desc:0 "Chủng tộc được khai hóa trên hành tinh này gặp đôi chút khó khăn trong việc thích nghi với trật tự xã hội mới."
 unhappy_with_experiments:0 "Bất Bình Vì Thử Nghiệm"
 unhappy_with_experiments_desc:0 "Dân số mang tư tưởng §YThân Ngoại Bang§! trên hành tinh bất bình với các thử nghiệm phi đạo đức trên các dạng sống bản địa."
 unproductive_without_experiments:0 "Kém Năng Suất Khi Thiếu Thử Nghiệm"
 unproductive_without_experiments_desc:0 "Sản lượng £society_research£ §Y$society_research$§! của hành tinh bị sụt giảm do các cơ hội thử nghiệm lâm sàng tuyệt vời đã bị các nhà khoa học bỏ lỡ."
 massex_happy:0 "Niềm Tin Tương Lai"
 massex_happy_desc:0 "Người dân của bạn tin tưởng rằng một tương lai tươi sáng đang ở phía trước."
 stellar_salt:0 "Mặn Mà"
 stellar_salt_desc:0 "Một cuộc phục hưng ẩm thực đang lan rộng khắp Đế Chế của chúng ta."
 projecting_moon:0 "Mặt Trăng Ảo Ảnh"
 projecting_moon_desc:0 "Một thiết bị liên lạc mạnh mẽ có khả năng ngụy tạo các chỉ số quét khảo sát một cách thuyết phục đang hoạt động trên mặt trăng này."
 cornucopia:0 "Chiếc Sừng Trù Phú"
 cornucopia_desc:0 "Hành tinh này là ngôi nhà của nguồn cung cấp lương thực dồi dào có thể khai thác."
 raw_materials:0 "Nguyên Liệu Thô"
 raw_materials_desc:0 "Hành tinh này chứa đựng nguồn khoáng sản và quặng mỏ dồi dào, dễ tiếp cận."
 shadow_play:0 "Múa Bóng"
 shadow_play_desc:0 "Những cái bóng trôi dạt trên bề mặt hành tinh, tạo nên các hình dạng dường như có chủ ý nhưng không thể giải mã ý nghĩa."
 grimacing:0 "Biến Hình Kỷ Lạ"
 grimacing_desc:0 "Sự hỗn loạn bên trong hành tinh này là một đối tượng nghiên cứu thú vị."
 comet_sighted_negative:0 "Nhìn Thấy Sao Chổi"
 comet_sighted_negative_desc:0 "Ngôi sao chổi mang điềm gở có ảnh hưởng tiêu cực đến Dân số tại Thủ Đô của bạn."
 comet_sighted_positive:0 "Nhìn Thấy Sao Chổi"
 comet_sighted_positive_desc:0 "Một ngôi sao chổi tráng lệ truyền cảm hứng cho Dân số tại Thủ Đô của bạn."
 skid_marks:0 "Vết Trượt Bánh"
 skid_marks_desc:0 "Có dấu hiệu cho thấy các cuộc đua xe địa hình khá khốc liệt từng diễn ra trên tiểu hành tinh này."
 dust_circuits:0 "Đường Đua Trong Cát Bụi"
 dust_circuits_desc:0 "Một loại trạm không gian khổng lồ nào đó đã va chạm vào tiểu hành tinh này trong quá khứ xa xôi, để lại một dấu vết không hoàn chỉnh nhưng rất rõ ràng trên bề mặt."
 unusual_tectonics:0 "Địa Kiến Tạo Bất Thường"
 unusual_tectonics_desc:0 "Hành tinh này thể hiện các đặc tính vật lý kiến tạo cực kỳ bất thường."
 flagellating_movement:0 "Chuyển Động Roi Lắc"
 flagellating_movement_desc:0 "Chúng ta đã cập nhật quy trình tư thế hạm đội Né Tránh dựa trên những quan sát về roi bơi của Bọ Biển Không Gian."
 cosmic_ray_catalysis:0 "Xúc Tác Tia Vũ Trụ"
 cosmic_ray_catalysis_desc:0 "Các Nhà Máy Năng Lượng của chúng ta giờ đây có thể chuyển đổi một phần bức xạ vũ trụ thành năng lượng sử dụng được."
 grand_design:0 "Đại Thiết Kế"
 grand_design_desc:0 "Phước lành cho những bánh răng nhỏ bé trong cỗ máy vĩ đại."
 malefaction:0 "Tội Ác"
 malefaction_desc:0 "Việc tốt thường gặp quả đắng."
 prismatic_lenses:0 "Lăng Kính Phổ Quang"
 prismatic_lenses_desc:0 "Các thấu kính mô phỏng đặc tính lăng kính độc đáo của các Thực Thể Tinh Thể đóng góp to lớn cho nghiên cứu Vật Lý."
 crystal_sonar:0 "Sóng Âm Tinh Thể"
 crystal_sonar_desc:0 "Hạm đội của bạn có thể sử dụng một kỹ thuật đặc biệt liên quan đến Thực Thể Tinh Thể để lập tức khảo sát hệ sao mà chúng cư trú."
 greater_crystal_bounty:0 "Tiền Thưởng Tinh Thể Quy Mô Lớn"
 greater_crystal_bounty_desc:1 "§LLệnh cho các hạm đội của bạn thu gom tàn dư khoáng sản từ các Thực Thể Tinh Thể bị tiêu diệt.§!\nKhoáng sản nhận được trên mỗi hạm đội đánh bại: §G500§!"
 crystal_bounty:0 "Tiền Thưởng Tinh Thể"
 crystal_bounty_desc:1 "§LLệnh cho các hạm đội của bạn thu gom tàn dư khoáng sản từ các Thực Thể Tinh Thể bị tiêu diệt.§!\nKhoáng sản nhận được trên mỗi hạm đội đánh bại: §G250§!"
 amoeba_extirpator:0 "Kẻ Tiêu Diệt Bọ Biển"
 amoeba_extirpator_desc:0 "Hạm đội của chúng ta vượt trội trong việc nhắm vào các điểm yếu của Bọ Biển Không Gian."
 crystal_breaker:0 "Kẻ Phá Vỡ Tinh Thể"
 crystal_breaker_desc:0 "Hệ thống ngắm bắn của hạm đội chúng ta đã thích ứng với địa hình góc cạnh của các Thực Thể Tinh Thể, tối đa hóa sát thương gây ra."
 drone_destroyer:0 "Kẻ Hủy Diệt Drone"
 drone_destroyer_desc:0 "Các thuật toán dự đoán được cập nhật cho phép tàu của chúng ta bám sát và bắn trúng các Drone Khai Khoáng Cổ Đại cơ động tốt hơn."
 tiyanki_butcher:0 "Đồ Tể Tiyanki"
 tiyanki_butcher_desc:0 "Kiến thức sâu rộng về giải phẫu học Tiyanki cho phép chúng ta tấn công chúng với độ chính xác phẫu thuật, tối đa hóa sát thương."
 droning_optimizations:0 "Tối Ưu Hóa Dây Chuyền Drone"
 droning_optimizations_desc:0 "Những điều chỉnh đối với quy trình khai thác tiêu chuẩn cho phép giảm đáng kể lượng tiêu hao Năng Lượng."
 cloudbuster:0 "Kẻ Xua Tan Mây"
 cloudbuster_desc:0 "Chúng ta đã điều chỉnh vũ khí để phá vỡ từ trường của Mây Hư Không, gia tăng tiềm năng sát thương lâu dài."
 drone_bounty:0 "Tiền Thưởng Drone Khai Khoáng"
 drone_bounty_desc:1 "§LLệnh cho các hạm đội của bạn trục vớt các lõi pin năng lượng của Drone Khai Khoáng Cổ Đại bị đánh bại.§!\nNăng Lượng Tín Dụng nhận được trên mỗi hạm đội đánh bại: §G500§!"
 unbalanced_ecosystem:0 "Hệ Sinh Thái Mất Cân Bằng"
 unbalanced_ecosystem_desc:0 "Khuynh hướng đồng nhất hóa tột độ ở đời sống thực vật trong sinh quyển khiến hành tinh này không phù hợp cho các hoạt động nông nghiệp."
 ruler_failed_savior:0 "Cứu Tinh Thất Bại"
 ruler_failed_savior_desc:0 "Một nỗ lực giải cứu bất thành khiến người dân của chúng ta đau buồn khôn xiết."
 ruler_savior:0 "Đấng Cứu Thế"
 ruler_savior_desc:0 "Một nỗ lực giải cứu thành công là lý do cho niềm hân hoan to lớn giữa người dân chúng ta."
 missing_scientist:0 "Tổn Thất Nhân Sự"
 missing_scientist_desc:0 "Một nhà khoa học làm việc tại trạm quan trắc đã mất tích, gây ra những làn sóng chấn động trong cộng đồng khoa học."
 humiliated:0 "Bị Lăng Nhục"
 humiliated_desc:0 "§LChúng ta đã bị một Đế Chế khác công khai làm nhục.§!"
 raided:0 "Bị Đột Kích"
 raided_desc:0 "§LChúng ta đã thất bại trong việc tự bảo vệ mình trước Kẻ Tàn Phá.§!"
 TOOLTIP_HAPPINESS_GOV_ETHOS:0 "Chế Độ $ETHIC$: $VAL$"
 TOOLTIP_HAPPINESS_XENO_OVERLORDS:0 "Kẻ Thống Trị Ngoại Tộc: $VAL$"
 swarm_border:1 ""
 swarm_border_desc:1 ""
 drone_processing:0 "Quy Trình Xử Lý Drone"
 drone_processing_desc:0 "Những bài học rút ra từ Drone Khai Khoáng Cổ Đại tiếp tục cải thiện sản lượng khai khoáng và hiệu quả tinh chế khoáng sản."
 spiritualist_attraction:0 "Sức Hút Tâm Linh"
 spiritualist_attraction_desc:0 "Một nhóm người theo chủ nghĩa tâm linh đang phản bác quan điểm duy vật về vũ trụ, cho rằng chúng hạn chế sự phát triển văn hóa của chúng ta."
 materialist_attraction:0 "Sức Hút Duy Vật"
 materialist_attraction_desc:0 "Một nhóm người theo chủ nghĩa duy vật đang thúc đẩy sự tiến bộ văn hóa của chúng ta bằng cách tìm kiếm những câu trả lời hữu hình và tiến bộ hơn."
 from_extra_federation_members:0 "Từ Các Thành Viên"
 empire_size_mods:0 "Quy Mô Đế Chế"
 taste_the_stars:0 "Hương Vị Các Vì Sao"
 taste_the_stars_desc:0 "Việc phát hiện ra một loại đồ uống của người ngoài hành tinh cổ xưa đã mang lại cho người dân của chúng ta hương vị của những điều chưa biết."
 game_start: "Những Năm Đầu Tiên"
 game_start_desc: "Sản lượng của các phe phái bị giảm sút trong mười năm đầu tiên."

 rock_brain_decoding:0 "Ngôn Ngữ Học Não Đá"

