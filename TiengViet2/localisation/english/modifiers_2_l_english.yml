 tyrannized_desc:0 "Bị bạo ngược bởi [Root.Owner.GetName]."
 favored:0 "Được Ưu Ái"
 favored_desc:0 "Được ưu ái bởi [Root.Owner.GetName]."
 6_hour_workday:0 "Ngày Làm Việc 6 Giờ"
 6_hour_workday_desc:0 "Lao động không lương trong điều kiện làm việc được cải thiện."
 validated:0 "Được Khẳng Định"
 validated_desc:0 "Gần đây đã giành được một thắng lợi chính trị."
 hunger_strike:0 "Người Tuyệt Thực"
 hunger_strike_desc:0 "Dân số này sẽ không tiêu thụ đủ chất dinh dưỡng để duy trì năng suất tối ưu."
 peace_strike:0 "Người Biểu Tình Chống Chiến Tranh"
 peace_strike_desc:0 "Dân số này sẽ dành một phần thời gian để biểu tình chống chiến tranh, dẫn đến giảm sút năng suất."

 culture_shock_bronze_age:0 "Cú Sốc Văn Hóa Tinh Cầu"
 culture_shock_bronze_age_desc:0 "Dân số này vẫn đang thích nghi với cuộc sống dưới sự cai trị của những kẻ thống trị ngoại tộc mới."
