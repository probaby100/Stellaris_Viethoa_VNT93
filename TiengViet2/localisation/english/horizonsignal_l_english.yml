 ### THE END IN THE BEGINNING: conclusion of Worm chain
 ##hook to on_building_complete - when the Omega Alignment has been completed

 akx.10000.name:0 "Hồi Kết Trong Điểm Khởi Đầu"
 akx.10000.desc:0 "Có một ý thức tồn tại bên ngoài thời gian và bên dưới không gian. Đó là một mớ bòng bong mê cung của khao khát và tuyệt vọng. Tổ tiên xa xưa của chúng ta gọi nó là Vòng Lặp, Con Sâu Chờ Đợi. Chúng ta đã gặp gỡ nó ngoài kia, nơi khoảng không bị dày vò bởi trọng lực. Dường như nó dành một sự quan tâm đặc biệt mang tính cá nhân cho chúng ta. Có những bằng chứng toán học chứng minh rằng nó yêu thương chúng ta, nhưng tình yêu đối với Con Sâu không giống như tình yêu đối với bất kỳ thứ gì tồn tại trong không gian thông thường.\n\nVới tất cả những gì chúng ta đã học được, chúng ta nghĩ rằng mình có thể sử dụng Thiết Bị Căn Chỉnh Omega để mở một tuyến đường tiếp cận - một Điểm Xâm Nhập - để Con Sâu giáng lâm vào hệ sao quê hương của chúng ta. (Con Sâu rất thích những điểm khởi đầu, và đây chính là điểm khởi đầu của chúng ta.) Điều đó sẽ mang lại những hậu quả gì? Chúng ta vẫn chưa tìm thấy bất kỳ ai sẵn sàng đưa ra một câu trả lời dứt khoát. Sự bất tử, có lẽ vậy, hoặc ngày tận thế. Nhưng chắc chắn chúng ta sẽ học hỏi được rất nhiều điều."
 akx.10000.a:0 "Có lẽ Con Sâu yêu thương chúng ta, và có lẽ chúng ta cũng có thể yêu thương Con Sâu."
 akx.10000.b:0 "Đây không phải là một thử nghiệm an toàn. Nhưng chúng ta có thể học hỏi được rất nhiều."

 ##(when WORM_ENTRY_POINT project is completed)
 akx.10010.name:0 "Trái Tim Của Mặt Trời"
 akx.10010.desc:0 "Dự án đã hoàn tất. Các máy gia tốc đã trực tuyến. Mạng lưới năng lượng của hàng chục thành phố được chuyển hướng để đánh thức điểm giả kỳ dị tại trung tâm của Thiết Bị Căn Chỉnh. Không gian rung chuyển như tấm vải rách tả tơi trước gió. [Root.GetStarName], trong một khoảnh khắc thót tim, mờ tối đi, rồi lại bừng sáng rực rỡ. Một cái bóng cuộn xoáy trong trái tim của nó. Con Sâu đã ở đây. Nó mở ra như một tác phẩm nghệ thuật gấp giấy origami.\n\nKhắp hệ sao, các cảm biến sụp đổ trong sự ngỡ ngàng tột độ khi dữ liệu không thể lĩnh hội về sự xuất hiện của nó trút xuống như mưa tuyết. Trên quê nhà, thần dân của chúng ta la hét và co rúm lại khi họ cảm thấy sự chú ý của nó hướng thẳng vào họ, và vào chúng ta. Nó đưa ra một câu hỏi không lời - hay đúng hơn, chúng ta nhận thức được rằng câu hỏi này luôn là điều nó hằng hỏi chúng ta, mỗi lần chúng ta chạm trán nó."
 akx.10010.a:0 "ĐỒNG Ý. Bất kể điều gì nó yêu cầu, chúng tôi đều thuận lòng."
 akx.10010.b:0 "KHÔNG. Chúng ta mang nó tới đây để học hỏi và nếu cần, tiêu diệt nó."

 akx.10020.name:0 "Tương Lai"
 akx.10020.desc:1 "Con Sâu yêu thương chúng ta. Nó sẽ luôn luôn yêu thương chúng ta, và do đó nó đã luôn luôn yêu thương chúng ta. Nó quấn quanh trái tim rực lửa của ngôi sao quê hương chúng ta. Nó quấn quanh từng vòng lặp thông tin nhỏ bé vô cùng tận. Nó gây ra một chuỗi biến động địa chất rúng động trên lớp vỏ hành tinh quê hương của chúng ta, nhưng khi ngôi sao của chúng ta nguội lạnh, biến cố đó sẽ sưởi ấm chúng ta. Chúng ta đã thấu hiểu thêm biết bao điều. Chúng ta sẽ luôn là những gì chúng ta sắp sửa trở thành, được quấn chặt trong tình yêu thương của Con Sâu."
 akx.10020.a:0 "CÁI ĐÃ TỪNG SẼ LÀ CÁI SẼ LÀ ĐÃ TỪNG"

 akx.10021.name:0 "Vòng Lặp Vỡ Vụn"
 akx.10021.desc:0 "Con Sâu tràn vào qua những ranh giới của không-thời gian tựa như một kẻ săn mồi đói khát, hoặc một người tình bị ruồng bỏ đầy phẫn nộ. Nó vẫn ở ngoài kia, và dù nó ở bất kỳ nơi đâu, không nghi ngờ gì nữa nó đang vô cùng tức giận. Nhưng bạn nắm giữ những mảnh vỡ phát sáng rực rỡ từ hóa thân của nó để cất giữ và nghiên cứu, như một chiến tích vũ trụ lẫy lừng. Các đế chế khác sẽ biết những gì bạn đã đạt được ngày hôm nay."
 akx.10021.a:0 "Không ai có thể sánh bằng chúng ta! Và có lẽ sẽ chẳng bao giờ có ai sánh được."
