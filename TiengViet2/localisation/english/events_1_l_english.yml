 VULTAUMAR:0 "Hành tinh Mẹ Vultaumar"
 VULTAUMAR_DESC:0 "Hành tinh mẹ của người Vultaum thời cổ đại. Ánh hào quang ngày xưa vẫn còn có thể nhìn thấy được phần nào."
 YUHTAAN:0 "Yuhtaan Vĩ đại"
 YUHTAAN_DESC:0 "Thế giới này từng là thủ đô của loài Yuht cổ đại, thế giới sầm uất đầy sức sống ngày nào giờ đã biến thành một vùng đất hoang vu ớn lạnh."
 FEN_HABBANIS:0 "Vũng lầy Fen Habbanis"
 FEN_HABBANIS_DESC:0 "Fen Habbanis III, hay người dân thời cổ đại gọi tắt là \"Fen Habbanis\", từng là thủ đô của Liên minh Đệ Nhất."
 IRASSIA:0 "Irassia"
 IRASSIA_DESC:0 "Bất kể sinh vật nào từng sống trong hệ sinh thái của thế giới này, giờ đây tất cả đều đã biến mất."
 CYBREX:0 "Thế giới vành đai Cybrex"
 CYBREX_DESC:0 "Một thế giới vành đai bị phá hủy hoàn toàn — điểm dừng chân cuối cùng của nền văn minh Cybrex."

