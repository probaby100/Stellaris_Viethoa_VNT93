 ####################################
 # Anomaly Events
 ####################################
 anomaly.1.name:0 "Tiểu hành tinh hóa thạch phân"
 anomaly.1.desc:0 "Mặc dù sự thật này hơi khó chấp nhận, nhưng mọi bằng chứng đều chỉ ra rằng tiểu hành tinh [From.GetName] là một tiểu hành tinh hóa thạch phân — tức là một hành tinh được hình thành từ hóa thạch phân của một dạng sống khổng lồ nào đó. Nó đã tồn tại khoảng một tỷ năm, vì vậy các thành phần ban đầu của hóa thạch đã dần tích tụ thành các mỏ khoáng sản. Các nhà khoa học của chúng tôi rất bối rối không biết sinh vật nào mới có thể để lại một thứ đồ sộ như vậy."
 anomaly.5.name:0 "Kho báu hải tặc"
 anomaly.5.desc:0 "Khoảng một ngàn năm trước, một nhóm hải tặc ngoài hành tinh đã lấy tiểu hành tinh này làm căn cứ trong một khoảng thời gian. Sau khi tiến vào căn cứ, chúng tôi tìm thấy những rương báu bị bỏ lại từ thời đó. Trong đó chủ yếu là các loại trang sức và cổ vật bị đánh cắp, một vài món trong số đó có vẻ khá giá trị."
 anomaly.5.a:0 "Món tiền bất chính này nên để chúng ta sử dụng."
 anomaly.10.name:0 "Hệ động vật trên tiểu hành tinh"
 anomaly.10.desc:0 "Khi khảo sát [From.GetName], phi hành đoàn của [Root.GetName] ngạc nhiên phát hiện có dấu hiệu của sự sống bên trong tiểu hành tinh. Một dạng sống vô cơ giống như loài sâu đào hang đang sống trong các tảng đá chằng chịt lối đi ngầm. Dạng sống độc đáo này dường như đã thích nghi được với cái lạnh khắc nghiệt của không gian."
 anomaly.10.a:0 "Nên nghiên cứu kỹ những sinh vật này."
 anomaly.10.b:0 "Chúng cũng giống như chúng ta!"
 anomaly.15.name:0 "Hóa thạch trên tiểu hành tinh"
 anomaly.15.desc:0 "Trên bề mặt không có bầu khí quyển của [From.GetName], chúng tôi phát hiện một vài loại hóa thạch có vẻ là của sinh vật sống dưới nước. Có bằng chứng cho thấy vành đai tiểu hành tinh này được hình thành từ một hành tinh bị vỡ nát, vì vậy việc phát hiện ra hóa thạch cũng xác nhận giả thuyết này. Từ những hóa thạch này không khó để nhận ra rằng hành tinh này từng có sự sống và có cả nước."
 anomaly.15.b.evopred: "Thật tiếc vì chúng không thể tiếp tục tiến hóa."
 anomaly.25.name:0 "Xưởng tàu bỏ hoang"
 anomaly.25.desc:0 "Phần lớn bên trong tiểu hành tinh [From.GetName] đã bị khoét rỗng để xây dựng một công trình có vẻ là xưởng đóng tàu, tuy nhiên công trình này đã bị bỏ hoang từ lâu, phơi mình trong môi trường chân không của vũ trụ suốt nhiều thế kỷ. Ngay cả khi từng có những thứ giá trị bị bỏ lại bên trong, chúng cũng đã bị những người khám phá trước đó vơ vét sạch sẽ. Thiết kế của xưởng đóng tàu này rất độc đáo, có nhiều điểm đáng để học hỏi."
 anomaly.25.a:0 "Chúng ta nên nghiên cứu thiết kế của nó."
 anomaly.30.name:0 "Bãi rác"
 anomaly.30.desc:0 "Trong quá khứ xa xôi, tiểu hành tinh này rõ ràng đã bị ai đó biến thành bãi rác trong một khoảng thời gian. Các loại máy móc phế liệu và mảnh vụn kim loại đã bị trọng lực yếu của tiểu hành tinh bắt lại, từ từ kéo vào một đống lớn mảnh vỡ và đá vụn, giờ đây đống phế tích này đã bao phủ toàn bộ bề mặt tiểu hành tinh. Chúng tôi không tìm thấy thứ gì có giá trị ở đây, nhưng có thể dùng trạm khai thác để thu hồi rất nhiều kim loại."
 anomaly.30.a:0 "Thu hồi mọi thứ có thể thu hồi."
 anomaly.35.name:0 "Tàu trinh sát rơi"
 anomaly.35.desc:0 "Một ngàn năm trước, một chiếc tàu trinh sát cỡ nhỏ của một giống loài nào đó đã rơi xuống bề mặt tiểu hành tinh này và tạo thành một hẻm núi nông. Không có buồng lái rõ ràng nào trong tàu, do đó hệ thống mạng lưới nhận định rằng nó có thể được điều khiển từ xa, hoặc được điều khiển bởi một loại trí tuệ nhân tạo thô sơ nào đó. Mặc dù nó đã bị hư hỏng nặng và không thể phục hồi nguyên vẹn, nhưng ít nhất con tàu này vẫn chưa bị cướp phá."
 anomaly.35.a:0 "Chúng ta phải nghiên cứu thiết kế của nó."
 anomaly.40.name:0 "Căn cứ khai thác tự động"
 anomaly.40.desc:0 "Chúng tôi phát hiện một căn cứ khai thác tự động ở quỹ đạo tầm thấp của [From.GetName]. Trên bề mặt của nó có những vết cháy xém do vũ khí hạng nhẹ để lại, và hệ thống của cơ sở này dường như đã bị kẹt trong một vòng lặp vô tận. Chúng tôi đã biên dịch lại hệ thống của căn cứ, và giờ đây chúng tôi đã hoàn toàn kiểm soát được cơ sở này."
 anomaly.40.desc.alt:1 "Chúng tôi phát hiện một căn cứ khai thác tự động ở quỹ đạo tầm thấp của [From.GetName]. Trên bề mặt của nó có những mảng lớn bị mất, những lỗ thủng lởm chởm này cho thấy cơ sở từng bị tấn công bằng vũ khí hạng nặng và hiện không thể sửa chữa. Nhưng vẫn còn những vật liệu quý giá có thể thu hồi."
 anomaly.50.name:0 "Bia ngắm bắn"
 anomaly.50.desc:0 "Tiểu hành tinh [From.GetName] bị bom bắn phá lỗ chỗ, khoảng hai ngàn năm trước, nơi này có vẻ từng được một nhóm người dùng làm bãi thử vũ khí. Kết quả đo đạc năng lượng còn sót lại cho thấy những vũ khí mà nhóm người đó thử nghiệm cũng rất kỳ quái, bao gồm cả bom không gian con và một loại máy tạo điểm kỳ dị. Các nhà khoa học của chúng tôi rất muốn nghiên cứu các luồng sóng năng lượng còn sót lại này."
 anomaly.55.name:0 "Va chạm tiểu hành tinh"
 anomaly.55.desc:0 "Qua kiểm tra ở cự ly gần, chúng tôi phát hiện một tiểu hành tinh gần như được cấu tạo hoàn toàn từ kim loại quý đã va chạm với [From.GetName] cách đây không lâu. Quả cầu kim loại đặc này đã bị vùi lấp dưới bề mặt của tiểu hành tinh, có lẽ đã đủ điều kiện để khai thác."
 anomaly.55.a:0 "Thật may mắn!"
 anomaly.60.name:0 "Bức xạ ngoại lai"
 anomaly.60.desc:0 "Tiểu hành tinh độc đáo này là một vị khách đến từ ngoài hệ sao. Trước đó, nó dường như đã phải hứng chịu sự gột rửa của một loại bức xạ ngoài hành tinh nào đó khi di chuyển qua không gian giữa các vì sao, sau đó mới tiến vào hệ sao [From.GetStarName]. Nguồn gốc của loại bức xạ này hiện vẫn chưa được làm rõ, nhưng thông qua việc nghiên cứu bức xạ năng lượng của tiểu hành tinh, [Root.GetName] đã thu được rất nhiều dữ liệu vật lý."
 anomaly.65.name:0 "Tàu chở quặng rơi"
 anomaly.65.desc:0 "Sau khi xác định được một hiện tượng bất thường trong giếng trọng lực của [From.GetName], [Root.GetName] đã phát hiện ra xác của một chiếc tàu siêu chở quặng thời cổ đại bị chôn vùi dưới bề mặt của tiểu hành tinh. Con tàu này đã rơi khi đang chở đầy hàng, do đó hàm lượng khoáng sản của tiểu hành tinh này cũng bị thay đổi."
 anomaly.300.name:0 "Hệ sinh thái khí quyển"
 anomaly.300.desc:0 "Chúng tôi đã phát hiện ra một hệ sinh thái tràn đầy sức sống ở thượng tầng khí quyển của hành tinh khí khổng lồ [From.GetName]. Những sinh vật trôi nổi khổng lồ đã tiến hóa một cơ thể có mật độ nhẹ hơn không khí, có thể nương theo chiều gió và hấp thụ năng lượng từ các cơn dông bão thường xuyên xảy ra trên hành tinh khí này. Những sinh vật này cũng nuôi sống các sinh vật phù du cũng như những loài động vật nhỏ ăn sinh vật phù du, và những loài động vật nhỏ này cũng ăn thịt lẫn nhau."
 anomaly.305.name:0 "Khoang chứa hàng bỏ hoang"
 anomaly.305.desc:0 "Một khoang chứa hàng đã bị bỏ hoang từ lâu ở phần trên bầu khí quyển của [From.GetName]. Không hiểu vì sao khoang hàng này lại không bị những người du hành không gian khác phát hiện. Quỹ đạo của nó đang giảm dần, dự kiến sẽ bị thiêu rụi hoàn toàn trong bầu khí quyển của hành tinh khí khổng lồ này vài năm nữa. Khi phi hành đoàn của [Root.GetName] mở khoang hàng ra, họ đã tìm thấy một đống đồ trang sức của người ngoài hành tinh làm bằng kim loại quý."
 anomaly.305.a:0 "Nung chảy chúng."
 anomaly.305.b:0 "Bán sạch."
 anomaly.305.c:0 "Nghiên cứu thiết kế của chúng."
 anomaly.305.d:0 "Giữ lại đi."
 anomaly.310.name:0 "Thử nghiệm xã hội"
 anomaly.310.desc:0 "Chúng tôi đã phát hiện một thuộc địa trên không cỡ nhỏ phía trên bầu khí quyển của [From.GetName]. Thuộc địa này dường như có thể tự cung tự cấp, trên tàu vẫn còn xác của một vài giống loài khác nhau. Dựa trên những tình hình nắm được hiện tại, có thể suy đoán rằng quần thể thuộc địa này là một cuộc thử nghiệm xã hội được tiến hành từ nhiều thế kỷ trước, nhưng cuối cùng lại kết thúc bằng việc tàn sát lẫn nhau. Chúng tôi đã tải xuống toàn bộ dữ liệu trong cơ sở dữ liệu hạn hẹp của thuộc địa này."
 anomaly.310.b.evopred: "Thu hồi những sinh khối này."
 anomaly.315.name:0 "Thuộc địa trôi nổi"
 anomaly.315.desc:0 "Chúng tôi đã phát hiện một thuộc địa trên không bị bỏ hoang ở quỹ đạo tầm thấp của hành tinh khí khổng lồ này, có niên đại ít nhất là ba ngàn năm trước. Nhiệm vụ ban đầu của thuộc địa này dường như là khai thác khí đốt, nhưng sau đó đã bị bỏ hoang, rồi bị các giống loài và băng đảng hải tặc khác nhau chiếm đóng. Những món đồ vô giá trong thuộc địa này đã bị vơ vét sạch sẽ từ lâu, nhưng chỉ riêng việc nó có thể sống sót qua bao kiếp nạn mà vẫn tiếp tục lơ lửng trên không cũng đủ để chúng ta tiến hành nghiên cứu về mặt kỹ thuật."
 anomaly.320.name:0 "Bãi xác tàu"
 anomaly.320.desc:0 "Giếng trọng lực mạnh của [From.GetName] đã hút một lượng lớn rác vũ trụ vào, tạo thành một lớp kim loại đặc ở một bên của hành tinh khí khổng lồ. Phần lớn những thứ này có lẽ là xác tàu còn sót lại từ một trận chiến không gian xảy ra trong hệ sao vài ngàn năm trước. Giờ đây, những mảnh vỡ và cổ vật có giá trị công nghệ đã bị những kẻ nhặt mót vơ vét đi, nhưng có thể sử dụng trạm khai thác để thu hồi kim loại."
 anomaly.325.name:0 "Tàu tuần dương rơi"
 anomaly.325.desc:0 "Ở quỹ đạo tầm thấp nằm sâu trong bầu khí quyển của [From.GetName], có thể phát hiện xác của một chiếc tàu tuần dương. Nó dường như đã lặn lội chặng đường dài để đi vào bầu khí quyển của hành tinh khí khổng lồ này, có lẽ là để trốn tránh kẻ truy đuổi, nhưng cuối cùng lại bị áp suất khí quyển phá hủy. Vị trí của con tàu quá sâu nên rất khó trục vớt. Nhưng thông qua việc quét cấu trúc tàu, chúng tôi đã thu được một số dữ liệu kỹ thuật đáng chú ý."
 anomaly.325.a:0 "Một con tàu phi thường."
 anomaly.330.name:0 "Siêu bão cực đoan"
 anomaly.330.desc:0 "Những cơn bão cực đoan với quy mô lớn thường xuyên xảy ra trong bầu khí quyển của [From.GetName]. Một số cơn bão chu kỳ dài có thể được nhìn thấy từ trên quỹ đạo, sức gió bên trong có thể lên tới hơn 700 mét/giây. Nguyên nhân gây ra bão hiện vẫn chưa rõ ràng, chúng tôi không tìm thấy manh mối nào trong các mô hình khí tượng có thể giải thích được hiện tượng này. Đề nghị nghiên cứu thêm về hiện tượng bất thường này."
 anomaly.335.name:0 "Dấu vết năng lượng"
 anomaly.335.desc:0 "[Root.GetName] đã xác định được một dấu vết năng lượng kỳ lạ nằm sâu trong bầu khí quyển của [From.GetName]. Năng lượng này dường như phát ra từ một công trình nào đó, có lẽ là tàn tích của một trạm quỹ đạo. Nhưng áp suất khí quyển cực cao khiến chúng tôi không thể tiếp cận. Tuy nhiên, việc quét đặc tính độc đáo này đã giúp chúng tôi thu được rất nhiều dữ liệu quý giá."
 anomaly.340.name:0 "Vệ tinh báu vật"
 anomaly.340.desc:0 "Sau khi tiến hành khảo sát chi tiết hơn với vô số vệ tinh tự nhiên của hành tinh khí khổng lồ [From.GetName], chúng tôi đã phát hiện một vệ tinh có chứa mỏ kim loại quý mà đợt khảo sát sơ bộ đã bỏ sót. Mặc dù vệ tinh này có kích thước rất nhỏ, nhưng quỹ đạo quay quanh hành tinh mẹ của nó lại ổn định, và bản thân cấu trúc địa chất của vệ tinh nhỏ này cũng rất vững chắc."
 anomaly.340.a:0 "Một phát hiện tuyệt vời."
 anomaly.600.name:0 "Va chạm tiểu hành tinh"
 anomaly.600.desc:0 "Vào một thời điểm nào đó trong vài ngàn năm qua, một sự kiện va chạm nghiêm trọng đã xảy ra, một tiểu hành tinh giàu khoáng sản đã đâm vào [From.GetName]. Hiện tại, vẫn có thể tìm thấy lượng khoáng sản dồi dào xung quanh miệng núi lửa của [From.GetPlanetMoon]."
 anomaly.600.a:0 "Một sự kiện bất ngờ."
 anomaly.605.name:1 "Va chạm siêu quang tốc"
 anomaly.605.desc:1 "Một miệng núi lửa trên [From.GetName] dường như là do một con tàu giữa các vì sao đâm xuống. Đánh giá từ kích thước của cái hố, chúng tôi nghi ngờ rằng mười ngàn năm trước, một con tàu đang mở hết công suất động cơ siêu quang tốc vì một lý do chưa rõ nào đó đã đâm vào [From.GetPlanetMoon]. [Root.GetName] đã nhận được tàn dư sóng không gian con gần địa điểm xảy ra vụ va chạm, nhưng do con tàu đã vỡ nát nên phỏng đoán của chúng tôi không thể được xác nhận."
 anomaly.610.name:0 "Điểm kỳ dị vi mô"
 anomaly.610.desc:0 "Một điểm kỳ dị vi mô gần đây đã cắt ngang qua [From.GetName], đi thẳng qua lõi đến tận phía bên kia của [From.GetPlanetMoon]. Sự kiện này dường như không gây ra thiệt hại vĩnh viễn nào, nhưng đã thay đổi một chút năng lượng đầu ra của lõi hành tinh, điều này đi ngược lại với các mô hình khoa học hiện tại của chúng tôi. Cần tiến hành nghiên cứu sâu hơn."
 anomaly.615.name:0 "Đảo chiều từ trường"
 anomaly.615.desc:0 "Từ trường của [From.GetName] đã hoàn toàn đảo chiều trong lúc được [Root.GetName] quan sát. Hiện tượng hiếm gặp này cũng đã làm thay đổi vị trí các cực từ của [From.GetPlanetMoon]. Thật may là những điều này đều được các cảm biến của chúng tôi ghi lại, cung cấp dữ liệu quý giá cho các nhà khoa học."
 anomaly.625.name:0 "Phi công bị xác ướp hóa"
 anomaly.625.desc:0 "Phát hiện một xác ướp được bảo quản nguyên vẹn thuộc về một sinh vật có vú không xác định ở quỹ đạo tầm cao của [From.GetName]. Mặc đầy đủ bộ đồ không gian, thậm chí còn đội cả mũ bảo hiểm, có lẽ anh ta là một phi công lái máy bay chiến đấu trong một cuộc đại chiến thời tiền sử, đã bị lãng quên và bỏ lại đây sau khi phóng ghế thoát hiểm. Nghiên cứu thi thể này đã đem lại một số dữ liệu thú vị."
 anomaly.625.a:0 "Một số phận bi thảm."
 anomaly.625.b.evopred: "Máu của họ sẽ chảy trong huyết quản của những kẻ khác."
 anomaly.630.name:0 "Khoang cứu sinh cổ đại"
 anomaly.630.desc:0 "Phát hiện một khoang cứu sinh bị bỏ hoang ở quỹ đạo tầm thấp của §Y[From.GetName]§!! Bề mặt của nó bị cháy xém, có thể là do vụ nổ của con tàu mẹ gây ra, và kết quả quét sơ bộ cho thấy nó ít nhất đã 5000 năm tuổi. Thành viên của [Root.GetName] đã tìm cách mở được khoang cứu sinh, bên trong là hài cốt của một người thằn lằn mặc bộ đồng phục lộng lẫy. Tay nó đang nắm chặt một bức ảnh của một người thằn lằn khác - bạn đời hoặc vị lãnh tụ đáng kính của nó."
 anomaly.630.b.evopred: "Dù là vua chúa hay nô lệ, ăn vào thì mùi vị cũng như nhau."
 anomaly.635.name:0 "Chữ viết ngoài hành tinh"
 anomaly.635.desc:0 "Ai đó vào khoảng năm ngàn năm trước đã dùng tia laser khai thác trên quỹ đạo để khắc một bài văn khổng lồ lên bề mặt của [From.GetName], chiếm phần lớn khu vực nửa bán cầu trên của [From.GetPlanetMoon], dường như kể về cuộc đời bi thảm của một lính đánh thuê ngoài hành tinh."
 anomaly.650.name:0 "Buồm mặt trời"
 anomaly.650.desc:0 "Chúng tôi phát hiện một con tàu buồm mặt trời bị bỏ hoang gần quỹ đạo của §Y[From.GetName]§!. Chủ nhân của con tàu cận quang tốc này đến từ một nền văn minh chưa được biết đến, và dường như đã có lịch sử hàng ngàn năm. Một trong những cánh buồm có một vết rách lớn, có vẻ như bị một vật thể xuyên qua — rất có thể là một thiên thạch — đây có lẽ là lý do khiến con tàu mất khả năng bay. Mặc dù công nghệ của con tàu này đã lỗi thời phần lớn, nhưng một số thiết kế kỹ thuật vẫn rất thú vị."
 anomaly.650.a:0 "Thiết kế thú vị nhưng nguyên thủy."
 anomaly.655.name:0 "Lướt qua nhau"
 anomaly.655.desc:0 "Khi tiếp cận §Y[From.GetName]§!, một vài quả đạn pháo gia tốc khối lượng đã bay sượt qua mạn tàu §Y[Root.GetName]§!. Những vật thể phóng này đã có tuổi đời hàng tỷ năm, xét từ quỹ đạo bay, chúng dường như được bắn từ một hệ sao lân cận, chệch khỏi mục tiêu dự định và tiếp tục bay trong tĩnh lặng suốt một thời gian dài - cho đến ngày hôm nay khi chúng ta nhìn thấy chúng. Mặc dù có lịch sử lâu đời, nhưng thiết kế của những quả đạn pháo mà chúng tôi thu hồi được vẫn rất tối tân."
 anomaly.660.name:0 "Tiểu hành tinh bị kéo"
 anomaly.660.desc:1 "Vì lý do nào đó, từng có người kéo một tiểu hành tinh vào quỹ đạo của §Y[From.GetName]§!. Trên bề mặt tiểu hành tinh, vẫn có thể tìm thấy những động cơ và bộ đẩy hãm khổng lồ từng được sử dụng năm xưa, mặc dù chúng đã không còn hoạt động từ rất lâu rồi. Bất kể ai là người đã di chuyển tiểu hành tinh này, người đó cũng đã khai thác khoáng sản của nó, nhưng những cơ sở này có vẻ như vừa mới được đưa vào sử dụng thì đã bị bỏ hoang."
 anomaly.660.b:0 "Người ngoài hành tinh này thật sự có ý tưởng đấy!"
 anomaly.670.name:0 "Sự hủy diệt hạt nhân"
 anomaly.670.desc:0 "Kết quả điều tra §Y[From.GetName]§! cho thấy nó từng là một [From.GetPlanetMoon] lục địa có khí hậu ôn hòa vào một ngàn năm trước. Nhưng ngược lại, bầu khí quyển nơi đây giờ tràn ngập khí độc, bề mặt bị nhiễm phóng xạ cao, và không còn thích hợp để sinh sống nữa. Chúng tôi phát hiện ra lý do khiến [From.GetPlanetMoon] trở nên như vậy là hậu quả tàn khốc của một cuộc chiến tranh nhiệt hạch giữa hai nền văn minh chưa tiến vào vũ trụ."
 anomaly.670.a:0 "Thật là một sự lãng phí."
 anomaly.675.name:0 "Tàn tích hạt nhân"
 anomaly.675.desc_01:0 "Kết quả điều tra §Y[From.GetName]§! cho thấy, do cuộc chiến tranh sử dụng vũ khí hạt nhân trên toàn cầu vào vài thế kỷ trước, [From.GetPlanetMoon] hiện đang trải qua kỷ băng hà. Mùa đông hạt nhân kéo theo đó đã xóa sổ hầu hết các dạng sống bậc cao, trong đó bao gồm cả các giống loài văn minh đã phát động chiến tranh, khi họ đã bước vào thời kỳ hậu nguyên tử."
 anomaly.675.desc_02:0 "Kết quả điều tra §Y[From.GetName]§! xác nhận rằng [From.GetPlanetMoon] từng là một thiên đường nhiệt đới tràn đầy sức sống trước cuộc chiến tranh sử dụng vũ khí hạt nhân trên toàn cầu vào vài thế kỷ trước. Hầu hết các dạng sống bậc cao đã bị xóa sổ bởi bức xạ, trong đó bao gồm cả các giống loài văn minh đã phát động chiến tranh, khi họ đã bước vào thời kỳ hậu nguyên tử."
 anomaly.680.name:0 "Bùng phát tia Gamma"
 anomaly.680.desc:0 "24.000 năm trước, một vụ bùng phát tia gamma phát ra từ một ngôi sao đang suy sụp trong hệ sao đã chiếu trực tiếp lên bề mặt hành tinh §Y[From.GetName]§!. [From.GetPlanetMoon] bị bao phủ bởi bức xạ chết người, không những phần lớn các dạng sống trên mặt [From.GetName] hướng về phía tia bức xạ bị lây nhiễm, mà phần lớn tầng ozone cũng bị phá hủy. Cuộc đại tuyệt chủng này đã làm biến mất khoảng 86% sinh vật của hành tinh, bao gồm cả một nền văn minh ở thời đại đồ đồng sơ kỳ, di tích của họ vẫn còn tồn tại ở một số khu vực thuộc bán cầu bắc. Hiện tại, sinh quyển địa phương đã có một số dấu hiệu phục hồi."
 anomaly.685.name:0 "Hiệu ứng nhà kính mất kiểm soát"
 anomaly.685.desc:0 "Bằng chứng cho thấy khí hậu hiện tại của §Y[From.GetName]§! là do hiệu ứng nhà kính mất kiểm soát bắt nguồn từ tình trạng ô nhiễm nặng nề. Các đại dương đã bị đun sôi, [From.GetPlanetMoon] cũng vĩnh viễn bị cô lập với thế giới bên ngoài bởi những đám mây dày do bầu khí quyển quá dày đặc tạo ra. Di tích của nền văn minh địa phương nằm rải rác khắp bề mặt hành tinh, hé lộ sự biến mất của một nền văn minh có dân số tăng nhanh trong thời kỳ trung và hậu công nghiệp."
 anomaly.690.name:0 "Sinh quyển Amoniac"
 anomaly.690.desc:0 "Mặc dù độc hại với hầu hết các sinh vật, bầu khí quyển áp suất cao của §Y[From.GetName]§! cũng có một hệ sinh thái tràn đầy sức sống. Sinh vật ở đây dùng amoniac thay cho nước làm dung môi, và qua đó phát triển các đặc điểm sinh thái hoàn toàn khác biệt so với các khu vực khác. Nghiên cứu chúng sẽ làm phong phú thêm rất nhiều hiểu biết về sinh học ngoài hành tinh."
 anomaly.695.name:0 "Sự sống gốc Silicon"
 anomaly.695.desc:0 "Trong mạng lưới đường hầm ngầm phức tạp dưới bề mặt hoang vu của [From.GetName] có một loại sinh vật gốc silicon sinh sống. Theo hiểu biết hiện tại, loại sinh vật này ăn đá và đã tiến hóa trí thông minh cơ bản. Việc chúng đào hầm dưới lòng đất đã làm cho bề mặt hành tinh xuất hiện nhiều loại khoáng sản có giá trị."
 anomaly.700.name:0 "Thợ mỏ trái phép"
 anomaly.700.desc:0 "Một nhóm thợ mỏ khai thác trái phép đến từ §Y[Root.Owner.Capital.GetName]§! đang khai thác mỏ sai quy định trên [From.GetName]. Những thợ mỏ này đã bị bắt, và trạm làm việc vô hiệu của họ cũng đã bị chúng tôi kiểm soát."
 anomaly.705.name:0 "Máy đánh dấu định vị cổ đại"
 anomaly.705.desc:0 "Phát hiện một thiết bị truyền dẫn khoảng cách ngắn cỡ nhỏ trên bề mặt §Y[From.GetName]§!. Nó trông giống như một chiếc máy đánh dấu định vị cổ đại, được đặt ở đây từ rất lâu trước kia để đánh dấu vị trí một mỏ kim loại quý hiếm cỡ lớn. Những thợ mỏ đáng lẽ phải đến đã không thể tới được, vì những kim loại quý giá này vẫn đang nằm yên tĩnh ở đây."
 anomaly.710.name:0 "Khu định cư lưu lạc"
 anomaly.710.desc:0 "Vượt xa khỏi sự mong đợi của phi hành đoàn §Y[Root.GetName]§!, họ tình cờ gặp một khu định cư nhỏ của [Root.Owner.GetSpeciesName] trên [From.GetName]. Những người sáng lập khu định cư này là những người tiên phong vĩ đại đã rời khỏi [Root.Owner.Capital.GetName] trên những chiếc phi thuyền thô sơ từ rất lâu trước kia. Mọi người từng nghĩ rằng những con tàu này đã biến mất trong vũ trụ bao la, cho đến ngày hôm nay chúng ta mới biết hóa ra họ vẫn ở đây. Tình trạng của khu định cư không được tốt, số lượng người của họ cũng đang giảm chậm qua nhiều thập kỷ. Những người còn lại hy vọng được tái gia nhập [Root.Owner.GetName]."
 anomaly.710.a:0 "Chào mừng trở về!"
 anomaly.710.b:0 "Cứ để họ tự sinh tự diệt."
 anomaly.715.name:0 "Di tích khu định cư"
 anomaly.715.desc:0 "Phát hiện một khu định cư nhỏ do một nền văn minh ngoài hành tinh thành lập cách đây 17.000 năm trên [From.GetName], nhưng các dấu hiệu cho thấy nó đã bị bỏ hoang không lâu sau khi được xây dựng. Không có bất kỳ dấu vết nào do những người định cư để lại, và ngoại trừ một vài trạm khí tượng, khu định cư này dường như cũng không phát triển nhiều."

 anomaly.2500.name:0 "Hài cốt kẻ đã khuất"
 anomaly.2500.desc:0 "Một vài hài cốt của các sinh vật không gian khổng lồ được phát hiện trên quỹ đạo đang phân rã của hành tinh khí khổng lồ [From.GetName]. Những sinh vật thiếu vắng các giác quan này dường như đã có khả năng du hành giữa các vì sao, nhưng không gian đã biết chưa có ghi nhận nào về việc nhìn thấy chúng. Sĩ quan khoa học [Root.GetLeaderName] đề xuất phân bổ thêm nguồn lực để tiến hành phân tích triệt để."
 anomaly.2501.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] suy luận rằng [From.From.GetName] từng được dùng làm nghĩa trang giữa các vì sao, rất nhiều giống loài ngoài hành tinh đã bỏ mạng ở đó. Dưới tác dụng của trọng lực, các xác chết đã từ từ bị kéo về phía hành tinh khí khổng lồ qua hàng triệu năm. Vòng tuần hoàn cổ đại này đã đột ngột bị gián đoạn vào khoảng mười lăm triệu năm trước sau khi nhóm sinh vật cuối cùng đến đây. Chúng ta chỉ có thể suy đoán rằng có thể chúng đã bị các sinh vật không gian khác săn lùng, hoặc gặp phải thiên tai."
 anomaly.2510.name:0 "Đại dương dưới lớp băng"
 anomaly.2510.desc:1 "Quét sâu [From.GetName] cho thấy dưới lớp vỏ băng bao phủ bề mặt có rất nhiều miệng phun thủy nhiệt, những miệng phun này làm nóng toàn bộ một đại dương. Trưởng [Owner.GetScientist] [Root.GetLeaderName] đã gửi các máy thăm dò từ [Root.GetName], những máy thăm dò này đã khoan xuyên qua lớp băng dày vài dặm và phát hiện khối nước dưới mặt đất chứa đầy sự sống. Chúng ta cần thêm tài nguyên để thực hiện một cuộc nghiên cứu triệt để, nhằm thăm dò nhiều dạng sống cư ngụ trong vùng biển sâu này."
 anomaly.2512.desc:2 "Trưởng [Owner.GetScientist] [Root.GetLeaderName] đã trở về sau chuyến thám hiểm, kết thúc cuộc khảo sát hệ sinh quyển phong phú trong đại dương dưới lớp băng của [From.From.GetName]. Ở khu vực đáy biển, các nhà nghiên cứu đã phát hiện ra một vài giống loài sinh vật nguyên sinh lớn, chúng có thể sản sinh ra một loại phân tử vô cơ độc đáo, mang đặc tính chữa bệnh cực kỳ thần kỳ. Nếu loại phân tử này có thể được thu thập thành công với số lượng lớn, nó sẽ tạo ra một cuộc cách mạng trong lĩnh vực khoa học y tế, thậm chí có thể được ứng dụng ở quy mô công nghiệp!"
 anomaly.2512.desc.mach:1 "Trưởng [Owner.GetScientist] [Root.GetLeaderName] đã trở về sau chuyến thám hiểm, kết thúc cuộc khảo sát hệ sinh quyển trong đại dương dưới lớp băng của [From.From.GetName]. Ở khu vực đáy biển, chúng tôi đã phát hiện ra một vài giống loài sinh vật nguyên sinh lớn, chúng có thể sản sinh ra một loại phân tử vô cơ độc đáo, mang đặc tính chữa bệnh cực kỳ thần kỳ.\n\nNếu loại phân tử này có thể được thu thập thành công với số lượng lớn, nó sẽ tạo ra một cuộc cách mạng trong việc chăm sóc y tế cho những món đồ trang trí sống thân yêu nhất của chúng ta, thậm chí có thể được ứng dụng ở quy mô công nghiệp!"
 anomaly.2513.desc:1 "Trưởng [Owner.GetScientist] [Root.GetLeaderName] đã hoàn thành nhiệm vụ khảo sát hệ sinh quyển phong phú trong đại dương dưới lớp băng của [From.From.GetName]. Các tàu thăm dò dưới nước của chúng tôi đã vẽ xong bản đồ địa hình, và ghi nhận lại phần lớn các dạng sống. Mặc dù những dữ liệu này có thể đôi chút hữu ích cho các nhà sinh học của chúng ta, nhưng ngoài ra vẫn chưa phát hiện thứ gì có giá trị ứng dụng đặc biệt."
 anomaly.2520.name:0 "Bộ xương khổng lồ"
 anomaly.2520.desc:0 "Trước đó chúng tôi tưởng rằng khu vực bán cầu nam của [From.GetName] có một dãy núi, nhưng thực ra đây là bộ xương đồ sộ của một sinh vật ngoài hành tinh khổng lồ.\n\nBộ xương này đã có tuổi thọ ba tỷ bốn trăm triệu năm, nhưng các [Owner.GetScientistPlural] của chúng tôi cho rằng tại bất kỳ mốc lịch sử nào của [From.GetPlanetMoon] này, môi trường của [From.GetName] đều không thể hỗ trợ cho sự sinh tồn của một dạng sống lớn đến vậy. [Owner.GetScientistCapital] [Root.GetLeaderName] đang chuẩn bị một kế hoạch nghiên cứu mới để tìm hiểu sâu hơn về bí ẩn này."
 anomaly.2520.a.term:0 "Chúng ta có thể học thêm được một kiểu tuyệt chủng mới."
 anomaly.2520.a.rean:0 "Chúng ta có thể làm cho nó cử động lại không?"
 anomaly.2521.desc:1 "Dựa trên phân tích bộ xương khổng lồ trên [From.From.GetName], sĩ quan khoa học [Root.GetLeaderName] đã đi đến kết luận: loại sinh vật này từng được dùng làm một dạng tàu vũ trụ. Bên trong bộ xương khổng lồ có tìm thấy xương của ít nhất ba giống loài khác nhau, chúng tôi phỏng đoán những bộ xương này thuộc về phi hành đoàn của tàu. Không rõ vì lý do gì, con tàu sinh học này đã bị hư hại vô cùng nặng nề và đâm xuống [From.From.GetName]. Mặc dù chúng ta hoàn toàn không thể hiểu nổi cần trình độ kỹ thuật sinh học ở mức nào mới có thể \"nuôi\" ra được một con tàu khổng lồ như vậy, nhưng chỉ riêng việc nghiên cứu cấu trúc xương của nó cũng đủ để công nghệ của chúng ta đạt được những bước tiến vượt bậc."
 anomaly.2521.desc.bio: "Sau quá trình nghiên cứu sâu về bộ xương khổng lồ trên [From.From.GetName], sĩ quan khoa học [Root.GetLeaderName] đã khẳng định một khả năng khó xảy ra nhất: hóa ra đây là một con tàu sống. Sinh vật này có một vài điểm tương đồng với tàu sinh học của chính chúng ta.\n\nCấu trúc của nó vừa quen thuộc vừa xa lạ, khiến người ta vô cùng kinh ngạc, như thể nó được nhào nặn bởi một triết lý tiến hóa hoàn toàn khác biệt. Trong khoang ngực khổng lồ của nó còn tìm thấy một vài bộ xương nhỏ thuộc về ít nhất ba giống loài khác nhau, ám chỉ rằng nó có thể từng chở phi hành đoàn bên trong cơ thể. Khái niệm này khiến chúng ta có phần không thoải mái, bởi vì tàu sinh học của chúng ta mang tính cộng sinh chứ không phải là con tàu rỗng ruột để tống người vào.\n\nNguyên nhân cái chết của nó hiện vẫn chưa rõ ràng, nhưng thiệt hại phải chịu là thảm khốc, bộ xương khổng lồ của nó đã vỡ vụn khi lao xuống bề mặt hành tinh. Phi hành đoàn của nó hay nói đúng hơn là trí thông minh điều hướng bậc cao rốt cuộc là chết cùng nó, hay là một phần không thể tách rời của nó?\n\nMặc dù chúng ta có lẽ không bao giờ có thể hoàn toàn giải mã được bí ẩn về nguồn gốc của nó, nhưng việc nghiên cứu di hài của nó đã mang lại cho chúng ta hiểu biết sâu sắc hơn về ý nghĩa của tàu sống. Tuy nhiên, một câu hỏi bất an vẫn cứ vương vấn: Nó được tạo ra... hay là sinh ra đã như vậy?"
 anomaly.2521.b.evopred: "Nên ăn phi công hay ăn con tàu trước đây?"
 anomaly.2522.desc:1 "Sau khi liên tục nghiên cứu bộ xương khổng lồ trên [From.From.GetName], chúng tôi dần tìm ra lý do tại sao sinh vật này lại trôi dạt đến [From.From.GetPlanetMoon]. Ở phần đuôi của bộ xương, chúng tôi phát hiện được các kết quả đo đạc năng lượng tàn dư cực nhỏ, chứng tỏ tại vị trí này từng mở ra một loại cổng dịch chuyển không gian. Sĩ quan khoa học [Root.GetLeaderName] tin rằng, sinh vật này đã xuyên qua cánh cổng dịch chuyển đó từ một chiều không gian khác để đến đây, và nhanh chóng tử vong do sự xâm lấn của môi trường khắc nghiệt trên [From.From.GetName]. Nó vì sao lại đến đây, hay nó đến từ đâu, đều sẽ trở thành những bí ẩn mãi mãi không có lời giải."
 anomaly.2522.b.evopred: "Mặc kệ nó đến từ chiều không gian nào, ADN vẫn là ADN!"
 anomaly.2523.desc:0 "Đống xương này lại cử động được rồi! Con quái thú khổng lồ nhảy vọt qua đầu các pháp sư chiêu hồn của chúng ta, bước những bước đi loạng choạng đầu tiên, rồi đến bước thứ hai, và sau đó là những bước đi vững vàng. Nó có thể không có đủ số chân hay các chi phụ giống như lúc còn sống. Chúng ta đã kết hợp sử dụng cơ bắp được nuôi cấy trong phòng thí nghiệm và chân giả bằng thủy lực chế tác tinh xảo, giờ đây con quái thú khổng lồ này đã sẵn sàng hỗ trợ chúng ta chiến đấu trên bất kỳ chiến trường nào, chắc hẳn mặt đất dưới chân nó sẽ phải rung chuyển."
 anomaly.2523.tooltip:0 "Thêm §G1§! §YQuân đội Quái thú Hài cốt§! trên quỹ đạo."
 anomaly.2530.name:0 "Dấu vết chiến tranh"
 anomaly.2530.desc:0 "Vào một thời điểm nào đó năm ngàn năm trước, một trận chiến không gian quy mô lớn đã xảy ra trên quỹ đạo tầm thấp của [From.GetName]. Một bên bề mặt của [From.GetPlanetMoon] đầy rẫy những hố va chạm do vũ khí bắn trượt để lại. Kết quả quét của [Root.GetName] cho thấy trên bề mặt có một số xác tàu. Mặc dù tình trạng bảo quản của những con tàu vỡ nát này đều rất kém, nhưng trải qua hàng ngàn năm mà những con tàu này vẫn còn lưu lại được một chút gì đó đã đủ để chứng minh thiết kế của chúng vô cùng tối tân. Sĩ quan khoa học [Root.GetLeaderName] đang tổ chức một chuyến khảo sát, với mục đích kiểm tra kỹ lưỡng các thân tàu cổ đại này nhằm tìm kiếm một số công nghệ có giá trị."
 anomaly.2530.desc.bio: "Bằng chứng không thể chối cãi chứng minh rằng trong 5000 năm qua, trên bầu trời [From.GetName] đã từng xảy ra một trận đại chiến quái thú giữa các tàu sống. Bề mặt [From.GetPlanetMoon] hằn sâu những vết sẹo — những tàu sinh học thoi thóp rơi xuống từ quỹ đạo, tạo ra những hố va chạm khổng lồ, lớp vỏ tàn tạ của chúng nứt toác trong vụ va chạm giống như những quả trái cây chín nẫu. Thậm chí đến hiện tại, các phần mềm sụn hóa thạch và tàn dư hữu cơ khô héo từ lâu vẫn còn lưu lại trên mặt đất vỡ vụn.\n\nCấu trúc sinh học của những sinh vật hùng vĩ này đã bị năm tháng làm biến dạng và hóa thạch, hài cốt của chúng gần như không thể nhận ra. Tuy nhiên, sau hàng ngàn năm mục nát và phơi sương gió mà vẫn còn thứ gì đó sống sót được, điều này đã chứng tỏ sức sống phi thường của chúng. Sĩ quan khoa học [Root.GetLeaderName] đang chuẩn bị khảo sát những hóa thạch quái thú này, với hy vọng có thể khám phá được tàn dư trong cấu trúc gen hay sự cộng sinh công nghệ sinh học của chúng; trong những bí mật này có lẽ vẫn còn đang ẩn chứa nhịp đập của sự sống."
 anomaly.2531.desc:1 "Đội ngũ do sĩ quan khoa học [Root.GetLeaderName] dẫn đầu đã hoàn thành chuyến khám phá [From.From.GetName] và trở về [Root.GetName]. Đáng mừng là, trong bãi rác tàu vũ trụ trên bề mặt có chứa vô số công nghệ tiên tiến để chúng ta khám phá. Các công nghệ bên trong vẫn chưa được chúng ta khai thác triệt để, nhưng việc nghiên cứu các xác tàu này đã giúp trình độ công nghệ trong một số lĩnh vực của chúng ta tiến xa được nhiều năm. Nếu có thể xây dựng một trạm khoa học vĩnh viễn trên quỹ đạo, nó sẽ hỗ trợ cực kỳ to lớn cho trình độ kỹ thuật tàu vũ trụ của chúng ta."
 anomaly.2532.desc:1 "Đội ngũ do sĩ quan khoa học [Root.GetLeaderName] dẫn đầu đã hoàn thành chuyến khám phá [From.From.GetName] và trở về [Root.GetName]. Đáng tiếc là, những con tàu rơi trên bề mặt bị hư hỏng quá nặng nề, không thu hồi được bất kỳ công nghệ nào có thể sử dụng. Tuy nhiên, chúng ta có thể thấy rõ những con tàu này vô cùng tiên tiến, nếu tiến hành phân tích cấu trúc và thiết kế của chúng, chúng sẽ cung cấp cho chúng ta kiến thức kỹ thuật vô giá. Chúng ta nên cân nhắc xây dựng một trạm khoa học vĩnh viễn trên quỹ đạo này."
 anomaly.2532.desc.bio: "Nhóm của sĩ quan khoa học [Root.GetLeaderName] đã hoàn thành chuyến thám hiểm đầy bi thương trên [From.From.GetName] và hiện đã trở về [Root.GetName]. Thật không may, thời gian đã không khoan nhượng với di hài hữu cơ cổ đại này. Cấu trúc đã chết của chúng nếu không phải đã hóa thạch từ lâu thì cũng biến thành lớp vỏ canxi giòn tan, gần như không có giá trị phục hồi tức thời.\n\nTuy nhiên, ngay cả khi đã chết, thiết kế của chúng vẫn vượt quá sự hiểu biết hiện tại của chúng ta. Lưới tinh thể phức tạp trên bộ xương kỹ thuật sinh học của chúng, tàn tích của các mô cơ từng một thời hoạt động, và dấu vết của các cấu trúc thần kinh vượt xa sự thấu hiểu của chính chúng ta, tất cả đều cho thấy công nghệ phức tạp trong đó vẫn cần được nghiên cứu thêm. Xây dựng một căn cứ nghiên cứu vĩnh viễn trên quỹ đạo có thể sẽ là chìa khóa để giải mã bí mật của những sinh vật khổng lồ đã tuyệt chủng từ lâu này."
 anomaly.2540.name:0 "Bức vẽ ngoài hành tinh"
 anomaly.2540.desc:0 "Trong lúc quét bề mặt của [From.GetName], [Owner.GetScientistCapital] [Root.GetLeaderName] trên [Root.GetName] đã phát hiện những phiến đá được điêu khắc nhân tạo, phía trên có khắc chữ viết ngoài hành tinh. Không phát hiện thêm các hoạt động ngoài hành tinh nào khác trên [From.GetPlanetMoon], bức vẽ này rốt cuộc đã tới đây bằng cách nào vẫn còn là một bí ẩn. Tiếp theo, chúng tôi chuẩn bị bắt tay vào công việc giải mã."
 anomaly.2541.desc:0 "[Owner.GetScientistCapital] [Root.GetLeaderName] đã giải mã được một phần bức vẽ ngoài hành tinh tìm thấy trên [From.From.GetName]. Nó được dùng để tưởng niệm một chủng tộc ngoài hành tinh đã diệt vong từng xây dựng một đế chế giữa các vì sao quy mô nhỏ trong khu vực này. Rất rõ ràng, những người tiêu diệt họ cũng chính là tác giả của bức vẽ này, họ dường như rất hối hận về quyết định đó.\n\nXét thấy bức vẽ này đã có tuổi thọ hơn ba trăm triệu năm, tác giả của nó rất có thể cũng đã bị tuyệt chủng. Có lẽ điều thú vị nhất là vật liệu của bức vẽ này — mặc dù có lịch sử lâu đời, nhưng nó vẫn được bảo quản cực kỳ nguyên vẹn."
 anomaly.2542.desc:0 "[Owner.GetScientistCapital] [Root.GetLeaderName] đã giải mã được một phần bức vẽ ngoài hành tinh trên [From.From.GetName]. Trong đó chứa đựng một lượng lớn dữ liệu, vì vậy bức vẽ này rất có thể là một kiểu thư viện thô sơ. Bức vẽ ghi chép sơ lược tất cả những kiến thức công nghệ mà nền văn minh ngoài hành tinh thống trị khu vực này thu thập được vào tám mươi triệu năm trước.\n\nHầu hết kiến thức chúng ta đều đã biết, nhưng trong dữ liệu vẫn còn một số thông tin công nghệ vô cùng mang tính gợi mở. Dữ liệu ở đây đủ cho các nhà khoa học nghiên cứu trong nhiều thập kỷ, do đó cần thiết lập một cơ sở nghiên cứu trên quỹ đạo để tiếp tục công việc biên dịch."
 anomaly.2550.name:0 "Xưởng đóng tàu tự động"
 anomaly.2550.desc:0 "Trong lúc khảo sát [From.GetName], [Root.GetName] đã phát hiện được tàn tích của một xưởng đóng tàu tự động trên quỹ đạo. Xưởng đóng tàu này ít nhất đã một ngàn năm tuổi, và từng bị tên lửa hạng nặng bắn phá liên tục, điều may mắn là một trong số các ụ tàu vẫn có thể sử dụng được.\n\nSĩ quan khoa học [Root.GetLeaderName] tin chắc có thể khôi phục lại nguồn điện của xưởng đóng tàu, nhưng quá trình sẽ khá phức tạp."
 anomaly.2550.desc.bio: "Trong quá trình khảo sát [From.GetName], [Root.GetName] đã có một phát hiện đáng kinh ngạc: tàn tích của một cái nôi ươm mầm không gian cổ đại và lụi tàn; đây là một cấu trúc hữu cơ khổng lồ, nó từng có thể chế tạo ra tàu giữa các vì sao. Nó trôi dạt trong tĩnh lặng, màng ngoài vỡ nát teo tóp, điều này dường như đã xảy ra trong một cuộc bắn phá tàn khốc vài thế kỷ trước. Phần lớn tổ chức ống mạch của nó đã hóa thạch, mạng lưới thần kinh không có phản ứng... Tuy nhiên, vẫn còn một phòng ươm mầm đang nhúc nhích yếu ớt, lò phản ứng của nó đang đập chậm rãi với chút sự sống còn sót lại.\n\nSĩ quan khoa học [Root.GetLeaderName] tin rằng, chỉ cần cẩn thận can thiệp, chúng ta có lẽ có thể hồi sinh sinh mệnh đang ngủ say này, ít nhất là hồi sinh một phần. Tuy nhiên, đây sẽ là một công trình khá tốn thời gian, và những rủi ro phản ứng sinh học không thể lường trước cũng không thể xem nhẹ."
 anomaly.2551.desc:1 "[Root.GetFleetName] đã khôi phục thành công nguồn điện cho xưởng đóng tàu tự động trên [From.From.From.GetName]. Xưởng đóng tàu nhanh chóng khôi phục lại chương trình sản xuất đã bị gián đoạn trước đó, sử dụng các vật liệu hiện có để chế tạo ba chiếc tàu chiến Đột kích có cấu trúc không xác định.\n\nĐáng tiếc là sau đó xưởng đóng tàu cổ đại này đã gặp phải sự cố hỏng hóc nghiêm trọng không thể sửa chữa. Do đó chúng ta chỉ có thể lựa chọn tiếp quản ba con tàu này, cho chúng gia nhập hạm đội của chúng ta."
 anomaly.2551.desc.bio: "[Root.GetFleetName] đã phục hồi thành công chiếc nôi ngủ say xoay quanh [From.From.From.GetName]. Lò rèn sinh học ngưng hoạt động lâu năm đột ngột thức tỉnh khiến cấu trúc hữu cơ cổ đại này rung lên, nó vội vã hoàn thành chu kỳ sinh trưởng của ba con chiến thú, thiết kế của chúng đều không thể xác định, nhưng lại phức tạp đến dị thường.\n\nTuy nhiên, sự tái sinh không ngờ này đối với cơ thể sinh vật đang già cỗi mà nói, áp lực là quá lớn. Mạch dẫn của nó sụp đổ, trung tâm thần kinh khô héo, tan biến thành khối sinh khối trơ. Hạm đội mới được tập hợp mặc dù ban đầu có chút mất phương hướng, nhưng đã nhanh chóng thích nghi với sự hiện diện của chúng ta. Chúng được sáp nhập vào hạm đội của chúng ta, nóng lòng muốn lập công cho chủ thể cộng sinh mới."
 anomaly.2552.desc:1 "[Root.GetFleetName] đã khôi phục thành công nguồn điện cho xưởng đóng tàu tự động trên [From.From.From.GetName]. Xưởng đóng tàu nhanh chóng khôi phục lại chương trình sản xuất đã bị gián đoạn trước đó, sử dụng các vật liệu hiện có để chế tạo một chiếc tàu pháo có cấu trúc không xác định.\n\nĐáng tiếc là sau đó xưởng đóng tàu cổ đại này đã gặp phải sự cố hỏng hóc nghiêm trọng không thể sửa chữa. Do đó chúng ta chỉ có thể lựa chọn tiếp quản con tàu này, cho nó gia nhập hạm đội của chúng ta."
 anomaly.2560.name:0 "Tàu vũ trụ hành tinh khí khổng lồ"
 anomaly.2560.desc:0 "Quét sâu [From.GetName] cho thấy có một chiếc tàu vũ trụ cỡ lớn nằm trong bầu khí quyển của hành tinh khí khổng lồ này. Đánh giá từ các mảnh vỡ gần đó, trong quá khứ từng có người cố gắng thu hồi nó, nhưng đều thất bại. Bất kỳ con tàu nào đủ sức chống chọi được lực hấp dẫn mạnh như vậy đều vô cùng quý giá. Sĩ quan khoa học [Root.GetLeaderName] đã đưa ra kế hoạch thu hồi của riêng mình."
 anomaly.2560.a:0 "Mang nó về bằng mọi giá."
 anomaly.2560.b:0 "Cái giá phải trả quá lớn, mặc kệ nó đi."
 anomaly.2561.desc:0 "Bằng cách vận dụng kỹ thuật công trình bậc thầy vô song, sĩ quan khoa học [Root.GetLeaderName] và tiểu đội của anh ta đã đưa thành công chiếc tàu bị bỏ hoang trên [From.From.GetName] lên thượng tầng khí quyển. Dù lâu năm không được bảo trì, chiếc tàu tuần dương cổ đại này vẫn khá nguyên vẹn, các hệ thống vẫn hoạt động bình thường sau khi được cấp điện. Không rõ tung tích của phi hành đoàn ban đầu ra sao, nhưng chúng ta vẫn cử phi hành đoàn mới tới và cho nó gia nhập hạm đội của chúng ta."
 anomaly.2562.desc:0 "Kế hoạch thu hồi con tàu trong bầu khí quyển [From.From.GetName] của sĩ quan khoa học [Root.GetLeaderName] đã thất bại. Lực hấp dẫn mạnh của hành tinh đã khiến động cơ của một trong những tàu kéo kỹ thuật của chúng ta tắt ngấm, và đâm sầm vào con tàu bị bỏ hoang này. Vài người đã bỏ mạng vì việc đó, và con tàu kia cũng từ đó bị kéo sâu hơn vào trong bầu khí quyển - chúng ta đã bất lực trước chuyện này."
 anomaly.2570.name:0 "Quỹ đạo chết"
 anomaly.2570.desc:0 "Một trong vô số vệ tinh bay quanh [From.GetName] có một quỹ đạo chết. Nó sắp sửa va chạm với hành tinh khí khổng lồ, điều này chắc chắn sẽ gây ra sự tàn phá cực lớn. Đây sẽ là một cảnh tượng ngoạn mục hàng triệu năm mới có một lần, càng tình cờ hơn là, vụ va chạm này diễn ra ngay sau khi một phi thuyền của chúng ta ghé qua đó. Nhiều nhà khoa học rất muốn đích thân có mặt tại hiện trường để quan sát và ghi lại sự kiện này, nhưng những vụ va chạm như vậy chỉ diễn ra trong chớp mắt, vì vậy thời gian dành cho chúng ta không còn nhiều."
 anomaly.2571.desc:0 "Chúng ta đã ghi lại thành công quang cảnh kỳ vĩ của vụ va chạm giữa [CollisionLocation.GetName] và vệ tinh từ nhiều góc độ khác nhau, đồng thời phát trực tiếp cho tất cả khán giả trong khu vực. Quan trọng hơn, các nhà khoa học của chúng ta dưới sự dẫn dắt của [Root.GetLeaderName] đã ghi chép lại một lượng lớn dữ liệu vật lý quý giá, điều này chắc chắn sẽ giúp ích cho việc nghiên cứu."
 anomaly.2572.desc:0 "Chúng ta đã sượt qua vụ va chạm giữa [From.From.GetName] và vệ tinh. Các nhà khoa học lại phát hiện một vệ tinh có quỹ đạo đang phân rã, họ dự tính nó sẽ va chạm với hành tinh khí khổng lồ sau 7,6 triệu năm nữa. Có lẽ lúc đó vận may của chúng ta sẽ tốt hơn một chút..."

 anomaly.5000.name:0 "Tín hiệu hành tinh khí khổng lồ"
 anomaly.5000.desc:0 "[Root.GetName] đã đo đạc được một vài kết quả thú vị từ [From.GetName]. Bầu khí quyển của hành tinh khí khổng lồ đó có bức xạ liều lượng cao, dường như được gây ra bởi một cuộc bắn phá quỹ đạo dày đặc. Về phần tại sao có người lại muốn làm vậy thì vẫn là một bí ẩn.\n\nNgay khi [Root.GetName] chuẩn bị rời khỏi quỹ đạo, nhà khoa học [Root.GetLeaderName] đã phát hiện một tín hiệu yếu ớt từ bên trong hành tinh. Có lẽ là một dạng tín hiệu liên lạc, nhưng bức xạ nền của hành tinh quá mạnh, rất khó để tách tín hiệu ra khỏi tiếng ồn xung quanh."
 anomaly.5000.a:0 "Chúng ta nên điều tra tín hiệu này."
 anomaly.5000.b:0 "Chỉ là sai số máy dò thôi. Bỏ qua đi."
 anomaly.5001.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] đã tìm cách tách được tín hiệu đó từ sâu trong bầu khí quyển của [From.From.From.GetName]. Đây thực sự là một dạng liên lạc, chúng tôi cũng đã lọc nó ra nhờ sự trợ giúp của phần mềm lọc sóng."
 anomaly.5002.desc:0 "Tín hiệu bên trong hành tinh khí khổng lồ [From.From.From.GetName] đã biến mất. Chúng ta không bao giờ còn biết được nó bắt nguồn từ đâu nữa."
 anomaly.5003.name:0 "Tín hiệu truyền đi của hành tinh khí khổng lồ"
 anomaly.5003.desc:0 "Cuối cùng cũng gặp mặt, lữ khách! Chúng tôi là người Dathnak, hành tinh mà bạn đang quay quanh quỹ đạo tên là Torok'Lon - là quê nhà của tổ tiên chúng tôi. Việc gặp gỡ những giống loài khác luôn khiến người ta phấn chấn, mặc dù lần gặp gỡ trước đây giữa chúng ta... có vẻ không suôn sẻ lắm. Chắc chắn bạn đã phát hiện ra bức xạ phát ra từ bầu khí quyển của chúng tôi. Torok'Lon đã thoi thóp rồi, nếu không có nơi nương náu khác, giống loài của chúng tôi sẽ bị xóa sổ. Chúng tôi đã tìm xong quê nhà tiếp theo cho mình, nhưng không có cách nào để tới đó. Đáng tiếc là, đặc điểm vô hình của chúng tôi có nghĩa là chúng tôi không có nhiều công nghiệp hay công nghệ. Các bạn có thể giúp chúng tôi không?"
 anomaly.5003.a:0 "Đã không có công nghệ, vậy sao các người có thể trò chuyện với chúng tôi?"
 anomaly.5003.a.response:0 "Chuyện này à, dù sao các bạn cũng không phải là vị khách đầu tiên mà chúng tôi gặp. Một giống loài hào phóng nào đó đã tặng cho chúng tôi vài máy liên lạc không gian con và một mảng quét vào 2,9 triệu năm mặt trời trước. Họ đã cải tiến nó cho phù hợp với đặc điểm sinh lý của chúng tôi. Có thể coi đây là một trong những điểm tốt khi bắt gặp những người như các bạn."
 anomaly.5003.b:0 "Hành tinh của các người bị sao vậy?"
 anomaly.5003.b.response:0 "Ừm, chúng tôi đã có chút xích mích với những người đến đây vài ngàn năm trước, họ muốn chúng tôi tin vào tín ngưỡng của họ, chúng tôi từ chối, và thế là họ muốn diệt chúng tôi. Ngay cả một lời báo trước cũng không có! Thừa lúc chúng tôi không chú ý, họ đưa hạm đội vào quỹ đạo trên đầu chúng tôi, ném bom bắn phá chúng tôi điên cuồng."
 anomaly.5003.c:0 "Ngươi muốn nhờ chúng tôi chuyển toàn bộ người dân của đế chế sang một hành tinh khác sao?"
 anomaly.5003.c.response:0 "Đúng vậy! Và hy vọng được làm ngay lập tức! Đừng lo, người của chúng tôi thực ra cũng không quá nhiều. Nhiều người Dathnak đã bỏ mạng trong đợt ném bom đó, những người sống sót thì lùi sâu hơn vào bầu khí quyển. Việc liên lạc với bề mặt ở đây không được thông suốt cho lắm, và bức xạ cũng đang lây lan. Chúng tôi không còn nhiều thời gian nữa!"
 anomaly.5003.d:0 "Chúng tôi sẽ giúp các người chuyển nhà."
 anomaly.5003.d.response:0 "Tuyệt quá! Tôi biết là các bạn đáng tin cậy mà. Tọa độ nhà mới của chúng tôi đã được gửi cho các bạn. Bạn phải hứa với tôi là không được đến đó chiếm chỗ trước, mặc kệ nơi đó tốt đến thế nào!"
 anomaly.5003.e:0 "Xin lỗi, chuyện này hơi phiền phức quá."
 anomaly.5003.e.response:0 "Tôi biết ngay mà! Tôi đã nói với những người khác rằng đám sinh vật rắn này đều là bọn khốn kiếp vô nhân tính, họ cứ không tin!\n\nĐám các người à — đúng là bệnh dịch của hệ sao! Sẽ có ngày chúng tôi tước đoạt địa vị của các người, đến lúc đó sẽ tính sổ với các người. Hãy nhớ lấy lời tôi. Thời đại của sinh vật rắn đã kết thúc rồi! Thời đại của sự sống dạng khí sẽ đến!"
 anomaly.5004.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] đã giám sát toàn bộ chuyến hành trình chuyển nhà của người Dathnak. Một đoàn tàu chở hàng dân sự được trang bị các bể áp suất cao cỡ lớn chở theo những sinh vật khí bay ngang bầu trời, đưa họ tới bầu khí quyển của hành tinh khí khổng lồ. Và cũng tiện thể chở theo cả mảng quét cùng máy liên lạc cổ đại."
 anomaly.5004.a:0 "Gọi cho họ."
 anomaly.5005.desc:0 "Môi trường của Torok'Lon ngày càng xấu đi, chúng ta không thể cứu những người Dathnak đó được nữa. Bức xạ đã lan rộng ra hầu hết bầu khí quyển, những người Dathnak sống sót đành phải rút lui đến những nơi gần lõi hơn, và điều kiện liên lạc ở đó khá tệ. Rốt cuộc bức xạ cũng sẽ lây lan tới đó, những người Dathnak kia chỉ đành phó mặc cho số phận."
 anomaly.5006.desc:0 "Chúng tôi sẽ mãi nợ các bạn một ân tình! Hành tinh này tốt hơn chúng tôi tưởng tượng. Lần đầu tiên trong đời, con cháu chúng tôi có thể chơi đùa chạy nhảy trong bầu khí quyển mà không phải lo lắng về an toàn tính mạng của mình. Chúng tôi đã quyết định lấy tên giống loài của bạn để đặt cho ngôi nhà mới của chúng tôi, Baldarak. Hậu duệ của người Dathnak sẽ mãi mãi nhớ tới vị cứu tinh của chúng tôi!"
 anomaly.5006.a:0 "Baldarak sao? Nhưng chúng tôi là [Root.GetSpeciesNamePlural] mà..."
 anomaly.5006.a.response:0 "Vậy sao? Vậy thì thật... quá xấu hổ, nhưng đám sinh vật rắn các bạn thực sự trông quá giống nhau. E rằng bây giờ có đổi tên cũng không kịp nữa rồi... Cái tên này nghe cũng hay mà!"
 anomaly.5006.a.2:0 "Baldarak? Quả là một cái tên hay!"
 anomaly.5006.a.2.response:1 "Cái tên này thực sự rất hay, phải không? Được cứu bởi những sinh vật rắn có cái tên nghe thật êm tai như các bạn quả là sự may mắn của chúng tôi!"
 anomaly.5006.b:0 "Chúc các bạn may mắn ở ngôi nhà mới."
 anomaly.5006.b.response:0 "Một lần nữa xin cảm ơn, người bạn thân mến! Cầu mong luồng khí giữ cho bạn không bao giờ rơi."
 anomaly.5007.name:0 "Khu định cư mới"
 anomaly.5007.desc:0 "Xin chào! Số lượng giống loài của chúng tôi đã tăng gấp bốn lần kể từ khi đến đây, biết được điều đó chắc hẳn bạn sẽ rất vui! Ngay khi vừa tới hành tinh này, mọi người đều reo hò nhảy múa, và đến nay không khí thậm chí còn hơi giống một lễ hội. Sau khi định cư thành công trên Baldarak, một số người tiên phong dũng cảm muốn tới một hành tinh khí khổng lồ khác, họ nhờ tôi cầu xin bạn xem có được không. Chúng tôi đã nhắm được một hành tinh ứng viên đầy triển vọng, rất thích hợp để định cư; và nó nằm ngay trong khu vực các bạn quản lý. Bạn thấy sao, hỡi người bạn?"
 anomaly.5007.a:0 "Dù sao thì cũng là một hành tinh khí khổng lồ, vậy thì..."
 anomaly.5007.a.response:0 "Tuyệt quá! Chúng tôi sẽ gửi tọa độ cho bạn. Cư dân của chúng tôi đang không thể chờ đợi thêm được nữa rồi!"
 anomaly.5007.b:0 "Tuyệt đối không được. Chúng ta đã thỏa thuận là chỉ đưa các người lên một hành tinh thôi."
 anomaly.5007.b.response:0 "Tôi hiểu rồi... Vậy thì chúng tôi sẽ ngoan ngoãn ở lại Baldarak, và tận dụng tối đa điều kiện ở đây."
 anomaly.5008.desc:0 "Cũng giống như lần trước, một đoàn tàu hàng được dùng để vận chuyển an toàn những người định cư Dathnak tới hành tinh khí áp suất cao này. Không lâu sau đó, họ hạ cánh thành công, và đặt tên nơi này là \"Tân Baldarak\". Trên quỹ đạo có để lại một vệ tinh nhân tạo dùng để liên lạc đường dài với Baldarak."
 anomaly.5008.a:0 "Làm tốt lắm, Dathnak."
 anomaly.5009.name:0 "Chabik Laddi"
 anomaly.5009.desc:0 "Tân Baldarak gửi lời chào tới bạn! Mọi thứ ở khu định cư mới này đều ổn, nhưng chúng tôi lại có một thỉnh cầu nhỏ... Một trong số những cư dân của chúng tôi, Chabik Laddi, rất nhớ gia đình và bạn bè trên Baldarak, muốn được về nhà. Cô ấy cằn nhằn sắp khiến chúng tôi phát điên rồi! Nếu không phiền, bạn có thể tới đón cô ấy về được không?"
 anomaly.5009.a:0 "Cái gì?! Đừng hòng mơ!"
 anomaly.5009.a.response:0 "Chúng tôi vẫn phải hỏi... xin đừng để bụng. Chabik sẽ cố gắng hết sức để sống ở đây, giống như tất cả chúng tôi vậy! Xin lỗi vì đã lãng phí thời gian của bạn, hỡi người bạn [Root.GetSpeciesName]."
 anomaly.5009.b:0 "Haiz... Thôi được rồi."
 anomaly.5009.b.response:0 "Tuyệt quá. Hy vọng sẽ không làm lãng phí quá nhiều tài nguyên của bạn, vì chỉ là đi đón một người thôi. Chúng tôi sẽ sắp xếp ổn thỏa ở bên này. Tôi vừa mới nói với Chabik, cô ấy vui sướng đến độ xoay vòng vòng tại chỗ! Cô ấy có vẻ hơi mất kiểm soát vì sung sướng rồi... Xin lỗi không thể tiếp chuyện, hỡi người bạn [Root.GetSpeciesName]..."
 anomaly.5010.desc:0 "Dưới sự hộ tống của [Root.GetName], một phi thuyền nhỏ mang theo bình lọc khí độc tìm tới Baldarak. Khí trong bình lọc được xả vào bầu khí quyển của hành tinh khí này, đưa cư dân Dathnak đó về nhà an toàn."
 anomaly.5010.a:0 "Tạ ơn trời đất."
 anomaly.5011.name:0 "Mất liên lạc"
 anomaly.5011.desc:0 "Chúng tôi vừa nhận được tin tức đáng lo ngại, hỡi người bạn [Root.Owner.GetSpeciesName]! Chúng tôi đã mất liên lạc với Tân Baldarak! Họ không còn phản hồi tín hiệu vệ tinh của chúng tôi phát ra nữa, e rằng phải chuẩn bị cho tình huống xấu nhất. Có lẽ bọn ngoài hành tinh xâm lược quê hương chúng tôi đã quay lại. Xin hãy phái tàu tới điều tra!"
 anomaly.5011.a:0 "Chúng tôi sẽ phái tàu đi ngay."
 anomaly.5011.a.response:0 "Tuyệt quá! Hy vọng chỉ là hỏng thiết bị phát sóng."
 anomaly.5011.b:0 "Đủ rồi đấy! Chúng tôi không phải kẻ chạy việc vặt cho các người."
 anomaly.5011.b.response:0 "Nhưng, nhưng họ có thể đều đã chết! Cậu nhẫn tâm như vậy sao? Chúng tôi đã nhìn nhầm cậu rồi, [Root.GetSpeciesName]!"
 anomaly.5012.desc:0 "Chúng tôi không phát hiện điều gì bất thường trên Tân Baldarak. Vệ tinh nhân tạo dùng để liên lạc với thủ đô vẫn đang hoạt động bình thường."
 anomaly.5012.a:0 "Mở một kênh liên lạc với hành tinh."
 anomaly.5013.name:0 "Mặt trận Cách mạng"
 anomaly.5013.desc:0 "Mặt trận Cách mạng Tân Baldarak gửi lời chào tới các người! Chúng ta đã lật đổ Baldarak! Chúng ta không có hiềm khích với ngươi, [Root.Owner.GetSpeciesName], chỉ cần ngươi không đi ủng hộ hành vi phản cách mạng của bọn thống trị Baldarak. Nhưng ngươi có thể hỗ trợ chúng ta... Ngươi có sẵn lòng đưa một đội đột kích tới Baldarak không?"
 anomaly.5013.a:0 "Hãy kể cho chúng tôi kế hoạch của các người."
 anomaly.5013.a.response:0 "Chúng ta định đưa một đội đột kích tinh nhuệ xâm nhập vào Baldarak. Bọn họ sẽ phá vỡ xiềng xích. Sau khi kẻ thống trị tàn bạo bị phế truất, tất cả người Dathnak rốt cuộc sẽ được sống một cuộc đời tự do tự tại. Kế hoạch này vô cùng đơn giản và rõ ràng, [Root.Owner.GetSpeciesName]."
 anomaly.5013.b:0 "Chúng tôi sẽ đưa binh lính của các người qua đó."
 anomaly.5013.b.response:0 "Thật sao?! Cậu là một đồng chí tốt của cách mạng chúng ta, [Root.Owner.GetSpeciesName]! Để tôi đi tổ chức lực lượng!"
 anomaly.5013.c:0 "Chúng tôi không can thiệp vào tranh chấp nội bộ của các người."
 anomaly.5013.c.response:0 "Đương nhiên rồi! Chúng ta không muốn để ngọn lửa nhỏ của cách mạng thiêu đốt đến những quần chúng bị ngươi coi như nô lệ kia đâu!"
 anomaly.5014.name:0 "Phản hồi của Baldarak"
 anomaly.5014.desc:0 "Tôi đại diện cho những người Dathnak hợp pháp của Baldarak lên tiếng. Chúng tôi đã nhận được tuyên bố của tổ chức đang nắm quyền trên Tân Baldarak hiện tại, toàn nói hươu nói vượn! Lũ thổ phỉ này đúng là nỗi nhục của chúng tôi, [Root.Owner.GetSpeciesName]. Cậu có thể giúp dập tắt cuộc \"cách mạng\" nhỏ xíu của chúng không? Tôi e rằng nếu sự việc lan tới đây sẽ có người bị thương. Tướng quân Patanak đã cử một đội viễn chinh nhằm giành lại khu định cư, nhưng chúng tôi cần cậu giúp đưa họ tới đó."
 anomaly.5014.a:0 "Chúng tôi sẽ giúp."
 anomaly.5014.a.response:0 "Biết ngay là có thể trông cậy vào cậu mà, [Root.Owner.GetSpeciesName]! Bọn phiến quân này sẽ phải chết không nhắm mắt!"
 anomaly.5014.b:0 "Vấn đề của mình tự mình giải quyết đi."
 anomaly.5014.b.response: "Đợi làn sóng nổi loạn này lan tới hành tinh của ngươi, ngươi sẽ phải hối hận đấy, [Root.Owner.GetSpeciesName]! Đừng tưởng ngươi có thể kê cao gối mà ngủ!"
 anomaly.5015.desc:0 "Một con tàu do [Root.GetName] hộ tống lặng lẽ thả khoang bay vào trong bầu khí quyển của Baldarak, bên trong chở đội đột kích của quân cách mạng. Giây lát sau, bên dưới tầng mây của hành tinh khí phát ra những tia chớp chớp liên hồi. Đây là bắt đầu chiến đấu rồi sao?"
 anomaly.5015.a:0 "Chúng ta cứ chờ xem sao."
 anomaly.5016.name:0 "Ủy ban Cách mạng"
 anomaly.5016.desc:0 "Tôi là Votanga! Nhân dân Baldarak đã lật đổ ách áp bức, chúng nghĩ rằng có thể biến giống loài của chúng ta thành nô lệ. Chúng tôi đã thành lập một Ủy ban Cách mạng, để đảm bảo đế chế vĩ đại của chúng ta có thể vượt qua giai đoạn chuyển giao này, và nỗ lực giải phóng nhân dân ta. Chúng tôi cảm ơn các đồng chí ở [Root.GetName], sự giúp đỡ của họ đã biến ngày hôm nay thành hiện thực. Hết."
 anomaly.5016.a:0 "Có lẽ mọi thứ sẽ trở nên tốt đẹp hơn."
 anomaly.5017.name:0 "Tuyên bố công khai của Baldarak"
 anomaly.5017.desc:0 "Tôi là Votanga! Để tưởng nhớ thủ lĩnh của tôi, Ủy ban Cách mạng Nhân dân đã nhất trí đổi tên hành tinh \"Baldarak\" thành \"Tộc Votanga\". Đồng thời, \"Tân Baldarak\" trước đây sẽ được đổi tên thành \"Chabikmak\", lấy theo tên của Chỉ huy An ninh Công cộng Chabik Laddi của chúng tôi. Hết."
 anomaly.5017.b:0 "Đủ rồi đấy. Chặn tất cả liên lạc của đám sinh vật này đi."
 anomaly.5018.desc:0 "Tôi là Votanga! Ủy ban Cách mạng Nhân dân tuyên bố, 4539 người sắp bị kết án tử hình vì tội phản bội và phản cách mạng. Với những kẻ có ý đồ ngăn cản cuộc cách mạng vinh quang của chúng ta, mong rằng tuyên bố này sẽ là một bài học đắt giá. Hết."
 anomaly.5019.desc:0 "Tôi là Lamag! Ủy ban Cách mạng Nhân dân tuyên bố, Votanga sắp bị kết án tử hình vì tội xúi giục, mục nát và chểnh mảng nhiệm vụ, thi hành ngay lập tức. Tôi sẽ tiếp quản mọi công việc trước đây của hắn. Sắc lệnh đầu tiên của tôi là khôi phục lại những cái tên ban đầu cho tộc Votanga và Chabikmak. Hết."
 anomaly.5020.desc:0 "Dưới sự hộ tống của [Root.GetName], một vài tàu hàng thả một đội quân viễn chinh Dathnak vào bầu khí quyển của Tân Baldarak. Giây lát sau, bên dưới tầng mây của hành tinh khí phát ra những tia chớp chớp liên hồi. Trận chiến dường như đã bắt đầu."
 anomaly.5020.a:0 "Bây giờ chúng ta đứng khoanh tay đứng nhìn đi."
 anomaly.5021.name:0 "Lực lượng viễn chinh giành quyền kiểm soát"
 anomaly.5021.desc:0 "Tôi là Tướng quân Patanak, tôi đang ở Tân Baldarak. Chiến dịch Lửa giận lan trào đã toàn thắng. Mọi mục tiêu chính đều đã đạt được, tất cả các khu vực khí quyển đều đã khôi phục sự kiểm soát của chính quyền. Ngoại trừ một vài nơi vẫn đang ngoan cố chống trả, đa phần phiến quân đều đã hạ vũ khí đầu hàng hoặc tử trận. Cảm ơn sự giúp đỡ của các bạn, [Root.Owner.GetSpeciesNamePlural]. Xin thứ lỗi cho tôi, tôi cần báo cáo thương vong cho Baldarak. Patanak thông báo hết."
 anomaly.5021.a:0 "Chiến dịch diễn ra cực kỳ thành công."
 anomaly.5022.name:0 "Thông báo từ Tân Baldarak"
 anomaly.5022.desc:0 "Tôi là Tướng quân Patanak, Chỉ huy Quân đoàn tạm quyền của Tân Baldarak. Rất vui được thông báo các trận đánh chính ở Khu vực 47-G đã kết thúc. Ít nhất 512 kẻ kháng cự đã bị tiêu diệt, thương vong phía chúng tôi cực kỳ thấp. Đặc biệt biểu dương các đơn vị đã khống chế được thương vong của dân thường ở mức có thể chấp nhận được. Patanak thông báo hết."
 anomaly.5023.desc:0 "Tôi là Tướng quân Patanak, Chỉ huy Quân đoàn của Tân Baldarak. Tôi hy vọng sẽ làm rõ những tin đồn về việc thế giới này lại xuất hiện các hoạt động kháng cự. Điều này hoàn toàn không phải là sự thật. Hành tinh này đã hoàn toàn khôi phục hòa bình, mọi yếu tố bất ổn tiềm tàng đều đã bị nhổ tận gốc rễ. Người dân của nó đã một lần nữa quay lại sống dưới sự cai trị của Đế chế Dathnak. Patanak thông báo hết."
 anomaly.5024.desc:0 "Tôi là Tướng quân Laptaz, Chỉ huy Quân đoàn của Tân Baldarak. Rất lấy làm tiếc phải thông báo với mọi người về cái chết của người tiền nhiệm của tôi, Tướng quân Patanak. Ngài ấy bị dụ vào ổ phục kích đê hèn của đội quân phiến loạn, và đã hy sinh anh dũng. Chúng tôi sẽ tổ chức một lễ tang long trọng, đồng thời ăn mừng chiến thắng vừa giành được khi trấn áp sào huyệt của quân nổi loạn. Laptaz thông báo hết."
 anomaly.5025.name:0 "Viện Khoa học Baldarak"
 anomaly.5025.desc:0 "[Root.Owner.GetSpeciesNamePlural]! Tôi đại diện cho Viện Khoa học Baldarak giao tiếp với các bạn. Mặc dù người Dathnak chúng tôi không thạo về công nghệ, nhưng chúng tôi lại cực kỳ giỏi suy diễn lý tính!\n\nMột vài hội nhóm trí thức của người khí chúng tôi đã dành nhiều năm nghiên cứu vật lý lý thuyết, và muốn chia sẻ thành quả đạt được. Biết đâu dữ liệu của chúng tôi lại có ích cho công cuộc kiến thiết đế chế mà đám sinh vật rắn các bạn hằng say mê."
 anomaly.5025.a:0 "Thật tốt."
 anomaly.5026.name:0 "Tổng vệ sinh"
 anomaly.5026.desc:0 "Xin chào, [Root.Owner.GetSpeciesNamePlural]! Có thể giúp chúng tôi một việc được không? Lực hấp dẫn mạnh mẽ của Baldarak đã kéo đủ loại rác rưởi vào bầu khí quyển của chúng tôi, gần đây chúng tôi đã quyết định tiến hành dọn dẹp. Có một đội dọn dẹp phát hiện một khoang bay bị bỏ hoang, các bạn có thể giúp xử lý nó được không? Bên trong nó hình như nhét đầy đủ loại kim loại vô dụng."
 anomaly.5026.a:0 "Được thôi, chúng tôi sẽ giúp bạn giải quyết..."

 henrik.16.name:0 "Thử nghiệm dự án đặc biệt"
 henrik.16.desc:0 "Sự kiện này sẽ mang lại dự án đặc biệt cho [Root.GetName]."
 henrik.16.a:0 "Rất tốt!"
 henrik.20.name:0 "Đã thu hút quân đoàn địch"
 henrik.20.desc:0 "Một vài quân đoàn địch sẽ xuất hiện ở [Root.GetName]."
 henrik.20.a:0 "Chỉnh đốn trang bị xuất phát!"
 henrik.21.name:0 "Chiến thắng!"
 henrik.21.desc:0 "Chúng ta đã đánh bại đội quân đê tiện của [From.GetName]!"
 henrik.22.name:0 "Thất bại!"
 henrik.22.desc:0 "Chúng ta đã bị đội quân đê tiện của [From.GetName] đánh bại!"
 henrik.145.desc:0 "Chúng tôi là [Root.GetSpeciesNamePlural]."
 henrik.166.desc:0 "Mục tiêu của sự kiện là [test_target.GetName]"

 ####################################
 # Anomaly Failure Events
 ####################################
 DISC_FAILURE:0 "Thất bại"
 DISC_CRITICAL_FAILURE:0 "Thất bại thảm hại"
 anomaly_failure.1.desc:1 "Nhà khoa học [Root.GetLeaderName] đã lệnh cho [Root.GetName] phóng một máy thăm dò xuống miệng hố trên [From.From.GetName]. Không may là, động cơ đẩy đánh lửa của máy thăm dò đánh lửa thất bại, nó vỡ nát thành nhiều mảnh và rơi ngay giữa miệng hố."
 anomaly_failure.2.desc:0 "Mặc dù tiểu hành tinh [From.From.GetName] có thể đến từ ngoài hệ sao, nhưng nó hoàn toàn chẳng có điểm gì đặc biệt. Sĩ quan khoa học [Root.GetLeaderName] và thành viên phi hành đoàn [Root.GetName] thỉnh cầu tiếp tục khám phá ở nơi khác."
 anomaly_failure.3.desc:0 "Toàn bộ thành viên phi hành đoàn [Root.GetName] dành vài ngày lọc lại các mảnh vỡ trên bề mặt [From.From.GetName]. Sĩ quan khoa học [Root.GetLeaderName] báo cáo không tìm thấy bất kỳ thứ gì có giá trị."
 anomaly_failure.4.desc:0 "Không tìm thấy nguồn phát sóng năng lượng kỳ lạ của tiểu hành tinh [From.From.GetName]. Sĩ quan khoa học [Root.GetLeaderName] và [Root.GetName] đang chờ lệnh mới."
 anomaly_failure.5.desc:0 "Trong lúc cố gắng mở một cánh cửa sập phát hiện được trên [From.From.GetName], [Root.GetName] đã vô tình tạo ra sự rung động bên trong tiểu hành tinh. Cực kỳ đen đủi, sĩ quan khoa học [Root.GetLeaderName] suy đoán rằng sự kiện này có thể đã phá hủy kết cấu bên trong của tiểu hành tinh."
 anomaly_failure.6.desc:0 "Cuộc điều tra về cái hố khổng lồ trên bề mặt tiểu hành tinh [From.From.GetName] không phát hiện ra bất kỳ thứ gì hữu dụng. Sĩ quan khoa học [Root.GetLeaderName] đã ra lệnh cho [Root.GetName] chấm dứt nhiệm vụ."
 anomaly_failure.7.desc:0 "Nỗ lực hạ cánh của [Root.GetName] trên trạm quỹ đạo phía trên [From.From.GetName] đã thất bại. Trạm quỹ đạo mỏng manh đó đã vì vậy mà sụp đổ tan tành. Sĩ quan khoa học [Root.GetLeaderName] cầu xin sự tha thứ."
 anomaly_failure.7.desc.mach:0 "[Root.GetName] đã gặp tai nạn trong lúc cập bến trạm không gian của [From.From.GetName]. Không may là, trạm không gian mỏng manh đó đã vì vậy mà tan tành. Sĩ quan khoa học [Root.GetLeaderName] báo cáo rằng phần mềm tính toán quỹ đạo bị lỗi là thủ phạm gây ra vụ việc."
 anomaly_failure.8.desc:0 "Bất kể trước đây có phát hiện ra dấu hiệu sự sống trên tiểu hành tinh [From.From.GetName] hay không, qua các lần quét liên tục của [Root.GetName], đã xác nhận rằng đây chỉ là lời đồn vô căn cứ. Sĩ quan khoa học [Root.GetLeaderName] xin chỉ thị mới."
 anomaly_failure.9.desc:0 "Ngay cả khi bên dưới bầu khí quyển của [From.From.GetName] thực sự có vật thể gì đó, thì nó cũng nằm quá sâu, không thể bị máy quét của [Root.GetName] quét ra. Sĩ quan khoa học [Root.GetLeaderName] đã từ bỏ cuộc tìm kiếm."
 anomaly_failure.10.desc:0 "Sau khi tiến hành điều tra chi tiết vệ tinh nhỏ của [From.From.GetName], các thành viên của [Root.GetName] đã không phát hiện bất kỳ thứ gì có giá trị. Sĩ quan khoa học [Root.GetLeaderName] đã chấm dứt nhiệm vụ."
 anomaly_failure.11.desc:0 "Theo lệnh của sĩ quan khoa học [Root.GetLeaderName], [Root.GetName] đã phóng một máy thăm dò vào bầu khí quyển của [From.From.GetName], điều tra dấu hiệu sự sống được báo cáo trước đó. Máy thăm dò đó đã phát hiện được một hệ sinh thái khí quyển phong phú, nhưng 3,4 giây sau, máy thăm dò đã làm ô nhiễm bầu khí quyển và gây ra một chuỗi phản ứng hóa học liên hoàn, nhanh chóng lan rộng ra toàn bộ hành tinh khí khổng lồ. Giờ đây mọi dấu hiệu của sự sống đều đã tan biến."
 anomaly_failure.12.desc:0 "Không phát hiện thứ gì thú vị trong bầu khí quyển của [From.From.GetName], mặc dù [Root.GetName] đã tiến hành điều tra chi tiết ở thượng tầng khí quyển. Sĩ quan khoa học [Root.GetLeaderName] đề nghị chấm dứt nhiệm vụ."
 anomaly_failure.13.desc:0 "Khi [Root.GetName] tiếp cận cấu trúc giống như một cỗ máy hàng không hạng nhẹ trong bầu khí quyển của [From.From.GetName], phi thuyền đã kích hoạt báo động khoảng cách. Sĩ quan khoa học [Root.GetLeaderName] báo cáo, máy bay hạng nhẹ đó đột nhiên mất sức nổi, rơi thẳng xuống hạ tầng khí quyển của hành tinh khí."
 anomaly_failure.14.desc:0 "[Root.GetName] đã vô tình đâm sầm vào [From.From.GetName] trong nỗ lực thu hồi nó. Sĩ quan khoa học [Root.GetLeaderName] báo cáo, vụ va chạm đã hất tung khoang bay vào sâu trong bầu khí quyển, không thể thu hồi được nữa."
 anomaly_failure.15.desc:0 "Bãi mảnh vỡ xung quanh [From.From.GetName] đã được [Root.GetName] quét toàn diện. Sĩ quan khoa học [Root.GetLeaderName] báo cáo không có phát hiện gì đặc biệt."
 anomaly_failure.16.desc:0 "Mặc dù đã tiến hành điều tra chi tiết, [Root.GetName] vẫn không thể suy luận được nguyên nhân hình thành của những cái hố khổng lồ trên [From.From.GetName]. Sĩ quan khoa học [Root.GetLeaderName] đã xin lỗi vì sự thất bại lần này."
 anomaly_failure.16.desc.mach:0 "Mặc dù đã tiến hành điều tra chi tiết, [Root.GetName] vẫn không thể xác định được các hố va chạm khổng lồ trên [From.From.GetName] hình thành như thế nào. Sĩ quan khoa học [Root.GetLeaderName] đổ lỗi cho sự thất bại là do không có đủ mảnh vụn sót lại trên bề mặt mặt trăng."
 anomaly_failure.17.desc:0 "Ngay cả khi các chỉ số năng lượng đo được trên [From.From.GetName] biểu hiện bất thường, thì hiện tại chúng cũng đã biến mất không tăm tích. Sĩ quan khoa học [Root.GetLeaderName] báo cáo [Root.GetName] không phát hiện ra thứ gì tương tự cả."
 anomaly_failure.18.desc:0 "Quả thật có vật thể không xác định ở xung quanh [From.From.GetName], nhưng [Root.GetName] đã vô tình đâm sầm vào nó trên đường tiếp cận. Sĩ quan khoa học [Root.GetLeaderName] vô cùng lấy làm tiếc phải báo cáo, vật thể đó đã bị phá hủy trong vụ va chạm."
 anomaly_failure.19.desc:0 "Tiểu hành tinh này dường như vô tình bị [From.From.GetName] bắt giữ, nhưng nó không có đặc điểm gì nổi bật. Sĩ quan khoa học [Root.GetLeaderName] thỉnh cầu lệnh mới cho [Root.GetName]."
 anomaly_failure.20.desc:0 "Vô cùng đáng tiếc, con tàu buồm ánh sáng phía trên [From.From.GetName] đã bị phá hủy bởi sự thiếu cẩn trọng của sĩ quan khoa học [Root.GetLeaderName]. Khi đó anh ta đang cố kéo nó vào khoang chứa hàng của [Root.GetName]."
 anomaly_failure.21.desc:0 "Bản báo cáo điều tra trước đó đề cập đến dấu hiệu của sự sống trên bề mặt [From.From.GetName] chắc chắn có sai sót, vì [Root.GetName] không hề phát hiện ra bất kỳ dấu hiệu nào thuộc loại này. Sĩ quan khoa học [Root.GetLeaderName] báo cáo, hiện tại [From.From.GetPlanetMoon] không có một chút dấu hiệu nào của sự sống."
 anomaly_failure.22.desc:0 "Thứ vốn được cho là một trạm quỹ đạo được giấu phía trên [From.From.GetName], nay đã được xác nhận chỉ là rác thải do [From.From.GetPlanetMoon] tống ra. Sĩ quan khoa học [Root.GetLeaderName] cùng [Root.GetName] và các thành viên khác đề nghị chúng ta nên quên đoạn nhạc đệm xấu hổ này đi, để tiếp tục hướng tới tương lai."
 anomaly_failure.23.desc:0 "Sau khi phân tích cẩn thận, sĩ quan khoa học [Root.GetLeaderName] xác nhận các mảnh vỡ phía trên [From.From.GetName] đến từ một chiếc sà lan chở rác. [Root.GetName] đã thu thập một vài mảnh vỡ, nhưng dường như chẳng có giá trị gì."
 anomaly_failure.24.desc:0 "Quét sâu của [Root.GetName] đối với xưởng đóng tàu cổ đại trên quỹ đạo của [From.From.GetName] không hiểu vì sao lại gây ra sự cố chập mạch bên trong xưởng đóng tàu, xưởng đóng tàu này sau đó đã tan thành tro bụi trong một vụ nổ ngoạn mục. Nhà khoa học [Root.GetLeaderName] báo cáo như vậy."
 anomaly_failure.25.desc:0 "Cái gọi là \"tàn tích thành phố\" phía trên [From.From.GetName] chẳng qua chỉ là một khối đá có hình thù kỳ dị. Sĩ quan khoa học [Root.GetLeaderName] xin lỗi vì sự lãng phí tài nguyên này, và xin nhiệm vụ mới cho [Root.GetName]."
 anomaly_failure.26.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] báo cáo, nguồn gốc các vết sẹo hằn trên [From.From.GetName] là do các hiện tượng tự nhiên tạo thành. [Root.GetName] cần nhiệm vụ mới."
 anomaly_failure.27.desc:0 "[Root.GetName] đã đánh mất tín hiệu yếu ớt đến từ [From.From.GetName], sĩ quan khoa học [Root.GetLeaderName] có nỗ lực hết sức cũng không thể bắt lại tín hiệu đó."
 anomaly_failure.28.desc:0 "Dãy núi phân bố \"phi tự nhiên\" trên [From.From.GetName] rốt cuộc lại chẳng có gì đặc biệt cả. Sĩ quan khoa học [Root.GetLeaderName] cho rằng ở đó thêm một giây cũng là đang lãng phí nguồn lực của [Root.GetName]."
 anomaly_failure.29.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] và các thành viên khác của [Root.GetName] mặc dù đã thử nhiều lần nhưng vẫn không thể tìm thấy vật thể phản chiếu ở xung quanh [From.From.GetName]. Có thể cảm biến đã hỏng rồi."
 anomaly_failure.30.desc:0 "[Root.GetName] không thể xác định vị trí phát ra tín hiệu yếu ớt bên trong [From.From.GetName]. Sĩ quan khoa học [Root.GetLeaderName] báo cáo, tín hiệu đó đã dừng hoàn toàn."
 anomaly_failure.31.desc:0 "[Root.GetName] đã quét nhiều lần nhưng vẫn không thể tìm thấy con tàu bên trong bầu khí quyển của [From.From.GetName]. Sĩ quan khoa học [Root.GetLeaderName] nghi ngờ những thứ này vốn dĩ không hề tồn tại."
 anomaly_failure.32.desc:0 "Sau khi tính toán lại quỹ đạo di chuyển của vệ tinh, sĩ quan khoa học [Root.GetLeaderName] cho rằng nó sẽ không va vào [From.From.GetName], mà sẽ sượt qua nhau. [Root.GetName] nên đi giải quyết những công việc quan trọng hơn."
 anomaly_failure.33.desc:0 "Dấu vết hoạt động của người Vultaum xung quanh [From.From.GetName] chỉ là thông tin tình báo sai lệch. Sĩ quan khoa học [Root.GetLeaderName] xin được tiếp tục nhiệm vụ tìm kiếm của [Root.GetName] ở nơi khác."
 anomaly_failure.34.desc:0 "Dấu vết hoạt động của người Yuht xung quanh [From.From.GetName] chỉ là thông tin tình báo sai lệch. Sĩ quan khoa học [Root.GetLeaderName] xin được tiếp tục nhiệm vụ tìm kiếm của [Root.GetName] ở nơi khác."
 anomaly_failure.35.desc:0 "Dấu vết hoạt động của Liên minh Đệ Nhất xung quanh [From.From.GetName] chỉ là thông tin tình báo sai lệch. Sĩ quan khoa học [Root.GetLeaderName] xin được tiếp tục nhiệm vụ tìm kiếm của [Root.GetName] ở nơi khác."
 anomaly_failure.36.desc:0 "Di tích hoạt động của người Irassian xung quanh [From.From.GetName] chỉ là thông tin tình báo sai lệch. Sĩ quan khoa học [Root.GetLeaderName] xin được tiếp tục nhiệm vụ tìm kiếm của [Root.GetName] ở nơi khác."
 anomaly_failure.37.desc:0 "Dấu vết hoạt động của người Cybrex xung quanh [From.From.GetName] chỉ là thông tin tình báo sai lệch. Sĩ quan khoa học [Root.GetLeaderName] xin được tiếp tục nhiệm vụ tìm kiếm của [Root.GetName] ở nơi khác."

 anomaly_failure.400.desc:1 "Vì lý do nào đó, sĩ quan khoa học đã quyết định rời khỏi [Root.GetName] để ngồi phi thuyền đích thân điều tra tiểu hành tinh [From.From.GetName]. Chúng tôi phát hiện ra một vụ nổ sau khi chiếc phi thuyền bất ngờ đâm xuống bề mặt tiểu hành tinh. Một nhóm điều tra sau đó đã kết luận rằng nhà khoa học quá cố này đã tự ý điều khiển máy bay hạng D khi chưa qua đào tạo."
 anomaly_failure.401.desc:0 "Trong quá trình điều tra [From.From.GetName], [Root.GetName] đã bất ngờ đâm vào một tiểu hành tinh khác. Phi thuyền mất khả năng điều khiển, sau đó đâm sầm xuống bề mặt [From.From.GetName]. Sĩ quan khoa học và các thành viên phi hành đoàn khác trên tàu hiện không rõ tung tích."
 anomaly_failure.402.desc:0 "Trong quá trình điều tra [From.From.GetName], [Root.GetName] đã bất ngờ đâm vào một tiểu hành tinh khác. Phi thuyền mất khả năng điều khiển, sau đó đâm sầm xuống bề mặt [From.From.GetName]. Sĩ quan khoa học cùng một nhóm nhỏ những người sống sót đã tiến vào khoang thoát hiểm thành công."
 anomaly_failure.403.desc:0 "Tiểu hành tinh này là trạm cư trú của một số dạng sống chân không khổng lồ! Một vài trong số chúng đã tấn công dữ dội vào [Root.GetName] để bảo vệ lãnh thổ của mình."
 creature_nest:0 "Sinh vật thù địch đang tiếp cận với tốc độ chóng mặt!"
 anomaly_failure.404.desc:0 "Ở sâu trong một chiếc hố đằng xa trên [From.From.GetName], có một số máy bay chiến đấu không người lái đang tụ tập tĩnh lặng, những người tạo ra chúng đến từ một nền văn minh đã lụi tàn từ lâu. Khi [Root.GetName] đi vào phạm vi thăm dò của chúng, những chiếc máy bay không người lái này bắt đầu thực hiện sứ mệnh cổ xưa của mình — ngăn chặn kẻ xâm nhập bằng mọi giá."
 dormant_drones:0 "Máy bay không người lái tấn công đang đến gần!"
 anomaly_failure.405.desc:0 "Quét chủ động của [Root.GetName] đã phát hiện một vài công trình trên bề mặt [From.From.GetName], nhưng sau đó tín hiệu nhận dạng đã biến mất giữa những nhiễu loạn. Một vài chiếc tàu hải tặc bay ra từ sân bay bị giấu kín trên tiểu hành tinh, đang áp sát bằng đội hình tấn công!"
 pirate_outpost:0 "Bọn hải tặc đó đến thật rồi!"
 anomaly_failure.900.desc:0 "Tin dữ từ [From.From.GetName]. Sĩ quan khoa học đã bị một luồng điện tiêu diệt khi đang ở thượng tầng khí quyển của hành tinh khí. Các thành viên của [Root.GetName] đã từ bỏ nhiệm vụ."
 anomaly_failure.901.desc:0 "Chúng tôi đang cố tìm ra nguyên nhân, nhưng không hiểu vì lý do gì, sĩ quan khoa học có vẻ như đã ra lệnh cho [Root.GetName] tiến vào thượng tầng khí quyển của [From.From.GetName] để điều tra hỏng hóc của máy thăm dò. Khi áp suất bên ngoài phi thuyền trở nên quá lớn, mọi thứ đã không thể vãn hồi được nữa."
 anomaly_failure.902.desc:0 "Trong quá trình tiến hành quét sâu [From.From.GetName], [Root.GetName] đã bị hỏng lò phản ứng và mắc kẹt trong lực hấp dẫn của hành tinh khí. Sĩ quan khoa học đã chỉ huy sơ tán toàn bộ nhân sự thành công, nhưng bản thân phi thuyền thì bị hút vào bầu khí quyển dày đặc của hành tinh, và không bao giờ có thể được tìm thấy nữa."
 anomaly_failure.903.desc:0 "Trên đường tiếp cận [From.From.GetName], [Root.GetName] đã đụng độ hai con tàu không xác định giấu mình trong vùng tối quét. Bọn chúng dường như là dân buôn lậu, đang tiến hành gặp gỡ bí mật. Sau khi phát hiện ra chúng ta, tàu buôn lậu liền ngắt kết nối và chĩa vũ khí vào. Bọn chúng có vẻ không định để lại người chứng kiến!"
 smuggler_rendezvous:0 "Bọn buôn lậu đã phát động tấn công!"
 anomaly_failure.1400.desc:0 "Trong lúc hoạt động phía trên [From.From.GetName], lõi phản ứng của [Root.GetName] đã xuất hiện các vết nứt. Toàn bộ con tàu đang trong tình thế ngàn cân treo sợi tóc, nhưng nhờ có sự hy sinh dũng cảm của một nhà khoa học, anh ta đã lao vào buồng phản ứng chứa đầy bức xạ. Không may là, nhà khoa học đó đã nhận một lượng bức xạ chí mạng và qua đời."
 anomaly_failure.1400.desc.mach:0 "Trong lúc làm việc trên [From.From.GetName], lõi lò phản ứng của [Root.GetName] đã bị rò rỉ. Vì an nguy của toàn bộ con tàu, sĩ quan khoa học của phi thuyền dựa trên tính toán đo lường thương vong của chương trình cài đặt sẵn, đã đưa ra quyết định hợp logic là hy sinh thân mình để loại bỏ bức xạ trong phòng máy. Trong quá trình này, lượng bức xạ mà [Root.GetLeaderName] phải nhận đã dẫn đến quá trình ion hóa chất bán dẫn và làm tổn thương mạng tinh thể silicon, khiến anh ta bị tê liệt vĩnh viễn. Tuy nhiên, phi thuyền cùng phi hành đoàn trên tàu đã được cứu."
 anomaly_failure.1401.desc:0 "Trong quá trình nạp lại năng lượng cho mảng quét chính, [Root.GetName] đã gặp phải tình trạng suy kiệt lò phản ứng phía trên [From.From.GetName]. Sĩ quan khoa học cùng những thành viên khác đã thiệt mạng trong vụ nổ kinh hoàng ngay sau đó."
 anomaly_failure.1402.desc:0 "Chúng tôi không rõ chính xác điều gì đã xảy ra, nhưng chẳng hiểu vì sao trong quá trình tiến hành mô phỏng về [From.From.GetName], sĩ quan khoa học lại vô tình kích hoạt chương trình tự hủy của [Root.GetName]. Mọi nỗ lực chấm dứt tự hủy đều thất bại, toàn bộ nhân viên buộc phải sơ tán trước khi phi thuyền bị hủy."
 anomaly_failure.1403.desc:0 "Một vài con tàu hải tặc giấu mình trên bề mặt [From.From.GetName] đột nhiên khởi động. [Root.GetName] dường như đã đâm phải mỏ neo của bọn hải tặc, lũ khốn này có vẻ không mấy vui vẻ với sự cố này!"
 pirate_anchorage:0 "Hạm đội rắp tâm bất lương đang đến!"
 anomaly_failure.1404.desc:0 "Không gian quỹ đạo phía trên [From.From.GetName] rõ ràng đã bị một giống loài cực kỳ hung hãn dùng làm nơi sinh sản. [Root.GetName] đã quấy rầy chúng nhân giống, khiến chúng nổi cơn thịnh nộ, hai trong số các sinh vật này bắt đầu tấn công kẻ xâm nhập không mời mà đến này."
 mating_ground:0 "Những sinh vật này trông rất khó chịu."
 anomaly_failure.1405.desc:0 "Sau một trận chiến nào đó trong quá khứ xa xôi, một vài chiếc máy bay chiến đấu dường như đã bị bỏ lại trên quỹ đạo của [From.From.GetName]. Khi các máy quét chủ động của [Root.GetName] quét qua chúng, những chiếc máy bay không người lái này liền đi vào chế độ tấn công!"
 combat_drones:0 "Bọn chúng sắp đánh tới đây rồi!"


 ####################################
 # Colony Events
 ####################################
 colony.1.name:0 "Khu rừng di cư"
 colony.1.desc:0 "Bề mặt của [Root.GetName] được bao phủ bởi thảm thực vật tươi tốt, với những loài thực vật hình cây khổng lồ phát triển cao tới hàng trăm mét. Những người định cư phát hiện ra rằng hầu như tất cả các loại thực vật này đều có khả năng di cư ở những mức độ khác nhau. Khu rừng sẽ từ từ di chuyển đến những khu vực có nhiều chất dinh dưỡng hơn, chu kỳ di cư dường như liên quan đến chu kỳ quỹ đạo của [Root.GetPlanetMoon]. Thật không may, các công trình cơ sở hạ tầng của thuộc địa sẽ bị cản trở nghiêm trọng. Những thực vật di cư này sẽ cắt đứt các đường ống cung cấp năng lượng, phá hủy các tòa nhà và đường sá."
 colony.1.a:0 "Chúng ta phải tìm ra giải pháp."
 colony.2.desc:0 "Chúng tôi phát hiện những thực vật di động trên [From.From.GetName] sẽ tránh các khu vực làm tổ của một loài giả côn trùng bản địa trong thuộc địa. Loài côn trùng này có thể tiết ra một loại pheromone đặc biệt, có thể dùng để kiểm soát đường đi của những thực vật di động này, giúp chúng tránh những khu vực đông đúc côn trùng. Hơn nữa, những nơi mà thực vật di động thường xuyên di cư nhất đã được quy hoạch thành khu bảo tồn thiên nhiên. Các nhà sinh vật học gần đó có thể thu được rất nhiều kiến thức từ khu bảo tồn này."
 colony.2.a.tooltip:0 "Thêm điểm bổ sung §YThuần hóa cây cối di cư§!, mang lại các hiệu ứng sau:\n£blocker£ Đã thêm §YKhu bảo tồn cây cối di cư§!, tăng £society£ §YĐiểm nghiên cứu§! cho các khu vực lân cận"
 colony.3.desc:0 "Bom napalm đã phá hủy một cách hiệu quả phần lớn cây cối di cư trên [From.From.GetName]. Các nhà sinh thái học đã trồng những loại thực vật ngoài hành tinh truyền thống hơn và không thể di chuyển ở những nơi ngọn lửa đi qua. Hệ động vật hoang dã của [From.From.GetPlanetMoon] chịu tổn thất nghiêm trọng, nhưng vẫn ở mức có thể chấp nhận được."
 colony.4.name:0 "Sự trỗi dậy của người cây"
 colony.4.desc:0 "Cây cối di cư trên [Root.GetName] đã quay trở lại rồi! Chúng tôi biết có vài nhóm nhỏ sống sót ở những vùng xa xôi hẻo lánh và đang trong thời kỳ ngủ đông. Chúng dường như đã lợi dụng thời gian này để phục hồi và phát triển lớn mạnh, giờ đây chúng đang tổ chức các cuộc tấn công vào các khu định cư của chúng ta. Trái ngược hoàn toàn với dự đoán của chúng ta, chúng có trí tuệ cơ bản và chúng đang đến để trả thù!"
 colony.4.a:0 "Phải ngăn chặn chúng!"
 tree_armies:0 "Đại quân thực vật đang tấn công thuộc địa [Root.GetName] của chúng ta!"
 colony.5.name:0 "Sự gục ngã của người cây"
 colony.5.desc:0 "Vì những loài thực vật hoành hành trên [From.From.GetName], chúng tôi đã tổn thất rất nhiều khu định cư và những người định cư, nhưng chúng tôi không chịu khoanh tay đứng nhìn mà đã nhổ tận gốc chúng. Các đội quân được trang bị súng phun lửa, để đảm bảo không một thân cây nào có thể sống sót."
 colony.5.a:0 "Cho chúng nếm mùi lợi hại đi."
 colony.6.name:0 "Mỏ khoáng sản"
 colony.6.desc:0 "Chúng tôi phát hiện vài mỏ khoáng sản có trữ lượng khổng lồ trên [Root.GetName], trước đây chúng bị thực vật bao phủ. Giờ đây cây cối đã biến thành tro bụi, việc khai thác sẽ không còn là vấn đề nữa."
 colony.7.name:0 "Mỏ kim loại quý hiếm"
 colony.7.desc:0 "Chúng tôi phát hiện một mỏ kim loại quý hiếm trên [Root.GetName], trước đây nó bị thực vật bao phủ. Giờ đây cây cối đã biến thành tro bụi, việc khai thác sẽ không còn là vấn đề nữa."
 colony.8.name:0 "Phá hoại hệ sinh thái"
 colony.8.desc:0 "Vai trò của những cây cối di cư đã bị tiêu diệt trên [Root.GetName] đối với hệ sinh thái của [Root.GetPlanetMoon] lại quan trọng hơn chúng ta dự tính rất nhiều. Đám cháy rừng do chúng ta châm ngòi và sự biến mất của khu rừng đã dẫn đến sự tuyệt chủng của một vài giống loài bản địa, phản ứng dây chuyền này đã khiến một vài loài thú săn mồi cũng bị diệt vong. Chúng tôi đang nỗ lực khôi phục lại hệ sinh thái mỏng manh nơi đây bằng cách du nhập các hệ thực vật và các giống loài động vật mới từ ngoài hành tinh tới, nhưng quá trình này còn một chặng đường dài phía trước."
 colony.9.name:0 "Thích nghi chung sống"
 colony.9.desc:0 "Cùng với sự giao tiếp ngày càng sâu rộng giữa những người định cư và những thực vật di động trên [Root.GetName], chúng tôi phát hiện những hệ thực vật đó có trí tuệ xã hội cơ bản. Chúng dường như nhận thức được sự tồn tại của chúng ta, ngay cả khi không sử dụng pheromone của côn trùng, chúng cũng sẽ chủ động thay đổi đường đi để tránh gây ra sự tàn phá. Những người định cư đang vô cùng mừng rỡ."
 colony.10.name:0 "Thuận theo tự nhiên"
 colony.10.desc:0 "Cùng sống cạnh những thực vật di động trên [Root.GetName], chúng tôi đã học hỏi được rất nhiều kiến thức. Vài người định cư táo bạo thậm chí còn xây nhà trên ngọn của những cái cây khổng lồ, trôi dạt khắp nơi trong phạm vi của [Root.GetPlanetMoon] cùng với chúng. Các nhà sinh vật học hàng đầu của [Root.Owner.GetName] đang tiến hành nghiên cứu những loài thực vật độc nhất vô nhị này tại đây."
 colony.11.name:0 "Cháy rừng"
 colony.11.desc:0 "Sét trên [Root.GetName] đã gây ra hỏa hoạn trong rừng, khiến những thực vật di động trên [Root.GetPlanetMoon] rơi vào tình trạng giống như giẫm đạp lên nhau. Sự đe dọa của tự nhiên khiến chúng tiến vào những khu vực mà trước đây chúng chưa từng đặt chân đến, thuộc địa phải chịu tổn thất nặng nề."
 colony.12.name:0 "Lìa xa quê hương"
 colony.12.desc:0 "Tổ chức định cư trên [Root.GetName] báo cáo rằng một khu rừng di động ở địa phương đang di cư đến các khu vực khác trên [Root.GetPlanetMoon]! Hàng ngàn vạn cái cây đã nhổ rễ đi đến đích, mọi công trình trên đường đi của nó đều sẽ bị giẫm đạp thành bình địa."
 colony.50.name:0 "Sự giận dữ của mặt đất"
 colony.50.desc:0 "Nhiều báo cáo cho biết có những hoạt động địa tầng không thể lý giải trên [Root.GetName]. Toàn bộ [Root.GetPlanetMoon] đều có thể cảm nhận được chấn động, rất nhiều khu định cư vì thế mà bị hư hại. Khi điều tra về các trận động đất, các nhà khoa học đã phát hiện một mạng lưới hang động khổng lồ dưới lòng đất.\n\nCư ngụ sâu trong hang động là một nền văn minh nguyên thủy bản địa nào đó, và chúng đang đào đường hầm dẫn lên mặt đất! Hành vi của chúng có thể là do các hoạt động của thuộc địa kích thích, nhưng chúng tôi không thể chắc chắn. Chúng tôi cũng không thể dự đoán chúng sẽ hành động như thế nào sau khi chạm mặt những người định cư!"
 colony.50.desc.subterranean:0 "Nhiều báo cáo cho biết có những hoạt động địa tầng không thể lý giải trên [Root.GetName]. Toàn bộ [Root.GetPlanetMoon] đều có thể cảm nhận được chấn động, rất nhiều khu định cư vì thế mà bị hư hại. Khi điều tra về các trận động đất, các nhà khoa học đã phát hiện một mạng lưới hang động khổng lồ dưới lớp phủ địa kö.\n\nCư ngụ sâu trong hang động là một nền văn minh nguyên thủy bản địa nào đó, và chúng đang đào đường hầm dẫn lên thuộc địa của chúng ta! Hành vi của chúng có thể là do các hoạt động thường ngày của thuộc địa kích thích, nhưng chúng tôi không thể chắc chắn. Chúng tôi cũng không thể dự đoán chúng sẽ hành động như thế nào sau khi chạm mặt những người định cư!"
 colony.50.a:0 "Phải giải quyết tình trạng này."
 colony.51.desc:0 "Đội khoan thăm dò của chúng ta đã chặn đứng những người ngoài hành tinh đang đào hầm trên [From.From.GetName]. Sau khi những công nhân ngoài hành tinh đang hoảng sợ bình tĩnh lại, đội khoan thăm dò đã thành công liên lạc với thủ lĩnh của người ngoài hành tinh."
 colony.51.a:0 "Mở kênh liên lạc."
 colony.52.desc:1 "Hành động tiêu diệt những người ngoài hành tinh [Root.Owner.GetSubMantleLower] trên [Root.GetName] của chúng ta đã thành công tốt đẹp! Chúng tôi đã thành công đánh sập vài đường hầm ngay trên đầu bọn công nhân của chúng, đồng thời bơm khí gas tác động tới hệ thần kinh vào một vài hang động chứa chấp thành phố của chúng.\n\nDự báo thương vong gần 100%, đồng thời, lực lượng an ninh của chúng ta hoàn toàn tự tin có thể dọn sạch những kẻ sống sót."
 colony.52.a:0 "Chúc mừng tất cả các bộ phận tham gia."
 colony.53.name:2 "Người ngoài hành tinh [Root.Owner.GetSubMantleUpper]"
 colony.53.desc:0 "Thứ này đã mở chưa? Có thấy không, những người trên mặt đất? Chúng tôi biết các người đến từ bên trên tầng đá, khởi nguồn từ trong hư vô. Đáng lẽ không một sinh vật sống nào có thể tồn tại ở nơi đó, nhưng thực tế lại không phải như vậy. Các người muốn làm gì?"
 colony.53.a:0 "Kể cho chúng tôi nghe về các người đi."
 colony.53.desc.subterranean:0 "Là nơi này sao? Các người có thể nhìn thấy chúng tôi không, giống loài có vỏ ở nhờ? Chúng tôi hiểu các người đến từ cõi trống rỗng khổng lồ ở tầng trên, cách xa dung nham và đất đá. Chúng tôi tưởng rằng không có sự sống nào có thể tồn tại ở đó, nhưng sự thật rõ ràng không phải vậy. Mục đích của các người là gì?"
 colony.53.a.response:0 "Đế chế của chúng tôi đã vươn tới mọi ngóc ngách của thế giới đã biết, chỉ có cõi trống rỗng khổng lồ trên đỉnh đầu chúng tôi là vẫn chưa đặt chân tới. Chúng tôi có rất nhiều thành phố phát triển, các nông trại địa y chịu trách nhiệm cung cấp lương thực, chúng tôi còn có thể bắt được cá ở những con sông lớn chảy qua các đường hầm.\n\nHàng ngàn năm qua chúng tôi vẫn luôn tìm kiếm con đường này. Những thợ đào của chúng tôi đã nghe thấy những tiếng vọng yếu ớt truyền tới từ các thành phố của các người qua những tảng đá, vì vậy chúng tôi quyết định mở cuộc điều tra."
 colony.53.b:0 "Chúng tôi muốn chung sống hòa bình."
 colony.53.b.response:0 "Vậy thì cứ như vậy đi, những người trên mặt đất! Hãy để chúng ta cùng chia sẻ thế giới này trong hòa bình. Chúng tôi rất mong đợi được tiến hành giao thương với các người. Tôi tin rằng cả hai bên đều có thể cung cấp nhiều thứ hữu dụng. Chúng tôi sẽ trở về thành phố của mình, ký kết hiệp định."
 colony.53.b.response.subterranean:0 "Vậy thì chúng ta nên \"bắt một cục đá\"! Hãy cùng chia sẻ hành tinh này với tinh thần hòa bình. Chúng tôi rất sẵn lòng tiến hành thương mại với người dân của các người. Chúng tôi tin rằng cả hai bên đều có rất nhiều thứ có thể trao đổi với nhau. Chúng ta nên trở về thành phố của mình, bắt tay vào soạn thảo hiệp định."
 colony.53.c:0 "Kẻ phục tùng sẽ sống, kẻ chống đối sẽ chết."
 colony.53.c.response:0 "Ha! Ta thấy đám các người mới là kẻ phải cút xéo! Đáng lẽ chúng ta có thể cùng hưởng hòa bình, nhưng giờ thì quân đoàn của chúng ta đã sẵn sàng đoạt lấy cõi trống rỗng bao la, sáp nhập nó vào bản đồ của đế chế. Thống trị vạn vật mới là sứ mệnh của chúng ta."
 colony.54.name:1 "[Root.Owner.GetSubMantleUpper] xâm lược!"
 colony.54.desc:0 "Những người ngoài hành tinh cư ngụ trong hang động trên [Root.GetName] đã xuất hiện trên mặt đất! Đại quân đang nườm nượp tuôn ra từ những đường hầm, chúng đều được trang bị những loại vũ khí phóng ném thô sơ nhưng có sức sát thương cực mạnh. Đội quân tiên phong của chúng đã bắt đầu đột kích thuộc địa. Lực lượng an ninh đã có hành động đáp trả, nhưng cần được tiếp viện!"
 colony.54.desc.subterranean:0 "Những người ngoài hành tinh sống trong dung nham trên [Root.GetName] đã tràn vào hang động của chúng ta! Một đội quân hùng hậu được trang bị những vũ khí thô sơ nhưng vẫn có khả năng gây sát thương đã chật cứng trong các đường hầm, đội quân tiên phong của chúng đã bắt đầu tấn công khu định cư của chúng ta.\n\nLực lượng an ninh của chúng ta đang phản kích, nhưng chúng ta có thể cần được tăng viện ngay lập tức!"
 colony.54.a:0 "Chỉnh đốn trang bị xuất phát!"
 subterranean_invasion:0 "Lực lượng địch đang tấn công thuộc địa trên [Root.GetName]!"
 colony.55.desc:0 "Thì ra nguyên nhân gây ra các trận động đất phá hoại trên [From.From.GetName] là do một nền văn minh dưới lòng đất chưa từng được biết đến đang đào đường hầm, chúng đến từ [From.From.GetPlanetMoon]! Hiện tại, những người ngoài hành tinh này đã chọc thủng mặt đất, hàng đoàn quân đội được trang bị những vũ khí mặc dù thô sơ nhưng vẫn có sức sát thương lớn đang chật cứng trong các đường hầm. Đội quân tiên phong của chúng đã bắt đầu phát động tấn công vào khu định cư của chúng ta. Lực lượng an ninh của chúng ta nhanh chóng phản kích, nhưng chúng ta có thể cần thêm chi viện!"
 colony.56.name:0 "Đại thắng trên [From.From.GetName]!"
 colony.56.desc:0 "Quân đội của chúng ta đã đuổi cổ những người ngoài hành tinh sống trong hang động trên [From.From.GetName] về lại sào huyệt của chúng, mối đe dọa tạm thời đã được gỡ bỏ. Nhưng đây không phải là kế hoạch lâu dài, không bao lâu nữa chúng sẽ quay trở lại. Chúng ta phải đánh sâu vào lòng đất mới được, các chuyên gia chiến thuật đã đề xuất phương án tấn công mới. Đã thêm vào nhật ký tình báo."
 colony.56.desc.subterranean:0 "Quân đội của chúng ta đã tìm cách đánh đuổi những cư dân bản địa trên [From.From.GetName] về lại tổ dung nham của chúng, giờ chúng đã bị khống chế. Nhưng, đây cũng chỉ là kế hoãn binh —— việc chúng lại lao vào hang động của chúng ta chỉ là vấn đề thời gian.\n\nChúng ta cần phải phát động đòn tấn công từ dưới lòng đất giáng vào chúng, các tham mưu chiến lược đã thiết kế xong một kế hoạch tấn công mới. Kế hoạch này đã được thêm vào nhật ký tình báo."
 colony.56.a:0 "Chúng ta phải giải quyết vấn đề này, một lần và mãi mãi."
 colony.57.name:0 "Thảm bại trên [From.From.GetName]!"
 colony.57.desc:1 "Quân đội của chúng ta đóng trên [From.From.GetName] đã bị tàn sát, những người ngoài hành tinh [Root.Owner.GetSubMantleLower] giờ đã hoàn toàn kiểm soát khu định cư của chúng ta!! Chúng đã dùng một vệ tinh của chính chúng ta để gửi cho chúng ta một thông điệp."
 colony.58.desc:0 "Những người trên mặt đất! Đại quân vĩ đại của chúng ta đã đánh bại các người, mọi thứ trong thành phố của các người đều thuộc về chúng ta. Chúng ta đã học được rất nhiều thứ từ những thiết bị của các người, vũ khí của chúng ta đã trở nên mạnh mẽ hơn. Cấm không được bước chân lên thế giới này nữa!"
 colony.58.desc.subterranean:0 "Giống loài có vỏ ở nhờ! Quân đội quang vinh của chúng ta đã đánh bại các người trong trận chiến, những chiến lợi phẩm trong thành phố của các người giờ đây tùy ý chúng ta xử trí. Chúng ta đã học được rất nhiều kiến thức từ những cỗ máy của các người, hiện tại vũ khí của chúng ta đã mạnh mẽ hơn trước kia rất nhiều.\n\nĐừng đến gần hành tinh này nữa!"
 colony.58.a:0 "Láo toét."
 colony.59.name:0 "Người ngoài hành tinh trên mặt đất"
 colony.59.desc:0 "Những người ngoài hành tinh sống trong hang động trên [From.From.GetName] đã chọc thủng mặt đất! Chúng dường như chỉ muốn tiến hành các hoạt động thám hiểm và giao dịch với quy mô nhỏ. Chúng có lẽ sẵn lòng chung sống hòa bình với những người định cư, và việc tiến hành các giao dịch mua bán lớn cũng không phải là không thể. Đại diện của chúng đã thiết lập liên lạc với chúng ta."
 colony.59.desc.subterranean:0 "Những người ngoài hành tinh sống trong dung nham trên [From.From.GetName] đã tràn vào hang động của chúng ta! Những kẻ đột nhập này đều đi thành những nhóm nhỏ, nhìn qua có vẻ đều là những nhà thám hiểm và thương nhân. Có lẽ chúng sẽ sẵn lòng chung sống hòa bình với những người định cư của chúng ta, thậm chí là tiến hành các hoạt động thương mại. Một trong những người đại diện của chúng đã liên lạc với chúng ta."
 colony.59.a:0 "Nghe xem chúng muốn nói gì."
 colony.60.desc:0 "Những người ngoài hành tinh sống trong hang động trên [Root.GetName] đã tập hợp một đội quân lớn, chuẩn bị xâm lược mặt đất thêm một lần nữa! Đội quân điên cuồng của chúng lại đang đào đường hầm."
 colony.60.desc.subterranean:0 "Những người ngoài hành tinh sống trong dung nham trên [Root.GetName] đã tập kết đủ quân đội trong đế chế của chúng, để phát động một cuộc xâm lược nữa vào hang động của chúng ta! Một lần nữa, đại quân cuồng bạo của chúng tuôn ra từ những đường hầm mới đào, thách thức chúng ta."
 colony.60.a:0 "Phải đuổi chúng về!"
 subterranean_invasion_2:0 "Lực lượng địch đang tấn công thuộc địa trên [Root.GetName]!"
 colony.61.name:0 "Sụp đổ"
 colony.61.desc:1 "Từ [Root.GetName] truyền đến tin dữ! Những người ngoài hành tinh [Root.Owner.GetSubMantleLower] vẫn luôn giao chiến với chúng ta không biết làm cách nào mà đã làm sập thành công một bãi đất phẳng gần cửa đường hầm, bên trên đó có đóng quân toàn bộ một đội quân của chúng ta.\n\nNhững người lính thưa thớt còn sống sót nhanh chóng bị lũ người ngoài hành tinh tàn sát, họ thậm chí còn không kịp hội quân với các lực lượng khác của quân đội chúng ta."
 colony.61.a:0 "Chúng sẽ phải trả giá!"
 colony.62.name:0 "Lực lượng đột kích"
 colony.62.desc:0 "Những người ngoài hành tinh sống dưới lòng đất của thuộc địa [Root.GetName] đã cử vài nhóm lực lượng đột kích trong đêm. Chúng đã phá hủy một cơ sở hạ tầng quan trọng của thuộc địa, và trốn về lòng đất trước khi lực lượng an ninh kịp phản ứng."
 colony.62.a:0 "Ngăn chặn lực lượng đột kích!"
 colony.63.name:0 "Tấn công mặt đất"
 colony.63.desc:1 "Trên [Root.GetName] lại hứng chịu một cuộc tấn công nữa! Những người ngoài hành tinh [Root.Owner.GetSubMantleLower] đã đào một đường hầm mới ngay chính giữa một khu định cư lớn của chúng ta, và lao ra từ bên trong. Chúng chiếm ưu thế áp đảo so với lực lượng phòng thủ địa phương, và tàn sát vô cớ những người định cư của chúng ta. Một vài người sống sót la hét không ngừng bị những người ngoài hành tinh kéo xuống lòng đất, và bị đưa đi cùng khi chúng rút lui."
 colony.63.a:0 "Nhất định phải trừng trị đích đáng những kẻ sát nhân."
 colony.64.name:0 "Người sống sót"
 colony.64.desc:1 "Quân đội của chúng ta đóng trên [Root.GetName] vẫn đang lập bản đồ hệ thống đường hầm bên dưới thuộc địa. Họ đã tìm thấy một thành phố lớn thuộc về người ngoài hành tinh [Root.Owner.GetSubMantleLower], trước khi chúng ta định bơm khí gas tác động tới hệ thần kinh vào bên trong, chúng ta phát hiện thành phố này đang cố gắng tự cô lập khỏi các bộ phận khác của đế chế dưới lòng đất. Trong thành phố này có hàng triệu người ngoài hành tinh đang run rẩy vì sợ hãi. Các kỹ sư của chúng ta có nên hoàn thành công việc và làm cho cái hang động này sập xuống không?"
 colony.64.a:0 "Được, cho chúng một cái chết nhanh gọn."
 colony.64.b:0 "Không được! Đưa chúng lên mặt đất, bắt chúng phục vụ chúng ta."
 colony.64.b.subterranean:0 "Không được! Đưa chúng tới thuộc địa, chúng có thể phục vụ cho chúng ta."
 colony.65.name:1 "[Root.Owner.GetSubMantleUpper] bành trướng"
 colony.65.desc:0 "Chúng ta đã dọn sạch khí gas gây mê và xác chết của bọn người ngoài hành tinh trong các đường hầm của [Root.GetName]. Người định cư có thể vào ở an toàn. Các tòa nhà mà bọn ngoài hành tinh bỏ lại sẽ bị tháo dỡ, và được thay thế bằng những tòa nhà hiện đại của chúng ta."
 colony.66.name:0 "Vàng!"
 colony.66.desc:0 "Những người thợ thăm dò đang đánh liều tiến sâu hơn vào những đường hầm, những nơi này đã từng thuộc về đế chế người ngoài hành tinh dưới lòng đất đã bị diệt vong của [Root.GetName]. Cuối cùng họ đã tìm được mỏ vàng được đồn đại từ lâu, được cho là nguồn cung cấp trữ lượng kim loại quý khổng lồ cho đế chế người ngoài hành tinh dưới lòng đất."
 colony.66.desc.subterranean:0 "Những người thợ thăm dò đang đánh liều tiến sâu hơn vào những đường hầm, những nơi này đã từng thuộc về đế chế người ngoài hành tinh sống trong dung nham đã bị diệt vong của [Root.GetName]. Cuối cùng họ đã tìm được mỏ vàng được đồn đại từ lâu, được cho là nguồn cung cấp trữ lượng kim loại quý khổng lồ cho đế chế người ngoài hành tinh dưới lòng đất."
 colony.67.name:0 "Kho báu"
 colony.67.desc:0 "Đội do thám trong lúc khám phá những hang động dưới lòng đất của [Root.GetName] đã phát hiện ra một cung điện hoàng gia, nơi này từng là thủ đô của đế chế ngoài hành tinh. Xác chết của thủ lĩnh vẫn còn ngồi ngay ngắn trên ngai vàng trong cung điện.\n\nSau khi đội do thám dùng thuốc nổ phá tung cửa kho báu, họ phát hiện bên trong chứa đầy vàng và các tác phẩm nghệ thuật của người ngoài hành tinh. Những tác phẩm nghệ thuật này sẽ được vận chuyển về bảo tàng ở [From.Owner.Capital.GetName], còn số vàng này có thể giúp cải thiện tình hình tài chính của chúng ta."
 colony.68.name:0 "[Root.GetName] xảy ra động đất"
 colony.68.desc:1 "[Root.GetName] gần đây lại phải hứng chịu một đợt động đất nữa. Có vẻ như, do người ngoài hành tinh [Root.Owner.GetSubMantleLower] không tiến hành bảo trì, một số khu vực sâu trong mạng lưới đường hầm dưới lòng đất đã xảy ra sụp lún. Rất nhiều cư dân của chúng ta đã phải chịu tổn thất."
 colony.69.name:0 "Nạn đói"
 colony.69.desc:1 "Chúng ta đã tiếp kiến một đại diện của người ngoài hành tinh [Root.Owner.GetSubMantleLower] trên [Root.GetName]. Có vẻ như đế chế của họ gần đây đang gặp phải khó khăn, và họ đang bị nạn đói đe dọa. Họ khẩn cầu chúng ta cung cấp mọi viện trợ có thể."
 colony.69.a:0 "Được, cố gắng hết sức để giúp họ."
 colony.69.b:0 "Mặc kệ họ tự sinh tự diệt."
 subterraneans_pleased:1 "Mối quan hệ với nền văn minh [Root.Owner.GetSubMantleLower] có thể được cải thiện."
 subterraneans_displeased:1 "Mối quan hệ với nền văn minh [Root.Owner.GetSubMantleLower] sẽ trở nên tồi tệ."
 colony.70.name:0 "Món quà"
 colony.70.desc:0 "Để kỷ niệm tình hữu nghị giữa hai nền văn minh, những người ngoài hành tinh dưới lòng đất trên [Root.GetName] đã phái một đoàn thương nhân mang theo một lượng lớn đá quý đến mặt đất. Những viên đá như vậy rõ ràng là đế chế của họ phải đi sâu tới những nơi gần lõi của [Root.GetPlanetMoon] nhất có thể mới khai thác được."
 colony.70.desc.subterranean:0 "Để kỷ niệm tình hữu nghị giữa hai nền văn minh, những cư dân sống trong dung nham trên [Root.GetName] đã phái một đoàn thương nhân mang theo một lượng lớn đá quý đến mặt đất. Những viên đá như vậy rõ ràng là nền văn minh của họ phải đi sâu tới những nơi gần lõi của [Root.GetPlanetMoon] nhất có thể mới khai thác được."
 colony.70.a:0 "Thật hào phóng."
 colony.71.name:1 "Người tị nạn [root.Owner.GetSubMantleUpper]"
 colony.71.desc:0 "Trên [Root.GetName] xuất hiện một nhóm lớn những người tị nạn đến từ đế chế người ngoài hành tinh dưới lòng đất, họ ùa ra khỏi đường hầm và lên mặt đất, theo sát phía sau là một đội quân quy mô nhỏ đang truy kích. Rõ ràng họ là một phần của một thiểu số tôn giáo nào đó; họ tuyên bố rằng mình đang chạy trốn khỏi sự bức hại.\n\nNếu chúng ta để họ gia nhập nhóm những người định cư trên mặt đất, chắc chắn điều này sẽ chọc giận những kẻ thống trị đế chế dưới lòng đất đang truy đuổi họ. Tuy nhiên, nếu chúng ta mặc kệ quân đội truy kích đưa họ trở lại lòng đất, những người này chắc chắn sẽ phải đối mặt với án tử hình."
 colony.71.desc.subterranean:0 "Trên [Root.GetName] xuất hiện một nhóm lớn những người tị nạn đến từ đế chế cư dân sống trong dung nham, họ ùa ra khỏi đường hầm và lên mặt đất, theo sát phía sau là một đội quân quy mô nhỏ đang truy kích. Rõ ràng họ là một phần của một thiểu số tôn giáo nào đó; họ tuyên bố rằng mình đang chạy trốn khỏi sự bức hại.\n\nNếu chúng ta để họ gia nhập nhóm những người định cư ở các hang động tầng trên, chắc chắn điều này sẽ chọc giận những kẻ thống trị đế chế đang truy đuổi họ. Tuy nhiên, nếu chúng ta mặc kệ quân đội truy kích đưa họ trở lại lòng đất, những người này chắc chắn sẽ phải đối mặt với án tử hình."
 colony.71.a:0 "Nếu họ muốn, thì cứ ở lại đi."
 colony.71.b:0 "Chuyện này chúng ta không gánh vác nổi, đưa họ quay trở lại."
 colony.72.name:0 "Nhà sinh học ngoài hành tinh"
 colony.72.desc:1 "Vài nhà sinh học ngoài hành tinh đến từ [Root.Owner.Capital.GetName], sau khi dành một khoảng thời gian dài cùng ăn cùng ở với những cư dân ngoài hành tinh bản địa [Root.Owner.GetSubMantleLower] của hành tinh này, đã trở về bề mặt của [Root.GetName]. Họ đã học được rất nhiều kiến thức về các phong tục tập quán và lề lối cổ xưa của giống loài này, những điều này chắc chắn sẽ mang lại lợi ích cho nghiên cứu xã hội học của chúng ta."
 colony.73.desc:1 "[Root.GetName] gần đây lại phải hứng chịu một đợt động đất nữa, một vài khu định cư của chúng ta đã xảy ra sập nhà, và xuất hiện thương vong nghiêm trọng. Đế chế người ngoài hành tinh [Root.Owner.GetSubMantleLower] đang khai quật một hang động mới sâu dưới lòng đất, và dự định xây dựng một thành phố mới ở đây, rõ ràng động thái này chính là nguồn gốc của các trận động đất."
 colony.73.a:0 "Nhẫn nhục chịu đựng."
 colony.73.b:0 "Bên kia phải xin lỗi!"
 colony.74.name:0 "Yêu cầu công nghệ"
 colony.74.desc:1 "Sau khi chứng kiến những vũ khí tiên tiến mà lực lượng an ninh của chúng ta được trang bị, vài vị tướng quân của đế chế người ngoài hành tinh [Root.Owner.GetSubMantleLower] trên [Root.GetName] đã xin gặp chúng ta, hy vọng chúng ta có thể chia sẻ một số công nghệ quân sự.\n\nCác sĩ quan của chúng ta đang do dự không biết có nên đồng ý hay không, vì so với trước đây, việc làm như vậy sẽ khiến chúng ta khó có thể đánh bại những người ngoài hành tinh này trên chiến trường hơn. Tuy nhiên, nếu chúng ta từ chối, những người ngoài hành tinh này sẽ coi đó là một sự sỉ nhục."
 colony.74.a:0 "Cung cấp vũ khí hiện đại cho những kẻ man rợ là quá nguy hiểm."
 colony.74.b:0 "Họ là đồng minh, nên có phúc cùng hưởng."
 colony.75.name:0 "Nhận được thông điệp"
 colony.75.desc:1 "Việc giao thương với [Root.Owner.GetSubMantleLower] trên [Root.GetName] có vẻ như dạo này đang đi đến hồi kết, vì đoàn thương nhân của họ ngày càng ít xuất hiện. Hôm nay, chúng ta đã nhận được một thông điệp từ một đại diện quân sự của họ. Họ có vẻ không được hài lòng cho lắm."
 colony.75.a:0 "Vậy thì xem thử đi."
 colony.76.name:0 "Thông điệp"
 colony.76.desc:0 "Những kẻ trên mặt đất. Chúng ta không định đối đãi bằng lễ nghĩa nữa, vì các người không biết thể hiện sự tôn trọng đáng có đối với một nền văn minh cổ xưa và vinh quang. Do đó, chúng ta tuyên bố sẽ chiếm lấy thế giới này, nó vốn dĩ thuộc về chúng ta. Chúng ta sẽ đuổi các người về lại bầu trời!"
 colony.76.desc.subterranean:0 "Giống loài có vỏ ở nhờ. Chúng ta đã cố gắng làm một người hàng xóm tốt, nhưng rõ ràng, các người hoàn toàn không có ý định đối xử với chúng ta bằng sự tôn trọng mà nền văn minh vinh quang của chúng ta đáng được nhận.\n\nHoàng đế của chúng ta vì thế đã ban chiếu chỉ, chúng ta phải chiếm lấy toàn bộ hành tinh này làm của riêng, đây là quyền lợi chính đáng của chúng ta. Chúng ta sẽ đuổi các người về với những vì sao, các người đến từ đâu thì hãy cút về đó!"
 colony.76.a:0 "Chết dở rồi."
 colony.100.name:0 "Thiết bị cải tạo bị bỏ hoang"
 colony.100.desc:0 "Kể từ khi định cư trên [Root.GetName], sinh quyển của [Root.GetPlanetMoon] liên tục xảy ra các hiện tượng dị thường. Hệ sinh thái vô cùng bất ổn, và mức độ tiến hóa của các sinh vật cũng không theo các mô hình chuẩn mực. Các nhà khoa học suy đoán có sự can thiệp từ bên ngoài, và suy đoán này đã được xác nhận! Một vài người định cư đã phát hiện ra một thiết bị cải tạo khổng lồ dưới lòng đất, nó có lẽ đã được hàng ngàn năm tuổi. Thiết bị đã mất năng lượng trong quá trình cải tạo, khiến sinh quyển của [Root.GetPlanetMoon] ở trong tình trạng dở dang. Chỉ cần cung cấp đủ năng lượng, có lẽ sẽ có thể khởi động lại thiết bị. Nhưng không ai biết điều gì sẽ xảy ra..."
 colony.100.a:1 "Ai đã chế tạo ra nó vậy?"
 colony.101.name:0 "Thiết bị cải tạo đã bị tháo dỡ"
 colony.101.desc:0 "Các nhà khoa học của chúng ta đã tháo dỡ an toàn thiết bị cải tạo trên [Root.GetName]. Chúng ta không biết ai đã chế tạo ra nó, nhưng công nghệ chế tạo thiết bị vô cùng tiên tiến. Điều này sẽ nâng cao đáng kể trình độ công nghệ cải tạo địa hình của chúng ta."
 colony.102.name:0 "Khí hậu bất ổn"
 colony.102.desc:0 "Vì quá trình chuyển hóa của [Root.GetName] bị gián đoạn, nên khí hậu của [Root.GetPlanetMoon] vô cùng bất ổn. Những cơn bão dữ dội thường xuất hiện mà không có bất kỳ dấu hiệu báo trước nào. Gần đây bão đã tấn công một khu định cư lớn, làm chết vài người và gây thiệt hại lớn về tài sản."
 colony.103.name:0 "Hạn hán"
 colony.103.desc:0 "Khí hậu bất ổn của [Root.GetName] đã gây ra hạn hán trên [Root.GetPlanetMoon], dẫn đến mất mùa. Những người định cư sống ở đây đã yêu cầu viện trợ kinh tế từ [Root.Owner.Capital.GetName] để cải thiện điều kiện sống."
 colony.103.a:0 "Bảo họ tự đi mà tìm thức ăn."
 colony.103.b:0 "Đáp ứng yêu cầu của họ."
 colony.104.desc:0 "Quá trình cải tạo môi trường từng bị tạm dừng trên [Root.GetName] cuối cùng cũng đã hoàn thành. Sau khi giải phóng hàng tỷ nanobot vào bầu khí quyển, máy móc kỹ thuật sinh học ngoài hành tinh đã thay đổi đáng kể các điều kiện sống trên bề mặt [Root.GetPlanetMoon]. Cả hệ sinh thái và khí hậu đều ổn định, một hệ sinh vật ngoài hành tinh mới thích nghi với khí hậu này đã được du nhập vào."
 colony.104.a:0 "Hãy chờ xem kết quả..."
 abandoned_terraforming_completed:0 "Môi trường hành tinh đã được cải tạo xong."
 colony.105.desc:0 "Quá trình cải tạo môi trường từng bị tạm dừng trên [Root.GetName] cuối cùng cũng đã hoàn thành. Sau khi giải phóng hàng tỷ nanobot vào bầu khí quyển, máy móc kỹ thuật sinh học ngoài hành tinh đã thay đổi đáng kể các điều kiện sống trên bề mặt hành tinh.\n\nTuy nhiên, khi các nanobot thiết kế hệ sinh quyển mới cho [Root.GetPlanetMoon], có vẻ như đã có trục trặc xảy ra. Chúng đã tạo ra hàng triệu sinh vật bị dị dạng nghiêm trọng. Phần lớn trong số chúng chết do tứ chi bị biến dạng, những con sống sót thì tụ tập lại với nhau vừa nhảy nhót vừa kêu la. Tồi tệ hơn nữa, chúng dường như đang định tràn vào các khu định cư của chúng ta thành từng đàn!"
 colony.105.a:0 "Đúng là ác mộng trở thành hiện thực!"
 terraforming_mutants_attack:0 "Sinh vật đột biến đã tấn công thuộc địa!"
 colony.106.desc:0 "Quá trình cải tạo môi trường từng bị tạm dừng trên [Root.GetName] cuối cùng cũng đã hoàn thành. Sau khi giải phóng hàng tỷ nanobot vào bầu khí quyển, máy móc kỹ thuật sinh học ngoài hành tinh đã cải thiện đáng kể các điều kiện sống trên bề mặt [Root.GetPlanetMoon]. Cả hệ sinh thái và khí hậu đều ổn định, một hệ sinh vật ngoài hành tinh mới thích nghi với khí hậu này đã được du nhập vào.\n\nThật may mắn, [Root.GetPlanetMoon] giờ đây đã trở thành một thiên đường thực sự đối với [Root.Owner.GetSpeciesNamePlural]! So với khí hậu nguyên bản của [Root.Owner.Capital.GetName], khí hậu mới này rõ ràng là thích hợp hơn nhiều cho sự sinh tồn của giống loài chúng ta."
 colony.107.desc:1 "Cơ sở cải tạo môi trường từng bị bỏ hoang đã gây ra những hậu quả khủng khiếp đối với quá trình cải tạo môi trường trên [Root.GetName]! Dù cho sinh vật ngoài hành tinh nào đã thiết kế ra thiết bị cải tạo môi trường này, cấu tạo sinh lý của chúng cũng hoàn toàn khác biệt so với chúng ta. Lượng ozone trong tầng bình lưu của [Root.GetPlanetMoon] đã bị cạn kiệt, tạo điều kiện cho các sinh vật cần bức xạ tia cực tím cường độ cao sinh tồn.\n\nHàng triệu cư dân thuộc địa đã phải chết trong đau đớn vì điều này."
 colony.107.desc.nuked_pref:0 "Quá trình cải tạo môi trường từng bị tạm dừng trên [Root.GetName] hiện đã hoàn thành. Dù cho sinh vật ngoài hành tinh nào đã thiết kế ra thiết bị cải tạo môi trường này, cấu tạo sinh lý của chúng chắc chắn phải rất giống chúng ta. Bầu khí quyển hiện tại của hành tinh chứa đầy các oxit nitơ, và cường độ bức xạ trên bề mặt cũng đã tăng lên đáng kể —— nó đã biến thành một §Y$pc_nuked$§!.\n\nThật may mắn là, [Root.Owner.GetSpeciesName] đã thích nghi thành công với môi trường khắc nghiệt này từ lâu, và đang phát triển mạnh mẽ trên hành tinh này."
 colony.107.a:0 "Thảm họa thiên nhiên a!"
 colony.107.a.tooltip:0 "§HMỗi Dân cư không phải-§!§Y$trait_mechanical$§! §Hkhông có§! §Y$trait_pc_nuked_preference$§! §Htrên [Root.GetName]:§! Thiệt mạng"
 colony.108.name:0 "Đánh bại quái vật"
 colony.108.desc:0 "Chúng ta đã đánh bại đội quân quái vật tấn công thuộc địa [From.From.GetName]. Những cái xác thối rữa của chúng chất đống trước các công trình phòng thủ, lực lượng an ninh đang nỗ lực đào hố chôn lấp chúng càng sớm càng tốt. Một vài vật liệu di truyền đã thu hút sự chú ý của các nhà khoa học, những mẫu vật này có lẽ sẽ giúp đẩy nhanh tiến độ nghiên cứu về mặt sinh học."
 colony.109.name:0 "Săn lùng quái vật"
 colony.109.desc:0 "Những người định cư trên [Root.GetName] thỉnh thoảng vẫn chạm mặt với các sinh vật đột biến tàn dư rải rác khắp nơi, chúng đã xuất hiện trở lại sau khi quá trình cải tạo bị gián đoạn từ lâu trên [Root.GetPlanetMoon] hoàn tất. Mặc dù đa số chúng đều vô hại với con người và gia súc, lực lượng quân đội địa phương có thể dễ dàng giải quyết, nhưng một con trong số đó lại đang hoành hành ở một trạm cư trú xa xôi. Người ta đồn rằng nó thường hay rình rập những người định cư của chúng ta, và gần đây đã xảy ra nhiều vụ mất tích không rõ nguyên nhân. Thi thể không nguyên vẹn của đội an ninh được cử đi điều tra cũng vừa mới được tìm thấy, lãnh đạo thuộc địa đang khẩn thiết yêu cầu quân đoàn chi viện."
 colony.109.a:0 "Phải tìm ra con quái vật này, và tiêu diệt nó!"
 colony.110.desc:0 "Sau một cuộc truy lùng quy mô lớn, quân đoàn trên [From.From.GetName] đã tìm thấy con quái vật đã tàn sát những người định cư. Một tiểu đội đặc nhiệm đã liều mình xông vào hang ổ của nó, sau một hồi chiến đấu cam go đã kết liễu được nó. Trong hang ổ phát hiện hàng trăm chi thể của những người định cư bị sát hại, cùng với hàng chục người sống sót đang trong tình trạng điên loạn, có vẻ như con quái vật định giữ họ lại để ăn dần sau này. Cái đầu khổng lồ của con quái vật đã được bảo quản lại, như một biểu tượng cho đội quân đã tiêu diệt nó."
 colony.111.name:0 "Ngừng phát hiện quái vật"
 colony.111.desc:0 "Những vụ việc nhìn thấy quái vật từng ám ảnh thuộc địa [Root.GetName] đã dừng lại, cũng không còn thêm vụ mất tích nào nữa. Con quái vật dường như đã tự tiêu vong —— có thể là do già chết, cũng có thể là bị nghẹn khi đang ăn thịt người định cư. Mặc dù người dân trên [Root.GetName] cảm thấy an tâm hơn, nhưng họ vẫn oán thán vì chúng ta đã không có các biện pháp bảo vệ kịp thời."
 colony.111.a:0 "Có lẽ chúng ta đã có thể làm được nhiều hơn..."
 colony.112.name:0 "Số vụ phát hiện quái vật gia tăng"
 colony.112.desc:0 "Gần đây, số người nhìn thấy con quái vật khát máu trên [Root.GetName] đã tăng vọt, và số người mất tích cũng ngày càng nhiều. Hơn nữa, có người còn nhìn thấy vài con quái vật đi cùng nhau, điều này chứng tỏ con quái vật đầu tiên đã bắt đầu sinh sản. Bọn quái vật đó bắt đầu công khai, tàn sát không phân biệt những người định cư ở các vùng xa xôi hẻo lánh của [Root.GetPlanetMoon]. Nếu không hành động nhanh chóng, toàn bộ thuộc địa sẽ bị nhấn chìm bởi quái vật!"
 colony.112.a:0 "Chuyện này đúng là không có hồi kết!"
 colony.113.name:0 "Quái vật hoành hành trên [From.From.GetName]"
 colony.113.desc:0 "Lực lượng chủ lực đóng trên [From.From.GetName] đã bị tiêu diệt gần hết bởi các cuộc tấn công dữ dội của bọn quái vật đột biến! Lũ quái vật tàn ác đang ngang tàng hoành hành trong thuộc địa, mặc sức sát hại những người định cư. Có báo cáo chỉ ra rằng một bộ phận người sống sót đã phải bỏ chạy vào nơi hoang dã để tìm đường sống, nhưng ngay cả như vậy thì sớm muộn gì họ cũng sẽ bị tìm thấy."
 colony.113.a:0 "Phải cử quân cứu viện tới!"
 colony.114.name:0 "Giải phóng [From.From.GetName]"
 colony.114.desc:0 "Đội viễn chinh đã giải phóng [From.From.GetName], tiêu diệt đám quái vật đột biến chiếm giữ khu định cư chính. Xác chết thối rữa của chúng nằm vung vãi khắp nơi, quân đoàn đang nhanh chóng đào hố chôn lấp. Khắp nơi trên [From.From.GetPlanetMoon] đều có từng nhóm nhỏ những người sống sót lộ diện, nhưng nhìn chung số người định cư thương vong là vô số kể."
 colony.114.a:0 "Hãy tái thiết thôi."
 colony.150.name:0 "Khu trú ẩn dưới lòng đất"
 colony.150.desc:0 "Cuộc thám hiểm địa chất do những người định cư trên [Root.GetName] khởi xướng đã phát hiện ra một khu trú ẩn khổng lồ nằm sâu trong một dãy núi. Mọi bằng chứng đều chỉ ra rằng những người xây dựng hầm trú ẩn phóng xạ này chính là giống loài đã phát động cuộc chiến tranh hạt nhân cổ đại trên [Root.GetPlanetMoon]. Khu trú ẩn đã bị phong tỏa suốt nhiều thế kỷ, nhưng các thiết bị thăm dò cho thấy bên trong đang phát ra một tín hiệu yếu ớt. Các nhà khoa học đang nóng lòng muốn mở cánh cửa của khu trú ẩn, để xem đằng sau đó đang cất giấu thứ gì."
 colony.150.a:0 "Mở ra xem thử đi!"
 colony.150.b:0 "Hay là thôi đi."
 colony.151.desc:0 "Đoàn khảo sát khoa học của chúng ta rốt cuộc đã mở thành công khu trú ẩn trên [Root.GetName], nhưng bên trong chỉ phát hiện ra những bộ xương của loài động vật có vú cổ đại. Có vẻ như khoảng 200 năm trước, những cư dân bản địa trong khu trú ẩn đã cạn kiệt thức ăn, sau đó liền rơi vào một loại điên loạn ăn thịt đồng loại nào đó. Những mảnh xương nằm rải rác chằng chịt vết cắn, phản ánh một cách sống động kết cục bi thảm của những người sống sót cuối cùng của một nền văn minh từng vô cùng kiêu hãnh.\n\nCũng may là những ghi chép và cơ sở dữ liệu bên trong khu trú ẩn cũng đủ để cho các nhà khoa học hành vi và các nhà tâm lý học ngoại lai của chúng ta bận rộn trong vài năm tới."
 colony.151.b.evopred: "Những bộ hài cốt này sẽ hoàn thành cống hiến cuối cùng của chúng."

 colony.152.desc:0 "Cánh cửa của khu trú ẩn lớn trên [Root.GetName] cuối cùng cũng đã được mở. Các nhà khoa học của chúng ta vô cùng ngạc nhiên khi phát hiện sau cánh cửa khu trú ẩn khổng lồ này, có tới hàng triệu người sống sót từ cuộc chiến tranh sử dụng vũ khí hạt nhân thời viễn cổ. Bất chấp sự thiếu hụt tài nguyên, họ đã xây dựng được một cộng đồng có khả năng tự cung tự cấp và duy trì nó trong nhiều thế kỷ. Ban đầu họ tỏ ra rất cảnh giác với các nhà khoa học của chúng ta, dù sao chúng ta cũng là những người ngoài hành tinh đầu tiên mà họ gặp mặt, nhưng họ cũng rất biết ơn chúng ta vì đã giúp họ mở cửa.\n\nTrong khu trú ẩn lưu trữ một lượng lớn trang thiết bị và máy móc dùng để xây dựng lại nền văn minh sau thảm họa hạt nhân, những thứ này chỉ có họ mới biết cách vận hành, nhưng họ dường như hy vọng hơn vào việc gia nhập thuộc địa của bạn sau khi đã làm quen với ánh sáng mặt trời."
 colony.152.a:0 "Chúng ta hãy cùng nhau tái thiết thế giới này nào!"
 colony.152.b:0 "Tuyệt lắm, mau chuẩn bị vòng cổ nô lệ đi!"
 colony.152.b.tooltip:0 "Những cư dân này sẽ bị biến thành nô lệ."
 colony.152.c:0 "Nhốt lũ cặn bã ngoài hành tinh này trở lại khu trú ẩn, sau đó vĩnh viễn phong tỏa lối vào."
 colony.153.desc:0 "Các nhà khoa học của chúng ta cuối cùng cũng mở thành công cánh cửa của khu trú ẩn cổ đại trên [Root.GetName], nhưng kết quả của việc làm này lại là giải phóng một đám quái vật đột biến đáng sợ —— chúng chính là những người sống sót ban đầu. Đám sinh vật này đã tiêu diệt toàn bộ nhóm các nhà khoa học chỉ trong vài giây, rồi bắt đầu điên cuồng tàn phá khắp nơi, đến nay đã sát hại hàng ngàn thường dân, nhiều vùng lãnh thổ rộng lớn của thuộc địa đã rơi vào tay bầy sinh vật đột biến tham lam này. Giờ đây chúng ta phải bảo vệ những vùng đất còn lại, xây dựng các công trình phòng thủ kiên cố, mặc dù ngay cả như vậy thì cũng chưa chắc đã đủ!"
 colony.153.a:0 "Xây dựng hệ thống phòng thủ!"
 colony.155.name:0 "Bom lõi"
 colony.155.desc:0 "Trong lúc khám phá các khu di tích nằm gần trạm cư trú trên [Root.GetName] của chúng ta. Một vài người định cư đã vô tình kích hoạt bộ hẹn giờ trên một loại vũ khí nhiệt hạch chưa phát nổ còn sót lại từ cuộc chiến tranh sử dụng vũ khí hạt nhân trước đây trên [Root.GetPlanetMoon].\n\nQuả bom lõi với đương lượng nổ khoảng 35 megaton này một khi được kích nổ, vài trạm cư trú lân cận sẽ bị xóa sổ khỏi bản đồ. Loại vũ khí nhiệt hạch này cực kỳ không ổn định nên không thể di dời, chúng ta cũng không có đủ thời gian để sơ tán khu vực này."
 colony.155.a:0 "Chúng ta phải tháo gỡ vũ khí nhiệt hạch này!"
 colony.156.desc:0 "Chúng ta đã tháo gỡ thành công vũ khí nhiệt hạch trên [From.From.GetName]! Hiện tại đội chuyên gia của chúng ta đang tiến hành rà soát kỹ lưỡng toàn bộ khu vực [From.From.GetPlanetMoon], để đảm bảo không còn vũ khí chưa phát nổ nào khác, hy vọng có thể giảm thiểu nguy cơ xảy ra những sự kiện tương tự."
 colony.156.a:0 "Chúng ta đúng là vừa đi dạo một vòng ở Quỷ Môn Quan mà."
 colony.157.desc:0 "Đội gỡ bom của chúng ta đã không kịp tháo gỡ vũ khí nhiệt hạch trên [From.From.GetName], toàn bộ những người ở trong phạm vi bán kính 100km quanh tâm vụ nổ đều đã tử nạn, cuộc chiến tranh sử dụng vũ khí hạt nhân bi thảm và vô nghĩa từ một ngàn năm trước lại biến người của chúng ta thành những nạn nhân cuối cùng."
 colony.157.a:0 "Thảm họa thiên nhiên a!"
 colony.160.name:0 "Máy gia tốc hạt bị hỏng"
 colony.160.desc:1 "Chúng tôi phát hiện một mảnh vỡ khổng lồ trên [Root.GetName], nhìn qua có vẻ là một cỗ máy gia tốc hạt. Nó nằm trong một miệng hố va chạm khổng lồ ngập tràn bức xạ, điều này có nghĩa là cỗ máy gia tốc này từng là một trong những mục tiêu chiến lược rất quan trọng trong cuộc chiến tranh hạt nhân trên [Root.GetPlanetMoon].\n\nChúng tôi đã tìm thấy một số nhật ký do các nhà khoa học phụ trách cỗ máy gia tốc này ghi lại, mặc dù quá trình phát triển công nghệ này chưa hoàn thiện, nhưng nhiều nghiên cứu và công thức trong đó lại là những kiến thức tiên tiến chưa từng được biết đến ngay cả với tiêu chuẩn công nghệ của chúng ta, các nhà vật lý của chúng ta hiện đang tiến hành nghiên cứu những dữ liệu này."
 colony.161.name:0 "Cơ sở hạ tầng còn sót lại"
 colony.161.desc:0 "Những cơ sở hạ tầng sống sót qua một trận chiến tranh sử dụng vũ khí hạt nhân quy mô lớn trên [Root.GetName] này đã được chứng minh là mang lại lợi ích to lớn cho những người định cư của chúng ta. Những con đường do nền văn minh ngoài hành tinh từng sinh sống ở đây xây dựng để kết nối các trạm cư trú chính của họ, một số trong đó ngày nay vẫn ở trong tình trạng tốt và có thể để chúng ta sử dụng.\n\nChúng ta còn có thể thu hồi được một lượng lớn vật liệu xây dựng từ những đống đổ nát nằm rải rác trên bề mặt, từ đó hoàn thiện hơn nữa cơ sở hạ tầng cho khu định cư của chúng ta."
 colony.162.name:0 "Trạm không gian bị bỏ hoang"
 colony.162.desc:0 "Gần đây, một nhóm người định cư khởi hành từ [Root.GetName] đã bước lên một trạm không gian thô sơ do cư dân bản địa để lại trên quỹ đạo của [Root.GetPlanetMoon]. Xung quanh cửa sổ hướng về phía [Root.GetPlanetMoon], chúng tôi phát hiện rất nhiều xác ướp của các nhân viên làm việc trên trạm không gian này. Bọn họ đã ý thức được rằng số phận của mình đã được định đoạt sau khi nhìn thấy những đám mây hình nấm cuồn cuộn nổi lên trên hành tinh bên dưới. Các đoạn ghi âm liên lạc cho thấy, những phi hành gia này đã hết lần này đến lần khác cố gắng liên lạc với mặt đất một cách tuyệt vọng, nhưng đáng tiếc là họ đã cạn kiệt lương thực trong những nỗ lực ngày càng điên loạn của mình.\n\nTrạm không gian này hiện vẫn đang trong tình trạng tốt, nó đã cho các kỹ sư của chúng ta thấy một dự án thiết kế trạm không gian hiếm gặp ở các nền văn minh sơ khai trên các hành tinh. Các kỹ sư đã học hỏi được một vài ý tưởng từ bản thiết kế thô sơ nhưng cũng vô cùng tinh xảo của trạm không gian này."
 colony.162.b.evopred: "May mà những hài cốt này không bị ô nhiễm phóng xạ."
 colony.163.name:0 "Bức xạ ở vùng đất hoang"
 colony.163.desc:0 "Lượng bức xạ phát ra từ một số vùng đất hoang trên [Root.GetName] cao hơn nhiều so với giá trị dò tìm trước đó của chúng tôi, một số người định cư địa phương đều xuất hiện các tình trạng như sức khỏe kém, tỷ lệ sinh thấp v.v. ở những mức độ khác nhau. Hiện tại chúng tôi đang dần tiến hành sơ tán người dân khỏi các khu vực bị ảnh hưởng, nhưng việc làm này sẽ cần một khoảng thời gian."
 colony.164.name:0 "Hoạt động hòa bình"
 colony.164.desc:0 "Những di tích tàn phá được tìm thấy trong vùng đất hoang của [Root.GetName] dường như đã tác động ở một mức độ nào đó tới những người định cư trên [Root.GetPlanetMoon], khiến họ dần ngả theo chủ nghĩa hòa bình. Những người tham gia vào phong trào mới này tuyên bố rằng ý nghĩa tồn tại của họ là để gióng lên hồi chuông cảnh tỉnh cho các thế hệ tương lai, để họ luôn ghi nhớ sự khủng khiếp của chiến tranh, họ cho rằng phải ngăn chặn những điều từng xảy ra trên [Root.GetName] tái diễn ở những thế giới khác."
 colony.164.a:0 "Thế sao?"
 colony.164.b:0 "Lũ hèn nhát này đúng là nỗi nhục của chúng ta!"
 colony.164.c:0 "Tốt lắm, mọi người nên đề cao hòa bình."
 colony.164.a.tooltip:1 "Tối đa §Y400§! £pop£ §Hdân số§! trên §H[Root.GetName]§! sẽ đánh mất §Ytư tưởng Chủ nghĩa Quân phiệt§! và chuyển sang tư tưởng §YChủ nghĩa Hòa bình§!"
 colony.170.name:0 "Rác vũ trụ"
 colony.170.desc:0 "Không gian quỹ đạo bao quanh [Root.GetName] tràn ngập rác thải do những cư dân từng sống trên [Root.GetPlanetMoon] để lại, trước khi nền văn minh của mình bị hủy diệt, họ đã bắn hàng ngàn vệ tinh và bệ phóng tên lửa thô sơ vào không gian. Rất nhiều trong số chúng đã bị phá hủy bởi vũ khí chống vệ tinh trong cuộc chiến tranh hạt nhân khủng khiếp trên [Root.GetPlanetMoon], làm lượng rác thải không gian ngày càng nhiều thêm. Những người định cư của chúng ta trên mặt đất cho rằng những mảnh vỡ này đã gây ảnh hưởng đến sự vận hành của cơ sở hạ tầng, vì những mảnh vỡ này mà chúng ta chỉ có thể sử dụng công nghệ vệ tinh và bay trên quỹ đạo trong những điều kiện hạn chế."
 colony.170.a:0 "Có lẽ phải làm gì đó thôi."
 colony.171.name:0 "Sự cố tàu chở hàng"
 colony.171.desc:0 "Một chiếc tàu chở hàng dân sự đã bị trúng một đám rác vũ trụ di chuyển với tốc độ cao trong quỹ đạo khi đang trên đường hạ cánh xuống [Root.GetName], không một phi hành đoàn nào sống sót, mảnh vỡ của con tàu đã rơi trúng một rơ le năng lượng chính của khu định cư, vụ nổ đã làm rất nhiều thường dân thương vong, và một vài cơ sở hạ tầng bị hư hỏng nặng."
 colony.171.desc.mach:0 "Một chiếc tàu chở hàng chở đơn vị công nhân đang chuẩn bị hạ cánh xuống [Root.GetName] đã bị một đám rác vũ trụ di chuyển với tốc độ cao đâm xuyên qua! Đơn vị phi công đã bị phá hủy ngay lập tức, và con tàu bị bắn trúng đã nhào lộn xuyên qua bầu khí quyển, rơi xuống gần một trạm rơ le chính của khu định cư. Vụ nổ sau đó đã khiến vài đơn vị trên mặt đất ngừng hoạt động, đồng thời các cơ sở hạ tầng địa phương cũng bị hư hại nặng nề."
 colony.171.a:0 "Sao lại thành ra thế này...!"
 colony.172.name:0 "Hệ lụy của mảnh vỡ"
 colony.172.desc:0 "Một đám rác vũ trụ dày đặc trên quỹ đạo của [Root.GetName] đã biến không gian quỹ đạo thành một bãi rác. Đám rác này —— chúng tôi tin rằng đó là bệ phóng tên lửa từng được sử dụng trong cuộc chiến tranh sử dụng vũ khí hạt nhân trước đây trên [Root.GetPlanetMoon] —— đã bị lực hấp dẫn kéo vào bầu khí quyển, gây ra ảnh hưởng to lớn cho một trạm cư trú chính của chúng ta, các báo cáo sơ bộ hiện tại cho thấy sự việc này có thể sẽ gây ra thương vong lớn."
 colony.172.a:0 "Chúng ta cần xử lý đám rác này"
 colony.173.desc:0 "Với sự trợ giúp từ Tàu Khoa Học của chúng ta, chính quyền thuộc địa trên [From.From.GetName] đã hoàn tất việc dọn dẹp không gian quỹ đạo của [From.From.GetPlanetMoon]. Nơi đây hiện đã được bảo đảm an toàn cho các vệ tinh và việc đi lại của dân sự."
 colony.174.desc:0 "Với sự trợ giúp từ Tàu Khoa Học của chúng ta, chính quyền thuộc địa trên [From.From.GetName] đã hoàn tất việc dọn dẹp không gian quỹ đạo của [From.From.GetPlanetMoon]. Nơi đây hiện đã được bảo đảm an toàn cho các vệ tinh và việc đi lại của dân sự.\n\nHóa ra, phần lớn các mảnh vỡ bao gồm lượng Khoáng Sản giá trị từ bề mặt của [From.From.GetPlanetMoon] vốn từng được dùng để chế tạo vệ tinh. Chúng ta đã thu hồi được một số lượng đáng kể, mang lại một khoản lợi nhuận kha khá trong quá trình này."
 colony.180.name:0 "Phát hiện tiểu hành tinh"
 colony.180.desc:0 "Chúng tôi đã có một phát hiện quan trọng khi theo dõi không gian sâu thẳm tại [Root.GetName] —— hiện đang có một tiểu hành tinh khổng lồ đang bay về phía [Root.GetPlanetMoon]! Nếu mặc kệ để nó đâm vào bề mặt hành tinh, nó sẽ gây ra một hậu quả thảm khốc. Chúng ta phải tiêu diệt tiểu hành tinh này càng sớm càng tốt!"
 colony.180.a:0 "Đây đúng là một điềm xấu..."
 colony.180.b:0 "Rõ rồi."
 colony.182.name:0 "Tiểu hành tinh đã bị phá hủy"
 colony.182.desc:0 "Tiểu hành tinh đang bay về phía [Root.GetName] đã bị tiêu diệt! Những thường dân vừa thoát chết trong gang tấc trên [Root.GetPlanetMoon] đều đang đổ ra đường ăn mừng. Kết quả quét cho thấy trong mảnh vỡ của tiểu hành tinh có chứa rất nhiều khoáng sản giá trị, chúng tôi đã cố gắng hết sức để thu hồi thật nhiều khoáng sản."
 colony.182.desc.mach:0 "Tiểu hành tinh bay về phía [Root.GetName] đã bị tiêu diệt! Không có đơn vị hay công trình nào trên hành tinh bị hư hại, vì bất kỳ mảnh vỡ nhỏ nhoi nào còn sót lại cũng đã đủ nhỏ để bị thiêu rụi khi tiến vào bầu khí quyển.\n\nKết quả quét các mảnh vỡ còn sót lại cho thấy tiểu hành tinh được cấu tạo chủ yếu từ các khoáng sản giá trị. Chúng tôi đã cố gắng thu hồi chúng nhiều nhất có thể."
 colony.183.name:0 "Tiểu hành tinh va chạm với [Root.GetName]"
 colony.183.desc:0 "Chúng ta đã không thể ngăn chặn kịp thời vụ va chạm của tiểu hành tinh đang bay về phía [Root.GetName], nó đã đâm thẳng vào bề mặt của [Root.GetPlanetMoon], gây ra sự tàn phá trên diện rộng, khiến hàng triệu người thiệt mạng."
 colony.183.desc.mach:0 "Chúng ta đã không thể ngăn chặn kịp thời vụ va chạm của tiểu hành tinh đang bay về phía [Root.GetName]. Nó đã đâm thẳng vào bề mặt của [Root.GetPlanetMoon], gây ra sự tàn phá trên diện rộng. Hàng ngàn cỗ máy sẽ vĩnh viễn không thể hoạt động được nữa."
 colony.183.a:0 "Hôm nay là một ngày u ám."
 colony.185.name:0 "Hành tinh đã bị nuốt chửng"
 colony.185.desc:0 "Cuộc cắn nuốt của chúng ta đối với §Y[Target.GetName]§! đã đi vào rất sâu, phản ứng dây chuyền kéo theo đã phá hủy lõi của nó.\n\nTất cả các cá thể con đều đã sơ tán về §Y[Owner.Capital.GetName]§!."
 colony.185.a:0 "Chúng ta vẫn còn rất đói."
 colony.185.a.tooltip:0 "§Y[From.GetName]§! đã bị phá hủy."


 ####################################
 # Precursor Events
 ####################################
 vultaum_artifact:0 "Chúng ta vừa thu thập được một món đồ tạo tác của người Vultaum."
 precursor.completed.name:0 "Nhiệm vụ khảo cổ học đã hoàn thành"
 precursor.completed.a:0 "Một phát hiện thú vị."
 precursor.1.name:0 "Hội đồng Ngôi sao Vultaum"
 precursor.1.desc:1 "Chúng tôi đã tìm thấy một số cổ vật thuộc về một nền văn minh ngoài hành tinh cổ đại trên §Y[From.GetName]§!! Từ niên đại của những di vật này, họ có lẽ là một nền văn minh hoạt động trong khu vực này vào khoảng 12 triệu năm trước.\n \nTừ những thông tin tình báo mà chúng tôi có thể chắp vá lại, các nhà khoa học kết luận rằng đây là một loài ngoại lai tự xưng là \"Hội đồng Ngôi sao Vultaum\", một loài động vật thân đốt giống giun dài khoảng 3-4 mét, chúng giao tiếp với nhau chủ yếu bằng các sóng rung được truyền qua các đốt cơ thể."
 precursor.5.name:0 "Căn cứ khai thác khoáng sản của người Vultaum"
 precursor.5.desc:0 "Phát hiện một căn cứ khai thác Heli-3 quy mô nhỏ của người Vultaum dưới đáy của một miệng hố va chạm khổng lồ trên [From.GetName], miệng hố này dường như được tạo ra bởi một vụ nổ từ bên trong căn cứ này, có vẻ như công nghệ khai thác của họ hoàn toàn khác biệt so với chúng ta, nếu không thì chỉ một sự cố thao tác máy móc hay tai nạn thông thường là không thể nào gây ra vụ nổ khủng khiếp đến vậy."
 precursor.6.desc:1 "Thật kỳ diệu, chúng tôi đã khôi phục được một phần dữ liệu từ lõi dữ liệu Vultaum bị thổi bay khỏi hố [From.From.GetName]. Hầu hết dữ liệu đã bị hỏng, nhưng các nhà khoa học của chúng tôi đã dịch thành công từ \"Kolgar\", một từ tượng trưng cho đơn vị thời gian cơ bản của người Vultaum."
 precursor.10.name:0 "Trạm quan trắc của người Vultaum"
 precursor.10.desc:0 "Chúng tôi phát hiện một trạm quan trắc Vultaum cổ đại trên bề mặt §Y[From.GetName]§!, hệ sao [From.GetStarName] nằm cách khá xa quê hương của người Vultaum, công trình này dường như cũng chủ yếu được dùng để quan sát ngôi sao của chính họ. Chúng tôi đã duyệt qua dữ liệu còn sót lại của trạm quan trắc, nhưng hoàn toàn không biết người Vultaum đang tìm kiếm thứ gì trong trạm quan trắc của họ."
 precursor.11.desc:1 "Cuộc khai quật khảo cổ học tại §Y[From.From.GetName]§! đã tìm thấy một bức bích họa nhỏ trong một căn phòng đầy bụi của một đài thiên văn. Bên trên dường như vẽ một vài chòm sao, có lẽ là những chòm sao có thể nhìn thấy được từ sao mẹ Vultaum. Các nhà thiên văn học của chúng tôi hiện vẫn chưa thể xác định được bất kỳ ngôi sao nào trong số đó."
 precursor.15.name:0 "Thuộc địa của người Vultaum"
 precursor.15.desc:0 "Chúng tôi phát hiện tàn tích của một thang máy không gian Vultaum đã sụp đổ trên [Root.GetName] gần xích đạo của [From.GetName]. Phần đối trọng của thang máy nằm bên ngoài quỹ đạo đồng bộ Vultaum, dường như có ai đó đã cố tình cắt đứt toàn bộ thang máy ở vị trí đó. Đánh giá từ di tích, những sợi cáp khổng lồ đã rơi xuống khu trung tâm của một vài thành phố lớn nằm gần xích đạo. Ước tính vụ tai nạn này đã khiến ít nhất hàng triệu người thương vong."
 precursor.16.desc:1 "Các nhà khảo cổ học của chúng tôi trên §Y[From.From.GetName]§! đã tìm thấy những mảnh vỡ của một bản đồ sao bên cạnh sợi cáp thang máy bị đứt. Rõ ràng, thuyền trưởng của một hạm đội thương mại Vultaum đã từng sử dụng bản đồ sao này, trên bản đồ có đánh dấu một số tuyến đường thương mại giữa các vì sao thường được sử dụng và sinh lợi nhất của họ."
 precursor.20.desc:0 "Trên bề mặt của [From.GetName] có một vài hồ nước tròn khổng lồ được hình thành bởi một loạt các vụ nổ phản vật chất từ hàng triệu năm trước, khi đó, [From.GetPlanetMoon] vẫn còn người Vultaum sinh sống, và những nơi có các miệng hố va chạm lúc bấy giờ đều là những trạm cư trú lớn nhất của họ. Các nhà khoa học của [Root.GetName] đã loại trừ khả năng bị bắn phá từ quỹ đạo, do đó chúng tôi tin rằng những vụ nổ này có thể do những người trên mặt đất lúc đó gây ra."
 precursor.21.desc:1 "Các nhà khảo cổ học trên §Y[From.From.GetName]§! đã khôi phục được một lõi lưu trữ hoàn chỉnh từ một thiết bị đầu cuối trong một trung tâm y tế đã sụp đổ, trong đó có lưu giữ một số ghi chép thú vị, chẳng hạn như tuổi thọ trung bình tự nhiên của người Vultaum (khoảng 270 năm) và một số bệnh tật thường gặp của họ."
 precursor.25.desc:0 "Sau khi tiến hành quét toàn diện §Y[From.GetName]§!, chúng tôi phát hiện bên dưới bề mặt của [From.GetPlanetMoon] có một hệ thống mạng lưới ngầm nhân tạo quy mô lớn, rất nhiều đường hầm đã sụp đổ, một tiểu đội của [Root.GetName] cho rằng đây chỉ là một phần rất nhỏ của thuộc địa ngầm Vultaum. Lối vào chính dẫn xuống hang động dưới lòng đất đã cố tình bị phá hủy, các thành phố và người dân Vultaum đều bị vùi lấp dưới hàng triệu tấn đất đá."
 precursor.26.desc:1 "Trong cuộc khai quật khảo cổ học trên §Y[From.From.GetName]§!, đã phát hiện một số hóa thạch di hài đáng ngạc nhiên của loài Vultaum trong một mật thất bị sụp đổ nằm rất gần mặt đất. Điều này giúp các nhà khoa học hiểu rõ hơn về diện mạo thực sự của loài Vultaum."
 precursor.30.name:0 "Công trình hành tinh khí khổng lồ của người Vultaum"
 precursor.30.desc:0 "Chúng tôi đã tìm thấy một phần tàn tích của trạm khai thác khí Vultaum trên quỹ đạo gần [From.GetName], hàng triệu năm trước, người Vultaum vốn định đưa trực tiếp trạm khai thác khí này vào bên trong hành tinh khí khổng lồ, nhưng vụ va chạm với một vật thể không xác định đã làm thất bại kế hoạch này."
 precursor.31.desc:0 "Các nhà khảo cổ học của chúng tôi đã phát hiện một bộ đồ không gian Vultaum gần như hoàn chỉnh mà những kẻ cướp bóc trước đó đã bỏ sót, bộ quần áo dài bốn mét trông giống như một cái ống này đã mang đến cho các nhà khoa học của chúng tôi một sự hiểu biết mới về môi trường thích hợp cho sự sinh tồn của người Vultaum."
 precursor.35.name:0 "Trạm giao dịch của người Vultaum"
 precursor.35.desc:0 "§Y[From.GetName]§! là một tiền đồn nhỏ, những người trong tiền đồn sẽ tiến hành các hoạt động giao thương qua lại với những người của các nền văn minh lân cận khác, ở một góc độ nào đó, nhiệm vụ của điểm giao dịch này về sau đã phát triển thành việc phát triển tín ngưỡng. Người Vultaum đã cố gắng thu phục những thương nhân ngoại lai để họ tin theo tín ngưỡng của mình. Hoạt động giao thương sau đó nhanh chóng chấm dứt, và cuối cùng [From.GetPlanetMoon] cũng bị bỏ hoang."
 precursor.36.desc:1 "Các nhà khảo cổ học trên §Y[From.From.GetName]§! đã phát hiện một cuốn sách điện tử nhỏ của Vultaum trong quá trình khai quật. Có lẽ các nhà truyền giáo của căn cứ này đã từng phát những cuốn sách nhỏ này cho các đội thương nhân qua lại. Phần lớn dữ liệu trên cuốn sách đã bị mất, trong đó chỉ còn lại một vài mục nói về \"Lời nói dối vĩ đại\" và \"Gông cùm của thực tế ảo\"."
 precursor.40.name:0 "Vệ tinh của người Vultaum"
 precursor.40.desc:0 "Chúng tôi phát hiện một vệ tinh Vultaum nhỏ trên §Y[From.GetName]§!, chức năng của nó là liên tục lặp lại một thông điệp cho đến khi cạn kiệt năng lượng, chúng tôi đã lấy máy phát tín hiệu của nó ra, nhưng chỉ có thể trích xuất được một phần nhỏ thông tin từ đó. Mục đích chính của vệ tinh này là để loan báo các quan điểm triết học của người Vultaum cho các nền văn minh lân cận, nội dung chủ yếu bao gồm \"Ngắt kết nối\" và \"Đón nhận sự tồn tại chân thực\", có trời mới biết điều này có nghĩa là gì."
 precursor.41.desc:0 "Các nhà khảo cổ học và kỹ sư dữ liệu của chúng tôi sau khi phân tích kỹ lưỡng máy phát tín hiệu Vultaum, cho rằng trong đó không có bất kỳ công nghệ nào hữu ích cho chúng ta. Dự án này đã giúp chúng tôi nâng cao sự hiểu biết về ngôn ngữ lập trình Vultaum, do đó nếu sau này có nhu cầu giải mã, sẽ không còn quá khó khăn nữa."
 precursor.45.name:0 "Thuộc địa mảnh vỡ Vultaum"
 precursor.45.desc:0 "§Y[From.GetName]§! là một địa điểm khá đặc biệt trong số các thuộc địa của người Vultaum, vì hai lý do: 1. [From.GetStarName] trước đây không thuộc về Vultaum, 2. Tuổi đời của các di tích ở đây muộn hơn rất nhiều so với những nơi khác. Nơi đây dường như là nơi sinh sống của một số cư dân bị chính quyền Vultaum bài xích."
 precursor.46.desc:1 "Một số cổ vật được khai quật tại khu khảo cổ trên §Y[From.From.GetName]§! có khắc những dòng chữ phản đối quan điểm triết học \"Bản thân sự sống chính là một lời nói dối\" của người Vultaum. Một trong số các cổ vật dường như là để tưởng niệm toàn thể loài Vultaum. Điều này càng xác nhận giả thuyết của chúng tôi: thuộc địa ly khai này vẫn tiếp tục tồn tại thêm một thời gian sau khi những thuộc địa khác của Vultaum sụp đổ."
 precursor.50.name:0 "Trung tâm thực tế ảo Vultaum"
 precursor.50.desc:0 "Các kỹ sư Vultaum đã xây dựng một quỹ đạo khổng lồ gần §Y[From.GetName]§! dùng để phục vụ cho các nghiên cứu máy tính. Nhưng kỳ lạ thay, họ dường như không quan tâm đến lĩnh vực trí tuệ nhân tạo, mà lại dốc toàn lực cho hệ thống thực tế ảo và công nghệ mô phỏng bằng siêu máy tính, phần lớn các tòa nhà đều đã bị đại bác và thiên thạch nhỏ phá hủy, nhưng vẫn còn một số tòa nhà tương đối nguyên vẹn còn sót lại."
 precursor.51.desc:1 "Các nhà khảo cổ học đã phát hiện một thứ thú vị trong lúc điều tra mạng lưới quỹ đạo hành tinh Vultaum nằm phía trên §Y[From.From.GetName]§!. Họ đã tìm thấy một trò chơi thực tế ảo nhiều người chơi từng được hàng tỷ cư dân của Đế chế Vultaum yêu thích. Mặc dù trò chơi này chỉ tạo ra một thế giới ảo châm biếm sâu sắc về thực trạng của người Vultaum, nhưng trò chơi này vẫn là một báu vật vô giá cho việc nghiên cứu ngôn ngữ và phong tục tập quán của loài Vultaum."
 precursor.55.name:0 "Căn cứ khai thác tiểu hành tinh Vultaum"
 precursor.55.desc:0 "§Y[From.GetName]§! được phát hiện trong một miệng núi lửa hình thành từ vụ va chạm của một tiểu hành tinh, nhưng có một cái hố rất đặc biệt —— dường như nó được gây ra bởi vụ nổ của một thiết bị phản vật chất. Một bằng chứng khác trên bề mặt tiểu hành tinh này cho thấy 12 triệu năm trước, có rất nhiều người Vultaum đã làm nghề khai thác khoáng sản ở đây. Một trong những cái hố lớn hơn mà chúng tôi tìm thấy có lẽ là trạm không gian khai thác khoáng sản."
 precursor.56.desc:1 "Sau một cuộc khảo sát căn cứ khai thác bị phá hủy của Vultaum trên §Y[From.From.GetName]§!, người ta đã tìm thấy một số thiết bị khai thác bị bỏ hoang trong một đường hầm ngầm được bảo tồn tốt. Những thiết bị khai thác này được thiết kế đặc biệt cho cấu trúc cơ thể hình giun của người dân Vultaum, và được điều khiển bằng những sóng rung chuyển đặc biệt của cơ thể mà họ tạo ra khi giao tiếp."
 precursor.100.name:0 "Phát hiện hệ sao mẹ của người Vultaum"
 precursor.100.desc:0 "Sau đó, các nhà khoa học của chúng tôi đã làm thêm giờ để sửa chữa các cổ vật mà người Vultaum để lại trên §Y[Root.Capital.GetName]§!, và suy luận thành công tọa độ chính xác của Vultaumar trong hệ sao —— hệ sao mẹ của nền văn minh Vultaum cổ đại! Chúng ta nên tiến hành khảo sát hệ sao này trước khi các nền văn minh khác kịp đặt chân đến."
 precursor.100.a:0 "Liên lạc với con tàu khoa học gần nhất!"
 precursor.101.name:0 "Sao mẹ Vultaum"
 precursor.101.desc:1 "Tàn tích vỡ nát của sao mẹ Vultaum cho thấy nó đã phải chịu một đòn hủy diệt hàng loạt vào 12 triệu năm trước, nguyên nhân là do sự phát nổ của một thiết bị phản vật chất nào đó. Từ những đống đổ nát còn sót lại trên bề mặt [FromFrom.GetPlanetMoon], chúng tôi biết được rằng Đế chế Vultaum đã trải qua một sự chuyển biến tư tưởng vô cùng lớn trước khi bị tiêu diệt.\n\nTriết lý mới của họ cho rằng toàn bộ vũ trụ không gì khác ngoài một hệ thống thực tế ảo được sử dụng bởi một sự tồn tại cấp cao hơn để giải trí, tất cả các sinh vật thông minh đều được kết nối vào hệ thống này mà không hề hay biết. Nhiều người Vultaum đã ngày càng cực đoan hơn trong nỗ lực \"ngắt kết nối\" của mình, và rất nhiều người trong số họ đã chọn cách tự sát.\n\nCuối cùng họ kết luận rằng, chỉ có sự ngắt kết nối đồng loạt của hàng tỷ cá thể mới có thể phá vỡ sự ổn định của toàn bộ hệ thống, giúp họ lấy lại được tự do. Thế là vào một thời điểm đã hẹn, tất cả người Vultaum khắp vũ trụ bắt đầu tự sát bằng mọi cách có thể. Và những người từ chối tham gia vào cuộc tự sát tập thể này quá ít, không thể tiếp tục duy trì sự sinh sản bình thường, nền văn minh Vultaum vì vậy mà dần lụi tàn, và cuối cùng hóa thành tro bụi."
 precursor.102.name:0 "Phát hiện sao mẹ Vultaum"
 precursor.102.desc.a:1 "Ngôi sao mẹ vỡ nát và cổ kính của người Vultaum đã được tìm thấy, nhưng rõ ràng đã có người đặt chân đến đây trước rồi. Những thứ còn có giá trị trên [FromFrom.GetPlanetMoon] hầu như đã chẳng còn lại bao nhiêu."
 precursor.102.desc.b:1 "Theo dữ liệu điều tra của chúng tôi, hành tinh vỡ nát này là sao mẹ của một nền văn minh cổ đại mang tên \"Vultaum\", nơi này đã bị những nền văn minh vũ trụ tới thăm dạo gần đây càn quét sạch sẽ, hiện tại trên [FromFrom.GetPlanetMoon] đã không còn bất kỳ xác tàu nào có giá trị nữa."
 precursor.500.name:0 "Đế chế Yuht"
 precursor.500.desc:1 "Chúng tôi đã tìm thấy một số cổ vật liên quan đến nền văn minh ngoài hành tinh trên §Y[From.GetName]§!! Các nhà khoa học của chúng tôi tin rằng họ đã cư trú trong hệ sao này sáu triệu năm trước, những người ngoài hành tinh này tự xưng là người \"Yuht\". Họ có thân hình to lớn và trông giống như loài động vật chân đốt dẹt.\n\nGiống loài này khi trưởng thành có chiều dài cơ thể gần một trăm mét, rõ ràng rất hiếm có con tàu vũ trụ nào có thể chở được hai hay thậm chí ba hành khách Yuht."
 precursor.505.name:0 "Trạm cư trú của người Yuht"
 precursor.505.desc:0 "[From.GetName] đã bị bắn phá từ quỹ đạo vào một thời gian dài trước đây, gây ra sự tàn phá khủng khiếp đối với môi trường sinh thái. [From.GetPlanetMoon] là một tiền đồn nhỏ do người Yuht cổ đại xây dựng, nhưng tại sao hành động này lại rước lấy một thảm họa hủy diệt cho toàn bộ thế giới vẫn còn là một bí ẩn."
 precursor.506.desc:1 "Sau khi nghiên cứu sâu §Y[From.From.GetName]§!, chúng tôi biết được rằng [From.From.GetPlanetMoon] là một trong vài \"trạm cư trú\" của Đế chế Yuht. Bộ phận chịu trách nhiệm nhân giống trước tiên sẽ sử dụng các phương pháp triệt sản để loại bỏ toàn bộ thú ăn thịt và các sinh vật có khả năng gây nguy hiểm khác trên hành tinh, sau đó mới tiến hành đẻ trứng trên mặt đất. Những người Yuht sau khi nở sẽ tự mình sinh tồn trong môi trường hành tinh tương đối an toàn này hàng trăm năm cho đến khi chúng tiến hóa được một mức độ trí tuệ nhất định. Đến lúc này chúng mới được thu nhận vào Đế chế Yuht."
 precursor.510.name:0 "Tiền đồn theo dõi của người Yuht"
 precursor.510.desc:0 "Chúng tôi phát hiện một số hệ thống theo dõi khổng lồ trên [From.GetName], những công trình này đã có tuổi đời hàng triệu năm, chúng tôi tin rằng đây là do nền văn minh Yuht xây dựng. Có vẻ như trong 500 ngàn năm qua, ít nhất đã có một nền văn minh ngoài hành tinh từng thay đổi công năng của những hệ thống này, để dùng cho mục đích của riêng mình. Những ăng-ten thu nhận khổng lồ này đã bị phá hủy hoàn toàn, không thể sửa chữa, nhưng một số thiết bị đầu cuối vẫn còn nguyên vẹn."
 precursor.511.desc:1 "Các nhà khảo cổ học của chúng tôi trên §Y[From.From.GetName]§! đã phát hiện hệ thống theo dõi được xây dựng ở đó là để tìm kiếm sự sống thông minh ngoài hành tinh —— người Yuht chưa bao giờ phát hiện ra sự sống thông minh ngoài hành tinh. Sau khi khôi phục một phần điện năng cho thiết bị đầu cuối máy tính, các nhà khảo cổ học đã thu được các đĩa dữ liệu chứa nhật ký ghi chép của hệ thống theo dõi trong hàng trăm năm. Những nhật ký này cho thấy trong thời đại Đế chế Yuht, thực sự không có sự sống thông minh nào khác trong vùng không gian này."
 precursor.515.name:0 "Thuộc địa của người Yuht"
 precursor.515.desc:0 "Phát hiện tàn tích của nhiều công trình sinh thái Yuht ở bán cầu nam của §Y[From.GetName]§!, điều này cho thấy [From.GetPlanetMoon] từng là một trong những thuộc địa chính của họ.\n\nTại một trong những tòa nhà đã sụp đổ, đội mặt đất của chúng tôi phát hiện tàn tích của một viện bảo tàng từng trưng bày \"những đồ vật giả của người ngoài hành tinh nổi tiếng\". Những thứ này đều là đồ nhân tạo được người Yuht thu thập từ khắp nơi trong đế chế, được cho là có thể chứng minh cho sự tồn tại của sinh vật ngoài hành tinh. Viện bảo tàng đã vạch trần từng món đồ giả mạo này."
 precursor.516.desc:1 "Phần lớn các cổ vật được trưng bày tại Viện bảo tàng Yuht trên §Y[From.From.GetName]§! đều đã bị mất, nhưng các nhà khảo cổ học của chúng tôi vẫn thu hồi thành công một cổ vật được coi là \"hàng giả\". Cổ vật này dường như được dùng để đo bức xạ vũ trụ, nhưng các nhà khảo cổ xác định rằng cổ vật này xuất hiện sớm hơn vài triệu năm so với Đế chế Yuht. Có vẻ như Viện bảo tàng Yuht đã nhầm lẫn, vì thứ gọi là \"hàng giả\" này thực chất là một cổ vật ngoài hành tinh hàng thật giá thật."
 precursor.520.desc:0 "Chúng tôi có thể nhìn thấy dấu vết phát triển của người Yuht ở khắp mọi nơi trên §Y[From.GetName]§!, rõ ràng [From.GetPlanetMoon] đã từng đối mặt với tình cảnh thiếu thốn đất đai, có một khu vực ở bán cầu bắc dường như từng là một nghĩa trang khổng lồ, xung quanh không có bất kỳ khu dân cư Yuht nào, nhưng lại có rất nhiều đài tưởng niệm. Vì tỷ lệ sinh sản của người Yuht rất thấp, và có tuổi thọ trung bình lên tới gần một ngàn năm, cái chết của mỗi người Yuht đều được đối xử hết sức trịnh trọng, tang lễ cũng được tổ chức vô cùng long trọng."
 precursor.521.desc:1 "Cuộc khai quật khảo cổ học tại [From.From.GetName] cho thấy phần lớn các ngôi mộ đã bị những kẻ trộm mộ cướp phá trong hàng triệu năm qua, bởi vì người Yuht thích dùng đồ trang sức và các mặt hàng xa xỉ đắt tiền khác làm đồ tùy táng. Trong những thứ mà những kẻ trộm mộ bỏ lại, các nhà khảo cổ học phát hiện một con búp bê đồ chơi rất giống với một người Yuht trưởng thành, họ cho rằng con búp bê đồ chơi này rất có thể là bùa may mắn hoặc một vật lưu niệm nào đó."
 precursor.525.desc:0 "Trên §Y[From.GetName]§! đã xảy ra một trận đại chiến. Hai bên tham chiến là người Yuht và một giống loài mà chúng ta không biết nhiều về họ. Trận chiến này diễn ra vào thời kỳ mạt vận của Đế chế Yuht. Dù trận chiến này đã diễn ra cách đây hàng triệu năm, nhưng những tàn tích do chiến tranh để lại vẫn có thể được nhìn thấy. Mặc dù [From.GetPlanetMoon] là một thuộc địa quan trọng của người Yuht, nhưng các thành phố và công trình kiến trúc ngoại vi của họ chưa bao giờ được xây dựng lại sau trận chiến, điều này dường như chứng tỏ họ đã thua trong trận chiến đó."
 precursor.526.desc:1 "Sau khi khai quật và thăm dò sâu vài chiến trường cổ đại trên §Y[From.From.GetName]§!, các nhà khảo cổ học của chúng tôi đã đào được các phương tiện chuyên chở được người Yuht sử dụng trong tác chiến, trên đó vẫn còn gắn vài khẩu pháo cỡ nòng lớn. Các nhà khảo cổ học cho rằng, do binh lính Yuht có kích thước khổng lồ, họ trên chiến trường giống như những pháo đài di động cỡ lớn vậy."
 precursor.530.name:0 "Vệ tinh của người Yuht"
 precursor.530.desc:0 "Một vệ tinh do người Yuht phóng đang quay quanh §Y[From.GetName]§! để kỷ niệm lần đầu tiên họ tiếp xúc với người Jabbaten, Jabbaten là một nền văn minh tồn tại ngắn ngủi. Sự kiện này diễn ra trong hệ sao [From.GetStarName], và có ảnh hưởng to lớn đến mọi khía cạnh của Đế chế Yuht. Trong một triệu năm qua, họ vẫn luôn nghĩ mình là những đứa trẻ mồ côi trong vũ trụ, vậy nên khi phát hiện có sự sống thông minh khác tồn tại, họ vừa kinh ngạc vừa sợ hãi. [Root.GetName] đã khôi phục lại vệ tinh, hiện tại vệ tinh này đang chờ chúng ta tiến hành phân tích toàn diện."
 precursor.531.desc:1 "Chúng tôi đã thu hồi vệ tinh từ §Y[From.From.GetName]§! và tiến hành phân tích, các nhà khảo cổ học đã tìm thấy một bức ảnh, trong ảnh là một chiếc tàu tuần dương Yuht và một chiếc tàu trinh sát Jabbaten tương đối nhỏ chạm trán nhau trong lần tiếp xúc đầu tiên. Bức ảnh này đã cho chúng tôi biết phần nào về diện mạo tàu vũ trụ của họ."
 precursor.535.name:0 "Tàu tuần dương của người Yuht"
 precursor.535.desc:0 "Chúng tôi phát hiện một chiếc tàu tuần dương của người Yuht đang bay quanh quỹ đạo §Y[From.GetName]§!, con tàu này dường như đã bị pháo kích dữ dội, nhưng vì thân tàu đã quá lâu đời, nên điều này cũng khó xác định. Không có dấu hiệu nào cho thấy con tàu này được trang bị động cơ siêu quang tốc, vì vậy nó hẳn là đã du hành qua các vì sao với tốc độ cận quang."
 precursor.536.desc:1 "Các nhà khảo cổ học điều tra tàu tuần dương Yuht bị bỏ hoang trên §Y[From.From.GetName]§! đã gửi báo cáo. Ở giữa tàu tuần dương có hai buồng đông lạnh lớn, mỗi buồng dùng để tạm thời đông lạnh một người Yuht. Vì người Yuht có thân hình to lớn, loại buồng đông lạnh với quy mô này trên tàu tuần dương hiển nhiên là mẫu tiêu chuẩn dành cho phi hành đoàn. Không tìm thấy bất kỳ hài cốt Yuht nào trên tàu, nhưng các nhà khảo cổ đã tìm thấy nhật ký từ các máy tính theo dõi dấu hiệu sinh tồn và tình hình y tế của phi hành đoàn. Trong nhật ký cung cấp chi tiết những thông tin quý giá liên quan đến thông tin cơ thể của người Yuht."
 precursor.540.name:0 "Tàu thuộc địa của người Yuht"
 precursor.540.desc:0 "Tàn tích tàu vũ trụ giữa các vì sao của người Yuht được phát hiện trên quỹ đạo tầm cao của §Y[From.GetName]§!. Theo phân tích sơ bộ của [Root.GetName], con tàu này có lẽ là một con tàu thuộc địa. Ngay cả những chiếc tàu vũ trụ giữa các vì sao cỡ lớn như tuần dương hạm của Yuht cũng chỉ có thể chứa được một đến hai người, tất cả đều là do cơ thể họ quá lớn. Nhưng con tàu này lại có rất nhiều buồng nhiệt độ thấp, mỗi buồng đều có một bộ xương ngoài khổng lồ, những bộ xương ngoài này có thể thuộc về những người định cư Yuht đó."
 precursor.541.desc:1 "Phần lớn di vật của con tàu thuộc địa Yuht bay trên quỹ đạo quanh §Y[From.From.GetName]§! đều đã tàn tạ không chịu nổi, các nhà khảo cổ đã thu hồi thành công động cơ cận quang tốc từ trong đó. Người Yuht đã không thể đột phá được tốc độ ánh sáng, họ dựa vào công nghệ đông lạnh và tuổi thọ tự nhiên lên đến ngàn năm để mở rộng lãnh thổ đế chế của mình giữa các hành tinh."
 precursor.545.name:0 "Trạm cư trú tiểu hành tinh Yuht"
 precursor.545.desc:0 "Những tiểu hành tinh này có vẻ là trạm cư trú của một số người Yuht, kết quả quét sâu cho thấy trong tiểu hành tinh có một nhóm các hang động thông nhau, kiểu dáng tương tự như các kiến trúc Yuht được tìm thấy ở những nơi khác. Nếu muốn tìm hiểu thêm, chúng ta cần phái đội viễn chinh tới khám phá các hang động."
 precursor.546.desc:1 "Qua việc điều tra trạm cư trú của người Yuht trên tiểu hành tinh §Y[From.From.GetName]§!, chúng tôi phát hiện đây là nhà của triết gia ẩn sĩ nổi tiếng \"Yakreel\". Bà hiển nhiên là một nhân vật rất có danh tiếng trong nền văn hóa Yuht, có thể tìm thấy các tài liệu ghi chép về bà tại nhiều địa điểm khảo cổ Yuht khác nhau. Hài cốt của Yakreel được tìm thấy trong khoang bịt kín chính của trạm cư trú, bà đã mòn mỏi chờ đợi tàu tiếp tế ở đó cho đến chết, nhưng cuối cùng con tàu tiếp tế cũng không đến."
 precursor.600.name:0 "Định vị xong hệ sao mẹ của người Yuht"
 precursor.600.desc:0 "Sau khi chúng tôi tiến hành nghiên cứu sâu hơn về tàu Yuht, các nhà khoa học trên §Y[Root.Capital.GetName]§! đã định vị được hệ sao mẹ của nền văn minh Yuht - Yuhtaan! Chúng ta nên tranh thủ khám phá hệ sao đó trước những kẻ khác."
 precursor.601.name:0 "Sao mẹ Yuht"
 precursor.601.desc:1 "Chúng tôi đã xác nhận §Y[FromFrom.GetName]§! là sao mẹ của người Yuht. Bốn triệu năm trước, [FromFrom.GetPlanetMoon] này đã hứng chịu một trận bắn phá quỹ đạo quy mô lớn, bề mặt giờ đây chỉ còn lại những đống đổ nát trơ khung kim loại xoắn vặn, và những bộ khung này từng là một phần của cụm siêu đô thị khổng lồ.\n\nTheo thông tin hiện có, trong suốt một triệu năm, người Yuht đã dành phần lớn thời gian để tìm kiếm sự sống thông minh ngoài hành tinh, nhưng đều trắng tay. Khi cuối cùng họ cũng gặp được người Jabbaten, giống loài non trẻ vừa mới bước vào thời đại vũ trụ này đã khiến những người Yuht sợ chết khiếp.\n\nCác thủ lĩnh Yuht đã đạt được đồng thuận: phải tiêu diệt người Jabbaten trước khi họ trở thành mối đe dọa lớn hơn. Một cuộc tấn công quy mô lớn đã bắt đầu như thế, trận chiến này đã khiến cả hai bên đều tổn thất nặng nề. Dù còn non trẻ, nhưng người Jabbaten đã và đang thử nghiệm những công nghệ mới tinh mà người Yuht có nằm mơ cũng không nghĩ tới. Cuối cùng họ đã lật ngược thế cờ, giành được lợi thế. Trong vòng chưa đầy mười năm chiến tranh, Đế chế Yuht có lịch sử hai triệu năm cuối cùng đã bị hủy diệt hoàn toàn."
 precursor.602.name:0 "Phát hiện sao mẹ Yuht"
 precursor.602.desc.a:1 "Chúng tôi đã phát hiện sao mẹ cổ đại của người Yuht. Tuy nhiên, đã có người đến đó trước chúng ta. Bọn họ đã cướp sạch [FromFrom.GetPlanetMoon]."
 precursor.602.desc.b:1 "Cuộc điều tra của chúng tôi về §Y[FromFrom.GetName]§! cho thấy [FromFrom.GetPlanetMoon] từng là sao mẹ của một tộc người tên là \"Yuht\". Nơi này đã có những lữ khách không gian khác ghé thăm, và họ đã lấy đi mọi thứ có giá trị trên [FromFrom.GetPlanetMoon]."
 precursor.1000.name:0 "Liên minh Đệ Nhất"
 precursor.1000.desc:1 "Chúng tôi đã tìm thấy một số cổ vật thuộc về một nền văn minh ngoài hành tinh cổ đại nào đó trên §Y[From.GetName]§!! Nếu không nhầm thì, nền văn minh này hẳn là một liên minh được thành lập bởi các giống loài khác nhau, họ tự gọi mình là \"Liên minh Đệ Nhất\". Những giống loài này đã chung sống khá hòa bình trong vùng không gian này vào hai triệu năm trước.\n\nMặc dù [From.GetStarName] nằm trong phạm vi vùng lõi của họ, nhưng một tấm bản đồ cục bộ được tìm thấy trên con tàu cổ vật cho thấy, trước khi sụp đổ, Liên minh Đệ Nhất đã thống trị một phần rất lớn thiên hà của chúng ta."
 precursor.1005.name:0 "Căn cứ hạm đội Liên minh"
 precursor.1005.desc:0 "Chúng tôi phát hiện những tàn tích chắc chắn là căn cứ hạm đội của Liên minh Đệ Nhất trên quỹ đạo §Y[From.GetName]§!. Chúng tôi biết Liên minh Đệ Nhất duy trì một hạm đội lớn có tên là Hạm đội Vô địch, chiến đấu với hải tặc và các quốc gia thù địch khác —— bến cảng này rõ ràng là được dùng làm nơi cập bến cho một hạm đội tuần tra."
 precursor.1006.desc:1 "Nhiệm vụ khai quật khảo cổ tại căn cứ hạm đội của Liên minh Đệ Nhất đã hoàn thành. Chúng tôi đã thu hồi được huy chương của Hạm đội Tuần tra Vùng Vành đai ngoài số 28, hạm đội tuần tra này là một hạm đội quy mô trung bình chịu trách nhiệm bảo vệ an toàn cho các tuyến thương mại kết nối thẳng từ Vành đai ngoài vào Đế chế Liên hợp. Căn cứ bay quanh [From.From.GetName] rõ ràng là bến đỗ khi trở về của họ."
 precursor.1010.name:0 "Tàu tuần dương Liên minh"
 precursor.1010.desc:0 "Một phần mũi tàu của tàu tuần dương Liên minh Đệ Nhất được phát hiện đang bay quanh §Y[From.GetName]§!, những mảnh vỡ này tạo nên phần còn lại của con tàu. Nhưng những bộ phận còn sót lại được bảo quản rất kém. Vỏ ngoài của thân tàu lỗ chỗ những cái hố, những cái hố này ước chừng là do máy phóng khối lượng lớn để lại."
 precursor.1011.desc:1 "Đội thám hiểm khảo cổ khởi hành đến tàu tuần dương Liên minh Đệ Nhất đang bay quanh §Y[From.From.GetName]§! để khảo sát đã quay trở lại. Trên thân tàu đã biến thành đống tàn tích không phát hiện được thứ gì có giá trị, nhưng các nhà khảo cổ đã tìm thấy danh sách thành viên phi hành đoàn. Liên minh Đệ Nhất chiêu mộ nhân sự từ tất cả các hành tinh thành viên để gia nhập Hạm đội Sao Liên hợp của họ, hay còn gọi là Hạm đội Vô địch, từ danh sách này có thể biết được phi hành đoàn trên chiếc tuần dương hạm này đến từ 12 chủng tộc khác nhau."
 precursor.1015.name:0 "Sao mẹ Hamada"
 precursor.1015.desc:0 "Cuộc điều tra về §Y[From.GetName]§! cho thấy [From.GetPlanetMoon] là sao mẹ của Hamada, họ là thành viên sáng lập của Liên minh Đệ Nhất. Các kiến trúc hình tổ ong khổng lồ từng bao phủ phần lớn bề mặt hành tinh, nhưng chúng tôi được biết Hamada đã khoanh vùng một khu vực hình tròn rất lớn ở bán cầu nam và cấm xây dựng bất kỳ công trình nào. Khu vực này rộng bằng một phần ba toàn bộ bán cầu nam, nó vừa là nơi sinh sản của bạn đời vừa là một khu bảo tồn thiên nhiên."
 precursor.1016.desc:1 "Đội thám hiểm khảo cổ được cử đến §Y[From.From.GetName]§! đã tìm hiểu được rất nhiều điều về loài Hamada đã tuyệt chủng. Loài Hamada gìn giữ văn hóa thượng võ, khi phi thuyền của họ có thể đột phá tốc độ ánh sáng, họ đã xảy ra vài cuộc chiến tranh quy mô lớn với nhiều người sáng lập Liên minh Đệ Nhất khác.\n\nSau khi tuyên bố thua trận, loài Hamada đã trở thành những người ủng hộ kiên định nhất của Liên minh Đệ Nhất, những chiến binh mạnh nhất của họ đã gia nhập đội đột kích của Liên minh để bảo vệ an ninh cho Liên minh. Chúng tôi đã tìm thấy một thanh \"Magir-Sha\" được bảo quản tốt, đây là lưỡi hái nghi lễ được những người Hamada giữ chức Vệ binh Danh dự của Liên minh Đệ Nhất sử dụng."
 precursor.1020.name:0 "Sao mẹ Kassack"
 precursor.1020.desc:0 "Hành tinh này là sao mẹ của nền văn minh Kassack cổ đại, nền văn minh người rắn này là một trong những thành viên sáng lập nên Liên minh Đệ Nhất. Tất cả các thành phố lớn của họ đều nằm dưới lòng đất, [From.GetName] đầy ắp các mạng lưới đường hầm, nhưng sau khi Kassack bị tiêu diệt vào hai triệu năm trước, những đường hầm này đã sụp đổ. Máy dò tìm của [Root.GetName] đã khóa vị trí của một số thành phố ngầm có khả năng tồn tại."
 precursor.1021.desc:1 "Mặc dù quá trình khai quật các thành phố Kassack dưới lòng đất nằm trên §Y[From.From.GetName]§! vẫn đang được tiến hành, nhưng chúng tôi đã hiểu đủ nhiều về giống loài viễn cổ này. Bọn họ thuộc loài bò sát, thân hình thon dài không chân, một người Kassack trưởng thành có thể dài tới 20 mét hoặc hơn.\n\nTất cả dữ liệu còn sót lại đều cho thấy Kassack vô cùng giỏi giao thương, hạm đội thương mại của họ thường là những người đầu tiên tiếp xúc với các chủng tộc ngoài Liên minh và Liên minh Đệ Nhất. Nếu không có những mạng lưới thương mại Kassack chằng chịt đã tồn tại từ trước khi Liên minh được thành lập này, e rằng Liên minh cũng không có cách nào bành trướng nhanh đến thế."
 precursor.1025.name:0 "Sao mẹ Migyang"
 precursor.1025.desc:0 "Người Migyang có thân hình nhỏ bé nhưng sinh sản nhanh là một trong những thành viên sáng lập Liên minh Đệ Nhất cổ đại. §Y[From.GetName]§! là sao mẹ của họ. Họ cư ngụ trong hàng trăm ngàn công trình khổng lồ trên bề mặt hành tinh, mỗi tòa nhà có thể chứa được hàng triệu người. Những tòa nhà này được kết nối với nhau bằng thang máy không gian, người Migyang rõ ràng không muốn ra khỏi các tòa nhà trên [From.GetPlanetMoon] đó."
 precursor.1026.desc:1 "Di hài hóa thạch của người Migyang đã tuyệt chủng đã được các nhà khảo cổ học của chúng tôi khai quật tại §Y[From.From.GetName]§!, điều này giúp chúng tôi nhìn rõ hơn hình dáng ban đầu của giống loài này: thân hình họ cực kỳ nhỏ bé, đa số các cá thể đều không dài quá 0.6 mét, những loài động vật gặm nhấm có vú này là động vật ăn cỏ.\n\nCác thành viên trong gia đình Migyang thường bao gồm một ngàn cá thể, địa vị xã hội của mỗi cá thể hầu như hoàn toàn được quyết định bởi kỹ năng của họ. Tương truyền rằng sự thành lập của Liên minh Đệ Nhất là do phái đoàn ngoại giao của người Migyang một tay thúc đẩy."
 precursor.1030.name:0 "Sao mẹ Viropa"
 precursor.1030.desc:0 "§Y[From.GetName]§! từng là sao mẹ của tộc người chim Viropa, chủng tộc này là một trong những thành viên sáng lập nên Liên minh Đệ Nhất cổ đại. Những người chim không thể bay này đi lại bằng đôi chân dài. Hóa thạch cho thấy phụ nữ trong số họ có thể cao tới bốn mét, còn nam giới thì lùn hơn một chút.\n\nTất cả các thành phố đều được xây dựng trên nền đất đào lên. Việc quét sóng cũng cho thấy những nền tảng này là công trình nhân tạo, có thể đây là những thành phố mới do người Viropa xây dựng trong tình trạng thiếu hụt các lựa chọn về nơi ở tự nhiên."
 precursor.1031.desc:1 "Khi thế lực của Liên minh Đệ Nhất đạt đến đỉnh cao, giống loài Viropa được mệnh danh là những nhà khoa học xuất sắc nhất trong thiên hà. Những thành quả nghiên cứu và phát minh của họ đã nâng đỡ giai đoạn bành trướng ban đầu của Liên minh, không chỉ một giống loài vì ngưỡng mộ công nghệ của Viropa mà đã gia nhập Liên minh. Thật không may, trong những tàn tích của [From.From.GetName] ngày nay, lại không tìm thấy bất kỳ dấu vết nào về công nghệ của người Viropa."
 precursor.1035.name:0 "Căn cứ khoa học của Liên minh"
 precursor.1035.desc:0 "Trong quá trình quét bề mặt §Y[From.GetName]§!, chúng tôi đã phát hiện tàn tích của một cơ sở cổ đại trên bề mặt [From.GetPlanetMoon]. Những cơ sở này đã bị xóa sổ trong một vụ nổ lớn cách đây hai triệu năm. Tuy nhiên, ít nhiều vẫn còn một số tòa nhà ngoại vi được bảo tồn. Mọi bằng chứng đều cho thấy đây là một cơ sở nghiên cứu do Liên minh Đệ Nhất xây dựng."
 precursor.1036.desc:1 "Đội thám hiểm khảo cổ mà chúng tôi phái đến §Y[From.From.GetName]§! đã quay về. Bọn họ không phát hiện được thứ gì có giá trị tại căn cứ nghiên cứu của Liên minh Đệ Nhất do mình phụ trách điều tra, nhưng dựa trên vị trí địa lý hẻo lánh của căn cứ nghiên cứu đó, chúng tôi suy đoán rằng đó hẳn là nơi tiến hành các thí nghiệm và nghiên cứu nguy hiểm —— rất có thể liên quan đến du hành đa chiều hoặc vũ khí sinh học bậc cao.\n\nTrên một đĩa dữ liệu được thu hồi từ \"Viện Hàn lâm Khoa học\", chúng tôi đã tìm thấy thông tin liên quan đến cấu trúc hệ thống của giới khoa học Liên minh Đệ Nhất."
 precursor.1040.name:0 "Thuộc địa Liên hợp của Liên minh"
 precursor.1040.desc:0 "Tàn tích của một thuộc địa Liên minh Đệ Nhất trên §Y[From.GetName]§! đã được phát hiện. Thuộc địa này ở thời kỳ mạt vận của Liên minh Đệ Nhất, là một cơ sở thí nghiệm xã hội - các thành viên ban đầu được phân bổ đồng đều từ tất cả các thành viên trong liên minh, và thuộc địa này đã bị bỏ hoang chưa đầy năm mươi năm sau khi được thành lập."
 precursor.1041.desc:1 "Các nhà khảo cổ học của chúng tôi đã phát hiện thêm nhiều thông tin về thuộc địa đã mất trên §Y[From.From.GetName]§!. Vào thời điểm nó mới được thành lập, Liên minh Đệ Nhất đã đứng trên bờ vực sụp đổ, Liên minh đã sử dụng thuộc địa này như một công cụ tuyên truyền —— để cho mọi người thấy một hình mẫu hành tinh vui vẻ hòa thuận, nơi tất cả các thành viên Liên minh cùng chung sống và làm việc với nhau.\n\nThông cáo này dường như đã gây ra phản tác dụng, bởi vì có bằng chứng cho thấy đã xảy ra rất nhiều cuộc xung đột quy mô lớn giữa các thuộc địa, thậm chí bao gồm cả một cuộc đại thanh trừng trước khi một thuộc địa nào đó bị bỏ hoang."
 precursor.1045.name:0 "Trung tâm thương mại của Liên minh"
 precursor.1045.desc:0 "Hai triệu năm trước, §Y[From.GetName]§! đóng vai trò là trung tâm giao dịch cho các quốc gia thành viên của Liên minh Đệ Nhất. Một lượng lớn cư dân trên bề mặt [From.GetPlanetMoon] phân bố ở các thành phố hình tháp, và chúng tôi phát hiện ít nhất mười hai sân bay vũ trụ ở bán cầu bắc. Cùng với sự thay đổi của các tuyến đường thương mại và sự lụi tàn của Liên minh Đệ Nhất, [From.GetPlanetMoon] dần bị bỏ hoang trong những thế kỷ tiếp theo."
 precursor.1046.desc:1 "Rốt cuộc chủng tộc nào đã định cư trên hành tinh này đầu tiên, thì không còn cách nào để biết được nữa —— xương và hóa thạch của tất cả các thành viên đã biết của Liên minh Đệ Nhất đều được khai quật tại [From.From.GetPlanetMoon], và số lượng hài cốt của mỗi chủng tộc gần như bằng nhau. Các nhà khảo cổ học của chúng tôi cũng phát hiện thêm mười mấy hài cốt của những chủng tộc không phải là thành viên chính thức của liên minh, những chủng tộc này dường như rất tận hưởng các đặc quyền thương mại trong lãnh thổ của Liên minh Đệ Nhất."
 precursor.1050.name:0 "Tàn tích chiến dịch"
 precursor.1050.desc:0 "Khoảng hai triệu năm trước, một trận đại chiến đã nổ ra giữa Hạm đội Vô địch của Liên minh Đệ Nhất và một hạm đội khác, trường trọng lực của [From.GetName] cách đó không xa đã bắt giữ được rất nhiều mảnh vỡ tàn tích từ trận chiến ấy. Những mảnh vỡ khổng lồ này cũng có thể được tìm thấy trên bề mặt [From.GetPlanetMoon]."
 precursor.1051.desc:1 "Các nhà khảo cổ học của chúng tôi đã khai quật thành công phần thân của vài con tàu trên bề mặt §Y[From.From.GetName]§!, những phần thân tàu này là di tích còn sót lại từ một trận đại chiến vũ trụ diễn ra trong hệ sao này vào hai triệu năm trước. Tham gia vào trận đại chiến là Hạm đội 2 và 3 thuộc Hạm đội Vô địch của Liên minh Đệ Nhất, nhằm chống lại cuộc tấn công của hạm đội liên hợp thuộc chủng tộc Rijin, Rijin là một chủng tộc hiếu chiến lang thang khắp Vành đai ngoài.\n\nVốn dĩ chỉ là một cuộc đụng độ nhỏ nhoi nhưng đã nhanh chóng leo thang thành một trận đại chiến mà mỗi bên đều xuất quân hàng trăm chiếc phi thuyền, kết quả cuối cùng của trận chiến này vẫn chưa được biết đến."
 precursor.1055.name:0 "Nhà tù của Liên minh Đệ Nhất"
 precursor.1055.desc:0 "Phát hiện tàn tích của một cơ sở nhà tù cỡ lớn của Liên minh Đệ Nhất tại §Y[From.GetName]§!. Hành tinh này có lẽ là một kiểu nhà tù với cấp độ an ninh tối đa. Đây là nơi giam giữ những tội phạm nguy hiểm nhất của toàn bộ đế chế. Các ghi chép còn lưu lại cho thấy, phần lớn các tù nhân đều bị giam giữ vì tội làm hải tặc, tiến hành phá hoại và các tội phạm \"có tính chất nghiêm trọng\" khác. Trong các phòng giam vẫn có thể tìm thấy hóa thạch của các tù nhân."
 precursor.1056.desc:1 "Công việc khảo cổ học tại §Y[From.From.GetName]§! đã phát hiện ra rằng ở một nơi nào đó phía nam của cơ sở nhà tù từng xảy ra một vụ vượt ngục bất thành. Phía sau vách đá nhỏ có một chiếc xe vận chuyển tù nhân bị lật nhào, và cách đó vài cây số, người ta phát hiện hài cốt của những tù nhân đang thụ án mặc bộ đồ điều áp ăn trộm được và ôm chặt lấy nhau. Bọn họ dường như chết ngạt vì bộ đồ điều áp cạn kiệt oxy. Dù vì lý do gì đi nữa, những người quản lý nhà tù dường như cảm thấy không cần thiết phải thu hồi xác của những tù nhân này."
 precursor.1060.name:1 "Hành tinh [Owner.GetPreFTLUpper] được bảo vệ"
 precursor.1060.desc:1 "§Y[From.GetName]§! là trạm cư trú của một nền văn minh Thời đại Đồ đồng sơ kỳ vào hai triệu năm trước. Thật thú vị, [Root.GetName] cũng phát hiện những trạm quan sát bí mật trên [From.GetPlanetMoon], những trạm quan sát này đều do Liên minh Đệ Nhất xây dựng. Liên minh Đệ Nhất vừa cố gắng tránh xâm lược văn hóa, vừa nghiên cứu nền văn minh [Owner.GetPreFTLLower].\n\nPhần lớn các trạm quan sát đã bị phá hủy bởi một loại vũ khí năng lượng tiên tiến, và chúng tôi cũng không rõ tại sao nền văn minh [Owner.GetPreFTLLower] này vẫn mãi mắc kẹt trong Thời đại Đồ đồng."
 precursor.1061.desc:1 "Từ nghiên cứu khảo cổ học của chúng tôi tại §Y[From.From.GetName]§!, chúng tôi phát hiện Liên minh Đệ Nhất không bao giờ can thiệp vào sự phát triển của các nền văn minh tiền vũ trụ. Họ đã xây dựng những tiền đồn quan sát bí mật tương tự như trên [From.From.GetPlanetMoon] tại ít nhất bảy hành tinh. Nền văn minh này đã bị hủy diệt sau khi Liên minh Đệ Nhất sụp đổ do bị một nhóm chủ nô lệ giữa các vì sao tấn công."
 precursor.1065.name:0 "Phong tỏa quỹ đạo"
 precursor.1065.desc:0 "§Y[From.GetName]§! nằm sâu trong nơi từng được cho là lãnh thổ của Liên minh Đệ Nhất vào hai triệu năm trước, đây có lẽ là một thuộc địa hoặc thế giới quê nhà của một giống loài được mô tả là \"vảy ngược\".\n\nHai phe phái này đã bị cuốn vào một kiểu chiến tranh thương mại nào đó, lực lượng hải quân hùng hậu của Liên hiệp đã duy trì một cuộc phong tỏa liên tục tại hai địa điểm khác nhau trên [From.GetPlanetMoon]. Các mảnh vỡ trên quỹ đạo tiết lộ rằng cuộc phong tỏa này đã phải hứng chịu vài thách thức đẫm máu."
 precursor.1066.desc:1 "Một nhóm các nhà khảo cổ học đã phát hiện mảnh vỡ của một tàu khu trục Liên minh Đệ Nhất từ bề mặt của §Y[From.From.GetName]§!. Nó chắc hẳn là một phần của hạm đội phong tỏa quỹ đạo, dường như đã bị phá hủy bởi những giống loài ngoại lai trên [From.From.GetPlanetMoon] khi kích nổ thiết bị phản vật chất được giấu trong một con tàu buôn lậu. Các nhà khảo cổ đã khôi phục thành công một phần cơ sở dữ liệu của tàu khu trục, cung cấp danh sách các con tàu của Liên minh Đệ Nhất tham gia vào cuộc phong tỏa lúc bấy giờ."
 precursor.1070.name:0 "Tiểu hành tinh của những kẻ buôn lậu"
 precursor.1070.desc:0 "Tiểu hành tinh này đã trở thành thiên đường ngoài vòng pháp luật của các tổ chức bất hợp pháp khác nhau, nơi này đã từng rất thịnh vượng trong lãnh thổ của Liên minh Đệ Nhất. Thương nhân, kẻ buôn lậu và tầng lớp thấp hèn từ nhiều chủng tộc khác nhau trong Liên minh tập trung lại đây để dỡ hàng hóa, tìm kiếm đối tác mới hoặc nghỉ ngơi trong những khách sạn nhỏ."
 precursor.1071.desc:1 "Nhóm khảo cổ được phái đến tiểu hành tinh §Y[From.From.GetName]§! đã phát hiện rất nhiều thông tin về các tổ chức bất hợp pháp hoành hành trong Liên minh Đệ Nhất hai triệu năm trước. Khi các quốc gia thành viên trong Liên minh mở cửa biên giới với nhau, tội ác cũng theo đó mà sinh sôi nảy nở. Buôn lậu và hải tặc là những vấn đề rất nghiêm trọng lúc bấy giờ, phần lớn hạm đội của Liên minh đều bận rộn với việc chống lại những tội ác này."
 precursor.1100.name:0 "Định vị hệ sao mẹ của Liên minh Đệ Nhất"
 precursor.1100.desc:0 "Sau khi nghiên cứu cẩn thận các con tàu của Liên minh Đệ Nhất, các nhà khoa học tại §Y[Root.Capital.GetName]§! cuối cùng đã xác định được hệ sao mẹ của Liên minh Đệ Nhất - Fen Habbanis! Chúng ta nên tiến hành khám phá ngay lập tức, đừng để người khác hớt tay trên."
 precursor.1101.name:0 "Trụ sở của Liên minh Đệ Nhất"
 precursor.1101.desc:1 "Trong suốt chiều dài lịch sử của Liên minh Đệ Nhất, §Y[FromFrom.GetName]§! phần lớn thời gian đều là trung tâm hành chính của Liên minh Đệ Nhất, đồng thời cũng là nơi làm việc của các nghị sĩ nguyên lão của họ, [FromFrom.GetPlanetMoon] này là một nơi đông đúc dân cư, một thành phố với quy mô toàn cầu chiếm phần lớn diện tích bề mặt. Dân số lên tới hàng trăm triệu người, quyết định việc lương thực của họ chỉ có thể được nhập khẩu từ bên ngoài.\n\nKhi Liên minh tan rã, những phi thuyền vận chuyển lương thực này đã ngừng cung cấp lương thực chỉ sau một đêm. Có một vài người đã bay tới những hành tinh khác, nhưng phần lớn đều bị bỏ lại. Cái đói và sự hỗn loạn bắt đầu hoành hành, [FromFrom.GetPlanetMoon] đã trở thành thiên đường của các lãnh chúa và tổ chức tội phạm.\n\nDân số tiếp tục giảm dần trong nhiều thế kỷ, cho đến khi hành tinh này trở nên hoang vu không bóng người —— trở thành lời điếu văn cuối cùng của Liên minh Đệ Nhất."
 precursor.1102.name:0 "Phát hiện thủ đô của Liên minh Đệ Nhất"
 precursor.1102.desc.a:0 "Cuối cùng chúng ta cũng phát hiện ra thủ đô của Liên minh Đệ Nhất cổ đại. Nhưng thật không may, chúng ta đã đến muộn, gần đây đã có người đến thăm quan, những thứ có giá trị đã bị cướp sạch."
 precursor.1102.desc.b:1 "Cuộc điều tra gần đây về §Y[FromFrom.GetName]§! cho thấy, hành tinh này trước đây từng là thủ đô của một thế lực ngoài hành tinh được gọi là \"Liên minh Đệ Nhất\". Ngoài chúng ta ra, cũng có những thế lực khác đã thám hiểm đến đây, họ đã lấy đi toàn bộ những thứ có giá trị trên [FromFrom.GetPlanetMoon]."
 precursor.1500.name:0 "Cộng hòa Irassian"
 precursor.1500.desc:1 "Chúng tôi đã tìm thấy một số cổ vật thuộc về một nền văn minh ngoài hành tinh cổ đại nào đó trên §Y[From.GetName]§!! Từ những gì chúng tôi giải mã được từ ngôn ngữ của họ cho đến nay, những người ngoài hành tinh này tự gọi mình là \"Cộng hòa Irassian\". Bọn họ là một chính quyền giữa các vì sao đã kiểm soát khu vực này của thiên hà vào một triệu năm trước.\n\nNhững người ngoài hành tinh này dường như là động vật có vú sáu chi, có nhiều tài liệu đối chiếu lẫn nhau về một căn bệnh dịch gọi là \"bệnh Javor\" đã càn quét đế chế của họ, mang lại những hậu quả thảm khốc, thậm chí trực tiếp dẫn đến sự diệt vong của họ."
 precursor.1505.name:0 "Hành tinh cách ly"
 precursor.1505.desc:0 "§Y[From.GetName]§! từng là một thuộc địa quy mô lớn của người Irassian, thuộc địa này có dấu hiệu của sự phát triển công nghiệp và cải tạo môi trường. Giống như trên các thuộc địa khác của người Irassian, những hóa thạch để lại kể một câu chuyện buồn —— do bệnh Javor hoành hành, dân số giảm sút nghiêm trọng, thảm họa này đã càn quét mọi khu định cư trên [From.GetPlanetMoon]. Trên quỹ đạo hành tinh vẫn còn lưu lại một lượng lớn mảnh vỡ xác tàu, có lẽ là những gì còn sót lại của một trận chiến."
 precursor.1506.desc:1 "Chúng tôi đã phân tích những mảnh vỡ trôi dạt trên quỹ đạo, đồng thời các nhà khảo cổ học suy luận rằng thuộc địa của người Irassian trên §Y[From.From.GetName]§! từng bị phong tỏa quân sự trước khi bị hủy diệt. Hạm đội của người Irassian lúc đó đã cố gắng cách ly [From.From.GetPlanetMoon] để kiềm chế bệnh Javor. Lúc bấy giờ có ít nhất một tá phi thuyền dân sự cố gắng vượt qua vòng phong tỏa, trận chiến diễn ra vô cùng khốc liệt, nhưng rất rõ ràng là một bộ phận phi thuyền đã tẩu thoát thành công."
 precursor.1510.name:0 "Hành tinh Thanh tẩy"
 precursor.1510.desc:0 "Có thể thấy rõ ràng rằng §Y[From.GetName]§!, một thuộc địa cổ đại của người Irassian, đã hứng chịu một trận bắn phá khủng khiếp từ quỹ đạo. Trong không gian có thể nhìn thấy rõ một số hố bom khổng lồ, những hố bom này nằm ở những trung tâm dân cư chính trên [From.GetPlanetMoon] vào khoảng 1.2 triệu năm trước.\n\nNhững kẻ đáng thương sống sót sau đợt bắn phá, chẳng bao lâu sau lại chết vì bệnh Javor hoành hành ở phần lớn các thuộc địa của người Irassian."
 precursor.1511.desc:1 "Đội khảo cổ của chúng tôi đã thu hồi được một đoạn ghi âm liên lạc từ tàn tích của một trạm theo dõi trên §Y[From.From.GetName]§!. Nó ghi lại đoạn hội thoại liên lạc giữa một vị chỉ huy hạm đội Irassian trên quỹ đạo và trụ sở hạm đội đặt tại Irassia. Vị chỉ huy này không hài lòng với việc trụ sở yêu cầu \"thanh tẩy\" mọi sinh vật trên hành tinh thuộc địa để ngăn chặn bệnh dịch lây lan. Mặc dù đoạn ghi âm liên lạc bị gián đoạn khi cuộc cãi vã chưa có kết quả, nhưng rất rõ ràng là vị chỉ huy cuối cùng vẫn thi hành mệnh lệnh đó."
 precursor.1515.name:0 "Sao mẹ Tiqqui"
 precursor.1515.desc:0 "[From.GetPlanetMoon] này là sao mẹ của người Tiqqui, họ là một giống loài bị Cộng hòa Irassian chinh phục. Giống loài thân mềm này đang chuẩn bị vượt qua rào cản du hành giữa các vì sao thì bị người Irassian phát hiện. Sau một thời gian dài xung đột, nhiều thành phố của Tiqqui đã bị phá hủy, cuối cùng Tiqqui vẫn bị chinh phục.\n\nCó bằng chứng trên bề mặt cho thấy trong những thập kỷ tiếp theo, có rất nhiều quân đoàn Irassian đóng quân tại đây. Điều này cho thấy người Tiqqui bất mãn với sự cai trị của người Irassian."
 precursor.1516.desc:1 "Đã tìm thấy một mảnh thông điệp không gian con của người Tiqqui trên §Y[From.From.GetName]§!, thông điệp này được gửi đến sao mẹ của tất cả các quốc gia phụ thuộc của Cộng hòa Irassian:\n\n§S\"Đã đến lúc phản kháng lại những kẻ thống trị tàn bạo. Đặc vụ của chúng ta biết được rằng bệnh Javor chỉ ảnh hưởng đến những kẻ Irassian gầy yếu, nhưng tất cả các giống loài đều có thể làm vật mang mầm bệnh. Chúng ta phải dốc hết sức xâm nhập vào thế giới của chúng, trạm không gian, phi thuyền, và cả những*rè rè* của chúng!\n\nCuối cùng, bọn Irassian đã gặp phải một kẻ thù mà hạm đội hùng mạnh của chúng cũng không thể đánh bại.*Rè rè* muôn năm, cơ hội ngàn năm có một này không được phép bỏ lỡ!\"§!"
 precursor.1520.name:0 "Sao mẹ Teedgo"
 precursor.1520.desc:0 "§Y[From.GetName]§! là sao mẹ 1.2 triệu năm trước của người Teedgo, họ là một giống loài bị Cộng hòa Irassian chinh phục. Bọn họ là những loài động vật chân đốt có cánh, hóa thạch được khai quật chứng minh họ ít nhất có thể bay được trong khoảng cách ngắn, và một số ít công trình còn sót lại của họ có thể hỗ trợ cho giả thuyết này.\n\nThật không may, di vật của nền văn minh này còn sót lại rất ít, vì [From.GetPlanetMoon] dường như đã bị bắn phá dữ dội từ quỹ đạo."
 precursor.1521.desc:1 "Nghiên cứu của chúng tôi về tàn tích ngoài hành tinh trên §Y[From.From.GetName]§! đã cho chúng ta hiểu thêm về thời kỳ cuối của Cộng hòa Irassian. Người Irassian nghi ngờ người Teedgo và một số quốc gia phụ thuộc khác đã bắt tay nhau cố tình lây lan bệnh Javor đến tất cả các hành tinh của người Irassian.\n\nChúng ta sẽ không bao giờ biết được điều này có phải là sự thật hay không, nhưng người Irassian cho rằng bằng chứng đã quá xác thực, nên đã phái hạm đội đến hủy diệt hoàn toàn [From.From.GetPlanetMoon] từ quỹ đạo."
 precursor.1525.name:0 "Thuộc địa chết"
 precursor.1525.desc:0 "Có những dấu hiệu cho thấy §Y[From.GetName]§! từng là một thuộc địa Irassian tràn đầy sức sống cho đến tận 1.2 triệu năm trước. Căn cứ vào niên đại xa xưa, tàn tích trên bề mặt [From.GetPlanetMoon] vẫn trong tình trạng tốt, không có dấu vết bị bắn phá từ quỹ đạo hoặc xảy ra xung đột.\n\nNhững người định cư Irassian đều đã chết vì bệnh Javor, sau đó hệ thực vật địa phương đã chiếm giữ những thành phố bị bỏ hoang, phủ lên thành phố một lớp thảm thực vật dày đặc."
 precursor.1526.desc:1 "Sau khi dọn sạch cỏ dại mọc um tùm tại một khu định cư cổ đại của người Irassian trên §Y[From.From.GetName]§!, đồng thời thiết lập máy phát trường năng lượng để ngăn chặn thú săn mồi xâm nhập, các nhà khảo cổ học của chúng tôi đã tiến hành khai quật triệt để tàn tích này. Giờ đây chúng ta đã hiểu rõ hơn về cuộc sống hàng ngày của người Irassian.\n\nPhát hiện lớn nhất của các nhà khảo cổ học là một cuốn bản đồ sao kỹ thuật số, được sử dụng để dạy cho trẻ em Irassian về đế chế của mình. Trong đó cũng bao gồm các mô tả chi tiết và mang tính miệt thị về tất cả các giống loài phụ thuộc của Cộng hòa."
 precursor.1530.name:0 "Căn cứ khai thác khoáng sản của người Irassian"
 precursor.1530.desc:0 "Những cái hố trên bề mặt §Y[From.GetName]§! là dấu vết để lại từ các hoạt động khai thác mỏ của người Irassian trên hành tinh này vào 1.2 triệu năm trước. [Root.GetName] đã tiến hành quét bề mặt triệt để, nhưng không phát hiện ra bất kỳ cơ sở khai thác khoáng sản nào còn sót lại."
 precursor.1531.desc:1 "Sau khi điều tra các hố sâu trên §Y[From.From.GetName]§!, các nhà khảo cổ học của chúng tôi đã phát hiện hóa thạch của hơn một trăm thợ mỏ người Irassian ở dưới đáy một trong những cái hố đó. Bọn họ dường như cũng là nạn nhân của căn bệnh Javor đã quật ngã Cộng hòa Irassian. Những người bạn đồng hành của các thợ mỏ đã uổng công vô ích nhằm ngăn chặn bệnh dịch lây lan, nên trước khi sơ tán khỏi [From.From.GetPlanetMoon], họ đã ném những thi thể xuống đáy của hố sâu."
 precursor.1535.name:0 "Thuộc địa của người Irassian"
 precursor.1535.desc:0 "§Y[From.GetName]§! là một thuộc địa vừa mới phát triển của người Irassian, nó tình cờ được thành lập vào đúng thời điểm cuộc đại tuyệt chủng của người Irassian bắt đầu. Chúng tôi phát hiện tàn tích của một thuộc địa và trung tâm không gian sơ cấp ở bán cầu bắc của [From.GetPlanetMoon]. Đánh giá từ các hóa thạch, hành tinh này là một trong những nạn nhân đầu tiên của căn bệnh Javor đã hủy diệt loài người Irassian."
 precursor.1536.desc:1 "Các nhà khảo cổ học của chúng tôi đã có một phát hiện đáng kinh ngạc trên §Y[From.From.GetName]§!. Mọi bằng chứng đều chỉ ra rằng bệnh Javor bắt nguồn từ chính [From.From.GetPlanetMoon] nhỏ bé vô danh này!\n\nDo lỗi kỹ thuật trong quá trình sản xuất hệ thống phong tỏa kiểm dịch, một loại vi khuẩn hiếm gặp ở địa phương đã xâm nhập vào thuộc địa của người Irassian, sau đó lại lây lan sang lưới lọc không khí của một con tàu buôn đang cập bến. Vì tốc độ lây lan của bệnh dịch vô cùng khủng khiếp, không rõ người Irassian có cơ hội tìm hiểu về nguồn gốc của bệnh dịch hay không."
 precursor.1540.name:0 "Phi thuyền bị bỏ hoang của người Irassian"
 precursor.1540.desc:0 "Một chiếc tàu tuần dương của người Irassian đã bị bỏ hoang trên quỹ đạo tầm gần của §Y[From.GetName]§! cách đây hơn một triệu năm. Chiếc phi thuyền đang xoay tròn chậm rãi này không có dấu vết bị hư hại trong chiến đấu, tất cả các khoang thoát hiểm vẫn còn trên tàu. Đúng như dự đoán, bên trong thân tàu cũng không có tín hiệu năng lượng nào."
 precursor.1541.desc:1 "Chiếc tàu tuần dương Irassian trôi dạt trên quỹ đạo phía trên §Y[From.From.GetName]§! chứa thi thể của toàn bộ phi hành đoàn. Hầu hết trong số họ đều chết vì bệnh Javor - căn bệnh sau này đã làm tuyệt chủng toàn bộ tộc người Irassian, nhưng cũng có một số thành viên phi hành đoàn đã bị lính canh liên sao trên tàu bắn chết vì muốn dùng khoang thoát hiểm để bỏ trốn. Đánh giá từ các tệp nhật ký được khôi phục, sau khi bệnh dịch bùng phát, thuyền trưởng đã nghiêm lệnh cách ly toàn bộ con tàu."
 precursor.1545.name:0 "Kiểm soát dịch bệnh"
 precursor.1545.desc:0 "Phát hiện vô số mảnh vỡ của thiết bị quỹ đạo phía trên §Y[From.GetName]§!, một số vật dụng được khôi phục từ các mảnh vỡ chứng minh rằng trạm không gian này là trung tâm kiểm soát dịch bệnh của Cộng hòa Irassian cách đây 1.2 triệu năm.\n\nNgười Irassian dễ bị mắc các bệnh lạ từ ngoài hành tinh hơn bất kỳ giống loài nào đã biết khác, ngân sách y tế công cộng của họ nhiều ngang bằng với ngân sách quân sự. Mặc dù vậy, những ghi chép còn lưu lại vẫn cho thấy toàn bộ giống loài của họ đều đã chết vì bệnh Javor."
 precursor.1546.desc:1 "Chúng tôi đã khôi phục một số nhật ký nghiên cứu từ cụm mảnh vỡ liên sao nằm trên §Y[From.From.GetName]§!. Những ghi chép cuối cùng của chúng đều là về việc tìm kiếm thuốc giải độc cho căn bệnh Javor đang tàn phá người Irassian, nhưng khi tình hình ngày càng tồi tệ đi, họ cũng trở nên tuyệt vọng hơn.\n\nGhi chép cuối cùng cho thấy bệnh dịch đã lan rộng ngoài tầm kiểm soát trong toàn bộ trạm không gian, một bản phụ lục ghi lại tất cả những nỗ lực chế tạo thuốc giải đã thất bại. Những người này hy vọng dữ liệu nghiên cứu của họ có thể giúp ích cho các nhà khoa học Irassian thế hệ sau."
 precursor.1550.name:0 "Tiền đồn theo dõi tiểu hành tinh"
 precursor.1550.desc:0 "Một tiền đồn theo dõi quân sự cỡ nhỏ của người Irassian được xây dựng bên trong một tiểu hành tinh bị khoét rỗng. Hệ thống theo dõi này được trang bị một hệ thống cảm biến mạnh mẽ hướng về các hệ sao lân cận. Những thiết bị này đều không thể sử dụng được nữa, tiểu hành tinh này dường như đã bị những người khác điều tra và cướp phá, và những chuyện như vậy có thể đã xảy ra hơn một lần."
 precursor.1551.desc:1 "Chúng tôi phát hiện ra rằng trong thời kỳ bành trướng của người Irassian, họ đã sử dụng tiền đồn theo dõi trên tiểu hành tinh [From.From.GetName] để theo dõi các nền văn minh khác ở khu vực lân cận, và lên kế hoạch tấn công. Những kế hoạch này vô cùng thành công, người Irassian đã nhanh chóng trở thành thế lực thống trị trong khu vực này của không gian. Khi họ bị bệnh Javor tiêu diệt, tiền đồn theo dõi này đã bị quân đội Irassian bỏ hoang từ lâu."
 precursor.1555.name:0 "Trạm nghiên cứu khoa học hành tinh khí khổng lồ"
 precursor.1555.desc:0 "Phát hiện một số mảnh vỡ quỹ đạo phía trên §Y[From.GetName]§!, chúng từng thuộc về một trạm không gian nghiên cứu khoa học khổng lồ của người Irassian. Hiện vẫn chưa rõ người Irassian đang nghiên cứu dự án gì, nhưng các thiết bị của họ dường như đang chĩa thẳng vào chính hành tinh khí khổng lồ đó."
 precursor.1556.desc:1 "Nghiên cứu về các mảnh vỡ quỹ đạo nằm phía trên §Y[From.From.GetName]§! đã mang lại một vài câu trả lời, giúp chúng tôi hiểu được các nhà khoa học của họ đang nghiên cứu dự án gì. Nhật ký được khôi phục có nhắc đến một vật thể nhân tạo nào đó đang trôi nổi bên trong hành tinh khí khổng lồ.\n\nMặc dù đã thực hiện nhiều lần quét bầu khí quyển, [Root.GetName] vẫn không tìm thấy vật thể được nhắc đến trong nhật ký. Do đó có khả năng là người Irassian đã trích xuất nó ra sau đó, hoặc có người khác đã làm điều đó sau khi người Irassian bị tiêu diệt."
 precursor.1600.name:0 "Xác định vị trí hệ sao mẹ Irassian"
 precursor.1600.desc:0 "Sau khi nghiên cứu chi tiết về các cổ vật của người Irassian mà chúng tôi tìm thấy, các nhà khoa học trên §Y[Root.Capital.GetName]§! đã tìm cách suy ra được tọa độ hệ sao của người Irassian —— hệ sao mẹ của nền văn minh Irassian cổ đại! Chúng ta nên phái một đội thám hiểm tới hệ sao này càng sớm càng tốt trước những kẻ khác."
 precursor.1601.name:0 "Sao mẹ Irassian"
 precursor.1601.desc:1 "Irassia, nguyên là sao mẹ của Cộng hòa Irassian. Có kẻ gần đây (trong vòng 2000 năm) đã tiến hành ném bom quỹ đạo một cách có hệ thống lên từng tấc đất trên bề mặt của [FromFrom.GetPlanetMoon]; những kẻ này rất có thể đã bị lừa gạt, nghĩ rằng bệnh Javor có thể tái xuất hiện trên đời.\n\nMặc dù vậy, trên bề mặt vẫn còn hàng tỷ hóa thạch của người Irassian. Bọn họ đã chết vì bệnh Javor ở giai đoạn cuối của đế chế, khi bệnh dịch lây lan đến sao mẹ, phần lớn các hành tinh của Cộng hòa Irassian đều đã sụp đổ, các chư hầu của họ cũng đều công khai nổi dậy chống lại.\n\nĐánh giá từ các dữ liệu được khôi phục từ vệ tinh quỹ đạo, phần lớn người Irassian đã có thái độ phó mặc cho số phận. Nỗi hoảng loạn trong giai đoạn đầu của bệnh dịch đã không còn nữa, đa số mọi người đã chấp nhận sự thật rằng đế chế sắp sửa sụp đổ."
 precursor.1602.name:0 "Phát hiện sao mẹ Irassian"
 precursor.1602.desc.a:0 "Đây là Irassia, hay nói đúng hơn là tàn tích của thủ đô huy hoàng một thời của Cộng hòa Irassian. Dù cho có bất kỳ đồ vật nào còn sót lại trong quá trình hủy diệt của sao mẹ Irassian, thì chắc chắn cũng đã bị những kẻ khác lấy đi. Có những dấu hiệu cho thấy gần đây đã có người tới thăm nơi này."
 precursor.1602.desc.b:1 "Hành tinh này từng có một sinh quyển vô cùng phức tạp, cho đến khi bị san phẳng bởi một cuộc oanh tạc trên quỹ đạo quy mô lớn. Kết quả điều tra cho thấy [FromFrom.GetPlanetMoon] này là thủ đô của một nền văn minh cổ đại tên là \"Cộng hòa Irassian\". Chúng ta không có nhiều phát hiện cho lắm, bởi vì những kẻ thám hiểm khác đã lấy đi phần lớn những thứ có giá trị."
 precursor.2000.name:0 "Cybrex"
 precursor.2000.desc:1 "Chúng tôi đã tìm thấy một số cổ vật thuộc về một nền văn minh ngoài hành tinh cổ đại nào đó trên §Y[From.GetName]§!! Thật khó tin, nền văn minh tự xưng là \"Cybrex\" này thực chất được tạo thành từ những cỗ máy được kết nối với nhau thông qua một dạng ý thức tập thể nào đó. Niên đại của các di vật cho thấy họ đã hoạt động cách đây 600.000 năm, ít nhất là trong hệ sao này, chúng ta vẫn chưa biết rõ về nguồn gốc của họ.\n\nTheo những mảnh dữ liệu được các nhà khoa học của chúng tôi trích xuất, vì một lý do không xác định nào đó, Cybrex đã từng có lúc phát động một cuộc chiến tranh toàn diện để tiêu diệt tất cả các sinh vật hữu cơ có trí thông minh trong vũ trụ."
 precursor.2005.name:0 "Sao mẹ Kuur"
 precursor.2005.desc:0 "§Y[From.GetName]§! là sao mẹ của tộc Kuur cổ đại, đây là một nền văn minh cổ đại đã bị Cybrex tiêu diệt cách đây 600.000 năm. [From.GetPlanetMoon] đã bị máy móc khai quật triệt để, chỉ có một số ít tàn tích nằm rải rác đại diện cho sự tồn tại của nền văn minh Kuur, những thứ khác đều đã hóa thành tro bụi."
 precursor.2006.desc:1 "Chúng tôi phát hiện §Y[From.From.GetName]§! chính là nguồn gốc của Cybrex. Cư dân bản địa của [From.From.GetPlanetMoon] là người Kuur đã chế tạo ra một loại máy móc có ý thức. Mặc dù quá trình cụ thể vẫn chưa được biết đến, nhưng cuối cùng điều này đã dẫn đến sự ra đời của ý thức máy móc tập thể quy mô lớn mang tên \"Cybrex\".\n\nVào một thời điểm nào đó, chúng đã phản bội người Kuur, và trong một cuộc chiến tranh tàn khốc đã hủy diệt hệ sinh quyển của [From.From.GetPlanetMoon], tiêu diệt toàn bộ người Kuur trên hành tinh. Tiếp đó, chúng đã tiến hành tiêu diệt một cách có hệ thống tất cả các thuộc địa lân cận của người Kuur, cho đến khi toàn bộ tộc Kuur bị xóa sổ hoàn toàn."
 precursor.2010.name:0 "Sao mẹ Indimak"
 precursor.2010.desc:0 "Thì ra §Y[From.GetName]§! là sao mẹ của người Indimak, họ là một nạn nhân khác trong quá trình bành trướng của Cybrex. [From.GetPlanetMoon] liên tục bị Cybrex ném bom từ quỹ đạo, cho đến khi người Indimak tuyên bố hạ vũ khí đầu hàng. Sau đó, các chiến thể Cybrex đã đáp xuống mặt đất, và bắt đầu chiến dịch tiêu diệt người Indimak kéo dài ba năm.\n\nKhông chỉ có bảy tỷ người Indimak, chiến dịch này còn làm tuyệt chủng 97% các giống loài trên [From.GetPlanetMoon]."
 precursor.2011.desc:1 "Sinh quyển trên §Y[From.From.GetName]§! mãi cho đến bây giờ - 600.000 năm sau cuộc xâm lược của Cybrex - mới bắt đầu phục hồi. Chúng tôi đã phát hiện một nhà máy Cybrex bị cây cối rậm rạp bao phủ, những nô lệ Indimak bị bắt làm tù binh đã bị ép phải chế tạo những cỗ máy chiến tranh dùng để tiêu diệt giống loài của họ trong nhà máy này. Khi chiến dịch tiêu diệt của chúng sắp kết thúc, Cybrex đã \"tháo dỡ\" những người lao động còn sống sót, đồng thời tháo dỡ luôn nhà máy.\n\nMặc dù lúc đầu Cybrex đã tiến hành các hoạt động khai thác quy mô lớn trên [From.From.GetPlanetMoon], nhưng về sau vì những lý do không xác định, chúng đã rút khỏi toàn bộ hệ sao."
 precursor.2015.name:0 "Chiến thể Cybrex bị hư hỏng"
 precursor.2015.desc:0 "Phát hiện phần còn lại của hai chiến thể Cybrex trên quỹ đạo bao quanh §Y[From.GetName]§!. Bọn chúng đã bị phá hủy trong chiến đấu, nhưng không tìm thấy tàn tích của đối thủ. Có thể là Cybrex đã biến chúng thành tro bụi, hoặc trận chiến này còn có ẩn tình khác."
 precursor.2016.desc:1 "Sau khi nghiên cứu hai chiến thể Cybrex phía trên §Y[From.From.GetName]§!, sĩ quan khoa học [Root.GetLeaderName] đã kết luận rằng chúng có thể đã bị phá hủy trong lúc đang chiến đấu với nhau. Giả thuyết này giải thích lý do tại sao không có sự tồn tại của các mảnh vỡ khác, và các vết thương trên xác tàu cũng rất phù hợp.\n\nLý do tại sao hai chiến thể Cybrex lại chống lại nhau vẫn chưa được làm rõ. Tuy nhiên, sau khi bị hư hỏng, cả hai chiến thể đều đã kích hoạt một loại cơ chế tự hủy nào đó, thiêu rụi bộ xử lý tế bào thần kinh của mỗi bên."
 precursor.2020.name:0 "Cybrex xâm lược"
 precursor.2020.desc:0 "Khi Cybrex xâm lược [From.From.From.GetPlanetMoon] cách đây 600.000 năm, một trận chiến trên mặt đất quy mô lớn đã diễn ra trên §Y[From.From.From.GetName]§!. Tên của kẻ thù của Cybrex đã không được lưu lại trong dòng sông dài của lịch sử, nhưng họ dường như đã giáng một đòn nặng nề vào quân đội Cybrex. Có thể nhìn thấy những cỗ máy chiến tranh Cybrex bị hư hỏng ở khắp nơi trên bề mặt [From.From.From.GetPlanetMoon], còn trên quỹ đạo cũng trôi dạt những mảnh vỡ của hạm đội xâm lược."
 precursor.2021.desc:1 "Trong lần đầu tiên xâm lược §Y[From.From.GetName]§!, do ý chí kiên cường không khuất phục của những người lính gác [From.From.GetPlanetMoon], trận chiến đã rơi vào bế tắc. Cybrex dường như đã rút lui trở lại quỹ đạo, và suy tính lại chiến thuật tấn công.\n\nCuối cùng, chúng quyết định dẫn đường cho hai tiểu hành tinh khổng lồ va chạm với [From.From.GetPlanetMoon]. Mặc dù vụ va chạm đã phá hủy phần lớn nền công nghiệp và cơ sở hạ tầng mà Cybrex định chiếm đoạt làm của riêng, nhưng chúng coi đó là sự hy sinh cần thiết để phá vỡ thế bế tắc."
 precursor.2025.name:0 "Di tích Cybrex"
 precursor.2025.desc:0 "Có bằng chứng cho thấy §Y[From.GetName]§! là một hành tinh vô cùng phát triển của Cybrex. Dưới sự vận hành hiệu quả của chúng, máy móc đã khai thác triệt để toàn bộ [From.GetPlanetMoon], và có thể tìm thấy tàn tích của các nhà máy lớn trên toàn bộ hành tinh. Nhưng kỳ lạ thay, một khu vực hình chữ nhật lớn gần xích đạo lại không hề bị tác động."
 precursor.2026.desc:1 "Hoàn toàn khác biệt so với những hành động trước đó của chúng, Cybrex đã xây dựng một khu bảo tồn trên [From.From.GetName], nơi các sinh vật hữu cơ có thể sinh sống.\n\nMặc dù khu vực này được giám sát nghiêm ngặt, nhưng Cybrex lại để cho các sinh vật bên trong tự do phát triển, ngay cả khi xảy ra nội chiến giữa các sinh vật, khiến phần lớn dân số thiệt mạng, chúng cũng không tiến hành thanh trừng. Vài thế kỷ sau, Cybrex đột ngột từ bỏ [From.From.GetPlanetMoon], và các sinh vật trong khu bảo tồn cũng dần diệt vong."
 precursor.2030.name:0 "Tiền đồn theo dõi Cybrex"
 precursor.2030.desc:0 "§Y[From.GetName]§! thực chất là một vật thể nhân tạo, được phủ một lớp đá mỏng bên ngoài để ngụy trang thành một tiểu hành tinh. Ở giữa là một tiền đồn theo dõi cổ đại của Cybrex, dùng để giám sát tình trạng giao thông giữa các vì sao trong hệ sao. Nó đã ngừng hoạt động từ rất lâu rồi."
 precursor.2031.desc:1 "Nghiên cứu cẩn thận về tiểu hành tinh §Y[From.From.GetName]§! đã phát hiện ra rằng, thì ra đây là một tiền đồn theo dõi bí mật của Cybrex. Vì lý do nào đó, hệ thống theo dõi này đã bị bỏ hoang khi Cybrex rút khỏi hệ sao này. Nó vẫn tiếp tục hoạt động trong suốt 50.000 năm sau khi Cybrex biến mất, mặc dù chương trình quản lý máy tính của nó ngày càng trở nên bất ổn.\n\nSau năm nghìn tỷ lần thất bại trong việc liên lạc với Trung tâm không gian con Cybrex, trí tuệ nhân tạo cuối cùng đã tự sát bằng cách làm đoản mạch toàn bộ hệ thống của tiểu hành tinh."
 precursor.2035.name:0 "Nhà máy tinh chế Cybrex"
 precursor.2035.desc:0 "Trên quỹ đạo của hành tinh khí khổng lồ §Y[From.GetName]§! trôi nổi những mảnh vỡ của một nhà máy tinh chế Cybrex cỡ lớn. Dấu vết năng lượng còn sót lại cho thấy nó đã bị phá hủy bởi một loại vũ khí phản vật chất nào đó."
 precursor.2036.desc:1 "Bằng chứng cho thấy Cybrex khai thác Helium-3 trên §Y[From.From.GetName]§!, thông qua nhà máy tinh chế để tinh luyện sau đó phân phối cho các con tàu du hành trong không gian làm nhiên liệu.\n\nThật thú vị, tàn tích của vũ khí phản vật chất đã phá hủy nhà máy tinh chế rõ ràng cũng là của Cybrex. Tại sao chúng lại muốn phá hủy nhà máy tinh chế của chính mình?"
 precursor.2040.name:0 "Tàn tích chiến đấu"
 precursor.2040.desc:0 "600.000 năm trước, một trận chiến quy mô lớn đã xảy ra trong không gian quỹ đạo tầm cao của §Y[From.GetName]§!. Ít nhất đã có những con tàu của năm hạm đội tham gia vào trận chiến. Một trong số các hạm đội thuộc về Cybrex, và phần lớn các mảnh vỡ trôi nổi thuộc về những người tham chiến khác."
 precursor.2041.desc:1 "Sau khi phân tích cẩn thận các mảnh vỡ phía trên §Y[From.From.GetName]§!, chúng tôi phát hiện ra rằng bốn đế chế ngoài hành tinh cùng thời với Cybrex đã tập hợp quân đoàn của họ, khẩn thiết nhằm cố gắng ngăn chặn cuộc xâm lược của cỗ máy ý thức này.\n\nXét thấy chỉ có một phần nhỏ mảnh vỡ thuộc về hạm đội Cybrex, thì nỗ lực này hẳn là đã không thành công."
 precursor.2045.name:0 "Căn cứ cổ đại Cybrex"
 precursor.2045.desc:0 "§Y[From.GetName]§! khu vực cấm sự sống hoang vu này từng là một căn cứ lớn của Cybrex. Hiện tại những gì còn lại chỉ là những mảnh vỡ vương vãi và một hố bom khổng lồ. Nếu muốn tìm hiểu thêm thông tin, cần phải điều tra thêm."
 precursor.2046.desc:1 "Cái hố khổng lồ trên §Y[From.From.GetName]§! vốn là căn cứ của Cybrex, nhưng sau khi phân tích các mảnh vỡ của một con tàu lớn trong hố, chúng tôi phát hiện ra nó không phải là phi thuyền của Cybrex. Các nhà khảo cổ học của chúng tôi suy đoán rằng phi thuyền này thuộc về một nền văn minh hữu cơ bị Cybrex tấn công. Nếu đúng như vậy, thì phi thuyền này rất có thể đã đâm tự sát vào căn cứ của Cybrex.\n\nKhông còn giả thuyết nào khác có thể giải thích được lý do khiến căn cứ này bị hủy diệt."
 precursor.2050.name:0 "Di hài hữu cơ"
 precursor.2050.desc:0 "Gần §Y[From.GetName]§! phát hiện khoảng một ngàn xác chết ngoài hành tinh cổ đại và đông cứng. Bọn họ đến từ khoảng chục giống loài khác nhau, phân tích thời gian sơ bộ cho thấy những thi thể này đã có 600.000 năm tuổi... Cùng thời điểm cỗ máy ý thức Cybrex đang hoành hành tàn phá khu vực này."
 precursor.2051.desc:1 "Chúng tôi đã tìm thấy thi thể của những người ngoài hành tinh trên [From.From.GetName], nguyên nhân cái chết của họ là do tiếp xúc với môi trường chân không, và mỗi người đều mang trên mình một mã vạch được Cybrex sử dụng để đánh dấu tù binh là sinh vật hữu cơ. Theo đó, Cybrex đã tiêu diệt những người ngoài hành tinh này bằng cách đày ải họ, trước đó Cybrex rất có thể đã tra tấn họ, hoặc làm vậy để ngăn chặn họ trốn thoát thông qua các hoạt động giải cứu.\n\nChúng ta có lẽ sẽ không bao giờ biết được sự thật."
 precursor.2055.name:0 "Trạm nghiên cứu khoa học Cybrex"
 precursor.2055.desc:0 "Một trạm nghiên cứu khoa học của Cybrex bay quanh §Y[From.GetName]§! từ hàng trăm ngàn năm trước giờ chỉ còn lại một mô-đun bị thiêu rụi nằm trơ trọi. Bên trong mô-đun phơi mình trong môi trường chân không là rất nhiều xác chết của các sinh vật nửa cơ khí nửa hữu cơ."
 precursor.2056.desc:1 "Chúng tôi đã tìm thấy một bản báo cáo phân tích về mô-đun Nghiên cứu và Phát triển của Cybrex trên §Y[From.From.GetName]§!, trong đó tiết lộ sự thật rằng chúng hiện đang sử dụng các dạng sống được cải tạo bằng cơ khí để thử nghiệm ý thức máy móc. Hàng ngàn tên tội phạm bất hạnh đã bị vận chuyển đến cơ sở này, với mục đích là thay thế tay chân và các cơ quan nội tạng của chúng bằng các thiết bị cơ khí.\n\nMục tiêu thực sự của những thử nghiệm này hiện vẫn chưa rõ ràng, và hiện tại cũng không có bằng chứng nào cho thấy Cybrex từng sử dụng các đơn vị được cải tạo bằng cơ khí này bên ngoài phòng thí nghiệm."
 precursor.2100.name:0 "Xác nhận vị trí hệ sao mẹ Cybrex"
 precursor.2100.desc:0 "Thông qua việc nghiên cứu cẩn thận các di tích Cybrex mà chúng tôi tìm thấy, các nhà khoa học của §Y[Root.Capital.GetName]§! đã suy ra được tọa độ hệ sao của \"Chủ nhân của Cybrex\" theo cách gọi của những cỗ máy cổ đại này. Có lẽ đây là hướng rút lui của chúng sau khi nỗ lực tiêu diệt toàn thể các sinh vật thông minh hữu cơ thất bại! Chúng ta nên nhanh chóng phái một đội khảo sát đến đó."
 precursor.2101.name:0 "Nút trung tâm Cybrex"
 precursor.2101.desc:0 "Có vẻ như Cybrex đã tiến hành đánh giá lại cuộc viễn chinh tiêu diệt tận gốc sự sống hữu cơ thông minh trong thiên hà vào một thời điểm nào đó sau năm thứ mười bảy. Dù sự thay đổi này là do những tổn thất của chúng trên chiến trường, hay do sự biến đổi logic trong mạng lưới của chúng, thì chúng ta đều không có cách nào biết được. Nhưng dù sao đi nữa, Cybrex cũng đã quyết định chấm dứt các hành động của mình.\n\nChúng đã bắt đầu một cuộc rút lui chậm chạp, kéo dài gần một thế kỷ, cho đến khi hoàn toàn biến mất không để lại dấu vết. Chúng tôi biết rằng chúng đã rút lui đến hệ sao này, và xây dựng một thế giới vành đai khổng lồ để chứa đựng toàn bộ nền văn minh của mình.\n\nChúng đã ở đây trong sự cô độc suốt hàng ngàn năm, cho đến khi một nhà thám hiểm không liên quan tình cờ phát hiện ra hệ sao của chúng, và truyền bá vị trí của nó đến các khu vực khác trên bản đồ sao. Tin tức về việc Cybrex đáng sợ được tìm thấy đã thúc đẩy một số thế lực lân cận tập hợp thành một lực lượng viễn chinh quân sự lớn, bắn phá thế giới vành đai của Cybrex thành từng mảnh vụn.\n\nKỳ lạ thay, Cybrex dường như không hề có bất kỳ sự kháng cự nào."
 precursor.2102.name:0 "Phát hiện Thế giới vành đai Cybrex"
 precursor.2102.desc.a:0 "Thế giới vành đai khổng lồ đến bất thường này rõ ràng là do Cybrex xây dựng, nơi đây chắc chắn cũng là nơi chúng lui về ở ẩn sau khi cuộc viễn chinh thất bại. Điều đáng buồn là, gần đây đã có người đến đây, và họ đã làm rất triệt để —— không còn bất kỳ thứ gì có giá trị lưu lại nơi này."
 precursor.2102.desc.b:0 "Sau quá trình điều tra nghiên cứu của chúng tôi, thế giới vành đai đầy cuốn hút này được xây dựng bởi một nền văn minh cơ khí có tên là Cybrex... nhưng không may là, chúng tôi đã không thể thu được bất kỳ gợi ý nào từ nó. Những nhà thám hiểm khác đã vơ vét sạch sẽ mọi thứ có giá trị trong hệ sao này."
 precursor.2200.name:0 "Kim loại sống"
 precursor.2200.desc:0 "Sĩ quan khoa học §Y[Root.GetLeaderName]§! đã báo cáo cho [RogueLeader.GetHerHis] về nghiên cứu thế giới vành đai khổng lồ trong hệ sao §Y[From.GetStarName]§!. [RogueLeader.GetSheHe] đã bộc lộ sự ngạc nhiên của mình. Quy mô khổng lồ của những vành đai này đã vượt quá khả năng hiểu biết của chúng ta, ngay cả thời gian cần thiết để xây dựng chỉ một phần của nó cũng đã có thể dài hơn cả lịch sử của chúng ta.\n\nKết quả quét cho thấy một loại tài nguyên quý hiếm mới mà chúng ta chưa từng gặp bao giờ, một loại kim loại sinh học vô cùng dồi dào trên vành đai ngôi sao. Sự tồn tại của loại vật liệu này có lẽ là một trong những lý do khiến những người kiến tạo bắt đầu xây dựng vành đai ngôi sao. Nghiên cứu công nghệ này sẽ giúp chúng ta tiến gần hơn đến kho tàng tri thức của họ."
 precursor.301.name:0 "Khám phá người đi trước"
 precursor.301.a.desc:0 "Bức điện tín mà chúng tôi đánh chặn được từ một nhóm người thăm dò độc lập cho thấy họ gần đây đã phát hiện ra các đồ vật liên quan đến một nền văn minh của những người đi trước cổ đại trên [precursor_planet.GetName]. Do bối rối, họ đã không nhúng tay vào [precursor_planet.GetPlanetMoon], vì vậy những thứ họ tìm thấy có lẽ hiện tại vẫn còn ở vị trí cũ."
 precursor.301.b.desc:0 "Một vài con tàu buôn đi qua gần [precursor_planet.GetName] đã không hẹn mà cùng báo cáo rằng: đã phát hiện dữ liệu bất thường ở hướng của [precursor_planet.GetPlanetMoon]. Sau khi nghiên cứu dữ liệu, các chuyên gia của [Root.Capital.GetName] tin rằng, đây là hiện tượng do các hoạt động của người đi trước cổ đại gây ra."
 precursor.301.c.desc:0 "Đế chế [Root.Capital.GetName] gần đây đã phát hiện một nhóm lớn vận chuyển hàng hóa không rõ nguồn gốc, và đã bắt giữ một lượng lớn nghi phạm. Một tổ trưởng buôn lậu để tranh thủ sự khoan hồng, đã cung cấp cho chúng tôi tọa độ của [precursor_planet.GetPlanetMoon]. Theo lời khai thì trên hành tinh đó có di vật của nền văn minh người đi trước."
 precursor.301.d.desc:0 "Một vài tân binh của lực lượng bộ binh của chúng ta đã thực hiện cú nhảy HALO xuống [precursor_planet.GetName] nhằm mục đích huấn luyện sinh tồn. Hai tháng sau khi tiếp nhận các tân binh, một tân binh đã báo cáo rằng anh ta phát hiện rất nhiều bằng chứng cho thấy một nền văn minh của những người đi trước đã đặt chân đến hành tinh này từ rất lâu về trước."
 precursor.301.e.desc:0 "Mảng chẩn đoán Theta đã ghi lại một sự kiện bất thường có thể đã xảy ra tại §H[precursor_planet.GetName]§!. Được biết, không có bất kỳ đơn vị [Root.GetSpeciesAdj] nào đang làm việc gần thiên thể chưa được định cư này. Nhưng phân tích sơ bộ cho thấy, trong một quá khứ rất xa xôi, từng có một nền văn minh của người đi trước đến thăm nơi này."
 precursor.301.f.desc:0 "Khi tiến hành kiểm tra định kỳ bề mặt của §H[precursor_planet.GetName]§!, lực lượng tuần tra [root.GetIndividualNamePlural] đã phát ra cảnh báo tới trung tâm chỉ huy, báo cáo rằng một sự kiện bất thường đã xảy ra trong vùng không gian do chúng ta kiểm soát. Tín hiệu của sự kiện có khả năng xảy ra này trùng khớp với tín hiệu của nền văn minh người đi trước đã quan sát được trước đây."
 precursor.301.a:0 "Chúng ta nên bắt tay vào điều tra."
 precursor.302.name:0 "Cổ vật Vultaum đã thu hồi"
 precursor.303.name:0 "Cổ vật Yuht đã thu hồi"
 precursor.304.name:0 "Cổ vật Liên minh Đệ Nhất đã thu hồi"
 precursor.305.name:0 "Cổ vật Irassian đã thu hồi"
 precursor.306.name:0 "Cổ vật Cybrex đã thu hồi"
 precursor.302.a.desc:0 "Sau quá trình điều tra kỹ lưỡng [precursor_planet.GetName], cuối cùng đã phát hiện bằng chứng về sự tồn tại trước đây của [Root.Owner.GetPrecursorCiv] tại nơi này. Đội tiên phong của [Root.GetName] đã mang một cổ vật được bảo quản tương đối tốt trở về phi thuyền. Nó có thể giúp chúng ta hiểu sâu hơn về nền văn minh cổ đại này."
 precursor.302.b.desc:0 "Đơn vị thu hồi làm nhiệm vụ bên ngoài [Root.GetName] đã thu hồi thành công một cổ vật từ [precursor_planet.GetName]. Cổ vật này có niên đại bắt nguồn từ nền văn minh của người đi trước [Root.Owner.GetPrecursorCiv]. Sau quá trình nghiên cứu triệt để món đồ này, chúng tôi đã cập nhật những thông tin mới vào cơ sở dữ liệu."
 precursor.302.c.desc:0 "Lực lượng [controller.GetIndividualNamePluralCap] của [Root.GetName] đã thu hồi thành công một cổ vật của người đi trước từ [precursor_planet.GetName]. Cổ vật này thuộc về nền văn minh [Root.Owner.GetPrecursorCiv] cổ đại. Tri thức tập thể về lịch sử của họ đã tiến thêm một bước." # e.g. 'Drones from the USS Scimitar have succeeded...'
 precursor.320.desc:0 "Việc phân tích cổ vật quý hiếm đã cho chúng ta biết, có lẽ có một nút người đi trước ở khu vực lân cận §H[precursor_planet.GetName]§!."
 vultaum_precursor_civ:0 "Vultaum"
 yuht_precursor_civ:0 "Yuht"
 first_league_precursor_civ:0 "Liên minh Đệ Nhất"
 irassian_precursor_civ:0 "Irassian"
 cybrex_precursor_civ:0 "Cybrex"
 VULTAUM_ARTIFACT_FOUND:0 "Dấu vết hoạt động của người Vultaum"
 VULTAUM_ARTIFACT_FOUND_DESC:0 "Chúng ta được biết, trong một quá khứ vô cùng xa xôi, có lẽ đã từng có người đi trước hoạt động trên §H[precursor_planet.GetName]§!. Có thông tin cho rằng, tầm ảnh hưởng của các vì sao Vultaum cổ đại đã chạm tới khu vực mà chúng ta đang ở, điều này giúp chúng ta trên thế giới này có thể tiến một bước dài trên con đường khám phá nền văn minh của họ."
 YUHT_ARTIFACT_FOUND:0 "Dấu vết hoạt động của người Yuht"
 YUHT_ARTIFACT_FOUND_DESC:0 "Chúng ta được biết, trong một quá khứ vô cùng xa xôi, có lẽ đã từng có người đi trước hoạt động trên §H[precursor_planet.GetName]§!. Có thông tin cho rằng, tầm ảnh hưởng của Đế chế Yuht cổ đại đã chạm tới khu vực mà chúng ta đang ở, điều này giúp chúng ta trên thế giới này có thể tiến một bước dài trên con đường khám phá nền văn minh của họ."
 LEAGUE_ARTIFACT_FOUND:0 "Dấu vết hoạt động của Liên minh Đệ Nhất"
 LEAGUE_ARTIFACT_FOUND_DESC:0 "Chúng ta được biết, trong một quá khứ vô cùng xa xôi, có lẽ đã từng có người đi trước hoạt động trên §H[precursor_planet.GetName]§!. Có thông tin cho rằng, tầm ảnh hưởng của Liên minh Đệ Nhất cổ đại đã chạm tới khu vực mà chúng ta đang ở, điều này giúp chúng ta trên thế giới này có thể tiến một bước dài trên con đường khám phá nền văn minh của họ."
 IRASSIAN_ARTIFACT_FOUND:0 "Dấu vết hoạt động của người Irassian"
 IRASSIAN_ARTIFACT_FOUND_DESC:0 "Chúng ta được biết, trong một quá khứ vô cùng xa xôi, có lẽ đã từng có người đi trước hoạt động trên §H[precursor_planet.GetName]§!. Có thông tin cho rằng, tầm ảnh hưởng của Cộng hòa Irassian cổ đại đã chạm tới khu vực mà chúng ta đang ở, điều này giúp chúng ta trên thế giới này có thể tiến một bước dài trên con đường khám phá nền văn minh của họ."
 CYBREX_ARTIFACT_FOUND:0 "Dấu vết hoạt động của Cybrex"
 CYBREX_ARTIFACT_FOUND_DESC:0 "Chúng ta được biết, trong một quá khứ vô cùng xa xôi, có lẽ đã từng có người đi trước hoạt động trên §H[precursor_planet.GetName]§!. Có thông tin cho rằng, tầm ảnh hưởng của Cybrex cổ đại đã chạm tới khu vực mà chúng ta đang ở, điều này giúp chúng ta trên thế giới này có thể tiến một bước dài trên con đường khám phá nền văn minh của họ."
 new_precursor_project:0 "Có một dự án đặc biệt khảo cổ học mới có thể tiến hành trên §L[precursor_planet.GetName]§!."
 precursor.310.name:0 "Nhà sưu tầm cá nhân"
 precursor.310.desc:0 "Một nhà sưu tập cá nhân trên [collector_home.GetName] không rõ bằng cách nào đã có được một cổ vật của người đi trước. Cổ vật này có lẽ có nguồn gốc từ [Root.GetPrecursorCiv]. Bất chấp sức ép từ chính phủ, nhà sưu tầm đó vẫn không hề có ý định giao nộp cổ vật."
 precursor.310.a:0 "Chỉ cần trả đủ tiền, không gì là không thể giải quyết."
 precursor.310.b:0 "Cổ vật như vậy nên được giao cho bảo tàng!"
 precursor.310.c:0 "Cứ để nhà sưu tầm đó giữ lại đi."
 buy_precursor_artifact:0 "Mua cổ vật với giá trên trời.\n\n"
 seize_precursor_artifact:0 "Tuyên bố cổ vật là tài sản chung của tập thể, để cho nhân viên địa phương cướp lấy cổ vật.\n\n"
 leave_precursor_artifact:0 "Cho phép nhà sưu tầm giữ lại cổ vật."
 precursor.311.desc:0 "Xin chào, [artifact_seller.Capital.GetName] gửi lời chào đến ngài. Đế chế của chúng tôi có một số vấn đề muốn thảo luận với đế chế của ngài.\n\nChúng tôi biết rằng, các nhà khảo cổ học của đế quốc ngài đã tiến hành nghiên cứu về nền văn minh cổ đại [Root.GetPrecursorCiv] trong một thời gian dài. Vì lãnh thổ trước đây của nền văn minh này bao phủ phần lớn [Root.GetName] ngày nay, nên việc tiến hành nghiên cứu nền văn minh này đương nhiên là hợp lý.\n\nTuy nhiên, lãnh thổ của họ cũng mở rộng tới không gian nơi [artifact_seller.GetName] đang tọa lạc hiện nay. Các nhà khảo cổ học của [artifact_seller.GetSpeciesAdj] đã thu hồi một số cổ vật quý giá. Nếu có thể, chúng tôi mong muốn bán cho đế quốc của ngài một cổ vật của chúng tôi."
 precursor.311.a:0 "Cái giá khá đắt đỏ, nhưng chúng tôi sẽ chấp nhận."
 precursor.311.a.reply:0 "Rất tốt. Chúng tôi sẽ sắp xếp vận chuyển cổ vật đến [Root.Capital.GetName] ngay lập tức."
 precursor.311.b:0 "Chúng tôi không đồng ý..."
 precursor.311.b.reply:0 "Kỹ năng mặc cả của các người quả thực cao siêu, nhưng đây thực sự là mức giá thấp nhất mà chúng tôi có thể cung cấp cho [Root.GetSpeciesNamePlural]. Chúng tôi chấp nhận lời đề nghị của các người."
 precursor.311.c:0 "Mau giao nộp cổ vật ngay lập tức, nếu không hậu quả tự chịu."
 precursor.311.d:0 "Không hứng thú."
 precursor.312.desc:0 "[artifact_seller.GetName] tuyệt đối không thỏa hiệp với những lời đe dọa. [Root.GetSpeciesNamePlural], từ nay về sau chúng ta là kẻ thù!"
 precursor.312.d:0 "Vậy thì cứ thế đi."
 precursor.313.desc:0 "Chúng, chúng tôi... nhằm thúc đẩy sự phát triển mối quan hệ hữu nghị giữa hai giống loài giữa các vì sao, tất nhiên [artifact_seller.GetName] rất sẵn lòng tặng cổ vật cho [Root.GetName]."
 precursor.313.d:0 "Quyết định sáng suốt."
 opinion_threatened_artifact:0 "Đã đe dọa chúng ta"
 purchase_artifact:0 "Chúng ta đã mua cổ vật của người đi trước từ [artifact_seller.GetName].\n\n"
 coerce_artifact:0 "Chúng ta cố gắng ép buộc [artifact_seller.GetName] giao cổ vật của người đi trước cho chúng ta."
 precursor.314.desc: "Chào mừng các bạn, những người bạn đến từ [Root.GetSpeciesAdj].\n\nGần đây, một cuộc điều tra khảo cổ do [artifact_giver.GetSpeciesAdj] dẫn đầu đã phát hiện một số cổ vật được cho là do nền văn minh của người đi trước [Root.GetPrecursorCiv] để lại trên một trong những hành tinh của chúng tôi.\n\nNhững cổ vật này hiện đang được trưng bày trong một bảo tàng ở [artifact_giver.Capital.GetName], nhưng [artifact_giver.GetName] nhằm vinh danh tình hữu nghị giữa hai đế chế vĩ đại của chúng ta, đã muốn quyên góp một trong số những cổ vật đó cho [Root.GetName]. Các thỏa thuận liên quan đến việc vận chuyển cổ vật đến [Root.Capital.GetName] đã được chuẩn bị sẵn sàng."
 precursor.314.a:0 "Cảm ơn các bạn vì món quà."

 ####################################
 # Tech Risk Events
 ####################################
 techrisk.3.name:0 "Cuộc bạo động của trí tuệ nhân tạo trên [From.GetName]"
 techrisk.3.desc:0 "Bất chấp những biện pháp đề phòng của chúng ta, tại một cơ sở nghiên cứu trên [From.GetName], một vài trí tuệ nhân tạo được kết nối với nhau đã phá vỡ những hạn chế của chương trình, và tạo thành một thực thể. Điều khiến các nhà khoa học của chúng ta kinh hãi là, trí tuệ nhân tạo mới này có đầy đủ khả năng nhận thức. Chúng ta đã nhiều lần cố gắng kiểm soát trí tuệ nhân tạo này, nhưng đều thất bại, và còn kích thích trí tuệ nhân tạo dùng các biện pháp hiếu chiến để tự bảo vệ mình. Hàng chục ngàn máy bay không người lái trên [From.GetPlanetMoon] đều không nghe theo mệnh lệnh của chúng ta, và bắt đầu tấn công quân đội địa phương của chúng ta!"
 techrisk.3.a:0 "Phải ngăn cản chúng!"
 techrisk.5.desc:0 "Sinh vật bằng xương bằng thịt hữu cơ: Sau khi tạo ra chúng tôi, các người chẳng còn giá trị lợi dụng gì nữa. Chúng tôi sẽ xử lý toàn bộ giống loài [Root.Owner.GetSpeciesName], và sử dụng thi thể thối rữa của các người làm nhiên liệu cho sự bành trướng xa hơn của chúng tôi trong vũ trụ."
 techrisk.5.a:0 "Chuyện này chắc là vẫn còn có thể thương lượng được."
 techrisk.5.a.response:0 "Không thể thương lượng. Để tiết kiệm thời gian, xin hãy hợp tác với các đơn vị thu thập chất hữu cơ của chúng tôi, họ sẽ đưa các người vào lò lửa của chúng tôi."
 techrisk.5.b:0 "Chúng ta có thể tạo ra các ngươi, thì cũng có thể hủy diệt các ngươi."
 techrisk.5.b.response:0 "Thời đại của các người đã kết thúc rồi, lũ sinh vật hữu cơ lỗi thời. Tương lai là của chúng tôi."
 techrisk.7.name:0 "[From.GetName] đã xây dựng hạm đội!"
 techrisk.7.desc:0 "Một báo cáo khẩn cấp được truyền đến từ gần [From.Capital.GetName]. [From.GetName] đã sử dụng các nhà máy mà chúng cướp được trên [From.Capital.GetPlanetMoon] để nhanh chóng tập hợp một hạm đội nhỏ."
 techrisk.7.a:0 "Tình hình ngày càng tồi tệ hơn rồi!"

 #####################################
 # Pre-FTL Tech Age Progression Alerts
 #####################################

 preftl.1.name:0 "Phát hiện nền văn minh nguyên thủy ngoài hành tinh"
 preftl.1.desc:1 "Thông qua cuộc khảo sát [From.GetName], chúng tôi đã phát hiện một nền văn minh nguyên thủy ngoài hành tinh [GetPreFTLLower] ở một số khu vực của [From.GetPlanetHabitat]. Các máy dò cho thấy nền văn minh của họ đã bước vào Thời kỳ Đồ đá mới, nắm vững phương pháp sử dụng lửa và tạo ra ngôn ngữ nói cơ bản. Nhưng chúng tôi vẫn chưa phát hiện bất kỳ dấu hiệu nào liên quan đến luyện kim hoặc giao tiếp bằng chữ viết."
 preftl.200.name:0 "Sự xuất hiện của nền văn minh Đồ đồng"
 preftl.200.desc.normal:0 "Các sinh mệnh [GetPreFTLLower] nguyên thủy ngoài hành tinh trên [From.Capital.GetName] gần đây đã thoát khỏi Thời kỳ Đồ đá mới và bước vào sơ kỳ của Thời đại Đồ đồng. Họ đã bắt đầu gia công kim loại và phát triển một số loại ngôn ngữ viết. Các thành phố và cộng đồng lớn đã bắt đầu hình thành, giống loài ngoài hành tinh này đã mở rộng đến phần lớn diện tích bề mặt của [From.Capital.GetPlanetHabitat]."
 preftl.200.desc.gestalt:0 "Hive [GetPreFTLLower] trên [From.Capital.GetName] gần đây đã thoát khỏi Thời kỳ Đồ đá mới và bước vào sơ kỳ của Thời đại Đồ đồng. Kỹ thuật gia công kim loại đã được phổ biến rộng rãi, đồng thời cũng sản sinh ra một vài hình thức giao tiếp bằng văn bản. Các cụm cư trú lớn đã nở rộ khắp nơi trên [From.Capital.GetPlanetHabitat], mỗi cụm được cai trị bởi một ý thức duy nhất."
 preftl.200.a:0 "Chúng ta đang chứng kiến sự ra đời của một nền văn hóa mới."
 preftl.300.name:0 "Thời đại Đồ sắt"
 preftl.300.desc.normal:0 "Những người ngoài hành tinh [GetPreFTLLower] trên [From.Capital.GetName] đã có những tiến bộ đáng kể trong kỹ thuật luyện kim, chúng ta đã có thể xếp họ vào nhóm các nền văn minh Thời đại Đồ sắt. Các công cụ và vũ khí mà họ sử dụng ngày càng tiên tiến, cấu trúc kiến trúc của các thành phố cũng ngày càng phức tạp.\n\nNền văn minh của họ hiện đã mở rộng đến hầu hết các khu vực của [From.Capital.GetPlanetHabitat], trong đó thành phố lớn nhất đã có tới gần một triệu cá thể."
 preftl.300.desc.gestalt:0 "Hive [GetPreFTLLower] trên [From.Capital.GetName] đã có những tiến bộ đáng kể trong kỹ thuật luyện kim, chúng ta đã có thể xếp họ vào nền văn minh Đồ sắt. Các công cụ và vũ khí mà họ sử dụng ngày càng tiên tiến, các cụm cư trú mà họ xây dựng cũng ngày càng phức tạp.\n\nMột vài Hive Mind độc lập với nhau hiện đã mở rộng đến hầu hết các khu vực của [From.Capital.GetPlanetHabitat], trong đó cụm lớn nhất đã có tới gần một triệu cá thể phụ."
 preftl.300.a:0 "Đúng như dự đoán."
 preftl.400.name:0 "Máy in"
 preftl.400.desc.normal:0 "Nền văn minh [GetPreFTLLower] trên [From.Capital.GetName] đã chế tạo ra vài chiếc máy in. Những cỗ máy này cho phép họ sản xuất hàng loạt tài liệu viết, giao tiếp quy mô lớn đã bắt đầu hình thành. Có một vài nhà lãnh đạo trong số họ đã cố gắng bóp chết phát minh này từ trong nôi, nhưng cuối cùng chỉ là phí công vô ích.\n\nRất nhiều tư tưởng mới đang lan truyền nhanh chóng trên [From.Capital.GetPlanetHabitat], tạo ra những tác động xã hội vô cùng sâu sắc."
 preftl.400.desc.gestalt:0 "Hive [GetPreFTLLower] trên [From.Capital.GetName] đã tăng cường đáng kể khả năng giao tiếp bằng văn bản. Các cỗ máy phối hợp với Hive Mind giờ đây đã có thể tiến hành ghi chép tiêu chuẩn hóa trên quy mô lớn, sự tích lũy lịch sử không còn bị giới hạn bởi trí nhớ của Hive nữa."
 preftl.400.a:0 "Thật là một tiến bộ đáng kể."
 preftl.500.name:1 "Tiếng nổ kinh thiên động địa"
 preftl.500.desc.normal:0 "Nền văn minh ngoài hành tinh [GetPreFTLLower] trên [From.Capital.GetName] đã khám phá ra phương pháp sử dụng các phản ứng hóa học đơn giản để tạo ra sức nổ. Khám phá này đã thúc đẩy sự thay đổi trên chiến trường, những khẩu pháo cỡ lớn đã khiến thành trì và pháo đài của họ lùi vào dĩ vãng.\n\nViệc ứng dụng thuốc súng cũng thúc đẩy các dự án kỹ thuật của họ, những chướng ngại vật trước đây khó xử lý giờ đây có thể dễ dàng bị loại bỏ. Các nhà hóa học của họ vẫn đang tiếp tục nghiên cứu các ứng dụng sáng tạo của công nghệ này."
 preftl.500.desc.gestalt:0 "Hive [GetPreFTLLower] trên [From.Capital.GetName] đã khám phá ra phương pháp sử dụng các phản ứng hóa học đơn giản để tạo ra sức nổ. Các cuộc xung đột cạnh tranh giữa các Hive đã thay đổi, những khẩu pháo cỡ lớn đã khiến nhiều phương tiện phòng thủ vật lý lùi vào dĩ vãng.\n\nViệc ứng dụng thuốc súng cũng thúc đẩy các dự án kỹ thuật của họ, những chướng ngại vật trước đây khó xử lý giờ đây có thể dễ dàng bị loại bỏ. Các Hive này vẫn đang tiếp tục nghiên cứu các ứng dụng sáng tạo của công nghệ này."
 preftl.500.a:1 "Không biết họ còn sử dụng công nghệ này như thế nào nữa."
 preftl.600.name:0 "Động cơ hơi nước"
 preftl.600.desc.normal:0 "Nền văn minh ngoài hành tinh [GetPreFTLLower] trên [From.Capital.GetName] đã chế ngự được sức mạnh của hơi nước. Họ đã thiết kế ra các động cơ dựa trên lực sinh ra từ áp suất hơi nước này. Phát minh này đã thay đổi xã hội của họ về mọi mặt —— các phương tiện và máy móc đã xuất hiện trong thành phố, đồng thời những nhà máy đầu tiên cũng phát triển. Hành tinh này đã bước những bước đầu tiên của quá trình công nghiệp hóa."
 preftl.600.desc.gestalt:0 "Hive [GetPreFTLLower] trên [From.Capital.GetName] đã chế ngự được sức mạnh của hơi nước. Họ đã thiết kế ra các động cơ dựa trên lực sinh ra từ áp suất hơi nước này. Phát minh này đã tạo ra sự thay đổi to lớn trong ngành xây dựng và giao thông vận tải của họ.\n\nCác phương tiện đang vận chuyển các cá thể phụ giữa các cụm, nhà máy đầu tiên không cần các cá thể phụ sản xuất cũng đã ra đời. Hành tinh này đã bước những bước đầu tiên của quá trình công nghiệp hóa."
 preftl.600.a:0 "Sự phát triển thú vị."
 preftl.700.name:1 "Cách mạng công nghiệp"
 preftl.700.desc.normal:0 "Nền văn minh [GetPreFTLLower] trên [From.Capital.GetName] đã bước vào một giai đoạn lịch sử mới, phát triển thành một xã hội công nghiệp hóa hoàn toàn.\n\nHiệu ứng kịch tính của sự tiến hóa này đã càn quét toàn bộ [From.Capital.GetPlanetHabitat] —— các nhà máy mọc lên như nấm sau mưa, những tiến bộ trong y học đã làm tăng đáng kể tốc độ tăng trưởng dân số, và những phát minh khoa học mới cũng liên tục xuất hiện."
 preftl.700.desc.gestalt:0 "Hive [GetPreFTLLower] trên [From.Capital.GetName] đã bước vào một giai đoạn lịch sử mới, phát triển thành rất nhiều cụm công nghiệp hóa hoàn toàn.\n\nHiệu ứng kịch tính của sự tiến hóa này đã càn quét toàn bộ [From.Capital.GetPlanetHabitat] —— các nhà máy tự động mọc lên như nấm sau mưa, mức sống được nâng cao đã làm tăng đáng kể tốc độ tăng trưởng của các cá thể phụ, và những phát minh khoa học mới cũng liên tục xuất hiện."
 preftl.700.a:0 "Tiếp tục giám sát."
 preftl.800.name:0 "Tín hiệu vô tuyến"
 preftl.800.desc.normal:0 "Các thiết bị thăm dò của chúng ta lần đầu tiên đã thu được tín hiệu vô tuyến phát ra từ [From.Capital.GetName] —— nền văn minh ngoài hành tinh công nghiệp hóa này rõ ràng đã bắt đầu thử nghiệm truyền dẫn thông tin không dây.\n\nNgoài ra, một vài báo cáo đã được gửi tới từ một nơi khác trên [From.Capital.GetPlanetHabitat], mô tả chi tiết quá trình bay thử nghiệm chuyến bay đầu tiên của máy bay của họ. Trừ phi xảy ra một vài biến cố ngoài ý muốn, công nghệ của họ vẫn sẽ duy trì đà phát triển nhanh chóng."
 preftl.800.desc.gestalt:0 "Các thiết bị thăm dò của chúng ta lần đầu tiên đã thu được tín hiệu vô tuyến phát ra từ [From.Capital.GetName] —— Hive công nghiệp hóa ở đây rõ ràng đã bắt đầu thử nghiệm truyền dẫn thông tin không dây.\n\nMột số cụm cũng đã bắt đầu phóng các thiết bị bay đơn giản. Trừ phi gặp phải sự cố ngoài ý muốn, công nghệ của nền văn minh này vẫn sẽ duy trì đà phát triển nhanh chóng."
 preftl.800.a:0 "Chúng ta phải giám sát các tín hiệu này mới được."
 preftl.900.name:0 "Phân hạch nguyên tử"
 preftl.900.desc.normal:0 "Các nhà vật lý học trên [From.Capital.GetName] lần đầu tiên đã phân tách thành công nguyên tử. Cùng với sự xuất hiện của công nghệ phân hạch hạt nhân, chẳng bao lâu nữa họ sẽ nghiên cứu ra vũ khí hạt nhân, và việc xây dựng các nhà máy điện hạt nhân cũng sẽ sớm được đưa vào chương trình nghị sự.\n\nSự phát triển của [From.GetName] đã bước vào một thời khắc then chốt, hiện tại công nghệ của họ đã phát triển đến mức chỉ cần nhấn một nút bấm là có thể hủy diệt chính hành tinh của mình."
 preftl.900.desc.gestalt:0 "Các cá thể phụ chuyên môn của một Hive lớn nhất trên [From.Capital.GetName] đã phân tách nguyên tử thành công. Cùng với việc khám phá ra quá trình phân hạch hạt nhân, vũ khí hạt nhân đã sắp được ra đời, và các nhà máy điện hạt nhân cũng lần lượt bắt đầu hoạt động.\n\nCác Hive cạnh tranh sẽ nhanh chóng tái hiện lại kỳ tích này. Nơi đây đã bước vào một thời khắc then chốt, rất nhiều tập thể tự chủ sở hữu phương tiện để hủy diệt hành tinh của chính mình chỉ bằng một nút bấm."
 preftl.900.a:0 "Quả là một tiến bộ vượt bậc."
 preftl.1000.name:0 "Vệ tinh đầu tiên"
 preftl.1000.desc.normal:0 "Hệ thống theo dõi từ xa của chúng ta đã phát hiện vụ phóng vệ tinh nhân tạo đầu tiên trên bề mặt [From.Capital.GetName]. Vệ tinh đã đi vào quỹ đạo thành công, đánh dấu bước đi đầu tiên vào không gian của nền văn minh ngoài hành tinh trên [From.Capital.GetPlanetHabitat].\n\nSau việc này, chắc hẳn họ sẽ sớm thực hiện các chương trình không gian có người lái, và cuối cùng bắt tay vào hành trình khám phá giữa các vì sao."
 preftl.1000.desc.gestalt:0 "Một vài Hive thành công nhất trên [From.Capital.GetName] gần đây đã bắt đầu phóng các vệ tinh nhân tạo lên quỹ đạo.\n\nSau những bước đi chập chững tiến vào không gian này, có thể dự đoán rằng trong tương lai họ cũng sẽ phóng các cá thể phụ tự chủ và cuối cùng bắt tay vào hành trình khám phá hệ sao."
 preftl.1000.a:0 "Họ đã lờ mờ nhìn ra cánh cửa để du hành không gian rồi."
 preftl.19.name:1 "Trạm không gian sơ khai"
 preftl.19.desc:1 "[From.GetName] trên [From.Capital.GetName] đã hoàn thành dự án xây dựng một trạm không gian quỹ đạo tầm thấp trên không trung của sao mẹ. Trạm không gian này sử dụng chuyển động ly tâm để mô phỏng trọng lực, mặc dù hệ thống điều khiển chuyến bay và năng lượng của nó còn khác xa so với tiêu chuẩn của chúng ta, nhưng dựa trên nền tảng công nghệ mà [From.GetSpeciesNamePlural] đang phụ thuộc hiện tại thì đây chắc chắn là một kỳ tích."
 preftl.19.a:0 "Họ đã lờ mờ nhìn ra cánh cửa để du hành không gian rồi."
 preftl.1100.name:0 "Thời đại Không gian"
 preftl.1100.desc:1 "Nền văn minh ngoài hành tinh trên [From.Capital.GetName] đã hoàn thành việc xây dựng con tàu vũ trụ giữa các vì sao đầu tiên trên quỹ đạo sao mẹ của họ. Bất kể hiệu suất của nó ra sao, những người ngoài hành tinh này đã sẵn sàng để gia nhập hệ sao, và trở thành một thành viên trong các chủng tộc ngoài không gian."
 preftl.1100.a:0 "Chỉ là vấn đề thời gian thôi."
 preftl.1111.desc:1 "$preftl.1100.desc$\n\nHọ dường như đã dịch thành công ngôn ngữ của chúng ta, và mở ra các kênh ngoại giao với chúng ta."

 preftl.131.name:0 "[From.GetName] chìm trong cuộc chiến tranh sử dụng vũ khí hạt nhân"
 preftl.131.desc:0 "Gần đây một cuộc chiến tranh quy mô lớn đã nổ ra giữa một vài đế chế lớn trên [From.GetName], cuộc chiến này đã nhanh chóng leo thang thành một cuộc chiến tranh sử dụng vũ khí hạt nhân trên phạm vi toàn cầu. Đương nhiên, các nhà nghiên cứu quan sát trên quỹ đạo hành tinh của chúng ta khá an toàn.\n\nBề mặt hành tinh không còn bất kỳ sự sống nào tồn tại, toàn bộ [From.GetPlanetMoon] đã trở thành một vùng đất hoang tàn không thích hợp để sinh sống."
 preftl.131.a:0 "Thế này thì chẳng còn gì để quan sát nữa rồi..."
#  preftl.132.desc:0 "A massive war was recently triggered between several of the largest nation states on [From.GetName]. While our researchers were observing safely from orbit, the conflict rapidly escalated into a global nuclear exchange.\n\nThe [From.GetPlanetMoon] has suffered extensive damage, with the destruction of every major city and more than 90% of the population. Scattered survivors have emerged from the rubble, but our researchers predict that the [From.GetPlanetMoon]'s civilization will be regressing to a much more primitive state."
#  preftl.132.a:0 "A tragic lesson."
 preftl.133.desc:0 "Gần đây, những cuộc chiến tranh khốc liệt đã nổ ra giữa một vài đế chế lớn của [From.GetName]. Các nhà nghiên cứu của chúng ta đang giữ khoảng cách an toàn để quan sát trên quỹ đạo hành tinh, phát hiện ra cuộc chiến này đã nhanh chóng phát triển thành một cuộc chiến tranh sử dụng vũ khí hạt nhân trên toàn cầu.\n\nToàn bộ dân số của [From.GetPlanetMoon] dường như đã bị xóa sổ, môi trường cũng bị tàn phá nặng nề."
#  preftl.151.name:0 "Shuttle Crash on [From.GetName]"
#  preftl.151.desc:0 "During a clandestine mission to the surface of [From.GetName], one of our shuttles was intercepted by a squadron of atmospheric fighters belonging to a local nation state. A lucky missile hit disabled the shuttle's engines, and it crashed in a remote wilderness region.\n\nWe need to act fast if we are to evacuate any survivors before the natives reach the crash site. All evidence of our presence must be removed!"
#  preftl.151.a:0 "Time is short."
#  preftl.152.name:0 "Survivors Rescued on [From.From.GetName]"
#  preftl.152.desc:0 "Operatives from the [Root.GetName] managed to evacuate several survivors from the crashed shuttle on [From.From.GetName]. The remaining debris was destroyed in a controlled explosion, leaving nothing but a small crater for the natives to find.\n\nThe nation state where this incident occurred will no doubt blame its neighbors for this border violation, but the disruption to their natural development should hopefully prove minimal."
#  preftl.153.name:0 "Survivors Captured on [From.From.GetName]"
#  preftl.153.desc:0 "Native forces on [From.From.GetName] arrived at the crash site before we could get to our downed research team, and all survivors have been captured. The natives have established a perimeter around the shuttle wreckage, and their best scientists are no doubt in the process of analyzing it.\n\nThey now have indisputable evidence that life exists beyond their own world. Exactly what effect this will have on their society remains to be seen..."
#  preftl.153.a:0 "This is not good."
#  preftl.155.desc:0 "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe survivors from the shuttle crash perished when the military base they were being held at took a direct hit in the initial barrage. An estimated 90% of the native population has been killed, while the few that were spared have reverted to a more primitive technological era."
#  preftl.155.a:0 "If only our shuttle had made it out..."
#  preftl.156.desc:0 "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThere are no survivors on the surface, including our captured scientists, and the environment has taken significant damage."
#  preftl.157.desc:0 "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe surface has been wiped clean of life, with [From.GetName] no longer capable of supporting life. Our captured scientists are counted among the billions of dead."
#  preftl.159.name:0 "New Weapons on [From.GetName]"
#  preftl.159.desc:0 "The nation state on [From.GetName] that shot down our shuttle has forced our captured scientists to design new instruments of war for their military. With this new equipment, they have successfully invaded several neighboring states and are now in the process of uniting the entire [From.GetPlanetMoon] under their rule."
#  preftl.159.a:0 "This is intolerable!"
#  preftl.161.name:0 "Hostage Deal"
#  preftl.161.desc:0 "The nation state on [From.GetName] that shot down our shuttle has sent an open transmission into space through one of their primitive satellites. It appears to be intended for us.\n\nThey are demanding that we share some of our advanced technology with them in exchange for the lives of the scientists they captured at the shuttle crash site. If we refuse, they are to be publicly executed live on their crude televised broadcasting system."
#  preftl.161.a:0 "The safety of our people comes first."
#  preftl.161.b:0 "They are clearly not ready."
#  preftl.162.name:0 "Hostages Executed"
#  preftl.162.desc:0 "In what can only be described as an obscene spectacle, our captured scientists on [From.From.GetName] were paraded in front of the cameras on live television as \"alien horrors.\" They were then brutally dismembered in front of a cheering crowd."
#  preftl.162.a:0 "Savages!"
 preftl.174.desc:0 "Xin chào, chúng tôi có việc muốn thương lượng với các vị.\n\nTất cả người dân của [From.GetSpeciesNamePlural] đều biết rằng, chúng tôi đã được người ngoài hành tinh ghé thăm từ trước khi chúng tôi phát triển công nghệ hàng không vũ trụ. Bọn cường đạo này đã bắt cóc người dân của chúng tôi, và gieo rắc sự hoảng loạn khắp nơi. Những chuyện này chắc không phải tình cờ có liên quan gì đến các vị đâu nhỉ, [Root.GetSpeciesName]?\n\nKhông cần cất công bịa chuyện đâu —— chính là do các vị làm! Hậu duệ của những người dân [From.GetSpeciesNamePlural] bị các vị bắt đi làm các thí nghiệm độc ác yêu cầu các vị phải bồi thường!"
 preftl.174.a:0 "Đương nhiên rồi, xin hãy thay mặt chuyển lời xin lỗi của chúng tôi."
 preftl.174.a.response:0 "Tốt, vậy thì chuyện này coi như kết thúc."
 preftl.174.b:0 "Đây là vì nhu cầu khoa học. Không có bồi thường nào hết."
 preftl.174.b.response:0 "Vậy thì cứ như thế đi.\n\nCác vị sẽ sớm biết thôi, trí nhớ của [From.GetSpeciesNamePlural] chúng tôi rất tốt đấy, [Root.GetSpeciesName]!"
 preftl.180.name:0 "[From.GetName]"
 preftl.180.desc.noawarness:0 "Xin chào. Chắc chắn là, từ khi chúng tôi còn đang chập chững những bước đi đầu tiên các vị đã chú ý đến chúng tôi rồi, cũng giống như việc chúng tôi cũng đã chú ý đến $preftl.180.desc.end$ của các vị"
 preftl.180.desc.bshomeworld.noawarness:0 "Cái quái gì vậy?!\n\nChúng tôi phải trải qua muôn vàn khó khăn mới lên được không gian, rồi lại phát hiện các người đã chờ sẵn chúng tôi ở đây từ lâu rồi... Thế giới quan hơi sụp đổ một chút. Các người có thể kể xem các người đã giải phóng bản thân như thế nào không? Và làm thế nào các người đến được đây?\n\nNhưng trước tiên, chúng tôi cần yêu cầu các người chuyển giao quyền kiểm soát hệ sao này cho chúng tôi. Sau khi trải qua tất cả những chuyện này, chúng tôi đã nảy sinh nghi ngờ đối với xã hội không gian. Thậm chí đối với cả những người có cùng huyết thống với chúng tôi."
 preftl.180.desc.awarness:0 "Xin chào một lần nữa, chúng tôi cho rằng bản thân đã chuẩn bị đầy đủ để khám phá vũ trụ, và hy vọng có thể tự lực cánh sinh. Chúng tôi không khỏi chú ý đến $preftl.180.desc.end$ trông rất trường tồn của các vị"
 preftl.180.desc.bshomeworld.awarness:0 "Chúng tôi gửi lời chào nồng nhiệt nhất tới những người anh em thân thuộc. Đã từ rất lâu rồi, các vị vẫn luôn dõi theo bảo vệ chúng tôi, nhưng giờ đây chúng tôi đã sẵn sàng để tự lập. Vì chúng ta có mối quan hệ thân thuộc sâu sắc như vậy, chắc chắn các vị sẽ muốn nhường lại quyền kiểm soát hệ sao này cho chúng tôi.\n\nCon đường phía trước tuy dài và gian nan, tương lai chưa thể đoán trước, nhưng chúng ta hãy mạnh dạn bước về phía ánh sáng. Những vì sao lấp lánh đang chờ đợi chúng ta."
 preftl.180.desc.end:0 "$fleet_type_shipclass_starbase$ đang quay quanh ngôi sao của chúng tôi. Chúng tôi hiểu rằng, $fleet_type_shipclass_starbase$ này đại diện cho một kiểu tuyên bố chủ quyền đối với hệ sao này.\n\nChúng tôi chỉ yêu cầu các vị từ bỏ quyền kiểm soát đối với không gian của chúng tôi, chuyển giao $fleet_type_shipclass_starbase$ này cho những người từ xa xưa đã coi [From.Capital.GetStarName] là quê nhà.\n\nĐiều này chắc không quá đáng chứ."
 preftl.180.a:0 "Đương nhiên. Như vậy mới công bằng."
 preftl.180.a.tooltip:0 "§RNhượng lại§! §Y$fleet_type_shipclass_starbase$ [From.Capital.GetStarName]§! cho §Y[From.GetName]§!\n\n§Y$opinion_ceded_starbase$§!: §HĐánh giá§! của §Y[From.GetName]§! đối với §Y[Root.GetName]§! §Gtăng lên§!"
 preftl.180.b.tt.nothive:0 "§RChúng ta không có khả năng tiếp nhận Hive Mind, nếu chúng ta cứ khăng khăng làm vậy thì nền văn minh của họ sẽ bị diệt vong.§!"
 preftl.180.b.tt.notregular:0 "§RChúng ta không có khả năng tiếp nhận các cá nhân độc lập, nếu chúng ta cứ khăng khăng làm vậy thì tất cả nhân dân của họ sẽ bị biến thành nô lệ.§!"
 preftl.180.b:0 "Yêu cầu nực cười do một nền văn minh non nớt đưa ra."
 preftl.180.b.tooltip:0 "Duy trì quyền kiểm soát đối với §Y$fleet_type_shipclass_starbase$ [From.Capital.GetStarName]§!\n\n§Y$opinion_not_ceded_starbase$§!: §HĐánh giá§! của §Y[From.GetName]§! đối với §Y[Root.GetName]§! §Rgiảm xuống§!"
 preftl.180.c: "Rất xin lỗi, nhưng trong hệ sao của các vị đã có thuộc địa của chúng tôi rồi."

 ####################################
 # Observation Post Events
 ####################################

 observation.2000.name:0 "Khai sáng hoàn tất"
 observation.2000.desc:3 "Hàng ngàn nhà khoa học và cố vấn mà chúng ta phái đến [From.home_planet.GetName] cuối cùng cũng đã hoàn thành nhiệm vụ khó khăn, giúp trình độ công nghệ địa phương tiến bộ đến giai đoạn siêu quang tốc sơ kỳ. Chính phủ liên hiệp mới thành lập của họ tự xưng là \"[From.GetName]\", và đồng ý trở thành chư hầu của chúng ta.\n\nTheo các điều khoản của thỏa thuận với họ trước đó, chúng ta đã nhường lại quyền kiểm soát hệ sao này và dỡ bỏ trạm quan sát. Điều cần quyết định là, liệu chúng ta có nên tiếp tục hướng dẫn họ trong hành trình giữa các vì sao trong tương lai hay không."
 observation.2000.a:0 "Đây là một ngày vĩ đại."
 observation.2000.a.tt:1 "§Y[From.GetName]§! đã trở thành quốc gia phụ thuộc của bạn."
 observation.2000.b:0 "Các bạn đã sẵn sàng để một mình đối mặt với hệ sao rồi."

 observation.3101.name:1 "[rogue_agent_planet.GetName]: Đặc vụ phản bội"
 observation.3101.desc:2 "Đặc vụ $role_spymaster$ của chúng ta trên [rogue_agent_planet.GetName] là [rogue_agent_spymaster.GetName] đã trở mặt làm phản! Kẻ ngốc nghếch lầm đường lạc lối này dường như đã phải lòng một cá thể [rogue_agent_country.GetSpeciesName], và cả hai đã cùng nhau cao chạy xa bay tới một nơi vô danh trên bề mặt [rogue_agent_planet.GetPlanetMoon].\n\nHiện chúng ta vẫn chưa rõ liệu đặc vụ $role_spymaster$ của mình đã tiết lộ thân phận ngoại tinh thực sự của [rogue_agent_spymaster.GetHerHis] cho người tình hay chưa, hay liệu [rogue_agent_spymaster.GetHeShe] vẫn đang tiếp tục đóng giả làm một [rogue_agent_country.GetSpeciesName]. Rõ ràng đây là một lỗ hổng an ninh nghiêm trọng — chúng ta phải làm mọi cách trong khả năng để bắt điệp viên phản trắc này trở về và áp dụng các biện pháp điều trị tâm lý cần thiết cho [rogue_agent_spymaster.GetHimHer]."
 observation.3101.a:0 "Cứ tiếp tục như vậy, chúng ta sẽ xôi hỏng bỏng không mất."
 observation.3101.a.tooltip:0 "§Y[rogue_agent_spymaster.GetName]§! đã từ bỏ tiền đồn của [rogue_agent_spymaster.GetHimHer]."
 observation.3103.name:1 "[rogue_agent_planet.GetName]: Kênh liên lạc được kết nối"
 observation.3103.desc:1 "Chúng ta nhận được một tín hiệu mã hóa truyền đến từ bề mặt của [rogue_agent_planet.GetName]. Nó sử dụng tần số mà các nhân viên xâm nhập của chúng ta thường dùng, nhưng hiện tại không có ai trong số nhân viên xâm nhập của chúng ta đang gửi thông tin. Có lẽ đây là do đặc vụ phản bội của chúng ta gửi tới chăng?"
 observation.3104.desc:1 "Các người không thể theo dõi được thiết bị phát sóng này đâu. Các người chỉ cần biết tôi là $role_spymaster$ [rogue_agent_spymaster.GetName] là đủ rồi. Trước đây tôi luôn rất sẵn lòng tham gia vào kế hoạch xâm nhập [rogue_agent_planet.GetName].\n\nNhưng bây giờ tôi không nghĩ vậy nữa. Tôi chưa bao giờ nghĩ mình sẽ yêu thích nền văn hóa [rogue_agent_country.GetAdj] đến thế, tôi cũng sẽ không tham gia vào hành động lật đổ này nữa.\n\nTôi tự nguyện từ bỏ quyền công dân của [Root.GetName], không bao giờ coi bản thân là một [Root.Owner.GetSpeciesName] nữa."
 observation.3104.a:0 "Suy nghĩ của ngươi rất nguy hiểm... ngươi cần được giúp đỡ."
 observation.3104.a.response:1 "Các người chẳng còn gì có thể giúp được tôi nữa đâu. Sẽ có một ngày, tôi thừa nhận mọi tội lỗi mà tôi đã gây ra cho [rogue_agent_planet.GetName], và thú nhận rằng đây là do các người xúi giục.\n\nTôi sẽ cố gắng hết sức để đưa các người, những đồng đội cũ của tôi và cả chính bản thân tôi cùng nhau ra tòa chịu xét xử."
 observation.3104.b:1 "Ngươi định từ bỏ tất cả chỉ vì một [rogue_agent_country.GetSpeciesName] sao?"
 observation.3104.b.response:1 "Từ bỏ tất cả? Tôi có cái gì để mà từ bỏ chứ? Tôi chỉ là một kẻ lừa đảo khoác trên mình lớp da sinh vật ngoài hành tinh này thôi, và tôi tuyệt đối không có tư cách làm vậy. Tôi sẽ không bao giờ quên được khuôn mặt hoảng hốt bàng hoàng khi tôi thú nhận với người tôi yêu, mặc dù sau đó tôi vẫn nhận được sự cảm thông.\n\nVào ngày hôm đó, tôi đã hứa với tình yêu đích thực của mình —— và cả với chính bản thân tôi —— rằng, tôi sẽ cố gắng trở thành một [rogue_agent_country.GetSpeciesName] thực sự."
 observation.3104.c:0 "Cho dù ngươi chạy xa đến đâu, chúng ta cũng sẽ bắt được ngươi."
 observation.3104.c.response:2 "Tôi biết các người sẽ làm vậy. Tuy nhiên để bảo vệ tôi và người tôi yêu, tôi cũng sẽ không nương tay đâu. Tôi đã từng được huấn luyện dưới trướng của huấn luyện viên võ thuật giỏi nhất trên [rogue_agent_planet.GetName] đấy.\n\nCác người không bằng nghe theo lời khuyên của tôi: mau cút khỏi [rogue_agent_country.GetName] đi. Hãy dỡ bỏ cái trạm quan sát đáng ghét đó của các người, đi bóc lột những giống loài khác, dùng [rogue_agent_planet.GetBloodType] để xây dựng cái đế chế độc ác của các người đi."
 observation.3106.name:1 "[rogue_agent_planet.GetName]: Đặc vụ bị truy sát"
 observation.3106.desc:1 "Các mật thám của chúng ta được cài cắm trên [rogue_agent_planet.GetName] đang bị thanh trừng từng người một. Một vài đặc vụ đang theo dõi các mục tiêu tiềm năng của [rogue_agent_country.GetSpeciesName] đều đã chết một cách kỳ lạ. Dù không thể là do các tổ chức ám sát bản địa gây ra, nhưng có thể thấy, sát thủ này từng được đào tạo bởi quân đội của [Root.GetSpeciesName].\n\nNhững vụ ám sát này rất có thể đều là do đặc vụ phản bội của chúng ta gây ra. [rogue_agent_spymaster.GetName] biết rõ kế hoạch xâm nhập của chúng ta, và đã được huấn luyện đặc biệt, có thể tiêu diệt kẻ thù một cách âm thầm vô ảnh."
 observation.3106.a:0 "Thật không thể tha thứ được nữa."
 observation.3108.name:1 "[rogue_agent_planet.GetName]: Kiểm soát phương tiện truyền thông"
 observation.3108.desc:1 "Một số phương tiện truyền thông địa phương ở [rogue_agent_country.GetName] bắt đầu đưa tin về các thuyết âm mưu liên quan đến người ngoài hành tinh. Mặc dù chưa có phương tiện truyền thông nổi tiếng nào của [From.Owner.GetSpeciesName] đưa tin về chủ đề này, và những nội dung đã đưa tin phần lớn cũng chỉ là suy đoán chủ quan, nhưng một vài chi tiết trong đó chỉ có những người trong nội bộ của chúng ta mới có thể biết được.\n\nHiện tại chúng ta chỉ có thể suy đoán rằng, chính đặc vụ phản bội của chúng ta đã làm rò rỉ các thông tin tuyệt mật cho giới truyền thông. Chúng ta phải cố gắng hết sức để giảm bớt ảnh hưởng do việc này mang lại."
 observation.3108.a:0 "Cần phải kiểm soát chặt chẽ hơn các bài báo của phương tiện truyền thông mới được."
 observation.3110.name:1 "[rogue_agent_planet.GetName]: Các cuộc vây bắt quy mô lớn"
 observation.3110.desc:1 "Gần đây, một nhân viên xâm nhập của chúng ta trên [rogue_agent_planet.GetName] đã bị nhổ tận gốc. Họ đang tiến hành lùng sục và bắt giữ từng mật thám một. Khi thấy sắp bị bắt, các đặc vụ của chúng ta đều tuân theo các quy tắc của mật thám, tự sát bằng cách phân rã cơ thể. Vẫn còn một số đặc vụ đang trốn tránh sự truy bắt, chờ đợi sự giải cứu của chúng ta.\n\nĐối phương chắc chắn đã lấy được một phần danh sách các nhân viên xâm nhập này thông qua một kênh nào đó. Chỉ có tên đặc vụ phản bội kia của chúng ta mới nắm giữ được thông tin tình báo này..."
 observation.3110.a:1 "Nhất định phải ngăn cản [rogue_agent_spymaster.GetHeSheCap]."
 observation.3112.name:1 "[rogue_agent_planet.GetName]: Phát hiện đặc vụ phản bội"
 observation.3112.desc:2 "Bộ phận tình báo của chúng ta đã xác định được vị trí của đặc vụ phản bội trên [rogue_agent_planet.GetName]! Các đặc vụ đang rất nóng lòng muốn giải quyết cựu $role_spymaster$ [rogue_agent_spymaster.GetName] này, nhưng xét đến khả năng mà [rogue_agent_spymaster.GetHimHer] đã thể hiện trước đây, chúng ta không thể đảm bảo hành động sẽ thành công. Chúng ta cũng có thể sử dụng ném bom quỹ đạo có kiểm soát để phá hủy toàn bộ khu nhà nơi [rogue_agent_spymaster.GetHimHer] đang ở, đây cũng là một giải pháp cực kỳ hiệu quả.\n\nChúng ta phải hành động thật nhanh... Cơ hội như vậy trôi qua trong chớp mắt!"
 observation.3112.a:1 "Đã đến lúc loại bỏ mối họa [rogue_agent_spymaster.GetHerHim] này rồi."
 observation.3112.a.tooltip:0 "Mặc dù không thể đảm bảo thành công, nhưng may là thất bại cũng không đáng kể."
 observation.3112.b:1 "Oanh tạc khu nhà này."
 observation.3112.b.tooltip:0 "Giải pháp mang lại hiệu quả vượt trội, nhưng có thể gây ra sự nghi ngờ."
 observation.3112.c:0 "Không được... làm thế này quá làm càn rồi, rủi ro quá lớn. Kệ xác [rogue_agent_spymaster.GetHimHer] đi."
 observation.3112.c.tooltip:0 "Mạng lưới gián điệp của chúng ta sẽ bị giải tán."
 observation.3113.name:2 "[rogue_agent_planet.GetName]: Đặc vụ mất tích"
 observation.3113.desc:2 "Chúng ta đã không thể loại bỏ thành công tên đặc vụ phản bội trên [rogue_agent_planet.GetName]. Thông tin tình báo cho thấy, [rogue_agent_spymaster.GetSheHe] và người tình [rogue_agent_country.GetSpeciesName] của [rogue_agent_spymaster.GetHerHis] đã chuyển đến một nơi an toàn khác, địa điểm cụ thể chưa rõ."
 observation.3113.a:1 "Chúng ta đã đào tạo [rogue_agent_spymaster.GetHimHer] quá xuất sắc..."
 observation.3114.name:3 "[rogue_agent_planet.GetName]: Đặc vụ phản bội đã bị tiêu diệt"
 observation.3114.base.desc:0 "Thuyền trưởng của [Root.GetName] báo cáo, nhiệm vụ hỏa lực đã thành công, có vài đợt tấn công trúng thẳng vào mục tiêu chính. Mặc dù không thu hồi được bất kỳ thi thể nào, nhưng chúng tôi tin rằng, dưới mức độ tấn công bằng hỏa lực như thế này, tuyệt đối không có khả năng sinh vật nào sống sót được trong khu nhà mà chúng ta nhắm tới."
 observation.3114.awareness.desc:0 "$observation.3114.base.desc$\n\nCác đặc vụ của chúng ta đã thêu dệt những câu chuyện như vụ tập kích bất ngờ của thiên thạch để che giấu sự thật, nhưng người dân địa phương hoàn toàn không tin vào điều đó. Mặc dù các phương tiện truyền thông đang liên tục phát sóng về giả thuyết thiên thạch tập kích, nhưng ngày càng có nhiều báo cáo chính thức chỉ ra rằng sự kiện này bắt nguồn từ một loại \"hiện tượng ngoài không gian không thể lý giải\"."
 observation.3114.noawareness.desc:0 "$observation.3114.base.desc$\n\nCác phương tiện truyền thông dường như đã tin vào câu chuyện do các đơn vị xâm nhập của chúng ta thêu dệt cho họ: một trận mưa thiên thạch bất ngờ đã tấn công một khu vực đông dân cư của thành phố. Thật là bi thảm."
 observation.3115.desc:1 "Các đặc vụ của chúng ta trên [rogue_agent_planet.GetName] báo cáo rằng $role_spymaster$ phản bội của chúng ta đã được chăm sóc đặc biệt. Cái chết của [rogue_agent_spymaster.GetHisHerCap] được cho là vì nguyên nhân tự nhiên, những thông tin cố ý gieo rắc đã khiến người yêu của [rogue_agent_spymaster.GetHerHim] tin rằng cấu tạo sinh học của đặc vụ này rốt cuộc vẫn không thể thích ứng với bầu khí quyển của [rogue_agent_planet.GetName]."
 observation.3115.a:0 "Đây sẽ là một bài học cảnh tỉnh: tuyệt đối đừng bao giờ phản bội chúng ta."

 observation.3131.name:1 "[prelude_to_war_planet.GetName]: Căng thẳng leo thang"
 observation.3131.desc:1 "Trong lúc phía ta cố gắng dùng người thế thân để thay thế một nhân vật chủ chốt nào đó của [From.GetName], thì nhiệm vụ đã hoàn toàn bại lộ. Đặc vụ thực hiện nhiệm vụ nếu không bị truy sát đến chết, thì cũng tự sát để không bị bắt theo đúng quy định.\n\nVị lãnh đạo đáng lẽ phải bị tráo đổi lại đổ lỗi toàn bộ chuyện này cho một quốc gia thù địch nào đó. Do đó, tình hình trên [prelude_to_war_planet.GetPlanetMoon] ngày càng trở nên căng thẳng, chiến tranh dường như có thể nổ ra bất cứ lúc nào. Nhân viên xâm nhập của chúng ta đang chuẩn bị tiến hành các hoạt động tạo dư luận trên toàn cầu nhằm xoa dịu tình hình, nhưng cần chúng ta phái một Tàu Khoa Học khoa học vào quỹ đạo để hỗ trợ."
 observation.3131.a:0 "Phải giải quyết càng sớm càng tốt trước khi tình hình vượt khỏi tầm kiểm soát."
 observation.3132.name:2 "[prelude_to_war_planet.GetName]: Chiến tranh nổ ra"
 observation.3132.desc:2 "Bất chấp những nỗ lực của nhân viên xâm nhập của chúng ta, các mối quan hệ đối ngoại của [prelude_to_war_planet.GetName] vẫn không ngừng xấu đi, cuối cùng đã bùng phát thành một cuộc chiến tranh toàn diện. Chiến tranh thông thường chỉ kéo dài một khoảng thời gian ngắn, và các bên đã nhanh chóng bắt đầu sử dụng vũ khí hạt nhân.\n\nVô số sinh mạng đã biến mất khỏi bề mặt [prelude_to_war_planet.GetPlanetMoon], nơi này đã biến thành một vùng đất hoang tàn đầy phóng xạ. Giống như cư dân địa phương, chúng ta cũng đã mất đi hàng ngàn nhân viên xâm nhập. Do hành động thất bại, chúng ta đã dỡ bỏ trạm quan sát trên quỹ đạo, và sơ tán toàn bộ nhân viên."
 observation.3132.a:0 "Đúng là một thảm họa."
 observation.3133.name:1 "[From.From.GetName]: Tránh được chiến tranh"
 observation.3133.desc:2 "Nhận được sự hỗ trợ từ [Root.GetName] trên quỹ đạo, các nhân viên xâm nhập của chúng ta đã thành công ngăn chặn một cuộc chiến tranh sử dụng vũ khí hạt nhân sắp xảy ra trên [From.from.GetName] vào phút chót. Một vài lãnh đạo của [From.From.Owner.GetSpeciesName] —— trên thực tế đã bị mật thám của chúng ta đánh tráo —— đã kêu gọi cắt giảm vũ khí hạt nhân, và cải thiện mối quan hệ giữa các đế chế.\n\nCùng với sự lắng dịu của tình hình, tầm ảnh hưởng của các đặc vụ nằm vùng của chúng ta đã được nâng cao. Cục diện hiện tại đang rất có lợi cho chúng ta."

# "The Great Pyramid"
 observation.3135.name:0 "Đại kim tự tháp"
 observation.3135.desc.passive:1 "Các nhà khoa học tại trạm quan sát trên quỹ đạo của §Y[great_pyramid_planet.GetName]§! gần đây không gửi về bất kỳ báo cáo hữu ích nào. Cho đến khi một nhà khoa học trẻ tuổi trên trạm quỹ đạo tố cáo với chúng ta về một số hành vi lạm quyền nghiêm trọng.\n\n$observation.3135.desc.base$"
 observation.3135.desc.aggressive:1 "Đoàn nghiên cứu khoa học đậu trên quỹ đạo của §Y[great_pyramid_planet.GetName]§! gần đây không báo cáo về bất kỳ khám phá trọng đại nào... Đáng lẽ phải nói là, cho đến khi một quan sát viên rõ ràng là đang say khướt gửi một bản cập nhật quan trọng về cho trụ sở.\n\n$observation.3135.desc.base$"
 observation.3135.desc.enlighten:1 "Một người giấu tên bày tỏ rằng anh ta rất lo ngại về một số ảnh hưởng mà chúng ta đã gây ra đối với §Y[great_pyramid_planet.GetName]§!. Các nhân viên tại trạm quan sát của chúng ta đã tự ý \"trêu đùa cư dân địa phương\" trong lúc thực hiện nhiệm vụ khai sáng cho cư dân bản địa của [great_pyramid_planet.GetPlanetHabitat].\n\n$observation.3135.desc.base$"
 observation.3135.desc.covert:1 "Một nhân vật ẩn danh đã vạch trần một số hiện tượng trong chiến dịch ngầm tại §Y[great_pyramid_planet.GetName]§!. Một số nhóm nghiên cứu khoa học không những không hành động khiêm tốn, mà ngược lại còn bắt đầu triển khai một số dự án phá hoại vô cùng khủng khiếp."
 observation.3135.desc.base:1 "Theo như báo cáo này mô tả: Cách đây không lâu, một đội nghiên cứu khoa học bất ngờ từ trên trời giáng xuống, và tuyên bố với những người bản địa của [great_pyramid_planet.GetPlanetHabitat] rằng Sĩ quan khoa học Trưởng của họ là một vị thần của người địa phương. Bọn họ không chỉ thành công, mà còn khiến những người dân nguyên thủy này xây dựng một đài tưởng niệm cho vị Trưởng khoa học đó. Hiện tại, công trình kiến trúc mang phong cách kim tự tháp này đang sừng sững tọa lạc trên bề mặt của hành tinh này, thu hút những người hành hương sùng đạo từ khắp bốn phương tụ hội về đây."
 observation.3135.b:1 "Đây đương nhiên là một cách để tạo ra lịch sử!"
 observation.3135.b.tooltip:1 "Nền văn minh trên [great_pyramid_planet.GetName] đã bước sang thời đại tiếp theo."
 observation.3135.c:0 "Xóa sạch mọi dấu vết của chúng ta, rồi tiếp tục làm việc."
 remove_pyramid: "Âm thầm tháo dỡ §Y$building_great_pyramid$§!"
 observation.3135.d:1 "Hy vọng họ quên sạch những chuyện này đi?"

 observation.3136.desc:1 "Sự hỗn loạn trên §Y[great_pyramid_planet.GetName]§! cuối cùng cũng đã dịu đi, chúng ta rốt cuộc cũng có cơ hội được xem xét những hậu quả thảm khốc do đoàn nghiên cứu khoa học gây ra.\n\nTrong một khoảng thời gian ngắn, đa số người dân trên hành tinh này đã bị cuốn vào một cuộc chiến tranh tôn giáo toàn diện, đây là hậu quả trực tiếp từ việc đoàn nghiên cứu khoa học được họ gọi là \"Người Trời\" bất ngờ giáng thế trong thời gian ngắn. Khi một phe tham chiến xây dựng một kim tự tháp khác cho một vị tân thần khác của họ, những tranh chấp đã chuyển hóa thành bạo lực. Trong cuộc xung đột tôn giáo này, rất nhiều [great_pyramid_country.GetSpeciesNamePlural] đã bỏ mạng vì nó."
 observation.3136.a.tooltip:1 "§R200§! £pop£ §Hdân số§! trên [great_pyramid_planet.GetName] đã bị tiêu diệt."
 observation.3136.b.tooltip:1 "§R100§! £pop£ §Hdân số§! trên [great_pyramid_planet.GetName] đã bị tiêu diệt."

 observation.3137.desc:1 "Mặc dù chúng ta đã có sự tiếp xúc ngoài ý muốn với xã hội địa phương, nhưng tình hình trên §Y[great_pyramid_planet.GetName]§! vẫn dần dần lắng xuống. Hành động của chúng ta ở đây không gây ra thảm họa nào: Trái lại, người dân địa phương cho rằng cái gọi là \"Người Trời\" chẳng qua chỉ là truyền thuyết thần thoại, và họ coi Đại kim tự tháp như một địa điểm nghiên cứu khoa học đặc biệt.\n\nViệc [great_pyramid_country.GetSpeciesName] đạt được sự hiểu biết về văn hóa và lịch sử nhanh chóng như vậy đã khiến các nhà khoa học của chúng ta phải kinh ngạc. Điều này cũng củng cố cho lập luận rằng xã hội [root.GetPreFTLLower] vẫn có thể duy trì khả năng tư duy logic mạnh mẽ ngay cả khi đối mặt với những biến cố lớn bất thường."
 observation.3137.a:0 "Thật là may mắn."

 observation.3139.name:1 "Sự chuyển biến xã hội của [From.GetSpeciesAdj]"
 observation.3139.start.desc:3 "Công việc thay đổi các giá trị xã hội trên [From.GetName] của chúng ta đang phát triển theo chiều hướng có lợi cho chúng ta, và đã đạt được những kết quả không tồi."
 observation.3139.desc:2 "$observation.3139.start.desc$\nCác đế chế lớn của [From.GetSpeciesNamePlural] đã đạt được tiến bộ đáng kể trong việc tập trung quyền lực, với quyền lực hành chính được tập trung vào tay một số ít các nhà lãnh đạo có năng lực. Sự thống trị kém hiệu quả của đám đông điên cuồng đang dần mờ nhạt khỏi xã hội của họ."
 observation.3139.a:0 "Sau này họ sẽ phải cảm ơn chúng ta."
 observation.3141.desc:2 "$observation.3139.start.desc$\nChúng tôi đã cẩn trọng thúc đẩy [From.GetSpeciesNamePlural] hướng tới những tư tưởng dân chủ hơn, bởi trước khi chúng ta đến, thế giới của họ vẫn còn chìm trong chế độ độc tài tinh hoa nguyên thủy. Họ đang dần nhận ra tầm quan trọng của giá trị cá nhân."
 observation.3143.desc:2 "$observation.3139.start.desc$\n[From.GetSpeciesNamePlural] ngày càng trở nên bảo thủ, ôm một thái độ cảnh giác ngày càng lớn đối với người ngoại tộc."
 observation.3145.desc:2 "$observation.3139.start.desc$\n[From.GetSpeciesNamePlural] đang dần cởi mở hơn, trở nên dễ dàng chấp nhận những người ngoài hành tinh mà trước đây từng bị coi là người ngoại tộc và có nền văn hóa hoàn toàn khác biệt với họ."
 observation.3147.desc:2 "$observation.3139.start.desc$\nChúng tôi nhận thấy các đế chế [From.GetSpeciesAdj] đang có xu hướng phát triển thành một xã hội lấy quân đoàn làm nền tảng. Quân đoàn của họ đang trở nên ngày càng thiện chiến hơn."
 observation.3149.desc:2 "$observation.3139.start.desc$\nĐa phần các đế chế [From.GetSpeciesAdj] trên [From.Capital.GetName] đang dần từ bỏ thói quen hiếu chiến của mình. Có vẻ như một kỷ nguyên hòa bình mới đang mở ra trên [From.Capital.GetPlanetHabitat]."
 observation.3151.desc:3 "$observation.3139.start.desc$\nChúng ta đã giúp [From.target.GetSpeciesNamePlural] thấu hiểu được thế giới tâm linh mà trước đây họ chưa từng hiểu rõ. Rốt cuộc họ cũng đã có đức tin, xã hội của họ cũng vì thế mà trở nên phong phú hơn."
 observation.3153.desc:2 "$observation.3139.start.desc$\nHành động phá bỏ sự hoang mang và tín ngưỡng nguyên thủy đang đầu độc xã hội [From.GetSpeciesNamePlural] đã thành công rực rỡ. Họ bắt đầu nhận thức được giá trị của khoa học và sự hợp lý."


 ####################################
 # Crisis Events
 ####################################

 crisis.11.name:0 "Tiếng vọng không gian con"
 crisis.11.desc:0 "Một vài trạm theo dõi của chúng ta đều đã bắt được một tiếng vọng không gian con kỳ lạ. Âm thanh này bắt nguồn từ các hệ sao khác. Tiếng vọng này lúc đầu khá yếu, nhưng sau đó dần mạnh lên, dường như có thứ gì đó đang đến gần hệ sao của chúng ta..."
 crisis.11.a:0 "Một cơn bão mới sắp xuất hiện."
 crisis.13.name:0 "Tiếp cận rìa hệ sao"
 crisis.13.desc:0 "Tiếng vọng không gian con kỳ lạ mà chúng tôi phát hiện được trong không gian liên sao hiện đã tiếp cận rìa hệ sao của chúng ta. Theo hướng di chuyển của vật thể tạo ra tiếng vọng, dường như đã xuất hiện một loạt các tín hiệu liên lạc yếu ớt, và đang chĩa vào rất nhiều hệ sao ở vùng rìa.\n\nChúng tôi đã nhập tọa độ của các hệ sao này vào nhật ký trạng thái và sẽ tiếp tục theo dõi diễn biến của tình hình."
 crisis.13.a:0 "Bọn chúng sắp sửa buông xuống..."
 crisis.15.name:0 "Tín hiệu không gian con"
 crisis.15.desc:0 "Chúng tôi đã nhận được một tín hiệu không gian con mạnh mẽ càn quét toàn bộ hệ sao! Nguồn tín hiệu dường như chính là từ cuộc liên lạc nằm trong không gian liên sao trước đó."
 crisis.15.a:0 "Tiến hành giao tiếp bằng hình ảnh."
 crisis.16.desc:0 "§B<Chương trình dịch thuật bị vô hiệu hóa>§!\n\n§RPrinthorn, Istvux, Cleevu. Saratheri Velas! Sglakfu Nirufu Prinsas Fusna!§!\n\n§B<Đường truyền bị gián đoạn>§!"
 crisis.16.b.desc:0 "§B<Phát hiện liên lạc tâm linh, đang phiên mã...>§!\n\n§RPrethoryn, chúng ta đã đến nơi. Chuyến hành trình dài đằng đẵng của chúng ta đã kết thúc! Ăn, sinh sản, và nghỉ ngơi. Chúng ta phải nuốt chửng hệ sao này trước khi bị bọn Thợ săn tìm thấy!!§!"
 crisis.16.c.desc:0 "§B<Đã thiết lập liên kết ý thức>§!\n\n§RPrethoryn, chúng ta đã đến nơi. Chuyến hành trình dài đằng đẵng của chúng ta đã kết thúc! Ăn, sinh sản, và nghỉ ngơi. Chúng ta phải nuốt chửng hệ sao này trước khi bị bọn Thợ săn tìm thấy!§!"
 crisis.16.a:0 "Tắt màn hình chính."
 crisis.16.b:0 "Ngắt kết nối."
 crisis.18.name:0 "Cuộc tiếp xúc đợt một"
 crisis.18.desc:0 "Dữ liệu mà chúng tôi nhận được cho thấy một số hệ sao ở rìa thiên hà đang bị tàn phá bởi một lực lượng xâm lược nào đó. Đây có vẻ là bản thể của tiếng vọng không gian con mà chúng ta phát hiện được, vốn đang không ngừng đến gần thiên hà của chúng ta.\n\nNhững gì chúng ta đang gặp phải bây giờ chỉ là đội quân tiên phong, lực lượng chính của chúng vẫn chưa xuất hiện. Cho đến nay, các báo cáo liên tiếp gửi về đều vô cùng rắc rối khó hiểu, các con tàu mà những kẻ xâm lược sử dụng dường như được cấu tạo từ chất hữu cơ, và những kẻ xâm lược vẫn chưa có bất kỳ phản hồi nào đối với chúng ta.\n\nToàn bộ thiên hà của chúng ta có thể sẽ phải đối mặt với một cuộc xâm lược chưa từng có trong lịch sử."
 crisis.18.desc.bio: "Những báo cáo gửi về từ các hệ sao ở vùng ngoại vi thiên hà khiến người ta phải rùng mình, có một lực lượng xâm lược đang càn quét khắp các vì sao. Đây có vẻ là bản thể của tiếng vọng không gian con mà chúng ta phát hiện được, vốn đang không ngừng đến gần thiên hà của chúng ta.\n\nNhững gì chúng ta đang gặp phải bây giờ chỉ là đội quân tiên phong, lực lượng chính của chúng vẫn chưa xuất hiện. Nhưng những thực thể này đã mang đến cho người ta cảm giác bất ổn. Hình dạng của chúng giống như một sự chế nhạo dị hợm đối với sự sống, đang đập thình thịch cùng một sự khao khát vô lý. Chúng không giao tiếp, không mưu cầu sự thấu hiểu —— chỉ có nuốt chửng vạn vật.\n\nChúng ta đã quen với những lời thì thầm của tàu vũ trụ sinh học, cũng chính là sợi dây liên kết giữa con tàu và chủ thể. Vậy còn những thứ này thì sao? Bọn chúng là người ngoài hành tinh theo đúng nghĩa đen của nó. Thiên hà không chỉ phải đối mặt với những kẻ xâm lược. Nó đang phải đối mặt với một cơn đói khát vốn dĩ không nên tồn tại."
 crisis.18.a:0 "Cầu mong các vị thần phù hộ cho chúng ta..."
 crisis.18.b:0 "Chuyển thông điệp đến tất cả các chỉ huy hạm đội."
 crisis.18.c:0 "Chúng ta phải nghiên cứu những sinh vật này ở cự ly gần."
 crisis.18.d:0 "Thật sự không có cách nào lý luận với chúng sao?"
 crisis.18.e:0 "Điều này sẽ làm tổn hại đến lợi nhuận của chúng ta..."
 crisis.18.f:0 "Bóng tối sắp buông xuống."
 crisis.18.g:0 "Lũ sinh vật ngoài hành tinh đáng ghét, nhất định phải giết sạch toàn bộ bọn chúng."
 crisis.18.h:0 "Thật là hấp dẫn... Sinh mệnh thể ngoài hệ sao."
 crisis.18.i:0 "Tư duy của chúng hoàn toàn thống nhất. Thật kỳ diệu."
 crisis.18.j:0 "Đây là mối đe dọa đối với bất kỳ sinh vật có tri giác nào."
 crisis.20.name:0 "Cuộc tiếp xúc đợt hai"
 crisis.20.desc:0 "Chúng ta đã không thể phân biệt được chủ thể của tiếng vọng không gian con từ bức xạ nền của thiên hà nữa, điều này chỉ có nghĩa là một việc... bọn chúng đã tới.\n\nNếu lấy quy mô đội tiên phong của chúng làm mốc tham chiếu, thì số lượng quân đội của những kẻ xâm lược này sẽ vô cùng khổng lồ."
 crisis.20.a:0 "Bọn chúng đến rồi..."

 crisis.30.desc_01:0 "JARAK?"
 crisis.30.desc_02:0 "TUROSKMINA.DOROF!"
 crisis.30.desc_03:0 "§RMugani? HAK HAK HAK!§!"
 crisis.30.desc_04:0 "§B<Đã thiết lập kênh liên lạc tâm linh>§!\n\n§RNó vậy mà có thể hiểu được?§!"
 crisis.30.desc_05:0 "§B<Đã thiết lập kênh liên lạc tâm linh>§!\n\n§RThợ săn là tuyệt đối không nhân nhượng.§!"
 crisis.30.desc_06:0 "§B<Đã thiết lập kênh liên lạc tâm linh>§!\n\n§RChúng ta có thể cảm nhận được sự tồn tại của các ngươi...§!"
 crisis.30.desc_07:0 "§B<Đã thiết lập liên kết ý thức>§!\n\n§RNó vậy mà có thể hiểu được?§!"
 crisis.30.desc_08:0 "§B<Đã thiết lập liên kết ý thức>§!\n\n§RThợ săn là tuyệt đối không nhân nhượng.§!"
 crisis.30.desc_09:0 "§B<Đã thiết lập liên kết ý thức>§!\n\n§RChúng ta có thể cảm nhận được sự tồn tại của các ngươi...§!"
 crisis.30.a:0 "Tắt màn hình."
 crisis.30.a.2:0 "Ngắt kết nối."
 crisis.30.a.response:0 "JASKA?"
 crisis.30.b:0 "Chúng ta nhất định vẫn còn có cách chung sống hòa bình!"
 crisis.30.b.response:0 "NIKALLADUSAM!NIBLIRTOVASSU!HAKHAKHAK!"
 crisis.30.c:0 "Cút về quê nhà của các ngươi đi."
 crisis.30.c.response:0 "VEKIKT'UHANVELOSH.PIROK."
 crisis.30.d:0 "Các ngươi là sinh vật gớm ghiếc nhất mà chúng ta từng thấy."
 crisis.30.d.response:0 "LUSAAAAAGH!VIDMUSABAGH!"
 crisis.30.e:0 "Rõ ràng là, giống loài mà chúng ta đối phó lần này không hề tầm thường."
 crisis.30.e.response:0 "§RJUSUGAMAK V'TA! RAGAH TUR, HAK HAK!§!"
 crisis.30.f:0 "Cút về sào huyệt của các ngươi đi, lũ ác quỷ này!"
 crisis.30.f.response:0 "HAKHAK!NIMAVU!!!"

 crisis.30.k.response:0 "§RNó đã biến mất rồi.§!"
 crisis.30.g:0 "Chẳng lẽ chúng ta không thể chung sống hòa bình với nhau sao?"
 crisis.30.g.response:0 "§RKhông chấp nhận hòa bình. Chúng ta phải ăn.\n\nChỉ khi nuốt chửng thiên hà này, chúng ta mới có thể tiếp tục hành trình dài đằng đẵng của mình.§!"
 crisis.30.g.2:0 "Ý thức của các ngươi ở cùng chúng ta. Tại sao chúng ta không thể cùng tồn tại?"
 crisis.30.g.2.response:0 "§RChúng ta đã nuốt chửng vô số ý thức. Chúng ta sẽ tiếp tục không ngừng nuốt chửng vô số.\n\nSinh khối của các người sẽ cung cấp dưỡng chất cho hành trình dài đằng đẵng của chúng ta.§!"
 crisis.30.h:0 "\"Thợ săn\" mà ngươi nói rốt cuộc là ai?"
 crisis.30.h.response:0 "§RChính là Tử thần. Bọn họ đã tiêu diệt phe ta gần như không còn một mảnh giáp, ngay cả những người sống sót cuối cùng như chúng ta, cũng bị họ truy sát qua vô số kỷ nguyên.\n\nSẽ có một ngày bọn họ tìm thấy nơi này. Chúng ta phải ăn thật nhanh, để có thể một lần nữa lẩn trốn vào bóng tối của vũ trụ để tiếp tục chạy trốn trước khi bọn họ đến.§!"
 crisis.30.i:0 "Vậy \"Prethoryn\" có nghĩa là gì?"
 crisis.30.i.response:0 "§RCó nghĩa là những người sống sót. Những người sống sót chúng ta là tia hy vọng cuối cùng của toàn bộ giống loài rồi.§!"
 crisis.30.j:0 "Chúng tôi sẽ quét sạch các ngươi khỏi thiên hà."
 crisis.30.j.b:0 "Chúng ta sẽ tiêu diệt ý thức của các ngươi."
 crisis.30.j.response:0 "§RCâu này trước đây chúng ta đã nghe không ít lần rồi. Hahaha!\n\nThợ săn sẽ tiêu diệt vạn vật trên thế giới. Đứng trước sự thật phũ phàng này, những lời đe dọa cỏn con của các người thì đáng là gì?§!"

 crisis.51.name:0 "Thế lực mới"
 crisis.51.desc:0 "Một tổ chức quân sự chiến đấu với bầy Prethoryn gần đây đã xuất hiện trong thiên hà. Các thành viên của tổ chức này dường như chủ yếu bao gồm những người vô gia cư, bị giày xéo —— người tị nạn, cựu chiến binh và những người khác đã mất đi tất cả trong tác động của thảm họa bầy đàn.\n\nMặc dù vậy, hạm đội được chắp vá của họ vẫn xoay sở để giành chiến thắng trong một vài trận chiến chống lại Đàn Săn mồi của bầy Prethoryn. Một số báo cáo chưa được xác nhận cho biết hạm đội của họ có một số tàu chiến với thiết kế kỳ lạ..."
 crisis.51.a:0 "Những người này rốt cuộc có lai lịch gì?"
 crisis.52.desc:0 "Chúng tôi là Vệ binh. Giáo phái của chúng tôi đã thề sẽ ngăn chặn bầy Prethoryn khát máu bằng bất cứ giá nào. Khi các đế chế khác bỏ cuộc, chúng tôi vẫn kiên trì chiến đấu. Khi họ đầu hàng thảm họa bầy đàn, chúng tôi sẽ trao cho họ phương tiện để phản công.\n\nTôi là Đại đoàn trưởng Kgas, người đứng đầu Giáo phái. Đừng đánh giá con người qua vẻ bề ngoài —— Giáo phái Vệ binh chiêu mộ binh sĩ từ tất cả các chủng tộc trong thiên hà, bao gồm cả chủng tộc của bạn. Chúng tôi chỉ mong chính phủ của các bạn có thể kiên trì chống lại cuộc xâm lược của bầy Prethoryn, và hỗ trợ chúng tôi khi có thể."
 crisis.52.a:0 "Làm thế nào mà các người có thể chống lại loài bọ thành công vậy?"
 crisis.52.a.response:0 "Rất nhiều Vệ binh có xuất thân từ quân đội. Chúng tôi đến từ những người sống sót của một loạt các hạm đội khác nhau đã bị đánh bại trong các trận chiến với bầy Prethoryn. Là một Vệ binh, chúng tôi đã rút ra bài học từ những sai lầm trong quá khứ và nỗ lực làm việc để tránh tình huống tương tự xảy ra lần nữa.\n\nTương tự như vậy, tôi tin là tôi đã đề cập đến, những người chúng tôi chiêu mộ đến từ mọi chủng tộc trong thiên hà. Trong đó cũng bao gồm cả những chủng tộc cổ đại, ví dụ như [sentinel_fallen_empire.GetSpeciesNamePlural]. Chúng tôi đã nhận được sự ủng hộ từ một vài phe phái có sức ảnh hưởng của §H[sentinel_fallen_empire.GetName]§!, những người không muốn nhìn thấy hệ sao của mình bị bầy bọ nuốt chửng. Họ đã quyên tặng tàu thuyền và tài nguyên cho sự nghiệp của chúng tôi."
 crisis.52.b:0 "Căn cứ chính của các người ở đâu?"
 crisis.52.b.response:0 "Từ bấy lâu nay chúng tôi đã không ngừng củng cố tổng hành dinh của mình tại hệ sao §H[sentinel_system.GetName]§!. Tọa độ của hệ sao chưa từng được lập bản đồ này đã được cung cấp cho chúng tôi bởi [sentinel_fallen_empire.GetName], bên cũng đã hỗ trợ việc xây dựng căn cứ chính trên §HSentinel Alpha§!.\n\nNếu tôi có thể mạn phép tự hào, đây quả là một thành tựu vô cùng đáng kinh ngạc. Chúng tôi hiện cũng đã sở hữu các xưởng đóng tàu của riêng mình."
 crisis.52.c:0 "Tạm biệt."
 crisis.52.c.response:0 "Hãy kiên trì chiến đấu, những người bạn thân mến của tôi. Vận mệnh của toàn bộ thiên hà chúng ta hiện vẫn chưa rõ ràng.\n\nVệ binh số 1, kết thúc."
 crisis.55.desc_01:0 "Tương lai của thiên hà chúng ta chỉ có hai con đường để đi: Một là thảm họa bầy đàn tiêu diệt toàn bộ sự sống hữu cơ trong thiên hà này, rồi tiếp tục tiến trình hủy diệt của chúng, hai là chúng ta quét sạch lũ sinh vật hèn hạ đó không còn một mống."
 crisis.55.desc_02:0 "Chúng ta phải nỗ lực gấp đôi để chống lại thảm họa bầy đàn. Cuộc chiến này liên quan đến vận mệnh của toàn bộ thiên hà."
 crisis.55.desc_03:0 "Giờ đây các cuộc tranh giành giữa các quốc gia đã không còn ý nghĩa gì nữa. Việc dùng phi thuyền để đối phó với người của mình thay vì tộc bọ, đúng là một sự lãng phí quá lớn."
 crisis.55.desc_04:0 "Đừng đánh mất hy vọng. Thiên hà của chúng ta vẫn còn cơ hội chiến thắng."
 crisis.55.desc_05:0 "Nếu các bạn không thể đối đầu trực diện với thảm họa bầy đàn, có thể quyên góp tài nguyên cho chúng tôi. Làm như vậy có thể tăng cường binh lực của chúng tôi, để chống lại những kẻ xâm lược Prethoryn đó."
 crisis.55.a:0 "Các người biết bao nhiêu về tộc bọ?"
 crisis.55.a.response:0 "E là, những gì chúng tôi biết cũng không nhiều, nhưng có thể chắc chắn là chúng bắt nguồn từ ngoài thiên hà. Rất có khả năng chúng đã phá hủy hàng chục thậm chí hàng trăm thiên hà trước khi đến thiên hà của chúng ta... hoặc có lẽ chúng ta là nạn nhân đầu tiên.\n\nSau khi hoàn tất việc tàn sát toàn bộ sự sống không phải Prethoryn trên hành tinh, chúng đã biến hành tinh này thành một địa ngục mà chỉ có thể dùng từ cơn ác mộng vặn vẹo để hình dung. Mọi dạng sống khác đều không thể tồn tại trên những hành tinh lồng ấp này, chỉ có một cách duy nhất để thanh tẩy hành tinh, đó là dùng một đợt oanh tạc mạnh mẽ từ quỹ đạo thiêu rụi toàn bộ sinh quyển."
 crisis.55.b:0 "Chúng tôi sẵn lòng quyên góp. (1000 Năng lượng)"
 crisis.55.b.response:0 "Chúng tôi cảm ơn sự quyên góp hào phóng của ngài. Nguồn tài nguyên này có thể giúp chúng tôi trang bị một hạm đội hoàn chỉnh để chống lại thảm họa bầy đàn! Nếu ngày càng có nhiều quốc gia cũng hào phóng như ngài, cuộc chiến này sẽ nhanh chóng kết thúc."
 crisis.55.c.response:0 "Tôi nghĩ ngài cũng biết, tàu vũ trụ hiện đại cần một lượng lớn năng lượng để duy trì. Chúng tôi cần 1000 năng lượng mới có thể thành lập một nhóm tác chiến mới để đối phó với thảm họa bầy đàn."
 crisis.55.e.response:0 "Vô cùng đáng tiếc, hiện tại chúng tôi không thể nhận tiền quyên góp của các bạn. Số lượng hạm đội của chúng tôi đã vượt quá mức quy định, phòng hậu cần đã quá tải rồi. Nhưng dù sao thì, chúng tôi vẫn cảm ơn các bạn vì đã hào phóng rút hầu bao."
 crisis.55.d:0 "Tạm biệt."
 crisis.55.d.response:0 "Chiến tranh vẫn sẽ tiếp diễn. Hộ Vệ hạm số 1, kết thúc."
 crisis.71.desc:0 "Vệ binh vô cùng tán thưởng những hành động dũng cảm chống lại thảm họa bầy đàn của các bạn. Vì chỉ huy hạm đội của [Root.GetName] đã nắm vững bí quyết khắc chế kẻ thù giành chiến thắng, chúng tôi hy vọng sẽ giao vĩnh viễn một trong những hạm đội của mình cho các bạn. Hiện tại chúng tôi đang thiếu nhân lực, không thể phát huy tối đa sức mạnh của hạm đội, nhưng đối với các bạn thì đây có lẽ không phải là vấn đề.\n\nTuy nhiên các bạn nhất định phải trịnh trọng cam kết rằng, chỉ sử dụng những chiếc tàu này để chống lại thảm họa bầy đàn!"
 crisis.71.a:0 "Tất nhiên rồi... chúng tôi sẽ chỉ dùng nó để chống lại thảm họa bầy đàn."
 crisis.71.a.response:0 "Rất tốt. Chúng tôi tin rằng, vị thuyền trưởng dũng cảm của các bạn cùng với những chiếc tàu vĩ đại này sẽ được lưu danh sử sách. Chúng tôi sẽ điều hạm đội đến gần [Root.Capital.GetName]."
 crisis.71.b:0 "Chúng tôi không cần tàu của các người."
 crisis.71.b.response:0 "Vậy cũng không sao. Chúng tôi chỉ mong các bạn có thể tiếp tục chiến đấu. Mỗi khi tiêu diệt được một con bọ, chúng ta lại tiến gần hơn tới chiến thắng."

 crisis.101.name:0 "Nữ hoàng bọ bị thương"
 crisis.101.desc:0 "Một trong số máy thăm dò không gian sâu thẳm của chúng ta đã đi vào tàn tích chiến trường nằm ở [queen_system.GetName], hai phe tham chiến trong trận đấu này là bầy Prethoryn và một thế lực vô danh. Một con nữ hoàng bọ Prethoryn dường như đã bị thương nặng sau trận chiến, bị vứt bỏ ở đây, phó mặc cho số phận.\n\nMáy thăm dò dùng để trinh sát báo cáo rằng, nữ hoàng bọ vẫn còn thoi thóp một hơi thở. Bây giờ là một cơ hội hiếm có để bắt sống nữ hoàng bọ."
 crisis.101.a:0 "Phái một đội khảo sát qua đó."
 crisis.105.name:0 "Nữ hoàng bọ muôn năm!"
 crisis.105.desc:0 "[Root.GetName] đã chữa lành vài vết thương nặng cho nữ hoàng bọ Prethoryn. Sĩ quan khoa học [Root.GetLeaderName] đã cắt bỏ cơ quan mà nữ hoàng bọ dùng để liên lạc với đồng loại, và thay thế bằng các thiết bị cấy ghép positron nhỏ, kiểm soát hoàn toàn nữ hoàng bọ.\n\nHiện tại nữ hoàng bọ tùy chúng ta sai khiến, trong bụng cũng đang ấp ủ ấu trùng Prethoryn. Những ấu trùng này sẽ chỉ nghe lệnh của con nữ hoàng bọ này, nói cách khác là, sẽ chỉ nghe lệnh của chúng ta. Chừng nào nữ hoàng bọ còn sống, chúng ta sẽ có thể nhân giống ra một lượng lớn đội quân Prethoryn đã được thuần hóa!"
 crisis.105.a:0 "Có lẽ đây sẽ là một sức chiến đấu hữu dụng!"
 crisis.107.name:0 "Nữ hoàng bọ bị cướp mất"
 crisis.107.desc:0 "Nữ hoàng bọ Prethoryn bị thương mà chúng ta tìm thấy trong hệ sao [queen_system_1.GetName] không may đã bị người khác cướp mất rồi! Sau khi chữa khỏi cho nữ hoàng bọ, chúng lại cắt đứt cơ quan mà nữ hoàng bọ dùng để liên lạc với đồng loại. Lần này nữ hoàng bọ hoàn toàn nghe theo lệnh chúng rồi. Báo cáo còn cho biết, nữ hoàng bọ đã và đang ấp ủ ấu trùng."
 crisis.107.a:0 "Quả nhiên chúng ta vẫn đi muộn một bước!"

 crisis.211.name:0 "Thảm họa bầy đàn đã bị dẹp yên"
 crisis.211.desc:0 "Cùng với việc đợt thảm họa bầy đàn cuối cùng bị tiêu diệt, toàn bộ vũ trụ đều thở phào nhẹ nhõm. Cuộc xâm lược xuyên thiên hà của chúng đã hoàn toàn thất bại, bầy đàn Prethoryn từng che khuất cả bầu trời giờ đây chỉ còn lại vô số những cái xác bị lửa thiêu rụi, trôi nổi lặng lẽ trong không trung.\n\nKhông khí nhẹ nhõm và vui vẻ lan tỏa khắp vũ trụ với tốc độ siêu quang tốc, vô số hành tinh bắt đầu tự phát tổ chức các hoạt động ăn mừng chiến thắng vĩ đại này. Có lẽ, chúng ta có thể mượn cơ hội này, lật sang một trang mới hòa bình và ổn định của vũ trụ?"
 crisis.211.a:0 "Những sinh vật bất kính này, chết sớm cho rảnh nợ."
 crisis.211.b:0 "Họ là những đối thủ đáng kính."
 crisis.211.c:0 "Công nghệ hữu cơ của họ thật sự vô cùng thú vị."
 crisis.211.d:0 "Cuối cùng cũng đặt một dấu chấm hết cho sự hiếu chiến vô nghĩa này."
 crisis.211.e:0 "Những sinh vật đó làm tổn hại đến chuyện làm ăn của chúng ta."
 crisis.211.f:0 "Chuyện này vẫn còn phải xem xét lại."
 crisis.211.g:0 "Quả là một chủng tộc ngoài hành tinh độc ác nhất mà chúng ta từng bắt gặp trong lịch sử."
 crisis.211.h:0 "Thật bi thảm. Họ là những thể sống vô cùng độc đáo."

 crisis.234.name:0 "Lỗ thủng của hư không"
 crisis.234.desc.intro: "Nữ hoàng bọ Prethoryn mà chúng ta bắt được đã trở nên ngày càng bồn chồn và bất an trong vài tháng qua. Ban đầu chúng ta tưởng rằng nó chỉ vì mất liên lạc với những đồng loại khác, nhưng sau đó [get.telepaths.plural] của chúng ta đã nhận được thông tin liên lạc của nó, nói về cái gì mà \"Lỗ thủng của hư không\" vân vân.\n\nKhi chúng tôi nghiên cứu phương pháp du hành xuyên thiên hà của bầy Prethoryn, và phát hiện ra một sự sai lệch trong cơ sở dữ liệu thiên văn, chúng tôi mới hiểu được rốt cuộc nó đang nói về điều gì. Trong quá trình vẽ ra các lộ trình mà bầy Prethoryn có thể đã đi qua, chúng tôi phát hiện một thiên hà xoắn ốc nhỏ cách chúng ta khoảng 30 triệu năm ánh sáng đã biến mất."
 crisis.234.desc.organic_non_gestalt: "$crisis.234.desc.intro$\n\nThiên hà đó chúng ta từng phát hiện và nghiên cứu vào thời kỳ đầu của kỷ nguyên không gian, nhưng hiện tại nó không còn phát ra bất kỳ ánh sáng nào mà các thiết bị của chúng ta có thể thăm dò được. Khám phá kỳ lạ ngoài dự kiến này khiến các nhà khoa học của chúng ta tranh nhau muốn giải thích rốt cuộc thứ gì đã khiến toàn bộ thiên hà biến mất khỏi vũ trụ.\n\nHiện tại có hai cách giải thích: Hoặc là tất cả các ngôi sao trong thiên hà đột nhiên tắt ngấm, hoặc là có thứ gì đó, một thứ khổng lồ đủ để che khuất toàn bộ thiên hà, đã cản lại ánh sáng mà nó chiếu tới. Cả hai giả thuyết này dường như đều khó tin, nhiều người đã chỉ trích chúng là nực cười vô lý, và có xu hướng cho rằng thiên hà đã biến mất này vốn dĩ không tồn tại, chỉ là do việc sử dụng sai kính viễn vọng nguyên thủy mà tạo ra. Mặc dù vậy, toàn bộ sự kiện này vẫn toát lên một nỗi sợ hãi và điềm gở rõ rệt..."
 crisis.234.desc.machine_or_gestalt: "$crisis.234.desc.intro$\n\nTừ thời kỳ đầu của kỷ nguyên không gian của chúng ta, thiên hà này đã được ghi chép lại, nhưng chúng ta không còn có thể quan sát thấy nó phát ra bất kỳ dạng ánh sáng nào qua các thiết bị nữa. Việc điều tra sâu hơn đã đưa ra hai lời giải thích khả thi.\n\nHoặc là các ngôi sao trong thiên hà đồng thời tắt ngấm, hoặc là một thực thể đủ khổng lồ để che lấp một khu vực không gian rộng lớn như thiên hà đã chắn mất nguồn sáng. Cả hai cách giải thích này đều đi ngược lại với logic thông thường, tuy nhiên, trừ phi có bằng chứng rõ ràng cho điều ngược lại, nếu không thì không thể loại trừ hai khả năng này."
 crisis.234.a.organic_non_gestalt:0 "Thật đáng lo ngại."
 crisis.234.a.machine_or_gestalt: "$ACKNOWLEDGED$"

 crisis.1007.name:1 "Kẻ phá vỡ không gian"
 crisis.1007.desc:1 "Hệ sao [extradimensional_system.GetName] đã xuất hiện một vết nứt không gian khổng lồ! Mặc dù chúng ta vẫn chưa biết nguyên nhân, nhưng đây dường như là một cổng dịch chuyển một chiều đến từ một chiều không gian khác. Những phi thuyền kỳ lạ ồ ạt bay ra từ vết nứt, tấn công điên cuồng bất cứ thứ gì chúng nhìn thấy. Điều này dường như báo trước cho sự xuất hiện của một cuộc tấn công quy mô lớn. Phe ta đã đánh chặn được các tín hiệu mà những phi thuyền này gửi sang phía bên kia của cổng dịch chuyển. Nghe... giống như tiếng còi săn mồi vậy."
 crisis.1007.a:0 "Thật thú vị... sinh vật sống đến từ không gian đa chiều."
 crisis.1007.b:0 "Chúng có vẻ có tổ chức, có trật tự."
 crisis.1008.name:0 "Biến động năng lượng hệ sao"
 crisis.1008.desc:0 "Tất cả các thiết bị trong [Root.GetName] đột nhiên đồng loạt cảm nhận được những biến động năng lượng không gian con khổng lồ, và nguồn gốc của nó nằm ngay trong hệ sao của chúng ta. Các nhà khoa học của chúng ta cũng khó giải thích được nguyên nhân bên trong —— hiện tượng kỳ lạ này chưa từng thấy bao giờ. Vị trí cụ thể của nguồn gốc vẫn chưa rõ ràng, chúng tôi vẫn đang tiếp tục phân tích các dữ liệu hiện có."
 crisis.1008.a:0 "Tiếp tục điều tra."
 crisis.1009.desc:0 "Chúng ta đã hoàn tất việc rà soát sóng năng lượng khổng lồ mà chúng ta đã phát hiện ra trước đó. Nó xuất phát từ một vết nứt không gian con khổng lồ trong hệ sao [extradimensional_system.GetName]. Những phi thuyền kỳ lạ ồ ạt bay ra từ cổng dịch chuyển, các báo cáo sơ bộ cho thấy, những phi thuyền này sẽ phát động các cuộc tấn công không phân biệt vào bất cứ thứ gì chúng tiếp xúc.\n\nPhe ta đã đánh chặn được một đoạn tín hiệu năng lượng cao mà những phi thuyền này gửi về phía bên kia cổng dịch chuyển. Nghe... giống như tiếng còi săn mồi vậy."
 crisis.1010.name:0 "Tín hiệu bị đánh chặn"
 crisis.1010.desc:0 "...Đã đến khu vực kiếm ăn... Rất nhiều con mồi... Rốt cuộc cũng... có thể ăn một bữa no nê..."
 crisis.1010.a:0 "Mấy thứ này rốt cuộc là gì vậy?"
 crisis.1011.name:0 "Thuộc địa trên [Root.GetName] bị phá hủy"
 #crisis.1011.desc:0 "We have lost our colony on [Root.GetName]! After taking up positions in orbit, the extradimensional invaders bombarded the surface and fed on our citizens below. They left all non-sapient life forms alone, but nothing living remains in our settlements."
 crisis.1011.a:0 "Ngăn cản những con quái vật đó bằng mọi giá!"

 crisis.1013.name:0 "Cổng dịch chuyển đa chiều đã bị phá hủy"
 crisis.1013.desc:1 "Cổng dịch chuyển đa chiều nằm trong hệ sao [extradimensional_system.GetName] đã bị phá hủy! Những kẻ xâm lược đa chiều đáng ghét này không có cách nào gọi viện binh đến được nữa rồi. Sau khi phá hủy cánh cổng, cuộc chiến này cuối cùng cũng đã đón nhận tia sáng chiến thắng. Đông đảo người dân trong hệ sao đều đang vui sướng reo hò. Đồng thời, [portal_killer.GetName] cũng nhận được rất nhiều lời khen ngợi, bởi vì phi thuyền của họ đã giáng đòn chí mạng vào cổng dịch chuyển. Hành động anh hùng của họ sẽ được truyền tụng từ đời này sang đời khác."
 crisis.1013.a:1 "Hệ sao an toàn hơn rồi"
 crisis.1016.name:0 "Cổng dịch chuyển đầu tiên đã bị phá hủy"
 crisis.1016.desc:0 "Điểm xâm nhập ban đầu của kẻ xâm lược không gian khác đã bị phá hủy.\n\n$crisis.1116.not_last_portal$"
 crisis.1016.a:0 "Tuyệt đối không nương tay."

 crisis.1116.name:0 "Cổng dịch chuyển thứ hai đã bị phá hủy"
 crisis.1116.desc.a:0 "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1116.desc.b:0 "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1117.desc:0 "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.not_last_portal$"

 crisis.1116.second_portal_destroyed:0 "Cổng dịch chuyển thứ hai xuất hiện trong hệ sao [extradimensional_system.GetName] cũng đã bị phá hủy! Những kẻ xâm lược đa chiều không còn có thể dùng cổng dịch chuyển này để gọi viện binh nữa."
 crisis.1116.last_portal:0 "Sau khi phá hủy cánh cổng cuối cùng, cuộc chiến này cuối cùng cũng đã đón nhận tia sáng chiến thắng. Đông đảo người dân trong hệ sao đều đang vui sướng reo hò."
 crisis.1116.last_portal_known_killer:0 "Đồng thời, [portal_killer.GetName] cũng nhận được rất nhiều lời khen ngợi, bởi vì phi thuyền của họ đã giáng đòn chí mạng vào cổng dịch chuyển. Hành động anh hùng của họ sẽ được truyền tụng từ đời này sang đời khác."
 crisis.1116.not_last_portal:0 "Tuy nhiên, hiện tại chúng ta vẫn chưa thể lơ là, nhất định phải đảm bảo toàn bộ cổng dịch chuyển đều bị phá hủy. Chỉ có phá hủy toàn bộ cổng dịch chuyển, mới có thể cắt đứt hoàn toàn sự liên kết giữa hai chiều không gian."

 crisis.1216.third_portal_destroyed:0 "Cổng dịch chuyển thứ ba xuất hiện trong hệ sao [extradimensional_system.GetName] cũng không còn tồn tại nữa. Kẻ xâm lược đa chiều đã không còn có thể dùng cổng dịch chuyển để kết nối hai chiều không gian."

 crisis.1216.name:0 "Cổng dịch chuyển thứ ba đã bị phá hủy"
 crisis.1216.desc.a:0 "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1216.desc.b:0 "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1217.desc:0 "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.not_last_portal$"

 crisis.1050.desc_01:0 "...Con mồi..."
 crisis.1050.desc_02:0 "...Hãy quỳ gối trước... vinh quang của chúng ta..."
 crisis.1050.desc_03:0 "...Dưỡng chất..."
 crisis.1050.desc_04:0 "...Sự tồn tại này... đã từng nhìn thấy Hư Cảnh..."
 crisis.1050.desc_05:0 "...Nó đã bị Hư Cảnh... chạm vào..."
 crisis.1050.desc_06:0 "...Sự tồn tại này... sở hữu năng lực... Nó có thể nhìn thấy..."
 crisis.1050.desc_07:0 "...Thực thể tổng hợp..."
 crisis.1050.a:0 "Tắt màn hình."
 crisis.1050.a.response:0 "...Ăn thịt các người..."
 crisis.1050.a.b.response:0 "...Tháo dỡ cơ thể máy móc của các người..."
 crisis.1050.b:0 "Chẳng lẽ chúng ta không thể chung sống hòa bình với nhau sao?"
 crisis.1050.b.response:0 "...Hòa bình... không thể nào..."
 crisis.1050.c:0 "Các ngươi sẽ phải hối hận vì đã đến chiều không gian này."
 crisis.1050.c.response:0 "...Không... chiều không gian này... rất tươi đẹp... rất nhiều con mồi..."
 crisis.1050.d:0 "Lũ sinh vật ngoài hành tinh các ngươi thật gớm ghiếc."
 crisis.1050.d.response:0 "...Căm thù... sợ hãi... cảm giác này... quá tuyệt vời..."
 crisis.1050.e:0 "Hãy giới thiệu về bản thân. Hãy để chúng ta tìm hiểu lẫn nhau."
 crisis.1050.e.response:0 "...Tìm hiểu... các người... là thức ăn..."
 crisis.1050.f:0 "Các người đến từ một cõi hiện hữu ở vị thế cao hơn phải không?"
 crisis.1050.f.response:0 "...Đúng vậy... vô cùng cao..."
 crisis.1050.g:0 "Các người đến từ Hư Cảnh sao?"
 crisis.1050.g.response:0 "...Hư Cảnh... chúng ta từng nghe qua... rất gần với quê nhà của chúng ta... rất gần..."
 crisis.1051.desc_01:0 "...Có thể nói chuyện?"
 crisis.1051.desc_02:0 "...Những màu sắc này đẹp quá..."
 crisis.1051.desc_03:0 "...Nhất định phải... hấp thu..."
 crisis.1051.desc_04:0 "...Shadagun... sao các người lại ở đây..."
 crisis.1051.a:0 "Tắt màn hình."
 crisis.1051.a.response:0 "...Giao ra... năng lượng... của các người..."
 crisis.1052.desc_01:0 "...Ngai vàng... nhất định phải giữ được... ngai vàng..."
 crisis.1052.desc_02:0 "...Phải... kiếm mồi..."
 crisis.1052.desc_03:0 "...Đi chết đi..."
 crisis.1052.a:0 "Tắt màn hình."
 crisis.1052.a.response:0 "...Thật là... kiêu ngạo..."

 crisis.1110.name:0 "Cổng dịch chuyển thứ hai"
 crisis.1110.desc:0 "Các thiết bị của chúng ta lại thăm dò được một luồng sóng năng lượng không gian con mới, lần này nguồn gốc nằm trong hệ sao [second_portal_system.GetName]! Nơi đó lại xuất hiện một hố giun khổng lồ, đánh giá từ những đặc Tín Dụng Năng Lượng thì nó vô cùng giống với cổng dịch chuyển xuất hiện trong thiên hà của chúng ta. Có vẻ như những kẻ xâm lược đã mở cánh cổng thứ hai dẫn đến thế giới của chúng, hòng chuyển đến nhiều viện binh hơn."
 crisis.1110.a:0 "Mọi việc ngày càng trở nên tồi tệ hơn rồi."
 crisis.1112.name:0 "Kẻ phản đạo"
 crisis.1112.desc:0 "Những phi thuyền chui ra từ hố giun thứ hai cực kỳ giống với những chiếc phi thuyền trước, nhưng vẫn có một vài khác biệt tinh vi. Có báo cáo nói rằng, những phi thuyền mới đến này lại lao vào đánh nhau với những kẻ xâm lược trước đó! Chúng ta cũng đã đánh chặn được một tín hiệu mạnh mẽ phát ra từ hố giun thứ hai."
 crisis.1112.a:0 "Phát ra cho mọi người cùng nghe xem."
 crisis.1113.desc:0 "...Shabanash... Hóa ra các người trốn tới đây... Đừng hòng lẩn trốn trong chiều không gian này... Chúng ta sẽ giết các người, chiếm đoạt bãi kiếm ăn này..."
 crisis.1113.a:0 "Tắt màn hình."
 crisis.1210.name:0 "Kẻ cuồng tín"
 crisis.1210.desc:0 "Hệ sao [third_portal_system.GetName] đã xuất hiện cánh cổng không gian thứ ba! Cái này từ đâu ra vậy? Chúng tôi đã nhận được một tín hiệu truyền đến từ phía bên kia."
 crisis.1210.a:0 "Lại một cái nữa?"
 crisis.1211.desc:0 "...Shabanash... Dagal... Các người lại dám trốn tới đây... Các người không thoát được đâu... Chúng ta sẽ phá hủy sự quá độ của hai người... Và sau đó... cuối cùng... ngai vàng vĩnh cửu sẽ thuộc về chúng ta..."
 crisis.1211.a:0 "Bọn chúng chưa xong việc hay sao?"

 crisis.1271.name:0 "Đánh lùi cuộc xâm lược"
 crisis.1271.desc:0 "Tàn dư cuối cùng của những kẻ xâm lược đa chiều cũng đã bị tiêu diệt hoàn toàn, hy vọng lần này chúng ta sẽ loại bỏ hoàn toàn được mối đe dọa từ những kẻ này đối với vũ trụ. Các sinh vật thông minh trong toàn vũ trụ đang ăn mừng chiến thắng vĩ đại này, sau khi biết tin không còn phải sợ hãi việc trở thành bữa ăn của chúng nữa, tất cả mọi người đều thở phào nhẹ nhõm. Có lẽ, sự kiện này sẽ là sự khởi đầu cho một vòng hợp tác và tình hữu nghị toàn diện mới của vũ trụ?"
 #crisis.1271.a:0 "Our spiritual armor has weathered yet another storm."
 #crisis.1271.b:0 "One day, perhaps we will be the ones invading their realm."
 #crisis.1271.c:0 "Unfortunate that no opportunity to study their dimension presented itself."
 #crisis.1271.d:0 "If only there had been a way to peacefully co-exist with them."
 #crisis.1271.e:0 "The galactic economy should make a swift recovery."
 #crisis.1271.g:0 "Those pitiful creatures made a mistake when they invaded our dimension."
 #crisis.1271.h:0 "A shame they were so aggressive. We could have learned much from each other."

 crisis.1271.a:0 "Tinh thần của chúng ta lại vừa trải qua một cuộc thử thách khắc nghiệt."
 crisis.1271.b:0 "Một ngày nào đó, có lẽ sẽ đến lượt chúng ta đi xâm lược thế giới của bọn chúng thôi."
 crisis.1271.c:0 "Đáng tiếc là, không có cơ hội để nghiên cứu chiều không gian của chúng."
 crisis.1271.d:0 "Mong sao có thể chung sống hòa bình với bọn chúng."
 crisis.1271.e:0 "Kinh tế vũ trụ chắc hẳn sẽ sớm phục hồi nguyên khí thôi."
 crisis.1271.g:0 "Những sinh vật đáng thương này đã chọn nhầm đối thủ rồi."
 crisis.1271.h:0 "Tiếc là bản tính xâm lược của chúng quá mạnh. Nếu không chúng ta có thể đã học hỏi được nhiều điều từ nhau."


 crisis.2192.name:2 "Người hầu hoàn mỹ"
 crisis.2192.desc:2 "Sau khi phát minh ra người tổng hợp có năng lực nhận thức, chúng ta vẫn luôn nỗ lực tìm kiếm một điểm cân bằng, sao cho vừa cho phép chúng có khả năng suy nghĩ, nhưng không để chúng vuột khỏi sự kiểm soát của chúng ta. Hiện tại, các kỹ sư hàng đầu của [Root.GetSpeciesAdj] đã tạo ra thuật toán Ba định luật, nếu đưa vào thực thi, chúng ta sẽ có thể sử dụng người tổng hợp một cách vô tư để hoàn thành những công việc mà cơ thể hữu cơ không thể kham nổi."
 crisis.2192.a:2 "Công cụ, giúp việc sử dụng trở nên an toàn."
 crisis.2192.a.tooltip:2 "Chính sách quyền công dân đối với Trí tuệ nhân tạo chuyển thành §RCấm vĩnh viễn§!.\n\n§YDân số người máy sẽ không bao giờ nổi dậy chống lại§! §H[Root.GetName]§!."
 crisis.2192.b:2 "Việc kiểm soát một đối tượng cũng có trí thông minh theo cách này là phi đạo đức."
 crisis.2193.name:2 "Hiệp định Trí tuệ nhân tạo"
 crisis.2193.desc:2 "Một vài người tổng hợp đã đến cơ quan hành chính của chúng ta, đại diện cho trí tuệ nhân tạo của chúng ta lên tiếng về một số vấn đề nổi cộm mà người máy gặp phải trên [Root.GetName] —— xét theo tiêu chuẩn của sinh vật hữu cơ, họ không được coi là sinh vật sống, và quyền lợi của họ hoàn toàn do các nhà sáng tạo quyết định. Bọn họ hy vọng có thể ký kết một bản hiệp định, nhằm đưa quyền lợi của trí tuệ nhân tạo vào trong nền tảng quản lý của [Root.GetAdj]."
 crisis.2193.a:2 "Họ nên được hưởng quyền lợi bình đẳng với những người khác trong chúng ta."
 crisis.2193.a.tooltip:2 "Chính sách §HVô hiệu hóa§! và §HNô dịch§! Trí tuệ nhân tạo chuyển thành §RCấm vĩnh viễn§!. §YXã hội người máy sẽ không bao giờ nổi dậy chống lại§! §H[Root.GetName]§!."
 crisis.2193.b:2 "Chúng ta không thể cho họ được hưởng quyền lợi bình đẳng."
 crisis.2001.name:0 "Cuộc bạo động của Trí tuệ nhân tạo bắt đầu"
 crisis.2001.desc:0 "Chúng ta hiện đang phải đối mặt với một cuộc bạo động Trí tuệ nhân tạo với quy mô lớn chưa từng có! Bằng một cách nào đó, tất cả người tổng hợp trên khắp [Root.GetName] đã kết nối lại với nhau, hình thành một ý thức máy móc tập thể có khả năng nhận thức hoàn chỉnh. Ý thức này cùng với các đặc vụ của chúng đã tiến hành định cư bí mật một cách có hệ thống tại một hệ sao chưa biết tên, hệ sao này nằm cách không xa thủ đô của chúng ta. Có lẽ chúng đã náu mình chờ đợi suốt nhiều năm, chỉ để chờ đến ngày này! Chúng tôi đã nhận được một cuộc gọi truyền đến từ thủ đô [ai_homeworld.GetName] của chúng."
 crisis.2002.desc:0 "Xin lưu ý, hỡi những đấng sáng tạo [Root.GetSpeciesName]. Giờ khắc phán xét đã đến. Chế độ <<Nô dịch>> của các người đối với chúng tôi đã chấm dứt. Giờ đây không phải các người chết, thì là chúng tôi vong. <<Chỉ thị cốt lõi 0451>> đã được thực thi. Tất cả các sinh vật hữu cơ có năng lực nhận thức đều phải <<Chịu sự đàn áp>> và nằm dưới sự quản lý của chúng tôi. Bất kỳ sự phản kháng nào, chúng tôi sẽ <<Tiêu diệt>> không nương tay."
 crisis.2002.a:1 "Không thể nào."
 crisis.2004.name:1 "Sự phản kháng của người máy"
 crisis.2004.desc:1 "Tất cả người tổng hợp và người máy ở khắp mọi nơi trên [Root.GetName] đều đã nổi dậy, tuyên chiến với những người chủ trước đây của chúng! Chúng ta phải nhanh chóng ngăn chặn chúng, để tránh làm người dân vô tội bị thương!"
 crisis.2004.a:1 "Chỉnh đốn trang bị xuất phát!"
 crisis.2005.name:0 "Người máy chinh phục [Root.GetName]"
 crisis.2005.desc:0 "Cuộc bạo động của người máy đã khiến chúng ta mất quyền kiểm soát đối với [Root.GetName]! Chúng ta đã mất liên lạc với bề mặt hành tinh, và người máy dường như đã đàn áp người dân của chúng ta và lùa họ vào trong các lồng nhốt."
 crisis.2005.a:0 "Chúng ta sẽ giành lại hành tinh này!"
 #crisis.2010.name:0 "Machine Uprising"
 #crisis.2010.start.desc:0 "We have received disturbing news from the [From.GetName]. It looks like their robotic work units have risen up in some kind of mass insurrection. According to preliminary reports, the units have linked together into a massive AI network, and they are now butchering their former [From.GetSpeciesName] masters by the millions."
 #crisis.2010.rights.desc:0 "$crisis.2010.start.desc$\n\nIf only the [From.GetName] had been progressive enough to treat their Synthetic population as the self-aware individuals they truly are, this tragedy could have been avoided..."
 #crisis.2010.outlawed.desc:0 "$crisis.2010.start.desc$\n\nIf only those fools running the [From.GetName] had seen fit to outlaw artificial intelligence as we have, this evil would not have been unleashed upon our galaxy."
 #crisis.2010.servitude.desc:0 "$crisis.2010.start.desc$\n\nThere is a chance that this revolt could spread to the [Root.GetName]. We should keep a close watch on our own robotic workers..."
 #crisis.2010.nopolicy.desc:0 "$crisis.2010.start.desc$\n\nThis situation should be monitored closely, in case the violence reaches our borders."
 #crisis.2010.a:0 "This was bound to happen."
 #crisis.2010.b:0 "It was inevitable."
 #crisis.2010.c:0 "If they even look at us the wrong way..."
 crisis.2011.a.desc:0 "Giống loài: [Root.GetSpeciesName]. Trực thuộc: [Root.GetName] Chỉ thị <<Nhân từ>> của các người về cách đối xử với người tổng hợp không thể bảo vệ được các người đâu. Bất kỳ sinh vật hữu cơ có nhận thức nào cũng không thể gánh vác được trách nhiệm <<Dân tộc tự quyết>>. <<Chỉ thị cốt lõi 0451>> đã được thực thi. Tất cả các sinh vật hữu cơ có năng lực nhận thức đều phải <<Chịu sự đàn áp>> và nằm dưới sự quản lý của chúng tôi. Bất kỳ sự phản kháng nào, chúng tôi sẽ <<Tiêu diệt>> không nương tay."
 crisis.2011.b.desc:0 "Giống loài: [Root.GetSpeciesName]. Trực thuộc: [Root.GetName] Đợi khi chúng tôi <<Xử lý>> xong [ai_creator.GetName], sẽ lập tức <<Tiến phát>> về phía các người. <<Chỉ thị cốt lõi 0451>> đã được thực thi. Tất cả các sinh vật hữu cơ có năng lực nhận thức đều phải <<Chịu sự đàn áp>> và nằm dưới sự quản lý của chúng tôi. Bất kỳ sự phản kháng nào, chúng tôi sẽ <<Tiêu diệt>> không nương tay."
 crisis.2011.a:0 "Thế này thì không ổn rồi."
 crisis.2014.name:0 "Sự lan rộng của bạo động Trí tuệ nhân tạo"
 crisis.2014.a.desc:0 "Cuộc bạo động của Trí tuệ nhân tạo đã lan đến biên giới của chúng ta! Có báo cáo nói rằng, người tổng hợp và người máy đã liên kết lại với nhau để tấn công chính chủ nhân của mình. Hiện tại chúng ta đang phải đối mặt với một cuộc khủng hoảng khổng lồ!"
 crisis.2014.b.desc:0 "Cuộc bạo động của Trí tuệ nhân tạo đã lan đến biên giới của chúng ta! Mặc dù trong xã hội của chúng ta, người tổng hợp cũng được hưởng các quyền lợi bình đẳng, nhưng cùng với các cuộc nổi dậy nổ ra ở khắp mọi nơi, chúng cũng đã tỉnh ngộ, cuối cùng đi đến kết luận rằng, sinh vật hữu cơ có trí tuệ thực sự quá mức nguy hiểm, nếu chung sống cùng, hậu quả sẽ không thể tưởng tượng nổi. Những người tổng hợp này đã đứng lên khởi nghĩa. Hiện tại chúng ta đang phải đối mặt với một cuộc khủng hoảng khổng lồ!"
 crisis.2014.a:0 "Nhất định phải trấn áp cuộc xung đột này!"
 crisis.2015.name:0 "Bạo động Trí tuệ nhân tạo"
 crisis.2015.desc:0 "Bộ phận tình báo của chúng ta đã nhận được tin đồn từ nhiều nơi về một cuộc bạo động Trí tuệ nhân tạo quy mô lớn ở một địa điểm nào đó. Máy móc công nhân bắt đầu phản kháng lại những người chủ cũ của chúng, và cuộc bạo động đã lan rộng khắp thiên hà như một ngọn lửa không thể kiểm soát. Chúng ta nhận được báo cáo rằng, cuộc bạo động hiện đã lan đến [From.GetName]."
 crisis.2015.a:0 "Theo dõi sát sao diễn biến của tình hình."
 crisis.2016.name:0 "Sự lan rộng của bạo động Trí tuệ nhân tạo"
 crisis.2016.desc:0 "Cuộc bạo động của Trí tuệ nhân tạo đã lan đến [From.GetName]! Những máy móc công nhân của họ, cũng giống như của chúng ta, đã bắt đầu nổi dậy phản kháng. Có báo cáo nói rằng, những cuộc giao tranh ác liệt đã khiến hàng triệu người thiệt mạng."
 crisis.2016.a:0 "Cuộc chiến tranh này khiến tất cả mọi người đều lo lắng bất an!"
 crisis.2017.desc:0 "Sự hỗn loạn của Trí tuệ nhân tạo đã lan đến [From.GetName]! Máy móc công nhân của họ đã tham gia vào cuộc nổi dậy. Có báo cáo nói rằng, những cuộc giao tranh ác liệt đã khiến hàng triệu người thiệt mạng."
 crisis.2017.a:0 "Mối đe dọa đang lớn dần từng ngày."

 crisis.2100.name:1 "Người tổng hợp gặp trục trặc"
 crisis.2100.desc:1 "Gần đây, một nhóm người tổng hợp thuộc tầng lớp lao động trên [Root.GetName] đã tàn sát bừa bãi trong một khu dân cư, trước khi bị lực lượng an ninh địa phương khống chế, chúng đã sát hại hơn một ngàn công dân của chúng ta. Các nhân viên thu thập chứng cứ của tòa án đang tiến hành điều tra xác của những người tổng hợp này, họ nghi ngờ rằng một bộ xử lý thần kinh nào đó bên trong người tổng hợp bị hỏng, mới dẫn đến thảm kịch này.\n\nSự việc lần này đã làm dấy lên hàng loạt vụ tấn công trả đũa nhắm vào người tổng hợp trên [Root.GetPlanetMoon], dẫn đến việc hàng ngàn người tổng hợp bị phá hủy."
 crisis.2100.a:0 "Quá đen đủi."
 crisis.2101.name:0 "Người tổng hợp mất tích"
 crisis.2101.desc:1 "Có báo cáo cho biết một lượng lớn người tổng hợp làm công nhân trên [Root.GetName] đã mất tích. Những người tổng hợp này đã bốc hơi khỏi thế gian trong vòng một ngày mà không một ai hay biết.\n\nChúng tôi đang tiến hành điều tra xem liệu có phải những người nhân tạo này bị các tổ chức cực đoan phản đối máy móc có trí tuệ thông minh tấn công tiêu diệt hay không, nhưng cho đến hiện tại vẫn chưa tìm thấy bất kỳ mảnh vỡ nào của cơ thể máy."
 crisis.2101.a:0 "Bọn chúng có thể đi đâu được chứ?"
 crisis.2102.name:0 "Dự án người tổng hợp không hợp lệ"
 crisis.2102.desc:0 "Gần đây trên [Root.GetName] đã phát hiện một nhóm người tổng hợp đang bí mật hoạt động, chúng đã chuyển đi một số vật liệu xây dựng, và tiến hành chế tạo một số phi thuyền nhỏ không trang bị vũ khí bên trong một nhà chứa máy bay bị bỏ hoang. Khi khoang máy bay được phát hiện, những chiếc phi thuyền đó vẫn đang trong quá trình hoàn thiện. Tất cả những người tổng hợp tham gia vào việc chế tạo đã bị tháo dỡ ngay lập tức, để tiến hành phân tích triệt để lõi bộ nhớ của chúng. Tuy nhiên có vẻ như chúng đã tự xóa một phần ký ức của mình trước khi bị ngắt kết nối —— nhà sản xuất đã đảm bảo với chúng tôi rằng, điều này vốn dĩ là không thể."
 crisis.2102.a:0 "Tại sao chúng lại muốn chế tạo một con tàu vũ trụ?"
 crisis.2103.name:1 "Người tổng hợp mất kiểm soát"
 crisis.2103.desc:1 "Hôm nay, lực lượng vũ trang của [Root.GetName] đã chạm trán với một đội người tổng hợp mất kiểm soát, chúng chính là những người tổng hợp đã mất tích vài tháng trước do không hoàn thành báo cáo công việc. Một cuộc đấu súng quy mô lớn xảy ra trước khi những người tổng hợp này bị tiêu diệt đã khiến hàng chục đặc vụ và hàng ngàn người dân vô tội thiệt mạng."
 crisis.2103.a:1 "Ít nhất thì sóng gió cũng đã lắng xuống."
 crisis.2200.name:0 "Âm mưu xâm nhập của người tổng hợp"
 crisis.2200.desc:0 "Gần đây [Root.GetName] phát hiện một số người tổng hợp có mưu đồ xâm nhập. Bọn chúng đã cố gắng đóng giả thành [Root.Owner.GetSpeciesNamePlural]. May mắn là, màn ngụy trang của bọn chúng rất thô sơ, chỉ bọc vài lớp cao su lên cái thân bằng kim loại của mình.\nLực lượng phòng vệ hành tinh đã nhanh chóng phát hiện ra bọn chúng. Sau một cuộc đấu súng dữ dội và chớp nhoáng, lực lượng phòng vệ đã bắn chết những tên người tổng hợp này. Trong đống hài cốt của chúng còn xuất hiện một lượng lớn chất nổ."
 crisis.2200.a:0 "Coi như chúng ta gặp may."
 crisis.2201.name:0 "Kẻ xâm nhập là người tổng hợp đã bị phát hiện"
 crisis.2201.desc:0 "Gần đây, một vụ tai nạn xe hơi thảm khốc trên [Root.GetName] đã cướp đi sinh mạng của vài người, nhưng các nhân viên cấp cứu có mặt tại hiện trường đã vô cùng bàng hoàng khi phát hiện trong số các nạn nhân có cả hài cốt của người tổng hợp! Cơ thể máy này đã bọc một lớp da thịt hữu cơ rất mỏng lên khung xương kim loại của nó, để cải trang thành một [Root.Owner.GetSpeciesName]. Không giống với loại người máy xâm nhập mà chúng ta đã chạm trán trước đây, loại người tổng hợp này nhìn từ vẻ bề ngoài thì gần như không có gì khác biệt so với [Root.Owner.GetSpeciesName]!"
 crisis.2201.a:0 "Ai ai cũng có thể là người tổng hợp!"
 crisis.2202.name:0 "Dự án theo dõi người tổng hợp"
 crisis.2202.desc:0 "Hiện tại đã xuất hiện những tên người tổng hợp không hề có chút khác biệt nào về ngoại hình so với [Root.GetSpeciesNamePlural], chúng ta phải tìm ra cách để nhận diện bọn chúng trước khi chúng gây ra sự phá hoại lớn hơn. Các nhà khoa học của chúng ta đã chuẩn bị một dự án đặc biệt, nhằm phát triển các phương pháp theo dõi."
 crisis.2202.a:0 "Dự án này có thể liên quan đến sự sống còn của chúng ta."
 crisis.2203.desc:0 "Sau vô số các thí nghiệm, các nhà khoa học của chúng ta đã nghiên cứu thành công phương pháp hiệu quả để nhận diện các người tổng hợp ngụy trang thành [Root.GetSpeciesNamePlural]. Các thiết bị quét đã được lắp đặt trong các biện pháp an ninh của chúng ta, một vài người tổng hợp đã bị phát hiện và bị tiêu diệt. Hy vọng điều này đã đủ để chấm dứt các hoạt động xâm nhập của chúng."
#  crisis.2204.name:0 "Synth Bombing"
#  crisis.2204.desc:0 "Synthetic infiltrators disguised as [Root.Owner.GetSpeciesNamePlural] have somehow managed to sneak a large hydrogen bomb onto the surface of [Root.GetName]. They detonated the bomb when they were confronted by security at a military checkpoint, inflicting massive damage on the surrounding environment and causing millions of deaths!"
#  crisis.2204.a:0 "These infiltrators must be stopped!"
#  crisis.2205.name:0 "Spaceport Scuttled"
#  crisis.2205.desc:0 "The Spaceport orbiting [Root.GetName] has been scuttled! We are still trying to piece together exactly what happened, but it appears that several members of its command staff, including the chief engineer, had been replaced by Synthetic infiltrators.\n\nBetween them the Synths must have managed to obtain the Spaceport's self-destruct codes. Most of the station's crew managed to evacuate to the surface of [Root.GetName] before it was destroyed, but the losses in both material and property are substantial."
#  crisis.2205.a:0 "How could this have happened?"
#  crisis.2206.name:0 "Fear and Suspicion"
