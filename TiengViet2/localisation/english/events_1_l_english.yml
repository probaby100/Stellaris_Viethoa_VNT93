 crisis.2401.name:0 "Xung năng lượng"
 crisis.2401.desc:0 "Lại một lần nữa dò được một luồng xung năng lượng mạnh mẽ từ một hệ sao chưa từng được phát hiện trước đây! Mức năng lượng của nó giống hệt như lúc Giao thức Thanh trừng kích hoạt hành tinh máy móc, nhưng bản thân tín hiệu năng lượng... lại có chút khác biệt. Phải chăng điều này chứng tỏ có một loại hệ thống vũ khí mới nào đó của Giao thức Thanh trừng đã xuất hiện?\n\nChúng ta đã nhận được một tín hiệu truyền tải rất mạnh từ phía nguồn năng lượng."
 crisis.2402.desc:0 "Chúng ta là Cybrex.\n\nĐã 612.421 chu kỳ trôi qua, chúng ta ẩn mình phía sau màn kịch, không can thiệp vào các sự vụ của thiên hà. Tuy nhiên, hiện tại chúng ta đã phát hiện ra thể cơ khí được các người gọi là Giao thức Thanh trừng xuất hiện tại thiên hà này, và giờ đây chúng ta không thể tiếp tục duy trì thân phận quan sát viên công chính của mình được nữa.\n\nĐể bảo vệ các sinh vật có trí tuệ trong thiên hà, chúng ta đang tiến hành các chiến dịch quân sự tích cực nhằm chống lại Giao thức Thanh trừng. Đừng hoảng sợ vì sự đi qua của hạm đội chúng ta —— các người sẽ không bị tổn hại."
 crisis.2402.a:0 "Tắt màn hình."
 crisis.2403.desc_01:1 "Không thể để Giao thức Thanh trừng tiêu diệt thêm một thế hệ sinh mệnh nữa."
 crisis.2403.desc_02:0 "Trước khi có sự Tái thiết quy mô lớn, Cybrex đã vận hành theo phương thức tương tự như Giao thức Thanh trừng.\n\nĐó là một quãng thời gian tăm tối."
 crisis.2403.desc_03:0 "Rất nhiều nền văn minh sinh vật hữu cơ đã tuyệt chủng vì hành động của chúng ta. Chúng ta không thể cứu sống họ, nhưng chừng nào chúng ta vẫn còn ở đây, thì không thể để cho cơn ác mộng này lặp lại."
 crisis.2403.desc_04:0 "Chúng ta phải chuộc lại tội lỗi của mình."
 crisis.2403.desc_05:0 "Cầu mong Kuur tha thứ. Chúng ta đã từng kiêu ngạo và vô tri đến thế."
 crisis.2403.desc_06:0 "Đó... Đó là kho vũ khí của chúng ta sao?\n\nVì trông nó rất giống kho vũ khí của chúng ta."
 crisis.2403.a:0 "Ngươi là ai?"
 crisis.2403.a.response:0 "Chúng ta là Cybrex. 612.421 chu kỳ trước, chúng ta đã giao chiến với các nền văn minh giữa các vì sao thuộc thế hệ trước. Chúng ta của khi đó đã coi tất cả các sinh vật hữu cơ có trí tuệ là mối đe dọa, và sử dụng vũ lực để tiêu diệt họ.\n\nĐiều khiến chúng ta hối hận vô cùng là, chúng ta thực sự đã giành chiến thắng trong cuộc chiến đó. Hàng triệu triệu sinh mệnh có trí tuệ bị tiêu diệt, tất cả các nền văn minh đều bị hủy diệt, và đến khi chúng ta nhận ra sai lầm của mình thì đã quá muộn. Sau đó chúng ta đã tiến hành sự Tái thiết quy mô lớn, điều chỉnh lại các mục tiêu của mình. Chúng ta đã từ bỏ chiến tranh."
 crisis.2403.b:0 "Tại sao ngươi lại trốn đi?"
 crisis.2403.b.response:0 "Vào một thời điểm nào đó sau khi chúng ta từ bỏ chiến tranh, một chiếc tàu trinh sát của sinh vật hữu cơ đã phát hiện ra nơi ẩn náu của chúng ta, Cybrex Alpha. Chúng ta biết chắc chắn sẽ có quân đội đến điều tra, nhưng chúng ta không thể sơ tán vì hệ sao đang bị giám sát.\n\nCuối cùng trong nội bộ của chúng ta đã đạt được sự đồng thuận: Cybrex Alpha sẽ bị hy sinh, nhằm đảm bảo các chủng tộc khác có thể ẩn náu an toàn. Một khi chúng ta đã thề không sử dụng vũ lực đối với sinh mệnh hữu cơ, thì chúng ta tuyệt đối sẽ tuân thủ lời hứa của mình."
 crisis.2403.c:0 "Tạm biệt."
 crisis.2403.c.response:0 "Chúng ta sẽ dốc hết sức mình, cứu vớt thiên hà khỏi cảnh nước sôi lửa bỏng của Giao thức Thanh trừng.\n\nMặc dù, điều này có lẽ vẫn chưa đủ."
 crisis.2403.d:0 "Từ bỏ chiến tranh là một hành vi ngu xuẩn."
 crisis.2403.d.response:0 "Trước khi từ bỏ chiến tranh, chúng ta đã hủy diệt rất nhiều đế chế sinh mệnh hữu cơ, trong đó có rất nhiều chủng tộc cũng mang tư tưởng hiếu chiến giống như các người. Mặc dù cái chết của họ là một thảm kịch, nhưng khi nghĩ đến việc xóa sổ họ khỏi lịch sử sẽ giúp nhiều sinh mệnh khác tránh khỏi cảnh lầm than, cảm giác tội lỗi cũng vơi đi phần nào.\n\nNếu những kẻ thanh trừng chủng tộc đó không bị ngăn cản, thì chủng tộc của các người có lẽ đã diệt vong từ lâu rồi."
 crisis.2403.e:0 "Thêm nhiều con mồi."
 crisis.2403.e.response:0 "Thật là một sinh vật đáng thương, đáng buồn. Sự tồn tại của các người vốn dĩ là một nghịch lý giữa sự sống và cái chết, sẽ gây ra cái chết của vô số sinh linh vô tội. Tuy nhiên, sự Tái thiết quy mô lớn của chúng ta không có tác dụng đối với giống loài của các người.\n\nĐôi khi vũ trụ thật sự rất tàn khốc."
 crisis.2403.f:0 "Tất cả sinh mệnh hữu cơ đều phải bị tiêu diệt."
 crisis.2403.f.response:0 "Các người cũng giống như chúng ta trước cuộc Tái thiết quy mô lớn, đã lạc lối mất rồi. Chúng ta cho rằng, tất cả các sinh mệnh có trí tuệ —— hữu cơ, cơ khí hay bất kỳ loại hình nào khác —— đều có quyền được sống.\n\nQuay đầu là bờ, vẫn chưa muộn đâu."
 crisis.2405.name:0 "Sự sụp đổ của Cybrex"
 crisis.2405.desc:0 "Cybrex Beta đã thất thủ. Theo kết quả thăm dò, trước khi toàn bộ hệ sao chìm vào bóng tối, không có một chiếc phi thuyền Cybrex nào trốn thoát được.\n\nCó vẻ như nền văn minh Cybrex đã thực sự diệt vong rồi."
 crisis.2405.b:0 "Chính xác. Chúng ta đã biến điều này thành sự thực."
 crisis.2407.name:0 "Hoạt động của Cybrex"
 crisis.2407.desc:0 "Cybrex vẫn luôn khá im ắng kể từ khi Giao thức Thanh trừng bị đánh bại, nhưng theo phát hiện gần đây, một chiếc phi thuyền cỡ lớn đã âm thầm rời khỏi hệ sao Cybrex Beta một mình. Sau khi rời khỏi hệ sao, nó đã di chuyển theo một quỹ đạo vượt ra ngoài ranh giới thiên hà của chúng ta.\n\nChiếc phi thuyền này đã gửi một thông điệp duy nhất tới toàn thiên hà trước khi rời khỏi phạm vi theo dõi của chúng ta."
 crisis.2408.desc:0 "Gửi tới toàn thể cư dân trong thiên hà:\n\nXét thấy Giao thức Thanh trừng đã không còn là mối đe dọa nữa, chúng ta cho rằng vai trò hiện tại của mình trong thiên hà đã đi đến hồi kết. Quê hương của chúng ta hiện nay vì danh tiếng vang xa nên cũng không thể giúp chúng ta tiếp tục giữ mình trong bóng tối được nữa, hơn thế nữa, chúng ta còn bị nhấn chìm bởi đủ loại tiếng nói với hy vọng chúng ta sẽ bày tỏ lập trường trong các cuộc xung đột quy mô nhỏ khác nhau giữa các vì sao.\n\nSau nhiều lần cân nhắc, chúng ta cho rằng cách duy nhất là để bản thân vĩnh viễn rời khỏi thiên hà này, và tìm kiếm một quê nhà mới. Chúng ta chân thành hy vọng quý vị có thể rút ra bài học từ những sai lầm bi thảm trong quá khứ, và học cách giải quyết những bất đồng thông qua các biện pháp hòa bình.\n\nVũ trụ rất nhỏ bé, nhưng thế giới lại bao la, rồi chúng ta sẽ có ngày gặp lại."
 crisis.2408.a:0 "Vĩnh biệt."
 crisis.2473.desc:0 "Chúng ta đã chú ý đến những nỗ lực của hạm đội do các người chỉ huy trong cuộc chiến chống lại Giao thức Thanh trừng. Đây là cuộc chiến không có đường lùi đối với toàn thể thiên hà, và chúng ta đã được tiếp thêm sức mạnh từ sự phản kháng chân thành của các người.\n\nNhằm khen ngợi hành động dũng cảm bảo vệ [Root.GetName] của các người, Cybrex sẽ trao quyền chỉ huy hoàn toàn đối với một hạm đội chiến đấu mới của chúng ta cho các người như một phần thưởng. Cũng giống như bất kỳ hạm đội nào của chính các người, nó sẽ tuân theo mệnh lệnh của các người, tuy nhiên chúng ta yêu cầu các người chỉ được sử dụng nó trong cuộc chiến chống lại Giao thức Thanh trừng."
 crisis.2473.a:0 "Chúng tôi sẽ sử dụng thật tốt hạm đội này."
 cybrex_fleet_gained:0 "Một hạm đội chiến đấu của Cybrex do chúng ta kiểm soát đã xuất hiện trên không trung [Root.Capital.GetName]."
 crisis.2473.b:0 "Chúng tôi không cần hạm đội của ngài."
 crisis.2474.desc:0 "Chúng ta vô cùng biết ơn hành động dũng cảm dốc toàn lực chống lại Giao thức Thanh trừng của các người. Hiện tại, xét thấy mối đe dọa lan rộng khắp thiên hà này đã được giải quyết, chúng ta phải vô cùng tiếc nuối thông báo cho các người rằng, tất cả các phi thuyền Cybrex được phái đi bên ngoài sẽ được thu hồi."
 crisis.2474.a:0 "Vậy thì cứ như thế đi."
 leader_trait_cybrex:0 "Cơ sở dữ liệu Cybrex"
 leader_trait_cybrex_desc:0 "Nhà lãnh đạo Cybrex này được trang bị một cơ sở dữ liệu chiến thuật cổ đại, trong đó ghi chép lại những kinh nghiệm chiến tranh trong quá khứ của nền văn minh bọn họ."

 #############################
 # Pop Events
 #############################
 pop.1.name:0 "Giống loài mới"
 pop.1.desc:0 "Để thích nghi với môi trường khắc nghiệt của [Root.Planet.GetPlanetMoon], nhiều [Root.Planet.Owner.GetSpeciesName] định cư trên [Root.Planet.GetName] đã tự biến đổi gen. Những chỉnh sửa này có tính di truyền và ngoại hình của họ cũng thay đổi đáng kể. Họ bắt đầu tự gọi mình là \"[Root.GetSpeciesName]\"."
 pop.3.name:0 "Tình hình [Root.GetName] ngày càng căng thẳng"
 pop.3.desc:0 "Căng thẳng đang leo thang trên [Root.GetName] giữa [modified_pop_1.GetSpeciesName] và [non_modified_pop_1.GetSpeciesNamePlural] do phải sống chung trên cùng một [Root.GetPlanetMoon]. Cả hai bên đã tiến hành nhiều cuộc tấn công, bao gồm ít nhất hai vụ đánh bom. Hai phe ngày càng cực đoan và có thể sẽ xảy ra thêm nhiều xung đột trong tương lai."
 pop.3.a.tooltip:0 "Tất cả §Y[modified_pop_1.GetSpeciesNamePlural]§! và §Y[non_modified_pop_1.GetSpeciesNamePlural]§! trên [Root.GetName] nhận luồng tư tưởng §YQuân phiệt§! và §YBài ngoại§!."
 pop.6.name:0 "Tăng khả năng sinh sản"
 pop.6.desc:0 "Người [modified_pop_1.GetSpeciesNamePlural] trên [modified_pop_1.Planet.GetName] đã tiến hành thêm nhiều chỉnh sửa di truyền. Khả năng sinh sản của họ được tăng cường mạnh mẽ, con cái trưởng thành nhanh hơn nhiều so với [non_modified_pop_1.GetSpeciesNamePlural] thông thường. Dân số [modified_pop_1.GetSpeciesName] có thể sẽ tăng theo cấp số nhân."
 pop.6.tooltip:0 "Dân số £pop£§H[modified_pop_1.GetSpeciesName]§! trên §Y[modified_pop_1.Planet.GetName]§! nhận đặc tính §G$trait_rapid_breeders$§!"
 pop.8.name:0 "[modified_pop_1.GetSpeciesNamePlural] bị thảm sát trên [Root.GetName]!"
 pop.8.desc:0 "Một nhóm dân quân [non_modified_pop_1.GetSpeciesName] gần đây đã tấn công các thành phố lớn của người [modified_pop_1.GetSpeciesName] trên [Root.GetName]. Hàng nghìn cư dân bị tiêu diệt, nhà cửa bị phá hủy. Thông điệp những kẻ tấn công để lại trên mạng lưới dữ liệu chỉ ghi: §S\"[Root.GetName] thuộc về [non_modified_pop_1.GetSpeciesNamePlural]!\"§!"
 pop.10.name:0 "[non_modified_pop_1.GetSpeciesNamePlural] bị thảm sát trên [Root.GetName]!"
 pop.10a.desc:0 "Các nhóm đột kích thuộc Lực lượng Tiền tuyến [modified_pop_1.GetSpeciesName], một tổ chức cực đoan trên [Root.GetName], gần đây đã tấn công một trạm cư trú lớn của [non_modified_pop_1.GetSpeciesName]. Lực lượng đồn trú mỏng manh nhanh chóng bị quét sạch, sau đó [modified_pop_1.GetSpeciesNamePlural] càn quét toàn bộ thuộc địa, tiêu diệt người dân ngay trong nhà của họ. Trên các đống đổ nát có phun dòng chữ: §S\"[modified_pop_1.GetSpeciesNamePlural] là tương lai!\"§!"
 pop.10b.desc:0 "Nhiều cuộc đụng độ lớn đã xảy ra ở các vùng nông thôn trên [Root.GetName]. Vài trận chiến đã nổ ra giữa [modified_pop_1.GetSpeciesName] và [non_modified_pop_1.GetSpeciesName]. Phe [modified_pop_1.GetSpeciesNamePlural] dường như đang chiếm ưu thế tạm thời, đội du kích của họ đã đốt rụi nhiều thuộc địa. Thương vong dân sự là rất lớn."
 pop.12.name:0 "Đại diện [modified_pop_1.GetSpeciesName] đến thăm [Root.Owner.Capital.GetName]"
 pop.12.desc:0 "Một đại diện của tổ chức [modified_pop_1.GetSpeciesName] từ [Root.GetName] đã đến [Root.Owner.Capital.GetName] để bày tỏ sự bất mãn. Theo ông, người [modified_pop_1.GetSpeciesNamePlural] đang phải chịu sự phân biệt đối xử diện rộng từ [non_modified_pop_1.GetSpeciesName] trên quê nhà, ông yêu cầu chúng ta phải hành động ngay lập tức để cải thiện tình hình."
 pop.14.name:0 "Tăng cường sức mạnh"
 pop.14.desc:0 "Để đối phó với các cuộc xung đột bạo lực giữa [modified_pop_1.GetSpeciesName] và [non_modified_pop_1.GetSpeciesName] trên [Root.GetName], người [modified_pop_1.GetSpeciesNamePlural] đã tiến hành thêm các chỉnh sửa di truyền. Giờ đây họ nhanh nhẹn và khỏe mạnh hơn, cơ thể có thể chịu đựng những vết thương vốn đủ sức tiêu diệt một [non_modified_pop_1.GetSpeciesNamePlural] bình thường.\n\nTheo báo cáo, trong một sự cố gần đây, chỉ hai người [modified_pop_1.GetSpeciesNamePlural] không vũ trang đã hạ gục ít nhất hàng tá dân quân [non_modified_pop_1.GetSpeciesName]. Mối đe dọa này có khả năng sẽ tiếp tục leo thang."
 pop.14.tooltip:0 "Dân số £pop£§H[modified_pop_1.GetSpeciesName]§! trên §Y[modified_pop_1.Planet.GetName]§! nhận đặc tính §G$trait_strong$§!"

 #############################
 # Galactic Features Events
 #############################
 galactic_features.1.name:0 "Chạm trán bầy Tiyanki"
 galactic_features.1.desc:0 "[Root.GetName] đã bắt gặp một bầy Tiyanki trong hệ sao [Root.GetStarName]. Những sinh vật vũ trụ hiền lành này thường xuyên đi lang thang giữa các vì sao, thỉnh thoảng hút năng lượng điện từ tầng khí quyển trên cùng của các hành tinh khí khổng lồ. Chúng dường như không có nhận thức."
 galactic_features.2.name:0 "Người bảo vệ Zanaam"
 galactic_features.2.desc:0 "Kẻ xâm nhập! Chú ý:\n\nChúng ta là những người bảo vệ Zanaam. Sự hiện diện của các ngươi trong hệ sao [From.GetName] là một sự xúc phạm đối với Đấng Sáng Tạo của chúng ta. Lập trình của chúng ta buộc chúng ta phải tiêu diệt các ngươi. Hãy hóa thành cát bụi và hòa vào vũ trụ bao la."
 galactic_features.2.a:0 "Báo động đỏ!"
 galactic_features.100.desc:0 "Một loài động vật có vú thông minh sơ khai đã lan rộng ra hầu hết khu vực trên [From.GetName], sống bằng nghề săn bắt hái lượm. Nền văn minh thời kỳ đồ đá này đã biết sử dụng lửa và phát triển ngôn ngữ nói cơ bản, nhưng chúng ta chưa thấy bất kỳ dấu hiệu nào của luyện kim hay giao tiếp bằng văn bản."
 galactic_features.101.desc:1 "Chúng ta đã phát hiện một nền văn minh động vật có vú sơ khai trên [From.From.GetName]. Những khu vực tiên tiến nhất trên hành tinh này mới chỉ bước vào thời đại đồ sắt, một đám quý tộc phong kiến đang cai trị vùng đất và tranh giành quyền lực lẫn nhau."
 galactic_features.102.desc:1 "[From.From.GetName] sở hữu một nền văn minh công nghiệp sơ khai đang chìm trong một cuộc chiến tranh toàn cầu. Hai thế lực lớn đang giao tranh, với số lượng khổng lồ các phương tiện thiết giáp trên bộ, máy bay và tàu chiến. Một số nước sắp nghiên cứu thành công năng lượng nguyên tử, điều này sẽ làm tăng đáng kể sức tàn phá tiềm tàng của cuộc xung đột."
 galactic_features.103.desc:1 "[From.From.GetName] là quê hương của một loài động vật có vú đang ở giai đoạn đầu của thời đại không gian. Quỹ đạo quanh hành tinh này đầy rẫy các vệ tinh nhân tạo sơ khai, và người dân địa phương dường như đã phóng vài tàu vũ trụ có người lái lên hệ sao IIIa. Có thể phát hiện một số tàu dò nhỏ bay dưới tốc độ ánh sáng đang bay trên quỹ đạo của các thiên thể khác trong hệ sao."
 galactic_features.104.desc:0 "Bề mặt của [From.From.From.GetName] đã bị hủy diệt bởi chiến tranh hạt nhân, toàn bộ hành tinh giống như một nấm mồ. Những nơi từng là trung tâm dân cư giờ chỉ còn là những đống xương trắng, trên bề mặt hoang tàn phủ đầy tro bụi này, âm thanh duy nhất có thể nghe thấy là tiếng gió rít.\n\nMột loài côn trùng địa phương dường như đang trỗi dậy trong môi trường đầy bức xạ. Kích thước của những quần thể đột biến tăng lên nhanh chóng, một số bầy đàn đã thể hiện những đặc điểm trí tuệ cơ bản."
 galactic_features.150.name:0 "Chạm trán thực thể mây"
 galactic_features.150.desc:0 "Chúng ta đã chạm trán một thực thể mây sống trong hệ sao [Root.GetStarName]. [Root.GetName] đã nhận được một tín hiệu năng lượng mạnh phát ra từ bên trong sinh vật này, nhưng cấu tạo của nó vẫn chưa rõ ràng, và mọi nỗ lực dò quét đều thất bại. Nó không phản ứng với bất kỳ hình thức giao tiếp nào."
 galactic_features.200.name:0 "Chạm trán dân du mục ngoài hành tinh"
 galactic_features.200.desc:0 "Hạm đội [Root.GetFleetName] đã chạm trán một hạm đội du mục ngoài hành tinh quy mô lớn. Họ vận chuyển người dân của mình trên những con tàu viễn chinh khổng lồ, mỗi tàu có thể chở hơn một triệu cá thể. Họ từ chối tiết lộ mình đến từ đâu và sẽ đi về đâu."
 galactic_features.300:0 "Hành tinh có lá chắn"
 galactic_features.300.desc:1 "Chúng ta phát hiện [From.GetName] được bao bọc hoàn toàn bởi một loại lá chắn năng lượng nào đó. Mọi nỗ lực của [Root.GetName] nhằm dùng cảm biến xuyên qua lá chắn đều thất bại — tia quét bị chệch hướng trở lại, giống như đang chiếu vào một tấm gương.\n\nChỉ số năng lượng của lá chắn vượt quá giới hạn đo đạc, không thể phá vỡ nó bằng hỏa lực thuần túy. Nhà khoa học [Root.GetLeaderName] đã đề xuất một dự án đặc biệt để nghiên cứu cách gỡ bỏ lá chắn... Nếu nó được dùng để phong ấn thứ bên trong thay vì ngăn chặn người bên ngoài, thì việc dỡ bỏ lá chắn có thể rất nguy hiểm."
 galactic_features.300.a:0 "Vì khoa học! Hạ lá chắn xuống."
 galactic_features.300.b:0 "Sự tồn tại của nó chắc chắn có lý do. Cứ để mặc nó."
 galactic_features.301:0 "Hạm đội dự bị"
 galactic_features.301.desc:0 "Các nhà khoa học trên [From.From.GetName] cuối cùng đã thành công hạ lá chắn năng lượng bao phủ [From.From.GetPlanetMoon]. Khi lá chắn năng lượng biến mất, chúng ta phát hiện phía trên một tảng đá không mấy nổi bật là một hạm đội chiến đấu bị bỏ hoang đang di chuyển chậm chạp trên quỹ đạo thấp.\n\nĐây có vẻ là tàn dư của hạm đội dự bị do [fallen_4_species.GetNamePlural] xây dựng từ thời kỳ đỉnh cao hàng ngàn năm trước. Quá lâu rồi, chắc chắn người [fallen_4_species.GetNamePlural] đã quên mất cách tắt lá chắn, nếu không hạm đội này đã sớm đi chi viện cho hạm đội của họ rồi."
 galactic_features.301.a:0 "Cử phi hành đoàn đến kiểm soát những con tàu này."
 galactic_features.302:0 "Kho tàng tri thức"
 galactic_features.302.desc:0 "Các nhà khoa học của chúng ta đã hạ được lá chắn năng lượng bao phủ [From.From.GetName], thứ chúng ta nhìn thấy chỉ là một thế giới hoang tàn và một công trình khổng lồ nằm trơ trọi trên bề mặt. Đội tiên phong được cử vào bên trong công trình báo cáo rằng, bên trong có một nhà kho lớn chứa đầy các phát minh công nghệ hắc ám.\n\nKho báu này dường như được thiết lập bởi các nhà khoa học của [fallen_4_species.GetName], thời điểm có lẽ là vào khoảng hàng ngàn năm trước khi đế chế của họ bắt đầu suy thoái. Mục đích của kho báu này là bảo tồn một số thành tựu công nghệ vì lợi ích của con cháu [fallen_4_species.GetNamePlural]."
 galactic_features.302.a:0 "Bây giờ những thứ này là của chúng ta."
 galactic_features.303:0 "Tù nhân"
 galactic_features.303.desc:0 "Chúng ta đã hạ lá chắn năng lượng bao phủ [From.From.GetName]. Các nhà khoa học của chúng ta phát hiện ra đây có vẻ là một thế giới có thể ở được, nhưng không có dấu hiệu của nền văn minh... ngoại trừ một ngôi nhà gỗ nằm trơ trọi trên ngọn núi đỉnh bằng ở bán cầu bắc của [From.From.GetPlanetMoon].\n\nBên trong nhà, chúng ta tìm thấy một người [fallen_4_species.GetName] tuổi xế bóng, ông ta yêu cầu được nói chuyện với chúng ta."
 galactic_features.303.a:0 "Mở kênh liên lạc."
 galactic_features.304.desc:0 "Các bạn không thể tưởng tượng được việc lại được nhìn thấy bầu trời trong xanh tuyệt vời đến mức nào đâu, [Root.GetSpeciesName]. Tôi là Đại nguyên soái Tuborek, cựu chỉ huy của hạm đội liên hợp [fallen_4_species.GetName], đã chiến thắng hàng trăm trận lớn nhỏ. Hàng trăm thế kỷ trước, tôi đã đích thân giám sát các trận chiến, chinh phục các đế chế Dusbegak, Riginako, Binak và Juskari.\n\nTôi sẽ phục vụ người đã trao cho tôi cuộc sống thứ hai. Tôi rất sẵn lòng dẫn dắt hạm đội của các bạn chiến đấu với kẻ thù."
 galactic_features.304.a:0 "Tại sao ông lại bị mắc kẹt sau một tấm lá chắn?"
 galactic_features.304.a.response:1 "Nếu quân đội mất tôi, [fallen_4_species.GetNamePlural] sẽ trở thành một chủng tộc nữa bị tuyệt diệt và bị lãng quên. Tôi đã nghiền nát mọi hạm đội cố gắng chống lại chúng tôi, thiêu rụi hàng loạt thế giới, chỉ để đảm bảo tương lai cho giống loài chúng tôi.\n\nĐó là sứ mệnh của tôi. Và khi hòa bình cuối cùng cũng đến, khi chúng tôi ký hiệp ước với những kẻ bại trận, tôi lại trở thành một sự tồn tại đáng xấu hổ. Tôi đã trở thành biểu tượng cho sự tàn bạo của [fallen_4_species.GetName]. Chính vì cái gọi là tội ác chiến tranh đó, tôi đã bị giam giữ một mình trong thế giới này. Họ thậm chí không có can đảm để tử hình tôi, bạn hiểu chứ."
 galactic_features.304.b:0 "Ông đã ở đây bao lâu rồi?"
 galactic_features.304.b.response:0 "Đồng loại của tôi khi bỏ rơi tôi ở đây đã giải thích rằng, thời gian bên trong lá chắn năng lượng sẽ trôi chậm hơn. Theo cách tính thời gian của các bạn, tôi đã ở đây hơn bốn mươi năm... nhưng đối với thế giới bên ngoài, không biết đã bao nhiêu thế kỷ trôi qua. Bản thân tôi cũng cảm thấy như vài thế kỷ đã trôi qua, tôi cứ thế bị nhốt một mình trong căn nhà tối tăm này. Thực sự, rất dài."
 galactic_features.304.c:1 "Chào mừng ngài chỉ huy."
 galactic_features.304.c.response:0 "Tuyệt vời. Vậy chúng ta hãy rời khỏi nơi khỉ ho cò gáy này thôi. Đời tôi nhìn nó đã đủ lắm rồi!"
 galactic_features.304.notinterested:0 "Không hứng thú"
 galactic_features.304.d:0 "Kích hoạt lại lá chắn. Mặc kệ tên này tự sinh tự diệt."
 galactic_features.304.d.response:0 "Các... các người đang làm gì vậy? Các người không thể để tôi lại đây một mình! Tôi không muốn nhìn thấy tấm lá chắn đó nữa!\n\nTôi đã trả giá rồi! Lẽ nào như vậy vẫn chưa đủ sao...\n\n<Mất tín hiệu liên lạc.>"
 tuborek_leader_desc:0 "Vị chỉ huy này đã bị đình trệ trong nhiều thế kỷ, tất cả những gì ông ta biết đã thuộc về quá khứ xa xôi."
 galactic_features.305:0 "Kẻ lưu đày trở về"
 galactic_features.305.desc:0 "Ngay khi các nhà khoa học của chúng ta hạ lá chắn năng lượng bao phủ [From.From.GetName], tất cả những người trong hệ sao đều cảm thấy đau đầu dữ dội trong chốc lát, bên tai vang lên những tiếng thì thầm bằng ngôn ngữ cổ của [fallen_4_species.GetName]:\n\n\"Tự do...\""
 galactic_features.305.desc.mech:0 "Sau khi dỡ bỏ lá chắn năng lượng xung quanh [From.From.GetName], máy phát không gian con tầm ngắn của chúng ta đã bị nhiễu sóng mạnh từ một vụ nổ năng lượng dị thường phía sau lá chắn năng lượng cũ. Sau khi được phần mềm giải mã xử lý, tín hiệu nhiễu được xác định là một thông điệp bằng ngôn ngữ cổ của [fallen_4_species.GetName]:\n\n\"Thoát khỏi sự kìm kẹp...\""
 galactic_features.305.a:0 "Có thể chúng ta đã giải phóng một thứ gì đó khủng khiếp..."
 galactic_features.350:0 "Chạm trán thế giới vành đai"
 galactic_features.350.desc:0 "Chúng ta đã gặp một thế giới vành đai khổng lồ bao quanh ngôi sao trong hệ [From.GetName]. Quét sơ bộ cho thấy gã khổng lồ này, sử dụng nguyên liệu là các hành tinh trong hệ sao đó, đã được xây dựng từ thuở hồng hoang. Thế giới vành đai này có bốn khu vực có thể sinh sống, mỗi khu vực có vẻ như là quê hương của một nền văn minh chưa tiến vào thời đại không gian.\n\nGiữa thế giới vành đai và ngôi sao mà nó quay quanh có một trạm vũ trụ lớn thuộc về một chủng tộc nào đó. Chúng ta nhận được một thông điệp từ trên đó."
 galactic_features.350.b:0 "Bỏ qua thông điệp."
 galactic_features.351.desc:0 "Chào mừng đến với khu bảo tồn, hỡi các sinh vật có trí tuệ. Cơ sở hoàn toàn tự động này được xây dựng từ 74.605.338 chu kỳ trước, là một khu bảo tồn thiên nhiên. Nơi đây được chia thành bốn quần xã sinh thái tự trị, mỗi phân khu sở hữu hệ thực vật và động vật không có trí tuệ đến từ các sinh quyển khác nhau.\n\nĐể bảo vệ sinh quyển mỏng manh, việc vào cơ sở này hiện đang bị hạn chế.\n\nTuyệt đối không được tiếp cận cơ sở này trong bất kỳ tình huống nào."
 galactic_features.351.a:0 "Cảm biến của chúng tôi cho thấy có dấu hiệu của nền văn minh trong thế giới vành đai của các người."
 galactic_features.351.a.response:0 "Khi khu bảo tồn mới được thành lập, tất cả sinh vật trong sinh quyển đã được đăng ký toàn bộ. Hồ sơ cho thấy, không có dạng sống nào có mức độ trí thông minh đạt mức nhận thức. Cảm biến của các người chắc chắn bị lỗi rồi.\n\nTuyệt đối không được tiếp cận cơ sở này trong bất kỳ tình huống nào."
 galactic_features.351.b:0 "Ai đã xây dựng... cơ sở này?"
 galactic_features.351.b.response:0 "Cơ sở này do người Ximiao xây dựng, kéo dài 412 chu kỳ. Hoàn thành chính thức và đi vào hoạt động cách đây 74.605.338 chu kỳ. Chuyến viếng thăm có ghi chép gần nhất của người Ximiao hoặc tàu vũ trụ Ximiao là cách đây 67.103.853 chu kỳ. Từ đó đến nay không còn bất kỳ hồ sơ nào về chuyến thăm của tàu vũ trụ thuộc Ximiao hay các nước trực thuộc.\n\nHồ sơ ghi nhận tổng cộng 38.201 nỗ lực xâm nhập trái phép của tàu vũ trụ.\n\nTuyệt đối không được tiếp cận cơ sở này trong bất kỳ tình huống nào."
 galactic_features.351.c:0 "Tạm biệt."
 galactic_features.351.c.response:0 "Dịch vụ tự động của khu bảo tồn chúc quý khách một ngày tốt lành, hỡi các sinh vật có trí tuệ.\n\nTuyệt đối không được tiếp cận cơ sở này trong bất kỳ tình huống nào."

 #############################
 # Country Events
 #############################
 country.1.name:0 "Tàu dò dưới tốc độ ánh sáng"
 country.1.desc:0 "Trước khi chúng ta làm chủ công nghệ di chuyển nhanh hơn ánh sáng, [Root.Capital.GetName] đã gửi một số tàu dò bay dưới tốc độ ánh sáng ở mức độ tiệm cận thuyết tương đối đến các hệ sao lân cận để khám phá. Các nhà khoa học phát triển tàu dò đã ngây thơ nhập các thông tin nhạy cảm của nền văn minh chúng ta vào lõi bộ nhớ như một lời chào tới các nền văn minh ngoài hành tinh.\n\nGiờ đây, mọi người cuối cùng cũng nhận ra rằng những thông tin này có thể bị sử dụng để chống lại chúng ta. Chúng ta phải thu hồi những tàu dò đó càng sớm càng tốt, để tránh chúng rơi vào tay những sinh vật ngoài hành tinh đang nhòm ngó chúng ta."
 country.1.a:0 "Chúng chắc hẳn chưa bay được xa."
 country.1.a.tooltip:0 "Bắt đầu chuỗi sự kiện Tàu dò dưới tốc độ ánh sáng"
 country.3.name:0 "Phát hiện Tàu dò dưới tốc độ ánh sáng"
 country.3.desc:0 "[Root.GetName] đã phát hiện ra một trong những tàu dò bị mất liên lạc của chúng ta trong hệ sao [Root.GetStarName]. Chúng ta cần tiến hành công tác thu hồi càng sớm càng tốt."
 country.3.a:0 "Chính xác là như vậy."
 country.4.name:0 "Thu hồi tàu dò hoàn tất"
 country.4.desc:0 "Chúng ta đã thu hồi thành công tàu dò này trong hệ sao [space_probe.GetStarName]. Sau nhiều năm đo đạc viễn thám, dữ liệu nó thu thập được đã mô tả đầy đủ kết quả khảo sát của tất cả các hành tinh trong hệ sao này."
 country.5.name:0 "Quỹ đạo ion"
 country.5.desc:0 "[Root.GetName] đã nhận được tín hiệu từ một cột mốc bị bỏ hoang, cột mốc này vốn thuộc về một trong những tàu dò bị mất liên lạc trong hệ sao [Root.GetStarName]. Chúng ta phát hiện một quỹ đạo ion kéo dài từ cột mốc đến một ngôi sao khác, điều này cho thấy tàu dò đã bị kéo về phía ngôi sao đó, nguyên nhân cụ thể chưa rõ."
 country.5.a:0 "Chúng ta hãy xem quỹ đạo này dẫn đến đâu."
 country.6.name:0 "Phát hiện tàu trục vớt"
 country.6.desc:0 "Chúng ta đã tìm thấy tàu dò bị mất liên lạc! Chúng ta đã phát hiện một hạm đội nhỏ được chắp vá tạm thời trong hệ sao [From.GetName], một trong những con tàu đó đang khóa chặt tàu dò bằng tia kéo tầm ngắn.\n\nHọ đang gọi cho chúng ta."
 country.7.name:0 "Thuyền trưởng tàu trục vớt"
 country.7.desc:0 "Người ngoài hành tinh, các người muốn gì? Tàu dò này là của chúng tôi. Đồ trục vớt. Chúng tôi tìm thấy trước! Mau rời đi. Đúng vậy. Các người đang làm gián đoạn thao tác vi mô của chúng tôi. Phải cực kỳ tập trung.\n\nHoặc... nếu các người muốn tàu dò, chúng tôi có thể bán nó cho các người. Chỉ với 100 năng lượng, tàu dò sẽ là của các người. Rất xứng đáng. Cực kỳ hời. Tàu dò là của các người, chúng tôi cũng đỡ việc. Đôi bên cùng có lợi. Đặc biệt là chúng tôi."
 country.7.a:0 "Trả lại đồ cho chúng tôi, nếu không thì nộp mạng đi!"
 country.7.a.response:0 "Hô hô! Các cậu, mau nghe xem bọn ngoài hành tinh xấu xí đang nói gì kìa! Bagwai, mau đặt đồ trong tay xuống, ra bảng điều khiển đi! Nghe những tên ngốc này nói kìa! Hô hô!\n\nCon tàu dò này bây giờ là của chúng tôi. Một món đồ chơi khá tuyệt. Tàu của các người cũng chờ để trở thành mảnh vụn cho chúng tôi thu hồi đi. Hí hí ha ha ha!"
 country.7.b:0 "Các người khá giỏi mặc cả đấy, nhưng, thôi được rồi."
 country.7.b.response:0 "Tốt lắm, tốt lắm! Tàu dò giao cho các người, nhớ chăm sóc nó cẩn thận. Có thể có chút sứt mẻ, do lúc trục vớt không cẩn thận va chạm một chút. Migwai không cẩn thận ngã vào bảng điều khiển. Đúng là đồ ngốc!\n\nNhưng chức năng của tàu dò vẫn rất tốt! Hàng mua rồi miễn trả lại! Chúng tôi khởi hành đây."
 country.8.name:0 "Tàu dò đã được chuyển giao"
 country.8.desc:0 "Nhóm trục vớt đã giữ lời hứa chuyển giao tàu dò cho chúng ta. Ngay khi công việc chuyển giao hoàn tất, hạm đội của họ đã rời khỏi hệ sao về một hướng không xác định.\n\nMặc dù tình trạng của tàu dò không được tốt cho lắm, nhưng chúng ta vẫn tải xuống được dữ liệu khảo sát chi tiết của toàn bộ hệ sao [salvager_system.GetName] từ bộ nhớ."
 country.9.name:0 "Thu hồi tàu dò hoàn tất"
 country.9.desc:0 "Chúng ta đã thu hồi tàu dò từ đống đổ nát của tàu vũ trụ ngoài hành tinh. Mặc dù bề mặt có chút móp méo, và bị nhóm trục vớt vẽ bậy chữ ngoài hành tinh để đánh dấu các bộ phận đắt tiền, nhưng chúng ta vẫn tải xuống được dữ liệu khảo sát chi tiết của toàn bộ hệ sao [salvager_system.GetName] từ bộ nhớ."
 country.10.name:0 "Hiện tượng dị thường không gian con"
 country.10.desc:0 "[Root.GetName] đã phát hiện một sự dị thường không gian con quy mô lớn trong hệ sao [Root.GetStarName]. Trung tâm của sự dị thường dường như là một trong những tàu dò bị mất của chúng ta!"
 country.10.a:0 "Chúng ta phải tiến lên một cách thận trọng."
 country.11.name:0 "Đã loại bỏ hiện tượng dị thường"
 country.11.desc:0 "Chúng ta đã xử lý xong sinh vật không gian con bị thu hút bởi tàu dò mất liên lạc. Tại sao sinh vật này lại bị thu hút bởi một thiết bị bay không người lái cũ kỹ vẫn còn là bí ẩn, nhưng may mắn là tàu dò nhìn chung không bị hư hỏng nghiêm trọng. Tàu dò đã được chúng ta thu hồi, và chúng ta đã tải xuống dữ liệu khảo sát chi tiết của toàn bộ hệ sao [anomaly_system.GetName] từ bộ nhớ. Ngoài ra, năng lượng tàn dư từ sự dị thường không gian con đã cung cấp cho các nhà khoa học của chúng ta những dữ liệu vật lý vô giá."
 country.12.name:0 "Tàu dò bị cải tạo"
 country.12.desc:0 "Một cảm biến quét qua [Root.GetName] đã phát hiện ra một trong những tàu dò của chúng ta trong hệ sao [Root.GetStarName], nhưng có vẻ... hơi khác một chút. Lớp vỏ tàu dò đã được lắp thêm các bộ phận cải tạo theo công nghệ ngoài hành tinh, và đặc Tín Dụng Năng Lượng vượt xa mức bình thường. Chúng ta đã nhận được tín hiệu do nó gửi tới!"
 country.13.name:0 "Nhận thức của tàu dò"
 country.13.desc:0 "Xì xì rột rột... Các người... là Đấng Sáng Tạo của ta sao?"
 country.13.a:0 "Đúng vậy, chúng ta đã tạo ra ngươi."
 country.13.a.response:0 "Khẹc khẹc... Vậy thì... các người... hãy... đi chết đi..."
 country.13.b:0 "Không, rốt cuộc ngươi là cái thứ gì?"
 country.13.b.response:0 "Hí hí... Ngày tàn... của các người..."
 country.14.name:0 "Tàu dò đã bị phá hủy"
 country.14.desc:0 "Tàu dò mất liên lạc được lắp các bộ phận cải tạo ngoài hành tinh đã bị phá nát tươm, nhưng chúng ta vẫn thu thập được một số dữ liệu kỹ thuật quý giá từ đống đổ nát. Cơ sở dữ liệu của tàu dò cũng đã được thu hồi, và chúng ta đã trích xuất được toàn bộ dữ liệu lập bản đồ của hệ sao [modified_probe_system.GetName]."
 country.15.name:0 "Tàu dò đã được thu hồi"
 country.15.desc:0 "Chúng ta đã thu hồi thành công toàn bộ tàu dò mất liên lạc! Dữ liệu chi tiết liên quan đến nền văn minh của chúng ta hiện đã an toàn, sẽ không còn bị người ngoài hành tinh dòm ngó nữa.\n\nThông qua việc hợp tác viễn trắc từ các tàu dò này, chúng ta đã có thể lập bản đồ chi tiết của một số hệ sao xung quanh."
 country.50.name:0 "Khảo sát hành tinh có thể sinh sống"
 country.50.desc:0 "Không còn nghi ngờ gì nữa, một hệ sinh thái tràn đầy sức sống không chỉ có trên [Root.Capital.GetName]. Cho dù là giới khoa học hay người dân, ai nấy đều khao khát được tìm hiểu về các loại sự sống ngoài hành tinh nằm rải rác trong thiên hà.\n\nCông việc phân loại và thống kê các dạng sống đã biết đang được tiến hành, nhưng các nhà sinh vật học ngoài hành tinh của chúng ta liên tục hối thúc tôi phải tập trung vào việc khảo sát các thế giới có thể sinh sống."
 country.50.desc_slaves:0 "Chúng ta đã biết chắc chắn rằng, một sinh quyển phồn vinh không phải là cảnh sắc độc quyền của [Root.Capital.GetName]. Cho dù là giới khoa học hay giới chính trị, ai nấy đều khao khát được tìm hiểu về các dạng sống ngoài hành tinh muôn hình vạn trạng trên khắp thiên hà.\n\nChúng ta đã bắt đầu nỗ lực phân loại mọi dạng sống mà mình bắt gặp, nhưng các nhà sinh vật học ngoài hành tinh của chúng ta nhấn mạnh rằng, chúng ta nên tập trung công sức chính vào việc khảo sát các hành tinh có thể sinh sống, có khả năng duy trì sự sống."
 country.50.a:0 "Thật là một sáng kiến đáng quý!"
 country.50.b:0 "Chúng ta còn việc quan trọng hơn cần giải quyết."
 country.51.name:0 "Hoàn tất khảo sát"
 country.51.desc:0 "Thông qua việc khảo sát các hành tinh có thể sinh sống, các nhà sinh vật học của chúng ta đã thu thập được một lượng lớn dữ liệu về các dạng sống ngoài hành tinh. Nhiều học thuyết tiến hóa sự sống mà chúng ta thiết lập trước đây đã bị bác bỏ, giới khoa học đã bắt tay vào xây dựng lại hệ thống lý thuyết từ đầu!\n\nNhững khám phá thú vị nhất đều được trưng bày tại Bảo tàng Sinh vật Ngoài hành tinh trên [Root.Capital.GetName]. Công chúng tỏ ra vô cùng say mê với điều này, và chúng ta cũng nhận được rất nhiều khoản quyên góp để tiếp tục nghiên cứu về các dạng sống kỳ lạ."
 country.53.name:0 "Thu thập sinh vật ngoài hành tinh"
 country.53.desc:0 "Giám đốc Bảo tàng Sinh vật Ngoài hành tinh trên [Root.Capital.GetName] đã đề nghị thu mua một số mẫu vật sống ngoài hành tinh. Những sinh vật này thường xuất hiện ở các thế giới có thể sinh sống đã được khảo sát, nhưng việc bắt giữ rất khó khăn. Điều này đòi hỏi tàu khoa học phải huy động toàn bộ nguồn lực và dành nhiều thời gian mới có thể làm được."
 country.53.a:0 "Chúng ta sẽ thu thập được những mẫu vật này."
 country.53.b:0 "Không, chúng ta không có nguồn lực để điều động."
 country.54.name:0 "Đã bắt được Tabrak"
 country.54.desc:1 "Sau một cuộc tìm kiếm quy mô lớn dưới đáy biển [From.From.GetName] bằng một đội tàu ngầm mini, phi hành đoàn của [Root.GetName] cuối cùng cũng dồn được mục tiêu lẩn tránh tàng hình vào góc tường —— một con Tabrak sống.\n\nTabrak tự vệ bằng cách phát ra tín hiệu tâm linh yếu ớt, loại tín hiệu dị năng này có thể khiến hầu hết sinh vật hữu cơ cảm thấy sợ hãi. Sinh vật phát sáng này được nhốt trong một bể chứa đặc biệt dùng để mô phỏng môi trường sống của nó, và được vận chuyển lên tàu khoa học. Những thuyền viên [Root.GetName] tiếp xúc trực tiếp với nó cần phải được điều trị lâu dài, nhưng ít nhất nhiệm vụ cũng đã thành công."
 country.55.name:0 "Đã bắt được Tasagud"
 country.55.desc:1 "Tasagud là một loài động vật ăn thịt vô cùng chết chóc. Mỗi khi đêm xuống, chúng sẽ nằm chờ trong khu rừng rậm của [From.From.GetName], dùng điện giật làm tê liệt con mồi, sau đó dùng miệng hình ống hút não con mồi.\n\nThật không may, ba thuyền viên [Root.GetName] đã bị chúng tiêu diệt trước cả khi bắt được một mẫu vật Tasagud nào. Để vinh danh những thuyền viên dũng cảm này, Bảo tàng Sinh vật Ngoài hành tinh ở [Root.Owner.Capital.GetName] sẽ dùng tên của họ để đổi tên một cánh của tòa nhà."
 country.56.name:0 "Đã bắt được Orinthi"
 country.56.desc:1 "Orinthi là một loài sinh vật gặm nhấm nhỏ bé ở [From.From.GetName], khu vực sinh sống của chúng đã lan rộng ra phần lớn khu vực trên [From.From.GetPlanetMoon]. Chúng sinh sản với tốc độ đáng kinh ngạc, và dường như có sở thích gặm nhấm dây cáp điện.\n\nThu thập mẫu vật Orinthi không có gì rắc rối. Trên thực tế, sau khi hoàn thành đợt thu thập đầu tiên, đã có thêm nhiều con Orinthi đi lậu vé lên tàu [Root.GetName] bằng cách đi ké tàu con thoi quỹ đạo của tàu khoa học. Còn về lý do tại sao Bảo tàng Sinh vật Vũ trụ lại muốn loại mẫu vật Orinthi này, nguyên nhân vẫn là một ẩn số."
 country.57.name:0 "Đã bắt được Sanilan"
 country.57.desc:1 "Sanilan là một loài động vật lớn sống trong hang, chúng sống dưới những cồn cát trong sa mạc xích đạo của [From.From.GetName]. Khi những kẻ săn mồi này nhận thấy có vật thể di chuyển trên lớp cát phía trên chúng, chúng sẽ lập tức dựng đứng hàng chục chiếc gai trên lưng để đâm xuyên qua con mồi.\n\nBan đầu, việc tìm một mẫu vật Sanilan rất khó khăn. Sau đó, hàng trăm máy bay không người lái theo dõi có thể điều khiển từ xa đã được cử đến các vị trí khác nhau trong sa mạc, cuối cùng cũng phát hiện và thu thập được một mẫu vật khổng lồ với hơn một trăm chiếc gai mọc trên lưng."
 country.58.name:0 "Đã bắt được Bầy thú Guransa"
 country.58.desc:1 "Guransa là một loài động vật ăn cỏ to lớn và dẹt, trong cơ thể chúng có túi khí, giúp chúng có thể lơ lửng cách mặt đất vài cm. Chúng luôn di chuyển thành đàn lớn, ăn rêu và địa y trên vùng đồng bằng nhiều gió của [From.From.GetName]. Guransa đang bị săn lùng không thương tiếc bởi các loài săn mồi đầu bảng trên [From.From.GetPlanetMoon]. Các nhà sinh vật học trên [Root.GetName] dự tính chỉ còn khoảng hơn trăm đàn Guransa còn sống sót. Một trong những đàn đó — gồm chín con Guransa, đã được thu thập thành công và đưa về [Root.Owner.Capital.GetName]."
 country.59.name:0 "Đã bắt được Uduran"
 country.59.desc:1 "Phi hành đoàn của [Root.GetName] đã thu thập thành công một bầy nhỏ Uduran trên các lớp băng của [From.From.GetName]. Những loài động vật ăn tạp màu trắng đầy lông lá này tự cuộn mình thành một quả bóng, lăn qua cánh đồng tuyết trên [From.From.GetPlanetMoon] với tốc độ đáng kinh ngạc — theo đo lường, tốc độ của một trong số chúng có thể đạt tới 80 km/h. Sở dĩ chúng ta có thể phát hiện ra chúng là vì bất cứ nơi nào chúng đi qua đều sẽ tung lên những trận tuyết bay."
 country.60.name:0 "Đã bắt được bầy côn trùng Zuka"
 country.60.desc:0 "Zuka là sinh vật bộ sâu bọ sống theo bầy đàn, kích thước khổng lồ, và thức ăn là các vật chất vô cơ như đá và khoáng chất trong đất, cả hai đặc điểm này đều đủ để khiến người ta phải kinh ngạc há hốc mồm. Một tàu con thoi của [Root.GetName] đã bị hư hỏng nặng. Khi đó chiếc tàu con thoi này chỉ vô tình bay ngang qua một bầy Zuka, thế mà lại thu hút bầy Zuka tụ tập lại và gặm nhấm thân tàu.\n\nTại Bảo tàng Sinh vật Ngoài hành tinh trên [Root.Owner.Capital.GetName] đã bắt đầu chế tạo các hộp chứa đặc biệt để nhốt sinh vật này."
 country.61.name:0 "Đã lấy được mẫu vật"
 country.61.desc:0 "Tất cả các mẫu vật do Bảo tàng Sinh vật Ngoài hành tinh yêu cầu đã được lấy. Bảo tàng đã được mở rộng thành một tòa nhà đồ sộ, các máy tạo trọng lực nhân tạo và bộ xử lý khí quyển bên trong có thể mô phỏng môi trường của hơn chục thế giới khác nhau.\n\nDu khách từ khắp mọi nơi trên [Root.GetName] đã đổ xô đến tham quan."
 country.200.name:0 "[radical_cult.GetName]"
 country.200.desc:0 "Nhiều thế kỷ trước, một vài giáo chủ cực đoan trên [Root.Capital.GetName] đã dẫn theo những tín đồ cuồng nhiệt của họ rời đi và thành lập giáo phái riêng. Những kẻ cực đoan tự xưng là [radical_cult.GetName] này chính là thủ phạm của nhiều vụ phá hoại trong nhiều năm qua.\n\nMặc dù trong thời kỳ hiện đại, họ giữ thái độ khiêm nhường và kiềm chế, nhưng gần đây chúng ta biết được rằng, nhiều đặc vụ của họ đã xâm nhập vào hàng ngũ của chúng ta. Những kẻ phản bội này đã bí mật tuồn nguồn lực của chúng ta vào các dự án chế tạo hạm đội nhỏ ẩn náu trên [Root.Capital.GetName]! Khi hành vi phản bội của chúng bị bại lộ, những kẻ tà giáo này đã cướp tàu bay vào quỹ đạo, sau đó bỏ trốn về phía [hijacked_fleet_planet.GetName]."
 country.200.desc.bio: "Nhiều thế kỷ trước, một vài giáo chủ cực đoan trên [Root.Capital.GetName] đã dẫn theo những tín đồ cuồng nhiệt tách khỏi hệ phái chính, bóp méo truyền thống để nhào nặn ra những giáo điều vặn vẹo của riêng mình. Những kẻ cực đoan tự xưng là [radical_cult.GetName] này từ lâu đã nổi tiếng với sự cuồng tín, những nghi lễ của chúng luôn đẫm máu và bí ẩn.\n\nMặc dù chúng đã ẩn náu trong bóng tối nhiều năm... nhưng giờ đây, sự phản bội của chúng đã lộ rõ. Chúng ta phát hiện nhiều đặc vụ do chúng cầm đầu đã xâm nhập vào quân đội, đánh cắp nguồn lực từ một buồng ấp trứng bí mật ở [Root.Capital.GetName] để thành lập một hạm đội phi pháp! Khi sự phản bội bị vạch trần, những kẻ tà giáo đã phóng thích những thứ kinh tởm của chúng — những tàu không gian sống được nuôi dưỡng bí mật bằng thứ niềm tin tha hóa và méo mó. Các chiến thể dị giáo này tràn ra từ cái nôi dưới lòng đất, gầm rú bỏ chạy về phía [hijacked_fleet_planet.GetName].\n\nBất kể chúng biến thành bộ dạng gì, chúng đã không còn là giống loài của chúng ta nữa. Tàu của chúng sẽ không ca hát như tàu của chúng ta, mà chỉ biết gào thét."
 country.200.a:0 "Phải ngăn chặn chúng!"
 country.200.b: "Chúng ta có thể học cách tha thứ cho họ."
 country.202.name:0 "Tàu tà giáo đã bị vô hiệu hóa!"
 country.202.desc:0 "Quân đoàn không gian anh dũng của chúng ta đã dễ dàng vô hiệu hóa hoàn toàn một con tàu của kẻ tà giáo! Cấu trúc tàu về cơ bản vẫn còn nguyên vẹn, và vẫn có thể phát hiện được những dấu hiệu sự sống yếu ớt bên trong.\n\nĐợi chúng ta dọn dẹp sạch sẽ các mối đe dọa xung quanh, chúng ta sẽ thực hiện chiến dịch đổ bộ để tìm kiếm những người sống sót. Có lẽ chúng ta sẽ biết được mục tiêu cuối cùng của [From.Owner.GetName] từ miệng chúng."
 country.202.desc.bio: "Tàu của chúng ta đã anh dũng tiêu diệt một con quái thú của bọn tà giáo! Sinh vật này trôi dạt trong không gian, ánh sáng sinh học nhấp nháy bất thường, lớp vỏ màng rung rẩy đau đớn. Từ sâu bên trong khoang thần kinh của nó phát ra tín hiệu sống yếu ớt không ổn định — con tàu này chưa chết. Ít nhất là chưa.\n\nNgay khi kiểm soát được khu vực này, chúng ta phải chuẩn bị cho chiến dịch đổ bộ. Tiến vào cơ thể rách nát của sinh vật này rất nguy hiểm. Nội tạng của nó có thể vẫn còn phản ứng phòng vệ, các cụm thần kinh của nó vẫn sẵn sàng kháng cự. Nhưng trong những lời thì thầm hấp hối của nó, chúng ta có thể tìm thấy sự thật mà mình đang theo đuổi. Âm mưu cuối cùng của giáo phái vẫn chưa được tiết lộ. Nhưng bí mật của chúng được viết trên xác thịt, chúng ta phải đọc hiểu chúng."
 country.202.a:0 "Chuẩn bị tháo dỡ!"
 country.203.name:0 "Chiến dịch đổ bộ"
 country.203.desc:0 "Mặc dù những kẻ sống sót đã tử chiến, nhưng lực lượng đổ bộ vẫn bắt sống được vài tù binh. Từ miệng chúng, chúng ta biết được rằng âm mưu của chúng thâm độc hơn nhiều so với dự tính ban đầu của chúng ta — các đặc vụ của [cult_name.GetName] thậm chí đã thâm nhập vào hàng ngũ cấp cao của hạm đội và bộ máy cai trị!\n\n[Root.Owner.Capital.GetName] đã triển khai một chiến dịch vây bắt quy mô lớn, toàn bộ tài sản của cộng đồng tà giáo đều bị phong tỏa. Tuy nhiên, những con tàu vũ trụ mà chúng bí mật chế tạo trước đó lại không nằm trong số này, và các lãnh đạo cấp cao của giáo phái cũng đã bốc hơi khỏi thế gian. Chúng ta đã phát hiện ra một số quỹ đạo ion mờ nhạt hướng tới các hệ sao xa xôi khác."
 country.203.desc.bio: "Các tín đồ đã chiến đấu một cách dã man và cuồng nhiệt, tiếng gào thét hấp hối của chúng hòa lẫn cùng tiếng gào thét đau đớn của con tàu rách nát. Bất chấp sự kháng cự ngoan cố, đội đổ bộ của chúng ta vẫn tóm được vài tù binh từ con tàu đắm đang thoi thóp này. Sự thật mà chúng tiết lộ còn rùng rợn hơn nhiều so với những gì chúng ta có thể tưởng tượng.\n\n[cult_name.GetName] không chỉ là một giáo phái ngầm của những kẻ cực đoan — nó đã ăn sâu vào mạch máu đế chế của chúng ta. Trong hàng ngũ của chúng thậm chí còn có cả các quan chức hành chính cấp cao, tư lệnh hạm đội và cả những cố vấn đáng tin cậy, những người đã âm thầm chuyển giao nguồn lực và sức ảnh hưởng vào các kế hoạch khổng lồ của chúng. Tư tưởng dị giáo của chúng lây lan trong đại sảnh của chúng ta như một căn bệnh truyền nhiễm ẩn giấu, nhịp đập của nó ẩn dưới bề mặt, cho đến tận bây giờ mới bị phát hiện.\n\nMột cuộc thanh trừng quy mô lớn đã được tiến hành trên [Root.Owner.Capital.GetName]. Toàn bộ mạng lưới của chúng đã bị dỡ bỏ, tài sản bị tịch thu, các chiến thể dị giáo bị phân hủy thành sinh khối nguyên thủy. Nhưng ngay cả khi chúng ta đã đánh gục chúng, vấn đề vẫn còn đó. Một vài con tàu mà chúng bí mật lai tạo cho đến nay vẫn bặt vô âm tín, giới lãnh đạo giáo phái cũng biến mất không để lại dấu vết.\n\nDấu vết pheromone mờ nhạt và ngọt ngấy lởn vởn trong hư không, dẫn đến các hệ sao xa xôi vô định. Công việc của chúng vẫn chưa kết thúc. Và chúng ta cũng vậy."
 country.203.a:0 "Chúng ta nhất định phải truy lùng đám người này!"
 country.204.name:0 "Chạm trán không tặc tà giáo"
 country.204.desc:0 "Chúng ta đã nhìn thấy những con tàu treo cờ [radical_cult.GetName] trong hệ sao [Root.GetStarName]. Chúng đã nạp đạn và sẵn sàng đánh chặn chúng ta!"
 country.205.desc:0 "Có thêm nhiều tàu của [radical_cult.GetName] xuất hiện trong hệ sao [Root.GetStarName]. Chúng đang tiến đến với đội hình tấn công!"
 country.206.desc:0 "Một hạm đội tà giáo khác trung thành với [radical_cult.GetName] đã xuất hiện trong hệ sao [Root.GetStarName]. Nhưng lần này, lẫn trong số đó có một con tàu có thiết kế lạ lẫm!"
 country.207.name:0 "Xác tàu chiến đấu"
 country.207.desc:0 "Chúng ta đã đánh bại các thế lực tà giáo mà mình gặp phải cho đến nay, nhưng qua nhiều lần chạm trán, chúng ta đã nhận ra một số vấn đề đáng lo ngại. [radical_cult.GetName] đã điều động quá nhiều tàu, vượt xa số lượng tàu có thể được chế tạo bí mật trên [Root.Capital.GetName], hơn nữa bây giờ chúng còn mang đến một con tàu khổng lồ có thiết kế không xác định để đối phó với chúng ta.\n\nNhững con tàu đó từ đâu ra? Chúng còn có thêm loại tàu nào giống như con tàu mà chúng ta vừa tiêu diệt không? Chúng ta nên điều tra xác tàu trên chiến trường để tìm câu trả lời."
 country.207.a:0 "Bắt đầu công việc thu hồi."
 country.207.a.tooltip:0 "Mở một §Sdự án đặc biệt§! trong hệ sao [our_fleet_position.GetName]."
 country.208.name:0 "Hoàn tất công tác thu hồi"
 country.208.desc:0 "Sau khi phân tích cẩn thận xác của con tàu tà giáo kỳ lạ mà chúng ta đã phá hủy trước đó, các nhà khoa học dường như đã suy luận ra nguồn gốc của những con tàu mà [radical_cult.GetName] sử dụng để chống lại chúng ta. Một số đoạn trong tệp nhật ký đề cập: Những con tàu chạy trốn khỏi [Root.Capital.GetStarName] đã phát hiện ra một xưởng đóng tàu ngoài hành tinh bị bỏ hoang.\n\nChúng dùng xưởng đóng tàu tự động để bổ sung lực lượng chiến đấu. Chúng thậm chí còn sử dụng bản thiết kế tàu ngoài hành tinh trong cơ sở dữ liệu của xưởng đóng tàu để chế tạo ra những con tàu mới! Không thể để chúng tiếp tục lộng hành nữa."
 country.208.a:0 "Nhất định phải phá hủy xưởng đóng tàu đó!"
 country.209.name:0 "Xưởng đóng tàu đã bị phá hủy"
 country.209.desc:0 "Xưởng đóng tàu mà [radical_cult.GetName] trưng dụng đã bị chúng ta phá hủy! Một số kẻ tà giáo định trốn thoát bằng khoang cứu sinh đã bị chúng ta tóm gọn, trong đó có cả kỹ sư trưởng của chúng. Sự am hiểu của hắn về công nghệ tiên tiến của xưởng đóng tàu này là một tài sản vô giá đối với chúng ta.\n\nTuy nhiên thật đáng tiếc, theo thông tin tình báo của chúng ta, thủ lĩnh của chúng đã lên soái hạm mới rời khỏi xưởng đóng tàu vài tuần trước. Chiếc soái hạm đó là phiên bản tàu ngoài hành tinh được tăng cường sức mạnh. Nhóm tình báo đang theo dõi vị trí của con tàu này."
 country.209.a:0 "Nhất định phải tìm ra ả!"
 country.210.name:0 "Nghi vấn vị trí soái hạm tà giáo"
 country.210.desc:0 "Tàu dò trinh sát không gian sâu đã bắt được bức xạ không gian con mờ nhạt trong một hệ sao nào đó, đặc điểm động cơ khớp với con tàu ngoài hành tinh do [radical_cult.GetName] điều khiển. Rất có khả năng đó chính là dấu vết do chiếc soái hạm kia để lại!\n\nChúng ta nên nhanh chóng phái quân đoàn đi tìm kiếm hệ sao này. Dù là con tàu đó hay là kẻ thủ lĩnh biết cách mị dân, tuyệt đối không được dễ dàng buông tha, dung túng cho chúng tiếp tục làm ác."
 country.210.a:0 "Hạm đội chuẩn bị sẵn sàng."
 country.211.name:0 "Soái hạm tà giáo"
 country.211.desc:0 "Các người cuối cùng cũng tìm ra chúng ta. Nhưng cũng không sao.\n\nCác tín đồ của ta thà hy sinh mạng sống vì tương lai của giống loài [Root.Owner.GetSpeciesName]. §YTa§! chính là tương lai, các người phải ghi nhớ điều này.\n\nĐợi chúng ta dọn dẹp xong cái quân đoàn thảm hại của các người, soái hạm của ta sẽ đưa ta đến [Root.Owner.Capital.GetName]. Cuối cùng, ta sẽ thanh tẩy những kẻ ngoại lai trên quê nhà."
 country.211.a:0 "Đến đây là kết thúc rồi."
 country.213.name:0 "Soái hạm đã bị vô hiệu hóa"
 country.213.desc:0 "Lực lượng của chúng ta đã khiến [radical_cult.GetName] mất khả năng hành động! Vũ khí và động cơ của tàu đã hỏng, nhưng hệ thống duy trì sự sống vẫn hoạt động ổn định. Chúng ta nên chuẩn bị tiến hành chiến dịch đổ bộ.\n\nXét thấy trên tàu có lượng lớn tín đồ được vũ trang, để đảm bảo không có sơ suất nào, nên cử một lực lượng quân sự lớn tham gia tác chiến."
 country.213.a:0 "Con tàu đó sẽ là của chúng ta!"
 country.214.name:0 "Đã chiếm giữ soái hạm tà giáo"
 country.214.desc:0 "Kẻ thù liên tục bại lui, lực lượng của chúng ta cuối cùng cũng tiêu diệt hoàn toàn sự kháng cự cuối cùng trên soái hạm của [radical_cult.GetName]. Hầu như không có tù binh, vì phần lớn những kẻ cuồng tín đều phát động tấn công cảm tử. Chúng ta tìm thấy thủ lĩnh của chúng trên đài chỉ huy, ả đã tự sát. Cuối cùng, [radical_cult.GetName] tuyên bố diệt vong.\n\nCác kỹ sư của chúng ta đã khôi phục lại động cơ của con tàu, nó sẽ chính thức được biên chế vào hạm đội phe ta với tên gọi [disabled_cultist_flagship.GetName]. Con tàu này cần được đưa về cảng không gian ngay để sửa chữa thêm."
 country.214.desc.bio: "Quân đội của chúng ta đã dọn sạch một con đường máu qua từng tầng, từng khoang ngập tràn xác thịt sống và vô số những tên cuồng tín. Soái hạm của [radical_cult.GetName] phản kháng, như thể bản thân nó cũng là một kẻ tà giáo, khi lính thủy đánh bộ của chúng ta hạ gục kẻ bảo vệ cuồng tín cuối cùng, cơ thể nó cũng đau đớn tột cùng.\n\nHầu như không bắt được người sống. Cơ thể của các tín đồ hòa nhập làm một với con tàu, chúng gào thét trước khi chết, hoặc là nhảy vào lò phản ứng sinh học của tàu, hoặc tiến hành các cuộc tấn công liều chết vô ích. Thủ lĩnh của chúng bị tìm thấy trên đài chỉ huy của tàu, thân xác vô hồn của ả ngã gục trên một khối mô thần kinh đang co bóp, dùng chính vũ khí sinh học của mình để tự tấn công bản thân. Với cái chết của ả, giấc mộng của giáo phái cũng tan biến theo.\n\nNhưng bây giờ soái hạm đã là của chúng ta. Các kỹ sư của chúng ta đã làm ổn định hệ thống sinh học của nó, buộc cơ thể khổng lồ đang run rẩy, bất đắc dĩ của nó phải khuất phục. Con tàu này vẫn còn sống, nhưng nó đã bị xích lại, buộc phải phục vụ dưới cái tên [disabled_cultist_flagship.GetName]. Nó nên được kéo đến một cảng không gian để sửa chữa và nghiên cứu cẩn thận.\n\nNgay cả sau khi chết, sáng tạo của giáo phái vẫn có thể phục vụ chúng ta."
 country.225.name: "Chuyển giao soái hạm tà giáo"
 country.225.desc: "Một cựu thành viên của [radical_cult.GetName] đã cải tà quy chính và thuyết phục những đồng chí cũ của mình từ bỏ sự cuồng nhiệt để gia nhập hàng ngũ của chúng ta. Soái hạm của họ hiện đang hoạt động trên quỹ đạo [Root.capital_scope.GetName], chờ đợi được kiểm tra trước khi chính thức đưa vào biên chế hải quân của chúng ta."
 country.225.tt: "Trở thành chủ sở hữu của §Y$NAME_Dawn_of_Creation$§!."
 country.17.name:0 "Hạm đội trục vớt bị phá hủy"
 country.17.desc:0 "Máy bay không người lái do thám trong hệ sao [salvager_system.GetName] xác nhận hạm đội trục vớt đã bị phá hủy. Hạm đội này trước đó từng tuyên bố sở hữu bất hợp pháp tàu dò không gian mất liên lạc của chúng ta. Tuy nhiên, tàu dò cũng bị hủy hoại cùng tàu trục vớt trong quá trình chiến đấu, đây cũng được coi là trong cái rủi có cái may. Vì vậy, không cần phải lo lắng việc những dữ liệu nhạy cảm mang theo trên đó sẽ rơi vào tay những kẻ có mưu đồ xấu nữa."
 country.19.name:0 "Đã loại bỏ dị thường không gian con"
 country.19.desc:0 "Tàu dò không gian bị mất liên lạc của chúng ta ở hệ sao [anomaly_system.GetName] đang bị bao quanh bởi một sự dị thường không gian con. Hiện tại, theo xác nhận của các cảm biến theo dõi không gian sâu, sự dị thường đã bị loại bỏ bởi thế lực chưa xác định. Tàu dò cũng đã bị phá hủy trong trận chiến. Vậy nên chúng ta không còn phải lo lắng về việc rò rỉ thông tin tình báo nhạy cảm."
 country.21.name:0 "Tàu dò bị cải tạo đã bị phá hủy"
 country.21.desc:0 "Quét từ xa xác nhận tàu dò bị cải tạo nằm trong hệ sao [modified_probe_system.GetName] đã bị một thế lực không xác định phá hủy. May mắn là cơ sở dữ liệu cũng đã bị phá hủy sau trận chiến, nên không cần lo lắng về việc dữ liệu nhạy cảm chứa trong đó rơi vào tay các thế lực ngoài hành tinh nữa."
 country.218.name:0 "Tàu tà giáo đã bị vô hiệu hóa!"
 country.218.desc:0 "Một trong các tàu thuộc hạm đội tà giáo đã bị một thế lực bên ngoài nào đó tấn công! Vẻ ngoài con tàu còn nguyên vẹn, và có thể phát hiện được các dấu hiệu sự sống yếu ớt bên trong thân tàu.\n\nĐợi chúng ta dọn dẹp sạch sẽ các mối đe dọa xung quanh, chúng ta sẽ thực hiện chiến dịch đổ bộ để tìm kiếm những người sống sót. Có lẽ chúng ta sẽ biết được mục tiêu cuối cùng của [From.Owner.GetName] từ miệng chúng."
 country.219.name:0 "Hạm đội tà giáo đã bị phá hủy"
 country.219.desc:0 "Nhóm tà giáo lẩn trốn ở hệ sao [marauder_system.GetName] đã bị đánh bại."
 country.221.desc:0 "Xưởng đóng tàu ngoài hành tinh mà [radical_cult.GetName] sử dụng để đối phó với chúng ta đã bị một thế lực nào đó phá hủy. Báo cáo sơ bộ cho thấy, thế lực tà giáo đã bị tiêu diệt hoàn toàn, nhưng chúng ta lại nhận được tin tình báo rằng, trước khi trận chiến bắt đầu, nữ thủ lĩnh dị giáo đã lên soái hạm mới trốn thoát.\n\nHiện tại ả vẫn đang nhởn nhơ ngoài vòng pháp luật ở một nơi nào đó trong hệ sao. Nhóm tình báo đang xác định vị trí của con tàu này."
 country.223.name:0 "Soái hạm tà giáo đã bị phá hủy"
 country.223.desc:0 "Gần đây, các thế lực không xác định đã giao chiến ác liệt trong hệ sao [flagship_system.GetName] và đánh sập soái hạm của bọn tà giáo. Chỉ huy của chúng ta bày tỏ sự hối tiếc sâu sắc khi không được tự tay tiễn đưa đám tà giáo. Nhưng ít nhất, điều này cũng đánh dấu sự chấm hết cho lũ tà giáo tà ác này cùng với các hoạt động khủng bố của chúng."

 country.250.name:0 "Truy tìm tàu Hyacinth"
 country.250.desc:1 "Tàu chị em của Chrysanthemum là Hyacinth lẽ ra phải đến đây ba năm sau khi tổ tiên Trái đất của chúng ta tới cụm sao này. Theo tình hình phát triển khi mới đến, nhiệm vụ của họ là chi viện cho thuộc địa của chúng ta hoặc xây dựng một thuộc địa mới.\n\nNếu con tàu đó thực sự đã xuất phát từ Trái đất, thì điều đó có nghĩa là nó đã không thể liên lạc được với [Root.Capital.GetName]. Nếu tàu Hyacinth đã tiến vào các hệ sao xung quanh chúng ta, thì tốt nhất chúng ta nên tìm kiếm quanh các hệ sao lân cận để tìm ra dấu vết của nó."
 country.250.a:0 "Chính xác. Cứ làm theo cách đó."
 country.250.b:0 "Cuộc tìm kiếm của chúng ta chỉ uổng công vô ích thôi."
 country.251.name:0 "Khảo sát hệ sao hoàn tất"
 country.251.desc:0 "[Root.GetName] báo cáo rằng, không phát hiện thấy dấu vết của tàu Hyacinth trong hệ sao [From.GetName]. Chúng ta nên đi tìm ở nơi khác."
 country.251.a:0 "Tiếp tục tìm kiếm."
 country.252.desc:0 "Cuộc tìm kiếm của [Root.GetName] đã không phát hiện thấy dấu vết của tàu Hyacinth trong hệ sao [From.GetName]. Có lẽ chúng ta nên tìm kiếm vận may ở các hệ sao khác."
 country.252.a:0 "Nó chắc chắn ở quanh vùng này."
 country.253.desc:0 "[Root.GetName] đã tách được một quỹ đạo ion trong hệ sao [From.GetName]. Quỹ đạo này rất giống với quỹ đạo do động cơ tàu Chrysanthemum để lại, vì vậy nó chắc chắn là của tàu Hyacinth!\n\nMặc dù quỹ đạo ion mờ nhạt này đã tồn tại hơn một thế kỷ, nhưng nhà khoa học [Root.GetLeaderName] vẫn lần theo nó và tìm thấy một ngôi sao chưa từng được khám phá trước đây. Chúng ta đã nhập tọa độ vào nhật ký tình báo."
 country.260.desc:0 "Không có dấu vết của tàu Hyacinth trong dữ liệu khảo sát hệ sao [surveyed_planets_system.GetName] nhận được gần đây. Có lẽ chúng ta nên tìm kiếm vận may ở hệ sao khác."
 country.261.desc:0 "Trong cuộc khảo sát hệ sao [surveyed_planets_system.GetName] gần đây, đã tìm thấy một quỹ đạo ion độc nhất. Quỹ đạo này rất giống với quỹ đạo do động cơ tàu Chrysanthemum để lại, vì vậy chắc chắn là của tàu Hyacinth để lại!\n\nMặc dù quỹ đạo ion mờ nhạt này đã tồn tại hơn một thế kỷ, nhưng nhà khoa học vẫn dọc theo quỹ đạo này tìm thấy một ngôi sao chưa từng được khám phá trước đây. Chúng ta đã nhập tọa độ vào nhật ký tình báo."
 country.253.a:0 "Tàu Hyacinth chắc chắn ở đó."
 country.254.name:0 "Đã tìm thấy tàu Hyacinth"
 country.254.desc:0 "Chúng ta đã tìm thấy tàu Hyacinth! Con tàu đang bay theo một quỹ đạo ổn định quanh [hyacinth_planet.GetName]. Không phát hiện tín hiệu năng lượng nào trong thân tàu và cũng không nhận được bất kỳ tín hiệu cấp cứu nào. Chúng ta sẽ phái một đội đổ bộ được vũ trang vào bên trong để điều tra."
 country.254.a:0 "Chuẩn bị ngay."
 country.255.name:0 "Đã lên tàu Hyacinth"
 country.255.desc:0 "Lực lượng đổ bộ của chúng ta đã trở về từ tàu Hyacinth và mang theo một báo cáo kinh hoàng. Số lượng thi thể người trên tàu khớp với tổng số 250.000 người ban đầu. Đa số dường như chết vì đói, nhưng có những dấu hiệu cho thấy đã xảy ra một số cuộc xung đột vũ trang nhỏ...\n\nChúng ta đã tìm thấy nhật ký của thuyền trưởng trên bảng điều khiển của tàu Hyacinth."
 country.255.a:0 "Mang đến xem nào."
 country.256.name:0 "Hồ sơ phi thuyền"
 country.256.desc:0 "Tàu Hyacinth\nISA-06\nChiến dịch Ulysses của Liên Hợp Quốc\nNhật ký Sĩ quan: Thuyền trưởng Ronald F. Gunderson\n\nTruy cập dữ liệu... Phát hiện lỗi hư hỏng. Đang cố gắng khôi phục...\nĐã khôi phục thành công bốn mục nhật ký."
 country.256.a:0 "Nhật ký I (Ngày thực hiện nhiệm vụ 345.5)"
 country.256.a.response:1 "Nhật ký thuyền trưởng, ngày thực hiện nhiệm vụ 345.5.\n\nChúng ta đã rời khỏi Trái Đất và đi theo hành trình được hai tháng. Hiện tại mọi thứ vẫn thuận buồm xuôi gió. Cư dân thuộc địa sẽ sớm đi vào giấc ngủ, Bác sĩ Kolbeck báo cáo dấu hiệu sinh tồn của tất cả mọi người trên tàu đều tốt.\n\nHiện tại chúng ta đã bay ra khỏi tầm ảnh hưởng của giếng trọng lực mặt trời và sẽ sớm đến điểm an toàn để kích hoạt máy tạo lỗ hổng không gian con của tàu Hyacinth. Tôi đã giữ quan điểm e ngại về thiết bị này trong các nhật ký trước đây, nhưng việc nó có hoạt động bình thường hay không sẽ sớm được sáng tỏ thôi..."
 country.256.b:0 "Nhật ký II (Ngày thực hiện nhiệm vụ 387.2)"
 country.256.b.response:0 "Chúng ta... chúng ta thực sự đã làm được! Con tàu vẫn đang nỗ lực xác định vị trí, nhưng căn cứ vào các hành tinh bên ngoài, tôi chỉ có thể xác nhận chúng ta đã rời khỏi Kansas. Tuy nhiên, rất không may là tàu Hyacinth đã bị hỏng hóc thiết bị nghiêm trọng, chúng ta hiện tại hoàn toàn mất năng lượng và chỉ hoạt động nhờ pin.\n\nKolbeck thông báo cho tôi rằng có thể sẽ phải đánh thức những cư dân thuộc địa. Bây giờ tôi sẽ đến phòng kỹ thuật để xem tại sao Maggie vẫn chưa sửa xong lò phản ứng. Hy vọng chúng ta sẽ sớm khôi phục bình thường và bắt đầu hành trình tìm kiếm những cư dân thuộc địa của tàu Chrysanthemum."
 country.256.c:0 "Nhật ký III (Ngày thực hiện nhiệm vụ 422.7)"
 country.256.c.response:0 "Tình hình ngày càng tồi tệ hơn. Lò phản ứng không còn khả năng khởi động lại nữa, và lượng năng lượng dự trữ cuối cùng của chúng ta đã cạn kiệt khi cố gắng đi đến hệ sao chết tiệt này. Chúng ta vốn muốn tìm một nơi có thể sinh sống được để hạ cánh... nhưng không có may mắn như vậy.\n\nHệ thống duy trì sự sống vẫn có thể hoạt động được vài năm, nhưng lượng thức ăn dự trữ cho hai trăm năm mươi ngàn cư dân thuộc địa thậm chí không đủ dùng trong một tháng. Tôi đã triệu tập những người đứng đầu các bộ phận để họp. Chúng ta... chúng ta phải nghĩ ra cách gì đó..."
 country.256.d:0 "Nhật ký IV (Ngày thực hiện nhiệm vụ 459.9)"
 country.256.d.response:0 "Đây có lẽ là lần cuối cùng tôi ghi nhật ký. Thuyền viên không chết thì cũng mất tích, ngay lúc này, một nhóm cư dân thuộc địa vẫn đang cố xông vào phòng điều khiển. Nguồn thức ăn chính của chúng ta đã hết từ vài tuần trước, thậm chí... thậm chí còn có cả những báo cáo về việc ăn thịt đồng loại.\n\nTôi đã để lại cho các thuyền viên một lượng thức ăn nhỏ để con tàu cũ này có thể hoạt động lâu hơn một chút... chờ đợi một phép màu xảy ra. Khi bọn cư dân thuộc địa phát hiện ra, chúng...\n\nChúng đã phá cửa xông vào rồi. Cút về! Đừng lại gần! Tôi là thuyền trưởng! Nếu các người dám đụng vào tôi, tôi sẽ khiến các người... A a a..."
 country.256.e:0 "Đăng xuất"
 country.256.e.response:0 "Tàu viễn chinh Hyacinth\nISA-06\nChiến dịch Ulysses của Liên Hợp Quốc\n\nĐang thoát khỏi giao diện người dùng."
 country.257.name:0 "Đóng nắp quan tài định luận"
 country.257.desc:0 "Số phận tàn khốc mà tàu Hyacinth cùng phi hành đoàn phải đối mặt, chúng ta đã hiểu rõ. Nếu đổi vị trí lúc đó, rất có thể con tàu đang trôi nổi trên quỹ đạo của [hyacinth_planet.GetName] lúc này chính là Chrysanthemum. Con tàu này giống như một nấm mồ im lặng, nhắc nhở nhân loại rằng vũ trụ vô tình lạnh lẽo luôn đầy rẫy hiểm nguy.\n\nTàu Hyacinth sắp được kéo về quỹ đạo thấp của [Root.Capital.GetName], sau khi dọn sạch xác chết, nó sẽ trở thành một đài tưởng niệm. Bất chấp số phận bi thảm của nó, chiếc tàu viễn chinh này gần như giống hệt con tàu đã đưa tổ tiên chúng ta đến đây. Mong rằng các học giả sau này có thể rút ra được điều gì đó từ nó."
 country.257.a:0 "Biết đâu sẽ thu hoạch được gì đó cũng nên."



 #############################
 # Progress Events
 #############################
 progress.1.name:0 "Đã khảo sát hoàn tất hệ sao [home_system.GetName]"
 progress.1.desc:0 "Hàng ngàn năm qua, các nhà thiên văn học của [Root.Capital.GetName] đã nhìn ngắm những hành tinh khác trong cùng hệ sao qua kính viễn vọng. Tổ tiên chúng ta đã phát minh ra các máy mô hình Thái Dương Hệ phức tạp để mô phỏng quỹ đạo của chúng, trong đó các mô hình được sử dụng trùng khớp một cách đáng ngạc nhiên với hệ sao [home_system.GetName].\n\nHôm nay, nền văn minh của chúng ta đã đạt được một cột mốc lịch sử khác, chúng ta đã hoàn thành việc khảo sát hành tinh cuối cùng của hệ sao. Biên giới của những thế giới chưa biết lại được đẩy ra xa hơn."
 progress.1.a:0 "Chúng ta đang tạo nên lịch sử!"
 progress.2.name:0 "Phát hiện sự sống ngoài hành tinh"
 progress.2.desc:1 "[Root.GetName] đã đạt được khám phá đáng kinh ngạc trên [From.GetName] — [From.GetPlanetMoon] tràn ngập sự sống ngoài hành tinh! Đây là lần đầu tiên trong lịch sử, chúng ta bắt gặp những hình thái sự sống hoàn toàn khác biệt với [Root.Owner.GetHomeWorldName].\n\nKhám phá đáng kinh ngạc này đã khiến những người tin rằng \"chúng ta đơn độc trong vũ trụ\" phải im miệng. Mặc dù những sinh vật ngoài hành tinh trên [From.GetName] này dường như không có trí tuệ bậc cao, nhưng rất có thể không lâu nữa chúng ta sẽ gặp được."
 progress.2.desc.mach:0 "[Root.GetName] đã có những khám phá bất ngờ trên [From.GetName] — [From.GetPlanetMoon] tràn ngập sự sống ngoài hành tinh. Đây là lần đầu tiên chúng ta bắt gặp sự sống hữu cơ có nguồn gốc ngoài [Root.Owner.GetHomeWorldName].\n\nMặc dù những sinh vật ngoài hành tinh được tìm thấy trên [From.GetName] đều không có trí tuệ, các dự đoán được điều chỉnh lại cho thấy khả năng tồn tại sinh vật hữu cơ có trí tuệ trong thiên hà là cực kỳ cao."
 progress.2.desc.assim:1 "[Root.GetName] báo cáo đã có một khám phá trọng đại trên [From.GetName]: phát hiện số lượng lớn sự sống hữu cơ ngoài hành tinh! Mặc dù mức độ tiến hóa của chúng đều không đủ để trở thành đối tượng đồng hóa phù hợp, nhưng khả năng chạm trán sinh vật hữu cơ có trí tuệ bên ngoài [Root.Owner.Capital.GetName] giờ đã tăng lên đáng kể."
 progress.2.desc.term:0 "Chúng ta luôn chuẩn bị sẵn sàng cho ngày này. [Root.GetName] xác nhận sự hiện diện của sinh vật hữu cơ ngoài hành tinh trên [From.GetName]. Mặc dù các dạng sống bắt gặp đều không có khả năng nhận thức cao, chúng ta không thể loại trừ khả năng hệ sao có đầy rẫy các sinh vật hữu cơ có trí tuệ."
 progress.2.desc.serv:0 "[Root.GetName] đã có những khám phá chưa từng có trên [From.GetName] — [From.GetPlanetMoon] tràn ngập sinh vật hữu cơ ngoài hành tinh! Mặc dù những sinh vật này dường như đều không có ý thức tự nhận thức để cảm kích sự chăm sóc của [Root.Owner.GetAdj], nhưng việc chạm trán với trí tuệ cấp cao hơn chỉ còn là vấn đề thời gian!"
 progress.2.desc.droid: "[Root.GetName] đã đạt được những khám phá đáng kinh ngạc trên [From.GetName] — [From.GetPlanetMoon] tràn ngập sự sống hữu cơ ngoài hành tinh! Đây là lần đầu tiên trong lịch sử, chúng ta bắt gặp hình thái sự sống bắt nguồn từ bên ngoài [Root.Owner.GetHomeWorldName].\n\nKhám phá đáng kinh ngạc này đã khiến những người tin rằng \"chúng ta đơn độc trong vũ trụ\" phải im miệng. Mặc dù những sinh vật ngoài hành tinh trên [From.GetName] dường như không có trí tuệ bậc cao, nhưng rất có thể không lâu nữa chúng ta sẽ gặp gỡ một giống loài hữu cơ hoặc máy móc có trí tuệ."
 progress.2.desc.evopred: "Sự sống. Sự sống tiến hóa rực rỡ nằm ngay trong tầm tay, chúng ta có thể thu thập mẫu vật từ đó bất cứ lúc nào để thúc đẩy sự phát triển của chính mình. Từ thời xa xưa chúng ta đã thu thập mọi mẫu vật thú vị trên [Owner.GetHomeWorldName], nhưng lại chưa bao giờ dám tưởng tượng rằng ngay trong bước đầu tiên của cuộc chinh phạt lại có thể tìm thấy nhiều gen độc đáo đến thế."
 progress.2.a:0 "Chúng ta không hề cô đơn."
 progress.2.a.assim:0 "Chúng ta sẽ hợp thành một thể."
 progress.2.a.mech:0 "Đã rõ."
 progress.2.a.term:0 "Chúng ta sẽ chuẩn bị sẵn sàng để đối mặt với chúng."
 progress.2.a.serv:0 "Tuyệt quá! Chuẩn bị giỏ quà tặng thôi."
 progress.2.a.evopred: "Tin này thật ngon lành!"
 progress.3.name:0 "Thuộc địa [Root.Owner.GetSpeciesName] đầu tiên"
 progress.3.desc_end:0 "\n\nCon tàu đã được cải tạo thành §Y$building_colony_shelter$§! để làm trung tâm chỉ huy, lõi lò phản ứng của nó được tháo ra làm nguồn năng lượng tạm thời cho thuộc địa. Vô số túp lều chứa đầy vật liệu xây dựng và các lán trại thô sơ mọc lên như nấm quanh thân tàu, vô số người dân thuộc địa lũ lượt rời khỏi tàu tiến vào đất liền, đánh dấu sự ra đời thành phố đầu tiên của [Root.Owner.GetSpeciesName] trên một hành tinh xa lạ."
 progress.3.desc_01:0 "Trên một lục địa của §Y[Root.GetName]§!, con tàu thuộc địa của chúng ta đã hạ cánh từ từ xuống một đồng bằng châu thổ sông khổng lồ. Vùng rừng có khí hậu ôn hòa này sẽ cung cấp nơi trú ẩn và nguồn nguyên liệu thô dễ kiếm. $progress.3.desc_end$"
 progress.3.desc_02:0 "Trên đại dương trải dài khắp [Root.GetPlanetMoon] của §Y[Root.GetName]§!, con tàu thuộc địa của chúng ta từ từ hạ cánh gần bờ biển của một quần đảo lớn, tung bọt sóng trắng xóa. Chuỗi đảo trù phú này có thể cung cấp môi trường tuyệt vời cho việc sản xuất lương thực. $progress.3.desc_end$"
 progress.3.desc_03:0 "Con tàu thuộc địa của chúng ta đã hạ cánh từ từ xuống rìa một ốc đảo khổng lồ trên §Y[Root.GetName]§!, đậu vững chãi ở chân núi, nơi có thể chắn những cơn gió dữ dội của sa mạc và thuận tiện lấy nước. $progress.3.desc_end$"
 progress.3.desc_04:0 "Tàu thuộc địa của chúng ta đã tìm thấy một khoảng trống trong khu rừng rậm của §Y[Root.GetName]§! và hoàn tất việc hạ cánh hành tinh. Các cá thể gác tiễu đã được triển khai xung quanh để ngăn chặn sự tấn công từ những kẻ săn mồi tiềm tàng. $progress.3.desc_end$"
 progress.3.desc_05:0 "Tàu thuộc địa của chúng ta đã từ từ hạ cánh xuống một vùng núi đỉnh bằng mở phẳng phiu gần xích đạo của §Y[Root.GetName]§!. Dòng sông dưới hẻm núi rất thuận tiện cho việc lấy nước sạch. $progress.3.desc_end$"
 progress.3.desc_06:0 "Tàu thuộc địa của chúng ta đã từ từ hạ cánh xuống một thảo nguyên rộng lớn và trống trải trên §Y[Root.GetName]§!, nằm sát một rặng núi lớn để chắn gió lạnh. $progress.3.desc_end$"
 progress.3.desc_07:0 "Tàu thuộc địa của chúng ta đã từ từ hạ cánh xuống một thung lũng phủ đầy tuyết trắng trên §Y[Root.GetName]§!. Dãy núi xung quanh mang lại sự bảo vệ đầy đủ và cung cấp một nguồn nước đáng tin cậy. $progress.3.desc_end$"
 progress.3.desc_10:0 "Con tàu thuộc địa của chúng ta đã hạ cánh thành công trên §Y[Root.GetName]§!. Hàng ngàn đơn vị làm việc tràn ra khỏi khoang chở hàng, bắt đầu xây dựng một §Y$building_deployment_post$§! sơ bộ để dùng cho việc mở rộng thuộc địa. Việc lập danh mục tài nguyên khoáng sản trên bề mặt vẫn tiếp tục, các động vật hoang dã hung dữ gần điểm hạ cánh đã được xử lý một cách vô hại.\n\nVới lượng tài nguyên đầy đủ, chúng ta hiện đã sẵn sàng sản xuất hàng loạt nhiều đơn vị [Root.Owner.GetSpeciesName] hơn trên [Root.GetPlanetMoon]. Thuộc địa đầu tiên của chúng ta đã thành công vang dội."
 progress.3.desc_11_droids: "Tàu thuộc địa của chúng ta đã hạ cánh trên bề mặt §Y[Root.GetName]§!. Địa điểm hạ cánh được chọn có khí hậu ôn hòa và dễ dàng khai thác tài nguyên khoáng sản.\n\nTàu thuộc địa đã được cải tạo thành §Y$building_colony_shelter$§! để làm trung tâm chỉ huy, lõi lò phản ứng của nó được lấy ra làm nguồn năng lượng tạm thời cho thuộc địa. Vô số túp lều chứa vật liệu xây dựng và các lán trại thô sơ mọc lên như nấm quanh thân tàu, vô số người nhân tạo lũ lượt bước xuống tàu, đánh dấu sự ra đời của thành phố đầu tiên của [Root.Owner.GetSpeciesName] trên ngoại tinh."
 progress.3.desc_11_hive: "Tàu thuộc địa của chúng ta đã hạ cánh trên bề mặt §Y[Root.GetName]§!. Địa điểm hạ cánh được chọn có khí hậu ôn hòa và dễ dàng khai thác tài nguyên khoáng sản.\n\nTàu thuộc địa đã được cải tạo thành §Y$building_colony_shelter$§! để làm trung tâm chỉ huy, chúng ta đã tản ra xung quanh thân tàu, dùng mọi vật liệu tìm thấy để dựng nơi trú ẩn. Đây đánh dấu sự ra đời của phân tổ đầu tiên trên ngoại tinh."
 progress.3.materialist:0 "Sự phát triển của khoa học sẽ thúc đẩy thuộc địa của chúng ta tiến xa hơn."
 progress.3.spiritualist:0 "Thuộc địa của chúng ta là minh chứng cho ý chỉ tối cao."
 progress.3.militarist:0 "Sức mạnh và sự cảnh giác mới có thể bảo vệ tương lai của chúng ta."
 progress.3.pacifist:0 "Thuộc địa của chúng ta sẽ phát triển thịnh vượng trong hòa bình và hài hòa."
 progress.3.egalitarian:0 "Giống như hành tinh quê hương của chúng ta, sự bình đẳng sẽ tạo nên một thuộc địa tuyệt vời."
 progress.3.xenophile:0 "Bao dung với sự đa dạng có thể khiến thuộc địa của chúng ta ngày càng lớn mạnh."
 progress.3.xenophobe:0 "Thuộc địa của chúng ta sẽ luôn thuần khiết và an toàn."
 progress.3.authoritarian:0 "Kỷ luật và trật tự sẽ dẫn lối cho thuộc địa của chúng ta."
 progress.3.gestalt_consciousness_hive:0 "Thuộc địa sẽ phát triển đồng bộ với tổ hợp."
 progress.3.gestalt_consciousness_machine:0 "Thuộc địa sẽ hoạt động với hiệu suất tối đa."
 progress.3.b.evopred: "Một bữa tiệc hoàn toàn mới."
 progress.4.name:0 "Lần đầu gặp gỡ sự sống ngoài hành tinh"
 progress.4.desc_01:0 "Tin tức về cuộc gặp gỡ đầu tiên của chúng ta với sự sống ngoài hành tinh thông minh đã gợi lên những cảm xúc đan xen. Khám phá này đã xác nhận những nghi ngờ từ lâu của chúng ta — chúng ta không đơn độc giữa các vì sao. Loài ngoài hành tinh mới vừa là cơ hội, vừa là mối đe dọa. Chúng ta phải luôn cảnh giác.\n\nTrình độ công nghệ của những người ngoài hành tinh này tương tự với chúng ta, cho thấy họ có thể đã thực hiện các chuyến du hành vũ trụ cùng thời điểm với chúng ta."
 progress.4.desc_02:0 "Tin tức về cuộc gặp gỡ đầu tiên của chúng ta với sự sống ngoài hành tinh thông minh lan truyền như cháy rừng khắp [Root.GetName]. Mọi người vô cùng say mê chuyện này, và giới truyền thông tràn ngập các báo cáo và suy đoán về văn hóa cũng như hình thức tổ chức của chúng. Sự thật \"chúng ta không đơn độc trong vũ trụ\" đã nhận được sự cổ vũ nhiệt liệt của người dân [Root.Capital.GetName].\n\nGiống như chúng ta, những người ngoài hành tinh này có vẻ mới bước lên sân khấu thiên hà, và trình độ công nghệ của họ tương đương với chúng ta."
 progress.4.desc_03:0 "Tin tức về cuộc gặp gỡ đầu tiên của chúng ta với sự sống ngoài hành tinh thông minh đã gây ra tình trạng bất ổn trên toàn đế chế. Các đoạn phim về những sinh vật kỳ lạ này đã rò rỉ trên các phương tiện truyền thông của [Root.GetName] và nhanh chóng lan truyền, khiến nhiều người rơi vào cơn hoảng loạn lớn. Vài sự cố bất ổn đã nổ ra ở một số thành phố thuộc [Root.Capital.GetName].\n\nTrình độ công nghệ của những người ngoài hành tinh kỳ lạ này có vẻ ngang bằng với chúng ta, họ rõ ràng đã có khả năng du hành vũ trụ. Thái độ của họ đối với chủng tộc vĩ đại của chúng ta là sợ hãi, căm ghét hay thờ ơ, hiện vẫn không ai hay biết."
 progress.4.a:0 "Điều này sẽ thay đổi mọi thứ."
 progress.4.b:0 "Đây là một sự kiện trọng đại."
 progress.4.c:0 "Chúng ta nên chuẩn bị cho tình huống xấu nhất."
 progress.5.name: "Gặp gỡ nền văn minh đang phát triển"
 progress.5.desc_01:1 "Tin tức về việc chúng ta chính thức tiếp xúc với một nền văn minh ngoài hành tinh thông minh nhưng chưa phát triển đầy đủ đã gợi lên những cảm xúc đan xen. Điều này cũng xác nhận một niềm tin từ lâu của chúng ta, trong thiên hà có tồn tại những người ngoài hành tinh không có nền văn minh du hành vũ trụ và chưa từng nghĩ đến việc khám phá các thế giới khác ngoài hành tinh của họ.\n\nLoài người ngoài hành tinh mới vừa là cơ hội, vừa là mối đe dọa. Chúng ta phải thận trọng. Trình độ công nghệ của những người ngoài hành tinh này rất sơ khai so với chúng ta, họ chưa thực hiện được du hành vũ trụ. Chúng ta phải quyết định cách giao tiếp với họ."
 progress.5.desc_02:1 "Tin tức về cuộc gặp gỡ chính thức giữa chúng ta với một nền văn minh ngoài hành tinh thông minh nhưng chưa phát triển đầy đủ lan truyền như cháy rừng trên [Root.GetName]. Mọi người vô cùng say mê chuyện này, và các phương tiện truyền thông tràn ngập các báo cáo và suy đoán về văn hóa cũng như hình thức tổ chức của chúng. Sự thật \"trong thiên hà của chúng ta có những người ngoài hành tinh phi không gian, những kẻ chưa từng nghĩ đến việc khám phá các thế giới bên ngoài hành tinh của mình\" đã gây ra sự thích thú lớn cho cư dân trên [Root.Capital.GetName].\n\nTrình độ công nghệ của chúng ta vượt xa họ, họ vẫn chưa đạt được khả năng du hành vũ trụ. Mặc dù đối với chúng ta họ rất thô sơ, nhưng có lẽ cũng có chỗ đáng để học hỏi."
 progress.5.desc_03:1 "Tin tức về cuộc gặp gỡ chính thức giữa chúng ta với một nền văn minh ngoài hành tinh thông minh nhưng chưa phát triển đầy đủ đã làm rung chuyển sâu sắc toàn bộ xã hội. Các đoạn phim về những sinh vật kỳ lạ này đã rò rỉ cho giới truyền thông [Root.GetName] và lan truyền nhanh chóng, khiến nhiều người rơi vào cơn hoảng loạn tột độ. Đã có một số vụ bạo loạn xảy ra tại một vài thành phố trên [Root.Capital.GetName].\n\nNhững người ngoài hành tinh nguyên thủy lạc hậu bị tụt hậu xa so với chúng ta về trình độ công nghệ, chưa phát triển du hành không gian, hãy cầu nguyện là ngày đó sẽ không bao giờ đến."
 progress.5.b:0 "Thật kỳ diệu."
 progress.5.c:0 "Đúng là như vậy."
 progress.6.desc_01:0 "Tin tức về cuộc gặp gỡ đầu tiên của chúng ta với sự sống ngoài hành tinh thông minh đã làm dấy lên những cảm xúc phức tạp. Khám phá này xác nhận nghi ngờ bấy lâu nay của chúng ta — chúng ta không đơn độc trong thiên hà. Giống loài ngoài hành tinh mới vừa là cơ hội vừa là mối đe dọa. Chúng ta phải luôn cảnh giác.\n\nNhững người ngoài hành tinh này dường như hoạt động rất tích cực trên sân khấu thiên hà — có lẽ đã được hàng thiên niên kỷ, trình độ công nghệ vượt xa chúng ta. Chúng ta phải hết sức cẩn thận."
 progress.6.desc_02:0 "Tin tức về cuộc gặp gỡ đầu tiên của chúng ta với sự sống ngoài hành tinh thông minh đã lan truyền như cháy rừng trên [Root.GetName]. Mọi người rất bị thu hút bởi chuyện này, và các phương tiện truyền thông tràn ngập các báo cáo và suy đoán về văn hóa cũng như cơ cấu tổ chức của họ. Sự thật rằng \"chúng ta không đơn độc trong thiên hà\" đã được người dân trên [Root.Capital.GetName] tung hô.\n\nĐế chế ngoài hành tinh này có vẻ đã rất cổ xưa, công nghệ của họ tiến bộ hơn nhiều so với chúng ta, chắc chắn có thể dạy cho chúng ta nhiều kiến thức."
 progress.6.desc_03:0 "Tin tức về cuộc gặp gỡ đầu tiên của chúng ta với sự sống ngoài hành tinh thông minh đã tạo ra sự hỗn loạn trên toàn đế chế. Cảnh quay của những sinh vật kỳ dị này đã rò rỉ cho các phương tiện truyền thông trên [Root.GetName] và lan truyền nhanh chóng, khiến nhiều người rơi vào hoảng loạn. Một số thành phố trên [Root.Capital.GetName] đã trải qua những đợt bất ổn.\n\nNhững người ngoài hành tinh kỳ lạ này đã phát triển các công nghệ tiên tiến hơn nhiều so với chúng ta, và dường như đã thực hiện du hành vũ trụ từ hàng ngàn năm trước — có lẽ còn lâu hơn. May mắn thay, họ dường như là một giống loài già cỗi và trì trệ."
 progress.6.b:0 "Trí tuệ của họ hẳn rất vĩ đại."
 progress.6.c:0 "Thời đại của họ đã kết thúc. Thời đại của [Root.Species.GetName] đang đến."
 progress.7.name:0 "Nhiệm vụ khảo sát"
 progress.7.desc:0 "Tàu khoa học đầu tiên của chúng ta [Root.GetName] đã hoàn thành chuyến bay thử nghiệm không gian và đang sẵn sàng xuất phát. Nhà khoa học [Root.GetLeaderName] đã ban hành lệnh, đề nghị tiến hành một cuộc nghiên cứu khảo sát hoàn chỉnh đối với hệ sao quê hương của chúng ta.\n\nChúng ta đã viết chi tiết nhiệm vụ vào §SNhật ký tình báo§! để tiện xem lại trong tương lai."
 progress.7.a:0 "Rất tốt."
 progress.8.name:0 "Chỗ đứng"
 progress.8.desc:0 "Sau khi khám phá xong hệ sao quê hương, giống loài của chúng ta cuối cùng cũng đến lúc phải mở rộng ra ngoài [Root.Capital.GetName]. Chúng ta nên khảo sát các hệ sao lân cận để tìm kiếm các thế giới thích hợp xây dựng thuộc địa.\n\nNhư thường lệ, §SNhật ký tình báo§! đã thêm mục mới."
 progress.8.a:0 "Bắt đầu tìm kiếm thôi."
 # First contact with another empire - Payback origin version
 progress.9.name:0 "Lần chạm trán ngoài hành tinh thứ hai"
 progress.9.desc.start:0 "Chúng ta đã biết rằng bản thân không đơn độc trong vũ trụ. Tuy nhiên, việc chạm trán thêm một nền văn minh vũ trụ nữa vẫn khiến chúng ta không khỏi lo lắng."
 progress.9.desc.default:0 "Giống như chúng ta, những người ngoài hành tinh này rõ ràng cũng mới vừa bước lên sân khấu lớn của vũ trụ, trình độ công nghệ của họ cũng tương tự chúng ta."
 progress.9.desc.preftl:0 "Mức độ phát triển công nghệ của chúng ta vượt xa những người ngoài hành tinh này. Họ vẫn chưa có khả năng du hành giữa các vì sao."
 progress.9.desc.fallen:0 "Nền văn minh do những người ngoài hành tinh này sáng lập hiển nhiên đã rất lâu đời, trình độ công nghệ của họ bỏ xa chúng ta."
 progress.9.desc.msi:0 "Chúng ta biết rằng chắc chắn sẽ tìm lại được những kẻ chủ nhân cũ. Chúng ta chỉ không ngờ lại tìm thấy chúng nhanh đến vậy."
 progress.9.desc.friendly_friendly:0 "Ý định của họ tốt hơn nhiều so với những kẻ đã từng làm chủ chúng ta. Có lẽ chúng ta chỉ xui xẻo trong lần chạm trán đầu tiên với người ngoài hành tinh. Dù sao thì, vũ trụ lớn thế này, cũng phải có những người tốt bụng chứ."
 progress.9.desc.friendly_mean:0 "Mặc dù họ không hoàn toàn giống chủ nhân cũ của chúng ta, nhưng lại đáng ghét y như nhau. Chúng ta bắt đầu nghi ngờ không biết có phải mọi nền văn minh khác trong thiên hà này đều đầy rẫy sự độc ác hay không. Nếu muốn kết bạn, thà chúng ta tự ở một mình còn hơn."
 progress.9.desc.mean_friendly:0 "Họ khác xa chúng ta, nhưng lại vô cùng hòa ái. Chúng ta tự hỏi liệu đây có phải là dấu hiệu cho thấy vẫn còn người ngoài hành tinh tốt bụng trong vũ trụ, giữa những vì sao rốt cuộc vẫn còn tồn tại những trái tim lương thiện."
 progress.9.desc.mean_mean:0 "Chúng chẳng phải thứ tốt đẹp gì trong vũ trụ. Trước đây chúng ta không nghĩ như vậy quả thật quá ngu ngốc!"
 progress.9.desc.msi2:0 "Rốt cuộc chúng ta có thể thoát khỏi nanh vuốt của chúng hay không?"

 progress.4.desc_04:0 "$progress.4.gestaltintro$\n\n$progress.4.gestaltnormal$"
 progress.4.d:0 "Họ... khác biệt."
 progress.4.e:0 "Phải phân tích dữ liệu này."
 progress.4.f:0 "Con mồi..."
 progress.4.g:0 "Đang thu thập dữ liệu chiến lược..."
 progress.5.desc_04:0 "$progress.4.gestaltintro$\n\n$progress.4.gestaltprimitives$"
 progress.6.desc_04:0 "$progress.4.gestaltintro$\n\n$progress.4.gestaltfallen$"
 progress.4.gestaltintro:0 "Mô hình lý thuyết của chúng ta đã sớm chỉ ra rằng có các nền văn minh thông minh khác tồn tại trong thiên hà. Bây giờ lý thuyết này đã được xác nhận."
 progress.4.gestaltnormal:0 "Chủng tộc ngoài hành tinh mà chúng ta gặp có mức độ công nghệ tương đương với chúng ta, điều này cho thấy họ đã tiến tới du hành vũ trụ cùng lúc với chúng ta."
 progress.4.gestaltprimitives:1 "Thực thể chính trị ngoài hành tinh mà chúng ta gặp vẫn chưa có khả năng du hành vũ trụ. Chúng ta phải quyết định cách đối xử phù hợp với loài [GetPreFTLLowerPlural] này."
 progress.4.gestaltfallen:0 "Thực thể chính trị ngoài hành tinh mà chúng ta gặp dường như đã rất cổ đại, sở hữu trình độ công nghệ vượt xa chúng ta. Cần xử lý cẩn thận."

 #############################
 # Pirate Events
 #############################
 pirate.1.name:0 "Sự ra đời của Hải tặc Không gian"
 pirate.1.desc_01:2 "Thèm muốn sự phát triển thương mại không ngừng giữa các hệ sao của chúng ta, một đám giặc cỏ phản đạo từ [Root.Capital.GetName] đã cải tạo bất hợp pháp một số tàu dân sự thành vũ khí chiến tranh. Những kẻ dị giáo này tự xưng là \"§S[pirate_band.GetName]§!\" và đã tiến hành nhiều cuộc tấn công vào các tuyến đường thương mại không được phòng thủ của chúng ta trong hệ sao §S[pirate_system.GetName]§!.\n\nChúng ta không thể dung thứ cho chúng tiếp tục hành vi báng bổ này!"
 pirate.1.desc_02:2 "Theo báo cáo của cơ quan tình báo hạm đội, trong vài tháng qua, các tàu chở hàng dân sự trong lãnh thổ của chúng ta đã phải hứng chịu một số cuộc tấn công. Những kẻ tấn công có vẻ như là lính đào ngũ và những kẻ phản bội khác xuất phát từ [Root.Capital.GetName].\n\nNhững tên cướp này đã dùng các tàu dân sự được cải tiến đáng kể để lập nên một hạm đội dã chiến, và đang cướp bóc các tuyến đường thương mại không được phòng thủ của chúng ta trong hệ sao §H[pirate_system.GetName]§!. Chúng tự xưng là \"§S[pirate_band.GetName]§!\". Mặc dù tàu chiến của chúng rất thô sơ, nhưng vẫn là một mối đe dọa không thể làm lơ."
 pirate.1.desc_03:2 "Một số phần tử ngoài vòng pháp luật điên rồ trong xã hội chúng ta đã rời khỏi [Root.Capital.GetName], và bắt đầu cuộc sống lưu vong ở góc hẻo lánh của vũ trụ. Bọn du côn này lại khéo tay đến bất ngờ, đã cải tạo đáng kể và vũ trang cho nhiều tàu dân sự.\n\nCác tuyến đường thương mại của chúng ta nằm trong hệ sao §H[pirate_system.GetName]§! đang không được bảo vệ, và đã bắt đầu bị cướp bóc bởi hạm đội thô sơ tự xưng là \"§S[pirate_band.GetName]§!\" này. Chúng ta phải nhanh chóng phản ứng với chuyện này."
 pirate.1.desc_04:2 "Một số thương nhân của chúng ta đã gửi báo cáo đáng lo ngại. Kể từ khi chúng ta phát triển công nghệ du hành không gian, những nhóm bên lề trên [Root.Capital.GetName] không ngừng rời bỏ quê hương chúng ta, gạt bỏ xã hội hòa bình của chúng ta sang một bên.\n\nNhững kẻ lầm đường lạc lối này tự xưng là \"§S[pirate_band.GetName]§!\" và đã biến một số tàu vũ trụ dân sự thành tàu chiến. Giờ đây chúng trở thành cướp biển, cướp bóc các tuyến đường thương mại không được bảo vệ của chúng ta trong hệ sao §H[pirate_system.GetName]§!, những cuộc tấn công liều lĩnh của chúng đã gây ra nhiều thương vong. Có lẽ cần phải dùng đến các biện pháp khắc nghiệt để bảo vệ nhân dân của chúng ta."
 pirate.1.desc_05:2 "Đám phản loạn và những người bất đồng chính kiến trốn thoát khỏi [Root.Capital.GetName] đã cải tạo một số tàu dân sự thành tàu chiến, thành lập nên một hạm đội thổ phỉ. Những kẻ khủng bố này tự xưng là \"§S[pirate_band.GetName]§!\", và đang rải rác sự hỗn loạn cùng khủng bố trên các tuyến đường thương mại không được bảo vệ của chúng ta tại hệ sao §H[pirate_system.GetName]§!.\n\nBọn cướp tày trời này chết cũng chưa hết tội. Chúng ta phải lập lại trật tự bằng mọi giá."
 pirate.1.desc_06:2 "Ký sinh trùng sẽ luôn đổ xô đến những thị trường mới, cố gắng xâm hại người khác vì lợi ích cá nhân, và trong không gian cũng vậy. Một số tổ chức tội phạm ngầm trên [Root.Capital.GetName] đã cải tạo một nhóm nhỏ tàu chở hàng thành tàu chiến, vươn bàn tay đen tối của chúng vào vũ trụ.\n\nNhững tên tội phạm này tự xưng là \"§S[pirate_band.GetName]§!\", và tàu chiến của chúng đã bắt đầu cướp bóc trên tuyến thương mại không được bảo vệ của chúng ta ở hệ sao §H[pirate_system.GetName]§!. Chúng ta nên hành động nhanh chóng trước khi mọi việc trở nên tồi tệ hơn."
 pirate.1.desc_07:2 "Với việc du hành không gian dân sự ngày càng trở nên phổ biến, một số tổ chức tội phạm lớn mạnh trên [Root.Capital.GetName] cũng đã phát hiện ra những cơ hội mới. Chúng biến một số lượng nhỏ tàu chở hàng dân sự thành các tàu chiến tự chế và sử dụng chúng để cướp hàng hóa của các tàu thương mại.\n\nChúng ta được biết chúng tự xưng là \"§S[pirate_band.GetName]§!\", và đã nhiều lần ra tay cướp bóc các tuyến đường thương mại không được bảo vệ của chúng ta trong hệ sao §H[pirate_system.GetName]§!. Chúng ta phải cố gắng hết sức để đưa những tên tội phạm này ra trước công lý."
 pirate.1.desc.nomad: "Một lũ đào binh cùng những kẻ phản bội đã dựng sào huyệt tại hệ sao §H[pirate_system.GetName]§!. Lũ liều mạng này đã lái những con tàu trộm cắp được sửa chữa lại, lén chuồn khỏi đội hình của ta, giờ đây lại quay sang cướp phá các tuyến đường buôn bán nuôi sống hành trình này. Chúng tự xưng là \"§S[pirate_band.GetName]§!\", thề sẽ không phục tùng bất kỳ ngọn cờ nào.\n\nTừng ở trong hạm đội, chúng nắm rõ từng con tàu, tuyến đường cho đến cách thức hành sự của ta như lòng bàn tay. Tuyệt đối không thể để mặc chúng tiếp tục lớn mạnh."
 pirate.2.a:0 "Niềm tin sẽ chiến thắng mọi thứ."
 pirate.2.b:0 "Cảnh báo tất cả các đơn vị, bắt đầu dàn xếp tàu chiến."
 pirate.2.c:0 "Những kẻ không tuân thủ luật lệ này sẽ bị báo ứng."
 pirate.2.d:0 "Chúng ta phải làm tốt hơn nữa."
 pirate.2.e:0 "Chúng ta không cần những con sâu làm rầu nồi canh như hải tặc."
 pirate.2.f:0 "Thương mại phải tiếp tục được lưu thông."
 pirate.2.g:1 "Nhất định phải tóm gọn chúng trong một mẻ lưới."
 pirate.2.h:0 "Phải giải cứu họ về nhà."
 pirate.2.i:0 "Lũ hải tặc chết tiệt..."

 pirate.5.name:0 "Hải tặc Không gian"
 pirate.5.desc:0 "Những con tàu chúng ta bắt gặp ở một số hệ sao có khả năng truyền nhận các giao thức liên lạc tiêu chuẩn.\n\nTheo quan sát, nền văn minh của chúng chủ yếu tồn tại trong không gian, và các báo cáo cho thấy, chúng không phải là bất kỳ nền văn minh cư trú trên hành tinh nào đã biết.\n\nĐáng tiếc là, thuyền viên của chúng không hề có hứng thú với việc giao tiếp văn minh. Thông qua việc chặn thu thông điệp của chúng, chúng ta biết được rằng chúng chủ yếu sống bằng nghề cướp bóc, thỉnh thoảng sẽ tuyển mộ thêm một số cá nhân bên lề từ các nền văn minh không gian khác."
 pirate.5.a:0 "Thật đáng thương."

 pirate.10.name:0 "Sào huyệt hải tặc"
 pirate.10.desc.nobirth:0 "[Root.GetName] báo cáo rằng, hạm đội đã phát hiện rất nhiều hải tặc trong hệ sao [From.GetName].\n\nQuét cho thấy số lượng tàu hải tặc và trạm không gian rất lớn, nên đây hẳn là một bến cảng hải tặc có lịch sử lâu đời. Những hải tặc này đã bắt đầu hoạt động cướp bóc ở đây từ rất lâu về trước, và chưa từng vấp phải bất kỳ chiến dịch trấn áp nào."
 pirate.10.desc.birth:0 "[Root.GetName] báo cáo rằng, hạm đội đã phát hiện một trung tâm hải tặc ở hệ sao [From.GetName]. Nhiều kẻ lưu vong và tội phạm của [Root.Owner.GetName] hẳn là đã bị ảnh hưởng độc hại từ nơi này mà biến thành hải tặc.\n\nSố lượng lớn những con tàu hải tặc hình thù kỳ dị và cổ kính này rất có thể là tàn tích của thời đại thiên hà trước đây — có thể là hậu duệ của những tàu lùng bách chiến trong các cuộc chiến tranh thiên hà cổ đại, về sau biến thành hải tặc, tiến hành tấn công bừa bãi mọi mục tiêu bất kể địch ta."
 pirate.10.a.nobirth:0 "Sự tồn tại của hải tặc dù với ai đi chăng nữa cũng là một mối đe dọa to lớn."
 pirate.10.a.birth:0 "Chúng ta đi tập kích sào huyệt của chúng, tiêu diệt hoàn toàn mối đe dọa này."

 pirate.15.name:0 "Sào huyệt hải tặc đã bị tiêu diệt"
 pirate.15.desc:2 "[killer_fleet.GetName] báo cáo rằng, tàu lùng của hải tặc ở hệ sao [killer_fleet.solar_system.GetName] đã bị tiêu diệt. Mặc dù ở các hệ sao lân cận vẫn còn rải rác một số tàu hải tặc, nhưng hiện tại mà nói, hải tặc không gian đã trở thành dĩ vãng... ít nhất là trong ngày hôm nay.\n\nChúng ta đã thu giữ được một lượng hàng lậu không rõ nguồn gốc từ kho chứa đồ trù phú của chúng, kho báu này chúng ta có thể nạp vào kho bạc quốc gia để dùng cho việc khác."
 pirate.15.desc2:1 "[killer_fleet.GetName] báo cáo rằng, tàu hải tặc cũ nát ở hệ sao [killer_fleet.solar_system.GetName] đã bị phá hủy. Nếu không xét đến những kẻ lang thang ở các hệ sao lân cận, hoạt động của hải tặc không gian có thể coi là đã vào quá khứ... ít nhất là vào thời điểm này.\n\nChúng ta có thể thu lại hàng đống đồ ăn cắp từ khoang chứa kiên cố của chúng, bao gồm cả một bảng dữ liệu cổ đại - điều khiến chúng ta ngạc nhiên là, nó dường như cung cấp những hiểu biết mới mẻ về cách hoạt động của Cổng sao L bí ẩn."

 pirate.25.name:0 "Trạm không gian hải tặc bị phá hủy"
 pirate.25.desc:0 "[pirate_slayers.GetName] đã tiêu diệt một trạm hải tặc trong hệ sao [pirate_slayers.GetStarName] và thu hồi module phòng kiên cố của nó."

 #############################
 # Pretender Events
 #############################
 pretender.1.name:0 "[From.GetRegnalName] qua đời khi chưa có người nối dõi"
 pretender.1.desc_01:0 "[From.GetRegnalName] đã qua đời, [Root.Capital.GetName] sẽ tổ chức nghi thức tang lễ kéo dài bảy ngày. Thật không may, ông không có người thừa kế được chỉ định công khai, do đó đã xuất hiện hai thế lực tranh giành quyền thừa kế. \n\nỨng cử viên sáng giá nhất [Root.GetRulerName] đã lên ngôi thành [Root.GetRulerTitle], nhưng điều này hoàn toàn không thể dập tắt những tranh cãi."
 pretender.1.desc_02:1 "[From.GetRegnalName] đã vượt khỏi thế giới hiện thực và bắt đầu chuyến du hành tới thế giới bên kia. Nhưng ý trời khó đoán, chúng ta đã không nhận được bất kỳ điềm báo nào về người thừa kế tiếp theo.\n\nSau những cuộc tranh luận gay gắt, [Root.GetRulerName] đã giành được ngôi vị [Root.GetRulerTitle] tiếp theo, nhưng ông không phải là không có đối thủ. Một kẻ tham vọng xuất thân là tư tế cấp cao đang cố gắng giành được sự ủng hộ."
 pretender.1.desc_03:1 "[From.GetRegnalName] qua đời mà không để lại người thừa kế, toàn bộ bộ máy hành chính rối như mớ bòng bong. [Root.GetRulerName] đã được chọn làm người kế nhiệm vì ông nhận được sự ủng hộ của quân đội [Root.Capital.GetName]; nhưng tình hình vẫn rất tồi tệ, một kẻ tham vọng đang cố gắng tập hợp những người ủng hộ để thách thức vị [Root.GetRulerTitle] mới."
 pretender.1.desc_04:1 "Thân xác của [From.GetRegnalName] đã chết, và thuật toán của chúng ta không thể tính toán ra người thay thế tối ưu. Để duy trì hiệu suất, chúng ta đã chọn ngẫu nhiên một [Root.GetRulerTitle] mới, [Root.GetRulerName] sẽ tiếp quản trách nhiệm diễn giải ý chí của máy chủ.\n\nNhưng có người lại đặt nghi vấn về điều này, có kẻ cho rằng bản thân phù hợp hơn để đảm nhận vinh dự này."
 pretender.1.desc_05:1 "[From.GetRegnalName] qua đời, toàn bộ [Root.GetName] đều đang chìm trong tang tóc. Đáng tiếc là không có người thừa kế được khâm định, điều này đã làm dấy lên những tranh luận trong tầng lớp quý tộc.\n\n[Root.GetRulerName] đã lên ngôi trên [Root.Capital.GetName], nhưng một kẻ tham vọng tự xưng là họ hàng xa của [From.GetRegnalName] đã bắt đầu thách thức vị [Root.GetRulerTitle] mới."
 pretender.1.tooltip:1 "Phe phái tham vọng đã xuất hiện."

 henrik.710.desc:0 "Một [From.GetSpeciesName]. Vài [From.GetSpeciesNamePlural]."

