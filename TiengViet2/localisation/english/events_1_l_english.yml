 admiral_trait_gain:0 "Chỉ huy nhận được đặc tính"
 admiral_trait_loss:0 "Chỉ huy mất đi đặc tính"
 leader.1.name:0 "Tướng tài triển vọng"
 leader.1.desc:0 "Thuyền trưởng [officer.GetName], sĩ quan chỉ huy của tàu [ship.GetName], gần đây đã thể hiện xuất sắc trong trận chiến ở hệ sao [system.GetName]. Bộ Tư lệnh Hải quân trên [Root.Capital.GetName] quyết định tuyên dương vị thuyền trưởng vô cùng tiềm năng này, và thăng chức lên làm chỉ huy."
 leader.1.desc.machine:0 "[officer.GetName] đã được thăng chức trong hệ thống chỉ huy vì xử lý thành công khối lượng công việc ngày càng tăng khi tàu [ship.GetName] chiến đấu trong hệ sao [system.GetName]."
 leader.1.desc.hive:0 "[officer.GetName] đã được thăng hạng lên vị trí [GetLeaderStatusAdjCap] vì có phản ứng xử lý vô cùng cao độ trong những cuộc giao tranh gần đây của [ship.GetName] tại hệ sao [system.GetName]."
 new_admiral: "Một §Hchỉ huy§! mới đã được thêm vào nhóm §H$RECRUITABLE_LEADERS$§!."
 leader.newadmiraltrait.desc.machine:0 "[officer.GetName] đã phát triển một tập dữ liệu chiến thuật mới bằng cách sử dụng các vector đặc trưng trong những lần thực chiến ở hệ sao [system.GetName] gần đây."
 leader.lostadmiraltrait.desc.machine:0 "Trải qua những lần thực chiến ở hệ sao [system.GetName] gần đây, [officer.GetName] đã cải thiện các giao thức giao chiến của chính mình."
 leader.newadmiraltrait.desc.hive:0 "Sau trận chiến ở hệ sao [system.GetName], [officer.GetName] đã bộc lộ khả năng biểu hiện gen độc đáo."
 leader.lostadmiraltrait.desc.hive:0 "Trận chiến diễn ra ở hệ sao [system.GetName] đã khiến [officer.GetName] xuất hiện những hành vi bất thường."
 leader.5.desc:0 "Sau chiến thắng gần đây tại hệ sao [system.GetName], chỉ huy [officer.GetName] đã nghĩ ra một bộ lý thuyết chiến thuật mới. [officer.GetSheHeCap] bắt đầu thử nghiệm những chiến lược và chiến thuật vô cùng mới mẻ."
 leader.6.desc:0 "Chiến thắng ở hệ sao [system.GetName] gần đây dường như đã thắp lên niềm khao khát đi săn trong lòng vị chỉ huy [officer.GetName], giờ đây ông ấy trở nên hiếu chiến hơn."
 leader.7.desc:0 "Sau khi dẫn dắt [From.From.GetName] giành chiến thắng ở hệ sao [system.GetName], chỉ huy [officer.GetName] ngày càng trở nên tự tin hơn, thậm chí còn bắt đầu từ chối rút lui trong các trận chiến tương lai."
 leader.8.desc:0 "Sau khi chỉ huy [officer.GetName] giành thêm một chiến thắng nữa ở hệ sao [system.GetName], [officer.GetHerHis] đã bắt đầu giải thích về tầm quan trọng của tốc độ và cơ động trong buổi họp báo cáo của hạm đội do [officer.GetHerHis] chỉ huy. [officer.GetSheHeCap] đang tiến hành thử nghiệm các đội hình mới nhằm để hạm đội dưới quyền [officer.GetHerHis] có thể phát huy tối đa sự linh hoạt."
 leader.9.desc:0 "Sau đại thắng của [From.From.GetName] tại hệ sao [system.GetName] gần đây, chỉ huy [officer.GetName] tràn đầy năng lượng và sức sống hơn bình thường. Màn thể hiện của [officer.GetHerHisCap] đã tăng lên đáng kể."
 leader.10.desc:0 "Chỉ huy [officer.GetName] dường như đã hình thành nên nét tính cách thận trọng sau thất bại gần đây tại hệ sao [system.GetName]. Vị Chỉ huy giờ đây đã cẩn thận và tỉ mỉ hơn nhiều trong việc điều phối các khí tài hạm đội dưới quyền chỉ huy của [officer.GetHerHis]."
 leader.11.desc:0 "Sau thất bại gần đây tại hệ sao [system.GetName], chỉ huy [officer.GetName] bắt đầu nghi ngờ nhân sinh, hoài nghi chính bản thân mình. Rất rõ ràng, ông ta đã đánh mất khả năng chỉ huy các hạm đội quy mô lớn."
 leader.12.desc:1 "Việc [Root.GetName] rút lui khỏi trận chiến ở hệ sao [system.GetName] gần đây có vẻ đã giáng một đòn mạnh vào chỉ huy [officer.GetName]. [officer.GetName] quyết định sau này sẽ không bao giờ đào ngũ trước trận chiến nữa, hy vọng sẽ chiến đấu đến cùng trong trận chiến tiếp theo của [officer.GetHerHis]."
 leader.13.desc:0 "Khi rút lui [Root.GetName] khỏi trận chiến ở hệ sao [system.GetName], chỉ huy [officer.GetName] đã để những con tàu dưới quyền [officer.GetHerHis] chạy nhanh như ngựa bay. [officer.GetSheHeCap] đã học được cách phát huy tốc độ tối đa cho các con tàu dưới quyền mình."
 leader.14.desc:0 "Chỉ huy [officer.GetName] không thể gượng dậy nổi sau khi phải nếm mùi thất bại ở hệ sao [system.GetName]. Các vị tướng dưới quyền [officer.GetHerHis] báo cáo vị chỉ huy này không còn đủ khả năng đảm nhận chức trách của [officer.GetHerHis] như trước kia nữa."
 leader.optimizations.desc.machine:0 "[officer.GetName] đã cập nhật phương pháp phỏng đoán thao tác của bản thân dùng trong việc quản lý hạm đội."
 leader.optimizations.desc.hive:0 "[officer.GetName] đã trở nên nhạy bén hơn trong việc thao tác hạm đội."
 leader.15.desc:0 "Chỉ huy [officer.GetName] đã nhận được kiến thức kỹ thuật vô giá khi tiến hành thanh tra việc sửa chữa tàu [Root.GetName]. Đội kiểm soát hư hỏng do vị chỉ huy này chỉ huy giờ đây đã có thể sửa chữa tàu ngay tức thì trên chiến trường."
 leader.16.desc:0 "Việc chỉ huy một hạm đội khổng lồ như [Root.GetName] đã giúp chỉ huy [officer.GetName] nắm vững các kỹ năng chỉ huy quý giá. Giờ đây, người chỉ huy đã có đủ năng lực kiểm soát các hạm đội quy mô lớn hơn."
 leader.17.desc:0 "Sau khi chỉ huy [From.From.GetName] giành chiến thắng trong trận chiến ở hệ sao [system.GetName], chỉ huy [officer.GetName] dường như đã lấy lại được sự tự tin của [officer.GetHerHis]. [officer.GetSheHe] giờ đã có thể đảm nhận nhiệm vụ chỉ huy các hạm đội quy mô lớn."
 leader.18.desc:0 "Khi chỉ huy [Root.GetName], chỉ huy [officer.GetName] đã học được cách tính toán cẩn thận nguồn tiếp tế của [officer.GetHisHer] nhằm giảm thiểu đáng kể chi phí bảo dưỡng tàu."
 leader.19.desc:0 "Sau khi thăm dò hệ sao [system.GetName], chỉ huy [officer.GetName] đã nắm vững cách bố trí các đơn vị của [officer.GetHerHis] nhằm tối đa hóa phạm vi quét của cảm biến. Có rất ít chỉ huy hạm đội nắm vững được các thao tác phức tạp như vậy."

 leader.newtrait:0 "§H[From.From.GetTitle] [From.From.GetName]§! đã học được những kỹ năng mới thông qua quá trình làm việc chăm chỉ và đúc kết kinh nghiệm."
 leader.substanceabuser:0 "Chúng tôi đã nhận được một số báo cáo rất tồi tệ về sức khỏe đang dần suy yếu của §H[From.From.GetTitle] [From.From.GetName]§!. Vẻ ngoài tiều tụy của [From.From.GetHerHisCap] giống như [From.From.GetSheHe] già đi 20 tuổi vậy. Gánh nặng trách nhiệm đôi khi thực sự rất đè nén."
 leader.arresteddevelopment:0 "Mặc dù §H[From.From.GetTitle] [From.From.GetName]§! gần đây đã trau dồi được kỹ năng thông qua việc tích lũy kinh nghiệm, nhưng dường như đã gặp phải điểm nghẽn trong khả năng của [From.From.GetHerHis]."
 leader.lethargic:0 "Mặc dù §H[From.From.GetTitle] [From.From.GetName]§! gần đây đã nâng cao kỹ năng thông qua việc tích lũy kinh nghiệm, nhưng sự quyết tâm và động lực đó dường như đã biến mất."
 leader.stubborn:0 "Mặc dù §H[From.From.GetTitle] [From.From.GetName]§! có nhiều kinh nghiệm hơn, nhưng ông ta cũng trở nên cố chấp hơn với những kinh nghiệm của chính mình. Sự cố chấp của [From.From.GetTitle] khiến họ khó mà chấp nhận được những tư tưởng mới."


 leader.30.name:0 "Trợ lý thông minh đã bị loại bỏ"
 leader.30.desc:1 "Theo chính sách gần đây của chúng ta về việc tuyên bố trí tuệ nhân tạo là bất hợp pháp, tất cả các sĩ quan khoa học [Root.GetAdj] sở hữu trợ lý §YTrí tuệ nhân tạo thông minh§! đều được lệnh phải từ bỏ trợ lý của họ và đem đi tái chế."

 ##########################
 # Diplomatic Events
 ##########################

 diplomatic.2.name:0 "Chỉ huy của [From.From.Owner.GetAdj] lăng nhục chúng ta"
 diplomatic.2.desc: "Mọi người đều biết rằng người [From.From.Owner.GetSpeciesNamePlural] luôn coi thường các sinh mệnh ngoài hành tinh. Đại sứ nước ngoài nhậm chức ở [From.From.Owner.GetName] hầu như không nhận được sự tôn trọng tối thiểu nhất, nhưng cũng đành phải nhẫn nhục chịu đựng. May thay, khi băng qua không gian của [Root.GetAdj], các cuộc giao tiếp thường được tiến hành theo quy trình tiêu chuẩn.\n\nNhưng vài ngày trước đã xảy ra một trường hợp ngoại lệ, khi chỉ huy hạm đội đi qua hệ sao [From.From.GetStarName], [broadcasted_insult_leader.GetName] đã có những lời lẽ cực kỳ tồi tệ đối với những người dân không phòng bị. Người chỉ huy đó dường như đã nhận được tín hiệu radio từ một trong những hành tinh của chúng ta, và sau đó đã chửi bới văn hóa và nguồn gốc tiến hóa của chúng ta. Hàng triệu người đã nghe được đoạn này, và cảm giác phẫn nộ đã lây lan sang tất cả mọi người."
 diplomatic.2.a:0 "[From.From.Owner.GetName] phải lập tức loại bỏ lão ngoan cố này."
 diplomatic.2.b:0 "Giao [broadcasted_insult_leader.GetName] ra xử tử ngay lập tức!"
 diplomatic.2.c:0 "Mấy lời đó chỉ là nói suông thôi. Đừng quá để tâm chi tiết làm gì."
 diplomatic.3.name:0 "Chỉ huy lăng nhục [From.GetSpeciesNamePlural]"
 diplomatic.3.desc:0 "Mặc dù chúng ta vẫn không mấy sẵn lòng giao du với lũ [From.GetSpeciesNamePluralInsult] hay bất kỳ giống loài nào khác, nhưng hầu hết mọi người vẫn cố gắng không công khai bày tỏ sự khinh miệt của mình ở những nơi không phù hợp. Nhưng khi đi qua không gian của [From.GetAdj], chỉ huy [broadcasted_insult_leader.GetName] đã gạt bỏ mọi lo lắng và có những lời lẽ vô cùng cay độc nhằm vào người [From.GetSpeciesName]. Các cuộc thảo luận về một loạt thói hư tật xấu của đối phương đã trở thành chủ đề nóng nhất trong [Root.GetHomeWorldName], nhưng nó cũng gây ra một cuộc khủng hoảng ngoại giao.\n\n[broadcasted_insult_leader.GetName] đã đưa ra lời xin lỗi riêng, cho rằng những lời không phù hợp là do cơn tức giận nhất thời khi nghe đài phát thanh địa phương. Chính quyền [From.GetAdj] yêu cầu lập tức bãi nhiệm kẻ đã ăn nói lỗ mãng."
 diplomatic.3.a:0 "Tính tình nóng nảy như vậy thì làm sao có thể đảm nhận chức chỉ huy."
 diplomatic.3.b:0 "Chương trình phát thanh đó nghe cũng thú vị đấy chứ. Chúng ta không thể đuổi Thượng tướng của chúng ta vì lý do này được!"
 diplomatic.4.desc:0 "Mặc dù chúng ta vẫn không muốn giao du với lũ [From.GetSpeciesNamePluralInsult] ngoài hành tinh, nhưng hầu hết mọi người đều cố gắng không bày tỏ sự khinh miệt một cách công khai trong những hoàn cảnh không phù hợp. Nhưng khi băng qua không gian của [From.GetAdj], chỉ huy [broadcasted_insult_leader.GetName] đã bỏ lại mọi sự e dè và đưa ra một bài phát biểu cực kỳ cay nghiệt về người [From.GetSpeciesName]. Các cuộc thảo luận về một loạt những tật xấu của họ đã trở thành chủ đề bàn tán sôi nổi nhất tại [Root.GetHomeWorldName], nhưng đồng thời cũng gây ra một cuộc khủng hoảng ngoại giao.\n\n[broadcasted_insult_leader.GetName] đã riêng tư xin lỗi, nói rằng ông ta đã đưa ra nhận xét không phù hợp trong lúc tức giận khi nghe được đài phát thanh địa phương. Chính phủ [From.GetAdj] yêu cầu lập tức xử tử kẻ buông lời lăng mạ và đưa [broadcasted_insult_leader.GetHimHer] đến [From.GetHomeWorldName]."
 diplomatic.4.a:0 "Một mạng người có thể giải quyết xích mích của hàng triệu người, cái giá này cũng đáng."
 diplomatic.4.b:0 "Sự sống chết của người phe mình sao có thể giao cho người ngoài hành tinh định đoạt chứ!"
 diplomatic.5.name:0 "[From.GetName] sa thải chỉ huy"
 diplomatic.5.desc:0 "Các nhà ngoại giao phe ta đã thúc giục đối phương cẩn thận lựa chọn ứng viên lãnh đạo. Dưới áp lực cấp bách, [From.GetRulerName] đã bãi nhiệm chức vụ chỉ huy của [broadcasted_insult_leader.GetName]. Vị chỉ huy bị bãi nhiệm không lẳng lặng rời đi mà lớn tiếng chửi rủa, thề bằng tên của [broadcasted_insult_leader.GetHisHer], hy vọng [From.GetAdj] có thể đoàn kết nhất trí để kiên quyết chống lại [Root.GetName].\n\nTuy nhiên, về vấn đề đi lại trên lãnh thổ của chúng ta trong tương lai, chính phủ của [From.GetName] đã bày tỏ thái độ rõ ràng: Mặc dù không thích giao thiệp với người ngoài hành tinh nhưng họ sẽ đảm bảo rằng [Root.GetSpeciesName] sẽ nhận được sự tôn trọng tối thiểu nhất."
 diplomatic.5.a:0 "Tốt nhất là chúng đừng nên có hành động đi quá giới hạn nào."
 diplomatic.6.name:0 "[From.GetName] dẫn độ chỉ huy"
 diplomatic.6.desc:0 "Sau một thời gian đàm phán ngắn, đối phương đã dẫn độ [broadcasted_insult_leader.GetName] cho chúng ta để nhận hình phạt. Sau khi xem xét cẩn thận xem hình phạt nào sẽ là phù hợp với tội phỉ báng [Root.GetSpeciesName], chúng tôi cho rằng chỉ có cái chết và sự hủy diệt hoàn toàn mới là hình phạt thích đáng nhất.\n\n[broadcasted_insult_leader.GetHerHis] bị nhốt trong một khoang tách biệt, bắn về trung tâm của [Root.Capital.StarName] với vận tốc gần bằng tốc độ ánh sáng. Trong những giây phút cuối đời, vị chỉ huy không hề ăn năn hối cải vẫn tiếp tục buông những lời lẽ kích động đầy nhục mạ, cửa cống cuối cùng đóng lại đã cách ly hoàn toàn giọng nói của ông ta. Ngọn lửa đã thắp sáng màn đêm cho tổ tiên chúng ta, sẽ thiêu rụi mọi kẻ buông lời nhục mạ thành tro bụi."
 diplomatic.6.a:0 "Cuối cùng thì cũng không còn âm thanh vu khống nào của [From.GetRandomSpeciesSound] nữa rồi."
 diplomatic.7.name:0 "[From.GetName] bao che cho chỉ huy"
 diplomatic.7.desc:0 "Yêu cầu bãi nhiệm [broadcasted_insult_leader.GetName] của chúng ta đã vấp phải sự khó hiểu của [From.GetRulerTitle] [From.GetRulerName] và chính phủ [From.GetAdj]. Phản hồi mà họ gửi đến cơ bản là đang biện minh cho những lời nói và hành động của vị chỉ huy kia, thậm chí còn ám chỉ rằng một số phát ngôn của [broadcasted_insult_leader.GetSheHe] nhắm vào [Root.GetSpeciesNamePlural] không phải là không có lý.\n\nChúng ta đã từng nghĩ rằng nhận xét trước đây chỉ là định kiến cá nhân của ai đó, nhưng hiện tại xem ra đó dường như là sự đồng thuận của [From.GetName]. Chúng cho rằng có thể tha hồ lăng nhục đế chế của chúng ta và không phải trả giá cho sự bôi nhọ của chúng."
 diplomatic.7.a:0 "Có vẻ như thượng bất chính hạ tắc loạn."
 diplomatic.8.name:0 "Chỉ huy bị giáng chức trở lại nhậm chức"
 diplomatic.8.desc:1 "Cựu chỉ huy này từng gây ra khủng hoảng ngoại giao vì những lời lăng mạ, cuối cùng bị trục xuất khỏi hạm đội. Nhưng giờ đây người này định tái xuất. Với việc chiến tranh đang diễn ra, lời phát biểu trước đây của người này đã trở thành câu tuyên truyền mà mọi người nghe thấy hàng ngày. Do đó, với nhiều người, đặc biệt là quân nhân, vị chỉ huy này đã trở thành hóa thân của công lý.\n\nMặc dù việc bãi bỏ nghị quyết trước đó lúc này có thể làm tổn hại đến uy tín của chính phủ, nhưng người chỉ huy này là ứng cử viên tốt nhất để lãnh đạo cuộc chiến tranh này."
 diplomatic.8.a:0 "Chúng ta cần một vị anh hùng để hô hào, tập hợp người dân!"
 diplomatic.8.b:0 "Quyết định của chúng ta là đúng đắn, chúng ta phải giữ vững nguyên tắc."
 diplomatic.10.name:0 "Nghiên cứu viên nghi ngờ tàu nước ngoài"
 diplomatic.10.desc:0 "[Root.GetName] vốn nổi tiếng về các thành tựu học thuật và đổi mới, nhưng việc dẫn dắt sự phát triển của nền công nghệ tiên tiến là không hề dễ dàng. Không chỉ cần phải hiểu rõ về nghiên cứu, mà còn cần phải biết chia sẻ kết quả nghiên cứu cho ai. Các bí mật thương mại của chúng ta nhận được rất nhiều sự chú ý trong vũ trụ, và một số nhà khoa học lại càng rất coi trọng việc bảo vệ dữ liệu nghiên cứu của riêng họ.\n\nSự xuất hiện của tàu khoa học [From.From.Owner.GetAdj] đã làm dấy lên sự nghi ngờ của nhiều trung tâm nghiên cứu, nhiều viện nghiên cứu sợ rằng chúng đến để đánh cắp bí mật. Một số nhà nghiên cứu bày tỏ rằng họ không thể chuyên tâm làm nghiên cứu trong hoàn cảnh như vậy, do đó đã yêu cầu chúng ta phải đóng cửa biên giới với những người [From.From.Owner.GetSpeciesNamePlural] đáng ngờ này."
 diplomatic.10.a:0 "Các nhà khoa học của chúng ta cần an tâm nghiên cứu. Đóng cửa biên giới."
 diplomatic.10.b:0 "Tàu khoa học là đồng nghiệp trong giới nghiên cứu, không phải thám tử."
 diplomatic.11.name:0 "[From.GetName] đóng cửa biên giới"
 diplomatic.11.desc:0 "Tàu Khoa Học khoa học của [From.GetAdj] đã có những hành vi đáng ngờ xuất hiện trong lãnh thổ của chúng ta, làm dấy lên sự nghi ngờ của chúng ta. Các nhà nghiên cứu của chúng ta cho rằng các nhà khoa học của các người không làm nghiên cứu khoa học, mà có ý định đánh cắp thành quả nghiên cứu của chúng ta. Để bảo vệ bí mật thương mại của phe ta, chúng ta buộc phải đuổi các người ra khỏi biên giới."
 diplomatic.11.a:0 "Các nhà khoa học lại chẳng thể tin tưởng nhau, đúng là một thời đại bất an."
 diplomatic.12.name:0 "[From.From.GetName] bị nghi ngờ vẽ bản đồ gen"
 diplomatic.12.desc:0 "Kể từ khi rời khỏi [Root.GetHomeWorldName], việc đề phòng các giống loài ngoài hành tinh xâm lược đã trở thành ưu tiên hàng đầu của chúng ta. Không phải chúng ta không biết về việc Tàu Khoa Học của [From.From.GetAdj] đã lẻn vào khu vực của chúng ta, nhưng chúng ta vẫn luôn nghĩ rằng họ đang nghiên cứu khoa học. Cho đến gần đây, một thuyết âm mưu đã bùng nổ.\n\nNổi tiếng nhất của người [From.From.GetSpeciesName] chính là sử dụng bản đồ gen trong nghiên cứu y học. Nếu như họ thực sự đang vẽ bản đồ gen của [Root.GetSpeciesNamePlural] nhằm tìm ra điểm yếu của chúng ta thì sao? Mặc dù không có đủ bằng chứng để chứng minh điều này, nhưng nhân dân yêu cầu phải đóng cửa biên giới với [From.From.GetName] để chấm dứt mọi khả năng."
 diplomatic.12.a:0 "Chúng ta không thể mạo hiểm để kẻ thù lấy được những dữ liệu này! Đóng cửa biên giới."
 diplomatic.12.b:0 "Chúng ta không thể dựa vào một thuyết âm mưu vô căn cứ để quyết định chính sách đối ngoại được."
 diplomatic.12.c:0 "Chúng ta phải ăn miếng trả miếng, bắt đầu một dự án vẽ bản đồ gen của đối phương."
 diplomatic.13.name:0 "[From.GetName] đóng cửa biên giới"
 diplomatic.13.desc:0 "Tàu khoa học của các người đang thực hiện một số hành vi đáng ngờ trong khu vực của chúng ta. Có tin đồn các người đang nghiên cứu cấu trúc di truyền của chúng ta với ý đồ tìm ra điểm yếu hoặc chế tạo vũ khí sinh học. Chúng ta không thể để người dân của [From.GetSpeciesAdj] đối mặt với nguy cơ này."
 diplomatic.13.a:0 "Ăn nói hàm hồ!"
 diplomatic.14.name:0 "Vẽ bản đồ gen thu được kết quả tốt"
 diplomatic.14.desc:0 "Dù chúng ta không thu được thông tin chi tiết như mong muốn từ xét nghiệm bộ gen, nhưng nghiên cứu đã làm sáng tỏ thêm đặc tính di truyền của chúng ta. Một số vũ khí mà chúng ta từng sử dụng trong cuộc chiến trên mặt đất ở [Root.GetHomeWorldName] có thể hoàn toàn vô hiệu đối với sinh vật ngoài hành tinh. Khám phá mới này đã giúp chúng ta phát triển học thuyết tác chiến hiện đại."
 diplomatic.14.a:0 "Nếu chúng thực sự nhắm vào chúng ta, thì cái này có thể có tác dụng đấy."
 diplomatic.15.name:0 "Sĩ quan khoa học của [From.From.GetAdj] tò mò quá mức"
 diplomatic.15.desc:0 "[Root.GetName] trên con đường khám phá và nghiên cứu thế giới vật chất sẽ cố gắng tránh né sự ảnh hưởng của tôn giáo và triết học, nhưng chúng ta ít nhiều đều duy trì sự tôn trọng cơ bản đối với những tồn tại và truyền thống chưa biết. Còn các nhà khoa học của [From.From.GetName] dường như đã lơ là điểm này trong những khám phá thiên văn học mới nhất của họ.\n\nKhi bắt đầu nghiên cứu về các hệ sao liên quan đến những câu chuyện thần thoại của [Root.GetSpeciesAdj], [encroaching_research_leader.GetName] bị cáo buộc là \"có ý đồ bác bỏ tính chân thực của những câu chuyện thần thoại này\". Dù chúng ta hiểu rõ ý nghĩa tinh thần của các chòm sao sẽ không bị ảnh hưởng bởi những khám phá trong thế giới vật chất, nhưng rất nhiều người phản đối nghiên cứu của họ và yêu cầu [encroaching_research_leader.GetHimHer] rời khỏi không gian của [Root.GetAdj]."
 diplomatic.15.a:0 "Chỉ cần nghi ngờ chúng có ý đồ bất chính là cũng đủ lý do để chúng ta trục xuất những kẻ này."
 diplomatic.15.b:0 "Tín ngưỡng của chúng ta vượt ra ngoài thế giới vật chất. Tín ngưỡng là không thể bị hủy diệt."
 diplomatic.15.b.tooltip:0 "[encroaching_research_leader.GetName] tiếp tục công việc nghiên cứu của [encroaching_research_leader.GetHerHis]."
 diplomatic.16.name:0 "[From.GetName] đóng cửa biên giới"
 diplomatic.16.desc:0 "Nhà khoa học [encroaching_research_leader.GetName] của các người đã quan tâm quá mức đến hệ sao mà chúng tôi xem là thánh địa. Chúng ta không thể để cho bất kỳ ai không tôn trọng tín ngưỡng và thần thoại của chúng ta hoạt động trong lãnh thổ của chúng ta."
 diplomatic.16.a:0 "Đây nhất định là hiểu lầm, là hiểu lầm."
 diplomatic.17.name:0 "Phát hiện học thuyết ngoại lai ở [From.GetName]"
 diplomatic.17.desc:0 "Thực hiện nghiên cứu khoa học trong không phận ngoại bang đòi hỏi phải rất cẩn thận, đây là điểm mà các nhà khoa học thường hay bỏ qua. Và mới đây, [encroaching_research_leader.GetName] đã gặp phải rắc rối khi nghiên cứu về một chòm sao nào đó trong hệ sao [From.GetAdj]. Người dân địa phương đã lên tiếng phản đối nghiên cứu này và luôn quấy nhiễu [encroaching_research_leader.GetHimHer] mãi đến khi [From.GetRulerTitle] [From.GetRulerName] đưa ra tuyên bố cấm tiến hành nghiên cứu này mới thôi.\n\n[encroaching_research_leader.GetName] tỏ ra vô cùng bất mãn về chuyện này, và có vẻ đã thực sự tìm ra bằng chứng, chứng minh được rằng thần thoại [From.GetAdj] về những chòm sao này hoàn toàn mâu thuẫn với độ tuổi và sự phát triển thực tế của chúng. Một khi công bố kết quả nghiên cứu này, nó nhất định sẽ châm ngòi cho sự phẫn nộ trên quy mô lớn hơn của đối phương."
 diplomatic.17.a:0 "[encroaching_research_leader.GetSheHe] cố tình tạo tin giật gân à? Đuổi việc [encroaching_research_leader.GetHimHer]."
 diplomatic.17.b:0 "Trên con đường theo đuổi khoa học, những chuyện như vậy thường hay xảy ra lắm."
 diplomatic.18.name:0 "[encroaching_research_leader.GetName] công bố học thuyết dị giáo"
 diplomatic.18.desc:0 "Mặc dù chúng ta tin tưởng rằng các nhà nghiên cứu của [From.GetName] thực hiện nghiên cứu các chòm sao cổ đại của chúng ta là với thiện ý, nhưng [encroaching_research_leader.GetSheHe] đã làm công chúng của chúng ta tức giận. Người này đã đánh giá lại tuổi của một số ngôi sao, và tuyên bố rằng sự phát triển về độ sáng cũng như tầm nhìn của chúng đang mâu thuẫn nghiêm trọng với các truyền thuyết về chòm sao của chúng ta.\n\nNhững người vốn có thành kiến với dự án này cho rằng những hành động này hoàn toàn xuất phát từ sự ác ý, và yêu cầu dừng việc nghiên cứu. Chính quyền [From.GetAdj] đã quyết định phủi tay trong vấn đề này, từ chối hành động để ngăn chặn sự tức giận và đau khổ lan truyền giữa công chúng của chúng ta."
 diplomatic.18.a:0 "Chúng ta không bao giờ nên tin tưởng rằng họ sẽ tôn trọng chúng ta."
 diplomatic.19.name:0 "Nhạc cụ hơi bằng gỗ ngoài hành tinh"
 diplomatic.19.desc:0 "Từ khi rời khỏi [Root.GetHomeWorldName], chúng ta đã gặp đủ loại âm nhạc kỳ lạ, và từ đó dấy lên vô số các cuộc tranh cãi. Có một số nhạc cụ của người ngoài hành tinh mà chúng ta không thể nghe thấy, và cũng có một số nhạc cụ đủ sức phá hủy thính giác của chúng ta. Cho nên loại âm nhạc của người ngoài hành tinh mà chúng ta thích là rất ít.\n\nTuy nhiên mới đây tại [music_listening_planet.GetName] đã xuất hiện một trường hợp ngoại lệ. Gần khu vực biên giới [music_origin_country.GetAdj], các đài phát thanh vẫn thường xuyên phát nhạc của nước láng giềng và nhận được sự hưởng ứng vô cùng nồng nhiệt. Nhạc cụ nào đó ở [music_origin_country.GetHomeWorldName] không chỉ rất êm tai, mà còn có thể khiến thân thể [Root.GetSpeciesAdj] sinh ra cộng hưởng, khiến [Root.GetSpeciesOrganName] có cảm giác thoải mái dễ chịu. Cho dù đây là loại nhạc cụ gì, thì nó chắc chắn hoàn toàn khác biệt với loại nhạc cụ của chúng ta."
 diplomatic.19.a:0 "Đây là cơ hội cực tốt để nghiên cứu văn hóa của họ."
 diplomatic.19.b:0 "Cẩn tắc vô áy náy, trước tiên hãy nghiên cứu loại nhạc cụ này."
 diplomatic.20.name:0 "Sinh học nhạc cụ"
 diplomatic.20.desc:1 "Sau khi nghiên cứu cẩn thận các nhạc cụ của người ngoài hành tinh, chúng ta mới phát hiện ra rằng nhạc cụ này là một loại nhạc cụ hơi được chế tạo bằng một loài thực vật nào đó trên quê hương họ. Cấu trúc bên trong của loại thực vật này hoàn toàn khác với bất kỳ loại thực vật nào trên [Root.GetHomeWorldName], thậm chí cả cấu trúc phân tử cũng khác biệt. Khi gió thổi qua loại thực vật này đã tạo ra hiệu ứng diệu kỳ trên cơ thể [Root.GetSpeciesAdj]; điều này đã giúp chúng ta có thêm những hiểu biết về sinh lý học của bản thân, và càng hiểu rõ hơn về thực vật học ngoài hành tinh."
 diplomatic.20.a:0 "Ai mà biết được sẽ có khám phá gì?"
 diplomatic.21.name:0 "[neighbor_contesting_colony.GetName] phản đối việc mở rộng"
 diplomatic.21.desc:0 "Thuộc địa mới của các người ở [Root.GetName] nằm rất gần với biên giới của chúng tôi. Chúng tôi hy vọng các người có thể sơ tán khỏi hành tinh này, nhằm tránh những xung đột không cần thiết giữa hai bên."
 diplomatic.21.a:0 "Chúng tôi sẽ lập tức dừng mọi sự phát triển."
 diplomatic.21.b:0 "Thuộc địa này cực kỳ quan trọng đối với tương lai của chúng ta. Kiên quyết không lui."

 diplomatic.1000.name:0 "Tập trận hạm đội"
 diplomatic.1000.desc:0 "Chỉ huy [exercise_admiral.GetName] đã xây dựng một kế hoạch tập trận hạm đội, liên quan đến một phần không nhỏ lực lượng hải quân của chúng ta. Địa điểm mà [exercise_admiral.GetSheHe] chọn để diễn tập là hệ sao [exercise_system.GetName], gần với biên giới của [exercise_neighbor.GetName].\n\n[exercise_neighbor.GetSpeciesNamePlural] có lẽ sẽ coi cuộc tập trận này như một hành động khiêu khích, nhưng nếu chúng ta hủy bỏ cuộc tập trận, quân đội của chúng ta sẽ nghĩ chúng ta quá nhu nhược. Suy cho cùng, [exercise_system.GetName] là lãnh thổ của chúng ta, [exercise_neighbor.GetName] không có quyền chỉ bảo chúng ta được làm gì và không được làm gì trên lãnh thổ của mình."
 diplomatic.1000.a:0 "Tiến hành tập trận theo kế hoạch."
 diplomatic.1000.b:0 "Hủy bỏ cuộc tập trận."
 FLEET_MANEUVERS_1_PROJECT:0 "Tiến hành tập trận hạm đội"
 FLEET_MANEUVERS_1_PROJECT_DESC:0 "Chủ lực của hạm đội đã tiến vào hệ sao [exercise_system.GetName] gần biên giới [exercise_neighbor.GetName] theo kế hoạch. Cuộc tập trận này chủ yếu mô phỏng quân đội [exercise_neighbor.GetSpeciesName] phóng tàu dò vào trong biên giới của phe ta trước khi xâm lược.\n\nSau khi tất cả các lực lượng tham gia tập trận tới được vị trí đã định trên quỹ đạo [exercise_location.GetName], cuộc tập trận sẽ bắt đầu."
 FLEET_MANEUVERS_2_PROJECT:0 "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_2_PROJECT_DESC:0 "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 FLEET_MANEUVERS_3_PROJECT:0 "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_3_PROJECT_DESC:0 "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 diplomatic.1001.name:0 "Tập trận hạm đội đã bị hủy"
 diplomatic.1001.desc:0 "Kế hoạch tập trận hạm đội chủ lực đã bị hủy bỏ. Hạm đội đã không thể tới được địa điểm theo dự định trong một thời gian dài, điều này đã gây ảnh hưởng nghiêm trọng đến mức độ sẵn sàng chiến đấu của toàn bộ hạm đội."
 diplomatic.1002.desc:0 "Do [Root.GetName] bị kéo vào một cuộc chiến tranh, kế hoạch tập trận hạm đội ban đầu đã bị hủy bỏ, hạm đội của chúng ta sẽ được rèn luyện ngay trên chiến trường."
 diplomatic.1002.a:0 "Thử lửa chiến tranh."

 diplomatic.1006.name:0 "Hoạt động hạm đội tại [exercise_system.GetName]"
 diplomatic.1006.desc:0 "Chúng ta đã nhận được báo cáo tình báo về việc [From.Owner.GetName] có nhiều hoạt động hạm đội. Chúng tập trung tại hệ sao [exercise_system.GetName], dường như đang tiến gần biên giới của chúng ta. Bọn [From.Owner.GetSpeciesNamePlural] định làm gì đây?"
 diplomatic.1006.a:0 "Tiếp tục theo dõi tình hình."

 diplomatic.1011.name:0 "Tập trận hạm đội: Va chạm"
 diplomatic.1011.desc:0 "Theo kế hoạch tập trận của chỉ huy [exercise_admiral.GetName], hạm đội của chúng ta hiện đang diễn tập tại hệ sao [exercise_system.GetName]. Trong quá trình này, đã xảy ra vài vụ va chạm giữa các tàu chiến. May mắn là thương vong rất ít, các tàu liên quan cũng không bị hư hỏng quá nặng, nhưng tàu hỏng thì vẫn cần được đưa đi sửa chữa."
 diplomatic.1011.a:0 "Ít nhất là không mất con tàu nào."
 exercise_collision_tooltip:0 "Vài chiếc tàu chiến của chúng ta đã bị hư hỏng do va chạm."
 diplomatic.1012.name:0 "Tập trận hạm đội: Mất tàu chiến"
 diplomatic.1012.desc:0 "Khi hạm đội đang diễn tập tại [exercise_system.GetName], hai con tàu [destroyed_ship_1.GetName] và [destroyed_ship_2.GetName] đã bất ngờ tông nhau ở tốc độ cao. Toàn bộ thủy thủ đoàn trên hai tàu đều tử nạn, chúng ta đã gửi tin buồn này đến gia đình họ với niềm tiếc thương sâu sắc."
 diplomatic.1012.a:0 "Thật là một ngày buồn."
 exercise_ships_lost:0 "Hai chiếc tàu chiến của chúng ta đã bị phá hủy do va chạm bất ngờ."
 diplomatic.1013.name:0 "Tập trận hạm đội: Sĩ quan xuất sắc"
 diplomatic.1013.desc:0 "Thuyền trưởng [exercise_officer.GetName] của tàu [officer_ship.GetName] đã thể hiện năng lực xuất sắc trong cuộc tập trận tại hệ sao [exercise_system.GetName]. Vị sĩ quan này cho thấy tài năng lãnh đạo tuyệt vời, và cấp trên cho rằng nên lập tức thăng chức [exercise_officer.GetHerHim] lên làm tư lệnh hạm đội."
 diplomatic.1013.a:0 "Hạm đội lúc nào cũng cần những chỉ huy giỏi."
 exercise_officer_tooltip:0 "Chỉ huy [exercise_officer.GetName] hiện đã sẵn sàng nhận lệnh."
 diplomatic.1014.name:0 "Tập trận hạm đội: Thu hút công chúng"
 diplomatic.1014.desc:0 "Cuộc tập trận hạm đội tại hệ sao [exercise_system.GetName] đã thu hút sự chú ý lớn từ giới truyền thông trên [Root.Capital.GetName] và các thuộc địa. Những hình ảnh ba chiều công khai đã phô diễn trọn vẹn dáng vẻ oai hùng của các chiến binh thuộc hạm đội [Root.GetName], khiến vô số tình nguyện viên đổ xô đến các điểm tuyển quân của chúng ta!"
 diplomatic.1014.a:0 "Điều này sẽ giúp chúng ta tiết kiệm được khối tiền."
 diplomatic.1020.name:0 "Tình báo tập trận từ người [From.Owner.GetSpeciesName]"
 diplomatic.1020.desc:0 "Tình báo của chúng ta đã thu thập thêm tin tức về hoạt động ngày càng tăng của hạm đội [From.Owner.GetSpeciesName] tại hệ sao [exercise_system.GetName]. [From.Owner.GetName] có vẻ đã tập hợp một hạm đội khổng lồ để tiến hành cuộc tập trận với quy mô chưa từng có.\n\nCho đến nay, vẫn chưa có dấu hiệu nào cho thấy cuộc tập trận này sẽ chuyển thành hành động quân sự nhắm thẳng vào [Root.GetName], nhưng việc tập trận ngay sát biên giới của chúng ta chắc chắn là một sự khiêu khích có tính toán! Chúng ta nên đáp trả thế nào?"
 diplomatic.1020.a:0 "Chúng ta sẽ phản đối kịch liệt!"
 diplomatic.1020.b:0 "Cứ mặc kệ trò khiêu khích của chúng."
 exercise_diplomatic_protest:0 "Chúng ta phản đối gay gắt hành động của [From.Owner.GetName], đồng thời bày tỏ sự lên án và bất mãn tột độ."
 diplomatic.1021.desc:0 "[From.GetName] đã dùng những lời lẽ đanh thép nhất để phản đối và bày tỏ sự bất mãn đối với cuộc tập trận của hạm đội [Root.GetSpeciesName] đang diễn ra tại hệ sao [exercise_system.GetName].\n\nCuộc tập trận với quy mô chưa từng có lại nằm ngay sát biên giới của chúng tôi, điều này chỉ có thể được hiểu là một sự đe dọa và khiêu khích gần như công khai. Quân đội của chúng tôi đã được đặt trong tình trạng báo động cao nhất, và các tư lệnh hạm đội đã nhận lệnh phải dùng đòn đáp trả quân sự mạnh mẽ nhất để đối phó với bất kỳ hành vi xâm phạm biên giới nào."
 diplomatic.1021.a:0 "Bảo bọn [From.GetSpeciesNamePlural] đừng xía mũi vào chuyện nội bộ của chúng ta!"
 diplomatic.1021.b:0 "Chúng ta không thể gánh nổi hậu quả... hủy bỏ tập trận thôi."
 diplomatic.1021.c:0 "Các nhà ngoại giao của chúng ta sẽ xoa dịu tình hình."
 exercise_diplomatic_hardline:0 "Đáp lại lời phản đối yếu ớt của chúng, chúng ta sẽ có thái độ cứng rắn nhất."
 exercise_diplomatic_canceled:0 "Chúng ta đã hủy cuộc tập trận hạm đội đang diễn ra để cải thiện quan hệ với [From.GetName]. Quân đội chắc chắn sẽ bất mãn về chuyện này.\n\n"
 exercise_diplomatic_conciliatory:0 "Chúng ta sẽ đáp lại một cách ôn hòa để giảm thiểu thiệt hại về mặt ngoại giao, nhưng cuộc tập trận hạm đội vẫn sẽ tiếp diễn."
 diplomatic.1022.desc:0 "Chúng tôi đã nhận được lời phản đối với những từ ngữ thiếu chừng mực của các người về cuộc tập trận của hạm đội vô địch anh dũng tại [exercise_system.GetName]. Như các người đã biết, hệ sao đó nằm trong phạm vi chủ quyền của [From.GetName], vì vậy chúng tôi không cho rằng những gì xảy ra ở đó có bất kỳ liên quan nào đến các người.\n\nNhân tiện nhắc nhở luôn, [Root.GetName] tốt nhất nên biết thân biết phận lo chuyện của mình đi và hãy đảm bảo rằng sau này đừng gửi cho chúng tôi những văn bản ngoại giao lỗ mãng, đầy tính khiêu khích như vậy nữa.\n\nKết thúc liên lạc."
 diplomatic.1022.a:0 "Không thể tha thứ được!"
 diplomatic.1023.desc:0 "Do [Root.GetName] phản đối cuộc tập trận hạm đội tại hệ sao [exercise_system.GetName], [From.GetName] đã quyết định dừng toàn bộ các cuộc tập trận đang diễn ra để thúc đẩy mối quan hệ tốt đẹp giữa hai quốc gia giữa các vì sao.\n\nChúng tôi chân thành hy vọng hành động này sẽ giúp xoa dịu tình hình căng thẳng giữa các vì sao, đồng thời đây cũng là bằng chứng rõ ràng nhất cho thấy người [From.GetSpeciesName] luôn hướng tới nền hòa bình lâu dài cho thiên hà."
 diplomatic.1023.a:0 "Có lẽ bọn họ thực sự đang tìm kiếm hòa bình..."
 diplomatic.1024.desc:0 "Chúng tôi rất lấy làm tiếc vì cuộc diễn tập quân sự tại hệ sao [exercise_system.GetName] lại bị [From.GetName] hiểu lầm.\n\nCuộc diễn tập này được tiến hành theo kế hoạch đã định sẵn, địa điểm cũng do chỉ huy lựa chọn ngẫu nhiên, hoàn toàn không nhắm vào bất kỳ cá nhân hay thế lực nào. Sự kiện này tuyệt đối không nên bị thổi phồng thành một hành động đe dọa hay khiêu khích đối với [Root.GetName]."
 diplomatic.1024.a:0 "Biết đâu đây lại là một trò lừa bịp khác của người [From.GetSpeciesName]?"
 diplomatic.1025.name:0 "Kết thúc tập trận"
 diplomatic.1025.desc:0 "Cuộc tập trận của [exercise_fleet.GetName] tại hệ sao [exercise_system.GetName] đã kết thúc. Chỉ huy [exercise_admiral.GetName] báo cáo rằng chúng ta đã thu được rất nhiều lợi ích từ cuộc tập trận, phần lớn là nhờ vào quy mô hoành tráng của nó. Mặc dù có thể sẽ gây ra vài ảnh hưởng ngoại giao tiêu cực, nhưng ít nhất kinh nghiệm quân sự tích lũy được từ lần diễn tập này là vô giá."
 diplomatic.1025.a:0 "Làm tốt lắm."
 diplomatic.1026.name:0 "Người [From.Owner.GetSpeciesName] kết thúc tập trận"
 diplomatic.1026.desc:0 "Dựa vào việc tín hiệu mã hóa quân sự của người [From.Owner.GetSpeciesName] gửi từ hệ sao [exercise_system.GetName] đột ngột giảm đi, có vẻ như cuộc tập trận hạm đội do [From.Owner.GetName] tổ chức tại đó cuối cùng cũng đã kết thúc."
 diplomatic.1026.a:0 "Lẽ ra phải thế từ lâu rồi."

 precursor_1: "$vultaum_precursor_civ$"
 precursor_2: "$yuht_precursor_civ$"
 precursor_3: "$first_league_precursor_civ$"
 precursor_4: "$irassian_precursor_civ$"
 precursor_5: "$cybrex_precursor_civ$"
 precursor_baol_1: "$NAME_Baol$"
 precursor_zroni_1: "$NAME_Zroni$"
 precursor_inetian: "$NAME_inetian$"
 precursor_adakkaria: "$NAME_adakkaria$"

 precursor_1_desc: "Kiến thức của họ uyên bác, lý thuyết thì vô cùng phức tạp. Nhưng không biết công cuộc tìm kiếm chân lý tối thượng của họ rốt cuộc sẽ dẫn tới sự khai sáng hay sự diệt vong."
 precursor_2_desc: "Họ rong ruổi giữa các vì sao, không ngừng khám phá, không ngừng bành trướng. Nhưng nay chỉ còn lại đống gạch vụn ngói nát, thì thầm về những hậu quả khôn lường."
 precursor_3_desc: "Sự đoàn kết rất đỗi mong manh. Rốt cuộc thế lực nào đã có thể đập tan một liên bang tràn đầy sức sống và có tầm ảnh hưởng lan rộng khắp cả một khu vực như vậy?"
 precursor_4_desc: "Ngay cả nền văn minh hùng mạnh nhất cũng có thể gục ngã trước những kẻ thù không ngờ tới. Rốt cuộc là sự kiêu ngạo đã làm họ mù quáng, hay chính sự ngây thơ đã lấy đi mạng sống của họ?"
 precursor_5_desc: "Họ từng là những kẻ không có đối thủ, nhưng chẳng biết từ lúc nào ý chí chiến đấu của họ đã bị nghiền nát. Rốt cuộc ai là kẻ đã đặt dấu chấm hết cho cuộc thánh chiến của họ?"
 precursor_baol_1_desc: "Họ vun trồng cho cả một hành tinh, tỉ mỉ đẽo gọt từng hệ sinh thái. Nhưng rễ có đâm sâu đến đâu thì cũng có thể bị nhổ tận gốc."
 precursor_zroni_1_desc: "Ý thức là không có giới hạn. Tâm trí đã dẫn dắt họ băng qua các vì sao, nhào nặn lại thực tại. Nhưng dù tầm nhìn có sâu rộng đến đâu đi chăng nữa, thì cũng không có nghĩa là tất cả đều nhìn thấy chung một tương lai."
 precursor_inetian_desc: "Sự phồn vinh nuôi dưỡng dã tâm, còn dã tâm lại chuốc lấy sự hủy diệt. Kẻ nào đã có đủ sức mạnh để phá vỡ mạng lưới của họ thì vẫn chưa rõ, nhưng chỉ dựa vào lợi nhuận thì không đủ để cứu rỗi họ."
 precursor_adakkaria_desc: "Họ cưỡi trên cơn cuồng phong của vũ trụ, không bị trói buộc, không bao giờ dừng bước. Nhưng ngay cả những kẻ lang thang thì cũng chẳng thể lang thang mãi mãi được."
