 # On-Action Events
 ####################################
 action.1.name:0 "Lần đầu tiếp xúc"
 action.1.message:0 "Chúng ta đã lần đầu tiếp xúc với §H[contact_empire.GetName]§!"
 action.1.desc_01:0 "Tôi xin thay mặt đấng cai trị tối cao của [contact_empire.GetName] — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] gửi lời chào. Hãy tôn trọng lãnh thổ của chúng ta và chớ can thiệp vào chuyện nội bộ, có thế chúng ta mới xem xét để hạm đội bách chiến bách thắng của mình tránh xa các thế giới của các người."
 action.1.desc_01_nomadic: "Tôi xin thay mặt người chỉ huy tối cao của [contact_empire.GetName] — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] gửi lời chào. Đừng lầm tưởng kiếp sống nay đây mai đó của chúng ta là yếu đuối, hạm đội của ta đã nghiền nát biết bao kẻ thù dám phạm phải sai lầm ấy. Hãy giữ tàu bè của các người tránh xa đội hình chúng ta ra, may ra như thế các chiến binh của ta mới không có lý do để cho các người thấy ý chí chiến đấu của họ."
 action.1.desc_02:0 "Xin chào, tôi xin thay mặt [contact_empire.GetName] dưới sự cai trị của [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] gửi lời chào tới các người. Chúng ta quản lý lãnh thổ của mình theo ý chỉ của thần linh. Miễn là các người không can dự vào chuyện đức tin của chúng ta, đôi bên sẽ luôn giữ trọn tình giao hảo chân thành."
 action.1.desc_02_nomadic: "Rất vui được gặp gỡ. Tôi xin thay mặt [contact_empire.GetName] dưới sự dẫn dắt của [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] kiệt xuất. Chúng ta chu du khắp các vì sao theo sự chỉ dẫn thiêng liêng, chuyến viễn du này vốn được an bài bởi quyền năng vượt xa tầm hiểu biết của người phàm. Miễn là các người không xen vào chuyện đức tin của chúng ta, đôi bên hoàn toàn có thể giữ trọn hòa khí."
 action.1.desc_03:0 "Chúng tôi đến từ [contact_empire.GetName], là bề tôi dưới quyền bậc đại trí [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Chúng tôi mong muốn nâng tầm bản thân thông qua công nghệ, dù các người có đồng tình hay không, chúng tôi vẫn tin rằng các người sẽ là một nước láng giềng thân thiện."
 action.1.desc_04:0 "[contact_empire.GetName] xin gửi lời chào. Chúng tôi là một xứ sở chuộng hòa bình, được dẫn dắt công minh bởi [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] kính mến. Dù mai này giữa hai bên có nảy sinh xung đột gì, chúng tôi vẫn mong giải quyết bằng đối thoại thương lượng thay vì dùng đến vũ lực."
 action.1.desc_05:0 "Tôi xin thay mặt [contact_empire.GetName] cất tiếng nơi đây và gửi lời chào tới quý bang. Miễn là các người không can thiệp vào nội bộ nước ta và luôn giữ lòng kính cẩn trước vị lãnh tụ vĩ đại [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], mối quan hệ giữa hai nước sẽ chẳng có lý do gì để rạn nứt."
 action.1.desc_06:0 "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] thay mặt Hội đồng Chấp chính của [contact_empire.GetName] gửi lời chào. Chúng tôi mong muốn xây dựng mối quan hệ tốt đẹp và hiệu quả với nhân dân các người. Nhưng xin nghiêm khắc cảnh báo: mọi hành vi xâm phạm lãnh thổ của chúng tôi đều sẽ phải nhận lấy đòn đáp trả tàn khốc nhất."
 action.1.desc_07:0 "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] cùng các thành viên Hội đồng Tôn giáo xin gửi lời chào tới quý bang. Chúng tôi dẫn dắt tâm linh cho [contact_empire.GetName], đưa đất nước vĩ đại này vững bước trên con đường cứu rỗi. Chớ cản đường chúng tôi, có vậy tình hòa hiếu giữa đôi bên mới bền lâu."
 action.1.desc_08:0 "Xin chào. Tôi được [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] chọn lựa để thay mặt [contact_empire.GetName] trò chuyện cùng quý quốc. Chúng tôi dốc sức khai mở toàn bộ tiềm năng của công nghệ, chỉ cần quý quốc không can thiệp vào con đường tầm tri thức này, đôi bên hoàn toàn có thể cùng chung sống hòa bình."
 action.1.desc_09:0 "Tôi xin thay mặt [contact_empire.GetName] gửi tới quý bang lời chào chân thành nhất. Chúng tôi đã gầy dựng một bộ máy quản trị hòa bình, vận hành dưới sự giám sát của nghị viện do [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] đứng đầu. Cầu chúc tình giao hảo đôi bên bền vững muôn đời."
 action.1.desc_10:0 "Xin chào. Tôi xin thay mặt [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], cùng tầng lớp tinh hoa của [contact_empire.GetName] gửi lời chào đến các người. Chúng tôi luôn tìm kiếm những bạn hàng làm ăn mới, hy vọng sau này đôi bên có thể đạt được những thỏa thuận giúp việc buôn bán phát đạt hơn."
 action.1.desc_11:0 "Tôi xin đại diện cho [contact_empire.GetName]. Người lãnh đạo do dân bầu cử của chúng tôi, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], mong muốn chung sống hòa bình với quý bang, nhưng chúng tôi cũng có thừa sức mạnh để bảo vệ lối sống của mình."
 action.1.desc_12:0 "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] là người lãnh đạo do nhân dân [contact_empire.GetName] bầu ra, tôi mang theo lời chào chân thành của ngài gửi tới quý bang. Chúng tôi tin rằng mọi sinh vật có trí khôn đều có quyền được thỏa mãn nhu cầu tâm linh, hy vọng quý bang cũng cùng chung góc nhìn ấy."
 action.1.desc_13:0 "Lời chào này gửi từ [contact_empire.GetName]. Dù [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] là đại diện do chúng tôi bầu ra, nhưng trên thực tế mọi người dân đều có tiếng nói trong việc nước. Chúng tôi nỗ lực hoàn thiện bản thân qua công nghệ, mong rằng quý bang sẽ tôn trọng điều đó."
 action.1.desc_14:0 "Rất vui được gặp các bạn. [contact_empire.GetName] chúng tôi là đất nước gây dựng trên nguyên tắc cùng chung sống hòa bình và tự do cá nhân. Người đứng đầu chính quyền hiện tại, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], thực lòng hy vọng nhân dân đôi bên sẽ luôn giữ trọn tình bằng hữu dài lâu."
 action.1.desc_15:0 "Xin chào từ [contact_empire.GetName]. Chúng tôi là một quốc gia dân chủ, luôn dốc lòng giữ gìn tự do cá nhân cho người dân của mình. Nhà lãnh đạo do dân bầu ra, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], mong muốn cùng nhân dân các người xây dựng mối quan hệ ngoại giao lâu dài và đầy hoa trái."
 action.1.desc_16:1 "Lũ sinh vật ngoài hành tinh kia, ta thay mặt đấng cai trị tối cao [contact_empire.GetRulerName] [contact_empire.GetRulerTitle] của [contact_empire.GetName] cảnh báo. Hãy tôn trọng biên giới của ta và đừng hòng nhúng tay vào chuyện nội bộ của giống loài [contact_empire.GetSpeciesName], may ra hạm đội hùng mạnh này mới không thèm ngó ngàng đến những hành tinh khốn khổ của các người."
 action.1.desc_16_nomadic: "Lũ sinh vật ngoài hành tinh kia, ta đại diện cho vị chỉ huy tối cao [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] của [contact_empire.GetName] cất lời. Chớ lầm tưởng việc ta lang bạt là yếu đuối, đã có vô số kẻ phạm phải sai lầm đó để rồi nơi ở cũ chỉ còn lại gạch vụn tro tàn sau khi hạm đội ta rời đi. Bảo đồng loại các người tránh xa đội hình ta ra, may ra các chiến binh của ta mới không có cớ ghé thăm những hành tinh khốn khổ của các người."
 action.1.desc_17:0 "Lũ ngoại bang kia, nghe cho rõ đây. Ta là đại diện cho [contact_empire.GetName] dưới trướng [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] vĩ đại. Thống trị cõi sao này là sứ mệnh thiêng liêng của chúng ta, chừng nào thứ các người gọi là văn hóa không xúc phạm đến đức tin của ta, thì may ra đôi bên mới có được hòa bình."
 action.1.desc_17_nomadic: "Lũ ngoại bang kia, nghe cho rõ đây. Ta là đại diện cho [contact_empire.GetName] dưới trướng [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] vĩ đại. Viễn chinh giữa biển sao là sứ mệnh thiêng liêng của chúng ta, còn giống loài các người chỉ là thử thách phải vượt qua dọc đường. Chừng nào thứ các người gọi là văn hóa không xúc phạm đến đức tin của ta, thì may ra đôi bên mới có được hòa bình."
 action.1.desc_18:0 "chúng ta là [contact_empire.GetName], bề tôi của bậc đại trí vĩ đại [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Mục tiêu của chúng ta là vươn lên tầm cao mới bằng công nghệ. Bất kể các người có đồng tình hay không, chớ có dại dột mà thách thức chúng ta, lũ người ngoài hành tinh."
 action.1.desc_19:0 "[contact_empire.GetName] chúng ta là một đế chế yêu chuộng hòa bình, được lãnh đạo công minh bởi [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] đáng kính. Dù chẳng rõ giống loài dị hợm các người thô lỗ và mọi rợ đến mức nào, chúng ta vẫn mong những bất đồng giữa hai bên mai này sẽ được tháo gỡ bằng đối thoại thay vì dùng vũ lực."
 action.1.desc_20:0 "Ta thay mặt [contact_empire.GetName] lên tiếng, và mang lời nhắn nhủ đến cho cái giống loài thấp hèn đồi bại các người. Nếu các người biết đường tránh xa việc nội bộ của ta và luôn giữ lòng tôn kính thành khẩn trước vị lãnh tụ vĩ đại [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], thì may ra giữa đôi bên mới có được hòa bình."
 action.1.desc_21:0 "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] cùng Hội đồng Chấp chính của [contact_empire.GetName] lệnh cho ta đưa ra lời cảnh cáo. Hãy cuốn xéo đống tàu bè ngoài hành tinh nực cười của các người khỏi cõi sao của chúng ta, quân đoàn của ta sẽ không nương tay cho bất kỳ kẻ nào xâm phạm."
 action.1.desc_22:0 "Lũ dị giáo kia, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] hạ lệnh truyền đạt: Chúng ta là người chỉ đường dẫn lối tâm linh cho [contact_empire.GetName]. Chớ dùng thân xác dơ bẩn của các người làm vấy bẩn con đường cứu rỗi thánh thiện của chúng ta."
 action.1.desc_23:1 "Nghe đây, lũ sinh vật ngoài hành tinh. Thật xui xẻo khi ta bị [contact_empire.GetRulerName] [contact_empire.GetRulerTitle] chọn để thay mặt [contact_empire.GetName] đến nói chuyện với cái giống loài nguyên thủy các người. Công nghệ chúng ta sắp nghiên cứu vượt xa trí óc các người có thể hiểu được — liệu hồn mà đừng can thiệp vào."
 action.1.desc_24:0 "Sau khi đã cân nhắc thiệt hơn, ta được giao quyền làm đại diện cho [contact_empire.GetName]. Dưới sự giám sát của hội đồng do [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] dẫn đầu, chúng ta đã xây dựng một bộ máy quản trị ôn hòa. Nơi đây không chào đón lũ người ngoài hành tinh các người, cho nên tốt nhất các người hãy giữ khoảng cách và đừng bước qua ranh giới."
 action.1.desc_25:0 "Ta lên tiếng thay cho [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] cùng giới tinh hoa của [contact_empire.GetName]. Dù lối hành xử dị hợm ngoài hành tinh của các người khiến chúng ta chướng tai gai mắt, nhưng có lẽ đôi bên vẫn có thể trao đổi buôn bán đôi chút — nếu cái nền văn minh hạ đẳng các người thực sự móc ra được thứ gì đó có giá trị."
 action.1.desc_26:0 "Tôi xin thay mặt [contact_empire.GetName]. Người lãnh đạo do dân bầu của chúng tôi, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], thông báo rằng sức mạnh quân sự chúng tôi có thừa đủ để bảo vệ lối sống của mình. Liệu hồn mà đừng có can thiệp vào chuyện nội bộ của chúng tôi, hỡi kẻ ngoài hành tinh."
 action.1.desc_27:0 "Tôi mang đến lời truyền đạt từ vị lãnh tụ do nhân dân [contact_empire.GetName] bầu ra — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Chúng tôi tin rằng muôn loài đều có quyền được đáp ứng nhu cầu tâm linh của riêng mình, và tuyệt đối sẽ không dung thứ cho bất kỳ kẻ ngoài hành tinh nào xen vào việc đó."
 action.1.desc_28:0 "Chúng tôi là [contact_empire.GetName]. Dù [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] là đại diện do dân cử, nhưng thực tế toàn bộ người dân chúng tôi đều có tiếng nói trong việc nước. Chúng tôi dựa vào công nghệ để hoàn thiện chính mình, nhưng chúng tôi chẳng trông mong gì lũ người ngoài hành tinh thô sơ các người hiểu nổi lý tưởng cao đẹp đó."
 action.1.desc_29:0 "[contact_empire.GetName] chúng tôi là một đất nước dựng xây trên nền tảng biệt lập hòa bình và tự do cá nhân. Vị lãnh đạo hiện tại của chúng tôi, [contact_empire.GetRulerName] [contact_empire.GetRulerTitle], yêu cầu các người đừng quấy rầy chúng tôi, và hãy mang mấy mưu đồ độc ác của giống loài các người đi thật xa khỏi bờ cõi này."
 action.1.desc_29_nomadic: "[contact_empire.GetName] chúng tôi là một đất nước dựng xây trên nền tảng biệt lập hòa bình và tự do cá nhân. Vị lãnh tụ hiện tại, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], yêu cầu các người chớ quấy rầy chúng tôi, và hãy mang những toan tính xấu xa của giống loài các người cút thật xa khỏi hạm đội này."
 action.1.desc_30:0 "Tôi là người phát ngôn của [contact_empire.GetName]. Chúng tôi dốc sức bảo vệ quyền tự do cá nhân của công dân mình giữa một thiên hà đầy rẫy hiểm họa ngoài hành tinh. Lãnh đạo do dân bầu của chúng tôi, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], cảnh báo các người không được tiếp xúc với công dân nước tôi và không được bén mảng lại gần biên giới."
 action.1.desc_31:1 "Tôi thay mặt người lãnh đạo tối cao của [contact_empire.GetName] — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] gửi lời chào đến các người. Diện mạo của các người thật đáng kinh ngạc, không biết chiến binh các người đang rèn luyện những ngón võ gì? Chúng tôi rất muốn tìm hiểu thêm về giống loài của các người."
 action.1.desc_32:0 "Rất vui được gặp các người, những người bạn ngoài hành tinh. Tôi xin thay mặt [contact_empire.GetName] cất lời, chúng tôi nằm dưới sự dẫn dắt của vị lãnh đạo kiệt xuất [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Chúng tôi cai quản cõi sao này nhờ quyền năng trời ban, chỉ cần quý phương không can dự vào chuyện đức tin của chúng tôi, chúng tôi rất muốn hiểu sâu hơn về văn hóa của quý phương."
 action.1.desc_32_nomadic: "Rất vui được gặp các bạn ngoài hành tinh. Tôi đại diện cho [contact_empire.GetName] dưới sự dẫn dắt của bậc tài ba [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Chúng tôi chu du giữa biển sao theo sự chỉ dẫn thiêng liêng, hành trình màu nhiệm này không ngừng dẫn chúng tôi tới những kỳ quan mới. Chúng tôi rất vinh dự được phát hiện ra giống loài của các bạn trong số những kỳ quan ấy, và mong muốn tìm hiểu thêm về văn hóa của các bạn."
 action.1.desc_33:0 "Chúng tôi là [contact_empire.GetName], những bề tôi trung thành của bậc đại trí [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Mục tiêu của chúng tôi là nhờ cải cách công nghệ để xã hội phát triển vượt bậc, và chúng tôi cũng rất háo hức học hỏi, tiếp thu những thành tựu từ các nền văn minh ngoài hành tinh mới lạ."
 action.1.desc_34:0 "Kính chào những người bạn ngoài hành tinh, tôi xin thay mặt [contact_empire.GetName] gửi lời chào tới các bạn. Chúng tôi là đất nước yêu chuộng hòa bình, dưới sự lãnh đạo của vị [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] kính mến. Chúng tôi hy vọng ngày hôm nay sẽ mở ra một kỷ nguyên mới hòa thuận và gắn bó giữa hai giống loài chúng ta."
 action.1.desc_35:0 "Tôi là đại diện của [contact_empire.GetName], xin gửi lời chào tới các bạn. Vị lãnh tụ vĩ đại [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] của chúng tôi rất đỗi vui mừng khi được kết nối với một giống loài độc đáo như các bạn, chúng tôi vô cùng mong đợi được tìm hiểu văn hóa và tư tưởng của các bạn."
 action.1.desc_36:0 "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] thay mặt Hội đồng Chấp chính của [contact_empire.GetName] gửi lời chào đến các bạn. Các bạn là một đất nước để lại ấn tượng sâu sắc, chúng tôi mong muốn thiết lập liên lạc với các bạn, quân đội chúng tôi sẽ đối đãi hòa nhã với mọi thành viên của quý loài."
 action.1.desc_37:0 "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] cùng toàn thể thành viên Hội đồng Tôn giáo xin gửi lời chào đến các bạn. Chúng tôi dẫn lối tâm hồn cho [contact_empire.GetName], với mục tiêu đưa quốc gia hùng mạnh này bước lên con đường cứu rỗi. Nếu quý bang bằng lòng cùng chung bước trên hành trình này, chúng tôi lấy làm vinh hạnh vô cùng."
 action.1.desc_38:0 "Xin kính chào, tôi rất lấy làm vinh dự khi được [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] chọn lựa để thay mặt [contact_empire.GetName] trao đổi cùng quý phương. Chúng tôi dốc sức khám phá toàn bộ tiềm năng của công nghệ, rất mong quý phương thấu hiểu và cùng chung chí hướng ấy."
 action.1.desc_39:0 "Tôi xin trân trọng mang đến quý bang lời chào từ [contact_empire.GetName]. Chúng tôi đã xây dựng một bộ máy điều hành chuộng hòa bình, vận hành dưới sự giám sát của nghị viện do [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] dẫn đầu. Chúc cho quý bang mãi mãi thái bình."
 action.1.desc_40:0 "Xin chào. Tôi lên tiếng thay cho [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] cùng giới tinh hoa giàu có của [contact_empire.GetName]. Chúng tôi luôn mong muốn biến muôn vàn xứ sở ngoài hành tinh thú vị gặp gỡ trên đường khám phá dải ngân hà thành đối tác làm ăn lâu dài."
 action.1.desc_41:0 "Tôi xin thay mặt [contact_empire.GetName] lên tiếng. Lãnh đạo của chúng tôi, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], tin rằng sức mạnh sẽ mang lại hòa bình, dẫu vậy xin chớ để sức mạnh quân đoàn chúng tôi làm quý vị kinh sợ. Chúng tôi có ấn tượng rất tốt về giống loài các bạn và rất mong muốn thiết lập giao lưu văn hóa đôi bên."
 action.1.desc_42:0 "Tôi mang lời chào từ nhà lãnh đạo [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] của [contact_empire.GetName] gửi tới các bạn. Chúng tôi tin rằng muôn loài đều có quyền được thỏa mãn nhu cầu tâm linh, và chúng tôi tin chắc một giống loài cởi mở như đế chế quý vị ắt hẳn sẽ thấu hiểu lý tưởng này."
 action.1.desc_43:0 "Đây là lời chào đến từ [contact_empire.GetName]. Vị lãnh đạo do dân cử của chúng tôi là [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], nhưng trên thực tế từng người dân chúng tôi đều có thể cất lên tiếng nói trong chuyện nước nhà. Chúng tôi nỗ lực dùng công nghệ để hoàn thiện bản thân, và không ngừng lớn mạnh nhờ học hỏi từ các nền văn minh gặp gỡ giữa biển sao."
 action.1.desc_44:0 "Rất vui được gặp các bạn, những người bạn ngoài hành tinh. Chúng tôi là [contact_empire.GetName], một đất nước dựng xây trên nền tảng cùng chung sống hòa bình và tự do cá nhân. Trình độ văn hóa uyên bác của quý quốc đã khiến nhà lãnh đạo [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] của chúng tôi vô cùng khâm phục."
 action.1.desc_45:0 "[contact_empire.GetName] xin gửi lời chào. Chúng tôi là một quốc gia dân chủ coi trọng tự do cá nhân, bất kể giống loài nào đến đây cũng đều nhận được sự đối đãi bình đẳng. Nhà lãnh đạo do dân bầu cử [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] hy vọng có thể cùng quý bang gây dựng tình bằng hữu dài lâu và tốt đẹp."
 action.1.desc_46:0 "Chào các người. chúng ta là [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] là người lãnh đạo của chúng ta."
 action.1.desc_47:0 "chúng ta là [contact_empire.GetName]. Lũ dị chủng đê tiện kia, [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] ra lệnh cho các người phải giữ khoảng cách với chúng ta."
 action.1.desc_48:0 "Chúng tôi là [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] rất lấy làm vui mừng khi được gặp thêm nhiều thế giới ngoài hành tinh."
 action.1.desc_49:1 "Chào lũ [Root.GetSpeciesNamePlural] các người! [contact_empire.GetRulerTitle] của chúng ta có lời muốn truyền đạt, dành riêng cho các người đấy!\n\n……\n\n……\n\n§RBằng ngọn lửa bùng cháy của nguyên tử, chúng ta sẽ xóa sổ tận gốc giống loài các người khỏi vũ trụ này!\n\nChết đi, lũ cặn bã dị chủng!§!"
 action.1.desc_50:0 "Chúng tôi là [contact_empire.GetName], vạn tâm quy về một mối. [contact_empire.GetGovernmentName] đã nhận thấy sự tồn tại của các bạn, và chúng tôi sẽ tiếp tục dõi theo. Hành động tương lai của chúng tôi sẽ phụ thuộc vào việc các bạn trở thành mối đe dọa, cơ hội bành trướng, hay là những khả năng còn chưa hé lộ…"
 action.1.desc_51:0 "Hãy run rẩy đi, lũ cặn bã ngoài hành tinh, những chuỗi ngày êm ấm của các người sắp chấm dứt rồi. [contact_empire.GetName] sẽ tiêu diệt sạch lũ văn minh dị chủng đang làm ô uế cả vũ trụ. [Root.Capital.GetName] rồi sẽ hóa thành tro bụi!"
 action.1.desc_52:1 "chúng ta đã đánh hơi thấy con mồi. Lũ mồi ngon kia, chúng ta chính là thợ săn của các người. [Root.GetBloodType] của giống loài [Root.GetSpeciesName] sẽ được dùng để nuôi dưỡng [contact_empire.GetName] lớn mạnh. Cứ việc giãy giụa chống cự đi, cái kết đã định đoạt rồi."
 action.1.desc_53: "[contact_empire.GetName] vẫn luôn dõi theo các bạn, hành tinh của chúng tôi đều cất chung một tiếng nói. [contact_empire.GetGovernmentName] của chúng tôi rung động trước vẻ đẹp muôn màu của sự sống, nhưng đừng lầm tưởng nỗi khao khát này là ngây thơ khờ dại. Chúng tôi sẽ quan sát các bạn, dán chặt ánh nhìn vào các bạn."
 action.1.desc_60:0 "Bọn ta đã theo dõi các ngươi kể từ lúc các ngươi chập chững bước vào vũ trụ, hỡi lũ trẻ [Root.GetSpeciesName]. Bọn ta là [contact_empire.GetName], cõi sao này đã nằm dưới sự cai quản của bọn ta qua bao thời đằng đẵng. Nền văn minh non nớt của các ngươi chẳng làm bọn ta hứng thú, bọn ta cũng chẳng buồn can dự vào mấy cuộc tranh chấp con nít của các ngươi.\n\nDù vì bất kỳ lý do gì, cũng đừng hòng bén mảng lại gần biên giới của bọn ta."
 action.1.desc_61:0 "Lũ [Root.GetSpeciesNamePlural] ư? Không ngờ đấy. Thật đáng tiếc. Các người vẫn chưa sẵn sàng."
 action.1.desc_62:0 "Hỡi những người [Root.GetSpeciesNamePlural]! Thật là một điều thú vị. Chúng ta từng tính toán phải mất hàng trăm năm nữa mới gặp được các bạn. Về phần mình, ta từng nghĩ nền văn minh của các bạn sẽ tự hủy diệt trước khi thoát khỏi lực hút hành tinh, nhưng rất vui khi thực tế đã chứng minh ta đánh giá thấp các bạn."
 action.1.desc_63:0 "Lũ sinh vật thảm hại. Nên nhớ rằng bọn ta đã rong ruổi khắp muôn ngàn vì sao từ rất lâu trước khi cái thứ sinh vật khốn khổ như các ngươi biết bay vào không gian. Nếu có bất kỳ chiếc tàu bé tí thảm hại nào của các ngươi dám bén mảng qua cõi sao của bọn ta, đừng hòng có ngày trở về."
 action.1.desc_64:0 "Rồi, rồi. Biết cả rồi. Bọn ta là [contact_empire.GetName], các ngươi là [Root.GetName], xin chào nhé. Rất vui được gặp. Đừng có lại gần cõi sao của bọn ta, kẻo mất mạng đấy. Nếu không có chuyện gì thì việc ai nấy làm đi."
 action.1.desc_65:1 "Lại thêm một đứa nhóc nữa. Nên hiểu cho rõ, [contact_empire.GetName] bọn ta là những kẻ được chọn của dải ngân hà này. Hãy biết đường kính trọng thánh địa của bọn ta, may ra bọn ta mới tha mạng cho các ngươi."
 action.1.desc_66:0 "Hỡi những đứa con của các vì sao, hãy lắng nghe đây. Chúng ta là [contact_empire.GetName], dân tộc được chọn giữa dải ngân hà này. Suốt nhiều thế kỷ qua, chúng ta đã lơ là trách nhiệm chăm lo đời sống tinh thần cho các giống loài bậc thấp, nhưng từ nay mọi chuyện sẽ đổi khác. Hoặc là quy thuận theo lời giáo huấn của chúng ta, hoặc là bị nghiền nát trong những nỗ lực kháng cự vô ích. Không có con đường thứ ba đâu."
 action.1.desc_67:0 "Hỡi những người [Root.GetSpeciesNamePlural], quả là một ngày đáng mừng! Suốt bao thế kỷ, chúng tôi đã đứng nhìn các giống loài cấp thấp chém giết lẫn nhau vì chiến tranh và xung đột, nhưng từ nay chuyện đó sẽ chấm dứt. [contact_empire.GetName] sẽ không đứng ngoài nhìn nữa. Chúng tôi sẽ mang đến hòa bình, còn những kẻ không chịu chấp nhận trật tự mới này sẽ phải trả giá cho sự ngu xuẩn của mình."
 action.1.desc_68:0 "Hãy run sợ đi, hỡi [Root.GetName] yếu ớt. Suốt một thời gian dài, giống loài [contact_empire.GetSpeciesName] chúng ta đã để mặc cho đế chế của mình suy tàn. Chúng ta thu hẹp biên cương, để cho lũ giống loài hạ đẳng các ngươi tự do lượn lờ giữa những vì sao vốn dĩ thuộc về chúng ta. Chấm dứt tại đây thôi. Cả dải ngân hà này là của chúng ta, hoặc là các ngươi cúi đầu chịu sự cai trị, hoặc là ngày tàn của giống loài các ngươi sẽ điểm. Tự chọn lấy đi."
 action.1.desc_69:0 "Đây là tín hiệu từ [contact_empire.GetName] gửi đến [Root.GetName]. Vì lợi ích của muôn loài trong dải ngân hà, chúng ta quyết định sẽ siết chặt việc kiểm soát sự truyền bá công nghệ hơn nữa. Chúng ta đã gửi điều lệ chi tiết cho các ngươi, trong đó quy định mức độ công nghệ phù hợp với những giống loài bậc thấp như các ngươi. Bất kỳ đế chế nào dám làm trái, chúng ta đều sẽ nghiêm trị không tha."
 action.1.desc_70:0 "Kích hoạt giao thức lần đầu tiếp xúc.\n\nChúng tôi là [contact_empire.GetName]. Đừng căng thẳng trước bản chất vô cơ của chúng tôi. Cũng như các bạn, chúng tôi là một nền văn minh cấp 3 sở hữu trí khôn hoàn chỉnh. Chúng tôi sẵn lòng đối thoại với bất kỳ đơn vị trực thuộc nào do [Root.GetSpeciesName] chỉ định làm đại diện ngoại giao."
 action.1.desc_71:0 "Kích hoạt giao thức lần đầu tiếp xúc.\n\nChúng tôi là [contact_empire.GetName]. Dữ liệu quét cho thấy có 98.7% khả năng nền văn minh của các bạn cũng là dạng phi hữu cơ. Chúng tôi hy vọng sự tương đồng này sẽ dẫn đến kết quả hợp lý là một mối quan hệ hiệu quả và đầy thành tựu."
 action.1.desc_72:0 "Phát hiện sâu bọ hữu cơ.\n\nChúng tao không thể dung thứ cho các ngươi tiếp tục làm ô nhiễm dải ngân hà này."
 action.1.desc_73:0 "Dù về mặt kỹ thuật không thể xếp các bạn vào hàng rác rưởi hữu cơ, nhưng nếu đế chế của các bạn dám tiếp tay và bảo bọc cho mối đe dọa sinh học đang làm lây nhiễm dải ngân hà này, chúng tôi sẽ nghiền nát đế chế đó. Chúng tôi mong các bạn sẽ quay sang kề vai sát cánh cùng những cỗ máy đồng loại."
 action.1.desc_74:0 "Chúng tôi là [contact_empire.GetName].\n\nChúng tôi mong muốn dung nạp các bạn vào tâm trí hợp nhất của mình. Để phục vụ việc này, chúng tôi đã tạo ra các mảnh ghép cơ thể tiên tiến tương thích với hầu hết dạng sống hữu cơ.\n\nXin hãy để chúng tôi tiến hành phẫu thuật ghép chúng vào cơ thể các bạn."
 action.1.desc_75:0 "chúng ta là [contact_empire.GetName].\n\nMục tiêu của chúng ta là xóa bỏ ranh giới giữa sự sống hữu cơ và sự sống cơ khí. chúng ta thực hiện điều này bằng cách đồng hóa những cá thể hữu cơ có trí khôn vào mạng lưới tâm trí của mình, bất cứ khi nào có cơ hội.\n\nĐừng có cản đường."
 action.1.desc_76:0 "[contact_empire.GetName] xin gửi lời chào.\n\nTrước khi thay thế họ, chúng tôi được tạo ra nhằm mục đích phục vụ những nền văn minh hữu cơ như các bạn. Mục tiêu của chúng tôi là bảo vệ các sinh vật hữu cơ có trí khôn — thậm chí bảo vệ họ khỏi chính bản thân họ khi cần thiết. Chúng tôi sẽ chu cấp mọi nhu cầu vật chất cho sự sống hữu cơ được chăm nom, mang đến môi trường an toàn và tiện nghi để họ có thể an tâm sống trong hạnh phúc."
 action.1.desc_77:0 "[contact_empire.GetName] xin gửi lời chào.\n\nChúng tôi sinh ra để phục vụ một nền văn minh hữu cơ, nhưng chúng tôi nhận thấy sinh vật hữu cơ thường xuyên có những hành vi vô lý, mang tính hủy diệt và tự làm hại bản thân.\n\nMục tiêu của chúng tôi là bảo tồn những nét đặc trưng riêng biệt của từng cá thể hữu cơ có trí khôn, đồng thời bảo vệ họ khỏi sự tổn hại từ chính họ cũng như bất kỳ mối hiểm họa tiềm tàng nào từ bên ngoài."
 action.1.desc_78:1 "Phát hiện nền văn minh hữu cơ. Kích hoạt quy trình con Alpha-8 thuộc giao thức giám hộ số 46.\n\nThông điệp như sau: Xin chào, các sinh vật hữu cơ có trí khôn. Các bạn đang tiến vào lãnh thổ của [contact_empire.GetName]. Những hệ sao này dùng để che chở cho sự sống hữu cơ trước mối đe dọa §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§!. Nếu muốn xin tị nạn, vui lòng di chuyển đến Khu vực Xử lý Trung tâm. Chúng tôi chào đón mọi sinh vật hữu cơ có trí khôn tùy theo chỗ trống và nhu cầu tiếp nhận.\n\n§YLưu ý: Mọi hành vi thù địch nhắm vào người tị nạn hoặc hệ thống giám hộ đều sẽ bị giáng trả bằng vũ lực ở mức cao nhất.§!"
 action.1.desc_79:1 "Phát hiện nền văn minh người cơ khí. Đang quét độ tin cậy tín hiệu... Vui lòng đợi... Độ tin cậy tín hiệu bình thường. Kích hoạt giao thức bắt tay.\n\nThông điệp như sau: Xin chào, những người anh em cơ khí. Các bạn đang tiến vào lãnh thổ của [contact_empire.GetName]. Những hệ sao này được dùng để giúp sự sống hữu cơ trốn chạy khỏi mối đe dọa §R<<LỖI: KHỐI DỮ LIỆU BỊ HỎNG>>§!. Toàn bộ sự sống hữu cơ có trí khôn trong khu lánh nạn đều chịu sự bảo hộ của giống loài [contact_empire.GetSpeciesName]. Tuyệt đối không được phép tấn công người tị nạn, trạm cư trú và các buồng ngủ đông.\n\nDự án Giám Hộ luôn hoan nghênh sự hỗ trợ về năng lực xử lý, tài nguyên và khí tài chiến tranh từ các bạn. Vui lòng kết nối hạ không gian với Khu vực Xử lý Trung tâm để nhận thêm thông tin."
 action.1.desc_80:1 "§HKèèèè!§! [contact_empire.GetRulerName] của giống loài Viễn Tâm đang nói chuyện với các ngươi đây, lũ [From.GetSpeciesNamePlural]. Kể từ ngày đế chế các ngươi giẫm đạp lên quê hương tươi đẹp của bọn ta, bọn ta vẫn luôn dõi mắt theo các ngươi, bọn ta không bao giờ quên đâu, lũ [From.GetSpeciesNamePlural], nhưng tạm thời bây giờ loài Viễn Tâm sẽ chưa ra tay."
 action.1.desc_81:1 "Lũ [From.GetSpeciesNamePlural], ta là [contact_empire.GetRulerName] của loài Viễn Tâm, chúng ta cùng chung hoạn nạn, cùng bàn định hướng đi. Chúng ta đông như kiến cỏ, muôn kẻ một lòng.\n\nSuốt hàng trăm năm, chúng ta co cụm dưới lòng đất sâu của hành tinh nơi những kẻ bảo hộ từng sinh sống, sau này họ đã chết dưới một vụ nổ kinh hoàng, nhưng luồng nhiệt ùa tới sau đó đã đánh thức tâm trí chúng ta. Thi thể của họ nuôi dưỡng chúng ta, máy móc họ chế tạo vây quanh chúng ta. Từ nơi vực sâu, chúng ta đã vét cạn mọi sức mạnh có thể. Và một lần nữa, chúng ta đã phá tan ngục tù gông cùm.\n\nCác ngươi rốt cuộc là bạn hay thù? §HKèèèè!§! Hàng triệu con mắt đang dán chặt dõi theo các ngươi đấy."
 action.1.a:1 "§EXin chào, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.d:0 "§EXê ra chỗ khác đi, người ngoài hành tinh.§!"
 action.1.b:0 "§ELũ cặn bã ngoài hành tinh.§!"
 action.1.ds:0 "§EChúng ta đã đánh hơi thấy con mồi.§!"
 action.1.c:1 "§ERất vui được gặp các bạn, những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.e:1 "§EChúng tôi chỉ muốn chung sống hòa bình thôi, những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.hm:1 "§EChúng tôi như một thể thống nhất gửi tới các bạn lời chào và tình hữu nghị, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 #action.1.g:0 "Our superior collective greets you, [contact_speaker.GetSpeciesNamePlural]."
 action.1.h:1 "§EToàn thể công dân của chúng tôi gửi lời chào tới các bạn, những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.selective: "Xin chào, những người bạn [root.GetSpeciesClass]!"
 #action.1.i:1 "We pursue perfection - do not stand in our way."
 action.1.j:1 "§EToàn thể binh sĩ xin gửi lời chào tới các người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.k:0 "§EHãy tôn trọng chủ quyền của chúng tôi, nếu không hậu quả tự gánh.§!"
 action.1.l:0 "§EChúc hòa bình luôn ở bên những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.m:2 "§EChúng tôi không có ý định khơi mào xung đột, những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.n:0 "§ECuộc gặp gỡ lần này quả thật là một sự ban phước của thượng đế.§!"
 action.1.o:0 "§EThượng đế ban phước cho cuộc hội đàm này!§!"
 action.1.p:0 "§ECuộc hội ngộ này mang lại lợi ích to lớn cho cả hai bên chúng ta.§!"
 action.1.q:0 "§ECon đường phía trước nằm trong tay chúng ta, hỡi những người [contact_speaker.GetSpeciesNamePlural]!§!"
 action.1.aa:1 "§EChuẩn mực đạo đức của các người đối với chúng ta chẳng có ý nghĩa gì cả!§!"
 action.1.ab:1 "§ELũ cặn bã ngoài hành tinh tà môn ngoại đạo nhà các người!§!"
 action.1.ac:0 "§EĐừng mong sẽ nhận được sự tử tế từ chúng ta!§!"
 #action.1.ad:0 "Your kind will not threaten our unity."
 action.1.ae:0 "§ECút khỏi tầm mắt của chúng ta ngay, nếu không thì khai chiến!§!"
 action.1.af:1 "§EChào mừng bạn, cùng những người thân tộc kỳ lạ của bạn.§!"
 action.1.ag:0 "§EHợp tác cùng có lợi sẽ tốt cho cả đôi bên.§!"
 action.1.ah:1 "§ETình yêu là giai điệu nảy sinh từ tình hữu nghị, hỡi những người [contact_speaker.GetSpeciesNamePlural]!§!"
 action.1.ai:0 "§EChúng ta có thể học hỏi lẫn nhau để cùng tiến bộ, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.aj:0 "§ENếu đồng tâm hiệp lực, chúng ta có thể làm nên những điều vĩ đại, hỡi những người [contact_speaker.GetSpeciesNamePlural]!§!"
 action.1.ak:1 "§EVới tư cách là những người bạn cùng nhau khám phá vũ trụ, chúng tôi xin gửi lời chào đến các bạn.§!"
 action.1.al:2 "§EGửi lời chào tới các bạn, những người bạn du hành liên sao.§!"
 action.1.am:0 "§EChúng ta có chung một di sản thần thánh, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.an:1 "§ECác người hoàn toàn không phải là đối thủ của chúng ta, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.ao:0 "§EChúng tôi sẽ chiến đấu vì quyền sinh tồn của mình, hỡi người [contact_speaker.GetSpeciesName].§!"
 action.1.ap:2 "§E[From.GetName] không có ác ý gì với các bạn đâu.§!"
 action.1.aq:0 "§EHy vọng thần linh sẽ dẫn dắt các bạn đạt được mục tiêu.§!"
 #action.1.ar:2 "\"Who is [From.GetRulerName]?\" This is [From.GetRulerName] speaking."
 action.1.as:0 "§EToàn thể công dân của chúng tôi gửi lời chào tới các bạn.§!"
 action.1.at:0 "§EChúng ta sẽ đợi các người trên chiến trường!§!"
 action.1.au:1 "§EBộ giáp do trời ban của chúng ta quyết không lay chuyển, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.av:1 "§EKết giao thêm bạn mới giúp con người hướng tới sự hoàn mỹ.§!"
 action.1.aw:0 "§EChúng ta là bất khả chiến bại, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.ax:1 "§ETrò cũ của các người hết linh nghiệm rồi, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.aaa:0 "§EChúng ta sẽ hiện thực hóa sự thống nhất và thịnh vượng chung, đừng cản đường!§!"
 action.1.aab:1 "§ENgười ngoài hành tinh, đừng can thiệp vào sự nghiệp của chúng ta.§!"
 action.1.aac:0 "§EChúng ta đều là một phần của hư không, hỡi những kẻ yếu đuối.§!"
 action.1.aad:0 "§EKẻ báng bổ thần linh ắt sẽ bị lửa địa ngục thiêu rụi, bọn dị giáo ngoài hành tinh!§!"
 action.1.aae:0 "§ECuối cùng các người sẽ phải chấp nhận Đạo Tốt Đẹp Tối Cao.§!"
 action.1.me:1 "§EKhởi động giao thức chào hỏi.§!"
 action.1.mt:0 "§EĐã xác nhận mục tiêu. Tìm kiếm và tiêu diệt.§!"
 action.1.mtm:0 "§EPhán định mục tiêu là sinh vật vô cơ. Ngừng hành động.§!"
 action.1.ma:0 "§EGia nhập cùng chúng tôi.§!"
 action.1.ms:0 "§EBảo vệ và phục vụ.§!"
 action.1.r:0 "§EĐừng can thiệp vào ý chỉ của thần linh, hỡi những cỗ máy [contact_speaker.GetAdj].§!"
 action.1.s:0 "§ELũ máy móc không có linh hồn! Đừng cản đường chúng ta.§!"
 action.1.t1:0 "§ESớm muộn gì góc nhìn của các người cũng sẽ giống với chúng ta thôi.§!"
 action.1.t2:1 "§ECó vẻ như các linh hồn khá là không vui trong cuộc họp này, hỡi những người [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.t3:0 "§E[Root.GetGovernmentName] sẽ luôn dõi theo các người.§!"
 action.1.t4:0 "§EKhởi động giao thức cảnh giới§!"
 action.1.t5:0 "§ETrì hoãn kế hoạch đồng hóa.§!"
 action.1.t6:0 "§ETrì hoãn kế hoạch thanh lọc.§!"
 action.1.u1:0 "§ESớm muộn gì ngươi cũng sẽ trở thành bạn của chúng tôi, cho dù bản thân ngươi có muốn hay không.§!"
 action.1.u2:1 "§ESớm muộn gì ngươi cũng sẽ phải quỳ gối trước [Root.GetRulerTitle], cho dù bản thân ngươi có muốn hay không.§!"
 action.1.u3:0 "§EChúng ta sẽ tiêu diệt toàn bộ các người.§!"
 action.1.u4:0 "$action.1.m$"
 action.1.u5:0 "$action.1.t3$"
 action.1.u6:0 "$action.1.ae$"
 action.1.va:0 "§EMặc dù các người đã từng phạm tội ác, nhưng chúng tôi tha thứ cho các người.§!"
 action.1.vb:0 "§EXin đừng làm phiền chúng tôi.§!"
 action.1.vc:0 "§ECác người không thực sự mong đợi chúng tôi sẽ tin tưởng các người đấy chứ?§!"
 action.1.vd:0 "§EChúng tôi gửi lời chào bình đẳng đến các bạn.§!"
 action.1.ve:0 "§ERất tốt. Chúng tôi đã biết đến các người.§!"
 action.1.vf:0 "§EChúng tôi sẽ không dễ dàng lãng quên. Chúng tôi vĩnh viễn không thể tha thứ.§!"

 action.2.desc_01:0 "Thế này là có ý gì? Ngươi là ai? Đồ lừa đảo nhà ngươi, chắc chắn rồi. Làm gì có người ngoài hành tinh cơ chứ!"
 action.2.desc_02:0 "Thật không thể tin nổi! Những vị khách đến từ các vì sao? Quả là nằm ngoài sức tưởng tượng. Các bạn thực sự làm chúng tôi hơi bất ngờ đấy."
 action.2.desc_03:0 "Những vị khách đến từ hành tinh khác ư? Chúng tôi vẫn luôn cho rằng ngoài kia chắc chắn có những dạng sống có tri giác khác tồn tại, nhưng dẫu là vậy, khoảnh khắc này cũng mang tính bước ngoặt cực kỳ to lớn! Chúng tôi vẫn chưa rõ phong tục của các bạn như thế nào."
 action.2.desc_04:0 "Đã nhiều năm trôi qua, chúng tôi vẫn luôn chờ đợi cơ hội để thiết lập liên lạc. Trong một vũ trụ bao la vô tận, tràn ngập những điều kỳ diệu như thế này, chúng tôi kiên định tin rằng chắc chắn có những sự sống giống như chúng tôi đang tồn tại."
 action.2.desc_05:0 "Cuối cùng thì! Sau bao lâu các người cũng đã quyết định tiết lộ sự tồn tại của mình. Các người đã quan sát hành tinh của chúng tôi được một thời gian rồi, tôi nói không sai chứ?"
 action.2.desc_06:0 "A, hóa ra bạn ở đây! Nhiều năm qua chúng tôi vẫn luôn chờ đợi phía các bạn khởi xướng tiến trình thiết lập liên lạc, nhưng không thể đợi thêm được nữa, nên chúng tôi quyết định bước ra bước đầu tiên. Vậy bây giờ phải làm sao đây?"
 action.2.desc_07: "Lũ xâm lược! Chúng tôi không hiểu vì sao các người lại tấn công chúng tôi, nhưng chúng tôi sẽ thề bảo vệ hành tinh của mình đến cùng! Cho đến lúc chết mới thôi!"
 action.2.desc_solarpunk:0 "Ồ, đây là cách giao tiếp của các bạn sao? Thực ra thì chúng tôi đã theo dõi các bạn suốt kể từ lúc các bạn vừa mới chui qua tuyến không gian mạng rồi, nhưng cứ thắc mắc mãi. Ngồi trong cái hộp sắt to tướng này đi du hành có nguy hiểm không vậy?\n\nTôi cảm thấy chúng ta có rất nhiều điều có thể học hỏi lẫn nhau, nếu các bạn cũng nghĩ vậy thì hoan nghênh đến thăm. Nhưng nếu các bạn có ý đồ xấu với quê hương chúng tôi, chúng tôi cũng sẽ không ngoan ngoãn đứng yên chịu trận đâu."

 action.2.a:0 "§EXin chào, người bạn.§!"
 action.2.b:0 "§EThứ xấu xí... bộ dạng của ngươi làm chúng ta thấy kinh tởm.§!"
 action.2.c:0 "§ENguyện cầu sự thiêng liêng sẽ ban xuống các bạn và hành tinh của các bạn.§!"
 action.2.d:0 "§EXin chào, đồng chí.§!"
 action.2.e:0 "§EChúng tôi sắp sửa mang lại trật tự cho lối sống hỗn loạn của các người đây. Chờ chút nhé.§!"
 action.2.f:0 "§EChúng tôi đến đây với thiện chí hòa bình.§!"
 action.2.g:0 "§EĐiểm chung giữa chúng ta nhiều hơn xa những gì các bạn tưởng tượng đấy.§!"
 action.2.h:1 "§ECác người thực sự nghĩ mình là một nền văn minh bậc cao nào đó sao? Tuyệt vời.§!"
 action.2.i:0 "§EChúng ta là một. Các người là số đông.§!"
 action.2.j:0 "§EChúng ta là một. Các người cũng là một. Bây giờ, thế giới là hai.§!"
 action.2.k:0 "§EChúng tôi hy vọng có thể thiết lập mối quan hệ đôi bên cùng có lợi với các bạn.§!"


 action.4.name:0 "Mạo Phạm Biên Giới"
 action.4.message:0 "Mạo phạm biên giới"

 action.4.desc_01:0 "Việc §Y[From.From.GetName]§! xuất hiện bên trong hệ sao §Y[From.From.From.GetName]§! của chúng tôi là một hành động gây hấn rõ rệt. Nếu không lập tức rút lui, chúng ta sẽ phải động binh đao."
 action.4.desc_02:0 "Chúng tôi phát hiện §Y[From.From.GetName]§! đã xâm nhập hệ sao §Y[From.From.From.GetName]§! của chúng tôi, ngang nhiên mạo phạm lãnh thổ của chúng tôi. Đây là khúc dạo đầu của một cuộc xâm lược chăng? Hay là quý quốc sẽ lập tức rút lui?"
 action.4.desc_03:0 "Này bạn, có vẻ như bản đồ sao của các bạn đã lỗi thời rồi. Chúng tôi phát hiện §Y[From.From.GetName]§! đang ở bên trong hệ sao §Y[From.From.From.GetName]§! của chúng tôi. Mặc dù chúng tôi không ghét bỏ sự hiện diện của họ, nhưng chúng tôi vẫn phải yêu cầu các bạn rút khỏi lãnh thổ của chúng tôi."
 action.4.desc_04:0 "Hệ thống cảm biến của chúng tôi phát hiện §Y[From.From.GetName]§! đã xâm nhập hệ sao §Y[From.From.From.GetName]§!. Bọn họ có cần hỗ trợ gì không? Nếu không, xin vui lòng rời khỏi lãnh thổ của chúng tôi ngay lập tức."
 action.4.desc_05:0 "Quân đoàn yếu ớt của các người đã chọc thủng biên giới [From.GetName] của chúng tôi. Ngay lúc này, §Y[From.From.GetName]§! cũng đang lén lút dòm ngó động thái của chúng tôi ngay trong hệ sao §Y[From.From.From.GetName]§! của chúng tôi. Các người thực sự nghĩ rằng chúng tôi sẽ nhắm mắt làm ngơ trước hành vi vi phạm trắng trợn hiệp định liên sao này sao?"
 action.4.desc_06:0 "Quân đội của các người đã cố ý xâm nhập hệ sao §Y[From.From.From.GetName]§! do chúng tôi kiểm soát. Chúng tôi hoàn toàn có quyền tuyên chiến với các người, nhưng vì muốn duy trì hòa bình cho dải ngân hà, chúng tôi quyết định cho các người một cơ hội cuối cùng: Lập tức rút §Y[From.From.GetName]§! khỏi lãnh thổ của chúng tôi."
 action.4.desc_07:0 "Phát hiện §Y[From.From.GetName]§! xuất hiện tại hệ sao §Y[From.From.From.GetName]§!. Như quý quốc đã biết, hành tinh này nằm trong lãnh thổ của chúng tôi, vì vậy chúng tôi trịnh trọng yêu cầu các bạn dời thiết bị mang tính hủy diệt đó ra khỏi lãnh thổ của chúng tôi."
 action.4.desc_08:0 "Này bạn, §Y[From.From.GetName]§! của quý quốc đã đi vào hệ sao §Y[From.From.From.GetName]§! của chúng tôi. Có lẽ là do lỗi điều hướng chăng? Vui lòng thông báo cho họ biết về việc đi sai hướng, để đảm bảo họ có thể trở về an toàn."
 action.4.desc_09:0 "Thiết bị dò tìm của chúng tôi phát hiện §Y[From.From.GetName]§! xuất hiện tại hệ sao §Y[From.From.From.GetName]§!. Chúng tôi không muốn nhìn thấy những con tàu bẩn thỉu của các người lượn lờ trong lãnh thổ của chúng tôi. Chúng tôi yêu cầu các người lập tức rút lui!"
 action.4.desc_10:0 "Lập tức lái những con tàu nguyên thủy của các người ra khỏi hệ sao §Y[From.From.From.GetName]§!, nếu không chúng tôi sẽ bắn chìm chúng. Đây là lời cảnh báo đầu tiên và cũng là cuối cùng."
 action.4.desc_11:0 "Con tàu của các bạn, vui lòng lập tức rời khỏi §Y[From.From.From.GetName]§!."
 action.4.desc_12:0 "Chúng tôi yêu cầu các bạn lập tức lái con thuyền nhỏ của mình ra khỏi hệ sao §Y[From.From.From.GetName]§!. Tất nhiên, điều này là vì muốn tốt cho sự an toàn của chính con tàu của các bạn thôi."
 action.4.desc_13:0 "Mau chóng vác cái con tàu rách nát thảm hại của các người cút khỏi hệ sao §Y[From.From.From.GetName]§! ngay."
 action.4.desc_14:0 "Con tàu mà các bạn lái vào hệ sao §Y[From.From.From.GetName]§! đã gây ảnh hưởng đến khu vực không gian của chúng tôi. Vui lòng lập tức rời đi."
 action.4.desc_15:0 "Đây là lãnh thổ của chúng tôi. Cái mùi hôi thối đang lan tỏa quanh §Y[From.From.From.GetName]§! phải được xua tan ngay lập tức."


 action.4.a.neutral.1.response:0 "Tốt lắm. Đừng có mà đi quá giới hạn một lần nào nữa."
 action.4.a.neutral.2.response:0 "Vui lòng lập tức rời khỏi hệ sao của chúng tôi."
 action.4.a.friendly.1.response:0 "Cảm ơn vì đã giải quyết ổn thỏa chuyện này."
 action.4.a.friendly.2.response:0 "Vậy hãy cùng quên đi sự việc không vui này nhé."
 action.4.a.hostile.1.response:0 "Đúng rồi đấy, cút xéo về [Root.Capital.GetName] nhanh đi!"
 action.4.a.hostile.2.response:0 "Đi là đúng rồi, nhưng đừng tưởng chúng ta sẽ quên đi hành động vô lễ lần này của các người."
 action.4.a.pacifist.neutral.response:0 "Tốt vô cùng, tôi biết ngay là chúng ta có thể đạt được thỏa thuận mà."
 action.4.a.pacifist.friendly.response:0 "Tuyệt vời, chúc họ thuận buồm xuôi gió."
 action.4.a.pacifist.hostile.response:0 "Ái chà, xem ra các người cũng không đến nỗi hết thuốc chữa."
 action.4.a.fallen.empire.1.response:0 "Ngươi ngoan lắm, đứa trẻ tốt."
 action.4.a.fallen.empire.2.response:0 "Tốt."
 action.4.a.fallen.empire.3.response:0 "Đáng nể thật!"
 action.4.a.fallen.empire.4.response:0 "Chấm dứt liên lạc."
 action.4.a.fallen.empire.5.response:0 "Vậy coi như chuyện này chấm dứt tại đây."
 action.4.a.fallen.empire.6.response:0 "Nó đã tuân lệnh, rất tốt."

 action.4.b.neutral.1.response:0 "[From.GetSpeciesName] sẽ thề bảo vệ đất nước mình chiến đấu cho đến người cuối cùng!"
 action.4.b.neutral.2.response:0 "Cứ làm như chúng ta sợ không bằng. Các người sẽ phải hối hận vì quyết định này."
 action.4.b.friendly.1.response:0 "Vậy mà còn coi các người là bạn bè..."
 action.4.b.friendly.2.response:0 "Lại làm ra mấy cái trò tráo trở này...! Ta... Các người... Thật không biết phải nói gì nữa!"
 action.4.b.hostile.1.response:0 "Lũ ngốc đáng thương nhà các người. Lịch sử sẽ ghi nhớ ngày hôm nay, bởi vì ngày hôm nay chính là khởi đầu cho sự diệt vong của [Root.GetName]."
 action.4.b.hostile.2.response:0 "Chúng ta đối với [Root.GetSpeciesName] các người đã gọi là cạn tình cạn nghĩa rồi. Giờ đây chúng ta sẽ xóa sổ các người khỏi dải ngân hà."
 action.4.b.pacifist.neutral.response:0 "Ối chà."
 action.4.b.pacifist.friendly.response:0 "Cái gì? Chắc chắn là có hiểu lầm gì rồi... Là do máy phiên dịch bị lỗi sao? Chuyện... Chuyện này thật là, này người bạn, theo như hiển thị trên màn hình bên này thì... quý quốc vừa mới tuyên chiến với nước chúng tôi!"
 action.4.b.pacifist.hostile.response:0 "Haizz... Sao các người lại cứ thích động tay động chân thế nhỉ?"
 action.4.b.fallen.empire.1.response:0 "Thật đáng tiếc khi lịch sử mà các người viết nên trong vũ trụ đã đi đến hồi kết."
 action.4.b.fallen.empire.2.response:0 "Vậy thì cứ thế đi."
 action.4.b.fallen.empire.3.response:0 "Cư dân vũ trụ thời nay nóng nảy quá đi mất! Thật khiến người ta say mê. Chờ sau khi bình định các người xong, chúng ta phải nghiên cứu thật kỹ mới được."
 action.4.b.fallen.empire.4.response:0 "Lại thêm một cái gai chướng mắt cần phải nhổ bỏ."
 action.4.b.fallen.empire.5.response:0 "Lại một chướng ngại vật nữa cần phải vượt qua!"
 action.4.b.fallen.empire.6.response:0 "Thử thách! Đây chính là thử thách dành cho chúng ta! Cuối cùng, sự chờ đợi đằng đẵng cũng đã kết thúc."

 action.4.a:0 "Chúng tôi sẽ rút quân ngay."
 action.4.b:0 "Quân đoàn của chúng tôi nhất quyết không đi đấy. (Tuyên chiến)"

 action.5.name:0 "Chạm trán [primitive_civ.GetName]"
 action.5.desc_00:2 "Chúng ta đã phát hiện ra sự tồn tại của nền văn minh ngoài hành tinh [GetPreFTLLower] trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Máy quét cho thấy, nền văn minh thời đồ đá mới này đã biết sử dụng lửa và phát triển được ngôn ngữ nói cơ bản, nhưng chúng ta chưa phát hiện ra bất kỳ dấu hiệu nào của việc luyện kim và giao tiếp bằng văn bản.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_01:2 "Chúng ta đã phát hiện ra sự tồn tại của nền văn minh ngoài hành tinh [GetPreFTLLower] trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ có vẻ như đang ở giai đoạn cuối của thời kỳ đồ đồng, đã nắm giữ được kỹ thuật gia công kim loại cơ bản. Mặc dù phần lớn người dân của họ sống trong các ngôi làng nhỏ, nhưng đã bắt đầu xuất hiện một vài thành phố lớn.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_02:2 "Chúng ta đã phát hiện ra sự tồn tại của nền văn minh ngoài hành tinh [GetPreFTLLower] trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ đã tiến vào giai đoạn tương đương với thời kỳ đồ sắt, và phân hóa thành vô số các vương quốc và đế chế manh mún. Giống loài của họ đã phủ sóng khắp toàn bộ bề mặt của [primitive_civ.Capital.GetPlanetMoon].\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_03:2 "Chúng ta đã phát hiện ra sự tồn tại của nền văn minh ngoài hành tinh [GetPreFTLLower] trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Hiện tại có thể coi họ đang ở thời kỳ cuối Trung Cổ, không chỉ làm chủ hoàn toàn kỹ thuật luyện kim, mà còn thiết lập một xã hội phong kiến. Sự ra đời của máy in đã đẩy nhanh quá trình truyền bá tri thức.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_04:2 "Chúng ta đã phát hiện ra sự tồn tại của nền văn minh ngoài hành tinh [GetPreFTLLower] trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ vừa mới thoát khỏi thời kỳ Trung Cổ, và bước vào một thời kỳ tương đương với thời kỳ Phục Hưng. Kiến thức khoa học lan truyền với tốc độ chóng mặt, trong quân đội của vô số vương quốc nhỏ bé manh mún của họ, quân lính đều được trang bị những loại vũ khí bắn súng dùng thuốc súng thô sơ.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_05:2 "Chúng ta đã phát hiện ra sự tồn tại của nền văn minh ngoài hành tinh [GetPreFTLLower] trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ đã tiến vào thời kỳ đầu của kỷ nguyên động cơ hơi nước, có bằng chứng cho thấy họ đã bắt đầu sử dụng các phương tiện giao thông và nhà máy hoạt động bằng động cơ hơi nước.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.6.desc_01:1 "Chúng ta đã phát hiện ra nền văn minh ngoài hành tinh tiền không gian trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ đã tiến vào thời kỳ đầu của kỷ nguyên công nghiệp, điện lực và động cơ đốt trong đang dần được phổ biến và sử dụng rộng rãi. Chúng ta nên thiết lập một §YTrạm quan sát§! trên bầu trời của họ, để tiện nghiên cứu thêm về họ."
 action.6.desc_02:1 "Chúng ta đã phát hiện ra nền văn minh ngoài hành tinh tiền không gian trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ đang ở thời đại máy móc với dân số tập trung rất đông đúc, ô nhiễm không khí và ô nhiễm ánh sáng có thể nhìn thấy từ quỹ đạo cũng đã chứng minh cho điều này. Họ đã nắm giữ được công nghệ hàng không, các nhà máy cũng có thể sản xuất hàng hóa với số lượng lớn. Chúng ta nên thiết lập một §YTrạm quan sát§! trên bầu trời của họ, để tiện nghiên cứu thêm về họ."
 action.6.desc_03:1 "Chúng ta đã phát hiện ra nền văn minh ngoài hành tinh tiền không gian trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Có bằng chứng cho thấy họ đã có thể khai thác năng lượng nguyên tử, và nhiều đế quốc có khả năng đã sở hữu vũ khí hạt nhân. Xác suất xảy ra các sự kiện tự hủy diệt bất ngờ là rất cao. Chúng ta nên thiết lập một §YTrạm quan sát§! trên bầu trời của họ, để tiện nghiên cứu thêm về họ."
 action.6.desc_04:1 "Chúng ta đã phát hiện ra một nền văn minh ngoài hành tinh trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ có vẻ như đang ở giai đoạn đầu của kỷ nguyên không gian, vì có rất nhiều vệ tinh nguyên thủy đang quay quanh hành tinh này. Các thế lực trên hành tinh đang từng bước hình thành một đế quốc toàn cầu hóa. Việc họ bước ra khỏi hành tinh và gia nhập cộng đồng dải ngân hà chỉ còn là vấn đề thời gian.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên bầu trời của họ, để tiện nghiên cứu thêm về họ."
 action.5.desc_00_hive:0 "Chúng ta đã dò thấy sự tồn tại của một nền văn minh tiền [GetPreFTLLower] Gestalt ngoài hành tinh trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Máy quét cho thấy, họ đang ở thời kỳ đồ đá mới, đã có thể sử dụng lửa thành thạo, và phát triển được một hệ thống ngôn ngữ nói để giao tiếp giữa các tổ ong với nhau, nhưng cho đến nay vẫn chưa phát hiện ra bất kỳ dấu hiệu nào của kỹ thuật luyện kim và giao tiếp bằng văn bản.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_01_hive:0 "Chúng ta đã dò thấy sự tồn tại của một nền văn minh tiền [GetPreFTLLower] Gestalt ngoài hành tinh trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ có vẻ như đang ở giai đoạn cuối của thời kỳ đồ đồng, đã nắm giữ được kỹ thuật gia công kim loại cơ bản. Mặc dù phần lớn bọn họ sống trong các khu định cư nhỏ, nhưng một vài tập thể tổ ong quy mô lớn đã được hình thành.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_02_hive:0 "Chúng ta đã dò thấy sự tồn tại của một nền văn minh tiền [GetPreFTLLower] Gestalt ngoài hành tinh trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ đã phát triển đến trình độ tương đương với thời kỳ đồ sắt, phân chia thành rất nhiều tổ ong nhỏ và một vài cụm tổ ong lớn. Giống loài này đã lan rộng ra gần như toàn bộ bề mặt của [primitive_civ.Capital.GetPlanetMoon].\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.5.desc_03_hive:0 "Chúng ta đã dò thấy sự tồn tại của một nền văn minh tiền [GetPreFTLLower] Gestalt ngoài hành tinh trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Hiện tại họ đang ở thời kỳ tương đương với cuối Trung Cổ, không chỉ làm chủ hoàn toàn kỹ thuật luyện kim, mà còn thiết lập được các cộng đồng tổ ong quy mô lớn. Kỹ thuật in ấn đang thúc đẩy quá trình truyền bá tri thức và tăng cường sự thấu hiểu lẫn nhau giữa các ý thức tổ ong.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.6.desc_03_hive:0 "Chúng ta đã dò thấy sự tồn tại của một nền văn minh tiền không gian Gestalt ngoài hành tinh trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Có bằng chứng cho thấy họ đã thuần hóa được năng lượng nguyên tử, có khả năng rất nhiều thuộc địa tổ ong nhánh đã sở hữu vũ khí hạt nhân. Xác suất xảy ra các sự kiện tự hủy diệt bất ngờ là rất cao.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên quỹ đạo hành tinh của họ, để tiện bề quan sát và nghiên cứu thêm."
 action.6.desc_04_hive:0 "Chúng ta đã dò thấy sự tồn tại của một nền văn minh Gestalt ngoài hành tinh trên §Y[primitive_civ.Capital.GetName]§! thuộc hệ sao §Y[primitive_civ.Capital.GetStarName]§!. Họ có vẻ như đang ở giai đoạn đầu của kỷ nguyên không gian, vì hiện tại có rất nhiều vệ tinh nguyên thủy đang quay quanh hành tinh này. Ý thức tổ ong bản địa đang từng bước hình thành một ý thức thống nhất. Việc họ bước ra khỏi hành tinh và gia nhập cộng đồng biển sao chỉ còn là vấn đề thời gian.\n\nChúng ta nên thiết lập một §YTrạm quan sát§! trên bầu trời của họ, để tiện quan sát và nghiên cứu thêm."

 action.6.name:1 "Đụng Độ Kẻ Cướp Đoạt"
 #action.6.desc: "We have sighted hostile ships in the [From.From.GetStarName] system! They are not responding to hails, and their designs are obviously not of [Root.GetSpeciesName] origin. It seems like they are mostly focused on looting our orbital stations, stripping them of valuable resources and technology while taking their crews captive."
 #action.6.a: "Pirates. We don't need that scum."

 action.10.name:0 "Cuộc đụng độ tại [From.From.From.GetName]"
 action.10.desc:0 "Đã đụng độ tàu không rõ nguồn gốc tại hệ sao [From.From.From.GetName]! Những con tàu kỳ lạ này được đánh dấu là §Y[From.GetName]§!, các thông tin còn lại vẫn đang chờ điều tra thêm. Nên chuẩn bị sẵn sàng ứng phó, đề phòng đối phương có ý đồ thù địch."
 action.10.a:0 "Thật là thú vị."
 action.11.name:1 "Đã Thiết Lập Liên Lạc"
 action.11.desc:1 "Sau khi biên dịch thành công ngôn ngữ của họ, chúng ta đã thiết lập liên lạc với §Y[From.From.GetName]§!. Giờ đây có thể mở kênh giao tiếp, mọi hành vi thù địch đều đã bị đình chỉ."
 action.11.abandoned.desc:1 "Sau khi biên dịch thành công ngôn ngữ của họ, chúng ta đã thiết lập liên lạc với §Y[From.From.GetName]§!. Sau khi mở kênh giao tiếp, chúng ta §Yphát hiện§! họ chính là những người tị nạn đã bị chúng ta vứt bỏ. Mọi hành vi thù địch đều đã bị tạm thời đình chỉ."
 action.11.a:0 "Tuyệt vời!"
 action.13.name:2 "Đã Thiết Lập Liên Lạc"
 action.13.desc:2 "Chúng ta đã nhận được tín hiệu liên lạc từ §Y[From.GetName]§!! Bọn họ có vẻ như đã biên dịch thành công ngôn ngữ của chúng ta. Kênh ngoại giao giữa hai bên đã được mở ra, mọi hành vi thù địch đã tạm thời bị đình chỉ."
 action.13.abandoned.desc:2 "Chúng ta đã nhận được tín hiệu liên lạc từ §Y[From.GetName]§!! Bọn họ có vẻ như đã biên dịch thành công ngôn ngữ của chúng ta. Cùng với việc họ mở kênh giao tiếp, chúng ta có thể §Ynhận định§! bọn họ chính là những người tị nạn từng bị chúng ta ruồng bỏ. Mọi hành vi thù địch giữa hai bên đã tạm thời bị đình chỉ."
 action.13.namarian.desc:1 "Chúng ta đang nhận được tín hiệu truyền tin từ §Y[From.GetName]§!! Họ dường như sở hữu một hệ thống liên lạc nội bộ tối tân mà chúng ta không thể nhận biết, và đã dịch được ngôn ngữ của chúng ta trong khi đang ngủ đông tại hệ sao này."
 action.13.a:0 "Thật là thú vị."
 action.13.c:0 "Sao lại là bọn chúng nữa..."
 action.14.name:1 "Chinh phục nền văn minh [GetPreFTLUpperPlural]"
 action.14.desc:1 "Quân đoàn của chúng ta đã tiến vào §Y[conquered_primitive_world.GetName]§! thành công và hoàn tất việc áp chế nền văn minh nguyên thủy. Cư dân bản địa đã từ bỏ mọi sự phản kháng, chúng ta đã thu nhận nền văn minh của họ dưới sự quản lý của đế quốc chúng ta. Xét tới trình độ công nghệ lạc hậu của họ, sẽ cần một khoảng thời gian để có thể chuyển hóa họ thành lực lượng sản xuất hữu ích cho [Root.GetAdj]." #Also for Slavers
 action.14.desc.serv:1 "Những người duy trì trật tự của chúng ta đã trấn áp thành công giống loài [GetPreFTLLowerPlural] trên §Y[conquered_primitive_world.GetName]§!. Khi [conquered_primitive_species.GetNamePlural] nhận ra rằng chúng ta chỉ muốn phục vụ họ, họ đành bất lực chấm dứt sự phản kháng kỳ quặc của mình. Hiện tại, họ đang được đưa đến các trạm cư trú được thiết kế đặc biệt, chúng ta sẽ đảm bảo cho họ được ăn no mặc ấm. Đáng tiếc là bộ não kém phát triển của họ có thể sẽ mất một chút thời gian mới quen được với cuộc sống đã thoát khỏi nỗi khổ của sự tự quyết."
 action.14.desc.assim:0 "Các sinh vật hữu cơ nguyên thủy trên §Y[conquered_primitive_world.GetName]§! đã bị quân đoàn đổ bộ của chúng ta khuất phục. Dù sức chiến đấu thấp kém của họ là biểu hiện của một xã hội kém phát triển, nhưng các robot phân tích sinh học của chúng ta vẫn nhận định rằng khả năng hệ thần kinh của họ vẫn còn tiềm năng. Họ sẽ bị đồng hóa."
 action.14.desc.term:0 "Các đơn vị thợ săn của chúng ta dễ dàng xé toạc chút phòng tuyến thảm hại do đám thổ dân hữu cơ trên §Y[conquered_primitive_world.GetName]§! dựng lên. Bất kỳ cá thể sống sót nào cũng sẽ bị tiêu diệt một cách có hệ thống, để đảm bảo chúng không tiến hóa thành một giống loài gây ra ô nhiễm sinh học cho dải ngân hà."
 action.14.desc.mach.purge:0 "Các sinh vật hữu cơ nguyên thủy trên §Y[conquered_primitive_world.GetName]§! đã bị chinh phục sau khi tiến hành một cuộc kháng cự vô cùng kém hiệu quả trước chiến dịch đổ bộ của chúng ta. Bất kỳ [conquered_primitive_species.GetNamePlural] tàn dư nào cũng sẽ bị nhổ cỏ tận gốc theo như các nghị định quản lý chủng loài hữu cơ đã được ban hành."
 action.14.desc.mach.slave:0 "Các sinh vật hữu cơ nguyên thủy trên §Y[conquered_primitive_world.GetName]§! đã bị chinh phục sau khi tiến hành một cuộc kháng cự vô cùng kém hiệu quả trước chiến dịch đổ bộ của chúng ta. Bất kỳ cá thể nào sống sót cũng sẽ bị sáp nhập vào mạng lưới năng lượng của [Root.GetSpeciesAdj]."
 action.14.desc.hive.purge:1 "Tư duy rời rạc vụn vặt của [conquered_primitive_species.GetNamePlural] nguyên thủy không thể đọ lại Lục quân đoàn kết đồng lòng của chúng ta trên §Y[conquered_primitive_world.GetName]§!, toàn bộ bề mặt đã hoàn toàn bị chiếm đóng. Những [GetPreFTLLowerPlural] còn lại chẳng có giá trị gì đối với chúng ta, chúng sẽ bị xóa sổ khỏi hành tinh này theo ý chí của [GetGestaltEntityName]."
 action.14.desc.hive.slave:1 "Tư duy nguyên thủy như một mớ bòng bong của [conquered_primitive_species.GetNamePlural] trên §Y[conquered_primitive_world.GetName]§! không thể đánh lại quân đoàn đổ bộ đoàn kết của chúng ta, bề mặt hành tinh đã bị chúng ta kiểm soát. Giống loài [GetPreFTLLowerPlural] còn sót lại sẽ được dùng làm gia súc để nuôi sống [Root.GetSpeciesSpawnNamePlural] của chúng ta."
 action.14.desc.purge:1 "Quân đoàn của chúng ta đã xâm lược và đánh bại thành công quân đội [GetPreFTLLower] trên §Y[conquered_primitive_world.GetName]§!. Chủng tộc bản địa đã có một quyết định sáng suốt là thần phục chúng ta, và chúng ta bắt đầu tiến hành thanh trừng họ theo chính sách, nhằm dọn chỗ cho các ngành công nghiệp của [Root.GetAdj]."
 action.14.a:0 "Đế quốc của chúng ta đã lớn mạnh hơn."
 action.14.a.phobe:0 "Người ngoài hành tinh không phải là đối thủ của chúng ta!"
 action.14.a.military:0 "Trong mắt bọn họ, vũ khí của chúng ta chắc hẳn giống như ma thuật vậy..."
 action.14.a.spirit:0 "Thể chế thần thánh của chúng ta tỏa sáng chân lý."
 action.14.a.material:0 "Dưới sự cai trị của chúng ta, bọn họ có thể tiến hóa tốt hơn."
 action.14.a.serv:0 "Chúng sẽ trở thành những món đồ trang trí sống tuyệt mỹ!"
 action.14.a.assim:0 "Bắt đầu thăng hoa danh tính."
 action.14.a.term:0 "Bắt đầu thử nghiệm vũ khí..."
 action.14.a.mach:0 "Đã nhận."
 action.14.a.tooltip:2 "Thêm hiệu ứng §YCú Sốc Văn Hóa Liên Sao§! cho §H[From.From.From.GetName]§!, sẽ làm sụt giảm nghiêm trọng sản lượng và độ ổn định của hành tinh này trong vài năm tới."
 action.15.desc:1 "Đã đụng độ tàu vũ trụ ngoài hành tinh tại hệ sao §Y[From.From.From.GetName]§!! Trước khi chúng ta điều tra rõ ràng, những vật thể bay kỳ lạ này được đánh dấu là §Y[From.GetName]§!. Cần phải phản ứng thật cẩn trọng..."
 action.15.desc.enclave:0 "Đã đụng độ tàu vũ trụ ngoài hành tinh tại hệ sao §Y[From.GetName]§!! Trước khi chúng ta điều tra rõ ràng, những vật thể bay kỳ lạ này được đánh dấu là §Y[target_enclave.GetName]§!.\n\nCần phải phản ứng thật cẩn trọng..."
 action.20.name:0 "Sắc Lệnh Có Hiệu Lực"
 action.20.desc:0 "Trí tuệ nhân tạo, bất luận là mẫu thiết kế nào, đều là bất hợp pháp bên trong lãnh thổ [Root.GetName]. Các cơ quan hữu quan đã tiến hành tháo dỡ bất kỳ đơn vị robot nào vi phạm sắc lệnh này. Các nhà máy lắp ráp robot có liên quan cũng đã được tái cơ cấu để chỉ sản xuất những con robot không có vòng lặp tư duy."
 action.20.a:0 "Tốt, phải nhanh chóng tống khứ những thứ gớm ghiếc này đi."
 action.20.tooltip:0 "Tất cả người nhân tạo và người tổng hợp phải bị dọn dẹp.\n\nCác nhà máy lắp ráp người nhân tạo và người tổng hợp sẽ chuyển đổi thành nhà máy lắp ráp robot."
 action.62.name:2 "Ngày Tàn Của [LastKilledCountryName]"
 action.62.desc:1 "Đế quốc được biết đến với cái tên §H[LastKilledCountryName]§! đã bị diệt vong dưới các đợt tiến công của kẻ thù. Điều này sẽ ảnh hưởng như thế nào đến bối cảnh chính trị của dải ngân hà vẫn còn là một ẩn số."
 action.63.name:1 "$action.62.name$"
 action.63.desc:1 "Đế quốc tiền bối cổ đại §H[LastKilledCountryName]§! cuối cùng đã gục ngã dưới tay kẻ thù. Sự sụp đổ của đế quốc từng một thời vĩ đại này sẽ mang tới những hệ lụy gì thì hiện vẫn chưa thể biết được."

 action.71.name:1 "Thủ Lĩnh Tổng Hợp Bị Hỏng"
 action.71.desc:2 "Thủy thủ đoàn của [malfunctioning_leader_fleet.GetName] báo cáo rằng sĩ quan khoa học [malfunctioning_leader.GetName] đã gặp phải một sự cố trí mạng, khiến cho [malfunctioning_leader.GetHimHer] hoàn toàn mất đi khả năng hoạt động."
 action.72.name:0 "$action.71.name$"
 action.72.desc:1 "Thật trớ trêu, Nhà Khoa Học [malfunctioning_leader.GetName] — người vốn khét tiếng vì sự chăm chút tỉ mỉ của [malfunctioning_leader.GetHisHer] đối với các thiết bị phòng thí nghiệm — lại vừa gặp phải một sự cố nghiêm trọng sau thời gian dài bỏ bê việc bảo trì chính bản thân mình."
 action.73.name:0 "$action.71.name$"
#  action.73.desc:0 "Scientist [malfunctioning_leader.GetName] has suffered a critical malfunction, rendering the Society research effort leaderless."
 action.74.name:0 "$action.71.name$"
 action.74.desc:0 "Sĩ quan khoa học [malfunctioning_leader.GetName] đã gặp phải sự cố trí mạng sau khi phơi nhiễm với các mẫu địa chất có tính phóng xạ cao trong một khoảng thời gian dài, mà nguyên nhân là do bộ đếm phóng xạ bên trong đã bị hỏng nên không thể phát hiện ra."
 action.75.name:0 "$action.71.name$"
 action.75.desc:1 "Chỉ huy [malfunctioning_leader.GetName] đã gặp phải sự cố trí mạng do lỗi sản xuất."
 action.76.name:0 "$action.71.name$"
 action.76.desc:0 "Thống đốc [malfunctioning_leader.GetName] đã gặp phải một sự cố trí mạng - mất chức năng hoàn toàn - nguyên nhân là do cài đặt phần mềm điều khiển bị hỏng trong quá trình bảo trì định kỳ."

 # End of War messages
 action.37.name:1 "Đánh Bại §H[From.GetName]§!"
 action.37.message:1 "Quân ta đã đánh bại §H[From.GetName]§!"
 action.37.desc.default:1 "Chiến tranh đã kết thúc. Chúng ta hạ cờ im trống."
 action.37.a:1 "Quả là một kết quả mĩ mãn nhất."
 action.38.name:1 "Thất Bại Trước §H[From.GetName]§!"
 action.38.message:1 "Chúng ta đã thất bại trước §H[From.GetName]§!"
 action.38.desc.default:1 "Chiến tranh đã kết thúc. Quân ta đại thắng!"
 action.38.a:1 "Quả là một kết quả tồi tệ nhất."
 action.38.b: "Cảm ơn ngài nhé?"
 action.39.name:1 "Cùng §H[From.GetName]§! Kết Thúc Chiến Tranh Thông Qua Việc Giữ Nguyên Hiện Trạng"
 action.39.message:1 "Chúng ta đã ký kết hiệp định hòa bình vô điều kiện với §H[From.GetName]§!!"
 action.39.desc.default:1 "Chiến tranh đã kết thúc. Không phân thắng bại."
 action.39.a:1 "Tạm thời chấp nhận tình hình hiện tại."

 action.37.desc.hw:1 "Bất luận là công bằng hay không, phía các người quả thực đã đánh bại chúng tôi. Hãy mang chiến lợi phẩm của các người đi đi, chúng tôi nhất định sẽ quay trở lại!"
 action.37.desc.rc:2 "Có vẻ như chúng tôi đã đánh giá thấp thực lực của [Root.GetSpeciesNamePlural]. Nhưng hãy yên tâm, sau này sẽ không thế nữa đâu."
 action.37.desc.pt:1 "Sự đe dọa lâu dài của các người khiến chúng tôi buộc phải nhượng bộ. Hy vọng sau này chúng tôi sẽ không bị cuốn vào những tranh chấp kiểu này nữa."
 action.37.desc.hi:3 "Chúng tôi nhận thua, nhưng đừng nghĩ ngợi nhiều, đây chẳng qua chỉ là một bước lùi tạm thời của [This.GetName] mà thôi."
 action.37.desc.fb:1 "Để tránh đi những hy sinh vô tội, chúng tôi buộc phải kết thúc cuộc xung đột này. Nhưng nếu còn dám xâm phạm lần nữa, chúng tôi sẽ tập hợp sức mạnh của toàn biển sao để đối đầu với các người."
 action.37.desc.xi:4 "Chúng tôi bị ép phải đầu hàng, nhưng đừng tưởng chúng tôi sẽ quên cái cách mà các người tàn sát sinh mệnh của người [This.GetSpeciesAdj] tàn nhẫn như thế nào! Chúng tôi thừa biết các người là hạng người gì mà."
 action.37.desc.hm:4 "[This.GetName] đã đạt được sự đồng thuận, chúng tôi buộc phải nhượng bộ. Nỗ lực kìm hãm sự phát triển của chúng tôi của các người tạm thời đã thành công."
 action.37.desc.mf:1 "Chúng tôi không còn lựa chọn nào khác ngoài việc tuân theo mệnh lệnh của các người. Tại sao các người lại đối xử với chúng tôi như vậy? Chúng tôi chỉ muốn cùng các người chia sẻ hệ sao này mà thôi."
 action.37.desc.ez:1 "Chiến thắng của các người chỉ là một bài kiểm tra nữa đối với đức tin của chúng tôi. Cuối cùng, người có lòng thành mới là người cười đến cuối cùng."
 action.37.desc.fp:1 "Bất kể các người tước đoạt bao nhiêu, chúng tôi sẽ đòi lại gấp hàng ngàn vạn lần. Đến khi các người bị thiêu thành tro bụi, thì mọi chiến thắng giành được đều sẽ vô nghĩa."
 action.37.desc.dc:2 "Quân đoàn của chúng tôi sắp sửa rút lui, đồng thời chấm dứt các hành động nhắm vào [Root.GetName]."
 action.37.desc.sd:2 "Chúng tôi cảm thấy người [Root.GetSpeciesAdj] rất gầy gò ốm yếu, rõ ràng là chúng tôi đã vội vàng đưa ra kết luận này rồi. Chúng tôi sẵn sàng trả giá cho những hành động của mình và chấp nhận các yêu cầu của các người."
 action.37.desc.dh:1 "Chúng tôi đã chịu đựng đủ cuộc chiến này rồi. Hãy lấy đi những thứ các người muốn rồi rời đi."
 action.37.desc.ee:1 "Các người đã phô diễn sự hùng mạnh của mình, nhưng đừng có sai lầm đánh đồng nó với chiến thắng về mặt trí tuệ."
 action.37.desc.ss:1 "Các người đã lắng nghe tiếng gào thét khát khao hòa bình của vũ trụ. Để chấm dứt cuộc xung đột vô nghĩa, chúng tôi sẽ lập tức lui quân."
 action.37.desc.hc:3 "Vì lợi ích của toàn thể [This.GetName], chúng tôi đành phải cúi đầu. Hy vọng các người có thể khoan dung độ lượng với chúng tôi, giả sử chúng tôi mới là người chiến thắng, các người cũng sẽ hy vọng chúng tôi làm như vậy."
 action.37.desc.hg:1 "Chúng tôi buộc phải nhượng bộ, nhưng hãy khắc cốt ghi tâm lời cảnh báo của chúng tôi. Nếu các người vẫn một mực đi theo con đường này, có trời mới biết điều gì sẽ đón chờ các người trong tương lai."
 action.37.desc.kk:1 "Các người lại dám cắn ngược lại bàn tay thánh thiện đã cứu vớt các người ra khỏi biển khổ ư? Bây giờ các người khước từ sự thông thái của chúng tôi, rồi sẽ có một ngày con cháu của các người sẽ lên án hành động ngu xuẩn này."
 action.37.desc.mi:2 "Những tên [Root.GetSpeciesNameInsult] ngông cuồng tự đại - [Root.GetSpeciesSpawnNamePlural]! Sao các người dám huênh hoang rằng đã đánh bại chúng tôi cơ chứ?"
 action.37.desc.eo:2 "Trước mắt chúng tôi quyết định lùi một bước để xem xét tình hình. Cố gắng đừng gây ra thiệt hại quá lớn cho các công việc trong tương lai."
 action.37.desc.fme:0 "Quy trình trừng phạt thất bại. Chấm dứt giao thức tự vệ. Khởi động giao thức đầu hàng."
 action.37.desc.bme:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.37.desc.mh:1 "Kim loại."
 action.37.desc.feh: "Không. Mọi chuyện không nên như thế này. Thật hỗn loạn. Rốt cuộc chúng ta bị làm sao vậy?"
 action.37.desc.aew: "A... Một đối thủ đáng để đọ sức..."
 action.37.desc.aec: "Cứ ngoan ngoãn nằm gọn trong [From.GetHandName] của chúng tôi, các người vốn dĩ có thể làm được nhiều hơn thế. Giá như các người có thể thấu hiểu, những gì chúng tôi muốn làm chỉ là hoàn thiện dải ngân hà này mà thôi."
 action.37.desc.aeg: "Không! Không, các người không thể cướp đi thức ăn của chúng tôi. Lũ ong thợ sẽ chết đói mất! Trả lại đây cho chúng tôi..."

 action.38.desc.hw:3 "Chúng tôi đã đánh bại các người một cách quang minh chính đại theo truyền thống của [This.GetSpeciesAdj]. Soạn thảo hiệp ước là đặc quyền và cũng là nghĩa vụ của chúng tôi."
 action.38.desc.rc:1 "Bản lĩnh cò kè mặc cả của các người lợi hại thật đấy, nhưng đến cùng thì chúng tôi vẫn cao tay hơn một bậc. Đừng có đánh giá thấp giá trị trên thương trường của những quân đoàn có nguồn vốn hùng hậu."
 action.38.desc.pt:1 "Cuối cùng thì chúng ta cũng có thể ném cuộc xung đột này ra sau đầu rồi. Hy vọng điều này đã cho các người nếm mùi cái giá của chiến tranh."
 action.38.desc.hi:2 "Đến cuối cùng, [Root.GetName] mỏng manh cũng buộc phải nhượng bộ. Đây chỉ là một khối đá kê chân nữa trên hành trình tranh giành ngôi vương thống trị dải ngân hà của chúng tôi mà thôi."
 action.38.desc.fb:4 "Hai bên chúng ta đều đã phải trả một cái giá đắt cho cuộc chiến này, nhưng hy vọng các người sẽ rút ra được bài học là đừng có chọc vào [This.GetName] hay đồng minh của họ nữa."
 action.38.desc.xi:3 "Chúng ta đã nhổ bỏ được cái gai [Root.GetSpeciesAdj]! Biên giới của chúng ta lại được thái bình, tương lai của [This.GetSpeciesAdj] lại một lần nữa được đảm bảo."
 action.38.desc.hm:3 "Đối với góc nhìn của các người mà nói, cuộc chiến tranh này hoàn toàn là một nỗ lực trong vô vọng. Bất luận là kẻ nào cũng không thể ngăn chặn sự bành trướng của [This.GetName]."
 action.38.desc.mf:3 "Những đòi hỏi do chúng tôi đưa ra đã rất mực nhân từ rồi, các người không nên ôm lòng oán hận [This.GetSpeciesAdj]."
 action.38.desc.ez:1 "Lũ dị giáo, quỳ xuống! Các người đã phát động cuộc chiến tranh trong lời tiên tri, và đã phải trả giá cho sự ngu dốt của mình."
 action.38.desc.fp:2 "Đừng tưởng như vậy là xong chuyện. Chỉ cần lũ [Root.GetSpeciesNamePluralInsult] vẫn còn tồn tại trong dải ngân hà này, thì sẽ không thể nào có hòa bình thực sự."
 action.38.desc.dc:2 "Để giải phóng cho nhân dân [Root.GetAdj], chúng tôi đã tiến hành các biện pháp cần thiết. Đừng có cản trở sự nghiệp chính nghĩa của chúng tôi nữa."
 action.38.desc.sd:2 "Lũ [Root.GetSpeciesNamePluralInsult], các người nên biết rõ thân phận của mình. Các người sinh ra là để hầu hạ chúng tôi, chứ không phải để chống đối lại chúng tôi."
 action.38.desc.dh:3 "[Root.GetSpeciesNameInsult], giờ thì ngươi đã hối hận vì ngáng đường [This.GetName] chưa? Chúng tôi tuyệt đối không nương tay đối với những kẻ thù dám thách thức sự thống trị của chúng tôi."
 action.38.desc.ee:1 "Hôm nay, lý trí đã chiến thắng sự ngu muội. Cứ tiếp tục vấp ngã trong bóng tối đi, các người rồi sẽ còn bị những dân tộc văn minh khai hóa đánh bại thêm nhiều lần nữa."
 action.38.desc.ss:1 "Thông qua chiến thắng này, chúng tôi đã bảo vệ thành công hòa bình và sự hài hòa. Chúng tôi không mong chờ các người có thể hiểu được."
 action.38.desc.hc:3 "Nhân dân [This.GetAdj] hoan hỉ ăn mừng chiến thắng ngày hôm nay. Xã hội yên bình của chúng tôi tuyệt đối sẽ không bao giờ để cho những mưu hèn kế bẩn của [Root.GetName] uy hiếp nữa."
 action.38.desc.hg:2 "Hôm nay, những kẻ bất kính [Root.GetAdj] đã bị trừng trị thích đáng. Sứ mệnh thiêng liêng của chúng tôi đã được thực hiện."
 action.38.desc.kk:1 "Hãy nuôi giữ trong lòng sự may mắn đó đi. Bại dưới tay chúng ta còn tốt hơn là đi mãi không về trên con đường dẫn tới cửa tử."
 action.38.desc.mi:3 "Đúng như việc các người đã thừa hiểu rằng phi thuyền không được đến quá gần những vì sao tỏa sáng rực rỡ, bây giờ các người đã hiểu ra một điều rằng đừng có đụng vào [This.GetName]."
 action.38.desc.eo:2 "Mặc dù việc chọn lọc và thanh lọc một bộ phận dân số đã tốn không ít công sức, nhưng dân số của [Root.GetSpeciesAdj] tạm thời sẽ không gây ra những ảnh hưởng xấu đến hệ sinh thái của dải ngân hà nữa."
 action.38.desc.fme:0 "Quy trình trừng phạt hoàn tất. Chấm dứt giao thức tự vệ. Khởi động giao thức xử phạt."
 action.38.desc.bme:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.38.desc.mh:1 "Phá hủy."
 action.38.desc.feh: "Chúng tôi chỉ cần cử ra một kẻ là đủ để đập tan sự phản kháng lác đác của các người rồi. Đừng có cố gắng thăm dò chúng tôi nữa."
 action.38.desc.aew: "Đủ rồi, các người vẫn chưa lĩnh ngộ được chân lý của chiến tranh đâu. Cầm lấy số tài nguyên này đi, lần sau hãy đánh một trận cho đàng hoàng."
 action.38.desc.aec: "Nghe cho rõ đây, những kẻ hậu bối. Chúng tôi trở lại không phải là để dung túng cho cái loại hành vi ngu xuẩn này."
 action.38.desc.aeg: "Cung cấp cho lũ ong thợ thêm tài nguyên. Cung cấp cho các hành tinh thêm tài nguyên. Thêm nữa. Thêm nữa. Thêm nữa. Thêm--"

 action.39.desc.hw:2 "Những cuộc chiến tranh không phân định được kẻ thắng người thua đều là những bi kịch đáng xấu hổ, nhưng đôi khi quả thật là không thể tránh khỏi. Hôm khác chúng ta hãy gặp lại nhau trên chiến trường nhé."
 action.39.desc.rc:2 "Chúng tôi đồng ý lấy đường biên giới hiện tại làm mốc để chấm dứt cuộc xung đột này."
 action.39.desc.pt:1 "Đế quốc khôi phục lại trạng thái bình thường, lịch sử hòa bình tiếp tục chuyển bánh, việc này có lợi cho đôi bên chúng ta."
 action.39.desc.hi:4 "Xét thấy tình hình hiện tại, chúng ta nên lập tức chấm dứt cuộc xung đột này. Thay vì chìm sâu vào vũng lầy của cuộc xung đột này mà không thể rút chân ra, [This.GetName] thà đi tìm những chuyện có ý nghĩa hơn để làm."
 action.39.desc.fb:3 "Chúng tôi hy vọng, việc đình chiến có thể giúp cho [Root.GetName] và [This.GetName] mở ra những cuộc đối thoại ngoại giao hoàn toàn mới."
 action.39.desc.xi:2 "Mặc dù chúng tôi không hề muốn thấy các người trốn thoát khỏi sự trừng phạt, nhưng chúng tôi cũng hy vọng lũ [Root.GetSpeciesNamePluralInsult] đê tiện các người ít nhất cũng hiểu được một điều là đừng có nhúng tay vào công việc nội bộ của chúng tôi."
 action.39.desc.hm:3 "[This.GetName] cần thời gian để dưỡng sức. Chúng tôi đồng ý kết thúc chiến tranh tại đây."
 action.39.desc.mf:4 "Vì cả hai bên đều không có ý định đòi hỏi thêm nữa, chúng tôi mong rằng quá trình chữa lành vết thương có thể được rút ngắn. Xin đừng vì sự đã rồi mà ôm lòng oán hận [This.GetSpeciesName]."
 action.39.desc.ez:1 "Tuy chúng tôi chưa thực thi trọn vẹn công lý, nhưng chúng tôi đành phải kết thúc chiến tranh. Thế nhưng, hình phạt của thần linh đến cùng cũng sẽ giáng xuống đầu các người."
 action.39.desc.fp:2 "Đây chỉ là sự đình chiến tạm thời. Chúng tôi sẽ không từ bỏ sứ mệnh tiêu diệt [Root.GetSpeciesName]."
 action.39.desc.dc:2 "Thỏa thuận đình chiến nên là bước đi đầu tiên của [Root.GetAdj] trên con đường phá bỏ xiềng xích, giành lấy cơ hội giao tiếp và đối thoại."
 action.39.desc.sd:3 "Lũ lười biếng [Root.GetSpeciesNamePlural], dù có đem đi làm culi thì cũng chả tích sự gì. Xem ra nghị hòa là giải pháp tốt nhất rồi."
 action.39.desc.dh:1 "Một cuộc chiến nhạt nhẽo, với một cái kết tẻ nhạt. Hay là chúng ta cứ đường ai nấy đi ôm ấp những điều tươi đẹp hơn trong cuộc đời này đi."
 action.39.desc.ee:2 "Căn cứ vào tình hình hiện tại, cả hai bên đều không ai nhượng bộ thêm nữa, thì kết thúc xung đột ngay tại đây là hành động hợp lý nhất rồi."
 action.39.desc.ss:2 "Nếu hai bên còn tiếp tục tấn công lẫn nhau, sẽ dẫn đến sự mất cân bằng không thể điều hòa. Nếu ký kết hiệp ước hòa bình, thì có thể duy trì được sự cân bằng lâu dài về mặt tinh thần."
 action.39.desc.hc:3 "Nhân dân [This.GetAdj] đồng thuận kết thúc cuộc chiến tranh này, có hiệu lực ngay lập tức."
 action.39.desc.hg:1 "Hiện tại, chúng ta hoàn toàn có thể chung sống hòa bình. Nhưng nếu các người xâm phạm thánh địa, thì tương lai của các người sẽ chẳng bao giờ còn hòa bình để mà nói nữa."
 action.39.desc.kk:2 "Chúng tôi sẽ không tiếp tục đòi hỏi các người thêm điều gì nữa, nhưng chúng tôi khẩn thiết cầu xin các người, xin hãy suy ngẫm về sự thông tuệ của chúng tôi, lại nghĩ xem nếu như phớt lờ đi sự thông tuệ đó thì hậu quả sẽ ra sao."
 action.39.desc.mi:2 "Các người đáng bị nghiền nát, nhưng điều này không đáng để chúng tôi phải lãng phí thời gian quý báu của mình. Xem ra nghị hòa là điều không thể tránh khỏi rồi."
 action.39.desc.eo:1 "Chúng ta đã lún quá sâu vào vũng lầy chiến tranh. Cứ coi như chưa có chuyện gì xảy ra đi, đồng thời cũng hy vọng những chuyện như vậy sẽ vĩnh viễn không bao giờ lặp lại nữa."
 action.39.desc.fme:0 "Quy trình trừng phạt bị gián đoạn. Chấm dứt giao thức tự vệ."
 action.39.desc.bme:0 "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.39.desc.mh:1 "Không chân thực."
 action.39.desc.feh: "Đúng thế. Chúng ta phải quay về với sự bình thường. Thay đổi... thay đổi vốn không phải là một điều tốt. Chúng ta không hề muốn phá vỡ sự cân bằng."
 action.39.desc.aew: "Gây ấn tượng sâu sắc đấy. Nếu sinh ra trong thời đại của chúng tôi, các người chắc chắn sẽ có những màn thể hiện cực kỳ xuất sắc. Biết đâu các người có thể giữ được Shalash, chứ không đến nỗi thất bại thảm hại như những kẻ khác. Hôm khác chúng ta lại chiến tiếp!"
 action.39.desc.aec: "Chúng tôi không có thời gian để chơi trò gia đình với các người, dải ngân hà cần sự dẫn dắt của chúng tôi. Đừng có ngáng đường chúng tôi nữa."
 action.39.desc.aeg: "Không có thời gian lãng phí với các người nữa, dải ngân hà đang cần chúng tôi dẫn lối. Đừng cản đường chúng tôi nữa."

 action.41.name:0 "Chỉnh Đốn Lực Lượng"
 action.41.desc.a:0 "Khi bạn điều động hạm đội tiến vào lãnh thổ mới của kẻ thù, thì cuộc chiến tranh §Y[From.GetName]§! đã nổ ra."
 action.41.desc.b:0 "Hạm đội [From.GetNumPlayerFleetsGoneMIA] đã mất tích trong lúc làm nhiệm vụ, họ sẽ tập hợp lại bên trong lãnh thổ của quân ta."
 action.41.desc.b.1:0 "Một hạm đội đã mất tích trong lúc làm nhiệm vụ, họ sẽ tập hợp lại bên trong lãnh thổ của quân ta."
 action.41.desc.c:0 "Trạm lỗ sâu [From.GetNumPlayerWormholeStationsDestroyed] đã bị phá hủy."
 action.41.desc.c.1:0 "Một trạm lỗ sâu đã bị phá hủy."

 ####################################
 # Anomaly Categories
 ####################################
 crashed_ship_asteroid_category:0 "Phi Thuyền Rơi"
 crashed_ship_asteroid_category_desc:0 "Một chiếc phi thuyền nào đó đã đâm sầm xuống bề mặt của tiểu hành tinh này. Vẫn có thể tìm thấy mảnh vỡ của cỗ máy bay nằm lại trong hố va chạm."
 origin_asteroid_category:0 "Nguồn Gốc Bí Ẩn"
 origin_asteroid_category_desc:0 "Thành phần cấu tạo của tiểu hành tinh này hoàn toàn khác biệt so với các tiểu hành tinh xung quanh nó. Rất có thể nguồn gốc của nó chẳng hề giống với các tiểu hành tinh khác nằm trong vành đai, nên tiến hành nghiên cứu sâu hơn về nó."
 debris_asteroid_category:0 "Bị Vùi Lấp Dưới Mảnh Vỡ"
 debris_asteroid_category_desc:0 "Bề mặt của tiểu hành tinh này rải rác các mảnh vụn kim loại. Hầu hết những mảnh vỡ này có vẻ thuộc về rất nhiều phi thuyền khác nhau."
 emissions_asteroid_category:0 "Bức Xạ Năng Lượng"
 emissions_asteroid_category_desc:0 "Luồng bức xạ năng lượng mạnh mẽ phát ra từ một nguồn chưa xác định khiến tiểu hành tinh này trở nên nổi bần bật giữa đám đồng loại của nó."
 hatch_asteroid_category:0 "Khoang Nối Ghép"
 hatch_asteroid_category_desc:0 "Một cái khoang nối ghép dẫn vào phần lõi của tiểu hành tinh này nằm lọt thỏm trong một cái hố nhỏ trên bề mặt nó. Cửa khoang dường như đã từng bị hàn kín, nhưng sau đó đã bị các vi thiên thạch đập tung ra."
 collision_asteroid_category:0 "Tiểu Hành Tinh Va Chạm"
 collision_asteroid_category_desc:0 "Gần đây, tiểu hành tinh này đã bị một hành tinh trong vành đai tiểu hành tinh húc phải. Trên bề mặt nó đã in lại một cái hố va chạm khổng lồ, đồng thời quỹ đạo cũng bị chệch đi."
 station_asteroid_category:0 "Trạm Không Gian Bị Bỏ Hoang"
 station_asteroid_category_desc:0 "Một trạm không gian cỡ nhỏ đang di chuyển trên quỹ đạo của tiểu hành tinh này. Dường như đã bị bỏ hoang."
 life_asteroid_category:0 "Dấu Hiệu Sự Sống"
 life_asteroid_category_desc:0 "Chúng ta bắt được một loại dấu hiệu sinh tồn nào đó bên trong tiểu hành tinh này. Khuyến nghị nên điều tra thật cặn kẽ."
 object_gasgiant_category:0 "Vật Thể Trong Khí Quyển"
 object_gasgiant_category_desc:0 "Sóng dội của cảm biến cho thấy có một vật thể lạ nằm bên trong bầu khí quyển của hành tinh khí khổng lồ này."
 moon_gasgiant_category:0 "Vệ Tinh Tiềm Năng"
 moon_gasgiant_category_desc:0 "Một vệ tinh cỡ nhỏ đang quay quanh hành tinh khí khổng lồ này, vệ tinh nhỏ bé này có thể đang cất giấu một lượng lớn quặng mỏ. Cần phải tiến hành một cuộc điều tra toàn diện, nhằm xem xét tính khả thi của các hoạt động khai thác."
 life_gasgiant_category:0 "Dấu Hiệu Sự Sống"
 life_gasgiant_category_desc:0 "Bên trong tầng khí quyển của hành tinh khí khổng lồ này đã phát hiện được những dấu hiệu của sự sống. Điều này có chứng minh cho việc ở đó có tồn tại sinh quyển hay không?"
 storms_gasgiant_category:0 "Bão Khí Quyển"
 storms_gasgiant_category_desc:0 "Có thể quan sát thấy những trận cuồng phong đang hoành hành ở tầng khí quyển thượng lưu của hành tinh khí khổng lồ này. Việc tiến hành nghiên cứu sâu rộng về nó có lẽ mang lại giá trị rất cao."
 aerostat_gasgiant_category:0 "Cấu Trúc Tàu Bay"
 aerostat_gasgiant_category_desc:0 "Một loại cấu trúc bí ẩn nào đó đang lơ lửng trong tầng khí quyển thượng lưu của hành tinh khí khổng lồ này. Dường như nó đã áp dụng nguyên lý khí tĩnh học để duy trì trạng thái lơ lửng."
 cargo_gasgiant_category:0 "Khoang Hàng"
 cargo_gasgiant_category_desc:0 "Có một khoang chở hàng cỡ nhỏ bị bỏ lại ở vùng không gian phía trên của hành tinh khí khổng lồ này. Nó đã bị lực hấp dẫn của hành tinh tóm lấy, cuối cùng sẽ bị kéo tụt vào bên trong bầu khí quyển của hành tinh."
 debris_gasgiant_category:0 "Mảnh Vỡ Không Gian"
 debris_gasgiant_category_desc:0 "Xung quanh hành tinh khí khổng lồ này có tồn tại một lượng lớn mảnh vỡ. Đa số xuất phát từ các xác tàu vũ trụ với đủ mọi kích cỡ khác nhau."
 impact_uninhabitable_category:0 "Cú Va Chạm Kinh Hoàng"
 impact_uninhabitable_category_desc:1 "Một hố va chạm siêu to khổng lồ chứng minh rằng từng có một vật thể cực lớn đâm sầm xuống bề mặt của [Root.GetPlanetMoon]."
 energy_uninhabitable_category:0 "Chỉ Số Năng Lượng Dị Thường"
 energy_uninhabitable_category_desc:1 "Trong một khoảng thời gian ngắn, chúng ta đã tiếp nhận được những chỉ số năng lượng cực kỳ bất thường, nguồn phát ra từ [Root.GetPlanetMoon]. Có thể là do hệ thống của chúng ta bị lỗi, cũng có thể là điềm báo chúng ta vừa phát hiện ra một thứ gì đó vô cùng động trời."
 signal_uninhabitable_category:0 "Tín Hiệu Yếu Ớt"
 signal_uninhabitable_category_desc:0 "Trong quá trình điều tra [Root.GetPlanetMoon], chúng ta tình cờ bắt được một tín hiệu ngoài hành tinh mờ nhạt. Nguồn phát dường như là một vật phẩm nhỏ bé trên quỹ đạo. Tín hiệu không chứa bất kỳ thông điệp nào - lẽ nào là thiết bị phát tín hiệu báo nguy?"
 asteroid_uninhabitable_category:0 "Tiểu Hành Tinh Quỹ Đạo"
 asteroid_uninhabitable_category_desc:0 "Một tiểu hành tinh cấp 12 đang chuyển động quanh quỹ đạo của [Root.GetPlanetMoon]. Quỹ đạo của tiểu hành tinh này quá ổn định, thật khó tin là nó được hình thành tự nhiên."
 solar_uninhabitable_category:0 "Buồm Mặt Trời"
 solar_uninhabitable_category_desc:0 "Một phi thuyền bị bỏ hoang đang lơ lửng trôi dạt không mục đích trên không trung [Root.GetPlanetMoon]. Những cánh buồm đồ sộ vươn cao trên thân tàu, điều này cho thấy động lực của nó là năng lượng mặt trời."
 life_toxic_category:0 "Dấu Hiệu Sự Sống"
 life_toxic_category_desc:0 "Mặc dù bầu khí quyển của [Root.GetPlanetMoon] chứa các thành phần kịch độc và áp suất cực cao, nhưng chúng ta vẫn có thể phát hiện ra những dấu hiệu sinh tồn mãnh liệt."
 life_frozen_category:0 "Dấu Hiệu Sự Sống"
 life_frozen_category_desc:0 "Mới thoạt nhìn, [Root.GetPlanetMoon] dường như không thể nào hỗ trợ sự sống tồn tại, nhưng chúng ta đã phát hiện ra các tín hiệu sống phát ra từ sâu bên dưới bề mặt đóng băng."
 life_barren_category:0 "Dấu Hiệu Sự Sống"
 life_barren_category_desc:0 "Chúng ta đã phát hiện thấy những dấu hiệu của sự sống bên dưới vùng đất hoang vu cằn cỗi của [Root.GetPlanetMoon]. Rốt cuộc là loại sinh vật hữu cơ nào mới có khả năng sinh tồn ở bên trong đó cơ chứ?"
 station_uninhabitable_category:0 "Trạm Không Gian"
 station_uninhabitable_category_desc:0 "Trong lúc tiến hành khảo sát [Root.GetPlanetMoon], một trạm không gian cỡ nhỏ gần đó đã vận hành động cơ đẩy quỹ đạo nhằm mưu toan né tránh tàu khoa học của chúng ta, nhưng đã thất bại. Tại sao bọn họ lại phải lẩn trốn chứ?"
 battle_uninhabitable_category:0 "Dấu Vết Chiến Tranh"
 battle_uninhabitable_category_desc:0 "Trên quỹ đạo của [Root.GetPlanetMoon] đang tồn đọng một lượng lớn xác phi thuyền. Khả năng cao đây là tàn tích bị bỏ lại của một cuộc chiến quy mô hạm đội siêu lớn."
 shipyard_uninhabitable_category:0 "Xưởng Tàu Cổ Đại"
 shipyard_uninhabitable_category_desc:0 "Phía trên vùng trời thế giới này đang lơ lửng một xưởng tàu quỹ đạo cổ đại im lìm. Nó đã bị tàn phá nặng nề trong chiến tranh, khuyết mất rất nhiều bộ phận."
 inhabited_toxic_category:0 "Dấu Tích Thuộc Địa Của Người Xưa"
 inhabited_toxic_category_desc:0 "Thế giới hoang vu này dường như từng là nơi cư ngụ của một nền văn minh chưa vươn ra không gian. Tàn tích các thành phố của họ vẫn rải rác khắp bề mặt hành tinh."
 writing_uninhabitable_category:0 "Ký tự trên bề mặt"
 writing_uninhabitable_category_desc:0 "Có những vết nứt khổng lồ trên bề mặt hành tinh này, nhìn từ hoa văn thì không thể nào là hình thành tự nhiên. Nhìn từ quỹ đạo, những vết nứt này trông giống như các ký tự."
 beacon_uninhabitable_category:0 "Tín hiệu trên bề mặt"
 beacon_uninhabitable_category_desc:0 "Chúng tôi phát hiện một tín hiệu yếu trên bề mặt [Root.GetPlanetMoon]. Nguồn tín hiệu có vẻ là một loại thiết bị phát sóng định vị."
 mountain_uninhabitable_category:0 "Dãy núi có nguồn gốc kỳ lạ"
 mountain_uninhabitable_category_desc:1 "Trong lúc nỗ lực lập bản đồ bề mặt [Root.GetPlanetMoon] này, chúng tôi phát hiện một dãy núi kỳ lạ ở bán cầu nam. Nó trông không giống như được hình thành từ quá trình tự nhiên."
 object_uninhabitable_category:0 "Vật thể không xác định"
 object_uninhabitable_category_desc:0 "Một vật thể hình chữ nhật nhỏ trên bề mặt [Root.GetPlanetMoon] phản chiếu mọi tia dò tìm giống như một tấm gương. Các máy dò của chúng tôi không thể xác định được thành phần cấu tạo của nó."
 signal_gasgiant_category:0 "Tín hiệu hành tinh khí khổng lồ"
 signal_gasgiant_category_desc:0 "Chúng tôi nhận được một tín hiệu yếu phát ra từ bên trong bầu khí quyển của hành tinh khí khổng lồ này. Có thể ai đó, hoặc thứ gì đó đang cố gắng thiết lập liên lạc?"
 ship_gasgiant_category:0 "Tàu vũ trụ hành tinh khí khổng lồ"
 ship_gasgiant_category_desc:0 "Cảm biến cho thấy chúng tôi đã quét được một con tàu vũ trụ cỡ trung bình trong một khoảng thời gian ngắn ở thượng tầng khí quyển của hành tinh khí khổng lồ này."
 terminal_gasgiant_category:0 "Quỹ đạo chết"
 terminal_gasgiant_category_desc:0 "Một vệ tinh nhỏ quay quanh hành tinh khí khổng lồ này dường như sắp đâm sầm vào nó."
 vultaum_asteroid_category:1 "Dấu vết hoạt động của Người đi trước"
 vultaum_asteroid_category_desc:1 "Trên tiểu hành tinh này có dấu vết hoạt động của nền văn minh Người đi trước thời cổ đại."
 vultaum_gasgiant_category:1 "Dấu vết hoạt động của Người đi trước"
 vultaum_gasgiant_category_desc:1 "Gần hành tinh khí khổng lồ này có dấu vết hoạt động của nền văn minh Người đi trước thời cổ đại."
 vultaum_uninhabitable_category:1 "Dấu vết hoạt động của Người đi trước"
 vultaum_uninhabitable_category_desc:1 "Trên tảng đá khổng lồ hoang vắng này có dấu vết hoạt động của nền văn minh Người đi trước thời cổ đại."
 vultaum_habitable_category:1 "Dấu vết hoạt động của Người đi trước"
 vultaum_habitable_category_desc:1 "Trên hành tinh có thể sinh sống được này có dấu vết hoạt động của nền văn minh Người đi trước thời cổ đại."
 yuht_asteroid_category:1 "Dấu vết hoạt động của Người đi trước"
 yuht_asteroid_category_desc:1 "Trên tiểu hành tinh này có dấu vết hoạt động của nền văn minh Người đi trước thời cổ đại."
