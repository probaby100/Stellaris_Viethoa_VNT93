 fractured_ambassadors_modifier_desc: "Tập thể phản chiếu mà chúng ta chạm trán bên kia các mặt phẳng tinh giới sở hữu một tâm thức phân rã, nhưng đã đề nghị hỗ trợ chúng ta trong các cuộc đàm phán với những dạng sống tương tự khác."
 fractured_ambassadors_modifier_tt: "§G+20§! Điểm Hài Lòng Ngoại Giao đối với các đế chế không phải Gestalt"
 triggered_opinion_fractured_ambassadors: "$fractured_ambassadors_modifier$"
 triggered_opinion_fractured_ambassadors_desc: "$fractured_ambassadors_modifier_desc$"

 astral_rift.1600.name: "Qua Tấm Gương"
 astral_rift.1600.desc.1: "Bên kia khe nứt, chúng ta đã phát hiện một cấu trúc tương tự như một trong các căn cứ ngôi sao của chính chúng ta. Ngay khi §Y$tech_rift_sphere$§! của chúng ta tiếp cận, chúng ta đã nhận được lời chào bằng nhiều ngôn ngữ và trên nhiều tần số khác nhau. Thật đáng kinh ngạc, một trong những ngôn ngữ đó chính là tiếng nói của chúng ta.\n\nNhững người tiếp đón chúng ta cũng bàng hoàng không kém khi bắt gặp những sinh vật ngoài hành tinh nói chính ngôn ngữ của họ. Nhưng sau một cuộc trao đổi xã giao ngắn, chúng ta biết được rằng khu vực này là quê hương của một nền văn minh du hành vũ trụ rất giống chúng ta. Họ tự gọi mình là [mirrored_empire.GetName]."
 astral_rift.1600.desc.2: "Những người này là một sự pha trộn đáng lo ngại giữa quen thuộc và xa lạ. Có thể hợp tác với họ, nhưng liệu chúng ta có thể tin tưởng những bản sao song trùng này?"
 astral_rift.1600.desc.authoritarian: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta hiểu rằng nhu cầu của xã hội vượt trên nhu cầu của cá nhân, họ lại để cho quần chúng ích kỷ đi theo con đường hỗn loạn.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.egalitarian: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta biết rằng bình đẳng xã hội là nền tảng của một xã hội thịnh vượng, họ lại cho phép nhà nước kiểm soát cuộc sống của người dân.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.materialist: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta đã rũ bỏ sự mê tín, họ vẫn bám víu vào hệ thống tín ngưỡng ngây thơ của mình.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.spiritualist: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta nhìn thấu thế giới vật chất này, họ vẫn bị giam hãm trong ảo tưởng.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.militarist: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta thấu hiểu giá trị của lòng dũng cảm và kỷ luật, họ lại coi tinh thần thượng võ là lỗi thời.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.pacifist: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta đã vượt lên trên chiến tranh, họ vẫn bám víu vào các nguyên tắc hủy diệt của quyền tối cao quân sự.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.xenophile: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta tìm kiếm sự hợp tác, họ lại tự cô lập mình khỏi phần còn lại của thiên hà.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.xenophobe: "$astral_rift.1600.desc.1$ Họ chia sẻ nhiều lý tưởng với chúng ta, nhưng trong khi chúng ta đặt nhân dân của mình lên hàng đầu, họ lại đón nhận các nền văn minh ngoại lai với sự ngây thơ đến đáng kinh ngạc.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.gestalt: "Ngay khi §Y$tech_rift_sphere$§! của chúng ta đến căn cứ ngôi sao, chúng ta đã được chào đón bằng nhiều ngôn ngữ và trên nhiều tần số.\n\nChủ sở hữu của trạm đã dịch thành công ngôn ngữ của chúng ta với tốc độ đáng kinh ngạc và chào mừng chúng ta lên trạm để trao đổi thông tin.\n\nKể từ đó, chúng ta phát hiện ra rằng khu vực này là quê hương của một nền văn minh chủ yếu gồm [mirrored_empire.GetSpeciesNamePlural] tự xưng là [mirrored_empire.GetName]."
 astral_rift.1600.a: "Nghiên cứu nhân dân của họ."
 astral_rift.1600.b: "Nghiên cứu hạm đội của họ."

 astral_rift.1605.name: "Bài Học Lịch Sử"
 astral_rift.1605.desc.1: "Chúng ta đã dành tháng vừa qua để trao đổi văn hóa với [mirrored_empire.GetName].\nLịch sử của họ phản chiếu lịch sử của chúng ta cho đến một thời gian ngắn trước khi công nghệ FTL được phát hiện, khi họ chạm trán một con tàu ngoài hành tinh vô danh với sức mạnh khôn lường. Con tàu tiếp tục hành trình mà không bao giờ để lộ mục đích của nó, nhưng chuyến viếng thăm ngắn ngủi đó đã làm rung chuyển xã hội của họ đến tận gốc rễ."
 astral_rift.1605.desc.2: "Chúng ta thấy rõ rằng họ đã đưa ra lựa chọn sai lầm, nhưng điều này đặt ra một câu hỏi thú vị. Liệu xã hội của chúng ta có đi vào con đường lầm lạc nếu điều tương tự xảy ra với chúng ta quá sớm như vậy không?\n\nThật không may cho họ khi sự kiện này lại diễn ra trong giai đoạn tiền FTL đầy nhạy cảm trong lịch sử của họ. Việc thay đổi các đạo đức nền tảng chắc chắn đã làm chậm bước tiến của đế chế họ."
 astral_rift.1605.desc.gestalt: "$astral_rift.1605.desc.1$\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.authoritarian: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước những vị khách có trình độ công nghệ tiên tiến này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa bình đẳng.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.egalitarian: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước phi thuyền này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa độc tài khi họ tìm cách chuẩn bị đối phó với bất kỳ cuộc chạm trán nào tiếp theo.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.materialist: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước phi thuyền này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa tâm linh.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.spiritualist: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước phi thuyền này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa duy vật.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.militarist: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước phi thuyền này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa hòa bình khi họ tìm kiếm một giải pháp ôn hòa cho mọi cuộc chạm trán tiếp theo.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.pacifist: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước phi thuyền này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa quân phiệt khi họ tìm cách chuẩn bị đối phó với bất kỳ cuộc chạm trán nào tiếp theo.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.xenophile: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước phi thuyền này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa bài ngoại khi họ tìm cách chuẩn bị đối phó với bất kỳ cuộc chạm trán nào tiếp theo.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.xenophobe: "$astral_rift.1605.desc.1$ Chứng kiến bản thân bất lực đến nhường nào trước phi thuyền này đã dẫn đến một cuộc đảo lộn trong hệ tư tưởng của họ và một bước chuyển dịch sang chủ nghĩa thân ngoại khi họ tìm kiếm một giải pháp ôn hòa cho mọi cuộc chạm trán tiếp theo.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.a: "Thật bất hạnh cho họ."

 astral_rift.1610.name: "Nghiên Cứu Hạm Đội Của Họ"
 astral_rift.1610.desc.common: "Dù bề ngoài tham gia các hoạt động trao đổi thông tin văn hóa với [mirrored_empire.GetName], sau bức màn hậu trường chúng ta đã âm thầm điều tra năng lực quân sự của họ.\n\nMáy tính của [mirrored_empire.GetName] sử dụng hệ thống mã hóa tương tự như của chúng ta, điều này khiến việc thâm nhập vào cơ sở dữ liệu của họ cực kỳ dễ dàng.\n\nCông nghệ quân sự của nền văn minh này tương tự như của chúng ta, nhưng có đủ sự khác biệt để sơ đồ các chiến hạm của họ chứng tỏ sự hấp dẫn đối với các kỹ sư của chúng ta."
 astral_rift.1610.desc.gestalt: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng họ. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.authoritarian: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đón nhận sự bình đẳng một cách ngây thơ như vậy. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.egalitarian: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đi theo chủ nghĩa độc tài. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.materialist: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đi theo chủ nghĩa tâm linh. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.spiritualist: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đi theo chủ nghĩa duy vật. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.militarist: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đi theo chủ nghĩa hòa bình. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.pacifist: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đi theo chủ nghĩa quân phiệt. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.xenophile: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đi theo chủ nghĩa bài ngoại. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.xenophobe: "Dù có nhiều điểm tương đồng, thật khó để tin tưởng những kẻ đi theo chủ nghĩa thân ngoại. $astral_rift.1610.desc.common$"
 astral_rift.1610.a: "Xuất sắc."

 astral_rift.1611.name: "Tâm Trí Phân Rã"
 astral_rift.1611.desc: "Chúng ta đã dành tuần vừa qua để trao đổi văn hóa với [mirrored_empire.GetName].\n\nSự hứng thú của chúng ta nhanh chóng biến thành nỗi báo động khi chúng ta phát hiện ra rằng những sinh vật này chính là tàn tích của một ý thức tập thể bị phá vỡ. Tại một thời điểm nào đó trong quá trình phát triển của nền văn minh của họ, tâm trí họ đã bị đầu độc bởi khái niệm cá nhân. Tự phân đoạn có chủ đích theo thời gian, cuối cùng mỗi cá thể bắt đầu không nghe thấy tư tưởng nào khác ngoài suy nghĩ của chính mình."
 astral_rift.1615.name: "Cơ Hội Ngoại Giao"
 astral_rift.1615.desc.common: "Có vẻ như sự hiện diện của chúng ta trên trạm không gian đã được báo cáo lên cấp chỉ huy cao nhất của họ. Một sứ giả của [mirrored_empire.GetName] đã được phái đến căn cứ ngôi sao để thảo luận về tương lai của hai dân tộc chúng ta."
 astral_rift.1615.desc.common.2: "Chúng ta muốn phản hồi ra sao?"
 astral_rift.1615.desc.xenophobe: "$astral_rift.1615.desc.common$\n\nDù không ưa thích chúng ta, nhưng họ hiểu chúng ta. Họ lập luận rằng một thỏa thuận giữa hai dân tộc chúng ta sẽ mang lại lợi ích cho cả hai bên.\n\n$astral_rift.1615.desc.common.2$"
 astral_rift.1615.desc.common.gestalt: "$astral_rift.1615.desc.common$\n\nHọ đã nhiệt tình lập luận rằng những điểm tương đồng của chúng ta vượt xa những khác biệt. Họ cho rằng một thỏa thuận giữa hai dân tộc chúng ta sẽ mang lại lợi ích cho cả đôi bên."
 astral_rift.1615.desc.gestalt: "$astral_rift.1615.desc.common.gestalt$\n\nĐúng là chúng ta cùng chia sẻ một di sản độc nhất vô nhị. $astral_rift.1615.desc.common.2$"
 astral_rift.1615.desc.common.default: "$astral_rift.1615.desc.common$\n\nHọ đã nhiệt tình lập luận rằng chúng ta thực chất là một dân tộc duy nhất, chỉ khác nhau mỗi cái tên."
 astral_rift.1615.desc.default: "$astral_rift.1615.desc.common.default$ Chắc chắn rằng trong một thiên hà đầy rẫy những thế lực chưa biết, tình hữu nghị giữa chúng ta sẽ mang lại lợi ích cho cả hai bên.\n\n$astral_rift.1615.desc.common.2$"
 astral_rift.1615.a: "Chào đón tình hữu nghị giữa hai đế chế chúng ta."
 astral_rift.1615.b: "Khước từ đề nghị của họ."
 astral_rift.1615.c: "Chấp nhận cơ hội này."
 astral_rift.1615.d: "Điều này không làm chúng ta bận tâm."

 astral_rift.1616.name: "Đã Quá Đủ"
 astral_rift.1616.desc.common: "Trò hề này diễn ra chừng đó là đủ rồi. Chúng ta đã lấy đi những gì có thể từ họ và không có hứng thú với bất kỳ mối quan hệ ngoại giao nào khác xuyên các chiều không gian."
 astral_rift.1616.desc.gestalt: "$astral_rift.1615.desc.common.gestalt$\n\n$astral_rift.1616.desc.common$"
 astral_rift.1616.desc.default: "$astral_rift.1615.desc.common.default$\n\n$astral_rift.1616.desc.common$"
 astral_rift.1616.a: "$astral_rift.1615.b$"

 astral_rift.1620.name: "Tình Hữu Nghị Mới"
 astral_rift.1620.desc.common_1: "Chúng ta đã đưa ra phản hồi thuận lợi cho sứ giả.\n\nCông việc đang được tiến hành để thiết lập một lộ trình lâu dài hơn giữa hai vũ trụ của chúng ta."
 astral_rift.1620.desc.common_2: "Mặc dù chưa có gì được quyết định, sứ giả đã chỉ ra rằng [final_mirrored_empire.GetName] sẽ quan tâm đến các hiệp định thương mại."
 astral_rift.1620.desc.default: "$astral_rift.1620.desc.common_1$ $astral_rift.1620.desc.common_2$\n\nChúng ta mong muốn được hợp tác với một dân tộc mà chúng ta coi là anh em họ gần gũi."
 astral_rift.1620.desc.xeno: "$astral_rift.1620.desc.common_1$ $astral_rift.1620.desc.common_2$"
 astral_rift.1620.desc.gestalt: "$astral_rift.1620.desc.common_1$ Những tâm trí mất kết nối của họ, dù kém hiệu quả hơn, nhưng sẽ đóng vai trò phù hợp làm cầu nối liên lạc giữa chúng ta và các bầy đàn cá thể khác."

 astral_rift.1625.name: "Thù Địch"
 astral_rift.1625.desc.common: "Chúng ta đã đưa ra phản hồi tiêu cực cho sứ giả."
 astral_rift.1625.desc.default: "$astral_rift.1625.desc.common$\n\nDù [final_mirrored_empire.GetName] có nói bao nhiêu về những điểm tương đồng và một tương lai chung, họ đã quay lưng lại với những lý tưởng nền tảng tạo nên sự vĩ đại của nhân dân ta.\n\nSau khi bày tỏ quan điểm, chúng ta nhanh chóng quay trở lại §Y$tech_rift_sphere$§! của mình trước khi họ quyết định rằng quyền miễn trừ ngoại giao của chúng ta đã chạm đến giới hạn.\n\nMặc dù chúng ta không có kế hoạch duy trì liên lạc với những người này, việc nghiên cứu sự khác biệt giữa nền văn minh này và của chúng ta đã dạy cho chúng ta rất nhiều điều về chính bản thân mình."
 astral_rift.1625.desc.gestalt: "$astral_rift.1625.desc.common$\n\nDù họ có nói bao nhiêu về những điểm tương đồng, chúng ta không thể nghĩ ra điều gì ghê tởm hơn việc từ bỏ tập thể.\n\nSau khi làm rõ lập trường của mình, các [explorer.GetIndividualNamePlural] của chúng ta nhanh chóng quay trở lại §Y$tech_rift_sphere$§! trước khi tình hình chuyển biến nguy hiểm hơn."
 astral_rift.1625.desc.common.homicidal: "Họ thật may mắn khi nền văn minh của họ nằm quá xa ngoài tầm với của chúng ta."
 astral_rift.1625.desc.gestalt.homicidal: "$astral_rift.1625.desc.gestalt$\n\n$astral_rift.1625.desc.common.homicidal$"
 astral_rift.1625.desc.default.homicidal: "$astral_rift.1625.desc.gestalt$\n\n$astral_rift.1625.desc.common.homicidal$"

###############
# Lone Object #
###############
 astral_rift_tomb: "Vật Thể Đơn Độc"

 lone_object_swarm_unleashed: "Một bầy Hộ Vệ Lăng Mộ đã được thả ra nhắm vào chúng ta. Chúng bằng cách nào đó đã bám theo chúng ta qua khe nứt!"

 NAME_Grave_Guardian: "Hộ Vệ Lăng Mộ"
 NAME_Grave_Guardians: "Hộ Vệ Lăng Mộ"

 astral_rift.1700.name: "Bí Ẩn Trôi Nổi"
 astral_rift.1700.desc: "Ở đây không có các vì sao, không có thiên thể hành tinh nào. Chỉ có ánh sáng khuếch tán từ một nguồn bí ẩn chiếu sáng vật thể khổng lồ đang lờ mờ hiện ra trước mắt chúng ta.\n\nVật thể có hình dạng xấp xỉ chữ nhật và hoàn toàn tĩnh lặng - không có lượng phát xạ năng lượng hay liên lạc vô tuyến nào có thể phát hiện được.\n\nNhìn gần hơn, bề mặt được bao phủ bởi những ký tự tượng hình kỳ lạ."
 astral_rift.1700.a: "Cố gắng dịch các ký tự tượng hình."
 astral_rift.1700.b: "Quét toàn bộ chu vi của nó."

 astral_rift.1705.name: "Hàng Triệu Ký Tự"
 astral_rift.1705.desc: "Các ký tự tượng hình bao phủ vật thể to lớn này hầu hết là những biểu tượng hình ảnh.\n\nĐịnh tuổi bằng đồng vị cho thấy những hình chạm khắc sớm nhất có niên đại hàng ngàn năm trước những hình mới nhất. Nhờ tính chất miêu tả trực quan của các ký tự tượng hình, chúng ta nhanh chóng xác định được cấu trúc này được chế tạo làm đài tưởng niệm cho một bạo chúa vũ trụ cổ đại.\n\nCó vẻ như sau một chiến dịch bành trướng dài ngày, bạo chúa này đã gục ngã trong một cuộc thanh trừng đẫm máu. Phần còn lại của nền văn minh đã niêm phong thi hài của họ bên trong công trình nổi này."
 astral_rift.1705.a: "Quét toàn bộ chu vi của nó."
 astral_rift.1705.b: "Dùng thuốc nổ phá mở nó."

 astral_rift.1710.name: "Một Phong Ấn Cổ Đại"
 astral_rift.1710.desc: "Chúng ta đã hoàn thành một vòng quỹ đạo đầy đủ quanh vật thể.\n\nNó bao gồm hai nửa được hàn lại với nhau. Ở một số vị trí, các mối hàn đã bị ăn mòn nghiêm trọng - một hiện tượng khá bất ngờ trong môi trường chân không không có bầu khí quyển. Điều này cho thấy nguồn gốc của sự ăn mòn phải bắt nguồn từ bên trong cấu trúc.\n\nCảm biến đã phát hiện một vết nứt hẹp dọc theo một trong các mối hàn, đủ rộng để một thiết bị thăm dò tự hành có thể lọt qua."
 astral_rift.1710.a: "Cử một drone thăm dò chui qua khe nứt."
 astral_rift.1710.b: "Dùng thuốc nổ phá mở nó."

 astral_rift.1715.name: "Hành Lang Mù Mịt"
 astral_rift.1715.desc: "Drone của chúng ta đã truyền về một bản báo cáo từ bên trong vật thể.\n\nThật không may, hầu hết các gian phòng đều bị che khuất bởi những đám mây bụi carbon dày đặc, khiến việc di chuyển gặp nhiều khó khăn.\n\nPhân tích sơ bộ cho thấy một lượng lớn các sợi tinh giới đan xen với các hạt carbon. Nơi này là một kho báu chứa các sợi tinh giới quý giá, nhưng bụi carbon sẽ làm hỏng thiết bị quét tầm xa của chúng ta."
 astral_rift.1715.a: "Thu thập mẫu vật rồi quay về."
 astral_rift.1715.b: "Tiến hành phá hủy để thám hiểm."

 astral_rift.1720.name: "Đột Kích Lăng Mộ"
 astral_rift.1720.desc.outside: "Sử dụng lượng thuốc nổ khai quật tiêu chuẩn, chúng ta đã phá thành công một lỗ hổng đáng kể xuyên qua lớp vỏ ngoài của vật thể."
 astral_rift.1720.desc.drones: "Sử dụng lượng thuốc nổ khai quật tiêu chuẩn, chúng ta đã phá tung hành lang bên trong vật thể."
 astral_rift.1720.desc.common.1: "Bên trong chứa đầy các cổ vật có giá trị. Những bức tượng tinh xảo làm từ hợp kim quý hiếm đứng sừng sững xung quanh. Ở trung tâm gian phòng bên trong là một bộ xương tinh thể khổng lồ, vương miện trên trán được nạm những viên đá quý tuyệt đẹp."
 astral_rift.1720.desc.no_glyphs: "Hoàn toàn có thể khẳng định rằng toàn bộ cấu trúc này được xây dựng như một dạng lăng mộ."
 astral_rift.1720.desc.glyphs: "Như được ghi lại trên các ký tự bao phủ bên ngoài đài tưởng niệm này, tất cả các vật phẩm xung quanh bộ xương đều được đặt ở đây như cống vật. Dù là một kẻ chinh phục tàn nhẫn, nền văn minh mà họ bỏ lại rõ ràng đã hết mực tôn kính sinh thể này."
 astral_rift.1720.desc.psionic: "Mỗi viên đá quý gắn trên vương miện của họ đều đập nhịp với sự cộng hưởng tâm linh tiềm ẩn. Đây chắc chắn là cách người khổng lồ này giao tiếp với các sinh vật cộng sinh của mình. Chúng ta có thể học hỏi được rất nhiều từ những thiết bị này."
 astral_rift.1720.desc.common.2: "Mặc dù bộ xương quá lớn để có thể đưa ra khỏi khe nứt, chúng ta sẽ mang về những cổ vật có giá trị nhất."
 astral_rift.1720.desc.outside.no_glyphs: "$astral_rift.1720.desc.outside$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.no_glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.outside.glyphs: "$astral_rift.1720.desc.outside$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.outside.glyphs.psionic: "$astral_rift.1720.desc.outside$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.psionic$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.drones.no_glyphs: "$astral_rift.1720.desc.drones$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.no_glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.drones.glyphs: "$astral_rift.1720.desc.drones$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.drones.glyphs.psionic: "$astral_rift.1720.desc.drones$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.psionic$\n\n$astral_rift.1720.desc.common.2$"

 astral_rift.1725.name: "Hộ Vệ Lăng Mộ"
 astral_rift.1725.desc: "Vụ nổ có kiểm soát của chúng ta đã mở ra một khoang rỗng chưa từng được phát hiện trước đó. Ẩn giấu sau lớp niêm phong, không gian này rõ ràng được thiết kế để chống lại sự xâm nhập. Nó chứa đầy những thực thể thù địch.\n\nKhối Cầu lập tức thu hồi mỏ neo, nhưng nhiều hộ vệ đã thoát khỏi khe nứt cùng chúng ta và đang bám theo phía sau."
 astral_rift.1725.a: "Chúng ta có một rắc rối cần phải xử lý rồi."

#############
# Rockworms #
#############
 astral_rift_rockworms: "Giun Đá"

 decision_breed_rockworm_hive: "Tổ Giun Đá"
 decision_breed_rockworm_hive_desc: "Những con Giun Đá non thu hồi được từ bên kia Khe Nứt Tinh Giới có thể được huấn luyện cẩn thận để đào các đường hầm khai thác khoáng sản rộng lớn. Có thể xảy ra chuyện gì xấu được chứ?"
 d_rockworm_hive: "$decision_breed_rockworm_hive$"
 d_rockworm_hive_desc: "$decision_breed_rockworm_hive_desc$"
 can_breed_rockworm_hives_tt: "Mở khóa một §YQuyết Sách Thuộc Địa§! Tổ Giun Đá."

 astral_rift.1800.name: "Đá Bất Tận"
 astral_rift.1800.desc: "Một bình nguyên rộng lớn toàn đá vụn và sỏi trải dài trước mắt chúng ta. Phía trên là bầu trời nhợt nhạt và trống rỗng.\n\nKhông thể nhìn thấy bất kỳ hành tinh hay ngôi sao nào ở đây. Nơi này dường như không phải là một phần của một thiên hà hay bất kỳ hệ sao nào đã biết. Theo tầm quét cảm biến của chúng ta, địa hình này kéo dài vô tận theo mọi hướng. Bề mặt lồi lõm với những hố sâu lớn bằng các tiểu hành tinh.\n\nKhắp đường chân trời, hàng chục sinh vật khổng lồ giống như loài giun đang chui vọt lên khỏi mặt đất. Những cặp vây khỏe khoắn cho phép chúng lướt đi trong bầu khí quyển đậm đặc. Hẳn chúng phải có một dạng bầy đàn nào đó dưới lòng đất."
 astral_rift.1800.a: "Tiếp tục quan sát bề mặt."
 astral_rift.1800.b: "Thám hiểm các đường hầm."

 astral_rift.1805.name: "Sinh Vật Phù Du Trên Không"
 astral_rift.1805.desc: "Không chỉ có loài giun sinh sống ở đây.\n\nNhững bầy sinh vật vi sinh tạo thành những đám mây ở tầng khí quyển thấp. Di chuyển thành một khối thống nhất, chúng tạo ra các mô hình phức tạp trên bầu trời.\n\nKhi những con giun khổng lồ phóng lên từ các đường hầm, chúng lướt đi trên không trung, gặm nhấm giữa những đám mây sống động. Chúng ta đã quan sát thấy nhiều con giun phối hợp cùng nhau để dồn những đàn sinh vật này về phía nhau. Mức độ hợp tác của chúng khá tinh vi."
 astral_rift.1805.a: "Lấy mẫu các vi sinh vật."
 astral_rift.1805.b: "Khám phá đường hầm của lũ giun."

 astral_rift.1810.name: "Đường Hầm"
 astral_rift.1810.desc: "Bên dưới bề mặt là một mạng lưới hang động khổng lồ được kết nối bởi một hệ thống đường hầm phức tạp. Một số đường hầm đã bị sập một phần và dường như không còn được lũ giun sử dụng. Chúng ta đã điều khiển §Y$tech_rift_sphere$§! tiến vào khu vực yên tĩnh nhất.\n\nCác bức tường được bao phủ bởi một chất giống như mạng nhện giúp giữ chặt đá phiến và sỏi vụn. Chúng ta phỏng đoán đây là chất tiết ra từ lũ giun.\n\nHầu hết các hang động đều trống rỗng, nhưng một số có chứa các vũng nước đục ngầu. Bên trong một hang, chúng ta bắt gặp một ổ kén khoáng hóa lớn nửa chìm dưới làn nước."
 astral_rift.1810.a: "Thu hoạch những quả trứng."
 astral_rift.1810.b: "Tiếp tục tiến lên."

 astral_rift.1815.name: "Bị Nuốt Chửng"
 astral_rift.1815.desc.common.1: "Tình hình vẫn bình thường.\n\nTuy nhiên, chúng ta đã bị ăn thịt."
 astral_rift.1815.desc.common.2: "Chiếc §Y$tech_rift_sphere$§! của chúng ta hiện đang bị bọc kín trong hệ tiêu hóa của nó. Chúng ta không rõ đây là một hành vi hung hăng hay con giun chỉ đơn giản là đang ăn cỏ.\n\nDịch tiêu hóa do con giun tiết ra khá nhẹ, nhưng chúng ta không thể ở lại đây mãi mãi. Bằng cách kéo mỏ neo, chúng ta có thể tự ép mình thoát qua khe hở ở miệng con giun."
 astral_rift.1815.desc.common.gas: "Ngoài ra, phần bên trong của con giun có vẻ tương đối mềm và dễ bị tổn thương bởi một vụ nổ."

 astral_rift.1815.desc: "$astral_rift.1815.desc.common.1$\n\nTrong khi đang thu thập mẫu đám mây vi sinh vật, một con giun đang kiếm ăn đã nuốt trọn chúng ta.\n\n$astral_rift.1815.desc.common.2$"
 astral_rift.1815.desc.gas: "$astral_rift.1815.desc$\n\n$astral_rift.1815.desc.common.gas$"
 astral_rift.1815.a: "Đặt lượng thuốc nổ."
 astral_rift.1815.b: "Kéo mỏ neo khẩn cấp."

 astral_rift.1816.name: "$astral_rift.1815.name$"
 astral_rift.1816.desc.harvest: "$astral_rift.1815.desc.common.1$\n\nTrong khi chúng ta đang thu hoạch những quả trứng, một con giun đột ngột xuất hiện và nuốt trọn chúng ta.\n\n$astral_rift.1815.desc.common.2$"
 astral_rift.1816.desc.harvest.gas: "$astral_rift.1816.desc.harvest$\n\n$astral_rift.1815.desc.common.gas$"
 astral_rift.1816.desc.capture: "$astral_rift.1815.desc.common.1$\n\nTrong khi chúng ta đang bắt những con non của chúng, một con giun đột ngột xuất hiện và nuốt trọn chúng ta.\n\n$astral_rift.1815.desc.common.2$"
 astral_rift.1816.desc.capture.gas: "$astral_rift.1816.desc.capture$\n\n$astral_rift.1815.desc.common.gas$"
 astral_rift.1816.a: "$astral_rift.1815.a$"
 astral_rift.1816.b: "$astral_rift.1815.b$"

 astral_rift.1820.name: "Nhà Trẻ"
 astral_rift.1820.desc: "Chúng ta đã phát hiện một hồ nước nông sâu trong hệ thống đường hầm.\n\nCác bức tường đang ngọ nguậy. Những con non có kích thước bằng §Y$tech_rift_sphere$§! của chúng ta đang bận rộn gặm nhấm những chất mạng nhện kết nối các bức tường đá. Chuyển động của chúng có vẻ lờ đờ, bị làm chậm bởi độ ẩm trong không khí.\n\nNếu nhanh tay, chúng ta có thể bắt được một con mẫu vật sống."
 astral_rift.1820.a: "Bắt giữ một mẫu vật sống."
 astral_rift.1820.b: "Chúng ta đã thử vận may đủ rồi. Quay về ngay lập tức."
 astral_rift.1820.b.evopred: "Thu thập các mẫu vật rồi quay về."

 astral_rift.1825.name: "Kéo Thoát"
 astral_rift.1825.desc: "Dây cáp mỏ neo đã chứng tỏ là một sợi dây cứu sinh thực sự.\n\nNhư mồi câu trên một cần câu, chúng ta đã bị kéo giật ngược trở lại qua đường tiêu hóa của con giun.\n\nChúng ta đã thoát ra ngoài qua cái miệng há hốc của nó, đẩy các hàm răng của nó sang hai bên khi con tàu lao ra ngoài. Mặc dù con tàu bị hư hại nhẹ do dịch tiêu hóa, chiếc §Y$tech_rift_sphere$§! đã được phục hồi thành công."

 astral_rift.1830.name: "Bị Tiêu Hóa"
 astral_rift.1830.desc: "Chúng ta đã mất liên lạc với các [explorer.GetTeamMemberPlural] trên tàu §Y$tech_rift_sphere$§!.\n\nKhi thu hồi, chúng ta kéo về một đầu cáp bị đứt nham nhở, có dấu hiệu bị ăn mòn bởi các hóa chất mạnh.\n\nCác [explorer.GetTeamMemberPlural] của chúng ta đã không bao giờ trở về."

 astral_rift.1835.name: "Vỡ Bụng"
 astral_rift.1835.desc.common: "Vụ nổ đã thành công mỹ mãn.\n\nXác con giun rơi xuống bên dưới chúng ta thành một đống thịt đá và nội tạng rách nát."
 astral_rift.1835.desc.recover: "$astral_rift.1835.desc.common$\n\nChúng ta thấy mình đang ở trong một hang động chứa một ổ kén khoáng hóa lớn nửa chìm trong nước. Chúng ta có thể thu hồi một ổ trứng phong phú."
 astral_rift.1835.desc.capture: "$astral_rift.1835.desc.common$\n\nThoát khỏi mọi sự kìm kẹp, chúng ta đã có thể bắt được một vài con non để đưa trở lại qua khe nứt.\n\nChúng ta sẽ có thể huấn luyện những sinh vật dẻo dai này phục vụ cho đế chế của chúng ta."
 astral_rift.1835.desc.harvest: "$astral_rift.1835.desc.common$\n\nThoát khỏi mọi sự kìm kẹp, chúng ta đã có thể thu hồi một ổ trứng phong phú từ hồ nước trong hang động.\n\nĐược bảo vệ trong lớp vỏ tinh thể, chúng ta có thể ấp nở những sinh vật dẻo dai này phục vụ cho đế chế của chúng ta."
 astral_rift.1835.a: "Nghe có vẻ mạo hiểm đấy."
 astral_rift.1835.b.evopred: "Trước tiên hãy đập vỡ lớp vỏ. Sau đó quay về."

 astral_rift.1890.name: "Thoát Khỏi Bụng Thú Dữ"
 astral_rift.1890.desc: "[From.GetName] đã trở về từ bên kia Khe Nứt Tinh Giới, nhưng [From.GetHeShe] tàn tạ thê thảm.\n\nSau một năm nằm trong bụng Giun Đá, năng lực thể chất của [From.GetHisHer] đã trở nên vô cùng hạn chế. Dù sao đi nữa, chúng ta đã tiếp nhận [From.GetHimHer] trở lại hàng ngũ của mình."
 astral_rift.1890.a: "Thật... may mắn sao?"

##################
# Volcanic Plane #
##################
 restoring_the_balance_modifier: "Khôi Phục Cân Bằng"
 restoring_the_balance_tt: "Dân cư từ một trong các thuộc địa của chúng ta sẽ bị gửi trở lại Khe Nứt Tinh Giới $astral_rift_volcano$, trong nỗ lực khôi phục lại sự cân bằng mà chúng ta đã phá vỡ."
 obelisks_curse_modifier: "Lời Nguyền Của Đài Tưởng Niệm"
 obelisks_curse_machine_modifier: "$obelisks_curse_modifier$"
 leader_trait_obelisk_curse: "$obelisks_curse_modifier$"
 leader_trait_obelisk_curse_tt: "Miễn là nhà lãnh đạo này là một thành viên hội đồng, họ sẽ hiến tế một dân cư cho Đài Tưởng Niệm Đen mỗi năm."
 leader_trait_obelisk_curse_desc: "Là bề tôi của đài tưởng niệm đen, nhà lãnh đạo này tuyên bố tìm cách khôi phục lại sự cân bằng mà chúng ta đã phá vỡ."

 astral_rift_volcano: "Mặt Phẳng Núi Lửa"

 astral_rift.1900.name: "Cảnh Quan Rực Lửa"
 astral_rift.1900.desc: "Nhiệt độ ở đây cao đến mức khó tin. Nếu không có lá chắn nhiệt phòng ngừa, chúng ta hẳn đã bị thiêu rụi ngay lập tức.\n\nỞ phía xa, một đài tưởng niệm đen sừng sững trong tĩnh lặng. Một loạt các con kênh nhân tạo hội tụ về tượng đài khổng lồ này, dẫn các dòng dung nham chảy vào một hồ chứa nằm ở chân đế của nó.\n\nMột đàn sinh vật phát sáng kỳ lạ đang bay lượn xung quanh đài tưởng niệm."
 astral_rift.1900.a: "Thám hiểm các khu vực xung quanh."
 astral_rift.1900.b: "Bay thẳng về phía đài tưởng niệm."

 astral_rift.1905.name: "Bị Truy Đuổi"
 astral_rift.1905.desc: "Ở đây nguy hiểm hơn nhiều so với suy nghĩ ban đầu của chúng ta.\n\nNhững buồng giam nhỏ nằm dọc các bức tường nơi này, chứa đầy đủ loại sinh vật sống đa dạng. Khi nhìn thấy chúng ta, chúng lay giật các chấn song giam giữ và gào khóc bằng đủ thứ ngôn ngữ chưa từng biết. Thỉnh thoảng, chúng ta chứng kiến những sinh vật trôi nổi phình to tiến vào các hốc này và khuất phục các tù nhân bằng những cú sốc điện sinh học.\n\nThật không may, một trong những khối cầu trôi nổi này đã để mắt đến chúng ta và đang tiến lại gần chiếc §Y$tech_rift_sphere$§! của chúng ta. Ngay cả khi động cơ hoạt động hết công suất, nó vẫn đang từ từ rút ngắn khoảng cách. Những chiếc xúc tu dài lê thê kéo theo sau nó, phát sáng với một lượng điện tích cực mạnh.\n\nPhía dưới chúng ta, một dòng sông dung nham rộng lớn làm ngập lụt cảnh quan hắc diệu thạch. Lá chắn nhiệt mà chúng ta chuẩn bị sẽ cho phép chúng ta sống sót trong một thời gian ngắn dưới bề mặt của nó."
 astral_rift.1905.a: "Kéo mỏ neo khẩn cấp."
 astral_rift.1905.b: "Ẩn nấp trong dung nham."

 astral_rift.1910.name: "Bị Bắt Giữ"
 astral_rift.1910.desc: "Nỗ lực tránh né việc bị phát hiện của chúng ta đã không thành công. Khi chúng ta bay về phía đài tưởng niệm, một đàn nhỏ các sinh vật trôi nổi kỳ dị nhanh chóng đuổi kịp chúng ta.\n\nChúng ta hiện đang bị quấn chặt bởi các xúc tu phát sáng của chúng và bị kéo đi một cách thô bạo. Mọi nỗ lực giao tiếp với chúng đều vô hiệu.\n\nChúng đang kéo Khối Cầu về phía một cái hố rỗng ở chân đài tưởng niệm."
 astral_rift.1910.a: "Cố gắng trốn thoát."
 astral_rift.1910.b: "Quá nguy hiểm. Kéo mỏ neo khẩn cấp."

 astral_rift.1915.name: "Đài Tưởng Niệm Đen"
 astral_rift.1915.desc.common: "Lặng lẽ tiến về phía trước, chúng ta đã tiếp cận rất gần đài tưởng niệm khổng lồ.\n\nĐen như đá hắc diệu thạch, nó vươn thẳng lên tận trần của không gian núi lửa này. Dù có vẻ rất cổ xưa, bề mặt của nó lại hoàn toàn không một tì vết. Thứ ban đầu chúng ta tưởng là hoa văn trang trí thực chất là những dòng chữ khắc cực kỳ dày đặc bao phủ toàn bộ bề mặt."
 astral_rift.1915.desc.lava_hide: "Để lẩn tránh sự chú ý, chúng ta đã tự dìm mình xuống dòng sông dung nham nóng chảy bên dưới.\n\nLớp màng bảo vệ dự phòng của chúng ta cho phép chúng ta sống sót đủ lâu để bơi đi một đoạn, né tránh sự chú ý của các sinh vật trôi nổi.\n\n$astral_rift.1915.desc.common$"
 astral_rift.1915.desc.lava_escape: "Các sinh vật trôi nổi không ngờ tới động tác đột ngột của chúng ta.\n\nMột luồng đẩy cực mạnh từ động cơ đã giúp chúng ta giật đứt các xúc tu của chúng, lao thẳng xuống dòng sông dung nham bên dưới. Rõ ràng chúng chưa quen với việc con mồi phản ứng theo cách này.\n\nLớp màng bảo vệ dự phòng của chúng ta đã cho phép chúng ta lướt dưới dòng dung nham đủ lâu để thoát khỏi tầm mắt của chúng.\n\n$astral_rift.1915.desc.common$"
 astral_rift.1915.a: "Giải mã các cổ tự."
 astral_rift.1915.b: "Phá hủy đài tưởng niệm."

 astral_rift.1920.name: "Thu Hồi"
 astral_rift.1920.desc: "Chúng ta đã thu hồi dây cáp mỏ neo và thoát khỏi cảnh quan nguy hiểm này.\n\nNhiều sinh vật trôi nổi đã bị cuốn theo khi chúng ta kéo §Y$tech_rift_sphere$§! về, thậm chí một con còn bị kéo xuyên qua khe nứt vào chiều không gian của chúng ta trước khi bị hỏa lực trạm tiêu diệt."

 astral_rift.1925.name: "Những Cái Tên"
 astral_rift.1925.desc: "Đó là một danh sách các cái tên.\n\nHàng nghìn tỷ nghìn tỷ cái tên bao phủ đài tưởng niệm này. Chúng được sắp xếp theo một mô hình toán học phức tạp liên tục dịch chuyển và biến đổi ngay trước mắt chúng ta.\n\nMỗi mặt của đài tưởng niệm có các mô hình sắp xếp độc đáo, dường như ghi lại tên của các tù nhân ở các thời đại khác nhau. Đây là một nhà tù giam giữ linh hồn của vô số nền văn minh qua các thời kỳ."
 astral_rift.1925.a: "Đủ rồi. Kéo mỏ neo khẩn cấp."
 astral_rift.1925.b: "Phá hủy cỗ máy quái ác này."

 astral_rift.1930.name: "Đài Tưởng Niệm Vỡ Vụn"
 astral_rift.1930.desc: "Các khối thuốc nổ chúng ta đặt một cách chiến lược dọc theo các khớp nối của tòa tháp hắc diệu thạch đã thổi tung nó ra làm đôi.\n\nNửa trên của đài tưởng niệm từ từ trượt xuống, bóng tối bao trùm lấy toàn bộ hang động. Những sinh vật trôi nổi mà chúng ta ghi nhận trước đó bị mất đi ánh sáng, rơi xuống đất với những tiếng va đập nặng nề ướt át.\n\nCác cánh cửa của những buồng giam nhỏ dọc theo bức tường đồng loạt bật mở. Hàng đàn sinh vật từ những cái hốc này ùa vào hệ thống đường hầm gần nhất. Chúng ta không biết những đường hầm đó dẫn về đâu, nhưng ít nhất giờ đây chúng đã được tự do.\n\nCác mảnh vỡ của đài tưởng niệm có những đặc tính độc đáo và thú vị. Chúng ta đã mang càng nhiều mảnh vụn lên tàu càng tốt để phục vụ việc nghiên cứu sâu hơn."

 astral_rift.1935.name: "Thất Bại"
 astral_rift.1935.desc: "Chúng ta đã mất liên lạc với [Leader.GetName].\n\nKhi thu hồi §Y$tech_rift_sphere$§!, chúng ta phát hiện nó ngập tràn khói và tro tàn. Thi thể của [Explorer.GetCrew] không được tìm thấy.\n\nRất có khả năng họ đã vĩnh viễn biến mất bên kia khe nứt."

 astral_rift.1940.name: "Vị Khách Điềm Gở"
 astral_rift.1940.desc: "Một thực thể dung nham đang yêu cầu diện kiến chúng ta. Họ tự xưng là chủ nhân của đài tưởng niệm màu đen mà chúng ta đã phá hủy chính xác sáu năm trước."

 astral_rift.1941.desc: "Các ngươi không biết mình đã làm gì đâu.\n\nCác ngươi đã sai lầm khi giải thoát cho những kẻ bị chúng ta giam giữ. Cân bằng phải được khôi phục, nếu không hậu quả sẽ vô cùng khủng khiếp.\n\nMỗi năm, trong vòng sáu năm tới, các ngươi sẽ phải giao nộp cho chúng ta những tù nhân thay thế từ các thuộc địa của các ngươi. Chúng ta sẽ dành cho các ngươi một sự trao đổi công bằng đáp lại.\n\nNếu các ngươi từ chối, chúng ta sẽ rất vui lòng đày đọa nhân dân các ngươi cho đến khi nỗi thống khổ trọn vẹn."
 astral_rift.1941.a: "Được thôi. Hãy khôi phục sự Cân bằng."
 astral_rift.1941.b: "Biến đi."

 astral_rift.1950.name: "Nhà Khoa Học Trở Về"
 astral_rift.1950.desc: "[from.GetName] đã trở về từ Khe Nứt Tinh Giới $astral_rift_volcano$... nhưng không còn như những gì chúng ta nhớ về họ.\n\nCác mẫu phân tích carbon chỉ ra rằng tuổi của [from.GetHisHer] hiện đã hơn 600 tuổi."
 astral_rift.1950.a: "Giám sát chặt chẽ cá nhân này."

 astral_rift.1955.name: "Hiến Tế"
 astral_rift.1955.desc: "Chúng ta đã phát hiện một diễn biến đáng lo ngại.\n\n[from.GetName] đã bí mật gửi các thành viên trong dân số của chúng ta quay trở lại qua Khe Nứt Tinh Giới $astral_rift_volcano$.\n\nHọ tuyên bố điều này được thực hiện trong nỗ lực nhằm \"khôi phục lại sự cân bằng\"."
 astral_rift.1955.a: "Xử lý [from.GetHimHer]."
 astral_rift.1955.b: "Cho phép [from.GetHimHer] tiếp tục."

 MESSAGE_RESTORING_THE_BALANCE_SACRIFICE_TITLE: "$restoring_the_balance_modifier$"
 MESSAGE_RESTORING_THE_BALANCE_SACRIFICE_DESC: "Dân cư từ [event_target:sacrificed_pop_planet.GetName] đã bị đưa trở lại Khe Nứt Tinh Giới $astral_rift_volcano$, trong nỗ lực khôi phục lại sự cân bằng mà chúng ta đã phá vỡ."
 MESSAGE_RESTORING_THE_BALANCE_SACRIFICE_DESC_LEADER: "Dân cư từ [event_target:sacrificed_pop_planet.GetName] đã bị $LEADER|Y$ đưa trở lại Khe Nứt Tinh Giới $astral_rift_volcano$, trong nỗ lực khôi phục lại sự cân bằng."
