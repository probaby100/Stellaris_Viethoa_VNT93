 personality_mirrored_empire_default: "Đế Chế Gương Phản Chiếu"
 personality_mirrored_empire_default_desc: "Chúng ta đã chạm trán nền văn minh này ở bờ bên kia của Khe Nứt Tinh Giới. Là phiên bản của chính chúng ta từ một chiều không gian khác, họ là một ví dụ đáng báo động về những gì chúng ta có thể đã trở thành."
