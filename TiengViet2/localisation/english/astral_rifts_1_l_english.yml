 astral_rift.1560.name: "Lũ Lụt"
 astral_rift.1560.desc.default: "Nút bấm sai.\n\nBản ghi âm những lời cuối cùng của [Leader.GetName] chỉ ra rằng nút có bốn dấu chấm đã khiến căn phòng ngập trong một trận đại hồng thủy.\n\nNếu họ lặp lại về quá khứ một lần nữa, chúng ta sẽ có cơ hội thử nút còn lại."
 astral_rift.1560.desc.gestalt: "Nút bấm sai.\n\nNút có bốn dấu chấm đã khiến căn phòng ngập trong một trận lũ quét. Các [explorer.GetIndividualNamePlural] của chúng ta đã không còn nữa.\n\nNếu họ lặp lại về quá khứ một lần nữa, chúng ta sẽ có cơ hội thử nút còn lại."
 astral_rift.1560.desc.aquatic: "Nhấn nút có bốn dấu chấm khiến căn phòng tràn ngập một lượng nước khổng lồ. May mắn thay, do bản tính thủy sinh của [Leader.GetName], điều này hầu như không gây ra chút bất tiện nào. Họ dự định sẽ nhấn nút còn lại khi nước đã rút cạn hoàn toàn."
 astral_rift.1560.desc.aquatic_gestalt: "$astral_rift.1560.desc.aquatic$"
 astral_rift.1560.b: "$astral_rift.1545.b$"

 astral_rift.1565.name: "Tinh Thể Thời Gian"
 astral_rift.1565.desc.common: "Một bệ đỡ mang một tinh thể khổng lồ đã nhô lên khỏi mặt đất. Tất cả các cánh cửa trong khu phức hợp đều mở toang.\n\nCác máy đo thời gian dao động dữ dội giữa những giá trị cực đoan khi ở cự ly gần với tinh thể. Đây chắc chắn là nguồn gốc của các vòng lặp thời gian, và là mục đích cốt lõi của công trình này."
 astral_rift.1565.desc.default: "$astral_rift.1565.desc.common$\n\nNhững lựa chọn bên trong chuỗi thử thách phòng ốc này dường như hoàn toàn ngẫu nhiên. Có lẽ chúng được thiết kế để thử nghiệm khả năng truyền tải thông tin giữa các vòng lặp?\n\nDù thế nào đi nữa, việc sống sót qua nó cho phép chúng ta mang tinh thể rời đi. Khả năng tác động đến dòng chảy thời gian của nó có thể chứng tỏ là vô cùng hữu ích."
 astral_rift.1565.desc.latent_psionic: "$astral_rift.1555.desc.common$\n\nTrải nghiệm này đã thay đổi [Leader.GetName]. Có vẻ như trải nghiệm của [Leader.GetHisHer] trong các vòng lặp thời gian đã đánh thức tiềm năng tâm linh tiềm ẩn của [Leader.GetHisHer]!\n\nCó lẽ đây chính là mục đích tối hậu của khu phế tích, một chuỗi lựa chọn ngẫu nhiên chỉ có thể vượt qua bằng sức mạnh vượt trên thời gian, chẳng hạn như trực giác tâm linh.\n\nDù thế nào đi nữa, giờ đây chúng ta có thể an toàn rời đi cùng tinh thể. Khả năng tác động đến dòng chảy thời gian của nó có thể chứng tỏ là vô cùng hữu ích."
 astral_rift.1565.desc.latent_psionic_robot: "$astral_rift.1555.desc.common$\n\nViệc tiếp xúc với các vòng lặp thời gian này đã đánh thức các đơn vị xử lý tâm linh đang ngủ say bên trong [Leader.GetName], môi trường này đã cung cấp một bãi thử vững chắc để đưa những quyền năng này vào hoạt động.\n\nKhông rõ liệu đây có phải là mục đích ban đầu của khu phế tích này hay không. Bất luận thế nào, giờ đây chúng ta có thể an toàn mang tinh thể rời đi để phân tích niên đại sâu hơn."
 astral_rift.1565.desc.psionic: "$astral_rift.1565.desc.common$\n\nTrong suốt những vòng lặp này, trực giác của [Leader.GetName] đã giúp [Leader.GetHimHer] đưa ra những lựa chọn chính xác.\n\nCó lẽ đây chính là mấu chốt của các gian phòng này, một chuỗi lựa chọn ngẫu nhiên được thiết kế để khai mở tiềm năng tâm linh.\n\nDù sao đi nữa, giờ đây chúng ta có thể an toàn rời đi cùng tinh thể. Khả năng tác động đến dòng chảy thời gian của nó có thể chứng tỏ là vô cùng hữu ích."
 astral_rift.1565.desc.psionic_robot: "$astral_rift.1565.desc.common$\n\nTrong suốt những vòng lặp này, các bộ xử lý tâm linh của [Leader.GetName] đã dẫn dắt họ đến kết quả tối ưu.\n\nCó lẽ đây chính là mấu chốt của các gian phòng này, một chuỗi lựa chọn ngẫu nhiên được thiết kế để khai mở tiềm năng tâm linh.\n\nBất luận thế nào, giờ đây chúng ta có thể an toàn mang tinh thể rời đi để phân tích niên đại sâu hơn."
 astral_rift.1565.a: "Thật là nhẹ nhàng."

