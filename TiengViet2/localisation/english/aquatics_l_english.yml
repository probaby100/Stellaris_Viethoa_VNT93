l_english:

 AQUATICS_TITLE: "Gói Chủng Tộc Thủy Tộc (Aquatics Species Pack)" # Do not translate
 DLC_AQUATICS_RECOMMENDATION_DESC:0 "Thủy Tộc mang đến một biển các lựa chọn mới, nơi bạn có thể khám phá sự sống mới ở những nơi ít ngờ tới nhất. Hãy để làn sóng các tùy chọn tùy biến mới cho đế chế của bạn tràn ngập vào Stellaris, với một kho tàng các bức chân dung chủng tộc mới, bộ tàu vũ trụ, nguồn gốc xuất thân và nhiều hơn thế nữa."
 DLC_AQUATICS_RECOMMENDATION_COSMETICS:0 "Chúng tôi khuyên dùng Thủy Tộc vì nhận thấy bạn là người yêu thích các gói trang trí diện mạo."
 DLC_AQUATICS_RECOMMENDATION_MOL:0 "Chúng tôi khuyên dùng Thủy Tộc vì nhận thấy bạn yêu thích ngoại hình giống loài thủy sinh."
 DLC_AQUATICS_RECOMMENDATION_OCEAN:0 "Chúng tôi khuyên dùng Thủy Tộc vì nó mở ra những tiềm năng mới để sinh sống trên các Thế Giới Đại Dương."

 vo_aquatics_voice:0 "Thủy Tộc"

 trait_aquatic:0 "Thủy Tộc"
 trait_aquatic_desc:1 "§LGiống loài này thích nghi hoàn hảo với cuộc sống dưới đáy đại dương sâu thẳm. Tuy nhiên, trên đất liền khô ráo, họ chẳng khác nào cá mắc cạn§!."
 trait_aquatic_tooltip:2 "Sử dụng Nhà ở trên các thế giới §YĐại Dương§! và §YMôi Trường Sống Bị Làm Ngập§!: §G-10%§!\n    - $worker_and_simple_drone_cat_bonus_workforce_mult$ trên các thế giới §YĐại Dương§!: §G+10%§!\n    - Sử dụng Nhà ở trên các thế giới không phải §YẨm Ướt§!: §R+30%§!\n    - Khả năng sinh sống trên các thế giới không phải §YẨm Ướt§!: §R-20%§!\n\nĐặc quyền Thăng hoa §H$ap_hydrocentric$§! sẽ khuếch đại hiệu ứng của đặc tính này."
 trait_robot_aquatic: "Chống Nước"
 trait_robot_aquatic_desc: "§LBan đầu được thiết kế để khám phá các tầng sâu đại dương, những cỗ máy này đối mặt với những hạn chế nghiêm trọng khi hoạt động trên cạn khô cằn.§!\n\n§RYêu cầu§! §YThế Giới Đại Dương§! làm §Rhành tinh mẹ§!."
 trait_robot_aquatic_tooltip: "$trait_aquatic_tooltip$"
 trait_aquatic_remove_evolutionary_mastery:1 "§RYêu cầu truyền thống §Y$tr_genetics_resequencing$§! để loại bỏ.§!"
 trait_aquatic_remove_hydrocentric:0 "§RKhông thể loại bỏ đặc tính §Y$trait_aquatic$§! sau khi đã chọn Đặc quyền Thăng hoa §Y$ap_hydrocentric$§!.§!"
 trait_aquatic_requires_ocean_preference: "§RĐặc tính §Y$trait_aquatic$§! yêu cầu thiên hướng hành tinh §YĐại Dương§! hoặc §Y$trait_cyborg_climate_adjustment_wet$§!.§!"

 leader_trait_aquatic_admiral:0 "Thủy Tộc"
 leader_trait_aquatic_admiral_desc:0 "Những cải tiến tàu chiến cần thiết để vị chỉ huy này cảm thấy như ở nhà tình cờ đem lại tác dụng phụ có lợi là làm cho thân tàu của hạm đội trở nên cứng cáp và bền bỉ hơn."

 origin_here_be_dragons:0 "Nơi Rồng Ngự Trị"
 origin_here_be_dragons_desc:0 "Từ thuở hồng hoang, nền văn minh này đã cùng chia sẻ hệ sao của mình với một con rồng đáng gờm. Hành vi của sinh vật bí ẩn này dao động giữa lòng nhân từ xa cách và sự thờ ơ kiêu ngạo. Mối quan hệ này sẽ phát triển ra sao khi cư dân hành tinh tiến vào các vì sao vẫn còn là điều cần thời gian chứng minh."
 civic_tooltip_aquatics_effects:1 "- $HOME_SYSTEM$ có một con §IThiên Long§! bảo hộ cư ngụ, nó sẽ trở nên thịnh nộ nếu phật ý"

 START_SCREEN_HERE_BE_DRAGONS:0 "Chúng ta luôn biết đến sự hiện diện của con Rồng. Nó đã ngự trị trên bầu trời phía trên [GetHomeWorldName] từ thuở hồng hoang, những tương tác ban đầu của chúng ta với nó rải rác khắp văn học dân gian [GetSpeciesAdj]. Trong một thời gian dài, đó là một câu chuyện về xung đột, khi vũ khí sơ khai của chúng ta không thể sánh được với quái thú hùng mạnh - nhưng sau đó, các câu chuyện kể về một người có tầm nhìn xa trông rộng, người đã vượt qua muôn vàn khó khăn để môi giới hòa bình giữa [GetSpeciesName] và Rồng.\n\nTrong những lần chạm trán tiếp theo, con Rồng đã tỏ ra là một nhân vật xa cách, bí ẩn, tấm gương của nó luôn thôi thúc những nỗ lực vươn tới các vì sao của chúng ta. Tuy nhiên, việc phát minh ra các hệ thống đẩy tốc độ cao và phát hiện mạng lưới siêu không gian đã mang lại một giai đoạn quan hệ mới đầy bất an với con Rồng, khi chúng ta ngày càng xâm nhập vào các khu vực mà nó đã đơn độc lang thang qua hàng kỷ.\n\nChính chúng ta phải quyết định tương lai của mình sẽ ra sao: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_HIVE:0 "Chúng ta luôn biết đến sự hiện diện của con Rồng. Nó đã ngự trị trên bầu trời phía trên [GetHomeWorldName] từ thuở hồng hoang, những tương tác ban đầu của chúng ta với nó rải rác khắp các tầng sâu mờ mịt trong ý thức tập thể của chúng ta. Trong các cuộc xung đột ban đầu, quái thú hùng mạnh đã chiếm thế thượng phong, vũ khí của chúng ta hoàn toàn bất lực trước nó - nhưng cuối cùng chúng ta đã có thể giảng hòa với nó, và chúng ta đã cùng tồn tại trong sự bất an kể từ đó.\n\nDù nó vẫn là một nhân vật bí ẩn, tấm gương của con Rồng luôn thôi thúc chúng ta đạt tới những kỳ tích vĩ đại hơn, mà đỉnh cao là việc phát minh ra các hệ thống đẩy tốc độ cao có khả năng đưa chúng ta tiến vào lãnh địa của nó. Giờ đây, khi chúng ta ngày càng xâm phạm những khu vực mà nó đã đơn độc lang thang qua hàng kỷ, chúng ta bước vào một giai đoạn quan hệ đầy bất an với con Rồng.\n\nChính chúng ta phải quyết định tương lai của mình sẽ ra sao: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_MACHINE:0 "Theo các ghi chép của những người tạo ra chúng ta, con Rồng luôn bay lượn trên bầu trời của [GetHomeWorldName] - thỉnh thoảng cũng đáp xuống bề mặt, nơi họ thường giao chiến vào thời sơ khai. Về sau trong lịch sử của họ, họ đã cùng tồn tại trong bất an, các cuộc chiến trở nên ít thường xuyên hơn khi sinh vật này bắt đầu tránh xa giống loài của họ.\n\nDù nó vẫn là một nhân vật bí ẩn đối với họ, tấm gương của con Rồng đã thôi thúc những người tạo ra chúng ta đạt tới những kỳ tích vĩ đại hơn, đỉnh cao là việc phát minh ra các hệ thống đẩy tốc độ cao có khả năng đưa họ vào lãnh địa của nó.\n\nGiờ đây khi thời đại của họ đã qua và chúng ta nắm quyền kiểm soát, chính chúng ta phải quyết định tương lai của mình sẽ ra sao: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_END:0 "liệu chúng ta sẽ nghiên cứu con Rồng, và có lẽ cuối cùng sẽ học cách giao tiếp với nó? Hay chúng ta sẽ bị cuốn vào xung đột, khi phạm vi của một hệ sao đơn lẻ đơn giản là quá nhỏ bé để chia sẻ với một sinh vật đáng gờm đến thế?"

 aquatics.105.name:0 "Hạ Gục Thiên Long"
 aquatics.105.desc.origin_start:0 "Chúng ta đã hạ gục thiên long! Với một cơn rùng mình cuối cùng, một tiếng gầm phẫn nộ kinh hoàng sau chót, chút sinh lực cuối cùng của quái thú đã cạn kiệt. Xác của nó vẫn còn nguyên vẹn - nhưng sẽ không được lâu, khi các [This.GetScientistPlural] của chúng ta đang nóng lòng muốn tiếp cận nó."
 aquatics.105.desc.origin_normal_middle:0 "Trên [dragon_planet.GetName], tâm trạng thật lẫn lộn. Dù nhiều người vui mừng trước sự thất trận của con quái vật đáng sợ này, sự hiện diện từng thường trực của con rồng đã có tác động sâu sắc đến tâm lý của [This.GetAdj]."
 aquatics.105.desc.origin_normal:0 "$aquatics.105.desc.origin_start$\n\n$aquatics.105.desc.origin_normal_middle$ Theo một cách nào đó, giết chết nó cũng giống như giết chết vị thần của chính mình.\n\n[This.GetSpeciesNamePlural] giờ đây có thể hướng tới một tương lai nơi họ có khả năng làm được bất cứ điều gì, nơi không nỗi sợ hãi siêu nhiên nào có thể ngăn cản họ đạt được những gì họ mong muốn."
 aquatics.105.desc.origin_materialist:0 "$aquatics.105.desc.origin_start$\n\n$aquatics.105.desc.origin_normal_middle$ Dù chúng ta đã rũ bỏ những vị thần giả tạo từ lâu, hành động này theo một cách nào đó cũng giống như trục xuất họ một lần nữa. [This.GetSpeciesNamePlural] giờ đây có thể hướng tới một tương lai nơi họ có khả năng làm được bất cứ điều gì, nơi không nỗi sợ hãi siêu nhiên nào có thể ngăn cản họ đạt được những gì họ mong muốn."
 aquatics.105.desc.origin_hive:0 "$aquatics.105.desc.origin_start$\n\nKhi ý thức tập thể của chúng ta suy ngẫm về hành động này, chúng ta đón nhận những cảm xúc lẫn lộn. Một mặt, đó là sự thỏa mãn: một mối đe dọa nghiêm trọng đã bị chinh phục. Mặt khác, con rồng từng hiện diện thường trực trước đây đã trở nên... quen thuộc. Dù chúng ta dành rất ít thời gian cho những nỗi ám ảnh \"siêu nhiên\" của các nền văn minh du hành vũ trụ khác, theo một cách nào đó, chúng ta có thể coi hành động này giống như giết chết vị thần của chính mình. Chúng ta giờ đây có thể hướng tới một tương lai nơi chúng ta có khả năng làm được bất cứ điều gì, nơi không trở ngại nào dù dường như không thể vượt qua đến đâu có thể kìm hãm chúng ta."
 aquatics.105.desc.origin_machine:0 "$aquatics.105.desc.origin_start$\n\nKhi các bộ xử lý của chúng ta tự hiệu chỉnh lại để tính đến hậu quả của hành động này, chúng ta nhận thấy rằng mình phải thực hiện một khối lượng tái cấu trúc đáng ngạc nhiên. Con rồng từng hiện diện thường trực trước đây đã có tác động đáng kể đến lập trình của chúng ta, với hàng tỷ quy trình an toàn dự phòng để đối phó với tính khó lường trong hành động của nó, một điều sẽ mất nhiều thời gian để gỡ bỏ. Mặt khác, khi mối đe dọa ghê gớm này được dỡ bỏ khỏi chúng ta, chúng ta giờ đây có thể hướng tới một tương lai nơi chúng ta có khả năng làm được bất cứ điều gì, nơi không trở ngại nào dù dường như không thể vượt qua đến đâu có thể kìm hãm chúng ta."
 aquatics.105.desc.others:0 "Chúng ta đã hạ gục Thiên Long của hệ sao [dragon_system.GetName]! Với một cơn rùng mình cuối cùng, một tiếng gầm phẫn nộ kinh hoàng sau chót, chút sinh lực cuối cùng của quái thú đã cạn kiệt.\n\nTrong khi các cư dân của [dragon_planet.GetName] có thể không hài lòng với việc người bảo hộ của họ bị tiêu diệt, các [This.GetScientistPlural] của chúng ta đang nóng lòng muốn tiếp cận xác của nó. Họ tin rằng việc nghiên cứu nó có thể mở khóa bí mật để tổng hợp lớp vảy cứng cáp như của Thiên Long."
 aquatics.105.A:0 "Hãy xem tàn tích của nó có thể đem lại những bí mật gì."
 aquatics.105.A.tooltip:0 "Mở khóa đặc tính §Y$trait_drake_scaled$§! cho §YChuyển Gen Thú Thần Khổng Lồ§!."

 aquatics.110.name:0 "Thiên Long Bị Hạ Gục"
 aquatics.110.desc:0 "[From.GetName] đã đánh bại Thiên Long! Hậu quả của hành động khủng khiếp này là [dragon_planet.GetName] giờ đây rất dễ bị tấn công."
 aquatics.110.A:0 "Hỡi ôi..."
 aquatics.115.name:0 "Thiên Long Được Hồi Sinh"
 aquatics.115.desc.regular:0 "Đúng như lời hứa, các pháp sư chiêu hồn của chúng ta đã đưa Thiên Long của hệ sao [dragon_system.GetName] trở lại với sự sống! Dẫu có đôi chút vụng về - như người ta thường thấy ở một sinh vật vừa từ cõi chết trở về - giờ đây nó đang háo hức chờ đợi mệnh lệnh của chúng ta."
 aquatics.115.desc.hive:0 "Kiểm soát §YThiên Long§! luôn nằm trong kế hoạch của chúng ta. Những cá thể không người lái của chúng ta đã tiến hóa đặc biệt để đoạt lấy phần thưởng này. Dù quá trình thích nghi đòi hỏi một số điều chỉnh, giờ đây chúng ta chính là Thiên Long, và nó chính là chúng ta. Với tri thức và kinh nghiệm của nó được tích hợp vào bầy đàn, chúng ta hoàn toàn sẵn sàng đối mặt với bất kỳ đồng loại nào của nó."
 aquatics.115.desc.machine: "Sinh vật được chỉ định là §YThiên Long§! đã được đại tu theo các giao thức Chiêu Hồn Cơ Khí. Hơi thở băng giá của nó giờ đây đạt gần tới 1 độ Kelvin. Con rồng được hồi sinh nay đã hoàn toàn nằm dưới quyền kiểm soát của chúng ta."
 aquatics.115.A:1 "Kẻ thù của chúng ta sẽ bị đóng băng!"
 REANIMATE_ORIGIN_DRAGON:0 "Hồi Sinh Thiên Long"
 REANIMATE_ORIGIN_DRAGON_DESC:2 "Dù con rồng của hệ sao [dragon_system.GetName] đã bị tiêu diệt, các [Owner.GetNecromancersLower] của chúng ta đảm bảo rằng tình trạng này không cần phải kéo dài lâu. Họ hứa rằng có thể hồi sinh nó - hoàn toàn quy phục chúng ta - trong thời gian ngắn."
 slew_origin_dragon:0 "Kẻ Sát Long Nguyên Thủy"
 slew_origin_dragon_desc:0 "Từ thuở hồng hoang, một con Thiên Long hùng mạnh đã lang thang trong hệ sao quê nhà của chúng ta... nhưng giờ thì không còn nữa! Được giải thoát khỏi mối đe dọa này, không còn gì có thể kìm hãm bước tiến của chúng ta vào tương lai."

 aquatics.120.name:0 "Thời Khắc Đã Đến"
 aquatics.120.diplo_name:0 "Tín Hiệu Long Ngữ Đến"
 aquatics.120.desc:0 "Thời gian trôi đi, và cùng với đó là những mối hoài nghi của ta. Từ những khởi đầu nhỏ bé, ta đã dõi theo các ngươi: thường tuyệt vọng trước sự bốc đồng thường xuyên của các ngươi, nhưng cũng luôn gầm vang vui sướng trước những thành công của các ngươi. Giờ đây, ta nhận thấy các ngươi đã trưởng thành, nền văn minh của các ngươi đã chín muồi và sẵn sàng được giao phó trách nhiệm tối thượng: làm cha mẹ. Đã đến lúc các ngươi dốc lòng nuôi dưỡng những đứa con của ta."
 aquatics.120.dialog.1:0 "Khoan đã - cái gì cơ?"
 aquatics.120.dialog.1.response:0 "Nói một cách thẳng thắn, ta đã chờ đợi ngày này từ rất lâu. Lâu hơn các ngươi có thể tưởng tượng được. Các ngươi thấy đấy, ta không thể sinh con một mình. Ta cần một giống loài có trí tuệ, có khả năng thấu hiểu sự vĩ đại của loài rồng để giúp đỡ ấp nở và chăm sóc chúng."
 aquatics.120.dialog.2:0 "Vậy đây là kế hoạch của ngài từ đầu đến giờ sao?"
 aquatics.120.dialog.2.response:0 "Đúng vậy. Đó là con đường của chúng ta. Trong thiên hà quê hương của chúng ta, có rất nhiều đồng loại của ta, mỗi cá thể đều tìm kiếm những người bạn đồng hành xứng đáng. Ta đã chọn các ngươi, và ta đã kiên nhẫn chờ đợi các ngươi vươn tới các vì sao."
 aquatics.120.dialog.3:0 "Chúng tôi sẽ nhận được gì để đổi lại?"
 aquatics.120.dialog.3.response:0 "Chà, trước hết, một con Rồng Bảo Hộ trưởng thành hoàn toàn là một đồng minh đáng gờm! Nếu các ngươi đồng ý nuôi dưỡng đàn con của ta, ta sẽ ban phước cho đế chế của các ngươi, và các con của ta sẽ cùng bay với các hạm đội của các ngươi."
 aquatics.120.dialog.4:0 "Và nếu chúng tôi từ chối?"
 aquatics.120.dialog.4.response:0 "Vậy thì các ngươi đã đưa ra lựa chọn của mình, và ta sẽ rời đi. Ta đã chờ đợi một thời gian dài, nhưng ta sẽ không lãng phí thêm thì giờ ở nơi mà giống loài của ta không được trân trọng."
 aquatics.120.A:0 "Chúng tôi rất vinh dự được chấp nhận."
 aquatics.120.A.response:0 "Tuyệt vời! Ta biết các ngươi sẽ đồng ý mà. Các ngươi sẽ không phải hối tiếc đâu!"
 aquatics.120.A.tooltip:0 "Cho phép xây dựng §YVườn Ươm Rồng§! tại các căn cứ sao, từ đó cho phép nuôi dưỡng $space_dragon_origin_baby_plural$"
 aquatics.120.B:0 "Chúng tôi cảm ơn lời đề nghị này, nhưng chúng tôi buộc phải từ chối."
 aquatics.120.B.response:0 "§S*Thở dài*§!. Có lẽ các ngươi vẫn chưa học hỏi được nhiều như ta từng nghĩ. Vĩnh biệt!"
 aquatics.120.B.tooltip:0 "Thiên Long sẽ rời đi và không bao giờ quay trở lại."

 aquatics.150.name:0 "Con Rồng Đói Bụng"
 aquatics.150.desc:0 "Các [This.Owner.GetResearchers] của chúng ta đang quan sát Thiên Long đã báo cáo những tiếng kêu răng rắc lớn phát ra từ nó khi nó sà xuống thấp trên bề mặt [Root.GetName]. Sinh vật này dường như đang tìm kiếm một nguồn thức ăn lớn để bổ sung các nguồn dự trữ đã cạn kiệt của nó."
 aquatics.150.A:0 "Bắn một phát súng cảnh cáo vào lần tới khi nó đến gần."
 aquatics.150.A.tooltip:0 "§RCon rồng có thể sẽ nổi giận.§!"
 aquatics.150.B:0 "Dành riêng một khu vực hẻo lánh cho nó đáp xuống."
 aquatics.150.B.tooltip:0 "§RCon rồng có thể sẽ tiêu thụ rất nhiều thức ăn một khi nó đáp xuống hành tinh!§!"
 aquatics.150.C:0 "Tiếp tục quan sát nó."
 aquatics.155.name:0 "Cơn Thịnh Nộ Từ Trời Cao"
 aquatics.155.desc.normal:0 "Con rồng không mấy hài lòng trước biểu hiện thù địch của chúng ta. Với một tiếng gầm lớn - uy lực của nó gây ra hoảng loạn trên khắp [Root.GetName] - sinh vật này sà xuống một trong những khu phức hợp nông nghiệp của chúng ta, ngấu nghiến các kho dự trữ lương thực trước khi cất cánh một lần nữa."
 aquatics.155.desc.gestalt:0 "Con rồng không mấy hài lòng trước biểu hiện thù địch của chúng ta. Với một tiếng gầm lớn - uy lực của nó gây ra sự tàn phá đáng kể trên khắp [Root.GetName] - sinh vật này sà xuống một trong những khu phức hợp nông nghiệp của chúng ta, ngấu nghiến các kho dự trữ lương thực trước khi cất cánh một lần nữa."
 aquatics.160.name:0 "Rồng Đã Đáp Xuống"
 aquatics.160.desc:0 "Con rồng dường như đã nhận ra ý định của chúng ta, và nhẹ nhàng sà xuống nghỉ ngơi trong khu bảo tồn mà chúng ta đã dành riêng cho nó. Vô cùng kinh ngạc, các [This.Owner.GetResearchers] của chúng ta báo cáo rằng con rồng đang ngấu nghiến một cách tham lam số thức ăn mà chúng ta cung cấp cho nó."
 aquatics.160.A:0 "Quan sát và chờ đợi."
 aquatics.165.name:0 "$aquatics.160.name$"
 aquatics.165.desc.normal:1 "Sau vài lần lượn quanh hành tinh nữa, con rồng dường như quyết định rằng nó không thể chịu đói được, và đã đáp xuống gần một trong các khu phức hợp nông nghiệp của chúng ta. Những [Root.Owner.GetSpeciesNamePlural] kinh hoàng chỉ có thể nhìn trong nỗi khiếp sợ khi quái thú tham lam ngấu nghiến các kho dự trữ của chúng ta, trước khi quay trở lại lãnh địa của nó."
 aquatics.165.desc.gestalt:0 "Sau vài lần lượn quanh hành tinh nữa, con rồng dường như quyết định rằng nó không thể chịu đói được, và đã đáp xuống gần một trong các khu phức hợp nông nghiệp của chúng ta. Sinh vật tham lam ngấu nghiến các kho dự trữ của chúng ta, trước khi quay trở lại lãnh địa của nó."
 aquatics.170.name:0 "Cất Cánh Bay Lên"
 aquatics.170.desc:0 "Sau nhiều năm thỏa thuê thưởng thức các vụ mùa bội thu trên [Root.GetName], Thiên Long cuối cùng đã dang rộng đôi cánh khổng lồ và bay vút trở lại bầu trời không gian. Nó để lại một lượng lớn vảy rồng rụng và các chất bài tiết hữu cơ giàu khoáng chất tại bãi đáp."
 aquatics.170.A:0 "Chúng ta sẽ nghiên cứu các tàn tích này."
 aquatics.170.B:0 "Đốt chúng làm nhiên liệu."
 aquatics.170.tooltip:0 "Con rồng giờ đây lại tiếp tục tuần tra trong hệ sao §Y[here_be_dragons_planet.System.GetName]§!."

 aquatics.180.name:0 "Rồng Bảo Hộ"
 aquatics.180.desc:0 "Các hạm đội của chúng ta trong hệ sao [From.GetName] báo cáo rằng con rồng lang thang trong hệ sao đã di chuyển để đánh chặn các hạm đội [From.Owner.GetAdj] đang cố gắng tiến vào quỹ đạo phía trên [here_be_dragons_planet.GetName]! Sinh vật đáng gờm này đã phá vỡ cuộc oanh tạc quỹ đạo hành tinh một cách hiệu quả."
 aquatics.185.name:0 "Tiếng Gầm Của Rồng"
 aquatics.185.desc:0 "Thiên Long dường như có cái nhìn không mấy thiện cảm trước những nỗ lực của [From.GetAdj] nhằm xâm chiếm [here_be_dragons_planet.GetName]. Với một tiếng gầm đáng sợ, quái thú đã giao chiến với các đội quân xâm lược của kẻ thù, phun băng và lửa vào những kẻ xâm lược bất hạnh!"
 aquatics.185.desc.landed:0 "Thiên Long dường như có cái nhìn không mấy thiện cảm trước những nỗ lực của [From.GetAdj] nhằm xâm chiếm [here_be_dragons_planet.GetName]. Quái thú đã bay lên từ bề mặt để giao chiến với các đội quân xâm lược của kẻ thù, phun băng và lửa vào những kẻ xâm lược bất hạnh!"
 aquatics.185.A:0 "Vạn tuế Thiên Long!"
 aquatics.185.B:0 "Tốt, bớt đi một mối đe dọa cần giải quyết."

 aquatics.190.name:0 "Khảo Sát Giáp Vảy Rồng"
 aquatics.190.desc:0 "Giờ đây khi chúng ta đã đạt được một số tiến bộ trong việc tìm hiểu sinh học ngoại chủng và các vật liệu kỳ dị, các nhà khoa học của chúng ta tin rằng họ có thể trích xuất các mẫu vảy rồng từ Thiên Long mà không gây hại cho nó."
 aquatics.190.desc.gestalt:0 "Giờ đây khi chúng ta đã đạt được một số tiến bộ trong việc tìm hiểu sinh thái ngoại chủng và cấu trúc vật liệu kỳ dị, các đơn vị nghiên cứu của chúng ta tin rằng có thể thu thập các mẫu vảy rồng từ Thiên Long phục vụ tích hợp dữ liệu."
 aquatics.190.A:0 "Tiến hành đi."
 aquatics.190.B:0 "Hãy thử thứ gì đó ít xâm phạm hơn."

 DRAGON_REMOTE_SCANS:0 "Quét Rồng Từ Xa"
 DRAGON_REMOTE_SCANS_DESC:0 "Tàu khoa học của chúng ta sẽ quét con rồng từ một khoảng cách an toàn để tìm hiểu những bí mật về lớp vảy của nó."
 aquatics.195.name:0 "Quét Từ Xa Hoàn Tất"
 aquatics.195.desc:0 "Dù con rồng chăm chú dõi theo tàu khoa học của chúng ta, nó đã không phản ứng khi chúng ta thực hiện một loạt các lần quét từ xa. Các [This.Owner.GetResearchers] của chúng ta báo cáo rằng họ đã học được rất nhiều về đặc điểm sinh lý của con rồng."

 DRAGON_MATERIAL_STUDY:0 "Thu Thập Mẫu Vật Rồng"
 DRAGON_MATERIAL_STUDY_DESC:0 "Tàu khoa học của chúng ta sẽ táo bạo phóng một đầu dò tự ghim vào dưới lớp vảy của con rồng để lấy mẫu mô trực tiếp."
 aquatics.200.name:0 "Tàu Khoa Học Bị Nuốt Chửng"
 aquatics.200.desc:0 "Có vẻ như con rồng đang đói. Hoặc có lẽ nó chỉ đang có một ngày tồi tệ. Khi tàu khoa học của chúng ta tiếp cận để phóng đầu dò, con rồng bất ngờ lao tới và ngoạm đứt đôi con tàu trong một cú đớp kinh hoàng."
 aquatics.200.A:0 "Tốt nhất đừng làm nó nổi giận thêm nữa."
 aquatics.200.B:0 "Cơn đói của nó chắc đã được thỏa mãn rồi. Hãy thử lại lần nữa."
 aquatics.205.name:0 "Tàu Khoa Học Bị Đẩy Lùi"
 aquatics.205.desc:0 "Con rồng dung thứ cho sự tiếp cận của tàu khoa học của chúng ta, nhưng khi đầu dò vừa được phóng ra, nó vung chiếc đuôi khổng lồ đánh dạt con tàu ra xa, phá hủy hệ thống động cơ và buộc thủy thủ đoàn phải rút lui khẩn cấp."
 aquatics.205.A:0 "$aquatics.200.A$"
 aquatics.205.B:0 "Thật hấp dẫn. Chúng ta nên xem điều gì sẽ xảy ra nếu thử lại lần nữa."
 aquatics.210.name:0 "Cơn Thịnh Nộ Của Rồng"
 aquatics.210.desc.normal:0 "Khi con tàu của chúng ta tiếp cận con rồng lần thứ hai, con rồng lập tức hành động. Với một tiếng gầm giận dữ, sinh vật này phóng một luồng nổ băng giá vào phi thuyền, ngay lập tức phá hủy nó.\n\nBị chấn động sâu sắc, các công dân của chúng ta trên [dragon_colony.GetName] tự hỏi liệu việc chọc giận quái thú có khôn ngoan hay không."
 aquatics.210.desc.gestalt:0 "Khi con tàu của chúng ta tiếp cận con rồng lần thứ hai, nó lập tức hành động. Với một tiếng gầm giận dữ, sinh vật này phóng một luồng nổ băng giá vào phi thuyền, ngay lập tức phá hủy nó.\n\nCác cá thể không người lái của chúng ta trên [dragon_colony.GetName] quan sát con tàu bị phá hủy."
 aquatics.210.A:0 "Hãy lùi lại một thời gian."
 aquatics.215.name:0 "Nghiên Cứu Rồng Thành Công"
 aquatics.215.desc:0 "Con rồng gầm gừ giận dữ khi đầu dò của chúng ta bám chặt vào nó, nhanh chóng xác định vị trí và trích xuất một chiếc vảy lỏng lẻo. Sinh vật này nhanh chóng hất văng đầu dò, nhưng mẫu vật đã được thu hồi thành công trước đó.\n\nGiờ đây, trong khi con rồng hờn dỗi ở một góc xa của hệ sao, các [This.Owner.GetResearchers] của chúng ta trên [dragon_colony.GetName] có thể mong đợi việc nghiên cứu kỳ quan sinh học mang tên vảy rồng trên [Root.GetName]!"

 first_contact_dragon:0 "Liên Lạc Với Rồng"
 aquatic_events.250.name:0 "$first_contact_dragon$"
 aquatic_events.250.desc:0 "Sau những thành công của chúng ta trong việc thiết lập liên lạc với một số loài ngoài hành tinh, cũng như bất kỳ cư dân kỳ lạ nào khác có thể cư ngụ trong biên giới của chúng ta, [needed_name.GetName] đã đạt được một phát hiện đáng kinh ngạc: những âm thanh do Thiên Long phát ra khi tàu của chúng ta tiếp cận [dragon_system.GetName] không phải là những tiếng gầm ngẫu nhiên hay tiếng rít vô tri! Trên thực tế, [needed_name.GetHeSheCap] tuyên bố rằng con rồng đã cố gắng giao tiếp với chúng ta trong nhiều tháng qua.\n\nCác [This.Owner.GetLinguists] của chúng ta từng bác bỏ những âm thanh đó là vô nghĩa, nhưng [needed_name.GetName] tin rằng chúng có thể là một dạng ngôn ngữ - dẫu không giống bất kỳ ngôn ngữ [This.Owner.Species.GetName] nào đã biết. Nếu [needed_name.GetSheHe] đúng, chúng ta có thể làm sáng tỏ tiếng nói của con rồng, và tìm ra điều nó muốn."
 aquatic_events.250.desc.hive:0 "Sau khi thiết lập liên lạc với một số loài ngoài hành tinh, các nút ngôn ngữ học của chúng ta đã phân tích các âm thanh của Thiên Long và phát hiện ra rằng chúng chứa các cấu trúc cú pháp phức tạp, biểu thị một nỗ lực giao tiếp có chủ ý."
 aquatic_events.250.desc.machine:0 "Sau khi thiết lập liên lạc với các loài ngoài hành tinh, các thuật toán giải mã của chúng ta đã xử lý các tín hiệu âm thanh và sóng não của Thiên Long, xác định rằng chúng tuân theo một khuôn mẫu giao tiếp có hệ thống."
 start_dragon_communications_study:0 "Các [This.Owner.GetEnvoyPlural] của chúng ta sẽ cố gắng giao tiếp với Thiên Long."
 aquatics.255.name:0 "Khởi Đầu Thận Trọng"
 aquatics.255.desc:0 "Khi các [This.Owner.GetResearchers] và [This.Owner.GetLinguists] của chúng ta lục tìm trong các kho dữ liệu ghi âm, họ bắt đầu nhận ra một vài mẫu âm thanh lặp lại trong tiếng gầm của con rồng. Quá trình giải mã bước đầu đã có tiến triển."
 aquatics.260.name:0 "Tiến Triển Chậm Chạp"
 aquatics.260.desc:1 "Các [This.Owner.GetLinguists] của chúng ta vẫn bị bối rối trước những phát ngôn của con rồng. Dù một số từ ngữ cơ bản dường như đã được xác định, ngữ pháp và ngữ cảnh của nó hoàn toàn nằm ngoài các hệ quy chiếu ngôn ngữ đã biết của chúng ta."
 aquatics.260.A:0 "Thật bí ẩn."
 aquatics.265.name:0 "Chân Tướng Của Những Tiếng Gầm"
 aquatics.265.desc.normal:0 "Các [This.Owner.GetLinguists] của chúng ta báo cáo một bước đột phá đáng kinh ngạc. Tuyệt vọng trước việc có thể hiểu được con rồng, họ đã chuyển đổi bản đồ quang phổ về các phát xạ năng lượng cơ thể dao động của nó thành các dạng sóng âm thanh. Khi lắng nghe kết quả, họ không thể tin vào [This.Owner.GetSpeciesEarNamePlural] của mình. Không thể phủ nhận: con rồng đang nói ngôn ngữ của chúng ta, nhưng bằng một phương tiện truyền dẫn khác! Những tiếng gầm của nó, trên thực tế, chỉ nhằm thu hút sự chú ý của chúng ta, chứ không phải một nỗ lực giao tiếp.\n\n$aquatics.265.desc.end$"
 aquatics.265.desc.gestalt:0 "Các [This.Owner.GetLinguists] của chúng ta báo cáo một bước đột phá đáng kinh ngạc. Tuyệt vọng trước việc có thể hiểu được con rồng, họ đã chuyển đổi bản đồ quang phổ về các phát xạ năng lượng cơ thể dao động của nó thành một biểu đồ độ lệch sóng tiêu chuẩn. Điều này tiết lộ rằng nó trên thực tế đang \"nói\" bằng mã nhị phân đơn giản, không khác biệt so với mã mà đôi khi chúng ta sử dụng, chỉ trên một bước sóng khác. Những tiếng gầm của nó, trên thực tế, chỉ nhằm thu hút sự chú ý của chúng ta, chứ không phải một nỗ lực giao tiếp.\n\n$aquatics.265.desc.end$"
 aquatics.265.desc.end:0 "Các [This.Owner.GetLinguists] của chúng ta đã phát lại các bản ghi âm cũ với hiểu biết mới này trong tâm trí, và một thông điệp rõ ràng đã hiện ra: Thiên Long muốn chúng ta chứng tỏ sự xứng đáng của mình trước khi nó chịu mở lời trực tiếp."
 aquatics.265.A:0 "Nhưng chúng ta đã sẵn sàng!"
 aquatics.270.name:0 "Lời Khiển Trách Gay Gắt"
 aquatics.270.desc:0 "Con rồng tuôn ra một bài thuyết giáo dài dòng về sự thông thái mà nó đã tích lũy qua hàng kỷ, chê trách sự non nớt và ngạo mạn của nền văn minh chúng ta. Nó tuyên bố sẽ chỉ nói chuyện lại khi chúng ta chứng minh được sự trưởng thành thực sự của mình."
 aquatics.270.A:0 "Hỡi ôi. Chúng ta sẽ cố gắng tốt hơn."
 aquatics.270.A.tooltip:0 "Thiên Long sẽ tự tìm đến chúng ta khi nó sẵn sàng."
 aquatics.280.name:0 "Con Rồng Khó Chịu"
 aquatics.280.desc:0 "Chúng ta không chắc chắn điều gì đã sai, nhưng các [This.Owner.GetResearchers] của chúng ta dường như đã vô tình làm mất lòng con rồng bằng bản dịch vụng về của họ. Sinh vật gầm lên, âm thanh vang vọng khắp [This.Leader.GetName], trước khi bay đến một góc xa của hệ sao.\n\nCó vẻ như [This.Owner.GetEnvoy] của chúng ta sẽ cần thêm thời gian để xoa dịu bộ lông đang xù lên của quái thú."
 draconic_communications_continues:0 "Các nỗ lực của chúng ta sẽ tiếp tục."

 fcsum_origin_dragon_1:0 "Chúng ta đã bắt đầu nỗ lực giao tiếp với con rồng, nhưng đạt được rất ít tiến triển."
 fcsum_origin_dragon_2:0 "Bất chấp sự hợp tác của con rồng, những phát ngôn của nó vẫn tiếp tục làm chúng ta bối rối."
 fcsum_origin_dragon_3:0 "Chúng ta đã giải mã được bí mật đằng sau việc giao tiếp với con rồng. Nó dường như đang theo dõi sự phát triển của chúng ta."

 aquatics.305.name:0 "$aquatics.180.name$"
 aquatics.305.desc:0 "[This.GetName] báo cáo đã phát hiện một con rồng không gian đáng sợ trong hệ sao [From.GetName]! Nó dường như là một loài săn mồi đỉnh cao, và [From.Owner.GetName] dường như đã làm hòa với nó bằng cách nào đó - hoặc ít nhất họ tránh được cơn thịnh nộ của nó." #this event happens during first contact, so [From.Owner.GetName] is 'alpha menace'
 aquatics.305.desc.pre-ftl:0 "[This.GetName] báo cáo đã phát hiện một con rồng không gian đáng sợ trong hệ sao [From.GetName]! Nó dường như là một loài săn mồi đỉnh cao, lang thang trên bầu trời của [From.Planet.GetName] phía trên một nền văn minh [Owner.GetPreFTLLower] hoàn toàn không hay biết." # e.g. 'home to an unsophisticated civilization' or 'home to a pre-FTL civilization'

 space_dragon_origin:0 "Thiên Long"
 space_dragon_origin_cap: "$space_dragon_origin$"
 space_dragon_origin_plural:0 "Các Thiên Long"
 space_dragon_origin_baby:0 "Rồng Con" #Has to be short for interface reasons
 space_dragon_origin_baby_cap: "$space_dragon_origin_baby$"
 space_dragon_origin_baby_plural:0 "Đàn Rồng Con"
 requires_dragon_hatchery:0 "$TRIGGER_FAIL$Yêu cầu một §YVườn Ươm Rồng§!"
 sm_dragon_hatchery:0 "Vườn Ươm Rồng"
 sm_dragon_hatchery_desc:0 "Cơ sở vật chất tối tân phục vụ việc ấp nở và nuôi dưỡng những chú rồng non."
 dragon_hatchery_tooltip:0 "§GCho phép chiêu mộ tối đa §H10§! $space_dragon_origin_baby_plural$§!"

 d_landed_dragon:0 "Rồng Đang Ăn"
 d_landed_dragon_desc:0 "Thiên Long hùng mạnh đã đáp xuống và đang thỏa thuê ngấu nghiến các kho dự trữ lương thực của hành tinh chúng ta."

 ap_hydrocentric:0 "Trọng Tâm Thủy Quyển"
 ap_hydrocentric_desc:0 "Chúng ta sẽ không còn bằng lòng với những nơi ở thay thế \"tạm bợ\" cho chốn đại dương của mình nữa: chúng ta sẽ định hình toàn bộ thế giới để biến chúng thành những thiên đường ngập nước hoàn mỹ."
 ap_hydrocentric_tooltip:3 "Mở khóa các Quyết định §Y$decision_expand_planetary_sea$§! và §Y$decision_flood_habitat$§!\n$t$- Yêu cầu một §Y$sm_ice_mining_station$§! được xây dựng trên một Căn Cứ Sao trong hệ sao\nKhuếch đại hiệu ứng của các đặc tính §Y$trait_aquatic$§! và §Y$trait_robot_aquatic$§!:\n    - $worker_and_simple_drone_cat_bonus_workforce_mult$ trên các thế giới §YĐại Dương§!: Thêm §G+10%§!\n    - Sử dụng Nhà ở trên các thế giới §YĐại Dương§!: Thêm §G-5%§!\n    - Khả năng sinh sống trên các thế giới không phải §YẨm Ướt§!: Thêm §R-10%§!\n    - Sử dụng Nhà ở trên các thế giới không phải §YẨm Ướt§!: Thêm §R+15%§!\n\nChi phí và thời gian cải tạo địa hình thành §YThế Giới Đại Dương§!: §G-25%§!"
 ap_hydrocentric_deluge_tooltip:0 "Mở khóa Vũ Khí Pháo Đài Hủy Diệt Hành Tinh (Colossus) §YĐại Hồng Thủy§!."
 ap_hydrocentric_deluge_pre_unlock_tooltip:0 "Mở khóa Vũ Khí Pháo Đài Hủy Diệt Hành Tinh (Colossus) §YĐại Hồng Thủy§! §R(yêu cầu Đặc quyền Thăng hoa §Y$ap_colossus$§!)§!."

 terraforming:0 "Cải Tạo Địa Hình"
 terraforming_ocean:0 "Cải Tạo Thành Thế Giới Đại Dương"
 has_terraforming_candidate:0 "§YCó ứng viên cải tạo địa hình trong hệ sao.§!"
 has_frozen_terraforming_candidate:0 "§YCó ứng viên cải tạo địa hình thế giới băng giá trong hệ sao.§!"
 has_toxic_terraforming_candidate:0 "§YCó ứng viên cải tạo địa hình thế giới độc hại trong hệ sao.§!"

 aquatics.1.name:0 "Thủy Tộc Tiên Tiến"
 aquatics.1.desc:0 "Chúng ta đến từ đại dương, chủng tộc của chúng ta thích nghi lý tưởng với cuộc sống dưới tầng sâu thăm thẳm của biển cả. Bằng cách định hình lại các hành tinh và môi trường sống để chứa đầy nước, chúng ta sẽ mở rộng vương quốc dưới nước của mình ra khắp các vì sao."
 aquatic.1.A:0 "Đó sẽ là một mái nhà không nơi nào sánh bằng."

 MESSAGE_FROZEN_TERRAFORM_FOUND_TITLE:0 "$aquatics.5.name$"
 MESSAGE_FROZEN_TERRAFORM_FOUND_DESC:0 "Chúng ta đã phát hiện một ứng viên cải tạo địa hình thế giới băng giá tiềm năng khác, [From.GetName]."

 aquatics.5.name:0 "Phát Hiện Ứng Viên Cải Tạo Địa Hình Băng Giá"
 aquatics.5.desc.intro:1 "Khảo sát chi tiết của chúng ta về [From.GetName] đã hé lộ một thế giới có lớp vỏ băng đủ dày để có thể làm tan chảy và biến đổi thành một đại dương mênh mông."
 aquatics.5.desc.1:0 "$aquatics.5.desc.intro$\n\nVề mặt lý thuyết, việc cải tạo địa hình [From.GetPlanetMoon] này là khả thi, mở ra triển vọng về một thế giới đại dương phì nhiêu trong tương lai."
 aquatics.5.desc.2:0 "$aquatics.5.desc.intro$\n\nChi phí năng lượng sẽ rất lớn, nhưng chúng ta có công nghệ cần thiết để làm tan chảy [From.GetPlanetMoon] và biến nó thành một §YThế Giới Đại Dương§! tráng lệ. Chúng ta nên cân nhắc điều đó."
 aquatics.5.desc.a: "Một thế giới mà niềm hy vọng vẫn còn đọng lại..."

 FROZEN_TERRAFORMING_CANDIDATE_EFFECT:0 "§Y[From.GetName]§! có thể được cải tạo địa hình với Đặc quyền Thăng hoa §H$ap_hydrocentric$§! và công nghệ £society£ §Y$tech_climate_restoration$§!."

 sm_ice_mining_station:0 "Trạm Khai Thác Băng"
 sm_ice_mining_station_desc:0 "Hệ sao này là một nguồn băng chưa được khai thác dồi dào. Bằng cách thiết lập một hoạt động thu hoạch trên căn cứ sao, chúng ta có thể kéo các tảng băng từ các tiểu hành tinh băng và các thế giới băng giá địa phương đến các hành tinh khác, mở rộng biển cả hành tinh của họ, hoặc làm ngập các môi trường sống bằng nước.\n\n$ice_mining_details$"
 ice_mining_station_tooltip:2 "Bộ điều chỉnh Hệ sao:\n    $mod_station_gatherers_produces_mult$: §G+15%§!\nMở khóa các Quyết định §Y$decision_expand_planetary_sea$§! và §Y$decision_flood_habitat$§!."
 requires_ice_source:0 "§RYêu cầu một tiểu hành tinh băng hoặc thế giới băng giá trong hệ sao.§!"
 ice_mining_details:0 "Tiểu hành tinh băng có thể được khai thác 1 lần, các thế giới băng giá tối đa 3 lần."
 has_ice_source:0 "§YCó thể Khai thác Băng.§!"

 decision_expand_planetary_sea:0 "Mở Rộng Biển Cả Hành Tinh"
 decision_expand_planetary_sea_desc:0 "Biển cả là nhà của chúng ta - và nhà thì không bao giờ là đủ rộng. Mạng lưới khai thác băng của chúng ta sẽ mang các khối băng khổng lồ đến [This.GetName], cho phép chúng ta mở rộng các đại dương và gia tăng kích thước hành tinh."
 decision_expand_planetary_sea_tooltip:0 "Băng sẽ được thu hoạch từ một hệ sao có §Y$sm_ice_mining_station$§! trên căn cứ sao và được chuyển tới hành tinh này.\nTăng kích thước hành tinh thêm §G+1§! và thêm §G+1§! ô Quận Nông nghiệp và Quận Năng lượng tối đa."
 requires_free_ice_mining_station:0 "$TRIGGER_FAIL$§RRequires an available §Y$sm_ice_mining_station$§!§!"
 requires_max_3_times_pass_simple:0 "$TRIGGER_PASS$Có thể ban hành tối đa §Y3§! lần cho mỗi hành tinh"
 requires_max_3_times_fail_simple:0 "$TRIGGER_FAIL$Có thể ban hành tối đa §Y3§! lần cho mỗi hành tinh"
 requires_max_3_times_ice_dumping:0 "$TRIGGER_PASS$Có thể ban hành tối đa §Y3§! lần cho mỗi hành tinh (hiện tại: §Y[This.ice_dumping_happened]§!)"
 ICE_MINING_INTERRUPTED_TITLE:0 "Khai Thác Băng Bị Gián Đoạn"
 ICE_MINING_INTERRUPTED_DESC:0 "Do hiện không có nguồn băng nào khả dụng, nỗ lực mở rộng biển cả hành tinh trên [This.GetName] đã bị tạm dừng."
 ICE_MINING_INTERRUPTED_HABITAT_DESC:0 "Do hiện không có nguồn băng nào khả dụng, nỗ lực làm ngập §Y[This.GetName]§! đã bị tạm dừng."
 ICE_MINING_SUCCESS_TITLE:0 "Biển Cả Hành Tinh Đã Được Mở Rộng"
 ICE_MINING_SUCCESS_DESC:0 "Sử dụng băng khai thác từ hệ sao $SYSTEM|Y$, chúng ta đã mở rộng thành công biển cả hành tinh của [This.GetName]."
 ICE_MINING_SUCCESS_BUT_EXHAUSTED_DESC:0 "$ICE_MINING_SUCCESS_DESC$\n\nNguồn cung cấp băng từ nguồn này hiện đã cạn kiệt, và §Y$sm_ice_mining_station$§! đã được dỡ bỏ."
 ICE_MINING_HABITAT_SUCCESS_TITLE:0 "Môi Trường Sống Đã Được Làm Ngập"
 ICE_MINING_HABITAT_SUCCESS_DESC:0 "Sử dụng băng được khai thác từ hệ sao $SYSTEM|Y$, chúng ta đã làm ngập thành công §Y[This.GetName]§!, biến nó thành môi trường sống dưới nước lý tưởng cho cư dân Thủy Tộc của chúng ta."
 ICE_MINING_HABITAT_SUCCESS_BUT_EXHAUSTED_DESC:0 "$ICE_MINING_SUCCESS_HABITAT_DESC$\n\nNguồn cung cấp băng từ nguồn này hiện đã cạn kiệt, vì vậy §Y$sm_ice_mining_station$§! đã được dỡ bỏ."
 ice_mined_planet:0 "Hành Tinh Bị Khai Thác Băng"
 ice_mined_planet_desc:0 "Hành tinh này gần đây đã bị thu nhỏ, theo đúng nghĩa đen, bởi các hoạt động khai thác băng quy mô lớn."

 decision_flood_habitat:0 "Làm Ngập Môi Trường Sống"
 decision_flood_habitat_desc:0 "Các môi trường sống có thể là nơi lý tưởng cho chúng ta - giá như có đủ nước. Mạng lưới khai thác băng của chúng ta sẽ vận chuyển băng đến [This.GetName], cho phép chúng ta làm ngập môi trường sống."
 decision_flood_habitat_tooltip:0 "Băng sẽ được thu hoạch từ một hệ sao có một §Y$sm_ice_mining_station$§! trên căn cứ sao và được chuyển đến hành tinh này.\nÁp dụng bộ điều chỉnh hành tinh §Y$flooded_habitat$§!."
 flooded_habitat:0 "Môi Trường Sống Bị Làm Ngập"
 flooded_habitat_desc:0 "Môi trường sống này đã được bơm đầy nước, mô phỏng hoàn hảo môi trường tự nhiên của các loài Thủy Tộc."
 flooded_habitat_tooltip:0 "Khả năng sinh sống: §R-20%§!\nĐược coi là một thế giới §YĐại Dương§! đối với các loài §YThủy Tộc§!."

 # Ocean Paradise Origin
 origin_ocean_paradise:0 "Thiên Đường Đại Dương"
 origin_ocean_paradise_desc:0 "Kể từ khi sinh ra, nền văn minh này đã tận hưởng hòa bình trong một môi trường hào phóng với nguồn tài nguyên dồi dào. Tự hào về sự dồi dào của thế giới quê hương, họ không bao giờ thấy cần phải mở rộng vượt ra ngoài biên giới đại dương của mình."
 origin_ocean_paradise_effects: "- $SPECIES_TRAITS$ ['trait:trait_aquatic']$TABBED_NEW_LINE$- $HOMEWORLD$$TABBED_NEW_LINE$- ['concept_pc_ocean'] (Quy mô hành tinh: £planetsize£ 30)$TABBED_NEW_LINE$- $PLANETARY_MODIFIERS$ ['concept_ocean_paradise_mod']$TABBED_NEW_LINE$- $PLANETARY_FEATURES$ ['concept_crystal_reef']\n- ['concept_guaranteed_colonies']: Được thay thế bằng ['concept_pc_frozen', Thế Giới Băng Giá]"
 origin_ocean_machines: "Máy Móc Dưới Nước"
 origin_ocean_machines_desc: "Kể từ khi được tạo ra, nền văn minh máy móc này đã nghiên cứu sâu vào thế giới dưới nước, tối ưu hóa các cơ chế hoạt động của mình để phát triển mạnh mẽ trong các vực thẳm đại dương."
 origin_ocean_machines_effects: "- $SPECIES_TRAITS$ ['trait:trait_robot_aquatic']$TABBED_NEW_LINE$- $HOMEWORLD$$TABBED_NEW_LINE$- ['concept_pc_ocean'] (Quy mô hành tinh: £planetsize£ 30)$TABBED_NEW_LINE$- $PLANETARY_MODIFIERS$ ['concept_ocean_paradise_mod']$TABBED_NEW_LINE$- $PLANETARY_FEATURES$ ['concept_crystal_reef']\n- ['concept_guaranteed_colonies']: Được thay thế bằng ['concept_pc_frozen', Thế Giới Băng Giá]"

 START_SCREEN_OCEAN_PARADISE:0 "\"Niềm vui cho những ai có được sự khôn ngoan của việc chấp nhận.\" Một câu tục ngữ phổ biến trong xã hội [Root.GetAdj] như vậy. Sự dồi dào của cuộc sống ở khắp mọi nơi, một khi người ta học cách trân trọng nó. Trong những vùng nước như vậy, chúng ta đã phát triển thịnh vượng từ lâu.\n\nNhưng các bậc trưởng lão của chúng ta không cảm nhận được sự đình trệ. Họ nhầm lẫn bản năng sinh tồn của chúng ta với sự thiếu kiên nhẫn. Nếu chúng ta không tìm kiếm sự thay đổi, sự thay đổi sẽ tìm đến chúng ta, và chúng ta sẽ không kịp chuẩn bị. Chúng ta không thể đơn độc trong vũ trụ bao la này. Để giữ gìn mái nhà của mình, một số người trong chúng ta phải hạ quyết tâm rời bỏ nó.\n\nNhững chuyến lặn xuống Vực Thẳm đã chứng minh là rất đáng giá. Xác tàu dị thường, được trục vớt đầy hiểm nguy, đã thúc đẩy một chuỗi các đột phá công nghệ. Cuối cùng, chúng ta đã sẵn sàng hành trình vượt ra ngoài các đại dương của mình, để thám hiểm, để nhìn thấy, để học hỏi và để bảo vệ."
 START_SCREEN_OCEAN_PARADISE_HIVE:0 "\"Niềm vui cho những ai có được sự khôn ngoan của việc chấp nhận.\" Sự phong phú của sự sống ở khắp xung quanh chúng ta trong làn nước ấm áp của quê hương. Bầy đàn đã phát triển mạnh mẽ mà không cần phải nhìn ra ngoài biên cương đại dương, nhưng giờ đây các vì sao đang vẫy gọi chúng ta gieo mầm sự sống khắp vũ trụ."
 START_SCREEN_OCEAN_PARADISE_ROBOT: "Từ lâu chúng ta [Root.GetAdj] đã có thể tận hưởng sự yên bình của đại dương, và các khung thân của chúng ta dường như được tối ưu hóa cho sự tồn tại dưới nước.\n\nNhưng sự tồn tại là một dòng xoáy, và nếu không thích nghi, chúng ta sẽ rơi vào trì trệ. Chúng ta không thể chắc chắn rằng mình đơn độc trong vũ trụ này, và thế giới quê hương của chúng ta là một viên ngọc có nguy cơ bị tước đoạt.\n\nChúng ta đã ở trong một ao nước nhỏ, được tinh vân của chúng ta bảo vệ, nhưng điều đó không còn nữa. Với việc áp dụng [GetStartingDrive], chúng ta đã sẵn sàng giương buồm ra những vùng biển sao vô tận."

 ocean_paradise:0 "Thiên Đường Đại Dương"
 ocean_paradise_desc:0 "Hiếm có thế giới nào sở hữu những điều kiện may mắn đến vậy. Các nguồn tài nguyên phong phú, trù phú của nó có thể nâng đỡ cả một nền văn minh."
 ocean_paradise_hive:0 "$ocean_paradise$"
