 tech_weaver_buffer_4_desc: "Các luồng sinh chất thích ứng cao nhắm mục tiêu sửa chữa những hư hại nghiêm trọng đồng thời củng cố khả năng phòng thủ của thân tàu."
 tech_weaver_buffer_5: "Bào tử Thông minh Kẻ Dệt Mạng"
