 BIOSHIP_SENSOR_3: "Cảm biến Không gian Phụ"
 BIOSHIP_SENSOR_3_DESC: "Các cơ quan cảm giác phát hiện những biến động không gian phụ sót lại sau đuôi các phi thuyền di chuyển. Độ nhạy và tầm hoạt động của chúng vượt xa bất kỳ cơ quan cảm giác nào từng được phát triển trước đây cho không gian sâu."
