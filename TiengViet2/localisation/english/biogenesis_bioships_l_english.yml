 MAULER_PURSUIT_1: "Cơ quan Tái chế Chuyển hóa"
 MAULER_PURSUIT_1_DESC: "Tái chế các chất hóa học thải ra từ các cơ quan vận động của tàu cho phép tăng cường sức bền bỉ."
 MAULER_PURSUIT_2: "Cơ quan Tái chế Năng lượng"
 MAULER_PURSUIT_2_DESC: "Việc bổ sung các hạt bụi dễ cháy vào đường dẫn tái chế của tàu giúp tăng thêm sức bền."
 MAULER_BITER_1: "Dịch Thể Ăn mòn"
 MAULER_BITER_1_DESC: "Các tuyến cấy ghép làm thay đổi dịch cơ thể của $mauler_class_plural_cap$, khiến chúng có tính ăn mòn và tăng cường khả năng phá hủy."
 MAULER_BITER_2: "Dịch Thể Axit Ăn mòn"
 MAULER_BITER_2_DESC: "Việc đưa khí hiếm vào dịch thể của $mauler_class_plural_cap$ giúp tăng thêm sát thương gây ra, đặc biệt là đối với lớp giáp của tàu địch."
 weapon_type_mandible: "§YCàng Kẹp§!"
 mod_weapon_type_mandible_weapon_damage_mult: "Sát thương Vũ khí Càng Kẹp"
 APPLIED_MODIFIERS_SUPPORT_TITLE: "Hiệu số Áp dụng từ Vũ khí Hỗ trợ:"
 WEAVER_GROWTH_AURA_1: "Pheromone Phát triển"
 WEAVER_GROWTH_AURA_1_DESC: "Kẻ Dệt Mạng tiết ra một chuỗi phức tạp các tín hiệu sinh hóa giúp đẩy nhanh quá trình trưởng thành của các thực thể hữu cơ lân cận. Các pheromone phát triển này nâng cao tốc độ tăng trưởng và khả năng thích ứng, bảo đảm hạm đội tiến hóa nhanh chóng để đáp ứng mọi thử thách."
 WEAVER_GROWTH_AURA_2: "Pheromone Phát triển Quý hiếm"
 WEAVER_GROWTH_AURA_2_DESC: "Kỹ thuật sinh học tinh vi khuếch đại hiệu lực của các pheromone này, đẩy nhanh đáng kể sự sinh trưởng và tối ưu hóa các tàu sinh học đồng minh. Hào quang nâng cấp này bảo đảm hạm đội đạt hiệu suất đỉnh cao với tốc độ phi thường, ngay cả trong chiến trận ác liệt."
 GROWTH_AURA: "$WEAVER_GROWTH_AURA_1$"
 GROWTH_AURA_TT: "§PHào quang này chỉ áp dụng cho Tàu Sinh học có khả năng Sinh trưởng.§!"
 ARKSHIP_GROWTH_AURA: "$WEAVER_GROWTH_AURA_1$"
 ARKSHIP_GROWTH_AURA_DESC: "$WEAVER_GROWTH_AURA_1_DESC$"
 WEAVER_BOOSTER_1: "Bộ Khuếch đại Cộng sinh Cơ bản"
 WEAVER_BOOSTER_1_DESC: "Thiết bị hữu cơ này củng cố mối liên kết giữa các tàu sinh học, tăng cường truyền dẫn năng lượng và phối hợp trên toàn hạm đội. Sự hiện diện của nó bảo đảm cải thiện hiệu quả chiến đấu và quản lý tài nguyên."
 WEAVER_BOOSTER_2: "Bộ Khuếch đại Cộng sinh Nâng cấp"
 WEAVER_BOOSTER_2_DESC: "Là phiên bản cải tiến hơn của bộ khuếch đại cộng sinh, thiết bị này điều chỉnh linh hoạt theo nhu cầu của hạm đội, mang lại hiệu quả và khả năng phản ứng cao hơn. Nó tối ưu hóa năng lực toàn hạm đội, bảo đảm khả năng thích ứng liền mạch trong các hoạt động tác chiến."
 HARBINGER_INCUBATOR_1: "Ma trận Ấp nở"
 HARBINGER_INCUBATOR_1_DESC: "Ma trận tế bào này hình thành xung quanh trứng của phi cơ tấn công đang phát triển, đóng vai trò như một lồng ấp công nghệ sinh học."
 HARBINGER_INCUBATOR_2: "$HARBINGER_INCUBATOR_1$ Cấp tốc"
 HARBINGER_INCUBATOR_2_DESC: "Việc tiếp xúc với khí hiếm trong giai đoạn ấp nở giúp phi cơ tấn công của tàu này trưởng thành nhanh chóng."
 HARBINGER_CHITIN_1: "Chất Điều hòa Sinh trưởng Kitin"
 HARBINGER_CHITIN_1_DESC: "Dịch tiết bên trong khoang chứa kích thích sự phát triển kitin ở phi cơ tấn công đang lớn, củng cố độ bền của chúng."
 HARBINGER_CHITIN_2: "Chất Điều hòa Sinh trưởng Tinh thể"
 HARBINGER_CHITIN_2_DESC: "Cấy các tinh thể hiếm vào khung xương ngoài kitin của phi cơ tấn công mang lại khả năng chống chịu sát thương lớn hơn."
 STINGER_RANGE_1: "Cụm Đo cự ly"
 STINGER_RANGE_1_DESC: "Một cụm thần kinh thứ cấp chuyên dụng để xử lý dữ liệu cảm biến."
 STINGER_RANGE_2: "$STINGER_RANGE_1$ Cải tiến"
 STINGER_RANGE_2_DESC: "Các tinh thể hiếm được nhúng vào vỏ bọc của các đường dẫn thần kinh cho phép tăng cường năng lực xử lý mục tiêu."
 STINGER_FIRE_RATE_1: "Lỗ thở Tản nhiệt"
 STINGER_FIRE_RATE_1_DESC: "Một loạt lỗ thoát nhiệt dọc theo phần ngực của con tàu này cho phép nó xả khí nén ở nhiệt độ cao ra ngoài không gian, cải thiện tốc độ bắn của vũ khí."
 STINGER_FIRE_RATE_2: "Lỗ thở Bụi Dễ cháy"
 STINGER_FIRE_RATE_2_DESC: "Sử dụng các hạt bụi dễ cháy làm môi trường trao đổi nhiệt đòi hỏi một ma trận tế bào chuyên dụng để ngăn chặn bất kỳ vụ nổ ngoài ý muốn nào."
 tech_bio_ship_armor_1: "$tech_ship_armor_1$"
 BIO_ARMOR_1: "$NANOCOMPOSITE_CARAPACE$"
 BIO_ARMOR_1_DESC: "Lớp giáp sinh học tiên tiến này tích hợp các mô hữu cơ dẻo dai với vật liệu cấu trúc nano, tạo nên lớp giáp xác sống có khả năng chịu được những va chạm cực mạnh. Lớp giáp xác thích ứng linh hoạt với sát thương, tái sinh nhanh chóng và mang lại sự bảo vệ vô song cho tàu sinh học."
 SMALL_BIO_ARMOR_1: "$BIO_ARMOR_1$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_1: "$BIO_ARMOR_1$ Cỡ Vừa"
 LARGE_BIO_ARMOR_1: "$BIO_ARMOR_1$ Cỡ Lớn"
 tech_bio_ship_armor_2: "$tech_ship_armor_2$"
 BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$"
 BIO_ARMOR_2_DESC: "Kitin gia cố truyền hợp chất gốm mang lại cho lớp giáp sinh học này độ bền đặc biệt và khả năng chịu nhiệt cao. Cấu trúc phân lớp mang lại sự bảo vệ chắc chắn trong khi vẫn duy trì sự linh hoạt cần thiết cho tàu hữu cơ."
 SMALL_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ Cỡ Vừa"
 LARGE_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ Cỡ Lớn"
 tech_bio_ship_armor_3: "$tech_ship_armor_3$"
 BIO_ARMOR_3: "$PLASTEEL_CARAPACE$"
 BIO_ARMOR_3_DESC: "Lớp giáp sinh học này kết hợp mô hữu cơ dẻo dai với cốt thép dẻo, mang lại sự cân bằng đáng kể giữa sức mạnh và tính linh hoạt. Cấu trúc lai tạo cung cấp khả năng bảo vệ vượt trội trước cả các đòn tấn công động năng lẫn năng lượng, biến nó thành lựa chọn đáng tin cậy cho tàu sinh học."
 SMALL_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ Cỡ Vừa"
 LARGE_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ Cỡ Lớn"
 tech_bio_ship_armor_4: "$tech_ship_armor_4$"
 BIO_ARMOR_4: "Giáp xác Thép Bền"
 BIO_ARMOR_4_DESC: "Được truyền các hợp chất hữu cơ bền bỉ, lớp giáp sinh học này mang lại khả năng chống chịu đặc biệt trước sát thương kéo dài. Cấu trúc lai bảo đảm độ bền vượt trội mà không làm giảm tính linh hoạt của các con tàu sống."
 SMALL_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ Cỡ Vừa"
 LARGE_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ Cỡ Lớn"
 tech_bio_ship_armor_5: "$tech_ship_armor_5$"
 BIO_ARMOR_5: "Giáp xác Neutronium"
 BIO_ARMOR_5_DESC: "Một kỳ quan của kỹ thuật sinh học, lớp giáp xác này kết hợp các sợi neutronium bên trong mô hữu cơ, tạo ra lớp giáp gần như bất khả xâm phạm. Thành phần dày đặc nhưng dễ thích nghi mang lại sự bảo vệ vô song ngay cả trước những thế lực hủy diệt khủng khiếp nhất."
 SMALL_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ Cỡ Vừa"
 LARGE_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ Cỡ Lớn"
 tech_bio_dragon_armor: "$tech_dragon_armor$"
 DRAGON_BIO_ARMOR: "$DRACONIC_CARAPACE$"
 DRAGON_BIO_ARMOR_DESC: "Đỉnh cao của sự tiến hóa giáp sinh học, lớp giáp xác này lấy cảm hứng từ những loài săn mồi đỉnh cao thời cổ đại. Cấu trúc phân lớp kết hợp vật chất hữu cơ tái sinh với hợp kim sinh học gần như không thể phá hủy, tạo nên một hàng phòng thủ hung dữ và bất khuất như chính những sinh vật đã truyền cảm hứng cho nó."
