 BIO_JUMP_DRIVE_1: "Cơ quan Nhảy vọt"
 BIO_JUMP_DRIVE_1_DESC: "Cơ quan Nhảy vọt xé toạc các lỗ hổng cỡ con tàu trong chính kết cấu của thực tại, cho phép di chuyển gần như tức thời giữa các hệ sao. Bản chất của không gian mà con tàu đi qua trong hành trình này vẫn chưa được hiểu rõ."
 BIO_PSI_JUMP_DRIVE_1: "Cơ quan Nhảy vọt Tâm linh"
 BIO_PSI_JUMP_DRIVE_1_DESC: "Cơ quan Nhảy vọt Tâm linh đóng vai trò là điểm hội tụ cho tiềm năng tâm linh của con tàu..."
 tech_bio_hyper_drive_1: "Du hành Siêu Không gian"
 tech_bio_hyper_drive_1_desc: "Giống như những sợi tơ nhện, cõi siêu không gian đa chiều chạy xuyên suốt vũ trụ. Một con tàu có thể tiến vào và lướt qua những luồng này."
 tech_bio_hyper_drive_2: "Điểm Đột phá Tuyến Siêu Không gian"
 tech_bio_hyper_drive_2_desc: "Chúng ta đã xác định được sự tồn tại của những điểm trong không gian nơi một con tàu tiêu tốn ít năng lượng hơn để đi vào các tuyến siêu không gian."
 tech_bio_hyper_drive_3: "Dòng Trượt Siêu Không gian"
 tech_bio_hyper_drive_3_desc: "Thế hệ động cơ siêu không gian mới có khả năng tiếp cận các dòng trượt không gian phụ. Điều này giúp tăng tốc độ di chuyển siêu không gian lên đáng kể."
 tech_bio_jump_drive_1: "$BIO_JUMP_DRIVE_1$"
 tech_bio_jump_drive_1_desc: "$BIO_JUMP_DRIVE_1$ mang tính cách mạng điều khiển thể liên tục không-thời gian cục bộ, cho phép dịch chuyển tức thời giữa các hệ sao."
