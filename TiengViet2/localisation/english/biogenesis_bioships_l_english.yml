 BIO_ARCHAEO_ARMOR: "Giáp xác Xung lực"
 BIO_ARCHAEO_ARMOR_DESC: "Các lớp ion hóa bên trong giáp xác tạo ra một điện tích phản ứng, phân tán năng lượng va chạm thông qua lực đẩy từ tính và các trường phóng chiếu."
