 bio_ship_unique_components: "Cơ quan Phụ trợ"
 bio_ship_unique_components_DESC: "Được nuôi cấy hoặc ghép vào thân tàu sống, các cơ quan phụ trợ này được thiết kế để tinh chỉnh các khả năng độc đáo của tàu sinh học."
 MAULER_STAGE_1_GROWTH_1: "Tuyến Sinh trưởng $ship_growth_stage_1$"
 MAULER_STAGE_1_GROWTH_1_DESC: "Các tuyến được cấy ghép tiết ra hỗn hợp hormone và steroid cực mạnh, thúc đẩy con tàu này tiến lên giai đoạn sinh trưởng tiếp theo."
 MAULER_STAGE_1_GROWTH_2: "Tuyến Sinh trưởng $ship_growth_stage_1$ Cấp tốc"
 MAULER_STAGE_1_GROWTH_2_DESC: "Bằng cách truyền khí hiếm vào các dịch tiết giàu hormone và steroid, cơ quan này đẩy nhanh sự sinh trưởng của tàu sinh học."
