 tech_maulers: "$mauler_class_plural_cap$"
 tech_maulers_desc: "Những đột phá trong kỹ thuật sinh học đã cho phép nuôi cấy các phương tiện du hành vũ trụ, có khả năng FTL với các ứng dụng quân sự."
 TECH_UNLOCK_mauler_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_1$"
 TECH_UNLOCK_mauler_stage_1_CONSTRUCTION_DESC: "§H$mauler_stage_1$§!\n$mauler_class_cap$ là tàu chiến cơ bản nhất, được trang bị vũ khí tầm gần và lớp giáp giáp xác dày đặc."
 tech_mauler_build_speed: "Ấp nở Kẻ Cắn Xé Chuẩn hóa"
 tech_mauler_build_speed_desc: "Các buồng ấp nở này tăng tốc độ thụ thai chiến hạm phôi thai trong những khoang sinh học giàu dinh dưỡng. Dù thô sơ, chúng đánh dấu bước đi đầu tiên hướng tới một hạm đội không phải do lắp ráp mà là được nuôi lớn."
 tech_mauler_build_speed_effect: "$mod_ship_mauler_cost_mult$: §G-5%§!\nTốc độ Chế tạo $mauler_class_cap$: §G+25%§!"
 tech_mauler_growth_1: "Phát triển Kẻ Cắn Xé Cải tiến"
 tech_mauler_growth_1_desc: "Quy trình ấp nở tinh chỉnh làm giảm thời gian trưởng thành và nâng cao tính toàn vẹn cấu trúc của các phi thuyền hữu cơ. Hệ thống cung cấp dưỡng chất tăng cường và hiệu chỉnh gen bảo đảm tàu vừa nhanh nhẹn vừa kiên cường."
 TECH_UNLOCK_mauler_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_2$"
 TECH_UNLOCK_mauler_stage_2_CONSTRUCTION_DESC: "§H$mauler_stage_2$§!\nMột $ship_growth_stage_2$ $mauler_class_cap$ đã được nuôi cấy chọn lọc để hỗ trợ hỏa lực và lớp giáp mạnh mẽ hơn."
 gateway_bio_ships: "§HCon đường Tàu Sinh học§!\n§ECông nghệ này sẽ dẫn đến những bước tiến xa hơn đối với các tàu sinh học mạnh mẽ hơn.§!"
 tech_mauler_growth_2: "Phát triển Kẻ Cắn Xé Tiên tiến"
 tech_mauler_growth_2_desc: "Những cơ sở này sản sinh các con tàu có sức sống và khả năng thích ứng vô song. Ma trận gen tối ưu và hỗ trợ công nghệ sinh học tiên tiến bảo đảm hiệu suất vô địch trong khoảng không vũ trụ."
 TECH_UNLOCK_mauler_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_3$"
 TECH_UNLOCK_mauler_stage_3_CONSTRUCTION_DESC: "§H$mauler_stage_3$§!\nMột $ship_growth_stage_3$ $mauler_class_cap$ là đỉnh cao của $mauler_class_cap$, được bọc giáp dày đặc cùng số lượng lớn vũ khí tầm gần."
 tech_weavers: "$weaver_class_plural_cap$"
 tech_weavers_desc: "Xây dựng trên nền tảng kỹ thuật sinh học sơ khai, Kẻ Dệt Mạng được tạo tác để cân bằng giữa sự nhanh nhẹn với khả năng chiến đấu gia tăng."
 TECH_UNLOCK_weaver_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_1$"
 TECH_UNLOCK_weaver_stage_1_CONSTRUCTION_DESC: "§H$weaver_stage_1$§!\n$weaver_class_cap$ là một tàu sinh học cỡ trung đa năng, được thiết kế để cơ động vượt mặt những kẻ thù lớn hơn và hỗ trợ các trận đụng độ hạm đội."
 tech_weaver_build_speed: "Ấp nở Kẻ Dệt Mạng Chuẩn hóa"
 tech_weaver_build_speed_desc: "Các cơ sở này nuôi dưỡng tàu sinh học cỡ trung trong các khoang sinh học tinh vi, sử dụng việc cung cấp dưỡng chất tăng cường và tối ưu hóa gen để tạo ra những con tàu linh hoạt và thích ứng tốt cho hạm đội."
 tech_weaver_build_speed_effect: "$mod_ship_weaver_cost_mult$: §G-5%§!\nTốc độ Chế tạo $weaver_class_cap$: §G+25%§!"
 tech_weaver_growth_1: "Phát triển Kẻ Dệt Mạng Cải tiến"
 tech_weaver_growth_1_desc: "Những cơ sở này sử dụng các kỹ thuật sinh học nâng cao để đẩy nhanh chu kỳ sinh trưởng và nâng cao khả năng thích ứng của tàu. Ma trận gen cải tiến và môi trường tối ưu bảo đảm các tàu sinh học này vừa bền bỉ vừa phản ứng cực nhanh trong chiến đấu."
 TECH_UNLOCK_weaver_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_2$"
 TECH_UNLOCK_weaver_stage_2_CONSTRUCTION_DESC: "§H$weaver_stage_2$§!\nMột $ship_growth_stage_2$ $weaver_class_cap$ đã được nuôi cấy chọn lọc để nâng cao khả năng cơ động và thích ứng trong các chiến dịch hạm đội."
 tech_weaver_growth_2: "Phát triển Kẻ Dệt Mạng Tiên tiến"
 tech_weaver_growth_2_desc: "Các cơ sở này sản xuất các tàu sinh học có độ chính xác và tính linh hoạt vô song. Kỹ thuật sinh trưởng mang tính cách mạng cùng cải tiến gen thích ứng tạo ra những con tàu phát triển mạnh mẽ ngay cả trong những kịch bản chiến thuật khắc nghiệt nhất."
 TECH_UNLOCK_weaver_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_3$"
 TECH_UNLOCK_weaver_stage_3_CONSTRUCTION_DESC: "§H$weaver_stage_3$§!\nMột $ship_growth_stage_3$ $weaver_class_cap$ đã được nuôi dưỡng tỉ mỉ để đạt được sự nhanh nhẹn vượt trội và tính linh hoạt chiến thuật."
 tech_harbingers: "$harbinger_class_plural_cap$"
 tech_harbingers_desc: "Kẻ Báo Điềm đại diện cho một bước nhảy vọt đáng kể trong chiến tranh công nghệ sinh học, kết hợp hỏa lực ghê gớm với khả năng phục hồi của công nghệ sống. Những con tàu này đóng vai trò là xương sống của hạm đội."
 TECH_UNLOCK_harbinger_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_1$"
 TECH_UNLOCK_harbinger_stage_1_CONSTRUCTION_DESC: "§H$harbinger_stage_1$§!\n$harbinger_class_cap$ củng cố hạm đội bằng cách sinh sản phi cơ tấn công."
 tech_harbinger_build_speed: "Ấp nở Kẻ Báo Điềm Chuẩn hóa"
 tech_harbinger_build_speed_desc: "Những cơ sở này nuôi dưỡng các tàu sinh học lớn, nuôi sống chúng thông qua việc truyền dưỡng chất tiên tiến để bảo đảm khả năng chống chịu và sẵn sàng chiến đấu."
 tech_harbinger_build_speed_effect: "$mod_ship_harbinger_cost_mult$: §G-5%§!\nTốc độ Chế tạo $harbinger_class_cap$: §G+25%§!"
 tech_harbinger_growth_1: "Phát triển Kẻ Báo Điềm Cải tiến"
 tech_harbinger_growth_1_desc: "Các cơ sở tinh chế sử dụng kỹ thuật sinh học phức tạp để đẩy nhanh tốc độ tăng trưởng và nâng cao tính toàn vẹn cấu trúc. Các con tàu tạo ra có sức chịu đựng cao hơn và hiệu quả chiến đấu tăng cường."
 TECH_UNLOCK_harbinger_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_2$"
 TECH_UNLOCK_harbinger_stage_2_CONSTRUCTION_DESC: "§H$harbinger_stage_2$§!\nCác kỹ thuật sinh trưởng tăng cường mang lại những con tàu mạnh mẽ và đáng tin cậy hơn."
 tech_harbinger_growth_2: "Phát triển Kẻ Báo Điềm Tiên tiến"
 tech_harbinger_growth_2_desc: "Hệ thống ấp nở tiên tiến tạo ra các tàu sinh học có độ bền bỉ và hỏa lực đặc biệt. Tinh chỉnh gen và môi trường sinh trưởng ưu việt tạo ra những con tàu có khả năng áp đảo chiến trường với khả năng chống chịu vô song."
 TECH_UNLOCK_harbinger_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_3$"
 TECH_UNLOCK_harbinger_stage_3_CONSTRUCTION_DESC: "§H$harbinger_stage_3$§!\nĐược nuôi cấy để đạt sức mạnh tối đa và ưu thế vượt trội trên chiến trường."
 tech_stingers: "$stinger_class_plural_cap$"
 tech_stingers_desc: "Kẻ Châm Độc được thiết kế để giáng những đòn tàn khốc vào các mục tiêu có giá trị cao. Chúng xuất sắc trong việc khai thác các điểm yếu trong hệ thống phòng thủ của kẻ địch."
 TECH_UNLOCK_stinger_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_1$"
 TECH_UNLOCK_stinger_stage_1_CONSTRUCTION_DESC: "§H$stinger_stage_1$§!\nMột tàu sinh học nhanh nhẹn và chết chóc, được lai tạo cho các đòn tấn công chính xác và ưu thế chiến thuật."
 tech_stinger_build_speed: "Ấp nở Kẻ Châm Độc Chuẩn hóa"
 tech_stinger_build_speed_desc: "Những cơ sở này nuôi dưỡng các tàu sinh học bóng bẩy, nhanh nhẹn, được thiết kế cho độ chính xác và tốc độ. Sử dụng các khoang sinh học tiên tiến cùng dung dịch dinh dưỡng chuyên biệt, chúng tạo ra các con tàu có khả năng tung ra những đòn tấn công chính xác và hiệu quả."
 tech_stinger_build_speed_effect: "$mod_ship_stinger_cost_mult$: §G-5%§!\nTốc độ Chế tạo $stinger_class_cap$: §G+25%§!"
 tech_stinger_growth_1: "Phát triển Kẻ Châm Độc Cải tiến"
 tech_stinger_growth_1_desc: "Các cơ sở tinh chế đẩy nhanh chu kỳ sinh trưởng và cải thiện độ chính xác sinh học, mang lại những con tàu có khả năng cơ động và độ chính xác vượt trội. Những cải tiến này biến Kẻ Châm Độc thành một lực lượng tàn phá trong các trận giao tranh chiến thuật."
 TECH_UNLOCK_stinger_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_2$"
 TECH_UNLOCK_stinger_stage_2_CONSTRUCTION_DESC: "§H$stinger_stage_2$§!\nĐược tinh chỉnh để có tốc độ lớn hơn cùng độ chính xác cao hơn trong các chiến dịch chiến thuật."
 tech_stinger_growth_2: "Phát triển Kẻ Châm Độc Tiên tiến"
 tech_stinger_growth_2_desc: "Đỉnh cao của công nghệ sinh trưởng tàu sinh học, những cơ sở tiên tiến này sản sinh ra những Kẻ Châm Độc có tốc độ và khả năng sát thương vô song. Khuôn mẫu gen tối ưu hóa cùng kỹ thuật ấp nở tối tân bảo đảm những con tàu này làm chủ bất kỳ chiến trường nào với độ chính xác nhanh chóng và chết chóc."
 TECH_UNLOCK_stinger_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_3$"
 TECH_UNLOCK_stinger_stage_3_CONSTRUCTION_DESC: "§H$stinger_stage_3$§!\nĐược nuôi cấy để đạt tốc độ tối thượng, độ chính xác cao độ và sự thống trị chiến trường."
