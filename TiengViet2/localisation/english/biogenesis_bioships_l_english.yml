 concept_biological_ship_desc: "- Tàu sinh học sử dụng các phân lớp tàu chiến chuyên biệt với vai trò được xác định rõ ràng cùng ba giai đoạn sinh trưởng. $NEW_LINE$- Chi phí chế tạo chủ yếu sử dụng $i_food$ thay vì $i_alloys$ $NEW_LINE$- Chi phí bảo trì chủ yếu sử dụng $i_food$ thay vì $i_energy$. $NEW_LINE$- Phụ thuộc vào công nghệ §Y£society£Sinh học§! thay vì công nghệ §Y£engineering£Vũ trụ học§!. $NEW_LINE$$h_line$§LNhững con tàu sống được cấu tạo từ các bó sợi cơ khổng lồ gợn sóng, chứa đầy các bào quan phát quang sinh học giải phóng những hợp chất giàu năng lượng để tạo ra các luồng ánh sáng và nhiệt đẩy tàu tiến về phía trước.§!"
 default_ship: "Tàu Cơ giới"
 bio_ship: "Tàu Sinh học"
 biogenesis_01_shipset_desc: "§HLoại bộ tàu: ['concept_biological_ship', Sinh học]§!\nĐược sinh ra cũng như được chế tạo, những chiến hạm sống này hiện thân cho loài săn mồi đỉnh cao. Khối sinh chất bán tri giác của chúng thích nghi, săn lùng và tấn công với ý chí không bao giờ thỏa mãn."
 biogenesis_02_shipset_desc: "§HLoại bộ tàu: ['concept_biological_ship', Sinh học]§!\nĐược lai tạo cho những kẻ quả cảm, những phi thuyền vỏ cứng này không đơn thuần phục vụ - chúng kiên cường tồn tại, cùng lớn lên bên cạnh những nhà thám hiểm can trường xem chúng là ngôi nhà của mình."
 humanoid_01_shipset_desc: "Cứng cáp và kiên định, những con tàu này được chế tạo để đương đầu với những thử thách nơi không gian sâu. Được thiết kế để chinh phục những điều chưa biết, chúng mang theo hy vọng và ước mơ của những đấng sáng tạo ra chúng đến những vì sao xa xôi nhất."
 synthetics_01_shipset_desc: "Những thiết kế này phản ánh sự thuần khiết của những tâm trí không mệt mỏi. Lớp vỏ tản nhiệt dạng cuộn phân tán năng lượng từ các máy chủ ép xung, đảm bảo vận hành hoàn hảo trong việc mưu cầu hiệu quả tuyệt đối."
 mammalian_01_shipset_desc: "Được đóng để trường tồn, những con tàu đáng gờm này phản chiếu sức bền bỉ của những người tạo ra chúng. Lớp vỏ dày dặn cách nhiệt và bảo vệ, trong khi các hệ thống dự phòng bảo đảm sự sống còn trong những điều kiện khắc nghiệt nhất."
 reptilian_01_shipset_desc: "Vuông vức và thực dụng, thiết kế thô ráp này gợi lên khả năng phục hồi của một kẻ săn mồi. Sự hiện diện của chúng trong khoảng hư không là minh chứng cho sự kiên trì máu lạnh của những kẻ chế tạo ra chúng."
 avian_01_shipset_desc: "Thanh nhã và bóng bẩy, những con tàu đa năng này hiện thân cho vẻ đẹp của sự bay lượn. Từng đường cong và đường viền đều nói lên một loài xem không gian không phải là trở ngại, mà là sự nối dài của bầu trời."
 arthropoid_01_shipset_desc: "Kitin hay thép, hình thức hay công năng - không hề có sự phân biệt. Những con tàu này được đóng không phải để truyền cảm hứng mà để trường tồn, lớp vỏ phân tầng của chúng là minh chứng cho triết lý sinh tồn thuần túy."
 molluscoid_01_shipset_desc: "Thanh thoát mà bền bỉ, những con tàu này vừa là nơi trú ẩn vừa là mũi giáo. Dưới lớp vỏ tôi luyện, các hệ thống phức tạp điều hòa dòng năng lượng và chu trình dinh dưỡng với hiệu quả âm thầm."
 fungoid_01_shipset_desc: "Những con tàu dạng củ tròn này gợi lên vẻ đẹp của những đóa nấm bung nở. Được thiết kế để tự cung tự cấp, các hệ thống chuyên biệt tạo thành mạng lưới nội bộ phức tạp, phản ánh logic của hệ sợi nấm."
 plantoid_01_shipset_desc: "Những con tàu xanh tươi này không chỉ chu du giữa các vì sao - chúng cắm rễ giữa muôn trùng tinh tú. Các khoang quang hợp duy trì sự cân bằng, dung hòa các quần xã sinh vật trên tàu."
 lithoid_01_shipset_desc: "Được tôi rèn qua thời gian và áp lực, những con tàu dạng đá này hiện thân cho sự vĩnh cửu. Ma trận tinh thể silicon gia cố các hệ thống cốt lõi, tiếp nhận sức mạnh từ chính những thế lực kiến tạo nên các thế giới."
 necroid_01_shipset_desc: "Tăm tối và đầy điềm gở, những thánh đường nổi này là đài tưởng niệm cho cái chết và sự tái sinh. Lõi entropy và thiết kế mang tính nghi thức của chúng thì thầm về sức mạnh hư không cùng tham vọng vĩnh hằng."
 nemesis_01_shipset_desc: "Đồ sộ và áp chế, những thiết kế này đòi hỏi sự quy phục. Thượng tầng kiến trúc kiên cố và các hệ thống dự phòng phóng chiếu hào quang của sự thống trị vô song."
 aquatic_01_shipset_desc: "Mềm mại nhưng căng tràn sức sống, những con tàu này dẫn truyền sức mạnh đại dương. Nội thất chứa nước và các đường viền thủy động học hiện thân cho sự thanh lịch của những người tạo ra chúng."
 toxoid_01_shipset_desc: "Những con tàu này rò rỉ khói độc, rung lắc đáng sợ và thách thức mọi quy tắc - nhưng chúng vẫn chạy. Được thúc đẩy bởi phế thải và kết nối bằng sự khéo léo bướng bỉnh, chúng vẫn kiên cường nơi mà những kẻ khác gục ngã."
 cybernetics_01_shipset_desc: "Lớp mạ crom sáng bóng, mạch điện ngân vang, và phản xạ đã trở thành chuyện của quá khứ. Các cổng liên kết thần kinh trực tiếp đồng nghĩa với không có độ trễ, không có giới hạn - chỉ có sự chính xác thuần khiết, công suất tột bậc."
