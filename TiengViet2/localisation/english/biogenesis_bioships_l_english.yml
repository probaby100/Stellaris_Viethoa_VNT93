 BIO_COMBAT_COMPUTER_DEFAULT: "Bản năng Chiến đấu"
 BIO_COMBAT_COMPUTER_DEFAULT_DESC: "Tất cả các tàu sinh học đều có bản năng chiến đấu thô sơ, có khả năng thực hiện các thao tác né tránh và nhắm bắn mục tiêu cơ bản."
 BIO_COMBAT_COMPUTER_BASIC: "Cấy ghép Thần kinh"
 BIO_COMBAT_COMPUTER_BASIC_DESC: "Các bộ cấy ghép này tích hợp trực tiếp với các hệ thống hữu cơ của tàu, cho phép ra quyết định chiến thuật và điều phối hạm đội nhanh chóng."
 BIO_COMBAT_COMPUTER_ADVANCED: "Cấy ghép Thần kinh Tiên tiến"
 BIO_COMBAT_COMPUTER_ADVANCED_DESC: "Một bước tiến hóa của các bộ cấy ghép thần kinh tiêu chuẩn, các hệ thống này tăng cường xử lý chiến thuật và tối ưu hóa thời gian phản ứng trong trận chiến ác liệt."
 BIO_COMBAT_COMPUTER_SAPIENT: "Cấy ghép Thần kinh Có Tri giác"
 BIO_COMBAT_COMPUTER_SAPIENT_DESC: "Các bộ cấy ghép này chứa trí thông minh sinh học có tri giác có khả năng tư duy chiến lược độc lập và khả năng thích ứng chiến thuật chưa từng thấy."
 BIO_COMBAT_COMPUTER_AUTONOMOUS: "Cấy ghép Thần kinh Tự trị"
 BIO_COMBAT_COMPUTER_AUTONOMOUS_DESC: "Các hệ thống này vận hành hoàn toàn tự trị. Được truyền trí tuệ sinh học tự nhận thức, chúng dự đoán các động thái của kẻ thù với độ chính xác lạnh lùng."
 BIO_COMBAT_COMPUTER_PRECOG: "Bản năng Chiến đấu Tiên tri"
 BIO_COMBAT_COMPUTER_PRECOG_DESC: "Khai thác sức mạnh tâm linh, các bộ cấy ghép này cung cấp cho tàu sinh học bản năng tiên tri, cho phép chúng thấy trước các hành động của đối phương và phản ứng ngay lập tức."
