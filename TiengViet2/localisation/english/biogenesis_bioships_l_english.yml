 BIOSHIP_SENSOR_1_DESC: "Các cơ quan cảm giác này sử dụng cơ chế sinh học tương đương RADAR để hoạt động trong không gian sâu, cho phép tàu có khả năng phát hiện và theo dõi cơ bản."
 BIOSHIP_SENSOR_2: "Cảm biến Trọng lực"
 BIOSHIP_SENSOR_2_DESC: "Những cơ quan cảm giác này được phát triển để phát hiện những thay đổi trọng lực trong không gian, chẳng hạn như những thay đổi do sự hiện diện của phi thuyền tạo ra."
