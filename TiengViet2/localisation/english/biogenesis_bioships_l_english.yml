 tech_bio_shields_1: "$tech_shields_1$"
 BIO_SHIELD_1: "Cơ bắp Khiên Chệch hướng"
 BIO_SHIELD_1_DESC: "Mô cơ chuyên biệt tạo ra một trường năng lượng, hình thành một khiên chệch hướng bảo vệ. Mặc dù chúng chỉ có thể hấp thụ một lượng sát thương hạn chế, chúng có khả năng tái tạo nhanh chóng."
 SMALL_BIO_SHIELD_1: "$BIO_SHIELD_1$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_1: "$BIO_SHIELD_1$ Cỡ Vừa"
 LARGE_BIO_SHIELD_1: "$BIO_SHIELD_1$ Cỡ Lớn"
 tech_bio_shields_2: "$tech_shields_2$"
 BIO_SHIELD_2: "Cơ bắp Khiên Chệch hướng Cải tiến"
 BIO_SHIELD_2_DESC: "Mô cơ tinh chỉnh dẫn truyền năng lượng hiệu quả hơn, tăng cường khiên chệch hướng. Các hệ thống nâng cao này hấp thụ nhiều sát thương hơn và nạp lại nhanh hơn, mang lại khả năng bảo vệ tốt hơn trong giao chiến kéo dài."
 SMALL_BIO_SHIELD_2: "$BIO_SHIELD_2$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_2: "$BIO_SHIELD_2$ Cỡ Vừa"
 LARGE_BIO_SHIELD_2: "$BIO_SHIELD_2$ Cỡ Lớn"
 tech_bio_shields_3: "$tech_shields_3$"
 BIO_SHIELD_3: "Cơ bắp Khiên Bảo vệ"
 BIO_SHIELD_3_DESC: "Công nghệ khiên sinh học tiên tiến này tích hợp các mô dẫn năng lượng được gia cố với khả năng bảo vệ nâng cao. Nó mang lại khả năng chống chịu mạnh mẽ trước cả các đòn tấn công năng lượng lẫn động năng, bảo đảm khả năng phòng thủ thích ứng cho tàu sinh học trong các tình huống chiến đấu khác nhau."
 SMALL_BIO_SHIELD_3: "$BIO_SHIELD_3$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_3: "$BIO_SHIELD_3$ Cỡ Vừa"
 LARGE_BIO_SHIELD_3: "$BIO_SHIELD_3$ Cỡ Lớn"
 tech_bio_shields_4: "$tech_shields_4$"
 BIO_SHIELD_4: "Cơ bắp Khiên Bảo vệ Nâng cao"
 BIO_SHIELD_4_DESC: "Đỉnh cao của công nghệ khiên sinh học, hệ cơ gia cố này dẫn truyền năng lượng hiệu quả hơn, nâng cao sức mạnh của khiên. Nó mang lại sự bảo vệ vững chắc trước cả các đòn tấn công năng lượng lẫn động năng, bảo đảm khả năng phòng thủ toàn diện trong chiến đấu."
 SMALL_BIO_SHIELD_4: "$BIO_SHIELD_4$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_4: "$BIO_SHIELD_4$ Cỡ Vừa"
 LARGE_BIO_SHIELD_4: "$BIO_SHIELD_4$ Cỡ Lớn"
 tech_bio_shields_5: "$tech_shields_5$"
 BIO_SHIELD_5: "Cơ bắp Khiên Cường hóa"
 BIO_SHIELD_5_DESC: "Các mô siêu thích ứng dẫn truyền những dòng năng lượng khổng lồ, tạo ra một hàng phòng thủ gần như bất khả xâm phạm. Hệ thống tiên tiến này tái tạo nhanh chóng, giữ cho tàu sinh học luôn được bảo vệ ngay cả dưới những cuộc tấn công dồn dập không ngừng."
 SMALL_BIO_SHIELD_5: "$BIO_SHIELD_5$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_5: "$BIO_SHIELD_5$ Cỡ Vừa"
 LARGE_BIO_SHIELD_5: "$BIO_SHIELD_5$ Cỡ Lớn"
 tech_bio_dark_matter_deflector: "$tech_dark_matter_deflector$"
 DARK_MATTER_BIO_DEFLECTOR: "Cơ bắp Truyền Vật chất Tối"
 DARK_MATTER_BIO_DEFLECTOR_DESC: "Hệ thống khiên sinh học tối tân này tích hợp vật chất tối vào các mô hữu cơ, tăng cường đáng kể tính dẫn năng lượng và khả năng phòng thủ. Việc truyền chất ngoại lai này cho phép hệ cơ tạo ra những chiếc khiên có sức mạnh vô song, có khả năng chịu được mức độ trừng phạt phi thường."
 SMALL_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ Cỡ Nhỏ"
 MEDIUM_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ Cỡ Vừa"
 LARGE_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ Cỡ Lớn"
 tech_bio_psionic_barrier: "$tech_psionic_barrier$"
 PSI_BIO_SHIELD: "Cơ bắp Truyền Zro"
 PSI_BIO_SHIELD_DESC: "Được truyền chất Zro có hoạt tính tâm linh, hệ cơ tiên tiến này tạo ra những chiếc khiên với độ chính xác và khả năng thích ứng vô song. Các đặc tính độc đáo của nó nâng cao cả khả năng chống chịu lẫn năng lực tái tạo của khiên sinh học, cung cấp một mức độ phòng thủ gần như siêu nhiên."
 SMALL_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ Cỡ Nhỏ"
 MEDIUM_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ Cỡ Vừa"
 LARGE_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ Cỡ Lớn"
 tech_bio_psionic_shield: "$tech_psionic_shield$"
 PSI_BIO_BARRIER: "Mô Cộng hưởng Tâm linh"
 PSI_BIO_BARRIER_DESC: "Tấm khiên sinh học phi thường này khai thác năng lượng tâm linh thông qua các mô được nuôi cấy đặc biệt, tạo ra các hệ thống phòng thủ thích ứng với các mối đe dọa đang đến với độ chính xác kỳ lạ. Sự cộng hưởng khuếch đại sức mạnh của khiên và tăng tốc độ tái tạo, biến nó thành một biện pháp bảo vệ mạnh mẽ trước ngay cả những cuộc tấn công khó lường nhất."
 SMALL_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ Cỡ Nhỏ"
