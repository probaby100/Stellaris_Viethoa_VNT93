 LARGE_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ Cỡ Lớn"
 tech_bio_archaeoshield: "$tech_archaeoshield$"
 BIO_ARCHAEO_SHIELD: "Mô Trường Đình trệ"
 BIO_ARCHAEO_SHIELD_DESC: "Bằng cách nuôi cấy các mô phóng khiên xung quanh các nốt cổ vật cổ xưa, công nghệ này tạo ra các trường đình trệ làm chậm thời gian tại điểm va chạm. Sự chậm trễ này giúp tăng cường khả năng tiêu tán năng lượng từ các đòn tấn công đang đến của khiên, cải thiện đáng kể khả năng phòng thủ bền bỉ."
