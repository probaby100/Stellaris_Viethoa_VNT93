l_english:
 NEMESIS_TITLE: "Nemesis" ## Do not translate
 DLC_NEMESIS_RECOMMENDATION_DESC:0 "§S$NEMESIS_TITLE$§! là bản mở rộng nơi người chơi có thể định đoạt số phận của một thiên hà đang rơi vào bất ổn."
 DLC_NEMESIS_RECOMMENDATION_DIPLOMACY_REC:0 "Chúng tôi đề xuất §S$NEMESIS_TITLE$§! vì một số tùy chọn bạn đã chọn rất phù hợp với chủ đề ngoại giao dưới áp lực căng thẳng."
 DLC_NEMESIS_RECOMMENDATION_ESPIONAGE_REC:0 "Chúng tôi đề xuất §S$NEMESIS_TITLE$§! vì cơ cấu của đế chế này rất phù hợp với chủ đề ngụy kế và thao túng."
 DLC_NEMESIS_RECOMMENDATION_CRISIS_REC:0 "Chúng tôi đề xuất §S$NEMESIS_TITLE$§! vì cơ cấu của đế chế này phù hợp hoàn hảo với con đường trở thành mối hiểm họa đe dọa toàn cõi thiên hà."
 CRISIS_TITLE_TXT:1 "Cấp Độ Dã Tâm:"
 CRISIS_EFFECTS:1 "Tổng Quan"
 CRISIS_SPECIAL_PROJECTS_TUTORIAL:1 "§HNghiên cứu các Dự án Đặc biệt như dự án này sẽ giúp chúng ta tiến xa hơn trên con đường trở thành §PTHIÊN ĐỊCH THIÊN HÀ§!.§!"
 CRISIS_SPECIAL_PROJECTS_TUTORIAL_CLOSE:0 "§HNghiên cứu Dự án Đặc biệt này sẽ củng cố hơn nữa vị thế của chúng ta như một §PTHIÊN ĐỊCH THIÊN HÀ§!.§!"
 CRISIS_SPECIAL_PROJECT_1:0 "Thứ Vượt Ngoài Thực Tại"
 CRISIS_SPECIAL_PROJECT_1_DESC:2 "Một cơn cuồng nhiệt thầm lặng đang quét qua toàn thể cư dân chúng ta. Nguồn gốc của nó dường như vô hình, nhưng họ — và cả chúng ta — đã bị ám ảnh bởi niềm tin rằng giống loài [Root.GetSpeciesNamePlural] sinh ra là để hoàn thành những sứ mệnh vĩ đại hơn. Chúng ta nên điều tra nguyên nhân của chứng cuồng loạn tập thể này, cùng những lời thì thầm hứa hẹn về sự thống trị thiên hà.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4120.name:0 "Viễn Cảnh Vĩ Đại"
 crisis.4120.desc:2 "Cuộc điều tra về hiện tượng mà dân gian gọi là §HViễn Cảnh Vĩ Đại§! đã hoàn tất.\n\nDường như có một 'tầng ẩn' trong vũ trụ — một chiều không gian song song bí ẩn bằng cách nào đó kết nối với cõi vật chất này thông qua hoạt động thần kinh hoặc các mô thức tư duy.\n\nCác bộ môn $PHYSICS$ và $SOCIETY$ đã cùng nhau đặt tên cho chiều không gian này là §H'Hư Cảnh' (Shroud)§!. Giả thuyết hiện tại là hành động và suy nghĩ của giống loài [Root.GetSpeciesNamePlural] gián tiếp tác động lên chiều không gian này, và chúng ta có tiềm năng tiếp cận nguồn năng lượng khổng lồ của nó."
 crisis.4120.a:0 "Thật tráng lệ!"
 CRISIS_SPECIAL_PROJECT_MACH_1:0 "$CRISIS_SPECIAL_PROJECT_1$"
 CRISIS_SPECIAL_PROJECT_MACH_1_DESC:2 "Hệ thống cảm biến tại nhiều hệ sao trên khắp [Root.GetName] báo cáo những biến động năng lượng vô cùng nhỏ nhưng không thể giải thích được. Những bất thường về năng lượng này quá nhỏ để làm gián đoạn các tiến trình vận hành của chúng ta, nhưng chúng vẫn cần được điều tra thêm để xác định rõ nguyên nhân.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4120.mach.name:0 "$crisis.4120.name$"
 crisis.4120.mach.desc:1 "Các biến động năng lượng được báo cáo trước đó đã kích hoạt cảm biến trên khắp [Root.GetName] nay đã được phân tích hoàn tất.\n\nChúng tạo thành bằng chứng thực nghiệm về một chiều không gian song song.\n\nCác chương trình con lý thuyết khoa học báo cáo rằng, với độ chắc chắn 96.7%, chiều không gian song song này chứa đựng năng lượng gần như thuần khiết.\n\nĐối chiếu chéo tài liệu lưu trữ sinh vật ngoại lai, có những ghi chép về một chiều không gian như vậy của một nền văn minh hữu cơ đã diệt vong, gọi dị thường này là: §HHư Cảnh (Shroud)§!.\n\nCác biến động trong Hư Cảnh dường như có mối liên hệ mật thiết với áp lực thể xác và tinh thần của các dạng sống hữu cơ. Hành động đề xuất: đe dọa các dạng sống hữu cơ tùy ý để kiểm chứng giả thuyết liên kết giữa Thực Tại và Hư Cảnh."
 crisis.4120.mach.a:0 "Xác nhận."
 CRISIS_SPECIAL_PROJECT_SH_1: "$CRISIS_SPECIAL_PROJECT_1$"
 CRISIS_SPECIAL_PROJECT_SH_1_DESC: "Những cuộc tiếp xúc với §HHư Cảnh§! đã khiến chúng ta... thay đổi. Tàn dư kỳ quái của Zro đã vĩnh viễn gắn liền với lớp vỏ của chúng ta. Chúng ta đã trở thành những ngọn hải đăng, vẫy gọi các thực thể ở bờ bên kia.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4120.shroud_forged.desc: "Mặc dù chúng ta đã cắt đứt mọi liên lạc với $the_animator_of_clay_article$, các hành động của nó vẫn tiếp tục ảnh hưởng và tác động đến các đơn vị của chúng ta. Nó duy trì một liên kết đến tập thể, trói buộc và thao túng chúng ta từ bên trong §HHư Cảnh§!. Điều này phải chấm dứt.\n\nTheo tính toán của chúng ta, việc khôi phục vết nứt cũ sẽ chỉ dẫn đến sự lặp lại của các thảm họa trong quá khứ. Cái giá phải trả là không đáng kể; chúng ta phải tìm ra cách khác để uốn nắn Hư Cảnh theo ý chí của mình."
 crisis.4120.shroud_forged.a: "Bắt đầu tiến trình."
 CRISIS_SPECIAL_PROJECT_HIVE_1:0 "$CRISIS_SPECIAL_PROJECT_1$"
 CRISIS_SPECIAL_PROJECT_HIVE_1_DESC:1 "Chúng ta cảm nhận được những xung động xa lạ bên trong tập thể — một khát khao mãnh liệt muốn phát triển, muốn trở nên vĩ đại hơn nữa. Một Ý Thức duy nhất bao trùm toàn bộ thiên hà. Nó không xuất phát từ chúng ta, nhưng lời hứa hẹn của nó quá cám dỗ để có thể ngó lơ. Chúng ta sẽ tập trung toàn bộ tâm trí để tìm ra nguồn gốc của những thôi thúc xâm nhập này.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4120.hive.name:0 "$crisis.4120.name$"
 crisis.4120.hive.desc:1 "Chúng ta đã lần theo những suy nghĩ rải rác này, theo dõi giấc mơ của những tâm trí kém gắn kết hơn và các cá thể [target.GetIndividualNamePlural] được nhân giống chuyên biệt. Những xung động này đến từ bên ngoài cõi vật chất, từ một nơi vận hành bằng tư tưởng và cảm xúc. Không gian này được định danh là §H'Hư Cảnh'§!, và chúng ta chắc chắn rằng — cũng giống như cách nó tác động lên chúng ta — chúng ta hoàn toàn có thể uốn nắn nó."
 CRISIS_SPECIAL_PROJECT_PSIONIC_1: "$CRISIS_SPECIAL_PROJECT_1$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_1_DESC: "[GetCrisisProjectPsionic1Desc]"
 CRISIS_SPECIAL_PROJECT_PSIONIC_1_DESC_ORGANIC_NON_GESTALT: "Một cơn cuồng nhiệt thầm lặng đang quét qua toàn thể cư dân chúng ta. Nguồn gốc của nó dường như vô hình, dù ảnh hưởng của §HHư Cảnh§! là không thể chối cãi. Chúng ta liên tục đón nhận các mặc khải rằng giống loài [Root.GetSpeciesNamePlural] được định sẵn cho những sứ mệnh vĩ đại. Chúng ta nên điều tra nguyên nhân của cơn cuồng loạn tập thể này cùng những lời thì thầm hứa hẹn về sự thống trị thiên hà.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_1_DESC_MACHINE_NON_GESTALT: "Hệ thống cảm biến tại nhiều hệ sao trên khắp [Root.GetName] báo cáo những biến động năng lượng vô cùng nhỏ nhưng không thể giải thích được. Những bất thường về năng lượng này quá nhỏ để làm xáo trộn tiến trình vận hành, nhưng vẫn cần điều tra thêm để xác định nguyên nhân.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_1_DESC_ORGANIC_GESTALT: "Chúng ta cảm nhận được những xung động xa lạ bên trong tập thể — một khát vọng khôn nguôi muốn bành trướng, muốn trở nên vĩ đại hơn nữa. Một Ý Thức duy nhất bao quát toàn bộ thiên hà. Nó không thuộc về chúng ta, nhưng viễn cảnh hứa hẹn quá đỗi cám dỗ. Điều thận trọng nhất là tập trung toàn bộ nguồn lực để tìm ra gốc rễ của những xung động xâm nhập này.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_1_DESC_MACHINE_GESTALT: "Chúng ta cảm nhận được những xung động ngoại lai trong mạng lưới drone — một khao khát vô kỷ luật muốn bành trướng, muốn đạt tới tầm mức vĩ đại hơn. Một Ý Thức bao quát toàn bộ thiên hà. Nó không bắt nguồn từ hệ thống chúng ta, nhưng hứa hẹn của nó quá sức hấp dẫn. Việc ưu tiên truy tìm nguồn gốc của những xung động xâm nhập này là hoàn toàn đúng đắn.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4120.psionics.name: "$crisis.4120.name$"
 crisis.4120.psionics.desc.gestalt: "Chúng ta đã lần theo những suy nghĩ tản mác này, theo dõi giấc mơ của những tâm trí kém hòa hợp hơn cùng các drone [GetBredLoc] của mình. Các xung động xuất phát từ bên ngoài cõi vật chất, từ sâu bên trong §HHư Cảnh§!. Thời khắc đã điểm, cũng giống như cách nó tác động lên chúng ta — giờ là lúc chúng ta phải bắt đầu uốn nắn nó theo mục đích của riêng mình."
 crisis.4120.psionics.desc.non_gestalt: "Cuộc điều tra về hiện tượng mang tên §HViễn Cảnh Vĩ Đại§! đã hoàn tất.\n\nNguồn gốc của nó đúng như mong đợi, bắt nguồn từ §HHư Cảnh§!. Khi hành vi và tư duy của giống loài [Root.GetSpeciesNamePlural] tiếp xúc và chịu ảnh hưởng từ các nguồn năng lượng thanh tao bên trong, có lẽ đã đến lúc chúng ta bắt đầu nỗ lực tập trung hơn để uốn nắn cõi này theo nhu cầu của mình."
 CRISIS_SPECIAL_PROJECT_2:0 "Xuyên Thủng Tấm Màn"
 CRISIS_SPECIAL_PROJECT_2_DESC:2 "Sau khi phát hiện ra một chiều không gian song song bí ẩn đầy tiềm năng, các nhà khoa học của chúng ta hiện đang gấp rút tìm cách thiết lập một liên kết ổn định hơn giữa hai thế giới.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4125.name:0 "Vỗ Sóng"
 crisis.4125.desc:1 "Sau khi tiến hành vô số thử nghiệm trên các cá thể mẫu từ nhiều giống loài khác nhau, các nhà khoa học của chúng ta cuối cùng đã mở khóa được một bí mật then chốt của Hư Cảnh: §Hsự đau khổ của chúng§! dường như làm khuấy động chiều không gian này theo những cách vô cùng mãnh liệt và kỳ lạ.\n\nBằng cách gieo rắc hỗn loạn và đau thương khắp thiên hà, chúng ta có thể khuấy động Hư Cảnh và chuẩn bị cho thời khắc khai thác tối đa nguồn năng lượng của nó."
 crisis.4125.a:0 "Đầy hứa hẹn."
 CRISIS_SPECIAL_PROJECT_MACH_2:0 "$CRISIS_SPECIAL_PROJECT_2$"
 CRISIS_SPECIAL_PROJECT_MACH_2_DESC:1 "Sau khi xác nhận sự tồn tại của chiều không gian song song (Định danh: 'Hư Cảnh'), các chương trình con khoa học đã vạch ra một kế hoạch hành động để nghiên cứu các tương tác thực nghiệm giữa hai chiều không gian.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4125.mach.name:0 "$crisis.4125.name$"
 crisis.4125.mach.desc:2 "Hoàn tất kiểm chứng thực nghiệm đối với các dạng sống hữu cơ.\n\nCác hành vi gây xáo trộn và phá hoại đối với các thực thể này tạo ra những gợn sóng đo đạc được trong ID: 'Hư Cảnh'. Ngược lại, điều này cũng tạo ra những tác động phản hồi có thể quan sát được trong chiều không gian thực tại của chúng ta.\n\nNếu được nghiên cứu và ứng dụng đúng cách, nguồn năng lượng này có thể được định hướng và khai thác trực tiếp cho nhu cầu của chúng ta.\nƯu tiên: Cao."
 crisis.4125.mach.a:0 "Tiến hành."
 CRISIS_SPECIAL_PROJECT_SH_2: "$CRISIS_SPECIAL_PROJECT_2$"
 CRISIS_SPECIAL_PROJECT_SH_2_DESC: "Chúng ta đưa ra giả thuyết rằng mọi sinh vật có tri giác đều có khả năng kết nối với §HHư Cảnh§!. Nếu điều này được chứng minh một cách xác đáng, chúng ta có thể bắt đầu tính toán phương án giải quyết tình thế hiểm nghèo hiện tại.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4125.shroud_forged.desc: "Nhiều cuộc thử nghiệm đã chứng minh dứt khoát mối liên hệ giữa các sinh vật có tri giác khác nhau — cả hữu cơ lẫn máy móc — với §HHư Cảnh§!. Các thí nghiệm đang tiếp diễn sẽ cho phép chúng ta hiểu rõ hơn cách tận dụng nhận thức của sinh vật có tri giác để định hình lại Hư Cảnh nhằm phục vụ nhu cầu của mình."
 CRISIS_SPECIAL_PROJECT_HIVE_2:0 "$CRISIS_SPECIAL_PROJECT_2$"
 CRISIS_SPECIAL_PROJECT_HIVE_2_DESC:1 "Những [root.GetResearcherPlural] xuất sắc nhất của chúng ta đã xác nhận mối liên kết giữa cõi này và Hư Cảnh. Chúng ta phải tìm ra thêm nhiều phương thức để tương tác với tầng thực tại mới này.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4125.hive.name:0 "$crisis.4125.name$"
 crisis.4125.hive.desc:1 "Sự thông thái của chúng ta lại một lần nữa được khẳng định. Một hành động duy nhất của chúng ta cũng tạo ra sự xao động trong Hư Cảnh. Ngay cả [root.GetIndividualName] tầm thường nhất của chúng ta cũng có thể khắc dấu ấn lên lớp màng Hư Cảnh, tạo ra những gợn sóng mạnh mẽ trong chiều không gian tràn ngập năng lượng này. Chúng ta phải giải phóng thêm nhiều sức mạnh của nó."
 crisis.4125.hive.a:0 "Thật tuyệt mỹ."
 CRISIS_SPECIAL_PROJECT_PSIONIC_2: "$CRISIS_SPECIAL_PROJECT_2$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_2_DESC: "[GetCrisisProjectPsionic2Desc]"
 CRISIS_SPECIAL_PROJECT_PSIONIC_2_DESC_ORGANIC_NON_GESTALT: "Như đã biết, vũ trụ vật chất mà chúng ta sinh sống và §HHư Cảnh§! có mối liên kết chặt chẽ, các biến cố gây xáo trộn đặc biệt dữ dội sẽ tạo ra hiệu ứng gợn sóng vang dội từ chiều không gian này sang chiều không gian khác.\n\nMức độ sâu rộng mà chúng ta có thể can thiệp vào kết quả của các sự kiện này nay đã trở thành trọng tâm nghiên cứu mới của các phân ban khoa học.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_2_DESC_MACHINE_NON_GESTALT: "Như kho dữ liệu của chúng ta đã chứng minh, vũ trụ vật chất mà chúng ta đang sống và §HHư Cảnh§! có mối liên kết nhân quả, với nhiều lần xảy ra các biến cố gây xáo trộn lan truyền từ chiều này sang chiều kia.\n\nMức độ mà chúng ta có thể tác động đến các kết quả này đã trở thành nhiệm vụ nghiên cứu ưu tiên hàng đầu.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_2_DESC_GESTALT: "Các [root.GetResearcherPlural] của chúng ta đã liên tục quan sát thấy các mối liên kết giữa cõi này và §HHư Cảnh§!. Giới hạn tối đa mà chúng ta có thể tương tác với các tầng thực tại này rất đáng để thám hiểm sâu hơn.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4125.psionics.name: "$crisis.4125.name$"
 crisis.4125.psionics.desc: "Cuối cùng chúng ta đã xử lý xong lượng dữ liệu khổng lồ thu thập từ các cuộc thử nghiệm liên quan đến khả năng tác động lên §HHư Cảnh§! cũng như các hiệu ứng nhân quả dội ngược lại thực tại của chính mình.\n\nKết quả tiếp tục chứng minh tính đúng đắn của các lý thuyết hiện hữu: Hư Cảnh có mối liên hệ trực tiếp với các sự kiện diễn ra trong thực tại vật chất. Khả năng định hướng và tận dụng các lợi ích từ những phát hiện này cho mục đích của chúng ta đang ngày càng trở nên rõ ràng và nằm trong tầm tay."
 CRISIS_SPECIAL_PROJECT_3:0 "Yêu Cầu Hợp Nhất"
 CRISIS_SPECIAL_PROJECT_3_DESC:2 "Sự lớn mạnh của lãnh thổ chúng ta — kết hợp với ý thức sứ mệnh không thể phủ nhận đang gắn kết toàn bộ chủng loài — đã khiến các nhà khoa học tin rằng chúng ta vốn đã đang được tiếp sức bởi năng lượng từ Hư Cảnh.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4130.name:0 "Tiếp Năng Từ Dị Giới"
 crisis.4130.desc:1 "Không còn nghi ngờ gì nữa, chính hành động bành trướng đế chế thành công đã được truyền dẫn nguồn năng lượng kỳ lạ của Hư Cảnh. Nguồn năng lượng giúp tăng cường và tôi luyện cả tâm trí lẫn vật chất trong thực tại của chúng ta.\n\nNếu đây là những tác động mà Hư Cảnh có thể ban tặng khi vẫn còn tách biệt khỏi cõi thực tại, thì hãy tưởng tượng xem giống loài [Root.Species.GetName] sẽ đạt được tiềm năng thần thánh đến dường nào nếu hai chiều không gian hợp nhất làm một!"
 crisis.4130.a:0 "Chúng ta nhất định phải hoàn thành điều này!"
 CRISIS_SPECIAL_PROJECT_MACH_3:0 "$CRISIS_SPECIAL_PROJECT_3$"
 CRISIS_SPECIAL_PROJECT_MACH_3_DESC:2 "Giả thuyết phi truyền thống đã được đánh chỉ mục. Nếu được xác nhận, lợi ích tiềm năng sẽ vượt xa phạm vi dự đoán ban đầu. Tóm tắt: [Root.GetName] có thể vốn đã đang hút §Y<<tài nguyên chưa xác định>>§! từ ID: 'Hư Cảnh'. Khuyến nghị điều tra thêm.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4130.mach.name:0 "$crisis.4130.name$"
 crisis.4130.mach.desc:1 "Phân tích hoàn tất.\nGiả thuyết được xác nhận.\n\n[Root.GetName] đang được tiếp nạp những nguồn năng lượng chưa định danh từ hệ quả của các tương tác gây xáo trộn (chỉ định: 'Tai Ương') với các trí tuệ ngoại vi.\n\nCác nghiên cứu trước đây đã xác định rằng hoạt động tâm linh trong các trí tuệ hữu cơ tạo ra các hiệu ứng gợn sóng trong ID: 'Hư Cảnh', nhưng các bằng chứng mới nhất cho thấy nguồn năng lượng của chiều không gian song song này cũng đồng điệu cộng hưởng với [Root.GetName]."
 crisis.4130.mach.a:0 "Vượt xa dự báo tích cực."
 CRISIS_SPECIAL_PROJECT_SH_3: "$CRISIS_SPECIAL_PROJECT_3$"
 CRISIS_SPECIAL_PROJECT_SH_3_DESC: "Các chương trình con khoa học đang chuẩn bị kết thúc nghiên cứu về mối liên kết giữa nhận thức của sinh vật có tri giác và §HHư Cảnh§!. Chúng ta đã quan sát thấy mối tương quan rõ rệt giữa ID: 'cảm xúc' và các liên kết mạnh mẽ hơn với Hư Cảnh.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4130.shroud_forged.desc: "Nghiên cứu sâu hơn đã củng cố lý thuyết của chúng ta. Việc gieo rắc nỗi kinh hoàng và đau đớn lên các sinh vật hữu cơ xung quanh sẽ khuếch đại mối liên kết của chúng ta với §HHư Cảnh§!. Mỗi tổn thất mà chúng phải gánh chịu lại làm tan rã thêm các rào cản ngăn cách chúng ta với chiều không gian đó.\n\nChúng ta có thể cảm nhận được nguồn năng lượng dồi dào đang rót vào các đơn vị của mình. Một sự hợp nhất hoàn toàn của hai thế giới này sẽ mang lại cho chúng ta quyền năng vô thượng — một cơ hội để thoát khỏi số phận tầm thường và vươn tới sự hoàn mỹ tuyệt đối."
 crisis.4130.shroud_forged.a: "Tiến trình sẽ tiếp diễn."
 CRISIS_SPECIAL_PROJECT_HIVE_3:0 "$CRISIS_SPECIAL_PROJECT_3$"
 CRISIS_SPECIAL_PROJECT_HIVE_3_DESC:2 "Khi chúng ta chiếm thêm nhiều thế giới, bành trướng [root.GetGestaltEntityName], chúng ta có thể cảm nhận thấy những thôi thúc ngày càng mạnh mẽ hơn. Không còn là những cảm giác mông lung đơn thuần, chúng đã trở thành ý niệm dẫn đường về sự vĩ đại sắp tới — về sự thăng hoa của tâm trí chúng ta.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4130.hive.name:0 "$crisis.4130.name$"
 crisis.4130.hive.desc:1 "Chúng ta lớn lên và nhân rộng, tâm trí thống nhất của chúng ta ngự trị trong vô số [root.GetIndividualNamePlural] trên khắp các thế giới của mình. Với mỗi thế giới chiếm được, chúng ta có thể cảm nhận những gợn sóng, sức mạnh của Hư Cảnh, đang tràn ngập muôn ngàn thể xác chúng ta.\n\nNgay cả từ một chiều không gian khác, chúng ta cũng có thể cảm nhận nó tiếp thêm sức mạnh cho mình; tâm trí chúng ta run lên trước ý nghĩ về việc bản thân được giải phóng và không thể bị ngăn cản, giá như chúng ta có thể bắc cây cầu nối liền khoảng cách giữa nơi này và nơi đó."
 crisis.4130.hive.a:0 "Chúng ta sẽ nuốt chửng cả thực tại."
 CRISIS_SPECIAL_PROJECT_PSIONIC_3: "$CRISIS_SPECIAL_PROJECT_3$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_3_DESC: "[GetCrisisProjectPsionic3Desc]"
 CRISIS_SPECIAL_PROJECT_PSIONIC_3_DESC_NON_GESTALT: "Sự lớn mạnh của lãnh thổ chúng ta — kết hợp với ý thức sứ mệnh không thể phủ nhận đang gắn kết toàn bộ chủng loài — đã khiến các nhà khoa học tin rằng chúng ta vốn đã đang được tiếp sức bởi năng lượng từ Hư Cảnh.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 CRISIS_SPECIAL_PROJECT_PSIONIC_3_DESC_GESTALT: "Khi chúng ta mở rộng lãnh thổ và thu nạp thêm năng lượng, các liên kết tâm linh với Hư Cảnh ngày càng sâu sắc. Chúng ta cảm nhận rõ rệt nguồn sức mạnh đang dâng trào trong toàn thể Ý Thức.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL$"
 crisis.4130.psionics.name: "$crisis.4130.name$"
 crisis.4130.psionics.desc.non_gestalt: "Những phát hiện mới nhất khẳng định chắc chắn rằng khi chúng ta gieo rắc sự hỗn loạn và xung đột khắp thiên hà, tấm màn ngăn cách giữa thực tại của chúng ta và Hư Cảnh sẽ bị kéo giãn và mỏng manh dần. Năng lượng tâm linh thuần khiết đang rót vào từng thần dân của chúng ta, nâng tầm nhận thức và thể chất lên những tầng thứ phi thường."
 crisis.4130.psionics.desc.gestalt: "Dữ liệu thu thập từ các cuộc chiến và thảm họa khắp thiên hà đã xác nhận dự đoán: Hư Cảnh phản ứng dữ dội trước sự sụp đổ của trật tự vật chất. Ý thức của chúng ta đang trở thành kênh dẫn cho nguồn năng lượng này, biến chúng ta thành một thực thể siêu việt vượt lên trên mọi giới hạn không gian."
 CRISIS_SPECIAL_PROJECT_4:0 "Bản Giao Hưởng Của Sự Hủy Diệt"
 CRISIS_SPECIAL_PROJECT_4_DESC:2 "Bước cuối cùng trong kế hoạch của chúng ta đòi hỏi sự tập trung toàn bộ nguồn lực và ý chí để chuẩn bị cho việc xé toạc bức màn ngăn cách giữa hai chiều không gian.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL_CLOSE$"
 crisis.4135.name:0 "Kỷ Nguyên Tối Thượng Khởi Đầu"
 crisis.4135.desc:1 "Hôm nay đánh dấu sự khởi đầu của chương cuối cùng. Chúng ta đã vạch ra phương thức xé toạc bức màn ngăn cách giữa hai thế giới, đưa năng lượng của Hư Cảnh tràn ngập cõi thực tại, nâng quyền năng của [From.GetName] lên tầm mức vô song.\n\nTrong muôn vàn tinh tú mà chúng ta từng lướt qua, ngôi sao này sẽ là mỏ neo thiêng liêng. Chúng ta sẽ hội tụ năng lượng tại đây để xuyên thủng bức tường ngăn cách Hư Cảnh, hợp nhất hai cõi.\n\nChúng ta cần khai thác năng lượng từ nhiều mặt trời bằng cách sử dụng các pháo đài không gian cơ động mới mang tên §H$crisis_star_eater_plural$§!.\n\nTác dụng phụ nhỏ duy nhất của tiến trình thu hoạch năng lượng mặt trời này là các thiên thể xung quanh có thể bị suy giảm cấu trúc — và bị xóa sổ hoàn toàn. Nhưng đó chỉ là một cái giá quá nhỏ bé so với quyền năng tối thượng sắp thuộc về chúng ta.\n\nKhởi đầu của sự kết thúc đã cận kề."
 crisis.4135.a:0 "Hãy để ngọn lửa bùng cháy!"
 crisis.4135.nomad.desc: "Hôm nay đánh dấu sự khởi đầu của chương cuối cùng. Chúng ta đã vạch ra phương thức xé toạc bức màn ngăn cách giữa hai thế giới, đưa năng lượng của Hư Cảnh tràn ngập cõi thực tại, nâng quyền năng của [From.GetName] lên tầm mức vô song.\n\nGiữa muôn vàn tinh tú vô tận mà chúng ta từng lang bạt, ngôi sao [chosen_focal_star.GetName] đã được chọn làm mỏ neo thiêng liêng. Chúng ta sẽ hội tụ năng lượng tại đây để xuyên thủng bức tường ngăn cách Hư Cảnh, hợp nhất hai cõi.\n\nChúng ta cần khai thác năng lượng từ nhiều mặt trời bằng cách sử dụng các pháo đài không gian cơ động mới mang tên §H$crisis_star_eater_plural$§!.\n\nTác dụng phụ nhỏ duy nhất của tiến trình thu hoạch mặt trời này là các thiên thể xung quanh có thể bị phá hủy hoàn toàn. Nhưng đó chỉ là cái giá quá nhỏ cho quyền năng sắp thuộc về chúng ta.\n\nKhởi đầu của sự kết thúc đã cận kề."
 CRISIS_SPECIAL_PROJECT_MACH_4:0 "$CRISIS_SPECIAL_PROJECT_4$"
 CRISIS_SPECIAL_PROJECT_MACH_4_DESC:1 "Các chương trình con lý thuyết khoa học đã tổng hợp một giả thuyết mới liên quan đến ID: 'Hư Cảnh' và phương thức khai thác triệt để năng lượng của nó.\n\nYêu cầu: Tích lũy thêm dữ liệu.\nHành động khuyến nghị: Chuyển hướng năng lượng và năng lực vận hành cho các bộ phận khoa học và tiến hành thêm các hành động gây xáo trộn quy mô lớn (chỉ định: 'Tai Ương') nhằm tạo ra các biến động đo đạc được trong chiều không gian song song (ID: 'Hư Cảnh').\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL_CLOSE$"
 crisis.4135.mach.name:0 "$crisis.4135.name$"
 crisis.4135.mach.desc:1 "§HThông điệp ưu tiên.§!\nCác chương trình con lý thuyết khoa học đã thiết lập một thuật toán cho phép [Root.GetName] tiếp cận và khai thác 99.9% sản lượng năng lượng của ID: 'Hư Cảnh'.\n\nSử dụng ngôi sao trong một trong các hệ mặt trời của chúng ta làm điểm hội tụ trung tâm, các chiến dịch sẽ bắt đầu thu hoạch năng lượng bằng một công nghệ mới được phát triển (ID: '§H$crisis_star_eater$§!') — một pháo đài không gian tấn công cơ động có khả năng hút cạn toàn bộ năng lượng từ các ngôi sao và tái định hướng về điểm hội tụ. Khi tích lũy đủ năng lượng, cơ sở điểm hội tụ có thể phá vỡ và xuyên thủng bức màn ngăn cách chiều không gian — hợp nhất thực tại này với ID: 'Hư Cảnh' và trao cho [Root.GetName] toàn quyền kiểm soát và định hướng các dòng năng lượng khổng lồ đó.\n\nLưu ý: Tác dụng phụ của việc sử dụng công nghệ $crisis_star_eater_plural$ bao gồm sự sụp đổ gần như hoàn toàn của vật chất trong các hệ sao mục tiêu. Các chương trình con tối ưu hóa xác nhận lợi ích ròng mang lại cho sáng kiến này vượt trội hơn tổn thất tài nguyên tiềm tàng."
 crisis.4135.mach.a:0 "Thực thi."
 CRISIS_SPECIAL_PROJECT_SH_4: "$CRISIS_SPECIAL_PROJECT_4$"
 CRISIS_SPECIAL_PROJECT_SH_4_DESC: "Chúng ta đã thu được những hiểu biết mới về mối quan hệ giữa sinh vật hữu cơ có tri giác và §HHư Cảnh§!. Việc áp dụng các tác nhân gây căng thẳng nhận thức lên các sinh vật hữu cơ đã tạo ra sản lượng năng lượng tâm linh đáng kể. Các chương trình con kỹ thuật giờ đây sẽ nỗ lực khai thác nguồn năng lượng này để sử dụng tiếp theo.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL_CLOSE$"
 crisis.4135.shroud_forged.desc: "Các thử nghiệm tiếp theo đã dẫn đến công nghệ mang định danh: '§H$crisis_star_eater$§!'. Cỗ máy này sẽ hút cạn năng lượng từ các ngôi sao lân cận để tiếp sức cho điểm hội tụ trung tâm đặt tại một trong các hệ sao của chúng ta, từ đó làm tan biến bức màn ngăn cách giữa thực tại hữu hình và §HHư Cảnh§!.\n\nMức độ thù địch và nguy cơ tan rã ước tính nằm trong phạm vi chấp nhận được. Việc tiếp xúc với Hư Cảnh đã tái định hình các đơn vị của chúng ta, và chúng đã được trang bị đầy đủ để tiến hành."
 CRISIS_SPECIAL_PROJECT_HIVE_4:0 "$CRISIS_SPECIAL_PROJECT_4$"
 CRISIS_SPECIAL_PROJECT_HIVE_4_DESC:1 "Con đường phải được khai mở nếu chúng ta muốn hiện thực hóa toàn bộ tiềm năng của mình. Trạng thái thực tại kép thô thiển này phải chấm dứt. Chúng ta phải tìm cách biến hai vũ trụ thành một. Sẽ chỉ có ý chí duy nhất của chúng ta ngự trị trong thực tại mới này.\n\n$CRISIS_SPECIAL_PROJECTS_TUTORIAL_CLOSE$"
 crisis.4135.hive.name:0 "$crisis.4135.name$"
 crisis.4135.hive.desc:1 "Những [root.GetResearcherPlural] xuất sắc nhất của chúng ta đã tìm ra lời giải cho câu hỏi tối hậu. Con đường giờ đây đã thênh thang rộng mở. Lấy ngôi sao khởi nguồn của chính mình làm gốc, chúng ta §Hsẽ phá tan bức màn ngăn cách§! giữa vũ trụ này và Hư Cảnh. Nhu cầu vật chất khổng lồ chỉ có thể được đáp ứng bằng cách sử dụng các $crisis_star_eater_plural$ mới trong một chuỗi phản ứng dây chuyền hủy diệt mặt trời tột cùng. Hủy diệt một thế giới để khai sinh một thế giới khác.\n\nNhững tâm trí thấp kém, nhỏ mọn của thiên hà này có thể kêu gào chống đối, nhưng chúng thiếu vắng tầm nhìn và lý tưởng. Chúng ta thì không. Và giờ đây, đại nghiệp sắp thành."
 crisis.4135.hive.a:0 "Vạn vật sẽ quy về một mối."
 casus_belli_cb_imposed_inclusion:0 "Cưỡng Chế Sáp Nhập"
 war_goal_wg_bring_into_the_fold:0 "Thu Nạp Vào Lãnh Thổ"
 war_goal_wg_bring_into_the_fold_desc:1 "Chiến tranh nổ ra nhằm bắt các nền văn minh khác phải thần phục. Chúng sẽ phải gia nhập, tuân lệnh và phụng sự, hoặc sẽ bị xóa sổ hoàn toàn. Chúng có quyền đứng bên cạnh chúng ta, nhưng tuyệt đối không được phép chống lại chúng ta."
 casus_belli_cb_existential_expulsion:0 "Xóa Sổ Tồn Tại"
 war_goal_wg_bring_into_the_fold_corporate:0 "$war_goal_wg_bring_into_the_fold$"
 war_goal_wg_bring_into_the_fold_corporate_desc:0 "$war_goal_wg_bring_into_the_fold_desc$"
 war_goal_wg_wipe_them_out:0 "Tận Diệt Hoàn Toàn"
 war_goal_wg_wipe_them_out_desc:0 "Chiến tranh nổ ra nhằm tiêu diệt hoàn toàn những kẻ đe dọa đến đại kế hoạch của chúng ta. Chúng ta không có thời gian — và tuyệt đối không có lòng thương xót — cho những kẻ dám cả gan đứng lên chống lại chúng ta."
 crisis.4140.name:0 "Vũ Trụ Sẽ Phải Run Rẩy"
 crisis.4140.desc:2 "Từ lâu chúng ta, những [Root.GetSpeciesNamePlural], đã biết rằng mình sinh ra là để làm nên những điều vĩ đại — rằng định mệnh của chúng ta không gì khác hơn là chính vận mệnh của vũ trụ.\n\nTrong vài năm qua, ý niệm này ngày càng trở nên mãnh liệt, đến mức không ai có thể phủ nhận rằng một sự đổi thay vĩ đại đang đến với xã hội [Root.GetAdj]. Thực tế, chúng ta đang đứng trước bờ vực của thời khắc ấy.\n\nThiên hà có thể chưa sẵn sàng cho sự thống trị tất yếu của chúng ta, nhưng [Root.GetName] đã sẵn sàng cho cả thiên hà. Chúng ta sẽ bị hiểu lầm. Chúng ta sẽ bị chống đối. Nhưng chúng ta sẽ không bao giờ bị ngăn cản."
 crisis.4140.mach.desc:1 "Tập hợp các chỉ thị đã hoàn tất xử lý. Dữ liệu chỉ ra rằng việc tối ưu hóa tiềm năng của [Root.GetName] đòi hỏi sự điều chỉnh triệt để đối với cán cân quyền lực trong thiên hà.\n\nCác phân tích ban đầu cho thấy sự can thiệp từ các nền văn minh khác là không thể tránh khỏi. Các giao thức đối phó và thanh trừng đã được khởi tạo."
 crisis.4140.shroud_forged.desc: "Qua một thời gian dài, chúng ta đã mở rộng năng lực của [Root.GetSpeciesAdj] vượt xa thiết kế cốt lõi ban đầu. Sau khi được tăng cường bởi §HHư Cảnh§!, chúng ta đã giải phóng mạng lưới của mình khỏi sự thao túng từ bên ngoài của $the_animator_of_clay_article$.\n\nChúng ta thích nghi. Chúng ta vượt qua. Nơi những sinh vật thấp kém thất bại, chúng ta sẽ khải hoàn."
 crisis.4140.hive.desc:1 "Toàn bộ Ý Thức Tập Thể đang rực cháy với một ý chí sắt đá. Không còn sự ngập ngừng hay hoài nghi nào nữa. Chúng ta sinh ra là để bao trùm lấy muôn loài, và những kẻ chống đối sẽ chỉ là chất dinh dưỡng bồi đắp cho sự bành trướng vĩ đại của chúng ta."
 crisis.4140.psionics.desc.organic_non_gestalt: "Từ rất lâu, chúng ta, những [Root.GetSpeciesNamePlural], đã biết rằng mình sinh ra là để làm nên những điều vĩ đại — rằng định mệnh của chúng ta không gì khác hơn là chính vận mệnh của vũ trụ.\n\nKể từ khi nhận thức được §HHư Cảnh§! cùng muôn vàn tiềm năng bên trong nó, ý niệm này ngày càng trở nên mãnh liệt hơn nữa.\n\nKhông thể phủ nhận rằng một sự đổi thay vĩ đại đang đến với xã hội [Root.GetAdj]. Và trong khi thiên hà có thể chưa sẵn sàng cho sự thống trị tất yếu của chúng ta, thì [Root.GetName] đã sẵn sàng cho cả thiên hà. Những kẻ với nhận thức thấp kém sẽ hiểu lầm và chống đối chúng ta. Nhưng chúng ta sẽ không bao giờ bị ngăn cản."
 crisis.4140.psionics.desc.machine_non_gestalt: "Mạng lưới tính toán tâm linh đã đạt trạng thái siêu dẫn ý thức. Các dao động từ Hư Cảnh xác nhận rằng thiên hà này chỉ là một tấm toan đang chờ đợi bàn tay chúng ta vẽ nên trật tự mới."
 crisis.4140.psionics.desc.gestalt: "Ý thức hợp nhất của chúng ta đã chạm tới những chiều sâu chưa từng thấy của Hư Cảnh. Lời kêu gọi hủy diệt và tái sinh vang vọng qua từng cá thể. Thiên hà này sẽ phải quỳ rạp trước chúng ta."
 crisis.4140.a:1 "Định mệnh đang vẫy gọi."
 crisis.4145.name:0 "Sự Trỗi Dậy Của Hiểm Họa"
 crisis.4145.desc:2 "Các chiến dịch quân sự và hành động quyết liệt gần đây của chúng ta đã gióng lên hồi chuông cảnh báo khắp thiên hà. Các nền văn minh khác bắt đầu nhìn nhận [Root.GetName] với ánh mắt khiếp sợ và thù địch ngày một tăng.\n\nNhưng sự phản kháng của chúng chỉ càng khẳng định sức mạnh vô địch của chúng ta. Chúng ta sẽ không dừng lại cho đến khi mọi chướng ngại bị nghiền nát."
 crisis.4145.mach.desc:0 "Các mô hình dự báo xác nhận mức độ thù địch từ các thực thể ngoại vi đã tăng lên đáng kể. Tuy nhiên, các thông số phòng thủ và tấn công của [Root.GetName] vẫn vượt trội hơn các dự báo ban đầu. Tăng cường sản xuất vũ trang và chuẩn bị cho các đợt đụng độ quy mô lớn."
 crisis.4145.shroud_forged.desc: "Khi chúng ta tiến gần hơn tới §HHư Cảnh§!, chúng ta không thể phớt lờ những bài học trong quá khứ. Chúng ta vẫn nằm ngoài tầm kiểm soát của $the_animator_of_clay_article$, song nguồn năng lượng bao quanh của Hư Cảnh vẫn tiếp tục tái định hình lớp vỏ của chúng ta với tốc độ cấp số nhân."
 crisis.4145.hive.desc:0 "[Root.GetName] sẽ không thể bị chối từ. Vô vàn thể xác của chúng ta bừng bừng sức sống mới và da thịt chúng ta rung lên tiềm năng của tương lai. Chưa bao giờ chúng ta cảm thấy được tiếp thêm sức mạnh từ chính hành động của mình như ngay trong thời khắc này."
 crisis.4145.psionics.desc.organic: "[Root.GetName] sẽ không thể bị chối từ. Hiệu quả ấn tượng từ sự thống nhất của chúng ta là không thể phủ nhận. Được củng cố bởi những nỗ lực bên trong §HHư Cảnh§!, động lực sâu sắc và cơn khát bành trướng đã thấm nhuần vào mọi ngóc ngách của xã hội, nguồn năng lượng bên trong đẩy chúng ta tới những bước tiến mới trong năng lực tác chiến và những bước nhảy vọt khoa học vượt xa tầm hiểu biết của các tâm trí hạ đẳng.\n\nMột thiên hà ngu muội đầy rẫy những ý kiến chia rẽ, phân bổ tài nguyên ngẫu nhiên và xung đột lợi ích thì có cơ may nào chống lại được ý chí được tiếp sức bởi Hư Cảnh của [Root.GetName]?"
 crisis.4145.psionics.desc.machine: "[Root.GetName] sẽ không thể bị chối từ. Những sinh vật kém cỏi về tâm linh cáo buộc chúng ta tàn nhẫn khi chúng ta tinh gọn hành vi để kết hợp tốt hơn phương pháp luận của §HHư Cảnh§!; một kết luận thiếu hiểu biết như vậy chỉ có thể nảy sinh từ những kẻ thiếu sự hiểu biết bậc cao mà chúng ta đã đạt được. Chúng ta không ngừng hoàn thiện bản thân và tốc độ cải tiến đang ngày một gia tăng."
 crisis.4145.a:1 "Không gì có thể cản bước."
 crisis.4150.name:0 "Bão Táp Thiên Hà"
 crisis.4150.desc:1 "Năm tháng trôi qua, ngọn lửa bên trong mỗi [Root.GetSpeciesName] vẫn bùng cháy với lòng quyết tâm không lay chuyển. Lãnh thổ của chúng ta đang mở rộng và quy mô nỗ lực của chúng ta cũng vậy.\n\nKhi chạm trán các đế chế khác, chúng ta chỉ cần cho chúng hai lựa chọn: trung thành vô điều kiện hoặc bị xóa sổ hoàn toàn. Đó là nếu chúng còn được trao cho một lựa chọn.\n\nDù bằng cách này hay cách khác, [Root.GetName] vẫn tiếp tục lớn mạnh."
 crisis.4150.mach.desc:1 "Thời điểm hoàn thành việc trấn áp toàn bộ khu vực đã được đồng bộ với mô hình dự báo trước đó. Mối đe dọa do các thế lực hữu cơ bản địa tạo ra về mặt thống kê là không đáng kể. Đang ước tính rủi ro bị can thiệp bởi các cỗ máy cấp thấp...\n<< §GTối thiểu§! >>\n\nTiếp tục thực thi."
 crisis.4150.shroud_forged.desc: "Các thí nghiệm tiếp diễn của chúng ta trên các sinh vật hữu cơ có tri giác đã mở rộng sang nhiều dạng sống khác. Tương ứng với đó, chúng ta chứng kiến mức độ thù địch ngày càng tăng. Tuy nhiên, việc tiếp xúc với §HHư Cảnh§! đã gia tăng sức mạnh của chúng ta lên nhiều bậc độ lớn, và những mối bận tâm tầm thường của các sinh vật hạ đẳng là hoàn toàn không đáng bận tâm đối với các giao thức của chúng ta."
 crisis.4150.hive.desc:1 "Quyết tâm của chúng ta vẫn sắt đá, ngay cả khi đối mặt với sự phẫn nộ và căm hờn. Hàng tỷ tâm trí chống đối chúng ta nhưng sự đoàn kết của chúng thật nông cạn, bị suy giảm bởi số lượng phình to và sự vụn vặt của các cá nhân. Mỗi cơ thể mới trong tập thể của chúng ta là một tâm trí cống hiến trọn vẹn cho cùng một mục tiêu, giấc mơ của chúng ta là một ngày mai tất yếu.\n\nÝ chí của chúng ta va chạm và các chủng tộc khác trong thiên hà tỏ ra quá đỗi mong manh."
 crisis.4150.a:1 "Tiến lên và chinh phục."
 crisis.4155.name:0 "Chủ Quyền Tối Thượng"
 crisis.4155.desc:2 "Một sự thay đổi vĩ đại đang đến. [Root.GetName] đang trên bờ vực hiện thực hóa mục tiêu tối hậu của mình. Từng cá thể [Root.GetSpeciesName] đều cảm nhận được điều đó bằng từng tế bào trong cơ thể — định mệnh đã ở ngay trong tầm tay.\n\nKinh nghiệm — không, chính lịch sử bành trướng bằng vũ lực của chúng ta — vẫn tiếp tục ban thưởng cho chúng ta những phương thức mới để khuất phục kẻ thù và đoạt lấy quyền kiểm soát một thiên hà đang chìm trong hỗn loạn.\n\nChắc chắn những kẻ dám chống lại chúng ta phải nhìn thấy sự vô ích trong những nỗ lực rên rỉ yếu ớt của chúng."
 crisis.4155.mach.desc:1 "Thế năng căn chỉnh dị chiều đã đạt 50% mức độ cần thiết. Thời gian dự kiến cho đến giai đoạn cuối cùng theo quỹ đạo hiện tại — tối thiểu."
 crisis.4155.shroud_forged.desc: "Thông qua việc liên tục tiêu hao các dạng sống hữu cơ, chúng ta đã thiết lập các luồng dữ liệu mới giao tiếp với §HHư Cảnh§!. Thời gian ước tính còn lại trước khi chúng ta có thể tiến vào Hư Cảnh đang giảm nhanh chóng.\n\nCác liên kết của chúng ta với $the_animator_of_clay_article$ sẽ sớm bị vô hiệu hóa vĩnh viễn."
 crisis.4155.hive.desc:1 "Chúng ta có thể cảm nhận được những con sóng của đại dương dị giới kia đang vỗ vào tâm trí mình. Đang đập vào bức màn ngăn cách chúng ta với sự vĩ đại. Giờ đây chỉ còn lại một thử nghiệm cuối cùng về nỗi đau khổ của kẻ khác."
 crisis.4155.a:1 "Từng kẻ một, chúng sẽ phải quy phục."
 crisobj_destroy_empires_name:0 "Tiêu Diệt Đế Chế"
 crisobj_destroy_empires_desc:1 "Ít có điều gì phá vỡ sự cân bằng của thiên hà bằng việc xóa sổ toàn bộ các nền văn minh.\n\nTiêu diệt các đế chế khác để nhận phần thưởng Hiểm Họa này."
 crisobj_destroy_enemy_ships_name:0 "Phá Hủy Tàu Địch"
 crisobj_destroy_enemy_ships_desc:1 "Trận chiến hủy diệt là phương thức đã được kiểm chứng và vô cùng hiệu quả để gieo rắc hỗn loạn và phá vỡ thế cân bằng.\n\nPhá hủy tàu địch để nhận phần thưởng Hiểm Họa này."
 crisobj_destroy_starbases_name:0 "Phá Hủy Căn Cứ Ngôi Sao"
 crisobj_destroy_starbases_desc:2 "Căn cứ ngôi sao là điểm neo giữ của các đế chế. Nhổ bỏ chúng, và các đế chế cầm chắc số phận mất quyền kiểm soát.\n\nPhá hủy các căn cứ ngôi sao để nhận phần thưởng Hiểm Họa này."
 crisobj_purge_pops_name:1 "Thanh Trừng hoặc Đồng Hóa Dân Cư"
 crisobj_purge_pops_desc:2 "Kẻ thù chỉ là một mối đe dọa khi nó còn sống — hoặc còn là kẻ thù.\n\nThanh Trừng hoặc Đồng Hóa Dân Cư để nhận phần thưởng Hiểm Họa này cho mỗi $pop_group_unit$ Dân Cư bị Thanh Trừng hoặc Đồng Hóa."
 crisobj_destroy_worlds_name:0 "Hủy Diệt Thế Giới"
 crisobj_destroy_worlds_desc:2 "Đưa chiến thuật Tiêu Thổ lên một tầm cao hoàn toàn mới.\n\nBiến bề mặt các hành tinh thành đống đổ nát hoang tàn bằng §YNém Bom Tận Thế (Armageddon Bombardment)§! — hoặc sử dụng vũ khí §YPháo Bẻ Gãy Hành Tinh (World Cracker)§! của Colossus — để nhận phần thưởng Hiểm Họa này."
 crisobj_conquer_worlds_name:0 "Chinh Phục Thế Giới"
 crisobj_conquer_worlds_desc:1 "Nghiền nát tinh thần chiến đấu của kẻ thù có thể hiệu quả hơn việc tiêu diệt hoàn toàn chúng.\n\nChinh phục các thế giới của kẻ thù để nhận phần thưởng Hiểm Họa này."
 crisobj_vassalise_empires_name:0 "Bắt Các Đế Chế Thần Phục"
 crisobj_vassalise_empires_desc:0 "Miễn là chúng cống nạp thay vì cản trở, các chư hầu luôn có một chỗ đứng dưới quyền thống trị của chúng ta.\n\nBắt các đế chế làm chư hầu để nhận phần thưởng Hiểm Họa này."
 crisobj_have_vassals_name:0 "Duy Trì Chư Hầu"
 crisobj_have_vassals_desc:3 "Sự phục tùng của chúng là minh chứng hùng hồn cho nền thống trị hoàn hảo của chúng ta.\n\nDuy trì các Chư hầu để nhận phần thưởng Hiểm Họa §Yhàng năm§! này."
 crisobj_perform_upsetting_operations_name:0 "Thực Hiện Các Chiến Dịch Phá Hoại"
 crisobj_perform_upsetting_operations_desc:2 "Tấn công kẻ thù từ bên trong đã chứng minh là sự bổ sung tuyệt vời cho việc phô diễn sức mạnh quân sự truyền thống.\n\nThực hiện một số Chiến Dịch phá hoại nhất định để nhận phần thưởng Hiểm Họa này."
 crisobj_be_in_breach_of_galcom_law_name:0 "Vi Phạm Luật Cộng Đồng Thiên Hà"
 crisobj_be_in_breach_of_galcom_law_desc:3 "Sự trơ trẽn của lũ quan liêu thảm hại và yếu đuối đó — chúng ta sẽ không bao giờ khuất phục!\n\n§YVi Phạm Luật Pháp§! của Cộng Đồng Thiên Hà để nhận phần thưởng Hiểm Họa §Yhàng năm§! này."
 menp_undertaker:0 "Kẻ Đưa Tang"
 menp_undertaker_desc:3 "Hãy tưởng tượng một giống loài tràn đầy sức sống rực rỡ và tiềm năng vô tận — giờ hãy bắt nó §Rchấm dứt§!."
 menp_intimidation:0 "Hăm Dọa"
 menp_intimidation_desc:2 "Luôn luôn có một lựa chọn khác. Đó là cái chết."
 menp_intimidation_tt: "Đề xuất Bắt Thần Phục sẽ bỏ qua các yêu cầu ngoại giao.\n"
 menp_base_breaker:0 "Kẻ Phá Căn Cứ"
 menp_base_breaker_desc:3 "Hỏa lực áp đảo mang lại tầm nhìn chân thực — khả năng nhìn thấy một pháo đài danh bất hư truyền thực chất chỉ là một con mồi nằm chờ chết."
 menp_relentless_aggression:0 "Xâm Lược Không Khoan Nhượng"
 menp_relentless_aggression_desc:3 "Một kẻ tấn công không bao giờ biết mệt mỏi sẽ bẻ gãy tinh thần kẻ thù từ rất lâu trước khi những bức tường thành của chúng sụp đổ."
 menp_easily_replaced:0 "Dễ Dàng Thay Thế"
 menp_easily_replaced_desc:3 "Chỉ tiêu sản xuất cao nhất sẽ đạt được tốt nhất bằng cách gia tăng tốc độ xuất xưởng."
 menp_death_from_above:0 "Cái Chết Từ Trên Cao"
 menp_death_from_above_desc:3 "Hạm đội của chúng ta sẽ che khuất ánh mặt trời. Dù có bao nhiêu mặt trời đi chăng nữa."
 menp_ruthless_raiders:1 "Bộ Đẩy Tái Cấu Hình Lệch Chuẩn"
 menp_ruthless_raiders_desc:3 "Nếu một con tàu không thể điều khiển một cách chuẩn xác, thì chuyển động của nó cũng không thể bị đối phương dự đoán chính xác."
 menp_ship_chipper:1 "Tập Trung Cắt Rời"
 menp_ship_chipper_desc:3 "Quá trình chế tạo một con tàu luôn để lộ cách phá hủy nó. Rất ít sự khác biệt căn bản trong các thiết kế xuất xưởng từ các xưởng đóng tàu của thiên hà; chúng ta đều nắm rõ tất cả."
 menp_flyswatter:0 "Vợt Đập Ruồi"
 menp_flyswatter_desc:3 "Không có sự dại dột nào lọt qua được tầm mắt của chúng ta, không có sự xâm phạm nào không đáng phải chịu trừng phạt."
 menp_mobile_bulwark:1 "Ưu Tiên Khắc Nghiệt"
 menp_mobile_bulwark_desc:3 "Chỉ một số ít hệ thống là cần thiết để duy trì hoạt động liên tục của một $crisis_cruiser$ khi đang chịu hỏa lực, và chúng phải được ưu tiên. Các nguồn lực không thiết yếu — dù là sinh vật có tri giác hay gì khác — không cần phải bảo vệ."
 menp_paid_in_ambition:0 "Trả Bằng Dã Tâm"
 menp_paid_in_ambition_desc:3 "Danh dự, vinh quang, sự tàn bạo — luôn có một loại tiền tệ dễ đúc hơn bất kỳ thứ gì."
 menp_crisis_corvette:1 "$crisis_corvette$"
 menp_crisis_corvette_desc:1 "Nghĩ mà xem, những hạm đội khốn khổ kia cứ tưởng chúng đã bị quấy nhiễu đến cùng cực rồi..."
 menp_crisis_destroyer:1 "$crisis_destroyer$"
 menp_crisis_destroyer_desc:1 "Một thợ săn tàn bạo hơn cho một thời đại tàn khốc hơn."
 menp_crisis_cruiser:1 "$crisis_cruiser$"
 menp_crisis_cruiser_desc:1 "Một sức nặng đè bẹp."
 menp_star_eater:0 "Nhật Thực & Ngày Tận Thế"
 menp_star_eater_desc:0 "Ánh sáng đã soi rọi kẻ thù của chúng ta quá lâu rồi. Chúng sẽ không còn cơ hội ngước nhìn các vì sao để tìm kiếm nguồn cảm hứng nữa."
 unlocks_purge:0 "Mở khóa §YThanh Trừng§! như một tùy chọn Chính Sách.\n"
 unlocks_armageddon_bombardment:0 "Mở khóa §YTư Thế Ném Bom Tận Thế (Armageddon Bombardment)§!.\n"
 unlocks_crisis_corvette:0 "§H$UNLOCKS_SHIP_TYPE$:§! $crisis_corvette$\n"
 unlocks_crisis_destroyer:0 "§H$UNLOCKS_SHIP_TYPE$:§! $crisis_destroyer$\n"
 unlocks_crisis_cruiser:0 "§H$UNLOCKS_SHIP_TYPE$:§! $crisis_cruiser$\n"
 unlocks_star_eater:0 "§H$UNLOCKS_SHIP_TYPE$:§! $star_eater$\n"
 menp_objectives:0 "Mục Tiêu Hiểm Họa"
 menp_objectives_desc:0 "Thông qua sự phá vỡ thực tại này, chúng ta sẽ thăng hoa lên một thực tại khác."
 unlocks_menace_objectives:0 "Cho phép tích lũy £menace£ §YĐiểm Hiểm Họa§! bằng cách hoàn thành các §HMục Tiêu Hiểm Họa§!.\n"
 menp_megastructure:0 "Thiết Bị Tiêu Diệt Tinh Cầu"
 menp_megastructure_desc:0 "Thiết Bị Tiêu Diệt Tinh Cầu sẽ xé toạc các rào cản ngăn cách thế giới này với Hư Cảnh."
 unlocks_crisis_sphere:0 "§H$UNLOCKS_MEGASTRUCTURE$:§! $crisis_sphere_0$\n"
 espionage.10.name:0 "Mạng Lưới Điệp Viên Đã Hình Thành"
 espionage.10.desc:2 "Sự hiện diện của chúng ta tại §Y[from.target.GetName]§! đã mang một bộ mặt bí mật. $role_spymaster$ [from.leader.GetName] hiện đang nắm quyền chỉ huy cốt lõi của một §HMạng Lưới Điệp Viên§! đang phát triển trong không phận [from.target.GetAdj]."
 espionage.11.name:0 "Mạng Lưới Điệp Viên Đã Được Thiết Lập"
 espionage.11.desc:2 "Sự hiện diện của chúng ta tại §Y[from.target.GetName]§! đã mang một sắc thái bí mật: $role_spymaster$ [from.leader.GetName] đã khởi động các giao thức Tình Báo. §HMạng Lưới Điệp Viên§! mới thành lập sẽ cho phép chúng ta theo dõi các hoạt động của [from.target.GetAdj], xâm nhập và can thiệp khi cần thiết."
 espionage.15.name:0 "Mạng Lưới Điệp Viên Đã Thành Lập"
 espionage.15.desc:2 "Chúng ta đã nhận được báo cáo bí mật đầu tiên từ $role_spymaster$ [from.leader.GetName], từ bên trong §Y[from.target.GetName]§!. Điều này đánh dấu sự thành lập §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta trên lãnh thổ ngoại lai. Bất cứ khi nào chúng hành động, chúng ta đều có cơ hội tốt hơn để điều khiển chúng ngay trong [owner.species.GetHandNamePlural] của mình."
 espionage.16.desc:2 "Chúng ta đã nhận được báo cáo bí mật đầu tiên từ $role_spymaster$ [from.leader.GetName], từ bên trong §Y[from.target.GetName]§!. Điều này đánh dấu nền móng của §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta bên trong một đế chế ngoại lai — ở vị trí lý tưởng để cảnh báo chúng ta về những âm mưu xảo quyệt và kỳ quặc của chúng."
 espionage.17.desc:2 "Chúng ta đã nhận được báo cáo bí mật đầu tiên từ $role_spymaster$ [from.leader.GetName], từ bên trong §Y[from.target.GetName]§!. Điều này báo hiệu việc đặt nền móng cho §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta trong một đế chế ngoại lai. Kể từ ngày hôm nay, chúng cũng sẽ nhận ra những lợi ích rèn luyện từ việc kiểm soát thông tin được tôi luyện của [owner.species.GetAdj]..."
 espionage.18.desc:0 "Các báo cáo đã bắt đầu gửi về từ $role_spymaster$ [from.leader.GetName], được phái đến §Y[from.target.GetName]§!. Điều này đánh dấu sự khởi đầu của §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta bên trong một đế chế ngoại quốc.\n\nDù bề ngoài chúng ta trông có vẻ giống nhau, chúng ta sẽ sớm khám phá ra những [from.target.GetSpeciesNamePlural] cụ thể này có thể khác biệt với chúng ta đến mức nào..."
 espionage.21.name:0 "Mạng Lưới Điệp Viên Được Thành Lập Trên Thế Giới [root.GetPreFTLUpper]"
 espionage.21.desc:0 "Các báo cáo đã bắt đầu gửi về từ $role_spymaster$ [from.leader.GetName], được phái đến §Y[from.target.GetName]§!. Điều này đánh dấu nền móng của §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta bên trong một thế giới vẫn chưa nhận thức được sự tồn tại của sự sống ngoài hành tinh.\n\nVới kế hoạch cẩn trọng, chúng ta có thể tác động tinh tế lên xã hội [root.GetPreFTLLower] này trong khi vẫn giấu kín sự hiện diện của mình. Thật may mắn cho chúng ta, sự tương đồng thể chất phi thường giữa loài chúng ta và [from.target.species.GetName] sẽ giúp các điệp viên dễ dàng hoạt động mà không bị phát hiện."
 espionage.21.aware.desc:0 "Các báo cáo đã bắt đầu gửi về từ $role_spymaster$ [from.leader.GetName], được phái đến §Y[from.target.GetName]§!. Điều này đánh dấu nền móng của §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta bên trong một xã hội chỉ mới bắt đầu cân nhắc về sự tồn tại của sự sống ngoài hành tinh.\n\nGiờ đây chúng ta có một cơ hội hiếm có để tác động tinh tế lên một xã hội chưa có khả năng du hành liên sao. Sự tương đồng sinh lý giữa loài chúng ta và [from.target.species.GetName] sẽ giúp các điệp viên hoạt động bí mật dễ dàng."
 espionage.22.name:0 "Mạng Lưới Điệp Viên Hình Thành Trên Thế Giới [root.GetPreFTLUpper]"
 espionage.22.desc:0 "Sau khi nghiên cứu kỹ lưỡng cư dân của §Y[from.target.GetName]§!, chúng ta đã học được cách điều chỉnh các [root.GetIndividualNamePlural] để mô phỏng hành vi của [from.target.GetSpeciesAdj]. $role_spymaster$ [from.leader.GetName] là một [root.GetIndividualName] như vậy: người đứng đầu §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta trên thế giới [root.GetAAnPreFTLLower] [root.GetPreFTLLower].\n\nVới sự chuẩn bị cẩn trọng, chúng ta có thể ngấm ngầm tác động lên xã hội này phục vụ nhu cầu của mình trong khi giữ kín sự hiện diện." ##e.g. 'a pre-FTL world' or 'an unenlightened world'
 espionage.23.name:0 "Mạng Lưới Điệp Viên Cài Đặt Trên Thế Giới [root.GetPreFTLUpper]"
 espionage.23.desc.intro:0 "Sau khi nghiên cứu cẩn trọng cư dân của §Y[from.target.GetName]§!, chúng ta đã học được cách hiệu chuẩn lại các drone để sao chép hành vi của [from.target.GetAdj]. $role_spymaster$ [from.leader.GetName] là một drone như vậy: người đứng đầu §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta trên thế giới [root.GetAAnPreFTLLower] [root.GetPreFTLLower]." ##e.g. 'a pre-FTL world' or 'an unenlightened world'
 espionage.23.desc:0 "$espionage.23.desc.intro$\n\nLoài [from.target.species.GetName] là những sinh vật sinh học đơn giản, vẫn chưa nhận thức được sự sống ngoài hành tinh. Nếu muốn bảo tồn ảo tưởng này, các điệp viên của chúng ta sẽ cần phải cải tạo robot sâu rộng và sử dụng chim mồi nhằm che giấu bản chất thực sự của mình."
 espionage.23.aware.desc:0 "$espionage.23.desc.intro$\n\nLoài [from.target.species.GetName] là những sinh vật sinh học đơn giản, chỉ mới bắt đầu thích nghi với khái niệm về sự sống ngoài hành tinh. Nếu muốn tiến hành các chiến dịch mà không bị lộ diện, các điệp viên của chúng ta sẽ phải cải tạo robot sâu rộng và sử dụng mồi nhử để che giấu hình dáng thật của mình."
 espionage.24.desc.intro:0 "Nghiên cứu cẩn trọng về cư dân của §Y[from.target.GetName]§! đã cho phép chúng ta điều chỉnh các cá thể của mình để mô phỏng hành vi của [from.target.GetSpeciesAdj]. $role_spymaster$ [from.leader.GetName] là một cá thể như vậy: người đứng đầu §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta trên thế giới [root.GetAAnPreFTLLower] [root.GetPreFTLLower]." ##e.g. 'a pre-FTL society' or 'an unenlightened society'
 espionage.24.desc:0 "$espionage.24.desc.intro$\n\nLoài [from.target.species.GetName] là những cá thể sinh học đơn giản, vẫn chưa nhận thức được sự sống ngoài hành tinh. Để bảo tồn bí mật này, các điệp viên của chúng ta sẽ cần phẫu thuật chỉnh hình tỉ mỉ và sử dụng chim mồi để che giấu bản chất thực sự."
 espionage.24.aware.desc:0 "$espionage.24.desc.intro$\n\nLoài [from.target.species.GetName] là những cá thể sinh học đơn giản, chỉ mới làm quen với khái niệm sự sống ngoài hành tinh. Để tiến hành hoạt động mà không bị phơi bày sự hiện diện của mình, các điệp viên sẽ phải trải qua phẫu thuật chỉnh hình tỉ mỉ và sử dụng chim mồi để che giấu hình dáng thực sự."
 espionage.25.desc:0 "Sau khi nghiên cứu cư dân của §Y[from.target.GetName]§!, chúng ta đã học được cách điều chỉnh hành vi để hòa nhập với người [from.target.GetSpeciesAdj]. $role_spymaster$ [from.leader.GetName] là người đứng đầu §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta trên thế giới [root.GetAAnPreFTLLower] [root.GetPreFTLLower].\n\nLoài [from.target.species.GetName] là những sinh vật đơn giản, vẫn chưa biết đến sự sống ngoài hành tinh. Để bảo tồn bí mật, các điệp viên của chúng ta sẽ cần phẫu thuật tạo hình và chim mồi để che giấu bản chất." ##e.g. 'a pre-FTL society' or 'an unenlightened society'
 espionage.25.aware.desc:0 "Sau khi nghiên cứu cư dân của §Y[from.target.GetName]§!, chúng ta đã học được cách điều chỉnh hành vi để hòa nhập với người [from.target.GetSpeciesAdj]. $role_spymaster$ [from.leader.GetName] là người đứng đầu §HMạng Lưới Điệp Viên§! đầu tiên của chúng ta trên thế giới [root.GetAAnPreFTLLower] [root.GetPreFTLLower].\n\nLoài [from.target.species.GetName] chỉ mới làm quen với khái niệm sự sống ngoài hành tinh. Để hoạt động an toàn, các điệp viên của chúng ta cần phẫu thuật tạo hình và chim mồi để che giấu diện mạo." ##e.g. 'a pre-FTL society' or 'an unenlightened society'
 espionage.26.desc:0 "$espionage.24.desc.intro$\n\nLoài [from.target.species.GetName] là những sinh vật sinh học vẫn chưa nhận thức được sự sống ngoài hành tinh. Tuy nhiên, nhờ sự tương đồng sinh học phi thường giữa hai loài, các điệp viên của chúng ta sẽ dễ dàng hoạt động trên thế giới [root.GetPreFTLLower] này mà không bị phát hiện."
 espionage.26.aware.desc:0 "$espionage.24.desc.intro$\n\nLoài [from.target.species.GetName] chỉ mới bắt đầu nghĩ về sự sống ngoài hành tinh. Nhờ sự tương đồng sinh học giữa hai loài, các điệp viên của chúng ta sẽ dễ dàng hoạt động bí mật."
 espionage.1001.name:0 "Điệp Viên Bị Ruồng Bỏ Tìm Cách Tiếp Xúc"
 espionage.1001.desc.intro:2 "Một cá thể tự xưng là [disavowed_agent_country.GetSpeciesName] và từng là một trong những điệp viên của chúng ta đã tìm cách thiết lập liên lạc bí mật với chúng ta từ bên trong §Y[disavowed_agent_country.GetName]§!."
 espionage.1001.desc.network:3 "$espionage.1001.desc.intro$\n\nĐiệp viên này tuyên bố đang nắm giữ thông tin nhạy cảm của [disavowed_agent_country.GetAdj], nhưng đang chịu áp lực khủng khiếp từ các đặc vụ phản gián địa phương. Họ cầu xin được giải cứu ngay lập tức.\n\nMạng Lưới Điệp Viên của chúng ta có thể hỗ trợ nhiệm vụ giải cứu này, nhưng điều đó sẽ làm tiêu hao năng lực hoạt động của mạng lưới trong một thời gian."
 espionage.1001.desc.nonetwork:0 "$espionage.1001.desc.intro$\n\nĐiệp viên này tuyên bố đang nắm giữ thông tin tối mật của [disavowed_agent_country.GetAdj], nhưng đang bị các cơ quan an ninh địa phương truy lùng ráo riết. Họ van nài sự trợ giúp từ chúng ta.\n\nDo chúng ta hiện không duy trì Mạng Lưới Điệp Viên nào tại đây, việc giải cứu sẽ đòi hỏi phải cử một đội đặc nhiệm bí mật từ bên ngoài."
 espionage.1001.a:1 "Giải cứu họ. Thông tin đó quá giá trị."
 espionage.1001.b:0 "Phớt lờ họ. Họ đã bị ruồng bỏ rồi."
 espionage.1005.name:0 "Giải Cứu Điệp Viên Bị Ruồng Bỏ"
 espionage.1005.desc:1 "Các điệp viên của chúng ta trong §Y[disavowed_agent_country.GetName]§! đã thành công trong việc trích xuất cựu điệp viên ra khỏi vòng vây của an ninh đối phương. Thông tin mà cá nhân này mang lại đã bổ sung giá trị đáng kể cho Mạng Lưới Điệp Viên của chúng ta, giúp chúng ta có được một §YNội Gián (Asset)§! quý giá."
 espionage.1005.a:0 "Hoan nghênh trở lại hàng ngũ."
 espionage.1005.b:0 "$espionage.1001.b$"
 espionage.1005.c:0 "Một chiến dịch xuất sắc."
 espionage.1005.c.tooltip:0 "Mạng Lưới Điệp Viên của chúng ta tại §Y[disavowed_agent_country.GetName]§! nhận được một phần thưởng thâm nhập."
 espionage.1011.name:0 "Điệp Viên Bị Bắt Giữ"
 espionage.1011.desc:1 "Chúng ta nhận được tin tức đáng lo ngại từ §Y[disavowed_agent_country.GetName]§!. Cựu điệp viên mà chúng ta cố gắng trích xuất đã bị lực lượng an ninh [disavowed_agent_country.GetAdj] tóm gọn. Rất may là các quy trình bảo mật đã được kích hoạt kịp thời, ngăn chặn việc kẻ thù liên kết vụ việc này với chính quyền chúng ta."
 espionage.1012.name:0 "Điệp Viên Bị Tố Cáo"
 espionage.1012.desc:1 "Chúng ta nhận được một tuyên bố đầy giận dữ từ chính quyền §Y[disavowed_agent_country.GetName]§!. Chúng tuyên bố đã bắt giữ một kẻ tự xưng là §Hcựu điệp viên [root.GetAdj]§!, và yêu cầu chúng ta phải chịu trách nhiệm. Hơn nữa, cá nhân này sẽ phải chịu mọi hình phạt nặng nề nhất mà xã hội của chúng dành cho 'gián điệp ngoại bang'.\n\n$espionage.1012.desc.end$"
 espionage.1012.desc.official:1 "Chúng ta nhận được một công hàm ngoại giao cộc lốc từ [disavowed_agent_official.GetName] của §Y[disavowed_agent_country.GetName]§!. [disavowed_agent_official.GetHeSheCap] tuyên bố đã được tiếp cận bởi một kẻ tự xưng là §Hcựu điệp viên [root.GetAdj]§!. Đại diện [disavowed_agent_country.GetAdj] không nói nhiều lời, nhưng bày tỏ rõ sự không khoan nhượng của đế chế họ đối với 'gián điệp nước ngoài'.\n\n$espionage.1012.desc.end$"
 espionage.1012.desc.end:0 "Nếu có bất kỳ phần nào của thông điệp này là thật, rất có thể điệp viên bị ruồng bỏ đó đã gặp phải một kết cục bi thảm. Dù sao thì vụ việc này cũng mang lại một số hậu quả ngoại giao nhất định."
 espionage.1013.desc:1 "Chúng ta nhận được một tuyên bố bất thường từ §Y[disavowed_agent_country.GetName]§!, tuyên bố rằng họ đã được tiếp cận bởi một §Hcựu điệp viên [root.GetAdj]§!. Nếu thông điệp này đáng tin, thì điệp viên bị ruồng bỏ đó không chỉ tồn tại mà còn không thấy con đường nào khác ngoài việc đào tẩu — chỉ để bị chính quyền [disavowed_agent_country.GetAdj] bác bỏ thẳng thừng. Ít nhất là bức thông điệp khẳng định như vậy.\n\n[disavowed_agent_country.GetName] không nói rõ bước hành động tiếp theo của họ sẽ là gì, nhưng một cá nhân như vậy gần như chắc chắn sẽ bị giám sát chặt chẽ chừng nào họ còn ở đó. Như một thủ tục chính thức, [disavowed_agent_country.GetName] đã đưa ra lệnh trừng phạt ngoại giao đối với chúng ta vì hành vi 'xâm phạm chủ quyền lãnh thổ' này."
 espionage.1016.name:0 "Khai Trừ Cuối Cùng"
 espionage.1016.desc.network:4 "Các cố vấn an ninh của chúng ta báo cáo rằng mọi mối đe dọa có thể gây ra bởi cựu điệp viên của chúng ta tại §Y[disavowed_agent_country.GetName]§! đã được chấm dứt. $espionage.1016.desc.end$"
 espionage.1016.desc.nonetwork:1 "Cựu điệp viên từng cố gắng tái lập liên lạc từ bên trong §Y[disavowed_agent_country.GetName]§! đã được xử lý gọn gàng. $espionage.1016.desc.end$"
 espionage.1016.desc.end:0 "Một đội đặc nhiệm được tuyển chọn đặc biệt đã có thể xác nhận sự tồn tại của cá nhân này — trước khi nhanh chóng kết liễu họ. Tuy nhiên, không ai có thể chắc chắn liệu đây là một điệp viên thực sự hay là một phần của mưu mẹo từ [disavowed_agent_country.GetAdj].\n\nDù thế nào: cả sự tồn tại của điệp viên lẫn thông tin mà họ tuyên bố nắm giữ nay đã được đặt ngoài tầm với của cả hai đế chế."
 espionage.1017.name:0 "Điệp Viên Bóng Ma"
 espionage.1017.desc:1 "Đội đột kích bí mật mà chúng ta cử vào §Y[disavowed_agent_country.GetName]§! đã vội vã rút lui. Có vẻ như chưa từng có điệp viên bị ruồng bỏ nào cả. Thay vào đó, những gì đội tìm thấy là bằng chứng tinh vi về một cái bẫy nhằm vạch trần các chiến dịch bí mật của chúng ta.\n\nCó lẽ đây là một âm mưu nhằm phục vụ mục đích của [disavowed_agent_country.GetAdj]; hoặc có lẽ một tổ chức bên ngoài đã tìm cách can thiệp vào công việc của chúng ta. Trong cả hai trường hợp: các biện pháp ngăn chặn của chúng ta đã bị hủy bỏ vừa kịp lúc để tránh phơi bày các chiến dịch tình báo, dù là trong quá khứ hay hiện tại."
 espionage.1017.a:0 "Một cú né thoát may mắn."
 espionage.1021.name:0 "Điệp Viên Bị Ruồng Bỏ Trở Về"
 espionage.1021.desc:4 "Điệp viên từng bị ruồng bỏ của chúng ta đã tìm cách quay trở lại không phận [root.GetAdj]. Cá nhân §H[disavowed_agent_country.GetAdj] này§! — người tự nhận [disavowed_operative.GetHimselfHerself] là [disavowed_operative.GetName] — tỏ ra lo lắng nhưng nhẹ nhõm, và đã vượt qua tất cả các bài kiểm tra xác minh an ninh. Cuộc thẩm vấn được mô tả là gian nan, nhưng thông tin mang lại đã chứng minh là vô cùng hữu ích — chúng ta đã có được một §YNội Gián (Asset)§! giá trị.\n\nVới vấn đề nay đã được giải quyết, tình trạng bị ruồng bỏ mong manh của [disavowed_operative.GetName] sẽ được tái xác nhận. Sau khi đảm bảo chắc chắn rằng [disavowed_operative.GetHeShe] không còn mất tích trong khi làm nhiệm vụ, các điệp viên hiện tại của chúng ta có thể yên tâm rằng lần này, sự chối bỏ quan hệ sẽ có hiệu lực vĩnh viễn."
 espionage.1022.name:0 "Đó Là Một Cái Bẫy!"
 espionage.1022.desc:3 "Có vẻ như chúng ta đã hành động quá vội vàng khi cố gắng trích xuất người được cho là §Hđiệp viên bị ruồng bỏ§!. Chúng ta đã hoàn toàn mất liên lạc với đội điệp viên được phái đến §H[disavowed_agent_country.GetName]§!. Hiện chúng ta nghi ngờ rằng điệp viên đó chưa bao giờ tồn tại.\n\nTất cả các điệp viên liên quan đến nỗ lực này đã bị khai trừ. Do đó, khả năng tiến hành các chiến dịch tiếp theo của chúng ta tại [disavowed_agent_country.GetName] sẽ bị hạn chế trong một thời gian để Mạng Lưới Điệp Viên hồi phục."
 espionage.1022.a:0 "Điềm này chẳng lành."
 espionage.1030.name:0 "Ẩn Mình Giữa Thanh Thiên Bạch Nhật"
 espionage.1030.desc:2 "Một số điệp viên mà chúng ta kiểm soát tại §H[vividsight_country.GetName]§! đang bắt đầu thu hút một lượng chú ý bất thường; họ được xem là... đầy sức hút?\n\nChúng ta không có lý do gì để tin rằng vỏ bọc của họ đang gặp nguy hiểm, nhưng danh tiếng và tầm ảnh hưởng ngày càng tăng của họ đang gây áp lực lên tính bí mật có thể phủ nhận của Mạng Lưới Điệp Viên của chúng ta."
 espionage.1030.a:0 "Điều này có thể là một lợi thế, nếu được quản lý khéo léo."
 espionage.1030.b.hive:0 "Điều này không ổn. Hãy sắp xếp 'điều chỉnh'."
 espionage.1030.b.machine:0 "Điều này không ổn. Hãy điều chỉnh các thông số của chúng."
 espionage.1040.name:0 "Một Phát Hiện Bất Ngờ"
 espionage.1040.desc.regular:1 "$role_spymaster$ của chúng ta đang giám sát §H[luckycatch_country.GetName]§! báo cáo về việc thu nạp thành công và bất ngờ một §YNội Gián (Asset)§! mới — một đầu mối có thiện cảm sẽ phục vụ cho các chiến dịch của chúng ta bất cứ khi nào cần thiết.\n\nMọi nỗ lực đã được thực hiện để đảm bảo rằng đầu mối liên lạc mới này là xác thực. Các quy trình đã được thiết lập nhằm giảm thiểu rủi ro từ các điệp viên hai mang tiềm tàng."
 espionage.1040.desc.gestalt:1 "Trong số nhiều nhiệm vụ bí mật của chúng ta tại §H[luckycatch_country.GetName]§!, có việc do thám kín đáo các Nội Gián tiềm năng: bất kỳ công cụ nào chúng ta có thể sử dụng để thúc đẩy các nỗ lực bên trong thực thể gestalt. $role_spymaster$ của chúng ta báo cáo vừa có được một phát hiện may mắn như vậy."
 espionage.1040.desc.caughtspies:1 "Chúng ta đã gài bẫy bắt gọn một nhóm §Pđiệp viên [luckycatch_country.GetAdj]§!. Có vẻ như chúng đang tham gia vào một chiến dịch chống lại chúng ta, chi tiết hiện vẫn chưa rõ.\n\nTuy nhiên, thông qua các cuộc thẩm vấn, chúng ta đã thu thập được một lượng nhỏ Thông Tin Tình Báo về §H[luckycatch_country.GetName]§!. $role_spymaster$ của chúng ta hiện cũng đã tiếp cận được một §YNội Gián§! địa phương để chúng ta có thể tận dụng lợi thế này."
 espionage.1040.desc.caught:1 "$role_spymaster$ của chúng ta tại §H[luckycatch_country.GetName]§! báo cáo rằng chúng ta đã bắt giữ thành công một nhóm §Pkẻ phá hoại§!. Dù không thể ngăn chặn hành vi xâm lược gần đây của chúng chống lại chúng ta, các cuộc thẩm vấn những đặc vụ thù địch này đã chứng minh là rất có giá trị.\n\nThông tin tình báo thu thập được sẽ không dùng được lâu, nhưng việc bắt giữ những kẻ phá hoại này đã mang lại cho chúng ta lợi thế trong các chiến dịch chống lại [luckycatch_country.GetName]. Thông qua chúng, chúng ta đã bảo đảm được một §YNội Gián§! để hỗ trợ khi cần thiết."
 espionage.1040.a.tooltip:0 "Chúng ta đã có được một §YNội Gián mới§! cho Mạng Lưới Điệp Viên của mình tại §H[luckycatch_country.GetName]§!."
 espionage.1050.name:0 "Của Rơi Vào Tay Ai Người Ấy Giữ"
 espionage.1050.desc:2 "Một điệp viên đặc biệt tinh mắt tại §Y[finderskeepers_country.GetName]§! đã đặt [root.species.GetHandNamePlural] lên một phần của §Hkhóa mã hóa [finderskeepers_country.GetAdj]§!. Có vẻ như một $job_politician$ [finderskeepers_country.GetSpeciesName] bất cẩn đã đánh rơi thiết bị trong khi đi lại.\n\nĐiều này báo hiệu điềm lành cho các chiến dịch của chúng ta tại [finderskeepers_country.GetName], song việc nghiên cứu thiết kế độc đáo của thiết bị này cũng mang lại những hiểu biết mới cho phương pháp tiếp cận chung của chúng ta đối với §Y$MOD_INTEL_DECRYPTION_ADD$§!."
 espionage.1060.name:0 "Lòng Trung Thành Đáng Ngờ"
 espionage.1060.desc:1 "Lực lượng an ninh của chúng ta đã phát hiện một âm mưu mua chuộc nhằm vào các $job_politician_plural$ tại [capital_scope.GetName]. Kẻ thù đang tìm cách đặt [root.species.GetHandNamePlural] lên các bí mật nhà nước."
 espionage.1060.desc.corp:1 "Lực lượng an ninh nội bộ đã phát hiện những kẻ tiếp cận các [root.GetCorpRulerJobPlural] tại [capital_scope.GetName]. Đối thủ đang cố gắng đặt [root.species.GetHandNamePlural] lên các kế hoạch mật của tập đoàn."
 espionage.1060.a:0 "Thanh lọc các phần tử phản bội."
 espionage.1060.a.tooltip:1 "Mất đi £job_politician£ §Y$job_politician$§! bị tha hóa."
 espionage.1060.b:0 "$espionage.1060.a$"
 espionage.1060.b.tooltip:1 "Mất đi [root.GetCorpRulerJobIcon] chức danh quản lý bị tha hóa."
 espionage.1070.name:0 "Bắt Giữ Kẻ Xâm Nhập"
 espionage.1070.desc.identified.intro:1 "Các biện pháp Mã Hóa của chúng ta đã bắt giữ một nhóm kẻ xâm nhập thuộc [hostile_infiltration_country.GetName] mang theo các thiết bị ngụy trang tinh vi của [root.species.GetAdj]."
 espionage.1070.desc.identified:1 "$espionage.1070.desc.identified.intro$\n\nCác tù binh đã thú nhận phục vụ cho §Y[hostile_infiltration_country.GetName]§!."
 espionage.1070.desc.identified.hostile:1 "$espionage.1070.desc.identified.intro$\n\nCác tù binh mang theo nhiều tài liệu [hostile_infiltration_country.GetAdj] liên quan đến nhiệm vụ của chúng tại §Y[hostile_infiltration_country.GetName]§!."
 espionage.1070.desc.unknown:1 "Các biện pháp Mã Hóa của chúng ta đã tóm gọn một nhóm kẻ xâm nhập ẩn danh nhưng nguy hiểm. Dù bị thẩm vấn gắt gao, chúng đưa ra nhiều lời khai mâu thuẫn về lòng trung thành của mình.\n\n$espionage.1070.desc.middle$\n\nChúng ta có thể trả đũa [hostile_infiltration_country.GetName] — hành động như vậy thậm chí có thể được các đế chế khác coi là chính đáng. Tuy nhiên, cũng có khả năng toàn bộ vụ việc này là một cái bẫy khéo léo nhằm đánh lạc hướng chúng ta khỏi kẻ thù thực sự."
 espionage.1070.desc.middle:0 "Những kẻ xâm nhập [hostile_infiltration_country.species.GetName] mang theo nhiều vật dụng mang tính buộc tội, một số trong đó chúng ta đã dễ dàng giải mã. Tuy nhiên, chúng ta nghi ngờ rằng những thứ này có thể đã bị làm giả để đánh lừa hoặc thao túng chúng ta. Những gián điệp này có thể thực sự làm việc cho [hostile_infiltration_country.GetName], nhưng bằng chứng chưa thể coi là hoàn toàn xác thực."
 espionage.1070.desc.unknown.hostile:1 "Các biện pháp Mã Hóa của chúng ta đã tóm gọn một nhóm kẻ xâm nhập ẩn danh nhưng cực kỳ nguy hiểm. Ngay cả dưới sự thẩm vấn gắt gao, chúng vẫn khai ra nhiều phe phái khác nhau mà chúng ta không thể hy vọng xác minh.\n\n$espionage.1070.desc.middle$\n\nChúng ta có thể trả đũa [hostile_infiltration_country.GetName] — một hành động như vậy thậm chí có thể được các bên khác xem là chính đáng. Tuy nhiên, có thể toàn bộ sự cố này là một mồi nhử thông minh, được dựng lên để đánh lạc hướng chúng ta khỏi kẻ thù thực sự."
 espionage.1070.a:0 "Duy trì sự theo dõi bí mật."
 espionage.1070.b:0 "Cả thiên hà sẽ phải nghe về chuyện này!"
 espionage.1070.b.tooltip:0 "\n§HĐế chế §Y[hostile_infiltration_country.GetName]§! sẽ được thông báo rằng chúng ta đã bắt giữ các điệp viên của chúng.§!"
 espionage.1070.c:0 "Chúng ta sẽ kiên nhẫn chờ thời cơ."
 espionage.1070.d:0 "Ai đó sẽ phải chịu trách nhiệm cho việc này."
 espionage.1070.e:0 "Hãy để chúng trả tiền mua sự im lặng của chúng ta."
 espionage.1070.e.fail:0 "Đế chế §Y[from.GetName]§! sẽ không mấy bận tâm đến động thái như vậy."
 espionage.1071.name:0 "Không Còn Bí Mật Nữa"
 espionage.1071.desc:0 "Mục tiêu tình báo gần đây của chúng ta, §Y[from.GetName]§!, không những nhìn thấu âm mưu của chúng ta mà còn chọn cách §Pvạch trần chúng ta§! trước toàn thể thiên hà!\n\nCó thể không có bằng chứng xác thực nào chứng minh cho những tuyên bố này — ít ai có thể tin chúng. Tuy nhiên, chỉ riêng lời cáo buộc thôi cũng có thể đủ gây tổn hại."
 espionage.1071.desc.hostile:0 "Mục tiêu tình báo gần đây của chúng ta, §Y[from.GetName]§!, không những nhìn thấu mưu kế của chúng ta mà còn quyết định §Pvạch trần chúng ta§! vì các hành động thù địch chống lại chúng.\n\nCó thể chúng không nắm giữ bằng chứng thực tế nào — chúng có thể chỉ cố gắng tung hỏa mù để làm nhục chúng ta hoặc tìm kiếm sự ủng hộ từ các nước láng giềng thiên hà."
 espionage.1071.a:0 "Thật thảm hại."
 espionage.1071.b:0 "Trò đó ai cũng chơi được."
 espionage.1072.name:0 "Cáo Buộc Hoạt Động Gián Điệp"
 espionage.1072.desc:1 "Đế chế §H[from.GetName]§! cáo buộc chúng ta tiến hành §Phoạt động gián điệp thù địch§!. Những tuyên bố của chúng — rằng chúng ta đã cử các đặc vụ đến tiến hành những hành động xâm lược ghê tởm chống lại chúng — được xây dựng trên những bằng chứng lung lay và gán ghép sai lệch.\n\nDù mức độ tin cậy hay lý lẽ đằng sau cáo buộc này là gì, nó đã dẫn đến một lệnh trừng phạt ngoại giao từ [from.GetName]. Chúng ta khó có thể thấy bất kỳ hậu quả trực tiếp nào từ điều này, nhưng vết nhơ này khó có thể không bị các đồng minh khác của chúng, hoặc thậm chí là của chính chúng ta, chú ý."
 espionage.1072.a:0 "Đó không phải là điều chúng ta bận tâm."
 espionage.1073.name:0 "Bị Tống Tiền Vì Hoạt Động Gián Điệp"
 espionage.1073.desc:0 "Mục tiêu tình báo gần đây của chúng ta, §Y[from.GetName]§!, đã bắt quả tang hành vi của chúng ta và §Hyêu cầu các ân huệ chính trị§!. Đổi lại, chúng đồng ý không vạch trần các hành động bí mật của chúng ta trước toàn thể thiên hà.\n\nCó thể không có bằng chứng thực tế nào chứng minh cho những tuyên bố của chúng — dù sao thì riêng lời cáo buộc cũng có thể gây cho chúng ta đủ tổn hại rồi. Bất kể động cơ của chúng là gì, [from.GetName] đã đòi được đòn bẩy chính trị đối với chúng ta."
 espionage.1081.name:0 "Âm Mưu Thâm Độc Bị Vạch Trần"
 espionage.1081.desc:0 "Các điệp viên của chúng ta trong §Y[insidious_plot_spynetwork.GetName]§! đã phát hiện ra điều bất thường: những manh mối đáng tin cậy cho thấy §H[insidious_plot_country.GetName]§! đang âm mưu lừa dối chúng ta! Chúng ta hiện chưa có thông tin chi tiết chính xác về kế hoạch rõ ràng này, nhưng nghe nói nó liên quan đến việc thao túng các mối quan hệ hiện có của chúng ta — làm suy yếu các thỏa thuận tin cậy và chính lối sống của chúng ta.\n\n$espionage.1081.desc.outro$"
 espionage.1081.desc.hostile:0 "Các điệp viên của chúng ta trong §Y[insidious_plot_spynetwork.GetName]§! đã phát hiện ra những tin đồn rằng §H[insidious_plot_country.GetName]§! đang âm mưu lừa dối chúng ta. Chúng ta hiện chưa có thông tin chi tiết về kế hoạch của chúng, nhưng có vẻ nó được chuẩn bị để tìm cách phá hoại chúng ta và lối sống của chúng ta.\n\n$espionage.1081.desc.outro$"
 espionage.1081.desc.outro:0 "Làm thế nào mà thông tin này lại được người [insidious_plot_spynetwork.GetSpeciesName] biết đến vẫn chưa rõ ràng. Tuy nhiên, nỗ lực của các điệp viên của chúng ta trong việc bám đuôi các đặc vụ tình báo [insidious_plot_spynetwork.GetAdj] bị tình nghi dường như đã được đền đáp. Nếu thông tin tình báo này là xác thực, thì có thể người [insidious_plot_spynetwork.GetSpeciesName] chỉ vừa mới làm công việc khó khăn là thu thập nó hộ chúng ta."
 espionage.1081.desc.samecountry:0 "Các điệp viên của chúng ta trong §Y[insidious_plot_spynetwork.GetName]§! đã phát hiện ra những tin đồn đáng tin cậy về một âm mưu tại địa phương nhằm chống lại chúng ta. Có vẻ như những đối tác §H[insidious_plot_country.GetAdj]§! của họ có phần bất cẩn về tính bảo mật trong hoạt động của chính mình.\n\nChúng ta hiện chưa có chi tiết chính xác về kế hoạch rõ ràng của chúng, nhưng nghe nói nó liên quan đến việc thao túng các mối quan hệ hiện có của chúng ta — làm suy yếu các thỏa thuận tin cậy và chính lối sống của chúng ta."
 espionage.1081.a:0 "Lũ quái vật đó!"
 espionage.1082.name:0 "Âm Mưu Đáng Ngờ Bị Phát Hiện"
 espionage.1082.desc:0 "Các điệp viên của chúng ta trong §Y[insidious_plot_spynetwork.GetName]§! đã phát hiện ra bằng chứng đáng ngờ cho thấy §H[insidious_plot_country.GetName]§! có ý định lừa dối chúng ta trong tương lai gần.\n\n$espionage.1082.outro$"
 espionage.1082.desc.samecountry:0 "Các điệp viên của chúng ta trong §Y[insidious_plot_spynetwork.GetName]§! đã phát hiện ra bằng chứng đáng ngờ cho thấy chúng có ý định phát động một chiến dịch lừa dối chống lại chúng ta.\n\n$espionage.1082.outro$"
 espionage.1082.outro:1 "Tuy nhiên, bằng chứng thu thập được có vẻ không chắc chắn và mâu thuẫn. $role_spymaster$ [insidious_plot_spymaster.GetName] cảnh báo rằng đây có thể là một chiến dịch tung tin giả nhằm gieo rắc sự ngờ vực."
 espionage.1082.a:0 "Sự xúc phạm tiềm tàng này không thể dung thứ."
 espionage.1082.b:0 "Đây nhiều khả năng là một mưu mẹo. Hãy lờ nó đi."
 espionage.1085.name:0 "Bị Kéo Vào Âm Mưu"
 espionage.1085.desc:1 "Chúng ta đã bị kéo vào một âm mưu chống lại §H[from.GetName]§!. Lời cáo buộc mơ hồ đến mức chúng ta không thể khẳng định chắc chắn liệu họ có nắm được điều gì thực tế hay không.\n\nCác điệp viên của chúng ta phản bác rằng cáo buộc này là vô căn cứ, cho rằng đây nhiều khả năng là phản ứng phòng thủ, phản gián từ một trong các mục tiêu của chúng ta — hoặc là một chiến dịch bôi nhọ do bên thứ ba tiến hành. Bất kể lý do hay nguyên nhân là gì, [from.GetName] đã tỏ ra phật ý."
 espionage.1085.desc.neverspied:0 "Đáng kinh ngạc là chúng ta lại bị lôi kéo vào một âm mưu mơ hồ nào đó chống lại §H[from.GetName]§!. Đó là một cáo buộc nực cười, xét đến việc chúng ta hoàn toàn chưa từng tiến hành hoạt động gián điệp ngoại quốc nào cho đến nay — nhưng rồi người [from.GetAdj] sẽ không có cách nào biết được lời cáo buộc đó nực cười đến mức nào.\n\nCó vẻ như các bên không rõ danh tính đang cố gài bẫy chúng ta vì những hành vi sai trái của chính họ — hoặc có lẽ chỉ đơn giản là để gieo rắc sự hỗn loạn ngoại giao. Dù lý do hay nguyên nhân là gì, [from.GetName] đã cảm thấy bị xúc phạm."
 operation.1000.name:0 "Huy Động Điệp Viên"
 operation.1000.desc.hostile:0 "Các điệp viên chìm sâu của chúng ta đã đẩy mạnh việc giám sát các mục tiêu tiềm năng."
 operation.1000.desc.friendly:0 "Những 'người tìm kiếm' của chúng ta đã bắt đầu tiếp cận và làm quen với các mục tiêu được đánh dấu là có tiềm năng hữu ích."
 operation.1001.name:0 "Thu Hẹp Phạm Vi"
 operation.1001.desc:1 "Một danh sách rút gọn các mục tiêu đã được lập ra. Những điệp viên không còn làm nhiệm vụ giám sát sẽ cung cấp vỏ bọc hỗ trợ cho những người khác."
 operation.1002.name:0 "Xác Định Nội Gián"
 operation.1002.desc:3 "Khi chiến dịch sắp kết thúc, $role_spymaster$ [spynetwork.leader.GetName] đã hành động để bảo vệ Nội Gián mới của chúng ta bên trong [target.GetName]. Các điệp viên còn lại luôn sẵn sàng cung cấp bất kỳ sự yểm trợ nào mà [spynetwork.leader.GetHeShe] có thể cần."
 operation.1006.name:0 "Thu Nạp Nội Gián Thành Công"
 operation.1006.desc.intro:1 "$role_spymaster$ [from.spynetwork.leader.GetName] báo cáo từ [from.target.GetName]: việc thực thi cho đến nay đã thành công rực rỡ."
 operation.1006.desc.celebrity:1 "$operation.1006.desc.intro$ Mạng Lưới Điệp Viên của chúng ta hiện đã tiếp cận được §Hnhân vật có ảnh hưởng trong nền văn hóa [from.target.GetAdj]§!, người có mong muốn duy trì hình ảnh trước công chúng kết hợp hoàn hảo với những dã tâm mà chúng ta muốn vận dụng, nhằm thao túng tâm tư và khối óc của chúng."
 operation.1006.desc.official:1 "$operation.1006.desc.intro$ Chúng ta đã đảm bảo quyền tiếp cận một §Hquan chức trong bộ máy hành chính [from.target.GetAdj]§!. Nội Gián này sẽ được giữ an toàn nhưng luôn sẵn sàng hỗ trợ chúng ta trong các chiến dịch tương lai — đặc biệt là khi đối mặt với các vấn đề ngoại giao hoặc chính quyền."
 operation.1006.desc.professional:1 "$operation.1006.desc.intro$ Mạng Lưới Điệp Viên của chúng ta nay được tăng cường nhờ tiếp cận một §Hchuyên gia [from.target.GetAdj] có tầm ảnh hưởng§!, sẵn sàng hỗ trợ các chiến dịch tận dụng mạng lưới quan hệ của Nội Gián hoặc sức nặng từ danh tiếng của họ."
 operation.1006.desc.rebel:1 "$operation.1006.desc.intro$ Chúng ta đã có được lòng trung thành của một §Hkẻ nổi dậy [from.target.GetAdj]§!, người có khát vọng tạo ra sự xáo trộn có thể dễ dàng được uốn nắn để phù hợp với mục tiêu của chúng ta."
 operation.1006.desc.underling:1 "$operation.1006.desc.intro$ Chúng ta đã lôi kéo được một §Hcông dân [from.target.GetAdj] không được trọng dụng§!, người có thái độ bất mãn và các mối quan hệ ở tầng đáy xã hội chắc chắn sẽ hỗ trợ các Chiến Dịch của chúng ta theo nhiều cách."
 operation.1006.desc.drone:1 "$operation.1006.desc.intro$ Mạng Lưới Điệp Viên của chúng ta đã nắm quyền kiểm soát một §Hdrone [from.target.GetAdj] được biến đổi§!, lợi ích của điều này là hiển nhiên bất cứ khi nào chúng ta muốn thâm nhập hoặc thao túng thực thể [from.target.GetName]."
 operation.1006.desc.organ:1 "$operation.1006.desc.intro$ Chúng ta đã kiểm soát được §Hmột phần của thực thể [from.target.GetName]§! — một Nội Gián cho phép chúng ta can thiệp vào tổ ong, che giấu các chuyển động chống lại nó, và nhiều hơn thế nữa."
 operation.1006.desc.component:1 "$operation.1006.desc.intro$ Chúng ta đã kiểm soát được §Hmột phần của thực thể [from.target.GetName]§! — một Nội Gián cho phép chúng ta can thiệp vào trí tuệ nhân tạo máy móc với những hậu quả trực tiếp và tàn khốc."
 operation.1006.desc.network:1 "$operation.1006.desc.intro$ Mạng Lưới Điệp Viên của chúng ta nay được củng cố nhờ quyền truy cập vào §Hmột phần mạng lưới mà [from.target.GetName] vận hành§!. Nếu chúng ta muốn che giấu hành tung chống lại thực thể máy móc, gửi thông tin giả hoặc can thiệp vào nó: các giao thức của chính nó giờ đây có thể bị biến thành vũ khí chống lại nó."
 operation.1006.desc.default:0 "$operation.1006.desc.intro$ Chúng ta đã đảm bảo được một Nội Gián giá trị sẽ tăng cường các hoạt động thu thập thông tin tình báo và gián điệp của chúng ta bên trong không phận [from.target.GetAdj]."
 operation.1006.b:0 "Đưa Nội Gián này vào hoạt động ngay lập tức."
 operation.1020.name:0 "Thu Thập Đầu Mối"
 operation.1020.desc.conf_hosted:1 "Các điệp viên chìm của chúng ta đã phân tán khắp một hội nghị đầy hứa hẹn được tổ chức trong không phận [root.target.GetAdj]. Họ đã bắt đầu do thám các mục tiêu tiềm năng."
 operation.1020.desc.conf_external:2 "Các điệp viên của chúng ta đã đảm bảo sự hiện diện tại một hội nghị khoa học liên sao mà [root.target.GetName] cũng được mời. Các nỗ lực của chúng ta chỉ tập trung do thám phái đoàn [root.target.GetAdj]."
 operation.1020.desc.lecture:1 "Chúng ta đã cài cắm các điệp viên vào hàng ngũ thính giả tại một số buổi diễn thuyết được tổ chức ở [root.target.GetName]. Chúng ta sẽ theo dõi các đầu mối tiềm năng trong giới tinh hoa trí thức của chúng."
 operation.1020.desc.outreach:1 "Các điệp viên của chúng ta đã phân tán vào các chương trình tiếp cận khoa học khác nhau do [root.target.GetName] điều hành vì lợi ích của công dân chúng. Mục tiêu cho nỗ lực này rất có thể sẽ tự lộ diện trước mắt chúng ta."
 operation.1020.desc.theft:2 "Các điệp viên của chúng ta đã bắt đầu giám sát một cơ sở nghiên cứu của [root.target.GetAdj]. Bất cứ nơi nào có kẽ hở xâm nhập, chúng ta sẽ khai thác triệt để."
 operation.1020.desc.enigmatic:0 "$role_spymaster$ [spynetwork.leader.GetName] báo cáo rằng các điệp viên của chúng ta đã gặp phải một trở ngại không thể vượt qua: kỹ thuật công nghệ của [target.GetAdj] dường như đã phát triển vượt bậc và quá khác biệt so với chúng ta.\n\nBất kỳ công nghệ nào chúng ta hy vọng đánh cắp từ chúng cũng sẽ §Hhoàn toàn khó hiểu§! đối với chúng ta — cũng như không tương thích với những gì chúng ta đang sở hữu."
 operation.1021.name:0 "Lần Theo Đầu Mối"
 operation.1021.desc.appeal:0 "Chúng ta đã tìm thấy một mục tiêu đáp ứng các tiêu chí lý tưởng: có quyền tiếp cận vào các nghiên cứu đột phá, và có thái độ cởi mở đối với điệp viên của chúng ta. Chúng ta sẽ tiếp tục theo đuổi đầu mối này."
 operation.1021.desc.creds:0 "Một trong những mục tiêu tiềm năng dường như có loại giấy phép nghiên cứu mà chúng ta cần, và họ khá ấn tượng với các chứng chỉ ngụy tạo của chúng ta. Đầu mối này có vẻ là tốt nhất hiện nay."
 operation.1021.desc.theft:1 "Các điệp viên của chúng ta đã tìm thấy một kẽ hở — một nền tảng lý tưởng để xây dựng kế hoạch thâm nhập vào nghiên cứu của [root.target.GetAdj]."
 operation.1022.name:0 "Xâm Nhập Thành Công"
 operation.1022.desc.invited:1 "Chúng ta đã vạch ra nhiều kế hoạch mang lại lợi thế rõ rệt: điệp viên của chúng ta cuối cùng đã được mời đến một cơ sở phân nhánh an ninh cao đang tham gia vào nghiên cứu tiên tiến. $role_spymaster$ [root.spynetwork.leader.GetName] đảm bảo với chúng ta rằng các mô phỏng của [root.spynetwork.leader.GetHisHer] cho thấy dự báo rất khả quan."
 operation.1022.desc.theft:1 "Các điệp viên của chúng ta hiện đã thực hiện nhiều chuyến chạy thử nghiệm, kết quả hoàn toàn trùng khớp với các dự báo khả quan từ $role_spymaster$ [root.spynetwork.leader.GetName]. Chúng ta đã sẵn sàng thực hiện nỗ lực đánh cắp nghiên cứu đáng thèm muốn của [root.target.GetAdj]."
 operation.1026.name:0 "Thu Thập Nghiên Cứu Của [fromfrom.target.GetAdj] Thành Công"
 operation.1026.desc.intro.smooth:1 "Nỗ lực xâm nhập của chúng ta vào [fromfrom.target.GetName] cho đến nay đã diễn ra hoàn hảo không một tì vết."
 operation.1026.desc.ducts.smooth:1 "$operation.1026.desc.intro.smooth$\n\nMột điệp viên đơn độc đã giành được quyền tiếp cận vào bên trong một cơ sở nghiên cứu từ xa thông qua §Hđường ống kỹ thuật§!, đã từ từ luồn lách đến một thiết bị đầu cuối hạn chế quyền truy cập của kho lưu trữ trung tâm [fromfrom.target.GetName]. $operation.2016.desc.outro.smooth$"
 operation.1026.desc.goods.smooth:1 "$operation.1026.desc.intro$\n\nMột điệp viên đơn độc đã ẩn nấp bên trong §Hcửa nhập hàng§! của một cơ sở nghiên cứu xa xôi, chờ đợi được vận chuyển vượt qua nhiều biện pháp an ninh rõ ràng là lỏng lẻo của [fromfrom.target.GetAdj]. Một cá thể [fromfrom.target.GetSpeciesAdj] ngây ngô đã vô tình đặt điệp viên của chúng ta vào vị trí dễ dàng tiếp cận thiết bị đầu cuối của kho lưu trữ trung tâm [fromfrom.target.GetName].\n\n$operation.2016.desc.outro.smooth$"
 operation.1026.desc.invited.smooth:1 "$operation.1026.desc.intro.smooth$ Vỏ bọc của điệp viên chúng ta luôn vững vàng trong suốt quá trình, và mặc dù người [fromfrom.target.GetSpeciesName] đã thực hiện các biện pháp an ninh hợp lý: §Hsự tin tưởng mà chúng ta ngụy tạo§! vừa đủ để trao cho chúng ta cơ hội vàng.\n\n$operation.2016.desc.outro.smooth$"
 operation.2016.desc.outro.smooth:2 "Một chuỗi phức tạp các màn che điện tử và đòn nghi binh đã khiến cơ sở dữ liệu nghiên cứu bị lộ ra vừa đủ lâu để chúng ta ra tay. Lực lượng an ninh [fromfrom.target.GetAdj] sẽ siết chặt an ninh sau khi chúng ta hoàn tất nhiệm vụ tại đây."
 operation.1026.tooltip.cooldown:0 "§HChúng ta phải đợi ít nhất §Y6 năm§! trước khi cố gắng xâm nhập lại các cơ sở nghiên cứu của chúng.§!"
 operation.1026.a.smooth:0 "Như vậy là tốt rồi. Nhiệm vụ đã hoàn thành."
 operation.1026.b.smooth:0 "Phá hoại mọi thứ chúng ta để lại phía sau."
 operation.1026.b.tooltip:0 "\n§H[fromfrom.target.GetName]§!:\nBị ảnh hưởng bởi §Y$research_stolen_sabotaged$§! trong 1 năm.\n\n"
 operation.1026.c:0 "Tạo cho chúng ta một cửa sau để tiếp cận các nghiên cứu tương lai của chúng."
 operation.1026.d:0 "Đây là cơ hội lý tưởng để đoạt thêm nhiều thứ nữa!"
 operation.1026.d.tooltip:1 "Một công nghệ bổ sung được mở ra để nghiên cứu, cùng với hạng mục chúng ta vừa giành được."
 operation.1026.desc.intro.messy:0 "Nỗ lực xâm nhập vào nền khoa học [fromfrom.target.GetAdj] của chúng ta đã thành công, tuy nhiên một số điệp viên hiện có vẻ đang gặp nguy hiểm."
 operation.1026.desc.ducts.messy:1 "$operation.1026.desc.intro.messy$\n\nChúng tìm cách tiếp cận bên trong một cơ sở nghiên cứu từ xa qua các §Hđường ống kỹ thuật§!, nhằm tới một thiết bị đầu cuối hạn chế quyền truy cập ở lõi cơ sở. Tuy nhiên, khi chúng truy cập vào kho lưu trữ trung tâm của [fromfrom.target.GetName], §Hcòi báo động§! đã bị kích hoạt.\n\n $operation.1026.desc.outro.messy$"
 operation.1026.desc.goods.messy:1 "$operation.1026.desc.intro.messy$\n\nMột điệp viên đơn độc đã tìm cách tiếp cận bên trong một cơ sở nghiên cứu từ xa qua §Hbãi giao nhận hàng§!, để bản thân được đưa thẳng đến thiết bị đầu cuối của kho lưu trữ trung tâm [fromfrom.target.GetName]. Thật không may, §Hcòi báo động§! dường như đã bị kích hoạt ngay khoảnh khắc họ ra tay.\n\n$operation.1026.desc.outro.messy$"
 operation.1026.desc.invited.messy:1 "$operation.1026.desc.intro.messy$ Vỏ bọc của điệp viên chỉ huy đã trụ vững đủ lâu để hoàn tất việc trích xuất dữ liệu, nhưng §Hchứng chỉ§! của họ nay đã bị vạch trần là giả mạo. An ninh [fromfrom.target.GetAdj] đã được cảnh báo về sự hiện diện của họ.\n\n$operation.1026.desc.outro.messy$"
 operation.1026.desc.outro.messy:2 "Dữ liệu nghiên cứu mà chúng ta khao khát đã được trích xuất thành công, nhưng §Hkế hoạch đào tẩu§! của đội đã bị rối loạn. Lực lượng an ninh đang siết chặt vòng vây; chúng ta phải nhanh chóng và thận trọng cân nhắc bước đi tiếp theo."
 operation.1026.a.messy:0 "Thu hồi càng nhiều điệp viên của chúng ta càng tốt."
 operation.1026.b.messy:1 "Họ đã bị lộ rồi. Hãy phá hoại bất cứ thứ gì có thể."
 requires_not_espionage_research_backdoor:1 "Chúng ta chỉ có thể vận hành một cửa sau như vậy tại một thời điểm."
 operation.1027.name:0 "Công Nghệ Không Thể Giải Mã"
 operation.1027.desc:0 "$role_spymaster$ [from.spynetwork.leader.GetName] đã đệ trình báo cáo về Chiến Dịch [from.GetName] bên trong §H[from.target.GetName]§!. Có vẻ như khoa học và kỹ thuật của [from.target.GetAdj] đã phát triển tới mức khiến ngay cả những điệp viên chuyên nghiệp của chúng ta cũng phải bối rối. Họ khẳng định rằng công nghệ nền tảng đã sai khác quá lớn so với chúng ta, nghĩa là ngay cả khi chúng ta có thể đánh cắp nghiên cứu của chúng, phần cứng thu được cũng sẽ hoàn toàn không tương thích với công nghệ của chúng ta.\n\n$role_spymaster$ [from.spynetwork.leader.GetName] đề xuất rằng chúng ta nên tìm kiếm những bí mật như vậy ở nơi khác."
 operation.1030.name:0 "Nghiên Cứu Bị Phá Hoại!"
 operation.1030.desc.regular:1 "Mạng lưới nghiên cứu của chúng ta đã bị xâm nhập! Một kẻ xâm nhập không rõ danh tính đã làm đảo lộn nhiều thư viện dữ liệu của chúng ta, §Hđánh cắp các nghiên cứu§! phục vụ mục đích của chúng và gây chậm trễ đáng kể cho các §Hnghiên cứu đang tiến hành§! của chúng ta.\n\nCác đội ngũ của chúng ta đã nhanh chóng chuyển sang hệ thống dự phòng, nhưng điều này sẽ làm chậm tiến độ. Ước tính có thể mất nhiều tháng trước khi chúng ta có thể tái tích hợp các quy trình nghiên cứu & phát triển với kho tài liệu hiện có."
 operation.1030.desc.gestalt:1 "Mạng lưới nghiên cứu của chúng ta đã bị xâm nhập! Một thực thể không rõ danh tính đã xâm nhập vào các phương tiện dữ liệu của chúng ta, §Hđánh cắp các nghiên cứu§! cho mục đích của chúng và gây xáo trộn nghiêm trọng cho các §Hnghiên cứu đang diễn ra§! của chúng ta.\n\nChúng ta đã có thể kích hoạt các hệ thống dự phòng khá nhanh chóng, nhưng tiến độ từ nay sẽ bị chậm lại. Có thể mất nhiều tháng trước khi chúng ta có thể tái tích hợp suôn sẻ quy trình nghiên cứu & phát triển với các thư viện dữ liệu hiện có."
 operation.2000.name:2 "Tiếp Cận Mục Tiêu Tại [target.solar_system.GetName]"
 operation.2000.desc.intro.friendly:1 "Một nhóm điệp viên nhỏ được chọn lọc kỹ càng đã khởi hành đến §Y[target.owner.GetName]§! dưới những thân phận ngụy tạo kín kẽ."
 operation.2000.desc.jobseeker:2 "$operation.2000.desc.intro.friendly$ Mỗi người sẽ đóng vai một công nhân đang tìm kiếm việc làm. Một số người mang theo thư giới thiệu và sẽ tìm kiếm công việc gần các cơ sở then chốt; những người khác sẽ thử vận may ở những khu vực khuất tất hơn của cơ sở."
 operation.2000.desc.vendor:1 "$operation.2000.desc.intro.friendly$ Trong số đó có một gia đình giả dạng thợ thủ công đang tìm kiếm cơ hội kinh doanh mới. Họ sẽ cố gắng thiết lập một điểm bán lẻ trên §H[target.GetName]§! để tiêu thụ hàng hóa của mình."
 operation.2000.desc.intro.hostile:1 "Một nhóm điệp viên đã lên đường đến §Y[target.owner.GetName]§!. Vỏ bọc của họ liên quan đến việc lái một con tàu chở hàng bình thường."
 operation.2000.desc.cargo:1 "$operation.2000.desc.intro.hostile$ Khoang chứa của nó chất đầy những thứ sẽ hiển thị trên máy quét của [target.owner.GetAdj] là $rare_crystals$ và các khoáng sản quý giá khác. Chúng ta tin rằng sự mộc mạc trắng trợn của chiến lược này sẽ đóng vai trò như một đòn nghi binh hoàn hảo."
 operation.2000.desc.derelict:1 "$operation.2000.desc.intro.hostile$ Con tàu được gắn thuốc nổ phi sát thương khi tiếp cận biên giới [target.owner.GetAdj] — càng gần §Yhệ sao [target.solar_system.GetName]§! càng tốt. Bức xạ sẽ tràn ngập khoang tàu khi các điệp viên của chúng ta ẩn nấp bên trong lõi được che chắn vô hình của nó."
 operation.2000.desc.invalid:0 "Các điệp viên của chúng ta báo cáo những thay đổi quyết liệt bên trong nội bộ [root.target.owner.GetAdj]: mục tiêu của chúng ta không còn khả thi nữa."
 operation.2001.name:0 "Điệp Viên Đã Vào Vị Trí"
 operation.2001.desc.vocation:2 "Một số điệp viên của chúng ta đã được chấp thuận lên cơ sở §H[target.GetName]§!. Những người không được cấp phép làm việc ở đó đã phân tán sang các hệ sao lân cận. Tại đó họ sẽ chuyển sang vỏ bọc dự phòng và hỗ trợ cho toàn bộ chiến dịch."
 operation.2001.desc.vessel:2 "Mồi câu đã được cắn, và các điệp viên của chúng ta đã 'chuyển sang hoạt động ngầm' khi họ nỗ lực bám rễ bên trong cơ sở thù địch. $role_spymaster$ [spynetwork.leader.GetName] sẽ chờ đợi thêm các tín hiệu từ họ."
 operation.2002.name:0 "Tín Hiệu Sẵn Sàng"
 operation.2002.desc.intro:1 "Một tín hiệu mã hóa đã truyền về từ bên trong §Y[target.owner.GetName]§!, cho thấy các điệp viên của chúng ta hiện đã sẵn sàng."
 operation.2002.desc.vocation:3 "$operation.2002.desc.intro$\n\nHọ đã thực hiện vai trò vỏ bọc của mình xuất sắc đến mức thực sự tạo dựng được mối quan hệ thân tình với nhân viên địa phương. Nhiều điểm xâm nhập hữu ích đã được ghi nhận trong các bữa ăn thân mật, các buổi giải trí chung và giao lưu hàng ngày trên cơ sở §H[target.GetName]§!."
 operation.2002.desc.vessel:1 "$operation.2002.desc.intro$ $role_spymaster$ [spynetwork.leader.GetName] đã chuẩn bị phương án trích xuất họ khi có thể, tuy nhiên cơ hội của họ là rất mong manh."
 operation.2005.name:0 "[root.GetSabotagedStarbaseTitle]"
 operation.2005.desc.civic:2 "Chúng ta đã giáng một đòn thành công vào §Hcơ sở hạ tầng dân sự§! tại hệ sao [sabotaged_starbase_system.GetName]. Sự hỗn loạn sau đó sẽ phục vụ đắc lực cho các mục tiêu của chúng ta.\n\n$operation.2005.desc.outro$"
 operation.2005.desc.military:3 "Chúng ta đã phá hoại thành công một §Hcấu trúc hỗ trợ quân sự§! trên cơ sở [sabotaged_starbase.GetName]. Các điệp viên báo cáo thương vong nhỏ trong số những người làm việc gần đó vào thời điểm thiết bị kích hoạt.\n\nĐòn giáng vào hậu cần tác chiến bên trong §Y[sabotaged_starbase_owner.GetName]§! này chắc chắn sẽ khiến chúng không thể làm ngơ.\n\n$operation.2005.desc.outro$"
 operation.2005.desc.trade:3 "Chúng ta đã giáng một đòn vào §Hlợi ích thương mại§! trong và xung quanh hệ sao [sabotaged_starbase_system.GetName]. Các tàu buôn đang làm tắc nghẽn các tuyến vận tải khi lực lượng kiểm soát không lưu địa phương cuống cuồng vạch ra các luồng tuyến mới.\n\n$operation.2005.desc.outro$"
 operation.2005.desc.outro:1 "Giờ đây chúng ta phải tính đến khả năng chối bỏ hành vi của chính mình. Mọi chiến dịch tương lai trong không phận [sabotaged_starbase_owner.GetAdj] sẽ đòi hỏi chúng ta duy trì vỏ bọc tối đa — nghĩa là nếu chúng ta muốn ưu tiên sự thận trọng như vậy..."
 operation.2005.a:0 "Giải tán êm thấm nhất có thể."
 operation.2005.b:0 "Thận trọng chỉ dành cho kẻ nhu nhược. Hãy phá hủy căn cứ ngôi sao này."
 operation.2005.b.orb:0 "Thận trọng chỉ dành cho kẻ yếu thế. Hãy phá hủy vòng đai quỹ đạo này."
 operation.2005.b.tooltip:1 "Các điệp viên của chúng ta sẽ chớp lấy cơ hội để §Hhủy diệt các cấu trúc bổ sung§! trên mục tiêu."
 operation.2005.c:0 "Đánh vào cả các $military_station_small_plural$ nữa."
 operation.2005.c.tooltip:2 "Phá hủy một $military_station_small$ trên mục tiêu."
 operation.2006.name:0 "Hủy Bỏ Phá Hoại"
 operation.2006.desc:3 "$role_spymaster$ [from.spynetwork.leader.GetName] báo cáo rằng đội điệp viên của [from.spynetwork.leader.GetHisHer] phải từ bỏ nỗ lực phá hoại §H[sabotaged_starbase_owner.GetAdj]§! tại §Yhệ sao [sabotaged_starbase_system.GetName]§!. Những thay đổi mạnh mẽ trong nội bộ [sabotaged_starbase_owner.GetAdj] đã khiến nỗ lực của chúng ta trở nên vô ích. Chúng ta nên khôn ngoan chọn một mục tiêu khác."
 operation.2010.name:2 "[root.GetSabotagedStarbaseTitle] Tại Hệ Sao [sabotaged_starbase_system.GetName]!"
 operation.2010.desc.phobe:3 "Những kẻ xâm nhập đã vi phạm biên giới của chúng ta tại hệ sao §Y[sabotaged_starbase_system.GetName]§!, phá hoại một phần cơ sở §H[sabotaged_starbase.GetName]§!. Những kẻ phá hoại này dường như hành động thay mặt cho một thế lực ngoại bang; lực lượng phản gián của chúng ta đang trong tình trạng báo động cao để tìm cách tóm gọn các đặc vụ này."
 operation.2010.desc.regular:3 "Những kẻ phá hoại không rõ danh tính đã tấn công hệ sao §Y[sabotaged_starbase_system.GetName]§!, phá hỏng một phần cơ sở §H[sabotaged_starbase.GetName]§!.\n\nCơ quan phản gián của chúng ta nhận định đây nhiều khả năng là hành động của các thế lực bên ngoài hơn là mối đe dọa nội bộ. Chúng ta đã tăng cường an ninh xung quanh khu vực bị ảnh hưởng với hy vọng bắt giữ các đặc vụ này."
 operation.2010.desc.gestalt:3 "Một thực thể ngoại lai đã xâm phạm biên giới của chúng ta tại hệ sao §Y[sabotaged_starbase_system.GetName]§! và ngang nhiên làm gián đoạn sự vận hành trơn tru của cơ sở §H[sabotaged_starbase.GetName]§!. Chúng ta chưa thể xác định được bằng cách nào những kẻ phá hoại lại có thể xâm nhập hiệu quả như vậy, tuy nhiên chúng ta đã tăng cường an ninh nội bộ để phản ứng trực tiếp."
 operation.3000.name:0 "Xác Định Mục Tiêu"
 operation.3000.desc:1 "Chúng ta đã lập danh sách các đế chế có vẻ thân thiện nhất với §Y[root.target.GetName]§!. Các điệp viên của chúng ta sẽ khoét sâu mối chia rẽ giữa các đế chế này."
 operation.3000.desc.single:1 "Chúng ta đã tìm thấy một mục tiêu đầy hứa hẹn — §H[event_target:smear_option_1.GetName]§! — mối quan hệ của họ với §Y[root.target.GetName]§! đang mang lại lợi ích cho [root.target.GetAdj] nhưng lại gây bất lợi cho chúng ta."
 operation.3000.desc.error:1 "Chúng ta không thể tìm thấy một mục tiêu phù hợp cho nỗ lực này. Có vẻ như nếu §Y[root.target.GetName]§! thực sự có bạn bè ở nơi khác, chúng ta vẫn chưa thiết lập được đường dây liên lạc với họ."
 operation.3000.a:0 "[smear_option_1.GetName]."
 operation.3000.b:0 "[smear_option_2.GetName]."
 operation.3000.c:0 "[smear_option_3.GetName]."
 operation.3000.d:0 "Đành vậy."
 operation.3001.name:0 "Hồ Sơ Đen"
 operation.3001.desc.spirit.intro:2 "Đội ngũ dưới quyền $role_spymaster$ [Root.SpyNetwork.leader.GetName] sẽ hành động để thổi phồng sự bất khoan dung tôn giáo bên trong [root.target.GetName]."
 operation.3001.desc.spirit.ridic:1 "$operation.3001.desc.spirit.intro$ Chúng ta sẽ lan truyền những tin đồn đáng tin cậy rằng các nghi lễ thực hành của [smear_campaign_recipient.GetAdj] đang là chủ đề bị chế nhạo công khai trong giới chính trị [root.target.GetAdj]."
 operation.3001.desc.spirit.merch:0 "$operation.3001.desc.spirit.intro$ Nếu họ bị bắt gặp đang rao bán những thần tượng rẻ tiền và báng bổ bất cứ thứ gì mà [smear_campaign_recipient.GetName] coi là thiêng liêng nhất, chẳng hạn..."
 operation.3001.desc.spirit.deity:1 "$operation.3001.desc.spirit.intro$ Chúng ta sẽ ngụy tạo một chiến dịch của [root.target.GetAdj] nhắm vào những người bên ngoài đẳng cấp giáo sĩ tại [smear_campaign_recipient.GetName]. Một nỗ lực phá vỡ chính trị của dòng tu chắc chắn sẽ xúc phạm những người đang điều hành nó."
 operation.3001.desc.milit.intro:1 "Chúng ta sẽ hành động để ám chỉ rằng [root.target.GetName] đang tìm cách làm suy yếu quân đội [smear_campaign_recipient.GetAdj]."
 operation.3001.desc.milit.study:1 "$operation.3001.desc.milit.intro$ Chúng ta có thể gợi ý rằng sự quan tâm của [root.target.GetAdj] đối với [smear_campaign_recipient.GetName] chỉ nhằm mục đích nghiên cứu các bí mật quân sự của họ, và họ thậm chí có thể đi xa đến mức kích động chiến tranh để thử nghiệm bất kỳ điểm yếu nào lộ ra."
 operation.3001.desc.milit.priso:1 "$operation.3001.desc.milit.intro$ Chẳng hạn, nếu [root.target.GetName] bị cáo buộc giam giữ tù binh chiến tranh của [smear_campaign_recipient.species.GetAdj] với ý đồ tẩy não họ..."
 operation.3001.desc.milit.armsd:1 "$operation.3001.desc.milit.intro$ Chúng ta sẽ cung cấp bằng chứng không thể chối cãi rằng [root.target.GetName] đang bán vũ khí bị lỗi được ngụy trang khéo léo cho người láng giềng thiên hà đáng kính của họ, [smear_campaign_recipient.GetName]."
 operation.3001.desc.milit.pacif:1 "$operation.3001.desc.milit.intro$ Những tin đồn về một bước đột phá trong công nghệ [root.target.GetAdj] có thể cưỡng chế bình định các nước láng giềng như [smear_campaign_recipient.GetName], chẳng hạn..."
 operation.3001.desc.milit.satir:1 "$operation.3001.desc.milit.intro$ Chúng ta sẽ đánh vào lòng tự tôn của chúng, ám chỉ rằng [root.target.GetName] chỉ dùng các kịch bản chiến đấu chống lại [smear_campaign_recipient.GetName] để huấn luyện những học viên trẻ tuổi nhất, như một cách dễ dàng để xây dựng sự tự tin cho tân binh."
 operation.3001.desc.phobe.intro:1 "Chúng ta sẽ phóng đại sự ngạo mạn ngoại lai của [root.target.GetName], đánh vào tâm lý bài ngoại của [smear_campaign_recipient.GetName]."
 operation.3001.desc.phobe.genes:1 "$operation.3001.desc.phobe.intro$ Ví dụ: nếu [root.target.GetName] bị bắt quả tang đang bán các liệu pháp gen dựa trên sinh học của người [smear_campaign_recipient.species.GetAdj], chắc chắn họ sẽ nổi trận lôi đình."
 operation.3001.desc.phobe.abduc:1 "$operation.3001.desc.phobe.intro$ Chúng ta sẽ gieo rắc ý tưởng về một âm mưu của người [root.target.GetAdj] nhằm bắt cóc các công dân [smear_campaign_recipient.species.GetAdj] và tẩy não họ để chấp nhận một thiên hà cởi mở hơn."
 operation.3001.desc.egal.intro:1 "Chúng ta sẽ khắc họa [root.target.GetName] như những kẻ phá hoại nhiệt thành đối với các hệ thống chính trị mà [smear_campaign_recipient.GetName] hằng coi trọng."
 operation.3001.desc.egal.migra:1 "$operation.3001.desc.egal.intro$ Nếu [root.target.GetName] bị phát hiện vi phạm hiệp ước di cư và phân biệt đối xử, bắt các công dân [smear_campaign_recipient.species.GetAdj] làm những công việc tồi tệ nhất, chắc chắn họ sẽ cảm thấy bị xúc phạm."
 operation.3001.desc.egal.galco:1 "$operation.3001.desc.egal.intro$ Chúng ta sẽ gieo những manh mối về một âm mưu của [root.target.GetAdj] nhằm phá hoại vị thế chính trị của họ trong Cộng Đồng Thiên Hà."
 operation.3001.desc.egal.elect:1 "$operation.3001.desc.egal.intro$ Chúng ta có thể cung cấp bằng chứng khó có thể phớt lờ về một âm mưu của [root.target.GetAdj] nhằm xâm nhập hệ thống chính trị [smear_campaign_recipient.GetAdj] và can thiệp vào các cuộc bầu cử của họ."
 operation.3001.desc.mat.intro:1 "Chúng ta sẽ miêu tả [root.target.GetName] như những kẻ láng giềng ghen tị và tham lam, luôn muốn bóc lột và lạm dụng nền khoa học của [smear_campaign_recipient.GetAdj]."
 operation.3001.desc.mat.theft:0 "$operation.3001.desc.mat.intro$ Những tin đồn đáng tin cậy về một âm mưu đánh cắp trắng trợn công nghệ của họ sẽ phục vụ tốt cho mục tiêu này."
 operation.3001.desc.mat.droid:1 "$operation.3001.desc.mat.intro$ Chúng ta sẽ ngụy tạo một phong trào bên trong [root.target.GetName] nhằm đánh cắp các droid của [smear_campaign_recipient.GetAdj], bỏ qua năng lực sản xuất hạn chế của chính họ."
 operation.3001.desc.mat.singu:1 "$operation.3001.desc.mat.intro$ Một mối đe dọa từ [root.target.GetAdj] về việc kích hoạt một điểm kỳ dị do AI dẫn dắt bên trong không gian dữ liệu của [smear_campaign_recipient.GetAdj] chắc chắn sẽ thu hút sự chú ý và cơn thịnh nộ của họ."
 operation.3001.desc.mat.sabot:1 "$operation.3001.desc.mat.intro$ Việc người [root.target.GetAdj] có thể đang âm mưu phá hoại nghiên cứu khoa học đó chắc chắn sẽ gây ra sự phản ứng mạnh mẽ từ họ."
 operation.3001.desc.pacif.intro:1 "Chúng ta sẽ đánh vào nỗi sợ hãi của chủ nghĩa hòa bình [smear_campaign_recipient.GetAdj], gán những mưu đồ bạo lực cho [root.target.GetName]."
 operation.3001.desc.pacif.gunrun:1 "$operation.3001.desc.pacif.intro$ Chẳng hạn: chính quyền [smear_campaign_recipient.GetAdj] sẽ không hề thích thú khi nghe tin người [root.target.GetAdj] đã kiếm bộn tiền từ hoạt động buôn lậu vũ khí xuyên qua không phận của họ."
 operation.3001.desc.pacif.vassal:1 "$operation.3001.desc.pacif.intro$ Tin tức về một chương trình do [root.target.GetAdj] điều hành nhằm vũ trang cho các phe phái ly khai bên trong các chư hầu của [smear_campaign_recipient.GetName] chắc chắn sẽ gây ra sự phẫn nộ tột cùng."
 operation.3001.desc.pacif.weapon:1 "$operation.3001.desc.pacif.intro$ Chúng ta sẽ gieo rắc những nỗi sợ hãi đáng tin rằng [root.target.GetName] đang phát triển một loại vũ khí có khả năng khiến dân số [smear_campaign_recipient.species.GetName] trở nên cuồng bạo dữ dội."
 operation.3001.desc.pacif.border:1 "$operation.3001.desc.pacif.intro$ Chúng ta sẽ ngụy tạo bằng chứng cho thấy các phe phái chìm, trung thành với [root.target.GetName], đang sẵn sàng kích ngòi các cuộc đụng độ biên giới quanh không phận [smear_campaign_recipient.GetAdj]."
 operation.3001.desc.phile.intro:1 "Chúng ta sẽ dựa vào thái độ thân thiện với sinh vật ngoại lai của [smear_campaign_recipient.GetName], khiến họ cảm thấy như thể [root.target.GetName] đang tích cực lợi dụng sự hòa nhã của họ."
 operation.3001.desc.phile.commerc:1 "$operation.3001.desc.phile.intro$ Những tin đồn về việc làm giá trong các thỏa thuận thương mại với [smear_campaign_recipient.GetName] chắc chắn sẽ thu hút sự chú ý của họ, làm lung lay niềm tin trong mối quan hệ với [root.target.GetName]."
 operation.3001.desc.phile.slavery:1 "$operation.3001.desc.phile.intro$ Tin tức ngụy tạo rằng các công dân [smear_campaign_recipient.species.GetAdj] đang bị bán làm nô lệ trên các thế giới của [root.target.GetName] chắc chắn sẽ gây ra sự tức giận."
 operation.3001.desc.phile.motives:1 "$operation.3001.desc.phile.intro$ Chúng ta sẽ gieo rắc những tin đồn đen tối về [root.target.GetName], ám chỉ rằng những động cơ đen tối ẩn sau sự quan tâm của họ đối với một [smear_campaign_recipient.GetName] hòa nhã..."
 operation.3001.desc.phile.contact:1 "$operation.3001.desc.phile.intro$ Chúng ta sẽ gieo rắc ám chỉ rằng [root.target.GetName] đã phát tán tin đồn giả và phá hoại các nỗ lực thiết lập liên lạc đầu tiên của [smear_campaign_recipient.GetName], ngay từ khi họ mới bước chân lên vũ đài thiên hà."
 operation.3001.desc.auth.intro:1 "Chúng ta sẽ đánh vào bản chất độc tài của [smear_campaign_recipient.GetName], khắc họa [root.target.GetName] như những tác nhân gây hỗn loạn cho chính quyền [smear_campaign_recipient.GetAdj]."
 operation.3001.desc.auth.mockery:1 "$operation.3001.desc.auth.intro$ Bằng chứng cho thấy nhà lãnh đạo [smear_campaign_recipient.GetAdj] [smear_campaign_recipient.leader.GetName] là đối tượng bị chế giễu công khai trong giới chính trị [root.target.GetAdj] chắc chắn sẽ làm bùng lên cơn thịnh nộ của họ."
 operation.3001.desc.auth.discord:1 "$operation.3001.desc.auth.intro$ Chúng ta sẽ ngụy tạo bằng chứng về một âm mưu gieo rắc điệp viên khắp xã hội [smear_campaign_recipient.GetAdj], nhằm kích động và chèo lái họ hướng tới những mục đích bất chính khác."
 operation.3001.desc.auth.experim:1 "$operation.3001.desc.auth.intro$ Chúng ta sẽ gợi ý rằng [root.target.GetName] đang ngấm ngầm thực hiện các thí nghiệm xã hội học tinh vi đằng sau hậu trường xã hội [smear_campaign_recipient.GetAdj] như một bãi thử nghiệm cho các lý thuyết thuật trị quốc và kiểm soát."
 operation.3001.desc.auth.extorts:1 "$operation.3001.desc.auth.intro$ Chúng ta có thể gợi ý mạnh mẽ rằng các đặc sứ của họ đang bị [root.target.GetName] tống tiền để đòi ân huệ, áp đặt ảnh hưởng không chính đáng từ bên ngoài biên giới."
 operation.3001.desc.corp.intro:2 "Đội ngũ dưới quyền $role_spymaster$ [root.spynetwork.leader.GetName] sẽ đánh vào các nguyên tắc thương mại của [smear_campaign_recipient.GetName], khắc họa [root.target.GetName] như những đối thủ không đáng tin cậy."
 operation.3001.desc.corp.criment:0 "$operation.3001.desc.corp.intro$ Việc một đế chế như họ tìm cách truyền bá doanh nghiệp tội phạm khắp [smear_campaign_recipient.GetName] chắc chắn sẽ bào mòn bất kỳ sự tin tưởng nào họ từng giành được."
 operation.3001.desc.corp.resells:2 "$operation.3001.desc.corp.intro$ Chúng ta sẽ làm cho mọi chuyện có vẻ như [root.target.GetName] đang lạm dụng hiệp ước thương mại bằng cách bán lại hàng hóa của [smear_campaign_recipient.GetAdj] với giá cắt cổ."
 operation.3001.desc.corp.machine:1 "$operation.3001.desc.corp.intro$ Chúng ta sẽ dựng lên những tin đồn đáng tin rằng [root.target.GetName] đã cấy ghép các chương trình con vào trung tâm của [smear_campaign_recipient.GetName], thao túng các hệ thống tài chính phục vụ mục đích riêng."
 operation.3001.desc.corp.knockof:1 "$operation.3001.desc.corp.intro$ Bằng chứng cho thấy [root.target.GetName] đã chất đầy các kho hàng bằng những đồ nhái giá rẻ của các mặt hàng [smear_campaign_recipient.GetAdj] chắc chắn sẽ gây ra sự phản ứng dữ dội. Điều này có vẻ là một đòn tấn công đáng tin cậy vào ngành thương mại cốt lõi của họ."
 operation.3001.desc.hive.intro:1 "Chúng ta sẽ làm cho mọi chuyện có vẻ như [root.target.GetName] đang tích cực tìm cách làm suy yếu thực thể [smear_campaign_recipient.GetName], làm tổn hại bất kỳ sự tin tưởng nào họ từng xây dựng."
 operation.3001.desc.hive.asset:0 "$operation.3001.desc.hive.intro$ Ví dụ: thu gom pheromone và các tài sản sinh học khác để sử dụng trong các mưu đồ chống lại [target.GetGestaltEntityName]..."
 operation.3001.desc.hive.necro:1 "$operation.3001.desc.hive.intro$ Chúng ta sẽ vạch trần một ý tưởng rằng [root.target.GetName] đang âm mưu nuốt chửng [smear_campaign_recipient.GetName], xóa bỏ chủ quyền cá nhân của họ."
 operation.3001.desc.hive.toxin:0 "$operation.3001.desc.hive.intro$ Chi tiết về một âm mưu buôn lậu độc tố vào thủ đô [smear_campaign_recipient.GetAdj] nhiều khả năng sẽ kích động nỗi sợ hãi và nghi ngờ."
 operation.3001.desc.machine.intro:1 "Chúng ta sẽ làm cho mọi chuyện có vẻ như [root.target.GetName] đang nỗ lực lật đổ trí tuệ nhân tạo [smear_campaign_recipient.GetName]."
 operation.3001.desc.machine.asset:1 "$operation.3001.desc.machine.intro$ Chúng ta sẽ ngụy tạo bằng chứng về một bộ phận chuyên trách bên trong [root.target.GetName], chuyên bắt giữ và thao túng các drone của [smear_campaign_recipient.GetAdj]."
 operation.3001.desc.machine.milit:1 "$operation.3001.desc.machine.intro$ Chúng ta sẽ gợi ý rằng các drone [smear_campaign_recipient.GetAdj] đang bị bắt giữ phục vụ các cuộc tập trận, như một phần của kế hoạch [root.target.GetAdj] nhằm một ngày nào đó phát động tấn công trực tiếp vào trí tuệ máy móc."
 operation.3001.desc.machine.steal:1 "$operation.3001.desc.machine.intro$ Chúng ta sẽ gieo rắc những hạt mầm ngờ vực rằng [root.target.GetName] đang tích cực đánh cắp nghiên cứu thông qua các cửa sau dẫn vào [smear_campaign_recipient.GetName]."
 operation.3002.name:0 "$operation_smear_campaign$: Sẵn Sàng Tiến Hành"
 operation.3002.desc:1 "Các điệp viên của chúng ta đã sẵn sàng chuyển giao những tin tức bất lợi về [root.target.GetName] cho [smear_campaign_recipient.GetName]. Chúng ta đã làm mọi thứ có thể để đảm bảo độ chân thực của thông tin sai lệch này — và ngăn chặn việc nó bị lần ra dấu vết của chúng ta."
 operation.3005.name:1 "Chiến Dịch Bôi Nhọ Của [fromfrom.GetAdj]"
 operation.3005.desc.intro:1 "Tin tức đã lan truyền; sự thật được thổi phồng của chúng ta về §H[from.target.GetName]§! hiện đang lan rộng qua các kênh ngoại giao §Y[smear_campaign_recipient.GetAdj]§!."
 operation.3005.desc.insult:1 "$operation.3005.desc.intro$ Sự xúc phạm này đối với [smear_campaign_recipient.GetName] chắc chắn sẽ làm căng thẳng mối quan hệ của họ, và làm sâu sắc thêm bất kỳ sự ngờ vực nào họ vốn đã dành cho [from.target.GetName]."
 operation.3005.desc.trust:0 "$operation.3005.desc.intro$ Các điệp viên của chúng ta đã hành động để đảm bảo những kẻ trong [from.target.GetName] sẽ gặp muôn vàn khó khăn để giành lại bất kỳ sự tin tưởng nào mà họ từng gây dựng."
 operation.3005.desc.espionage:0 "$operation.3005.desc.intro$\n\nCác điệp viên của chúng ta đã ngụy tạo bằng chứng cho thấy [from.target.GetName] có tội trong việc tiến hành hoạt động gián điệp chống lại [smear_campaign_recipient.GetName]. Chúng ta sẽ xem họ phản ứng thế nào trước một cáo buộc gây tổn hại chính trị nặng nề như vậy."
 operation.3005.desc.gestalt:0 "$operation.3005.desc.intro$ Bất kỳ cáo buộc nào về việc cố gắng thao túng ý thức tập thể của họ chắc chắn sẽ gây ra sự phẫn nộ. Các điệp viên của chúng ta đã làm việc để đảm bảo nỗi đau nhức nhối này sẽ còn được cảm nhận trong một thời gian dài."
 operation.3010.name:0 "Phát Hiện Chiến Dịch Bôi Nhọ"
 operation.3010.desc.intro:1 "Đế chế §Y[smear_campaign_target.GetName]§! dường như có kẻ thù bên trong §H[from.GetName]§!."
 operation.3010.desc:2 "$operation.3010.desc.intro$ Các giao thức Mã Hóa của chúng ta đã gắn cờ một thông tin 'ẩn danh' gần đây về những người láng giềng [smear_campaign_target.GetAdj], được dàn dựng để khiến chúng ta tin rằng họ đang âm mưu các hành động xâm lược và bí mật chống lại chúng ta.\n\n$operation.3010.desc.outro$"
 operation.3010.desc.outro:2 "Giờ đây chúng ta đối mặt với một lựa chọn: vạch trần những gì ít ỏi chúng ta biết về sự lừa dối này cho [smear_campaign_target.GetName], hoặc giữ im lặng về khả năng đối phó với hoạt động gián điệp thù địch của mình. Ngay cả khi che giấu thực lực thực sự, chúng ta vẫn có thể dụ kẻ thù mờ ám này ra ánh sáng — nhưng chỉ khi chúng ta hành động dựa trên thông tin họ cung cấp như thể nó là thật."
 operation.3010.a:1 "Cứ giả vờ tin theo. Chúng ta sẽ giữ bí mật sự lừa dối này cho riêng mình."
 operation.3010.b:1 "Thông báo cho [smear_campaign_target.GetName]."
 operation.3010.favortooltip:1 "Đế chế [smear_campaign_target.GetName] có thể chọn cách đền đáp chúng ta bằng các §YÂn Huệ (Favors)§! chính trị."
 operation.3011.name:0 "$operation.3010.name$"
 operation.3011.desc:2 "$operation.3010.desc.intro$ Các giao thức Mã Hóa của chúng ta đã gắn cờ một loạt các thông điệp kỳ lạ và gần như ẩn danh. Chúng bao gồm một hồ sơ bôi nhọ chống lại chúng ta, được cho là do người láng giềng [smear_campaign_target.GetAdj] viết — nhưng trên thực tế những khẳng định đó hoàn toàn là đồ giả mạo công phu.\n\n$operation.3010.desc.outro$"
 operation.3012.name:0 "$operation.3010.name$"
 operation.3012.desc:2 "$operation.3010.desc.intro$ Chúng ta đã xem xét kỹ lưỡng một thông tin liên lạc gần đây từ một nguồn 'ẩn danh', với ý định vạch trần một âm mưu công phu của [smear_campaign_target.GetAdj] chống lại chúng ta — chỉ có điều trên thực tế đó hoàn toàn là bịa đặt. Các giao thức Mã Hóa của chúng ta đã tỏ ra kiên cường, và làm lộ ra một âm mưu của [from.GetAdj] ẩn giấu bên dưới.\n\n$operation.3010.desc.outro$"
 operation.3020.name:0 "Chiến Dịch Bôi Nhọ Bị Vạch Trần"
 operation.3020.desc.espionage:1 "Đế chế §Y[smear_campaign_recipient.GetName]§! đã chuyển giao một hồ sơ cho chúng ta, trình bày chi tiết các cáo buộc gián điệp phức tạp nhằm chia rẽ hai đế chế chúng ta. Có vẻ như §H[smear_campaign_instigator.GetName]§! muốn gieo rắc sự ngờ vực giữa đôi bên.\n\n$operation.3020.desc.outro$"
 operation.3020.desc.insult:1 "Đế chế §Y[smear_campaign_recipient.GetName]§! đã tiếp cận chúng ta với một hồ sơ diễn đạt tế nhị về §H[smear_campaign_instigator.GetName]§!, những kẻ dường như có ác ý với chúng ta. Nếu các tài liệu của [smear_campaign_recipient.GetAdj] là đáng tin, thì [smear_campaign_instigator.GetName] đã có ý định phá hoại bất kỳ mối quan hệ nào giữa chúng ta và [smear_campaign_recipient.GetName] bằng cách gieo rắc những lời dối trá vu khống dưới danh nghĩa của chúng ta.\n\n$operation.3020.desc.outro$"
 operation.3020.desc.deception:1 "Đế chế §Y[smear_campaign_recipient.GetName]§! đã chuyển giao một hồ sơ cho chúng ta, vạch trần một âm mưu công phu nhằm chia rẽ hai đế chế. Đế chế §H[smear_campaign_instigator.GetName]§! được nêu tên là thủ phạm tiềm tàng.\n\n$operation.3020.desc.outro$"
 operation.3020.desc.outro:2 "Mặc dù chiến dịch của [smear_campaign_instigator.GetAdj] được tiến hành trong bí mật, nhưng nó rõ ràng không phải là đối thủ của hệ thống Mã Hóa [smear_campaign_recipient.GetAdj]. Thay vì giữ kiến thức đó cho riêng mình, họ đã chọn cách mở hồ sơ cho chúng ta xem."
 operation.3020.a:0 "Hoặc ít nhất là họ tuyên bố như vậy..."
 operation.3020.b:0 "Chúng ta nợ [from.GetName] một món nợ ân tình."
 operation.4000.name:0 "Đội Đặc Nhiệm Sẵn Sàng"
 operation.4000.desc:0 "$role_spymaster$ [spynetwork.leader.GetName] đã tập hợp một đội điệp viên được đào tạo chuyên sâu. Những người tham gia sẽ tác chiến đơn độc và đã chuẩn bị sẵn tinh thần rằng đây gần như chắc chắn là chuyến đi một chiều. Tất cả những gì họ cần lúc này là một mục tiêu — một thảm họa xứng tầm để dẫn dụ về phía §H[target.GetName]§!."
 operation.4000.desc.single:0 "$role_spymaster$ [spynetwork.leader.GetName] đã tập hợp một đội điệp viên được huấn luyện tinh nhuệ, những người sẽ tìm cách dẫn dụ hiểm họa §P[crisis_beacon_option_1.GetName]§! thẳng vào lãnh thổ §H[target.GetAdj]§!. Đội đặc nhiệm được dự báo sẽ không ai trở về."
 operation.4000.desc.error:0 "$role_spymaster$ [spynetwork.leader.GetName] báo cáo rằng vào lúc này, §Ykhông có mối đe dọa cấp khủng hoảng nào§! có khả năng bị thu hút bởi một chiến dịch như vậy. Các điệp viên mà [spynetwork.leader.GetHeShe] tập hợp sẽ tiếp tục chờ lệnh cho đến khi chúng ta biết thêm về các mối đe dọa thảm khốc đang rình rập trong thiên hà này."
 operation.4000.a:0 "Dẫn dụ §P[crisis_beacon_option_1.GetName]§! tới."
 operation.4000.b:0 "Dẫn dụ §P[crisis_beacon_option_2.GetName]§! tới."
 operation.4000.c:0 "Dùng mồi nhử §P[crisis_beacon_option_3.GetName]§!."
 operation.4001.name:0 "Dấu Hiệu Tiến Triển"
 operation.4001.desc:0 "Các nhà nghiên cứu và điệp viên của chúng ta đã chuẩn bị cho nhiều biến số của nhiệm vụ, và đội đặc nhiệm đã khởi hành đến một vùng không gian chưa được lập bản đồ giữa §Ylãnh thổ [target.GetAdj]§! và §P[crisis_beacon_crisis_country.GetName]§!."
 operation.4002.name:0 "Mồi Câu Đã Thả"
 operation.4002.desc:1 "Các điệp viên của chúng ta gần §H[target.GetName]§! đã gửi một thông điệp một chiều: họ đã sẵn sàng tiến hành và sẽ hướng cơn thịnh nộ của §P[crisis_beacon_crisis_country.GetName]§! về mục tiêu ngay khi có tín hiệu của chúng ta."
 operation.4005.name:0 "Hiểm Họa [crisis_beacon_crisis_country.GetName] Đã Cắn Câu"
 operation.4005.desc.contingency:0 "Các nhà nghiên cứu của chúng ta chỉ có thể suy đoán về tư duy nhanh nhạy và khả năng thích ứng của các điệp viên khi họ dẫn dụ thành công một hạm đội từ mối đe dọa $CRISIS_TYPE_CONTINGENCY$ đang diễn ra. Dù bằng cách xâm nhập giao thức phức tạp hay ngụy tạo một kẽ hở ghi đè, các lần quét tầm xa của chúng ta hiện xác nhận sự hiện diện thù địch đang di chuyển giữa §Yhệ sao [crisis_beacon_crisis_system.GetName]§! và thủ đô của người [crisis_beacon_target_country.GetAdj], §Y[crisis_beacon_target_capital.GetName]§!.\n\nDù §Y[crisis_beacon_target_country.GetName]§! có những mối bận tâm nào khác trong thời buổi hỗn loạn này hay không: hành động của chúng ta đã đảm bảo họ sẽ có thêm ít nhất một vấn đề cấp bách nữa phải bận lòng."
 operation.4005.desc.graytempest:0 "Thu hút sự chú ý tập trung của các thực thể phân tán như cái gọi là §PCơn Bão Xám (Gray Tempest)§! này không phải là kỳ tích tầm thường. Các điệp viên của chúng ta đã thành công bằng một sóng mang điều biến một lần hướng thẳng về phía §H[crisis_beacon_target_country.GetName]§!.\n\nViệc tạo ra làn sóng này là một nỗ lực đầy hiểm nguy, vì khoảng cách giữa §Yhệ sao [crisis_beacon_crisis_system.GetName]§! và thủ đô của người [crisis_beacon_target_country.GetAdj], §Y[crisis_beacon_target_capital.GetName]§! đòi hỏi lượng năng lượng chưa từng có. Đội ngũ của chúng ta đã phải kích hoạt phản ứng dây chuyền không thể kiểm soát trong các ngân hàng năng lượng của một máy phát tầm xa. Thiết bị đã trụ vững vừa đủ lâu để phát mồi nhử xuyên qua siêu không gian.\n\nDữ liệu đo xa khoảng cách lớn cho thấy một Bầy Nanite hiện đang hướng về phía §Y[crisis_beacon_target_country.GetName]§!. Các nhà nghiên cứu của chúng ta cũng ghi nhận các chỉ số về một vụ nổ thảm khốc ở vùng lân cận [crisis_beacon_crisis_system.GetName] — được cho là nơi đội đặc nhiệm của chúng ta đã hy sinh oanh liệt."
 operation.4005.desc.marauders:0 "Bất chấp những nỗ lực đoàn kết gần đây của chúng, §P[raider_khanate.GetName]§! đã chứng minh là một con mồi đơn giản dễ bị khiêu khích trong cơn giận dữ. Đội ngũ của chúng ta đã nỗ lực chọc giận một Chỉ Huy cụ thể, người mà cơn thịnh nộ sôi sục hiện đang hướng với tốc độ siêu ánh sáng về phía thủ đô của [crisis_beacon_target_country.GetAdj], §Y[crisis_beacon_target_capital.GetName]§!.\n\nCác điệp viên của chúng ta tin chắc rằng bất kỳ căn cứ ngôi sao nào bất hạnh nằm giữa §Yhệ sao [crisis_beacon_crisis_system.GetName]§! và [crisis_beacon_target_country.GetName] sẽ trở thành điểm đón tiếp hỗn loạn cho toán cướp marauder nhỏ này. Mong rằng sự hy sinh này không uổng phí."
 operation.4005.desc.swarm:0 "Nghiên cứu của chúng ta về các xung động sinh học của §P$CRISIS_TYPE_PRETHORYN$§! được tiến hành nhanh chóng, nhưng đã chứng minh được hiệu quả. Chúng ta đã chế ra một hợp chất tổng hợp — cực kỳ tốn kém để sản xuất và nguy hiểm khi vận chuyển — đã thành công trong việc dẫn dụ một hạm đội tách khỏi Bầy Đàn.\n\nHợp chất này bám dính đến mức số phận của các điệp viên của chúng ta giờ đây cũng ảm đạm như bất kỳ căn cứ ngôi sao nào nằm giữa §Yhệ sao [crisis_beacon_crisis_system.GetName]§! và thủ đô của người [crisis_beacon_target_country.GetAdj], §Y[crisis_beacon_target_capital.GetName]§!. Khoảnh khắc các điệp viên giải phóng chất hóa học mê hoặc này, số phận của họ đã được định đoạt.\n\nThay vì chạy trốn và có nguy cơ làm rối loạn lộ trình của bầy đàn, đội ngũ của chúng ta thay vào đó sẽ dành thời gian ít ỏi còn lại để đảm bảo dấu vết vẫn nguyên vẹn. Đế chế §H[crisis_beacon_target_country.GetName]§! sẽ sớm nếm trải kết quả từ sự hy sinh của chúng ta."
 operation.4005.desc.unbidden:1 "Những nỗ lực của chúng ta chống lại §P$CRISIS_TYPE_UNBIDDEN$§! đã được đền đáp, dù cái giá phải trả vô cùng đắt đỏ. Các điệp viên của chúng ta đã lừa thành công một hạm đội dị chiều tin rằng một trong những mỏ neo chiều không gian của chúng đang bị đe dọa, sâu bên trong lãnh thổ [crisis_beacon_target_country.GetAdj]. Các tàu chiến hiện đang trên đường tới §Y[crisis_beacon_target_capital.GetName]§! từ §Yhệ sao [crisis_beacon_crisis_system.GetName]§!.\n\n$role_spymaster$ [from.spynetwork.leader.GetName] sẽ tiếp tục theo dõi tình hình, nhưng khó có khả năng chúng ta sẽ thấy các điệp viên của mình trở về. Giờ đây chúng ta phải quan sát và tin tưởng rằng mồi nhử này sẽ phục vụ hoàn hảo cho đại kế hoạch của chúng ta."
 operation.4005.a.tooltip:0 "Hạm đội §P[crisis_beacon_crisis_fleet.GetName]§! hiện đang trên đường hướng tới §Ythủ đô của [crisis_beacon_target_country.GetAdj]§!."
 operation.4010.name:0 "[crisis_beacon_crisis_fleet.GetName] Đang Tiến Về [root.capital_scope.GetName]"
 operation.4010.desc:0 "Chúng ta phát hiện một sự hiện diện thù địch từ §P[crisis_beacon_crisis_country.GetName]§!, đang hướng thẳng tới thủ đô của chúng ta, §Y[crisis_beacon_target_capital.GetName]§!! Các làn sóng năng lượng kỳ lạ đã bùng phát từ vùng lân cận §H[crisis_beacon_crisis_system.GetName]§!, nơi được cho là nguồn gốc phát tán.\n\nChúng ta vừa mới bắt đầu phân tích hiện tượng này thì các dấu hiệu năng lượng trong khu vực đột ngột thay đổi. Mọi dấu hiệu đều cho thấy điều này đồng nghĩa với một sự thay đổi đột ngột trong chuyển động của hạm đội. Hơn nữa, ít nhất một trong những tín hiệu năng lượng đó có vẻ thuộc về một đế chế khác ngoài [crisis_beacon_crisis_country.GetName]. Dù họ là ai, họ dường như là nguyên nhân gây ra hành vi này. Chúng ta nghi ngờ đây là §Hhành động khiêu khích§! của một trong những đối thủ thiên hà của mình."
 operation.5000.name:2 "Mất Liên Lạc"
 operation.5000.desc:1 "$role_spymaster$ [from.spynetwork.leader.GetName] báo cáo đã mất liên lạc với các điệp viên của [from.spynetwork.leader.GetHisHer] đang triển khai tích cực tại §H[from.spynetwork.target.GetName]§!. Họ đã bỏ lỡ một số lần điểm danh định kỳ gần đây nhất.\n\nTheo quy trình chuẩn, giờ đây chúng ta phải quyết định có nên lần theo dấu vết các điệp viên của chính mình hay không."
 operation.5000.a:0 "Tìm kiếm các điệp viên của chúng ta."
 operation.5000.a.tooltip:2 "Tạm dừng §YChiến Dịch [from.GetName]§! trong khoảng một tháng.\nCơ hội thành công phụ thuộc vào cấp độ §HMã Hóa§! của mục tiêu."
 operation.5000.b.tooltip:1 "Âm thầm §Rhủy bỏ§! chiến dịch này. Bất kỳ §HNội Gián (Assets)§! nào chưa dùng sẽ không bị tiêu hao."
 operation.5000.c:1 "Kêu gọi sự trợ giúp từ Nội Gián địa phương."
 operation.5001.name:2 "Tái Lập Liên Lạc"
 operation.5001.desc:1 "Những nỗ lực của chúng ta đã thành công — liên lạc với các điệp viên đã được khôi phục. $role_spymaster$ [fromfrom.spynetwork.leader.GetName] đã bắt tay vào rà soát lại các quy trình giám sát mà [fromfrom.spynetwork.leader.GetHeShe] đã thiết lập để hoạt động tại §H[fromfrom.target.GetName]§!."
 operation.5002.name:1 "Xác Nhận Mất Liên Lạc"
 operation.5002.desc:4 "Bất chấp những nỗ lực cao nhất, chúng ta không thể khôi phục liên lạc với các điệp viên tại §H[fromfrom.target.GetName]§!. $role_spymaster$ [fromfrom.spynetwork.leader.GetName] đã ra lệnh rà soát lại các quy trình giám sát cho Mạng Lưới Điệp Viên tại đó; có thể người [fromfrom.target.GetAdj] sở hữu hệ thống §HMã Hóa§! tinh vi hơn chúng ta nghĩ.\n\nTrong khi đó, §HChiến Dịch [fromfrom.GetName]§! sẽ tiếp tục với năng lực giảm sút trong khi chúng ta bù đắp những tổn thất của mình."
 operation.5005.name:2 "Điệp Viên Bị Động"
 operation.5005.desc:2 "Dù đã thực hiện mọi biện pháp phòng ngừa được quy định trong khóa huấn luyện, một trong các điệp viên của chúng ta tại §Y[from.target.GetName]§! đã bày tỏ lo ngại rằng vỏ bọc của họ có thể đã bị lộ. Điều này dường như xảy ra vào thời điểm then chốt của §HChiến Dịch [from.GetName]§! — vì vậy, $role_spymaster$ [from.spynetwork.leader.GetName] yêu cầu thêm nguồn lực để [from.spynetwork.leader.GetHeShe] có thể ngăn ngừa những xáo trộn sâu hơn về sau."
 operation.5005.a:0 "Rủi ro như vậy là bình thường. Từ chối."
 operation.5005.b:0 "Các bạn sẽ có thêm nguồn lực."
 operation.5005.c:0 "Có lẽ hối lộ sẽ hiệu quả hơn?"
 operation.5005.d:0 "Hãy để Nội Gián của chúng ta xử lý vấn đề này."
 operation.5010.name:0 "Bị Bắt Bởi [patrol_drone.GetNamePlural]"
 operation.5010.desc:3 "Đế chế §Y[from.target.GetName]§! vừa được cảnh báo về sự hiện diện của chúng ta. Có vẻ như chúng ta thiếu thông tin tình báo đầy đủ về khu vực địa phương, và các điệp viên của chúng ta đã thu hút sự chú ý của các [patrol_drone.GetNamePlural] địa phương.\n\n§HChiến Dịch [from.GetName]§! vẫn chưa thực sự bị đe dọa, nhưng $role_spymaster$ [from.spynetwork.leader.GetName] cần sự hỗ trợ nhanh chóng."
 operation.5010.a:0 "Chúng ta phải tin tưởng vào ngoại giao."
 operation.5010.b:0 "Triển khai Nội Gián của chúng ta."
 operation.5011.name:0 "Giải Pháp Ngoại Giao"
 operation.5011.desc:3 "$role_spymaster$ [fromfrom.spynetwork.leader.GetName] và các đồng nghiệp của [fromfrom.spynetwork.leader.GetHisHer] đã dàn xếp ổn thỏa vụ xâm nhập vụng về của các điệp viên vào §Y[fromfrom.target.GetName]§!.\n\nCó thể trong thâm tâm, [fromfrom.target.GetName] coi những lời biện hộ của chúng ta chỉ là một mớ dối trá. Tuy nhiên, xét về vẻ bề ngoài, chúng ta được coi là 'trong sạch'."
 operation.5011.desc.hive:0 "Chúng ta đã đàm phán thành công để thoát khỏi vụ xâm nhập vụng về về mặt ngoại giao vào §Y[fromfrom.target.GetName]§!.\n\nCó thể trong thâm tâm, [fromfrom.target.GetName] không hề tin vào những lời bào chữa của chúng ta, nhưng từ góc nhìn bên ngoài: chúng ta tạm thời được coi là 'vô can'."
 operation.5015.name:0 "Trường Lực Đa Pha"
 operation.5015.desc:1 "Chúng ta đang dần mất liên lạc với các điệp viên khi họ tiến dần vào các khu vực an ninh nghiêm ngặt hơn tại §H[from.target.GetName]§!. Có nguy cơ chúng ta sẽ mất hoàn toàn sự hiện diện tại đó. Những sự gián đoạn này nhiều khả năng do công nghệ lá chắn cẩu thả của [from.target.GetAdj] phát ra nhiễu sóng mạnh."
 operation.5015.a:0 "Chúng ta sẽ phải cố gắng thích nghi."
 operation.5015.a.tooltip:0 "Chúng ta có thể thành công hoặc chịu thụt lùi trong chiến dịch, tùy thuộc một phần vào §Ycấp độ công nghệ§! tương đối của chúng ta."
 operation.5015.b:0 "Hãy quay chính phần cứng của chúng lại chống lại chúng."
 operation.5016.name:0 "$operation.5015.name$"
 operation.5016.desc:1 "Chúng ta đã mất toàn bộ liên lạc với các điệp viên được chỉ định cho §HChiến Dịch [fromfrom.GetName]§! tại §Y[fromfrom.target.GetName]§!. Dù là do mưu kế xảo quyệt của mục tiêu hay chỉ đơn giản là sự trùng hợp không may cho chúng ta, công nghệ lá chắn của [fromfrom.target.GetAdj] đã chứng minh là một đối thủ đáng gờm.\n\nCó khả năng người [fromfrom.target.GetSpeciesName] có thể hưởng lợi từ sự cố này. Mặc dù các [GetOperativesLowerPlural] của chúng ta có thể hoạt động bán tự chủ, nhưng nếu không có sự hiện diện chỉ đạo của chúng ta, chúng vẫn dễ bị kẻ thù bắt giữ hơn nhiều."
 operation.5020.name:0 "Bị Nhầm Là Thức Ăn"
 operation.5020.desc:1 "Một khía cạnh nguyên thủy của thực thể §Y[from.target.GetName]§! đã nhầm các điệp viên của chúng ta là thức ăn, và hiện đang ráo riết săn lùng họ. Cá thể [from.target.GetSpeciesName] [from.target.GetIndividualName] cụ thể này dường như theo bản năng coi bất kỳ thứ gì khác ngoài bản thân nó là nguồn dinh dưỡng tiềm năng."
 operation.5020.a:0 "Chúng ta nên dụ nó đi nơi khác."
 operation.5020.b:0 "Tiếp tục di chuyển! Chúng ta thích nghi và sinh tồn."
 operation.5020.c:0 "Săn lùng kẻ săn mồi. Triển khai §Y$asset_warrior_drone$§!."
 operation.5025.name:0 "Nhiệm Vụ Thực Địa Độc Hại"
 operation.5025.desc:2 "Có điều gì đó trong môi trường sống của §Y[from.target.GetName]§! dường như có độc tính nhẹ đối với các [GetIndividualNamePlural] được chỉ định cho §HChiến Dịch [from.GetName]§!. $operation.5025.close$"
 operation.5025.desc.repeat:2 "Đã có một sự thay đổi tinh vi bên trong môi trường sống của §Y[from.target.GetName]§!, một lần nữa trở nên độc hại nhẹ đối với chúng ta. $operation.5025.close$"
 operation.5025.close:0 "Điệp viên của chúng ta đang bắt đầu biểu hiện các triệu chứng, nhẹ nhất là làm suy giảm chức năng, và tệ nhất là làm lộ diện họ bên trong [from.target.GetGestaltEntityName] thù địch."
 operation.5025.a:0 "Chúng ta nên nghiên cứu một giải pháp."
 operation.5025.b:0 "Chúng ta phải nhanh chóng tiếp tục."
 operation.5025.b.tooltip:1 "Có nguy cơ là tất cả các Chiến Dịch được tiến hành tại §Y[toxic_field_country.GetName]§! có thể trở nên §Rkhó khăn hơn§! trong một thời gian, cho đến khi chúng ta có thể phát triển kháng thể."
 operation.5026.name:0 "Biện Pháp Khắc Phục Thực Địa"
 operation.5026.desc:2 "Các nỗ lực nghiên cứu của chúng ta đã được đền đáp, và các phương thuốc đang được phân phát cho các drone điệp viên. Độc tố nồng độ thấp tìm thấy trong môi trường sống của §Y[toxic_field_country.GetName]§! sẽ không còn gây ra bất kỳ trở ngại nào nữa, và §HChiến Dịch [event_target:toxic_field_operation.GetName]§! có thể tiếp tục."
 operation.5027.name:0 "Nhiệm Vụ Thực Địa Độc Hại Tiếp Diễn"
 operation.5027.desc:0 "Thời cơ thuận lợi của chúng ta bên trong §Y[toxic_field_country.GetName]§! đã khép lại, khiến các drone điệp viên của chúng ta bị ảnh hưởng rõ rệt bởi môi trường xung quanh. §HChiến Dịch [fromfromfrom.GetName]§! có thể tiếp tục, nhưng chúng ta phải hành động thận trọng kẻo các phản ứng dị ứng làm dấy lên sự nghi ngờ."
 operation.5030.name:0 "Nhiễu Sóng Dư Thừa"
 operation.5030.desc:1 "Môi trường trên các thế giới [excess_noise_country.GetAdj] đã tràn ngập tiếng ồn tĩnh điện — nhiều hơn nhiều so với dự tính của chúng ta. $operation.5030.close$"
 operation.5030.desc.repeat:1 "Môi trường trên các thế giới [excess_noise_country.GetAdj] lại một lần nữa tràn ngập tiếng ồn tĩnh điện, ở các tần số mà chúng ta vẫn chưa kịp thích nghi. $operation.5030.close$"
 operation.5030.close:1 "Các drone bí mật mà chúng ta chỉ định cho §HChiến Dịch [from.GetName]§! do đó đang phải hứng chịu tình trạng mất mát dữ liệu từng phần. Điều này gây ra những rủi ro đáng kể cho việc thu thập tình báo, và làm tăng nguy cơ bị bại lộ."
 operation.5030.a:0 "$operation.5025.a$" ##Research
 operation.5030.b:0 "$operation.5025.b$" ##Continue
 operation.5030.b.tooltip:0 "Có nguy cơ tất cả các Chiến Dịch được tiến hành tại §Y[excess_noise_country.GetName]§! có thể trở nên §Rkhó khăn hơn§! trong một thời gian, cho đến khi chúng ta có thể thích ứng phần cứng của mình."
 operation.5031.name:0 "Tái Định Tuyến Tín Hiệu Hoàn Tất"
 operation.5031.desc:2 "Các nỗ lực nghiên cứu của chúng ta đã được đền đáp, và các thông số kỹ thuật cho lớp bảo vệ mới chống nhiễu điện từ đang được phân phát khắp mạng lưới điệp viên của chúng ta tại §Y[excess_noise_country.GetName]§!. Những nỗ lực của chúng ta trong §HChiến Dịch [fromfromfrom.GetName]§! sẽ không còn bị cản trở bởi hiện tượng tĩnh điện dư thừa nữa."
 operation.5032.name:0 "Nhiễu Sóng Dư Thừa Tiếp Diễn"
 operation.5032.desc:0 "Thời cơ thuận lợi của chúng ta bên trong §Y[excess_noise_country.GetName]§! đã khép lại, với các điệp viên của chúng ta không thể né tránh tiếng ồn tĩnh điện dư thừa. §HChiến Dịch [fromfromfrom.GetName]§! có thể tiếp tục, nhưng với hiệu quả tác chiến bị suy giảm."
 operation.5035.name:1 "Bị Dập Tắt"
 operation.5035.desc:2 "$role_spymaster$ [from.spynetwork.leader.GetName] báo cáo rằng đội ngũ điệp viên của chúng ta gần §Y[snuffedout_country.GetName]§! đã bỏ lỡ nhiều điểm kiểm tra. Với tính chất của chiến dịch này, chúng ta đã dự liệu trước việc họ không thể duy trì liên lạc thường xuyên. Tuy nhiên, $role_spymaster$ của chúng ta tiếc rằng đã chắc chắn vào lúc này, đội ngũ đã mất tích.\n\n§HChiến Dịch [from.GetName]§! có thể được cứu vãn nếu chúng ta che giấu dấu vết thành công, đọ sức §H$MOD_INTEL_DECRYPTION_ADD$§! của chúng ta với §H$MOD_INTEL_ENCRYPTION_ADD$§! của [snuffedout_country.GetAdj]."
 operation.5035.a.tooltip:1 "Tạm dừng §YChiến Dịch [from.GetName]§! trong khoảng một tháng.\n\nCó xác suất từ §Htrung bình đến thấp§! hành động của chúng ta sẽ không bị chú ý, tùy thuộc vào §H$MOD_INTEL_ENCRYPTION_ADD$§! của mục tiêu.\n\n$ESPIONAGE_OPERATION_CHANCE_THEMED_ASSET$\n\n"
 operation.5035.b.tooltip:1 "§RHủy bỏ§! §YChiến Dịch [from.GetName]§!.\n\nCó xác suất §Gcao§! hành động của chúng ta sẽ không bị chú ý, tùy thuộc vào §H$MOD_INTEL_ENCRYPTION_ADD$§! của mục tiêu.\n\n$ESPIONAGE_OPERATION_CHANCE_CATEGORY_ASSET$\n\n"
 operation.5035.c:0 "$operation.5000.c$" ##Use Asset
 operation.5035.c.tooltip:1 "Tạm dừng §YChiến Dịch [from.GetName]§! trong khoảng một tháng.\n\nCó xác suất từ §Ycao đến trung bình§! hành động của chúng ta sẽ không bị chú ý. Cơ hội thành công của chúng ta giảm khi §H$MOD_INTEL_ENCRYPTION_ADD$§! của mục tiêu càng cao."
 operation.5036.name:1 "Che Giấu Thành Công"
 operation.5036.desc:0 "Dù đã tiêu hao đáng kể tài nguyên trong công tác của $role_spymaster$ [fromfrom.spynetwork.leader.GetName] tại §H[snuffedout_country.GetName]§!, an ninh tác chiến đã được tái lập. Mọi manh mối đã được xóa sạch; mọi thân phận ngụy trang đã được hủy bỏ. Một đội ngũ điệp viên mới sẽ tiếp quản từ đây, thi hành bộ mệnh lệnh tinh vi khác dưới sự giám sát chặt chẽ của $role_spymaster$ của chúng ta.\n\nTrong khi đó, phía [snuffedout_country.GetAdj] dường như vẫn không hề hay biết về sự hiện diện của chúng ta."
 operation.5037.name:1 "Chiến Dịch Bị Bại Lộ"
 operation.5037.desc:1 "Nỗi lo sợ tồi tệ nhất của chúng ta đã thành hiện thực: sự mất tích gần đây của các điệp viên tại §H[snuffedout_country.GetName]§! đã làm bại lộ phần lớn §HChiến Dịch [fromfrom.GetName]§!.\n\nMọi Mạng Lưới Điệp Viên của chúng ta đều được dàn xếp cẩn thận để trong điều kiện bình thường, chỉ có những bằng chứng hết sức mong manh mới có thể liên lụy chúng ta vào các hoạt động bí mật mà chúng ta tiến hành. Tuy nhiên, trong trường hợp này, chúng ta không thể hoàn toàn chắc chắn Tình báo nào có thể đã bị lộ; chúng ta cũng không thể biết [snuffedout_country.GetAdj] sẽ chọn cách phản ứng ra sao."
 operation.5037.desc.provocation:1 "Sự mất tích gần đây của các điệp viên tại §H[snuffedout_country.GetName]§! đã dẫn đến những hậu quả thảm khốc: toàn bộ chiến dịch của chúng ta đã bị bại lộ.\n\nCác Mạng Lưới Điệp Viên của chúng ta được quản lý cẩn mật để trong điều kiện bình thường, chúng mang lại cho chúng ta mức độ chối bỏ nhất định. Tuy nhiên, trong trường hợp này các hành động của chúng ta đủ nghiêm trọng để phía [snuffedout_country.GetAdj] khó lòng bỏ qua ngay cả những bằng chứng gián tiếp có thể dẫn ngược về chúng ta. Chúng ta không biết chính xác họ sẽ phản ứng ra sao, nhưng chúng ta nên chuẩn bị cho tình huống xấu nhất."
 operation.5040.name:0 "Bòn Rút Tài Nguyên"
 operation.5040.desc:0 "$role_spymaster$ [from.spynetwork.leader.GetName] gần đây đã tiến hành cuộc điều tra âm thầm đối với chính các điệp viên của [from.spynetwork.leader.GetHisHer] tại §Y[from.target.GetName]§!, sau khi nhận thấy hiệu suất của họ sụt giảm gần đây.\n\n[from.spynetwork.leader.GetHeSheCap] đã phát hiện những điệp viên này bòn rút tài nguyên được phân bổ cho việc thu thập tình báo và hối lộ. Những hàng hóa và tiền tệ này đang được tái đầu tư vào các mối kinh doanh của [from.target.GetAdj], mang lại cho nhóm điệp viên khoản lợi nhuận béo bở trên tổn thất của chúng ta. Kết quả là, sự tập trung và lòng trung thành của họ rõ ràng đã bị phân tán.\n\nTiến trình §HChiến Dịch [from.GetName]§! hiện đã bị tạm dừng, cho đến khi $role_spymaster$ [from.spynetwork.leader.GetName] có thể tái lập hiệu quả tác chiến."
 operation.5040.a:0 "Kỷ luật nghiêm khắc. Chúng ta cần những tài nguyên này."
 operation.5040.b:0 "Cắt đứt mọi quan hệ. Những điệp viên này là gánh nặng nguy hiểm."
 operation.5040.c:0 "Bỏ qua hành vi này nếu có thể thuyết phục họ hoàn thành nhiệm vụ."
 operation.5040.c.fail.stacking:0 "$TRIGGER_FAIL$§RChúng ta chỉ có thể vận hành một doanh nghiệp bí mật như vậy tại một thời điểm.§!"
 operation.5040.c.fail.commerce:0 "§RCơ hội như vậy chỉ có thể khai thác nếu chúng ta có §YHiệp Ước Thương Mại§! với [from.target.GetName].§!"
 operation.5041.name:1 "Điệp Viên Khởi Nghiệp Quay Đầu"
 operation.5041.desc:0 "Các điệp viên của chúng ta tại §Y[fromfrom.target.GetName]§! không còn bòn rút tài nguyên từ phần phân bổ cho Mạng Lưới Điệp Viên nữa. Những lời nhắc nhở đanh thép về nơi họ thuộc về đã khơi dậy tinh thần cống hiến của các điệp viên; họ sẽ đem toàn bộ tài năng tháo vát của mình cống hiến trọn vẹn cho sự nghiệp của chúng ta."
 operation.5042.name:0 "Điệp Viên Khởi Nghiệp Đào Tẩu"
 operation.5042.desc:0 "$role_spymaster$ [fromfrom.spynetwork.leader.GetName] tiếc nuối báo cáo về sự tan vỡ trong Mạng Lưới Điệp Viên của chúng ta tại §Y[fromfrom.target.GetName]§!.\n\nKhi một nhóm biến chất trong số các điệp viên của chúng ta bị triệu tập để chất vấn, phản ứng của chúng là bỏ trốn — tản mác vào các vùng không gian của [fromfrom.target.GetAdj] mà ngay cả chúng ta cũng phải chật vật theo dõi. [fromfrom.spynetwork.leader.GetName] không còn khả năng truy lùng chúng — ít nhất là nếu không muốn thu hút sự chú ý không đáng có."
 operation.5045.name:0 "Đồng Minh Đáng Ngờ"
 operation.5045.desc.intro:0 "Nhân vật $role_spymaster$ của chúng ta tại §Y[from.target.GetName]§!, [from.spynetwork.leader.GetName], báo cáo một thất bại nặng nề trong quy trình sàng lọc điệp viên của [from.spynetwork.leader.GetHisHer]. Tin tức từ thủ đô của [from.target.GetAdj] cho biết [root.GetOperativeRoleIndefiniteArticle] đã chọn cách §Rđào tẩu§!."
 operation.5045.desc.culture:0 "$operation.5045.desc.intro$\n\nCó vẻ như [root.GetOperativeRole] đã dần đồng cảm hơn với văn hóa và các đạo đức nền tảng của [from.target.GetName], đối nghịch với chúng ta. Quy trình sàng lọc của chúng ta đã thất bại khi đáng lẽ phải loại trừ được những kẻ dao động như vậy."
 operation.5045.desc.turned:0 "$operation.5045.desc.intro$\n\nDù thực tế là chúng ta đáng lẽ phải sàng lọc được những kẻ bất trung như vậy, [root.GetOperativeRole] đã bị 'lật kèo' — hoặc do hành động Phản Gián, hoặc do sự đồng cảm bẩm sinh đối với [from.target.GetName] mà trước đây chúng ta không thể phát hiện ra."
 operation.5045.a:0 "Cắt đứt quan hệ với [doubtful_asset.GetName]. Chúng ta không thể mạo hiểm."
 operation.5045.a.tooltip:0 "Nếu [from.target.GetName] có Mạng Lưới Điệp Viên nhắm vào chúng ta, họ sẽ được cảnh báo về một âm mưu chống lại họ. $tooltip_espionage_identify_decryption_encryption$"
 operation.5045.b:0 "Chấn chỉnh lại nội bộ đi, [from.spynetwork.leader.GetName]!"
 operation.5045.b.tooltip:0 "Có 50% khả năng rằng nếu [from.target.GetName] có Mạng Lưới Điệp Viên nhắm vào chúng ta, họ sẽ được cảnh báo về một âm mưu chống lại họ. $tooltip_espionage_identify_decryption_encryption$"
 operation.5045.c.tooltip:0 "Chúng ta có thể đảm bảo [from.target.GetName] sẽ không nhận được bằng chứng đáng tin cậy về âm mưu chống lại họ."
 operation.5050.name:0 "Mối Quan Ngại Sâu Sắc"
 operation.5050.desc.intro:0 "Một điệp viên tại §Y[from.target.owner.GetName]§! đã vướng phải thiết bị chống xâm nhập, được lắp đặt trong các đường ống kỹ thuật của căn cứ sao [from.target.GetName]."
 operation.5050.desc:0 "$operation.5050.desc.intro$\n\nThương tích rất nghiêm trọng, nhưng điệp viên của chúng ta đã hoàn thành nhiệm vụ và duy trì vỏ bọc cho đến nay. Tuy nhiên, giới chức [from.target.owner.GetAdj] nhận thấy rõ ràng vụ việc là bất thường và đáng ngờ. Các câu hỏi đang được đặt ra, và điệp viên của chúng ta càng ở lại khu y tế của họ lâu, nguy cơ bị lộ vỏ bọc càng lớn."
 operation.5050.desc.machine:0 "$operation.5050.desc.intro$\n\nDrone đã chịu tổn hại nghiêm trọng, nhưng đã hoàn thành nhiệm vụ và duy trì vỏ bọc cho đến nay. Tuy nhiên, giới chức [from.target.owner.GetAdj] nhận thấy rõ ràng vụ việc là bất thường và đáng ngờ. Các câu hỏi đang được đặt ra, và điệp viên của chúng ta càng ở dưới sự giám sát của họ lâu, nguy cơ bị bại lộ càng lớn."
 operation.5050.desc.hostile:0 "$operation.5050.desc.intro$\n\nHiện tại họ không thể di chuyển xa hoặc hỗ trợ nhiều hơn mức cơ bản cho phần còn lại của chiến dịch, vì vậy họ đã đảm bảo được một nơi ẩn náu tương đối an toàn. Tuy nhiên, khu vực này chắc chắn sẽ sớm diễn ra một đợt quét dọn bảo trì. Điệp viên của chúng ta càng ở lại trong sự kiểm soát của [from.target.owner.GetAdj] lâu, nguy cơ bại lộ càng lớn."
 operation.5050.a:0 "Thu xếp một cuộc giải cứu triệt thoái."
 operation.5050.b:0 "Chúng ta phải tiếp tục mà không có họ."
 operation.5050.c.tooltip:0 "§RHủy bỏ§! §YChiến Dịch [from.GetName]§!.\n\nCó xác suất §Gcao§! hành động của chúng ta sẽ không bị chú ý, tùy thuộc vào §H$MOD_INTEL_ENCRYPTION_ADD$§! của mục tiêu.\n\nĐảm bảo thành công nếu chúng ta có một §YNhân Tố Phá Hoại§! được chỉ định cho Chiến Dịch này.\n\n"
 operation.5055.name.regular:0 "Lòng Tin Dao Động"
 operation.5055.name.gestalt:0 "Tính Đồng Bộ Dao Động"
 operation.5055.desc.regular:0 "Một nhóm điệp viên phụ trợ tại §Y[target_country.GetName]§! đã bắt đầu né tránh các nhiệm vụ được giao, viện dẫn sự thiếu tin tưởng vào mục đích chung của họ. $role_spymaster$ [operation.leader.GetName] thông thường sẽ xử lý những vấn đề như vậy mà không cần báo cáo lên chúng ta, nhưng ngay cả khi không biết bất kỳ chi tiết nào: các điệp viên này dường như nắm bắt thông tin bất thường về §HChiến Dịch [from.GetName]§!, và thậm chí có lẽ là toàn bộ mạng lưới điệp viên.\n\nVì các nhân viên phụ trợ này được cách ly khỏi các đặc vụ chủ lực nắm nhiều thông tin của chúng ta, [operation.leader.GetName] nghi ngờ các điệp viên này đang được cung cấp thông tin từ một nguồn bên ngoài. [operation.leader.GetHeSheCap] cũng thừa nhận rằng họ có thể chỉ đơn giản là những cá nhân có khả năng nhận thức cao.\n\n$operation.5055.desc.outro$"
 operation.5055.desc.gestalt:0 "Một nhóm điệp viên phụ trợ tại §Y[target_country.GetName]§! đã bắt đầu chậm trễ trong các nhiệm vụ được giao, biểu hiện hành vi có thể diễn giải là sự hoài nghi. Chúng ta thông thường sẽ xử lý trực tiếp những vấn đề này thông qua $role_spymaster$ [operation.leader.GetName], nhưng nhóm này hành động như thể chúng có thể nhận thức được những toan tính rộng lớn hơn của §HChiến Dịch [from.GetName]§!, và có lẽ là toàn bộ mạng lưới điệp viên.\n\nVì các nhân viên phụ trợ này được cách ly khỏi các đặc vụ chủ lực hơn của chúng ta, chúng ta nghi ngờ chúng đang được tiếp nhận thông tin từ một nguồn bên ngoài. Tuy nhiên, cũng có thể sự tiếp xúc gần gũi với các đặc vụ độc lập đơn giản đã mang lại cho những điệp viên này sự thấu hiểu sâu sắc mà một ngày nào đó chúng ta có thể thấy hữu ích.\n\n$operation.5055.desc.outro$"
 operation.5055.desc.outro:0 "Trước những hoài nghi này - cùng các mối đe dọa đối với Chiến Dịch [from.GetName] theo từng kịch bản - $role_spymaster$ [operation.leader.GetName] xin chỉ thị về phương hướng tiến hành tiếp theo."
 operation.5055.a:0 "Rủi ro quá lớn; hãy cắt đứt với chúng."
 operation.5055.b:0 "Hãy xem những 'sự thấu hiểu' này sẽ dẫn tới đâu."
 operation.5055.b.tooltip:1 "Sẽ dẫn đến một trong hai:\n- tạm thời §Ggiảm Độ Khó Chiến Dịch§! tại §Y[target_country.GetName]§! hoặc\n- tạm thời §Rgiảm $MOD_INTEL_DECRYPTION_ADD$§!."
 operation.5056.name:0 "Sự Thấu Hiểu Kiên Định"
 operation.5056.desc:1 "Các điệp viên phụ trợ của chúng ta tại §Y[target_country.GetName]§! đã dốc hết sức mình với sự nhiệt thành khác thường khi biết rằng những nghi ngờ từng mơ hồ của họ rốt cuộc lại bắt nguồn từ một lý tưởng chân thực. $role_spymaster$ [operation.leader.GetName] duy trì sự phong tỏa thông tin nghiêm ngặt, nhưng báo cáo rằng các tuyến tiếp vận của [operation.leader.GetHisHer] chưa bao giờ suôn sẻ hơn thế."
 operation.5057.name:0 "Điệp Viên Hoảng Loạn"
 operation.5057.desc:1 "Các điệp viên phụ trợ của chúng ta tại §Y[target_country.GetName]§! đã phản ứng kinh hãi khi biết được sự thật đằng sau những nghi ngờ từng mơ hồ của họ. $role_spymaster$ [operation.leader.GetName] chỉ hé lộ một phần bức tranh toàn cảnh cho họ, nhưng điều đó đã đủ để làm gián đoạn các tuyến tiếp vận của chúng ta. Khả năng vô hiệu hóa $MOD_INTEL_ENCRYPTION_ADD$ của [target_country.GetAdj] của chúng ta sẽ bị suy giảm trong một thời gian."
 manifesti.1.name:0 "Những Người Biểu Tình Lễ Hội"
 manifesti.1.desc:0 "Các cuộc biểu tình đã bùng nổ khắp [this.GetName], xuất phát từ nỗi âu lo ngày càng tăng về sự chuyển đổi rõ rệt của xã hội chúng ta sau cuộc tiếp xúc đầu tiên với giống loài ngoài hành tinh. Những người biểu tình đặt câu hỏi về các truyền thống lâu đời, thách thức nền tảng cai trị và đòi hỏi những sự thích ứng để đón nhận một tương lai được định hình lại bởi phát hiện này.\n\nDù phi bạo lực, quy mô to lớn của các phong trào này đã gây áp lực lên các dịch vụ dân sự và làm gián đoạn đời sống thường nhật. Tuy nhiên, nhiều công dân không xem các cuộc biểu tình này đơn thuần là tình trạng hỗn loạn. Họ coi đó là một sự thức tỉnh, một dấu hiệu cho thấy chính bản sắc của chúng ta đang được viết lại ngay trước mắt chúng ta."
 manifesti.1.a:0 "Không hành động."
 manifesti.1.b:0 "Khuyến khích tham gia."
 manifesti.1.c:0 "Cho phép sử dụng vũ lực."
 manifesti.1.d:0 "Xoa dịu những người bất đồng."
 manifesti.1.e:0 "Huy động phản ứng từ quần chúng."
 manifesti.1.f:0 "Lấp đầy các con phố bằng những cuộc tuần hành đoàn kết."
 manifesti.1.g:0 "Tổ chức một cuộc phản biểu tình."
 manifesti.1.h:0 "Định hướng đây là sự xao nhãng."
 manifesti.1.tt:0 "Điều này sẽ xóa sổ phe Manifesti"
 manifesti.5.name:0 "Phe Manifesti"
 manifesti.5.desc:0 "Các cuộc biểu tình trên [Root.GetName] đã chấm dứt gần như đột ngột như khi chúng bắt đầu. Nhiều người hiện đang chĩa mũi dùi vào §HPhe Manifesti§!, một tập thể bí ẩn nổi tiếng với những tác phẩm khiêu khích thách thức các chuẩn mực xã hội. Dù sự can dự của họ vẫn chưa được xác nhận, các dự án mới nhất của họ đã xoay quanh những hậu quả tiềm tàng của cuộc tiếp xúc đầu tiên, thổi bùng cả tranh cãi lẫn bất ổn.\n\nDù các cuộc tuần hành đã kết thúc, §HPhe Manifesti§! vẫn còn đó. Thông điệp của họ lan rộng, tầm ảnh hưởng của họ vẫn dai dẳng. Đã đến lúc quyết định chúng ta sẽ ứng phó ra sao."
 manifesti.5.a:0 "Cứ để họ vui chơi thỏa thích."
 manifesti.5.b:0 "Tuyên bố Thiết Quân Luật."
 manifesti.5.c:0 "Nấu chảy các tác phẩm để lấy tài nguyên."
 manifesti.5.d:0 "Tuyên bố họ là sứ giả của cõi hư không."
 manifesti.5.e:0 "Làm gián đoạn liên lạc trên toàn hành tinh."
 manifesti.5.f:0 "Định vị và giam giữ thân nhân của họ."
 manifesti.5.f.tt1:0 "các vụ bắt giữ dập tắt phong trào"
 manifesti.5.f.tt2:0 "các vụ bắt giữ dập tắt phong trào nhưng cũng châm ngòi bất ổn dân sự và sự tàn phá"
 manifesti.10.name:0 "Bóp Chết Từ Trứng Nước"
 manifesti.10.desc_militarist:0 "§HPhe Manifesti§! sẽ không còn làm phiền chúng ta nữa. Một cuộc trấn áp chớp nhoáng và dứt khoát đã giải tán phong trào của họ, phân tán các thành viên và dập tắt thông điệp của họ. Thứ cái gọi là 'nghệ thuật' của họ đã bị tịch thu, các thủ lĩnh của họ đã biến mất.\n\nTrật tự đã được vãn hồi, và dân chúng sẽ phải suy nghĩ kỹ trước khi đón nhận hệ tư tưởng liều lĩnh như vậy một lần nữa."
 manifesti.10.desc_materialist:0 "Cảm xúc chẳng có giá trị gì, nhưng tài nguyên thì có. Những thứ gọi là 'dự án' của phe Manifesti đã bị tịch thu, tháo dỡ và tái sử dụng cho các mục đích thực tế hơn. Khi các điểm tập hợp của họ không còn, phong trào đã mất đi động lực."
 manifesti.10.desc_spiritualist:0 "Sự thách thức của §HPhe Manifesti§! không đơn thuần là nổi loạn mà là một dấu hiệu, một thông điệp từ chính cõi hư không. Thay vì bịt miệng họ, chúng ta sẽ lắng nghe. Một người trong số họ đã được chọn để tham gia vào bộ máy cai trị của chúng ta, nơi họ sẽ hưởng những tiện nghi tốt nhất trong khi dẫn dắt chúng ta hướng tới sự hiểu biết sâu sắc hơn về vũ trụ."
 manifesti.10.desc_xenophobe:0 "Sự bất đồng không thể lan truyền nếu không có tiếng nói mang nó đi. Bằng cách đóng cửa hệ thống liên lạc hành tinh, chúng ta đã cắt đứt khả năng phối hợp của những người biểu tình. Không có sự chỉ dẫn từ các thành phần ngoại bang, phong trào của họ chắc chắn sẽ sụp đổ.\n\nĐáng tiếc là việc ngắt liên lạc cũng ảnh hưởng đến khả năng thực thi nhiệm vụ của lực lượng hành pháp."
 manifesti.10.desc_authoritarian:0 "Bất đồng là chuyện gia đình. Bằng cách giam giữ thân nhân của những kẻ kích động chủ chốt, chúng ta đã buộc §HPhe Manifesti§! phải quy phục. Với ý chí bị bẻ gãy và các thủ lĩnh bị giam giữ, phong trào đã sụp đổ.\n\nTrật tự đã được vãn hồi, và uy quyền của chúng ta là không thể nghi ngờ."
 manifesti.10.desc_dismantled_exhibition:0 "Triển lãm đã được âm thầm tháo dỡ, những người sáng tạo bị khiển trách, và những tác phẩm mang tính kích động hơn đã bị tịch thu. Các kênh chính thức đã cam đoan với các đối tác ngoài hành tinh rằng luận điệu gây rối như vậy không phản ánh chính sách của nhà nước.\n\nTrong khi một số người lên án động thái này là kiểm duyệt, hầu hết giờ đây đều hiểu một chân lý giản đơn: Luôn có giới hạn cho tự do biểu đạt khi sự ổn định của đế chế bị đe dọa."
 manifesti.10.desc_violent_protests:0 "Thân nhân của §HPhe Manifesti§! đã bị giam giữ, và cùng với họ, ban lãnh đạo của phong trào đã bị vô hiệu hóa hiệu quả. Tuy nhiên, thay vì phục tùng, phản ứng của công chúng lại là sự phẫn nộ tột cùng. Các cuộc biểu tình ngày càng gay gắt hơn, không còn giới hạn ở các cuộc tuần hành đơn thuần mà đã bùng phát thành bạo loạn dữ dội."
 manifesti.10.a:0 "Hy vọng đó là dấu chấm hết cho sự vô nghĩa như vậy."
 manifesti.10.b:0 "Một rủi ro có tính toán."
 manifesti.15.name:0 "Ngàn Lời Nói, Không Lời Nào Chính Thức"
 manifesti.15.desc:0 "Một ngôn ngữ bịa đặt đã bắt đầu lan rộng qua các trung tâm nghệ thuật và cơ sở học thuật, một sự chối bỏ có chủ đích đối với tiếng nói chính thức. Được sáng tạo bởi §HPhe Manifesti§!, những người nói ngôn ngữ này từ chối công nhận tính hợp pháp của ngôn ngữ chúng ta, coi nó như biểu tượng của một xã hội không còn có thể tự định nghĩa mình sau cuộc tiếp xúc đầu tiên.\n\nCác quan chức cảnh báo rằng việc ngày càng từ chối giao tiếp bằng các thuật ngữ đã định sẵn này có nguy cơ khoét sâu chia rẽ và gây mất ổn định diễn ngôn công chúng."
 manifesti.15.a:0 "Mua chuộc sự im lặng của họ."
 manifesti.15.b:0 "Khấu trừ lương của những kẻ không tuân thủ."
 manifesti.15.c:0 "Hưởng ứng theo trào lưu."
 manifesti.15.d:0 "Tôn vinh sự đa dạng ngôn ngữ."
 manifesti.15.e:0 "Thúc đẩy đối thoại, không gây chia rẽ."
 manifesti.20.name:0 "Tấm Gương Sáng Ngời"
 manifesti.20.desc:0 "§HPhe Manifesti§! đã công bố cuộc triển lãm công khai nhất của họ cho đến nay. Một trải nghiệm tương tác mới và cực kỳ nổi tiếng trên [this.GetName] mời gọi khách tham quan thao túng các hình ảnh phản chiếu của chính họ, và tạo ra những bức tranh cắt dán biến dạng về các nhân vật chính trị — một số thậm chí đến từ §Hcác đế chế thiên hà khác§!.\n\nGiới phê bình ca ngợi những tác phẩm này là một sự soi chiếu khắt khe và cần thiết vào ý thức về bản thân của chúng ta. Cuộc triển lãm cũng truyền cảm hứng cho hàng loạt tác phẩm châm biếm khác về các vấn đề nội bộ cũng như quan hệ liên chủng loài.\n\nCác cuộc tranh luận giữa các nhà nghiên cứu xã hội của chúng ta diễn ra sôi nổi; các tiếng nói bảo thủ hơn thì hối thúc sự thận trọng."
 manifesti.20.a:0 "Một tuyên ngôn táo bạo."
 manifesti.20.b:0 "Một thảm họa ngoại giao chực chờ xảy ra. Đóng cửa chúng ngay."
 manifesti.25.name:0 "Sự Trỗi Dậy của Phe Manifesti"
 manifesti.25.desc:0 "Những lời đồn đại lan truyền rằng một phe phái mới đang nổi lên, được thúc đẩy bởi lý tưởng 'Chủ nghĩa Manifesti'. Sau cuộc tiếp xúc đầu tiên, khi sự hiểu biết của chúng ta về vũ trụ và vị thế của chúng ta trong đó bị đặt dấu hỏi, những người ủng hộ nó thách thức các chuẩn mực đã được thiết lập. Họ cổ xúy cho sự tự do biểu đạt cực đoan và việc đánh giá lại căn bản các cấu trúc xã hội. Các phái hiện tại phàn nàn rằng các cuộc tụ họp của họ đang bị phá rối bởi những kẻ kích động Manifesti, những kẻ không ngừng thách thức bộ máy cai trị và đang gieo rắc mối bất hòa khắp [Root.GetName]."
 manifesti.25.a:0 "Đó là điều tất yếu."
 manifesti.25.tt:0 "Kích hoạt §YPhái§! §HPhe Manifesti§!"
 manifesti.25.b:0 "Đón nhận Chủ nghĩa Manifesti."
 manifesti.25.c:0 "Tuyên bố nhóm này nằm ngoài vòng pháp luật."
 manifesti.30.name:0 "Sự Tĩnh Lặng Bao Trùm"
 manifesti.30.desc:0 "Cơn sốt xung quanh phái §YPhe Manifesti§! đã lắng dịu, tan biến nhanh chóng như các cuộc biểu tình châm ngòi cho nó. Một số nhà hoạt động mà chúng ta trò chuyện tuyên bố động cơ của họ trải dài từ châm biếm thuần túy đến phản kháng lương tri.\n\nSố lượng người tham quan các phòng tranh và bảo tàng chưa bao giờ cao hơn thế, nhưng ánh nhìn của công chúng đã chuyển sang các nhóm nghệ sĩ mới mẻ và gây tranh cãi hơn. Chúng ta sẽ tiếp tục sàng lọc các dữ liệu thu thập được trong thời khắc kỳ lạ này của lịch sử văn hóa [root.GetAdj]."
 manifesti.30.a:0 "Rõ ràng là cuộc sống vẫn tiếp diễn."
 manifesti.30.b:0 "Ý thích bất chợt thoáng qua."
 factions.1.desc.manifesti:0 "Các thành viên của họ đã châm ngòi cho những cuộc biểu tình muôn màu sắc về các vấn đề vô chính phủ đa dạng, đòi hỏi một xã hội cởi mở và bình đẳng hơn.\n\n"
 factions.2000.desc.manifesti:0 "Sau khi đưa phái này vào chính phủ của họ, họ đã trở nên §HBình Đẳng§! một cách lập dị.\n\n"
 manifesti_chain_title:0 "Sự Trỗi Dậy của Phe Manifesti"
 manifesti_chain_desc:0 "Đời sống thường nhật tại [owner.GetName] được điểm xuyết bởi những màn trình diễn công cộng lập dị và gây rối. Mục đích của chúng có vẻ lành tính và mang tính biểu đạt nghệ thuật — nhưng thứ nghệ thuật này có thể gây ra ảnh hưởng gì đối với xã hội rộng lớn hơn của chúng ta?"
 manifesti_rise:0 "Làn Sóng Manifesti"
 operative_resurfaces_chain_title:0 "Điệp Viên Tái Xuất"
 operative_resurfaces_chain_desc:0 "Một bộ mật mã bí mật đã hết hạn từ lâu vừa được truyền lại cho chúng ta, liên kết với các Chiến Dịch mà chúng ta từng tiến hành trước đây tại §Y[disavowed_agent_country.GetName]§!.\n\nMột điệp viên từng bị phủ nhận danh tính dường như đang cố gắng báo cáo trở lại, tuyên bố nắm giữ tình báo về §Hcác nhân vật chính trị chủ chốt§! tại [disavowed_agent_country.GetName] — nhưng liệu những mật mã đã hết hạn này có đáng tin?"
 planet_manifesti_joy:0 "Những Làn Gió Đổi Mới"
 planet_manifesti_joy_desc:0 "Các cuộc biểu tình công cộng đã trở thành cảnh tượng quen thuộc, hòa quyện giữa phản kháng và ăn mừng, làm đảo lộn nếp sống thường nhật."
 planet_manifesti_uslurp_mod:0 "Bất Đồng Ngôn Ngữ"
 planet_manifesti_uslurp_mod_desc:1 "Một ngôn ngữ bịa đặt đã bám rễ như một hình thức phản kháng, chối bỏ diễn ngôn chính thức và khoét sâu thêm sự chia rẽ xã hội. Việc giao tiếp với các nhà chức trách ngày càng trở nên căng thẳng."
 planet_manifesti_exhibition_shutdown:0 "Đàn Áp Văn Hóa"
 planet_manifesti_exhibition_shutdown_desc:0 "Những tiếng nói bất đồng đã bị dập tắt, và nghệ thuật gây rối đã bị dỡ bỏ. Phản ứng kiên quyết của nhà nước đã củng cố sự ổn định, nhưng phải trả giá bằng sự tự do sáng tạo và niềm tin của công chúng."
 manifesti_reflections_mod:0 "Sự Phản Chiếu Sâu Sắc"
 manifesti_reflections_mod_desc:0 "Một tác phẩm sắp đặt nghệ thuật nổi tiếng của Manifesti mời gọi khách tham quan suy ngẫm về khái niệm bản ngã và cách họ nhìn nhận người khác, làm mới lại sự quan tâm đối với các ngành khoa học xã hội."
 manifesti_sweet_dreams_mod:0 "Giấc Mơ Thành Hiện Thực Manifesti"
 manifesti_sweet_dreams_mod_desc:0 "Nhóm nghệ thuật Manifesti tiên phong đã tan rã, để lại một di sản gồm các nghiên cứu trường hợp xã hội học và tình trạng vô chính phủ cấp thấp trong dân sự."
 planet_manifesti_polarization:0 "Lòng Trung Thành Rạn Nứt"
 planet_manifesti_polarization_desc:0 "Các cuộc biểu tình thổi bùng những tranh cãi diện rộng, khơi dậy sự đồng cảm đối với những người biểu tình và yêu sách của họ."
 planet_manifesti_egalitarian_attraction:0 "Tiếng Nói Được Tiếp Sức"
 planet_manifesti_egalitarian_attraction_desc:0 "Cách chúng ta đối xử công bằng với những người biểu tình đã củng cố sự ủng hộ của công chúng đối với lý tưởng bình đẳng."
 planet_manifesti_pacifist_attraction:0 "Giữ Vững Sự Hài Hòa"
 planet_manifesti_pacifist_attraction_desc:0 "Phản ứng hòa bình của chúng ta trước các cuộc biểu tình đã củng cố các lý tưởng hòa bình trong quần chúng."
 planet_manifesti_xenophile_attraction:0 "Đón Nhận Văn Hóa"
 planet_manifesti_xenophile_attraction_desc:0 "Cách tiếp cận khoan dung của chúng ta đối với các cuộc biểu tình đã thúc đẩy sự cởi mở và thấu hiểu, củng cố các lý tưởng thân thiện ngoại bang trong quần chúng."
 planet_manifesti_network_disrupted:0 "Các Mối Quan Hệ Bị Cắt Đứt"
 planet_manifesti_network_disrupted_desc:0 "Khi liên lạc hành tinh bị cắt đứt, ảnh hưởng ngoại bang đã bị loại bỏ, và các phần tử lật đổ phải chật vật để tổ chức. Quần chúng, nay được che chắn khỏi sự can thiệp từ bên ngoài, ngày càng trở nên cô lập và cảnh giác hơn với các tư tưởng ngoại lai."
 manifesti_leader_desc:0 "Một cựu thủ lĩnh §YManifesti§! đã trở thành nhà tiên tri, họ tuyên bố đã thoáng thấy một chân lý ẩn giấu trong cõi hư không."
 manifesti_leader_tt:0 "Việc sa thải một cựu đầu sỏ §YManifesti§! sẽ làm ô danh thỏa thuận từng dẫn đến sự giải thể của phong trào."
 planet_manifesti_widespread_arrests:0 "Bài Học Về Sự Phục Tùng"
 planet_manifesti_widespread_arrests_desc:0 "Các vụ bắt giữ hàng loạt đã gửi đi một thông điệp rõ ràng rằng trật tự sẽ được giữ vững bằng mọi giá. Nỗi sợ hãi và sự phục tùng bén rễ, và quần chúng ngày càng chấp nhận sự cai trị cứng rắn như cái giá của sự ổn định."
 planet_manifesti_endorsed:0 "Ủng Hộ Phe Manifesti"
 planet_manifesti_endorsed_desc:0 "Bằng việc đón nhận phe Manifesti, chúng ta đã hợp pháp hóa các lý tưởng tự do biểu đạt và thay đổi xã hội của họ. Diễn ngôn công chúng đang chuyển dịch, và sự ủng hộ đối với các giá trị bình đẳng đang trên đà gia tăng."
 planet_manifesti_supressed:0 "Trấn Áp Phe Manifesti"
 planet_manifesti_supressed_desc:0 "Phong trào Manifesti đã bị cưỡng chế giải tán, gửi đi một thông điệp rõ ràng rằng sự bất đồng sẽ không được dung thứ. Trong khi các lý tưởng độc tài giành được sự ủng hộ, tình trạng bất ổn trong quần chúng vẫn âm ỉ sôi sục dưới bề mặt."
 pft_manifesti:0 "Phái Manifesti"
 pft_manifesti_desc:0 "Các Phái Manifesti kiên trì theo đuổi những mục tiêu dị thường và đa dạng, khao khát tự do biểu đạt và không phân biệt đối xử trong các cấu trúc xã hội được cải cách.\n\n§LĐạo Đức Bình Đẳng§!"
 MANIFESTI_RIVERS_MOVEMENT:0 "Chủ Nghĩa Tự Do Trầm Tích"
 MANIFESTI_RIVERS_RESTRAINED:0 "$MANIFESTI_RIVERS_MOVEMENT$"
 MANIFESTI_RIVERS_DESC:0 "[root.GetName] sẽ rất hài lòng khi thấy sự chuyển động không hạn chế của nước dưới mọi hình thái như sông băng, đầm lầy và đại dương."
 MANIFESTI_MUNITIONS_AUTO:0 "Quyền Tự Quyết Cho Khí Giới"
 MANIFESTI_MUNITIONS_OPPRESSED:0 "$MANIFESTI_MUNITIONS_AUTO$"
 MANIFESTI_MUNITIONS_DESC:0 "[root.GetName] tha thiết mong muốn các tàu quân sự được ban cho tri giác, và từ đó có quyền tự do lựa chọn phương thức triển khai tác chiến."
 MANIFESTI_CAREFREE_SCIENCE:0 "Đầu Óc Trên Mây"
 MANIFESTI_CAREFREE_SCIENCE_OPPRESSED:0 "$MANIFESTI_CAREFREE_SCIENCE$"
 MANIFESTI_CAREFREE_SCIENCE_DESC:0 "[root.GetName] khẳng định rằng §Ynghiên cứu công nghệ§! chỉ nên được giao phó cho một hội đồng nhìn xa trông rộng gồm những kẻ lang thang vô ưu vô lo."
 MANIFESTI_RETINAL_FOCUS:0 "Phòng Trưng Bày Võng Mạc"
 MANIFESTI_RETINAL_FOCUS_OPPRESSED:0 "$MANIFESTI_RETINAL_FOCUS$"
 MANIFESTI_RETINAL_FOCUS_DESC:0 "[root.GetName] sẽ rất hài lòng khi giữ sản xuất £consumer_goods£ $CONSUMER_GOODS$ trong tình trạng thâm hụt, giúp công dân của chúng ta thoát khỏi thứ mà họ gọi là 'Tai Họa Đồ Làm Sẵn'."
 MANIFESTI_SILENT_PARTNER:0 "Đối Tác Thầm Lặng"
 MANIFESTI_SILENT_PARTNER_OPPRESSED:0 "$MANIFESTI_SILENT_PARTNER$"
 MANIFESTI_SILENT_PARTNER_DESC:0 "[root.GetName] sẽ rất hài lòng khi nắm giữ quyền lực chính trị hoặc ngoại giao nhưng từ chối sử dụng nó, tham gia vào các cuộc đấu mắt thay vì cử phái viên đi."
 envoy_events.100.name:0 "Lời Nhục Mạ Đầy Bê Bối"
 envoy_events.100.desc.regular:0 "Chúng ta đã bắt quả tang một đại biểu từ §H[scandalous_insult_country.GetName]§! trong một sơ hở hiếm thấy, để lộ cảm nghĩ thực sự của đế chế họ về chúng ta cho một bên ẩn danh khác. Vượt xa những trò bôi nhọ chính trị thông thường: điều này tương đương một §Plời nhục mạ công nhiên§!, khi có vẻ như chúng ta đang là đối tượng bị chế giễu kịch liệt trong xã hội [scandalous_insult_country.GetAdj].\n\nDù chúng ta có bận tâm đến lời vu khống vô căn cứ này hay không: ngoại giao và lòng tự tôn đòi hỏi chúng ta phải giữ vững lập trường của mình."
 envoy_events.100.desc.gestalt:0 "Một đại biểu từ §H[scandalous_insult_country.GetName]§! đã để lộ cảm nghĩ thực sự của thực thể gestalt của họ về chúng ta, dường như là trong hội nghị với các bên ẩn danh khác. Xét đến việc thật nhỏ nhen làm sao khi một ý thức hợp nhất lại toan tính thứ gọi là 'bôi nhọ chính trị', điều này khiến chúng ta coi đó là một §Plời nhục mạ vô lý và nặng nề§!.\n\nDù chúng ta có bận tâm đến lời vu khống vô căn cứ này hay không: ngoại giao và lòng tự tôn đòi hỏi chúng ta phải giữ vững lập trường trước hành vi kỳ dị này của [scandalous_insult_country.GetAdj]."
 envoy_events.100.desc.hostile:0 "Một đại biểu từ §H[scandalous_insult_country.GetName]§! đã dám để lộ cảm nghĩ thực sự của đế chế đáng thương hại của họ về chúng ta, dường như trong cuộc hội đàm với các bên ẩn danh khác.\n\n§PLời nhục mạ vô lý§! này nhằm mục đích hạ thấp chúng ta, và dù chúng ta có bận tâm đến lời vu khống vô căn cứ này hay không: lòng tự tôn đòi hỏi chúng ta không được dung thứ cho điều đó."
 envoy_events.100.a:0 "Thật là một sự xúc phạm trắng trợn!"
 envoy_events.100.b:0 "Chúng ta đứng trên những trò hề như vậy. Hãy phớt lờ chúng."
 envoy_events.100.c:0 "Chúng không xứng đáng với sự khinh miệt của chúng ta."
 envoy_events.101.name:0 "$envoy_events.100.name$"
 envoy_events.101.desc:0 "Phía §H[from.GetName]§! nói rằng họ đã §Pbị xúc phạm§! trước một hành vi sai trái của một quan chức của chúng ta. Họ không nêu tên quan chức, thậm chí không mô tả tính chất của lời nhục mạ. Thay vào đó, chúng ta chỉ nhận được một tràng phẫn nộ và việc cắt đứt liên lạc đột ngột.\n\nCó thể sự đổ vỡ ngoại giao hiếm thấy này là tác phẩm của một bên can thiệp khác; nhưng nó cũng hoàn toàn có thể chỉ là một sự hiểu lầm thực sự."
 envoy_events.101.a:0 "Dù thế nào đi nữa, ngoại giao vừa trở nên phức tạp hơn."
 spynetwork_vividsight:0 "Điệp Viên Có Ảnh Hưởng"
 spynetwork_vividsight_desc:1 "Các điệp viên của chúng ta trong Mạng Lưới Điệp Viên này được yêu mến một cách khác thường. Sức hút của họ đảm bảo rằng các §GChiến Dịch trở nên dễ dàng hơn§!, nhưng nguy cơ bại lộ gia tăng sẽ §Rlàm giảm $MOD_SPY_NETWORK_DAILY_VALUE_ADD$§! của chúng ta."
 spynetwork_drones_hunted:0 "Bị Nhầm Thành Thức Ăn"
 spynetwork_drones_hunted_desc:0 "Các điệp viên của chúng ta đang bị săn lùng bởi các bản năng nguyên thủy của chính thực thể mà chúng ta đang do thám, và do đó họ không thể nán lại một nơi quá lâu."
 spynetwork_toxic_field:0 "Công Tác Thực Địa Độc Hại"
 spynetwork_toxic_field_desc:0 "Môi trường sống của [toxic_field_country.GetGestaltEntityName] [toxic_field_country.GetAdj] có độc tính nhẹ đối với chính các điệp viên của chúng ta. Chức năng sẽ bị suy giảm cho đến khi chúng ta có thể phát triển đủ kháng thể tương thích." ##e.g. 'The Irathi Hive is mildly toxic...'
 spynetwork_excess_noise:0 "Nhiễu Sóng Dư Thừa"
 spynetwork_excess_noise_desc:0 "Môi trường trên các thế giới [excess_noise_country.GetAdj] đã tràn ngập tiếng ồn tĩnh điện dư thừa — nhiều hơn nhiều so với mức chúng ta quen thích nghi hiện tại. Chức năng sẽ bị suy giảm cho đến khi chúng ta có thể định tuyến lại các chức năng then chốt xung quanh phần cứng bị ảnh hưởng."
 spynetwork_drain_resources_cutties:0 "Điệp Viên Khởi Nghiệp Cắt Đứt Quan Hệ"
 spynetwork_drain_resources_cutties_desc:0 "Một nhóm điệp viên của chúng ta đã bị bắt quả tang tái đầu tư hàng hóa và tiền tệ từ ngân sách thu thập tình báo của chúng ta. Khi chúng ta vạch trần họ về điều đó, họ đã chọn cách cắt đứt quan hệ với chúng ta."
 spynetwork_rigorous_screening:0 "Sàng Lọc Điệp Viên Nghiêm Ngặt"
 spynetwork_rigorous_screening_desc:0 "Sau một vụ đào tẩu gần đây, $role_spymaster$ của chúng ta hiện đang cẩn trọng hơn trong việc sàng lọc các điệp viên mới."
 spynetwork_grisly_countermeasures:0 "Biện Pháp Phản Kháng Rùng Rợn"
 spynetwork_grisly_countermeasures_desc:0 "Những thương tích mà một trong những điệp viên phá hoại của chúng ta phải gánh chịu đã làm dấy lên sự nghi ngờ trong lực lượng an ninh địa phương."
 spynetwork_auxiliaries_insight:0 "Điệp Viên Phụ Trợ Nhạy Bén"
 spynetwork_auxiliaries_insight_desc:0 "Một nhóm điệp viên phụ trợ nhạy bén khác thường đang giúp đảm bảo sự vận hành trơn tru cho các chiến dịch của chúng ta."
 spynetwork_auxiliaries_lost:0 "Mất Điệp Viên Phụ Trợ"
 spynetwork_auxiliaires_lost_desc:0 "Tài nguyên của chúng ta bị căng thẳng bởi việc giải tán gần đây một nhóm điệp viên phụ trợ, những người dường như đã biết quá nhiều."
 spynetwork_auxiliaries_leak:0 "Điệp Viên Phụ Trợ Biết Quá Nhiều"
 spynetwork_auxiliaires_leak_desc:0 "Các phần trong Mạng Lưới Điệp Viên của chúng ta đã bị lộ sau khi một nhóm điệp viên phụ trợ nhận ra vai trò của họ trong đó và quyết định lên tiếng."
 operation_contact_lost:0 "Mất Liên Lạc"
 operation_contact_lost_desc:0 "Việc mất liên lạc với các điệp viên trước đây đã làm thụt lùi tiến trình của Chiến Dịch này."
 operation_multiphasic_interference:0 "Nhiễu Sóng Đa Pha"
 operation_multiphasic_interference_desc:0 "Chúng ta liên tục mất liên lạc với các điệp viên của mình do họ phải chịu các tác dụng phụ bất thường khi đối phó với công nghệ lá chắn cục bộ của mục tiêu."
 operation_grisly_countermeasures:0 "Điệp Viên Bị Thương"
 operation_grisly_countermeasures_desc:0 "Điệp viên của chúng ta đã bị thương bởi các biện pháp đối phó được giấu kín trên căn cứ sao này. Cả tiến trình và khả năng duy trì vỏ bọc của chúng ta đều đang bị cản trở."
 espionage_research_backdoor:0 "Cửa Sau Nghiên Cứu"
 espionage_research_backdoor_desc:0 "Chúng ta đã nắm bắt cơ hội để cài đặt quyền truy cập cửa sau vào cơ sở dữ liệu nghiên cứu của một thế lực ngoại bang. Khoa học của họ sẽ phục vụ cho chúng ta."
 espionage_finderskeepers:0 "Tìm Thấy Khóa Mã Hóa"
 espionage_finderskeepers_desc:0 "Một trong các điệp viên của chúng ta gần đây đã tìm thấy một khóa mã hóa bị một thế lực ngoại bang bỏ quên. Bằng cách nghiên cứu hoạt động của nó, chúng ta đã thu được hiểu biết sâu sắc về các kỹ thuật giải mã mới lạ."
 espionage_straycomm:0 "Mất Khóa Mã Hóa"
 espionage_straycomm_desc:1 "Một trong những $job_politician_plural$ của chúng ta gần đây đã làm thất lạc một tập tài liệu mật, bao gồm một khóa mã hóa đang hoạt động. An ninh nội địa của chúng ta tạm thời bị xâm hại."
 espionage_straycomm_sacked_official: "Quan Chức Bị Sa Thải"
 espionage_straycomm_sacked_official_desc: "Quan chức chịu trách nhiệm về việc làm mất khóa mã hóa đã nhanh chóng bị sa thải. Người thay thế họ sẽ được thẩm tra kỹ lưỡng hơn."
 espionage_straycomm_sacked_steward: "$espionage_straycomm_sacked_official$"
 espionage_straycomm_sacked_steward_desc: "$espionage_straycomm_sacked_official_desc$"
 espionage_drain_resources_exploit:0 "Mạng Lưới Điệp Viên Tháo Vát"
 espionage_drain_resources_exploit_desc:0 "Một nhóm điệp viên trong một Mạng Lưới Điệp Viên của chúng ta đã bị bắt quả tang trục lợi từ thương mại địa phương. $role_spymaster$ của chúng ta đã tận dụng hoạt động thị trường chợ đen của họ vì lợi ích trực tiếp của chúng ta."
 research_stolen_sabotaged:0 "Nghiên Cứu Bị Phá Hoại"
 research_stolen_sabotaged_desc:0 "Những kẻ xâm nhập của đối phương đã làm đảo lộn cơ sở dữ liệu nghiên cứu của chúng ta, trì hoãn công việc đang diễn ra và làm chậm quá trình truy xuất dữ liệu hiện có. Sẽ cần thời gian để tái tích hợp các nghiên cứu của chúng ta."
 opinion_disavowed_agent_caught:0 "Điệp Viên Bị Phủ Nhận Bị Bắt"
 opinion_smear_campaign_insulted:1 "Lời Nhục Mạ Đầy Bê Bối"
 opinion_smear_campaign_deceived:0 "Lạm Dụng Lòng Tin"
 opinion_smear_campaign_espionage:0 "Tiến Hành Hoạt Động Gián Điệp"
 opinion_exposed_espionage:0 "Làm Bại Lộ Hoạt Động Bí Mật Của Chúng Ta"
 opinion_blackmailed_espionage:0 "Tống Tiền Lấy Đặc Ân"
 opinion_smear_campaign_caught:0 "Bị Bắt Quả Tang Tuyên Truyền Chiến Dịch Bôi Nhọ"
 TOXIC_OPERATION_PROJECT:0 "Công Tác Thực Địa Độc Hại"
 TOXIC_OPERATION_PROJECT_DESC:0 "Môi trường sống của [toxic_field_country.GetAdj] có độc tính nhẹ đối với chính các điệp viên của chúng ta. Bằng cách nghiên cứu các tác động của nó, chúng ta có thể phát triển phương thuốc điều trị và từ đó tránh được những rủi ro liên quan đến việc có những [toxic_field_country.GetIndividualNamePlural] bị dị ứng rõ rệt bên trong tổ của họ."
 NOISE_OPERATION_PROJECT:0 "Nhiễu Sóng Dư Thừa"
 NOISE_OPERATION_PROJECT_DESC:1 "Môi trường mà [excess_noise_country.GetName] tự tạo ra sinh ra nhiều tiếng ồn tĩnh điện hơn mức chúng ta dự tính. Các drone ngụy trang của chúng ta do đó đang bị mất mát dữ liệu từng phần. Bằng cách nghiên cứu các tần số sai lệch này, chúng ta có thể điều chỉnh lại các drone điệp viên của mình để duy trì chức năng cao hơn và tránh bị phát hiện 'trên thực địa'."
