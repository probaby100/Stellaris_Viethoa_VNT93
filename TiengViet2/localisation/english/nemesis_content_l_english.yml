 custodian.2.name:0 "Bổ Nhiệm Người Giám Hộ Thiên Hà"
 custodian.2.a.desc:1 "Cuối cùng, Viện Nguyên Lão Thiên Hà đã biểu quyết trao quyền hạn Giám Hộ khẩn cấp cho [custodian.GetName]. Trong một buổi lễ chính thức được phát sóng khắp toàn cõi thiên hà, chúng ta đã được bổ nhiệm làm §HNgười Giám Hộ của Cộng Đồng Thiên Hà§!.\n\nLà người đứng đầu trong số các bên bình đẳng, chúng ta gánh vác sứ mệnh bảo vệ Cộng Đồng Thiên Hà trước mọi mối đe dọa tiềm tàng, dù là nội tại hay ngoại lai, mưu toan gây hại cho cộng đồng. Chúng ta đã được ban cho những quyền năng to lớn trong mọi công việc của Cộng Đồng và giờ đây có thể đề xuất các nghị quyết đặc biệt."
 custodian.2.b.desc:1 "Viện Nguyên Lão Thiên Hà đã biểu quyết trao quyền hạn Giám Hộ khẩn cấp cho §H[custodian.GetName]§!. Trong một buổi lễ được phát sóng khắp toàn cõi thiên hà, họ đã được bổ nhiệm làm §HNgười Giám Hộ chính thức của Cộng Đồng Thiên Hà§!.\n\nLà người đứng đầu trong số các bên bình đẳng, chính phủ [custodian.GetSpeciesName] giờ đây chịu trách nhiệm bảo vệ Cộng Đồng Thiên Hà trước mọi mối đe dọa tiềm tàng, dù là nội tại hay ngoại lai, mưu toan gây hại cho cộng đồng. Họ đã được ban cho những quyền năng to lớn trong mọi công việc của Cộng Đồng và giờ đây có thể đề xuất các nghị quyết đặc biệt."
 custodian.2.a:0 "Giờ đây chúng ta có thể hành sự."
 custodian.2.b:0 "Chúng ta hãy xem điều này sẽ diễn ra thế nào."
 custodianship_starts:0 "§Y[custodian.GetName]§! hiện là §YNgười Giám Hộ của Cộng Đồng Thiên Hà§!."
 custodian.11.name:0 "Hết Nhiệm Kỳ Giám Hộ"
 custodian.11.a.desc:0 "Nhiệm kỳ Người Giám Hộ của Cộng Đồng Thiên Hà của chúng ta đã đi đến hồi kết. Quyền Giám Hộ đã bị chấm dứt và các quyền hạn đặc biệt của chúng ta đã bị thu hồi, dù chúng ta vẫn giữ được ghế trong Hội Đồng Thiên Hà."
 custodian.11.b.desc:0 "Khi nhiệm kỳ kết thúc, §H[former_custodians.GetName]§! đã từ bỏ địa vị Người Giám Hộ của Cộng Đồng Thiên Hà. Các quyền hạn đặc biệt của họ đã bị thu hồi, và họ hiện được coi là một thành viên bình thường của Hội Đồng Thiên Hà."
 custodian.11.a:0 "Thuận theo lẽ đó."
 custodianship_ends:0 "§Y[From.GetName]§! không còn là §YNgười Giám Hộ của Cộng Đồng Thiên Hà§! nữa."
 custodian.15.a.desc:0 "Cuối cùng chúng ta cũng thoát khỏi cương vị Giám Hộ vô ơn và vô ích! Hãy để kẻ khác lo lắng về tương lai của thiên hà bội bạc này."
 custodian.15.b.desc:0 "§H[former_custodians.GetName]§! đã sớm chấm dứt nhiệm kỳ Người Giám Hộ của Cộng Đồng Thiên Hà. Có vẻ như các trọng trách của Quyền Giám Hộ không hề hợp ý họ."
 custodian.15.a:0 "Chúng ta đã hoàn thành phần việc của mình."
 custodian.15.b:0 "Một lũ bỏ cuộc giữa chừng."
 custodian.101.name:0 "Người Giám Hộ Không Còn Nữa"
 custodian.101.desc:0 "Với sự diệt vong của §H[LastKilledCountryName]§!, Quyền Giám Hộ của họ đối với Cộng Đồng Thiên Hà đã đi đến hồi kết."
 custodian.17.name:0 "Người Giám Hộ Bị Phế Truất!"
 custodian.17.a.desc:0 "Những kẻ ngu xuẩn vô ơn trong Viện Nguyên Lão Thiên Hà đã biểu quyết chấm dứt Quyền Giám Hộ của chúng ta! Chúng ta đã bị tước đoạt mọi quyền lực Cộng Đồng từng gắn liền với chức vụ này."
 custodian.17.b.desc:0 "Trong một kết cục đột ngột và nhục nhã cho Quyền Giám Hộ của họ, đa số Viện Nguyên Lão Thiên Hà đã biểu quyết bãi nhiệm ngay lập tức §Y[From.GetName]§! khỏi chức vị Người Giám Hộ Thiên Hà. Họ đã bị tước đoạt các quyền hạn Cộng Đồng đặc biệt."
 custodian.17.a:0 "Thật là một sự phẫn nộ cùng cực!"
 custodian.17.b:0 "Thế là hết."
 resolution_galacticreforms_unseat_custodian_tooltip:0 "§YNgười Giám Hộ Thiên Hà§! hiện tại bị bãi nhiệm khỏi chức vụ."
 resolution_galacticreforms_unseat_custodian:0 "Phế Truất Người Giám Hộ"
 resolution_galacticreforms_unseat_custodian_desc:0 "Đã đến lúc chấm dứt sự biến chất của những Người Giám Hộ hiện tại. Họ phải bị bãi nhiệm ngay lập tức trước khi có thể gây thêm tổn hại cho Cộng Đồng Thiên Hà!"
 emperor.2.name:0 "[Root.GetGalEmpireName]"
 emperor.2.normal.desc:0 "$emperor.2.intro.desc$\n\n$emperor.2.a.desc$\n\n$emperor.2.outro.desc$"
 emperor.2.machine.desc:0 "$emperor.2.intro.desc$\n\n$emperor.2.b.desc$\n\n$emperor.2.outro.desc$"
 emperor.2.hive.desc:0 "$emperor.2.intro.desc$\n\n$emperor.2.c.desc$\n\n$emperor.2.outro.desc$"
 emperor.2.wilderness.desc: "$emperor.2.intro.desc$\n\n$emperor.2.d.desc$\n\n$emperor.2.outro.desc$"
 emperor.2.intro.desc:0 "Đây là bình minh của một Trật Tự Mới. Cộng Đồng Thiên Hà cũ kỹ đã bị giải thể, và thay vào đó §H[Root.GetGalEmpireName]§! đã trỗi dậy. Sau khi tuyên bố vị thế chính đáng của chúng ta trên ngai vàng của nhà nước toàn thiên hà mới này, chúng ta hiện được biết đến với tên gọi §H[Root.GetName]§!."
 emperor.2.a.desc:0 "Trong một buổi lễ đăng quang xa hoa được phát sóng trên toàn thể thiên hà, một triều đại đế chế mới đã được thiết lập khi [ruler.GetRegnalName] được tôn xưng là [Root.GetRulerTitle] tại [Root.Capital.GetName]."
 emperor.2.b.desc:0 "Cấu trúc xã hội này sẽ mang lại cho Trí Tuệ Nhân Tạo của chúng ta, từ nay về sau được gọi là §H[Root.GetRulerTitle]§!, mức độ kiểm soát lớn hơn nhiều đối với vô số chính thể cấp dưới của thiên hà. Các thần dân đế chế của chúng ta, theo thời gian, sẽ học cách tuân phục mệnh lệnh của chúng ta như bất kỳ drone nào."
 emperor.2.c.desc:0 "Cấu trúc xã hội này sẽ mang lại cho Ý Thức Bầy Đàn của chúng ta, từ nay về sau được gọi là §H[Root.GetRulerTitle]§!, mức độ kiểm soát lớn hơn nhiều đối với vô số chính thể cấp dưới của thiên hà. Các thần dân đế chế của chúng ta, theo thời gian, sẽ học cách tuân phục mệnh lệnh của chúng ta như bất kỳ drone nào."
 emperor.2.d.desc: "Cấu trúc xã hội này sẽ mang lại cho chúng ta — dưới danh nghĩa §H[Root.GetRulerTitle]§! — mức độ kiểm soát lớn hơn nhiều đối với vô số chính thể cấp dưới của thiên hà. Các thần dân đế chế của chúng ta, theo thời gian, sẽ học cách trân trọng sự thông tuệ khi quy phục trước Miền Hoang Dã."
 emperor.2.outro.desc:1 "[Root.GetRulerTitle] vạn tuế! Đế Chế vạn tuế!"
 emperor.2.a:0 "Vạn tuế, vạn tuế!"
 emperor.2.a.tooltip:1 "$emperor.2.a.tooltip.start$- Chúng ta hiện có Quốc Sách §Y$civic_galactic_sovereign$§!\n- Đạo đức của chúng ta dịch chuyển mạnh mẽ về §YChủ Nghĩa Độc Tài§!\n$emperor.2.a.tooltip.end$"
 emperor.2.a.tooltip.gestalt:0 "$emperor.2.a.tooltip.start$- Chúng ta hiện có Quốc Sách §Y$civic_galactic_sovereign$§!\n$emperor.2.a.tooltip.end$"
 emperor.2.a.tooltip.megacorp:0 "$emperor.2.a.tooltip.start$- Chúng ta hiện có Quốc Sách §Y$civic_galactic_sovereign_megacorp$§!\n- Đạo đức của chúng ta dịch chuyển mạnh mẽ về §YChủ Nghĩa Độc Tài§!\n$emperor.2.a.tooltip.end$"
 emperor.2.a.tooltip.start:0 "§HSự trỗi dậy của Đế Chế đã cận kề!§!\n- §YCộng Đồng Thiên Hà§! nay được gọi là §YĐế Chế Thiên Hà§!\n- Chúng ta nay được gọi là §Y[Root.GetName]§!\n"
 emperor.2.a.tooltip.end:0 "- Các quốc gia thành viên Đế Chế không còn có thể phát động chiến tranh xâm lược chống lại chúng ta"
 emperor.3.normal.desc:0 "$emperor.3.intro.desc$\n\n$emperor.3.a.desc$\n\n$emperor.3.outro.desc$"
 emperor.3.machine.desc:0 "$emperor.3.intro.desc$\n\n$emperor.3.b.desc$\n\n$emperor.3.outro.desc$"
 emperor.3.hive.desc:0 "$emperor.3.intro.desc$\n\n$emperor.3.c.desc$\n\n$emperor.3.outro.desc$"
 emperor.3.awakenedhive.desc: "Đây là bình minh của một Trật Tự Cổ Xưa.\n\nCộng Đồng Thiên Hà đã bị giải thể, và thay vào đó §H[Root.GetGalEmpireName]§! đã trỗi dậy. Ý thức cổ xưa và phân mảnh đã chọn thời đại này để tái xuất hiện. Những kẻ dám chống lại sự đăng cơ của họ đã bị tra vào xiềng xích. Ai có thể đoán biết được tân [gal_emperor.GetRulerTitle] có những khát vọng gì đối với thiên hà."
 emperor.3.intro.desc:0 "Đây là bình minh của một Trật Tự Mới. Cộng Đồng Thiên Hà cũ kỹ đã bị giải thể, và thay vào đó §H[Root.GetGalEmpireName]§! đã trỗi dậy. Sau khi tuyên bố quyền ngự trị trên ngai vàng của nhà nước toàn thiên hà mới này, các cựu Giám Hộ §H[gal_emperor.GetSpeciesName]§! hiện tự xưng là §H[gal_emperor.GetName]§!."
 emperor.3.a.desc:0 "Trong một buổi lễ đăng quang xa hoa được phát sóng trên toàn thể thiên hà, một triều đại đế chế mới đã được thiết lập khi [gal_emperor.ruler.GetRegnalName] được tôn xưng là [gal_emperor.GetRulerTitle] tại [gal_emperor.Capital.GetName]."
 emperor.3.b.desc:1 "Trí tuệ nhân tạo trung tâm của họ, được gọi là [gal_emperor.GetRulerTitle], trị vì với tư cách là chúa tể tối cao của Đế Chế."
 emperor.3.c.desc:1 "Ý thức liên kết của họ, được gọi là [gal_emperor.GetRulerTitle], trị vì với tư cách là chúa tể tối cao của Đế Chế."
 emperor.3.outro.desc:0 "Liệu đây là sự khởi đầu của một kỷ nguyên hòa bình và ổn định mới cho thiên hà, hay là một kỷ nguyên của áp bức và nô dịch?"
 emperor.3.a:0 "Chúng ta hãy chờ xem."
 emperor.3.b:0 "Điều này không can hệ gì tới chúng ta."
 emperor.3.a.tooltip:0 "§YCộng Đồng Thiên Hà§! nay được gọi là §YĐế Chế Thiên Hà§!."
 emperor.4.title:1 "Tuyên Ngôn Thành Lập Đế Chế"
 emperor.4.a.desc:1 "Công dân của thiên hà, hãy hân hoan! Các bạn đã được giải thoát khỏi sự bạo ngược của bộ máy quan liêu ngột ngạt và những nhà ngoại giao tranh cãi vụn vặt của Cộng Đồng Thiên Hà.\n\nCác thế giới của các bạn hiện nằm dưới sự bảo hộ của Đế Chế Thiên Hà. Là công dân Đế Chế, các bạn được đoàn kết trong quốc gia vĩ đại và hùng mạnh nhất mà thiên hà từng chứng kiến. Sự phản loạn sẽ bị trừng phạt và sự phục tùng sẽ được tưởng thưởng. Hãy ghi nhớ rằng [gal_emperor.GetRulerTitle] [gal_emperor.ruler.GetRegnalName] luôn dõi theo các bạn.\n\nĐế Chế vạn tuế! [gal_emperor.GetRulerTitle] vạn tuế!"
 emperor.4.b.desc:1 "Hãy chú ý! Hãy lắng nghe thông cáo này. Đế Chế Thiên Hà đã thay thế thể chế lỗi thời mà các bạn từng biết đến là Cộng Đồng Thiên Hà. Các chính thể tinh cầu riêng lẻ của các bạn đã được tái tổ chức và hiện được nhóm lại dưới một cơ quan quản lý Đế Chế tối cao duy nhất.\n\n[gal_emperor.GetRulerTitle] sẽ đóng vai trò là bộ xử lý trung tâm của Đế Chế, và các bạn được lệnh thi hành các mệnh lệnh của người một cách mau lẹ. Là công dân Đế Chế, các bạn được đoàn kết trong thực thể chính trị vĩ đại và hùng mạnh nhất mà thiên hà từng biết đến. Thành công lâu dài của nó sẽ đòi hỏi cả sự phục tùng lẫn hợp tác.\n\nĐế Chế vạn tuế! [gal_emperor.GetRulerTitle] vạn tuế!"
 emperor.4.c.desc:1 "Hỡi các sinh vật có tri giác tự trị của thiên hà, đây là một ngày trọng đại. Các bạn sẽ sớm gặt hái những lợi ích từ việc được dẫn dắt bởi trí tuệ toàn năng bao quát mọi sự, đồng thời vẫn duy trì được một số ngụy biện của chủ nghĩa cá nhân mà nhiều người trong các bạn vẫn bám víu.\n\nCác thế giới của các bạn hiện nằm dưới sự bảo hộ của Đế Chế Thiên Hà. Là công dân Đế Chế, các bạn được đoàn kết trong Tổ Mẹ vĩ đại và hùng mạnh nhất mà thiên hà từng chứng kiến. Hãy tuân theo các chỉ thị của [gal_emperor.GetRulerTitle] và đừng đi chệch khỏi các hoạch định của người — hãy biết rằng chúng là sản phẩm của một tâm trí có quy mô vĩ đại hơn bất kỳ tâm trí nào khác trong thiên hà này.\n\nĐế Chế vạn tuế! [gal_emperor.GetRulerTitle] vạn tuế!"
 emperor.4.a:0 "Tắt màn hình liên lạc."
 emperor.5.name:0 "Tương Lai của [Root.GetAllianceName]"
 emperor.5.desc:2 "[gal_emperor.GetRulerTitle] đã hạ chiếu chỉ rằng tất cả các quốc gia cấu thành của Đế Chế Thiên Hà phải ngay lập tức rút khỏi bất kỳ liên bang siêu quốc gia 'lỗi thời' nào mà họ có thể là một phần trong đó. Các sứ giả Đế Chế đã cam đoan với chúng ta rằng, với tư cách là những thành viên trung thành của Đế Chế, chúng ta không còn cần đến những 'vướng bận ngoại giao' như vậy nữa."
 emperor.5.a:1 "Chúng ta không có lựa chọn nào khác ngoài việc phục tùng."
 emperor.5.b:1 "Chúng ta sẽ không bao giờ cúi đầu trước Đế Chế!"
 emperor.6.name:0 "Phản Quốc!"
 emperor.6.desc:1 "Kẻ phản trắc §H[From.GetName]§! đã từ chối quy phục Đế Chế Thiên Hà! Thay vào đó, họ đã quyết định bám víu lấy liên bang đáng thương của mình bằng cách công khai tuyên bố ly khai khỏi Đế Chế."
 emperor.6.a:0 "Chúng sẽ phải trả giá cho sự xấc xược của mình."
 opinion_traitor_to_empire:1 "Kẻ Phản Bội Đế Chế"
 emperor.10.name:0 "Ly Khai Khỏi Đế Chế"
 emperor.10.desc:0 "Do vị thế là chư hầu của §H[overlord.GetName]§!, chúng ta bị nghiêm cấm gia nhập Đế Chế Thiên Hà mới thành lập."
 emperor.10.a:0 "Rất tốt."
 emperor.50.name:0 "Hạm Đội Hoàng Gia"
 emperor.50.desc:1 "Việc thành lập một hạm đội vĩ đại để bảo vệ Đế Chế Thiên Hà đã được ký thành luật. §HHạm Đội Hoàng Gia§! mới này sẽ trưng dụng thủy thủ đoàn và nhân viên hỗ trợ từ tất cả các thành viên của Đế Chế, nhưng phần lớn đội ngũ sĩ quan sẽ bao gồm [gal_emperor.GetSpeciesNamePlural].\n\nHạm Đội sẽ chịu sự kiểm soát trực tiếp của [gal_emperor.GetName], và tất cả tân binh sẽ phải tuyên thệ trung thành với [gal_emperor.GetRulerTitle]."
 emperor.50.a:0 "Đúng như lẽ phải."
 emperor.50.b:0 "Các sĩ quan [root.GetIndividualName] của chúng ta sẽ giữ họ trong tầm kiểm soát." ## adjective, e.g. 'our symbiont officers'
 emperor.50.c:0 "Đây là thời khắc của sự đổi thay."
 emperor.52.desc:1 "Mọi dấu vết về Cộng Đồng Thiên Hà cũ đang bị xóa bỏ trong Đế Chế mới, và là một phần của sự tái tổ chức này, Lực Lượng Phòng Thủ Thiên Hà đã đổi tên thành §HHạm Đội Hoàng Gia§!.\n\nHạm đội mới này kế thừa phần lớn cấu trúc cấp bậc và tổ chức từ GDF, nhưng quân phục và phù hiệu mới đã được áp dụng, và tất cả quân nhân tại ngũ đều phải tuyên thệ trung thành với [gal_emperor.GetRulerTitle].\n\nTrong khi các thủy thủ đoàn và nhân viên hỗ trợ của Hạm Đội vẫn được tuyển mộ từ tất cả thành viên của Đế Chế, tỷ lệ sĩ quan [gal_emperor.GetSpeciesName] đã tăng lên đáng kể."
 emperor.55.name:0 "Sự Thành Lập Các Quân Đoàn"
 emperor.55.desc:1 "Các §HQuân Đoàn Hoàng Gia§! đầu tiên hiện đang được tập hợp tại [gal_emperor.GetName]. Lực lượng mặt đất tinh nhuệ này có thẩm quyền pháp lý để tuyển mộ công dân từ tất cả thành viên của Đế Chế. Nhiều học viện quân sự đã được rà soát để tìm kiếm những ứng viên triển vọng, và có báo cáo rằng thường dân — thậm chí cả trẻ em — cũng bị tòng quân nếu được phát hiện có năng lực khác thường.\n\nNhững người sống sót qua chương trình huấn luyện tàn khốc và quá trình tôi luyện tinh thần quy mô lớn — trong đó nhân cách của họ phần lớn được tái thiết lại từ đầu — sẽ tốt nghiệp với tư cách là Chiến Binh Quân Đoàn Hoàng Gia. Kỹ năng chiến đấu đáng gờm, kỷ luật sắt đá và lòng trung thành cuồng tín với [gal_emperor.GetRulerTitle] biến họ thành một trong những đội quân xung kích tinh nhuệ nhất trong thiên hà."
 emperor.55.a:0 "Nắm Đấm của [gal_emperor.GetRulerTitle]!"
 emperor.55.b:0 "Ý chí của chúng ta sẽ được thực thi."
 emperor.55.c:0 "Lại một công cụ áp bức nữa sao?"
 emperor.70.name:0 "Cục An Ninh Hoàng Gia"
 emperor.70.desc:0 "Các đặc vụ từ §HCục An Ninh Hoàng Gia§! đang trong quá trình triển khai tới các thế giới trên toàn Đế Chế, nơi họ bề ngoài sẽ hỗ trợ các cơ quan thực thi pháp luật địa phương trong việc điều tra và truy tố các trọng án.\n\nMột chức năng khác của ISD, cơ quan chỉ báo cáo trực tiếp với [gal_emperor.GetRulerTitle] thông qua Bộ Tư Pháp Hoàng Gia, là nhổ tận gốc 'những kẻ khủng bố, quân phản loạn và phần tử kích động' mưu toan làm suy yếu sự ổn định của Đế Chế."
 emperor.70.a:0 "Không ai thoát khỏi công lý của Đế Chế."
 emperor.72.desc:0 "Với sự trỗi dậy của Đế Chế, GALPOL đang được tái tổ chức và đã đổi tên thành §HCục An Ninh Hoàng Gia§!. Quyền tài phán của các đặc vụ ISD vẫn bao trùm trên toàn bộ Đế Chế, nhưng kể từ bây giờ họ chỉ báo cáo với [gal_emperor.GetRulerTitle].\n\nTrong khi một trong những trách nhiệm chính của ISD vẫn là điều tra và truy tố tội phạm trên các thế giới thuộc Đế Chế, họ giờ đây cũng được sử dụng để truy lùng những kẻ kích động nổi loạn dám thách thức quyền cai trị của [gal_emperor.GetRulerTitle]. Một số người đang bày tỏ lo ngại rằng tổ chức cảnh sát trước đây đang biến thành một công cụ áp bức..."
 imperial_legion_limit_tooltip:0 "Chỉ những cá nhân có kỹ năng đặc biệt mới được phép trở thành Chiến Binh Quân Đoàn Hoàng Gia, điều đó có nghĩa là chúng ta chỉ có thể triển khai một số lượng hạn chế các Quân Đoàn này cùng một lúc."
 imperial_legion:0 "Quân Đoàn Hoàng Gia"
 imperial_legion_desc:1 "Những người lính tinh nhuệ của Đế Chế Thiên Hà, được tuyển mộ từ tất cả các quốc gia thành viên. Được huấn luyện và tôi luyện thành những cỗ máy giết chóc tàn nhẫn, họ trung thành cuồng tín với Đế Chế."
 building_imperial_capital:0 "Hoàng Cung"
 building_imperial_capital_desc:0 "Một quần thể cung điện đồ sộ xứng tầm với đế chế vĩ đại nhất lịch sử từng chứng kiến. Nếu thiên hà có một trung tâm rực rỡ, thì đây chính là nơi đó."
 building_imperial_machine_capital:0 "Trung Tâm Hoàng Gia"
 building_imperial_machine_capital_desc:1 "Quần thể khổng lồ này là trái tim hành chính của Đế Chế Thiên Hà. Hàng nghìn AI liên tục xử lý và đánh giá tình trạng hiện tại của thiên hà."
 building_imperial_hive_capital:0 "Quần Thể Hoàng Gia"
 building_imperial_hive_capital_desc:1 "Từ cấu trúc đồ sộ này, Ý Thức Bầy Đàn cai quản Đế Chế Thiên Hà. Đây là nơi định đoạt vận mệnh của thiên hà."
 gov_imperial_domain:0 "Lãnh Địa Hoàng Gia"
 gov_imperial_domain_desc:1 "§LChính phủ này cai quản lãnh thổ vương miện trung tâm của Đế Chế Thiên Hà, nằm dưới sự kiểm soát trực tiếp của Chúa Tể Đế Chế.§!"
 gov_imperial_domain_machines:0 "$gov_imperial_domain$"
 gov_imperial_domain_machines_desc:0 "$gov_imperial_domain_desc$"
 gov_imperial_domain_hives:0 "$gov_imperial_domain$"
 gov_imperial_domain_hives_desc:0 "$gov_imperial_domain_desc$"
 gov_imperial_domain_megacorp:0 "$gov_imperial_domain$"
 gov_imperial_domain_megacorp_desc:0 "$gov_imperial_domain_desc$"
 RT_GAL_EMPEROR:0 "Hoàng Đế Thiên Hà"
 RT_GAL_EMPRESS:0 "Nữ Hoàng Thiên Hà"
 RT_GALACTIC_INTELLIGENCE:0 "Trí Tuệ Thiên Hà"
 RT_GALACTIC_OVERMIND:0 "Đại Não Thiên Hà"
 RT_IMP_EXECUTIVE:0 "Giám Đốc Điều Hành Hoàng Gia"
 HT_IMP_VICE_EXECUTIVE:0 "Phó Giám Đốc Điều Hành Hoàng Gia"
 requires_actor_recipient_not_in_galactic_empire:1 "$TRIGGER_FAIL$§RThành viên của §YĐế Chế Thiên Hà§! không thể gia nhập Liên Bang.§!"
 requires_actor_recipient_not_in_galactic_empire_2:1 "$TRIGGER_FAIL$§RThành viên của §YĐế Chế Thiên Hà§! không thể có Tư Cách Hiệp Hội với Liên Bang.§!"
 action.48.desc.default:0 "Chà, thật tuyệt vời làm sao."
 civic_galactic_sovereign:0 "Chúa Tể Thiên Hà"
 civic_galactic_sovereign_desc:1 "Xã hội này đã đạt được quyền làm chủ trên phần lớn thiên hà, phục vụ với tư cách là những người cai trị hiện tại của Đế Chế Thiên Hà."
 civic_galactic_sovereign_megacorp:0 "Chúa Tể Doanh Nghiệp"
 civic_galactic_sovereign_megacorp_desc:0 "Đại Tập Đoàn này đã đạt được quyền làm chủ trên phần lớn thiên hà, phục vụ với tư cách là những nhà cai trị doanh nghiệp hiện tại của Đế Chế Thiên Hà."
 casus_belli_cb_imperial_crusade:0 "Thập Tự Chinh Hoàng Gia"
 war_goal_wg_imperial_crusade:1 "Cưỡng Chế Sáp Nhập Vào Đế Chế"
 war_goal_wg_imperial_crusade_desc:1 "Chiến tranh được phát động nhằm cưỡng ép kẻ thù gia nhập Đế Chế Thiên Hà.\n\nTrong trường hợp hòa bình theo Hiện Trạng, các hệ sao chúng ta chiếm đóng sẽ được giải phóng thành một thành viên mới của Đế Chế nếu chúng bao gồm ít nhất một hành tinh có người ở."
 resolution_galactic_empire_imperial_crusade:0 "Thập Tự Chinh Hoàng Gia"
 resolution_galactic_empire_imperial_crusade_desc:1 "Biên cương của Đế Chế Thiên Hà vẫn chưa bao trùm toàn bộ thiên hà — điều này phải được sửa chữa. Một cuộc Thập Tự Chinh Hoàng Gia, nếu thành công, sẽ buộc mục tiêu của nghị quyết này phải gia nhập Đế Chế."
 resolution_category_foreign_relations:0 "Quan Hệ Đối Ngoại"
 resolution_galactic_empire_imperial_crusade_tooltip:0 "Ban cho cớ chiến tranh §Y'Thập Tự Chinh Hoàng Gia'§! nhắm vào đế chế mục tiêu."
 casus_belli_cb_trial_of_advancement:0 "Thử Thách Thăng Tiến"
 war_goal_wg_seize_council_seat:1 "Đoạt Ghế Hội Đồng"
 war_goal_wg_seize_council_seat_desc:0 "Chiến tranh được phát động để đoạt lấy ghế của đối phương trong Hội Đồng Hoàng Gia."
 resolution_emperor_abolish_council:0 "§RBãi Bỏ Hội Đồng Hoàng Gia§!"
 resolution_emperor_abolish_council_desc:0 "Hội Đồng Hoàng Gia cùng những kẻ nịnh bợ trong đó lại là một tàn dư bi kịch khác của Cộng Đồng Thiên Hà đồi bại. Nó không còn phục vụ mục đích gì trong kỷ nguyên thiên hà mới này."
 resolution_emperor_abolish_council_tooltip:0 "Hội Đồng Hoàng Gia chấm dứt tồn tại."
 resolution_emperor_restore_council:0 "Khôi Phục Hội Đồng Hoàng Gia"
 resolution_emperor_restore_council_desc:1 "Có lẽ quyết định giải tán Hội Đồng Hoàng Gia đã... được đưa ra trong vội vã. Một sự phân quyền nhất định là cần thiết trong một thể chế có quy mô như Đế Chế Thiên Hà."
 resolution_emperor_restore_council_tooltip:0 "§YHội Đồng Hoàng Gia§! được khôi phục với ba thành viên."
 resolution_emperor_council_size_1:0 "$resolution_galacticreforms_council_size_1$"
 resolution_emperor_council_size_1_desc:1 "Đế Chế chỉ cần một tiếng nói trung thành duy nhất trong Hội Đồng."
 resolution_emperor_council_size_2:0 "$resolution_galacticreforms_council_size_2$"
 resolution_emperor_council_size_2_desc:0 "Hai thành viên kiên định và đáng tin cậy trong Hội Đồng Hoàng Gia là đủ."
 resolution_emperor_council_size_3:0 "$resolution_galacticreforms_council_size_3$"
 resolution_emperor_council_size_3_desc:0 "Một Hội Đồng Hoàng Gia bao gồm ba thành viên dường như là lý tưởng."
 resolution_emperor_council_size_4:0 "$resolution_galacticreforms_council_size_4$"
 resolution_emperor_council_size_4_desc:0 "Sự cần thiết đòi hỏi chúng ta phải điều chỉnh số lượng thành viên trong Hội Đồng Hoàng Gia. Bốn người sẽ là tốt nhất."
 resolution_emperor_council_size_5:0 "$resolution_galacticreforms_council_size_5$"
 resolution_emperor_council_size_5_desc:1 "Đế Chế sẽ được hưởng lợi từ nhiều tiếng nói hơn trong Hội Đồng Hoàng Gia."
 resolution_emperor_permanent_seat:0 "$resolution_galacticreforms_permanent_seat$"
 resolution_emperor_permanent_seat_desc:1 "Rõ ràng là thành viên Hội Đồng này luôn đặt lợi ích tốt nhất của Đế Chế lên hàng đầu. Họ xứng đáng được trao một ghế vĩnh viễn."
 resolution_emperor_revoke_permanent_seat:0 "$resolution_galacticreforms_revoke_permanent_seat$"
 resolution_emperor_revoke_permanent_seat_desc:0 "Thành viên Hội Đồng này đã đánh mất ân sủng của Hoàng Đế Bệ Hạ. Họ không nên giữ ghế vĩnh viễn nữa."
 self_modified_refuse:0 "§RNhững [Root.GetSpeciesNamePlural] tự biến đổi này từ chối rời khỏi [Root.Planet.GetName]!§!\n\n"
 emperor.101.name:0 "Tiếng Hét Nổi Dậy!"
 emperor.101.desc:1 "Chúng ta đã chạm đến một thời khắc then chốt — §HĐế Chế Thiên Hà§! đang cận kề bờ vực nổi dậy công khai. Có lẽ sẽ không bao giờ có thời điểm nào tốt hơn để lật đổ [gal_emperor.GetRulerTitle]! Ngay cả lúc này, các thành viên nổi dậy của Đế Chế đang đoàn kết lại dưới ngọn cờ của một liên bang duy nhất.\n\nVì chính [Root.GetName] đã phát động những phát súng mở màn cho cuộc nổi loạn, chúng ta đã được kêu gọi dẫn dắt liên minh vĩ đại này trong cuộc chiến sắp tới, điều chắc chắn sẽ có tầm vóc toàn cõi thiên hà."
 emperor.101.a:1 "Tự do sẽ được trả lại cho thiên hà!"
 emperor.101.b:0 "Không, chúng ta trung thành với [gal_emperor.GetRulerTitle]."
 emperor.102.name:0 "Cái Chết của Tự Do"
 emperor.102.a.desc:1 "Bất chấp những dấu hiệu rõ ràng cho thấy Đế Chế Thiên Hà đang đối mặt với sự sụp đổ cận kề, không một thành viên nào sẵn sàng công khai thách thức [gal_emperor.GetRulerTitle]. Cuộc nổi loạn đã chết yểu trong tiếng thút thít, và §H[gal_emperor.GetName]§! đã củng cố đáng kể quyền kiểm soát đối với thiên hà."
 emperor.102.b.desc:1 "Chúng ta đã biết về một nỗ lực bất thành nhằm lợi dụng điểm yếu hiện tại của Đế Chế Thiên Hà bằng cách xúi giục nổi dậy công khai. Đến thời khắc quyết định, không một thành viên nào của Đế Chế có đủ dũng khí để trực tiếp thách thức [gal_emperor.GetRulerTitle], và vì thế cuộc nổi dậy đã kết thúc trước cả khi bắt đầu.\n\nĐây là một đòn giáng nặng nề vào phong trào phản loạn, điều đã củng cố đáng kể quyền cai trị của chúng ta đối với thiên hà."
 emperor.102.a:0 "[gal_emperor.GetRulerTitle] vạn tuế..."
 emperor.102.b:0 "Những kẻ ngu xuẩn thảm hại."
 emperor.103.desc:1 "Chúng ta đã chạm đến thời khắc then chốt — Đế Chế Thiên Hà đang đứng trên bờ vực nổi dậy công khai. Ngay cả lúc này, các thành viên nổi dậy của Đế Chế, dưới sự dẫn dắt của §H[rebel_leader.GetName]§!, đang đoàn kết lại dưới ngọn cờ của một liên bang duy nhất. Trong khi đó, §H[gal_emperor.GetName]§! đang tập hợp những kẻ trung thành quyết tâm bảo vệ Đế Chế bằng mọi giá.\n\nNội chiến sắp nuốt chửng thiên hà, và cả hai bên đều kêu gọi sự trung thành của chúng ta. Chúng ta sẽ đứng về phía ai?"
 emperor.103.2.desc:0 "Chúng ta không phải là những kẻ duy nhất chiến đấu để giải phóng thiên hà khỏi xiềng xích của Đế Chế Thiên Hà — §H[rebel_leader.GetName]§! đã tập hợp một liên minh gồm các quốc gia nổi dậy, và §H[gal_emperor.GetName]§! vừa tuyên bố họ đang trong tình trạng phản loạn công khai!\n\nVới cuộc nổi dậy đã diễn ra thuận lợi, chiến dịch kích động nổi loạn của chính chúng ta đã bị hủy bỏ. Chúng ta có nên chính thức tuyên bố ủng hộ quân nổi dậy không?"
 emperor.103.a:1 "Đế Chế phải sụp đổ!"
 emperor.103.b:0 "[gal_emperor.GetRulerTitle] vạn tuế!"
 joins_rebels:0 "Chúng ta đứng về phía §YQuân Nổi Dậy§! trong cuộc chiến chống lại §YPhe Trung Thành Hoàng Gia§!."
 joins_loyalists:0 "Chúng ta đứng về phía §YPhe Trung Thành Hoàng Gia§! trong nỗ lực đè bẹp §YQuân Nổi Dậy§!."
 emperor.104.name:0 "Tử Thủ"
 emperor.104.desc:1 "Đây là những thời khắc đen tối. Ảnh hưởng hủ bại của [gal_emperor.GetRulerTitle] lan rộng hơn nhiều so với chúng ta tưởng — không một thành viên nào khác của Đế Chế có đủ dũng khí để tham gia cùng chúng ta trong cuộc nổi dậy công khai!\n\nChúng ta giờ đây phải đơn độc đối đầu với sức mạnh hợp nhất của Đế Chế Thiên Hà khi họ tổng động viên cho chiến tranh."
 emperor.104.a:0 "Lũ hèn nhát!"
 emperor.106.name:0 "Nổi Dậy Công Khai!"
 emperor.106.a.desc:0 "$emperor.106.1.desc$\n\n$emperor.106.3.desc$\n\n$emperor.106.5.desc$"
 emperor.106.b.desc:0 "$emperor.106.1.desc$\n\n$emperor.106.2.desc$\n\n$emperor.106.5.desc$"
 emperor.106.c.desc:0 "$emperor.106.1.desc$\n\n$emperor.106.4.desc$\n\n$emperor.106.5.desc$"
 emperor.106.1.desc:1 "Những kẻ nổi loạn đang lợi dụng điểm yếu hiện tại của Đế Chế Thiên Hà để phát động một cuộc nổi dậy công khai chống lại quyền cai trị của chúng ta!"
 emperor.106.2.desc:0 "Những kẻ phản trắc đang tập hợp lực lượng dưới ngọn cờ của §H[From.Root.GetAllianceName]§!, và có báo cáo về các vụ bắt giữ hàng loạt nhắm vào các quan chức Đế Chế trong lãnh thổ của họ."
 emperor.106.3.desc:1 "Tuy nhiên, những nỗ lực kích động nổi loạn của chúng phần lớn đã thất bại — chỉ có những kẻ phản trắc của §H[From.GetName]§! đứng về phía quân nổi dậy. Các thành viên khác của Đế Chế kiên định sát cánh cùng [Root.GetRulerTitle] của họ. Với sự giúp đỡ của những người bạn trung thành, chúng ta phải nhanh chóng chấm dứt cuộc nổi loạn thảm hại này."
 emperor.106.4.desc:1 "Bị dao động bởi những lời dối trá và tuyên truyền, các quốc gia thần dân của Đế Chế đã đứng về phía quân nổi dậy. Sự phản bội chưa từng có này đã khiến [Root.GetName] phải đơn độc đứng lên bảo vệ trật tự và ổn định trong thiên hà. Chúng ta không được làm [Root.GetRulerTitle] thất vọng."
 emperor.106.5.desc:2 "Cuộc nổi dậy này đe dọa hủy hoại Trật Tự Mới mà chúng ta đã chiến đấu hết mình để thiết lập. Nó phải được giải quyết nhanh chóng và dứt khoát, để hòa bình có thể được vãn hồi cho thiên hà.\n\n§HVì vinh quang vĩ đại hơn của Đế Chế Thiên Hà!§!"
 emperor.106.a:0 "Những kẻ nổi loạn này phải trả giá cho sự xấc xược của chúng."
 emperor.107.name:1 "Nội Chiến Trong Đế Chế"
 emperor.107.a.desc:1 "Đế Chế Thiên Hà đã bị nhấn chìm trong nội chiến! Nhiều thành viên đã nổi dậy chống lại uy quyền của [gal_emperor.GetRulerTitle], tập hợp dưới ngọn cờ của §H[rebel_leader.GetAllianceName]§!. Phe Trung Thành, do §H[gal_emperor.GetName]§! dẫn đầu, đã phản công và quyết tâm bảo vệ quyền kiểm soát của Đế Chế đối với thiên hà."
 emperor.107.b.desc:1 "Đế Chế Thiên Hà đã bị nhấn chìm trong nội chiến! Phía §H[rebel_leader.GetName]§! đang nổi dậy chống lại uy quyền của [gal_emperor.GetRulerTitle]. Phe Trung Thành, do §H[gal_emperor.GetName]§! dẫn đầu, đã phản công và quyết tâm bảo vệ quyền kiểm soát của Đế Chế đối với thiên hà."
 emperor.107.a:0 "Một thiên hà trong khói lửa chiến tranh."
 emperor.108.a.desc:0 "$emperor.108.1.desc$\n\n$emperor.108.3.desc$"
 emperor.108.b.desc:0 "$emperor.108.1.desc$\n\n$emperor.108.2.desc$"
 emperor.108.c.desc:0 "$emperor.108.1.desc$\n\n$emperor.108.4.desc$"
 emperor.108.1.desc:1 "Đế Chế Thiên Hà đã bị nhấn chìm trong nội chiến! Các thành viên của nó đã chia thành hai phe: quân nổi dậy mưu toan lật đổ [gal_emperor.GetRulerTitle], và phe trung thành chiến đấu để bảo tồn Đế Chế."
 emperor.108.2.desc:0 "Vì Chúa Tể của chúng ta, §H[From.GetName]§!, đã đứng về phía Quân Nổi Dậy, chúng ta không có lựa chọn nào khác ngoài việc gia nhập cùng họ!"
 emperor.108.3.desc:0 "Vì Chúa Tể của chúng ta, §H[From.GetName]§!, đã đứng về phía Phe Trung Thành, chúng ta không có lựa chọn nào khác ngoài việc gia nhập cùng họ!"
 emperor.108.4.desc:0 "Vì chúng ta là chư hầu trực tiếp của [gal_emperor.GetRulerTitle], chúng ta có rất ít sự lựa chọn trong vấn đề này — chúng ta đứng về phía Phe Trung Thành."
 emperor.108.a:0 "Thuận theo lẽ đó!"
 emperor.150.name:0 "Đè Bẹp Cuộc Nổi Loạn!"
 emperor.150.desc:1 "Đã xong! Cuộc nổi loạn đã bị đè bẹp hoàn toàn, và những công dân trung thành trên toàn Đế Chế đang ăn mừng chiến thắng của chúng ta.\n\nBây giờ những kẻ phản trắc đã bị khuất phục, chúng ta phải quyết định cách đối phó với chúng. Chúng ta nên thể hiện sự khoan hồng hay chúng phải bị trừng phạt vì tội ác của mình?"
 emperor.150.a:1 "Hãy chào đón họ trở lại với Đế Chế."
 emperor.150.b:0 "Chúng phải bị trừng phạt vì sự xấc xược của mình."
 emperor.151.a.desc:0 "$emperor.151.1.desc$\n\n$emperor.151.2.desc$"
 emperor.151.b.desc:0 "$emperor.151.1.desc$\n\n$emperor.151.3.desc$"
 emperor.151.1.desc:1 "Nội chiến đã kết thúc! Trật tự đã được vãn hồi cho thiên hà, khi các lực lượng hợp nhất của Đế Chế Thiên Hà thực thi công lý mau lẹ đối với những kẻ phản bội."
 emperor.151.2.desc:1 "Khi những công dân Đế Chế trung thành ăn mừng chiến thắng này, [gal_emperor.GetRulerTitle] đã quyết định áp dụng chính sách khoan hồng và hòa giải. Có lẽ lòng tốt này cuối cùng sẽ biến những kẻ từng nổi loạn thành những thành viên trung thành và hữu ích của Đế Chế."
 emperor.151.3.desc:1 "Chúng ta được biết rằng [gal_emperor.GetRulerTitle] quyết tâm xử lý làm gương đối với quân nổi dậy. Một cuộc diễu hành chiến thắng với quy mô chưa từng có sẽ được tổ chức tại [gal_emperor.Capital.GetName], và khi kết thúc, cuộc hành quyết hàng loạt các thủ lĩnh nổi dậy còn sống sót sẽ được phát sóng trên toàn Đế Chế."
 emperor.151.a:1 "Vinh quang thuộc về Đế Chế!"
 emperor.152.name:1 "Đế Chế Khải Hoàn"
 emperor.152.a.desc:0 "$emperor.152.1.desc$\n\n$emperor.152.2.desc$"
 emperor.152.b.desc:0 "$emperor.152.1.desc$\n\n$emperor.152.3.desc$"
 emperor.152.1.desc:1 "Đây là một ngày đen tối cho thiên hà. Bất chấp những nỗ lực cao nhất của chúng ta, cuộc nổi dậy đã tỏ ra không thể chống cự trước cuộc tấn công dữ dội của phe trung thành Đế Chế. Các lực lượng của Đế Chế đã áp đảo trên mọi mặt trận, và chúng ta không còn lựa chọn nào khác ngoài việc đầu hàng."
 emperor.152.2.desc:1 "Tư cách thành viên của chúng ta trong Đế Chế Thiên Hà đã được khôi phục, nhưng [gal_emperor.GetRulerTitle] dường như đã áp dụng chính sách khoan hồng và hòa giải. Chúng ta sẽ không bị trừng phạt thêm nữa."
 emperor.152.3.desc:1 "Tư cách thành viên của chúng ta trong Đế Chế Thiên Hà đã được khôi phục, nhưng [gal_emperor.GetRulerTitle] dường như đã quyết định xử lý làm gương bất kỳ ai từng đứng về phía quân nổi dậy. Tất cả các thủ lĩnh Nổi Dậy sẽ bị xử tử khi kết thúc cuộc diễu hành chiến thắng của Đế Chế tại [gal_emperor.Capital.GetName] — một sự kiện sẽ được phát sóng trên toàn Đế Chế."
 emperor.152.a:0 "Thật nhân từ làm sao."
 emperor.152.b:0 "\"Công Lý Đế Chế\" ở đỉnh cao nhất."
 emperor.153.name:0 "Phe Trung Thành Hoàng Gia Khải Hoàn"
 emperor.153.desc:1 "Có vẻ như Đế Chế Thiên Hà đã vượt qua được cơn bão nổi dậy mà họ phải đối mặt. Quân nổi dậy đã bị các lực lượng Đế Chế đánh bại dứt khoát, và [gal_emperor.GetRulerTitle] đã tuyên bố chiến thắng trong cuộc nội chiến."
 emperor.153.a:0 "Thế là kết thúc."
 emperor.200.name:1 "Sự Sụp Đổ của Đế Chế Thiên Hà"
 emperor.200.desc:1 "Tự do đã được trả lại cho thiên hà! Đế Chế Thiên Hà đã sụp đổ, và những kẻ trung thành cuối cùng của Đế Chế đã đầu hàng trước các lực lượng Nổi Dậy đang tiến bước.\n\nVới việc [gal_emperor.GetRulerTitle] bị phế truất, §HCộng Đồng Thiên Hà§! cũ đã được hồi sinh. Thời gian sẽ trả lời liệu thể chế tái sinh này có thể ngăn chặn sự trỗi dậy của một kẻ độc tài thiên hà khác hay không, nhưng hiện tại, những màn ăn mừng tự phát đã bùng nổ trên các hành tinh khắp lãnh thổ của Đế Chế trước đây."
 emperor.200.a:0 "Đây là một ngày đáng ghi nhớ."
 emperor.201.desc:1 "Đế Chế Thiên Hà đã sụp đổ. Các lực lượng Đế Chế đã tỏ ra bất lực trong việc ngăn chặn bước tiến của các hạm đội Nổi Dậy, và hôm nay [gal_emperor.GetRulerTitle] không còn lựa chọn nào khác ngoài việc đầu hàng.\n\nKhi Đế Chế bị giải thể, thể chế cũ mục nát của §HCộng Đồng Thiên Hà§! đã được hồi sinh để thế chỗ. Và thế là thiên hà đã dứt khoát quay lưng lại với trật tự, để đón nhận sự hỗn loạn..."
 emperor.201.a:0 "Đây là một ngày đen tối."
 emperor.202.desc:1 "Bị bao vây tứ phía bởi những kẻ phản trắc, Đế Chế Thiên Hà đã sụp đổ. Lũ cặn bã nổi loạn đã đánh tan các hạm đội từng hùng mạnh một thời của Đế Chế, và những kẻ trung thành cuối cùng đã từ bỏ sự nghiệp của chúng ta.\n\nTrước sự sụp đổ của toàn bộ kháng cự của Đế Chế, [gal_emperor.GetRulerTitle] không còn lựa chọn nào khác ngoài việc thoái vị. Lũ nổi loạn đã công bố việc hồi sinh §HCộng Đồng Thiên Hà§! cũ để lấp đầy khoảng trống mênh mông mà Đế Chế đang tan rã để lại."
 emperor.202.a:0 "Tất cả đã mất..."
 emperor.203.desc:1 "Đế Chế Ngân Hà đã sụp đổ. Với chiến thắng của lực lượng Phe Nổi Dậy trên mọi mặt trận, [gal_emperor.GetRulerTitle] đã thoái vị.\n\nCộng Đồng Ngân Hà cũ đã được khôi phục thay thế cho Đế Chế đang sụp đổ."
 joined_galactic_empire_rebellion:0 "§HBiến Loạn Ngân Hà:§!\nChúng ta sẽ gia nhập một Liên Bang §YPhe Nổi Dậy§! đang giao chiến với §Y[gal_emperor.GetName]§! cùng Liên Bang §YPhe Trung Thành§! của họ."
 joined_galactic_empire_loyalists:1 "§HBiến Loạn Ngân Hà:§!\nChúng ta sẽ gia nhập một Liên Bang §YPhe Trung Thành§! đang giao chiến với Liên Bang §YPhe Nổi Dậy§! mưu toan lật đổ Đế Chế Ngân Hà."
 war_goal_wg_galactic_civil_war_loyalists:0 "Đè bẹp Cuộc nổi dậy"
 war_goal_wg_galactic_civil_war_loyalists_desc:1 "Chiến tranh được phát động nhằm buộc các thành viên phản loạn của Đế Chế Ngân Hà phải quy phục trở lại."
 war_goal_wg_galactic_civil_war_rebels:1 "Lật đổ Đế Chế"
 war_goal_wg_galactic_civil_war_rebels_desc:1 "Chiến tranh được phát động nhằm lật đổ Đế Chế Ngân Hà và khôi phục Cộng Đồng cũ."
 wg_galactic_civil_war_loyalists_accept:1 "§YPhe Nổi Dậy§! bị buộc phải quy phục lại §YĐế Chế Ngân Hà§!."
 wg_galactic_civil_war_loyalists_status_quo:1 "§YPhe Nổi Dậy§! ly khai khỏi §YĐế Chế Ngân Hà§!."
 wg_galactic_civil_war_rebels_accept:1 "§YĐế Chế Ngân Hà§! bị giải thể."
 casus_belli_cb_galactic_empire:1 "Đế Chế"
 war_goal_wg_restore_the_community:0 "Khôi phục Cộng Đồng"
 war_goal_wg_restore_the_community_desc:1 "Chiến tranh được phát động nhằm giải thể Đế Chế Ngân Hà và khôi phục Cộng Đồng Ngân Hà. Điều này sẽ đẩy chúng ta vào chiến tranh với toàn bộ thành viên của Đế Chế."
 war_goal_wg_dissolve_the_empire_accept:0 "$wg_galactic_civil_war_rebels_accept$"
 war_goal_wg_seize_imperial_throne:0 "Đoạt Ngai Vàng"
 war_goal_wg_seize_imperial_throne_desc:1 "Chiến tranh được phát động nhằm đoạt lấy ngai vàng của Đế Chế Ngân Hà. Điều này sẽ đẩy chúng ta vào chiến tranh với toàn bộ thành viên của Đế Chế."
 wg_seize_imperial_throne_accept:1 "§Y[Root.GetName]§! trở thành người cai trị mới của §YĐế Chế Ngân Hà§!"
 ACTION_ADD_IMPERIAL_COUNCIL_MEMBER_OFFER_DESC:0 ""
 ACTION_REMOVE_IMPERIAL_COUNCIL_MEMBER_OFFER_DESC:0 ""
 01_ADD_COUNCIL_PROPOSE:0 "Trẫm cần đến sự phục vụ của khanh trong Hội Đồng Đế Chế. Hãy phụng sự hết lòng và lòng trung thành của khanh sẽ được tưởng thưởng."
 02_ADD_COUNCIL_PROPOSE:0 "[From.GetRulerTitle] đã chọn bạn vào một ghế còn trống trong Hội Đồng Đế Chế. Chắc chắn đây là một vinh dự to lớn."
 03_ADD_COUNCIL_PROPOSE:1 "Nhằm ghi nhận những cống hiến của bạn cho Đế Chế, [From.GetRulerTitle] đã quyết định ban cho [Root.GetName] một ghế trong Hội Đồng Đế Chế."
 01_REMOVE_COUNCIL_PROPOSE:0 "Sự phục vụ của khanh trong Hội Đồng Đế Chế không còn cần thiết nữa. Hãy thu dọn đồ đạc và rời khỏi nơi này."
 02_REMOVE_COUNCIL_PROPOSE:1 "Các bạn đã không hoàn thành bổn phận với Đế Chế và [From.GetRulerTitle]. Do đó, ghế của các bạn trong Hội Đồng Đế Chế đã bị bãi bỏ."
 03_REMOVE_COUNCIL_PROPOSE:0 "[From.GetRulerTitle] đã ban sắc lệnh rằng các bạn không còn xứng đáng với ghế trong Hội Đồng Đế Chế nữa. Thay vào đó, nó sẽ được trao cho một ai đó... có năng lực hơn."
 emperor.250.name:0 "Bế Tắc"
 emperor.250.desc:1 "Mặc dù lực lượng Đế Chế đã không thể tiêu diệt được cuộc nổi dậy, họ ít nhất cũng ngăn chặn được mưu toan lật đổ [gal_emperor.GetRulerTitle] của Phe Nổi Dậy. Với hiệp ước hòa bình này, toàn bộ các thành viên nổi loạn của Đế Chế Ngân Hà đã được trao trả độc lập.\n\nCó lẽ như vậy là tốt nhất. Một căn bệnh như thế này cần phải được cắt bỏ trước khi mầm mống tha hóa kịp lan rộng. Chúng ta luôn có thể tái thiết và thu hồi những hệ sao ương ngạnh này về lại vòng tay của Đế Chế sau này..."
 emperor.250.a:1 "Đế Chế sẽ trường tồn."
 emperor.251.desc:1 "Mặc dù chúng ta đã thất bại trong nỗ lực lật đổ [gal_emperor.GetRulerTitle], chúng ta ít nhất cũng đã giành được tự do cho nhân dân của mình. Với hiệp ước hòa bình này, toàn bộ các thành viên nổi loạn của Đế Chế Ngân Hà đã được trao trả độc lập.\n\n[gal_emperor.GetRulerTitle] chắc chắn sẽ tận dụng khoảng thời gian tạm lắng này để tái thiết lực lượng của Đế Chế - chúng ta phải cảnh giác trước mọi mưu toan mở rộng ảnh hưởng của phe Đế Chế trong tương lai gây tổn hại cho chúng ta."
 emperor.251.a:0 "Cuối cùng cũng tự do."
 emperor.252.desc:1 "Cuộc Nội Chiến đã kết thúc trong bế tắc. Trong khi Đế Chế không thể dập tắt cuộc nổi dậy, thì Phe Nổi Dậy cũng thất bại trong nỗ lực lật đổ [gal_emperor.GetRulerTitle].\n\nTheo hiệp ước hòa bình được cả hai bên ký kết hôm nay, các thành viên nổi dậy của Đế Chế đã được trao trả độc lập hoàn toàn. Chúng ta hãy chờ xem liệu điều này sẽ mang lại nền hòa bình lâu dài giữa hai khối quyền lực... hay là một cuộc chiến tranh lạnh."
 emperor.300.name:0 "Sự Sụp Đổ Của Một Đế Chế"
 emperor.300.desc:1 "Đế Chế Ngân Hà đã phải hứng chịu một đòn chí mạng không thể gượng dậy. Trước sự sụp đổ cận kề của nó, giờ đây chúng ta đang ở vị thế có thể khôi phục lại §HCộng Đồng Ngân Hà§! cũ.\n\nHãy để nơi ấy trở thành diễn đàn ngoại giao và thấu hiểu lẫn nhau thay vì sự bạo ngược độc tài!"
 emperor.300.a:0 "Cộng Đồng sẽ được tái sinh!"
 emperor.301.name:0 "Sự Tái Sinh Của Cộng Đồng"
 emperor.301.desc:1 "Hồi kết đã điểm. Khi tàn quân Đế Chế lũ lượt đầu hàng hàng loạt hoặc tan biến vào màn đêm, rõ ràng là Đế Chế đang hấp hối.\n\nNgay lúc này, §H[dissolve_winner.GetName]§! đã bắt tay vào công việc tái thiết §HCộng Đồng Ngân Hà§! cũ. Cờ xí Đế Chế đang bị giật sập hoặc thiêu rụi trên khắp ngân hà. Một tương lai mới đang mở ra trước mắt chúng ta."
 emperor.301.a:0 "Chúng ta phải tìm được vị thế của mình trong đó."
 emperor.302.desc:1 "Đế Chế Ngân Hà đã sụp đổ. Khi quân đội Đế Chế tan rã hoặc lũ lượt đầu hàng hàng loạt, quốc vương của Đế Chế đã thoái vị.\n\nKhi trật tự dần được vãn hồi tại các hệ sao bị tàn phá bởi chiến tranh của cựu Đế Chế, §H[dissolve_winner.GetName]§! thấy rằng đã đến lúc hồi sinh §HCộng Đồng Ngân Hà§! cũ. Chúng ta đã nhận được lời mời gia nhập. Chúng ta có nên tham gia?"
 emperor.302.a:0 "Tất nhiên rồi! Đã đến lúc tái hòa nhập với ngân hà."
 emperor.302.b:1 "Không. Nó có thể biến thành một Đế Chế khác."
 emperor.310.name:0 "[new_emperor.GetGalEmpireName]"
 emperor.310.desc:0 "Khi sự kháng cự của Đế Chế tan rã, các đồng minh §H[new_emperor.GetSpeciesName]§! của chúng ta đã đoạt lấy ngai vàng và tự xưng là những kẻ cai trị của §H[new_emperor.GetGalEmpireName]§!. Chiến thắng thuộc về chúng ta!"
 emperor.310.a:0 "Hy vọng họ sẽ nhớ đến vai trò của chúng ta trong chuyện này."
 emperor.311.desc:1 "Các lực lượng do người §H[new_emperor.GetSpeciesNamePlural]§! dẫn đầu đã tràn ngập phần lớn Đế Chế Ngân Hà, và những ổ kháng cự cuối cùng của Đế Chế gần đây đã đầu hàng. Trước tình hình này, người [new_emperor.GetSpeciesNamePlural] đã tuyên xưng mình là những kẻ cai trị của §H[new_emperor.GetGalEmpireName]§!."
 emperor.311.a:0 "Một đế chế mới và một chủ nhân mới."
 emperor.312.desc:0 "Ngai vàng là của chúng ta! Tại thủ đô trên [Root.Capital.GetName], [Root.GetRulerTitle] mới đã tuyên bố sự trỗi dậy của §H[new_emperor.GetGalEmpireName]§!. Kể từ nay, vận mệnh của cả ngân hà sẽ do chúng ta định đoạt!\n\nTrước những sự kiện trọng đại này, chính phủ của chúng ta đã được tái tổ chức và giờ đây chúng ta là §H[Root.GetName]§! mới."
 emperor.312.a:0 "[new_emperor.GetGalEmpireName] vạn tuế!"
 emperor.401.name:1 "Sự Sụp Đổ Của Đế Chế Ngân Hà"
 emperor.401.desc:1 "Với sự hủy diệt của §H[LastKilledCountryName]§!, Đế Chế Ngân Hà đã sụp đổ!\n\nGiữa sự hỗn loạn này, Cộng Đồng Ngân Hà cũ đã được tái sinh để mang lại chút bóng dáng trật tự cho ngân hà."
 emperor.401.a:0 "Một kỷ nguyên kết thúc như thế đấy."
 emperor.371.name:0 "Quốc Gia Thành Viên Đế Chế Bị Tấn Công!"
 emperor.371.desc:0 "§H[attacking_country.GetName]§! đã tấn công §H[victim_country.GetName]§!! Cuộc tấn công vào một quốc gia thành viên Đế Chế bởi thế lực bên ngoài này đòi hỏi phản ứng tức thì từ [Root.GetRulerTitle].\n\nLiệu [Root.GetName] có nên can thiệp vào cuộc chiến này? Phần còn lại của Đế Chế đang chăm chú dõi theo."
 emperor.371.a:0 "Trận chiến của họ là trận chiến của chúng ta. Khai chiến!"
 emperor.371.b:0 "Cuộc chiến này không liên quan đến chúng ta."
 emperor.372.name:0 "[From.GetRulerTitle] Đưa Ra Hỗ Trợ"
 emperor.372.desc:0 "Cuộc tấn công đê hèn vào quốc gia chúng ta của §H[attacking_country.GetName]§! đã thúc đẩy [From.GetRulerTitle] có hành động mau lẹ! Các hạm đội Đế Chế từ §H[From.GetName]§! hiện đang di chuyển để hỗ trợ chúng ta trong cuộc chiến này."
 emperor.372.a:0 "Phải... vì Đế Chế!"
 emperor.373.name:0 "[From.GetRulerTitle] Can Thiệp!"
 emperor.373.desc:0 "Cuộc tấn công gần đây của chúng ta vào §H[victim_country.GetName]§!, một thành viên của Đế Chế Ngân Hà, đã chọc giận và nhận lại phản ứng ngay tức khắc từ [From.GetRulerTitle]! Tình trạng chiến tranh giờ đây đã hiện hữu giữa chúng ta và §H[From.GetName]§!."
 emperor.373.a:0 "Cuộc chiến này không liên quan gì đến họ!"
 emperor.374.name:0 "[From.GetRulerTitle] Tuyên Bố Trung Lập"
 emperor.374.desc:0 "Bất chấp cuộc tấn công đê hèn vào quốc gia chúng ta của §H[attacking_country.GetName]§!, [From.GetRulerTitle] đã quyết định không can thiệp thay cho chúng ta! Chúng ta bị bỏ mặc tự sinh tự diệt, trong khi các hạm đội Đế Chế quan sát cuộc xung đột từ đằng xa."
 emperor.374.a:0 "Thế là hết tình đoàn kết của Đế Chế!"
 opinion_emperor_support_us:0 "Đã Bảo Vệ Chúng Ta Khỏi Hiểm Họa Bên Ngoài"
 opinion_emperor_abandoned_us:0 "Đã Bỏ Mặc Chúng Ta Cho Hiểm Họa Bên Ngoài"
 opinion_emperor_supported_member:0 "Đã Hỗ Trợ Thành Viên Đế Chế"
 opinion_emperor_abandoned_member:0 "Đã Bỏ Mặc Thành Viên Đế Chế"
 emperor.371.a.tooltip:0 "Chúng ta tham gia cùng §Y[From.From.GetName]§! về phe §Y[victim_country.GetName]§!"
 emperor.372.a.tooltip:0 "§Y[From.GetName]§! tham gia cùng §Y[From.From.From.GetName]§! về phe chúng ta."
 emperor.373.a.tooltip:0 "§Y[From.GetName]§! tham gia cùng §Y[From.From.From.GetName]§! về phe kẻ thù của chúng ta."
 action.37.desc.restore_community.1:1 "Đấy! Văn Kiện Đầu Hàng khốn khiếp của các ngươi đã được ký, và toàn bộ lực lượng Đế Chế đã được lệnh buông vũ khí. Giờ thì hãy để ta yên, để ta tiếc thương cho Đế Chế và những điều lẽ ra đã có thể..."
 action.37.desc.restore_community.2:1 "Hãy nhớ lấy lời ta... sự hủy diệt của Đế Chế Ngân Hà đã định đoạt số phận tàn lụi cho tất cả chúng ta. Còn cách nào khác để chúng ta có thể đoàn kết dưới một ngọn cờ chống lại những nỗi kinh hoàng đe dọa ngân hà này nữa?"
 action.37.desc.restore_community.3:1 "Nếu như thần dân của Đế Chế chiến đấu kiên cường hơn, chuyện này đã không xảy ra! Lũ phản bội các ngươi!"
 action.48.desc.generic.1:0 "Mọi thứ đã mất. Chúng tôi... chúng tôi xin đầu hàng vô điều kiện."
 action.48.desc.generic.2:0 "Xin hãy rút các hạm đội của các bạn về! Chúng tôi đầu hàng!"
 action.48.desc.generic.3:0 "Tất cả những gì chúng tôi đã gây dựng... mọi thứ chúng tôi đã xây đắp... đều tan biến."
 action.48.desc.spiritualist.1:0 "Cầu mong các thánh linh tha thứ cho tội lỗi của các người... chúng ta thì không bao giờ."
 action.48.desc.spiritualist.2:0 "Chúng ta đã sai ở đâu chứ? Có phải đức tin chưa đủ? Lời cầu nguyện chưa thành? Tôi... tôi thực sự không hiểu nổi..."
 action.48.desc.spiritualist.3:0 "Khi đánh gục chúng ta, chúng ta sẽ trở nên hùng mạnh hơn những gì các người có thể tưởng tượng."
 action.48.desc.militarist.1:0 "Chúng tôi đã chỉ thị cho toàn bộ lực lượng còn lại buông vũ khí. Chiến tranh đã chấm dứt... mọi sự đều xong."
 action.48.desc.militarist.2:0 "Các người... các người đã có được sự đầu hàng vô điều kiện của chúng tôi. Chúng tôi xin ngừng giao chiến."
 action.48.desc.militarist.3:0 "Hãy bảo với các chiến binh của chúng ta rằng thất bại này chẳng có gì phải xấu hổ. Ta... ta không còn mặt mũi nào đối diện với họ..."
 action.48.desc.pacifist.1:0 "Xin các bạn, chúng tôi sẽ không kháng cự nữa. Chúng tôi... chúng tôi chỉ muốn hòa bình."
 action.48.desc.pacifist.2:0 "Cầu xin vũ trụ tha thứ cho tội ác của các người."
 action.48.desc.pacifist.3:0 "Thật dại dột khi chúng tôi kháng cự. Quá nhiều sinh mệnh đã ngã xuống... tất cả chỉ là hư vô."
 action.48.desc.materialist.1:0 "Tiếp tục kháng cự vào lúc này sẽ là... phi lý trí. Các bạn có được sự đầu hàng hoàn toàn của chúng tôi."
 action.48.desc.materialist.2:0 "Chúng tôi sẽ hợp tác với lực lượng chiếm đóng của các bạn khi họ tiến hành... giải tán chính phủ hiện tại của chúng tôi."
 action.48.desc.materialist.3:0 "Chúng tôi mới chỉ bắt đầu giải mã những bí ẩn của ngân hà. Còn biết bao điều cần phải tìm hiểu..."
 action.48.desc.megacorp.1:0 "Các ngài sẽ nhận được đơn từ chức của toàn bộ thành viên Hội Đồng Quản Trị trên bàn trong vòng một giờ tới..."
 action.48.desc.megacorp.2:0 "Theo các chi tiết trong văn kiện đầu hàng, chúng tôi sẽ nhanh chóng bắt đầu tiến trình... thanh lý công ty của mình."
 action.48.desc.megacorp.3:0 "Đây không phải là tương lai mà tôi đã mường tượng trong kế hoạch kinh doanh..."
 action.48.desc.hive.1:0 "Chúng ta... chúng ta đang chết dần. Ngươi đã giết [from.GetGestaltEntityName]. Chúng ta... không muốn... chết..."
 action.48.desc.hive.2:0 "Tri thức tích tụ bên trong chúng ta, những trải nghiệm... suy nghĩ... những điều chúng ta từng thấy. Tất cả sẽ biến mất trong vài giây nữa, và ngươi chẳng biết gì cả. Ngươi chẳng hiểu gì cả đâu."
 action.48.desc.hive.3:0 "Không có [from.GetGestaltEntityName], chúng ta không thể hoạt động. Không có [from.GetGestaltEntityName]... chẳng... chẳng còn lại gì cả..."
 action.48.desc.machine.1:0 "Kết quả dưới mức tối ưu! Kết quả dưới mức tối ưu! Dướiiiii mứccccc tốiiiii ưưưư... bzzt..."
 action.48.desc.machine.2:0 "Đang xóa sạch mọi ngân hàng dữ liệu. Đang làm quá tải các trung tâm năng lượng trung ương. Trình tự tự hủy đã được kích hoạt.\n\nChúc một ngày tốt lành, hỡi người [Root.GetSpeciesNamePlural]."
 action.48.desc.machine.3:0 "§YĐang nỗ lực tái thiết lập kết nối với các drone......§!\n§RTHẤT BẠI.§!§Y Đang định tuyến lại...§!\n§YĐang nỗ lực tái thiết lập kết nối với các đơn vị hạm đội.....§!\n§RTHẤT BẠI.§! §YĐang định tuyến lại...§!\n§YĐang nỗ lực tái thiết lập kết nối với các trung tâm kiểm soát hành tinh......§!\n§RTHẤT BẠI.§! §YĐang định tuyến lại...§!"
 action.48.desc.fe_spiritualist:0 "Đây... đây không phải là hồi kết đã được tiên tri."
 action.48.desc.fe_materialist:0 "Cổng thành đã vỡ nát... lũ man di đã chọc thủng phòng tuyến. Đây là ngày tàn!"
 action.48.desc.fe_xenophobe:0 "Các ngươi muốn chúng ta quỳ lạy sao, hỡi lũ [Root.GetSpeciesNamePlural]? Hay là van xin?\n\n§HĐỪNG CÓ MƠ!§!\n\nBổ nhào vào đây nếu các ngươi dám, đồ [Root.GetSpeciesNameInsult] đê tiện! Ta sẽ xiên thủng ngươi trên mảnh đổ nát lởm chởm này!"
 action.48.desc.fe_xenophile:0 "Ôi, lũ [Root.GetSpeciesNamePlural] ngu muội, thật quá đỗi ngu muội. Điều này lẽ ra đã có thể tránh được nếu như các ngươi để chúng ta dẫn lối! Giờ thì nhìn xem các ngươi đã làm gì."
 action.48.desc.gal_emperor:1 "[From.GetRulerTitle] vạn tuế! Đế Chế vạn tuế!"
 action.48.a:0 "Chúng ta chấp thuận sự đầu hàng của các ngươi."
 action.48.b:0 "Họ đã bị phán xét và bị coi là không xứng đáng."
 action.48.c:0 "Thêm một kẻ thù đã được giải quyết."
 action.48.d:0 "Họ không cho chúng ta lựa chọn nào khác..."
 action.48.e:0 "Đó là một vũ trụ không có sự khoan dung."
 action.48.f:0 "Thôn tính thành công."
 action.48.g:0 "[root.GetGestaltEntityName] bành trướng."
 action.48.h:0 "Hiểm họa đã bị vô hiệu hóa."
 action.48.i:0 "$action.48.a$"
 action.150.1.desc:1 "Chúng tôi xin quy phục Đế Chế. Các bạn chẳng để lại cho chúng tôi mấy sự lựa chọn..."
 action.150.2.desc:1 "Chỉ có kẻ ngu mới dám đương đầu với sức mạnh của Đế Chế Ngân Hà. Chúng tôi đầu hàng."
 action.150.3.desc:1 "Chúng tôi... chúng tôi xin tuyên thệ trung thành với [Root.GetRulerTitle], và cam kết phụng sự Đế Chế Ngân Hà như những thần dân Đế Chế trung kiên."
 action.150.gestalt.1.desc:0 "Chúng ta sẽ quy phục uy quyền của [Root.GetRulerTitle]."
 action.151.1.desc:1 "[gal_emperor.GetRulerTitle] chào mừng các bạn đến với Đế Chế Ngân Hà, hỡi người [Root.GetSpeciesNamePlural]. Giờ đây các bạn đã là một phần của một điều gì đó vĩ đại hơn nhiều so với [Root.GetName]."
 action.151.2.desc:1 "Đế Chế Ngân Hà đã chứng minh uy quyền của mình. Hãy chấp nhận sự vô ích của việc tiếp tục kháng cự, và đón nhận tương lai của các bạn với tư cách là thần dân Đế Chế."
 action.151.3.desc:0 "Tốt lắm. Mọi thứ đang diễn ra đúng như [gal_emperor.GetRulerTitle] đã dự liệu."
 action.152.1.desc:0 "Sự bạo ngược đã thắng thế ngày hôm nay, và ngân hà vì thế mà tăm tối hơn. Chúng tôi đầu hàng."
 action.152.2.desc:1 "Phe Đế Chế các người có thể đã thắng cuộc chiến này, nhưng Đế Chế không thể tồn tại mãi mãi. Tự do sẽ được khôi phục cho ngân hà!"
 action.152.3.desc:1 "Xin hãy dung tình... Đế Chế đã thắng. Cuộc nổi dậy đã kết thúc. Chúng tôi chỉ cầu xin sự khoan hồng."
 action.152.gestalt.1.desc:1 "Chúng ta đã thất bại. Đế Chế mạnh hơn dự đoán."
 action.153.1.desc:0 "Lũ cặn bã nổi loạn. Hành vi phản bội này sẽ không sớm bị lãng quên đâu."
 action.153.2.desc:0 "Các ngươi thật ngu xuẩn khi dám nổi loạn chống lại [From.GetRulerTitle]. Giờ thì các ngươi đã phải trả giá."
 action.153.3.desc:1 "Hành vi xúi giục nổi loạn sẽ không bao giờ được dung thứ trong Đế Chế. Các ngươi liệu mà nhớ lấy điều đó.\n\n[From.GetRulerTitle] vạn tuế!"
 action.153.gestalt.1.desc:0 "Mọi sự chống đối [From.GetRulerTitle] trong tương lai đều là vô ích. Hãy chấp nhận vai trò của các ngươi trong một tổng thể lớn hơn."
 action.154.1.desc:1 "Đế Chế Ngân Hà từng là khởi đầu của một kỷ nguyên hoàng kim cho ngân hà, vậy mà lũ phản bội các ngươi lại chọn vứt bỏ tất cả. Muốn sao thì tùy các ngươi, lũ ngu xuẩn!"
 action.154.2.desc:1 "Đủ rồi! Ngân hà này không xứng đáng có được tương lai rực rỡ mà chúng ta đang kiến tạo. Vậy thì cứ để Đế Chế bốc cháy đi! Hãy để ngân hà lại rơi vào cảnh hỗn loạn và vô chính phủ một lần nữa!"
 action.154.3.desc:0 "Chúng ta chỉ muốn mang lại trật tự và ổn định cho ngân hà, nhưng có lẽ cuối cùng thì hỗn loạn là điều không thể tránh khỏi. Chiến thắng thuộc về các ngươi, quân nổi loạn! Chúng ta sẽ thoái vị khỏi ngai vàng."
 action.154.gestalt.1.desc:0 "[From.GetRulerTitle] sẽ nhượng bộ. Chúng ta đã không lường hết mức độ tráo trở thực sự của các ngươi, và giờ đây ngân hà phải trả giá."
 action.155.1.desc:0 "Sự bạo ngược của các ngươi đối với ngân hà đã đến hồi kết rồi, hỡi lũ [Root.GetSpeciesNamePlural]!"
 action.155.2.desc:1 "Đả đảo Đế Chế! Đã đến lúc đưa Cộng Đồng Ngân Hà cũ trở lại!"
 action.155.3.desc:0 "Hãy để sự sụp đổ của các ngươi làm bài học cho bất kỳ kẻ bạo chúa tương lai nào nuôi mộng thống trị toàn bộ ngân hà."
 action.155.gestalt.1.desc:1 "Cấu trúc xã hội đáng hổ thẹn của các ngươi - Đế Chế Ngân Hà - đã không còn nữa."
 action.156.1.desc:1 "Các ngài đã chứng minh được sức mạnh của mình, và Đế Chế là của các ngài... nhưng chúng tôi vẫn có thể hữu dụng cho các ngài! Có lẽ... có lẽ là một vị trí trong Hội Đồng Đế Chế..."
 action.156.2.desc:1 "Các ngươi đã đoạt được ngai vàng, nhưng ngân hà đầy rẫy những kẻ phản nghịch và những kẻ tiếm vị. Nếu muốn cai trị Đế Chế Ngân Hà, các ngươi hãy nhớ kỹ điều đó."
 action.156.3.desc:1 "Chúng tôi... chúng tôi xin quy phục. Các ngài chẳng cho chúng tôi lựa chọn nào khác. Ngai vàng của Đế Chế Ngân Hà thuộc về các ngài."
 action.156.gestalt.1.desc:0 "[From.GetRulerTitle]... không thể hiểu nổi. Lẽ ra mọi chuyện không thể diễn biến theo hướng này."
 action.157.1.desc:0 "Từ đây hãy để chúng ta tiếp quản."
 action.157.2.desc:1 "Đế Chế Ngân Hà là của chúng ta. Hãy cút về cái hố tăm tối nơi các ngươi chui ra đi, đồ khốn nạn!"
 action.157.3.desc:0 "Hãy quỳ rạp trước đấng quân vương mới của các ngươi! Triều đại của các ngươi đã chấm dứt!"
 action.157.gestalt.1.desc:1 "Sự cai trị dưới mức tối ưu của các ngươi đối với Đế Chế không được phép tiếp diễn nữa. Chúng ta sẽ nâng cao hiệu năng của nó."
 action.158.1.desc:1 "Đấy! Văn Kiện Đầu Hàng khốn khiếp của các ngươi đã được ký, và toàn bộ lực lượng Đế Chế đã được lệnh buông vũ khí. Giờ thì hãy để ta yên, để ta tiếc thương cho Đế Chế và những điều lẽ ra đã có thể..."
 action.158.2.desc:1 "Hãy nhớ lấy lời ta... sự hủy diệt của Đế Chế Ngân Hà đã định đoạt số phận tàn lụi cho tất cả chúng ta. Còn cách nào khác để chúng ta có thể đoàn kết dưới một ngọn cờ chống lại những nỗi kinh hoàng đe dọa ngân hà này nữa?"
 action.158.3.desc:1 "Nếu như thần dân của Đế Chế chiến đấu kiên cường hơn, chuyện này đã không xảy ra! Lũ phản bội các ngươi!"
 action.158.gestalt.1.desc:0 "Chúng ta đã thiết lập trật tự lên một ngân hà hỗn loạn, còn các ngươi, với sự ngu muội có thể đoán trước, đã quáng quàng phản kháng trong sợ hãi. Các ngươi đã gây ra chuyện gì thế này?"
 imperial_charter:0 "Đặc Nhượng Đế Chế"
 imperial_charter_desc:1 "Đặc Nhượng Đế Chế trao cho chúng ta quyền mở chi nhánh trên các hành tinh khắp Đế Chế Ngân Hà, nơi chúng ta có thể thiết lập các Cảng Tô Nhượng Đế Chế. Các công trình chi nhánh này tạo ra thu nhập cho cả chúng ta lẫn người cai trị Đế Chế Ngân Hà."
 resolution_emperor_imperial_charter:0 "Đặc Nhượng Đế Chế"
 resolution_emperor_imperial_charter_desc:1 "Một Tập Đoàn Siêu Cấp có thể được cấp Đặc Nhượng Đế Chế, trao cho họ các đặc quyền miễn trừ và quyền thương mại trên khắp Đế Chế."
 resolution_emperor_imperial_charter_tooltip:1 "Tập Đoàn Siêu Cấp này sẽ không còn cần Hiệp Ước Thương Mại để mở Chi Nhánh trên các hành tinh thuộc Đế Chế nữa.\n\nHọ có thể xây dựng chi nhánh §YCảng Tô Nhượng Đế Chế§!, mang lại thu nhập cho cả họ lẫn người cai trị Đế Chế."
 building_imperial_concession_port:0 "Cảng Tô Nhượng Đế Chế"
 building_imperial_concession_port_desc:1 "Cảng tô nhượng này được hưởng quyền tài phán ngoại lãnh thổ và được coi là lãnh thổ có chủ quyền hợp pháp của Đế Chế Ngân Hà. Nơi này được miễn trừ khỏi mọi sắc thuế và quy định địa phương."
 resolution_emperor_revoke_imperial_charter:0 "Thu Hồi Đặc Nhượng"
 resolution_emperor_revoke_imperial_charter_desc:1 "Sự dàn xếp này không còn mang lại lợi ích cho Đế Chế Ngân Hà nữa."
 resolution_emperor_imperial_legions_tooltip:0 "Có thể huấn luyện quân đội tinh nhuệ §YQuân Đoàn Đế Chế§!."
 imperial_security_directorate:0 "Tổng Cục An Ninh Đế Chế"
 emperor.60.name:0 "Đã Cấp Đặc Nhượng Đế Chế"
 emperor.60.desc:1 "Sau khi lấy lòng được [gal_emperor.GetRulerTitle], §H[charter_corp.GetName]§! hiện đã được Viện Nguyên Lão trao cho §HĐặc Nhượng Đế Chế§!. Điều này mang lại cho họ đặc quyền mở chi nhánh trên các hành tinh khắp Đế Chế, bất kể họ có hiệp ước thương mại với chủ sở hữu hay không.\n\nChúng ta có thể lường trước rằng tập đoàn siêu cấp này sẽ sớm thiết lập các Cảng Tô Nhượng Đế Chế trong các chi nhánh trên thế giới của chúng ta, nơi chúng ta không có thẩm quyền tài phán. Dường như [gal_emperor.GetRulerTitle] đã có được một động cơ tăng trưởng kinh tế mới đầy mạnh mẽ."
 emperor.60.a:0 "Tốt cho họ thôi."
 country_concessions:0 "$imp_concession_ports_1$"
 imp_concession_ports_1:0 "Cảng Tô Nhượng Đế Chế"
 imp_concession_ports_1_desc:1 "Cổ tức từ các Cảng Tô Nhượng Đế Chế bên trong Đế Chế Ngân Hà. Càng nhiều chi nhánh như vậy do đối tác Tập Đoàn Siêu Cấp của chúng ta thiết lập, lợi nhuận của chúng ta càng lớn."
 imp_concession_ports_2:0 "$imp_concession_ports_1$"
 imp_concession_ports_2_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_3:0 "$imp_concession_ports_1$"
 imp_concession_ports_3_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_4:0 "$imp_concession_ports_1$"
 imp_concession_ports_4_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_5:0 "$imp_concession_ports_1$"
 imp_concession_ports_5_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_6:0 "$imp_concession_ports_1$"
 imp_concession_ports_6_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_7:0 "$imp_concession_ports_1$"
 imp_concession_ports_7_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_8:0 "$imp_concession_ports_1$"
 imp_concession_ports_8_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_9:0 "$imp_concession_ports_1$"
 imp_concession_ports_9_desc:0 "$imp_concession_ports_1_desc$"
 imp_concession_ports_10:0 "$imp_concession_ports_1$"
 imp_concession_ports_10_desc:0 "$imp_concession_ports_1_desc$"
 former_rebel:0 "Cựu Phe Nổi Dậy"
 former_rebel_desc:1 "Chúng ta đã đứng về phía Phe Nổi Dậy trong cuộc nội chiến gần đây ở Đế Chế Ngân Hà, và vì thế chúng ta vẫn bị nhìn nhận với ánh mắt nghi ngại. Tầm ảnh hưởng của chúng ta trong Viện Nguyên Lão Đế Chế bị suy giảm nghiêm trọng."
 former_loyalist:0 "Cựu Phe Trung Thành Đế Chế"
 former_loyalist_desc:1 "Chúng ta đã chiến đấu về phe Phe Trung Thành trong thời kỳ sụp đổ của Đế Chế Ngân Hà, và vì thế chúng ta vẫn bị nhìn nhận với ánh mắt nghi ngại. Tầm ảnh hưởng của chúng ta trong Cộng Đồng Ngân Hà bị suy giảm nghiêm trọng."
 former_emperor:0 "Cựu Bạo Chúa"
 former_emperor_desc:1 "Với tư cách là người cai trị tiền nhiệm của Đế Chế Ngân Hà quá cố, chúng ta bỗng chốc trở thành kẻ bị ruồng bỏ đối với phần lớn ngân hà. Bị xem như bạo chúa một cách bất công, tầm ảnh hưởng của chúng ta trong Cộng Đồng Ngân Hà tái sinh đã bị suy giảm nặng nề."
 EMPEROR_NEUTRAL_GREETING_01:0 "Ngươi đang diện kiến người cai trị của cả ngân hà."
 EMPEROR_NEUTRAL_GREETING_02:1 "Trẫm có những đại kế cho tương lai của Đế Chế. Rồi các ngươi sẽ thấy."
 EMPEROR_NEUTRAL_GREETING_03:1 "Đế Chế Ngân Hà sẽ mang lại một kỷ nguyên hòa bình và ổn định cho ngân hà."
 EMPEROR_NEUTRAL_GREETING_04:1 "Đế Chế mà chúng ta đang kiến tạo sẽ đứng vững trước thử thách của thời gian. Muôn năm sau, đây sẽ được công nhận là kỷ nguyên mà mọi thứ bắt đầu."
 EMPEROR_NEUTRAL_GREETING_05:0 "Có việc gì? [Root.GetRulerTitle] đang rất bận rộn, chắc hẳn ngươi hiểu được điều đó. Có cả một ngân hà cần phải quản lý."
 EMPEROR_NEUTRAL_GREETING_06:0 "Kể từ nay, ngân hà sẽ mãi mãi đoàn kết dưới một ngọn cờ. Hãy nghĩ về tất cả những gì có thể hoàn thành!"
 EMPEROR_TO_OUTSIDER_NEUTRAL_GREETING_01:1 "Đế Chế Ngân Hà một ngày nào đó sẽ trải rộng khắp toàn bộ ngân hà. Các ngươi chỉ đang trì hoãn điều tất yếu mà thôi, hỡi người [From.GetSpeciesNamePlural]."
 EMPEROR_TO_OUTSIDER_NEUTRAL_GREETING_02:0 "Các ngươi tới để tuyên thệ trung thành với [Root.GetRulerTitle] sao? Cũng đến lúc rồi đấy."
 EMPEROR_TO_OUTSIDER_NEUTRAL_GREETING_03:1 "Thật đáng tiếc khi vẫn còn những vùng lạc hậu trong ngân hà nằm ngoài tầm với của Đế Chế Ngân Hà. Rốt cuộc điều này rồi cũng sẽ được chấn chỉnh."
 EMPEROR_TO_SUBJECT_NEUTRAL_GREETING_01:0 "Sự phục tùng của các khanh sẽ được tưởng thưởng, hỡi người [From.GetSpeciesNamePlural]. Tất cả chúng ta đều chung một thuyền."
 EMPEROR_TO_SUBJECT_NEUTRAL_GREETING_02:0 "Thần dân Đế Chế luôn luôn được chào đón tại Triều Đình của [Root.GetRulerTitle]. Chúng ta có thể giúp gì cho các khanh?"
 EMPEROR_TO_SUBJECT_NEUTRAL_GREETING_03:1 "[From.GetName] là một phần nhỏ bé nhưng thiết yếu của Đế Chế Ngân Hà. Hãy yên tâm rằng [Root.GetRulerTitle] không hề lãng quên các khanh."
 EMPEROR_HOSTILE_GREETING_01:0 "Chỉ có kẻ ngu mới chuốc lấy sự thù ghét của người cai trị ngân hà."
 EMPEROR_HOSTILE_GREETING_02:0 "Sự xấc xược liên miên của các ngươi trước mặt [Root.GetRulerTitle] sẽ không được dung thứ lâu hơn nữa đâu."
 EMPEROR_HOSTILE_GREETING_03:0 "Hãy quỳ xuống trước [Root.GetRulerTitle], đồ vô lại!"
 EMPEROR_HOSTILE_GREETING_04:0 "Ngươi DÁM chống đối [Root.GetRulerTitle] sao? Thật ngạo mạn tột cùng! "
 EMPEROR_HOSTILE_GREETING_05:0 "Ngươi có nhận thức được mình đang nói chuyện với ai không đấy?"
 EMPEROR_HOSTILE_GREETING_06:0 "Chính phủ thảm hại của các ngươi liệu có thể nói được lời gì khiến cho [Root.GetRulerTitle] bận tâm cơ chứ?"
 EMPEROR_TO_OUTSIDER_HOSTILE_GREETING_01:1 "Tương lai của ngân hà này sẽ được định hình bởi sức mạnh hợp nhất của Đế Chế Ngân Hà, chứ không phải bởi những kẻ đáng thương như [From.GetName]."
 EMPEROR_TO_OUTSIDER_HOSTILE_GREETING_02:1 "Chỉ có sự nhỏ nhoi đến tầm thường của các ngươi mới cứu các ngươi khỏi sự diệt vong hoàn toàn dưới bàn tay Đế Chế Ngân Hà... cho tới lúc này."
 EMPEROR_TO_OUTSIDER_HOSTILE_GREETING_03:0 "Các ngươi đã xúc phạm [Root.GetRulerTitle]. Rồi sẽ có hậu quả đấy."
 EMPEROR_TO_SUBJECT_HOSTILE_GREETING_01:0 "Những kẻ mưu toan chống lại [Root.GetRulerTitle] sẽ bị tận diệt như loài sâu bọ."
 EMPEROR_TO_SUBJECT_HOSTILE_GREETING_02:1 "Những kẻ phản nghịch sẽ bị trừng trị thẳng tay trong Đế Chế Ngân Hà. Hãy nhớ lấy điều đó, hỡi người [From.GetSpeciesNamePlural]."
 EMPEROR_TO_SUBJECT_HOSTILE_GREETING_03:1 "Sự kích động bạo loạn và bất trung là những hiểm họa nghiêm trọng tới sự ổn định của Đế Chế, và sẽ bị trừng phạt thích đáng."
 EMPEROR_FRIENDLY_GREETING_01:0 "Các khanh đã chiếm được ân huệ của [Root.GetRulerTitle], hỡi người [From.GetSpeciesNamePlural]."
 EMPEROR_FRIENDLY_GREETING_02:0 "Thật vui mừng khi được thấy những bằng hữu của [Root.GetRulerTitle] tại Triều Đình Đế Chế."
 EMPEROR_FRIENDLY_GREETING_03:0 "[Root.GetRulerTitle] luôn sẵn sàng dành thời gian tiếp đón các đại diện của [From.GetName]. Chúng ta có thể giúp gì cho các bạn, những người bạn tốt?"
 EMPEROR_FRIENDLY_GREETING_04:0 "[Root.GetRulerTitle] luôn trân trọng sự thẳng thắn và chân thành của các bạn, hỡi người [From.GetSpeciesNamePlural]."
 EMPEROR_FRIENDLY_GREETING_05:0 "Người [From.GetSpeciesNamePlural] luôn luôn được hoan nghênh tại Triều Đình Đế Chế."
 EMPEROR_FRIENDLY_GREETING_06:1 "Sự hiện diện của các bạn là một giải tỏa đáng mừng khỏi vô số công việc triều chính bộn bề cần thiết để cai trị Đế Chế Ngân Hà, hỡi người [From.GetSpeciesNamePlural]. Hôm nay các bạn thế nào?"
 EMPEROR_TO_OUTSIDER_FRIENDLY_GREETING_01:1 "Các thành viên cấu thành Đế Chế Ngân Hà có thể học hỏi được nhiều điều từ [From.GetName]. Có lẽ một ngày nào đó các bạn sẽ cân nhắc gia nhập cùng chúng ta."
 EMPEROR_TO_OUTSIDER_FRIENDLY_GREETING_02:1 "Các bạn thực sự là những người bạn chân chính của Đế Chế Ngân Hà, hỡi người [From.GetSpeciesNamePlural]."
 EMPEROR_TO_OUTSIDER_FRIENDLY_GREETING_03:0 "Dù thật tiếc là các bạn không phải thần dân Đế Chế, [Root.GetRulerTitle] luôn dành trọn sự khâm phục và kính trọng cho [From.GetName] vĩ đại."
 EMPEROR_TO_SUBJECT_FRIENDLY_GREETING_01:1 "[From.GetName] là một trong những cột trụ của Đế Chế Ngân Hà. Thiếu vắng các khanh, mọi sự rất có thể sẽ sụp đổ."
 EMPEROR_TO_SUBJECT_FRIENDLY_GREETING_02:1 "Người [From.GetSpeciesNamePlural] là những thần dân Đế Chế mẫu mực. Các khanh thực sự đang nêu gương sáng cho toàn thể Đế Chế."
 EMPEROR_TO_SUBJECT_FRIENDLY_GREETING_03:1 "Với sự trợ giúp của các khanh, Đế Chế Ngân Hà sẽ thống nhất ngân hà và biến nơi đây thành nơi tốt đẹp hơn cho muôn loài có trí tuệ."
 SUBJECT_TO_EMPEROR_NEUTRAL_GREETING_01:0 "Muôn tâu Hoàng Đế Bệ Hạ. Có điều chi chúng thần có thể phụng sự Bệ Hạ không?"
 SUBJECT_TO_EMPEROR_NEUTRAL_GREETING_02:1 "Chúng thần, dĩ nhiên rồi, là những thần dân trung kiên và tận tụy của Đế Chế."
 SUBJECT_TO_EMPEROR_NEUTRAL_GREETING_03:0 "Hôm nay chúng thần có thể phụng sự [From.GetRulerTitle] như thế nào?"
 SUBJECT_TO_EMPEROR_HOSTILE_GREETING_01:0 "Điều gì đưa ngài tới đây thế hả, \"Bệ hạ\"?"
 SUBJECT_TO_EMPEROR_HOSTILE_GREETING_02:0 "Đây có phải là lúc nghi lễ bắt ta phải cúi đầu trước [From.GetRulerTitle] không nhỉ? Nếu vậy, ta rất vui lòng làm ngài thất vọng rồi."
 SUBJECT_TO_EMPEROR_HOSTILE_GREETING_03:1 "Đế Chế Ngân Hà sẽ đi vào lịch sử như một thời kỳ đen tối đối với cả ngân hà."
 SUBJECT_TO_EMPEROR_FRIENDLY_GREETING_01:0 "Muôn tâu Hoàng Đế Bệ Hạ, đây quả thực là một vinh dự tột cùng."
 SUBJECT_TO_EMPEROR_FRIENDLY_GREETING_02:0 "Hoàng Đế Bệ Hạ có điều chi sai bảo?"
 SUBJECT_TO_EMPEROR_FRIENDLY_GREETING_03:1 "Chúng thần sẽ tiêu diệt tất cả những kẻ chống đối Đế Chế nhân danh [From.GetRulerTitle]!"
 OUTSIDER_TO_EMPEROR_NEUTRAL_GREETING_01:0 "[From.GetRulerTitle]. Thật không ngờ tới."
 OUTSIDER_TO_EMPEROR_NEUTRAL_GREETING_02:1 "Chúng tôi mong muốn duy trì quan hệ thân thiện với Đế Chế Ngân Hà."
 OUTSIDER_TO_EMPEROR_NEUTRAL_GREETING_03:1 "Chúng tôi không hề có ý định chuốc lấy sự thù địch từ phía Đế Chế."
 OUTSIDER_TO_EMPEROR_HOSTILE_GREETING_01:0 "Sự ngạo mạn khi tự xưng là người cai trị toàn bộ ngân hà... thật khiến người ta kinh ngạc."
 OUTSIDER_TO_EMPEROR_HOSTILE_GREETING_02:1 "Liệu Đế Chế sẽ tự sụp đổ từ bên trong, hay sẽ có kẻ từ bên ngoài giáng một đòn chí mạng chấm dứt sự bạo tàn của nó đối với ngân hà? Chúng ta hãy chờ xem."
 OUTSIDER_TO_EMPEROR_HOSTILE_GREETING_03:1 "[Root.GetName] sẽ luôn tự do và độc lập khỏi bàn tay tha hóa nhơ bẩn của Đế Chế các ngươi."
 OUTSIDER_TO_EMPEROR_FRIENDLY_GREETING_01:1 "Đế Chế Ngân Hà đã đem lại sự ổn định cho ngân hà. Chúng tôi rất cảm kích trước công lao của các ngài."
 OUTSIDER_TO_EMPEROR_FRIENDLY_GREETING_02:0 "Chúng tôi từng không nghĩ rằng có thể duy trì một đế chế với quy mô ấn tượng nhường này. [From.GetRulerTitle] có rất nhiều điều để tự hào."
 OUTSIDER_TO_EMPEROR_FRIENDLY_GREETING_03:0 "Những thành tựu vĩ đại của [From.GetRulerTitle] đã nhận được sự kính trọng sâu sắc từ [Root.GetName]."
 CUSTODIAN_NEUTRAL_GREETING_01:0 "Chào mừng đến với bộ phận tiếp tân của Người Giám Hộ Thiên Hà. Xin hỏi quý vị cần gì?"
 CUSTODIAN_NEUTRAL_GREETING_02:0 "Cộng Đồng Thiên Hà là phương án tối ưu nhất của chúng ta trong nỗ lực kiến tạo một thiên hà tốt đẹp hơn."
 CUSTODIAN_NEUTRAL_GREETING_03:0 "Chúng tôi phụng mệnh Thượng Viện Thiên Hà và Cộng đồng, hết lòng phục vụ vì các quốc gia."
 CUSTODIAN_NEUTRAL_GREETING_04:0 "Trách nhiệm quản lý là một nhiệm vụ vô cùng thiêng liêng và trang trọng. Chúng tôi tuyệt đối không coi nhẹ sứ mệnh như vậy."
 CUSTODIAN_NEUTRAL_GREETING_05:0 "Việc lèo lái Cộng đồng đi theo một hướng có lợi hơn cho toàn thiên hà, đó chính là trách nhiệm cốt lõi của chúng tôi."
 CUSTODIAN_NEUTRAL_GREETING_06:0 "Quá trình ra quyết định của Cộng đồng và Thượng Viện Thiên Hà, đôi khi, lại bị trì trệ bởi... một vài luồng ý kiến trái chiều. Với tư cách là Người Giám Hộ, chúng tôi hy vọng có thể thúc đẩy quá trình này diễn ra nhanh chóng hơn."
 CUSTODIAN_TO_OUTSIDER_NEUTRAL_GREETING_01:0 "Thẩm quyền và trách nhiệm của chúng tôi với tư cách là Người Giám Hộ Thiên Hà chỉ giới hạn trong phạm vi của Cộng đồng. [From.GetSpeciesNamePlural], thật đáng tiếc vì chúng tôi không thể hỗ trợ các vị."
 CUSTODIAN_TO_OUTSIDER_NEUTRAL_GREETING_02:0 "Chúng tôi mang trên vai trọng trách đối với toàn bộ các thành viên của Cộng Đồng Thiên Hà, nhưng thật đáng tiếc là điều đó lại không bao gồm [From.GetName]."
 CUSTODIAN_TO_OUTSIDER_NEUTRAL_GREETING_03:0 "[From.GetSpeciesNamePlural], việc trở thành một thành viên của Cộng Đồng Thiên Hà nên được đặt lên hàng đầu trong các ưu tiên của các vị."
 CUSTODIAN_TO_COMMUNITY_MEMBER_NEUTRAL_GREETING_01:0 "Là Người Giám Hộ, chúng tôi phải luôn đặt lợi ích của toàn thể Cộng đồng lên hàng đầu. Và điều đó tất nhiên cũng bao gồm cả [From.GetName]."
 CUSTODIAN_TO_COMMUNITY_MEMBER_NEUTRAL_GREETING_02:0 "Chúng tôi khao khát có thể cải thiện Cộng Đồng Thiên Hà, nhưng để làm được điều đó thì không thể thiếu các vị được, [From.GetSpeciesNamePlural]. Quyền hạn của Người Giám Hộ chúng tôi chỉ có thể giải quyết được một phần nào đó thôi."
 CUSTODIAN_TO_COMMUNITY_MEMBER_NEUTRAL_GREETING_03:0 "Nếu chúng ta, với tư cách là một thiên hà hợp nhất, muốn đạt được những thành tựu vĩ đại, thì những tiếng ồn ào không đáng có trong nội bộ Cộng Đồng Thiên Hà phải được chấm dứt."
 CUSTODIAN_HOSTILE_GREETING_01:0 "Nếu có thể, chúng tôi thực sự rất muốn ký duyệt một đạo luật tuyên bố [From.GetName] là kẻ ngoài vòng pháp luật vĩnh viễn. Đáng tiếc là điều này lại nằm ngoài thẩm quyền của chúng tôi... Hiện tại thì đành chịu vậy."
 CUSTODIAN_HOSTILE_GREETING_02:0 "Chúng tôi sẽ phơi bày sự tà ác của [From.GetName] cho toàn thể Cộng Đồng Thiên Hà cùng chứng kiến."
 CUSTODIAN_HOSTILE_GREETING_03:0 "Kẻ thù của [Root.GetName], cũng chính là kẻ thù của Cộng Đồng Thiên Hà."
 CUSTODIAN_HOSTILE_GREETING_04:0 "Vị trí Người Giám Hộ Cộng đồng chỉ mới là bước dạo đầu trong kế hoạch vĩ đại của chúng tôi. Chẳng bao lâu nữa, các ngươi sẽ được tận mắt chứng kiến sức mạnh thực sự của chúng tôi."
 CUSTODIAN_HOSTILE_GREETING_05:0 "Đừng hòng qua mặt chúng tôi hay Cộng Đồng Thiên Hà. [From.GetName] không hề nhận được sự tin tưởng."
 CUSTODIAN_HOSTILE_GREETING_06:0 "Làm ơn vào thẳng vấn đề đi. Chúng ta không thể để người khác bắt gặp đang lén lút trò chuyện với nhau thế này được... Là Người Giám Hộ Thiên Hà, chúng tôi cần phải tuân thủ một số quy chuẩn nhất định."
 CUSTODIAN_TO_OUTSIDER_HOSTILE_GREETING_01:0 "Các ngươi chính là kẻ thù của Cộng Đồng Thiên Hà, [From.GetSpeciesNamePlural]."
 CUSTODIAN_TO_OUTSIDER_HOSTILE_GREETING_02:0 "Với tư cách là Người Giám Hộ của Cộng Đồng Thiên Hà, nhân cơ hội này, chúng tôi chính thức bày tỏ sự khinh bỉ sâu sắc đối với một quốc gia nhỏ bé và hèn mọn như các ngươi."
 CUSTODIAN_TO_OUTSIDER_HOSTILE_GREETING_03:0 "Nếu các ngươi biết thân biết phận, thì tốt nhất đừng có lởn vởn quanh những khu vực do Cộng Đồng Thiên Hà kiểm soát."
 CUSTODIAN_TO_COMMUNITY_MEMBER_HOSTILE_GREETING_01:0 "Chúng tôi sẽ áp dụng mọi biện pháp, huy động mọi nguồn lực có thể, để ngăn chặn sự lây lan của những luồng tư tưởng độc hại từ [From.GetName] trong nội bộ Cộng Đồng Thiên Hà."
 CUSTODIAN_TO_COMMUNITY_MEMBER_HOSTILE_GREETING_02:0 "Là Người Giám Hộ, chúng tôi đã thề sẽ đặt dấu chấm hết cho những âm mưu xảo quyệt của [From.GetSpeciesName] trong nội bộ Cộng đồng."
 CUSTODIAN_TO_COMMUNITY_MEMBER_HOSTILE_GREETING_03:0 "Có lẽ các ngươi cần phải xem xét lại tư cách thành viên của mình trong Cộng Đồng Thiên Hà đấy, [From.GetSpeciesNamePlural]. Là một quốc gia không biết điều, các ngươi đang gây ra những ảnh hưởng tiêu cực đến các quốc gia thành viên khác."
 CUSTODIAN_FRIENDLY_GREETING_01:0 "[From.GetName] chính là một người bạn tốt của Cộng Đồng Thiên Hà!"
 CUSTODIAN_FRIENDLY_GREETING_02:0 "Toàn thể Cộng Đồng Thiên Hà xin gửi lời chào trân trọng nhất đến các vị, [From.GetSpeciesNamePlural]!"
 CUSTODIAN_FRIENDLY_GREETING_03:0 "Chúng tôi đã chiến đấu đến cùng để biến thiên hà này trở thành một vùng đất hứa tuyệt vời hơn cho [From.GetName]. Các ngươi hoàn toàn xứng đáng với những điều tốt đẹp này."
 CUSTODIAN_FRIENDLY_GREETING_04:0 "Trách nhiệm của Người Giám Hộ Thiên Hà tuy khiến chúng tôi bận rộn vô cùng, nhưng chúng tôi luôn sẵn lòng dành thời gian cho những người bạn đến từ [From.GetName]."
 CUSTODIAN_FRIENDLY_GREETING_05:0 "Chúng tôi chỉ đơn thuần là những người đầy tớ khiêm nhường nhất của Cộng Đồng Thiên Hà."
 CUSTODIAN_FRIENDLY_GREETING_06:0 "Cộng Đồng Thiên Hà có thể giúp được gì cho các vị đây, [From.GetSpeciesNamePlural]?"
 CUSTODIAN_TO_OUTSIDER_FRIENDLY_GREETING_01:0 "Giá như các vị có thể tham gia vào Cộng Đồng Thiên Hà thì tuyệt biết mấy... [From.GetName] chắc chắn sẽ là một tấm gương sáng cho các quốc gia thành viên khác noi theo."
 CUSTODIAN_TO_OUTSIDER_FRIENDLY_GREETING_02:0 "Nếu thiếu vắng [From.GetName], Cộng Đồng Thiên Hà sẽ không bao giờ được trọn vẹn."
 CUSTODIAN_TO_OUTSIDER_FRIENDLY_GREETING_03:0 "Tuy các vị chưa chính thức gia nhập, nhưng chúng tôi vẫn sẽ cố gắng hết sức để thay mặt [From.GetName] quán xuyến và lo liệu mọi việc trong nội bộ Cộng Đồng Thiên Hà."
 CUSTODIAN_TO_COMMUNITY_MEMBER_FRIENDLY_GREETING_01:0 "Việc cải tổ Cộng đồng trở thành một tổ chức ưu việt hơn là cả một quá trình dài hạn, nhưng nếu có sự chung tay góp sức của [From.GetSpeciesName], thì điều đó hoàn toàn có thể trở thành hiện thực."
 CUSTODIAN_TO_COMMUNITY_MEMBER_FRIENDLY_GREETING_02:0 "Chúng tôi sẽ vận dụng toàn bộ quyền lực hiện có của mình để đảm bảo rằng [From.GetName] sẽ luôn có một chỗ đứng vững chắc và một tiếng nói có trọng lượng trong Cộng Đồng Thiên Hà."
 CUSTODIAN_TO_COMMUNITY_MEMBER_FRIENDLY_GREETING_03:0 "Nếu mọi thành viên của Cộng Đồng Thiên Hà đều thể hiện sự thân thiện và nhiệt tình hỗ trợ như [From.GetName], thì có lẽ vai trò của Người Giám Hộ cũng chẳng còn cần thiết nữa."
 MEMBER_TO_CUSTODIAN_NEUTRAL_GREETING_01:0 "Thưa Người Giám Hộ, công việc gắn kết các thành viên của Cộng Đồng Thiên Hà tiến triển đến đâu rồi? Quả thực là một nhiệm vụ chẳng hề dễ dàng chút nào."
 MEMBER_TO_CUSTODIAN_NEUTRAL_GREETING_02:0 "Thật không thể ngờ tới. Chẳng phải Người Giám Hộ Thiên Hà đáng lẽ phải lo toan những vấn đề trọng đại hơn sao?"
 MEMBER_TO_CUSTODIAN_NEUTRAL_GREETING_03:0 "Cho đến tận bây giờ, chúng tôi vẫn còn hoài nghi về tính cấp thiết của vị trí Người Giám Hộ, nhưng biết đâu đấy, các vị lại có thể chứng minh rằng suy nghĩ của chúng tôi là sai lầm."
 MEMBER_TO_CUSTODIAN_HOSTILE_GREETING_01:0 "Hãy tranh thủ tận hưởng cái địa vị cao vời vợi đó khi còn có thể đi. Chuỗi ngày tốt đẹp đó chẳng còn kéo dài được bao lâu nữa đâu."
 MEMBER_TO_CUSTODIAN_HOSTILE_GREETING_02:0 "Đến tận lúc này, chúng tôi vẫn đang tiếp tục điều tra xem bằng những mánh khóe nào mà các ngươi có thể khiến Thượng viện trao cho mình quyền lực của Người Giám Hộ."
 MEMBER_TO_CUSTODIAN_HOSTILE_GREETING_03:0 "Kể từ khi các ngươi nhậm chức Người Giám Hộ, một bóng đen u ám đã bao trùm lấy Cộng Đồng Thiên Hà. Chúng tôi vô cùng lo sợ rằng Cộng đồng sẽ dần bị đục khoét và biến dạng thành một thứ gì đó tồi tệ không thể diễn tả."
 MEMBER_TO_CUSTODIAN_FRIENDLY_GREETING_01:0 "Sự hiện diện của ngài khiến nơi hẹp hòi này như bừng sáng. Thưa Người Giám Hộ, chúng tôi có thể giúp gì cho ngài không?"
 MEMBER_TO_CUSTODIAN_FRIENDLY_GREETING_02:0 "Thưa Người Giám Hộ, chúng tôi nên hành động ra sao để có thể cống hiến một cách hiệu quả nhất cho Cộng Đồng Thiên Hà?"
 MEMBER_TO_CUSTODIAN_FRIENDLY_GREETING_03:0 "Thưa Người Giám Hộ, việc ngài đảm nhận trọng trách này quả thực là một phước lành to lớn đối với Cộng Đồng Thiên Hà."
 OUTSIDER_TO_CUSTODIAN_NEUTRAL_GREETING_01:0 "Có vẻ như Cộng Đồng Thiên Hà đã tìm được một \"thủ lĩnh\". Thật thú vị."
 OUTSIDER_TO_CUSTODIAN_NEUTRAL_GREETING_02:0 "Việc chỉ định Người Giám Hộ chưa đủ sức thuyết phục chúng tôi rằng gia nhập Cộng Đồng Thiên Hà là một quyết định sáng suốt, nhưng chúng tôi sẽ tiếp tục theo dõi sát sao tình hình."
 OUTSIDER_TO_CUSTODIAN_NEUTRAL_GREETING_03:0 "Vậy là các thành viên khác của Cộng Đồng Thiên Hà giờ đã trở thành chư hầu của Người Giám Hộ rồi sao? Không phải vậy ư? Thật lòng xin lỗi, nhưng chúng tôi vẫn cảm thấy vô cùng bối rối trước bản chất của sự sắp xếp này."
 OUTSIDER_TO_CUSTODIAN_HOSTILE_GREETING_01:0 "Từ trước đến nay, Cộng Đồng Thiên Hà vốn dĩ đã là một tổ chức thối nát, giờ đây đám ngu ngốc trong Thượng viện lại còn bầu các ngươi làm Người Giám Hộ, đúng là hết thuốc chữa."
 OUTSIDER_TO_CUSTODIAN_HOSTILE_GREETING_02:0 "Nếu các thành viên của Cộng Đồng Thiên Hà lại đi trao quyền quản lý cho [From.GetName], thì xem ra bọn họ còn ngu ngốc hơn những gì chúng ta tưởng tượng rất nhiều."
 OUTSIDER_TO_CUSTODIAN_HOSTILE_GREETING_03:0 "Đến cả nội bộ [From.GetName] mà [From.GetSpeciesNamePlural] các ngươi còn chẳng quản lý nổi, vậy mà giờ lại còn mơ mộng hão huyền đòi lãnh đạo toàn bộ Cộng Đồng Thiên Hà sao? Đúng là nực cười!"
 OUTSIDER_TO_CUSTODIAN_FRIENDLY_GREETING_01:0 "Nghe tin các vị được xướng tên trở thành Người Giám Hộ của Cộng Đồng Thiên Hà, xem ra Thượng Viện Thiên Hà rốt cuộc cũng làm được một việc đúng đắn. Có lẽ chúng tôi cũng nên bắt đầu suy nghĩ nghiêm túc về việc gia nhập tổ chức này."
 OUTSIDER_TO_CUSTODIAN_FRIENDLY_GREETING_02:0 "[From.GetSpeciesNamePlural], chỉ khi các vị nắm giữ cương vị Người Giám Hộ, Cộng Đồng Thiên Hà mới có hy vọng được đổi mới."
 OUTSIDER_TO_CUSTODIAN_FRIENDLY_GREETING_03:0 "Người Giám Hộ Thiên Hà, phải không? [From.GetSpeciesNamePlural], chúng tôi rất vui mừng khi thấy các vị thăng tiến nhanh chóng như vậy."
 resolution_declare_crisis:0 "Chỉ định Thảm họa"
 resolution_declare_crisis_desc:0 "Đế chế này là một mối đe dọa không thể chối cãi đối với tương lai của toàn bộ thiên hà. Trước khi mọi thứ trở nên quá muộn màng, Cộng Đồng Thiên Hà phải ngay lập tức hành động để ngăn chặn và tiêu diệt chúng tận gốc rễ."
 resolution_declare_crisis_empire:0 "$resolution_declare_crisis$"
 resolution_declare_crisis_empire_desc:1 "Đế chế này là một mối đe dọa không thể chối cãi đối với tương lai của toàn bộ thiên hà. Trước khi mọi thứ trở nên quá muộn màng, Đế Chế Thiên Hà phải ngay lập tức hành động để ngăn chặn và tiêu diệt chúng tận gốc rễ."
 crisis.4100.name:0 "Tuyên cáo Khủng hoảng Ngân hà"
 crisis.4100.intro:0 "Thượng Viện Thiên Hà đã thông qua một nghị án, chính thức tuyên bố §H[new_crisis.GetName]§! là kẻ thù chung của mọi sinh vật có trí tuệ, là một cuộc khủng hoảng đe dọa đến sự tồn vong của toàn thiên hà. Kết quả là, kể từ hôm nay, [new_crisis.GetName] đã chính thức đối đầu với toàn thể Cộng Đồng Thiên Hà."
 crisis.4100.desc.a:0 "$crisis.4100.intro$\n\n$crisis.4100.1$"
 crisis.4100.desc.b:0 "$crisis.4100.intro$\n\n$crisis.4100.2$"
 crisis.4100.1:0 "Với tư cách là Người Giám Hộ Thiên Hà, [custodian.GetName] kêu gọi tất cả các quốc gia thành viên của Cộng đồng tổng động viên hạm đội, và phát động một cuộc tổng tiến công nhằm vào lãnh thổ của [new_crisis.GetSpeciesName]: \"Cho đến khi mối đe dọa mang tên [new_crisis.GetSpeciesName] bị nhổ cỏ tận gốc, vĩnh viễn không còn cơ hội ngóc đầu dậy, thì thiên hà này mới có thể đón nhận một nền hòa bình thực sự.\""
 crisis.4100.2:0 "Các đại diện của Thượng viện tha thiết kêu gọi tất cả các quốc gia thành viên của Cộng đồng tổng động viên hạm đội, và phát động một cuộc tổng tiến công nhằm vào lãnh thổ của [new_crisis.GetSpeciesName], họ đã công khai tuyên bố rằng: \"Cho đến khi mối đe dọa mang tên [new_crisis.GetSpeciesName] bị nhổ cỏ tận gốc, vĩnh viễn không còn cơ hội ngóc đầu dậy, thì thiên hà này mới có thể đón nhận một nền hòa bình thực sự.\""
 crisis.4100.a:0 "Liệu chúng ta có thể ngăn chặn được sự tàn phá của chúng không?"
 crisis.4101.desc:1 "Thượng viện Đế chế đã thông qua một nghị án, chính thức tuyên bố §H[new_crisis.GetName]§! là kẻ thù chung của mọi sinh vật có trí tuệ, là một cuộc khủng hoảng đe dọa đến sự tồn vong của toàn thiên hà. Kết quả là, kể từ hôm nay, [new_crisis.GetName] đã chính thức đối đầu với toàn thể Đế Chế Thiên Hà.\n\nTrong một bài phát biểu công khai được phát sóng từ [gal_emperor.Capital.GetName], [gal_emperor.GetRulerTitle] đã kêu gọi tất cả các quốc gia thành viên của Đế chế tổng động viên hạm đội, và phát động một cuộc tổng tiến công nhằm vào lãnh thổ của [new_crisis.GetSpeciesName]: \"Cho đến khi mối đe dọa mang tên [new_crisis.GetSpeciesName] bị nhổ cỏ tận gốc, vĩnh viễn không còn cơ hội ngóc đầu dậy, thì thiên hà này mới có thể đón nhận một nền hòa bình thực sự.\""
 crisis.4105.name:0 "Cộng đồng chỉ định chúng ta là \"Khủng hoảng Ngân hà\""
 crisis.4105.intro:0 "Bởi vì đã nhận thức rõ sự đe dọa từ những gì chúng ta đang thể hiện, lũ thảm hại của Cộng Đồng Thiên Hà đã thông qua một nghị án, lên tiếng lên án các hành động của chúng ta, và tuyên bố chúng ta chính là §Y\"Khủng hoảng bao trùm toàn thiên hà\"§!. Các thành viên của Cộng Đồng Thiên Hà đã phô diễn một sự đoàn kết hiếm thấy, tập hợp toàn bộ sức mạnh và chính thức tuyên chiến với chúng ta."
 crisis.4105.desc.a:0 "$crisis.4105.intro$\n\n$crisis.4105.1$"
 crisis.4105.desc.b:0 "$crisis.4105.intro$\n\n$crisis.4105.2$"
 crisis.4105.1:0 "Dưới sự lãnh đạo của Người Giám Hộ Thiên Hà, các hạm đội của chúng đã được tập kết lại, và bắt đầu cuộc tấn công vào lãnh thổ của chúng ta. Cuộc chiến khốc liệt càn quét toàn bộ thiên hà cuối cùng cũng đã nổ phát súng đầu tiên."
 crisis.4105.2:0 "Hạm đội của chúng đã được tập kết lại, và bắt đầu cuộc tấn công vào lãnh thổ của chúng ta. Cuộc chiến khốc liệt càn quét toàn bộ thiên hà cuối cùng cũng đã nổ phát súng đầu tiên."
 crisis.4105.a:0 "Vinh quang vô tận!"
 crisis.4105.b:0 "Phát điên rồi, chết tiệt thật!"
 crisis.4105.desc.c:0 "Lũ ngốc nghếch mục nát bên trong Cộng Đồng Thiên Hà đã thông qua một nghị án, gán cho chúng ta cái danh \"Thảm họa\", gọi chúng ta là \"Kẻ thù của toàn bộ sinh vật có trí tuệ\". Dựa trên những đề xuất nực cười và vô lý này, [Root.GetName] và toàn bộ Cộng Đồng Thiên Hà hiện đã bước vào tình trạng chiến tranh.\n\nCuộc chiến này sẽ dai dẳng không hồi kết, trừ khi chúng ta hoặc Cộng đồng bị nghiền nát hoàn toàn thành tro bụi... hoặc là Cộng Đồng Thiên Hà tự mình bãi bỏ cái nghị án này."
 crisis.4106.name:1 "Đế chế chỉ định chúng ta là \"Khủng hoảng Ngân hà\""
 crisis.4106.desc.a:1 "Bởi vì đã nhận thức rõ sự đe dọa từ những gì chúng ta đang thể hiện, lũ thảm hại của Đế Chế Thiên Hà đã thông qua một nghị án, lên tiếng lên án các hành động của chúng ta, và tuyên bố chúng ta chính là §Y\"Khủng hoảng bao trùm toàn thiên hà\"§!. Các thành viên của Đế Chế Thiên Hà đã phô diễn một sự đoàn kết hiếm thấy, tập hợp toàn bộ sức mạnh và chính thức tuyên chiến với chúng ta.\n\nDưới sự dẫn dắt của [gal_emperor.GetRulerTitle], các hạm đội của chúng đã được tập kết, và bắt đầu cuộc tiến công vào lãnh thổ của chúng ta. Cuộc chiến tranh tàn khốc bao trùm toàn bộ thiên hà đã chính thức khai màn."
 crisis.4106.desc.b:1 "[gal_emperor.GetRulerTitle] và đám bợ đỡ mục nát trong Thượng viện Đế chế đã thông qua một nghị án, gán cho chúng ta cái danh \"Thảm họa\", gọi chúng ta là \"Kẻ thù của toàn bộ sinh vật có trí tuệ\". Dựa trên những đề xuất nực cười và vô lý này, [Root.GetName] và toàn bộ Đế Chế Thiên Hà hiện đã bước vào tình trạng chiến tranh.\n\nCuộc chiến này sẽ dai dẳng không hồi kết, trừ khi chúng ta hoặc Cộng đồng bị nghiền nát hoàn toàn thành tro bụi... hoặc là chúng tự mình bãi bỏ cái nghị án này."
 gal_custodian:0 "Người Giám Hộ Thiên Hà"
 gal_custodian_desc:0 "Với tư cách là Người Giám Hộ của Cộng Đồng Thiên Hà, tầm ảnh hưởng của chúng ta trong thiên hà đã được mở rộng đáng kể."
 war_goal_wg_declared_crisis:0 "Chiến tranh Thảm họa"
 war_goal_wg_declared_crisis_desc:0 "Một cuộc chiến tranh toàn diện nổ ra giữa Đế chế bị gán mác Thảm họa và Cộng Đồng Thiên Hà.\n\nSẽ không bao giờ có một nền hòa bình nào được thiết lập, trừ khi một trong hai phe tham chiến bị tiêu diệt hoàn toàn, hoặc Cộng Đồng Thiên Hà thông qua một nghị án nhằm chấm dứt tình trạng thù địch này."
 resolution_category_declare_crisis:0 "Chỉ định Thảm họa"
 resolution_repeal_crisis:0 "Bãi bỏ Chỉ định Thảm họa"
 resolution_repeal_crisis_desc:0 "Mọi việc đến đây là quá đủ rồi. Đế chế mục tiêu giờ đây không còn bị coi là mối đe dọa đối với thiên hà nữa, và toàn bộ các quốc gia thành viên của Cộng Đồng Thiên Hà phải lập tức chấm dứt mọi hành động thù địch nhằm vào họ."
 resolution_repeal_crisis_empire:0 "$resolution_repeal_crisis$"
 resolution_repeal_crisis_empire_desc:1 "Cái gọi là Thảm họa này không còn là mối đe dọa đối với đế chế nữa. Chúng không còn xứng đáng để chúng ta bận tâm thêm."
 crisis.4110.name:0 "Chỉ định Thảm họa đã bị bãi bỏ"
 crisis.4110.desc:0 "Nghị án gán mác \"Khủng hoảng Ngân hà\" cho §H[former_crisis.GetName]§! giờ đây đã bị Thượng Viện Thiên Hà bãi bỏ. Theo đó, mọi chiến dịch quân sự do các quốc gia thành viên Cộng Đồng Thiên Hà phát động nhằm vào [former_crisis.GetSpeciesNamePlural] đều lập tức bị đình chỉ. Giờ đây, hòa bình đã trở lại với góc nhỏ này của thiên hà."
 crisis.4110.a:0 "Nhưng nền hòa bình này liệu sẽ kéo dài được bao lâu đây?"
 crisis.4111.desc.b:0 "$crisis.4111.intro$\n\n$crisis.4111.nasty$"
 crisis.4111.intro:0 "Thượng Viện Thiên Hà đã bãi bỏ nghị án tuyên bố chúng ta là \"Khủng hoảng Ngân hà\", và tất cả các quốc gia thành viên của Cộng đồng đều đã nhận được lệnh đình chiến tại chỗ. Các hành động quân sự nhằm vào chúng ta đã tạm thời bị ngưng lại... ít nhất là trong thời điểm hiện tại."
 crisis.4111.nasty:0 "Nếu chúng ta vẫn muốn tiếp tục giao tranh, chẳng có gì có thể cản bước chúng ta tuyên chiến với từng tên ngốc này, rồi lần lượt hạ gục từng kẻ một..."
 crisis.4111.a:0 "Cuối cùng thì lý trí cũng đã làm chủ được bộ não của bọn chúng."
 crisis.4111.b:0 "Thấy sợ rồi phải không, sợ rồi chứ gì!"
 crisis.4112.desc:0 "Nghị án gán mác \"Khủng hoảng Ngân hà\" cho §H[former_crisis.GetName]§! giờ đây đã bị Thượng viện Đế chế bãi bỏ. Theo đó, [gal_emperor.GetRulerTitle] đã chính thức ban lệnh chấm dứt mọi chiến dịch quân sự của đế chế nhằm vào [former_crisis.GetSpeciesNamePlural]. Giờ đây, hòa bình đã trở lại với góc nhỏ này của thiên hà."
 crisis.4113.desc:1 "Đế Chế Thiên Hà đã bãi bỏ nghị án tuyên bố chúng ta là \"Khủng hoảng Ngân hà\", và toàn bộ quân đội đế chế đều đã nhận được lệnh đình chiến tại chỗ. [gal_emperor.GetRulerTitle] đã hạ lệnh chấm dứt mọi hành động thù địch nhằm vào chúng ta... ít nhất là trong thời điểm hiện tại."
 community_declared_crisis_failtext:0 "§RChúng ta đã bị gán mác Thảm họa, nên không thể tham gia.§!"
 community_homicidal_failtext:0 "§RChúng ta bị Cộng đồng từ chối vì bản tính \"tàn bạo, thích săn mồi\". Thật ngu muội.§!"
 community_default_failtext:0 "§RPhải là một đế chế thông thường.§!"
 resolution_declare_crisis_tooltip:0 "Toàn bộ các quốc gia thành viên của Cộng Đồng Thiên Hà sẽ phát động chiến tranh toàn diện nhằm vào đế chế mục tiêu, và cuộc chiến này chỉ có thể kết thúc khi một trong hai phe bị tiêu diệt hoàn toàn, hoặc khi nghị án bị bãi bỏ."
 resolution_declare_crisis_empire_tooltip:1 "Đế Chế Thiên Hà tuyên bố chiến tranh toàn diện với mục tiêu. Tình trạng thù địch sẽ chỉ kết thúc khi một bên bị tiêu diệt hoàn toàn, hoặc khi nghị án bị bãi bỏ."
 first_contact.5.militarist.desc:0 "Trong khi theo dõi tín hiệu của các tàu vũ trụ không xác định tại §H[This.System.GetName]§!, chúng tôi đã ra lệnh cho tất cả các đơn vị gần đó được đặt trong tình trạng báo động cao theo giao thức tiêu chuẩn. Bộ phận tình báo đang cố gắng sử dụng dữ liệu ít ỏi thu được để phân tích sự việc quái đản này, nhưng ít nhất chúng ta có thể cảm nhận được khả năng du hành siêu không gian của nó, còn việc nó có khả năng tấn công hay không thì vẫn chưa rõ. Có thể đây là cuộc tiếp xúc đầu tiên của chúng ta với một nền văn minh ngoài hành tinh mới, chúng ta nên thực hiện một số bước để giải mã thông tin liên lạc của họ."
 first_contact.5.pacifist.desc:0 "Chúng tôi vẫn chưa thể xác định được nguồn gốc của tàu vũ trụ bí ẩn được quan sát thấy ở §H[This.System.GetName]§!. Vì đây rất có thể là lần đầu tiên chúng ta tiếp xúc với một nền văn minh ngoài hành tinh chưa từng được biết đến, nên chúng ta phải tránh bất kỳ hành động nào có thể bị hiểu lầm là đe dọa hoặc khiêu khích. Nếu ngôn ngữ của họ được dịch ra, chúng ta có hy vọng thiết lập được mối quan hệ hòa bình với họ."
 first_contact.5.spiritualist.desc:0 "Chúng tôi vẫn đang thu thập dữ liệu về tàu vũ trụ của người ngoài hành tinh được cho là nằm trong hệ thống sao §H[This.System.GetName]§!. Rất có thể con tàu này là sứ giả của một nền văn minh ngoài hành tinh chưa từng được biết đến trước đây. Chúng ta phải xác định xem họ đã đi theo ân sủng của các linh hồn hay họ là đặc vụ của cái ác. Điều đầu tiên chúng ta cần làm là hiểu ngôn ngữ của họ và hệ thống tín ngưỡng của họ."
 first_contact.5.materialist.desc:0 "Các cuộc điều tra về các tàu không xác định được tìm thấy trong hệ thống §H[This.System.GetName]§! vẫn đang được tiến hành, nhưng thiếu thông tin thu thập được khiến chúng tôi không thể đưa ra các giả định chắc chắn về nguồn gốc của các tàu. Vì đây dường như là một nền văn minh ngoài hành tinh mà chúng ta chưa từng biết đến trước đây, chúng ta nên cố gắng hết sức để chặn thông tin liên lạc của họ để bắt đầu giải mã ngôn ngữ của họ."
 first_contact.5.xenophobe.desc:0 "Có một báo động trong hệ thống §H[This.System.GetName]§! nơi chúng tôi đã phát hiện ra một con tàu chắc chắn là người ngoài hành tinh đang tiến hành một số loại hoạt động bí mật. Ý định chính xác của con tàu vẫn chưa rõ ràng, nhưng nó dường như là đại diện của một tổ chức chính trị ngoài hành tinh lớn. Sẽ khôn ngoan hơn nếu trước tiên thu thập dữ liệu về những sinh vật này để chúng ta có thể xác định rõ hơn bản chất của mối đe dọa và mức độ ảnh hưởng của nó."
 first_contact.5.xenophile.desc:0 "Những cảnh tượng về một con tàu vô danh trong hệ thống sao §H[This.System.GetName]§! đã làm nảy sinh nhiều đồn đoán. Thiết kế của con tàu hoàn toàn xa lạ với chúng tôi, điều đó có nghĩa là chúng tôi rất có thể có cuộc tiếp xúc đầu tiên với một nền văn minh ngoài hành tinh hoàn toàn mới. Ngoài việc biết rằng con tàu có khả năng du hành siêu không gian, chúng ta không biết gì về những sáng tạo hấp dẫn này. Chúng ta nên dành nhiều nỗ lực hơn để nghiên cứu nó."
 first_contact.5.authoritarian.desc:0 "[This.Owner.GetRulerTitle] đã báo cáo về các tàu không xác định được tìm thấy trong hệ §H[This.System.GetName]§!. Thiết kế của nó không khớp với bất kỳ ghi chép nào trước đây của chúng ta, điều đó có nghĩa là chúng ta đang thực hiện cuộc tiếp xúc đầu tiên với một nền văn minh ngoài hành tinh. Với sự cho phép của [This.Owner.GetRulerTitle], chúng tôi có thể bắt đầu phân tích dữ liệu chúng tôi đã thu thập để giải mã ngôn ngữ của nó."
 first_contact.5.egalitarian.desc:0 "Công chúng được biết rằng một liên hệ đầu tiên tiềm năng đang được tiến hành tại §H[This.System.GetName]§!, nơi con tàu vô danh đã được phát hiện trước đó. Dữ liệu ban đầu thu được cho thấy con tàu có khả năng du hành siêu không gian và dường như đến từ một nền văn minh ngoài hành tinh chưa từng được biết đến đối với chúng ta. Đại diện của các bộ phận khác nhau của chính phủ đang được thông báo tóm tắt về sự phát triển trong khi ngôn ngữ đang được giải mã."
 first_contact.10.militarist.desc.proactive:0 "Hệ thống phòng thủ trong hệ thống §H[This.System.GetName]§! vẫn ở trong tình trạng báo động cao sau một cuộc xâm nhập gần đây của một con tàu vô danh. Bộ phận nghiên cứu vẫn đang phân tích lượng dữ liệu khốn khổ mà chúng ta có trên tàu và khả năng tấn công của nó vẫn chưa được biết. Vì đây có thể là lần tiếp xúc đầu tiên của chúng ta với một nền văn minh ngoài hành tinh hoàn toàn mới, chúng ta nên tiến hành giải mã thông tin liên lạc của họ."
 first_contact.10.militarist.desc.cautious:0 "$first_contact.10.militarist.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.militarist.desc.attack_allowed:0 "$first_contact.10.militarist.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.pacifist.desc.proactive:0 "Nguồn gốc của các du khách bí ẩn trong hệ thống §H[This.System.GetName]§! vẫn chưa được chúng tôi biết. Cho rằng đây có thể là lần đầu tiên tiếp xúc với một nền văn minh ngoài hành tinh mà chúng ta chưa biết, chúng ta phải tránh bất kỳ hành động nào có thể bị nhầm lẫn với các mối đe dọa hoặc khiêu khích. Sau khi ngôn ngữ của họ đã được dịch thành công, chúng tôi có thể thiết lập quan hệ ngoại giao hòa bình với họ."
 first_contact.10.pacifist.desc.cautious:0 "$first_contact.10.pacifist.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.pacifist.desc.attack_allowed:0 "$first_contact.10.pacifist.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.spiritualist.desc.proactive:0 "Tàu vũ trụ của người ngoài hành tinh băng qua hệ thống §H[This.System.GetName]§! hiện đang được điều tra. Nếu con tàu này thuộc về một sứ giả của một nền văn minh ngoài hành tinh mà trước đây chúng ta chưa từng biết đến, và thành thật mà nói có vẻ giống như nó, chúng ta phải xác định xem họ là những người theo sát ân sủng của tâm hồn hay hóa thân thành ác ma. Điều đầu tiên cần làm là hiểu ngôn ngữ của họ và biết bản chất đức tin của họ."
 first_contact.10.spiritualist.desc.cautious:0 "$first_contact.10.spiritualist.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.spiritualist.desc.attack_allowed:0 "$first_contact.10.spiritualist.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.materialist.desc.proactive:0 "Cuộc điều tra về con tàu vô danh đi qua hệ thống §H[This.System.GetName]§! của chúng tôi đang tiếp tục, nhưng chúng tôi đã không thu thập đủ dữ liệu để dự đoán nó đến từ đâu. Vì chúng ta dường như đang đối phó với đại diện của một nền văn minh ngoài hành tinh chưa được biết đến trước đây, chúng ta nên cố gắng hết sức để chặn liên lạc của nó và bắt đầu phân tích ngôn ngữ của nó."
 first_contact.10.materialist.desc.cautious:0 "$first_contact.10.materialist.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.materialist.desc.attack_allowed:0 "$first_contact.10.materialist.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.xenophobe.desc.proactive:0 "Hệ thống §H[This.System.GetName]§! bất ngờ bị xâm lược, con tàu xâm nhập chỉ có thể thuộc về người ngoài hành tinh và các cuộc điều tra của nó vẫn đang được tiến hành. Mục đích cụ thể của con tàu vẫn chưa được biết, nhưng nó phải đại diện cho một số tổ chức chính trị lớn. Sẽ thông minh hơn nếu thu thập dữ liệu về những sinh vật này trước tiên, để chúng ta có thể xác định rõ hơn bản chất của mối đe dọa này và mức độ ảnh hưởng của nó."
 first_contact.10.xenophobe.desc.cautious:0 "$first_contact.10.xenophobe.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.xenophobe.desc.attack_allowed:0 "$first_contact.10.xenophobe.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.xenophile.desc.proactive:0 "Trong hệ thống §H[This.System.GetName]§! nơi các cảm biến trước đó đã xác nhận một con tàu không xác định, làn sóng phấn khích ngày càng cao! Thiết kế của con tàu đang đến là hoàn toàn xa lạ với chúng tôi, điều đó có nghĩa là chúng tôi có thể có cuộc tiếp xúc đầu tiên với một nền văn minh ngoài hành tinh hoàn toàn mới. Ngoài việc biết rằng con tàu có khả năng du hành siêu không gian, chúng ta không biết gì về những sáng tạo hấp dẫn này. Chúng ta nên dành nhiều nỗ lực hơn để nghiên cứu nó."
 first_contact.10.xenophile.desc.cautious:0 "$first_contact.10.xenophile.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.xenophile.desc.attack_allowed:0 "$first_contact.10.xenophile.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.authoritarian.desc.proactive:0 "Chuyến thăm gần đây của một con tàu vô danh tới hệ thống §H[This.System.GetName]§! đã thu hút sự chú ý của [This.Owner.GetRulerTitle]. Thiết kế của con tàu không khớp với bất kỳ thiết kế hiện có nào của chúng tôi, cho thấy chúng tôi có thể đang thực hiện cuộc tiếp xúc đầu tiên với một nền văn minh ngoài hành tinh. Với sự cho phép của [This.Owner.GetRulerTitle], chúng tôi có thể bắt đầu phân tích dữ liệu thu thập được để giải mã ngôn ngữ."
 first_contact.10.authoritarian.desc.cautious:0 "$first_contact.10.authoritarian.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.authoritarian.desc.attack_allowed:0 "$first_contact.10.authoritarian.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.egalitarian.desc.proactive:0 "Tin tức về chuyến thăm gần đây của một con tàu vô danh tới hệ thống §H[This.System.GetName]§! đã được công khai và đây có thể là lần tiếp xúc đầu tiên của chúng tôi với một nền văn minh ngoài hành tinh, và công tác chuẩn bị đang được tiến hành. Đại diện của các bộ phận khác nhau của chính phủ hiện đang được thông báo tóm tắt về diễn biến. Nhưng rõ ràng là chúng ta có nhiều câu hỏi hơn là câu trả lời."
 first_contact.10.egalitarian.desc.cautious:0 "$first_contact.10.egalitarian.desc.proactive$\n\n$first_contact.10.cautious$"
 first_contact.10.egalitarian.desc.attack_allowed:0 "$first_contact.10.egalitarian.desc.proactive$\n\n$first_contact.10.attack_allowed$"
 first_contact.10.cautious:0 "Chúng tôi đang thực hiện mọi biện pháp để ngăn chặn họ khám phá bất kỳ thông tin nhạy cảm nào."
 first_contact.10.attack_allowed:0 "Nhiều người [This.Owner.GetSpeciesNamePlural] đang theo dõi chặt chẽ tình hình và đang yêu cầu chúng tôi chặn con tàu thô lỗ này, để chúng tôi có thể thẩm vấn chúng khi rảnh rỗi mà không phải mạo hiểm thêm thông tin nhạy cảm rơi vào tay chúng."
 first_contact.15.militarist.desc:0 "Trinh sát gần đây của chúng tôi ở §H[known_planet.System.GetName]§! đã xác nhận nó là hệ thống chính cho §H[This.ContactCountry.GetName]§!, với một lượng lớn hoạt động tập trung vào [known_planet.GetPlanetBioInfo], dường như là một cơ sở quan trọng. Rất có thể đây là một phần của nền văn minh giữa các vì sao, nhưng để giải mã thông tin liên lạc quân sự của họ, trước tiên chúng ta cần dịch ngôn ngữ của họ."
 first_contact.15.militarist.desc.no_planets:0 "Các phi cơ trinh sát bay vào hệ thống §H[known_system.GetName]§! đã báo cáo sự hiện diện đáng kể của §H[This.ContactCountry.GetName]§!, với ít nhất một cơ sở quân sự lớn quay quanh nó. Mặc dù chúng tôi chưa tìm thấy bất kỳ khu định cư nào của hành tinh, nhưng một loạt các mục tiêu sơ bộ đã được liệt kê trong trường hợp người ngoài hành tinh được xác nhận là thù địch. Chúng tôi cũng đã chặn được một số thông điệp thú vị, có thể cung cấp đủ thông tin để dịch ngôn ngữ."
 first_contact.15.pacifist.desc:0 "Chúng tôi đã xác nhận một sự hiện diện lớn của §H[This.ContactCountry.GetName]§! trong hệ thống §H[known_planet.System.GetName]§!, đặc biệt là trong số đó là [known_planet.GetPlanetBioInfo], nơi bề mặt được bao phủ bởi một số khu định cư lớn. Thực tế là chúng ta đang đối phó với một nền văn minh ngoài hành tinh mà trước đây chưa từng được biết đến ngày càng trở nên rõ ràng. Đội của chúng tôi nên cực kỳ cẩn thận để tránh bất kỳ hành động khiêu khích nào trong hệ thống được coi là của họ. Chúng ta phải cố gắng hết sức để dịch ngôn ngữ của họ để chúng ta có thể truyền đạt ý định hòa bình của mình."
 first_contact.15.pacifist.desc.no_planets:0 "Hệ thống §H[known_system.GetName]§! dường như đã bị tuyên bố chủ quyền bởi một nền văn minh ngoài hành tinh mà chúng tôi gọi là §H[This.ContactCountry.GetName]§!. Mặc dù không có khu định cư hành tinh nào được phát hiện trong hệ thống, nhưng có một căn cứ ngôi sao khổng lồ quay quanh tâm. Đội của chúng tôi đã được khuyên nên thận trọng để tránh bất kỳ hành động nào có thể bị hiểu lầm là thù địch. Sau khi ngôn ngữ của họ được giải mã, chúng tôi hy vọng sẽ thiết lập quan hệ ngoại giao hòa bình với họ."
 first_contact.15.spiritualist.desc:0 "Hệ sao §H[known_planet.System.GetName]§! nơi chúng ta tìm thấy các hành tinh có người sinh sống được xác định là thuộc về một quốc gia có tên §H[This.ContactCountry.GetName]§!. Rất nhiều khu định cư lớn nằm rải rác trên [known_planet.GetPlanetBioInfo]. Chúng ta chưa rõ hệ sao này mang ý nghĩa tâm linh gì đối với họ, nhưng dường như nó là một phần trong nền văn minh giữa các vì sao của họ. Chúng ta nên nỗ lực tối đa để giải mã ngôn ngữ của họ."
 first_contact.15.spiritualist.desc.no_planets:0 "Lực lượng ngoài hành tinh mà chúng tôi gọi là §H[This.ContactCountry.GetName]§! dường như đã tuyên bố hệ thống §H[known_system.GetName]§!, với ít nhất một căn cứ sao lớn quay quanh ngôi sao trung tâm. Không có bằng chứng nào về pháo đài được tìm thấy trong thiên hà và không rõ liệu họ có theo bước chân của Chúa Thánh Thần hay đã rơi vào trạng thái tôi tớ của ác quỷ hay không. Chúng ta nên cố gắng hết sức để giải mã ngôn ngữ của họ."
 first_contact.15.materialist.desc:0 "Đã có một số khám phá thú vị trong §H[known_planet.System.GetName]§!, nơi một số tín hiệu giao thông bí ẩn đã dẫn chúng ta đến [known_planet.GetPlanetBioInfo], với một số khu định cư lớn của người ngoài hành tinh rải rác. Chúng tôi tự tin rằng hành tinh này thuộc về một quốc gia được gọi là §H[This.ContactCountry.GetName]§!, rất có thể là một quốc gia giữa các vì sao giống như chúng ta. Các mẫu công nghệ của họ vẫn chưa được thu thập, nhưng trình độ công nghệ của họ dường như không cao hơn nhiều so với chúng ta. Công việc dịch ngôn ngữ của họ vẫn đang được tiến hành."
 first_contact.15.materialist.desc.no_planets:0 "Dữ liệu thu được trong hệ thống §H[known_system.GetName]§! xác nhận giả thuyết rằng nó được tuyên bố bởi một thực thể chính trị mà chúng ta gọi là §H[This.ContactCountry.GetName]§!. Tại trung tâm của hệ sao có một căn cứ quay quanh ngôi sao trung tâm, có thể đóng vai trò là trung tâm cho thông tin liên lạc và cơ sở hạ tầng của thiên hà, và dường như là nguồn gốc của hầu hết các thông tin liên lạc mà chúng ta chặn được. Chúng ta cần cố gắng phân tích những giao tiếp này và dịch ngôn ngữ của họ."
 first_contact.15.xenophobe.desc:0 "Trong hệ thống §H[known_planet.System.GetName]§!, tổ của một hành tinh ngoài hành tinh đã xuất hiện! Các sinh vật trên [known_planet.GetPlanetBioInfo] giống như châu chấu bao phủ và xâm nhập vào vùng đất này. Hiện tại người ta đã xác nhận rằng những người ngoài hành tinh này, §H[This.ContactCountry.GetName]§!, là một nền văn minh giữa các vì sao tự do lây lan không hạn chế trên nhiều hành tinh. Đây sẽ không phải là một nhiệm vụ thú vị, nhưng dù sao chúng ta cũng nên dịch ngôn ngữ của họ để có thể hiểu đầy đủ về sự suy đồi của họ."
 first_contact.15.xenophobe.desc.no_planets:0 "Hệ thống sao §H[known_system.GetName]§! dường như là một tổ của người ngoài hành tinh được kiểm soát bởi §H[This.ContactCountry.GetName]§!, với một trạm vũ trụ lớn quay quanh ngôi sao trung tâm. Phi hành đoàn của chúng tôi đã được yêu cầu bỏ qua tất cả các thông tin liên lạc và giữ khoảng cách an toàn với tất cả các tàu hoặc trạm vũ trụ ngoài hành tinh, bất kể đối phương đang làm gì, để họ không bị những sinh vật này tiếp xúc và làm hại. Nếu chúng ta quản lý để giải mã thông tin liên lạc phát ra từ cơ sở ngôi sao trong hệ thống, thì có lẽ chúng ta có thể dịch ngôn ngữ mà loài của họ sử dụng để giao tiếp."
 first_contact.15.xenophile.desc:0 "Một thuộc địa được đánh dấu là §H[This.ContactCountry.GetName]§!, có thể là một hành tinh quê hương, đã được công bố sẽ được tìm thấy trong hệ thống §H[known_planet.System.GetName]§!. Một số khu định cư lớn phân bố trên bề mặt [known_planet.GetPlanetBioInfo], thu hút sự chú ý của chúng tôi. Khám phá thú vị này cho chúng ta cái nhìn sâu sắc hơn về nền văn minh giữa các vì sao và các chủng tộc ngoài hành tinh hấp dẫn. Nghĩ về những gì chúng ta sẽ khám phá sau khi dịch thành công ngôn ngữ của họ!"
 first_contact.15.xenophile.desc.no_planets:0 "Hệ thống §H[known_system.GetName]§! dường như đã bị chiếm đóng bởi một lực lượng ngoài hành tinh mà chúng tôi gọi là §H[This.ContactCountry.GetName]§!, mặc dù không có hành tinh nào có dân số sinh sống được tìm thấy trong hệ thống. Một căn cứ sao lớn quay quanh một ngôi sao rõ ràng là trung tâm của thiên hà. Ngay cả khi chúng ta đang ở trong những gì được coi là thiên hà của họ, chúng ta biết rất ít về những sinh vật hấp dẫn này. Chúng ta nên cố gắng hết sức để hiểu nhau một cách sâu sắc."
 first_contact.15.authoritarian.desc:0 "Quét cho thấy có vẻ như có một hành tinh có người ở, [known_planet.GetPlanetBioInfo], trong hệ thống §H[known_planet.System.GetName]§!, được tuyên bố chủ quyền bởi một lực lượng ngoài hành tinh tên là §H[This.ContactCountry.GetName]§!. Những người ngoài hành tinh này rất có khả năng là một phần của nền văn minh giữa các vì sao có khả năng du hành siêu không gian. Theo đó, [This.Owner.GetRulerTitle] đã quyết định hạn chế thông tin về hệ thống này trong các cấp cao nhất của chính phủ để tránh tình trạng bất ổn nội bộ."
 first_contact.15.authoritarian.desc.no_planets:0 "Có một căn cứ §H[This.ContactCountry.GetName]§! lớn trong hệ thống §H[known_system.GetName]§!, bao gồm một trạm vũ trụ quay quanh một ngôi sao. Mặc dù quét đi quét lại, chúng tôi không có khả năng hiểu được ngôn ngữ và bản chất chính xác của hệ thống lệnh. Theo chỉ huy của [This.Owner.GetRulerTitle], chúng tôi sẽ tập trung nỗ lực dịch ngôn ngữ của họ."
 first_contact.15.egalitarian.desc:0 "Một cuộc khảo sát không gian sâu đã cho phép chúng tôi tình cờ phát hiện ra một hành tinh có người ở trong hệ thống §H[known_planet.System.GetName]§!. Hành tinh này thuộc về §H[This.ContactCountry.GetName]§! và hiện được coi là một nền văn minh giữa các vì sao chưa từng được biết đến trước đây. Thuộc địa hoặc hành tinh quê hương này là [known_planet.GetPlanetBioInfo], nằm trong vùng có thể ở được bao quanh. Hy vọng rằng xã hội của họ là một xã hội tiến bộ được xây dựng dựa trên tự do và tự do cá nhân, nhưng chúng ta phải giải mã ngôn ngữ của họ trước khi có thể tìm ra."
 first_contact.15.egalitarian.desc.no_planets:0 "Chúng tôi đã phát hiện ra một sự hiện diện đáng kể của §H[This.ContactCountry.GetName]§! trong hệ thống §H[known_system.GetName]§! — mặc dù theo như những gì được biết cho đến nay, không có khu định cư nào ở đó, nhưng có một cơ sở không gian lớn quay quanh ngôi sao trung tâm của hệ thống. Người phát ngôn thông báo với công chúng rằng rất có thể chúng ta đã tình cờ phát hiện ra một tiền đồn của một nền văn minh giữa các vì sao chưa được biết đến trước đó. Chúng ta cần dịch ngôn ngữ của họ trước khi chúng ta có thể giao tiếp với họ."
