 resolution_category_custodian_reforms:0 "Cải Cách Người Giám Hộ"
 resolution_category_galactic_institutions:0 "Thể Chế Thiên Hà"
 resolution_category_term_limits:0 "Giới Hạn Nhiệm Kỳ"
 resolution_galacticreforms_nominate_custodian:0 "Bổ Nhiệm Người Giám Hộ"
 resolution_galacticreforms_nominate_custodian_desc:0 "Khi cần hành động quyết đoán, một thành viên của Hội Đồng có thể được nâng lên vị trí Người Giám Hộ Thiên Hà. Người Giám Hộ được trao các đặc quyền và có thể đề xuất các nghị quyết mới và mạnh mẽ."
 nominate_custodian_requires_independence:0 "£trigger_no£ Chúng ta phải hoàn toàn độc lập mới có thể phục vụ với tư cách Người Giám Hộ."
 nominate_custodian_not_crisis:0 "£trigger_no£ Sự giám sát khi đảm nhiệm vị trí Người Giám Hộ sẽ làm bại lộ kế hoạch của chúng ta đối với thiên hà..."
 nominate_other_custodian_requires_independence:0 "£trigger_no£ Họ phải hoàn toàn độc lập mới có thể phục vụ với tư cách Người Giám Hộ."
 nominate_other_custodian_not_crisis:0 "£trigger_no£ Họ không sẵn lòng chấp nhận đề xuất của chúng ta."
 resolution_custodian_form_empire:1 "Tuyên Bố Thành Lập Đế Chế Thiên Hà"
 resolution_custodian_form_empire_desc:0 "Bất chấp những nỗ lực to lớn của Người Giám Hộ, Cộng Đồng Thiên Hà vẫn bị xói mòn bởi sự chia rẽ nội bộ. Hãy nghĩ về tất cả những gì có thể đạt được nếu thiên hà được thống nhất dưới một sự lãnh đạo mạnh mẽ. Một kỷ nguyên hòa bình và thịnh vượng chưa từng có đang nằm trong tầm tay của chúng ta."
 resolution_custodian_form_empire_tooltip:3 "§YCộng Đồng Thiên Hà§! chuyển đổi thành §YĐế Chế Thiên Hà§!.\n§RMọi thành viên rời khỏi tất cả Liên Bang hiện có.§!\n\n§R§Y[Root.GetName]§! trở thành §YLõi Đế Chế§!, dịch chuyển về §YChủ Nghĩa Độc Tài§! và áp dụng chính phủ §YĐế Chế§!. Tất cả §YQuốc Sách§! không tương thích sẽ bị loại bỏ.§!"
 resolution_custodian_form_empire_tooltip_machine:1 "§YCộng Đồng Thiên Hà§! chuyển đổi thành §YĐế Chế Thiên Hà§!.\n§RMọi thành viên rời khỏi tất cả Liên Bang hiện có.§!\n\n§Y[Root.GetName]§! trở thành §YMạng Trung Tâm Đế Chế§!."
 resolution_custodian_form_empire_tooltip_hive:1 "§YCộng Đồng Thiên Hà§! chuyển đổi thành §YĐế Chế Thiên Hà§!.\n§RMọi thành viên rời khỏi tất cả Liên Bang hiện có.§!\n\n§Y[Root.GetName]§! trở thành §YTổ Mẹ Đế Chế§!."
 resolution_awakened_galactic_empire: "Tuyên Bố Thành Lập Đế Chế Thiên Hà Thức Tỉnh"
 resolution_awakened_galactic_empire_desc: "Các đế chế trong thiên hà này còn quá non trẻ và thiếu kinh nghiệm. Họ cần một người dẫn đường trong thời kỳ đầy thử thách này."
 resolution_form_awakened_galactic_empire: "§YCộng Đồng Thiên Hà§! chuyển đổi thành §YĐế Chế Thiên Hà§!.\n§RMọi thành viên rời khỏi tất cả Liên Bang hiện có.§!\n\n§Y[Root.GetName]§! trở thành §YHoàng Đế Thức Tỉnh§!."
 resolution_custodian_united_front:0 "Mặt Trận Thống Nhất"
 resolution_custodian_united_front_desc:0 "Mối đe dọa mà thiên hà chúng ta phải đối mặt đặt ra một sự lựa chọn giản đơn: sát cánh cùng nhau, hoặc chết trong đơn độc. Chúng ta sẽ chiến đấu như một, chia sẻ thông tin về kẻ thù và gác lại những mối hận thù cũ."
 resolution_emperor_united_front:0 "$resolution_custodian_united_front$"
 resolution_emperor_united_front_desc:0 "$resolution_custodian_united_front_desc$"
 resolution_custodian_galactic_mobilization:0 "Tổng Động Viên Thiên Hà"
 resolution_custodian_galactic_mobilization_desc:0 "Tương lai thiên hà của chúng ta đang bị đe dọa. Các hạm đội chiến tranh khổng lồ phải được nhanh chóng huy động, ngay cả khi điều đó đồng nghĩa với việc trưng dụng các thủy thủ đoàn thương thuyền dân sự."
 resolution_custodian_galactic_standard:0 "Đưa Vào Sử Dụng Chuẩn Thiên Hà"
 resolution_custodian_galactic_standard_desc:1 "Chuẩn Thiên Hà là một ngôn ngữ mới được thiết kế đặc biệt để dễ sử dụng cho mọi loài có tri giác bất kể đặc điểm sinh lý học của họ. Bằng cách áp dụng một ngôn ngữ duy nhất cho mọi hoạt động chính thức của Cộng Đồng Thiên Hà, người ta hy vọng rằng có thể tránh được những sự cố dịch thuật."
 resolution_custodian_anti_piracy:0 "Sáng Kiến Chống Hải Tặc"
 resolution_custodian_anti_piracy_desc:0 "Nạn hải tặc không gian tràn lan đang đe dọa làm suy yếu sự thịnh vượng kinh tế của toàn cõi thiên hà. Với sáng kiến này, tất cả các thành viên Cộng Đồng sẽ được huấn luyện về các biện pháp chống hải tặc hiệu quả. Các nỗ lực chung nhằm phát triển chiến thuật chiến đấu tận dụng sự thiếu kỷ luật chung của các thủy thủ đoàn hải tặc và cướp bóc cũng sẽ được tiến hành."
 resolution_custodian_extend_custodianship:0 "Gia Hạn Quyền Giám Hộ"
 resolution_custodian_extend_custodianship_desc:0 "Biến thiên hà thành một nơi tốt đẹp hơn là một nhiệm vụ to lớn cần có thời gian. Nhiệm kỳ Giám Hộ hiện tại cần được gia hạn thêm một khóa nếu muốn hoàn thành bất cứ điều gì có hiệu quả lâu dài."
 resolution_custodian_extend_custodianship_tooltip:1 "Giới hạn nhiệm kỳ của §YNgười Giám Hộ§! hiện tại được kéo dài thêm §Y30 năm§!."
 resolution_custodian_perpetual_custodianship:1 "Xóa Bỏ Giới Hạn Nhiệm Kỳ Quyền Giám Hộ"
 resolution_custodian_perpetual_custodianship_desc:0 "Những Người Giám Hộ hiện tại đã chứng tỏ mình là những người bảo vệ không thể thay thế của Cộng Đồng. Sự phục vụ kiên định của họ cho thiên hà phải được phép tiếp tục vô thời hạn."
 resolution_custodian_perpetual_custodianship_tooltip:0 "§YQuyền Giám Hộ§! hiện tại sẽ tiếp tục vĩnh viễn."
 resolution_custodian_end_custodianship:0 "Chấm Dứt Quyền Giám Hộ"
 resolution_custodian_end_custodianship_desc:0 "Cộng Đồng Thiên Hà không còn cần đến một Người Giám Hộ nữa. Do đó, Quyền Giám Hộ nên được chấm dứt trước khi hết hạn nhiệm kỳ."
 resolution_custodian_end_custodianship_tooltip:0 "§YQuyền Giám Hộ§! kết thúc trước thời hạn."
 resolution_custodian_gdf:1 "Lực Lượng Phòng Thủ Thiên Hà"
 resolution_custodian_gdf_desc:0 "Để bảo vệ các thành viên của Cộng Đồng tốt hơn, một lực lượng đa quốc gia thường trực dưới sự chỉ huy thống nhất của Người Giám Hộ Thiên Hà cần được thành lập."
 resolution_custodian_gdf_2:0 "$resolution_custodian_gdf$"
 resolution_custodian_expand_gdf:1 "Mở Rộng GDF"
 resolution_custodian_expand_gdf_desc:0 "Quy mô của Lực Lượng Phòng Thủ Thiên Hà phải được gia tăng đáng kể nếu muốn đáp ứng phạm vi nhiệm vụ ngày càng mở rộng của nó."
 resolution_custodian_disband_gdf:0 "Giải Tán GDF"
 resolution_custodian_disband_gdf_desc:0 "Lực Lượng Phòng Thủ Thiên Hà đã hoàn thành mục đích của mình và giờ đây nên được phục viên."
 resolution_custodian_ina:1 "Cơ Quan Dẫn Đường Liên Sao"
 resolution_custodian_ina_desc:0 "INA sẽ thực thi các tiêu chuẩn và thông lệ khuyến nghị cho du hành không gian, và sẽ duy trì một cơ sở dữ liệu khổng lồ về mọi hiểm họa không gian đã biết trong tất cả các hệ sao thuộc hải đồ Cộng Đồng."
 resolution_custodian_disband_ina:0 "Giải Tán Cơ Quan Dẫn Đường Liên Sao"
 resolution_custodian_disband_ina_desc:0 "INA là một tổ chức kém hiệu quả và đắt đỏ. Sự tồn tại liên tục của nó là không thể biện minh."
 resolution_custodian_gto:1 "Tổ Chức Thương Mại Thiên Hà"
 resolution_custodian_gto_desc:0 "GTO sẽ đóng vai trò là một cơ quan quản lý thiên hà thực thi các tiêu chuẩn thương mại và giải quyết các tranh chấp."
 resolution_custodian_disband_gto:0 "Giải Tán Tổ Chức Thương Mại Thiên Hà"
 resolution_custodian_disband_gto_desc:0 "Sự can thiệp của GTO phải chấm dứt. Thương mại có cách tự điều tiết của chính nó."
 resolution_custodian_galpol:1 "GALPOL"
 resolution_custodian_galpol_desc:0 "Việc thành lập một tổ chức cảnh sát hình sự thiên hà sẽ cho phép các cơ quan thực thi pháp luật hợp tác trên toàn thể Cộng Đồng Thiên Hà."
 resolution_custodian_disband_galpol:0 "Giải Tán GALPOL"
 resolution_custodian_disband_galpol_desc:0 "Không được phép để GALPOL trở thành 'cảnh sát mật' của tầng lớp tinh hoa cai trị Cộng Đồng Thiên Hà. Nó nên bị giải tán ngay lập tức."
 resolution_category_emperor_imperial_institutions:0 "Thể Chế Hoàng Gia"
 resolution_emperor_imperial_armada:1 "Hạm Đội Hoàng Gia"
 resolution_emperor_imperial_armada_desc:1 "Với các tân binh được tuyển mộ từ toàn thể Đế Chế, Hạm Đội Hoàng Gia sẽ là hạm đội không gian hùng mạnh nhất mà thiên hà từng chứng kiến."
 resolution_emperor_expand_ia:1 "Mở Rộng Hạm Đội Hoàng Gia"
 resolution_emperor_expand_ia_desc:1 "Quy mô của Hạm Đội Hoàng Gia phải được gia tăng, vì vinh quang vĩ đại hơn của Đế Chế!"
 resolution_emperor_imperial_legions:1 "Quân Đoàn Hoàng Gia"
 resolution_emperor_imperial_legions_desc:1 "Không có vinh dự nào lớn hơn việc phục vụ thiên hà với tư cách một Chiến Binh Quân Đoàn Hoàng Gia. Được tuyển chọn từ những tinh hoa trong số tất cả tân binh quân sự trên toàn Đế Chế, các Quân Đoàn được huấn luyện và rèn giũa thành một lực lượng mặt đất trung thành tuyệt đối."
 resolution_emperor_isd:1 "Cục An Ninh Hoàng Gia"
 resolution_emperor_isd_desc:1 "Hòa bình, ổn định, trật tự — chính là những tôn chỉ mà Đế Chế Thiên Hà được kiến tạo nên. ISD sẽ truy lùng tội phạm, khủng bố và những kẻ nổi loạn ở bất cứ nơi nào chúng lẩn trốn."
 resolution_emperor_itc:1 "Công Ty Thương Mại Hoàng Gia"
 resolution_emperor_itc_desc:0 "ITC sẽ hoạt động theo Hiến Chương Hoàng Gia và ban quản lý cùng hội đồng quản trị của công ty sẽ chịu sự kiểm soát trực tiếp của Hoàng Đế Thiên Hà."
 resolution_category_imperial_council:0 "Hội Đồng Hoàng Gia"
 resolution_emperor_trial_of_advancement:0 "Thông Qua Thử Thách Thăng Tiến"
 resolution_emperor_trial_of_advancement_desc:1 "Để họ không coi vị thế của mình là điều hiển nhiên, việc thách thức các thành viên của Hội Đồng Hoàng Gia để giành ghế của họ thông qua một Thử Thách Thăng Tiến cần phải khả thi. Những kẻ tự mãn và yếu hèn phải bị loại bỏ khỏi các tầng lớp thượng lưu của Đế Chế."
 resolution_emperor_trial_of_advancement_tooltip:0 "Ban cho cớ chiến tranh §Y'Thử Thách Thăng Tiến'§! nhắm vào các thành viên của Hội Đồng Hoàng Gia."
 resolution_emperor_by_appointment:0 "Thông Qua Bổ Nhiệm"
 resolution_emperor_by_appointment_desc:1 "Các thành viên của Hội Đồng Hoàng Gia phải phụng sự theo ý muốn của Hoàng Đế Bệ Hạ, người được tự do lựa chọn từ tất cả thần dân trung thành của Đế Chế."
 resolution_emperor_by_appointment_tooltip:1 "Người cai trị Đế Chế được tự do bổ nhiệm bất kỳ ai họ muốn vào Hội Đồng Hoàng Gia."
 resolution_emperor_by_election:0 "Thông Qua Bầu Cử"
 resolution_emperor_by_election_desc:0 "Như trong Cộng Đồng Thiên Hà trước đây, các thành viên của Hội Đồng Hoàng Gia nên được bầu chọn dựa trên quyền lực biểu quyết của họ."
 resolution_emperor_by_election_tooltip:0 "Tư cách thành viên trong Hội Đồng Hoàng Gia được xác định thông qua các cuộc bầu cử định kỳ dựa trên §YTrọng Lượng Ngoại Giao§!."
 resolution_emperor_ina:0 "Cơ Quan Dẫn Đường Hoàng Gia"
 resolution_emperor_ina_desc:1 "INA sẽ thực thi các tiêu chuẩn và thông lệ khuyến nghị cho du hành không gian, và sẽ duy trì một cơ sở dữ liệu khổng lồ về mọi hiểm họa không gian đã biết trong tất cả các hệ sao thuộc hải đồ Đế Chế."
 resolution_emperor_disband_ina:0 "Giải Tán Cơ Quan Dẫn Đường Hoàng Gia"
 resolution_emperor_disband_ina_desc:0 "$resolution_custodian_disband_ina_desc$"
