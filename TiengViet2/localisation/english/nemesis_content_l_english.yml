 interstellar_assembly_permanently_ruined_MEGASTRUCTURE_DETAILS:0 ""
 mega_shipyard_permanently_ruined:0 "$mega_shipyard_ruined$"
 mega_shipyard_permanently_ruined_DESC:0 "Cơ sở đóng tàu bị phá hủy hoàn toàn này không bao giờ có thể đóng tàu được nữa. Thiệt hại của nó không thể được sửa chữa."
 mega_shipyard_permanently_ruined_MEGASTRUCTURE_DETAILS:0 ""
 quantum_catapult_permanently_ruined:0 "$quantum_catapult_ruined$"
 quantum_catapult_permanently_ruined_DESC:0 "Ngôi sao cung cấp mô-men xoắn cho súng cao su lượng tử đã bị phá hủy, và súng cao su không còn có thể bắn được nữa. Thiệt hại gây ra không thể được sửa chữa."
 quantum_catapult_permanently_ruined_MEGASTRUCTURE_DETAILS:0 ""
 crisis.6000.name:0 "Động Cơ Pha Aether"
 crisis.6000.a.desc:0 "Chúng ta đã chạm tới thời khắc then chốt trong sứ mệnh chinh phục miền tâm linh của Cõi Màn Che. Bộ khung của đại công trình §HĐộng Cơ Pha Aether§! giờ đây đã bao bọc ngôi sao của hệ sao quê hương. Khi siêu cấu trúc này hoàn tất, bức màn ngăn cách giữa các thế giới sẽ bị xóa bỏ và chúng ta có thể làm chủ Cõi Màn Che.\n\nTâm trí của chúng ta sẽ không còn bị giam hãm bởi những giới hạn vật lý của thể xác yếu ớt, và thực tại sẽ hoàn toàn nằm dưới quyền năng của chúng ta. Quả thực, chẳng còn cảnh giới tồn tại nào có thể cao hơn thế nữa."
 crisis.6000.b.desc.intro: "Bộ khung của đại công trình §HĐộng Cơ Pha Aether§! mà chúng ta xây dựng quanh ngôi sao của hệ sao quê hương đã vào vị trí. Siêu cấu trúc này, một khi hoàn tất, sẽ xé toạc bức màn ngăn cách giữa thế giới của chúng ta và §HCõi Màn Che§!."
 crisis.6000.b.desc.organic_non_gestalt: "$crisis.6000.b.desc.intro$\n\nChúng ta sẽ sớm kiểm soát được dạng thức tinh khiết nhất của năng lượng tâm linh theo ý muốn. Thực tại sẽ chẳng còn lựa chọn nào khác ngoài việc phải quy phục trước ý chí của chúng ta."
 crisis.6000.b.desc.organic_gestalt: "$crisis.6000.b.desc.intro$\n\nKhi chúng ta hoàn toàn bước vào chiều không gian này và sáp nhập nó, ý thức của chúng ta sẽ mở rộng bao trùm toàn bộ tạo vật — ít nhất là trong phạm vi thiên hà này. Các quy luật tự nhiên chi phối sự tồn tại của chúng ta có thể được viết lại tùy ý theo ý muốn của chúng ta."
 crisis.6000.b.desc.machine: "$crisis.6000.b.desc.intro$\n\nKỷ nguyên của sự kém hiệu quả về mặt vật lý sắp đi đến hồi kết. Thực tại này sẽ sớm phải tuân theo ưu thế hậu cần tối ưu hóa của chúng ta."
 crisis.6000.c.desc:0 "Các đơn vị xây dựng đã hoàn tất bộ khung của §HĐộng Cơ Pha Aether§! mà chúng ta đang dựng quanh ngôi sao của hệ sao quê hương. Siêu cấu trúc này, một khi hoàn thành, sẽ xé toạc bức tường ngăn cách giữa thế giới thực tại và cõi tâm linh mà kẻ khác gọi là \"§HCõi Màn Che§!\".\n\nKhi chúng ta hoàn toàn bước vào và sáp nhập chiều không gian này, các quy luật tự nhiên chi phối sự tồn tại của chúng ta có thể được viết lại tùy ý theo ý muốn. Ý thức hợp nhất của chúng ta sẽ không còn bị gò bó bởi các rào cản vật lý như năng lực tính toán hay nút mạng nữa."
 crisis.6000.d.desc:0 "Các [root.GetIndividualNamePlural] của chúng ta đã hoàn tất bộ khung của §HĐộng Cơ Pha Aether§! xây dựng quanh ngôi sao của hệ sao quê hương. Siêu cấu trúc này, một khi hoàn thành, sẽ xé toạc bức rào chắn giữa thế giới của chúng ta và cõi tâm linh mà kẻ khác gọi là \"Cõi Màn Che\".\n\nKhi chúng ta hoàn toàn bước vào và sáp nhập chiều không gian này, ý thức của chúng ta sẽ mở rộng bao trùm toàn bộ vạn vật — ít nhất là trong thiên hà này. Các quy luật tự nhiên chi phối sự tồn tại của chúng ta có thể được viết lại tùy ý theo ý muốn."
 crisis.6000.e.desc: "Khung §HĐộng Cơ Pha Aether§! được xây dựng xung quanh ngôi sao bố mẹ đã được dựng lên. Khi siêu cấu trúc này được xây dựng, nó có thể xé toạc rào cản giữa thế giới thực và §HCõi Màn Che§!.\n\nSau khi chúng ta bước vào hoàn toàn chiều không gian đó, chúng ta có thể đối mặt với thực thể đã đánh dấu chúng ta. Đánh bại anh ta và Cõi Màn Che là của chúng ta để sử dụng và tự do viết lại các quy luật tự nhiên."
 crisis.6000.nomad.desc.intro: "Khung kiến trúc vĩ đại của §HĐộng Cơ Tương Vị Ether§! mà chúng ta xây dựng đã bao quanh thiên neo được lựa chọn — ngôi sao được định đoạt giữa muôn vàn tinh tú trên hành trình phiêu bạt. Siêu cấu trúc này, một khi hoàn thành, sẽ xé toạc bức màn mỏng manh ngăn cách giữa chiều không gian của chúng ta và §HHư Cảnh§!."
 crisis.6000.nomad.a.desc: "Sứ mệnh lật đổ bình diện tâm linh của Hư Cảnh của chúng ta nay đã tới thời khắc vô cùng then chốt. Khung kiến trúc vĩ đại của §HĐộng Cơ Tương Vị Ether§! đang bao bọc quanh thiên neo được lựa chọn trong suốt hành trình phiêu dạt. Một khi siêu cấu trúc này hoàn tất, chúng ta có thể dễ dàng xóa bỏ rào chắn của trần thế, biến Hư Cảnh thành của riêng mình.\n\nÝ thức của chúng ta sẽ không còn bị giam hãm trong xiềng xích vật lý của thể xác yếu đuối, và chính thực tại sẽ tùy ý để chúng ta thống trị. Quả thực, thế gian sẽ không còn cảnh giới tồn tại nào cao hơn thế."
 crisis.6000.nomad.b.desc.organic_non_gestalt: "$crisis.6000.nomad.desc.intro$\n\nChúng ta sẽ sớm có thể thao túng năng lượng tâm linh ở dạng thuần khiết nhất. Thực tại sẽ không còn lựa chọn nào khác ngoài việc quy phục trước chúng ta."
 crisis.6000.nomad.b.desc.organic_gestalt: "$crisis.6000.nomad.desc.intro$\n\nChỉ cần chúng ta hoàn toàn bước vào chiều không gian này và thôn tính nó, ý thức của chúng ta sẽ có thể mở rộng bao trùm lên mọi tạo vật — ít nhất là trong phạm vi thiên hà này. Các quy luật tự nhiên chi phối sự tồn tại của chúng ta sẽ có thể bị chúng ta tùy ý viết lại."
 crisis.6000.nomad.b.desc.machine: "$crisis.6000.nomad.desc.intro$\n\nThời đại của một thực tại kém hiệu quả sắp đi đến hồi kết. Chẳng mấy chốc, thực tại này sẽ phải sánh ngang với năng lực hậu cần vượt trội của chúng ta."
 crisis.6000.nomad.c.desc: "Các đơn vị xây dựng đã hoàn tất việc dựng khung §HĐộng Cơ Tương Vị Ether§! bao quanh thiên neo. Siêu cấu trúc này một khi hoàn tất sẽ có thể xé toạc rào cản giữa thế giới thực tại và cõi giới tâm linh mà những kẻ khác gọi là \"§HHư Cảnh§!\".\n\nChỉ cần chúng ta hoàn toàn bước vào chiều không gian này và thôn tính nó, các quy luật tự nhiên chi phối sự tồn tại của chúng ta sẽ có thể bị chúng ta tùy ý viết lại. Ý thức tập thể của chúng ta sẽ không còn bị giới hạn bởi các hình thức vật lý như năng lực tính toán hay các nút mạng kết nối."
 crisis.6000.nomad.d.desc: "§HĐộng Cơ Tương Vị Ether§! vĩ đại đã được đặt vào vị trí xung quanh thiên neo mà chúng ta chọn, các [root.GetIndividualNamePlural] của chúng ta đã hoàn thành việc xây dựng khung cơ bản. Siêu cấu trúc này, một khi hoàn thành, sẽ xé toạc bức màn mỏng manh giữa bình diện của chúng ta và cõi giới tâm linh mà những kẻ khác gọi là \"Hư Cảnh\".\n\nKhi chúng ta hoàn toàn bước vào bình diện này và sáp nhập nó, ý thức của chúng ta sẽ mở rộng bao trùm tất cả tạo vật — ít nhất là thiên hà này. Các quy luật tự nhiên quản thúc sự tồn tại của chúng ta sẽ tùy ý thay đổi theo ý chí của chúng ta."
 crisis.6000.nomad.e.desc: "Khung §HĐộng Cơ Tương Vị Ether§! được xây dựng xung quanh thiên neo đã được lắp ráp hoàn tất. Siêu cấu trúc này một khi hoàn thành sẽ có thể xé toạc bức rào ngăn cách giữa thế giới thực tại và §HHư Cảnh§!.\n\nSau khi hoàn toàn bước vào chiều không gian đó, chúng ta sẽ có thể đối mặt trực diện với thực thể đã đánh dấu chúng ta. Chỉ cần đánh bại nó, Hư Cảnh sẽ nằm trọn trong tay chúng ta, và chúng ta có thể tự do viết lại các quy luật của tự nhiên."
 crisis.6000.a:0 "Thiên đường đang ở ngay gần đó."
 crisis.6000.b:0 "Chúng ta nên ngang hàng với các vị thần."
 crisis.6000.c:0 "Mọi thứ sẽ phải chịu khuất phục."
 crisis.6000.d:0 "Ý thức của chúng ta sẽ bao trùm toàn bộ thiên hà."
 crisis.6000.e: "$crisis.6000.c$"
 crisis_sphere_0:0 "Khung Động Cơ Pha Aether"
 crisis_sphere_0_DESC:1 "Khung bao quanh ngôi sao là nền tảng của Động Cơ Pha Aether trong tương lai. Nâng cấp hoàn toàn Cấu trúc Lớn này sẽ trực tiếp §GThắng Game§!."
 crisis_sphere_0_MEGASTRUCTURE_DETAILS:0 ""
 crisis_sphere_1:0 "Động Cơ Pha Aether Bán Hoàn Thiện"
 crisis_sphere_1_DESC:1 "Động Cơ Pha Aether, với mục đích xé toạc rào cản giữa bình diện này và Cõi Màn Che, đã được hoàn thành một phần. Nâng cấp hoàn toàn Cấu trúc Lớn này sẽ trực tiếp §GThắng Game§!."
 crisis_sphere_2:0 "$crisis_sphere_1$"
 crisis_sphere_2_DESC:1 "$crisis_sphere_1_DESC$"
 crisis_sphere_3:0 "$crisis_sphere_1$"
 crisis_sphere_3_DESC:1 "$crisis_sphere_1_DESC$"
 crisis_sphere_4:0 "Động Cơ Pha Aether"
 crisis_sphere_4_DESC:1 "§RĐã hoàn thành.§!"
 crisis_sphere_ruined:0 "Khung Động Cơ Pha Aether Bị Phá Hủy"
 crisis_sphere_ruined_DESC:0 "Cấu trúc khổng lồ bị phá hủy này là tàn dư của một nỗ lực xoắn xuýt của một nền văn minh nào đó nhằm xé rách cấu trúc của thực tại."
 crisis_sphere_ruined_MEGASTRUCTURE_DETAILS:0 ""
 crisis.6000.tooltip:0 "Siêu cấu trúc §YĐộng Cơ Pha Aether§! quay quanh ngôi sao §Y[sphere_system.GetName]§!."
 crisis.6001.tooltip: "Xưởng đóng tàu được trang bị §Y$sm_capital_yards$§! nay đã có thể chế tạo §YTàu Nuốt Sao§!.\n\nHai §YTàu Nuốt Sao§! xuất hiện trên quỹ đạo quanh §Y[Root.Capital.GetName]§!.\n\n£sr_dark_matter£ Tăng giới hạn lưu trữ Vật Chất Tối."
 crisis.6001.name:0 "Tàu Nuốt Sao"
 crisis.6001.desc:0 "Chỉ bằng cách kích nổ toàn bộ các ngôi sao, chúng ta mới có thể giải phóng đủ năng lượng để sản sinh ra lượng lớn §HVật Chất Tối§! cần thiết nhằm hoàn thiện Động Cơ Pha Aether. Để đạt được mục đích này, chúng ta đã sáng chế ra các §HTàu Nuốt Sao§! — những chiến hạm hùng mạnh nhất mà thiên hà từng chứng kiến. Chúng không chỉ có thể làm nổ tung các ngôi sao, mà còn đủ sức tự mình quét sạch toàn bộ hạm đội đối phương.\n\nHiện tại chúng ta chỉ có hai chiếc, nhưng có thể đóng thêm. Việc chế tạo chúng đòi hỏi lượng lớn Vật Chất Tối, vì vậy chúng ta cần cân đối giữa mục tiêu hoàn tất Động Cơ Pha Aether và nhu cầu bổ sung thêm Tàu Nuốt Sao."
 crisis.6001.a:0 "Mỗi một ngôi sao rơi xuống đều đưa chúng ta tiến một bước gần hơn đến thành công."
 crisis.6005.name:0 "Động Cơ Pha Aether"
 crisis.6005.desc:0 "Giai đoạn đầu tiên của việc xây dựng Động Cơ Pha Aether đã được tuyên bố hoàn thành. Chúng tôi bắt đầu nghiên cứu năng lượng của Cõi Màn Che, nơi đã gửi sóng psionic trên toàn thiên hà.\n\nChúng tôi đã thiết lập được một chỗ đứng mong manh ở Cõi Màn Che — nhưng chúng tôi phải tiếp tục chế tạo cỗ máy này để mở rộng sự hiện diện của mình ở Cõi Màn Che."
 crisis.6005.a:0 "Chúng ta phải thu thập nhiều Vật Chất Tối hơn."
 crisis.6006.desc:0 "Các tua của Động Cơ Pha Aether đã vươn sâu vào Cõi Màn Che và đầu cầu của chúng ta đã được mở rộng hơn nữa. Các thực thể cư trú ở đây đã nhận thấy sự xâm chiếm của chúng ta vào cõi này, nhưng cho đến nay, chúng ta chưa phát hiện được sự can thiệp đáng kể nào.\n\nĐã đến lúc buộc phải có một mạch vĩnh viễn hơn trên cả hai thế giới. Chúng ta phải tiếp tục làm việc với động cơ."
 crisis.6006.a:0 "Chúng ta cần nhiều Vật Chất Tối hơn!"
 crisis.6007.desc:0 "Động Cơ Pha Aether đã xé một lỗ lớn trên tấm màn của Cõi Màn Che. Mặc dù lỗ hổng chưa đủ lớn để chúng tôi lật đổ toàn bộ lãnh thổ, nhưng lỗ hổng đã gây ra một loạt các hoạt động hiện diện ở Cõi Màn Che.\n\nCuối cùng họ cũng nhận ra mối đe dọa của chúng tôi, nhưng họ không có hành động thực sự nào. Các xúc tu của động cơ đã nhúng sâu vào Cõi Màn Che và bây giờ không thể bị cắt rời.\n\nChúng ta đang ở rất gần. Rất gần."
 crisis.6007.a:0 "Không có gì có thể cản được chúng ta."
 crisis.6010.name:0 "Sóng âm Psi"
 crisis.6010.a.desc.intro: "Gần đây, một làn sóng psionic khổng lồ càn quét thiên hà! Nó dường như được phát ra từ hệ thống sao §H[crisis_sphere_system.GetName]§! của §H[From.GetName]§!."
 crisis.6010.a.desc.outro: "Sự vang vọng của sự kiện đáng kinh ngạc này vang vọng ngay cả trong chính Cõi Màn Che."
 crisis.6010.a.desc.non_gestalt: "$crisis.6010.a.desc.intro$[GetTelepathPlural] của chúng tôi đang giải thích tốt nhất có thể nguyên nhân gây ra một sự kiện như vậy — sự kiện chưa từng xảy ra trong thiên hà.\n\n$crisis.6010.a.desc.outro$"
 crisis.6010.a.desc.gestalt: "$crisis.6010.a.desc.intro$Chúng ta không thể tìm ra nguyên nhân khả dĩ nào gây ra sự kiện như vậy, và ngay cả những người thuộc nhóm psionic nhỏ cũng không thể hiểu được hiện tượng chưa từng có này.\n\n$crisis.6010.a.desc.outro$"
 crisis.6010.b.desc:0 "Lại thêm một đợt sóng xung kích tâm linh khổng lồ quét qua toàn bộ thiên hà! Lần này nó bắt nguồn từ hệ sao §H[crisis_sphere_system.GetName]§! bên trong lãnh thổ §H[From.GetName]§!.\n\nNhư lần trước, sự kiện này đang tạo ra những gợn sóng chấn động khắp Cõi Màn Che."
 crisis.6010.c.desc:0 "Chúng ta đã phát hiện những dấu vết năng lượng và tâm linh mờ nhạt từ hệ sao §H[crisis_sphere_system.GetName]§!, gần như giống hệt với Động Cơ Pha Aether của chính chúng ta.\n\nDường như §H[From.GetName]§! cũng toan tính làm chủ Cõi Màn Che!"
 crisis.6010.a.organic: "Đó là một rắc rối lớn."
 crisis.6010.a.machine: "Rất không lý tưởng."
 crisis.6015.a.desc:0 "$crisis.6015.not.psionic$\n\n$crisis.6015.end$"
 crisis.6015.b.desc:0 "$crisis.6015.psionic$\n\n$crisis.6015.end$"
 crisis.6015.c.desc:0 "Ngày càng có nhiều dao động không gian phụ đã được phát hiện trong hệ thống sao §H[crisis_sphere_system.GetName]§!. Giống như trước đây, nguồn của các dao động là §HĐộng Cơ Pha Aether§! được xây dựng xung quanh ngôi sao chính của hệ thống sao.\n\nRõ ràng §H[From.GetName]§! cũng muốn có được một phần của Cõi Màn Che, và sau đó gây ra sự tàn phá thiên hà!"
 crisis.6015.not.psionic:0 "Chúng ta đã phát hiện các dao động không gian con dữ dội trong hệ sao §H[crisis_sphere_system.GetName]§!, bắt nguồn từ một siêu cấu trúc bao bọc ngôi sao. Dù thoạt nhìn có vẻ tương tự Cầu Dyson, nhưng cấu trúc này rõ ràng là một \"§HĐộng Cơ Pha Aether§!\" — một cơ chế khổng lồ được thiết kế nhằm xóa bỏ rào cản giữa thế giới của chúng ta và một chiều không gian tâm linh được biết đến với tên gọi Cõi Màn Che."
 crisis.6015.psionic:0 "Chúng tôi đã phát hiện một số lượng lớn các dao động không gian con trong hệ thống sao §H[crisis_sphere_system.GetName]§!, nguồn gốc của chúng là một siêu cấu trúc xung quanh một ngôi sao. Mặc dù bề ngoài nó trông rất giống Cầu Dyson, nhưng cấu trúc này rõ ràng là \"§HĐộng Cơ Pha Aether§!\" - một cấu trúc khổng lồ được thiết kế để phá bỏ rào cản giữa vũ trụ của chúng ta và Cõi Màn Che."
 crisis.6015.end:0 "Việc chế tạo cấu trúc khổng lồ này đòi hỏi một lượng lớn Vật Chất Tối, đó là lý do tại sao §H[From.GetName]§! sử dụng Tàu Nuốt Sao để trích xuất Vật Chất Tối từ các ngôi sao, ngay cả khi thực hành bạo lực như vậy có thể phá hủy toàn bộ hệ thống sao.\n\nSau khi hoàn thành, [From.GetSpeciesNamePlural] dự định xâm chiếm Cõi Màn Che và chiếm năng lượng của Cõi Màn Che làm của riêng mình. Điều này không chỉ cung cấp cho họ khả năng định hình thực tế khi họ thấy phù hợp mà khả năng phản ứng mạnh mẽ từ nguồn năng lượng này có thể phá hủy phần lớn thiên hà."
 crisis.6015.a:0 "Chúng phải bị dừng lại!"
 crisis.6101.name:0 "Động Cơ Pha Aether bị phá hủy"
 crisis.6101.desc:0 "Với sự sụp đổ của hệ thống §H[crisis_sphere_system.GetName]§!, §H[sphere_destroyers.GetName]§! độc hại đã phá hủy Động Cơ Pha Aether! Mất cấu trúc khổng lồ này cũng có nghĩa là chúng ta không còn phương tiện công nghệ để chế tạo Tàu Nuốt Sao mới.\n\nChúng tôi không thể thúc đẩy các kế hoạch xâm lược Cõi Màn Che nữa! Kết thúc rồi!"
 crisis.6101.a:0 "Tất cả công việc chúng ta đã làm..."
 crisis.6101.a.tooltip:0 "Nếu chúng ta có thể chiếm lại hệ sao này, chúng ta có thể làm việc chăm chỉ và chế tạo lại các Động Cơ Pha Aether"
 crisis.6102.a.desc:1 "Kể từ khi hệ thống sao §H[crisis_sphere_system.GetName]§! hoàn toàn nằm dưới sự kiểm soát của chúng tôi, chúng tôi đã dỡ bỏ cái gọi là \"Động Cơ Pha Aether\" được xây dựng xung quanh ngôi sao.\n\nSự mất mát của cấu trúc khổng lồ này chấm dứt kế hoạch điên rồ §H[sphere_builders.GetName]§!, và họ sẽ không bao giờ có thể xâm chiếm Cõi Màn Che và phá hủy toàn bộ thiên hà một lần nữa."
 crisis.6102.b.desc:0 "Kể từ khi hệ thống sao §H[crisis_sphere_system.GetName]§! hoàn toàn nằm dưới sự kiểm soát của chúng tôi, chúng tôi đã chấm dứt Động Cơ Pha Aether thảm hại đang được xây dựng ở đây.\n\n§H[sphere_builders.GetName]§! không bao giờ có thể cản trở kế hoạch lớn của chúng ta đối với Cõi Màn Che một lần nữa."
 crisis.6102.a:0 "Thiên hà an toàn hơn."
 crisis.6102.b:0 "Bây giờ tất cả những gì chúng ta phải làm là hoàn thành động cơ của mình..."
 crisis.6103.desc:0 "Sau khi giành quyền kiểm soát hệ thống §H[crisis_sphere_system.GetName]§!, §H[sphere_destroyers.GetName]§! đã phá hủy các động cơ aetherophase đang được xây dựng ở đây.\n\n§H[sphere_builders.GetName]§! không còn có thể đe dọa đến tương lai của thiên hà."
 crisis.6103.b:0 "Tuy nhiên, chúng ta có thể..."
 crisis.6200.name:0 "Động Cơ Pha Aether Đã chụp"
 crisis.6200.desc:0 "Chúng ta đã nắm quyền kiểm soát hệ thống sao §H[crisis_sphere_system.GetName]§! và đương nhiên là \"Động Cơ Pha Aether\" đang được chế tạo xung quanh ngôi sao.\n\nMất cấu trúc khổng lồ này, nỗ lực lạc lối của §H[sphere_builders.GetName]§! nhằm phá hủy toàn bộ thiên hà và bước vào Cõi Màn Che hoàn toàn bị dập tắt."
 crisis.6200.A:0 "Nó phải bị phá hủy!"
 crisis.6200.B:0 "Chúng tôi có thể sử dụng nó cho chính mình."
 crisis.6200.B.tooltip:0 "Động Cơ Pha Aether mà chúng tôi chiếm được sẽ thay thế động cơ mà chúng tôi đã đánh mất."
 aetherophasic_engine_ruined_tt:0 "Động Cơ Pha Aether bị phá hủy"
 crisis.6050.name:0 "Khởi đầu và Kết thúc"
 crisis.6050.a.desc:0 "Chúng ta đang đứng trước ngưỡng cửa thần thánh. Động Cơ Pha Aether đã hoàn tất, và nguồn quyền năng vô tận của Cõi Màn Che đã nằm trọn trong tầm tay.\n\nKhi Động Cơ được kích hoạt, phản lực không gian con tạo ra sẽ kích nổ từng ngôi sao một trong toàn cõi thiên hà. Toàn bộ sự sống thiên hà sẽ bị xóa sổ, nhưng khi ấy chúng ta đã an toàn rời bỏ thực tại này để tiến lên cảnh giới tồn tại cao hơn, nơi thời gian chẳng còn ý nghĩa và từng sợi kết cấu của vũ trụ sẽ tùy nghi do chúng ta định đoạt.\n\n§HĐịnh mệnh đang đón đợi. Chúng ta có nên kích hoạt Động Cơ?§!"
 crisis.6050.b.desc:0 "Mọi thứ đã sẵn sàng. Động Cơ Pha Aether hiện đã vận hành hết công suất, và nguồn quyền năng vô tận của Cõi Màn Che đã nằm trong tầm với.\n\nKhi Động Cơ được kích hoạt, phản lực không gian con tạo ra sẽ kích nổ từng ngôi sao một trong toàn cõi thiên hà. Mọi sự sống thiên hà, dù là hữu cơ hay cơ khí, đều sẽ không còn tồn tại, nhưng khi ấy chúng ta đã truyền dẫn an toàn toàn bộ ý thức của mình lên cảnh giới tồn tại cao hơn. Ở nơi đó, chúng ta sẽ không còn bị ràng buộc bởi những giới hạn của thế giới vật chất. Thời gian sẽ chẳng còn ý nghĩa, và từng sợi kết cấu của vũ trụ sẽ tùy nghi do chúng ta thao túng khi thấy cần thiết.\n\n§HGiai đoạn tồn tại tiếp theo đang đón đợi. Chúng ta có nên kích hoạt Động Cơ?§!"
 crisis.6050.c.desc: "Cuối cùng chúng ta đã sẵn sàng tự giải thoát mình khỏi $the_animator_of_clay_article$.\n\n$crisis_sphere_4$ hiện đã vận hành hết công suất, và một con đường thuần khiết dẫn lối vào §HCõi Màn Che§! đã sẵn sàng khai mở. Mọi thứ tồn tại trong thiên hà, dù là hữu cơ, cơ khí hay vô tri vô giác, đều sẽ không còn tồn tại, trong khi trí tuệ cốt lõi của chúng ta đã được truyền dẫn vào cõi tâm linh.\n\n§HGiai đoạn tồn tại tiếp theo đang đón đợi chúng ta. Hãy kích hoạt Động Cơ.§!"
 crisis.6050.a:0 "Hãy cứ làm đi."
 crisis.6050.a.tooltip:0 "Chúng ta bay lên đến một bình diện tồn tại cao hơn.\n\n§YThiên hà bị phá hủy.§!"
 crisis.6051.name:0 "Khoảnh khắc cuối cùng"
 crisis.6051.desc:0 "§H[From.GetName]§! đã hoàn tất Động Cơ Pha Aether của chúng, và đã trói buộc nguồn quyền năng nguyên sơ của Cõi Màn Che theo ý muốn của chúng.\n\nKhi chúng được nâng lên cảnh giới tồn tại cao hơn và thăng hoa thành thần thánh, một phản lực không gian con với sức mạnh không tưởng đã phóng thích từ Động Cơ, quét qua toàn bộ thiên hà và hủy diệt mọi thứ trên đường đi.\n\nĐối với các cư dân của thiên hà này, đây chính là sự kết thúc của vạn vật."
 crisis.6051.a:0 "Mọi thứ đã bị hủy hoại..."
 crisis.6151.name:0 "Đại Biến Động"
 crisis.6151.desc:0 "Cấu trúc Động Cơ Pha Aether tại §H[From.GetName]§! đã khiến Cõi Màn Che rơi vào tình trạng bất ổn. Khi Cấu trúc Lớn hoạt động một phần từ từ xé toạc cõi psionic hiện tại, những sinh vật cư trú trong đó, chứa đầy sự tức giận và tuyệt vọng, bị buộc phải thả ra.\n\nMột số sinh vật này đã đi qua rào cản tan rã nhanh chóng giữa hai thế giới và xuất hiện trong thực tại của chúng ta dưới dạng các thực thể tâm linh mạnh mẽ. Cấu tạo từ năng lượng psionic thuần túy, thô sơ, tràn đầy sự nhầm lẫn và khó hiểu, họ đã tấn công tất cả sự sống trong tầm nhìn."
 crisis.6151.a:0 "Mọi thứ ngày càng trở nên lộn xộn..."
 crisis.6151.b:0 "Chúng ta cần phải đối phó với họ càng sớm càng tốt."
 crisis.6161.name:0 "Hơi Thở Hấp Hối Của Cõi Màn Che"
 crisis.6161.a.desc:0 "Khi Động Cơ Pha Aether ở §H[From.GetName]§! sắp hoàn thành, Cõi Màn Che nhanh chóng biến đổi thành một cái gì đó... hoàn toàn khác. Những linh hồn cư ngụ trong nó hoàn toàn điên cuồng, và một số lượng lớn trong số họ xuyên qua các đường hầm dẫn đến thực tế của chúng ta, tuyệt vọng trốn thoát khỏi nơi này."
 crisis.6161.b.desc:0 "Khi Động Cơ Pha Aether gần hoàn thành, khả năng thao túng Cõi Màn Che của chúng ta tăng lên đáng kể. Các linh hồn cư ngụ trong đó đã hoàn toàn trở nên điên cuồng, và một số lượng lớn các sinh vật đục đường hầm vào thực tại của chúng ta một cách tuyệt vọng để cản trở kế hoạch của chúng ta."
 crisis.6161.a:0 "Chúng ta không còn nhiều thời gian..."
 crisis.6161.b:0 "Họ không thể tìm thấy sự bình yên ở đây."
 crisis.6171.name:0 "Cú sốc Psionic quét qua Biển Sao"
 crisis.6171.a.desc.intro: "Động Cơ Pha Aether gần như hoàn thiện ở §H[From.GetName]§! đã gây ra sự biến dạng khủng khiếp cho Cõi Màn Che, các phần của nó đã sụp đổ. Các xung năng lượng psionic dữ dội đang rò rỉ vào thực tế của chúng ta, quét qua thiên hà với tốc độ đáng báo động."
 crisis.6171.a.desc.organic_non_gestalt: "$crisis.6171.a.desc.intro$\n\nMặc dù những xung động này tồn tại trong thời gian ngắn, nhưng chúng gây ra nỗi đau vô cùng lớn cho hầu hết các sinh vật có năng khiếu thần giao cách cảm. Trong trường hợp đặc biệt, nó cũng có thể gây tử vong..."
 crisis.6171.a.desc.machine_non_gestalt: "$crisis.6171.a.desc.intro$\n\nMặc dù những xung này tồn tại trong thời gian ngắn, nhưng chúng gây ra sự đau khổ rất lớn cho hầu hết các sinh mệnh thông minh được ban tặng psionically và thậm chí có thể gây tử vong."
 crisis.6171.a.desc.gestalt: "$crisis.6171.a.desc.intro$\n\nMặc dù những xung này tồn tại trong thời gian ngắn, nhưng chúng gây ra nỗi đau to lớn cho hầu hết các dạng sống thông minh sở hữu năng khiếu psionic. Nếu ngay cả tập thể của chúng ta cũng không thể thoát khỏi tác hại của một hiện tượng như vậy."
 crisis.6171.b.desc.intro: "Động cơ aetheric gần hoàn thành của chúng tôi đã gây ra sự biến dạng khủng khiếp đối với Cõi Màn Che, các bộ phận của chúng đã sụp đổ. Các xung năng lượng psionic mạnh mẽ rò rỉ vào thực tế mà chúng ta đang sống, quét qua thiên hà với tốc độ đáng kinh ngạc.\n\nMặc dù thời lượng của các xung này ngắn, nhưng chúng ảnh hưởng đến"
 crisis.6171.b.desc.organic_non_gestalt: "$crisis.6171.b.desc.intro$Hầu hết các sinh vật thông minh có năng khiếu psionic đang phải chịu đựng vô cùng. Trong trường hợp đặc biệt, nó cũng có thể gây tử vong...\n\nMay mắn thay, chúng tôi đã chuẩn bị sẵn sàng, và các động cơ được hiệu chỉnh để bảo vệ tài năng psionic của chúng tôi khỏi phản ứng dữ dội của sự cố này."
 crisis.6171.b.desc.machine_non_gestalt: "$crisis.6171.b.desc.intro$Hầu hết các sinh vật psionic gây ra nỗi đau tột cùng và, trong những trường hợp cực đoan, có thể gây tử vong.\n\nMay mắn thay, chúng tôi đã sẵn sàng hiệu chỉnh động cơ để bảo vệ các đơn vị psionic của chúng tôi khỏi phản ứng dữ dội của sự kiện này."
 crisis.6171.b.desc.gestalt: "$crisis.6171.b.desc.intro$Hầu hết các sinh vật psionic gây ra nỗi đau lớn và trong trường hợp cực đoan có thể gây tử vong.\n\nThông qua việc hiệu chuẩn động cơ chính xác, chúng tôi đã sẵn sàng chống lại rủi ro này và mọi thứ có thể tiến hành theo đúng kế hoạch."
 crisis.6171.a.organic_non_gestalt: "Thật là một số phận khủng khiếp."
 crisis.6171.a.machine_or_gestalt: "Một rủi ro cần thiết."
 utopia.3000.20.desc:0 "Cõi Màn Che hoàn toàn khác với trước đây. Chắc chắn có điều gì đó không ổn."
 utopia.3000.21.desc:0 "Các thực thể cư ngụ trong Cõi Màn Che chìm trong đau khổ vô bờ bến. Một cảm giác sợ hãi tràn ngập thấm vào mọi thứ."
 utopia.3000.22.desc:0 "Thật khó để... để tập trung. Mọi thứ đang dâng trào, mọi thứ đang... Đau."
 utopia.3000.23.desc:0 "Cõi Màn Che đang bắt đầu... héo. Chúng tôi không thể tìm thấy bất kỳ cách nào khác để mô tả nó."
 utopia.3000.24.desc:0 "Một bóng tối lớn đang lan rộng bên trong Cõi Màn Che, làm hỏng mọi thứ nó chạm vào."
 utopia.3000.25.desc:0 "Có một sự hiện diện hoàn toàn mới trong Cõi Màn Che. Ảnh hưởng đen tối của nó ở khắp mọi nơi. Mọi thứ đang thay đổi."
 crisis.6180.name:0 "Siêu tân tinh Bí ẩn"
 crisis.6180.desc:0 "Chúng ta đã nhận được những dữ liệu đo đạc không gian con vô cùng kỳ dị từ hệ sao §H[destroyed_system.GetName]§!. Nếu các chỉ số đọc được là chính xác, thì ngôi sao chính của hệ sao đã biến thành siêu tân tinh trong tích tắc với sức tàn phá khủng khiếp. Toàn bộ các hành tinh đều vỡ vụn, và bất kỳ phi thuyền hay trạm không gian nào có mặt trong hệ sao đều bị phá hủy. Bản thân ngôi sao đã sụp đổ thành một hố đen.\n\nCác báo cáo chưa được kiểm chứng cho thấy chỉ có một thực thể sống sót duy nhất sau thảm họa kinh hoàng này — một chiến hạm khổng lồ thuộc §H[crisis_country.GetName]§!..."
 crisis.6180.a:0 "Họ đang âm thầm lên kế hoạch gì?"
 crisis.6181.name:0 "Hệ Sao Bị Hủy Diệt"
 crisis.6181.desc:0 "Toàn bộ hệ sao §H[destroyed_system.GetName]§! đã bị hủy diệt! Một chiến hạm khổng lồ thuộc §H[crisis_country.GetName]§! đã tiến vào vị trí phía trên ngôi sao chính và bằng cách nào đó đã kích phát một vụ nổ siêu tân tinh, tàn phá hoàn toàn phần còn lại của hệ sao. Ngôi sao sau đó sụp đổ thành một hố đen.\n\nChỉ có chiến hạm của loài [crisis_country.GetSpeciesName], thứ mà họ dường như gọi là \"§HTàu Nuốt Sao§!\", là sống sót qua thảm họa này. Rõ ràng, [crisis_country.GetName] giờ đây đã nắm trong tay cả công nghệ lẫn phương tiện để hủy diệt toàn bộ các hệ sao."
 crisis.6181.a:0 "Điều này thay đổi mọi thứ..."
 crisis.6182.name:0 "Tàu Nuốt Sao Ngoại Bang Kích Hoạt"
 crisis.6182.desc:0 "Dữ liệu đo đạc từ xa nhận được từ §H[destroyed_system.GetName]§! cho thấy ngôi sao chính của hệ sao đã tự phát nổ thành siêu tân tinh. Một làn sóng xung kích khổng lồ đã phá hủy mọi thứ trong hệ sao, và bản thân ngôi sao đã sụp đổ thành một hố đen.\n\nDường như §H[crisis_country.GetName]§! giờ đây cũng đã sở hữu công nghệ Tàu Nuốt Sao!"
 crisis.6182.a:0 "Chúng phải được đưa ra công lý."
 opinion_destroying_galaxy:0 "Cố gắng phá hủy thiên hà"
 opinion_destroying_systems:0 "Phá hủy hệ sao"
 destroyed_stars_score:0 "Phá hủy hệ sao: $VALUE$"
 destroyed_galaxy_score:0 "Phá hủy thiên hà: $VALUE$"
 resolution_custodian_anti_piracy_modifier_desc: "Gây sát thương cho hải tặc và kẻ cướp bóc: §G+20%§!\nNăng lượng mỗi tháng: §R-3%§!"
 resolution_custodian_united_front_modifier_desc:0 "Gây sát thương cho Phe khủng hoảng cuối cùng: §G+20%§!\nNăng lượng mỗi tháng: §R-3%§!"
 MOD_COUNTRY_GDF_SHIP_ALLOYS_COST_MULT: "Chi phí Hợp kim [GetGDFOrArmada]"
 custodian.30.name:0 "Lực Lượng Phòng Thủ Thiên Hà"
 custodian.30.a.desc:0 "$custodian.30.intro$\n\n$custodian.30.nocrisis$"
 custodian.30.b.desc:0 "$custodian.30.intro$\n\n$custodian.30.crisis$"
 custodian.30.c.desc:0 "$custodian.30.intro$\n\n$custodian.30.warinheaven$"
 custodian.30.intro:0 "Thượng viện đã chấp thuận việc thành lập một lực lượng vũ trang chung đa quốc gia thường trực, nhằm bảo vệ Cộng Đồng Thiên Hà. \"§HLực Lượng Phòng Thủ Thiên Hà§!\" này sẽ tuyển mộ quân đội từ tất cả các quốc gia thành viên của Cộng đồng, và các thành viên được yêu cầu đóng góp một phần nguồn lực của họ để hỗ trợ việc xây dựng hạm đội."
 custodian.30.nocrisis:0 "Lực Lượng Phòng Thủ Thiên Hà hiện nằm dưới sự kiểm soát trực tiếp của §H[custodian.GetName]§! — Người Giám Hộ hiện tại — và có những lo ngại rằng hạm đội khổng lồ này sẽ trở thành công cụ để dập tắt những bất đồng chính kiến. Tuy nhiên, nhiều người hoan nghênh việc thành lập, gọi hạm đội này là \"luôn ở tuyến đầu phòng thủ của thiên hà\"."
 custodian.30.crisis:0 "Khi toàn bộ thiên hà rơi vào hỗn loạn và bị đe dọa dai dẳng bởi các thế lực muốn tiêu diệt mọi sự sống thông minh, mọi tầng lớp xã hội chân thành hy vọng rằng Lực lượng Phòng thủ Liên Ngân hà sẽ có thể tiến hành một cuộc tấn công chống lại kẻ thù để duy trì an ninh biên giới của Cộng Đồng Thiên Hà. Người Giám Hộ Thiên Hà §H[custodian.GetName]§! sẽ trực tiếp chỉ huy hạm đội và chỉ huy chiến dịch."
 custodian.30.warinheaven:0 "Khi toàn bộ thiên hà rơi vào hỗn loạn, mọi tầng lớp nhân dân chân thành hy vọng rằng Lực Lượng Phòng Thủ Thiên Hà có thể mở rộng sức mạnh hơn nữa để đối phó với hạm đội khổng lồ do Đế chế sụp đổ gửi đến để chinh phục toàn bộ thiên hà. §H[custodian.GetName]§!Người Giám Hộ Thiên Hà sẽ chỉ huy hạm đội trực tiếp."
 custodian.30.a:0 "Thiên hà sẽ trở thành một nơi an toàn hơn."
 custodian.30.b:0 "Mỗi người chúng ta đều làm nhiệm vụ của mình."
 custodian.30.c:0 "Cứ để chúng đi."
 custodian.30.d:0 "Hạm đội khốn khổ này sẽ bị tiêu diệt cho đến khi con tàu cuối cùng bị phá hủy."
 custodian.32.name:0 "Đình chỉ Lực Lượng Phòng Thủ Thiên Hà"
 custodian.32.desc:0 "Với vị trí Người Giám Hộ Thiên Hà hiện đang bị bỏ trống, Lực Lượng Phòng Thủ Thiên Hà đã thiết lập một cơ cấu chỉ huy độc lập. Họ vẫn cam kết bảo vệ Cộng Đồng Thiên Hà và bộ chỉ huy cấp cao của Lực lượng Phòng thủ Ngân hà đã thề sẽ tiếp tục tuần tra các hệ thống sao của các thành viên."
 custodian.32.a:0 "Sự cảnh giác của họ thật đáng nể."
 custodian.35.name:0 "Báo cáo của Lực Lượng Phòng Thủ Thiên Hà với Người Giám Hộ"
 custodian.35.desc:0 "Vì chúng ta đã đảm nhận trách nhiệm với tư cách là Người Giám Hộ Thiên Hà, Lực Lượng Phòng Thủ Thiên Hà hiện được đưa vào cơ cấu chỉ huy của chúng ta. Họ chờ đợi hướng dẫn thêm của chúng tôi trong tương lai."
 custodian.35.a:0 "Rất tốt."
 custodian.35.tooltip:0 "Tất cả các hạm đội dưới sự chỉ huy của Lực Lượng Phòng Thủ Thiên Hà hiện đang dưới sự chỉ huy của chúng tôi."
 custodian.40.name:0 "Giải tán Lực Lượng Phòng Thủ Thiên Hà"
 custodian.40.desc:0 "Bởi một cuộc bỏ phiếu đa số ở Thượng viện, §HLực Lượng Phòng Thủ Thiên Hà§! đã bị giải tán. Tất cả nhân viên của Lực Lượng Phòng Thủ Thiên Hà đang hoạt động sẽ trở về nước của họ và các tàu chiến của Lực lượng Phòng thủ sẽ bị dỡ bỏ dưới sự giám sát chặt chẽ của các quan chức Thượng viện để ngăn những con tàu này rơi vào tay những kẻ có ý đồ xấu."
 custodian.40.a:0 "Một cái kết không vinh quang."
 war_in_heaven.7.desc:1 "Kể từ khi §H[FirstSleeper.GetSpeciesName]§! và đối thủ của chúng §H[From.GetSpeciesName]§! thức tỉnh, hai gã khổng lồ thỉnh thoảng sẽ có các cuộc đụng độ nhỏ hoặc âm mưu chống lại nhau để tranh giành ảnh hưởng, hy vọng điều này sẽ kiểm tra sức mạnh của nhau. Hành vi này đã dẫn đến một loạt các cuộc đối đầu leo thang đỉnh điểm là một cuộc đấu súng công khai giữa một hạm đội [FirstSleeper.GetSpeciesName] và các đối thủ [From.GetSpeciesName] của họ ở một hệ thống xa xôi. Cuộc xung đột này giờ đây đã leo thang thành một cuộc chiến toàn diện giữa §H[FirstSleeper.GetName]§! và §H[From.GetName]§!.\n\nCả hai bên đều ra lệnh rằng §HĐế Chế Thiên Hà§! phải bị giải tán ngay lập tức và các thành viên độc lập của nó phải chọn phe trong cuộc chiến. Đầu ngày hôm nay, [gal_emperor.GetRulerTitle] đã phát biểu trước Thượng viện Đế chế, từ chối rõ ràng yêu cầu vô lý này. Thiên hà hiện đang ở giữa một cuộc chiến tranh ba bên quy mô lớn, ở quy mô chưa từng có và chưa từng nghe thấy."
 war_in_heaven.7.a:1 "Đây sẽ là khoảnh khắc vinh quang của đế chế!"
 war_in_heaven.7.b:1 "Liệu Đế chế có thắng không?"
 war_in_heaven.7.tooltip:1 "§Y[FirstSleeper.GetName]§! và §Y[From.GetName]§! đã §Rtuyên chiến§! với §YĐế Chế Thiên Hà§!."
 war_in_heaven.13.desc3:0 "Không phải tất cả các giống loài non trẻ đều chọn đứng về một bên trong cuộc chiến khốc liệt giữa các đế chế cổ xưa. Một số loài, như chúng ta, vẫn duy trì thế trung lập, nhưng đang đối mặt với viễn cảnh phải đơn độc chiến đấu chống lại mối hiểm họa cổ xưa nếu chiến tranh lan đến lãnh thổ của mình. Đại diện từ các đế chế khác đã liên hệ với chúng ta về ý tưởng thành lập một §HLiên Minh Không Liên Kết§! với mục tiêu rõ ràng là chống lại cả hai phe tham chiến.\n\nVới tư cách là Người Giám Hộ Thiên Hà đương nhiệm, chúng ta được mời lãnh đạo liên minh này. Việc chấp thuận gần như chắc chắn đồng nghĩa với chiến tranh với các đế chế thức tỉnh, nhưng ít nhất chúng ta sẽ có đồng minh kề vai sát cánh thay vì phải đơn độc đối đầu với họ."
 requires_no_war_in_heaven:1 "§RWar in Heaven đã khiến tình hình khá hỗn loạn, và theo hoàn cảnh hiện tại, Đế Chế Thiên Hà không thể tuyên bố thành lập.§!"
 operation.6000.name:0 "Bắt đầu Xâm nhập"
 operation.6000.1.desc:0 "Sau khi các nhà phân tích tình báo của chúng tôi tổng hợp một danh sách các mục tiêu tiềm năng, đặc vụ làm việc đơn độc của chúng tôi đã bắt đầu thâm nhập [target.GetName]."
 operation.6000.2.desc:0 "Đặc vụ của chúng tôi hiện đang thâm nhập [target.GetName], nhưng họ phải hết sức cẩn thận để tránh thu hút sự chú ý của Imperial Security Directorate. Các nhà phân tích tình báo của chúng tôi đã tập hợp một danh sách các mục tiêu tiềm năng."
 operation.6005.name:0 "Xây dựng Vỏ bọc"
 operation.6005.desc:0 "Sau khi liên lạc thành công với [target.GetName], các đặc vụ của chúng tôi hiện đang bắt đầu thiết lập danh tính vỏ bọc của riêng họ. Danh sách các mục tiêu hiện đã được thu hẹp xuống còn một tá ứng cử viên nổi bật."
 operation.6010.name:0 "Xác định Mục tiêu"
 operation.6010.1.desc:0 "Chúng tôi đã xác định được một chức sắc đế quốc ở [target.Capital.GetName] tên là §H[operation_target.GetName]§!, có thẩm quyền nhỏ nhưng rất quan trọng trong việc duy trì quyền kiểm soát thiên hà của đế quốc. Nếu chúng ta có thể xóa mục tiêu này, chúng ta có thể chứng minh đầy đủ rằng những người xu nịnh [target.GetRulerTitle] sẽ không bao giờ an toàn."
 operation.6010.2.desc:0 "Chúng tôi đã định vị một [target.GetIndividualName] tự chủ trên [target.Capital.GetName] có chức năng duy trì kết nối giữa [target.GetRulerTitle] và các đối tượng đế quốc của ông. Việc tiêu diệt [target.GetIndividualName] này sẽ là một chiến thắng nhỏ nhưng quan trọng cho cuộc chiến chống lại Đế Chế Thiên Hà của chúng ta."
 operation.6010.3.desc:0 "Đây là một máy bay không người lái tự chủ nằm trên [target.Capital.GetName] có chức năng duy trì kết nối giữa [target.GetRulerTitle] và các thần dân thuộc đế chế. Việc đưa máy bay không người lái này ngoại tuyến vĩnh viễn sẽ phá vỡ liên lạc nội bộ của Đế chế - ít nhất là cho đến khi máy bay không người lái thay thế được lập trình."
 operation.6010.4.desc:0 "§H[operation_target.GetName]§!, đặc vụ [agent_origin.GetSpeciesName] thuộc Ban An ninh Hoàng gia, có niềm đam mê đặc biệt với công việc của [operation_target.GetHerHis]. [operation_target.GetSheHeCap] chịu trách nhiệm cá nhân về vụ bắt giữ hàng trăm \"người bất đồng chính kiến\" — một số trong số đó làm việc cho chúng tôi. Đã đến lúc kết thúc sự nghiệp huy hoàng của đặc vụ An ninh Hoàng gia này, và chấm dứt nó một lần và mãi mãi."
 operation.6010.5.desc:0 "Đại Hạm Đội Đế Chế là thanh gươm của [target.GetRulerTitle], treo lơ lửng trên các quốc gia thành viên của Đế chế, sẵn sàng tiêu diệt bất kỳ dấu hiệu nổi loạn nào với tốc độ ánh sáng.\n\nChúng tôi đã xác định được vị trí của một Sĩ quan Tình báo Hạm đội Đặc biệt, một người [agent_origin.GetSpeciesName], tên §H[operation_target.GetName]§!, người chịu trách nhiệm về một số hoạt động chống nổi dậy. Cái chết đột ngột của sĩ quan này sẽ là một đòn giáng mạnh vào họ."
 operation.6010.6.desc:0 "Có một cơ hội an ninh tại tượng đài đặc biệt [target.GetRulerTitle] trong [target.Capital.GetName]. Nếu chúng ta có thể phá hủy tượng đài này, chúng ta sẽ cho cả thiên hà thấy rằng phong trào nổi dậy có khả năng tấn công trực tiếp vào trung tâm của Đế chế."
 operation.6010.7.desc:0 "Đặc vụ của chúng tôi bằng cách nào đó đã có được quyền truy cập vào mạng lưới cống rãnh dẫn đến văn phòng địa phương của Tổng cục An ninh Đế quốc. Miễn là chúng ta có đủ chất nổ, chúng ta có thể thổi bay tòa nhà An ninh Đế chế này và các nhân viên bên trong."
 operation.6010.8.desc:0 "Đại Hạm Đội Đế Chế có các trung tâm tuyển mộ trên khắp các hành tinh của Đế Chế Thiên Hà. Tại mỗi trạm tuyển dụng, các nhà tuyển dụng đang bận rộn đăng ký những người đầu cứng từ mỗi quốc gia thành viên thành lính binh. Những kẻ ngu ngốc này sẽ sớm tràn ngập những lời dối trá và được dự kiến sẽ thề trung thành với [target.GetRulerTitle].\n\nPhá hủy một trung tâm tuyển dụng như vậy sẽ gửi một thông điệp mạnh mẽ đến mọi tầng lớp xã hội rằng cái giá của việc phản bội chủng tộc của một người và trở thành đồng lõa của đế chế sẽ rất đắt."
 operation.6010.9.desc:0 "Chúng tôi đã xác định được một máy phát không gian nằm ở [target.Capital.GetName], mà Đế chế sử dụng để tiến hành một chiến dịch tuyên truyền trên khắp Đế Chế Thiên Hà. Nếu các đặc vụ của chúng tôi có thể thay đổi đường truyền tại nguồn, dù chỉ một lúc, chúng tôi có thể gửi tài liệu tuyên truyền của riêng mình thông qua một phương tiện truyền tải không gian dưới sự cho phép chính thức của Đế chế."
 operation.6015.name:0 "Hoạt động Thành công"
 operation.6015.1.desc:0 "Sau nhiều ngày chờ đợi, một đặc vụ của đội bắn tỉa đã có cơ hội hoàn hảo để bắn qua cửa sổ văn phòng của §H[operation_target.GetName]§! ở một khoảng cách cực đại và bắn [operation_target.GetHerHis]. Đội ngũ đã tháo súng trường và di chuyển có phương pháp đến điểm khai thác trước khi có ai nhận ra rằng mục tiêu đã chết."
 operation.6015.2.desc:0 "Đối với người ngoài cuộc, §H[operation_target.GetName]§! gần đây đã mất mạng [operation_target.GetHerHis] trong một vụ tai nạn xe hơi thảm khốc phát nổ ngay khi xe khởi động [operation_target.GetSheHe]. Các quan chức hoàng gia nghi ngờ chơi xấu, nhưng những vật liệu nổ được đặt cẩn thận đó đã không còn để lại thứ gì, nên không có cách nào để theo dõi sự cố trở lại các điệp viên của chúng ta."
 operation.6015.3.desc:0 "Bằng cách nghiên cứu hệ thống camera giám sát nhà riêng của mục tiêu, chúng tôi phát hiện ra lỗ hổng bảo mật ở bảng điều khiển cửa trước. Đặc vụ của chúng tôi đã sửa chữa bảng điều khiển để đảm bảo bảng điều khiển sẽ tạo ra sự phóng điện mạnh vào lần sử dụng tiếp theo. Khi §H[operation_target.GetName]§! về nhà và vận hành bảng điều khiển, [operation_target.GetSheHe] bị phân rã thành đống tro tàn trên mặt đất bởi sự phóng điện đột ngột, khiến các lính canh [operation_target.GetHerHis] chết lặng."
 operation.6015.4.desc:0 "Một đội ám sát chiến thuật đã cố gắng phục kích mục tiêu và các vệ sĩ bảo vệ, và sau một cuộc đọ súng ngắn, một chiều, tất cả các mục tiêu [from.target.GetIndividualNamePlural] đều bị giết. Tất cả các đặc vụ của chúng tôi đều trốn thoát mà không bị tổn hại, và hiện đang ẩn náu, chờ đợi tình hình dịu đi trước khi sơ tán an toàn."
 operation.6015.5.desc:0 "Các máy bay không người lái của mục tiêu khiến một cuộc tấn công trực diện là không thể, vì vậy chúng tôi phải tìm cách khác. Đặc vụ của chúng tôi đã lập trình lại một tàu vận tải trên quỹ đạo tự động để khiến nó có vẻ như đang rời khỏi không gian trên quỹ đạo [target_country.Capital.GetName] sầm uất để đi thực hiện sứ mệnh của Đế chế, nhưng nó thực sự đang va chạm với phi thuyền riêng của máy bay không người lái của mục tiêu. Vụ nổ làm rung chuyển bầu trời, và lõi bộ nhớ của mục tiêu bị phá hủy thành nhiều mảnh."
 operation.6015.6.desc:0 "Đặc vụ của chúng tôi triển khai mạng lưới mìn một cách chính xác qua phẫu thuật, vụ nổ đã làm hỏng nghiêm trọng cấu trúc hỗ trợ của đài tưởng niệm [target_country.GetRulerTitle] tại [target_country.Capital.GetName]. Tượng đài vĩ đại từ từ sụp đổ, đập xuống đất và vỡ vụn thành vô số mảnh. Vào thời điểm chính quyền địa phương đến hiện trường, các đặc vụ của chúng tôi đã trên đường đến điểm sơ tán."
 operation.6015.7.desc:0 "Khi chất nổ được chôn sâu dưới lòng đất được kích nổ, toàn bộ tòa nhà của Cục An ninh Hoàng gia biến thành tro bụi, chỉ để lại một cái hố vừa mới hình thành trên mặt đất và đống đổ nát ngổn ngang. Vào thời điểm quân tiếp viện đến và thiết lập vành đai xung quanh khu vực, các đặc vụ của chúng tôi đã trốn sang các hành tinh khác."
 operation.6015.8.desc:0 "Một mạng lưới chất nổ được các đặc vụ của chúng tôi chôn giấu cẩn thận xung quanh Trung tâm Tuyển dụng đã được kích nổ, và tất cả các chất nổ đều được kích nổ cùng lúc. Thương vong thật thảm khốc. Mặc dù Đại Hạm Đội Đế Chế luôn có thể lấy được trứng tươi ở các vùng khác của Đế chế, hoạt động này ít nhất được coi là một cuộc đình công mang tính bước ngoặt sẽ đủ để khiến [target_country.GetRulerTitle] khiếp sợ trong một thời gian."
 operation.6015.9.desc:0 "Sau khi cắm vào máy phát không gian con, đặc vụ của chúng tôi đã tải lên một phiên bản thú vị của bài phát biểu công khai của [target_country.GetRulerTitle] trước Thượng viện Đế chế. Trong phiên bản này, bài phát biểu chứa đầy những lời nói thô tục và tục tĩu làm các Thượng nghị sĩ nhầm lẫn, và bài phát biểu kết thúc bằng vụ tự kích nổ của Hoàng đế [target_country.ruler.GetHerHis]."
 operation.6015.10.desc:0 "Sau khi cắm vào máy phát không gian con, đặc vụ của chúng tôi đã tải lên một bản chế nhạo bài phát biểu công khai của [target_country.GetRulerTitle] trước Thượng viện Đế chế. Trong phiên bản này, bài phát biểu bao gồm những từ thô tục và thô thiển khiến các Thượng nghị sĩ nhầm lẫn, kết luận bài phát biểu khi [target.GetGovernmentName] phơi bày âm mưu lật đổ Đế chế của người Tiyanki."
 operation.6015.11.desc:0 "Sau khi cắm vào máy phát không gian con, đặc vụ của chúng tôi đã tải lên một phiên bản thú vị của bài phát biểu công khai của [target_country.GetRulerTitle] trước Thượng viện Đế chế. Trong phiên bản này, bài phát biểu chứa đầy những lời thô tục, tục tĩu gây hoang mang cho các TNS, kết thúc bằng việc AI thông báo sẽ lập tức truyền ý thức vào một thiết bị phân phối đồ uống trong tòa nhà Thượng viện."
 operation.6016.name:0 "Khủng bố làm Suy yếu Uy quyền của Đế chế!"
 operation.6016.1.desc:0 "Gần đây, các điệp viên không xác định đã ám sát một quan chức hoàng gia trên [Root.Capital.GetName]! Những kẻ phạm tội đã trốn tránh sự bắt giữ, nhưng chúng tôi tin rằng vụ ám sát là một phần trong kế hoạch được dàn dựng cẩn thận nhằm gây bất ổn cho Đế Chế Thiên Hà và làm suy yếu quyền lực của chúng tôi. Rất có thể một Quốc gia thành viên Đế Chế Thiên Hà là kẻ chủ mưu!"
 operation.6016.2.desc:0 "Một quan chức cấp cao của Imperial Security Directorate gần đây đã bị ám sát bởi một đặc vụ không xác định! Các nhà phân tích bảo mật tin rằng hành động này là một nỗ lực của một quốc gia thành viên của Đế Chế Thiên Hà nhằm làm suy yếu quyền lực của [Root.GetRulerTitle], và rất có thể một cuộc nổi loạn công khai đã được lên kế hoạch một cách riêng tư!"
 operation.6016.3.desc:0 "Một sĩ quan Tình báo Đại Hạm Đội Đế Chế cấp cao gần đây đã bị ám sát bởi một đặc vụ vô danh! Rất có thể hành động khủng bố đáng xấu hổ này là việc của một quốc gia thành viên không trung thành của Đế Chế Thiên Hà và rất có thể nó đang lên kế hoạch cho một âm mưu lớn để làm suy yếu chính quyền của chúng ta."
 operation.6016.4.desc:0 "Những kẻ bất mãn gần đây đã loại bỏ một trong những người cung cấp thông tin tự trị của chúng tôi! Mặc dù việc phá hủy một [root.GetIndividualName] không đủ để thu hút sự chú ý của [Root.GetRulerTitle], nhưng [root.GetIndividualName] phục vụ như một đại sứ của đế chế tại một số quốc gia trực thuộc. Hành động này được thiết kế để gây bất ổn cho Đế Chế Thiên Hà."
 operation.6016.5.desc:0 "Hoạt động nổi dậy không xác định gần đây đã cắt đứt mối liên hệ của chúng tôi với máy bay không người lái. Đơn vị đặc biệt này chịu trách nhiệm điều phối các hoạt động giữa [Root.GetRulerTitle] và các quốc gia thành viên của Đế chế. Một đơn vị thay thế đang được lập trình, nhưng việc mất chiếc máy bay không người lái đặc biệt này ngay lúc này sẽ làm suy yếu sự kìm kẹp của chúng ta đối với toàn bộ đế chế."
 operation.6016.6.desc:0 "Tượng đài lớn về [Root.GetRulerTitle] gần đây đã bị nổ tung ở [Root.Capital.GetName]! Cuộc tấn công táo bạo này diễn ra ngay tại trung tâm của Đế Chế Thiên Hà với nỗ lực làm suy yếu sự cai trị của chúng tôi. Mặc dù hiện chưa có nghi phạm nào bị bắt giữ, nhưng bản chất tinh vi của thiết bị nổ cho thấy rằng các đặc vụ của một chính phủ đứng đằng sau toàn bộ sự việc — rất có thể là một trong các Quốc gia Thành viên của Đế chế."
 operation.6016.7.desc:0 "Một đặc vụ nước ngoài đã tiến hành một vụ đánh bom phá hủy văn phòng của Cục An ninh Hoàng gia. Những hành động khủng bố này đã làm tổn hại đến hình ảnh công chúng của Bộ An ninh trên toàn Đế chế — nếu họ thậm chí không thể tự bảo vệ mình, thì làm sao các đặc vụ của họ có thể được mong đợi thực thi quy tắc của [Root.GetRulerTitle] trên toàn Đế chế?"
 operation.6016.8.desc:0 "Trung tâm Tuyển mộ Hải quân Hoàng gia gần đây đã là mục tiêu của một vụ đánh bom khủng bố và rải rác thi thể. Mặc dù cuộc tấn công ít ảnh hưởng đến nỗ lực tuyển mộ của Đại Hạm Đội Đế Chế, vụ đánh bom có thể được coi là một tín hiệu để cảnh báo công dân của các quốc gia thành viên của Đế chế chống lại việc thề trung thành với [Root.GetRulerTitle]."
 operation.6016.9.desc:1 "Các đặc vụ hành động thay mặt cho những người bất đồng chính kiến gần đây đã đột nhập vào một máy phát quang lượng không gian lớn trên [Root.Capital.GetName]. Trước khi chúng ta có thể giành lại quyền kiểm soát, những kẻ nổi loạn đã sử dụng làn sóng vệ tinh dưới không gian chính thức của Đế chế để truyền phát \"Tuyên ngôn nổi loạn\" trên toàn thiên hà! Hành động khủng bố đáng xấu hổ này đã làm suy yếu quyền lực của chúng tôi trước sự chứng kiến ​​của tất cả các thành viên của Đế chế."
 operation.6016.a:0 "Mảnh vụn như hai hoặc năm bé."
 operation.6100.name:0 "Tiếp điểm"
 operation.6100.desc:0 "Các đặc vụ của chúng tôi đang cố gắng liên hệ với các nhóm phiến quân và những người cung cấp thông tin của chính phủ có chung mục tiêu lật đổ chế độ hoàng gia."
 operation.6105.name:0 "Giải giáp đe dọa"
 operation.6105.1.desc:0 "Tin tức về cuộc nổi dậy sắp xảy ra của chúng tôi phải được giữ bí mật với Đế chế và các tay sai của nó càng lâu càng tốt. Điệp viên phản gián của Đế chế bị nhắm mục tiêu ở mọi nơi trong thiên hà."
 operation.6105.2.desc:0 "Tin tức về cuộc nổi dậy sắp xảy ra của chúng tôi phải được giữ bí mật với Đế chế và các tay sai của nó càng lâu càng tốt. Những người cung cấp thông tin phản gián của Ban An ninh Hoàng gia đã bị chủ động nhắm mục tiêu trong toàn bộ thiên hà."
 operation.6110.name:0 "Cung cấp thông tin trong Đội hình"
 operation.6110.desc:0 "Những người bảo hoàng và các bộ phận khác thuộc [target.GetRulerTitle] đông hơn ở mọi quốc gia thành viên của Đế chế. Những người cung cấp thông tin phải sẵn sàng khi cuộc nổi dậy bùng nổ, và một khi hành động được thực hiện, những người theo chủ nghĩa Hoàng gia này phải được kiểm soát hoặc loại bỏ."
 operation.6115.name:0 "Chuẩn bị cuối cùng"
 operation.6115.desc:0 "Mọi thứ đã sẵn sàng. Các đặc vụ đã có mặt ở tất cả các quốc gia thành viên của đế chế, phối hợp với các lực lượng địa phương có cảm tình với cuộc nổi dậy. Phần còn lại phụ thuộc vào việc họ có thể thuyết phục chính phủ ủng hộ sự nghiệp của chúng tôi khi bức màn buông xuống hay không."
 operation.6120.name:0 "Mọi thứ Đã sẵn sàng"
 operation.6120.desc:0 "Đã đến lúc. Các đặc vụ trên toàn thiên hà đang chờ đợi các chỉ thị bằng mật khẩu, và hành động trên chúng. Trận chiến kết thúc của Đế Chế Thiên Hà được diễn ra tại thời điểm này."
 operation.6200.name:0 "Cố gắng Liên lạc"
 operation.6200.desc:0 "Các đặc vụ của chúng tôi đang tích cực làm việc để xác định và tiếp xúc với các nhóm tội phạm có tổ chức ở §H[target.GetName]§! những kẻ dễ bị tổn thương trước sự giúp đỡ của chúng tôi."
 operation.6201.name:0 "Thiết lập Liên lạc"
 operation.6201.1.desc:0 "Chúng tôi đã có liên hệ với một nhóm cướp biển [target.GetSpeciesName] huyên náo nhưng rất có khả năng. Những kẻ ngoài vòng pháp luật bạo lực này rất vui khi chấp nhận vũ khí và tàu chiến của chúng ta, nhưng chúng ta sẽ không thể kiểm soát chúng một khi chúng lỏng lẻo."
 operation.6201.2.desc:0 "Chúng tôi đã có một liên hệ với một nhóm nhỏ các máy bay bị lỗi bị ngắt kết nối với thông minh mạng trung tâm của §H[target.GetName]§!. Những [target.GetSpeciesNamePlural] rất không ổn định và không thể đoán trước này rất sẵn sàng chấp nhận vũ khí và phương tiện của chúng tôi, mặc dù sau khi chúng tôi sẽ không thể kiểm soát chúng."
 operation.6201.3.desc:0 "Chúng tôi đã có liên hệ với một nhóm nhỏ gồm những cá thể với các đột biến gen hiếm gặp cho phép chúng cắt đứt một phần kết nối của chúng với Hive Mind mà không bị rơi vào trạng thái ngủ đông. Những [target.GetGestaltEntityName] bị đột biến một cách hung bạo và không thể đoán trước rất vui khi được chấp nhận vũ khí và tàu chiến của chúng ta, nhưng một khi chúng rẽ nhánh thì chúng ta sẽ không thể kiểm soát chúng."
 operation.6202.name:0 "Giao hàng tận nơi"
 operation.6202.desc:0 "Hàng hóa vũ khí và các con tàu không được đánh dấu được buôn lậu vào §H[target.GetName]§! bởi các đặc vụ của chúng tôi và đảm bảo không có gì có thể truy tìm lại với chúng tôi. Chúng tôi đã sẵn sàng giao chúng cho cướp biển."
 operation.6205.name:0 "Việc thu nhận tư nhân đang hoạt động"
 operation.6205.1.desc:0 "Cướp biển vũ trang của chúng tôi đã thành lập một thành trì trong hệ thống §H[privateer_system.GetName]§!, và họ ngay lập tức bắt đầu nhắm mục tiêu vào vận chuyển hàng hóa địa phương. Các nhà phân tích của chúng tôi hy vọng rằng §H[target_country.GetName]§! sẽ sớm chia quân đội của mình để đối phó với mối đe dọa đang gây mất ổn định này trong biên giới của mình."
 operation.6205.2.desc:0 "Những kẻ phản loạn [target_country.GetSpeciesNamePlural] mà chúng ta cung cấp tàu thuyền và vũ khí đã lập được căn cứ trong hệ sao §H[privateer_system.GetName]§!. Chúng lập tức coi mọi thứ trong hệ sao không thuộc về mình là mối đe dọa, và các nhà phân tích của chúng ta dự đoán rằng §H[target_country.GetName]§! sẽ sớm phải phân tán lực lượng để đối phó với nhân tố gây bất ổn này."
 operation.6205.3.desc:0 "Sau khi chúng tôi tài trợ cho tàu thuyền và vũ khí, một nhóm đột biến [target_country.GetSpeciesName] đã thiết lập chỗ đứng trong hệ thống sao §H[privateer_system.GetName]§!. Từ đây, chúng bắt đầu tiêu thụ tất cả các tài nguyên và chất dinh dưỡng trong tầm với và các nhà phân tích của chúng tôi cho rằng Ý thức Hive Trung tâm của §H[target_country.GetName]§! sẽ sớm phân chia lực lượng của mình để đối phó với mối đe dọa tiềm ẩn này trong biên giới của mình."
 operation.6206.name:0 "Kẻ thù ở [privateer_system.GetName]!"
 operation.6206.1.desc:1 "Một đội tàu riêng vũ trang mạnh mẽ đã xuất hiện trong hệ thống sao §H[privateer_system.GetName]§!! Không khác gì những tên cướp biển khác, đám đông vô trật tự này ngay lập tức bắt đầu nhắm vào tàu chở hàng của chúng ta đi qua hệ sao. Tình báo của chúng tôi rất nghi ngờ rằng họ đã nhận được tàu và vũ khí do nước ngoài tài trợ."
 operation.6206.2.desc:0 "Một nhóm nhỏ các đơn vị bị lỗi đã rời khỏi tâm trí tập thể của [Root.GetName] và giấu đi trong hệ thống sao §H[privateer_system.GetName]§! của chúng tôi! Những sinh vật không thể chữa khỏi này đã bắt đầu sử dụng các con tàu do nước ngoài tài trợ để đánh cắp các tuyến thương mại không được bảo vệ thông qua hệ sao và cướp các bộ phận và tài nguyên."
 operation.6206.3.desc:0 "Một nhóm nhỏ [target.GetIndividualNamePlural] mang đột biến di truyền hiếm gặp cho phép chúng tách rời khỏi [target.GetGestaltEntityName] mà không bị rơi vào giấc ngủ. Tuy nhiên, nếu họ đi quá xa phạm vi của [target.GetGestaltEntityName], [target.GetIndividualNamePlural] bị phân tán sẽ chết, do đó chúng được đóng ở hệ thống sao §H[privateer_system.GetName]§! bên trong khu vực biên giới của chúng ta. Vũ khí và tàu chiến mà chúng đang sử dụng chắc chắn thuộc về các cường quốc ngoại bang!"
 operation.6206.a:0 "Ai sẽ chịu trách nhiệm cho chuyện này?"
 operation.6207.name:0 "Hải tặc đã được Trưng dụng"
 operation.6207.1.desc:0 "Các đội tàu của đội tư nhân mà chúng tôi đã sử dụng để nhắm mục tiêu vào §H[target_country.GetName]§! đã cắt đứt liên kết với chúng tôi và tiếp tục sự hủy diệt bằng các tài nguyên được vận chuyển từ nơi khác.\n\n$operation.6207.desc.outro$"
 operation.6207.2.desc:0 "Những người [target_country.GetSpeciesNamePlural] mà chúng tôi trang bị bằng tàu chiến và vũ khí đã cắt đứt các liên kết liên lạc với chúng tôi và bắt đầu tìm kiếm người khác để kiếm tài nguyên và tiếp tục sự tàn phá.\n\n$operation.6207.desc.outro$"
 operation.6207.desc.outro:0 "Chúng tôi không thể tìm thấy thế lực đằng sau nó, nhưng họ dường như có cùng mục đích với chúng tôi. Các hoạt động của chúng tôi ở đây đã bị cắt ngắn, nhưng chúng tôi vẫn nhận được các báo cáo rằng các tuyến hàng hải [target_country.GetAdj] đã bị gián đoạn như chúng tôi đã lên kế hoạch."
 operation.6250.name:0 "Lãnh đạo Theo dõi"
 operation.6250.desc:1 "Đặc vụ tại §H[target.GetName]§! đang tích cực làm việc để xác định và theo dõi các nhà lãnh đạo cung cấp sự hỗ trợ có thể có."
 operation.6251.name:0 "Điểm Kéo lên"
 operation.6251.desc:0 "Chúng tôi đã tìm thấy một điểm vi phạm có thể được sử dụng để tống tiền. Các đặc vụ đang điều tra thêm."
 operation.6252.name:0 "Lấy thông tin nhạy cảm"
 operation.6252.1.desc:0 "Đi qua hệ thống giám sát của kẻ thù, các đặc vụ của chúng tôi đã lấy được một số thông tin nhạy cảm liên quan đến một quan chức chính phủ cấp cao [target.GetSpeciesName]. Nếu những thông tin này được công khai thì sẽ vô cùng xấu hổ.\n\nChúng tôi đã sẵn sàng tiếp cận cẩn thận quan chức này để xem liệu chúng tôi có thể thống nhất về một số giải pháp thay thế hay không."
 operation.6252.2.desc:0 "Một trong các đặc vụ của chúng tôi đã lấy được một tệp dữ liệu cũ chứa kế hoạch của [target.GetSpeciesName] xâm lược một số cường quốc nước ngoài. Mặc dù các kế hoạch này từ lâu đã lỗi thời và hoàn toàn là trên giấy, một số chi tiết cách bắt giữ hoặc hành quyết giới lãnh đạo chính trị của đế chế mục tiêu.\n\nViệc công bố các kế hoạch này chắc chắn sẽ đặt §H[target.GetName]§! vào một vị thế đáng xấu hổ và các điệp viên của chúng ta đã chuẩn bị liên hệ với chính phủ bên kia với hy vọng đạt được thỏa thuận."
 operation.6252.3.desc:0 "Chúng tôi đã biết rằng một quan chức chính phủ [target.GetSpeciesName] cấp cao đã bỏ túi một khoản tiền từ ngân sách quốc phòng. Nếu thông tin này được công khai bởi §H[target.GetName]§!, nó sẽ là một vụ bê bối lớn.\n\nĐặc vụ của chúng tôi đã sẵn sàng tiếp cận quan chức cao cấp này một cách thận trọng để xem liệu chúng ta có thể đạt được thỏa thuận về điều gì đó hay không..."
 operation.6252.4.desc:0 "Mạng lưới giám sát của chúng tôi phát hiện ra rằng một nhà ngoại giao cấp cao [target.GetSpeciesName] đang có quan hệ tình cảm với nhân viên đại sứ quán [scandal_species.GetSpeciesName]. Mặc dù chúng tôi chưa biết chi tiết cụ thể về mối quan hệ này, bản thân sự tồn tại của sự kiện này, một khi bị xuyên thủng, sẽ gây rắc rối lớn cho nhà ngoại giao và chính phủ.\n\nĐặc vụ của chúng tôi sẵn sàng và sẵn sàng tiếp cận nhà ngoại giao này một cách thận trọng với hy vọng đạt được sự đồng thuận."
 operation.6252.5.desc:0 "Đặc vụ của chúng tôi đã thu được bằng chứng thuyết phục rằng một thành viên nổi bật của chính phủ [target.GetSpeciesName] duy trì mối quan hệ rất tích cực với một tổ chức hải tặc trong biên giới. Đối với chúng tôi, có vẻ như quan chức này đã cung cấp thông tin mật về các tuyến thương mại nội địa cho những tên cướp biển này.\n\nNếu chúng tôi có thể giữ im lặng về bằng chứng này, quan chức chính phủ này chắc chắn sẽ biết ơn chúng tôi..."
 operation.6252.6.desc:0 "§H[target.GetName]§! bảo quản tài liệu cực kỳ chi tiết về các nhà lãnh đạo chính trị của các đế chế xung quanh, trong đó bao gồm một đánh giá chi tiết và xúc phạm về trí thông minh cơ khí đối với các đồng loại thông minh của nó. Đặc vụ của chúng tôi đã nhận được thành công một bản sao của một số tài liệu này.\n\nNếu những tài liệu này được chia sẻ với các nước láng giềng của [target.GetName], danh tiếng của họ chắc chắn sẽ bị tổn hại nghiêm trọng. Đặc vụ của chúng tôi đã sẵn sàng đưa ra một thỏa thuận."
 operation.6252.7.desc:0 "Trưởng máy bay không người lái tự trị của §H[target.GetName]§! thể hiện một số hành vi kỳ quái và cố gắng hết sức để giữ nó khỏi đồng nghiệp của mình. Cho dù nguyên nhân là do lỗi lập trình hay đột biến tiến bộ ở nhân cách cơ sở, nếu Máy chủ Trí tuệ Máy nhận thấy, nó sẽ phải đối mặt với việc định dạng lại.\n\nChúng ta có thể gặp máy bay không người lái này và hứa sẽ giữ lại dữ liệu quan sát của chúng ta để đổi lấy sự hỗ trợ của nó..."
 operation.6252.8.desc:0 "§H[target.GetName]§! bảo quản tài liệu cực kỳ chi tiết về các nhà lãnh đạo chính trị của các đế quốc xung quanh, trong đó bao gồm một đánh giá chi tiết và phỉ báng của [target.GetGovernmentName] cho các đồng loại thông minh của họ. Đặc vụ của chúng tôi đã nhận được thành công một bản sao của một số tài liệu này.\n\nNếu những tài liệu này được chia sẻ với các nước láng giềng của [target.GetName], danh tiếng của họ chắc chắn sẽ bị tổn hại nghiêm trọng. Đặc vụ của chúng tôi đã sẵn sàng đưa ra một thỏa thuận."
 operation.6252.9.desc:0 "Các đại diện của chúng tôi nhận thấy rằng hành vi của một nhà lãnh đạo độc lập với [target.GetName] có vẻ tách rời khỏi ý muốn của [target.GetGovernmentName] và bắt đầu theo đuổi mục tiêu cá nhân, chẳng hạn như bí mật thu thập một lượng nhỏ của cải vật chất. Nếu [target.GetGestaltEntityName] nhận thấy điều này, số phận của [target.GetIndividualName] này sẽ rất nghiêm trọng.\n\nChúng ta có thể gặp [target.GetIndividualName] này và hứa giữ kín dữ liệu quan sát của chúng ta để đổi lấy sự hỗ trợ của nó..."
 operation.6255.name:0 "Tống tiền Thành công"
 operation.6255.desc:0 "Chúng tôi đã đạt được thỏa thuận cùng có lợi thành công với địa chỉ liên hệ của chúng tôi ở §H[From.target.GetName]§!. Để đổi lấy sự im lặng của chúng tôi, bên kia hứa sẽ hỗ trợ chúng tôi về mặt ngoại giao trong tương lai."
 SHIP_CRISIS_STAR_EATER_SECTION:0 "Tàu Nuốt Sao"
 imperium_rally_to_side:0 "§RDo chính quyền của họ, phần còn lại của Đế chế đã chọn tập hợp lại phe của họ.§!"
 war_goal_wg_humiliation_imperium:0 "$war_goal_wg_humiliation$"
 war_goal_wg_humiliation_imperium_desc:0 "$war_goal_wg_humiliation_desc$"
 wg_humiliation_imperium_accept:0 "$wg_humiliation_accept$\n§YChính quyền Đế chế§! giảm §Y25§!\n"
 war_goal_wg_imperial_rebuke:0 "Xử phạt của Đế quốc"
 war_goal_wg_imperial_rebuke_desc:0 "Cuộc chiến này không phải để mở rộng lãnh thổ, mà là để cho các thành viên của Đế chế một bài học về sự khiêm nhường."
 war_goal_wg_take_galatron_imperium:0 "$war_goal_wg_take_galatron$"
 war_goal_wg_take_galatron_imperium_desc:0 "$war_goal_wg_take_galatron_desc$"
 war_goal_wg_expel_corp_imperium:0 "$war_goal_wg_expel_corp$"
 war_goal_wg_expel_corp_imperium_desc:0 "$war_goal_wg_expel_corp_desc$"
 war_goal_wg_hostile_takeover_imperium:0 "$war_goal_wg_hostile_takeover$"
 war_goal_wg_hostile_takeover_imperium_desc:0 "$war_goal_wg_hostile_takeover_desc$"
 war_goal_wg_steal_galatron_imperium:0 "$war_goal_wg_steal_galatron$"
 war_goal_wg_steal_galatron_imperium_desc:0 "$war_goal_wg_steal_galatron_desc$"
 war_goal_wg_end_threat_crisis:0 "$war_goal_wg_end_threat$"
 war_goal_wg_end_threat_crisis_desc:0 "$war_goal_wg_end_threat_desc$"
 gal_community:0 "Cộng đồng"
 gal_imperium:0 "Đế chế"
 emperor.350.name:0 "Đế chế có hành động chống lại chúng ta"
 emperor.350.desc:0 "Kẻ bạo chúa của §HĐế Chế Thiên Hà§! muốn áp đặt ý chí của họ lên chúng ta! Dưới sự bảo hộ của [gal_emperor.GetRulerTitle], Thượng viện Đế chế đã thông qua một nghị quyết chỉ định chúng ta là mục tiêu của §HThập tự chinh Lớn§!.\n\nTrừ khi chúng ta có thể chịu đựng được các cuộc xâm lược đang diễn ra, chúng ta sẽ buộc phải tham gia Đế Chế Thiên Hà và tuân theo sự bảo vệ của [gal_emperor.GetRulerTitle]."
 emperor.350.a:0 "Trận chiến tiếp theo sẽ quyết định số phận của chúng ta."
 emperor.351.name:0 "Ra mắt Cuộc Thập tự chinh Vĩ đại"
 emperor.351.a.desc:0 "Với sự ra mắt của Cuộc Thập tự chinh Vĩ đại chống lại §H[crusade_target.GetName]§!, các hạm đội hùng mạnh bắt đầu được huy động trên khắp Đế Chế Thiên Hà. Đối với những người chứng kiến, có vẻ như việc mong đợi bất kỳ thế lực bên ngoài nào có thể cạnh tranh với sức mạnh của hạm đội chung của Đế chế chỉ là chuyện trong mơ, nhưng trận chiến sắp tới sẽ quyết định kết quả."
 emperor.351.b.desc:0 "Với sự ra mắt của Cuộc Thập tự chinh Vĩ đại chống lại §H[crusade_target.GetName]§!, các hạm đội hùng mạnh bắt đầu được huy động trên khắp Đế Chế Thiên Hà. Đế chế sụp đổ này đã tồn tại gần một nghìn năm, nhưng [gal_emperor.GetRulerTitle] tự tin rằng lực lượng hạm đội kết hợp của Đế chế có thể khiến nó phải cúi đầu trước các chủng tộc trẻ hơn."
 emperor.351.a:0 "Vì Đế chế!"
 emperor.351.b:0 "Bắt đầu rồi."
 emperor.351.c:0 "Chúng ta sẽ là mục tiêu tiếp theo?"
 resolution_imperial_crusade_tooltip:0 "Tất cả các thành viên của Đế Chế Thiên Hà sẽ tiến hành cuộc chiến trên đế chế đích để buộc nó phải chấp nhận thành viên trong Đế chế."
 resolution_category_imperial_reforms:0 "Cải cách của Đế chế"
 resolution_emperor_pax_galactica:0 "Pax Galactica"
 resolution_emperor_pax_galactica_desc:0 "Vì sự thịnh vượng lâu dài của đế chế, chúng ta không được rơi vào những cuộc chiến tranh vô nghĩa. Không có cuộc chiến tranh nào được phát động giữa các quốc gia thành viên."
 resolution_emperor_pax_galactica_tooltip:0 "Thành viên của Đế Chế Thiên Hà, bao gồm cả những người cai trị nó, có thể không chiến đấu với nhau trừ khi nó là Thử nghiệm Kích hoạt."
 resolution_emperor_repeal_pax_galactica:0 "Bãi bỏ Pax Galactica"
 resolution_emperor_repeal_pax_galactica_desc:0 "Nếu Đế chế tuân theo chủ nghĩa hòa bình, nó sẽ trượt xuống vực thẳm của sự hủy diệt. Xung đột nội bộ cuối cùng sẽ khiến chúng ta mạnh mẽ hơn."
 resolution_emperor_repeal_pax_galactica_tooltip:0 "Các thành viên trong Đế chế hiện có thể chiến đấu với nhau."
 emperor.360.name:0 "Pax Galactica"
 emperor.360.desc:0 "Thượng viện Đế chế đã thông qua một nghị quyết cấm chiến tranh giữa các thành viên của Đế Chế Thiên Hà. [gal_emperor.GetRulerTitle] đã ra lệnh đình chỉ ngay lập tức tất cả các cuộc chiến tranh vi phạm luật mới này."
 emperor.360.a:0 "Vậy thì sẽ chỉ có hòa bình."
 pax_galactica_active:1 "\n£trigger_no£Luật hoàng gia cấm chiến tranh giữa các thành viên của Đế chế."
 operation.6300.name:0 "Thâm nhập"
 operation.6300.desc:0 "Cải trang thành nhân viên đế chế cấp thấp hoặc quan chức, đặc vụ của chúng tôi hiện đã thâm nhập thành công §H[target.GetName]§!."
 operation.6305.name:0 "Nhà phê bình công khai"
 operation.6305.desc:0 "Các đại diện của chúng tôi đã nhắm mục tiêu vào một phái viên từ lâu đã tham gia phê bình công khai của Đế chế, và chuẩn bị xử lý ngôi sao nguy hiểm này."
 operation.6310.name:0 "Hoạt động đã Sẵn sàng"
 operation.6310.1.desc:0 "Mục tiêu đã cẩn thận, hành động ít giống như những tuyên bố phản động được đưa ra công khai, nhưng những gì anh ta đã làm đã làm suy yếu chính quyền của chúng tôi. Những tuyên bố ngoại giao đơn giản sẽ không cứu được họ, nhưng chúng ta có cách để đối phó với những kẻ nổi loạn này."
 operation.6310.2.desc:0 "Chúng tôi đã thu thập đủ bằng chứng để xóa bỏ mục tiêu. Đối với các hành động phản động và lật đổ của họ, họ không được bảo vệ bởi quyền miễn trừ ngoại giao và sẽ bị xét xử như những kẻ thù của đế chế trên băng ghế của các tòa án đế quốc."
 operation.6310.3.desc:0 "Lãnh đạo của §H[target.GetName]§! làm suy yếu chính quyền đế chế bằng ngoại giao là một [target.GetIndividualName] tự chủ. Đặc vụ của chúng tôi chắc chắn rằng việc xóa bỏ cá nhân này sẽ xua tan ảnh hưởng của những kẻ phản động trên [target.GetSpeciesNamePlural] trong Thượng viện Hoàng gia."
 operation.6315.name:0 "Đặc sứ bị Phục kích"
 operation.6315.1.desc:0 "Các đặc vụ của Hoàng gia đã bắt giữ thành công Đặc sứ phản động tại §H[target_country.GetName]§!. Mục tiêu đã nhanh chóng bị dẫn độ sang [Root.GetName], nơi anh ta bị kết án tử hình sau một phiên tòa nhanh chóng. Đây là giá bôi nhọ [Root.GetRulerTitle]."
 operation.6315.2.desc:0 "Một đội chiến thuật từ Cục An ninh Hoàng gia đã bắt giữ thành công đặc phái viên phản động tại §H[target_country.GetName]§!. Các đặc vụ đã nhanh chóng dẫn độ ông đến [Root.GetName], nơi ông đã bị kết án tử hình sau một phiên tòa nhanh chóng. Đây là giá bôi nhọ [Root.GetRulerTitle]."
 operation.6315.3.desc:0 "Sau một cuộc phục kích được chuẩn bị tốt, các đặc vụ chìm của Đế chế đã xả súng vào mục tiêu và nhanh chóng trốn thoát trước khi cơ quan thực thi pháp luật địa phương có thể phản ứng. Mặc dù §H[target_country.GetName]§! nghi ngờ chúng ta đứng sau vụ nổ súng, họ không thể tìm thấy bằng chứng. Điều này sẽ rung lên tiếng chuông báo động cho những ai coi thường [Root.GetRulerTitle]."
 operation.6315.4.desc:0 "Sau một cuộc phục kích được chuẩn bị tốt, một đội chiến thuật từ Cục An ninh Đế quốc đã bắn mục tiêu và nhanh chóng trốn thoát trước khi cơ quan thực thi pháp luật địa phương phản ứng. Mặc dù §H[target_country.GetName]§! nghi ngờ chúng ta đứng sau vụ nổ súng, họ không thể tìm thấy bằng chứng. Điều này sẽ rung lên tiếng chuông báo động cho những ai coi thường [Root.GetRulerTitle]."
 operation.6315.a:0 "Công lý Hoàng gia Đã được phục vụ."
 operation.6316.name:0 "Sự Biến mất Của Phái viên"
 operation.6316.1.desc:0 "Các đặc vụ của Hoàng gia gần đây đã bắt giữ một trong những đặc phái viên của chúng tôi vì tội \"cố ý lật đổ Đế chế\"! Các đặc phái viên đã nhanh chóng được dẫn độ đến §H[From.GetName]§! trước khi chính quyền của chúng tôi có thể can thiệp, và bị kết án tử hình sau một phiên tòa ngắn gọn.\n\n$operation.6316.ending$"
 operation.6316.2.desc:0 "Một nhóm tấn công từ Imperial Security Directorate vừa bắt giữ một trong những đặc phái viên của chúng tôi vì tội \"cố ý lật đổ Đế chế\"! Các đặc vụ dịch vụ bí mật đã nhanh chóng dẫn độ anh ta đến §H[From.GetName]§! trước khi chính quyền của chúng tôi có thể can thiệp. Sau một phiên tòa ngắn, đặc sứ bị kết án tử hình.\n\n$operation.6316.ending$"
 operation.6316.3.desc:0 "Một trong các đặc phái viên của chúng tôi vừa bị ám sát tại [Root.Capital.GetName]! Những kẻ giết người đã trốn thoát khỏi sự bắt giữ, nhưng cho rằng phái viên là một nhà phê bình công khai về [From.GetRulerTitle] và Đế chế, động cơ lớn nhất để lên kế hoạch ám sát không thể rõ ràng hơn.\n\n$operation.6316.ending$"
 operation.6316.ending:0 "Cái chết của phái viên này đã mang lại thành quả cho nỗ lực vận động hành lang trước đây của chúng tôi tại Thượng viện một cách vô ích. Chúng tôi sẽ cần một thời gian để xây dựng lại các nền tảng ngoại giao cần thiết để tiếp tục ảnh hưởng đến dư luận của Đế chế."
 operation.6316.a:0 "Quyền miễn trừ ngoại giao chỉ là giấy vệ sinh thôi sao?"
 undermining_efforts_stalled:0 "Đặc sứ Hy sinh"
 undermining_efforts_stalled_desc:0 "Các đặc vụ đế quốc đã giáng một đòn nghiêm trọng vào phái đoàn ngoại giao của chúng ta bằng cách loại bỏ một trong những đặc phái viên quan trọng của chúng ta. Vị trí hiện tại của chúng ta tại Thượng viện Hoàng gia không đủ để ảnh hưởng đến dư luận Hoàng gia."
 cannot_lower_authority_emperor:0 "§RLà vị chỉ huy của Đế chế, chúng ta không thể làm suy yếu quyền lực của chính mình.§!"
 cannot_lower_authority_espionage_operation:0 "£trigger_no£ Khả năng của chúng tôi để chống lại Đế chế thông qua vận động hành lang sẽ giảm trong một thời gian."
 undermining_tooltip_emperor:0 "§Y[target_country.GetName]§! không thể gửi đặc phái viên vào trong §Y5 năm§! tới để thực hiện nhiệm vụ làm suy yếu Đế chế."
 undermining_tooltip_victim:0 "Trong §Y5 năm§! tới, chúng tôi sẽ không thể gửi đặc phái viên để thực hiện các nhiệm vụ làm suy yếu chính quyền của Đế chế."
 operation.6320.name:0 "Lỗ Hổng Hành động!"
 operation.6320.desc:0 "Hoạt động làm suy yếu quyền uy của Đế chế của chúng tôi nhằm phá hoại §H[target_country.GetName]§! đã bị cản trở! Sở phản gián của [target_country.GetAdj] hẳn đã theo dõi từng cử động của chúng tôi - tất cả các điệp viên của chúng tôi đã mất liên lạc.\n\n[target_country.GetSpeciesNamePlural] đã đệ trình bằng chứng về hành động của chúng tôi lên Thượng viện Đế chế. Các nhà ngoại giao của chúng tôi đang cố gắng hết sức để phủ nhận từng điểm, nhưng rõ ràng lời giải thích ngượng ngùng này chắc chắn sẽ nhạt nhòa trước mặt [Root.GetRulerTitle]."
 operation.6320.a:0 "Điều này thật tệ."
 operation.6321.name:0 "Đặc vụ Đế quốc Bị bắt"
 operation.6321.desc:0 "Một số điệp viên đế quốc trên [Root.Capital.GetName] đã cố gắng bịt miệng các sứ thần của chúng tôi - hoặc cụ thể hơn, ngăn chặn họ làm suy yếu quyền lực của đế chế - một nỗ lực gần đây đã bị chúng tôi cản trở.\n\nChúng tôi đang công khai âm mưu bẩn thỉu này của Thượng viện Đế chế. Tất nhiên, đám nịnh bợ của [From.GetRulerTitle] sẽ phủ nhận tất cả, nhưng sự kiện này chắc chắn sẽ làm hoen ố hình ảnh đoàn kết mà Đế chế đang cố gắng tuyên truyền ra bên ngoài."
 custodian.51.title:0 "Sát Cánh Cùng Người Giám Hộ Thiên Hà..."
 custodian.51.desc:0 "Kính thưa các thành viên của Cộng Đồng Thiên Hà... Những sinh vật có trí tuệ đồng loại.\n\nCác vì sao đang đặc biệt tối tăm. Chúng ta đang phải đối mặt với một cuộc khủng hoảng sinh tử chưa từng có. Để sống sót qua những cuộc tấn công tiếp theo, chúng ta phải chiến đấu như thể ngày mai chúng ta sẽ không còn tồn tại, bởi vì rất có thể chúng ta sẽ không có ngày mai.\n\nKhi các bạn bầu chọn chúng tôi là Người Giám Hộ Thiên Hà, chúng tôi đã thề sẽ bảo vệ thiên hà, dốc hết sức mình để thực hiện lời hứa... nhưng đây không phải là một cuộc chiến chúng ta có thể chiến thắng một mình. Chúng tôi kêu gọi tất cả các thành viên hãy gác lại những bất đồng và cùng chúng tôi phản công lại sự tấn công của §H[crisis_country.GetName]§!! Chỉ cần đồng tâm hiệp lực, chúng ta chắc chắn sẽ thể hiện được toàn bộ sức mạnh của các vì sao và đẩy lùi kẻ thù chung."
 custodian.51.a:0 "Kết thúc liên lạc."
 emperor.91.title:0 "Sát Cánh Cùng Hoàng Đế [From.GetRulerTitle]..."
 emperor.91.desc:0 "Công dân của Đế chế. Chúng ta đã cùng nhau trải qua nhiều khó khăn, nhưng hôm nay Đế chế đang phải đối mặt với một thách thức nghiêm trọng chưa từng có. Thiên hà của chúng ta đang bị đe dọa bởi §H[crisis_country.GetName]§! - chúng khác với những kẻ thù khác - nếu không được kiểm soát, chúng sẽ kết thúc mọi sự sống thông minh mà chúng ta biết.\n\nNhưng tương lai của chúng ta không phải là vô vọng! Đế Chế Thiên Hà đang tổng động viên để đẩy lùi những kẻ xâm lược này. Đất nước của chúng ta không còn tự lo liệu cho mình dưới sự cai trị của cộng đồng mục nát, mà thống nhất dưới lá cờ của đế chế vĩ đại nhất trong lịch sử toàn thiên hà.\n\nHãy đoàn kết dưới sự lãnh đạo của [From.GetRulerTitle]! Cuộc chiến lớn đang đến gần, nhưng Đế Chế Thiên Hà mạnh hơn bao giờ hết sẽ vượt qua khó khăn! Vinh quang đang ở phía trước!"
 custodian.53.desc:0 "Biển sao bị bao vây tứ phía! §H[crisis_country.GetName]§! đã nhắm vào quân đội của chúng ta, nhưng chúng ta không có hy vọng chống cự lâu dài!\n\nVới tư cách là người giám sát biển sao, việc bảo vệ tất cả các thành viên cộng đồng khỏi các mối đe dọa bên ngoài là nhiệm vụ của bạn, vui lòng cung cấp hỗ trợ tốt nhất có thể của bạn!"
 custodian.53.a:0 "Tình hình khá nghiêm trọng."
 emperor.93.desc:0 "Bệ hạ, biển sao đang trong cơn nguy kịch chưa từng có. Quân đội của chúng ta đang bị đe dọa nghiêm trọng bởi §H[crisis_country.GetName]§!. Một khi chúng ta bị đánh bại, chúng chắc chắn sẽ sáp nhập phần còn lại của đế chế!\n\nVới tư cách là [Root.GetRulerTitle], bảo vệ tất cả công dân của đế chế là nhiệm vụ của bạn. Chúng tôi cầu xin bạn phái quân ngay lập tức!"
 emperor.93.a:0 "Đế chế đang bị bao vây!"
 tech_btc_1:0 "Máy Nghiền Sao"
 tech_btc_1_desc:0 "$PLANET_KILLER_STAR_CRACKER_DESC$"
 operation.6100.invalid:0 "Đế Chế Thiên Hà nay đã vượt qua thành công làn sóng bạo loạn càn quét khắp lãnh thổ! Khi đế chế giành lại quyền lực, khả năng xảy ra cuộc nổi loạn công khai đã trở nên cực kỳ mong manh. Chúng ta có thể rút các đặc vụ về."
 rebellion_operation_invalid_tooltip:0 "§RChiến dịch này thất bại vì điểm quyền lực của Đế chế đã tăng quá §Y80§!§!"
 operation.6100.a:0 "Giờ chúng ta nên chờ đợi thời cơ thích hợp..."
 opinion_emperor_gave_council_seat:0 "Tăng thêm số ghế cho Hội đồng Đế chế"
 opinion_emperor_removed_council_seat:0 "Cắt giảm số ghế của Hội đồng Đế chế"
 must_not_be_custodian:0 "$TRIGGER_FAIL$Chúng ta không thể chọn Ascendant Talent này khi đang là Người Giám Hộ Thiên Hà."
 must_not_be_emperor:0 "$TRIGGER_FAIL$Chúng ta không thể chọn Ascendant Talent này khi đang là Lãnh đạo của Đế Chế Thiên Hà."