 PLANET_KILLER_STAR_CRACKER:0 "Chùm Phá Sao"
 PLANET_KILLER_STAR_CRACKER_ACTION:0 "Kích nổ ngôi sao"
 PLANET_KILLER_STAR_CRACKER_DESC:1 "Một chùm năng lượng tachyon định hướng được bắn thẳng vào ngôi sao, kích phát một vụ nổ siêu tân tinh. Nguồn năng lượng khổng lồ giải phóng từ sự kiện này sau đó được dùng để sản sinh lượng lớn Vật Chất Tối.\n\n§RKhi ngôi sao phát nổ, TOÀN BỘ thuộc địa, siêu cấu trúc và trạm vũ trụ trong hệ sao đều sẽ bị hủy diệt — bao gồm cả của chính chúng ta. Toàn bộ hạm đội trong hệ sao sẽ rơi vào tình trạng Mất Tích (MIA). Duy chỉ có Tàu Nuốt Sao là ngoại lệ duy nhất.§!"
