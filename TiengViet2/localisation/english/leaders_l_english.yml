 leader_trait_supporting_voter_tt:0 "£diplo_weight£§Y[GetGalCommunityOrGalImperium]§!§EHiệu ứng§!: $TABBED_NEW_LINE$—Khi ủng hộ Nghị quyết được thông qua, nhận được 1 §YỦng hộ Ngoại giao§! và 5 §YĐộ tin cậy§! từ quốc gia đề xuất"

 MESSAGE_SUPPORTING_VOTER:0 "Nhận được Ủng hộ Ngoại giao"
 MESSAGE_FAVOR_SUPPORTING_VOTER_DESC:0 "Nhờ kỹ năng của $LEADER$ của chúng ta, chúng ta đã giành được một Ủng hộ Ngoại giao và 5 Độ tin cậy của $WHO|Y$."
 MESSAGE_FAVOR_DELEGATE_FOCUS_DESC:0 "Nhờ kỹ năng của $LEADER$, chúng ta đã giành được một Ủng hộ Ngoại giao của $WHO|Y$."

 leader_trait_diplo_weight:0 "Uy nghiêm Vô thượng"
 leader_trait_diplo_weight_desc:0 "Cách cư xử của Lãnh đạo này có một... thứ gì đó đặc biệt có thể giành được sự tôn trọng. Khi đại diện này phát biểu, mọi người sẽ dừng lại để lắng nghe."

 leader_trait_federal_negotiator:0 "Tình Bằng hữu"
 leader_trait_federal_negotiator_desc:0 "Lãnh đạo này vững tin vào sức mạnh đoàn kết của Liên bang. Sự cống hiến của [Root.GetHisHer] là nguồn cảm hứng cho tất cả chúng ta."

 leader_trait_federal_greeter:0 "Lòng Nhiệt thành"
 leader_trait_federal_greeter_desc:0 "Đại diện Đế chế này có thể nhanh chóng hòa nhập với các thành viên mới của Liên bang, biết cách làm cho họ cảm thấy ấm áp như ở nhà."

 leader_trait_federal_sweet_talker:0 "Chuyển Thù thành Bạn"
 leader_trait_federal_sweet_talker_desc:0 "Chúng ta có thể có những niềm tin khác nhau, nhưng chúng ta có cùng một mục tiêu, cùng một Liên bang, cùng một giấc mơ. Chỉ có đoàn kết mới có thể làm chúng ta tràn đầy sức mạnh."

 leader_trait_federal_joint_navy:0 "Diễn tập Huấn luyện Chung"
 leader_trait_federal_joint_navy_desc:0 "Đoàn kết là sức mạnh. Đôi khi câu nói này chỉ mang ý nghĩa tượng trưng, nhưng đôi khi nó có nghĩa là chúng ta có thể có một hạm đội lớn hơn."

 leader_trait_ambassador_ear_to_the_ground:0 "Tai mắt Khắp nơi"
 leader_trait_ambassador_ear_to_the_ground_desc:0 "Mắt, [root.species.GetEarNamePlural] và các cơ quan cảm giác khác của Lãnh đạo này không chỉ nhiều như những gì bạn thấy, chúng lan tràn khắp vũ trụ."
 leader_trait_ambassador_ear_to_the_ground_machine:0 "$leader_trait_ambassador_ear_to_the_ground$"
 leader_trait_ambassador_ear_to_the_ground_machine_desc:0 "Camera, micro và các cảm biến khác của Lãnh đạo này không chỉ nhiều như những gì bạn thấy, chúng lan tràn khắp vũ trụ."

 leader_trait_ambassador_whisper_networks:0 "Tài Ăn nói Khéo léo"
 leader_trait_ambassador_whisper_networks_desc:0 "Quan chức hành chính này giả vờ là người hay nói chuyện, giỏi thiết lập liên lạc với những nhà lãnh đạo quốc gia không kín miệng."

 leader_trait_ambassador_bully:0 "Thêm Dầu vào Lửa"
 leader_trait_ambassador_bully_desc:0 "Lòng oán hận là một động lực mạnh mẽ. Lãnh đạo này thành thạo trong việc kêu gọi người khác biến những lời phàn nàn cay đắng thành hành động thực tế."

 leader_trait_ambassador_favor_maker:0 "Tùy Cơ Ứng biến"
 leader_trait_ambassador_favor_maker_desc:0 "Đặc phái viên Ngoại giao xảo quyệt này có thể biến mọi sai sót nhỏ mà anh ta nhận thấy thành tài liệu tống tiền."
