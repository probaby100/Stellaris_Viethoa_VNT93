 leader_trait_ambassador_pact_keeper:0 "Nho nhã Lịch thiệp"
 leader_trait_ambassador_pact_keeper_desc:0 "Nghi thức thanh lịch giúp Lãnh đạo này giành được các điều kiện thuận lợi trong quá trình đàm phán các thỏa thuận ngoại giao."

 leader_trait_ambassador_commercial_pact_focus:0 "Tinh thần Doanh nghiệp"
 leader_trait_ambassador_commercial_pact_focus_desc:0 "Thị trường không phải là chiến trường. Chỉ có sự hợp tác toàn diện mới có thể đạt được lợi ích chung và đôi bên cùng có lợi."

 leader_trait_ambassador_research_pact_focus:0 "Trao đổi Nghiên cứu"
 leader_trait_ambassador_research_pact_focus_desc:0 "Chia sẻ kiến thức, trao đổi quan điểm, phối hợp nghiên cứu, cùng nhau tạo ra tương lai."

 leader_trait_ambassador_extra_envoys:0 "Đội ngũ Tùy tùng"
 leader_trait_ambassador_extra_envoys_desc:0 "Lãnh đạo này thích có những người tùy tùng được đào tạo bài bản đi theo [root.GetHerselfHimself]."

 leader_trait_explorer_cloaking_focus:0 "Nghiên cứu Tuyệt mật"
 leader_trait_explorer_cloaking_focus_desc:0 "Tốt nhất là giữ bí mật một số khám phá."
 leader_trait_explorer_cloaking_focus_3_tt:0 "$SHIP_SHIELD_REDUCTION_CLOAKING$ Tối đa: §Y50%§!"

 leader_trait_academic_minor_artifacts_expert:0 "Học giả Cổ vật"
 leader_trait_academic_minor_artifacts_expert_desc:0 "Những gì có thể là đống sắt vụn trong mắt một số người cũng là một báu vật vô giá trong mắt Học giả Tiền phong này. Lãnh đạo tỉ mỉ này sẽ không bao giờ rời khỏi địa điểm khai quật khảo cổ học cho đến khi mọi mảnh vỡ được hiểu rõ hoàn toàn."
 leader_trait_academic_minor_artifacts_expert_tt_intro:0 "Cơ hội tìm thấy các mỏ $r_minor_artifacts$ khi khai quật các Di tích Khảo cổ học:"
 leader_trait_academic_minor_artifacts_expert_tt:0 "$leader_trait_academic_minor_artifacts_expert_tt_intro$§G+$@minor_artifacts_expert_amt_1|0$%§!"
