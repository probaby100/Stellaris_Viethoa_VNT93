 ## Commander
 subclass_commander_admiral:0 "Đô đốc Hạm đội"
 subclass_commander_admiral_desc:0 "Sự chỉ huy quyết đoán của một Đô đốc kiên cường khiến thủy thủ đoàn quyết tâm hơn khi giao chiến với kẻ thù."
 subclass_commander_admiral_hive:0 "$subclass_commander_admiral$"
 subclass_commander_admiral_hive_desc:0 "Dưới sự chỉ huy của một Đô đốc Hạm đội chuyên trách, các hạm đội có thể duy trì sự đoàn kết khi đối mặt với lực lượng địch."
 subclass_commander_admiral_machine:0 "$subclass_commander_admiral$"
 subclass_commander_admiral_machine_desc:0 "Được điều phối bởi một Drone Hải quân chuyên trách, các hạm đội có thể duy trì sự đồng bộ khi đối mặt với lực lượng địch."
 commander_admiral_subclass:0 "§GLãnh đạo Cựu binh chuyên về Hạm đội và Hải chiến Không gian§!"

 subclass_commander_general:0 "Đại tướng Quân đội"
 subclass_commander_general_desc:0 "Sự chỉ huy của Đại tướng Quân đội có thể cải thiện khả năng phối hợp của lục chiến hành tinh."
 subclass_commander_general_hive:0 "$subclass_commander_general$"
 subclass_commander_general_hive_desc:0 "$subclass_commander_general_desc$"
 subclass_commander_general_machine:0 "$subclass_commander_general$"
 subclass_commander_general_machine_desc:0 "$subclass_commander_general_desc$"
 commander_general_subclass:0 "§GLãnh đạo Cựu binh chuyên tấn công Căn cứ sao, Ném bom Quỹ đạo và Xâm lược Hành tinh§!"

 subclass_commander_governor:0 "Ủy viên Giám sát"
 subclass_commander_governor_desc:0 "Ủy viên Giám sát chịu trách nhiệm duy trì trật tự bằng vũ lực, quản lý các hành tinh và khu vực với các quy trình quân sự hóa nghiêm ngặt và tầm nhìn xa."
 subclass_commander_governor_hive:0 "$subclass_commander_governor$"
 subclass_commander_governor_hive_desc:0 "$subclass_commander_governor_desc$"
 subclass_commander_governor_machine:0 "$subclass_commander_governor$"
 subclass_commander_governor_machine_desc:0 "$subclass_commander_governor_desc$"

 subclass_commander_councilor:0 "Chiến lược gia"
 subclass_commander_councilor_desc:0 "Chiến lược gia có cái nhìn tổng quan ưu việt. Hơn là chiến đấu ở tiền tuyến, họ giỏi hơn trong việc duy trì sự đoàn kết của toàn quân và vạch ra các kế hoạch chiến tranh quy mô thiên hà."
 subclass_commander_councilor_hive:0 "$subclass_commander_councilor$"
 subclass_commander_councilor_hive_desc:0 "$subclass_commander_councilor_desc$"
 subclass_commander_councilor_machine:0 "$subclass_commander_councilor$"
 subclass_commander_councilor_machine_desc:0 "$subclass_commander_councilor_desc$"

 ## Official
 subclass_official_delegate:0 "Đại diện Đế chế"
 subclass_official_delegate_desc:0 "Đại diện Đế chế là người phát ngôn lợi ích đại diện cho đế chế chúng ta trong các Liên bang và Cộng đồng Thiên hà."
 subclass_official_delegate_hive:0 "Đại diện Đế chế"
 subclass_official_delegate_hive_desc:0 "$subclass_official_delegate_desc$"
 subclass_official_delegate_machine:0 "Đại diện Đế chế"
 subclass_official_delegate_machine_desc:0 "$subclass_official_delegate_desc$"

 subclass_official_diplomacy_councilor:0 "Đặc phái viên Ngoại giao"
 subclass_official_diplomacy_councilor_desc:0 "Đặc phái viên Ngoại giao chịu trách nhiệm duy trì quan hệ với các đế chế khác, hoặc bằng mưu hèn, hoặc bằng kế bẩn. Họ am hiểu sâu sắc nghệ thuật ngoại giao và sự sâu thẳm của chiến tranh gián điệp."
 subclass_official_diplomacy_councilor_hive:0 "$subclass_official_diplomacy_councilor$"
 subclass_official_diplomacy_councilor_hive_desc:0 "$subclass_official_diplomacy_councilor_desc$"
 subclass_official_diplomacy_councilor_machine:0 "$subclass_official_diplomacy_councilor$"
 subclass_official_diplomacy_councilor_machine_desc:0 "$subclass_official_diplomacy_councilor_desc$"

 subclass_official_governor:0 "Ủy viên Công nghiệp"
 subclass_official_governor_desc:1 "Đối với những Lãnh đạo này, kiến thức và kỹ năng duy trì hạn ngạch sản xuất hoặc thu mua một lượng lớn nguyên liệu thô giống như bẩm sinh."
 subclass_official_governor_hive:0 "Giám sát Sản xuất"
 subclass_official_governor_hive_desc:2 "[owner.GetIndividualName] này được nhân giống đặc biệt để giúp đỡ những người cần người hướng dẫn trong quá trình sản xuất."
 subclass_official_governor_machine:0 "Mạch Hiệu suất"
 subclass_official_governor_machine_desc:1 "Đơn vị này có khả năng tách rời và xóa bỏ những mô hình sản xuất kém hiệu quả đó."

 subclass_official_economy_councilor:0 "Cố vấn Quốc vụ"
 subclass_official_economy_councilor_desc:1 "Cố vấn Quốc vụ quản lý ngân sách thu chi của đế chế chúng ta, những Lãnh đạo này có nền tảng lý thuyết kinh tế sâu sắc."
 subclass_official_economy_councilor_hive:0 "$subclass_official_economy_councilor$"
 subclass_official_economy_councilor_hive_desc:1 "$subclass_official_economy_councilor_desc$"
 subclass_official_economy_councilor_machine:0 "$subclass_official_economy_councilor$"
 subclass_official_economy_councilor_machine_desc:1 "$subclass_official_economy_councilor_desc$"

 ## Scientist
 subclass_scientist_explorer:0 "Người Khám phá"
 subclass_scientist_explorer_desc:1 "Khám phá các hành tinh mới, đăng ký các loài mới, chạm trán với các nền văn minh mới: Lãnh đạo này là người thực hành phương châm này."
 subclass_scientist_explorer_hive:0 "Người Khám phá"
 subclass_scientist_explorer_hive_desc:1 "Khám phá các hành tinh mới, đăng ký các loài mới, chạm trán với các nền văn minh mới: Đây là động lực thúc đẩy chủ đạo của [owner.GetIndividualName] dũng cảm này."
 subclass_scientist_explorer_machine:0 "Người Khám phá"
 subclass_scientist_explorer_machine_desc:1 "Khám phá các hành tinh mới, đăng ký các loài mới, chạm trán với các nền văn minh mới: Đây là động lực thúc đẩy chủ đạo của đơn vị dũng cảm này."

 subclass_scientist_scholar:0 "Học giả Tiền phong"
 subclass_scientist_scholar_desc:0 "Thiên hà đầy rẫy những bí ẩn chưa được biết đến, và Học giả Tiền phong chính là người đến để vén bức màn bí ẩn của chúng. Những nhà nghiên cứu mang tinh thần phiêu lưu này chuyên khai quật các Di tích, khảo sát các Dị thường và các bí mật khác."
 subclass_scientist_scholar_hive:0 "$subclass_scientist_scholar$"
 subclass_scientist_scholar_hive_desc:0 "$subclass_scientist_scholar_desc$"
 subclass_scientist_scholar_machine:0 "$subclass_scientist_scholar$"
 subclass_scientist_scholar_machine_desc:0 "$subclass_scientist_scholar_desc$"

 subclass_scientist_governor:0 "Ủy viên Phân tích"
 subclass_scientist_governor_desc:0 "Ủy viên Phân tích phấn đấu ở tuyến đầu của khoa học, trọng tâm công việc của họ là hướng dẫn các thí nghiệm, nghiên cứu công nghệ mới để đóng góp cho đế chế."
 subclass_scientist_governor_hive:0 "Drone Phân tích"
 subclass_scientist_governor_hive_desc:2 "[owner.GetIndividualName] Phân tích phấn đấu ở tuyến đầu của khoa học, trọng tâm công việc của họ là hướng dẫn các thí nghiệm, nghiên cứu công nghệ mới để đóng góp cho [owner.GetGestaltEntityName]."
 subclass_scientist_governor_machine:0 "Đơn vị Phân tích"
 subclass_scientist_governor_machine_desc:1 "Đơn vị Phân tích phấn đấu ở tuyến đầu của khoa học, trọng tâm công việc của họ là hướng dẫn các thí nghiệm, nghiên cứu công nghệ mới để đóng góp cho đế chế."

 subclass_scientist_councilor:0 "Nhà Thống kê"
 subclass_scientist_councilor_desc:0 "Nhà nghiên cứu là động lực thúc đẩy chính đằng sau mỗi nhóm và dự án nghiên cứu khoa học. Những người này tập trung vào nghiên cứu công nghệ mới, không mệt mỏi theo đuổi kiến thức mới."
 subclass_scientist_councilor_hive:0 "Drone Thống kê"
 subclass_scientist_councilor_hive_desc:0 "Người thống kê là động lực thúc đẩy chính đằng sau mỗi nhóm và dự án nghiên cứu khoa học. Chúng kiên trì theo đuổi kiến thức mới."
 subclass_scientist_councilor_machine:0 "Đơn vị Thống kê"
 subclass_scientist_councilor_machine_desc:0 "$subclass_scientist_councilor_hive_desc$"


 ### TRAITS

 leader_trait_ignore_leader_cap_tt:0 "Không tính vào Dung lượng Lãnh đạo"

 leader_trait_scout:0 "Chuyên gia Trinh sát"
 leader_trait_scout_desc:2 "Lãnh đạo này là một chuyên gia trinh sát, công nghệ chuyên môn này có thể giúp họ tránh được những mối đe dọa nguy hiểm nhất trong không gian."
 leader_trait_scout_hive:0 "Chuyên gia Trinh sát"
 leader_trait_scout_hive_desc:1 "[owner.GetIndividualName] này chuyên về lĩnh vực trinh sát, có thể sử dụng tối đa cảm biến tầm xa của hạm đội."
 leader_trait_scout_machine:0 "Chuyên gia Trinh sát"
 leader_trait_scout_machine_desc:1 "Đơn vị này chuyên về lĩnh vực trinh sát, có thể sử dụng tối đa cảm biến tầm xa của hạm đội."

 leader_trait_restore_point:1 "Khoang Thoát hiểm"
 leader_trait_restore_point_desc:1 "Lãnh đạo quá thận trọng này đã sửa đổi con tàu của [Root.GetHisHer], để [Root.GetHimHer] có thể chỉ huy con tàu từ khoang thoát hiểm, có thể từ bỏ con tàu khi nguy hiểm mới xuất hiện."
 leader_trait_restore_point_effect:0 "Khi hạm đội bị tiêu diệt, Lãnh đạo sẽ không bao giờ chết."

 leader_trait_academia_recruiter:1 "Sĩ quan Tuyển mộ Học viện"
 leader_trait_academia_recruiter_desc:1 "Trong các cơ sở học thuật của chúng ta, sĩ quan tuyển mộ đang ca ngợi đức tính tốt đẹp của việc phục vụ quân đội cho những người giỏi nhất, thông minh nhất. Kinh nghiệm thực tế thu được trên chiến trường là điều không thể dạy trong lớp học, điều này sẽ dẫn dắt sự tiến bộ của kỹ thuật và công nghệ."
 leader_trait_academia_recruiter_effect:1 "Dung lượng Hải quân do các vị trí Nhà nghiên cứu cung cấp: §G+1§!"

 leader_trait_selfcare_expert:0 "Bản sao Nhân bản"
 leader_trait_selfcare_expert_desc:0 "Sau khi Lãnh đạo này chết, họ sẽ được thay thế bằng một bản sao nhân bản có cùng kỹ năng, tính cách và kiểu hành vi."
 leader_trait_selfcare_expert_machine:0 "Bản sao Lưu trữ"
 leader_trait_selfcare_expert_machine_desc:0 "Sau khi Lãnh đạo này ngừng hoạt động, một cỗ máy sao chép có cùng kỹ năng, tính cách và kiểu hành vi như [Root.GetHeShe] sẽ thay thế họ."
 leader_trait_selfcare_expert_hive:0 "Nhân bản [owner.GetIndividualNameCap]"
 leader_trait_selfcare_expert_hive_desc:0 "Sau khi Lãnh đạo này chết, họ sẽ được thay thế bằng một bản sao nhân bản [owner.GetIndividualName] có cùng kỹ năng, tính cách và kiểu hành vi."
 leader_trait_selfcare_expert_effect:0 "Khi chết: Tạo ra một bản sao của Lãnh đạo hiện tại, sở hữu cùng kỹ năng, cấp độ và một nửa tuổi đời."

 leader_trait_midas_touch:0 "Người Kể chuyện Tràn đầy Sức sống"
 leader_trait_midas_touch_desc:1 "Lãnh đạo này thường xuyên làm việc trong không gian sâu thẳm, chứng kiến những nơi xa xôi thực sự đáng kinh ngạc. Những việc làm của [Root.GetHisHer] truyền cảm hứng cho công chúng, cung cấp thông tin về các tài nguyên quý hiếm và các sự kiện Dị thường trong thiên hà."
 leader_trait_midas_touch_effect:4 "Khi hoàn thành Dị thường:\n$tt$Tất cả $scientist_plural_with_icon$ nhận được §G+300§! Kinh nghiệm"

 leader_trait_speed_chaser:0 "Tài hoa Bạc mệnh"
 leader_trait_speed_chaser_desc:0 "Cuộc đời của Lãnh đạo này mãnh liệt và ngắn ngủi như pháo hoa, đốt cháy bản thân để soi đường cho thế hệ sau tiến bước."

 leader_trait_destructive:0 "Kẻ Hủy diệt Thiết bị"
 leader_trait_destructive_desc:0 "Lãnh đạo này thiếu sự cẩn thận đối với du hành vũ trụ và máy móc, dẫn đến việc cần phải sửa chữa thường xuyên và bảo trì liên tục để hoạt động bình thường."

 leader_trait_collective_wisdom:1 "Tỉ mỉ Chu đáo"
 leader_trait_collective_wisdom_desc:2 "Học giả tỉ mỉ này tiến triển công việc chậm chạp, nhưng có thể tạo ra một lượng lớn kết quả nghiên cứu."
 leader_trait_collective_wisdom_effect:2 "Trong quá trình khai quật các Di tích Khảo cổ học nhận được §G+$@trait_collective_wisdom_soc_amt|0$§!$mod_leader_scientists_society_research_produces_add$"
 leader_trait_collective_wisdom_ancrel_effect:1 "Trong quá trình khai quật các Di tích Khảo cổ học nhận được §G+$@trait_collective_wisdom_soc_amt|0$§!$mod_leader_scientists_society_research_produces_add$ và §G+$@trait_collective_wisdom_ma_amt|0$§!£minor_artifacts£$MINOR_ARTIFACTS$"
 leader_trait_collective_wisdom_2:0 "$leader_trait_collective_wisdom$ II"
 leader_trait_collective_wisdom_2_desc:0 "$leader_trait_collective_wisdom_desc$"
 leader_trait_collective_wisdom_2_effect:1 "Khi khai quật Di tích +20£society£§Y$society_research$§!."

 leader_trait_observant:0 "Quan sát Nhạy bén"
 leader_trait_observant_desc:2 "Một bộ máy quét mạnh mẽ tự chế, có thể cho phép Lãnh đạo này nhìn xa hơn, lập kế hoạch xa hơn."
 leader_trait_observant_hive:0 "Quan sát Nhạy bén"
 leader_trait_observant_hive_desc:2 "$leader_trait_observant_desc$"
 leader_trait_observant_machine:0 "Quét Sâu"
 leader_trait_observant_machine_desc:2 "$leader_trait_observant_desc$"

 leader_trait_observant_2_hive:0 "$leader_trait_observant_hive$ II"
 leader_trait_observant_2_hive_desc:0 "$leader_trait_observant_hive_desc$"
 leader_trait_observant_2_machine:0 "$leader_trait_observant_machine$ II"
 leader_trait_observant_2_machine_desc:0 "$leader_trait_observant_machine_desc$"

 leader_trait_resolution_category_focus_favor_intro:0 "Khi bạn ủng hộ một Nghị quyết thuộc danh mục này:\n$tt$"
 leader_trait_resolution_category_focus_favor_outro:0 "Tỉ lệ nhận được 1 §YỦng hộ Ngoại giao§! từ người đề xuất:"
 leader_trait_resolution_category_focus_1_favor_tt:0 "$leader_trait_resolution_category_focus_favor_intro$$leader_trait_resolution_category_focus_favor_outro$§G+$@resolution_focus_amt_1|0$%§!"
 leader_trait_resolution_category_focus_2_favor_tt:0 "$leader_trait_resolution_category_focus_favor_intro$$leader_trait_resolution_category_focus_favor_outro$§G+$@resolution_focus_amt_2|0$%§!"
 leader_trait_resolution_category_focus_3_favor_tt:0 "$leader_trait_resolution_category_focus_favor_intro$$leader_trait_resolution_category_focus_favor_outro$§G+$@resolution_focus_amt_3|0$%§!"

 leader_trait_resolution_category_commerce_focus:0 "Chuyên môn: Thương mại Thiên hà"
 leader_trait_resolution_category_commerce_focus_desc:0 "Đại diện này tỏ ra đặc biệt quan tâm đến tất cả các vấn đề liên quan đến thương mại giữa các vì sao."

 leader_trait_resolution_category_industry_focus:0 "Chuyên môn: Phát triển Công nghiệp"
 leader_trait_resolution_category_industry_focus_desc:0 "Đại diện này tỏ ra đặc biệt quan tâm đến tất cả các vấn đề liên quan đến phát triển công nghiệp."

 leader_trait_resolution_category_politics_traditions_focus:0 "Chuyên môn: Truyền thống Quyền thuật"
