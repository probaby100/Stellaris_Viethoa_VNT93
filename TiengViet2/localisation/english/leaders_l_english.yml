 leader_trait_academic_dig_site_expert:0 "Chuyên gia Khai quật"
 leader_trait_academic_dig_site_expert_desc:0 "Lãnh đạo này đích thân thực hành lao động tay chân, vô cùng thích thú quá trình khảo sát thực địa."

 leader_trait_academic_astral_rift_expert:0 "Người Đi bộ Khe nứt"
 leader_trait_academic_astral_rift_expert_desc:0 "Tiếng gọi của Khe nứt có thể được Học giả Tiền phong này đáp lại."

