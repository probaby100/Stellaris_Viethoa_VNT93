 STARTUP_TEXT: "Chào mừng bạn đến với bản cập nhật Giám Hộ Stellaris 4.5 \"Cygnus\"!\n\n\"Cygnus\" là bản cập nhật tập trung sửa lỗi và hoàn thiện trải nghiệm. Trong chu kỳ này, đội ngũ Giám hộ đã dồn toàn lực khắc phục các sự cố sập game, lỗi mất đồng bộ khi chơi mạng, cùng vô số vấn đề được cộng đồng phản hồi.\n\nPhiên bản 4.5 mang đến một thay đổi cơ chế then chốt, đặt nền móng cho những nội dung dự kiến ra mắt vào cuối năm nay trong bản mở rộng \"Ý Chí\". Giờ đây, các nhóm dân cư sẽ không còn bị phân mảnh theo từng luồng tư tưởng riêng lẻ; mỗi nhóm sẽ là một tập hợp hỗn hợp, trong đó cư dân có thể chuyển dịch qua lại giữa tư tưởng chủ đạo và tư tưởng thứ cấp tùy theo sức hút.\n\nThẻ Chính Sách cũng được làm mới hoàn toàn, cải thiện thứ tự sắp xếp và bổ sung các chính sách giáo điều, giúp bạn kiểm soát cấu hình hạm đội cũng như trạm sao được tạo ra một cách chặt chẽ hơn. Tại giao diện kiến tạo đế chế, bạn cũng có thêm nhiều tùy chọn tùy biến màu sắc bản đồ và chiến hạm.\n\nStellaris hiện đã hỗ trợ trực tiếp vi xử lý Apple Silicon, giúp người chơi sử dụng máy Mac trang bị chip dòng M cảm nhận được hiệu năng cải thiện rõ rệt trong bản cập nhật lần này.\n\nLưu ý rằng, do quy mô làm lại hệ thống dân cư và phe phái là rất lớn, phiên bản 4.5 sẽ không còn tương thích với các tệp lưu và bản mod trước đó. Bạn có thể xem toàn bộ nhật ký cập nhật qua liên kết bên dưới.\n\nChúc bạn có những giờ phút trải nghiệm trọn vẹn và cảm ơn bạn đã đồng hành cùng Stellaris!"
