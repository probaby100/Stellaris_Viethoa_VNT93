 ethic_authoritarian:1 "Chuyên Chế"
 ethic_authoritarian_desc:1 "§LMột quyền lực dẫn đường vững chắc là điều tối thượng cho sự thành bại của bất kỳ nền văn minh nào — nếu không, đất nước sẽ chìm trong vô chính phủ và cảnh hỗn loạn. Trách nhiệm của nhà nước là dẫn dắt muôn dân tiến bước trên con đường mang lại hiệu quả cao nhất.§!\n"
 ethic_fanatic_authoritarian:0 "Cuồng Tín Chuyên Chế"
 ethic_fanatic_authoritarian_desc:1 "§LChung một tiếng nói, chung một quyền uy, chung một quốc gia. Toàn thể muôn dân mang nghĩa vụ thiêng liêng là phục tùng số ít kẻ thông tuệ — những người mang trên vai trọng trách nặng nề dẫn lối toàn thể thần dân.§!\n"
 ethic_egalitarian:0 "Bình Đẳng"
 ethic_egalitarian_desc:1 "§LTrong một xã hội công bằng, mọi cá nhân đều có thể chạm tới vị thế cao hơn nhờ vào nỗ lực lao động của chính mình. Bất kỳ xã hội nào khước từ quyền bình đẳng của các thành viên không chỉ thiếu hụt sự công lý trầm trọng, mà còn hoàn toàn lầm đường lạc lối.§!\n"
 ethic_fanatic_egalitarian:0 "Cuồng Tín Bình Đẳng"
 ethic_fanatic_egalitarian_desc:1 "§LLuôn luôn cảnh giác trước những kẻ ôm mộng độc tài — những kẻ lầm tưởng rằng tham vọng và lợi ích cá nhân của chúng đứng trên những người đi theo mình. Một xã hội không coi trọng nhu cầu và lợi ích của mọi thành viên thì chẳng phải xã hội — đó là một băng nhóm tội phạm.§!\n"
 ethic_xenophobe:0 "Bài Ngoại"
 ethic_xenophobe_desc:1 "§LChúng ta đã liều mình dấn thân vào biển sao hiểm nguy, nơi mọi điều chưa tỏ và chưa biết đều bị nỗi ngờ vực phóng đại khôn lường. Đặt niềm tin vào sinh vật ngoại tộc là chuyện viển vông; ranh giới ngăn cách giữa các giống loài và ý thức hệ sẽ biến vũ trụ thành nơi không có chỗ cho những câu chuyện cổ tích êm đềm.§!\n"
 ethic_fanatic_xenophobe:0 "Cuồng Tín Bài Ngoại"
 ethic_fanatic_xenophobe_desc:1 "§LMọi tàn dư ảnh hưởng từ lũ ngoại bang đều phải bị thẳng tay gột rửa sạch sẽ. Chỉ có giữ mình thuần khiết, kiên định với bản sắc giống nòi và tuyệt đối trung thành với thế giới đã nuôi dưỡng nền văn minh của chúng ta mới giúp ta tránh khỏi sự tha hóa từ những mưu mô hiểm độc của dị chủng. Dẫu thực lực và vị thế của ta có vượt trội hơn loài khác, bấy nhiêu đó vẫn chưa đủ để ta có thể kê cao gối ngủ yên...§!\n"
 ethic_xenophile:0 "Thân Ngoại"
 ethic_xenophile_desc:0 "§LSâu trong tâm khảm mỗi chúng ta luôn ấp ủ nỗi tò mò trước những điều chưa biết; chúng ta sẵn lòng mở lời giao hảo với bất kỳ giống loài nào để mở rộng hiểu biết và thấu triệt nhiều hơn.§!\n"
 ethic_fanatic_xenophile:0 "Cuồng Tín Thân Ngoại"
 ethic_fanatic_xenophile_desc:0 "§LNếu có một chuẩn mực đạo đức tối thượng trong xã hội chúng ta, đó chính là dấn bước vào vũ trụ sâu thẳm, tìm đến những giống loài ngoài hành tinh và hòa làm một với họ. Biển sao bao la vô tận, nhưng chúng ta sẽ không bao giờ cô độc.§!\n"
 ethic_militarist:0 "Quân Phiệt"
 ethic_militarist_desc:1 "§LChúng ta tin rằng phẩm hạnh chân chính duy nhất là lòng dũng cảm và tính kỷ luật. Vũ lực quân sự có thể bảo vệ bản thân vững chắc hơn bất kỳ hiệp ước hay lời thề thốt mong manh nào.§!\n"
 ethic_fanatic_militarist:0 "Cuồng Tín Quân Phiệt"
 ethic_fanatic_militarist_desc:1 "§LGiữa chốn không gian sâu thẳm đầy bơ vơ này, chẳng có gì mang lại tiếng nói đanh thép hơn sức mạnh hỏa lực. Vũ trụ này không phải là chiếc nôi êm ái, và cũng chẳng hề có bất kỳ giới hạn đạo đức nào ràng buộc.§!\n"
 ethic_pacifist:0 "Hòa Bình"
 ethic_pacifist_desc:0 "§LChúng ta tâm niệm rằng mọi việc đều có thể giải quyết trong hòa bình; xung đột chỉ đem lại sự tàn phá, thậm chí hủy hoại chính những thứ mà đôi bên đang nhọc công tranh đoạt.§!\n"
 ethic_fanatic_pacifist:0 "Cuồng Tín Hòa Bình"
 ethic_fanatic_pacifist_desc:0 "§LLà hiện thân của một nền văn minh tiến bộ, chúng ta tin rằng vũ lực không thể giải quyết được bất cứ điều gì. Chiến tranh chỉ mang đến đớn đau và chết chóc, bắt tất cả mọi người phải trả cái giá quá đắt mà vô nghĩa.§!\n"
 ethic_spiritualist:0 "Tâm Linh"
 ethic_spiritualist_desc:1 "§LCó kẻ bảo chúng ta phải luôn nhớ mình nhỏ bé đến nhường nào, sinh mạng ta vô nghĩa ra sao giữa vũ trụ bao la và lạnh lẽo... Thật là một điều phi lý khôn cùng! Chân lý duy nhất mà ta có thể tường tận chính là sự hiện hữu của bản thân. Còn vũ trụ này — dù có được khoác lên bao lời tụng ca hời hợt — cũng chỉ là giấc mộng mà ta tình cờ cùng nhau sẻ chia mà thôi.§!\n"
 ethic_fanatic_spiritualist:0 "Cuồng Tín Tâm Linh"
 ethic_fanatic_spiritualist_desc:0 "§LNền khoa học của chúng ta đã chứng minh rằng ý thức chính là cội nguồn sinh ra thực tại. Chúng ta kiên nhẫn dõi theo những kẻ đang tự huyễn hoặc mình bằng các thế giới quan khác, những kẻ đang nhọc công một cách ngây ngô như con trẻ khi mải mê săm soi từng mảnh 'vật chất hữu hình'.§!\n"
 ethic_materialist:0 "Vật Chất"
 ethic_materialist_desc:0 "§LChúng ta cho rằng một khi giống loài đã vươn mình ra không gian, họ buộc phải rũ bỏ mọi điều ngây ngô, như những thứ hão huyền về thần linh và tôn giáo. Thực tại vốn nghiệt ngã và lạnh lùng; chúng ta giữ vững niềm tin, không ngừng theo đuổi khoa học đến cùng để bảo toàn không gian sinh tồn cho giống nòi.§!\n"
 ethic_fanatic_materialist:0 "Cuồng Tín Vật Chất"
 ethic_fanatic_materialist_desc:0 "§LDẫu có nghiệt ngã, chúng ta vẫn phải trưởng thành và vứt bỏ những quan niệm đạo đức lỗi thời. Chẳng có cái gọi là 'tia lửa tư duy thần thánh' nào ban tặng giá trị đặc biệt cho sinh mệnh cả. Ngoại trừ những gì do chính chúng ta trao cho, không thứ gì mang trong mình giá trị độc nhất vô nhị nội tại. Hãy đón nhận sự tự do của những điều chuẩn xác, và vươn tới hiệu suất tột cùng trên mọi phương diện!§!\n"
 ethic_neutral:0 "Tư Duy Trung Lập"
 ethic_neutral_desc:0 "§LTư tưởng của họ pha trộn nhiều chiều hướng; bất kỳ khuynh hướng nào cũng có thể hiện hữu trong xã hội của họ.§!"
 ethic_gestalt_consciousness:0 "Ý Thức Tập Thể"
 ethic_gestalt_consciousness_desc:0 "§LBước vào cõi hư không.\nVạn vật hòa làm một.§!"

