 trait_pc_shattered_ring_habitable_preference:0 "Ưa thích Thế giới Vành đai"
 trait_pc_shattered_ring_habitable_preference_short:0 "Thế giới Vành đai"
 trait_pc_shattered_ring_habitable_preference_desc:0 "$trait_pc_arctic_preference_desc$"
 trait_pc_gaia_preference_terraforming:0 "$trait_pc_gaia_preference$"
 trait_pc_gaia_preference_terraforming_short:0 "$trait_pc_gaia_preference_short$"
 trait_pc_gaia_preference_terraforming_desc:0 "§LSở thích khí hậu được thiết lập ở mức độ gen, trong trường hợp này, đó là do một sự cố.§!"
 gaia_preference_terraforming_trait_tooltip: "$MOD_POP_BONUS_WORKFORCE_MULT$ trên Thế giới Gaia: §G+5%§!"
 trait_dry_planet_preference: "Ưa hành tinh khô ráo"
 trait_dry_planet_preference_short:0 "Hành tinh khô ráo"
 trait_dry_planet_preference_desc: "§LSở thích khí hậu đã được thiết kế sẵn.§!"
