 clone_army:0 "Quân Nhân bản"
 clone_army_plural:0 "Quân Nhân bản"
 clone_army_desc:1 "Lính nhân bản có thể trưởng thành chỉ trong vài tháng. Dù tuổi thọ chưa đến chục năm và thiếu tính chủ động, nhưng lòng trung thành tuyệt đối với cấp trên đã bù đắp cho những khuyết điểm đó."
 robotic_army:1 "Quân xung kích Robot"
 robotic_army_plural:0 "Quân Robot"
 robotic_army_desc:0 "Cỗ máy máu lạnh sinh ra để chiến đấu, chúng sẵn sàng trả mọi giá để hoàn thành nhiệm vụ, và không hề bị ảnh hưởng bởi sĩ khí như quân đội sinh học."
 robotic_defense_army:0 "Quân phòng vệ Robot"
 robotic_defense_army_plural:0 "Quân phòng vệ Robot"
 robotic_defense_army_desc:0 "$robotic_army_desc$"
 shroud_forged_defense_army: "Quân phòng thủ Rèn từ Hư Cảnh"
 shroud_forged_defense_army_plural: "Quân phòng thủ Rèn từ Hư Cảnh"
 shroud_forged_defense_army_desc: "Những cơ thể người tổng hợp được đồng điệu linh năng bảo vệ thế giới của chúng, tiếp nhận lòng quyết tâm từ Hư Cảnh — một niềm tin mà các đơn vị máy móc thuần túy không thể nào đạt tới."
 android_army:1 "Quân xung kích Android"
 android_army_plural:0 "Quân Android"
 android_army_desc:1 "Những binh lính bán tự động cấu thành nên cỗ máy chiến tranh trơn tru này. So với Robot thông thường, lính Android linh hoạt hơn, hung hãn hơn và biết cách xử lý các tình huống chiến trường đa dạng."
 android_defense_army:0 "Quân phòng vệ Android"
 android_defense_army_plural:1 "Quân phòng vệ Android"
 android_defense_army_desc:0 "$android_army_desc$"
 psionic_army:0 "Quân Linh năng"
 psionic_army_plural:0 "Quân Linh năng"
 psionic_army_desc:0 "Lực lượng sở hữu năng lực tâm linh. Sức mạnh linh năng hủy diệt cho phép họ áp dụng các chiến thuật độc đáo trên chiến trường — mục tiêu hàng đầu thường là bẻ gãy ý chí chiến đấu của kẻ thù."
 xenomorph_army:0 "Quân Dị hình"
 xenomorph_army_plural:0 "Quân Dị hình"
 xenomorph_army_desc:0 "Hàng ngàn quái thú đói khát với nanh vuốt sắc nhọn và bản năng khao khát chém giết, được lai tạo từ kỹ thuật sinh học. Một nhóm khoa học gia đứng ở hầm ngầm kiên cố cách xa tiền tuyến để giám sát và lùa bầy thú điên cuồng này ra trận."
 gene_warrior_army:0 "Quân Chiến binh Gen"
 gene_warrior_army_plural:1 "Quân đoàn Chiến binh Gen"
 gene_warrior_army_desc:0 "Siêu chiến binh biến đổi gen. Họ là những lính mới tinh anh được tuyển chọn từ các đơn vị truyền thống, sau đó trải qua quá trình chỉnh sửa gen để trở nên to lớn hơn, mạnh mẽ hơn và nhanh nhẹn hơn gấp bội."
 swarm_army:0 "Bầy đàn Prethoryn"
