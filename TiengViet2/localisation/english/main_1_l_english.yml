 STORM_DEVASTATION: "Mức Tàn Phá Của Bão"
 STORM_DEVASTATION_TOOLTIP: "§K$STORM_DEVASTATION$§!\nTùy chọn này kiểm soát mức độ tàn phá mà bão vũ trụ gây ra khi quét qua hành tinh."

 building_foundry_upkeep_1: "Nhà Máy Tái Chế Hợp Kim"
 building_foundry_upkeep_1_desc: "Trung tâm này chuyên ứng dụng công nghệ tân tiến để luyện các mảnh vụn và phế liệu thành những thanh hợp kim giá trị."
 building_factory_upkeep_1: "Trung Tâm Tái Sử Dụng"
 building_factory_upkeep_1_desc: "Thông qua các hoạt động trao đổi và gom nhặt đồ cũ, chúng ta có thể đưa những món đồ tiêu dùng sắp hết hạn sử dụng quay trở lại phục vụ đời sống."
 building_foundry_efficiency_1: "Phòng Thí Nghiệm Luyện Kim"
 building_foundry_efficiency_1_desc: "Bằng cách kết hợp các lý thuyết tiên phong với những nghiên cứu đã qua kiểm chứng thực tế, chúng ta có thể nâng cao vượt bậc hiệu suất luyện kim."
 building_factory_efficiency_1: "Trung Tâm Thiết Kế Phân Tán"
 building_factory_efficiency_1_desc: "Việc bắt tay thiết kế cùng những người tiêu dùng đáng tin cậy sẽ giúp tối giản quy trình sản xuất và cắt giảm chi phí."

 building_research_upkeep_1: "Trạm Tiếp Tế Nghiên Cứu"
 building_research_upkeep_1_desc: "Một đầu mối tập trung giúp tinh giản việc cung ứng và phân bổ vật tư nghiên cứu, giảm thiểu tối đa tình trạng lãng phí và trì trệ trên toàn cầu."
 building_research_efficiency_1: "Viện Lý Thuyết Định Hướng Dữ Liệu"
 building_research_efficiency_1_desc: "Bằng cách cung cấp khối lượng dữ liệu thực nghiệm khổng lồ cho các nhà lý thuyết, chúng ta có thể nâng cao đáng kể hiệu suất nghiên cứu."

 diplomatic_actions: "Hành Động Ngoại Giao"
