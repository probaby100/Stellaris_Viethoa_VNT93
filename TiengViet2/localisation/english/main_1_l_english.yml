 FE_FALLEN_EMPIRES_TOOLTIP:1 "§HSố lượng Đế Chế Sa Ngã§!\nTùy chọn này kiểm soát số lượng ['concept_fallen_empires'] tối đa được phép xuất hiện trong thiên hà."
