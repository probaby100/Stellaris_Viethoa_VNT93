 starting_ftl_hyperdrive:0 "Di chuyển qua siêu không gian"
 starting_ftl_wormhole:0 "Di chuyển qua lỗ sâu"
 starting_ftl_warp_desc:0 "Động cơ bẻ cong không gian tạo ra một bong bóng không gian phụ quanh tàu, giúp tàu bay nhanh hơn ánh sáng. Dù có thể tự do chọn đường bay, nhưng tốc độ bay vẫn khá chậm so với khoảng cách khổng lồ giữa các vì sao."
 starting_ftl_hyperdrive_desc:0 "Động cơ siêu không gian tạm thời phá vỡ rào cản chiều không gian, đưa con tàu vào vùng siêu không gian. Dù có thể bay rất nhanh giữa các vì sao, sự tự do di chuyển lại bị giới hạn bởi mạng lưới các tuyến đường siêu không gian hiện có."
 starting_ftl_wormhole_desc:0 "Máy tạo lỗ sâu sẽ mở ra một đường hầm trong không gian phụ để kết nối hai tọa độ, cho phép đi qua những quãng đường cực xa. Tuy nhiên, thiết bị này quá lớn để gắn trên tàu thông thường, nên cần một trạm không gian đặc biệt để thực hiện chuyến bay."
 RECOMMENDED_BEGINNER:0 "§G(Người mới)§!"
 RECOMMENDED_ADVANCED:0 "§R(Người chơi có kinh nghiệm)§!"

 TOOLTIP_SETUP_APPEARANCE:1 "§H$PORTRAIT$§!\nChọn nhóm và diện mạo cho loài của bạn."
 TOOLTIP_SETUP_SPECIES_NAME:1 "§H$SPECIES_EMPIRE_NAME$§!\nChọn tên cho chủng loài và đế chế của bạn."
 TOOLTIP_SETUP_TRAITS:1 "§H$TRAITS$§!\nChọn các đặc điểm cho loài của bạn."
 TOOLTIP_SETUP_RULER:1 "§H$RULER$§!\nTùy chỉnh người đứng đầu đầu tiên của bạn. Xin lưu ý rằng ở một số thể chế, người đứng đầu sẽ thay đổi thường xuyên, đồng thời họ cũng sẽ sinh lão bệnh tử."
 TOOLTIP_SETUP_NAME_CLASS:1 "§H$GOVERNMENT_VIEW_CAPITAL_LABEL$§!\nChọn phân lớp hành tinh quê nhà và tùy chỉnh tên của nó. Phân lớp hành tinh bạn chọn cũng sẽ là loại hành tinh chính cho chủng loài của bạn.\n\nChủng loài của bạn có thể định cư trên các phân lớp hành tinh khác tùy thuộc vào mức độ khác biệt của chúng so với phân lớp hành tinh quê nhà."
 TOOLTIP_SETUP_CITY_APPEARANCE:1 "§H$CITY_GRAPHICS$§!\nVui lòng chọn kiểu dáng đô thị cho nền văn minh của bạn. Kiểu dáng đô thị không ảnh hưởng đến sự phát triển trong trò chơi."
 TOOLTIP_SETUP_GOVERNMENT:1 "§H$ETHICS_AND_GOVERNMENT$§!\nVui lòng chọn hệ tư tưởng và thể chế cho đế chế của bạn. Hệ tư tưởng bạn chọn sẽ quyết định những thể chế nào bạn có thể sử dụng."
 TOOLTIP_SETUP_EMPIRE_ADVISOR:0 "§H$EMPIRE_ADVISOR$§!\nChọn giọng nói cho các cảnh báo và thông báo."
 TOOLTIP_SETUP_EMPIRE_NAME:1 "§H$EMPIRE_NAME$§!\nVui lòng tự đặt tên cho đế chế của bạn."
 TOOLTIP_SETUP_FLAG:1 "§H$EMPIRE_FLAG$§!\nTùy chỉnh lá cờ cho đế chế của bạn."
 TOOLTIP_SETUP_EMPIRE_NAMELIST:1 "§H$CUSTOMIZE_NAME_LISTS$§!\nChọn một danh sách tên có sẵn cho tàu, người đứng đầu và hành tinh của bạn."
 TOOLTIP_SETUP_SPECIES_EMPIRE_NAMES: "§H$NAMES$§!\nTùy chỉnh tên loài và tên đế chế của bạn."
 TOOLTIP_SETUP_WEAPONS:1 "§H$STARTING_WEAPONS$§!\nVui lòng chọn một công nghệ vũ khí khởi đầu cho đế chế của bạn.\n\nBạn có thể đổi loại vũ khí muốn trang bị trong quá trình chơi. Nếu muốn thay đổi vũ khí trên tàu, hãy xem trong: §YBản thiết kế tàu§!."
 TOOLTIP_SETUP_FTL:1 "§H$FTL_LABEL$§!\nChọn cách thức bay của bạn. Trước khi mở khóa các công nghệ cực hiếm, bạn sẽ không thể thay đổi cách bay. Đồng thời, phương thức bay nhanh hơn ánh sáng cơ bản của bạn sẽ không bao giờ thay đổi."
 TOOLTIP_SETUP_SHIP_APPEARANCE:1 "§H$SHIP_GRAPHICS$§!\nVui lòng chọn thiết kế tàu không gian cho đế chế của bạn."
 SECONDARY_SPECIES:0 "Loài phụ"
 TOOLTIP_SETUP_SECONDARY_SPECIES_APPEARANCE:0 "§H$PORTRAIT$§!\nChọn diện mạo cho loài phụ của bạn."
 TOOLTIP_SETUP_SECONDARY_SPECIES_NAME:0 "§H$SPECIES_NAME$§!\nĐặt tên cho loài phụ của bạn."
 TOOLTIP_SETUP_SECONDARY_SPECIES_NAMELIST:0 "§H$CUSTOMIZE_NAME_LISTS$§!\nChọn danh sách tên có sẵn cho các người đứng đầu thuộc loài phụ của bạn."
 TOOLTIP_SETUP_SECONDARY_SPECIES_TRAITS:0 "§H$TRAITS$§!\nChọn các đặc điểm cho loài phụ của bạn."

