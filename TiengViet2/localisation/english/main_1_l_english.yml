 garrison_army_plural:2 "Dân quân"
 garrison_army_desc:2 "Mỗi hành tinh đều có lực lượng dân quân phòng vệ, quy quy mô phụ thuộc vào số dân. Dân quân không thể được vận chuyển đi nơi khác."
 slave_army:0 "Quân Nô lệ"
 slave_army_plural:0 "Quân Nô lệ"
 slave_army_desc:0 "Những binh lính nô lệ chiến đấu cho chủ nhân của mình. Phần lớn bị ép buộc ra trận, nhưng cũng có một số tình nguyện tham gia để đổi lấy thức ăn hoặc trốn tránh lao động cực nhọc."
