 FE_RANDOMIZE_FALLEN_EMPIRES_TOOLTIP:1 "Nếu chọn, một số lượng Đế Chế Sa Ngã ngẫu nhiên sẽ được sinh ra, tối đa bằng mức đặt trên thanh trượt."
