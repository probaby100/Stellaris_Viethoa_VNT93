 starting_weapons_lasers_desc:1 "Loại vũ khí sử dụng trực tiếp năng lượng này sẽ bắn ra tia laser, rất hiệu quả với kẻ địch ở khoảng cách gần và vừa. Nó có thể xuyên qua lớp giáp của địch, nhưng lại bị hệ thống lá chắn khắc chế."
 starting_weapons_projectiles_desc:1 "Máy gia tốc vật chất có khả năng từ hóa đạn và bắn chúng đi với tốc độ cao. Dù tầm bắn có hạn, nhưng lực đẩy mạnh và tốc độ bắn nhanh của chúng có thể dễ dàng chọc thủng lá chắn."
 starting_weapons_missiles_desc:0 "Tên lửa không gian sâu được trang bị đầu đạn hạt nhân. Tầm bắn của chúng cực xa, nhưng cũng dễ bị hệ thống phòng thủ đánh chặn."
