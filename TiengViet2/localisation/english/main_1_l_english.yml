 NUM_NOMAD_EMPIRES: "Đế chế Du mục ngẫu nhiên"
 FE_NOMAD_EMPIRES_TOOLTIP: "§HSố lượng Đế chế Du mục Ngẫu nhiên§!\nTùy chọn này kiểm soát số lượng đế chế AI tạo ngẫu nhiên sẽ là ['concept_nomadic_empires', Đế Chế Du Mục] khi bắt đầu trò chơi."
 NUM_HABITABLE_WORLDS:0 "Hành tinh sống được"
 FE_HABITABLE_WORLDS_TOOLTIP:1 "§HHành tinh sống được§!\nTùy chọn chỉnh tỷ lệ sinh ra các hành tinh ở 'vùng vàng' của hệ sao, tức là hành tinh sống được. Tăng thông số này sẽ làm thiên hà có nhiều hành tinh sống được hơn. Kể cả khi đặt là §Y$FE_HABITABLE_WORLDS_RARE$§!, hành tinh sống được vẫn xuất hiện, nhưng chỉ ở các hệ sao cụ thể.\n\n§RCảnh báo:§! Tăng thông số này vượt mức 1x có thể gây giật lag cuối game."
 FE_HABITABLE_WORLDS_RARE: "Hiếm"
 RESOURCE_ABUNDANCE: "Độ dồi dào tài nguyên"
 FE_RESOURCE_ABUNDANCE_TOOLTIP: "§HĐộ dồi dào tài nguyên§!\nThiết lập này điều chỉnh tỷ lệ các thiên thể xuất hiện mỏ tài nguyên khi tạo lập thiên hà. Ở mức thấp nhất, mỏ tài nguyên vẫn sẽ xuất hiện nhưng chỉ nằm trong những hệ sao đặc biệt.\n\n§RCảnh báo:§! Tùy chọn này có thể ảnh hưởng đến độ cân bằng của trò chơi nếu đặt giá trị quá thấp hoặc quá cao."
 FE_RANDOMIZE:0 "Ngẫu nhiên"
 FE_RANDOMIZE_EMPIRES_TOOLTIP:1 "Nếu chọn sẽ sinh ra lượng đế chế máy ngẫu nhiên, tối đa bằng mức đặt trên thanh trượt."
