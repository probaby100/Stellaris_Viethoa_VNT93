 trait_pc_alpine_preference:0 "Ưa hành tinh đồi núi"
 trait_pc_alpine_preference_short:0 "Đồi núi"
 trait_pc_alpine_preference_desc:1 "§LSở thích khí hậu được quyết định bởi gen, do quá trình tiến hóa lâu dài hoặc bị can thiệp nhân tạo tạo ra.§!"
 trait_pc_savannah_preference:0 "Ưa hành tinh thảo nguyên"
 trait_pc_savannah_preference_short:0 "Thảo nguyên"
 trait_pc_savannah_preference_desc:1 "§LSở thích khí hậu được quyết định bởi gen, do quá trình tiến hóa lâu dài hoặc bị can thiệp nhân tạo tạo ra.§!"
 trait_pc_arctic_preference:0 "Ưa hành tinh vùng cực"
 trait_pc_arctic_preference_short:0 "Vùng cực"
 trait_pc_arctic_preference_desc:2 "§LSở thích khí hậu được quyết định bởi hàng tỷ năm tiến hóa, hoặc nhờ thiết kế và điều chỉnh gen nhân tạo.§!"
 trait_pc_ocean_preference:0 "Ưa hành tinh đại dương"
