 FE_LOGISTIC_CEILING:0 "Giới hạn tăng trưởng theo đường cong S"
 FE_LOGISTIC_CEILING_TOOLTIP:1 "§H$FE_LOGISTIC_CEILING$§!\nKhi dân số hành tinh ở khúc giữa đường cong S, tùy chọn này quyết định mức điểm cộng cho tốc độ tăng trưởng. Càng cao, dân số tăng càng nhanh.\n\n§RCảnh báo:§! Tăng tùy chọn này có thể làm giảm hiệu năng cuối game và mất cân bằng."
 FE_GROWTH_SCALE:0 "Hệ số nhu cầu tăng trưởng"
 FE_GROWTH_SCALE_TOOLTIP:1 "§H$FE_GROWTH_SCALE$§!\nĐiều chỉnh tốc độ tăng dân số dựa trên tổng dân số đế chế. Càng cao, dân số tăng càng chậm.\n\n§RCảnh báo:§! Giảm tùy chọn này có thể gây giật lag nghiêm trọng và mất cân bằng, khuyến cáo nên giảm cả §Y$FE_LOGISTIC_CEILING$§! đi kèm."
 FE_LOGISTICS_FLEET_UPKEEP: "Chi phí hậu cần cho hạm đội"
 FE_LOGISTICS_FLEET_UPKEEP_TOOLTIP: "§H$FE_LOGISTICS_FLEET_UPKEEP$§!\nQuản lý chi phí bảo trì $r_trade$ khi hạm đội rời cảng hoặc ở trên đất địch. Tăng thông số này sẽ làm chi phí hạm đội đắt đỏ hơn trong lúc có chiến tranh."
