 stone_age:0 "Thời kỳ đồ đá"
 stone_age_desc:0 "Nền văn minh này đang ở thời đồ đá. Họ đã biết dùng lửa và có ngôn ngữ nói cơ bản, nhưng chưa thấy dấu hiệu nào của nghề rèn hay chữ viết."
 bronze_age:0 "Thời kỳ đồ đồng"
 bronze_age_desc:0 "Nền văn minh này đang ở thời đồ đồng. Đã có công nghệ đúc kim loại sơ khai và những chữ viết đầu tiên, các thành phố và khu dân cư lớn cũng bắt đầu thành hình."
 iron_age:0 "Thời kỳ đồ sắt"
 iron_age_desc:0 "Nền văn minh này đang ở thời đồ sắt. Dấu chân của họ đã lan ra khắp hành tinh, kỹ thuật luyện và rèn sắt giúp họ tạo ra các công cụ và vũ khí thô sơ nhưng khá hiệu quả."
 late_medieval_age:0 "Hậu kỳ trung cổ"
 late_medieval_age_desc:0 "Nền văn minh này đang ở hậu kỳ trung cổ. Nghề đúc kim loại ngày càng thành thạo, và sự ra đời của máy in cũng đẩy nhanh việc lan truyền kiến thức."
 renaissance_age:0 "Thời kỳ phục hưng"
 renaissance_age_desc:0 "Nền văn minh này đang ở thời phục hưng. Vô vàn kiến thức khoa học được khai phá với tốc độ chóng mặt, thuốc súng ra đời cũng thay đổi hoàn toàn cục diện chiến tranh."
 steam_age:0 "Thời đại hơi nước"
 steam_age_desc:0 "Nền văn minh này đang ở thời đại hơi nước. Sự xuất hiện của động cơ hơi nước tác động sâu rộng đến xã hội, đưa họ vào tâm điểm của cuộc cách mạng công nghiệp."
 industrial_age:0 "Thời đại công nghiệp"
 industrial_age_desc:0 "Nền văn minh này đã chớm bước vào thời đại công nghiệp. Điện và động cơ đốt trong ngày càng phổ biến, quá trình đô thị hóa tăng vọt."
 machine_age:0 "Thời đại máy móc"
 machine_age_desc:0 "Họ đã bước vào thời đại máy móc, tương đương với cuối kỳ công nghiệp. Các nhà máy đẻ ra hàng loạt đồ tiêu dùng và xe cộ, việc đi lại trên không cũng thông dụng hơn."
 atomic_age:0 "Thời đại nguyên tử"
 atomic_age_desc:0 "Nền văn minh này đã vào thời đại nguyên tử. Họ đã xài được năng lượng hạt nhân, nhưng chưa đem vào du hành không gian. Họ làm ra đống vũ khí hạt nhân dư sức xóa sổ cả nòi giống chỉ trong chớp mắt."
 early_space_age:0 "Buổi đầu thời đại không gian"
 early_space_age_desc:0 "Họ đã bước vào buổi đầu thời không gian. Đã có vệ tinh sơ khai bay quanh hành tinh mẹ, và cũng làm được chuyến bay có người lái đầu tiên ở quỹ đạo thấp. Họ sẽ sớm sẵn sàng bỏ lại hành tinh để bay ra không gian."

