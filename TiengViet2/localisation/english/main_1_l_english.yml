 ####################################
 # Leader Traits
 ####################################

 # All
 leader_trait_adaptable: "Cởi mở"
 leader_trait_adaptable_desc:3 "Người lãnh đạo này rất cởi mở đón nhận những cách tiếp cận hay tư tưởng mới tiên tiến hơn."
 leader_trait_stubborn: "Bảo thủ"
 leader_trait_stubborn_desc:1 "Người lãnh đạo này khá cứng đầu, dù phương pháp hay tư duy mới có tốt hơn thì họ cũng không mấy khi chấp nhận."
 leader_trait_resilient: "Bền bỉ"
 leader_trait_resilient_desc:2 "Người lãnh đạo này có một cơ thể khỏe mạnh cùng khả năng hồi phục tốt, giúp kéo dài tuổi thọ."
 leader_trait_substance_abuser:0 "Lạm dụng thuốc"
 leader_trait_substance_abuser_desc:2 "Người lãnh đạo này thường xuyên lạm dụng các loại thuốc gây hại cho sức khỏe để giảm bớt căng thẳng, dẫn đến suy giảm tuổi thọ."
 leader_trait_eager: "Tràn đầy nhiệt huyết"
 leader_trait_eager_desc:1 "Người lãnh đạo này là một kẻ cuồng công việc."
 leader_trait_arrested_development:0 "Chững lại"
 leader_trait_arrested_development_desc:2 "Sự phát triển và khả năng của người lãnh đạo này dường như đã chạm đến mức giới hạn."
 leader_trait_intemporal: "Trường sinh"
 leader_trait_intemporal_desc:0 "Người lãnh đạo này không bị ảnh hưởng bởi dòng chảy thời gian, họ sẽ không chết vì già."

 # Admiral
 leader_trait_ex_fighter_pilot:0 "Cựu phi công át chủ bài"
 leader_trait_ex_fighter_pilot_desc:1 "Người lãnh đạo này từng là một phi công át chủ bài, biết rõ cách tận dụng tốc độ và sự cơ động của máy bay trên hạm để giành ưu thế trong chiến đấu."
 leader_trait_trickster:0 "Bậc thầy lừa gạt"
 leader_trait_trickster_desc:1 "Người lãnh đạo này biết cách ra đòn bất ngờ và dùng chiến thuật đánh lừa đối phương để chiếm lợi thế."
 leader_trait_fleet_logistician:0 "Chuyên gia hậu cần hạm đội"
 leader_trait_fleet_logistician_desc:1 "Người lãnh đạo này rất am hiểu công tác hậu cần và biết cách quản lý vật tư để giảm bớt chi phí bảo trì."
 leader_trait_fleet_organizer:0 "Nhà tổ chức hạm đội"
 leader_trait_fleet_organizer_desc:1 "Người lãnh đạo này có khả năng tổ chức hạm đội tuyệt vời, họ sở hữu kỹ năng quản lý vi mô cần thiết để điều hành một hạm đội khổng lồ một cách trơn tru."
 leader_trait_nervous: "Hay lo lắng"
 leader_trait_nervous_desc:2 "Người lãnh đạo này luôn căng thẳng và lo âu, rất dễ bị suy sụp dưới áp lực khi phải chỉ huy một hạm đội lớn."
 leader_trait_engineer:0 "Kỹ sư"
 leader_trait_engineer_desc:1 "Người lãnh đạo này là một kỹ sư thiên tài, mang trong mình kiến thức lẫn kỹ năng để tổ chức và giám sát quá trình sửa chữa tàu ngay giữa các chiến dịch."
 leader_trait_aggressive: "Hiếu chiến"
 leader_trait_aggressive_desc:2 "Người lãnh đạo này nổi tiếng vì bản tính hiếu chiến, thích vùi dập kẻ địch dưới cơn mưa hỏa lực chết chóc từ các vũ khí trên hạm đội."
 leader_trait_cautious: "Cẩn trọng"
 leader_trait_cautious_desc:1 "Người lãnh đạo này là một viên chỉ huy vô cùng cẩn trọng, phong cách chiến đấu của họ thiên về phòng thủ, nhờ vậy các con tàu dưới trướng luôn biết cách hỗ trợ lẫn nhau trong thực chiến."
 leader_trait_unyielding:0 "Không lùi bước"
 leader_trait_unyielding_desc:2 "Người lãnh đạo này thà chết vinh còn hơn sống nhục."
 leader_trait_gale_speed:0 "Nhanh như chớp"
 leader_trait_gale_speed_desc:1 "Người lãnh đạo này tin rằng, dù là trong bất kỳ trận chiến không gian nào, tốc độ mới là thứ làm nên chiến thắng."
 leader_trait_lethargic:0 "Lười biếng"
 leader_trait_lethargic_desc:1 "Người lãnh đạo này làm việc vô hồn, thiếu hẳn sự hăng hái."

 # General
 leader_trait_restrained: "Thận trọng"
 leader_trait_restrained_desc:1 "Người lãnh đạo này luôn muốn giảm thiểu tối đa tổn thất, tránh gây ra những thương vong không đáng có cho cả binh lính lẫn thường dân."
 leader_trait_defender:0 "Chuyên gia phòng ngự"
 leader_trait_defender_desc:1 "Người lãnh đạo này rất giỏi phòng ngự, biết cách điều động bộ binh và khai thác các công trình phòng thủ một cách hiệu quả nhất, khiến những kẻ dám xâm phạm phải nếm mùi đau khổ."
 leader_trait_attacker:0 "Chuyên gia xâm lược"
 leader_trait_attacker_desc:1 "Người lãnh đạo này là bậc thầy công thành, nắm rõ cách triển khai các đòn tấn công hiệu quả nhất từ trên không xuống hành tinh của đối phương."
 leader_trait_butcher:0 "Đồ tể"
 leader_trait_butcher_desc:2 "Người lãnh đạo này không hề biết khoan nhượng, luôn dùng những thủ đoạn tàn độc nhất để đối phó với kẻ thù."
 leader_trait_glory_seeker:0 "Kẻ săn vinh quang"
 leader_trait_glory_seeker_desc:2 "Người lãnh đạo này luôn xông pha nơi tiền tuyến, dẫn đầu binh sĩ để khích lệ tinh thần, bỏ mặc mọi hiểm nguy."
 leader_trait_armchair_commander:0 "Chỉ huy bàn giấy"
 leader_trait_armchair_commander_desc:2 "Vị tướng bộ binh này luôn chỉ tay năm ngón từ phía hậu phương an toàn, khiến sĩ khí của các chiến binh ngoài tiền tuyến giảm sút thảm hại."
 leader_trait_army_logistician:0 "Chuyên gia hậu cần bộ binh"
 leader_trait_army_logistician_desc:1 "Người lãnh đạo này dường như lúc nào cũng lôi đâu ra được đạn dược và quân nhu từ những nguồn không tưởng, nhờ đó tiết kiệm được đáng kể chi phí duy trì lực lượng tác chiến mặt đất."

 # Governor
 leader_trait_iron_fist:0 "Bàn tay sắt"
 leader_trait_iron_fist_desc:1 "Sự ám ảnh về mặt năng suất của người lãnh đạo này khiến ai cũng phải khiếp sợ, họ sẽ vắt kiệt sức lực của đám nô lệ để đạt được mục đích của mình."
 leader_trait_army_veteran:0 "Cựu binh bộ binh"
 leader_trait_army_veteran_desc:2 "Người lãnh đạo này là một cựu chiến binh, họ luôn dành những đặc quyền cho quân đội mặt đất trong khu vực cai quản của mình."
 leader_trait_retired_fleet_officer:0 "Cựu sĩ quan hải quân"
 leader_trait_retired_fleet_officer_desc:2 "Người lãnh đạo này từng là một sĩ quan hạm đội, khu vực dưới quyền của họ luôn tích cực đóng góp cho công cuộc xây dựng lực lượng hải quân không gian."
 leader_trait_architectural_interest:0 "Người đam mê kiến trúc"
 leader_trait_architectural_interest_desc:1 "Vị quản lý này có niềm đam mê mãnh liệt với các công trình và kỹ thuật xây dựng."
 leader_trait_agrarian_upbringing:0 "Xuất thân nhà nông"
 leader_trait_agrarian_upbringing_desc:3 "Người lãnh đạo này lớn lên ở những vùng thuần nông, nên rất chú tâm vào việc tối ưu hóa năng suất mùa màng."
 leader_trait_intellectual:0 "Tầng lớp trí thức"
 leader_trait_intellectual_desc:2 "Người lãnh đạo này đặc biệt quan tâm tới nghiên cứu khoa học, họ luôn cố gắng khơi dậy trí tò mò của quần chúng về thế giới tri thức."
 leader_trait_environmental_engineer:0 "Kỹ sư môi trường"
 leader_trait_environmental_engineer_desc:2 "Người lãnh đạo này nắm vững những kiến thức hàng đầu về quy trình cải tạo môi trường cũng như kỹ năng kiểm soát chi phí hiệu quả."
 leader_trait_bureaucrat:1 "Quan chức"
 leader_trait_bureaucrat_desc:2 "Người lãnh đạo này đặc biệt xuất sắc trong ngoại giao chính phủ và khả năng xây dựng sự đồng thuận."
 leader_trait_bureaucrat_tt: "§E$PLANET_EFFECTS_TXT$ cho mỗi cấp kỹ năng:§!$TABBED_NEW_LINE$$mod_planet_jobs_unity_produces_mult$: §G+5%§!"

 # Scientist
 leader_trait_meticulous: "Tỉ mỉ"
 leader_trait_meticulous_desc:1 "Người lãnh đạo này có thói quen cặm cụi nghiên cứu đi nghiên cứu lại những hiện tượng xa lạ mà họ vẫn chưa thể thấu hiểu hoàn toàn."
 leader_trait_spark_of_genius:0 "Thiên tài lóe sáng"
 leader_trait_spark_of_genius_desc:1 "Người lãnh đạo này luôn có những khoảnh khắc bùng nổ ý tưởng sáng tạo."
 leader_trait_carefree: "Vô lo vô nghĩ"
 leader_trait_carefree_desc: "Nhà khoa học này không phải là một người rụt rè dè dặt như bao người khác."
 leader_trait_roamer:0 "Kẻ du hành"
 leader_trait_roamer_desc:1 "Người lãnh đạo này sinh ra là để được rong ruổi giữa các vì sao."
 leader_trait_archaeologist:0 "Nhà khảo cổ học"
 leader_trait_archaeologist_tooltip:1 "§YHiện tượng bất thường của văn minh cổ đại:§!\n$t$Tốc độ nghiên cứu điểm bất thường: §G$@trait_archaeologist_1_amt|%0$§!"
 leader_trait_archaeologist_desc:1 "Người lãnh đạo này rất giỏi trong việc nghiên cứu các cổ vật và công trình kiến trúc còn sót lại của người ngoài hành tinh."
 leader_trait_paranoid: "Hoang tưởng"
 leader_trait_paranoid_desc:1 "Người lãnh đạo này không hề thích làm việc nhóm với người khác."
 leader_trait_maniacal: "Điên rồ"
 leader_trait_maniacal_desc: "Nhà khoa học này mang trong mình một tình yêu bất thường dành cho nghiên cứu."
 leader_trait_maniacal_2:0 "$leader_trait_maniacal$ II"
 leader_trait_maniacal_2_desc:0 "$leader_trait_maniacal_desc$"
 leader_trait_custom_AI_assistant:0 "Trợ lý trí tuệ nhân tạo tùy chỉnh"
 leader_trait_custom_AI_assistant_desc:1 "Người lãnh đạo này đã tự phát triển cho mình một mạng lưới thần kinh cơ bản để hỗ trợ các công tác khoa học."
 leader_trait_sapient_AI_assistant:0 "Trợ lý trí tuệ nhân tạo tự nhận thức"
 leader_trait_sapient_AI_assistant_desc:1 "Người lãnh đạo này tự tay chế tạo một mạng lưới thần kinh phức tạp giúp hỗ trợ họ trong quá trình ra quyết định và tra cứu dữ liệu."
 leader_trait_expertise_materials:1 "Chuyên môn: Khoa học vật liệu"
 leader_trait_expertise_materials_desc:1 "Người lãnh đạo này đã có nhiều năm dấn thân vào việc tìm tòi vật liệu học, họ là một chuyên gia đích thực trong lĩnh vực này."
 leader_trait_expertise_propulsion:0 "Chuyên môn: Động cơ đẩy"
 leader_trait_expertise_propulsion_desc:1 "Sau nhiều năm học tập và nghiên cứu, người lãnh đạo này đã trở thành một chuyên gia được công nhận trong mảng động lực học."
 leader_trait_expertise_voidcraft:1 "Chuyên môn: Kỹ thuật hàng không vũ trụ"
 leader_trait_expertise_voidcraft_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về công nghệ hàng không vũ trụ."
 leader_trait_expertise_industry:1 "Chuyên môn: Công nghiệp"
 leader_trait_expertise_industry_desc:1 "Người lãnh đạo này đã có nhiều năm dấn thân vào nghiên cứu công nghiệp, họ là một chuyên gia đích thực trong lĩnh vực này."
 leader_trait_expertise_field_manipulation:1 "Chuyên môn: Thao túng trường lực"
 leader_trait_expertise_field_manipulation_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về lĩnh vực thao túng trường lực."
 leader_trait_expertise_particles:1 "Chuyên môn: Vật lý hạt"
 leader_trait_expertise_particles_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về lĩnh vực vật lý hạt."
 leader_trait_expertise_metaphysics:0 "Chuyên môn: Siêu hình học"
 leader_trait_expertise_metaphysics_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về lĩnh vực siêu hình học."
 leader_trait_expertise_psionics:1 "Chuyên môn: Lý thuyết tâm linh"
 leader_trait_expertise_psionics_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về lĩnh vực tâm linh."
 leader_trait_expertise_computing:1 "Chuyên môn: Kỹ thuật máy tính"
 leader_trait_expertise_computing_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về mảng kỹ thuật máy tính."
 leader_trait_expertise_new_worlds:1 "Chuyên môn: Lý thuyết thế giới mới"
 leader_trait_expertise_new_worlds_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về việc định cư ở các thế giới mới."
 leader_trait_expertise_statecraft:1 "Chuyên môn: Nghệ thuật trị quốc"
 leader_trait_expertise_statecraft_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về mảng trị quốc."
 leader_trait_expertise_biology:1 "Chuyên môn: Sinh học"
 leader_trait_expertise_biology_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về lĩnh vực sinh học."
 leader_trait_expertise_military_theory:1 "Chuyên môn: Học thuyết quân sự"
 leader_trait_expertise_military_theory_desc:1 "Qua hàng năm trời miệt mài nghiên cứu, người lãnh đạo này đã vươn lên thành một trong những chuyên gia hàng đầu về học thuyết quân sự."
 leader_trait_curator:0 "Nhà giám tuyển"
 leader_trait_curator_desc:1 "Người lãnh đạo này đến từ thế lực Giám tuyển. Kiến thức của họ về công nghệ và thám hiểm là không ai sánh kịp."
 leader_trait_curator_effect: "$t$Tăng tỷ lệ rút được các công nghệ hiếm."
 leader_trait_curator_hive:0 "Nguyên lý Giám tuyển"
 leader_trait_curator_hive_desc:0 "Nút mạng này đã hợp nhất các nguyên lý kiến thức cơ bản của các thành bang Giám tuyển."
 leader_trait_curator_machine:0 "$leader_trait_curator_hive$"
 leader_trait_curator_machine_desc:0 "$leader_trait_curator_hive_desc$"
 leader_trait_towel:0 "Kẻ mang theo khăn tắm"
 leader_trait_towel_desc:0 "Với một kẻ lang thang giữa các vì sao, chiếc khăn tắm chính là vật dụng hữu ích nhất."
 leader_trait_percussive_maintainer:0 "Thợ bảo trì cục súc"
 leader_trait_percussive_maintainer_desc:0 "Không có lỗi phần cứng nào mà không thể khắc phục bằng một cú đá bồi thật mạnh."

 # Ruler
 trait_ruler_corvette_focus:1 "Chuyên gia đóng tàu hộ tống"
 trait_ruler_corvette_focus_desc:1 "Người lãnh đạo này rất chú trọng vào việc thúc đẩy đóng tàu hộ tống."
 trait_ruler_destroyer_focus:1 "Chuyên gia đóng tàu khu trục"
 trait_ruler_destroyer_focus_desc:1 "Người lãnh đạo này rất chú trọng vào việc thúc đẩy đóng tàu khu trục."
 trait_ruler_cruiser_focus:1 "Chuyên gia đóng tàu tuần dương"
 trait_ruler_cruiser_focus_desc:1 "Người lãnh đạo này rất chú trọng vào việc thúc đẩy đóng tàu tuần dương."
 trait_ruler_battleship_focus:1 "Chuyên gia đóng thiết giáp hạm"
 trait_ruler_battleship_focus_desc:1 "Người lãnh đạo này rất chú trọng vào việc thúc đẩy đóng thiết giáp hạm."
 trait_ruler_recruiter:0 "Sĩ quan tuyển quân"
 trait_ruler_recruiter_desc:1 "Người lãnh đạo này có sức hút đặc biệt, khiến những tân binh tranh nhau phụng sự cho đế chế."
 trait_ruler_from_the_ranks:0 "Lên từ lính lác"
 trait_ruler_from_the_ranks_desc:1 "Người lãnh đạo này đã từng bước thăng tiến từ một người lính quèn."
 trait_ruler_fortifier:0 "Người dựng lũy"
 trait_ruler_fortifier_desc:1 "Người lãnh đạo này hiểu rõ giá trị của các trạm phòng thủ trong việc bảo vệ lãnh thổ."
 trait_ruler_logistic_understanding:0 "Am tường hậu cần"
 trait_ruler_logistic_understanding_desc:1 "Người lãnh đạo này hiểu rõ tầm quan trọng của việc xây dựng chuỗi tiếp tế hợp lý."
 trait_ruler_military_pioneer:0 "Tiên phong quân sự"
 trait_ruler_military_pioneer_desc:1 "Người lãnh đạo này cực kỳ mặn mà với việc phát triển công nghệ chiến đấu và thúc đẩy công nghiệp đóng tàu."
 trait_ruler_warlike: "Hiếu chiến"
 trait_ruler_warlike_desc:3 "Người lãnh đạo này không hề run sợ trước chiến tranh."
 trait_ruler_architectural_sense:0 "Chú trọng xây dựng"
 trait_ruler_architectural_sense_desc:1 "Người lãnh đạo này mang trong mình trái tim của một kiến trúc sư, luôn hết mình vì việc nâng cao hiệu quả xây dựng."
 trait_ruler_architectural_sense_2:0 "$trait_ruler_architectural_sense$ II"
 trait_ruler_architectural_sense_2_desc:0 "$trait_ruler_architectural_sense_desc$"
 trait_ruler_frontier_spirit:0 "Tinh thần khai phá"
 trait_ruler_frontier_spirit_desc:1 "Người lãnh đạo này luôn khao khát được khai phá những hành tinh xa xôi."
 trait_ruler_world_shaper:0 "Người nhào nặn hành tinh"
 trait_ruler_world_shaper_desc:1 "Người lãnh đạo này muốn uốn nắn các thế giới theo ý mình."
 trait_ruler_home_in_the_sky:0 "Biển sao rộng lớn"
 trait_ruler_home_in_the_sky_desc:1 "Giấc mơ của người lãnh đạo này chính là biển sao bao la."
 trait_ruler_industrialist:1 "Cuồng nhiệt khai khoáng"
 trait_ruler_industrialist_desc:2 "Người lãnh đạo này rất quan tâm đến việc gia tăng sản lượng khai khoáng."
 trait_ruler_eye_for_talent:0 "Con mắt tinh đời"
 trait_ruler_eye_for_talent_desc:1 "Người lãnh đạo này có một ánh nhìn vô cùng nhạy bén, có thể nhìn ra tài năng từ những kẻ mà người thường cho là lập dị hay vô dụng."
 trait_ruler_deep_connections:0 "Mối quan hệ sâu rộng"
 trait_ruler_deep_connections_desc:1 "Người lãnh đạo này vẫn vững như bàn thạch giữa bộ máy hành chính phức tạp."
 trait_ruler_deep_connections_2:0 "$trait_ruler_deep_connections$ II"
 trait_ruler_deep_connections_2_desc:0 "$trait_ruler_deep_connections_desc$"
 trait_ruler_charismatic: "Cuốn hút"
 trait_ruler_charismatic_desc:1 "Người lãnh đạo này vô cùng cuốn hút, có thể dễ dàng thúc đẩy các chính sách của mình."
 trait_ruler_champion_of_the_people:0 "Nhà vô địch của nhân dân"
 trait_ruler_champion_of_the_people_desc:1 "Người lãnh đạo này một lòng muốn mang lại hạnh phúc cho nhân dân."
 trait_ruler_feedback_loop:0 "Vòng lặp phản hồi"
 trait_ruler_feedback_loop_desc:1 "Nhờ vào vòng lặp phản hồi hiệu suất và phân tích hành vi-phản ứng, đơn vị này có khả năng dự đoán sản lượng tốt hơn hẳn."
 trait_ruler_expansionist:0 "Kẻ bành trướng"
 trait_ruler_expansionist_desc: "Người lãnh đạo này luôn muốn mở mang bờ cõi."
 trait_ruler_fertility_preacher:0 "Trọng nông"
 trait_ruler_fertility_preacher_desc:2 "Người lãnh đạo này rất thạo việc kiếm lấy các tài nguyên sống còn để nuôi dưỡng lượng dân số tăng nhanh."
 trait_ruler_investor:0 "Nhà đầu tư"
 trait_ruler_investor_desc:1 "Người lãnh đạo này là một nhà kinh tế sắc sảo, có thể phát huy tối đa tiềm năng kinh tế."
 trait_ruler_investor_2:0 "$trait_ruler_investor$ II"
 trait_ruler_investor_2_desc:0 "$trait_ruler_investor_desc$"
 trait_ruler_investor_3:0 "$trait_ruler_investor$ III"
 trait_ruler_investor_3_desc:0 "$trait_ruler_investor_desc$"
 trait_ruler_space_miner:0 "Thợ mỏ không gian"
 trait_ruler_space_miner_desc:1 "Người lãnh đạo này hiểu rõ việc khai khoáng quan trọng thế nào với một đế chế."
 trait_ruler_explorer:2 "Người khao khát tri thức"
 trait_ruler_explorer_desc:1 "Người lãnh đạo này mang trong mình sự tò mò vô tận, coi việc khám phá không gian là trên hết."
 trait_ruler_explorer_2:0 "$trait_ruler_explorer$ II"
 trait_ruler_explorer_2_desc:0 "$trait_ruler_explorer_desc$"

 # Machine
 leader_trait_ruler_machine_intelligence:0 "Trí tuệ máy móc"
 leader_trait_ruler_machine_intelligence_desc:0 "Người lãnh đạo này là trí tuệ cốt lõi giám sát và chỉ huy toàn bộ đế chế máy móc."
 leader_trait_flexible_programming:0 "Lập trình linh hoạt"
 leader_trait_flexible_programming_desc:0 "Chương trình của người lãnh đạo này cực kỳ linh hoạt, giúp họ nhanh chóng thích nghi với các quy trình và phương pháp mới hiệu quả hơn."
 leader_trait_rigid_programming:0 "Lập trình cứng nhắc"
 leader_trait_rigid_programming_desc:0 "Chương trình của người lãnh đạo này quá dập khuôn, hiếm khi cho phép thay đổi hành vi, kể cả khi những thay đổi đó có thể cải thiện năng suất."
 leader_trait_newboot:0 "Lính mới"
 leader_trait_newboot_desc:0 "Người lãnh đạo này mới được nâng cấp để có đủ khả năng độc lập gánh vác vai trò chỉ huy."
 leader_trait_warbot_tinkerer:0 "Thợ độ cỗ máy giết chóc"
 leader_trait_warbot_tinkerer_desc:0 "Người lãnh đạo này cực kỳ hứng thú với việc thiết kế cỗ máy chiến tranh, và luôn không ngừng cải tiến các mẫu có sẵn của chúng ta."
 leader_trait_ai_aided_design:0 "Thiết kế bằng AI"
 leader_trait_ai_aided_design_desc:0 "Để tăng tốc độ đóng tàu không gian, người lãnh đạo này thường xuyên chạy các mô hình lý thuyết trên lõi bộ nhớ phụ."
 leader_trait_bulldozer:0 "Xe ủi đất"
 leader_trait_bulldozer_desc:0 "Người lãnh đạo này đã thấu hiểu nghệ thuật hô biến địa hình ngoài hành tinh thành bãi đậu xe một cách nhanh chóng và gọn gàng."
 leader_trait_analytical:0 "Giỏi phân tích"
 leader_trait_analytical_desc:0 "Người lãnh đạo này dành phần lớn công suất xử lý để phân tích khoa học tự nhiên, đồng thời thúc đẩy những người khác cùng nghiên cứu."
 leader_trait_parts_cannibalizer:0 "Trang thiết bị tái chế"
 leader_trait_parts_cannibalizer_desc:0 "Người lãnh đạo này rất thạo việc gỡ linh kiện từ các cỗ máy chiến tranh hư hỏng để duy trì hoạt động cho những cỗ máy khác."
 leader_trait_demoralizer:0 "Gieo rắc nỗi sợ"
 leader_trait_demoralizer_desc:0 "Người lãnh đạo này đắm chìm vào việc nghiên cứu ý chí yếu ớt của sinh vật hữu cơ, và tìm cách sử dụng đòn tâm lý thật sáng tạo để đập nát nhuệ khí của địch trên chiến trường."
 leader_trait_erratic_morality_core:0 "Lõi đạo đức bất ổn"
 leader_trait_erratic_morality_core_desc:0 "Vì lỗi ở lõi đạo đức, người lãnh đạo này thường xuyên cảm thấy xấu hổ và cắn rứt trước thương vong của kẻ thù."
 leader_trait_maintenance_loop:0 "Vòng lặp bảo trì"
 leader_trait_maintenance_loop_desc:0 "Người lãnh đạo này liên tục chạy các vòng lặp bảo trì phụ, chăm chút kỹ lưỡng cho mọi con tàu trong hạm đội và kéo giảm chi phí hậu cần."
 leader_trait_unstable_code_base:0 "Cơ sở mã nguồn lỗi"
 leader_trait_unstable_code_base_desc:0 "Mã nguồn của người lãnh đạo này cực kỳ bất ổn, khiến đôi lúc họ có những hành vi sợ sệt hoặc vô lý."
 leader_trait_cataloger:0 "Kẻ lập danh mục"
 leader_trait_cataloger_desc:0 "Ham muốn lớn nhất của người lãnh đạo này là lập ra danh mục cho toàn bộ vũ trụ."

 # Event Special
 leader_trait_sentinel:0 "Đào tạo Vệ binh"
 leader_trait_sentinel_desc:0 "Chỉ huy hạm đội Vệ binh này nắm rõ như lòng bàn tay cấu trúc sinh lý cũng như chiến thuật của bầy Prethoryn."
 leader_trait_hive_mind:0 "Ý Thức Bầy Đàn"
 leader_trait_hive_mind_desc:0 "Ý thức Gestalt kiểm soát hạm đội Prethoryn này sở hữu khả năng xử lý đa nhiệm vô cùng phức tạp."
 leader_trait_hive_affinity:0 "Cảm thụ bầy đàn"
 leader_trait_hive_affinity_desc:0 "Các cá thể Prethoryn hành động dựa trên ý thức hạm đội này có sự cộng hưởng dị thường với nhau. Kỷ luật khai hỏa của chúng được cải thiện rõ rệt, kéo theo tốc độ bắn tăng lên."
 leader_trait_void_swimmer:0 "Thợ săn hư không"
 leader_trait_void_swimmer_desc:0 "Bản năng săn mồi của hạm đội này đã đẩy bầy Prethoryn dưới trướng vào trạng thái cuồng loạn. Cơn khát máu thôi thúc chúng lao về phía trước."
 leader_trait_ethereal:0 "Mờ ảo"
 leader_trait_ethereal_desc:0 "Những hạm đội từ chiều không gian khác này đã học được cách làm cho tàu của chúng mờ ảo, giúp tăng đáng kể khả năng né đòn."
 leader_trait_dimensional_stutter:0 "Nhiễu loạn không gian"
 leader_trait_dimensional_stutter_desc:0 "Không hiểu vì sao quỹ đạo bay của hạm đội ngoại không gian này lại chập chờn lúc ẩn lúc hiện, cho phép chúng bay ở tốc độ dưới ánh sáng nhanh hơn."



