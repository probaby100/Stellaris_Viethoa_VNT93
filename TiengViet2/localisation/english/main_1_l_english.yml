 trait_pc_ringworld_habitable_preference_short:0 "Thế giới Vành đai"
 trait_pc_ringworld_habitable_preference_desc:0 "$trait_pc_arctic_preference_desc$"
 trait_pc_habitat_preference:0 "Ưa trạm cư trú"
