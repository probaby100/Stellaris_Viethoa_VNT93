 ####################################
 # Terrain Tiles
 ####################################

 pc_continental_tile:0 "Địa hình ôn đới"
 pc_continental_tile_desc:0 "Khu vực có thảm thực vật đa dạng, khí hậu ôn hòa."
 pc_desert_tile:0 "Địa hình sa mạc"
 pc_desert_tile_desc:0 "Khu vực khô cằn và nghèo nàn, thỉnh thoảng có đá."
 pc_arid_tile:0 "Địa hình khô hạn"
 pc_arid_tile_desc:0 "Khu vực khô ráo và nhiều đá, thảm thực vật thưa thớt."
 pc_tundra_tile:0 "Địa hình lãnh nguyên"
 pc_tundra_tile_desc:0 "Đồng cỏ lạnh lẽo đầy gió, thảm thực vật thưa thớt."
 pc_tropical_tile:0 "Địa hình nhiệt đới"
 pc_tropical_tile_desc:0 "Khu vực được bao phủ bởi lượng lớn thực vật, khí hậu ôn hòa và ẩm ướt."
 pc_ocean_tile:0 "Địa hình đại dương"
 pc_ocean_tile_desc:0 "Khu vực bao gồm các hòn đảo đơn độc và rạn san hô, được đại dương bao quanh."
 pc_arctic_tile:0 "Địa hình băng giá"
 pc_arctic_tile_desc:0 "Khu vực bị băng tuyết bao phủ, cỏ cây không mọc nổi."
 pc_savannah_tile:0 "Địa hình thảo nguyên thưa"
 pc_savannah_tile_desc:0 "Cây xanh và bụi rậm mọc lưa thưa trên vùng đất ấm áp và khô ráo này."
 pc_alpine_tile:0 "Địa hình cao nguyên"
 pc_alpine_tile_desc:0 "Khu vực bị bao phủ bởi tuyết quanh năm."
 pc_gaia_tile:0 "Địa hình Gaia"
 pc_gaia_tile_desc:0 "Khu vực có quần thể sinh vật đa dạng, vô cùng phù hợp cho hầu hết các dạng sống."
 pc_nuked_tile:0 "Địa hình đất hoang"
 pc_nuked_tile_desc:0 "Khu vực khắc nghiệt, bị chiến tranh tàn phá. Mức độ bức xạ đủ thấp để hỗ trợ một số dạng sống tồn tại."
 pc_infested_tile:0 "Địa hình ổ nhộng"
 pc_infested_tile_desc:0 "Khu vực bị ô nhiễm bởi dịch tiết của bầy bọ."
 pc_ringworld_habitable_tile:0 "Địa hình Thế giới Vành đai"
 pc_ringworld_habitable_tile_desc:0 "Vùng đất hoang sơ được các hệ thống bên trong của Thế giới Vành đai chăm sóc kỹ lưỡng."
 pc_machine_tile:0 "Địa hình máy móc"
 pc_machine_tile_desc:0 "Vùng đất cực kỳ vô trùng, che chắn cho mạng tinh thể siêu dẫn nằm sâu dưới lòng đất."
 pc_habitat_tile:0 "Địa hình trạm cư trú quỹ đạo"
 pc_habitat_tile_desc:0 "Các tấm khoáng sản được gia công trên máy tạo trọng lực nhân tạo, đóng vai trò làm nền móng đúc sẵn cho việc xây dựng công nghiệp và đô thị."

 ####################################
 # Tile Blockers
 ####################################

 d_mountain_range:0 "£blocker£ Dãy núi cao"
 mountain_range_singular: "Dãy núi cao" # used inside event texts
 d_mountain_range_desc:0 "Một dãy núi cao vút và hiểm trở trải dài ngang qua khu vực này."
 d_active_volcano:0 "£blocker£ Núi lửa hoạt động"
 active_volcano_singular: "Núi lửa hoạt động" # used inside event texts
 d_active_volcano_desc:0 "Khu vực này có một ngọn núi lửa đang hoạt động, phun trào nham thạch và khí núi lửa."
 d_dangerous_wildlife_blocker:0 "£blocker£ Động vật hoang dã nguy hiểm"
 wildlife_blocker_singular: "Nơi ở của thú hoang" # used inside event texts
 d_dangerous_wildlife_blocker_desc:0 "Động vật hoang dã ở khu vực này cực kỳ chết chóc, trong đó có cả những loài thú săn mồi nguy hiểm và thực vật có độc."
 d_dense_jungle:0 "£blocker£ Rừng rậm"
 dense_jungle_singular: "Rừng rậm" # used inside event texts
 d_dense_jungle_desc:0 "Toàn bộ khu vực này bị che phủ bởi rừng rậm dày đặc và không thể đi qua."
 d_quicksand_basin:0 "£blocker£ Vùng cát lún"
 quicksand_basin_singular: "Vùng cát lún" # used inside event texts
 d_quicksand_basin_desc:0 "Một lượng lớn cát lún bao phủ khu vực này, việc xây dựng ở đây là không thể."
 d_noxious_swamp:0 "£blocker£ Đầm lầy độc hại"
 noxious_swamp_singular: "Đầm lầy độc hại" # used inside event texts
 d_noxious_swamp_desc:0 "Khu vực đầm lầy nguy hiểm, ngập ngụa khí hôi thối."
 d_massive_glacier:0 "£blocker£ Sông băng khổng lồ"
 massive_glacier_singular: "Sông băng khổng lồ" # used inside event texts
 d_massive_glacier_desc:0 "Khu vực này bị bao phủ bởi một sông băng khổng lồ."
 d_toxic_kelp:0 "£blocker£ Tảo bẹ độc hại"
 toxic_kelp_singular: "Tảo bẹ độc hại" # used inside event texts
 d_toxic_kelp_desc:0 "Ở vùng này, một loại tảo bẹ có độc đối với hầu hết sinh vật mọc um tùm như một khu rừng dưới đại dương."
 d_deep_sinkhole:0 "£blocker£ Hố sụt sâu"
 deep_sinkhole_singular: "Hố sụt sâu" # used inside event texts
 d_deep_sinkhole_desc:0 "Phần lớn khu vực này bị chiếm chỗ bởi một hố sụt khổng lồ."
 d_city_ruins:0 "£blocker£ Tàn tích thành phố"
 d_city_ruins_desc:0 "Nơi đây từng là một thành phố nguy nga tráng lệ, giờ chỉ còn là một bãi rác kim loại vô tận."
 d_ancient_ruins:0 "£blocker£ Di tích cổ đại"
 d_ancient_ruins_desc:0 "§LNơi đây từng có một siêu đô thị được xây dựng bằng công nghệ phát triển cao, sau nhiều thế kỷ bị bỏ hoang, giờ đây chỉ còn lại những tàn tích và gạch vụn.§!"
 d_ancient_cryo_chambers:0 "£blocker£ Tàn tích buồng ngủ đông"
 d_ancient_cryo_chambers_desc:0 "§LMột cơ sở khổng lồ bị phá hủy một nửa, chứa hàng triệu buồng ngủ đông. Cơ sở này không có điện, và các sinh vật hữu cơ được bảo quản bên trong cũng chỉ còn lại một chút tàn dư, cho thấy có vẻ như họ đến từ hàng chục giống loài hữu cơ khác nhau.§!"
 d_tribal_settlement:0 "£blocker£ Khu bảo tồn bản địa"
 d_tribal_settlement_desc:1 "Toàn bộ khu vực này được tách ra làm khu bảo tồn cho cư dân bản địa ở mức trước khi đạt được công nghệ vượt tốc độ ánh sáng."
 d_xeno_preserve:0 "£blocker£ Khu bảo tồn dị chủng"
 d_xeno_preserve_desc:0 "Khu vực này đã được quy hoạch làm vùng bảo vệ cho các loài ngoại lai đang có nguy cơ tuyệt chủng."
 d_wandering_forests:0 "£blocker£ Rừng di cư"
 d_wandering_forests_desc:0 "Các khu rừng di cư trên thế giới này thường xuyên di chuyển hàng loạt đến những vùng mới, phá hủy các tuyến đường đã xây, đường dây tải điện và các cơ sở hạ tầng khác."
 d_wandering_forest_reserve:0 "£blocker£ Khu bảo tồn rừng di cư"
 d_wandering_forest_reserve_desc:0 "§YTăng £society£ Nghiên cứu ở các khu vực liền kề.§!\n\nMột khu bảo tồn thiên nhiên rộng lớn bao trùm hệ sinh thái cây cối di cư."
 d_sinkhole_subterraneans:0 "£blocker£ Lối vào thế giới ngầm"
 d_sinkhole_subterraneans_desc:0 "Cửa hang khổng lồ dẫn đến một mạng lưới hang động dưới lòng đất, bên trong là những hang động chằng chịt, xuyên suốt cả hành tinh."
 d_crater:0 "£blocker£ Hố va chạm"
 d_crater_desc:0 "Một vật thể nào đó đã va vào bề mặt của hành tinh này, tạo ra một hố va chạm khổng lồ."
 d_bomb_crater:0 "£blocker£ Hố bom"
 d_bomb_crater_desc:0 "Hố bom khổng lồ này là do một vụ nổ bom hydro mang tính tàn phá cực kỳ khủng khiếp gây ra."
 d_ruined_district:0 "£blocker£ Khu vực bị phá hủy"
 d_ruined_district_desc:0 "Khu vực này đầy rẫy vô số hố bom do bị dội bom tàn nhẫn từ quỹ đạo."
 d_radioactive_wasteland:0 "£blocker£ Vùng đất nhiễm xạ"
 d_radioactive_wasteland_desc:0 "Trên vùng đất hoang vu và bị nhiễm phóng xạ này, gần như không có sinh vật nào có thể sống sót."
 d_failing_infrastructure_desc:0 "Khu vực này tràn ngập các công trình công nghiệp bị bỏ hoang và đất đai chứa độc tố cao, tất cả đều là tàn dư của thời đại cũ."
 d_failing_infrastructure:0 "£blocker£ Bãi rác công nghiệp"
 d_forgotten_civilization:0 "£blocker£ Nền văn minh bị lãng quên"
 d_forgotten_civilization_desc:0 "Những tàn tích của một nền văn minh đã bị lãng quên, họ đã sống ở đây trước chúng ta."
 d_decrepit_dwellings:0 "£blocker£ Khu ổ chuột"
 d_decrepit_dwellings_desc:0 "Khu vực này bị chiếm giữ bởi những khu ổ chuột rộng lớn, bên trong đầy rẫy những người nghèo khổ và những kẻ lang thang."
 d_decrepit_dwellings_custom_tooltip:0 "Tạo ra §G100§! £pop£"
 d_titanic_life_blocker:0 "£blocker£ Sinh vật khổng lồ"
 d_titanic_life_blocker_desc:0 "Nhiều loài sinh vật ngoài hành tinh khổng lồ coi nơi đây là nhà, tránh xa chúng mới là lựa chọn khôn ngoan."
 d_bombarded_land:0 "£blocker£ Vùng đất thủng lỗ chỗ"
 d_bombarded_land_desc:0 "Khu vực này đã bị bom quỹ đạo san phẳng."
 d_battlefield_debris:0 "£blocker£ Tàn tích chiến trường"
 d_battlefield_debris_desc:0 "Khu vực này đã bị phá hủy bởi một loạt các cuộc chiến trên mặt đất với quy mô lớn."
 d_tomb_world_ruins:0 "£blocker£ Tàn tích có người ở"
 d_tomb_world_ruins_desc:0 "Khu tàn tích này từng là một thành phố lớn, giờ đây chỉ còn lác đác vài kẻ nhặt rác đang cố gắng sống sót qua ngày."
 d_tomb_world_wasteland:0 "£blocker£ Khu vực nhiễm xạ"
 d_tomb_world_wasteland_desc:0 "Khu vực này từng bị tấn công bởi vô số đầu đạn hạt nhân. Dù lượng phóng xạ đã giảm nhiều so với lúc nổ, nhưng vẫn cần dọn dẹp trên quy mô lớn mới có thể sinh sống được."
 d_machine_empire_ruins:0 "£blocker£ Thành phố hoang phế"
 d_machine_empire_ruins_desc:0 "Đây là những tàn tích đổ nát còn sót lại của một trung tâm dân cư lớn từng tồn tại trên hành tinh, cư dân ban đầu đã biến mất không để lại dấu vết."
 d_exterminators_ruins:0 "£blocker£ Tàn tích thành phố hữu cơ"
 d_exterminators_ruins_desc:0 "Đống đổ nát đen kịt và đầy phóng xạ này từng là siêu đô thị của sinh vật hữu cơ. Trong những công trình chưa sập, giờ đây cũng chỉ còn lại tro bụi."
 d_assimilators_ruins:0 "£blocker£ Tàn tích tĩnh lặng"
 d_assimilators_ruins_desc:0 "Xác thối rữa của những sinh vật hữu cơ thà chọn tự kết liễu còn hơn bị đồng hóa đã lấp đầy khu tàn tích đổ nát này, nơi từng là một khu định cư lớn."
 d_former_battlefield:0 "£blocker£ Dấu tích chiến trường"
 d_former_battlefield_desc:0 "Vô số cỗ máy chiến tranh cháy đen, cùng với hài cốt của những chiến binh hữu cơ nằm rải rác trên chiến trường xưa này. Lượng bức xạ còn sót lại sẽ gây nhiễu cho hầu hết các thiết bị điện tử."
 d_strip_mine:0 "£blocker£ Mỏ lộ thiên bị bỏ hoang"
 d_strip_mine_desc:0 "Khu vực này từng trải qua việc khai thác lộ thiên cường độ cao trong quá khứ, khi đó, những máy móc khai thác lỗi thời đã không màng đến sự phát triển trong tương lai của vùng đất này."
 d_unsupervised_settlement:0 "£blocker£ Nơi định cư vô chủ"
 d_unsupervised_settlement_desc:0 "Trên hành tinh này, một nhóm nhỏ xã hội sinh vật hữu cơ vẫn tồn tại ngoài sự quản lý của máy móc. Bạo lực, dịch bệnh và nạn đói hoành hành bên trong những bức tường thành, trình độ công nghệ của cư dân đã tụt lùi lại hàng thế kỷ."
 d_collapsed_burrows:0 "£blocker£ Hang động sập"
 d_collapsed_burrows_desc:0 "Nơi đây từng là một hệ thống đường hầm dưới lòng đất phức tạp do một bầy đàn sinh sống, nhưng đã bị bỏ hoang do việc khai thác cạn kiệt tài nguyên và săn bắt động vật hoang dã quá mức."
 d_ruined_building_blocker:1 "£blocker£ Đống đổ nát"
 d_ruined_building_blocker_desc:0 "Một lượng lớn gạch vụn làm cho khu vực này không thể đi qua được."
 d_hibernating_lithoids:0 "£blocker£ Cột đá khổng lồ"
 d_hibernating_lithoids_desc:0 "Một quặng tinh chất lượng cực cao nhô lên khỏi mặt đất, bên trong dường như có vài sinh vật đá đang nằm bất động."
 d_big_nature_preserve_blocker:0 "$d_nature_preserve_blocker$"
 d_big_nature_preserve_blocker_desc:0 "Một khu vực ngập tràn vẻ đẹp thiên nhiên, nơi này được quy hoạch làm khu bảo tồn và sẽ không bao giờ bị xâm phạm."
