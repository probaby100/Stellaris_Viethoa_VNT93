 # Planet Classes
 ####################################

 pc_gas_giant:0 "Hành tinh khí khổng lồ"
 pc_gas_giant_plural: "Hành tinh khí khổng lồ"
 pc_gas_giant_desc:0 "Một hành tinh chủ yếu được tạo thành từ khí hydro và heli, bao quanh một lõi đặc."
 pc_asteroid:0 "Tiểu hành tinh"
 pc_asteroid_desc:0 "Một tiểu hành tinh lớn, nằm trong một cụm tiểu hành tinh dày đặc."
 pc_molten:0 "Hành tinh nóng chảy"
 pc_molten_plural: "Hành tinh nóng chảy"
 pc_molten_desc:0 "Một hành tinh bị nung chảy. Nó có lớp không khí cực kỳ mỏng hoặc không có, dòng nham thạch tràn ngập trên bề mặt do hoạt động núi lửa. Loại hành tinh này không thể duy trì sự sống hữu cơ."
 pc_frozen:0 "Hành tinh băng giá"
 pc_frozen_plural: "Hành tinh băng giá"
 pc_frozen_desc:1 "Một hành tinh đá với bề mặt được bao phủ bởi lớp băng vĩnh cửu dày. Nhiệt độ cực thấp và lớp không khí rất mỏng khiến sự sống khó có thể tồn tại trên bề mặt."
 pc_broken:0 "Hành tinh vỡ vụn"
 pc_broken_desc:0 "Một hành tinh bị phá hủy bởi thảm họa lớn. Dù hành tinh này từng sở hữu tài nguyên gì đi chăng nữa, tất cả đã tan thành mây khói không còn dấu vết."
 pc_barren:0 "Hành tinh cằn cỗi"
 pc_barren_desc:1 "Một thế giới đá khô cằn, gần như không có lớp không khí. Bề mặt đầy rẫy các miệng hố thiên thạch, hoàn toàn không có sự sống."
 pc_barren_cold:0 "Hành tinh cằn cỗi"
 pc_barren_cold_desc:1 "Một thế giới đá khô cằn, gần như không có lớp không khí. Bề mặt đầy rẫy các miệng hố thiên thạch, hoàn toàn không có sự sống."
 pc_desert:0 "Hành tinh sa mạc"
 pc_desert_desc:0 "Một thế giới đá khô cằn, có lớp không khí chứa nitơ-oxy, gần như không có các vùng nước lớn hay mưa. Sự chênh lệch nhiệt độ giữa ngày và đêm là rất lớn. Rất ít thực vật, nhưng chỉ cần một lượng mưa vừa đủ cũng có thể khiến sa mạc bừng lên sức sống."
 pc_arid:0 "Hành tinh khô hạn"
 pc_arid_desc:0 "Một thế giới đá khô hạn, có lớp không khí chứa nitơ-oxy, bề mặt chủ yếu là vách đá và hẻm núi. Có thể tìm thấy rừng ở các vùng cực có khí hậu ôn hòa hơn, nhưng các loài thực vật khác lại khá hiếm hoi."
 pc_tundra:0 "Hành tinh lãnh nguyên"
 pc_tundra_desc:0 "Một hành tinh đá lạnh lẽo, lớp không khí dồi dào nitơ và oxy. Ngoại trừ vùng xích đạo ôn hòa hơn, phần lớn bề mặt đều bị bao phủ bởi lớp băng vĩnh cửu. Ở đây có một hệ sinh thái ổn định, nhưng thảm thực vật chủ yếu chỉ là rêu và địa y."
 pc_continental:0 "Hành tinh lục địa"
 pc_continental_desc:0 "Một thế giới đá có lớp không khí chứa nitơ-oxy, nguồn nước ổn định, các lục địa bị chia cắt bởi đại dương, nhiệt độ thay đổi theo mùa tùy thuộc vào vĩ độ."
 pc_tropical:0 "Hành tinh nhiệt đới"
 pc_tropical_desc:0 "Một thế giới đá ẩm ướt với lớp không khí chứa nitơ-oxy dày đặc, khí hậu thay đổi mạnh, mùa khô và mùa mưa xen kẽ rõ rệt. Phần lớn các lục địa đều được bao phủ bởi thảm thực vật xanh tốt."
 pc_ocean:0 "Hành Tinh Đại Dương"
 pc_ocean_plural: "Các Hành Tinh Đại Dương"
 pc_ocean_desc:0 "Một thế giới đá có lượng nước lớn và lớp không khí chứa nitơ-oxy, đại dương bao phủ hơn §Y90%§! bề mặt, phần đất liền còn lại chỉ là các hòn đảo."
 pc_arctic:0 "Hành tinh vùng cực"
 pc_arctic_desc:0 "Một thế giới đá chủ yếu là địa hình vùng cực, có lớp không khí chứa nitơ-oxy, vùng cực rất lớn, băng tuyết bao phủ phần lớn bề mặt, nhưng vẫn có sự thay đổi bốn mùa, đồng thời vùng xích đạo có cả thảm thực vật."
 pc_alpine:0 "Hành tinh đồi núi"
 pc_alpine_desc:1 "Một hành tinh núi non có lớp không khí chứa nitơ-oxy. Tuyết đọng quanh năm trên đỉnh núi, các thung lũng lác đác những hồ nước đóng băng. Dù hành tinh này ít có sự thay đổi theo mùa, nhưng dưới mặt hồ đóng băng vẫn có dòng nước chảy, đủ để duy trì các loài thực vật chịu rét."
 pc_savannah:0 "Hành tinh thảo nguyên"
 pc_savannah_desc:1 "Một hành tinh đá với lớp không khí chứa nitơ-oxy, có nhiều vùng đồng bằng rộng lớn. Thủy quyển nhỏ chỉ có thể hỗ trợ những mùa mưa ngắn ngủi. Ngoài một vài loại cỏ dại phổ biến, thảm thực vật chủ yếu nằm quanh các ốc đảo."
 pc_habitat:0 "Trạm cư trú quỹ đạo"
 pc_habitat_plural: "Trạm cư trú quỹ đạo"
 pc_habitat_desc:1 "Một môi trường sống nhân tạo ngoài không gian, mang lại trải nghiệm sống tựa như trên hành tinh, cụ thể là giống các khu vực đô thị trên đó. Các trang trại thủy canh và công nghệ lọc tiên tiến giúp trạm gần như có thể tự duy trì sự sống lâu dài, còn các cơ sở xây trên trạm thì có thể khai thác tài nguyên từ hành tinh mà nó quay quanh."
 pc_toxic:0 "Hành tinh độc hại"
 pc_toxic_plural: "Hành tinh độc hại"
 pc_toxic_desc:0 "Một thế giới đá có lớp không khí cực độc, không một sinh vật bậc cao nào có thể tồn tại."
 pc_shrouded:0 "Hành tinh hư cảnh"
 pc_shrouded_plural: "Các Hành Tinh Hư Cảnh"
 pc_shrouded_desc:0 "Các máy dò của chúng ta không thể xuyên qua lớp sương mù bao quanh hành tinh này. Bất cứ con tàu nào đi vào vùng sương này đều một đi không trở lại."
 pc_b_star:0 "Ngôi sao loại B"
 pc_b_star_short: "Loại B"
 pc_b_star_desc:0 "Các ngôi sao dãy chính loại B khổng lồ này thường có độ sáng rất thấp và hơi xanh. Dù khá hiếm, nhưng độ sáng của chúng khiến chúng nổi bật trên bầu trời đêm."
 pc_a_star:0 "Ngôi sao loại A"
 pc_a_star_short: "Loại A"
 pc_a_star_desc:0 "Những ngôi sao dãy chính trẻ tuổi có màu trắng hoặc trắng xanh này thường là những vật thể bắt mắt nhất khi nhìn bằng mắt thường. Chúng rất lớn và quay cực nhanh, nhưng cuối cùng sẽ tiến hóa thành những ngôi sao khổng lồ đỏ có nhiệt độ thấp và quay chậm."
 pc_f_star:0 "Ngôi sao loại F"
 pc_f_star_short: "Loại F"
 pc_f_star_desc:0 "Ngôi sao loại F có kích thước khá lớn, thường được gọi là sao lùn vàng-trắng. Dù chúng thường xuyên phát ra lượng lớn bức xạ tia cực tím, nhưng vùng có thể sống được rộng rãi của chúng lại mang đến cơ hội tốt cho sự sống tồn tại."
 pc_g_star:0 "Ngôi sao loại G"
 pc_g_star_short: "Loại G"
 pc_g_star_desc:0 "Ngôi sao loại G thường được gọi là sao lùn vàng, nhưng thực tế màu của chúng trải dài từ trắng đến hơi vàng. Ngôi sao dãy chính thường cần khoảng 10 tỷ năm để phản ứng tổng hợp hạt nhân trước khi tiến hóa thành sao khổng lồ đỏ. Dù tuổi thọ ngắn hơn sao loại K, nhưng sao loại G thường được xem là phù hợp hơn cho sự sống."
 pc_k_star:0 "Ngôi sao loại K"
 pc_k_star_short: "Loại K"
 pc_k_star_desc:0 "Những ngôi sao dãy chính này thường được gọi là sao lùn cam, chúng rất phổ biến trong vũ trụ. Chúng có thể tồn tại trong dãy chính ít nhất 30 tỷ năm, đồng nghĩa với việc sự sống trên các hành tinh quay quanh sao loại K sẽ có một quá trình tiến hóa cực kỳ dài và ổn định."
 pc_m_star:0 "Ngôi sao loại M"
 pc_m_star_plural: "Sao loại M"
 pc_m_star_short: "Loại M"
 pc_m_star_desc:0 "Loại ngôi sao phổ biến nhất trong vũ trụ, thường được gọi là sao lùn đỏ. Độ sáng của chúng rất thấp, khiến việc quan sát bằng mắt thường trở nên khó khăn. Dù sống rất thọ, nhưng việc hiếm khi phát ra tia cực tím khiến sao lùn đỏ không thuận lợi cho việc duy trì sự sống và sinh sống đối với hầu hết sinh vật."
 pc_t_star:0 "Sao lùn nâu loại T"
 pc_t_star_short: "Sao lùn nâu"
 pc_t_star_short_plural: "Sao lùn nâu"
 pc_t_star_desc:0 "Sao lùn nâu là những thiên thể không đủ khối lượng để duy trì phản ứng tổng hợp hạt nhân. Dù kích thước ngang bằng với hành tinh khí khổng lồ, nhưng mật độ của chúng lại lớn hơn nhiều. Vì ánh sáng yếu và tạo ra ít nhiệt, sao lùn nâu gần như không thể cung cấp môi trường sống thiết yếu cho các hành tinh quay quanh nó."
 pc_m_giant_star:0 "Sao khổng lồ đỏ loại M"
 pc_m_giant_star_desc:0 "Sao khổng lồ đỏ có bán kính cực lớn và nhiệt độ bề mặt khá thấp, là hình thái khi những ngôi sao có khối lượng vừa phải tiến hóa đến giai đoạn suy tàn. Lớp không khí bành trướng và ánh sáng mạnh mẽ của sao khổng lồ đỏ có thể tạo ra một vùng sống được nằm cách nó rất xa."
 pc_black_hole:0 "Hố đen"
 pc_black_hole_plural: "Hố đen"
 pc_black_hole_desc:1 "Hố đen thường hình thành khi những ngôi sao cực lớn sụp đổ vào cuối chu kỳ sống. Hố đen có trường trọng lực cực mạnh, ngăn cản mọi thứ—kể cả ánh sáng—thoát khỏi nó. Sóng hấp dẫn từ hố đen sẽ làm gián đoạn hoạt động của động cơ siêu không gian, khiến các tàu chiến khó mà thoát khỏi vùng chiến đấu khẩn cấp."
 pc_neutron_star:0 "Sao neutron"
 pc_neutron_star_plural: "Sao neutron"
 pc_neutron_star_desc:2 "Khi những ngôi sao lớn nhanh chóng sụp đổ và phát nổ, chúng tạo ra những tàn tích sao đáng kinh ngạc này. Dù đường kính thường chỉ có 10 km, khối lượng của chúng lại lớn gấp nhiều lần so với một ngôi sao loại G bình thường. Sóng hấp dẫn và bức xạ từ sao neutron đòi hỏi phi hành đoàn phải lái cẩn thận khi đi qua, dẫn đến tốc độ di chuyển của tàu bị giảm đáng kể khi qua khu vực này."
 pc_pulsar:0 "Sao xung"
 pc_pulsar_plural: "Sao xung"
 pc_pulsar_desc:1 "Sao xung là những sao neutron có từ tính cao và có khả năng phát ra tia bức xạ. Khi ngôi sao quay ở tốc độ cao, chùm bức xạ chỉ có thể nhìn thấy khi trục của nó hướng trực tiếp vào người quan sát. Hiện tượng này tạo ra nhịp điệu bức xạ rất đều đặn, có lúc chính xác đến mức có thể dùng để đo lường thời gian trôi qua. Bức xạ từ sao xung sẽ phá vỡ công nghệ lá chắn, khiến hệ thống lá chắn của tàu và trên mặt đất không thể hoạt động."
 pc_toxoid_star:0 "Ngôi sao Ánh Lục"
 pc_toxoid_star_desc:0 "Hàng nghìn năm tiếp xúc với vị thần độc hại đã làm thay đổi cấu trúc của ngôi sao này. Nó từng là một ngôi sao loại G khá chuẩn mực, nhưng giờ đây nó lại tỏa ra một làn sương mù xanh lục kỳ dị, khác biệt với phần còn lại của hệ sao."
 pc_infested:0 "Hành tinh ổ nhộng"
 pc_infested_desc:0 "Sự xâm thực của sinh học đã bao trùm toàn bộ bề mặt hành tinh này."
 pc_gaia:0 "Thế giới Gaia"
 pc_gaia_plural: "Thế giới Gaia"
 pc_gaia_desc:0 "Thế giới này có lớp không khí chứa nitơ-oxy, hệ sinh thái có thể tự phục hồi, ở mọi vĩ độ đều là không gian sinh tồn tuyệt vời cho các sinh vật bậc cao."
 pc_nuked:0 "Thế giới Mộ địa"
 pc_nuked_plural: "Thế giới Mộ địa"
 pc_nuked_desc:0 "Một hành tinh đá với lớp không khí tràn ngập nitơ và oxy. Hiện tại, nó đang trải qua một mùa đông hạt nhân, lớp không khí chứa đầy bụi đen đặc quánh. Mức độ bức xạ trên bề mặt rất cao. Gần như không có dấu hiệu sự sống."
 pc_ringworld_habitable:1 "Phân khu vành đai"
 pc_ringworld_habitable_plural: "Các Phân Khu Vành Đai"
 pc_ringworld_habitable_desc:1 "Một phần của Thế giới Vành đai, dải đai khổng lồ bao quanh ngôi sao trung tâm của hệ sao.\nĐược xây dựng để tạo ra nhiều khu vực sinh sống nhân tạo dọc theo vành trong, thoát khỏi sự giới hạn và đơn điệu của các hành tinh hình cầu."
 pc_ringworld_tech:1 "$pc_ringworld_habitable$"
 pc_ringworld_tech_desc:1 "Một phần của Thế giới Vành đai, dải đai khổng lồ bao quanh ngôi sao trung tâm của hệ sao.\nĐược xây dựng để tạo ra nhiều khu vực sinh sống nhân tạo dọc theo vành trong, thoát khỏi sự giới hạn và đơn điệu của các hành tinh hình cầu."
 pc_ringworld_seam:1 "$pc_ringworld_habitable$"
 pc_ringworld_seam_desc:1 "Một phần của Thế giới Vành đai, dải đai khổng lồ bao quanh ngôi sao trung tâm của hệ sao.\nĐược xây dựng để tạo ra nhiều khu vực sinh sống nhân tạo dọc theo vành trong, thoát khỏi sự giới hạn và đơn điệu của các hành tinh hình cầu."
 pc_ringworld_habitable_damaged:1 "$pc_ringworld_habitable$ bị hỏng"
 pc_ringworld_habitable_damaged_desc:1 "Một phần của Thế giới Vành đai, dải đai khổng lồ bao quanh ngôi sao trung tâm của hệ sao.\nPhân khu này của siêu cấu trúc dường như đã bị hư hại không thể phục hồi."
 pc_ringworld_tech_damaged:1 "$pc_ringworld_habitable_damaged$"
 pc_ringworld_tech_damaged_desc:1 "Một phần của Thế giới Vành đai, dải đai khổng lồ bao quanh ngôi sao trung tâm của hệ sao.\nPhân khu này của siêu cấu trúc dường như đã bị hư hại không thể phục hồi."
 pc_ringworld_seam_damaged:1 "$pc_ringworld_habitable_damaged$"
 pc_ringworld_seam_damaged_desc:1 "Một phần của Thế giới Vành đai, dải đai khổng lồ bao quanh ngôi sao trung tâm của hệ sao.\nPhân khu này của siêu cấu trúc dường như đã bị hư hại không thể phục hồi."
 pc_shielded:0 "Hành tinh có khiên chắn"
 pc_shielded_desc:1 "[Root.GetShieldedPlanetDesc]"
 pc_shielded_desc_orig:0 "Toàn bộ hành tinh bị phong tỏa bởi một loại màng chắn năng lượng không thể xuyên thủng. Màng chắn này chặn mọi nỗ lực quét tìm kiếm trên bề mặt của nó."
 pc_ai:0 "Hành tinh trí tuệ nhân tạo"
 pc_ai_desc:0 "Một hành tinh đá với bề mặt được bao phủ bởi các công trình nhân tạo. Khí quyển mỏng manh chủ yếu chứa toàn chất thải công nghiệp. Một lượng năng lượng khổng lồ được phát ra từ toàn bộ bề mặt hành tinh, nhưng không hề có tín hiệu của bất kỳ sinh vật hữu cơ nào."
 pc_machine:0 "Hành tinh máy móc"
 pc_machine_desc:0 "Hành tinh đá bị bao phủ bởi các kiến trúc nhân tạo, lớp không khí mỏng manh ngập tràn khí thải công nghiệp, các sinh vật hữu cơ hoàn toàn không thể sống sót."
 pc_machine_broken:0 "Hành tinh trí tuệ nhân tạo vỡ vụn"
 pc_machine_broken_desc:0 "$pc_ai_desc$"
 pc_hive:0 "Hành tinh tổ đàn"
 pc_hive_desc:0 "Toàn bộ thế giới này là một sinh vật sống khổng lồ, kết nối tâm linh với Ý thức Bầy đàn đã định hình nên nó. Bất kỳ sinh vật nào không thuộc về Bầy đàn khi đặt chân lên đây đều sẽ bị chính địa hình nơi này tấn công."
 pc_cybrex:0 "$pc_ringworld_habitable$"
 pc_cybrex_desc:0 "$pc_ringworld_habitable_desc$"
 pc_shattered:0 "Hành tinh nát vụn"
 pc_shattered_desc:0 "Tàn tích đen kịt của một hành tinh từng tồn tại. Một đợt chấn động năng lượng khổng lồ đã làm nổ tung lõi của hành tinh này, giờ chỉ còn lại những mảnh đá lơ lửng."
 pc_ice_asteroid:0 "Tiểu hành tinh băng"
 pc_ice_asteroid_desc:0 "Một tiểu hành tinh khổng lồ, được tạo thành chủ yếu từ các phân tử nước đóng băng."
 pc_rare_crystal_asteroid:0 "$pc_crystal_asteroid$"
 pc_rare_crystal_asteroid_desc:0 "$pc_crystal_asteroid_desc$"
 pc_shattered_ring_habitable:1 "Phân khu vành đai vụn vỡ"
 pc_shattered_ring_habitable_desc:1 "Một phần của Thế giới Vành đai, dải đai khổng lồ bao quanh ngôi sao trung tâm của hệ sao.\nPhân khu này của siêu cấu trúc đã chịu nhiều hư hại — đặc biệt là ở một số khu vực tiên tiến — nhưng dường như không phải là không thể phục hồi."

