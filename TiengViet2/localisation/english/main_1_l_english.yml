 commander_description: "§LSự chỉ huy quyết đoán của một Chỉ huy kiên cường sẽ trui rèn ý chí cho binh sĩ, giúp hạm đội của ta ngày càng lớn mạnh.§!"
 admiral_description:1 "§LSự hiện diện vững vàng của một Đô đốc quyết đoán sẽ giúp các thủy thủ đoàn giữ vững tinh thần khi giáp mặt kẻ thù.§!"
 general_description:0 "§LSự hỗn loạn và điên cuồng của những trận chiến trên mặt đất đòi hỏi bộ óc chỉ huy lão luyện của một Tướng quân thực thụ.§!"
 scientist_description:0 "§LNhững bí ẩn và nghịch lý của vũ trụ luôn vẫy gọi khát khao tri thức của các Nhà khoa học lỗi lạc.§!"
 governor_description:1 "§LNhững bài diễn thuyết lôi cuốn từ một Thống đốc đáng tin cậy sẽ truyền cảm hứng cho quần chúng, nâng cao lòng tự hào và sự phồn vinh cho thuộc địa.§!"
 official_description: "§LNhững lời thuyết phục từ một $official$ đáng tin cậy sẽ giúp thắt chặt hơn các mối quan hệ ngoại giao của chúng ta.§!"
 ruler_description:1 "§LBằng cả ân và uy, Người cai trị dẫn dắt đế chế vươn mình ra biển sao rộng lớn.§!"

