 FE_CLUSTERED_STARTS:1 "Vị trí khởi đầu"
 FE_CLUSTERED_STARTS_TOOLTIP:1 "§HVị trí khởi đầu§!\nTùy chọn này quyết định các hành tinh gốc của các đế chế sẽ gom lại với nhau hay rải rác ngẫu nhiên khắp vũ trụ."
 FE_ADVANCED_NEAR_PLAYER:0 "Hàng xóm cấp cao"
 FE_ADVANCED_NEAR_PLAYER_TOOLTIP:2 "§HLáng giềng Nâng cao§!\nTùy chọn này kiểm soát liệu các đế chế có ['concept_advanced_empires', Khởi Đầu AI Nâng Cao] có được phép xuất hiện gần người chơi hay không. Đặt là §YTắt§! có thể dẫn đến việc số lượng khởi đầu nâng cao được tạo ra ít hơn con số đã chỉ định."
 FE_MID_GAME:0 "Bắt đầu giữa game"
 FE_MID_GAME_TOOLTIP:1 "§H$FE_MID_GAME$§!\nTùy chọn này quy định năm sớm nhất nổ ra các sự kiện giữa game, như ['concept_machine_uprising'] và sự trỗi dậy của ['concept_great_khan']."
 FE_GUARANTEED_COLONIES:0 "Đảm bảo hành tinh sống được"
 FE_GUARANTEED_COLONIES_TOOLTIP:1 "§H$FE_GUARANTEED_COLONIES$§!\nTùy chọn này đảm bảo có bao nhiêu hành tinh cùng loại với hành tinh gốc nằm ngay gần hệ sao khởi đầu của bạn.\n\n§RCảnh báo:§! Tắt tùy chọn này nghĩa là xung quanh nơi bạn bắt đầu sẽ không có sẵn hành tinh sống được."
 FE_VICTORY:0 "Năm chiến thắng"
 FE_VICTORY_TOOLTIP:1 "§H$FE_VICTORY$§!\nTùy chọn này ấn định năm game có thể kết thúc khi không có ['concept_endgame_crisis'] hoặc ['concept_war_in_heaven']. Kẻ có §Iđiểm số§! cao nhất sẽ thắng. Tuy nhiên sau đó người chơi vẫn có thể chơi tiếp. Kéo thanh trượt lên mốc tối đa sẽ tắt đếm ngược chiến thắng.\n\nThiết lập thanh trượt ở mức cao nhất sẽ chặn mọi dạng chiến thắng theo định kỳ."
 FE_END_GAME:0 "Bắt đầu cuối game"
 FE_END_GAME_TOOLTIP:1 "§H$FE_END_GAME$§!\nTùy chọn này quy định năm sớm nhất kích hoạt sự kiện cuối game, bao gồm ['concept_endgame_crises'] và ['concept_fallen_empire_awakening']."
 FE_TECH_SPEED:3 "Chi phí công nghệ"
 FE_TECH_SPEED_TOOLTIP:3 "§H$FE_TECH_SPEED$§!\nTùy chọn này kiểm soát tốc độ nghiên cứu các nâng cấp ['concept_technologies'] của đế chế thường."
