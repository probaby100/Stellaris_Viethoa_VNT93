 # Traits
 ####################################

 trait_rapid_breeders:0 "Sinh sản nhanh"
 trait_rapid_breeders_desc:0 "§LChu kỳ sinh sản của loài này khá ngắn, khiến dân số của họ tăng lên rất nhanh.§!\n"
 trait_rapid_breeders_lithoid:0 "$trait_rapid_breeders$"
 trait_rapid_breeders_lithoid_desc:0 "$trait_rapid_breeders_desc$"
 trait_slow_breeders:0 "Sinh sản chậm"
 trait_slow_breeders_desc:0 "§LChu kỳ sinh sản của loài này khá dài, khiến dân số của họ tăng trưởng chậm chạp.§!\n"
 trait_delicious:0 "Thơm ngon"
 trait_delicious_desc:0 "§LLoài này tiến hóa một cách kỳ diệu thành những sinh vật cực kỳ bổ dưỡng và nhai giòn rụm.§!\n"
 trait_nerve_stapled:0 "Tê liệt thần kinh"
 trait_nerve_stapled_desc:0 "§LBằng cách cắt đứt các dây thần kinh không cần thiết như tự vệ và ý chí tự do, chúng ta có thể tạo ra một giống loài ngoan ngoãn, dễ bảo.§!\n"
 trait_fertile:0 "Mắn đẻ"
 trait_fertile_desc:1 "§LThông qua việc chỉnh sửa mạnh tay cả về thể chất lẫn hành vi, khả năng thụ thai tự nhiên và sức hút của loài này được cải thiện rõ rệt.§!\n"
 trait_erudite:0 "Uyên bác"
 trait_erudite_desc:1 "§LCông nghệ sinh học đã mở khóa những phần não bộ từng ngủ quên của loài này, giúp trí tuệ của họ thêm phần sắc bén.§!\n"
 trait_robust:0 "Cường tráng"
 trait_robust_desc:0 "§LNhờ tối ưu hóa mặt sinh học cùng những cơ quan dự phòng chức năng, loài này có sức đề kháng phi thường trước thiên tai và dịch bệnh.§!\n"
 trait_charismatic:0 "Cuốn hút"
 trait_charismatic_desc:0 "§LLoài này có một sức hút đặc biệt, khiến bất kỳ sinh vật nào cũng muốn được gần gũi họ.§!\n"
 trait_repugnant:0 "Gây ác cảm"
 trait_repugnant_desc:0 "§LNgoại hình và thói quen của loài này thường khiến các sinh vật khác thấy phản cảm, rất ít ai muốn giao du với họ.§!\n"
 trait_talented:0 "Tài năng thiên bẩm"
 trait_talented_desc:0 "§LLoài này sở hữu những tài năng bẩm sinh.§!\n"
 trait_strong:0 "Khỏe mạnh"
 trait_strong_desc:0 "§LLoài này có cơ bắp phát triển, khi tác chiến trên mặt đất họ sẽ hóa thành những chiến binh dũng mãnh.§!\n"
 trait_strong_tt: "Hiệu suất công việc của lao động chân tay: §G+2.50%§!"
 trait_very_strong:0 "Vô cùng khỏe mạnh"
 trait_very_strong_desc:0 "§LSức mạnh cơ bắp của loài này to lớn đến mức gần như phá vỡ các định luật vật lý.§!\n"
 trait_very_strong_tt: "Hiệu suất công việc của lao động chân tay: §G+5.00%§!"
 trait_weak:0 "Yếu ớt"
 trait_weak_desc:0 "§LThể chất của loài này yếu hơn các sinh vật bình thường, khiến họ không thể trở thành những chiến binh giỏi.§!\n"
 trait_weak_tt: "Hiệu suất công việc của lao động chân tay: §R-2.50%§!"
 trait_tough:0 "Cứng cỏi"
 trait_tough_desc:0 "Các cá thể của loài này có thể chịu đựng được những vết thương vốn đủ sức giết chết hầu hết các sinh vật khác.\n"
 trait_frail:0 "Mỏng manh"
 trait_frail_desc:0 "§LLoài này khá mỏng manh, chỉ một vết thương nhỏ cũng có thể lấy mạng họ.§!\n"
 trait_stoic:0 "Điềm tĩnh"
 trait_stoic_desc:0 "§LTrái tim của loài này rất vững vàng, họ hiếm khi hoảng loạn khi đối mặt với hiểm nguy.§!\n"
 trait_timid:0 "Nhút nhát"
 trait_timid_desc:0 "§LLoài này sẽ cố gắng hết sức để tránh các xung đột thể xác và rất dễ bị hoảng loạn.§!\n"
 trait_indolent:0 "Lười biếng"
 trait_indolent_desc:0 "§LLoài này nhìn chung không chịu khó làm lụng, và thường chẳng buồn nhấc chân tay lên.§!\n"
 trait_communal:0 "Hòa đồng"
 trait_communal_desc:0 "§LLoài này có tính xã hội bầy đàn rất cao, họ rất vui lòng sống chung với các sinh vật khác.§!\n"
 trait_solitary:0 "Sống đơn độc"
 trait_solitary_desc:0 "§LLoài này sẽ trở nên cáu kỉnh trong môi trường đông đúc, họ thích ở một mình hơn.§!\n"
 trait_adaptive:0 "Dễ thích nghi"
 trait_adaptive_desc:1 "§LLoài này có thể dễ dàng làm quen với một môi trường xa lạ.§!\n"
 trait_adaptive_lithoid:0 "$trait_adaptive$"
 trait_adaptive_lithoid_desc:0 "$trait_adaptive_desc$"
 trait_extremely_adaptive:0 "Cực kỳ dễ thích nghi"
 trait_extremely_adaptive_desc:0 "§LLoài này có thể chấp nhận hầu như mọi loại môi trường.§!\n"
 trait_nonadaptive:0 "Khó thích nghi"
 trait_nonadaptive_desc:0 "§LLoài này khó làm quen với môi trường lạ.§!\n"
 trait_nomadic:0 "Du mục"
 trait_nomadic_desc:0 "§LLoài này có lịch sử tiến hóa theo lối du mục, họ đã quá quen với việc di cư và mở rộng bờ cõi.§!\n"
 trait_sedentary:0 "Định cư"
 trait_sedentary_desc:0 "§LLoài này có quá khứ bám rễ một chỗ, người dân rất không muốn rời khỏi nơi mình lớn lên.§!\n"
 trait_thrifty:0 "Tiết kiệm"
 trait_thrifty_desc:0 "§LLoài này mang bản tính tiết kiệm, luôn thích làm mọi cách để tối đa hóa lợi ích.§!\n"
 trait_ingenious:0 "Tháo vát"
 trait_ingenious_desc:0 "§LLoài này có đầu óc linh hoạt, giỏi phá vỡ lối mòn, họ biết cách tận dụng tối đa cơ sở hạ tầng và mạng lưới điện của mình.§!\n"
 trait_industrious:0 "Chăm chỉ"
 trait_industrious_desc:0 "§LLoài này rất chịu thương chịu khó, luôn cố gắng vượt qua giới hạn nỗ lực của bản thân.§!\n"
 trait_natural_engineers:0 "Kỹ sư bẩm sinh"
 trait_natural_engineers_desc:0 "§LLoài này có hứng thú bẩm sinh với kỹ thuật và khoa học vật liệu.§!\n"
 trait_poor_engineers:0 "Kỹ sư tồi"
 trait_poor_engineers_desc:0 "§LLoài này mù tịt về các khái niệm cơ bản của kỹ thuật.§!\n"
 trait_natural_physicists:0 "Nhà vật lý bẩm sinh"
 trait_natural_physicists_desc:0 "§LLoài này có hứng thú bẩm sinh với vật lý lý thuyết và các hiện tượng thiên văn.§!\n"
 trait_poor_physicists:0 "Nhà vật lý tồi"
 trait_poor_physicists_desc:0 "§LLoài này mù tịt về các khái niệm cơ bản của vật lý lý thuyết.§!\n"
 trait_natural_sociologists:0 "Nhà xã hội học bẩm sinh"
 trait_natural_sociologists_desc:0 "§LLoài này có hứng thú bẩm sinh với xã hội học và khoa học sinh học.§!\n"
 trait_poor_sociologists:0 "Nhà xã hội học tồi"
 trait_poor_sociologists_desc:0 "§LLoài này mù tịt về các khái niệm cơ bản của các ngành khoa học xã hội.§!\n"
 trait_quick_learners:0 "Sáng dạ"
 trait_quick_learners_desc:0 "§LLoài này rất giỏi tiếp thu kiến thức từ kinh nghiệm của chính bản thân.§!\n"
 trait_slow_learners:0 "Tối dạ"
 trait_slow_learners_desc:0 "§LLoài này không giỏi tiếp thu kiến thức từ những gì đã trải qua.§!\n"
 trait_long_lifespans:0 "Sống lâu"
 trait_long_lifespans_desc:0 "§LLoài này sống lâu hơn các sinh vật khác.§!\n"
 trait_short_lifespans:0 "Sống ngắn"
 trait_short_lifespans_desc:0 "§LLoài này có tuổi thọ ngắn hơn các sinh vật khác.§!\n"
 trait_uplifted:0 "Được nâng tầm"
 trait_uplifted_desc:1 "§LLoài này được nâng tầm từ trạng thái chỉ có bản năng và cảm xúc cơ bản. Giờ đây mang trong mình trí tuệ, họ phải học cách làm chủ ý chí tự do.§!\n"
 trait_presapient_starborn:0 "Khát vọng trời sao"
 trait_presapient_starborn_desc:0 "§LLoài này luôn có một niềm khao khát mãnh liệt hướng về biển sao bao la.§!\n"
 trait_presapient_earthbound:0 "Gắn bó quê nhà"
 trait_presapient_earthbound_desc:0 "§LLoài này quyết không rời nửa bước khỏi hành tinh mà họ gọi là nhà.§!\n"
 trait_presapient_natural_intellectuals:0 "Thông minh bẩm sinh"
 trait_presapient_natural_intellectuals_desc:0 "§LLoài này sáng suốt hơn các sinh vật khác.§!\n"
 trait_presapient_proles:0 "Tầng lớp bần nông"
 trait_presapient_proles_desc:0 "§LNiềm khao khát tư duy triết học của loài này đã bị dập tắt hoàn toàn bởi những công việc chân tay truyền thống.§!\n"
 trait_syncretic_proles:0 "Phục tùng"
 trait_syncretic_proles_desc:0 "§LLoài này tiến hóa cùng với một xã hội tiên tiến hơn. Dù ban đầu không cố ý, nhưng quá trình nhân giống chọn lọc cả về thể chất lẫn tâm lý đã biến họ thành những kẻ hầu người hạ ngoan ngoãn.§!"
 trait_presapient_conservative:0 "Tính bảo thủ"
 trait_presapient_conservative_desc:0 "§LSo với những điều mới mẻ, loài này thường muốn tin vào những kinh nghiệm cũ kĩ hơn.§!\n"
 trait_presapient_irradiated:0 "Nhiễm xạ"
 trait_presapient_irradiated_desc:0 "§LLoài này có thể phát triển mạnh mẽ trong môi trường bức xạ dày đặc.§!"
 trait_persistent:0 "Trường thọ"
 trait_persistent_desc:0 "§LĐặc điểm này sẽ giúp các nhà lãnh đạo của bạn sống lâu hơn.§!\n"
 trait_conformists:0 "Tuân thủ"
 trait_conformists_desc:0 "§LLoài này thích tìm kiếm sự đồng thuận và muốn tuân theo những hệ tư tưởng dòng chính.§!\n"
 trait_deviants:0 "Lệch chuẩn"
 trait_deviants_desc:0 "§LLoài này sinh ra đã mang tính nổi loạn, sẽ không ngừng cố gắng thách thức hiện trạng.§!\n"
 trait_enduring:0 "Sống dai"
 trait_enduring_desc:0 "§LTuổi thọ của loài này dài đến mức đáng ngạc nhiên.§!\n"
 trait_venerable:0 "Đáng kính"
 trait_venerable_desc:0 "§LSinh vật này sống đủ lâu để được người khác kính trọng nhờ tuổi tác.§!\n"
 trait_fleeting:0 "Sớm nở chóng tàn"
 trait_fleeting_desc:0 "§LĐối với loài này, thời gian trôi qua chớp nhoáng. Họ không thể kéo dài tuổi thọ, nên quyết định mở rộng độ sâu sắc của cuộc đời.§!\n"
 trait_fleeting_lithoid:0 "$trait_fleeting$"
 trait_fleeting_lithoid_desc:0 "$trait_fleeting_desc$"
 trait_diverse:0 "Đa dạng"
 trait_diverse_desc:0 "§LMỗi cá thể của loài này đều không giống nhau, cả về thể chất lẫn suy nghĩ.§!\n"
 trait_decadent:0 "Suy đồi"
 trait_decadent_desc:2 "§LLoài này cho rằng, những công việc nặng nhọc tốt nhất là nên để người khác làm.§!\n"
 trait_intelligent:0 "Thông tuệ"
 trait_intelligent_desc:0 "§LLoài này có não bộ rất phát triển, họ có thể dễ dàng tiếp thu những tiến bộ khoa học từng ngày.§!\n"
 trait_agrarian:0 "Nhà nông"
 trait_agrarian_desc:0 "§LLoài này có mối liên kết khó chia lìa với đất đai, khiến họ trở thành những chuyên gia trong nông nghiệp và làm vườn.§!\n"
 trait_resilient:0 "Phục hồi nhanh"
 trait_resilient_desc:0 "§LLoài này có thể nhanh chóng phục hồi sau khi bị thương, và sẽ chiến đấu bảo vệ hành tinh của mình như những con nhện mẹ đang giận dữ.§!\n"
 trait_mechanical:0 "Thể máy móc"
 trait_mechanical_desc:2 "§LThể máy móc phức tạp hơn nhiều so với các robot chuyên dụng truyền thống, nhưng hầu hết cũng chỉ có khả năng xử lý giới hạn.§!\n"
 trait_robotic_1:0 "Người máy"
 trait_robotic_1_desc:1 "§LNgười máy là những thể máy móc tương đối đơn giản, chúng có thể xử lý các khẩu lệnh nhưng bản thân không sở hữu trí tuệ thực sự.§!\n"
 trait_robot_awoken_01:0 "Mắc kẹt vĩnh viễn"
 trait_robot_awoken_01_desc:0 "Do những lỗi hệ thống không thể giải thích và sự cố máy móc liên miên, những người ngoài hành tinh cổ đại này đã không thích ứng tốt với cơ thể máy mới của mình. Dù vậy, trong quá trình đó họ đã thể hiện một tài năng khoa học phi thường chưa từng có ở các người máy cấp thấp trước đây, có lẽ đây là một loại trí tuệ nảy sinh trong hoàn cảnh ngặt nghèo."
 trait_robot_awoken:0 "Kẻ thức tỉnh"
 trait_robot_awoken_desc:0 "Những kẻ thức tỉnh, ngay cả trong thân xác máy móc, vẫn giữ nguyên những thói quen cũ. Phải chăng lối sống phung phí và trì trệ chính là nguyên nhân dẫn đến sự lụi tàn của giống loài nấm cổ đại có nền công nghệ phát triển rực rỡ này?"
 trait_robotic_2:0 "Người máy thông minh"
 trait_robotic_2_desc:1 "§LNgười máy thông minh là những robot phức tạp hơn, chúng thường được cài sẵn tính cách để làm hài lòng chủ nhân tốt hơn, dù trí tuệ của chúng rất hạn chế.§!\n"
 trait_robotic_3:0 "Người tổng hợp"
 trait_robotic_3_desc:1 "§LNgười tổng hợp là loại máy móc tinh vi mang nhiều ưu thế hơn so với sinh vật hữu cơ thông thường. Bộ xử lý trung tâm của chúng có thể gánh vác trí tuệ nhân tạo cấp độ bảy, đạt được sự tự nhận thức hoàn toàn.§!\n"
 trait_conservational:0 "Tiết kiệm tài nguyên"
 trait_conservational_desc:0 "§LCác thành viên của loài này tin rằng tài nguyên cần phải được bảo vệ và tái chế.§!"
 HIVE_MIND_NO_FACTIONS:0 "§RÝ thức Gestalt sẽ không bao giờ sinh ra các phe phái.§!"
 NO_POTENTIAL_CLAIM:0 "§RTrong phạm vi đã biết hiện tại, không có hệ sao nào của đế chế khác để có thể tuyên bố chủ quyền.§!"
 NO_POTENTIAL_CLAIM_ON_RECIPIENT:0 "§RChúng ta không thể tuyên bố chủ quyền trên hệ sao của họ.§!"
 trait_wasteful:0 "Phung phí"
 trait_wasteful_desc:0 "§LLoài này dường như không có khái niệm tiết kiệm, thích vung tiền vào những thứ vô bổ.§!\n"
 trait_hive_mind:0 "Ý Thức Bầy Đàn"
 trait_hive_mind_desc:0 "§LLoài này gồm các cá thể bán tự chủ, được gắn kết bởi một ý thức vĩ đại và sâu thẳm duy nhất.§!\n"
 trait_machine_unit:0 "Máy móc"
 trait_machine_unit_desc:1 "§LLoài này được cấu tạo từ những cỗ máy có công nghệ cực kỳ tiên tiến.§!\n"
 trait_lithoid:0 "Đất đá"
 trait_lithoid_desc:0 "§LLoài này thuộc dạng sống dựa trên silic, tồn tại nhờ khoáng chất thay vì thức ăn. Chúng cứng cáp hơn sinh vật hữu cơ truyền thống, trao đổi chất chậm nên sống lâu hơn nhưng cũng sinh sản chậm hơn.§!\n"
 trait_robot_power_drills:0 "Mũi khoan động lực"
 trait_robot_power_drills_desc:0 "§LNếu gắn máy khoan lên người robot, thì cái gì trông cũng giống quặng thôi.§!\n"
 trait_robot_harvesters:0 "Bộ dụng cụ thu hoạch"
 trait_robot_harvesters_desc:0 "§LTừ liệu pháp dinh dưỡng, công nghệ cân bằng tại chỗ đến kỹ thuật đập lúa bằng một cọc, toàn bộ bộ công cụ này giúp tăng sản lượng lương thực do các robot lao động làm ra.§!\n"
 trait_robot_efficient_processors:0 "Bộ xử lý hiệu suất cao"
 trait_robot_efficient_processors_desc:1 "§LNhững bộ xử lý cực kỳ hiệu quả này giúp tăng năng suất và độ bền cho mọi đơn vị.§!"
 trait_robot_logic_engines:0 "Động cơ logic"
 trait_robot_logic_engines_desc:0 "§LĐể kiểm soát các nghiên cứu khoa học ngày càng phức tạp, chúng ta cần một loại logic thuật toán tiên tiến hơn so với hệ đếm cơ số ba hay cơ số bốn nửa vời.§!\n"
 trait_robot_loyalty_circuits:0 "Mạch trung thành"
 trait_robot_loyalty_circuits_desc:0 "§LKhái niệm trung thành chỉ thuộc về sinh vật hữu cơ. Vì vậy, hãy tưởng tượng sự trung thành giống như một nhu cầu sinh lý mà ngay cả các trạm cuối xa xôi nhất cũng phải đáp ứng.§!\n"
 trait_robot_domestic_protocols:0 "Giao thức phục vụ"
 trait_robot_domestic_protocols_desc:1 "§LThiết bị và các giao thức hành vi chuyên dụng có thể đáp ứng mọi nhu cầu việc nhà. Đảm bảo lo liệu chu toàn mọi thứ.§!"
 trait_robot_superconductive:0 "Tính siêu dẫn"
 trait_robot_superconductive_desc:1 "§LViệc ứng dụng vật liệu siêu dẫn vào thiết kế các đơn vị đã giảm mức hao hụt trong quá trình truyền tải năng lượng xuống mức 0%.§!\n"
 trait_robot_double_jointed:0 "Khớp nối đa hướng"
 trait_robot_double_jointed_desc:0 "§LNhững đơn vị lao động dạng gập này có các khớp nối linh hoạt, giúp chúng có thể tự xếp lại gọn gàng trong quá trình vận chuyển rồi tự lắp ráp ngay tại hiện trường.§!\n"
 trait_robot_bulky:0 "Cồng kềnh"
 trait_robot_bulky_desc:0 "§LNhững cỗ siêu máy móc cực kỳ tiên tiến này không được thiết kế để nhét vào hộp mà du hành khắp vũ trụ.§!\n"
 trait_robot_enhanced_memory:0 "Nâng cấp bộ nhớ"
 trait_robot_enhanced_memory_desc:1 "§LTất cả các đơn vị tự động đều được trang bị bộ nhớ dùng công nghệ cảm ứng từ mới mang tính cách mạng, giúp cải thiện hiệu suất của chúng một cách rõ rệt.§!\n"
 trait_robot_emotion_emulators:0 "Bộ giả lập cảm xúc"
 trait_robot_emotion_emulators_desc:1 "§LCác mô hình dự đoán xã hội phức tạp không chỉ giúp các đơn vị tự động bắt chước cảm xúc một cách phù hợp, mà còn giúp chúng nhận được phản hồi tích cực từ cả sinh vật hữu cơ lẫn thể tổng hợp.§!\n"
 trait_robot_uncanny:0 "Đáng sợ"
 trait_robot_uncanny_desc:0 "§LNhững cỗ máy đáng sợ này được tạo ra dựa trên nguyên mẫu là một trong những loài gieo rắc nỗi kinh hoàng nhất vũ trụ, khiến chúng trông cực kỳ rùng rợn.§!\n"
 trait_robot_durable:0 "Bền bỉ"
 trait_robot_durable_desc:0 "§LSở hữu bộ xương ngoài bảo vệ bằng hợp kim titan mạ crom, những cỗ máy hạng nặng này được thiết kế riêng cho các môi trường khắc nghiệt và chỉ cần bảo trì ở mức tối thiểu.§!\n"
 trait_robot_high_maintenance:0 "Bảo trì thường xuyên"
 trait_robot_high_maintenance_desc:0 "§LThiết kế của những cỗ máy này hoàn toàn bỏ qua vấn đề tuổi thọ, do đó chúng hay bị hỏng vặt. Chúng sẽ cần được bảo trì liên tục.§!\n"
 trait_robot_learning_algorithms:0 "Thuật toán học hỏi"
 trait_robot_learning_algorithms_desc:0 "§LCác thuật toán tự học hỏi phức tạp có khả năng kích thích các nút thần kinh của đơn vị tiến hóa nhanh chóng.§!\n"
 trait_robot_repurposed_hardware:0 "Phần cứng cải biến"
 trait_robot_repurposed_hardware_desc:0 "§LDòng máy móc này vốn được thiết kế cho những mục đích cụ thể, khả năng tư duy độc lập không nằm trong bản vẽ gốc, và việc cải tạo cũng chỉ có giới hạn nhất định.§!\n"
 trait_robot_mass_produced:0 "Sản xuất hàng loạt"
 trait_robot_mass_produced_desc:0 "§LDây chuyền sản xuất hợp lý và thiết kế dạng mô-đun giúp các đơn vị này có thể được sản xuất hàng loạt với hiệu suất cực cao.§!\n"
 trait_robot_custom_made:0 "Chế tạo theo yêu cầu"
 trait_robot_custom_made_desc:0 "§LMỗi đơn vị mới đều được làm ra với sự trau chuốt tỉ mỉ đến từng chi tiết nhỏ nhất. Dù đây là một kỳ quan về mặt kỹ thuật và nghệ thuật, nhưng quy trình này lại thiếu đi tính hiệu quả.§!\n"
 trait_robot_recycled:0 "Tái chế"
 trait_robot_recycled_desc:0 "§LQuá trình sản xuất đơn vị được tối ưu để tiết kiệm chi phí tối đa, bằng cách dùng vật liệu tái chế và các bộ phận được thừa hưởng từ những thế hệ trước.§!\n"
 trait_robot_luxurious:0 "Xa xỉ"
 trait_robot_luxurious_desc:0 "§LĐược thiết kế theo tôn chỉ \"chất lượng là vô giá\", những đơn vị hàng đầu này có giá cả không hề rẻ, nhưng bù lại chúng trông vô cùng bóng bẩy.§!\n"
 trait_robot_propaganda_machines:0 "Cỗ máy tuyên truyền"
 trait_robot_propaganda_machines_desc:0 "§LCác đơn vị này có thể phát liên tục các thông báo phục vụ cộng đồng và vô vàn thông tin hữu ích khác qua hệ thống phát thanh nội bộ.§!\n"
 trait_survivor:0 "Người sống sót"
 trait_survivor_desc:0 "§LLoài này đã sống sót sau một thảm họa hạt nhân diệt vong. Sức sinh tồn của họ trong những môi trường khắc nghiệt là điều không thể xem thường.§!"
 trait_robot_survivor: "Lá chắn phóng xạ"
 trait_robot_survivor_desc:0 "§LNhững cỗ máy này là những người sống sót duy nhất sau một thảm họa hạt nhân hủy diệt, chúng đã cho thấy sức chống chịu tuyệt đỉnh trước những môi trường tồi tệ nhất.§!"
 trait_traditional:0 "Truyền thống"
 trait_traditional_desc:0 "§LDo một số khía cạnh về nhận thức, loài này đặc biệt chú trọng đến việc nghiên cứu lịch sử và sự đoàn kết tập thể.§!"
 trait_quarrelsome:0 "Thích gây gổ"
 trait_quarrelsome_desc:0 "§LDù bản tính không phải là đa nghi, nhưng các cá thể của loài này thường hay nảy sinh xích mích với nhau.§!"
 trait_lithoid_gaseous_byproducts:0 "Phụ phẩm khí"
 trait_lithoid_gaseous_byproducts_desc:0 "§LTrong quá trình trao đổi chất, loài này sẽ thường xuyên thải ra các loại khí có giá trị công nghiệp.§!"
 TRAIT_LITHOID_GASEOUS_BYPRODUCTS_EFFECT:1 "Mỗi $pop_group_unit$ £pop£ §Hdân số§! làm việc dưới tư cách nô lệ hoặc có tiêu chuẩn làm việc cao hơn sẽ tạo ra 0.01 £exotic_gases£ §Y$exotic_gases$§! mỗi tháng."
 trait_lithoid_scintillating:0 "Lớp vỏ lấp lánh"
 trait_lithoid_scintillating_desc:0 "§LTrên cơ thể của loài này phủ đầy những tinh thể và đá quý lấp lánh, thỉnh thoảng sẽ tự bong ra.§!"
 TRAIT_LITHOID_SCINTILLATING_EFFECT:1 "Mỗi $pop_group_unit$ £pop£ §Hdân số§! làm việc dưới tư cách nô lệ hoặc có tiêu chuẩn làm việc cao hơn sẽ tạo ra 0.01 £rare_crystals£ §Y$rare_crystals$§! mỗi tháng."
 trait_lithoid_volatile_excretions:0 "Chất bài tiết dễ nổ"
 trait_lithoid_volatile_excretions_desc:0 "§LThứ chất thải nặng mùi bị cô đặc cao của loài này không hề ổn định, và nó chứa đựng mức năng lượng khó tin.§!"
 TRAIT_LITHOID_VOLATILE_EXCRETIONS_EFFECT:1 "Mỗi $pop_group_unit$ £pop£ §Hdân số§! làm việc dưới tư cách nô lệ hoặc có tiêu chuẩn làm việc cao hơn sẽ tạo ra 0.01 £volatile_motes£ §Y$volatile_motes$§! mỗi tháng."
 trait_docile:0 "Ngoan ngoãn"
 trait_docile_desc:0 "§LCác cá thể của loài này rất dễ để quản lý và tổ chức. Họ tỏ ra thân thiện và luôn sẵn lòng hợp tác.§!"
 trait_unruly:0 "Ngang ngược"
 trait_unruly_desc:0 "§LMột giống loài ngang ngược luôn gây khó khăn trong việc tổ chức và quản lý. Họ không thích bị ra lệnh, đồng thời luôn tranh cãi và chất vấn không ngừng.§!"
 trait_robot_streamlined_protocols:0 "Giao thức hợp lý"
 trait_robot_streamlined_protocols_desc:0 "§LKhả năng xử lý hàng loạt của hệ thống AI cho phép các đơn vị này tham gia những chiến dịch nhóm cực lớn mà chỉ suy giảm rất ít về mặt hiệu suất.§!"
 trait_robot_high_bandwidth:0 "Băng thông lớn"
 trait_robot_high_bandwidth_desc:0 "§LMỗi đơn vị đều gửi và nhận về vô số lượng dữ liệu bị trùng lặp, khiến độ trễ tăng theo cấp số nhân mỗi khi tăng thêm số đơn vị liên kết với các trung tâm xử lý.§!"
 trait_robot_trading_algorithms:0 "Thuật toán giao thương"
 trait_robot_trading_algorithms_desc:0 "§LCác thuật toán dự đoán có thể đem lại sự tối ưu cao nhất. Mọi biến động nhỏ nhặt nhất trên thị trường, từ tỷ lệ lưu thông, tình trạng tồn kho, cho đến cảm xúc của những khách hàng hữu cơ đều sẽ được tính đến.§!"
 trait_robot_quarrelsome: "$trait_quarrelsome$"
 trait_robot_quarrelsome_desc: "$trait_quarrelsome_desc$"
 trait_robot_deviants: "$trait_deviants$"
 trait_robot_deviants_desc: "$trait_deviants_desc$"
 trait_robot_decadent: "$trait_decadent$"
 trait_robot_decadent_desc: "$trait_decadent_desc$"
 trait_robot_wasteful: "$trait_wasteful$"
 trait_robot_wasteful_desc: "$trait_wasteful_desc$"

 trait_advanced_gaseous_byproducts:0 "$trait_lithoid_gaseous_byproducts$"
 trait_advanced_gaseous_byproducts_desc:0 "§LQuy trình trao đổi chất của loài này đã được điều chỉnh gen, khiến chúng thải ra các loại khí có giá trị trong công nghiệp.§!"
 trait_advanced_scintillating:0 "$trait_lithoid_scintillating$"
 trait_advanced_scintillating_desc:0 "§LNhờ kỹ thuật gen tiên tiến, cơ thể loài này bao phủ bởi những vảy tinh thể và đá quý rất dễ thu hoạch.§!"
 trait_advanced_volatile_excretions:0 "$trait_lithoid_volatile_excretions$"
 trait_advanced_volatile_excretions_desc:0 "§LViệc tinh chỉnh mã gen cho phép loài này tạo ra những hợp chất bài tiết đắt giá. Khi dùng đúng cách, chúng có thể giải phóng nguồn năng lượng khổng lồ.§!"
 trait_vat_grown:0 "Nuôi trong ống nghiệm"
 trait_vat_grown_desc:0 "§LĐược nuôi cấy nhân tạo trong các lồng ấp vô tính, khả năng sinh sản tự nhiên của loài này đã bị ảnh hưởng nặng nề.§!"
 trait_felsic:0 "Khoáng hóa felsic"
 trait_felsic_desc:0 "§LLoài này đã được chỉnh sửa gen để có khả năng tạo ra khoáng chất cực cao.§!\n"
 trait_natural_machinist:0 "Thợ máy bẩm sinh"
 trait_natural_machinist_desc:0 "§LLoài này được chỉnh sửa để cực kỳ thuần thục khi tiếp xúc với máy móc.§!"
 trait_drake_scaled:0 "Hóa vảy rồng"
 trait_drake_scaled_desc:0 "§LLoài này được cấy ghép vật liệu di truyền từ rồng không gian. Vảy rụng từ người họ có thể được gom lại để luyện thành hợp kim giá trị.§!"
 TRAIT_DRAKE_SCALED_EFFECT:0 "Mỗi $pop_group_unit$ £pop£ §Hdân số§! làm việc dưới tư cách nô lệ hoặc có tiêu chuẩn làm việc cao hơn sẽ tạo ra 0.5 £alloys£ §Y$alloys$§! mỗi tháng."
 trait_voidling:0 "Hóa hư không"
 trait_voidling_desc:0 "§LLoài này được cấy ghép vật liệu di truyền từ quái thai hư không. Họ có thể sống sót bằng cách hấp thụ tia vũ trụ, và chịu đựng được những môi trường vô cùng khắc nghiệt.§!"
 TRAIT_VOIDLING_EFFECT:1 "Thay thế phí bảo trì $food_with_icon$ (hoặc $minerals_with_icon$) bằng phí bảo trì $energy_with_icon$"
 trait_tiyanki:0 "Đa chi"
 trait_tiyanki_desc:0 "§LLoài này mang trong mình đoạn gen cấy ghép từ Tiyanki chúa. Chúng có thể sinh sản vô tính với tốc độ chóng mặt và mọc ra những chi phụ ngoài dự kiến.§!"
 TRAIT_TIYANKI_BUDDING_EFFECT: "Mỗi $pop_group_unit$ £pop£ §Ydân số§! làm việc dưới tư cách nô lệ hoặc có tiêu chuẩn làm việc cao hơn sẽ tạo ra $@tiyanki_budding_rate$£mod_logistic_growth_mult£§Y$MOD_BONUS_POP_GROWTH$§! mỗi tháng.\n\nHiệu ứng này có thể cộng dồn với các nguồn cung cấp $MOD_BONUS_POP_GROWTH$ khác, chẳng hạn như £building£§Y$building_clone_vats$§! hoặc £job_spawning_drone£§Y$job_spawning_drone_plural$§!."

 trait_humanoid_existential_iteroparity: "Sinh sôi bảo tồn"
 trait_humanoid_existential_iteroparity_desc: "§LLoài này sinh ra trong môi trường đầy rẫy hiểm nguy, và tồn tại được là nhờ vào việc sinh sản nhiều hơn đối thủ.§!"
 TRAIT_HUMANOID_EXISTENTIAL_ITEROPARITY_EFFECT: "£pop£ §YTăng trưởng dân số§! trong thời chiến hoặc khủng hoảng: §G+30%§!"
 trait_humanoid_psychological_infertility: "Vô sinh tâm lý"
 trait_humanoid_psychological_infertility_desc: "§LCác thành viên của loài này cực kỳ nhạy cảm với sự khắc nghiệt của các cuộc xung đột, áp lực sinh ra đã lấn át những ham muốn bản năng hơn.§!"
 TRAIT_HUMANOID_PSYCHOLOGICAL_INFERTILITY_EFFECT: "£pop£ §YTăng trưởng dân số§! trong thời chiến hoặc khủng hoảng: §R-30%§!"
 trait_humanoid_jinxed: "Vận rủi"
 trait_humanoid_jinxed_desc: "§LGiới lãnh đạo của loài này dường như mang theo lời nguyền từ khi lọt lòng, họ vụng về hơn, và dễ gặp tai nạn hay phạm sai lầm hơn.§!"
 TRAIT_HUMANOID_JINXED_EFFECT: "Giới hạn đặc điểm xấu của người lãnh đạo: §R+1§!"

 cannot_add_trait:0 "§RKhông thể thêm đặc điểm này.§!"
 cannot_remove_trait:0 "§RKhông thể bỏ đặc điểm này.§!"
 can_never_add_this_trait:0 "§RVĩnh viễn không thể thêm đặc điểm này.§!"
 can_never_remove_this_trait:0 "§RVĩnh viễn không thể bỏ đặc điểm này.§!"

