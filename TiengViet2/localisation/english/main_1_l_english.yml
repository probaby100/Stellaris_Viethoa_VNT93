 FE_AGGRESSIVENESS:0 "Độ hiếu chiến của máy"
 FE_AGGRESSIVENESS_TOOLTIP:0 "§HĐộ hiếu chiến của máy§!\nCài đặt này quyết định khả năng máy khai chiến với kẻ thù, cũng như tổng số cuộc chiến nổ ra trong quá trình mở rộng. Bất kể độ hiếu chiến thế nào, máy sẽ chỉ tuyên chiến nếu thái độ với mục tiêu phù hợp."
 FE_DIFFICULTY:1 "Độ khó"
 DIFFICULTY_ADJUSTED_AI_MODIFIERS:0 "Điều chỉnh ưu thế của máy theo độ khó"
 DIFFICULTY_ADJUSTED_AI_MODIFIERS_TOOLTIP:1 "§H$DIFFICULTY_ADJUSTED_AI_MODIFIERS$§!\nCác hệ số điều chỉnh sản lượng tài nguyên trên quy mô toàn đế chế của các đế chế AI sẽ được nhân với mức thưởng theo §Yđộ khó§!. Ví dụ: một công nghệ tăng +20% sản lượng £minerals£$minerals$ cho việc làm £job_miner£thợ mỏ, thì đối với đế chế AI ở mức ['concept_grand_admiral'], việc kích hoạt tùy chọn này sẽ nâng thành mức điều chỉnh +40%.\n\n§PCảnh báo:§! Điều này sẽ khiến nền kinh tế của AI vào giai đoạn cuối trận trở nên mạnh hơn đáng kể."
 DIFFICULTY_CIVILIAN_DESC:1 "Người chơi nhận được điểm cộng khổng lồ về kinh tế, nghiên cứu và sức chứa hải quân, đồng thời có lợi thế khi lần đầu tiếp xúc. Các đế chế máy hiếu chiến và dễ gây rối sẽ bị tắt."
 DIFFICULTY_CADET_DESC:1 "Người chơi nhận điểm cộng về kinh tế, nghiên cứu và sức chứa hải quân"
 DIFFICULTY_ENSIGN_DESC:1 "Máy không có lợi thế nào về kinh tế, nghiên cứu hay quân sự so với người chơi"
 DIFFICULTY_CAPTAIN_DESC:1 "Máy có một chút lợi thế về kinh tế, nghiên cứu và quân sự"
 DIFFICULTY_COMMODORE_DESC:1 "Máy có lợi thế vừa phải về kinh tế, nghiên cứu và quân sự"
 DIFFICULTY_ADMIRAL_DESC:1 "Máy có nhiều lợi thế về kinh tế, nghiên cứu và quân sự"
 DIFFICULTY_GRAND_ADMIRAL_DESC:1 "Máy có lợi thế khổng lồ về kinh tế, nghiên cứu và quân sự"
 FE_DIFFICULTY_TOOLTIP:7 "§HĐộ khó§!\nTùy chọn này điều chỉnh độ khó của game.\n\nCác mức độ khó:\n—§Y$DIFFICULTY_CIVILIAN$§!: $DIFFICULTY_CIVILIAN_DESC$\n—§Y$DIFFICULTY_CADET$§!: $DIFFICULTY_CADET_DESC$\n—§Y$DIFFICULTY_ENSIGN$§!: $DIFFICULTY_ENSIGN_DESC$\n—§Y$DIFFICULTY_CAPTAIN$§!: $DIFFICULTY_CAPTAIN_DESC$\n—§Y$DIFFICULTY_COMMODORE$§!: $DIFFICULTY_COMMODORE_DESC$\n—§Y$DIFFICULTY_ADMIRAL$§!: $DIFFICULTY_ADMIRAL_DESC$\n—§Y$DIFFICULTY_GRAND_ADMIRAL$§!: $DIFFICULTY_GRAND_ADMIRAL_DESC$"
 FE_IRONMAN:0 "Chế độ người sắt"
 FE_IRONMAN_TOOLTIP:1 "§HChế độ người sắt§!\nChế độ người sắt tắt bảng lệnh gian lận, game sẽ tự động lưu đè lên một file duy nhất. Bắt đầu với chế độ này nghĩa là không có đường lui."
 FE_EMPIRES_TOOLTIP:1 "§HSố lượng đế chế máy§!\nTùy chọn này quyết định số lượng đế chế máy được sinh ra trong thiên hà."
 FE_ADVANCED_EMPIRES_TOOLTIP:2 "§HSố đế chế cấp cao khởi đầu§!\nTùy chọn này định đoạt bao nhiêu đế chế máy có sẵn lợi thế về tài nguyên, công nghệ và dân số lúc đầu game. Ngoài việc khởi đầu tốt hơn, họ không có thêm ưu thế nào khác. Cài đặt này không ảnh hưởng đến ['concept_fallen_empires']."
 FE_IRONMAN_MULTIPLAYER:0 "§RChế độ người sắt không hỗ trợ chơi mạng.§!"
 FE_IRONMAN_NOCLOUD:0 "§RChế độ người sắt yêu cầu lưu trữ đám mây Steam và cần đăng nhập tài khoản Steam.§!"
 FE_IRONMAN_AUTOSAVE:0 "§RKhông thể đổi tần suất lưu game trong chế độ người sắt.§!"
 FE_GALAXY_SHAPE_TOOLTIP:1 "§HHình dáng thiên hà§!\nĐịnh dạng hình dáng bản đồ thiên hà.\n\nMột số hình dáng chỉ áp dụng cho §YKích cỡ thiên hà§! nhất định.\n\nCác hình dáng hiện có:\n$concept_galaxy_shape_desc$"
 FE_GALAXY_SIZE_TOOLTIP:1 "§HKích cỡ thiên hà§!\nQuản lý số lượng hệ sao, và ảnh hưởng đến số lượng §YĐế chế máy§! mặc định.\n\n§RCảnh báo:§! Tăng kích cỡ có thể làm giảm hiệu năng game vào giai đoạn cuối."
