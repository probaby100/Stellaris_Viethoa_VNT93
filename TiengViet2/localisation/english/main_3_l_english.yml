 POLICIES_LABEL:0 "Đây là các Chính sách hiện hành của Đế chế chúng ta"
 POLICIES_COLLAPSE_ALL: "§HThu gọn / Mở rộng phân mục§!\n§GNhấp để thu gọn hoặc mở rộng tất cả các phân mục chính sách§!"
 CLICK_TO_ADD_POLICY:0 "§GNhấp để áp dụng chính sách§!"
