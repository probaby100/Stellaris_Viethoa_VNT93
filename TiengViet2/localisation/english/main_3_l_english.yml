 ####################################
 # Ship Components
 ####################################

 weapon:0 "Vũ khí"
 utility:0 "Tiện ích"
 strike_craft:0 "Phi cơ Chiến đấu"
 ship_mounted:0 "Gắn trên Tàu"

 strike_crafts:1 "Phi cơ Chiến đấu"
 missiles:1 "Tên lửa"

 RED_LASER:0 "Laser Đỏ"
 RED_LASER_DESC:0 "Vũ khí laser bắn ra chùm tia hội tụ vào mục tiêu, gây sát thương cho kẻ địch bằng nhiệt lượng cực cao."
 BLUE_LASER:0 "Laser Xanh lam"
 BLUE_LASER_DESC:0 "Mạnh hơn laser đỏ, đối với sinh vật hữu cơ, bức xạ điện từ ở bước sóng này có màu xanh lam hoặc tím."
 UV_LASER:0 "Laser Tia cực tím"
 UV_LASER_DESC:0 "Laser tia cực tím là phiên bản nâng cấp mạnh mẽ hơn của laser xanh lam tiền nhiệm. Loại vũ khí này cực kỳ chính xác và mang sức tàn phá khủng khiếp."
 XRAY_LASER:0 "Laser Tia X"
 XRAY_LASER_DESC:0 "Loại laser này có bước sóng ngắn hơn tia cực tím, nhưng lại có tính hủy diệt cao hơn hẳn."
 GAMMA_LASER:0 "Laser Gamma"
 GAMMA_LASER_DESC:0 "Laser gamma phát ra bức xạ điện từ với tần số cực cao. Trong lĩnh vực vũ khí laser, sức công phá của nó là vô song."

 SPACEPORT_LASER:0 "Laser Trạm không gian"
 SPACEPORT_LASER_DESC:1 "Laser được trang bị trên trạm không gian, sở hữu khả năng theo dõi mục tiêu xuất sắc, bù đắp cho sự hạn chế về khả năng cơ động của bản thân trạm."

 ENERGY_LANCE_1:0 "Thương Hạt (Particle Lance)"
 ENERGY_LANCE_1_DESC:1 "Loại vũ khí năng lượng hạng nặng này bắn ra chùm hạt tập trung cao độ, có thể gây mức sát thương khổng lồ."
 ENERGY_LANCE_2:0 "Thương Tachyon (Tachyon Lance)"
 ENERGY_LANCE_2_DESC:1 "Bản nâng cấp của tia hạt, có thể bắn ra chùm tia Tachyon với sức mạnh khủng khiếp."
 ENERGY_LANCE_TURRET_1:0 "Tháp pháo $ENERGY_LANCE_1$"
 ENERGY_LANCE_TURRET_1_DESC:0 "$ENERGY_LANCE_1_DESC$"
 ENERGY_LANCE_TURRET_2:0 "Tháp pháo $ENERGY_LANCE_2$"
 ENERGY_LANCE_TURRET_2_DESC:0 "$ENERGY_LANCE_2_DESC$"

 PERDITION_BEAM_TITAN:0 "$PERDITION_BEAM$"
 PERDITION_BEAM_ION:1 "Pháo Ion"
 PERDITION_BEAM_DESC:0 "Mạng lưới ống khuếch đại năng lượng ion khổng lồ sẽ bắn ra một luồng tia mang mức năng lượng cao chưa từng thấy."


 PLASMA_1:0 "Súng Phun Plasma"
 PLASMA_1_DESC:1 "Vũ khí này bắn những quả cầu plasma mang sức tàn phá lớn vào mục tiêu. Những viên đạn plasma này cực kỳ hiệu quả trong việc ăn mòn giáp và thân tàu."
 PLASMA_2:0 "Máy Gia Tốc Plasma"
 PLASMA_2_DESC:0 "Loại pháo gia tốc mới này bắn ra khối plasma mang năng lượng cao với trường kiểm soát xịn hơn. Công nghệ này giúp giảm lượng năng lượng hao hụt trên đường bay tới mục tiêu."
 PLASMA_3:0 "Đại Bác Plasma"
 PLASMA_3_DESC:0 "Vũ khí plasma xịn nhất, khẩu đại pháo này là thành quả của việc đem phiên bản máy phóng plasma nâng cấp ra ứng dụng hoàn toàn vào quân sự. Đạn plasma của chúng mang tính sát thương khủng khiếp hơn hẳn."

 ARC_EMITTER_1:0 "Máy phóng hồ quang"
 ARC_EMITTER_1_DESC:0 "Bắn ra những luồng hồ quang mang năng lượng hỗn loạn vào mục tiêu, là một loại vũ khí mạnh mẽ không ngán cả giáp lẫn lá chắn."
 ARC_EMITTER_2:0 "Máy phóng hồ quang hội tụ"
 ARC_EMITTER_2_DESC:0 "Những máy phóng được nâng cấp này trang bị thấu kính hội tụ xịn hơn, giúp chúng bắn ra được những luồng năng lượng mạnh mẽ hơn nhiều."
 ARC_EMITTER_TURRET_1:0 "Tháp pháo $ARC_EMITTER_1$"
 ARC_EMITTER_TURRET_1_DESC:0 "$ARC_EMITTER_1_DESC$"
 ARC_EMITTER_TURRET_2:0 "Tháp pháo $ARC_EMITTER_2$"
 ARC_EMITTER_TURRET_2_DESC:0 "$ARC_EMITTER_2_DESC$"

 DISRUPTOR_1:0 "Pháo Phân Rã (Disruptor)"
 DISRUPTOR_1_DESC:1 "Pháo phân rã phóng ra chùm tia năng lượng cao, có khả năng làm suy yếu và phá vỡ các liên kết phân tử giữ cho các nguyên tử của mục tiêu dính lại với nhau."
 DISRUPTOR_2:0 "Pháo Phân Rã Ion"
 DISRUPTOR_2_DESC:0 "Phiên bản nâng cấp của pháo phân rã bắn ra các hạt ion hủy diệt hơn vào mục tiêu, đồng thời không bị giảm tốc độ bắn như thế hệ trước."
 DISRUPTOR_3:0 "Pháo Phân Rã Pha"
 DISRUPTOR_3_DESC:0 "Phiên bản cường hóa tột độ của pháo phân rã, có thể bắn ra năng lượng lượng tử, bất kỳ mục tiêu nào trúng đạn cũng sẽ chịu thiệt hại vô cùng lớn."
 disruptor_regen_debuff_1: "$DISRUPTOR_1$"
 disruptor_regen_debuff_2: "$DISRUPTOR_2$"
 disruptor_regen_debuff_3: "$DISRUPTOR_3$"

 ENERGY_TORPEDO_1:1 "Ống phóng Proton"
 ENERGY_TORPEDO_1_DESC:2 "$tech_energy_torpedoes_1_desc$"
 ENERGY_TORPEDO_2:1 "Máy Phóng Neutron"
 ENERGY_TORPEDO_2_DESC:2 "$tech_energy_torpedoes_2_desc$"

 MINING_DRONE_LASER_1:0 "Laser Khai khoáng"
 MINING_DRONE_LASER_1_DESC:1 "Tia laser khai khoáng tập trung cao độ, không chỉ cắt được các tiểu hành tinh mà còn xẻ đôi được cả vỏ tàu."

 BLUE_CRYSTAL_WEAPON_1:0 "Máy Bắn Mảnh vỡ Xanh lam"
 BLUE_CRYSTAL_WEAPON_1_DESC:1 "Máy bắn mảnh vỡ xanh lam mô phỏng quá trình bắn tinh thể đá sapphire được vũ khí hóa để gây sát thương."
 GREEN_CRYSTAL_WEAPON_1:0 "Máy Bắn Mảnh vỡ Xanh lục"
 GREEN_CRYSTAL_WEAPON_1_DESC:1 "Máy bắn mảnh vỡ xanh lục mô phỏng quá trình bắn tinh thể ngọc lục bảo được vũ khí hóa để gây sát thương ở mức trung bình."
 YELLOW_CRYSTAL_WEAPON_1:0 "Máy Bắn Mảnh vỡ Vàng"
 YELLOW_CRYSTAL_WEAPON_1_DESC:1 "Máy bắn mảnh vỡ vàng mô phỏng quá trình bắn tinh thể hoàng ngọc được vũ khí hóa để gây sát thương lớn."
 RED_CRYSTAL_WEAPON_1:0 "Máy Bắn Mảnh vỡ Đỏ"
 RED_CRYSTAL_WEAPON_1_DESC:1 "Máy bắn mảnh vỡ đỏ mô phỏng quá trình bắn tinh thể hồng ngọc được vũ khí hóa để gây ra sức tàn phá cực kỳ khủng khiếp."

 SPACE_CLOUD_WEAPON_1:0 "Sét Hư không"
 SPACE_CLOUD_WEAPON_1_DESC:1 "Bằng cách tận dụng hiểu biết của mình về các lực tương tác cơ bản, chúng ta có thể tạo ra một lượng điện tích khổng lồ bên trong các đám mây hư không đến mức tối đa. Hệ thống vũ khí sét hư không là một cỗ máy gây sát thương cực kỳ hứa hẹn."

 PSIONIC_BLAST_1:0 "Vụ nổ Tâm linh"
 PSIONIC_BLAST_1_DESC:0 ""

 EXTRADIMENSIONAL_1:0 "Máy Phân giải Vật chất"
 EXTRADIMENSIONAL_1_DESC:1 "Máy phân giải vật chất đến từ một chiều không gian khác, công nghệ cốt lõi của nó là bóp méo các định luật vật lý để phá hủy mọi thứ."
 EXTRADIMENSIONAL_STABILIZING_AURA:0 "Thiết bị Ổn định Chiều không gian"
 aura_stabilizing_aura:0 "$EXTRADIMENSIONAL_STABILIZING_AURA$"

 AI_CORE_DETECTOR:0 "Bộ Cảm biến Lõi AI"

 MISSILE_1:0 "Tên lửa Hạt nhân"
 MISSILE_1_DESC:0 "Tên lửa vũ trụ được trang bị đầu đạn hạt nhân có sức công phá cao. Mặc dù là công nghệ cũ từ thời tiền không gian, loại vũ khí dẫn đường thô sơ này lại có độ hiệu quả đáng kinh ngạc trong tầm bắn."
 MISSILE_2:0 "Tên lửa Nhiệt hạch"
 MISSILE_2_DESC:0 "Tên lửa không gian sâu phiên bản nâng cấp, trang bị đầu đạn nhiệt hạch uy lực hơn và khả năng bay cũng được cải thiện."
 MISSILE_3:0 "Tên lửa Phản vật chất"
 MISSILE_3_DESC:0 "Những tên lửa tiên tiến này được trang bị đầu đạn phản vật chất cực kỳ mạnh mẽ. Hệ thống định vị hoàn thiện hơn giúp tăng cường đáng kể khả năng khóa mục tiêu."
 MISSILE_4:0 "Tên lửa Lượng tử"
 MISSILE_4_DESC:0 "Loại tên lửa không gian sâu tối tân nhất, sau khi nâng cấp đã được trang bị đầu đạn cực kỳ khủng khiếp, có khả năng hút năng lượng điểm không từ chân không."
 MISSILE_5:0 "Tên lửa Đột kích"
 MISSILE_5_DESC:0 "Những tên lửa tối tân này được trang bị hệ thống định vị AI ở mức độ giới hạn, giúp tăng cường mạnh mẽ khả năng bám đuôi và hiệu suất của tên lửa."

 SPACEPORT_MISSILE:0 "Tên lửa Trạm không gian"
 SPACEPORT_MISSILE_DESC:1 "Khác với tàu chiến, thứ dư dả nhất trên trạm không gian chính là diện tích. Nhờ đó, các bệ phóng tên lửa của trạm có thể chứa một lượng lớn đạn dược và lắp đặt hệ thống nạp đạn tốc độ cao."

 SWARMER_MISSILE_1:0 "Tên lửa Bầy đàn"
 SWARMER_MISSILE_1_DESC:0 "Những tên lửa nhỏ này có thể phóng theo từng đàn, được thiết kế chuyên biệt để làm quá tải hệ thống phòng thủ điểm của kẻ thù."
 SWARMER_MISSILE_2:0 "Tên lửa Cuồng phong"
 SWARMER_MISSILE_2_DESC:0 "Công nghệ thu nhỏ mới sẽ cho phép chúng ta nhồi các đầu đạn mạnh mẽ hơn vào tên lửa bầy đàn, đồng thời cải thiện khả năng bay của chúng."

 SCOURGE_MISSILE_1:0 "Tên lửa Tai ương"
 SCOURGE_MISSILE_1_DESC:1 "Lõi của tên lửa tai ương là một hỗn hợp nhiều loại chất sinh hóa được bầy đàn Prethoryn sử dụng trong chiến tranh liên sao, đã được chứng minh là hiệu quả bất ngờ ngay cả với những tàu chiến cứng đầu nhất."
 SPACEPORT_SCOURGE_MISSILE:0 "Tên lửa Tai ương Trạm không gian"
 SPACEPORT_SCOURGE_MISSILE_DESC:1 "$SCOURGE_MISSILE_1_DESC$"
 MEDIUM_SCOURGE_PROJECTILE_WEAPON:0 "Vụ nổ Axit Tai ương"
 MEDIUM_SCOURGE_PROJECTILE_WEAPON_DESC:1 "Chất hữu cơ có tính ăn mòn cao bọc trong một lớp vỏ đạn đạo từng được bầy đàn dùng để oanh tạc quỹ đạo, nay đã được cải tiến thành vũ khí cho tàu chiến."
 SMALL_SCOURGE_PROJECTILE_WEAPON:2 "$MEDIUM_SCOURGE_PROJECTILE_WEAPON$ Nhỏ"
 SMALL_SCOURGE_PROJECTILE_WEAPON_DESC:2 "$MEDIUM_SCOURGE_PROJECTILE_WEAPON_DESC$"
 SWARM_STRIKE_CRAFT_1:0 "Phi cơ Bầy đàn"
 HIVE_STRIKE_CRAFT_1: "$SWARM_STRIKE_CRAFT_1$"
 SWARM_STRIKE_CRAFT_1_DESC:1 "Những bản sao thu nhỏ của bầy Prethoryn có thể được điều khiển qua hệ thống liên lạc của hạm đội, trở thành những chiếc phi cơ chiến đấu đầy hiệu quả của chúng ta."
 AMOEBA_STRIKE_CRAFT_1:1 "Trùng roi Trùng amip"
 AMOEBA_STRIKE_CRAFT_1_DESC:1 "Trùng amip sinh ra trùng roi, sau khi được hướng dẫn thông qua quá trình ghi nhớ, chúng có thể phản ứng với những thay đổi cực nhỏ trong từ trường của tàu, đóng vai trò như những chiếc máy bay tấn công vô cùng hiệu quả."

 DRONE_STRIKE_CRAFT:0 "Drone Chính xác"
 AI_STRIKE_CRAFT:0 "Drone Tầm thủ"

 TORPEDO_1:0 "Ngư lôi Không gian"
 TORPEDO_1_DESC:0 "Thực chất những quả ngư lôi này là các tên lửa khổng lồ bay chậm. Chúng được trang bị đầu đạn cực mạnh và bộ điều chế lá chắn, giúp chúng dễ dàng xuyên thủng các lớp màng năng lượng."
 TORPEDO_2:0 "Ngư lôi Bọc giáp"
 TORPEDO_2_DESC:0 "Phiên bản nâng cấp của ngư lôi không gian được bọc thêm một lớp giáp, giúp chống chọi tốt hơn với hệ thống phòng thủ điểm của địch. Khi phát nổ, những mảnh giáp vỡ vụn cũng sẽ gây thêm sát thương."
 TORPEDO_3:0 "Ngư lôi Kẻ hủy diệt"
 TORPEDO_3_DESC:0 "Ngư lôi tiên tiến được trang bị đầu đạn siêu mạnh. Sở hữu thiết kế trơn tru hơn, động cơ nhanh hơn cùng bộ điều chế lá chắn cải tiến, có thể nhẹ nhàng xuyên qua lớp màng năng lượng."

 MASS_DRIVER_1:0 "Máy Phóng Khối Lượng"
 MASS_DRIVER_1_DESC:0 "Loại súng phóng điện từ này sử dụng nam châm để gia tốc đạn xuyên giáp xoay vòng đạt đến tốc độ cực cao."
 MASS_DRIVER_2:0 "Súng Cuộn Cảm (Coilgun)"
 MASS_DRIVER_2_DESC:0 "Súng từ trường là phiên bản nâng cấp của súng đẩy vật chất đời đầu, sử dụng cuộn dây điện từ để tăng tốc đạn hiệu quả hơn."
 MASS_DRIVER_3:0 "Pháo Ray Điện Từ (Railgun)"
 MASS_DRIVER_3_DESC:0 "Sử dụng đường ray đôi song song để bắn ra các viên đạn với tốc độ kinh hồn."
 MASS_DRIVER_4:0 "Pháo Ray Tiên Tiến"
 MASS_DRIVER_4_DESC:0 "Mẫu súng đường ray đời mới, có thanh ray chắc chắn và nguồn cung năng lượng dồi dào hơn. Uy lực mạnh hơn và độ chính xác cũng cao hơn so với mẫu cũ."
 MASS_DRIVER_5:0 "Đại Bác Gauss"
 MASS_DRIVER_5_DESC:0 "Sau khi nâng cấp thiết kế cuộn dây điện từ kiểu cũ, phiên bản mới này có sức tàn phá thậm chí còn vượt xa khẩu súng đường ray tối tân nhất. Nó có thể bắn chính xác và nhanh hơn rất nhiều."

 SPACEPORT_MASS_DRIVER:0 "Súng Đẩy Vật chất Trạm không gian"
 SPACEPORT_MASS_DRIVER_DESC:1 "Súng đẩy vật chất được lắp trên trạm không gian, dù thiết kế đã cũ nhưng sức công phá không hề kém cạnh phiên bản trên tàu chiến."

 KINETIC_ARTILLERY_1:0 "Pháo Động năng"
 KINETIC_ARTILLERY_1_DESC:0 "Khẩu pháo có tầm bắn cực xa, hỏa lực dữ dội và độ chính xác cực cao."
 KINETIC_ARTILLERY_2:0 "Pháo Động năng Tiên tiến"
 KINETIC_ARTILLERY_2_DESC:0 "Hệ thống hỏa lực tầm xa trên tàu chiến mạnh mẽ hơn, được trang bị bệ phóng và hệ thống kiểm soát hỏa lực nâng cấp."

 MASS_ACCELERATOR_1:0 "Pháo Gia Tốc Lớn"
 MASS_ACCELERATOR_1_DESC:0 "Một khẩu pháo gia tốc vật chất khổng lồ, chỉ có thể được gắn trên các bệ vũ khí đồng trục."
 MASS_ACCELERATOR_2:0 "Đại Pháo Gia Tốc Giga (Giga Cannon)"
 MASS_ACCELERATOR_2_DESC:0 "Phiên bản uy lực hơn của pháo động năng cố định phần đế."
 MASS_ACCELERATOR_TURRET_1:0 "Tháp pháo $MASS_ACCELERATOR_1$"
 MASS_ACCELERATOR_TURRET_1_DESC:0 "Một khẩu pháo gia tốc vật chất vô cùng to lớn, được gắn trên một tháp pháo khổng lồ đã được gia cố."
 MASS_ACCELERATOR_TURRET_2:0 "Tháp pháo $MASS_ACCELERATOR_2$"
 MASS_ACCELERATOR_TURRET_2_DESC:0 "Phiên bản uy lực hơn của pháo động năng dạng tháp pháo."

 AUTOCANNON_1:0 "Pháo Tự động"
 AUTOCANNON_1_DESC:0 "Vũ khí đạn đạo cỡ nòng lớn, bắn ra các vỏ đạn rỗng. Ưu điểm chính của loại pháo này nằm ở tốc độ xả đạn cực nhanh."
 AUTOCANNON_2:0 "Pháo Tự động Kẻ xé xác"
 AUTOCANNON_2_DESC:0 "Những khẩu pháo tự động nâng cấp này sở hữu hệ thống theo dõi và kiểm soát khai hỏa hoàn thiện hơn, nhờ đó tốc độ bắn cũng được gia tăng."
 AUTOCANNON_3:0 "Pháo Tự động Bão lửa"
 AUTOCANNON_3_DESC:1 "Pháo tự động có thiết kế tối tân, có thể trút một cơn mưa đạn pháo nổ mạnh về phía mục tiêu."

 FLAK_BATTERY_1:2 "$tech_flak_batteries_1$"
