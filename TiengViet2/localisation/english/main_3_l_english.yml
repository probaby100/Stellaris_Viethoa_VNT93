 zone_urban: "Mở rộng đô thị"
 zone_urban_desc: "Khu vực đầy những tòa tháp chọc trời và sương mù, không một phút giây ngơi nghỉ, đường chân trời ở đây vừa là mái nhà vừa là mê cung vô tận."
 zone_urban_triggered_desc: ""
 zone_foundry: "Công nghiệp nặng"
 zone_foundry_plural: "$zone_foundry$"
 zone_foundry_desc: "Những lò nung kim loại bắn ra muôn vàn tia lửa, rèn đúc thi hài của các vì sao thành lưỡi gươm sắc bén của ngày mai."
 zone_foundry_triggered_desc: "Mỗi $district_city$ cung cấp $job_foundry_plural_with_icon$: §G+100§!"
 zone_industrial: "Công nghiệp hỗn hợp"
 zone_industrial_plural: "$zone_industrial$"
 zone_industrial_desc: "Động cơ gầm rú, lò nung rực rỡ, trong khu vực này, hàng xa xỉ phẩm và cỗ máy chiến tranh được trưng bày song song trên cùng một gian hàng."
 zone_industrial_triggered_desc: ""
 zone_factory: "Công nghiệp dân dụng"
 zone_factory_plural: "$zone_factory$"
 zone_factory_desc: "Dây chuyền lắp ráp ở đây hoạt động không ngừng nghỉ, từ những công cụ đơn giản đến các tuyệt tác thiết kế hiện đại đều được sản xuất liên tục từ đây."
 zone_factory_triggered_desc: ""
 zone_research: "Khu phức hợp nghiên cứu"
 zone_research_desc: "Bên trong những tòa nhà chọc trời bằng kính và các phòng thí nghiệm lượng tử này, sự tò mò là sức mạnh, tri thức là chủ quyền."
 zone_research_triggered_desc: ""
 zone_unity: "Trung tâm hành chính"
 zone_unity_desc: "Hành tinh tĩnh lặng và hiệu quả này chính là trái tim đập rộn ràng của các cơ quan hành chính dân sự."
 zone_unity_triggered_desc: ""
 zone_unity_spiritualist: "Khu phức hợp tâm linh"
 zone_unity_spiritualist_desc: "Các ngôi đền, đài phát thanh và tòa thị chính đều dâng trào hệ tư tưởng, gắn kết hàng vạn con người thành một khối đồng lòng."
 zone_unity_spiritualist_triggered_desc: ""
 zone_unity_bio_trophy: "Khu định cư tị nạn"
 zone_unity_bio_trophy_desc: "Những công trình cao chót vót này có hệ thống khí hậu nhân tạo do AI kiểm soát, có thể mô phỏng bất kỳ môi trường nào mà sinh vật hữu cơ có trí tuệ cần. Nhu cầu nhà ở của sinh vật hữu cơ tại đây được đáp ứng một cách hoàn hảo."
 zone_trade: "Trung tâm thương mại"
 zone_trade_desc: "Bên dưới lớp vỏ bọc phồn vinh hào nhoáng là một thị trường được thúc đẩy bởi sự tham vọng, những cuộc đàm phán và những rủi ro không hề nhỏ."
 zone_trade_triggered_desc: ""
 zone_fortress: "Công sự phòng thủ hành tinh"
 zone_fortress_desc: "Một pháo đài với kỷ luật thép và sức răn đe mạnh mẽ, những người lính ở đây giống như sắt thép, bất khuất và sắc bén."
 zone_fortress_triggered_desc: ""
 zone_minerals: "Khai thác khoáng sản"
 zone_minerals_desc: "Bên dưới lớp gia cố làm từ đá và thép, những mũi khoan đang gặm nhấm tầng đá mẹ cổ xưa, liên tục bơm ra dòng máu của nền công nghiệp."
 zone_minerals_triggered_desc: ""
 zone_energy: "Phát điện"
 zone_energy_desc: "Mạng lưới năng lượng mặt trời và máy biến đổi plasma lấp lánh trên mặt đất, tận dụng sức mạnh từ các vì sao và những cơn bão để tiếp thêm năng lượng cho hành trình vươn lên của chúng ta."
 zone_energy_triggered_desc: ""
 zone_food: "Khu vực Nông nghiệp"
 zone_food_desc: "Những cánh đồng cây trồng sinh học trải dài dưới bầu trời nhân tạo, nuôi sống cả một đế chế đang ngày càng lớn mạnh."
 zone_food_triggered_desc: ""
 zone_anglers: "Nuôi trồng Thủy sản"
 zone_anglers_desc: "Những tấm lưới đánh cá lấp lánh ánh sáng sinh học báo hiệu một mùa màng bội thu, trong khi những con thú săn mồi lặng lẽ rình rập bên dưới."
 zone_anglers_triggered_desc: "£job_farmer£$job_farmer_plural$ chuyển thành £job_angler£$job_angler_plural$\n£job_artisan£$job_artisan_plural$ chuyển thành £job_pearl_diver£$job_pearl_diver_plural$"
 zone_agrarian_anglers: "Làng Ven biển"
 zone_agrarian_anglers_desc: "Những cộng đồng này đã quá quen thuộc với nghề chài lưới, họ gắn kết chặt chẽ và giữ gìn truyền thống lâu đời."
 zone_betharian: "Xử lý Betharian"
 zone_betharian_desc: "Trung tâm của đặc khu này là lõi Betharian đang đập liên hồi, nó đã bị khuất phục và khai thác, dù người ta vẫn chưa thực sự hiểu rõ về nó."
 unlocks_zone_betharian: "$t$Mở khóa Chuyên môn Khu vực: §Y$zone_betharian$§!"
 zone_subterranean_urban: "Khu Đô thị Ngầm"
 zone_subterranean_urban_desc: "Nằm sâu dưới lòng đất, cả một thành phố hít thở bầu không khí nhân tạo, vang vọng nhịp điệu của những cỗ máy khoan - bản hòa ca giữa sự phát triển và việc khai quật."
 zone_rare_crystals: "Khai thác Pha lê Hiếm"
 zone_rare_crystals_desc: "Các thiết bị chuyên dụng giúp tăng mạnh sản lượng pha lê hiếm, đồng thời chỉ thải ra một lượng rác thải vừa phải."
