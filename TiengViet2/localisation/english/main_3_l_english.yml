 district_nexus_exotic_gases: "Trung tâm Nông nghiệp"
 district_nexus_exotic_gases_plural: "Trung tâm Nông nghiệp"
 district_nexus_exotic_gases_desc: "Hệ sinh thái nhân tạo được thiết kế và kiểm soát để đảm bảo sản lượng của mọi tài nguyên sinh học luôn đạt mức tối ưu."

 district_hive_industrial: "Cụm Công nghiệp"
 district_hive_industrial_plural: "Cụm Công nghiệp"
 district_hive_industrial_desc: "Kết hợp hài hòa sản lượng của các lò luyện, nhà máy, cơ sở sản xuất và xưởng thợ, cụm này có thể tạo ra mọi thứ và đáp ứng mọi nhu cầu."
 district_hive_foundry: "Cụm Đúc"
 district_hive_foundry_plural: "Cụm Đúc"
 district_hive_foundry_desc: "Những cụm này là trái tim của đủ loại dự án công nghiệp, khắp nơi đều vang vọng tiếng gầm rú của lò luyện và tiếng đập kim loại từ các xưởng đúc."
 district_hive_factory: "Cụm Công nghiệp"
 district_hive_factory_plural: "Cụm Công nghiệp"
 district_hive_factory_desc: "Số lượng khổng lồ các xưởng thợ và nhà máy dân dụng có thể sản xuất bất kỳ loại hàng tiêu dùng cá nhân nào."
 district_hive_research: "Cụm Nghiên cứu"
 district_hive_research_plural: "Cụm Nghiên cứu"
 district_hive_research_desc: "Những cụm này điều phối ý thức của các ong thợ não bộ, mỗi luồng suy nghĩ đều dẫn đến một khám phá mới."
 district_hive_research_physics: "Cụm Vật lý"
 district_hive_research_physics_plural: "Cụm Vật lý"
 district_hive_research_physics_desc: "Các máy gia tốc hạt, máy tính lượng tử và máy điều khiển trường này có vẻ như đi ngược lại các định luật vật lý, nhưng đó chỉ là vì những giả thuyết của chúng ta đã lỗi thời."
 district_hive_research_society: "Cụm Sinh học"
 district_hive_research_society_plural: "Cụm Sinh học"
 district_hive_research_society_desc: "Nghiên cứu di truyền, mô phỏng thần kinh, phân tích tâm lý và ngoại suy lịch sử động lực học - tất cả đều góp phần giúp chúng ta hiểu rõ hơn về toàn bộ vũ trụ."
 district_hive_research_engineering: "Cụm Kỹ thuật"
 district_hive_research_engineering_plural: "Cụm Kỹ thuật"
 district_hive_research_engineering_desc: "Một tổ chức dành riêng cho các thí nghiệm vật liệu phức tạp, tổng hợp hóa học lượng tử và cấu trúc nano, những thứ từng chỉ nằm trong trí tưởng tượng nay đã trở thành sự thật."
 district_hive_administrative: "Cụm Khớp thần kinh"
 district_hive_administrative_plural: "Cụm Khớp thần kinh"
 district_hive_administrative_desc: "Ý chí của bầy đàn được khuếch đại và truyền tải qua những cụm khổng lồ này, và được vô số cá thể con cẩn thận duy trì."
 district_hive_fortress: "Cụm Pháo đài"
 district_hive_fortress_plural: "Cụm Pháo đài"
 district_hive_fortress_desc: "Những cụm này bao gồm các kênh chỉ huy, boongke hành tinh và cơ sở huấn luyện - tất cả đều là biểu hiện của bản năng tấn công."
 district_hive_trade: "Cụm Logistics"
 district_hive_trade_plural: "Cụm Logistics"
 district_hive_trade_desc: "Thông qua các kích thích phù hợp, nhu cầu logistics của toàn bộ bầy đàn có thể chuyển từ phản ứng bị động sang dự đoán chủ động."
 district_hive_food: "Cụm Nông nghiệp"
 district_hive_food_plural: "Cụm Nông nghiệp"
 district_hive_food_desc: "Động thực vật thuần hóa được nuôi trồng và giết mổ trong cấu trúc này, cung cấp lượng thức ăn dồi dào cho các ong thợ của bầy đàn."
