 # Needs words but doing implementation first
 agriculture_0_desc: "Cày sâu cuốc bẫm, y như buổi bình minh đầu tiên của chính nền văn minh."
 agriculture_1_desc: "Những cỗ máy gặt đập liên hợp tự động băng qua những cánh đồng bất tận."
 agriculture_2_desc: "Chiến lược nông nghiệp của chúng ta được hỗ trợ bởi vô số các mô phỏng tỉ mỉ."
 agriculture_3_desc: "Mỗi hạt giống là một kỳ tích di truyền được thiết kế cẩn thận."
 agriculture_4_desc: "Các cỗ máy nano khiêu vũ trên từng nhành cây ngọn cỏ, không ngừng tối ưu hóa sản lượng và dinh dưỡng đến giới hạn."
 agriculture_anglers_0_desc: "Tuy phương pháp đánh bắt này rất nguyên thủy, nhưng hiệu quả lại không hề thấp."
 agriculture_anglers_1_desc: "Những tàu cá lưới kéo khổng lồ càn quét biển sâu, vắt kiệt đại dương một cách đầy hiệu quả."
 agriculture_anglers_2_desc: "Từng đàn cá biến đổi sinh học tung tăng bơi lội trong các rặng san hô được kiểm soát."
 agriculture_anglers_3_desc: "Các loài được thiết kế để ngoan ngoãn, dễ nuôi và lớn nhanh đang bơi theo những đội hình có trật tự cao."
 agriculture_anglers_4_desc: "Đàn cá tồn tại ở trạng thái xác suất trước khi bị đánh bắt, và ngay khi bị bắt, chúng lập tức được xử lý xong xuôi."
 agriculture_exotic_gases_1_desc: "Các tháp chưng cất sừng sững thu thập phụ phẩm của hệ sinh thái bản địa, rồi chiết xuất ra khí tự nhiên ngoại lai hữu ích từ hỗn hợp đó."
 agriculture_exotic_gases_2_desc: "Công nghệ thu thập khí theo mùa đã trải qua vô số lần mô phỏng, không ngừng được tối ưu và cường hóa."
 agriculture_exotic_gases_3_desc: "Tăng cường di truyền cho hệ thực vật bản địa để đẩy mạnh đáng kể nồng độ khí tự nhiên ngoại lai."
 agriculture_exotic_gases_4_desc: "Máy móc nano kết hợp cùng vi sinh vật để tối ưu hóa tốc độ sinh trưởng và lượng khí xả ra."

 mining_0_desc: "Cuốc chim và xe goòng là nền tảng khai khoáng của nền văn minh."
 mining_1_desc: "Máy xúc và giàn khoan đang nuốt chửng những ngọn núi."
 mining_2_desc: "Hơi nước siêu nhiệt và áp suất cực cao có thể mở đường thông qua sự tàn phá có kiểm soát."
 mining_3_desc: "Những hầm lò sâu thẳm đâm thẳng xuống lõi hành tinh."
 mining_4_desc: "Khai thác khoáng sản từ lớp đá gốc dưới dạng các nguyên tử."
 mining_betharian_1_desc: "Ánh sáng dị thường của Betharian ẩn chứa một nguồn năng lượng kỳ diệu."
 mining_betharian_2_desc: "Đường ống tỏa ra hơi ấm nhân tạo, hút cạn năng lượng từ sâu bên dưới."
 mining_betharian_3_desc: "Nơi áp suất và Betharian giao nhau, năng lượng sẽ bùng nổ."
 mining_betharian_4_desc: "Từng mảnh Betharian được chiết xuất cực kỳ chuẩn xác, loại bỏ hoàn toàn các sự cố mất ổn định."
 mining_rare_crystals_1_desc: "Các khu mỏ này được bao phủ bởi những viên pha lê hiếm, trông như những hốc tinh hốc thạch khổng lồ."
 mining_rare_crystals_2_desc: "Dưới áp suất cực đại, cấu trúc địa chất xung quanh vỡ vụn, chỉ để lại những viên pha lê cứng cáp nhất tiếp tục sinh trưởng."
 mining_rare_crystals_3_desc: "Những tinh thể pha lê khổng lồ phát triển ngay tại ranh giới giữa lớp vỏ và lớp phủ của hành tinh."
 mining_rare_crystals_4_desc: "Đường hầm lượng tử và mỏ ảo cho phép khai thác tài nguyên mà không cần phải thực sự đào hầm mỏ."

 generator_0_desc: "Tuabin xoay tít, cuộn dây xèo xèo." # bubble bubble toil and trouble
 generator_1_desc: "Các bộ lưu trữ thế năng khổng lồ kêu vo vo, tính chất dễ nổ được kìm kẹp nghiêm ngặt."
 generator_2_desc: "Thông qua các thuật toán và chủ đích, năng lượng được thuần hóa thành những dòng điện ổn định."
 generator_3_desc: "Trung tâm kết nối lượng tử tạo ra năng lượng, xóa nhòa mọi ranh giới về khoảng cách và chiều không gian."
 generator_4_desc: "Những cấu trúc này bẻ cong thực tại xung quanh, bòn rút năng lượng từ chính cấu trúc không gian."
 generator_volatile_motes_1_desc: "Các chùm tia năng lượng cao dẫn đường cho hạt dễ bay hơi đang bị mắc kẹt, giúp thu thập dễ dàng hơn."
 generator_volatile_motes_2_desc: "Các trường năng lượng biến điệu này có thể bẫy những hạt dễ bay hơi, triệt tiêu sự cộng hưởng tự nhiên của chúng."
 generator_volatile_motes_3_desc: "Sự vướng mắc lượng tử giữa các hạt dễ bay hơi với vật chất ổn định khiến việc thu thập hạt an toàn đến mức ngay cả [owner.GetSpeciesSpawnName] cũng vận hành được. Tất nhiên đó chỉ là lý thuyết."
 generator_volatile_motes_4_desc: "Thao túng các hạt exciton trong trường năng lượng điểm không, ép các hạt bị mắc kẹt vào trạng thái ngưng tụ ổn định."

 zone_food_biology: "Hỗ trợ nghiên cứu sinh học"
 zone_food_biology_desc: "Nhờ thu gom vật liệu hữu cơ từ các khu vực lân cận, tốc độ và chất lượng thí nghiệm của chúng ta được nâng cao đáng kể."

 zone_energy_physics: "Hỗ trợ nghiên cứu năng lượng"
 zone_energy_physics_desc: "Có lò phản ứng mạnh mẽ bơm thẳng năng lượng vào các cơ sở nghiên cứu, các nhà vật lý của chúng ta có thể thắp lên ánh sáng giữa đêm đen của sự ngu dốt."

 zone_minerals_engineering: "Hỗ trợ nghiên cứu khoáng sản"
 zone_minerals_engineering_desc: "Nguồn cung khoáng sản ổn định, dù là đồ ngoại lai hay hàng phổ thông, đều giúp các kỹ sư của chúng ta tiến hành thí nghiệm với tốc độ mà kẻ khác nằm mơ cũng không dám nghĩ tới."

 zone_minerals_physics: "Mạch khoáng hạt graviton"
 zone_minerals_physics_desc: "Khai thác sâu trong dãy núi lơ lửng để thu được ma trận chứa hạt graviton."
