 war_goal_wg_plunder:0 "Cướp bóc"
 war_goal_wg_plunder_desc:1 "Phát động chiến tranh để tập kích và cướp bóc kẻ thù. Mục tiêu chiến tranh này có thể tước đoạt $r_energy$ và $r_minerals$ của mục tiêu. Đồng thời nó cũng làm tăng khả năng chúng ta chiếm được $relics$."
 war_goal_wg_colossus:0 "Chiến tranh tổng lực"
 war_goal_wg_colossus_desc:2 "Vũ khí sức mạnh vô song, có thể khiến nước địch khuất phục trước ý chí của chúng ta."
