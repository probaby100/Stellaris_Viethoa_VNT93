 POINT_DEFENCE_1:0 "Phòng Thủ Điểm Cảnh Vệ"
 POINT_DEFENCE_1_DESC:1 "Đối với những chiến hạm to lớn và nặng nề, việc trang bị hệ thống phòng thủ đánh chặn tên lửa và phi cơ tập kích lên thân tàu là điều tối quan trọng."
 POINT_DEFENCE_2:0 "Phòng Thủ Điểm Rào Chắn"
 POINT_DEFENCE_2_DESC:1 "Thuật toán dự đoán quỹ đạo đạn đạo được nâng cấp giúp tăng cường đáng kể hiệu quả bám bắt mục tiêu và phòng thủ điểm."
 POINT_DEFENCE_3:0 "Phòng Thủ Điểm Giám Hộ"
 POINT_DEFENCE_3_DESC:1 "Hệ thống đạn dược đa dạng giúp nâng cao rõ rệt năng lực đánh chặn mọi hiểm họa áp sát."

 DEFAULT_BEHAVIOR_DESC:1 "§HChiến thuật cân bằng:§! Chiến hạm này sẽ duy trì thế trận cân bằng linh hoạt giữa tiến công và phòng thủ."
 SWARM_BEHAVIOR_DESC:2 "§HChiến thuật bầy đàn:§! Tàu sẽ lao thẳng về phía kẻ thù, dồn hỏa lực gây sát thương tối đa trong tầm bắn của loại vũ khí có cự ly ngắn nhất."
 ARTILLERY_BEHAVIOR_DESC:2 "§HChiến thuật pháo kích:§! Tàu sẽ giữ khoảng cách ở cự ly tầm trung-xa, liên tục dùng các loại vũ khí tầm xa để oanh tạc mục tiêu."
 CARRIER_BEHAVIOR_DESC:1 "§HChiến thuật tàu sân bay:§! Tàu sẽ duy trì khoảng cách tại rìa bán kính giao chiến xa nhất của khoang chứa phi cơ."
 LINE_BEHAVIOR_DESC:2 "§HChiến thuật chiến tuyến:§! Tàu sẽ tiến lên cự ly tầm trung và giữ vững đội hình tác chiến."
 PALADIN_LINE_BEHAVIOR_DESC: "$LINE_BEHAVIOR_DESC$ Chiến hạm này có thể điều khiển được trong trận chiến."
 PICKET_BEHAVIOR_DESC:2 "§HChiến thuật cảnh giới:§! Tàu sẽ tiến lên cự ly tầm trung và chủ động đánh chặn các chiến hạm địch đang tìm cách áp sát."
 PLATFORM_BEHAVIOR_DESC:2 "§HChiến thuật công sự:§! Nền tảng phòng thủ sẽ neo cố định tại chỗ và khai hỏa vào bất kỳ mục tiêu nào lọt vào tầm bắn."
 COLOSSUS_BEHAVIOR_DESC:0 "§HChiến thuật phớt lờ:§! Chiến hạm này sẽ bỏ qua mọi kẻ địch tấn công xung quanh để dồn toàn lực hoàn thành nhiệm vụ được giao."
 TORPEDO_BEHAVIOR_DESC:0 "§HChiến thuật ngư lôi:§! Tàu sẽ lao thẳng vào đội hình địch, thực hiện các đòn càn quét tầm gần để tiêu diệt các mục tiêu cỡ lớn. Tàu có khả năng oanh tạc bề mặt cực kỳ hiệu quả."
 ARKSHIP_BEHAVIOR_DESC: "§HChiến thuật tàu phương chu:§!$TABBED_NEW_LINE$— Hạm đội sẽ duy trì khoảng cách tại bán kính giao chiến tối đa của vũ khí.$TABBED_NEW_LINE$— Chiến hạm này có thể điều khiển thủ công trong trận chiến.$TABBED_NEW_LINE$— Hành vi khi gặp bất lợi (Tư thế hạm đội):$TABBED_NEW_LINE$$t$— §H$FLEET_STANCE_EVASIVE$:§! Tháo chạy khỏi các mục tiêu thù địch$TABBED_NEW_LINE$$t$— §H$FLEET_STANCE_PASSIVE$:§! Tháo chạy khỏi mục tiêu thù địch khi §H$SHIP_STAT_HITPOINTS$§! giảm xuống dưới §Y75%§!$TABBED_NEW_LINE$$t$— §H$FLEET_STANCE_AGGRESSIVE$:§! Tháo chạy khỏi mục tiêu thù địch khi §H$SHIP_STAT_HITPOINTS$§! giảm xuống dưới §Y75%§!.\n\n"
