 district_farming_society: "$district_farming$"
 district_farming_society_plural: "$district_farming_plural$"
 district_farming_society_desc: "$district_farming_desc$"
 zone_resort: "Khu Phức hợp Nghỉ dưỡng"
 zone_resort_desc: "Được xây dựng vì sự thoải mái và hoàn thiện để mang lại sự yên bình. Trên hành tinh này, tĩnh lặng không phải là thứ xa xỉ, mà là một lẽ vĩnh hằng."
 zone_resort_entertainment: "Nhà hát Giải trí Lớn"
 zone_resort_entertainment_desc: "Dưới những mái vòm cao vút và ánh đèn rực rỡ, mọi dục vọng đều tìm thấy sân khấu cho riêng mình. Nơi đây, niềm vui là vô tận, những màn trình diễn luôn rực rỡ và không bao giờ kết thúc."
 zone_resort_zoo:1 "Vườn thú Ngoại lai"
 zone_resort_zoo_desc: "Trong các khu bảo tồn và chuồng nuôi được thiết kế tỉ mỉ, sinh vật từ những thế giới xa xôi đang phát triển mạnh mẽ, mang lại niềm vui giải trí cho công dân của chúng ta."
 zone_resort_hunting_ground: "Công viên Săn bắn"
 zone_resort_hunting_ground_desc: "Khu bảo tồn khổng lồ này bao phủ phần lớn hành tinh, mang đến cho du khách những cuộc đi săn được dàn dựng công phu để chạm trán với những loài dã thú oai vệ và nguy hiểm nhất dải ngân hà."
 zone_resort_spiritual_retreat: "Thánh địa Tĩnh lặng"
 zone_resort_spiritual_retreat_desc: "Khu tĩnh tu hẻo lánh này nằm xa khỏi chốn đô thị ồn ào, mang lại sự yên tĩnh, không gian để suy ngẫm và sự kết nối với những điều vĩnh hằng."
 zone_resort_grand_museum: "Điện thờ Ký ức"
 zone_resort_grand_museum_desc: "Một không gian dành riêng để bảo tồn và tôn vinh văn hóa, lịch sử cùng những tư tưởng. Nơi đây, ghi nhớ quá khứ chính là cách phục vụ cho tương lai."
 zone_resort_restoration_enclave: "Khu vực Phục hồi"
 zone_resort_restoration_enclave_desc: "Một chốn yên bình dành riêng cho việc chữa lành, nơi các công nghệ y tế tiên tiến hòa quyện cùng môi trường thanh tịnh."
 zone_resort_proving_grounds: "Bãi Thử nghiệm"
 zone_resort_proving_grounds_desc: "Một đấu trường hoành tráng, nơi phô diễn kỹ năng và phong độ. Khách tham quan có thể tự mình thử sức hoặc thoải mái chiêm ngưỡng những màn đối đầu kịch tính của người khác."

