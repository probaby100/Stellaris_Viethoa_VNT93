 edict_encourage_free_thought_desc:1 "Đạo luật này khuyến khích người dân công khai thảo luận các chủ đề chính trị, cho dù điều đó có thể khiến họ lạc lối."
 edict_map_the_stars:0 "Vẽ bản đồ sao"
 edict_map_the_stars_desc:0 "Sắc lệnh này khuyến khích những cuộc phiêu lưu giữa các vì sao, mang ánh sáng đến những nơi tăm tối và tìm kiếm những kỳ quan ẩn giấu trong không gian sâu thẳm."
 edict_map_the_stars_2:0 "$edict_map_the_stars$"
 edict_map_the_stars_2_desc:0 "$edict_map_the_stars_desc$"
 edict_research_focus:0 "Trợ cấp nghiên cứu"
 edict_research_focus_desc:0 "Sắc lệnh này cung cấp thêm khoản trợ cấp cho các nhà nghiên cứu của chúng ta."
 edict_research_focus_hive:0 "Hy sinh toàn bộ các kiến thức khác, để cho những cá thể tư duy của chúng ta tập trung suy nghĩ về các khái niệm mới."
 edict_research_focus_machine:0 "Tập trung năng lực xử lý của chúng ta vào các mô hình lý thuyết kỹ thuật và giảm bớt mức độ ưu tiên của các lĩnh vực nghiên cứu khác"
 edict_social_welfare_programs:0 "Chương trình phúc lợi xã hội"
 edict_social_welfare_programs_desc:0 "Sắc lệnh này sẽ chỉ đạo thành lập nhiều dự án xã hội, đòi hỏi đầu tư nguồn vốn lớn nhằm nâng cao mức sống của người dân."
 #edict_the_grand_fleet:0 "The Grand Fleet"
 #edict_the_grand_fleet_desc:0 "This Edict puts the pride and glory of the Empire's Grand Fleet above all else, and that considerable political focus should be spent ensuring its continued prosperity."
 edict_share_the_burden:0 "Sẻ chia gánh nặng"
 edict_share_the_burden_desc:1 "Sắc lệnh này sẽ buộc những lao động hợp đồng phải làm việc theo ca, nhằm gia tăng năng suất của những lao động chân tay."
 # edict_share_the_burden_desc: "This Edict dictates that the various burdens of society should be given to those best suited to handle them. Manual labour is best left to those used to such tasks..."
 edict_peace_festivals:0 "Lễ hội hòa bình"
 edict_peace_festivals_desc:1 "Sắc lệnh mang tư tưởng chủ hòa này thúc đẩy tinh thần đoàn kết và lan tỏa bầu không khí vui vẻ thông qua nhiều lễ hội và hoạt động kỷ niệm khác nhau."
 edict_land_of_opportunity:0 "Vùng đất cơ hội"
 edict_land_of_opportunity_desc:2 "Đạo luật này vạch ra các chiến dịch quan hệ công chúng có chủ đích nhằm xây dựng đế chế của chúng ta thành một quốc gia xã hội hoàn toàn mới, dẫn đầu xu thế - một nơi mà tất cả mọi người đều có thể phát triển thịnh vượng, một khởi đầu hoàn toàn mới."
 edict_diplomatic_grants:0 "Trợ cấp ngoại giao"
 edict_diplomatic_grants_desc:2 "Sắc lệnh này dùng để điều phối các hoạt động ngoại giao chủ động, từ đó cải thiện hình ảnh của đế chế chúng ta."

 edict_engineering_research_focus_hive:0 "Hy sinh toàn bộ các kiến thức khác, để cho những cá thể tư duy của chúng ta tập trung suy nghĩ về các khái niệm mới."
 edict_engineering_research_focus_machine:0 "Tập trung năng lực xử lý của chúng ta vào các mô hình lý thuyết kỹ thuật và giảm bớt mức độ ưu tiên của các lĩnh vực nghiên cứu khác"
 edict_physics_research_focus_hive:0 "Hy sinh toàn bộ các kiến thức khác, để cho những cá thể tư duy của chúng ta tập trung suy nghĩ về các khái niệm mới."
 edict_physics_research_focus_machine:0 "Tập trung năng lực xử lý của chúng ta vào các mô hình lý thuyết vật lý và giảm bớt mức độ ưu tiên của các lĩnh vực nghiên cứu khác"
 edict_society_research_focus_hive:0 "Hy sinh toàn bộ các kiến thức khác, để cho những cá thể tư duy của chúng ta tập trung suy nghĩ về các khái niệm mới."
 edict_society_research_focus_machine:0 "Tập trung năng lực xử lý của chúng ta vào các mô hình lý thuyết xã hội học và giảm bớt mức độ ưu tiên của các lĩnh vực nghiên cứu khác"

 # Campaigns
 edict_fear_campaign:0 "Chiến dịch gieo rắc nỗi sợ"
 edict_fear_campaign_desc:0 "Công chúng phải được biết về bản chất tà ác và man rợ của những giống loài khác. Họ phải chấp nhận sự thật rằng chúng ta đang cô độc giữa một biển những giống loài ngoại lai độc ác."
 edict_education_campaign:0 "Chiến dịch giáo dục"
 edict_education_campaign_desc:0 "Tiếp tục học hỏi! Tạm thời chi tiêu tài nguyên để thúc đẩy các chương trình giáo dục bậc cao trong hàng ngũ thủ lĩnh của chúng ta, giúp kỹ năng của họ được cải thiện nhanh hơn."
 edict_healthcare_campaign:0 "Chiến dịch bảo vệ sức khỏe"
 edict_healthcare_campaign_desc:1 "Chế độ ăn uống, tập luyện hàng ngày và thói quen ngủ nghỉ kết hợp lại có thể tác động đến sức khỏe của người dân. Bằng cách khuyến khích một lối sống lành mạnh hơn, tuổi thọ kỳ vọng của họ sẽ được nâng cao."
 edict_recycling_campaign:0 "Chiến dịch tái chế"
 edict_recycling_campaign_desc:0 "Mọi người phải học cách kiềm chế việc tiêu thụ lãng phí các nguồn tài nguyên. Một chiến dịch cộng đồng thúc đẩy việc tái chế tài nguyên sẽ tạm thời làm giảm mức tiêu thụ hàng hóa dân dụng của chúng ta."
 edict_robot_campaign:0 "Chiến dịch máy bay không người lái"
 edict_robot_campaign_desc:0 "Phân bổ thêm tài nguyên cho các cơ sở sản xuất của chúng ta, từ đó có thể sản xuất các thiết bị không người lái mới với tốc độ nhanh hơn."
 edict_machine_learning_campaign:0 "Chiến dịch máy học"
 edict_machine_learning_campaign_desc:0 "Phân bổ thêm tài nguyên cho các thiết bị không người lái tự chủ của chúng ta, giúp các thuật toán tự học của chúng được cải thiện đáng kể, từ đó tăng năng suất."
 edict_drone_campaign:0 "Chiến dịch sản xuất cá thể phụ"
 edict_drone_campaign_desc:0 "Phân bổ thêm sinh khối cho các bể ấp của chúng ta, giúp chúng ta có thể tạo ra các cá thể phụ mới với tốc độ nhanh hơn."
 edict_learning_campaign:0 "Chiến dịch học tập"
 edict_learning_campaign_desc:0 "Cung cấp thêm dinh dưỡng cho các cá thể tự chủ của chúng ta sẽ giúp gia tăng năng suất của chúng."
 edict_war_drone_campaign:0 "Chiến dịch cá thể chiến đấu"
 edict_war_drone_campaign_desc:0 "Phân bổ thêm dinh dưỡng cho các cá thể chiến đấu của chúng ta, từ đó tăng cường sức mạnh và khả năng tác chiến của chúng."

 # Planet Edicts
 #edict_reeducation_campaign:0 "Reeducation Campaigns"
 #edict_reeducation_campaign_desc:1 "This Edict creates local reeducation campaigns, affirming that dissent is naught but the product of ignorance and a failure of reason."
 #edict_infrastructure_projects:0 "Infrastructure Projects"
 #edict_infrastructure_projects_desc:1 "This Edict puts considerable political weight behind new construction initiatives."
 #edict_social_engineering:0 "Social Engineering"
 #edict_social_engineering_desc:2 "This Fanatic Authoritarian Edict mandates the use of subtle social instruments to reinforce our governing Ethics on the planet."
 #edict_privatization_campaign:1 "Grassroots Administration"
 #edict_privatization_campaign_desc:2 "This Fanatic Egalitarian Edict encourages the individuals closest to the production effort to take increased responsibility."
 #edict_arms_race:0 "Arms Race"
 #edict_arms_race_desc:0 "This Fanatic Militarist Edict focuses all administrative and societal efforts on efficient production of military equipment."
 #edict_religious_unity:1 "Spiritual Unity"
 #edict_religious_unity_desc:1 "This Fanatic Spiritualist Edict unites the populace in quasi-religious fervor, with a particular emphasis on harvest and fertility rituals."
 #edict_spirit_of_science:0 "Spirit of Science"
 #edict_spirit_of_science_desc:0 "This Fanatic Materialist Edict focuses all administrative and societal efforts on efficient research and the celebration of Reason."
 #edict_legal_aliens:0 "Legal Aliens"
 #edict_legal_aliens_desc:0 "This Fanatic Xenophile Edict launches a massive PR campaign inviting aliens to come live on the planet in a glorious multicultural paradise."
 #edict_purity_laws:0 "Purity Laws"
 #edict_purity_laws_desc:0 "This Fanatic Xenophobe Edict ensures the purity of our species and unity of our empire through the enforcement of rigid separation laws."
 edict_crystal_sonar:0 "Sóng âm tinh thể"
 edict_crystal_sonar_desc:0 "Khi chạm trán thực thể tinh thể, cho phép hạm đội sử dụng công nghệ đặc biệt để ngay lập tức khảo sát hệ sao mà chúng đang cư trú.\nChi phí năng lượng: £energy£§R-30§!"
 edict_droning_optimizations:0 "Tối ưu hóa thiết bị không người lái"
 edict_droning_optimizations_desc:3 "§LGói tối ưu hóa năng lượng này dựa trên sự hướng dẫn từ công nghệ máy đào mỏ tự động cổ đại, có khả năng tăng cường sản lượng tài nguyên của chúng ta.§!"
 edict_greater_crystal_bounty:0 "Tiền thưởng tinh thể khổng lồ"
 edict_greater_crystal_bounty_desc:1 "§LCho phép hạm đội thu hồi xác của các thực thể tinh thể bị phá hủy.§!\nMỗi khi đánh bại một hạm đội sẽ nhận được lượng khoáng sản là: §G500§!"
 edict_crystal_bounty:0 "Tiền thưởng tinh thể"
 edict_crystal_bounty_desc:1 "§LRa lệnh cho hạm đội của chúng ta thu hồi khoáng thạch từ xác của những thực thể tinh thể bị phá hủy.§!\nMỗi khi đánh bại một hạm đội sẽ nhận được lượng khoáng sản là: §G250§!"
 edict_drone_bounty:0 "Tiền thưởng thiết bị không người lái"
 edict_drone_bounty_desc:1 "§LRa lệnh cho hạm đội thu hồi pin năng lượng từ những máy khai thác mỏ không người lái cổ đại đã bị đánh bại.§!\nMỗi khi đánh bại một hạm đội sẽ nhận được năng lượng là: §G500§!"
 edict_declare_saint:0 "Phong thánh"
 edict_declare_saint_desc:0 "Sắc lệnh này sẽ trao tặng danh hiệu thánh nhân cho một người dân địa phương đã qua đời vốn rất sùng đạo khi còn sống. Mục đích là để tạo ra một biểu tượng mới nhằm đoàn kết công chúng."

 # Decrees
 unity_ambition:0 "Tham vọng: "
 edict_scientific_revolution:0 "$unity_ambition$Cách mạng Khoa học"
 edict_scientific_revolution_desc:0 "Một kỷ nguyên hoàng kim của khám phá khoa học tuy ngắn ngủi nhưng đầy những thành tựu rực rỡ. Sự kết hợp giữa tinh thần dũng cảm, tư duy sáng tạo và sự lạc quan phóng khoáng sẽ đưa chúng ta tiến xa hơn nữa."
 edict_desperate_measures:0 "$unity_ambition$Hành động Liều lĩnh"
 edict_desperate_measures_desc:0 "Một con thú bị dồn vào chân tường là nguy hiểm nhất, và kẻ thù của chúng ta sẽ sớm nhận ra điều này. Để đảm bảo sự tồn tại của giống loài, chúng ta phải làm mọi thứ bằng mọi giá."
 edict_fortress_proclamation:0 "$unity_ambition$Tuyên ngôn Pháo đài"
 edict_fortress_proclamation_desc:0 "Biên cương của chúng ta phải là một chiến hào vững chắc không thể xuyên thủng. Sự tồn tại của chúng sẽ gửi một thông điệp rõ ràng tới các láng giềng đầy tham vọng - đây chính là giới hạn cuối cùng!"
 edict_architectural_renaissance:0 "$unity_ambition$Phục hưng Kiến trúc"
 edict_architectural_renaissance_desc:0 "Quy mô xây dựng khổng lồ này từng chỉ tồn tại trong trí tưởng tượng của những thế hệ đi trước, những cấu trúc đồ sộ giờ đây đáng lẽ phải trở thành biểu tượng di sản cho nền văn minh vĩ đại của chúng ta."
 edict_architectural_renaissance_nomad: "$unity_ambition$Phục Hưng Du Mục"
 edict_architectural_renaissance_nomad_desc: "Lối sống du mục giờ đây đang trở thành hiện thực với quy mô ngoài sức tưởng tượng. Việc mở rộng hạm đội Ark cùng các công trình xây trạm tiếp vận mới sẽ không còn là trường hợp ngoại lệ; chúng phải trở thành lẽ thường nhật."
 edict_hearts_and_minds:0 "$unity_ambition$Trái tim và Tâm trí"
 edict_hearts_and_minds_desc:0 "Các chiến dịch tuyên truyền dày đặc sẽ khiến công chúng nhận ra chính phủ của chúng ta xuất sắc đến nhường nào. Dù thế nào đi nữa, những hành động này đều nhằm bảo vệ hạnh phúc của họ."
 edict_omnifarious_acquisition:0 "$unity_ambition$Thu thập Toàn diện"
 edict_omnifarious_acquisition_desc:0 "Bất kỳ vật tư dư thừa nào cũng phải được tái chế, tham vọng lớn lao của chúng ta đòi hỏi chúng ta phải tận dụng tốt mọi nguồn tài nguyên có được."
 edict_omnifarious_acquisition_nomad: "$edict_omnifarious_acquisition$"
 edict_omnifarious_acquisition_nomad_desc: "$edict_omnifarious_acquisition_desc$"
 edict_grand_fleet:0 "$unity_ambition$Hạm Đội Vĩ Đại"
 edict_grand_fleet_desc:0 "Nhằm thực hiện tầm nhìn ngân hà vĩ đại của mình, chúng ta phải đặt việc xây dựng một hạm đội mạnh mẽ làm mục tiêu ưu tiên hàng đầu."

