 SCOUT_HANGAR_1:0 "Phi đội Trinh sát"
 SCOUT_HANGAR_1_DESC:1 "Phi cơ thiết kế riêng cho việc trinh sát có khả năng chiến đấu cơ bản, có thể dùng để quấy rối dàn phi cơ địch lởn vởn gần tàu mẹ."
 FIGHTERS_HANGAR_1:0 "Phi đội Tiêm kích Cơ bản"
 FIGHTERS_HANGAR_1_DESC:1 "Tiêm kích cơ bản có khả năng cắn trộm kẻ địch lân cận trong lúc tàu mẹ đang bận giao chiến."
 FIGHTERS_HANGAR_2:0 "Phi đội Tiêm kích Cải tiến"
 FIGHTERS_HANGAR_2_DESC:1 "Tiêm kích cải tiến có thể hợp tác với hỏa lực của hạm đội để bắn rụng các loại tàu nhỏ, oanh tạc cơ và phi cơ tấn công của địch."
 FIGHTERS_HANGAR_3:0 "Phi đội Tiêm kích Tiên tiến"
 FIGHTERS_HANGAR_3_DESC:1 "Tiêm kích tiên tiến có thể cấu một lượng máu khổng lồ từ các tàu nhỏ của địch, đồng thời đủ sức một tay dọn sạch phi đội tiêm kích phe kia."
 BOMBERS_HANGAR_1:0 "Phi đội Oanh tạc cơ Cơ bản"
 BOMBERS_HANGAR_1_DESC:1 "Oanh tạc cơ cơ bản có lượng tải đạn khá khiêm tốn, thích hợp để tấn công cận chiến nhắm vào các tàu bự của địch."
 BOMBERS_HANGAR_2:0 "Phi đội Oanh tạc cơ Cải tiến"
 BOMBERS_HANGAR_2_DESC:1 "Oanh tạc cơ cải tiến có khả năng dồn sát thương khủng hơn nhiều lên tàu quân sự của kẻ địch."
 BOMBERS_HANGAR_3:0 "Phi đội Oanh tạc cơ Tiên tiến"
 BOMBERS_HANGAR_3_DESC:1 "Oanh tạc cơ tiên tiến lạng lách linh hoạt trên chiến trường giữa các vì sao, bất ngờ áp sát và thả bom rải thảm lên tàu đối phương."

