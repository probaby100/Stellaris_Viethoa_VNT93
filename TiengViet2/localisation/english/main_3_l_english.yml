 st_balanced:0 "Phát triển cân bằng"
 st_balanced_desc: "Khu vực này sẽ duy trì sự cân bằng giữa nguyên liệu thô, sản xuất và nghiên cứu.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!."
 st_industrial:0 "Chuyên công nghiệp"
 st_industrial_desc: "Khu vực này sẽ tập trung vào sản xuất khoáng sản.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!."
 st_research:0 "Chuyên nghiên cứu"
 st_research_desc: "Khu vực này sẽ tập trung nhân lực vào công tác nghiên cứu.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!."
 st_financial:0 "Chuyên kinh tế"
 st_financial_desc: "Khu vực này sẽ tập trung sản xuất Năng lượng.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!."
 st_agricultural:0 "Chuyên nông nghiệp"
 st_agricultural_desc: "Khu vực này sẽ tập trung sản xuất Thực phẩm.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!."
 st_production:0 "Chuyên sản xuất"
 st_production_desc: "Khu vực này sẽ tập trung sản xuất các nguyên liệu thô như Thực phẩm, Khoáng sản và Năng lượng.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!."
 st_manufacturing:0 "Chuyên chế tạo"
 st_manufacturing_desc: "Khu vực này sẽ tập trung sản xuất các sản phẩm cao cấp như Hợp kim và Hàng tiêu dùng.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!."
 st_unity:0 "Chuyên đoàn kết"
 st_unity_desc: "Khu vực này sẽ tập trung nhân lực vào việc sản xuất Đoàn kết.\n\nTất cả các hành tinh trong khu vực này sẽ §HBật§! §HTự động hóa hành tinh§!.\n\nViệc thao tác thủ công §HTự động hóa hành tinh§! sẽ ghi đè lên thiết lập §HTự động hóa khu vực§!."

