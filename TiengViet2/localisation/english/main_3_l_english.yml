 attitude_null_desc:1 "Đế chế này không có bất kỳ quan điểm nào về chúng ta."
 attitude_friendly_desc:1 "Đế chế này coi chúng ta là bạn và có thể sẵn sàng liên minh với chúng ta."
 attitude_cordial_desc:1 "Đế chế này sẵn sàng chung sống hòa bình và giao thương với chúng ta."
 attitude_unfriendly_desc:0 "Đế chế này nghi ngờ và không tin tưởng chúng ta."
 attitude_rival_desc:0 "Đế chế này coi chúng ta là kẻ thù không đội trời chung."
 attitude_hostile_desc:3 "Đế chế này coi chúng ta là kẻ thù của họ. Nếu họ có đủ tự tin để đánh bại chúng ta, rất có thể họ sẽ tuyên chiến."
 attitude_domineering_desc:0 "Đế chế này cho rằng chúng ta là một đối tượng chư hầu tuyệt vời."
 attitude_threatened_desc:1 "Đế chế này coi chúng ta là một mối đe dọa lớn."
 attitude_protective_desc:1 "Đế chế này cho rằng chúng ta quá yếu đuối và cần sự bảo vệ của họ."
 attitude_loyal_desc:1 "Quốc gia chư hầu này rất trung thành với chúng ta."
 attitude_disloyal_desc:1 "Chư hầu này cảm thấy phẫn uất trước việc phải xu nịnh chúng ta"
 attitude_overlord_desc:0 "Đế chế này là tông chủ của chúng ta."
 attitude_wary_desc:0 "Đế chế này giữ thái độ cảnh giác đối với chúng ta"
 attitude_receptive_desc:0 "Đế chế này có xu hướng thiết lập mối quan hệ sâu sắc hơn với chúng ta."
 attitude_neutral_desc:1 "Đế chế này cho rằng chúng ta không có lợi ích liên quan."
 attitude_dismissive_desc:0 "Đế chế Sa ngã cho rằng chúng ta không đủ để họ bận tâm."
 attitude_patronizing_desc:1 "Đế chế Sa ngã cho rằng chúng ta là những đứa trẻ lạc lối cần được chỉ bảo. Họ có thể hạ mình ban cho chúng ta công nghệ, tài nguyên hoặc tàu chiến."
 attitude_angry_desc:0 "Chúng ta đã dùng hành động để bày tỏ sự tức giận với Đế chế Sa ngã, họ có thể tuyên chiến với chúng ta như một đòn trừng phạt."
 attitude_arrogant_desc:0 "Thái độ của Đế chế Thức tỉnh này đối với chúng ta chỉ có sự khinh miệt và kiêu ngạo."
 attitude_imperious_desc:0 "Đế chế Thức tỉnh này coi chúng ta là một quốc gia phụ thuộc chờ bị chinh phục, rất có thể họ sẽ buộc chúng ta từ bỏ độc lập tự chủ."
 attitude_belligerent_desc:0 "Đế chế Thức tỉnh này coi chúng ta là một mục tiêu để chinh phục. Khả năng cao là họ sẽ xâm lược chúng ta."
 attitude_custodial_desc:0 "Đế chế Thức tỉnh này tự cho rằng họ có nghĩa vụ bảo vệ chúng ta, giúp chúng ta sống sót trước thiên tai đe dọa toàn hệ sao. Họ có thể cố gắng liên minh với chúng ta."
 attitude_berserker_desc:0 "Đế chế Thức tỉnh này là một Trí tuệ Nhân tạo cổ đại đã chìm trong sự cuồng bạo. Rất có khả năng nó sẽ tấn công mọi thứ xung quanh."
 attitude_enigmatic_desc:0 "Đế chế Sa ngã này là một Trí tuệ Nhân tạo cổ đại có hành vi kỳ quặc và khó đoán. Chúng ta không thể lường trước được điều gì từ họ."

