 PLANET_KILLER_CRACKER:0 "Pháo Nghiền Nát Hành Tinh (World Cracker)"
 PLANET_KILLER_CRACKER_ACTION:0 "Khai nổ"
 PLANET_KILLER_CRACKER_DESC:0 "Phóng ra luồng nhiệt năng cực lớn đốt nóng bầu khí quyển và kích nổ lõi hành tinh, phá hủy hoàn toàn cấu trúc địa chất của lớp vỏ. Cuối cùng, một làn sóng xung kích thứ cấp sẽ xé toạc hành tinh thành muôn vàn mảnh vụn."
 PLANET_KILLER_SHIELDER:0 "Thiên Sứ An Lạc"
 PLANET_KILLER_SHIELDER_ACTION:0 "Bình định"
 PLANET_KILLER_SHIELDER_DESC:1 "Một trường lá chắn vĩnh cửu bất khả xâm phạm sẽ được triển khai phong tỏa toàn bộ bề mặt hành tinh (chỉ cho phép một số bước sóng ánh sáng nhất định đi qua)."
 PLANET_KILLER_NEUTRON:0 "Chùm Tia Quét Neutron (Neutron Sweep)"
 PLANET_KILLER_NEUTRON_ACTION:0 "Thanh tẩy"
 PLANET_KILLER_NEUTRON_DESC:0 "Một luồng bức xạ neutron gia tốc cực mạnh sẽ quét qua toàn bộ bề mặt hành tinh, hủy diệt hầu hết mọi cấu trúc tế bào và mô sinh học."
 PLANET_KILLER_GODRAY:1 "Ánh Sáng Thần Thánh (Divine Enforcer)"
 PLANET_KILLER_GODRAY_ACTION:0 "Thần phạt"
 PLANET_KILLER_GODRAY_DESC:1 "Một thiết bị phóng tâm linh sẽ gieo rắc chân lý thiêng liêng xuống khắp hành tinh, quy tụ tất cả những kẻ có niềm tin trở thành tín đồ ngoan đạo và diệt trừ hoàn toàn những kẻ vô thần."
 PLANET_KILLER_NANOBOTS:1 "Xung Phân Rã Nanite (Nanobot Diffuser)"
 PLANET_KILLER_NANOBOTS_ACTION:0 "Cơ khí hóa"
 PLANET_KILLER_NANOBOTS_DESC:0 "Phát tán vô số hạt nanobot vào bầu khí quyển, chúng sẽ xâm nhập các sinh mệnh thông tuệ và tự biến đổi thành các thiết bị cấy ghép điều khiển, biến những vật chủ vô thức thành những thể cơ khí chịu sự chi phối hoàn toàn của trí tuệ máy móc."
 PLANET_KILLER_DELUGE:0 "Đại Hồng Thủy"
 PLANET_KILLER_DELUGE_ACTION:0 "Nhấn chìm"
 PLANET_KILLER_DELUGE_DESC:0 "Một khối lượng nước khổng lồ được trút thẳng xuống hành tinh, xóa sổ toàn bộ các công trình nhân tạo cùng các sinh vật sống trên cạn. Trận hồng thủy đi kèm với các luồng khí quyển thiết yếu nhằm ổn định khí hậu và duy trì đại dương vĩnh cửu cho hành tinh."

