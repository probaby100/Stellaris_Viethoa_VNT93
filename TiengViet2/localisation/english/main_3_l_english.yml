 zone_volatile_motes: "Thu thập Hạt Bất ổn"
 zone_volatile_motes_desc: "Chuyển điện năng vào các trường ngưng tụ năng lượng cao để ổn định các hạt vật chất."
 technician_is_mote_harvester_tt: "£job_technician£$job_technician_plural$ chuyển thành £job_mote_harvester£$job_mote_harvester_plural$"
