 FISSION_REACTOR:0 "Lò phản ứng Phân hạch"
 FISSION_REACTOR_DESC:1 "Cung cấp năng lượng cho tàu bằng cách kích hoạt chuỗi phản ứng phân hạch hạt nhân, nhưng đồng thời cũng sinh ra chất thải phóng xạ độc hại."
 FUSION_REACTOR:0 "Lò phản ứng Nhiệt hạch"
 FUSION_REACTOR_DESC:1 "Phản ứng nhiệt hạch có thể cung cấp nguồn điện khổng lồ cho con tàu, mà lại ít rủi ro hơn là phân hạch."
 COLD_FUSION_REACTOR:0 "Lò phản ứng Nhiệt hạch Lạnh"
 COLD_FUSION_REACTOR_DESC:1 "Công nghệ nhiệt hạch ở nhiệt độ thấp sẽ là bước đệm cho sự ra đời của thế hệ lò phản ứng nhiệt hạch gắn trên tàu chiến đời mới."
 ZERO_POINT_REACTOR:0 "Lò phản ứng Điểm Không"
 ZERO_POINT_REACTOR_DESC:1 "Trích xuất năng lượng điểm không từ chân không là phương thức sản xuất điện hiệu quả nhất hiện tại, mang đến nguồn năng lượng gần như vô tận cho con tàu."
 ANTIMATTER_REACTOR:0 "Lò phản ứng Phản vật chất"
 ANTIMATTER_REACTOR_DESC:1 "Bằng cách khai thác năng lượng sinh ra từ sự triệt tiêu lẫn nhau giữa vật chất và phản vật chất, hiệu suất tạo năng lượng cho tàu sẽ vượt xa cả phản ứng nhiệt hạch."

 SCIENCE_LAB_1:0 "Phòng Thí nghiệm Khoa học"
 MEDIUM_SCIENCE_LAB_1_DESC:0 "Phòng thí nghiệm trên tàu có thể đảm đương một vài tác vụ nghiên cứu cơ bản, hoặc dùng để quan trắc các thiên thể."
 CURATOR_EXPLORER_LAB:0 "$tech_curator_lab$"
 CURATOR_ARCHEOLOGY_LAB:0 "$tech_archeology_lab$"
 SENSOR_1:0 "Hệ thống Radar"
 SENSOR_1_DESC:1 "Hệ thống radar là một công nghệ được phát minh trên mặt đất nhưng lại được đem lên xài trong không gian sâu. Nó có thể cung cấp những dữ liệu trinh sát và bám đuôi cơ bản nhất cho các con tàu đang du hành giữa các vì sao."
 SENSOR_2:0 "Cảm biến Trọng lực"
 SENSOR_2_DESC:0 "Những cảm biến này đã được hiệu chỉnh để phát hiện bất kỳ biến đổi trọng lực nào trong không gian, ví dụ như những gợn sóng bóp méo trường lực do sự xuất hiện của một con tàu."
 SENSOR_3:0 "Cảm biến Á không gian"
 SENSOR_3_DESC:0 "Những cảm biến này có thể bắt được những vệt sóng á không gian để lại sau khi một con tàu du hành bật động cơ. Độ nhạy và tầm quét của chúng xịn hơn nhiều so với lưới cảm biến trọng lực."
 SENSOR_4:0 "Cảm biến Tachyon"
 SENSOR_4_DESC:0 "Loại cảm biến tinh vi này phụ thuộc vào chùm hạt tachyon xoay vòng, có thể phát hiện chuyển động của tàu thuyền dù cách xa hàng vạn dặm."
 AFTERBURNER_1:0 "Buồng Đốt sau"
 AFTERBURNER_1_DESC:0 "Buồng đốt sau giúp cải thiện đáng kể tốc độ chiến đấu của con tàu."
 AFTERBURNER_2:0 "Buồng Đốt sau Tiên tiến"
 AFTERBURNER_2_DESC:0 "Buồng đốt sau đã qua cải tiến, có thể gia tăng mạnh mẽ tốc độ chiến đấu cho tàu."
 SHIELD_1:0 "Lá chắn Lệch hướng"
 SHIELD_1_DESC:0 "Màng năng lượng lệch hướng có thể hấp thụ một phần hỏa lực địch trước khi bị quá tải, nhược điểm chí mạng là ngốn quá nhiều điện."
 SHIELD_2:0 "Lá chắn Lệch hướng Cải tiến"
 SHIELD_2_DESC:0 "Nâng cấp màng năng lượng lệch hướng, giúp hấp thụ được nhiều hỏa lực hơn trước khi sập nguồn."
 SHIELD_3:0 "Lá chắn"
 SHIELD_3_DESC:0 "Máy tạo lá chắn kiểu mới này chính là thế hệ màng năng lượng tiếp theo, thay thế cho hệ thống lệch hướng lỗi thời, mang lại khả năng bảo vệ ưu việt hơn."
 SHIELD_4:0 "Lá chắn Tiên tiến"
 SHIELD_4_DESC:0 "Nâng cấp máy tạo lá chắn để dựng lên một trường năng lượng kiên cố hơn. Chỉ có hỏa lực xả liên tục mới có thể làm nứt bức tường này."
 SHIELD_5:0 "Siêu Lá chắn"
 SHIELD_5_DESC:0 "Những tấm lá chắn năng lượng được gia cố và cường hóa này vững chãi vô song, mang đến khả năng phòng thủ vững như bàn thạch."
 SHIELD_BOOSTER:0 "Tụ Lá chắn"
 SHIELD_BOOSTER_DESC:1 "$tech_shield_rechargers_1_desc$"
 SHIELD_HARDENER_1:0 "Bộ Làm cứng Lá chắn"
 SHIELD_HARDENER_1_DESC:0 "Thông qua những tinh chỉnh này, trường lực do máy tạo lá chắn phát ra sẽ có tác dụng làm trượt đi một phần đối với những đòn tấn công chuyên xuyên thủng lá chắn."
 SHIELD_HARDENER_2:0 "Bộ Làm cứng Lá chắn Tiên tiến"
 SHIELD_HARDENER_2_DESC:0 "Các hạt Zro được nâng lên trạng thái năng lượng cao có thể tạo ra những sóng dao động trên lá chắn, giúp khúc xạ những đòn tấn công xuyên thủng được các loại lá chắn thông thường."
 ARMOR_HARDENER_1:0 "Giáp Phản ứng"
 ARMOR_HARDENER_1_DESC:0 "Cấy ghép mạng tinh thể vào hệ thống phòng thủ của tàu sẽ tạo ra lớp đề kháng nhất định đối với những vũ khí chuyên trị xuyên giáp."
 ARMOR_HARDENER_2:0 "Giáp Phản ứng Hoạt tính"
 ARMOR_HARDENER_2_DESC:0 "Các sợi kim loại hoạt tính sẽ phản ứng ngay với hỏa lực bay tới, tự định hình lại cấu trúc để chống đỡ sức sát thương của vũ khí xuyên giáp."

 REACTOR_BOOSTER_1:0 "Bộ Kích Lò phản ứng"
 REACTOR_BOOSTER_1_DESC:0 "Hệ thống phát điện bổ sung này giúp tăng cường lượng điện năng sản sinh từ lò phản ứng của tàu."
 REACTOR_BOOSTER_2:0 "Bộ Kích Lò phản ứng Cải tiến"
 REACTOR_BOOSTER_2_DESC:0 "Sự ra đời của phản ứng nhiệt hạch cho phép chúng ta gắn bộ kích lò phản ứng ngon lành hơn lên con tàu của mình."
 REACTOR_BOOSTER_3:0 "Bộ Kích Lò phản ứng Tiên tiến"
 REACTOR_BOOSTER_3_DESC:0 "Việc khai phá ra năng lượng phản vật chất đã mở đường cho những bộ kích lò phản ứng vô cùng tân tiến, giúp đẩy mạnh hiệu suất lò phản ứng trên tàu lên nhiều lần."

 tech_reactor_booster_1:0 "Bộ Kích Lò phản ứng"
 tech_reactor_booster_1_desc:0 "$REACTOR_BOOSTER_1_DESC$"
 tech_reactor_booster_2:0 "Bộ Kích Lò phản ứng Cải tiến"
 tech_reactor_booster_2_desc:0 "$REACTOR_BOOSTER_2_DESC$"
 tech_reactor_booster_3:0 "Bộ Kích Lò phản ứng Tiên tiến"
 tech_reactor_booster_3_desc:0 "$REACTOR_BOOSTER_3_DESC$"

 FIRE_CONTROL_1:0 "Hỗ trợ Kiểm soát Hỏa lực"
 FIRE_CONTROL_1_DESC:0 "Sau khi cài đặt hệ thống kiểm soát hỏa lực phụ trợ, tàu chiến của chúng ta có thể thực hiện những tính toán chi tiết hơn và nã đạn chính xác hơn."

 AUTO_REPAIR:0 "Mô Vỏ tàu Tái sinh"
 AUTO_REPAIR_DESC:0 "Các vi khuẩn này được cấy thẳng vào cấu trúc thiết kế của tàu, mỗi khi vỏ tàu chịu hư hại, chúng sẽ lập tức bắt tay vào việc tự vá víu lại vết thương."
 BIO_AUTO_REPAIR: "$AUTO_REPAIR$"
 PSI_SHIELD:0 "Lá chắn Tâm linh"
 PSI_SHIELD_DESC:0 "$tech_psionic_shield_desc$"
 PSI_BARRIER:0 "Màng chắn Tâm linh"
 PSI_BARRIER_DESC:0 "$tech_psionic_barrier_desc$"

 NULL_VOID:0 "Tia Hư vô"
 NULL_VOID_DESC:0 "$null_void_beam_desc$"

 ARMOR_BEING_REDUCED:0 "Hiệu ứng giảm Giáp:"
 SHIELD_BEING_REDUCED:0 "Hiệu ứng giảm Lá chắn:"

 ARMOR_1:0 "Giáp Nano"
 ARMOR_1_DESC:0 "Lớp giáp nano được gia cố này mang đến một tầng bảo vệ bù đắp thêm, có nó hay không đôi khi là cả lằn ranh sinh tử trên chiến trường."
 ARMOR_2:0 "Giáp Gốm kim"
 ARMOR_2_DESC:0 "Hợp chất lai tạo giữa các kim loại và gốm sứ khác nhau, cứng cỏi nhưng không hề mất đi tính dẻo dai."
 ARMOR_3:0 "Giáp Nhựa thép"
 ARMOR_3_DESC:0 "Nhựa thép là sự kết hợp của nhiều loại nhựa và kim loại, mang tính đàn hồi tốt. Vừa gia tăng độ cứng cáp cho thân tàu, lại vừa rẻ mạt."
 ARMOR_4:0 "Giáp Thép bền"
 ARMOR_4_DESC:0 "Vật liệu này cực kỳ dai sức và chống chịu va đập tốt, là lựa chọn số một cho vỏ thân tàu."
 ARMOR_5:0 "Giáp Neutronium"
 ARMOR_5_DESC:0 "Giáp neutron có mật độ đặc và kết cấu cực kỳ bền chắc, nếu đem so với giáp hợp kim bình thường, nó có thể chặn đứng những hỏa lực tàn khốc hơn nhiều."
 CRYSTAL_ARMOR_1:0 "Mạ Pha lê Hợp chất"
 CRYSTAL_ARMOR_1_DESC:1 "Hợp kim được chiết xuất từ những tinh thể siêu cứng tạo thành một lớp lót bên trong vỏ tàu, giúp gia cố tính toàn vẹn của cấu trúc tàu."
 CRYSTAL_ARMOR_2:0 "Mạ Pha lê Rèn nguyên khối"
 CRYSTAL_ARMOR_2_DESC:1 "Cách thức rèn hợp kim tinh thể đã được cải biên lại, trở nên dẻo dai và bền bỉ hơn rất nhiều."

