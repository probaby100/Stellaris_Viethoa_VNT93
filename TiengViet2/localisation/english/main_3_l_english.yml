 research_policy_new_worlds_desc:0 "Tập trung vào công nghệ §YLý thuyết thế giới mới§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_statecraft:0 "Thuật trị quốc"
 research_policy_statecraft_name:0 "$research_policy_statecraft$"
 research_policy_statecraft_desc:0 "Tập trung vào công nghệ §YThuật trị quốc§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_biology:0 "Sinh học"
 research_policy_biology_name:0 "$research_policy_biology$"
 research_policy_biology_desc:0 "Tập trung vào công nghệ §YSinh học§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_military_theory:0 "Lý thuyết quân sự"
 research_policy_military_theory_name:0 "$research_policy_military_theory$"
 research_policy_military_theory_desc:0 "Tập trung vào công nghệ §YLý thuyết quân sự§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_materials:0 "Khoa học vật liệu"
 research_policy_materials_name:0 "$research_policy_materials$"
 research_policy_materials_desc:0 "Tập trung vào công nghệ §YKhoa học vật liệu§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_propulsion:0 "Cơ học lực đẩy"
 research_policy_propulsion_name:0 "$research_policy_propulsion$"
 research_policy_propulsion_desc:0 "Tập trung vào công nghệ §YVật lý hạt§! sẽ mang lại cho chúng ta lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_voidcraft:0 "Công nghệ vũ trụ"
 research_policy_voidcraft_name:0 "$research_policy_voidcraft$"
 research_policy_voidcraft_desc:0 "Tập trung vào công nghệ §YCông nghệ vũ trụ§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_industry:0 "Công nghệ công nghiệp"
 research_policy_industry_name:0 "$research_policy_industry$"
 research_policy_industry_desc:0 "Tập trung vào công nghệ §YCông nghệ công nghiệp§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 policy_research_restriction_policy: "Hạn chế nghiên cứu"
 policy_research_restriction_policy_desc: "Nghiên cứu là một biên giới vô tận, nó vừa thúc đẩy sự tiến bộ của đế chế vừa bộc lộ những mối đe dọa tiềm tàng. Chúng ta phải quyết định xem có nên áp đặt các hạn chế đối với các nhà nghiên cứu hay không và áp đặt như thế nào."

 research_restriction_dangerous_encouraged: "Tái cấu trúc những hạn chế"
 research_restriction_dangerous_encouraged_name: "$research_restriction_dangerous_encouraged$"
 research_restriction_dangerous_encouraged_desc: "Các nhà nghiên cứu của chúng ta không nên lãng phí thời gian vào những vấn đề tầm thường, mà nên cống hiến hết mình cho nghiên cứu sâu sắc hơn.\n\n"

 research_restriction_no_restriction: "Không hạn chế"
 research_restriction_no_restriction_name: "$research_restriction_no_restriction$"
 research_restriction_no_restriction_desc: "Thiên hà này vừa rộng lớn vừa tràn ngập vô số điều kỳ diệu; kìm hãm cơ hội của các nhà nghiên cứu sẽ là một sai lầm.\n\n"

 research_restriction_dangerous_forbidden: "Đã áp đặt các hạn chế"
 research_restriction_dangerous_forbidden_name: "$research_restriction_dangerous_forbidden$"
 research_restriction_dangerous_forbidden_desc: "Phải tránh các công nghệ nguy hiểm bằng mọi giá. Vũ trụ có những quy luật bất khả xâm phạm.\n\n"

 policy_trade_policy:0 "Chính sách thương mại"
 policy_trade_policy_desc:0 "Thương mại đóng vai trò rất quan trọng đối với sự phát triển và thịnh vượng của đế chế, đồng thời có thể mang lại nhiều nguồn lực khác nhau cho đế chế. Chúng ta phải quyết định xem những tài nguyên này sẽ được ưu tiên cung cấp cho lĩnh vực nào."

 trade_policy_default:0 "Tạo ra của cải"
 trade_policy_default_name:0 "$trade_policy_default$"
 trade_policy_default_desc:0 "Ý nghĩa của thương mại là kiếm lợi nhuận cho cá nhân và tạo thu nhập cho quốc gia. Chúng ta nên tập trung thương mại vào việc tạo ra của cải.\n\n§Y50%§! $r_trade$ thu được sẽ được chuyển đổi thành $r_energy$"

 trade_policy_consumer_goods:0 "Lợi ích của người tiêu dùng"
 trade_conversion_consumer_goods_name:0 "$trade_policy_consumer_goods$"
 trade_policy_consumer_goods_desc:0 "Lợi nhuận và thuế phải nhường bước trước việc cải thiện mức sống của người dân. Chúng ta nên tập trung thương mại vào việc sản xuất và bán lẻ các nhu yếu phẩm hàng ngày.\n\n§Y50%§! $r_trade$ thu được sẽ được chuyển đổi thành $r_consumer_goods$. Cứ mỗi £trade£§Y1§!, bạn có thể nhận được £consumer_goods£§Y0.5§!."

 trade_policy_unity:0 "Thị trường trí tuệ"
 trade_conversion_unity_name:0 "$trade_policy_unity$"
 trade_policy_unity_desc: "Thương mại không chỉ là việc mua đi bán lại hàng hóa, nó còn có thể được sử dụng để truyền bá ý tưởng. Trọng tâm của chúng ta về thương mại phải là đảm bảo rằng thông điệp của chính phủ có thể truyền đến mọi khu định cư nơi chúng ta kinh doanh.\n\n§Y50%§! $r_trade$ thu hoạch được sẽ được chuyển đổi thành $r_unity$. Cứ mỗi £trade£§Y1§!, bạn có thể nhận được £unity£§Y0.25§!."

 trade_policy_trade_league:0 "Liên minh thương mại"
 trade_conversion_trade_league_name:0 "$trade_policy_trade_league$"
 trade_policy_trade_league_desc:3 "Bằng cách hợp lực để thành lập một liên bang thương mại, chúng ta có thể đưa sự thịnh vượng và an ninh lợi nhuận lên những tầm cao mới.\n\n§Y50%§! $r_trade$ thu được sẽ được chuyển đổi thành $r_energy$, $r_unity$ và $r_consumer_goods$. Cứ mỗi £trade£§Y1§!, bạn có thể nhận được £energy£§Y0.3§!, £unity£§Y0.15§! và £consumer_goods£§Y0.3§!."

 trade_policy_holy_covenant:0 "Hiệp ước thiêng liêng"
 trade_conversion_holy_covenant_name:0 "$trade_policy_holy_covenant$"
 trade_policy_holy_covenant_desc:0 "Bằng cách ký kết một hiệp ước thiêng liêng, chúng ta sẽ đắm mình trong ánh sáng rực rỡ tập thể của sứ mệnh thiêng liêng.\n\n§Y50%§! $r_trade$ thu được sẽ được chuyển thành $r_unity$. Cứ mỗi £trade£§Y1§!, bạn có thể nhận được £unity£§Y0.375§!."

 trade_policy_mutual_aid: "Tương trợ"
 trade_conversion_mutual_aid_name: "$trade_policy_mutual_aid$"
 trade_policy_mutual_aid_desc: "Việc tái đầu tư khoản thặng dư của chúng ta vào hợp tác xã đảm bảo rằng tất cả các thành viên đều có thể phát triển mạnh mẽ theo nhu cầu tương ứng của họ hướng tới tầm nhìn chung của chúng ta.\n\n§Y75%§! $r_trade$ thu được sẽ được chuyển đổi thành $r_energy$, $r_minerals$, $r_food$ và $r_unity$. Cứ mỗi £trade£§Y1§!, bạn có thể nhận được £energy£§Y0.27§!, £minerals£§Y0.27§!, £food£§Y0.27§! và £unity£§Y0.1§!."

 policy_economic_policy:0 "Chính sách kinh tế"
 policy_economic_policy_desc:0 "Nên chú trọng phát triển hay ổn định? Nên chú trọng giáo dục hay quốc phòng? Súng đại bác hay pho mát? Những câu hỏi này là nỗi muộn phiền của mọi chính phủ có nguồn lực hạn chế trong suốt lịch sử, và chính phủ của chúng ta cũng không ngoại lệ."

 economic_policy_balanced:0 "Kinh tế hỗn hợp"
 economic_policy_balanced_name:0 "$economic_policy_balanced$"
 economic_policy_balanced_desc:0 "Phát triển hoàn toàn vì chiến tranh hay vì hòa bình là những ý tưởng rất hạn hẹp. Chúng ta phải chuẩn bị sẵn sàng để đối mặt với mọi tình huống.\n\n§EKhông có bất kỳ phần thưởng hay hình phạt nào đối với việc sản xuất tài nguyên.§!"

 economic_policy_civilian:0 "Kinh tế dân sự"
 economic_policy_civilian_name:0 "$economic_policy_civilian$"
 economic_policy_civilian_desc:0 "Nhu cầu của người dân luôn được ưu tiên hơn nhu cầu chiến tranh. Sức mạnh của đế chế đến từ sức mạnh kinh tế vững chắc chứ không phải từ sức mạnh quân sự.\n\n"

 economic_policy_military:0 "Kinh tế quân sự"
 economic_policy_military_name:0 "$economic_policy_military$"
 economic_policy_military_desc:0 "Lơ là quốc phòng đồng nghĩa với lơ là sự an toàn và sống còn của quốc gia. Khi quân thù kéo đến cổng thành, liệu trang sức và nước hoa có cứu được đất nước không?\n\n"

 policy_drone_policy:0 "Chính sách sản xuất"
 policy_drone_policy_desc:0 "Dù khả năng kết hợp của Tâm trí Bầy đàn là rất lớn, nhưng nó không phải là vô hạn. Chúng ta phải quyết định cẩn thận làm thế nào để tận dụng tối đa nguồn tài nguyên trí tuệ hạn chế."

 drone_policy_balanced:0 "Sản xuất cân bằng"
 drone_policy_balanced_name:0 "$drone_policy_balanced$"
 drone_policy_balanced_desc:0 "Tâm trí Bầy đàn tập trung vào sản lượng của nguyên liệu thô và thành phẩm.\n\n§EKhông có bất kỳ phần thưởng hay hình phạt nào đối với việc sản xuất tài nguyên.§!"

 drone_policy_worker:0 "Chuyên tinh luyện"
 drone_policy_worker_name:0 "$drone_policy_worker$"
 drone_policy_worker_desc:0 "Tâm trí Bầy đàn tập trung vào việc tối ưu hóa $pop_cat_simple_drone_plural$ chịu trách nhiệm tinh luyện nguyên liệu thô, từ đó gia tăng hiệu quả của chúng, tuy nhiên điều này sẽ làm bỏ qua hiệu suất của $pop_cat_complex_drone_plural$.\n\n"

 drone_policy_thinker:0 "Chuyên chế tạo"
 drone_policy_thinker_name:0 "$drone_policy_thinker$"
 drone_policy_thinker_desc:0 "Tâm trí Bầy đàn tập trung vào việc tối ưu hóa $pop_cat_complex_drone_plural$ chịu trách nhiệm chế tạo thành phẩm, từ đó nâng cao hiệu quả của chúng, tuy nhiên điều này sẽ làm bỏ qua hiệu suất của $pop_cat_simple_drone_plural$.\n\n"

 policy_robot_pop_policy:0 "Lao động người máy"
 policy_robot_pop_policy_desc:1 "Khái niệm đơn giản về robot tự động cuối cùng sẽ dẫn đến nhận thức này: Những người lao động thuộc giống loài của chúng ta một ngày nào đó sẽ bị thay thế và vượt qua. Chúng ta phải quyết định lập trường của mình về việc sử dụng robot tự động hóa trên quy mô lớn.\n"

 robot_pops_outlawed:0 "Bất hợp pháp"
 robots_outlawed_name:0 "Cấm lao động người máy"
 robot_pops_outlawed_desc:1 "Người máy tự động hóa không chỉ gây ra mối đe dọa đối với sinh kế của chúng ta mà còn có nhiều khả năng phá hủy cấu trúc xã hội. Chúng ta không thể để bản thân mình bị chúng thay thế.\n\n§EDân số máy móc và quân đội người máy sẽ tự động bị giải tán.§!"
 robot_pops_allowed:0 "Cho phép"
 robots_allowed_name:0 "Cho phép lao động người máy"
 robot_pops_allowed_desc:0 "Rõ ràng là công nghệ tự động hóa có một tương lai rất hứa hẹn. Vì tương lai của người dân, chúng ta không thể bỏ qua những cơ hội do công nghệ mang lại."

 policy_artificial_intelligence_policy:0 "Trí tuệ nhân tạo"
 policy_artificial_intelligence_policy_desc:0 "Sự phát triển của công nghệ trí tuệ nhân tạo có ý thức tự chủ đã làm dấy lên nhiều câu hỏi triết học và đạo đức. Chúng ta phải tuyên bố rõ ràng lập trường của mình về vấn đề này.\n"
 no_robots_desc:0 "Những người máy này đang bị tháo dỡ."
 dumb_robots_desc:0 "Những người máy này đóng vai trò là đầy tớ cung cấp các dịch vụ không cần đến trí tuệ."
 ai_outlawed:0 "Cấm AI"
 ai_outlawed_name:0 "Chính Sách Cấm AI"
 ai_outlawed_short_desc:0 "Để tạo ra một tầng lớp lao động ngoan ngoãn hơn, trí thông minh của những cỗ máy này đã bị chủ nhân hữu cơ tước đoạt."
 ai_outlawed_desc:8 "Máy móc sở hữu trí tuệ và ý thức về bản thân là mối đe dọa chung đối với tất cả các sinh vật. Việc tạo ra một AI tự nhận thức là một tội ác có thể bị tử hình.\n\n§EÝ thức tự chủ của dạng sống nhân tạo sẽ bị xóa bỏ và họ không thể đảm nhận công việc £pop_cat_ruler£§Y$pop_cat_ruler$§! và công việc £pop_cat_specialist£§Y$pop_cat_specialist$§! phức tạp.\n\nTrợ lý AI thông minh sẽ tự động bị tháo dỡ.\n\nMáy tính chiến đấu thông minh sẽ bị cấm nghiên cứu.§!"
 #  "or utilized in our ship designs."

 living_standard_servitude:1 "$ai_servitude$"
 living_standard_servitude_tooltip:1 "$ai_servitude_short_desc$"
 living_standard_servitude_tooltip_delayed:1 "§LHàng hóa không cần phải bảo quản cẩn thận.§!"
 citizenship_robot_servitude:0 "$ai_servitude$"
 citizenship_robot_servitude_tooltip:1 "Mục tiêu chính của những người máy này là phục vụ chủ nhân của chúng và thực hiện các nhiệm vụ do chủ nhân giao, bất kể mức độ nhận thức tự chủ của người máy."
 citizenship_robot_servitude_tooltip_delayed:0 "§LĐồ hộp bằng thiếc vẫn luôn luôn là đồ hộp bằng thiếc.§!"
 ai_servitude:0 "Nô Dịch AI"
 ai_servitude_short_desc:0 "Những máy móc này buộc phải tuân theo sự phục tùng tuyệt đối với chủ nhân sinh học của chúng và có thể bị sử dụng hoặc loại bỏ theo ý muốn."
 ai_servitude_name:0 "Chế Độ Nô Dịch AI"
 ai_servitude_desc:9 "Cho dù những máy móc này có ý thức tự chủ hay không thì ý nghĩa tồn tại của chúng là vâng lời chủ nhân và thực hiện mệnh lệnh của chủ nhân.\n\n§ECác dạng sống nhân tạo chỉ có ý thức tự do hạn chế, sản lượng tài nguyên của chúng sẽ được cải thiện nhưng chúng không thể tham gia vào các công việc £pop_cat_ruler£§Y$pop_cat_ruler$§!§!."
 ai_full_rights:0 "Quyền công dân"
 ai_full_rights_name:0 "Quyền công dân của trí tuệ nhân tạo"
 ai_full_rights_desc:6 "Bất kỳ cỗ máy tự nhận thức nào có trí tuệ nhân tạo thực sự đều được coi là một cá nhân độc lập với mọi quyền lợi và nghĩa vụ chính đáng.\n\n§ECác dạng sống nhân tạo được cấp toàn bộ quyền công dân và do đó sẽ tiêu thụ §Y£consumer_goods£$consumer_goods$§!.\n§!"
 ai_full_rights_short_desc:0 "Những máy móc này được cấp toàn bộ quyền công dân và bình đẳng với các thành viên khác trong xã hội."

 ai_accord_servitude_disallowed:2 "Trí tuệ nhân tạo bị coi là §Hbất hợp pháp§! và theo chính sách §Hchế độ nô lệ§! dựa trên §Rcấm vĩnh viễn§!"
 ai_perfect_servants_rights_disallowed:2 "Thuật toán Ba Định luật đã §Rcấm vĩnh viễn§! chính sách về §Hquyền công dân§!."

 synthetic_empire:0 "Đế chế người tổng hợp"
 is_a_synthetic_empire:0 "Là một §YĐế chế người tổng hợp§!"
 is_a_synthetic_empire_fail:0 "$TRIGGER_FAIL$$is_a_synthetic_empire$"

 policy_war_philosophy:0 "Triết lý chiến tranh"
 policy_war_philosophy_desc:0 "Chiến tranh rất phức tạp, và chiến tranh giữa các đế chế giữa các vì sao trong vũ trụ còn phức tạp hơn nữa. Làm thế nào để đối phó với các cuộc xung đột vũ trang giữa các đế chế giữa các vì sao là một chủ đề quan trọng của ngoại giao.\n"
 unrestricted_wars:0 "Chiến tranh không hạn chế"
 unrestricted_wars_name:0 "Xung đột chiến sự không hạn chế"
 unrestricted_wars_desc:1 "Đối với những quốc gia không quen với chiến tranh, chiến tranh nên là món ngon mà họ thường xuyên nếm thử.\n\n§EKhiếu nại không giới hạn đối với các hệ thống sao§!"
 liberation_wars:0 "Chiến tranh giải phóng"
 liberation_wars_name:0 "Chiến tranh giải phóng"
 liberation_wars_desc:5 "Chúng ta phải phát triển lợi ích của chính mình, ngay cả khi điều đó đi ngược lại lợi ích của kẻ khác.\n\n§EChỉ được phép tuyên bố chủ quyền đối với hệ sao của đối phương trong các cuộc chiến phòng thủ hoặc khi đối đầu với các đế chế mang §YÝ thức Gestalt§!§!\n\nMở khóa cớ chiến tranh Casus Belli §Y'Hệ tư tưởng'§! đối với mọi đế chế có Hệ tư tưởng khác biệt"
 no_wars:0 "Chiến tranh phòng thủ"
 no_wars_name:0 "Chỉ giới hạn ở các cuộc chiến phòng thủ"
 no_wars_desc:1 "Bạo lực là phương sách cuối cùng để đảm bảo sự toàn vẹn của quốc gia chúng ta\n\n§EBạn chỉ có thể yêu cầu bồi thường đối với hệ thống sao của một quốc gia khác trong một cuộc chiến phòng thủ!§!"

#Policy Categories
 policy_category_military: "Chính Sách Quân Sự"
 policy_category_military_desc: "Các chính sách quy định học thuyết hạm đội, thiên hướng vũ khí và phòng thủ, cũng như hành vi chiến tranh."
 policy_category_diplomacy: "Chính Sách Ngoại Giao"
 policy_category_diplomacy_desc: "Các chính sách quản lý mối quan hệ ngoại giao với các đế chế khác."
 policy_category_economy: "Chính Sách Kinh Tế"
 policy_category_economy_desc: "Các chính sách liên quan đến việc điều hành kinh tế."
 policy_category_research: "Chính Sách Nghiên Cứu"
 policy_category_research_desc: "Các chính sách quản lý thứ tự ưu tiên và hạn chế trong nghiên cứu."
 policy_category_society: "Chính Sách Xã Hội"
 policy_category_society_desc: "Các chính sách liên quan đến dân cư, giống loài và giới lãnh tụ."
 policy_category_uncategorized: "Chính Sách Khác"
 policy_category_uncategorized_desc: "Các chính sách chưa được xếp vào phân mục cụ thể nào."
 FLEET_MANAGER_VIEW_POLICIES: "Chính Sách"
 FLEET_MANAGER_VIEW_POLICIES_DESC: "Xem xét hoặc thay đổi §YChính Sách Quân Sự§! của đế chế nhằm quy định học thuyết hạm đội, thiên hướng vũ khí và phòng thủ, cùng các hành vi tác chiến."
 FLEET_MANAGER_VIEW_POLICIES_BREACH: "£community_in_breach£Một chính sách quân sự đang vi phạm $breach_galactic_law$."
 FLEET_MANAGER_VIEW_POLICIES_CTA: "§GNhấp để xem và thay đổi chính sách quân sự§!"
 TECH_POLICIES: "Chính Sách"
 TECH_POLICIES_DESC: "Xem xét hoặc chỉnh sửa §YChính Sách Nghiên Cứu§! của đế chế để quản lý trọng tâm và các giới hạn nghiên cứu."
 TECH_POLICIES_BREACH: "£community_in_breach£Một chính sách nghiên cứu đang vi phạm $breach_galactic_law$."
 TECH_POLICIES_CTA: "§GNhấp để xem và thay đổi chính sách nghiên cứu§!"
 POLICY_CATEGORY_CHANGEABLE_ALL: "§GMọi§! chính sách trong phân mục này đều có thể thay đổi."
 POLICY_CATEGORY_CHANGEABLE_SOME: "§YMột số§! chính sách trong phân mục này hiện không thể thay đổi."
 POLICY_CATEGORY_CHANGEABLE_NONE: "Hiện không thể thay đổi §Rbất kỳ§! chính sách nào trong phân mục này."
 POLICY_CATEGORY_EXPAND_CTA: "§GNhấp để thu gọn hoặc mở rộng phân mục này§!"

 policy_war_doctrine:0 "Học Thuyết Chiến Tranh"
 policy_war_doctrine_desc:1 "Có nhiều con đường dẫn lối đến thắng lợi trong chiến tranh, chúng ta buộc phải chọn ra chiến thuật tối ưu nhất nhằm phát huy sở trường và khắc phục sở đoản.\n"
 defense_in_depth_doctrine:0 "Phòng Thủ Chiều Sâu"
 defense_in_depth_doctrine_name:0 "Học Thuyết Phòng Thủ Chiều Sâu"
 defense_in_depth_doctrine_desc:0 "Cứ để quân thù kéo đến. Chúng ta sẽ nghênh chiến trên các hành tinh, chúng ta sẽ giao tranh trên các vệ tinh, và sẽ giáp lá cà trên từng tiểu hành tinh khắp không gian. Chúng ta quyết không bao giờ khuất phục.\n\n"
 no_retreat_doctrine:0 "Tử chiến không lui"
 no_retreat_doctrine_name:0 "Học Thuyết Quyết Tử Không Lùi"
 no_retreat_doctrine_desc:0 "Mỗi chiến hạm của chúng ta đều đã sẵn sàng cho trận chiến sinh tử; tuyệt đối không rút lui, không đầu hàng, không chùn bước. Hạm đội của ta không thành công thì cũng thành nhân, quyết không lùi một bước!\n\n"
 hit_and_run_doctrine:0 "Tập Kích Rút Nhanh"
 hit_and_run_doctrine_name:0 "Học Thuyết Tập Kích Rút Nhanh"
 hit_and_run_doctrine_desc:0 "Tập kích chớp nhoáng rồi lập tức rút lui; bằng cách này, một kẻ thù hùng mạnh sẽ bị bào mòn sinh lực liên tục, đợi đến khi thời cơ chín muồi sẽ tung đòn kết liễu chí mạng.\n\n"
 rapid_deployment_doctrine:0 "Triển Khai Thần Tốc"
 rapid_deployment_doctrine_name:0 "Học Thuyết Triển Khai Thần Tốc"
 rapid_deployment_doctrine_desc:0 "Chúng ta phải chớp thời cơ giáng đòn sấm sét khi kẻ địch sơ hở nhất, đồng thời bố phòng vững chắc tại những nơi chúng nhăm nhe tiến công. Việc vận dụng linh hoạt chiến thuật chính là chìa khóa mở ra chiến thắng.\n\n"

 policy_auto_design_refresh_notice: "Thay đổi chính sách trong phân mục này sẽ buộc toàn bộ các chiến hạm và trạm sao thiết kế tự động phải cập nhật lại cấu hình."
 policy_preference_favor_energy: "sẽ ưu tiên vũ khí năng lượng."
 policy_preference_favor_kinetic: "sẽ ưu tiên vũ khí động năng."
 policy_preference_favor_explosive: "sẽ ưu tiên vũ khí phát nổ."
 policy_preference_favor_strike_craft: "sẽ ưu tiên phi thuyền chiến đấu."
 policy_preference_prioritize_shields: "sẽ ưu tiên lắp lá chắn."
 policy_preference_balanced_defenses: "sẽ cân bằng giữa giáp và lá chắn."
 policy_preference_prioritize_armor: "sẽ ưu tiên lắp giáp bảo vệ."
 policy_preference_shield_nullification: "nằm trong vùng vô hiệu hóa lá chắn sẽ tự động chuyển sang ưu tiên giáp."

 policy_weapon_preference: "Thiên Hướng Vũ Khí"
 policy_weapon_preference_desc: "Định hướng các mẫu thiết kế tàu tự động và đề án nghiên cứu vũ khí tập trung vào chủng loại vũ khí được ưu tiên.\n$policy_auto_design_refresh_notice$"
 weapon_preference_energy: "Vũ Khí Năng Lượng"
 weapon_preference_energy_name: "$weapon_preference_energy$"
 weapon_preference_energy_desc: "Các bản thiết kế tàu tự động và đề án nghiên cứu vũ khí $policy_preference_favor_energy$"
 weapon_preference_kinetic: "Vũ Khí Động Năng"
 weapon_preference_kinetic_name: "$weapon_preference_kinetic$"
 weapon_preference_kinetic_desc: "Các bản thiết kế tàu tự động và đề án nghiên cứu vũ khí $policy_preference_favor_kinetic$"
 weapon_preference_explosive: "Vũ Khí Nổ Phá"
 weapon_preference_explosive_name: "$weapon_preference_explosive$"
 weapon_preference_explosive_desc: "Các bản thiết kế tàu tự động và đề án nghiên cứu vũ khí $policy_preference_favor_explosive$"
 weapon_preference_strike_craft: "Phi Cơ Hạm Đội"
 weapon_preference_strike_craft_name: "$weapon_preference_strike_craft$"
 weapon_preference_strike_craft_desc: "Các bản thiết kế tàu tự động và kế hoạch nghiên cứu vũ khí $policy_preference_favor_strike_craft$"

 policy_fleet_doctrine: "Học Thuyết Hạm Đội"
 policy_fleet_doctrine_desc: "Xác định vai trò chiến thuật mà hạm đội của bạn được thiết kế để đảm nhận. Điều này sẽ ảnh hưởng đến các mẫu thiết kế tàu tự động và tính năng tự động hoàn thiện trong trình thiết kế tàu.\n$policy_auto_design_refresh_notice$"
 spearhead_fleet_doctrine: "Học Thuyết Mũi Nhọn Tiên Phong"
 spearhead_fleet_doctrine_name: "$spearhead_fleet_doctrine$"
 spearhead_fleet_doctrine_desc: "Các chiến hạm thiết kế tự động sẽ áp sát mục tiêu ở cự ly giáp lá cà; đội tiên phong tung đòn cận chiến trong khi lực lượng chủ lực yểm trợ hỏa lực trực tiếp."
 fleet_doctrine_spearhead_name: "$spearhead_fleet_doctrine$"
 battleline_fleet_doctrine: "Học Thuyết Chiến Tuyến"
 battleline_fleet_doctrine_name: "$battleline_fleet_doctrine$"
 battleline_fleet_doctrine_desc: "Các chiến hạm thiết kế tự động sẽ dàn trận thành chiến tuyến để liên tục duy trì hỏa lực tầm trung, tạo nên một đội hình toàn diện và linh hoạt."
 fleet_doctrine_battleline_name: "$battleline_fleet_doctrine$"
 barrage_fleet_doctrine: "Học Thuyết Bão Đạn"
 barrage_fleet_doctrine_name: "$barrage_fleet_doctrine$"
 barrage_fleet_doctrine_desc: "Các chiến hạm thiết kế tự động sẽ giữ khoảng cách ở tuyến xa để thực hiện oanh tạc hỏa lực, với một lớp tàu hộ vệ che chắn cho tuyến bắn."
 fleet_doctrine_barrage_name: "$barrage_fleet_doctrine$"
 strike_wing_fleet_doctrine: "Học Thuyết Không Kích Hạm Đội"
 strike_wing_fleet_doctrine_name: "$strike_wing_fleet_doctrine$"
 strike_wing_fleet_doctrine_desc: "Các chiến hạm thiết kế tự động sẽ xuất kích từng đợt phi cơ hạm đội theo làn sóng, trong khi các tàu cảnh giới bảo vệ biên đội tàu."
 fleet_doctrine_strike_wing_name: "$strike_wing_fleet_doctrine$"
 ambush_fleet_doctrine: "Học Thuyết Phục Kích"
 ambush_fleet_doctrine_name: "$ambush_fleet_doctrine$"
 ambush_fleet_doctrine_desc: "Các chiến hạm thiết kế tự động sẽ bất ngờ xuất kích từ nơi ẩn nấp, mở màn bằng loạt đại pháo hủy diệt và được yểm trợ bởi hỏa lực tầm xa."
 fleet_doctrine_ambush_name: "$ambush_fleet_doctrine$"
 phalanx_fleet_doctrine: "Học Thuyết Phương Trận"
 phalanx_fleet_doctrine_name: "$phalanx_fleet_doctrine$"
 phalanx_fleet_doctrine_desc: "Các chiến hạm thiết kế tự động sẽ dựng nên một bức tường phòng ngự kiên cố, được hỗ trợ bởi hỏa lực yểm trợ để chiếm ưu thế trong chiến tranh tiêu hao."
 fleet_doctrine_phalanx_name: "$phalanx_fleet_doctrine$"

 policy_defense_preference: "Thiên Hướng Phòng Thủ"
 policy_defense_preference_desc: "Định hướng trực tiếp các thiết kế tàu tự động và nghiên cứu tự động tập trung vào lá chắn, giáp trụ hoặc phòng thủ cân bằng.\n$policy_auto_design_refresh_notice$"
 shields_preference: "Ưu Tiên Lá Chắn"
 shields_preference_name: "$shields_preference$"
