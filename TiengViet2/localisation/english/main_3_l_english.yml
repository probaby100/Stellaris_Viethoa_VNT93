 city_space_age_industry_1_desc: "Thành phố này được xây nên từ polymer, thép và lòng kiên định, đặt nền móng cho quá trình vươn tới các vì sao. Có thể nó thiếu đi sự đẹp đẽ, nhưng nó luôn làm tốt việc của mình."
 city_colony_1_desc: "Vạn sự khởi đầu nan đối với mọi thuộc địa, nhưng chỉ cần cố gắng là sẽ vượt qua."
 city_industrial_1_desc: "Thành phố này luôn tìm cách xoay xở giữa nhu cầu thời chiến và thời bình."
 city_foundry_1_desc: "Tiếng ồn ào từ xưởng đúc chỉ cách vài dãy nhà. Mọi người đều ngủ không ngon, nhưng ít ra thì chỗ làm cũng ngay sát vách."
 city_factory_1_desc: "Một mô hình sản xuất tại gia, kết hợp giữa nhà ở và xưởng làm việc."
 city_research_1_desc: "Trong thành phố này, ranh giới giữa khu dân cư và phòng thí nghiệm đã gần như biến mất."
 city_fortress_1_desc: "Đây là ngôi nhà chung của cả người lính và dân thường."
 city_bureaucracy_1_desc: "Các trung tâm hành chính nằm rải rác giữa những dãy căn hộ, đây chính là cỗ máy vận hành trơn tru của đế chế."
 city_temple_1_desc: "Thánh địa của những người có đạo, nơi tiếng thánh ca vang vọng khắp các con phố."
 city_trade_1_desc: "Không gian tích hợp giữa buôn bán và nhà ở."

 city_bureaucracy_trade_1_desc: "Khi mọi mánh khóe giao dịch đều bị soi xét và mọi sổ sách đều có người kiểm tra, thị trường tự khắc sẽ phất lên."
 city_temple_trade_1_desc: "Tiền bạc rủng rỉnh là minh chứng cho lộc trời cho."
 city_fortress_bureaucracy_1_desc: "Một nơi vừa để ra lệnh, đóng mộc đỏ, vừa kiên cố như pháo đài. Để giữ an toàn, không chỉ cần nắm đấm mà còn cần cả kẹp tài liệu."
 city_fortress_temple_1_desc: "Nơi đây, đức tin được trang bị vũ khí, và lực lượng vũ trang cũng một lòng tin tưởng."
 city_fortress_trade_1_desc: "Tiền tệ của thành phố này chính là các hợp đồng quốc phòng, và định nghĩa 'cung cầu' ở đây bao gồm cả đạn dược."
 city_research_fortress_1_desc: "Một trung tâm được canh gác kỹ lưỡng, nơi dân làm khoa học và lính tráng hợp tác để tạo ra những món quà chết chóc cho kẻ địch."
 city_research_bureaucracy_1_desc: "Các cố vấn, người phân tích dữ liệu và những chuyên gia thống kê mặt lạnh như tiền tụ họp tại đây, biến việc quản lý thành một bộ môn khoa học đong đếm được."
 city_research_temple_1_desc: "Đây là một chốn tìm tòi học hỏi có quy củ nghiêm ngặt, nơi niềm tin siêu hình và khoa học thực tế chung sống êm đẹp."
 city_research_trade_1_desc: "Sự kết hợp ăn ý giữa phòng thí nghiệm và phòng họp, nơi dẫn dắt sự đổi mới không phải là chân lý, mà là báo cáo lãi lỗ hàng quý."
 city_foundry_research_1_desc: "Một thành phố chú trọng thực dụng, nơi tay nghề luyện kim liên tục được đập đi xây lại, thử nghiệm và làm cho tốt hơn."
 city_foundry_fortress_1_desc: "Một pháo đài nơi súng đạn và khiên chắn hòa làm một."
 city_foundry_bureaucracy_1_desc: "Mạch máu của hậu cần quân sự chính là đám bàn giấy."
 city_foundry_temple_1_desc: "Những nghi lễ thiêng liêng được khắc lên thép, sự trừng phạt của thánh thần giáng xuống cùng nhịp búa máy."
 city_foundry_trade_1_desc: "Hợp kim được đúc thành tiền và hợp đồng. Một thành phố mà tốc độ chốt đơn bán thép nhanh ngang ngửa tốc độ đúc ra nó."
 city_factory_research_1_desc: "Bản vẽ và những phát minh mới quấn lấy nhau. Mọi phát hiện hay ho đều nhanh chóng được chốt bản quyền, đóng gói và đem bán với đủ loại màu sắc."
 city_factory_fortress_1_desc: "Phía sau mỗi người lính giỏi đều có một thiết bị y tế xịn xò, và những thứ này không tự nhiên mà từ trên trời rơi xuống."
 city_factory_bureaucracy_1_desc: "Sự kết hợp giữa giấy tờ lằng nhằng và sản xuất ồ ạt. Nơi đẻ ra các mẫu đơn điền tay làm thành bốn bản."
 city_factory_temple_1_desc: "Nến, tượng thánh và các thánh tích được chứng nhận - tất cả đều được ra lò với quy trình kiểm duyệt chất lượng không tì vết."
 city_factory_trade_1_desc: "Sản xuất hàng loạt đi đôi với cắm đầu mua sắm hàng loạt."
 city_industrial_foundry_1_desc: "Một cỗ máy sản xuất gầm rú như sấm chớp."
 city_industrial_factory_1_desc: "Hiệu suất là tôn chỉ của pháo đài công nghiệp này. Không vứt bỏ một con ốc nào, không để một người thợ nào được rảnh tay."
 city_industrial_research_1_desc: "Một nửa là nhà máy, một nửa là phòng thí nghiệm, nơi đây không chỉ đẻ ra ý tưởng mới - mà còn trực tiếp nặn ra chúng."
 city_industrial_fortress_1_desc: "Ngọn lửa của việc làm ăn và việc đánh đấm tỏa sáng nhịp nhàng tại nơi này."
 city_industrial_bureaucracy_1_desc: "Mỗi thùng hàng đều có mã vạch, và mỗi cỗ máy đều có giấy xin phép đóng mộc đỏ."
 city_industrial_temple_1_desc: "Những mái nhọn của nhà thờ và ống khói nhà máy cùng vươn cao tít tắp đến tận cổng trời."
 city_industrial_trade_1_desc: "Tiếng ồn ào của việc sản xuất hòa vào những lời rầm rì toan tính chuyện buôn bán."
 city_research_bureaucracy_industrial_1_desc: "Hàng hóa đủ loại, xưởng máy kề nhau, không thiếu nghề gì. Những khu đô thị lõi này ôm trọn mọi thứ."
 city_research_bureaucracy_foundry_1_desc: "Khu luyện kim quy mô lớn được chạy bằng dữ liệu khổng lồ."
 city_research_bureaucracy_factory_1_desc: "Xã hội được nặn ra từ vật chất. Mỗi món đồ do các xưởng này làm ra đều để gắn kết mọi người thông qua cảm giác thân quen."
 city_research_bureaucracy_research_1_desc: "Chính sách quản lý dân làm khoa học, và khoa học lại giúp đẻ ra chính sách mới. Đây là một vòng lẩn quẩn tự vỗ béo của giới chuyên môn."
 city_research_bureaucracy_fortress_1_desc: "Đây là pháo đài của những mô hình dự báo và ghi chép chiến thuật. Trận đánh thực sự nổ ra ở ngay đây - trên các màn hình 3D và bảng trắng."
 city_research_bureaucracy_bureaucracy_1_desc: "Việc cai quản thành phố được tính toán và chia ngăn kỹ lưỡng, thi thoảng cũng được lôi ra xài thử."
 city_research_bureaucracy_trade_1_desc: "Một chỗ mà kiến thức được mua bán như tiền mặt. Cứ có góc nhìn sâu sắc là có thể đem ra ngã giá."
 city_research_temple_industrial_1_desc: "Mục đích thì khác nhau, nhưng lại tìm đến nhau nhờ có chung một linh hồn."
 city_research_temple_foundry_1_desc: "Những xưởng máy được trời thương, rèn ra hợp kim từ trong các buổi hành lễ."
 city_research_temple_factory_1_desc: "Minh chứng cho thấy sự đồng điệu tâm hồn cũng có thể làm ra được hàng loạt."
 city_research_temple_research_1_desc: "Khi tri thức trở thành một chuyến đi thiêng liêng, thì việc giác ngộ và nghiên cứu chỉ là một."
 city_research_temple_fortress_1_desc: "Đức tin vững vàng đã củng cố những bức tường thành nơi đây. (Và cả những đột phá khoa học mới nhất nữa.)"
 city_research_temple_temple_1_desc: "Việc đặt câu hỏi ở đây là điều thiêng liêng, và kiến thức là nấc thang để siêu thoát."
 city_research_temple_trade_1_desc: "Đây là nơi giao thương sòng phẳng và chi tiền mua sắm trung thành nhờ có đức tin. Những lời cầu nguyện dẫn lối đến sự giàu sang."

 zone_research_unity: "Cục Lưu trữ"
 zone_research_unity_desc: "Đây là một chốn yên tĩnh, nơi ký ức hóa thành lịch sử - được đánh mục lục và niêm phong thành sách cho đời sau."
