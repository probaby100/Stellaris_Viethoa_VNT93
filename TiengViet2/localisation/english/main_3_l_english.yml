 policy_food_stockpiling:0 "Dự Trữ Lương Thực"
 policy_food_stockpiling_desc:0 "Để quy hoạch hợp lý lộ trình phát triển của đế chế liên sao, chúng ta buộc phải tận dụng lượng lương thực thặng dư nhằm đáp ứng tốt nhất nhu cầu của cư dân.\n"
 food_stockpiling_machine:0 "Không"
 food_stockpiling_machine_name:0 "Không Dự Trữ"
 food_stockpiling_machine_desc:0 "Chúng ta là những cỗ máy hoàn hảo và bất tử."
 food_stockpiling_1:0 "Tối Thiểu"
 food_stockpiling_1_name:0 "Dự Trữ Tối Thiểu"
 food_stockpiling_1_desc:0 "Duy trì kho dự trữ lương thực ở mức tối thiểu để dồn tài lực hỗ trợ tối đa cho đà tăng trưởng dân số.\n\n"
 food_stockpiling_2:0 "Cân Bằng"
 food_stockpiling_2_name:0 "Dự Trữ Cân Bằng"
 food_stockpiling_2_desc:0 "Phương án dự trữ cân bằng cho phép chúng ta vừa tận dụng lương thực thặng dư để thúc đẩy gia tăng dân số, vừa dự phòng một lượng tồn kho đầy đủ để ứng phó với các tình huống bất trắc.\n\n"
 food_stockpiling_3:0 "Quy Mô Lớn"
 food_stockpiling_3_name:0 "Dự Trữ Quy Mô Lớn"
 food_stockpiling_3_desc:0 "Họa phúc khôn lường. Phương án dự trữ lương thực tối đa sẽ giúp dân số của ta bình an vượt qua mọi biến cố ngặt nghèo.\n\n"
 ONLY_SERVITORS_STOCKPILE_FOOD:0 "$TRIGGER_FAIL$Chỉ có §H$civic_machine_servitor$§! mới có thể dự trữ £food£ §H$food$§!."


 policy_war_economy:0 "Kinh Tế Thời Chiến"
 policy_war_economy_desc:0 "Trong thời khắc chiến tranh phòng vệ sống còn, chúng ta sẽ trưng thu tài sản từ các khu vực dân sự để bù đắp những tổn thất kinh tế và công nghiệp quốc phòng. Điểm bất lợi của chính sách này là sau khi chiến thắng trong các cuộc chiến xâm lược, ta sẽ phải gánh chịu mức phạt tương ứng...\n"
 static_we:0 "Tĩnh Tại"
 static_we_name:0 "Kinh Tế Thời Chiến Tĩnh Tại"
 static_we_desc:0 "Kinh tế thời chiến tĩnh tại hoàn toàn không bị ảnh hưởng bởi biến động cục diện chiến trường. Điểm số chiến tranh hiện tại cũng không tác động đến thời gian và chi phí sản xuất."
 semi_static_we:0 "Bán Tĩnh"
 semi_static_we_name:0 "Kinh Tế Thời Chiến Bán Tĩnh"
 semi_static_we_desc:0 "Kinh tế thời chiến bán tĩnh cho phép nhân danh bảo vệ nền độc lập của đế chế để trưng thu một lượng tài sản hạn chế từ các phân khu dân sự trong suốt cuộc chiến phòng vệ, nhưng sau khi giành thắng lợi trong các cuộc chiến xâm lược, hiệu quả sản xuất sẽ phải chịu mức phạt tương ứng.\n\n§HChiến tranh phòng vệ:§!\nHiệu suất sản xuất quân sự: §G+30%§! khi điểm chiến tranh ở mức §R-100§!\n\n§HChiến tranh xâm lược:§!\nHiệu suất sản xuất quân sự: §R-30%§! khi điểm chiến tranh ở mức §G100§!"
 versatile_we:0 "Cân Bằng"
 versatile_we_name:0 "Kinh Tế Thời Chiến Cân Bằng"
 versatile_we_desc:1 "Nếu áp dụng kinh tế thời chiến cân bằng, khi cuộc chiến phòng vệ rơi vào thế thất bại, ta sẽ nhận được lượng thưởng sản xuất khổng lồ, nhưng khi thắng trong chiến tranh xâm lược sẽ phải gánh chịu mức tổn hại hiệu quả tương ứng.\n\n§HChiến tranh phòng vệ:§!\nHiệu suất sản xuất quân sự: §G+60%§! khi điểm chiến tranh ở mức §R-100§!\n\n§HChiến tranh xâm lược:§!\nHiệu suất sản xuất quân sự: §R-60%§! khi điểm chiến tranh ở mức §G100§!"
 dynamic_we:0 "Động Thái"
 dynamic_we_name:0 "Kinh Tế Thời Chiến Động Thái"
 dynamic_we_desc:1 "Nếu áp dụng kinh tế thời chiến động thái, sau khi thất thế trong chiến tranh phòng vệ, ta sẽ nhận được phần thưởng sản xuất cực lớn, nhưng khi giành thắng lợi trong cuộc chiến xâm lược sẽ phải chịu tổn hại hiệu quả tương ứng.\n\n§HChiến tranh phòng vệ:§!\nHiệu suất sản xuất quân sự: §G+45%§! khi điểm chiến tranh ở mức §R-100§!\n\n§HChiến tranh xâm lược:§!\nHiệu suất sản xuất quân sự: §R-45%§! khi điểm chiến tranh ở mức §G100§!"

