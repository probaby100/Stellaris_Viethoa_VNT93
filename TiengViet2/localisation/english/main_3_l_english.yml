 POLICY_CANNOT_CHANGE:0 "Chúng ta sẽ không thể thay đổi lập trường về chính sách này trong vòng $YEARS|H$ năm tới."
 CHANGE_POLICY:0 "Thay đổi chính sách"
 POLICY_NOT_ACTIVE:0 "Cần chính sách:"
 POLICY_DIALOG:0 "Bạn có dự định thay đổi chính sách $POLICY|H$ trong đế chế của chúng ta thành $OPTION|H$ không? Một khi có hiệu lực, chúng ta sẽ không thể thay đổi chính sách này trong vòng $TIME|Y$ năm. Chính sách này sẽ mang lại những hiệu quả sau:\n$EFFECTS$"
 POLICY_GROUP_TOOLTIP:1 "§T$GROUP|H$\n$GROUP_DESC$\nChính sách hiện tại: $OPTION|Y$§!\n\n§GNhấp để xem các lựa chọn liên quan của chính sách§!"
 POLICY_OPTION_TOOLTIP_POP_HAPPINESS:0 "\n$NUM|H$ dân số sẽ được hưởng lợi từ chính sách này, làm tăng $MOD$ hạnh phúc."
 POLICY_SELECT_OPTION:0 "\n§GNhấp để chọn các tùy chọn liên quan của chính sách§!"
 ALL_POPS_EMANCIPATED:0 "§EToàn bộ dân số trong đế chế của bạn sẽ được giải phóng§!"
 ALL_ROBOTS_DISASSEMBLED:0 "§EToàn bộ dân số người máy trong đế chế của bạn sẽ bị tháo dỡ§!"
 CLICK_POLICY_VIEW:0 "§GNhấp để xem danh sách các sắc lệnh đế chế có sẵn.§!"

 policy_pre_sapients:0 "Giống loài chưa khai hóa"
 policy_pre_sapients_desc: "Chúng ta có thể quyết định xem có cho phép những giống loài chưa khai hóa sống trên các hành tinh thuộc về chúng ta hay không."
 pre_sapients_allow:1 "Khoan dung"
 pre_sapients_allow_name:4 "Khoan dung giống loài chưa khai hóa"
 pre_sapients_allow_desc: "Dù động vật có thông minh đến đâu thì chúng vẫn chỉ là động vật. Việc phớt lờ chúng sẽ không gây ra mối nguy hiểm nào."
 pre_sapients_protect:0 "Được bảo vệ"
 pre_sapients_protect_name:0 "Bảo vệ giống loài chưa khai hóa"
 pre_sapients_protect_desc:3 "Dẫu chỉ là những loài vật đơn thuần, chúng cũng chẳng hề hạ đẳng hơn tổ tiên của chúng ta khi xưa. Chúng ta nên tiến hành bảo vệ chúng.\n\n§ESinh vật chưa khai hóa không thể bị thanh lọc có chọn lọc, hành tinh có sinh vật chưa khai hóa không thể tiến hành cải tạo địa hình.\n\nCó thể xây dựng sở thú ngoại lai trên hành tinh có sinh vật chưa khai hóa.§!\n\n§RViệc thay đổi chính sách này sẽ dỡ bỏ các sở thú ngoại lai trên hành tinh không có tài nguyên $d_alien_pets_deposit$ hoặc không có gia súc sinh sống.§!"
 pre_sapients_purge:0 "Tuyệt diệt"
 pre_sapients_purge_name:3 "Tuyệt diệt giống loài chưa khai hóa"
 pre_sapients_purge_desc: "Chỉ những sinh vật có lý trí mới xứng đáng có quyền lợi. Động vật chỉ là động vật, và những con vật ngáng đường chúng ta chính là những loài gây hại.\n\n§ETất cả giống loài chưa khai hóa sống trên các hành tinh của chúng ta sẽ bị thanh lọc§!"
 pre_sapients_eat:1 "Săn bắn"
 pre_sapients_eat_name:1 "Săn bắn giống loài chưa khai hóa"
 pre_sapients_eat_desc: "Các loài vật không có trí tuệ hoàn toàn không được coi là một phần của đế chế chúng ta, nhưng chúng có lẽ vẫn có thể thúc đẩy sự phát triển của chúng ta dưới một hình thức khác...\n\n§EGiống loài chưa khai hóa cư trú trên hành tinh của chúng ta sẽ bị làm thành thức ăn, số lượng của chúng sẽ giảm dần.§!"

 policy_core_worlds:0 "Dân số thế giới cốt lõi"
 policy_core_worlds_desc:0 "Chúng ta có thể quyết định xem dân số nào được phép sống tại các thế giới cốt lõi của chúng ta. Những nhóm người vốn đã sống ở thế giới cốt lõi nhưng giờ đây lại bị cấm sẽ bị buộc phải chuyển đến các hành tinh nằm trong khu vực không gian của chúng ta hoặc trốn sang các đế chế khác."
 core_worlds_all:0 "Tất cả giống loài"
 core_worlds_all_name:0 "Tất cả giống loài"
 core_worlds_all_desc:0 "Sự đa dạng là chìa khóa của phát triển. Các thế giới cốt lõi của chúng ta phải làm nổi bật những giá trị của chúng ta, vì vậy chúng phải mở cửa cho tất cả các giống loài trong đế chế.\n\n§ETất cả dân số đều được phép cư trú tại thế giới cốt lõi§!"
 core_worlds_citizens_and_slaves:0 "Chỉ dành cho quyền công dân trọn vẹn và nô lệ"
 core_worlds_citizens_and_slaves_name:0 "Chỉ dành cho quyền công dân trọn vẹn và nô lệ"
 core_worlds_citizens_and_slaves_desc:0 "Mặc dù các thế giới cốt lõi của chúng ta cần phải tránh xa ảnh hưởng từ các giống loài ngoại lai, nhưng chúng ta không thể từ chối tài sản hợp pháp của công dân nước mình.\n\n§EDân số không phải là nô lệ và không có quyền công dân trọn vẹn sẽ bị trục xuất khỏi thế giới cốt lõi§!"
 core_worlds_citizens_only:0 "Chỉ dành cho quyền công dân trọn vẹn"
 core_worlds_citizens_only_name:0 "Chỉ dành cho quyền công dân trọn vẹn"
 core_worlds_citizens_only_desc:0 "Thế giới cốt lõi là trái tim của đế chế chúng ta. Không được phép để những giống loài thấp kém cư ngụ tại đây.\n\n§ENhững người không có quyền công dân trọn vẹn sẽ bị đuổi khỏi các thế giới cốt lõi§!"

 policy_refugees:0 "Người tị nạn"
 policy_refugees_desc:0 "Chúng ta có thể quyết định xem có nên tiếp nhận hay từ chối những người tị nạn đang chạy trốn khỏi cuộc thanh lọc, di dời bắt buộc hoặc bức hại chính trị."
 refugees_not_allowed:0 "Không tiếp nhận người tị nạn"
 refugees_not_allowed_name:0 "$refugees_not_allowed$"
 refugees_not_allowed_desc:0 "Mở cửa biên giới cho những cặn bã của các xã hội khác sẽ chỉ làm hỏng quốc gia của chúng ta.\n\n§ENgười tị nạn từ các đế chế khác không thể tiến vào đế chế của phe ta§!"
 refugees_only_citizens:0 "Chỉ dành cho giống loài có quyền công dân trọn vẹn"
 refugees_only_citizens_name:0 "$refugees_only_citizens$"
 refugees_only_citizens_desc:0 "Chúng ta không thể để lòng thương xót lấn át lý trí. Chỉ những ai mang lại giá trị nhất định cho xã hội mới được đưa vào trong biên giới của chúng ta.\n\n§ENgười tị nạn có quyền công dân trọn vẹn từ các đế chế khác mới có thể bước vào đế chế của phe ta§!"
 refugees_allowed:0 "Chào đón người tị nạn"
 refugees_allowed_name:0 "$refugees_allowed$"
 refugees_allowed_desc:0 "Những người chạy trốn khỏi cái chết và bàn tay bức hại của kẻ độc tài đáng được chào đón vào lãnh thổ nước ta.\n\n§ENgười tị nạn từ các đế chế khác có thể sẽ đến đế chế của chúng ta§!"

 policy_debris:0 "Mảnh vỡ"
 policy_debris_desc:0 "Chúng ta có thể quyết định nghiên cứu hoặc trục vớt mảnh vỡ từ hạm đội của đối phương."
 research_debris:0 "Nghiên cứu mảnh vỡ"
 research_debris_name:0 "$research_debris$"
 research_debris_desc:0 "Chúng ta sẽ nghiên cứu công nghệ của địch dựa trên phần còn sót lại từ những con tàu của chúng."
 scavenge_debris:0 "Trục vớt mảnh vỡ"
 scavenge_debris_name:0 "$scavenge_debris$"
 scavenge_debris_desc:0 "Chúng ta sẽ thu hồi tài nguyên từ tàn tích của tàu địch."
 scavenge_and_research_debris:0 "Nghiên cứu và trục vớt mảnh vỡ"
 scavenge_and_research_debris_name:0 "$scavenge_and_research_debris$"
 scavenge_and_research_debris_desc:0 "§Y$civic_scavengers$§! cho phép chúng ta vừa nghiên cứu mảnh vỡ vừa thu hồi tài nguyên."

 policy_population_controls:0 "Kiểm soát dân số"
 policy_population_controls_desc:0 "Chúng ta có thể quyết định xem việc kiểm soát dân số có chọn lọc có hợp pháp trong đế chế của chúng ta hay không."
 population_controls_not_allowed:0 "Cấm"
 population_controls_not_allowed_name:0 "Cấm kiểm soát dân số"
 population_controls_not_allowed_desc:1 "Sinh sản và duy trì nòi giống là quyền cơ bản của mỗi công dân.\n\n§EKHÔNG thể áp dụng các biện pháp kiểm soát dân số không tự nguyện đối với giống loài/hành tinh§!\n§EKHÔNG thể tăng/giảm dân số của giống loài một cách có chọn lọc§!"
 population_controls_allowed:0 "Cho phép"
 population_controls_allowed_name:0 "Cho phép kiểm soát dân số"
 population_controls_allowed_desc:11 "Dữ liệu dân số học dài hạn quá đỗi quan trọng để có thể giao phó hoàn toàn cho các cá nhân.\n\n§ECÓ THỂ áp dụng các biện pháp kiểm soát dân số không tự nguyện đối với giống loài và hành tinh§!\n§ECÓ THỂ tăng/giảm dân số của giống loài một cách có chọn lọc§!"

 policy_slavery:0 "Đạo Luật Nô Lệ"
 policy_slavery_desc:1 "Chúng ta có thể quyết định xem chế độ nô lệ có hợp pháp trong đế chế của chúng ta hay không."
 slavery_not_allowed:0 "Cấm"
 slavery_not_allowed_name:0 "Nghiêm Cấm Nô Lệ"
 slavery_not_allowed_desc:0 "Bắt làm nô lệ những sinh vật có trí tuệ là một tội ác, đế chế của chúng ta tuyệt đối không thể cho phép hành vi này.\n\n§EKHÔNG thể bắt người dân làm nô lệ§!"
 slavery_allowed_xenos_only:0 "Chỉ Dị Chủng"
 slavery_allowed_xenos_only_name:0 "Chỉ Cho Phép Nô Dịch Dị Chủng"
 slavery_allowed_xenos_only_desc:1 "Đế chế của chúng ta cho phép bắt các giống loài khác ngoài chúng ta làm nô lệ.\n\n§ECÓ THỂ bắt các giống loài khác làm nô lệ§!"
 slavery_allowed_regulated:1 "Bị quản chế"
 slavery_allowed_regulated_name:1 "Đạo Luật Nô Lệ Có Kiểm Soát"
 slavery_allowed_regulated_desc:2 "Áp dụng chế độ nô lệ không phân biệt đối với mọi dân số, đồng thời đảm bảo môi trường làm việc bình đẳng và tương đối công bằng.\n\n§ECó thể bắt bất kỳ ai làm nô lệ, nhưng hiệu suất sẽ giảm§!"
 slavery_allowed_regulated_xenos_only:1 "Nô dịch giống loài khác bị quản chế"
 slavery_allowed_regulated_xenos_only_name:1 "Đạo Luật Nô Lệ Dị Chủng Có Kiểm Soát"
 slavery_allowed_regulated_xenos_only_desc:2 "Đế chế cho phép bắt các giống loài khác ngoài chúng ta làm nô lệ, nhưng phải đảm bảo môi trường làm việc tương đối tốt.\n\n§ECó thể bắt các giống loài khác làm nô lệ, nhưng hiệu suất sẽ giảm§!"
 slavery_allowed:0 "Cho phép"
 slavery_allowed_name:0 "Cho Phép Nô Lệ"
 slavery_allowed_desc:0 "Cho phép áp dụng chế độ nô lệ lên dân cư trong lãnh thổ đế chế.\n\n§ECÓ THỂ bắt người dân làm nô lệ§!"

 policy_slavery_procreation:1 "Đạo Luật Sinh Sản Của Nô Lệ"
 policy_slavery_procreation_desc:0 "Chúng ta có thể quyết định xem nô lệ có được phép sinh sản hay không."
 slavery_procreation_allowed:0 "Cho phép"
 slavery_procreation_allowed_name:0 "Cho Phép Nô Lệ Sinh Sản"
 slavery_procreation_allowed_desc:0 "Cho phép nô lệ sinh sản. Con cháu của nô lệ cũng sẽ tự động trở thành nô lệ."
 slavery_procreation_not_allowed:0 "Không cho phép"
 slavery_procreation_not_allowed_name:0 "Cấm Nô Lệ Sinh Sản"
 slavery_procreation_not_allowed_desc:0 "Không cho phép nô lệ sinh sản"

 policy_purge:0 "Chính Sách Thanh Trừng"
 policy_purge_desc:0 "Những người bị thanh lọc sẽ không thể làm việc và cuối cùng sẽ chết, nhưng quá trình này sẽ chọc giận họ và bất kỳ ai có lòng trắc ẩn.\n"
 purge_not_allowed:0 "Cấm"
 purge_not_allowed_name:0 "Cấm Thanh Trừng"
 purge_not_allowed_desc:1 "Thanh lọc sẽ luôn bị coi là một hành động tàn ác.\n\n§EKHÔNG THỂ tiến hành thanh lọc§!"
 purge_allowed_xenos_only:0 "Chỉ Dị Chủng"
 purge_allowed_xenos_only_name:0 "Chỉ Thanh Trừng Dị Chủng"
 purge_allowed_xenos_only_desc:1 "Chúng ta phải cho phép áp dụng các phương pháp hiệu quả để kiềm chế sự gia tăng số lượng của những sinh vật thấp kém trong đế chế.\n\n§ECÓ THỂ tiến hành thanh lọc dân số đối với các giống loài khác§!"
 purge_allowed:0 "Cho phép"
 purge_allowed_name:0 "Cho Phép Thanh Trừng"
 purge_allowed_desc:0 "Đế chế phải thanh lọc những phần tử gây bất ổn và mục nát để ngăn chặn chúng gây ảnh hưởng xấu đến chúng ta.\n\n§ECÓ THỂ thanh lọc và trục xuất bất kỳ dân số nào§!"
 purge_displacement_only:0 "Chỉ dành cho trục xuất"
 purge_displacement_only_name:0 "$purge_displacement_only$"
 purge_displacement_only_desc:0 "Những kẻ có ý đồ phá hoại sự hài hòa không còn thuộc về dân tộc ta nữa. Hãy để chúng tự sinh tự diệt bên ngoài lãnh thổ của chúng ta.\n\n§ECÓ THỂ trục xuất dân số§!"

 policy_orbital_bombardment:0 "Oanh tạc quỹ đạo"
 policy_orbital_bombardment_desc:2 "Oanh tạc quỹ đạo cho phép chúng ta tiêu diệt lực lượng phòng thủ trên bề mặt hành tinh từ ngoài không gian. Các phương thức oanh tạc tàn khốc hơn có thể sát thương dân số trên hành tinh và phá hủy các công trình.\n"
 orbital_bombardment_selective:0 "Có chọn lọc"
 orbital_bombardment_selective_name:0 "Oanh tạc quỹ đạo có chọn lọc"
 orbital_bombardment_selective_desc:0 "Chỉ cho phép ném bom vào các mục tiêu quân sự đã được xác định, đồng thời giảm thiểu thương vong dân sự đến mức tối đa.\n\n§EChỉ có thể sử dụng phương thức oanh tạc quỹ đạo 'Có chọn lọc'.§!"

 orbital_bombardment_indiscriminate:0 "Không phân biệt"
 orbital_bombardment_indiscriminate_name:0 "Oanh tạc quỹ đạo không phân biệt"
 orbital_bombardment_indiscriminate_desc:0 "Cho phép sử dụng tất cả các loại vũ khí oanh tạc quỹ đạo, bất chấp thương vong của người dân trên bề mặt bị ném bom.\n\n§ECho phép chiến lược oanh tạc quỹ đạo 'Không phân biệt'.§!"

 orbital_bombardment_armageddon:0 "Ngày tận thế"
 orbital_bombardment_armageddon_name:0 "Oanh tạc quỹ đạo Ngày Tận Thế"
 orbital_bombardment_armageddon_desc:1 "Cho phép sử dụng tất cả các loại vũ khí oanh tạc quỹ đạo, bất chấp tính mạng của cư dân trên hành tinh. Với mục tiêu tiêu diệt hoàn toàn tất cả cư dân.\n\n§ECho phép các phương thức oanh tạc 'Không phân biệt' và 'Ngày tận thế'.§!"

 orbital_bombardment_abduction:0 "Bắt cóc"
 orbital_bombardment_abduction_name:0 "Oanh tạc quỹ đạo kiểu bắt cóc"
 orbital_bombardment_abduction_desc:0 ""
 orbital_bombardment_surrender_allowed_name:0 "Cho phép" #Not shown anywhere afaik
 orbital_bombardment_surrender_forbidden_name:0 "Cấm" #Not shown anywhere afaik
 policy_orbital_bombardment_accept_surrender:0 "Đầu hàng trên quỹ đạo"
 policy_orbital_bombardment_accept_surrender_desc:0 "Chính sách này quyết định xem chúng ta có cho phép các hành tinh thù địch đầu hàng trong quá trình hạm đội của chúng ta tiến hành oanh tạc quỹ đạo hay không."
 orbital_bombardment_surrender_allowed:0 "Cho phép"
 orbital_bombardment_surrender_allowed_desc:0 "Công dân nước ngoài có quyền đầu hàng.\n\n§ETrong quá trình tiến hành oanh tạc quỹ đạo đối với hành tinh thù địch không có lực lượng phòng thủ, nếu họ chọn đầu hàng, chúng ta sẽ giành được quyền kiểm soát hành tinh đó.§!"
 orbital_bombardment_surrender_forbidden:0 "Cấm"
 orbital_bombardment_surrender_forbidden_desc:0 "Chúng ta không chấp nhận đầu hàng, cuộc oanh tạc quỹ đạo sẽ tiếp tục vô thời hạn.\n\n§EChỉ có thể giành quyền kiểm soát hành tinh thù địch thông qua việc đổ bộ của lực lượng mặt đất lên hành tinh.§!"

 policy_interference:1 "Can thiệp nền văn minh tiền siêu quang tốc"
 policy_interference_desc:1 "Chúng ta có thể thiết lập chính sách để điều chỉnh các tương tác của chúng ta với các quốc gia tiền siêu quang tốc."
 interference_not_allowed:0 "Không can thiệp"
 interference_not_allowed_name:0 "$interference_not_allowed$"
 interference_not_allowed_desc: "Chúng ta không có quyền áp đặt bất kỳ ảnh hưởng nào lên một xã hội khác đang phát triển. Chỉ quan sát, tuyệt đối không can thiệp.\n\n§E—Trạm quan sát chỉ có thể tiến hành $mission_passive_observation$\n—Không thể tiến hành hoạt động tình báo nhằm vào nền văn minh tiền siêu quang tốc\n—Không thể tiết lộ sự tồn tại của chúng ta trước mặt nền văn minh tiền siêu quang tốc\n—Không thể xâm lược nền văn minh tiền siêu quang tốc§!"
 interference_subtle:0 "Can thiệp nhẹ"
 interference_subtle_name:0 "$interference_subtle$"
 interference_subtle_desc: "Chúng ta có thể hướng dẫn họ đi đúng con đường phát triển thông qua những điều chỉnh nhỏ, nhưng không được nhúng tay quá nhiều.\n\n§E—Trạm quan sát chỉ có thể tiến hành $mission_passive_observation$\n—Có thể tiến hành một phần hoạt động tình báo nhằm vào nền văn minh tiền siêu quang tốc\n—Chỉ có thể tiết lộ sự tồn tại của chúng ta cho các nền văn minh tiền siêu quang tốc có mức độ thức tỉnh cao\n—Không thể xâm lược nền văn minh tiền siêu quang tốc§!\n\n"
 interference_active:1 "Can thiệp chủ động"
 interference_active_name:1 "$interference_active$"
 interference_active_desc: "Để làm sáng tỏ những bí ẩn của vũ trụ, cần phải cho phép các nghiên cứu về mọi chủ đề thú vị được triển khai tự do.\n\n§E—Trạm quan sát có thể tiến hành $mission_passive_observation$ hoặc $mission_specimen_collection$\n—Có thể tiến hành mọi hoạt động tình báo nhằm vào nền văn minh tiền siêu quang tốc\n—Có thể tuyên bố sự tồn tại của chúng ta cho nền văn minh tiền siêu quang tốc\n—Không thể xâm lược nền văn minh tiền siêu quang tốc§!\n\n"
 interference_aggressive:0 "Can thiệp xâm lược"
 interference_aggressive_name:0 "$interference_aggressive$"
 interference_aggressive_desc: "Kẻ mạnh phải thống trị kẻ yếu. Số phận cuối cùng của những xã hội kém phát triển đó là chấp nhận sự lãnh đạo toàn diện của chúng ta.\n\n§E—Trạm quan sát chỉ có thể tiến hành $mission_specimen_collection$\n—Có thể tiến hành một phần hoạt động tình báo nhằm vào nền văn minh tiền siêu quang tốc\n—Có thể tiết lộ sự tồn tại của chúng ta cho nền văn minh tiền siêu quang tốc\n—Có thể xâm lược nền văn minh tiền siêu quang tốc§!\n\n"
 policy_interference_unchanged: "Chính sách đối với §Y$policy_interference$§! không thay đổi."

 policy_enlightenment:1 "Khai sáng nền văn minh tiền siêu quang tốc"
 policy_enlightenment_desc:1 "Chúng ta có thể chia sẻ các thành tựu công nghệ của mình cho các xã hội vẫn đang ở giai đoạn tiền siêu quang tốc, mở ra những chân trời mới để họ khám phá vũ trụ.\n"
 enlightenment_not_allowed:0 "Cấm"
 enlightenment_not_allowed_name:1 "Cấm khai sáng nền văn minh tiền siêu quang tốc"
 enlightenment_not_allowed_desc:1 "Xã hội này chưa sẵn sàng tiếp nhận những kỳ tích công nghệ mà chúng ta đã khám phá. Tiết lộ sự thật cho họ lúc này có thể mang lại những rủi ro to lớn cho tất cả những người liên quan.\n\n§EKHÔNG THỂ tiến hành khai sáng cho nền văn minh tiền siêu quang tốc§!\n\n"
 enlightenment_covert_only:0 "Chỉ giới hạn ở bí mật"
 enlightenment_covert_only_name:0 "Cho phép khai sáng bí mật nền văn minh tiền siêu quang tốc"
 enlightenment_covert_only_desc:0 "Việc tuyên bố sự tồn tại của chúng ta cho các nền văn minh tiền siêu quang tốc sẽ phá vỡ tiến trình phát triển tự nhiên của họ. Chúng ta nên giúp đỡ họ, nhưng không được để lộ sự tồn tại của mình.\n\n§EChỉ có thể tiến hành khai sáng nền văn minh tiền siêu quang tốc thông qua các hoạt động tình báo§!\n\n"
 enlightenment_allowed:0 "Cho phép"
 enlightenment_allowed_name:1 "Cho phép khai sáng nền văn minh tiền siêu quang tốc"
 enlightenment_allowed_desc:1 "Thông qua việc chia sẻ kiến thức của mình, chúng ta có thể tích cực khuyến khích các xã hội kém phát triển tìm thấy vị trí của riêng mình trong cộng đồng thiên hà.\n\n§ECó thể tiến hành khai sáng nền văn minh tiền siêu quang tốc thông qua các hoạt động tình báo và các biện pháp ngoại giao§!\n\n"
 enlightenment_policy_unchanged: "Chính sách đối với §Y$policy_enlightenment$§! không thay đổi."

 policy_migration:0 "Di cư"
 policy_migration_desc:0 "Một số người trong đế chế của chúng ta ngước nhìn những vì sao trên bầu trời đêm, khao khát một cuộc sống tươi đẹp mà họ có thể tạo ra trong thế giới mới.\n"
 migration_not_allowed:0 "Cấm"
 migration_not_allowed_name:0 "Cấm di cư"
 migration_not_allowed_desc:0 "Nơi nào cần dân số nhất, điều này do đế chế quyết định.\n\n§EKHÔNG ai có thể tự do di cư§!"
 migration_allowed_primary_only:0 "Chỉ giới hạn ở giống loài chính"
 migration_allowed_primary_only_name:0 "Di cư giống loài chính"
 migration_allowed_primary_only_desc:0 "Di cư không hạn chế là đặc quyền chỉ giống loài chính của chúng ta mới có thể tận hưởng.\n\n§EChỉ có giống loài chính mới có thể tự do di cư§!"
 migration_allowed_all:0 "Tự do di cư"
 migration_allowed_all_name:0 "Di cư không hạn chế"
 migration_allowed_all_desc:0 "Tất cả cư dân của chúng ta nên có quyền theo đuổi hạnh phúc của riêng mình.\n\n§EMọi người đều có thể tự do di cư§!"

 policy_appropriation:0 "Chiếm đoạt đất đai"
 policy_appropriation_desc:0 "Chính sách này quyết định xem liệu có thể chiếm đoạt đất đai từ các giống loài không phải công dân trên các hành tinh mới giành được hay không."
 appropriation_not_allowed:0 "Cấm"
 appropriation_not_allowed_name:0 "Cấm chiếm đoạt đất đai"
 appropriation_not_allowed_desc:0 "Đất đai trong đế chế của chúng ta đều thuộc về những cư dân bản địa của nó.\n\n§EGiữ nguyên hiện trạng dân số trên các hành tinh mới giành được.§!"
 appropriation_allowed:0 "Cho phép"
 appropriation_allowed_name:0 "Cho phép chiếm đoạt đất đai"
 appropriation_allowed_desc: "Những vùng đất mà các giống loài thấp kém không thể sử dụng hiệu quả nên được giao cho các giống loài thượng đẳng khai thác và sử dụng.\n\n§ETrên các hành tinh giành được từ tay những giống loài không phải công dân, tối đa §Y500§! £pop£ dân số sẽ bị trục xuất và thay thế bằng dân số công dân của chúng ta di cư từ các hành tinh khác.§!"

 policy_resettlement:0 "Cưỡng chế tái định cư"
 policy_resettlement_desc:0 "Chính sách này quyết định xem liệu chúng ta có thể cưỡng chế di dời cư dân giữa các hành tinh hay không.\n"
 resettlement_not_allowed:0 "Cấm"
 resettlement_not_allowed_name:0 "Cấm cưỡng chế tái định cư"
 resettlement_not_allowed_desc:1 "Dân số tự do không thể bị cưỡng chế tái định cư giữa các hành tinh."
 resettlement_allowed:0 "Cho phép"
 resettlement_allowed_name:0 "Cho phép cưỡng chế tái định cư"
 resettlement_allowed_desc:1 "Có thể cưỡng chế dân số di dời giữa các hành tinh."
 PLANET_AUTO_RESETTLEMENT_CHANCE: "Nếu có vị trí việc làm trống, nhà ở và điều kiện sống tốt, những £pop£ §Hdân số§! thất nghiệp này sẽ di cư đến các khu định cư khác trong đế chế.\n\nDự kiến §Y$VALUE|0$§! sẽ di cư vào tháng sau."
 AUTO_MIGRATE_MIGRATION_CONTROLS:0 "§RĐã kích hoạt kiểm soát di cư đối với giống loài này.§!\n"
 AUTO_MIGRATE_SLAVE_PROCESSING:1 "§RChỉ khi có §Y$sm_transit_hub$§! hoặc §Y$building_slave_processing$§!, nô lệ và người máy vô tri mới có thể §Ytự động di cư§! đến các khu định cư khác.§!\n"
 AUTO_MIGRATE_ASSIMILATED:0 "§RDân số đang bị đồng hóa không thể tự động di cư.§!"
 PLANET_AUTO_RESETTLEMENT_NO_ELIGIBLE_POPS:0 "Những £pop£ §Hdân số§! này không thể tự động di cư vì những lý do sau:"
 PLANET_AUTO_RESETTLEMENT_NO_VALID_DESTINATION:0 "$PLANET_AUTO_RESETTLEMENT_NO_ELIGIBLE_POPS$\n§RKhông có điểm đến tự động di cư hợp lệ.§!"
 PLANET_AUTO_RESETTLEMENT_MOST_LIKELY_DESTINATION:0 "Điểm đến có khả năng cao nhất của họ là $PLANET|Y$."
 PLANET_AUTO_RESETTLEMENT_INELIGIBLE_PLANET:0 "£pop£ §Hdân số§! không được phép tự động di cư từ hành tinh này vì những lý do sau:"
 AUTO_MIGRATE_CULTURE_SHOCK:0 "§RKhu định cư này đang chịu ảnh hưởng của cú sốc văn hóa.§!"
 AUTO_MIGRATE_COLONY_TOO_NEW:0 "§RKhu định cư này quá mới.§!"
 AUTO_MIGRATE_ONLY_HAS_ONE_POP:0 "§R£pop£ §Hdân số§! cuối cùng không thể tự động di cư.§!"

