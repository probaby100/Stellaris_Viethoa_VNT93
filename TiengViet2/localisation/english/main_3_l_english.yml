 EMPTY_DRIVE:0 "Không có Động cơ Siêu quang tốc"
 EMPTY_DRIVE_DESC:1 "Tàu chiến không có động cơ siêu quang tốc sẽ không thể bay ra khỏi hệ sao hiện tại."
 WARP_DRIVE_1:0 "Động cơ Warp I"
 WARP_DRIVE_1_DESC:1 "Có thể di chuyển siêu quang tốc từ rìa hệ sao này sang hệ sao khác, phạm vi di chuyển khá hạn chế, cần phải bước vào giai đoạn nạp năng lượng và làm mát mỗi khi khởi hành và cập bến."
 WARP_DRIVE_2:0 "Động cơ Warp II"
 WARP_DRIVE_2_DESC:1 "$WARP_DRIVE_1_DESC$"
 WARP_DRIVE_3:0 "Động cơ Warp III"
 WARP_DRIVE_3_DESC:1 "$WARP_DRIVE_1_DESC$"
 NOMAD_WARP_DRIVE:0 "$WARP_DRIVE_3$"
 HYPER_DRIVE_1:0 "Động cơ Siêu không gian I"
 HYPER_DRIVE_1_DESC:2 "Tàu trang bị động cơ siêu không gian có thể bay cực nhanh giữa các rìa hệ sao nhờ vào các tuyến đường siêu không gian kết nối chúng."
 HYPER_DRIVE_2:0 "Động cơ Siêu không gian II"
 HYPER_DRIVE_2_DESC:1 "$HYPER_DRIVE_1_DESC$"
 HYPER_DRIVE_3:0 "Động cơ Siêu không gian III"
 HYPER_DRIVE_3_DESC:1 "$HYPER_DRIVE_1_DESC$"
 JUMP_DRIVE_1:0 "Động Cơ Nhảy Không Gian (Jump Drive)"
 JUMP_DRIVE_1_DESC:1 "Động cơ bước nhảy có khả năng xé toạc một lỗ hổng vừa bằng kích thước con tàu ngay trong không gian thực tế, cho phép tàu thực hiện bước nhảy khoảng cách ngắn giữa các hệ sao. Bản chất của không gian mà con tàu xuyên qua khi thực hiện bước nhảy vẫn chưa thực sự được con người thấu hiểu."
 RANGELESS_JUMP_DRIVE:0 ""
 PSI_JUMP_DRIVE_1:0 "Động Cơ Nhảy Tâm Linh (Psi Jump Drive)"
 PSI_JUMP_DRIVE_1_DESC:1 "Động cơ bước nhảy tâm linh mượn sức mạnh tâm linh tiềm ẩn của thủy thủ đoàn để bẻ gãy sự liên tục của không thời gian, xóa nhòa khoảng cách giữa điểm đến và điểm đi. Về mặt lý thuyết là như vậy."
 WORMHOLE_DRIVE_DESC:0 "Tàu trang bị bộ điều chế lỗ sâu có khả năng phối hợp với cổng dịch chuyển do máy tạo lỗ sâu hình thành, thiết lập các tuyến đường thông nhau giữa các hệ sao."
 EMPTY_FTL_INHIBITOR:0 "Không có Máy cản trở Siêu quang tốc"
 EMPTY_FTL_INHIBITOR_DESC:0 "Căn cứ sao thiếu máy cản trở siêu quang tốc sẽ không thể chặn đường thoát của tàu địch."

 ftl_components:0 "Linh kiện Siêu quang tốc"
 ftl_components_DESC:0 "Bất kỳ con tàu nào muốn đi lại giữa các hệ sao đều cần được lắp đặt linh kiện siêu quang tốc tương tự."

 ship_sensor_components:0 "Cảm biến"
 ship_sensor_components_DESC:0 "Cảm biến có khả năng làm hiển thị rõ chi tiết của mọi hạm đội hoặc hệ sao nằm trong tầm dò tìm của nó."
 station_sensor_components:0 "$ship_sensor_components$"
 station_sensor_components_DESC:0 "$ship_sensor_components_DESC$"

 sensor_components:0 "Cảm biến"
 sensor_components_desc:0 "$ship_sensor_components_DESC$"


 thruster_components:0 "Động cơ Đẩy"
 thruster_components_DESC:0 "Động cơ đẩy được dùng để bay ở vận tốc dưới ánh sáng, là thành phần bắt buộc phải có trên mọi con tàu."

 combat_computers:0 "Máy tính Tác chiến"
 combat_computers_DESC:0 "Máy tính tác chiến được cài đặt trên tất cả các tàu quân sự, có chức năng tự động tính toán ngắm bắn, lái tàu né tránh và kiểm soát thiệt hại."

 border_extruders:0 "Phao Biên giới"
 border_extruders_DESC:0 "Phao biên giới hoạt động như những cột mốc, giúp phân định ranh giới lãnh thổ giữa các quốc gia trong không gian sâu."

 ship_aura_components:1 "Hào quang Tàu (Titan)"
 ship_aura_components_DESC:3 "Lớp tàu này có thể gắn máy tạo trường lực, dùng để phóng và duy trì trường lực cho các tàu xung quanh, tạo ra nhiều hiệu ứng hỗ trợ hoặc cản trở lên tàu đồng minh hoặc tàu địch."

 power_core:0 "Lõi Năng lượng"
 power_core_DESC:0 "Vạn vật trên đời đều không thể thiếu năng lượng, lõi năng lượng là một trái tim vô cùng quan trọng đối với mọi cỗ máy."

 station_power_core:0 "$power_core$"
 station_power_core_desc:0 "$power_core_desc$"

