 # War Goals
 war_goal_wg_conquest:0 "Chinh phục"
 #war_goal_wg_conquest_desc: "Wage war to seize enemy systems that we have claims on."
 war_goal_wg_conquest_desc:1 "Phát động chiến tranh để chiếm lấy các hệ sao của địch mà chúng ta đã tuyên bố chủ quyền. Khi sử dụng mục tiêu chiến tranh này, mỗi hệ sao bị chinh phục sẽ tạo ra ít hơn §Y25%§! §YMối đe dọa§!."
 war_goal_wg_liberation:0 "Giải phóng"
 #war_goal_wg_liberation_desc: "Wage war to extricate a number of planets from the enemy, forming an independent and friendly Empire."
 war_goal_wg_liberation_desc:0 "Phát động chiến tranh để giải phóng một số hành tinh khỏi tay kẻ thù, tạo thành một đế chế độc lập và thân thiện."
 war_goal_wg_subjugation:0 "Bắt Làm Chư Hầu"
 #war_goal_wg_subjugation_desc: "Wage war to subjugate the enemy as a Vassal."
 war_goal_wg_subjugation_desc:2 "Phát động chiến tranh để ép kẻ thù trở thành chư hầu của chúng ta.\n\nNếu chiến tranh kết thúc bằng cách duy trì hiện trạng, các hệ sao chúng ta chiếm đóng nếu có ít nhất một hành tinh thì sẽ được giải phóng thành một chư hầu mới.\n\nCác điều khoản hiệp định ban đầu của chư hầu này được quyết định bởi chính sách §Y$policy_subjugation_war_terms$§! của chúng ta."
 war_goal_wg_tribute:0 "Yêu cầu cống nạp"
 #war_goal_wg_tribute_desc: "Wage war to subjugate the enemy as a Tributary."
 war_goal_wg_tribute_desc:1 "Phát động chiến tranh để ép kẻ thù trở thành quốc gia cống nạp.\n\nNếu chiến tranh kết thúc bằng cách duy trì hiện trạng, các hệ sao chúng ta chiếm đóng nếu có ít nhất một hành tinh thì sẽ được giải phóng thành quốc gia cống nạp."
 war_goal_wg_megacorp_subjugate:0 "Sáp nhập thành công ty con"
 war_goal_wg_megacorp_subjugate_desc:1 "Phát động chiến tranh để biến kẻ thù thành công ty con.\n\nNếu chiến tranh kết thúc thông qua \"duy trì hiện trạng\", các hệ sao chúng ta chiếm đóng sẽ được giải phóng thành công ty con mới, với điều kiện công ty con đó sau khi được giải phóng phải có ít nhất một hành tinh.\n\nCác điều khoản hiệp định ban đầu của công ty con này được quyết định bởi chính sách §Y$policy_subjugation_war_terms$§! của chúng ta."
 war_goal_wg_hostile_takeover:1 "Thu tịch tài sản"
 war_goal_wg_hostile_takeover_desc:1 "Phát động chiến tranh để giành quyền kiểm soát chi nhánh của họ."
 war_goal_wg_humiliation:0 "Sỉ nhục"
 #war_goal_wg_humiliation_desc: "Wage war to destroy the enemy's chain of command, disrupt their logistical flows, undermine the public's faith in their institutions, and destabilize the regime."
 war_goal_wg_humiliation_desc:0 "Phát động chiến tranh để làm rung chuyển chế độ của kẻ địch và niềm tin của người dân vào thể chế của họ."
 war_goal_wg_payback_msi_humiliation:0 "$war_goal_wg_humiliation$"
 war_goal_wg_payback_msi_humiliation_desc:0 "$war_goal_wg_humiliation_desc$"
 war_goal_wg_force_ideology:0 "Nhập khẩu hệ tư tưởng"
 war_goal_wg_force_ideology_desc:1 "Phát động chiến tranh để áp đặt thể chế chính trị và hệ tư tưởng của kẻ tấn công lên kẻ thù.\n\nNếu chiến tranh kết thúc thông qua \"duy trì hiện trạng\", các hệ sao chúng ta chiếm đóng nếu có ít nhất một hành tinh thì sẽ được giải phóng thành một đồng minh mới có cùng hệ tư tưởng."
 war_goal_wg_fe_humiliation:0 "Sỉ nhục"
 war_goal_wg_fe_humiliation_desc:0 "Phát động chiến tranh để giáng cho kẻ thức tỉnh một đòn phủ đầu."
 war_goal_wg_fe_stop_atrocities:0 "Ngăn chặn bạo hành"
 war_goal_wg_fe_stop_atrocities_desc:0 "Phát động chiến tranh để chấm dứt những hành vi bạo tàn của kẻ thù."
 war_goal_wg_fe_cleanse_holy_worlds:0 "Thanh tẩy thánh địa"
 war_goal_wg_fe_cleanse_holy_worlds_desc:0 "Phát động chiến tranh để đuổi lũ dị giáo ra khỏi thánh địa."
 war_goal_wg_fe_cleanse_border_worlds:0 "Thanh tẩy vùng biên giới"
 war_goal_wg_fe_cleanse_border_worlds_desc:0 "Phát động chiến tranh để thanh tẩy mọi kẻ thù dám lảng vảng quá gần lãnh thổ cốt lõi."
 war_goal_wg_fe_stop_ai:0 "Cấm trí tuệ nhân tạo"
 war_goal_wg_fe_stop_ai_desc:0 "Phát động chiến tranh để ép kẻ thù từ bỏ việc sử dụng trí tuệ nhân tạo một cách ngây thơ."
 war_goal_wg_ae_domination:0 "Thống trị"
 war_goal_wg_ae_domination_desc:0 "Phát động chiến tranh để thiết lập bá quyền thống trị ngân hà."
 war_goal_wg_ae_total_war: "Chiến tranh tổng lực"
 war_goal_wg_ae_total_war_desc: "Phát động chiến tranh để Đế chế Thức tỉnh tiêu diệt mối đe dọa chung của các nền văn minh trong vũ trụ."
 PEACE_NO_EFFECTS:2 "§YDuy trì hiện trạng§!\nHai bên đều không chiếm được các vùng lãnh thổ đã tuyên bố chủ quyền, thỏa thuận duy trì hiện trạng sẽ thúc đẩy một nền §Yhòa bình vô điều kiện§!, từ đó không dẫn đến bất kỳ sự thay đổi đường biên giới nào."
