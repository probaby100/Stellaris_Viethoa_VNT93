 district_arcology_mixed_industry: "Khu Đô thị Công nghiệp"
 district_arcology_mixed_industry_plural: "Khu Đô thị Công nghiệp"
 district_arcology_mixed_industry_desc: "Lò luyện, nhà máy, cơ sở sản xuất và xưởng thợ trải rộng như một thành phố, khu đô thị này có thể làm ra mọi thứ và đáp ứng mọi nhu cầu."
 district_arcology_research: "Khu Đô thị Nghiên cứu"
 district_arcology_research_plural: "Khu Đô thị Nghiên cứu"
 district_arcology_research_desc: "Những khu đô thị này là trung tâm của các khám phá khoa học, nơi hội tụ các nhà nghiên cứu từ mọi lĩnh vực chuyên môn."
 district_arcology_research_physics: "Khu Đô thị Vật lý"
 district_arcology_research_physics_plural: "Khu Đô thị Vật lý"
 district_arcology_research_physics_desc: "Các máy gia tốc hạt nằm dưới lòng đường như những hệ thống cống ngầm thời cổ đại, còn máy tính lượng tử và máy điều khiển trường thì cao chọc trời, cứ như thể chúng phớt lờ mọi định luật. Thực ra đó chỉ là vì người dân chưa hiểu hết về chúng, nhưng sớm muộn gì họ cũng sẽ hiểu."
 district_arcology_research_society: "Khu Đô thị Sinh học"
 district_arcology_research_society_plural: "Khu Đô thị Sinh học"
 district_arcology_research_society_desc: "Dạo bước qua các khu bảo tồn thiên nhiên rộng mênh mông trong đô thị này giống hệt như đang đi thăm sở thú, nhưng thực tế, chính những vị khách cũng là đối tượng bị quan sát bởi các phòng thí nghiệm ẩn mình dưới những cảnh quan có vẻ bình thường."
 district_arcology_research_engineering: "Khu Đô thị Kỹ thuật"
 district_arcology_research_engineering_plural: "Khu Đô thị Kỹ thuật"
 district_arcology_research_engineering_desc: "Một đô thị luôn chuyển động, các tòa nhà không ngừng thay đổi hình dáng và bầu trời chật kín những công trình thử nghiệm. Đây là nơi dành cho các thí nghiệm vật liệu phức tạp, tổng hợp hóa học lượng tử và cấu trúc nano - những thứ từng chỉ nằm trong trí tưởng tượng nay đã trở thành sự thật."
 district_arcology_fortress: "Khu Đô thị Pháo đài"
 district_arcology_fortress_plural: "Khu Đô thị Pháo đài"
 district_arcology_fortress_desc: "Những pháo đài khổng lồ như những ngọn núi này kết hợp nhuần nhuyễn giữa trung tâm chỉ huy, cứ điểm hành tinh, cơ sở huấn luyện và doanh trại sĩ quan, chúng thậm chí còn vững chắc hơn cả bản thân hành tinh này."
 district_arcology_trade: "Khu Đô thị Thương mại"
 district_arcology_trade_plural: "Khu Đô thị Thương mại"
 district_arcology_trade_desc: "Một đô thị bành trướng không ngừng về kho bãi và logistics, nơi diễn ra vô số hoạt động buôn bán, với những sàn giao dịch cao chọc trời. Nếu có thứ gì mà bạn không thể tìm thấy ở đây, thì chắc chắn là nó không hề tồn tại trên đời."

 district_ring_world_industrial: "Phân khu Công nghiệp"
 district_ring_world_industrial_plural: "Phân khu Công nghiệp"
 district_ring_world_industrial_desc: "Những lò luyện, nhà máy, cơ sở sản xuất và xưởng thợ vẫn có thể nhìn thấy rõ ở tít phía xa của vòng tròn, nơi này có thể làm ra mọi thứ và đáp ứng mọi nhu cầu."
 district_ring_world_foundry: "Phân khu Luyện kim"
 district_ring_world_foundry_plural: "Phân khu Luyện kim"
 district_ring_world_foundry_desc: "Phân khu này là trái tim của đủ loại dự án công nghiệp, khắp nơi đều vang vọng tiếng gầm rú của lò luyện và tiếng đập kim loại từ các xưởng đúc."
 district_ring_world_factory: "Phân khu Nhà máy"
 district_ring_world_factory_plural: "Phân khu Nhà máy"
 district_ring_world_factory_desc: "Một mạng lưới xưởng thợ và nhà máy dân dụng nối tiếp nhau vươn lên bầu trời, rồi khuất dần ở phía xa của vành đai Thế giới Vòng."
 district_ring_world_research: "Phân khu Nghiên cứu"
 district_ring_world_research_plural: "Phân khu Nghiên cứu"
 district_ring_world_research_desc: "Trung tâm khám phá khoa học này liên kết với nhiều phòng thí nghiệm khác nhau trên Thế giới Vòng, tạo ra vô số cơ hội cho các nhà nghiên cứu từ mọi lĩnh vực."
 district_ring_world_research_physics: "Phân khu Vật lý"
 district_ring_world_research_physics_plural: "Phân khu Vật lý"
 district_ring_world_research_physics_desc: "Các máy gia tốc hạt, máy tính lượng tử và máy điều khiển trường này có vẻ như đi ngược lại các định luật vật lý, nhưng đó chỉ là góc nhìn của những người sống ở thời đại trước khi Thế giới Vòng ra đời."
 district_ring_world_research_society: "Phân khu Sinh học"
 district_ring_world_research_society_plural: "Phân khu Sinh học"
 district_ring_world_research_society_desc: "Nghiên cứu di truyền, mô phỏng thần kinh, phân tích tâm lý và ngoại suy lịch sử động lực học - tất cả đều góp phần giúp chúng ta hiểu rõ hơn về toàn bộ vũ trụ."
 district_ring_world_research_engineering: "Phân khu Kỹ thuật"
 district_ring_world_research_engineering_plural: "Phân khu Kỹ thuật"
 district_ring_world_research_engineering_desc: "Các thử nghiệm vật liệu phức tạp bậc nhất, quá trình tổng hợp hóa học lượng tử và chế tạo ở cấp độ nano đều được tiến hành trong một môi trường lý tưởng."
 district_ring_world_administrative: "Phân khu Hành chính"
 district_ring_world_administrative_plural: "Phân khu Hành chính"
 district_ring_world_administrative_desc: "Hàng bầy thư ký và viên chức cắm mặt làm việc như trâu ngựa để đáp ứng những đòi hỏi không ngừng của một bộ máy quan liêu đang phình to. Trên Thế giới Vòng, sự trớ trêu của vòng lặp vô tận ấy dường như chẳng hề khiến họ mảy may bận tâm."
 district_ring_world_spiritualist: "Phân khu Tôn giáo"
 district_ring_world_spiritualist_plural: "Phân khu Tôn giáo"
 district_ring_world_spiritualist_desc: "Những đền thờ bao quanh ngôi sao tựa như những viên ngọc thánh này chính là minh chứng cho lòng thành kính và đức tin của chúng ta."
 district_ring_world_organic_housing: "Phân khu Trú ẩn"
 district_ring_world_organic_housing_plural: "Phân khu Trú ẩn"
 district_ring_world_organic_housing_desc: "Hệ thống khí hậu nhân tạo do AI điều khiển trong những dãy nhà bất tận này có thể mô phỏng bất kỳ môi trường nào mà các sinh vật hữu cơ cần. Mọi nhu cầu về nhà ở của họ đều được đáp ứng một cách trọn vẹn."
 district_ring_world_fortress: "Phân khu Pháo đài"
 district_ring_world_fortress_plural: "Phân khu Pháo đài"
 district_ring_world_fortress_desc: "Những pháo đài khổng lồ như núi này kết hợp hoàn hảo giữa trung tâm chỉ huy, cứ điểm hành tinh, cơ sở huấn luyện và doanh trại. Chúng vũ trang cho Thế giới Vòng, sắc bén như nanh vuốt của thú săn mồi."
 district_ring_world_trade: "Phân khu Thương mại"
 district_ring_world_trade_plural: "Phân khu Thương mại"
 district_ring_world_trade_desc: "Nơi đây diễn ra vô vàn hoạt động kinh doanh và thương lượng, với các trung tâm giao dịch xoay quanh ngôi sao. Nếu bạn không thể tìm thấy món hàng nào ở đây, thì chắc chắn nó không tồn tại."
 district_ring_world_food: "Phân khu Nông nghiệp"
 district_ring_world_food_plural: "Phân khu Nông nghiệp"
 district_ring_world_food_desc: "Biển cả những cánh đồng thủy canh bao la lấp đầy phân khu này của Thế giới Vòng, hệ thống khí hậu và trọng lực được kiểm soát hoàn hảo để luôn đảm bảo những vụ mùa bội thu."
 district_ring_world_energy: "Phân khu Năng lượng"
 district_ring_world_energy_plural: "Phân khu Năng lượng"
 district_ring_world_energy_desc: "$district_generator_desc$"

 district_nexus_industrial: "Trạm Công nghiệp"
 district_nexus_industrial_plural: "Trạm Công nghiệp"
 district_nexus_industrial_desc: "Lò luyện, nhà máy, cơ sở sản xuất và xưởng thợ phối hợp nhịp nhàng với nhau, trạm này có thể tạo ra mọi thứ và đáp ứng mọi nhu cầu."
 district_nexus_foundry: "Trạm Đúc"
 district_nexus_foundry_plural: "Trạm Đúc"
 district_nexus_foundry_desc: "Những trạm này là trái tim của đủ loại dự án công nghiệp, khắp nơi đều vang vọng tiếng gầm rú của lò luyện và tiếng đập kim loại từ các xưởng đúc."
 district_nexus_factory: "Trạm Công nghiệp"
 district_nexus_factory_plural: "Trạm Công nghiệp"
 district_nexus_factory_desc: "Mạng lưới nhà xưởng chằng chịt chứa đầy các xưởng thợ và nhà máy dân dụng, có thể sản xuất bất kỳ loại hàng tiêu dùng nào."
 district_nexus_research: "Trạm Nghiên cứu"
 district_nexus_research_plural: "Trạm Nghiên cứu"
 district_nexus_research_desc: "Những trạm này là điểm tập trung mạng lưới của các khám phá khoa học, điều phối hoạt động của các nhà nghiên cứu từ mọi lĩnh vực."
 district_nexus_research_physics: "Trạm Vật lý"
 district_nexus_research_physics_plural: "Trạm Vật lý"
 district_nexus_research_physics_desc: "Các máy gia tốc hạt, máy tính lượng tử và máy điều khiển trường này có vẻ như đi ngược lại các định luật vật lý, nhưng đó chỉ là vì những đánh giá của chúng ta đã lỗi thời."
 district_nexus_research_society: "Trạm Sinh học"
 district_nexus_research_society_plural: "Trạm Sinh học"
 district_nexus_research_society_desc: "Nghiên cứu di truyền, mô phỏng thần kinh, phân tích tâm lý và ngoại suy lịch sử động lực học - tất cả đều góp phần giúp chúng ta hiểu rõ hơn về toàn bộ vũ trụ."
 district_nexus_research_engineering: "Trạm Kỹ thuật"
 district_nexus_research_engineering_plural: "Trạm Kỹ thuật"
 district_nexus_research_engineering_desc: "Một trung tâm luôn chuyển động, các tòa nhà không ngừng thay đổi hình dáng và bầu trời chật kín những công trình thử nghiệm. Đây là nơi dành cho các thí nghiệm vật liệu phức tạp, tổng hợp hóa học lượng tử và cấu trúc nano."
 district_nexus_administrative: "Trạm Điều phối"
 district_nexus_administrative_plural: "Trạm Điều phối"
 district_nexus_administrative_desc: "Những công trình bất tận chứa đầy các mảng máy chủ và bộ khuếch đại tín hiệu, giúp khuyếch đại tín hiệu của Cốt lõi để đạt hiệu suất tối đa."
 district_nexus_spiritualist: "Trạm Tôn giáo"
 district_nexus_spiritualist_plural: "Trạm Tôn giáo"
 district_nexus_spiritualist_desc: "Những đền thờ được sắp xếp theo cấu trúc mã nguồn nền tảng này chính là minh chứng cho lòng thành kính và đức tin của chúng ta."
 district_nexus_organic_housing: "Khu Bảo tồn Mạng lưới"
 district_nexus_organic_housing_plural: "Trạm Trú ẩn"
 district_nexus_organic_housing_desc: "Hệ thống khí hậu nhân tạo do AI điều khiển trong những dãy nhà bất tận này có thể mô phỏng bất kỳ môi trường nào mà các sinh vật hữu cơ cần. Mọi nhu cầu về nhà ở của họ đều được đáp ứng một cách trọn vẹn."
 district_nexus_fortress: "Trạm Pháo đài"
 district_nexus_fortress_plural: "Trạm Pháo đài"
 district_nexus_fortress_desc: "Những pháo đài khổng lồ như những ngọn núi này kết hợp nhuần nhuyễn giữa trung tâm chỉ huy, cứ điểm hành tinh, cơ sở huấn luyện và hệ thống mô phỏng chiến lược, chúng được chôn sâu dưới lòng đất hành tinh."
 district_nexus_trade: "Trạm Logistics"
 district_nexus_trade_plural: "Trạm Logistics"
 district_nexus_trade_desc: "Các cụm máy chủ chuyên theo dõi chuỗi cung ứng, biến động thị trường thương mại toàn ngân hà và thuật toán dự đoán được sắp xếp san sát trên những kệ máy cao chọc trời."
 district_nexus_mining: "Trạm Khai khoáng"
 district_nexus_mining_plural: "Trạm Khai khoáng"
