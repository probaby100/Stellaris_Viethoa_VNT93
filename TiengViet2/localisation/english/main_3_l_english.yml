# Subjects
 SUBJECT_vassal:0 "Nước Chư Hầu (Vassal)"
 SUBJECT_DESC_vassal:0 "Các nước phụ dung chịu thần phục tông chủ của mình, họ chỉ có đặc quyền ngoại giao hạn chế và buộc phải sát cánh chiến đấu cùng tông chủ."
 SUBJECT_protectorate:0 "Nước bảo hộ"
 SUBJECT_DESC_protectorate:5 "Nước bảo hộ được tông chủ đảm bảo nền độc lập; khi nghiên cứu các công nghệ mà tông chủ đã có, chi phí nghiên cứu sẽ giảm §Y80%§!; và khi họ đạt tới §Y50%§! trình độ công nghệ của tông chủ, sẽ tự động chuyển thành nước phụ dung."
 SUBJECT_DESC_tributary:0 "Quốc gia triều cống là một loại chư hầu, họ vẫn giữ được sự độc lập trên hầu hết các phương diện, nhưng hàng tháng phải cống nạp §Y25%§! thu nhập Năng lượng và Khoáng sản cho quốc gia tông chủ."
 OPEN_COMBAT_STATS:0 "§GNhấp để mở thông số trận chiến§!"
 SUBJECT_tributary:0 "Quốc gia triều cống"
 SUBJECT_thrall:0 "Quốc gia nô bộc"
 SUBJECT_DESC_thrall:1 "Quốc gia nô bộc là những chư hầu có nền ngoại giao độc lập, nhưng phải nộp §Y25%§! thu nhập Năng lượng và Khoáng sản hàng tháng cho tông chủ của mình. Họ cũng bị cấm bành trướng lãnh thổ sang các hệ sao mới, ngoại trừ thông qua con đường chinh phạt."
 SUBJECT_dominion:0 "Thần vực"
 SUBJECT_DESC_dominion:0 "Thần vực là một quốc gia chư hầu, mặc dù độc lập về mặt ngoại giao nhưng hàng tháng sẽ phải cống nạp §Y25%§! Năng lượng và Khoáng sản, đồng thời bắt buộc phải đi theo hệ tư tưởng giống với tông chủ của mình."
 SUBJECT_signatory:0 "Quốc gia hiệp ước"
 SUBJECT_DESC_signatory:1 "Quốc gia hiệp ước là một chư hầu bị hạn chế về mặt ngoại giao, được bảo vệ bởi tông chủ, nhưng vẫn có quyền tiến hành mở rộng lãnh thổ."
 SUBJECT_satellite:0 "Quốc gia vệ tinh"
 SUBJECT_DESC_satellite:1 "Quốc gia vệ tinh là một chư hầu có quyền tự chủ về ngoại giao, nhưng hàng tháng phải cống nạp cho tông chủ §Y33%§! điểm nghiên cứu Vật lý, Xã hội học và Kỹ thuật."
 RELATIVE_TECH_TO_OVERLORD:0 "Hiện tại họ đã nghiên cứu được §Y$RATIO|1$%§! công nghệ so với tông chủ của mình."
 SUBJECT_satrapy:0 "Lãnh địa"
 SUBJECT_DESC_satrapy:0 ""
 SUBJECT_subsidiary:0 "Công ty con"
 SUBJECT_DESC_subsidiary:2 "Công ty con là một dạng chư hầu, chịu sự chi phối và bảo vệ của tập đoàn tông chủ, nhưng vẫn có quyền tự do mở rộng lãnh thổ và tuyên chiến về mặt ngoại giao. Các công ty con phải nộp phạt §Y25%§! doanh thu Năng lượng hàng tháng làm cống phẩm."
 SUBJECT_scion:0 "Môn đồ"
 SUBJECT_DESC_scion:0 "Môn đồ phải tuân theo con đường mà các tiền bối đã vạch ra."

