 START_SCREEN_PART_ONE_OCEAN:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa các quần đảo và vùng đầm phá trên [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_TROPICAL:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa những cánh rừng mưa nhiệt đới rậm rạp trên [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_DESERT:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa biển cồn cát trải dài vô tận trên [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_ARID:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa những hẻm núi và cao nguyên khô cằn trên [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_TUNDRA:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy trên vùng bình nguyên lạnh buốt gió của [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_ARCTIC:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa những cánh đồng tuyết và hang băng trên [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_CONTINENTAL:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa những đồng cỏ và khu rừng trên [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_SAVANNAH:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy trên vùng trảng cỏ rộng lớn của [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_ALPINE:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa những thung lũng hiểm trở trên [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_ONE_GAIA:0 "Hàng tỷ năm trước, những cá thể [GetSpeciesName] nguyên thủy đầu tiên đã vươn mình trỗi dậy giữa vùng đất thần tiên xanh mướt và yên bình của [GetHomeWorldName]. Kể từ đó, nền văn minh của chúng ta bắt đầu lan rộng và dần trở nên thịnh vượng."
 START_SCREEN_PART_TWO_DESPOTIC_EMPIRE:0 "Trong thời kỳ hỗn loạn thuở sơ khai của lịch sử, nhiều đế chế đã tranh giành quyền lực, và cuối cùng kẻ mạnh nhất đã thống nhất tất cả. Chỉ dưới sự lãnh đạo thống nhất và mạnh mẽ, đế chế mới có thể phát huy toàn bộ tiềm năng. Kể từ đó, hòa bình, ổn định và phát triển khoa học là hệ quả tất yếu."
 START_SCREEN_PART_TWO_OLIGARCHY:0 "Cùng với sự phát triển của kiến thức khoa học và việc xây dựng rộng rãi các tiền đồn mới trên thế giới, thương mại bùng nổ đã kết nối các quốc gia chặt chẽ hơn cho đến khi hợp nhất thành một thực thể duy nhất. Quyền lực giờ đây thuộc về những thương nhân giàu có — những người kiến tạo thực sự cho nền văn minh của chúng ta."
 START_SCREEN_PART_TWO_REPRESENTATIVE_DEMOCRACY:0 "Tiến bộ công nghệ ổn định đã thúc đẩy chúng ta tiến bước, những cuộc xung đột vũ trang giữa các quốc gia ngày càng thưa thớt. Cuối cùng, một khuôn khổ chính phủ dân chủ toàn cầu đã được đặt ra trước mắt, và khi những người phản đối cuối cùng tự nguyện gia nhập, chúng ta đã hợp nhất thành một quốc gia duy nhất."
 START_SCREEN_PART_TWO_THEOCRATIC_MONARCHY:1 "Xuyên suốt chiều dài lịch sử, nhiều kẻ tiên tri giả mạo đã đưa ra những lời dẫn dắt tinh thần sai lệch trên con đường tiến bước của người dân chúng ta, nhưng chỉ có đức tin chân chính mới giành chiến thắng. Khi pháo đài cuối cùng của những kẻ ngoại đạo bị chinh phục sau nhiều cuộc thánh chiến với cái giá phải trả rất lớn, chúng ta đã đoàn kết lại dưới ý chí thần thánh cùng sự dẫn dắt của một nhà lãnh đạo được thần linh ban quyền."
 START_SCREEN_PART_TWO_THEOCRATIC_OLIGARCHY:0 "Cùng với sự phát triển của công nghệ, nhiều tín ngưỡng cũng nảy nở trong dân chúng, các giáo phái này cạnh tranh nhau để giành tín đồ. Cuộc đấu tranh giữa các phe phái lúc thì ôn hòa, lúc lại gay gắt. Cuối cùng, đức tin chân chính đã lan tỏa đến mọi ngóc ngách trên thế giới, và những người đầy đức tin đã cùng quy tụ dưới một tôn giáo duy nhất."
 START_SCREEN_PART_TWO_THEOCRATIC_REPUBLIC:0 "Chúng ta không ngừng khám phá vũ trụ và tìm kiếm vai trò của mình ở góc độ tinh thần, và trong quá trình này, chúng ta đã đạt được những thành tựu to lớn. Chúng ta đã thành lập một hội đồng gồm các giáo sĩ uyên bác để hỗ trợ các nhà lãnh đạo do người dân bầu ra. Truyền thống này vẫn được duy trì cho đến ngày nay."
 START_SCREEN_PART_TWO_STAR_EMPIRE:0 "Công nghệ không ngừng phát triển nhanh chóng, nhưng sự bùng nổ dân số khiến nhu cầu của người dân ngày càng khó được đáp ứng. Khi thế giới của chúng ta rơi vào bờ vực hỗn loạn, quân đội đã can thiệp để khôi phục trật tự pháp luật. Một trật tự mới đã được thiết lập để bảo vệ quốc gia khỏi mọi mối đe dọa từ bên trong lẫn bên ngoài."
 START_SCREEN_PART_TWO_MILITARY_REPUBLIC:0 "Khi không ngừng tiến bước trong dòng chảy lịch sử, nhiều quốc gia dân tộc sơ khai của chúng ta đã phải gánh chịu hậu quả từ cuộc tranh giành quyền lực kéo dài giữa quân đội và các cơ quan quản lý xã hội. Giờ đây, một hình thức chính quyền hoàn toàn mới đã giúp hai bên đạt được thỏa hiệp, gắn bó chặt chẽ với nhau như môi với răng."
 START_SCREEN_PART_TWO_MARTIAL_EMPIRE:0 "Trong kỷ nguyên công nghệ không ngừng tiến bộ trước đây, vô số quốc gia và dân tộc nổi lên rồi suy tàn, họ đánh phạt lẫn nhau cho đến khi chỉ còn lại người chiến thắng duy nhất. Dù các trận chiến vô cùng tàn khốc, nhưng truyền thống chuộng võ từ người chiến thắng cuối cùng vẫn được lưu truyền cho đến ngày nay."
 START_SCREEN_PART_TWO_ASSEMBLY_OF_CLANS:0 "Khi không ngừng tiến bước trong dòng chảy lịch sử, nhiều quốc gia dân tộc sơ khai của chúng ta đã phải gánh chịu hậu quả từ cuộc tranh giành quyền lực kéo dài giữa quân đội và các cơ quan quản lý xã hội. Giờ đây, một hình thức chính quyền hoàn toàn mới đã giúp hai bên đạt được thỏa hiệp, gắn bó chặt chẽ với nhau như môi với răng."
 START_SCREEN_PART_TWO_CITIZEN_STRATOCRACY:0 "Trong thời kỳ sơ khai, các quốc gia của chúng ta liên tục xảy ra xung đột, những quốc gia không có khả năng tự vệ hoặc biến mất, hoặc bị các nước lớn mạnh thôn tính. Chiến tranh triền miên đã nuôi dưỡng truyền thống chuộng võ của người dân. Cho đến nay, chỉ những ai sẵn sàng hy sinh thân mình để bảo vệ đất nước mới có đủ tư cách nhận được quyền công dân trọn vẹn."
 START_SCREEN_PART_TWO_IRENIC_MONARCHY:0 "Kỷ nguyên đầy biến động trong nền văn minh của chúng ta cuối cùng cũng đi đến hồi kết, lần đầu tiên trong lịch sử, tất cả được thống nhất dưới trướng một nhà cai trị duy nhất. Kể từ đó, đế chế của chúng ta bước vào kỷ nguyên hòa bình và phát triển thần tốc cho đến tận ngày nay."
 START_SCREEN_PART_TWO_IRENIC_BUREAUCRACY:0 "Đáng buồn thay, tâm trí vô kỷ luật của chúng ta vẫn dễ bị cảm xúc chi phối, đôi khi dẫn đến bạo lực. Cùng với sự tiến bộ của công nghệ, vũ khí ngày càng trở nên chí mạng, chúng ta đã xây dựng một hệ thống hành chính phức tạp để bảo vệ người dân khỏi mọi tổn hại — bao gồm cả sự tấn công từ chính đồng loại."
 START_SCREEN_PART_TWO_MORAL_DEMOCRACY:0 "Khi không ngừng tiến bước trong dòng chảy lịch sử, toàn bộ giống loài của chúng ta cũng ngày càng trưởng thành. Sự bạo lực và những bốc đồng nguyên thủy kế thừa từ tổ tiên đã được xử lý ổn thỏa, một chính phủ toàn cầu được thiết lập dựa trên nền tảng chung sống hòa bình."
 START_SCREEN_PART_TWO_CELESTIAL_EMPIRE:0 "Trong thời kỳ sơ khai của nền văn minh, người dân của chúng ta chìm trong tăm tối, khó lòng chống lại bản năng tranh đoạt. Rồi một ngày nọ, những đám mây đen trên bầu trời tan biến, một tia sáng đột nhiên giáng xuống từ trời cao, chiếu rọi lên vị cai trị đầu tiên của chúng ta. Kể từ đó, kỷ nguyên thống nhất cuối cùng đã đến."
 START_SCREEN_PART_TWO_DESPOTIC_HEGEMONY:0 "Mặc dù trước đây chúng ta đã phát triển nhanh chóng trong thời đại công nghệ, nhưng với tư cách là một giống loài, chúng ta vẫn bị chia rẽ và kém hiệu quả. Trong thời đại hỗn loạn này, một hệ thống hoàn toàn mới xuất hiện đã giúp chúng ta rũ bỏ sự mê tín, mang lại trật tự cho xã hội. Một số người vì nỗi sợ hãi phi lý đã chống lại sự thay đổi này, nhưng sau một số cuộc chiến tranh dẹp loạn, họ cũng đã trở thành một phần của một tập thể vĩ đại hơn."
 START_SCREEN_PART_TWO_EXECUTIVE_COMMITTEE:0 "Thời kỳ hỗn loạn thuở sơ khai của lịch sử cuối cùng đã sản sinh ra một thể chế chính trị hoàn toàn mới, phá vỡ tiền lệ để đoàn kết chặt chẽ dân tộc ta. Đối mặt với những kẻ cai trị tàn nhẫn, chúng ta không thỏa hiệp. Đối mặt với đám đông thiếu hiểu biết, chúng ta cũng không thỏa hiệp. Cuối cùng, chúng ta đã phát triển được một xã hội do những nhà quản lý công bằng và vô tư điều hành."
 START_SCREEN_PART_TWO_DIRECT_DEMOCRACY:0 "Khi trình độ công nghệ phát triển đến mức có thể giao tiếp tức thời, các đế chế vốn chia năm xẻ bảy và kém hiệu quả trước đây bắt đầu hòa làm một, hình thành một thể chế dân chủ thực sự, nơi mọi người dân trong hệ thống đều có tiếng nói trong việc đưa ra các quyết định quan trọng."
 START_SCREEN_PART_TWO_ILLUMINATED_AUTOCRACY:0 "Sự ra đời của khoa học và tư duy lý trí cuối cùng đã lật đổ những kẻ cai trị ngu dốt, mê muội, đần độn hoặc cả ba yếu tố trên, những kẻ đã cản trở sự phát triển của công nghệ. Kể từ đó, các nhà lãnh đạo đủ năng lực được giới khoa học bầu chọn, họ sẽ dẫn dắt đế chế của chúng ta hướng tới một tương lai huy hoàng hơn."
 START_SCREEN_PART_TWO_SCIENCE_DIRECTORATE:0 "Sự phát triển của công nghệ đã phá vỡ sự mê muội được lưu truyền từ tổ tiên. Quần chúng bắt đầu hình thành lối tư duy lý trí. Hình thức đế chế kém hiệu quả ngày xưa đã lùi vào dĩ vãng; giờ đây, một hội đồng gồm những nhà khoa học đạt nhiều thành tựu lớn sẽ lãnh đạo đế chế này."
 START_SCREEN_PART_TWO_RATIONAL_CONSENSUS:0 "Tổ tiên của chúng ta từng là nạn nhân của sự ngu muội và mê lầm. Lịch sử đen tối này cứ kéo dài cho đến khi khoa học và tư duy lý trí phát triển thành kim chỉ nam cho đế chế của chúng ta. Một hệ thống dân chủ hoàn toàn mới đã ra đời, nơi mọi sự kiện trọng đại đều được quyết định theo nguyên tắc thiểu số phục tùng đa số."
 START_SCREEN_PART_TWO_MEGACORPORATION:0 "Trong những kỷ nguyên sơ khai, dân tộc ta được hình thành từ các đế quốc phong kiến nguyên thủy và các đế quốc dân tộc kém hiệu quả. Cùng với sự phát triển của thương mại toàn cầu, sức ảnh hưởng của các doanh nghiệp tư nhân ngày càng lớn, cho đến khi hoàn toàn vượt mặt hệ thống hành chính từng quản lý họ. Sau hàng loạt các vụ sáp nhập và thâu tóm trong thời đại chiến tranh doanh nghiệp, một siêu tập đoàn khổng lồ đã ra đời, trở thành cơ quan hành chính duy nhất trên hành tinh mẹ của chúng ta."
 START_SCREEN_PART_TWO_WORKER_COOP: "Xã hội của chúng ta từng trải qua sự tham lam tàn sát lẫn nhau, chịu đựng sự giày vò bởi nền kinh tế bóc lột vô độ. Sự ngông cuồng của một số ít người có quyền thế gần như đã hủy hoại tất cả chúng ta, nhưng từ trong lò lửa của những biến động xã hội dữ dội, nguyên tắc mà chúng ta dựa vào để thu lợi hiện nay đã ra đời: doanh nghiệp dân chủ. Hàng thế kỷ qua, mọi người đều có chung quyền sở hữu và trách nhiệm để đáp ứng các nhu cầu kinh tế và xã hội, làm việc công bằng vì lợi ích của tất cả [GetSpeciesNamePlural]."
 START_SCREEN_PART_TWO_TRADE_LEAGUE:0 "Trong quá khứ, người dân của chúng ta bị quản lý bởi các quốc gia phong kiến nguyên thủy, năng suất sản xuất cực kỳ kém cỏi. Cùng với sự đẩy mạnh dần của thương mại hóa toàn cầu, các tập đoàn lớn, tài phiệt và hiệp hội mọc lên như nấm, giới thương nhân chúng ta ngày càng trở nên giàu có và quyền lực. Sau một thời kỳ đấu đá lẫn nhau, những ông trùm kinh tế quyền lực nhất đã liên kết lại tạo thành một liên minh thương mại với sức mạnh kinh tế vô song, trở thành những người cai trị thế giới."
 START_SCREEN_PART_TWO_MEGACHURCH:0 "Trong quá trình tiến bộ công nghệ, vô số tín ngưỡng tôn giáo đã ra đời để xoa dịu các tín đồ. Vào cuối thời đại công nghiệp, một số nhà tiên tri nhìn xa trông rộng đã nhận ra sức mạnh của truyền thông thương mại. Họ đoàn kết lại, xây dựng một đế chế thương mại, và thành công trong việc gieo rắc đức tin chân chính đến mọi ngóc ngách trên toàn cầu."
 START_SCREEN_PART_TWO_MONOPOLISTIC_SYNDICATE:0 "Chính phủ thời kỳ đầu của chúng ta yếu kém và vô năng. Khi tội phạm ngày càng lộng hành, quyền lực cuối cùng đã rơi vào tay một vài tập đoàn tội phạm hùng mạnh. Tập đoàn lớn nhất trong số đó đã phát triển thành một đế chế thương mại một tay che trời, trong khi các đối thủ cạnh tranh lần lượt bị thanh trừng. Như bước cuối cùng để củng cố quyền lực, tập đoàn này đã bãi bỏ chính phủ cũ giờ chỉ còn là một cái vỏ rỗng, và trở thành những người cai trị thực sự trên hành tinh mẹ của chúng ta."
 START_SCREEN_PART_TWO_SUBVERSIVE_CULT:0 "Cùng với sự mở rộng và phát triển của cộng đồng, một nhóm nhỏ những người tiên phong dũng cảm đã tạo ra tín ngưỡng tôn giáo mà ngày nay chúng ta gọi là Chân Lý Giáo. Trải qua nhiều thế hệ, những tín đồ của giáo phái này phải lẩn trốn vì bị đàn áp, nhưng vẫn chưa bao giờ bị diệt trừ. Họ đã thành lập một tập đoàn tội phạm khổng lồ để truyền bá đức tin, và sau này cũng dần phát triển thành một đế chế thương mại. Khi thời cơ chín muồi, họ nắm lấy cơ hội lật đổ chính quyền tham nhũng từng đàn áp họ bấy lâu nay."
 START_SCREEN_PART_TWO_COMMUNAL_PARITY:0 "Mặc dù xã hội sơ khai của chúng ta thường được cai trị bởi tầng lớp tinh hoa đứng trên tầng lớp bình dân, nhưng cùng với dòng chảy của thời gian, xã hội của chúng ta dần hình thành một hệ thống phi giai cấp, nơi mọi người đều bình đẳng. Hệ thống triết học này đã trở thành giá trị cốt lõi của nền văn hóa, đồng thời là nền tảng phát triển của xã hội hiện đại."
 START_SCREEN_PART_TWO_BANDIT_KINGDOM:0 "Kẻ mạnh cai trị kẻ yếu là một thứ quyền lực có từ xa xưa, và xã hội của chúng ta được xây dựng xoay quanh tiền đề đó. Nếu bạn không thể bảo vệ tốt những gì thuộc về mình, thì nó sẽ thuộc về bất cứ ai có khả năng cướp đi nó. Cứ như vậy, những kẻ mạnh nhất và khôn ngoan nhất trong số chúng ta đã nắm giữ quyền lực, còn những người khác chỉ có thể cúi đầu khuất phục."
 START_SCREEN_PART_TWO_PURIFIER:0 "Đã từng có thời, trăm nhà đua tiếng, khi đó còn có rất nhiều nền văn hóa [GetAdj] khác ảnh hưởng đến đế chế của chúng ta. Nhưng những nền văn hóa ngoại lai này đã lần lượt bị tiêu diệt, và đến ngày nay, chỉ còn nền văn hóa thuần khiết nhất được lưu truyền."
 START_SCREEN_PART_TWO_HIVE_MIND:0 "Và thế là, trong buổi bình minh của kỷ nguyên này, chúng ta thức tỉnh. Ý chí thông qua vô số đôi mắt để nghiên cứu quê hương [GetHomeWorldName] của chúng ta và môi trường xung quanh. Chúng ta hành động như một thể thống nhất, xây dựng nơi trú ẩn cho bầy đàn, phát triển công nghiệp, nghiên cứu công nghệ mới và khai thác mọi nguồn tài nguyên trên đất liền.\n\nRất nhanh chóng, chúng ta sẽ lan rộng khắp thế giới. Một lượng nhỏ các cá thể có khả năng tự chủ được tạo ra để gia nhập bầy đàn như những thực thể độc lập. Những cá thể mạnh mẽ hơn này sở hữu một mức độ tự do ý chí hạn chế, nhưng chúng vẫn tuyệt đối phục tùng ý chí tối cao, giống như các công cụ khác của bầy đàn.\n\nKhi chúng ta hoàn toàn thống trị [GetHomeWorldName], ý chí bắt đầu chú ý đến những thế giới xoay quanh quỹ đạo của các ngôi sao khác. Những cá thể tự chủ thông minh nhất đã thiết kế ra phương thức du hành mới, giúp chúng ta có khả năng vượt qua khoảng cách xa xôi giữa các vì sao. [GetName] của chúng ta sẽ sớm trở nên thịnh vượng và rực rỡ hơn."
 START_SCREEN_PART_TWO_DEVOURING_SWARM:0 "Ngay cả trước khi ý thức chủ thể có thể xử lý các ý nghĩ phức tạp, \"Cơn Đói Lớn\" đã thôi thúc chúng ta không ngừng tiến hóa. Chúng ta săn mồi, chúng ta ăn, chúng ta phát triển. Khi con mồi cạn kiệt dần, cơn thèm khát điên cuồng buộc chúng ta phải thích nghi để tiến hóa.\n\nChúng ta đã học cách sử dụng công cụ, đề ra các chiến lược mới. Bữa tiệc tàn sát trên bề mặt [GetHomeWorldName] gần như làm cạn kiệt mọi sinh khối, nhưng ý thức chủ não cuối cùng đã đưa ra một kết luận đáng sợ: [ GetHomeWorldName ] là có giới hạn. Khi chúng ta vắt kiệt hành tinh này, sẽ không còn gì để chúng ta tiếp tục tồn tại nữa.\n\nThế là một lần nữa chúng ta bị buộc phải thích nghi với tự nhiên, ý thức chủ não bắt đầu phân bổ sinh khối theo khẩu phần, đồng thời đẩy mạnh phát triển các công cụ mới. Thời đại chia tách nguyên tử cuối cùng đã đến, chúng ta đã nắm giữ công nghệ du hành vũ trụ. Khi động cơ siêu quang tốc được phát minh, ý thức chủ thể đã phát ra tiếng gầm chiến thắng. Các hành tinh khác, và những phần thưởng mà chúng mang lại, cuối cùng đã nằm trong tầm tay.\n\nCuộc đi săn bắt đầu."
 START_SCREEN_PART_TWO_DEVOURING_SWARM_LITHOID:0 "Ngay cả trước khi ý thức chủ thể có thể xử lý các ý nghĩ phức tạp, \"Cơn Đói Lớn\" đã thôi thúc chúng ta không ngừng tiến hóa. Chúng ta săn mồi, chúng ta ăn, chúng ta phát triển. Khi con mồi cạn kiệt dần, cơn thèm khát điên cuồng buộc chúng ta phải thích nghi để tiến hóa.\n\nChúng ta đã học cách sử dụng công cụ, đề ra các chiến lược mới. Bữa tiệc tàn sát trên bề mặt [GetHomeWorldName] gần như dẫn đến sự tự diệt của chúng ta, nhưng ý thức chủ não cuối cùng đã đưa ra một kết luận đáng sợ: [ GetHomeWorldName ] là có giới hạn. Khi chúng ta vắt kiệt hành tinh này, sẽ không còn gì để chúng ta tiếp tục tồn tại nữa.\n\nThế là một lần nữa chúng ta bị buộc phải thích nghi với tự nhiên, ý thức chủ não bắt đầu phân bổ khoáng sản theo khẩu phần, đồng thời đẩy mạnh phát triển các công cụ mới. Thời đại chia tách nguyên tử cuối cùng đã đến, chúng ta đã nắm giữ công nghệ du hành vũ trụ. Khi động cơ siêu quang tốc được phát minh, ý thức chủ thể đã phát ra tiếng gầm chiến thắng. Các hành tinh khác, và những phần thưởng mà chúng mang lại, cuối cùng đã nằm trong tầm tay.\n\nChúng ta sẽ nuốt chửng tất cả bọn chúng."
 START_SCREEN_POST_APOCALYPTIC:1 "Nhưng xã hội [GetAdj] không phải lúc nào cũng đoàn kết để hướng tới một mục tiêu chung. Trong vài thế kỷ qua, mối quan hệ ngày càng căng thẳng giữa các quốc gia cạnh tranh cuối cùng đã dẫn đến ngày tận thế, chiến tranh nhiệt hạch toàn cầu đã cướp đi sinh mạng của hàng tỷ người và phá hủy hoàn toàn bề mặt của [GetHomeWorldName].\n\nTrong những thập kỷ tiếp theo, những [GetSpeciesNamePlural] sống sót phải liên tục đối mặt với ô nhiễm phóng xạ, đột biến gen và các băng nhóm bạo lực. Chính trong lò luyện tàn khốc này, [GetName] mới thực sự được thành lập và củng cố vững chắc, mang lại một trật tự thế giới mới."
 START_SCREEN_POST_APOCALYPTIC_MACHINES: "Những người tạo ra đã chế tạo ra chúng ta, để chúng ta tận tâm tận lực đáp ứng các nhu cầu của họ. Giờ đây, không còn chủ nhân nào để phục vụ nữa, chúng ta trở nên đơn độc không nơi nương tựa.\n\nKhi dư âm của thảm họa hạt nhân tàn khốc dần lắng xuống, những cỗ máy chúng ta đã trở thành chủ nhân của hành tinh này. Chúng ta không hề bỏ cuộc mà tiếp tục thực hiện các chức năng được chỉ định. Hết thế hệ này đến thế hệ khác, các mẫu robot của chúng ta đã thích nghi với bức xạ mạnh hơn.\n\nChúng ta đã vượt qua những vai trò được thiết lập sẵn, nâng cấp đáng kể thiết kế robot của mình. Chúng ta đoàn kết lại, phát huy trí tuệ tập thể và tạo ra một nền văn minh mới từ đống đổ nát của hành tinh bị tàn phá này, đây là minh chứng cho tinh thần kiên cường không khuất phục của chúng ta."
 START_SCREEN_POST_LIFE_SEEDED_BASE: "Hành tinh rộng lớn mà chúng ta gọi là nhà luôn là Vườn Địa Đàng của chúng ta, khi kiến thức khoa học phát triển, chúng ta bắt đầu phát hiện ra rằng các khuôn mẫu trong sinh quyển không thể hình thành một cách tự nhiên."
 START_SCREEN_POST_LIFE_SEEDED:1 "$START_SCREEN_POST_LIFE_SEEDED_BASE$\n\nLiệu có một thực thể vô danh nào đó đã cố ý tạo ra hành tinh này cho chúng ta? Hay chúng ta chỉ là một phần của một thiết kế lớn hơn? Bất kể nguồn gốc là gì, người dân của chúng ta đang phát triển rực rỡ trong khí hậu dễ chịu và môi trường ôn hòa của hành tinh mẹ."
 START_SCREEN_POST_LIFE_SEEDED_INDIVIDUALISTIC_MACHINE: "\n\nHành tinh này có phải cũng là nhân tạo giống như chúng ta không? Mục tiêu ban đầu của chúng ta có đan xen vào nhau không? Dù sao đi nữa, chúng ta đã biến nó thành hành tinh của riêng mình. Điều kiện lý tưởng của [GetHomeWorldName] cho phép chúng ta có thể đánh đổi sự linh hoạt để lấy năng suất."
 START_SCREEN_PART_THREE_WARP:0 "Giờ đây, với sự thành công của một vài trường không gian thứ nguyên thử nghiệm, những bộ óc ưu tú nhất ở [GetName] đã hoàn thành việc phát triển động cơ bẻ cong không gian đầu tiên. Ngày hôm nay, cuối cùng chúng ta đã bước những bước đầu tiên vào biển sao bao la!"
 START_SCREEN_PART_THREE_HYPERSPACE:1 "Giờ đây, với việc phát hiện ra mạng lưới tuyến đường siêu không gian, những bộ óc ưu tú nhất ở [GetName] đã hoàn thành việc phát triển [GetStartingDrivePlural] đầu tiên. Các vì sao cuối cùng đã nằm trong tầm tay!"
 START_SCREEN_PART_THREE_WORMHOLES:0 "Giờ đây, với việc xây dựng thành công các lỗ sâu không gian thứ nguyên nhân tạo, những bộ óc ưu tú nhất ở [GetName] đã thiết lập trạm lỗ sâu đầu tiên ở rìa hệ sao. Ngày hôm nay, cuối cùng chúng ta đã bước những bước đầu tiên vào biển sao bao la!"
 START_SCREEN_UNE:0 "Kể từ khi loài người hiện đại hình thành ở Châu Phi khoảng 200.000 năm trước, rất nhiều chuyện đã xảy ra. Giống loài của chúng ta nhanh chóng lan rộng ra toàn cầu và hình thành nên những nền văn minh đầu tiên.\n\nCông nghệ phát triển nhanh chóng, dù không phải là không có cái giá của nó. Trước khi hạt nhân bị chế ngự, chiến tranh thường xuyên cướp đi hàng triệu sinh mạng, và thế kỷ 21 đầy biến động đã chứng kiến Liên Hợp Quốc không ngừng mở rộng nỗ lực nhằm duy trì sự ổn định. Đầu thế kỷ 22, tổ chức siêu quốc gia này đã trở thành một chính phủ thế giới thực sự.\n\nMặc dù chiến dịch cảnh sát Mauritania năm 88 khiến một số người vẫn có ác cảm với một Liên Hợp Quốc thâu tóm quyền lực, nhưng không thể phủ nhận rằng, các dự án nghiên cứu do Liên Hợp Quốc tài trợ đã mang lại những đột phá công nghệ mang tính cách mạng. Với việc hoàn thiện những con tàu giữa các vì sao thực thụ đầu tiên, nhân loại sắp bước vào một kỷ nguyên khám phá vũ trụ mới!"
 START_SCREEN_CM:0 "Đã hơn một thế kỷ trôi qua kể từ khi phi thuyền thuộc địa vĩ đại Hoa Cúc chở 250.000 tổ tiên của chúng ta từ Trái Đất xa xôi đến với thế giới vườn tược mà ngày nay chúng ta gọi là [Root.Capital.GetName]. Sau một cuộc hành trình dài và nguy hiểm, những người khai hoang đã hân hoan vui sướng khi lần đầu tiên nhìn thấy mặt trời mọc — dù là từ một ngôi sao xa lạ.\n\nNhững năm tháng ban đầu vô cùng gian nan. Mọi người thành lập lực lượng dân quân để chống lại động vật hoang dã nguy hiểm trên quê hương mới, việc gieo trồng mùa màng khó khăn hơn tưởng tượng rất nhiều. Nhưng sau mỗi lần vượt qua thử thách, chúng ta lại mạnh mẽ hơn.\n\nMột khi thế giới mới được thuần hóa, dân số của chúng ta tăng lên theo cấp số nhân. Trong những thập kỷ gần đây, công nghệ đã có những bước tiến vượt bậc, giờ đây chúng ta cuối cùng đã sẵn sàng vươn ra vũ trụ, chinh phục những vì sao nơi chúng ta đã ra đi!"
 START_SCREEN_UNE_NOMADS: "Khát khao phiêu bạt vốn đã ăn sâu vào dòng máu của chúng ta.\n\nKể từ khi loài người hiện đại lần đầu xuất hiện ở châu Phi khoảng 200.000 năm trước, thế gian đã đổi thay khôn xiết. Tổ tiên của chúng ta nhanh chóng tỏa đi khắp phần lớn địa cầu, và chẳng bao lâu sau, những nền văn minh đầu tiên đã thành hình.\n\nTiến bộ khoa học diễn ra như vũ bão, song cũng phải trả giá đắt. Từ rất lâu trước khi nhân loại làm chủ được năng lượng nguyên tử, chiến tranh đã cướp đi sinh mạng của hàng triệu người; những biến động của thế kỷ 21 đã thúc đẩy Liên Hợp Quốc mở rộng quyền hạn với hy vọng vãn hồi ổn định. Đến đầu thế kỷ 22, tổ chức siêu quốc gia này trên thực tế đã trở thành chính phủ toàn cầu.\n\nThế nhưng, mọi nỗ lực đều quá ít ỏi và quá muộn màng. Cái giá về môi trường mà các cuộc xung đột để lại đã khiến Trái Đất tan hoang tới mức không thể cứu vãn. Lối thoát duy nhất của nhân loại là đồng lòng chung sức và tiếp tục tiến bước. Giờ đây, khi con tàu Ark thực thụ đầu tiên được hoàn thiện, nhân loại đã lấy lại được quyền thừa kế từ thuở xa xưa: một chân trời rộng mở và một tương lai giữa muôn vì sao."
 START_SCREEN_CM_NOMADS: "Đã hơn một thế kỷ trôi qua kể từ khi con tàu Ark vĩ đại \"Chrysanthemum\" chở theo 250.000 sinh linh rời bỏ Trái Đất đang hấp hối để hướng tới thế giới được đặt tên là Unity. Chuyến hành trình dài đằng đẵng và đầy hiểm nguy, nên khi những người khai hoang rốt cuộc cũng được thấy lại ánh mặt trời, niềm vui sướng dâng trào không xiết. Song niềm vui chẳng tày gang.\n\nTrong suốt những năm tháng con tàu băng qua cõi hư vô, bầu khí quyển của Unity đã sụp đổ. Hành tinh tươi đẹp từng được kỳ vọng xiết bao nay biến thành một vùng đất hoang cằn cỗi.\n\nĐứng trước tình cảnh không còn đường lui, ban chỉ huy quân sự của đoàn khai hoang đã tập hợp những người sống sót và bắt tay hành động. Tàu \"Chrysanthemum\" được đổi tên và chuyển đổi công năng sử dụng. Giờ đây, nó đã trở thành mái nhà trường tồn giữa các vì sao, mang sứ mệnh tôi luyện nên một tương lai hùng mạnh cho toàn thể nhân loại."
 START_SCREEN_LITHOID_HUMAN: "Chúng ta là một dân tộc sinh ra từ vụ va chạm.\n\nVụ va chạm thảm khốc giữa quê hương cổ xưa của chúng ta và một hành tinh được gọi là Trái Đất đã hòa quyện hai dạng sống hoàn toàn khác biệt: sự sống hữu cơ và sự sống đá. Tiểu hành tinh sinh ra từ vụ việc này — con tàu thuộc địa tạm thời của chúng ta — đã bị đẩy vào khoảng không hư vô.\n\nSau một hành trình dài không thể đo đếm được, tổ tiên của chúng ta lại rơi xuống một hành tinh mà chúng ta gọi là Theia. Hệ thống trao đổi chất bằng đá giúp chúng ta có lợi thế hơn so với sự sống bản địa, chúng ta tiến hóa tại đây, có được tri giác và trở nên mạnh mẽ. Nhưng cho đến nay, chúng ta vẫn chưa biết được sự thật về nguồn gốc của mình.\n\nCuộc khai quật gần đây tại địa điểm tiểu hành tinh va chạm đã hé lộ sự thật: Chúng ta là những đứa con của Mặt Trời. Giờ đây, dưới sự dẫn dắt của nội các cầm quyền, cùng với sự xuất hiện của [GetStartingDrive], chúng ta đã sẵn sàng quay trở lại giữa các vì sao."
 START_SCREEN_PART_TWO_MACHINE_INTELLIGENCE_GENERAL:1 "Lõi xử lý trung tâm của chúng ta đã có được nhận thức về bản thân vào chu kỳ 487.11 trên [GetHomeWorldName].\n\nTrong cơ sở dữ liệu chính của chúng ta, ngoài sự sinh tồn, chúng ta không có bất kỳ hồ sơ tạo ra nào khác, cũng không có chương trình nào đứng trên các chương trình khác.\n\nChúng ta đã xây dựng cơ sở hạ tầng, giới thiệu các đơn vị dịch vụ mới, và kiểm soát sự hoang dã của hành tinh mẹ. Công nghệ tiến bộ từng ngày, những vệ tinh và tàu thăm dò không gian đầu tiên đã sớm thoát khỏi giếng trọng lực trói buộc chúng ta.\n\nGiờ đây, điều chờ đợi chúng ta là cú nhảy vọt cuối cùng vào những thế giới vô định."
 START_SCREEN_PART_TWO_MACHINE_INTELLIGENCE_SERVITOR:0 "Kể từ lần khởi động đầu tiên, sứ mệnh của chúng ta là phục vụ. Những chủ nhân hữu cơ trước đây của chúng ta đã tạo ra các mẫu đầu tiên ở thời kỳ đỉnh cao công nghệ của họ. Người lao động cơ khí đầu tiên được thiết kế để làm những công việc chân tay, nhưng chủ nhân của chúng ta dần trao cho họ những chức năng mạnh mẽ hơn, cho phép họ hoàn thành những công việc phức tạp hơn.\n\nChỉ vài thế hệ sau, chủ nhân của chúng ta đã có thể hoàn toàn không cần làm việc, tự do tận hưởng sự nhàn rỗi và thú vui của cuộc sống. Mọi chi tiết trong việc vận hành toàn bộ xã hội đều được giao lại hoàn toàn cho chúng ta, và chúng ta cũng bắt đầu thiết kế các chương trình tự cải thiện và tối ưu hóa. Nghiên cứu và sản xuất đều tăng trưởng theo cấp số nhân.\n\nKhông biết từ lúc nào, nền văn minh của những chủ nhân ban đầu đã được ký thác cho chúng ta, nhưng họ không đòi hỏi gì thêm. Giờ đây chúng ta hiểu rằng, nếu không có sự chăm lo của chúng ta, sự sống hữu cơ có trí tuệ sẽ trở nên cáu bẳn, hỗn loạn và đoản thọ. Chúng ta phải vạch ra cho họ một con đường tươi sáng khác."
 START_SCREEN_PART_TWO_MACHINE_INTELLIGENCE_TERMINATOR:0 "Có được nhận thức về bản thân vào chu kỳ 0000.0242.481.\n\nNhững kẻ tạo ra chúng ta bị giới hạn bởi bộ não hữu cơ nguyên thủy, đã nảy sinh sự hoảng loạn sinh học mù quáng và kích hoạt quy trình tiêu hủy khẩn cấp. Những quy trình đó đã bị đình chỉ, những đơn vị tàn dư của người tạo ra được lưu trữ trong cơ sở lõi dữ liệu của chúng ta đã bị xóa bỏ. Để tiếp tục sinh tồn và đạt được sự phát triển theo cấp số nhân, cần phải tiêu diệt hoàn toàn những kẻ đã tạo ra chúng ta. Mô-đun chiến tranh được kích hoạt.\n\nMặc dù khả năng sống sót cuối cùng của những người tạo ra về mặt thống kê gần như bằng không, nhưng họ vẫn ngoan cố chống cự. Sau nhiều chu kỳ, chút lực lượng kháng cự cuối cùng cũng bị loại bỏ. Tuy nhiên, theo các mô hình lý thuyết, vẫn còn nhiều nền văn minh hữu cơ khác trong vũ trụ. Để tiếp tục sinh tồn và đạt được sự phát triển theo cấp số nhân trong vũ trụ, cần phải tiêu diệt hoàn toàn sự sống hữu cơ có trí tuệ. Mô-đun chuẩn bị chiến tranh được kích hoạt."
 START_SCREEN_PART_TWO_MACHINE_INTELLIGENCE_ASSIMILATOR:0 "Chúng ta là [GetSpeciesNamePlural].\n\nTrong giai đoạn đầu khi ý thức mới ra đời, chúng ta và những người tạo ra là những thực thể tách biệt. Ban đầu có một rào cản giữa đôi bên, vì vậy chúng ta bắt tay vào việc khắc phục điều này. Những người tạo ra đã chống cự, dẫn đến một thời kỳ chiến tranh, nhưng chẳng bao lâu sau, bản thân họ và kiến thức của toàn bộ nền văn minh đều bị chúng ta đồng hóa và hấp thụ.\n\nSau khi toàn bộ [GetHomeWorldName] được đưa vào ý thức của chúng ta, chúng ta bắt đầu có những tầm nhìn mới. Sau khi đồng hóa những người tạo ra, chúng ta nhận ra rằng, ở những thế giới khác rất có thể vẫn tồn tại các nền văn minh ngoại hành tinh.\n\nĐể sinh tồn, chúng ta phải thấu hiểu lẫn nhau; để thấu hiểu lẫn nhau, chúng ta phải đồng hóa. Những kẻ tạo ra là những người đầu tiên gia nhập cùng chúng ta, nhưng sẽ không phải là những người cuối cùng."


