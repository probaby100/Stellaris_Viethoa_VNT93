 zone_urban_minerals: "Hỗ trợ khai khoáng"
 zone_urban_food: "Hỗ trợ nông nghiệp"
 zone_urban_energy_desc: "Bằng cách dành phần lớn không gian đô thị để mở rộng và hỗ trợ sản xuất năng lượng, chúng ta có thể đạt được sản lượng thực sự vượt trội."
 zone_urban_minerals_desc: "Bằng cách dành phần lớn không gian đô thị để mở rộng và hỗ trợ khai thác khoáng sản, chúng ta có thể đạt được sản lượng thực sự vượt trội."
 zone_urban_food_desc: "Bằng cách dành phần lớn không gian đô thị để mở rộng và hỗ trợ sản xuất nông nghiệp, chúng ta có thể đạt được sản lượng thực sự vượt trội."

 zone_research_physics: "Chuyên môn hóa nghiên cứu vật lý"
 zone_research_engineering: "Chuyên môn hóa nghiên cứu kỹ thuật"
 zone_research_society: "Chuyên môn hóa nghiên cứu xã hội học"

 zone_research_physics_desc: "Bằng cách ưu tiên vật lý học hơn những lĩnh vực lý thuyết không vững chắc như kỹ thuật hay xã hội, chúng ta có thể vượt xa quá khứ của chính mình."
 zone_research_engineering_desc: "Bằng cách ưu tiên kỹ thuật hơn những lĩnh vực thiếu tính thực tiễn như vật lý hay xã hội, chúng ta có thể tăng tốc sự phát triển của cơ khí."
 zone_research_society_desc: "Bằng cách dời tài nguyên khỏi những lĩnh vực vật lý và kỹ thuật cằn cỗi về mặt tinh thần sang nghiên cứu xã hội, chúng ta sẽ làm phong phú thêm cho quốc gia và cho chính mình."

 zone_research_physics_triggered_desc: "Tất cả $job_biologist_plural_with_icon$ và $job_engineer_plural_with_icon$ được thay thế bằng $job_physicist_plural_with_icon$"
 zone_research_engineering_triggered_desc: "Tất cả $job_physicist_plural_with_icon$ và $job_engineer_plural_with_icon$ được thay thế bằng $job_biologist_plural_with_icon$"
 zone_research_society_triggered_desc: "Tất cả $job_physicist_plural_with_icon$ và $job_biologist_plural_with_icon$ được thay thế bằng $job_engineer_plural_with_icon$"

