 casus_belli_cb_claim_acquire_hint:0 "\n§EĐưa ra tuyên bố §Hchủ quyền§! đối với một hệ sao của mục tiêu sẽ nhận được §Hlý do chiến tranh§! §Y$casus_belli_cb_claim$§!.§!"
