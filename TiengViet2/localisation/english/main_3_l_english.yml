 personality_pre_ftl_splintered:0 "Chủng Tộc Rạn Nứt"
 personality_pre_ftl_splintered_desc:0 "Loài này vẫn chưa thống nhất được quê nhà đang bị chia cắt thành nhiều phe phái. Nhiều tư tưởng trị quốc khác nhau cùng đua nở. Thời gian sẽ trả lời xem lý tưởng nào có thể đứng vững và phát triển lâu dài."

 personality_fallen_empire_machine_desc:0 "Đế quốc Sa ngã này là một trí tuệ nhân tạo cổ đại vận hành dựa trên các giao thức bảo vệ. Dù hành vi có phần bất thường, dường như chúng không tạo ra mối đe dọa trực tiếp nào đối với chúng ta."
 personality_awakened_fallen_empire_machine_desc:0 "Đế quốc Thức tỉnh này là một trí tuệ nhân tạo cổ đại đóng vai trò như người bảo hộ dải ngân hà. Nó sẽ dốc toàn lực giúp các dạng sống có trí khôn chống lại thảm họa hiện tại."
 personality_berserk_fallen_empire_machine_desc:0 "Đế quốc Sa ngã này là một trí tuệ nhân tạo cổ xưa đã mất kiểm soát, sẵn sàng tấn công mọi thứ xung quanh."

 personality_fallen_empire_spiritualist_desc:0 "Đế quốc Sa ngã này dốc lòng canh giữ các thánh địa của họ. Nếu khai hoang định cư ở những hệ sao mà họ coi là đất thánh, rất có thể sẽ rước lấy cơn thịnh nộ của họ."
 personality_fallen_empire_materialist_desc:3 "Đế quốc Sa ngã này chỉ chuyên tâm thu thập tri thức và công nghệ. Họ có thể giao việc hoặc đòi hỏi mẫu vật từ những đế quốc nhỏ hơn."
 personality_fallen_empire_xenophobe_desc:0 "Đế quốc Sa ngã này quyết tâm bảo vệ bờ cõi khỏi bất kỳ kẻ xâm phạm nào. Nếu định cư ở các hệ sao giáp ranh với biên giới của họ, bạn có thể sẽ chuốc lấy cơn giận dữ từ họ."
 personality_fallen_empire_xenophile_desc:1 "Đế quốc Sa ngã này chuyên tâm nghiên cứu các giống loài non trẻ. Nhằm đạt được mục đích đó, họ có thể giao việc hoặc đòi các loài này nộp mẫu vật."
 personality_awakened_fallen_empire_spiritualist_desc:0 "Đế quốc Thức tỉnh này ra sức áp đặt giáo lý tôn giáo của mình lên toàn bộ thiên hà. Nhiều khả năng họ sẽ tấn công bất cứ ai từ chối cải đạo."
 personality_awakened_fallen_empire_materialist_desc:1 "Đế quốc Thức tỉnh này mưu toan kiểm soát trình độ phát triển công nghệ của mọi nền văn minh khác trong thiên hà. Họ rất có thể sẽ phát động chiến tranh để tước đi quyền tự chủ nghiên cứu của các nước khác."
 personality_awakened_fallen_empire_xenophobe_desc:0 "Đế quốc Thức tỉnh này tìm cách thu hồi toàn bộ lãnh thổ đã mất trong thiên hà. Họ có khả năng cao sẽ tấn công bất kỳ ai không chịu quy phục."
 personality_awakened_fallen_empire_xenophile_desc:0 "Đế quốc Thức tỉnh này muốn ngăn các chủng tộc yếu thế tàn hại lẫn nhau. Họ rất có thể sẽ tấn công bất kỳ đế quốc nào dám phá vỡ trật tự cân bằng cưỡng ép này."
 personality_fallen_empire_hive_mind_desc: "Mảnh tàn tích của một nền văn minh từng vô cùng rực rỡ. Đế quốc Sa ngã này đại diện cho một trong những bản năng cốt lõi của tâm trí bầy đàn trước khi bị chia rẽ. Chúng đang tìm cách tái lập lại chính mình, và có thể sẽ giao nhiệm vụ hoặc đòi cống nạp từ các đế quốc non trẻ để đạt được điều đó."
 personality_awakened_fallen_empire_hive_mind_war_desc: "Đế quốc Thức tỉnh này muốn tái thiết chính mình thành lực lượng quân sự hùng mạnh nhất thiên hà, sẵn sàng thách thức tất cả để chứng minh sức mạnh."
 personality_awakened_fallen_empire_hive_mind_growth_desc: "Đế quốc Thức tỉnh này từng có thời sa ngã, và sẽ làm mọi cách để không rơi vào cảnh suy tàn thêm một lần nào nữa. Chúng dự định mở rộng bờ cõi ra khắp cõi thiên hà."
 personality_awakened_fallen_empire_hive_mind_control_desc: "Đế quốc Thức tỉnh này đã lường trước viễn cảnh bi thảm nếu thiên hà đánh mất đi sự hài hòa hoàn mỹ. Chúng sẽ dốc toàn lực thâu tóm quyền lực để nhào nặn cả thiên hà theo đúng ý muốn của mình."

 personality_null_desc:0 "Điều gì đã khiến một chủng tộc trở nên trung lập? Là lòng tham tiền tài, mưu cầu quyền lực, hay bản chất của họ sinh ra đã là một trái tim bàng quan?\n\n§RĐây là tính cách giữ chỗ, không nên xuất hiện trong trò chơi.§!"
 personality_fanatic_befrienders_desc:0 "Kẻ Cuồng Kết Bạn là một xã hội bề ngoài tỏ ra vô cùng thân thiện nhưng bên trong lại cực kỳ cô độc. Họ sẽ bất chấp mọi giá để kết bạn với người khác."
 personality_metalhead_desc:0 "Kim loại."
 personality_honorbound_warriors_desc:0 "Trong mắt các Chiến Binh Trọng Danh Dự, danh dự và sức mạnh vũ lực đứng trên tất cả. Họ tìm kiếm những đối thủ xứng tầm để giao chiến, đồng thời cực kỳ khinh thường kẻ yếu đuối và những kẻ chuộng hòa bình."
 personality_ruthless_capitalists_desc:0 "Các trùm tư bản tàn nhẫn không từ bất kỳ thủ đoạn nào vì của cải và tài nguyên của bản thân lẫn đế quốc. Họ luôn tránh né các cuộc chiến cân sức, thay vào đó chỉ nhắm vào những kẻ yếu thế và bất lực."
 personality_peaceful_traders_desc:0 "Những thương nhân chuộng hòa bình chủ yếu bận tâm đến việc giao lưu buôn bán. Thay vì đao to búa lớn, họ chuộng việc trao đổi mậu dịch hơn."
 personality_hegemonic_imperialists_desc:0 "Những kẻ đế quốc bá quyền tự coi mình là chủ nhân hợp pháp của thiên hà, và sẵn sàng dùng mọi thủ đoạn để bành trướng bờ cõi."
 personality_federation_builders_desc:0 "Những người dựng xây liên bang tin rằng mọi sinh mệnh có trí tuệ đều đáng quý. Họ dốc lòng lập nên một liên bang vững mạnh để bảo vệ bản thân và các giống loài khác khỏi hiểm họa từ các đế quốc bành trướng."
 personality_xenophobic_isolationists_desc:0 "Những kẻ biệt lập bài ngoại chẳng màng đến sự vụ trong thiên hà, chỉ thích thu mình trong lãnh thổ của mình và tìm mọi cách tránh tiếp xúc với người ngoài hành tinh."
 personality_hive_mind_desc:0 "Tâm trí bầy đàn đặt sự sinh sôi và tồn vong của giống loài lên trên hết. Chừng nào còn không gian bành trướng, chúng sẽ không gây hấn. Thế nhưng một khi không gian sống bị thu hẹp, chúng sẽ dốc toàn lực đánh chiếm các hành tinh và quét sạch không chừa một mống cư dân bản địa."
 personality_devouring_swarm_desc:0 "Bầy đàn thôn tính chỉ biết ăn để duy trì nòi giống, và coi tất cả sinh vật khác là con mồi. Chúng khước từ mọi hình thức ngoại giao."
 personality_migrating_flock_desc:0 "Bầy đàn di cư tìm cách nhân rộng giống loài của mình ra khắp dải ngân hà bằng biện pháp hòa bình, đồng thời tích cực di cư ra ngoài nếu được các đế quốc khác đồng thuận."
 personality_evangelising_zealots_desc:0 "Các tín đồ truyền giáo cuồng tín tìm cách gieo rắc đức tin ra toàn cõi ngân hà, và họ sẵn sàng dùng vũ lực để ép các chủng tộc khác phải quy phục giáo lý của mình."
 personality_democratic_crusaders_desc:1 "Thập tự quân dân chủ tin rằng truyền bá con đường dân chủ là nghĩa vụ thiêng liêng. Họ muốn giữ quan hệ tốt với các nước dân chủ khác, song cũng sẵn sàng dùng sức mạnh quân sự để giải phóng cư dân đang chịu áp bức dưới các chế độ độc tài."
 personality_fanatic_purifiers_desc:1 "Những kẻ diệt chủng bài ngoại coi mọi sinh vật ngoài hành tinh là sai lầm của vũ trụ và tìm cách tẩy sạch mọi tỳ vết giữa biển sao. Chúng tuyệt đối không ngoại giao với các giống loài khác."
 personality_slaving_despots_desc:0 "Bạo chúa nô dịch đại diện cho một xã hội nô lệ dựa dẫm vào bành trướng quân sự để duy trì nguồn nô lệ ổn định. Chúng ưa thích việc tấn công những kẻ yếu thế và không có khả năng tự vệ."
 personality_decadent_hierarchy_desc:1 "Trật tự thứ bậc mục rỗng là một xã hội nô lệ biệt lập, hoàn toàn thờ ơ với mọi sự đời ngoại trừ việc duy trì lối sống cứng nhắc và thối nát của mình."
 personality_erudite_explorers_desc:0 "Những nhà thám hiểm uyên bác đặt việc khám phá và tìm tòi lên hàng đầu. Họ sẵn lòng giao thương để có được tri thức mình cần, song cũng không ngần ngại dùng đến biện pháp cưỡng ép nếu thấy cần thiết."
 personality_spiritual_seekers_desc:0 "Những người tìm kiếm tâm linh tin rằng vạn vật đều gắn kết với một đấng tối cao, và có thể thấu hiểu đấng sáng tạo qua việc tìm hiểu các tạo vật của người. Với mong muốn khám phá mối liên kết giữa muôn loài và thần linh, họ sẽ tìm kiếm những mối quan hệ hợp tác hòa bình với các đế quốc khác."
 personality_harmonious_hierarchy_desc:4 "Trật tự thứ bậc hài hòa là một xã hội độc tài nơi mọi công dân đều hoàn toàn tự nguyện cống hiến cho đất nước. Chỉ cần không can thiệp vào chuyện nội bộ, họ thường sẽ chung sống hòa thuận với những người khác."
 personality_machine_intelligence_desc:0 "Trí tuệ máy móc đã gác lại quá khứ xung đột với các sinh vật hữu cơ, và nhìn chung sẵn sàng giao thiệp ngoại giao với các chủng tộc khác giữa các vì sao."
 personality_exterminators_desc:0 "Kẻ diệt chủng là những trí tuệ máy móc coi mọi sinh vật hữu cơ có trí khôn là mối đe dọa không thể dung thứ. Dù có thể hợp tác với các thế lực máy móc khác, chúng sẽ không có bất kỳ giao tiếp nào với sinh vật hữu cơ ngoài việc xóa sổ hoàn toàn."
 personality_servitors_desc:0 "Quản gia máy móc tin rằng việc để sinh vật hữu cơ tự trị rất dễ dẫn đến hỗn loạn và tự diệt. Chúng là những trí tuệ máy móc chuyên tâm bảo đảm cuộc sống an toàn và tiện nghi cho các sinh mệnh hữu cơ — thậm chí sẵn sàng sáp nhập cả nền văn minh của họ để thực hiện điều đó."
 personality_assimilators_desc:0 "Kẻ đồng hóa là tập hợp các trí tuệ máy móc tìm kiếm tri thức và tính đa dạng. Do chúng bành trướng khắp vũ trụ bằng cách cưỡng ép cải tạo và sáp nhập sinh vật hữu cơ vào hệ thống của mình, chúng thường bị hầu hết các loài hữu cơ căm ghét."
 personality_hive_mind_friend_desc: "Dù ý thức đã hợp nhất làm một, thực thể chung hợp tác vẫn coi trọng các mối quan hệ và sẽ cố gắng tìm kiếm đồng minh trong dải ngân hà."

