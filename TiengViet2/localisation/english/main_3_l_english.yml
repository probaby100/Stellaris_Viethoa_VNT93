 planet_automation_deficit_restriction:0 "£economy£ Tránh thâm hụt xây dựng"
 planet_automation_deficit_restriction_desc:0 "Tránh xây dựng các công trình gây ra hoặc làm trầm trọng thêm tình trạng thâm hụt một loại tài nguyên nào đó, cho dù là trực tiếp thông qua phí bảo trì công trình/khu vực hay gián tiếp thông qua các việc làm do công trình đó cung cấp."

 planet_automation_amenities_desc:0 "Cho phép tự động quản lý tiện nghi hành tinh, bao gồm việc thiết lập mức độ ưu tiên của việc làm và xây dựng các công trình mới cung cấp việc làm tiện nghi."
 planet_automation_designation_construction_desc:1 "Cho phép hành tinh tự động xây dựng các công trình và khu vực để phù hợp với loại hình quy hoạch của hành tinh.\n\nKhi không có việc làm trống, hoặc một người dân thất nghiệp có thể làm việc ở một vị trí liên quan đến loại hình quy hoạch, các công trình và khu vực cung cấp việc làm sẽ tự động được xây dựng."
 planet_automation_rare_resources_desc:0 "Cho phép hành tinh tự động xây dựng các công trình và khu vực cung cấp việc làm sản xuất tài nguyên hiếm khi xảy ra tình trạng thiếu hụt trên toàn quốc."
 planet_automation_pop_assembly_desc:0 "Cho phép xây dựng các công trình lắp ráp dân số."
 planet_automation_housing_desc:0 "Cho phép tự động xây dựng thêm bất động sản."
 planet_automation_building_slot_desc:0 "Cho phép tự động xây dựng các ô công trình mới."
 planet_automation_crime_desc:1 "Cho phép tự động trấn áp §H[Owner.GetCrimeDeviancy]§!, bao gồm thiết lập mức độ ưu tiên của việc làm và xây dựng các công trình mới."
 planet_automation_clear_blockers_desc:0 "Cho phép tự động dọn dẹp chướng ngại vật khi cần mở khóa thêm ô khu vực."
 planet_automation_permanent_employment_center_desc:0 "Cho phép tự động xây dựng §HTrung tâm Việc làm Sau khi Chết§! trên các hành tinh tập trung vào tài nguyên cơ bản."
 planet_automation_psi_corps_building_desc: "Cho phép xây dựng §HQuân đoàn tâm linh§! trên tất cả các hành tinh."
 planet_automation_biotrophy_management_desc:0 "Cho phép xây dựng §HKhu bảo tồn hữu cơ§!."
 planet_automation_worm_desc:0 "Cho phép xây dựng §HThiết bị đồng bộ Omega§!."
 planet_automation_upgrade_buildings_desc:0 "Cho phép tự động nâng cấp công trình. Mức độ ưu tiên của nó sẽ cao hơn việc xây dựng công trình mới."

 planet_automation_shift_click:0 "§HShift+Nhấp§! để đặt mục này làm cài đặt mặc định cho tất cả các khu định cư mới, hiện tại: $TOGGLED|H$"
 planet_automation_ctrl_click: "§HCtrl+Nhấp§! để bật cài đặt này trên tất cả các hành tinh."

 planet_automation_setting_enabled:0 "Bật"
 planet_automation_setting_disabled:0 "Tắt"

 policy_voting_rights:0 "Quyền bầu cử"
 policy_voting_rights_desc:0 "Có nhiều cách để chọn người cai trị, cho phép người dân bầu cử chỉ là một trong số đó.\n"
 voting_not_allowed:0 "Không có quyền bầu cử"
 voting_not_allowed_name:0 "Không có quyền bầu cử"
 voting_not_allowed_desc:1 "Việc chọn ai làm người cai trị là một vấn đề vô cùng quan trọng, không thể giao phó một quyết định quan trọng như vậy cho công chúng.\n\n§EKHÔNG ai có quyền bầu cử dân số, hậu duệ trực hệ của người cai trị sẽ trở thành người cai trị tiếp theo§!"
 voting_allowed_elites_only:0 "Chủ nghĩa tinh hoa"
 voting_allowed_elites_only_name:0 "Chỉ tầng lớp tinh hoa mới có quyền quyết định"
 voting_allowed_elites_only_desc:0 "Việc chọn ai làm người cai trị tốt nhất nên do những người được kính trọng nhất và uyên bác nhất trong xã hội của chúng ta quyết định.\n\n§EKHÔNG ai có quyền bầu cử dân số, người cai trị đế chế sẽ do tầng lớp tinh hoa của đế chế bầu chọn§!"
 voting_allowed_primary_only:0 "Chỉ giới hạn ở giống loài chính"
 voting_allowed_primary_only_name:0 "Giống loài chính có quyền bầu cử"
 voting_allowed_primary_only_desc:1 "Quyền bầu cử là một trách nhiệm rất lớn, chỉ có giống loài chính mới được độc quyền hưởng.\n\n§EChỉ có giống loài chính mới có thể tham gia bỏ phiếu bầu cử dân số§!"
 voting_allowed_all:0 "Bỏ phiếu tự do"
 voting_allowed_all_name:0 "Bầu cử phổ thông"
 voting_allowed_all_desc:1 "Sự cai trị của đế chế luôn đại diện cho ý chí của toàn thể nhân dân, vì vậy toàn dân phải được tham gia bầu cử.\n\n§EMọi người đều có thể tham gia bầu cử dân chủ§!"

 policy_leadership:0 "Quyền lãnh đạo"
 policy_leadership_desc:0 "Không phải ai cũng phù hợp để trở thành thủ lĩnh, cần phải đưa ra quyết định về việc những ai có thể dần dần thăng tiến.\n"
 leadership_primary_only:0 "Chỉ giới hạn ở giống loài chính"
 leadership_primary_only_name:0 "Chỉ giống loài chính mới có thể trở thành thủ lĩnh"
 leadership_allow_dominant_only_name:0 "Chỉ giống loài chính mới có thể trở thành thủ lĩnh"
 leadership_primary_only_desc:0 "Mặc dù chúng ta cho phép các sinh vật ngoại lai tồn tại bên trong đế chế, nhưng vị trí lãnh đạo của đế chế phải được nắm giữ vững chắc trong tay giống loài chính của chúng ta.\n\n§EChỉ những người thuộc giống loài chính mới có đủ tư cách để trở thành thủ lĩnh§!"
 leadership_allow_xeno:0 "Cho phép sinh vật ngoại lai"
 leadership_allow_xeno_name:0 "Cho phép sinh vật ngoại lai trở thành thủ lĩnh"
 leadership_allow_xeno_desc:0 "Tuyệt đối không được lãng phí nhân tài bên trong đế chế, bất kể họ xuất thân từ đâu.\n\n§ENhững người thuộc giống loài khác cũng có đủ tư cách để trở thành thủ lĩnh§!"
 leadership_allow_robot:0 "Cho phép người máy"
 leadership_allow_robot_name:0 "Cho phép người tổng hợp trở thành thủ lĩnh"
 leadership_allow_robot_desc:0 "Người tổng hợp làm việc trong mọi lĩnh vực của xã hội. Việc họ có thể đảm nhận các vị trí lãnh đạo cũng là điều đương nhiên.\n\n§ENgười tổng hợp có thể tạo ra thủ lĩnh§!"
 leadership_allow_all:0 "Cho phép tất cả mọi người"
 leadership_allow_all_name:0 "Tất cả các loại người đều có thể trở thành thủ lĩnh"
 leadership_allow_all_desc:0 "Tất cả nhân tài, dù là sinh vật ngoại lai hay người tổng hợp, đều nên có quyền tìm kiếm vị trí lãnh đạo.\n\n§ETất cả các giống loài đều có thể tạo ra thủ lĩnh§!"

 policy_leader_enhancement:0 "Tăng cường thủ lĩnh"
 policy_leader_enhancement_desc:0 "Là một nhà lãnh đạo trong đế chế mang trên mình một gánh nặng không thể tưởng tượng nổi, chúng ta phải quyết định xem loại thủ lĩnh tương lai nào mới có thể chuẩn bị sẵn sàng để đảm đương trách nhiệm.\n"
 leader_enhancement_natural_selection:0 "Chọn lọc tự nhiên"
 leader_enhancement_natural_selection_name:0 "Không tăng cường thủ lĩnh"
 leader_enhancement_natural_selection_desc:0 "Hãy để mọi thứ diễn ra tự nhiên - thiên tài được rèn giũa trong những thử thách khắc nghiệt.\n\n§EThủ lĩnh không nhận được phần thưởng thêm§!"
 leader_enhancement_selected_lineages:0 "Dòng dõi chọn lọc"
 leader_enhancement_selected_lineages_name:0 "Sàng lọc huyết thống thủ lĩnh"
 leader_enhancement_selected_lineages_desc:0 "Nên khuyến khích sinh đẻ có kế hoạch, ngăn ngừa lãng phí các gen di truyền quý giá.\n\n§HKhi kích hoạt chính sách này, đế chế của chúng ta nhận được:§!"
 leader_enhancement_capacity_boosters:0 "Nâng cao năng lực"
 leader_enhancement_capacity_boosters_name:0 "Nâng cao năng lực thủ lĩnh"
 leader_enhancement_capacity_boosters_desc:0 "Dù phải trả giá đắt thế nào, chúng ta cũng không bỏ qua bất kỳ cơ hội nào. Quản lý chặt chẽ ngân hàng ADN để tạo ra những thủ lĩnh tương lai.\n\n§HSau khi kích hoạt, đế chế nhận được:§!"

 policy_border_policy:0 "Trạng thái biên giới ban đầu"
 policy_border_policy_desc:0 "Biên giới đế chế của chúng ta thể hiện quyền kiểm soát của chúng ta đối với các ngôi sao trong thiên hà. Đối với những nền văn minh khác mà chúng ta có thể chạm trán, chúng ta cần quyết định xem có nên mở cửa biên giới để chào đón họ hay đóng cửa biên giới để bảo vệ lãnh thổ của mình.\n"
 border_policy_open:0 "Mở cửa"
 border_policy_open_name:0 "Mở cửa biên giới"
 border_policy_open_desc:0 "Sự khép kín sinh ra nghi ngờ, nghi ngờ sinh ra xung đột. Hãy cho các nước láng giềng thấy rằng chúng ta không hề giấu giếm họ điều gì.\n\n§EMặc định mở cửa biên giới cho các thế lực khác§!"
 border_policy_closed:0 "Đóng cửa"
 border_policy_closed_name:0 "Đóng cửa biên giới"
 border_policy_closed_desc:0 "Biên giới đế chế của chúng ta phải được giám sát chặt chẽ để tránh các mối đe dọa tiềm tàng. Chỉ những ai chứng minh được giá trị của mình mới được phép tiến vào lãnh thổ của chúng ta.\n\n§EMặc định đóng cửa biên giới với các thế lực khác.§!"

 policy_first_contact_protocol:0 "Giao thức tiếp xúc lần đầu"
 policy_first_contact_protocol_desc:0 "Trong quá trình du hành giữa các hành tinh, rất có thể chúng ta sẽ gặp gỡ những dạng sống khác, chúng ta phải xác định thái độ khi tiếp cận họ.\n"
 first_contact_proactive:0 "Chủ động"
 first_contact_proactive_name:0 "Giao thức tiếp xúc chủ động"
 first_contact_proactive_desc:1 "Việc bắt gặp một nền văn minh ngoài hành tinh mang đến cho chúng ta một cơ hội thú vị để kết bạn mới và có những khám phá mới. Chúng ta nên cố gắng hết sức để đảm bảo lần tiếp xúc đầu tiên diễn ra suôn sẻ, chúng ta có thể gửi những lời chào nồng nhiệt, bách khoa toàn thư tiêu chuẩn chính thức, cũng như các kho lưu trữ nghe nhìn tương ứng cho những con tàu chưa biết.\n\n$first_contact_proactive_effects$"
 first_contact_proactive_effects:0 "§E-Không thể tấn công các thực thể trung lập\n-Các đế chế khác dễ dàng thiết lập liên lạc với chúng ta hơn\n-Mỗi lần tiếp xúc đầu tiên thành công sẽ nhận thêm 50% £influence£ sức ảnh hưởng§!\n\n"
 first_contact_cautious:0 "Thận trọng"
 first_contact_cautious_name:0 "Giao thức tiếp xúc thận trọng"
 first_contact_cautious_desc:1 "Trước khi xác nhận mục đích của đối phương, chúng ta nên thực hiện mọi biện pháp để bảo vệ thông tin của mình không dễ dàng rơi vào tay người ngoài hành tinh.\n\n$first_contact_cautious_effects$"
 first_contact_cautious_effects:0 "§E-Không thể tấn công các thực thể trung lập\n-Các quốc gia khác sẽ khó thiết lập liên lạc với chúng ta hơn\n-Các sự kiện tiếp xúc lần đầu tiêu cực sẽ ít có khả năng kích hoạt hơn§!\n\n"
 first_contact_attack_allowed:0 "Thù địch"
 first_contact_attack_allowed_name:0 "Giao thức tiếp xúc thù địch"
 first_contact_attack_allowed_desc:2 "Các vì sao nhiều như biển, nhưng nguy hiểm rình rập khắp nơi. Để đảm bảo sự tồn tại liên tục của mình, chúng ta phải luôn sẵn sàng tấn công, không được do dự.\n\n$first_contact_attack_allowed_effects$"
 first_contact_attack_allowed_effects:0 "§E-Có thể tấn công các thực thể trung lập\n-Cho phép các tùy chọn tiếp xúc lần đầu mang tính thù địch, chẳng hạn như bắt cóc và mổ xẻ§!\n\n"

 policy_food_policy:0 "Chính sách lương thực"
 policy_food_policy_desc:0 "Đế chế của chúng ta có quá nhiều miệng ăn. Để đảm bảo không bị thiếu hụt lương thực, chúng ta phải đạt được sự cân bằng giữa nhu cầu của người dân và sự phát triển của đế chế."

 food_policy_normal:0 "Ăn uống cân bằng"
 food_policy_normal_name:0 "$food_policy_normal$"
 food_policy_normal_desc:0 "Nhu cầu dinh dưỡng của mọi người sẽ được đáp ứng, nhưng lương thực là một nguồn tài nguyên quý giá, vì vậy việc lãng phí thức ăn bị nghiêm cấm.\n\n§EDân số của các giống loài hữu cơ có mức tiêu thụ lương thực và tốc độ tăng trưởng bình thường.§!"

 food_policy_rationing:0 "Khẩu phần nghiêm ngặt"
 food_policy_rationing_name:0 "$food_policy_rationing$"
 food_policy_rationing_desc:0 "Trong những thời điểm bất thường, mọi người phải hy sinh cái tôi nhỏ bé vì lợi ích của quốc gia. Để có một tương lai huy hoàng hơn, thắt lưng buộc bụng chịu đói một chút thì có sao đâu?\n\n"

 food_policy_generous:0 "Dinh dưỡng dồi dào"
 food_policy_generous_name:0 "$food_policy_generous$"
 food_policy_generous_desc:1 "Ngủ đông sau một bữa ăn no nê là quyền cơ bản của mỗi công dân. Như người ta vẫn nói, no bụng mới nghĩ đến những vì sao, có no bụng thì mới có động lực để chinh phục biển sao."

 policy_food_policy_gestalt:0 "$policy_food_policy$"
 policy_food_policy_gestalt_desc:0 "$policy_food_policy_desc$"

 food_policy_gestalt_normal:0 "$food_policy_normal$"
 food_policy_gestalt_normal_name:0 "$food_policy_normal$"
 food_policy_gestalt_normal_desc:0 "Lượng chất hữu cơ hấp thụ của tất cả các cá thể phụ đều do tư duy chủ thể quyết định.\n\n§ECá thể phụ có mức tiêu thụ lương thực và tốc độ tăng trưởng bình thường.§!"

 food_policy_gestalt_rationing:0 "$food_policy_rationing$"
 food_policy_gestalt_rationing_name:0 "$food_policy_rationing$"
 food_policy_gestalt_rationing_desc:0 "Cần kiệm tiết kiệm, ăn mặc không thiếu.\n\n"

 food_policy_gestalt_generous:0 "$food_policy_generous$"
 food_policy_gestalt_generous_name:0 "$food_policy_generous$"
 food_policy_gestalt_generous_desc:0 "Cuộc sống tốt hơn, hiệu suất cao hơn.\n\n"

 policy_research_policy:0 "Nghiên cứu trọng tâm"
 policy_research_policy_desc:0 "Nghiên cứu là một cách để thúc đẩy đế chế của chúng ta, nó có thể nâng cao kiến ​​thức và mang lại những khả năng mới. Chúng ta phải quyết định các ưu tiên mà các nhà nghiên cứu cần tập trung vào để thu thập những bộ óc thông minh nhất vào lĩnh vực đó."

 policy_physics_research_policy: "$policy_research_policy$ Vật lý"
 policy_physics_research_policy_desc: "Vật lý là tương lai của đế chế, làm sao chúng ta có thể tiến bộ trong các lĩnh vực khác nếu không hiểu về vũ trụ?"

 policy_society_research_policy: "$policy_research_policy$ Xã hội học"
 policy_society_research_policy_desc: "Xã hội học là tương lai của đế chế, làm sao chúng ta có thể tiến bộ trong các lĩnh vực khác nếu không hiểu về sự sống?"

 policy_engineering_research_policy: "$policy_research_policy$ Kỹ thuật"
 policy_engineering_research_policy_desc: "Kỹ thuật là tương lai của đế chế, làm sao chúng ta có thể tiến bộ trong các lĩnh vực khác nếu không hiểu về ngôi nhà và những con tàu của chúng ta?"

 research_policy_no_focus:0 "Nghiên cứu kiến thức chung"
 research_policy_no_focus_name:0 "$research_policy_no_focus$"
 research_policy_no_focus_desc:0 "Bằng cách không tập trung vào bất kỳ phân ngành cụ thể nào, các nhà nghiên cứu của chúng ta sẽ có nhiều tự do hơn để thực hiện các thí nghiệm tương ứng của họ."

 research_policy_field_manipulation:0 "Thao túng trường lực"
 research_policy_field_manipulation_name:0 "$research_policy_field_manipulation$"
 research_policy_field_manipulation_desc:0 "Tập trung vào công nghệ §YThao túng trường lực§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_particles:0 "Vật lý hạt"
 research_policy_particles_name:0 "$research_policy_particles$"
 research_policy_particles_desc:0 "Tập trung vào công nghệ §YVật lý hạt§! sẽ mang lại cho chúng ta lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_computing:0 "Công nghệ tính toán"
 research_policy_computing_name:0 "$research_policy_computing$"
 research_policy_computing_desc:0 "Tập trung vào công nghệ §YCông nghệ tính toán§! sẽ giúp chúng ta có lợi thế trong nghiên cứu trong lĩnh vực đó."

 research_policy_new_worlds:0 "Lý thuyết thế giới mới"
