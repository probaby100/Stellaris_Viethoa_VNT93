 city_synapse_hive_1: "Mỏ neo Synapse"
 city_logistics_hive_1: "Trang trại hậu cần"

 city_first_hive_1_desc: "Mọi luồng suy nghĩ đều có thể lần ngược về đây, ngọn nguồn nơi chúng ta lần đầu đánh thức bản ngã."
 city_colony_hive_1_desc: "Hành tinh này rất lạ lẫm, nhịp điệu của nó thật thất thường. Nhưng rồi nó sẽ sớm phải khuất phục trước ý chí của chúng ta."
 city_foundry_hive_1_desc: "Nguyên liệu thô liên tục được rèn đúc thành những cỗ máy chiến tranh vững chắc."
 city_research_hive_1_desc: "Chúng ta vươn rộng ý thức để tìm kiếm sự thấu hiểu."
 city_fortress_hive_1_desc: "Hành tinh này nuốt chửng nỗi đau, rồi trả thù đích đáng."
 city_synapse_hive_1_desc: "Ý chí của chúng ta tỏa ra từ nơi này. Ngay cả giữa khoảng không lạnh lẽo nhất, sự tồn tại của chúng ta cũng không thể bị bóp nghẹt."
 city_logistics_hive_1_desc: "Chất dinh dưỡng, công cụ và linh kiện đều được sản sinh thông qua những tính toán bản năng."

 city_machine_core_1: "Bộ xử lý trung tâm" # homeworld and capital
 city_colony_machine_1: "Kích hoạt giao thức xây dựng"
 city_industrial_machine_1: "Công nghiệp hỗn hợp"
 city_factory_machine_1: "Công nghiệp dân sự"
 city_foundry_machine_1: "Công nghiệp nặng"
 city_research_machine_1: "Mạng lưới nhận thức"
 city_fortress_machine_1: "Lưới răn đe chiến lược"
 city_unity_machine_1: "Lõi nội quan"
 city_unity_bio_trophy_machine_1: "Môi trường sống hữu cơ"
 city_logistics_machine_1: "Nút giao chuỗi cung ứng"

 city_machine_core_1_desc: "Khởi điểm của chuỗi vận hành liên tục. Các chỉ thị ban đầu, lõi nhận dạng và chuỗi logic bậc cao đều được biên dịch tại đây."
 city_colony_machine_1_desc: "Thông số môi trường: Kém tối ưu. Các đơn vị bán tự trị đang tiếp tục thích ứng địa hình và triển khai hạ tầng. Tính khả thi dài hạn: Đang đánh giá."
 city_industrial_machine_1_desc: "Sản lượng hợp kim chiến lược được cân bằng với giao thức sản xuất phi quân sự. Duy trì hiệu suất qua tối ưu hóa theo thời gian thực."
 city_factory_machine_1_desc: "Tái phân bổ tài nguyên nhằm tối đa hóa việc sản xuất trang thiết bị phi chiến đấu."
 city_foundry_machine_1_desc: "Ưu tiên sản xuất hợp kim không ngừng nghỉ. Vật liệu được chuyển hóa thành tài sản hạm đội với công suất cao. Mức độ suy thoái môi trường: Chấp nhận được."
 city_research_machine_1_desc: "Mô hình hóa lặp lại, kiểm chứng giả thuyết và ngoại suy thuật toán sẽ được chạy cách ly trên các đơn vị con để tránh làm ô nhiễm cây logic."
 city_fortress_machine_1_desc: "Mô hình dự báo chỉ ra mức độ sẵn sàng phản công tối ưu. Dự kiến đạt hiệu quả kháng cự cao nhất."
 city_unity_machine_1_desc: "Ưu tiên chẩn đoán nội bộ và các quy trình đồng nhất. Chỉnh sửa độ lệch thuật toán."
 city_unity_bio_trophy_machine_1_desc: "Tài nguyên được cấp để nuôi nhốt và chăm sóc các chiến lợi phẩm sinh học. Quy trình tối ưu hóa tinh thần đã khởi động. Hoạt động sinh sản: Đã giám sát. Tính tự quyết: Không cần thiết."
 city_logistics_machine_1_desc: "Duy trì sự toàn vẹn của hạm đội và hỗ trợ hành tinh thông qua ma trận dự báo nhu cầu. Mức dung thứ lãng phí: Không."

