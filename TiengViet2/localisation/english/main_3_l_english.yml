 feature_planetary_ftl_inhibitor:0 "Bộ Ức Chế FTL Hành Tinh"
 feature_planetary_ftl_inhibitor_desc:1 "Hành tinh sở hữu ít nhất một công trình £building£§Y$building_fortress$§! sẽ có khả năng ức chế động cơ FTL của quân địch."
 feature_alien_rulers:0 "Lãnh Đạo Ngoại Chủng"
 feature_alien_rulers_desc:0 "Cho phép các cá nhân thuộc giống loài ngoại lai trở thành ứng viên người trị vì quốc gia."
 feature_hyperlanes:0 "Hải Đồ Tuyến Siêu Không Gian"
 feature_hyperlanes_desc:0 "Cho phép khảo vẽ chi tiết từng tuyến siêu không gian trong hệ sao."
 feature_uplifting:0 "Khai Hóa Tiến Hóa"
 feature_uplifting_desc:0 "Cho phép tiến hành nâng cấp gen và hòa nhập xã hội đối với những giống loài cận thông tuệ."
 feature_basic_diplomacy:0 "Ngoại Giao Cơ Bản"
 feature_basic_diplomacy_desc:0 "Cho phép tiến hành các hoạt động ngoại giao cơ bản với các đế chế khác."
 feature_invitation_to_alliances:0 "Thiết Lập Đồng Minh"
 feature_invitation_to_alliances_desc:0 "Cho phép thành lập liên minh đồng minh với các đế chế khác."
 feature_vassalization_of_empires:1 "Cưỡng Chế Thần Phục"
 feature_vassalization_of_empires_desc:1 "Cho phép dùng vũ lực ép buộc các đế chế khác phải xưng thần khuất phục."
 feature_alien_leaders_recruitment:0 "Chiêu Mộ Lãnh Tụ Ngoại Chủng"
 feature_alien_leaders_recruitment_desc:0 "Cho phép chiêu mộ lãnh tụ từ các giống loài khác hiện diện trong đế chế."
 feature_federations_created:0 "Thành Lập Liên Bang"
 feature_federations_created_desc:0 "Cho phép chung tay sáng lập liên bang cùng các nước đồng minh và chư hầu."
 feature_modify_traits:0 "Biến Đổi Gen"
 feature_modify_traits_desc:0 "Cho phép chỉnh sửa các đặc tính di truyền của các giống loài trong đế chế."
 feature_advanced_gene_modding:0 "Tái Tổ Hợp Gen Cấp Cao"
 feature_advanced_gene_modding_desc:1 "Cho phép chúng ta loại bỏ các đặc tính có lợi, bổ sung các đặc tính bất lợi, đồng thời thay đổi diện mạo của giống loài trong quá trình chỉnh sửa."
 feature_habitability_gene_modding:0 "Biến Đổi Khả Năng Thích Nghi"
 feature_habitability_gene_modding_desc:0 "Cho phép chúng ta dùng liệu pháp biến đổi gen để thay đổi chủng loại hành tinh thích nghi của giống loài."
 feature_add_advanced_traits:0 "Đặc Tính Cấp Cao"
 feature_add_advanced_traits_desc:0 "Mở khóa thêm nhiều đặc tính di truyền cao cấp có thể gán cho giống loài khi cải tạo."
 feature_colonization:0 "Định Cư Thuộc Địa"
 feature_colonization_desc:0 "Cho phép đóng tàu thuộc địa dùng để tiến hành khai hoang định cư trên các hành tinh."
 feature_colony_ship_rushed:0 "Tàu Thuộc Địa Tư Nhân"
 feature_colony_ship_rushed_desc:0 "Cho phép đóng các tàu thuộc địa tư nhân do các thế lực ẩn danh tài trợ. Vì vậy, luồng tư tưởng của đoàn di dân có thể khác biệt so với tư tưởng chủ đạo."
 feature_forming_ships:0 "Biên Chế Hạm Đội"
 feature_forming_ships_desc:0 "Cho phép tổ chức các chiến hạm vào biên đội hạm đội."
 feature_production_credit:0 "Chuyên Môn Hóa Tín Dụng Năng Lượng"
 feature_production_credit_desc:0 "Cho phép hành tinh triển khai các dự án quy hoạch nhằm tối ưu hóa việc tạo ra Tín Dụng Năng Lượng."
 feature_individual_entreprises:0 "Doanh Nghiệp Tư Nhân"
 feature_individual_entreprises_desc:0 "Những cá nhân tự do chưa có việc làm sẽ tự vận hành các doanh nghiệp tư nhân để sản xuất Tín Dụng Năng Lượng."
 feature_wormhole_stations:0 "Trạm Lỗ Sâu"
 feature_wormhole_stations_desc:0 "Cho phép tàu công trình xây dựng các trạm trung chuyển lỗ sâu."
 feature_wormhole_capacity:0 "Dung Lượng Lỗ Sâu"
 feature_wormhole_capacity_desc:0 "Gia tăng giới hạn quy mô hạm đội và tầm vươn của lỗ sâu, đồng thời rút ngắn thời gian tái lập."
 feature_extended_wormhole:0 "Mở Rộng Lỗ Sâu"
 feature_extended_wormhole_desc:0 "Cho phép các hạm đội với quy mô bất kỳ có thể băng qua lỗ sâu. Nếu hạm đội vượt quá dung tích chịu tải, lỗ sâu sẽ sụp đổ ngay sau lượt dịch chuyển, và thời gian phục hồi sẽ kéo dài tương ứng với lượng tải vượt mức."
 feature_survey_planets:0 "Thiết Bị Cảm Biến Khảo Sát"
 feature_survey_planets_desc:0 "Cho phép tàu nghiên cứu tiến hành khảo sát các hành tinh ngay cả khi không có nhà khoa học chỉ huy."
 feature_sensor_range:0 "Tầm Quét Cảm Biến Thuộc Địa"
 feature_sensor_range_desc:0 "Gia tăng phạm vi phủ sóng cảm biến của thuộc địa."
 feature_evasion:0 "Né Tránh"
 feature_evasion_desc:0 "Gia tăng khả năng né tránh hỏa lực cho toàn bộ chiến hạm."
 feature_mechanical_trait:0 "Đặc Tính Cơ Khí"
 feature_mechanical_trait_desc:0 "Lực lượng quân đội được cấu thành từ các giống loài mang đặc tính người máy sẽ đồng thời nhận được đặc tính Cơ khí."
 feature_rebel_armies:0 "Quân Nổi Dậy"
 feature_rebel_armies_desc:0 "Các đạo quân phiến loạn nổ ra từ các cuộc khởi nghĩa của nô lệ sẽ sở hữu sức mạnh chiến đấu vượt trội hơn nhiều so với bình thường."
 feature_ftl_travel:0 "Du Hành Nhanh Hơn Ánh Sáng"
 feature_ftl_travel_desc:0 "Hệ thống cơ sở nền tảng bắt buộc phải có cho mọi hình thức du hành vượt tốc độ ánh sáng."
 feature_pop_self_modification:1 "Tự Biến Đổi Gen"
 feature_pop_self_modification_desc:0 "Quần thể cư dân sẽ có khả năng tự phát điều chỉnh bộ gen để thích nghi và sinh tồn tốt hơn trong các môi trường khắc nghiệt."
 feature_advanced_gov_forms:0 "Chính Thể Cấp Cao"
 feature_advanced_gov_forms_desc:0 "Cho phép đế chế tiến hành cải cách sâu rộng, mở khóa toàn bộ các thể chế chính quyền cấp cao."
 feature_build_terraform_station:1 "Cải Tạo Địa Hình"
 feature_build_terraform_station_desc:1 "Cho phép chúng ta tiến hành cải tạo địa hình quy mô lớn trên các hành tinh."
 feature_megaengineering:0 "Phục Hưng Siêu Công Trình"
 feature_megaengineering_desc:0 "Cho phép chúng ta phục hồi và tu bổ các siêu công trình vũ trụ đã bị đổ nát."
 feature_terraform_inhabited:0 "Thích Ứng Sinh Thái Thuộc Địa"
 feature_terraform_inhabited_desc:0 "Cho phép chúng ta tiến hành cải tạo địa hình ngay trên các hành tinh đã có cư dân sinh sống."
 feature_xeno_integration:0 "Hòa Nhập Ngoại Chủng"
 feature_xeno_integration_desc:1 "Cho phép chúng ta ban phát đầy đủ quyền công dân cho các giống loài ngoại tộc."
 feature_spaceport_level_2:0 "Cảng Không Gian Cấp II"
 feature_spaceport_level_2_desc:0 "Cảng không gian có thể nâng cấp để gắn §Y2§! mô-đun và mở khóa khả năng đóng tàu khu trục."
 feature_spaceport_level_3:0 "Cảng Không Gian Cấp III"
 feature_spaceport_level_3_desc:0 "Cảng không gian có thể nâng cấp để hỗ trợ §Y3§! mô-đun."
 feature_spaceport_level_4:0 "Cảng Không Gian Cấp IV"
 feature_spaceport_level_4_desc:0 "Cảng không gian có thể nâng cấp để gắn §Y4§! mô-đun và mở khóa khả năng đóng tuần dương hạm."
 feature_spaceport_level_5:0 "Cảng Không Gian Cấp V"
 feature_spaceport_level_5_desc:0 "Cảng không gian có thể nâng cấp để hỗ trợ §Y5§! mô-đun."
 feature_spaceport_level_6:0 "Cảng Không Gian Cấp VI"
 feature_spaceport_level_6_desc:0 "Cảng không gian có thể nâng cấp để gắn §Y6§! mô-đun và mở khóa khả năng đóng thiết giáp hạm."
 feature_tech_automated_exploration:0 "$AUTO_EXPLORE_ORDER$"
 feature_tech_automated_exploration_desc:0 "$AUTO_EXPLORE_ORDER_DESC$"
 feature_bliss_standard:0 "Lạc Thú Hóa Học"
 feature_bliss_standard_desc:0 "Cho phép chúng ta áp dụng mức sống §YLạc Thú Hóa Học§! cho cư dân."

 feature_robots:0 "Lao Động Người Máy"
 feature_robots_desc:1 "Người máy là những cỗ máy cơ giới tương đối sơ đẳng; chúng sở hữu năng lực xử lý ngôn ngữ cơ bản nhưng chưa có trí tuệ tự chủ.\n\n§EKhi sở hữu công nghệ §Y$tech_robotic_workers$§!, cư dân cơ giới chỉ có thể đảm nhận các chức nghiệp thuộc tầng lớp £pop_cat_worker£§Y$pop_cat_worker$§!.§!"
 feature_droids:0 "Lao Lực Droid"
 feature_droids_desc:1 "Droid là những cỗ máy phức tạp hơn, thường được cài đặt nhân cách định sẵn nhằm phụng sự chủ nhân với hiệu suất tối ưu.\n\n§EKhi sở hữu công nghệ §Y$tech_droid_workers$§!, cư dân cơ giới giờ đây có thể đảm đương các công việc thuộc tầng lớp £pop_cat_specialist£§Y$pop_cat_specialist$§!.\n\nMột số công việc chuyên gia phức tạp, ví dụ như £job_researcher£§YNhà nghiên cứu§!, chỉ có thể do Droid đảm nhận khi trí tuệ nhân tạo không bị bài xích hoặc cấm đoán.§!"
 feature_synths:0 "Lao Lực Synth"
 feature_synths_desc:1 "Synth là những cỗ máy vô cùng tinh vi. Bộ não positron của chúng tương thích với trí tuệ nhân tạo cấp độ 7, mang lại nhận thức tự chủ toàn diện.\n\n§EKhi nghiên cứu thành công công nghệ §Y$tech_synthetic_workers$§!, cư dân máy móc sẽ bị ảnh hưởng bởi chỉ số £happiness£§YĐộ hạnh phúc§! và có thể đảm nhiệm mọi loại £job£§YChức nghiệp§!.\n\nChúng chỉ có thể làm việc ở tầng lớp £pop_cat_ruler£§Y$pop_cat_ruler$§! khi chính sách được đặt thành §YTrí Tuệ Nhân Tạo Có Đầy Đủ Quyền Công Dân§!.§!"
 feature_robot_leaders:0 "Lãnh Tụ Synth"
 feature_robot_leaders_desc:0 "Cho phép cư dân Synth nắm giữ các chức vị lãnh đạo trong đế chế."
 feature_modify_robots:0 "Cải Biên Cơ Giới"
 feature_modify_robots_desc:0 "Cho phép chúng ta thiết kế và chế tạo các mẫu dân số mang đặc tính $trait_mechanical$ chuyên dụng."
 feature_modify_robots_desc_machine_intelligence:0 "Cho phép chúng ta thiết kế và chế tạo các đơn vị dân số mang đặc tính $trait_machine_unit$ và $trait_mechanical$ chuyên biệt."
 feature_wormhole_stabilization:0 "Hàng Hải Ổn Định Lỗ Sâu"
 feature_wormhole_stabilization_desc:0 "Cho phép tàu thuyền của bạn băng qua các lỗ sâu tự nhiên."
 feature_gateway_activation:0 "Kích Hoạt Cổng Sao"
 feature_gateway_activation_desc:0 "Cho phép chúng ta tái kích hoạt các cổng sao và mở đường cho tàu bè di chuyển xuyên không."
 feature_gateway_construction:0 "Xây Dựng Cổng Sao"
 feature_gateway_construction_desc:0 "Cho phép chúng ta tái thiết các cổng sao đổ nát cũng như xây dựng các cổng sao hoàn toàn mới."
 feature_unity_ambitions:0 "Tham Vọng Đoàn Kết"
 feature_unity_ambitions_desc:0 "Mở khóa chuỗi §YSắc lệnh§! vô cùng quyền uy nhưng đắt đỏ được gọi là Tham Vọng Đoàn Kết."
 feature_campaign_edicts:0 "Sắc Lệnh Chiến Dịch Vận Động"
 feature_campaign_edicts_desc:2 "Mở khóa các sắc lệnh đặc thù gọi là §YChiến dịch§!, tiêu tốn Tín Dụng Năng Lượng thay vì điểm Đoàn kết."
 feature_jump_method:0 "Hàng Hải Bước Nhảy"
 feature_jump_method_desc:0 "Mở khóa hành động hạm đội §HKích Hoạt Bước Nhảy§!, cho phép các chiến hạm trang bị động cơ bước nhảy dịch chuyển tức thời đến bất kỳ hệ sao nào trong tầm với mà không cần phụ thuộc vào mạng lưới siêu không gian."

 ####################################
 # Mission
 ####################################
 MISSION_CIV_NAME:0 "$CIVILIZATION$ (§Y$AGE$§!)"
 mission_no_observation:1 "Đại Sứ Quán Ngoại Giao"
 mission_no_observation_desc:1 "Trạm không gian này hiện đóng vai trò như một cơ quan ngoại giao, điều phối các mối bang giao chính thức lẫn những tương tác bí mật với nền văn minh bên dưới bề mặt."
 mission_passive_observation:0 "Quan Sát Bị Động"
 mission_passive_observation_desc:2 "Duy trì khoảng cách an toàn để tiến hành nghiên cứu người bản địa trong bóng tối, dốc toàn lực ngăn ngừa ô nhiễm văn hóa.\n\n$observation_infiltration_effects$[GetPassiveObservationInsights]\n\n"
 mission_specimen_collection:0 "Quan Sát Chủ Động"
 mission_specimen_collection_desc:2 "Tiến hành thu thập thông tin và nghiên cứu sâu rộng nhằm nắm bắt tường tận đặc tính sinh học cùng diện mạo văn hóa của cư dân bản địa, thường xuyên bắt giữ các mẫu vật sống.\n\n$observation_infiltration_effects$[GetAggressiveObservationInsights]\n§ENhiệm vụ này có thể mang lại những hậu quả khó lường§!\n\n"
 observation_infiltration_effects:0 "Sản lượng tài nguyên từ nhiệm vụ quan sát phụ thuộc vào §YCấp Độ Thâm Nhập§! của §YMạng Lưới Điệp Báo§! được thiết lập trên nền văn minh tiền FTL đang theo dõi."
 native_indoctrination:0 "Nhiệm vụ $mission_native_indoctrination$"
 mission_native_indoctrination:0 "Giáo Hóa"
 mission_native_indoctrination_desc:0 "Dùng các biện pháp mưa dầm thấm lâu tác động vào xã hội và văn hóa để các giống loài nguyên thủy dần dà tiếp nhận phương thức tư duy của chúng ta.\n\n§ENhiệm vụ này sẽ khiến giống loài nguyên thủy dần chuyển hóa sang tư tưởng chủ đạo của ta.§!\n\n"
 mission_technological_enlightenment_0:1 "Khai Sáng Công Nghệ"
 mission_technological_enlightenment_0_desc:3 "Nền văn minh bản địa sẽ được dìu dắt lên kỷ nguyên không gian trong thời gian ngắn nhất; thời lượng tiêu tốn sẽ phụ thuộc vào trình độ công nghệ thực tế của họ.\n\n§EKhi tiến trình nâng cấp hoàn tất, họ sẽ §Rnắm quyền kiểm soát hoàn toàn hệ sao quê hương của mình§!, trở thành một nền văn minh du hành vũ trụ và quy phục làm nước bảo hộ của chúng ta§!\n\n"
 mission_technological_enlightenment_1:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_1_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_2:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_2_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_3:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_3_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_4:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_4_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_5:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_5_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_6:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_6_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_7:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_7_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_8:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_8_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_technological_enlightenment_9:1 "$mission_technological_enlightenment_0$"
 mission_technological_enlightenment_9_desc:1 "$mission_technological_enlightenment_0_desc$"
 mission_covert_infiltration:0 "Bí mật thâm nhập"
 mission_covert_infiltration_desc:0 "Chỉnh sửa gen cho các đặc vụ để ngụy trang họ thành người bản địa, sau đó trà trộn và dần thâm nhập vào xã hội của họ. Những đặc vụ này sẽ từ từ thay thế các nhà lãnh đạo bản địa, dọn đường cho chúng ta sáp nhập hành tinh này.\n\nChỉ khi chuẩn bị chiếm đóng một thế giới văn minh công nghiệp thì mới đáng để sử dụng những thủ đoạn hành động phức tạp như vậy.\n\n§EKhi quá trình thâm nhập hoàn tất, hành tinh này sẽ được sáp nhập vào đế chế của chúng ta, đồng thời mang lại cho người bản địa sự gia tăng hạnh phúc lớn nhưng ngắn ngủi.§!\n\n"

 MISSION_HALTED:1 "§RNhiệm vụ tạm dừng:§! Thiếu §Y$MISSING$§!"
 MISSION:0 "Nhiệm vụ:"

 ####################################
 # Army Attachments
 ####################################
 army_attachment_mobile_shield_generators:0 "Máy tạo lá chắn di động"
 army_attachment_mobile_shield_generators_desc:0 "§LMáy phát gắn trên xe bánh xích hạng nặng sẽ tạo ra trường lực bảo vệ trên chiến trường, lớp chắn này có hiệu quả phòng thủ xuất sắc trước pháo kích và oanh tạc quỹ đạo.§!"
 army_attachment_personal_shields:0 "Thiết bị lá chắn cá nhân"
 army_attachment_personal_shields_desc:0 "§LMáy tạo lá chắn này đủ nhỏ để binh lính có thể đeo trên lưng. Dù trường lực do nó tạo ra không thể trụ lâu trước hỏa lực liên tục, nhưng nó cũng giúp tăng đáng kể cơ hội sống sót của binh lính trên chiến trường.§!"
 army_attachment_military_police_corps:0 "Quân cảnh"
 army_attachment_military_police_corps_desc:0 "§LMột lực lượng quân cảnh đông đảo. Tác dụng ở tiền tuyến khá hạn chế, nhưng sự hiện diện của họ sẽ củng cố kỷ luật quân đội.§!"
 army_attachment_battle_strider_column:0 "Đội hình xe thiết giáp hai chân"
 army_attachment_battle_strider_column_desc:0 "§LXe thiết giáp hai chân có thể tác chiến trên hầu hết mọi địa hình. Mặc dù phần chân dễ bị nhắm mục tiêu, nhưng sự lanh lẹ và linh hoạt của chúng là một lợi thế lớn trên chiến trường.§!"
 army_attachment_hover_tank_battle_group:0 "Cụm xe tăng lơ lửng"
 army_attachment_hover_tank_battle_group_desc:0 "§LMột loại xe bọc thép mạnh mẽ và cơ động nhanh, sử dụng thiết bị nâng phản trọng lực để bay lơ lửng ngay sát mặt đất. Tuy điều này hạn chế trọng tải, nhưng chúng bù đắp lại bằng tốc độ và sự linh hoạt vượt trội so với xe bánh xích thông thường.§!"
 army_attachment_assault_landers:0 "Tàu đổ bộ đột kích"
 army_attachment_assault_landers_desc:1 "§LNhững tàu vận tải cỡ lớn này có nhiệm vụ đưa quân đội và khí tài hạng nặng xuống bề mặt hành tinh trong thời chiến mà không cần đến bến đỗ.§!"
 army_attachment_orbital_drop_pods:0 "Khoang thả quỹ đạo"
 army_attachment_orbital_drop_pods_desc:0 "§LKhoang thả cá nhân được phóng từ tàu vũ trụ trên quỹ đạo xuống bề mặt hành tinh. Tuy khí tài hạng nặng vẫn cần tàu đổ bộ, nhưng những khoang thả này giúp giảm đáng kể thời gian triển khai quân khi xâm lược hành tinh.§!"
 army_attachment_neo_concrete_fortifications:0 "Lô cốt tân bê tông"
 army_attachment_neo_concrete_fortifications_desc:0 "§LLớp bảo vệ mở rộng và mạng lưới hầm ngầm của các lô cốt mặt đất tân bê tông cung cấp thêm sự che chắn trước oanh tạc quỹ đạo. Điều này hạn chế tính cơ động của lục quân, nhưng lại là mấu chốt trong các chiến dịch phòng thủ.§!"
 army_attachment_self_replicating_mine_fields:0 "Bãi mìn tự nhân bản"
 army_attachment_self_replicating_mine_fields_desc:0 "§LCác quả mìn chôn ngầm và bán di động liên tục tự nhân bản để duy trì số lượng cần thiết. Việc rà phá những bãi mìn tự nhân bản này vô cùng khó khăn, nhất là giữa lúc giao tranh.§!"
 army_attachment_air_defense_artillery:0 "Pháo phòng không"
 army_attachment_air_defense_artillery_desc:0 "§LMột hệ thống vũ khí khổng lồ, có khả năng theo dõi và tấn công các mục tiêu di chuyển nhanh tiến vào bầu khí quyển của hành tinh.§!"
 army_attachment_chemical_stimulants:0 "Hóa chất kích thích"
 army_attachment_chemical_stimulants_desc:0 "§LMột hỗn hợp hóa chất mạnh, chuyên dùng để cường hóa khả năng nhận thức và phản xạ chiến đấu của binh lính. Có thể tạm thời tăng cường hiệu suất tác chiến, nhưng sử dụng liên tục dễ dẫn đến lo âu, trầm cảm, động kinh, buồn nôn, ảo giác, hôn mê và đại tiện mất tự chủ.§!"
 army_attachment_xeno_cavalry:0 "Kỵ binh ngoại lai"
 army_attachment_xeno_cavalry_desc:0 "§LNhững dã thú chiến tranh hung tợn này một khi được kỵ sĩ thuần hóa, sẽ trở thành thú cưỡi xuất sắc. Chúng có thể vượt qua gần như mọi địa hình, rất lý tưởng cho nhiệm vụ trinh sát và đột kích. Các dã thú lớn đôi khi còn được dùng làm bệ phóng vũ khí hạng nặng.§!"
 army_attachment_psi_warriors:0 "Chiến binh Tâm linh"
 army_attachment_psi_warriors_desc:0 "§LNhững chiến binh tinh nhuệ này luôn toát lên vẻ bí ẩn, họ tung hoành trên chiến trường nhờ năng lực tâm linh mạnh mẽ và thể chất cường tráng. Các chiến binh tâm linh cực kỳ thành thạo vũ khí cận chiến, họ thích áp sát và đánh giáp lá cà với kẻ thù.§!"
 army_attachment_gene_warrior_shock_troops:0 "Lính xung kích Chiến binh Gen"
 army_attachment_gene_warrior_shock_troops_desc:0 "§LĐây là những chiến binh dũng mãnh sở hữu năng lực vượt xa lính thường, họ thích hợp nhất cho các nhiệm vụ đột kích hoặc đánh úp ở những nơi chiến sự đang bế tắc. Một đội chiến binh gen đôi khi đủ sức lật ngược cả thế cờ.§!"
 army_attachment_power_armor:0 "Giáp động lực"
 army_attachment_power_armor_desc:0 "§LGiáp động lực có thể nâng tầm các năng lực bẩm sinh của binh sĩ, sau khi trang bị, cả sức bền lẫn sức mạnh đều tăng lên. Giáp động lực giúp họ mang vác được vũ khí nặng hơn, đồng thời bảo vệ tốt hơn trước bức xạ và tác nhân sinh hóa.§!"
 army_attachment_special_forces_group:0 "Đội đặc nhiệm"
 army_attachment_special_forces_group_desc:0 "§LNhững đặc vụ được đào tạo bài bản này chuyên tiến hành các chiến dịch phi truyền thống, thường bí mật thâm nhập sâu vào hậu phương địch, ưu tiên phá hủy thông tin liên lạc và hậu cần, đồng thời tìm cơ hội triệt hạ mọi mục tiêu giá trị.§!"
 army_attachment_shadow_assassins:0 "Sát thủ bóng đêm"
 army_attachment_shadow_assassins_desc:0 "§LNhững đặc vụ tinh nhuệ này mặc áo choàng tàng hình đắt tiền, lợi dụng công nghệ tàng hình để làm nhiệm vụ. Trừ khi bị méo ảnh nhẹ lúc di chuyển nhanh, mắt thường và hầu hết cảm biến đều không thể phát hiện ra họ. Họ là chuyên gia ám sát và thu thập tình báo quân sự bí mật.§!"
 army_attachment_cyborg_infiltration_unit:0 "Đội thâm nhập Cyborg"
 army_attachment_cyborg_infiltration_unit_desc:0 "§LBộ xương kim loại của những cỗ máy giết người này có thể tự do biến hình, giúp chúng ngụy trang thành bất kỳ loài nào sau khi ghép da thịt phù hợp (thường lấy từ tù binh) lên khung xương. Từ đó chúng thâm nhập phòng tuyến địch để gieo rắc sự hỗn loạn.§!"
 army_attachment_hunter_killer_drone_swarms:0 "Bầy Drone Thợ săn-Sát thủ"
 army_attachment_hunter_killer_drone_swarms_desc:0 "§LThả một lượng lớn bầy drone tương đối đơn giản vào vị trí địch nhằm mục đích chế áp. Tuy một chiếc drone đơn lẻ chẳng phải là mối đe dọa với một người lính được huấn luyện, nhưng hàng trăm hàng ngàn chiếc thì lại là chuyện khác.§!"
 army_attachment_combat_software_2:0 "Phần mềm tác chiến v2.0"
 army_attachment_combat_software_2_desc:0 "§LTiến hành một đợt nâng cấp toàn diện cho phần mềm chiến đấu của mọi đơn vị trong quân đội. Bản cập nhật bao gồm cải thiện thời gian phản ứng, thuật toán phân tích chiến thuật mới và vô số bản vá lỗi.§!"
 army_attachment_exploding_slave_collars:0 "Vòng cổ nô lệ phát nổ"
 army_attachment_exploding_slave_collars_desc:0 "§LNhững chiếc vòng cổ này được gắn lên nô lệ (vị trí cụ thể tùy thuộc vào cấu trúc cơ thể của chúng), nếu nô lệ dám cãi lời chủ nhân, vòng cổ có thể bị kích nổ từ xa. Một số chỉ huy còn cho nổ vòng cổ khi nô lệ đang áp sát địch, nhằm gây sát thương lớn.§!"
 army_attachment_slaver_raiding_teams:0 "Đội đột kích của Bọn buôn nô lệ"
 army_attachment_slaver_raiding_teams_desc:0 "§LNhững tiểu đội nô lệ này chủ yếu gồm các nô lệ đã được phóng thích, chuyên đánh du kích ở hậu phương địch và bắt thêm nô lệ mới. Số tù binh này sẽ bị đẩy ra tiền tuyến, đối đầu với chính những đồng đội cũ của chúng.§!"
 army_attachment_commissar_squads:0 "Đội Chính ủy"
 army_attachment_commissar_squads_desc:0 "§LDuy trì kỷ luật trong đội quân nô lệ là một nhiệm vụ khó nhằn, nhưng với các đội chính ủy thì chỉ là chuyện vặt. Bằng cách áp dụng luật sát nhất cảnh bá và nhiều hình phạt khắc nghiệt khác, lũ nô lệ sẽ sợ chính ủy hơn cả sợ địch.§!"
 army_attachment_clone_suicide_brigade:0 "Lữ đoàn Nhân bản Cảm tử"
 army_attachment_clone_suicide_brigade_desc:0 "§LNhân bản vô tính ra những lính này chỉ vì một mục đích duy nhất: tìm nơi địch tụ tập đông nhất, lẻn vào và tự bạo. Những hành vi kinh hoàng khó đoán này có thể giáng một đòn mạnh vào sĩ khí đối phương.§!"
 army_attachment_clone_commandos:0 "Biệt kích Nhân bản"
 army_attachment_clone_commandos_desc:0 "§LNuôi cấy những sát thủ phát triển nhanh này rất tốn kém, nhưng qua quá trình tinh chỉnh và huấn luyện khắc nghiệt, họ sẽ trở thành những quân nhân ưu tú. Họ có tính tự chủ cao hơn người nhân bản thông thường, thậm chí vài cá nhân còn bắt đầu hình thành những thói quen kỳ quặc.§!"
 army_attachment_hypnotic_training_regimen:0 "Chế độ huấn luyện thôi miên"
 army_attachment_hypnotic_training_regimen_desc:0 "§LĐể tối đa hóa sức chiến đấu của lính nhân bản, họ phải trải qua chế độ huấn luyện bằng thôi miên với cường độ cực cao. Dù việc bắt các đơn vị chiến đấu quá sức có thể dẫn đến suy sụp tinh thần, nhưng phương pháp này lại tiếp tục đẩy cao hiệu suất tác chiến.§!"
 army_attachment_psi_shield_specialists:0 "Chuyên gia Lá chắn Tâm linh"
 army_attachment_psi_shield_specialists_desc:0 "§LNhững đặc vụ được đào tạo bài bản với nhiệm vụ giăng lá chắn tâm linh mạnh mẽ bảo vệ quân ta trên chiến trường. Lớp khiên này có hiệu quả tương đương trường lực năng lượng truyền thống, nhưng cần tiêu tốn lượng lớn sự tập trung để duy trì.§!"
 army_attachment_telekinetic_specialists:0 "Chuyên gia Dịch chuyển bằng Ý nghĩ"
 army_attachment_telekinetic_specialists_desc:0 "§LNhững chuyên gia tâm linh có thiên phú đặc biệt về kỹ năng dịch chuyển đồ vật bằng ý nghĩ. Trong điều kiện thích hợp, họ có thể nhấc bổng kẻ thù và xe cộ ném lên không trung, hoặc quật phi cơ từ trên trời rớt xuống đất.§!"
 army_attachment_class_a_psi_operative:0 "Đặc vụ Tâm linh Hạng A"
 army_attachment_class_a_psi_operative_desc:0 "§LNhững cá nhân hiếm hoi sở hữu năng lực tâm linh cực mạnh, thường phải chịu đựng tác dụng phụ là chấn thương não bộ. Họ vô cùng nguy hiểm đối với bản thân và môi trường xung quanh, nhưng khi sức mạnh hủy diệt đó chĩa về phía kẻ thù, họ là một vũ khí tối thượng.§!"
 army_attachment_infestation_brood:0 "Ký sinh trùng Lây nhiễm"
 army_attachment_infestation_brood_desc:0 "§LSau khi được thả ra, những ký sinh trùng tàn bạo này sẽ lập tức bám lấy vật chủ để sinh sản. Chúng sẽ nhân lên với cấp số nhân, đủ để hủy diệt cả một thành phố trong vài ngày. Khỏi phải nói, đòn đánh tâm lý giáng vào kẻ địch cũng là chí mạng.§!"
 army_attachment_brood_coordinator:0 "Kẻ điều phối Bầy đàn"
 army_attachment_brood_coordinator_desc:0 "§LSinh vật khổng lồ giống con sên này được nuôi đằng sau chiến tuyến để điều phối đủ loại quái vật trong quân đoàn ngoại lai. Nó dùng tín hiệu tâm linh sơ cấp để giao tiếp với cả bầy. Ngoài thứ mùi thối hoắc, nó còn thường xuyên khiến người canh giữ bị đau đầu như búa bổ.§!"
 army_attachment_battle_worms:0 "Sâu Đào hầm"
 army_attachment_battle_worms_desc:0 "§LNhững loài động vật không xương sống khổng lồ đã qua biến đổi gen này có khả năng đào sâu vào lòng đất, luồn ra sau phòng tuyến địch và mở đường cho các sinh vật nhỏ hơn đi qua đường hầm của chúng. Hầm ngầm này cũng là một biện pháp hữu hiệu chống oanh tạc quỹ đạo.§!"
 army_attachment_raptor_flocks:0 "Bầy Mãnh cầm"
 army_attachment_raptor_flocks_desc:0 "§LNhững loài chim săn mồi cỡ lớn, có thể đạt tốc độ siêu thanh trong một thời gian ngắn. Chúng tấn công theo bầy, phóng ra những chiếc gai cứng sắc nhọn xuyên thủng hầu hết các loại giáp. Bất kỳ máy bay nào liều lĩnh bay vào vùng không phận tổ của chúng đều đối mặt với nguy cơ bị xé xác.§!"
 army_attachment_advanced_power_armor:0 "Giáp Động lực Cải tiến"
 army_attachment_advanced_power_armor_desc:0 "§LChi phí chế tạo lớp giáp này đắt gần bằng việc tạo ra một chiến binh gen. Chúng có thể đẩy sức mạnh của người dùng lên mức tối đa, thiết bị bay đi kèm còn mang lại khả năng cơ động ngoài sức tưởng tượng. Để sử dụng, binh sĩ phải thiết lập liên kết thần kinh với bộ giáp.§!"
 army_attachment_environmental_augmentations:0 "Thiết bị Cường hóa Thích ứng Môi trường"
 army_attachment_environmental_augmentations_desc:0 "§LTăng cường hơn nữa chức năng phổi và hệ miễn dịch, giúp các chiến binh gen vẫn tác chiến bình thường mà không bị tổn thương trong những môi trường khắc nghiệt – thậm chí có thể hoạt động ngắn hạn ngoài không gian chân không.§!"
 army_attachment_cybernetic_replacements:0 "Cấy ghép Cơ khí"
 army_attachment_cybernetic_replacements_desc:0 "§LCác cơ quan và tay chân bị đứt lìa trong chiến đấu đều có thể được thay thế bằng những bộ phận cấy ghép cơ khí tối tân, giúp những chiến binh tàn phế vẫn có thể tiếp tục chiến đấu dù đã gánh chịu vô số vết thương chí mạng.§!"

