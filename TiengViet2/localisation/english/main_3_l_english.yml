 war_goal_wg_end_threat_colossus_desc:0 "Phát động chiến tranh để loại trừ mối đe dọa từ việc kẻ thù sử dụng vũ khí cấp Cự thần."
 war_goal_wg_counterattack:0 "Phản công"
 war_goal_wg_counterattack_desc:0 "Phát động chiến tranh để trừng phạt đế chế đã tấn công một quốc gia thành viên của Cộng đồng Ngân hà. Sử dụng mục tiêu chiến tranh này sẽ làm giảm §Y33%§! §YMối đe dọa§! sinh ra khi chiếm được hệ sao đã tuyên bố chủ quyền."
 war_goal_wg_renegade_containment:0 "Phủ đầu"
 war_goal_wg_renegade_containment_desc:0 "Phát động chiến tranh để triệt tiêu hoàn toàn từ trong trứng nước các mối đe dọa nhắm vào Cộng đồng Ngân hà."
