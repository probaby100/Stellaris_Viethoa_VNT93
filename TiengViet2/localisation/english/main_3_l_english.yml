 district_generator_physics: "$district_generator$"
 district_generator_physics_plural: "$district_generator_plural$"
 district_generator_physics_desc: "$district_generator_desc$"
 zone_agrarian_urban: "Làng Nông thôn"
 zone_agrarian_urban_desc: "Các cộng đồng gắn kết chặt chẽ nằm xen giữa các khu dự trữ sinh quyển màu mỡ, họ trồng trọt và giữ gìn tập tục truyền thống, hoàn toàn không sử dụng máy móc cỡ lớn."
 zone_exotic_gases: "Thu thập Khí Ngoại lai"
 zone_exotic_gases_desc: "Các mái vòm linh hoạt chứa những hệ thống máy bơm khổng lồ, tháp chưng cất và bình chịu áp lực để thu thập lượng khí hiếm bốc lên từ hệ sinh thái của hành tinh này."
 farmer_is_gas_extractor_tt: "£job_farmer£$job_farmer_plural$ chuyển thành £job_gas_extractor£$job_gas_extractor_plural$"
 agri_drone_is_gas_extractor_tt: "£job_agri_drone£$job_agri_drone_plural$ chuyển thành £job_gas_extraction_drone£$job_gas_extraction_drone_plural$"
