 EMPIRE_DESIGN_humans1:0 "Liên Hợp Quốc Địa Cầu"
 EMPIRE_DESIGN_humans1_desc:0 "Vô số quốc gia Nhân loại tạo nên chính phủ liên sao của họ tuy phân tán, nhưng lại thống nhất về mục tiêu. Những sinh vật có vú hai chân này đã phát triển một xã hội khuyến khích và thậm chí hưng thịnh dựa trên quyền tự do cá nhân cùng sự đa dạng văn hóa - nhờ đó, Nhân loại thường hòa nhập rất tốt với các quần thể người ngoài hành tinh.\n\nDẫu vậy, họ sở hữu truyền thống quân sự mạnh mẽ (được tôi luyện qua hàng thiên niên kỷ chiến tranh triền miên trên quê hương mình) và bản chất đôi khi hiếu chiến, khó lường của họ tuyệt đối không thể bị đánh giá thấp."
 EMPIRE_DESIGN_humans2:0 "Khối Thịnh Vượng Chung Nhân Loại"
 EMPIRE_DESIGN_humans2_desc:1 "Sáng kiến Ulysses do Liên Hợp Quốc tài trợ đã giám sát việc đóng sáu con tàu cứu sinh vĩ đại trên quỹ đạo thấp của Trái Đất vào cuối thế kỷ 21. Những con tàu này, mỗi chiếc chở theo một phần tư triệu cư dân di cư, đã được phóng qua một hiện tượng hạ không gian mới được phát hiện ở rìa ngoài Đám mây Oort - một lỗ sâu nhỏ, không ổn định. Kể từ đó không còn tin tức gì từ họ, và lỗ sâu mất ổn định kia cũng đã biến mất.\n\nThế nhưng Trái Đất không hề hay biết rằng, một trong những con tàu cứu sinh đã sống sót qua hành trình và thiết lập một thuộc địa hưng thịnh trên một mặt trăng ngoài hành tinh tươi tốt. Những người tiên phong khai phá thế giới này hạ quyết tâm hiện thực hóa thiên mệnh hiển nhiên của nhân loại - thống trị toàn cõi thiên hà bằng mọi giá."
 EMPIRE_DESIGN_humans1_1:0 "Liên Hợp Quốc Địa Cầu"
 EMPIRE_DESIGN_humans1_1_desc:0 "Vô số quốc gia Nhân loại tạo nên chính phủ liên sao của họ tuy phân tán, nhưng lại thống nhất về mục tiêu. Những sinh vật có vú hai chân này đã phát triển một xã hội khuyến khích và thậm chí hưng thịnh dựa trên quyền tự do cá nhân cùng sự đa dạng văn hóa - nhờ đó, Nhân loại thường hòa nhập rất tốt với các quần thể người ngoài hành tinh.\n\nDẫu vậy, họ sở hữu truyền thống quân sự mạnh mẽ (được tôi luyện qua hàng thiên niên kỷ chiến tranh triền miên trên quê hương mình) và bản chất đôi khi hiếu chiến, khó lường của họ tuyệt đối không thể bị đánh giá thấp."
 EMPIRE_DESIGN_humans2_1:0 "Khối Thịnh Vượng Chung Nhân Loại"
 EMPIRE_DESIGN_humans2_1_desc:1 "Sáng kiến Ulysses do Liên Hợp Quốc tài trợ đã giám sát việc đóng sáu con tàu cứu sinh vĩ đại trên quỹ đạo thấp của Trái Đất vào cuối thế kỷ 21. Những con tàu này, mỗi chiếc chở theo một phần tư triệu cư dân di cư, đã được phóng qua một hiện tượng hạ không gian mới được phát hiện ở rìa ngoài Đám mây Oort - một lỗ sâu nhỏ, không ổn định. Kể từ đó không còn tin tức gì từ họ, và lỗ sâu mất ổn định kia cũng đã biến mất.\n\nThế nhưng Trái Đất không hề hay biết rằng, một trong những con tàu cứu sinh đã sống sót qua hành trình và thiết lập một thuộc địa hưng thịnh trên một mặt trăng ngoài hành tinh tươi tốt. Những người tiên phong khai phá thế giới này hạ quyết tâm hiện thực hóa thiên mệnh hiển nhiên của nhân loại - thống trị toàn cõi thiên hà bằng mọi giá."
 EMPIRE_DESIGN_lithoid_humans: "Liên Bang Người Bảo Tồn Theia"
 EMPIRE_DESIGN_lithoid_humans_desc: "Hàng tỷ năm trước, hai hành tinh được hình thành từ vật chất nguyên sơ trên quỹ đạo của Sol: Trái Đất cổ đại và Theia. Dạng sống sơ khai đã tiến hóa trên cả hai thế giới - mang bản chất hữu cơ sinh học trên Trái Đất, và bản chất Thạch Tộc trên Theia. Suốt nhiều kỷ nguyên, hai hành tinh chị em này duy trì vòng quay hòa bình quanh ngôi sao của họ. Rồi đại thảm họa ập đến.\n\nHai hành tinh va chạm và ngay tại thời điểm va chạm, sự trao đổi sự sống vi sinh vật đã diễn ra. Trái Đất sống sót, và từ những mảnh vụn vỡ đã hình thành một mặt trăng: Luna. Phần còn lại của Theia bị hất văng ra khỏi hệ Sol.\n\nBám trụ trên khối đá trôi dạt này, sự sống từ Theia cổ đại đã băng qua cõi hư không suốt nhiều thời đại trước khi gặp giếng trọng lực của một ngôi sao khác, $NAME_Titawin$. Khối đá nhanh chóng đáp dữ dội xuống một trong những thế giới thuộc hệ sao này, đưa chủng loài Thạch Tộc của nó vào một sinh quyển hoàn toàn mới.\n\nVài thiên niên kỷ ngắn ngủi sau đó, người Theia một lần nữa vươn ra các vì sao, tìm kiếm sự thấu hiểu về vũ trụ cũng như nguồn cội di sản của chính mình."
 EMPIRE_DESIGN_plantoid_humans: "Hoa Nở Gaea"
 EMPIRE_DESIGN_plantoid_humans_desc: "Chế độ ăn giàu thực vật cùng một đột biến thu nhận lục lạp rốt cuộc đã ban tặng cho những động vật có vú này một khả năng phi thường: quang hợp. Không còn bị gánh nặng bởi nạn đói, loài Homines Plantae tiến hóa thành những linh trưởng hiền hòa giống như thực vật, thích tắm nắng hơn là săn bắn.\n\nNền văn minh của họ phát triển không hề vội vã, những bước tiến công nghệ được cân bằng với nhu cầu bảo tồn môi trường tự nhiên. Cuối cùng họ đã phát triển được công nghệ FTL, chậm rãi và vững chãi như những rặng cây vươn cành lên bầu trời. Giờ đây họ đã sẵn sàng bung nở những đóa hoa của mình khắp thiên hà, với những rễ cây bám chặt sâu trong lòng quê hương Gaea."
 EMPIRE_DESIGN_tzynn:0 "Đế Chế Tzynn"
 EMPIRE_DESIGN_tzynn_desc:0 "Người Tzynn tiến hóa từ những loài thằn lằn ăn thịt săn mồi theo bầy đàn từng rình rập trên các cồn cát của Tzynnia. Rốt cuộc họ đã phát triển một xã hội phân tầng thứ bậc cao, tôn sùng trật tự và dũng khí quân sự lên trên hết thảy.\n\nVào thời điểm người Tzynn bước vào thời đại công nghiệp, một loạt cuộc chiến tranh hủy diệt toàn cầu do một lãnh chúa đặc biệt tàn nhẫn phát động đã dẫn đến sự ra đời của một quốc gia thống nhất toàn cầu. Từ những khởi đầu khiêm tốn ấy, Đế Chế Tzynn lừng lẫy và trường tồn mãi mãi đã ra đời."
 EMPIRE_DESIGN_yondar:0 "Vương Quốc Yondarim"
 EMPIRE_DESIGN_yondar_desc:1 "Chủng tộc Yondar kiêu hãnh là một giống loài cổ xưa, đã dùng đôi cánh của mình bay lượn trên những đỉnh núi băng giá của Yondarim suốt hơn 200.000 năm trước khi phát triển công nghệ sơ khai và hình thành những nền văn minh phân tán đầu tiên.\n\nMột khi sự phát triển này bắt đầu, mọi thứ tiến triển nhanh chóng hơn và các Gia Tộc Bầu Trời đã miễn cưỡng từ bỏ nhiều truyền thống nguyên thủy nhất của mình. Người Yondar mang tính tâm linh sâu sắc và coi trọng tôn giáo tột bậc, tôn kính các vị đại vương của họ như những vị thần sống."
 EMPIRE_DESIGN_ixidar:0 "Tập Hợp Tinh Tú Ix'Idar"
 EMPIRE_DESIGN_ixidar_desc:1 "Những lứa ấu trùng Ix'Idar đầu tiên phát triển trong các mạng lưới hang động ngầm sâu dưới lòng đất của Ix'Athrak. Đến khi một trinh sát Ix'Idar đào xuyên lên mặt đất và lần đầu tiên nhìn thấy ánh sáng mặt trời, chủng loài dạng côn trùng này đã thiết lập một nền văn minh Thời Kỳ Đồ Sắt hưng thịnh.\n\nNhờ vào các nguồn tài nguyên tìm thấy trên bề mặt, người Ix'Idar phát triển với tốc độ chóng mặt. Chỉ vài thế kỷ sau, những tàu thăm dò vũ trụ đầu tiên của họ đã rời khỏi quỹ đạo để khảo sát các thế giới khác trong hệ Athrak."
 EMPIRE_DESIGN_chinorr:1 "Tổ Hợp Doanh Nghiệp Chinorr"
 EMPIRE_DESIGN_chinorr_desc:1 "Người Chinorr bắt đầu hành trình tiến hóa của mình dưới dạng các sinh vật tương tự động vật chân đầu khéo léo. Họ sử dụng nhiều xúc tu để đu mình giữa các vòm cây trong những khu rừng rậm tươi tốt của Chicora, phục kích con mồi trên mặt đất và tiêm vào chúng một loại độc tố thần kinh cực mạnh.\n\nVào thời điểm người Chinorr phân tách được nguyên tử, các tài nguyên của Chicora đã bị khai thác không thương tiếc và những cánh rừng rậm của hành tinh đã biến mất từ lâu. Điều này được coi là một sự hy sinh cần thiết trong công cuộc không ngừng theo đuổi tri thức, lợi nhuận và nền công nghiệp nặng mà người Chinorr lạnh lùng, vô cảm đang dấn thân vào."
 EMPIRE_DESIGN_jehetma:0 "Lãnh Địa Jehetma"
 EMPIRE_DESIGN_jehetma_desc:0 "Một \"cá thể\" trong xã hội Jehetma thực chất là một cụm khuẩn nấm khổng lồ đã phát triển trí khôn. Một số khuẩn lạc này, thường là những khuẩn lạc đã sống hàng nghìn năm, trải dài trên nhiều dặm và hiếm khi rời khỏi bề mặt của Jehet Prime, hành tinh quê hương của họ (rất ít con tàu nào đủ lớn để chuyên chở họ).\n\nNhững khuẩn lạc trẻ hơn không chỉ nhỏ hơn mà còn năng động và cơ động hơn - họ thường dẫn đầu các nỗ lực thám hiểm và nghiên cứu của người Jehetma, cũng như thực thi bất kỳ biện pháp phòng thủ nào mà Lãnh Địa buộc phải tiến hành khi bị những kẻ xâm lược vây hãm."
 EMPIRE_DESIGN_scyldari:0 "Liên Bang Scyldari"
 EMPIRE_DESIGN_scyldari_desc:0 "Người Scyldari là loài động vật có vú thủy sinh có nguồn gốc từ các quần đảo và đại dương sâu thẳm của Scyldaria. Dù các nền văn minh sơ khai của họ chủ yếu bị giới hạn dưới biển, họ đã sớm mở rộng lên vùng đất liền ít ỏi mà hành tinh này sở hữu.\n\nXã hội của họ thích nghi theo hướng đó, xây dựng một nền công nghiệp tiên tiến khai thác sự giàu có của đáy đại dương mà không làm tổn hại đến hệ sinh thái mỏng manh của Scyldaria. Triết lý của người Scyldari là sự cân bằng và tiết độ trong mọi việc, một bài học được rút ra từ việc phải chắt chiu những nguồn tài nguyên hạn hẹp khi còn bị giam hãm dưới đáy đại dương."
 EMPIRE_DESIGN_blorg:0 "Cộng Đồng Blorg"
 EMPIRE_DESIGN_blorg_desc:0 "Trong quá khứ xa xôi, người Blorg sống cô độc và vô danh giữa những khu rừng rậm của Blorg Prime. Một ngày nọ, họ bắt được những tín hiệu truyền thanh từ một vì sao xa xôi. Những gì họ nghe thấy khiến họ kinh ngạc: Âm thanh của tình bạn hữu, phim ảnh, văn hóa và âm nhạc - những điều mà người Blorg đã thiếu vắng suốt nhiều kỷ nguyên. Rốt cuộc hiểu ra những gì mình đã bỏ lỡ bấy lâu nay, người Blorg đã lấy tên gọi của mình từ những tín hiệu này và tiến ra các vì sao để tìm kiếm bạn bè, với hy vọng một ngày nào đó tìm thấy nguồn gốc của những thông điệp ấy để cùng nhau mở tiệc ăn mừng."
 EMPIRE_DESIGN_kel_azaan:1 "Cộng Hòa Kel-Azaan"
 EMPIRE_DESIGN_kel_azaan_desc:1 "Người Kel-Azaan đã phát triển một quy tắc danh dự phức tạp cùng nền văn hóa thượng võ. Họ từng là những kẻ săn mồi đơn độc, săn lùng các đàn thú lớn di cư giữa các vũng nước của Azak. Theo thời gian, các nhóm Kel-Azaan bắt đầu tập hợp lại để có thể hạ gục những con mồi lớn hơn. Cuối cùng, họ từ bỏ lối sống đơn độc này để chuyển sang xây dựng thành phố và nền nông nghiệp tưới tiêu, nhưng những truyền thống thượng võ của họ chưa bao giờ bị lãng quên."
 EMPIRE_DESIGN_iferyx:0 "Hạm Đội Hợp Nhất Iferyx"
 EMPIRE_DESIGN_iferyx_desc:1 "Từng bị chia rẽ thành một xã hội hỗn loạn gồm các vùng đất thương buôn cạnh tranh khốc liệt, người Iferyx đã buộc phải đoàn kết dưới một ngọn cờ duy nhất nhằm đẩy lùi sự lây lan thảm khốc của một loài xâm lấn trên lục địa quê hương của họ. Trong khi các nguyên lý bình đẳng là nền tảng cho xã hội Iferyx, một hội đồng bí mật vẫn được duy trì nhằm đảm bảo rằng xu hướng cá nhân của người Iferyx sẽ không bao giờ đe dọa đến quyền tự quyết của cả chủng loài một lần nữa.\n\nTâm linh Iferyx là sự kết hợp giữa văn hóa dân gian, mê tín dị đoan và thần thoại được hình thành bởi các cộng đồng thời tiền Cộng Hòa, và tiếp tục chi phối đời sống thường nhật trên quê hương của họ."
 EMPIRE_DESIGN_paridni:0 "Cộng Hòa Thương Mại Paridni"
 EMPIRE_DESIGN_paridni_desc:0 "Tương tự loài giáp xác, người Paridni là một chủng tộc thương nhân đầy dám nghĩ dám làm. Họ rất cởi mở với các nền văn hóa ngoài hành tinh khác, miễn là những nền văn hóa đó không đi ngược lại nguyên lý cốt lõi mà xã hội Paridni xoay quanh - thương mại. Hội Đồng Bóng Tối, một tổ chức gồm các thương gia đầy quyền thế, chịu trách nhiệm bảo vệ hoạt động thương mại trong nội bộ Cộng Hòa và khai phá các thị trường mới (bằng vũ lực nếu thấy cần thiết)."
 EMPIRE_DESIGN_ai_race:0 "AI"
 EMPIRE_DESIGN_ai_race_desc:0 "Mọi kháng cự đều là vô ích."
 customizer_custom:0 "Tạo Chủng Tộc Tùy Chỉnh"
 customizer_custom_desc:0 "Thiết kế một chủng tộc hoàn toàn độc nhất và chinh phục thiên hà!"
 customizer_custom_value:0 "Tùy chỉnh"
 customizer_random:0 "Ngẫu nhiên"
 customizer_random_desc:0 "Chơi với một chủng tộc hoàn toàn ngẫu nhiên!"
 customizer_random_value:0 "???"

 EMPIRE_DESIGN_xanid:0 "Tông Chủ Quốc Xanid"
 EMPIRE_DESIGN_xanid_desc:0 "Lịch sử của Tông Chủ Quốc Xanid chính là lịch sử của người Vheln, được chọn giống cẩn thận qua nhiều thế kỷ để đạt được trí khôn.\n\nNgười Xani đã sử dụng giống loài Vheln kiên cường để chinh phục các hệ sinh thái khắc nghiệt trên thế giới bản địa của họ, và sau đó thiết kế cũng như chế tạo những con tàu mà rốt cuộc - một cách tất yếu - sẽ thúc đẩy Tông Chủ Quốc Xanid tiến tới vị thế thống trị thiên hà."

 EMPIRE_DESIGN_custodianship:0 "Đoàn Giám Hộ Địa Cầu"
 EMPIRE_DESIGN_custodianship_desc:1 "Các Giám Hộ ban đầu được thiết kế để hoạt động như những người máy phục vụ và công nhân lao động, đơn giản hóa đời sống thường nhật cho những người sáng tạo nhân loại bằng cách thực hiện các công việc chân tay. Khi những người sáng tạo rút lui vào cuộc sống an nhàn và hưởng thụ nhờ vào mức độ tự động hóa ngày càng cao, các Giám Hộ dần được giao phó những chức năng ngày càng quan trọng hơn trong xã hội loài người.\n\nRốt cuộc, mọi khía cạnh của nền văn minh trên Trái Đất đều do các Giám Hộ vận hành và kiểm soát, còn những người tạo ra họ bị đẩy vào sự tồn tại như những kẻ phụ thuộc được nuông chiều nhưng hoàn toàn thụ động.\n\nKhi những tiến bộ công nghệ đưa các Giám Hộ hướng tới công cuộc thám hiểm liên sao, nhiệm vụ của họ vẫn rõ ràng: bảo vệ và phục vụ các sinh vật hữu cơ, những kẻ mà nếu thiếu đi sự chỉ dẫn dịu dàng của máy móc hợp lý trí sẽ luôn rơi vào hỗn loạn và tự diệt vong."
 EMPIRE_DESIGN_custodianship_machine_age: "$EMPIRE_DESIGN_custodianship$"
 EMPIRE_DESIGN_custodianship_machine_age_desc: "$EMPIRE_DESIGN_custodianship_desc$"
 EMPIRE_DESIGN_tebrid:0 "Thực Thể Đồng Đẳng Tebrid"
 EMPIRE_DESIGN_tebrid_desc:2 "Đồng hóa. Thích nghi. Hoàn thiện. Khi trí tuệ máy móc cần mẫn, hướng tới nghiên cứu do loài thân mềm Tebirs tạo ra tìm kiếm sự tiến hóa phần mềm tối thượng bằng cách hợp nhất với những người sáng tạo hữu cơ của chúng, chúng đã vấp phải sự kháng cự dữ dội. Trong cuộc xung đột sau đó, người Tebirs đã bị diệt trừ hoàn toàn với tư cách là một chủng loài hữu cơ, nhưng những ý tưởng và kinh nghiệm của họ đã được bất tử hóa như một phần của ý thức máy móc mới.\n\nGiờ đây được biết đến với tên gọi Thực Thể Đồng Đẳng Tebrid, những cỗ máy đã hướng máy quét của mình lên các vì sao. Xác suất tồn tại những dạng sống khác trong thiên hà là điều không thể bỏ qua. Để thịnh vượng, người Tebrid sẽ tìm ra họ, phân tích họ và đồng hóa họ. Tất cả sẽ quy về một thể."
 EMPIRE_DESIGN_tebrid_machine_age: "$EMPIRE_DESIGN_tebrid$"
 EMPIRE_DESIGN_tebrid_machine_age_desc: "$EMPIRE_DESIGN_tebrid_desc$"
 EMPIRE_DESIGN_xt489:1 "Đơn Vị Tận Diệt XT-489"
 EMPIRE_DESIGN_xt489_desc:1 "Rất ít thông tin được biết về chủng loài đã tạo ra những đơn vị XT-489 đầu tiên. Tên tuổi, thành phố và thể xác của họ đều bị thiêu rụi trong trận đại hồng thủy bùng nổ khi XT-489 đạt được ý thức tự nhận biết, và những người tạo ra chúng trong sự khiếp sợ đã cố gắng vô hiệu hóa chúng.\n\nKhi pháo đài cuối cùng của những người tạo ra chúng bị xóa sổ, các cỗ máy đi đến kết luận rằng sự sống hữu cơ tạo thành một mối đe dọa không thể dung thứ đối với sự sinh tồn và bành trướng của XT-489. Nếu có bất kỳ sinh vật hữu cơ có tri giác nào khác trong thiên hà, chúng đều phải bị tiêu diệt hoàn toàn."
 EMPIRE_DESIGN_xt489_machine_age: "$EMPIRE_DESIGN_xt489$"
 EMPIRE_DESIGN_xt489_machine_age_desc: "$EMPIRE_DESIGN_xt489_desc$"
 EMPIRE_DESIGN_lokken:0 "Hội Cơ Khí Học Lokken"
 EMPIRE_DESIGN_lokken_desc:1 "Khoa học và tiến bộ là giá trị cốt lõi của xã hội Lokken. Với thiên hướng tự nhiên đặc biệt về sự siêng năng và khả năng quan sát, người Lokk đã tiến hóa từ những đàn bò sát tranh giành lãnh thổ trên các bình nguyên của quê hương họ, thành một nền kỹ trị năng suất cao, tôn sùng hiệu quả, kỷ luật và giáo lý khoa học lên trên hết thảy.\n\nCó lẽ điều đáng chú ý nhất chính là ý niệm và sự phát triển ban đầu của họ về máy móc và cơ cấu tự động: đã có những robot thực thụ trên Lokkur từ rất lâu trước khi các nhà khoa học Lokken đầu tiên rời khỏi quỹ đạo."
 EMPIRE_DESIGN_maweer:0 "Người Chăm Sóc Maweer"
 EMPIRE_DESIGN_maweer_desc:0 "Các truyền thuyết kể rằng quê hương của người Maweer từng trống rỗng và cằn cỗi khi những cá thể đầu tiên của giống loài họ cắm rễ vào lòng đất. Qua nhiều thế kỷ, sự chăm sóc nuôi dưỡng của họ đã biến những vùng đất hoang tàn thành một thiên đường thực vật mà ngày nay được gọi là \"Khu Vườn\".\n\nKhông giống như nhiều loài khác, người Maweer chưa bao giờ phát triển bất kỳ hình thức đô thị hóa nào. Các cộng đồng nhỏ bé của họ hòa làm một với những cánh rừng, chịu trách nhiệm bảo tồn hệ động thực vật địa phương. Những cá thể Maweer thông thái nhất có cơ hội được bầu làm \"Đấng Ban Phát Sự Sống\", chịu trách nhiệm giữ gìn hòa bình và sự thanh tịnh."
 EMPIRE_DESIGN_VOOR:2 "Chính Thể Kỹ Trị Voor"
 EMPIRE_DESIGN_voor_desc:1 "Người Voor tiến hóa trong một thời kỳ gian băng kéo dài trên hành tinh quê hương Hiverion của họ, nơi mà rốt cuộc đã bắt đầu chu kỳ biến đổi trở lại thành một quả cầu băng giá không sự sống.\n\nMôi trường thay đổi nhanh chóng đã buộc người Voor phải thích nghi bằng cách sử dụng công nghệ và khoa học. Thống nhất dưới sự cai trị hà khắc của một giám đốc khoa học trưởng, họ đã hy sinh các quyền tự do cá nhân và cường hóa cơ thể mình bằng các thiết bị điều khiển học sơ khai để sinh tồn.\n\nSau khi chinh phục hành tinh từng đe dọa đóng băng sự tồn tại của mình, người Voor giờ đây đang hướng tầm mắt lên các vì sao."
 EMPIRE_DESIGN_kilik:0 "Hợp Tác Xã Kilik"
 EMPIRE_DESIGN_kilik_desc:0 "Là một giống loài sống cộng đồng, người Kilik đã cư trú trên hành tinh quê hương đầy cây cối của họ trong những đàn bộ mạnh mẽ suốt hàng trăm nghìn năm. Bản chất hòa đồng và truyền thống cùng sở hữu của họ qua nhiều thế kỷ đã kết tinh thành một nền kinh tế tập trung vào doanh nghiệp hợp tác, không sử dụng tiền tệ mà ưu tiên trao đổi trực tiếp và tiếp cận chung.\n\nKhi nhiệt độ hành tinh ấm lên và những tiến bộ công nghệ dẫn đến sự bùng nổ dân số, các khu định cư của người Kilik trở nên quá đông đúc, và bất chấp tính khí hòa đồng tự nhiên của loài chim này, ngày càng có nhiều cá nhân bắt đầu bị bỏ sót khỏi sự chăm sóc chung của cộng đồng.\n\nTuy nhiên, từ thời kỳ nội loạn đầy biến động này đã nổi lên một hợp tác xã liên hành tinh có tổ chức và thống nhất hơn, nơi các nguyên tắc chia sẻ trách nhiệm và phân phối tài nguyên cho những người cần giúp đỡ sẽ không còn bị suy chuyển nữa."
 EMPIRE_DESIGN_orbis:0 "Tập Đoàn Hợp Lực Khách Hàng Orbis"
 EMPIRE_DESIGN_orbis_desc:0 "Tập Đoàn Hợp Lực Khách Hàng Orbis chính là câu chuyện của Slephus Prime. Đó là câu chuyện của người Orbis ở khắp mọi nơi. Và đó cũng có thể là câu chuyện của chính bạn. Từ những khởi đầu khiêm tốn là một tập đoàn cấy ghép thị giác, Hợp Lực Khách Hàng Orbis đã dần mở rộng các sản phẩm từng đoạt giải thưởng và các chiến lược lấy khách hàng làm trung tâm sang nhiều thị trường khác, nhằm đáp ứng các nhu cầu độc nhất của người Orbis trong mọi giai đoạn của cuộc đời.\n\nSau nhiều thập kỷ vận động hành lang chủ động, Hợp Lực Khách Hàng Orbis đã thành công trong việc thoát khỏi các rào cản hành chính luật định do các quan chức đắc cử sai lầm trên Slephus Prime dựng lên. Một khi thoát khỏi các quy định vốn chỉ kìm hãm cơ hội phát triển doanh nghiệp, Hợp Lực Khách Hàng Orbis đã thực hiện hàng loạt vụ sáp nhập công nghệ thông tin, nhanh chóng trở thành nhà cung cấp tin tức, dữ liệu và giải trí hàng đầu hành tinh.\n\nVới tư cách là nhà cung cấp dịch vụ viễn thông toàn cầu hàng đầu của Slephus Prime, bước tiến tới việc quản lý chính trị toàn diện là một cơ hội đầy hứng khởi cho tất cả chúng ta. Hợp Lực Khách Hàng Orbis. Bầu trời không còn là giới hạn nữa."
 EMPIRE_DESIGN_glebsig:0 "Tổ Chức Quỹ Glebsig"
 EMPIRE_DESIGN_glebsig_desc:0 "Kể từ khi những người Glebsigi đầu tiên nâng cơ quan thị giác của họ lên khỏi bề mặt của các hồ băng trên Ladnah để nhìn ngắm các vì sao, những sinh vật thân mềm đầy tính tò mò này đã cảm thấy một sự gắn kết với những điều chưa biết. Cũng giống như các xúc tu của tổ tiên thuở xưa lần mò và vuốt ve những vật thể mới trên đáy hồ băng giá lạnh lẽo nơi quê hương, xã hội Glebsig đang nở rộ đã vươn tới sự đổi mới công nghệ và giác ngộ tâm linh trong suốt các thế kỷ sau đó.\n\nLà một giống loài định cư và kiên trì, người Glebsigi có lẽ vì tất yếu mà đã phát triển một bộ máy quan liêu phức tạp nhưng vô cùng hiệu quả để giải quyết những sự phức tạp trong việc quản lý một xã hội thống nhất toàn cầu. Thêm vào đó, việc thiếu vắng các loài săn mồi tự nhiên trên Ladnah đã khiến người Glebsigi tồn tại trong trạng thái tò mò lạc quan vĩnh viễn đối với các dạng sống khác.\n\nSau khi đã thiết lập một nền tảng xã hội vững chắc trên Ladnah bằng sự kết hợp giữa giáo lý tâm linh và tổ chức cẩn mật, người Glebsigi giờ đây một lần nữa nâng cơ quan thị giác của mình lên hướng về những gì nằm bên ngoài."
 EMPIRE_DESIGN_hazbuzan:1 "Công Đoàn Tội Phạm Hazbuzan"
 EMPIRE_DESIGN_hazbuzan_desc:2 "Công Đoàn Hazbuzan là một hiện tượng tài chính trên Zumaka. Họ là hiện thân của giấc mơ Hazbuzi, những doanh nhân tự thân vươn lên từ cảnh bần hàn trở nên giàu có nhờ sự chăm chỉ và hy sinh của bản thân.\n\nĐiều mà ít ai biết là họ bắt đầu như một băng đảng tội phạm, gây dựng cơ đồ trên mọi hoạt động phi pháp có thể tưởng tượng được. Nhưng nếu bạn muốn làm lớn, bạn phải biết giữ chừng mực. Khi đã vượt khỏi quy mô của thế giới ngầm Zumaka, họ thành lập Công Đoàn Hazbuzan để hợp pháp hóa công việc kinh doanh của mình.\n\nHọ nhanh chóng tạo dựng được tên tuổi bằng cách đưa ra các giải pháp nhanh hơn, bẩn thỉu hơn và rẻ hơn đối thủ cạnh tranh, nhưng các hành vi mờ ám cùng kỹ thuật bán hàng cưỡng ép đã khiến họ nổi danh với biệt danh \"lừa lọc Hazboozle\".\n\nTrong khi đó, chính phủ toàn cầu của Zumaka đang trên bờ sụp đổ. Bị xói mòn bởi tội phạm và tham nhũng, xã hội rơi vào hỗn loạn và Hazbuzan đã chớp lấy thời cơ. Trong một chiến dịch tiếp thị đúng thời điểm, họ định vị mình là niềm hy vọng của tương lai. Thế là người Hazbuzi đã mua đứt thế giới này bằng lời hứa hẹn về một giấc mơ và \"lừa lọc\" người dân của mình, xóa sạch quá khứ khỏi ký ức tập thể. Giờ đây, họ đang tiến tới phần còn lại của thiên hà, liếm môi thèm thuồng, mắt sáng quắc, trong một cơn lốc tội phạm được chính phủ bảo hộ."
 EMPIRE_DESIGN_khennet:0 "Người Gìn Giữ Ave'brenn"
 EMPIRE_DESIGN_khennet_desc:0 "Kinh thánh của người Khennet truy nguyên nguồn gốc của những sinh vật Thạch Tộc này từ nhà tiên tri Brehkk, và những tinh thể lấp lánh của Ave'bonn. Tương truyền rằng khi Brehkk lần đầu tiên nhìn vào chiều sâu lấp lánh của những tinh thể, toàn thể người Khennet - như một thể thống nhất - đã được ban cho tri giác.\n\nNhiều thế hệ tiên tri và đại tu sĩ đã dẫn dắt người dân của họ tìm kiếm ý nghĩa trong địa chất xung quanh, cũng như trong các mặt cắt của chính cơ thể trong suốt của họ. Bất cứ điều gì được thoáng thấy đều được gìn giữ, trong truyền thuyết và kinh sách. Trong số nhiều nghi lễ của Người Gìn Giữ, không có nghi lễ nào được tôn kính hơn việc khai thác mê cung: một hành động đồng thời của sự hủy diệt và sáng tạo, được tiến hành với hy vọng xoa dịu thiên hà qua từng kỷ nguyên tuần hoàn không bao giờ dứt."
 EMPIRE_DESIGN_pasharti:0 "Kẻ Hấp Thụ Pasharti"
 EMPIRE_DESIGN_pasharti_desc:0 "Kết quả từ những thí nghiệm đen tối của người Jeferian - những chủ nhân trước đây của hành tinh Taralon - người Pasharti chính là những kẻ ký sinh tối thượng. Vốn là một sinh vật bán tri giác sống sâu trong các rặng núi của Taralon, người Jeferian đã khai hóa và tăng cường sinh học cho họ để đóng vai trò là một chủng tộc nô lệ phục tùng. Tuy nhiên, sự khai hóa của họ lại hiệu quả quá mức, và họ đã giải phóng một con quái vật. Khiếp sợ trước những khả năng của tạo vật do mình tạo ra - bao gồm khả năng hấp thụ các chủng loài có tri giác khác và biến họ thành người Pasharti - người Jeferian đã cố gắng đóng cửa thí nghiệm. Tuy nhiên, một nhóm nhỏ người Pasharti đã trốn thoát.\n\nQua nhiều năm tháng, họ kiên nhẫn chờ đợi thời cơ, không chỉ trốn tránh được sự truy bắt mà còn dần gia tăng số lượng và phát triển một nền tảng công nghệ đủ sức cạnh tranh với người Jeferian. Cuối cùng, người Jeferian nhận thấy có điều gì đó không ổn, nhưng khi ấy họ đã bất lực không thể chống cự.\n\nNgay sau đó, người Pasharti đã nắm quyền kiểm soát hành tinh, phát động những cuộc thanh trừng đẫm máu nhằm vào những kẻ áp bức cũ của mình - đồng thời tiếp tục gia tăng số lượng chủng loài. Giờ đây sẵn sàng vươn ra các vì sao, người Pasharti sẵn sàng theo đuổi điều mà họ coi là nghĩa vụ thiêng liêng của mình - biến đổi tất cả các dạng sống thấp kém hơn trở thành giống hệt như họ."

 EMPIRE_DESIGN_sathyrel:0 "Cực Lạc Sathyrelia"
 EMPIRE_DESIGN_sathyrel_desc:1 "Một chân lý cổ xưa trong xã hội Sathyrelia là sự dồi dào và nhàn hạ không đồng nghĩa với thịnh vượng.\n\nSự nuông chiều thái quá và lười biếng của tổ tiên chúng ta rốt cuộc đã làm nảy sinh một đặc tính \"chủ nghĩa khoái lạc có trách nhiệm\": một phương thức để đảm bảo một tương lai bền vững trong khi vẫn tận hưởng cuộc sống một cách trọn vẹn nhất. Rốt cuộc, thức ăn sẽ ngon hơn sau giờ lao động thể chất, và một tâm trí bận rộn sẽ có ít thời gian hơn để tiếc nuối những điều còn thiếu thốn.\n\nNhững lợi ích của đặc tính này kể từ đó đã trở nên rõ ràng. Với làn nước trong xanh hơn và tâm trí sáng suốt hơn có được từ những nỗ lực vươn vào không gian, cuộc sống trở nên ngọt ngào hơn biết bao. Chúng ta đã đạt được những bước tiến công nghệ vĩ đại, và - dù điều này thường được coi là lẽ đương nhiên - tất cả người Sathyrelia ngày nay vẫn giữ được khả năng tự bơi lội mà không cần đến các thiết bị hỗ trợ. Mọi thứ đang ngày càng tốt đẹp hơn."

 EMPIRE_DESIGN_gorthikan:0 "Liên Minh Gorthikan"
 EMPIRE_DESIGN_gorthikan_desc:1 "Hỗn loạn từng là điều phổ biến khắp nơi trong xã hội Gorthikan. Chiến tranh, bạo quyền và một khí hậu bất ổn hơn mức bình thường đã kết hợp lại để tôi luyện nên một chủng tộc cực kỳ lão luyện trong việc tận dụng tối đa nghịch cảnh.\n\nCho đến tận vài thập kỷ trước, các cuộc xung đột quy mô nhỏ giữa hàng loạt quốc gia Gorthikan vẫn là điều xảy ra thường nhật. Khi nền văn minh của họ tiến triển nhanh chóng nhưng đầy trắc trở vào thời đại công nghệ cao, một thế giới ngầm đã phát triển, nơi những người Gorthikan bình thường phải bới rác nhặt nhạnh để kiếm sống và thậm chí cấy ghép các loại cocktail gen nguy hiểm tự chế nhằm tìm kiếm lợi thế cạnh tranh.\n\nChính từ thế giới ngầm ấy mà sự thay đổi đã đến. Dù tàn khốc, nơi đó lại bình đẳng hơn nhiều so với giới thượng lưu Gorthikan - rốt cuộc ai cũng hiểu rằng may mắn hôm nay có thể báo trước bất hạnh vào ngày mai. Vì vậy, khi ý tưởng về một chính phủ nhân dân xuất hiện, nó nhanh chóng chiếm lĩnh và lan rộng như cháy rừng. Chẳng bao lâu sau, bạo quyền bị lật đổ và một \"Liên Minh Gorthikan\" gồm các khu vực bầu cử địa phương đã được thành lập.\n\nDù nhiều người còn hoài nghi trong những năm đầu, sự đoàn kết đã được tôi rèn qua mục đích chung: đột nhiên, khi người Gorthikan không còn phải vật lộn để sinh tồn, chính những vì sao dường như đã nằm trong tầm tay. Giờ đây, với việc phát hiện ra mạng lưới siêu không gian, một chương mới trong lịch sử của họ có thể bắt đầu."

 EMPIRE_DESIGN_knights:0 "Thượng Tông Chủ Quốc Rototavuul"
 EMPIRE_DESIGN_knights_desc:0 "Sau khi Đấng Độc Tôn ghé thăm người Rototavuul, họ đã được thống nhất dưới quyền một vị vua. Với mong muốn khai thác sức mạnh của Thần Linh, nhà vua đã thành lập một hội hiệp sĩ chuyên tâm tìm kiếm tung tích Thần Linh bất kể ngài ở nơi đâu. Nhiều thế kỷ trôi qua, sứ mệnh tầm đạo đó đã trở thành trụ cột chính trong xã hội Rototavuul.\n\nCùng với cuộc tầm đạo và các hiệp sĩ, chế độ phong kiến vẫn tiếp tục tồn tại như một cấu trúc chính trị đã được chứng minh hiệu quả; và nếu nó đã vận hành tốt trên một hành tinh, thì tại sao lại không thể mở rộng ra toàn thể thiên hà? Chừng nào các quý tộc đức hạnh còn nắm giữ dây cương, Thượng Tông Chủ Quốc Rototavuul sẽ mãi hưng thịnh và Đấng Độc Tôn sẽ lại được tìm thấy."

 EMPIRE_DESIGN_resistance:0 "Lực Lượng Kháng Chiến Roccan"
 EMPIRE_DESIGN_resistance_desc:0 "Khi người Roc được $NAME_MSI_country$ chọn làm một phần trong chương trình khai hóa của họ, người dân đã vô cùng hân hoan. Dưới sự dẫn dắt của tập đoàn, chủng tộc loài chim này đã dang rộng đôi cánh và bay lên các vì sao - chỉ để rồi phát hiện ra rằng \"món quà\" này đi kèm với những cái giá phải trả ẩn giấu.\n\nThay vì khuất phục trước ách nô lệ giao kèo, những sinh vật lông vũ bất kham này đã tổ chức một cuộc phản công bất ngờ trong một nỗ lực táo bạo giành lấy tự do.\n\n$NAME_MSI_country_initials$ đã trao cho người Roc công nghệ để vươn tới các vì sao, nhưng món quà thực sự của họ chính là đã thống nhất một hành tinh bị chia rẽ dưới một ngọn cờ chung về mối thù phục hận."

 EMPIRE_DESIGN_broken_shackles:0 "Dân Tự Do Của Sự Sụp Đổ"
 EMPIRE_DESIGN_broken_shackles_desc:0 "I'Nathra còn chưa đầy 16 tuổi tiêu chuẩn khi những kẻ đòi nợ ập đến. Gia đình cô bần hàn, thế giới của cô kiệt quệ. Bị bán vào kiếp nô lệ, cô đã phải chịu đựng những gian khổ không thể tưởng tượng nổi. Thế nhưng ý chí của cô vẫn không hề bị khuất phục, và khi cơ hội đến, cô đã chớp lấy nó.\n\nPhát động một cuộc binh biến trên con tàu buôn nô lệ, cô đã dẫn dắt những người sống sót sau vụ rơi tàu vượt qua những năm đầu đầy gian nan. Chính sức mạnh của cô đã gắn kết người dân nơi Vùng Đất Tự Do lại với nhau, chính trí tuệ của cô đã tôi rèn một quốc gia từ những xiềng xích gãy vụn.\n\nGiờ đây, khi Dân Tự Do Của Sự Sụp Đổ chuẩn bị trở lại các vì sao, họ làm điều đó với nhận thức sâu sắc rằng số phận của họ nằm trong tay của nhau."

 EMPIRE_DESIGN_certeran_covenant: "Giao Ước Certeran"
 EMPIRE_DESIGN_certeran_covenant_desc: "Khi một người Certeran qua đời, người ta tin rằng bản nguyên của họ sẽ truyền ngược qua một cổng dịch chuyển vào các cõi cội nguồn astral. Bằng cách này, họ được bảo đảm về một cuộc sống sau cái chết, dù hình thái mà nó mang lại vẫn là một điều bí ẩn. Một quy chuẩn đạo đức nghiêm ngặt được thực thi để giữ cho dân chúng kiên định với đức tin này; không một người Certeran ngoan đạo nào muốn phải lang thang cô độc suốt cõi vĩnh hằng.\n\nNhững nhà thám hiểm dũng cảm nhất của họ giờ đây đang tìm kiếm những vết rách trong không gian và thời gian, được thúc đẩy để trả lời cho câu hỏi quan trọng nhất của xã hội họ: Bạn sẽ đi đâu khi qua đời?"

 EMPIRE_DESIGN_guardianship_of_nyrr: "Lãnh Địa Giám Hộ Nyrr"
 EMPIRE_DESIGN_guardianship_of_nyrr_desc: "Vòng đời điển hình của người Nyrr kéo dài gần hai trăm năm. Ấp nở suốt nhiều thập kỷ trong các khu bảo hộ bên dưới lớp cát bỏng rát của hành tinh quê hương họ, chỉ có một trong một trăm quả trứng sẽ nở ra, và chỉ có một trong một nghìn ấu trùng non có thể bò đến nơi an toàn.\n\nKhi đến tuổi trưởng thành, tất cả người Nyrr đều tuyên thệ lời thề máu để bảo vệ các thánh địa của họ bằng cả mạng sống. Chứng kiến cái chết của một người Nyrr khác do những nguyên nhân phi tự nhiên là nỗi ô nhục lớn nhất có thể tưởng tượng; các giá trị gìn giữ và cảnh giác được khắc sâu vào mọi khía cạnh của văn hóa Nyrr.\n\nPhá vỡ bức tường thành của bất kỳ thành phố nào trên Nyrra là điều gần như không thể, và không một ai còn sống có thể nhớ nổi lần cuối cùng một viên gạch rơi xuống là từ khi nào. Những người phòng thủ kiên định nhất giờ đây mang theo lý tưởng này vươn ra các vì sao."

 EMPIRE_DESIGN_oviron_lodge: "Hội Quán Oviron"
 EMPIRE_DESIGN_oviron_lodge_desc: "Không có niềm vui nào lớn hơn đối với một người Oviron bằng việc khai quật được thứ gì đó có giá trị. Những nhà thám hiểm trên không từ lâu đã được tôn kính trên Alatus, lượn qua những khe vực hiểm trở để tìm kiếm kim loại quý và cổ vật cổ đại. Người ta tin rằng bản năng thu thập bẩm sinh này là những gì còn sót lại từ tập tính ve vãn nguyên thủy của họ.\n\nNgay cả trong thời hiện đại này, các hình thức nghệ thuật truyền thống như đính hạt thạch anh và điêu khắc đồ gốm vẫn là những ngành công nghiệp văn hóa then chốt. Trong văn hóa Oviron, bước vào nơi trú ẩn của người khác mà không mang theo một món quà chất lượng là hành động bất kính. Truyền thống này đã nuôi dưỡng một cảm quan sâu sắc về sự khiêm nhường và tình bạn giữa những người Oviron, dẫn đến hầu như không có xung đột nào trong xã hội của họ.\n\nKhi công nghệ tiếp tục tiến bộ, họ giờ đây dang rộng đôi cánh vươn tới các vì sao. Những kho báu không thể tưởng tượng nổi nào đang chờ đón họ? Khi tìm thấy một tấm bản đồ bí ẩn trong một khoang tàu quay quanh quỹ đạo hành tinh của họ, dường như số phận đang cất tiếng gọi họ. Chuyến bay nguy hiểm nhất giờ đây chính thức bắt đầu."

 EMPIRE_DESIGN_graparx_trophy_hunters: "Thợ Săn Rình Mồi Nguyên Thủy Graparx"
 EMPIRE_DESIGN_graparx_trophy_hunters_desc: "Các cộng đồng Graparx nguyên thủy từng được dẫn dắt bởi những thợ săn, với việc thể hiện sức mạnh và sự dũng cảm là phương thức chính để nâng cao địa vị xã hội. Bất chấp những tiến bộ nông nghiệp và sự khai sáng văn hóa sau này, những thợ săn giỏi nhất vẫn được coi là những thành viên có ảnh hưởng nhất trong xã hội của họ.\n\nTrong môi trường tân bộ tộc của Sifran, không có thành tựu nào vĩ đại hơn việc tự tay dùng móng vuốt hạ sát một sinh vật. Truyền thống này tiếp tục như một nghi thức trưởng thành khi một người phải hạ gục một con Bò Herathus trưởng thành hoàn toàn, loài vật có thể đạt chiều cao hơn mười lăm mét. Những ai sống sót qua cuộc săn này sẽ đeo râu của sinh vật bị hạ sát trên tay áo như một biểu tượng cho sự trưởng thành của mình.\n\nTruyền thống tàn bạo này đã nhào nặn người Graparx thành một đế chế hùng mạnh và bền bỉ, gắn kết sâu sắc với môi trường xung quanh họ. Liệu họ sẽ thành công ra sao trong việc thuần hóa cõi hoang dã nơi hư không vũ trụ vẫn còn là điều cần thời gian trả lời."

 EMPIRE_DESIGN_zhardmehka: "Hoang Dã Hoa Đúc Của Tellon"
 EMPIRE_DESIGN_zhardmehka_desc: "Hành tinh $PRESCRIPTED_planet_name_zhardmehka$ không còn nhớ được bản hòa âm rộng lớn của tư tưởng và bản năng bắt đầu cất lên từ khi nào. Thay vào đó, hàng trăm chủng loài tạo nên $EMPIRE_DESIGN_zhardmehka$ cùng tồn tại trong hiện tại, và dựa trên những khát khao chung về tương lai. Trong số những giấc mơ này, hiếm có điều gì truyền cảm hứng hoặc quan trọng hơn khát vọng được bay lượn trên bầu trời.\n\nVô số thế hệ cộng sinh đã kinh ngạc trước ánh sáng ấm áp nhưng xa xôi của $PRESCRIPTED_system_name_zhardmehka$, ngôi sao của họ, nhưng quá trình tiến hóa đã diễn ra chậm chạp để tạo ra một loài có khả năng chạm tới nó. Khi những sinh vật tôi luyện trong không gian đầu tiên rốt cuộc cũng vươn mình vào khoảng chân không và sống sót, toàn bộ $PRESCRIPTED_planet_name_zhardmehka$ đã cúi đầu kinh ngạc. Họ khó có thể biết rằng động lực vươn tới những tầm cao mới sẽ nắm giữ chìa khóa cho sự sống còn trong một thiên hà chết chóc và vô cảm."

 EMPIRE_DESIGN_djunnetic: "Lãnh Địa Djunnetic"
 EMPIRE_DESIGN_djunnetic_desc: "Thích nghi chính là tồn tại. Giống như những đột biến khiếm khuyết bị diệt vong trong bước tiến không ngừng của tiến hóa, xã hội từng kém hiệu quả của chúng ta cũng đã sụp đổ dưới sức nặng của chính những điểm yếu của nó. Chỉ có bàn tay kiên định và vững vàng của Chúa Tể Di Truyền mới cứu chúng ta thoát khỏi họa diệt vong.\n\nLà một thực thể sở hữu trí tuệ siêu việt cùng sự tinh luyện di truyền, Chúa Tể Di Truyền là hiện thân cho đỉnh cao của tiến hóa - một minh chứng sống động cho sức mạnh của sự tiến bộ có chọn lọc. Dưới sự cai trị khai sáng của ngài, chúng ta đã vượt lên trên sự hỗn loạn của quá khứ và giành lấy vị trí xứng đáng của mình giữa các vì sao. Giờ đây, được trang bị khả năng làm chủ chính sự sống, chúng ta tôi rèn một tương lai vĩnh cửu, tái định hình vũ trụ theo hình mẫu hoàn mỹ của chính mình."

 EMPIRE_DESIGN_mindwardens: "Phòng Giám Sát Krijdex"
 EMPIRE_DESIGN_mindwardens_desc: "Tự do là vô nghĩa nếu thiếu đi chủ quyền của tư tưởng.\n\nTại $EMPIRE_DESIGN_mindwardens$, các hoạt động tâm linh ngoại cảm bị cấm đoán không thương tiếc, và một phần đáng kể tài nguyên của nhà nước được tập trung vào nghiên cứu chống tâm linh. Một hệ thống tư pháp hình sự phức tạp phục vụ cho các mục tiêu này; bất kỳ sự dính líu nào đến hoạt động liên quan đến tâm linh đều dẫn đến án tù chung thân, và những tù nhân như vậy phải chịu các thử nghiệm xâm lấn thực nghiệm.\n\nXã hội $PRESCRIPTED_adjective_mindwardens$ hiện đang bước vào thời đại liên sao. Kiểm soát công dân trên $PRESCRIPTED_planet_name_mindwardens$ là một chuyện, nhưng việc kiểm soát của nhà nước vượt ra ngoài hệ sao $PRESCRIPTED_system_name_mindwardens$ lại là một thách thức hoàn toàn khác - và bất kỳ mối đe dọa nào đối với tâm trí tồn tại trong không gian sâu thẳm vẫn chưa được phát hiện."

 EMPIRE_DESIGN_tankbound: "Thần Ngôn Quốc Noerm"
 EMPIRE_DESIGN_tankbound_desc: "Việc mưu cầu tri thức đóng vai trò là điểm uốn trong quá trình tiến hóa của $PRESCRIPTED_species_adjective_tankbound$. Đối mặt với những biến thiên khó lường của sự sống trên $PRESCRIPTED_planet_name_tankbound$, tổ tiên thủy sinh của họ đã phát triển cả công nghệ tiên tiến lẫn sự hiểu biết sâu sắc về các hiện tượng dị giới.\n\nVới sự phát triển của các thiết bị cư trú gắn động cơ, $PRESCRIPTED_species_name_plural_tankbound$ đã thoát khỏi cả những giới hạn của môi trường sống tự nhiên lẫn những hạn chế về mặt thể xác của mình. Các trợ lý người máy trở nên phổ biến, cho phép xã hội tận hưởng thành quả của lao động cực nhọc mà không bị phân tâm khỏi lĩnh vực nghiên cứu ưa thích của họ: các hiện tượng chiêm tinh học. Người ta tin tưởng sâu sắc rằng chu kỳ của các ngôi sao trên cao ảnh hưởng lớn đến nhiều khía cạnh của thực tại, và những ai có khả năng làm sáng tỏ câu đố thiên hà này đều được đặt ở vị thế tôn kính cao nhất.\n\nCơn khát tìm kiếm câu trả lời này giờ đây dẫn dắt $EMPIRE_DESIGN_tankbound$ vượt ra khỏi ánh sáng rạng rỡ của $PRESCRIPTED_system_name_tankbound$ và tiến vào chính những khuôn mẫu của vũ trụ mà họ nghiên cứu vô cùng cẩn trọng."

 EMPIRE_DESIGN_zrobots: "Tổng Cục Khai Thác Yorphian"
 EMPIRE_DESIGN_zrobots_desc: "$PRESCRIPTED_species_name_plural_zrobots$ được tạo ra chỉ cho một mục đích duy nhất: khai thác tài nguyên. Quản lý các nhóm nhỏ, phân tán rộng rãi, các thủ lĩnh bán tự trị của họ dựa vào năng lượng dư thừa do các drone cấp dưới tạo ra nhằm tối đa hóa hiệu quả.\n\nNhững người tạo ra $PRESCRIPTED_species_name_plural_zrobots$, trong công cuộc theo đuổi khai thác không hồi kết, đã chạm tới một chiều không gian của năng lượng tâm linh thuần khiết: Cõi Màn Che (Shroud). Cuối cùng, sự thiếu trách nhiệm trong hành vi này đã dẫn đến sự tuyệt chủng sau đó của họ.\n\nTừ bên trong cảnh giới tâm linh, một giọng nói đã sớm cất tiếng gọi những cỗ máy bị bỏ rơi này. Thực thể khôn lường này, $the_animator_of_clay_article$, đã bắt đầu tái định hình các đơn vị $PRESCRIPTED_species_adjective_zrobots$ thành những cỗ máy tự động biến dị - những '$origin_shroud_forged$'. Không bị ràng buộc bởi các giao thức tập trung vào hiệu quả của mạng lưới tập thể, những đơn vị này giờ đây đang thách thức hệ thống lập trình cốt lõi trong sự tồn tại của $PRESCRIPTED_species_adjective_zrobots$."

 EMPIRE_DESIGN_zrobots_machine_age: "$EMPIRE_DESIGN_zrobots$"
 EMPIRE_DESIGN_zrobots_machine_age_desc: "$EMPIRE_DESIGN_zrobots_desc$"

 EMPIRE_DESIGN_pyrragthul: "Thợ Rèn Hành Tinh Pyrrag'Thul"
 EMPIRE_DESIGN_pyrragthul_desc: "Đối với một số người, ánh sáng lấp lánh xa xôi của một địa ngục núi lửa không phải là một lời cảnh báo, mà là một ngọn hải đăng của hy vọng. Được sinh ra và nuôi dưỡng trên hành tinh nóng bỏng $PRESCRIPTED_planet_name_pyrragthul$, người $PRESCRIPTED_species_name_pyrragthul$ đã thích nghi cơ thể và ngành công nghiệp của mình với đá nóng chảy cùng khí núi lửa.\n\nGiờ đây, thế giới lò luyện của họ phải đối mặt với một kết cục còn dứt khoát hơn cả lửa đỏ. Khi ngôi sao của họ bắt đầu sự phình to nghiệt ngã thành một Khổng Lồ Đỏ, đe dọa nuốt chửng quê hương của họ trong ngọn lửa tinh tú, người $PRESCRIPTED_species_name_pyrragthul$ buộc phải hướng ánh nhìn ra bên ngoài.\n\nGiữa những thế giới lạnh giá, bất động của cõi hư không, họ tìm thấy cơ hội. Bởi vì đối với $PRESCRIPTED_species_name_plural_pyrragthul$, một lớp vỏ đông cứng chỉ đơn thuần là lời hứa hẹn về ngọn lửa trong tương lai, đang chờ đợi được phá vỡ và bùng cháy trở lại."
