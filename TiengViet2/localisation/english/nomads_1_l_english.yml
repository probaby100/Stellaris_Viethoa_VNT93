 concept_artificial_colony: "Hành Tinh Nhân Tạo"
 concept_artificial_colonies_desc: "Những cấu trúc không gian có thể sinh sống được với kích thước khổng lồ này không phải được sinh ra từ tự nhiên, mà là được tạo ra bởi các nền văn minh.\n\n§ETrong đó bao gồm:§!\n—$pc_habitat$\n—$pc_ringworld_habitable$\n—$pc_ark$"

