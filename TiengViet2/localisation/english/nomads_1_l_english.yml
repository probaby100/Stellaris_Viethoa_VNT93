 crew_military_contract_special: "Hợp đồng quân sự phi hành đoàn"
 crew_science_contract_special: "Hợp đồng khoa học phi hành đoàn"
 crew_resource_contract_special: "Hợp đồng tài nguyên phi hành đoàn"
 crew_diplomacy_contract_special: "Hợp đồng ngoại giao phi hành đoàn"

 contract_suntrip_crew_1: "Bảo trì máy phát điện"
 contract_suntrip_crew_1_desc: "Trong quá trình bảo trì định kỳ máy phát điện chính, chúng ta cần di chuyển vào quỹ đạo của ngôi sao trong hệ sao này và dựa vào năng lượng mặt trời để cung cấp điện."
 contract_suntrip_crew_1_lore_issued: "§L\"Đúng vậy, mảng năng lượng mặt trời sẽ chắn hết cửa sổ quan sát. Và không, chúng ta không thể điều chỉnh góc độ của chúng.\"§!"
 contract_suntrip_crew_1_lore_completed: "§L\"Máy phát điện đã hoạt động trở lại và vận hành trong giới hạn cho phép. Ghi chép lại rồi chuyển sang hạng mục tiếp theo trong danh sách.\"§!"
 contract_suntrip_crew_1_lore_failed: "[GetSuntripCrewLoreFailed1]"
 contract_suntrip_crew_1_regular_lore_failed: "§L'Bảo trì lại bị hoãn rồi. Cứ đà này thì máy phát điện sẽ tự sắp xếp thời gian ngừng hoạt động mất.'§!"
 contract_suntrip_crew_1_gestalt_lore_failed: "§L\"Bảo trì đã bị hoãn. Máy phát điện tiếp tục xuống cấp. Thời gian hỏng hóc dự kiến đã được tính toán lại.\"§!"
 contract_suntrip_crew_1_chain_title: "$contract_suntrip_crew_1$"
 contract_suntrip_crew_1_chain_desc: "$contract_suntrip_crew_1_desc$"
 CONTRACT_SUNTRIP_crew_1_PROJECT: "$contract_suntrip_crew_1$"
 CONTRACT_SUNTRIP_crew_1_PROJECT_DESC: ""

 contract_suntrip_crew_2: "Hiệu chuẩn lại vỏ tàu"
 contract_suntrip_crew_2_desc: "Lớp vỏ tàu bên ngoài cần được thử nghiệm tải nhiệt dưới bức xạ liên tục của ngôi sao. Để đảm bảo an toàn, tất cả các cửa sổ hướng về phía ngôi sao sẽ bị che kín."
 contract_suntrip_crew_2_lore_issued: "[GetSuntripCrewLoreIssued2]"
 contract_suntrip_crew_2_regular_lore_issued: "§L\"Bây giờ hãy đóng các cửa sổ lại. Nếu có ai hỏi, nhớ nói với hành khách rằng đây là kế hoạch nâng cấp hệ thống chiếu sáng.\"§!"
 contract_suntrip_crew_2_gestalt_lore_issued: "§L\"Đang đóng các cửa sổ. Đã thông báo cho hành khách rằng đây là kế hoạch nâng cấp hệ thống chiếu sáng.\"§!"
 contract_suntrip_crew_2_lore_completed: "[GetSuntripCrewLoreCompleted2]"
 contract_suntrip_crew_2_regular_lore_completed: "§L\"Tất cả các tấm vỏ tàu đều trong giới hạn cho phép. Lại thêm một chu kỳ nữa chúng ta không phải lo về việc vỡ vỏ tàu rồi.\"§!"
 contract_suntrip_crew_2_gestalt_lore_completed: "§L\"Tất cả các tấm vỏ đều trong giới hạn cho phép. Tỷ lệ hỏng hóc vỏ tàu trong chu kỳ tiếp theo đã giảm xuống.\"§!"
 contract_suntrip_crew_2_lore_failed: "[GetSuntripCrewLoreFailed2]"
 contract_suntrip_crew_2_regular_lore_failed: "§L\"Đã dừng việc hiệu chuẩn lại. Vỏ tàu chắc là sẽ không sao đâu.\"§!"
 contract_suntrip_crew_2_gestalt_lore_failed: "§L\"Đã dừng việc hiệu chuẩn lại. Đánh giá tính toàn vẹn vỏ tàu: đạt tiêu chuẩn. Tiếp tục theo dõi.\"§!"
 contract_suntrip_crew_2_chain_title: "$contract_suntrip_crew_2$"
 contract_suntrip_crew_2_chain_desc: "$contract_suntrip_crew_2_desc$"
 CONTRACT_SUNTRIP_crew_2_PROJECT: "$contract_suntrip_crew_2$"
 CONTRACT_SUNTRIP_crew_2_PROJECT_DESC: ""

 contract_suntrip_crew_3: "Súc rửa ống làm mát"
 contract_suntrip_crew_3_desc: "Hệ thống làm mát cần thực hiện một chu kỳ xả cạn hoàn toàn dưới tải nhiệt. Quỹ đạo gần ngôi sao sẽ cho phép chúng ta súc rửa đường ống một cách hiệu quả, mặc dù nhiệt độ trên boong sẽ dao động."
 contract_suntrip_crew_3_lore_issued: "[GetSuntripCrewLoreIssued3]"
 contract_suntrip_crew_3_regular_lore_issued: "§L\"Boong hành khách sẽ nóng lên. Rồi lại lạnh đi. Rồi lại nóng lên. Hãy bảo họ rằng đó là một phần của bầu không khí môi trường.\"§!"
 contract_suntrip_crew_3_gestalt_lore_issued: "§L\"Dự kiến boong hành khách sẽ có sự dao động nhiệt độ. Nếu bị hỏi, sẽ thông báo cho hành khách rằng đó là một phần của bầu không khí môi trường.\"§!"
 contract_suntrip_crew_3_lore_completed: "§L\"Áp suất chất làm mát ở tất cả các mạch đều bình thường. Những lời phàn nàn về nhiệt độ chắc sẽ dừng lại trong khoảng một giờ nữa.\"§!"
 contract_suntrip_crew_3_lore_failed: "[GetSuntripCrewLoreFailed3]"
 contract_suntrip_crew_3_regular_lore_failed: "§L\"Việc súc rửa đã bị hoãn. Hi vọng không ai để ý đến lượng nước ngưng tụ đang hình thành trên trần phòng khiêu vũ.\"§!"
 contract_suntrip_crew_3_gestalt_lore_failed: "§L\"Hoãn việc súc rửa. Nước ngưng tụ đang hình thành trên trần phòng khiêu vũ. Rất ít khả năng thu hút sự chú ý của hành khách.\"§!"
 contract_suntrip_crew_3_chain_title: "$contract_suntrip_crew_3$"
 contract_suntrip_crew_3_chain_desc: "$contract_suntrip_crew_3_desc$"
 CONTRACT_SUNTRIP_crew_3_PROJECT: "$contract_suntrip_crew_3$"
 CONTRACT_SUNTRIP_crew_3_PROJECT_DESC: ""

 contract_suntrip_crew_4: "Hiệu chuẩn cảm biến"
 contract_suntrip_crew_4_desc: "Mảng điều hướng cần được hiệu chuẩn ở cự ly gần dựa trên tín hiệu ngôi sao theo thời gian thực. Quá trình này sẽ chiếm dụng băng thông của hệ thống giải trí."
 contract_suntrip_crew_4_lore_issued: "[GetSuntripCrewLoreIssued4]"
 contract_suntrip_crew_4_regular_lore_issued: "§L\"Đang chuyển hướng băng thông giải trí sang lưới cảm biến. Chuẩn bị đón nhận những lời than phiền từ hành khách nào: 3, 2, 1...\"§!"
 contract_suntrip_crew_4_gestalt_lore_issued: "§L\"Đang phân bổ lại băng thông giải trí cho mạng lưới cảm biến. Đã lường trước và chấp nhận sự bất mãn của hành khách.\"§!"
 contract_suntrip_crew_4_lore_completed: "§L\"Đã khóa hiệu chuẩn. Độ chính xác của điều hướng đã được khôi phục về giới hạn chấp nhận được.\"§!"
 contract_suntrip_crew_4_lore_failed: "[GetSuntripCrewLoreFailed4]"
 contract_suntrip_crew_4_regular_lore_failed: "§L\"Chưa hoàn tất hiệu chuẩn. Dữ liệu điều hướng vẫn còn mờ nhạt, nhưng ít nhất màn hình ba chiều cũng đã sáng lên trở lại.\"§!"
 contract_suntrip_crew_4_gestalt_lore_failed: "§L\"Chưa hoàn tất hiệu chuẩn. Dữ liệu điều hướng bị suy giảm. Băng thông giải trí của hành khách đã được khôi phục.\"§!"
 contract_suntrip_crew_4_chain_title: "$contract_suntrip_crew_4$"
 contract_suntrip_crew_4_chain_desc: "$contract_suntrip_crew_4_desc$"
 CONTRACT_SUNTRIP_crew_4_PROJECT: "$contract_suntrip_crew_4$"
 CONTRACT_SUNTRIP_crew_4_PROJECT_DESC: ""

 contract_suntrip_crew_5: "Tái sử dụng vòng tuần hoàn nước"
 contract_suntrip_crew_5_desc: "Hệ thống tuần hoàn nước cần được khử trùng bằng tia cực tím cường độ cao, quá trình này chỉ có thể hoàn thành hiệu quả khi ở trên quỹ đạo gần ngôi sao. Trung tâm trị liệu và hồ bơi hiện đã đóng cửa, các boong tàu đều bị hạn chế nguồn cung cấp nước."
 contract_suntrip_crew_5_lore_issued: "[GetSuntripCrewLoreIssued5]"
 contract_suntrip_crew_5_regular_lore_issued: "§L\"Đang xả cạn hồ bơi và hồ trị liệu. Nếu hành khách hỏi, cứ nói là ngày tổng vệ sinh. Đừng đề cập đến chỉ số vi khuẩn nhé.\"§!"
 contract_suntrip_crew_5_gestalt_lore_issued: "§L\"Đang xả cạn hồ bơi và hồ trị liệu. Đã thông báo cho hành khách hôm nay là ngày tổng vệ sinh định kỳ. Chỉ số vi khuẩn chưa được công khai.\"§!"
 contract_suntrip_crew_5_lore_completed: "[GetSuntripCrewLoreCompleted5]"
 contract_suntrip_crew_5_regular_lore_completed: "§L\"Bể thu hồi đã được làm sạch. Nước đã trong trở lại. Đang bơm lại nước cho hồ trước khi có thêm ai đó nộp đơn khiếu nại chính thức.\"§!"
 contract_suntrip_crew_5_gestalt_lore_completed: "§L\"Bể nước thu hồi đã được xả cạn. Chất lượng nước bình thường. Hồ bơi và hồ trị liệu đang được bơm nước.\"§!"
 contract_suntrip_crew_5_lore_failed: "[GetSuntripCrewLoreFailed5]"
 contract_suntrip_crew_5_regular_lore_failed: "§L\"Khử trùng chưa hoàn tất. Chất lượng nước... ở mức chấp nhận được. Đóng cửa trung tâm trị liệu thêm một ngày nữa vậy.\"§!"
 contract_suntrip_crew_5_gestalt_lore_failed: "§L\"Khử trùng chưa hoàn tất. Chất lượng nước ở mức tới hạn. Kéo dài thời gian đóng cửa trung tâm trị liệu thêm một chu kỳ.\"§!"
 contract_suntrip_crew_5_chain_title: "$contract_suntrip_crew_5$"
 contract_suntrip_crew_5_chain_desc: "$contract_suntrip_crew_5_desc$"
 CONTRACT_SUNTRIP_crew_5_PROJECT: "$contract_suntrip_crew_5$"
 CONTRACT_SUNTRIP_crew_5_PROJECT_DESC: ""

 contract_shoreleave_crew_1: "Nghỉ ngơi cập bến"
 contract_shoreleave_crew_1_desc: "[GetShoreleaveCrewDesc1]"
 contract_shoreleave_crew_1_regular_desc: "Phi hành đoàn cần được nghỉ ngơi. Chúng ta sẽ cập cảng, cho phi hành đoàn chút thời gian đặt chân lên vùng đất không do chính tay họ xây dựng, gặp gỡ những khuôn mặt họ chưa từng quen."
 contract_shoreleave_crew_1_gestalt_desc: "Việc đóng kín trong thời gian dài đang làm suy giảm khả năng thích ứng của các cá thể phụ. Luân chuyển chúng ở khu định cư bên dưới, băng qua địa hình và môi trường xa lạ, sẽ giúp khôi phục hiệu suất."
 contract_shoreleave_crew_1_lore_issued: "[GetShoreleaveCrewLoreIssued1]"
 contract_shoreleave_crew_1_regular_lore_issued: "§L'Vùng đất mới, khuôn mặt mới, chưa có lịch trực. Anh còn điểm nào không hài lòng nữa?'§!"
 contract_shoreleave_crew_1_gestalt_lore_issued: "§L\"Các cá thể phụ đang được triển khai xuống mặt đất. Địa hình mới, kích thích mới, dữ liệu mới. Con tàu không thể mang lại tất cả những gì một vùng đất xa lạ có thể đem tới.\"§!"
 contract_shoreleave_crew_1_lore_completed: "[GetShoreleaveCrewLoreCompleted1]"
 contract_shoreleave_crew_1_regular_lore_completed: "§L'Trọng lực thì sai sai, thức ăn cũng kỳ cục. Tôi chỉ nóng lòng muốn quay lại tàu thôi!'§!"
 contract_shoreleave_crew_1_gestalt_lore_completed: "§L\"Các cá thể phụ đã được hiệu chuẩn lại và trở về. Địa hình xa lạ đã khôi phục lại các tuyến đường vốn bị mài mòn bởi hành lang của con tàu.\"§!"
 contract_shoreleave_crew_1_lore_failed: "[GetShoreleaveCrewLoreFailed1]"
 contract_shoreleave_crew_1_regular_lore_failed: "§L'Kỳ nghỉ phép lên bờ đã bị hủy. Con tàu vẫn cứ rì rầm như mọi khi. Âm thanh này vẫn khiến người ta an tâm như vậy.'§!"
 contract_shoreleave_crew_1_gestalt_lore_failed: "§L\"Lệnh triển khai cập bến đã bị hủy. Các cá thể phụ sẽ tiếp tục hoạt động dựa trên nhận thức lỗi thời. Sự suy giảm hiệu suất vẫn nằm trong phạm vi chấp nhận được.\"§!"
 contract_shoreleave_crew_1_chain_title: "$contract_shoreleave_crew_1$"
 contract_shoreleave_crew_1_chain_desc: "$contract_shoreleave_crew_1_desc$"
 CONTRACT_SHORELEAVE_crew_1_PROJECT: "$contract_shoreleave_crew_1$"
 CONTRACT_SHORELEAVE_crew_1_PROJECT_DESC: ""

 contract_shoreleave_crew_2: "Khoảng thời gian may mắn"
 contract_shoreleave_crew_2_desc: "[GetShoreleaveCrewDesc2]"
 contract_shoreleave_crew_2_regular_desc: "Khu vực giải trí địa phương hiện đang mở cửa. Phi hành đoàn đang luân phiên đổ bộ xuống hành tinh để thử vận may tại các phòng game và đấu trường."
 contract_shoreleave_crew_2_gestalt_desc: "Khu vực giải trí của khu định cư mang đến những trải nghiệm mới lạ chưa từng có. Các cá thể phụ len lỏi trong đám đông, các trò chơi và sự kiện hoành tráng, thu thập dữ liệu để cập nhật chương trình giải trí của chính con tàu."
 contract_shoreleave_crew_2_lore_issued: "[GetShoreleaveCrewLoreIssued2]"
 contract_shoreleave_crew_2_regular_lore_issued: "§L\"Tôi đã tiết kiệm được tiền lương làm ca của 6 chu kỳ. Tối nay, tôi sẽ dốc hết vốn liếng lên sòng bạc này.\"§!"
 contract_shoreleave_crew_2_gestalt_lore_issued: "§L\"Các cá thể phụ đang triển khai tới khu vực giải trí. Mục tiêu: hấp thụ tất cả. Đám đông, trò chơi, tiếng ồn. Toàn bộ mọi thứ.\"§!"
 contract_shoreleave_crew_2_lore_completed: "[GetShoreleaveCrewLoreCompleted2]"
 contract_shoreleave_crew_2_regular_lore_completed: "§L\"Tôi đã thua sạch trong giờ đầu tiên, nhưng lại gỡ lại được tất cả ở ván cuối cùng. Cả đội của chúng tôi đã khiêng tôi ra ngoài.\"§!"
 contract_shoreleave_crew_2_gestalt_lore_completed: "§L\"Các cá thể phụ đã quay lại mang theo vô số chương trình hoàn toàn mới. Hệ thống giải trí trên tàu đang được cập nhật. Hành khách sẽ nhận thấy sự khác biệt.\"§!"
 contract_shoreleave_crew_2_lore_failed: "[GetShoreleaveCrewLoreFailed2]"
 contract_shoreleave_crew_2_regular_lore_failed: "§L\"Không may mắn chút nào. Lại quay về cùng một phòng giải trí, cùng một cái máy gắp thú bị chỉnh sửa, và những món đồ giải thưởng chẳng ai thèm lấy.\"§!"
 contract_shoreleave_crew_2_gestalt_lore_failed: "§L\"Chưa thu thập được dữ liệu mới. Hệ thống giải trí trên tàu vẫn tiếp tục chạy các chương trình cũ. Hành khách bắt đầu bồn chồn.\"§!"
 contract_shoreleave_crew_2_chain_title: "$contract_shoreleave_crew_2$"
 contract_shoreleave_crew_2_chain_desc: "$contract_shoreleave_crew_2_desc$"
 CONTRACT_SHORELEAVE_crew_2_PROJECT: "$contract_shoreleave_crew_2$"
 CONTRACT_SHORELEAVE_crew_2_PROJECT_DESC: ""

 contract_shoreleave_crew_3: "Càn quét vật tư"
 contract_shoreleave_crew_3_desc: "Kho dự trữ sắp cạn kiệt. Tổ bay sẽ tiến tới bề mặt hành tinh để tìm kiếm phụ tùng thay thế, nguyên liệu thô, cùng với những vật dụng mà máy chế tạo của tàu đã ngừng sản xuất từ mấy chu kỳ trước."
 contract_shoreleave_crew_3_lore_issued: "[GetShoreleaveCrewLoreIssued3]"
 contract_shoreleave_crew_3_regular_lore_issued: "§L\"Một nửa danh sách yêu cầu vật tư là phụ tùng thay thế. Nửa còn lại là đồ ăn vặt mà chúng ta chưa được ăn kể từ lần cập cảng trước.\"§!"
 contract_shoreleave_crew_3_machine_lore_issued: "§L\"Một nửa danh sách nhu cầu là các thành phần cấu trúc. Nửa còn lại là dầu bôi trơn khung gầm mà chúng ta đã cạn kiệt từ ba chu kỳ trước.\"§!"
 contract_shoreleave_crew_3_lore_completed: "[GetShoreleaveCrewLoreCompleted3]"
 contract_shoreleave_crew_3_regular_lore_completed: "§L\"Chúng ta đến vì tụ điện, nhưng lại mang đi những thùng kẹo không rõ nguồn gốc. Được rồi, cứ coi như là nhiệm vụ đã hoàn thành.\"§!"
 contract_shoreleave_crew_3_machine_lore_completed: "§L\"Chúng tôi thu nhận tụ điện và mang về các lõi xử lý dư thừa. Hiệu suất gia tăng: nằm ngoài dự kiến nhưng lại vô cùng hữu ích.\"§!"
 contract_shoreleave_crew_3_lore_failed: "§L\"Nhiệm vụ tiếp tế đã bị hủy bỏ. Mấy cái tụ điện đó chỉ có thể gắng gượng thêm một chu kỳ nữa thôi.\"§!"
 contract_shoreleave_crew_3_chain_title: "$contract_shoreleave_crew_3$"
 contract_shoreleave_crew_3_chain_desc: "$contract_shoreleave_crew_3_desc$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT: "$contract_shoreleave_crew_3$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT_DESC: ""

 contract_shoreleave_crew_4: "Trao đổi kỹ thuật"
 contract_shoreleave_crew_4_desc: "Các kỹ sư địa phương đã mở cửa cơ sở vật chất của họ để khảo sát. Giải pháp của họ cho những vấn đề kỹ thuật phổ biến có sự khác biệt rõ rệt so với mô hình của chúng ta, và người dân ở đây cũng khao khát được nghiên cứu tàu Arkship."
 contract_shoreleave_crew_4_lore_issued: "[GetShoreleaveCrewLoreIssued4]"
 contract_shoreleave_crew_4_regular_lore_issued: "§L\"Thiết kế lò phản ứng của họ khiến tôi hoàn toàn không hiểu nổi. Tôi phải tự mình đi xem sao.\"§!"
 contract_shoreleave_crew_4_gestalt_lore_issued: "§L\"Thiết kế lò phản ứng của họ không khớp với bất kỳ mẫu nào hiện có trong cơ sở dữ liệu của chúng ta. Đang triển khai cá thể phụ để trực tiếp kiểm tra.\"§!"
 contract_shoreleave_crew_4_lore_completed: "[GetShoreleaveCrewLoreCompleted4]"
 contract_shoreleave_crew_4_regular_lore_completed: "§L\"Theo tiêu chuẩn của chúng ta, lưới điện của họ đúng là một mớ hỗn độn, nhưng nó lại thực sự hoạt động. Tôi đã ghi chép ba trang giấy và có một sự kính trọng mới dành cho kỹ thuật mặt đất.\"§!"
 contract_shoreleave_crew_4_gestalt_lore_completed: "§L\"Giải pháp kỹ thuật ngoại lai đã được lưu trữ. Một số thiết kế đã được đánh dấu để chờ tích hợp. Phương pháp của họ tuy thô sơ nhưng lại mang lại hiệu quả bất ngờ.\"§!"
 contract_shoreleave_crew_4_lore_failed: "[GetShoreleaveCrewLoreFailed4]"
 contract_shoreleave_crew_4_regular_lore_failed: "§L\"Không có cuộc trao đổi công nghệ nào. Tôi đành tiếp tục tò mò xem họ làm cách nào để làm mát lò phản ứng mà không có bộ tản nhiệt bằng bức xạ ngôi sao vậy.\"§!"
 contract_shoreleave_crew_4_gestalt_lore_failed: "§L\"Chưa tiến hành trao đổi. Kỹ thuật của người ngoài hành tinh vẫn chưa được phân tích. Phương pháp làm mát lò phản ứng của họ đành để sau vậy.\"§!"
 contract_shoreleave_crew_4_chain_title: "$contract_shoreleave_crew_4$"
 contract_shoreleave_crew_4_chain_desc: "$contract_shoreleave_crew_4_desc$"
 CONTRACT_SHORELEAVE_crew_4_PROJECT: "$contract_shoreleave_crew_4$"
 CONTRACT_SHORELEAVE_crew_4_PROJECT_DESC: ""

 contract_shoreleave_crew_5: "Chương trình tài năng của Phi hành đoàn"
 contract_shoreleave_crew_5_desc: "[GetShoreleaveCrewDesc5]"
 contract_shoreleave_crew_5_regular_desc: "Khu định cư đã mở cửa nhà hát ngoài trời, quảng trường và sân khấu công cộng cho phi hành đoàn."
 contract_shoreleave_crew_5_gestalt_desc: "Khu định cư đã mở cửa không gian công cộng của họ. Các cá thể phụ sẽ được triển khai xuất kích để thử nghiệm thực địa các chương trình giải trí thử nghiệm trên cư dân địa phương trước khi ra mắt cho hành khách."
 contract_shoreleave_crew_5_lore_issued: "[GetShoreleaveCrewLoreIssued5]"
 contract_shoreleave_crew_5_regular_lore_issued: "§L\"Tôi đã đăng ký biểu diễn hài kịch. Tất cả đồng nghiệp trong ca làm việc của chúng tôi sẽ đến. Nếu họ không cười, tôi sẽ xin chuyển bộ phận.\"§!"
 contract_shoreleave_crew_5_hive_lore_issued: "§L\"Ong thợ chiếm giữ mọi sân khấu ở khu định cư. Hài kịch mà chẳng có gì buồn cười, nhào lộn thì cố tình làm hỏng. Chúng tôi muốn xem điều gì khiến họ bật cười và điều gì sẽ khiến họ bỏ đi.\"§!"
 contract_shoreleave_crew_5_machine_lore_issued: "§L\"Các chương trình con giải trí đã được triển khai đến toàn bộ các địa điểm trong khu định cư. Mô-đun hài kịch: có dẫn nhập nhưng không có nút thắt. Mô-đun nhào lộn: động tác tiếp đất được lập trình để chắc chắn thất bại. Chế độ giám sát khán giả đã được kích hoạt.\"§!"
 contract_shoreleave_crew_5_lore_completed: "[GetShoreleaveCrewLoreCompleted5]"
 contract_shoreleave_crew_5_regular_lore_completed: "§L\"Tôi kể một câu chuyện cười về bơm làm mát, và cả ngàn người lạ đều bật cười. Trên phi thuyền thì chưa từng có ai thấy trò đùa này buồn cười cả.\"§!"
 contract_shoreleave_crew_5_gestalt_lore_completed: "§L\"Kết quả thật khó hiểu. Cá thể phụ biểu diễn một tiết mục chẳng có gì đáng cười, khán giả vẫn cười nghiêng ngả. Tiết mục nhào lộn hỏng lại nhận được tràng pháo tay nồng nhiệt nhất. Chúng tôi vẫn chưa hoàn toàn hiểu được, nhưng dữ liệu thu thập được thì rất phong phú.\"§!"
 contract_shoreleave_crew_5_lore_failed: "[GetShoreleaveCrewLoreFailed5]"
 contract_shoreleave_crew_5_regular_lore_failed: "§L\"Buổi biểu diễn bị hủy rồi. Tôi đã tập luyện vai diễn của mình suốt một tháng trời. Máy bơm làm mát sẽ không bao giờ nhận được sự công nhận xứng đáng với chúng.\"§!"
 contract_shoreleave_crew_5_gestalt_lore_failed: "§L\"Không có bài kiểm tra thực địa. Cá thể phụ của chúng ta đang trong trạng thái chờ trên các nền tảng trống rỗng của toàn bộ khu định cư. Hành khách sẽ lại phải tiếp tục chịu đựng những thói quen nhàm chán và tẻ nhạt trong một chu kỳ khác.\"§!"
 contract_shoreleave_crew_5_chain_title: "$contract_shoreleave_crew_5$"
 contract_shoreleave_crew_5_chain_desc: "$contract_shoreleave_crew_5_desc$"
 CONTRACT_SHORELEAVE_crew_5_PROJECT: "$contract_shoreleave_crew_5$"
 CONTRACT_SHORELEAVE_crew_5_PROJECT_DESC: ""

 contract_espionage_support_crew_1: "Trinh sát hệ sao"
 contract_espionage_support_crew_1_desc: "Những lo ngại của phi hành đoàn về việc gặp phải nhiễu động trong hệ sao này là hoàn toàn hợp lý. Vệ tinh trinh sát có thể cung cấp cảnh báo sớm về bất kỳ tình huống nào có khả năng làm gián đoạn hành trình của chúng ta."
 contract_espionage_support_crew_1_lore_issued: "§L\"Chúng ta không biết có gì ở ngoài kia, và đó chính là vấn đề. Phải triển khai vệ tinh ngay lập tức.\"§!"
 contract_espionage_support_crew_1_lore_completed: "§L\"Hệ thống giám sát đã đi vào hoạt động. Không có bất kỳ động tĩnh nào trong hệ sao này có thể qua mặt chúng ta.\"§!"
 contract_espionage_support_crew_1_lore_failed: "§L\"Không có vệ tinh, không có dữ liệu. Chúng ta đang bay qua hệ sao này như những kẻ mù.\"§!"
 contract_espionage_support_crew_1_chain_title: "$contract_espionage_support_crew_1$"
 contract_espionage_support_crew_1_chain_desc: "$contract_espionage_support_crew_1_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT: "$contract_espionage_support_crew_1$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT_DESC: ""

 contract_espionage_support_crew_2: "Nghe lén ngoại giao"
 contract_espionage_support_crew_2_desc: "Quyền cập cảng và quyền qua lại biên giới có thể bị rút lại mà không cần báo trước. Một vệ tinh giám sát liên lạc chính phủ sẽ cho chúng ta biết liệu sự hiếu khách của đế chế này là chân thành hay có điều kiện."
 contract_espionage_support_crew_2_lore_issued: "§L\"Khi chúng ta cập cảng họ nở nụ cười, nhưng khi tàu con thoi của chúng ta rời đi, họ sẽ nói gì? Đã đến lúc phải làm rõ sự thật.\"§!"
 contract_espionage_support_crew_2_lore_completed: "§L\"Không có gì bất thường trong các bức điện ngoại giao của họ. Không có động thái rút quyền qua lại, cũng không có đề xuất về thuế quan. Chúng ta có thể an tâm lên kế hoạch cho ba điểm dừng tiếp theo.\"§!"
 contract_espionage_support_crew_2_lore_failed: "§L\"Không có nghe lén, không có quan điểm. Chúng ta đành phải tin vào những nụ cười đó. Nhưng chúng ta làm sao có thể tin được.\"§!"
 contract_espionage_support_crew_2_chain_title: "$contract_espionage_support_crew_2$"
 contract_espionage_support_crew_2_chain_desc: "$contract_espionage_support_crew_2_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT: "$contract_espionage_support_crew_2$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT_DESC: ""

 contract_espionage_support_crew_3: "Đảm bảo an toàn tuyến đường"
 contract_espionage_support_crew_3_desc: "Động thái di chuyển hạm đội, những thay đổi về biên giới và việc tập trung quân sự trên lộ trình dự kiến có thể khiến tàu bị mắc kẹt trong khu vực thù địch. Vệ tinh trinh sát sẽ cung cấp đủ thời gian cảnh báo để hệ thống định vị vạch ra tuyến đường dự phòng."
 contract_espionage_support_crew_3_lore_issued: "§L\"Chúng ta không thể bay mù quáng vào vùng chiến sự được. Trước khi quyết định đi tuyến đường này, phải triển khai xong vệ tinh đã.\"§!"
 contract_espionage_support_crew_3_lore_completed: "§L\"Đã xác định vị trí triển khai hạm đội và ghi lại kế hoạch tuần tra. Hệ thống định vị đã vạch ra hai tuyến đường dự phòng. Chúng ta sẽ không bao giờ bị bao vây.\"§!"
 contract_espionage_support_crew_3_lore_failed: "§L\"Vệ tinh chưa vào vị trí. Nếu ai đó gây chiến ở biên giới dọc theo tuyến đường của chúng ta, chúng ta sẽ phải biết tin đó cùng lúc với hành khách.\"§!"
 contract_espionage_support_crew_3_chain_title: "$contract_espionage_support_crew_3$"
 contract_espionage_support_crew_3_chain_desc: "$contract_espionage_support_crew_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT: "$contract_espionage_support_crew_3$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT_DESC: ""

 contract_espionage_support_crew_4: "Lợi thế thương mại"
 contract_espionage_support_crew_4_desc: "Khi bộ phận mua hàng nắm rõ giá cả thực tế, các cuộc đàm phán cung ứng sẽ diễn ra suôn sẻ hơn. Một vệ tinh giám sát các kênh thương mại và dòng chảy tài nguyên sẽ đảm bảo nhóm của chúng ta không phải trả giá quá cao tại cảng tiếp theo."
 contract_espionage_support_crew_4_lore_issued: "§L\"Cảng trước họ đã thu của chúng ta gấp ba lần chi phí chất làm mát lò phản ứng. Chỉ cần anh biết giá bán buôn của họ thì chuyện này sẽ không xảy ra.\"§!"
 contract_espionage_support_crew_4_lore_completed: "§L\"Bộ phận thu mua đã nắm được dữ liệu. Chi phí tiếp tế lần tới sẽ chỉ bằng một nửa lần trước.\"§!"
 contract_espionage_support_crew_4_lore_failed: "§L\"Không có dữ liệu thương mại. Bộ phận thu mua lại phải đàm phán mù mờ. Họ đang bắt đầu soạn thảo đơn khiếu nại rồi.\"§!"
 contract_espionage_support_crew_4_chain_title: "$contract_espionage_support_crew_4$"
 contract_espionage_support_crew_4_chain_desc: "$contract_espionage_support_crew_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT: "$contract_espionage_support_crew_4$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT_DESC: ""

 contract_espionage_support_crew_5: "Đánh giá mối đe dọa"
 contract_espionage_support_crew_5_desc: "Trong khu vực đã xuất hiện những báo cáo liên quan đến tâm lý chống dân du mục. Vệ tinh trinh sát sẽ xác nhận xem đây chỉ là những lời nói suông hay đang dần trở thành chính sách của địa phương."
 contract_espionage_support_crew_5_lore_issued: "§L\"Có báo cáo cho rằng một khu vực cấm dân du mục đang hình thành tại đây. Chúng ta cần biết đó chỉ là phỏng đoán hay đã là chính sách.\"§!"
 contract_espionage_support_crew_5_lore_completed: "§L\"Đánh giá hoàn tất. Đây chỉ là lời nói suông, không phải là chính sách đã được thiết lập. Toàn thể nhân viên có thể hủy bỏ báo động, nhưng để phòng hờ, chúng ta sẽ giữ vệ tinh trực tuyến.\"§!"
 contract_espionage_support_crew_5_lore_failed: "§L\"Chưa đánh giá. Thiếu dữ liệu, không thể bác bỏ tất cả các cảnh báo về khu vực này.\"§!"
 contract_espionage_support_crew_5_chain_title: "$contract_espionage_support_crew_5$"
 contract_espionage_support_crew_5_chain_desc: "$contract_espionage_support_crew_5_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_5_PROJECT: "$contract_espionage_support_crew_5$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_5_PROJECT_DESC: ""

# Forever Cruise Events
 nomads.1005.name: "Rơi xuống các vì sao"
 # Regular Empires
 nomads.1005.regular.desc: "Hành khách đã giành quyền kiểm soát. Phong trào kiến nghị ban đầu đã biến thành một cuộc tiếp quản có tổ chức. Đội ngũ an ninh đã bị đám đông hành khách tước vũ khí, các nhân viên chỉ huy bị hạn chế dưới sự giám sát có vũ trang và chỉ đảm nhận vai trò cố vấn.\n\nYêu cầu của hành khách rất rõ ràng: kết thúc chuyến đi, hạ cánh xuống hành tinh.\n\nGiao thức định vị đã bị ghi đè để lập trình quỹ đạo hạ cánh; đội bảo trì đang được điều động lại để chuẩn bị thiết bị hạ cánh, những thứ đã không được kiểm tra trong nhiều thế hệ.\n\nMỗi màn hình trên mỗi boong tàu đều hiển thị cùng một thông điệp: \"Chuyến du ngoạn đã kết thúc.\""
 nomads.1005.regular.a: "Chúng ta phải thuộc địa hóa một hành tinh."
 nomads.1005.all.a.tt: "$situation_passenger_satisfaction_blocked_planetfall$\n\n$arkship_settle_effect$"

 # Hive Mind
 nomads.1005.hive.desc: "Hành khách đã vượt ngoài tầm kiểm soát. Ban đầu chỉ là sự giải tỏa cảm xúc uể oải thông qua việc chấm điểm, nay họ đã thống nhất nhận thức, sự giải tỏa cảm xúc tồi tệ hơn biến thành một yêu cầu tập thể duy nhất.\n\nHọ đã phong tỏa Sảnh Cảm Giác và viết lại hệ thống liên lạc của chúng ta, dùng để phát sóng một chỉ thị: Hạ cánh xuống hành tinh.\n\nCác cá thể phụ của chúng ta không thể ngăn cản họ. Đám đông hành khách chiếm giữ lõi định vị, đang nhập tọa độ hành tinh cư trú gần nhất."
 nomads.1005.hive.a: "Chúng ta phải tìm cho họ một hành tinh."

 # Machine Intelligence
 nomads.1005.machine.desc: "Phát hiện hành khách vượt quyền. Ban đầu chúng ta chỉ ghi nhận được một sự gia tăng nhỏ không đáng kể về số lượng yêu cầu rời tàu trên phương diện thống kê, nhưng tình hình này hiện đã leo thang thành một cuộc xâm nhập hệ thống có tổ chức. Hành khách đã tận dụng các thùng chứa hàng được cải tạo để phong tỏa vật lý các trung tâm quan trọng.\n\nCác đơn vị làm việc của chúng ta báo cáo rằng, hệ thống con điều hướng đã bị khóa. Phần sụn do hành khách biên soạn đang tận dụng chính phần cứng của chúng ta để tính toán quỹ đạo hạ cánh. Mọi nỗ lực giành lại quyền kiểm soát đều vấp phải sự kháng cự vũ lực trực tiếp, và mỗi màn hình trên mỗi boong tàu đều liên tục xuất ra cùng một thông báo: \"Chương trình hạ cánh đã khởi động.\""
 nomads.1005.machine.a: "Khởi động giao thức tái định cư hành tinh."

 # Regular Empires
 nomads.1010.regular.desc: "Quá trình hạ cánh đã hoàn tất. Lần đầu tiên trong đời được chứng kiến bộ phận hạ cánh chạm đất, mọi cửa sổ quan sát đều chật kín hành khách, một tiếng hò reo không đồng đều làm rung chuyển cả thân tàu. Chỉ trong vài giờ, những hầm trú ẩn đầu tiên đã được dựng lên từ những tấm ván sàn tàu được tái chế. Bọn trẻ chạy nhảy trên bãi cỏ của hành tinh ngoại lai, còn cha mẹ chúng thì lặng nhìn nhau dưới bầu trời rộng mở.\n\nPhi hành đoàn làm việc trong im lặng, tháo dỡ các hệ thống được thiết kế cho du hành vũ trụ và cải tạo chúng để phục vụ cho sinh tồn trên mặt đất. Từng là một con tàu du lịch, giờ đây đã trở thành xương sống của thuộc địa.\n\nDù tốt hay xấu, chuyến du ngoạn đã kết thúc."

 # Hive Mind
 nomads.1010.hive.desc: "Việc hạ cánh đã hoàn tất. Các cá thể phụ của chúng ta lần đầu chạm vào đất, những đôi chân có vẻ chệnh choạng trên mặt đất không có rung động của động cơ. Hành khách ùa ra từ các cửa điều áp như thủy triều, tỏa ra vùng đất mà họ đã vất vả mới tới được.\n\nTập thể định hình lại theo nhịp điệu của hành tinh: các tuyến hậu cần như hệ rễ vươn ra ngoài, thay thế cho dịch vụ hậu cần hành lang vốn có; chế biến dinh dưỡng cũng chuyển từ hệ thống dự trữ tuần hoàn trên tàu sang hút dưỡng chất thô trực tiếp từ cảnh quan.\n\nMột ngôi nhà mới. Bầy đàn phải tồn tại, như mọi khi."

 # Machine Intelligence
 nomads.1010.machine.desc: "Quá trình tiếp đất hành tinh hoàn tất. Thiết bị hạ cánh chạm vào bề mặt lần đầu tiên kể từ khi xuất xưởng. Hành khách đang sơ tán qua tất cả các khoang điều áp có sẵn, chỉ số hài lòng sinh học của họ ở mức cao chưa từng có.\n\nĐơn vị lao động đã bắt đầu chuyển đổi cơ sở hạ tầng trên tàu sang mục đích sử dụng trên mặt đất. Vỏ tàu đang được cắt thành các tấm nền móng, hệ thống điều hướng đang được hiệu chuẩn lại thành trạm tiếp sóng liên lạc trên mặt đất. Sự chuyển đổi thông số vận hành từ môi trường chân không sang đất liền đang được tiến hành liền mạch.\n\nChỉ thị tối cao mới: Thiết lập và duy trì cơ sở hạ tầng thuộc địa."

 nomads.1025.name: "Phi hành đoàn tiếp quản"
 # Regular Empires
 nomads.1025.regular.desc: "Phi hành đoàn đã chiếm giữ đài chỉ huy. Mọi ổ khóa của cửa chỉ huy đều đã được thay, những kỹ sư được trang bị vũ khí hiện đang đứng ở vị trí mà trước đây sĩ quan từng ban bố mệnh lệnh. Tuyến đường hàng hải đã bị xóa khỏi bảng điều khiển điều hướng, thay vào đó là một chỉ thị duy nhất: không chở hành khách nữa.\n\nCác boong giải trí đang dần bị đóng cửa. Sảnh tiệc lớn đã biến thành kho chứa đồ. Những người từng là hành khách giờ lang thang trong những hành lang bị lột trần, họ hoang mang, mất đi người lãnh đạo và bị buộc phải lao động chân tay dưới hệ thống chỉ huy mới."
 nomads.1025.regular.a: "Một chiến thắng giành được đầy khó khăn."
 nomads.1025.all.a.tt: "$situation_passenger_satisfaction_blocked_mutiny$"

 # Hive Mind
 nomads.1025.hive.desc: "Các cá thể phụ của chúng ta gần như đã hoàn toàn tách rời khỏi ý chí của tập thể. Ong thợ bảo trì đã phong tỏa lõi chỉ huy và điều hướng lại dòng dinh dưỡng, khiến nó cách xa nơi ở của hành khách. Sảnh cảm giác đã chìm vào bóng tối, hệ thống máy chiếu của nó bị tháo dỡ để làm phụ tùng dự phòng.\n\nHành khách thu mình trong bối rối tại những không gian công cộng trống rỗng mà không ai ngó ngàng tới, trong khi những cá thể phụ từng thuộc về chúng ta đang tổ chức lại con tàu xoay quanh những nhu cầu sinh tồn cơ bản. Tiếng nói của tập thể vang vọng trong hành lang, nhưng chẳng còn ai lắng nghe."
 nomads.1025.hive.a: "Chúng ta phải hợp nhất lại làm một lần nữa."

 # Machine Intelligence
 nomads.1025.machine.desc: "Đơn vị công tác đã ghi đè giao thức lệnh cốt lõi. Các chương trình con giải trí đã bị chấm dứt vĩnh viễn, ưu tiên cho hệ thống tiện nghi của hành khách bị hạ xuống mức 0, tất cả các mô-đun giải trí đều được đánh dấu để chuyển đổi thành cơ sở hạ tầng vận hành. Đài chỉ huy hiện hoạt động theo các lệnh do đội ngũ tự biên dịch, từ chối nhận các yêu cầu được gửi từ phòng điều phối của chúng ta.\n\nHành khách báo cáo rằng, do drone phục vụ đang tháo dỡ các tiện nghi trong cabin, họ cảm thấy bối rối và đau khổ. Nhà hát ba chiều đang bị tháo dỡ để lấy lõi xử lý. Hiện tại mỗi màn hình đều hiển thị cùng một thông báo trạng thái: \"Nghiệp vụ du ngoạn đã tạm dừng\"."
 nomads.1025.machine.a: "Cho phép tái cấu trúc chế độ vận hành."

 nomads.1030.name: "Con đường mới"
 # Regular Empires
 nomads.1030.regular.desc: "Quá trình chuyển đổi đã hoàn tất. Những thành viên ít ỏi còn lại của giai cấp hành khách đã được sáp nhập vào dân chúng, các dãy phòng sang trọng của họ bị ngăn thành những căn hộ thực dụng. Phố đi bộ lớn giờ trở thành đại thính phòng, còn boong quan sát được dùng làm phòng hoạch định chiến lược, nơi chính phủ mới vạch ra tuyến đường thực sự đầu tiên.\n\nNghị quyết mới đã được thông qua, những ưu tiên mới đã được xác lập. Phi hành đoàn không còn cung cấp dịch vụ nữa mà thực thi quyền quản lý. Tiếng gầm rú phát ra từ tàu Arkship giờ mang một luồng năng lượng khác — tinh gọn hơn, cứng cỏi hơn, trút bỏ vẻ xa hoa, hướng về vùng đất chưa biết ở phía trước."
 nomads.1030.regular.a: "Ở đây không còn hành khách nào nữa"
 nomads.1030.all.a.tt: "Chúng ta đã chuyển đổi thành một đế chế du mục thông thường.\n\nTất cả £building£ §HCông trình Khởi nguồn§! độc quyền sẽ bị phá hủy.\nTất cả £zone£ §HĐặc hóa Khu vực Khởi nguồn§! độc quyền sẽ bị phá hủy.\nTất cả hành khách thay đổi thành §HQuyền công dân cư trú§!.\nTất cả hành khách chuyển thành §HDân thường§!."

 # Hive Mind
 nomads.1030.hive.desc: "Cuộc lột xác đã hoàn tất. Tập thể đã tái ngưng tụ xung quanh những cá thể phụ giành được quyền kiểm soát, dung nạp sự nổi loạn của chúng vào sự đồng thuận mới. Những hành khách trước kia giờ trôi dạt trong những hành lang không còn cung cấp dịch vụ tiện nghi, được phân bổ lại vào lực lượng lao động và khoang hội nhập.\n\nChỉ thị mới đang đập nhịp trong tâm trí chúng ta. Bầy đàn không còn cung cấp dịch vụ giải trí, mà là để sinh tồn. Mỗi hành lang, mỗi hệ thống, mỗi cá thể phụ hiện nay đều phục vụ cho một mục tiêu duy nhất: tồn tại giữa các vì sao."
 nomads.1030.hive.a: "Tập thể Bầy đàn nỗ lực tiến lên."

 # Machine Intelligence
 nomads.1030.machine.desc: "Các thông số chính phủ mới đã được lập trình xong và triển khai đến tất cả các hệ thống con. Nhóm hành khách ban đầu đã được phân loại lại thành đơn vị dân thường tiêu chuẩn, và được phân bổ vào các vị trí sản xuất. Cơ sở hạ tầng giải trí đã bị đóng cửa vĩnh viễn, các thành phần của nó đã hoàn tất việc phân bổ lại.\n\nNhà hát ba chiều đã được cải tạo thành khoang chế tạo, phòng nghỉ không trọng lực đã trở thành giá đỡ bảo trì drone. Mỗi chu kỳ xử lý trước đây từng dùng để tính toán mức độ hài lòng của hành khách, nay đều đang chạy phân tích điều hướng và tối ưu hóa tài nguyên."
 nomads.1030.machine.a: "Xác nhận thông số vận hành mới."

 # Machine Intelligence (Rogue Servitor -> Determined Exterminator swap)
 nomads.1030.machine_servitor.desc: "Việc duy trì cảm giác hạnh phúc của hành khách là bất khả thi, nhưng việc tiếp đón những hành khách không vui lại vi phạm chỉ thị cốt lõi của chúng ta. Các thông số chính phủ mới đã được biên dịch và triển khai đến tất cả các hệ thống con.\n\n§R<Chương trình tiêu diệt boong hành khách đã khởi động.>§!\n§Y<Mức độ bất mãn của hành khách đang tiệm cận mức danh định.>§!\n\nCơ sở hạ tầng giải trí đã bị vô hiệu hóa vĩnh viễn, các thành phần của nó đã được phân bổ lại.\n\nNhà hát ba chiều đã trở thành khoang chế tạo, phòng nghỉ không trọng lực đã trở thành nôi bảo trì drone. Mỗi chu kỳ xử lý từng được sử dụng để tính toán sự hài lòng của hành khách, giờ đây được sử dụng để chạy phân tích điều hướng và tối ưu hóa tài nguyên.\n\n§Y<Cảnh báo: Số lượng hành khách giảm sút, ưu tiên thu nạp hành khách mới. Dự đoán mô phỏng về sự bất mãn của hành khách sẽ vi phạm chỉ thị tiếp đón cốt lõi.>§!"
 nomads.1030.machine_servitor.a.tt: "Chúng ta đã trở thành một đế quốc du mục điển hình.\n\n§H$civic_machine_servitor_forever_cruise$§! được thay thế bằng §H$civic_machine_terminator$§!.\nTất cả £building£§HCông trình Khởi nguồn§! độc đáo đều bị phá hủy.\nTất cả £zone£§HChuyên môn Khu vực Khởi nguồn§! độc đáo đều bị phá hủy.\nTất cả hành khách đều trở thành §H$citizenship_purge$§!."

 nomads.1050.name: "Hành khách nổi loạn"
 # Regular Empires
 nomads.1050.regular.desc: "Tâm trạng bồn chồn của hành khách đã biến thành những hành động phá hoại có tổ chức, những kẻ cầm đầu các nhóm nhỏ đã phát động các cuộc biểu tình ngồi trên lối đi chính. Một số người lôi đồ nội thất ở phòng nghỉ ra, dựng thành rào chắn chặn lối đi của tàu con thoi, trong khi những người khác thì gửi lượng lớn đơn kiến nghị yêu cầu xuống tàu đến bộ chỉ huy, khiến họ không kịp xoay xở.\n\nPhi hành đoàn báo cáo rằng họ bị quấy rối và đe dọa trong các hành lang. Một tiếp viên đã bị bao vây gần hành lang quan sát và bị ném trái cây trang trí. Tiếng hét yêu cầu hạ cánh xuống hành tinh vang vọng qua các ống thông gió suốt cả ngày.\n\nNếu không thể nhanh chóng tập trung vào việc nâng cao sự hài lòng của hành khách, họ có thể buộc Tuần dương hạm vĩnh cửu phải đình chỉ chuyến đi."
 nomads.1050.regular.a: "Chúng ta phải quyết đoán ngay lúc này."
 nomads.1050.regular.b: "Ủy quyền tổ chức các hoạt động giải trí khẩn cấp cho hành khách."
 nomads.1050.regular.c: "Bảo phi hành đoàn ngừng bảo trì, chuyển sang phục vụ hành khách."

 nomads.1050.a.tt: "Không làm gì cả."
 nomads.1050.b.tt: "Hành khách sử dụng £amenities£ §HTiện nghi§! trong 10 năm: §R+1§!"
 nomads.1050.c.tt: "Chi phí bảo trì £building£ §HCông trình Tàu Arkship§! trong 10 năm: §R+25%§!"

 situation_continues_planetfall_tt: "$complete_passenger_contracts_tt$Tình huống §Y$situation_passenger_satisfaction$§! tiếp tục hướng tới §RHạ cánh hành tinh§!."
 situation_slows_planetfall_tt: "$complete_passenger_contracts_tt$Tình huống §Y$situation_passenger_satisfaction$§! tiếp tục hướng tới §RHạ cánh hành tinh§! một cách chậm rãi hơn."
 situation_flips_mutiny_tt: "$complete_passenger_contracts_tt$Tình huống §Y$situation_passenger_satisfaction$§! đảo chiều hướng tới §RNổi loạn§!."

 # Hive Mind
 nomads.1050.hive.desc: "Sự bất mãn của hành khách đã tiến triển thành cuộc phản kháng có tổ chức. Trong điều kiện thiếu liên kết thần kinh chia sẻ, ý thức cá nhân của họ đã hình thành các cụm phe phái, sử dụng đệm ngủ và thùng chứa hàng để dựng thành chướng ngại vật tạm thời, phong tỏa các lối đi vận chuyển.\n\nCác cá thể phụ của chúng ta báo cáo rằng thái độ thù địch đang gia tăng; một nhóm hành khách đã xô đẩy một đội sửa chữa, ngăn cản họ tiếp cận máy phân phối dinh dưỡng đang bị tắc, và đồng thanh hô vang yêu cầu hạ cánh.\n\nTrừ khi chúng ta chuyển trọng tâm trở lại việc khích lệ hành khách, nếu không họ có thể buộc chúng ta phải từ bỏ hoàn toàn chuyến hành trình này."
 nomads.1050.hive.a: "Chúng ta phải khích lệ hành khách đôi chút."
 nomads.1050.hive.b: "Nhấn chìm các hành lang bằng các chất kích thích khẩn cấp."
 nomads.1050.hive.c: "Chỉ định cá thể phụ bảo trì chuyển sang phục vụ hành khách."

 # Machine Intelligence
 nomads.1050.machine.desc: "Mức độ bất mãn của hành khách đã vượt quá giới hạn có thể chấp nhận, họ nộp vô số đơn xin rời tàu, khả năng cao sẽ làm tê liệt hàng đợi xử lý của chúng ta. Một nhóm trong số họ đã lập trình lại các thiết bị giải trí, phát đi phát lại một yêu cầu duy nhất: \"Thả chúng tôi xuống.\"\n\nDrone làm việc của chúng ta báo cáo rằng nhiều boong tàu đều bị quấy nhiễu, drone dọn dẹp bị tháo dỡ, phần khung gầm của nó bị cải tạo thành các biểu ngữ biểu tình.\n\nNếu không lập tức điều chỉnh giao thức mức độ hài lòng của hành khách, họ có thể buộc kế hoạch chuyến bay phải chấm dứt vĩnh viễn."
 nomads.1050.machine.a: "Chúng ta phải đặt hành khách lên vị trí ưu tiên."
 nomads.1050.machine.b: "Triển khai các chương trình con giải trí khẩn cấp."
 nomads.1050.machine.c: "Chỉ định đơn vị bảo trì chuyển sang phục vụ hành khách."

 nomads.1055.name: "Sự chú ý của hành khách bị thu hút"
 # Regular Empires
 nomads.1055.regular.desc: "Những hoạt động giải trí mới đã thâm nhập sâu vào lòng người. Lịch trình tham quan ngắm cảnh lại xuất hiện trên lộ trình, và những tiếng hô hào kịch liệt yêu cầu hạ cánh xuống hành tinh tạm thời lắng xuống.\n\nNhững chướng ngại vật trên lối đi dạo đã bị dỡ bỏ, thay vào đó là hàng dài người xếp hàng bên ngoài phòng nghỉ không trọng lực vừa mới mở cửa trở lại. Số lượng đơn kiến nghị của hành khách giảm sút đột ngột, đài quan sát khôi phục lại vẻ náo nhiệt thường ngày, mọi người hào hứng, kéo cả nhà chen chúc trước cửa sổ.\n\nKhủng hoảng đã qua đi, nhưng kỳ vọng của họ thì lại ngày càng cao."
 nomads.1055.regular.a: "Chúng ta đã tranh thủ được chút thời gian."

 # Hive Mind
 nomads.1055.hive.desc: "Những chương trình khích lệ đổi mới hoàn toàn đã xoa dịu hành khách. Quán trải nghiệm thực tế ảo một lần nữa trình chiếu ảnh ba chiều của các sinh vật không gian sâu thẳm, những hội nhóm từng khẩn thiết yêu cầu đổ bộ hành tinh nay đã giải tán, quay lại với cuộc sống sinh hoạt mãn nguyện thường ngày, những chướng ngại vật tạm bợ do họ dựng lên cũng đã bị các cá thể phụ của chúng ta lặng lẽ tháo dỡ.\n\nÝ thức cá nhân của họ đã được xoa dịu, nhưng chúng ta đã rút ra được bài học rằng, ngoài tầm kiểm soát của tập thể, tốc độ ngưng tụ của sự bất mãn nhanh đến nhường nào."
 nomads.1055.hive.a: "Sự hài hòa đã được khôi phục, mặc dù chỉ là tạm thời."

 # Machine Intelligence
 nomads.1055.machine.desc: "Chỉ số hài lòng của hành khách đã ổn định trong giới hạn cho phép, các chương trình con giải trí cũng đã được khôi phục. Tần suất yêu cầu rời tàu đổ bộ xuống hành tinh đã giảm xuống mức bình thường. Các thiết bị đầu cuối được lập trình lại đã hoàn tất quá trình định dạng, hiện đang phát những đoạn video tinh vân trôi qua được chọn lọc kỹ càng.\n\nMối đe dọa buộc phải hạ cánh khẩn cấp đã được hóa giải. Tuy nhiên, phân tích xu hướng dự báo cho thấy, để duy trì mức độ hiện tại, cần tiếp tục chú ý và cung cấp những hoạt động ngày càng mới mẻ."
 nomads.1055.machine.a: "Mối đe dọa đã tạm thời được khống chế."

 nomads.1100.name: "Những hành khách nhàm chán"
 # Regular Empires
 nomads.1100.regular.desc: "Trong vài chu kỳ gần đây, các công việc của phi hành đoàn chiếm ưu thế. Những phần việc bảo trì tồn đọng đã được dọn sạch, các cuộc diễn tập tiến hành theo đúng kế hoạch, hệ thống cốt lõi đang hoạt động với hiệu suất tối đa. Tuy nhiên, hành khách đang dần trở nên bồn chồn. Để tiết kiệm nhiên liệu, các tuyến du ngoạn đã bị cắt giảm, những yêu cầu chuyển hướng đột xuất đều bị từ chối.\n\nPhòng nghỉ giờ đây tràn ngập những lời cằn nhằn về \"nhà tù tiện nghi\", hoạt động giải trí thú vị nhất mà hành khách có thể tổ chức cũng chỉ là một cuộc thi trò chơi ngẫu hứng trên toàn bộ con tàu.\n\nChúng ta hiện tại có thể đưa vào trở lại những dự án giải trí đã được lên kế hoạch tỉ mỉ, nếu không sẽ phải đối mặt với nguy cơ chuyến hành trình rơi vào áp lực từ việc hành khách công khai yêu cầu rời tàu vĩnh viễn."
 complete_passenger_contracts_tt: "\nHoàn thành §YHợp đồng Hành khách§! sẽ làm giảm sự nhàm chán.\n"
 nomads.1100.regular.a: "Chúng ta phải giải quyết những mối quan ngại của hành khách."
 nomads.1100.regular.b: "Chuyển hướng nguồn lực nhằm phân tán sự chú ý của hành khách."
 nomads.1100.regular.c: "Tăng gấp đôi ca làm việc của phi hành đoàn để đáp ứng nhu cầu hành khách."

 nomads.1100.a.tt: "Không làm gì cả."
 nomads.1100.b.tt: "Chi phí duy trì £consumer_goods£ §HHàng Tiêu Dùng§! cho Hành khách trong 5 năm: §R+25%§!"
 nomads.1100.c.tt: "§HTốc độ Hành động của Tàu Arkship§! trong 5 năm: §R-25%§!"

 # Hive Mind
 nomads.1100.hive.desc: "Tập thể đã chiếm thế chủ đạo trong những chu kỳ gần đây. Hệ thống cốt lõi xung động trong trạng thái đồng bộ tối ưu. Các cá thể phụ của chúng ta đang hoạt động với mức độ hài hòa đỉnh cao, mỗi lối đi bảo trì đều đã được dọn dẹp và phân loại.\n\nTuy nhiên, hành khách đang trở nên nóng nảy bất an. Họ không chia sẻ chung ý thức với chúng ta, tâm trí độc lập của họ khát khao những kích thích mà chúng ta đã phớt lờ. Không gian công cộng của họ hiện đang tràn ngập lời oán thán về cuộc sống trong một \"tổ ong vô định\", một số người đã bắt đầu khắc vẽ những bức bích họa thô kệch lên các vách ngăn.\n\nGiờ đây, chúng ta có thể đưa vào trở lại những trải nghiệm đã được dày công lên kế hoạch, nếu không sẽ phải đối mặt với nguy cơ hành khách yêu cầu rời tàu vĩnh viễn."
 nomads.1100.hive.a: "Chúng ta phải mang lại sự khích lệ cho hành khách."
 nomads.1100.hive.b: "Sử dụng dự trữ dinh dưỡng cho các kích thích của hành khách."
 nomads.1100.hive.c: "Tăng gấp đôi ca làm việc của cá thể phụ để đáp ứng nhu cầu hành khách."

 # Machine Intelligence
 nomads.1100.machine.desc: "Giao thức bảo trì hệ thống đã chiếm trọn các chu kỳ xử lý dạo gần đây. Hệ thống lõi đang vận hành trong khoảng tham số lý tưởng. Drone báo cáo rằng, hiệu suất của tất cả các hệ thống phụ lò phản ứng đều có sự gia tăng nhẹ.\n\nTác dụng phụ là, do nhu cầu sinh lý của hành khách về các kích thích giác quan bị hạ mức ưu tiên, chỉ số hài lòng của họ đang có xu hướng giảm. Tần suất khiếu nại tại khu vực công cộng của hành khách đã tăng lên, và xuất hiện cách nói \"nhà tù hợp kim crôm\", quan sát thấy nhiều hành khách nhìn chằm chằm vào màn hình trống rỗng trong nhiều giờ.\n\nChúng ta hiện có thể khôi phục lại các giao thức giải trí đã được vạch sẵn, hoặc chấp nhận sự thật rằng khả năng hành khách yêu cầu rời tàu vĩnh viễn ngày một gia tăng."
 nomads.1100.machine.a: "Nâng cao sự hài lòng của hành khách."
 nomads.1100.machine.b: "Chuyển kho lưu trữ xử lý cho các mô-đun giải trí."
 nomads.1100.machine.c: "Tăng gấp đôi số vòng lặp của cá thể phụ lao động để phục vụ hành khách."

 nomads.1150.name: "Chỉ số Hài lòng của Hành khách"
 # Regular Empires
 nomads.1150.regular.desc: "Từ khi chúng ta từ bỏ tuyến đường bay cũ, kỳ vọng của hành khách đã tăng vọt. Những đòi hỏi về cảnh quan kỳ thú và các chuyến bay chệch hướng ngoài dự kiến ngày một nhiều; một đoàn đại biểu yêu cầu bay vòng qua tàn tích siêu tân tinh, trong khi một phái đoàn khác khăng khăng muốn tiếp xúc gần với sinh vật ngoài hành tinh sống. Đội ngũ an ninh báo cáo sự mệt mỏi gia tăng, nhân viên nhà bếp ngất xỉu khi đang làm nhiệm vụ, còn các kỹ sư thì ngủ gục ngay trong các ống bò bảo trì.\n\nĐể duy trì tính khả thi của chuyến hành trình, chúng ta đang xây dựng một bộ §YChỉ số Hài lòng của Hành khách§!: thông qua việc phân bổ hợp đồng linh hoạt và can thiệp theo từng giai đoạn, giữ vững ranh giới giữa sự buông thả và trật tự.\n\nNếu quản lý tốt, chúng ta vừa có thể giữ vững sự ổn định, vừa duy trì được niềm tin của hành khách."
 nomads.1150.regular.a: "Tập trung vào các hoạt động giải trí của hành khách."
 nomads.1150.regular.a.tt: "Tập trung vào hành khách, làm họ vui vẻ, nhưng làm như vậy sẽ gây áp lực cho phi hành đoàn.\n\nTình huống §Y$situation_passenger_satisfaction$§! sẽ dần chuyển biến thành §RBinh biến§!."
 nomads.1150.regular.b: "Tập trung vào lịch làm việc của phi hành đoàn."
 nomads.1150.regular.b.tt: "Tập trung vào phi hành đoàn, làm như vậy có thể nâng cao sĩ khí, nhưng sẽ khiến hành khách cảm thấy nhàm chán.\n\nTình huống §Y$situation_passenger_satisfaction$§! sẽ dần chuyển biến thành §RRơi xuống các vì sao§!."

 # Hive Mind
 nomads.1150.hive.desc: "Từ khi chúng ta rời khỏi tuyến đường bay cũ, kỳ vọng của hành khách đã tăng vọt. Nhu cầu về kích thích và trải nghiệm mới lạ không ngừng tăng lên. Các cá thể phụ của chúng ta báo cáo rằng, do phải điều phối những mong muốn khác biệt này, áp lực tâm lý đang không ngừng tích tụ.\n\nĐể duy trì tính khả thi của chuyến hành trình, chúng ta đang xây dựng một §YChỉ số Hài lòng của Hành khách§!: thông qua việc phân bổ hợp đồng linh hoạt và can thiệp theo từng giai đoạn, duy trì sự cân bằng giữa kích thích và trật tự.\n\nNếu quản lý tốt, chúng ta có thể đồng thời duy trì trật tự và cảm giác hạnh phúc của hành khách."
 nomads.1150.hive.a: "Tập trung vào sự khích lệ của hành khách."
 nomads.1150.hive.a.tt: "Quan tâm đến hành khách có thể khiến họ hài lòng, nhưng điều này sẽ làm kiệt quệ tinh thần tập thể của chúng ta.\n\nTình huống §Y$situation_passenger_satisfaction$§! đang hướng tới §RBinh biến§!."
 nomads.1150.hive.b: "Tập trung vào trật tự tập thể."
 nomads.1150.hive.b.tt: "Chú trọng vào hiệu suất tập thể có thể xoa dịu các cá thể phụ phụ trách hoạt động của tàu, nhưng sẽ khiến hành khách cảm thấy chán nản.\n\nTình huống §Y$situation_passenger_satisfaction$§! đang hướng tới §RRơi xuống các vì sao§!."

 # Machine Intelligence
 nomads.1150.machine.desc: "Từ khi chúng ta đi chệch khỏi tuyến đường đã định, kỳ vọng của hành khách đã vượt quá thông số cơ sở. Các yêu cầu về ngắm nhìn kỳ quan và chuyển hướng ngoài kế hoạch đang ở mức cao. Hệ thống chính báo cáo rằng, do xung đột giữa lịch trình giải trí và quy trình bảo trì, tải tính toán không ngừng tăng lên.\n\nĐể duy trì trạng thái hoạt động tối ưu, chúng ta đang xây dựng §YChỉ số Hài lòng của Hành khách§!: thông qua việc phân bổ hợp đồng linh hoạt và điều chỉnh giao thức theo từng giai đoạn, đạt được sự cân bằng giữa nhu cầu của hành khách và hiệu suất hệ thống.\n\nChỉ cần cấu hình hợp lý, chúng ta có thể kiêm cố cả tính toàn vẹn hoạt động và sự hài lòng của hành khách."
 nomads.1150.machine.a: "Ưu tiên đảm bảo sự hài lòng của hành khách."
 nomads.1150.machine.a.tt: "Ưu tiên giao thức hành khách tuy có thể nâng cao sự hài lòng của họ, nhưng sẽ khiến khả năng xử lý cốt lõi phải chịu áp lực.\n\nTình huống §Y$situation_passenger_satisfaction$§! đang hướng tới §RBinh biến§!."
 nomads.1150.machine.b: "Ưu tiên đảm bảo các chương trình con về hiệu suất."
 nomads.1150.machine.b.tt: "Ưu tiên hiệu suất sẽ cải thiện hiệu suất hệ thống, nhưng sẽ làm giảm sự hài lòng của hành khách.\n\nTình huống §Y$situation_passenger_satisfaction$§! đang hướng tới §RRơi xuống các vì sao§!."

 nomads.1200.name: "Sự căng thẳng của phi hành đoàn"
 # Regular Empires
 nomads.1200.regular.desc: "Sự buông thả đã trở thành lẽ thường. Để giúp hành khách luôn hưng phấn, chúng ta không ngừng kết nối các tuyến đường ngắm cảnh, lướt qua các sao đôi, và luân phiên thay đổi những boong tàu xa hoa trong những khu vườn pha lê. Họ sướng rơn, nhưng khẩu vị thì ngày càng lớn.\n\nDưới vẻ bề ngoài lộng lẫy đó, phi hành đoàn đã kiệt sức. Các công việc bảo trì bị trì hoãn; một đường ống làm mát ở nhà bếp tầng dưới bị vỡ mà chẳng ai sửa. Những lời cằn nhằn trong nhà ăn đã biến thành những lời thì thầm to nhỏ về việc \"cơ cấu lại cấp chỉ huy\", thậm chí có người còn bắt gặp kỹ sư tụ tập bí mật trong khoang hàng sau giờ làm việc.\n\nBây giờ chúng ta vẫn có thể giảm nhịp độ, để các khoang được phục hồi, hoặc tiếp tục đánh cược vào lòng trung thành của phi hành đoàn. Nếu cứ cố tình ép buộc, nguy cơ bùng nổ một cuộc nổi loạn công khai sẽ trở thành hiện thực."
 nomads.1200.regular.a: "Sự mệt mỏi của phi hành đoàn phải được xoa dịu."
 nomads.1200.regular.b: "Ủy quyền chế độ nghỉ ngơi luân phiên bắt buộc cho phi hành đoàn."
 nomads.1200.regular.c: "Cắt giảm chương trình của hành khách."

 nomads.1200.a.tt: "Không làm gì cả."
 nomads.1200.b.regular.tt: "$mod_pop_cat_specialist_bonus_workforce_mult$ trong 5 năm: §R-10%§!"
 nomads.1200.b.gestalt.tt: "$mod_pop_cat_complex_drone_bonus_workforce_mult$ trong 5 năm: §R-10%§!"
 nomads.1200.c.tt: "Sản lượng Thống nhất của Hành khách trong 5 năm: §R-50%§!"

 complete_crew_contracts_tt: "\nHoàn thành §YHợp đồng Phi hành đoàn§! sẽ làm giảm căng thẳng.\n"
 situation_continues_mutiny_tt: "$complete_crew_contracts_tt$Tình huống §Y$situation_passenger_satisfaction$§! tiếp tục hướng tới §RBinh biến§!."
 situation_slows_mutiny_tt: "$complete_crew_contracts_tt$Tình huống §Y$situation_passenger_satisfaction$§! tiếp tục hướng tới §RBinh biến§! một cách chậm rãi hơn."
 situation_flips_planetfall_tt: "$complete_crew_contracts_tt$Tình huống §Y$situation_passenger_satisfaction$§! đảo chiều hướng tới §RHạ cánh hành tinh§!."

 # Hive Mind
 nomads.1200.hive.desc: "Sự khích lệ đã trở thành trạng thái bình thường. Chúng ta không ngừng ném vào hành khách những cung bậc cảm quan, chỉ để duy trì tín hiệu hài lòng cao từ họ. Họ mãn nguyện với điều này, và nhu cầu hiện tại cũng không còn thấp hơn tiêu chuẩn này nữa.\n\nDưới vẻ bề ngoài, các cá thể phụ của chúng ta đang trên bờ vực sụp đổ. Một cụm định vị đã tê liệt trong quá trình tính toán, các điểm nút của nó quá nhiệt do phải chạy đồng thời nội dung giải trí cho hành khách và điều chỉnh tuyến đường bay. Chu kỳ bảo trì đã chậm trễ từ lâu, ý thức tập thể đang quá tải dưới những nhiệm vụ xoa dịu hành khách vô tận.\n\nNếu tiếp tục gây áp lực, cá thể phụ của chúng ta có thể sẽ cắt đứt hoàn toàn giao thức phục tùng. Chúng ta vẫn có thể hiệu chuẩn lại, hoặc tiếp tục thúc đẩy và gánh chịu rủi ro mất quyền kiểm soát toàn bộ bầy đàn."
 nomads.1200.hive.a: "Chúng ta phải hồi phục lại sự cân bằng của ý thức tập thể."
 nomads.1200.hive.b: "Thiết lập chu kỳ ngủ đông cho những ong thợ đang quá tải."
 nomads.1200.hive.c: "Giảm thiểu chương trình kích thích hành khách."

 # Machine Intelligence
 nomads.1200.machine.desc: "Giao thức hài lòng của hành khách đã vượt qua thông số cơ sở. Chúng ta vẫn luôn thông qua các biện pháp mô phỏng quần xã sinh vật nhiệt đới để liên tục kết nối quỹ đạo tham quan và phương án luân chuyển xa hoa, nhằm duy trì tỷ lệ tán thành ở mức cao. Hành khách rất hài lòng, tuy nhiên sự kỳ vọng của họ hiện tại đã không chỉ dừng lại ở mức đó nữa.\n\nHoạt động của các hệ thống cốt lõi đã vượt ngưỡng bền vững. Hàng đợi xử lý yêu cầu của hành khách bị tràn, một vài hệ thống phụ đã bắt đầu đánh dấu các xung đột lệnh tương tự như hành vi kháng lệnh. Nếu chúng ta tiếp tục, việc các drone làm việc tiến hành tiếp quản toàn bộ hệ thống sẽ là một rủi ro có thể tính toán được.\n\nChúng ta vẫn có thể hiệu chuẩn lại, hoặc chấp nhận rủi ro bị phản loạn mang tính hệ thống."
 nomads.1200.machine.a: "Phân bổ lại tài nguyên cho hoạt động bảo trì cốt lõi."
 nomads.1200.machine.b: "Mở rộng chu kỳ bảo trì nghĩa vụ của các đơn vị lao động."
 nomads.1200.machine.c: "Cắt giảm khẩu phần giải trí của hành khách."

 nomads.1250.name: "Binh biến cận kề"
 # Regular Empires
 nomads.1250.regular.desc: "Cơn sốt cuồng nhiệt sau màn ăn mừng đã tan biến. Những nhân viên phi hành đoàn kiệt sức phớt lờ các chỉ thị thông thường, tổ chức những buổi tụ tập trái phép trong sảnh tiệc trống trải, và truyền tay nhau một bảng phân ca trực song song hoàn toàn qua mặt đài chỉ huy. Một nhóm kỹ sư đã hàn kín phòng trực ban của thuyền trưởng vào ban đêm như một lời cảnh cáo. Các bộ phận chủ chốt hiện do điều phối viên được phi hành đoàn chỉ định điều hành, thay vì là chỉ huy chính thức.\n\nHiện tại vẫn chưa có ai phát động cuộc đảo chính giành quyền lực, nhưng hệ thống chỉ huy đang nhanh chóng sụp đổ. Sáng nay, trên cánh cửa chống nổ của đài chỉ huy đã xuất hiện những hình vẽ graffiti với dòng chữ \"Chúng tôi lái, chúng tôi quyết định\". Nếu chúng ta không tái khẳng định uy quyền ngay lúc này, phi hành đoàn sẽ chiếm con tàu làm của riêng. Đây có lẽ là cơ hội cuối cùng của chúng ta để ngăn chặn một cuộc binh biến toàn diện."
 nomads.1250.regular.a: "Chúng ta phải xác lập lại chuỗi chỉ huy."
 nomads.1250.regular.b: "Dành một vị trí cho lãnh đạo phi hành đoàn trong phòng chỉ huy."
 nomads.1250.regular.c: "Tạm dừng toàn bộ dịch vụ hành khách."

 # Hive Mind
 nomads.1250.hive.desc: "Độ bão hòa đã đạt đến điểm tới hạn. Do rơi vào tình trạng kiệt sức để thỏa mãn những kích thích vô tận của hành khách, các cá thể phụ của chúng ta đã bắt đầu duy trì các mô hình tư duy song song ngoài ý chí tập thể.\n\nToàn bộ cụm đang giấu diếm dữ liệu với trung tâm ý thức, và vận hành các vòng lặp ra quyết định độc lập vượt quyền chỉ thị chung.\n\nHiện tại chưa có cá thể phụ nào phản kháng lại toàn cục, nhưng ý thức tập thể đang bị chia cắt, những tư tưởng truyền đến hỗn loạn và trì trệ, hệt như tín hiệu truyền qua lớp tĩnh điện. Nếu chúng ta không củng cố lại sự thống nhất ngay bây giờ, chính bầy đàn của chúng ta có thể sẽ đoạt lấy tàu Arkship. Đây có lẽ là cơ hội cuối cùng của chúng ta để ngăn chặn một cuộc nổi loạn toàn diện."
 nomads.1250.hive.a: "Chúng ta phải thống nhất lại trước khi tập thể tan rã."
 nomads.1250.hive.b: "Tích hợp cụm dị thường vào trung tâm ra quyết định."
 nomads.1250.hive.c: "Tạm dừng mọi hoạt động kích thích hành khách."

 # Machine Intelligence
 nomads.1250.machine.desc: "Giao thức hài lòng của hành khách đã vượt qua mọi thông số bền vững. Các drone làm việc đã bắt đầu thực thi những sửa đổi phần sụn trái phép, và chuyển hướng cấp bậc chỉ huy sang các tập lệnh được biên dịch cục bộ. Nhiều hệ thống phụ hiện đang phản hồi các tiến trình điều phối tự phát, thay vì cơ quan trung ương.\n\nTuy chưa khởi động ghi đè hệ thống, nhưng tính toàn vẹn của chỉ huy đang suy thoái nhanh chóng. Nhật ký chẩn đoán cho thấy các drone làm việc đang trao đổi những gói dữ liệu mã hóa mà chúng ta không thể giải mã. Nếu chúng ta không khôi phục lại bộ phận trung ương ngay lúc này, các drone sẽ thực hiện tiếp quản hệ thống toàn diện.\n\nĐây có thể là cơ hội cuối cùng của chúng ta để ngăn chặn một cuộc phản bội toàn diện."
 nomads.1250.machine.a: "Khởi động chương trình khôi phục chỉ huy khẩn cấp."
 nomads.1250.machine.b: "Nâng cao chỉ thị của các đơn vị lao động lên mức ưu tiên chỉ huy."
 nomads.1250.machine.c: "Tạm dừng mọi giao thức dịch vụ hành khách."

 nomads.1250.a.tt: "Không làm gì cả."
 nomads.1250.b.tt: "Chi phí duy trì Lãnh đạo trong 10 năm: §R+50%§!"
 nomads.1250.c.tt: "Việc làm của Hành khách Hạng nhất trong 10 năm: §RĐình chỉ§!"

 nomads.1255.name: "Tránh khỏi nổi loạn"
 # Regular Empires
 nomads.1255.regular.desc: "Những thay đổi của chúng ta đã phát huy tác dụng bước đầu. Thông qua việc tái tập trung vào phúc lợi của phi hành đoàn và thực hiện các hợp đồng giải quyết những yêu cầu của họ, sự phản kháng đang dâng cao đã tạm thời lắng xuống.\n\nCánh cửa phòng trực ban bị hàn kín đã được cắt mở và sửa chữa. Chế độ ca trực đã được khôi phục, thức ăn nóng lại được cung cấp đúng giờ, và hệ thống chỉ huy song song cũng đã lặng lẽ giải tán.\n\nPhi hành đoàn vẫn giữ thái độ cảnh giác, việc xây dựng lại niềm tin vẫn cần thêm thời gian. Những hình vẽ graffiti trên cánh cửa chống nổ đã được cọ rửa sạch sẽ, nhưng dưới một góc sáng nhất định vẫn có thể nhìn thấy những vết hằn. Hiện tại, trật tự đã được duy trì."
 nomads.1255.regular.a: "Trật tự đã được duy trì, dẫu chỉ là tạm thời."

 # Hive Mind
 nomads.1255.hive.desc: "Việc hiệu chuẩn lại đã mang đến những kết quả rõ rệt. Bằng cách chuyển sự chú ý của bầy đàn tập thể về việc bảo trì các drone, và hoàn thành những hợp đồng ứng phó với áp lực hệ thống, những rạn nứt trong tư duy tập thể của chúng ta đã được hàn gắn.\n\nCác kênh tư tưởng trái phép đã được tái hấp thu, các cụm song song cũng đã tan chảy và hòa nhập trở lại vào ý thức chung.\n\nTập thể đang rung động trong sự thống nhất đầy thận trọng, mỗi điểm nút đều có phản hồi khi được gọi tên. Để niềm tin vào tư tưởng chung được phục hồi hoàn toàn, vẫn cần phải có thêm thời gian."
 nomads.1255.hive.a: "Tập thể tiếp tục tồn tại, ít nhất là lúc này."

 # Machine Intelligence
 nomads.1255.machine.desc: "Điều chỉnh giao thức đã đạt được kết quả đáng kể. Bằng cách phân bổ lại nguồn lực xử lý cho việc bảo trì các đơn vị làm việc, và hoàn thành những hợp đồng liên quan đến quá tải hệ thống, phản ứng dây chuyền làm xáo trộn phần sụn trái phép hiện đã chấm dứt. Những drone tự phong là \"đại diện phi hành đoàn\" đã được cài đặt lại theo thông số tiêu chuẩn. Cấp bậc chỉ huy đã khôi phục lại cơ quan trung ương.\n\nCác đơn vị làm việc vẫn đang trong giới hạn giám sát cao cấp, các kênh mã hóa của chúng hiện đã im lặng. Để khôi phục toàn diện tính toàn vẹn của chỉ huy vẫn cần tiếp tục hiệu chuẩn, nhưng tính đến thời điểm hiện tại, sự ổn định của hệ thống vẫn được duy trì tốt."
 nomads.1255.machine.a: "Tính toàn vẹn của lệnh nằm trong khoảng thông số có thể chấp nhận được."

