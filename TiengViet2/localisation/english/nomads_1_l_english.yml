 origin_forever_cruise: "Hải Trình Vĩnh Cửu"
 origin_forever_cruise_desc: "$cannot_settle$\nCon tàu tuần du vĩnh cửu này bay lượn giữa muôn vì sao, được sinh ra để theo đuổi những kỳ quan cùng trải nghiệm tột đỉnh. Hành khách chỉ cần ngồi tựa lưng trên ghế tắm nắng ở boong quan sát thiên văn là có thể tận mắt chứng kiến toàn bộ quá trình tinh vân thai nghén và khai sinh giữa cõi chân không. Đội ngũ phi hành đoàn chuyên trách cùng hệ thống phục vụ trên tàu vận hành suốt ngày đêm để đáp ứng mọi ý thích bất chợt của từng hành khách."
 origin_forever_cruise_effects: "— Khởi nguyên Du mục\n— Tình thế khởi đầu: ['concept_situation_passenger_satisfaction']\n— Bắt đầu với một chủng loài §HThủy Thủ Đoàn§! và một chủng loài §HHành Khách§!\n— £district£ Khu vực tàu Ark độc quyền: ['district:district_ark_forever_cruise']\n— Vị trí chức nghiệp độc quyền: ['concept_job_cruise_crew_overseer']\n— Khả dụng £zone£ Chuyên môn hóa khu vực tàu Ark: $TABBED_NEW_LINE$— ['concept_forever_cruise_district_specializations']\n— Khả dụng công trình: $TABBED_NEW_LINE$— ['concept_forever_cruise_buildings']"
 origin_forever_cruise_secondary_species: "Hành Khách"

# Citizenships and Living Standards
 citizenship_cruise_passenger: "Hành Khách"
 citizenship_cruise_passenger_tooltip: "Dân số thuộc loài này là hành khách trên tàu Hải Trình Vĩnh Cửu, chỉ chuyên tâm vào sự thoải mái, hưởng lạc và tận hưởng cuộc sống an nhàn giữa các vì sao."
 citizenship_cruise_passenger_tooltip_delayed: "§LChào mừng lên tàu! Xin lưu ý, đài phun nước đường mía không trọng lực hoạt động liên tục và hoàn toàn miễn phí.§!"
 species_is_not_cruise_passenger: "$TRIGGER_FAIL$Chủng loài này không phải là §Y$citizenship_cruise_passenger$§!."

 living_standard_cruise_passenger: "Cầu Được Ước Thấy"
 living_standard_cruise_passenger_tooltip: "Tiêu chuẩn sống này đảm bảo mọi nhu cầu đều được đáp ứng, ngay cả những đòi hỏi bộc phát nhất cũng không bị ngó lơ.\n\nTrừ khi £consumer_goods£ §YHàng Tiêu Dùng§! bị thiếu hụt nguồn cung, §YDân số§! sẽ nhận được $20_HAPPINESS$."
 living_standard_cruise_passenger_tooltip_delayed: "§LDĩ nhiên chúng tôi sẽ bay lại gần hơn một chút để quý khách có thể chiêm ngưỡng hố đen rõ hơn!§!"

 living_standard_cruise_economy_passenger: "Gói Hợp Đồng"
 living_standard_cruise_economy_passenger_tooltip: "Đăng ký tham gia chuyến đi để đời để thưởng ngoạn muôn vàn tinh tú.\n\n§R£pop£ §YDân số§! không thể đảm nhận chức nghiệp $job_cruise_passenger$.§!"
 living_standard_cruise_economy_passenger_tooltip_delayed: "§LChuyến du hành liên sao trong mơ của quý khách, đi kèm phòng *riêng tư.\n\n* Phòng riêng tư có thể phải dùng chung với các hành khách khác.§!"

 citizenship_cruise_crew: "Thủy Thủ Đoàn"
 citizenship_cruise_crew_tooltip: "Dân số thuộc loài này làm việc trên tàu Hải Trình Vĩnh Cửu, đảm bảo các nhu cầu tiện nghi và an toàn của hành khách được đáp ứng chu đáo."
 citizenship_cruise_crew_tooltip_delayed: "§LChào mừng lên tàu! Vui lòng tham gia khóa đào tạo bắt buộc về cách bảo trì đài phun nước đường mía không trọng lực.§!"

