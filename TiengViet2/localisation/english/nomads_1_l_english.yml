 contract_suntrip_passenger_5: "Lễ hội Ánh sao"
 contract_suntrip_passenger_5_desc: "Một buổi dạ vũ trang trọng sẽ được tổ chức trên boong quan sát, tắm trong ánh sao trực tiếp. Đây là sự kiện xã hội đỉnh cao trong chuyến hành trình này."
 contract_suntrip_passenger_5_lore_issued: "§L\"Họ sẽ mở cửa sổ toàn cảnh cho sự kiện này. Cuối cùng cũng có lý do để lôi bộ lễ phục ra.\"§!"
 contract_suntrip_passenger_5_lore_completed: "§L\"Tôi đã khiêu vũ dưới ánh sáng của một ngôi sao ngoại lai. Không có gì trên con tàu này có thể vượt qua được cảm giác đó.\"§!"
 contract_suntrip_passenger_5_lore_failed: "§L\"Lễ hội bị hoãn rồi. Cái ruy băng lễ phục của tôi coi như ủi công cốc.\"§!"
 contract_suntrip_passenger_5_chain_title: "$contract_suntrip_passenger_5$"
 contract_suntrip_passenger_5_chain_desc: "$contract_suntrip_passenger_5_desc$"
 CONTRACT_SUNTRIP_passenger_5_PROJECT: "$contract_suntrip_passenger_5$"
 CONTRACT_SUNTRIP_passenger_5_PROJECT_DESC: ""

 contract_shoreleave_passenger_1: "Điểm dừng chân"
 contract_shoreleave_passenger_1_desc: "Hành khách mong muốn được đặt chân lên mặt đất vững chãi để khám phá thành phố ngoại lai bên dưới. Chúng ta đã sắp xếp chuyến tham quan thành phố có hướng dẫn viên."
 contract_shoreleave_passenger_1_lore_issued: "§L\"Không có tường thì họ giữ bầu khí quyển kiểu gì? Trông có vẻ không an toàn lắm.\"§!"
 contract_shoreleave_passenger_1_lore_completed: "§L\"Tôi đã mua một món đồ lưu niệm. Tôi không biết nó là gì. Nhưng tôi rất thích.\"§!"
 contract_shoreleave_passenger_1_lore_failed: "§L\"Thành phố ở ngay đó. Ngay-ở-đó.\"§!"
 contract_shoreleave_passenger_1_chain_title: "$contract_shoreleave_passenger_1$"
 contract_shoreleave_passenger_1_chain_desc: "$contract_shoreleave_passenger_1_desc$"
 CONTRACT_SHORELEAVE_passenger_1_PROJECT: "$contract_shoreleave_passenger_1$"
 CONTRACT_SHORELEAVE_passenger_1_PROJECT_DESC: ""

 contract_shoreleave_passenger_2: "Đặc sản địa phương"
 contract_shoreleave_passenger_2_desc: "Khu vực ẩm thực nổi tiếng trên hành tinh bên dưới đã đồng ý tiếp đón hành khách, tổ chức một chuyến tham quan nếm thử món ngon địa phương có hướng dẫn viên."
 contract_shoreleave_passenger_2_lore_issued: "§L\"Nghe nói đồ ăn vặt lề đường của họ vẫn còn động đậy trên đĩa. Tôi phải đi mở rộng tầm mắt mới được.\"§!"
 contract_shoreleave_passenger_2_lore_completed: "§L\"Tôi đã ăn một thứ mà tôi thậm chí không biết đọc tên, và giờ trong đầu tôi chỉ toàn là nó. Khi nào chúng ta quay lại đó nữa?\"§!"
 contract_shoreleave_passenger_2_lore_failed: "§L\"Họ đã hủy chuyến du lịch ẩm thực. Tôi đã mong chờ sự kiện này từ chu kỳ trước rồi.\"§!"
 contract_shoreleave_passenger_2_chain_title: "$contract_shoreleave_passenger_2$"
 contract_shoreleave_passenger_2_chain_desc: "$contract_shoreleave_passenger_2_desc$"
 CONTRACT_SHORELEAVE_passenger_2_PROJECT: "$contract_shoreleave_passenger_2$"
 CONTRACT_SHORELEAVE_passenger_2_PROJECT_DESC: ""

 contract_shoreleave_passenger_3: "Khảo sát văn hóa"
 contract_shoreleave_passenger_3_desc: "Thủ đô của hành tinh này có một bảo tàng nổi tiếng khắp ngân hà. Hành khách đã liên tục kiến nghị yêu cầu sắp xếp chuyến tham quan có hướng dẫn viên để xem các di tích và phòng trưng bày lịch sử."
 contract_shoreleave_passenger_3_lore_issued: "§L\"Tôi đã đọc cuốn cẩm nang du lịch ba lần rồi. Tôi vẫn không hiểu lịch của họ, nhưng kiến trúc thì trông thật kinh ngạc.\"§!"
 contract_shoreleave_passenger_3_lore_completed: "§L\"Đài tưởng niệm chiến tranh của họ thật đáng suy ngẫm. Phòng trưng bày nghệ thuật của họ thì khó hiểu. Tôi yêu từng khoảnh khắc ở đó.\"§!"
 contract_shoreleave_passenger_3_lore_failed: "§L\"Tôi đã đọc cẩm nang du lịch nhiều đến mức cảm giác như mình đã đi rồi. Có khi thế lại tệ hơn.\"§!"
 contract_shoreleave_passenger_3_chain_title: "$contract_shoreleave_passenger_3$"
 contract_shoreleave_passenger_3_chain_desc: "$contract_shoreleave_passenger_3_desc$"
 CONTRACT_SHORELEAVE_passenger_3_PROJECT: "$contract_shoreleave_passenger_3$"
 CONTRACT_SHORELEAVE_passenger_3_PROJECT_DESC: ""

 contract_shoreleave_passenger_4: "Ngày họp chợ"
 contract_shoreleave_passenger_4_desc: "Một khu chợ ngoài trời khổng lồ trên mặt đất giao dịch hàng hóa từ toàn bộ khu vực thiên hà. Hành khách đang rất háo hức muốn dạo quanh và mặc cả."
 contract_shoreleave_passenger_4_lore_issued: "§L\"Tôi mang theo ba cái túi và ngân sách nghiêm ngặt. Nhưng thứ tôi cần là sáu cái túi, và không có ngân sách.\"§!"
 contract_shoreleave_passenger_4_lore_completed: "§L\"Tôi đã mặc cả 20 phút cho một món đồ vớ vẩn mà tôi chẳng cần. Đó là lần mua sắm tuyệt vời nhất đời tôi.\"§!"
 contract_shoreleave_passenger_4_lore_failed: "§L\"Khu chợ đang vẫy gọi tôi. Thật không thể tha thứ.\"§!"
 contract_shoreleave_passenger_4_chain_title: "$contract_shoreleave_passenger_4$"
 contract_shoreleave_passenger_4_chain_desc: "$contract_shoreleave_passenger_4_desc$"
 CONTRACT_SHORELEAVE_passenger_4_PROJECT: "$contract_shoreleave_passenger_4$"
 CONTRACT_SHORELEAVE_passenger_4_PROJECT_DESC: ""

 contract_shoreleave_passenger_5: "Gặp gỡ sinh vật hoang dã"
 contract_shoreleave_passenger_5_desc: "Khu bảo tồn thiên nhiên trên hành tinh bên dưới cung cấp dịch vụ hướng dẫn tham quan băng qua vùng hoang dã ngoại lai. Hành khách có thể ngắm nhìn cận cảnh hệ động vật ngoại lai từ các lối đi bộ tham quan."
 contract_shoreleave_passenger_5_lore_issued: "§L\"Tôi đã mang theo ba thiết bị quay phim. Nếu nó có nhiều hơn bốn chân, tôi sẽ quay nó từ mọi góc độ.\"§!"
 contract_shoreleave_passenger_5_lore_completed: "§L\"Một con đã ngửi tôi. Hoặc là quét tôi. Hoặc là cầu hôn tôi. Tôi không quan tâm, điều này thật tuyệt vời.\"§!"
 contract_shoreleave_passenger_5_lore_failed: "§L\"Không có chuyến tham quan động vật hoang dã nào cả. Chắc tôi lại phải đến boong tầng 9 để nhìn chằm chằm vào bể cá thôi.\"§!"
 contract_shoreleave_passenger_5_chain_title: "$contract_shoreleave_passenger_5$"
 contract_shoreleave_passenger_5_chain_desc: "$contract_shoreleave_passenger_5_desc$"
 CONTRACT_SHORELEAVE_passenger_5_PROJECT: "$contract_shoreleave_passenger_5$"
 CONTRACT_SHORELEAVE_passenger_5_PROJECT_DESC: ""

 contract_espionage_support_passenger_1: "Nhà hát tình báo"
 contract_espionage_support_passenger_1_desc: "Để giải trí cho hành khách, chúng ta sẽ triển khai một \"vệ tinh gián điệp\" không có chức năng vào hệ sao được chỉ định."
 contract_espionage_support_passenger_1_lore_issued: "§L\"Ông phải đảm bảo với tôi là sẽ có một cảnh rượt đuổi đấy nhé!\"§!"
 contract_espionage_support_passenger_1_lore_completed: "§L\"Đích thân tôi đã chặn được ba đường truyền mã hóa. Chà, màn hình nó báo thế.\"§!"
 contract_espionage_support_passenger_1_lore_failed: "§L\"Vậy cái vệ tinh gián điệp đó có định làm gì không, hay vừa rồi là tất cả những gì nó có thể làm?\"§!"
 contract_espionage_support_passenger_1_chain_title: "$contract_espionage_support_passenger_1$"
 contract_espionage_support_passenger_1_chain_desc: "$contract_espionage_support_passenger_1_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_1_PROJECT: "$contract_espionage_support_passenger_1$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_1_PROJECT_DESC: ""

 contract_espionage_support_passenger_2: "Người cung cấp thông tin"
 contract_espionage_support_passenger_2_desc: "[GetEspionageSupportPassenger2]"
 contract_espionage_support_passenger_issuer_2_desc: "[GetEspionageSupportPassengerIssuer2]"
 contract_espionage_support_passenger_2_regular_desc: "Chúng ta đang lên kế hoạch cho một chiến dịch tình báo toàn tàu. Các tình nguyện viên của phi hành đoàn sẽ được cài cắm ở các boong khác nhau, đóng vai trò là \"người đào tẩu\" để truyền các bản báo cáo bí mật cho các nhóm hành khách."
 contract_espionage_support_passenger_2_gestalt_desc: "Các cá thể phụ trên mỗi boong sẽ hóa thân thành những kẻ đào tẩu từ hành tinh bên dưới, với sự phối hợp hoàn hảo, đồng thời cung cấp các bản báo cáo bí mật cho các nhóm hành khách khác nhau."

 contract_espionage_support_passenger_2_lore_issued: "§L\"Cán bộ báo cáo của tôi đã nhét cho tôi một tờ giấy mã hóa dưới gầm bàn. Những người cùng bàn với tôi đã ghen tị cực kỳ.\"§!"
 contract_espionage_support_passenger_2_lore_completed: "§L\"Có người nói với tôi rằng tôi đã giúp lật đổ một mạng lưới tình báo ngầm. Tôi biết đó là giả. Nhưng tôi vẫn cảm thấy tự hào.\"§!"
 contract_espionage_support_passenger_2_lore_failed: "§L\"Người cung cấp thông tin không hề xuất hiện. Tôi đã ngồi ở cái buồng đó suốt ba tiếng đồng hồ, chỉ uống đúng một ly rượu.\"§!"
 contract_espionage_support_passenger_2_chain_title: "$contract_espionage_support_passenger_2$"
 contract_espionage_support_passenger_2_chain_desc: "$contract_espionage_support_passenger_2_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_2_PROJECT: "$contract_espionage_support_passenger_2$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_2_PROJECT_DESC: ""

 contract_espionage_support_passenger_3: "Đầu mối bất ngờ"
 contract_espionage_support_passenger_3_desc: "Hành khách đang có chuyến tham quan thành phố bên dưới với hướng dẫn viên, các đặc vụ của phi hành đoàn đã đặt những gói tình báo giả ở các địa điểm định trước để họ khám phá."
 contract_espionage_support_passenger_3_lore_issued: "§L\"Họ đã cấp cho chúng tôi hồ sơ và mật danh. Của tôi là 'Kẻ Phá Bình Minh'. Tôi chưa bao giờ cảm thấy tràn đầy sức sống như thế này.\"§!"
 contract_espionage_support_passenger_3_lore_completed: "§L\"Tôi đã tìm thấy gói hàng đằng sau một bức tượng người ngoài hành tinh. Đội của tôi đã reo hò. Người dân địa phương trông cực kỳ bối rối.\"§!"
 contract_espionage_support_passenger_3_lore_failed: "§L\"Không có đầu mối bất ngờ, không có mật danh, không có nhiệm vụ. Chỉ là nhìn chằm chằm vào những hành lang lặp đi lặp lại trong một vòng tuần hoàn khác.\"§!"
 contract_espionage_support_passenger_3_chain_title: "$contract_espionage_support_passenger_3$"
 contract_espionage_support_passenger_3_chain_desc: "$contract_espionage_support_passenger_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT: "$contract_espionage_support_passenger_3$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT_DESC: ""

 contract_espionage_support_passenger_4: "Truy tìm nội gián"
 contract_espionage_support_passenger_4_desc: "Tất cả các boong trên tàu đã được thông báo về một sự cố an ninh mô phỏng. Hành khách được tuyển dụng tham gia một trò chơi điều tra toàn tàu để tìm ra \"đặc vụ ngoại lai\" được cài cắm trong phi hành đoàn."
 contract_espionage_support_passenger_4_lore_issued: "§L\"Họ nói với chúng tôi rằng trên boong này có một gián điệp. Tôi đã lập ra một danh sách những kẻ tình nghi.\"§!"
 contract_espionage_support_passenger_4_lore_completed: "§L\"Tôi đã tóm được tên nội gián. Thôi được rồi, hàng ngàn hành khách khác cũng tóm được. Nhưng tôi là người bắt được đầu tiên!\"§!"
 contract_espionage_support_passenger_4_lore_failed: "§L\"Chưa kịp đưa ra bằng chứng thì chiến dịch truy tìm nội gián đã bị hủy bỏ. Tôi thậm chí đã chuẩn bị sẵn cả biểu đồ này nọ rồi.\"§!"
 contract_espionage_support_passenger_4_chain_title: "$contract_espionage_support_passenger_4$"
 contract_espionage_support_passenger_4_chain_desc: "$contract_espionage_support_passenger_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT: "$contract_espionage_support_passenger_4$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT_DESC: ""

 contract_espionage_support_passenger_5: "Chặn bắt tín hiệu"
 contract_espionage_support_passenger_5_desc: "Đài quan sát đã được cải tạo thành trạm nghe lén. Hành khách đóng quân ở các trạm này, giải mã những tín hiệu ngoại lai được lập trình sẵn mà phi hành đoàn bí mật gửi từ các boong dưới."
 contract_espionage_support_passenger_5_lore_issued: "§L\"Họ đưa cho tôi một chiếc tai nghe và nói rằng vận mệnh của hệ sao phụ thuộc vào những gì tôi nghe được tiếp theo. Tôi tin họ.\"§!"
 contract_espionage_support_passenger_5_lore_completed: "§L\"Họ bảo chúng tôi rằng những đoạn liên lạc này đã được lên kịch bản sẵn. Thế tại sao khi tôi giải mã tin nhắn cuối cùng, phi hành đoàn trông lại căng thẳng như vậy?\"§!"
 contract_espionage_support_passenger_5_lore_failed: "§L\"Trạm nghe lén đã chìm vào im lặng trước khi tôi đổi ca. Tôi thậm chí còn chưa kịp đeo tai nghe.\"§!"
 contract_espionage_support_passenger_5_chain_title: "$contract_espionage_support_passenger_5$"
 contract_espionage_support_passenger_5_chain_desc: "$contract_espionage_support_passenger_5_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_5_PROJECT: "$contract_espionage_support_passenger_5$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_5_PROJECT_DESC: ""

