 concept_waystation_tribute: "Đồ Cống Nạp"
 concept_waystation_tribute_desc: "Đồ cống nạp sẽ được thu thập vào mỗi tháng dựa trên một tỷ lệ nhất định từ sản lượng thuộc địa của các quốc gia phụ thuộc. Các tài nguyên được thu thập bao gồm: $TABBED_NEW_LINE$- $r_energy$$TABBED_NEW_LINE$- $r_minerals$$TABBED_NEW_LINE$- $r_food$$TABBED_NEW_LINE$- $r_alloys$$TABBED_NEW_LINE$- $r_consumer_goods$$TABBED_NEW_LINE$- $r_rare_crystals$$TABBED_NEW_LINE$- $r_exotic_gases$$TABBED_NEW_LINE$- $r_volatile_motes$"

 # Star Luminosity
 concept_star_luminosity: "$climate_luminosity$"
 concept_star_luminosity_desc: "Độ sáng dùng để chỉ cường độ bức xạ và ánh sáng do ngôi sao phát ra, nó ảnh hưởng đến việc phân loại ngôi sao, nhiệt độ của hệ sao cũng như khả năng hành tinh có thể sinh sống được.\n\n§E$luminosity_0$§!\n—$pc_black_hole$\n—$pc_t_star$\n—$pc_protostar$\n\n§E$luminosity_1$§! \n—$pc_m_star$ \n—$pc_m_giant_star$ \n\n§E$luminosity_2$§! \n—$pc_g_star$ \n—$pc_k_star$ \n\n§E$luminosity_3$§! \n—$pc_b_star$ \n—$pc_a_star$ \n—$pc_f_star$ \n\n§E$luminosity_4$§! \n—$pc_neutron_star$ \n—$pc_pulsar$"
