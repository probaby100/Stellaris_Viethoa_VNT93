 r_tarnished_cfl_trophy_desc: "$r_cfl_trophy_desc$\n\nSẽ chẳng còn cái tên nào được khắc lên đó nữa đâu."
 tarnished_cfl_trophy: "$cfl_trophy$"
 tarnished_cfl_trophy_desc: "Chiếc cúp vĩ đại của Lò Rèn Quán Quân được rước quanh thuộc địa của chúng ta, tuyên cáo vị thế tối thượng của chúng ta, điều này khích lệ tất cả chúng ta, khiến mọi người dốc sức hơn nữa vì tương lai, nếu như vẫn còn có kẻ bận tâm đến chuyện này."
 tarnished_cfl_trophy_tt: "Chi phí ['concept_tradition'] tiếp theo của chúng ta: §G-90%§! $i_unity$"
