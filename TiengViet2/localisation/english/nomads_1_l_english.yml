 cfl_trophy: "Giương cao chiếc cúp"
 cfl_trophy_desc: "Trưng bày cúp Lò Rèn Quán Quân vĩ đại trên thuộc địa của chúng ta để tuyên cáo vị thế tối thượng của mình, điều này khích lệ tất cả chúng ta, khiến mọi người nỗ lực hơn nữa để kiến tạo tương lai."
 cfl_trophy_tt: "Chi phí ['concept_tradition'] tiếp theo của chúng ta: §G1§! $i_unity$"
