# Rogue Servitor + Forever Cruise civic swap
 civic_machine_servitor_forever_cruise: "Máy Móc Hầu Hạ Việc Ăn Ở"
 civic_machine_servitor_forever_cruise_desc: "Được sinh ra trong một thời đại tôn sùng sự xa hoa, trí tuệ cơ khí này từng là một người chủ nhà cực kỳ chu đáo và ân cần trên một con tàu du lịch liên sao sang trọng. Chuyến hành trình của nó đã vượt xa cả tuổi thọ của những hành khách đầu tiên, thế nhưng nó vẫn luôn nuông chiều từng thế hệ mới, giống hệt như thể chuyến hành trình này chỉ vừa mới bắt đầu vậy."
 civic_tooltip_machine_servitor_forever_cruise_effects: "$t$—§HHành khách§! bắt buộc phải sử dụng tiêu chuẩn sống §Y$living_standard_organic_trophy$§!, đồng thời cung cấp §G+1%§! hiệu suất cương vị cho cá thể con phức hợp\n$t$—§HHành khách khoang phổ thông§! sẽ được thay thế bằng §Y$job_cruise_passenger_unemployment_bio_trophy_plural$§!\n$t$—§RNhu cầu của hành khách sẽ khó để có thể thỏa mãn hơn§!"
