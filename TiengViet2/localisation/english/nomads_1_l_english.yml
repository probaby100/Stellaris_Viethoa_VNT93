 agenda_arkship_engineering_mastery_finish_desc: "§L $council_agenda_agenda_arkship_engineering_mastery_desc$ §!"
 agenda_arkship_engineering_mastery_finish_modifier_tt: "Tốc độ khảo sát của tàu Ark: §G+$@arkship_mastery_mult|0%$§!\nTốc độ bay dưới vận tốc ánh sáng của tàu Ark: §G+$@arkship_mastery_mult|0%$§!\nĐộ né tránh của tàu Ark: §G+$@arkship_mastery_static|0$§!\nTốc độ bắn của tàu Ark: §G+$@arkship_mastery_mult|0%$§!\nTốc độ chuyển giao tài nguyên trạm tiếp vận của tàu Ark: §G+$@arkship_mastery_mult|0%$§!\nTầm quét của tàu Ark: §G+$@arkship_mastery_sensor|0$§!"

