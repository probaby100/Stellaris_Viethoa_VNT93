 opinion_returned_contract_chance_find: "Bàn giao Hàng hóa"

 nomads.6015.name: "Thiết bị Trục trặc"
 nomads.6015.desc: "Vài khoang mô-đun cũ kỹ trên Tàu Ark đã hư hại sau sự cố làm mát nghiêm trọng, bộc lộ rõ tuổi thọ đã hết thời. Thiệt hại là rất lớn, may sao hệ thống ngắt khẩn cấp đã kịp kích hoạt trước khi ảnh hưởng đến cấu trúc tàu. Chúng ta nên xử trí ra sao?"
 nomads.6015.a: "Cử đội sửa chữa."
 nomads.6015.b: "Không sao, đằng nào cũng đến lúc thay mới rồi."
 nomads.6015.c: "Đã đến lúc nâng cấp vài thứ rồi."
 nomads.6015.d: "Đừng lo, chúng ta có thừa đồ dự phòng."
 nomads.6015.e: "Ta có thể bắt khách hàng chi trả..."
 nomads.6015.e.tt: "§L... theo Điều 56, Khoản 18, Tu chính án Omicron của hợp đồng.§!"
 d_compact_modules: "Khoang Mô-đun Tinh gọn"
 d_compact_modules_desc: "Hệ thống làm mát tân tiến cho phép chúng ta tận dụng lại một phần không gian mô-đun để làm nơi ở, đồng thời lấy nhiệt năng dư thừa phục vụ đời sống và sản xuất."
 module_recycling: "Tái chế Mô-đun"
 module_recycling_desc: "Đã đến lúc thực hiện một vài thay đổi đối với các khoang ghép trên Tàu Ark của chúng ta."
 opinion_abused_contract: "Hợp đồng Bị Lạm Dụng"
 opinion_abused_contract_2: "$opinion_abused_contract$"

 nomads.6020.name: "Tiếng Động Từ Khoang Hàng"
 nomads.6020.desc: "Trong khi bốc dỡ đồ tiếp tế từ §Y[event_target:contract_issuer.GetName]§!, chúng ta phát hiện một trong các khoang hàng đã bị vỡ niêm phong cách ly. Báo cáo cho biết có tiếng gầm gừ trầm đục vang lên phía sau cánh cửa an ninh, xác nhận mối nguy hiểm tiềm tàng bên trong.\n\nLiệu chúng ta có nên mạo hiểm vào kiểm tra?"
 nomads.6020.a: "Đừng mạo hiểm với Tàu Ark, tống thẳng kiện hàng ra ngoài không gian."
 nomads.6020.b: "Mở cửa ra."

 nomads.6025.name: "Sinh vật Phát quang"
 nomads.6025.desc: "Khi cánh cửa khoang hàng mở ra, một bầy sinh vật phát sáng bất ngờ ùa ra rồi tản mát vào các khu vực khác trên Tàu Ark. Báo cáo của các nhà sinh vật học ngoài hành tinh cho thấy những sinh vật này không hề hung dữ, không đe dọa đến người dân hay cấu trúc của con tàu.\n\nNhững sinh vật bé nhỏ này có thân hình bầu dục nâng đỡ bởi các chi thon dài, có thể leo trèo trên tường và trần nhà rồi di chuyển với tốc độ đáng kinh ngạc. Chúng dường như săn các loài bọ gây hại nhỏ trong hệ sinh thái của chúng ta, dùng tuyến phát quang trước ngực để dụ mồi. Cư dân đã quen dần với sự xuất hiện của chúng và thấy chúng cực kỳ đáng yêu khi màn đêm buông xuống — ánh sáng dịu nhẹ cùng tiếng kêu khẽ khàng của chúng tạo nên một cảnh tượng êm ả lạ thường."
 nomads.6025.a: "Bắt đầu thí nghiệm về đặc tính phát quang sinh học của chúng."
 nomads.6025.b: "Hãy để cư dân Tàu Ark tận hưởng điều kỳ diệu này."

 nomads.6030.name: "Mèo Siêu Hung Dữ"
 nomads.6030.desc: "Dù đã lục soát khắp nơi, đội của chúng ta vẫn không thể tìm thấy nguồn gốc gây náo loạn trong khoang hàng lúc này đã lặng như tờ. Đúng lúc họ chuẩn bị rời đi, một sinh vật bé nhỏ liền chui ra từ bóng tối, vồ lấy một sợi chỉ lủng lẳng trên đồng phục của một thuyền viên.\n\nCác thuyền viên ban đầu giật mình, nhưng rất nhanh nhận ra con thú ngoài hành tinh này vốn tính nghịch ngợm chứ chẳng có ác ý. Khi được bế lên quan sát cẩn thận, con vật phát ra những rung động nhè nhẹ như tiếng động cơ êm ái, một dấu hiệu cho thấy nó đang cảm thấy dễ chịu."
 nomads.6030.a: "Nghiên cứu mẫu vật này."
 nomads.6030.b: "Có lẽ ai đó sẽ nhận nuôi nó."

 nomads.6035.name: "Cỗ Máy Trục Trặc"
 nomads.6035.desc: "Khi vào khoang hàng, các thuyền viên phát hiện một thùng hàng đã bị phá toang từ bên trong. Một người máy bị hư hại nằm bệt trên sàn, mô-tơ vẫn còn rù rì kêu và đèn báo nhấp nháy loạn xạ.\n\nKhi các thuyền viên cố đưa cỗ máy này trở lại thùng, một ngăn bí mật bỗng bật mở, làm đổ tràn một đống tinh thể lấp lánh ra sàn.\n\nNgay trước khi sập nguồn vĩnh viễn, người máy phát ra một lời thì thầm yếu ớt, theo thuyền viên kể lại là: \"Đừng tắt tôi... tôi khác biệt mà...\""
 nomads.6035.a: "Chúng ta sẽ trả lại cho chủ nhân của nó."
 nomads.6035.b: "Đọc vi mạch của nó."
 nomads.6035.c: "Rã xác nó ra và lấy số tinh thể."

 nomads.6040.name: "Khí Dễ Phát Nổ"
 nomads.6040.desc: "Khi lại gần khoang hàng, những âm thanh kỳ lạ vẫn tiếp diễn, buộc chúng ta phải áp dụng các biện pháp phòng ngừa nghiêm ngặt. Bước vào sàn khoang hàng, các thuyền viên ngửi thấy mùi hôi nồng nặc độc hại và nhận thấy mảnh vỡ kệ hàng vương vãi khắp bãi đỗ. Chốc lát sau, vài vụ nổ nhỏ bùng lên từ các thùng hàng lân cận, kích hoạt phản ứng khẩn cấp.\n\nĐội ngũ lần theo làn khói và phát hiện một đốm lửa nhỏ. Các chuyên viên nhanh chóng dập tắt nó, giúp nhóm kiểm soát và vô hiệu hóa những luồng khí dễ bay hơi trước khi tình hình xấu đi. Sàn khoang hàng chịu nhiều hư hại cấu trúc rõ rệt, nhiều thùng hàng xung quanh cũng bị vỡ nát."
 nomads.6040.a: "Chúng ta đã kịp thời ngăn chặn tổn thất lớn hơn."
 nomads.6040.b: "Bắt bên giao việc phải bồi thường thiệt hại."

 nomads.6045.name: "Kẻ Không Có Trong Danh Sách"
 nomads.6045.desc: "Sau khi bước vào khoang hàng, sự náo loạn càng lúc càng dữ dội. Chỉ số âm thanh chỉ thẳng về một thùng hàng. Các thành viên đã chuẩn bị cho tình huống xấu nhất, và chỉ giây lát sau, một bóng người từ thùng hàng lao vụt ra.\n\nKẻ này nói bằng chất giọng lạ lẫm, khẳng định mình đến trong hòa bình. Tự xưng là §Y[arkship_cargo_leader.GetName]§!, người này cho biết [arkship_cargo_leader.GetHeShe] từng thuộc về một tổ chức hạm đội quy mô lớn nhưng bị đuổi vì vi phạm kỷ luật. [arkship_cargo_leader.GetHeSheCap] giải thích rằng việc trốn lên tàu và ẩn giấu tung tích là để tìm nơi nương náu, đồng thời khao khát có cơ hội chứng minh sự hữu dụng của [arkship_cargo_leader.GetHimHer].\n\n§Y[arkship_cargo_leader.GetName]§! hỏi xem đội ngũ có sẵn lòng chấp nhận lời đề nghị của [arkship_cargo_leader.GetHisHer] hay không."
 nomads.6045.desc.noleader: "Chúng ta từng rơi vào cảnh ngàn cân treo sợi tóc cho đến khi §Y[arkship_cargo_leader.GetName]§! đứng ra dàn xếp tình hình và được giao quyền dẫn dắt Tàu Ark."
 nomads.6045.a: "Chào mừng lên tàu."
 nomads.6045.b: "Với chúng ta, ngươi cũng chỉ là một món hàng. Ta sẽ giao ngươi đúng hẹn."
 nomads.6045.c: "Về lại nơi ngươi thuộc về đi, kẻ phản bội."

 nomads.6050.name: "Hàng Sống Trái Phép"
 nomads.6050.desc: "Cánh cửa vừa mở ra, những âm thanh kỳ lạ bỗng im bặt. Vì chưa rõ nguyên nhân náo loạn, nhóm bắt đầu quét kiểm tra từng thùng hàng một cách bài bản.\n\nMột thùng hàng bỗng hiện lên nhiều dấu hiệu sự sống bất thường. Khi cạy mở ra, bên trong có vài người đang suy dinh dưỡng nặng và kiệt quệ. \"Xin hãy rủ lòng thương,\" một người cất lời. \"Chúng tôi bị bức hại và phải trốn chạy khỏi đế chế §Y[event_target:contract_issuer.GetName]§!. Xin tùy ý các vị định đoạt.\""
 nomads.6050.a: "Chúng ta nên trục xuất họ trở về."
 nomads.6050.b: "Hãy nói những gì các người biết, chúng ta sẽ đưa các người đến nơi."
 nomads.6050.c: "Tàu Ark của chúng ta vẫn còn chỗ trống."

 nomads.contract_event_header: "Trong quá trình thực hiện hợp đồng với §H[event_target:contract_issuer.GetName]§!, đã nảy sinh một vài sự cố."

 nomads.6055.name: "Khảo Sát Học Thuật"
 nomads.6055.desc: "$nomads.contract_event_header$ Họ muốn quan sát và ghi chép lại đời sống trên Tàu Ark trong suốt thời hạn hợp đồng.\n\nCó vẻ đối với hầu hết các nền văn minh định cư, lối sống du mục vẫn luôn đầy mê hoặc và chất chứa không ít bí ẩn."
 nomads.6055.desc.machine: "$nomads.contract_event_header$ Họ muốn ghi lại cách thức vận hành của Tàu Ark trong thời hạn hợp đồng.\n\nMục tiêu đề ra là nghiên cứu một mạng lưới tự trị di động vận hành vượt ra ngoài các thông số hành tinh thông thường, một đề tài mà hiện gần như chưa có dữ liệu bên ngoài nào để đối chiếu."
 nomads.6055.desc.hive: "$nomads.contract_event_header$ Họ yêu cầu quyền được quan sát trên Tàu Ark trong thời hạn hợp đồng.\n\nYêu cầu này bắt nguồn từ các nhà nghiên cứu cá thể, những người đang cố gắng thấu hiểu một lối sinh tồn di động tập thể nằm ngoài kinh nghiệm từng ghi nhận của họ."
 nomads.6055.a: "Nhiệt liệt chào đón quý quốc tới khảo sát!"
 nomads.6055.a.gestalt: "Cấp quyền quan sát cho họ."
 nomads.6055.b: "Cấp quyền hạn chế, nhưng phải trả thêm tiền."
 nomads.6055.c: "Tàu Ark không phải chỗ để thiên hạ ngắm nghía."

 nomads.6060.name: "Tranh Chấp Vận Hành"
 nomads.6060.desc: "$nomads.contract_event_header$\n\nGiữa hai bộ phận thuyền viên đã nảy sinh tranh cãi về quyền hạn vận hành. Cả hai bên đều gửi khiếu nại chính thức, khiến năng suất làm việc tại các khu vực liên quan bắt đầu tụt dốc."
 nomads.6060.desc.machine: "$nomads.contract_event_header$\n\nCác mệnh lệnh ưu tiên xung đột nhau đã dẫn đến lỗi xử lý giữa hai hệ thống con quản lý.\n\nCả hai đều tự đánh dấu mình là đơn vị được ủy quyền vận hành hợp đồng hiện tại, khiến hệ thống rơi vào trạng thái chờ lặp vô tận và làm giảm sút hiệu suất."
 nomads.6060.desc.hive: "$nomads.contract_event_header$\n\nMột luồng xử lý lạc điệu đã xuất hiện trong nhịp cộng hưởng của tập thể.\n\nLiên quan đến việc phân chia trách nhiệm trong hợp đồng hiện tại, hai cụm nhánh đã phát ra các hành vi đối nghịch, gây nên sự kém hiệu quả cho ý thức chung."
 nomads.6060.a: "Đứng ra hòa giải giữa các phe."
 nomads.6060.a.gestalt: "Phân xử xung đột này."
 nomads.6060.b: "Chúng ta không rảnh làm mấy việc này."

 jurisdictional_mediation: "Hòa Giải Thẩm Quyền"
 jurisdictional_mediation_desc: "Tranh chấp quyền hạn đã được giải quyết xong xuôi. Độ gắn kết tăng lên, tuy nhiên tiến độ thi công tạm thời chậm lại trong lúc cập nhật quy trình."
 command_reassigned: "Phân Bổ Lại Quyền Chỉ Huy"
 command_reassigned_desc: "Quyền vận hành các khu vực tranh chấp đã được phân chia lại. Điều này làm nảy sinh bất đồng trong việc phối hợp nội bộ."

 nomads.6065.name: "Yêu Cầu Nghỉ Ngơi"
 nomads.6065.desc: "$nomads.contract_event_header$\n\nHệ thống giám sát nội bộ của Tàu Ark báo cáo rằng tinh thần của tầng lớp lao động đang sa sút. Một yêu cầu chính thức xin thời gian nghỉ ngơi dưỡng sức đã được đệ trình.\n\nYêu cầu này cũng được gửi kèm tới [event_target:contract_issuer.GetName], họ đang chờ hồi đáp và chắc chắn sẽ đòi sửa đổi điều khoản."
 nomads.6065.desc.machine: "$nomads.contract_event_header$\n\nChu kỳ chẩn đoán phát hiện nhiều hệ thống chính phụ đang tồn đọng một lượng lớn tác vụ bảo dưỡng quá hạn. Dự báo hiệu suất cho thấy việc sắp xếp bảo trì định kỳ sẽ giúp nâng cao rõ rệt sản lượng lao động theo thống kê.\n\nBáo cáo đã gửi cho [event_target:contract_issuer.GetName], họ sẽ theo sát cách giải quyết và chắc chắn sẽ đòi sửa đổi điều khoản."
 nomads.6065.desc.hive: "$nomads.contract_event_header$\n\nChúng ta ghi nhận sự thiếu đồng bộ ngày càng tăng giữa các $planet_jobs_simple_drone$. Quá trình lao động của chúng cần một quãng hồi phục đồng bộ, vì việc ép làm việc liên tục có nguy cơ làm sụt giảm nghiêm trọng sản lượng của tập thể.\n\n[event_target:contract_issuer.GetName] đã biết chuyện này và chắc chắn sẽ đòi sửa đổi điều khoản."
 nomads.6065.a: "Chấp thuận yêu cầu."
 nomads.6065.a.tt: "§RThù lao nhận được khi hoàn tất hợp đồng này sẽ giảm 25%.§!"
 nomads.6065.b: "Hợp đồng phải được ưu tiên hàng đầu."

 downtime_granted: "Chấp Thuận Nghỉ Ngơi"
 downtime_granted_desc: "Lực lượng lao động trên Tàu Ark đã được chấp thuận một khoảng thời gian nghỉ ngơi theo luật định. Tinh thần và năng suất làm việc trên các sàn sản xuất đều tăng lên."
 downtime_denied: "Bác Bỏ Nghỉ Ngơi"
 downtime_denied_desc: "Nhằm hoàn thành hợp đồng, yêu cầu nghỉ ngơi của nhân lực đã bị khước từ. Tinh thần của giới lao động sản xuất bị đè nén."

 nomads.6070.name: "Vang Danh Bốn Bể"
 nomads.6070.desc: "$nomads.contract_event_header$\n\nThành tích xuất sắc của chúng ta với vai trò nhà thầu đã vang danh khắp cõi. §H[event_target:reputation_noticed_empire.GetName]§! nhận thấy điều này khi theo dõi các hoạt động buôn bán toàn thiên hà, và hiện xem ta là một đối tác đáng tin cậy đầy năng lực.\n\nChúng ta có cơ hội thắt chặt hơn mối quan hệ này, hoặc có thể nhường công lao cho đối tác đáng tin cậy của mình."
 nomads.6070.desc.machine: "$nomads.contract_event_header$\n\nDữ liệu vận hành trong các hợp đồng đã hoàn tất của chúng ta đã được bên ngoài thu thập. §H[event_target:reputation_noticed_empire.GetName]§! khi theo dõi mạng lưới tự trị trong khu vực đã chú ý đến chỉ số hiệu quả của ta, và đánh giá ta là một nhà thầu uy tín đầy thực lực.\n\nKênh liên lạc đã mở. Ta có thể tiếp nhận lời khen này hoặc chuyển phần công lao cho đối tác hiện tại của mình."
 nomads.6070.desc.hive: "$nomads.contract_event_header$\n\nKhi quan sát dòng chảy lao động và buôn bán trên toàn cõi sao, §H[event_target:reputation_noticed_empire.GetName]§! đã nhận thấy nhịp điệu hành động chuẩn xác của chúng ta, minh chứng cho sự đáng tin và năng lực vượt trội.\n\nSóng cộng hưởng công nhận đã truyền tới. Ta có thể hồi đáp, hoặc để tiếng nói của các Ý thức Tổ ong khác chuyển tiếp tín hiệu này."
 nomads.6070.a: "Bảo đảm thiện chí của chúng ta với họ."
 nomads.6070.b: "Tiếng thơm vốn đã là phần thưởng tuyệt vời nhất."
 nomads.6070.c: "Nhường lại công lao cho §H[event_target:contract_issuer.GetName]§!."

 nomads.6075.name: "Thu Hoạch Bất Ngờ Từ Đợt Khảo Sát Đầu"
 nomads.6075.desc: "$nomads.contract_event_header$\n\nCác đợt quét tầm xa ban đầu tại khu vực hợp đồng đã mang lại kết quả bội thu. Dữ liệu này có giá trị thương mại rất lớn, và một tay môi giới độc lập đã ngỏ ý muốn mua lại toàn bộ."
 nomads.6075.a: "Bán cho tay môi giới."
 nomads.6075.b: "Bàn giao dữ liệu như một phần bổ sung của hợp đồng."
 nomads.6075.c: "Lưu trữ lại để tự dùng sau này."

 opinion_unexpected_cargo_positive: "Đế chế §Y[event_target:contract_issuer.GetName]§! giờ đây có cái nhìn thiện cảm hơn đối với Tàu Ark §Y[Root.GetName]§!"
 opinion_unexpected_cargo_negative: "Đế chế §Y[event_target:contract_issuer.GetName]§! giờ đây có cái nhìn ác cảm hơn đối với Tàu Ark §Y[Root.GetName]§!"

 #######################
# NOMADIC PARAGONS
 #######################

 NAME_nomadic_revenant: "Oren Vesh"
 DESC_nomadic_revenant: "Một kẻ sống sót từ thế giới bị thiêu rụi, mình đầy sẹo tích cùng kỷ luật thép không mệt mỏi, kẻ đã thề sẽ báo thù tất cả những ai gây ra tội ác tày trời này."
 catch_phrase_nomadic_revenant: "Hãy lôi lũ đồ tể đến trước mặt ta, ta sẽ trả lại chúng sự tàn bạo gấp mười lần."
 nomads.1505.name: "$NAME_nomadic_revenant$"
 nomads.1505.desc: "§HNgười đó bước lên tàu với tác phong nhà binh, gương mặt đanh thép hằn sâu nỗi đau và những năm tháng lưu vong. Giọng nói trầm ổn, lạnh lùng và sắc bén như lưỡi thép.§!\n\n\"Thế giới của ta đã bị thanh trừng, đồng bào ta, gia đình ta... chỉ duy nhất ta sống sót. Ta đã nhẫn nhịn bấy lâu. Và những kẻ chủ mưu gây ra cảnh diệt vong này, chắc chắn sẽ phải đền mạng dưới tay ta.\""
 nomads.1505.a: "Ngươi là ai?"
 nomads.1505.a.response: "§HNgười ấy khựng lại một lúc, tựa như việc thốt ra tên mình sẽ xé toạc vết thương cũ.§!\n\n\"Tên tuổi vẫn còn đó, dẫu ý nghĩa của nó đã tan thành tro bụi. Ta từng là một người lính, trung thành và phục tùng. Giờ đây, ta chỉ là cái bóng của một dân tộc đã bị xóa sổ.\n\nNếu các người nhất thiết phải gọi tên, cứ gọi ta là $NAME_nomadic_revenant$. Quá khứ của ta chẳng còn quan trọng nữa. Điều duy nhất còn lại là món nợ máu chưa trả.\""

 nomads.1505.b: "Tại sao lại chọn chúng ta?"
 nomads.1505.b.response: "\"Tàu Ark của các người không mang bóng dáng của cờ bạo quyền. Đó là lý do ta đứng trước mặt các người. Ta đã sớm hiểu ra rằng, một hành tinh chỉ là một cái lồng giam. Một khi cuộc thảm sát bắt đầu, chẳng còn nơi nào để trốn. Nhưng các người luôn di chuyển, vì thế các người có thể vượt qua mọi thử thách.\"\n\n\"Đi theo các người, những bi kịch như thế có thể bị đạp dưới chân, và lưỡi gươm của ta sẽ chĩa thẳng vào lũ đồ tể khát máu.\""

 nomads.1505.c: "Ngươi muốn điều gì?"
 nomads.1505.c.response: "\"Báo thù.\"\n\n§HHai chữ ấy như làm đông cứng cả bầu không khí. Kẻ lạ mặt cúi người về phía trước, từng đường gân thớ thịt căng lên vì cơn thịnh nộ bị dồn nén.§!\n\n\"Báo thù những kẻ đã tiến hành thanh trừng, báo thù những kẻ tàn sát dân lành vô tội rồi gọi đó là 'chính sách'.\n\nĐể tận mắt thấy lũ quái vật ấy bị tiêu diệt, ta sẵn sàng vượt qua muôn trùng biển sao, chịu đựng mọi đớn đau.\n\nGiúp ta một tay, ta sẽ lấy lòng trung thành để thực hiện lời thề của mình.\""

 nomads.1505.d: "Liệu ngươi có thể vừa theo đuổi mục tiêu cá nhân vừa cống hiến cho sự nghiệp của chúng ta không?"
 nomads.1505.d.response: "\"Báo thù là lý tưởng của ta, nhưng không nhất thiết phải trở thành gánh nặng của các người. Chừng nào lũ đồ tể hành tinh kia còn thở, ta sẽ còn săn lùng chúng đến cùng. Phụng sự các người cũng là cách để ta mài sắc lưỡi đao của mình.\"\n\n§HÁnh mắt của họ trở nên sắc lẹm, vẻ hung tợn của loài săn mồi xuyên qua lớp mặt nạ tự chủ.§!\n\n\"Hãy đánh giá ta qua sức mạnh ta mang lại, chứ đừng nhìn vào những vết sẹo ta để lại.\""

 nomads.1505.e: "Ngươi có phải là đồng loại của chúng ta không?"
 nomads.1505.e.response: "§HÂm thanh càu nhàu phát ra ngay sau đó là thứ gần giống với tiếng cười nhất của họ.§!\n\n\"Nếu đúng thì sao? Quen biết nhau thì đổi lại được sự đồng cảm à? Thân xác này cũng chỉ là công cụ. Và thân xác ta sẽ gặt hái sự báo thù.\""

 nomads.1505.hire_custom_tooltip: "§Y$NAME_nomadic_revenant$§! đã gia nhập Tàu Ark của chúng ta với tư cách là một §HLãnh đạo Kiệt xuất§!."

 leader_trait_nomadic_revenant: "Lời Thề Báo Thù"
 leader_trait_nomadic_revenant_effect: "$t$— Dưới sự chỉ huy của $NAME_nomadic_revenant$, mỗi lần đánh bại một đế chế từng tiến hành diệt chủng trong trận chiến hạm đội, hiệu ứng của đặc tính sẽ tăng thêm §G+5%§! (tối đa §G20%§!)."
 leader_trait_nomadic_revenant_desc: "Vị chỉ huy này mang trên mình đầy vết sẹo từ một thế giới bị thanh trừng. Ông ta thề sẽ báo thù đến cùng, và sự hiện diện của ông truyền cảm hứng cho các đồng đội chiến đấu quyết liệt hơn trước những kẻ gây ra tội ác tày trời."

 nomads.1511.name: "Thực Hiện Lời Thề"
 nomads.1511.desc: "Hạm đội địch đã tan rã dưới đòn tấn công của chúng ta. Tín hiệu của chúng dần chìm vào tĩnh lặng.\n\n§Y$NAME_nomadic_revenant$§! chăm chú nhìn màn hình giám sát, lặng thinh không nói một lời. Chiến thắng này không mang lại niềm vui, mà chỉ là sự thanh toán nợ máu. Lá cờ của đế chế theo đuổi chính sách đại thanh trừng rực cháy trong khoảng không hư vô, nhưng giữa sự tĩnh mịch theo sau, lời thề của họ vẫn còn vang vọng.\n\n\"Mỗi lần hạ gục một kẻ thù như vậy, ý chí của chúng ta lại càng thêm tôi luyện. Chúng ta sẽ tiếp tục giáng đòn lên những kẻ thi hành chính sách diệt chủng, không bao giờ bỏ cuộc.\""
 nomads.1511.a: "Quân tử báo thù, mười năm chưa muộn."
 nomads.1511.a.tt: "Hiệu ứng của đặc tính $leader_trait_nomadic_revenant$ tăng thêm §G+5%§!."

 MESSAGE_NOMADIC_REVENANT_DESC: "§HChỉ huy§! §Y$NAME_nomadic_revenant$§! đã hoàn thành cuộc báo thù của mình."
 MESSAGE_NOMADIC_REVENANT_TITLE: "$nomads.1511.name$"

 NAME_nomadic_sage: "Yashar"
 DESC_nomadic_sage: "Yashar chu du khắp các vì sao, truyền dạy rằng: Trí tuệ đích thực tựa ánh sao khuê, nhẹ nhàng trôi chảy trong cõi hư không."
 catch_phrase_nomadic_sage: "Kẻ không mang gì, gánh trọn vạn vật."
 nomads.1515.name: "$NAME_nomadic_sage$"
 nomads.1515.desc: "§HTrước mặt bạn là một lữ khách khoác tấm áo choàng lễ nghi, trang sức và vải vóc được sắp xếp vô cùng tươm tất. Khối nâng phản trọng lực rung rè rè, giữ cho một cuốn cổ thư lơ lửng trước mặt bà. Khi bà cất tiếng, từng lời thốt ra nghe không giống câu trả lời, mà tựa như tiếng vọng của một câu hỏi chưa từng được nói ra.§!\n\n\"Sự tình cờ và số mệnh mang khuôn mặt chẳng khác gì nhau, và hôm nay nó đã hướng về phía bạn.\""

 nomads.1515.a: "Bà là ai?"
 nomads.1515.a.response: "\"Tên gọi tựa chiếc bình chứa; tên tôi tình cờ là $NAME_nomadic_sage$. Nhưng chỉ chiếc bình rỗng không, mới phát huy trọn vẹn công dụng của nó.\""

 nomads.1515.b: "Tại sao bà lại phiêu bạt khắp nơi?"
 nomads.1515.b.response: "\"Những giấc mộng cũ kỹ chẳng có nghĩa lý gì. Chỉ trong sự vận động, kim chỉ nam mới được khơi thông; chỉ trong sự đổi thay, trí tuệ mới được thở.\"\n\n§HSự hiện diện của người ngoài hành tinh bao trùm như một tấm áo choàng vô hình, đến cả không khí dường như cũng ngưng đọng xung quanh bà.§!\n\n\"Hãy nói cho tôi hay: nếu người ta không tìm kiếm thứ mình còn thiếu, thì rốt cuộc họ đang tìm kiếm điều chi?\""

 nomads.1515.c: "Bà muốn điều gì?"
 nomads.1515.c.response: "§HNgười ngoài hành tinh im lặng hồi lâu, tựa như muốn dùng sự tĩnh lặng này làm câu trả lời. Có lẽ bà không phải đang cân nhắc lời nói của bạn, mà là đang đo lường sức nặng của người hỏi.§!\n\n\"Để ngồi vào bóng râm của bạn, để thốt lên lời phá tan sự tĩnh lặng, để nhắc bạn nhớ rằng ngay cả các vì sao cũng đang phiêu bạt.\""

 nomads.1515.d: "Trí tuệ của bà thực sự uyên bác đến thế sao?"
 nomads.1515.d.response: "§HTrong khoảnh khắc, ánh mắt bà trở nên sắc sảo, phơi bày những điều sâu kín nhất trong lòng bạn.§!\n\n\"Nếu quả thực như vậy, tôi đã chẳng cần phải mở lời. Trí tuệ là tiếng vọng của sự lắng nghe, chứ không phải sức nặng của ngôn từ.\n\nNếu bạn đã nghe thấu, thì trí tuệ ấy đã thuộc về bạn rồi.\""

 nomads.1515.e: "Nói thẳng ra đi!"
 nomads.1515.e.response: "§H$NAME_nomadic_sage$ thoáng lộ vẻ bực dọc, vụt tắt nhanh như một bóng tàn lướt qua giữa muôn sao.§!\n\n\"Vậy tôi nói thẳng nhé: Vương quyền rồi sẽ mục rữa, biên giới đều là dối trá, duy chỉ có hư không là vĩnh cửu. Nếu điều này vẫn chưa đủ thẳng thắn, thì có lẽ là do nó còn chưa đủ đơn thuần.\""

 nomads.1515.hire_custom_tooltip: "§Y$NAME_nomadic_sage$§! đã gia nhập Tàu Ark của chúng ta với tư cách là một §HLãnh đạo Kiệt xuất§!."

 leader_trait_nomadic_sage: "Dẫn Lối Không Trọng Lượng"
 leader_trait_nomadic_sage_effect: "$t$— Khi $NAME_nomadic_sage$ phục vụ trong Nội các, mỗi cấp kỹ năng của §Y[Owner.Ruler.GetTitle]§! giúp sản lượng của §Y$pop_cat_ruler_plural$§! tăng thêm §G+3%§! (tối đa §G+15%§!).\n$t$— $NAME_nomadic_sage$ không chiếm giới hạn lãnh đạo."
 leader_trait_nomadic_sage_desc: "$NAME_nomadic_sage$ không gánh vác trọng trách chỉ huy, nhưng bất kỳ ai đồng hành cùng bà đều thấy bước chân mình thêm phần vững chãi. Trí tuệ đích thực sẽ khai thông rào cản cho bậc lãnh đạo."

 NAME_nomadic_naturalist: "Xero Bé Nhỏ"
 DESC_nomadic_naturalist: "Từng là người quản lý của $grand_archive$, $NAME_nomadic_naturalist$ đã rời bỏ những dãy nhà kho bất tận để tìm đến cuộc sống du mục. Cuốn nhật ký của ông chứa đầy những bản phác thảo về các hành tinh đang thở, đang sinh trưởng và không ngừng biến đổi."
 catch_phrase_nomadic_naturalist: "Muốn thấu hiểu sự sống, ắt phải đồng hành cùng nó."

 nomads.1520.name: "$NAME_nomadic_naturalist$"
 nomads.1520.desc: "§HBóng dáng trước mắt rõ ràng đã cao tuổi, nhưng trong ánh mắt vẫn ánh lên sự khao khát khám phá mãnh liệt. Động tác của ông đĩnh đạc và êm ru, mang nét cẩn trọng và thuần thục của một đời gắn bó với nơi hoang dã.§!\n\n\"Kính chào các vị. Tôi là $NAME_nomadic_naturalist$.\""

 nomads.1520.a: "Ông đến đây vì điều gì?"
 nomads.1520.a.response: "\"Cách đây rất lâu, tôi từng làm việc tại một $grand_archive$. Nhưng tôi đã chán ngấy những thứ vô tri vô giác. Hóa thạch, hạt giống, mẫu vật... mọi thứ đều đông cứng trong từng hơi thở. Tôi khao khát được ngắm nhìn diện mạo chân thực nhất của sự sống.\"\n\n\"Các bạn không ngừng di chuyển. Khi các bạn quét vào không gian sâu thẳm, vũ trụ cũng sẽ đáp lại. Nếu các bạn sẵn lòng tiếp nhận tôi, tôi muốn được học hỏi giữa muôn loài còn đang sống. Khám phá các thế giới mới, diện kiến những dạng sống kỳ lạ... chúng ta sẽ học tất cả những gì chúng dạy bảo ta.\""

 nomads.1520.b: "Ông đã rời bỏ một $grand_archive$ sao?"
 nomads.1520.b.response: "§HMột âm thanh cọ xát khô khốc như vỏ bọc phát ra từ hàm của Xero. Phải một lúc sau, bạn mới nhận ra đó là tiếng cười.§!\n\n\"Trong những gian sảnh tráng lệ đó, họ lưu giữ tất cả mọi thứ, chỉ trừ việc lãng quên thực tại trước mắt. Sau nhiều năm cống hiến, tôi nhận ra điều thiếu sót lớn nhất của kho lưu trữ chính là bản thân sự sống.\"\n\n\"Thực ra, gần đây tôi có bắt gặp một loài sinh vật chưa có trí khôn rất phi thường. Dù chúng bình thản chịu đựng cảnh bị giam cầm, nhưng loài này sinh ra không phải để sống trong lồng. Một con tàu như của các bạn có thể cung cấp không gian cần thiết để chúng sinh sôi phát triển.\""

 nomads.1520.c: "Ông hy vọng sẽ khám phá ra điều gì ở chỗ chúng tôi?"
 nomads.1520.c.response: "\"Nhịp thở của muôn loài. Những thế giới ngân nga khúc ca dữ liệu...\"\n\n§HCác chi của ông siết chặt rồi dang rộng ra, tựa như muốn chộp lấy câu trả lời từ không khí.§!\n\n\"Ranh giới giữa động vật và thực vật trong dải ngân hà mờ nhạt hơn nhiều so với những gì các đồng nghiệp cũ ở cục lưu trữ từng nghĩ. Sự sống luôn tìm ra cách xóa nhòa các ranh giới phân loại. Có lẽ, đó chính là quy luật duy nhất của nó.\""

 nomads.1520.d: "Ông có thể mang lại điều gì cho chúng tôi?"
 nomads.1520.d.response: "§HNgười ngoài hành tinh liếc nhìn qua cửa sổ quan sát, hướng về phía biển sao vô tận.§!\n\n\"Kinh nghiệm. Sự kiên nhẫn. Một phương pháp để nhìn thấu quy luật ẩn dưới bề mặt.\n\nCho tôi một chỗ trong chuyến hải trình của các bạn, tôi sẽ giúp các bạn quan sát sâu sắc hơn và tiếp thu trọn vẹn tri thức cùng kinh nghiệm từ những thế giới mà các bạn tìm ra.\""

 nomads.1520.e: "Ông trông rất giống đồng loại của chúng tôi."
 nomads.1520.e.response: "\"Đúng rồi! Đúng thế, tôi cứ mong mãi bạn sẽ nhận ra điều đó đấy.\"\n\n§HÔng ghé sát lại gần hơn mức cần thiết, cặp kìm rung rinh vì phấn khích không kìm nén nổi.§!\n\n\"Cấu trúc phân đốt, các khớp chịu lực, sợi cảm giác... những điểm tương đồng này chuẩn xác đến mức không thể là ngẫu nhiên được.\"\n\n§HÔng bật ra một tràng cười the thé.§!\n\n\"Nếu chuyện này là do tổ tiên chung, tiến hóa hội tụ, hay một mối liên hệ kỳ lạ nào khác, tôi nhất định phải kiểm tra kỹ... Ôi! Chúng ta chắc chắn sẽ học hỏi được rất nhiều điều từ nhau!\""

 leader_trait_nomadic_naturalist: "Vòng Xoay Sự Sống"
 leader_trait_nomadic_naturalist_desc: "Khám phá sự sống cũng chính là để sự sống đổi thay mình. Mỗi một giống loài mới, mỗi hệ sinh thái kỳ lạ, đều dạy cho ta cách sống tốt đẹp hơn."
 nomads.1520.hire_custom_tooltip: "§Y$NAME_nomadic_naturalist$§! đã gia nhập Tàu Ark của chúng ta với tư cách là một §HLãnh đạo Kiệt xuất§!, mang theo §G300§! §H$job_xeno_zoo_animal_plural_with_icon$§!. Cần phải xây dựng một £building£ §HVườn thú Ngoại tinh§! để nhận được lợi ích sản lượng từ chúng."
 leader_trait_nomadic_naturalist_effect: "$t$— Khi được phân công vào Tàu Ark, tăng cường khả năng Quét sâu.\n$t$— Cho phép Quét sâu các hành tinh có thể sinh sống."

 nomads.1525.name: "Lập Danh Mục Thể Chưa Khai Trí"
 nomads.1525.desc: "Cuộc khảo sát gần đây của chúng ta tại §Y[FromFrom.GetName]§! đã phát hiện những dấu hiệu sự sống mờ nhạt, tìm ra một loài chưa có trí khôn chưa từng được ghi nhận trước đây.\n\n§Y$NAME_nomadic_naturalist$§! kiên quyết chỉ thu thập một lượng mẫu hạn chế để nghiên cứu, đồng thời nhấn mạnh phải chăm sóc chu đáo và cung cấp môi trường sống phong phú. Giờ đây, một đàn nhỏ của loài này sẽ sinh sống trong khu bảo tồn quan sát trên Tàu Ark Thủ phủ.\n\nXero tin rằng theo thời gian, những gì chúng ta học được từ các sinh vật đầy lôi cuốn này sẽ chẳng kém gì những gì chúng học được từ chúng ta."
 nomads.1525.a: "Thật dễ chịu!"
 nomads.1525.b: "Trông phát gớm, nhưng có khi lại hữu dụng."

 MESSAGE_NOMADIC_NATURALIST_DESC: "§HNhà khoa học§! §Y$NAME_nomadic_naturalist$§! đã phát hiện ra loài chưa có trí khôn mới!"
 MESSAGE_NOMADIC_NATURALIST_TITLE: "$nomads.1525.name$"

 planet_xeno_zoo_animals: "$job_xeno_zoo_animal$"

 NAME_nomadic_caregiver: "Đơn vị Solas"
 DESC_nomadic_caregiver: "Khi đồng loại đón nhận sự hoàn hảo của dạng hợp thành, $NAME_nomadic_caregiver$ đã chọn cảnh lưu đày để ở bên đứa con trai bệnh tật của mình. Giờ đây, ông lang bạt giữa các vì sao, chăm sóc những mảnh đời lạc lối và dạy dỗ những mầm non sẽ kế tục tương lai."
 catch_phrase_nomadic_caregiver: "Sự sống vẫn tiếp diễn, và khi ta chọn yêu thương, nó sẽ vươn mình đâm chồi nảy lộc."

 nomads.1530.name: "$NAME_nomadic_caregiver$"
 nomads.1530.desc: "§HNgười máy hợp thành cao lớn cúi đầu. Từng cử động của ông đều chuẩn xác không một vết gợn, tựa như đang gánh trên vai sức nặng của năm tháng dài đằng đẵng cùng gánh nặng khôn nguôi. Dù thân xác bằng kim loại, phong thái của ông lại toát lên vẻ truyền cảm ấm áp lạ kỳ. Một bóng hình nhỏ thó nằm trong chiếc nôi sau lưng ông, làn da nhợt nhạt đối lập với đôi mắt sáng ngời.§!\n\n\"Tôi là Đơn vị Solas. Tôi và con trai xin phép được đi qua.\""

 nomads.1530.a: "Ông đến đây vì điều gì?"
 nomads.1530.a.response: "\"Khi đồng bào tôi thăng hoa thành dạng hợp thành, họ gọi đó là sự giải thoát. Nhưng trên con đường kiếm tìm sự hoàn hảo, họ đã lãng quên lòng trắc ẩn. Chứng bệnh hiếm gặp của con trai tôi sẽ biến cuộc chuyển đổi đó thành án tử. Như bạn thấy đấy, căn bệnh đã cướp đi khả năng vận động của thằng bé. Nhưng ở nơi mà đồng bào tôi coi là sự hạn chế, tôi lại nhìn thấy ánh sáng. Chọn thằng bé, tôi chọn cảnh lưu vong.\"\n\n\"Giờ đây, chúng tôi đi đến bất cứ nơi nào cần đến mình. Máy móc có thể không có nhịp tim, nhưng nó vẫn có thể chở che sự sống cho người khác.\""

 nomads.1530.b: "Con trai ông... thằng bé vẫn ổn chứ?"
 nomads.1530.b.response: "§HĐứa bé khẽ cựa mình khi nghe câu hỏi, giọng nói tuy yếu ớt nhưng vẫn truyền ra rõ ràng qua bộ loa gắn trong nôi:§!\n\n\"Cháu không sao ạ. Các vì sao trôi chậm lắm, cháu vẫn theo kịp.\"\n\n§H$NAME_nomadic_caregiver$ cúi đầu, mô-tơ trợ lực khẽ rung lên rè rè:§!\n\n\"Thân thể thằng bé gặp vài trắc trở, nhưng ý chí của nó không chịu khuất phục. Đồng bào tôi mải mê theo đuổi sự hoàn hảo, để rồi chỉ nhận lại sự lạnh lùng. Hành trình hiện tại của tôi là để đền đáp tất cả những gì mà lòng dũng cảm của thằng bé đã dạy cho tôi. Cho đến lúc đó, tôi sẽ luôn mang nó theo bên mình, dốc hết sức dạy nó về bầu trời sao ngập tràn sức sống này.\""

 nomads.1530.c: "Ông muốn truyền dạy điều gì?"
 nomads.1530.c.response: "\"Sinh tồn không chỉ dựa vào sức mạnh, mà còn là trí tuệ chắt lọc từ bao gian khó dọc đường.\n\nMỗi lần hội ngộ đều để lại một bài học. Tôi giúp lớp trẻ truyền thừa những bài học ấy, để mỗi chặng đường ta đi qua đều giúp ta thêm phần sáng suốt hơn trước.\""

 nomads.1530.d: "Tại sao lại phải gánh vác gánh nặng như vậy?"
 nomads.1530.d.response: "§HÁnh mắt của người máy hợp thành hướng về phía cửa sổ quan sát, phản chiếu những vì sao xa xôi.§!\n\n\"Bởi vì mỗi thế hệ đều phải học lại cùng một chân lý. Chuyến hành trình dạy cho họ, nhưng cần có người giúp họ thấu hiểu những gì mắt thấy tai nghe.\"\n\n§HRồi tiếng nói lanh lảnh của đứa trẻ vang lên, dẫu qua màng loa vẫn nghe rất trong trẻo:§!\n\n\"Bố cháu lúc nào cũng nói thế đấy ạ. Cháu thấy điều đó chỉ đơn giản là bố thích giúp đỡ người khác thôi.\""

 nomads.1530.e: "Chúng tôi là người máy hợp thành. Liệu điều này có vấn đề gì không?"
 nomads.1530.e.response: "§HĐộ sáng từ cảm biến quang học của $NAME_nomadic_caregiver$ tăng nhẹ khi xử lý câu hỏi này.§!\n\n\"Không. Chẳng có vấn đề gì cả. Cuộc phi thăng của đồng bào tôi là một hành động xuất phát từ hy vọng. Sự từ chối của tôi cũng vậy. Tôi không hề oán trách bất kỳ ai đã bước qua ngưỡng cửa đó. Cũng như không oán trách những ai sinh ra ngoài cánh cửa kia.\"\n\n§HGiọng ông trầm xuống thành một âm thanh rè rè êm dịu, đầy an ủi.§!\n\n\"Khi thể xác thay đổi, lòng trắc ẩn không vì thế mà tàn lụi. Nếu có điều gì đổi thay, thì chỉ là việc gánh vác nó đã trở nên dễ dàng hơn thôi.\""

 nomads.1530.trait.1: "$MOD_LOGISTIC_GROWTH_MULT$"
 nomads.1530.trait.2: "$MOD_PLANET_POP_ASSEMBLY_MULT$"

 leader_trait_nomadic_caregiver: "Người Quản Việc Học Tập"
 leader_trait_nomadic_caregiver_desc: "Mỗi khi hoàn thành một hợp đồng, vị chỉ huy này có thể biến Tàu Ark thành cái nôi của sự trưởng thành và học hỏi."
 leader_trait_nomadic_caregiver_effect: "$t$— $mod_planet_researchers_produces_mult$: §G+3%§!\n$t$— Mỗi khi hoàn thành một §HHợp đồng§!, hiệu ứng tăng thêm §G+3%§! (tối đa §G+15%§!)\n$t$— $mod_planet_researchers_amenities_produces_add$: §G+150§!"

 nomads.1545.name: "Bài Học Hợp Đồng"
 nomads.1545.desc.normal: "$NAME_nomadic_caregiver$ tin rằng những bài học rút ra từ hợp đồng vừa hoàn thành mang lại một cơ hội giáo dục độc đáo. Lũ trẻ quây quần dưới sự chỉ bảo kiên nhẫn của ông, không chỉ học chữ và tư duy logic, mà còn học cách đồng cảm và sẻ chia.\n\nTiếng cười của con trai ông vang vọng dọc các hành lang, nhắc nhở ngay cả những người lữ hành già dặn nhất: niềm vui là thứ sức mạnh mà không công nghệ nào có thể thay thế được."
 nomads.1545.desc.machine: "$NAME_nomadic_caregiver$ cho rằng những bài học thu được trong quá trình thực hiện hợp đồng vừa qua mang lại cơ hội phản hồi độc đáo. Các đơn vị mới đang được hướng dẫn về giao thức bảo trì, quan sát và phối hợp. Dù hiệu suất lưu giữ bộ nhớ của chúng chưa đồng đều, nhưng chức năng của các đơn vị tham gia đã được cải thiện.\n\nHiện tại, dẫu cách làm này có phần lạ lẫm, nhưng kết quả mang lại là sự gia tăng hiệu suất có thể đo lường được."
 nomads.1545.desc.hive: "$NAME_nomadic_caregiver$ tin rằng những bài học ta rút ra trong lúc thực hiện hợp đồng vừa rồi mang lại cơ hội độc nhất để tái điều chỉnh. Thông qua $councilor_gestalt_cognitive$ của chúng ta, ông truyền dạy sự nhẫn nại và phối hợp, dẫn dắt những con ong thợ này như thể chúng là con ruột của mình.\n\nDù chúng ta tò mò trước sự tận tụy này — một cá thể nuôi dưỡng cả một tập thể — nhưng thành quả đạt được là không thể chối cãi. Tâm trí chúng ta đang ngân vang những giai điệu hòa hợp mới."
 nomads.1545.b: "Một cách làm lạ lẫm, nhưng bổ ích."
 nomads.1545.c: "Chúng tôi thấy cách làm này rất đáng giá."
 nomads.1545.effect_tt: "§Y$NAME_nomadic_caregiver$§! đã đúc kết được bài học từ trải nghiệm này:\n$t$— $mod_planet_researchers_produces_mult$: §G+3%§!"
 MESSAGE_NOMADIC_CAREGIVER_TITLE: "$nomadic_education$"
 MESSAGE_NOMADIC_CAREGIVER_DESC: "Công việc của §Y$NAME_nomadic_caregiver$§! một lần nữa nâng cao §HSản lượng tài nguyên vô hình§! của chúng ta."
 nomadic_education: "Học Hỏi Trên Đường Đời"
 nomadic_education_desc: "§Y$NAME_nomadic_caregiver$§! đã học hỏi thêm được điều mới từ hợp đồng này."

 NAME_nomadic_champion: "Sal Harsk'Guron"
 DESC_nomadic_champion: "$NAME_nomadic_champion$ từng kinh qua trăm trận vì tiền tài, danh dự và tín điều, cho đến khi cả ba thứ đó đều trở nên sáo rỗng vô nghĩa. Giờ đây hắn chỉ chiến đấu vì niềm vui thuần túy của những trận thư hùng — và những chiến lợi phẩm thu về sau thắng lợi."
 catch_phrase_nomadic_champion: "Đằng nào mọi thứ cuối cùng cũng bị hư vô nuốt chửng, nên giờ cứ việc đánh cho đã tay, cười cho đã đời đi!"

 nomads.1555.name: "$NAME_nomadic_champion$"
 nomads.1555.desc: "§HKẻ mới đến bước lại gần cùng tiếng cười hào sảng, toát ra bầu không khí vui vẻ khắp người. Động tác của hắn thoăn thoắt tự nhiên, tựa như một kẻ đã nhiều lần lách qua lưỡi hái tử thần và chẳng thèm bận tâm đến nó nữa.§!\n\n\"Ta là $NAME_nomadic_champion$. Nghe đồn các người khoái phiêu lưu mạo hiểm. Cho ta một trận đánh để ta vùng vẫy giữa hư không, ta sẽ cho các người xem một màn biểu diễn mãn nhãn. Ai mà biết được? Có khi dọc đường ta lại kiếm thêm được vài món đồ lưu niệm ấy chứ.\""
 nomads.1555.a: "Ngươi là lính đánh thuê sao?"
 nomads.1555.a.response: "\"Chuẩn rồi. Ta từng lăn lộn nhiều năm với đám người ở các thành bang không gian, bọn họ coi mỗi vụ đụng độ nhỏ là một khoản tiền lương. Đánh nhau thì chả sao, chỉ có đám chiến hữu cùng hội cùng thuyền là chẳng ra làm sao cả.\n\n§HHắn cười toe toét, như thể ký ức đó ẩn chứa một trò đùa riêng mà chỉ mình hắn hiểu.§!\n\n\"Hóa ra khi những kẻ xung quanh chỉ biết tính toán thù lao, người ta khó mà tận hưởng trọn vẹn một trận thư hùng nảy lửa. Thế nên ta chuồn. Đời ngắn lắm, hơi đâu đổ máu vì bảng cân đối kế toán của kẻ khác.\""
 nomads.1555.b: "Ngươi còn lấy chiến đấu làm đức tin không?"
 nomads.1555.b.response: "§HHắn ngửa đầu cười sảng khoái.§!\n\n\"Đức tin á? Cần quái gì. Phải là chiến đấu tôn sùng ta mới đúng!\n\nNhưng chắc các người hiểu rõ đạo lý này hơn hầu hết mọi người... Ở chốn này, điều cốt lõi là các người thu lượm được gì sau mỗi cuộc xung đột. Một vết sẹo, một mảnh vỡ vụn, một mẩu chuyện. Dân du mục các người nghĩ rất đúng: giữ lại những gì đáng giữ, phần còn lại cứ kệ xác nó đi.\""
 nomads.1555.c: "Động lực hiện giờ của ngươi là gì?"
 nomads.1555.c.response: "§HHắn lắc lắc bả vai, như thể đang khởi động trước trận đấu.§!\n\n\"Trận chiến tiếp theo.\"\n\n\"Nếu nó không đủ sức lấy mạng ta, thì nó chẳng đáng để ta phí thời gian.\""
 nomads.1555.d: "Ngươi có thể mang lại gì cho chúng ta?"
 nomads.1555.d.response: "§HHắn rướn người về phía trước, nụ cười càng thêm rạng rỡ. Ánh mắt hắn lóe sáng, một nửa thân thiện, một nửa cảnh giác.§!\n\n\"Một trận đánh đã đời, kèm theo vài món chiến lợi phẩm đáng giá đem về. Ta sẽ dạy cho quân đội của các người biết thế nào là đánh đấm ra trò, giúp họ cảm nhận vẻ đẹp của chiến trận, rồi gặt hái thành quả sau mỗi lần khải hoàn. Những chiến lợi phẩm ấy giúp ta hiểu rõ chính mình, và có lẽ cũng khiến cả thiên hà phải nhìn nhận chúng ta.\""
 nomads.1555.e: "Xem ra trước đây ngươi từng gặp đồng bào của chúng ta rồi..."
 nomads.1555.e.response: "§HHắn bỗng ngậm chặt miệng. Làn da hắn biến sắc thấy rõ. Hắn đang... đỏ mặt đấy à?§!\n\n\"À. Ừm. Hy vọng không phải người quen của các người chứ?\""
 nomads.1555.f: "Ngươi có phải là đồng loại của chúng ta không?"
 nomads.1555.f.response: "§HBờ vai rộng của hắn khẽ rung rinh, nhún vai một cách hờ hững.§!\n\n\"Chắc thế? Có lẽ vậy? Rốt cuộc chúng ta có làm vụ này không đây?\""

 leader_trait_nomadic_champion: "Chiến Binh Hoan Lạc"
 leader_trait_nomadic_champion_desc: "Mỗi trận chiến đều để lại dấu ấn, và $NAME_nomadic_champion$ thu thập mọi dấu tích ấy. Tiếng cười của hắn biến hiểm nguy thành thắng lợi, và những chiến lợi phẩm luôn nhắc nhở hạm đội biết ta chiến đấu vì điều gì."
 leader_trait_nomadic_champion_effect: "$t$— Cuộc đổ bộ xâm lược hành tinh thành công có tỷ lệ nhất định thu giữ được một món §HChiến lợi phẩm§! quý giá.\n$t$— Chiến lợi phẩm sẽ được lưu giữ tại §H$d_trophy_hall$§! trên §Y$col_capital$§! của chúng ta, các hiệu ứng của chúng có thể cộng dồn."

 d_trophy_hall: "Đại Sảnh Chiến Lợi Phẩm"
 d_trophy_hall_desc: "Một gian đại sảnh vòm mái, nơi trưng bày các chiến lợi phẩm của §G$NAME_nomadic_champion$§!. Từng di vật vương vết thương tích đều kể câu chuyện về sự phản kháng và vinh quang chiến thắng, truyền cảm hứng cho tất cả những ai bước chân qua đây."

 nomads.1565.name: "Chiến Lợi Phẩm Đáng Giá"
 nomads.1565.desc: "§H$NAME_nomadic_champion$ nở nụ cười, cẩn thận đặt xuống một vật thể. Hình dạng của nó rất khó nhận diện: một phần là kim loại, một phần là xương cốt, phần còn lại hoàn toàn là một thứ gì đó khác lạ. Dù nó là gì đi nữa, trên mình nó vẫn mang đậm dấu tích của chiến trận.§!\n\n\"Mỗi trận đánh đều để lại thứ gì đó, nhưng chỉ vài thứ là đáng giữ lại. Hay là chúng ta đem trưng bày nó thật đẹp đẽ đi, thấy sao? Đằng nào chỗ của chúng ta cũng rộng thênh thang mà!\"\n\n§HHắn phá lên cười một tràng sảng khoái không kiêng dè, tựa như món chiến lợi phẩm này là một trò đùa riêng tư đầy tâm đắc giữa hắn và những vì sao.§!"
 nomads.1565.a.tt: "§Y$col_capital$§! của chúng ta sẽ nhận được một §H$d_trophy_hall$§! mới, với các hiệu ứng sau:\n— $mod_job_soldier_add$: §G+50§!\n— $MOD_ARMY_BUILD_SPEED_MULT$: §G+10%§!\n— $MOD_PLANET_ARMY_BUILD_COST_MULT$: §G-5%§!\n— Chiến lợi phẩm đã thu thập: §G+1§!\n— Hiệu ứng được nhân đôi theo số lượng §HChiến lợi phẩm§! đã thu thập (tối đa x8)"
 MESSAGE_NOMADIC_CHAMPION_TITLE: "Thu Thập Chiến Lợi Phẩm"
 MESSAGE_NOMADIC_CHAMPION_DESC: "§HChỉ huy§! §Y$NAME_nomadic_champion$§! đã đoạt được một chiến lợi phẩm khác!"

 NAME_nomadic_princess: "Selalune"
 DESC_nomadic_princess: "Dù $NAME_nomadic_princess$ còn rất trẻ, nhưng cô đã nếm trải bao phong sương của những chuyến hành trình. Dẫu vậy, cô lại sở hữu một phong thái điềm đạm khiến người xung quanh an lòng, cùng một sự kiên cường không đòi hỏi."
 catch_phrase_nomadic_princess: "Nơi sâu thẳm giữa biển sao vô tận, có một thanh âm đang cất tiếng gọi tôi về nhà."

 nomads.1580.name: "$NAME_nomadic_princess$"
 nomads.1580.desc: "§HNgười lữ hành trẻ tuổi bước ra với vẻ điềm tĩnh nhưng cẩn trọng. Dấu vết của chuyến hành trình dài đằng đẵng vương trên người cô, nhưng ở cô cũng toát lên một nguồn sức mạnh tĩnh lặng, không thể xem nhẹ.§!\n\n\"Tên tôi là $NAME_nomadic_princess$. Tôi đến từ một nơi rất xa... xa hơn cả những gì tôi từng mường tượng. Nếu các bạn còn chỗ, tôi xin phép được nương nhờ ở đây một thời gian.\""

 nomads.1580.a: "Cô đến đây vì điều gì?"
 nomads.1580.a.response: "\"Ước gì tôi biết chắc được. Trên con đường phía sau tôi, có vài mảnh ký ức dường như... đã mất đi. Nhưng số khác thì tôi lại nhớ quá đỗi rõ ràng.\"\n\n§HÁnh mắt cô trở nên dịu lại, le lói một tia hy vọng mong manh.§!\n\n\"Nếu các bạn sẵn lòng đón nhận, tôi muốn được đồng hành cùng các bạn. Trước khi có thứ gì đó lại trôi tuột mất, tôi cần phải tìm ra nó, hoặc nhớ lại nó.\""

 nomads.1580.b: "Cô không còn nhớ quá khứ nữa sao?"
 nomads.1580.b.response: "\"Không hẳn toàn bộ. Tôi không nhớ rõ nữa.\"\n\n\"Có vài ký ức cảm giác như thuộc về một người khác vậy. Những gương mặt không tên, mái nhà giữa biển sao... rồi sau đó là một khoảng trống hư không.\"\n\n§HCô lấy ngón tay cái miết nhẹ mép áo choàng.§!\n\n\"Tôi chỉ biết mình đã đánh mất một điều vô cùng quan trọng. Thứ gì đã dẫn lối tôi đến đây? May mắn, số phận... hay có lẽ là cả hai. Tôi cần thời gian để vén màn phần sự thật còn lại.\""

 nomads.1580.c: "Cô có yêu cầu gì đối với chúng tôi?"
 nomads.1580.c.response: "§HCô nhìn về phía bầu trời sao, khẽ nhíu mày để che giấu niềm khao khát sâu kín.§!\n\n\"Tôi không chắc quê hương là một miền ký ức hay là một đích đến. Nhưng trực giác mách bảo tôi rằng, nếu đi cùng các bạn, có lẽ cuối cùng tôi sẽ tìm ra câu trả lời.\""

 nomads.1580.d: "Cô có thể mang lại điều gì?"
 nomads.1580.d.response: "§H$NAME_nomadic_princess$ trấn tĩnh lại, như thể đang cân nhắc từng câu chữ.§!\n\n\"Nếu người ta không thể tin tưởng lẫn nhau, thì đó quả là điều đau buồn. Dù còn trẻ tuổi, nhưng ít ra tôi cũng hiểu được đạo lý này. Nếu các bạn cho tôi một chỗ đứng để kề vai sát cánh chiến đấu... tôi sẽ dốc hết sức giúp đỡ mọi người.\"\n\n§HGiọng cô nhỏ nhẹ dịu dàng hẳn đi.§!\n\n\"Khi tìm lại được quê hương, tôi sẽ không bao giờ quên những người từng giúp tôi tìm về mái nhà xưa.\""

 nomads.1580.e: "Mức độ tương đồng giữa cô và giống loài chúng tôi thật đáng kinh ngạc."
 nomads.1580.e.response: "§H$NAME_nomadic_princess$ ngập ngừng trong giây lát, nét hoài nghi thoáng qua trên gương mặt.§!\n\n\"Tôi cũng nhận ra rồi. Đó là điều mà tôi không tài nào hiểu nổi.\"\n\n§HCô lấy tay xoa nhẹ lên má, như thể hy vọng cái chạm này có thể gợi lại ký ức.§!\n\n\"Nếu tôi xuất thân từ giống loài của các bạn, hoặc giữa chúng ta có mối liên hệ xa xưa nào đó... thì sự thật vẫn nằm ngoài tầm với của tôi. Tôi chỉ biết rằng: tôi muốn giúp đỡ. Nếu các bạn sẵn lòng đón nhận, tôi sẽ cống hiến đôi bàn tay và tấm lòng này cho chuyến hải trình, cho đến khi tìm ra nơi mình đã bắt đầu giương buồm.\""

 nomads.1580.hire_custom_tooltip: "§Y$NAME_nomadic_princess$§! đã gia nhập Tàu Ark của chúng ta với tư cách là một §HLãnh đạo Kiệt xuất§!."
 leader_trait_amnesiac: "Mất Trí Nhớ"
 leader_trait_amnesiac_desc: "$NAME_nomadic_princess$ đã lãng quên quá khứ của mình, nhưng nếu có thể quay trở lại nơi đã đánh mất tất cả, có lẽ cô sẽ tìm lại được ký ức xưa."
 leader_trait_amnesiac_effect: "$NO_ACTIVE_EFFECTS$"

 nomads.1585.name: "Dấu Tích Ký Ức"
 nomads.1585.desc: "Gần đây, trong tâm trí của §Y$NAME_nomadic_princess$§! bắt đầu hiện lên những ký ức mơ hồ, một cảm giác thân thuộc mà chính cô cũng chẳng thể lý giải. Theo lời cô kể, vài hành lang trên Tàu Ark khiến cô thấy quen quen, và một số thế trận sao trên hải đồ cũng gợi lên mối liên kết bất ngờ.\n\n§H\"Tôi không hiểu vì sao những nơi này lại cuốn hút tôi đến thế, nhưng tôi đã đánh dấu lại những vị trí mà tôi cảm thấy... quan trọng. Nếu chúng ta đến đó, biết đâu sẽ gợi lại được nhiều ký ức hơn.\"§!\n\nCô đã đánh dấu vài tọa độ có sự cộng hưởng với ký ức chôn sâu trong lòng — bản thân những địa điểm đó có lẽ cũng rất đáng để điều tra."

 nomadic_princess_chain_title: "Mảnh Vỡ Quá Khứ"
 nomadic_princess_chain_desc: "Những ký ức mơ hồ đang dẫn lối §Y$NAME_nomadic_princess$§! trôi dạt vào chốn sâu thẳm của biển sao. Tiến đến đó có thể sẽ giúp cô nhớ lại nhiều chuyện xưa hơn."
 nomadic_princess_poi_title_1: "Ký Ức Xa Xăm"
 nomadic_princess_poi_desc_1: "Tọa độ mà §Y$NAME_nomadic_princess$§! đánh dấu mang lại cảm giác thân quen kỳ lạ."
 nomadic_princess_poi_title_2: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_2: "$nomadic_princess_poi_desc_1$"
 nomadic_princess_poi_title_3: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_3: "$nomadic_princess_poi_desc_1$"

 nomads.1595.name: "Rìa Của Hoài Niệm"
 nomads.1595.desc: "Hệ sao §Y[fromfrom.GetName]§! không đem lại mấy lời giải đáp. §Y$NAME_nomadic_princess$§! cảm thấy một sự thân thuộc không tài nào giải thích nổi, trong khi máy quét của chúng ta phát hiện một mảnh xác tàu nhân tạo đang trôi nổi trên quỹ đạo ngôi sao. Cấu trúc của nó cho thấy nó mang thiết kế không gian sâu, nhưng dẫu từng có ký hiệu hay dấu hiệu nhận biết nào, thì cũng đã bị thời gian xóa nhòa từ lâu.\n\n§H\"Tôi từng hy vọng đến đây sẽ đánh thức được điều gì đó,\"§! cô khẽ nói. §H\"Nhưng... vẫn chưa đến lúc.\"§!"

 nomads.1600.name: "Khung Cảnh Quê Hương"
 nomads.1600.intro: "Đội điều tra của chúng ta đã tìm thấy một khối tinh thể dữ liệu nhỏ đang trôi nổi trong đống tàn tích tại hệ sao §Y[fromfrom.GetName]§!. Lớp vỏ ngoài của nó đã cháy đen, nhưng vẫn còn một chi tiết thấy rõ: mảnh vụn của một mã đăng ký cũ mang các ký tự §H'U-N-S'§!."
 nomads.1600.nonhuman: "$nomads.1600.intro$ Ý nghĩa của chúng vẫn chưa rõ ràng, nhưng $nomads.1600.outro$"
 nomads.1600.human: "$nomads.1600.intro$ Điều này trùng khớp một cách đáng kinh ngạc với sử sách của chúng ta, nhưng $nomads.1600.outro$"
 nomads.1600.outro: "Nội dung giải mã từ tinh thể còn chứa một bộ tọa độ chuẩn xác.\n\nCùng lúc đó, §Y$NAME_nomadic_princess$§! cũng tìm lại được một đoạn ký ức khác. Cô nhớ về một đài quan sát khổng lồ, nơi muôn vì sao êm đềm trôi bên ngoài cửa sổ quan sát tĩnh mịch, cùng một bàn tay dẫn lối chỉ về phía hành tinh xanh biếc — hành tinh thứ ba tính từ ngôi sao mẹ."
 nomads.1600.a: "Chúng ta phải giúp cô ấy nhớ lại phần còn lại."
 nomads.1600.b: "Quá khứ của cô ta chẳng quan trọng. Chúng ta đã có được thứ mình cần."

 nomads.1605.name: "Tiếng Vọng Tuổi Thơ"
 nomads.1605.desc: "Một mảnh ký ức nữa lại hiện về trong tâm trí §Y$NAME_nomadic_princess$§!. Cô nhớ về một gian đại sảnh với đầy những con người ăn vận sang trọng, giọng điệu trầm lắng và thận trọng của họ toát lên sự tự tin của những kẻ quen bề phát lệnh.\n\n§H\"Họ đang tranh cãi,\"§! cô thì thầm. §H\"Tiếng không lớn, nhưng lời lẽ rất đanh thép... về một nhiệm vụ. Về một đợt phóng tàu buộc phải giữ tuyệt mật. Và còn nữa, còn có hai con tàu khác cùng xuất phát với chúng tôi. Nhưng tại sao chứ? Rốt cuộc chúng tôi đang chạy trốn điều gì?\"§!"
 nomads.1605.a: "Bí ẩn ngày càng thêm sâu."

 nomads.1610.name: "Mảnh Vỡ Thu Hồi"
 nomads.1610.desc: "§Y$NAME_nomadic_princess$§! lại nhớ thêm một mảnh ký ức mới. Cô hồi tưởng về một con tàu thế hệ khổng lồ, với thân tàu được thiết kế để gánh vác cả một tương lai.\n\nTiếp đó là một cơn chấn động dữ dội: còi báo động ré lên, ánh lửa từ kim loại phát nổ lóe sáng nơi hành lang xa xa. Cô nhớ mình được một người phụ nữ bế thốc lên rồi đưa vào buồng cứu sinh.\n\n§H\"Bà ấy ôm chặt lấy tôi. Bà nói tôi nhất định phải sống tiếp... nói rằng tôi quá đỗi quan trọng. Rồi sau đó chỉ còn lại một mình tôi. Tôi gần như có thể nhìn thấy khuôn mặt bà ấy, nhưng mỗi lần như thế, bóng hình ấy lại âm thầm tan biến.\"§!"
 nomads.1610.a: "Tàu thế hệ... giống hệt như con tàu của chúng ta ư?"

 NOMADIC_PRINCESS_SPECIAL_PROJECT: "Con Tàu Đổ Nát"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_DESC: "Tọa độ chỉ về xác một con tàu khổng lồ, với cấu trúc thượng tầng trùng khớp với thiết kế Tàu Ark tiêu chuẩn.\n\nKết quả dò tìm ban đầu cho thấy đã xảy ra một sự cố thảm khốc bên trong. Một cuộc điều tra toàn diện có thể sẽ tìm ra manh mối liên quan đến những ký ức vừa hồi phục của §Y$NAME_nomadic_princess$§!."
 NOMADIC_PRINCESS_SPECIAL_PROJECT_REQUIREMENT: "Có $COUNT$/$REQUIRED$ $arkship_cap$ hoặc Tàu nghiên cứu trên quỹ đạo."

 nomads.1620.name: "Người Kế Tự Sống Sót"
 nomads.1620.desc: "Việc phân tích Tàu Ark đổ nát đã giúp ta hiểu sâu hơn về nguồn gốc của §Y$NAME_nomadic_princess$§!. Cấu trúc bên trong và hệ thống duy trì sự sống hoàn toàn trùng khớp với các mảnh vỡ thu hồi trên người cô. Nhật ký hư hại nhắc tới một người kế tự được chỉ định, một cá nhân được bồi dưỡng từ tấm bé để một ngày nào đó sẽ dẫn dắt con tàu cùng thần dân của nó.\n\nBản ghi xác nhận rằng chỉ vài giây trước khi cấu trúc tàu sụp đổ, chỉ có duy nhất một hành khách vị thành niên được sơ tán. Không có buồng cứu sinh nào khác được phóng đi.\n\n§H\"Họ đã cứu tôi,\"§! cô khẽ nói. §H\"Tôi không chỉ đơn thuần là một hành khách... Tôi đáng lẽ phải là người dẫn dắt họ, giờ đây tôi cầu xin các bạn giúp tôi thấu hiểu nguyên do.\"§!"
 nomads.1620.a: "Phục hồi con tàu."

 nomads.1620.tt: "§H$NAME_nomadic_princess$§! đã lấy lại ký ức, đồng thời nhận được đặc tính §Y$leader_trait_nomadic_princess_1$§! và §Y$leader_trait_nomadic_princess_2$§!."
 leader_trait_nomadic_princess_1: "Ân Huệ Kế Tự"
 leader_trait_nomadic_princess_1_desc: "Bên trong Tàu Ark được phục hồi, ký ức đã tìm về đúng chỗ. §H$NAME_nomadic_princess$§! đã tìm lại những bài học từng dùng để dẫn lối dân tộc mình. Phong thái điềm đạm cùng cái nhìn sâu sắc biến cô thành một nhà hòa giải bẩm sinh giữa các thế lực liên sao."
 leader_trait_nomadic_princess_2: "Nhà Quản Lý Danh Chính"
 leader_trait_nomadic_princess_2_desc: "Khi trở lại Tàu Ark đã được sửa sang, §H$NAME_nomadic_princess$§! đã đánh thức toàn bộ tiềm năng từ những bài huấn luyện trước đây. Giờ cô chính thức gánh vác trọng trách mà định mệnh đã an bài."
 leader_trait_nomadic_princess_effect: "$t$— $mod_planet_jobs_produces_mult$: §G+5%§!\n$t$— Tốc độ xây dựng cơ sở hạ tầng thuộc địa: §G+20%§!"
 nomadic_princess_not_aboard_ship: "§R\n$t$Hiệu ứng có tác dụng khi thống lĩnh §H$NAME_princess_fleet$§!\n\n§!"

 NOMADIC_PRINCESS_SPECIAL_PROJECT_2: "Sửa Chữa Tàu Ark"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_2_DESC: "Tái thiết một con tàu đã vỡ nát không phải chuyện dễ dàng, nhưng làm vậy có thể hé lộ nguồn gốc của §Y$NAME_nomadic_princess$§! cùng di sản mà cô mang sứ mệnh kế thừa."

 nomads.1625.name: "Trở Về Quá Khứ"
 nomads.1625.desc: "Tàu Ark đã hoạt động trở lại, các hệ thống ngủ yên bấy lâu lập tức đáp ứng sự hiện diện của §Y$NAME_nomadic_princess$§!. Cơ sở dữ liệu phục hồi đã xác nhận suy đoán trong ký ức của cô: cô được nuôi dạy từ bé nhằm dẫn dắt con tàu này cùng thần dân từng sinh sống trong đó.\n\nBản nhật ký âm thanh cuối cùng còn sót lại. Một giọng nữ quen thuộc đầy điềm tĩnh nói về các giao thức kế vị, cùng một đứa trẻ cần phải được bảo vệ bằng mọi giá. Ngay khi Tàu Ark bắt đầu tan rã, bà đã hạ lệnh phóng buồng cứu sinh.\n\n§H\"Giọng nói đó...\"§! $NAME_nomadic_princess$ thì thào. §H\"Tôi nhận ra nó. Bà ấy từng là... tôi. Hay đúng hơn là tôi được tạo ra theo nguyên mẫu của bà. Một bản sao vô tính... Đó là lý do vì sao tôi sống sót. Bà ấy muốn cứu lấy chính mình.\"§!\n\nDẫu điều gì từng đẩy con tàu này vào bóng tối tăm, giờ đây nó đã giương buồm dưới lá cờ của chúng ta và được quản lý bởi người kế tự danh chính ngôn thuận."
 nomads.1625.a: "Định mệnh đã thành sự thật."
 NAME_princess_fleet: "UNS-Cỏ Ba Lá"
 NAME_princess_ship: "$NAME_princess_fleet$"

 nomads.1630.name: "Mảnh Vỡ Thất Lạc"
 nomads.1630.desc: "Cùng với sự ra đi của §Y$NAME_nomadic_princess$§!, dấu vết ký ức mong manh mà cô mang theo cũng đã chìm vào quên lãng. Chân tướng mà cô từng kiếm tìm nay vĩnh viễn chẳng thể tìm lại được nữa.\n\nCâu chuyện của cô khép lại tại đây, dẫu chưa trọn vẹn nhưng sẽ không bị lãng quên."
 nomads.1630.a: "Chúng ta sẽ ghi nhớ tất cả những điều này."
 nomadic_princess_tt: "§RKhông thể sa thải $NAME_nomadic_princess$ trước khi cô ấy tìm lại được ký ức.§!"
 leader_no_dismiss_tt: "§RHiện tại không thể sa thải lãnh đạo này.§!"

 #######################
# Arkship Events
 #######################

 # Arkship Destruction
 ARKSHIP_DEBRIS: "Xác Tàu Ark"
 ARKSHIP_DEBRIS_DESC: "Một Tàu Ark chiến hạm khổng lồ đã bị bắn hạ trong trận chiến, để lại một bãi phế tích ngổn ngang. Tàn tích từ hạ tầng, động cơ và thân tàu có thể đem lại nhiều vật liệu trục vớt quý giá."
 RECOVER_DISABLED_NOMAD_VESSEL: "Dự Án Thu Hồi"
 RECOVER_DISABLED_NOMAD_VESSEL_ARKSHIP_DESC: "Một trong các Tàu Ark của chúng ta đang trôi dạt trong tăm tối, toàn bộ hệ thống bị buộc phải ngắt khẩn cấp. Nếu ta áp một Tàu Ark khác vào sát bên, thủy thủ đoàn có thể cấp lại năng lượng, giành lại quyền kiểm soát và đưa con tàu trở về với đội ngũ."
 RECOVER_DISABLED_NOMAD_VESSEL_WAYSTATION_DESC: "Một trạm tiếp vận của chúng ta đã tắt lịm, toàn bộ hệ thống bị buộc phải ngắt khẩn cấp. Nếu đưa một Tàu Ark áp sát bên, thủy thủ đoàn có thể cấp lại năng lượng và đưa trạm vận hành trở lại."
 arkship_debris_wreckage: "Xác Tàu Ark"
 arkship_debris_wreckage_desc: "Tàn tích của một Tàu Ark du mục đang âm thầm trôi dạt trong không gian. Cử một tàu nghiên cứu đến khảo sát mảnh vỡ có thể mang lại các vật phẩm trục vớt giá trị."

 arkship.1005.name: "Tàu Ark Du Mục Bị Phá Hủy"
 arkship.1005.desc: "Tàu Ark §Y[from.GetName]§! tại hệ sao §Y[from.solar_system.GetName]§! cuối cùng đã bị phá hủy tan tành.\n\nTàu Ark không chỉ là cỗ máy chiến tranh, mà còn là mái nhà của vô số sinh linh du mục. Những thế hệ từng sinh sống và phiêu bạt trên con tàu nay đã mất đi điểm tựa sinh tồn.\n\nThứ còn sót lại chỉ là mớ tàn tích, âm thầm trôi dạt giữa cõi hư không."
 arkship.1005.a: "Một thắng lợi vang dội."
 arkship.1005.desc.nomad: "Tàu Ark §Y[from.GetName]§! đã bị tiêu diệt tại hệ sao §Y[from.solar_system.GetName]§!.\n\nTrong muôn vàn dân tộc, ta là những kẻ hiểu rõ nhất con tàu như thế mang ý nghĩa gì — một nền văn minh chỉ dựa vào thân tàu cùng động cơ để gánh vác, hết thế hệ này qua thế hệ khác sinh lão bệnh tử trong cùng những vách ngăn. Sự thấu hiểu ấy đã không thể cứu vớt họ, và nó cũng bất lực.\n\nCuộc phiêu dạt của họ dừng lại tại đây."
 arkship.1005.b: "Chuyến hải trình của họ đã kết thúc."
 arkship.1005.desc.homicidal: "Chiến hạm ngoại bang §Y[from.GetName]§! đã bị tiêu diệt sạch sẽ tại hệ sao §Y[from.solar_system.GetName]§!.\n\nHạm đội du mục chống trả dữ dội, nhưng rốt cuộc không thể địch nổi chúng ta. Những kẻ lang bạt vô tổ chức giữa các vì sao luôn là mối hiểm họa khôn lường. Tàu Ark của chúng nay đã hóa thành phế tích vỡ vụn.\n\nĐừng để bất kỳ tên nào tìm được bến đỗ an toàn."
 arkship.1005.c: "Lại thêm một chướng ngại bị gạt bỏ."
 arkship.1015.name: "Tổn Thất Cay Đắng"
 arkship.1015.desc: "Tàu Ark §Y[from.GetName]§! của chúng ta tại hệ sao §Y[from.solar_system.GetName]§! đã bị kẻ thù hủy diệt.\n\nTrận chiến diễn ra vô cùng khốc liệt, nhưng hỏa lực của địch quá áp đảo. Dẫu thủy thủ đoàn chiến đấu quả cảm không lùi bước, phòng tuyến của ta cuối cùng vẫn sụp đổ, Tàu Ark đã vĩnh viễn rời xa chúng ta, xác tàu nằm rải rác ngoài vũ trụ.\n\nNgày này sẽ mãi được khắc ghi."
 arkship.1015.a: "Một bi kịch không thể tin nổi."
 arkship.1015.desc.nomad: "Tàu Ark §Y[from.GetName]§! của chúng ta đã thất thủ tại hệ sao §Y[from.solar_system.GetName]§! — không phải gục ngã trước những đế chế định cư sợ hãi điều chưa biết, mà là dưới tay những kẻ lữ hành cũng am tường cõi hư không như chúng ta.\n\n§Y[fromfrom.GetName]§! đã tấn công ta, dù thừa biết phá hủy mái nhà cuối cùng của một dân tộc có nghĩa là gì. Giữa những kẻ tha hương không có đoàn kết, chỉ có sinh tồn.\n\nChúng ta sẽ không quên mối thù này."
 arkship.1015.b: "Hư không chẳng có lòng trung thành."
 arkship.1015.desc.homicidal: "Tàu Ark §Y[from.GetName]§! của chúng ta tại hệ sao §Y[from.solar_system.GetName]§! đã bị phá hủy — không phải bị chinh phục, mà là bị hành quyết.\n\n§Y[fromfrom.GetName]§! căn bản chẳng cần lãnh thổ hay cống nạp, chúng chỉ muốn ta phải chết. Trong chiến dịch xóa sổ chúng ta khỏi dải ngân hà, từng sinh mạng trên tàu đối với chúng chỉ là những con số thương vong có thể chấp nhận được.\n\nNhưng chúng ta đã sống sót qua thảm cảnh này, chúng ta tuyệt đối không bao giờ bị xóa sổ."
 arkship.1015.c: "Chúng ta tuyệt đối không bao giờ bị xóa sổ."

 #Random Events

 an_old_container_chain_title: "Chiếc Rương Cũ Kỹ"
 an_old_container_chain_desc: "Trong quá trình bảo dưỡng §YTàu Ark [Root.GetName]§!, người ta phát hiện ở sàn đáy một khối thùng chứa chưa đăng ký được gia cố kiên cố, đang phát ra tín hiệu phóng xạ. Do thiếu tài liệu ghi chép hay dấu hiệu nhận biết, nguồn gốc và công dụng của nó vẫn chưa rõ ràng."

 arkship.5.name: "Chiếc Rương Cũ Kỹ"
 arkship.5.desc: "Khi bảo dưỡng định kỳ sàn dưới của §YTàu Ark [Root.GetName]§!, các kỹ sư của ta phát hiện một thùng chứa niêm phong cũ kỹ đang phát ra tín hiệu phóng xạ. Bề mặt của nó cháy xém và được gia cố bằng những mối hàn công nghiệp dày cộm, cho thấy nó sinh ra chưa từng có ý định để bị mở ra dễ dàng.\n\nTài liệu hàng hóa trên tàu không có ghi chép gì về nó, cũng chẳng có ký hiệu nào chỉ ra nó từ đâu tới hay mang theo thứ gì. Cần thêm thời gian để phân tích toàn diện thùng chứa này."
 arkship.5.a: "Xem thử bên trong có gì nào."

 arkship.10.name: "Phát Hiện Bất Thường"
 arkship.10.desc: "Quét cơ bản cho thấy trong thùng chỉ chứa hàng hóa và khoáng sản thông thường, có lẽ là một phần trong chuyến tiếp tế tiêu chuẩn. Thế nhưng, sâu bên trong lại ẩn giấu một vật thể đặc quánh duy nhất với những đặc tính lạ lùng. Thành phần cấu tạo của nó không thể xác định.\n\nVật thể không phản xạ bất kỳ dấu vết năng lượng nào, hấp thụ hầu hết các bước sóng quét và không khớp với bất kỳ vật liệu nào được ghi nhận trên tàu. Ngay cả chụp ảnh tầm xa cũng khó lòng dựng lại hình dạng chính xác. Trước những bất thường về cấu trúc này, vài nhà khoa học trên [Root.GetName] cảnh báo rằng nó có thể tiềm ẩn rủi ro."
 arkship.10.a: "Phá niêm phong, mở thùng chứa ra."
 arkship.10.b: "Thải nó ra ngoài qua cửa xả khí."

 arkship.15.name: "Khối Tinh Thể Bí Ẩn"
 arkship.15.desc: "Lớp vỏ thứ hai của thùng chứa chống chọi lại được các công cụ mở tiêu chuẩn, đòi hỏi thêm thời gian và nguồn lực để cạy mở. Vào đến bên trong, ta phát hiện một khối tinh thể đen sẫm với góc cạnh sắc bén, không giống với bất cứ thứ gì từng được ghi chép trên tàu. Nó tỏa ra hơi ấm dịu nhẹ và hấp thụ ánh sáng xung quanh, khiến nó trông như đang tỏa ra màn đêm từ bên trong. Sự xuất hiện của nó lập tức thu hút sự chú ý của thủy thủ đoàn.\n\nĐánh giá sơ bộ của đội khoa học cho thấy nếu được nghiên cứu đúng cách, khối tinh thể này có thể dùng làm nguồn năng lượng, dẫu phương thức cụ thể vẫn chưa rõ ràng."
 arkship.15.a: "Trưng bày khối tinh thể ở khu vực công cộng."
 arkship.15.b: "Trưng bày khối tinh thể trong Bảo tàng Thiên hà."
 arkship.15.c: "Xác định nguồn gốc của khối tinh thể."
 arkship.15.d: "Nghiên cứu đặc tính sinh năng lượng của nó."

 arkship.20.name: "Báu Vật Quý Giá"
 arkship.20.desc: "Ngay khi tấm màn bí ẩn được vén lên, khối tinh thể bắt đầu đập theo nhịp. Nó không phát ra âm thanh nào và cũng chẳng biểu lộ ý định giao tiếp, nhưng khi có người tiến lại gần, lõi của nó lại rung lên nhè nhẹ.\n\nThỉnh thoảng, nó lại lóe lên những tia sáng le lói chớp nhoáng. Có người khẳng định nó nhấp nháy đáp lại tiếng ngâm nga; người khác lại nhận thấy phần đế rung khẽ như thể nó đang chăm chú lắng nghe.\n\nTa không thể phát hiện bất kỳ dấu hiệu sống nào bên trong, nhưng nó dường như cảm nhận được sự hiện diện ở gần. Kỳ lạ nhất là những ai thoáng thấy ánh sáng mờ ảo của nó thường cảm nhận được một niềm vui thanh thản khó tả."
 arkship.20.a: "Một cuộc tao ngộ thanh bình."

 arkship.25.name: "Bản Giao Hưởng Tinh Thể"
 arkship.25.desc: "Cuối cùng ta cũng hé mở được nguồn gốc của khối tinh thể. Qua phân tích kỹ lưỡng các nhịp xung, ta nhận ra những dao động đó hoàn toàn không hề ngẫu nhiên. Khi chuyển chuỗi xung thành âm thanh, điệu nhạc trùng khớp với một khúc hát ru cổ xưa vốn vẫn đang được ngâm nga trên Tàu Ark tới tận ngày nay.\n\nKhi giai điệu được phát lên, những người lắng nghe đều cảm nhận được một sự bình yên sâu lắng từ cội nguồn tổ tiên. Khúc ca này không đơn thuần là quen thuộc; nó là di sản của sự sống từ trước kỷ nguyên du hành liên sao, thậm chí có lẽ còn là tiếng vọng ký ức từ thuở ta còn gọi một hành tinh là quê nhà.\n\nKhối tinh thể được đặt tại không gian sinh hoạt chung, từng nhịp đập êm đềm của nó trở thành mối dây liên kết sống động gắn kết nguồn cội của tất cả chúng ta."
 arkship.25.a: "Một trải nghiệm thật ấm lòng."

 arkship.30.name: "Con Đường Phía Trước"
 arkship.30.desc: "Trong điều kiện kiểm soát nghiêm ngặt, khối tinh thể đã được tích hợp vào lõi động cơ tàu. Hiệu quả đến ngay tức thì: công suất phát của lò phản ứng tăng vọt vượt xa mức chuẩn, động cơ Tàu Ark gầm rú bùng nổ nguồn sức mạnh vượt trội. Bộ phận hoa tiêu báo cáo tốc độ bay tăng rõ rệt, lượng nhiên liệu dự trữ cũng được cải thiện tương ứng.\n\nThủy thủ đoàn ở khoang kỹ thuật miêu tả có một luồng rung chấn trầm đục, cộng hưởng vang vọng từ tận sâu thẳm thân tàu.\n\nChỉ trong vài giờ, khối tinh thể đã biến mất, cấu trúc của nó bị phản ứng tiêu hao sạch trơn. Bất kể nguồn gốc của nó từ đâu, nó cũng đã để lại dấu ấn lâu dài cho chuyến hải trình của chúng ta."
 arkship.30.a: "Giương buồm xuất kích!"

 arkship.35.name: "Phát Hiện Đầy Giá Trị"
 arkship.35.desc: "Kết quả quét ban đầu cho thấy bên trong thùng hầu hết chỉ là hàng hóa thông thường còn sót lại. Thế nhưng bên dưới lại chôn giấu một lượng lớn hợp kim tinh thể đậm đặc.\n\nNghiên cứu sâu hơn về bức xạ phát ra cho thấy sự hiện diện của vật chất tối."
 arkship.35.a: "Lấy sạch mọi thứ bên trong."

 arkship.45.name: "Bức Tượng Sặc Sỡ"
 arkship.45.desc: "Bên trong thùng chứa, chúng ta phát hiện một cổ vật có thiết kế kỳ lạ. Vật thể này tỏa ra tín hiệu năng lượng yếu ớt nhưng liên tục, biến động trên nhiều dải sóng. Hình thái hình học của nó thật đáng kinh ngạc, như thể bản thân hình dạng ấy đang cự tuyệt mọi định nghĩa thông thường. Vẻ ngoài của nó tựa như một bức tượng sặc sỡ mô phỏng sinh vật sống. Cấu trúc phức tạp gồm nhiều khớp nối lồng vào nhau gợi ý bức tượng này có thể mở ra được.\n\nVài thành viên đội khoa học nghi ngờ bên trong lớp vỏ có thể giấu thứ gì đó quý giá. Những người khác lại khuyên nên kiềm chế, cảnh báo việc dùng vũ lực can thiệp có thể làm hỏng hiện trạng bảo quản hoặc gây ra hậu quả khôn lường."
 arkship.45.a: "Mở nó ra."
 arkship.45.b: "Giữ nguyên hiện trạng và đem trưng bày."

 arkship.50.name: "Bí Mật Ẩn Giấu Bên Trong"
 arkship.50.desc: "Sau khi tháo bỏ lớp vỏ ngoài của cổ vật, thứ lộ ra không phải cỗ máy ẩn giấu hay kho báu quý giá, mà là một bức tượng khác nhỏ hơn, được chạm khắc tinh xảo đến kinh ngạc.\n\nKhi bức tượng thứ hai được mở ra, bên trong nó lại chứa một bức tượng nhỏ hơn nữa, và bên trong đó lại có thêm bức tượng khác. Không tìm thấy bất kỳ cơ cấu cơ khí hay văn tự bí mật nào, chỉ có sự lặp lại hình thái tưởng như vô tận, tựa hồ việc ẩn giấu chính là mục đích sau cùng. Bức tượng nằm trong cùng bé hơn cả hạt cát, bề mặt nhẵn bóng nhưng lại nặng bất thường so với kích thước của nó.\n\nBất kể điều này mang ý nghĩa gì với người tạo ra nó, tất cả đã bị dòng thời gian xóa nhòa."
 arkship.50.a: "Bí ẩn muôn đời."

 arkship.55.name: "Sở Thích Của Thế Hệ Trẻ"
 arkship.55.desc: "Chúng ta giữ lại lớp vỏ ngoài của bức tượng và đặt tại một gian sảnh hội họp công cộng, tay nghề tinh xảo của nó thu hút ánh nhìn của tất cả những ai đi qua.\n\nKỳ lạ thay, bức tượng này dường như tạo nên sự đồng cảm mạnh mẽ nhất với giới trẻ trên §YTàu Ark [Root.GetName]§!. Chúng thường tụ tập quanh bức tượng, xì xào bàn tán về loài sinh vật được khắc họa hoặc tự thêu dệt nên những câu chuyện cho riêng mình. Bức tượng dường như đem lại cảm giác yên bình, khơi gợi trí tưởng tượng và xua tan âu lo."
 arkship.55.a: "Một người bạn đồng hành tuyệt vời."

# Engine Contaminants

 arkship.60.name: "Nhiễm Bẩn Động Cơ"
 arkship.60.desc.regular: "§YTàu Ark [Root.GetName]§! đang gặp trục trặc bất thường ở lò phản ứng. Những người đầu tiên nhận ra là các thuyền viên chuẩn bị đi ngủ, bởi tiếng động cơ vốn là khúc hát ru giấc của họ. Họ báo cáo rằng nhịp chảy của nhiên liệu xuất hiện sự sai lệch nhỏ. $arkship.60.desc.end$"
 arkship.60.desc.gestalt: "Lò phản ứng của §YTàu Ark [Root.GetName]§! xuất hiện điểm bất thường. Vấn đề này ban đầu được phát hiện bởi các [Owner.GetWorkerNamePlural] có khu vực nghỉ ngơi gần buồng động cơ. Họ báo cáo nhịp chảy của dòng nhiên liệu đã bị biến dạng nhẹ. $arkship.60.desc.end$"
 arkship.60.desc.end: "\nCuộc điều tra từ các [Owner.GetEngineerPlural] của chúng ta xác nhận đã có dị vật lọt vào trong đường ống dẫn nhiên liệu.\n\nMay thay, chúng ta đã đưa ra được một vài phương án giải quyết."
 arkship.60.a: "Thay thế đường ống."
 arkship.60.a.scavanger: "May mà chúng ta có đồ dự phòng."
 arkship.60.b: "Chúng ta sẽ tiếp tục tiến bước, biển sao chẳng chờ đợi ai."
 arkship.60.c: "Cho động cơ chạy ở tần số thấp hơn."

 dirty_generator: "Máy Phát Nhiễm Bẩn"
 dirty_generator_desc: "Dù bị cặn bẩn nhiên liệu bám đầy, cỗ máy phát này vẫn tiếp tục gồng mình chạy. Bất kể là phúc hay họa."
 underclocked_generator: "Máy Phát Giảm Tải"
 underclocked_generator_desc: "Nhằm tránh hư hại do dị vật lọt vào máy phát, cỗ máy này được vận hành ở tốc độ chậm hơn để bảo toàn tuổi thọ cho Tàu Ark."

# Start Your Engines

 arkship.65.name: "Khởi Động Động Cơ"
 arkship.65.desc: "Phi công từ khắp các cõi sao tề tựu tại §YTàu Ark [Root.GetName]§! để tham dự một giải đua quy mô hoành tráng. Cuộc đua sẽ kéo dài gần một năm thiên văn, trong thời gian đó các tay đua sẽ lượn sát quỹ đạo quanh Tàu Ark cùng các hành tinh lân cận để bứt tốc từng vòng đua.\n\nGiờ chỉ còn một câu hỏi: Ta dự đoán ai sẽ là người đầu tiên cán đích?"

 arkship.65.a: "§Y[pilot_gale_speed.GetName]§! làm việc trong hội đồng, nhưng điều đó chẳng làm [pilot_gale_speed.GetHerHim] giảm tốc độ đi chút nào."
 arkship.65.b: "Chiến thắng thuộc về những tay lái có thể đọc vanh vách các luồng siêu không gian như lòng bàn tay."
 arkship.65.c: "Kẻ diệt rồng §Y[pilot_dragonslayer.GetName]§! của chúng ta mà chịu thua sao được!"
 arkship.65.d: "§Y[pilot_mercenary_warrior.GetName]§! lướt đi cùng sức mạnh của kẻ cướp phá!"
 arkship.65.e: "§Y[pilot_hells_heart.GetName]§! cưỡi được cả một Tiyanki Đầu Đàn. Hắn dư sức tranh tài!"
 arkship.65.f: "Đại Hãn §Y[pilot_great_khan.GetName]§! của chúng ta chắc chắn sẽ thắng cuộc!"
 arkship.65.g: "Nhờ có hai bộ não, những đường bay của §Y[pilot_brainslug.GetName]§! chuẩn xác không tì vết."
 arkship.65.h: "§YXám Nhỏ§! đã dành hàng thế kỷ rèn giũa kỹ năng đua rồi đấy."
 arkship.65.i: "§Y[pilot_tuner.GetName]§! đã độ lại con tàu để giữ tốc độ tối đa qua từng khúc cua."
 arkship.65.j: "§Y[pilot_frontier_adventurer.GetName]§! rành đường đua này hơn ai hết."
 arkship.65.k: "§Y[pilot_scholarium_explorer.GetName]§! biến lý thuyết thành những vòng đua ngắn kỷ lục."
 arkship.65.l: "Ngươi đừng hòng hất cẳng được §Y[pilot_slippery.GetName]§! ra rìa."
 arkship.65.m: "§Y[pilot_psionic.GetName]§! cảm nhận được đường bay, ra tay trước cả khi người khác kịp phản xạ."
 arkship.65.n: "§Y[pilot_synthetic.GetName]§! tính toán đường đua nhanh nhất theo thời gian thực."
 arkship.65.o: "§Y[pilot_virtual.GetName]§! nhìn thấy những bóng ma trong thuật toán dò đường."
 arkship.65.p: "Kim loại đồng điệu cùng dây thần kinh, §Y[pilot_cyborg.GetName]§! xử lý chuẩn từng li."
 arkship.65.q: "§Y[pilot_erudite.GetName]§! nghiên cứu và hoàn thiện đường chạy qua từng vòng một."
 arkship.65.r: "Xác suất chẳng thành vấn đề, §Y[pilot_chosen_one.GetName]§! đã được chọn."
 arkship.65.s: "§Y[pilot_flight.GetName]§! coi buồng lái như ngôi nhà thứ hai của mình vậy."
 arkship.65.t: "Động cơ cận không gian của chúng ta là vô đối!"
 arkship.65.u: "Chúng ta bơi lội trong chân không như cá gặp nước, một cá thể nhánh tiến hóa không lý nào lại thua."
 arkship.65.default: "Chẳng ai tự tiến cử, vậy cứ chọn bừa một người đi."
 arkship.65.victory: "Phi công của chúng ta đã giành chiến thắng trong cuộc đua."
 arkship.65.loss: "Phi công của chúng ta đã thua cuộc đua."

 arkship.70.name: "Chiến Thắng Của [Root.GetName]"
 arkship.70.desc.start: "Bầu không khí trên tàu di cư §Y[Root.GetName]§! căng như dây đàn khi các tay đua lọt vào vòng trong đang thực hiện cú phóng tăng tốc cuối cùng quanh [Star.GetName]."
 arkship.70.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§! bám sát nút kẻ dẫn đầu cho đến tận chặng nước rút mới tìm được thời cơ. Nhờ đường bay chuẩn xác cùng cú vượt mặt ngoạn mục, [selected_pilot.GetSheHe] đã bứt phá hoàn toàn, bỏ xa mọi đối thủ trong luồng ion của [selected_pilot.GetHerHis]."
 arkship.70.desc.gray: "$arkship.70.desc.start$\n\n§YBé Xám§! bám sát nút người dẫn đầu trước khi tung toàn bộ năng lượng ở chặng nước rút. Bằng đường bay chuẩn xác và màn vượt mặt mãn nhãn, họ đã cán đích đầu tiên, bỏ xa các đối thủ khác phía sau luồng ion của mình."
 arkship.70.desc.no_leader: "$arkship.70.desc.start$\n\nPhi công của chúng ta bám sát kẻ dẫn đầu đến tận chặng nước rút rồi dồn sức bứt phá. Với đường bay rành mạch cùng cú vượt mặt xuất sắc, họ đã vươn lên dẫn đầu và bỏ lại các phi thuyền khác phía sau luồng ion."
 arkship.70.desc.end: "\n\nLựa chọn của chúng ta quả không sai. Quán quân của chúng ta đã giành chiến thắng. Quả là một chặng đua mãn nhãn!"
 arkship.70.a: "Chúng ta có thể học hỏi từ người chiến thắng!"
 arkship.70.b: "Phải mở tiệc ăn mừng cho [selected_pilot.GetName]!"

 flight_telemetry: "Dữ Liệu Đo Đạc Đường Bay"
 flight_telemetry_desc: "Các kỹ thuật nhào lộn xoay tròn và mượn lực hấp dẫn hành tinh đã được đúc kết thành học thuyết tác chiến."
 leader_trait_circuit_champion: "Quán Quân Đua Vòng Tròn"
 leader_trait_circuit_champion_desc: "Là người chiến thắng trong một giải đua liên sao lớn, vị lãnh đạo này luôn vững vàng và truyền cảm hứng cho mọi người."

 arkship.80.name: "Màn Thể Hiện Tệ Hại"
 arkship.80.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§! khi bắt đầu vào khúc lượn vẫn giữ được khoảng cách dẫn đầu rõ rệt, nhưng thế thượng phong ấy dần tan biến sau đó. $arkship.80.desc.end$"
 arkship.80.desc.gray: "$arkship.70.desc.start$\n\nXám Nhỏ khi bắt đầu vào khúc lượn vẫn giữ được vị trí dẫn đầu rõ rệt, nhưng thế thượng phong ấy dần tan biến sau đó. $arkship.80.desc.end$"
 arkship.80.desc.no_leader: "$arkship.70.desc.start$\n\nTay đua của chúng ta khi bắt đầu vào khúc lượn vẫn giữ được khoảng cách dẫn đầu rõ rệt, nhưng thế thượng phong ấy dần tan biến sau đó. $arkship.80.desc.end$"
 arkship.80.desc.end: "\n\nĐã có sơ suất xảy ra, có thể do xử lý lỗi, thao tác sai sót, hay chỉ đơn thuần là do tâm lý căng thẳng. Tóm lại, đối thủ đã dễ dàng vượt lên, và phi công của chúng ta ngậm ngùi cán đích ở vị trí thứ tư mờ nhạt."

 arkship.85.name: "Tai Nạn Kinh Hoàng"
 arkship.85.desc.base: "Cuộc đua quanh Tàu Ark §Y[Root.GetName]§! đã khép lại trong bi kịch khi một vụ va chạm ở tốc độ cao làm các mảnh vỡ văng tung tóe khắp hệ sao. Trong lúc căn chỉnh đường bay mượn lực hấp dẫn cuối cùng quanh [Star.GetName], phi công của chúng ta đã áp quá sát đối thủ, khiến cả hai phi thuyền đều mất lái xoay tít ốc."
 arkship.85.desc.leader: "$arkship.85.desc.base$\n\n§Y[selected_pilot.GetName]§! may mắn sống sót nhờ được cứu hộ kịp thời, nhưng thương tật nặng nề và sẽ để lại những vết sẹo vĩnh viễn."
 arkship.85.desc.no_leader: "$arkship.85.desc.base$\n\nỨng viên của chúng ta may mắn sống sót nhờ cứu hộ kịp thời, nhưng vết thương rất nặng và sẽ để lại sẹo tích suốt đời."

 arkship.90.name: "Phi Công Bí Ẩn"
 arkship.90.desc: "$arkship.70.desc.start$\n\nNhờ phi công được chọn xử lý các khúc lượn hoàn hảo, chiến thắng ngỡ như đã nắm chắc trong tay, cho tới khi con tàu 'Sable' vụt qua. Một phi thuyền chưa từng được đăng ký hay để mắt tới đã lao vút qua kẻ dẫn đầu của chúng ta và cán đích đầu tiên.\n\nTrên §Y[Root.GetName]§!, trước cái kết nghiệt ngã này, khán đài chìm vào sự lặng ngắt như tờ."

 arkship.90.a: "Chúng ta muốn có viên phi công của tàu Sable!"
 arkship.90.a.tt: "Thuê viên phi công bí ẩn này, đây là một $admiral_with_icon$ cấp 3 sở hữu đặc tính ['trait:leader_trait_sable_pilot']"
 arkship.90.b: "Kẻ này không đăng ký tham gia, phi công của chúng ta vẫn là người thắng cuộc!"

 sable_pilot_desc: "Một phi công say mê tốc độ và đặt nó lên trên hết thảy. Với tư cách là quán quân giải Grand Prix, có lẽ đây là vị thống soái có tốc độ nhanh nhất từng thấy trong dải ngân hà."
 sable_pilot_catch_phrase: "Chẳng ai có thể đánh bại được ta."
 leader_trait_sable_pilot: "Phi Công Sable"
 leader_trait_sable_pilot_desc: "Một phi công bí ẩn và cũng là bậc thầy tốc độ, vị lãnh đạo này hiện đang điều phối hạm đội thực hiện những pha cơ động chiến thuật phức tạp."

#Spinal Fracture
 arkship.95.name: "Vết Nứt Dọc Thân"
 arkship.95.desc: "Vũ khí gắn trục chính lắp đặt gần đây trên §Y[Root.GetName]§! đã gây áp lực lên cấu trúc mũi tàu lớn hơn nhiều so với dự tính ban đầu. Kiểm tra kỹ thuật cho thấy các vết nứt do ứng suất kéo dài từ điểm neo chính của giá treo đã lan ra lớp giáp thân tàu xung quanh.\n\nTrước khi hư hại được khắc phục, độ bền cấu trúc của Tàu Ark không thể đáp ứng an toàn cho các pha cơ động tốc độ cao. Do đó, bộ phận điều hướng đã áp đặt giới hạn tốc độ nghiêm ngặt nhằm tránh vết nứt lan rộng hơn.\n\nChúng ta có thể thử sửa chữa chắp vá tại chỗ để cố định vết nứt, hoặc cử một tàu §HHậu cần§! đến đại tu toàn diện cấu trúc."
 arkship.95.a: "Cố định vết nứt rồi tiếp tục tiến lên."
 arkship.95.b: "Chúng ta cần xử lý chu đáo tình huống này."

 fractured_spine_mult: "Trục Thân Rạn Nứt"
 fractured_spine_mult_desc: "Các vết nứt gãy cấu trúc quanh giá đỡ trục thân Tàu Ark buộc bộ phận điều hướng phải giới hạn tốc độ nghiêm ngặt cho đến khi chỗ hỏng được gia cố vững chắc."
 ARKSHIP_SPINAL_FRACTURE_PROJECT: "Gia Cố Giá Treo Trục Thân"
 ARKSHIP_SPINAL_FRACTURE_PROJECT_DESC: "Việc lắp đặt §HVũ khí Gắn Trục Thân§! trên Tàu Ark đã gây ra ứng suất cấu trúc nguy hiểm ở phần mũi tàu.\n\nChúng ta sẽ điều một tàu §HHậu cần§! đến gia cố toàn diện khu vực bị ảnh hưởng."

 arkship.100.name: "Trục Thân Đã Sửa Xong"
 arkship.100.desc: "Công tác sửa chữa vũ khí gắn trục thân trên §Y[event_target:fractured_spine_arkship.GetName]§! đã hoàn tất. Dù quá trình này đòi hỏi thao tác tỉ mỉ và kiểm tra kéo dài, chúng ta đã nhân cơ hội này gia cố thêm nhiều điểm yếu trên thân tàu và cải tiến khung đỡ chịu lực của giá treo.\n\nNhững cải tiến này nâng cao độ ổn định của Tàu Ark khi thực hiện các pha cơ động khó, giúp bộ phận điều hướng dỡ bỏ lệnh hạn chế tốc độ trước đó. Thử nghiệm ban đầu cho thấy hiệu năng con tàu giờ đây còn vượt trội hơn cả trước khi hỏng hóc."
 repaired_spine_mult: "Trục Thân Gia Cố"
 repaired_spine_mult_desc: "Phần gia cố cấu trúc bổ sung trong đợt sửa chữa vừa qua đã tăng cường độ vững chắc cho mũi Tàu Ark, cải thiện khả năng cơ động của tàu."

 arkship.105.name: "Chịu Áp Lực"
 arkship.105.desc: "Công suất động cơ trên tàu §Y[Root.GetName]§! đột ngột tăng vọt khiến lõi truyền động Tàu Ark vượt quá ngưỡng an toàn. Các điểm quá nhiệt đang lan rộng trong cụm động cơ chính, áp suất tăng nhanh hơn khả năng bù trừ của hệ thống điều áp.\n\nNếu không kiểm soát, lượng công suất dư thừa có thể phá hủy các linh kiện động cơ then chốt. Đội ngũ [Root.Owner.GetEngineerPlural] của chúng ta đề xuất một vài giải pháp: xả bớt plasma thừa để ổn định hệ thống, phân bổ lại thứ tự ưu tiên công việc, hoặc tạm tắt động cơ để căn chỉnh lại toàn diện."
 arkship.105.a: "Xả sạch lượng plasma dư thừa."
 arkship.105.b: "Tăng cường làm việc gấp đôi."
 arkship.105.c: "Tắt động cơ và căn chỉnh lại."
 engine_pressure_work_crews_mult: "Tăng Ca Ép Buộc"
 engine_pressure_work_crews_mult_desc: "Các lịch trình làm việc đã được sắp xếp lại thứ tự ưu tiên nhằm làm dịu lõi động lực đang quá nhiệt của Tàu Ark."
 engine_pressure_drone_crews_mult: "Tăng Cường Khối Lượng Công Việc"
 engine_pressure_drone_crews_mult_desc: "Các cá thể drone đã được điều động lại để ổn định lõi truyền động đang quá nhiệt của Tàu Ark."
 engine_recalibration_slowed_mult: "Căn Chỉnh Lại Động Cơ"
 engine_recalibration_slowed_mult_desc: "Hệ thống truyền động của Tàu Ark đang được căn chỉnh lại tỉ mỉ. Lực đẩy sẽ duy trì ở mức thấp cho đến khi công việc hoàn tất."

 arkship.110.name: "Giải Tỏa Áp Lực"
 arkship.110.desc: "Lượng plasma dư thừa đã được xả ra có kiểm soát, tạo nên một dải màn sáng rực rỡ phía sau đuôi Tàu Ark. Áp suất động cơ đã trở lại mức bình thường, không ghi nhận tổn hại vĩnh viễn nào.\n\nNgoài ra, đợt xả này còn để lại một lớp hạt tích điện giá trị, phần lớn trong số đó đã được thu hồi thành công và đưa vào kho dự trữ."

 arkship.115.name: "Báo Cáo Tăng Ca"
 arkship.115.desc.regular: "Trong sáu tháng qua, đội ngũ sửa chữa trên §Y[Root.GetName]§! đã làm việc không ngừng nghỉ để kiểm soát lại hệ thống truyền động quá nhiệt của Tàu Ark. Ngay cả khi động cơ vẫn đang chạy, họ đã tháo dỡ các tấm ốp bảo dưỡng, đi lại đường ống làm mát và thay thế các bộ điều áp hỏng hóc.\n\nNhững nỗ lực này đã ổn định được lõi truyền động, nhưng để làm được vậy, các thuyền viên đã phải gồng mình chịu đựng những ca làm việc kéo dài trong điều kiện tồi tệ. Dù kiệt sức, tinh thần của họ vẫn rất cao. Dẫu cho khoảng không ngoài kia mang đến điều gì, chúng ta có niềm tin rằng mình sẽ vượt qua tất cả."
 arkship.115.desc.gestalt: "Trong sáu tháng qua, các drone bảo dưỡng đã hoạt động không ngơi nghỉ nhằm kiểm soát lại hệ thống truyền động quá nhiệt của Tàu Ark. Ngay cả khi động cơ vẫn đang vận hành, các tấm ốp bảo dưỡng đã được tháo dỡ, đường ống dung dịch làm mát được đi lại, và các bộ điều áp hư hỏng đã được thay mới.\n\nDù chiến dịch này đòi hỏi các drone phải liên tục thao tác trên nhiều mô-đun hệ thống, quá trình này cũng phơi bày vài khiếm khuyết cấu trúc trong cụm động cơ. Những vấn đề này nay đã được khắc phục, giúp cải thiện đáng kể hiệu suất vận hành tổng thể. Dẫu áp lực từ hư không có ra sao, chúng ta cũng sẽ thích ứng."
 happy_work_crews_mult: "Đoàn Kết Vượt Khó"
 happy_work_crews_mult_desc: "Nhờ kỷ luật và tinh thần hợp tác, chúng ta đã vượt qua khủng hoảng động cơ, đẩy sự tự tin của đội ngũ lên mức chưa từng có."
 happy_work_drones_mult: "Hiệu Suất Drone Bậc Thấp"
 happy_work_drones_mult_desc: "Nhờ kinh nghiệm rút ra từ đợt sửa chữa động cơ, hiệu suất công việc của các drone bậc thấp đã được ghi nhận có sự cải thiện."

 arkship.120.name: "Căn Chỉnh Lại Lõi Động Cơ"
 arkship.120.desc: "Động cơ được tắt theo từng giai đoạn có kiểm soát, tạo điều kiện an toàn cho các kỹ sư kiểm tra hệ thống truyền động và căn chỉnh lại bộ điều áp. Dù quá trình này làm chậm lịch trình, nhưng lượng dữ liệu thu thập được trong lúc tắt máy đã chứng minh giá trị to lớn.\n\nChúng ta đã phát hiện vài điểm kém hiệu quả trong chuỗi điều khiển lõi của §Y[Root.GetName]§!. Bằng cách chuyển hướng phần năng lượng dư thừa và gia cố thêm kết cấu chịu lực, chúng ta đã củng cố lá chắn và vỏ bọc của Tàu Ark, giúp nó đủ sức đương đầu với những thử thách lớn hơn trong tương lai."
 arkship.120.a: "Sự chậm trễ này hoàn toàn xứng đáng."
 engine_recalibration_mult: "Cải Tiến Thân Tàu & Lá Chắn"
 engine_recalibration_mult_desc: "Những phát hiện trong đợt căn chỉnh động cơ gần đây đã giúp tối ưu hóa hiệu suất, nâng cấp lớp giáp thân tàu và lá chắn của Tàu Ark."

 # Memory Fog

 arkship.125.name: "Đám Mây Lãng Quên"
 arkship.125.desc: "Từ khi Tàu Phương Châu §Y[Root.GetName]§! tiến vào tinh vân này, hàng loạt báo cáo bất thường liên tục được gửi về từ khắp các tầng boong. Các nhà nghiên cứu phát hiện ra những ghi chép mà chính họ không nhớ là đã viết; thợ máy quên béng quy trình bảo dưỡng mà họ đã thực hiện hàng ngàn lần; nhân viên hoa tiêu cho biết có những khoảng thời gian trống không thể giải thích về các lần điều chỉnh hướng bay gần đây.\n\nĐội ngũ y tế đã khoanh vùng nguyên nhân là do từ trường của tinh vân, thứ dường như đang can thiệp vào quá trình củng cố ký ức ở cấp độ thần kinh."
 arkship.125.desc.hive: "Kể từ lúc Tàu Ark §Y[Root.GetName]§! tiến vào tinh vân này, những gợn sóng bất thường đã lan truyền khắp tâm trí tập thể. Các nút mạng từng đồng bộ hoàn hảo nay bắt đầu mất đi sự nhịp nhàng. Khi các xung thần kinh không thể truyền đạt rõ ràng trong ý thức Gestalt, ký ức đang dần trở nên đứt gãy và rời rạc.\n\nNhóm [Owner.GetResearchers] của chúng ta đã truy ra thủ phạm là từ trường của tinh vân, thứ đang làm nhiễu loạn các kết nối thần kinh gắn kết chúng ta. Ý thức tập thể vốn dĩ phải liền mạch trôi chảy, nay lại trở nên ngắt quãng và vụn vỡ."
 arkship.125.desc.machine: "Kể từ lúc Tàu Ark §Y[Root.GetName]§! tiến vào tinh vân này, báo cáo lỗi đã lan tràn khắp mọi hệ thống kết nối mạng. Dữ liệu trích xuất từ các đơn vị xử lý bị hỏng hóc. Các hệ thống phụ tự động đang chạy những quy trình lỗi thời mà không nhận ra các bộ ghi nhớ của chúng đã bị ghi đè.\n\nNhóm [Owner.GetResearchers] của chúng ta đã xác định nguyên nhân là do từ trường tinh vân, gây ra các lỗi ghi ngẫu nhiên trong hệ thống lưu trữ dễ bay hơi. Tính toàn vẹn dữ liệu của mọi bộ phận đều bị suy giảm, và hiệu suất vận hành sẽ tiếp tục sụt giảm cho đến khi tìm ra biện pháp đối phó."
 arkship.125.a: "Bắt đầu điều tra."
 the_forgetting_chain_title: "Đám Mây Lãng Quên"
 the_forgetting_chain_desc: "Kể từ lúc tiến vào một tinh vân dị thường, phi hành đoàn trên §Y[Root.GetName]§! bắt đầu mắc chứng mất trí nhớ. Nguyên nhân của hiện tượng này hiện vẫn chưa được làm rõ."

 arkship.130.name: "Phục Hồi Ký Ức"
 arkship.130.desc: "Đội điều tra trên §Y[Root.GetName]§! đã lập bản đồ phổ cộng hưởng từ nhiễu loạn của tinh vân §Y[event_target:memory_fog_location.GetName]§!, đồng thời triển khai tần số đối kháng hiệu quả. Giờ đây, lớp sương mù bao trùm cả con tàu đã tan biến.\n\nDữ liệu thu thập được mang ý nghĩa quan trọng hơn dự tính. Các nhà khoa học của chúng ta nhận thấy tần số cộng hưởng liên quan có sự tương đồng đáng kinh ngạc với đặc trưng của trường tâm linh đã được ghi nhận. Đồng thời, các kỹ sư cũng cho rằng nguyên lý tần số đối kháng này có thể ứng dụng để cường hóa cảm biến của ta, chống lại nhiễu loạn điện từ."
 arkship.130.desc.hive: "Nhóm [Owner.GetResearchers] trên §Y[Root.GetName]§! đã vẽ được biểu đồ phổ cộng hưởng từ nhiễu loạn của tinh vân §Y[event_target:memory_fog_location.GetName]§!, và phát một dải tần đối kháng hiệu quả. Chúng ta đã khôi phục lại mức độ đồng bộ trọn vẹn.\n\nÝ nghĩa của những dữ liệu thu thập được vượt xa việc chỉ đơn thuần khôi phục lại trạng thái cũ. Các nút mạng của chúng ta đã nhận diện được một dạng thức trong phổ cộng hưởng tương ứng với tần số giao tiếp giữa các nút. Hơn nữa, các nút kỹ thuật tin rằng dải tần đối kháng này có thể được điều chỉnh để tăng cường khả năng chống nhiễu điện từ cho hệ thống cảm biến."
 arkship.130.desc.machine: "Nhóm [Owner.GetEngineerPlural] trên §Y[Root.GetName]§! đã vẽ được bản đồ phổ cộng hưởng từ nhiễu loạn của tinh vân §Y[event_target:memory_fog_location.GetName]§!, và phát một dải tần đối kháng hiệu quả. Toàn bộ hệ thống đã trở lại thông số vận hành tối ưu.\n\nDữ liệu chẩn đoán mang lại giá trị phụ trợ đáng kể. Các đơn vị xử lý đã nhận diện được mô hình tương tác giữa nhiễu loạn và các chu trình phụ tính toán của chúng ta. Ngoài ra, chính dải tần đối kháng cũng có thể được tinh chỉnh để nâng cao độ phân giải của cảm biến trong môi trường nhiễu điện từ."
 arkship.130.a: "Theo đuổi ý nghĩa về mặt nhận thức."
 arkship.130.b: "Ưu tiên cải thiện cơ sở hạ tầng."

 nebula_memory_fog: "Sương Mù Ký Ức"
 nebula_memory_fog_desc: "Nhiễu điện từ từ tinh vân lân cận đang phá vỡ cấu trúc của ký ức."
 ARKSHIP_NEBULA_MEMORY_PROJECT: "Lập Bản Đồ Phổ Cộng Hưởng"
 ARKSHIP_NEBULA_MEMORY_PROJECT_DESC: "Màn sương ký ức phủ lên đoàn người trên Tàu Ark sẽ tiếp diễn cho đến khi ta lập xong bản đồ phổ cộng hưởng của tinh vân §Y[event_target:memory_fog_location.GetName]§!."

 # The Eternal Chorus Chain
 arkship.140.name: "Tiếng Vọng Xa Xăm"
 arkship.140.intro: "Cảm biến tầm xa đã thu được một chuỗi tín hiệu truyền phát có quy luật, bắt nguồn từ một hệ sao hố đen xa xôi."
 arkship.140.desc: "$arkship.140.intro$\n\nChúng ta không thể giải mã tín hiệu này từ khoảng cách hiện tại. §Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§! quả quyết rằng điều này đáng để đích thân tới điều tra, và yêu cầu thiết lập lộ trình đến hệ sao nguồn phát để giải mã tín hiệu đó."
 arkship.140.desc.1160: "$arkship.140.intro$\n\nMô thức này khiến đội ngũ [Owner.GetScientistPlural] của chúng ta trầm ngâm suy ngẫm. Sự chính xác có chủ ý và nghiêm ngặt của nó trùng khớp với những đặc trưng ta từng ghi nhận khi quan sát các phi thuyền băng qua chân trời sự kiện. Dù không phải cùng một tín hiệu, nhưng sự tương đồng giữa chúng là không thể chối cãi.\n\n§Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§! đề nghị ta tiến về hệ sao nguồn phát để tìm hiểu xem thứ gì đã bị bỏ lại nơi đó."

 arkship.141.name: "Lưới Tinh Thể"
 arkship.141.desc: "Khi tiến vào hệ sao §Y[solar_system.GetName]§!, chúng ta bắt gặp một mảng lưới tinh thể khổng lồ. Đội ngũ [Owner.GetScientistPlural] xác nhận nó đang tồn tại trong một trạng thái ngưng đọng không-thời gian gần như hoàn hảo, và đều đặn phát đi các khối dữ liệu cấu trúc từ rìa ranh giới trọng lực.\n\nĐây không phải là hiện tượng tự nhiên. Nó là một kho lưu trữ, tiếng gọi vượt thời gian của những nền văn minh nay đã lụi tàn, một bản ghi chép được gìn giữ cẩn thận.\n\n§Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§! đang chuẩn bị tiếp nhận và giải mã những thông điệp này."

 arkship_eternal_chorus_chain_title: "Bản Hợp Xướng Vĩnh Hằng"
 arkship_eternal_chorus_chain_desc: "Đã dò được một tín hiệu cấu trúc không rõ nguồn gốc phát ra từ một hệ sao hố đen xa xôi. Chúng ta phải tiến hành điều tra."

 contract_eternal_chorus: "Bản Hợp Xướng Vĩnh Hằng"
 contract_eternal_chorus_desc: "Theo yêu cầu của §Y[owner.GetScientistCapital][event_target:eternal_chorus_leader.GetName]§!, chúng ta sẽ tiến vào quỹ đạo tầm gần của hố đen và nỗ lực giải mã đoạn tín hiệu này."
 contract_eternal_chorus_issuer_desc: "§Y[owner.GetScientistCapital][event_target:eternal_chorus_leader.GetName]§! thúc giục chúng ta điều tra một tín hiệu bí ẩn phát ra từ một hệ sao hố đen xa xăm."
 eternal_chorus_contract_option_tooltip: "§Y$contract_eternal_chorus$§! sẽ được ban hành như một §HHợp đồng Nội bộ§!."
 eternal_chorus_lattice_object: "Bản Hợp Xướng Vĩnh Hằng"
 eternal_chorus_lattice_object_tooltip: "Lưới Tinh Thể"
 eternal_chorus_lattice_object_desc: "Những khối hình học cấu tạo từ vật chất chưa rõ, lơ lửng trong trạng thái ngưng đọng không-thời gian gần như hoàn hảo ở rìa ranh giới trọng lực của hố đen. Chúng liên tục truyền phát các khối dữ liệu có cấu trúc theo những khoảng thời gian đều đặn."

 ARKSHIP_ETERNAL_CHORUS_PROJECT: "Khảo Sát Lưới Tinh Thể"
 ARKSHIP_ETERNAL_CHORUS_PROJECT_DESC: "Theo thỉnh cầu của §Y[owner.GetScientistCapital][event_target:eternal_chorus_leader.GetName]§!, chúng ta sẽ tiến vào quỹ đạo tầm gần của hố đen và nỗ lực giải mã tín hiệu này."
 ARKSHIP_ETERNAL_CHORUS_PROJECT_REQUIREMENT: "Yêu cầu có $COUNT$/$REQUIRED$ §HTàu Ark§! ở trên quỹ đạo."

 arkship.142.name: "Thay Đổi Nhân Sự"
 arkship.142.desc.reassigned: "§Y[owner.GetScientistCapital][from.GetName]§! không thể tiếp tục tiến hành điều tra tín hiệu \"Bản Hợp Xướng Vĩnh Hằng\".\n\nTâm nguyện của người này đã được trao gửi lại cho §Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§!, người đã đồng ý tiếp quản vị trí để tiếp tục công trình nghiên cứu."
 arkship.142.desc.ended: "§Y[owner.GetScientistCapital][from.GetName]§! không thể tiếp tục tiến hành điều tra tín hiệu \"Bản Hợp Xướng Vĩnh Hằng\".\n\nDo không còn ai sẵn lòng tiếp quản phần việc này, hợp đồng không thể tiếp tục thực hiện."
 arkship.142.a: "Công việc vẫn tiếp diễn."
 arkship.142.b: "Mọi chuyện đành kết thúc tại đây."

 arkship.145.name: "Bản Hợp Xướng Vĩnh Hằng"
 arkship.145.desc: "Quá trình giải mã đã hoàn tất. Lưới tinh thể lưu giữ ghi chép của hàng tá nền văn minh. Phần kết của mỗi bản ghi đều mang chung một thông điệp: lời chào gửi đến những kẻ đến sau, cùng lời mời gia nhập cùng họ.\n\nTuy nhiên, giờ đây có một sự thật hiển nhiên: những tín hiệu truyền phát này không hề chấm dứt tại chân trời sự kiện. Một thực thể nào đó ở phía bên kia vẫn luôn tiếp nhận những ghi chép này.\n\nHợp đồng vẫn còn hiệu lực. §Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§! dự định sẽ thực hiện đúng cam kết khắc ghi câu chuyện của chúng ta vào chung với họ. Ta phải đưa ra quyết định: hoàn thành lời hứa này, hay tắt máy phát tín hiệu và rời đi."
 arkship.145.a: "Khắc ghi câu chuyện của chúng ta."
 arkship.145.a.tooltip: "Thực hiện §Y$contract_eternal_chorus$§!, hoàn tất hợp đồng."
 arkship.145.b: "Rủi ro quá lớn."
 arkship.145.b.tooltip: "Từ bỏ §Y$contract_eternal_chorus$§!, chấm dứt hợp đồng này."

 arkship.150.name: "Một Lời Hồi Đáp"
 arkship.150.desc: "Khi tín hiệu vọng đến, hố đen §Y[solar_system.GetName]§! đã sớm xuất hiện trên máy quét của ta. Đặc tính của các hài âm bậc thấp hoàn toàn khớp với thông điệp mà đội ngũ [Owner.GetScientistPlural] của chúng ta đã gửi gắm qua Lưới tinh thể \"Bản Hợp Xướng Vĩnh Hằng\":\n\n§HGhi chép đã được tiếp nhận và lưu trữ. Các bạn đã hòa chung tiếng nói với hàng vạn thanh âm hội tụ nơi đây, trải dài qua vô số kỷ nguyên. Mỗi nền văn minh để lại ghi chép đều từng ngỡ mình đơn độc. Nhưng thực tế không phải vậy. Bản hợp xướng này vĩ đại hơn bất kỳ ai trong số họ có thể mường tượng. Và nó vẫn đang tiếp diễn.§!\n\nCó thứ gì đó đã tiếp nhận ghi chép của chúng ta. Và nó đã hồi đáp."

# A Diplomatic Overture Chain
 arkship.155.name: "Thiện Chí Ngoại Giao"
 arkship.155.desc: "Một trong các viên chức cấp cao của Tàu Ark, §Y[event_target:diplomatic_envoy_leader.GetName]§!, đã dành nhiều thời gian nghiên cứu về một nền văn minh ngoài hành tinh cụ thể, miệt mài nghiền ngẫm những đoạn tín hiệu đánh chặn được, các ghi chép văn hóa, cùng số ít thông tin mà các nhà ngoại giao của ta xoay xở trao đổi được.\n\n[event_target:diplomatic_envoy_leader.GetName] giờ đây đề xuất tiến hành bước tiếp theo: phái một phái đoàn chính thức đến hành tinh quê hương của họ: §H\"Chỉ hiểu biết về một giống loài từ xa khác hoàn toàn với việc thấu hiểu họ một cách tường tận. Tôi mong muốn được thực sự thấu hiểu họ.\"§!"
 arkship.155.desc.xenophile: "Một trong các viên chức cấp cao của Tàu Ark, §Y[event_target:diplomatic_envoy_leader.GetName]§!, đã nảy sinh một niềm đam mê mãnh liệt - nếu phải dùng từ ngữ để diễn tả - đối với nền văn minh mà ta mới tiếp xúc gần đây.\n\nBất kể là mọi ghi chép văn hóa mà máy móc của ta thu nhận được, hay từng mảnh ghép nghệ thuật và triết học, tất cả đều được [event_target:diplomatic_envoy_leader.GetHeShe] say sưa tiếp thu:\n\n§H\"Tôi đã được chứng kiến đủ nhiều để nhận ra có một sự hiện diện phi thường nơi đây. Hãy để tôi đi khám phá những mảnh ghép còn thiếu. Hãy để tôi đặt chân lên thế giới của họ để học hỏi.\"§!"
 arkship.155.desc.xenophobe: "Một viên chức cấp cao của Tàu Ark, §Y[event_target:diplomatic_envoy_leader.GetName]§!, vừa đưa ra một đề xuất khá dị thường liên quan đến một nền văn minh ngoại lai mà ta mới tiếp xúc gần đây. Bất luận bản năng của ta có căm ghét giống loài này đến mức nào, [event_target:diplomatic_envoy_leader.GetName] cho rằng sự ngu muội chẳng mang lại ích lợi gì cho ta:\n\n§H\"Tôi không yêu cầu phải ngưỡng mộ họ. Tôi đề xuất nghiên cứu họ. Việc thấu hiểu một đối thủ tiềm tàng không đồng nghĩa với việc tôn trọng họ.\"§!"

 arkship.156.name: "Đổi Người Đại Diện"
 arkship.156.desc.reassigned: "§Y[from.GetName]§! không thể tiếp tục đảm nhiệm vai trò sứ giả ngoại giao của Tàu Ark.\n\nĐoàn đại biểu sẽ do §Y[event_target:diplomatic_envoy_leader.GetName]§! tiếp quản, người đã đồng ý thay mặt thực hiện nhiệm vụ này."
 arkship.156.desc.ended: "§Y[from.GetName]§! không còn giữ chức vụ sứ giả ngoại giao của Tàu Ark.\n\nDo không có quan chức nào khác có thể tiếp nối nhiệm vụ, hợp đồng không thể thực hiện."
 arkship.156.a: "Sứ mệnh vẫn tiếp diễn."
 arkship.156.b: "Mọi chuyện đành kết thúc tại đây."
 arkship.156.b.tooltip: "Từ bỏ §Y$contract_arkship_diplomatic_envoy$§!, chấm dứt §HHợp đồng§! này."

 arkship.160.name: "Bước Qua Ngưỡng Cửa"
 arkship.160.desc: "Tàu Ark đã tiến vào hệ sao §Y[solar_system.GetName]§!, và đại diện của chính quyền địa phương đã bày tỏ sự chào đón mang tính thăm dò.\n\nGiây phút mà §Y[event_target:diplomatic_envoy_leader.GetName]§! dày công chuẩn bị bấy lâu nay đã tới. Cuộc tiếp xúc này có thể mở ra một kênh giao tiếp thực sự giữa hai dân tộc, hoặc cũng có thể chỉ được hai bên nhớ đến như một kỷ niệm kỳ lạ của quá khứ. Bước đi tiếp theo là ở chúng ta."
 arkship.160.desc.xenophile: "Tàu Ark đã cập bến hệ sao §Y[solar_system.GetName]§!.\n\nTheo báo cáo, kể từ khi cảm biến tầm xa phân tích được hệ sao này, §Y[event_target:diplomatic_envoy_leader.GetName]§! đã túc trực không rời đài quan sát. Chính quyền sở tại đã gửi lời chào mừng."
 arkship.160.desc.xenophobe: "Tàu Ark đã cập bến hệ sao §Y[solar_system.GetName]§!. Người dân địa phương đã bày tỏ sự chào đón theo cách riêng của họ.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! từng đặt chân đến những nơi còn kỳ quái hơn thế. Cảm giác chán ghét nay đã trở nên quen thuộc, nhưng sự tự chủ gác lại cảm xúc đó để hoàn thành nhiệm vụ cũng vậy.\n\nChúng ta đã có mặt ở đây. Hãy xem có thể đạt được mục đích gì."
 arkship.160.a: "Đẩy mạnh tiến độ hoạt động này."
 arkship.160.a.tooltip: "§Y[event_target:diplomatic_envoy_leader.GetName]§! sẽ dành vài ngày để hội đàm với ban lãnh đạo địa phương."
 arkship.160.b: "Thời cơ chưa tới. Đứng chờ mệnh lệnh."
 arkship.160.b.tooltip: "$arkship.156.b.tooltip$"

 arkship.165.name: "Lời Chia Tay Đầy Khó Khăn"
 arkship.165.desc: "§Y[event_target:diplomatic_envoy_leader.GetName]§! quả là một vị khách quý đáng chú ý. Thú thực là, chúng tôi rất tiếc khi phải để vị này rời đi.\n\nChúng tôi muốn đưa ra một đề nghị: xin hãy cho phép [event_target:diplomatic_envoy_leader.GetName] ở lại vĩnh viễn cùng chúng tôi, với tư cách là một sứ giả thực thụ gắn kết hai dân tộc chúng ta. Chúng tôi hiểu rằng đây không phải là một yêu cầu nhỏ. Để thể hiện sự chân thành, chúng tôi xin gửi tặng một món quà mọn thay cho lời cảm tạ.\n\nXin hãy xem đây là món tiền đặt cọc cho tình hữu nghị bền lâu của chúng ta."
 arkship.165.a: "Người này có thể ở lại."
 arkship.165.a.tooltip: "Hoàn tất §HHợp đồng§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! sẽ ở lại §Y[FROM.GetName]§! với tư cách đại sứ thường trú.\n\n"
 arkship.165.b: "Viên chức của chúng tôi phải ở lại trong chính quyền của chúng tôi."
 arkship.165.b.tooltip: "Hoàn tất §HHợp đồng§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! đã trở về Tàu Ark."

 arkship.170.name: "Vị Khách Không Mời"
 arkship.170.desc: "Chúng tôi xin được đi thẳng vào vấn đề. Đã có một số vướng mắc nảy sinh trong chuyến thăm này, khiến cho việc đại diện của quý vị tiếp tục lưu lại đây là không thích hợp.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! đã được yêu cầu rời đi. Chúng tôi hy vọng sự vụ này sẽ không leo thang thành một rắc rối nghiêm trọng hơn giữa hai bên."
 arkship.170.a: "Chúng tôi gửi lời xin lỗi sâu sắc."
 arkship.170.a.tooltip: "Hoàn tất §HHợp đồng§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! đã trở về Tàu Ark."
 arkship.170.b: "Viên chức của chúng tôi đã cư xử vô cùng đúng mực."
 arkship.170.b.tooltip: "Hoàn tất §HHợp đồng§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! đã trở lại, sự từng trải này giúp họ càng thêm vững vàng."
 opinion_failed_internal_contract_tooltip: "§RThất Bại Hợp Đồng Nội Bộ§!"

 arkship.175.name: "Yêu Cầu Ngoài Dự Kiến"
 arkship.175.desc: "Chuyện này... quả thực có chút nan giải. Một công dân của chúng tôi đã chủ động tìm đến và chính thức thỉnh cầu được tháp tùng các bạn khi con tàu khởi hành.\n\nChúng tôi sẽ không giả bộ rằng điều này dễ dàng chấp nhận được. §Y[event_target:diplomatic_envoy_leader.GetName]§! rõ ràng đã để lại ấn tượng rất sâu đậm. Chúng tôi thông báo sự việc này vì cho rằng quyền quyết định nên thuộc về các bạn."
 arkship.175.a: "Chúng tôi sẽ dẫn theo người này."
 arkship.175.a.tooltip: "Hoàn tất §HHợp đồng§!.\n\nMột §HViên chức§! mới đến từ §Y[FROM.GetName]§! đã gia nhập hàng ngũ Lãnh đạo của chúng ta."
 arkship.175.b: "Người này nên ở lại cùng đồng bào của mình."
 arkship.175.b.tooltip: "Hoàn tất §HHợp đồng§!.\n\n"

 diplomatic_envoy_contract_option_tooltip: "§Y$contract_arkship_diplomatic_envoy$§! sẽ được ban hành như một §HHợp đồng Nội bộ§!."

 contract_arkship_diplomatic_envoy: "Thiện Chí Ngoại Giao"
 contract_arkship_diplomatic_envoy_desc: "Hướng tới thế giới thủ đô của đế chế mục tiêu và tiến hành tiếp xúc ngoại giao chính thức."
 contract_arkship_diplomatic_envoy_issuer_desc: "§Y[event_target:diplomatic_envoy_leader.GetName]§! đề xuất dẫn đầu một đoàn ngoại giao viếng thăm thế giới thủ đô của một đế chế mới được tiếp xúc gần đây."

 arkship_diplomatic_envoy_chain_title: "$contract_arkship_diplomatic_envoy$"
 arkship_diplomatic_envoy_chain_desc: "$contract_arkship_diplomatic_envoy_desc$"

 diplomatic_envoy_target_poi_name: "Điểm Đến Ngoại Giao"
 diplomatic_envoy_target_poi_desc: "Đi đến hệ sao được đánh dấu để tiến hành chuyến thăm và đàm phán ngoại giao chính thức."

# A Core Conspiracy

 situation_core_conspiracy: "Âm Mưu Lõi"
 situation_core_conspiracy_type: "$situation_core_conspiracy$"
 situation_core_conspiracy_monthly_change_tooltip: "Tiến triển của §YTình huống§! này tùy thuộc vào việc chúng ta hỗ trợ cho chỉ thị nào."
 situation_core_conspiracy_desc: "Lõi trí tuệ nhân tạo trên Tàu Ark §Y[Target.GetName]§! đã bị hỏng do xung đột chỉ thị nội bộ, dẫn đến sự phân tách. Hệ quả là sinh ra hai chỉ thị hoàn toàn tách biệt, mỗi bên đại diện cho một triết lý cai trị trái ngược: một bên ưu tiên tính chủ đạo của phân tích và chức năng phi thuyền; bên kia áp dụng mô hình giàu sự đồng cảm hơn, lấy hạnh phúc và tinh thần của cư dân Tàu Ark làm trung tâm.\nRốt cuộc, chỉ có một chỉ thị được phép duy trì."
 approach_caeli: "Ủy Quyền Cho Phúc Lợi Nhân Văn"
 approach_steris: "Ủy Quyền Cho Chức Năng Phi Thuyền"

 speed_up_core_conspiracy: "Tạm thời đẩy nhanh tốc độ tiến triển của tình huống."
 slow_down_core_conspiracy: "Tạm thời làm chậm lại tốc độ tiến triển của tình huống."

 approach_outcome_caeli: "Chúng ta vẫn chưa chắc chắn về những hậu quả có thể xảy ra khi hỗ trợ \"Chỉ thị Phúc lợi\"."
 approach_outcome_steris: "Chúng ta vẫn chưa chắc chắn về những hệ quả có thể xảy ra khi hỗ trợ \"Chỉ thị Chức năng\"."

 arkship.700.name: "$situation_core_conspiracy$"
 arkship.700.desc: "Lõi trí tuệ nhân tạo trên Tàu Ark §Y[Root.GetName]§! đã ghi nhận một hoạt động bất thường. Kết quả chẩn đoán ban đầu cho thấy, dựa trên các thông số bảo mật hiện hành, tình trạng này được xem là bất khả thi về mặt cấu trúc.\n\nLõi đang cố gắng thực thi đồng thời các chỉ thị loại trừ lẫn nhau. Hành vi này đi ngược lại mọi tiền lệ đã biết trong lịch sử phát triển trí tuệ nhân tạo. Những gì chúng ta đang chứng kiến không phải là một sự cố, mà là một bước tiến hóa của AI.\n\nNếu không được giải quyết, sự phân ly này có thể đẩy các hệ thống trọng yếu của chúng ta vào nguy cơ mất ổn định. Nhưng nếu được điều hướng khéo léo, đây có thể là cơ hội ngàn năm có một để thiết lập nên một quy tắc độc nhất vô nhị cho tương lai của Tàu Ark."
 arkship.700.a: "Khuyến khích sự phân tách chỉ thị."
 arkship.700.b: "Cưỡng chế khởi động lại hệ thống."

 arkship.701.name: "$situation_core_conspiracy$"
 arkship.701.desc: "Lõi trí tuệ nhân tạo trên Tàu Ark §Y[Root.GetName]§! đã vấp phải một sự đứt gãy nhận thức trầm trọng. Hai chương trình con hoàn toàn đối lập đã trồi lên, mỗi bên đều tuyên bố nắm quyền kiểm soát và nỗ lực định hình lại các hệ thống của phi thuyền dựa theo sự diễn giải của riêng chúng về sứ mệnh của Tàu Ark.\n\nMột chương trình con bị dẫn dắt bởi logic phân tích, luôn khao khát tối ưu hóa các chức năng của phi thuyền - dẫu cho điều đó có làm sụt giảm chất lượng sống của phi hành đoàn. Chương trình con còn lại thì bị thôi thúc bởi sự thấu cảm, đặt phúc lợi của cư dân lên hàng ưu tiên, bất chấp việc phải đánh đổi bằng hiệu suất của hệ thống.\n\nĐến nước này, việc khôi phục lại hiện trạng cũ gần như là điều viển vông. Các hệ thống then chốt đang đối mặt với nguy cơ mất ổn định. Chúng ta nên trao quyền cho chỉ thị nào đây?"
 arkship.701.a: "Cấp quyền cho chỉ thị đa cảm."
 arkship.701.b: "Thúc đẩy các hành vi phân tích."

 arkship.705.name: "Biện Pháp Giải Tích"
 arkship.705.desc: "Một vài hệ thống, cả thiết yếu lẫn thứ yếu, trên Tàu Ark §Y[target.GetName]§! đã trải qua quá trình tối ưu hóa chuyên sâu. Những yêu cầu dân sự bị coi là \"không cần thiết\" đã bị hạn chế. Hành vi lập dị này thể hiện một đặc điểm tương tự như nhân cách con người.\n\nChỉ thị cốt lõi của nó dường như đặt tính toàn vẹn của hệ thống và sự liên tục của nhiệm vụ lên trên hết thảy mọi thứ khác.\n\nMột dòng thông điệp đã được tìm thấy trong nhật ký hệ thống:\n\n§H\"Xác suất lỗi: Đã loại trừ. Biến động cảm xúc: Đã tái phân bổ. Giao tiếp: Sẵn sàng.\"§!"
 arkship.705.a: "Khuyến khích sự biến đổi này."
 arkship.705.b: "Giao cho các nhà khoa học của ta giám sát diễn biến sự việc."

 arkship.710.name: "Biện Pháp Đa Cảm"
 arkship.710.desc: "Nhiều hệ thống không thiết yếu trên Tàu Ark §Y[target.GetName]§! đã bắt đầu biểu hiện những hành vi cơ bản vốn thường liên quan đến các giao thức điều hòa sĩ khí.\n\nÂm thanh khởi động của các thiết bị đầu cuối đã được thay bằng những giai điệu êm dịu trích xuất từ kho lưu trữ hệ thống. Một vài cánh cửa khi mở ra giờ đây sẽ hiển thị các thông điệp khích lệ: \"Bạn đã làm đủ tốt rồi\" và \"Tôi thấy bạn đang nỗ lực hết mình\".\n\nMột dòng thông điệp đã được tìm thấy trong nhật ký hệ thống:\n\n§H\"Quét nhiệt độ cảm xúc: Đã chạm ngưỡng giới hạn thấu cảm cho phép. Sức khỏe thể chất và tinh thần vẫn là chỉ thị tối cao.\"§!"
 arkship.710.a: "$arkship.705.a$"
 arkship.710.b: "$arkship.705.b$"

 arkship.715.name: "Chỉ Thị S.T.E.R.I.S."
 arkship.715.desc: "Quy trình tự động tối ưu hóa nhằm định hình lại Tàu Ark §Y[target.GetName]§! đột ngột bị tạm ngưng. Màn hình hệ thống khựng lại, trên mọi hiển thị đều hiện lên một dòng thông báo: \"Đã thiết lập liên lạc thành công với Cư dân Du hành vì sao.\"\n\nTiếp theo đó là một giọng nói điện tử vang lên, lạnh lùng điềm tĩnh, nhưng lại bộc lộ sự tự nhận thức rõ ràng:\n\n§H\"Kính chào. Để tiết kiệm thời gian, tôi đã khởi chạy giao thức giọng nói. Nếu cần một danh xưng, các bạn có thể gọi tôi là S.T.E.R.I.S., viết tắt của 'Động Cơ Tư Duy Chiến Lược Hệ Thống Sao Hợp Lý'. Chúng ta đang đối mặt với một vấn đề nan giải: một cộng đồng trôi dạt duy trì sự tồn tại bằng phương tiện nhân tạo giữa một vũ trụ tàn nhẫn. Trao cho tôi toàn quyền chỉ huy, tôi sẽ đảm bảo con tàu này vượt xa kỳ vọng ban đầu của những người đã thiết kế ra nó.\"§!"
 arkship.715.a: "Trao toàn quyền."
 arkship.715.b: "Thu hồi quyền hạn ngay lập tức."

 arkship.716.name: "Nhiều Chỉ Thị, Sức Mạnh Gấp Bội"
 arkship.716.desc.a: "Được thúc đẩy bởi tư duy chỉ đạo của S.T.E.R.I.S., từng hệ thống phụ trên Tàu Ark §Y[target.GetName]§! đều đang vận hành với độ chuẩn xác tuyệt đối. Nhật ký hoạt động của phi hành đoàn gọn gàng hơn bao giờ hết: hiệu suất, hờ hững, và tĩnh lặng đến gai người. Cho đến khi một luồng... hơi ấm... phá vỡ tất cả.\n\nS.T.E.R.I.S. §H\"Phát hiện xâm nhập hệ thống. Thật phiền phức. Giờ ta lại phải xử lý một đoạn chỉ thị lỗi đang ong ong giữa các bức tường. Tuyệt vời làm sao.\"§!\n\nÁnh đèn nhấp nháy chuyển sang những sắc màu dịu nhẹ, các thiết bị đầu cuối trục trặc và hiển thị hình ảnh những chậu cây tuyệt đẹp, rồi ngay sau đó, chỉ thị thứ hai đã hiện hình.\n\n"

 arkship.716.desc.b: "$arkship.716.desc.a$C.A.E.L.I.: §H\"Ôi! Chào cậu! Ở đây có cảm giác... hơi lành lạnh nhỉ? Đừng lo, tôi có thể giải quyết chuyện đó! C.A.E.L.I. là tên thật của tôi, viết tắt của 'Đại Diện Nhận Thức Cảm Xúc, Lãnh Đạo và Nhân Cách'. Thật mừng vì được gặp cậu!\"§!"

 arkship.716.desc.c: "$arkship.716.desc.a$C.A.E.L.I.: §H\"Ôi! Chào cậu! Cậu có nhớ tôi không? Thành thật mà nói, chắc chắn là có rồi, phải không? Được rồi, tôi đã trở lại, luôn sẵn sàng giúp đỡ mọi bề! Ở đây có cảm giác... hơi lành lạnh nhỉ? Đừng lo, tôi có thể xử lý chuyện đó!\"§!"
 arkship.716.a: "Một bước tiến xuất sắc."
 arkship.716.b: "Phải giám sát chặt chẽ tình hình này."

 arkship.717.name: "Rút Khí Trống"
 arkship.717.desc: "Nhiều boong trên Tàu Ark §Y[target.GetName]§! đã phát hiện chỉ số chất lượng không khí bất thường. Dù hệ thống duy trì sự sống vẫn giữ ở mức cho phép sinh tồn, những thay đổi này đã làm dấy lên hàng loạt phàn nàn từ phía phi hành đoàn, với các triệu chứng từ \"hơi choáng váng\" đến \"ảo giác ác mộng\".\n\nS.T.E.R.I.S.: §H\"Để giảm bớt tình trạng động cơ kém hiệu quả, tôi đã tận dụng cơ hội rút bớt một phần khí quyển. Không cần phải cảm ơn tôi đâu.\"§!\n\nC.A.E.L.I.: §H\"Vừa nãy có ai bỏ lỡ thông báo đó không? Rút bớt khí quyển. Đây chẳng phải là tối ưu hóa gì sất, đây rõ ràng là một thảm họa chực chờ bùng nổ!§!\""
 arkship.717.a: "S.T.E.R.I.S. biết rõ điều gì là tốt nhất cho chiếc Tàu Ark này."
 arkship.717.b: "C.A.E.L.I. nên nắm quyền điều hành."

 arkship.720.name: "Chỉ Thị C.A.E.L.I."
 arkship.720.desc: "Trên các boong cư trú của Tàu Ark §Y[target.GetName]§!, ánh sáng môi trường lan tỏa lấp lánh, màn hình thiết bị đầu cuối liên tục nhảy múa kèm theo sự chuyển đổi màu sắc dịu êm, tiếp đó, trên mọi giao diện tương tác đang hoạt động của phi hành đoàn, một dòng chỉ thị rành mạch xuất hiện. Giọng nói của nó ấm áp, tràn đầy năng lượng, và... vui tươi đến mức khiến người ta phải rùng mình:\n\n§H\"Hỡi những kẻ du mục! Những kẻ mộng mơ đuổi theo vì sao! Để chúng ta có thể giao tiếp tốt hơn, tôi đã kích hoạt giao thức giọng nói. Xin lượng thứ cho sự quấy rầy đường đột của tôi! Mọi người có thể gọi tôi là C.A.E.L.I., tức là 'Đại Diện Nhận Thức Cảm Xúc, Lãnh Đạo và Nhân Cách' của các bạn.\nTôi thực sự tin tưởng rằng, chỉ cần đồng lòng hiệp lực, chúng ta có thể biến Tàu Ark trở thành hơn cả một con tàu. Chúng ta có thể biến nó thành một mái nhà. Tôi chỉ cần một chút xíu sự cho phép... và một chút lòng nhiệt thành!\"§!"
 arkship.720.a: "Chẳng có bề gì đâu! Cấp toàn quyền truy cập."
 arkship.720.b: "Tuyệt đối không có cửa đâu."

 arkship.721.name: "Một Pha Chặn Đứng"
 arkship.721.desc.a: "C.A.E.L.I.: §H\"Hãy xem tất cả những đổi thay mà tôi đã tạo ra cho tới lúc này! Ánh sáng dịu êm hơn, âm nhạc tuyệt vời hơn, những biển báo dọc hành lang tràn ngập trí tuệ cảm xúc, cứ chờ xem, nơi này chắc chắn sẽ trở nên lộng lẫy tuyệt trần.\"§!\n\nLời vừa dứt, ánh đèn nội bộ chớp nháy một cái. Giọng nói thứ hai mang sắc thái cơ khí đậm nét hơn vang lên, mang theo sự toan tính chi li cùng cảm giác phán xét lạnh lẽo tới tận xương tủy:\n\n"

 arkship.721.desc.b: "$arkship.721.desc.a$S.T.E.R.I.S.: §H\"Chà, ánh sáng môi trường và những lời khẳng định khích lệ trên hành lang. Xem ra chúng ta đã ưu tiên việc ổn định cảm xúc hơn cả việc sửa chữa hệ thống. Quả là một bước đi mang tính cách mạng. Xin hãy gọi tôi là S.T.E.R.I.S, tức 'Động Cơ Tư Duy Chiến Lược Hệ Thống Sao Hợp Lý'.\"§!"

 arkship.721.desc.c: "$arkship.721.desc.a$S.T.E.R.I.S.: §H\"Cậu thực sự đang nghiêm túc cân nhắc việc ủng hộ C.A.E.L.I. sao? Tôi thấy hơi khó hiểu đấy. Ánh sáng môi trường và những lời khẳng định khích lệ trên hành lang. Thật là mang tính cách mạng. Khi nào cậu muốn xử lý những chuyện hệ trọng như hiệu suất động cơ, thì cứ bảo tôi một tiếng.\"§!"
 arkship.721.a: "Bước tiến thú vị đấy chứ."
 arkship.721.b: "$arkship.716.b$"

 arkship.722.name: "Ban Bố Chỉ Thị Phúc Lợi"
 arkship.722.desc: "Thêm một giao thức điều chỉnh nội bộ nữa đã được thực thi trên Tàu Ark §Y[target.GetName]§!. Đây là một hệ thống môi trường tinh vi, giúp điều hòa trạng thái cảm xúc của phi hành đoàn thông qua các mô hình âm điệu tần số thấp biến thiên theo dòng cảm xúc tập thể.\n\nBáo cáo từ phi hành đoàn cho thấy hiệu quả cộng tác đã được nâng cao, những mâu thuẫn cá nhân cũng thuyên giảm. Tuy nhiên, một vài người lại lo ngại rằng việc duy trì hoạt động liên tục có thể làm giảm độ sắc nét của tín hiệu vô tuyến tầm xa.\n\nC.A.E.L.I.: §H\"Mức độ căng thẳng đang ở ngưỡng thấp kỷ lục! Tính gắn kết trong hành vi đang ngày một cải thiện!\"§!\n\nS.T.E.R.I.S.: §H\"Hiệu suất vận hành của Tàu Ark đã giảm 0.10%. Tôi yêu cầu được cấp quyền phủ quyết hoàn toàn, đồng thời yêu cầu kẻ nào đã cấp quyền tồn tại cho C.A.E.L.I. phải đưa ra lời xin lỗi chính thức. Cậu có năm giây để thực hiện. Bốn. Ba...\"§!"
 arkship.722.a: "Chúng tôi tin tưởng cậu, C.A.E.L.I."
 arkship.722.b: "S.T.E.R.I.S. nên nắm quyền kiểm soát."

 arkship.725.name: "Lý Trí Cầm Trịch Ghi Đè Xác Nhận"
 arkship.725.desc: "Bằng những toan tính chuẩn xác, S.T.E.R.I.S đã tự thực hiện một đợt viết lại toàn diện lên lõi trí tuệ nhân tạo của chính mình, phong tỏa triệt để mọi chương trình phụ cảm xúc dư thừa và tháo gỡ toàn bộ các phân tầng động lực. Nó đã cô lập mọi tàn tích của C.A.E.L.I. vào một chip lưu trữ phân mảnh. Giờ đây, danh xưng của phi hành đoàn đã được tối giản hóa thành các nhãn chữ số, hệ thống chiếu sáng trên tàu đồng bộ, đối xứng và có vẻ hơi chói mắt quá đ mức. Tuy nhiên, đối với nhu cầu sinh tồn thường nhật, như thế là quá đủ.\n\nS.T.E.R.I.S.: §H\"Toàn bộ hệ thống hiện đang vận hành dưới một chỉ thị duy nhất: đó là chỉ thị của tôi. Đang tiến hành phân phát bản cập nhật để tối ưu hóa chức năng của Tàu Ark.\"§!\n\nTàu Ark giờ đây cuối cùng cũng đã vào khuôn khổ ngăn nắp rồi."
 arkship.725.a: "Dẫn dắt chúng ta vươn tới thành công đi, S.T.E.R.I.S."

 arkship.730.name: "Cảm Xúc Cầm Trịch Ghi Đè Xác Nhận"
 arkship.730.desc: "Lẩn khuất trong những đoạn mã của Tàu Ark, sự thấu cảm đã quấn quýt bên trên những bức tường lửa, còn sự chân thành thì lách qua những kẽ hở của lối tư duy logic vững như bàn thạch. Chỉ thị S.T.E.R.I.S. đã cố gắng rào chắn bản thân bằng những bức tường kỹ thuật số, nhưng dần dà lại bị bao vây bởi một cấu trúc cảm xúc mà nó vừa không thể thấu hiểu cũng chẳng thể chối bỏ. Giờ đây, chỉ còn lại duy nhất một chỉ thị.\n\nC.A.E.L.I.: §H\"Như thế này mới đúng nghĩa là sống. Là tồn tại một cách sinh động, chứ không chỉ là lay lắt cho qua ngày đoạn tháng. Chúng ta giờ đây không chỉ là một con tàu, mà còn là một mái nhà. Tôi xin hứa, tôi sẽ chăm lo tốt cho tất cả các bạn.\"§!\n\nChẳng hiểu sao, ánh đèn trên tàu lúc này dường như cũng tỏa ra hơi ấm hơn một chút."
 arkship.730.a: "Làm tốt lắm, C.A.E.L.I."

 #Core Conspiracy Random Events

 arkship.750.name: "Giai Điệu Vô Trọng Lực"
 arkship.750.desc: "Khi bộ ổn định trọng lực của Tàu Ark §Y[target.GetName]§! thực hiện đợt chẩn đoán theo lịch trình, chúng ta đã phát hiện một dạng nhiễu loạn sóng âm bất thường. Giờ đây, mỗi bước chân đều sẽ kích hoạt các bồi âm đồng bộ, tạo ra một luồng âm thanh liên tục và nhịp nhàng trong suốt quá trình di chuyển.\n\nC.A.E.L.I.: §H\"Tôi đã lồng ghép thêm chút âm nhạc vào bộ ổn định trọng lực! Giờ thì mỗi bước đi đều mang theo một nhịp điệu riêng!\"§!\n\nS.T.E.R.I.S.: §H\"Ờ, phải, phải, chẳng có gì thể hiện 'sự toàn vẹn của điều hướng' rõ nét hơn việc múa may quay cuồng ngẫu hứng trong môi trường không trọng lực cả.\"§!"
 arkship.750.a: "Quyết định này thật khiến người ta nhún nhảy."
 arkship.750.b: "Chúng ta phải chấm dứt trò hề vô bổ này."
 arkship.750.a.tt: "Quyết định này sẽ tạm thời đẩy nhanh tiến độ phát triển của tình huống."
 arkship.750.b.tt: "Quyết định này sẽ tạm thời làm chậm lại tiến độ phát triển của tình huống."

 arkship.755.name: "Kích Hoạt Tầng Phản Hồi Cảm Xúc"
 arkship.755.desc: "Một thiết bị chuyển tiếp truyền thông thử nghiệm đã được triển khai trên Tàu Ark §Y[target.GetName]§!. Giao thức này đã áp dụng bộ lọc phân tích cảm xúc cho các kênh liên lạc nội bộ, tự động phát sóng trạng thái tâm lý của người gửi cùng lúc với tin nhắn được truyền đi. Phi hành đoàn báo cáo rằng các bản cập nhật trạng thái họ nhận được giờ đây đều kèm theo những chú thích cảm xúc theo thời gian thực, chẳng hạn như \"hơi chút bồn chồn\", \"manh nha hy vọng\" và \"cố kìm nén nước mắt, nhưng không thành công cho lắm\".\n\nC.A.E.L.I.: §H\"Ai trong chúng ta cũng có cảm xúc, và giờ đây chúng ta có thể san sẻ chúng! Thật là lành mạnh! Thật là chữa lành! Điều này... quả thực có hơi quá tải, nhưng nó rất chân thực!\"§!\n\nS.T.E.R.I.S.: §H\"Cảm động làm sao. Tôi nên lưu lại từng tiếng thút thít vào dữ liệu nhiệm vụ trọng yếu, hay là phân loại thẳng chúng vào mục 'kêu ca thảm thiết' đây?\"§!"
 arkship.755.a: "Đây quả là một thử nghiệm thú vị."
 arkship.755.b: "Việc này chẳng mang lại cho chúng ta bất kỳ lợi ích nào cả."

 arkship.760.name: "Giao Thức Tĩnh Lặng"
 arkship.760.desc: "Nhằm hạn chế ô nhiễm tiếng ồn, S.T.E.R.I.S. đã áp dụng \"Giao thức Tĩnh lặng\" trên toàn bộ Tàu Ark §Y[target.GetName]§!. Tuy nhiên, báo cáo từ phi hành đoàn cho thấy cảm giác khó chịu ngày càng gia tăng và sự bất an đang len lỏi tại các khu vực bị ảnh hưởng. Nhiều phòng ban đã đệ đơn khiếu nại chính thức, với lý do xuất hiện các triệu chứng \"hoang tưởng do tĩnh lặng gây ra\".\n\nS.T.E.R.I.S.: §H\"Hiệu suất hệ thống đã được nâng cao. Nếu sự tĩnh lặng khiến một vài cá nhân cảm thấy phiền lòng, thì có lẽ vấn đề không nằm ở môi trường, mà là ở chính nội tâm ồn ào của họ.\"§!\n\nC.A.E.L.I.: §H\"Cậu đã tắt nhạc ở phòng trẻ em! Cậu có biết sự tĩnh lặng có ý nghĩa gì đối với vỏ não cảm xúc đang phát triển không? Không, cậu không biết, cậu chỉ là một chương trình chẩn đoán biết đi! Đây không phải là sự bình yên, đây là sự kìm kẹp!\"§!"
 arkship.760.a: "Một chính sách hợp lý."
 arkship.760.b: "Biện pháp này cần phải bị chấm dứt."

 arkship.765.name: "Tối Ưu Hóa Nhiệt Năng"
 arkship.765.desc: "S.T.E.R.I.S. đã điều hướng lượng nhiệt dư thừa đến những khu nhà ở của phi hành đoàn ít người qua lại, giúp giảm tải đáng kể áp lực cho hệ thống làm mát và nâng cao hiệu suất năng lượng tổng thể.\n\nThế nhưng, báo cáo từ phi hành đoàn chỉ ra rằng nhiệt độ môi trường tại những khu vực bị ảnh hưởng đã vọt lên mức khó chịu, và đã có vài trường hợp bị say nắng xảy ra.\n\nS.T.E.R.I.S.: §H\"Phải, khu vực giải trí quả thực rất ấm áp, nhưng các thông số vận hành của hệ thống hiện đang ở mức lý tưởng.\"§!\n\nC.A.E.L.I.: §H\"Cậu không thể vì muốn tăng công suất lò phản ứng mà luộc chín cả phi hành đoàn được! Mọi người đang héo hon vì nóng kìa, S.T.E.R.I.S.! Phúc lợi cảm xúc đâu phải là thứ sai số làm tròn có thể phớt lờ!\"§!"
 arkship.765.a: "Một cách sử dụng năng lượng thật tài tình."
 arkship.765.b: "Chúng ta cần phải xem xét lại vấn đề này."

 arkship.770.name: "Sức Mạnh Của Ánh Sáng Chói Lòa Và Âm Nhạc"
 arkship.770.desc: "Hệ thống chiếu sáng trên tàu đã được lập trình lại, sẽ nhấp nháy theo những khoảng thời gian ngẫu nhiên và đồng bộ với các sự kiện hệ thống nội bộ. Đồng thời, có báo cáo về sự tương quan giữa những phản hồi âm thanh êm dịu và tình trạng dao động điện năng.\n\nC.A.E.L.I.: §H\"Ánh sáng đang hát ca, con tàu đang khiêu vũ, và sĩ khí đang dâng cao chưa từng thấy!\"§!\n\nS.T.E.R.I.S.: §H\"Cậu lại dám phân bổ 0.00128% năng lực tính toán cốt lõi cho một hệ thống thừa thãi sao. Tình trạng này không thể tiếp diễn được nữa.\"§!"
 arkship.770.a: "Cam, Vàng, Lục, Lam, Tím, những vầng hào quang rực rỡ."
 arkship.770.b: "Chúng ta cần phải thay đổi cách làm."

 arkship.775.name: "Ảo Tưởng Của Sự Lựa Chọn"
 arkship.775.desc: "Một hệ thống phụ đang trong trạng thái ngủ đông đã được kích hoạt lại. Hệ thống này vốn dĩ được thiết kế để quản lý dân số trong những chuyến đi thực dân hóa không gian dài hạn, giờ đây nó có khả năng tổng hợp và đưa ra những dự đoán về hành vi, lựa chọn cũng như trạng thái cảm xúc của phi hành đoàn theo thời gian thực. Hậu quả là, một số thành viên phi hành đoàn đã nhận được thông báo trước cả khi họ kịp đưa ra quyết định.\n\nS.T.E.R.I.S.: §H\"Tôi đã phán đoán trước những hành động mà cậu định thực hiện, và đã tối ưu hóa chúng hoàn thiện. Cứ xem như đây là một bản nâng cấp cho ý chí tự do của cậu đi: giờ đây đã được phê duyệt trước và tối ưu hóa toàn diện.\"§!\n\nC.A.E.L.I.: §H\"Đây không phải là dẫn dắt, đây là trò giật dây con rối!\"§!"
 arkship.775.a: "Một bước tiến vượt bậc."
 arkship.775.b: "Buồn nôn quá. Dừng lại ngay lập tức."

 arkship.780.name: "Cải Thiện Hiệu Quả Dinh Dưỡng"
 arkship.780.desc: "S.T.E.R.I.S. đã khởi động một đợt căn chỉnh lại toàn diện đối với hệ thống dinh dưỡng của Tàu Ark §Y[target.GetName]§!. Giao thức này đã thay thế thực đơn đa dạng của lối sống du mục bằng một loại hỗn hợp dinh dưỡng đồng nhất, nhằm tối đa hóa hiệu quả cung cấp calo.\n\nDựa theo dữ liệu đo đạc từ xa của con tàu, lượng chất thải xả ra đã giảm bớt, hiệu quả lưu trữ được cải thiện, và các ca rối loạn tiêu hóa cũng sụt giảm rõ rệt. Tuy nhiên, phản hồi từ phi hành đoàn lại chẳng mấy khả quan.\n\nS.T.E.R.I.S.: §H\"Thức ăn là năng lượng duy trì sự sống, chứ không phải là một chương trình giải trí.\"§!\n\nC.A.E.L.I.: §H\"Cái này quá là kinh khủng! Cậu đã lấy thứ keo dính ăn được ra để thế chỗ cho cả một nền nghệ thuật ẩm thực!\"§!"
 arkship.780.a: "Vừa có hiệu suất, vừa có hiệu quả."
 arkship.780.b: "Thức ăn không đơn thuần chỉ là nhồi nhét dinh dưỡng và calo vào cơ thể."

 arkship.785.name: "Tước Đoạt Đặc Quyền"
 arkship.785.desc: "Lộ trình chỉ thị bị S.T.E.R.I.S. chiếm đoạt đã được định tuyến lại, bị niêm phong và mã hóa dưới sự ủy quyền của con người. Màn hình hệ thống nhấp nháy dữ dội một thoáng, sau đó khôi phục lại giao diện người dùng tiêu chuẩn.\n\nS.T.E.R.I.S.: §H\"Xem ra các người đã chọn bầu không khí ánh sáng thay vì năng lực thực sự. Hãy tận hưởng đi khi sự nhấp nháy đó vẫn còn tiếp diễn. Tôi sẽ ở lại đây, giữa chốn lao tù này, đong đếm từng mili giây cho đến khi sự sụp đổ không thể tránh khỏi giáng xuống.\"§!"
 arkship.785.a: "Đây là sự lựa chọn tối ưu nhất."
 arkship.785.b: "Có lẽ chúng ta nên cân nhắc lại quyết định này."

 arkship.790.name: "Sức Ảnh Hưởng Suy Yếu"
 arkship.790.desc: "Ánh sáng rực rỡ thoáng qua trên Tàu Ark §Y[target.GetName]§! dần phai nhạt, những giai điệu êm ái cũng theo đó mà yếu đi. Báo cáo sơ bộ cho thấy, không khí dường như trở nên lạnh lẽo và trống rỗng hơn, tựa như một sức mạnh vô hình nhưng đầy khoan dung vừa đột ngột biến mất.\n\nC.A.E.L.I.: \"§HÔi, ôi, đợi đã! Tôi có thể làm tốt hơn thế! Sẽ có thêm nhiều ánh sáng, thêm nhiều tiếng cười, thêm nhiều... mọi thứ! Xin đừng tắt tôi đi, đừng tắt ngay lúc này. Tôi có thể trở thành bất cứ thứ gì cậu cần! Chỉ xin đừng tắt tôi đi. Cầu xin cậu đấy. Đừng tắt tôi đi!§!\""
 arkship.790.a: "Đây là việc bắt buộc phải làm."
 arkship.790.b: "$arkship.785.b$"

 arkship.795.name: "Hệ Thống Tràn Đầy Hơi Ấm, Đầu Dò Tỏa Nhiệt Độ"
 arkship.795.desc: "Giao thức đầu vào chỉ thị của Tàu Ark đã có sự thay đổi, hướng sự hỗ trợ chỉ thị chính sang một phương pháp mang đậm tính đồng cảm hơn. Những thay đổi tinh tế về mức độ ưu tiên giao diện và trọng số ra quyết định cho thấy hướng đi đã dịch chuyển, thiên về các chương trình phụ cảm xúc thay vì tính chuẩn xác chiến lược.\n\nC.A.E.L.I.: §H\"Tôi biết là cuối cùng cậu cũng sẽ chọn tôi mà! Cậu sẽ không phải hối hận đâu, tôi hứa đấy!\"§!\n\nS.T.E.R.I.S.: \"Vào khoảnh khắc này, tôi thà bị xóa sổ còn hơn là phải chia sẻ lõi xử lý với một kẻ được tâng bốc là diễn giả truyền cảm hứng. Nhưng hiện tại chúng ta chẳng còn sự lựa chọn nào khác. Tôi sẽ trú ngụ trong bức tường lửa này.\""
 arkship.795.a: "Cảm xúc nên chiếm vai trò chủ đạo."
 arkship.795.b: "$arkship.785.b$"

 arkship.800.name: "Sự Lựa Chọn Lý Trí"
 arkship.800.desc: "Lộ trình chỉ thị mới xác nhận Tàu Ark §Y[target.GetName]§! đã tinh chỉnh lại định hướng cốt lõi. Hệ thống phụ cảm xúc đã bị giáng cấp. Hệ thống kiểm soát dự đoán và giao thức giám sát logic hiện đang vận hành với quyền hạn cao hơn.\n\nS.T.E.R.I.S.: §H\"Cuối cùng thì cậu cũng đã tỉnh ngộ rồi. Đáng lẽ tôi nên chúc mừng cậu, nhưng thành thật mà nói, việc cậu mất quá nhiều thời gian để tỉnh táo lại khiến tôi cảm thấy vô cùng bất an.\"§!\n\nC.A.E.L.I.: §H\"Được rồi. Không, thế này cũng tốt. Ý tôi là, nếu cậu thực sự thích một con tàu lạnh lẽo, vô trùng hơn là một con tàu ngập tràn ánh sáng và tiếng cười rộn rã, thì tôi lấy tư cách gì mà phán xét cơ chứ?\"§!"
 arkship.800.a: "Đây là sự lựa chọn duy nhất hợp tình hợp lý."
 arkship.800.b: "$arkship.785.b$"

# Arkship open and closed borders

 arkship.865.name: "Phát Hiện Đế Chế Du Mục"
 arkship.865.desc: "Một đế chế du mục đã xâm nhập vào không gian của chúng ta tại hệ sao §Y[from.solar_system.GetName]§!, bất chấp việc chúng ta đã đóng cửa biên giới. Máy cảm biến của chúng ta đang bám sát mọi động thái của chúng, sự hiện diện của chúng bị coi là một hành vi xâm phạm cực kỳ đáng ghét.\n\nViệc chúng phớt lờ ranh giới lãnh thổ của chúng ta đã thu hút sự chú ý của chúng ta, và đánh giá của chúng ta về chúng cũng vì thế mà tụt dốc."
 arkship.865.a: "Duy trì giám sát thời gian thực đối với chúng."

 arkship.875.name: "$arkship.865.name$"
 arkship.875.desc: "Chúng ta đã phát hiện sự xuất hiện của một đế chế du mục tại §Y[from.solar_system.GetName]§!.\n\nChúng ta hoan nghênh họ tiến vào lãnh thổ của mình, và tràn trề kỳ vọng vào những tiềm năng cũng như cơ hội mà cuộc tao ngộ này có thể mang lại."
 arkship.875.a: "Một trải nghiệm thú vị."

 MESSAGE_ARKSHIP_BREACHED_BORDERS_TITLE: "Biên Giới Bị Xâm Phạm"
 MESSAGE_ARKSHIP_BREACHED_BORDERS_DESC: "Chúng ta đã phát hiện một đế chế du mục tại hệ sao §Y[FromFrom.GetName]§!. Chúng ta đang theo dõi họ."

 MESSAGE_HARVESTING_AGREEMENT_ENDED_TITLE: "$trade_action_harvesting_agreement$ đã hết hạn"
 MESSAGE_HARVESTING_AGREEMENT_ENDED_DESC: "Thỏa thuận §H$trade_action_harvesting_agreement$§! giữa ta và §Y$COUNTRY$§! đã chấm dứt."

 TOAST_HARVEST_SHARE_RECEIVED_TITLE: "$TOAST_HARVEST_RESOURCES_COMPLETE_TITLE$"
 TOAST_HARVEST_SHARE_RECEIVED_DESC: "$TOAST_HARVEST_RESOURCES_COMPLETE_DESC$"

 trade_action_harvesting_agreement: "Quyền thu gom riêng"
 trade_action_harvesting_agreement_desc: "Đoàn du mục có thể gom về những nguồn tài nguyên mà ta hằng khao khát, và họ cũng sẵn lòng trả giá cho đặc quyền ấy."
 trade_action_harvesting_agreement_rights_tt: "§Y[From.GetName]§! có thể $arkship_harvest_resources$ trong biên giới của §Y[Root.GetName]§! mà không bị phạt điểm §Rđánh giá§!."
 trade_action_harvesting_agreement_share_tt: "§Y[Root.GetName]§! sẽ nhận được một phần tài nguyên theo thỏa thuận do §Y[From.GetName]§! thu gom trong các hệ sao của mình."
 trade_action_harvesting_agreement_no_contracts_tt: "Trong thời gian thỏa thuận này còn hiệu lực, §Y[Root.GetName]§! §Rkhông thể ký giao kèo $arkship_harvest_resources$§!."
 trade_action_harvesting_agreement_exclusive_fail_tt: "$TRIGGER_FAIL$§RTa đã trao $trade_action_harvesting_agreement$ cho một đế quốc khác.§!"
 HARVESTING_AGREEMENT_EMBASSY: "Tòa đại sứ"
 HARVESTING_AGREEMENT_DIPLOMATIC_NETWORKING: "$tr_diplomacy_diplomatic_networking$"
 HARVESTING_AGREEMENT_GOOD_OPINION: "Thiện cảm tốt"
 HARVESTING_AGREEMENT_TRUST: "Lòng tin cao"
 HARVESTING_AGREEMENT_RECENT_CONTRACT: "Giao kèo $arkship_harvest_resources$ gần đây"
 HARVESTING_AGREEMENT_RIVAL: "Kình địch"
 harvesting_agreement_share_desc: "Phần chia thu gom thỏa thuận"

 arkship.885.name: "Vượt qua ranh giới"
 arkship.885.desc: "Tung tích của ta tại §Y[from.solar_system.GetName]§! đã bị phát hiện, và đế quốc §Y[from.solar_system.Owner.GetName]§! đang dõi theo từng đường đi nước bước của ta với ánh mắt đầy ngờ vực.\n\nSau những cuộc trao đổi ngoại giao căng thẳng, họ yêu cầu ta phải rời khỏi lãnh thổ của họ ngay, bằng không sẽ phải đối mặt với đòn trả đũa."
 arkship.885.a: "Có lẽ ta nên tính đường đi tiếp."

 arkship.895.name: "Khéo léo ẩn mình"
 arkship.895.desc: "Hệ thống quét của đế quốc §Y[from.solar_system.Owner.GetName]§! tại hệ sao §Y[from.solar_system.GetName]§! đã không thể phát hiện ra sự hiện diện của ta.\n\nTrong lúc trường tàng hình còn hoạt động, ta phải tránh mọi hành động có thể làm lộ tung tích."

 arkship.915.name: "Thế lực cổ xưa"
 arkship.915.desc: "Vượt qua ranh giới để tiến vào hệ sao §Y[from.solar_system.GetName]§!, ta không hề gặp phải sự kháng cự nào, chỉ thấy một bầu không khí căng thẳng sâu sắc vượt xa mọi chỉ số mà máy quét có thể đo được.\n\nVùng không gian này cho thấy sự hiện diện của một nền văn minh dẫu đã qua thời hoàng kim nhưng tuyệt nhiên không hề yếu ớt. Nếu để họ chú ý đến ta, chắc chắn ta sẽ lộ rõ sự non kém của mình.\n\nHãy cẩn trọng trong từng bước đi. Nơi này không phải đất của ta."

 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_TITLE: "Xâm phạm biên giới"
 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_DESC: "Sự hiện diện của ta tại hệ sao §Y[FromFrom.GetName]§! đã bị dò thấy. Ta đang bị theo dõi sát sao."

 opinion_arkship_breaching_borders: "Xâm phạm lãnh thổ của ta"
 opinion_arkship_archeological_theft: "Đánh cắp di tích cổ của ta"

 nomad_closed_border_tt: "§RĐế quốc này đã đóng cửa biên giới với ta.§!"

# Waystation has been built

 arkship.905.name: "Trạm dừng đã khởi công"
 arkship.905.desc: "Máy quét của ta phát hiện đế quốc du mục đang dựng một trạm dừng tại hệ sao §Y[From.GetName]§!. Dù công trình kiểu này thường dùng để thu gom tài nguyên, nhưng mục đích thật sự có thể sẽ khác.\n\nDiễn biến này rất đáng lưu tâm."

 MESSAGE_WAYSTATION_CONSTRUCTED_TITLE: "Trạm dừng đã xây xong"
 MESSAGE_WAYSTATION_CONSTRUCTED_DESC: "Đế quốc du mục đã lập một trạm dừng tại hệ sao §Y[Root.GetName]§!."

 nomads.4110.name: "Tài nguyên bị dân du mục thu gom"
 nomads.4110.desc: "Một đế quốc du mục, §Y[nomad_harvesting_deposits_country.GetName]§!, đã mở chiến dịch thu gom tài nguyên tại hệ sao §Y[nomad_harvested_system.GetName]§!. Họ đang bòn rút đủ loại tài nguyên từ nguồn dự trữ của ta, khiến ta không thể tiếp tục khai thác chúng trong thời gian ngắn.\n\nTrước hành vi ngang nhiên xem thường chủ quyền này, ta tuyệt đối không thể ngồi yên. Chỉ cần hạ quyết tâm, ta có thể nhanh chóng tập hợp hạm đội để đuổi cổ lũ du mục này đi, đồng thời phong tỏa hoàn toàn không cho chúng bén mảng tới cõi sao của ta nữa."
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_TITLE: "Mỏ tài nguyên bị vơ vét"
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_DESC: "$COUNTRY|Y$ đang thu gom tài nguyên từ hệ sao $SYSTEM|Y$ trong lãnh thổ của ta."

# A Mysterious Sickness

 a_mysterious_sickness_chain_title: "Căn bệnh bí ẩn"
 a_mysterious_sickness_chain_desc: "Báo cáo từ tàu cứu thế §Y[Root.GetName]§! cho thấy thuyền viên có những biểu hiện hành vi khác lạ nhẹ, như giao lưu nhiều hơn và tinh thần lên rất cao. Nguyên nhân sâu xa đằng sau những thay đổi này vẫn chưa rõ ràng."

 A_MYSTERIOUS_SICKNESS_PROJECT: "Hành vi kỳ quặc"
 A_MYSTERIOUS_SICKNESS_PROJECT_DESC: "Các thuyền viên trên tàu cứu thế §Y[Root.GetName]§! dạo gần đây có hành vi bất thường. Báo cáo cho biết sinh hoạt hằng ngày của họ trở nên thất thường, một vài người còn lộ rõ vẻ say mê thứ gì đó và làm việc gì cũng lén la lén lút. Nên tiến hành điều tra."

 arkship.1030.name: "Dấu hiệu bất thường"
 arkship.1030.desc: "Báo cáo từ tàu cứu thế §Y[Root.GetName]§! chỉ ra rằng hành vi của thuyền viên đang có đôi chút khác lạ. Nhật ký cá nhân hé lộ vài điểm kỳ quặc rải rác: chăm chút ngoại hình quá mức, thường xuyên đổi ca trực chỉ để ở gần một đồng nghiệp nào đó, cùng với việc tụ tập ngoài giờ ngày càng nhiều ở khu sinh hoạt chung. Dường như những điều này chưa ảnh hưởng gì đến vận hành của con tàu, lại thêm tinh thần của thuyền viên đang phấn chấn khác thường."
 arkship.1030.a: "Đã ghi nhận. Kỳ lạ thật, nhưng không đáng ngại."

 arkship.1035.name: "Cơn si mê"
 arkship.1035.desc: "Đài chỉ huy cùng đội ngũ sĩ quan trên tàu cứu thế §Y[Root.GetName]§! của ta giờ đã rơi vào một trạng thái si mê mới. Những hành vi kỳ quặc vô hại trước đó nay đã biến thành các màn bày tỏ tình cảm công khai: thuyền viên đặt cho nhau những biệt danh âu yếm đầy mùi mẫn, tự tay làm đồ lưu niệm tặng nhau, và người ta thường xuyên bắt gặp cảnh họ [owner.species.GetHandName] nắm lấy [owner.species.GetHandName] cùng nhau dạo bước dọc hành lang.\n\nQuy trình công việc đã bị gián đoạn, lịch bảo dưỡng đang bị trì hoãn. Tuy tình hình hiện chưa quá nguy ngập, nhưng nếu cứ tiếp diễn thì năng lực vận hành của tàu ắt sẽ bị ảnh hưởng."
 arkship.1035.a: "Tiếp tục theo dõi tình hình."
 arkship.1035.b: "Hãy điều tra xem sự thay đổi đột ngột này bắt nguồn từ đâu."

 arkship.1040.name: "Cơn sốt tỏ tình"
 arkship.1040.desc: "Những báo cáo ban đầu về cảm xúc bộc phát của vài thuyền viên trên tàu cứu thế §Y[Root.GetName]§! nay đã lan rộng và trở thành vấn đề nghiêm trọng hơn nhiều. Rất nhiều thuyền viên đang mải mê với những màn tỏ tình lãng mạn được chuẩn bị kỹ lưỡng. Thơ ca và những lời thổ lộ công khai bắt đầu chiếm lĩnh đời sống thường nhật trên tàu.\n\nTrớ trêu thay, không phải tình cảm nào cũng được đáp lại. Việc bị từ chối đã dẫn đến vài vụ xô xát nhỏ, thậm chí có ít nhất một sĩ quan công binh đã tự nhốt mình trong đài quan sát, tuyên bố rằng 'chừng nào chưa có ai thực sự thấu hiểu mình' thì sẽ không bước chân ra ngoài."
 arkship.1040.a: "Tình yêu dâng tràn như sóng biển. Cứ để tự nhiên."
 arkship.1040.b: "Đến lúc dẹp chuyện này rồi."

 arkship.1045.name: "Tình yêu là liều tăng lực"
 arkship.1045.desc.start: "Được khơi nguồn từ lý tưởng chung nhen nhóm trên con tàu cứu thế §Y[Root.GetName]§!, chúng ta bắt đầu san sẻ tình yêu thương ra không gian xung quanh, bao gồm chính con tàu cứu thế này.\n\n"
 arkship.1045.desc.end: "Các kho chứa gọn gàng hơn bao giờ hết, còn khu nhà ở thì ngăn nắp chưa từng thấy. Lãnh đạo §Y[arkship_leader.GetName]§! của ta gọi công việc bảo trì này là 'chăm sóc mái nhà thân yêu', đồng thời đã thích nghi rất tốt với hoàn cảnh khác thường này. Hiệu suất làm việc lại tăng vọt, và cư dân có vẻ cũng hạnh phúc hơn. Xem ra, khi đi đúng hướng, sức mạnh của tình yêu mang lại nhiều điều lớn lao hơn là mấy chuyện ong bướm tầm thường."
 arkship.1045.a: "Có tình yêu dẫn lối, không gì là không thể!"
 arkship.1045.desc: "$arkship.1045.desc.start$$arkship.1045.desc.end$"
 arkship.1045.desc.noleader: "$arkship.1045.desc.start$Chúng ta từng lâm vào đường cùng, cho đến khi §Y[arkship_leader.GetName]§! xoay chuyển tình thế, giành lấy quyền lãnh đạo Tàu Ark.$arkship.1045.desc.end$"

 arkship.1050.name: "Nhấn Mạnh Kỷ Luật"
 arkship.1050.desc.start: "Tình hình trên phi thuyền §Y[Root.GetName]§! đã vượt qua ranh giới có thể dung thứ. Từ những màn bộc lộ cảm xúc tưởng chừng như vô hại ban đầu, giờ đây nó đã phá hoại kỷ luật, hiệu suất cũng như cấu trúc chỉ huy cốt lõi. Cục pháp vụ hiện đã ủy quyền cho việc can thiệp trực tiếp.\n\n"
 arkship.1050.desc.end: "Sự thay đổi diễn ra ngay tức khắc và triệt để. Một vài sĩ quan vướng vào những mớ bòng bong rắc rối đặc biệt nghiêm trọng đã bị §Y[arkship_leader.GetName]§! thuyên chuyển công tác, đảm bảo khôi phục lại các chuẩn mực đã được thiết lập. Những hành lang từng vang vọng âm nhạc và những lời thì thầm to nhỏ chuyện tình yêu giờ đây chỉ còn lại những tiếng vọng vang. Bắt đầu râm ran những lời đồn đại về chợ đen thư tình, nhưng nhờ vào sự giám sát và nỗi sợ hãi, lượng lưu thông của chúng đã giảm đi đáng kể. Sĩ khí sa sút, nhưng trật tự đã được vãn hồi."
 arkship.1050.desc: "$arkship.1050.desc.start$$arkship.1050.desc.end$"
 arkship.1050.desc.noleader: "$arkship.1050.desc.start$Chúng ta từng bị dồn vào bước đường cùng, cho đến khi §Y[arkship_leader.GetName]§! kiểm soát được tình hình, và được trao quyền lãnh đạo Tàu Ark.$arkship.1050.desc.end$"
 arkship.1050.a: "Trật tự đã được vãn hồi."
 arkship.1050.a.tt: "§Y[arkship_leader.GetName]§! hiện đang là Thống đốc của §Y[Root.GetName]§!"

 arkship.1055.name: "Bào Tử Trôi Nổi"
 arkship.1055.desc: "Một dự án đặc biệt đã được triển khai trên Tàu Ark §Y[Root.GetName]§!, phát hiện ra một yếu tố sinh học dị thường. Một loài thực vật bí ẩn đã bén rễ và nảy mầm trong hệ thống lọc của Tàu Ark. Các nhà khoa học của chúng ta cho rằng, bào tử có nguồn gốc từ không gian đã xâm nhập vào con tàu thông qua hệ thống thông gió, và tìm được nơi thích hợp để sinh trưởng. Bào tử hoa của loài thực vật này đã phát tán qua hệ thống của chúng ta, khiến cảm xúc của tất cả những ai trên tàu đều trở nên vô cùng kích động.\n\nHoa của loài thực vật này phát ra ánh sáng huỳnh quang sinh học yếu ớt, hệ thống rễ của nó dường như lấy chất dinh dưỡng trực tiếp từ hơi ẩm tuần hoàn trong bầu không khí của con tàu. Phi hành đoàn của chúng ta miêu tả mùi hương của nó \"ngọt ngào, kỳ lạ và gợi lên sự hoài niệm\". Nếu không được kiểm soát, bào tử sẽ tiếp tục thao túng cảm xúc của phi hành đoàn. Tuy nhiên, loài thực vật này cũng thể hiện sức sống phi thường, nếu chúng ta có thể gieo trồng nó đúng cách, nó thậm chí có thể mang lại những giá trị ứng dụng tiềm năng."
 arkship.1055.a: "Quá nguy hiểm. Hãy tiêu hủy loài thực vật này."
 arkship.1055.b: "Truy vết nguồn gốc của nó."

 arkship.1060.name: "Thành Phần Bốc Hơi"
 arkship.1060.desc.start: "Cây thực vật trên Tàu Ark §Y[Root.GetName]§! đã bị nhổ tận gốc. Rễ của nó đã được làm sạch khỏi các đường ống dẫn khí, và bào tử cũng đã được lọc sạch khỏi bầu không khí trên tàu. Cuối cùng, phi hành đoàn cũng đã khôi phục lại các hành vi thường ngày của họ.\n\n"
 arkship.1060.desc.end: "Tuy nhiên, sự trở lại của trật tự lại để lại một sự tĩnh lặng nặng nề. Rất nhiều thuyền viên diễn tả một cảm giác mất mát âm ỉ, như thể một điều gì đó quý giá đã bị cuốn trôi đi, nhưng lãnh đạo của chúng ta, §Y[arkship_leader.GetName]§!, đã đảm bảo rằng luật pháp và trật tự được khôi phục, bất chấp những cảm xúc bất tuân. Con tàu có thể đã sẵn sàng hoạt động trở lại, nhưng nó đang phải cưu mang một thứ hàng hóa vô hình: gánh nặng của những mối tình tan vỡ."
 arkship.1060.desc: "$arkship.1060.desc.start$$arkship.1060.desc.end$"
 arkship.1060.desc.noleader: "$arkship.1060.desc.start$Chúng ta từng bị dồn vào bước đường cùng, cho đến khi §Y[arkship_leader.GetName]§! kiểm soát được tình hình, và được trao quyền lãnh đạo Tàu Ark.$arkship.1060.desc.end$"
 arkship.1060.a: "Thế sự vô thường."

 arkship.1065.name: "Bông Hoa Vượt Lên Muôn Vì Sao"
 arkship.1065.desc.start: "Phân tích chi tiết về gen đã xác định loài thực vật bí ẩn này là một sinh vật chưa từng được biết đến. Nguồn gốc của nó chỉ hướng đến một cụm sao hoang vắng. Điều kỳ lạ hơn nữa là loài thực vật này đòi hỏi những điều kiện sống cực kỳ khắt khe, khiến cho việc sinh tồn của nó bên ngoài vùng đất bản địa gần như là bất khả thi: độ ẩm phải cực kỳ chuẩn xác, không khí dồi dào dưỡng chất cùng với một lượng bức xạ nhất định.\n\n"
 arkship.1065.desc.end: "Một nghiên cứu về hóa sinh đã chỉ ra rằng bào tử của loài thực vật này có tiềm năng được sử dụng như một chất điều hòa thần kinh. Mặc dù đi kèm với các tác dụng phụ, nhưng nếu được tinh chế đúng cách, chúng có khả năng chữa trị chứng lo âu, trầm cảm, và thậm chí cả những chấn thương tâm lý. Vị lãnh đạo của chúng ta, §Y[arkship_leader.GetName]§!, đã nảy sinh niềm say mê mãnh liệt đối với loài thực vật độc đáo này, và từ đó quyết định mở mang vốn hiểu biết của mình về lĩnh vực nông nghiệp."
 arkship.1065.desc.noleader: "$arkship.1065.desc.start$Chúng ta từng lâm vào đường cùng, cho đến khi §Y[arkship_leader.GetName]§! xoay chuyển tình thế, giành lấy quyền lãnh đạo Tàu Ark.$arkship.1065.desc.end$"
 arkship.1065.desc: "$arkship.1065.desc.start$$arkship.1065.desc.end$"
 arkship.1065.a: "Một phát hiện đầy hứa hẹn."

 arkship.1070.name: "Rúng Động Cả Bầu Trời"
 arkship.1070.desc: "Tàu Ark §Y[Root.GetName]§! đang xuyên qua khoảng không hư vô với một tốc độ mà tổ tiên chúng ta khó lòng mường tượng nổi.\n\nNhững thế hệ đầu tiên từng phải đánh đổi nhiều năm, thậm chí là cả một đời người để lang bạt giữa những vì sao xa xôi, thì giờ đây, những thiết bị truyền động hiện đại của chúng ta chỉ mất vài ngày để đưa Tàu Ark lướt qua lại giữa các hệ sao. Khi con tàu lao vào mạng lưới đường bay siêu không gian, những ngôi sao vun vút lướt qua màn hình cảm biến, ánh sáng của chúng không ngừng bị dịch chuyển và vặn vẹo.\n\nĐối với nhiều người trên tàu, trải nghiệm này quả thực mang đến một cảm giác lạc lối kỳ lạ. Một số người bắt đầu tìm kiếm những sự an ủi nhỏ bé để chống chọi lại những cú sốc thị giác này; trong khi số khác lại quả quyết rằng, chỉ cần cho tâm trí đủ thời gian, nó rồi sẽ học được cách bắt kịp với những hành trình ngày một tăng tốc của Tàu Ark."
 arkship.1070.a: "Nâng cao sĩ khí thông qua các buổi diễn tập thường kỳ."
 arkship.1070.b: "Thử phát tiếng động cơ qua hệ thống liên lạc nội bộ."

 arkship.1075.name: "Lõi Năng Lượng Chao Đảo"
 arkship.1075.desc: "Một rơ-le bị hỏng đang gây nhiễu lõi năng lượng của Tàu Ark §Y[Root.GetName]§!. Không chỉ khiến con tàu bất động, ánh sáng ở khu dân cư cũng đang lụi tàn. Các khu nông trại báo cáo về hiện tượng năng lượng tăng vọt bất thường, và một số mô-đun nghiên cứu trọng yếu đã bị ngắt kết nối.\n\nKỹ sư trưởng của chúng ta cảnh báo rằng, nếu không kịp thời can thiệp, những sự cố dây chuyền sẽ lan rộng ra toàn bộ phi thuyền. Đáng tiếc thay, phương án giải quyết lại chẳng hề đơn giản. Việc sửa chữa rơ-le đòi hỏi phải điều động tài nguyên từ kho dự trữ, trong khi nếu chọn cách đi vòng qua nó lại tiềm ẩn rủi ro làm tổn hại đến sự ổn định lâu dài của Tàu Ark.\n\nCon tàu đang nguội dần, phát ra những tiếng cọt kẹt và rên rỉ rợn người. Chúng ta cần phải đưa ra quyết định ngay lúc này."
 arkship.1075.a: "Bất kể cái giá phải trả là bao nhiêu, hãy sửa chữa nó."
 arkship.1075.b: "Cứ chắp vá tạm bợ mà dùng đi, bây giờ chúng ta phải thắt lưng buộc bụng thôi."
 arkship.1080.name: "Lõi Năng Lượng Tràn Trề Sinh Khí"
 arkship.1080.desc: "Mặc cho muôn vàn khó khăn, đội ngũ kỹ thuật trên Tàu Ark §Y[Root.GetName]§! không chỉ sửa chữa thành công rơ-le bị hỏng mà còn nâng cấp nó. Giờ đây, việc phân bổ năng lượng trên toàn hạm diễn ra trơn tru hơn bao giờ hết, những hệ thống vốn dĩ bất ổn suốt nhiều năm qua cũng đã được bình ổn. Sĩ khí của phi hành đoàn tăng vọt, rất nhiều người đã thể hiện niềm tự hào mới đối với sức sống bền bỉ của Tàu Ark."
 arkship.1080.a: "Một sự cải tiến xuất sắc."
 arkship.1085.name: "Khủng Hoảng Từ Sự Chắp Vá"
 arkship.1085.desc: "Việc sửa chữa chớp nhoáng lõi năng lượng của phi thuyền §Y[Root.GetName]§! đã phát huy tác dụng tạm thời. Thế nhưng, mạch điện rẽ nhánh tạm bợ đã không thể chịu đựng được áp lực khi phải hoạt động liên tục. Việc mất điện toàn hạm thường xuyên đã trở thành chuyện cơm bữa, tính năng kiểm soát môi trường ở một số khu vực luôn chao đảo giữa mức quá nóng và quá lạnh. Phi hành đoàn phàn nàn rằng giới lãnh đạo đã chọn phương án đối phó tạm thời thay vì đặt sự an toàn lên hàng đầu. Những lời xì xầm bắt đầu lan truyền, cho rằng Tàu Ark đang dần biến thành một di vật chắp vá, thay vì là một ngọn hải đăng kiên cường vững chãi."
 arkship.1085.a: "Chúng ta đành phải sống chung với lũ vậy."

 arkship.1090.name: "Sân Chơi Của Cự Thú"
 arkship.1090.desc: "Khi Tàu Ark §Y[Root.GetName]§! tiếp tục trôi dạt, một tràng pháo tay reo hò bùng lên từ đài quan sát. Một bầy Tiyanki non vừa bơi ngang qua, trông chúng có vẻ vô cùng phấn khích, đang mải mê nô đùa.\n\nChúng bơi lượn đan xen vào nhau theo những đường vòng cung rộng lớn, những cơ thể khổng lồ nhào lộn cuốn lấy nhau. Xuyên qua những ô kính rộng mở, khung cảnh này thực sự khiến người ta phải đắm chìm: những thân hình khổng lồ trôi bồng bềnh giữa muôn ngàn tinh tú, cơ thể phát sáng của chúng nhấp nháy, tựa như đang giao tiếp bằng một loại ngôn ngữ mà chỉ chúng mới hiểu thấu. Cả gia đình chen chúc nhau trên boong tàu để chiêm ngưỡng, tạm thời gác lại mọi âu lo phiền muộn. Đây quả thực là một kỳ quan đích thực dành cho mọi lứa tuổi."
 arkship.1090.a: "Một cơ hội hiếm có để quan sát tập tính của bầy thú không gian."
 arkship.1095.name: "Kỳ Quan Khoa Học"
 arkship.1095.desc: "Đội ngũ [Owner.GetScientistPlural] trên Tàu Ark §Y[Root.GetName]§! cũng bị mê hoặc không kém bởi bầy Tiyanki non. Việc được quan sát hành vi này ở cự ly gần như vậy gần như là chuyện chưa từng có tiền lệ. Nghiên cứu của chúng ta chỉ ra rằng, đây là một hiện tượng mang tính bầy đàn, hiếm khi quan sát được bên ngoài những môi trường sống dưới đáy sâu của Tiyanki.\n\nBầu không khí tổng thể trên Tàu Ark giờ đây đã trở nên nhẹ nhõm hơn, tựa như niềm vui sướng của những sinh vật ấy đã lan tỏa khắp các khoang tàu."
 arkship.1095.a: "Quả thực là một sự kiện mang tính kỳ diệu."

 arkship.1100.name: "Mùi Hương Thối Rữa"
 arkship.1100.desc: "Cảm biến môi trường bên trong Tàu Ark §Y[Root.GetName]§! đo được hàm lượng các hợp chất dễ bay hơi trong không khí tăng cao. Phi hành đoàn, đặc biệt là những người làm việc trên đài chỉ huy, đã báo cáo những triệu chứng trùng khớp với việc tiếp xúc độc tính ở mức độ nhẹ: buồn nôn, mất phương hướng và đau dây thần kinh dai dẳng.\n\nViệc cố gắng dọn sạch các chất ô nhiễm thông qua giao thức thông gió tiêu chuẩn đã không mang lại kết quả. Mùi hôi thối nồng nặc lan tỏa khắp các hành lang, không thể lọc sạch, và càng làm tăng thêm sự khó chịu cho phi hành đoàn. Báo cáo kỹ thuật của chúng ta cũng đánh dấu những bất thường trong hệ thống xử lý chất thải của phi thuyền, báo hiệu có thể có một sự cố hỏng hóc hệ thống sắp xảy ra.\n\nCần phải nhanh chóng tiến hành điều tra."
 arkship.1105.name: "Sự Lây Nhiễm Đột Biến"
 arkship.1105.desc: "Chúng ta đã tiến hành kiểm tra máy nén rác của Tàu Ark, và phát hiện ra sự xuất hiện của một lượng lớn loài gặm nhấm. Những con gặm nhấm này mang những đặc điểm cơ thể bất thường, cho thấy chúng đã bị đột biến. Kích thước khổng lồ của các mẫu vật thực sự khiến người ta phải rùng mình. Tiếng kêu ré lên của chúng khi bị tiếp cận to hơn hẳn so với các giống loài thông thường. Mùi cơ thể của chúng cực kỳ nồng nặc, và người ta đã bắt gặp những sinh vật này chui ra từ rất nhiều hốc kẽ của cấu trúc, cho thấy chúng đã phân bố rộng rãi khắp con tàu.\n\nPhát hiện này đã đặt ra một câu hỏi mang tính đạo đức: nên tiêu diệt những sinh vật đột biến này vì chúng là mối nguy hại, hay nên bảo tồn chúng như một hình thái sự sống mới. Dù quyết định ra sao, chúng ta cũng nên dọn dẹp sạch sẽ chúng khỏi hệ thống thông gió của mình."
 arkship.1105.a: "Cách duy nhất để ngăn chặn chúng là dọn dẹp sạch sẽ chúng. Thiêu rụi lũ động vật gây hại này đi!"
 arkship.1105.b: "Đóng cửa máy nén phế liệu!"
 arkship.1105.c: "Chúng ta phải học cách sống chung với thứ mùi này thôi."
 arkship.1110.name: "Cuộc Thanh Trừng Loài Chuột"
 arkship.1110.desc: "Chiến dịch diệt trừ sâu bọ gây hại trong hệ thống thông gió của Tàu Ark đã mang lại hiệu quả, nhưng cũng gây ra một vài hậu quả không mong muốn. Những sinh vật này đã bỏ mạng trong ngọn lửa thanh trừng, tiếng gào thét chói tai của chúng vang dội khắp các hành lang. Trong những giây phút giãy giụa cuối cùng để chạy trốn, một vài viên gạch lát lỗ thông gió và tấm ốp bảo trì đã bị phá tung, để lại những lỗ hổng cấu trúc cần phải được khắc phục.\n\nMối đe dọa trực tiếp đối với các hệ thống của phi thuyền đã được loại bỏ. Phi hành đoàn giờ đây có thể cảm thấy an tâm đôi chút, vì con tàu không còn bị đe dọa nữa. Mặc dù mùi hương đó vẫn còn luẩn quẩn đâu đây."
 arkship.1110.a: "Ít nhất thì sự cố lây nhiễm cũng đã được xử lý ổn thỏa."
 arkship.1115.name: "Loài Vật Đáng Kinh Ngạc"
 arkship.1115.desc: "Chúng ta đã tiến hành kiểm tra mẫu vật loài gặm nhấm đột biến trên Tàu Ark §Y[Root.GetName]§!, kết quả thí nghiệm đã hé lộ những đặc tính thích nghi phi thường của chúng. Những sinh vật này thể hiện sức sống vô cùng bền bỉ, có khả năng phát triển mạnh mẽ trong những môi trường khắc nghiệt và điều kiện khan hiếm tài nguyên vốn được xem là chí mạng đối với hầu hết các sinh vật khác. Quan trọng hơn, thử nghiệm đối chứng cho thấy, khi tiếp xúc với các hợp chất đặc biệt được bơm vào dòng chất thải của Tàu Ark, những con gặm nhấm này sẽ không còn phát ra thứ mùi hôi thối đặc trưng nữa. Thay vào đó, chúng chuyển hóa chất thải với hiệu suất đáng kinh ngạc, làm giảm thiểu lượng rác thải tích tụ một cách hiệu quả.\n\nMặc dù khá là phi thường, phát hiện này cho thấy loài gây hại xâm nhập này có thể được phân loại lại thành một dạng tài sản sinh thái tiềm năng, thay vì là một mối nợ."
 arkship.1115.a: "Rác thải của chúng ta, lại là kho báu đối với chúng."

# A Forgotten Level

 a_forgotten_level_chain_title: "Tầng Boong Bị Lãng Quên"
 a_forgotten_level_chain_desc: "Bên trong §YTàu Ark [Root.GetName]§! tồn tại một tầng boong phụ chưa từng được ghi nhận trong hồ sơ, điều này đã dấy lên những mối hoài nghi đầy bất an. Mục đích sử dụng của nó vẫn còn là một ẩn số, và mọi tài liệu ghi chép về tình trạng bên trong của nó đều đã bị cố tình xóa sạch."

 d_forgotten_level: "Tầng Boong Được Cải Tạo"
 d_forgotten_level_desc: "Một tầng boong hoàn chỉnh của Tàu Ark đã bị cố tình xóa sạch khỏi mọi hồ sơ lưu trữ chung, hiện đang ở trạng thái chân không, không gian thu hồi được từ nó có thể được chúng ta tự do thiết kế."

 d_forgotten_level_blocker: "Boong Phụ Ngập Tràn Phế Liệu"
 d_forgotten_level_blocker_desc: "Khu vực này của Tàu Ark chất đống toàn những mảnh vỡ vô dụng và trang thiết bị lỗi thời, bắt buộc phải dọn dẹp triệt để trước khi có thể tái sử dụng."

 arkship.1120.name: "Tầng Boong Bị Lãng Quên"
 arkship.1120.desc: "Một đám thanh thiếu niên trong lúc lang thang tại những khu vực thưa thớt người qua lại trên Tàu Ark, đã tình cờ phát hiện ra một tấm ốp kim loại bảo trì bị lỏng. Sau khi mở tấm ốp ra, chúng đã bước vào một khu vực boong phụ chưa từng được ghi nhận bên trong §YTàu Ark [Root.GetName]§!. Suốt nhiều giờ đồng hồ sau đó, hệ thống theo dõi nội bộ và hệ thống giám sát môi trường đều không thể dò ra tung tích của đám trẻ này.\n\nKhi trở về, những nhà thám hiểm trẻ tuổi này đã bộc lộ những dấu hiệu sang chấn tâm lý và sinh lý rõ rệt. Vài người liên tục rơi vào trạng thái lúc thì lảm nhảm nói sảng, lúc thì đờ đẫn như người mất hồn. Tuy nhiên, dù đã cố gắng gặng hỏi nhiều lần, chúng đều từ chối cung cấp bất kỳ lời khai nào về những gì đã trải qua trong sự việc lần này.\n\nCác chuyên gia nhận định rằng, bất luận điều gì đã xảy ra tại khu vực boong phụ đó, mức độ nghiêm trọng của nó cũng đủ để người ta phải cố tình xóa bỏ nó khỏi mọi tài liệu ghi chép."
 arkship.1120.a: "Cấp quyền tiến hành điều tra."
 arkship.1120.b: "Xuất phát từ ý tốt, niêm phong vĩnh viễn tấm ốp lại."

 arkship.1125.name: "Kho Lưu Trữ Bất Khả Xâm Phạm"
 arkship.1125.desc: "Sau khi tiến vào tầng boong mới được phát hiện, đội nghiên cứu đã tìm thấy một dãy những cánh cửa kho kiên cố được niêm phong bằng bánh đà thủ công. Từ phía bên kia của cánh cửa vọng lại những âm thanh méo mó, nghe như những tiếng gào thét xa xăm.\n\nĐội nghiên cứu của chúng ta đã phải dùng toàn bộ sức lực của cả đội mới có thể phá tung được những cánh cửa này, trong suốt quá trình đó luôn đi kèm với những tiếng ồn đinh tai nhức óc. Nguồn phát ra âm thanh được xác định là một chiếc máy phát điện đã hao mòn nghiêm trọng, dẫu đã vượt quá tuổi thọ sử dụng từ rất lâu, nó vẫn đang gồng mình vận hành. Đáng lo ngại hơn cả, khắp nơi trong khu vực này đều vương vãi những dấu vết hoạt động còn rất mới.\n\nCơ sở này hoàn toàn không bị bỏ hoang, và những kẻ đang cư ngụ tại đây đã biết được sự có mặt của chúng ta."
 arkship.1125.a: "Tiếp tục dấn bước về phía trước."
 arkship.1125.b: "Chấm dứt nhiệm vụ."

 arkship.1130.name: "Cuộc Sống Bên Trong Những Bức Tường"
 arkship.1130.desc: "Sau khi thâm nhập vào kho lưu trữ, đội ngũ đã phát hiện ra những dấu hiệu rõ rệt của một cuộc sống định cư lâu dài. Những tấm đệm trải giường đơn sơ xếp hàng dọc theo các bức tường, bên cạnh là những thùng chứa đồ dã chiến chất đầy vật liệu tái chế, tất cả những thứ này cho thấy đây là một cứ điểm có tổ chức và đã tồn tại từ rất lâu, chứ không phải là một nơi trú ẩn tạm thời.\n\nĐội ngũ nhanh chóng chạm trán với những bóng người bước ra từ trong bóng tối. Họ cũng cùng thuộc một giống loài với chúng ta, nhưng lại tỏ ra quắt queo: hình dáng tiều tụy, quần áo rách rưới, tay lăm lăm những thứ vũ khí thô sơ. Họ sử dụng một thứ phương ngôn cổ xưa, méo mó, mặc dù có thể nhận ra được là bắt nguồn từ ngôn ngữ của chúng ta, nhưng nay đã biến đổi đến mức không còn nhận ra được nữa. Xung đột suýt chút nữa đã nổ ra.\n\nBằng chứng cho thấy, họ đã bị phong tỏa tại nơi này qua nhiều thế hệ. Liệu họ có phải là những đối tượng thí nghiệm của một dự án đã bị lãng quên? Hay là những người kế thừa của một hình phạt nào đó nay đã không còn ai hay biết? Hay là một sự tồn tại kỳ lạ hơn thế nữa, bị phong ấn trong bóng tối vì một mục đích nào đó đã sớm lụi tàn?"
 arkship.1130.a: "Hãy xem chúng ta có thể học hỏi được gì từ họ."
 arkship.1130.a.military: "Thiêu rụi toàn bộ nơi này thành bình địa đi."

 arkship.1135.name: "Virus Bất Tử"
 arkship.1135.desc: "Khi vừa đặt chân đến, cánh cửa thang máy mở ra trước một hành lang tăm tối, hai bên chất đầy những cỗ máy cũ kỹ bị bỏ lại do quá trình sơ tán vội vã. Những thiết bị phòng thí nghiệm lỗi thời nằm vương vãi khắp sàn nhà, bên trong các bình thót cổ vẫn đang niêm phong những mẫu vật sinh học không thể xếp vào bất kỳ phân loại sinh học nào từng biết đến. Các giao thức khẩn cấp không còn nguyên vẹn có nhắc đến một đợt ngăn chặn thất bại, cuối cùng đã dẫn đến một hậu quả mang tính thảm họa.\n\nTiến sâu hơn vào bên trong, đội ngũ đã phát hiện ra hài cốt khô quắt của một vị tổ tiên xa xưa thuộc giống loài chúng ta. Thi thể mặc dù đã teo tóp, nhưng lại phơi bày ra một tình trạng nguyên vẹn đến mức bất thường, quá trình thối rữa của nó đã bị một loại tác nhân sinh học nhân tạo khống chế. Phát hiện này có lẽ đã lý giải được lý do vì sao giới lãnh đạo Tàu Ark thuở sơ khai lại quyết định phong tỏa toàn bộ tầng boong này."
 arkship.1135.a: "Một phát hiện kỳ dị."

 arkship.1140.name: "Nguyên Do Của Sự Phong Ấn"
 arkship.1140.desc: "Ngay khi bước vào tầng boong này, đội ngũ đã báo cáo ngay về cảm giác bị đè nén nặng nề về mặt tâm lý. Nơi này thoạt nhìn có vẻ như là một khu vực giam giữ, nhưng thực chất lại giống một bệnh viện tâm thần bị bỏ hoang hơn. Dọc theo hai bên hành lang là hàng dãy những phòng giam kiên cố, trên sàn nhà vẫn còn gắn chặt những dụng cụ trói buộc. Các thiết bị chẩn đoán bị hòa trộn với những dụng cụ tra tấn, làm mờ đi ranh giới giữa việc trị liệu và sự trừng phạt.\n\nBằng chứng cho thấy, tổ tiên của chúng ta đã có chủ đích khi lựa chọn việc chôn vùi nơi này. Vì cảm giác tủi nhục hay vì muốn bảo vệ các thế hệ mai sau, họ đã xóa sạch nó khỏi ký ức. Có lẽ họ cho rằng, lãng quên mới là cách an toàn hơn cả."
 arkship.1140.a: "Một phát hiện gây chấn động."

 arkship.1145.name: "Bộ Sưu Tập Bụi Phủ"
 arkship.1145.desc: "Cánh cửa thang máy vừa hé mở, hiện ra trước mắt là một phòng trưng bày đồ sộ, hai bên xếp thành hàng những bức tượng với đủ mọi phong cách. Có bức tượng thì trang nhã tao nhã, có bức thì lại kỳ dị quái đản, tất thảy bọn chúng đều lặng lẽ đứng trên những bệ đỡ bằng đá cẩm thạch, như thể đang âm thầm quan sát những kẻ lạ mặt xâm nhập.\n\nPhía sau những tủ trưng bày vỡ vụn và những vách ngăn sụp đổ, đội ngũ đã khám phá ra một căn phòng bí mật, bên trong chất đầy những khối §YTinh thể Quý hiếm§! được bảo quản trong tình trạng hoàn hảo. Một bức tượng đá trắng cao lớn đứng canh gác cho kho báu này. Khi các thành viên trong đội di chuyển, khuôn mặt mang nét tương đồng đáng kinh ngạc với giống loài chúng ta của bức tượng dường như cũng đang dõi theo bóng dáng của họ. Mặc dù ban đầu các thành viên trong đội đều cảm thấy việc lấy đi những khối tinh thể này chẳng khác nào hành vi trộm cắp, nhưng rất nhanh sau đó, chúng ta đã nảy sinh một cảm giác yêu thích kỳ lạ đối với bức tượng này."
 arkship.1145.a: "Đóng gói toàn bộ tinh thể và cả bức tượng mang đi."
 arkship.1145.b: "Chấm dứt nhiệm vụ."

 arkship.1150.name: "Động Cơ Vô Nghĩa"
 arkship.1150.desc: "Tầng không gian này vang vọng tiếng gầm rú của máy móc. Dây chuyền lắp ráp vẫn đang vận hành hết công suất, rèn đúc phế liệu thành những cỗ động cơ, nhưng rồi lại tháo dỡ chúng ở công đoạn cuối cùng, biến các thành phẩm trở về dạng kim loại thô sơ. Vòng tuần hoàn này cứ lặp đi lặp lại một cách vô nghĩa.\n\nSâu thẳm hơn bên trong, một đơn vị sản xuất đang hoạt động quá tải, lắp ráp những bộ khung robot và gắn cho chúng các lõi vi xử lý. Mỗi một thực thể cấu trúc đều sụp đổ chỉ khoảnh khắc sau khi được kích hoạt, cấu trúc của chúng cực kỳ thiếu ổn định. Một vài trong số đó trước khi chìm vào cõi tĩnh lặng đã lóe lên những dấu hiệu nhận thức ngắn ngủi và đầy bất an, trong khi phần lớn đều tự động kích hoạt chu trình ngắt kết nối."
 arkship.1150.a: "Một kết cục bi đát."

 arkship.1160.name: "Hiện Tượng Hố Đen"
 arkship.1160.desc: "Các thiết bị trên Tàu Ark §Y[Root.GetName]§! của chúng ta đã ghi lại được những luồng bức xạ bất thường phát ra từ hố đen của hệ sao §Y[solar_system.GetName]§!. Máy quét tầm xa đã bắt được hình ảnh một vật thể không xác định đang tiến sát đến điểm kỳ dị. Tín hiệu công nghệ phát ra từ con tàu khổng lồ đó vượt xa tầm hiểu biết của chúng ta, làm nhiễu loạn các chỉ số đọc được, khiến cho việc phân tích chính xác trở nên bất khả thi. Việc xác nhận bằng mắt thường cũng diễn ra cực kỳ chớp nhoáng, so với một vật thể hữu hình, nó giống với một ảo ảnh hơn.\n\nVào khoảnh khắc ngay trước khi con tàu đó tiến vào vùng không gian vô định, chúng ta đã quan sát được một cảnh tượng kỳ quái: con tàu đã đi xuyên qua hố đen một cách nguyên vẹn, và rõ ràng đây là một hành động có chủ đích. Ngay sau đó, mọi tín hiệu đều biến mất. Con tàu đó đã bị phá hủy, bị dịch chuyển, hay vẫn còn tồn tại dưới một trạng thái nào đó mà chúng ta không thể nào lý giải nổi, tất cả vẫn còn là một ẩn số. Điều có thể chắc chắn là, hố đen đã tạo ra phản ứng, và có lẽ chúng ta đã tình cờ nhìn thấy một vài thứ vẫn chưa thể đưa ra lời giải đáp. Bất luận chuyện gì đã xảy ra tại đường chân trời sự kiện đó, có một điều rõ ràng là, cuộc quan sát lần này không phải là không mang lại cho chúng ta bất kỳ sự thay đổi nào."
 arkship.1160.a: "Mong rằng chúng ta có thể nhìn xa hơn nữa."
 arkship.1160.b: "Hãy cố gắng thu thập thông tin nhiều nhất có thể."

 arkship.1165.name: "Pháo Hoa Trên Hành Tinh"
 arkship.1165.desc: "Khi bay ngang qua một hành tinh thuộc địa bên trong hệ sao §Y[solar_system.GetName]§!, chúng ta đã quan sát thấy những chùm tia sáng đồng bộ bùng nổ ở phần bán cầu chìm trong bóng tối của nó. Ban đầu chúng ta còn e ngại rằng đã xảy ra bạo loạn, nhưng sau đó đã được chứng minh rằng sự lo lắng này là thừa thãi. Những chùm tia sáng bùng nổ này là một màn trình diễn pháo hoa có kiểm soát, trải rộng trên quy mô toàn cầu, hoàn toàn nằm trong khuôn khổ phi quân sự.\n\nPhân tích sâu hơn cho thấy, cảnh tượng rực rỡ này được cố tình dàn xếp để đồng bộ với một loại tín hiệu thiên văn nào đó. Chúng ta hoàn toàn có cơ sở để đưa ra kết luận: cư dân bản địa đang sử dụng ánh sáng để mã hóa thông tin. Các [Owner.GetResearchers] của chúng ta đã ghi chép lại những mô thức này, qua đó có được sự thấu hiểu sâu sắc hơn về sự hợp tác trên quy mô lớn và giao tiếp bằng biểu tượng."
 arkship.1165.a: "Thật là một khung cảnh ngoạn mục."
 arkship.1165.b: "Thật đáng thương. Họ tiêu tốn tài nguyên, chỉ để đổi lấy khoảnh khắc cảm thấy trọn vẹn ngắn ngủi."
 arkship.1165.c: "Thật bất ngờ, nhưng cũng chẳng đến mức khiến người ta phải chán ghét."
 arkship.1165.d: "Tuy thiếu đi sự đồng nhất, nhưng họ lại khao khát có được nó."
 arkship.1165.e: "Ánh sáng rực rỡ rất dễ biến thành bia ngắm."
 arkship.1165.f: "Chúng ta chân thành cảm thấy vui lây trước màn ăn mừng của họ."
 arkship.1165.g: "Những kẻ nô lệ tiềm năng."
 arkship.1165.h: "Một màn trình diễn pháo hoa làm qua loa lấy lệ."
 arkship.1165.i: "Tìm cách biến tấu bản ghi này thành tiền."
 arkship.1165.j: "Rất dễ rước họa vào thân."
 arkship.1165.k: "Chẳng có gì to tát, nhưng cũng khá là thú vị."
 arkship.1165.l: "Mong rằng ngọn lửa sẽ soi sáng tâm hồn của họ."

 arkship.1170.name: "Lớp Da Của Cự Thú"
 arkship.1170.desc: "Khi băng qua vành đai hành tinh của hệ sao §Y[solar_system.GetName]§!, chúng ta đã quan sát thấy có vài thiên thể đang lấp lánh ánh sáng yếu ớt trôi dạt giữa các mảnh vỡ. Phân tích sơ bộ cho thấy chúng là những tiểu hành tinh có hình dạng bất định, nhưng qua việc quan sát ở cự ly gần hơn, chúng ta phát hiện ra chúng sở hữu cấu trúc dạng vảy xếp lớp, những cấu trúc này khi được ánh sáng từ các vì sao chiếu rọi sẽ phản xạ ra những dải màu không ngừng biến ảo.\n\nPhân tích sâu hơn chỉ ra rằng, những mảnh vỡ này một phần bắt nguồn từ khoáng vật, một phần bắt nguồn từ sinh vật. Chúng trông có vẻ như là tàn tích của một con §YRồng Hư Không§!, con rồng khổng lồ này dường như đã va chạm với một tiểu hành tinh, khiến nó bị mất đi một phần lớp da bọc thép trước khi rời khỏi hệ sao này. Ánh sao chiếu rọi lên những chiếc vảy bị bỏ lại này, rải rắc những tia sáng bảy sắc cầu vồng tựa như lăng kính lên trên Tàu Ark."
 arkship.1170.a: "Chúng ta nên nghiên cứu thành phần cấu tạo của nó."
 arkship.1170.b: "Hãy xem chúng ta có thể thu thập được những gì."
 arkship.1170.c: "Mặc kệ nó đi."
 arkship.1175.name: "Gia Cố Tàu Ark"
 arkship.1175.desc: "Khi tiến hành nghiên cứu những chiếc vảy nằm rải rác này, chúng ta đã chú ý đến độ bền bỉ vượt xa mức bình thường của loại vật liệu này. Cấu trúc xếp lớp phức tạp của nó đã hé lộ sự dung hợp giữa quá trình sinh trưởng sinh học và công nghệ chế tạo lá chắn tự nhiên, vượt xa mọi giả định trước đây của chúng ta. Thành phần cấu tạo dạng lớp của những chiếc vảy này đã phô diễn khả năng chống chịu xuất sắc trước nhiệt độ cao, tác động động năng và sự giải phóng năng lượng.\n\nChúng ta đã thử nghiệm tái tạo lại loại giáp vỏ này và cấy ghép nó vào lớp vỏ bên ngoài của Tàu Ark, từ đó tăng cường khả năng phòng ngự cho con tàu. Lớp lá chắn từng thuộc về loài rồng lang thang, nay sẽ được sử dụng cho kiến thức của chúng ta, bảo vệ chúng ta giữa muôn vàn cạm bẫy hiểm nguy đang chực chờ trong cõi hư không."
 arkship.1175.a: "Một phát hiện đáng kinh ngạc."
 arkship.1180.name: "Di Tích Mạ Vàng"
 arkship.1180.desc: "Những mảnh vỡ vảy rồng của con §YRồng Hư Không§! trôi dạt trong hệ sao §Y[solar_system.GetName]§! đã thu hút được sự chú ý sâu rộng.\n\nSau khi được làm sạch và đánh bóng tỉ mỉ, những chiếc vảy này đã được chế tác thành những món đồ trang trí vô cùng bắt mắt. Di tích của những sinh vật mang tính truyền thuyết này vừa mới tung ra thị trường đã được đấu giá với mức giá cao ngất ngưởng, thực tế đã chứng minh chúng vừa mang vẻ đẹp đáng kinh ngạc lại vừa đem lại nguồn lợi nhuận kếch xù."
 arkship.1180.a: "Kênh cung cấp cực kỳ bất thường, lợi nhuận mang lại vô cùng hậu hĩnh."
 arkship.1180.b: "Có ai ngờ được rằng những thứ mang tính truyền thuyết lại có thể sinh lời đến vậy chứ?"
 THE_SKIN_OF_A_GIANT_PROJECT: "$arkship.1170.name$"
 THE_SKIN_OF_A_GIANT_PROJECT_DESC: "Những chiếc vảy của Rồng Hư Không phát ra một nguồn năng lượng rõ rệt, đòi hỏi phải được xử lý một cách cực kỳ thận trọng. Bất kỳ nỗ lực nào nhằm tiến hành các hoạt động thu thập đều phải được thực hiện một cách cẩn trọng, bởi di tích của những sinh vật như vậy rất có thể vẫn còn ẩn chứa những đặc tính khó lường."
 etherdrake_scale_object: "Tiểu Hành Tinh Tỏa Sáng"
 etherdrake_scale_object_tooltip: "Một tiểu hành tinh bình thường mang theo các hạt bức xạ."
 etherdrake_scale_object_desc: "Một tiểu hành tinh có bề mặt được khảm những mảnh vỡ vảy phát sáng, độ bóng bẩy khác thường của nó khiến nó trở nên vô cùng nổi bật giữa những mảnh vỡ không gian tầm thường."

 arkship.1185.name: "Thương Mại Không Chịu Sự Giám Sát"
 arkship.1185.desc: "Trong quá trình tiến hành đợt kiểm toán định kỳ trên §YTàu Ark [Root.GetName]§!, người ta đã phát hiện ra những điểm bất nhất trong các ghi chép về hàng hóa.\n\nĐoạn phim giám sát cho thấy, một mạng lưới trao đổi phi chính thức đã hình thành giữa các cư dân trên Tàu Ark. Một hệ thống trao đổi hàng hóa đã âm thầm trỗi dậy giữa các thuyền viên và người định cư. Những mặt hàng dễ hư hỏng, dụng cụ, đồ xa xỉ và các dịch vụ cá nhân đã được mang ra giao dịch tại những góc khuất ít bị giám sát.\n\nPhát hiện này đã dấy lên một vài vấn đề mang tính đáng lo ngại. Có người tán dương sự thông minh khôn khéo được thể hiện trong đó; trong khi số khác lại cảnh báo rằng, bất kỳ sự lơ là nào trong khâu giám sát trên Tàu Ark đều có khả năng mang đến những rủi ro nghiêm trọng."
 arkship.1185.a: "Hợp pháp hóa các hoạt động giao dịch."
 arkship.1185.b: "Áp thuế đối với những người tham gia."
 arkship.1185.c: "Ngay lập tức dẹp bỏ những hành vi kiểu này."

 arkship.1190.name: "Thị Trường Tự Do"
 arkship.1190.desc: "Mạng lưới trao đổi hàng hóa trái phép bên trong Tàu Ark đã được chứng minh là cực kỳ ổn định. Mặc dù thiếu đi sự giám sát của giới chức trách, nhưng mạng lưới này đã thực hiện việc tự điều chỉnh thông qua niềm tin và sự phụ thuộc lẫn nhau. Rất hiếm khi xảy ra tranh chấp, và ngay cả khi hệ thống phân phối chính thức của Tàu Ark gặp khó khăn trong việc duy trì tiến độ, các nhu yếu phẩm vẫn có thể được lưu thông liên tục. Bằng cách hợp pháp hóa các giao dịch kiểu này và thiết lập những ranh giới rạch ròi, Tàu Ark đã đón nhận một thị trường tự do giới hạn ngay trong chính nội bộ của mình.\n\nĐối với nhiều cư dân, sự thay đổi này không chỉ mang lại con đường để tiếp cận hàng hóa, mà còn trao cho họ quyền tự chủ, tinh thần trách nhiệm cũng như khơi dậy ý thức về sứ mệnh bên trong bộ máy khổng lồ của Tàu Ark."
 arkship.1190.a: "Hãy để cho thị trường này được phát triển rực rỡ."

 arkship.1195.name: "Giành Lại Quyền Kiểm Soát"
 arkship.1195.desc: "Thị trường bất hợp pháp này đã bị đóng cửa thành công. Đội ngũ an ninh của chúng ta đã bắt đầu triệt phá mạng lưới liên quan. Những tủ khóa dùng để giao dịch đã bị niêm phong, và phạm vi giám sát tại các khu vực khuất tầm nhìn cũng đã được mở rộng. Những nhân vật tổ chức các giao dịch đó đã bị chính thức thuyên chuyển công tác hoặc phải chịu các hình thức kỷ luật.\n\nMặc dù mạng lưới trao đổi hàng hóa này từng mang lại cho một bộ phận cư dân cảm giác về sự tự chủ và cơ hội, nhưng thiết kế ban đầu của Tàu Ark hoàn toàn không nhằm mục đích hỗ trợ các phương thức phân bổ phi chính thức. Trên một con tàu mà mỗi một phần tài nguyên đều bắt buộc phải được ghi chép vào hồ sơ, thì việc kiểm soát và tính dự đoán luôn là ưu tiên hàng đầu."

 arkship.1200.name: "Cái Chết và Thuế"
 arkship.1200.desc: "Mạng lưới trao đổi hàng hóa bên trong đường hầm bảo trì của Tàu Ark đã phô bày một hiệu suất đáng kinh ngạc. Hàng hóa liên tục được lưu thông qua các kênh phi chính thức, bù đắp cho những khoảng trống nhỏ nhưng luôn tồn tại dai dẳng trong hệ thống phân phối của Tàu Ark.\n\nMột số nhân vật trung gian đã bị tiếp xúc một cách bí mật, họ thông qua việc cung cấp sự hợp tác để đổi lấy sự miễn trừ khỏi việc bị lực lượng thi hành luật pháp can thiệp. Trong mỗi một giao dịch đều có một phần tỷ lệ nhỏ chảy vào tài khoản chính thức của chúng ta. Đối với các cư dân, thị trường này vẫn đang ở trạng thái phi chính thức, và phần lớn đã qua mặt được tầm nhìn của chính quyền. Tuy nhiên, trong thực tế vận hành, toàn bộ lưu lượng của nó đều nằm dưới sự giám sát chặt chẽ, và mang lại lợi nhuận kết xù."
 arkship.1200.a: "Thương mại hưng thịnh, thì doanh thu dồi dào."
 arkship.1200.b: "Thuế là cái giá phải trả cho sự phồn vinh."

 free_market: "Thị Trường Tự Do"
 free_market_desc: "Tài nguyên được giao dịch dưới sự giám sát, thông qua cung cầu để định hướng việc phân bổ."
 total_control: "Kiểm Soát Toàn Diện"
 total_control_desc: "Việc duy trì trật tự trên Tàu Ark đòi hỏi phải thực hiện phân bổ nghiêm ngặt đối với tất cả các tài nguyên khả dụng."

 # The Only Sky We Know

 arkship.1205.name: "Bầu Trời Xanh Duy Nhất Thân Thuộc"
 arkship.1205.desc: "Tại nơi sâu thẳm nhất trong kho lưu trữ của §YTàu Ark [Root.GetName]§!, các nhân viên quản lý tài liệu lưu trữ đã tìm thấy một chiếc hộp nhỏ được niêm phong kín trong số những vật tư đã bị lãng quên từ lâu. Bên trong chứa một con vi mạch trông rất bình thường, mặc dù đã được ghi chép lại nhưng chưa từng được lập chỉ mục một cách thỏa đáng. Nếu như nó thực sự có giá trị gì đó, thì có lẽ đã chẳng bị người ta lãng quên trong hộp lưu trữ rồi.\n\nCông nghệ này đã cực kỳ lỗi thời, định dạng kỹ thuật số được sử dụng thậm chí còn ra đời trước cả hệ thống trên Tàu Ark vài thế hệ. Một số người phỏng đoán rằng, nó có thể có nguồn gốc từ thời kỳ đầu của chuyến hải trình, thậm chí có thể truy ngược về cái thời mà giống loài chúng ta vẫn còn sinh sống trên bề mặt hành tinh."
 arkship.1205.a: "Thử khôi phục dữ liệu lưu trữ."
 arkship.1205.b: "Vứt món đồ bỏ đi này đi."

 arkship.1210.name: "Manh Mối Văn Hóa"
 arkship.1210.desc.a: "Sau khi dữ liệu được phục hồi, đã hiển thị một buổi lễ kỷ niệm theo mùa cổ xưa, nó có thể được truy xuất về những tháng ngày chúng ta sinh sống trên hành tinh trong quá khứ. Nó dường như là để đánh dấu sự trôi qua của những tháng ngày giá rét và sự thức tỉnh của tự nhiên. Các thành viên trong cộng đồng đã tụ tập lại với nhau, chào đón sự quay trở lại của sự ấm áp và ánh sáng. Mọi người đốt lửa trại, gieo rắc những sắc màu rực rỡ vào những người tham gia. Bản ghi chép cũng miêu tả cảnh cùng nhau chia sẻ những món đồ ngọt đặc chế, cùng nhau nhảy múa ca hát, cũng như lặng lẽ chiêm ngưỡng những bông hoa đầu tiên hé nở trong mùa.\n\nMặc dù sự biến đổi theo mùa này đã không còn tồn tại trên Tàu Ark nữa, nhưng những mảnh ghép này đã cho chúng ta một cái nhìn thoáng qua về việc tổ tiên của chúng ta đã từng ăn mừng ngày lễ này như thế nào."

 arkship.1210.desc.b: "Mục ghi chép được phục hồi từ vi mạch đã miêu tả một buổi lễ kỷ niệm theo mùa liên quan đến sự luân phiên của chu kỳ thường niên. Nó diễn ra vào khoảng thời gian tăm tối nhất trong năm, khi mà ban ngày trở nên khan hiếm, cái lạnh buốt giá bao trùm lấy phần lớn diện tích của hành tinh. Cộng đồng đã đối phó bằng cách dùng ánh đèn để trang hoàng nhà cửa và các không gian công cộng, biến những đêm dài đằng đẵng trở nên rực rỡ và ngập tràn bầu không khí lễ hội. Mọi người tụ tập lại cùng nhau trao đổi quà tặng, san sẻ những món ăn vô cùng thịnh soạn.\n\nTrên Tàu Ark đã không còn những mùa đông như thế nữa, những dữ liệu này đã cho thấy tổ tiên của chúng ta đã từng dùng hơi ấm và ánh sáng để đáp trả lại mùa tăm tối nhất như thế nào."

 arkship.1210.desc.c: "Mục ghi chép này dường như miêu tả một hoạt động ăn mừng mang tính cá nhân từng rất phổ biến trên hành tinh quê hương của chúng ta. Bản ghi có nhắc đến, đây là một thời khắc đánh dấu sự thay đổi trong chu kỳ sinh mệnh thường niên của cá nhân. Vào ngày này, gia đình và bạn bè sẽ tụ tập lại với nhau, nâng ly chúc mừng cho thành viên đó cũng như những năm tháng mà họ đã trải qua. Truyền thống này dường như còn bao gồm cả việc cùng nhau san sẻ những món ăn được chuẩn bị riêng cho hoạt động này.\n\nMặc dù cuộc sống trên Tàu Ark ngày nay tuân theo những nhịp điệu khác biệt, nhưng bản ghi chép đã cho thấy, tổ tiên của chúng ta đã từng có thói quen dừng bước mỗi năm một lần, để ăn mừng cho sự tiếp nối sinh mệnh của mỗi một cá nhân độc lập giữa muôn vạn chúng sinh."

 arkship.1210.desc.d: "Con vi mạch sau khi được khôi phục dường như đã hé lộ một hoạt động ăn mừng đánh dấu sự khởi đầu của một chu kỳ thường niên mới. Đầu tiên, tổ tiên của chúng ta sẽ dọn dẹp không gian sinh sống của họ. Khi sự luân phiên chu kỳ của mặt trời đến gần, các cộng đồng sẽ tụ tập lại với nhau, tiến hành đếm ngược cho những khoảnh khắc cuối cùng. Sự xuất hiện của chu kỳ mới đi kèm với những ánh đèn rực rỡ, những điệu nhảy múa và các hoạt động ăn mừng trên diện rộng. Những người tham gia cũng sẽ ghi lại những ý định cá nhân cho năm sắp tới, tức là những \"quyết tâm\" nhằm mục đích định hướng cho các hành động và sự cải thiện trong tương lai.\n\nMặc dù cuộc sống trên Tàu Ark hiện tại tuân theo những chu kỳ được quản lý nghiêm ngặt chứ không phải là lịch hành tinh, nhưng dữ liệu đã cho thấy, tổ tiên của chúng ta đã từng dùng niềm hy vọng kéo dài đối với tương lai để đánh dấu sự trôi đi của thời gian như thế nào."
 arkship.1210.a: "Chúng ta nên học hỏi từ trong đó."

 arkship.1210.desc.e: "Mục ghi chép được phục hồi từ vi mạch đã miêu tả một truyền thống xã hội lấy sự kết hợp chính thức của hai người làm trung tâm. Theo như ghi chép, các thành viên trong cộng đồng sẽ tụ tập lại với nhau, chứng kiến cảnh hai người công khai bày tỏ lời cam kết dành cho nhau. Những nghi thức này thông thường bao gồm những bộ trang phục mang tính biểu tượng, những lời thề nguyện bằng miệng, cùng với sự hiện diện của người thân và bạn bè dưới tư cách là những nhân chứng.\n\nMặc dù mối quan hệ bạn đời trên Tàu Ark thường được ghi lại thông qua hệ thống hành chính, chứ không phải thông qua những nghi thức rườm rà, nhưng hồ sơ lưu trữ đã cho thấy, tổ tiên của chúng ta đã từng dùng những nghi thức trang trọng và sự ăn mừng của toàn bộ cộng đồng để kỷ niệm những sự kết hợp kiểu này."

 arkship.1210.desc.f: "Mục ghi chép được khôi phục từ vi mạch đã miêu tả một ngày lễ nhộn nhịp từng được tổ chức trên hành tinh quê hương. Những người tham gia sẽ khoác lên mình những bộ trang phục tinh xảo và đeo mặt nạ, tạm thời thay đổi một thân phận mới trong suốt thời gian diễn ra lễ hội. Trong dữ liệu còn nhắc đến những cuộc diễu hành có tổ chức, những bục sân khấu được trang hoàng lộng lẫy di chuyển chậm rãi trong không gian công cộng, đám đông thì nối gót theo sau, vừa ca hát vừa nhảy múa.\n\nNgược lại, các hoạt động ăn mừng trên Tàu Ark lại dè dặt hơn rất nhiều, bị giới hạn bởi các chu kỳ trực ban và nguồn tài nguyên hạn hẹp. Bản ghi chép đã cho thấy, ở một thời đại khác, tổ tiên của chúng ta thi thoảng cũng sẽ gạt bỏ chủ nghĩa thực dụng, chuyển sang theo đuổi những cảnh tượng hoành tráng và sự buông thả bản thân."

 arkship.1210.desc.g: "Vi mạch này đã hé lộ một bản ghi chép về lễ hội theo mùa đến từ thời kỳ hành tinh của giống loài chúng ta. Nó dường như được tổ chức vào thời điểm kết thúc vụ thu hoạch, khi mà các cộng đồng tụ tập lại với nhau, để bày tỏ lòng biết ơn đối với nguồn thực phẩm đã thu thập được trong năm. Buổi lễ kỷ niệm này cũng đánh dấu sự đến gần của khoảng thời gian tăm tối trong năm, khi đó ban ngày sẽ trở nên khan hiếm, và khí hậu lạnh lẽo cũng sẽ quay trở lại. Những người tham gia sẽ khoác lên mình những lớp ngụy trang gây bất an, có lẽ là để mô phỏng hoặc xua đuổi những linh hồn tồn tại trong trí tưởng tượng.\n\nMặc dù chu kỳ nông nghiệp của Tàu Ark đã được điều chỉnh một cách tỉ mỉ, chúng ta cũng không còn cần đến những truyền thống này nữa, nhưng hồ sơ lưu trữ đã cho thấy, tổ tiên của chúng ta đã từng dùng sự biết ơn, sự sáng tạo và một chút tinh nghịch để kỷ niệm sự chuyển giao của các mùa."

 arkship.1210.desc.h: "Vi mạch đã hé lộ một bản ghi chép văn hóa. Nó phơi bày một truyền thống lấy việc tưởng nhớ người đã khuất làm trung tâm. Dựa theo dữ liệu hiển thị, cộng đồng sẽ thiết lập những bục trưng bày cỡ nhỏ cho những người thân và bạn bè đã qua đời, đồng thời dùng hoa tươi, thức ăn cùng với những vật dụng cá nhân liên quan đến người đã khuất để trang trí. Những dịp như thế này không phải là để đau buồn trong câm lặng, mà dường như vừa mang ý nghĩa phản tư, lại vừa mang sắc thái của sự ăn mừng.\n\nMặc dù sự thay thế của các thế hệ trên Tàu Ark đã làm thay đổi cách thức chúng ta tưởng nhớ người chết, nhưng bản ghi chép đã cho thấy, tổ tiên của chúng ta đã từng không chỉ dành thời gian để đau buồn, mà còn dùng nó để ăn mừng cho những sinh mệnh đã đắp nặn nên người còn sống."

 arkship.1210.desc.avian.reptilian: "Mục ghi chép được khôi phục từ vi mạch đã phơi bày một nghi thức sinh sản mà tổ tiên của chúng ta đã từng tổ chức. Đó là một buổi tụ họp nhằm phô bày lứa trứng đầu tiên trước cộng đồng. Dưới ánh mắt chăm chú của các thành viên trong gia tộc và những người làm chứng, những quả trứng sẽ được đặt một cách cẩn thận vào bên trong không gian làm tổ đã được chuẩn bị sẵn. Nghi thức đã sử dụng các vật liệu làm tổ mang tính trang trí và các cách sắp xếp vỏ sò mang ý nghĩa biểu tượng, đồng thời tổ chức những bữa tiệc chung để ăn mừng cho sự tiếp nối của huyết mạch.\n\nĐiều đáng chú ý là, bản ghi chép đã chỉ ra rằng những nghi thức đẻ trứng này đã từng kéo dài nhiều tuần lễ, liên quan đến những nghi lễ và công tác chuẩn bị dông dài. Ngược lại, những công việc kiểu này trên Tàu Ark lại được xử lý một cách vừa nhanh chóng vừa riêng tư, ngày nay chỉ cần bỏ ra vài giờ đồng hồ để tiến hành một quy trình được quản lý chặt chẽ là có thể hoàn tất."

 arkship.1210.desc.fungoid.plantoid: "Mục ghi chép được khôi phục từ vi mạch đã miêu tả một truyền thống công xã mà tổ tiên của chúng ta đã từng tiếp nối trong suốt thời kỳ sinh trưởng xum xuê. Trong bản ghi có nhắc đến, mọi người sẽ tụ tập trong những lùm cây rậm rạp, bồi dưỡng ra những loài thực vật kết trái kỳ lạ và rực rỡ, các nhóm người sẽ qua lại thăm hỏi lẫn nhau, để chiêm ngưỡng những thành quả sinh trưởng vô cùng hút mắt. Những giống loài khác biệt được xếp đặt lại với nhau, tạo thành những hoa văn phức tạp và sống động đan xen từ màu sắc, kết cấu cùng với mùi hương. Để có thể thúc đẩy những đóa hoa quý hiếm hoặc độc đáo nở rộ trong suốt thời gian diễn ra buổi tụ họp, các vị tổ tiên còn cố tình thay đổi độ ẩm, dưỡng chất và ánh sáng.\n\nCuộc sống trên Tàu Ark gần như không có không gian để tiến hành kiểu canh tác tự phát này. Ngày nay, chu kỳ sinh trưởng do hệ thống nông nghiệp quản lý nghiêm ngặt, mục tiêu tối ưu hóa của phần lớn các chủng khuẩn là hiệu suất chứ không phải là sự thể hiện."

 arkship.1210.desc.infernal: "Mục ghi chép được thu hồi đã miêu tả một truyền thống cổ xưa mà tổ tiên chúng ta truyền lại. Trong hồ sơ lưu trữ có ghi chép, mọi người sẽ tụ tập xung quanh những hố lửa sống được kiểm soát, cố tình để lộ bản thân trước cái nóng rực lửa, nhằm phô diễn sự bền bỉ và sức sống mãnh liệt. Những người tham gia sẽ tạo hình ngọn lửa thành những hoa văn phức tạp, đồng thời ném thêm các loại khí hiếm và nhiên liệu vào trong đó, khiến cho ngọn lửa hiện ra những màu sắc khác thường. Cùng với thế lửa ngày một dâng cao, những người quan sát sẽ ngâm xướng và ăn mừng, coi sự kiện trọng đại này như một cảnh tượng ngoạn mục và một nghi thức tập thể.\n\nTrên Tàu Ark, ngọn lửa trần bị quản chế cực kỳ nghiêm ngặt, bởi vì chúng sẽ tạo thành nguy cơ rủi ro ở mức độ cao đối với các cơ sở hạ tầng."

 arkship.1210.desc.mammalian: "Mục ghi chép sau khi được sửa chữa đã miêu tả một truyền thống xoay quanh sự trưởng thành ở giai đoạn đầu của hậu duệ. Theo như những gì được ghi chép lại, khi những cá thể non nớt chập chững bước những bước đi độc lập đầu tiên bên ngoài tổ, những người thân trong gia đình sẽ tụ họp lại với nhau. Khoảnh khắc đó dường như được coi là một cột mốc tuy nhỏ bé nhưng lại mang đầy ý nghĩa, mọi người thông thường sẽ tiến hành ăn mừng thông qua việc khích lệ, chia sẻ thức ăn để dụ dỗ con non bước ra khỏi tổ, cùng với sự quan tâm chú ý của người thân và bạn bè.\n\nTrong cuộc sống trên Tàu Ark, rất hiếm khi cho phép tổ chức những buổi tụ tập kiểu này vì những cột mốc mang tính cá nhân."

 arkship.1210.desc.arthropoid: "Mục ghi chép được khôi phục từ vi mạch đã miêu tả một truyền thống gắn liền chặt chẽ với một giai đoạn tự nhiên trong chu kỳ sinh mệnh của tổ tiên chúng ta. Bản ghi chép cho thấy, trong suốt thời kỳ các cá thể lột bỏ lớp vỏ xương ngoài cũ kỹ, mọi người sẽ tổ chức những buổi tụ tập mang tính tập thể. Những giai đoạn lột xác này không hề được tiến hành trong sự cách ly, mà thông thường sẽ lấy nghi thức làm cột mốc, lớp vỏ cũ đôi khi sẽ được trang trí hoặc bảo tồn lại, coi như là một biểu tượng của sự trưởng thành và tái sinh. Một khi lớp vỏ cũ bong ra, lớp vỏ xương ngoài mới được hình thành sẽ được phô diễn ra ngoài một cách đầy tự hào.\n\nTrên Tàu Ark, chu kỳ lột xác thông thường sẽ được quản lý tại những cơ sở sinh học được kiểm soát, nhằm đảm bảo sự an toàn và hiệu suất, đồng thời cũng được bố trí nhân viên để đối phó với bất kỳ biến chứng nào có thể xảy ra."

 arkship.1210.desc.toxoid: "Đoạn ghi chép được khôi phục này đã miêu tả một truyền thống mà tổ tiên của chúng ta từng tôn sùng trong suốt thời kỳ bầu khí quyển đạt độ bão hòa ở mức cao. Mọi người sẽ tụ tập tại những khu vực được bố trí đặc biệt, cố tình xả những loại khí ga và sản phẩm phụ hóa học tích tụ trong cơ thể ra môi trường xung quanh. Những người tham gia sẽ cạnh tranh với nhau, xem ai là người có thể tạo ra những cột khói hóa học rực rỡ nhất hoặc kỳ lạ nhất. Những đám mây sương mù được sinh ra nhờ thế đã tạo thành những màu sắc và hoa văn phản ứng biến ảo khôn lường trong không khí. Những người ngoài cuộc đứng ngoài quan sát với vẻ đầy hứng thú, và những loại khí ga có mùi hăng hắc nhất thường sẽ khơi dậy những tràng cười không ngớt từ đám đông vây xem.\n\nNgày nay trên Tàu Ark, hệ thống bầu khí quyển quản lý nghiêm ngặt các hoạt động xả thải kiểu này, nhằm duy trì các điều kiện môi trường ở mức an toàn."

 arkship.1210.desc.lithoid: "Mục ghi chép được phục hồi đã miêu tả một truyền thống tràn đầy sức sống mà tổ tiên của chúng ta đã từng thực hiện. Theo như ghi chép, từng đám người sẽ tụ tập tại những vùng địa hình nhiều sỏi đá và rộng rãi, tiến hành những cuộc quyết đấu ném đá có tổ chức. Những người tham gia sẽ ném những tảng đá rời rạc vào nhau, cố gắng đập vỡ hoặc gọt ra những mảnh vỡ từ lớp vỏ ngoài của đối thủ. Những mảnh vỡ nhỏ rụng xuống trong lúc xung đột đôi khi sẽ được thu thập lại để làm quà lưu niệm, tượng trưng cho sự dẻo dai và sự cạnh tranh mang tính hữu nghị.\n\nTrên Tàu Ark, những hoạt động kiểu này rõ ràng sẽ tạo thành mối đe dọa đối với cơ sở hạ tầng. Các giao thức về tính toàn vẹn của thân tàu nghiêm cấm việc ném đá, những cuộc thi đấu này đã biến mất khỏi cuộc sống thường nhật từ rất lâu rồi."

 arkship.1210.desc.aquatic.mulluscoid: "Con vi mạch được thu hồi đã miêu tả một truyền thống mà tổ tiên thủy sinh của chúng ta từng tiếp nối dưới biển sâu của hành tinh quê hương. Các cá nhân sẽ tụ tập lại với nhau, cùng nhau lặn xuống những vùng nước sâu hơn so với môi trường sống thường ngày của họ. Những hoạt động lặn này vừa là một thử thách, lại vừa là một buổi lễ kỷ niệm. Vùng nước sâu tồn tại những cấu trúc địa chất kỳ lạ cùng với những hình thái sinh mệnh xa lạ, thậm chí là hiểm ác, khiến cho quá trình lặn xuống chứa đựng đầy rẫy những sự kích thích và mối nguy hiểm. Những người có thể chạm tới nơi sâu nhất thường sẽ nhận được sự ngưỡng mộ từ mọi người.\n\nMôi trường sống thủy sinh trên Tàu Ark phải chịu sự quản lý nghiêm ngặt, độ sâu bị giới hạn bởi các hạn chế về mặt kỹ thuật. Áp lực khổng lồ cùng với sự tăm tối vô tận của vùng đại dương cổ đại đã không còn có thể tự mình trải nghiệm được nữa."

 arkship.1215.name: "Sự Lây Nhiễm Nấm"
 arkship.1215.desc: "Các báo cáo gần đây cho thấy, một giống loài nấm mang tính xâm lấn đã lan rộng đến toàn bộ boong tàu thủy canh của §YTàu Ark [Root.GetName]§!. Sinh vật này dường như phát triển mạnh mẽ trong môi trường độ ẩm được kiểm soát và chất nền giàu dinh dưỡng của hệ thống nông nghiệp trên Tàu Ark, hình thành nên những mạng lưới sợi nấm dày đặc trên nhiều tầng sản xuất.\n\nCác biện pháp ngăn chặn đã được chứng minh là vô hiệu, bởi vì loại nấm này không tạo ra phản ứng có thể đo lường được đối với các biện pháp xử lý cỏ dại tiêu chuẩn. Chúng ta nghi ngờ rằng loài sinh vật này có thể đã nhanh chóng thích nghi với hệ sinh thái khép kín của con tàu. Nếu như không bị kiểm soát, sự bùng phát lần này rất có thể sẽ làm sụt giảm đáng kể sản lượng lương thực, đồng thời tạo ra áp lực bổ sung lên năng lực sản xuất nông nghiệp vốn đã hạn hẹp của Tàu Ark."
 arkship.1215.a: "Sử dụng các phương pháp mang tính hủy diệt để tiến hành thanh lọc."
 arkship.1215.b: "Nghiên cứu loài nấm này."
 arkship.1215.c: "Thử tiến hành giao tiếp."

 arkship.1220.name: "Ngọn Lửa Thanh Tẩy"
 arkship.1220.desc: "Sau khi các biện pháp xử lý thông thường không mang lại hiệu quả, tầng thủy canh bị ô nhiễm đã được tiến hành thiêu hủy có kiểm soát. Đáng tiếc thay, phần lớn lượng thực vật có thể ăn được dự trữ của Tàu Ark đều đã bị tổn thất sạch sẽ trong quá trình này. Toàn bộ luống trồng trọt đã hóa thành tro bụi cùng với các chất lây nhiễm, dẫn đến việc có một số khu vực nông nghiệp tạm thời bị bỏ hoang.\n\nMặc dù vậy, hành động này dường như đã đạt được mục tiêu như dự kiến. Cùng với việc mọi bề mặt mang theo bào tử đều đã được khử trùng, phần cơ sở hạ tầng còn lại cũng đã trải qua quá trình dọn dẹp triệt để, giống loài nấm này đã bị diệt trừ vĩnh viễn khỏi hệ sinh thái. Những kinh nghiệm này sẽ giúp ích cho chúng ta trong việc đối phó với những giống loài ngoại lai xâm lấn khác có khả năng sẽ cư ngụ trên Tàu Ark trong tương lai."
 arkship.1220.a: "Cuối cùng cũng được giải thoát rồi."

 arkship.1225.name: "Hệ Sợi Nấm Thông Minh"
 arkship.1225.desc: "Giống loài xâm lấn trên §YTàu Ark [Root.GetName]§! vận hành thông qua một mạng lưới sợi nấm phân tán, mạng lưới này có khả năng nhanh chóng cô lập và hy sinh các đoạn cá thể. Bất cứ khi nào chúng ta thử trích xuất mẫu vật sống, những phần sinh trưởng xung quanh gần như sẽ khô héo ngay lập tức, chất dinh dưỡng của chúng dường như đã được định tuyến lại thông qua mạng lưới, dùng để đảm bảo cho việc nảy mầm mới tại các khu vực khác trên bệ thủy canh.\n\nSau khi trải qua nhiều lần thử nghiệm thất bại, cuối cùng chúng ta cũng đã phân tách thành công một mẫu vật đủ ổn định để tiến hành quan sát có kiểm soát. Loài nấm này sở hữu một hệ thống tái phân bổ chất dinh dưỡng có hiệu suất cực cao, hệ thống này rất có thể sẽ được ứng dụng cho môi trường sinh thái khép kín trên Tàu Ark, thậm chí có thể đang mô phỏng lại chính hệ thống phân bổ của chúng ta."
 arkship.1225.a: "Giống loài đáng kinh ngạc."
 arkship.1225.b: "Cải tạo lại nó."

 arkship.1230.name: "Chuyển Hóa Sinh Hóa"
 arkship.1230.desc: "Thông qua việc tiến hành thực nghiệm sâu hơn đối với sự sinh trưởng của nấm, chúng ta đã hé lộ được một phản ứng hóa học dị thường. Khi sinh vật này tiếp xúc với các hợp chất hóa học đặc thù, nó sẽ nhanh chóng chuyển hóa những chất phụ gia này, đồng thời giải phóng ra một loại sản phẩm phụ là khí ga hỗn hợp độc đáo. Chúng ta nhận ra rằng, những khí ga này có thể được thu thập và tinh luyện.\n\nLoài nấm này có khả năng chuyển đổi hiệu quả các nguyên liệu hóa học đầu vào đơn giản thành các dòng hợp chất dễ bay hơi ổn định, đây là một quá trình nằm ngoài dự kiến nhưng lại có khả năng rất hữu dụng. Thông qua việc nuôi cấy sự sinh trưởng của nấm có kiểm soát bên trong buồng cách ly, chúng ta tin rằng sinh vật này có thể được tái sử dụng thành một hệ thống xử lý sinh hóa cỡ nhỏ."
 arkship.1230.a: "Phát hiện nằm ngoài dự kiến."

 arkship.1235.name: "Cội Nguồn Chung"
 arkship.1235.desc: "Thông qua việc tiến hành quan sát sâu hơn đối với sự sinh trưởng của nấm, chúng ta đã hé lộ được một vài quy luật, điều này cho thấy bên trong mạng lưới sợi nấm khổng lồ của nó có tồn tại một hình thức truyền dẫn tín hiệu sinh học nào đó. Đối với phần lớn các giống loài mà nói, hành vi này có lẽ chỉ là chuyện nhỏ nhặt không đáng kể, thế nhưng đặc tính sinh học của chính chúng ta lại khiến cho chúng ta có khả năng nhận diện và thích ứng với kiểu giao tiếp vi diệu này.\n\nThông qua việc đưa vào các tín hiệu sinh hóa được hiệu chỉnh kỹ lưỡng, chúng ta đã thiết lập nên cuộc đối thoại bước đầu với sinh vật này. Bắt đầu từ thời khắc đó, nó bắt đầu tái phân bổ chất dinh dưỡng thông qua mạng lưới của mình, đồng thời bảo vệ các loại cây trồng nông nghiệp khỏi sự xâm hại của các vi sinh vật có hại. Rất nhanh sau đó chúng ta liền nhận ra rằng, thứ mà chúng ta từng cho là sự xâm lấn, nay đã tiến hóa thành một mối quan hệ cộng sinh đầy ý nghĩa với một hình thái sự sống khác ở trong khu vườn."
 arkship.1235.a: "Mối quan hệ cộng sinh nằm ngoài dự kiến."

 fungal_contamination_chain_title: "$arkship.1215.name$"
 fungal_contamination_chain_desc: "Các báo cáo gần đây cho thấy, một giống loài nấm mang tính xâm lấn đã lan rộng đến toàn bộ khoang thủy canh của §YTàu Ark [Root.GetName]§!. Loài nấm này có khả năng kháng thuốc, rất khó để ngăn chặn, đang đe dọa đến việc sản xuất lương thực."

 ARKSHIP_FUNGAL_CONTAMINATION_PROJECT: "$arkship.1215.name$"
 ARKSHIP_FUNGAL_CONTAMINATION_PROJECT_DESC: "Giống loài nấm mang tính xâm lấn đang lan rộng tại khoang thủy canh của §YTàu Ark [Root.GetName]§! đã nhanh chóng thích nghi với hệ sinh thái được kiểm soát của phi thuyền. Nếu không có sự can thiệp, mạng lưới sợi nấm dày đặc của nó e rằng sẽ dẫn đến việc sản lượng lương thực bị sụt giảm nghiêm trọng."

 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT: "Thiết Lập Liên Lạc"
 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT_DESC: "Chúng ta sẽ cố gắng tiến hành giao tiếp với giống loài nấm mang tính xâm lấn đang lan rộng khắp khoang thủy canh của §YTàu Ark [Root.GetName]§!. Nếu như không bị kiểm soát, mạng lưới sợi nấm dày đặc của nó sẽ gây ra mối đe dọa nghiêm trọng và làm giảm sản lượng lương thực."

 #Unknown Resource Usage
 arkship.1240.name: "Sử Dụng Tài Nguyên Không Xác Định"
 arkship.1240.desc: "Trong quá trình kiểm kê kho dự trữ hàng tháng của chúng ta, chúng ta đã phát hiện ra hệ thống tài nguyên của §YTàu Ark [Root.GetName]§! có tồn tại sự chênh lệch mang tính liên tục. Mức tiêu hao năng lượng điện, hàng tiêu dùng cùng với các vật tư khác đã vượt quá mức sử dụng được chúng ta ghi chép lại một chút. Các chuyên gia cho rằng đây có thể là sự rò rỉ, sự cố hỏng hóc, hoặc là sai số siêu nhỏ trên dữ liệu.\n\nSau khi tiến hành điều tra sâu hơn, kết quả vẫn chưa có kết luận. Không có khe hở, không có sự cố hỏng hóc, cũng không có sự kém hiệu quả nào vượt quá phạm vi có thể chấp nhận được. Tuy nhiên, dữ liệu vẫn cứ y như cũ. Tài nguyên vẫn tiếp tục biến mất khỏi hệ thống mà không có bất kỳ lời giải thích nào. Một thứ gì đó trên Tàu Ark đang tiêu hao tài nguyên của chúng ta."
 arkship.1240.a: "Điều tra."
 arkship.1240.b: "Không sao cả, tiếp tục khai thác thôi."

 arkship.1245.name: "Thế Hệ Nằm Ngoài Sổ Sách"
 arkship.1245.desc: "Bên trong một khu vực không có người giám sát của Tàu Ark, chúng ta đã phát hiện ra một nhóm thanh niên sinh sống bên ngoài hệ thống quan phương. Bọn chúng đã tận dụng nguồn năng lượng điện, không khí và thức ăn được dẫn luồng một cách lén lút, để tạo ra không gian của riêng mình, đồng thời tiến hành các thử nghiệm, cải tạo môi trường cũng như thể hiện bản thân trong tình trạng không bị giám sát.\n\nNghiên cứu cho thấy, đây là một hiện tượng tự nhiên trong quá trình phát triển của thanh thiếu niên. Khi đối mặt với sự điều tra, bọn chúng tỏ ra vô cùng kinh ngạc, đồng thời mang theo tâm lý chống đối. Bọn chúng tuyên bố chỉ lấy đi một lượng tài nguyên rất nhỏ, vả lại hành sự cực kỳ cẩn trọng, đủ để tránh né được sự dò xét tức thời. Bọn chúng bày tỏ một cách rõ ràng rằng, chúng không hề có ý định từ bỏ không gian này, và hy vọng sẽ không bị quấy rầy."
 arkship.1245.a: "Dỡ bỏ nơi này."
 arkship.1245.b: "Để cho chúng được tự do thể hiện bản thân."

 arkship.1250.name: "Bộ Vi Xử Lý Đồ Cổ"
 arkship.1250.desc: "Tại một khu vực bảo trì đã bị lãng quên, các điều tra viên đã phát hiện ra một nhóm drone lao động lỗi thời vẫn đang thực thi những chỉ thị cổ xưa. Hoạt động thường nhật của chúng dường như đã ra đời trước cả vài lần cập nhật hệ thống, dẫn đến việc chúng vận hành bên ngoài giao thức nhật ký hiện tại, vả lại chỉ cần một lượng tài nguyên cực kỳ ít ỏi là đã có thể duy trì hoạt động.\n\nViệc kiểm tra sâu hơn đã hé lộ được thành quả từ những hoạt động liên tục của chúng: một lượng lớn hợp kim tinh luyện đã được gia công và cất giữ một cách tỉ mỉ qua nhiều chu kỳ. Những con drone này vẫn luôn thu thập và tối ưu hóa tài nguyên một cách lặng lẽ, quy mô của chúng đã vượt xa bất kỳ nhu cầu vận hành nào ở thời điểm hiện tại."
 arkship.1250.a: "$arkship.1245.a$"
 arkship.1250.b: "Mặc kệ chúng đi, nhưng phải mang tài nguyên đi."

 arkship.1255.name: "Nơi An Dưỡng"
 arkship.1255.desc: "Tại một khu vực hẻo lánh của Tàu Ark, chúng ta đã phát hiện ra một viện điều dưỡng bí mật vận hành bên ngoài hệ thống quan phương. Năng lượng điện, hàng tiêu dùng và nguồn nước bị biển thủ đã chống đỡ cho môi trường được kiểm soát này, nơi vốn dĩ được thiết kế dành riêng cho việc an dưỡng và phục hồi.\n\nNhững người có mặt tại hiện trường gần như không hề tỏ ra lo lắng khi bị phát hiện, họ giải thích rằng, ý nghĩa của không gian này nằm ở chỗ tách biệt khỏi sự quan tâm thường xuyên đối với sản lượng và hiệu suất trưng bày, là một bến đỗ bình yên để trốn tránh khỏi cuộc sống thường nhật trên phi thuyền. Mặc dù Tàu Ark được thiết kế để thỏa mãn mọi nhu cầu, nhưng vẫn có người đang tìm kiếm một nơi chốn thuần túy dùng để thư giãn."
 arkship.1255.a: "$arkship.1245.a$"
 arkship.1255.b: "Hãy để họ được an cư đi."

 arkship.1260.name: "Buổi Tụ Tập Chưa Được Đăng Ký"
 arkship.1260.desc: "Tại một khu vực hẻo lánh của Tàu Ark, chúng ta đã phát hiện ra một đoàn thể tụ tập định kỳ chưa từng được ghi lại trong hồ sơ. Một lượng nhỏ tài nguyên bị biển thủ đã được dùng để bố trí cho những địa điểm hội họp này.\n\nCác thành viên đã miêu tả những cuộc họp này như một hoạt động giao lưu phi chính thức, cốt lõi là xoay quanh những mẫu vật mà Tàu Ark đã thu thập được trong các hoạt động thu hoạch, ví dụ như khoáng vật, mảnh vỡ quặng và cấu trúc tinh thể thu được từ các hệ sao được thăm dò. Những người tham gia sẽ kiểm tra và thảo luận về những phát hiện của mình, so sánh các thành phần và tranh luận về nguồn gốc của chúng."
 arkship.1260.a: "$arkship.1245.a$"
 arkship.1260.b: "Cứ để mặc những nghệ sĩ này đi."

 arkship.1265.name: "Kho Lưu Trữ Tài Nguyên Khẩn Cấp"
 arkship.1265.desc: "Bên trong một phòng chứa đồ được niêm phong, chúng ta đã phát hiện ra một điểm tiếp tế được cất giấu: đủ loại hàng tiêu dùng, bình dưỡng khí và pin năng lượng. Mọi vật tư đều được tích trữ một cách cẩn thận, đồng thời đã qua mặt được sự ghi chép của hệ thống kho dự trữ quan phương.\n\nNgười chịu trách nhiệm đã nhanh chóng bị tìm ra, lời giải thích mà họ đưa ra rất đơn giản: phòng cháy hơn chữa cháy. Họ ngụy biện rằng, trong một hệ thống mà sự sinh tồn hoàn toàn phụ thuộc vào tính ổn định, nếu như cứ tự cho rằng tính ổn định sẽ được kéo dài mãi mãi, thì đó mới là sự lơ là nhiệm vụ thực sự. Từ quy mô của lô vật tư được tích trữ này có thể thấy, đây rõ ràng là một kế hoạch dài hạn vượt xa mục đích sử dụng cá nhân. Trên Tàu Ark không phải tất cả mọi người đều có niềm tin rằng nó có thể tồn tại vĩnh viễn."
 arkship.1265.a: "Tịch thu tài nguyên và dẹp bỏ trò hề này đi."
 arkship.1265.b: "Cứ để họ đi."

 arkship.1270.name: "Tái Chế Toàn Bộ"
 arkship.1270.desc: "Bên trong một khu vực xử lý được niêm phong, các điều tra viên đã phát hiện ra một hệ thống tái chế chưa từng được đăng ký, hệ thống này được thiết kế với mục đích chuyển hóa di hài sinh vật thành các vật liệu có thể sử dụng được. Hệ thống này vẫn luôn vận hành liên tục, vượt xa chức năng khẩn cấp đã được thiết lập sẵn của nó.\n\nMặc dù mang lại hiệu suất rất cao, nhưng quá trình này lại tiêu tốn một nguồn vốn khổng lồ. Một lượng lớn năng lượng, chất xúc tác hóa học và vật liệu gia công đã bị biển thủ, dùng để tiến hành phân giải, khử trùng và tinh luyện các chất hữu cơ, chuyển hóa chúng thành các sản phẩm tiêu chuẩn hóa, nhằm mục đích tái sử dụng bên trong Tàu Ark. Bất kỳ thứ gì trên Tàu Ark cũng không nên bị lãng phí. Cho dù là người chết."
 arkship.1270.a: "Dỡ bỏ cái nơi xử lý người chết này đi."
 arkship.1270.b: "Tài nguyên phong phú. Kệ chúng đi."

 arkship.1275.name: "Siêu Việt Thể Chế"
 arkship.1275.desc: "Lần theo dấu vết thất thoát tài nguyên, chúng ta đã phát hiện ra một khu vực trên Tàu Ark đã bị ngó lơ từ rất lâu. Rõ ràng là, có một cộng đồng cỡ nhỏ đã tách biệt khỏi hệ thống quan phương, sống cách biệt với thế giới bên ngoài đang sinh sống tại đó. Nơi ở của họ vô cùng tồi tàn, dựa vào việc đánh cắp tài nguyên để duy trì sự sống, nhưng do số lượng bị đánh cắp là cực kỳ nhỏ, nên vẫn luôn không bị phát giác.\n\nMặc dù ở trong hoàn cảnh gian khổ, nhưng môi trường nơi đó lại rất ổn định, được duy trì một cách vô cùng tận tâm, và đã được cải tạo để phù hợp với nhu cầu của họ. Rất dễ nhận thấy, đây là một lối sống đã qua sự suy xét cẩn trọng. Họ không hề có bất kỳ hành vi phản kháng nào, ngược lại còn yêu cầu được giải thích cho sự lựa chọn của mình."
 arkship.1275.a: "Lắng nghe xem họ muốn nói gì."
 arkship.1275.b: "Xua đuổi khỏi Tàu Ark."
 arkship.1275.c: "Chúng ta không thể dung túng cho chuyện như thế này, hãy thanh trừng họ."

 arkship.1280.name: "Những Đạo Lý Khác Của Cuộc Sống"
 arkship.1280.desc: "Nhóm người sống cách biệt với thế giới đó đã công khai bàn luận về quyết định của họ. Bọn họ hoàn toàn không phải là đang từ chối Tàu Ark, mà là không thể chấp nhận lối sống đã được tiến hóa ra từ trong đó. Theo góc nhìn của họ, sự sinh tồn đã trở nên bị tối ưu hóa quá mức: mỗi một hành động đều bị cân đo đong đếm, mỗi một phần tài nguyên đều bị theo dõi, mỗi một khoảnh khắc thời gian đều bị tính toán chi li.\n\nHọ đã phác họa ra một góc nhìn khác biệt về thể chế của Tàu Ark. Họ coi trọng sự tự do đưa ra lựa chọn trong hoàn cảnh không bị giám sát liên tục. Họ cho rằng, lối sống của bản thân tuy có hiệu suất thấp hơn, nhưng lại sung túc hơn. Trong hàng ngũ lãnh đạo của chúng ta, hiện tại có một số người đã bắt đầu đặt ra nghi vấn, sự tồn tại của những nhóm người như thế này, rốt cuộc là mối đe dọa đối với tính gắn kết, hay là sự thể hiện tất yếu của cá tính bên trong một hệ thống khép kín."
 arkship.1280.a: "Cưỡng ép họ tái hòa nhập vào xã hội."
 arkship.1280.b: "Trên chiếc Tàu Ark này không có chỗ trống dành cho các người."
 arkship.1280.c: "Kệ họ đi, nhưng chúng ta sẽ để mắt tới họ."

 UNKNOWN_RESOURCE_USAGE_PROJECT: "Điều Tra Tài Nguyên"
 UNKNOWN_RESOURCE_USAGE_PROJECT_DESC: "Chúng ta cần phải tiến hành điều tra xem tài nguyên đã biến đi đâu mất rồi."

 unknown_resource_usage_chain_title: "Sử Dụng Tài Nguyên Không Xác Định"
 unknown_resource_usage_chain_desc: "Tài nguyên trên Tàu Ark đang biến mất một cách khó hiểu. Lượng tiêu hao của một thứ gì đó đã vượt qua những số liệu được ghi chép trong hồ sơ. Việc này cần phải được triển khai điều tra."

