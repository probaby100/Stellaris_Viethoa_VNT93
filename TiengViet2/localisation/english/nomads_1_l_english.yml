 # Gundersen Research Society (GRS)
 START_SCREEN_GRS: "Con tàu Hyacinth sinh ra vốn không phải để dừng chân tại bất kỳ nơi nào.\n\nNó là con tàu Ark thứ sáu và cũng là cuối cùng của \"Dự Án Ulysses\". Lỗ sâu lẽ ra đưa chúng ta đến các thế giới thuộc địa mới đã làm phân tán hạm đội của chúng ta, và sự cố mất điện thảm khốc xảy ra ngay sau khi vượt qua lỗ sâu đã khiến chúng ta rơi vào tình cảnh trôi dạt cô độc.\n\nThuyền trưởng Gundersen đã đưa ra một quyết định. Hyacinth sẽ trở thành mái nhà của chúng ta, và nó sẽ mở rộng cánh cửa đón chào bên ngoài. Những người sống sót khác trong đợt ly tán đó đã tìm thấy chúng tôi: các nhà nghiên cứu, thực dân và những kẻ lang bạt không chốn dung thân. Chúng tôi đã cưu mang họ. Bất kể họ mang theo thứ gì qua chốt gió, gia tộc Gundersen đều có thể tận dụng tối đa.\n\nNgày nay, [Ruler.GetTitle] vẫn là một thành viên của gia tộc Gundersen. Chuyến trôi dạt đằng đẵng đã đưa chúng tôi đi một vòng lớn, quay trở lại đúng vùng tinh vực mà lỗ sâu năm xưa đã bỏ rơi chúng tôi. Chúng tôi trở lại đây chính là vì nơi này là nơi khởi nguồn của mọi câu hỏi."
 EMPIRE_DESIGN_humans3: "Hạm Đội Nghiên Cứu Gundersen"
 EMPIRE_DESIGN_humans3_desc: "Là con tàu Ark thứ sáu và cũng là cuối cùng của \"Dự Án Ulysses\" do Liên Hợp Quốc tài trợ, con tàu \"Hyacinth\" đã gặp sự cố mất điện thảm khốc ngay sau khi đi qua lỗ sâu phân tán nhân loại vào các vì sao. Thuyền trưởng Ronald F. Gundersen bằng sự kiên trì và trí tuệ đã cứu sống tất cả mọi người, đồng thời lập nên một vương triều trong quá trình đó.\n\nMột thế kỷ sau, Hạm Đội Nghiên Cứu Gundersen vẫn lấy tàu \"Hyacinth\" làm mái nhà. Con tàu này đã trải qua nhiều lần tái thiết và mở rộng đến mức một số người bắt đầu gọi nó là con tàu \"Theseus\". Sự chào đón của họ là chân thành, lòng hiếu kỳ của họ là vô bờ; bất kể ai mang theo thứ gì qua chốt gió, đều do gia tộc Gundersen định đoạt cách sử dụng. Giờ đây, chuyến trôi dạt đằng đẵng đã đưa họ quay về điểm xuất phát, trở lại góc thiên hà mà lỗ sâu ban đầu đã đưa họ tới."
