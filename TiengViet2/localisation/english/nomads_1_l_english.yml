 gov_champions_forge_enclave: "Thành bang phát thanh"
 gov_champions_forge_enclave_desc: "Một doanh nghiệp khổng lồ du mục phát sóng các cuộc thi tàu vũ trụ ngoạn mục khắp ngân hà, biến chiến đấu thành giải trí, biến nhà vô địch thành hàng hóa."

 NAME_Champions_Forge_Enclave: "Lò Rèn Quán Quân Live!" #empire
 NAME_Champions_Forge_Enclave_adj: "Lò Rèn Quán Quân Live" #empire, e.g. 'an Artisan starbase'

 RT_ETERNAL_CHAMPION: "Thợ rèn huyền thoại"

 champions_forge_tournament_chain_title: "Giải đấu Lò Rèn Quán Quân Live!"
 champions_forge_tournament_chain_desc: "Nhiều thập kỷ đã trôi qua, một giải đấu mới sắp sửa bắt đầu. Hãy đưa hạm đội của bạn bước vào ánh đèn sân khấu, chứng minh cho cả thiên hà thấy trí tuệ, sức mạnh và lòng quyết tâm của bạn."

 CHAMPIONS_FORGE_TRAVEL: "Lỗ sâu: Lò Rèn Quán Quân Live!"
 CHAMPIONS_FORGE_TRAVEL_DESC: "Chương trình Lò Rèn Quán Quân đã chuẩn bị một lỗ sâu chuyên dụng để di chuyển đến đấu trường. Vui lòng đưa hạm đội của bạn đến địa điểm chỉ định trước thời hạn, sẵn sàng rèn nên huyền thoại của riêng bạn!"

 NAME_Contestant_Fleet: "Quán quân [event_target:champions_forge_contestant.GetName]"

 nomads.160.desc: "Chào mừng đến với chương trình Lò Rèn Quán Quân! Đây là cái nôi rèn nên những huyền thoại, cũng là nơi những giấc mơ giữa các vì sao khởi hành. Chúng tôi lang thang giữa các vì sao, mang đến cho cái thiên hà đã quá mệt mỏi với sự an nhàn và tầm thường này những cảm giác mạnh mẽ và sự hoành tráng.\n\nSát chiêu của bạn là gì? Là những phi công nhanh nhẹn? Là hỏa lực rung chuyển đất trời? Hay đơn giản chỉ là khao khát lợi nhuận và những tràng pháo tay? Hãy đăng ký ngay, chúng tôi sẽ biến bạn thành một ngôi sao sáng chói."

 nomads.100.name: "§YThành phố không gian:§! Lò Rèn Quán Quân Live!"
 nomads.100a.desc: "Chà, một đối thủ cũ quen thuộc đã trở lại trường quay! Nhưng liệu bạn có mang theo loại vũ khí mới nào không?\n\nKhán giả của chúng tôi và cả đấu trường ngân hà đều đang mỏi mắt chờ đợi!"
 nomads.100b.desc: "Chào mừng trở lại, các thí sinh! Bể cá cược đang nóng rực, người hâm mộ đang khao khát được xem những màn trình diễn tuyệt vời hơn, và chúng tôi thì vừa mới dọn dẹp xong đống đổ nát.\n\nMuốn phá vỡ kỷ lục lượt xem một lần nữa không?"
 nomads.100c.desc: "Chà chà! Đây chẳng phải là kẻ hiếu chiến kiêm nhà tài trợ biểu diễn công cộng yêu thích của chúng ta sao. Chúng ta đang chuẩn bị cho trận hỗn chiến hạm đội tiếp theo...\n\nBạn có muốn tham gia vào sự kiện sân nhà này không?"
 nomads.100.a.invitation: "Chúng tôi §Yđăng ký§! tham gia, chuẩn bị cho giải đấu tiếp theo."
 nomads.100.a.stop: "§YDừng§! gửi thư mời giải đấu."
 nomads.100.b: "Thay đổi địa điểm tốn bao nhiêu?"
 nomads.100.b.tt: "$opinion10$\nChúng tôi sẽ có §Y5 năm§! để ban hành một §YHợp đồng§! đặc biệt, chỉ định hệ sao đăng cai giải đấu Lò Rèn Quán Quân tiếp theo."
 hosting_cfl_cooldown_tt: "Giấy phép giải đấu Lò Rèn Quán Quân lần tới sẽ khả dụng sau §Y[champions_forge_enclave_country.cfl_cooldown_timer]§!"
 nomads.100.b.reply: "Có vẻ như chúng ta đã có một nhân vật chính mới! Chúng tôi rất nóng lòng muốn xem màn trình diễn của bạn trên sân khấu.\n\nChỉ cần ban hành một §YHợp đồng§! cho chúng tôi tại hệ sao mà bạn chọn, phần còn lại cứ để chúng tôi lo!"
 nomads.100.c: "§YGiới thiệu§! giúp chúng tôi với."
 nomadic_paragon_cooldown_tt: "§RChúng tôi có thể yêu cầu giới thiệu lại sau §Y[root.nomadic_paragon_timer]§!.§!"
 nomadic_paragon_already_hired: "§RChúng ta đã thuê một vị thủ lĩnh du mục cống hiến cho phe mình rồi.§!"
 nomadic_paragon_all_hired: "§R$RT_ETERNAL_CHAMPION$ đã dùng hết mọi liên lạc.§!"
 nomadic_paragon_explanation: "\nMột vị thủ lĩnh du mục sẽ tiếp cận chúng ta."
 champions_forge_trust_tt: "Chúng ta phải giành được sự tín nhiệm của §Y$RT_ETERNAL_CHAMPION$§!."
 nomads.100.d: "Hãy §Ynói rõ hơn§! về các sự kiện thi đấu của các người."
 nomads.100.d.reply: "Cứ khoảng mỗi 25 năm, những kẻ mạnh có chí hướng trở thành huyền thoại sẽ tiến hành những cuộc đối đầu đỉnh cao! Họ dẫn dắt hạm đội của mình toàn bộ ra sân, địa điểm thi đấu luôn được luân phiên thay đổi, và những trận chém giết khốc liệt đó chưa bao giờ làm ai thất vọng!\n\nNgười chiến thắng sẽ giành được phần thưởng hậu hĩnh, uy tín tối cao, và chiếm một vị trí trên bảng xếp hạng của chúng tôi.\n\nBỏ lỡ tiếng gọi, là bỏ lỡ cơ hội ngàn vàng. Chúng tôi không bao giờ chờ đợi ai."
 nomads.100.e: "§YMua§! dữ liệu chiến đấu của kẻ thù không đội trời chung của chúng tôi."
 nomads.100.e.reply: "Dữ liệu chiến đấu, vừa mới truyền về! Các nhà phân tích của chúng tôi đã nghiên cứu kỹ lưỡng từng khoảnh khắc giao tranh của hạm đội đối thủ của các bạn. Quy luật, sơ hở, điểm yếu. Chúng tôi sẽ giao gói dữ liệu này cho các bạn, phần còn lại phụ thuộc vào các pháo thủ của các bạn."
 cfl_combat_data: "Bản tóm tắt chiến đấu Lò Rèn Quán Quân"
 cfl_combat_data_desc: "Từ bản phân tích giao tranh chi tiết mua của đội ngũ sản xuất \"Lò Rèn Quán Quân Live!\", đã hé lộ những mô hình chiến đấu của đối thủ cạnh tranh của chúng ta."

 contract_host_cfl_tournament: "Đề cử hệ sao tổ chức Giải đấu Lò Rèn Quán Quân"
 contract_host_cfl_tournament_issuer_desc: "Chúng ta đã mua quyền địa điểm cho giải đấu \"Lò Rèn Quán Quân Live!\" tiếp theo. Có lẽ chúng ta có thể lợi dụng điểm này để tìm kiếm lợi thế cho mình."
 contract_host_cfl_tournament_desc: "$contract_host_cfl_tournament_issuer_desc$"
 contract_host_cfl_tournament_chain_title: "$contract_host_cfl_tournament$"
 contract_host_cfl_tournament_chain_desc: "$contract_host_cfl_tournament_desc$"
 champions_forge_tournament_ongoing_tt: "$TRIGGER_FAIL$§R Lò Rèn Quán Quân đang tổ chức giải đấu, chúng ta cần phải đợi§!"

 nomads.105.name: "[from.GetName]" #country - may return as an unknown name
 nomads.105.desc: "Thành bang không gian Lò Rèn Quán Quân không phản hồi lời kêu gọi của chúng ta."
 nomads.105.desc.unknown: "Đừng nói đến chuyện dịch thuật, chỉ cần chúng ta gửi thông điệp cho [From.GetName], họ lập tức ngắt kết nối, từ chối giao tiếp với chúng ta."
 nomads.105.a: "Họ sao dám chứ?!"

 nomads.110.desc: "Tôi biết ngay là anh làm được mà!\n\nChúng ta sẽ liên lạc lại."
 nomads.115.desc: "Bỏ tiền thưởng trên bàn mà không lấy? Thật quá lãng phí!\n\nTuy nhiên, nếu bạn đổi ý và có thể tìm thấy chúng tôi, Lò Rèn Quán Quân luôn chào đón những người chiến thắng."

 nomads.120.desc: "Chà, bạn đang tìm một người mới sao? Chiến binh, môi giới, lữ khách... Họ không phải là những kẻ bạn chỉ nhìn một lần là có thể quên, thiên hà này cũng hiếm khi để họ bặt vô âm tín quá lâu. Chúng tôi quả thực đã từng gặp qua vài người trong suốt chuyến đi. Nhưng anh bạn à, ở cái chốn này, chẳng có bữa trưa nào là miễn phí cả. Trả phí săn đầu người cho chúng tôi, tôi sẽ sắp xếp cuộc gặp cho bạn."
 nomads.120.a: "Chúng tôi rất hứng thú."

 nomads.125.name: "Lò Rèn Quán Quân: Bùng nổ bản tóm tắt chiến đấu"
 nomads.125.desc: "Này, kẻ thách thức! Bản tóm tắt chiến đấu của bạn đã lỗi thời, mà cục diện chiến thuật thì luôn thay đổi trong chớp mắt. Đối thủ mới, chiến thuật hạm đội mới, và cả những lỗ hổng mới xuất hiện.\n\nCác nhà phân tích của chúng tôi đã chuẩn bị sẵn cho bạn một bộ hồ sơ hoàn toàn mới, có ký tên bạn. Điều kiện không đổi, ưu thế hỏa lực không đổi. Muốn có nó không?"
 nomads.125.a: "§YCập nhật§! bản tóm tắt."
 nomads.125.b: "Tạm thời bỏ qua."

 nomads.255.name: "Lò Rèn Quán Quân: Ngọn lửa bùng cháy lại"
 nomads.255.desc: "Chào mừng quý vị đón xem chương trình \"Lò Rèn Quán Quân\" trực tiếp! Đây là bữa tiệc thị giác và sự hủy diệt đỉnh cao nhất toàn cõi ngân hà.\n\nGiải đấu Lò Rèn Quán Quân tiếp theo được tổ chức tại hệ sao §Y[champions_forge_enclave_system.GetName]§! hiện đã mở đăng ký. Một cuộc hỗn chiến hoành tráng đang chờ đợi tất cả mọi người.\n\nYêu cầu đầu vào: Một hạm đội có quy mô tối đa §H[champions_forge_enclave_country.GetCFLFleetSizeRequirement] quy mô hạm đội§!.\n\nNgười chiến thắng sẽ giành được phần thưởng, danh vọng cùng chiếc cúp lớn của Lò Rèn Quán Quân vô thượng.\n\nBạn muốn tự tay rèn nên huyền thoại của mình? Hãy đăng ký tham gia ngay.\n\nMuốn được yên bình tĩnh lặng ư? Không có cửa đâu!"

 nomads.255.desc.relic: "$nomads.255.desc$\n\nNgoài ra, chúng tôi cũng định lấy lại chiếc cúp."
 nomads.255.a: "Tính cả chúng tôi vào! Chúng tôi nhất định sẽ chiến thắng."
 nomads.255.a.tooltip: "Nghiên cứu dự án đặc biệt tại §H[capital_scope.solar_system.GetName]§!."
 nomads.255.b: "Lần sau nhất định tham gia."
 nomads.255.c: "Đừng gửi thư mời đến nữa."
 nomads.255.c.tooltip: "Liên hệ §H$NAME_Champions_Forge_Enclave$§! để kích hoạt lại lời mời giải đấu."
 CFL_NO_TOURNAMENT_TITLE: "Giải đấu bị hủy"
 CFL_NO_TOURNAMENT_DESC: "Do thiếu các thí sinh đạt chuẩn, §YLò Rèn Quán Quân Live!§! đã quyết định hủy bỏ giải đấu lần này."

 CHAMPIONS_FORGE_TRAVEL_FLEET_REQ: "Yêu cầu đầu vào: Một hạm đội có quy mô tối đa §H[event_target:champions_forge_enclave_country.GetCFLFleetSizeRequirement] quy mô hạm đội§!."

 cfl_fleet_size_heavy_late: "500"
 cfl_fleet_size_medium_late: "200"
 cfl_fleet_size_medium_mid: "100"
 cfl_fleet_size_small_mid: "50"
 cfl_fleet_size_small_early: "25"

 nomads.270.name: "Khai mạc Lò Rèn Quán Quân"
 nomads.270.desc: "\"Hỡi các sinh vật đá, dạng sống hữu cơ và những cỗ máy chiến tranh đến từ khắp nơi trong dải ngân hà — chào mừng trở lại với buổi phát sóng trực tiếp Giải đấu 'Lò Rèn Quán Quân'!\n\nNhững kẻ nhàn rỗi trong hệ sao §Y[event_target:champions_forge_enclave_system.GetName]§! đã bị dọn dẹp sạch sẽ, bàn cá cược cũng đang nóng bừng bừng, tôi có linh cảm rằng chúng ta sắp sửa tận mắt chứng kiến những món đồ kim khí đắt tiền bị thiêu rụi thành phế liệu.\n\nXin quý khán giả trước màn hình ghi nhớ: Đây không phải là cuộc tuần tra thường lệ hay một màn cọ xát biên giới nào đó. Nơi đây là lò rèn! Không một ai có thể nguyên vẹn mang theo danh dự mà rút lui đâu.\n\nCác thí sinh... Hãy! Kiến tạo! Huyền thoại! Nào!\""

 nomads.285.desc.intro: "Cuộc hỗn chiến cuồng nhiệt cuối cùng cũng lắng xuống tại hệ sao §Y[event_target:champions_forge_enclave_system.GetName]§!. Lò rèn đã tắt lửa. Những mảnh vỡ trôi dạt trong ánh sao dần tắt, đèn báo nguy hiểm nhấp nháy sáng lại.\n\n\"Thật là một khung cảnh hoành tráng!\" Bình luận viên của chương trình Lò Rèn Quán Quân gào thét, giọng khàn đi vì bộc lộ cảm xúc chân thật. \"Đây chính là lý do chúng ta tới đây! Đây chính là khoảnh khắc mà khán giả toàn cõi ngân hà đang mỏi mắt chờ đợi!\""

 nomads.285.name: "Lò Rèn Quán Quân bế mạc"
 nomads.285.desc: "$nomads.285.desc.intro$\n\nHạng ba chẳng có gì đáng xấu hổ, điều này chính là minh chứng cho việc chúng ta có đủ tư cách đứng trước ống kính phát sóng. Dù đứng ở vị trí thấp nhất trên bục nhận giải, chúng ta vẫn có thể nhìn xuống những hạm đội đã bị chúng ta đánh tan tác."
 nomads.285.a: "Hạm đội của chúng ta đã bay lượn rất tuyệt!"

 nomads.290.name: "Lò Rèn Quán Quân bế mạc"
 nomads.290.desc: "$nomads.285.desc.intro$\n\nHạng hai nhạt nhẽo làm sao! Chúng ta đã đưa [Species.GetHandName] ra muốn đoạt lấy chiếc cúp, nhưng lại đành trơ mắt nhìn nó bị kẻ khác cướp mất. Thôi được rồi, cứ để bọn họ ăn mừng đi. Chúng ta sẽ ghi nhớ tất cả những chuyện này. Khi lò rèn vẫy gọi lần nữa, chúng ta tuyệt đối sẽ không thua thêm một lần nào nữa."
 nomads.290.a: "Giá như lúc đó chúng ta nâng cấp hạm đội thêm chút nữa..."

 nomads.295.name: "Lò Rèn Quán Quân bế mạc"
 nomads.295.desc: "$nomads.285.desc.intro$\n\nHạng nhất! Dưới những ánh nhìn sùng bái của toàn cõi ngân hà, chúng ta đã giật lấy chiếc cúp từ tay ban tổ chức Lò Rèn Quán Quân và giương nó lên cao. Âm vang của chiến thắng lần này sẽ còn lan truyền đi rất xa bên ngoài đấu trường.\n\nGiờ đây, cả dải ngân hà này sẽ phải kinh sợ trước hạm đội của chúng ta."
 nomads.295.a: "Lẽ nào lại còn có gì bất ngờ sao?"

 nomads.305.name: "Lò Rèn Quán Quân bế mạc"
 nomads.305.desc: "$nomads.285.desc.intro$\n\nChúng ta chẳng giành được danh hiệu gì. Tên chúng ta sẽ không được khắc lên chiếc cúp, và khán giả cũng sẽ quay sang chú ý đến những ngôi sao chói lọi hơn. Chúng ta phải quay về thôi."
 nomads.305.a: "Ai lại quan tâm đến mấy cái cuộc thi vô nghĩa này chứ?"

 nomads.306.name: "Lò Rèn Quán Quân đình chiến"
 nomads.306.desc: "Cục diện cuộc thi trong hệ sao §Y[event_target:champions_forge_enclave_system.GetName]§! diễn ra vô cùng giằng co, bất phân thắng bại. Các hạm đội trên đà sụp đổ vẫn truy đuổi bám riết lấy nhau, chẳng ai có thể tung ra đòn quyết định.\n\nNhưng không có một kết cục chiến thắng, cũng chẳng có ai giương cao chiếc cúp, càng không có ai bước lên bục vinh quang. Đội ngũ Lò Rèn Quán Quân cuối cùng phải thừa nhận: không thể xác định được người chiến thắng. Các đội thi đấu bị giải tán về nhà, chương trình phát sóng cũng lặng lẽ chuyển sang phát lại."
 nomads.306.a: "Một cái kết sáo rỗng."

 nomads.405.desc: "Kéo theo vụ nổ của con tàu Arkship Lò Rèn Quán Quân, tín hiệu phát sóng cũng bị cắt đứt thành màn hình đen. Chúng ta đã lùng sục các mảnh vỡ trong hệ sao §Y[champions_forge_destruction_system.GetName]§!, và vớt được nhà kho đầy ắp của chúng.\n\n\"Kỳ quan\" cuối cùng của chúng mang lại khá nhiều lợi nhuận... cho chúng ta."
 nomads.405.desc.relic: "$nomads.405.desc$\n\nTên của chúng ta sẽ mãi mãi được khắc trên chiếc cúp với tư cách là những người cuối cùng... Cùng với sự biến mất của đám ngốc Lò Rèn Quán Quân, sẽ chẳng bao giờ có một nhà vô địch nào khác đến thách thức vị thế của chúng ta nữa."

 nomads.410.desc: "Chỉ trong vòng vài giây ngắn ngủi, dải ngân hà đã được chứng kiến màn trình diễn cuối cùng của Lò Rèn Quán Quân.\n\nMàn hình rung lắc dữ dội, kèm theo những tiếng la hét chói tai của bình luận viên, tiếp sau đó là một bức tường lửa nuốt trọn chiếc tàu Arkship.\n\nSau đó: Hình ảnh bị cắt đứt.\n\nThành bang không gian của Lò Rèn Quán Quân Live! nằm ở hệ sao §Y[champions_forge_destruction_system.GetName]§! đã bị §Y[champions_forge_destroyer.GetName]§! phá hủy."
 nomads.410.desc.relic: "$nomads.410.desc$\n\nTên của chúng ta sẽ mãi mãi là những người cuối cùng được khắc trên chiếc cúp... Cùng với sự lụi tàn của Lò Rèn Quán Quân, sẽ chẳng bao giờ có thêm nhà vô địch mới nào đến thách thức vị thế của chúng ta nữa."
 nomads.410.a: "Dải ngân hà rồi sẽ luôn tìm thấy thú vui mới. Trước nay vẫn luôn như vậy."

 r_cfl_trophy: "Cúp Lò Rèn Quán Quân Live!"
