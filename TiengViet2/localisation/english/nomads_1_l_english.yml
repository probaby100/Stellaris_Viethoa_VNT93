# Stellar Cannon crisis responses
 nomads.8050.name: "Hệ Thống Kiểm Soát Hỏa Lực Bị Ghi Đè"
 nomads.8050.desc: "Giải pháp ngắm bắn: Biến dạng.\n\nĐã áp dụng hiệu chỉnh.\n\nĐánh giá lại mối đe dọa: Không có."
 nomads.8050.a: "Chúng ta đã bị bác bỏ quyền kiểm soát."
 nomads.8055.name: "Món Quà Xuyên Qua Bức Màn"
 nomads.8055.desc: "nữa đi.\n\nngươi rót sức mạnh vào chúng ta như một lễ vật hiến tế. chúng ta cảm nhận được nó. chúng ta lớn mạnh... đừng dừng lại."
 nomads.8055.a: "Chúng ta chỉ khiến chúng mạnh hơn mà thôi."
 nomads.8060.name: "Một Nỗi Thất Vọng"
 nomads.8060.desc: "Ngươi thiêu đốt biết bao nhiêu thứ chỉ để ta không hề mảy may suy suyển...\n\nThật lãng phí. Ta từng hy vọng nhiều hơn ở ngươi. Đừng vứt bỏ sức lực của ngươi vào thứ không thể bị tổn thương."
 nomads.8060.a: "Bà ấy đã kỳ vọng nhiều hơn ở chúng ta."
 nomads.8065.name: "Bài Học Đáp Trả"
 nomads.8065.desc: "Lại nữa. Vẫn sự lãng phí đó, vẫn kết quả đó.\n\nTa trả lại những gì ngươi đã tiêu hao, không phải để làm tổn thương ngươi, mà để ngươi cảm nhận được sức nặng của nó. Hãy học lấy từ điều này. Ta sẽ không đứng nhìn ngươi tự hủy hoại mình lần thứ ba đâu."
 nomads.8065.a: "Bài học này chúng ta xin nhận lấy."

