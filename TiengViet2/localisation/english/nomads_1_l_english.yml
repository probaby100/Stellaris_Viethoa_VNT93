 MESSAGE_NOMAD_EXPLORATION_TITLE: "Thám Hiểm Du Mục"
 NOMAD_EXPLORATION_WONDERS_DESC: "Hệ sao $SYSTEM|Y$ chứa một §YKỳ Quan Cổ Đại§! phi thường.\nMột cảnh tượng đầy phấn khích.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."
 NOMAD_EXPLORATION_THREAT_DESC: "Hệ sao $SYSTEM|Y$ ẩn giấu một §YMối Đe Dọa Cổ Xưa§! nguy hiểm.\nChúng ta tốt nhất nên cẩn thận hơn ở đây.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."
 NOMAD_EXPLORATION_ENCLAVE_DESC: "Hệ sao $SYSTEM|Y$ tồn tại một §YTrạm Tự Trị Không Gian§! phi thường.\nHọ có lẽ sẵn lòng tiến hành liên lạc.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."
 NOMAD_EXPLORATION_LANDMARK_DESC: "Hệ sao $SYSTEM|Y$ sở hữu một §YĐịa Danh Mốc Giới Biển Sao§! phi thường.\nThật là một cảnh tượng tuyệt đẹp.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."
 NOMAD_EXPLORATION_MARAUDERS_DESC: "Hệ sao $SYSTEM|Y$ thuộc về những kẻ §YMarauder§! kiêu ngạo.\nChúng ta nên hành sự thận trọng.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."
 NOMAD_EXPLORATION_SPECTACLE_DESC: "Hệ sao $SYSTEM|Y$ là một §YThắng Cảnh Tự Nhiên§! phi thường.\nVẻ đẹp của nó là vô song.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."
 NOMAD_EXPLORATION_PRECURSOR_DESC: "Hệ sao $SYSTEM|Y$ ẩn chứa dấu vết của các §YTiền Thân§! cổ đại.\nNhững di tích trang nghiêm này khiến người ta sinh lòng kính sợ.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."
 NOMAD_EXPLORATION_ECOLOGY_DESC: "Hệ sao $SYSTEM|Y$ đóng vai trò thú vị trong hệ thống §YSinh Thái Học Không Gian§!.\nNơi đây có rất nhiều điều đáng để chúng ta học hỏi.\n\nNhận được một lượng §Gnhỏ§! phần thưởng §YĐoàn kết§!."

 nomads.4715.name: "Cảnh Sắc Đáng Chiêm Ngưỡng"
 nomads.4715.desc: "Một trong những phần thưởng lớn nhất mà cuộc sống du mục và sự lang bạt bất tận mang lại cho chúng ta chính là khám phá những chân trời mới. Ngay cả sau một hành trình dài đằng đẵng, vẫn luôn tồn tại những cảnh sắc chưa từng thấy qua, dù là tuyệt mỹ hay gây kinh sợ. Trí tò mò của chúng ta luôn khao khát khám phá những kỳ quan này.\n\nTuy nhiên, đối với tàu Ark của chúng ta, mỗi cảnh sắc mới không chỉ đơn thuần là điều kỳ lạ để chiêm ngưỡng, mà còn là một cơ hội học hỏi tri thức mới, phản tỉnh và trưởng thành."
 nomads.4715.a: "Hệ sao này thật bao la và ngập tràn kỳ tích."
 nomads.4715.b: "Hệ sao này vừa vô tận bao la lại vừa ngập tràn sát khí."

 leviathans.500.l: "Các bạn có thể chỉ dẫn cho chúng tôi một vài §Yhệ sao thú vị§! không?"
 leviathans.500.l.tt: "Điều này sẽ tạo ra một §YĐiểm Quan Tâm§! trong chuỗi sự kiện §YThám Hiểm Du Mục§! tại một hệ sao mà chúng ta chưa từng ghé thăm."
 leviathans.500.l.opinion: "$leviathans.500.d.opinion$"
 leviathans.500.l.cooldown: "Chúng ta gần đây vừa mới thỉnh cầu hướng dẫn từ Đấng Giám Tuyển. Chúng ta phải đợi một thời gian mới có thể yêu cầu dịch vụ của họ lần nữa."
 leviathans.500.l.desc: "Dĩ nhiên rồi! Hải đồ sao của chúng tôi cho thấy bạn có thể sẽ hứng thú với hệ sao này. Liệu bạn có thể gửi lại những phát hiện của mình cho chúng tôi không?"
 curator_guidance_poi_name: "Sự Chỉ Dẫn Của Đấng Giám Tuyển"
 curator_guidance_poi_desc: "Đấng Giám Tuyển đã chỉ ra cho chúng ta một hệ sao đáng để thám hiểm."
