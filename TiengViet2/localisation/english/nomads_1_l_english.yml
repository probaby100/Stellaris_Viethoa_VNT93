# Nomad Exploration - Wanderlust
 ap_wanderlust: "Lãng Du Tinh Nhai"
 ap_wanderlust_desc: "Ở mỗi ngóc ngách của thiên hà đều có những kỳ quan đáng để chiêm ngưỡng, cũng như những bài học đáng để đúc kết."
 ap_wanderlust_tooltip: "Sử dụng §YTàu Ark§! của bạn để tuần du qua các hệ sao tráng lệ kỳ ảo đó nhằm mở khóa nhiều loại §Yhiệu ứng hiệu chỉnh§!"

 nomad_exploration_chain_title: "Lãng Tử Du Mục"
 nomad_exploration_chain_desc: "Sử dụng tàu Ark để khám phá nhằm mở khóa hiệu ứng và nhận £unity£ §YĐoàn kết§!:\n— Hoàn thành §H4§! danh mục: §G+1§! Số lượng quận tối đa của tàu Ark và §G-10%§! phí duy trì thủ lĩnh\n— Hoàn thành §Htất cả§! danh mục: §G+2§! Số lượng quận tối đa của tàu Ark, §G-20%§! phí duy trì thủ lĩnh, §G-10%§! chi phí truyền thống"
 ancient_wonders_modifier: "Kẻ Thăm Viếng Kỳ Quan Cổ Đại"
 ancient_wonders_modifier_desc: "Di tích của tiền nhân khiến người ta phải kính sợ, nhưng cũng vô cùng truyền cảm hứng."
 antique_threat_modifier: "Điều Tra Viên Mối Đe Dọa Cổ Xưa"
 antique_threat_modifier_desc: "Những mãnh thú sống trong hệ sao này vừa đáng sợ lại vừa khiến người ta kinh ngạc."
 galactic_landmark_modifier: "Du Khách Biển Sao"
 galactic_landmark_modifier_desc: "Con đường rải rác những địa danh mốc giới. Chúng mang lại sự che chở và dẫn đường cho chúng ta, đồng thời dệt nên mạch nguồn câu chuyện của chúng ta."
 marauder_modifier: "Người Liên Lạc Marauder"
 marauder_modifier_desc: "Các hệ sao cướp bóc hoang dã đầy nguy hiểm và khó lập bản đồ, nhưng chúng ta tìm thấy sự đồng cảm trong lối sống cõi hư không chung."
 natural_spectacle_modifier: "Người Quan Sát Tự Nhiên"
 natural_spectacle_modifier_desc: "Đối với những ai sẵn lòng ngắm nhìn, vũ trụ luôn tràn ngập vẻ đẹp."
 precursor_modifier: "Nhà Nghiên Cứu Nền Văn Minh Tiền Thân"
 precursor_modifier_desc: "Từ tàn tích của các nền văn minh đã lụi tàn, chúng ta học cách định hình tương lai của chính mình."
 space_ecology_modifier: "Người Quan Sát Sinh Thái Học Không Gian"
 space_ecology_modifier_desc: "Các bầy thú giữa cõi hư không sinh sống trong sự hòa hợp đầy mê hoặc nhưng cũng không kém phần tàn khốc, và chúng ta cũng có thể tìm thấy vị trí của riêng mình trong sự cân bằng đó."
 enclave_modifier: "Người Liên Lạc Trạm Tự Trị"
 enclave_modifier_desc: "Người của Trạm Tự Trị có thể không phải là dân du mục, nhưng họ hiểu sâu sắc thực tế của cuộc sống hư không, và chỉ cần mức giá phù hợp, họ có thể giúp đỡ."

 categories_completed_progress: "Danh mục đã hoàn thành"
 NOMAD_EXPLORATION_ANCIENT_WONDERS: "Kỳ Quan Cổ Đại"
 NOMAD_EXPLORATION_ANCIENT_WONDERS_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.ancient_wonders_system_seen]/[root.ancient_wonders_system_count]§! hệ sao.\nKhám phá các hệ sao §YKỳ Quan Cổ Đại§! trong thiên hà.\n§YKỳ Quan Cổ Đại§! là thành tựu của các nền văn minh năm xưa."
 NOMAD_EXPLORATION_ANTIQUE_THREAT: "Mối Đe Dọa Cổ Xưa"
 NOMAD_EXPLORATION_ANTIQUE_THREAT_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.antique_threat_system_seen]/[root.antique_threat_system_count]§! hệ sao.\nKhám phá các hệ sao §YMối Đe Dọa Cổ Xưa§! trong thiên hà.\n§YMối Đe Dọa Cổ Xưa§! là những thực thể đáng sợ lang thang giữa cõi hư không."
 NOMAD_EXPLORATION_ENCLAVE: "Hệ Sao Trạm Tự Trị Không Gian"
 NOMAD_EXPLORATION_ENCLAVE_CATEGORY_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.enclave_system_seen]/[root.enclave_system_count]§! hệ sao.\nKhám phá các hệ sao §YTrạm Tự Trị Không Gian§! trong thiên hà.\n§YTrạm Tự Trị Không Gian§! là những đối tác tiềm năng thú vị."
 NOMAD_EXPLORATION_GALACTIC_LANDMARK: "Địa Danh Mốc Giới Biển Sao"
 NOMAD_EXPLORATION_GALACTIC_LANDMARK_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.galactic_landmark_system_seen]/[root.galactic_landmark_system_count]§! hệ sao.\nKhám phá các hệ sao §YĐịa Danh Mốc Giới Biển Sao§! trong thiên hà.\n§YĐịa Danh Mốc Giới Biển Sao§! chứa đựng một số cấu trúc và đặc điểm nổi bật."
 NOMAD_EXPLORATION_MARAUDER: "Hệ Sao Marauder"
 NOMAD_EXPLORATION_MARAUDER_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.marauder_system_seen]/[root.marauder_system_count]§! hệ sao.\nKhám phá các hệ sao §YMarauder§! trong thiên hà.\n§YMarauder§! là những cư dân hư không hiếu chiến và hải tặc."
 NOMAD_EXPLORATION_NATURAL_SPECTACLE: "Thắng Cảnh Tự Nhiên"
 NOMAD_EXPLORATION_NATURAL_SPECTACLE_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.natural_spectacle_system_seen]/[root.natural_spectacle_system_count]§! hệ sao.\nKhám phá các hệ sao §YThắng Cảnh Tự Nhiên§! trong thiên hà.\n§YThắng Cảnh Tự Nhiên§! là những kỳ quan hình thành tự nhiên trong vũ trụ."
 NOMAD_EXPLORATION_PRECURSOR: "Di Tích Tiền Thân"
 NOMAD_EXPLORATION_PRECURSOR_CATEGORY_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.precursor_system_seen]/[root.precursor_system_count]§! hệ sao.\nKhám phá các hệ sao §YDi Tích Tiền Thân§! trong thiên hà.\n§YDi Tích Tiền Thân§! là tàn dư của các đế quốc đã tiêu vong từ lâu."
 NOMAD_EXPLORATION_SPACE_ECOLOGY: "Sinh Thái Học Không Gian"
 NOMAD_EXPLORATION_SPACE_ECOLOGY_DESC: "§EYêu cầu:§!\nĐã khám phá §Y[root.space_ecology_system_seen]/[root.space_ecology_system_count]§! hệ sao.\nKhám phá các hệ sao §YSinh Thái Học Không Gian§! trong thiên hà.\nCác hệ sao §YSinh Thái Học Không Gian§! đóng vai trò sống còn trong vòng đời của các sinh vật không gian."

