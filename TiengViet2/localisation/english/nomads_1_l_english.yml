 tech_waystation_3: "Hậu Cần Tuyến Tiếp Vận Tiên Tiến"
 tech_waystation_3_desc: "Các giao thức điều phối tiên tiến liên kết các $starbase_waystation_1_plural$ xa xôi thành một mạng lưới gắn kết. Tài nguyên, tín hiệu và vật tư lưu chuyển qua tuyến tiếp vận với độ chính xác vô song."
