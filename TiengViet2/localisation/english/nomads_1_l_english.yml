 nomads.7005.title: "Người Trôi Dạt Và Người Định Cư"
 nomads.7005.desc: "§Y[event_target:migrating_arkship.GetName]§! đã neo đậu trên quỹ đạo của [event_target:migrating_planet.GetName] một khoảng thời gian đủ lâu, phi hành đoàn cùng với người dân địa phương đã có được sự hiểu biết đầy đủ về đối phương. Hiện tại, một số ít người của cả hai bên đều đang thỉnh cầu được hoán đổi nơi thuộc về: Những người định cư khát khao được ôm lấy cõi hư không rộng lớn, còn những người trôi dạt thì lại luôn hướng về mảnh đất vững chãi dưới chân."
 nomads.7005.desc.forever_cruise: "§Y[event_target:migrating_arkship.GetName]§! đã lưu lại trên quỹ đạo của [event_target:migrating_planet.GetName] một khoảng thời gian đủ lâu, đến mức mà cảm giác mới mẻ đã bắt đầu trở nên buồn vui lẫn lộn. Một số ít hành khách cảm thấy bồn chồn bất an khi di chuyển giữa các cảng neo đậu khác nhau, thỉnh cầu được xuống tàu định cư vĩnh viễn; còn ở phía dưới, người dân địa phương thì lại đang xếp thành hàng dài trước quầy bán vé, tranh giành bất kỳ một chiếc giường trống nào trên tàu, khát khao được tự mình trải nghiệm đủ loại kỳ quan đã được hứa hẹn trong các cuốn sách quảng cáo."
 nomads.7005.desc.servitor: "Những vật phẩm trưng bày sống động của chúng ta và dân số của [event_target:migrating_planet.GetName] đã bắt đầu tiến hành những cuộc tiếp xúc nhẹ nhàng ở cả hai phía ranh giới thân tàu của chúng ta. Trong số bọn họ có một số người đã thỉnh cầu được lên §Y[event_target:migrating_arkship.GetName]§! để lánh nạn; trong số chúng ta cũng có một số người khát khao được cảm nhận bầu trời rộng mở. Biết đâu việc cho phép cuộc di cư này diễn ra, có thể sẽ tối đa hóa được phúc lợi của các sinh vật hữu cơ."
 nomads.7005.desc.same_species: "§Y[event_target:migrating_arkship.GetName]§! đã lưu lại trên quỹ đạo của [event_target:migrating_planet.GetName] một khoảng thời gian đủ lâu, phi hành đoàn cùng với người dân địa phương đều đã nhận ra được tình máu mủ ruột rà của đối phương. Giờ đây, một số ít người của cả hai bên đều đang thỉnh cầu được hoán đổi giường ngủ: Những người anh em họ hàng đã định cư khát khao được lao về phía cõi hư không rộng lớn, còn những người trôi dạt thì lại bị thu hút bởi mảnh đất vững chãi nơi người thân của họ đang sinh sống."
 nomads.7005.a: "Bảo họ ký hợp đồng đi, đồng thời hoan nghênh những vị khách của chúng ta lên tàu."
 nomads.7005.b: "Chấp thuận. Chỉ lần này thôi..."
 nomads.7005.c: "Những kẻ chỉ biết ngồi yên một chỗ không có vị trí trong hạm đội của chúng ta."

