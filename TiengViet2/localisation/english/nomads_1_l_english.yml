 arkship.1300.name: "Lần Cởi Trói Bắt Buộc Phải Có"
 arkship.1300.desc: "Đội ngũ kỹ thuật cấp cao trên Tàu Ark §Y[Root.GetName]§! đã đệ trình một bản báo cáo đánh giá cấu trúc, bản báo cáo này kêu gọi sự việc đã không thể tiếp tục trì hoãn được nữa. Mái nhà của chúng ta đang cực kỳ cần được tu sửa.\n\nBản đề xuất này mang tính toàn diện: tiến hành đại tu luân phiên theo từng phân đoạn, bắt đầu từ cơ sở hạ tầng phát điện, sau đó lần lượt tiến hành cho boong tàu canh tác, khu vực phòng ngự và khu vực cư trú. Cư dân cần phải tạm thời chuyển đi nơi khác. Các cơ sở hạ tầng sẽ bị ngừng hoạt động. Những tính toán của bên kỹ thuật cho thấy, dựa theo tiến độ của công việc, cuộc đại tu toàn diện này sẽ cần tốn khoảng từ 10 đến 11 năm tiêu chuẩn.\n\nCông việc này sẽ mang tính chất phá hoại. Thế nhưng một sự lựa chọn khác lại là, con tàu này mỗi khi bay qua một giây parsec, thì tính đáng tin cậy của nó sẽ lại bị giảm đi một phần."
 arkship.1300.desc.machine: "Chương trình phụ chẩn đoán trên §Y[Root.GetName]§! đã đánh dấu một ngưỡng giới hạn mang tính then chốt của hệ thống phụ cấu trúc chính. Tàu Ark đang cực kỳ cần được tiến hành bảo trì.\n\nGiao thức khôi phục yêu cầu phải tiến hành đại tu luân phiên đối với từng khu vực. Các trạm phát điện, khu vực gieo trồng, cơ sở hạ tầng phòng ngự cùng với khu vực cư trú sẽ lần lượt bị ngắt kết nối để tiến hành tái thiết toàn diện. Trong suốt quá trình này, tính liên tục của các hoạt động vận hành sẽ bị sụt giảm. Thời gian hoàn thành dự kiến: tính theo tốc độ vận hành tiêu chuẩn, khoảng 130 tháng.\n\nViệc khôi phục không thể tiếp tục trì hoãn."
 arkship.1300.desc.hive: "Ý thức tập thể nhận thức được rằng tình trạng của Tàu Ark §Y[Root.GetName]§! đang ngày một xấu đi: kết cấu chịu lực đang bị uốn cong tại những vị trí không nên bị uốn cong; đường ống truyền tải năng lượng điện đang dần bị ăn mòn. Sự lơ là tích tụ qua bao thế hệ đã đạt đến mức độ mà chúng ta không thể tiếp tục trì hoãn được nữa.\n\nChúng ta cần một chu kỳ cập nhật toàn diện: tiến hành theo từng phân đoạn, từ các trạm động lực lan rộng ra bên ngoài, lần lượt đi qua các khoang tiếp tế, lớp vỏ phòng ngự và boong tàu cư trú. Cùng với việc công trình này được tiến hành, các khu vực sẽ lần lượt bị phong tỏa, những cư dân ở trong đó cũng sẽ bị di dời đi nơi khác. Chu kỳ cập nhật này sẽ kéo dài từ 10 đến 11 năm tiêu chuẩn."
 arkship.1300.a: "Bắt đầu tân trang."
 arkship.1300.a.machine: "Khởi chạy giao thức khắc phục."
 arkship.1300.a.hive: "[Root.GetName] bắt buộc phải được hồi sinh."
 refurbishment_ongoing: "Tân Trang Toàn Diện: Đang Tiến Hành"
 refurbishment_ongoing_desc: "Chiếc Tàu Ark này đang tiến hành đợt tân trang toàn diện về mặt cấu trúc. Các hoạt động thi công tại nhiều khu vực đang dẫn đến việc tính ổn định trong phạm vi của phi thuyền bị gián đoạn, năng lực xây dựng của các khu vực cũng theo đó mà bị tổn hại."
 refurbishment_generator_offline: "$district_ark_generator$: Đang Tân Trang"
 refurbishment_generator_offline_desc: ""

 arkship.1305.name: "Boong Tàu Canh Tác"
 arkship.1305.desc: "Cơ sở hạ tầng phát điện đã vượt qua khâu chứng nhận, đồng thời đã khôi phục lại trạng thái vận hành tối đa. Đội ngũ thi công đã vận chuyển thiết bị xuống khu vực nông nghiệp ở tầng thấp hơn.\n\nCác bệ gieo trồng sẽ lần lượt bị ngừng hoạt động theo từng phân đoạn. Đây không chỉ là một thách thức về mặt cấu trúc, mà còn là một thách thức về mặt hậu cần: kho dự trữ lương thực cần phải được quản lý một cách tỉ mỉ, phế thải kiến trúc sẽ bị ứ đọng lại tại các khu vực công cộng trong nhiều tháng trời.\n\nNhững người kỹ sư nói rằng, phần khó khăn nhất không phải là việc hàn gắn, mà là sự chờ đợi."
 arkship.1305.desc.machine: "Việc sửa chữa khu vực phát điện đã thông qua khâu chứng nhận, đồng thời đã khôi phục lại mức sản lượng bình thường. Phạm vi vận hành hiện tại đã được chuyển sang cơ sở hạ tầng của bộ phận thứ hai.\n\nCác khu vực được chỉ định sẽ lần lượt bị ngắt kết nối để tiến hành đại tu cấu trúc. Sản lượng vận hành của các bộ phận bị ảnh hưởng trong suốt quá trình này sẽ bị sụt giảm theo tỷ lệ tương ứng.\n\nCông việc sửa chữa tiếp tục được tiến hành bên trong các thông số đã được dự trù."
 arkship.1305.desc.hive: "Tổ máy phát điện đã khôi phục lại việc cung cấp năng lượng điện toàn diện.\n\nSự chú ý của chúng ta hướng vào bên trong, nhìn về phía những khoang cung cấp dưỡng chất khổng lồ đang duy trì cho các hoạt động của thuộc địa. Các bể nuôi cấy và cơ quan tuần hoàn dinh dưỡng trên phi thuyền bắt buộc phải lần lượt bị ngắt kết nối, để tiến hành việc tân trang cấu trúc. Kho dự trữ lương thực đã sẵn sàng, nhằm mục đích bù đắp cho những thiếu hụt trong khoảng thời gian này.\n\nTrong lúc \"dạ dày\" của thuộc địa được tái thiết, nó sẽ dựa vào lượng thức ăn dự trữ để duy trì sự sống."
 arkship.1305.a: "Sự phá hoại kiểu này là điều bắt buộc."
 arkship.1305.a.machine: "Tiếp tục công việc sửa chữa dựa theo kế hoạch."
 arkship.1305.a.hive: "Chu kỳ cập nhật vẫn phải tiếp tục được tiến hành."
 arkship.1305.a.tt: "Xóa bỏ mọi ảnh hưởng tiêu cực được tạo ra trong giai đoạn tân trang trước đó.\n\n"
 refurbishment_farming_offline: "$district_ark_basic$: Đang Tân Trang"
 refurbishment_farming_offline_desc: ""

 arkship.1310.name: "Khu Vực Phòng Ngự"
 arkship.1310.desc: "Cùng với việc boong tàu canh tác được tái thiết, việc sản xuất lương thực cũng được khôi phục lại trạng thái bình thường, sự chú ý đã được chuyển hướng sang khu vực phòng ngự ở tiền tuyến. Từ các khoang chứa vũ khí cho đến các hành lang bảo trì, mọi thứ đều đã được khảo sát xong xuôi, tất cả thảy đều cần phải được tiến hành bảo dưỡng.\n\nTrong giai đoạn này, công tác chuẩn bị tác chiến của hải quân sẽ bị hạn chế. Những thuyền viên chịu trách nhiệm đảm bảo cho sự an toàn của phi thuyền đã bị yêu cầu phải tạm thời rời đi, bởi vì khu vực làm việc của họ đang bị tháo dỡ và tiến hành lắp ráp lại.\n\nDựa theo phần lớn các lời truyền miệng, họ đã thể hiện ra sự nhẫn nại phi thường đối với vấn đề này."
 arkship.1310.desc.machine: "Công việc sửa chữa của bộ phận thứ hai đã hoàn tất. Sản lượng của bộ phận đang dần khôi phục lại trạng thái vận hành cơ bản. Phạm vi sửa chữa hiện đã được chuyển hướng sang cơ sở hạ tầng phòng ngự ở phía trước.\n\nCác khoang chứa vũ khí, mạng lưới bảo trì cùng với các cơ sở hạ tầng của bộ phận an ninh sẽ lần lượt bị ngắt kết nối. Trong giai đoạn này, các chỉ số đánh giá về công tác chuẩn bị tác chiến của hải quân sẽ bị sụt giảm.\n\nCông việc sửa chữa tiếp tục được tiến hành dựa theo các thông số đã được dự trù."
 arkship.1310.desc.hive: "Phòng chăn nuôi đã được cập nhật, cảm giác đói khát của bầy đàn thuộc địa đã được kéo dài ra một cách có chủ đích.\n\nHiện tại, sự chú ý của chúng ta đã chuyển sang lớp vỏ bảo vệ: các tổ đội vũ khí, tổ bảo trì cùng với doanh trại cấu thành nên lớp phòng ngự bên ngoài của phi thuyền. Tất cả những thứ này thảy đều phải bị tháo dỡ ra để tái thiết lại. Trạng thái chuẩn bị chiến đấu sẽ theo đó mà trở nên suy yếu.\n\nTập thể chấp nhận sự yếu đuối mang tính tạm thời này."
 arkship.1310.a: "$arkship.1305.a$"
 arkship.1310.a.machine: "$arkship.1305.a.machine$"
 arkship.1310.a.hive: "$arkship.1305.a.hive$"
 refurbishment_military_offline: "$district_ark_military$: Đang Tân Trang"
 refurbishment_military_offline_desc: ""

 arkship.1315.name: "Khu Sinh Hoạt"
 arkship.1315.desc: "Khu vực phòng ngự đã được kiểm tra xong xuôi, gia cố lại và đưa vào sử dụng trở lại. Những thuyền viên chịu trách nhiệm cho công việc này thoạt nhìn, nếu như bắt buộc phải nói, thì chính là đã thở phào nhẹ nhõm, vì rốt cuộc thì cũng lại có việc để làm rồi.\n\nHiện tại tiến vào giai đoạn cuối cùng: chính là bản thân khu vực thành thị. Khu vực nhà ở, tòa thị chính cùng với các hành lang thương mại cấu thành nên cốt lõi sự sống của Tàu Ark. Mọi thứ khác đều chỉ là cơ sở hạ tầng mà thôi. Đây mới chính là nơi mà các cư dân gọi là nhà.\n\nHàng rào thi công sẽ được dựng lên lần cuối cùng. Thắng lợi đã nằm ngay trong tầm mắt rồi."
 arkship.1315.desc.machine: "Công việc sửa chữa của phân đoạn phòng ngự đã được xác nhận là hoàn tất. Các chỉ số đánh giá về công tác chuẩn bị tác chiến của hải quân đang dần khôi phục lại mức cơ bản. Phạm vi hoạt động hiện tại đã chuyển sang cơ sở hạ tầng của khu nhà ở và thành thị.\n\nCác lối đi dùng để xử lý đơn vị sẽ lần lượt bị ngắt kết nối để tiến hành cuộc đại tu cuối cùng. Các khu vực bị ảnh hưởng sẽ cần phải tiến hành sơ tán dân số.\n\nCông việc sửa chữa tiến vào giai đoạn cuối cùng."
 arkship.1315.desc.hive: "Lớp vỏ bảo vệ đã trở nên cứng cáp, trạng thái chuẩn bị của tập thể cũng đã được khôi phục lại.\n\nQuá trình cập nhật hiện tại đang chuyển hướng sang những công việc cuối cùng của nó: phòng ươm giống, hầm làm tổ chung cùng với các lối đi kết nối, chúng cấu thành nên cốt lõi sự sống của phi thuyền. Những không gian này chính là nơi thuộc địa dùng để ngủ nghỉ, sinh sản và tụ tập. Khi mà chúng ta tái thiết lại từ bên trong, một số khu vực sẽ bị phong tỏa lại.\n\nChu kỳ cập nhật sắp sửa kết thúc rồi."
 arkship.1315.a: "Một lần nỗ lực cuối cùng."
 arkship.1315.a.machine: "Phân đoạn cuối cùng của giao thức tân trang."
 arkship.1315.a.hive: "Lần tân sinh cuối cùng đã bắt đầu rồi."
 refurbishment_city_offline: "$district_ark_city$: Đang Tân Trang"
 refurbishment_city_offline_desc: ""

 arkship.1320.name: "Tranh Chấp Về Việc Phân Bổ Phòng Ban"
 arkship.1320.desc: "Bởi vì tầng nhà ở đã bị phong tỏa để tiến hành công tác khảo sát cấu trúc, đội ngũ kỹ thuật đã bắt tay vào một nhiệm vụ vô cùng nhức nhối, đó chính là tái định cư cho hàng ngàn cư dân tại các khu vực khác của phi thuyền. Một quy trình vốn dĩ vô cùng trật tự ngay từ lúc bắt đầu, nay đã biến tướng thành những màn tranh giành xếp hàng, những vụ tranh chấp về quyền quản lý, cùng với đó là ít nhất một đơn khiếu nại chính thức về việc không thể tiếp cận được một khu vực đặc biệt được ưa chuộng của khoang thủy canh.\n\nĐiều phối viên xã hội của phi thuyền đang lên tiếng xin chỉ thị."
 arkship.1320.desc.machine: "Việc tái bố trí các đơn vị đến các khu vực tác chiến khả dụng đã vấp phải tình trạng nút thắt cổ chai trong việc xử lý. Các đơn vị đang phải đưa ra quyết định theo thời gian thực nhằm mục đích bù đắp, dẫn đến việc các mức độ ưu tiên xảy ra xung đột với nhau. Các chỉ số đánh giá về hiệu suất của các trạm tái bố trí đã bị sụt giảm.\n\nCần được chỉ dẫn."
 arkship.1320.desc.hive: "Sự di dời của các cá thể con đã làm xáo trộn tính gắn kết của bầy đàn. Bởi vì những cá thể con bị mất đi nơi ở đang phải tranh giành khu vực làm tổ cũng như sự phân công công việc tại các khu vực thứ cấp vốn dĩ đã cực kỳ chật chội, nên bản năng bảo vệ lãnh thổ đã bắt đầu bộc lộ. Dấu vết của Pheromone căng thẳng và bất an có thể được dò thấy ở khắp mọi nơi bên trong chỗ ở tạm thời.\n\nBầy đàn cần được chỉ dẫn."
 arkship.1320.a: "Những kỹ sư kia rồi sẽ nghĩ ra cách để giải quyết thôi."
 arkship.1320.b: "Thiết lập một cơ chế phân bổ mang tính công bằng."
 arkship.1320.a.tt: "\nĐi vòng qua các quy trình tiêu chuẩn. Chất lượng của công việc cuối cùng có khả năng sẽ bị ảnh hưởng."

 arkship.1325.name: "Thứ Nằm Sau Bức Tường"
 arkship.1325.desc: "Sau khi dỡ bỏ lớp vỏ bọc ống dẫn của khu vực máy phát điện, một vài thứ không hề được thể hiện trong bản vẽ gốc đã lộ diện: Một đoạn dầm chính cấu trúc dài ba mét đã xuất hiện tình trạng đứt gãy do mỏi vô cùng nghiêm trọng. Kết quả giám định vật liệu cho thấy, kiểu hư hỏng này đã tồn tại được mấy chục năm rồi, nhưng vẫn luôn không bị phát giác.\n\nViệc mở rộng phạm vi thi công để giải quyết vấn đề hỏng hóc sẽ đòi hỏi phải tốn thêm thời gian."
 arkship.1325.a: "Ghi chép lại, sau đó cứ tiến hành theo kế hoạch ban đầu."
 arkship.1325.b: "Mở rộng phạm vi tân trang. Xử lý ổn thỏa chỗ đứt gãy này."
 arkship.1325.b.tt: "Việc mở rộng phạm vi tân trang để xử lý ổn thỏa các vấn đề hỏng hóc về mặt cấu trúc sẽ cần tốn thêm thời gian, nhưng lại có thể tránh được việc những vấn đề lớn hơn sẽ xuất hiện trong tương lai."

 arkship.1330.name: "Trợ Cấp Chậm Trễ"
 arkship.1330.desc: "Những cư dân không bị ảnh hưởng bởi dự án thi công tân trang kéo dài đang lên tiếng phàn nàn vì việc phải san sẻ chỗ ở với những người phải di dời.\n\nHọ yêu cầu được gia tăng hạn ngạch phân bổ tài nguyên, được ưu tiên sử dụng các cơ sở giải trí, đồng thời yêu cầu gỡ bỏ ngay lập tức một hệ thống phát thanh tự động, hệ thống này cứ cách ba tiếng đồng hồ lại nhắc nhở họ rằng, sự bất tiện của họ là \"mang tính tạm thời và vô cùng được biết ơn\"."
 arkship.1330.desc.machine: "Bởi vì việc tái phân bổ dân số, dữ liệu về tính gắn kết của các đơn vị được phân bổ đến các khu vực thứ cấp vốn dĩ đã cực kỳ chật chội đang ở dưới ngưỡng có thể chấp nhận được. Mức sản lượng đã xuống thấp hơn so với ngưỡng tối ưu. Các mô hình dự đoán cho thấy, nếu như không tiến hành can thiệp, xu hướng này sẽ ngày một tồi tệ hơn.\n\nĐã đề xuất phân bổ bổ sung các tài nguyên có mục tiêu, nhằm khôi phục lại mức độ gắn kết cơ bản."
 arkship.1330.desc.hive: "Kể từ khi cuộc di cư bắt đầu, mức độ căng thẳng của Pheromone tại các khu vực làm tổ thứ cấp cực kỳ chật chội đã gia tăng một cách ổn định. Mối quan hệ căng thẳng về mặt lãnh thổ giữa các bầy đàn bị di dời và các bầy đàn thường trú đã trở nên tồi tệ hơn một cách rõ rệt. Cùng với việc sự náo động mang tính bản năng này lan rộng tại các khu vực bị ảnh hưởng, năng suất sản xuất tập thể của tổ ong đang trên đà sụt giảm.\n\nĐã đề xuất gia tăng thêm tài nguyên bổ sung nhằm làm giảm bớt tình trạng chật chội này."
 arkship.1330.a: "Việc này cũng chẳng tốn quá nhiều thời gian đâu. Chúng ta có khả năng kiểm soát được tình hình này."
 arkship.1330.b: "Tiến hành phân bổ các nguồn tài nguyên cần thiết."
 refurbishment_allowances_granted: "Tái Phân Bổ Tài Nguyên"
 refurbishment_allowances_granted_desc: "Tài nguyên đang được phân bổ đến những khu vực bị quá tải do dòng người cư dân mới đổ xô đến."
 refurbishment_low_morale: "Di Dời Gây Bất Mãn"
 refurbishment_low_morale_desc: "Môi trường chật chội cùng với sự hỗ trợ không đầy đủ dành cho những cư dân phải chịu cảnh tha hương đang gây ảnh hưởng đến sĩ khí và sự ổn định của toàn bộ phi thuyền."
 refurbishment_low_morale_2: "Di Dời Gây Bất Mãn Nghiêm Trọng"
 refurbishment_low_morale_2_desc: "Sự gián đoạn lặp đi lặp lại cùng với sự hỗ trợ không đầy đủ đã khiến cho sĩ khí và sự ổn định trên tàu trở nên tồi tệ hơn một cách nghiêm trọng."
 refurbishment_low_morale_3: "Bất Mãn Do Di Dời Đã Chạm Đỉnh"
 refurbishment_low_morale_3_desc: "Sĩ khí và sự ổn định đã tụt dốc không phanh. Những cư dân phải chịu cảnh tha hương sau khi trải qua tình trạng hỗn loạn lặp đi lặp lại, đã không thể nhìn thấy hy vọng được giải quyết, họ cảm thấy kiệt quệ cả về thể xác lẫn tinh thần, tiếng oán thán vang vọng khắp nơi."

 arkship.1335.name: "Sự Luân Phiên Lần Thứ Hai"
 arkship.1335.desc: "Nhằm đẩy nhanh tiến độ thi công, kỹ sư trưởng đã đề xuất áp dụng chế độ làm việc ba ca, thi công liên tục 24/24. Các khu dân cư nằm sát bên khu vực thi công báo cáo rằng, mức độ tiếng ồn đã khiến cho cư dân gặp khó khăn trong việc nghỉ ngơi suốt mười một ngày liên tiếp. Đã có ba công nhân thi công phải tiếp nhận điều trị vì những sự cố liên quan đến sự mệt mỏi.\n\nBản thân đội ngũ thi công cũng đã bắt đầu xuất hiện những dấu hiệu của sự mệt mỏi. Mặc dù tốc độ có lẽ đã nhanh hơn thật, nhưng những người phụ trách lại chẳng dám ôm quá nhiều niềm tin đối với chất lượng công việc do một đội ngũ thi công đang kiệt sức hoàn thành."
 arkship.1335.desc.machine: "Để duy trì tiến độ, một chu kỳ hoạt động liên tục đã được đề xuất cho tất cả các đơn vị thi công tại các công trường đang hoạt động. Dữ liệu về tiếng ồn và độ rung truyền về từ các khu dân cư lân cận cho thấy, sự nhiễu loạn liên tục này đã vượt quá ngưỡng có thể dung thứ. Đã ghi nhận được nhiều trường hợp thiết bị vận hành gặp phải sự cố hỏng hóc.\n\nCác chỉ số đánh giá về việc đảm bảo chất lượng đang sụt giảm theo tỷ lệ thuận với việc chu kỳ bị kéo dài. Hoạt động liên tục mặc dù nhanh hơn, nhưng tỷ lệ sai sót lại tăng lên một cách rõ rệt."
 arkship.1335.desc.hive: "Nhằm duy trì chu kỳ cập nhật, các máy bay không người lái tại các khu vực thi công đang hoạt động đã nhận được chỉ thị vận hành trong thời gian dài. Mức độ rung lắc và tiếng ồn tại các khu vực làm tổ lân cận đã liên tục vượt qua ngưỡng có thể dung thứ trong mười một chu kỳ. Một vài máy bay không người lái đã bắt đầu xuất hiện những dấu hiệu hỏng hóc do sự mệt mỏi.\n\nViệc làm việc liên tục quả thực đã giúp đẩy nhanh tốc độ thi công, nhưng sự giới hạn về mặt sinh học của quần thể đã gây ra những tổn thất có thể đo đạc được đối với chất lượng của công việc."
 arkship.1335.a: "Duy trì nhịp độ thi công hiện tại."
 arkship.1335.b: "Thiết lập một cơ chế sắp xếp ca trực luân phiên ở mức độ vừa phải."
 refurbishment_construction_fatigue: "Kiệt Sức Vì Xây Dựng"
 refurbishment_construction_fatigue_desc: "Các công nhân thi công đang dần phục hồi lại sau một khoảng thời gian làm việc liên tục. Trong lúc bảng phân công ca trực mới đang có hiệu lực, sản lượng của mọi ngành nghề đều sẽ bị sụt giảm."
 refurbishment_construction_fatigue_2: "Xây Dựng Kiệt Sức Nghiêm Trọng"
 refurbishment_construction_fatigue_2_desc: "Tình trạng làm việc quá sức trong một khoảng thời gian dài đã khiến cho các công nhân xây dựng rơi vào trạng thái mệt mỏi kinh niên. Sĩ khí và sản lượng đều bị sụt giảm một cách nghiêm trọng."
 refurbishment_construction_fatigue_3: "Kiệt Sức Vì Xây Dựng Đã Chạm Đỉnh"
 refurbishment_construction_fatigue_3_desc: "Đội ngũ thi công đang trong tình trạng hoạt động quá tải. Sĩ khí sụp đổ, sản lượng của mọi ngành nghề đều phải chịu sự ảnh hưởng vô cùng nghiêm trọng."

 arkship.1340.name: "Đường Ống Bị Lỗi"
 arkship.1340.desc: "Một đường ống dẫn năng lượng chính đã bị vỡ tung trong quá trình tháo dỡ lớp vỏ cũ. Toàn bộ khu vực, bao gồm cả tầng nhà ở, phòng y tế thứ cấp và hai đơn vị chế biến thực phẩm, hiện tại chỉ có thể dựa vào hệ thống chiếu sáng khẩn cấp để vận hành.\n\nCác [Owner.GetEngineerPlural] của chúng ta cho rằng, có khả năng sẽ khôi phục lại toàn bộ năng lượng điện trong vòng vài tháng. Hoặc là, có thể thông qua con đường vòng qua đường ống đó, để thu thập năng lượng điện từ các tổ máy phát điện lân cận. Phương pháp này nhanh hơn, nhưng nó lại đồng nghĩa với việc đưa vào lưới điện một sự sửa đổi mang tính khẩn cấp mang tính vĩnh viễn."
 arkship.1340.a: "Dùng đường dây nổi để bay vòng qua đó."
 arkship.1340.b: "Ưu tiên tiến hành khôi phục toàn diện."
 refurbishment_bypass_routing: "Bay Vòng Qua Đường Ống"
 refurbishment_bypass_routing_desc: "Một đường ống dẫn điện bị vỡ đã bị bỏ qua thay vì được mang đi sửa chữa. Phương pháp giải quyết tạm thời này khá là ổn định, nhưng lại mang đến sự kém hiệu quả mang tính liên tục cho lưới điện."

 arkship.1345.name: "Sự Lo Lắng Chính"
 arkship.1345.desc: "Kỹ sư trưởng phụ trách mảng cấu trúc của dự án đã chính thức đệ trình một sự lo lắng: Mặc dù tiến độ hiện tại là hoàn toàn có thể đạt được, nhưng thành quả công việc được tạo ra [Owner.Ruler.GetSheHe] đích thân họ sẽ không đưa ra chứng nhận là đạt chuẩn.\n\nCác điểm kết nối không mang tính then chốt đang bị niêm phong lại chứ không phải là được gia cố một cách thích hợp. Biên độ dung sai đang bị thiết lập ở mức \"có thể chấp nhận được\" chứ không phải là mức \"được khuyến nghị\"."
 arkship.1345.desc.machine: "Chương trình phụ giám sát việc đảm bảo chất lượng đã đánh dấu một vấn đề mang tính cấu trúc: Các thông số thi công hiện tại đang được vận hành ở bên trong ngưỡng dung sai tối thiểu, chứ không phải là các thông số kỹ thuật được khuyến nghị. Các nút kết nối không mang tính then chốt đang bị đóng hồ sơ, chứ không phải là được tối ưu hóa. Dự đoán về dư lượng cấu trúc dài hạn đang nằm dưới mức mục tiêu ưu tiên.\n\nĐã đăng ký mục ghi chép nhật ký chính thức. Không có dấu hiệu cho thấy rủi ro hỏng hóc tức thì."
 arkship.1345.desc.hive: "Tốc độ tân trang hiện tại khiến cho thành quả công việc chỉ đạt đến mức tiêu chuẩn khả thi tối thiểu, chứ không phải là các thông số kỹ thuật được khuyến nghị. Các nút kết nối chỉ bị phong kín lại một cách sơ sài, chứ không hề nhận được sự gia cố một cách thỏa đáng. Độ dẻo dai của cấu trúc dài hạn đã bị đem ra làm vật hy sinh để đổi lấy tốc độ ngắn hạn.\n\nHiện tại không có bất kỳ dấu hiệu nào cho thấy có tồn tại nguy cơ hỏng hóc tức thì. Những sự lo lắng liên quan đã được ghi chép lại trong hồ sơ."
 arkship.1345.a: "Lịch trình vẫn giữ nguyên không thay đổi. Chỉ cần nhìn qua thấy ổn, vậy là được rồi."
 arkship.1345.b: "Lưu ý cảnh báo. Điều chỉnh các thông số."
 refurbishment_power_restoration: "Khôi Phục Toàn Bộ Việc Cung Cấp Điện"
 refurbishment_power_restoration_desc: "Việc khôi phục toàn bộ việc cung cấp điện sẽ cần tốn thêm thời gian."

 arkship.1350.name: "Phân Đoạn Đầu Tiên Đã Hoàn Thành"
 arkship.1350.desc: "Phân đoạn đầu tiên hoàn thành việc đại tu đã được tuyên bố là đạt tiêu chuẩn về mặt cấu trúc, và đã được phê chuẩn đưa vào sử dụng trở lại. Công việc này quả thực khiến người ta phải vô cùng ấn tượng: bộ khung hoàn toàn mới, hệ thống đường ống được hiện đại hóa, cùng với vật liệu cách nhiệt tuyệt đối sẽ không bị vỡ vụn chỉ với một cái chạm nhẹ.\n\nĐội ngũ kỹ thuật đang vô cùng khao khát được tiếp tục thúc đẩy. Các cư dân cũng đang nóng lòng muốn dọn về ở trở lại. Thế nhưng, toàn bộ các bài kiểm tra hệ thống vẫn chưa được hoàn tất. Cần phải đưa ra một quyết định."
 arkship.1350.desc.machine: "Một đợt tân trang cấu trúc mang tính trọng đại đã được hoàn tất. Giấy chứng nhận sơ bộ cho thấy phân đoạn này đã đáp ứng được các tiêu chuẩn tối thiểu để tái sử dụng. Các quy chuẩn thử nghiệm chẩn đoán toàn diện vẫn chưa được hoàn tất. Khả năng xảy ra sự cố hỏng hóc lớn sau khi dọn vào ở là rất thấp, nhưng không phải là hoàn toàn có thể phớt lờ.\n\nBất luận là có hoàn tất quá trình chẩn đoán hay không, đều cần phải có được sự ủy quyền thì mới có thể tiếp tục."
 arkship.1350.desc.hive: "Phân đoạn đầu tiên hoàn thành việc cập nhật cấu trúc đã thông qua khâu kiểm tra sơ bộ. Nó đã đạt đến ngưỡng tối thiểu để có thể tái sử dụng. Chu kỳ xác minh sinh học hoàn chỉnh đối với hệ thống tái thiết của nó vẫn chưa được hoàn tất. Xác suất xảy ra hỏng hóc sau khi tái sử dụng là rất thấp, nhưng không phải là hoàn toàn có thể phớt lờ.\n\nNhững cỗ máy bay không người lái được sơ tán từ khu vực này đang không ngừng gây áp lực tại khu vực rào chắn."
 arkship.1350.a: "Những bài kiểm tra này hoàn toàn không cần thiết."
 arkship.1350.b: "Hoàn tất toàn bộ chuỗi quy trình kiểm tra."
 refurbishment_extended_displacement: "Kéo Dài Thời Gian Sơ Tán"
 refurbishment_extended_displacement_desc: "Các phân đoạn đã hoàn công sẽ tiếp tục duy trì trạng thái đóng cửa cho đến khi có được giấy chứng nhận hệ thống toàn diện."

 arkship.1355.name: "Danh Sách Sửa Chữa"
 arkship.1355.desc: "Người phụ trách dự án đã tổng hợp ra một bản danh sách sửa chữa cuối cùng: trước khi chính thức ký nhận cấu trúc, vẫn còn bốn mươi bảy hạng mục chưa được hoàn thành. Phạm vi của các hạng mục trên danh sách vô cùng rộng lớn, từ những việc mang tính trọng yếu, ví dụ như ba nâng cấp kết nối chịu lực tại khu vực phía sau, cho đến những việc mang tính thẩm mỹ, bao gồm mười chín tấm ốp bị lệch và một tấm lưới thông gió bị lắp ngược.\n\nViệc hoàn thành mỗi một hạng mục trên danh sách đều sẽ cần tốn thêm thời gian. Thế nhưng danh sách này sở dĩ tồn tại, chính là bởi vì những việc này rất quan trọng."
 arkship.1355.desc.machine: "Giao thức đảm bảo chất lượng đã tạo ra một danh sách khắc phục, bên trong đó có chứa bốn mươi bảy hạng mục đang chờ được cấp chứng nhận chính thức. Những hạng mục này liên quan đến từ tầm quan trọng của cấu trúc (chẳng hạn như việc gia cố các điểm tiếp nối) cho đến tính thẩm mỹ của việc căn chỉnh các tấm ốp vỏ bọc ngoài.\n\nViệc hoàn thành một cách toàn diện sẽ đòi hỏi phải kéo dài thời gian vận hành. Việc chỉ bao gồm các hạng mục cấu trúc, hình thành nên một bản chứng nhận theo từng khoản mục chưa được tối ưu hóa cũng là một phương án có thể lựa chọn."
 arkship.1355.desc.hive: "Ong thợ sửa chữa đã tổng hợp ra một bản danh sách cuối cùng: Tại những khu vực vừa mới được hoàn thiện gần đây, có bốn mươi bảy chỗ sửa chữa tế bào vẫn chưa được hoàn chỉnh. Những công việc sửa chữa này trải dài từ việc gia cố cấu trúc mang tính then chốt tại các điểm tiếp nối chịu lực, cho đến việc phục hồi lớp lót tế bào bề mặt và các khoang thẩm mỹ, không gì là không có.\n\nViệc hoàn thành một cách toàn diện sẽ làm kéo dài chu kỳ cập nhật. Chúng ta cũng có thể cân nhắc việc chỉ lấy được chứng nhận cho một phần, chỉ liên quan đến phần sửa chữa cấu trúc."
 arkship.1355.a: "Chỉ xử lý những hạng mục mang tính cấu trúc."
 arkship.1355.b: "Hoàn thành các nhiệm vụ của toàn bộ danh sách sửa chữa."

 arkship.1360.name: "Trở Về Quê Hương"
 arkship.1360.desc: "Những cư dân phải rời bỏ quê hương thuộc khu vực tân trang mới nhất đã nhận được thông báo về ngày dọn về của mình. Những hành lang bị phong tỏa suốt mấy tháng trời lại một lần nữa mở rộng cánh cửa, tản ra mùi hương của những vật liệu composite tươi mới và lớp vật liệu cách nhiệt mới toanh. Những đứa trẻ sơ sinh đã phải ở trong nơi ở tạm bợ suốt mấy tháng trời lần đầu tiên được nhìn thấy ngôi nhà của mình.\n\nBầu không khí trên tàu là mức tuyệt vời nhất kể từ khi bắt đầu việc tân trang. Ban lãnh đạo ý thức được rằng thiện ý này sẽ chẳng thể kéo dài được bao lâu. Vấn đề là phải làm thế nào để tận dụng nó."
 arkship.1360.desc.machine_ind: "Những hành lang bị phong tỏa đã lại một lần nữa mở rộng cánh cửa. Giàn giáo tại các boong tàu phía dưới đang dần được gỡ bỏ. Đối với phần lớn mọi người mà nói, đây là việc về nhà. Nhưng đối với một số người mà nói, đây lại là một trải nghiệm hoàn toàn khác biệt.\n\nNhững đơn vị mới được khởi động trong quá trình di cư đang dần tiến vào những hành lang mà trước đây chỉ tồn tại trong các bản vẽ dữ liệu của bọn họ, nhưng lại chưa bao giờ xuất hiện trong nhật ký cảm quan của bọn họ.\n\nKể từ khi bắt đầu việc tân trang cho đến nay, sự nhiệt tình đã đạt đến đỉnh điểm. Ban lãnh đạo biết rõ rằng điều này sẽ không thể kéo dài được bao lâu. Vấn đề là phải làm thế nào để tận dụng nó."
 arkship.1360.desc.machine: "Các đơn vị được phân bổ đến các khu vực làm việc tạm thời trong thời gian sửa chữa đang dần quay trở về khu vực xử lý chính của bọn họ. Các thông số vận hành cơ bản của các khu vực bị ảnh hưởng đang dần được khôi phục. Các chỉ số hiệu suất đang có xu hướng gia tăng.\n\nTrong phạm vi toàn bộ phi thuyền đã ghi nhận được sự nâng cao đáng kể về mức độ gắn kết. Sự nâng cao kiểu này chỉ mang tính tạm thời. Phân tích chỉ ra rằng có hai phương pháp khả thi: chuyển hướng sự nâng cao này để đẩy nhanh tiến độ của công việc sửa chữa còn lại, hoặc là cho phép nó tự nhiên ổn định lại và khiến cho mức độ gắn kết ổn định ở một mức cơ bản cao hơn."
 arkship.1360.desc.hive: "Những ong thợ bị mất đi nơi ở đang đổ dồn trở về các khu vực đã được sửa chữa của bọn chúng. Những hành lang từng tỏa ra mùi hôi của vật liệu xây dựng suốt mấy chu kỳ, giờ đây đã ngập tràn những dấu vết khứu giác quen thuộc. Sự kết hợp hóa học có xu hướng ổn định. Sự căng thẳng về mặt lãnh thổ đã được xua tan.\n\nSự cộng hưởng của tập thể đang dâng trào. Tổ ong đang khôi phục lại trạng thái ban đầu, và năng lượng của sự hồi quy này là vô cùng chân thực. Nó có thể được định hướng ra bên ngoài, tiến vào các khu vực kiến trúc còn lại. Hoặc là, cũng có thể để cho nó từ từ lắng xuống, cho bầy đàn thời gian để hoàn toàn tìm lại được chính mình trước khi công việc lại một lần nữa được tiếp tục."
 arkship.1360.a: "Chuyển trọng tâm quay trở lại công việc."
 arkship.1360.b: "Hãy để cho họ tận hưởng khoảnh khắc này đi."

 arkship.1365.name: "Sự Chờ Đợi Dài Đằng Đẵng"
 arkship.1365.desc: "Dự án tân trang khu dân cư đã tiến vào giai đoạn cuối cùng, nhưng ý nghĩa của từ \"cuối cùng\" này đã khác xa so với trước đây. Thời gian mà những cư dân chuyển ra khỏi khu vực thành thị phải sinh sống tại nơi ở tạm bợ đã vượt qua mức dự tính ban đầu.\n\nHiện tại có những yêu cầu về việc cung cấp thêm các nguồn tài nguyên bổ sung: đồ nội thất tạm thời tốt hơn, ưu tiên sử dụng các cơ sở giải trí, cùng với một lượng nhỏ tài nguyên phân bổ bổ sung. Điều này không thể giải quyết được bất kỳ vấn đề nào mang tính cấu trúc. Nhưng nó có thể sẽ khiến cho việc chờ đợi trở nên dễ dàng chịu đựng hơn."
 arkship.1365.desc.machine: "Dữ liệu về tính gắn kết của những nhân sự bị cưỡng chế dời khỏi khu dân cư đang ở dưới ngưỡng có thể chấp nhận được. Giai đoạn cải tạo cuối cùng đã vượt quá thời gian kéo dài theo như dự đoán của nó. Các mô hình dự đoán cho thấy, nếu như không có sự can thiệp tài nguyên có mục tiêu, tình trạng này sẽ tiếp tục trở nên tồi tệ hơn.\n\nĐơn xin cấp phát vốn bổ sung đã được đệ trình để tiến hành xem xét."
 arkship.1365.desc.hive: "Các chỉ số đánh giá về mức độ căng thẳng của Pheromone tại khu dân cư cuối cùng đã vượt qua ngưỡng có thể chấp nhận được. Giai đoạn tân trang vừa qua đã vượt quá chu kỳ được dự tính của nó. Việc rời khỏi mô hình đã được thiết lập sẵn trong một thời gian dài sẽ làm xáo trộn tính chất hóa học kết hợp và làm tổn hại đến tính gắn kết của tập thể, vả lại cùng với sự trôi qua của thời gian, tình trạng này sẽ trở nên ngày một tồi tệ hơn.\n\nĐã thỉnh cầu tiến hành phân bổ thêm tài nguyên bổ sung nhằm làm giảm bớt tình trạng chật chội."
 arkship.1365.a: "Trước khi công việc được hoàn thành chúng ta hoàn toàn có thể tiếp tục nhẫn nhịn."
 arkship.1365.b: "Phê duyệt việc cấp phát khoản vốn bổ sung."
 refurbishment_administrative_burden: "Gánh Nặng Hành Chính"
 refurbishment_administrative_burden_desc: "Việc quản lý dự án phúc lợi dành cho những cư dân phải rời xa nơi ở cũ trong một khoảng thời gian dài đã mang lại áp lực khổng lồ cho các nhân viên chuyên môn. Việc thu mua hậu cần, xử lý các khiếu nại cũng như quản lý khâu phân phối đang làm phân tán đi sự chú ý của các nhân viên kỹ thuật, khiến cho họ không thể tập trung vào những trọng trách chính của mình."

 arkship.1370.name: "Sự Sửa Đổi Trái Phép"
 arkship.1370.desc: "Khi tháo dỡ các bức tường không chịu lực ở khu vực trung tâm của khu nhà ở, những công nhân trang trí đã phát hiện ra một số tình huống vô cùng bất thường: Trong suốt hàng thập kỷ qua, đã có những thay đổi chưa từng được cấp phép. Những căn phòng bị che giấu, những hốc tường được tự ý dựng lên, hay là những hành lang đã bị bịt kín được cải tạo thành phòng chứa đồ hoặc không gian sinh sống. Những thứ này đều không hề nằm trong bản vẽ thiết kế ban đầu, vả lại một số trong đó còn là các cấu trúc chịu lực.\n\nKỹ sư trưởng đang đệ trình yêu cầu để đưa ra quyết định. Việc tháo dỡ toàn bộ những phần không nằm trong bản quy hoạch ban đầu là một cách làm vô cùng đúng đắn. Việc này sẽ cần phải tốn chút thời gian. Việc đi vòng qua những khu vực bị sửa đổi này sẽ nhanh hơn rất nhiều, nhưng lại đưa vào những điểm bất thường về mặt cấu trúc, điều này sẽ rất khó để có thể giải thích với những kỹ sư trong tương lai."
 arkship.1370.desc.machine: "Trong quá trình tháo dỡ các bộ phận không mang tính cấu trúc của khu dân cư, chúng ta đã phát hiện ra một lượng lớn các công trình cải tạo kiến trúc chưa được cấp phép. Tại rất nhiều khu vực đã phát hiện ra các vách ngăn chưa được ghi chép trong hồ sơ, sự thay đổi đường đi cùng với các thiết bị chịu lực tạm thời. Những điều này đều không hề được ghi lại trong bản thông số thiết kế ban đầu.\n\nViệc tháo dỡ hoàn toàn là điều vô cùng đúng đắn về mặt cấu trúc, nhưng lại rất tốn thời gian. Việc ghi chép lại tài liệu cùng với những tuyến đường thay thế có thể được dùng làm phương án dự phòng."
 arkship.1370.desc.hive: "Sau khi tháo dỡ các bức tường bên trong khu dân cư ở tầng giữa, chúng ta đã phát hiện ra hàng loạt những đợt cải tạo thuộc địa chưa được cấp phép từ nhiều thế hệ trước. Những hang động ẩn giấu, những lối đi do tự mình đào bới, những không gian bị niêm phong được cải tạo thành tổ ong, tất cả những thứ này hoàn toàn không nằm trong kết cấu chính thức của phi thuyền. Một số trong đó còn là các cấu trúc chịu lực. Việc dỡ bỏ một cách chính xác là một cách làm vô cùng đúng đắn, nhưng lại rất tốn thời gian. Việc đi vòng qua chúng thì sẽ nhanh hơn rất nhiều, nhưng lại đưa vào những điểm bất thường về mặt cấu trúc, điều này sẽ mang lại vô vàn phiền toái cho những người quản lý tổ ong trong tương lai."
 arkship.1370.a: "Những gì có thể ghi chép lại thì cứ ghi chép lại. Những thứ còn lại thì nghĩ cách để giải quyết thôi."
 arkship.1370.b: "Gỡ bỏ toàn bộ những nội dung không phù hợp với quy hoạch ban đầu."
 arkship.1370.c: "Lúc đó rốt cuộc là chúng ta đang nghĩ cái quái gì vậy chứ?"
 refurbishment_rework_zone: "Khu Vực Thi Công Đang Hoạt Động"
 refurbishment_rework_zone_desc: "Các công việc thi công đang hoạt động tại những khu vực này đã cản trở đến việc khai thác các khu vực mới, tình trạng này sẽ kéo dài cho đến khi quá trình sửa chữa được hoàn tất."

 arkship.1375.name: "Tầng Boong Cuối Cùng"
 arkship.1375.desc: "Tầng boong cuối cùng đã thông qua khâu kiểm tra sơ bộ. Giàn giáo của phần bên dưới đã bắt đầu được dỡ bỏ. Đứng từ phần lớn các khía cạnh mà nói, công việc tân trang đã được hoàn thành.\n\nNgười quản lý của công trình yêu cầu tiến hành một đợt kiểm tra thứ hai mang tính toàn diện, sau đó [Owner.Ruler.GetSheHe] sẽ tự tay ký tên xác nhận chứng nhận kết cấu. Bọn họ cũng phải thừa nhận rằng, điều này trên một mức độ rất lớn chỉ là một hình thức mang tính thủ tục mà thôi. Tầng boong đó gần như có thể khẳng định là không có bất cứ vấn đề gì.\n\nThế nhưng, từ \"gần như\" này thường hay mang đến những hậu quả khó lường."
 arkship.1375.desc.machine: "Khu vực dân cư cuối cùng đã thông qua các giao thức kiểm tra sơ bộ. Công việc tháo dỡ giàn giáo ở khu vực tầng thấp đã bắt đầu được tiến hành. Chứng nhận kết cấu hiện đang chờ quy trình chẩn đoán thứ hai mang tính hoàn chỉnh.\n\nLần kiểm tra thứ hai gần như có thể khẳng định là sẽ không có bất cứ vấn đề gì, nhưng việc nhận được chứng nhận hoàn chỉnh chính là điều kiện tiên quyết mang tính chính thức để công trình được hoàn thành một cách toàn diện."
 arkship.1375.desc.hive: "Boong tàu hình tổ ong cuối cùng đã thông qua khâu kiểm tra sơ bộ. Những con ong thợ đang tiến hành tháo dỡ giàn giáo ở các tầng bên dưới. Đứng từ toàn bộ những dấu hiệu có thể quan sát được mà nói, đợt tân trang này đã được hoàn thành. Trước khi đưa ra chứng nhận cuối cùng, vẫn cần phải tiến hành một chu kỳ xác minh thứ hai mang tính toàn diện.\n\nChúng ta gần như có thể khẳng định - nhưng không phải là khẳng định hoàn toàn - rằng kết quả của lần xác minh thứ hai và lần kiểm tra sơ bộ sẽ nhất quán với nhau."
 arkship.1375.a: "Gần như đã hoàn công cũng có nghĩa là đã hoàn công rồi."
 arkship.1375.b: "Hoàn tất toàn bộ quy trình của công việc kiểm tra."
 refurbishment_inspection_hold: "Việc Kiểm Tra Khiến Cho Công Trình Thi Công Bị Tạm Hoãn"
 refurbishment_inspection_hold_desc: "Trước khi chứng nhận kết cấu cuối cùng được hoàn tất, mọi công việc lắp đặt và thi công đều đã bị tạm dừng."

 arkship.1380.name: "Đại Tu Cấu Trúc Đã Hoàn Thành"
 arkship.1380.desc.full: "Khu vực cuối cùng của Tàu Ark §Y[Target.GetName]§! đã hoàn tất việc dọn dẹp, được chứng nhận, đồng thời đã được giao trả lại cho các cư dân. Mặc dù ban đầu xuất phát từ sự cần thiết, chúng ta đã tiến hành những công trình mang tính phá hoại đối với một số khu vực, nhưng suy cho cùng, công trình của chúng ta đã đúc kết nên một thành tựu vĩ đại. Phi thuyền hiện tại mang đến cho người ta một cảm giác hoàn toàn tươi mới: không chỉ có cấu trúc kiên cố, mà ở một mức độ nào đó, nó còn giống với hình dáng mà một con tàu vốn dĩ nên có hơn bao giờ hết.\n\nBinh đoàn công binh đã đệ trình bản báo cáo cuối cùng, đồng thời kèm theo một vài kiến nghị vô cùng mạnh mẽ. Việc sử dụng thành quả của công trình này ra sao, sẽ do ban lãnh đạo quyết định."
 arkship.1380.desc.partial: "Cuộc đại tu của Tàu Ark §Y[Target.GetName]§! đã được tuyên bố là hoàn thành. Đánh giá về tính toàn vẹn của kết cấu đã khẳng định rằng, so với tiêu chuẩn, hiệu suất đã được cải thiện một cách rõ rệt, mặc dù những người quen thuộc với bản đề xuất ban đầu sẽ nhận thấy rằng không phải toàn bộ các thông số kỹ thuật về nhu cầu đều đã đạt được, cũng không phải toàn bộ các dung sai đều đã được tối ưu hóa.\n\nDự án đã gặt hái được những thành quả nhất định. Nhưng đáng lẽ ra nó còn có thể làm được tốt hơn thế nữa."
 arkship.1380.desc.rushed: "Cuộc đại tu của Tàu Ark §Y[Target.GetName]§! đã được hoàn thành. Các văn kiện đều đã được ký tên, giàn giáo đã được tháo dỡ, các thành viên của tổ thi công cũng đã rời đi.\n\nỦy ban thẩm tra cấu trúc đã dùng một vài lời lẽ mang tính ngoại giao để chỉ ra rằng, sản phẩm cuối cùng đều đã đạt đến các tiêu chuẩn chứng nhận tối thiểu trong toàn bộ các hạng mục đánh giá. Con tàu này đã trở nên tốt hơn so với trước đây. Còn về việc liệu nó đã đạt được trạng thái tối ưu hay chưa, binh đoàn công binh đã lựa chọn việc không công khai đặt ra nghi vấn."
 arkship.1380.desc.full.machine: "Công việc sửa chữa của §Y[Target.GetName]§! đã được hoàn thành. Toàn bộ các khu vực đều đã thông qua khâu chứng nhận và khôi phục lại trạng thái vận hành toàn diện. Đánh giá về tính toàn vẹn của kết cấu đã khẳng định rằng, trong tất cả các hạng mục đo lường, sản lượng đều đã vượt qua mức cơ bản trước khi sửa chữa.\n\nBản báo cáo cuối cùng đã được ghi chép vào trong hồ sơ. Các đề xuất về việc tối ưu hóa có thể được đưa vào thực thi."
 arkship.1380.desc.partial.machine: "Việc sửa chữa của §Y[Target.GetName]§! đã được xác nhận là hoàn tất. Đánh giá về tính toàn vẹn của kết cấu đã khẳng định rằng, tình trạng sau khi sửa chữa đã được cải thiện phần nào so với mức cơ bản trước khi sửa chữa. Tuy nhiên, có một vài thông số lại được xác định ở ngưỡng tối thiểu chứ không phải là quy chuẩn được đề xuất.\n\nKết quả nằm trong phạm vi có thể chấp nhận được."
 arkship.1380.desc.rushed.machine: "Việc sửa chữa của §Y[Target.GetName]§! đã được ghi chép là hoàn thành ở khâu cuối cùng. Chương trình phụ thẩm tra kết cấu đã cấp chứng nhận cho kết quả này phù hợp với tiêu chuẩn tối thiểu của toàn bộ các hạng mục đánh giá.\n\nSự cải thiện về mặt vận hành so với mức cơ bản đã được xác nhận. Tiềm năng tối ưu hóa vẫn chưa được hiện thực hóa một cách toàn diện."
 arkship.1380.desc.full.hive: "Công việc tân trang của §Y[Target.GetName]§! đã được hoàn thành. Mỗi một bộ phận đều đã trải qua quá trình xác minh, tái thiết, đồng thời đã được giao trả lại cho thuộc địa. Tập thể đang cộng hưởng bằng một sự gắn kết hoàn toàn mới mẻ, cái trọng lượng quen thuộc đó giống như một vật chứa một lần nữa lại trở nên trọn vẹn, từ những nút năng lượng ở nơi sâu thẳm nhất cho đến phòng làm tổ ở nơi cao nhất, kết cấu của mọi thứ đều vô cùng hoàn hảo.\n\nChúng ta đã trở nên trọn vẹn. Thuộc địa sẽ lựa chọn việc hướng sức mạnh tân sinh của nó đi về đâu đây."
 arkship.1380.desc.partial.hive: "Việc xây dựng tiếp theo của §Y[Target.GetName]§! đã được tuyên bố là hoàn thành. Đánh giá về cấu trúc đã khẳng định rằng, so sánh với trạng thái trước đây của con tàu này, nó quả thực đã nhận được sự cải thiện. Chúng ta nhận thức được một cách vô cùng bất an rằng, không phải mọi quy chuẩn đều đã được đáp ứng, cũng không phải mọi dư lượng cấu trúc đều đã được tối ưu hóa một cách trọn vẹn.\n\nThuộc địa đã trở nên hùng mạnh hơn. Mặc dù đáng lẽ ra nó còn có thể trở nên hùng mạnh hơn thế nữa."
 arkship.1380.desc.rushed.hive: "Công việc tân trang của §Y[Target.GetName]§! đã hoàn thành. Giàn giáo đã được tháo dỡ, các khu vực đã được mở cửa, những ong thợ bị thuyên chuyển cũng đã quay trở về vị trí được chỉ định của mình. Chúng ta nhận thức được một cách vô cùng bất an rằng, chúng ta chỉ đạt được tiêu chuẩn chứng nhận tối thiểu trong tất cả các hạng mục đánh giá.\n\nViệc tân trang đã đạt được mục đích của nó. Còn về việc liệu nó đã phát huy được tiềm năng của mình hay chưa, chúng ta lựa chọn việc không đi sâu vào tìm hiểu thêm nữa."
 arkship.1380.a: "Giao phó cho dự án cải tiến lưới điện."
 arkship.1380.b: "Dùng các nguồn tài nguyên trực tiếp cho hệ thống canh tác."
 arkship.1380.c: "Đầu tư vào việc đại tu hệ thống phòng ngự."
 arkship.1380.d: "Chú trọng vào việc mở rộng khu dân cư."

 refurbishment_ongoing_gestalt: "Tân Trang Toàn Diện: Đang Tiến Hành"
 refurbishment_ongoing_gestalt_desc: "Chiếc Tàu Ark này đang tiến hành đợt tân trang toàn diện về mặt cấu trúc. Các hoạt động thi công tại nhiều khu vực đang dẫn đến việc tính ổn định trong phạm vi của phi thuyền, năng suất sản xuất của các cá thể con cùng với năng lực xây dựng của các khu vực bị gián đoạn một cách toàn diện."

 refurbishment_city_offline_gestalt: "$district_ark_city$: Đang Tân Trang"
 refurbishment_city_offline_gestalt_desc: "Khu vực cư trú chính của Tàu Ark đã bị phong tỏa do công trình kết cấu. Tất cả chúng ta đều đang phải chen chúc trong các khu vực còn sót lại, nhà ở và năng suất sản xuất của công nhân đều đang phải gánh chịu một áp lực vô cùng khổng lồ."

 refurbishment_low_morale_gestalt: "Di Dời Gây Bất Mãn"
 refurbishment_low_morale_gestalt_desc: "Môi trường chật chội và sự chi viện không đầy đủ đang gây ra những tổn hại đối với sự ổn định cũng như tính gắn kết của toàn bộ phi thuyền."

 refurbishment_construction_fatigue_gestalt: "Kiệt Sức Vì Xây Dựng"
 refurbishment_construction_fatigue_gestalt_desc: "Chúng ta đang trong quá trình hồi phục từ khoảng thời gian hoạt động liên tục. Trong lúc chu kỳ hoạt động mới đang được thiết lập, sản lượng sẽ có phần sụt giảm."

 refurbishment_administrative_burden_gestalt: "Gánh Nặng Hành Chính"
 refurbishment_administrative_burden_gestalt_desc: "Việc quản lý các dự án phúc lợi đã đưa ra những đòi hỏi vô cùng cao đối với tư duy phức hợp ở trung ương."

 refurbishment_power_grid: "Tối Ưu Hóa Lưới Điện"
 refurbishment_power_grid_desc: "Công tác đại tu ở khu vực máy phát điện đã đạt đến những tiêu chuẩn tối cao nhất. Cơ sở hạ tầng sau khi được tân trang đã giúp nâng cao một cách đáng kể sản lượng năng lượng điện của toàn bộ phi thuyền."

 refurbishment_power_grid_partial: "Cải Tiến Lưới Điện"
 refurbishment_power_grid_partial_desc: "Việc cải tạo khu vực phát điện đã giúp nâng cao sản lượng năng lượng điện một cách đáng kể, mặc dù không phải tất cả các chỉ số đánh giá đều hoàn toàn đạt yêu cầu."

 refurbishment_power_grid_weak: "Sửa Chữa Lưới Điện"
 refurbishment_power_grid_weak_desc: "Khu vực phát điện sau đợt tân trang đã thông qua khâu nghiệm thu và đưa vào vận hành. Một số hạng mục nâng cấp cải tạo nằm trong kế hoạch vẫn chưa được hoàn thành, nhưng sản lượng năng lượng điện đã có sự gia tăng đôi chút so với mức cơ bản."

 refurbishment_cultivation_decks: "Cải Tạo Boong Tàu Canh Tác"
 refurbishment_cultivation_decks_desc: "Công tác cải tạo triệt để ở khu vực nông nghiệp đã được hoàn thành dựa theo những quy chuẩn cao nhất."

 refurbishment_cultivation_decks_partial: "Cải Tiến Boong Tàu Canh Tác"
 refurbishment_cultivation_decks_partial_desc: "Cuộc cách mạng nông nghiệp đã cải thiện một cách rõ rệt việc sản xuất lương thực, mặc dù có vài hạng mục nâng cấp nằm trong kế hoạch đã bị trì hoãn hoặc tinh giản."

 refurbishment_cultivation_decks_weak: "Sửa Chữa Boong Tàu Canh Tác"
 refurbishment_cultivation_decks_weak_desc: "Khu vực này sau khi được tân trang đã nhận được sự nghiệm thu. Sản lượng đã được cải thiện đôi chút, nhưng rất nhiều hạng mục nâng cấp nằm trong kế hoạch vẫn chưa được đưa vào thực thi một cách toàn diện."

 refurbishment_defense_systems: "Củng Cố Hệ Thống Phòng Ngự"
 refurbishment_defense_systems_desc: "Công tác đại tu của phân đoạn này đã được hoàn thành dựa theo các tiêu chuẩn cao nhất. Chiếc Tàu Ark này đã trở nên kiên cường hơn trong các trận chiến."

 refurbishment_defense_systems_partial: "Cải Tiến Hệ Thống Phòng Ngự"
 refurbishment_defense_systems_partial_desc: "Việc tân trang hệ thống phòng ngự đã nâng cao đáng kể năng lực tác chiến của Tàu Ark. Mặc dù một số dư lượng cấu trúc đã bị thiết lập ở mức độ dung sai có thể chấp nhận được chứ không phải là mức độ được khuyến nghị."

 refurbishment_defense_systems_weak: "Sửa Chữa Hệ Thống Phòng Ngự"
 refurbishment_defense_systems_weak_desc: "Trải qua quá trình tân trang, phân đoạn phòng ngự đã thông qua khâu kiểm chứng. Tuy nhiên, một vài hạng mục nâng cấp gia cố nằm trong kế hoạch vẫn chưa được hoàn thành."

 refurbishment_power_grid_gestalt: "Tối Ưu Hóa Lưới Điện"
 refurbishment_power_grid_gestalt_desc: "Công tác đại tu ở khu vực phát điện đã được hoàn thành dựa theo các tiêu chuẩn cao nhất. Cơ sở hạ tầng sau khi được tân trang đã nâng cao đáng kể sản lượng năng lượng điện cũng như hiệu suất vận hành của toàn bộ tập thể."

 refurbishment_power_grid_partial_gestalt: "Cải Tiến Lưới Điện"
 refurbishment_power_grid_partial_gestalt_desc: "Việc tân trang khu vực phát điện đã nâng cao đáng kể sản lượng năng lượng điện và hiệu suất vận hành, mặc dù một số hạng mục nâng cấp đường ống chỉ đạt đến mức dung sai có thể chấp nhận được chứ không phải là mức tốt nhất."

 refurbishment_power_grid_weak_gestalt: "Sửa Chữa Lưới Điện"
 refurbishment_power_grid_weak_gestalt_desc: "Khu vực phát điện sau đợt tân trang đã nhận được sự nghiệm thu đưa vào vận hành chính thức. Tuy nhiên, một số hạng mục nâng cấp cải tạo nằm trong kế hoạch vẫn chưa được hoàn thành."

 refurbishment_cultivation_decks_gestalt: "Cải Tạo Boong Tàu Canh Tác"
 refurbishment_cultivation_decks_gestalt_desc: "Công tác cải tạo khu vực nông nghiệp đã được hoàn thành dựa theo các tiêu chuẩn cao nhất. Sản lượng và chất lượng trên phi thuyền đều đã được nâng cao một cách đáng kể."

 refurbishment_cultivation_decks_partial_gestalt: "Cải Tiến Boong Tàu Canh Tác"
 refurbishment_cultivation_decks_partial_gestalt_desc: "Chúng ta đã tiến hành những cải tiến mang tính rõ rệt đối với môi trường sản xuất, mặc dù có một vài hạng mục nâng cấp nằm trong kế hoạch đã bị trì hoãn hoặc tinh giản."

 refurbishment_cultivation_decks_weak_gestalt: "Sửa Chữa Boong Tàu Canh Tác"
 refurbishment_cultivation_decks_weak_gestalt_desc: "Khu vực này sau khi được tân trang đã nhận được sự nghiệm thu. Năng suất sản xuất đã có phần cải thiện đôi chút, mặc dù rất nhiều hạng mục nâng cấp nằm trong kế hoạch vẫn chưa được đưa vào thực thi một cách toàn diện."

 refurbishment_residential_expansion_gestalt: "Mở Rộng Khu Dân Cư"
 refurbishment_residential_expansion_gestalt_desc: "Công tác đại tu khu vực cư trú đã được hoàn thành dựa theo các tiêu chuẩn cao nhất. Các hệ thống hỗ trợ được hiện đại hóa đã cải thiện được điều kiện ở mọi nơi trên tàu."

 refurbishment_residential_expansion_partial_gestalt: "Mở Rộng Một Phần Khu Dân Cư"
 refurbishment_residential_expansion_partial_gestalt_desc: "Việc tân trang nhà ở đã cải thiện đáng kể tính gắn kết của tập thể, mặc dù quy mô mở rộng được quy hoạch ban đầu vẫn chưa được hiện thực hóa một cách toàn diện."

 refurbishment_residential_expansion_weak_gestalt: "Cải Tạo Nhà Cũ Ở Khu Dân Cư"
 refurbishment_residential_expansion_weak_gestalt_desc: "Khu vực này sau đợt tân trang đã nhận được sự nghiệm thu, mặc dù rất nhiều hạng mục nâng cấp nằm trong kế hoạch vẫn chưa được đưa vào thực thi một cách toàn diện."

 refurbishment_fleet_capacity: "Mở Rộng Sức Chứa Của Hạm Đội"
 refurbishment_fleet_capacity_desc: "Cuộc cải tạo gần đây của Tàu Ark đã củng cố thêm cho các cơ sở hạ tầng quân sự của nó, đưa vào rất nhiều những thiết kế mang tính hiện đại hóa, giúp cho các hạm đội với phạm vi rộng lớn hơn có thể vận hành với công suất lớn hơn."

 refurbishment_residential_expansion: "Mở Rộng Khu Dân Cư"
 refurbishment_residential_expansion_desc: "Công tác chỉnh đốn toàn diện khu vực nhà ở đã đạt đến những tiêu chuẩn cao nhất. Các hệ thống hỗ trợ được hiện đại hóa đã cải thiện được một cách đáng kể điều kiện sống của tất cả các cư dân."

 refurbishment_residential_expansion_partial: "Mở Rộng Một Phần Khu Dân Cư"
 refurbishment_residential_expansion_partial_desc: "Mặc dù chưa đạt được sự mở rộng toàn diện như mong muốn, nhưng việc tân trang nhà ở đã cải thiện được đáng kể điều kiện cư trú, đồng thời cũng nâng cao được hiệu suất quản lý."

 refurbishment_residential_expansion_weak: "Cải Tạo Nhà Cũ Ở Khu Dân Cư"
 refurbishment_residential_expansion_weak_desc: "Khu vực nhà ở này sau đợt tân trang đã nhận được sự nghiệm thu. Sức chứa của nhà ở đã có phần cải thiện đôi chút, mặc dù rất nhiều hạng mục nâng cấp nằm trong kế hoạch đã không thể được thực thi một cách toàn diện."

 # Star-Crossed Lovers

 arkship.1385.name: "Khoang Tàu"
 arkship.1385.desc: "Máy quét tầm xa của chúng ta đã phát hiện ra một vật thể đang trôi dạt ở rìa của hệ sao. Kiểm tra thêm cho thấy, dưới lớp vỏ ngoài của nó có tồn tại sự mâu thuẫn chính xác về mặt hình học, cùng với những tín hiệu năng lượng đang trong trạng thái ngủ đông được vùi lấp dưới lớp vỏ đá dày.\n\nĐây là một chiếc khoang cứu sinh không rõ nguồn gốc, lớp vỏ bên ngoài của nó đã được ngụy trang, nhằm mục đích trốn tránh sự dò xét trong không gian vũ trụ bao la. Không hề phát hiện ra bất kỳ tín hiệu truyền phát chủ động nào, thế nhưng bên trong khoang tàu vẫn còn tồn tại những dấu vết duy trì sự sống cực kỳ mỏng manh. Bất luận thứ nằm bên trong là gì, thì nó cũng đã trôi dạt được một khoảng thời gian rất dài rồi."
 arkship.1385.a: "Hãy để chúng ta xem thử xem bên trong có thứ gì."
 arkship.1385.b: "Hãy cứ coi hòn đá này như một hòn đá bình thường đi."

 arkship.1390.name: "Tình Yêu Của Đời Ta"
 arkship.1390.desc: "Dưới lớp vỏ khoáng thạch, chúng ta đã phát hiện ra một khoang ngủ đông đã bị hư hại nghiêm trọng. Bên trong khoang tàu có một hành khách, đã chết từ rất lâu rồi. Thi thể của người này khoác trên mình những bộ lễ phục lộng lẫy, hoàn toàn không hề thích hợp cho việc du hành vũ trụ. Xem ra người này đã bị ép nhét vào bên trong một cách vô cùng vội vã.\n\nBên trong khoang ngủ đông có những dấu vết rõ ràng của bạo lực. Một vài thiết bị trói buộc bên trong đã từng bị cưỡng chế sử dụng. Chiếc khoang chứa này không phải là nơi trú ẩn, mà là một lồng giam. Chỉ tìm thấy được hai món đồ: một bộ tọa độ cùng với một bức thư được niêm phong kín. Phía trên có khắc một dòng chữ vô cùng đơn giản:\n\n§H\"Gửi đến tình yêu của đời ta.\"§!"
 arkship.1390.a: "Thiết lập lộ trình đi tới tọa độ đó."
 arkship.1390.b: "Chúng ta không nên lãng phí thời gian vào việc này."

 arkship.1395.name: "Kẻ Sống Sót Cuối Cùng"
 arkship.1395.desc: "Cuối cùng thì chúng ta cũng đã đến được khoang ngủ đông mà tọa độ được khôi phục đã chỉ dẫn đến. Ở bên trong, chúng ta đã tìm thấy một sinh vật khác, và nó vẫn còn đang thoi thóp thở.\n\nCơ thể của nó đã bị tổn thương vô cùng nghiêm trọng. Sự thất bại của hệ thống ngủ đông dài hạn đã khiến cho [event_target:star_crossed_survivor.GetHisHer] rơi vào tình trạng ngàn cân treo sợi tóc. Có vẻ như hai chiếc khoang ngủ đông này đã bị tách rời từ rất lâu rồi, và chưa bao giờ đến được đích.\n\nChúng ta đã giúp cho sinh vật ngoài hành tinh này ổn định lại, nó yêu cầu chúng ta gọi [event_target:star_crossed_survivor.GetHimHer] là [event_target:star_crossed_survivor.GetName]. Ngày tháng để có thể hoàn toàn bình phục e rằng vẫn còn rất xa xôi."
 arkship.1395.a: "Đảm bảo cho [event_target:star_crossed_survivor.GetHeShe] có thể bình phục."

 arkship.1400.name: "Cuộc Đại Đồ Sát"
 arkship.1400.desc: "Lời khai của [event_target:star_crossed_survivor.GetName] đã được ghi chép lại trong suốt quá trình [event_target:star_crossed_survivor.GetHisHer] bình phục:\n\n§H\"Một cuộc đại đồ sát đã diễn ra. Toàn bộ gia đình đã bị xóa sổ. Dựa theo thông cáo quan phương, đó là cuộc tập kích của một đế chế thù địch. Thế nhưng đó chỉ là một lời dối trá. Chính những kẻ nắm quyền đã lên kế hoạch cho tất cả chuyện này, một tội ác được thêu dệt nên, chỉ để bao biện cho một cuộc chiến tranh vô nghĩa. Người yêu của tôi và tôi đã tìm ra được những chứng cứ đó. Các chỉ thị nội bộ. Những bản nhật ký chưa bị giả mạo.\n\n\"Chúng tôi đã công bố nó. Chúng tôi đã lường trước được những hậu quả sẽ xảy ra. Điều mà chúng tôi không thể lường trước được, đó chính là sự lưu đày.\"§!\n\nMặc dù cơ sở dữ liệu của khoang ngủ đông đã bị tổn hại phần nào, thế nhưng bản ghi chép đó vẫn có thể được khôi phục lại. Bản ghi chép này hiện tại đang nằm trong tay chúng ta."
 arkship.1400.a: "Chúng tôi đã tìm thấy lời nhắn nhủ của người yêu bạn."

 arkship.1405.name: "Cuộc Chiến Tranh Đẫm Máu"
 arkship.1405.desc: "Lời khai của [event_target:star_crossed_survivor.GetName] đã được ghi chép lại một cách trọn vẹn trong suốt thời gian [event_target:star_crossed_survivor.GetHisHer] bình phục:\n\n§H\"Hạm đội đã tiến đến rất gần rồi, chúng tôi đã nhìn thấy bọn chúng từ rất lâu trước khi bọn chúng kịp đến nơi. Kể từ khi chúng tôi cự tuyệt yêu cầu thần phục của [event_target:star_crossed_empire.GetName], bọn chúng đã phát động chiến tranh với chúng tôi trong suốt nhiều năm qua. Thực lực quân sự của chúng tôi vô cùng chênh lệch, căn bản không phải là đối thủ của chúng.\n\n\"Đến cuối cùng, cha mẹ tôi đã gửi gắm hy vọng của họ vào những chiếc khoang ngủ đông này. Bọn họ đã ép tôi và người tôi yêu tiến vào hư không, cơ hội sống sót của chúng tôi vô cùng mong manh, sự đoàn tụ của chúng tôi cũng chỉ đành phó mặc cho số phận định đoạt, chỉ mong có thể có được một khởi đầu mới.\"§!\n\nSau khi tiến hành điều tra hệ thống của khoang ngủ đông, chúng ta đã phát hiện ra rất nhiều dữ liệu kỹ thuật thời chiến."
 arkship.1405.a: "$arkship.1400.a$"

 arkship.1410.name: "Phát Hiện Chết Chóc"
 arkship.1410.desc: "Trong suốt thời gian [event_target:star_crossed_survivor.GetHisHer] bình phục, [event_target:star_crossed_survivor.GetName] đã ghi chép lại một cách trọn vẹn lời trần thuật của mình:\n\n§H\"Đế chế của chúng tôi từng lấy sự tôn trọng sinh mệnh và cái chết làm niềm tự hào. Tôn chỉ của chúng tôi là kéo dài sinh mệnh, đồng thời giảm bớt đau đớn trong quá trình chuyển giao giữa sống và chết, nhưng tuyệt đối không phải là vượt qua nó một cách hoàn toàn. Việc đạt được sự bất tử thông qua sự thăng hoa cơ khí, chính là sự xúc phạm đối với tín ngưỡng của chúng tôi. Loại kiến thức này vốn dĩ không nên được nắm giữ. Thế nhưng sự hiếu kỳ đã lan rộng trong dân chúng. Khi mà nó đã không thể bị kiềm chế được nữa, chính quyền thống trị cho rằng mức độ rủi ro là không thể chấp nhận được.\n\n\"Bọn họ đã lựa chọn việc xóa sổ. Đế chế của chúng tôi đã bị hủy diệt để chôn vùi đi sự thật. Chỉ có tôi và người tôi yêu là may mắn sống sót, bị ép phải bước vào những chiếc khoang ngủ đông này, định sẵn là sẽ phải trôi dạt giữa ranh giới của sự sống và cái chết.\"§!\n\nLõi dữ liệu của khoang ngủ đông cũng đã được giải mã."
 arkship.1410.a: "$arkship.1400.a$"

 arkship.1415.name: "Dã Tâm"
 arkship.1415.desc: "[event_target:star_crossed_survivor.GetName] đã ghi chép lại lời tự thuật này trong suốt thời gian [event_target:star_crossed_survivor.GetHisHer] bình phục:\n\n§H\"Tôi có một người đồng nghiệp. Một người bạn, ít nhất là tôi đã từng cho là như vậy. Chúng tôi đã làm việc cùng nhau suốt mấy năm trời. Khi tôi được bổ nhiệm vào vị trí dẫn dắt dự án này, [event_target:star_crossed_survivor.GetHeShe] đã gửi lời chúc mừng đến tôi.\n\n\"Một tháng sau, tôi và người tôi yêu đã bị bắt. Những tội danh mang tính áp đặt. Không hề có bất kỳ phiên tòa xét xử nào. Khi tôi còn chưa kịp hỏi lý do vì sao, thì chúng tôi đã bị nhốt vào trong khoang ngủ đông rồi. Bây giờ thì tôi đã hiểu rồi, dã tâm không cần có lý do. Nó chỉ cần một cơ hội.\"§!\n\nNhật ký cá nhân đến từ hệ thống nội bộ của khoang ngủ đông đã cung cấp cho chúng ta một bản ghi chép chi tiết về sự quản lý của đế chế."
 arkship.1415.a: "$arkship.1400.a$"

 arkship.1420.name: "Sâu Mọt"
 arkship.1420.desc: "Lời trần thuật của [event_target:star_crossed_survivor.GetName] đã được ghi chép lại một cách trọn vẹn trong suốt thời gian [event_target:star_crossed_survivor.GetHisHer] bình phục:\n\n§H\"Một loại virus tàn nhẫn đã càn quét qua đế chế của chúng tôi. Người dân của chúng tôi lần lượt bỏ mạng một cách nhanh chóng và đầy vô tình. Người ta tin rằng nó bắt nguồn từ một trong những bãi rác khổng lồ của chúng tôi, đây là hệ quả đến từ sự thái quá và sự bất cẩn thô lỗ của chính chúng tôi. Trước khi ngày tận thế giáng xuống, người mà tôi yêu và tôi đã lựa chọn đứng về phía nhân dân của mình.\n\n\"Nhưng cha mẹ của tôi đã nhúng tay vào. Bất chấp nguyện vọng của chúng tôi, chúng tôi đã bị ép phải bước vào những chiếc khoang ngủ đông này, bị vứt bỏ. Công nghệ này vốn dĩ là dùng để bảo toàn cho chúng tôi. Có vẻ như nó đã thất bại rồi.\"§!\n\nĐã thu hồi được tàn dư sinh học bên trong hệ thống duy trì sự sống của khoang ngủ đông."
 arkship.1420.a: "$arkship.1400.a$"

 arkship.1425.name: "Thỏa Thuận Bị Che Giấu"
 arkship.1425.desc: "Trong suốt thời gian bình phục, [event_target:star_crossed_survivor.GetName] đã ghi chép lại một cách trọn vẹn lời tự thuật của [event_target:star_crossed_survivor.GetHisHer]:\n\n§H\"Cha mẹ của tôi biết rõ rằng [event_target:star_crossed_empire.GetName] sắp sửa thức tỉnh. Để có thể nhận được sự ân sủng của nó, bọn họ đã không từ bất kỳ thủ đoạn nào để đạt được một thỏa thuận giao dịch. Một phần tư dân số của chúng tôi đã bị hiến tế, để đổi lấy sức mạnh. Tôi và người tôi yêu đã phát hiện ra âm mưu của bọn họ.\n\n\"Thế nhưng có rất ít người chịu tin vào điều đó, còn những kẻ chịu tin thì lại bị diệt khẩu. Chúng tôi bị ép phải bước vào những chiếc khoang ngủ đông này, bị ném vào không gian hư vô, giống hệt như rất nhiều người trước đó, bị vứt bỏ.\"§!\n\nNhững tài liệu bên trong khoang kín của khoang ngủ đông đã được tìm thấy."
 arkship.1425.a: "$arkship.1400.a$"

 arkship.1430.name: "Sự Kết Hợp Cấm Kỵ"
 arkship.1430.desc: "Trong suốt thời gian [event_target:star_crossed_survivor.GetHisHer] bình phục, [event_target:star_crossed_survivor.GetName] đã ghi chép lại một cách trọn vẹn lời trần thuật của mình:\n\n§H\"Tôi không hề bị lưu đày vì những gì mình đã làm. Tôi bị lưu đày là bởi vì người mà tôi yêu.\n\n\"Dân tộc của chúng tôi đang trong thời kỳ chiến tranh. Chúng tôi đã giao chiến với nhau suốt nhiều thế hệ. Trong mắt của dân tộc chúng tôi, sự kết hợp của chúng tôi là một sự vượt quá giới hạn không thể nào được tha thứ. Chúng tôi đã cự tuyệt việc phải chia xa, chúng tôi tin rằng sự kết hợp của chúng tôi có lẽ sẽ có thể phô diễn được giá trị của sự hòa bình.\n\n\"Chúng tôi bị ép phải bước vào những chiếc khoang ngủ đông này, bị ném vào cõi hư không vô tận. Thế nhưng tình yêu của chúng tôi là không thể nào bị chia cắt.\"§!\n\nBên trong khoang ngủ đông này đã phát hiện ra bức thư từ cá nhân giữa hai kẻ lưu đày. Việc đọc chúng khiến cho người ta cảm thấy vô cùng xúc động."
 arkship.1430.a: "$arkship.1400.a$"

 arkship.1435.name: "Lời Thì Thầm Trong Cõi Hư Không"
 arkship.1435.desc: "Bản tự thuật của [event_target:star_crossed_survivor.GetName] đã được ghi chép lại một cách trọn vẹn trong suốt thời gian [event_target:star_crossed_survivor.GetHisHer] bình phục:\n\n§H\"Lúc ban đầu, nó chỉ là một sự tồn tại nằm ở rìa của những suy tư. Về sau, tôi bắt đầu nghe thấy những âm thanh. Lời thì thầm đó vẫn luôn bám theo tôi, cùng với sự trôi qua của thời gian, nó ngày càng trở nên rõ ràng hơn, những gì mà nó nói là một vài từ ngữ và những câu chữ vỡ vụn. Dân tộc của tôi cảm thấy vô cùng sợ hãi trước những gì mà tôi đã trở thành, nhưng người yêu của tôi vẫn luôn ở bên cạnh tôi.\n\n\"Chúng tôi cùng nhau bị ép phải bước vào chiếc khoang thoát hiểm này, bị ném vào cõi hư không, trước khi bất kỳ thứ gì có khả năng chạm đến tâm trí của tôi kịp lan rộng, thì chúng tôi đã bị đưa đi mất rồi. Ngay cả là vào lúc này, tôi vẫn có thể nghe thấy âm thanh của nó. Đang thì thầm.\"§!\n\nNhật ký cảm biến của khoang thoát hiểm đã hé lộ rất nhiều dữ liệu thú vị."
 arkship.1435.a: "$arkship.1400.a$"

 arkship.1440.name: "Lời Trăn Trối Cuối Cùng"
 arkship.1440.desc: "Tình trạng của [event_target:star_crossed_survivor.GetName] đang ngày một tồi tệ đi một cách nhanh chóng. Ngay khoảnh khắc trước khi người đó sắp sửa qua đời, chúng ta đã giải mã được một đoạn thông điệp được mã hóa phát ra từ khoang của người bạn đồng hành. Nội dung thông điệp như sau:\n\n§H\"Gửi đến tình yêu của đời ta,\n\nNếu như anh có thể nghe được đoạn thông điệp này, thì chứng tỏ số phận đã nhân từ với anh hơn là với em. Xin hãy hiểu cho rằng, dù là ở trong cõi hư không, em cũng chưa từng phải đơn độc, em vẫn luôn ở bên cạnh anh.\"§!\n\nNgay sau khi đoạn thông điệp kết thúc, các dấu hiệu sinh tồn của [event_target:star_crossed_survivor.GetName] đã hoàn toàn biến mất. Kể từ lúc tỉnh lại cho đến nay, đây là lần đầu tiên biểu cảm của [event_target:star_crossed_survivor.GetHisHer] lại trông bình yên đến vậy."
 arkship.1440.a: "Hãy an nghỉ nhé, [event_target:star_crossed_survivor.GetName]."
 arkship.1440.a.tooltip: "Lời khai cuối cùng của họ đã cung cấp cho chúng ta những thông tin tình báo vô cùng quý giá về [event_target:star_crossed_empire.GetName]."

 star_crossed_lovers_chain_title: "Đôi Uyên Ương Bạc Mệnh"
 star_crossed_lovers_chain_desc: "Một đoạn thông điệp được niêm phong kín cùng với một tọa độ đã được thu hồi từ một chiếc khoang ngủ đông đang trôi dạt. Bất luận đằng sau chúng đang cất giấu câu chuyện như thế nào đi chăng nữa, thì nó cũng đã phải chờ đợi một khoảng thời gian rất dài mới được thế nhân phát hiện ra."

 STAR_CROSSED_POD_PROJECT: "Quét Khoang Tàu"
 STAR_CROSSED_POD_PROJECT_DESC: "Chúng ta bắt buộc phải tiến hành quét vật thể này một cách tỉ mỉ, để xác định nguồn gốc của nó cũng như việc liệu ở bên trong có bất kỳ thứ gì có thể sống sót sau quãng thời gian trôi dạt dài đằng đẵng trong cõi hư không hay không."

 star_crossed_pod_object: "Khoang Tàu Thần Bí"
 star_crossed_pod_object_tooltip: "Khoang Tàu Thần Bí"
 star_crossed_pod_object_desc: "Một vật thể có cấu tạo vô cùng kỳ lạ, lớp vỏ bên ngoài của nó được ngụy trang thành một thiên thạch bình thường. Sau khi tiến hành kiểm tra một cách tỉ mỉ, sẽ phát hiện ra bên dưới lớp đá tồn tại những điểm bất thường về mặt hình học cực kỳ chuẩn xác. Những tín hiệu năng lượng đang trong trạng thái ngủ đông vẫn luôn hiện hữu ở bên trong nó."

 star_crossed_survivor_pod_object: "Khoang Cứu Sinh"
 star_crossed_survivor_pod_object_tooltip: "Khoang Cứu Sinh"
 star_crossed_survivor_pod_object_desc: "Chiếc khoang ngủ đông thứ hai đang trôi dạt trong cõi hư không. Tình trạng hệ thống của nó có phần nhỉnh hơn một chút so với chiếc đầu tiên, nhưng cũng chỉ đến mức đó mà thôi. Những dấu hiệu duy trì sự sống vô cùng mong manh vẫn đang lay lắt bên trong nó."

 STAR_CROSSED_SURVIVOR_POD_PROJECT: "Quét Khoang Cứu Sinh"
 STAR_CROSSED_SURVIVOR_POD_PROJECT_DESC: "Chúng ta bắt buộc phải bay đến hệ sao đã được chỉ định, đồng thời tiến hành quét khoang thoát hiểm này, nhằm mục đích xác định xem những người bên trong nó liệu còn sống hay không."
 STAR_CROSSED_POD_PROJECT_REQUIREMENT: "Trên quỹ đạo có $COUNT$/$REQUIRED$ chiếc Tàu Ark hoặc Tàu Khoa Học."

 star_crossed_survivor_pod_poi: "Khoang Cứu Sinh"
 star_crossed_survivor_pod_poi_desc: "Tọa độ được tìm thấy từ khoang tàu của người bạn đồng hành chỉ hướng về hệ sao này. Chiếc khoang cứu sinh thứ hai đang trôi dạt tại nơi này, hành khách bên trong vẫn chưa rõ lai lịch."


 ap_eternal_vigilance_nomads: "$ap_eternal_vigilance$"
 ap_eternal_vigilance_nomads_desc: "Sự yếu kém sẽ dẫn đến những cuộc tấn công. Cái giá phải trả cho việc đối đầu với Tàu Ark của chúng ta bắt buộc phải cực kỳ đắt đỏ, đắt đến mức gần như không một ai muốn phải gánh chịu cái giá đó."
