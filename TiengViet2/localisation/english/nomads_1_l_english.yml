 civic_void_reavers: "Kẻ cướp bóc Hư Không"
 civic_void_reavers_desc: "Là những kẻ cướp bóc giữa các vì sao, xã hội này chỉ có khái niệm mơ hồ về quyền sở hữu. Họ tôn trọng quyền của kẻ mạnh và kẻ xảo quyệt trong việc tự do vơ vét của cải được bảo vệ lỏng lẻo."
 civic_tooltip_void_reavers_effects: "$t$—Mở khóa tư thế oanh tạc quỹ đạo §YCướp phá§!, cho phép chúng ta cuỗm bớt tài nguyên từ một hành tinh.$TABBED_NEW_LINE$—Các mô-đun trạm trung chuyển bổ sung: §Y$sm_defense_cat$§! và §Y$sm_piracy_cat$§!"
 bombardment_plundering: "Cướp phá"
 bombardment_plundering_desc: "Kiểu oanh tạc quỹ đạo $bombardment_plundering$ sử dụng tàu cướp phá chuyên dụng tấn công các cơ sở hạ tầng đối phương để vơ vét tài nguyên.\n—Gây sát thương §ECực kỳ nhẹ§! lên §YLục quân§!\n—Gây sát thương §EVừa phải§! lên §YHành tinh§!\n—Ở mức §Y70% Tàn phá§!: Mỗi tháng có tỉ lệ §Yđánh cắp§! §G40%§! sản lượng tài nguyên từ §YHành tinh§! này. Mỗi đội lục quân đồn trú trên hành tinh sẽ làm giảm tỉ lệ này tương ứng."
 councilor_master_gunner: "Đại pháo thủ"
 councilor_master_gunner_desc: "Dành trọn tâm huyết bảo vệ các tiền đồn, với tư cách là một pháo thủ lão luyện, họ luôn đảm bảo kho dự trữ đầy ắp thuốc nổ, đầu đạn và đủ loại vũ khí chết người."
 mod_ship_military_alloys_cost_mult: "Chi phí hợp kim cho tàu chiến"
 sm_waystation_pirate_hideout: "Hang ổ hải tặc"
 sm_waystation_pirate_hideout_plural: "Hang ổ hải tặc"
 sm_waystation_pirate_hideout_desc: "Nơi những huynh đệ hư không tụ họp để bổ sung nhu yếu phẩm, bán đồ cướp được và chè chén say sưa ăn mừng chiến lợi phẩm."
 waystation_pirate_hideout_tt: "\n§YHiệu ứng§!:\nÔ vũ khí £ship_h_slot£: §G+1§!.\nCung cấp tài nguyên dựa theo sản lượng của các thuộc địa trong cùng hệ sao.\nMỗi thuộc địa trong hệ sao: $TABBED_NEW_LINE$Đánh cắp sản lượng hàng tháng: §G+1.5%§![GetPirateHideoutPiracyDesc]"
 waystation_pirate_hideout_piracy_cloaked_tt: "\nNếu trạm trung chuyển này không kích hoạt trạng thái ngụy trang tàng hình, chủ sở hữu thuộc địa sẽ §Rnghi ngờ có hoạt động hải tặc§!, khiến quan hệ với chúng ta bị giảm sút."
 waystation_pirate_hideout_piracy_tt: "\nChủ sở hữu thuộc địa xem việc này là §Rhoạt động hải tặc đáng ngờ§!, khiến quan hệ với chúng ta bị giảm sút."
 waystation_pirate_hideout_reaver_stronghold_tt: "Hiệu ứng bổ sung do §Y$sm_waystation_reaver_stronghold$§! tạo ra:"
 sm_waystation_concealment_field: "Trường ngụy trang"
 sm_waystation_concealment_field_desc: "Hệ thống tấm ốp tân tiến sẽ giảm thiểu tối đa tình trạng rò rỉ tín hiệu và năng lượng, từ đó củng cố khả năng phòng thủ và tối ưu hóa hệ thống tàng hình của chúng ta."
 sm_waystation_reaver_stronghold: "Thành lũy cướp bóc"
 sm_waystation_reaver_stronghold_desc: "Sở chỉ huy cố định của hạm đội hải tặc chúng ta; pháo đài vững chãi này sẽ giúp điều phối các cuộc tập kích trên khắp hệ sao."
 waystation_reaver_stronghold_tt: "\n§YHiệu ứng§!:\nÔ vũ khí £ship_h_slot£: §G+1§!.\nSản lượng bị đánh cắp hàng tháng từ §Y$sm_waystation_pirate_hideout_plural$§!: §G+1.5%§!\nTỉ lệ cướp bóc tài nguyên được nhân đôi khi sử dụng tư thế oanh tạc §Y$bombardment_plundering$§!."

 civic_flight_schools: "Trường huấn luyện bay"
 civic_flight_schools_desc: "Các phi công từ lâu đã là những người hùng trong lòng dân chúng, truyền cảm hứng cho biết bao người noi theo. Chẳng bao lâu, trở thành phi công đã được coi là biểu tượng của vị thế xã hội, sản sinh ra hết thế hệ này đến thế hệ khác các phi công cừ khôi với những chiến công vang dội chứng minh tất cả."
 civic_flight_schools_effect_tooltip: "$t$—$ADDITIONAL_TECHNOLOGIES_STRING$£engineering£ ['technology:tech_strike_craft_1', $tech_strike_craft_1$]"
 civic_flight_schools_effect_nomadic_tooltip: "$t$— $ADDITIONAL_TECHNOLOGIES_STRING$ £engineering£ ['technology:tech_strike_craft_1', $tech_strike_craft_1$]$TABBED_NEW_LINE$— Mô-đun Trạm Tiếp Vận khả dụng: ['starbase_module:waystation_hangar_bay', $sm_waystation_hangar_bay$]"
 civic_corporate_flight_schools: "Học viện bay Liên sao"
 civic_corporate_flight_schools_desc: "Nhận thấy tiềm năng ngày càng lớn từ việc thám hiểm không gian, tập đoàn khổng lồ này đã đầu tư mạnh tay để đào tạo một đội ngũ phi công tinh anh. Lực lượng phi công được rèn luyện bài bản sẽ bảo đảm lợi nhuận không ngừng tăng trưởng và thương mại tiếp tục vươn xa."
 civic_corporate_flight_schools_effect_tooltip: "$civic_flight_schools_effect_tooltip$$TABBED_NEW_LINE$—£building£§Y$building_military_contractors$§!$megacorp_civic_branch_office_building_effect$"
 civic_corporate_flight_schools_effect_nomadic_tooltip: "$civic_flight_schools_effect_nomadic_tooltip$$TABBED_NEW_LINE$—£building£§Y$building_private_shipyards$§!$megacorp_civic_branch_office_building_effect$"

 councilor_head_flight_operations: "Trưởng ban điều phối bay siêu không gian"
 councilor_head_flight_operations_desc: "Trưởng ban điều phối hành lang siêu không gian chịu trách nhiệm điều tiết các bước nhảy siêu không gian, bảo đảm chúng diễn ra nhanh chóng và trơn tru."

 councilor_flight_director: "Giám đốc vận hành bay"
 councilor_flight_director_desc: "Giám đốc vận hành bay chịu trách nhiệm điều phối việc sử dụng tàu vũ trụ nhằm tối đa hóa tiềm năng thương mại."
 councilor_flight_director_custom_modifier_desc: "—Giá trị thương mại £trade_value£ từ [GetStarbaseOrWayStation] và Nhà chứa tàu tuần tra trạm tiếp vận: §G+0.25§!"

 civic_hired_guns: "Họng súng đánh thuê"
 civic_hired_guns_desc: "Đế chế này tự định vị mình là một đối tác quân sự sẵn sàng cho thuê. Dù lúc nào cũng kỳ kèo giá cả, nhưng khi dùng vũ lực chết người để giải quyết rắc rối cho khách hàng, họ chắc chắn là những kẻ xuất sắc nhất."
 civic_hired_guns_effect_tooltip: "- Giá trị thương mại từ hợp đồng quân sự: §G+50%§!\n- Tốc độ bắn của tàu khi hợp đồng quân sự có hiệu lực: §G+15%§!\n- Chi phí duy trì của tàu khi hợp đồng quân sự có hiệu lực: §G-15%§!\n- Chi phí duy trì tàu neo đậu trên quỹ đạo thuộc địa §Rthù địch§!: §G-10%§!."

 civic_corporate_hired_guns: "Chuyên gia bảo vệ tài sản"
 civic_corporate_hired_guns_desc: "Doanh nghiệp toàn vũ trụ này cung cấp dịch vụ an ninh hàng đầu. Chỉ cần trả đúng giá, năng lực chuyên môn của họ trong các tình huống xung đột leo thang bạo lực dư sức đảo ngược cục diện bất kỳ cuộc giao tranh nào."
 civic_corporate_hired_guns_effect_tooltip: "$civic_hired_guns_effect_tooltip$\n—£building£§Y$building_military_contractors$§!$megacorp_civic_branch_office_building_effect$"

 hired_guns_modifier: "Hợp đồng có hiệu lực"
 hired_guns_modifier_desc: "Tiền thù lao và chiến lợi phẩm đã làm nên điều kỳ diệu, khích lệ tinh thần phi hành đoàn của chúng ta."
 hg_ship_upkeep_bombing: "$BLANK_STRING$"

 councilor_paymaster: "Trưởng ban phát lương"
 councilor_paymaster_desc: "Trong giới lính đánh thuê, chẳng có điều gì quan trọng hơn chuyện tiền công sòng phẳng."
 councilor_asset_security_manager: "Giám đốc an ninh tài sản"
 councilor_asset_security_manager_desc: "Tối ưu hóa thù lao nhân sự là chìa khóa để cân đối sổ sách. Dĩ nhiên, việc cho phép giữ lại phần chiến lợi phẩm kiếm được trong thời gian thi hành nhiệm vụ cũng là một đãi ngộ hào phóng."

 strike_craft_modifier: "Khoang phi công"
 strike_craft_modifier_tt: "Chúng ta có thể dùng thứ này để bố trí thêm chỗ cho các phi công."

