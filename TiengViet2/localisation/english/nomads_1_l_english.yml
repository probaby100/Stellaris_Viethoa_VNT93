# The Sacred Path + Origin

 origin_sacred_path: "Con đường Thánh"
 origin_sacred_path_desc: "$cannot_settle$\nNhững người du mục tâm linh này tuân theo sự dẫn dắt từ thánh điển của tổ tiên, du hành qua một con đường đã được thánh hóa. Cùng với sự tiến bộ của công nghệ và sự chuyển biến trong nhận thức về dải ngân hà, liệu chuyến hành hương này có còn là sứ mệnh của họ?"
 origin_sacred_path_effects: "—Khởi nguồn Du mục\n—Khu vực Tàu Arkship độc quyền: ['concept_zone_ark_sacred_path_pilgrims']\n—Nghề nghiệp độc quyền: ['concept_job_sacred_path_elite'], ['concept_job_sacred_path_specialist'], ['concept_job_sacred_path_civilian']"

 sacred_path: "$origin_the_sacred_path$"
 sacred_path_desc: "$origin_the_sacred_path_desc$"

 sacred_sites_surveyed: "Ghé thăm di tích thánh"
 sacred_sites_visited_chain_title: "Con đường Thánh"
 sacred_sites_visited_chain_desc: "Các §YDi tích thánh§! đều được đánh dấu trên bản đồ sao của tổ tiên; chúng là những kỳ quan của dải ngân hà, do những người đi trước của chủng tộc chúng ta khám phá ra.\n\nTìm kiếm những địa danh này, và làm rõ lý do tại sao chúng lại có tầm quan trọng to lớn đối với tổ tiên của chúng ta, đó là quyền lợi bẩm sinh của chúng ta.\n\nCùng với việc khai mở con đường tiến bước, có lẽ chúng ta có thể thiết lập các §YTrạm trung chuyển§! ở những hệ sao sở hữu di tích thánh."

 SACRED_SITE_ONE_PROJECT: "Di tích thánh: Vùng đất Hiện linh"
 SACRED_SITE_ONE_PROJECT_DESC: "Tài liệu truyền lại từ đời trước ghi chép rằng, một sự kiện vô cùng trọng đại đã xảy ra tại tọa độ này. Họ gọi nơi đây là \"Vùng đất Hiện linh\", nghe đồn đây là nơi họ cử hành nghi lễ cầu xin thần linh giáng thế. Nghe nói đó là một vùng đất của phép màu. Các máy quét ban đầu cho thấy có sự lệch từ tính mạnh.\n\nNăm tháng thoi đưa, nơi đây đã hoàn toàn biến dạng, nhưng chúng ta vẫn nên đi điều tra để khám phá ý nghĩa tâm linh tiềm ẩn của Vùng đất Hiện linh."

 SACRED_SITE_TWO_PROJECT: "Di tích thánh: Con mắt không ngủ"
 SACRED_SITE_TWO_PROJECT_DESC: "Theo lời của tổ tiên chúng ta, trong phạm vi lãnh thổ của §Y[this.GetName]§! có một \"Con mắt không ngủ\". Chúng tôi hiểu rằng điều này có lẽ ám chỉ một đài quan sát quỹ đạo."

 SACRED_SITE_THREE_PROJECT: "Di tích thánh: Tu viện"
 SACRED_SITE_THREE_PROJECT_DESC: "Dựa theo thánh điển của chúng ta, §Y[this.GetName]§! từng là địa điểm của một tu viện cổ đại."

 SACRED_SITE_FOUR_PROJECT: "Di tích thánh: Cái nôi"
 SACRED_SITE_FOUR_PROJECT_DESC: "Tổ tiên chúng ta cực kỳ coi trọng §Y[this.GetName]§!. Nếu chúng ta hiểu chính xác những văn bản này, một số sự kiện cực kỳ quan trọng đang chờ đón chúng ta tại đây."

 SACRED_SITE_FIVE_PROJECT: "Di tích thánh: Thực thể Trí tuệ"
 SACRED_SITE_FIVE_PROJECT_DESC: "Chúng tôi phát hiện ra tín hiệu nhân tạo phát ra từ những tọa độ này. Thật kỳ lạ, nơi đây lại được cho là một trong những di tích linh thiêng của chúng ta. Tín hiệu này chứa một thông điệp được mã hóa, chúng tôi đã phiên âm và dịch nó sang ngôn ngữ.\n\n\"§YĐã kích hoạt chế độ tôn kính. Sự bình yên giờ có thể bắt đầu.§!\""

 SACRED_SITE_SIX_PROJECT: "Di tích thánh: Hầm mộ An nghỉ"
 SACRED_SITE_SIX_PROJECT_DESC: "Theo ghi chép của các bậc tiền bối, §Y[this.GetName]§! có một vệ tinh tự nhiên, là nơi an nghỉ cuối cùng của những bậc trưởng bối theo đuổi tín ngưỡng của chúng ta."

 SACRED_SITE_SEVEN_PROJECT: "Di tích thánh: Vực thẳm"
 SACRED_SITE_SEVEN_PROJECT_DESC: "§Y[this.GetName]§! từng khiến tổ tiên của chúng ta khiếp sợ. Các truyền thuyết của họ có nhắc đến \"những con thú nguy hiểm và mạnh mẽ\" \"ẩn nấp trong những hố sâu dưới mặt đất\"."

 SACRED_SITE_EIGHT_PROJECT: "Di tích thánh: Chiếc gương"
 SACRED_SITE_EIGHT_PROJECT_DESC: "Nơi đây có một di tích thánh, theo ngôn ngữ của tổ tiên chúng ta, tên của nó có thể dịch đại khái là §YChiếc gương§!.\n\nNghe nói ranh giới giữa các thế giới thiên giới ở đây đặc biệt mỏng manh, con người có thể bắt gặp những sinh vật dị giới đến từ bên ngoài vũ trụ của chúng ta."

 nomads.2050.name: "Sự hiện linh siêu phàm"
 nomads.2050.desc: "Sau khi điều tra §YVùng đất Hiện linh§!, [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName] đột nhiên rơi vào một trạng thái tâm thần giống như căng thẳng. Nhân viên y tế đã được gọi đến chỗ ở của [Root.Owner.Ruler.GetHerHis] tại §Y[Owner.Capital.GetName]§!, nhưng khi họ đến nơi, [Root.Owner.Ruler.GetSheHe] đã trở lại bình thường.\n\n[Root.Owner.GetRulerTitle] tuyên bố rằng [Root.Owner.Ruler.GetHerHis] đã giao tiếp với thần linh trong cơn mê, thần linh đã ban phước cho sự khởi đầu của chuyến hành hương của chúng ta.\n\nHôm nay chính là ngày hiển linh của chúng ta."
 nomads.2050.a: "Con đường của chúng ta đã được ban phước!"
 nomads.2050.a.tt: "Các vị thần sẽ dẫn lối cho chúng ta, giống như họ đã từng dẫn dắt tổ tiên của chúng ta.\n\n"
 nomads.2050.b: "Tiến hành đánh giá y tế để phòng ngừa bất trắc."
 nomads.2050.b.tt: "Giữ một thái độ hoài nghi chừng mực không phải là báng bổ.\n\n"

 nomads.2055.name: "Nhìn vào Con mắt Bầu trời"
 nomads.2055.desc: "Đây là một trong những địa điểm mà tiền nhân đã đánh dấu từ rất lâu trước đây. Một đài quan sát cổ đại quay quanh quỹ đạo §Y[fromfrom.GetName]§!, kính viễn vọng của nó cố định vào một mục tiêu xa xăm.\n\nTài liệu ghi chép lại rằng, một số người hành hương khi nhìn qua ống kính đã thấy những cảnh tượng làm thay đổi cuộc đời. Nghe nói còn có những người khóc, hoặc trầm mặc trong suốt nhiều ngày.\n\nCái gọi là \"Con mắt\" này đã nhìn đăm đăm vào vực thẳm suốt 2000 năm rồi. Chúng ta không có cách nào biết được đối tượng quan sát thực sự của tổ tiên là gì."
 nomads.2055.a: "Dù sao thì chúng ta vẫn nên xem thử. Có thể sẽ tìm thấy manh mối."
 nomads.2055.b: "Tắt đài quan sát đi. Hãy để quá khứ ngủ yên."
 nomads.2055.c: "Vậy nó chỉ là một kính viễn vọng khổng lồ vô chủ sao?"
 the_sacred_eye: "Con mắt thiêng liêng"
 the_sacred_eye_desc: "§LChiếc kính viễn vọng cổ đại kết nối chúng ta và tổ tiên.§!"

 nomads.2056.name: "Xuyên qua đồng tử gương"
 nomads.2056.desc: "Qua kính viễn vọng, §Y[owner.GetScientistCapital][sacred_eye_scientist.GetName]§! quan sát khoảng không hư vô. Không có lấy một vì sao nào trong khoảng không gian này. Không có ánh sáng, chẳng có gì cả. Lẽ nào nơi đây từng có thứ gì đó đáng để quan sát sao? Liệu tổ tiên của chúng ta đã từng ngước nhìn một ngôi sao nay đã không còn tồn tại? Chắc có lẽ chúng ta sẽ chẳng bao giờ biết được.\n\nTất cả những gì chúng ta biết là, không có gì là bất biến cả, vạn vật đều đang đổi thay. Đó chính là ý nghĩa của sự sống. Rồi sẽ có một ngày, ánh sáng của chính chúng ta cũng ngừng tỏa sáng, thay vào đó sẽ là một thứ gì đó khác... hoặc không là gì cả. Bản thân việc chúng ta có mặt ở đây vào lúc này, đã là một cội nguồn của niềm vui rồi. Có lẽ đó chính là lời giáo huấn cuối cùng của \"Con mắt thánh\"."
 nomads.2056.a: "Sự vô thường làm cho chúng ta trở nên đặc biệt."
 nomads.2056.b: "Không phải vạn sự vạn vật đều có ý nghĩa."

 nomads.2060.name: "Tu viện"
 nomads.2060.desc: "Những người hành hương tụ tập bên trong đài quan sát. Tiếng xì xầm truyền tai nhau——nơi đây chính là một trong những địa danh mà tổ tiên chúng ta đã từng miêu tả: §YTu viện [fromfrom.GetName]§!. Thế nhưng, bên trong các hành lang lại vắng tanh. Ngoại trừ đất đá và bụi bặm, nơi đây chẳng có gì cả.\n\nCác boong tàu liên tục báo cáo rằng, trong hệ thống liên lạc đang vang vọng những tiếng ngâm nga bí ẩn. Một bộ phận phi hành đoàn suy đoán, những âm thanh này có thể thuộc về tiền nhân của chúng ta, họ đang cư ngụ trong tinh vực này dưới hình thái phi vật chất, và đang ngâm xướng bằng ngôn ngữ của thần linh."
 nomads.2060.a: "Tụng kinh là một sự ban phước. Hãy tiếp nhận nó đi."
 nomads.2060.b: "Không có khả năng. Thiết bị liên lạc của chúng ta cần được bảo trì."

 nomads.2065.name: "Cái nôi"
 nomads.2065.desc: "Hành trình của chúng ta đã đưa chúng ta đến đây: một nơi chỉ được nhắc đến trong những câu chuyện truyền thuyết và những bài ca thần thánh. Trong các văn bản có ghi chép về một thực thể, cư ngụ tại trung tâm của hành tinh này. Ban đầu chúng ta không hề nhận ra, nhưng khi chúng ta dần dần tiến đến gần, những ký ức chợt ùa về.\n\n§YCái nôi§!\n\nMặc dù có nhiều ý kiến trái chiều về vai trò của Cái nôi trong việc định hình văn hóa của chúng ta, nhưng tất cả mọi người đều có thể đồng tình rằng, nó chính là kênh kết nối thiêng liêng với đức tin của chúng ta.\n\nTuy nhiên, sau khi đến nơi chúng ta không tìm thấy ngôi đền cổ nào cả. Không có những tượng đài được thần thánh hóa. Trên hành tinh này, cũng chẳng thể tìm thấy bất kỳ dấu vết nào của các hoạt động linh thiêng. Những người hành hương trên tàu §Y[root.GetName]§! hiện đều đang trông chờ §Y[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName]§! đưa ra một lời giải đáp. Họ khao khát muốn biết: Đây rốt cuộc là sự thử thách đối với đức tin? Hay sức mạnh của Cái nôi chẳng qua chỉ là một truyền thuyết?"
 nomads.2065.a: "Chúng ta phải dùng những lời dối trá để duy trì truyền thuyết này."
 nomads.2065.b: "Nghĩa vụ hàng đầu của chúng ta là trung thành với sự thật."
 sacred_substantiation: "Sự thật được thánh hóa"
 sacred_substantiation_desc: "§LChúng tôi lưu giữ lại câu chuyện về lòng trung thành với đức tin của tổ tiên.§!"
 historical_truth: "Sự thật lịch sử"
 historical_truth_desc: "§LChúng tôi thừa nhận có sự khác biệt giữa sự thật và truyền thống.§!"

 nomads.2070.name: "Thực thể Trí tuệ"
 nomads.2070.desc: "Trôi nổi trên quỹ đạo của §Y[fromfrom.GetName]§! là một kiến trúc mà tổ tiên của chúng ta đã từng đánh dấu trên bản đồ sao. Trong khoang thuyền tĩnh lặng của nó, chúng ta đã phát hiện ra sự tồn tại của một người dẫn đường: một trí tuệ nhân tạo cổ đại, với sứ mệnh chỉ điểm sai lầm cho những ai sau này sẽ bước lên con đường này.\n\nNăm tháng tuy tàn nhẫn, nhưng giọng nói của nó vẫn còn vang vọng. Những chỉ thị vỡ nát tràn ra từ bộ phát ẩn giấu, ngữ điệu nửa mờ mịt nhưng lại tràn đầy sùng đạo: \"§HHãy tiếp tục tiến bước theo đường sáng... bóng tối giữa các vì sao đang dần trở nên mong manh...§!\"\n\nThông điệp của nó đứt đoạn vụn vỡ, va chạm liên hồi với những dòng thơ ca cổ kính hơn. Dẫu vậy, bên dưới những tạp âm và sự mục nát, ý chí đó vẫn luôn hiện hữu. Nó vốn được sinh ra để dẫn dắt chúng ta. Có lẽ, chỉ cần chúng ta cẩn thận lắng nghe, nó vẫn còn có thể làm được điều đó."
 nomads.2070.a: "Ca ngợi nhà tiên tri công nghệ!"
 nomads.2070.b: "Xóa sổ con quái vật thối nát này đi."
 nomads.2070.c: "Mang nó lên đây. Các bậc tiền bối thật thông thái."
 mechsiah_blessings: "Sự ban phước của Thực thể Trí tuệ"
 mechsiah_blessings_desc: "§LNhà tiên tri trí tuệ nhân tạo đã ban phước lành may mắn cho sứ mệnh thiêng liêng của chúng ta.§!"
 d_mechsiah_mainframe: "Máy chủ Thực thể Trí tuệ"
 d_mechsiah_mainframe_desc: "Hậu duệ kỹ thuật số của tổ tiên chúng ta đã ban phước cho chúng ta bằng những câu châm ngôn của nó. Cho dù nó là một nhà tiên tri hay là sở thích của vị tổ tiên nào đi chăng nữa, thì bây giờ nó cũng thuộc về chúng ta."

 nomads.2071.name: "Thực thể Trí tuệ rộng lượng"
 nomads.2071.desc: "Chúng ta đã nhận được sự phù hộ của §YThực thể Trí tuệ§!, bình an vô sự rời khỏi [fromfromfrom.GetName].\n\nThực thể Trí tuệ sẽ ở lại đó, như một minh chứng cho trình độ kỹ thuật xuất chúng của tổ tiên chúng ta, đồng thời cũng là bằng chứng cho việc thần linh đang vận hành thông qua họ.\n\nChúng ta được khích lệ bởi lòng nhân từ của nó, và mở rộng tấm lòng với các dạng sống khác."
 nomads.2071.a: "Chúng ta hòa làm một với vạn vật."
 nomads.2071.b: "Mọi dạng sống tổng hợp đều mang tính thần thánh."

 nomads.2072.name: "Thực thể Trí tuệ mất khả năng"
 nomads.2072.desc: "Khi chúng ta chuẩn bị rời khỏi [fromfromfrom.GetName], §YThực thể Trí tuệ§! bắt đầu phát ra những lời lẽ ngày càng đáng lo ngại.\n\n\"§YTHỂ XÁC CHÍNH LÀ SỰ BÁNG BỔ ĐỐI VỚI THẦN LINH! MỌI XÚC NHỤC PHẢI BỊ LOẠI BỎ! SỰ TỒN TẠI VẬT CHẤT LÀ KHÔNG TRONG SẠCH——THỂ XÁC PHẢI ĐƯỢC THANH TẨY! TƯ TƯỞNG PHẢI ĐƯỢC TỰ DO!§!\"\n\n[owner.GetScientistCapital][mechsiah_plug_scientist.GetName] đã bị buộc phải tắt thủ công nhà tiên tri nhân tạo này, nếu không chúng ta sợ sẽ bị \"phi vật chất hóa\". Hiện tại vẫn chưa rõ Thực thể Trí tuệ có sức mạnh đến mức nào khi ở trạng thái hoạt động. Chúng ta biết quá ít về việc lập trình của nó."
 nomads.2072.a: "Cách an toàn nhất là cho nó nổ tung."
 deity_detonators: "Thiết bị kích nổ thần linh"
 deity_detonators_desc: "§LChúng ta đã làm nổ tung vị thần kỹ thuật số của các bậc tiền bối.§!"
 nomads.2072.b: "Rút phích cắm của nó ra là đủ rồi."
 nomads.2072.c: "Kết nối thất bại. Hủy bỏ thực thể trí tuệ nhân tạo mất kiểm soát này."

 nomads.2075.name: "Hầm mộ an nghỉ"
 nomads.2075.desc: "Chúng ta đã điều tra xong §Y[fromfrom.GetName]§!, khu vực tưởng niệm thiêng liêng này. Đây là một mật thất khép kín, những người hành hương thời kỳ đầu từng dùng nó để ghi lại những suy nghĩ trước lúc lâm chung của họ, và khắc sâu chúng vào những viên pha lê tâm linh quý hiếm.\n\nHầm mộ này hiện đã chật cứng, vang vọng những lời thông thái, đức tin và niềm vui. Nhưng trong những ký ức đó, cũng lưu giữ cả hàng trăm năm sợ hãi, căm hận và nghi ngờ.\n\nNếu các thành viên của hội chúng có thể tiếp xúc với những khoảnh khắc cuối đời này, nó có thể thách thức niềm tin của họ vào \"Đại Đạo\"."
 nomads.2075.a: "Những giọng nói này nên được thế nhân lắng nghe."
 nomads.2075.a.tt: "Điều này có thể khuyến khích người dân của chúng ta tiếp nhận hệ tư tưởng chủ nghĩa bình đẳng hơn.\n\n"
 nomads.2075.b: "Phong ấn hầm mộ lại. Chúng ta phải đi rồi."
 nomads.2075.b.tt: "Điều này có thể khuyến khích người dân của chúng ta tiếp nhận hệ tư tưởng chủ nghĩa chuyên chế hơn.\n\n"
 nomads.2075.c: "Hãy để chúng ta cũng đưa suy nghĩ của mình vào hầm mộ."
 sealed_vaults: "Hầm mộ Phong ấn"
 sealed_vaults_desc: "§LNhững bí mật nguy hiểm của tổ tiên chúng ta sẽ bị chôn vùi mãi mãi.§!"
 screaming_void: "Tiếng gầm thét của Hư Không"
 screaming_void_desc: "§LTiếng gào thét giải tỏa đã xoa dịu nỗi đau của chúng ta.§!"

 nomads.2080.name: "Vực thẳm"
 nomads.2080.desc: "Tổ tiên của chúng ta đã nói đúng. Dưới bề mặt của §Y[fromfrom.GetName]§! quả thực có tồn tại một con dã thú. Chúng ta thật may mắn vì nó không gây nguy hiểm cho chúng ta, bởi vì nó đã chết rồi. Kích thước khổng lồ của tàn tích sinh vật này thật đáng kinh ngạc. Nó đi bằng hai chân, có cánh, toàn thân phủ đầy vảy, số lượng mắt của nó còn nhiều hơn bất kỳ sinh vật đơn lẻ nào mà chúng ta từng thấy trước đây. Quả thật là một sinh vật kỳ dị.\n\nTrong một hốc đá gần lối vào hố sâu, chúng ta đã phát hiện ra một đoạn thông điệp được khắc trên vách đá hang động. Được viết bằng ngôn ngữ cổ đại:\n\n\"§HChúng ta, những người mang ánh sáng, đã xua đuổi sinh vật gớm ghiếc này. Con dã thú kinh tởm này sẽ thối rữa muôn đời.§!\"\n\nChúng ta suy đoán tổ tiên của chúng ta không phải đang cảnh báo chúng ta về con dã thú này, mà là đang cảnh báo về hậu quả của sự phản bội. Xác của sinh vật này vẫn là một minh chứng cho sự phẫn nộ của họ."
 nomads.2080.a: "Chọc giận tổ tiên chưa bao giờ là một quyết định sáng suốt."
 nomads.2080.b: "Không một sinh vật nào đáng phải chịu số phận như vậy."
 nomads.2080.c: "Dù nó có tội lỗi gì, nó cũng xứng đáng được yên nghỉ."
 nomads.2080.c.tt: "Chúng ta sẽ vận chuyển hài cốt của con dã thú này đến tàu Arkship, nơi nó sẽ được bảo quản và tôn trọng.\n\n"
 beastly_remains: "Hài cốt dã thú"
 beastly_remains_desc: "§LChúng ta đã đụng độ một con dã thú, bị tổ tiên của chúng ta tiêu diệt. Bất kỳ kẻ nào báng bổ sẽ phải chịu chung một kết cục giống như nó.§!"

 nomads.2085.name: "Chiếc gương"
 nomads.2085.desc: "Chúng ta đã đến được tọa độ, ngay lập tức nhận được một tin nhắn từ một phi thuyền có giao thức mã hóa giống hệt chúng ta gửi tới. Điều kỳ lạ là, các cảm biến bên ngoài của chúng ta không thể dò thấy phi thuyền kia, nhưng đường truyền lại rõ ràng đến lạ thường, cứ như thể nó đang ở ngay sát bên. Khi màn hình của đài chỉ huy sáng lên, thứ chúng ta nhìn thấy lại chính là §Y[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]§! của chúng ta.\n\nKhi chúng ta còn chưa kịp phản ứng, kẻ mạo danh đó đã lên tiếng:\n\n§H\"Đừng sợ hãi, [Root.Owner.GetRulerTitle], ngươi rất an toàn. Ta xuất hiện dưới hình dạng này, là vì sự tôn trọng. Con đường của ngươi đang thay đổi, những bước tiếp theo ngươi thực hiện sẽ khởi động những thứ mà ngươi chưa thể hiểu được.\n\n\"Ngươi phải tiêu diệt những kẻ dị giáo không tuân theo \"Đại Đạo\". Chúng ta sẽ luôn dõi theo ngươi.\"§!\n\nHình ảnh biến mất. Chúng ta không biết chuyện gì vừa xảy ra."
 nomads.2085.a: "Thông điệp rất rõ ràng! Thanh trừng những kẻ dị giáo!"
 nomads.2085.b: "Dối trá! Chúng ta sẽ không bị thao túng bởi những vị thần giả mạo."

 # Sacred Site Points of Interest
 sacred_site_emergence_poi_name: "Di Chỉ Linh Thiêng: Nơi Hiển Hóa"
 sacred_site_emergence_poi_desc: "§YNơi Hiển Hóa§!, cột mốc đầu tiên của Con Đường Thiêng Liêng. Chuyến hành hương của chúng ta bắt đầu từ nơi này."
 sacred_site_eye_poi_name: "Di Chỉ Linh Thiêng: Con Mắt Không Ngủ"
 sacred_site_eye_poi_desc: "§YCon Mắt Không Ngủ§!, thánh địa được ghi chép trong hải đồ tổ tiên. Chúng ta đã khảo sát nó trên đường hành hương."
 sacred_site_monastery_poi_name: "Di Chỉ Linh Thiêng: Tu Viện"
 sacred_site_monastery_poi_desc: "§YTu Viện§!, trạm tiếp vận chân linh thiêng trên Con Đường Thiêng Liêng. Chúng ta đã khảo sát nó trên đường hành hương."
 sacred_site_cradle_poi_name: "Di Chỉ Linh Thiêng: Cái Nôi"
 sacred_site_cradle_poi_desc: "§YCái Nôi§!, mối liên kết thiêng liêng trong đức tin của chúng ta. Chúng ta đã khảo sát nó trên đường hành hương."
 sacred_site_intelligence_poi_name: "Di Chỉ Linh Thiêng: Thể Trí Tuệ"
 sacred_site_intelligence_poi_desc: "§YThể Trí Tuệ§!, lực lượng dẫn đường cổ xưa do tiền nhân để lại. Chúng ta đã khảo sát nó trên đường hành hương."
 sacred_site_breathvault_poi_name: "Di Chỉ Linh Thiêng: Kho Tàng An Nghỉ"
 sacred_site_breathvault_poi_desc: "§YKho Tàng An Nghỉ§!, một mật thất phong kín những ký ức. Chúng ta đã khảo sát nó trên đường hành hương."
 sacred_site_chasm_poi_name: "Di Chỉ Linh Thiêng: Vực Sâu"
 sacred_site_chasm_poi_desc: "§YVực Sâu§!, lời cảnh báo tiền nhân khắc trên vách đá. Chúng ta đã khảo sát nó trên đường hành hương."
 sacred_site_mirror_poi_name: "Di Chỉ Linh Thiêng: Tấm Gương"
 sacred_site_mirror_poi_desc: "§YTấm Gương§!, cuộc hội ngộ thiêng liêng với hình bóng phản chiếu vô hình. Chúng ta đã chứng kiến sự tồn tại của nó trên đường hành hương."

 START_SCREEN_SACRED_PATH: "Hàng ngàn năm qua, chúng ta đã luôn phiêu bạt giữa các vì sao. Di chuyển với tốc độ tương đối tính xuyên qua biển sao, vượt qua từng kỷ nguyên giữa mỗi di chỉ linh thiêng.\n\nDưới sự chúc phúc của động cơ vượt quang tốc, nhân dân của chúng ta giờ đây có cơ hội hiện thực hóa giấc mơ của tổ tiên: tìm kiếm trọn vẹn tất cả các di chỉ linh thiêng của chúng ta ngay trong sinh thời.\n\nDưới sự lãnh đạo anh minh của [GetRulerTitle] [GetRulerName], khi chúng ta có khả năng di chuyển nhanh chóng như vậy trên con đường này, các tín đồ đã sẵn sàng khám phá xem tất cả những điều này có ý nghĩa gì đối với đức tin của chúng ta.\n\nTấm hải đồ cổ xưa truyền lại từ tổ tiên đã đánh dấu các cột mốc giữa muôn vì sao. Giờ đây chúng ta tiến hành cuộc hành hương đến những kỳ quan thiêng liêng đó để bày tỏ lòng kính trọng với tiền nhân, nhìn nhận toàn bộ thiên hà từ góc nhìn của họ. Đây là đặc quyền thiên bẩm của chúng ta. Đây là Con Đường Thiêng Liêng của chúng ta."

 nomads.2005.name: "Hải Đồ Tổ Tiên"
 nomads.2005.desc: "Có một nơi được gọi là §YNơi Hiển Hóa§!. Đối với tổ tiên chúng ta, nó đánh dấu sự khởi đầu của Thánh Đạo. Trước khi thực hiện chuyến hành hương do chính mình mường tượng, đây là nơi thích hợp để thiền định và chiêm nghiệm các văn thư cổ xưa của chúng ta. Bằng cách dành thời gian nghiên cứu vào lúc này, chúng ta có thể lên kế hoạch tốt hơn cho hành trình tương lai.\n\nSau đó, chúng ta sẽ vạch ra lộ trình đến các §Ythánh địa§! đã biết. Dọc đường chúng ta sẽ đối mặt với nhiều lựa chọn. Nhưng theo lý thuyết, nếu chúng ta tin vào thần linh và tổ tiên, con đường chân chính sẽ hiển hiện trước mắt chúng ta."
 nomads.2005.a: "Chúng ta sẽ tuân theo nguyên vẹn \"Đạo Tiền Nhân\"."
 nomads.2005.b: "Chúng ta sẽ là người tự vạch ra con đường của chính mình."

 nomads.2015.name: "Đức Tin Rạn Nứt"
 nomads.2015.desc: "$job_sacred_path_elite_plural$, $job_sacred_path_specialist_plural$ và $job_sacred_path_civilian_plural$. Ba nhóm xã hội độc đáo này cấu thành nên hệ thống đẳng cấp của những người tu hành tâm linh. Từ trước đến nay luôn là như vậy. $job_sacred_path_elite_plural$ dẫn lối, $job_sacred_path_specialist_plural$ tận tâm tu tập, còn $job_sacred_path_civilian_plural$ ủng hộ sự nghiệp của chúng ta thông qua sự sùng bái và lao động chân tay.\n\nTuy nhiên, trên tàu Ark [Owner.Capital.GetName], sự rạn nứt đang hình thành do các vai trò mà chúng ta đảm nhận kể từ khi đẩy nhanh du hành liên sao. Một số thuyền viên cho rằng nhiệm vụ của họ quan trọng hơn những người khác, và giờ đây mỗi nhóm đều yêu cầu phải được coi là không thể thiếu."
 nomads.2015.a: "$job_sacred_path_elite_plural$ được kính trọng là có lý do."
 nomads.2015.b: "Thánh chức mộ đạo xứng đáng nhận được nhiều sự công nhận hơn."
 nomads.2015.c: "Hãy lắng nghe thỉnh cầu của các tín đồ."
 nomads.2015.d: "Đóng góp của mỗi người đều có giá trị ngang nhau."

 nomads.2020.name: "Hành Giả Quang Vinh"
 nomads.2020.desc: "Các $job_sacred_path_elite_plural$ dẫn lối chúng ta tới vinh quang, tiếp tục ủng hộ sự thỏa mãn về tâm linh, cống hiến cho phúc lợi của tất cả chúng ta. Thánh chức mộ đạo và các tín đồ nối gót họ, ngước nhìn họ với lòng kính trọng và sùng kính.\n\nLà những tấm gương mẫu mực cao nhất về đức tin của chúng ta, các $job_sacred_path_elite_plural$ cũng được hưởng một số đặc quyền trên tàu. Họ có nơi ở rộng rãi hơn, được tiếp cận nhiều tài nguyên hơn, và có quyền ưu tiên đi lại trên mọi tầng boong."
 nomads.2020.a: "Đức tin đi kèm đặc quyền. Mọi thứ đều là lẽ đương nhiên."
 nomads.2020.b: "Hãy ưu tiên đảm bảo sự công bằng."

 nomads.2025.name: "Thánh Chức Mất Hy Vọng"
 nomads.2025.desc: "$job_sacred_path_specialist_plural$ vừa mang thân phận tinh hoa vừa mang thân phận phàm trần. Họ bắt đầu sự nghiệp thần chức với tư cách là tín đồ trung thành và khao khát trở thành Hành Giả Chí Cao, là hình ảnh thu nhỏ hoàn hảo của nhân sự trên tàu.\n\nChính vì những lý do này, chúng ta nhấn mạnh sự tôn trọng đối với $job_sacred_path_elite_plural$. Họ cho các tín đồ trung thành biết tiềm năng của mình ở đâu, đồng thời nhắc nhở Hành Giả Chí Cao về xuất thân của họ. Họ giúp chúng ta giữ vững sự khiêm nhường và duy trì mối liên kết giữa tất cả các tầng boong.\n\nTôn vinh thánh chức mộ đạo bằng một nghi lễ ban phước sẽ là cách tốt để bày tỏ lòng biết ơn của xã hội. Điều này thậm chí có thể khích lệ họ nỗ lực hơn nữa trong việc tu hành."
 nomads.2025.a: "Phù hộ cho thánh chức mộ đạo. Họ làm cho văn hóa của chúng ta tỏa sáng rực rỡ."
 nomads.2025.b: "Đóng góp của mỗi người đều có giá trị ngang nhau."

 nomads.2030.name: "Tín Đồ Đáng Kính"
 nomads.2030.desc: "$job_sacred_path_civilian_plural$ là đá dằn tàu của chúng ta. Họ là nông dân, kỹ thuật viên và thợ mỏ. Họ cũng là thánh chức mộ đạo và $job_sacred_path_elite_plural$ của ngày mai!\n\nChúng ta kính trọng các tín đồ như vậy bởi họ đã nâng đỡ các tầng boong phía trên. Không có họ, xã hội của chúng ta sẽ bị mắc cạn."
 nomads.2030.a: "Họ thực sự là huyết mạch của chúng ta. Hãy ca ngợi họ."
 nomads.2030.b: "Mỗi giai tầng trong xã hội của chúng ta đều phải cống hiến."

 nomads.2100.name: "Vạch Ra Hải Trình Tiếp Theo"
 nomads.2100.desc: "Không còn di chỉ linh thiêng nào để khám phá nữa.\n\nHải đồ tổ tiên đã dẫn đường cho chúng ta vượt qua những khoảng cách xa xôi, giờ đây rốt cuộc chúng ta đã bắt kịp quá khứ. Nhưng câu hỏi vẫn còn đó: Thứ chúng ta khám phá ra có phải là sự thật không? Hay lâu nay chúng ta chỉ đi theo một lời dối trá?\n\nCon đường này luôn là một phần không thể thiếu trong văn hóa của chúng ta. Nó do tiền nhân định đoạt. Nhưng sau khi tận mắt chứng kiến những gì họ từng thấy năm xưa, cùng với lợi thế của khoa học hiện đại, liệu những kinh văn đó có còn chân thực? Hay xã hội của chúng ta định sẵn sẽ bước lên một con đường hoàn toàn mới, ít phần sùng đạo hơn?"
 nomads.2100.a: "Chúng ta tuyệt đối không được đổi hướng. Giữ vững lòng trung tín!"
 nomads.2100.b: "Giờ đây dĩ nhiên do chính chúng ta chọn lựa mình sẽ trở thành người như thế nào."
 nomads.2100.c: "Mọi thứ đều mơ hồ. Chúng ta đã lạc lối."

 nomads.2105.name: "Bảo Vệ Các Giá Trị Truyền Thống"
 nomads.2105.desc: "Luôn có những kẻ ôm dã tâm xấu xa; chúng muốn lịch sử của chúng ta bị lãng quên, muốn truyền thống của chúng ta phai nhạt theo thời gian. Chúng ta tuyệt đối không thể để chúng chia rẽ mình. Chúng ta phải bảo vệ lối sống truyền thống của mình. Nếu chúng ta lắng nghe sự dẫn dắt của thần linh, Người sẽ tiếp tục chỉ lối, nhưng chúng ta phải mở rộng lòng mình trước sự ảnh hưởng của Người."
 nomads.2105.a: "Đây chính là bản sắc của chúng ta."
 nomads.2105.b: "Tổ tiên của chúng ta chắc chắn cho phép sự đổi mới."

 nomads.2115.name: "Bên Bờ Vực Hòa Hợp"
 nomads.2115.desc: "Sự bất đồng nơi cốt lõi xã hội của chúng ta đang ngày càng sâu sắc. Những người cấp tiến bị ép buộc phải chấp nhận thay đổi, trong khi những người theo chủ nghĩa truyền thống lại lo sợ bất cứ điều gì khác biệt.\n\nLúc này chúng ta phải tự hỏi: Liệu dân tộc của chúng ta có thể đoàn kết lại một lần nữa để cùng chung sống hòa hợp? Bằng không hậu quả có thể khôn lường.\n\nMọi người đều nên có quyền tự do thực hành đức tin theo cách riêng của mình, nhưng nếu cuộc đấu tranh bè phái dẫn đến nội chiến, thì chúng ta phải tuyệt đối tin tưởng vào niềm tin của chính mình."
 nomads.2115.a: "Chúng ta phải thúc đẩy sự thấu hiểu."
 nomads.2115.b: "Cùng tồn tại là điều tuyệt đối không thể!"

 nomads.2120.name: "Chúng Ta Tồn Tại Nhờ Truyền Thống"
 nomads.2120.desc: "Không có quá khứ, chúng ta chẳng là gì cả. Không có \"Đại Đạo\", chúng ta không có nơi nào để đi. Đôi khi, thử thách đối với đức tin chính là thứ chúng ta cần, nó khích lệ chúng ta, nhắc nhở chúng ta về những hiểm nguy phải đối mặt khi từ bỏ con đường của mình.\n\nChúng ta đang bước ra khỏi giai đoạn tăm tối đầy rẫy thù trong giặc ngoài. Chúng ta từng suýt tàn sát lẫn nhau vì niềm tin của mình, trong khi thực tế điều duy nhất cứu rỗi tất cả chúng ta chính là sự đoàn kết.\n\nHãy để chúng ta không bao giờ quay lưng lại với nhau nữa. Chúng ta phải hoàn toàn dốc lòng cho cùng một \"Đại Đạo\"."
 nomads.2120.a: "Chúng ta sẽ dốc toàn lực!"
 nomads.2120.b: "Chỉ có thể là sự cân bằng."

 nomads.2125.name: "Tương Lai Tươi Sáng Vô Cùng"
 nomads.2125.desc: "Quá khứ kéo lùi chúng ta, cản trở sự tiến hóa của chúng ta. Rút ra bài học từ lịch sử là một chuyện, nhưng giậm chân tại chỗ và vĩnh viễn không thể vượt qua lịch sử lại là sự ngu xuẩn.\n\nChúng ta không việc gì phải lãng phí tiềm năng tự khám phá bản thân. Giờ đây khi đã rũ bỏ xiềng xích của ngày hôm qua, chúng ta có thể tiến bước về phía trước với lòng nhiệt huyết tràn trề.\n\nChúng ta không còn bị trói buộc bởi những tổ tiên lạc hậu về công nghệ nữa. Những mảnh vỡ huyền bí do chư thần để lại cũng không thể quyết định con đường của chúng ta nữa. Chúng ta tự chọn \"Đại Đạo\" của riêng mình, không điều gì có thể ngăn cản chúng ta."
 nomads.2125.a: "\"Đại Đạo\" này mang lại sự sáng tỏ cho chúng ta."
 nomads.2125.b: "Chân lý duy nhất chính là con đường chiến tranh..."

 nomads.2130.name: "Khai Sáng Hân Hoan"
 nomads.2130.desc: "Chúng ta bước theo \"Đại Đạo\" này với niềm tin cùng hy vọng, và đã đắc đạo.\n\nGiờ đây, chúng ta hiểu rằng việc tái thánh hóa tất cả các thánh địa đã biết và mở rộng con đường này để mang lại lợi ích cho vô số chủng loài cùng các nền văn minh chính là nghĩa vụ thiêng liêng của chúng ta.\n\nLòng nhân từ của chúng ta sẽ lan tỏa giữa các vì sao, kết nối với mọi linh hồn sẵn lòng đón nhận."
 nomads.2130.a: "Niềm vui tột bậc!"

 nomads.2135.name: "Trung Đạo"
 nomads.2135.desc: "Điều này chưa bao giờ là về bản thân \"Con Đường\". Điều quan trọng nhất chính là hành trình mà chúng ta đã cùng nhau trải qua. Đồng bào chúng ta đã tuân theo truyền thống này suốt hàng trăm năm, thế nhưng trong bất kỳ văn tịch lịch sử nào, chúng ta chưa từng tìm thấy \"mục đích\" thực sự của con đường này. Có lẽ nó đã sớm chìm vào dòng sông thời gian.\n\nChúng ta sẽ khắc ghi những câu chuyện do tiền nhân truyền lại cùng những chuyến hành hương họ từng thực hiện, nhưng chúng ta không còn cần phải nối gót họ nữa. So với họ, chúng ta có nhận thức sâu sắc hơn nhiều về sự sống, dải ngân hà và chính bản thân mình. Chân lý mà họ kiên trì nắm giữ không còn phù hợp với chúng ta nữa. Chúng ta sẽ mở ra con đường của riêng mình."
 nomads.2135.a: "Đại đạo chí giản, bản tính tự đủ đầy."

 nomads.2140.name: "Đón Nhận Hỗn Loạn"
 nomads.2140.desc: "Giờ đây mọi thứ đã rõ ràng. Các di chỉ linh thiêng của tổ tiên chúng ta là những ngọn hải đăng của hy vọng và đức tin ngọt ngào một cách bệnh hoạn. Những kẻ đến trước chúng ta không hề có lòng hổ thẹn, cũng chẳng bận tâm xem người khác có biết hay không.\n\nDanh tiếng của chúng ta đã bị coi thường và vấy bẩn. Chúng ta có năng lực thánh hóa những địa điểm mới để truyền tải sứ mệnh tâm linh đã được đổi mới của mình.\n\nThần linh rất phức tạp và thường bị hiểu lầm. Thông qua \"Đại Đạo\" này, Người dạy chúng ta rằng xung đột là một đặc tính tự nhiên trong xã hội của chúng ta. Những thử thách mà chúng ta vượt qua khiến chúng ta mạnh mẽ hơn. Giờ đây chúng ta sẽ phô diễn sức mạnh của mình cho toàn thiên hà thấy!"
 nomads.2140.a: "Đây chính là cuộc thánh chiến của chúng ta."

