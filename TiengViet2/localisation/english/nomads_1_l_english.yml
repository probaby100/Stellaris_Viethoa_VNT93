 tech_arkship_tier_2: "Kỹ Thuật Tàu Ark"
 tech_arkship_tier_2_desc: "Thiết kế cấu trúc tối ưu và hệ thống động cơ cải tiến đã tạo nên thế hệ tàu Ark mới: chúng chở nhiều thứ về chúng ta hơn, tiến đến những phương trời xa xôi mà chúng ta chưa từng đặt chân tới."
