 arkship_exodus_jump: "Bước Nhảy Đại Di Cư"
 arkship_exodus_jump_desc: "§LMột bước nhảy đủ sức đẩy con tàu Ark vượt qua những khoảng cách thiên hà bao la. Sóng xung kích tạo ra là không phân biệt, để lại dấu ấn ở cả hệ sao xuất phát và hệ sao đích đến.§!"
 arkship_exodus_jump_system_effect: "$SYSTEM_EFFECTS_HEADER$$TABBED_NEW_LINE$— Tất cả §Hhạm đội§!, §Htrạm không gian§! và §Hcăn cứ sao§! chịu $@arkship_exodus_jump_cost|0R$ §Hsát thương§!.$TABBED_NEW_LINE$— Tất cả §Hthuộc địa§! chịu §R33%§! §Hđộ hoang tàn§!.$TABBED_NEW_LINE$— Hiệu ứng này tác động lên cả hệ sao §Hđích đến§! và hệ sao §Hnguồn gốc§!."
 arkship_exodus_jump_fleet_effect: "$FLEET_EFFECTS_HEADER$$TABBED_NEW_LINE$— Tất cả các hạm đội chịu sự kiểm soát trực tiếp sẽ bị bắn văng tới một hệ sao ngẫu nhiên trong bán kính phân tán dự kiến.$TABBED_NEW_LINE$— Các hạm đội được phóng theo cách này nhận được mức tăng [GetQuanticAmbushBonus] §Htốc độ bắn§!, kéo dài £time£ §H120 ngày§!."
