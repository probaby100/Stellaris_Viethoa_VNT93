 d_deep_sleep_cryo_pods: "Khoang ngủ đông phế thải"
 d_deep_sleep_cryo_pods_desc: "Nhiều khoang chứa đông lạnh dư thừa nằm rải rác khắp tàu Arkship. Vài khoang trong số đó có thể vẫn còn những hành khách bị lãng quên."
 nomad_economy_progress: "$TRIGGER_FAIL$Yêu cầu §Y$situation_nomad_economy$§! ở giai đoạn §Y$situation_nomad_economy_stage_3_thriving$§!"
 d_deep_sleep_cryo_pods_renewed: "Khoang ngủ đông tân trang"
 d_deep_sleep_cryo_pods_renewed_desc: "Các khoang đông lạnh này đã được tân trang; thay vì hoạt động quá tải, giờ đây chúng phục vụ những bộ óc sáng giá nhất nhằm kéo dài thời gian làm việc của họ."
 concept_deep_sleep_cryo_pods_renewed: "$d_deep_sleep_cryo_pods_renewed$"
 concept_deep_sleep_cryo_pods_renewed_desc: "$t$- Thêm §R+100§! ['concept_job_deep_sleep', $mod_job_ark_deep_sleep_add$]\n$t$- $mod_planet_pops_upkeep_mult$: §G-5%§!"
 planet_deep_sleep: "Giấc ngủ sâu"
 decision_deep_sleep: "Chuẩn bị ngủ đông sâu"
 decision_deep_sleep_desc: "Chúng ta đưa những thành viên làm việc kém nhiệt tình vào giấc ngủ sâu khoan khoái, đồng thời khuyến khích những người may mắn không bị đóng băng hãy sống cần kiệm và làm việc hết mình."
 decision_deep_sleep_tt: "Cần 1000 $job_civilian_plural$ hoặc $job_maintenance_drone_plural$"
