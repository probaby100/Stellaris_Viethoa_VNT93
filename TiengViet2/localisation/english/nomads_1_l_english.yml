 arkship_lithoid_consume_world: "Thôn Tính Thiên Địa"
 arkship_lithoid_consume_world_desc: "§LTàu Ark phun ra bầy đàn của chúng ta, nuốt chửng một thế giới có thể sinh sống, nghiền nát nó thành khoáng chất nguyên thủy và vật chất hữu cơ trong suốt nhiều tháng.§!"
 arkship_lithoid_consume_world_effect: "$PLANET_EFFECTS_HEADER$$TABBED_NEW_LINE$— Hành tinh bị nuốt chửng dần dần, sản xuất §H$minerals_with_icon$§! và §H$food_with_icon$§!.$TABBED_NEW_LINE$— Mục tiêu bị phá hủy khi quá trình thôn tính hoàn tất."
