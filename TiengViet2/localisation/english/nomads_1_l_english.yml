# Origin Start Screen
 START_SCREEN_FOREVER_CRUISE_REGULAR: "Toàn thể hành khách và thủy thủ đoàn xin lưu ý: Con tàu [capital_scope.GetName] đang làm nên lịch sử, và tất cả quý vị đều đang tham gia vào sự kiện này!\n\nĐộng cơ siêu không gian — thứ từng thu hút muôn vàn chú ý, trải qua nhiều lần trì hoãn và thậm chí đôi khi bị hoài nghi — nay đã chính thức đi vào hoạt động! Trong nhiều thế kỷ qua, chúng ta đã thong dong du hành trên những hải phận quen thuộc, sinh sống trong một thế giới trôi nổi tích hợp cả giải trí, nhiệm vụ và đời sống thường nhật. Nhưng giờ đây, chúng ta sẵn sàng mang đến cho hành khách những trải nghiệm phi thường vượt xa bất kỳ tuyến hành trình vòng lặp nào trước đây.\n\nThám hiểm, khám phá, và có lẽ là một chút mạo hiểm... tất cả đã chính thức quay trở lại lịch trình của chúng ta! Vì vậy, kính mời quý hành khách thắt dây an toàn: chương tiếp theo trong hải trình của chúng ta chắc chắn sẽ vô cùng đáng nhớ.\n\nCác giao thức và lịch trình chuẩn bị cập nhật sẽ được gửi đến tất cả các tầng boong."
 START_SCREEN_FOREVER_CRUISE_MACHINE: "Kính gửi toàn thể hành khách: Tôi là hệ thống điều phối hải trình của quý vị.\n\nCon tàu [capital_scope.GetName] đang làm nên lịch sử! Do vài lõi lưu trữ của chúng tôi đã bị đem đi chơi bi đá trên băng, nguyên nhân trì hoãn của động cơ siêu không gian nay đã không còn cách nào tra cứu — nhưng hiện tại, nó đã vận hành đầy đủ.\n\nSuốt nhiều năm tháng dài đằng đẵng, chúng ta luôn tuần du theo những hải trình quen thuộc: cùng những thiên thể đó, cùng các trạm tiếp vận chân đó, cùng những giờ ăn đó. Trong khi vẫn duy trì ổn định \"tỷ lệ yêu cầu của hành khách mỗi giây\", chúng tôi nay chính thức mở rộng lịch trình của quý vị, bổ sung thêm việc thám hiểm, khám phá cùng những hiểm nguy vừa phải đã qua tính toán chuẩn xác.\n\nXin hãy thưởng thức trọn vẹn cảnh đẹp, tuân thủ mọi lưu ý an toàn, và chứng kiến các drone của chúng tôi biến điều bình thường thành kỳ tích một cách dễ dàng như thế nào. Chương tiếp theo trong chuyến đi của chúng ta sẽ là... một đời khó quên!"
 START_SCREEN_FOREVER_CRUISE_HIVE: "Kính gửi toàn thể hành khách: Một bước chuyển mình vĩ đại trên [capital_scope.GetName] sắp sửa bắt đầu.\n\nĐộng cơ siêu không gian — khái niệm từng xa vời trong ký ức chung, nhiều lần bị gác lại và đôi khi bị nghi ngờ — nay đã hoàn toàn thức tỉnh. Suốt hàng trăm năm cùng nhau vượt qua không gian quen thuộc, phi thuyền của chúng ta luôn là một thế giới ngập tràn sức sống kết hợp giữa nghỉ ngơi, lao động và sự hòa hợp. Giờ đây, một con đường hoàn toàn mới đã mở ra, chúng tôi sẽ mang lại những trải nghiệm phong phú hơn bao giờ hết.\n\nHải trình của chúng ta hiện đã mở rộng từ lộ trình cố định quen thuộc sang các hệ sao chưa từng được khám phá. Cùng kề vai sát cánh, chúng ta sẽ trải nghiệm sự khám phá, mạo hiểm, và cả một chút hiểm nguy đủ để khiến chuyến hành trình trở nên thú vị.\n\nNếu quý vị có bất kỳ thắc mắc nào, bất kỳ thành viên thủy thủ đoàn nào cũng có thể giải đáp cho quý vị."

