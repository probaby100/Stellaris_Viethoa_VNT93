 wg_expel_nomads_effects: "Tất cả các $waystation_plural$ §Y§! thuộc về §Y[From.GetName]§! nằm trong lãnh thổ của §Y[Root.GetName]§! (và đồng minh) đều bị phá hủy hoàn toàn, tịch thu toàn bộ $waystation_stockpile_plural$ §Y§! bên trong.\nTrong thời gian hiệp định đình chiến, §Y[From.GetName]§! bị cấm xây dựng $waystation_plural$ §Y§! trong lãnh thổ của §Y[Root.GetName]§! (và đồng minh).\nMọi con tàu thuộc sở hữu của §Y[From.GetName]§! đều sẽ bị cưỡng chế trục xuất khỏi §Y[Root.GetName]§!.\n§Y[From.GetName]§! trong §Y10 năm§! tiếp theo sẽ cần phải có được quyền qua lại biên giới của §Y[Root.GetName]§! (và đồng minh) mới có thể tiến vào biên giới của họ."
