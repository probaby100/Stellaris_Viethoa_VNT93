 tech_arkship_construction: "Xây Dựng Tàu Ark"
 tech_arkship_construction_desc: "Xã hội của chúng ta không cần phải bó hẹp trong một mái nhà duy nhất. Với năng lực xây dựng thêm nhiều tàu Ark, mọi hướng chiến lược đều sẽ trở thành một con đường, và mọi con đường đều sẽ thuộc về chúng ta."
