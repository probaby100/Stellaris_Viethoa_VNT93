 # Traits
 trait_photoadaptive: "Thích Ứng Ánh Sáng"
 trait_photoadaptive_desc: "Giống loài này sinh ra sự cộng hưởng với ánh sáng của các vì sao. Khi bọn họ du hành giữa các vì sao, sự thay đổi độ sáng của các vì sao sẽ tái tạo lại tính sinh học của họ một cách vi diệu."
 trait_solar_cells: "Pin Năng Lượng Mặt Trời"
 trait_solar_cells_desc: "Giống loài này đã phát triển ra những loại pin năng lượng mặt trời chuyên dụng, có khả năng hấp thụ các loại bức xạ khác nhau từ các vì sao theo một cách thức vô cùng độc đáo, từ đó mang lại đủ loại hiệu ứng tăng ích thích ứng cho từng loại ngôi sao."
 concept_trait_photoadaptive_stars: "Loại Hình Ngôi Sao"
 concept_trait_photoadaptive_stars_desc: "Có một số giống loài có thể nhận được $worker_and_simple_drone_cat_bonus_workforce_mult$ từ ['concept_star_luminosity'] của ngôi sao.\n\n—$pc_pulsar_plural$ hoặc $pc_neutron_star_plural$: §G+15%§!\n—Ngôi sao $pc_b_star_short$, $pc_a_star_short$ hoặc $pc_f_star_short$: §G+10%§!\n—Ngôi sao $pc_g_star_short$ hoặc $pc_k_star_short$: §G+5%§!\n—$pc_m_star_plural$: §R-5%§!\n—Ngôi sao $pc_t_star_short_plural$, $pc_protostar_plural$ hoặc $pc_black_hole_plural$: §R-15%§!"
 trait_photoadaptive_effects: "$MOD_POP_BONUS_WORKFORCE_MULT$ tạo ra từ ['concept_trait_photoadaptive_stars']: $TABBED_NEW_LINE$$t$—$pop_cat_worker_plural$ & $pop_cat_simple_drone_plural$: Thấp nhất: §R-15%§!, cao nhất: §G+15%§!$TABBED_NEW_LINE$$t$§Y$pc_black_hole_plural$§!, việc làm nhà vật lý: §G+15%§!$TABBED_NEW_LINE$$t$—§Y$pc_m_star_plural$§!, việc làm kỹ sư: §G+15%§!"

 trait_recursive_learners: "Người Học Hỏi Đệ Quy"
 trait_recursive_learners_desc: "Giống loài này được sinh ra trên $arkship_cap$, không ngừng tinh giản kiến thức trong vòng luân hồi của các thế hệ, mỗi một thế hệ đều sẽ tiến hành cải tiến dựa trên nền tảng của thế hệ trước, nhằm thỏa mãn những nhu cầu độc đáo của con tàu bọn họ."
 trait_structural_awareness: "Nhận Thức Cấu Trúc"
 trait_structural_awareness_desc: "Những cỗ máy này được thiết kế dành riêng cho việc sinh sống bên trong $arkship_cap$, liên tục theo dõi áp lực bên trong, lưu lượng cũng như các hoạt động thường quy của nó. Những bản thiết kế Tàu Ark khác nhau sẽ tạo ra những mô thức khác nhau, và bọn chúng sẽ không ngừng lặp đi lặp lại việc tối ưu hóa hành vi của bản thân, nhằm thích ứng với con tàu mà bọn chúng đang cư ngụ."
 trait_recursive_learners_effects: "Căn cứ vào loại hình của $arkship_cap$, mỗi £district£ §Y$DISTRICT$§! sẽ tạo ra §G+1.25%§!$MOD_POP_BONUS_WORKFORCE_MULT$ (Tối đa §G+25%§!)$TABBED_NEW_LINE$—§Y$civilian_arkship_name_plural$: §!['concept_planet_metallurgists'], ['concept_planet_artisans'] cùng với $job_ark_harvester_plural$$BONUS_WORKFORCE_FOR$$TABBED_NEW_LINE$—§Y$science_arkship_name_plural$: §!['concept_planet_researchers']$BONUS_WORKFORCE_FOR$$TABBED_NEW_LINE$—§Y$military_arkship_name_plural$: §!['concept_planet_engineers'] và ['concept_planet_soldiers']$BONUS_WORKFORCE_FOR$"

 trait_interconnected: "Người Thuyền Hợp Nhất"
 trait_interconnected_desc: "Sau khi trải qua vài thế hệ, ranh giới giữa $arkship_cap$ và các cư dân đã không còn rõ ràng nữa. Con tàu này đã trở thành sự vươn dài từ các giác quan và tứ chi của họ; còn họ thì lại trở thành những bộ phận mang tính chức năng bên trong thân tàu."
 trait_interconnected_effects: "Trên $arkship_cap_plural$: $TABBED_NEW_LINE$$t$—$mod_planet_pops_robotics_upkeep_mult$: Giới hạn dưới: §G-15%§!, Giới hạn trên: §R+5%§!$TABBED_NEW_LINE$$t$—$MOD_POP_AMENITIES_USAGE_MULT$: Giới hạn dưới: §G-10%§!, Giới hạn trên: §Y0%§!$TABBED_NEW_LINE$—Hiệu ứng này tỷ lệ thuận với số lượng £pop£ §HDân Cư§! sở hữu đặc tính này ở bên trong thuộc địa."

 trait_reavers: "Kẻ Cướp Đoạt"
 trait_reavers_desc: "Quá trình tiến hóa của giống loài này được đắp nặn nên bởi sự xảo trá chứ không phải là sự đoàn kết. Mỗi một lần tương tác đều là một cuộc đọ sức về mặt ý chí, và quyền sinh tồn thì chỉ thuộc về những cá thể tàn nhẫn nhất."
 trait_reavers_effects: "£commander£§Y$commander_plural$§! không thuộc §Y$ethic_xenophile$§! hoặc §Y$ethic_pacifist$§! khi khởi đầu sẽ sở hữu đặc tính ['leader_trait:leader_trait_plunderer']"
 leader_trait_plunderer: "Kẻ Cướp Đoạt"
 leader_trait_plunderer_desc: "Hoàn toàn không cần thiết phải lãng phí xác tàu của phe địch một cách vô ích. Một vị tư lệnh hạm đội túc trí đa mưu có khả năng biến chúng thành những báu vật một cách vô cùng chuẩn xác."
 leader_trait_plunderer_2: "$leader_trait_plunderer$ II"
 leader_trait_plunderer_2_desc: "$leader_trait_plunderer_desc$"
 leader_trait_plunderer_effects: "$FLEET_EFFECTS_TXT$:\n$t$$EVERY_ENEMY_SHIP_DESTROYED_TXT$:\n$tt$$r_consumer_goods$ hoặc $r_trade$: §G+$@trait_plunderer_amt|0$§!$PER_5_NAVAL_CAP_TXT$"
 leader_trait_plunderer_2_effects: "$FLEET_EFFECTS_TXT$:\n$t$$EVERY_ENEMY_SHIP_DESTROYED_TXT$:\n$tt$$r_consumer_goods$ hoặc $r_trade$: §G+$@trait_plunderer_2_amt|0$§!$PER_5_NAVAL_CAP_TXT$"

 trait_defence_drones: "Đồng Bộ Chiến Đấu"
 trait_defence_drones_desc: "Mỗi một đơn vị đều là một kỹ sư kiêm luôn vai trò của một chiến binh. Trong thời chiến, giao thức đồng bộ của chúng có thể giúp ổn định toàn cục, đồng thời đảm bảo cho các hệ thống trọng yếu nhận được sự sửa chữa và tối ưu hóa."
 trait_defence_drones_effects: "Trong thời gian xảy ra chiến tranh hoặc thiên tai: Mỗi $pop_group_unit$ £pop£§HDân số§! sở hữu đặc tính này sẽ gia tăng cho thuộc địa §G+$@defence_drones_stability$§!£stability£$PLANET_STABILITY_TITLE$, tối đa §G+15§!$TABBED_NEW_LINE$—Hiệu ứng này chỉ ảnh hưởng đến ['concept_artificial_colonies']"

 trait_terraphobic: "Chứng Sợ Hành Tinh"
 trait_terraphobic_desc: "Bởi vì đã thích ứng được với cuộc sống bên trong môi trường nhân tạo, giống loài này cảm thấy vô cùng áp lực đối với môi trường hành tinh. Trọng lực, bầu khí quyển và địa hình sẽ tạo thành những thách thức mang tính liên tục đối với các cơ năng sinh lý mỏng manh yếu ớt của họ."
 trait_terraphobic_effects: "Ở những nơi không phải là ['concept_artificial_colonies']:\n$tt$—$MOD_POP_BONUS_WORKFORCE_MULT$: §R-15%§!\n$tt$—$MOD_POP_AMENITIES_USAGE_MULT$: §R+15%§!"


 opinion_head_of_zarqlan_nomad: "Người Kế Thừa Của Zarqlan"

 effect_random_starbase_in_system: "Căn cứ sao ngẫu nhiên bên trong hệ sao"
 effect_every_starbase_in_system: "Tất cả các căn cứ sao bên trong hệ sao"

 policy_nomad_border_policy: "Chính Sách Biên Giới Du Mục"
 nomad_border_policy_open: "Hợp Pháp"
 nomad_border_policy_open_desc: "Chúng tôi hoan nghênh những người du mục tự do tự tại đi lại bên trong hệ sao của chúng tôi, điều này vô cùng phù hợp với phong tục tập quán của dân tộc bọn họ."
 nomad_border_policy_closed: "Bất Hợp Pháp"
 nomad_border_policy_closed_desc: "Hành vi xâm phạm của dân du mục đối với vùng lãnh thổ thuộc chủ quyền của phe ta sẽ dẫn đến những hậu quả về mặt ngoại giao."
 nomad_border_policy_open_name: "Hợp Pháp"
 nomad_border_policy_closed_name: "Bất Hợp Pháp"
 policy_nomad_border_policy_desc: "Chính sách của chúng tôi về việc liệu những người dân du mục không gian có được phép đi ngang qua không vực của phe ta hay không"

 policy_nomad_deterrence: "Sự Răn Đe Đối Với Du Mục"
 policy_nomad_deterrence_desc: "Lực lượng của phe ta sẽ đối đãi như thế nào đối với những Tàu Ark du mục bị vô hiệu hóa nhưng vẫn còn nguyên vẹn trong trận chiến."
 nomad_deterrence_do_no_harm: "Không Gây Tổn Thương"
 nomad_deterrence_do_no_harm_desc: "Chúng ta đã tha cho chiếc Tàu Ark mất đi khả năng hành động đó, không hề gây ra bất kỳ tổn hại nào cho phi hành đoàn hay thân tàu của nó. Hành động nhân từ này không hề khiến cho chúng ta phải trả bất cứ một cái giá nào, ngược lại còn có khả năng sẽ mang lại thiện ý cho chúng ta."
 nomad_deterrence_do_no_harm_name: "Không Gây Tổn Thương"
 arkship_raid_do_no_harm_name: "Không Gây Tổn Thương"
 nomad_deterrence_relocate_pops: "Trưng Thu Nhân Khẩu"
 nomad_deterrence_relocate_pops_desc: "Một phần tư dân số của Tàu Ark đã được mang ra khỏi đống đổ nát, đồng thời được tái định cư tại thủ đô của chúng ta, sinh sống và làm việc dưới sự cai trị của chúng ta."
 nomad_deterrence_relocate_pops_name: "Trưng Thu Nhân Khẩu"
 arkship_raid_relocate_pops_name: "Trưng Thu Nhân Khẩu"
 nomad_deterrence_purge_pops: "Xử Tử Nhân Khẩu"
 nomad_deterrence_purge_pops_desc: "Một phần tư dân số trên Tàu Ark đã bị xử tử ngay trong đống đổ nát, qua đó nhằm đưa ra lời cảnh cáo đối với những kẻ ngoại lai to gan dám trôi dạt vào không vực của phe ta."
 nomad_deterrence_purge_pops_name: "Xử Tử Nhân Khẩu"
