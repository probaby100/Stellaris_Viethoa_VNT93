 sm_waystation_refinery_module_desc: "Quá trình chính là đích đến. Tại đây, các vật liệu hiếm và không ổn định được tinh chế thành tài nguyên chiến lược có thể sử dụng, đảm bảo vững chắc cho chặng tiếp theo trong hành trình của chúng ta.\n"
