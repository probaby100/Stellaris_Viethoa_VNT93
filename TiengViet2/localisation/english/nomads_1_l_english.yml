 situation_passenger_satisfaction_stage_planetfall_desc: "§LHành khách từ chối tiếp tục hành trình và yêu cầu định cư trên một hành tinh nào đó.§!"
 situation_passenger_satisfaction_stage_incensed_desc: "§LHành khách cực kỳ bất mãn với chuyến tuần du, không thể ngó lơ được nữa.§!"
 situation_passenger_satisfaction_stage_bored_desc: "§LNhu cầu của hành khách đang ảnh hưởng đến khả năng phối hợp công việc của thủy thủ đoàn.§!"
 situation_passenger_satisfaction_stage_steady_desc: "§LHành khách rất hài lòng, các nhân viên tàu đã hoàn thành mọi nhiệm vụ đúng hạn.§!"
 situation_passenger_satisfaction_stage_overworked_desc: "§LThủy thủ đoàn đang dốc hết sức để đáp ứng những yêu cầu thất thường của hành khách.§!"
 situation_passenger_satisfaction_stage_stressed_desc: "§LThủy thủ đoàn đã đến giới hạn, đang âm thầm mưu tính chấm dứt những đòi hỏi vô tận của hành khách.§!"
 situation_passenger_satisfaction_stage_mutiny_desc: "§LThủy thủ đoàn đã đạt đến giới hạn nhẫn nhịn và đang phát động binh biến.§!"

