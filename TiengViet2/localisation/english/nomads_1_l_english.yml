# Forever Cruise Districts and Buildings
 building_passenger_dorms: "Dinh thự du khách"
 building_passenger_dorms_desc: "Những du khách xứng tầm nhất sẽ được phân bổ các dinh thự sang trọng tọa lạc giữa những cảnh quan nhân tạo tuyệt mỹ."

 building_passenger_paradise: "$building_paradise_dome$"
 building_passenger_paradise_desc: "Một mái vòm định cư hoàn toàn khép kín sở hữu hệ sinh thái tự cung tự cấp, thiên đường riêng tư dành cho những ai nắm giữ tấm vé đặc quyền."

 building_forever_cruise_passenger_unity: "Đại sảnh du hành sao"
 building_forever_cruise_passenger_unity_plural: "Đại sảnh du hành sao"
 building_forever_cruise_passenger_unity_desc: "Từng cột mốc của chuyến đi đều từng được ăn mừng tại đây, khiến du khách vô cùng phấn khích nhưng cũng làm các kho tiếp tế cạn kiệt sạch trơn."
 building_forever_cruise_passenger_unity_situation_effect_desc: "Khi hành trình êm xuôi hoặc du khách cảm thấy buồn chán, mỗi công trình làm chậm §G5%§! tiến độ của tình thế §RTàn lụi giữa ngàn sao§! (tối đa §G50%§!)."
 building_forever_cruise_passenger_unity_situation_slowdown: "$building_forever_cruise_passenger_unity_plural$"
 building_forever_cruise_passenger_research: "Phòng thí nghiệm tăng cường giác quan"
 building_forever_cruise_passenger_research_desc: "Những khoang tàu sang trọng sau khi cải tạo đã trở thành lớp học và phòng thí nghiệm, biến các hành khách thành những cộng sự tích cực trong nghiên cứu khoa học."
 building_forever_cruise_passenger_consumer_goods: "Thiết bị kiến tạo lạc thú"
 building_forever_cruise_passenger_consumer_goods_desc: "Một tổ hợp khổng lồ biến rác thải thành những điều kỳ diệu, trong khi hành khách chẳng hề hay biết gì về điều đó."

 building_forever_cruise_crew_resources: "Xưởng dịch vụ"
 building_forever_cruise_crew_resources_desc: "Xưởng làm việc giúp tinh giản quy trình sản xuất thực phẩm và năng lượng thường nhật."
 building_forever_cruise_crew_industry: "Trung tâm điều phối thuyền viên"
 building_forever_cruise_crew_industry_plural: "Trung tâm điều phối thuyền viên"
 building_forever_cruise_crew_industry_desc: "Dưới sự giám sát và điều phối, lịch trình được đồng bộ, quy trình làm việc trở nên chặt chẽ hơn và sản lượng nhờ đó cũng tăng lên."
 building_forever_cruise_crew_industry_situation_effect_desc: "Khi hành trình êm xuôi hoặc thuyền viên chịu nhiều áp lực, mỗi công trình làm chậm §G5%§! tiến độ của tình thế §RBinh biến§! (tối đa §G50%§!)."
 building_forever_cruise_crew_industry_situation_slowdown: "$building_forever_cruise_crew_industry_plural$"
 building_forever_cruise_crew_service: "Xưởng phim toàn ký"
 building_forever_cruise_crew_service_desc: "Những bối cảnh và phim trường vô tận, nơi ê-kíp sản xuất không ngừng thêu dệt nên những ảo tưởng đáp ứng mọi mong muốn của hành khách."

 zone_ark_forever_cruise_city_crew: "Boong sản xuất"
 zone_ark_forever_cruise_city_crew_desc: "Đằng sau những đại sảnh lộng lẫy, tầng boong này là nơi giữ cho mọi thứ vận hành trơn tru."
 zone_ark_forever_cruise_city_passenger: "Boong ngắm cảnh"
 zone_ark_forever_cruise_city_passenger_desc: "Khu sinh hoạt ngập tràn kỳ quan, biến sự buồn tẻ thành cảnh tượng tráng lệ."
 zone_ark_forever_cruise_city_mixed: "Boong đa năng"
 zone_ark_forever_cruise_city_mixed_desc: "Tầng boong kết hợp hài hòa, vừa mang đến trải nghiệm xa hoa, vừa đáp ứng các nhu cầu thiết yếu."

 district_ark_forever_cruise: "Khu dịch vụ"
 district_ark_forever_cruise_plural: "Khu dịch vụ"
 district_ark_forever_cruise_desc: "Bên ngoài xa hoa, bên trong tất bật."
 district_ark_forever_cruise_name: "Độ hài lòng của du khách"
 district_ark_forever_cruise_flavor_desc: "$district_ark_forever_cruise_desc$"
 zone_ark_forever_cruise_passenger: "Trung Tâm Giải Trí"
 zone_ark_forever_cruise_passenger_desc: "Một sân chơi lấp lánh ánh đèn với các sòng bạc, nhà hát cùng vô số trò tiêu khiển bất tận."
 zone_ark_forever_cruise_crew: "Trung Tâm Vận Hành"
 zone_ark_forever_cruise_crew_desc: "Công cụ sẵn sàng, kế hoạch rõ ràng, đội ngũ tập trung cao độ."

 zone_ark_forever_cruise_engineering: "Tổ Hợp Tạo Tác"
 zone_ark_forever_cruise_engineering_desc: "Các máy lắp ráp phân tử hoạt động rù rì bên cạnh những mẫu thử nghiệm chạm khắc thủ công. Hành khách gọi đó là sở thích; thủy thủ đoàn gọi đó là nguồn dữ liệu."
