 situation_passenger_satisfaction_balanced_approach_tt: "Hiệu ứng tình thế của Thủy thủ đoàn: §YKhông đổi§!\nHiệu ứng tình thế của Hành khách: §YKhông đổi§!"
 situation_passenger_satisfaction_passenger: "Lễ Hội Trên Boong"
 situation_passenger_satisfaction_passenger_desc: "§LThủy thủ đoàn dùng các buổi vũ hội hóa trang và âm nhạc để phân tán sự chú ý của hành khách, khiến họ hầu như không còn thời gian để làm việc gì nghiêm túc.§!"
