 concept_arkship_harvest_resources_planet_resources: "Tài Nguyên Hành Tinh"
 concept_arkship_harvest_resources_planet_resources_desc: "Thu hoạch được nhiều tài nguyên hơn dựa trên £planet£ §HPhân loại hành tinh§! mục tiêu, và tỷ lệ thuận với tổng ['concept_arkship_harvestable_resources', mỏ quặng có thể thu hoạch].\n\nMục tiêu chưa khảo sát hoặc không có bất kỳ mỏ quặng nào sẽ chỉ mang lại lợi ích tối thiểu.$DOUBLE_NEW_LINE$$pc_ice_asteroid$: $TABBED_NEW_LINE$— $energy_with_icon$, $exotic_gases_with_icon$$NEW_LINE$$pc_gas_giant$, $pc_toxic$: $TABBED_NEW_LINE$— $exotic_gases_with_icon$$NEW_LINE$$pc_broken$, $pc_shattered$: $TABBED_NEW_LINE$— $minerals_with_icon$, $alloys_with_icon$$NEW_LINE$$pc_barren$: $TABBED_NEW_LINE$— $minerals_with_icon$$NEW_LINE$$pc_asteroid$: $TABBED_NEW_LINE$— $minerals_with_icon$, $volatile_motes_with_icon$$NEW_LINE$$pc_rare_crystal_asteroid$, $pc_frozen$: $TABBED_NEW_LINE$— $rare_crystals_with_icon$$NEW_LINE$$pc_molten$: $TABBED_NEW_LINE$— $volatile_motes_with_icon$"

 concept_arkship_lithoid_consume_world: "Tàu Ark: Thôn Tính Thiên Địa"
 concept_arkship_lithoid_consume_world_desc: "Có thể hạ lệnh cho tàu Ark Thể Đá quay quanh quỹ đạo hành tinh, và triển khai bầy đàn Thể Đá để nuốt chửng hành tinh đó.$NEW_LINE$Một khi bắt đầu, sẽ có một §HTình thế§! theo dõi tiến độ thôn tính, và tàu Ark sẽ bị khóa trên quỹ đạo cho đến khi quá trình hoàn tất.$NEW_LINE$Nếu tàu Ark rời quỹ đạo, sẽ có thời gian ân hạn §Y180 ngày§! cho phép nó quay trở lại. Nếu không kịp quay lại, việc thôn tính sẽ bị hủy bỏ.$DOUBLE_NEW_LINE$Khi ở trên quỹ đạo:$TABBED_NEW_LINE$— Định kỳ chiết xuất £minerals£ §YKhoáng sản§!, £food£ §YLương thực§! và £pop£ §YDân số§!$NEW_LINE$Sau khi hoàn tất:$TABBED_NEW_LINE$— Hành tinh đó sẽ biến thành §YHành tinh vỡ vụn§!"

 concept_arkship_nanotech_consume_world: "Tàu Ark: Đồng Hóa Hành Tinh"
 concept_arkship_nanotech_consume_world_desc: "Tàu Ark Công Nghệ Nano có thể nhận lệnh quay quanh hành tinh và dùng máy móc nano để đồng hóa nó.$NEW_LINE$Một khi khởi động, sẽ xuất hiện một §HTình thế§! theo dõi tiến độ đồng hóa, và tàu Ark sẽ bị khóa trên quỹ đạo cho đến khi quá trình hoàn tất.$NEW_LINE$Nếu tàu Ark rời khỏi quỹ đạo, sẽ có thời gian ân hạn §Y180 ngày§! cho phép nó quay trở lại. Nếu không kịp quay lại, quá trình này sẽ bị hủy bỏ.$DOUBLE_NEW_LINE$Khi ở trên quỹ đạo:$TABBED_NEW_LINE$— Định kỳ chiết xuất £nanites£ §YNanobot§!$NEW_LINE$Sau khi hoàn thành:$TABBED_NEW_LINE$— Hành tinh đó sẽ biến thành một hành tinh nano không thể sinh sống"

