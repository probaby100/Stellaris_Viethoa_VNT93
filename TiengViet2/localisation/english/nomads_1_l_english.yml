 sm_waystation_trade_module_desc: "Những đầu mối nhộn nhịp này thúc đẩy sự giao lưu giữa các hạm đội qua lại và các đế quốc láng giềng. Thương mại lưu chuyển trên tuyến đường của chúng ta, để lại lợi nhuận dồi dào ở bất cứ nơi nào nó đi qua.\n"
