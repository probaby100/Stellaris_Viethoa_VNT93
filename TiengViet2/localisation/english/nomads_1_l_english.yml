 sm_waystation_hydroponics_module_desc: "Các khoang canh tác chuyên dụng trên trạm tiếp vận nuôi trồng cây lương thực trong môi trường kiểm soát, đảm bảo nguồn tiếp tế ổn định cho các hạm đội qua lại.\n"
 sm_waystation_research_module: "Đài Quan Sát Nghiên Cứu"
 sm_waystation_research_module_plural: "Đài Quan Sát Nghiên Cứu"
 sm_waystation_research_module_desc: "Các cơ sở tiên tiến này giám sát hiện tượng địa phương và lưu trữ phát hiện của chúng. Bằng cách đó, tri thức thu thập được tại đây mang ý nghĩa vô giá.\n"
