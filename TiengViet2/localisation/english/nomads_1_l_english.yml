 #######################

 council_agenda_agenda_arkship_engineering_civilian_name: "Phát Triển Tàu Ark"
 council_agenda_agenda_arkship_engineering_civilian_desc: "Tàu Ark của chúng ta được tối ưu hóa cho việc khai thác tài nguyên, nhưng lại thiếu đầu tư vào trạng thái sẵn sàng chiến đấu và năng lực nghiên cứu khoa học. Mở rộng các khả năng của chúng ta là một ưu tiên chiến lược."
 agenda_arkship_engineering_civilian_modifier_tt: "Tốc độ khảo sát của tàu Ark: §G+$@arkship_agenda_mult|0%$§!\nĐộ né tránh của tàu Ark: §G+$@arkship_agenda_static|0$§!"

 council_agenda_agenda_arkship_engineering_science_name: "Phát Triển Tàu Ark"
 council_agenda_agenda_arkship_engineering_science_desc: "Tàu Ark của chúng ta là một nền tảng nghiên cứu xuất sắc, nhưng khi đối mặt với cõi hư không, chỉ dựa vào tài năng khoa học thôi là chưa đủ. Năng lực vận hành lâu dài và hệ thống tác chiến cũng cần được đầu tư tương đương."
 agenda_arkship_engineering_science_modifier_tt: "Tốc độ bay dưới vận tốc ánh sáng của tàu Ark: §G+$@arkship_agenda_mult|0%$§!\nĐộ né tránh của tàu Ark: §G+$@arkship_agenda_static|0$§!"

 council_agenda_agenda_arkship_engineering_military_name: "Phát Triển Tàu Ark"
 council_agenda_agenda_arkship_engineering_military_desc: "Tàu Ark của chúng ta được chế tạo chuyên dụng cho các chiến dịch tác chiến, nhưng lại thiếu đầu tư vào năng lực nghiên cứu và cơ sở hạ tầng hậu cần. Khắc phục sự mất cân bằng này sẽ mở rộng phạm vi hành động của chúng ta."
 agenda_arkship_engineering_military_modifier_tt: "Tốc độ bay dưới vận tốc ánh sáng của tàu Ark: §G+$@arkship_agenda_mult|0%$§!\nTốc độ khảo sát của tàu Ark: §G+$@arkship_agenda_mult|0%$§!"

 council_agenda_agenda_arkship_engineering_mastery_name: "Làm Chủ Tàu Ark"
 council_agenda_agenda_arkship_engineering_mastery_desc: "Kỹ thuật chế tạo tàu Ark thuộc mọi cấu hình đều đã được làm chủ hoàn toàn. Các nền tảng nghiên cứu, chiến hạm và hoạt động vận tải đều sẽ hưởng lợi từ sự tối ưu hóa của nghị trình này."
 agenda_arkship_engineering_mastery_modifier_tt: "Tốc độ khảo sát của tàu Ark: §G+$@arkship_agenda_mult|0%$§!\nTốc độ bay dưới vận tốc ánh sáng của tàu Ark: §G+$@arkship_agenda_mult|0%$§!\nĐộ né tránh của tàu Ark: §G+$@arkship_agenda_static|0$§!"
