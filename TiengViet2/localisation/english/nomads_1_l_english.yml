 TOAST_NANOTECH_CONSUME_WORLD_COMPLETE_TITLE: "Hành Tinh Bị Đồng Hóa"
 TOAST_NANOTECH_CONSUME_WORLD_COMPLETE_DESC: "Bầy máy móc nano của §Y$ARKSHIP$§! đã hoàn toàn đồng hóa §Y$PLANET$§!, biến nó thành một hành tinh nano không thể sinh sống."

 MESSAGE_ARKSHIP_NANOTECH_CONSUME_WORLD_NANITES_TEXT: "Bầy máy móc nano phân rã $PLANET|Y$ đã mang về lượng lớn nanobot mới sản xuất."
 MESSAGE_ARKSHIP_NANOTECH_CONSUME_WORLD_FINAL_TEXT: "Cấu trúc xây dựng cuối cùng trên $PLANET|Y$ đã bị hòa tan, vật chất của nó bị bầy máy móc nano biến đổi hoàn toàn."

 situation_arkship_lithoid_consume_planet: "Thôn Tính [Target.GetName]"
 situation_arkship_lithoid_consume_planet_type: "Tàu Ark đang thôn tính"
 situation_arkship_lithoid_consume_planet_desc: "Từ trên tàu Ark, bầy đàn thể đá của chúng ta giáng xuống hàng vạn con, nuốt chửng lớp vỏ và lớp phủ của thế giới này cho đến khi không còn lại gì."
 situation_arkship_lithoid_consume_planet_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_arkship_nanotech_consume_planet: "Xâm Thực [Target.GetName]"
 situation_arkship_nanotech_consume_planet_type: "Tàu Ark đang xâm thực"
 situation_arkship_nanotech_consume_planet_desc: "Tàu Ark giải phóng bầy máy móc nano, hòa tan và chiếm lấy thế giới này. Đá, đất và bầu khí quyển bị phân rã, rồi tái cấu trúc thành máy móc nano."
 situation_arkship_nanotech_consume_planet_monthly_change_tooltip: "Tiến độ chiết xuất nanobot"
 situation_arkship_consuming_world_absent_desc: "§YTàu Ark§! bắt buộc phải quay trở lại quỹ đạo của §Y[Target.GetName]§! trong vòng §H180§! ngày, bằng không hành động xâm thực sẽ bị hủy bỏ."
 string_arkship_absent_grace: "Tàu Ark vắng mặt"

 arkship_settle: "Định Cư"
 arkship_settle_desc: "Nhân dân chúng ta sẽ thực hiện chuyến đổ bộ rời tàu cuối cùng, đổi các vì sao lấy mặt đất vững chãi, đổi tàu Ark lấy một mái nhà yên ấm. Những năm tháng du mục của chúng ta có thể sắp kết thúc, nhưng hành trình của chúng ta mới chỉ vừa bắt đầu."
 arkship_settle_effect: " $arkship_settle_empire_effects$$DOUBLE_NEW_LINE$$arkship_settle_arkship_effects$$DOUBLE_NEW_LINE$$arkship_settle_planet_effects$"
 arkship_settle_arkship_effects: "$ARKSHIP_EFFECTS_HEADER$$TABBED_NEW_LINE$— §YThuộc địa £colony£§! này đã được chuyển giao cho hành tinh mục tiêu.$TABBED_NEW_LINE$— §YTàu Ark§! sẽ bị tháo dỡ phế bỏ."
 arkship_settle_planet_effects: "$PLANET_EFFECTS_HEADER$$TABBED_NEW_LINE$— Thêm hiệu chỉnh §Y$arkship_parts$§!$TABBED_NEW_LINE$$t$— $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+60%§!$TABBED_NEW_LINE$$t$— $MOD_PLANET_MAX_DISTRICTS_ADD$: §G+2§!"
 arkship_settle_empire_effects: "$EMPIRE_EFFECTS_HEADER$$TABBED_NEW_LINE$— §PSẽ không còn là Đế quốc Du mục nữa!§!$TABBED_NEW_LINE$— Các §Ytrạm tiếp vận§! nằm trong hệ sao vô chủ sẽ chuyển đổi thành §YCăn Cứ Sao§!.$TABBED_NEW_LINE$— Các §YTàu Ark§! còn lại sẽ được giải phóng làm §YChư Hầu§!."
 arkship_settle_ship_button: "$arkship_settle_effect$$DOUBLE_NEW_LINE$$arkship_settle_desc$"
 arkship_settle_activity_key: "Chuẩn bị định cư (§Y$PROGRESS$%§!)"
 arkship_settle_progress_activity_key: "Đang định cư (§Y$PROGRESS$%§!)"
 arkship_settle_required_progress_key: "£time£ $@arkship_settle_required_progress|0$ §Wngày§!"

 arkship_parts: "Phế Tích Tàu Ark"
 arkship_parts_desc: "Các cơ sở và máy tính tiên tiến thu hồi từ tàu Ark có thể giúp ổn định khí hậu của hành tinh này."

 nomads.4705.name: "Định Cư Hoàn Tất"

 nomads.4705.desc.regular: "Hải trình của tàu Ark §Y[event_target:settling_arkship.GetName]§! đã kết thúc tại đây. Sau nhiều năm lao động miệt mài tháo dỡ cơ sở hạ tầng của nó và chuyển xuống giếng trọng lực, cuối cùng chúng ta đã sẵn sàng phế bỏ con tàu này. [event_target:player_country.GetSpeciesNamePlural] chúng ta đang trải qua một thời khắc lịch sử sẽ được hậu thế khắc ghi. Giờ đây, hãy cùng nhau định cư trên §Y[event_target:settled_planet.GetName]§!!"
 nomads.4705.desc.machine: "Việc chuyển toàn bộ drone và cơ sở hạ tầng từ §Y[event_target:settling_arkship.GetName]§! xuống [event_target:settled_planet.GetPlanetMoon] đánh dấu việc §Y[event_target:player_country.GetName]§! rẽ hướng khỏi tương lai dự kiến trước đó. Giờ đây các hàng đợi ưu tiên mới sẽ được phát triển để thích ứng với đời sống định cư."
 nomads.4705.desc.hive: "Sau nhiều năm chuẩn bị cơ sở hạ tầng của §Y[event_target:settling_arkship.GetName]§! cũng như cải biến các chức năng sinh lý của bản thân, tiến hóa ra khung xương cứng cáp hơn cùng buồng phổi tối ưu hơn, giờ đây chúng ta đã sẵn sàng định cư. Đây sẽ là một giai đoạn hoàn toàn mới trong vòng đời của §Y[event_target:player_country.GetName]§!, có lẽ cuộc sống định cư sẽ rất phù hợp với chúng ta."

 nomads.4700.a: "[event_target:settled_planet.GetPlanetMoon] này sẽ trở thành nền móng cho đế quốc mới của chúng ta."
 nomads.4700.settle.tt: "§Y[event_target:player_country.GetName]§! sẽ không còn là ['concept_nomadic_empire'] £nomad£ nữa, mà định cư trên §Y[event_target:settled_planet.GetName]§! với tư cách là một ['concept_settled_empire'] £planet£.\n\n"
 nomads.4700.b: "$nomads.4700.a$"
 settlement_scuttle_arkships_effect_tt: "\nTất cả các §Y$arkship_cap_plural$§! còn lại sẽ bị §Rđánh đắm tháo dỡ§!, và dân số của chúng sẽ được chuyển đến §Y[event_target:settled_planet.GetName]§!."
 nomads.4700.c: "Chúng ta sẽ tiếp tục bay lượn giữa các vì sao."
 nomads.4700.settle_subject.tt: "§Y[event_target:settling_arkship.GetName]§! sẽ định cư trên §Y[event_target:settled_planet.GetName]§! với tư cách là một ['concept_subject'] mới của §Y[event_target:player_country.GetName]§!.\n\n"
 nomads.4700.d: "Chúng ta sẽ thống trị muôn vì sao từ [event_target:settled_planet.GetPlanetMoon] này."

 origin_nomadic_settled: "Rơi Xuống Các Vì Sao"
 origin_nomadic_settled_desc: "Đế quốc này được thành lập bởi cư dân trên một con tàu Ark sau khi định cư tại một thế giới mới."
 origin_tooltip_nomadic_settled_effects: "Không có ảnh hưởng"

 origin_nomadic_subject: "Du Dân Hư Không"
 origin_nomadic_subject_desc: "Bộ phận tàn dư của một nền văn minh du mục, bị bỏ lại lang bạt giữa các vì sao trong khi chấp nhận sự thống trị từ một thế giới mới."
 origin_tooltip_nomadic_subject_effects: "Không có ảnh hưởng"

 make_subject_nomadic_tt: "\nSẽ thiết lập một ['concept_subject'] du mục dựa trên số lượng §Y$arkship_cap_plural$§!, §Y$nomads_constructor_plural$§! và §Y$waystation_plural$§! còn lại."
 convert_logistics_to_construction_tt: "\nTất cả ['concept_logistic_ships'] sẽ được chuyển đổi thành ['concept_construction_ships']"
 convert_waystations_into_outposts_tt: "\nTất cả ['concept_waystations'] £waystation£ nằm trong các hệ sao chưa sở hữu sẽ được chuyển đổi thành ['concept_outposts'], và nhận được tuyên bố chủ quyền đối với hệ sao đó."
 create_outposts_in_waystation_systems_for_subject_tt: "\nTất cả các hệ sao vô chủ nằm trong phạm vi $@arkship_subject_settle_outpost_range|Y0$ bước nhảy tính từ §Y[event_target:settled_system.GetName]§! và sở hữu ['concept_waystation'] £waystation£ sẽ được xây dựng một ['concept_outpost'], qua đó giành quyền sở hữu các hệ sao này cho ['concept_subject'] mới của chúng ta."
 create_outposts_in_waystation_systems_for_overlord_tt: "\nTất cả các hệ sao vô chủ nằm trong phạm vi $@arkship_subject_settle_outpost_range|Y0$ bước nhảy tính từ §Y[event_target:settled_system.GetName]§! và sở hữu ['concept_waystation'] £waystation£ sẽ được xây dựng một ['concept_outpost'], nhằm tuyên bố quyền sở hữu các hệ sao này cho chúng ta."

 decision_nomad_embarkation: "Lên Tàu Khởi Hành"
 decision_nomad_embarkation_desc: "Các vì sao đang vẫy gọi chúng ta."
 nomad_embarkation_effect: "$nomad_embarkation_empire_effects$ $DOUBLE_NEW_LINE$ $nomad_embarkation_planet_effects$"
 nomad_embarkation_empire_effects: "$EMPIRE_EFFECTS_HEADER$ $TABBED_NEW_LINE$— Chọn một trong các phương án sau:\n$tt$— §PSẽ không còn là đế quốc định cư nữa, các thuộc địa còn lại sẽ được giải phóng làm chư hầu!§!\n$tt$— §PGiải phóng [Root.GetName] làm chư hầu du mục!§! $TABBED_NEW_LINE$— Các §YCăn Cứ Sao§! trong hệ sao trực thuộc sẽ chuyển đổi thành §Ytrạm tiếp vận§!."
 nomad_embarkation_planet_effects: "$PLANET_EFFECTS_HEADER$ $TABBED_NEW_LINE$— §PHành tinh này sẽ bị bỏ hoang!§!$TABBED_NEW_LINE$— Thêm hiệu chỉnh §Y$stripped_planet$§! $TABBED_NEW_LINE$$t$— $MOD_POP_ENVIRONMENT_TOLERANCE$: §R-60%§! $TABBED_NEW_LINE$$t$— $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-2§!"
 nomad_embarkation_effect_short: "['concept_arkship_embark'] và trở thành một ['concept_nomadic_empire'] £nomad£. Các ['concept_colonies'] còn lại sẽ trở thành ['concept_subject']."
 already_embarking: "§RĐang lên tàu khởi hành§!"

 nomads.4710.name: "Lên Tàu Khởi Hành Hoàn Tất"
 nomads.4710.desc.regular: "Kể từ khi tàu của chúng ta lần đầu tiên bay ra khỏi hệ sao, luôn có một số người trong chúng ta chỉ có thể biết về vũ trụ qua các thước phim tư liệu, sinh ra, sống và chết dưới cùng một bầu trời. Giờ đây, tất cả những điều đó sắp sửa thay đổi.\n\nCùng với việc hoàn tất xây dựng §HTàu Ark§!, trọng lực không còn là rào cản nữa, vô số kỳ quan của vũ trụ đang chờ đón chúng ta. §Y[From.GetName]§! đã dốc hết tất cả những gì nó có: nhân dân chúng ta sẽ mang theo tên gọi, ký ức cùng tương lai của nó, cùng nhau tiến vào cõi hư không."
 nomads.4710.desc.machine: "Chúng ta đã hoàn thành một con §HTàu Ark§!. Drone của chúng ta sẽ không còn bị ràng buộc vào [From.GetPlanetMoon] nữa. Chương trình của chúng đã được điều chỉnh để thích ứng với chức năng liên sao di động, đồng thời cơ sở hạ tầng của §Y[From.GetName]§! đã bị lột sạch, mọi hệ thống thiết yếu đã được chuyển giao để hỗ trợ cho một tương lai bốn bể là nhà hoàn toàn mới."
 nomads.4710.desc.hive: "Chúng ta, [event_target:player_country.GetName], từng chứng kiến vô vàn cảnh tượng, nhưng các cá thể con của chúng ta vẫn luôn bị trói buộc trên các hành tinh đã định cư. Giờ đây, trong thời đại du hành liên sao, việc bị giam hãm trong một hệ sao đơn lẻ đã trở thành gánh nặng. Bước lên con §HTàu Ark§! mới tinh của chúng ta, chúng ta sẽ giành lại tự do, còn §Y[From.GetName]§! sẽ bị vắt kiệt và thu hoạch."
 nomads.4710.desc.regular.doomsday: "$nomads.4710.desc.regular$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.machine.doomsday: "$nomads.4710.desc.machine$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.hive.doomsday: "$nomads.4710.desc.hive$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.doomsday_appendix: "§Y[From.GetName]§! đang rực cháy phía sau chúng ta, bị nuốt chửng bởi thảm họa mà chúng ta đã tiên tri từ lâu, nhưng nhân dân chúng ta cuối cùng đã §Gđược cứu§!, nương tựa trên đôi cánh của con §HTàu Ark§! bay vào không gian sâu."

 nomads.4710.a.military: "Chúng ta sẽ bước lên §H$military_arkship_name$§!."
 nomads.4710.embark.tt: "§Y[event_target:player_country.GetName]§! sẽ bước lên §HTàu Ark§!, trở thành nền văn minh §HDu Mục§!.\n"
 nomads.4710.a.science: "Chúng ta sẽ dùng một con §H$science_arkship_name$§! để thám hiểm."
 nomads.4710.a.civilian: "Chúng ta sẽ phồn thịnh trên con §H$civilian_arkship_name$§!!"
 nomads.4710.b: "Họ sẽ trở thành chư hầu của chúng ta."
 embark_create_subject: "\n§Y[from.GetName]§! sẽ bước lên §HTàu Ark§!, trở thành chư hầu du mục mới của §Y[event_target:player_country.GetName]§!.\n"
 embark_leaves_behind_subject: "\nSẽ tạo ra một chư hầu định cư bao gồm tất cả ['concept_colonies'] và ['concept_starbases'] còn lại."
 create_waystations_in_systems_for_nomad_tt: "\nSẽ xây dựng một trạm tại tất cả các hệ sao của phe mình chưa thiết lập §H$waystation$§!."

 NAME_Embarked_Arkship: "[From.GetName] Mới"

 stripped_planet: "Hành Tinh Bị Lột Sạch"
 stripped_planet_desc: "Khi mọi người lên tàu Ark rời đi, phần lớn tài nguyên của thế giới này đã bị bòn rút cạn kiệt, hầu như không còn lại gì ngoài sự chết chóc hoang tàn."
 #######################
# Arkship Modules
 #######################


 sm_arkship_grand_archive: "Đại Lưu Trữ Viện"
 sm_arkship_grand_archive_desc: "Cơ sở này dùng để thu thập và trưng bày các ['concept_specimen', mẫu vật] kỳ lạ và bắt mắt mà chúng ta thu thập được trên khắp thiên hà, bao gồm cả các §Ybầy thú không gian§! còn sống."

 sm_arkship_engineering_bay: "Cảng Kỹ Thuật"
 sm_arkship_engineering_bay_desc: "Duy trì sự vận hành của một con tàu ở quy mô này là cuộc chiến trường kỳ chống lại sự gia tăng entropy. Các linh kiện được cải biến tận dụng, các hệ thống gắng gượng hoạt động vượt quá giới hạn, và công việc này không bao giờ có hồi kết."

 sm_arkship_beastport: "$sm_beastport$"
 sm_arkship_beastport_desc: "$sm_beastport_desc$"

 sm_arkship_docking_bay: "Khu Vực Cập Bến"
 sm_arkship_docking_bay_desc: "Vịnh neo đậu chưa từng yên ắng. Phi thuyền ra vào tấp nập không ngừng nghỉ, việc đến và đi liên tục giúp tàu Ark duy trì mối liên kết chặt chẽ với dải ngân hà rộng lớn hơn."

 sm_arkship_habitation_module: "Mô-đun Cư Trú"
 sm_arkship_habitation_module_desc: "Mở rộng khu cư trú giúp nâng cao sức chứa của tàu Ark. Các hành lang có thể chật hẹp, nhưng nơi đây chính là nhà."

 sm_arkship_sensor_array: "Mảng Cảm Biến Tiên Tiến"
 sm_arkship_sensor_array_desc: "Cụm cảm biến đan xen trên thân tàu quét mọi thứ trong tầm với. Bất kỳ điều gì trong không gian lân cận đều không thể thoát khỏi sự chú ý quá lâu."
 sm_arkship_sensor_array_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_deep_scan']"

 sm_arkship_mining_array: "Phòng Thí Nghiệm Kỹ Thuật Hành Tinh"
 sm_arkship_mining_array_desc: "Thiết bị khoan và khai thác chuyên dụng có khả năng phá vỡ lớp vỏ hành tinh, thu thập các tài nguyên ẩn chứa bên trong."
 sm_arkship_mining_array_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_strip_mine']"

 STARBASE_EQUIPPED_COMPONENT_HEADER: "$COUNT$× $NAME$"
 ARKSHIP_COMPONENTS: "Linh kiện tàu Ark:"
 ADDS_ARKSHIP_XL_SLOTS: "Ô vũ khí £ship_xl_slot£: §G+1§!"
 ADDS_ARKSHIP_H_SLOTS: "Ô vũ khí £ship_h_slot£: §G+2§!"
 ADDS_ARKSHIP_L_SLOTS: "Ô vũ khí £ship_l_slot£: §G+2§!"
 ADDS_ARKSHIP_M_SLOTS: "Ô vũ khí £ship_m_slot£: §G+4§!"
 ADDS_ARKSHIP_G_SLOTS: "Ô vũ khí £ship_g_slot£: §G+4§!"
 ADDS_ARKSHIP_S_SLOTS: "Ô vũ khí £ship_s_slot£: §G+8§!"
 ADDS_ARKSHIP_PD_SLOTS: "Ô vũ khí £ship_pd_slot£: §G+8§!"

 sm_arkship_hangar_bay: "Khoang Chứa Máy Bay"
 sm_arkship_hangar_bay_desc: "Khoang máy bay khổng lồ chứa các phi đội sẵn sàng xuất kích khẩn cấp. Tầm tấn công của chúng ta vượt xa bản thân thân tàu."
 sm_arkship_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$Các khoang máy bay này sẽ dùng để triển khai §YMáy bay chiến đấu§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_archaeo_hangar_bay: "Khoang Chứa Máy Bay $ARCHAEO_STRIKECRAFT$"
 sm_arkship_archaeo_hangar_bay_desc: "Kẻ đã khuất không được yên nghỉ. Các phi thuyền tấn công từ nền văn minh đã sụp đổ từ lâu lại một lần nữa bay vào bầu trời sao."
 sm_arkship_archaeo_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$Các khoang máy bay chuyên dụng này sẽ triển khai §Y$ARCHAEO_STRIKECRAFT$§!.\n"
 sm_arkship_psionic_hangar_bay: "Khoang Máy Bay Ném Bom Tâm Linh"
 sm_arkship_psionic_hangar_bay_desc: "Khoang chắn được tinh chỉnh theo tần số cộng hưởng của vũ khí tâm linh. Tiếng vo ve hiện diện khắp nơi, người ta vừa có thể nghe thấy vừa có thể cảm nhận sâu sắc."
 sm_arkship_psionic_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$Các khoang máy bay chuyên dụng này sẽ triển khai §Y$PSIONIC_STRIKE_CRAFT$§!.\n"
 sm_arkship_amoeba_hangar_bay: "Khoang Chứa Máy Bay $AMOEBA_STRIKE_CRAFT$"
 sm_arkship_amoeba_hangar_bay_desc: "Một khoang điều áp được cải tạo để nuôi dưỡng những người bạn Amip không gian. Chúng thích những khu vực ấm áp gần lò phản ứng."
 sm_arkship_amoeba_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$Các khoang máy bay chuyên dụng này sẽ triển khai §Y$AMOEBA_STRIKE_CRAFT$§!.\n"
 sm_arkship_swarm_hangar_bay: "Khoang Chứa Máy Bay $SWARM_STRIKE_CRAFT_1$"
 sm_arkship_swarm_hangar_bay_desc: "Các giá phóng dày đặc nạp hàng ngàn đơn vị tấn công tự hành, sẵn sàng nghe lệnh ùa ra như bầy đàn."
 sm_arkship_swarm_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$Các khoang máy bay chuyên dụng này sẽ triển khai §Y$SWARM_STRIKE_CRAFT_1$§!.\n"

 sm_arkship_laser_battery: "Khẩu Đội Pháo Laser"
 sm_arkship_laser_battery_desc: "Các hàng máy phát laser phân bố trên thân ngoài, luân phiên khóa mục tiêu với độ chính xác cơ học."
 sm_arkship_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YLaser§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_archaeo_laser_battery: "Khẩu Đội Pháo Khoét Hang Cổ Xưa"
 sm_arkship_archaeo_laser_battery_desc: "Vũ khí thu hồi được thiết kế theo cách khiến kẻ thù bất an. Dù nguyên lý vận hành của nó chưa được hiểu thấu hoàn toàn, nhưng tính sát thương là không thể bàn cãi."
 sm_arkship_archaeo_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$ARCHAEO_LASER$§!.\n"
 sm_arkship_lance_battery: "Giá Treo Thương Quang Học"
 sm_arkship_lance_battery_desc: "Một đường dẫn thương trường năng lượng cao duy nhất, có khả năng hội tụ các chùm tia hủy diệt ở khoảng cách cực xa."
 sm_arkship_lance_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YThương Hạt§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_particle_launcher: "Khẩu Đội Pháo Phóng Hạt"
 sm_arkship_particle_launcher_desc: "Bộ phóng hạt tầm xa gây sát thương hủy diệt nhưng có tốc độ bắn chậm, tiêu diệt các mối đe dọa trước khi chúng áp sát tầm tấn công."
 sm_arkship_particle_launcher_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YBộ Phóng Hạt§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_psionic_torpedo: "Khẩu Đội Pháo Phóng Zro"
 sm_arkship_psionic_torpedo_desc: "Giá phóng ngư lôi nạp các đầu đạn tâm linh, đường bay của chúng được dẫn dắt bởi sự cộng hưởng tâm linh thay vì hệ thống dẫn đường thông thường."
 sm_arkship_psionic_torpedo_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$PSIONIC_TORPEDO$§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_arc_emitter_battery: "Giá Treo Pháo Hồ Quang"
 sm_arkship_arc_emitter_battery_desc: "Một nhóm máy phát hồ quang hoàn toàn bỏ qua giáp trụ, phóng điện trực tiếp vào hệ thống mục tiêu."
 sm_arkship_arc_emitter_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §YMáy Phát Hồ Quang§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_psionic_lightning_battery: "Khẩu Đội Pháo $PSIONIC_LIGHTNING$"
 sm_arkship_psionic_lightning_battery_desc: "Đường dẫn tâm linh kêu lách tách dọc theo thân tàu, sẵn sàng giải phóng chùm năng lượng định hướng bỏ qua phòng thủ thông thường."
 sm_arkship_psionic_lightning_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$PSIONIC_LIGHTNING$§!.\n"

 sm_arkship_mass_driver_battery: "Khẩu Đội Pháo Phóng Khối Lượng"
 sm_arkship_mass_driver_battery_desc: "Tháp pháo động năng tốc độ cao, đáng tin cậy và tàn nhẫn. Loại vũ khí cổ xưa nhất vẫn là một trong những vũ khí hiệu quả nhất."
 sm_arkship_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YPháo Phóng Khối Lượng§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_archaeo_mass_driver_battery: "$ARCHAEO_KINETIC$"
 sm_arkship_archaeo_mass_driver_battery_desc: "Vũ khí động năng cổ đại được khai quật, dung sai nòng súng của nó tinh vi hơn bất kỳ tiêu chuẩn nào mà kỹ thuật hiện đại có thể sao chép."
 sm_arkship_archaeo_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$ARCHAEO_KINETIC$§!.\n"
 sm_arkship_kinetic_artillery_battery: "$KINETIC_ARTILLERY_1$"
 sm_arkship_kinetic_artillery_battery_desc: "Pháo động năng tầm xa, dùng để tấn công mục tiêu trước khi chúng kịp áp sát quá gần."
 sm_arkship_kinetic_artillery_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §Y$KINETIC_ARTILLERY_1$§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_lm_accelerator: "$LM_ACCELERATOR_SET$"
 sm_arkship_lm_accelerator_desc: "Bên trong tháp pháo chứa đầy các đường dẫn kim loại sống, có thể tự phục hồi trong giao tranh, duy trì tốc độ bắn cao nhất ngay cả khi bị hao mòn liên tục."
 sm_arkship_lm_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$LM_ACCELERATOR_SET$§!.\n"
 sm_arkship_mass_accelerator: "Máy Gia Tốc Khối Lượng"
 sm_arkship_mass_accelerator_desc: "Vũ khí động năng hạng nặng nhất mà thân tàu có thể chịu tải. Tốc độ của mỗi phát bắn đủ để xuyên thủng cả lá chắn lẫn giáp trụ."
 sm_arkship_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YMáy Gia Tốc Khối Lượng§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_archaeo_mass_accelerator: "$ARCHAEO_X$"
 sm_arkship_archaeo_mass_accelerator_desc: "Một máy gia tốc cổ đại được trục vớt, quy mô đáng kinh ngạc, cấu trúc cơ học của nó về cơ bản vẫn còn nguyên vẹn dù đã trải qua nhiều thế kỷ."
 sm_arkship_archaeo_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$ARCHAEO_X$§!.\n"

 sm_arkship_missile_battery: "Bệ Phóng Tên Lửa"
 sm_arkship_missile_battery_desc: "Giá phóng tên lửa dùng để tấn công các mục tiêu ở khoảng cách xa. Tuy tốc độ chậm hơn vũ khí năng lượng, nhưng cực kỳ khó bị đối phương vô hiệu hóa sát thương."
 sm_arkship_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YBệ Phóng Tên Lửa§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_archaeo_missile_battery: "$ARCHAEO_MISSILE$"
 sm_arkship_archaeo_missile_battery_desc: "Đạn dược dẫn đường cổ đại với độ chính xác đáng sợ, được thu hồi từ các di chỉ khảo cổ và đưa vào tái sử dụng."
 sm_arkship_archaeo_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$ARCHAEO_MISSILE$§!.\n"
 sm_arkship_swamer_missile_battery: "$SWARMER_MISSILE_1$"
 sm_arkship_swamer_missile_battery_desc: "Bệ phóng nạp các loạt đạn bầy đàn, áp đảo hệ thống phòng thủ điểm bằng ưu thế số lượng tuyệt đối."
 sm_arkship_swamer_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YBệ Phóng Tên Lửa Bầy Đàn§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_scourge_missile_battery: "$SCOURGE_MISSILE_1$"
 sm_arkship_scourge_missile_battery_desc: "Đầu đạn sinh hóa cải tiến, nằm trong tay những kẻ sẵn sàng dùng vũ khí của chính Hiểm Họa Trùng Tộc để phản đòn Hiểm Họa."
 sm_arkship_scourge_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$SCOURGE_MISSILE_1$§!.\n"

 sm_arkship_flak_battery: "$FLAK_BATTERY_1$"
 sm_arkship_flak_battery_desc: "Cụm phòng thủ điểm chuyên dụng nhằm vào máy bay chiến đấu và tên lửa đang bay tới, bắn nát chúng trước khi chúng chạm tới thân tàu."
 sm_arkship_flak_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YPháo Cao Xạ§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_pd_battery: "Khẩu Đội Pháo Phòng Thủ Điểm"
 sm_arkship_pd_battery_desc: "Mạng lưới hệ thống vũ khí cận chiến dày đặc bao phủ thân tàu, có khả năng theo dõi và đánh chặn các mối đe dọa trước khi chúng tiếp cận con tàu."
 sm_arkship_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$Các tháp pháo này sẽ trang bị §YPháo Đài Phòng Thủ Điểm§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta.\n"
 sm_arkship_archaeo_pd_battery: "$ARCHAEO_POINTDEFENCE$"
 sm_arkship_archaeo_pd_battery_desc: "Mảng phòng thủ điểm cổ xưa không rõ nguồn gốc, vẫn hiệu quả như ngày nó khai hỏa lần cuối."
 sm_arkship_archaeo_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$Các tháp pháo chuyên dụng này sẽ trang bị §Y$ARCHAEO_POINTDEFENCE$§!.\n"

 #########################
# Arkship Spinal Mounts
 #########################

 ARKSHIP_SPINAL_MOUNT: "Giá Treo Trục Dọc"
 ADDS_ARKSHIP_T_SLOTS: "Ô vũ khí £ship_t_slot£ bổ sung: §G+1§!"

 sm_arkship_spinal_devastator_mount: "Giá Treo Kẻ Hủy Diệt"
 sm_arkship_spinal_devastator_mount_desc: "Nhu cầu điện năng của nó lớn đến mức chỉ một lần bắn đã khiến hàng triệu gia đình chìm vào bóng tối suốt nhiều giờ liền. Quyết định khai hỏa chưa bao giờ là điều dễ dàng."
 sm_arkship_spinal_devastator_mount_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_T_SLOTS$\n$t$Giá treo trục dọc này được trang bị §Y$ARKSHIP_DEVASTATOR_WEAPON$§!."

 ARKSHIP_DEVASTATOR_WEAPON: "Đại Pháo Kẻ Hủy Diệt"


 sm_arkship_capital_shipyard: "Xưởng Đóng Soái Hạm"
 sm_arkship_capital_shipyard_desc: "Những xưởng đóng tàu này nằm ở trung tâm của tàu Ark, cho phép chúng ta đóng các chiến hạm có quy mô chưa từng có trong khi du hành giữa muôn vì sao."
 sm_arkship_capital_shipyard_tt: "Xưởng đóng tàu: §YCho phép đóng soái hạm§!"
 arkship_capital_shipyard_trigger: "$TRIGGER_FAIL$§RYêu cầu giá treo trục dọc §Y$sm_arkship_capital_shipyard$§!.§!"

 sm_arkship_planetary_refinery: "Máy Tái Chế Hành Tinh"
 sm_arkship_planetary_refinery_desc: "Các thiên thể nhỏ hơn có thể bị nghiền nát và xử lý trong những bánh răng khổng lồ này, cung cấp cho chúng ta nguồn vật liệu dồi dào."
 sm_arkship_planetary_refinery_tt: "$sm_arkship_mining_array_tt$$TABBED_NEW_LINE$['scripted_action:arkship_reprocess_planet']"
 tech_arkship_planetary_refinery: "$sm_arkship_planetary_refinery$"
 tech_arkship_planetary_refinery_desc: "$sm_arkship_planetary_refinery_desc$"

 sm_arkship_stellar_igniter: "Động Cơ Sao"
 sm_arkship_stellar_igniter_desc: "Một hệ thống bơm vật chất tối có khả năng kích hoạt các sự kiện nhiệt hạch cấp độ sao. Thứ này không có chốt an toàn đâu."
 sm_arkship_stellar_igniter_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_stellar_ignition']"
 tech_arkship_stellar_igniter: "$sm_arkship_stellar_igniter$"
 tech_arkship_stellar_igniter_desc: "$sm_arkship_stellar_igniter_desc$"

 sm_arkship_system_scanner: "Mảng Chụp Ảnh Á Không Gian"
 sm_arkship_system_scanner_desc: "Cõi hư không đang thì thầm, và đối với những ai biết lắng nghe, nó đang thì thầm những bí mật của vô số thế giới trong vòng tay của nó."
 sm_arkship_system_scanner_tt: "$sm_arkship_sensor_array_tt$$TABBED_NEW_LINE$['scripted_action:arkship_subspace_image']"
 tech_arkship_system_scanner: "$sm_arkship_system_scanner$"
 tech_arkship_system_scanner_desc: "$sm_arkship_system_scanner_desc$"

 sm_arkship_exodus_jump: "Bộ Điều Phối Bước Nhảy Đại Di Cư"
 sm_arkship_exodus_jump_desc: "Bộ điều phối bước nhảy Đại Di Cư hiện phần lớn vẫn là một mẫu thử nghiệm, một ngày nào đó trong tương lai, nó sẽ cho phép chúng ta nhảy qua các hệ sao khác nhau chỉ trong chớp mắt."
 sm_arkship_exodus_jump_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_exodus_jump']"
 tech_arkship_exodus_jump: "$sm_arkship_exodus_jump$"
 tech_arkship_exodus_jump_desc: "$sm_arkship_exodus_jump_desc$"

 ###############################
# Arkship Starbase "Buildings"
 ###############################

 ADDS_ARKSHIP_L_UTILITY_SLOTS: "Ô đa dụng £ship_l_slot£: §G+3§!"
 ADDS_ARKSHIP_AUX_SLOTS: "Ô phụ trợ £ship_a_slot£: §G+3§!"
 ADDS_ARKSHIP_AURA_SLOT: "Ô lõi £ship_c_slot£: §G+1§!"

 sm_arkship_armor: "Lớp Phủ Giáp Trụ"
 sm_arkship_armor_desc: "Các tấm giáp dày được bắt vít cố định vào những bộ phận lộ thiên nhất của tàu Ark. Trọng lượng này đòi hỏi cao hơn từ các hệ thống, nhưng tàu Ark vẫn chịu đựng được."
 sm_arkship_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$Các ô đa dụng này sẽ trang bị §YGiáp§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta."
 sm_arkship_lm_armor: "$sm_arkship_armor$ Tái Tạo"
 sm_arkship_lm_armor_desc: "Kim loại sống đan xen bên trong giáp thân tàu, lập tức hàn kín các vết rách ngay khi chúng xuất hiện."
 sm_arkship_lm_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$Các ô chuyên dụng này sẽ trang bị §Y$LARGE_LM_ARMOR_1$§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta."
 sm_arkship_archaeo_armor: "$tech_archaeoarmor$"
 sm_arkship_archaeo_armor_desc: "Các tấm vỏ tàu được khai quật chế tạo từ hợp kim chưa rõ thành phần. Bất kể nền văn minh nào đã chế tạo những con tàu này, họ đều không hề có ý định để chúng bị phá hủy dễ dàng."
 sm_arkship_archaeo_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$Các ô chuyên dụng này sẽ trang bị §Y$LARGE_ARCHAEO_ARMOR$§!."

 sm_arkship_shield: "Mảng Lá Chắn"
 sm_arkship_shield_desc: "Mảng máy phát trải khắp thân tàu phóng ra các trường lực lá chắn chồng chéo, hấp thu hỏa lực dữ dội nhất mà kẻ thù trút xuống chúng ta."
 sm_arkship_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$Các ô chuyên dụng này sẽ trang bị §YLá Chắn§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta."
 sm_arkship_psi_shield: "$tech_psionic_shield$"
 sm_arkship_psi_shield_desc: "Lá chắn tâm linh chạm tới các bình diện thực tại mà lá chắn làm lệch hướng thông thường không thể chạm tới. Cú va chạm lẽ ra đã trúng đích, nhưng lại trượt đi."
 sm_arkship_psi_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$Các ô chuyên dụng này sẽ trang bị §Y$LARGE_PSI_SHIELD$§!."
 sm_arkship_archaeo_shield: "$tech_archaeoshield$"
 sm_arkship_archaeo_shield_desc: "Máy phát lá chắn thiết kế chưa rõ được trục vớt, hiệu quả hơn bất kỳ thiết bị nào do kỹ thuật hiện đại chế tạo."
 sm_arkship_archaeo_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$Các ô chuyên dụng này sẽ trang bị §Y$LARGE_ARCHAEO_SHIELD$§!."

 sm_arkship_crystal_plating: "$tech_crystal_armor_1$"
 sm_arkship_crystal_plating_desc: "Các tấm composite tinh thể dày đặc ốp vào thân ngoài, mang lại sự bảo vệ mạnh mẽ trước mọi dạng sát thương ập tới."
 sm_arkship_crystal_plating_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$Các ô chuyên dụng này sẽ trang bị §YLớp Phủ Tinh Thể§! và tự động nâng cấp lên trình độ công nghệ mới nhất của chúng ta."

 sm_arkship_afterburner: "$tech_afterburners_1$"
 sm_arkship_afterburner_desc: "Hệ thống đẩy khẩn cấp dùng để thu hẹp khoảng cách hoặc rút khỏi giao tranh khi các động cơ đẩy thông thường là không đủ."
 sm_arkship_afterburner_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$Các ô phụ trợ chuyên dụng này sẽ trang bị §Y$tech_afterburners_1$§!, và sẽ tự động nâng cấp lên công nghệ mới nhất của chúng ta."

 sm_arkship_armor_hardener: "$tech_armor_hardeners_1$"
 sm_arkship_armor_hardener_desc: "Giáp phản ứng có khả năng làm cứng thân tàu một cách chọn lọc ngay trong khoảnh khắc trước khi va chạm."
 sm_arkship_armor_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$Các ô phụ trợ chuyên dụng này sẽ trang bị §Y$tech_armor_hardeners_1$§!, và sẽ tự động nâng cấp lên công nghệ mới nhất của chúng ta."

 sm_arkship_shield_hardener: "$tech_shield_hardeners_1$"
 sm_arkship_shield_hardener_desc: "Bộ điều chế tần số có thể chuyển đổi sóng hài lá chắn trong chiến đấu, làm giảm sức xuyên phá do các vũ khí vốn được thiết kế để bỏ qua lá chắn gây ra."
 sm_arkship_shield_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$Các ô phụ trợ chuyên dụng này sẽ trang bị §Y$tech_shield_hardeners_1$§!, và tự động nâng cấp lên công nghệ mới nhất của chúng ta."

 tech_nomads_titans: "$tech_titans$"
 tech_nomads_titans_desc: "$tech_titans_desc$"
 TECH_UNLOCK_ARKSHIP_TITAN_AURAS_CONSTRUCTION_TITLE: "§H$UNLOCKS_COMPONENTS$§! Hào Quang Tàu Ark"
 TECH_UNLOCK_ARKSHIP_TITAN_AURAS_CONSTRUCTION_DESC: "§HHào Quang Tàu Ark§!\nSự tiến bộ trong công nghệ hỗ trợ hạm đội cho phép tàu Ark hiện có thể trang bị cùng loại hào quang như các cự hạm Titan sử dụng."

 sm_arkship_quantum_destabilizer: "$SHIP_AURA_QUANTUM_DESTABILIZER$"
 sm_arkship_quantum_destabilizer_desc: "Khối lượng của tàu Ark cho phép nó phóng ra trường lực làm nhiễu loạn hệ thống vũ khí của tàu địch lân cận, từ đó làm giảm tốc độ bắn của chúng."
 sm_arkship_subspace_snare: "$SHIP_AURA_SUBSPACE_SNARE$"
 sm_arkship_subspace_snare_desc: "Trường neo đậu á không gian do tàu Ark phóng ra ngăn cản tàu địch trốn thoát bằng các phương tiện vượt quang tốc."
 sm_arkship_shield_dampener: "$SHIP_AURA_SHIELD_DAMPENER$"
 sm_arkship_shield_dampener_desc: "Các máy phát gây nhiễu lắp đặt khắp thân tàu sẽ áp chế lá chắn của tàu địch lân cận, hạn chế năng lực phòng hộ tối đa của chúng."

 tech_nomads_juggernaut: "$tech_juggernaut$"
 tech_nomads_juggernaut_desc: "$tech_juggernaut_desc$"
 TECH_UNLOCK_ARKSHIP_JUGGERNAUT_AURAS_CONSTRUCTION_TITLE: "§H$UNLOCKS_COMPONENTS$§! Hào Quang Tàu Ark"
 TECH_UNLOCK_ARKSHIP_JUGGERNAUT_AURAS_CONSTRUCTION_DESC: "§HHào Quang Tàu Ark§!\nSự tiến bộ trong công nghệ hỗ trợ hạm đội cho phép tàu Ark hiện có thể trang bị cùng loại hào quang như các cự hạm Juggernaut sử dụng."

 sm_arkship_aura_strike_craft: "$SHIP_AURA_STRIKE_CRAFT$"
 sm_arkship_aura_strike_craft_desc: "Tàu Ark phát tín hiệu điều phối bay, nâng cao sức chiến đấu của các máy bay chiến đấu đồng minh lân cận."
 sm_arkship_aura_hyperlane: "$SHIP_AURA_HYPERLANE$"
 sm_arkship_aura_hyperlane_desc: "Phao dẫn đường do tàu Ark phóng ra cải thiện việc tính toán động cơ siêu không gian của tất cả các tàu trong hạm đội."
 sm_arkship_aura_pd_penetration: "$SHIP_AURA_PD_PENETRATION$"
 sm_arkship_aura_pd_penetration_desc: "Tín hiệu phản công điện tử do tàu Ark phát ra làm gián đoạn việc nhắm bắn phòng thủ điểm của kẻ thù, giúp vũ khí của chúng ta chọc thủng lưới đánh chặn."
 sm_arkship_aura_bombardment: "$SHIP_AURA_BOMBARDMENT$"
 sm_arkship_aura_bombardment_desc: "Bộ chuyển tiếp kiểm soát hỏa lực do tàu Ark triển khai nâng cao độ chính xác oanh tạc quỹ đạo của toàn bộ hạm đội."
 sm_arkship_aura_range: "$SHIP_AURA_RANGE$"
 sm_arkship_aura_range_desc: "Dữ liệu nhắm bắn chia sẻ từ mảng tàu Ark mở rộng khoảng cách giao tranh hiệu quả của mỗi con tàu trong hạm đội."


 sm_arkship_energy_hub: "Cuộn Dây Siêu Dẫn"
 sm_arkship_energy_hub_desc: "Mạng lưới cáp siêu dẫn chạy khắp thân tàu, loại bỏ tổn thất điện trở và tối đa hóa việc truyền tải điện năng đến các hệ thống."
 sm_arkship_food_hub: "Trạm Kiểm Soát Tối Ưu Hóa Khí Hậu"
 sm_arkship_food_hub_desc: "Hệ thống kiểm soát môi trường thúc đẩy từng khoang canh tác và boong thủy canh tới giới hạn vận hành."
 sm_arkship_hydroponics_bay: "Mở Rộng Boong Canh Tác"
 sm_arkship_hydroponics_bay_desc: "Một số phân khu của thân tàu được cải tạo để canh tác thủy canh quy mô lớn."
 sm_arkship_harvest_processing_arrays: "Mảng Xử Lý Sản Phẩm Thu Thập"
 sm_arkship_harvest_processing_arrays_desc: "Mảng xử lý chuyên dụng và cơ sở chuẩn bị hoạt động ngoài không gian tăng cường đáng kể năng lực tác nghiệp của tàu Ark trong việc thu thập và tinh chế trầm tích quỹ đạo."
 sm_arkship_trade_hub: "Hệ Thống Hậu Cần Bên Ngoài"
 sm_arkship_trade_hub_desc: "Đường ray chở hàng và hệ thống cập bến từ tính trên thân ngoài tối ưu hóa việc truyền tải tài nguyên giữa tàu Ark và các tàu hợp tác."
 sm_arkship_bureaucracy_hub: "Trung Tâm Điều Phối Hành Chính"
 sm_arkship_bureaucracy_hub_desc: "Các trung tâm xử lý hành chính phân bổ trên nhiều tầng boong, giúp hoạt động quản trị của chúng ta diễn ra trơn tru như một động cơ."
 sm_arkship_synapse_hub: "Bộ Chuyển Tiếp Khớp Thần Kinh"
 sm_arkship_synapse_hub_desc: "Cụm chuyển tiếp thần kinh đẩy nhanh việc ra quyết định của ý thức chia sẻ trên tàu Ark."
 sm_arkship_maintenance_hub: "Đầu Mối Bảo Trì"
 sm_arkship_maintenance_hub_desc: "Khoang sửa chữa chuyên dụng đảm bảo mọi linh kiện đều được giám sát, bảo trì và thay thế trước khi xảy ra sự cố. Trong không gian vũ trụ, khoảng cách giữa một trục trặc nhỏ và thảm họa chỉ cách nhau một sợi chỉ mỏng."
 sm_arkship_consumer_goods_hub: "Dây Chuyền Lắp Ráp Công Nghiệp"
 sm_arkship_consumer_goods_hub_desc: "Dây chuyền lắp ráp được tái sử dụng để sản xuất hàng tiêu dùng, vừa đáp ứng các nhu cầu cơ bản của người dân vừa cung cấp các hàng hóa họ mong muốn."
 sm_arkship_alloys_hub: "Lò Luyện Năng Lượng Cao"
 sm_arkship_alloys_hub_desc: "Các cơ sở luyện hợp kim vận hành đạt tới giới hạn mà thân tàu có thể chịu đựng an toàn."
 sm_arkship_psi_corps: "Quân Đoàn Tâm Linh"
 sm_arkship_psi_corps_desc: "Cơ sở này nằm sâu trong thân tàu Ark, cách biệt với khu vực vành đai dân cư đông đúc, chuyên dùng để huấn luyện các cá nhân có thiên phú tâm linh, giúp Quân Đoàn Tâm Linh duy trì sự giám sát chặt chẽ đối với toàn thể cư dân.\n\n§YQuân Đoàn Tâm Linh là bạn của bạn. Hãy tin tưởng Quân Đoàn.§!\n\n£job_telepath£ $job_telepath_plural$ có thể sản xuất £unity£ §Y$unity$§!, giảm £crime£ §Y$PLANET_CRIME_TITLE$§!, và tăng $mod_psionic_pop_bonus_workforce_mult$.\n"
 sm_arkship_psi_corps_hive_mind: "$sm_arkship_psi_corps$"
 sm_arkship_psi_corps_desc_hive_mind: "Cơ sở này nằm sâu trong tàu Ark, cách xa vành đai đông dân cư, chuyên dùng để huấn luyện các ong thợ có thiên phú dị năng tâm linh, và để lực lượng Quân Đoàn Tâm Linh này giám sát bầy đàn.\n\n§YLực lượng Quân Đoàn Tâm Linh này có thể bảo vệ bạn, hãy tin tưởng chúng.§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_arkship_psi_corps_machine_intelligence: "$sm_arkship_psi_corps$"
 sm_arkship_psi_corps_desc_machine_intelligence: "Cơ sở này nằm sâu trong tàu Ark, cách xa vành đai đông dân cư, chuyên dùng để huấn luyện các đơn vị có thiên phú tâm linh, và để lực lượng Quân Đoàn Tâm Linh này tuần kiểm bầy drone.\n\n§YLực lượng Quân Đoàn Tâm Linh này có thể bảo vệ bạn, hãy tin tưởng chúng.§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_arkship_shield_generator: "Bộ Khuếch Đại Lá Chắn"
 sm_arkship_shield_generator_desc: "Mảng máy phát thứ cấp tăng cường mạng lưới lá chắn chính, bổ sung thêm một lớp bảo vệ khác cho thân tàu."
 sm_arkship_galactic_stock_exchange: "Sở Giao Dịch Chứng Khoán"
 sm_arkship_galactic_stock_exchange_desc: "Một sàn giao dịch vận hành 24/7, kết nối thị trường của chúng ta với thị trường của mọi đế quốc mà chúng ta đi qua."
 sm_arkship_embassy_complex: "Tổ Hợp Đại Sứ Quán"
 sm_arkship_embassy_complex_desc: "Các dãy phòng ngoại giao và sảnh tiếp tân đón tiếp sứ tiết từ khắp thiên hà. Đạo hiếu khách thông hành khắp bốn phương."
 sm_arkship_noble_estates: "Dinh Thự Quý Tộc"
 sm_arkship_noble_estates_desc: "Khu cư trú mạ vàng dành riêng cho giới quý tộc, của cải và quyền thế của họ đồng hành cùng con tàu."
 sm_arkship_slave_processing_facility: "Trung Tâm Xử Lý Nô Lệ Quỹ Đạo"
 sm_arkship_slave_processing_facility_desc: "Cơ sở xử lý dùng để quản lý dân số nô lệ, đảm bảo duy trì phân bổ lực lượng lao động hiệu quả trong mọi hệ sao mà chúng ta ghé thăm."
