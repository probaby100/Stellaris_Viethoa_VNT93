 # Clues of the Chrysanthemum

 clues_chrysanthemum_title: "Manh Mối Tàu Chrysanthemum"
 clues_chrysanthemum_desc: "Unity, cuối cùng chúng ta đã có manh mối về tung tích của tàu Chrysanthemum. Chúng ta phải đến xem con tàu chị em của mình hiện đang lấy nơi đâu làm nhà."

 nomads.9000.name: "Tiếng Vọng Ngày Cũ"
 nomads.9000.desc: "Bộ thu tín hiệu tầm xa của tàu Hyacinth đã chặn được một đoạn phát sóng trên tần số khẩn cấp của \"Dự Án Ulysses\".\n\nTín hiệu này rất cổ xưa — ít nhất đã một thế kỷ trôi qua — nhưng thông điệp lại vô cùng rõ ràng. Con tàu Ark thứ năm của Dự Án Ulysses mang tên \"Chrysanthemum\" đã sống sót qua vụ phân tán. Những người định cư đã phát hiện một thế giới mà họ đặt tên là \"Unity\".\n\nBản tin liên tục lặp lại: \"Thuộc địa tàu Chrysanthemum kêu gọi tất cả các tàu thuộc Dự Án Ulysses. Chúng tôi đã đổ bộ lên một thế giới có thể sinh sống được. Hành tinh này vô cùng tươi đẹp. Chúng tôi đang xây dựng ngôi nhà mới tại đây. Hãy trở về nhà.\"\n\nTừ vị trí này không thể xác định nguồn phát tín hiệu, nhưng phao chuyển tiếp dùng để truyền phát tín hiệu này có thể truy vết được. Khảo sát các hệ sao lân cận có thể tìm thấy một trong số chúng."
 nomads.9000.a: "Bắt đầu định vị tam giác nguồn tín hiệu."
 nomads.9000.b: "Đó toàn là chuyện xưa cũ rồi, hãy ghi lại rồi tiếp tục tiến bước."
 chrysanthemum_poi_1: "Bộ Chuyển Tiếp Tín Hiệu"
 chrysanthemum_poi_1_desc: "Một hệ sao có thể chứa phao chuyển tiếp của Dự Án Ulysses. Việc điều tra tàu Hyacinth có thể giúp định vị chính xác hơn nguồn phát tín hiệu."

 nomads.9005.name: "Phát Hiện Tín Hiệu"
 nomads.9005.desc: "Một phao chuyển tiếp của Dự Án Ulysses đang trôi dạt trong hệ sao này — hư hỏng nặng nề, chỉ vừa đủ vận hành, nhưng vẫn đang phát sóng.\n\nNgoài lời tuyên cáo ban đầu, phao còn lưu giữ hai bức điện sau đó. Bức thứ hai có niên đại khoảng mười năm sau bức thứ nhất.\n\nDân số thuộc địa: Hai trăm sáu mươi ngàn. Nông nghiệp đã được thiết lập. Cơ sở hạ tầng đang được mở rộng.\n\nBức điện thứ ba có niên đại là ngày thứ 9182 — khoảng năm thứ hai mươi lăm sau khi đổ bộ. \"Chúng tôi vẫn ở đây. Môi trường của Unity đầy thử thách hơn nhiều so với những gì khảo sát ban đầu cho thấy. Chúng tôi đã mất đi một số đồng đội. Nếu có bất kỳ phi thuyền nào của Dự Án Ulysses nhận được tin này, xin hãy hồi đáp. Chúng tôi ở đây. Chúng tôi vẫn đang kiên trì chống chọi.\"\n\nUnity nằm trong hệ sao Deneb, chỉ cách nơi này vài cú nhảy siêu không gian."
 nomads.9005.a: "Thiết lập lộ trình hướng về Deneb."
 chrysanthemum_poi_2: "Deneb"
 chrysanthemum_poi_2_desc: "Thuộc địa của tàu Ark Chrysanthemum được thiết lập tại đây. Phao chuyển tiếp Dự Án Ulysses đã ghi lại tọa độ, tàu Hyacinth bắt buộc phải đến đó."

 nomads.9010.name: "Hợp Nhất"
 nomads.9010.desc: "Hệ sao Deneb chìm trong tĩnh lặng.\n\nTàu \"Hyacinth\" thoát khỏi bước nhảy, phát hiện không có phao tiêu, không có tín hiệu, cũng không có con tàu nào qua lại giữa các hành tinh. Hành tinh Olympus lơ lửng ở đằng xa, to lớn và lạnh lùng.\n\nCó một vệ tinh không bình thường. Bản tin phát thanh của thuộc địa từng mô tả nơi đó có những lục địa xanh tươi cùng những vùng nước bao la, nhưng máy quét lại hiển thị một thế giới chết chóc — mang màu nâu xám không thể nhầm lẫn đặc trưng của một hành tinh bị vũ khí hạt nhân tàn phá. Nơi đó không còn bất kỳ sự sống nào.\n\nTrên quỹ đạo gần hành tinh, trôi dạt chậm rãi và ảm đạm chính là con tàu \"Chrysanthemum\". Nó không bị phá hủy. Chỉ là không một bóng người. Mọi cửa sổ mạn tàu đều tối đen như mực. Con tàu từng chở hai trăm năm mươi ngàn người định cư đến thế giới này nay đã nằm im lìm tại đây suốt nhiều thập kỷ."
 nomads.9010.a: "Bắt đầu phân tích bề mặt và tàn tích."

 chrysanthemum_object: "CNS Chrysanthemum" # Commonwealth Navy Ship
 chrysanthemum_object_tooltip: "$chrysanthemum_object_desc$"
 chrysanthemum_object_desc: "Con tàu Ark thứ năm của Dự Án Ulysses. Nó đã chở những người khai hoang sau này lập nên \"Unity\". Nó đã trôi dạt trong trạng thái lạnh giá và không bóng người suốt không biết bao nhiêu thập kỷ."

 # Chrysanthemum Digsite
 site_chrysanthemum_colony: "Tàn Tích Thuộc Địa Unity"
 site_chrysanthemum_colony_desc: "Thuộc địa Unity đã vận hành khoảng hai mươi lăm năm trước khi mất liên lạc. Bất kể chuyện gì đã xảy ra ở đây, các ghi chép đều được bảo tồn. Nhân viên lưu trữ của thuộc địa đã kiên trì ghi chép cho đến tận giây phút cuối cùng."

 nomads.9015.name: "Nóng Bỏng"
 nomads.9015.desc: "Lõi dữ liệu của thuộc địa đã sống sót — được niêm phong trong kho lưu trữ ngầm bên dưới lớp đất đá bị thủy tinh hóa.\n\nNgày 9251: Phát hiện một biến thể đào đất mới. Cấp độ bảo vệ của tường ngoài không đủ để chống lại sự xâm nhập từ lòng đất. Đã yêu cầu tàu \"Chrysanthemum\" hỗ trợ kỹ thuật. Yêu cầu đang chờ phê duyệt.\n\nNgày 9389: Vành đai ngoài đã sơ tán. Khu cư trú ngầm xác nhận đã tiếp nhận 214.000 người định cư. Một số khu vực đã mất liên lạc.\n\nNgày 9441: Mất liên lạc với các khu từ 7 đến 12. Thương vong của dân quân: 892 người.\n\nNgày 9484: Tầng ngầm 4 đã mất điện. Đội ngũ được yêu cầu ngừng ghi chép. Nhân viên lưu trữ đã từ chối.\n\nNgày 9514: Chúng ta không còn đủ thời gian nữa."
 nomads.9015.a: "Lưu giữ hồ sơ của thuộc địa."

 nomads.9020.name: "Bỏ Phiếu"
 nomads.9020.desc: "Hội trường được xây dựng để chứa hai trăm người. Cuộc họp cuối cùng chỉ triệu tập được mười bảy người. Nhân viên lưu trữ vẫn tiếp tục ghi chép.\n\nCuộc họp kéo dài sáu tiếng đồng hồ. Có tổng cộng mười hai lá phiếu được bỏ — sáu phiếu thuận oanh tạc quỹ đạo, sáu phiếu chống. Một ủy viên bỏ phiếu trắng. Ba người vắng mặt; khu vực phòng thủ của họ đã thất thủ từ ba ngày trước.\n\nNhững người phản đối lập luận rằng việc sơ tán vẫn khả thi. Tàu \"Chrysanthemum\" có thể chia đợt sơ tán những người sống sót trước khi các tầng dưới của thuộc địa mặt đất bị chọc thủng.\n\nĐa số lại không nghĩ như vậy. Sinh vật đó đã tiến vào các lối đi tầng dưới. Bất kỳ con tàu nào cập bến cũng sẽ mang mầm bệnh rời khỏi hành tinh này. Lựa chọn lúc này không còn là cứu một phần hay cứu tất cả, mà là mất đi một thế giới, hay mất đi tất cả các thế giới tiếp theo.\n\nChỉ huy Beauclair, Trưởng ban An ninh thuộc địa đã bỏ lá phiếu quyết định. Đề xuất được thông qua. Hiến chương thuộc địa quy định thiểu số phục tùng đa số. Bản hiến chương đó do chính họ soạn thảo vào năm đầu tiên, khi tương lai trông vẫn còn là một viễn cảnh hoàn toàn khác."
 nomads.9020.a: "Ghi nhận quyết định của ủy ban."

 nomads.9025.name: "Nhật Ký"
 nomads.9025.desc: "Nhật ký đài chỉ huy bắt đầu từ ngày thứ 9516 — tức hai ngày sau cuộc bỏ phiếu.\n\n11 thuyền viên ở lại để xác nhận tình hình dọn dẹp bề mặt. Mức độ bức xạ. Ước tính dân số bị hạ thấp, sau đó lại tiếp tục hạ thấp. Ngày 9519: Ủy quyền oanh tạc. Ngày 9521: Xác nhận dọn sạch phân khu, 40%. Ngày 9558: Bề mặt đã hoàn toàn được thanh lọc. Không phát hiện dấu hiệu sự sống. Kết quả đánh giá: Nhất trí toàn bộ.\n\nCác thuyền viên lại mất thêm bốn năm để tiến hành khảo sát vật lý thiên văn. Các nhà khoa học dùng cách này để giết thời gian.\n\nNhật ký cuối cùng ghi ngày thứ 11204. Sĩ quan trực ban mô tả về một ngày trời quang đãng. Cô ấy viết rằng nhìn Deneb ở cự ly gần thế này, khác biệt hoàn toàn so với dáng vẻ khi mới tiếp cận nó năm xưa. Ghi chép kết thúc tại đây.\n\nGhi chép cuối cùng chỉ có một mốc thời gian, không lời xin lỗi, cũng không có sự chiêm nghiệm. Chỉ đơn thuần là một lời quan sát về ánh sao."
 nomads.9025.a: "Đóng kho lưu trữ."

 # First Contact
 action.1.desc_112: "ISA-06... Tàu Hyacinth. Chúng tôi đã mất liên lạc với cả sáu con tàu, và trong suốt một thời gian dài, chúng tôi đã chuẩn bị cho tình huống xấu nhất. Có thể tìm thấy các bạn ở đây, thấy các bạn vẫn còn sống... Xin hãy thứ lỗi cho sự xúc động này.\n\nThay mặt [From.GetHomeWorldName] và Đại Hội Đồng Liên Hợp Quốc, xin hãy đón nhận bàn tay hữu nghị của chúng tôi. Bất kể \"Dự Án Ulysses\" đã đưa các bạn bước lên con đường nào, giờ đây các bạn đã trở về bên đồng bào của mình.\n\nChúng ta có rất nhiều điều để nói. Xin hãy kể cho chúng tôi nghe tất cả mọi chuyện."
 action.1.desc_113: "[From.GetRulerTitle] [From.GetRulerName], đến từ Hạm Đội Nghiên Cứu Gundersen. Con tàu \"Hyacinth\" xin gửi lời chào đến quý ngài. Chúng tôi rất vui mừng khi thấy Trái Đất vẫn đứng vững.\n\nChúng tôi đã dành cả một thế kỷ để truy tìm những điều bị lỗ sâu phân tán trong hệ sao này. Công việc này bao la vô tận, và chúng tôi nhận thấy rằng vũ trụ tuyệt đối sẽ không hé lộ bí mật của nó cho những kẻ thiếu trí tò mò. Mỗi người gia nhập chúng tôi đều hiểu sâu sắc điều đó. Đây cũng là điều kiện duy nhất chúng tôi đưa ra.\n\n[From.GetHomeWorldName] từng nuôi dưỡng những nhà khoa học và nhà thám hiểm sẵn sàng ngồi trên tàu Ark vượt qua cõi hư không. Chúng tôi tin rằng ngày nay vẫn vậy. Cánh cửa của tàu \"Hyacinth\" luôn rộng mở cho bất kỳ ai mang trong mình tinh thần đó. Hãy phái những nhân tài ưu tú nhất của các bạn đến với chúng tôi. Ở đây không bao giờ thiếu những câu hỏi."

