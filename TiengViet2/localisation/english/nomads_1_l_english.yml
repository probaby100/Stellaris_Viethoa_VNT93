 tech_waystation_2_desc: "$starbase_waystation_1_plural$ của chúng ta không còn chỉ là mốc định danh đơn thuần giữa muôn vì sao. Việc cải thiện hậu cần cho phép chúng chứa nhiều kho dự trữ hơn và truyền tải tài nguyên dọc theo tuyến tiếp vận đã thiết lập hiệu quả hơn."
