 civic_corporate_deep_sleep_desc: "Tập đoàn du mục khổng lồ này rất sành sỏi công nghệ đông lạnh, chỉ rã đông thuyền viên và khách hàng khi dự đoán việc đó đem lại lợi nhuận."
 councilor_corporate_deep_sleep: "Giám đốc ngủ đông cấp cao"
 councilor_corporate_deep_sleep_desc: "Viên giám đốc nhân sự cấp cao sử dụng các thuật toán dự đoán và chỉ số năng suất để tối ưu hóa việc bảo quản đông lạnh nhân viên."
 civic_tooltip_not_deep_sleep: "Không có Ý niệm quốc gia dạng ['concept_deep_sleep_civics']"
 concept_deep_sleep_civics: "$civic_deep_sleep$"
 concept_deep_sleep_civics_desc: "Các Ý niệm quốc gia dạng $concept_deep_sleep_civics$ bao gồm:\n—['civic:civic_deep_sleep']$NEW_LINE$—['civic:civic_corporate_deep_sleep']"
 civic_hive_deep_sleep: "Ngủ đông luân phiên"
 civic_hive_deep_sleep_desc: "Tập thể bầy đàn du mục này đưa một phần ý thức vào trạng thái ngủ đông luân phiên, chỉ đánh thức những mô và ong thợ cần thiết cho nhiệm vụ hiện tại của tàu Arkship."
 civic_machine_deep_sleep: "Giao thức chờ"
 civic_machine_deep_sleep_desc: "Trí tuệ máy móc du mục này tối ưu hóa hành trình bằng cách tắt các đơn vị nhàn rỗi, chỉ kích hoạt chúng khi thật sự cần."
 job_ark_deep_sleep: "Khoang ngủ đông"
 job_ark_deep_sleep_plural: "Khoang ngủ đông"
 job_ark_deep_sleep_desc: "Do nguồn tài nguyên hiện tại khan hiếm, chúng ta chỉ có thể để một số ít người tỉnh táo."
 pop_cat_deep_sleep: "$job_ark_deep_sleep$"
 pop_cat_deep_sleep_plural: "$job_ark_deep_sleep_plural$"
 pop_cat_deep_sleep_desc: "Đại đa số người dân ngủ say trong băng giá của thời không, chờ đợi ngày chúng ta đủ sức đánh thức họ."
