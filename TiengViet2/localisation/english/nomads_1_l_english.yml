 CONTRACT_STELLAR_IGNITION_PROJECT_DESC: "$contract_stellar_ignition_desc$"

 contract_stellar_ignition_lore_issued: "§L\"Chúng tôi có một hành tinh khí khổng lồ đã sẵn sàng để thắp sáng. Hãy mang theo $sm_arkship_stellar_igniter$ của các bạn.\"§!"
 contract_stellar_ignition_lore_completed: "§L\"Nơi từng chỉ có mây khí và bóng tối, nay đã tỏa sáng rực rỡ một mặt trời mới. Thật ngoạn mục.\"§!"
 contract_stellar_ignition_lore_failed: "§L\"Hành tinh khí khổng lồ vẫn lạnh lẽo và tăm tối. Thật là một cơ hội bị bỏ lỡ.\"§!"

 megacorp_contract_stellar_ignition_lore_issued: "§L\"Tỷ suất hoàn vốn dự kiến từ ngôi sao thứ hai này đúng là con số thiên văn!\"§!"
 megacorp_contract_stellar_ignition_lore_completed: "§L\"Hai mặt trời, gấp đôi du khách. Mở bán vé tàu du ngoạn ngay thôi!\"§!"
 megacorp_contract_stellar_ignition_lore_failed: "§L\"Chúng tôi đã hứa với các bên góp vốn về một ngôi sao. Kết quả này là không thể chấp nhận được.\"§!"

 spiritualist_contract_stellar_ignition_lore_issued: "§L\"Ngọn lửa thiêng liêng đang chờ đợi bên trong gã khổng lồ đang say ngủ. Hãy đánh thức nó.\"§!"
 spiritualist_contract_stellar_ignition_lore_completed: "§L\"Ngọn lửa thần thánh giờ đây sẽ bùng cháy vĩnh cửu.\"§!"
 spiritualist_contract_stellar_ignition_lore_failed: "§L\"Ngọn lửa trời vẫn chưa bùng cháy. Có lẽ là do chúng ta chưa đủ xứng đáng.\"§!"

 militarist_contract_stellar_ignition_lore_issued: "§L\"Một ngôi sao mới đồng nghĩa với việc nắm quyền áp đảo chiến lược trên toàn khu vực. Làm đi.\"§!"
 militarist_contract_stellar_ignition_lore_completed: "§L\"Một ngôi sao hoàn chỉnh được đúc nên từ ý chí thuần khiết.\"§!"
 militarist_contract_stellar_ignition_lore_failed: "§L\"Nếu có thêm một ngôi sao nữa, hệ sao này đã có giá trị chiến lược cao hơn nhiều.\"§!"

 machine_contract_stellar_ignition_lore_issued: "§L\"Khả năng nhiệt hạch hành tinh khí: Khả thi. Khởi động tiến trình kích hoạt sao.\"§!"
 machine_contract_stellar_ignition_lore_completed: "§L\"Kích hoạt sao thành công. Mức năng lượng phát ra nằm trong thông số dự kiến.\"§!"
 machine_contract_stellar_ignition_lore_failed: "§L\"Quy trình kích hoạt hành tinh bị hủy bỏ. Chưa đạt ngưỡng phản ứng nhiệt hạch.\"§!"

 stellar_ignition_poi_name: "Vị trí Kích hoạt Sao"
 stellar_ignition_poi_desc: "Đến đây để kích hoạt hành tinh khí khổng lồ."

 requires_unignited_gas_giant: "$TRIGGER_FAIL$§RYêu cầu hệ sao phải có một hành tinh khí khổng lồ chưa từng được kích hoạt và không có hiện tượng dị thường§!"
 nomad_contract_stellar_ignition_tt: "Hành tinh khí khổng lồ sau khi kích hoạt sẽ hóa thành một ngôi sao, mở khóa lượng tài nguyên khổng lồ."

 need_stellar_ignition_capabilities: "$TRIGGER_FAIL$§RKhông Tàu Ark nào của chúng ta có tính năng §YĐộng cơ Kích sao§!§!"

# Contract Events
 nomads.3036.name: "Đón Phái đoàn Ngoại giao"
 nomads.3036.intro: "Phái đoàn ngoại giao từ §H[pickup_planet.GetName]§! đã lên Tàu Ark và đang được tiếp đãi theo đúng nghi thức dành cho đại sứ của §H[pickup_planet.owner.GetName]§!."
 nomads.3036.desc: "$nomads.3036.intro$ Chúng ta đã lên lịch hàng loạt hoạt động, bao gồm tham quan Tàu Ark và chia sẻ về lối sống du mục, nhằm giúp chuyến hành trình đến §H[dropoff_planet.GetName]§! của họ thêm phần thú vị."
 nomads.3036.desc.nocomm: "$nomads.3036.intro$ Họ đã cung cấp tin tức ngoại giao về §H[dropoff_planet.owner.GetName]§!, giúp chúng ta thiết lập được liên lạc chính thức."
 nomads.3036.a: "Hãy đưa họ đến nơi an toàn."

 nomads.3045.name: "Phái đoàn Đã tới nơi"
 nomads.3045.desc: "Phái đoàn từ §H[diplomatic_support_issuer.GetName]§! đã đến đích an toàn. Chuyến thăm ngoại giao của họ có thể chính thức bắt đầu, chúc cho sứ mệnh hòa bình của họ gặt hái thành công."

 nomads.3050.name: "Tù nhân Lên tàu"
 nomads.3050.desc: "Nhằm giải quyết rắc rối cho §H[pickup_planet.owner.GetName]§!, một nhóm tù nhân mà chúng ta nhận vận chuyển đã theo tàu chở hàng bước lên Tàu Ark. Dù đang hết sức giữ an toàn, nhưng lượng phạm nhân đông đảo thế này sớm muộn gì cũng sinh chuyện.\n\nHợp đồng cho phép chúng ta nhiều cách xử lý, nhưng không được phép thả ngược họ lại bất kỳ hành tinh nào của §H[pickup_planet.owner.GetName]§!. Mặt khác, các đế chế khác hẳn cũng chẳng vui vẻ gì nếu thuộc địa bỗng dưng ngập tràn tội phạm ngoại bang. Dĩ nhiên, nếu hành sự đủ kín kẽ, họ có thể sẽ chẳng bao giờ biết ta đã làm gì."
 nomads.3050.a: "Chúng ta sẽ đưa họ tới một nơi khác."
 nomads.3050.b: "Cứ để họ ở lại trên tàu."
 nomads.3050.c: "Họ có thể làm nô lệ rất tốt."
 nomads.3050.d: "Hãy trả tự do cho họ."
 nomads.3052.name: "Tù nhân Rời tàu"
 nomads.3052.desc: "Là một phần trong hợp đồng, nhóm tù nhân cuối cùng đã được đưa xuống tàu. Dù đã hết sức thận trọng, rủi ro bị bại lộ vẫn luôn rình rập, và chẳng mấy ai cảm thấy dễ chịu khi chứng kiến một bầy tội phạm ngoài hành tinh tràn vào lãnh thổ của mình."
 nomads.3053.name: "Báo cáo Bàn giao"
 nomads.3053.desc: "Tin tức về việc chúng ta vận chuyển tội phạm vẫn chưa bị lộ. Xem ra chúng ta vẫn chưa bị phát hiện." #All smooth, no complaints
 nomads.3053.desc.issuer.problem: "Chúng ta đã định qua mặt [prisoner_disposal_issuer.GetName] nhưng bất thành. Dù đã tống khứ số tội phạm đi, hành tung của ta đã bại lộ; [prisoner_disposal_issuer.GetName] đã hủy hợp đồng và quỵt tiền thù lao." #Issuer unhappy cancels contract - ewps
 nomads.3053.desc.problem: "Dù hành tung đã bị phát giác, [prisoner_disposal_issuer.GetName] vẫn rất hài lòng vì ta đã giúp họ tống khứ bớt đám tù nhân, và đồng ý thanh toán đủ thù lao cho chúng ta." #We got detected by planet owner and they're unhappy, but we still complete the contract c:
 prisoner_tranfer_tt: "\n§Y£pop£ Dân số Tội phạm§! đã được chuyển tới §Y[From.GetName]§!"

 nomads.3060.name: "Du khách Lên tàu"
 nomads.3060.desc: "Một nhóm du khách đã bước lên Tàu Ark tại hệ sao §H[root.solar_system.GetName]§!, rôm rả chuyện trò đầy háo hức khi ngắm nhìn không gian nhộn nhịp bên trong con tàu.\n\nChúng ta đã vạch sẵn một lộ trình tuyệt đẹp qua nhiều hệ sao kỳ vĩ để họ thưởng ngoạn. Giờ việc còn lại chỉ là mang đến cảnh sắc ngoạn mục đúng như đã hứa."
 nomads.3060.a: "Thiết lập lộ trình tới §H[sightseeing_tour_destination_system.GetName]§!."
 nomads.3060.a.tt: "Hệ sao mục tiêu có thể được theo dõi trong §HNhật ký Tình hình§!."

 nomads.3065.name: "Du khách Thưởng ngoạn"
 nomads.3065.desc: "Các du khách đã tận hưởng cảnh đẹp trong hệ sao §H[root.solar_system.GetName]§!, trầm trồ trước những điều kỳ diệu xung quanh. Họ sẽ trở về nhà với một tâm thế đổi khác, mang theo trải nghiệm thực tế về sự bao la của vũ trụ."
 nomads.3065.a: "Giờ thì trở về §H[sightseeing_tour_end_system.GetName]§! thôi."

 nomads.6005.name: "Cơ hội Bất ngờ"
 nomads.6005.desc: "Trong lúc làm nhiệm vụ hợp đồng cho §H[event_target:contract_issuer.GetName]§!, chúng ta tình cờ phát hiện một lô thùng chứa cổ xưa. Bị đóng băng bao bọc, suýt chút nữa chúng ta đã nhầm chúng với thiên thạch thông thường. Dẫu theo luật trục vớt thì chúng thuộc về ta, nhưng vì phát hiện trong lúc làm thuê cho họ, ta nên cân nhắc bàn giao lại cho §H[event_target:contract_issuer.GetName]§!. Quét bên trong thùng hàng cho thấy..."
 nomads.6005.giveback: "Chúng ta không nên giữ chúng lại."
