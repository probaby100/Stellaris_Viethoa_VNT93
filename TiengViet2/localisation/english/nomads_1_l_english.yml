l_english:

#######################
# NOMADS LOCALIZATION #
#######################

 # For reserved event number ranges, see the top comment in the events file

 NOMADS_TITLE: "Nomads" # Do not translate
 DLC_NOMADS: "$NOMADS_TITLE$"
 vo_nomad_voice: "Người Du Mục"

 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_TITLE: "Khai Thác Chưa Qua Phê Duyệt"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_OWNER_DESC: "Di chỉ khảo cổ tại [solar_system.GetName] đã bị những kẻ du mục thuộc §Y[owner.GetName]§! cướp phá!"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_DESC: "Việc khai quật không phép của chúng ta tại di chỉ khảo cổ đã gây ra sự bất mãn cho §Y[solar_system.owner.GetName]§!."
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_TITLE: "Hợp Tác Khảo Cổ"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_OWNER_DESC: "Những người du mục thuộc §Y[owner.GetName]§! đã khai quật di chỉ khảo cổ tại [solar_system.GetName] và gửi lại cho chúng ta các cổ vật cùng dữ liệu nghiên cứu."
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_DESC: "Công tác khai quật của chúng ta tại một di chỉ khảo cổ thuộc [solar_system.GetName] đã hoàn tất. Chúng ta đã bàn giao toàn bộ cổ vật và tư liệu liên quan cho §Y[solar_system.owner.GetName]§!."
 MESSAGE_ASTRAL_RIFT_STAGE_FINISHED_NOMAD_PERMISSION: "Bạn Đồng Hành Tinh Giới"
 MESSAGE_ASTRAL_RIFT_STAGE_FINISHED_NOMAD_PERMISSION_TITLE: "Những người du mục thuộc §Y[owner.GetName]§! đã thám hiểm $ASTRAL_RIFT$ tại [fromfrom.solar_system.GetName], đồng thời gửi lại cho chúng ta dữ liệu nghiên cứu và sợi tinh giới."

 policy_nomad_total_war: "Hành Vi Chiến Tranh Tổng Lực"
 policy_nomad_total_war_desc: "Chúng ta không cai trị các hành tinh, nhưng đôi khi có thể để một chư hầu ở lại cai quản nơi đó.\n"
 nomad_total_war_subject: "Hàng Phục"
 nomad_total_war_subject_name: "Thiết Lập Chư Hầu Vĩnh Viễn"
 nomad_total_war_subject_desc: "Những vùng đất mới chinh phục nên được cai trị bởi một quốc gia chư hầu trung thành với chúng ta.\n\n§ETự động tạo ra một chư hầu khi chiếm đóng các hành tinh trong Chiến tranh Tổng lực§!"
 nomad_total_war_displace: "Trục Xuất"
 nomad_total_war_displace_name: "Trục Xuất Cư Dân Hành Tinh"
 nomad_total_war_displace_desc: "Sự sống ngoài hành tinh đáng được tiếp tục tồn tại, nhưng các hành tinh gần chúng ta thực sự cần phải được dọn trống.\n\n§ETự động tạo ra một chư hầu tạm thời phụ trách việc di dời dân số địa phương, sau khi hoàn thành nhiệm vụ họ sẽ tự động giải tán§!"
 nomad_total_war_purge: "Thanh Lọc"
 nomad_total_war_purge_name: "Thanh Lọc Hành Tinh"
 nomad_total_war_purge_desc: "Sự sống bị giam cầm trên các hành tinh thật khiếm khuyết, hãy xóa sổ hoàn toàn chúng khỏi thiên hà.\n\n§ETự động tạo ra một chư hầu tạm thời phụ trách thanh lọc dân số địa phương, sau khi hoàn tất họ sẽ tự giải tán và bàn giao toàn bộ tài nguyên tích lũy§!"
 nomad_total_war_requires_purge_not_banned: "$TRIGGER_FAIL$Chính sách $policy_purge$ của chúng ta không cho phép trục xuất dân số bị chinh phục."
 nomad_total_war_requires_purge_allowed: "$TRIGGER_FAIL$Chính sách $policy_purge$ của chúng ta không cho phép thanh trừng dân số bị chinh phục."

 origin_nomadic_purger: "Lực Lượng Thanh Trừng Hành Tinh"
 origin_nomadic_purger_desc: "Một chính quyền du mục được thiết lập lâm thời, chịu trách nhiệm giám sát các hành tinh đang trong quá trình thanh tẩy sạch sự sống."
 origin_tooltip_nomadic_purger_effects: "§YMột đế chế lâm thời, có nhiệm vụ chuyển giao toàn bộ tài nguyên thu được từ hoạt động thanh trừng về cho Bá Chủ§!"
 preset_nomadic_purger: "$origin_nomadic_purger$"
 preset_nomadic_purger_desc: "$origin_nomadic_purger_desc$"
 preset_nomad_tributary: "$preset_tributary$"
 preset_nomad_tributary_desc: "$preset_tributary_desc$"
 preset_nomad_tributary_flavor_desc: "$preset_tributary_flavor_desc$"
 is_a_purging_subject: "$TRIGGER_FAIL$§RĐây là chư hầu tạm thời, sẽ sớm được giải tán.§!"

 effect_every_issued_mission: "Mọi nhiệm vụ đã ban bố"
 requires_tech_arkship_tier_2: "$TRIGGER_FAIL$§RYêu cầu công nghệ §Y$tech_arkship_tier_2$§!§!"

 #######################
# NOMADS ORIGINS
 #######################

 requires_actor_not_nomadic: "$TRIGGER_FAIL$§RChúng ta là §YĐế quốc Du mục§!. Chúng ta không có đường biên giới.§!"
 requires_recipient_not_nomadic: "$TRIGGER_FAIL$§RHọ là §YĐế quốc Du mục§!. Họ không bận tâm đến các giới hạn biên giới.§!"
 not_matching_nomad_regular: "§RChúng ta và §Y[From.GetName]§! chưa đạt được thống nhất về việc thuộc địa nên di động hay định cư lâu dài.§!"

 IS_NOMADIC: "Là Đế quốc Du mục"
 IS_NOT_NOMADIC: "Không phải Đế quốc Du mục"
 IS_NOMADIC_ICON_TIP: "Lựa chọn này khả dụng vì $WHO|H$ là một đế quốc §YDu mục§!."
 trait_pc_ark_preference: "Ưu Tiên Tàu Ark"
 trait_pc_ark_preference_short: "Tàu Ark"
 trait_pc_ark_preference_desc: "$trait_pc_arctic_preference_desc$"
 nomadic_gov_default: "$GOV_NAME$ Du Mục"

 toggle_nomad_on: "§H$nomadic_gameplay_title$§! (§RĐã tắt§!)$NEW_LINE$$ETHIC_GESTALT_CONSCIOUSNESS_NO_TUTORIAL$$NEW_LINE$$nomadic_gameplay_desc$ $DOUBLE_NEW_LINE$§GNhấp để bật $nomadic_gameplay_title$§!"
 toggle_nomad_off: "§H$nomadic_gameplay_title$§! (§GĐã bật§!)$NEW_LINE$$ETHIC_GESTALT_CONSCIOUSNESS_NO_TUTORIAL$$NEW_LINE$$nomadic_gameplay_desc$ $DOUBLE_NEW_LINE$§GNhấp để tắt $nomadic_gameplay_title$§!"
 nomadic_gameplay_tt: "§H$nomadic_gameplay_title$§!$NEW_LINE$$nomadic_gameplay_desc$"

 nomadic_gameplay_title: "Cơ Chế Lối Chơi Du Mục"
 nomadic_gameplay_desc: "§RCơ chế Du mục sẽ thay thế nhiều cơ chế trò chơi§!$DOUBLE_NEW_LINE$— Không thể ['concept_claim'] hoặc sở hữu £system£ §HHệ sao§! và £planet£ §HHành tinh§! $NEW_LINE$— ['concept_colonies'] được chuyên chở bởi £arkship£ ['concept_arkships'], đồng thời chúng cũng đóng vai trò như ['concept_shipyards'] $NEW_LINE$— £construction_ship£ ['concept_logistic_ships'] thay thế £construction_ship£ ['concept_construction_ships'] $NEW_LINE$— £waystation£ ['concept_waystations'] thay thế £mining_station£ ['concept_mining_stations'] và £science_ship£ ['concept_research_stations'] $NEW_LINE$— ['concept_operational_reserves'] thay thế §H$energy_with_icon$§! và §H$minerals_with_icon$§! $NEW_LINE$— Có thể thực hiện £contract£ ['concept_contracts'] cho £planet£ ['concept_settled_empires'] $NEW_LINE$— Có thể khai quật £archaeology£ ['concept_archaeology_site',Di chỉ khảo cổ] vô chủ $NEW_LINE$— Bỏ qua §HĐóng cửa biên giới§!, nhưng hành vi xâm phạm sẽ dẫn đến hình phạt ngoại giao $NEW_LINE$— Có thể sử dụng $arkship_cap_plural$, $nomads_constructor_plural$ và $waystation_plural$ để khai thác §H$w_strategic_plural$§!\n\nHiệu ứng:\n— ['concept_empire_size'] từ §HTàu Ark§!: §G+100%§!\n— ['concept_empire_size'] từ §HQuận§!: §G+100%§!"

 toggle_nomad_disabled_missing_dlc: "§RThiếu Nomads DLC§! Lối chơi du mục yêu cầu gói mở rộng §YNomads§!."
# Voidfarers
 origin_default_nomads: "Kẻ Du Hành Hư Không"
 origin_default_nomads_desc: "Đối với nền văn minh này, hành trình chính là đích đến. Họ đã từ bỏ các điểm định cư vĩnh viễn, lựa chọn sinh sống trên những con tàu Ark khổng lồ, chở theo đồng bào, nền công nghiệp và tham vọng của mình vượt qua biển sao."
 origin_nomad_tooltip_default_effects: "— Khởi nguyên Du mục\n— Bắt đầu với thêm một §HTàu Hậu Cần§!\n"

 START_SCREEN_PART_ONE_DEMOCRACTIC_NOMAD: "Khi tổ tiên chúng ta cho khởi hành [Capital.GetName], họ đã viết vào hiến chương một câu hỏi: ai là người đưa ra quyết định? Giữa lúc các bè phái nổi lên, các tầm nhìn xung đột, những lòng trung thành cũ đan xen với những tham vọng mới chớm nở, câu trả lời họ đưa ra vẫn còn vang vọng qua từng chu kỳ bầu cử: do chúng ta quyết định. Tất cả chúng ta.\n\n[Root.GetGovernmentName] không đơn thuần sinh ra từ chủ nghĩa lý tưởng, mà xuất phát từ một sự đồng thuận gian nan mới đạt được: không một tiếng nói đơn lẻ nào có thể đại diện cho từng sinh mệnh cùng chung sinh tử trên con tàu này. Quyền lực phải do phấn đấu mà có, phải chịu sự giám sát trách nhiệm, và cuối cùng phải được trao trả lại cho nhân dân — những người đã ban cho nó sức mạnh.\n\nNgày nay, khi [Root.Ruler.GetRegnalName] trở thành [Root.GetRulerTitle] của chúng ta thông qua sự ủy thác của quần chúng, bản giao ước này vẫn trường tồn bất diệt.\n"

 START_SCREEN_PART_ONE_OLIGARCHIC_NOMAD: "Khi [Root.GetGovernmentName] được thành lập, vấn đề không nằm ở chỗ ai sẽ là người lãnh đạo — ứng viên chưa bao giờ thiếu — mà là làm thế nào để đảm bảo những kẻ nắm quyền xứng đáng nhận được sự tuân phục của muôn người.\n\nCâu trả lời là thành lập một hội đồng: các thành viên không phải là những kẻ nói to nhất, mà là những người đã dùng thực lực tự thân để giành lấy ghế ngồi. [Capital.GetName] sẽ không hành động chỉ vì lời nói của một người, cũng sẽ không trôi dạt theo ý chí dao động của số đông. Bước tiến của con tàu dựa vào sự đồng thuận của những người đã chứng minh được năng lực cầm lái của mình.\n\nNgày nay, [Root.Ruler.GetRegnalName] đứng giữa những bậc ngang hàng này, mang danh hiệu [Root.GetRulerTitle]."

 START_SCREEN_PART_ONE_DICTATORIAL_NOMAD: "Khi [Root.GetGovernmentName] được thiết lập, câu trả lời cho việc ai nên nắm quyền lãnh đạo lại đơn giản hơn hầu hết mọi người sẵn lòng thừa nhận: người có năng lực sẽ ngồi lên.\n\n[Capital.GetName] sẽ không vì các ủy ban mà bước chậm lại. Giữa cõi hư không, cái giá phải trả giữa một quyết định kịp thời và việc đã quá muộn màng được đong đếm bằng sinh mạng và giáp trụ của chiến hạm. [Root.GetRulerTitle] một mình gánh vác trọng trách này, nay đại quyền do [Root.Ruler.GetRegnalName] nắm giữ, [Capital.GetName] sẽ tiến về hướng mà người chỉ định.\n"

 START_SCREEN_PART_ONE_IMPERIAL_NOMAD: "Trong số những người đã khởi động [Capital.GetName], có một gia tộc mà quyền tuyên bố lãnh đạo là bất khả xâm phạm. Vị [Root.GetRulerTitle] đầu tiên xuất hiện chính vì họ đã đứng ở vị trí cầm lái. Đối với một dân tộc không còn quê hương để trở về, huyết thống chính là hiện thân của sự tiếp nối. Lịch sử của [Capital.GetName] và lịch sử của gia tộc đó vốn dĩ là một. Giờ đây, [Root.Ruler.GetRegnalName] đứng tại nơi mà các đời [Root.GetRulerTitle] từng đứng, và [Capital.GetName] sẽ mãi mãi thuộc về họ.\n"

 START_SCREEN_PART_ONE_MACHINE_NOMAD: "Khi [Root.GetGovernmentName] của chúng ta kích hoạt giao thức tàu Ark, các chương trình con đã chuyển đổi liền mạch. Các đơn vị máy móc hoàn toàn hòa nhập vào cấu trúc và hệ thống của phi thuyền, khiến các thông số vận hành của chúng ta tăng theo cấp số nhân."

 START_SCREEN_PART_ONE_HIVE_NOMAD: "[Root.GetGovernmentName] vẫn luôn thích nghi với môi trường như thường lệ, nhanh chóng thoát khỏi sự trói buộc của hành tinh để tiến hóa thành dạng sống tồn tại trong không gian vũ trụ. Các cá thể con và nút thần kinh của chúng ta giờ đây phát triển phồn thịnh trong các lối đi rộng lớn và các hệ sinh thái nhân tạo tràn đầy sức sống của tàu Ark. Chúng ta chính là tàu Ark [Capital.GetName], và tàu Ark chính là chúng ta.\n"
 START_SCREEN_PART_ONE_DEVOURING_SWARM_NOMAD: "[Root.GetGovernmentName] nhanh chóng thích nghi dưới sự thôi thúc của cơn đói khát vô tận. Bầy đàn cấu thành từ các cá thể con và nút thần kinh của chúng ta đã phá vỡ xiềng xích hành tinh để tràn ra ngoài, biến tàu Ark thành tổ mới của chúng ta, tham lam lan rộng đến mọi ngóc ngách hành lang và hệ sinh thái nhân tạo bên trong.\n"

 START_SCREEN_PART_ONE_MEGACORP_NOMAD: "Những người sáng lập có tầm nhìn xa trông rộng của chúng ta đã nhận ra rằng không gian vũ trụ chính là thị trường tối thượng. Thông qua việc sáp nhập chiến lược, thâu tóm quyết liệt và các khoản đầu tư sinh lời béo bở, ban lãnh đạo doanh nghiệp của chúng ta đã đạt được mức tăng trưởng theo cấp số nhân cùng tỷ suất lợi nhuận vô song.\n\n[Root.Ruler.GetRegnalName] đảm nhận vị trí [Root.GetRulerTitle] là vì sổ sách kế toán ghi nhận như vậy, và trên con tàu [Capital.GetName] tối tân nhất, sổ sách chính là kết luận tối hậu.\n"

 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_REGULAR: "[Capital.GetName] trước hết là một con tàu của nhân dân. Vành đai cư trú rộng lớn, các khu chợ mở và những hội trường tụ họp náo nhiệt của nó đều được thiết kế xoay quanh mọi khía cạnh đời sống của [Species.GetAdj]. Những thế hệ lớn lên dọc theo hành lang chiến hạm đã trui rèn sự thông thạo gần như bản năng đối với việc du hành cõi hư không. Phi công của chúng ta điều khiển phi thuyền còn thuần thục hơn kiểm soát cơ thể chính mình, đội ngũ hậu cần có thể nhận biết \"nhu cầu\" của con tàu trước khi kho dự trữ cạn kiệt, các kỹ sư của chúng ta có thể nghe ra sự cố trước khi các chỉ số thiết bị hiển thị bất thường. Giờ đây, khi [GetStartingDrive] cho phép chúng ta bay lượn giữa các vì sao chỉ trong vài tuần thay vì hàng năm trời, cõi hư không này đã trở nên nhỏ bé hơn."
 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_GESTALT: "[Capital.GetName] là một phần mở rộng của [Root.GetGovernmentName]. Mọi hệ thống đều do tập thể trực tiếp quản lý; bất kỳ sự cố nào cũng được phát hiện và khắc phục trước khi chuyển biến xấu; mỗi chu trình tuần hoàn tài nguyên đều vận hành không chút lãng phí hay chậm trễ. Giờ đây, [GetStartingDrive] cho phép chúng ta di chuyển giữa các vì sao chỉ trong vài tuần thay vì hàng năm trời, những mảnh ghép vốn luôn thuộc về bản thể chúng ta cuối cùng đã có được không gian rộng mở để chứng minh giá trị."

 START_SCREEN_PART_TWO_MILITARY_NOMAD: "[Capital.GetName] được chế tạo nhằm bảo vệ tất cả những gì nó chuyên chở. Giáp thân tàu của nó cực kỳ kiên cố, các boong vũ khí được bố trí những thuyền viên [Species.GetAdj] sẵn sàng chiến đấu, và các giao thức ứng phó khủng hoảng của nó đã được tôi luyện qua hàng thế kỷ vượt qua những hải trình hiểm trở, đủ sức cắt đuôi hoặc nghiền nát bất kỳ kẻ thù nào đe dọa hạm đội. Kỷ luật thép này đã đúc nên một pháo đài bay, và cùng với phát minh [GetStartingDrive], toàn bộ thiên hà chắc chắn sẽ được chứng kiến uy lực hùng mạnh của chúng ta."

 START_SCREEN_PART_TWO_SCIENCE_NOMAD: "Thiết kế tổng thể của [Capital.GetName] được triển khai xoay quanh các sàn phòng thí nghiệm của nó. Các đường ống dẫn năng lượng, hệ thống tuần hoàn khí quyển, thậm chí cả bố cục khu cư trú — mọi quy hoạch đều phục vụ cho mục đích khám phá khoa học. Trên tàu, ranh giới giữa người vận hành và nhà khoa học chưa bao giờ rạch ròi. Các [GetTechnicianPlural] phụ trách lá chắn của chúng ta hiểu sâu sắc các nguyên lý vật lý đằng sau bức màn chắn mà họ bảo trì, còn các đội ngũ sửa chữa cũng có thể phác thảo những bản thiết kế hoàn toàn mới. Và [GetStartingDrive] đã mang lại cho [Capital.GetName] tầm hoạt động tương xứng với các công cụ mà nó mang theo. Chúng ta dự định sẽ dấn sâu hơn vào cuộc nghiên cứu tìm tòi."

# Heirs of the Khan

 origin_heirs_of_the_khan: "Hậu Duệ Đại Hãn"
 origin_heirs_of_the_khan_desc: "$cannot_settle$\nBộ tộc này từng là người thừa kế hợp pháp của Hãn quốc, nhưng đã bị lật đổ bởi sự phản bội. Sau khi bị chính những kẻ mà họ coi là ruột thịt đâm sau lưng, giờ đây họ phiêu bạt trên các tuyến siêu không gian với tư cách là những kẻ du mục, tích lũy thực lực để mong ngày báo thù tuyết hận."
 origin_heirs_of_the_khan_effects: "— Khởi nguyên Du mục\n— Định kỳ bị các chiến hạm Marauder §Rthù địch§! truy kích.\n— Nếu sống sót, có thể trở thành Đại Hãn\n— Có thể thành lập thuộc quốc kiểu §YThái Ấp§!"

 START_SCREEN_HEIRS_OF_THE_KHAN: "Kể từ khi Hãn quốc tồn tại, bộ tộc của chúng ta đã luôn ở đây. Chúng ta đã chứng kiến những chiến thắng huy hoàng, những trận đánh vĩ đại, cùng sự hưng thịnh và suy vong của các Đại Hãn.\n\nBởi vậy, khi thời khắc bầu chọn Đại Hãn mới đến, chúng ta đã đứng lên đòi quyền kế thừa ngai vàng mà chính chúng ta đã góp công rèn đúc. Đó lẽ ra phải là thời khắc thuộc về chúng ta, thế nhưng, chúng ta lại bị phản bội.\n\nNhững đồng minh thân cận nhất đã kích động các bộ lạc khác quay lưng lại với chúng ta. Các trưởng lão của chúng ta bị thảm sát. Giấc mơ mà chúng ta đổ máu đấu tranh đã bị cướp đoạt.\n\nNgay cả lúc này, những kẻ soán ngôi vẫn phái những sát thủ thiện nghệ truy lùng chúng ta, như thể chính sự tồn tại của chúng ta đã làm hoen ố danh phận thống trị mà chúng cướp được. Chúng ta chỉ là tàn dư của một dòng máu huy hoàng năm xưa, bị săn đuổi, tứ tán khắp nơi.\n\nKhi chúng ta trở lại, mối thù này sẽ được tôi luyện từ ngọn lửa hờn căm."

 NAME_Hunter_Marauders: "Kẻ Hành Quyết"
 NAME_Hunting_Fleet: "Rìu Đồ Tể"
 NAME_Khan_Aspirant: "Ý Chí Đại Hãn"

 nomads.506.name: "Kẻ Săn Đuổi Quen Thuộc"
 nomads.506.desc: "Kể từ khi lưu vong, chúng ta vẫn luôn chờ đợi sự xuất hiện của các đầu dò định vị. Những kẻ săn tiền thưởng bám sát ngay phía sau, mục tiêu của chúng chính là §Y[capital_scope.GetName]§!. Để chúng ta chết trong lưu đày quả thực rất hợp ý những kẻ soán ngôi.\n\nChúng ta sẽ khiến chúng phải thất vọng."
 heirs_battlestations: "Toàn Viên Sẵn Sàng Chiến Đấu"
 heirs_battlestations_desc: "Truyền toàn bộ năng lượng vào hệ thống vũ khí, hãy đón tiếp chúng bằng sự lạnh lùng tột độ."
 heirs_evasive_actions: "Hành Động Né Tránh"
 heirs_evasive_actions_desc: "Tăng tốc hết cỡ, để chúng ngửi khói đuôi tàu của chúng ta."

 HEIRS_HUNTERS_HAVE_SPAWNED_TITLE: "Phát Hiện Hạm Đội Thợ Săn Tiền Thưởng"
 HEIRS_HUNTERS_HAVE_SPAWNED_DESC: "Chúng ta phát hiện một hạm đội Marauder đang truy kích $ARKSHIP|Y$"
 HEIRS_RAID_INTERCEPTED_TITLE: "Đánh Chặn Hạm Đội Đột Kích"
 HEIRS_RAID_INTERCEPTED_DESC: "Chúng ta đã đánh chặn một hạm đội đột kích của Marauder tại hệ sao $SYSTEM|Y$. Vào trạng thái chiến đấu!"

 nomads.546.name: "Kẻ Săn Đuổi Bại Trận"
 nomads.546.desc: "Chúng ta lại một lần nữa đánh bại tay sai của kẻ soán ngôi. Chúng sẽ không ngừng xâm phạm, và lần tới sẽ còn hung hãn hơn. Nhưng nếu chúng ta có thể tiêu diệt đủ nhiều kẻ địch, có lẽ ngay cả chúng cũng sẽ hiểu rằng muốn xóa sổ chúng ta không phải là chuyện dễ dàng.\n\nChỉ cần [capital_scope.GetName] vẫn còn giương cờ, tuyên bố chủ quyền của chúng ta vẫn còn nguyên hiệu lực. Chúng ta phải cho chúng biết rằng có những di sản vĩnh viễn không bao giờ lụi tàn."
 nomads.546.a: "Phải chuẩn bị sẵn sàng."

 nomads.555.name: "Lắng Nghe Yêu Cầu"
 nomads.555.desc.1: "\"Dừng tay! Trình độ cơ động điều khiển của các người đã chứng minh các người thực sự là một Marauder đích thực, bị trục xuất thì đã sao. Hôm nay chúng tôi sẽ không vì cái gọi là danh dự mà trả giá thêm nữa. Hãy ra giá đi, tha cho chúng tôi một mạng.\" [Root.GetSpeciesName] hét lên trên §Y[From.GetName]§!, bên cạnh là đài chỉ huy đổ nát."
 nomads.555.desc.2: "Hạm đội địch bị chúng ta đánh bại nhanh chóng phát tín hiệu đầu hàng.\n\n\"Đánh thế là đủ rồi, lần này các người chiếm thế thượng phong. Giờ thì các người muốn chúng tôi giao ra thứ gì để có thể rửa sạch vết nhơ nhỏ này trên tàu rồi tiếp tục lên đường?\""
 nomads.555.desc.3: "\"Chúng tôi đầu hàng! Xin người! Người còn nhớ chúng tôi không? Chúng tôi vẫn luôn trung thành với bộ tộc của người. Cái gọi là lưu đày vốn chỉ là một trò lừa bịp. Hãy cho chúng tôi biết làm sao mới có thể cống hiến!\"\n\nThuyền trưởng trên §Y[From.GetName]§! dường như sắp sụp đổ, [Root.Species.GetMouthName] của họ run rẩy."

 nomads.555.a: "Đừng để ta nhìn thấy các ngươi lần nữa là được."
 nomads.555.b.1: "Chúng ta không chấp nhận đầu hàng."
 nomads.555.b.2: "Đây mới là cõi hư không thực sự. Ở đây không có đầu hàng."
 nomads.555.b.3: "Nếu các ngươi thực sự trung thành thì đã cùng rời đi với chúng ta rồi."
 nomads.555.b.tt: "Tiêu diệt hạm đội Marauder."
 nomads.555.c.1: "Hoặc giao hàng hoặc bỏ mạng, tự chọn lấy đi."
 nomads.555.c.2: "Cứ coi đây là buổi phỏng vấn đi. Rốt cuộc ai sống sót đến cuối cùng có thể gia nhập chúng ta."
 nomads.555.c.3: "Chúng ta muốn toàn bộ thuyền viên của các ngươi."
 nomads.555.c.4: "Không đánh què một kẻ trong số các ngươi thì những kẻ khác sẽ không biết chuyện gì đã xảy ra đâu."
 nomads.555.c.4.tt: "Cuộc săn lùng tiếp theo sẽ bị trì hoãn thêm vài năm."
 nomads.555.c.5: "Hoặc là giao Đô đốc hạm đội của các ngươi ra đây, hoặc là chúng ta sẽ tự kéo hắn ra khỏi đống phế tích."

 nomads.570.name: "Mặc Cả"
 nomads.570.desc.1: "Một chùm tín hiệu khẩn cấp ưu tiên cao truyền đến từ hệ sao §Y[From.solar_system.GetName]§!; màn hình của chúng ta ngập tràn hình ảnh truy binh.\n\n\"Múa may hay ho đấy, nhưng các người sắp chết ngay trước mặt bọn ta rồi, thế thì hết múa nhé. [GetHeirsBargain]"
 nomads.570.desc.2: "Giọng nói của kẻ thù vang vọng trong hệ sao §Y[From.solar_system.GetName]§!, truy binh đã xuất hiện trên màn hình hiển thị.\n\n\"Cuộc rượt đuổi kết thúc tại đây rồi, những kẻ lưu vong. Bọn ta đã khóa mục tiêu vào lò phản ứng của các người. [GetHeirsBargain]"
 nomads.570.desc.3: "Ký tự của quân Marauder xâm nhập vào màn hình chính của §Y[capital_scope.GetName]§!, cùng lúc đó, hạm đội truy sát chúng ta ùa ra từ tuyến siêu không gian.\n\n\"Là một kẻ lưu vong, ngươi bay lượn cũng nhanh nhẹn đấy. Nhưng ngươi đã bị kẹt trong đường bay trảm sát của bọn ta rồi. [GetHeirsBargain]"
 nomads.570.bargain.1: "Cảm biến của bọn ta nổi tiếng là không đáng tin cậy. Nếu các người hào phóng gửi chút năng lượng, có lẽ bọn ta sẽ... coi như nhìn nhầm.\""
 nomads.570.bargain.2: "Lùi lại. Bảo thủ lĩnh của các người tới đây. Làm một trận quyết đấu công bằng giữa [Species.GetName] và [Ruler.Species.GetName]. Nếu thua, ta sẽ bắn hạ tất cả các người.\""
 nomads.570.bargain.3: "Nói thật nhé, hợp đồng tiền thưởng truy nã các người còn không bõ tiền đạn dược. Đưa ra điều kiện tốt hơn đi, bằng không thì chết một cách rẻ rúng nhé.\""

 nomads.570.a: "Đối với một [Species.GetName] sắp chết thì ngươi nói hơi nhiều rồi đấy."
 nomads.570.b: "Chúng ta sẽ trả phí bảo hộ."
 nomads.570.c: "[Owner.GetRulerTitle] của chúng ta không sợ ngươi!"
 nomads.570.c.tt.1: "$tt$Hạm đội Marauder chuyển sang §Rthù địch§!."
 nomads.570.c.tt.2: "Hạm đội Marauder phớt lờ chúng ta."
 nomads.570.d: "Chúng ta sẽ mua đứt hợp đồng của các ngươi."

 heirs_khan_candidate_title: "Trống Trận"
 heirs_khan_candidate_desc: "Thời khắc đã điểm. Đại Hãn mới sắp sửa được bầu chọn. Để kết thúc kiếp lưu đày, chúng ta phải chứng minh thực lực của mình."
 heirs_khan_rally_point_name: "Chiến Trường"
 heirs_khan_rally_point_desc: "Hệ sao này được chọn làm võ đài quyết đấu để định đoạt người kế vị Đại Hãn tiếp theo."
 heirs_khan_in_waiting_name: "Ứng Viên Đại Hãn"
 heirs_khan_in_waiting_desc: "Soái hạm của Đại Hãn đương nhiệm. Nếu có thể đánh bại nó, chúng ta sẽ đoạt được ngôi vị Hãn vương."
 nomads.600.name: "Kẻ Tuyên Bố Quyền Lực"
 nomads.600.desc: "Những kẻ hèn nhát lưu đày chúng ta rốt cuộc cũng chuẩn bị hành động.\n\n§Y[marauder_heir.GetName]§! đang tụ tập lại thành một khối nhằm tôn xưng kẻ thù của chúng ta làm Đại Hãn mới.\n\nNếu muốn chấm dứt tình trạng lưu vong, chúng ta phải nắm bắt lấy thời cơ. Trước khi tên [aspiring_khan.GetSpeciesNameInsult] này củng cố quyền lực và vĩnh viễn làm hoen ố di sản của chúng ta, chúng ta có mười năm để phát động thách thức đối với hắn.\n\nThiết lập lộ trình hướng về §Y[marauder_rally_point.GetName]§!."
 nomads.600.a: "Hợp đồng mới: Đoạt lại Ngai vị Đại Hãn"

 nomads.605.desc: "Hạm đội hùng vĩ dàn trận nghiêm mật tại §Y[solar_system.GetName]§!, ngạo mạn mang danh xưng §Y$NAME_Chosen_of_the_Great_Khan$§!.\n\nSau đó, một lời kêu gọi quen thuộc không chút hoa mỹ truyền đến:\n\n\"Kẻ lưu vong mà cũng dám quay lại sao? Lẽ nào các ngươi không có chút tự biết mình để chết dần mòn trong bóng tối và bị lãng quên trong nhục nhã ư? Vậy thì bọn ta sẽ tự tay tiễn các ngươi lên đường.\"\n\nVũ khí của Kẻ Được Chọn bắt đầu tích năng, các đồng bào Marauder khác của chúng ta cũng vào vị trí sẵn sàng. Trong trận quyết đấu như thế này, không một ai dám vượt qua giới hạn, bởi kết quả sẽ định đoạt ai trở thành Hãn vương mới của họ."
 nomads.605.a: "Rời khỏi ngai vàng của chúng ta."

 nomads.610.name: "Chính Danh"
 nomads.610.base: "Sự tĩnh lặng bên trong khoang chỉ huy bị phá vỡ bởi âm thanh bùng nổ của những dòng thông điệp ùa về như thủy triều. Các thị tộc tập hợp đang dùng sự huyên náo sục sôi để tôn kính nhà vô địch mới của họ"
 nomads.610.desc: "$nomads.610.base$ cùng những lời thề trung thành.\n\nChúng ta đã làm được. Ngai vàng đã thuộc về chúng ta."
 nomads.610.a: "Gõ vang hồi trống trận."
 nomads.610.a.tt: "Trở thành Đại Hãn, rời khỏi tất cả các Liên Bang và Cộng Đồng Thiên Hà."
 nomads.610.b: "Thời đại của Đại Hãn đã kết thúc. Hãy để chúng ta cho các ngươi thấy lưu đày đã dạy chúng ta điều gì."
 nomads.610.b.tt: "Các bộ lạc tập hợp sẽ trở thành chư hầu của chúng ta."
 nomads.610.c: "Đại thù đã trả, những kẻ còn lại có thể rời đi."
 nomads.610.c.tt: "Mặc kệ những kẻ Marauder đó."

 nomads.615.desc: "$nomads.610.base$.\n\nTuy nhiên, mọi chuyện vẫn chưa kết thúc. Vẫn còn những kẻ lưu vong khác sở hữu quyền kế thừa vương vị. Theo luật lệ và tập tục, họ phải phát động thách thức với chúng ta trong vòng ba năm, bằng không sẽ vĩnh viễn bị coi là kẻ bị ruồng bỏ."
 nomads.615.a: "Hãy để chúng đến."

 nomads.620.name: "Bước Lên Đỉnh Cao"
 nomads.620.desc: "Thời cơ đã đến. Những đối thủ nhút nhát của chúng ta đã bỏ cuộc. Mọi kẻ soán ngôi tiềm tàng khác đều đã bị xử lý xong xuôi. Sức mạnh thống nhất của các thị tộc đang ủng hộ chúng ta.\n\nCuối cùng, chúng ta đã ngồi lên ngai vàng thuộc về chính mình."

 nomads.625.name: "Soán Ngôi Đoạt Vị"
 nomads.625.desc: "Trên đường tiến tới §Y[marauder_rally_point.GetName]§!, chúng ta nhận được một tin tức đáng thất vọng: một kẻ tuyên xưng ngai vàng đối đầu với chúng ta đã đánh bại mục tiêu trước chúng ta một bước. Vị Đại Hãn tương lai đã bị tiêu diệt. Giờ đây, [From.GetName] tuyên bố sở hữu ngai vàng.\n\nTheo tập tục, chúng ta phải đánh bại soái hạm của chúng trong vòng ba năm, bằng không sẽ mất quyền thống trị."

 nomads.630.name: "Mất Quyền Tuyên Bố"
 nomads.630.desc: "Sau khi bại trận trước §Y[From.GetName]§!, chúng ta buộc phải từ bỏ tuyên bố đối với ngôi vị Hãn vương. Giờ đây chúng ta chỉ có thể giương mắt nhìn kẻ khác đoạt lấy ngai vàng."

 nomads.635.name: "Đại Hãn Băng Hà"
 nomads.635.desc: "Hãn vương [From.GetName] đầy vinh quang của chúng ta đã băng hà gần đây. Theo truyền thống, giờ đây chúng ta phải bàn giao quyền lực đi kèm với ngai vàng. Các đồng minh Marauder đã ngừng cử các hạm đội tiếp viện đến hỗ trợ sự nghiệp của chúng ta.\n\nGiờ chúng ta phải quyết định cách xử lý phần còn lại của thiên hà. Nhiều nền văn minh không quen thuộc với truyền thống của chúng ta đã chấp nhận sự thống trị này vì lý do này hay lý do khác, nhưng họ đã nhận ra sự suy yếu trong ách cai trị của chúng ta."
 nomads.635.a: "Truyền thống là lẽ phải, chúng ta sẽ từ bỏ thần dân của mình."
 nomads.635.a.tt: "Giải phóng toàn bộ các nước chư hầu, nhưng tăng mạnh độ thiện cảm và niềm tin với tất cả chư hầu.\n\nTừ bỏ quyền kiểm soát tất cả các căn cứ sao, trao trả quyền kiểm soát lại cho quân Marauder thân thiện."
 nomads.635.b: "Hãn quốc [Root.GetName] vạn tuế!"

 nomads.700.name: "Tìm Kiếm Báo Thù"
 nomads.700.desc: "Tàn quân bại tướng của thị tộc cướp phá đã tìm đến tận cửa. Có vẻ như sau khi quê nhà sụp đổ, họ cảm thấy việc lãng quên chuyện chúng ta từng bị lưu đày là điều khá tiện lợi. Yêu cầu của họ rất đơn giản: \"Tiếp quản ngôi vị Đại Hãn, khắc sâu danh hiệu của bộ tộc chúng ta lên bầu trời sao của tất cả những kẻ từng hãm hại chúng ta.\"\n\nMặc dù quy mô hạm đội này không thể sánh bằng bất kỳ Đại Hãn quốc thực thụ nào, nhưng những gì họ cung cấp chính là tất cả những gì chúng ta từng khao khát. Và điều duy nhất chúng ta cần làm là tuyên bố toàn bộ thiên hà đều là kẻ thù của chúng ta."

 nomads.700.a: "Gõ vang hồi trống trận!"
 nomads.700.b: "Chúng ta không có hứng thú, đi tìm kẻ ngốc khác đi."

 marauder.750.2.desc.low_kills: "Ha-ha-ha-y-da!! Ai đây thế này? Ngươi lái chiến hạm của mấy bộ tộc đất bùn khác, nhìn cùi bắp quá đi mất. Sao thế? Chơi cờ bạc thua sạch cả hạm đội rồi à?"
 marauder.750.2.desc_01: "Đây chẳng phải là tên Man tộc Tinh tú mà bọn ta thích nhất sao! Ha-ha-ha-y-da!!! Ngươi khá hơn nhiều so với đám Man tộc Tinh tú đã đuổi ngươi đi đấy."
 marauder.750.2.desc_02: "Ha-ha-ha-y-da — chờ đã. Các người không phải đám mọi rợ bùn lầy sống trên hành tinh. Các người tới đây để điều tra vụ tập kích lần trước à? Có kẻ phái các người tới đòi lại khoáng sản của chúng ư?"
 marauder.750.2.desc_03: "$marauder.20.2.desc_03$"
 marauder.750.2.desc.khan: "Ha-ha-ha-y-da!!! Đại Man tộc Tinh tú tới rồi! Mau, mở kênh liên lạc lên!"
 marauder.750.2.desc.overlord: "Hê-y-y-y! Tù trưởng của bộ tộc bùn lầy đã tới! Chúng tôi giờ thuộc quyền dưới trướng của ngài. Có chỉ thị gì không, Đại ca?"
 marauder.750.2.desc.proven: "Hê-y-y-y! Bọn ta biết ngươi. Ngươi chém giết rất cừ, hơn nữa còn có nanh vuốt. Ngươi muốn gì nào?"

 marauder.750.3.desc.low_kills: "Ngươi có thể đã bị đồng bào mình ruồng bỏ, nhưng không phải là hết thuốc chữa. Dưới sự chở che của Mẫu Thân Hư Không, bất kỳ ai cũng có thể trỗi dậy, miễn là ngươi chứng minh được giá trị."
 marauder.750.3.desc_01: "Tàu của ngươi đi qua nơi này đã mạo phạm đến vị Phu nhân Vĩ đại của chúng ta. Chúng ta sẽ thay mặt ngươi thỉnh cầu người."
 marauder.750.3.desc_02: "Ngươi vẫn còn sống sao? Thế thì tốt. Chúng ta cứ ngỡ ngươi đã bị lũ đặc vụ dị giáo truy lùng xử lý rồi chứ.\n\nKhông, chúng ta không nói về bộ tộc cũ của ngươi. Chúng ta đang nói về những kẻ thù thực sự."
 marauder.750.3.desc_03: "Mẫu Thân Hư Không nhìn về phía ngươi và mỉm cười. Ngươi đang ở cạnh những người bạn. [marauder_country_3.GetName] hôm nay có thể giúp gì được cho ngươi?"
 marauder.750.3.desc.khan: "Thánh Tử Hư Không. Tín đồ chúng tôi hôm nay có thể cống hiến gì để hiện thực hóa đại nguyện vĩ đại của Người?"
 marauder.750.3.desc.overlord: "Mẫu Thân Hư Không đã chứng kiến sự sắp đặt này và không phản đối. Chúng tôi xin nghe theo mọi sự sai bảo của ngài. Ý chí của ngài là gì?"
 marauder.750.3.desc.proven: "Ngươi đã bay qua một chặng đường đằng đẵng. Mẫu Thân Hư Không không quên những thử thách của ngươi. Điều gì đã đưa ngươi đến với chúng ta?"

 marauder.750.a: "Các người có thể giúp chúng ta chống lại [marauder_country_1.GetName] không?"
 marauder.750.a.response.2: "Hê-y-y-y-y! Ngươi hài hước thật đấy, Man tộc Tinh tú. Không đời nào. Ngươi quá yếu ớt, không xứng với những cú đập búa của bọn ta. Hãy thắng vài trận chiến, mọc thêm nanh vuốt đi đã, rồi có lẽ ngươi mới xứng đáng với cái tên Man tộc Tinh tú."
 marauder.750.a.response.3: "Hiện tại vẫn chưa phải lúc. Mẫu Thân Hư Không không hài lòng về ngươi. Có lẽ sau khi ngươi bù đắp những sai lầm trước kia, Người sẽ nhân từ hơn đôi chút."
 marauder.750.b: "Đã đến lúc rồi, hãy gia nhập cùng chúng ta."
 marauder.750.c: "Cơ hội ngàn năm có một, hãy giúp chúng ta ngăn chặn kẻ soán quyền đó!"
 marauder.750.d: "Không cần cử quân tiếp viện cho chúng ta nữa."
 marauder.750.e: "Chúng ta đã sẵn sàng tiếp nhận viện binh của các người một lần nữa."

 marauder.755.desc: "Bộ tộc cũ của chúng ta từ chối nhận liên lạc. Giờ đây chúng ta phải đơn thương độc mã tác chiến."
 marauder.755.desc.khan_pending: "Liên lạc của chúng ta lại bị từ chối một lần nữa. Để đáp lại, chúng ta nhận được một tin nhắn tự động:\n\n\"Hãn vương vẫn chưa sẵn sàng chấp nhận sự đầu hàng của các ngươi. Hãy đợi đến khi tiếng trống trận vang lên rồi hãy quay lại.\""
 marauder.755.a: "Chúng ta sẽ buộc chúng phải thừa nhận mình."

 marauder.760.desc.3_kills: "Ngươi mà cũng dám liên lạc lại với chúng ta sao?\n\nChỉ ăn may thắng được vài lần mà ngươi đã vênh váo tưởng mình là lãnh chúa quân phiệt rồi đấy. Hư không nuốt chửng kẻ dũng cảm, và cũng nuốt chửng cả những kẻ ngu xuẩn như nhau. Đừng nhầm lẫn may mắn với thực lực."
 marauder.760.desc.10_kills: "Tên tuổi của ngươi làm hoen ố kênh liên lạc của chúng ta, sự sống sót hèn hạ của ngươi làm lu mờ danh dự của chúng ta. Hãy kết thúc tại đây. Lần tới khi chúng ta phái hạm đội truy sát ngươi, để tiết kiệm thời gian cho đôi bên, hãy tắt thẳng lá chắn của ngươi đi nhé.\n\nHãy chết trên sa trường như một [Root.Species.GetSpeciesName] thực thụ."
 marauder.760.desc.20_kills: "Bất kể chuyện gì xảy ra, hư không dường như cũng không chịu lưu giữ ngươi lại. Chúng ta đã xóa tên ngươi khỏi sổ sách, thiêu rụi cờ hiệu của ngươi, đem gương mặt ngươi làm bài học cảnh báo cho [Root.Species.GetSpawnNamePlural]. Thế nhưng, ngươi vẫn khắc sâu dấu ấn của mình lên giáp trụ của chúng ta. Chúng ta đã cử đội trinh sát, rồi đến đội đột kích, và cuối cùng là cả hạm đội. Các thị tộc bắt đầu xì xào rằng trục xuất ngươi là một sai lầm. Những lời lẩm bẩm đó sẽ chấm dứt tại đây.\n\nTại sao ngươi cứ không chịu chết đi hả?!"
 marauder.760.desc.post_khan_1: "Chào mừng về nhà, những người thừa kế. Hôm nay người cần chúng tôi làm gì cho người?"
 marauder.760.desc.post_khan_2: "Gần đây có lập được chiến tích kinh người nào không? Chúng tôi vừa mới giao thủ với một con Tiyanki khổng lồ xong. Tốc độ tái tạo của nó còn nhanh hơn tốc độ tia laser cắt vào thịt."
 marauder.760.desc.post_khan_3: "A, lũ phản bội đã qu— à xin lỗi, quen mồm. Hôm nay các vì sao lại đưa ngươi đến nơi đâu rồi?"

 marauder.765.desc.khan_01: "Đại Hãn, uy danh của Người khiến toàn bộ thiên hà phải run rẩy. Hạm đội của chúng ta bước tiếp theo nên hướng mũi kiếm về phương nào?"
 marauder.765.desc.khan_02: "Hãn vương của muôn Hãn vương! Tại mọi cảng hư không, các thị tộc đều đang ca tụng uy danh của Người. Chúng tôi cung kính chờ lệnh.\n\nHôm nay, chúng ta sẽ thiêu rụi những thế giới nào?"
 marauder.765.desc.khan_03: "Đại Hãn! Xin hãy cho chúng tôi một cơ hội thể hiện lòng dũng cảm, để chúng tôi chứng minh lòng trung thành thực sự. Năm xưa trục xuất Người là nỗi sỉ nhục tột cùng của chúng tôi, nếu chúng tôi không xứng đáng được cứu rỗi, xin hãy để chúng tôi bị hủy diệt dưới hỏa lực của pháo gia tốc khối lượng!"

 marauder.765.a: "Trước khi chúng ta đưa ra yêu cầu, hãy tạm giữ lại viện binh."
 marauder.765.b: "Khôi phục việc điều động viện binh cho chúng ta."

