 arkship_nanotech_consume_world: "Xâm Thực Nano"
 arkship_nanotech_consume_world_desc: "§LTriển khai bầy máy móc nano để phân rã và nuốt chửng một hành tinh có thể sinh sống, thu hồi và nhân bản nanobot từ sinh khối và thành phần khoáng sản của nó.§!"
 arkship_nanotech_consume_world_effect: "$PLANET_EFFECTS_HEADER$$TABBED_NEW_LINE$— Hành tinh dần dần bị nanobot nuốt chửng, sản xuất §H$nanites_with_icon$§!.$TABBED_NEW_LINE$— Sau khi hoàn tất, mục tiêu sẽ biến đổi thành §Hthế giới nano không thể sinh sống§!."
