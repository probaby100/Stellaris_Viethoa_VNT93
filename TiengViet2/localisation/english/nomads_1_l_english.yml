 councilor_star_seekers: "Kẻ Tìm Kiếm Các Vì Sao"
 councilor_star_seekers_desc: "Chính $TITLE$ là người đã dẫn dắt Tàu Ark của chúng ta băng qua cõi hư không, vượt qua vũ trụ, sải bước tiến về phía hàng ngàn thứ định mệnh."
 councilor_corporate_star_seekers: "Sĩ Quan Thám Hiểm Luân Phiên"
 councilor_corporate_star_seekers_desc: "$TITLE$ là người lập kế hoạch cho tất cả những trải nghiệm mới mẻ, dung hợp những khám phá mới nhất của chúng ta vào trong danh mục hoạt động không ngừng thay đổi của chúng ta"
 casus_belli_cb_nomad_raid: "Quyền Kiếp Lược Du Mục"
 casus_belli_cb_nomad_raid_contract: "Hợp Đồng Kiếp Lược"
 war_goal_wg_nomad_raid: "Cuộc Kiếp Lược Du Mục"
 war_goal_wg_nomad_raid_desc: "Việc phát động chiến tranh là nhằm mục đích chiếm đoạt trạm tiếp vận, dân số hoặc Tàu Ark của một đế chế du mục khác"
 wg_nomad_raid_effects: "Tàu Ark đã bị vô hiệu hóa của §Y[From.GetName]§! đã bị tịch thu. Tất cả các §Y$waystation_plural$§! có kết nối với §HĐường trạm tiếp vận§! của chúng ta đều đã được chuyển giao cho chúng ta, những §Y$waystation_plural$§! đã bị hư hỏng còn lại của nó cũng vậy."
 wg_nomad_raid_status_quo_effects: "Tất cả các §Y$waystation_plural$§! đã bị vô hiệu hóa thuộc quyền sở hữu của §Y[From.GetName]§! đều đã bị tước đoạt quyền lực và được đặt dưới sự kiểm soát của chúng ta."

# The Grand Refurbishment

 situation_grand_refurbishment: "Tân Trang Toàn Diện"
 situation_grand_refurbishment_type: "$situation_grand_refurbishment$"
 situation_grand_refurbishment_paused_desc: "Một nghị quyết vẫn đang bị bỏ ngỏ. Công trình tân trang tạm thời bị đình chỉ, cho đến khi vấn đề được giải quyết."
 situation_grand_refurbishment_complete.tt: "Tàu Ark §Y[Target.GetName]§! sẽ nhận được sự cải thiện đáng kể."
 situation_grand_refurbishment_desc: "Khung kết trúc của Tàu Ark §Y[Target.GetName]§! được đánh giá là đang cực kỳ cần được tiến hành tân trang toàn diện. Công trình này sẽ được tiến hành theo từng khu vực, các khu vực sẽ lần lượt bị ngắt kết nối và người dân cũng sẽ được bố trí ở tạm tại những nơi khác.\n\nCách thức điều hành của dự án này sẽ quyết định đến chất lượng của thành quả cuối cùng."

 approach_refurbishment_standard: "Lịch Trình Tiêu Chuẩn"
 approach_refurbishment_minimal: "Hạn Mức Tối Thiểu"
 approach_refurbishment_intensive: "Đầu Tư Toàn Diện"

 approach_outcome_refurbishment_standard: "Tiến triển một cách vững vàng sẽ khiến cho công trình tân trang được hoàn thành đúng như dự kiến.\n\n"
 approach_outcome_refurbishment_minimal: "Dự án sẽ tiêu tốn nhiều thời gian hơn, nhưng gánh nặng tài chính lại nhẹ nhàng hơn.\n\n"
 approach_outcome_refurbishment_intensive: "Tốc độ tân trang sẽ nhanh hơn rất nhiều, nhưng cái giá phải trả cũng cực kỳ đắt đỏ.\n\n"

 situation_grand_refurbishment_monthly_change_tooltip: "Tiến độ phản ánh tốc độ của các hoạt động xây dựng trên §Y[Target.GetName]§!."

