 # Subject presets descriptions
 preset_bulwark_desc:0 "Nước phòng thủ là một loại hình chuyên môn hóa của thuộc quốc, chú trọng phát triển kỹ năng quân sự bậc cao, đánh đổi bằng việc sụt giảm sản lượng tài nguyên cơ bản."
 preset_scholarium_desc:0 "Nước học thuật là một loại hình chuyên môn hóa của thuộc quốc, chú trọng tiến bộ công nghệ, đánh đổi bằng việc suy giảm năng lực quân sự."
 preset_prospectorium_desc:0 "Nước khai khoáng là một loại hình chuyên môn hóa của thuộc quốc, chú trọng sản xuất tài nguyên, đánh đổi bằng việc sụt giảm sản lượng nghiên cứu."
 preset_tributary_desc:0 "Quốc gia triều cống là một loại thuộc quốc có trách nhiệm nộp thuế tài nguyên cơ bản hàng tháng cho bá chủ."
 preset_vassal_desc:0 "Chư hầu là một loại thuộc quốc mà cả bá chủ và thuộc quốc đều có thể tự do thương lượng thỏa thuận quy phục, với nhiều hạng mục tùy chọn đa dạng."
 preset_protectorate_desc:0 "Quốc gia được bảo hộ là một loại thuộc quốc có nền công nghệ tụt hậu rõ rệt so với bá chủ. Họ sẽ nhận được lượng lớn lợi ích khi nghiên cứu những công nghệ mà bá chủ đã nghiên cứu xong."
 preset_subsidiary_desc:0 "Công ty con là một loại thuộc quốc đặc trưng của bá chủ Doanh nghiệp vũ trụ, được quy định trong thỏa thuận là phải có trách nhiệm nộp thuế tài nguyên cơ bản hàng tháng."
 preset_dominion_desc:0 "Lãnh địa thần thánh là một loại thuộc quốc đặc trưng của Đế chế sa ngã, có trách nhiệm nộp thuế tài nguyên cơ bản hàng tháng cho bá chủ cổ đại của mình."
 preset_satellite_desc:0 "Quốc gia vệ tinh là một loại thuộc quốc đặc trưng của Đế chế sa ngã, có trách nhiệm nộp thuế điểm nghiên cứu hàng tháng cho bá chủ cổ đại của mình."
 preset_signatory_desc:0 "Quốc gia hiệp ước là một loại thuộc quốc đặc trưng của Đế chế sa ngã, với nền ngoại giao hoàn toàn nằm dưới sự kiểm soát của bá chủ."
 preset_thrall_desc:0 "Quốc gia nô bộc là một loại thuộc quốc đặc trưng của Đế chế sa ngã, có trách nhiệm nộp thuế tài nguyên cơ bản hàng tháng cho bá chủ cổ đại của mình, và không có quyền mở rộng biên giới."
 preset_political_client_desc: "Quốc gia bù nhìn là một loại thuộc quốc đặc trưng của Đế chế sa ngã, bắt buộc phải ủng hộ mọi vấn đề chính trị của bá chủ cổ đại của mình."
 preset_herald_desc: "Chư hầu tiên phong là một loại thuộc quốc đặc trưng của Đế chế sa ngã, có trách nhiệm tham gia mọi cuộc chiến do bá chủ cổ đại của mình phát động."
 preset_scion_desc:1 "Hậu duệ tiền nhân là một loại thuộc quốc đặc biệt, sở hữu một bá chủ Đế chế sa ngã nắm rõ quá trình phát triển của họ."
 preset_satrapy_desc:0 "Lãnh địa phong kiến là một loại thuộc quốc đặc trưng của Khả Hãn, có trách nhiệm cống nạp hạm đội và nộp thuế tài nguyên cơ bản hàng tháng cho vị bá chủ cuồng chiến của mình."
 preset_relic_satrapy_desc:1 "Lãnh địa phong kiến là một loại thuộc quốc tiếp nối truyền thống của Đại Khả Hãn, có trách nhiệm cung cấp tàu thuyền và tài nguyên hàng tháng cho bá chủ của mình."

 # Subject presets flavor text
 preset_bulwark_flavor_desc:0 "Thuộc quốc này chuyên môn hóa các vấn đề quân sự. Họ vang danh lẫy lừng nhờ màn thể hiện xuất sắc trong khâu phòng thủ, có khả năng cung cấp kiến thức và sự bảo vệ về mặt quân sự cho bá chủ. Đổi lại, việc chỉ tập trung vào một thứ khiến họ phải phụ thuộc rất nhiều vào nguồn viện trợ vật chất từ bên ngoài để duy trì bộ máy quốc gia."
 preset_scholarium_flavor_desc:0 "Thuộc quốc này tập trung vào khoa học và nghiên cứu. Do hầu như toàn bộ ngân sách đều được đổ vào giới học thuật và viện nghiên cứu, họ rất cần sự bảo vệ từ bá chủ, bù lại bá chủ sẽ nhận được những công nghệ tiên tiến đến khó tin để giải quyết các rắc rối trước mắt."
 preset_prospectorium_flavor_desc:0 "Thuộc quốc này chuyên về vật chất và chế tạo. Trí tuệ ngập tràn nhiệt huyết giúp họ có khả năng khai thác những khoáng vật vô giá ở một số khu vực mà kẻ khác chỉ dám đứng nhìn từ xa. Họ sẽ cày xới cạn kiệt mọi tiểu hành tinh và vệ tinh lọt vào tầm mắt."
 preset_tributary_flavor_desc:0 "Quốc gia triều cống là một loại thuộc quốc được hưởng quyền tự trị độc lập khá lớn, có thể tự do lo liệu các vấn đề dân sinh và chính trị của riêng mình. Họ phải nộp một khoản cống nạp khổng lồ để đổi lấy sự bảo vệ từ bá chủ, và miễn là tiền vẫn chảy đều đều vào kho bạc của bá chủ, thì về cơ bản họ muốn làm gì cũng được."
 preset_vassal_flavor_desc:0 "Chư hầu là thuộc quốc của một đế chế khác, gần như không có quyền tự trị hoặc chỉ có quyền tự trị lẻ tẻ. Do đã ký hiệp ước với thế lực bên ngoài, sự tồn vong của họ phụ thuộc hoàn toàn vào lòng nhân từ hay sự tàn bạo của bá chủ, và buộc phải cúi đầu trước mọi quy tắc hay luật lệ mà bá chủ tùy ý đặt ra. Đối với một số quốc gia nhược tiểu, họ chỉ còn cách việc bị sáp nhập hoàn toàn vào tay bá chủ đúng một bước chân, và đây chính là ngõ cụt khi họ đặt bút ký vào những hiệp ước bán nước cầu vinh kia."
 preset_protectorate_flavor_desc:0 "Quốc gia được bảo hộ là thuộc quốc có thực lực yếu kém hơn bá chủ rất nhiều, việc họ đu bám được vào bá chủ thậm chí có thể coi là tổ tiên gánh còng lưng. Lãnh chúa của họ sẽ chăm sóc cho họ, cản bước vô vàn mối đe dọa từ nơi sâu thẳm trong hệ sao, trong thời gian đó họ có thể an tâm ổn định và cải thiện quê hương mình."
 preset_subsidiary_flavor_desc:0 "Công ty con là thuộc quốc có quyền tự trị khá lớn, có khả năng tự do quản lý các công việc của mình. Họ đã đánh đổi một phần độc lập thông qua hợp đồng, nhưng cả hai bên trong hợp đồng đều mong đợi sự hỗ trợ và viện trợ lẫn nhau."
 preset_dominion_flavor_desc:0 "Lãnh địa thần thánh là thuộc quốc của Đế chế thức tỉnh cổ đại. Những chiến hạm già cỗi mà hùng mạnh tràn qua biên giới, buộc họ phải dâng chủ quyền cho một bá chủ cuồng tín cai trị, kẻ đòi hỏi họ phải quy phục hoàn toàn, cả trên danh nghĩa lẫn tinh thần."
 preset_satellite_flavor_desc:0 "Quốc gia vệ tinh là thuộc quốc của Đế chế thức tỉnh cổ đại. Họ ký kết hiệp ước, bán rẻ quyền tự trị cho thế lực ngoại bang, do đó lãnh chúa sẽ liên tục áp đặt sự kiểm soát lên họ, sức mạnh mềm về văn hóa của họ - dù là công nghệ, nghệ thuật hay bất kỳ hình thức biểu đạt nào khác - đều sẽ bị cấp trên giám sát gắt gao."
 preset_signatory_flavor_desc:0 "Quốc gia hiệp ước là thuộc quốc của Đế chế thức tỉnh cổ đại. Dù chịu sự quản lý từ bề trên, nhưng trong nhiều khía cạnh họ vẫn được thả cửa tự quản lý công việc của mình. Nhờ việc không phải nộp cống phẩm, cũng chẳng bị gò bó bởi quá nhiều quy định, nên thường thì chính họ cũng lơ ngơ chẳng rõ lãnh chúa thực sự muốn gì."
 preset_thrall_flavor_desc:0 "Quốc gia nô bộc là thuộc quốc của Đế chế thức tỉnh cổ đại. Họ phải chịu sự cai quản hà khắc từ bề trên, nộp lại lượng lớn của cải cho vị bá chủ đầy tham vọng, kẻ sẽ dùng chính tài sản của chư hầu để nuôi béo cỗ máy chiến tranh của hắn."
 preset_scion_flavor_desc:0 "Hậu duệ tiền nhân là thuộc quốc của Đế chế thức tỉnh cổ đại. Họ nhận được sự hỗ trợ dài hạn từ một đế chế ban ơn đầy bác ái nào đó, nhờ vậy được hưởng quyền tự trị trong mọi khía cạnh cai trị. Thỉnh thoảng họ còn nhận được quà tặng từ lãnh chúa, còn về lý do thì cả hệ sao này có vắt óc cũng chẳng hiểu nổi."
 preset_satrapy_flavor_desc:0 "Lãnh địa phong kiến là thuộc quốc cống hiến cho Đại Khả Hãn. Họ đã chọn cách quỳ gối trước sức mạnh quân sự của Hãn quốc đạo tặc, và được trao quyền nhân danh Đại Khả Hãn để cai trị một vùng không gian nào đó trong hệ sao. Chừng nào họ còn liên tục cống nạp tàu thuyền và tài nguyên để hỗ trợ các cuộc chinh phạt của Đại Khả Hãn, ngài sẽ không nhúng tay vào chuyện nội bộ của họ."
 preset_relic_satrapy_flavor_desc:0 "Lãnh địa phong kiến là loại thuộc quốc mà Đại Khả Hãn rất ưu ái, nay ngai vàng đã đổi chủ, việc vứt bỏ truyền thống này xem ra hơi phí. Để đổi lại việc liên tục cống nạp tàu thuyền và tài nguyên nhằm hỗ trợ các cuộc chinh phạt của bá chủ, bá chủ sẽ không nhúng tay vào chuyện nội bộ của họ."


