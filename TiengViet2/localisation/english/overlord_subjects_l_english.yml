 IS_SAME_AS_PREVIOUS_AGREEMENT:0 "§RThỏa thuận này hoàn toàn giống hệt với thỏa thuận hiện tại!§!"

 # Neighbor planet modifiers
 specialist_bulwark_neighbor:0 "Vệ binh phòng thủ"
 specialist_bulwark_neighbor_desc:0 "Nằm cạnh một chư hầu đóng vai trò Nước phòng thủ mang lại cho chúng ta sự an toàn và ổn định."
 specialist_scholarium_neighbor:0 "Chỉ đạo học thuật"
 specialist_scholarium_neighbor_desc:0 "Nước học thuật láng giềng thường xuyên cử các phái đoàn chuyên gia đến giao lưu, giúp cải thiện hiệu suất làm việc và sản lượng nghiên cứu của chúng ta."
 specialist_prospectorium_neighbor:0 "Cung ứng khai khoáng"
 specialist_prospectorium_neighbor_desc:0 "Nguồn vật tư dồi dào từ Nước khai khoáng láng giềng đã xóa bỏ hoàn toàn sự kém hiệu quả trong công tác thi công."

