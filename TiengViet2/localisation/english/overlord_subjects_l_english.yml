 joins_overlord_wars_all_desc:1 "Chư hầu có nghĩa vụ tham gia vào tất cả các cuộc chiến của Bá Chủ."

 joins_subject_wars:1 "Chiến tranh của Chư hầu"
 joins_subject_wars_desc:1 "Điều khoản này chỉ định xem Bá Chủ có nghĩa vụ tham gia vào các cuộc chiến mà Chư hầu hiện đang trực tiếp tham gia hay không."
