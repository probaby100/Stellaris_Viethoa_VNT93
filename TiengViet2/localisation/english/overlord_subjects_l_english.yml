 # First Half
 ResourceDiscovery1:0 "Nằm ngay dưới bề mặt của [FromFromFrom.GetName], chúng ta đã phát hiện một cấu trúc tàn tạ bị giấu kín bởi dòng chảy thời gian. Dù kết cấu của nó nhìn chung vẫn có thể coi là nguyên vẹn, nhưng bên trong chẳng còn lại thứ gì đáng để thu hồi. Dẫu vậy, chúng ta đã tìm thấy một lối đi dẫn sâu hơn xuống lòng đất."
 ResourceDiscovery2:0 "Chúng ta tìm thấy một nhóm cỗ máy nhỏ đang loay hoay trên [FromFromFrom.GetName], chúng vẫn đang cố gắng hoàn thành nhiệm vụ được cài đặt. Những cỗ máy này tụ tập tại một địa điểm bị bịt kín bởi các mảnh vỡ và thiết bị đã tháo rời. Trung tâm điều khiển chính đã ngắt kết nối và gần như vô dụng, nhưng có một tín hiệu liên tục phát ra theo chu kỳ, chỉ dẫn rõ ràng cho chúng ta tiếp tục khám phá xuống dưới lòng đất."
 ResourceDiscovery3:0 "Phân tích trước đây của chúng ta về [FromFromFrom.GetName] đã phát hiện một trung tâm nghiên cứu cơ bản nằm gần một hố sâu trên bề mặt, dẫn thẳng xuống một hang động khổng lồ dưới lòng đất. Trung tâm nghiên cứu cùng máy móc bên trong đã hỏng hóc không thể cứu vãn, nên chúng ta sẽ chuyển hướng sang lùng sục hang động."
 ResourceDiscovery4:0 "Sau khi khảo sát tường tận bề mặt của [FromFromFrom.GetName], chúng ta phát hiện một tàu dò đang tiến hành quét khu vực này với cường độ cao. Bất kể chúng ta làm gì hay cố gắng tương tác ra sao, chiếc tàu dò này chỉ quay lại đúng một vị trí và tiếp tục hành động ban đầu của nó. Dựa vào hành vi của nó, chúng ta bắt đầu quét khu vực dưới lòng đất."
 ResourceDiscovery5:0 "Chúng ta đã tìm thấy tàn tích của một trạm khai thác hoặc trạm nghiên cứu cổ xưa trên [FromFromFrom.GetName]. Có vẻ như nó đã đâm xuống đây vào một thời điểm nào đó trong quá khứ. Đồng thời, trên đó còn có dấu vết bị tấn công. Dù hư hại nặng nề, trạm không gian này vẫn tiếp tục truyền tín hiệu xuống dưới lòng đất. Trước khi làm gì tiếp theo, chắc chắn chúng ta phải tìm hiểu kỹ càng chuyện này."

 # Second Half - Energy
 ResourceDiscoveryEnergy1:0 "Có vẻ như nó được nối với một dòng điện không rõ nguồn gốc chảy dưới lòng đất. Quan trọng hơn, chúng ta không dám chắc dòng điện này sẽ duy trì được bao lâu và có ổn định hay không, nhưng chúng ta tin rằng mình có thể tận dụng nó."
 ResourceDiscoveryEnergy2:0 "Có vẻ nó được xây dựng và giấu kín dưới lòng đất để duy trì hoạt động cho một cỗ máy phát điện cổ đại. Dù thiết bị gặp không ít vấn đề, chúng ta vẫn có thể khẳng định máy phát điện này vẫn chạy tốt. Tốn thêm chút công sức nữa, chúng ta sẽ có thể ổn định nó và đưa vào sử dụng."
 ResourceDiscoveryEnergy3:0 "Khi quan sát kỹ hơn cỗ máy phát điện bí ẩn này, chúng ta phát hiện nó được nối với vài sợi cáp lớn chạy xuyên qua [FromFromFrom.GetName]. Toàn bộ cỗ máy khổng lồ này dường như được vận hành bởi một thiết bị duy nhất nằm dưới lòng đất. Chỉ cần điều chỉnh dòng điện một chút, chúng ta có thể tận dụng nguồn năng lượng mà nó tạo ra."

 # Second Half - Minerals
 ResourceDiscoveryMinerals1:0 "Máy phát điện này được nối tới một mạch khoáng vật chôn vùi dưới lòng đất, bên trong có thể chứa nguồn nguyên liệu thô cực kỳ quan trọng đối với những kẻ vận hành cỗ máy. Dù sắp cạn kiệt, chúng ta vẫn có thể hốt trọn số tài nguyên này làm của riêng."
 ResourceDiscoveryMinerals2:0 "Tiếp tục khám phá, chúng ta phát hiện máy phát điện này nối với một hang động nhân tạo tối tăm, bên trong có chứa vài mạch khoáng vật nhỏ. La liệt trên mặt đất là xác của một giống loài thạch nhân chưa từng được biết đến. Hiện tại vẫn chưa rõ họ đang khai thác khoáng vật hay trực tiếp ăn chúng ngay tại chỗ, nhưng bất kể thế nào, những mấu khoáng vật mọc lởm chởm trên người họ có thể mang lại giá trị sử dụng khá lớn cho chúng ta."
 ResourceDiscoveryMinerals3:0 "Máy phát điện này được dựng lên trong một hang động ngầm khổng lồ, lấp đầy bởi đủ loại khoáng vật. Rất có thể toàn bộ hang động rộng lớn này là do chính nó tự đào rỗng. Nó có thể là thành quả của quá trình đào bới nhằm phục vụ nhu cầu đâm sâu vào lớp vỏ hành tinh."

 # Second Half - Alloys
 ResourceDiscoveryAlloys1:0 "Khám phá thêm về khu vực này, chúng ta phát hiện nó được kết nối với một cơ sở cổ đại dường như vẫn đang hoạt động ở mức độ nhất định. Tận dụng tài nguyên sẵn có, cỗ máy này vẫn không ngừng nhả ra những thỏi hợp kim mới toanh và hữu dụng đã được rèn giũa cẩn thận."
 ResourceDiscoveryAlloys2:0 "Chúng ta đã tìm thấy một cơ sở lưu trữ kỳ lạ, nhồi nhét đầy các bộ phận tàu thuyền vỡ nát. Dù những linh kiện này đã hỏng đến mức không thể cứu vãn, nhưng chúng ta có thể mang đống vật liệu này đi tái chế."
 ResourceDiscoveryAlloys3:0 "Điều tra kỹ hơn khu vực này, chúng ta đã phát hiện một nhà chứa tàu chôn sâu dưới lòng đất. Trong kho, chúng ta tìm thấy một vài con tàu đã tơi tả, chẳng còn lại chút manh mối nào về chủ nhân trước đây của chúng. Việc khôi phục những con tàu trong nhà chứa này là cực kỳ khó khăn, nhưng chúng ta vẫn có thể vớt vát lại vài bộ phận hữu ích."

 # Second Half - Rare Crystals
 ResourceDiscoveryRareCrystals1:0 "Nó có vẻ được nối với một thiết bị khai thác, dùng để khai thác một loại mạch tinh thể hiếm gặp và kỳ lạ, dù tại hiện trường chẳng có bất kỳ dấu hiệu nào cho biết ai là người quản lý cơ sở này. Sau vài tinh chỉnh nhỏ, chúng ta có thể đưa nó vào phục vụ cho phe mình."
 ResourceDiscoveryRareCrystals2:0 "Nó dẫn tới một hang động nhân tạo, lúc nhúc những sinh vật tinh thể tinh xảo - có lẽ nơi này là một kiểu trang trại hay bãi chăn thả ngầm. Do bị bỏ hoang từ rất lâu, những sinh vật này cứ thế sinh sôi nảy nở loạn xạ theo bản năng. Vì chúng có vẻ khá thân thiện và hiếu khách, nếu muốn, chúng ta hoàn toàn có thể khôi phục lại hoạt động bình thường của trang trại này."
 ResourceDiscoveryRareCrystals3:0 "Ngay sau đó, một hầm mỏ xiêu vẹo hiện ra trước mắt, bên trong là đám thiết bị bay không người lái vẫn đang cặm cụi đối phó với những khối tinh thể lồi ra trên vách đá. Chúng hoàn toàn chẳng đếm xỉa gì đến sự xuất hiện của chúng ta, vẫn liên tục lấp đầy các thùng chứa lớn rồi đặt sang một bên. Dù hầu hết tinh thể đều là loại nhan nhản ở khắp nơi và chẳng có mấy giá trị, nhưng chúng ta đã tìm thấy một vài chủng loại cực kỳ quý hiếm xen lẫn trong đó."

 # Second Half - Volatile Motes
 ResourceDiscoveryVolatileMotes1:0 "Tiếp tục men theo con đường, chúng ta tình cờ bắt gặp tổ của một loài sinh vật lưỡng cư hình cầu nào đó, bầu không khí xung quanh chúng đang dao động liên hồi bởi một loại hạt kỳ lạ không thuộc về tự nhiên. Chúng ta vẫn chưa rõ tại sao những hạt này lại có sức hút mãnh liệt với loài sinh vật đó đến vậy, nhưng chúng ta tin rằng chỉ cần bỏ chút công sức, ta có thể ổn định và tận dụng những hạt này."
 ResourceDiscoveryVolatileMotes2:0 "Trong lúc tiếp tục chuyến thám hiểm, chúng ta đã phát hiện một cơ sở nhỏ gọn nằm ở sâu hơn, bên trong có vài căn phòng đặt sẵn máy móc chuyên dùng để ổn định Hạt dễ nổ. Dù hiện tại vẫn an toàn, nhưng những cỗ máy này sẽ sớm chạm ngưỡng tới hạn cần sửa chữa gấp; chúng ta nên tập trung sức lực để khôi phục trạng thái bình thường của chúng, tránh để máy móc hoạt động đến mức bung bét."
 ResourceDiscoveryVolatileMotes3:0 "Căn phòng này dẫn chúng ta tiến sâu hơn xuống lòng đất, và cuối cùng dừng bước tại một hang động nhân tạo, chứa đầy chất thải độc hại đang từ từ ăn mòn mặt đất. Dù rủi ro bủa vây, nhưng có vẻ đây chính là nguồn gốc tạo ra số Hạt dễ nổ mà chúng ta phát hiện trước đó. Chỉ cần cẩn trọng thực hiện quy trình ổn định, chúng ta hoàn toàn có thể khai thác nơi này."

 # Second Half - Exotic Gases
 ResourceDiscoveryExoticGases1:0 "Vì lý do nào đó, có vẻ như nó được nối tới một trạm xử lý chất thải chôn sâu dưới đất. Trạm này đã quá cổ xưa, nên việc dự đoán nguồn gốc của nó là điều bất khả thi, nhưng chúng ta tin rằng mình có thể thu thập một lượng Khí ngoại lai ở đây về dùng dần."
 ResourceDiscoveryExoticGases2:0 "Nó trông có vẻ được kết nối với một cơ sở nghiên cứu chật chội, cơ sở này nằm ngay tại một điểm phun khí độc tự nhiên, lượng khí này không ngừng trào ra từ dưới lòng đất của [FromFromFrom.GetName]. Việc thiết lập lại cơ sở này sẽ giúp chúng ta có thể thu thập lượng khí này làm của riêng."
 ResourceDiscoveryExoticGases3:0 "Nó dẫn đường cho chúng ta đến một nơi nằm sâu tít tắp dưới bề mặt, tại đó chúng ta bắt gặp một cỗ máy có quy mô lớn đến mức khó tin, rất có khả năng từng được dùng để ổn định [FromFromFrom.GetName], nhưng hiện tại đã hư hỏng quá nặng, vô phương cứu chữa. Dẫu không thể sửa chữa, nhưng cỗ máy tàn tạ này vẫn đang sản sinh ra một vài loại khí độc có thể sẽ giúp ích được cho chúng ta."

 # Second Half - Zro
 ResourceDiscoveryZro1:0 "Khi lần theo dấu vết, chúng ta đã tìm thấy cội nguồn của Zro nằm ngay dưới bề mặt. Các công cụ thu thập từ một nền văn minh ngoài hành tinh vương vãi khắp hành lang của căn phòng, chỉ cần động não chút xíu là chúng ta có thể tự mình sử dụng những dụng cụ này."
 ResourceDiscoveryZro2:0 "Nó nối liền với một cơ sở đã ngừng hoạt động bị chôn vùi sâu dưới bề mặt. Bản thân cơ sở này có vẻ được lập ra với ý đồ điều tra một điểm va chạm của Zro. Dù bên trong trống hoác và hầu hết các chức năng đã ngắt, nhưng việc tái sử dụng nơi này để phục vụ mục đích của chúng ta vẫn hoàn toàn khả thi."

 # Second Half - Dark Matter
 ResourceDiscoveryDarkMatter1:0 "Thông qua một quy trình phức tạp nào đó, nó dường như đã kết nối với một thiết bị bay không người lái nghiên cứu. Thiết bị này đang bay quanh một lỗ đen siêu nhỏ chôn sâu dưới bề mặt hành tinh, có lẽ trong quá trình nghiên cứu, bằng một cách thần kỳ nào đó nó đã ổn định được điểm kỳ dị của lỗ đen. Dù chúng ta không thể tái hiện lại kỳ tích công nghệ này, nhưng chúng ta có thể tận dụng triệt để thiết bị bay này cho phe mình."

 # Second Half - Living Metal
 ResourceDiscoveryLivingMetal1:0 "Chúng ta phát hiện nó dẫn tới một căn phòng nằm tít sâu dưới mặt đất. Ở đó, chúng ta nhìn thấy Kim loại sống và thứ gì đó mà ta cho rằng từng là sinh vật thân mềm trong quá khứ, đang kết tụ lại với nhau theo một cách ngoạn mục. Hai thứ này đã hòa làm một, chầm chậm vươn mình lan ra theo mạng lưới hang động ngầm. Chịu khó một chút, có thể chúng ta sẽ đục đẽo được vài mảnh kim loại vụn một cách cẩn thận mà không gây tổn thương quá nặng cho sinh vật này."
 ResourceDiscoveryLivingMetal2:0 "Không mất quá nhiều công sức, chúng ta đã phát hiện Kim loại sống tập trung trong một căn phòng nhân tạo chật hẹp. Nhờ việc nó có thể trượt đi và phản ứng lại khi bị chạm vào, chúng ta tin rằng mức độ sống của nó cao hơn nhiều so với dự đoán ban đầu. Nếu thu thập cẩn thận, chúng ta có thể khai thác nó tối đa mà không đoạt mạng sinh vật này."

 prospectorium_resource_discovery_desc:0 "Chúng ta đã bắt được một số tín hiệu cho thấy có thể còn những tài nguyên giá trị hơn đang chờ được khám phá tại [prospectorium_discovery_target.System.GetName]. Chúng ta đã phóng một vài đầu dò tiền trạm để rà soát toàn bộ khu vực này - để tới khi có thể phái một con tàu đến đó, chúng ta sẽ có đủ dữ liệu để tiến hành nghiên cứu chuyên sâu."

