 subject_integration_desc:1 "Điều khoản này chỉ định xem Bá Chủ có thể sáp nhập Chư hầu vào lãnh thổ của họ hay không."
 subject_can_be_integrated:2 "Cho phép sáp nhập"
 subject_can_be_integrated_desc:1 "Bá Chủ có thể sáp nhập Chư hầu vào lãnh thổ của họ."
 subject_can_not_be_integrated:2 "Cấm sáp nhập"
 subject_can_not_be_integrated_desc:1 "Bá Chủ không thể sáp nhập Chư hầu vào lãnh thổ của họ."

 subject_holdings_limit:0 "Giới Hạn Lãnh Địa Nhượng Địa"
 subject_holdings_limit_desc:1 "Điều khoản này quy định tổng số Lãnh Địa Nhượng Địa mà Bá Chủ có thể sở hữu trên tất cả các hành tinh của Chư hầu."
 subject_holdings_limit_tooltip:0 "$TERM$ ($VALUE|Y$)"
 subject_holdings_limit_0:1 "Không"
 subject_holdings_limit_0_desc:1 "Bá Chủ không được phép sở hữu Lãnh Địa Nhượng Địa trên các hành tinh của Chư hầu."
 subject_holdings_limit_1:0 "1"
 subject_holdings_limit_1_desc:1 "Bá Chủ có thể sở hữu tổng cộng 1 Lãnh Địa Nhượng Địa trên tất cả các hành tinh của Chư hầu."
 subject_holdings_limit_2:0 "2"
 subject_holdings_limit_2_desc:1 "Bá Chủ có thể sở hữu tổng cộng 2 Lãnh Địa Nhượng Địa trên tất cả các hành tinh của Chư hầu."
 subject_holdings_limit_3:0 "3"
 subject_holdings_limit_3_desc:1 "Bá Chủ có thể sở hữu tổng cộng 3 Lãnh Địa Nhượng Địa trên tất cả các hành tinh của Chư hầu."
 subject_holdings_limit_4:0 "4"
 subject_holdings_limit_4_desc:1 "Bá Chủ có thể sở hữu tổng cộng 4 Lãnh Địa Nhượng Địa trên tất cả các hành tinh của Chư hầu."

 subject_diplomacy:0 "Tự do Ngoại giao"
 subject_diplomacy_desc:1 "Điều khoản này quy định mức độ tự do ngoại giao mà Chư hầu được trao, và họ có được phép tự do bỏ phiếu mà không cần tham khảo ý kiến của Bá Chủ hay không."
 subject_can_do_diplomacy:1 "Ngoại giao Độc lập"
 subject_can_do_diplomacy_desc:1 "Chư hầu có thể tự do tiến hành ngoại giao với hầu hết các đế quốc khác, và có quyền bỏ phiếu độc lập."
 subject_can_do_diplomacy_but_not_vote:0 "Hạn chế Bỏ phiếu"
 subject_can_do_diplomacy_but_not_vote_desc:2 "Chư hầu có thể tự do tiến hành ngoại giao với hầu hết các đế quốc khác, nhưng trong Cộng đồng Thiên hà phải bỏ phiếu theo Bá Chủ của họ.\n\nĐiều này sẽ buộc Chư hầu phải tham gia vào §YLiên bang§! mà Bá Chủ trực thuộc.\n\nNếu Bá Chủ là thành viên của §YCộng đồng Thiên hà§!, thì Chư hầu cũng sẽ bị buộc phải tham gia."
 subject_can_not_do_diplomacy:1 "Ngoại giao Bị Hạn chế"
 subject_can_not_do_diplomacy_desc:0 "Chư hầu không thể tự do tiến hành ngoại giao với các đế quốc khác, và cũng không có quyền bỏ phiếu độc lập."

 subject_expand:0 "Mở rộng"
 subject_expand_desc:1 "Điều khoản này quy định liệu Chư hầu có tự do trong việc mở rộng lãnh thổ của họ hay không, hay sẽ bị hạn chế hoặc cấm hoàn toàn."
 subject_cannot_expand:1 "Cấm Mở rộng"
 subject_cannot_expand_desc:0 "Chư hầu không thể mở rộng lãnh thổ."
 subject_can_expand_with_tithe:1 "Mở rộng Có Điều kiện"
 subject_can_expand_with_tithe_desc:1 "Chư hầu có thể mở rộng lãnh thổ, nhưng khi xây dựng trạm tiền đồn ở biên giới, họ phải nộp thêm cống nạp $r_influence$ cho Bá Chủ."
 subject_can_expand_with_tithe_nomadic_desc:1 "Quốc gia phụ thuộc có thể mở rộng lãnh thổ của mình, nhưng khi xây dựng trạm tiếp vận, bắt buộc phải nộp khoản cống nạp $r_influence$ cho đế chế bảo hộ."
 subject_can_expand:1 "Cho phép Mở rộng"
 subject_can_expand_desc:1 "Chư hầu có thể tự do mở rộng lãnh thổ."

 subject_sensors:1 "Cảm biến"
 subject_sensors_desc:1 "Điều khoản này xác định liệu Chư hầu có thể nhận thông tin từ cảm biến của Bá Chủ hay không."
 subject_gets_sensors:2 "Cảm biến Liên kết"
 subject_gets_sensors_desc:1 "Chư hầu này có thể nhận thông tin cảm biến từ Bá Chủ"
 subject_does_not_get_sensors:2 "Cảm biến Độc lập"
 subject_does_not_get_sensors_desc:1 "Chư hầu này không thể nhận thông tin cảm biến từ Bá Chủ"

