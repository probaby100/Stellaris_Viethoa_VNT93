 mod_job_overlord_propagandist_drone_add:0 "$mod_job_overlord_propagandist_add$"
 job_overlord_propagandist_desc:1 "Những người tuyên truyền làm việc cho các cơ quan chính phủ địa phương là chuyên gia trong việc thâm nhập và xoa dịu tình hình khu vực."
 job_overlord_propagandist_drone_desc:0 "Những cá thể được trang bị riêng cho mục đích ngoại giao, cực kỳ giỏi trong việc làm nhiễu loạn tư tưởng và ý chí của các thế lực nổi loạn."
