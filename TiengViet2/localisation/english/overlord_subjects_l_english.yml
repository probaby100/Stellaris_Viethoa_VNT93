 # Policies
 policy_subjugation_war_terms:0 "Điều khoản chiến tranh ép buộc quy phục"
 policy_subjugation_war_terms_desc:1 "Các thiết lập ban đầu của chúng ta về điều khoản thỏa thuận dành cho chư hầu hoặc thuộc quốc bị khuất phục thông qua chiến tranh.\n"
 oppressive_terms_name:1 "Chư hầu bị áp bức"
 balanced_terms_name:1 "Chư hầu cân bằng"
 benevolent_terms_name:1 "Chư hầu được ban ơn"
 oppressive_terms:0 "$oppressive_terms_name$"
 oppressive_terms_desc:2 "Giá trị tồn tại duy nhất của lũ kiến hôi đang quỳ rạp dưới chân chúng ta là câm miệng lại, rồi giao nộp đống cống phẩm thảm hại của chúng.\n\n§EĐiều khoản thỏa thuận ban đầu của thuộc quốc\n$t$$subject_can_be_integrated$\n$t$$subject_can_not_do_diplomacy$\n$t$$subject_cannot_expand$\n$t$Tham gia chiến tranh của bá chủ: Tất cả\n$t$Tham gia chiến tranh của thuộc quốc: Phòng thủ\n$t$Giới Hạn Nhượng Địa Trên Thuộc Quốc: 1§!"
 balanced_terms:0 "$balanced_terms_name$"
 balanced_terms_desc:2 "Chúng ta tin rằng, chỉ cần đối xử công bằng với các thuộc quốc, thì sớm muộn gì họ cũng sẽ tỉnh ngộ và thấu hiểu được sự sáng suốt trên con đường của chúng ta.\n\n§EĐiều khoản thỏa thuận ban đầu của thuộc quốc\n$t$$subject_can_not_be_integrated$\n$t$$subject_can_do_diplomacy_but_not_vote$\n$t$$subject_can_expand_with_tithe$\n$t$Tham gia chiến tranh của bá chủ: Phòng thủ\n$t$Tham gia chiến tranh của thuộc quốc: Phòng thủ\n$t$Giới Hạn Nhượng Địa Trên Thuộc Quốc: 1§!"
 benevolent_terms:0 "$benevolent_terms_name$"
 benevolent_terms_desc:2 "Thuộc quốc và chúng ta có mối quan hệ môi hở răng lạnh, thành công của họ cũng chính là thắng lợi của chúng ta, vì vậy chúng ta sẽ kề vai sát cánh cùng tiến bước.\n\n§EĐiều khoản thỏa thuận ban đầu của thuộc quốc\n$t$$subject_can_not_be_integrated$\n$t$$subject_can_do_diplomacy$\n$t$$subject_can_expand$\n$t$Tham gia chiến tranh của bá chủ: Phòng thủ\n$t$Tham gia chiến tranh của thuộc quốc: Phòng thủ\n$t$Giới Hạn Nhượng Địa Trên Thuộc Quốc: 1§!"

 oppressive_corporate_terms_name:0 "Thâu tóm ác ý"
 oppressive_corporate_terms:0 "$oppressive_corporate_terms_name$"
 oppressive_corporate_terms_desc:1 "Sự phản kháng yếu ớt của chúng trước cuộc thâu tóm này chỉ là uổng công vô ích; đức tin có kiên định đến mấy thì cuối cùng cũng bị khuất phục bởi sức mạnh đồng tiền.\n\n§EThỏa thuận ban đầu của công ty con:\n$t$$subject_can_not_be_integrated$\n$t$$subject_can_do_diplomacy_but_not_vote$\n$t$$subject_can_expand_with_tithe$\n$t$Thuế tài nguyên cơ bản: 45%\n$t$Thuế tài nguyên cấp cao: 15%\n$t$Tham gia chiến tranh của bá chủ: Tất cả\n$t$Tham gia chiến tranh của thuộc quốc: Phòng thủ\n$t$Giới Hạn Nhượng Địa Trên Thuộc Quốc: 1§!\n\nĐây là §YChính sách quy phục áp bức§!."
 balanced_corporate_terms_name:0 "Thâu tóm tiêu chuẩn"
 balanced_corporate_terms:1 "$balanced_corporate_terms_name$"
 balanced_corporate_terms_desc:1 "Chỉ cần chốt được một hiệp định bùi tai, cả hai ta đều có thể tiếp tục êm ấm kiếm tiền.\n\n§EThỏa thuận ban đầu của công ty con:\n$t$$subject_can_not_be_integrated$\n$t$$subject_can_do_diplomacy_but_not_vote$\n$t$$subject_can_expand_with_tithe$\n$t$Thuế tài nguyên cơ bản: 30%\n$t$Tham gia chiến tranh của bá chủ: Phòng thủ\n$t$Tham gia chiến tranh của thuộc quốc: Phòng thủ\n$t$Giới Hạn Nhượng Địa Trên Thuộc Quốc: 1§!\n\nĐây là §YChính sách quy phục cân bằng§!."
 benevolent_corporate_terms_name:0 "Đàm phán cộng sinh"
 benevolent_corporate_terms:0 "$benevolent_corporate_terms_name$"
 benevolent_corporate_terms_desc:1 "Đôi bên cùng có lợi mới là phi vụ tốt; cũng giống như sinh mệnh vậy, hòa hợp mới có thể làm cho việc làm ăn thăng hoa.\n\n§EThỏa thuận ban đầu của công ty con:\n$t$$subject_can_not_be_integrated$\n$t$$subject_can_do_diplomacy$\n$t$$subject_can_expand$\n$t$Thuế tài nguyên cơ bản: 30%\n$t$Tham gia chiến tranh của bá chủ: Phòng thủ\n$t$Tham gia chiến tranh của thuộc quốc: Phòng thủ\n$t$Giới Hạn Nhượng Địa Trên Thuộc Quốc: 1§!\n\nĐây là §YChính sách quy phục ban ơn§!."
