 divided_patronage:0 "Sự che chở bị chia nhỏ"
 divided_patronage_desc:0 "Sự chú ý của bá chủ đã bị phân tán cho quá nhiều thuộc quốc."
 feudal_lord:0 "Bá Chủ phong kiến"
 feudal_lord_desc:1 "Bá Chủ phong kiến đã vung tiền cho các bộ phận trong thuộc quốc để đổi lấy lòng trung thành của họ."
 corporate_franchise:0 "Nhượng quyền thương mại"
 corporate_franchise_desc:0 "Thương hiệu và thông điệp tiếp thị do bá chủ doanh nghiệp cung cấp hoàn toàn xứng đáng với từng đồng bỏ ra."
 overlord_ethics_compatibility:0 "Mức độ tương thích đạo đức với bá chủ"
 overlord_ethics_compatibility_desc:0 "Sự tương đồng và khác biệt giữa tư tưởng của bá chủ với tư tưởng của chính chúng ta."
 domestic_intelligence:0 "Trí tuệ bản địa"
 newly_released_sector_loyalty:0 "Khu vực mới được giải phóng"
 newly_released_sector_loyalty_desc:0 "Chúng ta vẫn giữ mãi lòng biết ơn sâu sắc đối với đế chế đã tạo ra mình."
 newly_subjugated_loyalty:0 "Mới bị khuất phục"
 newly_subjugated_loyalty_desc:0 "Chúng ta vẫn chưa thể nuốt trôi cục tức này khi bị ép buộc phải phục vụ cho một quốc gia khác."
