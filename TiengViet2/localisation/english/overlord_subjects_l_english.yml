 overlord_ungrateful_vassal_modifier:0 "Chư hầu vô ơn"
 overlord_ungrateful_vassal_modifier_desc:0 "Dù vốn dĩ chẳng kỳ vọng gì, nhưng bá chủ vẫn thành công làm người ta phải thất vọng tràn trề. Đúng là nể thật."

