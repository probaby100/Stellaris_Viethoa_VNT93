 # Overlord Propagandist
 job_overlord_propagandist:0 "Người tuyên truyền của bá chủ"
 job_overlord_propagandist_drone:0 "$job_overlord_propagandist$"
 job_overlord_propagandist_plural:0 "Người tuyên truyền của bá chủ"
 job_overlord_propagandist_drone_plural:0 "$job_overlord_propagandist_plural$"
