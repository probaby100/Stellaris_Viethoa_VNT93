 holding_garrison:0 "Trại Đồn trú Bá Chủ"
 holding_garrison_desc:1 "Một đội quân chiếm đóng chịu trách nhiệm giám sát lực lượng hành pháp địa phương, thỉnh thoảng trong những tình huống cực kỳ nghiêm trọng còn có thể nhận được sự tiếp viện từ quân đội."
 holding_garrison_armies_desc:1 "Mỗi một đội lục quân đến từ Bá Chủ đóng quân trên hành tinh này sẽ giảm thêm §G-10%§! [Root.CrimeOrDeviancy], §G+0.5§! $r_loyalty$ và §R-5%§! Sự Hài Lòng, tối đa có thể đạt §G-30%§! [Root.CrimeOrDeviancy], cũng như tăng thêm §G+1.5§! $r_loyalty$ và §R-15%§! Sự Hài Lòng."
 holding_orbital_assembly_complex:0 "Tổ hợp Lắp ráp Quỹ đạo"
 holding_orbital_assembly_complex_desc:1 "Bên trong một tòa nhà chọc trời là những dây chuyền lắp ráp dài dằng dặc, tạo ra mọi thứ mà con người hằng mơ ước."
 holding_orbital_assembly_complex_effect:1 "Tăng cường hiệu ứng của các mô-đun §YVành đai Quỹ đạo§! trên hành tinh."
 holding_propaganda_office:0 "Bộ Sự thật"
 holding_propaganda_office_desc:1 "Một cơ quan giám sát tín ngưỡng địa phương và các nhóm chính trị. Với sự đôn đốc thích hợp, mọi việc đều diễn ra suôn sẻ hơn."
 holding_satellite_campus:0 "Khuôn viên Vệ tinh"
 holding_satellite_campus_desc:1 "Một khuôn viên rộng lớn để các học giả và nhà khoa học trong và ngoài nước tập hợp lại nhằm chia sẻ những hiểu biết và tiến hành các thí nghiệm."
 holding_emporium:0 "Thương cảng"
 holding_emporium_desc:1 "Một trung tâm thương mại khổng lồ, quy tụ mọi hoạt động giải trí kỳ lạ và hấp dẫn từ các hành tinh xa xôi."
 holding_aid_agency:0 "Cơ quan Viện trợ"
 holding_aid_agency_desc:1 "Một cơ quan được thành lập và điều hành bởi các nhà tài trợ nước ngoài, truyền bá văn hóa và kiến thức của họ trên hành tinh này."
 holding_energy_requisitorium:0 "Bộ Năng lượng"
 holding_energy_requisitorium_desc:1 "Một bộ phận giám sát việc thu thuế tài nguyên năng lượng và đúc tiền, dường như thường xuyên xảy ra xung đột với hệ thống quan liêu của chính quốc gia đó."
 holding_material_requisitorium:1 "Bộ Tinh chế"
 holding_material_requisitorium_desc:1 "Một cơ quan giám sát sản lượng khoáng sản, chiết xuất và tinh chế tại địa phương. Họ luôn có thể mua được những mảnh đất tốt nhất và thu lợi nhuận cho những người tài trợ cho họ."
 holding_produce_requisitorium:2 "Bộ Thu hoạch"
 holding_produce_requisitorium_desc:1 "Một cơ quan giám sát sản lượng của địa phương. Ngoài việc thu những khoản thuế nhỏ nhoi, một lượng lớn của cải cũng dễ dàng bốc hơi giữa mớ thủ tục giấy tờ rườm rà."
 job_energy_requisitioned_effect_desc: "[Root.EnergyProducerWithIcon] sản xuất §R-3§!$r_energy$ cho thuộc quốc, và §G4§!$r_energy$ cho bá chủ."
 job_minerals_requisitioned_effect_desc: "[Root.MineralsProducerWithIcon] sản xuất §R-2§!$r_minerals$ cho thuộc quốc, và §G3§!$r_minerals$ cho bá chủ."
 job_alloy_requisitioned_effect_desc: "[Root.AlloysProducerWithIcon] sản xuất §R-1§!$r_alloys$ cho thuộc quốc, §G2§!$r_alloys$ cho bá chủ, đồng thời làm tăng phí bảo trì [Root.AlloysProducerResources] của thuộc quốc."
 job_food_requisitioned_effect_desc: "[Root.FoodProducerWithIcon] sản xuất §R-3§!$r_food$ cho thuộc quốc, và §G4§!$r_food$ cho bá chủ."
 job_consumer_goods_requisitioned_effect_desc: "[Root.ConsumerGoodsProducerWithIcon] sản xuất §R-3§!$r_consumer_goods$ cho thuộc quốc, tăng phí bảo trì $r_minerals$ của thuộc quốc, và sản xuất §G4§!$r_consumer_goods$ cho bá chủ."
 blocker_tied_to_splinter_hive:0 "$TRIGGER_FAIL$§RChừng nào công trình §YNhánh tổ đàn§! còn ở đây, vật cản này sẽ không biến mất.§!"
 no_free_district_for_splinter_hive:0 "$TRIGGER_FAIL$§RHành tinh này không còn khu vực trống để đặt khu phức hợp sinh đẻ đắt đỏ của chúng ta.§!"
 holding_splinter_hive:0 "Nhánh tổ đàn"
 holding_splinter_hive_desc:1 "Một khối sinh khối khổng lồ dùng để tạo ra ong thợ mới cho tổ đàn. Dù tương đối tách biệt khỏi tổ chính, nó vẫn được kết nối thông qua mạng lưới thần kinh."
 holding_distributed_processing:0 "Trạm xử lý phân tán"
 holding_distributed_processing_desc:1 "Một cơ sở lạnh lẽo che phủ toàn bộ khu vực. Nhân viên ở đây rất kín tiếng về công việc thực sự của họ, nhưng chưa từng có ai bước vào mà còn quay ra nguyên vẹn."
 holding_offspring_nest:0 "Tổ ấp"
 holding_offspring_nest_desc:2 "Trong chiếc tổ này, một tâm trí bầy đàn xa lạ đã cử đến một đại diện đặc biệt đóng vai trò nút trung tâm trong mạng lưới thần kinh của họ. Điều này giúp họ duy trì quyền kiểm soát thuộc địa."
 holding_offworld_foundry:0 "Lò rèn ngoài hành tinh"
 holding_offworld_foundry_desc:0 "Một lò rèn khổng lồ đặt tại một đế chế khác, tập trung tài nguyên địa phương để sản xuất hợp kim chất lượng cao."
 holding_overlord_vigil_command:0 "Sở chỉ huy giám sát"
 holding_overlord_vigil_command_desc:0 "Một trung tâm chỉ huy chuyên biệt để - và chỉ chịu trách nhiệm - tính toán các biện pháp khả thi nhằm tăng cường phòng thủ."
 holding_parasitic_algorithms:0 "Bộ phận nghiên cứu"
 holding_parasitic_algorithms_desc:0 "Một cơ quan chịu trách nhiệm giám sát tiến trình nghiên cứu khoa học của địa phương, nhằm mang về những đột phá và phát hiện giá trị nhất cho chủ nhân."
 holding_parasitic_algorithms_effect_desc:2 "[Root.ResearchProducerWithIcon] chuyển hóa [Root.SubjectResearcherUpkeep] của thuộc quốc thành $r_research$ cho bá chủ."

 holding_noble_vacation_homes:0 "Khu nghỉ dưỡng quý tộc"
 holding_noble_vacation_homes_desc:0 "Đất khách cũng như quê nhà, đây chính là nơi để tầng lớp tinh hoa của bá chủ thỏa sức ăn chơi thác loạn; chỉ cần được xả láng ở đây, họ sẽ không gây rắc rối ở quê nhà."
 holding_noble_vacation_homes_effect:0 "Mỗi $holding_noble_vacation_homes$ tăng cho thủ đô của bá chủ §G+2§!$r_stability$."

 holding_dread_outpost:0 "Tiền đồn đáng sợ"
 holding_dread_outpost_desc:0 "Tiền đồn đáng sợ là một công trình bí ẩn có thể tạo ra đội quân xác sống tà ác, đồng thời liên tục gửi những dữ liệu mờ ám về cho bá chủ của hành tinh này."

 holding_communal_housing_outreach:0 "Mở rộng chương trình nhà ở chung"
 holding_communal_housing_outreach_desc:0 "Ai cũng có quyền có nhà ở, vì vậy bá chủ đã mở rộng chương trình nhà ở chung của họ đến hành tinh này. Chương trình này là một diễn đàn tuyệt vời để lan truyền các giá trị bình đẳng đến cư dân địa phương."

 holding_idyllic_bloom:0 "Tiền đồn ươm mầm Gaia"
 holding_idyllic_bloom_desc:0 "Công nghệ cải tạo môi trường siêu tiên tiến của bá chủ được hội tụ trong công trình này. Sau khi được xây dựng trên hành tinh, nó sẽ mất mười năm để hoàn tất việc cải tạo."
 holding_idyllic_bloom_effect_timer:0 "Sẽ hoàn thành việc cải tạo môi trường vào §Y[Planet.idyllic_bloom_holding_timer]§!."
 holding_idyllic_bloom_effect:0 "Hoàn thành cải tạo môi trường sau §Y10§! năm kể từ khi xây dựng."

 holding_reemployment_center:0 "Trung tâm tái sử dụng lao động"
 holding_reemployment_center_desc:1 "Không nên lãng phí bất cứ nguồn lực nào, kể cả xác chết từ thuộc quốc. Thông qua trung tâm tái sử dụng lao động, bá chủ có thể đảm bảo các hành tinh phụ thuộc luôn có đủ nhân lực, dù chất lượng công việc có thể hơi trồi sụt."
 holding_reemployment_center_effect:0 "\n§Y100§!£pop£§Y Dân cư thây ma§! sẽ thức tỉnh vào §Y[Planet.reemployment_center_timer]§!"

 holding_recruitment_office:0 "Văn phòng tuyển quân"
 holding_recruitment_office_desc:0 "Ai cũng có nghĩa vụ cống hiến, vì vậy bá chủ đã mang đến cho chúng ta chương trình huấn luyện quân sự, với phần thưởng là cơ hội được chiêm ngưỡng hạm đội của họ. Quyền công dân có được nhờ việc phục vụ quân ngũ."
 MESSAGE_OVERLORD_RECRUIT_TITLE:0 "Hoàn thành nhiệm vụ điều phái"
 MESSAGE_OVERLORD_RECRUIT_DESC:0 "Những §Y[moving_pop.GetSpeciesNamePlural]§! tham gia cùng chúng ta đã quyết định ở lại $PLANET|Y$ sau khi hoàn thành nhiệm vụ. Thuộc quốc của chúng ta không vui vẻ gì, nhưng họ chẳng có quyền gì đối với công dân của chúng ta."

 holding_park_ranger_lodge:0 "Trạm kiểm lâm"
 holding_park_ranger_lodge_desc:0 "Bá Chủ thích sống hòa hợp với thiên nhiên và muốn chia sẻ niềm vui này với các chư hầu. Để duy trì điều này, nơi đây luôn giữ lại một phần môi trường tự nhiên nguyên sơ để tận hưởng."
 no_free_district_for_ranger_lodge:0 "$TRIGGER_FAIL$§RỞ đây không còn vùng đất hoang sơ nào để chúng ta bảo vệ nữa.§!"
 blocker_tied_to_ranger_lodge:0 "$TRIGGER_FAIL$§RChừng nào công trình §Y$holding_park_ranger_lodge$§! còn đó, vật cản này sẽ tồn tại vĩnh viễn.§!"
 no_ranger_lodge_wilderness: "$TRIGGER_FAIL$§RMột hành tinh hoang dã vốn dĩ đã ngập tràn thiên nhiên chưa được khai phá rồi.§!"

 holding_tree_of_life_sapling:1 "Mầm cây sự sống"
 holding_tree_of_life_sapling_desc:0 "Bá Chủ này đã sống chung với cây sự sống của họ từ rất lâu, đến mức không thể tưởng tượng nổi một cuộc sống thiếu nó. Giờ đây, họ muốn các chư hầu của mình cũng được hưởng cơ hội tương tự."
 no_tree_of_life_sapling_wilderness: "$TRIGGER_FAIL$§RMôi trường hoang dã chứa đầy rủi ro đối với những mầm cây ngoại lai.§!"

 holding_franchise_headquarters:0 "Trụ sở công ty nhượng quyền"
 holding_franchise_headquarters_desc:0 "Những văn phòng này áp dụng các biện pháp quản lý doanh nghiệp, thông qua các đợt huấn luyện bắt buộc quy mô toàn hành tinh và hoạt động gắn kết nhóm, để đảm bảo lợi ích của công ty con luôn đi đôi với bá chủ."
 holding_franchise_headquarters_effect:0 "\n[trader.GetIcon]§Y[trader.GetNamePlural]§! sản xuất §R-2§!$r_trade$ cho thuộc quốc, và §G1§!£unity£§Y$unity$§! cho bá chủ."
 no_branch_office:0 "$TRIGGER_FAIL$§RCần có một chi nhánh của [owner.overlord.GetName]§!"
 planet_corporate_franchising_meddling:0 "Doanh nghiệp can thiệp"
 holding_franchise_headquarters_ethics_effect:0 "\nNếu bá chủ có tư tưởng cực đoan, sức hút của tư tưởng đó sẽ tăng thêm §G+100%§!."

 holding_experimental_crater:0 "Hố thử nghiệm"
 holding_experimental_crater_desc:0 "Một khu vực chuyên dùng để thử nghiệm tàu thuộc địa bằng tiểu hành tinh. Có lẽ đây không phải cách tiện nhất để thử loại tàu này, nhưng việc thuê ngoài quá trình này chắc chắn sẽ tiết kiệm cho bá chủ cả đống chi phí dọn dẹp."
 holding_experimental_crater_effect:0 "§YCẩn thận:§!\n    'Tàu' thuộc địa bay tới có thể bị §Rnổ tung§!!"
 MESSAGE_OVERLORD_CRATER_TITLE:0 "Tiểu hành tinh thuộc địa thử nghiệm"
 MESSAGE_OVERLORD_CRATER_DESC:0 "Một tiểu hành tinh thuộc địa từ bá chủ của chúng ta đã đâm sầm vào $PLANET|Y$. Sẽ cần vài tháng để sửa chữa xong thiệt hại trên hành tinh này."

 holding_organic_sanctuary:0 "Khu bảo tồn hữu cơ"
 holding_organic_sanctuary_desc:0 "Dù so với các cơ sở trên hành tinh của bá chủ, khu điều dưỡng ở đây có quy mô khiêm tốn hơn nhiều, nhưng những sinh vật cảnh sống trong đó vẫn được hưởng mức sống cao hơn hẳn trước kia."
 no_organic_sanctuary_wilderness: "$TRIGGER_FAIL$§RMôi trường hoang dã không thích hợp để $job_bio_trophy_plural$ sinh sống lâu dài.§!"

 holding_sacrificial_shrine:0 "Đền hiến tế"
 holding_sacrificial_shrine_desc:0 "Nghiên cứu vĩ đại về luân hồi sinh tử không nên chỉ giới hạn ở bá chủ; các chư hầu cũng phải tham gia khám phá ranh giới giữa sự sống và cái chết."
 # Deposits
 d_spawning_complex_blocker:0 "£blocker£ Khu phức hợp sinh đẻ của bá chủ"
 d_spawning_complex_blocker_desc:1 "Một khối sinh khối lớn, không ngừng co bóp và chuyển động, chầm chậm sinh ra những cá thể thợ mới cho tổ đàn."
 d_prospectorium_strip_mine:0 "Khu mỏ lộ thiên của Nước khai khoáng"
 d_prospectorium_strip_mine_desc:1 "Một khu phức hợp khai thác được xây dựng dựa trên kiến thức chuyên môn, có khả năng tận dụng tối đa tài nguyên địa phương."
 d_nature_preserve_blocker:0 "Khu bảo tồn thiên nhiên"
 d_nature_preserve_blocker_desc:0 "Một khu vực tràn ngập vẻ đẹp tự nhiên, theo sắc lệnh của bá chủ, nơi này sẽ mãi mãi không được phép xâm phạm."
 d_buried_lithoids_overlord:0 "$d_buried_lithoids$"
 d_buried_lithoids_overlord_desc:0 "Lứa 'phi công thử nghiệm' mới nhất từ bá chủ của chúng ta đã đi vào trạng thái ngủ đông sau khi hạ cánh va chạm thành công xuống [Root.GetName]. Nếu đào họ lên, có lẽ chúng ta sẽ thuyết phục được họ gia nhập phe mình."

 # Proposal verification messages
 ACTION_RECIPIENT_MUST_HAVE_POSITIVE_LOYALTY:1 "Chỉ có thể đề xuất thỏa thuận khi tạo ra £loyalty£ mức độ trung thành mang giá trị dương"
 AGREEMENT_COOLDOWN_ACTIVE:2 "Chúng ta không thể đề xuất bất kỳ thay đổi nào cho thỏa thuận này trước $DATE$ ($MONTHS_LEFT$ tháng)."
 AGREEMENT_CAN_NOT_AFFORD_PROPOSE:1 "§RChúng ta không thể chi trả £influence£$COST|Y$ điểm ảnh hưởng!§!"
