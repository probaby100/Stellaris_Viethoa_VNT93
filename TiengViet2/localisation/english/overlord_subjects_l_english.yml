 # Specialist modifiers
 specialist_bulwark_overlord_modifier:0 "Cố vấn Thành trì"
 specialist_bulwark_overlord_modifier_desc:0 "§LCác chuyên gia từ Thành trì của chúng ta đã đóng góp công sức, nâng cao hiệu quả xây dựng các công trình phòng thủ của chúng ta.§!"
