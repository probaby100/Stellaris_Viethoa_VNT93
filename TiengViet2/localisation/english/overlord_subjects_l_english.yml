 specialist.905.desc.gestalt:0 "Các [root.GetIndividualNamePlural] của chúng ta trên [From.GetName] đã tìm ra nguyên nhân tạo nên tín hiệu kỳ lạ đó. [Root.SensorReadings]\n\n[Root.SensorReadingsEngineering]"

