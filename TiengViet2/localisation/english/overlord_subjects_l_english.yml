 # Trade Actions
 trade_action_pledge_loyalty:0 "Thề trung thành"
 trade_action_pledge_loyalty_desc:0 "§LDĩ nhiên rồi, chư hầu thấp hèn luôn khao khát được thề trung thành với bá chủ cao quý. Đây chính là cách đền đáp sự nhân từ và sáng suốt của ngài!§!"
 trade_action_share_empire_data:0 "Chia sẻ dữ liệu đế chế"
 trade_action_share_empire_data_desc:0 "§LThú thực mà nói, thuộc quốc chẳng có lý do gì để giấu giếm bí mật với một bá chủ anh minh cả. Ngược lại cũng vậy, họ cũng không nên bị bịt mắt hoàn toàn!§!"
 trade_action_bulwark_prefabs:0 "Nhà lắp ghép phòng thủ"
 trade_action_bulwark_prefabs_desc:0 "§LHãy làm cho những chuyện này trở nên đơn giản hơn với chúng ta: xây dựng các công sự đồn lũy và vũ khí, bảo vệ tất cả những gì thuộc về chúng ta một cách hợp pháp.§!"
 trade_action_bulwark_technology:0 "Công nghệ phòng thủ"
 trade_action_bulwark_technology_desc:0 "§LĐừng coi hành động này là chúng ta đang trưng dụng công nghệ căn cứ không gian. Hãy nghĩ thế này, các người đang an tâm giao phó quyền kiểm soát cho một bộ máy quản lý khôn ngoan và học thức hơn.§!"
 bulwark_technology_physics_modifier:0 "Chia sẻ $trade_action_bulwark_technology$"
 bulwark_technology_engineering_modifier:0 "$bulwark_technology_physics_modifier$"
 trade_action_scholarium_hypotheses:0 "Giả thuyết học thuật"
 trade_action_scholarium_hypotheses_desc:0 "§LChúng ta biết tỏng lũ chư hầu học giả kia chẳng thể nào hiểu hết được thành quả nghiên cứu của chính chúng. Hãy để chúng ta khai sáng cho chúng bằng vài tư tưởng cởi mở hơn nào.§!"
 trade_action_scholarium_processors:0 "Bộ xử lý học thuật"
 trade_action_scholarium_processors_desc:0 "§LTrí não có hạn của đám chư hầu chỉ nên tập trung vào dăm ba chuyện vặt vãnh. Trí tuệ hạ đẳng thì đi thu thập dữ liệu, còn việc cân nhắc hơn thiệt đương nhiên phải dành cho bá chủ thượng đẳng.§!"
 trade_action_prospectorium_techniques:0 "Kỹ thuật khai khoáng"
 trade_action_prospectorium_techniques_desc:0 "§LChúng ta biết các chư hầu của mình đang xắn tay áo lên điên cuồng khai thác tài nguyên, vậy nên cứ để vị bá chủ với tầm nhìn xa trông rộng này quản lý chúng thật tốt.§!"
 trade_action_prospectorium_technology:0 "Công nghệ khai khoáng"
 trade_action_prospectorium_technology_desc:0 "§LChư hầu của chúng ta đúng là thông minh hết chỗ chê! Chúng đã hi sinh vô vàn chỉ để học hỏi kỹ thuật khai thác mỏ xịn sò hơn. Để tôn trọng những nỗ lực không mệt mỏi của chúng, chúng ta phải tận dụng tối đa công nghệ này mới được.§!"
 prospectorium_technology_physics_modifier:0 "Chia sẻ $trade_action_prospectorium_technology$"
 prospectorium_technology_society_modifier:0 "$prospectorium_technology_physics_modifier$"
 prospectorium_technology_engineering_modifier:0 "$prospectorium_technology_physics_modifier$"

