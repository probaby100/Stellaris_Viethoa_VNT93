 ## Scripted Loc for Planetary Sensors
 # First Part
 SensorReadings1:0 "Họ tình cờ bắt gặp tàn tích của một con tàu đâm sầm xuống địa điểm mục tiêu, vẫn đang thi thoảng phát ra những tín hiệu yếu ớt."
 SensorReadings2:0 "Họ tìm thấy một trạm khai thác cổ đại trên quỹ đạo, có vẻ như đã bị chủ nhân của nó bỏ hoang từ rất lâu rồi."
 SensorReadings3:0 "Hành trình lần theo tín hiệu yếu ớt đã dẫn họ đến một tiền đồn nhỏ bị bỏ hoang, tuy nhiên những dấu vết xung quanh lại cho thấy một thực thể nào đó với trình độ công nghệ ngang ngửa chúng ta mới xuất hiện ở đây dạo gần đây."
 SensorReadings4:0 "Xung quanh vị trí phát tín hiệu vương vãi đầy những mảnh vỡ thân tàu và rác rưởi, đánh giá thì chắc chắn chúng từng thuộc về một căn cứ không gian cỡ lớn từng hiện diện ở một thời điểm nào đó - thế nhưng lại chẳng có dấu vết nào cho thấy có một cấu trúc như vậy từng nằm gần đây."

 # Second Part
 SensorReadingsSociety1:0 "Khi lùng sục khu vực xung quanh địa điểm, họ đã tìm được một thứ trông giống khoang cứu sinh rỗng, bên trong chứa tàn tích của một dạng sống ngoài hành tinh chưa từng được biết đến. Họ dự định sẽ mang mẫu vật này về làm các bài kiểm tra chuyên sâu càng sớm càng tốt."
 SensorReadingsSociety2:0 "Tín hiệu mà chúng ta bắt được trước đây xuất phát từ một cỗ máy vẫn đang hoạt động bằng cách nào đó. Đội của chúng ta đã trích xuất được một số tài liệu về nền văn minh chế tạo ra nó. Vì trước đây chúng ta chẳng biết gì nhiều về nền văn minh này, nên chúng ta đã thêm chúng vào cơ sở dữ liệu - mặc dù trông họ có vẻ đến từ một kỷ nguyên cổ xưa hơn nhiều."
 SensorReadingsSociety3:0 "Mặc dù địa phương này chẳng có bất kỳ dấu hiệu sống nào của sinh vật có tri giác, nhưng đây lại là nơi sinh sản của rất nhiều loài động vật, và những con vật này dường như đã học được cách sử dụng máy móc hỏng hóc làm đạo cụ cho màn phô diễn tán tỉnh của mình. Đội của chúng ta sẽ mang một phần về để quan sát thêm."
 SensorReadingsSociety3Gestalt:0 "Có vẻ như động vật hoang dã địa phương đã dùng các bộ phận máy móc bên trong làm đạo cụ cho màn phô diễn tán tỉnh của chúng. Dù chúng ta thường chẳng có hứng thú gì với bọn động vật này, nhưng các [root.GetIndividualNamePlural] của chúng ta vẫn mang một số sinh vật thú vị này về để tiếp tục theo dõi."
 SensorReadingsSociety4:0 "Khi rà soát khu vực hiện tại, họ tình cờ tìm thấy một thư viện nhỏ, chứa đầy những cuốn sách ghi chép chi tiết về đặc điểm sinh học của nhiều loài động vật địa phương, những cuốn sách này đến từ nhiều hành tinh mà các cư dân nguyên thủy từng viếng thăm. Đội của chúng ta sẽ mang những cuốn sách này về, bắt đầu giải mã ngôn ngữ được sử dụng trong đó và bổ sung mọi thông tin trích xuất được vào cơ sở dữ liệu."
 SensorReadingsSociety4Gestalt:0 "Sau khi lục soát toàn bộ khu vực này, chúng ta đã phát hiện ra một thư viện. Các cuốn sách trong đó mô tả vô cùng chi tiết về đặc điểm sinh học của hàng ngàn loài thực vật ngoại lai, các tiêu bản được thu thập từ mọi hành tinh mà cư dân nguyên thủy từng đặt chân đến. Chúng ta sẽ mang những cuốn sách này về để hoàn thiện cơ sở dữ liệu của mình."

 SensorReadingsPhysics1:0 "Dù chẳng còn lại thứ gì hữu ích, đội của chúng ta vẫn tìm được một số bài nghiên cứu ghi chép lại hoạt động địa chất của nhiều hành tinh khác nhau - ít nhất thì dựa vào hình vẽ trên đó, họ tin là như vậy. Họ sẽ mang bất cứ tài liệu nào được cho là còn có thể cứu vãn được về, sau đó giải mã chúng càng sớm càng tốt."
 SensorReadingsPhysics1Gestalt:0 "Dù chẳng còn lại chút tài liệu hữu ích nào, nhưng máy bay không người lái kỹ thuật của chúng ta vẫn định vị được một số bài nghiên cứu ghi chép lại hoạt động địa chất của nhiều hành tinh khác nhau. Mọi tài liệu có thể cứu vãn được sẽ được mang về, sau đó sẽ được giải mã càng sớm càng tốt."
 SensorReadingsPhysics2:0 "Đội của chúng ta đã tốn rất nhiều thời gian cố gắng phá vỡ hàng rào phòng thủ của cỗ máy vẫn đang hoạt động kia, kết quả lại phát hiện ra bên trong nó chẳng có thứ gì xài được. Dẫu vậy, bản thân cỗ máy đã gợi lên sự tò mò của họ, họ sẽ mang một vài bộ phận về."
 SensorReadingsPhysics2Gestalt:0 "Chúng ta đã tốn rất nhiều thời gian để phá vỡ cỗ máy phát ra tín hiệu đó, và giờ có thể chắc chắn rằng nó cất giấu một bí mật nào đó chưa từng được hé lộ. Bất luận chúng ta có thể thu hồi được bộ phận nào, chúng cũng sẽ được mang về ngay lập tức."
 SensorReadingsPhysics3:0 "Họ phát hiện ra một cỗ máy có khả năng đã tạo ra lớp màng chắn mỏng yếu bao quanh khu vực này - rất có thể đây là lý do duy nhất khiến ban đầu chúng ta tìm thấy những thứ này. Những thứ khác chẳng có giá trị gì, họ đã tốn chút thời gian tháo dỡ để hi vọng tìm ra điều gì đó."
 SensorReadingsPhysics4:0 "Mặc dù thiếu bảo dưỡng hay duy trì, nhưng dường như có một lò phản ứng nhiệt hạch từng được dùng để hỗ trợ các cơ sở tham gia ở đây vẫn đang tiếp tục hoạt động. Đội ngũ của chúng ta đặc biệt hứng thú với điều này và sẽ tiến hành điều tra chuyên sâu."
 SensorReadingsPhysics4Gestalt:0 "Mặc dù thiếu công đoạn bảo dưỡng cần thiết, nhưng một lò phản ứng nhiệt hạch từng được dùng để hỗ trợ các cơ sở tham gia ở đây vẫn đang tiếp tục hoạt động. Các cá thể kỹ thuật của chúng ta sẽ tiến hành điều tra chuyên sâu để hi vọng tìm ra điều gì đó."

 SensorReadingsEngineering1:0 "Khi các chuyên gia của chúng ta đang lục lọi trong đống đổ nát ở đây, họ đã tìm thấy một số bộ phận tàu gần như còn nguyên vẹn. Dù đã xuống cấp do năm tháng đằng đẵng, nhưng các kỹ sư của chúng ta tin rằng họ vẫn có thể chắt lọc được chút thông tin từ chúng."
 SensorReadingsEngineering1Gestalt:0 "Trong lúc bới móc đống đổ nát, các [root.GetIndividualNamePlural] của chúng ta đã phát hiện ra một số bộ phận tàu. Dù đã hư hỏng không thể sử dụng do xuống cấp trầm trọng, nhưng chúng ta tin rằng vẫn có thể chắt lọc được chút thông tin từ chúng."
 SensorReadingsEngineering2:0 "Dù nơi đây khá hoang vắng, nhưng các chuyên gia của chúng ta vẫn phát hiện ra một số vật liệu xây dựng chưa từng thấy trước đây. Sau khi họ hoàn tất công tác khai quật và phân tích, các mẫu vật sẽ được mang về để thử nghiệm thêm."
 SensorReadingsEngineering2Gestalt:0 "Các [root.GetIndividualNamePlural] của chúng ta đã phát hiện ra một loại vật liệu xây dựng mà chúng ta chưa từng thấy trước đây. Dù có lẽ không thể trực tiếp đem ra xài, nhưng chúng ta có thể mang nó về để tiếp tục phân tích thêm."
 SensorReadingsEngineering3:0 "Dù không phát hiện bất kỳ sinh vật có tri giác nào ở đây, đội khai quật của chúng ta trong lúc đào sâu xuống dưới lại tìm thấy một số robot tự hành. Chúng đã hư hại nghiêm trọng, khó có thể thực hiện công tác dịch ngược hoàn chỉnh, nhưng các kỹ thuật viên của chúng ta tin rằng những linh kiện rải rác này vẫn có thể cung cấp cho chúng ta công nghệ chế tạo mới."
 SensorReadingsEngineering3Gestalt:0 "Các [root.GetIndividualNamePlural] khai quật của chúng ta đã phát hiện ra một số tín hiệu có điểm tương đồng cơ bản với ý thức tập thể của chính chúng ta, sau khi đào sâu thêm một chút thì phát hiện ra hai robot tự động cũ kỹ đã bị hỏng. Dù hư hại đã không thể sửa chữa, nhưng chúng ta tin rằng thông qua việc dịch ngược các bộ phận của chúng, chúng ta vẫn có thể hiểu thêm về cách thức chế tạo ra chúng."
 SensorReadingsEngineering4:0 "Trong lúc sàng lọc đống đổ nát, họ phát hiện ra tàn tích của một hầm nhỏ từng dùng để cất trữ nguyên vật liệu, nay đã trống không - rất có khả năng đã bị bọn cướp biển cuỗm đi từ lâu. Tuy nhiên, trong đó vẫn còn sót lại một số bản thiết kế về cách thức cư dân nguyên thủy từng khai thác những nguyên vật liệu tương tự, thứ này có lẽ sẽ hữu dụng."

 SensorReadingsRare1:0 "Dù nơi đây là một mớ hỗn độn, nhưng đội của chúng ta vẫn tìm được một cỗ máy hoàn toàn không bị tổn hại bởi thời gian, động vật hoang dã hay cướp biển. Họ tin rằng chỉ cần giải mã được nó càng nhanh càng tốt, bên trong đó chắc chắn ẩn chứa những bí mật có thể mang lại sự đột phá về khoa học."
 SensorReadingsRare1Gestalt:0 "Dù các khu vực khác ở đây nát bét, nhưng các [root.GetIndividualNamePlural] của chúng ta vẫn tìm thấy một cỗ máy không bị hư hại bởi thời gian, động vật hoang dã hay cướp biển. Chỉ cần giải mã được nó càng sớm càng tốt, chúng ta sẽ có cơ hội khai quật những bí mật bị vùi lấp sâu thẳm trong đó."
 SensorReadingsRare2:0 "Ngay khi đội của chúng ta định rời khỏi khu vực này, họ đã phát hiện ra một rương nhỏ đựng các bản vẽ thiết kế và bài nghiên cứu. Theo lời các chuyên gia của chúng ta, những nội dung này không những rất dễ giải mã, mà một số trong đó thậm chí có thể giải quyết dứt điểm các bài toán hóc búa trong những nghiên cứu mà chúng ta mới triển khai gần đây."
 SensorReadingsRare2Gestalt:0 "Ngay trước khi các [root.GetIndividualNamePlural] bảo trì của chúng ta định rời khỏi khu vực này, họ đã phát hiện ra một rương nhỏ đựng các bản thiết kế và bài nghiên cứu. Những nội dung này không những rất dễ giải mã, mà chúng ta còn tin rằng một số trong đó thậm chí có thể giải quyết các bài toán hóc búa trong những nghiên cứu mà chúng ta mới triển khai gần đây."

 # Prospectorium Resource Discovery
 specialist.1150.title:0 "Phát hiện tài nguyên"
 specialist.1150.desc:0 "Trong lúc tìm kiếm các hệ sao dưới quyền kiểm soát của chúng ta, một thiết bị bay không người lái đã thu được vài tín hiệu rời rạc từ [prospectorium_discovery_target.System.GetName]. Hệ sao này có thể đang cất giấu thứ gì đó ngoài sức tưởng tượng của chúng ta.\n\nDù các tín hiệu bị lẫn lộn vào nhau, nhưng chúng có thể bắt nguồn từ vài nguồn khác nhau, và thiết bị của chúng ta khó lòng dò tìm tất cả cùng lúc. Chúng ta muốn tập trung điều tra:"
 specialist.1150.a:0 "Tín hiệu §YNăng lượng§!. Thứ đó đúng là buồn ngủ gặp chiếu manh với chúng ta."
 specialist.1150.a.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £energy£§Y3-5 Năng lượng§!, và một kho dự trữ §Y500-1000 Năng lượng§! dùng một lần."
 specialist.1150.b:0 "Thêm §YKhoáng vật§!."
 specialist.1150.b.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £minerals£§Y3-5 Khoáng vật§!, và một kho dự trữ §Y500-1000 Khoáng vật§! dùng một lần."
 specialist.1150.c:0 "§YHợp kim§!? Thật là thu hoạch ngoài mong đợi ở một nơi như thế này."
 specialist.1150.c.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £alloys£§Y2-4 Hợp kim§!, và một kho dự trữ §Y150-450 Hợp kim§! dùng một lần."
 specialist.1150.d:0 "Nếu ở đó có §YPha lê hiếm§!, chúng ta sẽ muốn tìm ra chúng."
 specialist.1150.d.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £rare_crystals£§Y1-3 Pha lê hiếm§!, và một kho dự trữ §Y50-150 Pha lê hiếm§! dùng một lần."
 specialist.1150.e:0 "Hiếm khi chúng ta mới bắt được tín hiệu §YHạt dễ nổ§!."
 specialist.1150.e.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £volatile_motes£§Y1-3 Hạt dễ nổ§!, và một kho dự trữ §Y50-150 Hạt dễ nổ§! dùng một lần."
 specialist.1150.f:0 "§YKhí ngoại lai§!. Thứ này chắc chắn vừa kỳ lạ vừa thú vị."
 specialist.1150.f.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £exotic_gases£§Y1-3 Khí ngoại lai§!, và một kho dự trữ §Y50-150 Khí ngoại lai§! dùng một lần."
 specialist.1150.g:0 "Cứ bỏ mặc §YZro§! ở đó thì quá sức nguy hiểm."
 specialist.1150.g.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £sr_zro£§Y1 Zro§!, và một kho dự trữ §Y25-75 Zro§! dùng một lần."
 specialist.1150.h:0 "Tín hiệu §YVật chất tối§! đã thành công khơi dậy sự hứng thú của chúng ta."
 specialist.1150.h.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £sr_dark_matter£§Y1 Vật chất tối§!, và một kho dự trữ §Y25-75 Vật chất tối§! dùng một lần."
 specialist.1150.i:0 "§YKim loại sống§!? Chúng ta không thể ngoảnh mặt làm ngơ trước một cơ hội thế này."
 specialist.1150.i.tt:0 "Hoàn thành dự án đặc biệt sẽ tạo ra một mỏ £sr_living_metal£§Y1 Kim loại sống§!, và một kho dự trữ §Y25-75 Kim loại sống§! dùng một lần."

