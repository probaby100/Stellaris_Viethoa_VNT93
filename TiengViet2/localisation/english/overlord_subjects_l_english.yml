 # Agreement terms
 specialist_type:0 "Chuyên môn Chư hầu"
 specialist_type_desc:1 "Điều khoản này chỉ định hướng chuyên môn hóa mà Chư hầu nên chuyển đổi thành."
 resource_subsidies:0 "Đóng góp"
 resource_subsidies_desc:1 "Điều khoản này chỉ định lượng tài nguyên mà Chư hầu phải nộp cho Bá Chủ mỗi tháng. Con số này là một tỷ lệ phần trăm dựa trên sản lượng hàng tháng hiện tại của Chư hầu.\n\nNếu giá trị này là số âm, điều đó có nghĩa là Bá Chủ nên cung cấp tài nguyên cho Chư hầu thay vì ngược lại, số lượng phụ thuộc vào một tỷ lệ nhất định trên sản lượng hàng tháng hiện tại của Chư hầu."
 AGREEMENT_RESOURCE_TAX:2 "Chư hầu sẽ nộp $VALUE|Y$ sản lượng $RESOURCE|Y$ hàng tháng của mình cho Bá Chủ.\n\n$AGREEMENT_RESOURCE_BLOCKS_TRADE$"
 AGREEMENT_RESOURCE_SUBSIDIES:2 "Bá Chủ sẽ cung cấp trợ cấp cho Chư hầu một khoản tương đương với $VALUE|Y$ sản lượng $RESOURCE|Y$ hàng tháng của Chư hầu.\n\n$AGREEMENT_RESOURCE_BLOCKS_TRADE$"
