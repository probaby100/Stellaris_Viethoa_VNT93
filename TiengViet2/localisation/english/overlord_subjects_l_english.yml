 # Specialist Leader Traits
 leader_trait_scholarium_investigator:0 "Điều tra viên Học viện"
 leader_trait_scholarium_investigator_desc:1 "Các chuyên gia của Học viện coi toàn bộ vũ trụ như một câu đố khổng lồ đang chờ được giải đáp."
 leader_trait_scholarium_explorer:0 "Nhà thám hiểm Học viện"
 leader_trait_scholarium_explorer_desc:0 "Sự tò mò của các chuyên gia Học viện thúc đẩy họ đi đến mọi ngóc ngách của vũ trụ, thậm chí là những khu vực nằm ngoài tầm với."
 leader_trait_scholarium_observer:0 "Người Quan sát Học viện"
 leader_trait_scholarium_observer_desc:0 "Đối với một học giả của Học viện, mọi bí ẩn đều cần được làm sáng tỏ."
 leader_trait_bulwark_watcher:0 "Người Theo Dõi Thành Trì"
 leader_trait_bulwark_watcher_desc:0 "Phi hành đoàn cảnh giác luôn trong tình trạng sẵn sàng, luôn sẵn sàng phát hiện hạm đội địch, tuyệt đối không cho phép đối phương tiến hành dù là những cuộc quấy rối vô ích và hèn nhát."
 leader_trait_bulwark_retaliator:1 "Bậc thầy Phản công Thành trì"
 leader_trait_bulwark_retaliator_desc:0 "Có một chỉ huy chính trực nắm quyền tại trung khu, hạm đội luôn sẵn sàng xuất kích, sẽ phát động cuộc tấn công trả đũa đối với bất kỳ hành động nào xâm phạm chủ quyền của chúng ta."
 leader_trait_bulwark_sentinel:0 "Lính Gác Thành Trì"
 leader_trait_bulwark_sentinel_desc:0 "Phi hành đoàn dũng cảm vẫn duy trì được phòng tuyến ngay cả khi phải đối mặt với kẻ thù, sẵn sàng đánh đuổi lũ ngốc dám tấn công vùng không gian của chúng ta về quê!"
 leader_trait_prospectorium_extractor:0 "Thợ Khai Thác Khu thăm dò"
 leader_trait_prospectorium_extractor_desc:0 "Năng lượng, hợp kim, khoáng sản, tất cả những thứ này đều có thể hiện thực hóa tham vọng của chúng ta. Người khai thác có thể tối đa hóa lượng tài nguyên thu được từ chúng."
 leader_trait_prospectorium_optimizer:0 "Người Tối Ưu Hóa Khu thăm dò"
 leader_trait_prospectorium_optimizer_desc:0 "Để giữ cho đám đông khỏe mạnh và làm việc hiệu quả, cần phải đầu tư nguồn lực, Người Tối Ưu Hóa là người phù hợp nhất để quản lý chúng."
 leader_trait_prospectorium_refiner:0 "Nhà Tinh Chế Khu thăm dò"
 leader_trait_prospectorium_refiner_desc:0 "Nhà tinh chế sở hữu những kiến thức chuyên môn hiếm có, đóng vai trò sống còn trong việc tăng cường sản lượng Khí lạ, Hạt Nổ và Tinh Thể Quý Hiếm của chúng ta."

