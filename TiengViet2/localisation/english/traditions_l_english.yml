 tr_aptitude_healthcare_program_hive_delayed:0 "Những [GetIndividualNamePlural] đặc hóa có giá trị cao nên được trao khả năng tự bảo trì cơ thể và được phép tiêu thụ nguồn dinh dưỡng cao cấp hơn."
 tr_aptitude_healthcare_program_machine:0 "Bảo trì Phòng ngừa"
 tr_aptitude_healthcare_program_machine_delayed:0 "Thông qua giám sát hệ thống liên tục, chúng ta quản lý mọi thứ từ tần suất sao lưu đến quy trình sửa chữa cường độ cao để nâng cao năng lực của lãnh đạo."
 tr_aptitude_champions_of_the_empire:0 "Đội tiên phong của Đế chế"
 tr_aptitude_champions_of_the_empire_delayed:0 "Chúng ta tin tưởng vào những nhà lãnh đạo của mình, trao cho họ quyền hạn tuyệt đối để quyết định cách thức vận hành của Đế chế."
 tr_aptitude_champions_of_the_empire_hive:0 "Tự chủ Phân cấp"
 tr_aptitude_champions_of_the_empire_hive_delayed:0 "[GetGestaltEntityName] sẵn lòng trao quyền tự chủ ở mức độ nhất định cho những cá thể mạnh nhất để mang lại lợi ích cho toàn thể."
 tr_aptitude_champions_of_the_empire_machine:0 "Quyền hạn Hành chính"
 tr_aptitude_champions_of_the_empire_machine_delayed:0 "Chúng ta tin tưởng vào các tiểu trình chuyên biệt của lãnh đạo và cấp cho chúng quyền tác động đến phương thức vận hành của Đế chế."
