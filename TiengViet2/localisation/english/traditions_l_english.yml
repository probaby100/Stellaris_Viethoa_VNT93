 tr_psionics_finish:0 "Hoàn thành truyền thống Tâm linh"
 tr_psionics_finish_desc:0 "Mở khóa một §YDự án đặc biệt§! để ký kết khế ước.\n$MOD_COUNTRY_EDICT_FUND_ADD$: §G+50§!\nMở khóa ô Đặc Quyền Thăng Hoa: §G+1§!"

 tr_psionics_psi_corps:0 "$building_psi_corps$"
 tr_psionics_psi_corps_desc:1 "[GetAllowPsiCorps]"
 tr_psionics_psi_corps_delayed:0 "[GetPsionicPsiCorpsDelayed]"
 tr_psionics_psi_corps_delayed_organic:0 "Quân đoàn tâm linh như những con mắt tinh tường nhất, sẽ dòm ngó nội tâm của từng [GetCitizenPlural], phòng ngừa từ sớm những kẻ có nguy cơ gây hại cho xã hội."
 tr_psionics_psi_corps_delayed_machine:0 "Quân đoàn tâm linh như những con mắt tinh tường nhất, sẽ liên tục giám sát nội tâm của từng [GetCitizenPlural], phòng ngừa từ sớm những kẻ có nguy cơ gây hại cho xã hội."

 tr_psionics_psionic_assimilation:0 "Đại thức tỉnh"
 tr_psionics_psionic_assimilation_desc:0 "Tất cả các loài mang đặc tính §Y$trait_latent_psionic$§! sẽ giải phóng toàn bộ tiềm năng tâm linh.\nCó thể tiến hành §YĐồng hóa tâm linh§!, kích hoạt tiềm năng của các loài khác.\n[GetPsionicAssimilationEffectShroud]"
 tr_psionics_psionic_assimilation_desc_indiv_organic:0 "$CAN_ASSIMILATE_HIVES$."
 tr_psionics_psionic_assimilation_desc_hive_mind:0 "$CAN_ASSIMILATE_HIVES$."
 tr_psionics_psionic_assimilation_desc_indiv_machine:0 "Có thể đồng hóa các loài §YCơ khí§! và §YCơ khí hóa§!."
 tr_psionics_psionic_assimilation_desc_gestalt_machine:0 "$tr_psionics_psionic_assimilation_desc_indiv_machine$"
 tr_psionics_psionic_assimilation_desc_driven_assimilators:0 "$tr_psionics_psionic_assimilation_desc_indiv_machine$\nGiữ lại khả năng đồng hóa các loài §YHữu cơ§! thông qua §H$living_standard_ego_assimilation$§!.\n$CAN_ASSIMILATE_HIVES$."
 tr_psionics_psionic_assimilation_delayed:0 "Đôi mắt có thể nhìn thấu mọi mộng ảo điên đảo đã nhắm lại. Chỉ có làm mọi thứ trong khả năng mới có thể một lần nữa mở ra đôi mắt ấy, khiến sức mạnh thực sự của chúng ta thức tỉnh."

 tr_psionics_breach_shroud:0 "Xâm nhập Hư cảnh"
 tr_psionics_breach_shroud_desc:0 "Mở khóa một §YDự án đặc biệt§! để xâm nhập Hư cảnh.\nMỗi $pop_group_unit$ [telepath.GetNamePlural] [telepath.GetIcon] tăng $mod_psionic_pop_bonus_workforce_mult$: §G+5%§!"
 tr_psionics_breach_shroud_delayed:0 "Suối nguồn sức mạnh vô tận đang vẫy gọi chúng ta, nhưng chúng ta vẫn cần phải học cách hấp thu."

 tr_psionics_shrouded_encryption:0 "Giao tiếp Hư cảnh"
 tr_psionics_shrouded_encryption_delayed:0 "Mã hóa và giải mã bằng ngoại cảm là công nghệ an ninh thế hệ tiếp theo của chúng ta."
 tr_psionics_mind_readers:0 "Thuật đọc tâm"
 tr_psionics_mind_readers_delayed:0 "Suy nghĩ của các đế chế khác vang vọng trong Hư cảnh; sức mạnh tâm linh của chúng ta cho phép chỉ cần tĩnh lặng lắng nghe cũng thu được nhiều thông tin có lợi."
