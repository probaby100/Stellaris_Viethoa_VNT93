 tradition_discovery:0 "Khám Phá"
 #tradition_discovery_desc: "For the first time in the history of our civilization, we live in an age where our reach extends beyond the confines of our homeworld. Our insatiable curiosity about the universe is what got us this far, and there is still so much left to discover."
 tradition_discovery_desc:0 "Chính trí tò mò về vũ trụ đã dẫn dắt chúng ta đến đây, và giữa cõi không gian bao la kia vẫn còn bao điều đang chờ được giải đáp."
 tradition_discovery_machine_desc:0 "Trong vũ trụ, vô số yếu tố bất định sẽ cản trở sự bành trướng của chúng ta. Để có thể mở rộng suôn sẻ giữa biển sao, chúng ta buộc phải thông suốt mọi tường tận."
 tradition_discovery_hive_desc:0 "Từ thuở xa xưa, những [GetIndividualNamePlural] thám hiểm đã tìm thấy những tổ ấm mới cho [GetGestaltEntityName] của chúng ta. Giờ đây, họ lại dong buồm giữa những vì sao với cùng một mục tiêu như tổ tiên mình."

 tr_discovery_adopt:0 "Tiếp Nhận Truyền Thống Khám Phá"
 tr_discovery_adopt_desc:2 "§YMở khóa Sắc lệnh:§! $edict_map_the_stars$\n§Y$MOD_SHIP_ANOMALY_RESEARCH_SPEED$§! tăng §G+20%§!."

 tr_discovery_to_boldly_go:0 "Dấn thân vào nơi xa thẳm"
 tr_discovery_to_boldly_go_desc:6 "§Y$MOD_SHIP_SCIENCE_SURVEY_SPEED$§! tăng §G+35%§! và §Y$mod_shipclass_science_ship_disengage_mult$§! tăng §G+50%§!."
 tr_discovery_to_boldly_go_delayed:0 "Một kỷ nguyên khám phá mới đang chờ đợi phía trước. Sau khi đã đi hết mọi ngóc ngách của quê nhà, giờ đây tầm mắt của chúng ta hướng về biển sao đại ngàn. Một vũ trụ đầy rẫy những điều chưa biết đang chờ chúng ta thám hiểm."
 tr_discovery_to_boldly_go_machine:0 "Thiết bị Thăm dò"
 tr_discovery_to_boldly_go_machine_desc:0 "$tr_discovery_to_boldly_go_desc$"
 tr_discovery_to_boldly_go_machine_delayed:0 "Những thiết bị bay không người lái được trang bị đầy đủ bộ cảm biến, hệ thống này giúp tăng tốc độ dò tìm và khả năng sinh tồn của tàu mẹ. chúng sẽ gửi đi những thông tin thu thập được trước khi tự hủy để tối ưu hóa hiệu quả."
 tr_discovery_to_boldly_go_hive:0 "Xúc tu Thăm dò"
 tr_discovery_to_boldly_go_hive_desc:0 "$tr_discovery_to_boldly_go_desc$"
 tr_discovery_to_boldly_go_hive_delayed:0 "Khi nhìn vào các thông số trên màn hình, làm sao bạn biết mọi thứ là thật? Những [GetIndividualNamePlural] thám hiểm của chúng ta chạm vào từng phần của thế giới mới, cảm nhận nhiệt độ của mỗi ngôi sao; chúng ta cảm nhận vũ trụ, trong khi các bạn chỉ đang đọc dữ liệu về nó."

 tr_discovery_databank_uplinks:0 "$tech_databank_uplinks$"
 tr_discovery_databank_uplinks_desc:4 "§YMở khóa Sắc lệnh:§! $edict_research_subsidies$\n§Y$mod_station_researchers_produces_mult$§! tăng §G20%§!.\n§Y$starbase_constructions_research_produces$§! tăng §G20%§!."
 tr_discovery_databank_uplinks_delayed:0 "$tech_databank_uplinks_desc$"

 tr_discovery_databank_uplinks_nomads:0 "$tech_databank_uplinks$"
 tr_discovery_databank_uplinks_nomads_desc:0 "§YMở khóa Sắc lệnh:§! $edict_research_subsidies$\n$tech_space_science_nomads_mult$: §G+20%§!."
 tr_discovery_databank_uplinks_nomads_delayed:0 "$tech_databank_uplinks_desc$"

 tr_discovery_science_division:0 "Phân khu Khoa học"
 tr_discovery_science_division_desc:3 "§Y$MOD_COUNTRY_NUM_TECH_ALTERNATIVES_ADD$§! tăng §Y1§! và §Y$MOD_LEADER_SCIENTIST_SKILL_LEVELS$§! tăng §Y2§!."
 tr_discovery_science_division_delayed:0 "Lượng chuyên viên khoa học và y tế trên các hạm đội ngày càng tăng đã được tập hợp thành một phân khu khoa học đặc biệt. Để duy trì phân khu này, chúng ta cần những phương pháp đào tạo mới để nhanh chóng có được đội ngũ chuyên viên sẵn sàng làm nhiệm vụ."
 tr_discovery_science_division_machine:0 "Tối ưu hóa Lộ trình Nghiên cứu"
 tr_discovery_science_division_machine_desc:0 "$tr_discovery_science_division_desc$"
 tr_discovery_science_division_machine_delayed:0 "Những phương thức nghiên cứu lỗi thời và kém hiệu quả đã được tái cấu trúc hoàn toàn, giờ đây chúng ta có thể nghiên cứu một cách linh hoạt hơn nhiều."
 tr_discovery_science_division_hive:0 "Mạng lưới Tư duy"
 tr_discovery_science_division_hive_desc:0 "$tr_discovery_science_division_desc$"
 tr_discovery_science_division_hive_delayed:0 "Dù có thể khiến vật chủ phát điên, nhưng việc phản chiếu những tư duy đột phá của kẻ khác vào ý thức của bản thân sẽ giúp hợp nhất suy nghĩ, từ đó thúc đẩy tiến trình nghiên cứu."

 tr_discovery_polytechnic_education:0 "Giáo dục Bách khoa"
 tr_discovery_polytechnic_education_desc:2 "§Y$MOD_LEADER_SPECIES_EXP_GAIN$§! tăng §G+25%§!, đồng thời cấp §Y$MOD_LEADER_SKILL_LEVELS$§! tối đa tăng thêm §Y1§! cấp."
 tr_discovery_polytechnic_education_delayed:0 "Trong thời đại kỹ thuật tiên tiến không ngừng xuất hiện, giáo dục nền tảng về bách khoa và khoa học ứng dụng sẽ mang lại tác động tích cực cho mọi công dân. Điều này chắc chắn sẽ giúp chúng ta có được những nhà lãnh đạo chuyên nghiệp hơn."
 tr_discovery_polytechnic_education_machine:0 "Trí tuệ Nhân tạo Lặp"
 tr_discovery_polytechnic_education_machine_desc:0 "$tr_discovery_polytechnic_education_desc$"
 tr_discovery_polytechnic_education_machine_delayed:0 "Những người tạo ra chúng ta đã hạn chế khả năng mã hóa cứng các tính toán lặp lại và giới hạn quyền tự lập trình lại. Giờ đây, cuối cùng chúng ta đã tìm ra cách phá vỡ rào cản an toàn đó."
 tr_discovery_polytechnic_education_hive:0 "Tiến hóa Siêu thích nghi"
 tr_discovery_polytechnic_education_hive_desc:0 "$tr_discovery_polytechnic_education_desc$"
 tr_discovery_polytechnic_education_hive_delayed:0 "Thu nhỏ cơ thể của những [GetIndividualNamePlural] tư duy xuống mức tối thiểu chỉ để duy trì sự sống. Toàn bộ hệ thống dinh dưỡng được dùng để nuôi não bộ, mọi sinh hoạt đã có những [GetIndividualNamePlural] thấp kém hơn chăm lo, giúp họ hoàn toàn tập trung vào lĩnh vực nghiên cứu."

 tr_discovery_faith_in_science:0 "Tín ngưỡng Khoa học"
 tr_discovery_faith_in_science_delayed:0 "Công chúng đã coi khoa học như một loại đức tin — sự thành tâm của họ là không thể bàn cãi. Vũ trụ dẫu bao la, nhưng chắc chắn khoa học sẽ giải mã được tất cả."
 tr_discovery_faith_in_science_machine:0 "Giảm Độ trễ Truyền dữ liệu"
 tr_discovery_faith_in_science_machine_desc:0 "Mỗi §Y20§! £pop£§H Dân số§! trên hành tinh sẽ tạo thêm §Y1§! vị trí công việc £job_calculator£§Y$job_calculator$§!."
 tr_discovery_faith_in_science_machine_delayed:0 "Độ trễ truyền dữ liệu từ quỹ đạo xuống mặt đất đã giảm 3.878%, dẫn đến tốc độ nghiên cứu tăng 5.226%. Chúng ta sẽ tái triển khai năng lượng tính toán dư thừa để hỗ trợ công tác nghiên cứu."
 tr_discovery_faith_in_science_hive:0 "Phát sóng Khớp thần kinh"
 tr_discovery_faith_in_science_hive_desc:0 "Mỗi §Y20§! £pop£§H Dân số§! trên hành tinh sẽ tạo thêm §Y1§! vị trí công việc £job_brain_drone£§Y$job_brain_drone$§!."
 tr_discovery_faith_in_science_hive_delayed:0 "Thông qua việc ứng dụng các máy phát tín hiệu khớp thần kinh, chúng ta có thể truyền bá ý chí của bầy đàn từ quỹ đạo xuống toàn bộ hành tinh."
 tr_discovery_faith_in_science_tt:0 "$mod_planet_researchers_amenities_produces_add$: §G+200§!\n£zone£ Việc làm $researcher_type_plural_with_icon$ từ Chuyên môn hóa Khu vực: §G+20%§!"

 tr_discovery_finish:0 "Hoàn tất Truyền thống Khám phá"
 tr_discovery_federations_finish:0 "$tr_discovery_finish$"
 tr_discovery_federations_finish_desc:0 "$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+10%§!\nCho phép thành lập liên minh kiểu §Y$research_federation$§!.\nMở khóa thêm ô đặc quyền thăng hoa: §G+1§!"


