 tr_statecraft_inspiring_agendas_desc:1 "§YMở khóa nghị trình:§! $council_agenda_agenda_rightful_claims_name$\n§YMở khóa nghị trình:§! $council_agenda_agenda_oppose_the_fallen_name$"
