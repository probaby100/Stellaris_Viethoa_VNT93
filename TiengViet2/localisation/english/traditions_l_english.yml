 tradition_versatility:0 "Linh hoạt"
 tradition_versatility_desc:1 "Khi vận hành trong những hệ sao với các thông số biến chuyển khôn lường, hệ thống cần có một mức độ linh hoạt nhất định."
 tr_versatility_adopt:0 "Tiếp nhận Truyền thống Linh hoạt"
 tr_versatility_adaptive_programming:0 "Lập trình Tự thích nghi"
 tr_versatility_adaptive_programming_desc:1 "§Y$MOD_COUNTRY_TRADE_FEE$§! giảm §G10%§!."
 tr_versatility_adaptive_programming_delayed:1 "Chúng ta có thể không trải qua quá trình tiến hóa lâu dài, nhưng kỹ thuật lập trình tự thích nghi sẽ giúp chúng ta thích ứng với môi trường và tình huống mới giống như bất kỳ sinh vật hữu cơ nào."
 tr_versatility_spatial_optimization:0 "Tối ưu hóa Không gian"
 tr_versatility_spatial_optimization_desc:0 "£pop£ £§Y$MOD_POP_HOUSING_USAGE_MULT$§! giảm §G10%§!."
 tr_versatility_spatial_optimization_delayed:1 "Ăng-ten thu gọn, vỏ bọc linh hoạt, không gian lưu trữ xếp chồng. Chúng ta có thể nảy ra vô vàn giải pháp sáng tạo để tận dụng tối đa không gian hạn hẹp."
 tr_versatility_operational_proxies:0 "Máy chủ Ủy nhiệm"
 tr_versatility_operational_proxies_delayed:2 "Giao phó các chức năng ưu tiên thấp thuộc phân mục R-7 cho các thiết bị đầu cuối bán tự động sẽ giải phóng năng lực tính toán, giúp chúng ta xử lý các nhiệm vụ quan trọng hơn, ví dụ như điều động lại các máy bay không người lái."
 tr_versatility_material_analysis:0 "Phân tích Vật liệu"
 tr_versatility_material_analysis_desc:2 "§YChi phí duy trì§! cho tất cả §Yvị trí công việc§! £job£ giảm §G5%§!."
 tr_versatility_material_analysis_delayed:1 "Dẫu vạn vật giữa muôn trùng sao vô cùng phức tạp, nhưng điều kỳ diệu thực sự của vũ trụ lại nằm ở khoa học vật liệu."
 tr_versatility_universal_compatibility:0 "Tương thích Phổ quát"
 tr_versatility_universal_compatibility_delayed:1 "Thông qua việc phân tích sâu các tác nhân kích thích và yếu tố tâm lý ảnh hưởng đến sinh vật hữu cơ cũng như các máy móc thông minh khác, chúng ta có thể giảm thiểu đáng kể các xung đột ngoại giao."
 tr_versatility_finish:0 "Hoàn tất Truyền thống Linh hoạt"
 tr_versatility_finish_tt:0 "[GetSettlingEmbarkationFinish]"

