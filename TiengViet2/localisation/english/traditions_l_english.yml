################################################################

 tradition_supremacy:0 "Tối Thượng"
 tradition_supremacy_desc:0 "Tương lai của thiên hà thuộc về những kẻ chinh phục hùng mạnh nhất."
 tradition_supremacy_machine_desc:0 "Mọi mô hình lý thuyết của chúng ta luôn bị phá vỡ bởi những biến số khó lường do các đế chế khác gây ra. Vì các mô hình này không thể tối ưu hóa thêm nữa, cách duy nhất là phải loại bỏ những biến số thừa thãi đó."
 tradition_supremacy_hive_desc:0 "Quy luật duy nhất: Ăn, hoặc bị ăn."
 tr_supremacy_adopt:0 "Tiếp Nhận Truyền Thống Tối Thượng"
 tr_supremacy_adopt_machine:0 "Truyền thống Tối thượng"
 tr_supremacy_adopt_hive:0 "$tr_supremacy_adopt$"

 tr_supremacy_above_the_fray:0 "Vượt lên bất đồng"
 tr_supremacy_above_the_fray_desc:0 "Sản lượng £unity£§YThống nhất§! tăng §G+10%§!"
 tr_supremacy_above_the_fray_delayed:0 "Chúng ta đứng trên tất cả những xung đột chính trị vô nghĩa. Cứ mặc cho những đế chế nhỏ bé kia hò hét phản đối đi, ý chí của chúng ta là không thể lay chuyển."
 tr_supremacy_armed_deterrence:0 "Răn đe vũ trang"
 tr_supremacy_armed_deterrence_desc:1 "§Y$shipsize_military_station_small_build_cost_mult$§! giảm §G25%§!, đồng thời §Y$mod_shipsize_military_station_small_hull_mult$§! tăng §G20%§!."
 tr_supremacy_armed_deterrence_delayed:0 "Ngủ vùi trên đống vũ khí là cách duy nhất để có một giấc ngủ ngon. Biên giới của chúng ta kiên cố như thành đồng, kẻ thù sẽ vỡ nát như những con sóng vỗ vào đá."
 tr_supremacy_natural_preeminence:0 "Bẩm sinh xuất chúng"
 tr_supremacy_natural_preeminence_desc:0 "§Y$MOD_PLANET_STABILITY_ADD$§! trên toàn bộ hành tinh tăng §G5%§!."
 tr_supremacy_natural_preeminence_delayed:0 "Dựa trên quy luật của vạn vật, chúng ta thượng đẳng hơn hẳn mọi giống loài khác, đó là một chân lý không thể bàn cãi. Chúng ta phải làm cho chân lý này rạng danh khắp thế gian, để nhân dân ta reo hò vì sự ưu việt của chính mình, và để những kẻ khác ngoan ngoãn chấp nhận số phận mà ta đã an bài cho chúng."

 tr_supremacy_great_game:0 "Ván cờ lớn"
 tr_supremacy_great_game_delayed:0 "Cùng với việc không ngừng mở rộng biên cương, chúng ta sẽ không thể tránh khỏi việc bị cuốn vào các cuộc tranh chấp lãnh thổ với những đế chế khác. Chúng ta đang mắc kẹt trong một Ván Cờ Lớn tranh giành tài nguyên và lãnh địa. Và chúng ta không có lý do gì để không chiến thắng ván cờ này."

 tr_supremacy_great_game_machine:0 "Ưu tiên mục tiêu ngoại giao"
 tr_supremacy_great_game_hive:0 "Ánh mắt thợ săn"
 tr_supremacy_great_game_machine_delayed:0 "Kết nối hệ thống định vị mục tiêu của tên lửa với AI ngoại giao chính là một cuộc cách mạng vĩ đại nhất trong quan hệ liên sao."
 tr_supremacy_great_game_hive_delayed:0 "Mọi thứ bên ngoài Tổ đàn rốt cuộc cũng chỉ là nguồn dinh dưỡng tiềm năng cho chúng ta. Biết rõ con mồi nào nên ưu tiên nuốt chửng trước rõ ràng là một lợi thế không nhỏ."

 tr_supremacy_fleet_logistical_corps:0 "Bộ Hậu cần Hạm đội"
 tr_supremacy_fleet_logistical_corps_desc:1 "§Y$mod_ships_upkeep_mult$§! giảm §G10%§! và §Y$MOD_COUNTRY_NAVAL_CAP_MULT$§! tăng §G20%§!."
 tr_supremacy_fleet_logistical_corps_delayed:0 "Hạm đội của chúng ta thường xuyên phải tác chiến ở mọi ngóc ngách của biển sao bao la, do đó một đội ngũ hậu cần chuyên nghiệp để đảm bảo hạm đội luôn vận hành trơn tru là điều hết sức cần thiết."
 tr_supremacy_fleet_logistical_corps_machine:0 "Tiếp tế giữa chừng tự động"
 tr_supremacy_fleet_logistical_corps_machine_desc:0 "$tr_supremacy_fleet_logistical_corps_desc$"
 tr_supremacy_fleet_logistical_corps_machine_delayed:0 "Dù việc duy trì một đội tàu tiếp tế có khả năng nhảy siêu không gian vô cùng tốn kém, nhưng vẫn kinh tế hơn nhiều so với việc bắt các chiến hạm phải tự quay về cảng để nạp năng lượng."

 #tr_supremacy_right_of_conquest:0 "Right of Conquest"
 #tr_supremacy_right_of_conquest_machine:0 "Selective Devastation"
 #tr_supremacy_right_of_conquest_hive:0 "Submit or be Eaten"
 #tr_supremacy_right_of_conquest_desc:3 "§Y$MOD_COUNTRY_CLAIM_INFLUENCE_COST_MULT$§! reduced by §G20%§!."
 #tr_supremacy_right_of_conquest_machine_desc:0 "$tr_supremacy_right_of_conquest_desc$"
 #tr_supremacy_right_of_conquest_hive_desc:0 "$tr_supremacy_right_of_conquest_desc$"
 #tr_supremacy_right_of_conquest_delayed:0 "The ancient right of conquest is a universal truth that is no less relevant now than it was when our civilization established dominion over our homeworld. Woe to the vanquished!"
 #tr_supremacy_right_of_conquest_machine_delayed:0 "By seeding the atmosphere of newly-conquered worlds with a selection of gases, harmless to us but lethal to our enemies, their willingness to cede territory without further resource expenditure is enhanced."
 #tr_supremacy_right_of_conquest_hive_delayed:0 "The others have strange minds. They react more strongly to a single drone being publicly dissolved in the digestion vats than to thousands killed by orbital bombardment. This kind of selective terrorization is effective at cowing their resistance."

 tr_supremacy_master_shipwrights:0 "Bậc thầy đóng tàu"
 tr_supremacy_master_shipwrights_desc:7 "§Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§! tăng §G+25%§!."
 tr_supremacy_master_shipwrights_delayed:0 "Cùng với quy mô đóng tàu không ngừng mở rộng, trình độ tay nghề và năng suất của thợ xưởng cũng được nâng lên một tầm cao mới. Công nghệ chế tạo liên tục được cải tiến, rút ngắn đáng kể thời gian từ lúc mạ lớp giáp đầu tiên cho đến khi phi thuyền thành hình so với trước đây."
 tr_supremacy_master_shipwrights_hive:0 "Cấu trúc hữu cơ"
 tr_supremacy_master_shipwrights_hive_desc:0 "$tr_supremacy_master_shipwrights_desc$"
 tr_supremacy_master_shipwrights_hive_delayed:0 "Chúng ta dựng nên khung sườn của tàu chiến hệt như cách phát triển bộ xương sinh vật, sau đó đắp lên nó những linh kiện cần thiết y như cách gắn kết nội tạng, máu thịt và da."
 tr_supremacy_master_shipwrights_machine:0 "Khuôn thân tàu mô-đun"
 tr_supremacy_master_shipwrights_machine_desc:0 "$tr_supremacy_master_shipwrights_desc$"
 tr_supremacy_master_shipwrights_machine_delayed:0 "Việc đưa vào sử dụng hàng loạt các linh kiện đúc sẵn có khả năng hoán đổi cho nhau giúp cho quá trình chế tạo hạm đội trở nên hợp lý và năng suất hơn nhiều."

 tr_supremacy_war_games:0 "Mô phỏng chiến tranh"
 tr_supremacy_war_games_desc:4 "§Y$MOD_COMMAND_LIMIT_ADD$§! tăng §G+20§! và §Y$MOD_LEADER_ADMIRAL_SKILL_LEVELS$§! tăng §Y2§!."
 tr_supremacy_war_games_delayed:0 "Dù là mô phỏng trên máy tính hay diễn tập thực chiến, các cuộc tập trận cường độ cao đã trở thành bảo bối không thể thiếu đối với các sĩ quan cấp cao. Việc mô phỏng giúp các chỉ huy mở rộng tầm nhìn, thoát khỏi lối mòn tư duy, từ đó khai sinh ra vô vàn chiến thuật đột phá và những hệ tư tưởng chiến lược mới mẻ."
 tr_supremacy_war_games_machine_desc:0 "$tr_supremacy_war_games_desc$"
 tr_supremacy_war_games_machine:0 "Ức chế biến số tác chiến"
 tr_supremacy_war_games_machine_delayed:0 "Điên cuồng tính toán hàng ngàn kịch bản giao tranh có thể xảy ra ở tốc độ siêu cao và cập nhật theo thời gian thực, giúp kìm hãm tính khó lường của các hành động hạm đội xuống mức có thể chấp nhận được."
 tr_supremacy_war_games_hive:0 "Cảm quan không gian"
 tr_supremacy_war_games_hive_desc:0 "$tr_supremacy_war_games_desc$"
 tr_supremacy_war_games_hive_delayed:0 "Các loài thủy sinh vốn có nhận thức không gian nhạy bén nhờ đặc tính của môi trường sống. Một khi cấy ghép phần vỏ não này vào hệ tư duy tác chiến, bầy đàn của chúng ta có thể di chuyển đồng điệu mượt mà như một bầy cá."

 tr_supremacy_overwhelming_force:1 "Vũ lực áp đảo"
 tr_supremacy_overwhelming_force_desc:0 "§Y$MOD_SHIP_FIRE_RATE_MULT$§! tăng §G+10%§!, §Y$MOD_SHIP_ORBITAL_BOMBARDMENT_MULT$§! tăng §G+20%§!."
 tr_supremacy_overwhelming_force_delayed:1 "Phải trút toàn bộ sức mạnh để nghiền nát kẻ thù, có như vậy mới cầm chắc phần thắng. Một đòn đánh chớp nhoáng mang tính quyết định còn giúp giảm bớt thương vong so với việc sa lầy vào một cuộc chiến dai dẳng."

 #tr_supremacy_overwhelming_force:1 "Overwhelming Force"
 #tr_supremacy_overwhelming_force_desc:0 "§Y$MOD_ARMY_DAMAGE_MULT$§! increased by §G+25%§!."
 #tr_supremacy_overwhelming_force_machine_desc:0 "$tr_supremacy_overwhelming_force_desc$"
 #tr_supremacy_overwhelming_force_hive_desc:0 "$tr_supremacy_overwhelming_force_desc$"
 #tr_supremacy_overwhelming_force_delayed:0 "Discipline is at the core of any successful army. With selective breeding, rigorous drills and extensive combat conditioning we have created a force of ruthless warriors, working in absolute coherence with each other. They are the iron fist with which we will rule the galaxy."
 #tr_supremacy_overwhelming_force_machine_delayed:0 "The most fundamental combat weakness of other empires is the vulnerability of their non-distributed command system. Our aggressive signal intercept apparatus allows us to target these leader units on average 11.2 seconds after they are pinpointed."
 #tr_supremacy_overwhelming_force_hive_delayed:0 "Mass-bred war drones, hardened against weapon fire, filled with redundant organs, and with suppressed self-preservation instincts. Millions of them."

 tr_supremacy_finish:0 "Hoàn thành Truyền thống Tối thượng"
 tr_supremacy_finish_desc:0 "Mở khóa chính sách §YHọc thuyết chiến tranh§!.\nMở khóa Ô Đặc Quyền Thăng Hoa: §G+1§!"

################################################################
# DIPLOMACY
################################################################

 tradition_diplomacy:0 "Ngoại Giao"
 tradition_diplomacy_desc:0 "Cách an toàn nhất để tiêu diệt kẻ thù là biến chúng thành bạn bè."
 tr_diplomacy_adopt:0 "Tiếp Nhận Truyền Thống Ngoại Giao"
 tr_diplomacy_adopt_desc:2 "§YMở khóa Sắc lệnh:§! $edict_diplomatic_grants$"

 tr_diplomacy_the_federation:0 "Liên bang"
 tr_diplomacy_the_federation_desc:2 "$TECH_UNLOCK_DIPLOMATIC_ACTION_CREATE_FEDERATION_TITLE$\n§Y$MOD_COUNTRY_ENVOYS_ADD$§! tăng §G1§!."
 tr_diplomacy_the_federation_delayed:0 "Chúng ta phải thiết lập mối quan hệ đối tác bền vững với các láng giềng trên cơ sở tôn trọng và tin cậy lẫn nhau. Đoàn kết hợp tác, chúng ta chắc chắn sẽ hùng mạnh hơn nhiều so với việc chỉ rúc mình ở một cõi."

 tr_diplomacy_entente_coordination:0 "Hiệp ước phối hợp"
 tr_diplomacy_entente_coordination_desc:0 "§YSức chứa hải quân Liên bang§! mà chúng ta đóng góp cho Liên bang được nhân đôi."
 tr_diplomacy_entente_coordination_delayed:0 "Có lẽ, điều cốt lõi nhất của một liên bang giữa các vì sao chính là hệ thống phòng thủ tương trợ giữa các thành viên. Chúng ta có trách nhiệm đóng góp nhiều nhất có thể."
 #tr_diplomacy_dynamic_ecomorphism:0 "Dynamic Ecomorphism"
 #tr_diplomacy_dynamic_ecomorphism_desc:0 "§Y$MOD_POP_ENVIRONMENT_TOLERANCE$§! increased by §G+10%§!."
 #tr_diplomacy_dynamic_ecomorphism_delayed:0 "Diplomacy opens many doors through which information flows. Simply by studying the methods of others, we have learned new ways of adapting to alien environments."

 tr_diplomacy_open_markets:0 "Thị trường mở"
 tr_diplomacy_open_markets_desc:1 "$r_trade$ của đế chế tăng §G+10%§!"
 tr_diplomacy_open_markets_delayed:1 "Để đảm bảo thương mại phát triển phồn vinh trong biên giới, sự can thiệp của chính quyền vào thị trường nội địa phải được duy trì ở mức tối thiểu."

 tr_diplomacy_secure_shipping:0 "Vận tải an toàn"
 tr_diplomacy_secure_shipping_desc:0 "§YBảo hộ thương mại cơ bản§! của các tuyến giao thương tăng §G5§!."
 tr_diplomacy_secure_shipping_delayed:1 "Thông thường, nhiệm vụ tiễu trừ hải tặc thuộc về hạm đội, nhưng việc thành lập một đội tuần tra không gian chuyên trách thực thi pháp luật dọc các tuyến giao thương cũng có thể giáng đòn chí mạng vào sự ngông cuồng của bọn chúng."

 tr_diplomacy_federal_unity:0 "Liên bang nhất thể"
 tr_diplomacy_federal_unity_desc:0 "Cứ mỗi thành viên tăng thêm trong liên bang của chúng ta, sản lượng £unity£ §YThống nhất§! lại tăng §G+5%§!, tối đa §G+30%§!."
 tr_diplomacy_federal_unity_delayed:0 "Sự đa dạng là một tài sản vô giá, mỗi góc nhìn và sự thấu suốt mà các thành viên mang đến sẽ giúp xã hội của liên bang ta vươn mình mạnh mẽ hơn."
 #tr_diplomacy_alien_tourism:0 "Alien Tourism"
 #tr_diplomacy_alien_tourism_desc:1 "§YUnlocks Building:§! $building_visitor_center$\n§EThis is a building that produces Energy and Unity, while also increasing Xeno Migration Attraction and Habitability.§!"
 #tr_diplomacy_alien_tourism_delayed:0 "It is easy to take our rich culture for granted. We should make it easier for visitors from other civilizations to share in its beauty."

 tr_diplomacy_diplomatic_networking:0 "Mạng lưới tình báo ngoại giao"
 tr_diplomacy_diplomatic_networking_desc:1 "Đại sứ quán: §G+3§! £unity£§YThống nhất§!\nMở khóa các hành động ngoại giao cấp cao mà không cần đến Đại sứ quán"
 tr_diplomacy_diplomatic_networking_gestalt:0 "$tr_diplomacy_diplomatic_networking$"
 tr_diplomacy_diplomatic_networking_delayed:0 "Mạng lưới tình báo cấp đại sứ mà chúng ta giăng ra sở hữu sức mạnh và tầm ảnh hưởng đủ để khiến thần dân [This.GetAdj] vô cùng tự hào."
 tr_diplomacy_diplomatic_networking_gestalt_delayed:0 "Việc đan xen toàn diện tiến trình ngoại giao vào các mối quan hệ với các nước khác sẽ không chỉ thúc đẩy hoạt động đối ngoại: nó còn gia tăng hiệu quả tính gắn kết trong khâu ra quyết định nội bộ, và cuối cùng mang lại lợi ích cho chính [This.GetGovernmentName]."
 diplomatic_networking:0 "$tr_diplomacy_diplomatic_networking$"

 tr_diplomacy_direct_diplomacy:1 "Ngoại giao trực diện"
 tr_diplomacy_direct_diplomacy_delayed:2 "Chúng ta tin rằng, cách tốt nhất để xây dựng lòng tin nằm ở việc giao tiếp một cách bao dung, cởi mở, trung thực và thẳng thắn."

 tr_diplomacy_eminent_diplomats:0 "Nhà ngoại giao kiệt xuất"
 tr_diplomacy_eminent_diplomats_desc:0 "Độ chấp nhận ngoại giao: §G+5§!\nĐặc phái viên đang §YCải thiện quan hệ§! mỗi tháng có §G1%§! tỷ lệ kiếm được một §YỦng hộ ngoại giao§!."
 tr_diplomacy_eminent_diplomats_gestalt:0 "Cá thể đặc phái viên cải tiến"
 tr_diplomacy_eminent_diplomats_delayed:0 "Kể từ ngày ta vươn ra biển sao, ngoại giao chưa bao giờ có tầm quan trọng như lúc này. Qua việc lột xác hoàn toàn phương thức huấn luyện và giữ chân những người tài, các nhà ngoại giao của ta giờ đây có thể dùng tài hùng biện như những nhà truyền giáo để vun đắp quan hệ với các quốc gia khác."
 tr_diplomacy_eminent_diplomats_gestalt_delayed:0 "Kể từ ngày ta vươn ra biển sao, ngoại giao chưa bao giờ có tầm quan trọng như lúc này. Chúng ta phải đảm bảo các đặc phái viên luôn ở tư thế sẵn sàng, đại diện và bảo vệ quyền lợi của ta ở nước ngoài."

 MESSAGE_FAVOR_GAINED_TRADITION_TITLE:0 "Nhận được sự ủng hộ ngoại giao"
 MESSAGE_FAVOR_GAINED_TRADITION_DESC:0 "Nhờ vào tài năng xuất chúng của vị đặc phái viên, chúng ta đã thành công tranh thủ được sự ủng hộ ngoại giao từ $WHO|Y$."

 tr_diplomacy_finish:0 "Hoàn thành Truyền thống Ngoại giao"
 tr_diplomacy_federation_xp_gain:0 "Kinh nghiệm Liên bang nhận được hàng tháng: §G+2§!\nTrọng lượng Ngoại giao: §G+10%§!\nGiới hạn viên chức hành chính: §G+1§!\nMở khóa Ô Đặc Quyền Thăng Hoa: §G+1§!"

################################################################
# ADAPTABILITY
################################################################

 tradition_adaptability:0 "Thích Nghi"
 tradition_adaptability_desc:0 "Kẻ thích nghi sẽ sống sót, kẻ yếu sẽ bị đào thải."
 tr_adaptability_adopt:0 "Tiếp Nhận Truyền Thống Thích Nghi"

 tr_adaptability_dietary_enrichment:0 "Mở rộng Chế độ ăn"
 tr_adaptability_dietary_enrichment_desc:1 "£food£ §Y$mod_country_food_produces_mult$§! sản lượng tăng §G+10%§!."
 tr_adaptability_dietary_enrichment_delayed:1 "Chúng ta có thể tận dụng những kỹ thuật cải tiến mới nhất để nâng cao giá trị dinh dưỡng của nông sản, từ đó dùng ít thực phẩm hơn nhưng vẫn đáp ứng được nhiều nhu cầu hơn."

 tr_adaptability_recycling:0 "Tăng cường Tái chế"
 tr_adaptability_recycling_desc:1 "§YChi phí xây dựng§! và §Ychi phí duy trì§! bằng $r_strategic$ cho các §YCông trình§! và §YPhân khu§! giảm §G-15%§!."
 tr_adaptability_recycling_delayed:0 "Tái chế những thứ lỗi thời để làm giàu nguồn tài nguyên cho tương lai."

 tr_adaptability_survival_fittest:0 "Sinh tồn của kẻ mạnh nhất"
