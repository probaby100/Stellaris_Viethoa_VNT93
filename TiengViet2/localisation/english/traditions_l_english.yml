 tr_politics_gravitas:0 "Vẻ vang tột đỉnh"
 tr_politics_gravitas_desc:1 "§G-25%§! chi phí £influence£ §YẢnh hưởng§! khi phủ quyết hoặc đề xuất Nghị quyết\n$official_plural_with_icon$ được chỉ định vào §Y[GetGalCommunityOrGalImperium]§! sẽ cung cấp thêm §G2.5%§! £diplo_weight£ Trọng lượng Ngoại giao trên mỗi §YCấp Độ Kỹ Năng§!."
 tr_politics_gravitas_delayed:0 "Chính trị là nghệ thuật của sự ảo giác. Chỉ cần để cho người khác thấy những gì họ muốn thấy, chúng ta có thể ngày càng có tiếng nói quan trọng hơn trong Cộng đồng chung."

 tr_politics_extraordinary_powers:0 "Quyền lực đặc biệt"
 tr_politics_extraordinary_powers_desc:0 "§G-25%§! £time£ §YThời gian hồi§! của Hành động Hội đồng (Biện pháp Khẩn cấp và Phủ quyết)."
 tr_politics_extraordinary_powers_delayed:0 "Sự vụ đặc biệt thì xử lý đặc biệt. Vì quyền lực đã được trao cho chúng ta, thì việc chúng ta hành xử quyền lực đó có gì mà phải ngạc nhiên chứ."

 tr_politics_national_agenda:0 "Nghị trình quốc gia"
 tr_politics_national_agenda_desc:0 "Khi dự luật do bạn đề xuất được thông qua, nhận phần thưởng bằng số lượng £unity£§YĐoàn kết§! trong vòng 18 tháng."
 tr_politics_national_agenda_delayed:0 "Chiến thắng của chúng ta tại Thượng viện thật đáng để ăn mừng: Nó đưa chúng ta tiến gần hơn một bước đến một tương lai tốt đẹp."

 tr_politics_persistent_petitioners:0 "Bền bỉ thỉnh nguyện"
 tr_politics_persistent_petitioners_desc:1 "Sau khi một dự luật của đế chế khác được thông qua, nhận §G+25%§! £diplo_weight£Trọng lượng Ngoại giao cho đến khi dự luật của chính bạn được thông qua."
 tr_politics_persistent_petitioners_delayed:1 "Phái đoàn của chúng ta cử đến §Y[GetGalCommunityOrGalImperium]§! vô cùng kiên cường bất khuất, dù thua vẫn không nản. Có thể sẽ mất chút thời gian, nhưng chúng ta nhất định sẽ lấy được những gì thuộc về mình."
