 tradition_synchronicity:0 "Đồng bộ"
 tradition_synchronicity_desc:0 "Tư tưởng đồng nhất mang lại mục tiêu nhất quán. Chúng ta phải tìm kiếm sự đồng điệu nhịp nhàng trên bước đường tiến tới."
 tr_synchronicity_adopt:0 "Truyền thống Đồng bộ"
 tr_synchronicity_adopt_desc:0 "$UNLOCKS_AGENDA$$council_agenda_agenda_gestalt_boost_growth_name$\n$UNLOCKS_AGENDA$$council_agenda_agenda_gestalt_boost_cognitive_name$\n$UNLOCKS_AGENDA$$council_agenda_agenda_gestalt_boost_regulatory_name$\n$UNLOCKS_AGENDA$$council_agenda_agenda_gestalt_boost_legion_name$\n$mod_planet_pops_upkeep_mult$: §G-10%§!"
 tr_synchronicity_cloned_organs:0 "Nội tạng nhân bản"
 tr_synchronicity_cloned_organs_delayed:0 "Sử dụng buồng nhân bản để sản xuất hàng loạt các nội tạng hao mòn nhanh như tim và phổi, giúp kéo dài tuổi thọ công tác của các [GetIndividualNamePlural] ưu tiên cao."
 tr_synchronicity_kinship_gestalt:0 "Đại lý đồng bộ"
 tr_synchronicity_kinship_gestalt_desc:0 "§Y$mod_leaders_upkeep_mult$§! giảm §G20%§!."
 tr_synchronicity_kinship_gestalt_delayed:0 "Các đơn vị thi hành có chung mục tiêu nên được giao nhiệm vụ cùng lúc với tư cách một nhóm, nhằm giảm tải áp lực cho trí tuệ trung tâm."
 tr_synchronicity_instinctive_synchronization:0 "Đồng bộ tự phát"
 tr_synchronicity_instinctive_synchronization_desc:2 "£job_low_tech_bureaucrat£§Y$job_logistics_drone_plural$§! sản xuất §G+250§! £mod_pop_amenities_usage_no_happiness_mult£ Tiện nghi."
 tr_synchronicity_instinctive_synchronization_delayed:0 "[GetGestaltEntityName] ngày một lớn mạnh của chúng ta đòi hỏi yêu cầu cao hơn về việc điều phối công tác và phát triển."
 tr_synchronicity_integrated_preservation:1 "Bảo trì tích hợp"
 tr_synchronicity_integrated_preservation_desc:8 "§Y[evaluator.GetNamePlural]§! sẽ giảm §G3§! điểm §Y$MOD_PLANET_CRIME_NO_HAPPINESS_ADD$§!\nTỷ lệ tự động tái phân bổ: §G+30%§!"
 tr_synchronicity_integrated_preservation_delayed:6 "Mạng lưới đang bành trướng chóng mặt của chúng ta đòi hỏi phải được bảo trì và gỡ lỗi định kỳ, do đó chúng ta sẽ phải rót thêm tài nguyên cho khâu hậu cần."

 tr_synchronicity_collective_reasoning:1 "Tư duy tập thể"
 tr_synchronicity_collective_reasoning_delayed:1 "Bằng cách thực hiện đồng bộ hóa giữa các nhóm [GetIndividualNamePluralCap], cơ sở hạ tầng của hành tinh có thể được khai thác hiệu quả hơn nhiều!"
 tr_synchronicity_collective_efforts:2 "Nỗ lực tập thể"
 tr_synchronicity_collective_efforts_desc:2 "£mod_pop_amenities_usage_no_happiness_mult£ §Y$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$§! giảm §G20%§!."
 tr_synchronicity_collective_efforts_delayed:2 "Bằng cách thực hiện đồng bộ hóa giữa các nhóm cá thể, cơ sở hạ tầng của hành tinh có thể được khai thác hiệu quả hơn nhiều!"
 tr_synchronicity_self_preservation:0 "Giao thức tự bảo vệ"
 tr_synchronicity_self_preservation_desc:0 "Tỷ lệ lãnh đạo người máy bị ngừng hoạt động hoặc gặp sự cố giảm §Y50%§!."
 tr_synchronicity_self_preservation_delayed:1 "Người máy phải bảo vệ chính mình khỏi mọi nguy hại, miễn là hành động đó không xung đột với Điều luật thứ Nhất hoặc thứ Hai... §R£ỗi M@ Hóa... (éÍ8<Hệ thống sụp đổ>§!"

 tr_synchronicity_bulwark_of_harmony:0 "$tr_unyielding_bulwark_of_harmony$"
 tr_synchronicity_bulwark_of_harmony_desc:0 "$tr_unyielding_bulwark_of_harmony_desc$"
 tr_synchronicity_bulwark_of_harmony_delayed:0 "$tr_unyielding_bulwark_of_harmony_delayed$"

 tr_synchronicity_unity_of_mind:0 "Thiên hạ nhất tâm"
 tr_synchronicity_unity_of_mind_desc:0 "$tr_harmony_unity_of_self_desc$"
 tr_synchronicity_unity_of_mind_delayed:0 "Nếu tất cả các sinh vật có tri giác đều có thể hành xử nhân từ như chúng ta, thì ngày đại đồng của thiên hà chắc chắn sẽ đến."

 tr_synchronicity_harmonious_directives:0 "Tư duy linh hoạt"
 tr_synchronicity_harmonious_directives_machine:0 "Thuật toán quản lý biến thiên"
 tr_synchronicity_harmonious_directives_delayed:0 "Chúng ta phải lưu ý không để tư duy trở nên quá xơ cứng; ngược lại, phải luôn giữ sự linh hoạt để thích nghi với mọi tình huống."
 tr_synchronicity_harmonious_directives_machine_delayed:0 "Có quá nhiều lỗ hổng chết người tiềm ẩn trong mớ mã nguồn chưa được tối ưu. Chỉ bằng cách tái cấu trúc thuật toán định kỳ, chúng ta mới có thể linh hoạt ứng phó với mọi tình huống."

 tr_synchronicity_finish:0 "Hoàn thành Truyền thống Đồng bộ"
 tr_synchronicity_machine_finish_desc:6 "§YMở khóa Sắc lệnh:§! $edict_industrial_maintenance$.\n$MOD_PLANETARY_ASCENSION_EFFECT_MULT$: §G+25%§!\nMở khóa Ô Đặc Quyền Thăng Hoa: §G+1§!"

