 tr_aptitude_psychological_profiling_machine_delayed:0 "Quét sâu hệ thống giúp chúng ta thực hiện các biện pháp phòng ngừa trước khi sự cố xảy ra."
 tr_aptitude_healthcare_program:0 "Chương trình Chăm sóc Sức khỏe"
 tr_aptitude_healthcare_program_delayed:0 "Thông qua việc giám sát liên tục các thông số sức khỏe, từ tập luyện, ăn uống đến phẫu thuật, chúng ta tinh chỉnh mọi thứ cho lãnh đạo để đạt được lợi ích tối đa."
