 tr_politics_quid_pro_quo_desc:0 "Khi dự luật bạn ủng hộ được thông qua, nhận 1 §YĐồng thuận Ngoại giao§! của người đề xuất."
 tr_politics_quid_pro_quo_delayed:0 "Những lời lẽ chính xác có thể khiến mọi người hiểu rằng sự ủng hộ của chúng ta không phải là điều hiển nhiên. Những kẻ được chúng ta giúp đỡ đều mắc nợ chúng ta, sớm muộn gì chúng cũng phải đền đáp."
