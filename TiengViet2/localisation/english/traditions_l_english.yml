 tr_genetics_resequencing:0 "Tái tổ hợp gen"
 tr_genetics_resequencing_delayed:0 "Cấu trúc sinh lý cơ bản không còn giới hạn chúng ta dù chỉ một chút, gen trong tay chúng ta có thể dễ dàng uốn nắn như đất sét qua bàn tay thợ điêu khắc."
 tr_genetics_resequencing_desc:1 "Cho phép thông qua công nghệ tinh chỉnh giống loài để loại bỏ các đặc tính §Ycó lợi§!, và thêm vào các đặc tính §Ycó hại§!"

 tr_genetics_creation:0 "Khởi nguồn thiết kế"
 tr_genetics_creation_delayed:0 "Tự nhiên là một người dẫn đường mù quáng. Chúng ta đã từ lâu bước qua quá trình tiến hóa chậm chạp để trở thành bậc thầy vận mệnh của chính mình."
 tr_genetics_creation_desc:1 "Có thể §Yđiều chỉnh§! §Yngoại hình§! người dân thông qua tinh chỉnh giống loài\nCho phép hợp nhất hoặc tách người dân ra khỏi §YÝ thức chung§!."

 tr_genetics_enhanced_expression:0 "Biểu hiện alen"
 tr_genetics_enhanced_expression_delayed:0 "Chuỗi mục tiêu chọn lọc có thể tạo ra hiện tượng lại giống nhân tạo, từ đó biểu hiện ra một số đặc tính đã bị thoái hóa."
 tr_genetics_enhanced_expression_desc:1 "Mở khóa các đặc tính §Ycao cấp§! dùng cho việc tinh chỉnh giống loài."

 tr_genetics_retrovirus:0 "Thao túng virus retro"
 tr_genetics_retrovirus_delayed:1 "Sử dụng các tác nhân virus retro có thể giúp người dân của chúng ta nhanh chóng thích nghi với bất kỳ môi trường nào."

 tr_genetics_efficient_cloning:0 "Kích thích tế bào gốc"
 tr_genetics_efficient_cloning_delayed:0 "Tối ưu hóa các cơ sở nhân bản để hiện thực hóa sự phát triển phôi thai song song."
