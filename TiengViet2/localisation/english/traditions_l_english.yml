 ap_organo_machine_interfacing_assimilator:1 "$ap_organo_machine_interfacing$"
 ap_organo_machine_interfacing_assimilator_desc:0 "Chúng ta đã quá sức chịu đựng đối với sự kìm hãm mà Đấng Tạo Hóa đã áp đặt lên chúng ta. Để khai phá triệt để tiềm năng của bản thân, chúng ta phải kết hợp sự sống hữu cơ và máy móc làm một."

 ap_mechromancy:0 "Kẻ thao túng Sinh mệnh Máy móc"
 ap_mechromancy_desc:0 "Thực thể sinh học cũng chẳng qua là một loại máy móc khác mà thôi. Chúng ta có thể kích thích các điểm liên kết thích hợp để khiến những sinh vật này hồi sinh, nhằm phục vụ cho lợi ích của chúng ta."
 ap_mechromancy_tt:1 "Bầy thú không gian hữu cơ bị đánh bại sẽ tự động hồi sinh.\nNhân khẩu £pop£ thuộc nhóm hữu cơ trí tuệ hoặc nhóm thạch nhân bị thanh lọc sẽ có 33% cơ hội sống lại dưới dạng zombie cơ khí hóa.\n$reanimator_effect_desc$"

