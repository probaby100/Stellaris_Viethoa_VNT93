 ap_organo_machine_interfacing_desc:0 "$ap_the_flesh_is_weak_desc$"
 organo_machine_interfacing_tooltip:1 "—Mở khóa nhánh truyền thống §Y$tradition_cybernetics$§!.$TABBED_NEW_LINE$—$REQUIRES_TRADITION_SLOT$\n—$UNLOCKS_AGENDA$$council_agenda_agenda_organo_machine_interfacing_name$, nhận tùy chọn nghiên cứu công nghệ cơ khí hóa."
