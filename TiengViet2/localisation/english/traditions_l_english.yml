 ################################################################

 #tradition_purity:0 "Purity"
 #tradition_purity_desc:0 "Purity of mind and purpose is the only way to guard our species from the dangers of a hostile galaxy."
 #tr_purity_adopt:0 "Purity Traditions"
 #tr_purity_adopt_desc:0 "$tradition_purity_desc$\n\n$tr_purity_adopt_effect$\n\n$tr_purity_finish_effect$"
 #tr_purity_adopt_effect:2 "§E$TRADITIONS_ADOPT$:§!\n£blocker£ §Y$MOD_PLANET_CLEAR_BLOCKER_COST_MULT$§! reduced by §G25%§!."
 #tr_purity_never_surrender:0 "Never Surrender"
 #tr_purity_never_surrender_desc:1 "§Y$shipclass_starbase_hull_mult$§! increased by §G+10%§! and §Y$MOD_ARMY_DEFENSE_HEALTH_MULT$§! increased by §G+50%§!."
 #tr_purity_never_surrender_delayed:1 "We will never bow to those who are inferior. Let them hurl themselves against our unbreakable defenses! A thousand years from now, they will be just another footnote in the history of our ascension."
 #tr_purity_symbol_purity:0 "Symbol of Purity"
 #tr_purity_symbol_purity_desc:1 "§YUnlocks Building:§! $building_symbol_purity$\n§EThis is a building that produces Unity while also increasing Government Ethics Attraction.§!"
 #tr_purity_symbol_purity_delayed:0 "$tech_purity_campaigns_desc$"
 #tr_purity_natural_order:0 "Natural Order"
 #tr_purity_natural_order_desc:1 "Eating alien Pops provides £unity£ Unity. Does not apply to robots."
 #tr_purity_natural_order_delayed:0 "All beings have their assigned station in the universe. Those who belong to a lesser species should take comfort in their servitude to their betters."
 #tr_purity_age_machines:1 "Age of Machines"
 #tr_purity_age_machines_desc:2 "Buildable Pops' resource production increased by §G+5%§!"
 #tr_purity_age_machines_delayed:1 "The chaotic era where organic empires dictated the course of galactic history is over. The Age of Machines has finally come."
 #tr_purity_the_chosen:0 "The Chosen"
 #tr_purity_the_chosen_desc:4 "£pop£ §Y$pop_citizen_happiness$§! increased by §G+5%§! and §Y$MOD_COUNTRY_STARBASE_INFLUENCE_COST_MULT$§! cost is reduced by §G5%§!"
 #tr_purity_the_chosen_delayed:0 "Whether chosen by a higher power or simple genetic chance, our exceptional species is without compare. We are clearly destined for great things."
 #tr_purity_waste_processing:0 "Waste Processing"
 #tr_purity_waste_processing_desc:0 "§Y$MOD_POP_PROCESSING_OUTPUT$§! increased by §G+50%§!."
 #tr_purity_waste_processing_delayed:1 "Optimized processing methods will increase yields when population units are harvested. Nothing must go to waste."
 #tr_purity_appropriation:0 "Appropriation"
 #tr_purity_appropriation_desc:1 "§Y$MOD_POP_RESETTLEMENT_COST_MULT$§! reduced by §G50%§!."
 #tr_purity_appropriation_delayed:1 "Land that is not being worked contributes nothing to our empire. Workers must be relocated in an efficient manner to those planets where they are needed most."
 #tr_purity_finish:0 "Purity Traditions Finished"
 #tr_purity_finish_effect:1 "§E$TRADITIONS_FINISH$:§!\nAdopting all $tr_purity_adopt$ will increase £unity£ §Y$country_base_unity_produces_mult$§! by §G+10%§!."

 ################################################################
 # HARMONY
 ################################################################

 tradition_harmony:0 "Thống Nhất"
 tradition_harmony_desc:0 "Một quần chúng ấm no và hòa hợp, cùng nhau chung sức vì một mục tiêu chung, sẽ tạo ra sức mạnh không gì cản nổi."
 tr_harmony_adopt:0 "Tiếp Nhận Truyền Thống Thống Nhất"
 tr_harmony_the_greater_good:0 "Lợi ích tối thượng"
# tr_harmony_the_greater_good_desc:4 "§Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! increased by §G+25%§!."
 tr_harmony_the_greater_good_delayed:0 "Toàn thể thần dân đều hân hoan khi nhận ra rằng công sức của họ đang phục vụ cho một mục đích cao cả hơn. Sức mạnh của từng cá nhân tuy nhỏ bé, nhưng lại là mảnh ghép không thể thiếu của cả một tập thể vĩ đại."
 tr_harmony_kinship:0 "Tình máu mủ"
# tr_harmony_kinship_desc:4 "The time it takes for unemployed £pop£ §YPops§! to demote to a lower §YStratum§! is reduced by §G75%§!."
 tr_harmony_kinship_delayed:1 "Bất kể địa vị xã hội ra sao, giữa mọi thần dân trong quốc gia liên sao vĩ đại của chúng ta đã nảy nở một tình huynh đệ thực sự."
 tr_harmony_kinship_shared_burdens:0 "$tr_harmony_kinship$"
# tr_harmony_kinship_shared_burdens_desc:0 "$tr_synchronicity_kinship_gestalt_desc$"
 tr_harmony_kinship_shared_burdens_delayed:0 "Lãnh đạo và nhân dân ta hòa làm một. Chúng ta đã đạt được sự bình đẳng tuyệt đối."
 tr_harmony_utopian_dream:0 "Giấc mộng không tưởng"
 tr_harmony_utopian_dream_desc:0 "$r_stability$ trên tất cả hành tinh tăng §G5%§!."
 tr_harmony_utopian_dream_delayed:2 "Khát vọng kiến tạo một thế giới không tưởng thúc đẩy nhân dân ta không ngừng nỗ lực tiến bước. Một ngày mai tươi sáng là điều xứng đáng để chúng ta cống hiến hết mình."
 tr_harmony_mind_and_body:0 "Thể xác và Tinh thần"
 tr_harmony_mind_and_body_delayed:0 "Một bộ phận lớn dân cư đã đạt được tuổi thọ vượt xa trước đây nhờ áp dụng các công nghệ y tế mới và thói quen ăn uống lành mạnh hơn."
 tr_harmony_mind_and_body_immortal:0 "Thiền định y khoa"
 tr_harmony_mind_and_body_immortal_delayed:0 "Nhờ vào sức mạnh của công nghệ nano, chúng ta có thể quét sạch những áp lực độc hại đang bám lấy cả thể xác lẫn tinh thần."
 tr_harmony_unity_of_self:0 "Vạn chúng quy nhất"
 tr_harmony_unity_of_self_desc:1 "£pop£§HDân số§! ngoại lai bị biến đổi xác sống sẽ cung cấp £unity£Thống nhất"
 tr_harmony_unity_of_self_delayed:0 "Nếu tất cả các sinh vật có tri giác đều có thể nhìn những gì ta nhìn, nghĩ những gì ta nghĩ, làm những gì ta làm, thì ngày đại đồng của thiên hà chắc chắn sẽ đến."
 tr_harmony_harmonious_directives:0 "Sắc lệnh hài hòa"
 tr_harmony_harmonious_directives_delayed:0 "Những sắc lệnh khai sáng, ngợi ca nền cai trị nhân từ của chúng ta, sẽ gieo rắc hòa bình, tự do, công lý và sự an toàn ra khắp quốc gia, và thậm chí là vươn xa hơn nữa."
 tr_harmony_finish:0 "Hoàn thành Truyền thống Hài hòa"
 tr_harmony_federations_finish:0 "$tr_harmony_finish$"
 tr_harmony_federations_finish_desc:0 "$MOD_PLANETARY_ASCENSION_EFFECT_MULT$: §G+25%§!.\nCho phép sử dụng loại liên bang §Y$spiritualist_federation$§!.\nMở khóa Ô Đặc Quyền Thăng Hoa: §G+1§!"

