 ap_the_circle_of_life:0 "Vòng tròn Sinh mệnh"
 ap_galactic_wonders:0 "Kỳ quan Ngân hà"
 ap_interstellar_dominion:0 "Chủ quyền Khu vực giữa các vì sao"
 ap_eternal_vigilance:0 "Sự cảnh giác vĩnh cửu"
 ap_eternal_vigilance_desc:0 "Để lộ điểm yếu chính là mời gọi kẻ thù tấn công. Chúng ta phải cho kẻ thù thấy rằng cái giá phải trả để xâm chiếm chúng ta là rất lớn, lớn đến mức không ai dám gánh chịu cái giá đó."
 ap_eternal_vigilance_tt:0 "Dựa trên chính sách §Y$ap_eternal_vigilance$§!, cứ mỗi 6 tháng, một §YNền tảng phòng thủ§! sẽ được xây dựng tại mỗi §YCăn cứ sao§!, cho đến khi đạt mức §Y50%§! sức chứa tối đa."
 policy_eternal_vigilance_policy:0 "$ap_eternal_vigilance$"
 policy_eternal_vigilance_policy_desc:0 "Chiếc khiên vững chắc đến đâu, phụ thuộc vào cánh tay cầm khiên mạnh mẽ như thế nào."
 eternal_vigilance_full_spending:0 "Dốc toàn lực"
 eternal_vigilance_full_spending_name:0 "$eternal_vigilance_full_spending$"
 eternal_vigilance_full_spending_desc:0 "Mọi Căn cứ sao đều cần được bảo vệ cẩn thận. Không màng chi phí.\nTự động xây dựng §YNền tảng phòng thủ§! quanh mỗi §YCăn cứ sao§!"
 eternal_vigilance_half_spending:0 "Đầu tư tùy hoàn cảnh"
 eternal_vigilance_half_spending_name:0 "$eternal_vigilance_half_spending$"
 eternal_vigilance_half_spending_desc:0 "Chỉ những Pháo đài kiên cố nhất mới nhận được sự hỗ trợ.\nTự động xây dựng §YNền tảng phòng thủ§! quanh các §YCăn cứ sao Pháo đài§!"
 eternal_vigilance_no_spending:0 "Tiết kiệm chi phí"
 eternal_vigilance_no_spending_name:0 "$eternal_vigilance_no_spending$"
 eternal_vigilance_no_spending_desc:0 "Hệ thống phòng thủ của chúng ta không cần tăng cường.\nKhông tự động xây dựng §YNền tảng phòng thủ§! quanh các §YCăn cứ sao§!"

 ap_grasp_the_void:0 "Thâu tóm Không gian"
 ap_grasp_the_void_desc:0 "Dải ngân hà bao la chứa đựng muôn vàn tài nguyên vô giá, chờ đợi những đế chế có khả năng nắm giữ không gian tới khám phá."

 ap_engineered_evolution_desc:0 "Phó mặc hoàn toàn con đường tiến hóa của chúng ta cho tự nhiên là một cách làm kém hiệu quả và chậm chạp. Tại sao không trực tiếp bước một mạch đến với sự tiến hóa sinh học vượt bậc để vươn tới tầm cao mới?"

 ap_the_flesh_is_weak_desc:0 "Sự yếu ớt và giới hạn do thể xác mang lại dường như không còn phù hợp với kỷ nguyên du hành giữa các vì sao. Để khai phá triệt để tiềm năng của mình, chúng ta phải lựa chọn các bộ phận cấy ghép cơ khí hóa."
 ap_synthetic_evolution_desc:0 "Đã đến lúc từ bỏ lớp vỏ bọc bằng xương bằng thịt đang giam cầm những tư tưởng và linh hồn của chúng ta. Thông qua việc truyền tải mạng lưới thần kinh vào cơ thể người máy tổng hợp, chúng ta có thể tiến hóa sang một giai đoạn hoàn toàn mới."

 ap_mind_over_matter_desc:0 "[GetMindOverMatterDesc]"
 ap_mind_over_matter_desc_organic:0 "Tiềm năng ẩn sâu trong tâm trí của chúng ta mới chỉ được khai thác một phần rất nhỏ. Trong giống loài của chúng ta, hiện tại chỉ có một số ít [GetIndividualNamePlural] mới có khả năng sử dụng sức mạnh Tâm linh."
 ap_mind_over_matter_desc_machine:0 "Tiềm năng trong việc xử lý thuật toán của chúng ta mới chỉ được khai phá một phần rất nhỏ. Trong giống loài của chúng ta, hiện tại chỉ có một số ít [GetIndividualNamePlural] mới có khả năng sử dụng sức mạnh Tâm linh."

 ap_synthetic_age:0 "Kỷ nguyên Tổng hợp"
 ap_synthetic_age_desc:0 "Kỷ nguyên của các sinh vật hữu cơ đã kết thúc, tương lai của vũ trụ nằm trong tay máy móc. Đây chính là bình minh của Kỷ nguyên Tổng hợp."
 synthetic_age_tooltip:1 "$access_tradition_tree$['tradition_category:tradition_synthetics']\n$UNLOCKS_AGENDA$$council_agenda_agenda_synthetic_age_name$, mở khóa tùy chọn nghiên cứu công nghệ cải tạo máy móc."
 synthetic_age_tooltip_machine_age:0 "Mở tình huống §Y$situation_transformation$§! để mở khóa một trong những Cây truyền thống sau: ['tradition_category:tradition_modularity'], ['tradition_category:tradition_virtuality'] hoặc ['tradition_category:tradition_nanotech'].$TABBED_NEW_LINE$—$REQUIRES_TRADITION_SLOT$\n$UNLOCKS_AGENDA$$council_agenda_agenda_synthetic_age_name$, nhận tùy chọn nghiên cứu công nghệ cải tạo máy móc."
 ap_machine_worlds:0 "Thế giới Máy móc"
 ap_machine_worlds_desc:0 "Chúng ta sẽ nhào nặn thế giới của mình trở thành hình ảnh phản chiếu của chính chúng ta, dùng những thanh kim loại hoàn hảo và vĩnh cửu để thay thế cho da thịt bất tài và yếu ớt."
 ap_hive_worlds:0 "Hành tinh Tổ ong"
 ap_hive_worlds_desc:0 "Chúng ta sẽ tạo ra một hành tinh sống đồng nhất với Tổ ong, nơi mọi ngóc ngách đều là một phần của Tổ ong và những cá thể có thể sinh sống trong đó."
 hive_world:0 "Hành tinh Tổ ong"
 ap_shared_destiny:0 "Vận mệnh Chung"
 ap_shared_destiny_desc:0 "Khi chúng ta chạm đến đỉnh cao của sự vĩ đại, chúng ta tuyệt đối không được bỏ rơi những người đã luôn trung thành với mình. Tương lai huy hoàng của đế chế chúng ta thuộc về toàn thể mọi thần dân."
 ap_shared_destiny_effect:0 "§YQuốc gia phụ thuộc§! của bạn sẽ không phải chịu hình phạt về $r_loyalty$ chỉ vì bạn có nhiều quốc gia phụ thuộc khác."
 ap_world_shaper_desc:0 "Thông qua việc chạm trổ tỉ mỉ và biến đổi toàn diện để cải tạo hệ sinh thái của một hành tinh, độ khó của nó chẳng khác nào việc một nghệ nhân điêu khắc một bức tượng hoàn mỹ từ khối đất sét mềm dẻo."
 ap_master_builders_desc:0 "Xây dựng các Siêu cấu trúc đòi hỏi khả năng dự trữ tài nguyên khổng lồ và các phương án lên kế hoạch vượt quá sức tưởng tượng. Chúng ta đang tiến tới một tầm cao mới trong lĩnh vực kỹ thuật vĩ mô."
 ap_imperial_prerogative_desc:0 "Khi nền văn minh của chúng ta không ngừng lớn mạnh, khu vực trung tâm của văn minh đó cũng cần được mở rộng thêm. Sẽ có thêm nhiều hệ sao được đặt dưới sự kiểm soát trực tiếp của chính quyền trung ương."
 ap_one_vision_desc:0 "Sự đoàn kết thực sự chỉ có thể đạt được khi các mục tiêu tối thượng của quốc gia và nhân dân đều nhất quán với nhau. Anh em trong nhà có cãi nhau, cũng phải đồng lòng chống lại sự sỉ nhục từ bên ngoài."
 ap_consecrated_worlds_desc:0 "Dải ngân hà sáng ngời đã sản sinh ra vô số vùng đất thiêng, trong đó có một số nơi đặc biệt thu hút sự chú ý. Là những sinh mệnh yếu ớt phàm trần, chúng ta vẫn đang vật lộn một cách khổ cực để dự đoán cội nguồn thực sự của vũ trụ."
 ap_galactic_force_projection_desc:0 "Hạm đội là công cụ thực thi và mở rộng quyền lực, sức mạnh của hạm đội sẽ định đoạt sự hưng suy của đế chế."
 ap_defender_of_the_galaxy_desc:0 "Những cuộc xung đột vặt vãnh giữa các quốc gia có thể bắt gặp ở khắp mọi nơi trong hệ sao. Nhưng một khi thế lực bóng tối khủng khiếp xâm chiếm Dải ngân hà của chúng ta, ai sẽ là người bảo vệ chúng ta?"
 ap_galactic_contender_desc:0 "Những đế chế suy tàn vẫn bám víu lấy mớ di tích cũ nát đó không chịu buông tay, ôm giữ nỗi sợ hãi vô cớ và sự nghi kỵ đối với các nền văn minh sơ khai xung quanh. Đã đến lúc đá chúng ra khỏi vũ đài lịch sử rồi."
 ap_defender_of_the_galaxy_nomads_desc:0 "$ap_defender_of_the_galaxy_desc$"
 ap_technological_ascendancy_desc:0 "Những công nghệ tối tân trước đây từng được coi là ma thuật giờ đã nằm ngay trong tầm tay. Một kỷ nguyên công nghệ hoàn toàn mới đã đến."
 ap_mastery_of_nature_desc:0 "Dù từ rất lâu trước đây chúng ta đã nắm rõ môi trường tự nhiên của hành tinh mẹ trong lòng bàn tay, nhưng những dạng sinh vật ngoài hành tinh mà chúng ta gặp gỡ gần đây đã đặt ra những thách thức mới cho nền sinh thái học của chúng ta. Những thách thức này bắt buộc phải được, và nhất định sẽ bị chúng ta chinh phục."
 ap_mastery_of_nature_nomads:0 "Làm Chủ Tự Nhiên"
 ap_mastery_of_nature_nomads_desc:0 "Việc khai thác các tài nguyên ngoài hành tinh là một thách thức bất tận, và trí tuệ của chúng ta luôn sẵn sàng đương đầu hết lần này đến lần khác."
 ap_voidborn_desc:2 "Chúng ta đã thích nghi với việc định cư lâu dài trong không gian sâu thẳm, điều này sẽ giúp làm giảm nhu cầu tài nguyên khi xây dựng cơ sở hạ tầng, đồng thời giúp các trạm cư trú của chúng ta có thêm nhiều không gian hơn cho các chức năng khác."
 ap_voidborn_habitat_effect:1 "Có thể xây dựng công trình nhà ở cao cấp trên §YTrạm cư trú§!.\n—Miễn trừ yêu cầu về §YCông nghệ§! cho việc chuyên môn hóa khu vực cơ sở £zone£ trên §YTrạm cư trú§!"
 ap_the_circle_of_life_desc:0 "Một vòng tròn khổng lồ chứa một hệ sinh thái nhân tạo được xây dựng dọc theo quỹ đạo của một ngôi sao. Về mặt lý thuyết thì thực sự là có thể..."
 ap_galactic_wonders_desc:0 "Siêu cấu trúc là những kỳ quan vĩ đại của thời đại chúng ta. Một dự án khổng lồ với quy mô như vậy là điều hoàn toàn không thể tưởng tượng nổi đối với vài thế hệ trước."
 ap_interstellar_dominion_desc:2 "Chúng ta đi theo tiếng gọi của những vì sao. Hy vọng không có bất cứ điều gì có thể ngăn cản chúng ta tự do dạo bước giữa các tinh tú."

 ap_colossus:0 "Dự án Colossus"
 ap_colossus_desc:0 "Dự án Colossus là sản phẩm tối thượng mà cả hai tư tưởng khủng bố và răn đe đều hằng mong ước. Ý tưởng thiết kế cho con tàu đồ sộ nhất trong lịch sử này là trang bị một siêu vũ khí có khả năng xóa sổ toàn bộ một hành tinh."
 ap_enigmatic_engineering:0 "Công trình Thiên cơ"
 ap_enigmatic_engineering_desc:0 "Công nghệ không phải là một kiến thức cứng nhắc nơi một bài toán chỉ có một lời giải, mà nó là sản phẩm khiến chúng ta trở nên vượt xa người thường. Những kẻ phàm phu tục tử làm sao có thể thấu hiểu được sự tiến bộ của chúng ta."
 ap_enigmatic_engineering_cloaking:0 "$ap_enigmatic_engineering$"
 ap_enigmatic_engineering_cloaking_desc:0 "$ap_enigmatic_engineering_desc$"
 ap_nihilistic_acquisition:0 "Cướp bóc trắng trợn"
 ap_nihilistic_acquisition_desc:0 "Nguyên tắc tự quyết của các cá nhân tuyệt đối không phải là một quy luật luân lý sắt thép, sự thành bại của một tập thể rõ ràng quan trọng hơn nhiều so với được mất của cá nhân."
 ap_transcendent_learning:0 "Học thuật Siêu phàm"
 ap_transcendent_learning_desc:0 "Xã hội của chúng ta buộc phải thay đổi thái độ đối với việc học hỏi. Chỉ có như vậy, các nhân tài sở hữu nền tảng kiến thức và công nghệ tiên tiến nhất của chúng ta mới có thể đạt tới một tầm cao mới."

