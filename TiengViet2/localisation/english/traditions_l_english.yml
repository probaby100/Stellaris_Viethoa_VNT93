 TRADITIONS_FINISH:3 "§EHiệu ứng hoàn thành§!:\nÁp dụng tất cả truyền thống $CATEGORY|Y$ sẽ nhận được:\n"
 TRADITIONS_FINISH_AP:2 "$MOD_COUNTRY_ASCENSION_PERKS_ADD$: §G+1§!"
 TRADITION_COST:0 "Chi phí"
 TRADITIONS_UNAFFORDABLE:0 "§RChúng ta cần thêm §Y$RESOURCES$§! để mở khóa truyền thống này.§!"
 MUST_ADOPT_TRADITION_CATEGORY:0 "$TRIGGER_FAIL$Đã áp dụng truyền thống $CATEGORY|Y$"
