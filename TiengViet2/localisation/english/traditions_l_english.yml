 tradition_unyielding:0 "Kiên cường"
 tradition_unyielding_desc:0 "Hệ sao này vừa rộng lớn vô tận vừa đầy rẫy hiểm nguy."
 tr_unyielding_adopt:0 "Truyền thống Kiên cường"
 tr_unyielding_finish:0 "Hoàn thành truyền thống Kiên cường"
