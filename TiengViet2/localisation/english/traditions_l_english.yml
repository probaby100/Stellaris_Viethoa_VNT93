 tr_aptitude_specialist_training_machine:0 "Nâng cấp Phần mềm"
 tr_aptitude_specialist_training_machine_delayed:0 "Những chương trình mới nhất đảm bảo lãnh đạo của chúng ta có đủ mọi công cụ để đạt được hiệu suất mong đợi."
 tr_aptitude_psychological_profiling:0 "Phân tích Tâm lý"
 tr_aptitude_psychological_profiling_delayed:0 "Thấu hiểu nỗi lo và điểm yếu của lãnh đạo cho phép chúng ta thực hiện các biện pháp phòng ngừa kịp thời."
 tr_aptitude_psychological_profiling_hive:0 "Chẩn đoán Hành vi"
 tr_aptitude_psychological_profiling_hive_delayed:0 "Nhận diện những điểm yếu bất thường cho phép chúng ta thực hiện các biện pháp để loại bỏ chúng."
