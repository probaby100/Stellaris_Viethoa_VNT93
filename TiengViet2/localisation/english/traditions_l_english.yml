 tr_statecraft_immutable_directives_delayed:0 "Sự thấu hiểu căn bản về phương hướng và ý nghĩa luôn rất rõ ràng, cho phép chúng ta có thể dồn sự tập trung vào nơi khác mà không đánh mất những thành quả đã đạt được."
 tr_statecraft_amongst_peers:0 "Học hỏi từ đồng nghiệp"
