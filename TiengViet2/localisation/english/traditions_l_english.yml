 UNITY:0 "Thống nhất"
 UNITY_DESC:0 "Thống nhất là tài nguyên dùng để mở khóa $TRADITIONS$. Dựa trên các công trình cụ thể và mức độ gắn kết của đế chế, điểm Thống nhất sẽ tự động tạo ra mỗi tháng."
 TRADITIONS:0 "Truyền thống"
 TRADITIONS_DESC:0 "Truyền thống cung cấp nhiều phần thưởng gia tăng khác nhau. Khi tích lũy đủ điểm Thống nhất, bạn có thể mở khóa các truyền thống. Nhiều yếu tố, như số lượng thuộc địa hoặc dân số, sẽ làm tăng chi phí Thống nhất cần thiết để mở khóa."
 TRADITIONS_PROGRESS:0 "Tiến trình $KEY$"
 TRADITIONS_PROGRESS_TITLE:0 "Tiến trình"
 TRADITIONS_PROGRESS_DESC:0 "Chúng ta cần thêm £unity£$MISSING|Y$ điểm Thống nhất để áp dụng truyền thống mới. Với tốc độ hiện tại, dự kiến có thể mở khóa vào $DATE|Y$."
 UNLOCK_TRADITION_DESC:0 "Đã có đủ £unity£ để áp dụng truyền thống mới."
 TRADITIONS_TIME_TO_NEXT:0 "Số tháng còn lại"
 TRADITIONS_TIME_TO_NEXT_DESC:0 "Còn lại $MONTHS$."
 TRADITIONS_UNLOCKED:0 "Chúng ta đã mở khóa $COUNT|Y$ truyền thống trong nhánh này, trên tổng số $MAX|Y$."
 TRADITION_ADOPT_BUTTON:0 "Áp dụng"
 TRADITION_SELECT_BUTTON:0 "Chọn"
