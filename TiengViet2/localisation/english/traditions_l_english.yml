 ap_executive_vigor:0 "Hành pháp Quyết liệt"
 ap_executive_vigor_desc:0 "Khi thực thi các mệnh lệnh của chính phủ, chúng ta sẽ không có bất kỳ sự thỏa hiệp nào, cũng sẽ không bỏ cuộc giữa chừng vì khó khăn. Đã không làm thì thôi, một khi đã làm thì phải làm đến cùng."

