 tradition_prosperity:0 "Thịnh Vượng"
 tradition_prosperity_desc:0 "Nền kinh tế chính là thước đo tốt nhất cho sự thành bại của một quốc gia."
 tradition_prosperity_machine_desc:0 "Chừng nào tập hợp máy móc của chúng ta còn tồn tại, việc mất đi vài cá thể đơn lẻ chẳng hề hấn gì. Để đảm bảo sự trường tồn, ta phải nắm trong tay lượng tài nguyên khổng lồ."
 tradition_prosperity_hive_mind_desc:0 "Nếu muốn lan tỏa ý chí của mình ra khắp các vì sao, ta buộc phải xây dựng một [GetGestaltEntityName] vĩ đại và phồn vinh."

 tr_prosperity_adopt:0 "Tiếp Nhận Truyền Thống Thịnh Vượng"
 tr_prosperity_adopt_nomad:0 "$tr_prosperity_adopt$"
 tr_prosperity_adopt_nomad_eager_explorer:0 "$tr_prosperity_adopt$"

 tr_prosperity_sct:0 "Bản mẫu thi công tiêu chuẩn"
 tr_prosperity_sct_desc:5 "§YChi phí xây dựng§! của §YCông trình§! và §YĐặc khu§! giảm §G10%§!, đồng thời §YTốc độ xây dựng§! tăng §G+25%§!."
 tr_prosperity_sct_delayed:0 "Công nghệ càng phát triển và phức tạp, lực lượng lao động càng phải đối mặt với nhiều yêu cầu mới. Bằng việc áp dụng các bản mẫu thi công tiêu chuẩn, công nhân giờ đây không cần phải hiểu sâu về các chi tiết xây dựng mà vẫn có thể hoàn thành xuất sắc công trình."

 tr_prosperity_sct_machine:1 "Công trình đúc sẵn"
 tr_prosperity_sct_machine_desc:0 "$tr_prosperity_sct_desc$"
 tr_prosperity_sct_machine_delayed:1 "Sản xuất hàng loạt các tòa nhà với quy chuẩn chung sẽ mang lại hiệu suất cao hơn nhiều so với việc thiết kế và xây dựng từng căn một."

 tr_prosperity_sct_wilderness:0 "Hệ sinh thái tiêu chuẩn hóa"
 tr_prosperity_sct_wilderness_desc:0 "$tr_prosperity_sct_desc$"
 tr_prosperity_sct_wilderness_delayed:0 "Cùng với những đột phá trong sinh học và công nghệ kiến tạo, ta đã tìm ra điểm nảy mầm tối ưu nhất cho các chồi non mới. Tiết kiệm được khối năng lượng khổng lồ thay vì phải tiến hóa đi tiến hóa lại các chồi non cho mỗi hành tinh."

 tr_prosperity_sct_nomads:0 "$tr_prosperity_sct$"
 tr_prosperity_sct_nomads_desc:0 "$tr_prosperity_sct_desc$"
