 tr_unyielding_federations_finish_desc:0 "$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_MULT$ §G+50%§!\n$mod_starbases_upkeep_mult$ §G-20%§!\nCho phép sử dụng loại liên bang §Y$military_federation$§!.\nMở khóa Đặc Quyền Thăng Hoa £unity£['ascension_perk:ap_eternal_vigilance'].\nMở khóa ô Đặc Quyền Thăng Hoa: §G+1§!"

 tr_unyielding_resistance_is_frugal:0 "Phòng thủ tiết kiệm"
 tr_unyielding_resistance_is_frugal_desc:2 "£defense_army£§YĐạo quân phòng thủ§! hiện tạo ra §Y0.5§! £unity£Đoàn kết."
 tr_unyielding_resistance_is_frugal_hive:0 "$tr_unyielding_resistance_is_frugal$"
 tr_unyielding_resistance_is_frugal_machine:0 "$tr_unyielding_resistance_is_frugal$"
 tr_unyielding_resistance_is_frugal_delayed:0 "Người dân của chúng ta cảm thấy vô cùng an tâm trước sức mạnh của các pháo đài bảo vệ hành tinh, và coi đây là sự đảm bảo quan trọng cho sự thịnh vượng trong tương lai."
 tr_unyielding_resistance_is_frugal_hive_delayed:0 "Không gì mang lại cảm giác thỏa mãn và an toàn cho các nút mạng trong ý thức chung của chúng ta hơn sự thật rằng hành tinh đang được bảo vệ kiên cố."
 tr_unyielding_resistance_is_frugal_machine_delayed:0 "Đảm bảo mọi hành tinh đều được bảo vệ nghiêm ngặt sẽ giải phóng một lượng lớn đơn vị tính toán, cho phép các nút mạng và bộ xử lý hoạt động hiệu quả hơn."

 tr_unyielding_never_surrender:0 "Không bao giờ đầu hàng"
 tr_unyielding_never_surrender_gestalt:0 "$tr_unyielding_never_surrender$"
 tr_unyielding_never_surrender_delayed:0 "Chúng ta sẽ chiến đấu trên mặt đất, chúng ta sẽ chiến đấu trên bầu trời, chúng ta sẽ chiến đấu trong vành đai tiểu hành tinh, các tuyến siêu không gian và các tinh vân, chúng ta sẽ chiến đấu giữa các vì sao với niềm tin ngày càng lớn và sức mạnh ngày càng tăng. Chúng ta không bao giờ đầu hàng!"
 tr_unyielding_never_surrender_gestalt_delayed:0 "Chúng ta sẽ không bao giờ khuất phục trước những kẻ thấp kém. Hãy để chúng lao vào hàng phòng ngự bất khả xâm phạm của chúng ta! Một ngàn năm sau, chúng sẽ chỉ là một chú thích khác trong câu chuyện thăng thiên của chúng ta."

 tr_unyielding_bulwark_of_harmony:0 "Bức tường hòa hợp"
 tr_unyielding_bulwark_of_harmony_hive:0 "$tr_unyielding_bulwark_of_harmony$"
 tr_unyielding_bulwark_of_harmony_machine:0 "$tr_unyielding_bulwark_of_harmony$"
 tr_unyielding_bulwark_of_harmony_desc:2 "Khi chúng ta đang trong một cuộc chiến tranh phòng vệ với đế chế khác, §Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§! sẽ tăng §G+33%§!. Ngoài ra, §Y$MOD_SHIP_FIRE_RATE_MULT$§! của tất cả tàu chiến nằm trong lãnh thổ sẽ tăng §G+15%§!"
 tr_unyielding_bulwark_of_harmony_delayed:0 "Mọi cấu trúc hữu cơ, dù hoàn hảo đến đâu, đều phải dựa vào hệ miễn dịch để chống lại mối đe dọa từ bệnh tật bên ngoài, xã hội của chúng ta cũng không ngoại lệ."
 tr_unyielding_bulwark_of_harmony_hive_delayed:0 "Mọi cấu trúc hữu cơ, dù hoàn hảo đến đâu, đều phải dựa vào hệ miễn dịch để chống lại mối đe dọa từ bệnh tật bên ngoài, [This.GetName] cũng không ngoại lệ."
 tr_unyielding_bulwark_of_harmony_machine_delayed:0 "Mọi cấu trúc hữu cơ, dù hoàn hảo đến đâu, đều phải dựa vào hệ thống phòng thủ nội tại để chống lại các mối đe dọa từ bên ngoài, [This.GetName] cũng không ngoại lệ."

 tr_unyielding_defensive_zeal:1 "Lòng nhiệt thành phòng thủ"
 tr_unyielding_defensive_zeal_delayed:1 "Khi bảo vệ lãnh thổ và sự tồn vong của chúng ta, kẻ thù nhất định sẽ cảm nhận được sự dũng cảm của chúng ta."
 tr_unyielding_defensive_zeal_desc:0 "§YMáu thân tàu§! và §YSát thương§! của §YCăn cứ sao§! và §YNền tảng phòng thủ§! tăng §G33%§!."

 tr_unyielding_fortress_doctrine:0 "Học thuyết pháo đài"
 tr_unyielding_fortress_doctrine_delayed:1 "Trong tâm lý của [This.GetAdj], tư tưởng luôn giữ cảnh giác đã ăn sâu bén rễ. Chừng nào sự cảnh giác của chúng ta không nới lỏng, kẻ thù sẽ không bao giờ có thể khiến chúng ta trở tay không kịp."
 tr_unyielding_fortress_doctrine_hive:0 "Quá trình tư duy cảnh giác"
 tr_unyielding_fortress_doctrine_hive_delayed:0 "Chúng ta không bao giờ có thể hoàn toàn tin tưởng những kẻ có tư tưởng đi lệch khỏi ý thức chung của chúng ta. Chúng ta sẽ luôn cảnh giác, đảm bảo không ai có thể khiến chúng ta trở tay không kịp."
 tr_unyielding_fortress_doctrine_hive_nemesis:0 "$tr_unyielding_fortress_doctrine_hive$"
 tr_unyielding_fortress_doctrine_hive_nemesis_delayed:0 "$tr_unyielding_fortress_doctrine_hive_delayed$"
 tr_unyielding_fortress_doctrine_machine:0 "Lệnh con Vệ binh"
 tr_unyielding_fortress_doctrine_machine_delayed:0 "Các thuật toán của chúng ta sẽ không bao giờ tính toán hết được sự khó lường trong hành vi của các sinh vật phi tổng hợp. Chúng ta sẽ luôn cảnh giác, đảm bảo không ai có thể khiến chúng ta trở tay không kịp."
 tr_unyielding_fortress_doctrine_machine_nemesis:0 "$tr_unyielding_fortress_doctrine_machine$"
 tr_unyielding_fortress_doctrine_machine_nemesis_delayed:0 "$tr_unyielding_fortress_doctrine_machine_delayed$"

