 tr_subterfuge_nda_machine:0 "Thuật toán mã hóa cải tiến"
 tr_subterfuge_nda_delayed:0 "Công dân của chúng ta tuân thủ nghiêm ngặt chính sách ngậm chặt [This.GetSpeciesMouthName] khi bảo vệ bí mật trước những kẻ ngoại lai."
 tr_subterfuge_nda_hive_delayed:0 "Mạng lưới thần kinh của chúng ta không cho phép để lại những đầu mút mở, tránh việc có kẻ mượn cớ đó để dò xét bí mật của chúng ta."
 tr_subterfuge_nda_machine_delayed:0 "Bằng cách mở rộng các dự án nâng cấp an ninh thường xuyên tới từng nút mạng, kẻ thù sẽ không thể tìm ra lỗ hổng để xâm nhập vào mạng thông tin của chúng ta."

 tr_subterfuge_operational_security:0 "An toàn chiến dịch"
 tr_subterfuge_operational_security_gestalt:0 "Cá thể hoạt động ngầm"
 tr_subterfuge_operational_security_delayed:0 "Sự thay đổi khu vực tác chiến từ đơn hành tinh sang liên hành tinh mang đến những thách thức độc nhất cho các đặc vụ bí mật của chúng ta. Bằng cách điều chỉnh chương trình huấn luyện để phù hợp với nhu cầu tác chiến hiện tại trong hệ sao, chúng ta sẽ tiếp tục duy trì khả năng cạnh tranh trong kỷ nguyên mới này."
 tr_subterfuge_operational_security_gestalt_delayed:0 "Chúng ta không còn là một quốc gia đơn độc như trước, các đối thủ cạnh tranh ở đây đều ôm mộng sát nhân, vậy mà giờ lại chung sống dưới cùng một hệ sao với chúng ta. Để phát triển nhanh chóng trong môi trường mới này, chúng ta phải truyền bá tư tưởng 'bảo mật' cho người dân, đồng thời dành một phần lớn sức lực cho việc do thám bí mật của các quốc gia khác."

 tr_subterfuge_double_agents:0 "Điệp viên hai mang"
 tr_subterfuge_double_agents_effect:0 "Mỗi khi một §YChiến dịch§! thù địch nhắm vào quốc gia chúng ta thất bại, nhận §Y+10§! thông tin tình báo đối với quốc gia khởi xướng chiến dịch."
 tr_subterfuge_double_agents_delayed:0 "Bằng các biện pháp chiêu hàng sáng tạo, chúng ta thậm chí có thể thuyết phục được cả những kẻ thù trung thành nhất làm việc cho mình."

 tr_subterfuge_shadow_recruits:0 "Đặc vụ bóng tối"
 tr_subterfuge_shadow_recruits_delayed:1 "Kẻ thù của chúng ta mới chỉ vừa làm quen với bóng tối, còn [Root.GetOperativesLowerPlural] của chúng ta sinh ra trong bóng tối và được định hình bởi bóng tối."

