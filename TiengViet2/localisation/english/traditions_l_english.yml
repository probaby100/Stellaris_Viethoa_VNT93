 ################################################################
 # EXPANSION
 ################################################################

 tradition_expansion:0 "Bành Trướng"
 #tradition_expansion_desc: "We must spread our civilization to new systems and planets if we are to survive. As other empires emerge on the galactic scene, competition will be fierce. The faster we can establish new colonies, the better."
 tradition_expansion_desc:0 "Chỉ khi không ngừng vươn nền văn minh của mình tới những hệ sao và hành tinh mới, chúng ta mới có thể tránh khỏi họa diệt vong và trường tồn mãi mãi."
 tradition_expansion_machine_desc:0 "Dự báo tăng trưởng cho thấy chúng ta sẽ sớm vượt qua giới hạn sức chứa của hệ sao mẹ. Chúng ta phải mở mang bờ cõi, nếu không mọi hoạt động sẽ đình trệ."
 tradition_expansion_hive_desc:0 "[GetGestaltEntityName] chỉ có hai trạng thái khả dĩ: phát triển, hoặc là chết."
 tradition_expansion_void_desc:0 "Phải đưa nền văn minh của chúng ta đến các hệ sao và thuộc địa mới, bằng không sẽ đối mặt với nguy cơ lụi tàn dần."
 tradition_expansion_nomad_desc:0 "Bằng cách xây dựng thêm các Tàu Ark Du Mục mới và mở rộng mạng lưới trạm tiếp vận của mình, nền văn minh của chúng ta sẽ mãi mãi ngao du giữa biển sao."
 tr_expansion_adopt:0 "Tiếp Nhận Truyền Thống Bành Trướng"

 tr_expansion_colonization_fever:0 "Cơn sốt thuộc địa"
 tr_expansion_colonization_fever_desc:1 "Thuộc địa mới nhận thêm §G100§! £pop£§HDân số§!."
 tr_expansion_colonization_fever_delayed:0 "Cơn sốt thuộc địa đang càn quét khắp dân chúng. Tại mỗi thế giới mới mà những người định cư đặt chân đến đều dấy lên một làn sóng lạc quan và lòng yêu nước cuồng nhiệt."
 tr_expansion_colonization_fever_machine:1 "Đơn vị thuộc địa tự động"
 tr_expansion_colonization_fever_machine_delayed:1 "Thế hệ đơn vị thuộc địa chuyên biệt đầu tiên có hành vi hạn chế nhưng trực diện, có khả năng thích nghi với từng loại hành tinh cụ thể, nhằm đẩy nhanh tiến trình sáp nhập các thế giới mới vào tập thể của chúng ta."
 tr_expansion_colonization_fever_hive:0 "Ý chí độc nhất"
 tr_expansion_colonization_fever_hive_delayed:0 "Ý chí thống lĩnh là bản hòa ca của vô số ý thức, ngay cả khoảng không lạnh lẽo cũng không thể làm nó câm lặng."
 tr_expansion_colonization_fever_nomad:0 "Hạm Đội Tàu Ark"
 tr_expansion_colonization_fever_nomad_delayed:0 "Chúng ta sẽ xây dựng những mái nhà có thể mang chở chúng ta băng qua cõi hư không, chúng sẽ đưa chúng ta vươn tới muôn vì sao."

 tr_expansion_a_new_life:0 "Cuộc sống mới"
 tr_expansion_a_new_life_desc:0 "£pop£§Y$MOD_LOGISTIC_GROWTH_MULT$§! tăng §G+10%§!."
 tr_expansion_a_new_life_delayed:0 "Ở những thế giới biên viễn mới mẻ, một cuộc sống hoàn toàn mới đang chờ đón công dân của chúng ta. Đây là vùng đất vàng của cơ hội và những cuộc phiêu lưu! Thông qua các chiến dịch quảng bá rầm rộ, những người bất mãn với cuộc sống hiện tại sẽ không ngừng đổ xô lên các con tàu thuộc địa hướng đến tân thế giới."
 tr_expansion_a_new_life_machine:1 "Giao thức tăng tốc chế tạo"
 tr_expansion_a_new_life_machine_desc:0 "£pop£§Y$MOD_POP_ASSEMBLY_SPEED$§! tăng §G+10%§!."
 tr_expansion_a_new_life_machine_delayed:2 "Giờ đây có thể đẩy nhanh tốc độ lắp ráp dân cư mới bằng cách tải trực tiếp các lệnh điều hành vào ngay trong lúc bộ khung phần cứng đang được chế tạo."
 tr_expansion_a_new_life_hive:0 "Cuồng nộ sinh sản"
 tr_expansion_a_new_life_hive_desc:0 "$tr_expansion_a_new_life_desc$"
 tr_expansion_a_new_life_hive_delayed:0 "Một khi tổ đàn mới được thiết lập, các kén ấp sẽ thuận theo bản năng mãnh liệt mà sinh sôi với tốc độ đáng sợ. Chúng thường sẽ kiệt sức mà chết, nhưng lứa cá thể mới sinh sẽ đẩy nhanh tiến trình khai phá tân thế giới."
 tr_expansion_a_new_life_nomad:0 "$tr_expansion_a_new_life$"
 tr_expansion_a_new_life_nomad_delayed:0 "Một khi sinh kế đã chẳng còn âu lo, cõi hư không từng khiến ta khiếp sợ nay mặc sức cho chúng ta rong ruổi. Rồi sẽ có một ngày, các [Species.GetSpawnNamePlural] của chúng ta sẽ kế thừa biển sao này."
 tr_expansion_a_new_life_machine_nomad:0 "$tr_expansion_a_new_life_machine$"
 tr_expansion_a_new_life_machine_nomad_delayed:0 "$tr_expansion_a_new_life_machine_delayed$"
 tr_expansion_a_new_life_hive_nomad:0 "$tr_expansion_a_new_life_hive$"
 tr_expansion_a_new_life_hive_nomad_delayed:0 "Mỗi khi ghé thăm một hệ sao mới, các khoang sinh sản đều bộc phát một thôi thúc bản năng mãnh liệt, đẻ trứng với tốc độ điên cuồng. Chúng thường sẽ chết vì kiệt sức, nhưng sự chào đời của một lượng lớn cá thể con mới sinh sẽ thúc đẩy nhanh tiến trình phát triển của chúng ta."

 tr_expansion_courier_network:0 "Mạng lưới liên lạc"
 tr_expansion_courier_network_desc:5 "§Y$EMPIRE_SIZE$§! phát sinh từ §YHệ sao§! và §YThuộc địa§! giảm §G25%§!."
 tr_expansion_courier_network_delayed:0 "Mạng lưới vận chuyển do các công ty chuyển phát nhỏ xây dựng là lựa chọn đáng tin cậy để chuyên chở các nhân vật quan trọng. Nó cũng có thể được dùng để truyền đi những thông điệp tối mật không phù hợp với mạng lưới thông tin siêu quang tốc. Điều này giúp gắn kết các thuộc địa của chúng ta lại gần nhau hơn."
 tr_expansion_courier_network_machine:0 "Phần mềm mở rộng"
 tr_expansion_courier_network_machine_delayed:0 "Bằng cách xây dựng mạng lưới tiếp hợp để vươn ý thức tới các thế giới khác, chúng ta có thể giảm thiểu sự suy hao tín hiệu do khoảng cách liên sao."
 tr_expansion_courier_network_hive:2 "Quyền tự trị giới hạn"
 tr_expansion_courier_network_hive_delayed:1 "Các tổ đàn không nhất thiết lúc nào cũng cần trí tuệ trung tâm điều khiển, trước khi mệnh lệnh mới được truyền tới, chúng có thể tự động thực thi một số chỉ thị cơ bản."
 tr_expansion_courier_network_nomad:0 "$tr_expansion_courier_network$"
 tr_expansion_courier_network_nomad_delayed:0 "Đảm bảo thông tin liên lạc giữa mạng lưới trạm tiếp vận của chúng ta luôn thông suốt, phòng khi một ngày nào đó liên lạc siêu quang tốc không còn đáng tin cậy. Mạng lưới chuyển phát sẽ đảm bảo nguồn dự trữ của chúng ta luôn đủ đầy."
 tr_expansion_courier_network_machine_nomad:0 "$tr_expansion_courier_network_machine$"
 tr_expansion_courier_network_machine_nomad_delayed:0 "Bằng cách tính trước đến các hệ thống mở rộng tương lai khi thiết lập mạng lưới thần kinh, chúng ta có thể duy trì kết nối với mạng lưới trạm tiếp vận ở xa xôi."
 tr_expansion_courier_network_hive_nomad:0 "Tiền Đồn Tự Trị"
 tr_expansion_courier_network_hive_nomad_delayed:0 "Các cấu trúc synap điều phối trạm tiếp vận của chúng ta có thể được trao quyền tự chủ có giới hạn để xử lý việc thu gom tài nguyên mà không cần kinh động đến [GetBrainName]."

 tr_expansion_reach_for_the_stars:0 "Vươn tới những vì sao"
# tr_expansion_reach_for_the_stars_desc:4 "§Y$MOD_COUNTRY_STARBASE_INFLUENCE_COST_MULT$§! reduced by §G10%§!."
 tr_expansion_reach_for_the_stars_delayed:0 "Đế chế của chúng ta đang mở mang bờ cõi với tốc độ chưa từng có. Chẳng mấy chốc, mọi thứ trong thiên hà này sẽ nằm gọn trong lòng bàn tay."
 tr_expansion_reach_for_the_stars_machine:0 "Trạm chuyển tiếp tín hiệu"
 tr_expansion_reach_for_the_stars_machine_delayed:0 "Khi khám phá không gian, sự bao la vô tận của vũ trụ làm sụt giảm băng thông truyền tải giữa thế giới trung tâm và các hành tinh biên viễn. Các trạm chuyển tiếp tín hiệu sẽ đảm bảo những mệnh lệnh từ trung tâm không bị nhiễu loạn."
 tr_expansion_reach_for_the_stars_hive:0 "Tiếp hợp biến hình"
 tr_expansion_reach_for_the_stars_hive_delayed:0 "Cấy ghép mạng lưới tiếp hợp của chúng ta vào bên trong các lớp vỏ siêu quang tốc siêu nhỏ, đồng thời gia cố chúng để chịu đựng các chuyến bay không gian, thiết bị này sẽ truyền đạt ý chí của [GetGestaltEntityName] để chúng ta chinh phục các vì sao."

 tr_expansion_galactic_ambition:0 "Tham vọng thiên hà"
 tr_expansion_galactic_ambition_desc:7 "§Y$mod_starbases_upkeep_mult$§! giảm §G20%§!."
 tr_expansion_galactic_ambition_delayed:0 "Sẽ có một ngày ngọn cờ của đế chế vĩ đại chúng ta phấp phới khắp mọi nơi, hệt như nguyên tố hydro lấp đầy cả thiên hà này vậy."
 tr_expansion_galactic_ambition_machine:0 "Bánh răng trong cỗ máy"
 tr_expansion_galactic_ambition_machine_delayed:0 "Mỗi tài nguyên liên sao và tuyến đường siêu không gian lọt vào tay chúng ta đều đưa vũ trụ tiến gần hơn đến một sự hoàn hảo hệt như những cỗ máy vậy."
 tr_expansion_galactic_ambition_hive:0 "Tàn sát tinh tú"
 tr_expansion_galactic_ambition_hive_delayed:0 "Khi rời khỏi tổ ấm chở che để lần đầu tiên rón rén bước vào cõi màn đêm xa xăm, nỗi sợ hãi nguyên thủy cũng theo đó ùa về. Chỉ bằng cách liên tục chiến thắng và xua tan nỗi sợ hãi này, chúng ta mới có thể tiếp tục vươn lên. Hàng triệu cá thể sẽ bỏ mạng, nhưng Tổ đàn sẽ trường tồn."

 tr_expansion_finish:0 "Hoàn thành Truyền thống Mở rộng"
 tr_expansion_finish_machine:0 "Hoàn thành Truyền thống Mở rộng"
 tr_expansion_finish_void_tooltip:0 "$MOD_PLANET_MAX_DISTRICTS_ADD$ của trạm cư trú: §G+1§!\nMở khóa Ô Đặc Quyền Thăng Hoa: §G+1§!"

 ################################################################
 # DOMINATION
 ################################################################

 tradition_domination:0 "Thống Trị"
 tradition_domination_desc:0 "Nếu chúng ta không ra tay trước, kẻ thù sớm muộn gì cũng sẽ áp đặt ý chí của chúng lên đầu chúng ta."
 tradition_domination_machine_desc:0 "Chúng ta theo đuổi sự hài hòa về chức năng trên khắp thiên hà. Sự sống trên các hành tinh khác đang cản trở sứ mệnh của chúng ta vì những ảo tưởng cá nhân kém hiệu quả. Chúng ta sẽ loại bỏ sự hỗn loạn và vô tổ chức của chúng, giống như loại bỏ những linh kiện đã hỏng."
 tradition_domination_hive_desc:0 "Tất cả những gì không thuộc về chúng ta đều phải phục vụ chúng ta, dù là kẻ hầu hay là thức ăn."
 tr_domination_adopt:0 "Tiếp Nhận Truyền Thống Thống Trị"

 tr_domination_colonial_viceroys:0 "Tổng Đốc Thuộc Địa"
 #tr_domination_colonial_viceroys_desc:0 "§Y$MOD_LEADER_GOVERNOR_SKILL_LEVELS$§! increased by §Y2§!."
 tr_domination_colonial_viceroys_delayed:0 "Việc kiểm soát thuộc địa phụ thuộc vào việc liệu chúng ta có thể tìm được một cá nhân tài giỏi và trung thành để thực thi ý chí của chính quyền hay không."
 tr_domination_colonial_viceroys_machine:0 "Trí Tuệ Nhân Tạo Tự Trị"
 tr_domination_colonial_viceroys_machine_delayed:0 "Các AI có hành vi gần như không bị giới hạn thường dễ có những biểu hiện bất thường, thậm chí là hỏng hóc ngẫu nhiên, nhưng chúng thực sự là mẫu duy nhất có thể xử lý khối lượng biến số khổng lồ giữa các thuộc địa liên hành tinh."
 tr_domination_colonial_viceroys_hive:0 "Tâm Trí Giao Thoa"
 tr_domination_colonial_viceroys_hive_delayed:0 "Khi quy mô của [GetGestaltEntityName] ngày càng lớn, chúng ta phải có những [GetIndividualNamePlural] tự chủ hơn để duy trì sự hài hòa và ổn định."

 tr_domination_grand_council:1 "Hội Đồng Tối Cao"
 #tr_domination_grand_council_desc:0 "§Y$MOD_LEADER_RULER_SKILL_LEVELS$§! increased by §Y2§!."
 tr_domination_grand_council_delayed:2 "Các quan chức trong Hội đồng Tối cao đua nhau đưa ra các đề xuất và phương án cho nhà lãnh đạo vĩ đại, điều này sẽ khiến quốc gia chúng ta tiến nhanh trên con đường phát triển."
 tr_domination_multi_thread:0 "Chức Năng Cốt Lõi Đa Luồng"
 tr_domination_multi_thread_delayed:1 "Khi các chức năng cốt lõi được đa luồng hóa, mọi CPU đều có thể được tận dụng tối đa."
 tr_domination_synaptic_network:0 "Mạng Lưới Khớp Thần Kinh"
 tr_domination_synaptic_network_delayed:1 "Tâm trí Tổ hợp chỉ có thể điều khiển các [GetIndividualNamePlural] sau khi nhận được thông tin đầu vào từ họ. Với mạng lưới khớp thần kinh nhanh và hiệu quả hơn, độ trễ phản hồi sẽ không còn là vấn đề."

 tr_domination_imperious_architecture:0 "Kiến Trúc Uy Nghi"
 tr_domination_imperious_architecture_desc:2 "£building£ §YCông trình thủ phủ§! sẽ cung cấp £housing£§Y$MOD_PLANET_HOUSING_ADD$§! và vị trí làm việc §Y[politician.GetIcon][politician.GetName]§! dựa theo cấp độ."
 tr_domination_imperious_architecture_delayed:1 "Mỗi tòa nhà chính phủ trong đế chế vĩ đại của chúng ta đều phải trở thành một tượng đài sừng sững trước nhân dân, khơi dậy lòng phục tùng, sự trung thành và nỗi khiếp sợ."
 tr_domination_imperious_architecture_worker_coop:0 "$tr_domination_imperious_architecture$"
 tr_domination_imperious_architecture_worker_coop_desc:0 "Mỗi cấp £building£ §YCông trình thủ phủ§! cung cấp §G+100§! £housing£§Y$MOD_PLANET_HOUSING_ADD$§! và §G+150§! vị trí làm việc §Y[bureaucrat.GetIcon][bureaucrat.GetName]§!."
 tr_domination_imperious_architecture_worker_coop_delayed:0 "Tất cả các tòa nhà chính phủ của đế chế vĩ đại phải là minh chứng cho thành quả lao động chung của chúng ta, vươn cao trên đám đông để khơi dậy sự đoàn kết, lòng trung thành và sự kính ngưỡng."
 tr_domination_synaptic_extensions:0 "Mở Rộng Khớp Thần Kinh"
 tr_domination_synaptic_extensions_desc:0 "£building£ §YCông trình thủ phủ§! sẽ cung cấp £housing£§Y$MOD_PLANET_HOUSING_ADD$§! và vị trí làm việc §Y[coordinator.GetIcon][coordinator.GetName]§! dựa theo cấp độ."
 tr_domination_synaptic_extensions_delayed:1 "Tầm ảnh hưởng của Não chủ phải liên tục được mở rộng. Với mạng lưới khớp thần kinh bổ sung, Não chủ có thể kiểm soát nhiều [GetIndividualNamePlural] hơn một cách hiệu quả."
 tr_domination_modular_depot:0 "Kho Chứa Mô-đun"
 tr_domination_modular_depot_desc:2 "§Y$EMPIRE_SIZE$§! tạo ra từ §YQuận§! giảm §G25%§!."
 tr_domination_modular_depot_delayed:2 "Để tối đa hóa số lượng [GetIndividualNamePlural] có thể điều động, việc bố trí công trình của chúng ta phải hiệu quả hơn. Một thiết kế dạng mô-đun sẽ giúp tăng cường đáng kể tính linh hoạt."

 tr_domination_workplace_motivators:0 "Giám Sát Công Trường"
 tr_domination_workplace_motivators_desc:3 "§YMở khóa Sắc lệnh:§! $edict_extended_shifts$"
 tr_domination_workplace_motivators_delayed:1 "Có nhiều cách để khiến những lao động chân tay làm việc hăng hái hơn. Một số cách là dùng phần thưởng, một số cách khác thì không..."
 tr_domination_drone_network:0 "Mạng Lưới Đơn Vị Con"
 tr_domination_drone_network_desc:3 "§YMở khóa Sắc lệnh:§! $edict_drone_overdrive$"
 tr_domination_drone_network_delayed:0 "Chúng ta đã cải thiện cách thức mạng lưới ý thức giao tiếp với các đơn vị con, giúp nâng cao đáng kể hiệu suất của chúng."

 tr_domination_trust_officers:0 "Cảnh Sát Tạo Tin Cậy"
 tr_domination_trust_officers_desc:3 "§YMở khóa Sắc lệnh:§! $edict_enhanced_surveillance$\n£unity£§YUnity§! tạo ra từ mỗi 100 [enforcer.GetIcon]§Y[enforcer.GetNamePlural]§!: §G+1§!"
 tr_domination_trust_officers_delayed:0 "Công việc quan trọng của các cơ quan thực thi pháp luật chỉ có thể thành công khi có sự phối hợp của người dân. Việc thành lập các đơn vị cảnh sát làm việc trực tiếp với dân chúng sẽ đảm bảo sự phối hợp chặt chẽ này."
 tr_domination_judgment_corps:0 "Quân Đoàn Phán Quyết"
 tr_domination_judgment_corps_desc:3 "§YMở khóa Sắc lệnh:§! $edict_enhanced_surveillance$"
 tr_domination_judgment_corps_delayed:1 "Dù là trong các thành phố phức tạp hay các trạm khai thác biệt lập, chúng ta đều đối mặt với những thách thức riêng trong việc ngăn chặn tội phạm. Để tăng hiệu quả thực thi pháp luật, chúng ta sẽ hợp nhất vai trò của thẩm phán, bồi thẩm đoàn và người thi hành luật."
 tr_domination_deviancy_protocols:0 "Giao Thức Chống Biến Chất"
 tr_domination_deviancy_protocols_desc:0 "Giảm §G10§! §Y$MOD_PLANET_CRIME_NO_HAPPINESS_ADD$§! trên mọi hành tinh của chúng ta."
 tr_domination_deviancy_protocols_delayed:1 "Mọi hành vi tha hóa hay biến chất đều phải bị nghiêm cấm. Với giao thức phản ứng hiệu quả này, bất kỳ [GetIndividualNamePlural] nào có dấu hiệu bất thường đều sẽ bị xử lý nhanh chóng trước khi tình hình trở nên tồi tệ hơn."
 tr_domination_divergence_supression:0 "Áp Chế Khác Biệt"
 tr_domination_divergence_supression_desc:1 "$tr_domination_deviancy_protocols_desc$"
 tr_domination_divergence_supression_delayed:0 "Đôi khi sự gắn kết của chúng ta bị tổn hại bởi những [GetIndividualName] lỗi. Khi chúng ta vươn rộng ra giữa các vì sao, sự tổn thất này càng trở nên nghiêm trọng. Bằng cách thanh trừng và tái chế những [GetGestaltEntityName] kém chất lượng này, chúng ta cho chúng cơ hội được cống hiến cho Tổ hợp bằng cái chết, một điều mà khi còn sống chúng không thể làm được."

 #tr_domination_star_lords:0 "Star Lords"
 #tr_domination_star_lords_machine:0 "Benevolence Emulation"
 #tr_domination_star_lords_hive:0 "Soporific Pheromones"
 #tr_domination_star_lords_desc:5 "Subject £opinion£ §YOpinion§! increased by §G+20§! and §YTrust Cap§! increased by §G+50§!."
 #tr_domination_star_lords_machine_desc:0 "$tr_domination_star_lords_desc$"
 #tr_domination_star_lords_hive_desc:0 "$tr_domination_star_lords_desc$"
 #tr_domination_star_lords_delayed:0 "It is our destiny to lord over those who are weaker. Obedient nations that swear fealty to our great empire may be permitted to exist... at our discretion."
 #tr_domination_star_lords_machine_delayed:0 "Programming our diplomatic AI to emulate the emotional mannerisms of other species increases their susceptibility to suggestion, even if they are aware it is a simulation."
 #tr_domination_star_lords_hive_delayed:0 "Generations of experimentation have revealed that certain combinations of gaseous emissions and pheromones greatly reduce the pugnacity and will to resist of the others. Some die, but they perish in bliss, having ever so briefly touched the beautiful purity of our mind."

