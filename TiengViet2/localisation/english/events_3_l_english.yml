l_english:

 ####################################
 # Anomaly Categories
 ####################################
 TUTORIAL_CAT:0 "Rời xa quê nhà"
 TUTORIAL_DESC:1 "Trong khi khảo sát hệ sao quê hương, chúng ta đã tìm thấy một vài thứ trên [From.GetName] có đôi chút sai lệch so với những quan sát trước đây từ hành tinh mẹ."
 TROP_BIOLOGY_CAT:0 "Chuyện lạ nhiệt đới"
 TROP_BIOLOGY_DESC:0 "Dữ liệu ban đầu thu thập từ những cánh rừng nhiệt đới trên [Root.GetName] cho thấy có điều gì đó bất thường tại đây."
 AST_MINING_CAT:0 "Lưu tâm khoáng vật"
 AST_MINING_DESC:0 "Phân tích sơ bộ về thành phần của tiểu hành tinh này đã mang lại một vài phát hiện thú vị."
 GEN_DERELICT_SHIP_CAT:0 "Tín hiệu cầu cứu"
 GEN_DERELICT_SHIP_DESC:0 "Sau khi dò quét sơ bộ, chúng ta đã phát hiện ra những tín hiệu bất thường trong tần số cứu hộ."
 GEN_LOST_CARGO_CAT:0 "Chỉ số kỳ quái"
 GEN_LOST_CARGO_DESC:0 "Trong khi quét vành đai tiểu hành tinh, đội khoa học của chúng ta đã phát hiện ra một vài thứ không bình thường."
 GEN_OLD_WAR_CAT:0 "Truy tìm thép thép"
 GEN_OLD_WAR_DESC:0 "Thành phần khoáng vật trên [Root.GetName] không hề giống với dự tính."
 GEN_SURVEY_CAT:0 "Trên bề mặt"
 GEN_SURVEY_DESC:0 "Cuộc điều tra sơ bộ của chúng ta trên [Root.GetName] cho thấy có những thứ thú vị hơn đang chờ được khám phá trên bề mặt."
 SUN_RAYS_CAT:0 "Tia vũ trụ khó hiểu"
 SUN_RAYS_DESC:0 "Chúng ta đã dò được những tia vũ trụ kỳ lạ, sĩ quan khoa học yêu cầu được tiến hành điều tra."
 WAT_PLANET_CAT:0 "Giọt nước giữa đại dương"
 WAT_PLANET_DESC:0 "Sau khi quét [Root.GetName], chúng ta đã thu được một vài chỉ số tinh vi về những thứ nằm dưới bề mặt."
 COLD_RESEARCH_CAT:0 "Phát hiện tiềm năng"
 COLD_RESEARCH_DESC:0 "Sĩ quan khoa học đã phát hiện ra một hiện tượng bất thường. Cần thực hiện dò tìm diện rộng, có lẽ sẽ có hàng loạt phát hiện mới."
 SUN_TEAPOT_CAT:0 "Quỹ đạo bất khả thi"
 SUN_TEAPOT_DESC:0 "Phát hiện một vật thể nhỏ khi quét ngôi sao này. Nó nằm trên một quỹ đạo tốc độ cao và kích thước quá nhỏ khiến máy dò khó lòng phân biệt chi tiết."
 DES_BURIED_CAT:0 "Ẩn số trong cát"
 DES_BURIED_DESC:0 "Hành tinh sa mạc [Root.GetName] dường như đang chôn giấu một vài bí mật."
 AST_GEAR_CAT:0 "Tiểu hành tinh kinh ngạc"
 AST_GEAR_DESC:0 "Chúng ta đã quan sát một lượng lớn tiểu hành tinh [Root.GetName] và có vài phát hiện...\n\nVẫn cần được điều tra thêm."
 TROP_CONDITIONS_CAT:0 "Giữa rừng già"
 TROP_CONDITIONS_DESC:0 "Có vẻ như có thứ gì đó thú vị đang ẩn giấu trong những khu rừng rậm rạp trên [Root.GetName]."
 ARID_SENSOR_CAT:0 "Nơi không bóng người"
 ARID_SENSOR_DESC:0 "Chúng ta đã phát hiện ra một thứ khác thường trên [From.GetPlanetMoon] khô cằn này. Có vẻ như đã có ai đó từng đến đây trước đó. Chi tiết cụ thể cần được điều tra thêm."
 GEN_REFUGEES_CAT:0 "Chặn thu thông tin"
 GEN_REFUGEES_DESC:0 "Chúng ta đã chặn được một tín hiệu khi đang quét [Root.GetName]. Sau khi phân tích mô hình, sơ bộ phán đoán là tín hiệu cầu cứu phát ra từ một con tàu, cần truy vết nguồn gốc để biết thêm thông tin."
 CON_BIOLOGY_CAT:0 "Phát hiện trên lục địa"
 CON_BIOLOGY_DESC:0 "Những khu rừng trên hành tinh nhỏ bé này hứa hẹn những phát hiện thú vị."
 TOX_PLANET_CAT:0 "Độc tính"
 TOX_PLANET_DESC:0 "Trên hành tinh này có những kiến trúc nhân tạo, cho thấy nơi đây từng có một đoạn lịch sử đã mất."
 DES_PLANET_CAT:0 "Sa mạc hoang vu"
 DES_PLANET_DESC:0 "Nhiệt độ cao trên [Root.GetName] vẫn nằm trong tầm dự tính. Tuy nhiên, đội ngũ của chúng ta còn thu thập được rất nhiều dữ liệu phản thường. Cần nghiên cứu sâu hơn trước khi hoàn tất báo cáo cuối cùng."
 MOL_PLANET_CAT:0 "Điểm nóng chảy"
 MOL_PLANET_DESC:0 "Những ngọn lửa hung hãn trên [Root.GetName] gần như làm tê liệt máy dò, nhưng chúng ta vẫn thu thập được một vài dữ liệu khác thường."
 GEN_MYSTICAL_CAT:0 "Bí ẩn"
 GEN_MYSTICAL_DESC:0 "Đội ngũ khoa học của chúng ta đã điều tra được một vài \"bí ẩn\". Cần có thêm chi tiết về hiện tượng này mới có thể thực sự giải mã được nó."
 NUKE_PLANET_CAT:0 "Mùa đông tận thế"
 NUKE_PLANET_DESC:0 "Vùng đất chết chóc do hạt nhân này là minh chứng cho nền văn minh đã lụi tàn tại đây. Chúng ta nên điều tra thêm những địa điểm mà máy dò phát hiện có dấu hiệu hoạt động."
 ARID_PLANET_CAT:0 "Vùng hoang dã khô cằn"
 ARID_PLANET_DESC:0 "[From.GetPlanetMoon] không phải là nơi có khí hậu dễ chịu, nhưng nếu kết quả dò tìm ban đầu không sai, nó có thể chứa một vài tài nguyên quý giá."

 ####################################
 # Anomaly Events
 ####################################
 anomaly.4000.name:0 "Đạo của sự sống"
 anomaly.4000.desc:0 "Một vài loài thực vật trên [From.GetName] đã tiến hóa ra một bộ biện pháp tự vệ hiệu quả thông qua chọn lọc tự nhiên. Nhiều loài cây và nấm sẽ giải phóng bào tử, những bào tử này có tính axit cực mạnh đối với các dạng sống không phải thực vật. Thật may, sĩ quan khoa học [Root.GetLeaderName] đã tìm ra phương pháp trung hòa một số bào tử, khiến rừng già trên hành tinh này bớt nguy hiểm hơn!"
 anomaly.4000.a.tooltip:2 "£blocker£ Đầm lầy kịch độc §R+2§!"
 anomaly.4005.name:1 "Mảnh vỡ sự sống"
 anomaly.4005.desc:1 "Có vẻ như tiểu hành tinh [From.GetName] và các mảnh vỡ xung quanh nó bắt nguồn từ một hành tinh đã tiêu vong!\n\nTại lõi tiểu hành tinh, chúng ta có thể tìm thấy dấu vết của các hợp kim cực kỳ giá trị. Đồng thời, nơi đây còn tìm thấy dấu hiệu hoạt động của các vi khuẩn đã chết trong chân không. Tất cả những điều này cho thấy thiên thể này từng nuôi dưỡng sự sống."
 anomaly.4005.a.tooltip:2 "Thêm §YHành tinh xưa kia§! vào [From.GetName]:\n£alloys£ §G+3§!"
 anomaly.4010.name:0 "Lạc lối trong không gian"
 anomaly.4010.desc:0 "Tín hiệu chúng ta nhận được đến từ một con tàu đang quay quanh [From.GetName]. Con tàu này hiện không có bất kỳ dấu hiệu nhiệt nào, dường như đang trôi dạt. Chúng ta đã thiết lập một §SDự án đặc biệt§! để điều tra chuyện gì đã xảy ra với thủy thủ đoàn."
 anomaly.4011.desc:0 "Toàn bộ thủy thủ trên tàu đã thiệt mạng. Đáng lo ngại hơn là họ dường như bị giết bởi một loại ký sinh trùng não cực kỳ phát triển. chúng ký sinh trong não thủy thủ và khiến họ phát điên. Nhờ sĩ quan khoa học [Root.GetLeaderName] phát hiện kịp thời, thủy thủ đoàn của chúng ta mới không bị lây nhiễm."
 anomaly.4011.b.evopred: "Gửi những thi thể này về [Owner.Capital.GetName]"
 anomaly.4012.desc:0 "Con tàu đang quay quanh [From.From.From.GetName] không hề bị bỏ hoang. Thủy thủ trên đó vẫn còn sống nhưng tình trạng không tốt. Họ bị ảnh hưởng bởi một loại ký sinh trùng não. Các nhà khoa học của chúng ta có thể dễ dàng chữa trị cho họ."
 anomaly.4012.a:0 "Giúp đỡ họ."
 anomaly.4012.a.tooltip:0 "Thiết lập liên lạc với người ngoài hành tinh."
 anomaly.4012.b:0 "Mặc kệ họ tự sinh tự diệt."
 anomaly.4015.name:0 "Nơi an nghỉ cuối cùng"
 anomaly.4015.desc:0 "Dù chẳng khác nào mò kim đáy bể, [Root.GetName] đã xác định chính xác nguồn gốc của tín hiệu kỳ lạ xuyên qua vành đai tiểu hành tinh. Tín hiệu đến từ một vật thể nhỏ của người ngoài hành tinh. Quét sơ bộ cho thấy đó là một loại bình chứa nghi lễ, bên trong đựng di hài của một phi hành gia ngoại tộc."
 anomaly.4015.a:0 "Hãy để quan tài đó tiếp tục hành trình của nó."
 anomaly.4015.b:0 "Mở quan tài, nghiên cứu thi thể."
 anomaly.4015.b.evopred: "Có rất nhiều điều đáng học hỏi. Mở kén cứu sinh."
 anomaly.4015.phile:0 "Mang nó về [Root.Owner.Capital.GetName], trưng bày trong bảo tàng."
 anomaly.4016.name:0 "[DefiledCountry.GetName]"
 anomaly.4016.desc:0 "Đã vài ngày trôi qua kể từ lần đầu chúng ta tiếp xúc với [DefiledCountry.GetSpeciesNamePlural], giờ đây họ gửi tới một thông điệp:\n\n“Chúng tôi biết các người đã làm gì, [Root.GetSpeciesNamePlural]. Chiếc quan tài mà các người đã mở ra là nơi an nghỉ cuối cùng của phi hành gia liên sao đầu tiên của chúng tôi. Chúng tôi yêu cầu các người phải xin lỗi!”"
 anomaly.4016.tooltip:0 "Quan hệ giữa đôi bên sẽ bị ảnh hưởng."
 anomaly.4016.a:0 "Xin lỗi vì sự xúc phạm này."
 anomaly.4016.b:0 "Đó chỉ là một cái xác thôi mà."
 anomaly.4016.c.spirit:0 "Chúng tôi sẽ cầu nguyện cho linh hồn tổ tiên các bạn."
 anomaly.4016.d.phobe:0 "Lũ tạp chủng ngoại tộc, chúng ta chẳng quan tâm!"
 anomaly.4020.name:0 "Nơi hạm đội khổng lồ gục ngã"
 anomaly.4020.desc:0 "Thông qua quét kỹ lưỡng, chúng ta đã tìm ra nguyên nhân của thành phần khoáng vật kỳ lạ trên [From.GetName]. [From.GetPlanetMoon] là nơi rơi của hàng chục con tàu vũ trụ khổng lồ, thân tàu của chúng lớn vượt xa trí tưởng tượng của chúng ta. Thời điểm chúng được chế tạo có thể truy ngược về hàng triệu năm trước."
 anomaly.4020.rocket.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] đã phát hiện ra nguồn gốc của những chỉ số khoáng vật kỳ lạ đó. [From.GetName] là nghĩa địa của những con tàu vũ trụ khổng lồ, những xác tàu tại đây đã ngủ yên suốt hàng triệu năm. [Root.GetLeaderName] còn nói: “Thật đáng tiếc, những bộ đẩy này hư hỏng quá nặng, dù có kiểm tra kỹ cũng chẳng thu được kết quả gì.”"
 anomaly.4020.rocket.desc.mach:0 "Chúng ta phát hiện những chỉ số khoáng vật kỳ lạ đó bắt nguồn từ một số xác tàu vũ trụ không rõ số lượng, cực kỳ to lớn và có kỹ thuật tiên tiến. Tình trạng rỉ sét của các bộ phận phi thuyền cho thấy mảnh vỡ này được tạo ra vào khoảng 2.380.669 năm trước. Đơn vị nghiên cứu tại hiện trường đã cố gắng đảo ngược kỹ thuật các bộ đẩy của những con tàu này, nhưng đã thất bại do chúng hư hỏng quá nặng."
 anomaly.4020.a:0 "Những vật liệu này sẽ có ích."
 anomaly.4020.b:0 "Ít nhất thì số vật liệu này vẫn còn dùng được."
 anomaly.4020.a.tooltip:3 "Thêm §Y$ship_graveyard$§! vào [From.GetName]:\n£alloys£ §G+2§!"
 anomaly.4025.name:0 "Nhà thám hiểm già"
 anomaly.4025.desc:0 "Đội ngũ khoa học của [Root.GetName] đã tìm thấy một tấm kim loại lạc lõng tại một nơi hẻo lánh trên [From.GetName].\n\nTrên đó có những thông tin cơ bản về một hệ sao xa xôi, kèm theo hình minh họa và một thứ tương tự bảng tuần hoàn các nguyên tố. Sĩ quan khoa học [Root.GetLeaderName] đã thành công sử dụng những thông tin này để suy đoán vị trí hệ sao đó, cũng như các tài nguyên tiềm năng bên trong."
 anomaly.4025.a.tooltip:0 "Nhận được §Ydữ liệu khảo sát§! của hệ sao xa xôi."
 anomaly.4030.name:0 "Nô bộc của cát"
 anomaly.4030.desc:0 "Dưới những cồn cát của [From.GetName], đội khoa học của chúng ta đã tìm thấy một hạm đội máy bay chiến đấu gặp nạn. Dù đã rất cổ xưa nhưng chúng vẫn được bảo quản hoàn hảo. Chúng đã bị bỏ rơi từ lâu, nhưng động cơ và các bộ phận chiếu sáng dường như vẫn còn hoạt động. Nguyên nhân chúng gặp nạn hiện vẫn chưa rõ. Chúng ta đã tìm thấy trí tuệ nhân tạo của hạm đội trên cầu tàu của soái hạm, nó có thể chỉ huy những con tàu này trong chiến đấu và vẫn đang hoạt động. Khi chúng ta tiếp cận, nó đã vang lên cảnh báo. Nó sẽ tự động kích hoạt khi có kẻ xâm nhập tiến lại gần.\nChúng ta có thể thực hiện một §SDự án đặc biệt§! để thu hồi trí tuệ nhân tạo này trước khi nó phát điên. Chúng ta cũng có thể phá hủy nó để tránh rủi ro chưa biết."
 anomaly.4030.a:0 "Thử kiểm soát trí tuệ nhân tạo này."
 anomaly.4030.b:0 "Phá hủy nó trước khi nó kịp làm điều gì nguy hiểm."
 anomaly.4030.b.tooltip:1 "Phá hủy trí tuệ nhân tạo này.\n\nThêm hiệu ứng §YHạm đội AI gặp nạn§! vào [From.GetName]:\n£engineering£§G+2§!"
 anomaly.4031.desc:0 "Tạ ơn trời đất, chúng ta đã thành công lập trình lại cho trí tuệ nhân tạo trước khi nó tấn công chúng ta. Hiện tại nó đã có thể làm việc như một soái hạm trong hạm đội của chúng ta, và nếu muốn, nó cũng có thể trở thành một chỉ huy. Trí tuệ nhân tạo này đã được chuyển vận về hành tinh mẹ, chờ đợi được bổ nhiệm."
 anomaly.4035.name:0 "Lửa trong lò"
 anomaly.4035.desc:0 "Chúng ta đã phát hiện ra thứ gì đó thú vị trên [From.GetName], tuy nhiên không liên quan mấy đến bản thân [From.GetPlanetMoon]. Khi chúng ta đang tiến hành thử nghiệm như thường lệ, đột nhiên bắt được dữ liệu kỳ lạ truyền ra từ một ngôi sao trong hệ sao xa xôi. Bức xạ của ngôi sao đó cho thấy, nó có thể khiến các nguyên tử beryli xảy ra phản ứng hợp hạch mà không cần hiện tượng vỡ vụn hạt nhân, điều này về cơ bản là bất khả thi!\n\nĐội ngũ khoa học đã nóng lòng muốn đi tìm hiểu thực hư, và họ đã thu hẹp phạm vi xuống còn hai hệ sao không quá xa.\nKiểm tra §SNhật ký tình báo§! để biết chi tiết." #Source: http://www.forbes.com/sites/ethansiegel/2015/07/01/the-only-three-heavy-elements-in-the-universe-that-arent-made-in-stars/
 anomaly.4035.a:0 "Điều này có thể mang lại thu hoạch dồi dào."
 anomaly.4035.poi_1:0 "Ngôi sao tiềm năng thứ nhất"
 anomaly.4035.poi_2:0 "Ngôi sao tiềm năng thứ hai"
 anomaly.4035.poi.desc:0 "Một trong những hệ sao này có thể chứa ngôi sao phát ra bức xạ kỳ lạ đó."
 anomaly.4037.name:0 "Hệ sao chính xác"
 anomaly.4037.desc:0 "Chúng ta đã tìm thấy hệ sao chính xác! Dữ liệu bức xạ của ngôi sao này hoàn toàn khớp với những gì gặp trước đó. Chúng ta đã thiết lập một §SDự án đặc biệt§! để tiến hành nghiên cứu ngôi sao này."
 anomaly.4038.base.desc:0 "Đã hiểu rồi! Sĩ quan khoa học [Root.GetLeaderName] phát hiện ngôi sao này hình thành quanh một lỗ sâu nhỏ. Lỗ sâu đã xé toạc một vết nứt chiều không gian, khiến các tia từ chiều không gian khác thay thế tia vũ trụ, làm cho hiện tượng vỡ vụn các nguyên tố không thể xảy ra. Bức xạ siêu tân tinh dẫn đến việc beryli-8 hình thành trong ngôi sao này phân rã thành các nguyên tố ổn định hơn, do đó phản ứng hợp hạch hạt nhân diễn ra bên trong ngôi sao này vô cùng đặc biệt."
 anomaly.4038.maxed.desc:0 "$anomaly.4038.base.desc$\n\nNhững kiến thức này không làm thăng tiến các công nghệ hiện có của chúng ta. Tuy nhiên, nó cho chúng ta biết thêm nhiều thông tin về nguyên lý vận hành của vũ trụ."
 anomaly.4038.upg.desc:0 "$anomaly.4038.base.desc$\n\nNhờ vào phát hiện này, các nhà khoa học của chúng ta hiện đã có thể nghiên cứu những công nghệ mới!"
 anomaly.4038.a:0 "Chúng ta đã nắm giữ bí mật của các ngôi sao."
 anomaly.4038.b:0 "Chúng ta đang dần vén bức màn bí ẩn của vũ trụ."
 anomaly.4040.name:0 "Tội lỗi của ngôi sao"
 anomaly.4040.desc:0 "Cường độ bức xạ ion trên [From.GetName] đã vượt ngưỡng. Có vẻ như [From.GetPlanetMoon] gần đây đã bị oanh tạc bởi đầu đạn hạt nhân, hoặc đã bị phơi nhiễm trước các luồng tia hội tụ có thể phát ra từ siêu tân tinh gần đó. Về việc liệu trường hợp sau có thể gây ra hiệu ứng này hay không, sĩ quan khoa học [Root.GetLeaderName] hoàn toàn không có manh mối."
 anomaly.4040.a.tooltip:1 "Thêm hiệu ứng §RVùng hoang phế phóng xạ§! vào [From.GetName]:\n£blocker£ Vùng hoang phế phóng xạ §R+6§!\n$mod_planet_jobs_physics_research_produces_mult$：§G+10%§!"
 anomaly.4045.name:0 "Tiếng vọng từ vực thẳm"
 anomaly.4045.desc:0 "Sau khi nghiên cứu tỉ mỉ, các thành viên của [Root.GetName] đã phát hiện ra một tiếng vọng \"yếu ớt\" đang truyền đến từ sâu dưới lòng đất [From.GetName].\n\nTiếng vọng này có phần giống như do sinh vật sống phát ra. Thế nhưng khoảng cách của chúng ta với nó quá xa, rất khó phân biệt nó là thật, hay chỉ là một thiết bị phát ra tín hiệu ngẫu nhiên. Cấp dưới của sĩ quan khoa học [Root.GetLeaderName] liên tục phàn nàn rằng mình không được nghỉ ngơi hợp lý, thời gian làm việc lại quá dài, họ không thể chịu đựng thêm được nữa."
 anomaly.4045.a:0 "Hiệu chỉnh máy dò, quan sát kỹ lõi hành tinh lần nữa!"
 anomaly.4045.b:0 "“Chúng ta không thể tin những thủy thủ này. Chúng ta cần một cuộc khảo sát thực địa!”"
 anomaly.4045.c:0 "Sức khỏe của thủy thủ là ưu tiên hàng đầu."
 anomaly.4045.d:0 "Trước khi làm rõ mọi chuyện, chúng ta tuyệt đối không thể dừng lại!"
 anomaly.4046.desc:0 "Dù mọi người đều đã kiệt sức, nhưng sau khi điều chỉnh máy dò của tàu, thủy thủ đoàn [Root.GetName] và sĩ quan khoa học [Root.GetLeaderName] đã có một phát hiện kinh ngạc. Gần lõi của [From.From.GetName], có một loại sinh vật tương tự như phù du. chúng phân bố khắp [From.From.GetPlanetMoon], có ý thức chung và năng lực tâm linh mạnh mẽ.\n\nLoại sinh vật này có thể tồn tại dưới áp suất và nhiệt độ cực cao, thậm chí có thể sinh sôi với tốc độ cực nhanh. Nó trông như đang ngủ đông... hoặc đang lẩn tránh thứ gì đó, cứ như thể nó biết mình đang bị quan sát vậy.\n\nĐối với sinh vật to lớn và sở hữu nhiều ưu thế như vậy, về lý thuyết nó là bất tử. Tuy nhiên, nó có vẻ sẽ không cản trở việc chúng ta thuộc địa hóa [From.From.GetPlanetMoon]. Nhưng nó có thể gây ra một vài ảnh hưởng tiêu cực cho cư dân trên đó."
 anomaly.4046.a:0 "Chúng ta nên thử tiếp xúc với nó."
 anomaly.4046.b:0 "Chúng ta có thể đầu độc đại dương và giết chết nó."
 anomaly.4046.c:0 "Tốt nhất là đừng đụng vào nó."
 anomaly.4046.c.tooltip:1 "§YĐế chế của bạn§! nhận hiệu ứng §RTruyền thông tiêu cực§!.\n\nThêm hiệu ứng §RMôi trường khắc nghiệt§! vào [From.From.GetName].\n\nThêm hiệu ứng §YCổ vật viễn cổ§! vào [From.From.GetName]:\n£society£ §G+4§!"
 anomaly.4047.desc:0 "Sau nhiều lần cố gắng tiếp xúc mà không có kết quả, đội ngũ của chúng ta quyết định thử liên lạc bằng sóng âm. Sóng âm khiến sinh vật đó có phản ứng dữ dội, tất cả các thành viên trong đội đều quỳ rạp xuống, rơi vào những ảo ảnh sống động như thật.\n\nĐây dường như là phương thức giao tiếp chính của sinh vật này. Nó mô tả hành tinh mẹ của nó, nó lặng lẽ nằm gần lõi sao, tắm mình trong sự ấm áp của [From.From.From.GetPlanetMoon], sinh sôi trong bóng tối. Sau đó nó cho chúng ta thấy nhân dân của chúng ta đứng trên bề mặt, sinh sôi nảy nở dưới ánh mặt trời."
 anomaly.4047.a:0 "Chúng tôi rất vui lòng chấp nhận lời mời này."
 anomaly.4047.a.tooltip:1 "§YĐế chế của bạn§! nhận hiệu ứng §RTruyền thông tiêu cực§!.\n\nThêm hiệu ứng §YCổ vật viễn cổ§! vào [From.From.From.GetName]:\n£society£ §G+4§!"
 anomaly.4048.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] đã nhanh chóng tổng hợp ra một loại thuốc độc, nó sẽ gây ra phản ứng dữ dội với cấu trúc bên trong của sinh vật này, lan rộng như cháy rừng.\n\nSau khi giải phóng thuốc độc, các thủy thủ rơi vào nỗi sợ hãi tột độ. Họ đã chứng kiến một sự kiện chưa từng có tiền lệ. Nhiệt độ lõi của [From.From.From.GetName] tăng vọt, khiến cả đại dương sôi sùng sục. Thân xác khổng lồ của sinh vật đó cũng bắt đầu giải phóng độc tố vào khí quyển. Thứ giống như phù du này chắc chắn là cực kỳ quan trọng đối với cái lõi không ổn định của [From.From.From.GetPlanetMoon]. Loại độc tố này có lẽ cũng là một cơ chế tự vệ mà nó có được trong quá trình tiến hóa.\n\n[From.From.From.GetPlanetMoon] đã đầy rẫy kịch độc chỉ trong vài giờ."
 anomaly.4048.a:0 "……"
 anomaly.4048.a.tooltip:1 "§YĐế chế của bạn§! nhận hiệu ứng §RTruyền thông tiêu cực§!\n\n§YLoại hành tinh§! của [From.From.From.GetName] trở thành §RKịch độc§!.\n\nThêm hiệu ứng §RMôi trường khắc nghiệt§! vào [From.From.From.GetName].\n\nThêm tài nguyên trên [From.From.From.GetName]:\n£society£ §G+4§!"
 anomaly.4049.desc:1 "Do nghi ngờ các thủy thủ này muốn che giấu điều gì đó, sĩ quan khoa học [Root.GetLeaderName] đã quyết định thực hiện một cuộc thám hiểm đơn thương độc mã không được phê duyệt để kiểm tra kỹ lõi hành tinh. Camera của tàu ngầm truyền về đoạn băng ghi lại diễn biến sự việc:\n\nTiến sâu vào đại dương của [From.From.GetName], nơi đó chỉ có bóng tối. Thế nhưng, còn có một vài thứ... đang sống. Gần lõi ấm áp của [From.From.GetPlanetMoon] có một số hang động dưới biển sâu. Bên trong hang động có thảm thực vật dạng lưới, tương tự như phù du, quấn quanh toàn bộ lớp vỏ của [From.From.GetPlanetMoon].\n\nTrong khi điều tra phù du, [Root.GetLeaderName] đột nhiên lên cơn co giật, vài giờ sau mới tỉnh lại.\n\nTrở lại [Root.GetName], sĩ quan khoa học thần chí bất minh, luôn miệng nói về những điều kinh hoàng và ảo cảnh tà ác."
 anomaly.4049.a:0 "Có lẽ sĩ quan khoa học chỉ quá mệt mỏi thôi."
 anomaly.4049.a.tooltip:0 "Sĩ quan khoa học [Root.GetLeaderName] nhận đặc điểm §R$leader_trait_maniacal$§!."
 anomaly.4049.b:0 "Sĩ quan khoa học phát điên rồi. Bắt ông ta lại!"
 anomaly.4049.b.tooltip:0 "Sĩ quan khoa học [Root.GetLeaderName] bị đình chỉ công tác vĩnh viễn."
 anomaly.4050.desc:0 "Một tuần sau sự cố tại [From.From.From.GetName] đó, các thủy thủ của [Root.GetName] đã bị đánh thức bởi một tiếng la hét thất thanh. Sĩ quan khoa học [Root.GetLeaderName] la hét, chạy loạn xạ trên tàu, nói rằng mình cảm thấy vô cùng đau đớn.\n\nSau khi các thủy thủ đưa ông ta đến phòng y tế tiêm một lượng lớn thuốc an thần và kiểm tra kỹ lưỡng, họ xác nhận não bộ của [Root.GetLeaderName] đã có sự thay đổi.\n\nKiểm tra chi tiết cuối cùng phát hiện vị lãnh đạo này hiện đã sở hữu năng lực thần giao cách cảm, có thể giao tiếp với người khác thông qua tinh thần. [Root.GetLeaderName] sau khi nghỉ ngơi sẽ bình phục."
 anomaly.4050.a:0 "Chào mừng trở lại đội ngũ."
 anomaly.4050.b:0 "Hãy tự kiềm chế đi, sĩ quan khoa học. Nếu không đừng trách mọi người không khách khí."
 anomaly.4050.a.tooltip:0 "Sĩ quan khoa học [Root.GetLeaderName] nhận được đặc điểm §GTinh thông tâm linh§! và §GTinh thông ngoại tộc§!."
 anomaly.4051.desc:0 "Thủy thủ đoàn [Root.GetName] đã kết thúc nghiên cứu về [From.From.GetName], cuối cùng cũng có thể nghỉ ngơi chỉnh đốn. Đáng tiếc là họ không có thu hoạch gì lớn, nhưng việc họ được đối đãi tốt đã nhanh chóng lan truyền, nhận được nhiều lời khen ngợi tại hành tinh mẹ. Việc nghỉ ngơi đầy đủ đảm bảo các thủy thủ có thể đạt được kết quả tốt hơn trong tương lai."
 anomaly.4051.a.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §GTruyền thông tích cực§! và §GSĩ quan khoa học nghỉ ngơi đầy đủ§!."
 anomaly.4051.b.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §GTruyền thông tích cực§! và §GSĩ quan khoa học nghỉ ngơi đầy đủ§!.\n\nBạn mở khóa sắc lệnh đế quốc §Y$edict_improved_work_environment$§!."
 anomaly.4051.a:0 "Sự bình an của thủy thủ là phần thưởng lớn nhất."
 anomaly.4051.b:0 "Đây là một trong những cách để nâng cao hiệu quả."
 anomaly.4052.desc:0 "Sau nhiều ngày đêm nghiên cứu nguồn gốc của tiếng vọng, [Root.GetName] đã phát hiện ra một loại sinh vật sống dưới mặt đất [From.From.GetName]. Trước đó không phát hiện ra là vì nó sống ở nơi rất gần lõi của [From.From.GetPlanetMoon], điều này khiến hệ thống phân tích của chúng ta hoàn toàn vô dụng đối với nó.\n\nThông qua quét chúng ta phát hiện nó là loài động vật chân đốt biển vẫn đang ở giai đoạn tiến hóa sớm, nhưng điều thần kỳ nhất là nó lại có thể cải tạo vật chất sinh vật đã chết thành hậu duệ của chính mình.\n\nThông tin này rất có ích cho các nhà khoa học của chúng ta phát triển các loại thuốc mới! Tuy nhiên, cách chúng ta đối xử với nhân viên của mình chắc chắn sẽ lan truyền ra ngoài, gây ra ảnh hưởng xấu."
 anomaly.4052.a.tooltip:3 "§YĐế chế của bạn§! nhận được hiệu ứng §GĐổi mới dược phẩm§! và §RTruyền thông tiêu cực§!."
 anomaly.4055.name:0 "Ngọc thô trong vàng"
 anomaly.4055.desc:0 "Sau khi kết thúc nghiên cứu về [From.GetName], sĩ quan khoa học [Root.GetLeaderName] báo cáo rằng họ phát hiện hành tinh này đầy rẫy khoáng vật. Phát hiện này chủ yếu nhờ vào các thủy thủ của [Root.GetName]. [Root.GetLeaderName] hết lời khen ngợi người tập sự này."
 anomaly.4055.a:0 "Thăng chức cho người tập sự này thành sĩ quan khoa học."
 anomaly.4055.a.tooltip:0 "Nhận được một §GSĩ quan khoa học§! mới.\n\n$anomaly.4055.base.tooltip$"
 anomaly.4055.b:0 "Họ đang làm rất tốt ở vị trí hiện tại."
 anomaly.4055.b.tooltip:2 "\n$anomaly.4055.base.tooltip$"
 anomaly.4055.base.tooltip:2 "Thêm tài nguyên trên [From.From.GetName]:\n£minerals£ §G+6§!"
 anomaly.4060.name:0 "Nan đề xác suất"
 anomaly.4060.desc:0 "Chúng ta nhận được báo cáo từ sĩ quan khoa học [Root.GetLeaderName]. Nghe nói có một... bình chứa bằng gốm đang quay quanh ngôi sao của [From.GetName]. Thật kỳ lạ.\n\nThứ này không nên xuất hiện ở đó, tuy nhiên bất luận thế nào nó thực sự đang ở trên quỹ đạo tầm thấp.\n\nCó thể ban bố §SDự án đặc biệt§! để nghiên cứu chiếc bình này và tìm ra nguyên nhân nó xuất hiện ở đó."
 anomaly.4060.a:0 "Một nan đề đáng để nghiên cứu."
 anomaly.4060.b:0 "Không phải mọi câu hỏi đều cần có câu trả lời."
 anomaly.4060.spirit.b:0 "Đây hẳn là thần linh hiển thánh."
 anomaly.4061.desc:0 "Chúng ta đã dốc hết sức cố gắng tìm ra nguyên nhân chiếc bình gốm này xuất hiện trên quỹ đạo ngôi sao. Có lẽ đây là ảo giác tập thể của chúng ta? Có lẽ nó vốn không tồn tại? Ngay cả những khả năng này chúng ta cũng đã tính toán qua. Nhưng chẳng thu được gì. Chúng ta đã cố gắng hết sức.\n\nLợi ích duy nhất là khi chúng ta không thể chịu đựng nổi việc điều tra thứ này nữa, chúng ta có thể từ từ nghiên cứu các vấn đề triết học và kinh tế."
 anomaly.4061.desc.mach:0 "Chúng ta đã dốc hết sức cố gắng tìm ra nguyên nhân chiếc bình gốm này xuất hiện trên quỹ đạo đại không. Có lẽ tất cả chúng ta đã bị lỗi? Có lẽ nó vốn không tồn tại? <<Lỗi!>> Ngay cả những khả năng này chúng ta cũng đã tính toán qua. <<Lỗi!>>\nChuyện này đến đây là chấm dứt. Chúng ta đã cố gắng hết sức.\n\nMột lợi ích của cuộc điều tra này là, khi chúng ta không thể dung thứ việc tiếp tục điều tra chiếc bình phi logic đó, chúng ta có thể dành một lượng lớn thời gian cho các vấn đề lý luận và kinh tế."
 anomaly.4061.a:0 "Tại sao? Tại sao!? TẠI SAO!?"
 anomaly.4061.a.mach:0 "Các vi mạch của tôi đang đau nhức."
 anomaly.4061.a.tooltip:0 "Chấp nhận sự thật rằng những nỗ lực giải quyết các vấn đề cuộc sống thường là công dã tràng.\n\n"
 anomaly.4061.a.tooltip.mach:0 "Chấp nhận sự vô nghĩa của sự tồn tại.\n\n"
 anomaly.4062.base:0 "Khi gần như muốn từ bỏ việc tiếp tục nghiên cứu vật thể gốm đáng ghét này, cuối cùng chúng ta đã đạt được đột phá!"
 anomaly.4062.desc.mach:0 "Sau khi dành một lượng lớn thời gian nghiên cứu vật thể gốm đó nhưng không đạt được tiến triển rõ rệt, đơn vị khoa học của chúng ta cuối cùng đã có đột phá. Vật thể đó vốn không tồn tại trong không gian ba chiều mà [Root.Owner.GetSpeciesNamePlural] chúng ta biết, mà là một hình chiếu đến từ chiều không gian cao hơn.\n\nPhân tích hình bóng của vật thể bốn chiều này giúp chúng ta tích lũy đủ dữ liệu để giải mã thông tin của nó. Vật thể đó dạy chúng ta cách đạt được tiến bộ trong mọi lĩnh vực nghiên cứu khoa học.\n\nGiờ đây chỉ còn lại một câu hỏi: Ai, hoặc thứ gì đã gửi thông điệp này?"
 anomaly.4062.desc:0 "$anomaly.4062.base$ Vật thể đó không thực sự hiện hữu ở đó, mà được chiếu xuống từ chiều không gian cấp cao hơn. Phân tích phát hiện ra rằng, đó là cái bóng của một vật thể bốn chiều, chúng ta đã tích lũy đủ dữ liệu để giải mã thông tin của nó. Vật thể đó có thể cải thiện nhận thức của chúng ta đối với mọi lĩnh vực nghiên cứu.\n\nGiờ đây câu hỏi duy nhất là... rốt cuộc là ai đã gửi tới luồng thông điệp này?"
 anomaly.4062.spirit.desc:0 "$anomaly.4062.base$ Chiếc bình đó là một thánh tích thần thánh, chắc chắn là một tín hiệu do thần linh để lại trên quỹ đạo!\n\nVật thể đó đang tỏa ra năng lượng, sau khi giải mã cuối cùng đã hiển thị thông tin ẩn giấu: đó là thông tin có thể cải thiện khả năng nghiên cứu của chúng ta để giúp chúng ta sớm ngày thăng thiên!\n\nGiờ đây câu hỏi duy nhất là... rốt cuộc là ai đã gửi tới luồng thông điệp này?"
 anomaly.4062.spirit.a:0 "Tạ ơn các đấng tối cao!"
 anomaly.4065.name:0 "Máy khai thác lộ thiên"
 anomaly.4065.desc:0 "Dưới bề mặt tiểu hành tinh khổng lồ [From.GetName], chúng ta đã phát hiện ra một thứ khiến người ta phải trầm trồ. Có một thiết bị khai thác mỏ được đặt trên khối đá, đào sâu mãi đến tận lõi của tiểu hành tinh! Xem tình hình thì nó đã bị bỏ rơi, không có bất kỳ dấu vết nào cho thấy ai đã để lại.\n\nNếu chúng ta có thể dừng bộ máy này lại, có lẽ chúng ta sẽ học hỏi được công nghệ chế tạo ra nó, nhưng nhất định phải tranh thủ lúc sớm, kẻo nó bị các mảnh vụn đá ép nát."
 anomaly.4065.a:0 "Thử dừng máy lại."
 anomaly.4066.upg.desc:0 "Chúng ta đã thành công ngăn chặn máy đào trước khi nó bị hư hại. Thật là một bộ máy thần kỳ, lớp bề mặt nhẵn thín của nó hoàn toàn được bao phủ bởi kim cương. Thoạt nhìn, nó dường như là một khối thống nhất, nhưng thực ra chỉ là do tay nghề quá tinh xảo, khiến người ta khó lòng phát hiện ra các mối nối.\n\nCác kỹ sư của chúng ta có thể tiến hành đảo ngược kỹ thuật đối với một số công nghệ của nó."
 anomaly.4066.res.desc:0 "Chúng ta đã thành công ngăn chặn máy đào trước khi nó bị hư hại. Đáng tiếc là nó thực ra rất giống với thiết kế hiện tại của chúng ta, không có gì đáng để học hỏi. Tuy nhiên cái hố mà nó đào ra có thể giúp chúng ta dễ dàng tìm thấy các khoáng vật quý giá hơn."
 anomaly.4066.b.tooltip:1 "Thêm tài nguyên trên [From.From.From.GetName]:\n£minerals£ §G+3§!"
 anomaly.4070.name:0 "Thu hoạch phong phú"
 anomaly.4070.desc:0 "Tin tốt! Chúng ta phát hiện trong rừng rậm nhiệt đới của [From.GetName] có mọc một loại cây đặc biệt, quả của nó rất giàu dinh dưỡng. Loại thức ăn này chứa đựng năng lượng kinh ngạc cùng toàn bộ dưỡng chất mà nhân dân chúng ta cần. Điều này chắc chắn có ích cho việc giảm bớt áp lực khi chúng ta thuộc địa hóa nơi này."
 anomaly.4070.a:0 "Đúng là tin tốt!"
 anomaly.4075.name:0 "Thân hình nhỏ, sức mạnh lớn"
 anomaly.4075.desc:0 "Sau khi khảo sát mặt đất đóng băng của [From.GetPlanetMoon][From.GetName], chúng ta đã thu được phát hiện quan trọng. Sĩ quan khoa học [Root.GetLeaderName] báo cáo rằng, đã phát hiện ra một loại sinh vật vi khuẩn độc nhất vô nhị. Nó sẽ kết nối với các cá thể khác để tạo thành một \"tấm thảm\" khổng lồ, loại thảm này vừa nhẹ vừa bền, lại có thể dùng làm pin mặt trời. Chúng có thể chuyển hóa năng lượng mặt trời hấp thụ được một cách cực kỳ hiệu quả — dường như là để hấp thụ nhiều nhiệt năng nhất có thể trong môi trường này mà tiến hóa ra.\n\nCác nhà nghiên cứu của chúng ta nhất định có thể khai quật được thứ hữu dụng từ những tình báo như vậy."
 anomaly.4075.a:0 "Phân tích xem liệu nó có thể cải thiện sản xuất năng lượng hay không."
 anomaly.4075.b:0 "Cố gắng tìm kiếm công dụng quân sự."
 anomaly.4075.a.tooltip:0 "Gửi về hành tinh mẹ để nghiên cứu. Cần một khoảng thời gian mới có kết quả."
 anomaly.4076.desc:0 "Nhà nghiên cứu phát triển năng lượng của chúng ta đã có tiến triển từ mẫu vật [From.From.GetName] mà chúng ta gửi về! Họ sử dụng sinh vật đó làm nguyên mẫu, đã thành công phát triển một loại pin mặt trời mới. Loại pin này có thể lưu trữ năng lượng hiệu quả hơn và nâng cao hiệu suất của tất cả các trạm phát điện của chúng ta."
 anomaly.4077.desc:0 "Nhà nghiên cứu phát triển quân sự của chúng ta đã có tiến triển từ mẫu vật [From.From.GetName] mà chúng ta gửi về! Họ đã cải tạo pin mặt trời sinh học và phân tích cách chúng lưu trữ nhiệt năng mà không làm bản thân bị thương. Điều này sẽ giúp phát triển một công nghệ phòng thủ hạm đội hoàn toàn mới."
 anomaly.4080.name:0 "Mảng cảm biến bị bỏ hoang"
 anomaly.4080.desc:1 "Chúng ta đã phát hiện ra một mảng cảm biến, đứng trơ trọi nhìn xuống [From.GetName]. Trên [From.GetPlanetMoon] này không có bất kỳ sinh vật trí tuệ nào đáng nhắc tới, vì vậy đây chắc chắn là một tiền đồn bị bỏ hoang. Niên đại của nó không tính là quá lâu đời, nhưng lại không thể sử dụng được.\n\nChúng ta cần sửa chữa và nghiên cứu nó mới có thể khiến nó hoạt động trở lại, tuy nhiên nếu tháo dỡ nó có lẽ có thể giúp chúng ta học hỏi được kỹ thuật mới."
 anomaly.4080.a:0 "Thử khởi động."
 anomaly.4080.b:0 "Tháo dỡ và tiến hành đảo ngược kỹ thuật đối với nó."
 anomaly.4080.c:0 "Mặc kệ nó, có lẽ chủ nhân của nó sẽ quay lại."
 anomaly.4081.desc:0 "Nhiều tháng làm việc cuối cùng đã đơm hoa kết trái! Mảng cảm biến của [From.From.From.GetName] một lần nữa khôi phục hoạt động, giờ đây phạm vi dò quét của chúng ta ở khu vực lân cận đã rộng hơn. Tuy nhiên mảng cảm biến cần nhiều năng lượng và nhân lực hơn mới có thể vận hành bình thường, vì vậy chúng ta cần thiết lập một thuộc địa để duy trì nó."
 anomaly.4081.a.tooltip:0 "Thêm hiệu ứng §GMảng cảm biến cao cấp§! vào [From.From.From.GetName]."
 anomaly.4081.b.tooltip:0 "Mở khóa sắc lệnh đế quốc §Y$edict_super_sensors$§!.\n\nThêm hiệu ứng §GMảng cảm biến cao cấp§! vào [From.From.From.GetName]."
 anomaly.4085.name:0 "Trôi dạt"
 anomaly.4085.desc:1 "Chúng ta đã phát hiện ra một con tàu ngoại tộc đang trôi dạt trong các tiểu hành tinh bao quanh [From.GetName]. Nó hoàn toàn không phản hồi tín hiệu liên lạc của chúng ta. Rốt cuộc là nó không thể phân tích tín hiệu của chúng ta, hay là vì nguyên nhân khác mà phớt lờ chúng ta, chúng ta không thể biết được.\n\nSĩ quan khoa học [Root.GetLeaderName] đề nghị chúng ta phái một tàu công trình đến, kéo nó ra khỏi khu vực mảnh vỡ. Nếu cứ mặc kệ nó, con tàu ngoại tộc này rất có khả năng sẽ bị tiểu hành tinh đập nát.\n\nĐã ban bố một §SDự án đặc biệt§! để giải cứu con tàu và điều tra nó."
 anomaly.4086.desc:1 "Con tàu trôi dạt ở [From.From.From.GetName] đã được kéo ra, chúng ta có thể phái đội đặc nhiệm đi điều tra nó. Bên trong đã xảy ra một cuộc giết chóc. Chỉ tìm thấy thi thể của một thủy thủ — đó là một sinh vật hai chân lưỡng cư có tai dài, trên người anh ta có nhiều vết đâm. Con tàu này vì đã không còn chủ nhân, nên đã thuộc về chúng ta.\n\nCon tàu này sở hữu bộ đẩy vô cùng hiệu quả, cấu trúc và thiết kế của nó đều cao hơn mức hiện tại của chúng ta. Phi thuyền không trang bị vũ khí, xem ra là một tàu vận tải chở nhân vật quan trọng.\n\nViệc cải tạo nó thành tàu khảo sát không tốn bao nhiêu công sức. Tuy nhiên, nếu chúng ta tháo dỡ nó và nghiên cứu kỹ động cơ của nó, có lẽ sẽ có thể nâng tầm thực tế cho trình độ hạm đội của chúng ta."
 anomaly.4087.desc:1 "Con tàu trôi dạt ở [From.From.From.GetName] đã được kéo ra, chúng ta có thể phái đội đặc nhiệm đi điều tra nó. Thủy thủ trên đó vẫn còn sống!"
 anomaly.4086.a:0 "Cải tạo thành tàu khảo sát khoa học."
 anomaly.4086.a.tooltip: "Nhận được một chiếc §YTàu nghiên cứu§!.\n"
 anomaly.4086.b:0 "Tháo dỡ và nghiên cứu động cơ của nó.\n"
 anomaly.4086.b.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §GTăng tốc độ tàu§!.\n"
 anomaly.4090.name:0 "Lánh nạn"
 anomaly.4090.desc:0 "Chúng ta đã thành công truy vết được tín hiệu rồi! Gần quỹ đạo [From.GetName] đang ẩn giấu một con tàu khác. Người ngoại tộc trên tàu đã phản hồi chúng ta, nhưng chúng ta đều không hiểu ngôn ngữ của nhau. Họ dường như là những người tị nạn từ hành tinh mẹ hoang tàn phía dưới của họ, đang tìm kiếm ngôi nhà mới để sinh tồn."
 anomaly.4090.a:0 "Cho họ cư trú tại [refugee_planet_1.GetName]."
 anomaly.4090.b:0 "Cho họ cư trú tại [refugee_planet_2.GetName]."
 anomaly.4090.c:0 "Cho họ cư trú tại [refugee_planet_3.GetName]."
 anomaly.4090.d:0 "Cho họ cư trú tại [refugee_planet_4.GetName]."
 anomaly.4090.e:0 "Đáng tiếc, chúng ta không có bất kỳ hành tinh nào có thể thu dung họ."
 anomaly.4090.f:0 "Rất tiếc, chúng ta không giúp gì được cho các bạn."
 anomaly.4090.g:0 "Chúng ta không hoan nghênh người ngoài hành tinh!"
 anomaly.4090.uninhabitable:0 "Thật không may, hành tinh của chúng ta không thể thích ứng với nhu cầu sinh tồn của họ."
 anomaly.4093.name:0 "[RefugeeAliensNation.GetName]"
 anomaly.4093.desc:0 "Những người tị nạn ngoại tộc từng gặp gỡ mà thiếu khả năng giao tiếp với nhau, giờ đây xuất hiện trên màn hình của chúng ta.\n\n“Hai chủng tộc chúng ta lại tương ngộ rồi, [From.GetSpeciesAdj]. Giờ đây cuối cùng chúng tôi đã tìm thấy nơi trú ẩn mới, đúng là trời không tuyệt đường sống của ai...\nCác người có biết chúng tôi đã trải qua bao nhiêu gian khổ mới đến được đây không?”"
 anomaly.4093.a:0 "Về chuyện trước đây thực sự rất xin lỗi!"
 anomaly.4093.b:0 "Chỉ có tự lực, mới có thể sống tiếp."
 anomaly.4093.c:0 "Bởi vì không thể giao tiếp, nên chúng tôi đã sợ hãi."
 anomaly.4093.d:0 "Sống chết của các người không liên quan gì đến chúng ta, lũ dị tộc."
 anomaly.4094.apology.desc:0 "“Chúng tôi chấp nhận lời xin lỗi của các người, nhưng nếu ban đầu các người giúp đỡ chúng tôi, chúng tôi đã không phải chết nhiều người như vậy rồi. Vĩnh biệt.”"
 anomaly.4094.insult.desc:0 "“Nói thì nhẹ nhàng lắm, [From.GetSpeciesAdj]. Đặc biệt là đối với loại người đứng nói mà không biết đau lưng như các người. Cứ tiếp tục đứng khoanh tay đứng nhìn đi, rồi các người sẽ sớm lâm vào cảnh cô độc không ai giúp đỡ. Vĩnh biệt.”"
 anomaly.4094.neutral.desc:0 "“Có thể thấu hiểu, [From.GetSpeciesAdj]. Tuy nhiên điều này chẳng giúp ích gì cho những đau khổ mà chúng tôi đã phải gánh chịu. Chúng tôi đã từng cô độc không nơi nương tựa vào lúc cần giúp đỡ nhất. Vĩnh biệt.”"
 anomaly.4094.xenophobe.desc:0 "“Hì hì, [From.GetSpeciesAdj]. Thật may là ngay từ đầu chúng tôi đã nhìn thấu các người. Vĩnh biệt.”"
 anomaly.4094.a:0 "Vĩnh biệt."
 anomaly.4095.name:0 "Nơi trú ẩn"
 anomaly.4095.desc:0 "Khu rừng của [From.GetName] khiến các thủy thủ vô cùng kinh ngạc. Đây không chỉ là một thế giới phát triển cao độ đầy rẫy các sinh vật hữu cơ, mà phần lớn rễ và thân của thực vật đều có thể ăn được. Có lẽ không tính là ngon lành, nhưng điều này đại diện cho việc chúng ta có thể dễ dàng canh tác trên vùng đất màu mỡ của [From.GetPlanetMoon]."
 anomaly.4095.a.tooltip:0 "Thêm hiệu ứng §GHành tinh xanh tươi§! vào [From.GetName]."
 anomaly.4100.name:0 "Thủy vương"
 anomaly.4100.desc:0 "$anomaly.4100.base.desc$ Lớp vảy sẫm màu của những sinh vật này rất cứng, và cực kỳ dễ bị kích động khi có người lạ tiến lại gần.\n\nCó lẽ có thể thuần hóa những mãnh thú này, để chúng hỗ trợ các hoạt động thuộc địa hóa hành tinh trong tương lai của chúng ta. Nhưng nghiên cứu chúng trước có lẽ sẽ có thu hoạch."
 anomaly.4100.expert.desc:0 "$anomaly.4100.base.desc$\n\n[Root.GetLeaderName] phát hiện loại động vật này có năng lực tâm linh nào đó, từ sự thay đổi hành vi của chúng có thể thấy, chúng có thể cảm nhận được ý đồ của chúng ta.\n\nCó lẽ có thể thuần hóa những mãnh thú này, để chúng hỗ trợ các hoạt động thuộc địa hóa hành tinh trong tương lai của chúng ta. Nhưng nghiên cứu chúng trước có lẽ sẽ có thu hoạch.\n\n[Root.GetLeaderName] nói những sinh vật bản địa này sẽ “phản hồi tiêu cực đối với những kẻ có ý đồ xấu”."
 anomaly.4100.base.desc:0 "Trên [From.GetName], sĩ quan khoa học [Root.GetLeaderName] đã phát hiện ra một loại sinh vật có vú bốn chân thân hình cường tráng, khả năng thích nghi cực mạnh. Chúng có thể đi bộ lội nước, ngay cả những thực vật cao lớn cũng chỉ chạm tới chân của chúng."
 anomaly.4100.a:0 "Nghiên cứu chúng, tìm hiểu thêm thông tin."
 anomaly.4100.b:0 "Thử thuần hóa chúng ngay lập tức."
 anomaly.4100.c:0 "Để chúng sống tự do tự tại."
 anomaly.4101.desc:0 "Chúng ta đã thử tiếp cận chúng để nghiên cứu, nhưng tiến triển không mấy thuận lợi. Ngay khi chúng phát hiện chúng ta tiến lại gần, liền hoặc là chạy trốn hoặc là chiến đấu, chúng dường như có thể phát hiện ra chúng ta từ đằng xa.\n\nNhững động vật này rõ ràng hiểu rõ ý đồ của chúng ta, nên cố gắng tránh tiếp xúc với chúng ta.\n\nÍt nhất chúng ta có thể nghiên cứu chúng từ khoảng cách xa, có lẽ sẽ có phát hiện."
 anomaly.4101.a:0 "Đây ít nhất là một loại động vật có ý chí kiên định."
 anomaly.4102.desc:0 "Việc tiếp xúc với những động vật này diễn ra khá suôn sẻ! Chúng dường như sở hữu một loại cảm ứng tâm linh, có thể giao tiếp với nhau cũng như với chúng ta thông qua tinh thần.\n\nChúng muốn được sống tự do tự tại trên mặt đất, tận hưởng trái cây ở đó. Nếu chúng ta không làm phiền không gian sống và thức ăn của chúng, chúng sẵn lòng giúp đỡ chúng ta khi cần thiết.\n\nCâu chuyện đẹp đẽ này nên được lan truyền rộng rãi đến tai mọi người."
 anomaly.4102.b:0 "Bản thân chúng ta cũng cần thức ăn."
 anomaly.4103.desc:0 "Những động vật này rất khó thuần hóa. Để tiếp cận chúng, chúng ta buộc phải sử dụng bạo lực và thuốc gây mê. Khi chúng ta muốn điều khiển chúng, chúng luôn phản kháng. Chúng ta phải ép buộc chúng hoàn thành công việc, nhưng hiệu quả không tốt lắm."
 anomaly.4103.a:0 "Tại sao chúng lại phản kháng nhỉ?"
 anomaly.4104.desc:0 "Những động vật này rất khó chung sống. Mặc dù chúng ta đã cố gắng dịu dàng hết mức có thể, nhưng một phần trong số chúng vẫn chạy trốn và phản kháng. Chúng ta đã tập hợp được một nhóm tương đối ngoan ngoãn, huấn luyện chúng làm việc. Nhưng một phần trong đó vẫn kháng cự. Hiện tại chúng ta có một nhóm nhỏ cá thể sẵn lòng giúp đỡ, nhưng điều này rõ ràng là kém hiệu quả hơn nhiều so với cả đàn.\n\nTin tức chúng ta thuần hóa những động vật này một khi lọt vào tai công chúng, có thể gây ra ảnh hưởng tiêu cực đến danh tiếng của chúng ta."
 anomaly.4104.a:0 "Dù sao thì vẫn có ích mà."
 anomaly.4105.name:0 "Đuổi không đi"
 anomaly.4105.desc:0 "Hành tinh [From.GetName] là một vùng đất chết kịch độc, nhưng kết quả quét của chúng ta phát hiện nơi đây từng không phải như bây giờ. Một nền văn minh nay đã hủy diệt vì quá lệ thuộc vào các loại nhiên liệu và độc tố làm thay đổi khí hậu mà đã hủy hoại hoàn toàn hành tinh mẹ này của chính họ.\n\nTrên một ngọn đồi hẻo lánh gần một thành phố lớn, chúng ta đã phát hiện ra một cơ sở vẫn còn hoạt động. Đây là một nhà máy lắp ráp robot, xung quanh đậu đầy những phương tiện quân sự. Nhưng những phương tiện này hễ chạm nhẹ vào là hóa thành bụi tro.\n\nCơ sở này vô cùng bí ẩn kỳ quái, nhưng có lẽ có thể cung cấp không ít tư liệu nghiên cứu."
 anomaly.4105.desc.mach:0 "Hành tinh [From.GetName] là một vùng hoang phế kịch độc và có tính ăn mòn, nhưng kết quả quét của chúng ta phát hiện nó không phải lúc nào cũng vậy. Một nền văn minh sinh vật hữu cơ hiện đã tuyệt chủng dường như vì lệ thuộc nặng nề vào nhiên liệu và độc tố làm thay đổi khí hậu, mà đã phá hủy hành tinh mẹ của mình.\n\nỞ một ngọn đồi xa xôi gần một thành phố lớn, chúng ta phát hiện ra một cơ sở vẫn đang hoạt động. Đây là một nhà máy lắp ráp robot bị bỏ hoang, xung quanh đậu đầy những phương tiện quân sự bị mục nát nghiêm trọng, hễ chạm nhẹ vào là hóa thành bụi tro.\n\nCơ sở này vô cùng bí ẩn kỳ quái, nhưng có lẽ có thể cung cấp không ít tư liệu nghiên cứu."
 anomaly.4105.a.tooltip:1 "Thêm hiệu ứng §YXã hội robot đã mất§! vào [From.GetName]:\n£engineering£ §G+6§!"
 anomaly.4105.a:0 "Có thể lấy đó làm gương."
 anomaly.4105.a.mach:0 "Sinh vật hữu cơ thiển cận."
 anomaly.4105.b.tooltip:1 "Mở khóa sắc lệnh đế quốc §Y$edict_renewable_energy$§!.\n\nThêm hiệu ứng §YXã hội robot đã mất§! vào [From.GetName]:\n£engineering£ §G+6§!"
 anomaly.4105.robot:0 "Thử khởi động robot."
 anomaly.4106.desc:0 "Cơ sở trên [From.From.From.GetName] đã khôi phục hoạt động nhờ sự nỗ lực của sĩ quan khoa học [Root.GetLeaderName].\n\nCác robot sau khi khởi động liền ngay lập tức vào vị trí làm việc. Các thủy thủ của [From.GetName] trố mắt đứng nhìn, quan sát những robot di chuyển đi khắp nơi, bắt đầu dọn dẹp độc tố trên toàn bộ hành tinh.\n\nĐiều này không khỏi khiến người ta suy đoán rằng những cư dân trước đây là vì quá tập trung vào việc tàn sát lẫn nhau mà phớt lờ việc tự cứu mình."
 anomaly.4106.desc.mach:0 "Cơ sở trên [From.From.From.GetName] đã khôi phục hoạt động nhờ sự nỗ lực của sĩ quan khoa học [Root.GetLeaderName].\n\nCác robot sau khi khởi động liền ngay lập tức vào vị trí làm việc. Đơn vị thủy thủ của [From.GetName] quan sát những robot cổ xưa này di chuyển đi khắp nơi, bắt đầu dọn dẹp độc tố trên toàn bộ hành tinh.\n\nĐiều này không khỏi khiến người ta suy đoán rằng những cư dân trước đây là vì quá tập trung vào việc tàn sát lẫn nhau mà phớt lờ việc tự cứu mình. Đúng là phong cách nhất quán của sinh vật hữu cơ."
 anomaly.4106.a.tooltip:1 "§YLoại hành tinh§! của [From.From.From.GetName] thay đổi thành §GLục địa§!.\n\nThêm hiệu ứng §YXã hội cơ khí đã mất§! vào [From.From.From.GetName]:\n£engineering£ §G+3§!\n£building£ Nhà máy lắp ráp robot §G+1§!\n£blocker£ Hố sụt §R+2§!\n£blocker£ Di tích thành phố §R+3§!"
 anomaly.4106.b.tooltip:1 "Mở khóa sắc lệnh đế quốc §Y$edict_renewable_energy$§!.\n\n§YLoại hành tinh§! của [From.From.From.GetName] thay đổi thành §GĐất liền§!.\n\nThêm hiệu ứng §YXã hội robot đã mất§! vào [From.From.From.GetName]:\n£engineering£ §G+3§!\n£building£ Nhà máy lắp ráp robot §G+1§!\n£blocker£ Hố đạn §R+2§!\n£blocker£ Di tích thành phố §R+3§!"
 anomaly.4110.name:0 "Cát lún"
 anomaly.4110.success.desc:0 "Những cồn cát trên [From.GetName] đầy rẫy nguy hiểm. Những lớp cát mịn màng nhẵn thín đó giống như chất lỏng vậy, gây ra khó khăn không thể đong đếm cho việc hạ cánh.\n\nTuy nhiên, đội ngũ khoa học cơ trí của chúng ta đã nghĩ ra một phương pháp đổi mới. Một loại dung môi hóa học do sĩ quan khoa học [Root.GetLeaderName] pha chế có thể làm đông cứng những đống cát tại các địa điểm then chốt, giúp chúng ta dễ dàng băng qua bề mặt [From.GetPlanetMoon] hơn."
 anomaly.4110.fail.desc:0 "Những cồn cát trên [From.GetName] đầy rẫy nguy hiểm. Những hạt cát này nhỏ bé đến mức chúng ta gần như có thể coi hoàn toàn chúng là chất lỏng, nó sẽ nuốt chửng tất cả những kẻ đặt chân lên đó. Thuộc địa hóa ở đây sẽ chỉ làm tổn thất nhân lực và thiết bị một cách vô ích.\n\nCó lẽ theo thời gian, chúng ta sẽ học được cách thích nghi với môi trường như vậy. Có câu ngạn ngữ cổ rất hay: “Đứng trên nền móng của người đi trước.”"
 anomaly.4110.a.tooltip:1 "Thêm hiệu ứng §YCát lún§! vào [From.GetName]:\nNghiên cứu Vật lý §G+6§!\n£blocker£ Lưu vực cát lún §R+5§!"
 anomaly.4110.b.tooltip:1 "Thêm hiệu ứng §YCát dịch chuyển§! và §YCát lún§! vào [From.GetName]:\n£physics£ §G+3§!\n£blocker£ Lưu vực cát lún §R+7§!"
 anomaly.4115.name:0 "Ẩn mình trong tối"
 anomaly.4115.desc:0 "Đã có chuyện lớn xảy ra với [Root.GetName]! Sau khi nghiên cứu kết thúc mà không có phát hiện lớn nào, các thủy thủ liền quay trở lại tàu, nhưng lại phát hiện một con mãnh thú nào đó của [From.GetPlanetMoon] thế mà đã lẻn lên tàu!\n\nSinh vật đó đã sát hại một thủy thủ, và đang xé toạc các bức tường cố gắng áp sát những thủy thủ khác. Họ không trụ được bao lâu đâu! Đã ban bố một §SDự án đặc biệt§! để đi cứu người."
 anomaly.4115.desc.mach:0 "Thảm họa lớn đã xảy ra với [Root.GetName]! Sau khi tiến hành nghiên cứu mà không thu được gì, các thủy thủ khi quay trở lại phi thuyền lại phát hiện trên đó có một con mãnh thú sinh vật hữu cơ đến từ [From.GetPlanetMoon]!\n\nCon mãnh thú này đã làm tê liệt một đơn vị thủy thủ, và đang xé toạc các bức tường cố gắng áp sát các đơn vị khác. Cứ thế này họ sẽ không sống được bao lâu đâu! §SDự án đặc biệt§! giải cứu tàu đã được ban bố."
 anomaly.4115.a:0 "Mau tổ chức đội cứu hộ!"
 anomaly.4115.b:0 "Để họ nghe theo mệnh trời đi."
 anomaly.4115.b.tooltip:0 "§Y[Root.GetName]§! đã bị tiêu diệt."
 anomaly.4116.desc:0 "Đội cứu hộ của chúng ta đã thành công tiêu diệt con mãnh thú trên [From.From.GetName]. Sĩ quan khoa học [From.From.GetLeaderName] và các thủy thủ đều bị một phen kinh hoàng, nhưng vẫn có thể đảm đương chức vụ tương ứng. Họ vô cùng cảm kích sự cứu viện của binh sĩ, chuyện này đã kích thích nhiệt huyết gia nhập quân đội của mọi người."
 anomaly.4116.desc.mach:0 "Đội cứu hộ của chúng ta đã thành công loại bỏ con mãnh thú trên [From.From.GetName]. Sĩ quan khoa học [From.From.GetLeaderName] cùng đội ngũ của mình chỉ chịu tổn thương nhẹ, và vẫn có thể thực hiện nhiệm vụ. Hành động loại trừ mối đe dọa hữu cơ thành công của đơn vị vũ trang đã gây ra sự coi trọng rộng rãi đối với an ninh cơ khí từ các xưởng tổng hợp cơ khí.\n\nDo đó, tốc độ chế tạo cũng như hiệu quả phần mềm động lực của các đơn vị tác chiến của chúng ta đã được nâng cao."
 anomaly.4116.a:0 "Đây là niềm kiêu hãnh của hạm đội!"
 anomaly.4116.a.tooltip:1 "§YĐế chế của bạn§! nhận được hiệu ứng §G$army_inspiration$§!."
 anomaly.4116.a.mach.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §G$army_inspiration_mach$§!."
 anomaly.4117.desc:0 "Đội cứu hộ của chúng ta đã thành công tiêu diệt con mãnh thú trên [From.From.GetName]. Đáng tiếc là họ đã không kịp cứu sĩ quan khoa học [From.From.GetLeaderName], người đã hy sinh để bảo vệ các thủy thủ.\n\nÍt nhất phi thuyền không hư hại, các thủy thủ sẽ sớm có thể khôi phục công việc. Hành tinh mẹ của chúng ta đang sục sôi, đều khen ngợi hành động anh dũng của các binh sĩ của chúng ta."
 anomaly.4117.desc.mach:0 "Đội cứu hộ của chúng ta đã thành công loại bỏ con mãnh thú trên [From.From.GetName]. Không may là, họ đã không thể kịp thời cứu được sĩ quan khoa học [From.From.GetLeaderName], người đã chịu tổn thương chí mạng khi cố gắng bảo vệ các thủy thủ.\n\nÍt nhất hạm thuyền vẫn còn nguyên vẹn, và các đơn vị khác trên tàu biểu thị họ sẽ sớm khôi phục cơ năng bình thường. Mạch điện điều khiển chính của hành tinh mẹ đang bận rộn nâng cấp các thuật toán liên quan đến quân sự để đối phó tốt hơn với các sự kiện tương tự có thể xảy ra trong tương lai."
 anomaly.4117.a.tooltip:0 "Mất đi §Rnhà khoa học§! trên tàu.\n§YĐế chế của bạn§! nhận được hiệu ứng §G$army_inspiration$§!."
 anomaly.4117.a.mach.tooltip:0 "Mất đi §Rnhà khoa học§! trên tàu.\n§YĐế chế của bạn§! nhận được hiệu ứng §G$army_inspiration_mach$§!."
 anomaly.4120.name:0 "Tiếng nổ vang trời"
 anomaly.4120.desc:0 "[From.GetPlanetMoon][From.GetName] đầy rẫy những kỳ quan thiên nhiên. Những vụ nổ bảy sắc cầu vồng khổng lồ xuất hiện trên không trung, đó là bởi các thành phần hóa học trong bầu khí quyển phản ứng với tia gamma của ngôi sao.\n\nCác sinh viên và những nhà khoa học cấp cao đang truyền bá tin tức này, tin tức lan rộng như cháy rừng. Những người liên quan trong lĩnh vực khoa học đều nảy sinh hứng thú với việc này."
 anomaly.4125.name:0 "Trạm khai thác tắt đèn"
 anomaly.4125.desc:1 "Chúng ta đã phát hiện ra một trạm khai thác cũ đang trôi dạt trong quỹ đạo của [From.GetPlanetMoon][From.GetName]. Có thể khẳng định nó được dùng để khai thác tài nguyên hành tinh, nhưng chủ nhân là ai thì vẫn là một ẩn số.\n\nTrình độ kỹ thuật của trạm khai thác rất giống với chúng ta. Chúng ta nên sớm sửa chữa xong nó và khiến nó hoạt động trở lại. Hoặc cũng có thể tháo dỡ nó để lấy linh kiện."
 anomaly.4125.a:0 "Tiếp quản trạm khai thác."
 anomaly.4125.zerog.desc:0 "$anomaly.4125.desc$\n\nSự học rộng tài cao của sĩ quan khoa học [Root.GetLeaderName] về kiến trúc phi trọng lực đã giúp chúng ta hiểu được cấu trúc bên trong của trạm khai thác, và giúp cải thiện thiết kế của chính mình."
 anomaly.4125.a.tooltip:1 "Thêm hiệu ứng §YTrạm khai thác bị bỏ hoang§! vào [From.GetName]:\nNhận được một §YTrạm khai thác§!\n£energy£ §G+3§!"
 anomaly.4125.b.tooltip:1 "§YĐế chế của bạn§! nhận được hiệu ứng §GĐổi mới phi trọng lực§!.\n\nThêm hiệu ứng §YTrạm khai thác bị bỏ hoang§! vào [From.GetName]:\nNhận được một §YTrạm khai thác§!\n£energy£ §G+3§!"
 anomaly.4130.name:0 "Đại thụ"
 anomaly.4130.desc:0 "Tại vành đai tiểu hành tinh bao quanh [From.GetName], một cây cổ thụ khổng lồ đang trôi dạt trong không gian trống rỗng. Chuyện chưa từng có tiền lệ thế này thực sự nói ra chẳng ai dám tin! Cây cổ thụ được bao bọc bởi một bong bóng giống như lớp bảo vệ, trông như một lá chắn năng lượng.\n\nChúng ta đột nhiên phát hiện các chủng tộc không gian thù địch đang tiếp cận! Chuyện này xảy ra ngay lúc chúng ta thu thập mẫu vật và có nhựa cây chảy ra từ lá chắn, lẽ nào chúng bị thu hút bởi thứ này?"
 anomaly.4130.a:0 "Chúng ta phải tìm hiểu xem rốt cuộc chuyện gì đang xảy ra!"
 anomaly.4131.desc:0 "Sau khi nghiên cứu kỹ lưỡng cuối cùng chúng ta đã hiểu tại sao nhựa cây lại thu hút những sinh vật đó đến rồi. Cái cây này sản sinh ra một loại chất lỏng có giá trị dinh dưỡng rất cao, có thể sửa chữa các mô tế bào. Đây đúng là Cây sự sống mà!\n\nNếu chúng ta có thể thu thập thứ này, chúng ta sẽ có thể kéo dài tuổi thọ của mọi người. Nhưng vấn đề là: đại thụ chỉ có một cây, chúng ta hoặc là tăng mạnh tuổi thọ cho một nhóm nhỏ người, hoặc là tăng nhẹ tuổi thọ cho tất cả mọi người."
 anomaly.4131.a:0 "Đem cho lãnh đạo dùng."
 anomaly.4131.b:0 "Mọi người bình đẳng, cùng nhau dùng."
 anomaly.4131.c:0 "Để đại thụ tiếp tục trôi dạt đi."
 anomaly.4135.name:0 "Lời dạy của thực dân"
 anomaly.4135.desc:1 "Thủy thủ đoàn [Root.GetName] có phát hiện quan trọng trên [From.GetName]. Những cồn cát trên hành tinh đó đang ẩn giấu một vài tàn tích thuộc về một chủng tộc liên sao. Những loại thuộc địa này đa phần đều không chống lại được sự gột rửa của thời gian.\n\nSĩ quan khoa học [Root.GetLeaderName] đã sớm phát hiện ra một chiếc rương chứa các vật phẩm và tài liệu quý giá. Vì những tài liệu này được bảo quản cùng với vật phẩm quý giá, nên chắc hẳn vô cùng quan trọng."
 anomaly.4135.b:1 "Bán cho những nhà sưu tập tư nhân."
 anomaly.4136.desc:0 "Các chuyên gia ngôn ngữ của chúng ta đã làm việc quên ăn quên ngủ nhiều tháng, cuối cùng đã thành công dịch được những tài liệu tìm thấy trên [From.From.From.GetName]. Những tài liệu này là tác phẩm của một người được gọi là Người kể chuyện Terisha. Bà ấy dường như là một nhà triết học, nhà xã hội học, nhà quan hệ học vô cùng nổi tiếng.\n\n$anomaly.4136.base.desc$"
 anomaly.4136.found.desc:0 "Những tài liệu tìm thấy trên [From.From.From.GetName] dường như cũng là tác phẩm của Người kể chuyện Terisha. $anomaly.4136.base.desc$"
 anomaly.4136.base.desc:0 "Những tài liệu này giải thích chi tiết cách tái cấu trúc cơ sở hạ tầng và định hình xã hội. Ý của bà ấy là tất cả mọi người đều hy sinh một phần hạnh phúc của mình, vì đế chế cùng tạo dựng tương lai tươi sáng."
 anomaly.4136.a.tooltip:0 "Có thể sử dụng sắc lệnh đế quốc §Y$edict_masters_writings_politics$§!."
 anomaly.4140.name:0 "Lời dạy của người khám phá"
 anomaly.4140.desc:0 "Thủy thủ đoàn [Root.GetName] gửi báo cáo nói rằng, họ đã tìm thấy phát hiện kinh ngạc trên [From.GetName]. Đội khám phá của các văn minh khác đã để lại dấu vết trên bề mặt, và để lại một số hồ sơ cùng cổ vật được bảo quản hoàn hảo.\n\nSĩ quan khoa học trưởng [Root.GetLeaderName] đề nghị đưa các tài liệu về hành tinh mẹ để giải mã. Nhưng cũng có thể bán chúng cho các nhà đầu tư tư nhân."
 anomaly.4141.desc:0 "Thông qua nhiều tuần nghiên cứu, các chuyên gia ngôn ngữ học của chúng ta đã giải mã được nội dung chứa trong các tài liệu của [From.From.From.GetName]. Tài liệu đó ghi chép lại những suy tư triết học của một học giả nổi tiếng, bà ấy được gọi là “Người kể chuyện Terisha”.\n\n$anomaly.4141.base.desc$"
 anomaly.4141.found.desc:0 "Ai mà ngờ tới được chứ? Những tài liệu chúng ta phát hiện đã ghi chép thêm nhiều lời dạy của “Người kể chuyện Terisha”. Lần này, là một số suy ngẫm và phân tích về các vấn đề vĩ mô hơn.\n\n$anomaly.4141.base.desc$"
 anomaly.4141.base.desc:0 "Những lời dạy của bà ấy giúp chúng ta có hiểu biết sâu sắc hơn về việc cai trị đế chế, thông qua việc áp dụng những quan điểm khác nhau, và tập trung vào các vấn đề vĩ mô khi cách mạng, có thể đạt được kết quả cai trị tốt hơn."
 anomaly.4141.a.tooltip:0 "Có thể sử dụng sắc lệnh đế quốc §Y$edict_masters_writings_philosophy$§!."
 anomaly.4145.name:0 "Sự hủy diệt của chủ nô"
 anomaly.4145.base.desc:0 "Mùa đông hạt nhân trên [From.GetName] sẽ còn kéo dài rất lâu. Toàn bộ hành tinh đều không có sinh vật nào sống sót. Sĩ quan khoa học [Root.GetLeaderName] đã báo cáo kết quả điều tra của đội ngũ: tất cả bằng chứng đều chỉ ra rằng, nơi đây từng tồn tại văn minh thống nhất, nhưng đã rơi vào tranh đấu.\n\nNguyên nhân chiến tranh có thể là do một số tộc trưởng nhỏ vì tranh giành quyền kiểm soát nô lệ lớn hơn của đế chế mà nảy sinh mâu thuẫn."
 anomaly.4145.desc:0 "$anomaly.4145.base.desc$\n\nThật may là, trong lịch sử của chúng ta không xảy ra chuyện này, nhưng chúng ta có thể từ đó nhận được cảnh báo, thực thi chế độ nô lệ là một hành vi ngu xuẩn."
 anomaly.4145.slaver.desc:0 "$anomaly.4145.base.desc$\n\nNhững phát hiện này chẳng giúp ích gì cho lối sống của chúng ta."
 anomaly.4145.soon.desc:0 "$anomaly.4145.base.desc$\n\nChúng ta phải cẩn trọng, kẻo dẫm vào vết xe đổ."
 anomaly.4145.a:0 "Lũ chủ nô ngu xuẩn..."
 anomaly.4145.b:0 "Thật khiến người ta kinh ngạc..."
 anomaly.4145.a.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §R$slavery_bad_juju$§!.\n\n"
 anomaly.4145.b.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §R$slavery_very_bad_juju$§!.\n\n"
 anomaly.4150.name:0 "Lời dạy của thương nhân"
 anomaly.4150.desc:0 "Trên bề mặt của [From.GetName] sừng sững những quần thể kiến trúc đáng chú ý. Những di tích này sở hữu các phong cách kiến trúc khác nhau, nhưng đều được xây dựng vào cùng một thời đại. [From.GetPlanetMoon] trước đây có lẽ từng là một trung tâm giao dịch.\n\nTrong một số di tích có lưu giữ tài liệu và tài sản. Chúng ta có thể thông qua việc nghiên cứu văn bản để thử dịch thuật, nhằm hiểu về những sinh vật từng định cư ở đây. Chúng ta cũng có thể bán chúng cho các nhà sưu tập đồ cổ."
 anomaly.4151.desc:0 "Các chuyên gia ngôn ngữ học thiên tài của chúng ta đang nỗ lực dịch các tài liệu tìm thấy trên [From.From.From.GetName]. Tác giả của tài liệu được gọi là “Người kể chuyện Terisha”, dường như là người có uy tín cao thời bấy giờ.\n\n$anomaly.4151.base.desc$"
 anomaly.4151.found.desc:0 "Ai mà ngờ tới được chứ? Những tài liệu chúng ta phát hiện đã ghi chép thêm nhiều lời dạy của “Người kể chuyện Terisha”.\n\n$anomaly.4151.base.desc$"
 anomaly.4151.base.desc:0 "Tài liệu này ghi chép một số chuyện lạ thú vị, những lời khuyên và kỹ năng về cách thu được lợi ích tối đa từ ngoại giao liên sao. Bà ấy tin rằng, thương mại công bằng và giao tiếp tôn trọng lẫn nhau có thể mang lại tiến bộ xã hội to lớn cho các giới."
 anomaly.4151.a.tooltip:0 "Có thể sử dụng sắc lệnh đế quốc §Y$edict_masters_writings_diplomacy$§!."
 anomaly.4155.name:0 "Dưới chiến trường"
 anomaly.4155.desc:0 "[From.GetName] từng sở hữu một nền văn minh cao cấp. Nhưng họ đã sớm trở thành tro bụi lịch sử. Những mãnh thú ngoại hình kỳ dị đang hoành hành dữ dội trên các chiến trường viễn cổ ở bề mặt hành tinh.\n\nTại phần chân của các dãy núi đá có ẩn giấu một nơi trú ẩn. Nếu chúng ta có thể xử lý lũ mãnh thú trên bề mặt trước, chúng ta có thể tiếp tục điều tra."
 anomaly.4155.a:0 "Lập tức ra tay thử nghiệm!"
 anomaly.4155.b:0 "Tránh xa nơi trú ẩn và những linh hồn đang lang thang ở đó."
 anomaly.4156.desc:0 "Sau khi dọn sạch mãnh thú, chúng ta đã tiến vào nơi trú ẩn. Bên trong dường như là một phòng chỉ huy, cung cấp nơi trú ẩn cuối cùng cho những vị lãnh đạo của nền văn minh đã chết này.\n\nBên trong nơi trú ẩn toàn là thiết bị hư hỏng và thi thể mục nát. Thứ duy nhất đáng để điều tra là một chiếc bình chứa, có thể đựng thứ gì đó vô cùng quan trọng."
 anomaly.4156.b:0 "Để phòng hờ, chỉ nghiên cứu nơi trú ẩn."
 anomaly.4157.name:0 "Dũng sĩ trong kén đông lạnh"
 anomaly.4157.desc:0 "Bình chứa phát hiện trên [WarriorHomePlanet.GetName] hóa ra là một thiết bị đông lạnh! Người ngoại tộc được niêm phong đã tỉnh lại. Cô ấy dùng thần giao cách cảm nói rằng:\n\n“Tại sao lại đánh thức tôi? Cuộc chiến của chủng tộc chúng tôi kết thúc rồi sao?”"
 anomaly.4157.a:0 "Cô hiện đang ở trên [HomePlanet.GetName]. Nơi này rất an toàn."
 anomaly.4157.b:0 "Quê hương của cô đã bị chiến tranh hủy diệt rồi, chỉ có cô sống sót."
 anomaly.4157.c:0 "Chúng tôi đã dốc sức cứu vãn vật tư từ quê hương đã bị hủy hoại của các bạn."
 anomaly.4158.desc:0 "“Tôi cũng sợ chuyện này sẽ xảy ra. Hy vọng kiến thức của tôi và bi kịch của chủng tộc chúng tôi có thể mang lại lời dạy cho kẻ khác.”"
 anomaly.4159.desc:0 "“Là như vậy sao... Tôi cũng sợ khi tỉnh lại sẽ nhận được tin này. Nói thật, tôi còn sợ mình sẽ mãi mãi không tỉnh lại hơn. Chủng tộc các người muốn có được gì từ tôi?”"
 anomaly.4158.a:0 "Hãy kể cho chúng tôi nghe về chính cô."
 anomaly.4158.a.response:0 "“Tôi tên là Marjula, sở hữu danh hiệu ‘Người nhận lãnh’. Tôi là một vị tướng, là cố vấn của Nữ vương phương Đông, cũng là người bạn trung thành của bà ấy.”"
 anomaly.4158.b:0 "Tại sao cô lại bị đông lạnh?"
 anomaly.4158.spiritual.b:1 "Cô bị đông lạnh là vì nhiệm vụ thần thánh nào sao?"
 anomaly.4158.militant.b:0 "Bị đông lạnh vào thời chiến, cô chắc hẳn là một nhân vật quan trọng?"
 anomaly.4158.b.response:0 "“Tôi sở hữu danh hiệu ‘Người nhận lãnh’. Nếu chúng tôi đi đến diệt vong, tôi phải chịu trách nhiệm đại diện cho nhân dân tôi. Ngoài sự thấu hiểu về giống loài của mình, tôi là người có kiến thức phong phú nhất về mặt chiến tranh.”"
 anomaly.4158.c:0 "Hãy nói về nhân dân của cô."
 anomaly.4158.c.response:0 "“Một chủng tộc hay gây chuyện. Trong lịch sử của chúng tôi... những câu chuyện về con đường đi đến hủy diệt có ở khắp nơi. Mọi người không hiểu cách thực hiện giá trị bản thân. Mặc dù tồn tại nhiều người sáng suốt, nhưng rất ít người sẵn lòng lắng nghe.”"
 anomaly.4158.d:0 "Cô sẽ gia nhập với chúng tôi chứ?"
 anomaly.4158.f:0 "Hãy rời đi đi. Vận mệnh của cô do cô tự kiểm soát."
 anomaly.4158.xenophobe.f: "Cô không có giá trị lợi dụng. Hãy rời khỏi hành tinh của chúng ta!"
 anomaly.4160.desc:0 "“Lời nói của các người và văn minh của các người đã chứng minh tất cả cho tôi, những người bắt giữ. Tôi sẽ gia nhập cùng các người, hy vọng các người có thể rút ra bài học từ chủng tộc chúng tôi.”"
 anomaly.4161.desc:0 "Lời nói của các người, cùng bầu không khí của căn phòng này, đều chứng minh quan điểm của chúng ta không hợp nhau. Cho nên tôi sẽ không gia nhập cùng các người. Tôi sẽ quay về [WarriorHomePlanet.GetName], dành cả đời để kể câu chuyện về nó.”"
 anomaly.4161.a:0 "Vậy thì hãy lặng lẽ rời đi đi."
 anomaly.4161.b:0 "Bắt lấy cô ta!"
 anomaly.4162.desc:0 "“Thà chết chứ không chịu nhục!”\n\nMarjula giận dữ lao ra khỏi phòng. Đám đông bên ngoài đang chuẩn bị ngăn cản, cô ấy liền bắt lấy một nghiên cứu viên làm con tin. Trong quá trình chạy trốn, con tin không may hy sinh còn Marjula cũng bị cảnh vệ bắn chết."
 anomaly.4163.desc:0 "“Vĩnh biệt, những người bắt giữ. Hãy thử rút ra bài học từ giống loài chúng tôi, vạn lần đừng để đến lần sau chúng ta gặp lại, các người cũng trở thành người cuối cùng của giống loài mình.”"
 anomaly.4163.a:0 "Vĩnh biệt."
 anomaly.4163.b:0 "Cút ra ngoài!"
 anomaly.4165.name:0 "Lời dạy của dũng sĩ"
 anomaly.4165.desc:0 "Trên vùng hoang dã của [From.GetName], đã phát hiện ra những dấu vết từng chiến đấu. Dưới bề mặt không còn sức sống, các nhà nghiên cứu của [Root.GetName] đã phát hiện ra hài cốt và các mảnh kim loại, điều đáng kinh ngạc nhất là một chiếc bình chứa đựng tài liệu.\n\nNếu chúng ta đưa tài liệu về hành tinh mẹ để giải mã, chúng ta có cơ hội hiểu về cuộc chiến này và những chủng tộc tham gia chiến tranh. Nhưng cũng có thể trực tiếp bán nó cho những người buôn đồ cổ."
 anomaly.4166.desc:0 "Mấy tuần nay, các chuyên gia ngôn ngữ học của chúng ta luôn giải mã các tài liệu để lại từ chiến trường viễn cổ. Hôm nay nghiên cứu đã có một số tiến triển. Chúng ta biết được rằng, những dũng sĩ đã gục ngã tuân theo giáo nghĩa đến từ một nhà triết học tên là “Người kể chuyện Terisha”.\n\n$anomaly.4166.base.desc$"
 anomaly.4166.found.desc:0 "Trên những tài liệu chúng ta khai quật được từ chiến trường có ghi chép thêm nhiều lời dạy của “Người kể chuyện Terisha”.\n\n$anomaly.4166.base.desc$"
 anomaly.4166.base.desc:0 "Tài liệu này tiến hành phân tích các loại chiến thuật, chiến lược, điều then chốt nhất là, trong đó bao gồm hậu cần học của chiến tranh liên sao. Bản thân Terisha cực lực phản đối chiến tranh, nhưng bà tin rằng loại kiến thức này vẫn vô cùng quan trọng trong thời đại tương lai. “Để tạo dựng một thế giới tốt đẹp hơn, ngay cả những chủng tộc hòa bình nhất, cũng sẽ có lúc bị dồn vào đường cùng.”"
 anomaly.4166.a:0 "Xem ra người trí tuệ cũng sẽ lựa chọn chiến tranh."
 anomaly.4166.a.tooltip:0 "Có thể sử dụng sắc lệnh đế quốc §Y$edict_masters_writings_war$§!."
 anomaly.4170.name:0 "Tài nguyên dễ cháy"
 anomaly.4170.start.desc:0 "Kết quả quét cho thấy, dưới bề mặt của [From.GetPlanetMoon] sở hữu nồng độ khí thiên nhiên cao. Loại tài nguyên dồi dào này vô cùng hiệu quả và tiết kiệm năng lượng, có thể làm tăng đáng kể sản lượng năng lượng của các cơ sở trên bề mặt."
 anomaly.4170.basic.desc:0 "$anomaly.4170.start.desc$\n\nTuy nhiên, những tài nguyên này sẽ nhanh chóng cạn kiệt, vì trữ lượng khan hiếm, thể tích khá nhỏ."
 anomaly.4170.material.desc:0 "$anomaly.4170.start.desc$\n\nNhững lợi ích mà nó mang lại vượt xa những phá hoại gây ra cho môi trường."
 anomaly.4170.a:0 "Chuẩn bị tiến hành khai thác!"
 anomaly.4170.a.tooltip:1 "[From.GetName] nhận được hiệu ứng §YKhí tích tụ phong phú§!: \n£energy£ §G+50%§!"
 anomaly.4170.b:0 "Khai thác hành tinh không phải là kế sách lâu dài."
 anomaly.4170.b.tooltip:1 "[From.GetName] nhận được hiệu ứng §YKhai thác khí hợp lý§!: \n£energy£ §G+5§!"
 anomaly.4172.conqueror.desc:0 "Thuộc địa mà chúng ta chiếm đóng từng sở hữu tài nguyên khí đốt dưới lòng đất dồi dào. Nhưng giờ đây đã cạn kiệt, sản lượng năng lượng của nhà máy bị giảm sút."
 anomaly.4172.owner.desc:0 "Khí đốt giàu năng lượng đã cạn kiệt. Thuộc địa này đã mất đi sản lượng tài nguyên bổ sung, làm tăng đáng kể nhu cầu của chúng ta đối với những mỏ mới."

 ####################################
 # Anomaly Failure Events
 ####################################
 anomaly_failure.4000.desc:0 "[Root.GetLeaderName] đã có phát hiện kinh ngạc. Thảm thực vật của [From.From.GetName] vô cùng nguy hiểm đối với các sinh vật hữu cơ không phải thực vật. Chúng ta vẫn chưa rõ nguyên lý trong đó; chỉ biết rằng [From.From.GetPlanetMoon] vô cùng nguy hiểm, điều này sẽ hạn chế sự phát triển của thuộc địa ở đây."
 anomaly_failure.4000.a:0 "Đúng là một nơi đáng sợ."
 anomaly_failure.4000.a.tooltip:1 "Sĩ quan khoa học [Root.GetLeaderName] nhận đặc điểm §R$leader_trait_paranoid$§!.\n\n[From.From.GetName] nhận đặc điểm §YRừng axit§!: \n£blocker£ Đầm lầy kịch độc §R+3§!\n£society£ §G+6§!"
 anomaly_failure.4005.desc:0 "Thật không may, đội ngũ nghiên cứu khoa học của chúng ta đã không thể phát hiện ra bất kỳ thứ gì có giá trị từ tiểu hành tinh, khác với dự tính ban đầu, chỉ phát hiện ra một số khoáng vật thông thường."
 anomaly_failure.4005.a.tooltip:1 "Thêm tài nguyên vào [From.From.GetName]: \n£minerals£ §G+1§!"
 anomaly_failure.4010.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] báo cáo rằng, sau khi tiến hành dò tìm và quét trên diện rộng, vẫn không phát hiện được thứ gì có giá trị trên [From.From.GetPlanetMoon]."
 anomaly_failure.4011.desc:0 "Sau khi điều tra phi thuyền và tàn tích của các thủy thủ, sĩ quan khoa học [Root.GetLeaderName] suy đoán các thủy thủ chắc hẳn đã tàn sát lẫn nhau. Sự cô độc và giam cầm của du hành không gian thậm chí có thể đánh bại cả những ý chí mạnh mẽ nhất."
 anomaly_failure.4012.desc:0 "Chúng ta đã nhận được tín hiệu cầu cứu từ [Root.GetName]. Thủy thủ bắt đầu tàn sát lẫn nhau một cách điên cuồng! Thuyền trưởng đã mất kiểm soát, phái tàu cứu viện đã không còn kịp nữa rồi. Chuyện này có liên quan đến con tàu cổ mà họ vừa điều tra không?"
 anomaly_failure.4012.a.tooltip:0 "§Y[Root.GetName]§! đã bị tiêu diệt."
 anomaly_failure.4015.desc:0 "Các thủy thủ của [Root.GetName] báo cáo rằng, họ không phát hiện thấy thứ gì có giá trị."
 anomaly_failure.4025.desc:0 "Đội ngũ nghiên cứu khoa học của [Root.GetName] báo cáo rằng, họ đã không thể tìm thấy dữ liệu quý giá trên [From.From.GetName] như dự tính."
 anomaly_failure.4030.desc:0 "Lật tung cả sa mạc, chúng ta cũng không thể tìm thấy thứ gì có giá trị!"
 anomaly_failure.4031.desc:0 "Chúng ta đã không thể ngăn chặn trí tuệ nhân tạo trên phi hạm ở [From.From.GetName]. Con tàu cổ của họ bay về phía chân trời xa xôi, tìm kiếm chiến trường tiếp theo theo các thông số chương trình."
 anomaly_failure.4031.a:0 "Cơn thịnh nộ của máy móc là thứ đáng để sợ hãi."
 anomaly_failure.4035.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] báo cáo rằng, bức xạ mà họ dày công tìm kiếm là do lỗi chỉ số gây ra bởi sự bất thường đột phát của thiết bị. Hiện tại đã được sửa xong rồi."
 anomaly_failure.4037.desc:0 "Dựa theo chỉ số bức xạ, đây không phải là hệ sao mà chúng ta đang tìm kiếm."
 anomaly_failure.4037.a:0 "Chúng ta phải tiếp tục điều tra."
 anomaly_failure.4045.desc:0 "Chúng ta đơn giản là không thể xác định được nguồn gốc của chỉ số yếu ớt trên [From.From.GetName]. Đội nghiên cứu khoa học thất lạc biểu thị sẽ tự kiểm điểm và chấn chỉnh."
 anomaly_failure.4055.desc:0 "[Root.GetName] báo cáo rằng, họ đã không thể tìm thấy thứ mà ban đầu hứa hẹn sẽ tìm thấy. Sĩ quan khoa học [Root.GetLeaderName] vì thế mà tâm phiền ý loạn, và xin lỗi vì sai sót."
 anomaly_failure.4055.a:0 "Đừng lo lắng, [Root.GetLeaderName]."
 anomaly_failure.4055.b:0 "Đừng phạm sai lầm nữa."
 anomaly_failure.4060.desc:0 "Sau khi điều tra kỹ lưỡng, sĩ quan khoa học [Root.GetLeaderName] chỉ phát hiện được những mảnh vỡ không gian thông thường trên quỹ đạo ngôi sao. Chúng có thể bắt nguồn từ vành đai tiểu hành tinh gần đó."
 anomaly_failure.4066.desc:0 "Mọi thứ đã quá muộn, chúng ta không thể ngăn chặn mũi khoan đang tiến tới. Nó khoan quá sâu, cuối cùng bị những khối đá nặng nề ép nát."
 anomaly_failure.4070.desc:0 "Sĩ quan khoa học [Root.GetLeaderName] báo cáo rằng, quỹ đạo mà [From.From.GetPlanetMoon][From.From.GetName] tuân theo giống với quỹ đạo dự tính của [From.From.GetPlanetMoon] nhiệt đới thông thường. Báo cáo bất thường lần này dường như là báo cáo sai."
 anomaly_failure.4071.desc:0 "Chúng ta đã gặp rắc rối, khác với kết quả quét sơ bộ, [From.From.GetName] thực ra vô cùng nguy hiểm. Việc thuộc địa hóa nó có thể gặp phải các tình huống bất lợi, như thời tiết thảm họa, nhiệt độ cao và động thực vật có độc."
 anomaly_failure.4075.desc:0 "Khí hậu khắc nghiệt đã gây ra tổn thất lớn, và đội ngũ khoa học của chúng ta đã không thể khám phá thêm bất kỳ điều gì về [From.From.GetName] mà chúng ta chưa biết từ trước."
 anomaly_failure.4080.desc:0 "[From.From.GetPlanetMoon] dường như không đặc biệt như dự tính ban đầu. Sự bất thường của chỉ số trước đó dường như là do các mạch khoáng đối xứng hình thành một cách ngẫu nhiên gây ra."
 anomaly_failure.4081.desc:0 "Công trình sửa chữa của [From.From.From.GetName] truyền về tin xấu. Công nhân xây dựng đã không thể sửa chữa được bộ máy hỏng hóc, bộ máy bắt đầu tự tan rã, đã không còn cách nào sửa chữa được nữa rồi."
 anomaly_failure.4086.desc:0 "Rất tiếc, đã không thể giải cứu con tàu trôi dạt gần [From.From.From.GetName]. Một tiểu hành tinh chưa được dò ra đột nhiên xuất hiện trên quỹ đạo va chạm, đập con tàu đó thành từng mảnh vụn."
 anomaly_failure.4086.military:0 "Hàng hóa trên đó quan trọng hơn."
 anomaly_failure.4090.desc:0 "Chúng ta đã mất dấu tín hiệu. Tín hiệu đó dường như là do một con tàu phát ra, nhưng đột nhiên biến mất. Có lẽ nó đã thực hiện bước nhảy siêu quang tốc, hoặc đã gặp phải tình huống đáng sợ hơn."
 anomaly_failure.4090.a:0 "Một cơ hội tiếp xúc mới cứ thế bị mất đi rồi."
 anomaly_failure.4090.b:0 "Rất tốt. Chúng ta vốn chẳng quan tâm đến người ngoài hành tinh."
 anomaly_failure.4116.desc:0 "Con tàu bị quái thú xâm chiếm đã gửi về bức điện cuối cùng. Những dã thú đó đã thành công đột phá đến nơi ẩn náu của các thủy thủ.\n\nTình hình quá mức tàn khốc, không cần mô tả nhiều nữa. Không có người sống sót."
 anomaly_failure.4116.a:0 "Chúng ta đã phụ lòng họ..."
 anomaly_failure.4116.a.tooltip:0 "§YTàu nghiên cứu§! bị tiêu diệt."
 anomaly_failure.4136.desc:0 "Vô cùng đáng tiếc, các nhà ngôn ngữ học của chúng ta đã không thể hiểu hoàn toàn ngôn ngữ ngoại tộc trong các tài liệu cổ xưa trên [From.From.From.GetName]. Tuy nhiên, họ đã dịch được một số nội dung cốt lõi, giúp chúng ta có cái nhìn thoáng qua về văn hóa của văn minh đó."
 anomaly_failure.4156.desc:0 "Trong khi dọn dẹp dã thú gần nơi trú ẩn dưới lòng đất của [WarriorHomePlanet.GetName], cuộc chiến đã vô tình dẫn đến việc kiến trúc bị sụp đổ. Chúng ta đã không thể thu hồi được thứ gì có giá trị từ đống đổ nát."
 anomaly_failure.4157.base:0 "Sau khi mở bình chứa phát hiện trên [WarriorHomePlanet.GetName], chúng ta đã tìm thấy một số mẫu vật cây trồng khỏe mạnh, còn có một số thiết bị hỗ trợ, điều này có thể giúp mẫu vật sinh trưởng trở lại trong điều kiện màu mỡ."
 anomaly_failure.4157.desc:0 "$anomaly_failure.4157.base$ Chúng ta có thể dùng kỹ thuật đảo ngược để nghiên cứu nó."
 anomaly_failure.4157.maxed.desc:0 "$anomaly_failure.4157.base$.\n\nMặc dù ý nghĩa không lớn, nhưng dữ liệu lịch sử văn hóa của văn minh này có thể giúp chúng ta hiểu rõ hơn về bộ mặt thật của họ."
 anomaly_failure.4158.desc:0 "Sau khi mở bình chứa phát hiện trên [WarriorHomePlanet.GetName], chúng ta mới nhận ra đó là một thiết bị phóng vũ khí sinh học.\n\nLoại vũ khí sinh học này chuyên dùng để làm giảm khả năng sinh sản của mục tiêu, và lây lan nhanh chóng. Tuy nhiên nó không tương thích với các nhân tố di truyền của chúng ta, nên sẽ không ảnh hưởng đến số lượng chủng tộc của chúng ta."
 anomaly_failure.4158.a.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §RVũ khí sinh học ức chế sinh sản§!."
 anomaly_failure.4170.base.desc:0 "Cơ sở khai thác khí đốt trên [From.GetName] đã hóa thành một biển lửa. Theo báo cáo, loại khí cực kỳ dễ cháy đó đã gặp phải lửa hở, dẫn đến vụ nổ của nhiều cơ sở! Sau một chuỗi phản ứng dây chuyền, gần như đã làm nổ tung toàn bộ các mỏ khí đốt mà chúng ta đã dò ra."
 anomaly_failure.4170.individ.desc:0 "$anomaly_failure.4170.base.desc$\n\nKhông thể phạm phải sai lầm tương tự nữa."
 anomaly_failure.4170.basic.desc:0 "$anomaly_failure.4170.base.desc$\n\nChúng ta sẽ mặc niệm cho các đồng bào đã hy sinh trong vụ nổ."
 anomaly_failure.4170.base.tooltip:0 "[From.GetName] mất đi hiệu ứng §Y“Khai thác khí dồi dào”§!"
 anomaly_failure.4170.a.tooltip:0 "$anomaly_failure.4170.base.tooltip$。"
 anomaly_failure.4170.b.tooltip:0 "$anomaly_failure.4170.base.tooltip$ và mất đi §R100§! £pop£ §Hdân số§!."
 anomaly_failure.4170.c.tooltip:0 "$anomaly_failure.4170.base.tooltip$ và mất đi §R200§! £pop£ §Hdân số§!."
 anomaly_failure.4170.d.tooltip:0 "$anomaly_failure.4170.base.tooltip$ và mất đi §R300§! £pop£ §Hdân số§!."

 ####################################
 # Colony Events
 ####################################
 colony.2001.name:0 "Phiền não chốn thiên đường"
 colony.2001.desc:0 "Sai sót của chính quyền địa phương trên [Root.GetName] đã dẫn đến việc một nhóm nhỏ phiến quân thu hút được nhiều người ủng hộ hơn, họ phản đối tư tưởng truyền thống của chúng ta. Số người ủng hộ họ ngày càng tăng, điều này giúp họ có được quyền lực lớn hơn trong khu vực. Sự ủng hộ như vậy đồng thời cũng giúp họ đạt được thành công nhất định trong việc giành lấy sự ủng hộ của dân chúng, họ có thể tận dụng những sự ủng hộ này để phát triển sự nghiệp của chính mình."
 colony.2001.a:0 "Vạch rõ giới hạn với họ."
 colony.2001.a.military.tooltip:1 "§Y300§! £pop£ §HDân số§! trên [Root.GetName] chuyển dịch mạnh hơn sang §YChủ nghĩa quân phiệt§!."
 colony.2001.a.pacifist.tooltip:1 "§Y300§! £pop£ §HDân số§! trên [Root.GetName] chuyển dịch mạnh hơn sang §YChủ nghĩa hòa bình§!."
 colony.2001.b:0 "Trấn áp bạo động!"
 colony.2001.b.military.tooltip:0 "Khoảng §Y100§! £pop£ §HDân cư§! trên [Root.GetName] nhận Tư tưởng §YQuân Phiệt§!."
 colony.2001.b.pacifism.tooltip:0 "Khoảng §Y100§! £pop£ §HDân cư§! trên [Root.GetName] nhận Tư tưởng §YHòa Bình§!."
 colony.2001.b.tooltip:1 "\n\nThêm hiệu ứng §R$suppressed_opposition$§! vào [Root.GetName], hiệu quả như sau: \n£happiness£ Hạnh phúc §R-15%§!"
 colony.2005.name:0 "Dưới những con sóng"
 colony.2005.desc:0 "Để cải thiện đời sống hàng ngày, những người thuộc địa trên [Root.GetName] bắt đầu định kỳ khám phá tài nguyên trên hành tinh. Trong một cuộc khám phá vùng cực bắc gần đây, đã phát hiện một vật thể khổng lồ dưới biển sâu: một tàu chiến tuần dương ngoại tộc.\n\nÁp suất biển sâu có thể gây ra khó khăn, nhưng vẫn có khả năng trục vớt con tàu đắm này."
 colony.2005.a:0 "Thử trục vớt."
 colony.2005.b:0 "Tháo dỡ và nghiên cứu những bí mật bên trong."
 colony.2006.desc:0 "Nhiệm vụ trục vớt trên [Root.GetName] diễn ra suôn sẻ! Con tàu tuần dương viễn cổ chìm dưới đáy biển đã tái xuất hiện trên mặt nước, và đã được sửa chữa xong. Thật là một cảnh tượng hùng vĩ, thông qua việc sửa chữa nó, các kỹ sư của chúng ta đã học được những bí mật đằng sau thiết kế của nó."
 colony.2006.a.material:0 "Sự nỗ lực của chúng ta sẽ dẫn lối chúng ta tiến lên!"
 colony.2006.a.phile:0 "Một ngày mang ý nghĩa lịch sử!"
 colony.2006.a.tooltip:0 "§YĐế chế của bạn§! nhận được hiệu ứng §G$streamlined_ship_design$§!.\n\nNhận được một con tàu loại §YTàu tuần dương§!."
 colony.2007.desc:0 "Chúng ta đã thử trục vớt con tàu khổng lồ này từ biển sâu [Root.GetName], và đã có phát hiện nhất định về thiết kế thân tàu của nó. Thuật toán cơ động của con tàu này rất dễ dàng chuyển sang sử dụng cho phần cứng của chúng ta, giúp tàu của chúng ta linh hoạt hơn, tiết kiệm năng lượng hơn.\n\nĐáng tiếc là, bản thân con tàu đã không thể cứu vãn được nữa, nhưng chúng ta vẫn có thể thu hồi được một số vật liệu từ thân tàu của nó."
 colony.2007.a.phobe:0 "Dù sao thì tàu ngoại tộc cũng không thể sánh được với tàu của chúng ta!"
 colony.2007.a.phile:0 "Món quà để lại bởi bất kỳ chủng tộc nào trong vũ trụ đều có giá trị!"
 colony.2007.a:0 "§YĐế chế của bạn§! nhận được hiệu ứng §G$streamlined_ship_design$§!.\n\n"
 colony.2008.desc:0 "Tiếng nổ có thể nghe thấy rõ ràng từ cách đó vài dặm, hành động trục vớt tàu đắm đã kết thúc bằng thất bại thảm hại. Cư dân trên [Root.GetName] không bị thương hại, nhưng một phần kiến trúc đã bị phá hoại.\n\nXác tàu bị nổ thành từng mảnh vụn, đã không thể sửa chữa. May mắn thay, chúng ta đã thu hồi được nhiều mảnh vỡ."
 colony.2008.a.tooltip:0 "Một tòa nhà £building£ trên [Root.GetName] bị §Rphá hủy§!.\n\n"
 colony.2010.name:0 "Chuyển biến tư duy"
 colony.2010.desc.spirit:0 "Khi chúng ta bén rễ trên [Root.GetName], một số cư dân bắt đầu đi chệch khỏi con đường ban đầu của chúng ta. Mặc dù đây là chuyện nằm trong dự tính, nhưng họ đã có không ít người ủng hộ. Nhóm này cho rằng, thế giới quan duy tâm vũ trụ của chúng ta không thể nhanh chóng dẫn dắt chúng ta tiến lên, và họ tin chắc thế giới quan duy vật hơn mới là câu trả lời."
 colony.2010.desc.material:0 "Khi sự bành trướng của chúng ta trên [Root.GetName] dần ổn định, một số cư dân bắt đầu đi chệch khỏi thế giới quan ban đầu của chúng ta. Một nhóm người duy tâm bắt đầu hòa bình truyền bá tư tưởng để phản đối chính quyền của chúng ta. Họ cho rằng quan điểm duy vật vũ trụ của chúng ta đang khiến chúng ta tự kén mình lại, và khiến chúng ta ngày càng xa rời linh hồn."
 colony.2010.a.spirit:0 "Để nó tự phát triển."
 colony.2010.a.spirit.tooltip:2 "Khoảng §Y500§! £pop£ §HDân cư§! nhận Tư tưởng §YDuy Vật§!."
 colony.2010.a.material:0 "Họ sẽ không cấu thành đe dọa đối với chúng ta."
 colony.2010.a.material.tooltip:2 "Khoảng §Y500§! £pop£ §HDân cư§! nhận Tư tưởng §YDuy Linh§!."
 colony.2010.b:0 "Mua chuộc thủ lĩnh của họ."
 colony.2010.b.tooltip:0 "Không có £pop£ §HDân số§! nào thay đổi tư tưởng.\n\n"
 colony.2010.c.material:0 "Triển khai thông báo phản chế quy mô lớn."
 colony.2010.c.material.tooltip:2 "Sẽ cố gắng thuyết phục £pop£ §HDân cư Duy Linh§! trên [Root.GetName] và thúc đẩy §YChủ nghĩa Duy vật§!.\nKhoảng §Y300§! £pop£ §HDân cư§! nhận Tư tưởng §YDuy Linh§!."
 colony.2010.c.spirit:0 "Để người dẫn dắt tinh thần giúp họ cải tà quy chính."
 colony.2010.c.spirit.tooltip:2 "Sẽ cố gắng thuyết phục £pop£ §HDân cư Duy Vật§! trên [Root.GetName] và thúc đẩy §YChủ nghĩa Duy tâm§!.\nKhoảng §Y300§! £pop£ §HDân cư§! nhận Tư tưởng §YDuy Vật§!."
 colony.2011.desc.base:0 "Đã thành công tái giáo dục một phần dân số có ý định phản đối tư tưởng chính của chúng ta."
 colony.2011.desc.spirit:1 "Nhờ vào nỗ lực không ngừng nghỉ của thủ lĩnh tinh thần của chúng ta, cuối cùng chúng ta đã xoay chuyển được tình thế, thu hút được ngày càng nhiều người không có đức tin. Những người này không giới hạn ở những người duy vật, thậm chí bao gồm cả những người thuộc tôn giáo khác. Nguyện họ từ nay về sau không còn lầm đường lạc lối nữa."
 colony.2011.desc.material:1 "$colony.2011.desc.base$ Bộ máy tuyên truyền của chúng ta vận hành đúng như kế hoạch. Không chỉ là những người duy tâm, mà cả những kẻ ba phải cũng đã hiểu được sự quý giá của lý trí, và vì để ủng hộ chủ nghĩa duy vật mà từ bỏ những vọng tưởng trước kia của họ."
 colony.2011.a.spirit.tooltip:2 "Toàn bộ £pop£ §HDân cư§! mất Tư tưởng §YDuy Vật§!."
 colony.2011.a.material.tooltip:2 "Toàn bộ £pop£ §HDân cư§! mất Tư tưởng §YDuy Linh§!."
 colony.2012.desc:1 "Nỗ lực thay đổi tư tưởng dân số trên [Root.GetName] của chúng ta chẳng khác nào gậy ông đập lưng ông. Bằng cách đoàn kết lại phản kháng sự trấn áp văn hóa của chúng ta, họ đã có thêm nhiều người theo đuổi hơn, điều này khiến họ trở nên mạnh mẽ hơn cả trước kia."
 colony.2012.a.spirit.tooltip:1 "Tất cả dân số duy vật trên [Root.GetName] nhận được hiệu ứng §R$opinion_disrespected$§!, hiệu quả là: \n£happiness£ Hạnh phúc §R-40%§!\n\nThêm hiệu ứng §Y$materialist_attraction$§!, hiệu quả là: \nSức hút tư tưởng duy vật §G+100%§!, thời hạn 20 năm"
 colony.2012.a.material.tooltip:2 "Tất cả dân số duy tâm trên [Root.GetName] nhận được hiệu ứng §R$opinion_disrespected$§!, hiệu quả là: \n£happiness£ Hạnh phúc §R-40%§!\n\nTăng hiệu ứng §Y$spiritualist_attraction$§!, hiệu quả là: \nSức hút tư tưởng duy tâm §G+100%§!, thời hạn 20 năm"
 colony.2015.name:0 "Nhà máy quái dị"
 colony.2015.desc:0 "Một đội điều tra đã phát hiện ra nhà máy ẩn giấu trên [Root.GetName]. Dựa theo cấu trúc xây dựng và mức độ mài mòn mà phán đoán, nó bắt nguồn từ một văn minh cổ xưa, văn minh này vô cùng giỏi việc xây dựng những kiến trúc chịu được sự thử thách của thời gian.\n\nChúng ta có thể dễ dàng sử dụng nhà máy này, tăng sản lượng của thuộc địa."
 colony.2015.a.tooltip:0 "Trên bề mặt [Root.GetName] xuất hiện một tòa nhà §S£building£ Nhà máy quái dị§!."
 colony.2016.desc:0 "Những nhân viên làm việc tại nhà máy quái dị trên [Root.GetName] đột nhiên mất tích! Chúng ta có thể phái công nhân thay thế, hoặc để phòng hờ, trực tiếp san bằng nhà máy."
 colony.2016.a:0 "Thứ này vẫn có ích đối với chúng ta."
 colony.2016.a.tooltip:1 "§R100§! £pop£ §HDân số§! trên [Root.GetName] mất tích."
 colony.2016.b:0 "Phá dỡ nó."
 colony.2016.b.tooltip:0 "§S£building£ Nhà máy quái dị§! đã bị phá hủy."
 colony.2017.desc:0 "Sau khi đến làm việc tại nhà máy quái dị đó, đội công nhân thứ hai cũng mất tích! May mắn thay, một trong số các công nhân đã để lại ghi chép. Ghi chép cho thấy nơi đó có không ít bẫy rập, những bẫy rập này chuyên dùng để bắt giữ những công nhân không có sự phòng bị.\n\nBẫy rập đã được loại bỏ, hiện tại hẳn là có thể sử dụng nhà máy bình thường rồi. Nhưng bất luận giải thích thế nào, dân chúng vẫn vô cùng lo lắng về những bẫy rập chí mạng tiềm tàng."
 colony.2017.a:0 "Mọi người sẽ thích nghi thôi."
 colony.2017.b:0 "Đầu tư vào các cơ sở an ninh tại nơi này."
 colony.2017.a.tooltip:0 "Lại có §R100§! £pop£ §HDân số§! mất tích trên [Root.GetName].\n\n"
 colony.2017.b.tooltip:0 "Lại có §R100§! £pop£ §HDân số§! mất tích trên [Root.GetName].\n\n"
 colony.2018.desc:0 "Do công nhân kích hoạt một chương trình tự hủy nào đó, nhà máy này đã phát nổ. May mắn là khi tòa nhà sụp đổ không có thương vong về người.\n\nChúng ta nên có thể thu hồi được một số tài nguyên từ đống đổ nát."
 colony.2018.a:0 "Thu hồi tài nguyên năng lượng."
 colony.2018.b:0 "Thu hồi tài nguyên khoáng vật."
 colony.2018.a.tooltip:1 "§YNhà máy quái dị§! trên [Root.GetName] bị §Rphá hủy§!.\n\nBề mặt của [Root.GetName] tăng thêm các tài nguyên sau: \n£energy£ §G+4§!"
 colony.2018.b.tooltip:1 "§YNhà máy quái dị§! trên [Root.GetName] bị §Rphá hủy§!.\n\nBề mặt của [Root.GetName] tăng thêm các tài nguyên sau: \n£minerals£ §G+4§!"
 colony.2019.desc:0 "Nhà máy quái dị trên [Root.GetName] không xuất hiện bất kỳ sự bất thường nào. Thuộc địa sẽ duy trì sản lượng như dự tính."
 colony.2020.desc:0 "Đội phá dỡ của chúng ta truyền về tin tức, nhà máy trên [Root.GetName] đã được loại bỏ. Hy vọng đây là chuyện tốt.\n\nChúng ta nên có thể thu hồi được một số tài nguyên từ đống đổ nát."
 colony.2020.a.tooltip:1 "Bề mặt của [Root.GetName] tăng thêm các tài nguyên sau: \n£energy£ §G+3§!\n\n"
 colony.2020.b.tooltip:1 "Bề mặt của [Root.GetName] tăng thêm các tài nguyên sau: \n£minerals£ §G+3§!\n\n"
 colony.2025.name:0 "Rạn nứt giữa các loài"
 colony.2025.desc:0 "Trên [Root.GetName], giống loài của ta và các loài khác cùng chung sống đang nảy sinh bất hòa. Chưa rõ nguyên do cụ thể, có thể vì khác biệt lối sống, tính khép kín hay đơn thuần là hiểu lầm. Nhưng rõ ràng, nếu cứ mặc kệ thì những vụ va chạm nhỏ này sẽ ngày càng dữ dội hơn."
 colony.2025.phobe.desc:0 "Trên [Root.GetName], lũ người ngoài hành tinh sống lẫn với chúng ta bắt đầu giở trò gây chuyện. Điều này đã chọc giận dân chúng, ngày càng có thêm nhiều vụ ẩu đả nổ ra. Nếu cứ ngồi yên không quản, e rằng đám ngoại tộc kia sẽ chịu tổn thất nặng nề."
 colony.2025.phile.desc:0 "Cùng chung sống với giống loài khác chưa bao giờ là chuyện dễ dàng. Trên [Root.GetName], vì chưa thể giúp người ngoài hành tinh hòa nhập tốt vào xã hội, những mối bất hòa đã âm thầm nhen nhóm. Nếu chúng ta không có hành động giải quyết, hiểm họa rất có thể sẽ bùng phát."
 colony.2025.a:0 "Giải tán đám đông giận dữ."
 colony.2025.a.phobe:0 "Cách ly người ngoài hành tinh khỏi đám đông giận dữ."
 colony.2025.a.tooltip:1 "Toàn bộ dân số [MyEmpire.GetSpeciesName] mang $ethic_xenophobe$ trên [Root.GetName] đều nhận hiệu chỉnh §R$pop_angered$§! trong §Y24§! tháng, với tác động như sau:\n£happiness£ Độ hạnh phúc §R-25%§!\nSản lượng tài nguyên §R-25%§!\n\n"
 colony.2025.a.phile:0 "Bảo vệ cộng đồng thiểu số bằng mọi giá."
 colony.2025.a.phile.tooltip:1 "Toàn bộ dân số [MyEmpire.GetSpeciesName] mang $ethic_xenophobe$ trên [Root.GetName] đều nhận hiệu chỉnh §R$pop_angered$§! trong §Y24§! tháng, với tác động như sau:\n£happiness£ Độ hạnh phúc §R-25%§!\nSản lượng §R-25%§!\n\nToàn bộ dân số ngoài hành tinh và có đặc tính chuộng ngoại trên [Root.GetName] đều nhận hiệu chỉnh §G$pop_pleased$§! trong §Y12§! tháng, với tác động như sau:\n£happiness£ Độ hạnh phúc §G+25%§!\nSản lượng tài nguyên §G+25%§!\n\n"
 colony.2025.b:0 "Đừng nhúng tay vào."
 colony.2025.b.phobe:0 "Mặc kệ lũ người ngoài hành tinh tự sinh tự diệt."
 colony.2025.b.tooltip:1 "1 dân số ngoài hành tinh bị tiêu diệt.\n\nToàn bộ dân số ngoài hành tinh và có đặc tính chuộng ngoại trên [Root.GetName] đều nhận hiệu chỉnh §R$pop_angered$§! trong §Y12§! tháng, với tác động như sau:\n£happiness£ Độ hạnh phúc §R-25%§!\nSản lượng tài nguyên §R-25%§!\n\n"
 colony.2030.name:0 "Sát thủ thuộc địa"
 colony.2030.desc.base:0 "Chúng ta phát hiện Tổng đốc tại §Y[Root.GetName]§! đã tử vong! Có người đã tận mắt chứng kiến hung thủ cố gắng chạy trốn, sát thủ đến từ §Y[AssassinEmpire.GetName]§!."
 colony.2030.desc:0 "$colony.2030.desc.base$ Cách chúng ta xử lý hung thủ sẽ gây ra ảnh hưởng đến mối quan hệ vốn đã căng thẳng của chúng ta."
 colony.2030.desc.military:0 "$colony.2030.desc.base$ Hành vi xâm phạm đầy tính khiêu khích này mới chỉ là sự khởi đầu."
 colony.2030.desc.phobe:0 "$colony.2030.desc.base$ Người ngoài hành tinh sẽ không biết cách kiềm chế."
 colony.2030.desc.spirit:0 "$colony.2030.desc.base$ Cuộc tấn công lần này không chỉ là nhắm vào chúng ta, mà còn là nhắm vào thần linh của chúng ta."
 colony.2030.a:0 "An toàn dẫn độ sát thủ về nước để bày tỏ thành ý."
 colony.2030.a.tooltip:0 "§Y[AssassinEmpire.GetName]§! nhận được hiệu ứng đánh giá §G$assassination_forgiven$§! đối với §Y[MyCountry.GetName]§!: \n£opinion£ Đánh giá §G+35§!\n"
 colony.2030.b:0 "Khai thác thêm thông tin từ miệng sát thủ."
 colony.2030.c:0 "Tiêu diệt sát thủ và chuyển phát thông điệp."
 colony.2030.d:0 "Tiêu diệt sát thủ để phô diễn sức mạnh."
 colony.2035.name:0 "Tính lây nhiễm"
 colony.2035.desc:0 "Một số khu vực tập trung dân cư của [Root.GetName] báo cáo cho biết, dân chúng đã phải chịu đựng đợt lây nhiễm quy mô lớn chưa từng có. Loại bệnh này có nhiều chủng mầm bệnh. Bệnh nhân bị lây nhiễm gần như không thể cử động và bị khó thở nghiêm trọng.\n\nNếu dịch bệnh không được kiểm soát, [Root.GetName] sẽ đón nhận ngày tận thế."
 colony.2035.desc.material:0 "Một số khu vực tập trung dân cư của [Root.GetName] nộp báo cáo cho biết, dân chúng nơi đó bị lây nhiễm một loại bệnh nghiêm trọng nào đó. Loại bệnh này lây lan cực kỳ nhanh chóng, và có nhiều mầm bệnh không ngừng tiến hóa nhanh chóng, nếu không kịp thời can thiệp sẽ cản trở việc sản xuất và phát triển của khu vực.\n\nNếu không nhanh chóng áp dụng các biện pháp, việc xây dựng thuộc địa sẽ đình trệ thậm chí là thụt lùi nhiều năm."
 colony.2035.desc.spirit:0 "Một số khu vực tập trung dân cư của [Root.GetName] rơi vào một dịch bệnh không rõ nguồn gốc và vô cùng đáng sợ. Các nhà khoa học hoàn toàn không biết gì về nó. Do các biến chứng đa dạng, loại bệnh này tạm thời khiến người ta không biết phải xoay xở thế nào. Mà những biến chứng này cuối cùng đều sẽ theo virus lan rộng khắp cơ thể mà dẫn đến bệnh nhân thần chí bất minh.\n\nNếu không áp dụng các biện pháp, nhiều linh hồn vô tội sẽ sa vào bóng tối."
 colony.2035.a:0 "Xây dựng bệnh viện để tiếp nhận bệnh nhân và tiến hành nghiên cứu."
 colony.2035.a.tooltip:0 "Đặt một tòa nhà £building£ §Y$building_quarantine$§! vào §Y[Root.GetName]§!.\n\n"
 colony.2035.b.tooltip:0 "§RThay thế§! 1 tòa nhà hiện có của §Y[Root.GetName]§! bằng một tòa nhà £building£ §Y$building_quarantine$§!.\n\n"
 colony.2035.c:0 "Ra lệnh cho những người bị lây nhiễm vào khu cách ly."
 colony.2035.c.spirit:0 "Cách ly những người bị lây nhiễm và cầu nguyện cho họ là đã đủ rồi."
 colony.2035.c.tooltip:0 "Loại bỏ toàn bộ thành viên bị lây nhiễm của §Y[Root.GetName]§!."
 colony.2035.c.material:0 "Để những thành viên bị lây nhiễm biến mất không đau đớn, triệt tiêu rủi ro lây lan."
 colony.2035.c.badguy:0 "Tiêu diệt toàn bộ những người bị lây nhiễm."
 colony.2035.c.tooltip.kill:0 "Tiêu diệt toàn bộ thành viên bị lây nhiễm của [Root.GetName]."
 colony.2036.desc:0 "Ngay cả khi chúng ta đã dốc hết sức cố gắng kiểm soát rủi ro lây lan, dịch bệnh của [Root.GetName] trông có vẻ còn khó xử lý hơn so với chúng ta dự tính. Nhiều người hơn đã xuất hiện các triệu chứng bệnh tương tự. Chúng ta phải suy nghĩ lại phương án giải quyết."
 colony.2036.c:0 "Cưỡng chế những người bị lây nhiễm một lần nữa tiến vào khu cách ly."
 colony.2036.c.spirit:0 "Tiến hành cách ly những người bị lây nhiễm mới."
 colony.2036.c.material:0 "Cho những kẻ nhiễm bệnh an tử một lần nữa."
 colony.2036.c.badguy:0 "Lại một lần nữa tiêu diệt toàn bộ những người bị lây nhiễm."
 colony.2040.desc:0 "Dịch bệnh nhanh chóng lan rộng thành thảm họa trên [Root.GetName]. Chúng ta cần nhanh chóng hành động và đưa những người bị lây nhiễm vào viện nghiên cứu khẩn cấp. Hy vọng chúng ta có thể tìm ra phương án điều trị, nếu họ có thể trụ được đến khi chúng ta tìm ra nguồn gốc phát bệnh."
 colony.2046.desc:0 "Dịch bệnh hoành hành trên [Root.GetName] đã mang đi nạn nhân đầu tiên. Chúng ta cần đảm bảo trong trạm cấp cứu có đội thử nghiệm tiến hành nghiên cứu dịch bệnh, từ đó làm tăng khả năng tìm ra phương án điều trị."
 colony.2046.a:0 "Nếu có thêm nhiều người tử vong, hãy kịp thời báo cho tôi biết."
 colony.2046.b:0 "Đừng báo cho tôi tình hình mới nhất."
 colony.2047.desc:0 "Lại một nhóm người bị lây nhiễm của [Root.GetName] đã qua đời."
 colony.2041.desc:1 "Một trạm cấp cứu của [Root.GetName] đã thành công chữa khỏi cho một nhóm bệnh nhân trong thử nghiệm lâm sàng. Chúng ta nên phái thêm nhiều bệnh nhân qua đó để tiếp nhận điều trị."
 colony.2041.b.desc:0 "Một phòng khám của [Root.GetName] đã tiến hành phân nhóm lấy mẫu ngẫu nhiên đối với bệnh nhân, và thành công chữa khỏi bệnh cho một nhóm bệnh nhân trong đó. Chúng ta nên phái mọi người đến phòng khám để đẩy nhanh việc xác nhận phương án điều trị."
 colony.2042.desc:0 "Sau khi thành công điều trị cho nhiều bệnh nhân của [Root.GetName], các nhà nghiên cứu của chúng ta đã thành công tổng hợp ra vaccine. Sau khi có vaccine chúng ta liền có thể nhanh chóng chữa khỏi cho toàn bộ bệnh nhân. Sự hoảng loạn do dịch bệnh mang lại cuối cùng đã đi đến hồi kết!"
 colony.2043.desc:0 "Bệnh nhân bị lây nhiễm cuối cùng của [Root.GetName] đã thành công được chữa khỏi. Trông có vẻ dịch bệnh vào lúc này đã không tìm thấy vật chủ mới nữa rồi."
 colony.2044.desc:0 "[Root.GetName] đã trở thành một hành tinh chết. Dân số trên [Root.GetPlanetMoon] đã bị loại bỏ toàn bộ. Tin tốt là dịch bệnh khiến người ta không biết phải xoay xở thế nào cũng đã bị loại bỏ. Hiện tại chúng ta có thể tái phát triển."
 colony.2043.a:0 "Tai họa đã chấm dứt rồi."
 colony.2050.name:0 "Sĩ quan thất bại"
 colony.2050.desc:0 "Do sai sót nghiêm trọng trong việc ghi chép, việc bảo trì cơ sở hạ tầng và dịch vụ nhà ở tại một số khu vực của [Root.GetName] đã trở nên lạc hậu. Mọi người đang sống trong môi trường khá tồi tệ, dường như đã không thể nhẫn nhịn được lâu nữa rồi. Việc sửa chữa những vấn đề này sẽ tiêu tốn thời gian và sức lực của chúng ta."
 colony.2050.a.tooltip:1 "[Root.GetName] nhận được kết quả sau: \n$decrepit_dwellings$ §R+1§!\n$failing_infrastructure$ §R+1§!"
 colony.2050.b:0 "Chúng ta phải tiến hành đầu tư vào khu vực này."
 colony.2050.c:0 "Chúng ta có đội ngũ mạnh mẽ, hãy giúp họ phục hồi."
 colony.2050.d:0 "Trục xuất cư dân nơi đó và san bằng khu vực đó."
 colony.2050.d.tooltip:1 "§S2 tòa nhà £building£§! trên §Y[Root.GetName]§! đã bị §Rphá hủy§!.\n\n§Y200§! £pop£ §HDân số§! trên §Y[Root.GetName]§! nhận được hiệu ứng §R$pop_angered$§!, kéo dài §Y24§! tháng, hiệu quả như sau: \nSản lượng tài nguyên §R-25%§!\n£happiness£ Hạnh phúc §R-25%§!\n\n"
