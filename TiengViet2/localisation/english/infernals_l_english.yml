 job_melt_extractor_drone: "Drone Nhiệt Luyện"
 job_melt_extractor_drone_plural: "Các Drone Nhiệt Luyện"
 job_melt_extractor_drone_desc: "Được chế tạo để chịu được nhiệt độ cực cao, drone này được thiết kế để kết hợp các khoáng sản thành các hợp kim mới hữu ích."
 mod_job_melt_extractor_drone_add: "Công Việc $job_melt_extractor_drone$"
 job_melt_extraction_drone_effect: "£job_mining_drone£ $job_melt_extractor_drone_plural$ sản xuất £minerals£ §Y$minerals$§!"

 job_polytechnic_mentor: "Cố Vấn Nhiệt Kỹ Thuật"
 job_polytechnic_mentor_plural: "Các Cố Vấn Nhiệt Kỹ Thuật"
 job_polytechnic_mentor_desc: "Với nền tảng kỹ năng đa dạng, người cố vấn này giúp thu hẹp khoảng cách giữa các ngành để tăng hiệu quả của các công nhân chuyên môn hóa."
 mod_job_polytechnic_mentor_add: "Công Việc $job_polytechnic_mentor$"
