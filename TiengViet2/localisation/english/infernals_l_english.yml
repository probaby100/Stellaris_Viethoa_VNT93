 infernal_01_shipset_desc: "Nhiệt lượng nóng chảy rực rỡ của những con tàu này thiêu rụi màn đêm lạnh lẽo của không gian vũ trụ. Những tấm giáp cứng cáp của chúng hầu như không kìm hãm nổi ngọn lửa từ các thế giới mà những kẻ tạo ra chúng gọi là quê hương."
