 job_offworld_prospector: "Thợ Thám Hiểm Ngoại Tinh"
 job_offworld_prospector_plural: "Thợ Thám Hiểm Ngoại Tinh"
 job_offworld_prospector_desc: "Những thợ thám hiểm liều lĩnh rời khỏi hành tinh để săn tìm $r_volatile_motes$ và $r_living_metal$ trên các Thế Giới Nóng Chảy."
 mod_job_offworld_prospector_add: "Nghề Nghiệp $job_offworld_prospector$"

 job_offworld_prospector_drone: "Drone Thám Hiểm Ngoại Tinh"
 job_offworld_prospector_drone_plural: "Drone Thám Hiểm Ngoại Tinh"
 job_offworld_prospector_drone_desc: "Drone tầm xa được triển khai đến các Thế Giới Nóng Chảy lân cận để xác định và thu hoạch $r_volatile_motes$ và $r_living_metal$."
 mod_job_offworld_prospector_drone_add: "Nghề Nghiệp $job_offworld_prospector_drone$"

# Councilors
 councilor_infernal_scorcher: "Đại Thiêu Đốt Giả"
 councilor_infernal_scorcher_desc: "$TITLE$ thắp lên ngọn lửa cho lực lượng vũ trang, duy trì sự tận hiến cao nhất cho các nỗ lực quân sự."
 councilor_thermal_engineer: "Kỹ Sư Nhiệt Lượng"
 councilor_thermal_engineer_desc: "$TITLE$ có thể giải quyết các thách thức kỹ thuật gặp phải khi xây dựng cơ sở hạ tầng trong môi trường nhiệt độ cực cao."
 councilor_corporate_thermal_engineer: "Tổng $councilor_thermal_engineer$"
 councilor_corporate_thermal_engineer_desc: "Với mức chi trả xứng đáng, $TITLE$ có thể giải quyết các thách thức kỹ thuật gặp phải khi xây dựng cơ sở hạ tầng trong môi trường nhiệt độ cực cao."
 councilor_pyromanic_priest: "Tư Tế Cuồng Hỏa"
 councilor_pyromanic_priest_desc: "$TITLE$ truyền cho xã hội tình yêu đối với sự gian khổ, giảm thiểu việc tiêu dùng xa hoa suy đồi."
 councilor_imbuement_officer: "Giám Sát Viên Phỏng Sinh"
 councilor_imbuement_officer_desc: "$TITLE$ tận dụng chuyên môn về chất rắn động để hỗ trợ nghiên cứu vật lý và kỹ thuật."
 councilor_synth_imbuement_officer: "Khung Chủ Phỏng Sinh"
 councilor_synth_imbuement_officer_desc: "$TITLE$ tận dụng chuyên môn về chất rắn động để hỗ trợ nghiên cứu vật lý và kỹ thuật."
 councilor_corporate_imbuement_officer: "Quan Chức Đặc Trách Phỏng Sinh"
 councilor_corporate_imbuement_officer_desc: "$TITLE$ điều phối giữa các bên liên quan để thúc đẩy nghiên cứu vật lý và kỹ thuật."

# Bombardment Stances
 bombardment_firestorm: "Bão Lửa"
 bombardment_firestorm_desc: "Oanh tạc bão lửa biến các phần của hành tinh thành biển lửa, đóng vai trò như một đống lửa trại vinh quang củng cố quyết tâm và gắn kết xã hội của chúng ta."
 bombardment_seismic_bombing: "Oanh Tạc Rải Thảm Địa Chấn"
 bombardment_seismic_bombing_desc: "$bombardment_seismic_bombing$ nhắm vào địa chất hành tinh, phá hủy cơ sở hạ tầng và xé toạc lớp vỏ để đánh thức các núi lửa khổng lồ."

# Policies
 orbital_bombardment_devastation: "Tàn Phá"
 orbital_bombardment_devastation_name: "Tàn Phá"
 orbital_bombardment_devastation_desc: "Cho phép sử dụng toàn bộ hỏa lực quỹ đạo với mục đích hủy hoại triệt để bề mặt hành tinh.\n\n§ECho phép lập trường oanh kích quỹ đạo 'Tàn Phá'.§!"
 diplo_stance_devastators: "Kẻ Tàn Phá"
 diplo_stance_devastators_desc: "Đế chế này tìm cách tàn phá triệt để các hành tinh ngoài hành tinh."

# Opinion Modifiers
 triggered_infernals_opinion_of_others: "Không Phải Loài Ưa Nhiệt"
 triggered_infernals_opinion_of_infernals: "Đồng Loại Ưa Nhiệt"

# Casus Belli & War Goal
 casus_belli_cb_blaze: "Ngọn Lửa Thanh Tẩy"
 war_goal_wg_blaze: "Tàn Phá"
 war_goal_wg_blaze_desc: "Chiến tranh được phát động để thiêu rụi thiên hà bằng lửa. Bất kỳ sự kháng cự nào cũng đều là mục tiêu hợp pháp."

# Personalities
 personality_scorching_infernals: "Kẻ Hủy Diệt Rực Lửa"
 personality_scorching_infernals_desc: "$personality_scorching_infernals$ coi các thế giới ngoài hành tinh là địa điểm lý tưởng để tiến hành các nghi lễ lửa hủy diệt. Cư dân bản địa đối với họ chỉ là một phiền toái nhỏ."

# Melting District Deposits
 d_volcanic_ore_veins: "Mạch Quặng Núi Lửa"
 d_volcanic_ore_veins_desc: "Các mạch quặng núi lửa mới nguội cung cấp nguồn quặng trù phú."
 d_volcanic_rich_mountain: "$d_rich_mountain$ Núi Lửa"
 d_volcanic_rich_mountain_desc: "$d_rich_mountain_desc$"
 d_volcanic_mineral_fields: "$d_mineral_fields$ Núi Lửa"
 d_volcanic_mineral_fields_desc: "$d_mineral_fields_desc$"
 d_volcanic_ore_caverns: "$d_ore_rich_caverns$ Núi Lửa"
 d_volcanic_ore_caverns_desc: "$d_ore_rich_caverns_desc$"
 d_volcanic_mineral_layers: "Các Tầng Khoáng Núi Lửa"
 d_volcanic_mineral_layers_desc: "Hoạt động địa chất cổ xưa đã để lại tầng khoáng sản giàu có này vùi sâu dưới bề mặt."
 d_volcanic_weak_crust: "Vỏ Địa Chất Mỏng Manh"
 d_volcanic_weak_crust_desc: "Các mảng kiến tạo bên dưới đã bị nghiền nát bởi các đợt phun trào trước đây, giúp việc khoan sâu vào các mạch giàu khoáng sản trở nên dễ dàng hơn nhiều."
 d_volcanic_mineral_hills: "Đồi Giàu Quặng"
 d_volcanic_mineral_hills_desc: "Ánh sáng lấp lánh mờ ảo từ xa làm lộ rõ sự giàu có của quặng khoáng ngay bên dưới bề mặt những ngọn đồi này."
 d_volcanic_lava_river: "Sông Nham Thạch"
 d_volcanic_lava_river_desc: "Ánh sáng ấm áp, đỏ rực của dòng magma tự do cuộn trào tắm mát đôi bờ của các con sông nham thạch này."

# Thermotechnic District Deposits
 d_volcanic_stable_plateaus: "Cao Nguyên Ổn Định"
 d_volcanic_stable_plateaus_desc: "Các cao nguyên này ổn định về mặt địa chất so với khu vực xung quanh."
 d_volcanic_tranquil_flatlands: "Đồng Bằng Thanh Bình"
 d_volcanic_tranquil_flatlands_desc: "Những vùng đồng bằng thoai thoải này hầu như không bị ảnh hưởng bởi sự hỗn loạn rộng lớn của hành tinh."
 d_volcanic_intraplate: "Vùng Nội Mảng Vững Chắc"
 d_volcanic_intraplate_desc: "Nằm cách xa mọi đường đứt gãy, khu vực này được che chở khỏi sự tàn phá địa chất."
 d_volcanic_basalt_plains: "Đồng Bằng Huyền Vũ Nham"
 d_volcanic_basalt_plains_desc: "Một cao nguyên sáng loáng hình thành từ đá bazan đông đặc, bị nứt nẻ và rỗ tổ ong do các lực núi lửa cổ xưa."
 d_volcanic_sulfur_lava: "Dung Nham Lưu Huỳnh"
 d_volcanic_sulfur_lava_desc: "Dòng dung nham bền bỉ này tỏa ra một hỗn hợp hóa chất đặc biệt vào không khí phía trên."
 d_volcanic_dried_lavariver: "Sông Dung Nham Cạn Khô"
 d_volcanic_dried_lavariver_desc: "Một dòng sông dung nham cổ xưa đã nguội lạnh từ lâu, chỉ để lại vệt cháy đen quét ngang qua vùng đất."
 d_volcanic_tunnels: "Hệ Thống Đường Hầm Cô Lập"
 d_volcanic_tunnels_desc: "Những đường hầm rỗng dài ngoằn ngoèo xuyên qua ngọn núi, thành hầm bị thiêu cháy và mài nhẵn bởi các dòng dung nham cổ xưa."

# Misc Deposits
 d_volcanic_fumarole: "Lỗ Phun Khí Núi Lửa"
 d_volcanic_fumarole_desc: "Những miệng phun há hốc này phả ra $exotic_gases$ nóng bỏng từ sâu trong lòng hành tinh." # an opening in or near a volcano, through which hot sulphurous gases emerge
 d_volcanic_stifling_atmosphere: "Bầu Khí Quyển Ngột Ngạt"
 d_volcanic_stifling_atmosphere_desc: "Tro núi lửa bóp nghẹt bầu khí quyển, bao phủ thế giới trong hoàng hôn mờ mịt ngập tràn khói tro nghẹt thở."
 d_andisol_soil: "Thung Lũng Đất Núi Lửa"
 d_andisol_soil_desc: "Lớp đất đen màu mỡ giàu dinh dưỡng hình thành từ tro núi lửa đem lại cơ hội hiếm hoi để canh tác hoa màu."
 d_red_giant_unstable: "£energy£ §Y+5§!" # star deposit
 d_red_giant_unstable_desc: "$d_red_giant_dm$"
 d_red_giant_dm: "£sr_dark_matter£ §Y+8§!" # star deposit
 d_red_giant_dm_desc: "$d_red_giant_dm$"

# Blockers
 d_seismic_bombing_crater: "£blocker£ Miệng Hố Núi Lửa"
 d_seismic_bombing_crater_desc: "Khu vực này đã bị xé toạc thành vùng núi lửa hoạt động do các đợt oanh tạc rải thảm địa chấn."
 d_large_volcano: "£blocker£ Núi Lửa Khổng Lồ"
 d_large_volcano_desc: "$d_active_volcano_desc$"
 d_ash_storms: "£blocker£ Bão Tro Bụi"
 d_ash_storms_desc: "Khu vực này bị bọc kín trong những đám mây tro bụi nghẹt thở."
 d_charged_atmosphere: "£blocker£ Bầu Khí Quyển Nhiễm Điện"
 d_charged_atmosphere_desc: "Không khí trong khu vực này phát ra những tia lửa năng lượng nguy hiểm và đầy kích động."
 d_lava_flooding: "£blocker£ Lũ Lụt Dung Nham Theo Mùa"
 d_lava_flooding_desc: "Khu vực này thường xuyên phải hứng chịu những đợt lũ dung nham thiêu đốt theo mùa."
 d_toxic_atmosphere: "£blocker£ Bầu Khí Quyển Độc Hại"
 d_toxic_atmosphere_desc: "Bầu khí quyển ở khu vực này gần như không thể hít thở, chỉ có những sinh vật kiên cường nhất mới có thể sinh tồn."
 d_raging_lavafalls: "£blocker£ Thác Dung Nham Cuồn Cuộn"
 d_raging_lavafalls_desc: "Những dòng thác nham thạch cuồn cuộn đổ xuống như một cảnh tượng ngoạn mục khi chúng tràn qua địa hình."
 d_rugged_landscape: "£blocker£ Địa Hình Hiểm Trở"
 d_rugged_landscape_desc: "Một vùng đất rộng lớn liên tục bị tàn phá bởi hoạt động kiến tạo và núi lửa phun trào."

# Planet Modifiers
 volcanic_critters: "Dạng Sống Chịu Cực Hạn"
 volcanic_critters_desc: "Ngay cả trong một thế giới cực nhiệt và dung nham chết chóc, sự sống vẫn tìm được lối đi."
 volcanic_mineral_rich: "$mineral_rich$"
 volcanic_mineral_rich_desc: "$mineral_rich_desc$"
 volcanic_ultra_rich: "$ultra_rich$"
 volcanic_ultra_rich_desc: "$ultra_rich_desc$"
 volcanic_mineral_poor: "$mineral_poor$"
 volcanic_mineral_poor_desc: "$mineral_poor_desc$"
 volcanic_subterranean: "$subterranean_wildlife$"
 volcanic_subterranean_desc: "$subterranean_wildlife_desc$"
 volcanic_asteroid_impacts: "$asteroid_impacts$"
 volcanic_asteroid_impacts_desc: "$asteroid_impacts_desc$"
 volcanic_asteroid_belt: "$asteroid_belt$"
 volcanic_asteroid_belt_desc: "$asteroid_belt_desc$"
 volcanic_crystal_lake: "Hồ Tinh Thể"
 volcanic_crystal_lake_desc: "Những khối tinh thể khổng lồ rực rỡ với nhiệt lượng và ánh sáng ấm áp từ từ nhô lên từ hồ dung nham này."
 volcanic_hollow_planet: "Hành Tinh Rỗng"
 volcanic_hollow_planet_desc: "Bên dưới bề mặt, những hang động khổng lồ vẫn tồn tại, vang vọng những tiếng vọng trống rỗng của một hành tinh được nhào nặn bởi lửa."
 volcanic_lavafall: "Thác Dung Nham"
 volcanic_lavafall_desc: "Dung nham tự do cuộn trào tại đây, tràn qua một sườn dốc tạo nên màn trình diễn hỏa thuật tự nhiên."
 volcanic_oasis: "Ốc Đảo Địa Ngục"
 volcanic_oasis_desc: "Một lục địa nhỏ xanh tươi, được che chở bởi dãy núi cao khỏi biển lửa cuồng nộ bên ngoài. Hệ động thực vật độc đáo tương phản hoàn toàn với sự hoang tàn ngay bên ngoài rặng núi."

 fractalized_entropy_category: "Độ Hỗn Loạn Phân Nhánh"
 fractalized_entropy_category_desc: "Các cảm biến đã ghi nhận một vật thể kỳ lạ trôi dạt qua vành đai tiểu hành tinh. Nguồn gốc của nó chưa rõ, nhưng quỹ đạo của nó ổn định, cho thấy có thể đánh chặn và kiểm tra."
 infernals.3205.name: "Độ Hỗn Loạn Phân Nhánh"
 infernals.3205.desc: "[Leader.GetName] đã báo cáo về việc phát hiện một cấu trúc cứng cáp, góc cạnh lơ lửng trên quỹ đạo sao ổn định. Được tạo thành từ một loại vật liệu chưa xác định và mang các mặt phẳng góc cạnh gợi nhớ đến cấu trúc tinh thể, vật thể này kháng cự mọi nỗ lực phân tích thành phần. Nó bị khóa theo một hướng cố định, vĩnh viễn hướng về phía ngôi sao mẹ của mình, và chống lại mọi nỗ lực thao túng hay xoay chuyển.\n\nTrong một thử nghiệm có kiểm soát, tàu khảo sát đã phóng một xung năng lượng tập trung vào cấu trúc. Cấu trúc nứt đôi một cách hoàn hảo, tách thành hai nửa đối xứng, mỗi nửa tự tái cấu trúc thành một bản sao thu nhỏ của nguyên mẫu ban đầu. Các xung tiếp theo tạo ra kết quả giống hệt: phân chia, nhân bản và thu nhỏ nhất quán.\n\nCuối cùng, một đám mây phân tán gồm các cấu trúc thu nhỏ đã ổn định trên quỹ đạo. Mỗi mảnh vỡ đều giữ nguyên sự liên kết và hình học chính xác của vật thể tiền thân, và toàn bộ đàn mảnh vỡ phản chiếu hình bóng của cấu trúc gốc.\n\nHiện tượng này hoàn toàn chưa từng có tiền lệ và không thể giải thích. Mọi dữ liệu đo đạc thu thập được đã được lưu trữ để phân tích thêm."
 infernals.3205.a: "Bảo tồn và giám sát các mảnh vỡ."

# Archaeological Sites
 from_the_ashes_site: "Từ Đống Tro Tàn"
 from_the_ashes_site_desc: "Bề mặt của [Planet.GetName] nóng bỏng như thiêu đốt, và khắc nghiệt đối với sự sống sinh học. Hình ảnh về các tàn tích nhân tạo rõ rệt vì thế đã thu hút sự chú ý của các [GetScientistPlural]. Một cuộc điều tra khảo cổ có thể hé lộ ai đã từng ở đây, và chuyện gì đã xảy ra với họ."
 infernals.2700.name: "Đế Chế Bị Quên Lãng"
 infernals.2700.desc: "Dù các tàn tích trên [From.Planet.GetName] thoạt nhìn như được xây bằng đá, việc khai quật và phân tích cho thấy nhiều công trình trong thành phố đã mất này được làm từ một loại vật liệu hữu cơ hóa đá tương tự như gỗ. Không có nguồn vật liệu nào như vậy tồn tại trên hành tinh ngày nay. Các cổ vật nhỏ hơn được làm từ kim loại thô sơ, thủy tinh và các chất hữu cơ hóa đá tương tự, và các [GetScientistPlural] cũng đã tìm thấy hóa thạch của các sinh vật bản địa không còn tồn tại.\n\nCó vẻ như nền văn minh này từng sinh sống trên hành tinh vào thời kỳ mà khí hậu của nó ôn hòa hơn nhiều. Liệu họ đã biến mất từ lâu trước khi hành tinh biến thành trạng thái hiện tại, hay họ đã chứng kiến cuộc chuyển dịch thảm khốc trong những năm tháng cuối cùng của mình?"
 infernals.2705.name: "Nhân Chứng Của Sự Diệt Vong"
 infernals.2705.desc: "Việc khai quật thành phố đổ nát trên [From.Planet.GetName] đã hé lộ những địa điểm có tầm quan trọng văn hóa, được trang trí bằng các hoa văn tinh xảo có thể là chữ viết. Đáng phấn khích nhất, các đội khai quật đã tìm thấy một căn hầm ngầm chứa đầy các kệ, mỗi kệ chứa các tấm đồng mỏng được khắc chữ dày đặc. Bất chấp sự kém hiệu quả của đồng như một phương tiện lưu trữ, đây dường như là một kho lưu trữ văn bản chung của cộng đồng.\n\nCác nỗ lực dịch thuật đã bắt đầu khi các đội khảo cổ tiếp tục mở rộng điều tra khắp thành phố. Câu hỏi về số phận cuối cùng của những người này vẫn còn bỏ ngỏ."
 infernals.2710.name: "Ngày Tận Thế Cận Kề"
 infernals.2710.desc: "Đội ngũ trên [From.Planet.GetName] đã phát hiện một hầm mộ ảm đạm. Nó bao gồm một mạng lưới các rãnh đào ngầm, với hài cốt người ngoài hành tinh ướp xác nằm trong các hốc trên tường, xếp chồng lên nhau ba hoặc bốn cá thể. Đồ tùy táng cho chúng ta cái nhìn thoáng qua về sự phát triển công nghệ của họ, chẳng hạn như súng cầm tay thô sơ, kính viễn vọng quang học đơn giản và kỹ thuật thêu dệt vải phức tạp.\n\nNhiều nút giao thông bên trong hầm mộ được canh gác bởi các bức tượng của loài động vật bản địa đã tuyệt chủng. Những sinh vật này có lớp mai hình vòm tròn, bốn chân ngắn bè và cái đầu nhỏ tù. Ở những mẫu vật được bảo quản tốt hơn, chúng được mô tả trong tư thế khom mình, dùng mai để che chắn khỏi các hình chạm khắc giống như ngọn lửa trên vật liệu phía trên chúng.\n\nÝ nghĩa thực sự của tác phẩm nghệ thuật này có thể đã thất truyền theo thời gian, nhưng nó có thể khắc họa nhận thức của xã hội này về ngày tận thế rực lửa sắp ập đến. Khai quật thêm khu di tích có thể làm sáng tỏ những gì họ đã trải qua."
 infernals.2715.name: "Sự Sụp Đổ Rực Lửa"
 infernals.2715.desc: "Khảo sát sâu rộng thành phố đổ nát trên [From.Planet.GetName] chứng minh rằng nền văn minh này đã trải qua sự sụp đổ của hệ sinh thái, và biết rằng những ngày tháng cuối cùng ngập trong biển lửa đang cận kề. Các văn bản ghi chép trên giấy từng tồn tại trước khi tro bụi núi lửa nóng rực buộc họ phải chuyển sang dùng các tấm đồng, và những miêu tả nghệ thuật về động vật ẩn nấp khỏi ngọn lửa ghi lại nỗ lực đối mặt với hồi kết của chính mình.\n\nCuộc khai quật cũng phát hiện một mẫu tượng người canh giữ hầm mộ gần như hoàn hảo. Ngọn lửa được chạm khắc phía trên nó phát ra ánh sáng từ bên trong, khiến đây trở thành một hiện vật ấn tượng đáng được bảo tồn.\n\nChúng ta cũng tìm thấy bằng chứng về những nỗ lực ngăn chặn hoạt động núi lửa. Các con đường và những cỗ xe gãy nát chứng minh rằng cư dân đã vận chuyển gạch đá vụn đến miệng núi lửa gần nhất và đổ xuống nhằm cố gắng bịt kín ngọn núi lửa. Đáng tiếc thay, họ đã không thể ngăn được số phận nghiệt ngã. Ngày nay hành tinh này hoàn toàn vắng bóng sinh vật đa bào.\n\nLịch sử này nhắc nhở chúng ta về sự mong manh của bất kỳ nền văn minh nào, nếu phải đối mặt với một vấn đề vượt quá khả năng của những công cụ mà họ có trong tay."
 infernals.2715.a: "Một kết cục bi thảm."
 infernals.2715.b: "Chúng ta nên rút ra bài học từ sai lầm của họ."

 inferno_temple_site: "Đền Thờ Hỏa Ngục"
 inferno_temple_site_desc: "Cách xa các trung tâm dân cư của [Planet.GetName], nằm trên dãy núi lửa đang hoạt động, một ngôi đền cổ nằm đổ nát hoang phế. Việc tìm hiểu lịch sử của nó có thể mang lại cho chúng ta những hiểu biết sâu sắc hơn về văn hóa địa phương của hành tinh."
 infernals.2720.name: "Dấu Tích Cổ Xưa"
 infernals.2720.desc: "Bản thân ngôi đền mang đầy vết sẹo của những dấu vết chiến trận, và có những hài cốt cổ xưa của chủng tộc có tri giác bản địa trong lòng đất. Có vẻ như ngôi đền đã bị phóng hỏa thiêu rụi và bỏ hoang. Các đội an ninh ghi nhận rằng người dân địa phương hoàn toàn tránh xa toàn bộ khu vực này, tin rằng nơi đây bị nguyền rủa.\n\nNhững bức tường của ngôi đền lửa đã bảo vệ các di vật bên trong, bao gồm nhiều bức bích họa và chạm khắc tinh xảo. Những tác phẩm này lặp lại một họa tiết về một vòng tròn lửa xoắn vặn, với một vết rạch đen tối ở trung tâm. Trong một hình vẽ, một nhân vật hai chân móc ra một trong bốn con mắt như vậy và ném nó xuống thế giới, tạo nên họa tiết trung tâm này. Chúng ta chỉ định nó là Con Mắt Hỏa Ngục.\n\nCác cuộc khai quật tiếp theo sẽ hé lộ những tín ngưỡng nào xoay quanh nhân vật kỳ lạ này."
 infernals.2725.name: "Lễ Vật Dâng Mắt"
 infernals.2725.desc: "Các cuộc khai quật tại đền thờ Con Mắt Hỏa Ngục cho thấy bằng chứng về nhiều buổi hiến tế. Những hố tròn lớn với bệ đỡ ở trung tâm, mô phỏng Con Mắt Hỏa Ngục và con ngươi của nó, chứa đầy các lớp tro và than củi. Phân tích phân tử cho thấy tro và than củi này bắt nguồn từ mô động vật.\n\nLiệu những lễ vật này là động vật hoang dã hay vật nuôi gia súc, hay thực chất là chính bản thân người dân địa phương, vẫn chưa thể xác định được.\n\nCác đặc vụ đã được phái đến các trung tâm dân cư hiện tại để tìm kiếm bằng chứng chứng thực, trong khi các chuyên gia khai quật tiếp tục tìm kiếm thêm câu trả lời."
 infernals.2725.a: "Đó là một bí ẩn đang chờ được giải mã!"
 infernals.2725.b: "Phái các drone đi làm sáng tỏ bí ẩn đó."
 infernals.2730.name: "Tập Tục Tăm Tối"
 infernals.2730.desc: "Một cánh cửa đá nặng nề đã được phát hiện chặn lối vào phần sâu nhất của ngôi đền. Sau khi phá cửa xông vào, các nhà khai quật tìm thấy một căn phòng tròn với một hố trung tâm thông thẳng lên trên một túi magma ngầm tự nhiên. Ánh sáng cam của magma nhuộm bức tường trong sắc đỏ rực rỡ, chiếu sáng mờ ảo những dòng chữ khắc bao quanh căn phòng kỳ lạ. Đỉnh các bức tường xung quanh được đính những con mắt rực lửa sáng ngời.\n\nỞ một bên mép hố này là hài cốt khô quắt của một người dân địa phương, bị bổ đôi trên một bàn thờ có hình Con Mắt Hỏa Ngục. Có vẻ như họ thực sự đã hiến tế chính đồng loại của mình trong một nỗ lực nhằm xoa dịu nó.\n\nVăn tự dọc theo các bức tường này có thể là chìa khóa để hiểu vai trò văn hóa của ngôi đền này, và cần được dịch ngay lập tức."
 infernals.2735.name: "Lời Tiên Tri Biến Động"
 infernals.2735.desc: "Nghiên cứu cuối cùng về các kinh văn trong căn phòng sâu nhất của ngôi đền hé lộ một loạt các lời tiên tri liên quan đến sự trở lại của Con Mắt Hỏa Ngục. Kinh văn nói về việc Con Mắt Hỏa Ngục trở nên phẫn nộ trước sự bất tuân của các thần dân dưới quyền. Để đáp lại, Con Mắt được cho là sẽ làm tăm tối bầu trời, phun trào một ngọn núi thánh cụ thể, khiến một loại cây trồng cụ thể khô héo trên cây, và nhiều thảm họa khác. Lời tiên tri mô tả điều này là sự kết thúc của nền văn minh, tuyên bố rằng sau những sự kiện này, chỉ những ai quy phục Con Mắt Hỏa Ngục mới có thể sống sót.\n\nCác đặc vụ của chúng ta trong cộng đồng dân cư địa phương đã tìm kiếm các mối liên hệ văn hóa, và phát hiện ra rằng văn bản tiên tri này là nguồn gốc của nhiều câu cách ngôn và thành ngữ trong các nền văn hóa của hành tinh, cũng như là văn bản nguồn cho nhiều câu chuyện thần thoại sau này. Họ cũng tin rằng các bí tích được thực hành bởi các đền thờ hiện đại của họ bao gồm các biến thể bắt nguồn từ, hoặc chống lại, lời tiên tri cổ xưa này.\n\nTất cả các sự kiện tiên tri này đều có thể được tái hiện bằng công nghệ của chúng ta, hoặc làm giả với mức độ chân thực cao đến mức họ không thể phát hiện ra. Nếu chúng ta tự xưng là Con Mắt Hỏa Ngục tái sinh, chứng minh rằng lời tiên tri ban đầu đã luôn đúng suốt bấy lâu, chúng ta có thể buộc họ nhượng bộ và thề trung thành. Điều này sẽ giúp việc sáp nhập họ về lâu dài trở nên dễ dàng hơn."
 infernals.2735.a: "Tái hiện các lời tiên tri."
 infernals.2735.a.tt: "Xã hội nguyên thủy của §Y[From.Planet.GetName]§! sẽ học cách chấp nhận các đạo đức của chúng ta."
 infernals.2735.a.fail: "Chưa chọn chính sách §Y$interference_not_allowed$§!."
 infernals.2735.b: "Không can thiệp."
 infernals.2735.c: "Lịch sử của họ đã vĩnh viễn tiêu tan."
 infernal_figurine: "Tượng Nhỏ Hỏa Ngục"
 infernal_figurine_desc_short: "Một sinh vật mập mạp với lớp mai hình vòm và bốn chân bè đang khom mình dưới một tác phẩm điêu khắc ngọn lửa cách điệu"
 infernal_figurine_desc_details: "Ngọn lửa được tạc từ một khoáng vật chưa rõ phát ra ánh sáng đỏ thẫm. Hiện vật này được khai quật từ các hầm mộ của một xã hội đã tuyệt chủng, và có thể đại diện cho niềm hy vọng hão huyền của họ về việc sống sót sau sự hủy diệt núi lửa sắp ập xuống sinh quyển."

