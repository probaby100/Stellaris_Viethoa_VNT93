# Traits
 trait_pc_volcanic_preference: "Ưa Thích Núi Lửa"
 trait_pc_volcanic_preference_short: "Núi Lửa"
 trait_pc_volcanic_preference_desc: "$trait_pc_savannah_preference_desc$"
 trait_volcanic_planet_preference: "$trait_pc_volcanic_preference$" #robotic
 trait_volcanic_planet_preference_desc: "$trait_dry_planet_preference_desc$" #robotic
 trait_infernal: "Loài Ưa Nhiệt"
 trait_infernal_plural: "Các Loài Ưa Nhiệt"
 trait_infernal_desc: "Loài này đã tiến hóa các mô hợp kim kim loại để phát triển và sinh sôi trên các hành tinh nóng bỏng, nơi các sinh vật hữu cơ truyền thống sẽ bị thiêu chín. Những tế bào hợp kim này thoái hóa chậm hơn và ít khi phải thay thế, trì hoãn sự khởi phát của các bệnh liên quan đến tuổi già. Tuy nhiên, chúng cũng dẫn nhiệt lạnh rất nhanh, có thể đe dọa sức khỏe của chúng trong các khí hậu lạnh giá hơn."
 TRAIT_INFERNAL_EFFECT: "Chi Phí Duy Trì $r_alloys$ mỗi $pop_group_unit$ Dân £pop£: §R+$@living_standard_alloys_normal$§!$TABBED_NEW_LINE$- $HABITABILITY$ trên $pc_volcanic$: §G+20%§! $TABBED_NEW_LINE$- $HABITABILITY$ Tối Thiểu (§H$pc_volcanic$§!): §Y+50%§! $TABBED_NEW_LINE$- $HABITABILITY$ trên các thế giới §YLạnh Giá§!: §R-30%§!  $TABBED_NEW_LINE$- Tuổi Thọ Lãnh Đạo: §G+10 Năm§!"

 trait_unbreakable_resolve: "Ý Chí Sắt Đá"
 trait_unbreakable_resolve_desc: "Được gắn kết bởi mạng lưới nơ-ron gương phức tạp, các cá thể này sở hữu khả năng bẩm sinh để đồng bộ hóa ý chí của mình. Bổn phận không phải là gánh nặng mà là mục đích chung, và mọi gian nan đều được đối mặt bằng sự đoàn kết kiên định không gì lay chuyển nổi."
 trait_unbreakable_resolve_tooltip: "Mỗi $pop_group_unit$ §HDân§! £pop£ trên hành tinh có đặc trưng này cộng thêm §G+0.2§! £stability£ $PLANET_STABILITY_TITLE$ (Tối đa: §G+15§!) \n- §RKhông bao gồm nô lệ hoặc các tầng lớp dân số thấp hơn.§!"

 trait_shell_slag: "Vỏ Xỉ Khoáng"
 trait_shell_slag_desc: "Mối quan hệ cộng sinh phức tạp với $r_living_metal$ cho phép loài này phát triển không phải theo nghĩa truyền thống, mà thông qua sự bồi tụ và tự lắp ráp của các cấu trúc sinh học chứa sắt."
 trait_shell_slag_tooltip: "Mỗi $pop_group_unit$ §HDân§! £pop£ có đặc trưng này làm việc ở tầng lớp nô lệ trở lên sẽ tạo ra §G$@shell_slag_trait_resource_production|3$§! §Y$r_living_metal$§! mỗi tháng."
 trait_robot_assembly_slag: "Xỉ Lắp Ráp"
 trait_robot_assembly_slag_desc: "Sự tích hợp phức tạp của $r_living_metal$ cho phép chủng loài máy móc này mở rộng không thông qua việc xây dựng thông thường, mà qua sự bồi tụ và tự lắp ráp của các khung sắt tự động."

 trait_pyroclastic: "Dẫn Truyền Nham Thạch Vụn"
 trait_pyroclastic_desc: "Được tôi luyện bởi cơn thịnh nộ không ngừng nghỉ của các thế giới núi lửa, loài này không hề e sợ các dòng nham thạch vụn - họ dẫn truyền và thao túng chúng, biến sự tàn phá thành nguồn dinh dưỡng và sức mạnh sống còn."
 trait_pyroclastic_tooltip: "$MOD_LOGISTIC_GROWTH_MULT$ trên các $pc_volcanic_plural$: §G+10%§!"

 trait_crucible_community: "Cộng Đồng Lò Luyện"
 trait_crucible_community_desc: "Được tôi luyện qua nghịch cảnh và gắn kết bởi cuộc đấu tranh chung, loài này đã được rèn giũa thành một khối thống nhất không thể phá vỡ. Ý chí tập thể tiếp thêm sức mạnh cho công tác quản trị, mỗi thành viên là một mắt xích sống còn trong chuỗi đoàn kết."
 trait_crucible_community_tooltip: "Mỗi $pop_group_unit$ §HDân§! £pop£ có đặc trưng này cộng thêm §G+0.25§! §Y$MOD_COUNTRY_EDICT_FUND_ADD$§!"

 trait_ductile: "Dễ Uốn Dẻo"
 trait_ductile_desc: "§LLoài này đã được biến đổi di truyền để phát triển các hợp chất hợp kim có thể tái sử dụng.§!\n"

# Volcanic World
 pc_volcanic: "Thế Giới Núi Lửa"
 pc_volcanic_plural: "Các Thế Giới Núi Lửa"
 pc_volcanic_desc: "Thế giới đá với bầu khí quyển giàu lưu huỳnh và thạch quyển ở trạng thái bán lỏng. Bề mặt phủ đầy tro tàn và đá bazan đan xen các hoạt động núi lửa mới mẻ, các hồ và sông nham thạch. Chỉ có các dạng sống chịu cực hạn mới có thể tìm thấy ở đây, nếu có."
 mod_pc_volcanic_habitability: "Khả Năng Sinh Sống Thế Giới Núi Lửa"
 mod_pc_volcanic_max_districts_add: "Số Khu Tối Đa ($pc_volcanic$)"
 concept_pc_volcanic: "$pc_volcanic$"
 concept_pc_volcanic_desc: "- $mod_planet_jobs_alloys_produces_mult$: §G+5%§! \n\n§L$pc_volcanic_desc$§!"

 district_geothermal: "Nhà Máy Điện Địa Nhiệt"
 district_geothermal_plural: "Các Nhà Máy Điện Địa Nhiệt"
 district_geothermal_desc: "Khai thác nguồn nhiệt năng cuộn trào sâu trong lòng hành tinh để cung cấp điện năng cho thuộc địa."

 district_melting: "Ống Dẫn Magma"
 district_melting_plural: "Các Ống Dẫn Magma"
 district_melting_desc: "Một loạt các rây lọc điện từ chiết xuất các khoáng sản quý giá từ các dòng chảy magma của hành tinh."
