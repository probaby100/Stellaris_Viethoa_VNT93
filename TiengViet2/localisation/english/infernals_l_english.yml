 job_melt_extractor: "Thợ Nhiệt Luyện"
 job_melt_extractor_plural: "Các Thợ Nhiệt Luyện"
 job_melt_extractor_desc: "Đã quen với nhiệt độ cực cao, công nhân này rất lành nghề trong việc kết hợp các khoáng sản thành các hợp kim mới hữu ích."
