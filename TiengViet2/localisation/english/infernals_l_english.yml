# Origin - Red Giant
 origin_red_giant: "Sao Khổng Lồ Đỏ"
 origin_red_giant_desc: "Nền văn minh này đang đứng trước ngã rẽ định mệnh: Ngôi Sao Khổng Lồ Đỏ tại trung tâm hệ sao đang làm nóng hành tinh của họ, đe dọa thiêu sống toàn bộ giống loài.\n\nLiệu họ có thể thích nghi cho đến khi nguyên nhân được tìm ra và giải quyết, hay họ sẽ chọn đón nhận sức nóng, tận dụng những biến đổi kỳ lạ và có thể là phi tự nhiên này?"
 origin_tooltip_red_giant_effects: "- $HOMEWORLD$ ['concept_pc_volcanic'] (Quy mô: £planetsize£ 20)"
 START_SCREEN_RED_GIANT: "Sự thật đến từ từ, rồi ập đến tất cả cùng một lúc.\n\nNgôi sao của chúng ta đang bước vào giai đoạn tiến hóa dị thường và nhanh chóng. Sản lượng năng lượng của nó đã vượt xa mọi thông số dự kiến. Các biến dịch quang phổ cho thấy các mô hình đối lưu bất thường, và tốc độ nhiệt hạch dường như đang tăng lên mà không hề mất đi khối lượng tương ứng.\n\nCho đến nay, chúng ta đã tiến hóa hài hòa với sự ấm lên này. Nhưng sự tiến hóa sinh học cơ bản luôn có giới hạn của nó.\n\nNếu những biến đổi đang diễn ra bên trong [capital_star.GetName] tiếp tục, thế giới mà chúng ta gọi là nhà sẽ bốc cháy. Đây không còn là câu hỏi 'liệu có hay không', mà là 'khi nào'."
 red_giant_start_NAME: "Hệ Sao Khổng Lồ Đỏ"
 red_giant_start_DESC: "Đây là hệ sao xuất phát bảo đảm cho các đế chế sử dụng Khởi Nguyên §Y$origin_red_giant$§!."

 tech_starfire_cannon: "$starfire_cannon$"
 tech_starfire_cannon_desc: "Giống như bất kỳ mối nguy tiềm tàng nào, bức xạ nguy hiểm từ sự biến đổi của ngôi sao cũng có thể được khai thác như một công cụ hữu ích. Dẫn truyền nó thành một vũ khí dạng chùm tia sẽ cho phép chúng ta làm quá nhiệt và vô hiệu hóa các tàu chiến của kẻ thù. \n\nMở khóa Quyết Sách Thuộc Địa để xây dựng một §Y$starfire_cannon$§! trên quỹ đạo."
 SOLARFLARE_EMITTER: "Máy Phát Bão Nhật Hoa"
 SOLARFLARE_EMITTER_DESC: "Một chùm năng lượng mạnh mẽ có thể xuyên thủng ngay cả những hệ thống phòng thủ kiên cố nhất và vô hiệu hóa các hệ thống tàu chiến dễ bị tổn thương."
 starfire_cannon_cap: "$starfire_cannon$"
 starfire_cannon: "Đại Bác Tinh Hỏa"
 starfire_cannon_plural: "Các Đại Bác Tinh Hỏa"
 NAME_Starfire_Cannon: "$starfire_cannon$"
 starfire_cannon_key: "Lõi $starfire_cannon$"
 sfe_on_hit_stun_tt: "§YVô hiệu hóa§! mục tiêu trong §G5§! ngày, làm giảm tốc độ, tốc độ bắn và lá chắn của nó."
 sfe_weapon_stun_effect: "Tác Động §R$starfire_cannon$§!"
 sfe_weapon_stun_effect_desc: "   " # not visible
 decision_starfire_cannon: "Xây Dựng $starfire_cannon$"
 decision_starfire_cannon_desc: "Mô phỏng bức xạ cực mạnh của một ngôi sao khổng lồ đỏ đang già đi nhanh chóng, khẩu đại bác quỹ đạo này phóng ra một chùm ion hóa siêu nhiệt không chỉ gây sát thương lên các mục tiêu mà còn thiêu rụi các bộ phận của tàu để khiến chúng mất khả năng hoạt động."
 decision_starfire_cannon_effects: "Xây dựng một §Y$starfire_cannon$§! trên quỹ đạo hành tinh, một vũ khí tầm xa có thể vô hiệu hóa hệ thống của nhiều chiến hạm."
 decision_starfire_cannon_limit: "$TRIGGER_FAIL$Giới hạn hệ sao: §Y3§!"

# Origin - Cosmic Dawn
 origin_cosmic_dawn: "Bình Minh Vũ Trụ"
 origin_cosmic_dawn_desc: "Nền văn minh này không trỗi dậy theo lẽ thường; họ được giải phóng. Khi các kén ngủ đông mở khóa, họ thức tỉnh trước một thế giới đã già nua vượt quá mọi nhận biết. Thế nhưng tất cả vẫn chưa mất hết. Nằm rải rác dưới lớp bụi và phế tích khắp thiên hà, quá khứ của họ vẫn tồn tại, chờ đợi được tái khám phá."
 origin_tooltip_cosmic_dawn_effects: "- $HOMEWORLD$ $TABBED_NEW_LINE$- ['concept_pc_volcanic'] (Quy mô: £planetsize£ 14) $TABBED_NEW_LINE$- ['concept_inf_cd_deposit']: +5\n- Khởi đầu với Tình Huống: §HKhai Quật Tầng Sâu§!"
 origin_tooltip_cosmic_dawn_negatives: "- $INITIAL_POPS$ §R-600§!"
 START_SCREEN_COSMIC_DAWN: "Chúng ta thức giấc chỉ với cảm giác mơ hồ nhất rằng mình đã từng chìm vào giấc ngủ. Ngay cả bây giờ, bằng chứng mạnh mẽ nhất của chúng ta về thời kỳ trước đây không đến từ ký ức của chính mình, mà từ công nghệ phức tạp đã bảo tồn chúng ta trong trạng thái ngủ đông.\n\nHàng ngàn chiếc kén, các hệ thống truyền nhiệt khổng lồ, những chiếc vạc cuộn trào đá nóng chảy. Vượt ra ngoài những cỗ máy đơn sơ này, các manh mối về nguồn gốc của chúng ta đã được khắc trên các bức tường: các hạm đội tàu bè, phân tán khỏi những thế giới đang nguội lạnh để tìm kiếm hơi ấm giữa các vì sao. Để tìm kiếm câu trả lời, chúng ta rời khỏi 'phòng sinh nở' dưới lòng đất này. Trên khắp bề mặt của §Y[owner.Capital.GetName]§!, chúng ta đã phát hiện ra công nghệ và tài nguyên hữu ích. Chúng ta cũng tìm thấy bằng chứng về các cơ sở khác ẩn sâu trong lớp vỏ hành tinh. Một số cơ sở chứa những người ngủ đông mà chúng ta có thể chào đón như đồng loại.\n\nVà còn các vì sao thì sao? Liệu có những kẻ khác giống như chúng ta, vẫn đang chìm trong giấc ngủ? Nếu họ tồn tại, có lẽ họ có thể giúp chúng ta trả lời câu hỏi cháy bỏng nhất: chúng ta là ai?"
 cosmic_dawn_start_NAME: "Ngôi Nhà Mới"
 cosmic_dawn_start_DESC: "Đây là hệ sao xuất phát bảo đảm khi sử dụng Khởi Nguyên $origin_cosmic_dawn$."
 concept_inf_cd_deposit: "$d_stasis_pods$"
 concept_inf_cd_deposit_desc: "Sản xuất: £society_research£ 3.0\nKhi dọn sạch: \n$d_stasis_pods_tt$ \n\n§L$d_stasis_pods_desc$§!"
 cosmic_dawn_districtsize: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+1§!"
 cosmic_dawn_districtsize2: "$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+2§!\n   $d_cd_ancient_tunnels$ §G+2§!"
 cosmic_dawn_tunnel_foundry: "$foundry_jobs_bonus_workforce_mult$ mỗi $d_cd_ancient_tunnels$: §G+1%§!"
 cosmic_dawn_tunnel_bureaucrat: "$bureaucrat_jobs_bonus_workforce_mult$ mỗi $d_cd_ancient_tunnels$: §G+1%§!"
 cosmic_dawn_tunnel_researcher: "$researcher_jobs_bonus_workforce_mult$ mỗi $d_cd_ancient_tunnels$: §G+1%§!"
 cosmic_dawn_tunnel_worker: "$mod_pop_cat_worker_bonus_workforce_mult$ mỗi $d_cd_ancient_tunnels$: §G+1%§!"
 d_stasis_pods: "£blocker£ Kén Ngủ Đông Cổ Đại"
 d_stasis_pods_desc: "Những kén ngủ đông này là thiết bị cổ xưa từ những đồng loại thất lạc của chúng ta, sử dụng công nghệ đông lạnh tiên tiến để giữ các cá nhân trong trạng thái ngừng sinh hoạt tạm thời. Với công nghệ thích hợp, chúng ta có thể đánh thức họ."
 d_stasis_pods_tt: "[GetStasisPodOwner]"
 d_stasis_pods_tt_inf: "- §G100§! £pop£ $POPS$ được tạo ra\n- $MOD_PLANET_MAX_DISTRICTS_ADD$: §G+1§!"
