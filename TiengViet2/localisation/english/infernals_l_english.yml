 infernals.35.name: "Chìm Trong Biển Lửa"
 infernals.35.desc: "Bề mặt của §H[from.GetName]§! đã nứt toác, lớp vỏ vỡ vụn khi luồng nhiệt lượng không thể chịu đựng nổi cuồn cuộn trào dâng từ bên dưới. Quá trình biến đổi diễn ra nhanh chóng và triệt để: những ngọn núi sụp đổ, các đại dương sôi sùng sục, và bầu trời trở thành một bức màn tro than rực lửa.\n\nKhông còn dấu vết nào của các quần thể sinh vật từng phát triển hưng thịnh trên hành tinh. Giờ đây chỉ có các dạng sống chịu cực hạn mới có thể coi nơi này là nhà."
