 d_cd_ancient_tunnels: "Các Đường Hầm Cổ Xưa"
 d_cd_ancient_tunnels_desc: "Từng được sử dụng để chứa các dãy buồng ngủ đông, những đường hầm rộng lớn nhưng nay đã trống rỗng này cung cấp không gian sinh sống mới."
 d_galvanic_living_metal: "Khối $sr_living_metal$"
 d_galvanic_living_metal_desc: "Một mỏ $r_living_metal$. Các loài tiến hóa trong sự tiếp xúc liên tục với nguồn tài nguyên hấp dẫn này được định hướng theo những quỹ đạo sinh học và khoa học độc nhất vô nhị."

# Civic - Scorched World Heralds
 civic_scorched_earth: "Sứ Giả Thế Giới Thiêu Rụi"
 civic_scorched_earth_desc: "Sức nóng thấm sâu vào mọi khía cạnh văn hóa của xã hội này, từ truyền thống và nghi lễ cho đến chính công nghệ. Họ tự xem mình là những kẻ thống trị rực lửa chính đáng của thiên hà, xem các loài yếu ớt hơn chỉ là những chướng ngại vật đơn thuần trên con đường hướng tới một vũ trụ lý tưởng, chỉ phù hợp cho Loài Ưa Nhiệt."
 civic_scorched_earth_effects: "- Không thể tham gia §YNgoại Giao§! ngoại trừ với các §Y$trait_infernal_plural$§!.\n- Không thể tiếp cận §YThị Trường Thiên Hà§!.\n- Cung cấp lý do tuyên chiến §Y'$casus_belli_cb_blaze$'§! lên các loài khác.\n- Nhận được £unity£ §Y$unity$§! khi oanh tạc bằng thế oanh tạc §Y$bombardment_firestorm$§!.\n- Tạo ra các chướng ngại đặc biệt bằng thế oanh tạc §Y$bombardment_seismic_bombing$§! trên hành tinh bên dưới. \n- Các loài không phải ['trait:trait_infernal'] bị giới hạn ở mức §YNô Lệ§! hoặc tệ hơn."
 SCORCHED_HERALDS_ONLY_INF: "$TRIGGER_FAIL$§Y$civic_scorched_earth$§! chỉ dung thứ cho Dân số ['trait:trait_infernal'] £pop£ $POPS$ trong xã hội của họ."

 civic_hive_scorched_earth: "Bản Năng Cuồng Hỏa"
 civic_hive_scorched_earth_desc: "Các Thế Giới Thiêu Rụi của chúng ta là đỉnh cao của sự tiến hóa hành tinh. Chúng ta sẽ thiêu cháy thiên hà và phát triển rực rỡ trong biển lửa!"

# Civic - World Forgers
 civic_world_forgers: "Thợ Rèn Hành Tinh"
 civic_world_forgers_desc: "Xã hội này phát triển mạnh mẽ trong môi trường núi lửa, và thậm chí sẽ tạo ra chúng một cách nhân tạo khi tự nhiên không đáp ứng đủ."
 civic_world_forgers_effects: "- Mở khóa hành tinh khởi đầu: ['concept_pc_volcanic']. \n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society_research£ ['concept_volcanic_forge']. \n- Có thể xây dựng công trình £building£ §Y$building_volcanic_forge_1$§! giúp bổ sung £job_polytechnic_mentor£ ['concept_polytechnic_mentor']. \n- Các hành tinh có một £building£ §Y$building_volcanic_forge_1$§! sẽ dần biến thành một §Y$pc_volcanic$§!. \n- ['concept_guaranteed_colonies'] sẽ là các thế giới §Y$climate_dry$§!."
 civic_corporate_world_forgers: "Kiến Trúc Sư Hành Tinh"
 civic_corporate_world_forgers_desc: "$civic_world_forgers_desc$"
 civic_hive_world_forgers: "Làm Tổ Núi Lửa"
 civic_hive_world_forgers_desc: "$civic_world_forgers_desc$"
 civic_world_forgers_gestalt_effects: "- Mở khóa hành tinh khởi đầu: ['concept_pc_volcanic']. \n- $GUARANTEED_RESEARCH_OPTION_STRING$ £society_research£ ['concept_volcanic_forge']. \n- Có thể xây dựng công trình £building£ §Y$building_volcanic_forge_1$§! giúp bổ sung £job_polytechnic_drone£ ['concept_polytechnic_drone']. \n- Các hành tinh có một £building£ §Y$building_volcanic_forge_1$§! sẽ dần biến thành một §Y$pc_volcanic$§!. \n- ['concept_guaranteed_colonies'] sẽ là các thế giới §Y$climate_dry$§!."
 civic_machine_world_forgers: "Tối Ưu Hóa Nhiệt Năng"
 civic_machine_world_forgers_desc: "$civic_world_forgers_desc$"

 tech_volcanic_forge: "Lò Rèn Núi Lửa"
 tech_volcanic_forge_desc: "Khi được triển khai, cơ sở này từ từ biến đổi một hành tinh thành thiên đường núi lửa, đưa các tài nguyên hữu ích lên bề mặt trên đường đi. Các Thợ Nhiệt Luyện có thể đẩy nhanh quá trình biến đổi."
 concept_volcanic_forge: "$tech_volcanic_forge$"
 concept_volcanic_forge_desc: "$building_volcanic_forge_basic$ \n\n- Tiến Độ Hàng Tháng: §G+0.1§! \n- Tiến Độ Hàng Tháng mỗi §Y100§! £job_miner£ $job_miner_plural$: §G+0.05§! \n- Tiến Độ Hàng Tháng mỗi §Y100§! £job_foundry£ $job_foundry_plural$: §G+0.05§!"
 building_volcanic_forge_1: "$tech_volcanic_forge$"
 building_volcanic_forge_1_desc: "Tổ hợp công nghiệp này, được thiết kế để khoan sâu vào lớp vỏ hành tinh, sẽ kích thích hoạt động núi lửa trên toàn thế giới, từ đó địa hóa mọi quần xã sinh vật thành cảnh quan rực lửa."
 building_volcanic_forge_2: "Xưởng Đúc Núi Lửa"
 building_volcanic_forge_2_desc: "$building_volcanic_forge_1_desc$"
 building_volcanic_forge_1_effect: "\n$building_volcanic_forge_basic$ \n$volcanic_forge_1_monthly$ \n\nTiến độ từ tất cả £job_miner£ $concept_planet_miners$: §G+[root.GetMinerVar1]§! \nTiến độ từ tất cả £job_foundry£ $concept_planet_metallurgists$: §G+[root.GetForgerVar1]§!"
 building_volcanic_forge_2_effect: "\n$building_volcanic_forge_basic$ \n$volcanic_forge_2_monthly$ \n\nTiến độ từ tất cả £job_miner£ $concept_planet_miners$: §G+[root.GetMinerVar2]§! \nTiến độ từ tất cả £job_foundry£ $concept_planet_metallurgists$: §G+[root.GetForgerVar2]§!"
 building_volcanic_forge_basic: "Biến hành tinh thành một §H$pc_volcanic$§!."
 volcanic_forge_1_monthly: "- Bổ sung §G+200§! công việc £job_polytechnic_mentor£ ['concept_polytechnic_mentor'].\n- Tiến Độ Hàng Tháng: §G+0.1§! \n- Tiến Độ Hàng Tháng mỗi §Y100§! £job_miner£ $concept_planet_miners$: §G+0.05§! \n- Tiến Độ Hàng Tháng mỗi §Y100§! £job_foundry£ $concept_planet_metallurgists$: §G+0.05§!"
 volcanic_forge_2_monthly: "- Bổ sung §G+400§! công việc £job_polytechnic_mentor£ ['concept_polytechnic_mentor'].\n- Tiến Độ Hàng Tháng: §G+0.2§! \n- Tiến Độ Hàng Tháng mỗi §Y100§! £job_miner£ $concept_planet_miners$: §G+0.1§! \n- Tiến Độ Hàng Tháng mỗi §Y100§! £job_foundry£ $concept_planet_metallurgists$: §G+0.1§!"

# Civic - Fire Cult
 civic_pyrolatry: "Giáo Phái Lửa"
 civic_pyrolatry_desc: "Được tôi rèn qua nhiều thế hệ gian nan tột cùng, xã hội này tin vào sự sống còn nhờ đoàn kết, và đoàn kết để sống còn. Chỉ có cuộc đấu tranh sinh ra từ ngọn lửa mới có thể gắn kết họ đủ chặt chẽ để chịu đựng một thiên hà lạnh giá, vô tình."
 civic_pyrolatry_effects: "- Phe phái ['concept_fire_cult'] hình thành ngay sau khi bắt đầu trò chơi.\n- Các công việc ['concept_fire_cult_jobs'].\n- Cho phép chiêu mộ các đội quân §Y$ember_legion$§! trên các hành tinh có $HABITABILITY$ từ §R$@inf_ember_legion_max_habitability|0%$§! trở xuống.\n- Cung cấp quyền tiếp cận Quyết Sách Thuộc Địa §Y$decision_blazing_scourge$§! tạo ra chướng ngại £blocker£ ['concept_dec_blazing_scourge'].\n- Tương hỗ hiệp đồng với các Quốc Sách: $civic_superstitious_beliefs$, $civic_exalted_priesthood$, $civic_death_cult$, $civic_aristocratic_elite$, và $civic_merchant_guilds$."
 mod_low_habitability_bureaucrat_bonus_workforce_mult: "$mod_pop_bureaucrat_bonus_workforce_mult$ mỗi §R-10%§! $HABITABILITY$"
