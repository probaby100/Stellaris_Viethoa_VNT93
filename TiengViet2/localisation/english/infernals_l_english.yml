 job_cremator: "Thợ Hỏa Táng"
 cremator: "$job_cremator$"
 job_cremator_plural: "Các Thợ Hỏa Táng"
 job_cremator_desc: "Những Thợ Hỏa Táng giám sát nghi lễ thiêng liêng của ngọn lửa, dẫn dắt người quá cố qua ngọn lửa tiến vào bí ẩn cuối cùng của họ. Được tôn vinh như những người giám hộ của cánh cổng tôn kính này, họ phụng sự nơi cái chết giao hòa với sự siêu việt."
