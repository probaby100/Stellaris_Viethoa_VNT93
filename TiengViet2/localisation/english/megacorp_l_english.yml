 ## BUILDINGS ##
 building_maintenance_depot:0 "Trung tâm hậu cần"
 building_maintenance_depot_desc:1 "Cơ sở lưu trữ khổng lồ này là trái tim trong hệ thống hậu cần của tập thể, nơi các cá thể đảm bảo luồng luân chuyển hàng hóa đáp ứng mọi nhu cầu."
 building_hive_node:0 "Điểm nút thần kinh"
 building_hive_node_desc:2 "Trung tâm bao gồm lượng lớn các rễ thần kinh, những điểm nút này—tiến hóa thành các cá thể đặc biệt và được hỗ trợ bởi các cá thể khác—chịu trách nhiệm tiếp nhận và truyền đạt ý chí của tổ đàn."
 building_hive_cluster:0 "Cụm điểm nút thần kinh"
 building_hive_cluster_desc:1 "Tập trung các điểm nút của tổ đàn lại với nhau giúp tối đa hóa tốc độ truyền tải siêu nơ-ron trên mỗi đơn vị diện tích."
 building_hive_confluence:0 "Nơi hội tụ tâm trí"
 building_hive_confluence_desc:1 "Trung tâm thần kinh khổng lồ chứa hàng tỷ siêu nơ-ron liên tục khuếch tán, cường hóa và điều phối ý chí của đầu não thông qua mạng lưới sợi ống nguyên sinh chất."
 building_hydroponics_farm:0 "Nông trại thủy canh"
 building_hydroponics_farm_desc:0 "Nông trại thủy canh trồng các loại rau quả giàu dinh dưỡng để cung cấp cho cư dân địa phương."
 building_holo_theatres:0 "Nhà hát ba chiều"
 building_holo_theatres_desc:0 "Sản phẩm giải trí ba chiều tối tân nhất. Một thế giới được dựng lên từ hạt photon và trường năng lượng."
 building_crystal_mines:0 "Mỏ pha lê"
 building_crystal_mines_desc:1 "Cần phải hết sức cẩn thận khi khai thác các khoáng vật này để tránh làm vỡ pha lê bên trong mỏ."
 building_foundry_1:2 "Xưởng đúc hợp kim"
 building_foundry_1_desc:3 "[Owner.GetAlloyProducerPlural] làm việc trong các xưởng đúc này có thể làm ra hợp kim chất lượng cao."
 building_foundry_2:2 "Lò luyện hợp kim khổng lồ"
 building_foundry_2_desc:2 "Những lò luyện khổng lồ này hỗ trợ quy trình hoàn thiện hợp kim, mang lại lợi ích cho toàn bộ ngành công nghiệp trên hành tinh."
 building_foundry_3:2 "Nhà máy hợp kim Nano"
 building_foundry_3_desc:3 "Trung tâm công nghiệp quy mô lớn nhằm đẩy mạnh sản lượng hợp kim của hành tinh."
 building_factory_1:2 "Khu công nghiệp dân dụng"
 building_factory_1_desc:2 "Đây là nơi tập trung các ngành công nghiệp và sản xuất dân dụng, cung cấp số lượng lớn hàng tiêu dùng cho đời sống."
 building_factory_2:2 "Trung tâm công nghiệp dân dụng"
 building_factory_2_desc:2 "Trung tâm công nghiệp quy mô lớn nhằm đẩy mạnh lượng hàng tiêu dùng lưu thông trên hành tinh."
 building_factory_3:2 "Cụm nhà máy sao chép dân dụng"
 building_factory_3_desc:2 "Các thiết bị đầu cuối bên trong cụm kiến trúc này có thể sao chép ra gần như mọi thứ."
 building_noble_estates:0 "Dinh thự quý tộc"
 building_noble_estates_desc:0 "Những cung điện và dinh thự tráng lệ này thuộc về giới quý tộc, giống như các ngôi làng xung quanh thuộc về dân thường."
 building_bureaucratic_1:0 "Tòa nhà hành chính"
 building_bureaucratic_1_desc:0 "Một cơ quan chính phủ phức tạp, bao gồm vô số các ban bệ và phòng ban lớn nhỏ."
 building_bureaucratic_2:0 "Khu hành chính"
 building_bureaucratic_2_desc:0 "Một khu vực ngập tràn các tòa nhà chuyên biệt để xử lý giấy tờ một cách chi tiết và hiệu quả."
 building_bureaucratic_3:0 "Khu phức hợp hành chính"
 building_bureaucratic_3_desc:0 "Một vùng đất rộng lớn, trên đó xây dựng bộ máy quan liêu chứa hàng vạn văn phòng."
 building_simulation_1:0 "Trạm mô phỏng"
 building_simulation_1_desc:0 "Để nền văn minh tiến bước, chúng ta phải chạy và đánh giá những mô phỏng vô cùng phức tạp."
 building_simulation_2:0 "Trung tâm mô phỏng"
 building_simulation_2_desc:0 "$building_simulation_1_desc$"
 building_simulation_3:0 "Khu phức hợp mô phỏng"
 building_simulation_3_desc:0 "$building_simulation_1_desc$"
 building_sensorium_1:0 "Trạm cảm quan"
 building_sensorium_1_desc:0 "Để hiểu sâu hơn về thiên hà, các cá thể cảm quan chuyên trách của chúng ta cần phải được trải nghiệm mọi thứ mà biển sao mang lại."
 building_sensorium_2:0 "Trung tâm cảm quan"
 building_sensorium_2_desc:0 "$building_sensorium_1_desc$"
 building_sensorium_3:0 "Khu phức hợp cảm quan"
 building_sensorium_3_desc:0 "$building_sensorium_1_desc$"
 building_primitive_research: "Phòng thí nghiệm cơ bản"
 building_primitive_research_desc: "Chính những cơ sở nghiên cứu cơ sở này đã đưa nền văn minh vươn ra thời đại không gian."
 building_research_lab_1:0 "Phòng thí nghiệm nghiên cứu"
 building_research_lab_1_desc:0 "Phòng thí nghiệm này có trang bị các cơ sở vật chất cơ bản để thực hiện các nghiên cứu thông thường."
 concept_research_lab: "$building_research_lab_1$"
 concept_research_lab_desc: "Công việc $job_researcher$: §G+2§!\n\n$job_researcher_effect_desc$\n$h_line$§L$building_research_lab_1_desc$§!"
 building_research_lab_2:0 "Tòa nhà nghiên cứu"
 building_research_lab_2_desc:0 "Cơ sở nghiên cứu được nâng cấp, có khả năng chứa một lượng lớn nhân viên nghiên cứu."
 building_research_lab_3:0 "Tòa nhà nghiên cứu cao cấp"
 building_research_lab_3_desc:0 "Những cơ sở nghiên cứu cao cấp này sở hữu thiết bị khoa học tối tân nhất, đủ sức chứa số lượng khổng lồ các nhà khoa học."
 building_precinct_house:0 "Đồn cảnh sát"
 building_precinct_house_desc:0 "Trụ sở chính của lực lượng thực thi pháp luật, đồng thời là biểu tượng thiêng liêng của luật pháp và trật tự."
 concept_precinct_house: "$building_precinct_house$"
 concept_precinct_house_desc: "Công việc [enforcer.GetName]: §G+200§!\n\n$job_enforcer_effect_desc$\n$h_line$§L$building_precinct_house_desc$§!"
 building_hall_judgment:0 "Sảnh phán xử"
 building_hall_judgment_desc:0 "Một cơ sở khổng lồ chuyên dùng cho việc thi hành án và xét xử."
 building_sentinel_posts:0 "Tiền đồn Vệ binh"
 building_sentinel_posts_desc:1 "Những tiền đồn này cho phép các cá thể tuần tra liên tục quét ý thức tập thể để tìm kiếm các dấu hiệu bất thường và lỗi."
 building_hive_capital:0 "Trung tâm Tổ đàn"
 building_hive_capital_desc:1 "Lõi tổ chức của tổ đàn, nơi Trí tuệ Tổ đàn dùng để điều phối công việc trên hành tinh."
 building_hive_major_capital:0 "Trụ sở Tổ đàn"
 building_hive_major_capital_desc:1 "Khu phức hợp thủ đô chằng chịt, nơi Trí tuệ Tổ đàn tập trung tổ chức, điều phối và lên kế hoạch cho hành tinh."
 building_spawning_pool:0 "Hồ ấp trứng"
 building_spawning_pool_desc:1 "Những hồ ấp này với sự chăm sóc khoa học và tỉ mỉ của các chuyên gia sẽ kích thích trứng phát triển nhanh chóng."
 building_robot_assembly_plant:0 "Nhà máy lắp ráp Robot"
 building_robot_assembly_plant_desc:0 "Nhà máy công nghệ cao, nơi các chuyên gia robot lành nghề lắp ráp những mẫu robot mới nhất."
 building_robot_assembly_complex:0 "Khu phức hợp lắp ráp Robot"
 building_robot_assembly_complex_desc:0 "Một nhà máy lắp ráp tiên tiến nơi các chuyên gia robot lành nghề chế tạo các mẫu robot mới nhất."
 building_machine_assembly_plant:0 "Nhà máy lắp ráp Máy móc"
 building_machine_assembly_plant_desc:1 "Dây chuyền lắp ráp này là nơi để chế tạo các đơn vị mới."
 building_machine_assembly_complex:0 "Khu phức hợp lắp ráp Máy móc"
 building_machine_assembly_complex_desc:0 "Một khu phức hợp lắp ráp cao cấp, nơi các đơn vị mới được cấu trúc nên."
 building_food_processing_facility:0 "Cơ sở chế biến thực phẩm"
 building_food_processing_facility_desc:0 "Thực phẩm được xử lý trong các cơ sở này sẽ có thành phần dinh dưỡng tăng lên đáng kể."
 building_food_processing_center:0 "Trung tâm xử lý thực phẩm"
 building_food_processing_center_desc:0 "Cơ sở xử lý dạng dây chuyền, có thể xử lý lượng lớn thực phẩm."
 building_luxury_residence:0 "Khu dân cư sang trọng"
 building_luxury_residence_desc:0 "Những tòa nhà dân cư được thiết kế tỉ mỉ, bên trong toàn là căn hộ cao cấp. Các ban công với cấu trúc kỳ lạ hoàn toàn dựa vào công nghệ không trọng lực tiên tiến mới không bị sập."
 building_refinery:0 "Nhà máy tinh chế khí ngoại lai"
 building_refinery_desc:0 "Những nhà máy tinh chế tiên tiến này hoạt động ngày đêm không ngừng nghỉ để làm ra khí ngoại lai."
 building_crystal_plant:0 "Nhà máy tổng hợp pha lê"
 building_crystal_plant_desc:0 "Pha lê làm ra ở đây có chất lượng cực cao, hoàn toàn có thể lấy giả làm thật."
 building_chemical_plant:0 "Nhà máy hóa chất"
 building_chemical_plant_desc:0 "Các hạt dễ nổ với tính chất khó đoán và không ổn định được làm ra tại đây. Trong bán kính năm km quanh nhà máy nghiêm cấm mọi nguồn lửa."
 building_commercial_zone:0 "Khu thương mại"
 building_commercial_zone_desc:0 "Trong những khu thương mại này có không ít các tòa nhà văn phòng và tòa nhà thương mại cao tầng."
 building_commercial_megaplex:0 "Siêu khu phức hợp thương mại"
 building_commercial_megaplex_desc:0 "Vô số tòa nhà thương mại khổng lồ vươn thẳng lên trời cao, che khuất cả ánh nắng mặt trời."
 building_mote_harvesters:0 "Bẫy thu hạt"
 building_mote_harvesters_desc:0 "Những cơ sở có thiết kế tinh vi này dùng trường năng lượng để bắt các hạt dễ nổ, sau đó đưa chúng vào khu cách ly đặc biệt dưới lòng đất để ổn định hóa trước khi thu thập."
 building_gas_extractors:0 "Giếng khai thác khí"
 building_gas_extractors_desc:0 "Những giếng khai thác khổng lồ này khoan xuyên qua bề mặt hành tinh xuống tận nơi sâu nhất để lấy khí ngoại lai dưới lòng đất."

 building_communal_housing:0 "Nhà ở công cộng"
 building_communal_housing_desc:0 "Khu nhà ở được quy hoạch đồng bộ, giống hệt nhau về mọi mặt."
 building_communal_housing_large:1 "Nhà ở công cộng không tưởng"
 building_communal_housing_large_desc:2 "Sự kết hợp giữa nhà ở đa năng hiệu quả cao và cảnh quan được chăm chút kỹ lưỡng, xứng đáng là một kiệt tác kỹ thuật."
 building_drone_storage:0 "Kho chứa Drone"
 building_drone_storage_desc:0 "Không gian lưu trữ để tiến hành bảo dưỡng các Drone."
 building_drone_megastorage:0 "Kho chứa Drone nâng cấp"
 building_drone_megastorage_desc:0 "Sau khi cài đặt bản nâng cấp mới nhất, các Drone có thể truyền một phần điện năng từ hệ thống cung cấp điện của chính chúng vào lưới điện khi đang được bảo dưỡng."
 building_hive_warren:0 "Khu nuôi cấy Tổ đàn"
 building_hive_warren_desc:0 "Một khu nuôi cấy khổng lồ, nơi nhiều cá thể có thể nghỉ ngơi tại đây."
 building_expanded_warren:0 "Khu nuôi cấy mở rộng"
 building_expanded_warren_desc:0 "Khu nuôi cấy sau khi mở rộng có thể chứa thêm nhiều cá thể hơn nữa."
 building_nuumismatic_shrine:1 "Đền thờ Numistic"
 building_nuumismatic_shrine_desc:1 "Đền thờ cúng Numa, nữ thần của sự thịnh vượng."
 building_ranger_lodge:0 "Trạm kiểm lâm"
 building_ranger_lodge_desc:0 "Điều kiện tiên quyết để sống hòa hợp với thiên nhiên là thiên nhiên vẫn còn tồn tại. Đảm bảo thuộc địa của chúng ta không phá hoại vẻ đẹp tự nhiên là ưu tiên hàng đầu. Hành tinh này phải được giữ gìn sự trong sạch."
 building_ranger_lodge_effect: "Vật cản tự nhiên tạo ra công việc £job_ranger£$job_ranger$: §G+1§!£job_ranger£"


 mod_building_xeno_zoo_max:0 "Số lượng xây $building_xeno_zoo$ tối đa"
 mod_building_crystal_mines_max:0 "Số lượng xây $building_crystal_mines$ tối đa"
 mod_building_mote_harvesters_max:0 "Số lượng xây $building_mote_harvesters$ tối đa"
 mod_building_gas_extractors_max:0 "Số lượng xây $building_gas_extractors$ tối đa"
 mod_building_betharian_power_plant_max:0 "Số lượng xây $building_betharian_power_plant$ tối đa"

 ## TECHNOLOGIES ##
 tech_hive_node:0 "Kiến trúc điểm nút"
 tech_hive_node_desc:1 "Phát triển các điểm nút thần kinh vĩ mô để củng cố ý chí của tổ đàn."
 tech_hive_cluster:0 "Cụm điểm nút thần kinh"
 tech_hive_cluster_desc:1 "Tập trung mạng lưới các điểm nút thần kinh vĩ mô để tối đa hóa tốc độ truyền tải siêu nơ-ron trên mỗi đơn vị diện tích."
 tech_hive_confluence:0 "Nơi hội tụ tâm trí"
 tech_hive_confluence_desc:1 "Ý chí của tổ đàn có thể được củng cố hơn nữa bằng cách mở rộng quy mô trung tâm thần kinh của các siêu nơ-ron."
 tech_food_processing_1:0 "Chế biến thực phẩm"
 tech_food_processing_1_desc:1 "Kỹ thuật chế biến được cải tiến giúp thực phẩm bảo quản được lâu hơn, giảm bớt hư hỏng."
 tech_food_processing_2:0 "Chế biến thực phẩm cao cấp"
 tech_food_processing_2_desc:1 "Công nghệ bảo quản đông lạnh và tái tổ hợp protein hoàn toàn mới giúp tăng cường hiệu quả quy trình chế biến thực phẩm."
 tech_alloys_1:0 "Khuôn đúc ba chiều thể rắn"
 tech_alloys_1_desc:0 "Khuôn đúc ba chiều thể rắn có thể thay đổi hình dạng ngay lập tức, qua đó tăng tốc độ làm ra hợp kim."
 tech_alloys_2:0 "Máy tách Nano"
 tech_alloys_2_desc:0 "Máy tách Nano là bước cải tiến mang tính cách mạng cho ngành sản xuất hợp kim. Nó tối giản hóa đáng kể quy trình đúc khuôn, đồng thời nâng cao chất lượng tổng thể."
 tech_luxuries_1:0 "Lắp ráp mạch Nano"
 tech_luxuries_1_desc:0 "Với các vi mạch Nano được lập trình sẵn, rất nhiều mặt hàng tiêu dùng có thể được lắp ráp nhanh chóng tại nhà máy."
 tech_luxuries_2:0 "Trạm máy sao chép"
 tech_luxuries_2_desc:0 "Sau khi lưu trữ bản thiết kế của đồ vật, các trạm máy này có thể sao chép ra những đồ vật đã được lưu."
 tech_space_mining_1:0 "Nhà máy tinh chế không trọng lực"
 tech_space_mining_1_desc:0 "Việc lắp đặt các nhà máy tinh chế bên trong trạm khai thác khoáng vật sẽ giúp tăng cường đáng kể hiệu suất khai thác."
 tech_space_mining_2:0 "Máy quét khoáng vật tầm xa"
 tech_space_mining_2_desc:0 "Tăng cự ly của máy quét giúp nhận diện sự phân bố khoáng vật nhanh hơn, từ đó tăng hiệu suất khai thác."
 tech_space_mining_3:0 "Tia cắt quặng"
 tech_space_mining_3_desc:0 "Tia laser năng lượng cao tầm ngắn có thể dễ dàng cắt xuyên đá, giúp tăng vọt hiệu suất khai thác."
 tech_space_mining_4:0 "Drone khai thác tự động"
 tech_space_mining_4_desc:0 "Các bầy Drone được trang bị tia laser khai thác có thể tiến hành khai thác với hiệu suất cực cao ở các khu vực lân cận."
 tech_space_mining_5:0 "Tàu dò khoáng vật Nano"
 tech_space_mining_5_desc:0 "Tàu dò đặc biệt chứa hàng vạn robot Nano. Nó có thể phát hiện các mạch khoáng chưa từng được tìm thấy và đánh dấu lại để thu thập sau."
 tech_space_science_1:0 "Phòng thí nghiệm không trọng lực"
 tech_space_science_1_desc:0 "Nhiều thử nghiệm đặc thù quan trọng chỉ có thể thực hiện trong môi trường không trọng lực. Vì thế, chúng ta đã thiết kế các phòng thí nghiệm chuyên dụng này."
 tech_space_science_2:0 "Trường lực kiềm chế vi mô"
 tech_space_science_2_desc:0 "Sở hữu những trường lực kiềm chế này giúp chúng ta cách ly và lưu trữ nhiều loại vật chất hoặc mẫu vật để nghiên cứu chi tiết."
 tech_space_science_3:0 "Tàu dò lượng tử"
 tech_space_science_3_desc:0 "Những thiết bị dò tìm tiên tiến này có thể phân tích chi tiết vật thể ở cấp độ hạ nguyên tử, giúp thu thập lượng lớn dữ liệu nghiên cứu quý giá."
 tech_space_science_4:0 "Giao thức không gian tự vận hành"
 tech_space_science_4_desc:0 "Các trạm không gian được tự động hóa tốt hơn sẽ giải phóng thêm nhân sự cho công tác nghiên cứu khoa học."
 tech_space_science_5:0 "Phân tích đa chiều"
 tech_space_science_5_desc:0 "Nếu chỉ phân tích sự vật từ chiều không gian hiện tại của chúng ta thì thành quả đạt được chắc chắn là phiến diện. Phải suy nghĩ từ nhiều góc độ khác nhau."
 tech_mine_volatile_motes:0 "Ổn định hóa hạt"
 tech_mine_volatile_motes_desc:0 "Loại hạt dễ nổ mà chúng ta cần thu thập có tính chất cực kỳ thiếu ổn định và công việc thu thập cũng đầy rẫy hiểm nguy. Để tránh gây ra những chuỗi nổ liên hoàn, cần sử dụng trường năng lượng để ổn định hóa các hạt này."
 tech_mine_exotic_gases:0 "Khai thác khí ngoại lai"
 tech_mine_exotic_gases_desc:0 "Khí ngoại lai vô cùng quý giá, nhưng thu thập theo cách truyền thống là điều không tưởng. Chỉ có những kỹ thuật thu thập đặc thù mới có thể làm được."
 tech_interplanetary_commerce:0 "Thương mại liên hành tinh"
 tech_interplanetary_commerce_desc:0 "Sau khi thành lập trung tâm giao thương trên hành tinh, cơ hội làm ăn cũng trở nên phong phú hơn. Hoạt động kinh doanh sẽ mở rộng với tốc độ chóng mặt."
 tech_interstellar_economics:0 "Kinh tế học giữa các vì sao"
 tech_interstellar_economics_desc:0 "Khi chúng ta rời khỏi quê hương và lang thang trong biển sao, nền kinh tế của chúng ta cũng bước vào một kỷ nguyên hoàn toàn mới. Những thị trường mới nổi lên với tốc độ kinh ngạc, khiến các nhà kinh tế học không kịp trở tay."
 tech_holo_entertainment:0 "Giải trí ba chiều"
 tech_holo_entertainment_desc:0 "Sự vận dụng độc đáo công nghệ ba chiều đã tạo ra một môi trường ảo hoàn toàn mới với độ chân thực đáng kinh ngạc. Đây là một bước tiến lớn của nền tảng giải trí thực tế ảo nhập vai."
 tech_prescient_data_modeling:1 "Mô hình dữ liệu Numistic"
 tech_prescient_data_modeling_desc:1 "Liệu đây thực sự là sức mạnh tiên tri của giáo phái Numistic đang phát huy tác dụng? Hay chỉ là kết quả từ một phương thức tính toán tinh vi? Dù là gì đi nữa, mô hình dự đoán thị trường chứng khoán liên sao này quả thực có thể tính toán chính xác xu hướng của thị trường tài chính."
 tech_orbital_trash_dispersal:0 "Rải rác rác quỹ đạo"
 tech_orbital_trash_dispersal_desc:0 "Hệ thống quản lý oanh tạc quỹ đạo này sẽ bắn hàng triệu vật thể nhỏ ở tốc độ cao vào hành tinh mục tiêu cùng lúc, làm quá tải hệ thống phòng vệ của hành tinh đó bằng dữ liệu rác. Các tàu được trang bị thiết bị này sẽ gây thêm nhiều sát thương khi tiến hành oanh tạc quỹ đạo."
 tech_nanite_transmutation:0 "Biến đổi Nano"
 tech_nanite_transmutation_desc:2 "Việc sản xuất quy mô lớn các loại tài nguyên hiếm này đòi hỏi vật liệu Nano cực kỳ tiên tiến."

 ## DEPOSITS ##

 # Energy
 d_arid_highlands:0 "Cao nguyên khô cằn"
 d_arid_highlands_desc:1 "Hệ sinh thái cao nguyên khô ráo này chỉ mọc lưa thưa cỏ dại sa mạc và bụi rậm."
 d_hot_springs:0 "Suối nước nóng"
 d_hot_springs_desc:1 "Trên mặt những suối nước nóng này bốc lên hơi nước bốc hơi nhờ nhiệt năng từ dưới lòng đất."
 d_searing_desert:0 "Sa mạc thiêu đốt"
 d_searing_desert_desc:1 "Những sa mạc này do lượng mưa cực thấp, nhiệt độ khắc nghiệt cùng thảm thực vật thưa thớt nên không thích hợp cho đại đa số sinh vật cư trú."
 d_geothermal_vent:0 "Mạch nước phun địa nhiệt"
 d_geothermal_vent_desc:1 "Hơi nước nhiệt độ cao và khí độc trong lớp vỏ hành tinh rò rỉ ra từ những lỗ phun khí này."
 d_underwater_vent:0 "Lỗ phun dưới nước"
 d_underwater_vent_desc:1 "Trầm tích kim loại và nước siêu tới hạn xảy ra phản ứng hóa học trong lớp vỏ hành tinh, hóa chất tạo ra phun trào từ các vết nứt của mảng kiến tạo và đọng lại trên đáy biển."
 d_rushing_waterfalls:0 "Thác nước cuồn cuộn"
 d_rushing_waterfalls_desc:1 "Dòng suối từ những vách đá cao nguyên đổ xuống, tạo nên cảnh đẹp tựa như dải ngân hà tuôn rơi."
 d_frozen_gas_lake:0 "Hồ khí đóng băng"
 d_frozen_gas_lake_desc:1 "Những loại khí hóa rắn do áp suất cao từ vô vàn năm trước vẫn được bảo quản nguyên vẹn trong môi trường nhiệt độ siêu thấp dưới đáy hồ này."
 d_bubbling_swamp:0 "Đầm lầy sủi bọt"
 d_bubbling_swamp_desc:1 "Khu vực đất ngập nước này với dòng chảy chậm và thảm thực vật phong phú, đã trở thành cái nôi cho các loài thực vật thủy sinh, côn trùng và chướng khí đầm lầy."
 d_fuming_bog:0 "Vũng lầy bốc khói"
 d_fuming_bog_desc:1 "Đầm lầy độc hại này được bao phủ bởi các loài thực vật thấp bé, rêu phong và nấm, mặt nước thỉnh thoảng lại sủi bong bóng khí."
 d_tempestous_mountain:0 "Dãy núi bão tố"
 d_tempestous_mountain_desc:1 "Trên các sườn dốc của vùng núi nhiều mưa này mọc những loài cây cứng cáp đã trải qua sự tàn phá của cuồng phong."
 d_dust_desert:0 "Sa mạc bụi"
 d_dust_desert_desc:0 "Một sa mạc trải rộng mênh mông, ẩn sâu dưới lớp đất là những hạt dễ nổ quý hiếm. Muốn tiến hành thu thập, bắt buộc phải có thiết bị phù hợp."
 d_dust_caverns:0 "Hang động bụi"
 d_dust_caverns_desc:1 "Những hang động cát và hố rỗng ẩn giấu này chứa đầy những hạt dễ nổ quý hiếm."
 d_numas_breath:0 "Hơi thở của Numa"
 d_numas_breath_desc:0 "Vết nứt ổn định khoét sâu vào lớp vỏ hành tinh này được tạo ra bởi $NAME_Caravaneer_Fleet2$."
 d_nanosands:0 "Cát Nano"
 d_nanosands_desc:0 "Những cồn cát trải dài vô tận trên hành tinh này thực chất hoàn toàn được cấu tạo từ robot Nano. Cấu trúc bên trong của những robot này đã mục nát từ lâu, không thể tái kích hoạt, nhưng lại cung cấp cho chúng ta lượng hạt kim loại hiếm bao phủ cả một hành tinh."

 # Minerals
 d_crystal_forest:0 "Rừng pha lê"
 d_crystal_forest_desc:1 "Những tinh thể sáng chói tỏa ra ánh hào quang, tựa như phủ lên khu rừng kỳ dị này một lớp sương giá trắng muốt."
 d_veiny_cliffs:0 "Vách đá lộ mạch"
 d_veiny_cliffs_desc:1 "Lượng lớn các mạch khoáng quý giá lộ ra trên những sườn dốc vách đá này."
 d_ore_rich_caverns:0 "Hang động giàu quặng"
 d_ore_rich_caverns_desc:1 "Những hang động dưới lòng đất này chứa đầy các vật chất kim loại và mỏ khoáng sản."
 d_mineral_fields:0 "Bãi khoáng sản"
 d_mineral_fields_desc:1 "Sự vận động của lớp vỏ hành tinh đã khiến những khoáng vật hữu ích này lộ ra trên mặt đất từ vô vàn năm trước."
 d_rich_mountain:0 "Ngọn núi trù phú"
 d_rich_mountain_desc:1 "Sườn núi này được điểm xuyết bởi đủ loại mỏ khoáng sản và các loại đá quý giá."
 d_crystal_reef:0 "Rạn pha lê"
 d_crystal_reef_desc:1 "Mạng tinh thể lấp lánh rạng rỡ giữa đống đá của rạn cát này."
 d_prosperous_mesa:0 "Bàn thạch phồn vinh"
 d_prosperous_mesa_desc:1 "Sườn dốc của ngọn núi bằng này vô cùng hiểm trở, nhưng lại chứa đầy các loại tài nguyên hữu ích."
 d_crystalline_caverns:0 "Hang động pha lê"
 d_crystalline_caverns_desc:1 "Những hang động này tựa như các hốc tinh thể khổng lồ, bên trong chứa đầy pha lê hiếm."
 d_submerged_ore_veins:0 "Mạch quặng ngập nước"
 d_submerged_ore_veins_desc:2 "Lượng lớn mỏ khoáng sản rải rác dưới đáy biển nơi đây, rất thích hợp để khai thác dưới biển sâu."

 # Food
 d_bountiful_plains:0 "Đồng bằng trù phú"
 d_bountiful_plains_desc:1 "Đất đai màu mỡ và cỏ dại rậm rạp tô điểm cho vùng đồng bằng này, rất thích hợp để cải tạo thành đất nông nghiệp."
 d_nutritious_mudland:0 "Bãi bùn giàu dưỡng chất"
 d_nutritious_mudland_desc:1 "Lớp đất sét đặc quánh, bùn cát và đất thịt trải dài tận chân trời, nuôi dưỡng nên một thảm thực vật thấp bé khổng lồ."
 d_green_hills:0 "Đồi xanh"
 d_green_hills_desc:1 "Khu vực đồi núi được bao phủ bởi lớp đất màu mỡ và thảm thực vật xanh tươi."
 d_forgiving_tundra:1 "Đài nguyên khoan dung"
 d_forgiving_tundra_desc:1 "Cỏ lác, bụi rậm và địa y che phủ hệ sinh thái trên cao này, lớp đất cái đóng băng vĩnh cửu ở đây rõ ràng giàu dinh dưỡng hơn hẳn so với bình thường."
 d_rugged_woods:0 "Khu rừng gồ ghề"
 d_rugged_woods_desc:1 "Khu rừng nhiều đá lạnh lẽo này lại mọc lên rất nhiều loài thực vật thân thảo ở tầng thấp."
 d_boggy_fens:0 "Đầm lầy ẩm ướt"
 d_boggy_fens_desc:1 "Vùng đất ngập nước có độ cao cực thấp này chứa lượng lớn chất dinh dưỡng cho thực vật."
 d_lush_jungle:0 "Rừng rậm tươi tốt"
 d_lush_jungle_desc:1 "Thảm thực vật và tán rừng quá rậm rạp khiến đất đai của khu rừng này không được màu mỡ cho lắm, nhưng bù lại cây cỏ và cây ăn quả lại nhiều không đếm xuể."
 d_lichen_fields:0 "Đồng bằng rêu"
 d_lichen_fields_desc:1 "Rêu ẩm, địa y và các loài nấm giống như trải một tấm thảm xanh lên vùng đồi núi hiểm trở này."
 d_fungal_caves:0 "Hang động nấm"
 d_fungal_caves_desc:1 "Mạng lưới hang động rộng lớn này mọc đủ loại nấm ăn được, chúng không cần bất kỳ ánh sáng mặt trời hay đất đai màu mỡ nào mà vẫn sinh trưởng mạnh mẽ."
 d_fungal_forest:0 "Rừng nấm"
 d_fungal_forest_desc:1 "Khu vực này hoàn toàn được cấu tạo từ những cây nấm khổng lồ vươn tận trời mây chứ không hẳn là rừng cây. Mũ của những cây nấm này tạo thành một lớp tán rợp bóng, mang đến môi trường sinh thái tuyệt vời cho vô số sinh vật vi mô."
 d_fertile_lands:0 "Vùng đất trù phú"
 d_fertile_lands_desc:1 "Khu vực đồng bằng rộng lớn này được xem là lựa chọn hoàn hảo để làm đất canh tác."
 d_marvelous_oasis:0 "Ốc đảo diệu kỳ"
 d_marvelous_oasis_desc:1 "Ốc đảo này có thể coi là viên ngọc xanh rực rỡ giữa vùng đất hoang vu này."
 d_great_river:0 "Sông lớn cuồn cuộn"
 d_great_river_desc:1 "Tốc độ dòng chảy của sông ở đây cực kỳ chậm, tạo điều kiện cho lượng lớn sinh vật và thực vật vùng nước nông sinh sôi."
 d_black_soil:0 "Đất đen màu mỡ"
 d_black_soil_desc:1 "Những vùng đất này có độ ẩm cực cao, đồng thời chứa nhiều hợp chất cần thiết cho sự phát triển của thực vật, rất thích hợp cho canh tác."
 d_teeming_reef:0 "Rạn san hô trù phú"
 d_teeming_reef_desc:1 "Hệ sinh thái tràn trề sức sống này chứa đầy các rạn san hô, cá, động vật thân mềm, động vật có vú, động vật không xương sống và các sinh vật biển khác."
 d_tropical_island:0 "Đảo nhiệt đới"
 d_tropical_island_desc:1 "Cây cối trĩu quả và thảm thực vật đa dạng trên hòn đảo như chốn bồng lai này chắc chắn sẽ mang lại mùa màng bội thu."
 d_metal_boneyard:0 "Phế tích kiến trúc"
 d_metal_boneyard_desc:1 "Những tòa nhà sụp đổ chỉ còn lại trơ trọi bộ khung kim loại trống rỗng, khi gió rít qua, những bộ khung này dường như phát ra những tiếng kêu than thảm thiết."
 d_organic_landfill:0 "Bãi chôn lấp rác hữu cơ"
 d_organic_landfill_desc:1 "Rác thải hóa học độc hại đang phân hủy dưới cái nắng thiêu đốt và bốc lên những làn khói mỏng."

 # Energy

 # Special
 d_betharian_deposit:0 "Đồng bằng Betharian"
 d_betharian_deposit_desc:1 "Hàng nghìn viên đá Betharian quý giá điểm xuyết khắp khu vực này."
 d_alien_pets_deposit:0 "Thung lũng hẻo lánh"
 d_alien_pets_deposit_desc:1 "Thung lũng nguyên thủy này nằm ẩn mình giữa những ngọn núi bao quanh, bảo vệ quần thể động vật độc đáo của nó khỏi những mãnh thú rình rập xung quanh."
 d_dragon_monument:0 "$building_guardian_dragon_monument$"
 d_dragon_monument_desc:0 "$building_guardian_dragon_monument_desc$"
 d_stellarite_trophy:0 "$building_stellarite_trophy$"
 d_stellarite_trophy_desc:0 "$building_stellarite_trophy_desc$"
 d_buzzing_plains:0 "Đồng bằng rì rầm"
 d_buzzing_plains_desc:0 "Những đồng bằng lộng gió này luôn phát ra tiếng rì rầm do tĩnh điện."
 d_mineral_striations:0 "Dải khoáng sản"
 d_mineral_striations_desc:0 "Những đứt gãy nông đã đưa các mạch khoáng sản trù phú lên mặt đất."
 d_natural_farmland:0 "Đất nông nghiệp tự nhiên"
 d_natural_farmland_desc:0 "Những đồng bằng này được tự nhiên chia cắt thành những hình khối hình học có quy luật đến kinh ngạc, trở thành địa hình thiên nhiên cực kỳ lý tưởng để phát triển nông nghiệp."

 # Earth
 d_scandinavian_reclamation_sector:0 "Khu vực tái phát triển Bắc Âu"
 d_scandinavian_reclamation_sector_desc:0 "Chiến dịch phục hồi và tái phát triển quy mô lớn diễn ra vào cuối thế kỷ 22 tỏ ra vô cùng hiệu quả, ngoại trừ một vài khu vực nhiễm phóng xạ cứng đầu nhất, những khu vực khác đều đã trở lại bình thường. Tỷ lệ đột biến gen kể từ sự cố rò rỉ hạt nhân đã giảm xuống mức thấp nhất."
 d_saharan_irrigation_project:0 "Dự án thủy lợi Sahara"
 d_saharan_irrigation_project_desc:0 "Hồi chiến dịch Sahara Xanh mới được đề xuất, Giáo sư Izquierdo đã vấp phải sự nhạo báng từ mọi tầng lớp... nhưng giờ chắc chẳng còn ai nhớ đến chuyện đó nữa."
 d_mesopotamian_urban_corridor:0 "Hành lang đô thị Lưỡng Hà"
 d_mesopotamian_urban_corridor_desc:0 "Siêu đô thị khổng lồ gần như bao phủ toàn bộ vùng Lưỡi liềm Màu mỡ này tự bản thân nó đã là một lời tri ân dành cho cái nôi của nền văn minh."
 d_boswash_metropolitan_axis:0 "Trục đô thị Boston-Washington"
 d_boswash_metropolitan_axis_desc:0 "Bạo loạn Boston-Washington đã để lại vết thương khó lành cho cả một thế hệ. Và cũng chính vì vậy mà các cuộc cải cách luật pháp triệt để mới được diễn ra. Đừng bao giờ quên sự hy sinh của những người đi trước!"
 d_mauritanian_security_zone:0 "Khu vực an ninh Mauritania"
 d_mauritanian_security_zone_desc:0 "Tại đây, Đại tá Tetcher cùng một vài binh sĩ sống sót đã tiến hành trận chiến tử thủ lừng danh thế giới. Cho đến tận bây giờ, thỉnh thoảng người ta vẫn phát hiện ra những quả đạn xịt từ thời đó."
 d_great_albertan_crater:0 "Miệng núi lửa khổng lồ Alberta"
 d_great_albertan_crater_desc:0 "Khi tin tức Satis 711494 đang tiến gần Trái Đất được truyền đi, nó đã gây ra một sự kiện hoảng loạn quy mô lớn kéo dài 72 năm. Mọi người đều cho rằng ngày tàn của Trái Đất đã đến—điều gì phải đến cuối cùng cũng sẽ đến. May mắn thay, kích thước của Satis 711494 không đủ lớn để phá hủy toàn bộ Trái Đất, nhưng phần lớn khu vực Alberta đã không may bị xóa sổ khỏi bản đồ."
 d_pacific_algae_tracts:0 "Dải tảo Thái Bình Dương"
 d_pacific_algae_tracts_desc:0 "Cảnh tượng hùng vĩ chỉ có thể chiêm ngưỡng khi lặn xuống đáy biển. Dường như nó có thể trải dài mãi mãi, không có điểm dừng."
 d_delhi_sprawl:0 "Khu đô thị Delhi"
 d_delhi_sprawl_desc:0 "Cho đến cuối thế kỷ 22, Tháp thương mại Lakshmi vẫn là tòa nhà cao nhất Trái Đất. Hình dáng đặc biệt của nó cho đến nay vẫn là một cảnh quan độc đáo trong khu đô thị Delhi."
 d_pearl_river_agglomerate:0 "Khu cụm đô thị Châu Giang"
 d_pearl_river_agglomerate_desc:0 "Khu vực Châu Giang là nơi đầu tiên trên Trái Đất chính thức được xếp loại siêu đô thị. Chính sách chống ô nhiễm Tam giác Vàng được phát huy mạnh mẽ tại đây sẽ tiếp tục được các thành phố lớn trên toàn thế giới áp dụng."
 d_great_pacific_garbage_patch:0 "£blocker£ Bãi rác Thái Bình Dương"
 d_great_pacific_garbage_patch_desc:0 "Lượng rác thải nhựa khổng lồ do con người tạo ra đã bao phủ một phần lớn Thái Bình Dương."
 d_failing_infrastructure_earth:0 "$d_failing_infrastructure$"
 d_failing_infrastructure_earth_desc:0 "$d_failing_infrastructure_desc$"


 # Event
 d_migrating_forests:0 "Rừng di cư"
 d_migrating_forests_desc:1 "Những khu rừng di cư trên thế giới này thường xuyên di chuyển tập thể đến các khu vực mới, phá hủy các con đường đã được xây dựng, đường dây tải điện và cơ sở hạ tầng khác."
 d_migrating_forest_reserve:0 "Khu bảo tồn rừng di cư"
 d_migrating_forest_reserve_desc:1 "Toàn bộ khu vực này được cách ly để cho rừng di cư sinh trưởng. Chúng có thể sinh sống an toàn tại đây mà không phải lo lắng về việc gây thiệt hại cho các thành phố."
 d_junk_wastes:0 "Bãi phế liệu"
 d_junk_wastes_desc:1 "Bãi rác này rộng mênh mông, thỉnh thoảng còn có thể nhìn thấy những đống phế liệu khổng lồ vươn lên."
 d_junk_canals:0 "Kênh rạch rác thải"
 d_junk_canals_desc:1 "Những con lạch hẹp uốn lượn qua bãi rác, khiến cho đất đai cục bộ vô cùng màu mỡ."
 d_junk_hollows:0 "Hang động rác"
 d_junk_hollows_desc:1 "Những hang động ngầm dưới các đống rác này rất phù hợp để xây dựng lò phản ứng."
 d_irradiated_valley:0 "Thung lũng nhiễm phóng xạ"
 d_irradiated_valley_desc:1 "Một đợt bùng phát bức xạ mặt trời với lượng phóng xạ vượt ngưỡng đã quét qua thung lũng hẻo lánh này."
 d_valley_of_zanaam:0 "Thung lũng Zanaam"
 d_valley_of_zanaam_desc:0 "Trong thung lũng này sừng sững những tấm bia đá vô cùng bí ẩn, trên đó khắc đầy ngôn ngữ ngoài hành tinh không còn được lưu hành. Khi đến gần bia đá, người ta có thể cảm nhận được âm thanh rì rầm đầy năng lượng dao động, đồng thời cảm thấy đau đầu."
 d_abandoned_primitive_homesteads:1 "Nơi ở bị bỏ hoang"
 d_abandoned_primitive_homesteads_desc:1 "Khu định cư bị bỏ hoang này từng là nơi sinh sống của một loài bò sát. Mặc dù chúng vẫn còn tồn tại trên hành tinh này, nhưng nay đã thoái hóa thành những sinh vật không có trí tuệ."
 d_the_zone:0 "Khu vực A"
 d_the_zone_desc:0 "Trên hành tinh này có một khu vực hình vuông rộng mười ba km, rải rác những tàn tích không rõ nguồn gốc và rất nhiều tạo tác ngoài hành tinh độc đáo và kỳ lạ. Điều khó hiểu là, nó cũng khiến những người ghé thăm nảy sinh cảm giác mãn nguyện."
 d_hyperfertile_valley:0 "Thung lũng siêu màu mỡ"
 d_hyperfertile_valley_desc:1 "Đất đai ở thung lũng này cực kỳ màu mỡ, nhờ đó mà thảm thực vật xanh tươi mọc tràn ngập khắp nơi."
 d_ancient_mining_site:0 "Mỏ quặng cổ đại"
 d_ancient_mining_site_desc:1 "Mỏ quặng cổ đại này dù đã trải qua thời gian rất dài, nhưng phần lớn thiết bị khai thác vẫn còn hoạt động tốt."
 d_toy_factory_complex:0 "Khu phức hợp nhà máy đồ chơi"
 d_toy_factory_complex_desc:0 "Các nhà máy quy mô lớn liên tục vận hành, nhào nặn các khối polymer cao phân tử thành những vật thể nhỏ gọn với đủ hình dáng và công dụng không rõ ràng."
 d_mutant_landfill:0 "Bãi chôn lấp đột biến"
 d_mutant_landfill_desc:0 "Xác chết của các sinh vật đột biến chất đống lên nhau tạo thành một khung cảnh kinh hoàng. Các chất hữu cơ không ổn định xoắn lại với nhau, hình thành nên một loại cấu trúc nào đó."
 d_ancient_bombardment_craters:0 "Hố bom cổ đại"
 d_ancient_bombardment_craters_desc:1 "Hành tinh này từng hứng chịu những đợt oanh tạc quỹ đạo dữ dội từ vô vàn năm trước. Trên mặt đất vẫn còn chằng chịt những hố bom khổng lồ do đợt oanh tạc tạo ra."
 d_ancient_battlefield:0 "Chiến trường cổ đại"
 d_ancient_battlefield_desc:1 "Hành tinh này từng tồn tại một loại nền văn minh nào đó, nhưng đã bị một thế lực ngoại lai phá hủy. Chiến trường cổ đại ngổn ngang mảnh vỡ này là minh chứng cho sự vùng vẫy tuyệt vọng của họ."
 d_irradiated_ruins:0 "Phế tích nhiễm phóng xạ"
 d_irradiated_ruins_desc:1 "Hai siêu cường quốc sinh sống trên hành tinh này từng nổ ra một cuộc chiến tranh hạt nhân quy mô lớn, và đây chính là tàn tích do cuộc chiến để lại."
 d_impact_crater:0 "Miệng hố thiên thạch"
 d_impact_crater_desc:1 "Miệng hố khổng lồ sinh ra khi thiên thạch lớn đâm xuống mặt đất. Trong hố vẫn còn sót lại khoáng vật từ thiên thạch."
 d_odd_factory:0 "Nhà máy kỳ lạ"
 d_odd_factory_desc:0 "Nhà máy vô cùng tinh xảo, dường như là tàn tích do một nền văn minh nào đó để lại trên hành tinh này. Có thể dùng để làm ra các tài nguyên quý giá."
 #d_odd_factory_wreckage_1: "Odd Factory Wreckage"
 #d_odd_factory_wreckage_1_desc: ""
 #d_odd_factory_wreckage_2: "$d_odd_factory_wreckage_1$"
 #d_odd_factory_wreckage_2_desc: "$d_odd_factory_wreckage_1_desc$"
 d_ancient_particle_accelerator:0 "Máy gia tốc hạt cổ đại"
 d_ancient_particle_accelerator_desc:0 "Máy gia tốc hạt vô cùng cổ xưa, nhưng cấu tạo của nó lại rất mới mẻ. Từ những bộ phận còn hoạt động được có thể thu thập một lượng lớn dữ liệu nghiên cứu. Những dữ liệu này chắc chắn được tổng hợp bởi một nhà vật lý thiên tài nào đó."
 d_underground_vault:0 "Hầm trú ẩn dưới lòng đất"
 d_underground_vault_desc:0 "Hầm trú ẩn ngầm khổng lồ, hẳn là được người bản địa của hành tinh này dùng làm hầm tránh bom. Tuy nhiên, sau khi thức ăn dự trữ cạn kiệt, những người bản địa này bắt đầu tàn sát lẫn nhau."
 d_underground_vault_2:0 "$d_underground_vault$"
 d_underground_vault_2_desc:0 "Hầm trú ẩn ngầm khổng lồ, hẳn là được người bản địa của hành tinh này dùng làm hầm tránh bom. Trong hầm có một khu cơ khí quy mô lớn cùng vô số trang bị đào bới."
 d_cryonic_clones:0 "Đài tưởng niệm người nhân bản đông lạnh"
 d_cryonic_clones_desc:0 "Khi thế giới dạng vòng này vẫn còn là đống đổ nát, có hàng trăm sinh vật nhân bản ngoài hành tinh được niêm phong trong các buồng ngủ đông. Hiện tại những buồng ngủ đông được phục hồi này đã trở thành một đài tưởng niệm."
 d_flooded_mounds:0 "Gò đất ngập nước"
 d_flooded_mounds_desc:0 "Dưới đáy đại dương sâu thẳm của thế giới này có thể tìm thấy hàng ngàn gò đất nối liền với nhau, tựa như do một đàn mối khổng lồ xây dựng nên. Thực chất đây là di tích do một loài động vật chân đốt thông minh cổ đại để lại."
 d_processing_pens:0 "Khu nuôi cấy"
 d_processing_pens_desc:0 "Loài nấm bản địa của hành tinh này sau khi trải qua quá trình biến đổi gen đã trở nên rất hiền lành, và... ăn cực kỳ ngon. Trong những khu chăn nuôi rộng lớn này, các sinh vật này sau khi được cho ăn sẽ bị thu hoạch để làm thức ăn."
 d_harvester_fields:0 "Cánh đồng máy gặt"
 d_harvester_fields_desc:0 "Những chiếc máy gặt bằng năng lượng mặt trời từ thời cổ đại được dùng để hỗ trợ thu hoạch trên những cánh đồng bạt ngàn cây ăn được này."
 d_wetware_computer:0 "Máy tính sinh học"
 d_wetware_computer_desc:0 "Đại đa số vùng biển trên thế giới này bị bao phủ bởi một mạng lưới tảo biển nào đó, dường như là một loại máy tính sinh học vô cùng thô sơ."
 d_savage_wildlands:0 "Vùng hoang dã chưa khai hóa"
 d_savage_wildlands_desc:0 "Các loài bản địa sống ở khu vực này dường như đều cộng sinh như một sinh vật duy nhất."
 d_worm_mine:0 "$building_worm_mine$"
 d_worm_mine_desc:0 "$building_worm_mine_desc$"
 d_worm_farm:0 "$building_worm_farm$"
 d_worm_farm_desc:0 "$building_worm_farm_desc$"
 d_bore_mining_zone:0 "Khu vực khoan mỏ"
 d_bore_mining_zone_desc:1 "Từng hàng giàn khoan điều khiển từ xa, mỗi giàn đều trang bị máy bơm nước áp suất cao để hút khoáng vật đào từ dưới lòng đất lên mặt đất thông qua giếng khoan."
 d_reactor_belt:0 "Vành đai lò phản ứng"
 d_reactor_belt_desc:1 "Một quần thể cơ sở lò phản ứng vô tận trải dài khuất tầm nhìn của thiết bị cấy ghép thị giác."
 d_underground_farm:0 "Hang động nông nghiệp ngầm"
 d_underground_farm_desc:0 "Mạng lưới hang động ngầm vô cùng rộng lớn, trong đó có nhiều trang trại nuôi nấm, khu săn bắn và những hồ nước chứa đầy động thực vật ăn được."
 d_underground_mine:0 "Mỏ ngầm"
 d_underground_mine_desc:0 "Thông qua những đường hầm ngầm này, có thể tiếp cận những mạch khoáng sản trù phú không thể với tới từ trên mặt đất."
 d_underground_generator:0 "Khu vực phát điện ngầm"
 d_underground_generator_desc:0 "Địa nhiệt sinh ra từ lõi nóng chảy của hành tinh và các con sông ngầm cuồn cuộn cung cấp nguồn năng lượng vô cùng dồi dào cho hành tinh này."
 d_underground_contact_zone:0 "Khu vực tiếp xúc ngầm"
 d_underground_contact_zone_desc:0 "Khu vực dành cho cư dân dưới lòng đất và trên mặt đất gặp gỡ và bàn bạc, giúp cả hai bên có thể cùng nhau kiến tạo hòa bình và thịnh vượng."
 d_underground_farm_blocked:0 "Hang động nông nghiệp đông đúc"
 d_underground_farm_blocked_desc:0 "Những khu vực ngầm này đang được nền văn minh bản địa tận dụng tối đa."
 d_underground_mine_blocked:0 "Mỏ ngầm đông đúc"
 d_underground_mine_blocked_desc:0 "Những khu vực ngầm này đang được nền văn minh bản địa tận dụng tối đa."
 d_underground_generator_blocked:0 "Khu phát điện ngầm đông đúc"
 d_underground_generator_blocked_desc:0 "Những khu vực ngầm này đang được nền văn minh bản địa tận dụng tối đa."
 d_underground_farm_dead:2 "£blocker£ Hang động xác chết la liệt"
 d_underground_farm_dead_desc:0 "Nơi đây chứa đầy xác của cư dân dưới lòng đất. Nếu muốn sử dụng nơi này, trước tiên phải dọn sạch toàn bộ đống xác chết."
 d_underground_mine_dead:2 "£blocker£ Mỏ ngầm xác chết la liệt"
 d_underground_mine_dead_desc:0 "Nơi đây chứa đầy xác của cư dân dưới lòng đất. Nếu muốn sử dụng nơi này, trước tiên phải dọn sạch toàn bộ đống xác chết."
 d_underground_generator_dead:2 "£blocker£ Khu phát điện ngầm xác chết la liệt"
 d_underground_generator_dead_desc:0 "Nơi đây chứa đầy xác của cư dân dưới lòng đất. Nếu muốn sử dụng nơi này, trước tiên phải dọn sạch toàn bộ đống xác chết."
 d_portal_research_zone:0 "Khu nghiên cứu cổng dịch chuyển"
 d_portal_research_zone_desc:0 "Cơ sở an ninh được xây dựng gần cổng dịch chuyển không gian, nơi các nhà nghiên cứu khám phá những bí ẩn của nó."
 physicist_is_dimension_portal_researcher_tt: "$t$[GetBasePhysicistPluralWithIcon] được chuyển đổi thành [GetDimensionPortalResearcherPluralWithIcon]"
 d_portal_research_zone_gestalt:0 "Khu nghiên cứu cổng dịch chuyển"
 d_portal_research_zone_gestalt_desc:0 "Cơ sở an ninh được xây dựng gần cổng dịch chuyển không gian, nơi các nhà nghiên cứu khám phá những bí ẩn của nó."
 d_ancient_one:0 "$ancient_one$"
 d_ancient_one_desc:0 "$ancient_one_desc$"
 d_fungoid_extermination:1 "£blocker£ Tàn dư sinh vật nấm"
 d_fungoid_extermination_desc:0 "Chất nhầy độc hại này là tàn dư duy nhất còn sót lại sau khi sinh vật nấm bị tiêu diệt."
 d_ruined_arcology:1 "£blocker£ Phế tích Arcology"
 d_ruined_arcology_desc:0 "Thành phố Arcology từng bao phủ cả hành tinh đô thị này nay đã hóa thành đống đổ nát. Mặc dù nền móng vẫn vững chắc, nhưng cần phải dọn dẹp nhiều cấu trúc mục nát thì mới có thể tiến hành xây dựng lại."
 d_egg_cracking:0 "$egg_cracking$"
 d_egg_cracking_desc:0 "$egg_cracking_desc$"

