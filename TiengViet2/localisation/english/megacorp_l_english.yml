 job_hive_sustenance_drone:0 "Cá thể Hậu cần Tích dưỡng"
 job_hive_sustenance_drone_plural:0 "Cá thể Hậu cần Tích dưỡng"
 job_hive_sustenance_drone_desc:0 "Sự thành bại của một Tâm trí Quần thể phụ thuộc phần lớn vào khả năng điều phối tài nguyên."
 mod_job_hive_sustenance_drone_add:0 "Việc làm $job_hive_sustenance_drone$"

 job_hive_basic_agri_drone:0 "Cá thể Nông nghiệp Cơ bản"
 job_hive_basic_agri_drone_plural:0 "Cá thể Nông nghiệp Cơ bản"
 job_hive_basic_agri_drone_desc:0 "Những cá thể chất phác, cạn nghĩ này nai lưng làm việc trên những cánh đồng. Trong não bộ của chúng chỉ đủ nhận thức rằng đồ ăn là thứ có thể trồng được, ngoài ra thì chẳng biết gì sất."
 mod_job_hive_basic_agri_drone_add:0 "Việc làm $job_hive_basic_agri_drone$"

 job_primitive_hive_warrior:0 "Cá thể Chiến đấu Sơ cấp"
 job_primitive_hive_warrior_plural:0 "Cá thể Chiến đấu Sơ cấp"
 job_primitive_hive_warrior_desc:0 "Do chưa làm chủ được kỹ nghệ tinh chỉnh gen, bầy cá thể này đành phải phát tướng to xác hơn để lấy thân mình bảo vệ tổ. Chúng hoàn toàn chưa tiến hóa ra thứ chi chuyên biệt nào để làm vũ khí."
 mod_job_primitive_hive_warrior_add:0 "Việc làm $job_primitive_hive_warrior$"

 job_primitive_hive_synapse_drone:1 "Cá thể Khớp thần kinh Non nớt"
 job_primitive_hive_synapse_drone_plural:1 "Cá thể Khớp thần kinh Non nớt"
 job_primitive_hive_synapse_drone_desc:0 "Chúa tể mới nhú giữa bầy cá thể bản địa đang khao khát khuếch trương tầm phủ sóng của mình. Lũ cá thể khớp thần kinh này khôn lỏi hơn chút xíu, sinh ra cốt là để đóng vai trạm phát sóng ý thức."
 mod_job_primitive_hive_synapse_drone_add:0 "Việc làm $job_primitive_hive_synapse_drone$"

 job_primitive_hive_cerebellum_drone:0 "Cá thể Tiểu não"
 job_primitive_hive_cerebellum_drone_plural:0 "Cá thể Tiểu não"
 job_primitive_hive_cerebellum_drone_desc:0 "Biết xăm soi nghịch cảnh để mò mẫm ra hướng giải quyết chính là điềm báo của một xã hội hưng thịnh. Lũ cá thể này cắm đầu vào việc mớm giải pháp cho đồng bọn, đồng thời né thính những tai ương tiềm ẩn."
 mod_job_primitive_hive_cerebellum_drone_add:0 "Việc làm $job_primitive_hive_cerebellum_drone$"

 job_primitive_hive_factory_drone:0 "Cá thể Công xưởng"
