 cara.3002.title:0 "Đã tiêu diệt $NAME_Caravaneer_Fleet3$"
 cara.3002.desc:0 "Về hoạt động thù địch diễn ra tại hệ sao [From.From.solar_system.GetName], hiện tại hạm đội [From.From.GetName] rất vui mừng báo cáo rằng $NAME_Caravaneer_Fleet3$ đã bị phá hủy.\n\nĐoàn thương nhân $NAME_Caravaneer_Fleet3_species$ từng vang bóng một thời, giờ chỉ còn là đống rác trôi dạt giữa các vì sao. Từ nay về sau bọn chúng sẽ không bao giờ làm phiền chúng ta được nữa."
 cara.3003.title:0 "$NAME_Caravaneer_Fleet3$ Bị Tiêu diệt"
 cara.3003.desc:0 "Tin tức đã bay đến [Root.Capital.GetName], $NAME_Caravaneer_Fleet3$ đã không còn tồn tại.\n\nSau cuộc đụng độ với [From.GetName], đoàn thương nhân $NAME_Caravaneer_Fleet3_species$ khét tiếng một thời, giờ chỉ còn là đống rác trôi dạt giữa các vì sao.\n\nHy vọng kết cục này sẽ làm họ thấy mãn nguyện."

 cara.4000.name:0 "§HThương đoàn§!: Cỏ Xanh Thăm Thẳm"
 cara.4000.desc:0 "Báo cáo từ [pops_join_caravan_planet.GetName] cho biết, một nhóm cư dân đã rời bỏ thuộc địa để gia nhập hạm đội [pops_join_caravan_fleet.GetName] đang băng qua lãnh thổ của chúng ta. Ngoài miệng họ bảo là vì ước mơ phiêu lưu, nhưng thực chất chỉ là bị lợi ích trần trụi làm cho mờ mắt mà thôi."
 cara.4000.a.tooltip:0 "§R100§! £pop£ §HDân số§! đã rời khỏi §Y[pops_join_caravan_planet.GetName]§!"

 cara.4010.name:0 "§HThương đoàn§!: Đặc quyền Bản địa"
 cara.4010.desc:0 "Có tin khẩn từ [caravan_pops_join_planet.GetName] báo rằng, một nhóm cựu thành viên của [caravan_pops_join_country.GetName] hiện đang xin tị nạn chính trị trên hành tinh này. Chính quyền địa phương quyết định báo cáo tình hình lên trên để cấp cao hơn định đoạt."
 cara.4010.a:0 "Hoan nghênh bất cứ ai muốn cống hiến cho [Root.GetName]."
 cara.4010.a.tooltip:2 "§G300§! §Y[caravan_pops_join_country.GetSpeciesName]§! £pop£ §HDân số§! gia nhập thuộc địa [caravan_pops_join_planet.GetName]"
 cara.4010.b:0 "Đuổi cổ họ đi."

 cara.4020.name:0 "§H$caravaneers$§!: Tàn Tạ Rách Nát"
 cara.4020.desc:2 "Tình báo viên đóng quân tại trạm không gian ở hệ sao [caravan_hulk_system.GetName] báo cáo rằng, [caravan_hulk_country.GetName] đã rời đi và bỏ lại một con tàu tồi tàn, hiện đang trôi dạt trên quỹ đạo bất ổn quanh ngôi sao trung tâm."
 cara.4020.a:0 "Đồng nát phế liệu cũng là vàng..."
 cara.4020.b:0 "Cứ để ngôi sao nuốt chửng nó đi."
 cara.4020.c:0 "Kéo nó về trạm không gian của chúng ta để rã phế liệu."
 cara.4020.c.tooltip:3 "Thu phí dịch vụ của [caravan_hulk_country.GetName]."

 cara.4025.name:0 "$cara.4020.name$"
 cara.4025.desc:0 "Có lẽ vì là tàu vận tải dân sự nên cơ sở dữ liệu trên tàu chưa bị xóa sạch theo quy trình hủy bỏ. Mặc dù không tìm thấy món nào có giá trị trên tàu, các nhà khoa học của chúng ta vẫn xoay xở lấy được một phần dữ liệu về một loại công nghệ ngoại lai vô danh."

 cara.4030.name:0 "§HThương đoàn§!: Tiễn Khách!"
 cara.4030.desc:0 "Hôm nay trên [disgruntled_planet.GetName] đã nổ ra những cuộc biểu tình quy mô lớn, nhằm phản đối những trò lố lăng của [xeno_fleet.GetName] trong hệ sao này. Sự hiện diện bẩn thỉu của chúng đã chọc giận bất cứ cá nhân [disgruntled_planet.owner.Species.GetNamePlural] nào có tinh thần chính nghĩa."
 cara.4030.a:0 "Ra lệnh cho chúng tránh xa [disgruntled_planet.GetName]"
 cara.4040.name:0 "§HThương đoàn§!: Nhiệt Liệt Chào Mừng!"
 cara.4040.desc:0 "Khi [welcome_fleet.GetName] tiến vào quỹ đạo [pleased_planet.GetName] để ghé thăm chớp nhoáng theo kế hoạch, một hành động giao lưu tự phát đã biến thành khu chợ trời và tiệc tùng linh đình. [pleased_planet.owner.Species.GetNamePlural] và [welcome_fleet.owner.Species.GetNamePlural] đã tạo nên nhiều mối quan hệ gắn kết và chốt được vô số kèo mua bán."
 cara.4040.a:0 "Hẹn ngày gặp lại!"
 cara.4050.name:0 "§HThương đoàn§!: Quân Ăn Cắp!"
 cara.4050.desc:0 "Gần đây, sau chuyến ghé thăm của [stealing_fleet.GetName] tới [stolen_from_planet.GetName], người ta phát hiện một phần tài nguyên đã bốc hơi một cách khó hiểu. Mọi nghi ngờ đều đổ dồn vào thói tắt mắt của [stealing_fleet.GetName]."
 cara.4050.a:0 "Bảo bối của ta!"
 cara.4041.name:0 "§HThương đoàn§!: Hậu Quả Tiệc Tùng"
 cara.4041.desc:0 "Sau vài tháng chung chạ với [party_host.GetNamePlural] trên [pleased_planet.GetName], có dấu hiệu cho thấy mối quan hệ giữa họ đã bền chặt hơn dự kiến. Họ muốn ở lại."
 cara.4041.phile:0 "Tuyệt vời làm sao!"
 cara.4041.phobe:0 "Thật kinh tởm!"
 cara.4041.a:0 "Sự sống, ồ, luôn tự tìm ra lối thoát."

 mega.9000.name:0 "$mega_art_installation_1$"
 mega.9000.desc:0 "Bước đầu tiên để kiến tạo $mega_art_installation_3$ là phải đối mặt với hai thách thức cùng lúc: Xây dựng một trạm không gian đủ lớn để chứa một khu phức hợp phòng triển lãm đan xen, và tổ chức một buổi triển lãm với quy mô chưa từng có. Khi cơ sở hạ tầng cơ bản đã sẵn sàng, việc xây hầm chứa sẽ là ưu tiên hàng đầu. Hầm chứa phải đủ an toàn và kiên cố, chuyên dùng để bảo vệ các kho tàng nghệ thuật trong hệ sao."
 mega.9001.name:0 "$mega_art_installation_2$"
 mega.9001.desc:0 "Giai đoạn hai của $mega_art_installation_3$ đã hoàn tất, công cuộc lấp đầy hầm chứa đã bắt đầu. Một hạm đội vận tải chuyên dụng sẽ liên tục chuyên chở các bảo vật của đế chế đến ngôi nhà mới của chúng. Đồng thời, khu nhà ở cho nhân viên cùng nhiều không gian triển lãm khác cũng đang trong quá trình xây cất."
 mega.9002.name:0 "$mega_art_installation_3$"
 mega.9002.desc:0 "Quần thể trạm không gian triển lãm hiện đã xây xong. Bất kỳ trạm nào trong số này cũng lớn hơn nhiều trạm không gian thông thường, đủ sức đón hàng triệu lượt khách mỗi ngày. Vạn sự đã sẵn sàng, chỉ chờ ngày mở cửa, các phòng trưng bày của chúng ta có thể phô diễn vô vàn tuyệt tác của [From.Owner.GetSpeciesName] và từ khắp các ngõ ngách trong hệ sao để gột rửa tâm hồn công chúng. Chuyến tàu chở lứa du khách đầu tiên đã cập bến."
 mega.9002.phile.desc:0 "Quần thể trạm không gian triển lãm hiện đã xây xong. Bất kỳ trạm nào trong số này cũng lớn hơn nhiều trạm không gian thông thường, đủ sức đón hàng triệu lượt khách mỗi ngày. Vạn sự đã sẵn sàng, chỉ chờ ngày mở cửa, buổi triển lãm của chúng ta sẽ trưng bày những tác phẩm nghệ thuật tinh hoa từ các quốc gia liên sao để tôn vinh sự đa dạng của các chủng loài. Chuyến tàu chở lứa du khách đầu tiên đã cập bến."
 mega.9002.phobe.desc:0 "Quần thể trạm không gian triển lãm hiện đã xây xong. Bất kỳ trạm nào trong số này cũng lớn hơn nhiều trạm không gian thông thường, đủ sức đón hàng triệu lượt khách mỗi ngày. Vạn sự đã sẵn sàng, chỉ chờ ngày mở cửa, buổi triển lãm của chúng ta sẽ phô diễn những kiệt tác nghệ thuật đích thực của [From.Owner.GetAdj]! Đồng thời sẽ bày thêm một ít nghệ thuật ngoại lai làm nền. Chuyến tàu chở lứa du khách đầu tiên đã cập bến."
 mega.9003.name:0 "Trung tâm Điều phối Chiến lược: Cấu trúc ngoài"
 mega.9003.desc:0 "Lớp vỏ bọc thép của Trung tâm Điều phối Chiến lược đã hoàn thiện. Hiện tại, giới tinh hoa chỉ huy quân đội của chúng ta đã tập trung bên trong lớp giáp kiên cố đó. Vì vừa an toàn vừa tập trung, họ có thể toàn tâm toàn ý lập kế hoạch phòng thủ tốt nhất cho quốc gia."
 mega.9003.mil.desc:0 "Lớp vỏ bọc thép của Trung tâm Điều phối Chiến lược đã hoàn thiện. Hiện tại, giới tinh hoa chỉ huy quân đội của chúng ta đã tập trung bên trong lớp giáp kiên cố đó. Vì vừa an toàn vừa tập trung, họ có thể toàn tâm toàn ý lập kế hoạch chinh phục biển sao một cách hiệu quả nhất."
 mega.9003.slave.desc:0 "Lớp vỏ bọc thép của Trung tâm Điều phối Chiến lược đã hoàn thiện. Hiện tại, giới tinh hoa chỉ huy quân đội của chúng ta đã tập trung bên trong lớp giáp kiên cố đó. Vì vừa an toàn vừa tập trung, họ có thể toàn tâm toàn ý lập kế hoạch bắt giữ nô lệ sao cho hiệu quả nhất."
 mega.9004.name:0 "Trung tâm Điều phối Chiến lược: Liên lạc"
 mega.9004.desc:0 "Một dàn ăng-ten liên lạc công suất cao đã được lắp đặt vào Trung tâm Điều phối Chiến lược, giúp tàu thuyền của chúng ta dù ở đâu cũng có thể nhận được các chỉ thị chiến lược. Những mảng liên lạc tiên tiến nhất này có khả năng vượt qua mọi nhiễu sóng, và tín hiệu rối lượng tử của nó hoàn toàn không thể bị giải mã."
 mega.9005.name:0 "Trung tâm Điều phối Chiến lược: Hoạt động Toàn diện"
 mega.9005.desc:0 "Phần bổ sung cuối cùng của Trung tâm Điều phối Chiến lược là một số pháo đài mô phỏng 'quân địch' tách biệt. Những pháo đài này gần giống như phiên bản thu nhỏ của Trung tâm, và hoạt động hoàn toàn độc lập. Các sĩ quan chỉ huy tinh nhuệ và cấp dưới của họ có thể đắm chìm trọn vẹn vào văn hóa và truyền thống của kẻ thù, học hỏi nghệ thuật của chúng để hiểu sâu và mô phỏng tư duy quân sự của chúng. Khi đã đắm chìm hoàn toàn, họ sẽ tiến hành các cuộc chiến ảo với nhân viên của Trung tâm, giúp chúng ta mô phỏng mọi xung đột tiềm tàng và học hỏi mọi chi tiết từ cả hai phía, từ đó nắm trong tay những chiến thuật vượt trội kẻ thù trong thực chiến."
 mega.9006.name:0 "Hội đồng Liên sao: Bệ đỡ"
 mega.9006.desc:0 "Đặc điểm nổi bật nhất trong giai đoạn đầu của Hội đồng Liên sao chính là §SBệ đỡ§!. Một hệ thống ảnh ảo hố đen phức tạp, được dùng để mô phỏng lại vực thẳm trọng lực ẩn nấp ở trung tâm thiên hà: điểm tựa xoay quanh của toàn bộ hệ sao.\n\nKhi hoàn thành, nơi đây cũng sẽ trở thành trung tâm của những sự kiện nhất định, nơi mà các hoạt động ngoại giao thầm lặng và trò chơi quyền lực mềm đủ sức xoay chuyển cả thiên hà sẽ xoay quanh nó."
 mega.9007.name:0 "Hội đồng Liên sao: Vòng Trụ sở"
 mega.9007.desc:0 "Giai đoạn hai của Hội đồng Liên sao, Vòng Trụ sở, hiện đã xây xong. Vòng trong này đủ sức chứa hầu hết các nhân viên ngoại giao của chúng ta hoạt động bên trong."
 mega.9008.name:0 "Hội đồng Liên sao: Mô-đun Hội trường"
 mega.9008.desc:1 "Vòng ngoài của Hội đồng Liên sao sẽ được trang bị hàng loạt phòng họp bảo mật quyền riêng tư tối tân (tất nhiên, chỉ [Root.GetAdj] mới có quyền giám sát). Trạm không gian này đang nhanh chóng trở thành trung tâm liên sao không thể bàn cãi cho các cuộc đàm phán từ xa."
 mega.9009.name:0 "Hội đồng Liên sao"
 mega.9009.desc:0 "Hội đồng Liên sao đã đi vào hoạt động hết công suất, hiện đang tiếp đón những nhân vật cộm cán từ nhiều thế lực lớn liên sao, bất kể họ thuộc giới chính trị hay thương trường.\n\nCác nhà ngoại giao của chúng ta đã khá vất vả khi phải theo dõi luồng thông tin về lợi ích quốc gia và những lời mỉa mai chính trị phát ra từ trạm không gian này. Nhưng ít nhất thì khách khứa cũng chẳng bận tâm đến việc bị chúng ta giám sát, miễn là chúng ta tiếp tục cung cấp cho họ một môi trường lý tưởng để so kè với các đối thủ."
 mega.9010.name:0 "Máy Giải nén Vật chất: Neo giữ"
 mega.9010.desc:0 "Để tiến hành khai thác [From.GetName], trước tiên chúng ta cần một bệ phóng an toàn để bắt đầu xây dựng các phần khác. Điểm neo giữ đã được xây xong ngay rìa chân trời sự kiện của hố đen, và được giữ chặt bằng một động cơ điều hướng trọng lực, dùng chính trọng lực do [From.GetName] tạo ra để đảo ngược lại nhằm chống chọi sức hút khổng lồ."
 mega.9011.name:0 "Máy Giải nén Vật chất: Thấu kính"
 mega.9011.desc:0 "Được xây dựng trên hệ thống điều hướng trọng lực có sẵn, hệ thống thấu kính trọng lực có thể khiến một phần lực xuyên qua 'thấu kính', tập trung lực dày đặc hơn vào một khu vực đã chọn."
 mega.9012.name:0 "Máy Giải nén Vật chất: Khoan thăm dò"
 mega.9012.desc:0 "Chìa khóa để hút vật chất từ hố đen nằm ở hệ thống điều hướng trọng lực tinh xảo tột bậc: tập trung tạo ra một vùng trọng lực bị bẻ cong, sau đó chế tạo một mũi khoan chuyển hướng cỡ lớn chuyên dụng để đối phó với tình trạng trọng lực này."
 mega.9013.name:1 "Máy Giải nén Vật chất: Chiết xuất"
 mega.9013.desc:0 "Bước cuối cùng của Máy Giải nén Vật chất nghe có vẻ khô khan, nhưng cũng chứa đựng mặt chấn động nhất của nó. Hàng loạt lò luyện và máy xử lý tự động bắt đầu phân giải các vật chất hút từ [From.GetName], giải nén và tách chúng thành những khoáng chất hữu dụng, sau đó chuyển lên các hạm đội sà lan cơ khí nối đuôi nhau không ngớt, rải đi khắp các nơi trong đế quốc."
 cara.4110.name:0 "Nhà Sưu tập"
 cara.4110.desc:0 "Xin chào. Tôi là một nhà sưu tập, đến đây mang cho bạn một cơ hội ngàn năm có một. Tôi có một cái hộp cần bán, tôi sẽ không tiết lộ cũng không cho bạn xem bên trong có gì. Bạn có thể mua nó bằng 3000 £energy£ Năng lượng, sau đó bên trong có gì thì đều thuộc về bạn, nhưng đã mua rồi thì miễn đổi trả."
 cara.4110.a:0 "Không cho biết bên trong có gì mà đòi chúng tôi trả tiền à?"
 cara.4110.a.response:0 "Tôi sẵn lòng."
 cara.4110.b:0 "Tuyệt."
 cara.4110.b.response:0 "Tuyệt vời!"
 cara.4110.c:0 "Không!"
 cara.4110.c.response:0 "Bạn sẽ hối hận đấy!"
 cara.4110.d:0 "Anh là ai?"
 cara.4110.d.response:0 "Tôi là nhà sưu tập. Tôi thường ủy thác cho các hạm đội Thương đoàn thu thập di vật khắp hệ sao. Bạn chỉ cần biết thế là đủ."
 cara.4120.name:0 "Nô lệ Máy xèng"
 cara.4120.desc:0 "Việc thường xuyên lui tới La Bàn của Chor đã khiến rất nhiều người ở [cara_border_planet.GetName] bắt đầu nghiện cờ bạc. Rất nhiều người đã dấn thân vào con đường phạm tội để có tiền chơi tiếp."
 cara.4120.a:0 "Tin tức đáng lo ngại."
 cara.4130.name:0 "Cuồng hoan"
 cara.4130.desc:0 "Lượng lớn du khách [caravaneer_neighbor_species.GetName] từ [caravaneer_neighbor.GetName] đổ về đã biến [cara_border_planet.GetName] thành một bữa tiệc khổng lồ. Tuy nhiên 'bữa tiệc' vui vẻ lại xảy ra sự cố, giờ đây nó đã biến thành một cuộc bạo loạn quy mô toàn cầu."
 cara.4130.a:0 "Không thể chấp nhận được!"
 cara.4140.name:0 "Máy xèng mới!"
 cara.4140.desc:0 "[caravaneer_neighbor.GetName] gần đây đã phát hành một loại máy xèng hoàn toàn mới, điều này cũng giúp [cara_border_planet.GetName] đón nhận một bước nhảy vọt về kinh tế nhờ sự hỗ trợ của lượng khách du lịch."
 cara.4150.name:0 "Thích ứng"
 cara.4150.desc:0 "La Bàn của Chor là một nơi chuyên tìm kiếm sự kích thích. Vì thường xuyên lui tới, sự điềm tĩnh của người dân [cara_border_planet.GetName] trước mọi việc xung quanh đã đạt đến một mức độ chưa từng có."
 cara.4160.name:1 "Buổi biểu diễn của Ban nhạc Megacorpse: Triệu Thây ma!"
 cara.4160.desc:0 "[cara_border_planet.GetName] đã rơi vào tình trạng hỗn loạn sau khi buổi hòa nhạc của ban nhạc metal tâm linh Megacorpse mất kiểm soát. Mức độ tàn phá rộng đến mức người ta chỉ có thể chắp vá lại đôi chút tình hình lúc đó. Nhưng có một điều chắc chắn là, vào lúc cao trào của buổi biểu diễn, Kor-Azan đã đục một lỗ trên mặt trăng, phá hủy nó hoàn toàn."
 cara.4160.nomoon.desc:0 "[cara_border_planet.GetName] đã rơi vào tình trạng hỗn loạn sau khi buổi hòa nhạc của ban nhạc metal tâm linh Megacorpse mất kiểm soát. Mức độ tàn phá rộng đến mức người ta chỉ có thể chắp vá lại đôi chút tình hình lúc đó. Nhưng có một điều chắc chắn là, vào lúc cao trào của buổi biểu diễn, Kor-Azan đã đập mạnh siêu cây đàn guitar của hắn xuống đất, khiến toàn bộ khu vực bị tàn phá hoàn toàn."
 cara.4160.a:1 "Thật rùng rợn."
 cara.4161.name:0 "Megacorpse: Nguồn gốc"
 cara.4161.desc:1 "Megacorpse là ban nhạc metal tâm linh vĩ đại nhất trong số các tập đoàn. Tương truyền rằng các thành viên ban nhạc mang hình hài kỳ dị - Kor-Azan, Ganquan, Human, Yondar và Szekedari - giao tiếp với nhau thông qua Hư Cảnh.\n\nĐó là sự thật.\n\nChỉ một số ít người biết, Hư Cảnh là mật danh của một bộ phận nghiên cứu âm nhạc siêu âm tối mật thuộc Tiếng Nói Ngân Hà. Tiếng Nói Ngân Hà là người dẫn đầu xu hướng âm nhạc trong đa vũ trụ, đồng thời cũng là nhà sản xuất vũ khí siêu âm. Ban nhạc Megacorpse được thành lập ban đầu như một lực lượng đột kích tâm linh. Họ sẽ 'biểu diễn' tại những 'địa điểm' hóc búa, thông qua việc lồng ghép các kỹ thuật ức chế tấn công tâm linh vi tế vào dưới những ca từ lăng mạ tập đoàn trắng trợn để tác động đến thính giả, phá hoại ngầm các phong trào nổi loạn một cách cực kỳ hiệu quả.\n\nCuối cùng, tác dụng xúc tác của âm nhạc đối với sức mạnh tâm linh vốn đã vô cùng mạnh mẽ của các thành viên ban nhạc đã vượt quá sức tưởng tượng, khiến các nhà quản lý không thể nào kiểm soát nổi. Các thành viên đường ai nấy đi, chỉ để lại cái vỏ bọc tên ban nhạc - bởi Tiếng Nói Ngân Hà không muốn xé bỏ một hợp đồng đang đẻ trứng vàng. Ngày nay, Megacorpse đi đến đâu đàn đến đó, miễn là họ thấy thích, và miễn đó là nhạc §Rmetal§!."
 cara.4111.desc:0 "Tận hưởng đi!"
 mega.9100.name:0 "Máy Giải nén Vật chất bị hỏng"
 mega.9100.a.desc:0 "Một điều lạ lùng là chúng ta phát hiện một thiết bị khai thác mỏ tồn tại ngay trên đường chân trời sự kiện tại hệ sao [matter_decompressor_system.GetName]. Các nhà khoa học của chúng ta cho rằng đây có thể là một '§HMáy Giải nén Vật chất§!' - một cấu trúc khổng lồ dùng để khai thác khoáng sản từ lỗ đen. Dù đã ngừng hoạt động, một số thiết bị ngăn chặn nó bị lực hấp dẫn kéo dãn ra như mì ống chắc hẳn vẫn đang hoạt động."
 mega.9100.b.desc:1 "Nằm trên chân trời sự kiện của hệ sao [matter_decompressor_system.GetName] là một '§HMáy Giải nén Vật chất§!' - một cấu trúc khổng lồ lấy khoáng sản từ lỗ đen. Ngay cả khi đã hỏng hóc, động cơ điều hướng trọng lực của nó chắc chắn vẫn đang chạy, nếu không nó đã sớm bị lực hấp dẫn của lỗ đen xé xác thành mì ống rồi."
 mega.9100.a:0 "Trông có vẻ giống đồ của chúng ta."
 mega.9101.name:0 "Máy Giải nén Vật chất đã sửa"
 mega.9110.name:0 "Trung tâm Điều phối Chiến lược bị hỏng"
 mega.9110.a.desc:0 "Chúng ta phát hiện một trạm không gian khổng lồ bị tàn phá ở [strategic_coordination_center_system.GetName]. Đống mảnh vỡ vụn nát của nó chứa một lượng lớn máy tính chiến đấu, máy giả lập và dàn ăng-ten liên lạc, vì vậy các nhà khoa học của chúng ta tin rằng đây chắc chắn là một dạng '§HTrung tâm Điều phối Chiến lược§!'."
 mega.9110.b.desc:0 "Chúng ta phát hiện một trạm không gian khổng lồ bị tàn phá ở [strategic_coordination_center_system.GetName]. Nó có vẻ là tàn tích của một '§HTrung tâm Điều phối Chiến lược§!'."
 mega.9110.a:0 "Của chúng ta sẽ không bao giờ bị phá hủy!"
 mega.9111.name:0 "Trung tâm Điều phối Chiến lược đã sửa"
 mega.9111.desc:0 "Trung tâm Điều phối Chiến lược bị bỏ hoang tại [From.GetName] đã được tu sửa hoàn toàn, và hiện được tiếp quản bởi những quân nhân tài năng nhất của [Root.GetName]. Cấu trúc khổng lồ này sẽ khôi phục lại công năng vốn có, chỉ huy toàn bộ lực lượng quân sự của chúng ta trong hệ sao."
 mega.9120.name:0 "Công trình Nghệ thuật Khổng lồ bị hỏng"
 mega.9120.a.desc:0 "Chúng ta phát hiện ba trạm không gian bị hỏng trong [mega_art_installation_system.GetName]. Chúng được bao quanh bởi một đám mây mảnh vỡ, một số trong đó vẫn có thể nhận ra là các tác phẩm nghệ thuật, dù mang đậm phong cách ngoại lai - có vẻ như nơi đây từng là một '§HCông trình Nghệ thuật Khổng lồ§!'."
 mega.9120.b.desc:0 "Chúng ta phát hiện một '§HCông trình Nghệ thuật Khổng lồ§!' bị phá hủy ở [mega_art_installation_system.GetName]. Các hiện vật trưng bày bên trong đã bị bào mòn bởi thời gian và chân không."
 mega.9120.a:0 "Thật thiếu tính sáng tạo."
 mega.9121.name:0 "Công trình Nghệ thuật Khổng lồ đã sửa"
 mega.9121.desc:0 "Công trình Nghệ thuật Khổng lồ bị hỏng tại [From.GetName] đã được tu sửa xong. Ngoài những tác phẩm nghệ thuật vĩ đại nhất của [Root.GetName], nơi này còn trưng bày một phần nhỏ các tác phẩm nghệ thuật ngoại lai được thu hồi và phục chế từ cấu trúc khổng lồ ban đầu."
 mega.9130.name:0 "Hội đồng Liên sao bị hỏng"
 mega.9130.a.desc:0 "Chúng ta phát hiện một trạm không gian khổng lồ bị hỏng tại [interstellar_assembly_system.GetName]. Dựa vào số lượng văn phòng làm việc khổng lồ và một diễn đàn trang bị vô vàn thiết bị duy trì sự sống dành cho các chủng loài khác nhau, các nhà khoa học của chúng ta cho rằng đây là tàn tích của một '§HHội đồng Liên sao§!'."
 mega.9130.b.desc:0 "Chúng ta phát hiện tàn tích của một '§HHội đồng Liên sao§!' ở [interstellar_assembly_system.GetName], và đã phân biệt được xác ướp khô của hàng chục chủng loài khác nhau."
 mega.9130.a:0 "Cùng nhau bước đến điểm cuối."
 mega.9131.name:0 "Hội đồng Liên sao đã sửa"
 mega.9131.desc:0 "Hội đồng Liên sao tại [From.GetName] đã đi vào hoạt động trở lại. Nơi đây đã sẵn sàng chào đón các nhà ngoại giao khắp hệ sao tụ họp, cùng nhau thảo luận về các vấn đề trong chu kỳ mặt trời hiện tại."
 colony.3040.name:0 "Nhòm ngó Hư không"
 colony.3040.desc:0 "Sau nhiều năm nghiên cứu, một số nhà nghiên cứu trên [Root.GetName] cảm thấy họ đã bắt đầu hiểu được Thái Hư. Có một vài... gợn sóng. Sức mạnh. Một luồng sóng nhẹ nhàng luồn qua cổng không gian hướng tới [From.GetName], mang theo lượng nhỏ Vật chất Tối mà chúng ta có thể thu thập được. Về lý thuyết, chúng ta có thể làm cho cổng không gian của mình trở nên 'dễ thấy' hơn trước luồng sóng này, qua đó tạo ra nhiều Vật chất Tối hơn."
 colony.3041.name:0 "Tiếng gọi Hư không"
 colony.3041.desc:0 "Một thiết bị khuếch đại tín hiệu khổng lồ đã bắn một luồng năng lượng vào cổng không gian trên [Root.GetName]. Tác dụng đến ngay lập tức, áp lực ở phía bên kia cổng tăng lên rõ rệt, và tuôn ra nhiều dòng Vật chất Tối hơn."
 portal_void_tooltip2:0 "$job_dimensional_portal_researcher_plural$ sẽ sản xuất thêm Vật chất Tối £sr_dark_matter£"
 colony.3009.a.robot:0 "**Truy cập Tín hiệu**"
 colony.3020.desc.robot:0 "Đây là [Root.Owner.Leader.GetName] của [Root.Owner.GetName]. Khai báo danh tính của bạn!"
 colony.3020.a.robot:0 "Lỗi xác minh: Danh tính không hợp lệ! Đây là [Root.Owner.Leader.GetName]! Khai báo danh tính của bạn!"
 colony.3021.desc.robot:0 "**§YĐang xử lý!§!** Kết quả: Cổng không gian này kết nối với một kẽ nứt giữa các chiều không gian. Tất cả chúng ta đều là [Root.Owner.Leader.GetName], nhưng đến từ các chiều không gian khác nhau."
 colony.3021.a.robot:0 "Một biến số chưa được tính toán. Báo cáo tình hình của [Root.Owner.Species.GetNamePlural] bên đó đi!"
 colony.3021.b.robot:0 "Khởi động giao thương."
 mirror_trade_reply.robot:0 "Đã rõ."
 colony.3022.desc.robot:0 "Sau khi phát minh ra Động cơ Bẻ cong (Warp), [Root.Owner.Species.GetName] từ [Root.Owner.Capital.GetName] đã bắt đầu vươn ra biển sao..."
 colony.3022.a.robot:0 "Lỗi! Giá trị bất ngờ: Động cơ Bẻ cong. Giá trị mong đợi: Kênh Siêu không gian."
 colony.3023.desc.robot:0 "**§YĐang xử lý!§!** Kết quả: Việc khám phá ra các phương thức du hành siêu quang tốc khác nhau là điểm rẽ nhánh giữa các vũ trụ của chúng ta. Truy vấn: Bị Quái vật Không gian (Warp Beast) tấn công?"
 colony.3023.a.robot:0 "Không tìm thấy giá trị: Quái vật Không gian. Truy vấn: Mức độ đe dọa của Quái vật Không gian?"
 colony.3024.desc.robot:0 "Quái vật Không gian tấn công mọi nền văn minh đã biết, chúng là mối đe dọa với mọi sự tồn tại. Giả thuyết: Một khi hoạt động du hành không gian đạt đến ngưỡng nào đó trong thiên hà, Quái vật Không gian sẽ thức tỉnh và tấn công. Một vài chủng loài đã diệt vong, nhưng hiện tại chúng tôi vẫn đang gắng gượng."
 colony.3024.a.robot:0 "Truy vấn: Bạn có cần hỗ trợ vật chất không?"
 mirror_trade_reply2.robot:0 "Thiết lập giao thương liên không gian để củng cố sức mạnh cho [Root.Owner.Species.GetNamePlural] ở cả hai phía."
 colony.3032.a.robot:0 "[Root.Owner.Species.GetName] cuối cùng sẽ chiến thắng!"
 colony.3033.desc.robot:0 "Cập nhật trạng thái: [Root.Owner.Capital.GetName] đã ngắt kết nối. Năng lực chiến đấu của [Root.Owner.GetName]: 23% so với kỳ vọng. Mạng lưới thuộc địa còn sót lại: [Root.GetName]. Kết quả dự kiến: Quái vật Không gian sẽ giành chiến thắng tuyệt đối trong vòng 2 chu kỳ mặt trời. Lỗi! Phát hiện hoạt động của Quái vật Không gian trong quỹ đạo [Root.GetName]! Lỗi!\n\n**§YTín hiệu đột ngột bị đứt§!**"
 colony.3033.a.robot:0 "Báo cáo."
 colony.3033.d.robot:0 "[Root.Owner.Species.GetName] ở vũ trụ song song đã ngắt kết nối."

 dportal_trade_increases_tooltip:0 "Sản lượng £amenities£ và £trade_value£ do §Y$job_dimensional_portal_researcher_plural$§! tạo ra sẽ tăng lên."
