 ## Edicts ##

 edict_nuumismatic_visualization:1 "Kỹ thuật mường tượng Numistic"
 edict_nuumismatic_visualization_desc:1 "Ứng dụng kỹ thuật mường tượng của giáo phái Numistic giúp cư dân gạt bỏ những tư lợi nhỏ nhen để hướng tới mục tiêu tạo ra năng lượng rộng lớn hơn. Muốn đạt được ước mơ, trước tiên phải tưởng tượng ra nó."
 edict_terraforming_gas:0 "Khí địa khai hóa"
 edict_terraforming_gas_desc:0 "Bơm thêm khí ngoại lai vào quy trình địa khai hóa giúp đẩy nhanh đáng kể tiến độ."
 edict_clearing_motes:0 "Dọn dẹp bằng hạt dễ nổ"
 edict_clearing_motes_desc:0 "Tận dụng đặc tính nổ của hạt dễ nổ, ta có thể tăng tốc độ dọn dẹp các địa hình phức tạp."
 edict_clearing_motes_nomad: "Phục Hồi Lưới Bộc Phá"
 edict_clearing_motes_nomad_desc: "Bằng cách tận dụng đặc tính gây nổ của các hạt bộc phát, chúng ta có thể dọn sạch chướng ngại vật hàng loạt."
 edict_crystalline_sensors:0 "Cảm biến pha lê"
 edict_crystalline_sensors_desc:0 "Sử dụng pha lê hiếm để cường hóa cảm biến, cho phép quan sát môi trường xung quanh rõ nét hơn."
 edict_living_metal_construction:0 "Siêu kiến trúc bằng Kim loại Sống"
 edict_living_metal_construction_desc:0 "Đặc tính sẵn có của kim loại sống cực kỳ phù hợp để cải tiến các siêu kiến trúc."
 edict_fuel_gases:0 "Nhiên liệu khí ngoại lai"
 edict_fuel_gases_desc:0 "Nhiều loại khí ngoại lai là nguồn nhiên liệu xuất sắc cho di chuyển dưới vận tốc ánh sáng, dù chưa hẳn là lựa chọn tiết kiệm nhất."
 edict_shield_gases:0 "Cường hóa khiên bằng khí ngoại lai"
 edict_shield_gases_desc:0 "Một số khí ngoại lai có thể dùng để gia cường khiên tàu. Chúng tạo ra các trường lực đệm phức tạp để cản và làm suy yếu đòn tấn công của địch."
 edict_motes_kinetic:0 "Đạn dược nổ cao"
 edict_motes_kinetic_desc:0 "Ta có thể dùng hạt dễ nổ làm thuốc nổ trong đạn dược của tàu chiến."
 edict_motes_explosives:0 "Vật liệu nổ mạnh"
 edict_motes_explosives_desc:0 "Bằng cách chế tạo tên lửa đặc biệt từ hạt dễ nổ, tàu chiến sẽ có sức công phá mạnh mẽ hơn."
 edict_motes_armor:0 "Giáp phản ứng nổ"
 edict_motes_armor_desc:0 "Lắp đặt thêm các thành phần phản ứng vào vỏ giáp, tàu chiến có thể dùng các vụ nổ ngược có kiểm soát để giảm bớt sát thương phải nhận."
 edict_crystal_focus:0 "Tinh thể hội tụ"
 edict_crystal_focus_desc:0 "Tăng tỷ lệ dùng pha lê hiếm trên tàu để khuếch đại sát thương cho vũ khí năng lượng."
 edict_nanite_actuators:0 "Bộ truyền động Nanite"
 edict_nanite_actuators_desc:0 "$sr_distar_nanoactuator_desc$"
 edict_sight_beyond_sight:0 "Tầm nhìn vượt giới hạn"
 edict_sight_beyond_sight_desc:0 "Một lượng nhỏ Zro giúp hoa tiêu của ta cảm nhận được các vật thể ngay cả khi chúng chưa lọt vào tầm quét."
 edict_zro_catalysis_utopia:0 "Xúc tác Zro"
 edict_zro_catalysis_utopia_desc:0 "Một trong vô vàn đặc tính bí ẩn của Zro là khi hít vào sẽ gia tăng đáng kể sức mạnh của các nhà ngoại cảm."
 edict_zro_catalysis_non_utopia:0 "$edict_zro_catalysis_utopia$"
 edict_zro_catalysis_non_utopia_desc:0 "Các nhà nghiên cứu đã tìm ra cách tổng hợp Zro thành một hợp chất dạng hít, giúp tăng cường khả năng mà không gây ra tác dụng phụ."

