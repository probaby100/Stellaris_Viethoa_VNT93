 mega.1000.name:0 "$matter_decompressor_1$"
 mega.1000.desc:0 "Cùng với tiếng cọt kẹt, những cánh tay ngang dài như ảo ảnh của $matter_decompressor_1$ bắt đầu chầm chậm chuyển động.\n\nSự rung lắc của trạm không gian tưởng chừng sắp sụp đổ đã dần dừng lại, trong khi những luồng năng lượng và vật chất hạt liên tục bắn ra từ cái bóng của chân trời sự kiện tại [From.GetName]."
 mega.1000.a.mater:0 "Vì khoa học."

 mega.1100.name:0 "$strategic_coordination_center_1$"
 mega.1100.desc:0 "$strategic_coordination_center_1$ đứng đó đầy uy nghi.\n\nCác kỹ sư quân sự nhận ra rằng việc ngụy trang một trạm không gian cỡ này là chuyện không tưởng, thế nên họ chẳng buồn phí thời gian vào việc đó, cứ để mọi thứ phơi bày rõ ràng: Nơi đây được trang bị các thiết bị liên lạc tiên tiến nhất, dàn cảm biến tối tân, cùng một đội ngũ chuyên gia chiến lược và hậu cần kiệt xuất."
 mega.1100.a.tooltip:0 "§H$strategic_coordination_center_1$§! tăng §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!, §Y$mod_shipclass_starbase_damage_mult$§!, §Y$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_ADD$§!, §Y$mod_shipsize_corvette_build_speed_mult$§!, §Y$mod_shipsize_destroyer_build_speed_mult$§!, §Y$mod_shipsize_cruiser_build_speed_mult$§!, và §Y$mod_shipsize_battleship_build_speed_mult$§!."

