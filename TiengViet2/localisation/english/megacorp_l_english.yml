 war_goal_wg_steal_galatron_desc:0 "Nắm giữ Ngôi sao Ngân hà là mục tiêu tối thượng trên con đường quật khởi của chúng ta. Trừ khi Ngôi sao Ngân hà được giải thoát khỏi mớ phụ kiện rẻ tiền kia và ban phước lành trường tồn cho quốc gia chúng ta, nếu không chúng ta sẽ không bao giờ lùi bước."

