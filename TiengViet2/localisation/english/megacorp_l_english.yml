 CORP_DEMAND_SUBS_REFUSE_01:0 "[Root.GetName] cho rằng các điều khoản của ngài là không thể chấp nhận được, và dù trong bất cứ hoàn cảnh nào cũng sẽ không chịu làm miếng mồi ngon cho [From.GetSpeciesAdj] bóc lột."
 CORP_ASK_FOR_SUBS_SELECT_01:1 "Nếu chúng ta tiến hành, [From.GetName] sẽ trở thành chư hầu của [Root.GetName]. Với tư cách là công ty mẹ, [Root.GetName] sẽ đồng cam cộng khổ cùng [Root.GetSpeciesNamePlural] để đương đầu với các mối đe dọa chung."
 CORP_ASK_FOR_SUBS_PROPOSE_01:0 "Là một tập thể đồng lòng, [Root.GetRulerName] rất muốn học hỏi từ [From.GetSpeciesAdj]. Hãy để [From.GetName] trở thành công ty con, và chúng tôi sẽ cắt cho các người một phần lợi nhuận từ thương mại của chúng tôi."
