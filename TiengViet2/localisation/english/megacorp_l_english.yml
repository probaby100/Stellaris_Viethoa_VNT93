 building_factory_2_effect_desc:2 "Tăng §G1§! sản lượng cơ bản của các việc làm sản xuất £consumer_goods£§YHàng Tiêu dùng§!, đồng thời kéo theo chi phí duy trì tăng lên tương ứng."
