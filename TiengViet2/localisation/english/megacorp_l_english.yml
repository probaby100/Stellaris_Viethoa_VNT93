 job_primitive_hive_miner_desc:0 "Vì đại cục, đám cá thể này sẵn sàng quẳng mạng sống ra sau đầu để luồn sâu xuống lòng đất, vơ vét của nả hòng đút no cái cỗ máy xã hội đang ngày một tham lam này."
 mod_job_primitive_hive_miner_add:0 "Việc làm $job_primitive_hive_miner$"

