 cara_home_main.title:1 "$NAME_Caravaneer_Home$"
 cara_home_direct1:1 "$NAME_Caravaneer_Home$ hoan nghênh bạn đến với $NAME_Chors_Compass$, cội nguồn của giới thương nhân liên sao. Bạn không nghe nhầm đâu."
 cara_home_direct2:1 "Chào mừng đến với $NAME_Tradestation_Tungle$, tụ điểm giải trí đỉnh cao nhất toàn vũ trụ, và cũng là bến đỗ của hạm đội Thương đoàn!"
 cara_home_direct3:1 "Theo hồ sơ tâm lý, những sinh vật có sức đề kháng kém với các hoạt động gây nghiện thường không nên tham gia $slots$ và $lootboxes$.\n\nNhưng nếu họ đã không thích tận hưởng đến thế, thì đành chịu vậy!"
 cara_home_direct4:0 "Các bạn có phải là giống loài thích trò đỏ đen không?"
 cara_home_direct5:0 "Chỗ chúng tôi kiếm được nhiều thì thắng lớn, dĩ nhiên nếu bạn không thuộc kiểu người thích được ăn cả ngã về không, chúng tôi cũng có những gói cược nhỏ lẻ."
 cara_home_redirect1:1 "Chúng tôi là $NAME_Caravaneer_Fleet1$ thuộc $NAME_Caravaneer_Home$ tại $NAME_Chors_Compass$. Chúng tôi sẽ không chịu trách nhiệm cho bất kỳ tương tác nào trước đây giữa phía bạn và hạm đội của chúng tôi."
 cara_home_redirect2:1 "Chúng tôi là $NAME_Caravaneer_Fleet2$ thuộc $NAME_Caravaneer_Home$ tại $NAME_Chors_Compass$. Chúng tôi sẽ không chịu trách nhiệm cho bất kỳ tương tác nào trước đây giữa phía bạn và hạm đội của chúng tôi."
 cara_home_redirect3:1 "Chúng tôi là $NAME_Caravaneer_Fleet3$ thuộc $NAME_Caravaneer_Home$ tại $NAME_Chors_Compass$. Chúng tôi sẽ không chịu trách nhiệm cho bất kỳ tương tác nào trước đây giữa phía bạn và hạm đội của chúng tôi."
 cara_home_menureturn1:1 "$cara_home_direct3$"
 cara_home_menureturn2:1 "$cara_home_direct4$"
 cara_home_menureturn3:1 "$cara_home_direct5$"
 cara_home_about_fleet1:0 "Chúng tôi đang muốn liên lạc với §H$NAME_Caravaneer_Fleet1_country$§!..."
 cara_home_about_fleet1.reply:1 "Tất cả các hạm đội Thương đoàn liên quan đều duy trì một truyền thống có từ trước khi phát minh ra mạng lưới liên lạc không gian con. Nhưng $NAME_Tradestation_Tungle$ chúng tôi là một ngoại lệ, nên mọi cuộc gọi đều được chuyển hướng về đây.\n\nE là bạn phải đợi cho đến khi [From.GetName] quay lại lãnh thổ của bạn và chủ động gọi cho bạn. Hoặc là lúc rời khỏi lãnh thổ của bạn, tùy thuộc vào thỏa thuận giữa hai bên.\n\nTrong lúc chờ đợi, sao không thử vài ván $slots$ nhỉ?"
 cara_home_about_fleet2:0 "Chúng tôi đang muốn liên lạc với §H$NAME_Caravaneer_Fleet2$§!..."
 cara_home_about_fleet2.reply:0 "$cara_home_about_fleet1.reply$"
 cara_home_about_fleet3:0 "Chúng tôi đang muốn liên lạc với §H$NAME_Caravaneer_Fleet3_species_plural$§!..."
 cara_home_about_fleet3.reply:0 "Họ dễ thương quá đúng không? Mà lại còn rất dũng mãnh nữa chứ! Khụ khụ.\n\n$cara_home_about_fleet1.reply$"

 cara_caravancoinz.title:1 "Đồng Thương nhân"
 ccoinz1desc:0 "$ccoinz$ là một loại tiền tệ cao cấp do Hội đồng Tiền tệ Thương đoàn phát hành."
 ccoinswhat:0 "$ccoinz$ là gì?"
 ccoinzwhat.reply:0 "Hội đồng Tiền tệ Thương đoàn đảm bảo hệ thống quy đổi với $NAME_Tradestation_Tungle$, bao gồm nhưng không giới hạn ở $slots$ và $lootboxes$.\n\nNhưng phần lớn thì nó dùng cho $slots$ và $lootboxes$.\n\n$slots$ chỉ nhận $ccoinz$, và chỉ có thể đổi ra $lootboxes$."
