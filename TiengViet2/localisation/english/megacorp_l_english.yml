 CORP_ASK_JOIN_A_REFUSE_01:1 "Chúng tôi đã dùng biểu đồ G-WACK để đánh giá tình hình kinh tế của các người. Rất tiếc phải thông báo rằng yêu cầu gia nhập §Y[Root.GetAllianceName]§! hiện chưa được duyệt. Chúc may mắn lần sau."
 CORP_ASK_JOIN_A_REFUSE_02:0 "Chúng tôi đã nhận được đơn của các người, nói thật thì, [Root.GetSpeciesNamePlural] và [From.GetSpeciesNamePlural] quả thật chẳng cùng đẳng cấp chút nào. Có hiểu ý tôi nói không?"
