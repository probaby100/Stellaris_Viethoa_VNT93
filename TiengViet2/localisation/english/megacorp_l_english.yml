 slots1:2 "Mục tiêu của trò chơi nhỏ này là xếp các hình trên trục quay thành một hàng khi nó dừng lại.\n\nKhông, bạn không thể điều khiển thời điểm chúng dừng lại. Nghĩ đến thôi đã thấy kích thích và muốn chơi ngay chưa?"
 slots2:1 "Về mặt lý thuyết, tỷ lệ trúng mánh lớn của bạn rất cao!"
 slots3:1 "Các trục quay này được làm từ tủy xương của đàn thú Gatu cuối cùng sống trên trạm không gian này. Lũ sâu bọ đó cũng khó nhằn phết đấy."

