 col_ecu_industrial: "Thành Phố Hành Tinh Công Nghiệp"
 col_ecu_industrial_desc: "$col_industrial_desc$"
 col_ecu_industrial_tt: "Một quần thể đô thị hành tinh quy mô khổng lồ, đồng thời sản xuất cả hợp kim và hàng tiêu dùng."
 col_ecu_foundry: "Thành Phố Hành Tinh Xưởng Đúc"
