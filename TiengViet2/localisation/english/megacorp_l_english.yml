 job_primitive_hive_spawning_drone_desc:0 "Giao nhiệm vụ duy trì nòi giống cho từng cá nhân là một nước cờ cực kỳ kém hiệu quả. Thay vào đó, những cá thể này được sinh ra chỉ để xì ra bất cứ khuôn mẫu nào mà Quần thể đang cần."
