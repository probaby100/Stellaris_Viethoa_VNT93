 wg_expel_corp_subject_effects:2 "Tất cả Chi Nhánh Văn Phòng thuộc quyền sở hữu của §Y[From.GetName]§! trong §Y[Root.GetName]§! (và đồng minh cùng chư hầu của họ) đều bị đóng cửa.\n§Y[Root.GetName]§! (và đồng minh cùng chư hầu của họ) nhận được §Y$trade_with_icon$§! §G1000§! cho mỗi Chi Nhánh Văn Phòng bị đóng cửa."

