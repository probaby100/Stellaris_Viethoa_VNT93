 CORP_DEMAND_SUBS_PROPOSE_01:0 "Hàng phòng ngự mỏng manh của ngài sẽ tạo cơ hội cho kẻ thù dòm ngó. Trở thành một phần của [From.GetName] đi, với tư cách là công ty mẹ, chúng tôi sẽ đứng ra bảo vệ sự tự do cho người dân của ngài."
 CORP_DEMAND_SUBS_PROPOSE_02:0 "[Root.GetSpeciesNamePlural], chúng tôi có một gói ưu đãi đặc biệt dành cho các người. Hãy trở thành công ty con của [From.GetName] và tham gia chương trình 10 bước tự phát triển của chúng tôi. Hãy để hạm đội của chúng tôi bơm thêm sự tự tin cho các người."
