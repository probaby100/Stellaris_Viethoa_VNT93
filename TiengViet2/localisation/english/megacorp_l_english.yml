 CORP_SUPPORT_INDEPENDENCE_PROPOSE_01:0 "Tương lai của khách hàng cũng chính là lợi ích của [From.GetName], chúng tôi sẽ ủng hộ nền độc lập của các người."
 CORP_SUPPORT_INDEPENDENCE_ACCEPT_01:0 "[Root.GetName] chúng tôi xin cảm tạ sự ủng hộ của ngài dành cho nền độc lập của [Root.GetAdj]."
 CORP_REVOKE_INDEPENDENCE_SELECT_01:0 "Ngài có chắc muốn rút lại sự ủng hộ dành cho nền độc lập của [Root.GetAdj] không?"
 CORP_REVOKE_INDEPENDENCE_PROPOSE_01:0 "Đáng buồn thay, chúng tôi buộc phải rút lại sự ủng hộ dành cho nền độc lập của [Root.GetAdj]. Chân thành chúc ngài vạn sự hanh thông trong những dự án sắp tới."
 CORP_REVOKE_INDEPENDENCE_ACCEPT_01:0 "Thật đáng tiếc, [From.GetAllianceName]."
 CORP_FORM_MIGRATION_PACT_SELECT_01:1 "[Root.GetSpeciesAdj] đang rất khát chất xám kinh doanh, [From.GetSpeciesNamePlural] có thể mang lại lợi lộc gì cho [Root.GetName]?"
 CORP_FORM_MIGRATION_PACT_PROPOSE_01:0 "[Root.GetSpeciesNamePlural]! Chúng tôi mời các người tham gia chương trình trao đổi nhân tài. Theo nghiên cứu của chúng tôi, việc cho phép người dân tự do di cư giữa các hành tinh sẽ thúc đẩy tăng trưởng kinh tế cực tốt."
 CORP_FORM_MIGRATION_PACT_ACCEPT_01:0 "Dự báo của chúng tôi cho thấy, để tư bản nhân lực lưu thông tự do giữa các hành tinh là chìa khóa để phát triển kinh tế. Hãy để dòng chảy nhân tài bắt đầu nào!"
 CORP_FORM_MIGRATION_PACT_REFUSE_01:0 "Bộ phận tuyển dụng của chúng tôi hiện đang tạm ngừng nhận hồ sơ."
 CORP_FORM_MIGRATION_PACT_REFUSE_02:0 "Chúng tôi sẽ không để công nhân của mình làm sai cương vị kinh tế đâu."
 CORP_BREAK_MIGRATION_PACT_SELECT_01:0 "Vui lòng xác nhận yêu cầu ngừng chương trình trao đổi nhân tài [Root.GetAdj]-[From.GetAdj]."
 CORP_BREAK_MIGRATION_PACT_PROPOSE_01:1 "Chúng tôi nhận thấy cái [Root.GetSpeciesMouthName] bép xép của [Root.GetSpeciesNamePlural] đang phá hoại nghiêm trọng văn hóa doanh nghiệp của [From.GetAdj]."
 CORP_BREAK_MIGRATION_PACT_ACCEPT_01:0 "[Root.GetName] xin xác nhận, chương trình trao đổi nhân tài [Root.GetAdj]-[From.GetAdj] sẽ bị chấm dứt ngay lập tức."
 CORP_OPEN_BORDERS_SELECT_01:0 "Mở cửa biên giới đi, và tận hưởng vô vàn đặc quyền của thương mại tự do nào."
 CORP_OPEN_BORDERS_PROPOSE_01:0 "Nhằm thúc đẩy tự do thương mại toàn thiên hà, [From.GetName] từ giờ sẽ mở cửa biên giới với các người."
 CORP_OPEN_BORDERS_ACCEPT_01:0 "[Root.GetName] cảm ơn ngài đã mở cửa biên giới cho các tàu buôn của chúng tôi."
 CORP_CLOSE_BORDERS_SELECT_01:0 "Nghĩ cho kỹ nhé, [From.GetSpeciesNamePlural]. Chủ nghĩa bảo hộ sẽ cản bước sự phát triển và phồn vinh của nền kinh tế đất nước các người đấy."
 CORP_CLOSE_BORDERS_PROPOSE_01:0 "[From.GetName] sẽ không tiếp tục dung túng cho tàu thuyền của [Root.GetAdj] xâm phạm lãnh thổ của [From.GetAdj]. Toàn bộ tàu [Root.GetAdj] phải rời khỏi không phận [From.GetAdj] ngay lập tức."
 CORP_CLOSE_BORDERS_ACCEPT_01:0 "Thương mại liên sao tự do hóa là xu thế tất yếu, chính sách bảo hộ của ngài cũng chỉ như bọ ngựa cản xe mà thôi."
 CORP_KICK_FROM_ALLIANCE_SELECT_01:0 "Vui lòng xác nhận yêu cầu đá [Root.GetName] khỏi §Y[From.GetAllianceName]§!. Lưu ý rằng, [Root.GetName] sẽ dùng các biện pháp pháp lý để bảo vệ lợi ích kinh tế của chính mình."
 CORP_KICK_FROM_ALLIANCE_PROPOSE_01:1 "[From.GetName] rất lấy làm tiếc phải thông báo, hội đồng quản trị [From.GetAllianceName] đã nhất trí thông qua quyết định khai trừ [Root.GetName] khỏi liên minh. Nếu có khiếu nại, vui lòng làm việc với luật sư của chúng tôi."
 CORP_KICK_FROM_ALLIANCE_ACCEPT_01:0 "Nỗi khổ của những kẻ đi trước thời đại, là tài năng của họ chỉ được công nhận khi mọi chuyện đã rồi. Sẽ có ngày, người ta phải ngả mũ trước bộ óc kinh doanh thiên tài của [Root.GetName]."
 CORP_OFFER_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Vui lòng xác nhận lời mời [Root.GetName] trở thành đối tác liên kết của §Y[From.GetAllianceName]§!."
 CORP_OFFER_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "Sau chuỗi ngày hợp tác vô cùng năng suất, chúng tôi rất hân hạnh được mời [Root.GetName] trở thành đối tác liên kết của [From.GetAllianceName]."
 CORP_OFFER_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "[Root.GetName] vô cùng cảm kích và xin nhận lời trở thành đối tác liên kết của §Y[From.GetAllianceName]§!, hy vọng đôi ta sẽ có một mối quan hệ hợp tác béo bở và lâu dài."
 CORP_OFFER_FEDERATION_ASSOCIATION_STATUS_REFUSE_01:0 "[Root.GetName] hiện chưa có kế hoạch hợp tác sâu rộng hơn với §Y[From.GetAllianceName]§!."
 CORP_REVOKE_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Vui lòng xác nhận yêu cầu tước bỏ tư cách đối tác liên kết §Y[From.GetAllianceName]§! của [Root.GetAdj]."
 CORP_REVOKE_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "[From.GetName] rất tiếc phải thông báo, do những bất đồng trong quá trình làm ăn, hội đồng quản trị đã đồng lòng biểu quyết tước bỏ tư cách đối tác liên kết §Y[From.GetAllianceName]§! của [Root.GetAdj]."
 CORP_REVOKE_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "Dẫu rất tiếc nuối trước quyết định tước bỏ tư cách đối tác liên kết §Y[From.GetAllianceName]§! của [Root.GetAdj], nhưng chúng tôi vẫn sẽ tiếp tục cung cấp dịch vụ với mức giá phải chăng."
 CORP_ASK_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Vui lòng xác nhận yêu cầu muốn trở thành đối tác liên kết của §Y[Root.GetAllianceName]§!."
 CORP_ASK_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "[Root.GetSpeciesNamePlural] đáng mến! Nhằm thắt chặt hơn nữa mối quan hệ song phương, chúng tôi đề xuất được trở thành đối tác liên kết của §Y[Root.GetAllianceName]§!."
 CORP_ASK_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "[From.GetSpeciesNamePlural]! [Root.GetName] rất vinh dự được đại diện cho §Y[Root.GetAllianceName]§! tuyên bố, các người đã chính thức có được tư cách đối tác liên kết của §Y[Root.GetAllianceName]§!."
 CORP_ASK_FEDERATION_ASSOCIATION_STATUS_REFUSE_01:0 "Chúng tôi rất tiếc phải thông báo rằng, đơn xin làm đối tác liên kết của §Y[Root.GetAllianceName]§! đã bị từ chối."
 CORP_END_FEDERATION_ASSOCIATION_STATUS_SELECT_01:0 "Vui lòng xác nhận yêu cầu từ bỏ tư cách đối tác liên kết của §Y[Root.GetAllianceName]§!."
 CORP_END_FEDERATION_ASSOCIATION_STATUS_PROPOSE_01:0 "[From.GetName] xin trân trọng tuyên bố rút lui khỏi vị trí đối tác liên kết của §Y[Root.GetAllianceName]§!. Nếu có vấn đề gì, hãy liên hệ với bộ phận pháp lý của chúng tôi."
 CORP_END_FEDERATION_ASSOCIATION_STATUS_ACCEPT_01:0 "Tư cách đối tác liên kết của ngài tại §Y[Root.GetAllianceName]§! đã bị hủy bỏ."
 CORP_INSULT_FRIENDLY_01:0 "À há, [Root.GetSpeciesNamePlural], những đối tác quý báu nhất của chúng tôi! Xin hỏi có việc gì thế?"
 CORP_INSULT_NEUTRAL_01:0 "Nếu ngài không hài lòng với dịch vụ của chúng tôi, vui lòng liên hệ tổng đài chăm sóc khách hàng..."
 CORP_INSULT_HOSTILE_01:0 "Nói gì cơ, [Root.GetSpeciesNamePlural]? Tiếng động cơ ồn quá, chả nghe thấy gì sất. Chúng tôi đang lượn lờ bằng tàu văn phòng cơ."
 CORP_INSULT_PROPOSE_01:1 "Mũi của [From.GetName] chúng tôi rất thính mùi tiền, còn các người, [Root.GetSpeciesNamePlural], thì đang bốc ra cái thứ mùi hôi thối của sự tuyệt vọng."
 CORP_INSULT_PROPOSE_02:1 "Chúng tôi sẽ đóng gói cái chết thành hàng hóa, và bán nó cho [From.GetSpeciesSpawnNamePlural] của các người, [From.GetSpeciesNamePlural]."
 CORP_INSULT_PROPOSE_03:0 "Nếu thời gian là vàng bạc, thì nhìn vào báo cáo tài chính hàng năm của các người, án tử của [From.GetSpeciesNamePlural] sắp tới nơi rồi."
 CORP_CORP_INSULT_PROPOSE_01:0 "[Root.GetName] đã hết thời rồi, [From.GetName] mới thực sự làm chủ tương lai. Chấp nhận sự thật đi, khó lắm sao."
 CORP_INSULT_ACCEPT_FRIENDLY_01:0 "Buôn bán còn ra tiền chứ chửi đổng thì được gì, ngài sẽ chẳng bao giờ lay chuyển được niềm tin này của [From.GetSpeciesAdj] đâu."
 CORP_INSULT_ACCEPT_01:1 "Các người đã đánh mất vị thế rồi, [Root.GetSpeciesNamePlural]. Có lẽ nên thử tư duy đột phá xem sao?"
 CORP_INSULT_ACCEPT_02:0 "Ôi, [From.GetSpeciesNamePlural]... Các người đã rất cố gắng, nhưng chỉ tốn công vô ích. Có những kẻ sinh ra đã không có số làm giàu."
 CORP_INSULT_ACCEPT_03:0 "Cãi vã và dọa suông là thứ vũ khí bần cùng của đám phá sản. Còn [Root.GetName] sẽ bảo vệ lợi ích của mình bằng bọc thép và hỏa lực."
 CORP_INSULT_ACCEPT_04:0 "[From.GetSpeciesNamePlural], nếu muốn kiếm chuyện thì nên nhớ, đánh thắng trận là nhờ súng đạn chứ không phải nhờ võ mồm."
 CORP_INSULT_ACCEPT_05:0 "A, ngài đến thật đúng lúc! Chúng tôi vừa đăng ký bản quyền thương hiệu §Y[From.GetSpeciesNamePlural] phải chết§! cho tên lửa đạn đạo tầm xa của mình đấy."
