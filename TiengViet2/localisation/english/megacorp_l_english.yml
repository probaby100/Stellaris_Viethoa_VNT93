 market_founding_chain_desc:0 "Việc thành lập một diễn đàn thương mại quốc tế sắp diễn ra, và bất kỳ ai kiểm soát trạm giao dịch trung tâm sẽ thu được nguồn lợi to lớn.[GetMarketFoundingChainEnd]"
 market_founding_end_regular: "\n\nNếu muốn cạnh tranh danh hiệu chủ nhà thị trường, chúng ta có thể sử dụng §HQuyết định§! trong vài năm tới để đề cử một trong những hành tinh của mình làm nơi đặt $galactic_market_station$."
 market_founding_end_nomadic: "\n\nChúng ta không có hành tinh nào để làm nơi neo đậu cho $galactic_market_station$, do đó chúng ta không thể đảm nhận trọng trách chủ nhà. Tuy nhiên, bất kể trạm này được đặt ở đâu, chúng ta vẫn có thể tự do tham gia giao thương."

