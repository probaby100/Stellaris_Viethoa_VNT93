 CORP_LEAVE_A_ACCEPT_01:1 "[From.GetSpeciesNamePlural], các người vừa nhảy khỏi một con tàu vững chãi đấy, một con tàu cực kỳ vững chãi!"
 CORP_LEAVE_A_ACCEPT_02:0 "Nếu ngài gia nhập §Y[Root.GetAllianceName]§! chỉ để nhìn hệ thống kinh tế của mình sụp đổ tan tành, thì chúng tôi sẽ không cản đâu, đối tác à..."
