 wg_expel_corp_effects:3 "Tất cả Chi Nhánh Văn Phòng thuộc quyền sở hữu của §Y[From.GetName]§! trong §Y[Root.GetName]§! (và đồng minh của họ) đều bị đóng cửa.\n§Y[Root.GetName]§! nhận được §Y$trade_with_icon$§! §G1000§! cho mỗi Chi Nhánh Văn Phòng bị đóng cửa."
