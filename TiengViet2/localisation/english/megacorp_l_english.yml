 col_resort_desc: "Tăng cường £mod_pop_bonus_workforce_mult£ §H$influential_jobs_bonus_workforce_mult$§!."
 col_slave:0 "Hành tinh nô lệ"
 col_slave_tt:1 "Hành tinh này được thiết kế và xây dựng với mục đích duy nhất là vắt kiệt tối đa sức lao động từ lực lượng nô lệ."
