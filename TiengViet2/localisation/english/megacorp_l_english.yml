 district_prison: "Đặc khu Nhà tù"
 district_prison_plural: "Đặc khu Nhà tù"
 district_prison_desc: "Phòng giam, tháp canh, tường rào và trạm kiểm soát. Nơi đây sinh ra chỉ nhằm mục đích giam giữ và cải tạo các tù nhân của xã hội."
 district_prison_industrial: "Đặc khu Cải tạo Lao động"
 district_prison_industrial_plural: "Đặc khu Cải tạo Lao động"
 district_prison_industrial_desc: "Phân xưởng, nhà máy, hệ thống giám sát và những bức tường kiên cố, nhằm kết hợp giữa giam giữ và lao động sản xuất trong một trật tự an ninh nghiêm ngặt."
 building_virtual_entertainment_studios:0 "Xưởng Giải trí Ảo"
 building_virtual_entertainment_studios_desc:0 "Tận dụng hệ thống giao dịch nano và thuật toán lưu trữ hóa thần kinh, các nhà phát triển này mang đến những phần mềm giải trí ảo tối tân nhất cho vô số khách hàng có trí tuệ."
 building_private_shipyards:0 "Xưởng đóng tàu Tư nhân"
 building_private_shipyards_desc:0 "Các nhà máy của doanh nghiệp hành tinh này chuyên sản xuất và lắp ráp những linh kiện thiết yếu cho tàu vũ trụ."
 building_military_contractors:0 "Văn phòng Lính đánh thuê"
 building_military_contractors_desc:0 "Văn phòng này mở ra cơ hội cho cư dân địa phương dấn thân vào sự nghiệp đánh thuê đầy rủi ro nhưng cũng lắm thú vị. Mức lương hậu hĩnh, bảo hiểm y tế cơ bản và những huyền thoại phiêu lưu đảm bảo cho nguồn tân binh không bao giờ cạn."
 building_commercial_forum:0 "Diễn đàn Thương mại"
 building_commercial_forum_desc:0 "Với không gian thư giãn lý tưởng để bàn bạc làm ăn, đây là nơi giới tinh hoa, các trùm kinh tế địa phương và những nhân vật máu mặt gặp gỡ đại diện của doanh nghiệp."
 district_slave: "Đặc khu Nô lệ"
 district_slave_desc: "Những khu ổ chuột vô tận với vô số căn phòng hộp chật chội xếp chồng lên nhau, nhằm nhồi nhét nhiều cá thể nhất với chi phí rẻ mạt nhất."
 district_slave_plural: "Đặc khu Nô lệ"
 district_battle_thrall: "Đặc khu Nô binh"
 district_battle_thrall_desc: "Những doanh trại kiên cố và thao trường chết chóc được dựng lên để rèn giũa ra những chiến binh nô lệ hung hãn nhất."
