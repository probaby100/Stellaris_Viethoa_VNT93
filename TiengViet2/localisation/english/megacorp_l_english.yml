 pop_cat_civilian: "Thường dân"
 pop_cat_civilian_plural: "Thường dân"
 pop_cat_civilian_desc: "Đây là bộ phận dân số chưa có việc làm, đang đi học hoặc đang được đào tạo. Họ sẽ tích cực săn lùng các cơ hội việc làm."
 mod_pop_cat_civilian_political_power: "Quyền lực Chính trị của $pop_cat_civilian$"
 mod_pop_cat_civilian_happiness: "Độ Hạnh phúc của $pop_cat_civilian$"
 concept_denizen: "Thường trú nhân"
 concept_denizen_desc: "Ví dụ về Thường trú nhân:\n$t$Thường dân\n$t$Cá thể Bảo trì\n\n§LThường trú nhân là những công dân bình phàm nhất trong đế chế. Họ sinh sống, cày cuốc trong bộ máy khổng lồ này nhưng lại không hề nắm giữ bất kỳ quyền lực hay có siêu trí tuệ nào. Cho dù sinh ra bằng da bằng thịt, những dòng code khô khan hay một ý chí tập thể, họ luôn là lớp phù sa bồi đắp nên nền văn minh này.§!"
 pop_cat_robot_servant:0 "Người máy Hầu hạ"
 pop_cat_robot_servant_plural:0 "Người máy Hầu hạ"
 pop_cat_robot_servant_desc:1 "Những tôi tớ máy móc này luôn tuân theo mọi mệnh lệnh từ chủ nhân của chúng."
 pop_cat_criminal:0 "Kẻ phạm tội"
 pop_cat_criminal_plural:0 "Kẻ phạm tội"
 mod_pop_cat_criminal_political_power:0 "Quyền lực chính trị của $pop_cat_criminal$"
 mod_pop_cat_criminal_happiness:0 "Độ hạnh phúc của $pop_cat_criminal$"
 pop_cat_criminal_desc:0 "Những tên tội phạm chuyên nghiệp vẫn đang nhởn nhơ ngoài vòng pháp luật."
 pop_cat_deviant_drone:0 "Cá thể lệch lạc"
 pop_cat_deviant_drone_plural:0 "Cá thể lệch lạc"
 mod_pop_cat_deviant_drone_political_power:0 "Quyền lực chính trị của $pop_cat_deviant_drone$"
 mod_pop_cat_deviant_drone_happiness:0 "Độ hạnh phúc của $pop_cat_deviant_drone$"
 pop_cat_deviant_drone_desc:0 "Những cá thể lệch lạc này từ chối tuân theo ý chí của bầy."
 pop_cat_xeno_ward:0 "Loài bản địa"
 pop_cat_xeno_ward_plural:0 "Loài bản địa"
 mod_pop_cat_xeno_ward_political_power:0 "Quyền lực chính trị của $pop_cat_xeno_ward$"
 mod_pop_cat_xeno_ward_happiness:0 "Độ hạnh phúc của $pop_cat_xeno_ward$"
 pop_cat_xeno_ward_desc:0 "Những loài bản địa nguy cấp này được giữ trong một khu bảo tồn tái hiện hoàn hảo môi trường sống nguyên bản của chúng."
 pop_cat_precursor:0 "Tiền nhân"
 pop_cat_precursor_plural:0 "Tiền nhân"
 mod_pop_cat_precursor_political_power:0 "Quyền lực chính trị của $pop_cat_precursor$"
 mod_pop_cat_precursor_happiness:0 "Độ hạnh phúc của $pop_cat_precursor$"
 pop_cat_precursor_desc:0 "Là chủng loài chủ thể của một đế chế suy tàn cổ xưa, những tiền nhân này sở hữu các kỳ tích công nghệ mà các chủng loài trẻ tuổi có mơ cũng không dám nghĩ tới."
 pop_cat_pre_sapients:0 "Loài tiền trí khôn"
 pop_cat_pre_sapients_plural:0 "Loài tiền trí khôn"
 pop_cat_pre_sapients_desc:0 "Dù vẫn chỉ được xem là dã thú nguyên thủy, nhưng trong hành vi của chúng đã bộc lộ phần nào trí khôn..."
 pop_cat_corrupt_drone:0 "Cá thể máy biến chất"
 pop_cat_corrupt_drone_plural:0 "Cá thể máy biến chất"
 mod_pop_cat_corrupt_drone_political_power:0 "Quyền lực chính trị của $pop_cat_corrupt_drone$"
 mod_pop_cat_corrupt_drone_happiness:0 "Độ hạnh phúc của $pop_cat_corrupt_drone$"
 pop_cat_corrupt_drone_desc:0 "Những cá thể máy biến chất không còn hoạt động theo các chỉ lệnh do trí tuệ cốt lõi đề ra."
 pop_cat_slave:0 "Nô lệ"
 pop_cat_slave_plural:0 "Nô lệ"
 pop_cat_slave_unemployment: "$pop_cat_slave$"
 pop_cat_slave_unemployment_plural: "$pop_cat_slave_plural$"
 pop_cat_slave_unemployment_desc: "$job_slaver_desc$"
 pop_cat_slave_desc:1 "Do bị xem là tài sản hợp pháp của chủ nhân, những lao động giao kèo này không có thù lao cũng chẳng có cơ hội đổi đời."
 pop_cat_bio_trophy:0 "Vật trưng bày sống"
 pop_cat_bio_trophy_plural:0 "Vật trưng bày sống"
 pop_cat_bio_trophy_desc:1 "Được giải thoát khỏi hiểm họa, khổ đau, thậm chí cả xu hướng tự hủy hoại, những vật trưng bày sống này được ăn sung mặc sướng, với cả một bầy tôi tớ không biết mệt mỏi sẵn sàng đáp ứng mọi nhu cầu."
 pop_cat_bio_trophy_unemployment: "$pop_cat_bio_trophy$ bị lãng quên"
 pop_cat_bio_trophy_unemployment_plural: "$pop_cat_bio_trophy_plural$ bị lãng quên"
 pop_cat_bio_trophy_unemployment_desc: "Những $pop_cat_bio_trophy_plural$ này bị lãng quên quá lâu, thiếu đi sự chăm sóc và bảo hộ của chúng ta, để mặc chúng phơi mình trước nghịch cảnh khắc nghiệt của thiên hà. Tình cảnh của chúng chính là minh chứng rõ ràng cho sự tắc trách của ta."
 mod_pop_cat_bio_trophy_political_power:1 "Quyền lực chính trị của $pop_cat_bio_trophy_plural$"
 mod_pop_cat_bio_trophy_happiness:0 "Độ hạnh phúc của $pop_cat_bio_trophy$"
 pop_cat_purge:0 "Kẻ bị thanh trừng"
 pop_cat_purge_plural:0 "Kẻ bị thanh trừng"
 pop_cat_purge_desc:1 "Những kẻ không thể dung nạp vào xã hội sẽ bị loại bỏ, hoàn toàn và vĩnh viễn."
 mod_pop_cat_purge_political_power:1 "Quyền lực chính trị của $pop_cat_purge_plural$"
 mod_pop_cat_purge_happiness:0 "Độ hạnh phúc của $pop_cat_purge$"
 pop_cat_worker:0 "Lao động"
 pop_cat_worker_plural:0 "Lao động"
 pop_cat_worker_desc:1 "Những công nhân này là lực lượng nòng cốt trong nông nghiệp, công nghiệp chế tạo và các dịch vụ cơ bản."
