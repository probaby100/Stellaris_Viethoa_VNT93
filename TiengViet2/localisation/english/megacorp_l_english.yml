 district_mining_plural:0 "Đặc khu Khai khoáng"
 district_mining_desc:0 "Những thị trấn thợ mỏ và trung tâm khai thác này đã khoan sâu vào lòng đất để vơ vét nguồn khoáng sản khổng lồ."
