 # Lootboxes
 cara_home_lootbox.title:0 "$lootboxes$"
 lootboxdesc1:1 "§EMột chiếc $lootbox$ nhuốm màu thời gian được đặt trên bệ chữ thập sang trọng. Chiếc rương này chắc chắn chứa đầy kỳ trân dị bảo.§!"
 cara_home_lootbox_explain:0 "$lootboxes$ là gì?"
 cara_home_lootbox_explain.reply:0 "Đó là một câu chuyện từ thuở xa xưa, nhưng không quá rườm rà đâu.\n\nLứa thương nhân đầu tiên đã tụ hội và thành lập nên [caravaneer_home_country.GetName], mỗi năm một phần nhỏ hàng hóa đi qua trạm giao thương này sẽ được niêm phong, cho vào một hộp chứa kín và cất giữ dưới khoang hàng dưới cùng của trạm. Truyền thống này đã được gìn giữ từ rất lâu cho tới tận bây giờ, và khoang hàng hiện tại đã chật kín.\n\nThế nên cũng đã đến lúc chúng tôi đem bán những chiếc $lootboxes$ này."
 cara_home_lootbox_contents:0 "Bên trong $lootbox$ có gì?"
 cara_home_lootbox_contents.reply:0 "Cái này thì chúng tôi cũng chịu, chỉ có ai mua rồi mới biết.\n\nĐiều duy nhất chúng tôi biết là những thứ bên trong chắc chắn từng có giá trị ở một thời điểm nào đó. Mặc dù có bằng chứng cho thấy có khả năng đồ bên trong $lootbox$ toàn là mấy món rác rưởi đã qua sử dụng do đám cò mồi dở hơi nào đó cố tình nhét vào..."

 openedlootboxdesc1:0 "§E$lootbox$ đang... §Rtrống rỗng§!.\n\nBạn cố nén cơn tức giận để sự xấu hổ và hậm hực không hiện lên mặt. Rốt cuộc là do độ ẩm trong không khí tăng đột ngột hay do nước mắt đang mất kiểm soát? Tầm nhìn của bạn nhòe đi, nhưng chiếc $lootbox$ trống trơn kia vẫn cứ nằm chễm chệ ở đó.\n\nNhưng sau khi một luồng bóng tối hiện sinh nhấn chìm tất cả, mọi thứ đã trôi qua. Cảm giác này là sao? Nhớ lại khoảnh khắc bạn vung những đồng $ccoinz$ kiếm được bằng mồ hôi nước mắt, chầm chậm mở $lootbox$ với sự căng thẳng và phấn khích từ tận đáy lòng... Bây giờ bạn lại tràn ngập một thứ §Gniềm tự hào và thành tựu§! không thể nói thành lời.§!"
 openedlootboxdesc2:0 ""
 openedlootboxdesc3:0 "openedlootboxdesc3"
 openedlootboxdesc4:0 "openedlootboxdesc4"
 openedlootboxdesc5:0 "openedlootboxdesc5"
 buying_boxes_desc:0 "Được rồi, hiểu rồi. Chúng tôi hiểu. Các bạn thích bóc hộp! Thông thường, chúng tôi sẽ giới hạn số hộp bán cho một khách, nhưng với bạn thì chúng tôi có thể ngoại lệ. Từ giờ trở đi, hãy cứ tận hưởng đặc quyền mua trực tiếp hộp báu vật, chỉ là số §YNăng lượng§! tốn mỗi lần sẽ nhích lên một chút."

 cara_home_lootbox_buy:0 "Chúng tôi định mua một cái $lootbox$."
 cara_home_lootbox_buy.tooltip:0 "Tốn §R$boxcost$§! $ccoinz$ để mua một cái $lootbox$."
 cara_home_lootbox_buy_energy:0 "Chúng tôi muốn dùng Năng lượng để mua $lootbox$."
 cara_home_lootbox_buy_energy.tooltip:0 "Tốn §R[root.box_cost]§! £energy£ §YNăng lượng§! để mua một cái $lootbox$."
