 lootbox_buy_allow_fail:0 "§RChúng ta không đủ $ccoinz$§!"

 lootbox.intro:0 "Mở $lootbox$ ra, chúng ta phát hiện..."
 lootbox.and:0 "\nLục tung cả hộp lên, chúng ta còn tìm thấy..."
 lootbox_contents_empty:0 "§RTrống không§!."
 lootbox_contents_a:0 "§E$lootbox$ chứa một tấm bản đồ cổ ghi chép những tuyến đường giao thương đã thất truyền từ lâu, trong đó có cả hệ sao thủ đô §Y[Root.Capital.GetStarName]§! của chúng ta!§!"
 lootbox_contents_b:1 "§ETrong $lootbox$ đựng một bộ đồng phục hoàn chỉnh. Tiếc là thiết kế này lại dành cho một giống loài nào đó có nhiều chi hơn so với [Root.GetName].\n\nTuy nhiên, chất liệu của bộ đồ này vẫn có thể tái chế lại.§!"
 lootbox_contents_c:0 "§ETrong $lootbox$ có bom!\n\nĐừng lo, tháo ngòi nổ rồi.§!"
 lootbox_contents_c.tooltip:0 "Thở phào nhẹ nhõm."
 lootbox_contents_d:0 "§E$lootbox$ chứa một bài luận văn về tình yêu và vòng tuần hoàn tự nhiên của vạn vật. Nó được viết bằng ngôn ngữ [Root.GetAdj], và mang phong cách cực kỳ hiện đại.§!"
 lootbox_contents_e:1 "§ETrong $lootbox$ cất giữ một khẩu súng không rõ nguồn gốc, cò súng rõ ràng đã bị phá hỏng.§!"
 lootbox_contents_e.tooltip:0 "Chuyện lạ."
 lootbox_contents_f:0 "§E$lootbox$ nhét đầy khẩu phần ăn quân đội. Tuy mọi nhãn mác trên đó đã bị mài mòn hoàn toàn, nhưng đồ bên trong trông có vẻ vẫn an toàn, và phù hợp với cấu trúc sinh lý của [Root.GetAdj].§!"
 lootbox_contents_g:0 "§ETrong $lootbox$ có phát ra tiếng nhạc, mặc dù bên trong chẳng có gì giống với thiết bị phát nhạc cả.\n\nThế là chiếc $lootbox$ liền bị đóng lại và vứt xó ở một góc nào đó.§!"
 lootbox_contents_g.tooltip:0 "Cạn lời."
 lootbox_contents_h:0 "§E$lootbox$ chứa đầy những viên bi ve màu xanh tuyệt đẹp.§!"
 lootbox_contents_i:0 "§ETrong $lootbox$ chứa một lượng của cải nhiều vô số kể, nếu bạn đi kể với những người không có mặt thì chẳng ai tin trên đời lại có khối tài sản khổng lồ đến vậy.\n\nNhưng con số thâm hụt trên bảng báo cáo tài chính chính là minh chứng rõ nhất.§!"
 lootbox_contents_j:0 "§E$lootbox$ chứa vài thiết bị ngoại lai, không thấy có phản ứng gì, chắc hỏng mất rồi.§!"
 lootbox_contents_k:0 "§ETuy trống rỗng, nhưng trên vách trong của chiếc $lootbox$ này lại hằn lên vô vàn dấu vết. Dò xét kỹ hơn thì phát hiện ra dấu tích của một số loại vật chất sinh học.§!"
 lootbox_contents_l:2 "§ETrong $lootbox$ là một sinh linh chỉ có thể tồn tại dưới dạng tần số sóng trong một mặt phẳng hư không. Ngay khi bị phát hiện, nó lập tức trốn thoát sang một chiều không gian cao hơn, chỉ để lại trong lòng bạn sự giác ngộ sâu sắc cùng nỗi bất an vô định.§!"
 lootbox_contents_m:0 "§E$lootbox$ rất khó mở, cảm giác như bên trong có một giếng trọng lực thu nhỏ đang ngăn không cho nó mở ra vậy.§!"
 lootbox_contents_n:1 "§ETrong $lootbox$ chẳng có gì sất. Khoảng trống đáng lẽ dùng để chứa đồ lại bị thay thế bởi một khối hợp kim nhẵn thín, kết nối liền mạch không tì vết với vách trong của hộp.§!"
 lootbox_contents_galatron:0 "§ELà §!Ngôi sao Ngân hà§E...!§!"

 cara_home_galatron.title:1 "Ngôi sao Ngân hà"
 cara_home_galatron.desc:0 "§ENgôi sao Ngân hà§! là của bạn!"
 cara.320.a:0 "Đó là gì thế?"
 cara.320.a.reply:1 "Đây là §ENgôi sao Ngân hà§!, hòn đá tảng của tổ chức Thương đoàn. Tổ tiên chúng tôi từng tuyên thệ trước nó để lập nên $NAME_Caravaneer_Home$.\n\nNgày trước, sự phát triển của $NAME_Caravaneer_Home$ đều dựa vào sức mạnh bí ẩn của §ENgôi sao Ngân hà§!, nhưng theo dòng thời gian, luồng sức mạnh ấy đã dần tiêu tán."
 cara.320.b:0 "Nó có tác dụng gì?"
 cara.320.b.reply:1 "Nó là §ENgôi sao Ngân hà§! đấy! §ENgôi sao Ngân hà§! đó!\n\nChắc thế."
 cara.320.c:0 "Nó đáng giá bao nhiêu? Có bán được không?"
 cara.320.c.reply:1 "Vật này là §ENgôi sao Ngân hà§!, bảo vật vô giá. Vì người trong khắp hệ sao đều tắm mình trong ánh hào quang của nó, nên vàng bạc châu báu chẳng thể đánh đổi.\n\nNhưng hãy nhớ kỹ: Tục ngữ có câu thất phu vô tội, hoài bích kỳ tội. Của cải không đổi được, nhưng đao kiếm lại cướp được."
 cara.320.d:0 "Cảm ơn? Tạm biệt...?"

 cara.910.name:1 "$cara.920.name$"
 cara.910.desc:1 "Chúng ta đã tiêu diệt đại bản doanh của $NAME_Caravaneer_Home$ - trạm giao thương Tungle. Lũ rệp tham lam này xong đời rồi!"
 cara.920.name:1 "§H$caravaneers$§!: Tungle Bị Tiêu Diệt"
 cara.920.desc:1 "[From.From.GetName] đã phá hủy trạm giao thương của Thương đoàn. Liệu có ai may mắn sống sót qua cuộc thảm sát này không thì chúng ta cũng không rõ."
 cara.930.name:1 "$NAME_Caravaneer_Home$"
 cara.930.desc:1 "Alo alo? Nghe rõ không?\n\nTốt quá. Các bạn đã nghe chuyện ngôi nhà chung của toàn bộ Thương đoàn, trạm giao thương Tungle, vừa bị tấn công man rợ chưa? Có vài kẻ ghét cay ghét đắng sự tự do lưu thông của hàng hóa và dịch vụ! Kẻ thủ ác tưởng chúng tôi đã toi mạng hết, nhưng bạn thấy đấy, hội đồng Thương đoàn vẫn còn sống sờ sờ ra đây.\n\nChúng tôi muốn khôi phục lại hoạt động trong hệ sao §Y[cara_home_new_location.GetName]§!. Tất nhiên, nói một cách nghiêm túc thì hệ sao này không còn thuộc về các bạn nữa, nhưng chúng tôi sẽ đền bù thỏa đáng."
 cara.930.a:0 "Hệ sao đó là của các bạn, hỡi những người bạn thương buôn."
 cara.930.a.tooltip:0 "$NAME_Caravaneer_Home$ nhận được quyền sở hữu hệ sao §Y[cara_home_new_location.GetName]§!"
 cara.930.b:0 "Hệ sao này là cứ điểm chiến lược, không thể giao cho các bạn."
 cara.930.c:0 "Việc các người sống sót làm chúng tôi chướng mắt. Cút đi."
 cara.940.name:0 "§H$caravaneers$§!: Tái thiết"
 cara.940.desc:0 "[caravaneer_home_country.GetName] đã dựng lại trạm giao thương tại hệ sao [cara_home_new_location.GetName], nơi từng là lãnh thổ của [From.GetAdj]."
 cara.940.b.reply:0 "Thật đáng tiếc, dù đôi bên không thể cùng có lợi, bạn lại cố tình chọn con đường chuốc lấy thất bại.\n\nTạm biệt."

 # Galatron
 cara.950.name:0 "Đoạt được §ENgôi sao Ngân hà§!"
 cara.950.desc:0 "[From.From.GetName] đã đầu hàng, Ngôi sao Ngân hà tối cao giờ đã nằm trong tay chúng ta!"
 cara.950.a:0 "Nguyện ánh sáng Ngôi sao Ngân hà mãi mãi trường tồn."
 cara.951.name:0 "Đánh mất §ENgôi sao Ngân hà§!"
 cara.951.desc:0 "Bỏ ngoài tai những tiếng gào thét điên loạn của kẻ bại trận, quân đội [From.GetAdj] đã tiếp quản Ngôi sao Ngân hà bằng một buổi lễ nhạt nhẽo."
 cara.951.a:0 "Ngàn vạn lời nói cũng chỉ hóa thành sự phẫn nộ không lời."

 # Fleet 1
 cara_fleet1_contact.title:0 "§YHạm đội Thương đoàn:§! Tập đoàn Vengral"
 fleet1contact_opening:0 "Thương nhân được Liên minh Thương đoàn chứng nhận, Tập đoàn Vengral xin gửi lời chào đến quý vị!"
 fleet1contact1:0 "$fleet1contact_opening$ Dành tặng quý vị những món hàng độc quyền nơi ven bờ cõi thiên hà (do nhà máy trên tàu làm giả), đảm bảo ngon bổ rẻ.\n\n$fleet1contact_explanation$"
 fleet1contact2:0 "$fleet1contact_opening$ Chúng tôi dạy các giống loài ngoại lai cách ngồi mát ăn bát vàng, mặc dù có lẽ quý vị cũng chẳng cần học làm gì.\n\n$fleet1contact_explanation$"
 fleet1contact3:0 "$fleet1contact_opening$ Chúng tôi tự làm tự ăn, nhưng chưa chắc đã tự tay làm hết. Phải làm việc nhóm mới biến ước mơ thành hiện thực chứ!\n\n$fleet1contact_explanation$"
 fleet1contact_explanation:0 "Khi bay qua lãnh thổ của quý vị, chúng tôi sẽ đưa ra những thỏa thuận giao dịch độc quyền cực kỳ hấp dẫn. Không cần đồng ý ngay, liên hệ trước khi chúng tôi rời đi là được. Lưu ý, mọi cuộc gọi sẽ được chuyển tới $NAME_Caravaneer_Home$."
 fleet1contact1notinborder:0 "$fleet1contact_opening$ Dành tặng quý vị những món hàng độc quyền nơi ven bờ cõi thiên hà (do nhà máy trên tàu làm giả), đảm bảo ngon bổ rẻ.\n\n$fleet1contact_explanation_notinborder$"
 fleet1contact2notinborder:0 "$fleet1contact_opening$ Chúng tôi dạy các giống loài ngoại lai cách ngồi mát ăn bát vàng, dù sao thì quý vị cũng làm rất tốt rồi.\n\n$fleet1contact_explanation_notinborder$"
 fleet1contact3notinborder:0 "$fleet1contact_opening$ Chúng tôi tự làm tự ăn, nhưng chưa chắc đã tự tay làm hết. Phải làm việc nhóm mới biến ước mơ thành hiện thực chứ!\n\n$fleet1contact_explanation_notinborder$"
 fleet1contact_explanation_notinborder:0 "Mỗi khi đi qua khu vực của quý vị, chúng tôi đều sẽ mời chào những món hời độc quyền. Không may là, toàn bộ tàu của chúng tôi hiện đang nằm ngoài lãnh thổ của quý vị, tuy nhiên, chúng tôi vẫn mong chờ được làm ăn với quý vị trong tương lai! Trong khoảng thời gian đó, cứ thoải mái liên hệ, nhưng nhớ là cuộc gọi sẽ chuyển hướng về $NAME_Caravaneer_Home$."
 cara_fleet1_contacted:0 "Chào nhé, thương nhân."
 cara_fleet1_exit:0 "Không hứng, đi đi."

 cara_fleet1_main.title:0 "$cara_fleet1_contact.title$"
 fleet1hewwo01:0 "Chúng tôi bán tuyến nội tiết Blorg số lượng có hạn cho các cá nhân. Dùng rất mượt cho các loại màng bán thấm!"
 fleet1hewwo02:0 "Sống ở đời ai chẳng có lúc buồn phiền bế tắc. Nhưng tôi sẽ nhớ ra ngay, sự giàu sang và hạnh phúc đang chờ đợi ngay góc phố kia!\n\nNhớ kể cho bạn bè của bạn nhé!"
 fleet1hewwo03:0 "Dịch dinh dưỡng Barnis không làm từ người đâu.\n\nCông thức thì bí mật, nhưng cam đoan cực kỳ khỏe mạnh."
 fleet1hewwo04:0 "Xin lưu ý, nhãn dán §Rcó thể lẫn rác Vengral§! chỉ có nghĩa là thiết bị sản xuất món hàng này cũng được dùng để xử lý rác Vengral thôi, không phải món hàng này là rác Vengral đâu."
 fleet1hewwo05:0 "Lúc nào chúng tôi cũng chào đón các nhà phân phối nhánh dưới tham gia. Có hứng gia nhập Tập đoàn Vengral không?"
 fleet1hewwo06:0 "Bạn hoàn toàn có thể tin tưởng vào chất lượng của Vengral."
 fleet1hewwo07:0 "Yêu cầu hoàn tiền chứng tỏ người mua không có đủ niềm tin vào sản phẩm. Nhưng chúng tôi cực kỳ tự tin vào chất lượng các sản phẩm của mình."
 fleet1hewwo08:0 "Chúng tôi dạy các chủng tộc ngoại lai cách làm giàu không khó."
 fleet1hewwo09:0 "Sản phẩm thế nào không quan trọng, cốt lõi là nó mang lại bao nhiêu lợi ích."
 fleet1hewwo10:0 "Bạn có biết giống loài trí tuệ nào đang cần kiếm thêm tí Năng lượng ngoài giờ không?"
 fleet1hewwo11:0 "Dù sản phẩm của chúng tôi chẳng bao giờ lo ế, nhưng chúng tôi vẫn sẵn lòng bỏ thời gian ra bán nó cho ngài."
 fleet1hewwo12:0 "Xin đấy, mua gì đó đi. Mua cái quái gì cũng được."
 fleet1hewwo13:0 "Ở Tập đoàn Vengral không có ông chủ, ai cũng là sếp của chính mình. Dù điều này đúng là sẽ gây ra vài rắc rối... trong việc quản lý."
 fleet1hewwo14:0 "Mục tiêu của Tập đoàn Vengral là khiến thế giới này không có chuyện kinh doanh nào là khó khăn. Đó là nền tảng sống còn của Vengral. Đứa nào không thích kinh doanh đều là...\n\nSai lầm.\n\nCho nên..."
 fleet1hewwo15:0 "Đến cả tờ biên lai lịch sử cổ xưa nhất của Vengral cũng nhắc đến các thương nhân hành tinh Orun. Bọn họ đã nâng đỡ chúng tôi, giúp nền văn minh của chúng tôi vọt lên từ thời thơ ấu thẳng tới giai đoạn mua đồ bếp của họ."
 fleet1hewwo16:0 "Truyền thuyết về Tập đoàn Vengral chính là truyền thuyết về các thương nhân hành tinh Orun. Dù họ không còn nữa, nhưng chỉ tiêu doanh số đã đặt ra từ trước vẫn bắt buộc phải hoàn thành!"

 cara_fleet1_deals.title:0 "$cara_fleet1_contact.title$"
 fleet1dealdesc1:0 "Chúng tôi sẽ trao cho bạn [Root.GetFleet1DealProduct]\n\nCòn chúng tôi chỉ lấy một khoản rất rất nhỏ là [Root.GetFleet1DealCost]\n\n[Root.GetFleet1DealProductAddendum]"
 cara_fleet1_deal:0 "Đưa tôi xem bạn định đem gì ra để đổi trước đã."
 cara_fleet1_take_deal:0 "Chốt."
 cara_fleet1_take_deal_fail.tooltip:0 "§RKhông có $SCIENCE_SHIP$ nào rảnh rỗi§!"
 cara_fleet1_dealtaken:0 "Rất vui được làm ăn với bạn. Hãy nhớ: Có ước mơ thì nhất định phải thực hiện nó!"

 cost_500energy:0 "Năng lượng: £energy£ §R-500§!"
 cost_1cruiser:0 "Tuần dương hạm [Root.GetAdj]: £military_ship£ §R-1§!"
 cost_5000food:0 "Thức ăn: £food£ §R-5000§!"
 cost_3pops:1 "Dân cư [Root.GetAdj] ở [Root.Capital.GetName]: £pop£§R-100§!"
 cost_2000energy:0 "Năng lượng: £energy£ §R-2000§!"
 product_randomtech:0 "Nhận được §Ymột công nghệ ngẫu nhiên§!"

 fleet1product1:1 "§GGiường tầng hiệu Vengral§!! Những chiếc 'ổ ngủ' có thể gập lại, tiết kiệm không gian và đầy tính đột phá này sẽ tăng sức chứa của hành tinh, cho phép bạn 'nhét' nhiều người hơn vào mỗi mét vuông!"
 fleet1product1_addendum:0 "§HGiao hàng một lần duy nhất tới §Ymột thuộc địa§!. Thời hạn sử dụng của giường tầng là §Y80 năm§!, tuyệt đối không kéo dài. Trong thời gian hiệu lực, tăng §Y$MOD_PLANET_HOUSING_ADD$§! thêm §G+10%§!.§!\n\n(Vui lòng lưu ý những mục không đề cập trong hướng dẫn sử dụng giường. Dùng giường tầng có thể làm tăng số ca chấn thương do ngã từ trên cao xuống. Hoặc gây rắc rối về quyền riêng tư. Hoặc làm xã hội dễ mắc bệnh truyền nhiễm và dịch bệnh theo mùa hơn)"
 fleet1product1_tooltip:0 "§G+1§! Nghị quyết §YTriển khai Giường Tầng§!"
 fleet1product2:0 "§GHộp đựng thức ăn hiệu Vengral§!! Bạn đã ngán ngẩm cảnh cư dân thuộc địa để rau củ quả dần thối rữa, chỉ vì hệ thống tiêu hóa của họ nhất thời không kham nổi?\n\nChỉ cần thả chiếc hộp này xuống thuộc địa mà bạn chọn, nó có thể thu thập đủ loại thức ăn và giữ cho chúng luôn tươi ngon. Có nó thì khỏi phải lo chuyện phí phạm thức ăn nữa, vì nó sẽ bảo quản mọi thứ, không chỉ giải quyết nạn lãng phí mà còn lo luôn cả nhu cầu lương thực."
 fleet1product2_addendum:1 "§HGiao hàng một lần duy nhất tới §Ymột thuộc địa§!. Thời hạn sử dụng hộp đựng thức ăn Vengral là §Y80 năm§!, tuyệt đối không kéo dài. Trong thời gian hiệu lực, §Y$mod_planet_pops_organics_food_upkeep_mult$§! giảm §G-10%§!.§!\n\n(Làm từ 100% nhựa polyme hộp đựng Vengral, chứa được đồ phân hủy cấp ba, dùng được trong máy rửa bát.)"
 fleet1product2_tooltip:0 "§G+1§! Nghị quyết §YTriển khai Hộp đựng Thức ăn Vengral§!"
 fleet1product3:1 "§GMáy khử mùi khí quyển hiệu Vengral§!! Mảnh đất canh tác của bạn có bốc mùi chua loét không? Thành phố sầm uất của bạn có bốc mùi 'Thôi xin đấy, đừng có ngửi!' không? Thuộc địa của bạn §Ecó hôi hám không§!?\n\nGiao hết cho chúng tôi đi, sản phẩm xịt khoáng kết hợp vi sinh vật có bản quyền của chúng tôi dư sức dọn sạch mọi tầng đối lưu có thể ở được. Cứ ngồi xuống, thư giãn, lắp máy khử mùi vào, bầu không khí trong lành tự nhiên sẽ đến."
 fleet1product3_addendum:2 "§HGiao hàng một lần chỉ tới §Ymột thuộc địa§!. Hiệu quả khử mùi có hạn trong vòng §Y80 năm§!, không hơn không kém. Trong thời gian hiệu lực, tăng §Y$MOD_PLANET_RESETTLEMENT_UNEMPLOYED_DESTINATION_MULT$§! thêm §G+100%§!.§!\n\n(Thương hiệu 'Máy khử mùi khí quyển Vengral' cùng bản quyền nhãn hiệu 'Bạn tưởng thứ mình đang hít là không khí à?' (C) 2200 mọi quyền thuộc về Tập đoàn Vengral.)"
 fleet1product3_tooltip:0 "§G+1§! Nghị quyết §YTriển khai Máy khử mùi khí quyển Vengral§!"
 fleet1product4:0 "§GBộ sưu tập đồ chơi công nghệ Vengral thượng hạng§!! Bên trong toàn là những món đồ công nghệ rực rỡ thời thượng, cam đoan sẽ biến bạn thành tâm điểm của mọi sự chú ý."
 fleet1product4_addendum:1 "(Trong mắt những người khác nhau, giá trị thực tế của món hàng có thể sẽ khác nhau.)"
 fleet1product5:0 "§GĐội ngũ kỹ thuật bán hàng của Tập đoàn Vengral§!. Sẽ được triển khai tại mọi trạm hành tinh của đế quốc bạn, họ sẽ làm gia tăng doanh thu $r_trade$ ở tất cả các hệ sao. (Những đối thủ đang ghen ăn tức ở có lẽ sẽ miêu tả quá trình này là 'Lạm phát nhân tạo')"
 fleet1product5_addendum:1 "§HĐội ngũ bán hàng của chúng tôi sẽ cư trú ngay trong các trạm không gian của bạn, họ chỉ ăn mì dinh dưỡng nhãn hiệu Vengral, ngoài việc cải thiện $r_trade$ của bạn ra thì không gây bất cứ ảnh hưởng nào đến dân số hay kinh tế. Thời hạn của nhiệm vụ này là §Y80 năm§!. Trong thời gian hiệu lực tăng $r_trade$ §G+15%§!.§!"
 fleet1product6:1 "§GHóa chất kích thích hồ ấp trứng hiệu Vengral§!! Chán phải chờ đợi đám ấu trùng, hoặc nhộng tiền ấu trùng lớn lên thành thể trưởng thành, hoặc thành trùng của nhộng chưa? Dùng ngay loại chất kích thích siêu an toàn này để đẩy nhanh tốc độ trưởng thành của chúng!"
 fleet1product6_addendum: "Lưu ý, kháng sinh trong hệ miễn dịch cơ thể của giống loài bạn sẽ làm cho chất xúc tác này mất tác dụng sau thời hạn §Hmười năm§!. Tuy nhiên trong suốt mười năm đó, bạn sẽ được tận hưởng cảm giác dân số tăng vọt, §Y$MOD_LOGISTIC_GROWTH_MULT$§! tăng mạnh §G10%§!."
 fleet1product7:0 "Vài chiếc vali chứa khoản £energy£ §Y$energy$§! không bị đánh dấu! Tổng cộng là £energy£ §G2000§! §Y$energy$§!. Hy vọng bạn cũng thấy phấn khích như chúng tôi!"
 fleet1product7_addendum:0 "Tập đoàn Vengral: Giúp đỡ đúng người ngoài hành tinh ở đúng chỗ."

 fleet1cost1:1 "§R200§! §H$pop_cat_specialist$§! £pop£ §HDân cư§!! Chúng tôi cần người để giúp làm sổ sách."
 fleet1cost1_tooltip:1 "§R-200§! §H$pop_cat_specialist$§! £pop£ §HDân cư§!"
 fleet1cost2:1 "£alloys£§R1200§! $alloys$!"
 fleet1cost3:0 "£unity£ §R500§! $unity$! Việc dùng máy móc để lĩnh hội tinh thần thời đại nhìn chung là không thể hiểu nổi, và sẽ khiến người ta cảm thấy bất an, nhưng bù lại thì nó hoàn toàn vô hại."
 fleet1cost4:0 "Lấy được £society£ $society_research$ trong vòng §R6 tháng§!! Chúng tôi rất muốn biết bạn làm thế nào mà được vậy?"
 fleet1cost5:1 "§R1§! §HTàu Nghiên cứu§! £science_ship£! Không bao gồm thủy thủ đoàn. Chúng tôi không cần họ, vứt đi."
 fleet1dealcost5_tooltip:0 "£science_ship£ §R-1§! $SCIENCE_SHIP$\n(Chuyên viên khoa học sẽ được sắp xếp lại.)"
 fleet1cost6:1 "§R-200§! §H$pop$§! £pop£ §HDân cư§!! Loại dân cư nào cũng được hết, thật đấy. Những cơ hội R&D y tế đầy hào hứng đang chờ đón họ! Bạn thấy đó, dạo này chúng tôi cũng bắt đầu mở rộng sang dịch vụ tuyển dụng rồi."
 fleet1cost6_tooltip:1 "§R-200§! §H$pop$§! £pop£ §HDân cư§!"

 cara_deal_expired.tooltip:0 "$TRIGGER_FAIL$§RThương vụ này bị hủy rồi. Xin lỗi nhé!§!"

 fleet1getback:0 "Bây giờ không được, lát nữa bạn quay lại nhé?"
 fleet1getbackreply:0 "Tất nhiên rồi. Trước khi rời khỏi lãnh thổ của bạn, chúng tôi nhất định sẽ liên lạc lại. Nhưng đến lúc đó, nội dung giao dịch có thể sẽ khác đi đấy..."

 cara_fleet1_redeals.title:0 "$cara_fleet1_contact.title$: §YLời Đề nghị Cuối cùng§!"
 fleet1redealdesc1:0 "Bạn thực sự định để cơ hội ngàn năm có một này trôi qua lãng phí vậy sao?"
 fleet1redealdesc2:0 "Dù chúng ta sắp phải chia xa, nhưng bạn có thể giữ mãi mãi sản phẩm tuyệt mỹ của chúng tôi."
 fleet1redealdesc3:0 "Nếu bạn không làm vụ này thì đúng là sai lầm quá lớn. Căng não ra mà suy nghĩ kỹ lại đi."
 fleet1redealdesc4:0 "Khách hàng thân mến, hay tôi nên gọi là người bạn thân mến? Chúng tôi đang chuẩn bị rời khỏi vùng đất của bạn. Xin hỏi bạn có hứng thú nghía qua các sản phẩm của chúng tôi một lần cuối không? Dĩ nhiên sẽ không phải là lần cuối cùng đâu, sau này chúng tôi sẽ còn ghé qua nữa."
 fleet1redealdesc5:0 "Đây là cơ hội cuối cùng rồi, đơn hàng được đo ni đóng giày thiết kế riêng cho bạn đấy! Chắc chắn bạn sẽ thích!"

 cara.1002.title:0 "Đã tiêu diệt $NAME_Caravaneer_Fleet1_country$"
 cara.1002.desc:1 "Chúng ta đã đập tan cái đám lừa đảo chóp bu $NAME_Caravaneer_Fleet1_country$ đó! Các mặt hàng kém chất lượng và lời lẽ xu nịnh của bọn chúng sẽ không còn được xả rác vào hệ sao này nữa."
 cara.1003.title:0 "$NAME_Caravaneer_Fleet1_country$ Bị Tiêu Diệt"
 cara.1003.desc:1 "Chúng ta vừa được tin $NAME_Caravaneer_Fleet1_country$ đã đóng cửa hệ thống cửa hàng di động của chúng ngay lập tức, vì tổ chức Thương đoàn này đã bị quét sạch hoàn toàn."

 # Fleet 2
 cara_fleet2_contact.title:1 "§YHạm đội Thương đoàn:§! Giáo đoàn Tôn thờ Của cải"
 fleet2contact1:1 "[Root.GetSpeciesNamePlural], những kẻ bề tôi hèn mọn này vô cùng kinh sợ khi được đứng ở đây. Chúng tôi là Giáo đoàn Tôn thờ Của cải, một hội thương nhân thấp kém sùng bái Nữ thần Của cải Numa. Chúng tôi từng bị đuổi khỏi thiên đường vì lòng tham, vì thế hiện tại chúng tôi đã tẩy rửa tâm hồn và từ bỏ mọi nhu cầu vật chất trần tục.\n\n$fleet2contact_explanation$"
 fleet2contact2:1 "Cầu phúc cho bạn, [Root.GetSpeciesNamePlural]. Chúng tôi là Giáo đoàn Tôn thờ Của cải, những tín đồ trung thành của Nữ thần Của cải Numa, chúng tôi đến từ nơi sâu thẳm của vũ trụ, mang đến cho bạn những món hàng thiêng liêng nhất.\n\n$fleet2contact_explanation$"
 fleet2contact3:1 "Chao ôi, [Root.GetSpeciesNamePlural]! Ngọn gió tài lộc cuối cùng cũng đưa tôi đến được bến bờ xinh đẹp của ngài. Chúng tôi là Giáo đoàn Tôn thờ Của cải, những người hầu trung thành của Nữ thần Của cải Numa, chúng tôi mang đến cho ngài những món hàng được Nữ thần ban phước.\n\n$fleet2contact_explanation$"
 fleet2contact4:1 "Ngày mới tốt lành, [Root.GetSpeciesNamePlural]. Chúng tôi là Giáo đoàn Tôn thờ Của cải, chúng tôi đem đến những món hàng linh thiêng được Nữ thần Của cải Numa che chở. Người luôn thì thầm bên tai chúng tôi rằng, tại hệ sao [Root.Capital.GetStarName] xa xôi tồn tại một nền văn minh độc lập, cùng chung sức chúng ta có thể tạo nên những kỳ tích vô song.\n\n$fleet2contact_explanation$"
 fleet2contact5:1 "[Root.GetSpeciesNamePlural]! Ý chỉ thần thánh đã đưa chúng tôi tới vùng đất của bạn, chúng tôi mang đến cho bạn vô vàn những điều kỳ diệu. Chúng tôi là Giáo đoàn Tôn thờ Của cải, những giao dịch của chúng tôi không bao giờ là vì tư lợi cá nhân, mà là tuân theo ý chỉ của Nữ thần Của cải.\n\n$fleet2contact_explanation$"
 fleet2contact6:1 "Không ngờ tất cả những điều này đều là sự thật, các ngài đúng là phồn vinh như những gì Nữ thần Numa đã tiên tri. Tục ngữ có câu, sự giàu có chỉ mỉm cười với kẻ dũng cảm.\n\nChúng tôi là Giáo đoàn Tôn thờ Của cải, những thương nhân thuần túy, dâng hiến trọn vẹn thể xác và tinh thần cho Nữ thần Của cải.\n\n$fleet2contact_explanation$"
 fleet2contact_explanation:1 "Hạm đội của chúng tôi dong buồm theo ngọn gió lộc tài, để rồi nguồn năng lượng linh thiêng đó đã soi đường dẫn lối chúng tôi tới lãnh thổ của ngài.\n\nChỉ cần đóng góp một chút đỉnh thôi, mọi kỳ quan của vũ trụ sẽ thuộc về quý vị.\n\nMọi giao dịch vui lòng thanh toán bằng Năng lượng..."
 fleet2contact1notinborder:0 "[Root.GetSpeciesNamePlural], những kẻ bề tôi hèn mọn này vô cùng kinh sợ khi được đứng ở đây. Chúng tôi là Giáo đoàn Tôn thờ Của cải, một hội thương nhân thấp kém sùng bái Nữ thần Của cải Numa. Chúng tôi từng bị đuổi khỏi thiên đường vì lòng tham, vì thế hiện tại chúng tôi đã tẩy rửa tâm hồn và từ bỏ mọi nhu cầu vật chất trần tục.\n\n$fleet2contact_explanation_notinborder$"
 fleet2contact2notinborder:0 "Cầu phúc cho bạn, [Root.GetSpeciesNamePlural]. Chúng tôi là Giáo đoàn Tôn thờ Của cải, những tín đồ trung thành của Nữ thần Của cải Numa, chúng tôi đến từ nơi sâu thẳm của vũ trụ, mang đến cho bạn những món hàng thiêng liêng nhất.\n\n$fleet2contact_explanation_notinborder$"
 fleet2contact3notinborder:0 "Chao ôi, [Root.GetSpeciesNamePlural]! Ngọn gió tài lộc cuối cùng cũng đưa tôi đến được bến bờ trù phú của ngài. Chúng tôi là Giáo đoàn Tôn thờ Của cải, những người hầu trung thành của Nữ thần Của cải Numa, chúng tôi mang đến cho ngài những món hàng được Nữ thần ban phước.\n\n$fleet2contact_explanation_notinborder$"
 fleet2contact4notinborder:0 "Ngày mới tốt lành, [Root.GetSpeciesNamePlural]. Chúng tôi là Giáo đoàn Tôn thờ Của cải, chúng tôi đem đến những món hàng linh thiêng được Nữ thần Của cải Numa che chở. Người luôn thì thầm bên tai chúng tôi rằng, tại hệ sao [Root.Capital.GetStarName] xa xôi tồn tại một nền văn minh độc lập, cùng chung sức chúng ta có thể tạo nên những kỳ tích vô song.\n\n$fleet2contact_explanation_notinborder$"
 fleet2contact5notinborder:0 "[Root.GetSpeciesNamePlural]! Ý chỉ thần thánh đã đưa chúng tôi tới vùng đất của bạn, chúng tôi mang đến cho bạn vô vàn những điều kỳ diệu. Chúng tôi là Giáo đoàn Tôn thờ Của cải, những giao dịch của chúng tôi không bao giờ là vì tư lợi cá nhân, mà là tuân theo ý chỉ của Nữ thần Của cải.\n\n$fleet2contact_explanation_notinborder$"
 fleet2contact6notinborder:0 "Không ngờ tất cả những điều này đều là sự thật, các ngài đúng là phồn vinh như những gì Nữ thần Numa đã tiên tri. Tục ngữ có câu, sự giàu có chỉ mỉm cười với kẻ dũng cảm.\n\nChúng tôi là Giáo đoàn Tôn thờ Của cải, những thương nhân thuần túy, dâng hiến trọn vẹn thể xác và tinh thần cho Nữ thần Của cải.\n\n$fleet2contact_explanation_notinborder$"
 fleet2contact_explanation_notinborder:0 "Hạm đội của chúng tôi dong buồm theo ngọn gió lộc tài, để rồi nguồn năng lượng linh thiêng đó đã soi đường dẫn lối chúng tôi tới lãnh thổ của ngài, mang đến cho chúng tôi những món hàng mới mỗi lần đặt chân đến.\n\nĐáng tiếc thay, hiện tại toàn bộ tàu của chúng tôi đang nằm ngoài khu vực của quý vị. Nhưng trong lần viếng thăm tới, chỉ cần đóng góp một chút đỉnh thôi. Mọi kỳ quan của vũ trụ sẽ thuộc về quý vị."

 cara_fleet2_main.title:0 "$cara_fleet2_contact.title$"
 fleet2hewwo1:1 "Tới đây, [Root.GetSpeciesNamePlural]! Hãy uống ngụm nước Của Cải trào lên từ Giếng Thánh Tôn Thờ Tiền Bạc, bảo đảm ngài sẽ không bao giờ cảm thấy khát nữa."
 fleet2hewwo2:1 "Hãy bước theo dấu chân của Năng lượng, [Root.GetSpeciesNamePlural], nó sẽ soi đường dẫn lối cho ngài đi tới chân lý. Chẳng có món hàng nào thiêng liêng hơn những món hàng mang theo ý chí của Nữ thần Numa..."
 fleet2hewwo3:1 "Numa, mỉm cười khi của cải lưu thông."
 fleet2hewwo4:1 "Thế mà ngài gọi là công bằng sao!? Ngài đang phỉ báng Numa đấy!\n\nỒ, có khách này! Rất xin lỗi vì đã để ngài phải chứng kiến cảnh tượng vừa rồi. Khung cảnh ban nãy đã chứng minh rất rõ rằng có những kẻ không hề xứng đáng được phát tài."
 fleet2hewwo5:1 "Rất nhiều hàng hóa thượng hạng đã lọt vào tay chúng tôi, nhưng chúng tôi chưa bao giờ giữ lại thứ gì. Đây là sự hy sinh của chúng tôi, vì mục tiêu hoàn thành Tassatar vĩ đại, cũng như để thế hệ con cháu chúng tôi có thể một lần nữa nhìn thấy vùng Đất Thánh."
 fleet2hewwo6:1 "Của cải là gánh nặng của linh hồn, [Root.GetSpeciesNamePlural]. Hãy để chúng tôi san sẻ gánh nặng đó thay ngài."
 fleet2hewwo7:1 "Gì cơ? Phải đóng thuế hàng hóa á? Trời đất ơi, ngài làm vậy là đang sỉ nhục Numa đấy."
 fleet2hewwo8:1 "Bất kỳ vật phẩm tiến cống nào cho Numa cũng sẽ nhận lại được phần thưởng gấp mười lần trong tương lai. Bạn ạ, ngài tiêu xài càng ít thì tổn thất càng lớn đấy."
 fleet2hewwo9:1 "Lại đây nào, đừng ngại! Hãy xem qua những món hàng của chúng tôi, rồi quỳ gối phủ phục trước Numa đi."
 fleet2hewwo10:1 "[Root.GetSpeciesNamePlural], ngài biết không? Kèo làm ăn ngon rồi cũng sẽ tìm đến tay người mua đích thực của nó. Ngài định tham gia vào vụ làm ăn thần thánh này chứ?"
 fleet2hewwo11:0 "Kẻ ham tài ắt sẽ được tài lộc chiếu cố. Hãy cứ để tiền bạc của ngài lưu thông liên tục, có như vậy thì sự giàu sang mới tích tụ không ngừng."

 cara_fleet2_deals.title:0 "$cara_fleet2_contact.title$"
 fleetdeal_explanation:0 "\n\nNhư thường lệ, nếu ngài cần thời gian suy nghĩ, chúng tôi sẽ nhắc nhở trước khi rời khỏi lãnh thổ của ngài, cho ngài thêm một cơ hội nữa để tiếp nhận sự hào phóng của Nữ thần."
 # shrine
 fleet2dealdesc1:1 "Ngài có nghe thấy không? Tiếng tiền xu kêu leng keng. Đúng thế đấy [Root.GetSpeciesNamePlural], tôi nhìn thấy của cải đang ồ ạt đổ về phía ngài.\n\nNuma đang vô cùng hãnh diện khi trưng ra một bệ thờ cổ trên một trong các thế giới của ngài. Bệ thờ cổ đó sẽ mang lại cho ngài những của cải vượt xa sức tưởng tượng. $fleetdeal_explanation$"
 # thralls
 fleet2dealdesc2:1 "Đem bọn [fleet2_recent_pop_species.GetName] lên đây. Trên con đường hành hương băng qua các hệ sao, chúng tôi đã cứu rỗi rất nhiều linh hồn lầm lạc...\n\nHãy nhìn giống loài ưu tú này xem, chúng đã hấp thụ phương thức quản lý của Giáo đoàn Tôn Thờ Tiền Bạc. Thấy tận sâu trong [fleet2_recent_pop_species.GetMouthName] của nó không? Màu sắc này cho thấy đó là một cá thể cực kỳ khỏe mạnh. Chúng cũng rất thạo làm việc chân tay. Hơn nữa khả năng sinh sản của chúng vô cùng xuất sắc. Ngài thấy sao? $fleetdeal_explanation$"
  # edict
 fleet2dealdesc3:1 "Hãy tắt máy thu hình đi, tưởng tượng xem ngài đang lơ lửng giữa dòng thác Năng lượng cuồn cuộn, và thứ sắp sửa chạm tới chính là một ngọn núi tràn ngập Năng lượng.\n\nSở hữu công nghệ ảnh ảo hình ảnh của Giáo đoàn chúng tôi, ngài sẽ sớm hiểu ra rằng sức mạnh ý chí vượt lên trên mọi sức mạnh trên cõi đời này. Năng lượng sẽ đổ dồn về phía ngài tự nhiên như nước chảy chỗ trũng, và ngài sẽ vĩnh viễn được giải thoát khỏi những ham muốn trần tục. $fleetdeal_explanation$"
  # technology
 fleet2dealdesc4:0 "Mô thức của các dòng năng lượng... Chúng tồn tại ở khắp mọi nơi, nhưng chẳng ai có thể thấy được bằng mắt thường. Đích thân Numa có thể dự đoán được dòng chảy thần thánh này cũng như sự luân chuyển của toàn bộ thị trường chứng khoán. Chỉ cần ngài nguyện đóng góp đôi chút, chúng tôi sẽ truyền thụ lại cho ngài một phần nhỏ bé trong trí tuệ vô biên của Người. $fleetdeal_explanation$"
 # Official
 fleet2dealdesc5:0 "Xin phép được giới thiệu một trong những lãnh tụ tinh thần vĩ đại nhất của chúng tôi, sở hữu năng lực tư duy siêu việt cùng nhãn quan có thể nhìn thấu mọi sự, Shakva Cấp 9. Dưới sự dẫn dắt của Nữ thần, công việc làm ăn của ngài sẽ vô cùng thịnh vượng.\n\nCòn chúng tôi chỉ mong ngài đóng góp một khoản nho nhỏ... $fleetdeal_explanation$"
  # Crystals for pops
 fleet2dealdesc6:0 "Kính thưa [Root.GetSpeciesNamePlural], chúng tôi sẽ trao cho ngài một thỏa thuận đặc biệt... Numa cho rằng thần dân của ngài rất có tiềm năng, và sẵn lòng chào đón một bộ phận con dân của ngài về phụng sự dưới trướng. Để đền đáp, Người sẽ dâng tặng những viên pha lê vô giá... $fleetdeal_explanation$"
 # Cruiser
 fleet2dealdesc7:0 "Đây là Ơn huệ của Của Cải, con tàu cảnh giới mà chúng tôi tin tưởng nhất... Nó được đích thân Nữ thần tuyển chọn để hộ tống những kiện hàng được ban phước của chúng tôi băng qua các hệ sao, và từng đánh lui vô số lũ vô đạo - cướp biển, dị giáo, quái vật hư không, và bất cứ kẻ nào dám ngáng đường con đường thiêng liêng của Numa! Cho tới nay, nó vẫn gần như mới tinh không tì vết...\n\nĐúng thế, nó từng hết lòng phục vụ cho của cải, và giờ đây chỉ cần một khoản quyên góp cỏn con, nó cũng có thể phục vụ cho ngài... $fleetdeal_explanation$"
 # Districts for Machines
 fleet2dealdesc8:0 "Xin thứ lỗi cho sự đường đột này, nhưng chúng tôi nhận thấy hành tinh §Y[fleet2deal8planet.GetName]§! của ngài sở hữu một tiềm năng độc đáo chưa từng được khai phá. Chúng tôi có thể mở một khe nứt thông xuống tận tâm trái đất thiêng liêng của nó, của cải sẽ từ đó ùn ùn trào ra!\n\nHãy để chúng tôi hé lộ bí mật ẩn giấu trên hành tinh của ngài. Đương nhiên rồi, chúng tôi cần một khoản thù lao tượng trưng. $fleetdeal_explanation$"
 fleet2deal8.tooltip:0 "Nhận được: $mod_district_generator_max_add$: §G+3§!\n$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+2§!"
 # MI Upkeep mod
 fleet2dealdesc9:0 "Cầu mong Nữ thần Numa linh thiêng phù hộ cho ngài, [Root.GetSpeciesName]. Nữ thần đã chỉ cho chúng tôi cách đồng bộ hóa tốt hơn các cỗ máy của ngài với từ trường của §Y[fleet2deal9planet.GetName]§!. Bằng §GDải từ tính của Giáo đoàn Tôn thờ Của cải§! linh thiêng và đã được đăng ký bản quyền của chúng tôi, đám phi cơ không người lái của ngài trên §Y[fleet2deal9planet.GetName]§! sẽ giảm thiểu sự phụ thuộc vào £energy£ §Y$energy$§!.\n\nĐể đáp lại, chúng tôi muốn tổ chức một nghi lễ tế thần trên lãnh thổ của ngài. Ngài thấy thế nào? $fleetdeal_explanation$"
 # Decision
 fleet2dealdesc10:0 "Một vị giáo sĩ của chúng tôi trong lúc thiền định đã được Numa giáng thế nhập hồn, và thốt ra những lời thì thầm nhanh chóng và mơ hồ về ý chỉ của Nữ thần. Dù vị giáo sĩ ấy không thể sống sót qua bài thử thách này, nhưng chúng tôi đã phân tích được hàm ý trong lời nói của cô ấy, từ đó lấy được một thuật toán có thể biến các số 1 và 0 thành hàng triệu đô la.\n\nĐừng để sự hy sinh của cô ấy trở nên vô ích, [Root.GetSpeciesNamePlural]. Hãy đưa của cải vào tâm Trái Đất của ngài, và cô ấy sẽ không bao giờ ruồng bỏ các ngài. $fleetdeal_explanation$"
 # Repeatable options
 fleet2dealdesc11:1 "Hãy để Numa soi rọi tâm hồn ngài đi, [Root.GetSpeciesNamePlural], Người sẽ biết được ngài đang cần gì. Chờ đã... đáp án cho câu hỏi của ngài lúc này đang hiện ra trước mắt tôi. Có, tôi có thể nhìn thấy rồi!"
 fleet2dealdesc11.a:0 "$fleet2dealdesc11$\n\nĐáp án là... một con tàu cảnh giới khác, đúng chứ?"
 fleet2dealdesc11.b:0 "$fleet2dealdesc11$\n\nĐáp án là... Khí đốt Ngoại lai, có phải không? Hừm... thật là một mùi hương ngây ngất! Đó chính là mùi của thành công! Hít một hơi thật sâu, ngài sẽ được tận mắt chiêm ngưỡng dung mạo trang nghiêm của Numa. Nhưng cẩn thận nhé, hít nhiều quá có thể hỏng cơ hoành đấy."
 fleet2dealdesc11.c:0 "$fleet2dealdesc11$\n\nĐương nhiên rồi! Đáp án là... Năng lượng... Lúc nào cũng là Năng lượng. Tiền bạc có thể xoay chuyển càn khôn. Cứ quăng tiền vào vấn đề của ngài đi, rồi vấn đề đó sẽ biến mất tăm. Tán dương Numa!"
 # minor artifacts
 fleet2dealdesc12:1 "Dưới sự dẫn dắt của Numa, chúng tôi phát hiện ra những món cổ vật này mang lại rất nhiều cảm hứng cho quá trình thiền định của chúng tôi.\n\nViệc phải rời xa chúng chắc chắn sẽ khiến chúng tôi vô cùng đau lòng, nhưng chúng tôi cho rằng [Root.GetSpeciesNamePlural] các ngài có thể thu thập được rất nhiều tri thức thông qua việc nghiên cứu chúng.\n\nChúng tôi cần một số vật tư cao cấp, vậy nên có lẽ chúng ta có thể tiến hành một giao dịch...? $fleetdeal_explanation$"
 cara_fleet2_deal:0 "Đưa tôi xem bạn định đem gì ra để đổi trước đã."
 cara_fleet2_take_deal:0 "Chốt!"
 cara_fleet2_dealtaken:0 "Cầu phúc cho ngài, [Root.GetSpeciesNamePlural], cuộc giao dịch giữa chúng ta đã kéo chúng ta đến gần hơn với Numa."
 cara_fleet2_exit:0 "$cara_fleet1_exit$"

 fleet2getback:1 "Bây giờ không được. Xin quay lại sau."
 fleet2getbackreply:0 "Vậy cũng được, [root.GetSpeciesNamePlural], chúng tôi sẽ liên lạc lại với ngài khi rời khỏi lãnh thổ của ngài. Nhưng ngài nên nhớ, Numa là một vị nữ thần rất hay thay đổi. Nếu Người đổi ý, thì giao dịch của chúng ta có thể sẽ bị thay đổi theo đấy..."

 cara_fleet2_redeals.title:0 "$cara_fleet2_contact.title$: §YLời Đề nghị Cuối cùng§!"
 fleet2redealdesc1:1 "Bỏ lỡ một cơ hội đầu tư, đó sẽ là sai lầm lớn nhất mà ngài phạm phải đấy, anh bạn của tôi. Ngài chắc chắn mình có thể gánh vác nổi cái giá phải trả khi từ chối lời đề nghị của chúng tôi chứ? Đây là cơ hội cuối cùng trước khi chúng tôi rời khỏi lãnh thổ của ngài đấy."
 fleet2redealdesc2:1 "Numa là một vị nữ thần rất hào phóng. Khi chúng tôi vừa định rời đi, Người đã nhắc nhở chúng tôi [Root.GetSpeciesNamePlural]! Nhất định phải cho họ cơ hội cuối cùng trong đời trước khi rời đi!"
 fleet2redealdesc3:1 "Thường thì số phận của ngài đã được định đoạt từ những lựa chọn nhỏ nhặt nhất. Đầu tư một chút ở chỗ này, một chút ở chỗ kia, rồi sẽ đến một ngày thu về một khoản lợi nhuận khổng lồ. Những giọt nước nhỏ nhoi cuối cùng cũng sẽ hội tụ thành đại dương mênh mông.\n\nĐịnh mệnh đã an bài cho chúng tôi trao cho ngài một cơ hội lựa chọn nữa trước khi rời đi."
 fleet2redealdesc4:1 "A, [Root.GetSpeciesNamePlural], ngài có nghe thấy lời kêu gọi của Numa không? Chúng tôi sắp sửa rời khỏi lãnh thổ của ngài rồi, nhưng trước hết, xin hỏi ngài đã suy xét kỹ về thỏa thuận của chúng ta chưa?\n\nHãy suy nghĩ thật thấu đáo nhé, đây có thể là lựa chọn giúp ngài một bước lên mây, hoặc nếu không sẽ đẩy ngài tới vực thẳm diệt vong, ngài sẽ chọn thế nào?"
 fleet2redealdesc5:1 "[Root.GetSpeciesNamePlural]. Chúng tôi sẽ sớm rời khỏi lãnh thổ của ngài. Chúng tôi sẽ để cho số Năng lượng trong vũ trụ soi đường chỉ lối cho chúng tôi tiến lên. Ngài đã suy nghĩ về lời đề nghị của chúng tôi chưa?"
 fleet2product1_tooltip:1 "Kích hoạt công trình §G+1§! §YĐiện thờ Tôn thờ Của cải§!, công trình này sẽ mang lại khối tài sản khổng lồ cho hành tinh mà bạn đã chọn."
 fleet2product2_tooltip:1 "§G200§! $NAME_Caravaneer_Fleet2_species_plural$ £pop£ §HDân Cư§! đến [Root.Capital.GetName]."
 fleet2product3_tooltip:1 "§G+1§! Sắc lệnh §YCông nghệ Hình ảnh Tôn thờ Của cải§!."
 fleet2product4_tooltip:1 "§G+1§! Công nghệ §YMô hình Dữ liệu Tôn thờ Của cải§!"
 fleet2product5_tooltip:1 "Một viên Quan hành chính §Gkỹ năng Cấp 3§!, được Nữ thần Của cải ban phước, hiện đã gia nhập [Root.GetName]."
 fleet2product6_tooltip:2 "Bạn đã đổi §R100§! £pop£ §HDân cư§! để lấy £rare_crystals£ §G200§! §Y$rare_crystals$§!"
 fleet2product7_tooltip:0 "§G+1§! §Y$caravaneer_cruiser_01$§!"
 fleetproduct10_tooltip:0 "§G+1§! Nghị quyết §YThực thi Thuật toán Thần thánh§!"

 cara.2002.title:0 "Đã tiêu diệt $NAME_Caravaneer_Fleet2$"
 cara.2002.desc:0 "Sau những hành động thù địch diễn ra tại [From.From.solar_system.GetName], [From.From.GetName] rất vui mừng được báo cáo với chúng ta rằng $NAME_Caravaneer_Fleet2_fleet$ đã bị phá hủy.\n\nNhững thương nhân $NAME_Caravaneer_Fleet3_species$ từng vang bóng một thời giờ đây chỉ còn là một đống rác vũ trụ. Những kẻ đạo đức giả đó sẽ không bao giờ xuất hiện trước mặt chúng ta nữa."
 cara.2003.title:0 "$NAME_Caravaneer_Fleet2$ Đã bị Tiêu diệt"
 cara.2003.desc:0 "Tin tức đã truyền tới [Root.Capital.GetName], theo báo cáo thì $NAME_Caravaneer_Fleet2_fleet$ đã bị tiêu diệt hoàn toàn.\n\nSau khi có cuộc đụng độ thù địch với [From.GetName], những thương nhân $NAME_Caravaneer_Fleet2_species$ lừng lẫy một thời giờ chỉ còn là một đống rác vũ trụ.\n\nThật xui xẻo cho Nữ thần Của cải mà bọn chúng hằng phục vụ."
 cara.2003.a:0 "Thật đáng tiếc."
 cara_fleet2_contacted:0 "$cara_fleet1_contacted$"

 # Fleet 3
 cara_fleet3_contact.title:0 "§YHạm đội Thương đoàn:§! Công ty Công nghiệp Racket"
 fleet3contact1:1 "[Root.GetSpeciesName]! Chào mừng các bạn. Chúng tôi là nhân viên điều hành của $NAME_Caravaneer_Fleet3$, trực thuộc $NAME_Caravaneer_Home$.\n\nChúng tôi du hành xuyên qua vũ trụ bao la. Chúng tôi lưu giữ lại từng tia sáng vì sao. Chúng tôi thu thập. Chúng tôi giao thương!\n\n$fleet3contact_explanation$"
 fleet3contact2:0 "Xin chào, [Root.GetSpeciesNamePlural], $NAME_Caravaneer_Fleet3$ xin gửi lời chào tới các bạn! Chúng tôi là những nhà buôn lữ hành xuyên không gian khởi hành từ $NAME_Tradestation_Tungle$.\n\n$fleet3contact_explanation$"
 fleet3contact3:0 "Thật tuyệt khi được gặp bạn, [Root.GetSpeciesName]. Dù của cải đang chất đống, nhưng linh hồn bạn lại trống rỗng, phải không? Chúng tôi cảm nhận được điều đó, chúng tôi đến đây để tiến hành giao dịch với bạn, những món hàng chúng tôi mang theo đều rất tuyệt vời.\n\nChúng tôi là $NAME_Caravaneer_Fleet3$, những nhà buôn đến từ $NAME_Caravaneer_Home$.\n\n$fleet3contact_explanation$"
 fleet3contact_explanation:0 "Chúng tôi đến lãnh thổ của các bạn với một tầm nhìn hòa bình, chúng tôi chỉ muốn buôn bán chút thôi, §HKhè!§!, chúng tôi sẽ cung cấp cho các bạn những mặt hàng hảo hạng, những thỏa thuận ưng ý. Trước khi đi chúng ta sẽ còn gặp lại.\n\nNếu quý vị có bất kỳ yêu cầu gì với chúng tôi, $NAME_Caravaneer_Home$ nhất định sẽ có mặt ngay khi được gọi."
 cara_fleet3_contacted:0 "$cara_fleet1_contacted$"
 cara_fleet3_exit:0 "$cara_fleet1_exit$"
 fleet3contact1notinborder:1 "[Root.GetSpeciesName]! Chào mừng các bạn. Chúng tôi là nhân viên điều hành của $NAME_Caravaneer_Fleet3$, trực thuộc $NAME_Caravaneer_Home$.\n\nChúng tôi du hành xuyên qua vũ trụ bao la. Chúng tôi lưu giữ lại từng tia sáng vì sao. Chúng tôi thu thập. Chúng tôi giao thương!\n\n$fleet3contact_explanation_notinborder$"
 fleet3contact2notinborder:0 "Xin chào, [Root.GetSpeciesNamePlural], từ $NAME_Caravaneer_Fleet3$ xin gửi lời chào tới các bạn! Chúng tôi là những nhà buôn lữ hành xuyên không gian khởi hành từ $NAME_Tradestation_Tungle$.\n\n$fleet3contact_explanation_notinborder$"
 fleet3contact3notinborder:0 "Thật tuyệt khi được gặp bạn, [Root.GetSpeciesName]. Dù của cải đang chất đống, nhưng linh hồn bạn lại trống rỗng, phải không? Chúng tôi cảm nhận được điều đó, chúng tôi đến đây để tiến hành giao dịch với bạn, những món hàng chúng tôi mang theo đều rất tuyệt vời.\n\nChúng tôi là $NAME_Caravaneer_Fleet3$, những nhà buôn đến từ $NAME_Caravaneer_Home$.\n\n$fleet3contact_explanation_notinborder$"
 fleet3contact_explanation_notinborder:0 "Chúng tôi đã đi qua khu vực của các bạn. Muốn mua chút gì đó, hay bán lại chút gì đó! Chúng tôi có thể mang lại những vụ làm ăn béo bở, hàng hóa thì nhiều vô kể. Ây da, tàu của chúng tôi đột nhiên bị lạc mất rồi, §HKhè hà!§! Chúng tôi sẽ còn quay lại, lúc đó chúng ta sẽ tiếp tục đàm phán.\n\nNếu bạn muốn liên lạc với chúng tôi, $NAME_Caravaneer_Home$ sẽ đưa ra phản hồi."

 cara_fleet3_main.title:0 "$cara_fleet3_contact.title$"
 fleet3hewwo1:0 "Tôi nói rồi. Hãy chỉnh lại bộ chuyển đổi năng lượng sang chế độ phụ đi. Không, không phải cái bộ chuyển đổi năng lượng đó! §HKhè!§! Chẳng nhẽ việc gì cũng phải đến tay tôi sao?\n\nỒ! Khách đến rồi! Xin chào mừng. Chúng tôi có rất nhiều hàng tốt cực hiếm. Băng qua cả ngàn tinh tú chỉ để trao tận tay bạn một cách an toàn!"
 fleet3hewwo2:0 "Bạn thích Hợp kim không, §HKhè?§! Bạn thích kim loại hay khí đốt? Nhân công làm việc chăm chỉ? Quặng mỏ quý giá? Tôi biết chắc chắn bạn sẽ hứng thú mà."
 fleet3hewwo3:0 "Ồ, [Root.GetSpeciesNamePlural]. Đây là lô hàng cuối cùng rồi! Bạn hoàn toàn không thể tin được đâu, §HKhè!§! Bên trong mấy cái thùng này chứa đủ các loại vũ khí. Vũ khí nhiều đến không đếm xuể. Lại đây xem đi."
 fleet3hewwo4:0 "Đúng là không nên tin bọn chúng, không nên làm ăn với bọn chúng. Lũ [scammer_country.GetSpeciesNamePlural] bẩn thỉu! §HKhè!§!\n\nỒ, [Root.GetSpeciesNamePlural]. Xin gửi lời chào tới ngài, ngài có sẵn lòng làm ăn với chúng tôi không?"
 fleet3hewwo5:0 "Đây đâu phải là mấy món đồ cổ rách nát gì đâu, đây là đồ cổ thứ thiệt đấy! Thử nghĩ mà xem, §HKhè§!. Nó đã tồn tại qua bao nhiêu thế kỷ rồi. Và sẽ còn tiếp tục tồn tại mãi mãi!"
 fleet3hewwo6:0 "Rỉ sét á? Rỉ sét chỗ nào?\n\nỒ, cái đó chỉ cần cạo đi là xong. Cạo, cạo, cạo. Mới tinh ngay lập tức!"
 fleet3hewwo7:0 "$NAME_Ketlings$? Có, chúng tôi biết họ chứ. Trước đây chúng tôi từng là anh em cùng cội. Nhưng đó là chuyện của rất lâu về trước rồi. Họ không thích và cũng chẳng thèm công nhận việc chúng tôi xuất sắc hơn họ, giỏi giang hơn trong việc thu thập, tìm kiếm cũng như cướp bóc. Họ đã đày ải chúng tôi. Bắt chúng tôi phải lang thang vô định giữa khoảng không vũ trụ!\n\nNhưng không sao cả. Giờ đây chúng tôi đã trở nên hùng mạnh hơn, kể cả khi không có bọn họ."
 fleet3hewwo8:0 "[Root.GetSpeciesName] hãy nhìn những Điểm số đó của ngài xem. Chúng sắp nổ tung ra mất rồi! Hãy để chúng tôi giúp ngài vơi bớt một phần gánh nặng nhé. Hãy để chúng tôi phụ một tay."

 cara_fleet3_deals.title:0 "$cara_fleet3_contact.title$"
 fleet3dealdesc1:0 "Chúng tôi còn có cả quặng nữa, những viên quặng lấp lánh dồi dào. Quặng có thể thắp sáng cả màn đêm! Những quặng mỏ tỏa sáng này được đặc biệt chuẩn bị cho [Root.GetName].\n\nNhưng chúng tôi đang rất đói, chúng tôi rất khát! Làm ơn hãy cho chúng tôi [Root.GetFleet3ScaledCostDeal1], chúng tôi sẽ dùng [Root.GetFleet3ScaledProductDeal1] để hỗ trợ cho công nhân của ngài."
 fleet3dealdesc2:0 "Chúng tôi có một Lãnh đạo, không thể phù hợp hơn cho [Root.GetName]! [Root.GetFleet3ProductDeal2]\n\nHãy đưa cho chúng tôi [Root.GetFleet3CostDeal2], Lãnh đạo này sẽ thuộc về bạn!"
 fleet3dealdesc3:1 "Chúng tôi có thể cung cấp công nhân cho ngài, những người khuân vác, những người kéo lê, những người dọn dẹp đồ đạc! Khỏe mạnh. Nhanh nhẹn. Hãy đưa cho chúng tôi £alloys£ §R2000§! $alloys$, chúng tôi sẽ cử §G300§! £pop£ Dân cư $NAME_Caravaneer_Fleet3_species$ tới hành tinh của bạn.\n\nCái gì cơ? Tiền án tiền sự á? Mấy cái mớ giấy vụn đó e là chúng tôi không tìm thấy rồi, §HKhè!§!"
 fleet3dealdesc3machi:2 "Chúng tôi có thể cung cấp công nhân cho ngài, những người khuân vác, những người kéo lê, những người dọn dẹp đồ đạc! Khỏe mạnh. Nhanh nhẹn. Hãy đưa cho chúng tôi £alloys£ §R2000§! $alloys$, chúng tôi sẽ cử §G300§! £pop£ Dân cư $NAME_Caravaneer_Fleet3_robot$ tới hành tinh của bạn.\n\nCái gì cơ? Tiền án tiền sự á? Ấy dà mấy cái tài liệu vô dụng đó chúng tôi không tìm thấy nữa rồi, §HKhè!§!"
 fleet3dealdesc4:0 "Nhìn này. [Root.GetFleet3ProductDeal4][Root.GetFleet3CostDeal4]"
 fleet3dealdesc5:1 "Chúng tôi có đồ ngon ở đây này, ngài xem đi, bản thiết kế! Nó là một công trình cực kỳ tiên tiến, cực kỳ đặc biệt. Một §G$building_waste_reprocessing_center$§!, có thể biến xỉ than và phế liệu của ngài thành Năng lượng dòng cao và khoáng sản hữu ích.\n\nNhưng mà chúng tôi cần... nhân công. Trên bệ khai thác 715-B vừa xảy ra một tai nạn thương tâm, §HKhè!§! Hãy giao cho chúng tôi §R300§! £pop£ Dân cư §H$pop_cat_worker$§!, chúng tôi sẽ giao lại bản vẽ công trình này cho các ngài."
 fleet3dealdesc5_gesta:2 "Chúng tôi có đồ ngon ở đây này, ngài xem đi, bản thiết kế! Nó là một công trình cực kỳ tiên tiến, cực kỳ đặc biệt. Một §G$building_waste_reprocessing_center$§!, có thể biến xỉ than và phế liệu của ngài thành Năng lượng dòng điện cao và khoáng sản hữu ích.\n\nNhưng mà chúng tôi cần... nhân công. Trên bệ khai thác 715-B vừa xảy ra một tai nạn thương tâm, §HPhù!§! Hãy giao cho chúng tôi §R300§! £pop£ Dân cư §H$pop_cat_simple_drone$§!, chúng tôi sẽ giao lại bản vẽ công trình này cho các ngài."
 fleet3dealdesc6:0 "Chúng tôi có một thỏa thuận đặc biệt dành cho ngài. Một công nghệ độc quyền, chỉ được chế tạo bởi duy nhất $NAME_Caravaneer_Fleet3$!\n\nKhông biết ngài có đang đau đầu vì hệ thống phòng thủ hành tinh không, không biết làm cách nào để xuyên thủng hệ thống đó? Chúng tôi sẽ mang đến cho ngài một công nghệ cực kỳ cực kỳ đặc biệt và tiên tiến, chuyên dùng để cường hóa các đợt oanh tạc, chúng tôi gọi nó là §G$ORBITAL_TRASH_1$§!!\n\nHãy trao cho chúng tôi [Root.GetFleet3CostDeal6]. Chúng tôi sẽ hướng dẫn ngay lập tức phương pháp cho các bạn, §HKhè!§! Tàu của bạn sẽ sớm được nâng cấp trang thiết bị."
 fleet3dealdesc7:1 "Chúng tôi đã để mắt tới trạm khai thác trên quỹ đạo §Y[fleet3deal7planet.GetName]§! của ngài. Nó đang khai thác Năng lượng, đúng không? Chúng tôi có thể giúp một tay. Chúng tôi sẽ tặng cho ngài một vệ tinh, nó sử dụng công nghệ tối tân nhất! Chúng tôi gọi nó là §G$racket_energy_extractor$§!!\n\nNó sẽ nằm lại trên quỹ đạo, đồng thời gia tăng lượng £energy£ §Y$energy$§! mà ngài thu được từ bề mặt của §Y[fleet3deal7planet.GetName]§!.\n\n[Root.GetFleet3CostDeal7]"
 fleet3dealdesc8:1 "Ngài đang cần §Y$energy$§!, đúng không? Để những tia lửa điện bùng nổ trong hàng triệu mạch điện dùng để vận hành tộc của ngài? Chúng tôi có thể giúp.\n\nChúng tôi có thể dùng §G$racket_generator_regulator$§! để nâng cấp cho các §Y[technician_drone.GetNamePlural]§! của ngài, tăng thêm hai mươi lăm phần trăm hiệu suất hoạt động của §Y$district_generator_plural$§! của ngài! Chỉ cần ngài đưa cho chúng tôi chút lợi lộc, chúng tôi sẽ triển khai những thiết bị này lên §Y[fleet3deal8planet.GetName]§!.\n\n[Root.GetFleet3CostDeal8]"
 fleet3dealdesc9:1 "Chúng tôi có một con tàu! Một §G$destroyer$§!: rất ngon, rất nhanh, rất khỏe! Trang bị tận răng! Tuyệt đối không phải vì lý do gì mờ ám mới muốn vứt nó đi đâu, tuyệt đối không! Không có thời gian để thợ máy của các ngài kiểm tra kỹ nó đâu, §HKhè khè!§! Ngài muốn có con tàu này, đúng không?\n\nCứ giao cho chúng tôi £minerals£ §R2000§! $minerals$, con tàu sẽ là của ngài."
 cara_fleet3_deal:0 "Bạn có thể đưa ra mức giá bao nhiêu?"
 cara_fleet3_take_deal:0 "Tuyệt vời. Chúng tôi chấp nhận lời đề nghị của bạn."
 #cara_fleet3_take_deal.tooltip: "cara_fleet3_deal.tooltip"
 cara_fleet3_dealtaken:0 "Rất vui và vinh hạnh khi được hợp tác làm ăn với [Root.GetName]. Chúng tôi sẽ còn trở lại!"

 fleet3deal1cost1:0 "£food£ §R200§! $food$"
 fleet3deal1cost2:0 "£food£ §R1000§! $food$"
 fleet3deal1cost3:0 "£food£ §R4000§! $food$"
 fleet3deal1product1:0 "£minerals£ §G200§! $minerals$"
 fleet3deal1product2:0 "£minerals£ §G500§! $minerals$"
 fleet3deal1product3:0 "£minerals£ §G2000§! $minerals$"
 fleet3deal2product1:0 "Một kỹ sư: Bàn tay khéo léo, tư duy nhạy bén. Rất giỏi khoản chia chác và dây nhợ!"
 fleet3deal2product2:0 "Một quản trị viên có khả năng tổ chức hoàn hảo! Cực kỳ thông minh, tầm nhìn xa trông rộng. Rất thích đi dạo trên bãi biển!"
 fleet3deal2cost1:0 "£energy£ §G300§!$energy$"
 fleet3deal2cost2:0 "£food£ §R200§!$food$"
 fleet3deal2cost3:1 "£consumer_goods£ §R150§! §Y$consumer_goods$§!"
 fleet3deal4cost1:0 "Nếu bạn có thể đổi cho chúng tôi £sr_dark_matter£ §R15§!§Y$sr_dark_matter$§!."
 fleet3deal4cost2:1 "Nếu các bạn đưa cho chúng tôi £rare_crystals£ §R55§! §Y$rare_crystals$§!."
 fleet3deal4cost3:0 "Nếu bạn có thể cung cấp cho chúng tôi £sr_zro£ §R15§!§Y$sr_zro$§!."
 fleet3deal4product1:0 "Thứ hợp kim này. Độ nặng này. Độ bóng này. Ánh sáng này! Bạn đã bao giờ thấy loại hợp kim nào như thế chưa? Sức chịu uốn cong khó tin. Chuẩn hàng cao cấp nhất. Không lẫn chút tạp chất nào. Chúng tôi có thể cảm nhận được nó. Nó đang vẫy gọi bạn.\n\nChúng tôi có thể cung cấp cho bạn £alloys£ §G2000§!§Y$alloys$§!,"
 fleet3deal4product2:0 "Mớ khí đốt ngoại lai này, tuyệt phẩm đấy! Để tiện vận chuyển, chúng tôi đã nén chúng lại đến mức tối đa. Nhưng cẩn thận nhé, chúng rất không ổn định! Chắc chắn bạn muốn có loại nhiên liệu này phải không? Nạp cho lá chắn? Hay cho đại bác? Giờ chúng là của bạn.\n\nChúng tôi có thể cung cấp cho bạn £exotic_gases£ §G150§!§Y$exotic_gases$§!,"
 fleet3deal4product3:0 "Loại kim loại này không ngừng chuyển động, uốn lượn, tái cấu trúc, §HKhè!§! Bản thân chúng tôi cũng đã tìm ra rất nhiều công dụng của nó. Chắc chắn bạn cũng sẽ dùng được việc.\n\nChúng tôi có thể cung cấp cho bạn £sr_living_metal£ §G40§!§Y$sr_living_metal$§!,"
 fleet3deal2product1_tooltip:0 "Một §HQuan Khoa học§! §GCấp 3§! tham gia [Root.GetName]"
 fleet3deal2product2_tooltip:0 "Một §HQuản trị viên§! §GCấp 3§! tham gia [Root.GetName]"
 fleet3deal5cost_tooltip:1 "§R-300§! £pop£ Dân số §H$pop_cat_worker$§!"
 fleet3deal5cost_gesta_tooltip:1 "§R-300§! £pop£ Dân số §H$pop_cat_simple_drone$§!"
 fleet3deal5product_tooltip:0 "Mở khóa ['building:building_waste_reprocessing_center']!"
 fleet3deal3product_tooltip:2 "§G300§! £pop£ Dân số §H$NAME_Caravaneer_Fleet3_species$§! đến [fleet3deal3planet.GetName]"
 fleet3deal3product_machi_tooltip:2 "§G300§! £pop£ Dân số §H$NAME_Caravaneer_Fleet3_robot$§! đến [fleet3deal3planet.GetName]"
 fleet3deal6cost1:0 "£energy£ §R1000§!$energy$"
 fleet3deal6cost2:0 "£minerals£ §R300§!$minerals$"
 fleet3deal6cost3:0 "£consumer_goods£ §R800§!§Y$consumer_goods$§!"
 fleet3deal7cost1:0 "Giờ là lúc bàn chuyện thù lao. Chúng tôi đang có chút xích mích với... vài cơ quan thực thi pháp luật. Vài chuyện vặt vãnh thôi. Không đáng bận tâm. Nhưng chúng tôi cần vài người làm chứng, cần sự giúp đỡ, vài người tử tế chống lưng cho chúng tôi! Những con người mạnh mẽ và thông thái như các bạn có sẵn lòng đứng ra bảo lãnh cho những thương nhân đáng thương chúng tôi không, rất đáng tin, rất vô tội, chúng tôi chỉ vô tình làm sai tí tẹo, thế mà bị bọn quản lý dòm ngó, §HKhè§!."
 fleet3deal7cost2:0 "Đưa cho chúng tôi £exotic_gases£ §R15§!§Y$exotic_gases$§!, và chúng tôi sẽ triển khai vệ tinh ngay lập tức!"
 fleet3deal7cost3:0 "Chúng tôi sẽ triển khai vệ tinh này cho các bạn! Với điều kiện các bạn đưa trước cho chúng tôi £consumer_goods£ §R100§!§Y$consumer_goods$§!."
 fleet3deal8cost1:0 "§R300§!§Y$consumer_goods$§!."
 fleet3deal8cost2:0 "Giờ là lúc bàn chuyện thù lao. Chúng tôi đang có chút xích mích với... vài cơ quan thực thi pháp luật. Vài chuyện vặt vãnh thôi. Không quan trọng. Nhưng chúng tôi cần người làm chứng, cung cấp chút hỗ trợ. Những con người mạnh mẽ và thông thái như các bạn có sẵn lòng đứng ra bảo lãnh cho những thương nhân đáng thương chúng tôi không, rất đáng tin, rất vô tội, chúng tôi chỉ vô tình làm sai tí tẹo, thế mà bị bọn quản lý dòm ngó, §HKhè§!."
 fleet3deal9.tooltip:0 "§G+1§!§Y$caravaneer_destroyer_01$§!"

 fleet3getback:0 "$fleet1getback$"
 fleet3getbackreply:0 "Vậy khi nào chuẩn bị rời đi chúng tôi sẽ liên lạc lại với các bạn. Nhưng đến lúc đó điều kiện giao dịch có thể sẽ khác đấy!"

 cara_fleet3_redeals.title:0 "$cara_fleet3_contact.title$: §YLời Đề nghị Cuối cùng§!"
 fleet3redealdesc1:0 "Bạn đã nghĩ kỹ chưa? Đã đắn đo cẩn thận chưa? Đã đổi ý chưa? §HKhè!§!"
 fleet3redealdesc2:0 "Còn lâu lắm chúng tôi mới quay lại chỗ [Root.GetSpeciesAdj] đấy. Bạn đừng bỏ lỡ cơ hội này."
 fleet3redealdesc3:0 "Mua đi! Mua đi! Mua đi! Mua đi!"
 fleet3redealdesc4:0 "Chúng tôi có thể đọc được suy nghĩ của bạn. Vụ làm ăn này cứ lởn vởn trong đầu bạn. Nó đang gọi tên bạn, tôi nói đúng chứ?"
 fleet3redealdesc5:0 "[Root.GetSpeciesNamePlural]! Chúng tôi chuẩn bị rời đi rồi đây. Vụ làm ăn này vẫn còn hiệu lực, hàng hóa vẫn còn nguyên vẹn! Đừng bỏ qua cơ hội này! §HKhè!§!"

