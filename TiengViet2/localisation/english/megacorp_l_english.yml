 # Other
 action.96.name:0 "§HSự ra đời của Thị trường Thương mại Toàn Ngân hà§!"
 action.96.desc:0 "Kể từ lúc chúng ta nhận ra mình không hề đơn độc trong cõi vũ trụ này, hoạt động giao thương vật chất thực tế không bị tác động bởi quan hệ ngoại giao vẫn luôn tồn tại. Cùng với việc đường biên giới của hệ sao không ngừng được nới rộng, các tuyến đường buôn bán cũ cũng liên tục được vẽ lại, giới lãnh đạo liên sao đồng thuận rằng nên §Yhợp pháp hóa thị trường giao thương này§!, để tất cả mọi người cùng được hưởng lợi.\n\nTrong vài năm tới, các thương nhân tư nhân và cơ quan chính phủ sẽ hợp tác xây dựng một trung tâm thương mại tiệm cận quy mô thiên hà. Nếu trung tâm này được đặt trên lãnh thổ [Root.GetAdj], chúng ta chắc chắn sẽ vớ bở, thế nên chúng ta có thể §Yquảng bá một hành tinh của mình§! để ứng cử cho vị trí đó."
 action.96.desc.corp:1 "Hỡi những người tiêu dùng, khách hàng và những gã nhà quê chốn liên sao, cuối cùng chúng ta cũng đã sẵn sàng đón nhận một nền tảng bán tập trung để tiến hành hoạt động thương mại quốc tế quy mô vừa phải, được quản lý lỏng lẻo.\n\nChúng ta có thể §Yđề cử một hành tinh của chúng ta§! trở thành trung tâm thương mại, qua đó tối đa hóa thu nhập tiềm năng."
 action.96.desc.phobe:0 "Thật đáng tiếc, chúng ta vẫn chưa thể giáng đòn mạnh mẽ vào §Yhoạt động giao thương phi pháp với các xã hội dị chủng§!. Và cũng đáng buồn thay, chính cái thị trường giao thương ẩn danh gần như không bị ảnh hưởng bởi quan hệ ngoại giao này lại mang đến những khoản lợi nhuận kếch xù.\n\nTrong vài năm tới, giới thương nhân tư nhân và chính phủ sẽ cố gắng lập nên một trung tâm thương mại liên sao chung. Việc điều hành trung tâm này hẳn sẽ có ích hơn nhiều so với chuyện găm hàng ngoại lai, vì vậy chúng ta có thể §Yđề cử một hành tinh của mình§! làm ứng viên đăng cai."
 action.96.desc.homicidal:0 "Dù chẳng mấy ai chịu giao dịch trực tiếp với chúng ta, nhưng giữa biển sao này vẫn luôn tồn tại một chợ đen hoạt động sầm uất, và cuối cùng thì chúng ta cũng có thể lợi dụng nó."
 action.96.a:0 "Bắt đầu giao thương thôi!"
 action.96.b:0 "Đã rõ."
 action.96.c: "Thành viên của chúng ta sẽ được hưởng lợi thực tế từ việc này."
 action.97.name:0 "$action.96.name$"
 action.97.desc:0 "$action.96.desc$"
 action.97.desc.corp:0 "$action.96.desc.corp$"
 action.97.desc.phobe:0 "$action.96.desc.phobe$"
 enable_decision_market_nomination:0 "§HMở khóa Quyết định:§! Đề cử Trung tâm Thị trường Thương mại Toàn Ngân hà"
 action.99.name:0 "§HThị trường Thương mại Toàn Ngân hà§!: Đã thành lập tại [market_founder_planet.GetStarName]"
 action.99.desc:0 "Chiến dịch quảng bá của chúng ta cho [market_founder_planet.GetName] đã đơm hoa kết trái, các tài phiệt thương mại quyết định sẽ tập trung phần lớn hoạt động làm ăn tại hệ sao [market_founder_planet.GetStarName]!"
 action.1000.name:0 "§HThị trường Thương mại Toàn Ngân hà§!: Không thể thành lập"
 action.1000.desc:0 "Đáng tiếc thay, động thái thiết lập Thị trường Thương mại Toàn Ngân hà của chúng ta đã §Yvấp phải trở ngại lớn§!. Mặc dù chúng ta đã vận động thành công ý chí chính trị ủng hộ dự án này, nhưng lại chẳng nhận được bất kỳ đề cử địa điểm đăng cai hợp lệ nào.\n\nVề nguyên tắc, các nhà vận động thương mại và lực lượng chính trị ủng hộ đều đồng tình với ý tưởng này, và thề sẽ nỗ lực gấp đôi, chỉ cần [global_event_country.GetGalCommunityOrGalImperium] muốn thử lại lần nữa."
 action.1000.a:0 "Chúng ta hãy cùng chờ xem."
 action.1005.desc:0 "Có vẻ như quy mô thị trường của thiên hà không thể gánh vác nổi tham vọng chính trị của nó. Việc thiếu vắng các đề cử chủ nhà hợp lệ đã khiến những nỗ lực xây dựng một trung tâm giao dịch chuyên biệt của [global_event_country.GetGalCommunityOrGalImperium] dạo gần đây đổ sông đổ biển.\n\nNhững người ủng hộ kế hoạch Thị trường Thương mại Toàn Ngân hà lập tức tuyên bố chẳng có gì phải xấu hổ cả, và khẳng định rằng một khi [global_event_country.GetCommunityOrImperium] cảm thấy thời cơ đã chín muồi, họ sẽ tiếp tục đệ trình kiến nghị này."
 action.1005.desc.phobe:0 "Quy mô thị trường của [global_event_country.GetGalCommunityOrGalImperium] không thể gánh vác nổi tham vọng chính trị của nó, bởi lẽ những nỗ lực gần đây của họ nhằm hình thành một Thị trường Thương mại Toàn Ngân hà thống nhất đều đã §Yđổ sông đổ biển§!. Rốt cuộc, cái dự án được đám dị chủng tung hô hết lời này lại chẳng kiếm nổi một đề cử đăng cai hợp lệ nào.\n\nNhững kẻ ủng hộ kế hoạch thì chối bay chối biến, không chịu thừa nhận rằng tư tưởng 'hợp tác' của đám người ngoài hành tinh chỉ là trò tự vả. Trái lại, họ một mực khẳng định rằng, nếu các thành viên trong hệ sao thấy thời cơ đã chín muồi, thì có thể thử lại lần nữa."
 action.1005.a.phobe:0 "Thật ngạo mạn."
 action.101.name:0 "§HThị trường Thương mại Toàn Ngân hà§!: Đã thành lập"
 action.101.desc:1 "Trung tâm Thương mại Toàn Ngân hà đã được thiết lập tại hệ sao §Y[galactic_market_station.solar_system.GetName]§!, nằm trong biên giới [From.GetName]. Chính quyền [From.GetAdj] đã chính thức công nhận tính hợp pháp của thị trường này, tài nguyên giờ đây đã có thể được mua bán thông qua một bên thứ ba trung lập."
 action.101.desc.phobe:0 "Bọn dị chủng §Y[From.GetName]§! tâm địa khó lường đã lập ra một khu chợ chuyên buôn bán hàng hóa ngoại lai. Mặc dù chúng ta khinh khỉnh không thèm đếm xỉa tới, nhưng cánh cửa của khu chợ này vẫn luôn rộng mở chào đón chúng ta."
 action.101.desc.homicidal:0 "$action.96.desc.homicidal$"
 action.103.name:0 "§HThị trường Thương mại Toàn Ngân hà§!: Đã chuyển địa điểm"
 action.103.desc:0 "Sau khi mất liên lạc với trung tâm cũ, các tập đoàn thương mại liên sao đã quyết định chọn lãnh thổ của chúng ta để đặt trạm không gian mới."
 action.106.name:0 "§HThị trường Thương mại Toàn Ngân hà§!"
 action.106.desc:0 "Thông qua các mối liên kết mới, chúng ta đã lấy được quyền mua bán tài nguyên qua Thị trường Thương mại Toàn Ngân hà. Điều này chắc chắn sẽ trở thành cú hích cho nền kinh tế [Root.GetAdj]."
 action.106.desc.phobe:0 "Chúng ta được biết lũ dị chủng tởm lợm đã lập ra một thị trường liên sao để buôn bán hàng hóa ngoài hành tinh. Dù chúng ta chẳng buồn dây dưa, nhưng cánh cửa thị trường ấy vẫn luôn mở rộng đón chúng ta."
 action.106.desc.homicidal:0 "$action.96.desc.homicidal$"
 established_galactic_market_station:1 "§H$galactic_market_station$§! đã được thành lập tại hệ sao §Y[galactic_market_station.solar_system.GetName]§!\n\n"

 distar.305.rare_crystals:0 "[Root.GetName] vừa phát hiện một loại tài nguyên chiến lược mới ở [FromFrom.GetName], mang tên §H$rare_crystals$§!. Những tinh thể này có đặc tính nhiễu xạ tuyệt vời, cực kỳ phù hợp để chế tạo linh kiện điện tử hoặc hệ thống vũ khí laser."
 distar.305.exotic_gases:0 "[Root.GetName] vừa phát hiện một loại tài nguyên chiến lược mới ở [FromFrom.GetName], mang tên §H$exotic_gases$§!. Chủng khí đốt này không chỉ dùng trong tác chiến mà thậm chí có thể được xài như một loại chất kích thích tiêu khiển."
 distar.305.volatile_motes:0 "[Root.GetName] vừa phát hiện một loại tài nguyên chiến lược mới ở [FromFrom.GetName], mang tên §H$volatile_motes$§!. Những hạt vi trần này một khi được kích hoạt hóa học sẽ giải phóng một lượng lớn động năng trong vụ nổ, nghe đồn nếu đem nấu ăn thì sẽ rất cay."

 decision_market_nomination:0 "Đề cử Trung tâm Thị trường Thương mại Toàn Ngân hà"
 decision_market_nomination_effects:1 "Dựa vào tình hình địa phương, thêm Hệ số điều chỉnh §YĐiểm Cạnh tranh Thị trường Cơ bản§! cho hành tinh. Điểm càng cao, hành tinh càng dễ được §HThị trường Thương mại Toàn Ngân hà§! chọn trúng.\n\nTốt nhất nên đề cử một hành tinh có sản lượng thương mại cao để tăng cơ hội trúng tuyển."
 decision_market_nomination_effects_short:0 "Đề cử hành tinh này làm ứng viên cho vị trí trung tâm §HThị trường Thương mại Toàn Ngân hà§!."
 decision_market_nomination_desc:0 "Trở thành đầu não giao thương của cả hệ sao quả là danh lợi vẹn toàn. Chợ búa thì biến hóa khôn lường, nhưng chỉ cần tung đủ tiền trợ cấp, biết đâu chúng ta có thể dụ dỗ các ông trùm thương mại đến đóng rễ trên hành tinh này."
