 CORP_PEACE_REFUSE_03:0 "[From.GetSpeciesName], rất tiếc không thể chốt kèo với ngài được. Cuộc chiến này đang mang lại cho chúng tôi cả đống tiền."
 CORP_PEACE_REFUSE_04:0 "Tiếc quá, [From.GetSpeciesNamePlural]. Chúng tôi vẫn chưa áp đảo hoàn toàn cái đội quân rệu rã của các người mà."
