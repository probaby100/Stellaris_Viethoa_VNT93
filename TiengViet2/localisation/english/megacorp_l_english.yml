 mega.100.name:0 "Thánh Địa: §RBị Vấy bẩn§!"
 mega.100.desc:1 "Chúng ta đã đánh mất Cổ vật Thiêng liêng trong hệ sao [From.GetName]!\n\nNỗi đau buồn và mất mát trĩu nặng bao phủ các thuộc địa của [Root.GetAdj]. Không giống như việc một hành tinh bị tuyên bố mất đi sự che chở của thần linh, hành động dẫm đạp và chối bỏ đức tin bằng bạo lực tàn nhẫn này đã khiến các tín đồ của [Root.GetName] rơi vào bàng hoàng và lạc lối. Các giáo sĩ đã quyết định tổ chức quốc tang 5 năm."

