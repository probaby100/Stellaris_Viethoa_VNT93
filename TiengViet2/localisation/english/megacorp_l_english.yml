 district_hive_plural:0 "Đặc khu Quần thể"
 district_hive_desc:0 "Nơi các cá thể tập trung lại để hấp thụ dưỡng chất dưới những ngọn tháp cao chót vót khi không làm việc."
 district_nexus:0 "Đặc khu Trung tâm"
 district_nexus_plural:0 "Đặc khu Trung tâm"
 district_nexus_desc:1 "Các cá thể được điều khiển và triển khai đến nơi làm việc đều xuất phát từ những khu vực tập trung này."
 district_industrial:0 "Đặc khu Công nghiệp"
 district_industrial_plural:0 "Đặc khu Công nghiệp"
 district_industrial_desc:0 "Đặc khu này chằng chịt các cơ sở luyện kim và nhà máy, chuyên chế tác nguyên liệu thô thành các sản phẩm tinh vi."
 district_resort: "Đặc khu Nghỉ dưỡng"
 district_resort_plural: "Đặc khu Nghỉ dưỡng"
 district_resort_desc: "Các khu nghỉ mát, nơi an dưỡng và tụ điểm giải trí, cung cấp mọi thứ cần thiết để thư giãn, xả hơi và trốn tránh thực tại."
 district_resort_1: "Đặc khu Thắng cảnh"
 district_resort_1_plural: "Đặc khu Thắng cảnh"
 district_resort_1_desc: "Một không gian tràn đầy sức sống, nơi những trải nghiệm tuyệt vời được nhào nặn, những kỷ niệm quý giá lặng lẽ đơm hoa, và vô vàn điều kỳ diệu đang chờ bạn khám phá."
