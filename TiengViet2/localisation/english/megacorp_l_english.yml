 building_temple_of_prosperity_desc:0 "Một ngôi đền được canh gác cẩn mật, nơi truyền bá những lời răn của Siêu Giáo hội đã dựng nên nó."
 building_executive_retreat:0 "Khu Nghỉ dưỡng Cao cấp"
 building_executive_retreat_desc:0 "Khu nghỉ mát xa hoa dành riêng cho giới chóp bu của tập đoàn. Họ có thể thưởng thức hương vị văn hóa địa phương trong một môi trường được bảo vệ nghiêm ngặt."
 building_xeno_tourism_agency:0 "Đại lý Du lịch Ngoại hành tinh"
 building_xeno_tourism_agency_desc:0 "Đại lý này tung ra hàng loạt chiến dịch quảng bá cho các tour du lịch liên sao, đồng thời đưa ra những chế độ đãi ngộ và phần thưởng béo bở để chèo kéo người nhập cư chuyển đến vùng không gian của tập đoàn."

 building_underground_chemists:0 "Xưởng Hóa chất Ngầm"
 building_underground_chemists_desc:1 "Nằm sâu dưới những khu vực hẻo lánh, các phòng thí nghiệm ngầm này gần như vô hình từ trên bề mặt. Các tay thợ hóa học làm việc ngày đêm để bào chế ra những loại chất cấm gây nghiện với lợi nhuận khổng lồ."
 building_wrecking_yards:0 "Bãi Rã tàu"
 building_wrecking_yards_desc:0 "Nơi những con tàu bị đánh cắp hoặc cướp bóc được mổ xẻ thành đống sắt vụn. Mọi linh kiện và hợp kim có giá trị đều được bòn mót một cách cẩn thận."
 building_underground_clubs:0 "Hộp đêm Ngầm"
 building_underground_clubs_desc:0 "Những tụ điểm bất hợp pháp này có thể thỏa mãn mọi dục vọng đen tối của khách hàng. Khi màn đêm buông xuống, chúng bắt đầu hoạt động sôi nổi ở những ngóc ngách nhớp nhúa nhất trên hành tinh."
 building_pirate_haven:0 "Sào huyệt Hải tặc"
 building_pirate_haven_desc:0 "Một thành phố ẩn khuất trên bề mặt, nơi những gã hải tặc và du côn tụ tập để sửa chữa chiến hạm, và dĩ nhiên là cả ăn chơi trác táng."
 building_smuggling_rings:0 "Cảng Buôn lậu"
 building_smuggling_rings_desc:0 "Sân bay vũ trụ trái phép này hàng ngày tuồn ra một lượng lớn hàng cấm. Nhờ vị trí khuất mắt và những khoản hối lộ hậu hĩnh, nó vẫn nằm ngoài tầm ngắm của pháp luật."
 building_wildcat_miners:0 "Trại Khai mỏ Lậu"
 building_wildcat_miners_desc:0 "Hoạt động khai thác mỏ này vừa bất hợp pháp vừa vô cùng nguy hiểm. Những kẻ bần cùng bán mạng ở đây để ôm mộng đổi đời sau một đêm."
 building_bio_reprocessing_facilities:0 "Trung tâm Tái chế Hữu cơ"
 building_bio_reprocessing_facilities_desc:0 "Những cơ sở ngầm này chuyên chế biến những nhân viên phản trắc và đủ loại vật chất hữu cơ tởm lợm khác thành những hộp thức ăn ăn liền."
 building_syndicate_outreach_office:0 "Công ty Vỏ bọc của Băng đảng"
 building_syndicate_outreach_office_desc:0 "Những cơ sở kinh doanh mang lớp áo hợp pháp này chính là bức bình phong hoàn hảo che đậy các hoạt động phi pháp của công đoàn tội phạm địa phương."
 building_illicit_research_labs:0 "Phòng Thí nghiệm Lậu"
 building_illicit_research_labs_desc:1 "Những nghiên cứu tột cùng cấm kỵ đang âm thầm được tiến hành bên trong các phòng thí nghiệm bí mật này."
 building_subversive_shrine:0 "Điện thờ Tà giáo"
 building_subversive_shrine_desc:0 "Nơi tụ họp và thực hành các nghi lễ quái gở của những kẻ cuồng tín."
 building_private_security: "Công ty An ninh Tư nhân"
 building_private_security_desc: "Khác với lực lượng an ninh công cộng, công ty tư nhân này chỉ tập trung vào việc duy trì trật tự và bảo vệ thân chủ mà gạt phăng đi những vướng mắc đạo đức rườm rà."
 building_industrial_subsidiary: "Công ty Con Công nghiệp"
 building_industrial_subsidiary_desc: "Một nhà cung cấp độc lập chuyên tuồn các linh kiện ngoại lai cho các nhà sản xuất nhà nước với mức giá rẻ như bèo."

 building_corporate_monument:0 "Đài Tưởng niệm Doanh nghiệp"
 building_corporate_monument_desc:0 "Nơi được dựng lên để tôn vinh và duy trì thứ văn hóa doanh nghiệp đặc thù của hành tinh, đảm bảo mọi phi vụ làm ăn đều trót lọt."
 building_corporate_site:0 "Trung tâm Quản trị Thương mại"
 building_corporate_site_desc:0 "Tại trung tâm này, những quyết sách mang tính sống còn đối với văn hóa thương mại của hành tinh sẽ được chiến lược hóa, đồng thời trải qua các bài kiểm tra tiềm thức gắt gao từ đội ngũ chuyên gia nhân lực có trí tuệ."
 building_corporate_forum:0 "Diễn đàn Hợp tác"
 building_corporate_forum_desc:0 "Một mạng lưới truyền thông siêu quang tốc khổng lồ, dùng để liên kết và đồng bộ hóa văn hóa doanh nghiệp trên hàng triệu chi nhánh hành tinh."
 building_corporate_vault:0 "Kim khố Doanh nghiệp"
 building_corporate_vault_desc:0 "Một kho ngầm đồ sộ vừa đóng vai trò là địa điểm điều phối kinh doanh vừa là bảo tàng công cộng tôn vinh lịch sử phát triển và sinh lời lâu dài của Siêu Tập Đoàn đã xây dựng nên nó."
 building_nanite_transmuter:0 "Máy Chuyển hóa Nano"
 building_nanite_transmuter_desc:3 "Cơ sở này sử dụng vật liệu nano tối tân để sản xuất hàng loạt các loại tài nguyên hiếm. Dây chuyền sẽ bị đình trệ nếu thiếu hụt nguồn cung nano."

 building_hab_major_capital:0 "Trung tâm Kiểm soát Trạm Cư trú"
 building_hab_major_capital_desc:1 "Một bộ máy hành chính phức tạp chuyên điều hành các Trạm Cư trú đông dân."
 building_hab_major_capital_tooltip: "Ô Khu đất Tối đa £mod_planet_max_districts_add£ từ các Thiên thể Lớn: §G+$@hab_districts_per_major_body_tier3|2$§!\n"
 building_hab_system_capital: "Trung tâm Hệ thống Trạm Cư trú"
 building_hab_system_capital_desc: "Một tổ hợp cơ quan đầu não quy mô lớn, nhận trách nhiệm giám sát hành chính cho các Trạm Cư trú chật cứng dân."
 building_hab_system_capital_tooltip: "Ô Khu đất Tối đa £mod_planet_max_districts_add£ từ các Thiên thể Lớn: §G+$@hab_districts_per_major_body_tier4|2$§!\n"
 district_hab_housing:0 "Đặc khu Trạm Cư trú"
 district_hab_housing_plural:0 "Đặc khu Trạm Cư trú"
 district_hab_housing_desc:1 "Đặc khu nhà ở trên Trạm Cư trú, mang đến những không gian sống ấm cúng và khép kín cho cư dân."
 district_hab_commercial:0 "Đặc khu Thương mại"
 district_hab_commercial_plural:0 "Đặc khu Thương mại"
 district_hab_commercial_desc:1 "Một khu thương mại đan xen chằng chịt trên Trạm Cư trú, nơi con buôn và nhân viên bán hàng tất bật chốt đơn."
 district_hab_cultural:0 "Đặc khu Giải trí"
 district_hab_cultural_plural:0 "Đặc khu Giải trí"
 district_hab_cultural_desc:1 "Với một tổ hợp vui chơi hoành tráng thế này trên Trạm Cư trú, ai còn bận tâm tới thế giới tự nhiên ngoài kia cơ chứ?"
 district_hab_energy:0 "Đặc khu Lò phản ứng"
 district_hab_energy_plural:0 "Đặc khu Lò phản ứng"
 district_hab_energy_desc:1 "Đặc khu năng lượng trên Trạm Cư trú sản xuất Năng lượng, đồng thời duy trì nguồn điện cho toàn bộ siêu đô thị."
 district_hab_science:1 "Đặc khu Nghiên cứu"
 district_hab_science_plural:1 "Đặc khu Nghiên cứu"
 district_hab_science_desc:1 "Những đặc khu trên Trạm Cư trú này đóng vai trò như một thỏi nam châm tri thức, quy tụ vô số chuyên gia từ khắp các lĩnh vực khoa học."
 district_hab_industrial:0 "Đặc khu Công nghiệp"
 district_hab_industrial_plural:0 "Đặc khu Công nghiệp"
 district_hab_industrial_desc:0 "Đặc khu này phủ kín các cơ sở sản xuất công nghiệp, nhằm bòn rút tối đa lợi thế của môi trường trọng lực thấp."
 district_hab_mining:0 "$building_hab_astro_mining_facility$"
 district_hab_mining_plural:0 "Khu Khai mỏ Vũ trụ"
 district_hab_mining_desc:1 "$building_hab_astro_mining_facility_desc$"
