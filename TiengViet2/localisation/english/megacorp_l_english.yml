 building_amusement_megaplex:0 "Siêu Tổ hợp Vui chơi"
 building_amusement_megaplex_desc:0 "Một chốn diệu kỳ nơi những ước mơ trở thành hiện thực, tổ hợp vui chơi này cung cấp các dịch vụ giải trí gia đình phù hợp với mọi lứa tuổi và đã được doanh nghiệp kiểm duyệt."
 building_private_mining_consortium:0 "Tập đoàn Khai khoáng Tư nhân"
 building_private_mining_consortium_desc:1 "Một công ty khai khoáng tư nhân thuộc sở hữu của một Siêu Tập Đoàn. Doanh nghiệp này tuyển dụng thợ mỏ địa phương để khai thác của cải trên hành tinh."
 building_food_conglomerate:1 "Chuỗi Thức ăn Nhanh"
 building_food_conglomerate_desc:1 "Tiện lợi, giá bèo, dinh dưỡng hoàn hảo. Không có độc tố*, không rắc rối!\n\n*Thức ăn có thể chứa một lượng nhỏ kali benzoat, axit nitric, vật chất tối, thịt người hoặc hương khói nhân tạo."
 building_public_relations_office:1 "Văn phòng Quan hệ Công chúng"
 building_public_relations_office_desc:1 "Không một tập đoàn lớn nào có thể tránh khỏi những hiểu lầm và nghi ngờ. Việc cởi mở thông tin là vì lợi ích chung, và văn phòng PR này sinh ra chính là để bênh vực cho những yêu sách của giới chủ."
 building_private_research_initiative:0 "Viện Nghiên cứu Tư nhân"
 building_private_research_initiative_desc:1 "Trong những cơ sở tối tân này, các doanh nghiệp công nghệ tư nhân ngày đêm thực hiện những nghiên cứu cốt lõi phục vụ cho công ty mẹ."

