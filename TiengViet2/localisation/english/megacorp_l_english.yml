 col_habitat_leisure: "Trạm Giải trí"
 col_habitat_leisure_desc: "Thành phố lý tưởng ngoài không gian sâu thẳm do con người tạo ra, chuyên dùng cho việc nghỉ ngơi thư giãn và các hoạt động văn hóa."
 col_habitat_trade: "Trạm Thương mại"
 col_habitat_trade_desc: "$col_city_desc$"
 col_habitat_trade_tt: "Những trạm không gian này là đầu mối trung chuyển hàng hóa liên tinh, đồng thời cũng là nơi sang tay những tham vọng thống trị dải ngân hà."
 col_habitat_trade_custom: "§Y$district_hab_housing_plural$§! sẽ thay thế một vị trí [clerk.GetIcon]§Y[clerk.GetName]§! bằng vị trí [trader.GetIcon]§Y[trader.GetName]§!\n"
 col_habitat_fortress: "Trạm Pháo đài"
 col_habitat_fortress_desc: "$col_fortress_desc$"
 col_habitat_fortress_tt: "Pháo đài kiên cố này được vũ trang tới tận răng bằng hàng chục dàn hỏa lực và lá chắn trận mạc, biến không gian quỹ đạo nơi đây thành mồ chôn cho những vị khách không mời mà đến."
 col_arkship_fortress_knights: "Tàu Ark Hiệp Sĩ Đoàn"
 col_arkship_fortress_knights_desc: "Gia tăng £defense_army£§SPhòng thủ§! và §SLực lượng lao động§! của Hiệp Sĩ Đoàn, đồng thời củng cố tàu Ark thành một pháo đài di động."
 col_arkship_fortress_knights_tt: "Chuyển đổi một tàu Ark hùng mạnh thành pháo đài di động của Hiệp Sĩ Đoàn."
 col_habitat_foundry: "Trạm Đúc"
 col_habitat_foundry_desc: "$col_foundry_desc$"
 col_habitat_foundry_tt: "Chuyển hóa vật liệu thô thành hợp kim tinh chế, tiếp nhiên liệu cho hạm đội, siêu cấu trúc, và cả những cỗ máy tham vọng không bao giờ biết thỏa mãn của đế chế."
 col_habitat_foundry_custom:1 "Nếu có thể, §YĐặc khu Công nghiệp§! sẽ chuyển đổi một vị trí sản xuất hàng tiêu dùng thành một vị trí sản xuất hợp kim.\n\n"
 col_habitat_factory: "Trạm Công nghiệp Dân dụng"
 col_habitat_factory_desc: "$col_factory_desc$"
 col_habitat_factory_tt: "Các nhà máy sản xuất tự động trên quỹ đạo đảm bảo cung ứng đủ đầy hàng hóa, cho mọi công dân được ăn no mặc ấm, thỏa mãn với cuộc sống của mình."
 col_habitat_factory_custom:1 "Nếu có thể, §YĐặc khu Công nghiệp§! sẽ chuyển đổi một vị trí sản xuất hợp kim thành một vị trí sản xuất hàng tiêu dùng.\n\n"
 col_habitat_industrial: "Trạm Công nghiệp"
 col_habitat_industrial_desc: "$col_industrial_desc$"
 col_habitat_industrial_tt: "Những xưởng đúc trôi nổi và các dây chuyền lắp ráp trên quỹ đạo liên tục nhả ra vô tận hợp kim và hàng tiêu dùng."
 col_habitat_refinery:0 "Trạm Tinh chế"
