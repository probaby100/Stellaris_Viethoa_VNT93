 CORP_PEACE_CONSIDER_01:1 "Hòa bình ư? Vậy thì chúng ta phải tính toán kỹ lưỡng về mặt lợi ích kinh tế đã."
 CORP_ITOA_SELECT_01:1 "[Root.GetSpeciesNamePlural], lần này các người đã sẵn sàng dốc toàn lực chưa? §Y[From.GetName]§! cứ như trước đây thì không ổn đâu..."
