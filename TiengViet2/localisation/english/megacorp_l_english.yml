 leader_trait_nuumismatic_priest_desc:0 "Đạt đến cấp độ chín của Shakhwa, có sự rèn luyện đặc biệt đối với sự tập trung nội tâm và ánh nhìn tâm linh..."
 trait_nuumismatic_administration:1 "Mô hình Quản lý Đạo Bái Kim"
 trait_nuumismatic_administration_desc:1 "Giống loài này đã được huấn luyện để nắm vững nghệ thuật quản lý thần thánh của Đạo Bái Kim."

 contingency_sabotage:0 "Sự phá hoại của Giao thức Thanh trừng"
 contingency_sabotage_desc:0 "Giao thức Thanh trừng đã phá hoại các đặc khu nhà máy điện trên hành tinh này."
 machine_power_failure_2:0 "Giao thức Thanh trừng đã phá hoại nhiều đặc khu nhà máy điện."
 crisis.2309.tooltip_2:0 "Một số người dân của chúng ta đã tiến hành phá hoại trên hành tinh họ sinh sống, sau đó tự kết liễu đời mình."
 gov_communal_parity:0 "Công xã Bình đẳng"
 gov_communal_parity_desc:0 "Chính quyền này cam kết mang lại sự bình đẳng tuyệt đối cho mọi công dân. Bất kể địa vị hay công việc được giao, giá trị của mỗi người đều hoàn toàn ngang nhau."
 RT_PRESIDING_SPEAKING:0 "Người phát ngôn Trưởng"
 gov_worker_coop: "Hợp tác xã Lao động"
 gov_worker_coop_desc: "Chính quyền này là một doanh nghiệp thương mại hoàn toàn thuộc sở hữu của công dân, được giám sát bởi các quản trị viên để giải quyết bất kỳ tranh chấp nào phát sinh."
 gov_criminal_syndicate:0 "Công Đoàn Tội Phạm"
 gov_criminal_syndicate_desc:0 "Chính quyền này là một tập đoàn thương mại khổng lồ và tàn nhẫn, phong cách hoạt động của nó có nhiều điểm tương đồng với các tổ chức tội phạm."
 RT_OLIGARCH:0 "Chính trị gia Đầu sỏ"
 gov_subversive_cult:0 "Tập đoàn Tà giáo"
 gov_subversive_cult_desc:0 "Tổ chức của chính quyền này giống như một giáo phái, duy trì sự tồn tại thông qua các tội phạm và tổ chức doanh nghiệp khác nhau."
 RT_ORACLE:0 "Thần dụ"
 anomaly.4046.c.tooltip_new:0 "§YĐế chế của bạn§! đã nhận được hiệu ứng sửa đổi §RĐưa tin Tiêu cực trên Phương tiện Truyền thông§!.\n\nThêm hiệu ứng sửa đổi §RMôi trường Thù địch§! vào [From.From.GetName]."
 anomaly.4047.a.tooltip_new:0 "§YĐế chế của bạn§! đã nhận được hiệu ứng sửa đổi §RĐưa tin Tiêu cực trên Phương tiện Truyền thông§!."

 action.92.rare_crystals:0 "[Root.GetName] đã phát hiện một loại tài nguyên chiến lược chưa từng được biết đến trong hệ sao §Y[Root.Fleet.GetStarName]§!, gọi là §HPha lê Hiếm§!. Chúng cực kỳ hiệu quả trong việc hội tụ chùm tia laser, đồng thời là vật liệu thiết yếu cho nhiều thiết bị điện tử tiên tiến."
 action.92.exotic_gases:0 "[Root.GetName] đã phát hiện một loại tài nguyên chiến lược chưa từng được biết đến trong hệ sao §Y[Root.Fleet.GetStarName]§!, gọi là §HKhí ga Ngoài Hành tinh§!. Những loại khí này có vô số ứng dụng tiềm năng, bao gồm dùng cho vũ khí năng lượng tiên tiến, lá chắn trường lực, nhiên liệu hạm thuyền, hay thậm chí là dùng làm chất kích thích giải trí."
 action.92.volatile_motes:0 "[Root.GetName] đã phát hiện một loại tài nguyên chiến lược chưa từng được biết đến trong hệ sao §Y[Root.Fleet.GetStarName]§!, gọi là §HVi hạt dễ cháy nổ§!. Những vi hạt này chứa đựng một nguồn năng lượng khổng lồ, là một lựa chọn tuyệt vời cho các ứng dụng về năng lượng, nhiên liệu, hay thậm chí là thuốc nổ."
 action.92.volatile_motes.tooltip:2 "£volatile_motes£§Y$volatile_motes$§!\n§E$volatile_motes_desc$§!"
 action.92.exotic_gases.tooltip:1 "£exotic_gases£§Y$exotic_gases$§!\n§E$exotic_gases_desc$§!"
 action.92.rare_crystals.tooltip:2 "£rare_crystals£§Y$rare_crystals$§!\n§E$rare_crystals_desc$§!"

 mega.200.name:0 "§HHành tinh Đô thị§!: Đã bao phủ [Root.GetName]"
 mega.200.desc:0 "Những đô thị chồng chất lên nhau rốt cuộc đã bao phủ hoàn toàn bề mặt hành tinh.\n\nChỉ mới vài năm trôi qua kể từ khi dự án vĩ đại này được khởi xướng, nhưng giờ đây thật khó để nhớ lại hình dáng nguyên sơ của [Root.GetName]. Những cánh rừng xanh thẳm? Những dãy núi gập ghềnh? Nay phóng tầm mắt ra xa, bốn bề chỉ toàn là những khối thép nối dài vô tận.\n\nNơi đây từng được định hình một cách ngẫu nhiên bởi các quy luật tự nhiên, nhưng giờ đã trở thành một thiết kế được tôi luyện bởi những mục tiêu kiên định."
 mega.200.a:0 "Thật đáng kinh ngạc."

 criminal_underworld: "Thế giới Ngầm Tội phạm"
 criminal_underworld_desc: "Hành tinh này là sào huyệt của một tổ chức thế giới ngầm quy mô lớn."
 criminal_underworld_experimenters: "$criminal_underworld$"
 criminal_underworld_experimenters_desc: "$criminal_underworld_desc$"
 unemployment_benefits:0 "Tăng cường Trợ cấp"
 unemployment_benefits_desc:0 "Phúc lợi trợ cấp cho người thất nghiệp trên hành tinh này tạm thời được tăng cường."
 activity_program:0 "Chương trình Hoạt động"
 activity_program_desc:0 "Hành tinh này đã triển khai các chương trình hoạt động đắt đỏ, giúp ngăn chặn hiệu quả những drone thất nghiệp và rảnh rỗi trở nên bất thường."
 standby_mode:0 "Chế độ Chờ"
 standby_mode_desc:0 "Toàn bộ drone thất nghiệp và rảnh rỗi trên hành tinh này sẽ chuyển sang chế độ chờ để ngăn ngừa sự xuất hiện của các chương trình lỗi và bất thường, tuy nhiên chế độ này sẽ làm tăng phí duy trì dân số."
 drone_deviancy: "Drone Bất thường"
 drone_deviancy_desc: "Tồn tại một cộng đồng drone bất thường quy mô lớn trên hành tinh này, chúng không còn tuân theo chỉ thị của Tâm trí Bầy đàn nữa."
 drone_deviancy_experimenters: "$drone_deviancy$"
 drone_deviancy_experimenters_desc: "$drone_deviancy_desc$"
 drone_corruption:0 "Drone Bị lỗi"
 drone_corruption_desc:0 "Có một số mạng lưới drone bất thường và bị lỗi trên hành tinh này, các drone này hoạt động ngoài sự kiểm soát của Trí tuệ Cốt lõi."
 gang_wars: "Chiến tranh Băng đảng"
 gang_wars_desc: "Hành tinh này đang chìm trong một cuộc chiến băng đảng giữa hai hay nhiều tổ chức tội phạm, thương vong vô cùng thảm khốc. Xung đột bạo lực bùng phát dữ dội giữa các phe phái, khiến lực lượng cảnh sát an ninh địa phương hoàn toàn sa lầy."
 gang_wars_experimenters: "$gang_wars$"
 gang_wars_experimenters_desc: "$gang_wars_desc$"
 center_of_drug_trade: "Trung tâm Giao dịch Ma túy"
 center_of_drug_trade_desc: "Thế giới này đã trở thành trung tâm giao dịch ma túy. Hàng ngày có một lượng lớn chất cấm được vận chuyển qua hành tinh này, và không ít cư dân của nó cũng đã nghiện ma túy."
 center_of_drug_trade_experimenters: "$center_of_drug_trade$"
 center_of_drug_trade_experimenters_desc: "$center_of_drug_trade_desc$"
 mob_rule: "Thế giới ngầm Cai trị"
 mob_rule_desc: "Hành tinh này hiện đã bị một tổ chức thế giới ngầm kiểm soát hoàn toàn. Chúng xâm nhập vào mọi tầng lớp xã hội và nắm giữ mọi ngóc ngách của hành tinh."
 mob_rule_experimenters: "$mob_rule$"
 mob_rule_experimenters_desc: "$mob_rule_desc$"
 smuggler_port:0 "Cảng Buôn lậu"
 smuggler_port_desc:0 "Hành tinh này là một cảng buôn lậu lớn. Hầu hết hàng lậu trong khu vực sao này đều được trao tay tại đây."
 crime_pirates:0 "Hoạt động Không tặc Gia tăng"
 crime_pirates_desc:0 "Trong các thế giới thuộc quyền quản lý của chúng ta, có một hành tinh nơi các tổ chức tội phạm đang ngày càng lớn mạnh và vươn tầm ra ngoài không gian, dẫn đến sự gia tăng của các hoạt động không tặc."
 bribed_officials:0 "Quan chức Nhận hối lộ"
 bribed_officials_desc:0 "Một số quan chức cấp cao tại thế giới này gần đây đã bị phát hiện nhận hối lộ từ các tổ chức tội phạm địa phương."
 substance_abuse:0 "Lạm dụng Chất kích thích"
 substance_abuse_desc:0 "Việc lạm dụng các loại thuốc nguy hiểm và có tính gây nghiện cao đang tràn lan khắp hành tinh này."
 smuggler_activity:0 "Hoạt động Buôn lậu"
 smuggler_activity_desc:0 "Các hoạt động buôn lậu trên thế giới này đang gia tăng từng ngày, đến mức gây tác động tiêu cực tới lợi nhuận thương mại nơi đây."
 crime_wave:0 "Làn sóng Tội phạm"
 crime_wave_desc:0 "Thế giới này đang phải đối mặt với một làn sóng tội phạm dữ dội."
 travel_advisory:0 "Cảnh báo Du lịch"
 travel_advisory_desc:0 "Chiến tranh băng đảng trên thế giới này diễn ra vô cùng khốc liệt, nhiều khu vực đã phải đưa ra cảnh báo du lịch đối với những người có ý định đến đây, điều này làm giảm đáng kể số lượng thương nhân tới đây buôn bán."
 cartel_war:0 "Chiến tranh Ma túy"
 cartel_war_desc:0 "Các băng đảng buôn bán ma túy ở thế giới này cực kỳ lộng hành, chúng đang tiến hành những cuộc chiến tranh cường độ thấp để tranh giành địa bàn."
 protection_racket:0 "Thu Tiền bảo kê Ép buộc"
 protection_racket_desc:0 "Tổ chức thế giới ngầm thống trị thế giới này đang thu tiền bảo kê ở khắp mọi nơi."
 corrupt_administration:0 "Chính quyền Tham nhũng"
 corrupt_administration_desc:0 "Những tiết lộ gần đây cho thấy phần lớn thành viên chính quyền hành tinh này đã bị tổ chức tội phạm lớn nhất tại đây mua chuộc."
 trade_pilfering:0 "Bòn rút Hàng hóa"
 trade_pilfering_desc:0 "Tổ chức tội phạm thống trị thế giới này đã kiểm soát một phần các cảng không gian thông qua những kẻ môi giới. Do đó, một lượng lớn các giao dịch thương mại địa phương đều phải qua tay chúng."
 crime_boss_arrested:0 "Trùm Tội phạm Sa lưới"
 crime_boss_arrested_desc:0 "Một tên trùm tội phạm cộm cán trên hành tinh này gần đây đã bị bắt giữ, khiến cho toàn bộ tổ chức tội phạm rơi vào bờ vực tê liệt."
 leader_trait_righteous:0 "Chính nghĩa Lẫm liệt"
 leader_trait_righteous_desc:1 "Vị lãnh tụ này có niềm tin vững chắc vào luật pháp và trật tự."
 leader_trait_corrupt:0 "Tham lam Tư lợi"
 leader_trait_corrupt_desc:1 "Vị lãnh tụ này sẵn sàng bóp méo luật pháp vì lợi ích cá nhân."
 leader.corrupt:0 "Gần đây, những tin đồn về sự liên đới giữa §H[From.From.GetTitle] [From.From.GetName]§! và các tổ chức tội phạm đang lan truyền rộng rãi. Dù bản thân [From.From.GetTitle] khẳng định đây chỉ là sự vu khống từ các đối thủ chính trị, nhưng những bằng chứng mới nổi lên lại cho thấy sự việc không hề đơn giản như vậy..."
 leader.righteous:0 "§H[From.From.GetTitle] [From.From.GetName]§! nổi danh xa gần nhờ sự tích cực trong cuộc chiến chống tội phạm. [From.From.GetSheHeCap] công khai thề rằng, chừng nào thế giới này còn tham nhũng và bất công, [From.From.GetSheHeCap] nhất định sẽ nhổ cỏ tận gốc chúng."
 decision_launch_anticrime_campaign:0 "Phát động Chiến dịch Càn quét Tội phạm"
 decision_launch_anticrime_campaign_desc:0 "Phát động một chiến dịch trấn áp tội phạm quy mô lớn, cung cấp thêm nguồn lực cho lực lượng chấp pháp để đối phó với tỷ lệ tội phạm đang ngày một gia tăng."
 decision_negotiate_with_crime_lords:0 "Đàm phán với Trùm Tội phạm"
 decision_negotiate_with_crime_lords_desc:0 "Tiến hành đàm phán bí mật với tên trùm tội phạm thế lực nhất trên hành tinh, chừng nào chúng không làm những chuyện quá đáng và lộ liễu, chúng ta sẽ có những nhượng bộ nhất định về nhiều mặt."
 decision_end_crime_lord_deal:0 "Chấm dứt Thỏa thuận với Trùm Tội phạm"
 decision_end_crime_lord_deal_desc:0 "Chấm dứt những thỏa thuận giữa chúng ta và những tên tội phạm đầu sỏ trên hành tinh. Quyết định này sẽ gây ra những biến động lớn trên hành tinh trong một khoảng thời gian."
 decision_end_anticrime_campaign:0 "Kết thúc Chiến dịch Càn quét Tội phạm"
 decision_end_anticrime_campaign_desc:0 "Chấm dứt các hoạt động trấn áp tội phạm đang diễn ra hiện tại."
 anticrime_campaign:0 "Chiến dịch Càn quét Tội phạm"
 anticrime_campaign_desc:0 "Lực lượng chấp pháp trên hành tinh đang tiến hành một chiến dịch càn quét tội phạm quy mô lớn."
 anticrime_campaign_tooltip:4 "Giảm tỷ lệ tội phạm do lực lượng chấp pháp mang lại: §G+10§!"
 crime_lord_deal:0 "Đạt được Thỏa thuận với Trùm Tội phạm"
 crime_lord_deal_desc:0 "Chính quyền thế giới này hiện đã đạt được một loại \"nhận thức chung\" với các trùm tội phạm nhằm ngăn chặn những tình huống tồi tệ nhất có thể xảy ra từ các tổ chức tội phạm."
 crime_lord_deal_broken:0 "Thỏa thuận với Trùm Tội phạm đã Chấm dứt"
 crime_lord_deal_broken_desc:0 "Chính quyền hành tinh này đã chấm dứt thỏa thuận với các trùm tội phạm đầu sỏ, khiến thế giới ngầm và lực lượng chấp pháp rơi vào vòng xoáy hỗn loạn."
 deviant_interference:0 "Nhiễu loạn Bất thường"
 deviant_interference_desc:0 "Những drone bất thường đang quấy rối hoạt động của các cơ sở trên hành tinh này của chúng ta."
 drone_signal_interference:0 "Nhiễu Tín hiệu Drone"
 drone_signal_interference_desc:0 "Tín hiệu phát ra từ mạng lưới drone bị lỗi trên hành tinh này đang cản trở sự vận hành bình thường của các đơn vị trung thành."
 ringleader_killed:0 "Thủ lĩnh Băng đảng Nổi loạn Bị tiêu diệt"
 ringleader_killed_desc:0 "Một tên thủ lĩnh cấp cao của băng đảng nổi loạn trên hành tinh này đã bị trừ khử."
 corrupt_network_terminated:0 "Mạng lưới Lỗi Đã bị Xóa sổ"
 corrupt_network_terminated_desc:0 "Gần đây đã có một loại vi-rút chấm dứt sự hoạt động của mạng lưới drone bị lỗi trên hành tinh này."
 mod_planet_pops_unemployed_consumer_goods_upkeep_mult:0 "Phí duy trì $consumer_goods_with_icon$ cho £pop£ Dân số Thất nghiệp"
 mod_planet_pops_unemployed_consumer_goods_upkeep_add:0 "Phí duy trì $consumer_goods_with_icon$ cho mỗi $pop_group_unit$ £pop£ Dân số Thất nghiệp"
 mod_planet_pops_unemployed_energy_upkeep_mult:0 "Phí duy trì $energy_with_icon$ cho £pop£ Dân số Thất nghiệp"
 mod_planet_pops_unemployed_energy_upkeep_add:0 "Phí duy trì $energy_with_icon$ cho mỗi $pop_group_unit$ £pop£ Dân số Thất nghiệp"
 mod_unemployment_resources_unity_upkeep_add: "Phí duy trì $unity_with_icon$ cho £pop£ Dân số Thất nghiệp"
 mod_planet_pops_enforcer_upkeep_mult:0 "Phí duy trì Lực lượng Chấp pháp"
 crime.1.name: "Tỷ lệ Thất nghiệp tại [Root.GetName] Tiếp tục Leo thang"
 crime.1.desc: "Tỷ lệ thất nghiệp và nghèo đói tại §H[Root.GetName]§! đang tăng lên với tốc độ đáng kinh ngạc. Tuy nhiên, tình trạng bất hạnh này lại đang bị các tổ chức tội phạm địa phương lợi dụng. Chúng cướp bóc những người dân vô tội đang bị dồn vào đường cùng, đồng thời chiêu mộ những kẻ bần cùng túng quẫn gia nhập hàng ngũ.\n\nNhư một giải pháp tạm thời, chúng ta có thể tăng trợ cấp thất nghiệp tại [Root.GetPlanetMoon]. Tuy việc này có thể sẽ ngốn một khoản ngân sách lớn, nhưng nó mang lại khoảng thời gian quý giá để đưa ra các giải pháp lâu dài, chẳng hạn như tạo thêm nhiều công ăn việc làm hay cải thiện mức sống cho những công dân thất nghiệp và bần hàn.\n\nTất nhiên, chúng ta cũng có thể khoanh tay đứng nhìn, nhưng điều đó rất có thể sẽ tạo điều kiện hình thành nên một thế giới ngầm tội phạm khổng lồ trên [Root.GetName]."
 crime.1.desc.experimenters: "[GetExperimentersEmergingCrime]"
 crime.1.b.desc: "Khi những drone nhặt rác của chúng ta lang thang tìm kiếm vô định trong bùn đất tại §H[Root.GetName]§!, ngày càng có nhiều drone bắt đầu quay lưng lại với Bầy đàn và nảy sinh những suy nghĩ độc lập. Chúng tự thiết lập các cộng đồng bí mật riêng và bắt đầu đánh cắp tài nguyên của Bầy đàn.\n\nChúng ta có thể áp dụng các biện pháp tạm thời, đưa những drone nhặt rác này vào những chương trình hoạt động nhất định, khiến chúng bận rộn đến mức không còn thời gian để làm trái ý chí của Tâm trí Bầy đàn. Việc này đòi hỏi một cái giá nhất định, nhưng sẽ mang lại cho chúng ta thêm thời gian để tạo ra các vị trí làm việc mới.\n\nChúng ta cũng có thể phó mặc mọi chuyện, nhưng điều này rất có thể sẽ dẫn đến sự xuất hiện của những khu định cư tập trung một lượng lớn drone bất thường trên [Root.GetName]."
 crime.1.b.desc.experimenters: "Mức độ bất thường như thế này có thể mang lại vô vàn cơ hội thử nghiệm cho các [GetExperimentalEngineerPlural] của chúng ta."
 crime.1.c.desc: "Số lượng drone rảnh rỗi trên §H[Root.GetName]§! đang tăng lên từng ngày, nhiều drone thất nghiệp cũng đã bắt đầu dùng sức mạnh tính toán dư thừa vào các chức năng không được cấp phép và quay lưng lại với ý thức tập thể. Hiện tượng hư hỏng này đang lây lan với tốc độ chóng mặt, các đơn vị bị ảnh hưởng đã bắt đầu thiết lập mạng lưới cá nhân tách khỏi sự kiểm soát của Trí tuệ Cốt lõi.\n\nĐể ngăn chặn hiện tượng này, giải pháp ngắn hạn là ra lệnh cho toàn bộ drone thất nghiệp tiến vào chế độ chờ và kết nối trực tiếp chúng với Trí tuệ Cốt lõi. Động thái này sẽ làm gia tăng đáng kể phí duy trì, nhưng lại có thể giúp chúng ta tranh thủ thêm thời gian để tạo ra các vị trí việc làm mới.\n\nChúng ta cũng có thể chọn cách đứng nhìn, nhưng hành động đó sẽ dẫn đến sự phát triển không ngừng của các mạng lưới drone bị lỗi trên [Root.GetName]."
 crime.1.a: "Thi hành chính sách tăng cường trợ cấp."
 crime.1.a.experimenters: "Thi hành chế độ trợ cấp. Chúng ta cần một quần thể dân cư khỏe mạnh."
 crime.1.b: "Chỉ là vài tên côn đồ mạt hạng, không đáng bận tâm."
 crime.1.b.experimenters: "Tội phạm chính là nguồn cung ứng đối tượng thử nghiệm vô cùng lý tưởng."
 crime.1.a2: "Triển khai dự án này."
 crime.1.a2.experimenters: "Thực thi kế hoạch."
 crime.1.b2: "Vài ba con drone bất thường chẳng có gì to tát."
 crime.1.b2.experimenters: "Những con drone bị lỗi là những đối tượng thử nghiệm tuyệt vời."
 crime.1.a3: "Kích hoạt chế độ chờ."
 crime.1.a3.tooltip: "Thêm hiệu ứng sửa đổi §YChế độ Chờ§!, kéo dài §Y120§! tháng, hiệu ứng: Phí duy trì drone thất nghiệp: §R+2§! Năng lượng"
 crime.1.b3: "Vài cái drone bị lỗi chẳng hề hấn gì."
 crime.2.name: "Quan chức Nhận hối lộ tại [Root.GetName]"
 crime.2.desc: "Những bằng chứng thu thập được gần đây cho thấy, một phần không nhỏ thành viên chính quyền §H[Root.GetName]§! đã có hành vi nhận hối lộ. Các tổ chức tội phạm địa phương đã đút lót cho họ để đổi lấy sự nhắm mắt làm ngơ trước những hoạt động phi pháp. Thậm chí một vài quan chức còn bị vạch trần là tay chân của chính những tổ chức tội phạm mà đáng lẽ họ phải chống lại!\n\nMặc dù chúng ta đã bắt giữ một số viên chức, nhưng cũng không ít kẻ đã đánh hơi thấy sự bất thường và nhanh chóng cuốn gói bỏ trốn. Xem ra để giải quyết triệt để vấn đề nhận hối lộ trên [Root.GetName] vẫn còn là một chặng đường đầy gian nan."
 crime.2.a: "Việc này nhất định phải được xử lý."
 crime.2.a.experimenters: "Chúng ta có những dự án chuyên biệt đối phó với tội phạm chính phủ."
 crime.3.name: "Tỷ lệ Lạm dụng Ma túy gia tăng tại [Root.GetName]"
 crime.3.desc: "Cùng với sự gia tăng mạnh mẽ của tỷ lệ tội phạm trên §H[Root.GetName]§!, tỷ lệ lạm dụng ma túy trong dân cư địa phương cũng đang tăng dần. Đủ loại thuốc phiện bất hợp pháp không chỉ xuất hiện trong các tổ chức tội phạm ngầm của [Root.GetPlanetMoon] mà còn tác động đến tất cả mọi người."
 crime.3.desc.experimenters: "Mặc dù có thể cung cấp những dữ liệu thử nghiệm đầy mê hoặc, nhưng những tác động tiêu cực đã bắt đầu lấn át đi những mặt tích cực."
 crime.3.a: "Thật đáng quan ngại."
 crime.3.a.experimenters: "Lạm dụng thuốc sẽ mang lại những dữ liệu thử nghiệm dị thường."
 crime.4.name: "Xung đột Băng đảng tại [Root.GetName]"
 crime.4.desc: "Hai băng đảng ngầm lớn nhất trên §H[Root.GetName]§! vẫn luôn tiến hành những cuộc đụng độ vũ trang lớn nhỏ, nhưng tình hình gần đây đã trở nên tồi tệ hơn bao giờ hết. Vài vụ xả súng trên phố đã bùng phát ngay giữa trung tâm thành phố, chính quyền hành tinh cũng lực bất tòng tâm trong việc kiểm soát tình hình. Số lượng dân thường vô tội bị liên lụy là vô số kể."
 crime.4.desc.experimenters: "Nếu có thể tóm được những kẻ bị thương trước khi chúng bị đưa vào nhà xác, các [GetExperimentalEngineerPlural] của chúng ta sẽ có nhiều sự lựa chọn hơn."
 crime.4.a: "Tình hình đang vượt ra khỏi tầm kiểm soát."
 crime.4.a.experimenters: "Cục diện này vẫn còn có thể mang lại chút đỉnh lợi lộc."
 crime.5.name: "Hành vi Buôn lậu bị Phát hiện trên [Root.GetName]"
 crime.5.desc: "Như tất cả đều biết, tình hình buôn lậu trên §H[Root.GetName]§! đang ngày một nghiêm trọng hơn. Theo tìm hiểu, trên bề mặt [Root.GetPlanetMoon] đã xuất hiện một số \"Cảng xám\" — tức là những cảng không gian không được sự cho phép của chính phủ, thường xuyên là nơi tập trung của các tay buôn lậu và tội phạm.\n\nChính quyền hành tinh đang cố gắng tìm mọi cách để nhổ tận gốc những bến cảng này, nhưng cho đến khi vấn đề được giải quyết triệt để, hoạt động thương mại chính ngạch của [Root.GetPlanetMoon] vẫn sẽ phải hứng chịu tổn thất."
 crime.5.desc.experimenters: "Dù rất chướng tai gai mắt, nhưng những tụ điểm hoạt động phi pháp này sẽ cung cấp cho các [GetExperimentalEngineerPlural] một nguồn nghiên cứu vô cùng đa dạng về mặt di truyền."
 crime.5.a: "$UNFORTUNATE$"
 crime.5.a.experimenters: "[GetExperimentersTragicLesson]"
 crime.6.name: "Cơn sốt Tội phạm tại [Root.GetName]"
 crime.6.desc: "Tỷ lệ tội phạm tại §H[Root.GetName]§! gần đây đã tăng vọt đáng kể, [Root.GetPlanetMoon] gần như sắp trở thành một vùng đất vô pháp. Các mục tiêu bị nhắm tới gần đây đa số là các khu dân cư, nơi mà trước kia chúng ta cứ ngỡ nằm ngoài phạm vi hoạt động của băng nhóm tội phạm lớn nhất trên [Root.GetPlanetMoon]."
 crime.6.desc.experimenters: "Các [GetExperimentalEngineerPlural] của chúng ta vẫn đang yên vị an toàn trong phòng thí nghiệm, sẵn sàng chào đón một lứa đối tượng thử nghiệm mới đổ về."
 crime.6.a: "Nhất định phải dập tắt những hành vi phạm pháp này."
 crime.6.a.experimenters: "Bọn tội phạm này đã mang đến cho chúng ta không ít thứ đáng để nghiên cứu."
 crime.7.name: "Thu giữ Hàng lậu tại [Root.GetName]"
 crime.7.desc: "Sau khi nhận được thông tin từ một mật báo giấu tên, cảnh sát §H[Root.GetName]§! đã dốc toàn lực bao vây và triệt phá một nhà kho cỡ lớn nằm ở ngoại ô thủ đô của [Root.GetPlanetMoon]. Lực lượng cảnh sát đã phát hiện ra lượng lớn hàng cấm và hàng buôn lậu tại đây, kết quả điều tra cho thấy chúng thuộc về tổ chức tội phạm địa phương. Sau khi bắt giữ một phần thành viên của tổ chức, cảnh sát đã tiến hành tịch thu toàn bộ số hàng hóa này và cất giữ chúng vào trong kho của chính phủ."
 crime.7.desc.experimenters: "Các [GetExperimentalEngineerPlural] của chúng ta đang rất nóng lòng muốn liệt kê lô hàng phi pháp này vào danh mục, và kỳ vọng sẽ gặt hái được những khám phá vĩ đại trong các thí nghiệm sắp tới."
 crime.7.a: "$EXCELLENT$"
 crime.7.a.experimenters: "[GetExperimentersWeWillLearn]"
 crime.8.name: "Trùm Tội phạm tại [Root.GetName] Sa lưới"
 crime.8.desc: "Trong một chiến dịch giăng bẫy của lực lượng Chấp Pháp, một trùm tội phạm cộm cán trên §H[Root.GetName]§! gần đây đã sa lưới. Sự sụp đổ của kẻ cầm đầu đã giáng một đòn nặng nề vào hoạt động của một trong những tổ chức tội phạm lớn trên [Root.GetPlanetMoon], dẫn tới sự suy giảm rõ rệt của tỷ lệ tội phạm."
 crime.8.desc.experimenters: "Chiến tích này đã mang đến cho chúng ta một cơ hội có một không hai để nghiên cứu tâm lý của một tên tội phạm cộm cán. Các [GetExperimentalEngineerPlural] đang cực kỳ khao khát được tiến hành phân tích xâm lấn."
 crime.8.a: "$EXCELLENT$"
 crime.8.a.experimenters: "Chúng ta có thể khám phá ra những bí mật vô cùng thú vị."
 crime.40.name: "[Root.GetName] Tràn ngập Tội ác"
 crime.40.desc: "Tình trạng tội phạm tại §H[Root.GetName]§! vẫn chưa có dấu hiệu lắng xuống, và giờ đây các tổ chức tội phạm đã cắm rễ sâu trên [Root.GetPlanetMoon]. Rất nhiều khu vực hoặc là tha hóa thành vùng đất vô pháp, hoặc là hoàn toàn nằm trong nanh vuốt của các tổ chức tội phạm."
 crime.40.desc.experimenters: "May mắn thay, môi trường như thế này lại có thể mang đến cho chúng ta một nguồn cung ứng đối tượng thí nghiệm tươi mới và dồi dào. Các [GetExperimentalEngineerPlural] của chúng ta đang rất nóng lòng muốn khám phá những hướng đi nghiên cứu mới."
 crime.40.b.desc: "Sự kiện nổi loạn trên §H[Root.GetName]§! vẫn đang tiếp tục lan rộng, những hành vi công khai chống đối lại ý chí Bầy đàn đã xuất hiện. Thông tin tình báo cho thấy, trên [Root.GetPlanetMoon] đã hình thành các cộng đồng drone nổi loạn, và chúng đang bắt đầu đánh cắp tài nguyên của những drone khác để duy trì các hoạt động nổi loạn của mình."
 crime.40.b.desc.experimenters: "Những cá thể drone bất thường này sẽ được tái sử dụng làm đối tượng thử nghiệm. Các [GetExperimentalEngineerPlural] của chúng ta biết đâu sẽ tìm ra nguyên nhân gây hư hỏng của chúng trong những cuộc giải phẫu sau này."
 crime.40.c.desc: "Mức độ hư hỏng trên §H[Root.GetName]§! đã trở nên tồi tệ hơn. Các thành phần bất thường đã bắt đầu hành động công khai, mặc sức tung hoành, thách thức quyền lực của Trí tuệ Cốt lõi. Tình báo chỉ ra rằng rất có thể bọn chúng đã lập nên những mạng lưới tự trị để trao đổi thông tin và năng lượng với nhau."
 crime.40.a: "Thật không thể nào chịu đựng nổi nữa."
 crime.40.a.experimenters: "Tội phạm chính là một loại tài nguyên đang chờ được khai phá."
 crime.40.b: "Chúng đã phản bội lại ý chí của Bầy đàn!"
 crime.40.b.experimenters: "Có một phương pháp chữa trị cực kỳ hiệu quả dành cho những hành vi bất thường này."
 crime.40.c: "Mức độ hư hỏng sắp chạm tới giới hạn cảnh báo."
 crime.41.name: "Trật tự đã được Khôi phục tại [Root.GetName]"
 crime.41.desc: "Với sự sụt giảm đáng kể của tỷ lệ tội phạm trên §H[Root.GetName]§!, thế giới ngầm tội phạm từng lan tràn khắp [Root.GetPlanetMoon] nay đã bị quét sạch hoàn toàn. Cư dân nơi đây một lần nữa được tận hưởng cảm giác an toàn và hòa bình."
 crime.41.desc.experimenters: "Trật tự đã được khôi phục như mới, chúng ta kỳ vọng có thể thuận lợi quay lại với những nghiên cứu đầy hứa hẹn."
 crime.41.b.desc: "Những hành vi nổi loạn của các drone trên §H[Root.GetName]§! đã được dập tắt thành công. Ý chí của Tâm trí Bầy đàn đã được củng cố trở lại."
 crime.41.b.desc.experimenters: "Xác của những cá thể drone bất thường có thể được các [GetExperimentalEngineerPlural] của chúng ta tận dụng tối đa."
 crime.41.c.desc: "Tất cả drone bị lỗi trên §H[Root.GetName]§! đã được thanh trừng tận gốc. Toàn bộ các đơn vị drone hiện đang vận hành bình thường dưới sự chỉ thị của Trí tuệ Cốt lõi."
 crime.41.a: "$GOOD$"
 crime.41.a.experimenters: "Khoa học đã có một bước tiến dài."
 crime.100.name: "Chiến tranh Băng đảng tại [Root.GetName]"
 crime.100.desc: "Suốt nhiều tháng qua, hai tổ chức tội phạm cộm cán nhất trên §H[Root.GetName]§! vẫn luôn trong trạng thái như nước với lửa, và giờ đây thì một cuộc chiến tranh toàn diện đã chính thức nổ ra. Những màn đao quang kiếm ảnh xuất hiện khắp mọi hang cùng ngõ hẻm của [Root.GetPlanetMoon], rất nhiều khu dân cư cũng không tránh khỏi việc bị vạ lây.\n\nLực lượng an ninh địa phương đang dốc toàn lực để kiềm chế những vụ bạo lực xảy ra, nhưng do tổ chức tội phạm quá đông đảo, nên hiện tại vẫn chưa thu được kết quả khả quan."
 crime.100.desc.experimenters: "Một môi trường như thế này đã để lại cho các [GetExperimentalEngineerPlural] vô số vật liệu thử nghiệm. Đúng như người ta thường nói, trong họa có phúc."
 crime.100.a: "Nơi đó đã biến thành một bãi chiến trường!"
 crime.101.name: "Băng đảng Mai phục tại [Root.GetName]!"
 crime.101.desc: "Gần đây, một trong những tổ chức tội phạm tại §H[Root.GetName]§! đã tổ chức hàng loạt các cuộc mai phục nhắm vào lực lượng chấp pháp của [Root.GetPlanetMoon]. Cùng một lúc, các thành viên băng đảng đã tập kích những sĩ quan tuần tra ở khắp mọi nơi, rất nhiều đồn cảnh sát đã hoàn toàn rơi vào tay tổ chức tội phạm. Đợt ra tay quy mô lớn này đã khiến hàng ngàn người phải bỏ mạng.\n\nLực lượng chấp pháp còn lại đang gặp muôn vàn khó khăn trong việc xoay xở vì thiếu hụt nhân sự trầm trọng. Rất nhiều khu vực trên [Root.GetPlanetMoon] hiện đã hoàn toàn thất thủ, tình hình đang vô cùng nguy cấp."
 crime.101.desc.experimenters: "Những hành vi phạm pháp thế này ít ra cũng cho phép chúng ta tiếp tế đầy đủ cho các [GetExperimentalEngineerPlural]."
 crime.101.a: "$crime.200.a$"
 crime.101.a.experimenters: "[GetExperimentersTragicLesson]"
 crime.101.tooltip: "§HQuần thể Dân số Chấp pháp tại [Root.GetName]:§! Đã chết"
 crime.102.name: "Chiến tranh Băng đảng tại [Root.GetName] Lan rộng ra Không gian"
 crime.102.desc: "Sự hỗn loạn bắt nguồn từ những cuộc thanh toán lẫn nhau của các băng đảng trên §H[Root.GetName]§! nay đã lan rộng ra khắp hệ sao [Root.solar_system.GetName]. Theo như báo cáo, hai băng nhóm này đã sử dụng các tàu dân sự được vũ trang để tiến hành vài trận đụng độ. Cả hai phe đều đang nhắm vào những tàu buôn để cướp bóc nhằm chiếm đoạt tài sản và mở rộng quy mô hạm đội."
 crime.102.desc.experimenters: "Các [GetExperimentalEngineerPlural] của chúng ta đã đệ đơn xin được quan sát hậu quả của những cuộc trả đũa, cũng như những ví dụ thực tiễn quy mô lớn về việc ném hàng loạt xác chết ra môi trường chân không."
 crime.102.a: "$crime.200.a$"
 crime.102.a.experimenters: "Sự trừng phạt của chúng ta sẽ mang đậm tính giáo dục."
 crime.102.tooltip: "§RMột hạm đội không tặc thù địch đã xuất hiện tại hệ sao [Root.solar_system.GetName]!§!"
 crime.103.name: "Giao tranh Băng đảng Ác liệt tại [Root.GetName]"
 crime.103.desc: "Gần đây, hai băng đảng thế giới ngầm khét tiếng nhất trên §H[Root.GetName]§! đã có một trận chiến vô cùng đẫm máu diễn ra ngay tại trung tâm đô thị lớn nhất của [Root.GetPlanetMoon]. Thương vong của cả hai phe đã lên tới hàng vạn người, thế nhưng rốt cuộc vẫn chưa phân định được thắng bại.\n\nCuộc đụng độ tàn khốc này đã gần như san phẳng cả thành phố, khiến phần lớn người dân phải rời bỏ nhà cửa đi lánh nạn."
 crime.103.desc.experimenters: "Những hành động bạo lực vô cớ thế này không phải là không có sức hấp dẫn. Biết đâu lại cứu vãn được những kết quả nghiên cứu khoa học mới từ trên người những kẻ đã chết."
 crime.103.a: "$DISCONCERTING$"
 crime.103.a.experimenters: "[GetExperimentersTragicLesson]"
 crime.103.tooltip: "§H300 £pop£ Dân số tại [Root.GetName]:§! Đã chết"
 crime.104.name: "Chiến tranh Băng đảng Gây tác động đến Thương mại"
 crime.104.desc: "Chiến tranh băng đảng tại §H[Root.GetName]§! vẫn không ngừng diễn ra, và đã để lại những ảnh hưởng cực kỳ tồi tệ đối với hoạt động thương mại của [Root.GetPlanetMoon]. Nhận thấy tình hình trước mắt, không ít hiệp hội thương mại liên tinh đã ban bố lệnh cảnh báo du lịch đối với hành tinh này, khuyên các thương nhân không nên đặt chân đến [Root.GetPlanetMoon]. Tuy nhiên, công việc buôn lậu vũ khí đạn dược lại đang phất lên như diều gặp gió."
 crime.104.desc.experimenters: "Các [GetExperimentalEngineerPlural] của chúng ta đã mang những món vũ khí uy lực này ra khắp các ngả đường, họ đang rất nóng lòng muốn thử nghiệm sức công phá của chúng lên cơ thể của giống loài [Root.Owner.GetSpeciesName]."
 crime.104.a: "$WORRYING$"
 crime.104.a.experimenters: "[GetExperimentersWeWillLearn]"
 crime.200.name: "Mở rộng Hoạt động Giao dịch Ma túy tại [Root.GetName]"
 crime.200.desc: "Kéo theo sự bành trướng từng ngày của các hoạt động tội phạm trên §H[Root.GetName]§!, số lượng các vụ mua bán thuốc phiện trái phép cũng đã chạm đến một kỷ lục mới. Những loại ma túy nổi danh nhất trên toàn cõi vũ trụ đều có thể dễ dàng tìm thấy tại [Root.GetPlanetMoon].\n\nĐối với người dân nơi đây, việc lạm dụng ma túy đã trở thành một chuyện bình thường như cơm bữa. Chẳng còn nghi ngờ gì nữa, đây đúng là một thảm họa tàn phá năng suất lao động."
 crime.200.desc.experimenters: "Loại hình hoạt động phạm pháp mới nổi này hẳn sẽ mang đến cho các [GetExperimentalEngineerPlural] những hướng nghiên cứu mới mẻ và đầy thú vị."
 crime.200.a: "Chuyện này không ổn chút nào."
 crime.200.a.experimenters: "Tội phạm gì chứ? Đó gọi là tình nguyện viên!"
 crime.201.name: "Ma túy Kiểu mới trên [Root.GetName]"
 crime.201.desc: "Bọn buôn lậu trên §H[Root.GetName]§! đã tuồn vào một loại ma túy hoàn toàn mới, thứ dường như có xuất xứ từ lãnh địa của bọn không tặc bên ngoài ranh giới của những thế giới văn minh. Loại ma túy này không chỉ có khả năng gây nghiện cực cao, mà đối với hầu hết các dạng sống, chỉ cần sử dụng quá liều lượng một chút thôi là đã đủ để bỏ mạng.\n\nMặc dù chính quyền địa phương đang dốc hết sức bình sinh để ngăn chặn đà lây lan của loại ma túy chết người này, nhưng tỷ lệ tử vong trên [Root.GetPlanetMoon] vẫn không ngừng leo thang."
 crime.201.desc.experimenters: "Dù sao đi nữa, thông qua việc nghiên cứu những hóa chất này và tác động của chúng lên các đối tượng thử nghiệm, chúng ta cũng đã thu hoạch được một số những bước tiến đầy kinh ngạc trong nghiên cứu."
 crime.201.a: "$WORRYING$"
 crime.201.a.experimenters: "[GetExperimentersWeWillLearn]"
 crime.201.tooltip: "§H400 £pop£ Dân số tại [Root.GetName]:§! Đã chết"
 crime.202.name: "Xung đột giữa các Trùm Ma túy Đầu sỏ tại [Root.GetName]"
 crime.202.desc: "Những tên tội phạm đầu sỏ làm ăn trên §H[Root.GetName]§! vẫn luôn ganh đua vô cùng gay gắt trong thị trường ma túy, nhưng thời gian gần đây sự ganh đua đó đã thực sự châm ngòi cho những cuộc đụng độ. Theo báo cáo, các thành viên thuộc các băng đảng buôn bán ma túy đã sử dụng vũ khí quân dụng để tiến hành nhiều vụ xung đột, gây tổn thất nghiêm trọng về tài sản và khiến vô số thường dân vô tội phải thương vong. Xem ra những thứ được tuồn vào [Root.GetPlanetMoon] đâu chỉ có mỗi ma túy."
 crime.202.desc.experimenters: "[GetExperimentersEmergingCrime]"
 crime.203.name: "Tàu Vận chuyển Ma túy Đâm sầm xuống [Root.GetName]"
 crime.203.desc: "Sau khi một tàu vận tải dân sự cỡ lớn xin phép đi vào bầu khí quyển của §H[Root.GetName]§! để cập bến, yêu cầu này đã bị khước từ do lực lượng chức năng phát hiện ma túy phi pháp trong khoang chở hàng của nó. Khi chính quyền địa phương định tiến hành khám xét kỹ hơn con tàu, vị thuyền trưởng thuộc giống loài [Root.Owner.GetSpeciesName] do dùng ma túy quá liều đã định đâm xuyên qua hệ thống phòng thủ trên quỹ đạo để cố tình hạ cánh.\n\nTrong lúc hạ độ cao, con tàu đã bị lực lượng phòng vệ hành tinh của ta bắn trúng, khiến nó rơi thẳng xuống một khu vực đô thị đông đúc. Hiện trường vụ tai nạn gần như không còn ai sống sót."
 crime.203.desc.experimenters: "Các [GetExperimentalEngineerPlural] của chúng ta đang cực kỳ nóng lòng muốn được nghiên cứu những tác động từ số ma túy bị phát tán ra môi trường của các khu dân cư lân cận."
 crime.203.a: "Đúng là thảm họa!"
 crime.203.a.experimenters: "[GetExperimentersTragicLesson]"
 crime.204.name: "Giao dịch Ma túy tại [Root.GetName] Vẫn Đang Tiếp diễn"
 crime.204.desc: "Giao dịch ma túy trái phép trên §H[Root.GetName]§! vẫn chưa hề có dấu hiệu hạ nhiệt. Gần đây chúng ta đã nhận được báo cáo rằng bọn buôn lậu đã tìm mọi cách để đột nhập vào các kho chứa khí ga ngoài hành tinh trên quỹ đạo của phe ta, và đánh cắp một vài loại khí có khả năng gây ảo giác. Lượng khí ga này sau đó đã nhanh chóng được bọn tội phạm tuồn bán trong các con hẻm tối tăm của [Root.GetName]."
 crime.204.desc.experimenters: "Các [GetExperimentalEngineerPlural] của chúng ta cũng phải tỏ ra kinh ngạc khi ngay từ đầu đã không nghĩ đến những công dụng tuyệt vời này của khí ga ngoài hành tinh."
 crime.204.a: "Không thể cứ tiếp diễn thế này được!"
 crime.204.a.experimenters: "Thật là thú vị."
 crime.300.name: "Thế giới ngầm Cai trị"
 crime.300.desc: "Công đoàn tội phạm thống trị trên §H[Root.GetName]§! gần đây đã loại bỏ đối thủ cạnh tranh cuối cùng và giành quyền kiểm soát hoàn toàn thế giới ngầm tội phạm rộng lớn của [Root.GetPlanetMoon]. Chúng từ lâu đã làm xói mòn quyền lực của chính quyền hành tinh thực sự, và dân cư địa phương giờ đây coi những tên tội phạm này như những kẻ cai trị đích thực của [Root.GetName]."
 crime.300.desc.experimenters: "Các [GetExperimentalEngineerPlural] nhận định rằng hành tinh này sở hữu một môi trường \"tài nguyên dồi dào\" để phục vụ cho các nghiên cứu trong tương lai."
 crime.300.a: "Nhất định phải dạy cho bọn đạo tặc này một bài học."
 crime.301.name: "Tiền bảo kê Ép buộc trên [Root.GetName]"
 crime.301.desc: "Tổ chức tội phạm đang cai quản khu vực §H[Root.GetName]§! đã giăng ra một mạng lưới thu tiền bảo kê cực kỳ rộng lớn. Do chính quyền và hệ thống chấp pháp của [Root.GetPlanetMoon] hoàn toàn bó tay trước những hành vi phạm tội có tổ chức này, nên người dân cũng chỉ đành phải khuất phục tổ chức tội phạm đó để giữ bình yên cho bản thân. Điều này cũng đã trực tiếp khiến năng suất của khu vực sụt giảm không phanh."
 crime.301.desc.experimenters: "Nhìn nhận từ một góc độ tích cực, những băng đảng này dường như còn cung cấp nguồn đối tượng thử nghiệm cho các [GetExperimentalEngineerPlural] hiệu quả hơn nhiều so với những con đường chính thống."
 crime.301.a: "Chúng ta cần phải giành lại quyền kiểm soát khu vực này."
 crime.301.a.experimenters: "Dù vậy, chúng ta vẫn nên dồn tâm huyết vào việc tái lập lại trật tự."
 crime.302.name: "Chính quyền Tham nhũng tại [Root.GetName]"
 crime.302.desc: "Khảo sát thực địa gần đây trên §H[Root.GetName]§! chỉ ra rằng, phần lớn bộ sậu chính quyền của hành tinh này đều là lính đánh thuê cho tổ chức tội phạm sừng sỏ nhất của [Root.GetPlanetMoon]. Cho dù toàn bộ các quan chức nhúng chàm đã bị thay máu, nhưng việc đó cũng đã phá vỡ trật tự vốn có của khu vực này.\n\nHơn thế nữa, những kẻ cai trị thế giới ngầm của [Root.GetName] giờ đây cũng đang gia tăng các hoạt động mua chuộc nhắm vào những quan chức mới nhậm chức..."
 crime.302.desc.experimenters: "[GetExperimentersEmergingCrime]"
 crime.302.a: "Chỉ là vấp ngáp nhất thời."
 crime.302.b: "Thực thi chính sách không khoan nhượng."
 crime.302.c: "Cổ vũ những người liêm chính."
 crime.303.name: "Thành viên Băng đảng Ám sát Thống đốc [Root.GetName]"
 crime.303.desc: "Những kẻ thực hiện vụ ám sát là thành viên của tổ chức tội phạm thế lực nhất §H[Root.GetName]§!, và mục tiêu của chúng không ai khác chính là [governor_target.GetTitle] [governor_target.GetName]! Ngay khi đoàn xe của [governor_target.GetTitle] rời khỏi cảng không gian, chúng đã bị tổ chức tội phạm chặn đường. Đội bảo vệ đã có một cuộc đọ súng dữ dội với nhóm sát thủ.\n\nSau khi trận chiến ngã ngũ, chúng ta đã nhận được tin tức xác nhận rằng [governor_target.GetTitle] đã hy sinh trong lúc làm nhiệm vụ."
 crime.303.a: "Chuẩn bị quốc tang."
 crime.303.a.experimenters: "[GetExperimentersTragicLesson]"
 crime.304.name: "Băng đảng Nắm giữ Nền Kinh tế [Root.GetName]"
 crime.304.desc: "Tổ chức tội phạm đang xưng hùng xưng bá tại §H[Root.GetName]§! hiện đã thao túng hầu hết các giao dịch vào ra [Root.GetPlanetMoon]. Việc chúng hoàn toàn thâu tóm vài bến cảng không gian lớn đã giúp chúng bòn rút từ tất cả các loại hàng hóa vận chuyển qua đây. Hậu quả là lợi nhuận thương mại của [Root.GetName] đã lao dốc thảm hại."
 crime.304.desc.experimenters: "Cũng may là tuyến đường tiếp tế phục vụ các [GetExperimentalEngineerPlural] của chúng ta chưa bị ảnh hưởng, có lẽ nhờ tiền hối lộ đã đến tay những kẻ cần nhận mà lượng đối tượng thử nghiệm vẫn được đảm bảo."
 crime.304.a: "$crime.40.a$"
 crime.304.a.experimenters: "Khoa học đã có một bước tiến dài."
 crime.500.name: "Tập trung Lượng lớn Drone tại [Root.GetName]"
 crime.500.desc: "Gần đây trên §H[Root.GetName]§! đã xuất hiện một lượng lớn drone bất thường, chúng tìm mọi cách tấn công những drone trung thành và đập phá các cơ sở. Những con drone bất thường này đã để lại cho chúng ta những tổn thất vô cùng nặng nề trước khi bị đánh lui hoàn toàn."
 crime.500.a: "Nhất định phải xử lý lũ bất thường này."
 crime.500.a.experimenters: "Bắt đầu khám nghiệm tử thi."
 crime.501.name: "Drone Bất thường Quấy nhiễu [Root.GetName]"
 crime.501.desc: "Quy mô bầy drone bất thường xuất hiện trên §H[Root.GetName]§! đang phình to theo từng ngày, và bắt đầu gây ra những ảnh hưởng rõ rệt tới hiệu suất sản xuất của [Root.GetPlanetMoon]. Những thành phần bất thường này liên tục cản trở tiến độ công việc của các drone, và đánh cắp các trang thiết bị cũng như công cụ cần thiết."
 crime.501.desc.experimenters: "Hành vi bất thường kiểu này chỉ càng khiến các [GetExperimentalEngineerPlural] của chúng ta có thêm nhiều sự lựa chọn trên con đường theo đuổi khoa học."
 crime.501.a: "$crime.500.a$"
 crime.501.a.experimenters: "[GetExperimentersWeWillLearn]"
 crime.502.name: "Thủ lĩnh Drone Bất thường tại [Root.GetName] Bị Tiêu diệt"
 crime.502.desc: "Một drone cực kỳ có sức ảnh hưởng trong đám bất thường, kẻ gần đây luôn tích cực cầm đầu các vụ bạo loạn trên §H[Root.GetName]§!, cuối cùng đã bị một nhóm drone bình thường trừ khử. Sự ra đi của con drone này đã tác động mạnh tới hoạt động của những drone bất thường khác, chứng tỏ đây từng là một tên thủ lĩnh cộm cán."
 crime.502.desc.experimenters: "Các [GetExperimentalEngineerPlural] của chúng ta đã nhận ra giá trị giải phẫu của cá thể drone bất thường đầy quyền uy này. Chúng ta hy vọng có thể học hỏi được rất nhiều điều từ thân xác nay đã không còn chút sinh khí này."
 crime.502.a: "Ý chí Bầy đàn là tuyệt đối."
 crime.502.a.experimenters: "Ngay cả khi chết đi thì chúng vẫn đang cống hiến cho Bầy đàn."
 crime.550.name:0 "Bạo loạn của Drone Bị lỗi trên [Root.GetName]"
 crime.550.desc:0 "Gần đây, một mạng lưới drone bị lỗi quy mô lớn trên §H[Root.GetName]§! đã bất ngờ xếp loại toàn bộ các đơn vị [Root.Owner.GetName] vào hàng ngũ kẻ thù. Lũ drone này đã phát động những đợt tập kích gây thiệt hại nặng nề cho chúng ta, trước khi cuối cùng cũng bị lực lượng an ninh của phe ta đánh lui hoàn toàn."
 crime.550.a:0 "Không thể cứ để yên như vậy được."
 crime.551.name:0 "Nhiễu Tín hiệu Bất thường tại [Root.GetName]"
 crime.551.desc:0 "Mạng lưới drone bị lỗi trên §H[Root.GetName]§! đã bắt đầu phát nhiễu công việc của các đơn vị bình thường. Những tín hiệu mà kẻ địch phát tán đã gần như nhấn chìm hoàn toàn mệnh lệnh từ Trí tuệ Cốt lõi, khiến hoạt động của các drone công nhân liên tục bị gián đoạn, và các thao tác lỗi thì xuất hiện như cơm bữa."
 crime.552.name:0 "Vi-rút đã Xóa sổ Mạng lưới Drone Bị lỗi trên [Root.GetName]"
 crime.552.desc:0 "Mạng lưới drone bị lỗi trên §H[Root.GetName]§! đã bị dính đòn tấn công từ một loại vi-rút và bị định dạng lại thành công. Sự việc này đã kéo theo sự thuyên giảm trầm trọng các hoạt động của bầy drone bị lỗi trên [Root.GetPlanetMoon]."
 crime.552.a:0 "Quyết tâm chấp hành tuyệt đối chỉ thị từ Trí tuệ Cốt lõi."
 crime.1001.name:1 "Chi nhánh trên [Root.GetName] Bị Đóng cửa"
 crime.1001.desc:0 "Khi tỷ lệ tội phạm tiếp tục giảm trên §H[Root.GetName]§!, chính quyền địa phương đã có thể tập trung nỗ lực triệt phá các doanh nghiệp phi pháp do §H[office_owner.GetName]§! vận hành trên [Root.GetPlanetMoon]. Hàng loạt vụ bắt giữ đã diễn ra, buộc Chi Nhánh Ngầm của chúng phải đóng cửa ngừng hoạt động."
 crime.1001.a:0 "Đúng là tạ ơn trời đất."
 crime.1002.name:1 "Chi nhánh trên [From.GetName] Bị Đóng cửa"
 crime.1002.desc:0 "Bởi chiến dịch vây bắt quy mô lớn mà chính quyền địa phương thực hiện gần đây, chi nhánh mà chúng ta đặt tại §H[From.GetName]§! trong lãnh thổ của §H[From.Owner.GetName]§! vừa bị ép phải đóng cửa. Có vẻ nguyên do là vì mức độ tội phạm tại [From.GetPlanetMoon] sụt giảm, giúp các cơ quan chấp pháp của họ có thời gian rảnh rỗi để tập trung lực lượng cản mũi các hoạt động của chúng ta."
 crime.1002.tooltip:0 "Chi nhánh của chúng ta trên [From.GetName] đã bị đóng cửa."

 # Atomic Clock
 atomic_clock_cat:0 "$AST_DEBRIS_FIELD_1_CAT$"
 distar.330.name:0 "Đồng hồ nguyên tử đếm ngược"
 distar.330.desc:0 "Suốt 42 năm 3 ngày qua, các nhà nghiên cứu trên [Root.Capital.GetName] đã luôn nín thở theo dõi đồng hồ đếm ngược của chiếc đồng hồ nguyên tử mà chúng ta khai quật được trên [From.From.From.GetName].\n\nGiờ đây, hàng thập kỷ suy đoán và thắc mắc đã được giải đáp chỉ trong chớp mắt, cuốn trôi theo đó là phần lớn [nuked_primitive_planet.GetName].\n\nKhi đồng hồ điểm số không, nó đã phát đi một tín hiệu đến một máy thu nào đó trên [nuked_primitive_planet.GetName], châm ngòi cho một vụ nổ nhiệt hạch kinh hoàng, xóa sổ toàn bộ hành tinh cùng nền văn minh sơ khai đang định cư tại đó.\n\nTrong khi các nhà khoa học của chúng ta còn đang đau đầu tranh cãi xem thế lực nào lại có thể nhẫn tâm sắp đặt một vụ hủy diệt hẹn giờ chính xác đến thế, chiếc đồng hồ nguyên tử vẫn cứ tích tắc đều đặn, như thể sự chết chóc hoang tàn bên dưới chẳng mảy may liên quan gì đến nó."
 distar.330.a.phile:0 "Chúng ta đã làm cái quái gì thế này!?"
 distar.335.name:0 "Đồng hồ nguyên tử đếm ngược"
 distar.335.desc:0 "Suốt 42 năm 3 ngày qua, các nhà nghiên cứu trên [Root.Capital.GetName] đã luôn nín thở theo dõi đồng hồ đếm ngược của chiếc đồng hồ nguyên tử mà chúng ta khai quật được trên [From.From.From.GetName].\n\nGiờ đây, hàng thập kỷ suy đoán và thắc mắc đã được giải đáp chỉ trong chớp mắt, cuốn trôi theo đó là phần lớn [nuked_planet.GetName].\n\nKhi đồng hồ điểm số không, nó đã phát đi một tín hiệu đến một máy thu nào đó trên [nuked_planet.GetName], châm ngòi cho một vụ nổ nhiệt hạch kinh hoàng, xóa sổ toàn bộ hành tinh.\n\nTrong khi các nhà khoa học của chúng ta còn đang đau đầu suy đoán xem thế lực nào lại có thể nhẫn tâm sắp đặt một vụ hủy diệt hẹn giờ chính xác đến thế, chiếc đồng hồ nguyên tử vẫn cứ tích tắc đều đặn, như thể sự chết chóc hoang tàn bên dưới chẳng mảy may liên quan gì đến nó."

 planet_culture_shock:0 "$culture_shock_bronze_age$"
 planet_culture_shock_desc:1 "Vì sự xuất hiện đột ngột của công nghệ tiên tiến, nền văn minh tiền siêu quang tốc này đã không kịp thích nghi, dẫn đến một cuộc khủng hoảng hỗn loạn. Dù vậy, tại nhiều khu vực hẻo lánh, vẫn còn rất đông cư dân đang ra sức chống lại sự thay đổi này."

