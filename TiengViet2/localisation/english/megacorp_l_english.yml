 # Megastructures
 matter_decompressor_0:1 "Nền móng $matter_decompressor_4$"
 matter_decompressor_0_DESC:0 "Khu vực thi công này có thể dùng làm nền móng để xây dựng $matter_decompressor_1$ trong tương lai."
 matter_decompressor_0_MEGASTRUCTURE_DETAILS:3 "Công trình §Y$matter_decompressor_4$§! này tập trung lực hấp dẫn của lỗ đen vào một điểm, tạo thành một cỗ máy khoan bằng trọng lực. Chúng ta có thể dùng nó để hút vật chất từ điểm kỳ dị của lỗ đen và chuyển hóa thành £minerals£ khoáng sản."
 matter_decompressor_1:1 "Máy Giải nén Vật chất: Neo giữ"
 matter_decompressor_1_DESC:1 "Sử dụng động cơ điều hướng trọng lực tiên tiến để cố định phần đế của công trình vào rìa ngoài của lỗ đen."
 matter_decompressor_1_MEGASTRUCTURE_DETAILS:0 "$matter_decompressor_0_MEGASTRUCTURE_DETAILS$"
 matter_decompressor_2:0 "Máy Giải nén Vật chất: Thấu kính"
 matter_decompressor_2_DESC:0 "Hệ thống thấu kính trọng lực có thể đổi hướng và tập trung một phần lực hấp dẫn của lỗ đen vào một trường lực nhỏ được chỉ định."
 matter_decompressor_2_MEGASTRUCTURE_DETAILS:0 "$matter_decompressor_0_MEGASTRUCTURE_DETAILS$"
 matter_decompressor_3:0 "Máy Giải nén Vật chất: Khoan thăm dò"
 matter_decompressor_3_DESC:0 "Bằng công nghệ bẻ cong hướng tác động của lực hấp dẫn, chúng ta đã tạo ra một cỗ máy khoan siêu cấp hoạt động dựa trên việc thao túng trọng lực."
 matter_decompressor_3_MEGASTRUCTURE_DETAILS:0 "$matter_decompressor_0_MEGASTRUCTURE_DETAILS$"
 matter_decompressor_4:0 "Máy Giải nén Vật chất"
 matter_decompressor_4_DESC:1 "Đưa một luồng trọng lực xoắn sâu vào điểm kỳ dị, kết hợp với chuỗi máy giải nén, thiết bị xử lý và lò luyện tự động trên quỹ đạo, chúng ta có thể khai thác khoáng sản trực tiếp từ lỗ đen."
 matter_decompressor_4_MEGASTRUCTURE_DETAILS:0 "$matter_decompressor_0_MEGASTRUCTURE_DETAILS$"
 matter_decompressor_ruined:0 "$matter_decompressor_4$ bị hỏng"
 matter_decompressor_ruined_DESC:0 "Một trạm không gian quỹ đạo hư hỏng nặng, công trình $matter_decompressor_4$ này từng thu hồi vật chất từ lỗ đen trong hệ sao, một hoạt động gần như thách thức các định luật vật lý."
 matter_decompressor_ruined_MEGASTRUCTURE_DETAILS:1 "Tàn tích của cỗ máy phức tạp này đang gây nhiễu loạn lỗ đen."
