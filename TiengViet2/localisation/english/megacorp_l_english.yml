 criminal_gambling:0 "Nghiện cờ bạc"
 criminal_gambling_desc:0 "Sau khi nướng sạch tiền tiết kiệm, chúng đang rất khát nguồn vốn mới."
 festival_aftermath:0 "Dư âm lễ hội"
 festival_aftermath_desc:1 "Để xả vai khỏi một bữa tiệc tưng bừng thế này, xã hội chắc chắn sẽ có chút xáo trộn."
 slot_machine_bounty:0 "Cơn sốt máy xèng!"
 slot_machine_bounty_desc:0 "Mẫu máy xèng mới nhất và xịn nhất đã ra lò, dân tình chơi tới mức không dứt ra nổi! Những cái máy này sẽ thao túng tâm lý họ cho đến khi cạn kiệt túi tiền."
 mod_rare_edicts_cost_mult:0 "Sắc lệnh tài nguyên hiếm"
 heavy_metal:0 "Kim loại nặng"
 heavy_metal_desc:0 "Kể từ sự cố ban nhạc Megacorpse, không hiểu vì lý do gì mà việc sản xuất kim loại trên hành tinh này lại dễ dàng hơn hẳn."
 alloy_relic:0 "Máy chế tạo siêu hợp kim"
 alloy_relic_desc:0 "Thiết bị bí ẩn đặt trong lò rèn này có thể tăng hiệu suất sản xuất hợp kim."
 minerals_relic:0 "Di vật vô cùng tẻ nhạt"
 minerals_relic_desc:0 "Cỗ máy kỳ lạ này có cách để dịch chuyển khoáng sản từ dưới lòng đất lên mà không làm ảnh hưởng đến vật chất xung quanh."
 energy_relic:0 "Máy xúc tác năng lượng"
 energy_relic_desc:0 "Nếu gắn vào một máy phát điện đủ lớn, thiết bị này sẽ dùng một công nghệ bí ẩn và có vẻ phi lý để tạo ra thêm năng lượng ngoài mức sản lượng thông thường."
