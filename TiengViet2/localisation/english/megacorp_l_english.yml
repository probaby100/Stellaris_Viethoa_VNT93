 district_arcology_administrative:0 "Siêu Đô thị Hành chính"
 district_arcology_administrative_plural:0 "Siêu Đô thị Hành chính"
 district_arcology_administrative_desc:0 "Hàng đoàn thư ký và viên chức cắm cúi làm việc ngày đêm để đáp ứng những yêu cầu không ngớt của một hệ thống hành chính đang phình to."
 district_arcology_spiritualist:0 "Siêu Đô thị Tôn giáo"
 district_arcology_spiritualist_plural:0 "Siêu Đô thị Tôn giáo"
 district_arcology_spiritualist_desc:0 "Những ngọn tháp vươn cao này là minh chứng rõ ràng nhất cho đức tin ngoan đạo của chúng ta, gắn liền với phúc lợi tinh thần của toàn đế chế."
 district_arcology_organic_housing:0 "Siêu Đô thị Trú ẩn"
 district_arcology_organic_housing_plural:0 "Siêu Đô thị Trú ẩn"
 district_arcology_organic_housing_desc:0 "Những công trình cao chót vót này được AI điều hòa khí hậu, có khả năng mô phỏng bất kỳ môi trường nào mà các sinh vật hữu cơ có trí tuệ cần đến. Mọi nhu cầu về chỗ ở của họ đều được đáp ứng trọn vẹn."
