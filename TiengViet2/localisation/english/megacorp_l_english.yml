 district_arcology_housing_plural:0 "Siêu Đô thị Cư trú"
 district_arcology_housing_desc:0 "Với các đặc khu Thành Phố Hành Tinh đặc biệt này, kiến trúc thẳng đứng tích hợp được tận dụng để tối đa hóa mật độ dân số trên diện tích bề mặt."
