 CORP_HOSTILE_GREETING_05:0 "[Root.GetName] không có gì để bán cho các người đâu, [From.GetSpeciesNamePlural]."
 CORP_CORP_HOSTILE_GREETING_02:1 "[From.GetName], mang tiếng là công ty đàng hoàng mà cái tên nghe gớm quá."
 CORP_CORP_HOSTILE_GREETING_03:0 "Công thức bí mật của [Root.GetAdj] thu hút mọi người ngoài hành tinh. Chúng tôi có thể dạy các người, nhưng phải xì tiền ra..."
 CORP_NEUTRAL_GREETING_01:1 "Chào mừng đến với [Root.GetName], nơi nguồn vốn tri thức của bạn dễ sinh lời nhất. Xin hỏi chúng tôi có thể giúp gì?"
 CORP_NEUTRAL_GREETING_02:0 "[From.GetSpeciesNamePlural], đến lúc bàn chuyện làm ăn rồi."
 CORP_NEUTRAL_GREETING_03:0 "[From.GetSpeciesNamePlural]! Có muốn trải nghiệm chuyến tham quan thực tế ảo nhà bóng trong văn phòng chúng tôi không?"
 CORP_NEUTRAL_GREETING_04:0 "[From.GetSpeciesNamePlural], trên đời này đồ tốt thì không miễn phí. Nhưng ở [Root.GetName], chúng lại rất rẻ."
 CORP_CORP_NEUTRAL_GREETING_01:0 "[From.GetName], chiến lược tiếp thị dạo này của các người hiệu quả phết! Chúng tôi rất có sự đồng cảm đấy."
 CORP_THREATENED_GREETING_01:1 "Vũ trụ bao la, tài nguyên bát ngát; nước sông không phạm nước giếng. Nếu dám dùng vũ lực xâm phạm, đừng trách chúng tôi không báo trước."
 CORP_FRIENDLY_GREETING_02:0 "Chà, [From.GetSpeciesNamePlural]. Trông có vẻ là một đối tác làm ăn rất tuyệt đây."
 CORP_CORP_FRIENDLY_GREETING_01:1 "[From.GetName], dạo này sao rồi? Chuyện làm ăn vẫn đều đều chứ?"
 CORP_WAR_GREETING_02:0 "Thay mặt bộ phận kiểm định chất lượng, xin cảm ơn các người, [From.GetSpeciesNamePlural], nhờ các người mà chúng tôi có cơ hội thử nghiệm vũ khí như mong đợi từ lâu."
 CORP_WAR_GREETING_03:1 "[From.GetSpeciesNamePlural], thiết kế tàu mới của chúng tôi thế nào? Hàng chuẩn không cần chỉnh, giao tận nơi. [Root.GetName] chúng tôi luôn hết lòng phục vụ."
 CORP_WAR_GREETING_04:1 "[Root.GetName] là nhà phát triển và sản xuất thiết bị phòng thủ mang tính đột phá hàng đầu cả thiên hà. Các người sẽ sớm nhận ra, cam kết về chất lượng của chúng tôi không phải lời nói suông."
 CORP_CORP_WAR_GREETING_01:1 "[From.GetName], chúng tôi đến để giành thị phần của các người đây. Khi mọi chuyện ngã ngũ, sẽ chẳng ai còn nhớ đến các người nữa. Dân cả thiên hà sẽ chỉ phát cuồng vì sản phẩm của [Root.GetAdj] thôi!"
 CORP_CORP_WAR_GREETING_02:0 "Chúng tôi sẽ khiến các người dẹp tiệm luôn, [From.GetName]."
 CORP_OVERLORD_GREETING_01:2 "[From.GetSpeciesNamePlural]! Chúng tôi vừa đánh giá hiệu suất của các người theo tiêu chuẩn D.O.R.P, và rất vui mừng thông báo: Các người đã §Gđạt chỉ tiêu§!!! Hãy tiếp tục phát huy nhé!"
 CORP_OVERLORD_GREETING_02:1 "Đừng hỏi các người có thể làm gì cho công ty, mà hãy hỏi công ty có thể làm gì cho các người, [From.GetSpeciesNamePlural]. Chúng tôi trao quyền đó cho các người ngay tại đây."
 CORP_VASSAL_GREETING_01:1 "Chúng tôi là những học trò khát khao kiến thức, là niềm hy vọng của tương lai, tràn trề sức sống! Còn ngài là vị cố vấn đáng kính, là lãnh đạo, là tiếng vọng của quá khứ..."
 CORP_VASSAL_GREETING_02:1 "[From.GetSpeciesNamePlural], ngài đã xem báo cáo lợi nhuận quý này của chúng tôi chưa? Dự đoán quý sau sẽ còn cất cánh bay cao hơn nữa!"
 CORP_VASSAL_GREETING_DISLOYAL_01:1 "[From.GetSpeciesNamePlural], các người đang giở trò gì thế? [From.GetName] là một trong những cỗ máy kiếm tiền xịn nhất đấy. Rốt cuộc các người lấy cái gì ra để đàm phán với chúng tôi?"
 CORP_VASSAL_DOMINEERING_01:3 "Chúng tôi đã làm chủ thị trường, [From.GetSpeciesNamePlural]. Cứ học theo chúng tôi thì các người cũng sẽ thành công thôi."
 CORP_DOW_PROPOSE_01:1 "Á chà, [Root.GetSpeciesNamePlural]... Các người vẫn còn ở đây sao! Hay là để hạm đội của chúng tôi tiễn các người... chầu diêm vương nhé?"
 CORP_DOW_PROPOSE_02:0 "Có cạnh tranh lành mạnh thì mới có tiến bộ chứ."
 CORP_DOW_PROPOSE_03:0 "[Root.GetSpeciesNamePlural], đừng để bụng nhé. Chỉ là chuyện làm ăn thôi mà."
 CORP_VASSAL_DOW_PROPOSE_01:1 "[Root.GetSpeciesNamePlural]! Với tư cách là công ty mẹ của chúng tôi, chúng tôi đã đánh giá lại những điểm yếu của ngài, và vô tình phát hiện ra một lỗ hổng trong hệ thống phòng thủ của ngài..."
 CORP_DOW_ACCEPT_01:1 "Nếu các người đã muốn khai chiến với [From.GetName], vậy thì chuẩn bị tinh thần đón nhận chiến tranh toàn diện đi! Chúng ta được ăn cả ngã về không."
 CORP_DOW_ACCEPT_02:0 "[Root.GetSpeciesNamePlural], chuẩn bị thanh lý tài sản đi là vừa."
 CORP_DOW_ACCEPT_03:0 "Quý khách đáng mến! Ở [From.GetName], yêu cầu gì cũng chiều được tất. Chúng tôi luôn sẵn sàng mang đến trải nghiệm tùy chỉnh dành riêng cho khách hàng. Hạm đội chuẩn bị!"
 CORP_CONSIDER_01:1 "Quý khách đáng mến! Chúng tôi đang nỗ lực hết mình để đánh giá yêu cầu của ngài."
 CORP_CONSIDER_02:0 "Quý khách đáng mến! Trong lúc chúng tôi xem xét yêu cầu, ngài có thể bớt chút thời gian điền vào bảng khảo sát tín nhiệm của chúng tôi không? Chỉ tốn vài phút thôi! Ý kiến của ngài vô cùng quý giá với chúng tôi!"
 CORP_PEACE_PROPOSE_01:1 "Có phải chúng ta nên bỏ xó mớ thiết bị hiện tại và đổi sang đồ ngon có bảo hành không nhỉ?"
 CORP_PEACE_PROPOSE_02:0 "Rốt cuộc thì chúng ta nhận ra chiến tranh chẳng thể giải quyết thâm hụt ngân sách. Chúng tôi đề nghị đình chiến vô thời hạn."
 CORP_PEACE_PROPOSE_03:1 "[Root.GetSpeciesNamePlural], cứ đánh tiếp cũng chẳng ích gì cho cả hai, cớ sao phải ném tiền qua cửa sổ thế?"
 CORP_PEACE_PROPOSE_04:0 "Cuộc xung đột này đã vượt quá mục đích ban đầu rồi, chúng tôi đã thu thập đủ dữ liệu để chứng minh tính ưu việt của sản phẩm. Giờ là lúc quay lại với hòa bình."
