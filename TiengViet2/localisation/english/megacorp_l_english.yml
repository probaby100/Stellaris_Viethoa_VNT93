 CORP_CORP_ITOA_PROPOSE_01:0 "[From.GetName]! Hai ta mà bắt tay nhau thì chắc chắn sẽ không đối thủ nào theo kịp, tha hồ mà thao túng thị trường. Giờ mọi sự tùy thuộc vào ngài."
