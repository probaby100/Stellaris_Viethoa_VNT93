 CORP_PEACE_ACCEPT_01:2 "[Root.GetSpeciesNamePlural], cục diện chiến trường hiện đang nghiêng về phía các người. Nhưng chỉ có hòa bình mới giúp chúng ta cùng nhau hái ra tiền."
