# To Corporation Diplomacy
 DEMAND_SUBS_SELECT_01:0 "Bạn có muốn đề nghị [Root.GetName] trở thành công ty con của bạn không?"
 DEMAND_SUBS_ACCEPT_01:1 "Với tư cách là công ty con, [Root.GetName] sẽ trích một phần doanh thu thương mại cống nạp cho bạn. Đổi lại, chúng tôi mong bạn sẽ bảo vệ sinh mạng, quyền tự do và sự độc lập của [Root.GetSpeciesNamePlural]."
 DEMAND_SUBS_REFUSE_01:0 "Dù thế nào đi nữa, [Root.GetName] cũng không đời nào chịu làm miếng mồi béo bở cho [From.GetSpeciesAdj] bóc lột đâu."
 ASK_FOR_SUBS_PROPOSE_01:0 "[Root.GetName] cần sự bảo kê từ quân đội. Xin hãy thu nạp chúng tôi làm công ty con của [From.GetAdj], thân làm thuộc hạ trung thành, chúng tôi sẽ chia chác hoa hồng buôn bán cho bạn."
 TO_CORP_HOSTILE_GREETING_01:0 "Ái chà, là [From.GetName] đây mà. Để ta đoán xem, có vụ làm ăn nào muốn bàn à?"
 TO_CORP_HOSTILE_GREETING_02:0 "Ô hay, chẳng phải là [From.GetName] sao. Hôm nay tính giở trò gì đây? Định múa mép lừa đảo, chôm chỉa thứ gì, hay lại hứa lèo với chúng tôi?"
 TO_CORP_HOSTILE_GREETING_03:0 "Ờ, ra là bạn... Tự vác xác cút đi chỗ khác được không?"
 TO_CORP_HOSTILE_GREETING_04:0 "[From.GetName], [Root.GetName] không phải để bán."
 TO_CORP_HOSTILE_GREETING_05:0 "$CORP_HOSTILE_GREETING_01$"
 TO_CORP_HOSTILE_GREETING_06:0 "$CORP_HOSTILE_GREETING_02$"
 TO_CORP_GREETING_HOSTILE_EG_01:0 "[From.GetName], chủ nghĩa tư bản chẳng qua cũng chỉ là tảng đá lót đường tiến tới xã hội không giai cấp mà thôi."
 TO_CORP_NEUTRAL_GREETING_01:0 "Chào [From.GetName]. Dạo này làm ăn thế nào?"
 TO_CORP_NEUTRAL_GREETING_02:0 "Chào, [From.GetName]! Hệ thống phiên dịch của chúng tôi có vẻ hơi chập cheng. Bạn vừa bảo muốn sờ thử căn cứ của chúng tôi á?"
 TO_CORP_THREATENED_GREETING_01:0 "Chào [From.GetName]. Hy vọng bạn sẽ để mắt tới tiềm năng vô bờ bến của thị trường [Root.GetAdj]."
 TO_CORP_FRIENDLY_GREETING_01:0 "[From.GetName], chúng tôi vừa xem đoạn quảng cáo dạo gần đây của bạn, cạn lời luôn, cứ lấy tiền của tôi đi!"
 TO_CORP_FRIENDLY_GREETING_02:0 "[From.GetName], hôm nay quả là ngày đẹp trời để buôn bán nhỉ? Năng lượng, Năng lượng, Năng lượng... nghe êm tai như âm nhạc vậy."
 TO_CORP_FRIENDLY_GREETING_03:0 "Chào [From.GetName]! Dạo này làm ăn ra sao, có trúng quả đậm nào không, túi tiền có dày thêm tấc nào chưa?"
 TO_CORP_WAR_GREETING_01:0 "[From.GetName], chuẩn bị cắt giảm ngân sách đi là vừa..."
 TO_CORP_WAR_GREETING_02:0 "[From.GetName], mấy chiêu xả hàng tồn kho của bạn làm chúng tôi hứng thú phết. Vài hành tinh của bạn trông cũng được đấy..."
 TO_CORP_WAR_GREETING_03:0 "[From.GetName], bóp nát tương lai của các bạn chính là nhiệm vụ trước mắt của chúng tôi..."
 TO_CORP_VASSAL_GREETING_01:0 "[From.GetName], nhổ neo thôi, vì [Root.GetName] 100% sẽ luôn kề vai sát cánh cùng bạn!"
 TO_CORP_VASSAL_GREETING_DISLOYAL_01:0 "[From.GetName], dạo gần đây chúng tôi có cảm giác bạn đang diễn trò mèo mả gà đồng để moi Năng lượng của chúng tôi..."
 TO_CORP_VASSAL_DOMINEERING_01:0 "[From.GetName], có những thứ tiền không mua được đâu, banh mắt ra mà học hỏi đi."
 TO_CORP_DOW_PROPOSE_01:0 "[Root.GetName] chính là mối hiểm họa đối với mọi sinh vật có trí tuệ. Trước khi cái cõi ngân hà này nát bét về mặt đạo đức, lũ cặn bã các người phải bị quét sạch."
 TO_CORP_DOW_PROPOSE_02:0 "[From.GetName] sẽ không nhắm mắt làm ngơ trước những hành vi đê tiện của các người nữa, đồng thời cũng tuyệt đối không để các người tiếp tục bòn rút tài nguyên chung của ngân hà."
 TO_CORP_DOW_PROPOSE_03:0 "Sự tồn tại của [Root.GetName] là một vết nhơ. Bọn ta không thể dung thứ cho đám rác rưởi các người lảng vảng trong hệ sao này thêm phút giây nào nữa."
 TO_CORP_DOW_PROPOSE_04:0 "[Root.GetName], nói toẹt ra luôn nhé, cái vũ trụ này chả cần đến 'dịch vụ' của các người nữa đâu..."
 TO_CORP_INSULT_FRIENDLY_01:0 "[From.GetName], cái quái gì thế? Chúng tôi vừa mới nghía qua mấy phi vụ làm ăn dạo gần đây của các bạn! Định lên trời luôn hả!"
 TO_CORP_INSULT_NEUTRAL_01:0 "Này [From.GetSpeciesNamePlural], nói thẳng cho nhanh. Nếu các người định giở trò làm ăn kiểu đấy ở [From.GetName], thì chúng tôi xin rút, chả hứng thú."
 TO_CORP_INSULT_HOSTILE_01:0 "[From.GetName], nói thật lòng nhé. Chúng tôi ngán ngẩm cái doanh nghiệp xoàng xĩnh của mấy người đến tận cổ rồi."
 TO_CORP_INSULT_PROPOSE_01:0 "[Root.GetName], hệ sao này không phải bãi rác để các người xả bậy. Cái thứ rác rưởi các người gán mác hàng hóa ấy, tự mà giữ lấy."
 TO_CORP_INSULT_PROPOSE_02:0 "Hàng hóa của [Root.GetName] à... từ kệ ném thẳng vào thùng rác là đúng bài..."
 TO_CORP_INSULT_PROPOSE_EG_01:0 "Sự tồn tại của bạn là minh chứng sống cho sự thối nát tận gốc rễ của chủ nghĩa tư bản. Năng lượng chả giúp các người ngóc đầu lên nổi đâu, [Root.GetName] ạ."
 TO_CORP_INSULT_ACCEPT_FRIENDLY_01:0 "Ha! Thú vị thật. Bạn bè đùa giỡn nhau chút đỉnh chắc không sứt mẻ gì đâu nhỉ?"
 TO_CORP_INSULT_ACCEPT_FRIENDLY_02:0 "À, mồm mép tép nhảy phết nhỉ! Chọc cười chúng tôi thành công rồi đấy. Thôi, vui đủ rồi, quay lại chuyện làm ăn nào..."
 TO_CORP_INSULT_ACCEPT_01:0 "Bọn [From.GetName] rặt một lũ lừa đảo và điệp viên thương mại! Chẳng mấy chốc [Root.GetName] sẽ bóc mẽ bộ mặt thật của các người cho bàn dân thiên hạ xem."
 TO_CORP_INSULT_ACCEPT_02:0 "[From.GetName] chiến lược kinh doanh của bạn dị hợm thật... đi gây thù chuốc oán với chính khách hàng tiềm năng của mình..."
 TO_CORP_INSULT_ACCEPT_03:0 "[From.GetName], cái thói vô liêm sỉ đó sẽ khiến các người phải trả một cái giá đắt đấy. Cứ chờ đó mà xem."
 TO_CORP_INSULT_ACCEPT_04:0 "Các người sẽ sớm nếm mùi thế nào là khủng hoảng truyền thông."
 TO_CORP_MAKE_RIVAL_01:0 "[From.GetSpeciesNamePlural], các người có gánh nổi hậu quả khi để vuột mất mối làm ăn với chúng tôi không?"

# Corporate Diplomacy
 CORP_HOSTILE_GREETING_01:1 "[From.GetName], biến đi cho khuất mắt. [Root.GetSpeciesNamePlural] không hề cần đám rác rưởi tạp nham các người."
 CORP_HOSTILE_GREETING_02:0 "Đi đi, chúng ta không có gì để nói đâu, [From.GetName]."
