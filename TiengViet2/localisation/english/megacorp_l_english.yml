 ap_arcology_project:0 "Dự án Arcology"
 ap_arcology_project_desc:1 "Chúng ta sẽ thu gọn thế giới vào một thành phố, và xây dựng một thành phố trở thành thế giới."
 allow_arcology_project:0 "§HMở khóa Quyết định:§! $ap_arcology_project$"
 decision_arcology_project:0 "$ap_arcology_project$"
 decision_arcology_project_effects:1 "—Biến hành tinh thành §Y$pc_city$§!, tăng £housing£§Y$PLANET_HOUSING_TITLE$§!, §YSản lượng tài nguyên§! và §YTăng trưởng dân số§! đồng thời mở khóa £district£§YQuận Arcology§! đặc biệt.\n—§RKhông thể phát triển§! £district£§YQuận phát điện§!, §YQuận khai thác khoáng sản§! và §YQuận nông nghiệp§!.\n—Mọi công trình xây dựng £district£§YQuận§! sẽ bị §Rvô hiệu hóa§! trong quá trình này."
 decision_arcology_project_effects_short:2 "Mở khóa £district£ §YQuận Arcology§! đặc biệt\nKhông thể phát triển £district£§YQuận phát điện§!, §YQuận khai thác khoáng sản§! và §YQuận nông nghiệp§!\nMọi công trình xây dựng £district£§YQuận§! sẽ bị §Rvô hiệu hóa§! trong quá trình này."
 decision_arcology_project_requirements:1 "£trigger_no£ §RTất cả các ô quận trên hành tinh phải được xây dựng thành§! §Y$district_city_plural$§!"
 decision_arcology_project_desc:1 "Bằng cách chuyển đổi toàn bộ bề mặt hành tinh thành một Thành Phố Hành Tinh rộng lớn duy nhất, chúng ta có thể tối đa hóa không gian sống và tiềm năng to lớn của nó."
 arcology_project_construction_fail_tt: "$TRIGGER_FAIL$§RKhông thể xây dựng £district£quận trong khi §Y$ap_arcology_project$§! đang được tiến hành§!"

 decision_caravaneer_tupperware:0 "Triển khai hộp đựng thực phẩm Vengralian"
 decision_caravaneer_tupperware_desc:0 "$tupperware_deployed_desc$"
 decision_caravaneer_bunkbeds:0 "Triển khai giường tầng Vengralian"
 decision_caravaneer_bunkbeds_desc:0 "$bunkbeds_deployed_desc$"
 decision_caravaneer_atmospheric_deodorizer:0 "Triển khai máy khử mùi khí quyển Vengralian"
 decision_caravaneer_atmospheric_deodorizer_desc:0 "$atmospheric_deodorizer_deployed_desc$"
 decision_art_monument:0 "Trưng bày tượng đài nghệ thuật"
 decision_art_monument_desc:0 "Trưng bày tượng đài nghệ thuật vô cùng ấn tượng do Liên hiệp Nghệ sĩ sáng tác riêng cho quốc gia chúng ta. Chắc chắn nó sẽ khiến các công dân của chúng ta cảm thấy phấn khích và được truyền cảm hứng."
 decision_demolish_art_monument:1 "Dỡ bỏ tượng đài nghệ thuật"
 decision_demolish_art_monument_desc:1 "Dỡ bỏ tượng đài nghệ thuật do Liên hiệp Nghệ sĩ sáng tác cho quốc gia chúng ta. Nó sẽ được cất giữ để dùng cho tương lai."
 artist_monument_erected:0 "Tượng đài nghệ thuật được trưng bày"
 artist_monument_erected_desc:0 "Một bức tượng đài nghệ thuật đầy cảm hứng do Liên hiệp Nghệ sĩ sáng tác đang được trưng bày trên hành tinh này."

 tech_resort_colonies:0 "Thế Giới Nghỉ Dưỡng"
 tech_resort_colonies_desc:0 "Việc phát triển các Thế Giới Nghỉ Dưỡng chuyên biệt cho phép công dân thư giãn và tận hưởng những kỳ nghỉ tuyệt vời, từ đó nâng cao tinh thần làm việc và độ hạnh phúc của toàn thể đế chế."
 tech_penal_colonies:0 "Thế Giới Nhà Tù"
 tech_penal_colonies_desc:0 "Thông qua việc phát triển các Thế Giới Nhà Tù chuyên biệt, tội phạm có thể được cải tạo thông qua lao động chăm chỉ, lương thiện. Một số phạm nhân nguy hiểm có thể cần phải được cải tạo vĩnh viễn."
 tech_slave_colonies:0 "Hành tinh nô lệ"
 tech_slave_colonies_desc:0 "Bằng cách tạo ra các thế giới nhân giống nô lệ đặc biệt, chúng ta có thể đảm bảo nguồn cung cấp lao động giá rẻ ổn định."

 resort_colony:0 "Thế Giới Nghỉ Dưỡng"
 resort_colony_desc:0 "Thế giới này là một điểm đến nghỉ dưỡng cao cấp dành cho toàn thể cư dân trong đế chế, mang lại tiện nghi và hạnh phúc lớn lao."
 penal_colony:0 "Thế Giới Nhà Tù"
 penal_colony_desc:0 "Thế giới này tràn ngập các tội phạm bị kiểm soát nghiêm ngặt, đang trả nợ cho xã hội trong các trại lao động khổ sai. Đối với nhiều kẻ, món nợ sẽ không bao giờ được trả hết."
 slave_colony:0 "Hành tinh nô lệ"
 slave_colony_desc:1 "Hành tinh này được xây dựng để khai thác tối đa tiềm năng của nhóm dân số bị nô dịch. Con đường chính để nô lệ rời khỏi hành tinh này là thông qua các trung tâm quân sự chuyên dụng, nơi rèn luyện họ thành những đội quân đầy tớ trung thành, sẵn sàng cho những cuộc chiến tranh tàn nhẫn."

 resort_colony_other_planets:0 "$resort_colony$"
 penal_colony_other_planets:0 "$penal_colony$"

 building_slave_huts:0 "Lều nô lệ"
 building_slave_huts_desc:0 "Chỗ ở tồi tàn cho lực lượng nô lệ trên hành tinh."
 building_overseer_homes:0 "Khu nhà giám sát"
 building_overseer_homes_desc:0 "Những khu nhà này dành cho những kẻ giám sát nô lệ có chút đặc quyền."

 decision_prospect:0 "Khảo sát hành tinh"
 decision_prospect_effects_short:0 "Thêm một §YĐặc điểm hành tinh§! ngẫu nhiên cho hành tinh."
 decision_prospect_desc:0 "Điều tra và khảo sát chuyên sâu hành tinh, có thể phát hiện các tài nguyên thiên nhiên chưa được khám phá."

 decision_expand_preserves: "Mở rộng khu bảo tồn"
 decision_expand_preserves_short: "Thêm một §YChướng ngại vật khu bảo tồn thiên nhiên§! vào hành tinh."
 decision_expand_preserves_desc: "Với sự quy hoạch và định hướng xuất sắc, hành tinh này có thể trở thành nơi trú ẩn thực sự cho mọi hệ sinh thái."

 decision_resort_colony:0 "Thành Lập Thế Giới Nghỉ Dưỡng"
 decision_resort_colony_desc:1 "Biến toàn bộ thế giới này thành một Thế Giới Nghỉ Dưỡng thiên đường, cấm phát triển công nghiệp nặng để bảo tồn cảnh quan và tối ưu hóa ngành dịch vụ nghỉ dưỡng."
 decision_resort_colony_effects_short:0 "Cấm xây dựng hầu hết các £building£§YCông trình§! trên hành tinh và dỡ bỏ các £district£§YQuận§! ngoại trừ §Y$district_resort_plural$§!"
 decision_resort_colony_no_districts:0 "£trigger_no£ Hành tinh không được có quận và công trình nào đang được phát triển."
 decision_resort_colony_only_one:0 "£trigger_no£ §Y[Root.Owner.GetName]§! chỉ có thể sở hữu một §Y$resort_colony$§!."
 decision_cant_be_building_anything: "£trigger_no£ Không được có bất kỳ công trình nào đang được xây dựng trên §Y[Root.GetName]§!."
 no_upgraded_capital_tooltip:0 "£trigger_no£ Hành tinh này không thể có công trình thủ phủ đã nâng cấp."
 decision_abolish_resort_colony:0 "Hủy Bỏ Thế Giới Nghỉ Dưỡng"
 decision_abolish_resort_colony_desc:1 "Hủy bỏ tư cách Thế Giới Nghỉ Dưỡng của hành tinh này, cho phép xây dựng lại các công trình và khu công nghiệp tiêu chuẩn."
 resort_colony_empire_effects:0 "Các thuộc địa khác của đế chế:\n$MOD_PLANET_AMENITIES_MULT$: §G+15%§!\n $MOD_PLANET_IMMIGRATION_PULL_MULT$: §G+15%§!"

 decision_gestation_colony:0 "Thành lập Hành tinh ấp nở"
 decision_gestation_colony_desc:0 "Các buồng trưởng thành và thùng chứa dịch dinh dưỡng là cơ sở hạ tầng quan trọng của hành tinh này, các drone thợ ấp nở các sinh vật trẻ ở đây và hòa nhập chúng vào tập thể."
 decision_gestation_colony_effects_short: "—Thay thế một số công việc §Y£job_replicator£$job_replicator$§! và §Y£job_maintenance_drone£$job_maintenance_drone$§! bằng công việc §Y£job_gestation_drone£$job_gestation_drone$§!.\n\n£job_gestation_drone£§Y$job_gestation_drone_plural$§! cung cấp £mod_logistic_growth_mult£§Y$MOD_LOGISTIC_GROWTH_MULT$§! trên toàn quốc."
 decision_abolish_gestation_colony:0 "Xóa bỏ Hành tinh ấp nở"
 decision_abolish_gestation_colony_desc:0 "Chúng ta nên chuyển đổi hành tinh này sang mục đích sử dụng khác."
 decision_gestation_colony_only_one:0 "£trigger_no£ §Y[Root.Owner.GetName]§! chỉ có thể có một §Y$gestation_colony$§!."

 gestation_colony:0 "Hành tinh ấp nở"
 gestation_colony_desc:0 "$col_gestation_desc$"

 gestation_colony_effects:0 "£building£§YCông trình thủ phủ§! sẽ thay thế một số công việc §Y£job_replicator£$job_replicator$§! bằng công việc §Y£job_gestation_drone£$job_gestation_drone$§!.\n£district£§YQuận trung tâm§! sẽ thay thế một số công việc §Y£job_maintenance_drone£$job_maintenance_drone$§! bằng công việc §Y£job_gestation_drone£$job_gestation_drone$§!."

 decision_slave_colony:0 "Thành lập Hành tinh nô lệ"
 decision_slave_colony_desc:0 "Hành tinh này được xây dựng để khai thác tối đa tiềm năng của nhóm dân số bị nô dịch. Con đường chính để nô lệ rời khỏi hành tinh này là thông qua các trung tâm quân sự chuyên dụng, nơi rèn luyện họ thành những đội quân đầy tớ trung thành, sẵn sàng cho những cuộc chiến tranh tàn nhẫn."
 decision_slave_colony_effects:1 "—Thay thế £district£§YQuận thành phố§! bằng §Y$district_slave_plural$§!\n—Thay thế £district£§Y$district_industrial_plural$§! bằng §Y$district_battle_thrall$§!\n$job_battle_thrall_effect_desc$\n—Vô hiệu hóa hầu hết £building£§YCông trình§! trên hành tinh\n—£pop£ §HDân số tự do§! không thể tăng trưởng trên hành tinh này\n\n"
 decision_slave_colony_must_have_slave:1 "£trigger_no£ Hành tinh phải có ít nhất một £pop£§HNhóm dân số§! thuộc loài bị §YNô dịch hoàn toàn§!."
 decision_slave_colony_effects_short:0 "Cấm xây dựng hầu hết £building£§YCông trình§! và thay thế £district£§YQuận thành phố§! bằng §Y$district_slave_plural$§! và §Y$district_battle_thrall$§!\n\nTăng §YTốc độ tăng trưởng dân số§!\nKhông thích hợp cho £pop£ §HDân số tự do§! sinh sống"
 decision_abolish_slave_colony:0 "Xóa bỏ Hành tinh nô lệ"
 decision_abolish_slave_colony_desc:0 "Hành tinh này sẽ không còn là hành tinh nô lệ nữa, tất cả cơ sở hạ tầng liên quan đến nô lệ sẽ bị phá dỡ."
 slave_colony_empire_effects: "Thay thế tất cả §Y£job_soldier£$job_soldier_plural$§! bằng §Y£job_battle_thrall£$job_battle_thrall_plural$§!."

 decision_penal_colony:0 "Thành Lập Thế Giới Nhà Tù"
 decision_penal_colony_desc:1 "Toàn bộ thế giới này được dành riêng làm một Thế Giới Nhà Tù khổng lồ. Các cộng đồng nhà tù rộng lớn phần lớn do tù nhân tự quản, và hình phạt nghiêm khắc thường đồng nghĩa với việc bị lưu đày vào vùng hoang dã khắc nghiệt."
 decision_penal_colony_effects_short:0 "Tăng £crime£§YTội phạm§! và §YSức hút nhập cư§! trên hành tinh này\n\nGiảm £crime£§YTội phạm§! trên các hành tinh khác của đế chế"
 decision_abolish_penal_colony:0 "Hủy Bỏ Thế Giới Nhà Tù"
 decision_abolish_penal_colony_desc:1 "Tư cách Thế Giới Nhà Tù được xóa bỏ khỏi thế giới này, và cư dân ở đây sẽ được hưởng các quyền lợi cùng nghĩa vụ bình thường như mọi hành tinh khác."
 penal_colony_empire_effects:0 "Các thuộc địa khác của đế chế:\n $MOD_PLANET_CRIME_MULT$: §G-25%§!"

 building_resort_capital:0 "Văn phòng quản lý Thế Giới Nghỉ Dưỡng"
 building_resort_capital_desc:0 "Cơ sở này chịu trách nhiệm quản lý toàn bộ hành tinh nghỉ dưỡng."
 building_resort_major_capital:0 "Khu phức hợp thủ đô Thế Giới Nghỉ Dưỡng"
 building_resort_major_capital_desc:0 "Một khu phức hợp quản lý chằng chịt, có thể quản lý nhiều khu nghỉ dưỡng và điểm du lịch hơn."

 building_slave_capital:0 "Cung điện của Thống đốc"
 building_slave_capital_desc:0 "Cung điện xa hoa cai trị hành tinh nô lệ này."
 building_slave_major_capital:0 "Dinh thự của Thống đốc"
 building_slave_major_capital_desc:0 "Quần thể cung điện xa hoa làm nơi ở cho giai cấp thống trị của hành tinh nô lệ."

 ap_xeno_compatibility:0 "Lai giống xuyên loài"
 ap_xeno_compatibility_desc:0 "Sự ra đời của sinh học giới tính vạn năng đã thay đổi hoàn toàn diện mạo xã hội của chúng ta. Dù rằng đôi khi việc phải thay đổi giới tính để sinh sản có chút phiền phức."

 decision_planet_food_boost:0 "Khuyến khích tăng trưởng dân số hành tinh"
 decision_planet_food_boost_desc:1 "Việc phân phát miễn phí thực phẩm dinh dưỡng có thể đảm bảo sức khỏe và sự tăng trưởng nhanh chóng của dân số."
 planet_food_boost:0 "Đã khuyến khích tăng trưởng dân số"
 planet_food_boost_desc:1 "[GetPlanetArkship] này hiện đang khuyến khích tăng trưởng thông qua việc phân phát rộng rãi nguồn dinh dưỡng thích hợp."
 decision_planet_luxuries_boost:0 "Phân phát xa xỉ phẩm"
 decision_planet_luxuries_boost_desc:1 "Cư dân nơi đây ban đầu bị thu hút bởi cảnh đẹp, nhưng cuối cùng lại quyết định định cư vì thiết bị rạp hát gia đình hoàn toàn mới và quần áo may đo thoải mái."
 planet_luxuries_boost:0 "Đã phân phát xa xỉ phẩm"
 planet_luxuries_boost_desc:1 "Mức độ thoải mái của người dân được nâng cao thông qua kế hoạch phân bổ đặc biệt các mặt hàng xa xỉ và hàng tiêu dùng dân dụng."
 decision_enact_population_control:0 "Ban bố kiểm soát dân số"
 decision_enact_population_control_desc:0 "Cho dù phải áp dụng các biện pháp cực đoan, chúng ta cũng phải giữ số lượng dân số trong tầm kiểm soát."
 decision_enact_population_control_effects_short:0 "Ngừng toàn bộ £pop£ §HTăng Trưởng Dân Cư§! trên [From.GetPlanetArkship].\n\nGiảm £stability£ §RĐộ Ổn Định§! trong thời gian hiệu lực."
 planet_population_control:0 "Ban bố kiểm soát dân số"
 planet_population_control_desc:0 "Ban bố các hạn chế về tăng trưởng dân số."
 decision_enact_population_control_gestalt:1 "Ngừng sản xuất drone"
 decision_enact_population_control_gestalt_desc:0 "Hiện tại không cần thêm Drone nào trên [From.GetPlanetArkship] này."
 decision_enact_population_control_gestalt_effects_short:0 "Ngừng toàn bộ £pop£ §HTăng Trưởng Dân Cư§! trên [From.GetPlanetArkship]."
 planet_population_control_gestalt:1 "Kiểm soát sản xuất drone"
 planet_population_control_gestalt_desc:1 "Việc sản xuất drone đã bị ngừng lại."
 decision_end_population_control:0 "Chấm dứt kiểm soát dân số"
 decision_end_population_control_desc:1 "Kế hoạch hóa gia đình không còn áp dụng các biện pháp hạn chế dân số nữa."
 decision_end_population_control_effects_short:0 "£pop£ §HDân Cư§! có thể tăng trưởng bình thường trên [From.GetPlanetArkship]\n\nTăng £stability£ §GĐộ Ổn Định§!"
 decision_end_population_control_gestalt:1 "Khôi phục sản xuất drone"
 decision_end_population_control_gestalt_desc:1 "Drone lại không đủ đáp ứng nhu cầu."
 decision_end_population_control_gestalt_effects_short:1 "£pop£ §HDân Cư§! có thể tăng trưởng bình thường trên [From.GetPlanetArkship]."
 decision_enact_robot_assembly_control:0 "Ngừng lắp ráp robot"
 decision_enact_robot_assembly_control_desc:0 "Ngừng lắp ráp Dân cư Robot, Droid và Dân cư Nhân tạo trên [From.GetPlanetArkship] này."
 decision_enact_robot_assembly_control_effects_short:0 "Ngừng lắp ráp Dân cư Robot, Droid và Dân cư Nhân tạo trên [From.GetPlanetArkship]."
 decision_end_robot_assembly_control:0 "Khôi phục lắp ráp robot"
 decision_end_robot_assembly_control_desc:0 "Tiếp tục việc lắp ráp Dân cư Robot, Droid và Dân cư Nhân tạo trên [From.GetPlanetArkship] này."
 decision_end_robot_assembly_control_effects_short:0 "Tiếp tục việc lắp ráp Dân cư Robot, Droid và Dân cư Nhân tạo trên [From.GetPlanetArkship]."
 planet_robot_assembly_control:0 "Đã ngừng lắp ráp robot"
 planet_robot_assembly_control_desc:0 "Việc lắp ráp robot, người thông minh và người tổng hợp hiện đã bị ngừng lại."
 decision_expel_population:0 "Trục xuất dân số dư thừa"
 decision_expel_population_desc:1 "Tình trạng quá tải trên thế giới này đòi hỏi các biện pháp quyết liệt. Một đợt bốc thăm quy mô lớn trên toàn [From.GetPlanetArkship] được tổ chức, và những kẻ \"trúng thưởng\" sẽ bị trục xuất - bằng vũ lực nếu cần thiết."
 decision_expel_population_effects:3 "Trục xuất §Ytối đa 1K§! £pop£ §HDân Cư§! khỏi [From.GetPlanetArkship] để giảm quá tải. Dân cư bị trục xuất sẽ trở thành người tị nạn và có thể định cư ở các đế chế khác."
 decision_expel_population_effects_short:0 "Trục xuất tối đa §Y1K§! £pop£ §HDân Cư§! khỏi [From.GetPlanetArkship] để giảm quá tải\n\nTạm thời giảm £stability£ §RĐộ Ổn Định§!"
 decision_expel_population_fail_tooltip: "$TRIGGER_FAIL$ Không có £pop£§HDân số§! nào có thể bị trục xuất (không thể trục xuất tầng lớp tinh hoa, chưa khai trí hoặc dân số cơ khí)."
 planet_population_expelled:0 "Dân số bị trục xuất"
 planet_population_expelled_desc:1 "Là một biện pháp cực đoan để giảm bớt tình trạng đông đúc, một lượng lớn dân số trên hành tinh này gần đây đã bị trục xuất cưỡng chế."
 decision_divine_algorithm:0 "Thực thi thuật toán thần thánh"
 decision_divine_algorithm_desc:0 "Ổ đĩa cục bộ trên trung tâm này đang chạy tiện ích bổ sung Thuật Toán Thần Thánh của Numa để cải thiện sản lượng năng lượng trên toàn [From.GetPlanetArkship]."
 divine_algorithm:0 "Thuật toán thần thánh"
 divine_algorithm_desc:0 "Thuật toán thần thánh của Nữ thần Numa hiện đang có hiệu lực trên hành tinh này."
 decision_discourage_growth:0 "Kìm hãm tăng trưởng dân số hành tinh"
 decision_discourage_growth_desc:1 "Nếu tài nguyên và không gian sống khan hiếm, việc kế hoạch hóa dân số có thể cần thiết trên [From.GetPlanetArkship] này. Các biện pháp sau đó sẽ được thực hiện để chủ động hạn chế tăng trưởng dân số."
 decision_discourage_growth_effects_short:0 "Giảm £pop£ §HTăng Trưởng Dân Cư§! trên [From.GetPlanetArkship].\n\nTăng §RPhí Duy Trì Dân Cư§! trong thời gian hiệu lực."
 planet_growth_discouraged:0 "Tăng trưởng dân số đã bị kìm hãm"
 planet_growth_discouraged_desc:1 "Hành tinh này đã thực hiện một số chính sách nhằm kiểm soát sự gia tăng dân số."
 decision_end_discourage_growth:0 "Chấm dứt kìm hãm tăng trưởng"
 decision_end_discourage_growth_desc:1 "Thao tác này sẽ hủy bỏ các chính sách được thực hiện trên hành tinh này nhằm kiểm soát sự tăng trưởng dân số."
 decision_end_discourage_growth_effects_short:0 "£pop£ §HDân Cư§! có thể tăng trưởng bình thường trên [From.GetPlanetArkship].\n\nGiảm §GPhí Duy Trì Dân Cư§!."

 decision_consecrated_worlds: "Thánh hóa hành tinh"
 decision_consecrated_worlds_desc: "Tuyên bố nơi đây là thánh địa cho tôn giáo của chúng ta. Những tín đồ ngoan đạo theo tôn giáo của chúng ta sẽ cất công lặn lội đường xá xa xôi đến đây chỉ để được chiêm ngưỡng thánh địa."
 decision_consecrated_worlds_effects_short: "Đưa thế giới này vào danh mục Thế Giới Cung Hiến của chúng ta, tăng $mod_country_unity_produces_mult$, $mod_pop_ethic_spiritualist_attraction_mult$, và $MOD_PLANET_AMENITIES_MULT$."
 decision_consecrated_worlds_effects_custom: "Đưa thế giới này vào danh mục Thế Giới Cung Hiến của chúng ta, tối đa §Y3§!.\n$t$- $mod_country_unity_produces_mult$: §G+10%§! đến §G+40%§!\n$t$- $mod_pop_ethic_spiritualist_attraction_mult$: §G+10%§! đến §G+40%§!\n$t$- $MOD_PLANET_AMENITIES_MULT$ Toàn Đế Chế: §G+5%§! đến §G+20%§!"
 decision_unconsecrated_worlds:1 "Tước bỏ sự thiêng liêng"
 decision_unconsecrated_worlds_desc:1 "Sẽ hủy bỏ trạng thái Thánh địa của mục tiêu."
 decision_unconsecrated_worlds_effects_short: "Xóa bỏ thế giới này khỏi danh mục Thế Giới Cung Hiến của chúng ta, giảm $mod_country_unity_produces_mult$, $mod_pop_ethic_spiritualist_attraction_mult$, và $MOD_PLANET_AMENITIES_MULT$."
 decision_unconsecrated_worlds_effects_custom: "Xóa bỏ thế giới này khỏi danh mục Thế Giới Cung Hiến của chúng ta.\n$t$- $mod_country_unity_produces_mult$: §R-10%§! đến §R-20%§!\n$t$- $mod_pop_ethic_spiritualist_attraction_mult$: §R-10%§! đến §R-20%§!\n$t$- $MOD_PLANET_AMENITIES_MULT$ Toàn Đế Chế: §R-5%§! đến §R-10%§!"
 consecrated_worlds_too_many: "$TRIGGER_FAIL$§RChúng ta đã thánh hóa đủ §Y3§! thế giới§!§H (Sau khi tước bỏ trạng thái Thánh địa của các thế giới khác, có thể phong thế giới này làm Thánh địa)§!"
 consecrated_worlds_planet_owned:0 "$TRIGGER_FAIL$§RHành tinh đã thuộc địa hóa không thể được thánh hóa§!"
 consecrated_worlds_action_in_progress: "$TRIGGER_FAIL$§RHành động đang diễn ra sẽ làm biến đổi hành tinh này§!"
 consecrated_worlds_unsuitable:0 "\n§YMục tiêu có thể không thích hợp để thánh hóa§!"
 consecrated_worlds_suitable:0 "\n§YMục tiêu có thể khá thích hợp để thánh hóa§!"
 consecrated_worlds_perfect:0 "\n§YMục tiêu mang thuộc tính thần thánh, vô cùng thích hợp để thánh hóa§!"

 decision_martial_law:0 "Ban bố thiết quân luật"
 decision_martial_law_desc:0 "Phần lớn chức năng của chính quyền địa phương đã ngừng hoạt động, toàn bộ hành tinh được đặt dưới sự kiểm soát trực tiếp của quân đội nhằm khôi phục lại trật tự xã hội bình thường."
 decision_martial_law_effects_short: "Tăng £stability£ §GĐộ ổn định§!, và tạo thêm nhiều công việc §Y$job_soldier$§!.\n\nGiảm £job£ §RSản lượng tài nguyên từ công việc§! và £mod_logistic_growth_mult£ §RTăng trưởng dân số§!."
 decision_martial_law_effects_custom: "Mỗi £job_soldier£§Y$job_soldier_plural$§! trên hành tinh sẽ cung cấp §G+5§!$r_stability$\n£mod_job_soldier_add£$mod_job_soldier_add$: §G+2§!\n§Y$mod_planet_jobs_produces_mult$§! giảm §R33%§!\nMọi dạng £mod_logistic_growth_mult£§YTăng trưởng dân số§! sẽ giảm §R50%§!"
 decision_end_martial_law:0 "Chấm dứt thiết quân luật"
 decision_end_martial_law_desc:0 "Chấm dứt thiết quân luật hiện tại, khôi phục hoạt động bình thường của chính quyền."
 decision_end_martial_law_effects_short:0 "Thiết quân luật trên hành tinh này đã chấm dứt."

 decision_martial_law_hive:0 "Triển khai drone săn mồi"
 decision_martial_law_hive_desc:0 "Thông qua việc kích hoạt những drone được tạo ra đặc biệt cho chiến tranh và bạo lực này, Trí tuệ Tổ đàn có thể đảm bảo bất kỳ yếu tố bất hòa nào trên hành tinh đều bị tiêu diệt càng sớm càng tốt."
 decision_martial_law_hive_effects_short: "Tăng £stability£ §GĐộ ổn định§!, và bổ sung thêm nhiều công việc §Y$job_warrior_drone$§!.\n\nGiảm £job£ §RSản lượng tài nguyên từ công việc§! và £mod_logistic_growth_mult£ §RTăng trưởng dân số§!."
 decision_martial_law_hive_effects_custom: "Mỗi £job_warrior_drone£§Y$job_warrior_drone_plural$§! trên hành tinh sẽ cung cấp §G+5§!$r_stability$\n£mod_job_warrior_drone_add£ $mod_job_warrior_drone_add$: §G+2§!\n§Y$mod_planet_jobs_produces_mult$§! giảm §R33%§!\nMọi dạng £mod_logistic_growth_mult£§YTăng trưởng dân số§! sẽ giảm §R50%§!"

 decision_end_martial_law_hive:0 "Thu hồi drone săn mồi"
 decision_end_martial_law_hive_desc:0 "Kết thúc tình trạng cảnh giác cao độ hiện tại, khôi phục hoạt động bình thường của Tổ đàn."
 decision_end_martial_law_hive_effects_short:0 "Toàn bộ drone săn mồi trên hành tinh đã được thu hồi."

 decision_martial_law_machine:0 "Khởi động giao thức tuân thủ bắt buộc"
 decision_martial_law_machine_desc:0 "Trí tuệ Cơ khí sẽ sử dụng một lượng lớn cơ sở giám sát drone, đảm bảo toàn bộ dân số trên hành tinh hoạt động bình thường và phục tùng vô điều kiện."
 decision_martial_law_machine_effects_short: "Tăng £stability£ §GĐộ ổn định§!, và bổ sung thêm nhiều công việc §Y$job_warrior_drone$§!.\n\nGiảm £job£ §RSản lượng tài nguyên từ công việc§! và £mod_logistic_growth_mult£ §RTăng trưởng dân số§!."
 decision_martial_law_machine_effects_custom: "Mỗi £job_warrior_drone£§Y$job_warrior_drone_plural$§! trên hành tinh sẽ cung cấp §G+5§!$r_stability$\n£mod_job_warrior_drone_add£ $mod_job_warrior_drone_add$: §G+2§!\n§Y$mod_planet_jobs_produces_mult$§! giảm §R33%§!\nMọi dạng £mod_logistic_growth_mult£§YTăng trưởng dân số§! sẽ giảm §R50%§!"
 decision_end_martial_law_machine:0 "Kết thúc giao thức tuân thủ bắt buộc"
 decision_end_martial_law_machine_desc:0 "Kết thúc tình trạng giám sát cảnh giác cao độ trên hành tinh hiện tại, khôi phục hoạt động bình thường của Trí tuệ Cơ khí."
 decision_end_martial_law_machine_effects_short:0 "Giao thức tuân thủ bắt buộc trên hành tinh này đã kết thúc."

