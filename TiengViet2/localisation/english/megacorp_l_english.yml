 building_food_processing_facility_effect_desc:0 "Tăng §G1§! sản lượng cơ bản của các việc làm sản xuất £food£§YThực phẩm§!."
 building_food_processing_center_effect_desc:1 "Tăng §G2§! sản lượng cơ bản của các việc làm sản xuất £food£§YThực phẩm§!."
 building_mineral_purification_plant_effect_desc:0 "Tăng §G1§! sản lượng cơ bản của các việc làm sản xuất £minerals£§YKhoáng sản§!."
