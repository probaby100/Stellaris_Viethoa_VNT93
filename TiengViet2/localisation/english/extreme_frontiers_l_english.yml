l_english:

 #############
 # Anomalies #
 #############

 EXTREME_FRONTIERS_TITLE: "Tiền Đồn Rìa Cực" # Do not translate

 # PULSATING OBJECT
 PULSATING_OBJECT_TOXIC_CAT: "Vật Thể Nhấp Nháy"
 PULSATING_OBJECT_GAS_GIANT_CAT: "Vật Thể Nhấp Nháy"
 PULSATING_OBJECT_BARREN_CAT: "Vật Thể Nhấp Nháy"
 PULSATING_OBJECT_BARREN_COLD_CAT: "Vật Thể Nhấp Nháy"
 PULSATING_OBJECT_FROZEN_CAT: "Vật Thể Nhấp Nháy"
 PULSATING_OBJECT_MOLTEN_CAT: "Vật Thể Nhấp Nháy"
 anomaly_pulsating_object_desc: "Các lần quét ban đầu đối với §Y[this.GetName]§! đã phát hiện một vật thể bay kỳ lạ lơ lửng trong tầng đối lưu, phồng lên rồi co lại khi nó đổi vị trí. Cần tiến hành điều tra thêm để phân loại bản chất của nó."
 extreme_frontiers.100.title: "Khí Cầu Thời Tiết Cổ Đại"
 extreme_frontiers.100.desc: "§Y[Leader.GetName]§! đã xác định vật thể bay bí ẩn trên §Y[from.GetName]§! là một khí cầu thời tiết cổ xưa. Bất kỳ dấu hiệu nào có thể giúp xác định nguồn gốc của nó đều đã bị điều kiện khí quyển khắc nghiệt của hành tinh bào mòn từ lâu.\n\nĐịnh tuổi bằng đồng vị phóng xạ cho thấy nó đã hiện diện trong bầu khí quyển của [from.GetName] hơn một thế kỷ, biến động về kích thước khi trôi dạt vô định qua những biến thiên áp suất đặc thù của hành tinh.\n\nThật kỳ diệu, các tấm pin năng lượng mặt trời vẫn hoạt động và mảng cảm biến của nó hiện lưu giữ dữ liệu khí quyển quý giá tích lũy suốt một thế kỷ. Điều này sẽ mang lại sự thích thú lớn cho [Root.Owner.GetResearchers] của chúng ta."

 # MOLTEN METAL OCEAN
 MOLTEN_METAL_OCEAN_CAT: "Dòng Chảy Nóng Chảy Cực Độ"
 anomaly_molten_metal_ocean_desc: "Khảo sát ban đầu bề mặt §Y[from.GetName]§! đã phát hiện những đợt sóng thần dung nham siêu nóng xuất hiện thường xuyên chứa nồng độ kim loại nặng cao. Cần phân tích thêm để hiểu đầy đủ về hiện tượng này."
 extreme_frontiers.110.title: "Sóng Thần Kim Loại"
 extreme_frontiers.110.desc: "§Y[Leader.GetName]§! đã xác nhận rằng các đại dương dung nham trên §Y[from.GetName]§! chứa các dạng đặc biệt tinh khiết của hầu hết mọi á kim hiếm đã biết trong danh mục nguyên tố của chúng ta.\n\nSự tập trung dày đặc của kim loại lỏng này làm phát sinh các trường điện từ cực kỳ bất ổn, gây ra sự hình thành thường xuyên của những đợt sóng thần kim loại nóng chảy.\n\nSử dụng mô hình dự đoán, chúng ta đã xác định được những khoảng lặng ngắn nhưng đều đặn trong cường độ sóng, có thể tận dụng để khai thác các mỏ khoáng sản trù phú độc nhất vô nhị này."

 # GREAT BLUE SPOTS
 GREAT_BLUE_SPOTS_CAT: "Vết Lớn Màu Lam"
 great_blue_spots_desc: "Bề mặt của §Y[from.GetName]§! có hai vùng đổi màu đặc biệt, đủ lớn để nhìn thấy từ ngoài vũ trụ và di chuyển song hành với tốc độ cực nhanh. Những cấu trúc màu lam này đủ thú vị để bảo đảm cho một cuộc nghiên cứu sâu hơn."
 extreme_frontiers.120.title: "Siêu Bão Cộng Sinh"
 extreme_frontiers.120.desc: "Các vết lớn màu lam trên §Y[from.GetName]§! thực chất là một cặp siêu bão cộng sinh; một xoáy thuận và một xoáy nghịch duy trì lẫn nhau trong trạng thái cân bằng hoàn hảo.\n\nCác cơn bão có quy mô khổng lồ với tốc độ gió thường xuyên vượt bức tường âm thanh, tạo ra những tiếng nổ siêu thanh mạnh mẽ. Lượng lớn bụi coban hiện diện bên trong mang lại cho các vết bão màu sắc đặc trưng.\n\n§Y[Leader.GetName]§! ước tính chúng đã hoành hành liên tục tại đây hơn một thế kỷ. Các khoáng vật mà chúng tích tụ ở tầng trên khí quyển sẽ dễ dàng thu hồi được bằng một trạm khai khoáng."

 # FROZEN INFERNO
 FROZEN_INFERNO_CAT: "Đột Biến Nhiệt"
 frozen_inferno_desc: "Quét ban đầu đối với §Y[from.GetName]§! đang cho thấy các đợt tăng vọt nhiệt độ cực kỳ bất thường trên thiên thể vốn đóng băng này. Những nhiệt độ dị thường này đòi hỏi phải điều tra thêm."
 extreme_frontiers.130.title: "Địa Ngục Băng Giá"
 extreme_frontiers.130.desc: "§Y[Leader.GetName]§! đã kết thúc cuộc điều tra về các đợt tăng vọt nhiệt độ thất thường trên thế giới băng giá §Y[from.GetName]§!. Chôn vùi bên dưới vùng lãnh nguyên vô tận trên bề mặt hành tinh là những mỏ tự bốc cháy có tính phản ứng cao. Ban đầu được giữ trơ sâu dưới lớp băng, các chất này định kỳ được đẩy ngược lên trên khi các dải băng lục địa trôi dạt và vỡ vụn.\n\nTan chảy khi trồi lên bề mặt, những khí cực kỳ dễ cháy này có xu hướng bùng cháy đột ngột trong bầu khí quyển giàu oxy của [from.GetName], gây ra những đám cháy chớp nhoáng thường xuyên trên khắp bề mặt hành tinh.\n\nVới thiết bị chuyên dụng, các chất dễ cháy độc đáo này có thể được chiết xuất và đưa vào sử dụng ở nơi khác."

 # POISONED ATMOSPHERE
 POISONED_ATMOSPHERE_CAT: "Khí Quyển Nhiễm Độc"
 poisoned_atmosphere_desc: "Nồng độ cao của các phân tử hữu cơ độc hại đã được phát hiện ở tầng trên khí quyển của §Y[from.GetName]§!."
 extreme_frontiers.140.title: "Khí Quyển Nhiễm Độc"
 extreme_frontiers.140.desc.hive_mind: "§Y[from.GetName]§! là ngôi nhà của một loài địa y đáng kinh ngạc, chúng thải các phân tử cực độc vào khí quyển như một phương thức để tự bảo vệ trước các loài săn mồi.\n\nCác nghiên cứu về hồ sơ hóa thạch cho thấy [from.GetName] từng sở hữu hệ động vật phong phú, nhưng loài địa y này đã tiêu diệt dần theo thời gian bằng cách nâng dần mức asen và tali trong khí quyển nhanh hơn khả năng thích nghi của hầu hết sinh vật.\n\n§Y[Leader.GetName]§! phát hiện chỉ có một sinh vật sống khác, một loài bò sát lớn, có thể sống sót trong điều kiện như vậy nhờ một tuyến giải độc hiệu quả vượt trội.\n\nNghiên cứu sâu hơn về cơ quan kỳ diệu này có thể mang lại những hiểu biết sâu sắc về việc khử độc khí quyển."
 extreme_frontiers.140.desc.default: "$extreme_frontiers.140.desc.hive_mind$ Các thí nghiệm ban đầu cũng chỉ ra rằng các hợp chất độc đáo bên trong chất độc có thể được tái sử dụng trong ngành công nghiệp mỹ phẩm."
 extreme_frontiers.140.a: "Tiềm năng thật thú vị..."
 extreme_frontiers.140.b: "Chế biến nó thành nước hoa."
 DETOXIFICATION_GLAND_PROJECT: "Nghiên Cứu Tuyến Giải Độc"
 DETOXIFICATION_GLAND_PROJECT_DESC: "Một loài bò sát đáng chú ý đang phát triển mạnh mẽ trong bầu khí quyển độc hại của §Y[from.GetName]§!, nhờ một cơ quan nội tạng độc đáo có khả năng phân giải các chất độc cực mạnh thành chất dinh dưỡng hữu ích. Nghiên cứu thêm về sinh vật này sẽ là một nỗ lực xứng đáng."
 extreme_frontiers.145.title: "Hiểu Biết Giải Độc"
 extreme_frontiers.145.desc: "Thông qua nghiên cứu chuyên sâu về các tuyến bò sát trên §Y[from.GetName]§!, §Y[Leader.GetName]§! đã khám phá ra những bí mật sinh học về khả năng chống chịu đáng kinh ngạc của chúng trước độc tính của hành tinh.\n\nCơ quan phức tạp này sản sinh các hợp chất đóng vai trò là chất trung hòa bầu khí quyển độc hại, ngăn ngừa chất độc bị hấp thụ vào hệ tuần hoàn của loài bò sát. Tuyến có tính thích ứng cao này thậm chí có thể vô hiệu hóa những chất độc chết người nhất được tạo ra trong phòng thí nghiệm của chúng ta.\n\nNhững phát hiện phi thường này sẽ làm thay đổi căn bản các phương pháp tiếp cận của chúng ta đối với việc khử độc khí quyển."

 # GLIMPSE OF THE CORE
 GLIMPSE_CORE_CAT: "Cái Nhìn Vào Lõi"
 glimpse_the_core_desc: "Những chuyển động kỳ lạ trong các lớp khí bên ngoài của §Y[from.GetName]§! đang khiến những lỗ thông hơi đặc biệt sâu mở ra, làm lộ ra lõi rắn của hành tinh trong những khoảng thời gian ngắn. Hiện tượng đáng chú ý này bảo đảm cho một cuộc nghiên cứu sâu hơn."
 extreme_frontiers.150.title: "Lõi Hữu Cơ"
 extreme_frontiers.150.desc: "Bằng cách phóng một tàu thăm dò sâu vào một trong những lỗ thông hơi tạm thời trên §Y[from.GetName]§!, §Y[Leader.GetName]§! đã phát hiện ra rằng lõi của hành tinh là ngôi nhà của một loài sinh vật đơn bào không giống bất cứ thứ gì chúng ta từng thấy trước đây.\n\nNhững tế bào mạnh mẽ này dường như thích nghi hoàn hảo để sinh tồn dưới áp suất cực cao, với sự sinh sản theo mùa của chúng giải phóng một lượng hydro đáng kể. [Leader.GetName] đã kết luận rằng đây là cách các lớp khí hydro của hành tinh được duy trì.\n\nViệc tiêu diệt các sinh vật này sẽ làm tiêu tán các lớp khí bên ngoài này, để lại một hành tinh đá có thể định cư được."
 extreme_frontiers.150.a: "Tiêu diệt chúng."
 extreme_frontiers.150.b: "Một cơ hội quan sát độc nhất vô nhị."
 PURIFY_CORE_PROJECT: "Thanh Lọc Lõi Hành Tinh"
 PURIFY_CORE_PROJECT_DESC: "Các lớp khí bên ngoài của §Y[from.GetName]§! được duy trì bởi quá trình sinh hóa độc đáo của các sinh vật đơn bào cư ngụ trong lõi của nó. Việc tiêu diệt chúng sẽ làm tiêu tán các chất khí này, để lại cho chúng ta một hành tinh đá có thể định cư."
 extreme_frontiers.155.title: "Một Thế Giới Mới"
 extreme_frontiers.155.desc: "§Y[Leader.GetName]§! đã gửi một tàu thăm dò vũ trang vào một trong những khe hở trên bề mặt của §Y[from.From.GetName]§!. Khi đã vào tới lõi, một khối tải trọng độc hại đã được giải phóng, lây nhiễm và tiêu diệt các sinh vật đơn bào bản địa.\n\nChúng ta quan sát khi các lớp khí bên ngoài của [from.From.GetName] dần dần tiêu tan vào khoảng không vũ trụ, để lại một hành tinh đất đá nhỏ bé."
 extreme_frontiers.155.a: "Một kỳ tích ấn tượng."

 # OPTICAL PHENOMENA
 OPTICAL_PHENOMENA_CAT: "Bề Mặt Lấp Lánh"
 optical_phenomena_desc: "Quét hình ảnh đối với §Y[from.GetName]§! đang trả về những hiện tượng quang học cực kỳ rực rỡ trên bề mặt hành tinh, mặc dù nguyên nhân của những kiểu màu sắc này vẫn chưa rõ ràng ở khoảng cách quỹ đạo."
 extreme_frontiers.160.title: "Dải Băng Cầu Vồng"
 extreme_frontiers.160.desc.default: "Kiểm tra kỹ hơn bề mặt §Y[from.GetName]§! đã phát hiện ra nguyên nhân của hiện tượng quang học gặp phải trong các cuộc khảo sát quỹ đạo của chúng ta.\n\nĐiều kiện khí quyển đã mài nhẵn các phần lớn của lớp băng vĩnh cửu trên hành tinh thành một bề mặt bóng trong suốt, hé lộ các mạng lưới phát triển tinh thể nhiều màu sắc ẩn sâu bên dưới. Hiện tượng tự nhiên này tạo ra hiệu ứng vạn hoa khi quan sát từ xa."
 extreme_frontiers.160.desc.machine: "$extreme_frontiers.160.desc.default$\n\nDù có tính thẩm mỹ theo quy ước thông thường, các mỏ khoáng sản phong phú nằm bên trong mới là mục tiêu thực sự mà chúng ta chú ý."
 extreme_frontiers.160.tooltip: "Mở khóa §YQuyết Định Thuộc Địa§! §H$decision_prismatic_ice_exhibit$§! với các hiệu ứng sau:\n£amenities£ $MOD_PLANET_AMENITIES_MULT$: §G+25%§!\n$mod_planet_jobs_unity_produces_mult$: §G+25%§!"
 decision_prismatic_ice_exhibit: "Triển Lãm Băng Lăng Kính"
 decision_prismatic_ice_exhibit_desc: "Những phiến băng trong suốt như pha lê được khai thác tạo ra hiệu ứng vạn hoa đầy mê hoặc có thể đem ra trưng bày trong một thời gian có hạn."
 prismatic_ice_max_3_times_pass: "Có thể ban hành tối đa §Y3§! lần."
 prismatic_ice_max_3_times_fail: "$TRIGGER_FAIL$Có thể ban hành tối đa §Y3§! lần."
 prismatic_ice_max_3_times_pass_with_var: "$TRIGGER_PASS$$prismatic_ice_max_3_times_pass$ (hiện tại: §Y[owner.prismatic_ice_exhibit_happened]§!)"
 exhibiting_prismatic_ice: "Triển Lãm Băng Lăng Kính"
 exhibiting_prismatic_ice_desc: "Những phiến băng trong suốt như pha lê được khai thác tạo ra hiệu ứng vạn hoa đầy mê hoặc có thể đem ra trưng bày trong một thời gian có hạn."

 # PLASMA VOLCANOES
 PLASMA_VOLCANO_CAT: "Plasma Quỹ Đạo"
 plasma_volcano_desc: "Chúng ta có xác nhận bằng hình ảnh về các luồng plasma siêu nóng bất ổn được phóng vào tầng trên khí quyển của §Y[from.GetName]§!. Tro núi lửa dày đặc trong khí quyển đang ngăn cản chúng ta xác định nguồn gốc của các luồng phóng này từ quỹ đạo. Nghiên cứu gần hơn có thể sẽ rất nguy hiểm."
 extreme_frontiers.170.title: "Núi Lửa Plasma"
 extreme_frontiers.170.desc: "§Y[Leader.GetName]§! đã khám phá ra nguyên nhân của các đợt phun trào plasma siêu nóng trên §Y[from.GetName]§!. Từ trường độc đáo của hành tinh thúc đẩy một phản ứng giữa các vật liệu bị ion hóa sâu trong lớp phủ hành tinh, tạo ra các buồng núi lửa chứa plasma chịu áp suất cao.\n\nKhi các mảng kiến tạo không ổn định của hành tinh sụp đổ, plasma này bị đẩy lên cao một cách bùng nổ như một viên đạn chết người, bốc cháy với các khí trong khí quyển để tạo ra các vụ nổ thứ cấp. Các chuyên gia vũ khí của chúng ta rất muốn áp dụng các nguyên lý này vào vũ khí dựa trên plasma của riêng chúng ta."
 extreme_frontiers.170.desc.negative: "Thật không may, tính chất nguy hiểm của nghiên cứu này đã khiến [Leader.GetName] phải chịu đựng"
 extreme_frontiers.170.desc.traumatized: "$extreme_frontiers.170.desc.negative$ chấn thương tâm lý nghiêm trọng."
 extreme_frontiers.170.desc.maimed: "$extreme_frontiers.170.desc.negative$ những thương tích nặng nề trên cơ thể."

 # BLACK CLOUDS
 BLACK_CLOUDS_CAT: "Mây Đen Bí Ẩn"
 black_clouds_desc: "Những đám mây đen dày đặc đã được quan sát thấy trong bầu khí quyển của §Y[from.GetName]§!, di chuyển theo những hình thái thất thường không phụ thuộc vào tốc độ hay hướng gió của hành tinh. Chúng chỉ xuất hiện thoáng qua trên các lần quét hình ảnh của chúng ta và luôn ở cùng một thời điểm trong chu kỳ ngày-đêm của hành tinh."
 extreme_frontiers.180.title: "Bầy Côn Trùng Khổng Lồ"
 extreme_frontiers.180.desc: "Những đám mây đen bất thường trên §Y[from.GetName]§! thực chất là những đàn côn trùng ăn thịt lớn dày đặc.\n\nNhững kẻ săn mồi có cánh này làm tổ trong các khe nứt đá và túa ra mỗi ngày một lần để ngấu nghiến bất kỳ lượng vật chất hữu cơ ít ỏi nào có sẵn trên bề mặt hành tinh.\n\nNhờ quá trình trao đổi chất mạnh mẽ có thể đảo ngược sự phân rã tế bào khi ăn, những loài chân đốt này có thể kéo dài tuổi thọ vô thời hạn, miễn là chất dinh dưỡng được nạp vào đều đặn."
 extreme_frontiers.180.desc.altered_metabolism: "Trong quá trình phân tích thực địa, [Leader.Species.GetHandName] của [Leader.GetName] đã bị một trong các mẫu vật cắn, kích hoạt phản ứng trao đổi chất đáng kinh ngạc. Giống loài độc đáo này có nhiều điều để dạy cho chúng ta về khả năng tái tạo của tế bào hữu cơ."
 extreme_frontiers.180.b: "Khai quật và tiêu thụ tất cả chúng."
 leader_trait_altered_metabolism: "Chuyển Hóa Biến Đổi"
 leader_trait_altered_metabolism_desc: "Việc tiếp xúc với các tác nhân ngoại lai khi làm việc thực địa đã để lại tác động lâu dài đối với vị lãnh đạo này."

 # SUBGLACIAL VIBRATIONS
 SUBGLACIAL_VIBRATIONS_CAT: "Rung Chấn Dưới Băng"
 subglacial_vibrations_desc: "Bên dưới bề mặt đóng băng và không có sự sống của §Y[from.GetName]§! là một đại dương bao la dưới lớp băng. Những rung chấn trầm thấp, ầm ầm đã được phát hiện bên dưới lớp băng vĩnh cửu mà về bản chất không được ghi nhận là địa chấn."
 extreme_frontiers.190.title: "Động Vật Chân Màng Khổng Lồ"
 extreme_frontiers.190.desc: "Sự kết hợp giữa định vị bằng tiếng vang dưới biển sâu và viễn trắc địa chấn đã xác định được nguồn gốc của những rung chấn sâu trên §Y[from.GetName]§!. Đại dương nitơ lỏng dưới lớp băng của nó là nơi sinh sống của những đàn động vật chân màng khổng lồ đã thích nghi với cuộc sống trong môi trường khắc nghiệt này.\n\nNhững sinh vật đáng chú ý này có kích thước và khối lượng tương đương một chiếc tàu vận tải nhỏ. Để giao tiếp, chúng phát ra âm thanh vo ve tần số thấp mạnh mẽ có thể vang dội trên quy mô toàn hành tinh. Lớp mỡ đặc biệt giàu collagen bảo vệ chúng khỏi bị bỏng lạnh và tê cóng, đồng thời khuếch đại tiếng kêu của chúng truyền qua biển cả.\n\nKhông có bất kỳ kẻ săn mồi tự nhiên nào trong hệ sinh thái cô lập này, những loài động vật to lớn này rất tò mò, vô cùng thuần lành và có thể dễ dàng bị dẫn dụ lên bề mặt bằng cách mô phỏng những âm thanh đặc trưng của chúng."
 extreme_frontiers.190.a: "Một phát hiện độc đáo."
 extreme_frontiers.190.a.tt: "Mở khóa công trình: ['building:building_pinniped_sanctuary']"
 extreme_frontiers.190.b: "Con mồi béo bở."
 building_pinniped_sanctuary: "Khu Bảo Tồn Chân Màng"
 building_pinniped_sanctuary_desc: "Một khu bảo tồn dành cho những loài chân màng khổng lồ được bắt trong các đại dương nitơ lỏng của [event_target:pinnipeds_home_planet.GetName]."

 # ELECTRIC WATERS
 ELECTRIC_WATERS_CAT: "Vùng Nước Nhiễm Điện"
 electric_waters_desc: "Quét quỹ đạo của §Y[from.GetName]§! đang phát hiện các tín hiệu điện thất thường sâu trong các vùng biển băng giá của hành tinh.\n\nNghiên cứu thêm về hiện tượng thủy sinh này sẽ tiết lộ nhiều điều hơn."
 extreme_frontiers.200.title: "San Hô Điện Áp Cao"
 extreme_frontiers.200.desc: "Nguồn gốc của các dòng điện biển sâu trên §Y[from.GetName]§! đã được xác định bởi §Y[Leader.GetName]§!. Đáy đại dương là ngôi nhà của một loài san hô nước lạnh phức tạp có khả năng phát điện sinh học. Loài này sử dụng các bào quan chuyên biệt để tạo ra dòng điện nhằm thu hút các vi sinh vật vừa làm nguồn dinh dưỡng vừa làm phương tiện giao tiếp.\n\nCác tàu thăm dò khảo sát của chúng ta đang đóng vai trò như chất kích thích đối với san hô, loài này phản ứng bằng cách tăng sản lượng điện bất cứ khi nào chúng ta thay đổi tần số truyền tín hiệu.\n\nBằng cách điều chỉnh cẩn thận các tương tác của chúng ta với loài sinh vật nước sâu này, chúng ta có thể tăng sản lượng năng lượng của hành tinh mà không phá vỡ hệ sinh thái mong manh."

 # OBSIDIAN PLANET
 OBSIDIAN_PLANET_CAT: "Địa Cảnh Lấp Lánh"
 obsidian_planet_desc: "Các lần quét hình ảnh đối với §Y[from.GetName]§! cho thấy những dải đá hắc diện thạch quy mô lục địa bao phủ bề mặt cằn cỗi của hành tinh, với lượng lớn lưu huỳnh còn sót lại ở tầng trên khí quyển.\n\nMột cuộc khảo sát địa chất tập trung hơn sẽ cho chúng ta biết nhiều hơn."
 extreme_frontiers.210.title: "Vùng Đất Hoang Hắc Diện Thạch"
 extreme_frontiers.210.desc: "Dựa trên phân tích trầm tích của §Y[from.GetName]§!, chúng ta đã phát hiện ra rằng thế giới từng có nhiều núi lửa này đã trải qua một sự kiện đóng băng chớp nhoáng đột ngột, biến dung nham bề mặt của nó thành một dải thủy tinh núi lửa bóng loáng.\n\nRất nhiều hố va chạm trên bề mặt hành tinh cho thấy điều này rất có thể do một tác động từ thiên thể bên ngoài gây ra, chẳng hạn như một cơn bão sao băng. Bên trong các khối hắc diện thạch này là những bọt khí lưu huỳnh lớn bị mắc kẹt từ các miệng núi lửa nay đã bị niêm phong bởi sự đóng băng chớp nhoáng.\n\nVới kỹ thuật chiết xuất chính xác, chúng ta sẽ có thể thu hoạch các tài nguyên này phục vụ cho nhu cầu của mình."

 # SHEARING FORCE
 SHEARING_FORCE_CAT: "Mất Liên Lạc"
 shearing_force_desc: "Các tàu thăm dò quan sát được triển khai vào bầu khí quyển của §Y[from.GetName]§! đã ngừng mọi liên lạc. Vị trí chính xác của phần cứng thiết bị của chúng ta hiện chưa rõ.\n\nCần có một cuộc điều tra cận cảnh hành tinh để khôi phục dữ liệu."
 extreme_frontiers.220.title: "Lực Cắt Khí Quyển"
 extreme_frontiers.220.desc: "Chúng ta đã xác định được nguyên nhân khiến các tàu thăm dò của mình biến mất trên §Y[from.GetName]§!. Các tầng khí khác nhau tạo nên bầu khí quyển của hành tinh biểu hiện sự chênh lệch nhiệt độ đáng kinh ngạc. Những biến thiên mạnh mẽ này tạo ra một dòng chảy ngược sắc nhọn khi các tầng khí chuyển động dữ dội theo các hướng đối lập nhau.\n\nĐiều này, kết hợp với mật độ tương phản của từng loại khí, tạo ra những lực cắt thảm khốc xé toạc bất cứ thứ gì di chuyển qua lại giữa các tầng khí quyển.\n\nGiờ đây khi đã biết những gì cần đối mặt, thiết bị của chính chúng ta có thể được sửa đổi để chịu đựng những điều kiện khắc nghiệt này, cho phép chúng ta khai thác động lực của hiện tượng tự nhiên này."

 # MISSING MASS
 MISSING_MASS_CAT: "Khối Lượng Bị Hụt"
 missing_mass_desc: "Số liệu đo khối lượng đối với §Y[from.GetName]§! thấp hơn nhiều so với phạm vi dự kiến đối với một hành tinh đá có kích thước này. Đề nghị tiến hành điều tra thêm."
 extreme_frontiers.230.title: "Giun Đốt Lớp Phủ Sâu"
 extreme_frontiers.230.desc: "Kiểm tra kỹ hơn về địa chất của §Y[from.GetName]§! cho thấy lớp phủ silicat của nó có một mạng lưới rộng lớn các hang ngầm dưới lòng đất.\n\nCác tàu thăm dò thám hiểm tiết lộ rằng những hốc rỗng này là ngôi nhà của một loài giun đốt phát triển mạnh ở lớp phủ sâu, sống nhờ vào đá silicat. Những quần thể khổng lồ của các sinh vật này đang gặm nhấm hành tinh từ bên trong, sau đó tống chất thải đã tiêu hóa vào quỹ đạo hành tinh, nơi chúng bị gió vũ trụ cuốn đi.\n\nViệc tiêu diệt loài giun đốt sẽ giúp [controller.GetMinerPlural_lower] của chúng ta tiếp cận một lượng lớn quặng silicat dễ khai thác."
 extreme_frontiers.230.desc.terravore: "$extreme_frontiers.230.desc$ Sức ăn của chúng thật ấn tượng, và không khác mấy so với chúng ta."
 extreme_frontiers.230.a: "Khởi động các mũi khoan."
 extreme_frontiers.230.b: "Nghiên cứu những sinh vật kỳ thú này."

 # LIFE IN DARKNESS
 LIFE_IN_DARKNESS_CAT: "Sự Sống Trong Bóng Tối"
 life_in_darkness_desc: "§Y[from.GetName]§! bị khóa thủy triều với một nửa hành tinh tồn tại trong trạng thái bóng tối vĩnh viễn. Quét hồng ngoại chỉ ra rằng vùng không có ánh sáng và nghèo dinh dưỡng này là nơi có một hệ sinh thái hữu cơ đang hoạt động."
 extreme_frontiers.240.title: "Tiến Hóa Bán Trong Suốt"
 extreme_frontiers.240.desc: "Mặt tối vĩnh cửu của §Y[from.GetName]§! đã nuôi dưỡng một môi trường tiến hóa độc đáo cho số ít sinh vật có thể sống sót trên thế giới khắc nghiệt này.\n\nNhờ một biến dị nhiễm sắc thể độc đáo, hệ động vật ở đây hoàn toàn bán trong suốt, không có thị giác và sử dụng các hình thức định vị bằng tiếng vang tinh vi để sinh tồn."
 extreme_frontiers.240.desc.non_homicidal: "$extreme_frontiers.240.desc$ Những thích nghi đáng chú ý này mang lại sự quan tâm rất lớn cho [controller.GetResearcherPlural_lower] của chúng ta."
 extreme_frontiers.240.a: "Thật mở mang tầm mắt."
 extreme_frontiers.240.b: "Chúng sẽ bị tiêu thụ."
 extreme_frontiers.240.c: "Tận diệt."

 # RAINBOW RIVERS
 RAINBOW_RIVERS_CAT: "Dòng Sông Huỳnh Quang"
 rainbow_rivers_desc: "Quét sơ bộ đối với §Y[from.GetName]§! cho thấy các con sông huỳnh quang chảy khắp bề mặt hành tinh liên tục biến đổi qua toàn bộ quang phổ màu sắc.\n\nNghiên cứu thêm sẽ cho chúng ta biết nhiều hơn về hiện tượng bất thường này."
 extreme_frontiers.250.title: "Hóa Tổng Hợp Đa Sắc"
 extreme_frontiers.250.desc: "Phân tích các con sông huỳnh quang trên §Y[from.GetName]§! đã tiết lộ chúng là ngôi nhà của một loài sinh vật vi sinh độc đáo.\n\nSử dụng quá trình hóa tổng hợp để chuyển hóa các hợp chất có hại, những sinh vật này tạo ra các sản phẩm phụ có hoạt tính cao làm thay đổi thành phần hóa học của dòng sông, gây ra sự biến đổi màu sắc ngoạn mục.\n\nĐồng thời đóng vai trò như một phương tiện giao tiếp, các sắc thái màu neon rực rỡ mà chúng tạo ra được dùng để báo hiệu trạng thái sinh sản, thu hút bạn tình khi chúng di chuyển qua các dòng suối độc hại của hành tinh.\n\nTiếp tục nghiên cứu những sinh vật này và vòng đời của chúng sẽ mang lại cơ hội nghiên cứu hấp dẫn cho [controller.GetResearcherPlural_lower] của chúng ta."

 # GASEOUS METALS
 GASEOUS_METALS_CAT: "Kim Loại Dạng Khí"
 gaseous_metals_desc: "Khí quyển của §Y[from.GetName]§! chủ yếu bao gồm các kim loại khác nhau ở trạng thái khí. Với sự hiểu biết rõ hơn về các điều kiện khắc nghiệt của hành tinh này, chúng ta có thể chiết xuất được các hợp chất có giá trị này."
 extreme_frontiers.260.title: "Những Đám Mây Mạ Điện"
 extreme_frontiers.260.desc: "Bầu khí quyển bất thường của §Y[from.GetName]§! đã giữ lại một lượng lớn bức xạ mặt trời, gây ra một chuỗi hiện tượng nóng lên của hành tinh đến mức các kim loại tồn tại ở trạng thái khí và có hoạt tính cực cao.\n\nCác hợp chất này đã phản ứng ngay lập tức với bất kỳ thiết bị khảo sát nào chúng ta triển khai, phủ lên nó một lớp hợp kim kim loại mỏng nhưng bền bỉ. Đáng ngạc nhiên là quá trình này không gây phá hủy thiết bị.\n\n§Y[leader.GetName]§! tin rằng quá trình mạ điện tự nhiên này có thể được khai thác để cải thiện độ bền kéo của thân tàu trên khắp §Y[controller.GetName]§!."
 ATMOSPHERIC_ELECTROPLATING: "Mạ Điện Khí Quyển"
 ATMOSPHERIC_ELECTROPLATING_DESC: "Gửi các vật thể vào bầu khí quyển kim loại dạng khí của §Y[from.GetName]§! sẽ tạo ra một hình thức mạ điện tự nhiên.\n\nQuá trình độc đáo này mang lại hiệu quả vượt trội và nếu nghiên cứu thêm có thể được nhân rộng để cải thiện độ bền thân tàu trên khắp [Root.Owner.GetName]."
 extreme_frontiers.265.title: "Kim Loại Hiệu Suất Cao"
 extreme_frontiers.265.desc: "Chúng ta đã tìm ra cách nhân rộng quá trình mạ điện bất thường trong bầu khí quyển bất ổn của §Y[from.From.GetName]§! ở quy mô công nghiệp.\n\nSử dụng những gì đã học được, [Root.Owner.GetEngineerPlural] của chúng ta giờ đây có thể gia tăng đáng kể độ bền của một số kim loại mà không phải hy sinh tính linh hoạt hay tăng thêm trọng lượng.\n\nNhững phương pháp tiên tiến này có thể được áp dụng vào quy trình đóng tàu của chúng ta."

 # CARBON ALLOTROPES
 CARBON_ALLOTROPES_CAT: "Dạng Thù Hình Carbon"
 carbon_allotropes_desc: "Dữ liệu quang phổ từ §Y[from.GetName]§! chỉ ra thành phần hành tinh rất giàu các dạng thù hình carbon hiếm và phức tạp. Cần kiểm tra kỹ hơn để phân loại kỹ lưỡng hơn."
 extreme_frontiers.270.title: "Cấu Trúc Graphene"
 extreme_frontiers.270.desc: "Các mỏ graphene dồi dào đã được tìm thấy trên §Y[from.GetName]§!. Dạng thù hình hiếm hoi này của carbon chỉ dày một phân tử duy nhất nhưng sở hữu độ bền và độ dẫn điện vô song.\n\nVật liệu nano có giá trị này hình thành tự nhiên trên bề mặt nhờ sự lắng đọng hơi hóa học vốn có trong bầu khí quyển bất thường của §YThế Giới Carbon§! này."
 extreme_frontiers.270.a: "Chiết xuất nó."

 # DIAMOND DUST
 DIAMOND_DUST_CAT: "Vật Chất Vận Tốc Cao"
 diamond_dust_desc: "Quét khối lượng của §Y[from.GetName]§! cho thấy nồng độ cao của vật chất chuyển động nhanh nằm sâu bên trong tầng đối lưu dưới.\n\nNguồn gốc của các chỉ số bất thường này rất khó xác minh nếu không có cuộc điều tra chi tiết hơn."
 extreme_frontiers.280.title: "Bão Kim Cương"
 extreme_frontiers.280.desc: "Chúng ta đã xác định được nguồn gốc của các chỉ số khối lượng bất thường trên §Y[from.GetName]§!. Bầu khí quyển của hành tinh bao gồm chủ yếu là khí mê-tan giàu carbon, chất này đông đặc thành các cấu trúc kim cương siêu đặc khi áp suất trọng lực tăng lên. Do chu kỳ bão dữ dội của hành tinh, hiện tượng này làm phát sinh các cơn bão kim cương di chuyển nhanh.\n\nTrong khi những viên kim cương này rất dễ chiết xuất cho nhu cầu của chúng ta, §Y[leader.GetName]§! tự tin rằng việc kiểm tra kỹ hơn về mật độ và độ tinh khiết của chúng sẽ mang lại những kết quả có giá trị hơn nữa."
 ATMOSPHERIC_DIAMONDS_PROJECT: "Kim Cương Khí Quyển"
 ATMOSPHERIC_DIAMONDS_PROJECT_DESC: "Bằng cách nghiên cứu các cơn bão kim cương siêu đặc trên §Y[from.GetName]§!, chúng ta tự tin rằng các đặc tính độc đáo của chúng có thể được sử dụng để thúc đẩy công nghệ laser của chúng ta."
 extreme_frontiers.285.title: "Độ Chính Xác Kim Cương"
 extreme_frontiers.285.desc: "Nghiên cứu của §Y[leader.GetName]§! về những viên kim cương siêu đặc của §Y[from.From.GetName]§! đã hoàn tất.\n\nQuá trình nén tạo ra những viên kim cương này dẫn đến một cấu trúc mạng tinh thể độc đáo. Điều này làm cho chúng hoạt động cực kỳ hiệu quả trong việc giam hãm và khuếch đại dao động ánh sáng tần số cao.\n\nBước đột phá này sẽ chứng tỏ là một lợi ích tuyệt vời cho đế chế của chúng ta."

 # ETREME GEOLOGICAL TENSION
 GEOLOGICAL_TENSION_CAT: "Căng Thẳng Địa Chất Cực Độ"
 geological_tension_desc: "Các lần quét địa chất của §Y[from.GetName]§! cho thấy lớp vỏ hành tinh của thế giới nóng chảy này đang chịu áp lực rất lớn từ các lực kiến tạo bị dồn nén. Một sự kiện địa chất đáng kể có thể sắp xảy ra."
 extreme_frontiers.290.title: "Siêu Núi Lửa Bị Nghẽn"
 extreme_frontiers.290.desc: "Sau khi nghiên cứu sâu hơn về áp lực địa chấn cực độ trên §Y[from.GetName]§!, chúng ta đã phát hiện ra rằng một siêu núi lửa khổng lồ đã bị tắc nghẽn do nón trên bị sụp đổ một phần.\n\nCác trữ lượng magma khổng lồ đã lấp đầy tất cả các khoang ngầm hiện có và đang gây áp lực hướng lên cực lớn đối với chỗ tắc nghẽn ở lỗ thông hơi chính. Vật liệu bị sụp đổ hiện đang giữ magma tại chỗ, nhưng không thể dự đoán được trạng thái cân bằng mong manh này sẽ kéo dài bao lâu.\n\nĐá nóng chảy bị mắc kẹt đặc biệt giàu kim loại hiếm và các hợp chất khoáng vật phức tạp. §Y[leader.GetName]§! tin rằng chúng ta có thể thu hoạch các tài nguyên này một cách an toàn bằng cách kích hoạt một đợt phun trào có kiểm soát."
 extreme_frontiers.290.a: "Khai thông lỗ thông hơi."
 extreme_frontiers.290.b: "Tận dụng hoạt động địa nhiệt."
 CONTROLLED_ERUPTION_PROJECT: "Phun Trào Có Kiểm Soát"
 CONTROLLED_ERUPTION_PROJECT_DESC: "Một siêu núi lửa bị nghẽn trên §Y[from.GetName]§! đang giữ trữ lượng magma giàu khoáng sản khổng lồ bên dưới bề mặt. Tiến hành một đợt phun trào có kiểm soát sẽ cho phép chúng ta thu hoạch các tài nguyên bị mắc kẹt này."
 extreme_frontiers.295.title: "Đại Phun Trào"
 extreme_frontiers.295.desc: "Bằng cách khoan một loạt các trục nhân tạo tại nhiều điểm khác nhau trong nón ngoài của siêu núi lửa trên §Y[from.From.GetName]§!, chúng ta đã làm suy yếu cấu trúc của nó cho đến khi nó không còn có thể giữ được khối lượng magma tích tụ khổng lồ bên dưới.\n\nMột khi đạt đến điểm giới hạn, kết quả thực sự ngoạn mục. Phần trên của núi lửa đã bị xóa sổ hoàn toàn khi đá nóng chảy chịu áp suất cao nổ tung lên trên.\n\nChúng ta đã chuyển hướng dung nham tràn vào các kênh được chuẩn bị cẩn thận, nơi nó sẽ được thu hoạch bằng thiết bị khai khoáng chuyên dụng."
 extreme_frontiers.295.a.default: "Thật ngoạn mục."
 extreme_frontiers.295.a.machine: "Chiến dịch thành công."

 # LAYERED ATMOSPHERE
 LAYERED_ATMOSPHERE_CAT: "Khổng Lồ Phun Trào"
 layered_atmosphere_desc: "Các lần quét §Y[from.GetName]§! đã phát hiện các vụ phun trào khí dễ cháy rải rác trên khắp hành tinh, đặt ra những thách thức cho các cuộc khảo sát từ xa.\n\nSẽ cần có một cuộc kiểm tra cận cảnh hơn."
 extreme_frontiers.300.title: "Khí Quyển Phân Tầng"
 extreme_frontiers.300.desc: "§Y[leader.GetName]§! đã khám phá ra nguồn gốc của các đợt phun trào bất ổn trên §Y[from.GetName]§!. Khí quyển của hành tinh khí khổng lồ này đã hình thành theo cách mà một lớp hydro kim loại lỏng lơ lửng giữa tầng trung lưu và tầng bình lưu dạng khí. Thành phần khí mê-tan đậm đặc hơn ở tầng dưới giữ cho chất lỏng lơ lửng.\n\nTheo thời gian, các phóng điện tích tụ bên trong hydro kim loại, kích động tầng phụ. Sau khi áp suất tích tụ đến mức tới hạn, các vụ phun trào khí sẽ phun chất lỏng có tính dẫn điện cao vào tầng trên khí quyển, tiêu tan khắp hành tinh trước khi lắng đọng trở lại.\n\nCác hệ thống theo dõi của chúng ta có thể dễ dàng giám sát những biến động áp suất này, cho phép chúng ta thu hoạch các tài nguyên quý giá này."

 # SOLIDIFIED PLASMA TRAILS
 PLASMA_TRAILS_CAT: "Xung Năng Lượng Bất Thường"
 plasma_trails_desc: "Các đợt tăng vọt năng lượng bất thường đang được phát hiện dọc theo các đường đứt gãy kiến tạo của §Y[from.GetName]§!. Nguồn gốc của các xung này không thể xác định được từ quỹ đạo. Sẽ cần phải nghiên cứu kỹ hơn để xác định nguồn gốc của hiện tượng này."
 extreme_frontiers.310.title: "Dệt Vết Plasma Đông Đặc"
 extreme_frontiers.310.desc: "Phân tích địa chất của §Y[from.GetName]§! đã xác định được nguồn gốc của các xung năng lượng bất thường được phát hiện trong các cuộc khảo sát quỹ đạo ban đầu.\n\nHoạt động kiến tạo biến động của hành tinh tạo ra các phóng điện tĩnh dữ dội ở các khu vực có lãnh nguyên băng giá không ổn định.\n\nSét núi lửa này bùng nổ lên bầu trời biến không khí xung quanh thành plasma. Nhiệt độ cực cao được giải phóng bởi sự kiện này tạo ra một cú sốc nhiệt sau đó đông đặc lại thành các cấu trúc hình tia sét.\n\nSử dụng những gì đã học được từ phân tích địa chất, chúng ta sẽ có thể dễ dàng dự đoán các đợt phun trào địa chấn này và khai thác hiện tượng này phục vụ cho mục đích của mình."

 # CRYSTALLINE PLAINS
 CRYSTALLINE_PLAINS_CAT: "Hoạt Động Núi Lửa Băng"
 crystalline_plains_desc: "Phân tích kiến tạo của §Y[from.GetName]§! cho thấy hoạt động núi lửa băng đáng kể trên khắp hành tinh có tính chất dị thường."
 extreme_frontiers.320.title: "Đồng Bằng Tinh Thể"
 extreme_frontiers.320.desc: "Các cuộc khảo sát địa chất chi tiết đối với §Y[from.GetName]§! đã tiết lộ những dòng sông amoniac bán đông lạnh chảy bên dưới lớp vỏ đóng băng của nó. Áp lực địa nhiệt gia tăng đẩy chất này qua các khe nứt trên bề mặt giòn gãy.\n\nNhững đợt phun trào này phun ra một hỗn hợp dễ bay hơi gồm hơi độc hại và bùn amoniac trên khắp bề mặt hành tinh. Tái đóng băng khi tiếp xúc với nhiệt độ bề mặt cực lạnh, lớp bùn này tạo thành những vùng đồng bằng rộng lớn chứa các tinh thể quý giá và dễ thu hoạch."

 # SUPERMASSIVE GIANT
 SUPERMASSIVE_GIANT_CAT: "Hành Tinh Khổng Lồ Siêu Khối Lượng"
 supermassive_giant_desc: "§Y[from.GetName]§! là một hành tinh khí siêu khổng lồ có giếng trọng lực mạnh đã cuốn hàng ngàn vật thể vào quỹ đạo của nó. Lập danh mục cho chúng có thể mang lại nhiều điều đáng giá."
 extreme_frontiers.330.title: "Rác Không Gian"
 extreme_frontiers.330.desc: "§Y[from.GetName]§! có vô số mặt trăng con, tiểu hành tinh và mảnh vụn không gian bị khóa chặt trong quỹ đạo của nó. Định tuổi bằng đồng vị phóng xạ cho thấy tất cả chúng đều bị giếng trọng lực của hành tinh bắt giữ khi đi qua hệ sao hàng ngàn năm trước.\n\nTrong khi lập danh mục các vật thể này, chúng ta đã tìm thấy một vài tàu thăm dò khảo sát cổ xưa và rất sơ khai, gợi ý về một nền văn minh đang có những bước tiến đầu tiên trong việc thám hiểm không gian.\n\nHầu hết các ngân hàng dữ liệu của chúng đều bị hỏng hoặc bị hư hại vật lý do va chạm với các vật thể khác, nhưng một trong số đó chứa một loạt hình ảnh về bề mặt của [from.GetName] kéo dài hàng trăm năm."
 extreme_frontiers.330.a: "Một phát hiện hấp dẫn."
 extreme_frontiers.330.b: "Tháo dỡ chúng lấy phế liệu."

 # INVISIBLE PLANET
 INVISIBLE_PLANET_CAT: "Quỹ Đạo Bất Thường"
 invisible_planet_desc: "Một dao động nhỏ nhưng lặp đi lặp lại đã được quan sát thấy trong đường đi quỹ đạo của §Y[from.GetName]§!, cho thấy nó thường xuyên chịu tác động của một lực hấp dẫn lớn chưa rõ.\n\nĐề nghị nghiên cứu thêm về không gian xung quanh."
 extreme_frontiers.340.title: "Hành Tinh Vô Hình"
 extreme_frontiers.340.desc: "Phân tích thêm về §Y[from.solar_system.GetName]§! cho thấy tất cả các quỹ đạo hành tinh trong hệ sao này đều có những điểm bất thường tương tự.\n\nSau khi định vị tam giác các lực hấp dẫn dựa trên những chuyển động khác thường này, chúng ta đã phát hiện ra nguyên nhân của chúng: một hành tinh chưa từng thấy trước đây hiện được gọi là §Y[invisible_planet.GetName]§!. Thế giới này sở hữu một bề mặt độc đáo gồm các hạt carbon đen không phản xạ ánh sáng hay sóng vô tuyến, khiến nó gần như vô hình đối với máy quét tầm xa.\n\nNhững polyme xuất hiện tự nhiên này có đặc tính hấp thụ đáng kinh ngạc."
 extreme_frontiers.340.desc.default: "$extreme_frontiers.340.desc$ Những vật liệu này mang lại một cơ hội nghiên cứu độc đáo."
 extreme_frontiers.340.desc.first_contact: "$extreme_frontiers.340.desc$ Chúng sẽ được thu hoạch và nghiên cứu về tiềm năng sử dụng làm vật liệu tàng hình."

 # SURVIVAL POD
 SURVIVAL_POD_WARM_CAT: "Trạm Tiền Đồn Tái Chế"
 SURVIVAL_POD_COLD_CAT: "Trạm Tiền Đồn Tái Chế"
 survival_pod_desc: "Các đợt quét khảo sát bề mặt cằn cỗi của §Y[from.GetName]§! đã tiết lộ một trạm dã ngoại được tái sử dụng, ban đầu là một phòng thí nghiệm nghiên cứu tạm thời đã quá hạn sử dụng từ lâu. Bức xạ nhiệt mờ nhạt cho thấy các phần của công trình vẫn đang hoạt động."
 extreme_frontiers.350.title: "Kẻ Sống Sót Đơn Độc"
 extreme_frontiers.350.desc: "Một cuộc thám hiểm bề mặt §Y[from.GetName]§! đã định vị được trạm dã ngoại được tái sử dụng và người cư ngụ duy nhất của nó.\n\nTự nhận mình là một nhà khoa học bị mắc kẹt đã kiên cường chịu đựng thế giới khắc nghiệt này trong nhiều năm, cô ấy đề nghị cống hiến chuyên môn của mình cho [root.Owner.GetName] để đổi lấy việc được giải cứu."
 extreme_frontiers.350.a: "Kinh nghiệm của cô ấy là một tài sản quý giá."
 extreme_frontiers.350.b: "Tặng cô ấy một tàu con thoi và nhu yếu phẩm."
 extreme_frontiers.350.c: "Cứ để mặc cô ấy và tiếp tục quan sát."
 extreme_frontiers.350.d: "Thật nực cười. Hãy phá hủy nơi trú ẩn của cô ta."
 extreme_frontiers.352.title: "$NAME_survivalist_scru$"
 extreme_frontiers.352.desc: "Một cá thể [scru_species.GetClass] hốc hác bước ra khỏi trạm dã ngoại đã được cải tạo thành nơi ở. Khi cô ấy kể về nỗi gian truân của mình trên §Y[from.From.GetName]§!, âm thanh phát ra từ [scru_species.GetMouthName] của cô ấy khàn đặc; từng lời nói ngập ngừng ngắt quãng.\n\n\"Xin hãy tha thứ cho tôi. Tôi đã không... nói chuyện với ai trong suốt nhiều năm qua...\""
 extreme_frontiers.352.a: "Điều gì đã khiến cô bị mắc kẹt ở đây?"
 extreme_frontiers.352.a.response: "Tôi đang khảo sát [from.From.GetName], lập danh mục nền đá gốc độc đáo. Thủy thủ đoàn của tôi nói họ sẽ quét nhanh bằng phi thuyền thám hiểm của chúng tôi. Tôi đã tin họ. Chỉ sau vài ngày lo lắng, tôi mới nhận ra chuyện gì đã xảy ra. Họ đã cất cánh và bay về nhà."
 extreme_frontiers.352.b: "Làm sao cô có thể sống sót ở đây lâu đến thế?"
 extreme_frontiers.352.b.response: "Ồ, thật kỳ diệu về những gì bạn có thể làm khi biến đổi tính thấm của tế bào và kích hoạt biểu hiện quá mức các protein sốc nhiệt... Sau đó, thật đơn giản để kích thích quá trình tự thực bào đại thể trên các tế bào đã biến đổi của tôi, và nhờ hàm lượng natri của thế giới này, tôi có thể tạo ra nhiều bữa ăn ngon lành."
 extreme_frontiers.352.c: "Cô không muốn quay về với đồng loại của mình sao?"
 extreme_frontiers.352.c.response: "Họ không xứng đáng với những đột phá mà tôi đã tạo ra trên tảng đá này. Tôi không thèm bận tâm tìm hiểu xem họ có lý do xảo quyệt nào để bỏ rơi tôi."
 extreme_frontiers.352.d: "Cô có thể làm gì cho chúng tôi?"
 extreme_frontiers.352.d.response: "Tôi đã mệt mỏi với việc làm việc trong một phòng thí nghiệm tạm bợ. Tôi muốn nhìn ngắm những thế giới mới... Từ ngoài không gian."
 extreme_frontiers.352.e: "Chiêu mộ $NAME_survivalist_scru$"
 extreme_frontiers.352.e.custom_tooltip: "§Y$NAME_survivalist_scru$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh Đạo§!."
 NAME_survivalist_scru: "Scru"
 survivalist_scru_desc: "Một nhà khoa học tài năng với các kỹ năng sinh tồn được mài giũa trong những môi trường khắc nghiệt."
 leader_trait_hardened_survivalist: "Kẻ Sinh Tồn Dày Dạn"
 leader_trait_hardened_survivalist_desc: "Nhà lãnh đạo này sở hữu kiến thức vô song về những môi trường khắc nghiệt không thể dung thân."

 # Infernal Tornadoes
 INFERNAL_TORNADOES_CAT: "Nhiệt Độ Cực Đoan"
 infernal_tornadoes_desc: "Quét §H[from.GetName]§! cho thấy những dải bão áp cao di chuyển nhanh trên diện rộng.\n\nNhững cơn bão này đang phát ra các tín hiệu nhiệt cực kỳ bất ổn. Sẽ cần nghiên cứu tập trung để làm rõ nguyên nhân là do tự nhiên hay do một dạng sống chưa từng biết gây ra."
 extreme_frontiers.360.title: "Vòi Rồng Lửa"
 extreme_frontiers.360.desc: "Nguồn gốc của các tín hiệu nhiệt cực đoan trên §H[from.GetName]§! đã được khám phá.\n\nKhắp hành tinh, các mạch nước ngầm đang phun ra khí hydro cực kỳ dễ cháy từ sâu dưới bề mặt. Khi các mạch nước này phun trào, nhiệt độ của hành tinh sẽ đốt cháy khí, tạo ra những cột lửa khổng lồ phóng vút lên bầu trời.\n\nKhi kết hợp với áp suất khí quyển, điều này tạo ra những luồng không khí cực kỳ bất ổn, thổi những luồng lửa cuộn xoáy khắp cảnh quan dưới dạng những cơn lốc xoáy lửa khổng lồ.\n\nMặc dù là một hiện tượng tự nhiên có sức tàn phá khủng khiếp, [Root.Owner.GetResearcherPlural_lower] của chúng ta tin tưởng rằng những cơn lốc xoáy này và khối lượng động năng khổng lồ mà chúng tạo ra có thể được tái tạo nhân tạo để sử dụng cho mục đích thực tiễn."
 INFERNAL_CATALYSTS_PROJECT: "Chất Xúc Tác Hỏa Ngục"
 INFERNAL_CATALYSTS_PROJECT_DESC: "Bằng cách nghiên cứu kỹ hơn các điều kiện đằng sau những cơn lốc xoáy lửa của §H[from.GetName]§!, những lợi ích của hiện tượng này có thể được tái tạo trong một môi trường có kiểm soát."
 extreme_frontiers.365.title: "Bộ Cộng Hưởng Mảnh Vụn Núi Lửa"
 extreme_frontiers.365.desc: "§Y[from.Leader.GetName]§! đã tìm ra cách tái tạo và khai thác thành công những cơn lốc xoáy lửa được tìm thấy trên §Y[from.From.GetName]§! trong một môi trường có kiểm soát.\n\nVới bước đột phá này, chúng ta sẽ có thể sử dụng các trạm căn cứ sao của mình để tăng năng lượng do bất kỳ thế giới nóng chảy nào được tìm thấy trong cùng hệ sao tạo ra."
 extreme_frontiers.365.desc.has_furnace: "Lý thuyết khoa học này có nhiều điểm tương đồng với hiểu biết hiện tại của chúng ta về §HLò Luyện Hồ Quang§!, mở ra những khả năng mới cho việc xây dựng ngoài không gian."
 extreme_frontiers.365.desc.default: "Lý thuyết khoa học đằng sau khám phá này có nhiều ứng dụng đối với sự phát triển của công nghệ §HLò Luyện Hồ Quang§!, với các [Root.Owner.GetEngineerPlural] của chúng ta đã sẵn sàng bắt đầu áp dụng lý thuyết này vào phát triển thực tế."
 tech_pyroclastic_resonation: "Cộng Hưởng Mảnh Vụn Núi Lửa"
 tech_pyroclastic_resonation_desc: "Bằng cách khai thác năng lượng nhiệt cực độ được tìm thấy trên các thế giới nóng chảy, các trạm căn cứ sao của chúng ta có thể tăng sản lượng năng lượng trong một hệ sao với hiệu suất vượt trội."
 sm_pyroclastic_resonator: "Bộ Cộng Hưởng Mảnh Vụn Núi Lửa"
 sm_pyroclastic_resonator_desc: "Bộ cộng hưởng nhiệt có thể làm tăng sản lượng năng lượng của bất kỳ thế giới nóng chảy nào trong một hệ sao.\nSản lượng $i_energy$ tỷ lệ thuận với số lượng ['concept_pc_molten'] trong hệ sao."

 # MAGMA MEGAFAUNA
 MAGMA_MEGAFAUNA_CAT: "Địa Chất Bất Ổn"
 magma_megafauna_desc: "Quét §Y[from.GetName]§! cho thấy các phần của bề mặt hành tinh nóng chảy liên tục dịch chuyển qua những khoảng cách lớn.\n\nCần nghiên cứu kỹ hơn để hiểu về hiện tượng địa chất bất thường này."
 extreme_frontiers.370.title: "Đại Động Vật Nóng Chảy"
 extreme_frontiers.370.desc: "Các lần quét địa chấn dị thường trên §Y[from.GetName]§! được xác định là do sự hiện diện của những đàn đại động vật gốc silicon lớn đang lang thang.\n\nDi cư qua những khoảng cách xa xôi, những sinh vật khổng lồ này định kỳ lặn xuống các hồ dung nham của hành tinh để thu thập nguồn thức ăn ưa thích: một loại trầm tích đá giàu §HHạt Bụi Dễ Bay Hơi§!. Bằng cách theo dõi các hình thái di cư của chúng, chúng ta sẽ có thể chiết xuất các trầm tích này phục vụ nhu cầu của mình với tác động tối thiểu đến hệ sinh thái của hành tinh.\n\nLớp mai dày bên ngoài của chúng có thể chịu được nhiệt độ cực cao; một nghiên cứu sâu hơn, chi tiết hơn về vòng đời của chúng có thể mang lại những kết quả hấp dẫn."
 LAVA_DIVERS_PROJECT: "Sinh Thể Lặn Dung Nham"
 LAVA_DIVERS_PROJECT_DESC: "Các loài đại động vật trên §Y[from.GetName]§! có thể chịu được môi trường khắc nghiệt của thế giới nóng chảy và lặn sâu xuống dưới bề mặt của vô số hồ magma trên hành tinh.\n\nNghiên cứu lớp mai của những sinh vật này có thể mang lại cho chúng ta hiểu biết mới về cách đối phó với nhiệt độ cực cao."
 extreme_frontiers.375.title: "Giáp Rèn Từ Magma"
 extreme_frontiers.375.desc: "Nghiên cứu toàn diện về loài đại động vật độc đáo trên §Y[from.From.GetName]§! đã tiết lộ những hiểu biết nhiệt động lực học có thể chuyển giao để áp dụng trong các xưởng đóng tàu của chúng ta.\n\nChế độ ăn ngập tràn hạt bụi của các sinh vật này tạo ra một cấu trúc nặng gốc silicat hình thành khắp các lớp vỏ ngoài bền bỉ của chúng, được gia cố bằng các vật liệu chịu lửa xuất hiện tự nhiên.\n\nSau khi thu thập được nhiều mẫu lớp vỏ ngoài đã bong tróc của chúng, [Root.Owner.GetEngineerPlural] của chúng ta giờ đây có thể tái tạo các nguyên lý cơ sinh học này trong quá trình phát triển các tấm bọc thân tàu của riêng chúng ta."

 # PLANET THRUSTERS
 PLANET_THRUSTERS_CAT: "Thiết Bị Lơ Lửng"
 planet_thrusters_desc: "Lơ lửng trong tầng trên khí quyển của §Y[from.GetName]§! là một loạt cỗ máy hình trụ lớn. Chúng có vẻ như không hoạt động và không có bất kỳ phi hành đoàn nào."
 extreme_frontiers.380.title: "Động Cơ Đẩy Hành Tinh"
 extreme_frontiers.380.desc: "Mỗi cỗ máy bị bỏ hoang được tìm thấy trên §Y[from.GetName]§! là một thành phần động cơ đẩy độc lập. Tổng cộng có hơn một ngàn cỗ máy hiện diện ở tầng trên khí quyển.\n\nĐược chế tạo từ các vật liệu được thiết kế đặc biệt, những thiết bị nhiệt hạch phức tạp này được thiết kế để nạp khí hydro từ hành tinh bên dưới làm nhiên liệu nhằm tạo ra lực đẩy đáng kể. Hầu hết đều có dấu hiệu hư hỏng do quá tải.\n\nPhân tích của chúng ta tiết lộ rằng tất cả các cỗ máy được định vị theo cách mà lực đẩy này sẽ tác động lực ngược lại chính hành tinh, cho thấy phần cứng cổ xưa này ban đầu được triển khai trong một nỗ lực nhằm thay đổi quỹ đạo của hành tinh.\n\nDù không còn phù hợp cho nhiệm vụ to lớn tầm cỡ này nữa, chúng ta có thể tái sử dụng các mẫu ít bị hư hại hơn để đốt cháy các lớp khí của hành tinh và làm lộ ra lõi giàu khoáng sản của nó."
 extreme_frontiers.380.a: "Tháo dỡ toàn bộ lấy phế liệu."
 extreme_frontiers.380.b: "Tái sử dụng các thiết bị này."
 REPURPOSE_THRUSTERS_PROJECT: "Động Cơ Đẩy Hành Tinh Tái Sử Dụng"
 REPURPOSE_THRUSTERS_PROJECT_DESC: "Bằng cách tái sử dụng mảng động cơ đẩy hành tinh bị hư hại trên §Y[from.GetName]§!, chúng ta có thể đốt cháy lượng hydro của hành tinh khí khổng lồ này, để lại một lõi rắn có thể khai thác được."
 extreme_frontiers.385.title: "Khí Quyển Bị Tước Bỏ"
 extreme_frontiers.385.desc: "Chúng ta đã có thể sửa chữa một vài động cơ đẩy hành tinh bị hư hại của §Y[from.From.GetName]§! và hiệu chỉnh chúng để tác dụng lực bằng nhau theo các hướng đối lập.\n\nSau khi được kích hoạt, các thiết bị nhiệt hạch mạnh mẽ này đã hút hydro với tốc độ cấp số nhân, đốt cháy bầu khí quyển dạng khí của hành tinh và làm lộ ra lõi giàu khoáng sản của nó, dù ở nhiệt độ cực kỳ cao."
 extreme_frontiers.385.tt: "Thêm hiệu ứng sửa đổi §Y$chthonian_planet$§!"
 extreme_frontiers.385.a: "Rất ấn tượng."

 # BACKWARDS ORBIT
 BACKWARDS_ORBIT_CAT: "Quỹ Đạo Nghịch Hành"
 backwards_orbit_desc: "§Y[from.GetName]§! quay quanh ngôi sao theo hướng ngược lại so với các hành tinh khác trong hệ sao, cho thấy nó không hình thành ở đây cùng lúc với các thiên thể đồng hành.\n\nCần điều tra thêm để hiểu rõ nguồn gốc của hành tinh này."
 extreme_frontiers.390.title: "Hành Tinh Lang Thang"
 extreme_frontiers.390.desc: "Thành phần của §Y[from.GetName]§! không khớp với thành phần của các hành tinh khác ở vùng lân cận. Tuy nhiên, nó lại hoàn toàn trùng khớp với các thiên thể khác nhau trong hệ sao §Y[event_target:wandering_planet_origin.GetName]§! láng giềng, hé lộ nguồn gốc thực sự của nó.\n\nBề mặt hành tinh mang một hố va chạm đặc biệt lớn, khiến chúng ta suy đoán rằng nó đã bị văng ra khỏi quỹ đạo ban đầu bởi một vụ va chạm tiểu hành tinh khổng lồ. Hành tinh lang thang trôi nổi tự do này sau đó đã bị giếng trọng lực của [from.System.Star.GetName] bắt giữ, nơi nó mang quỹ đạo nghịch hành bất thường.\n\nHành tinh đáng chú ý này đã từng cư ngụ ở hai hệ sao khác nhau kể từ khi hình thành, mang lại cơ hội phong phú cho việc nghiên cứu sâu hơn."

 # VAPOR PLUMES
 VAPOR_PLUMES_CAT: "Cột Hơi Nước"
 vapor_plumes_desc: "Hàng ngàn cột hơi nước dị thường đã được quan sát thấy bốc lên từ bề mặt của §Y[from.GetName]§!, vươn tới giới hạn trên của bầu khí quyển mỏng manh của nó.\n\nKhuyến nghị nên tiến hành điều tra thêm về hiện tượng này."
 extreme_frontiers.400.title: "Mạch Phun Núi Lửa Băng"
 extreme_frontiers.400.desc: "Các cột hơi được quan sát thấy trên §Y[from.GetName]§! là do hoạt động núi lửa băng dữ dội sâu trong lớp phủ dưới, tống những cột khí nitơ và amoniac khổng lồ lên phía trên.\n\nCác cột khói bốc thẳng đứng cho đến khi chạm tới giới hạn khí quyển của hành tinh, nơi gió mặt trời khiến chúng đột ngột bị san phẳng.\n\nBằng cách nghiên cứu những biến thiên nhỏ trong thành phần hóa học của các cấu trúc khói độc đáo này, chúng ta có thể tìm hiểu thêm về các quá trình địa chất phức tạp trong lõi của hành tinh."

 # FIBROUS ATMOSPHERE
 FIBROUS_ATMOSPHERE_CAT: "Khảo Sát Bị Nhiễu Loạn"
 fibrous_atmosphere_desc: "Các lần quét ban đầu đối với §Y[from.GetName]§! đang trả về trạng thái bị hỏng dữ liệu mà các cảm biến của chúng ta không thể diễn giải rõ ràng. Nguồn gốc của sự can thiệp này vẫn chưa rõ; sẽ cần phải kiểm tra cận cảnh hơn."
 extreme_frontiers.410.title: "Khí Quyển Dạng Sợi"
 extreme_frontiers.410.desc: "Kiểm tra chi tiết §Y[from.GetName]§! đã tiết lộ nguồn gốc của sự hỏng dữ liệu trong các lần quét sơ bộ của chúng ta.\n\nNhững đám mây khoáng chất dạng sợi dày đặc tạo nên tầng trên khí quyển của hành tinh. Những dải sợi uốn lượn dài này bắt nguồn từ các tầng dưới của hành tinh khí khổng lồ, với môi trường áp suất cao kéo dài chúng để tạo thành các đám mây khoáng chất có tính dẫn điện cao.\n\nTích tụ năng lượng tĩnh điện khi lưu thông qua khí quyển, những sợi này định kỳ phóng điện theo thời gian. Chúng ta có thể dễ dàng chiết xuất các tài nguyên này phục vụ nhu cầu của mình."

 # EXPLODING SKIES
 EXPLODING_SKIES_CAT: "Nhiệt Đột Biến Dữ Dội"
 exploding_skies_desc: "Các lần quét §Y[from.GetName]§! đang theo dõi các hiện tượng khí tượng cực đoan, với các đợt tăng vọt nhiệt độ rải rác nhưng dữ dội phân bố trên khắp bề mặt.\n\nĐiều này bảo đảm cho việc điều tra thêm."
 extreme_frontiers.420.title: "Chân Trời Nổ Tung"
 extreme_frontiers.420.desc: "Quan sát chi tiết đối với §Y[from.GetName]§! đã hé lộ nguyên nhân của các đợt tăng nhiệt khí tượng.\n\nCác lỗ thông địa nhiệt và mạch nước ngầm trên khắp bề mặt đang phun ra các loại khí cực kỳ dễ cháy, sau đó tích tụ trong khí quyển. Các phóng điện tĩnh sau đó đóng vai trò như một chất xúc tác đánh lửa, gây ra những khối không khí nổ tung tàn phá bầu trời của thế giới này.\n\nNhững phản ứng này đã mang lại cho [Root.Owner.GetEngineerPlural] của chúng ta những hiểu biết mới về sự đốt cháy nhiệt động lực học, với các ứng dụng cho hệ thống đẩy của hạm đội chúng ta."
 extreme_frontiers.420.desc.traumatized: "Thật không may, tính chất nguy hiểm của nghiên cứu này đã khiến [leader.GetName] phải chịu sang chấn tâm lý nghiêm trọng."
 extreme_frontiers.420.desc.maimed: "Thật không may, tính chất nguy hiểm của nghiên cứu này đã khiến [leader.GetName] phải chịu những thương tích nặng nề trên cơ thể."

 # CHTHONIAN PRESERVATION
 CHTHONIAN_PRESERVATION_CAT: "Sinh Khối Âm Giới"
 chthonian_preservation_desc: "Các cuộc khảo sát đối với §Y[from.GetName]§! tiết lộ đây là một hành tinh âm giới, một hành tinh khí khổng lồ trước đây đã bị tước bỏ bầu khí quyển bởi bức xạ dữ dội từ §Y[from.System.Star.GetName]§!. Bất chấp điều này, những dấu vết sinh khối rất mờ nhạt đã được phát hiện trên bề mặt của nó, cần phải điều tra thêm."
 extreme_frontiers.430.title: "Bảo Tồn Âm Giới"
 extreme_frontiers.430.desc: "Các chỉ số sinh khối trên §Y[from.GetName]§! là hài cốt hóa thạch của một đàn Tiyanki.\n\nNhiều khả năng xuất hiện trong hành tinh khí khổng lồ vào một thời điểm then chốt trong quá trình tiêu tán khí quyển của nó, cơ thể của chúng đã bị bọc kín trong kim loại nóng chảy mà sau đó đã đông đặc lại.\n\nTrong khi một lượng nhỏ vật chất sinh học vẫn còn bên trong, việc tiếp xúc kéo dài với bức xạ sao cấp độ âm giới đã biến phần lớn thi thể của chúng thành một hợp kim sinh học-kim loại độc đáo.\n\n§Y[leader.GetName]§! tin rằng với việc nghiên cứu kỹ hơn về những hóa thạch quý hiếm này, chúng ta sẽ có thể khám phá ra những hướng sản xuất hợp kim mới từ các nguồn sinh học."
 CHTHONIAN_PETRIFICATION_PROJECT: "Hóa Thạch Âm Giới"
 CHTHONIAN_PETRIFICATION_PROJECT_DESC: "Bằng cách kiểm tra hài cốt hóa thạch của đàn Tiyanki trên §Y[from.GetName]§!, [Root.Owner.GetScientistPlural] của chúng ta hướng tới việc hiểu đầy đủ các tác động của bức xạ cấp độ âm giới đối với vật chất sinh học, có khả năng mở ra các phương thức mới để sản xuất hợp kim tiên tiến."
 extreme_frontiers.435.title: "Hợp Kim Sản Sinh Sinh Học"
 extreme_frontiers.435.desc: "Sau khi kiểm tra cẩn thận các hài cốt Tiyanki hóa thạch trên §Y[from.From.GetName]§!, chúng ta đã xác định thành công một phương thức sản xuất hợp kim mới bằng cách mô phỏng tác động của việc tiếp xúc với bức xạ cấp độ âm giới lâu dài.\n\nBước đột phá này mang lại một phương pháp luận đáng chú ý sử dụng vật chất sinh học làm nguyên liệu thô chính, tạo ra những kết quả có thể sánh ngang với các phương pháp truyền thống hơn."
 tech_alloy_fossilization: "Hóa Thạch Hợp Kim"
 tech_alloy_fossilization_desc: "Bằng cách cho vật chất sinh học tiếp xúc với bức xạ cấp độ âm giới mô phỏng, chúng ta có thể hóa thạch các cấu trúc tế bào thành các hợp kim kim loại có thể sử dụng được."
 tech_alloy_fossilization_tt: "§HMở khóa công trình§!: ['building:building_bio_furnace']"
 building_bio_furnace: "Lò Nung Sinh Học"
 building_bio_furnace_desc: "Bằng cách kết hợp các mức bức xạ sao mô phỏng đáng kể, cơ sở này có khả năng chuyển đổi vật chất sinh học thành các hợp kim."

 # ORBITAL RESONANCE
 ORBITAL_RESONANCE_CAT: "Tỷ Lệ Hoàn Hảo"
 orbital_resonance_desc: "Khoảng thời gian quỹ đạo trong hệ sao §Y[from.System.GetName]§! thể hiện một mô hình đáng kinh ngạc. Mỗi hành tinh quay quanh ngôi sao trong khoảng thời gian chính xác gấp đôi người hàng xóm của nó, chính xác tới hơn một phần nghìn giây.\n\nTỷ lệ hoàn hảo dị thường này đòi hỏi phải có một cuộc điều tra."
 extreme_frontiers.440.title: "Cộng Hưởng Quỹ Đạo"
 extreme_frontiers.440.desc: "§Y[from.System.GetName]§! thể hiện ví dụ hoàn hảo nhất về cộng hưởng quỹ đạo mà chúng ta từng gặp.\n\nMỗi hành tinh tác dụng một lực hấp dẫn định kỳ lên người hàng xóm của nó khi chúng ở những điểm gần nhau nhất, tạo ra hiệu ứng máy phóng và động lượng phụ thuộc lẫn nhau. Sự ổn định bất thường của những tương tác này dẫn đến các quỹ đạo được điều phối cao độ.\n\nHệ sao mang lại một cơ hội tuyệt vời để nghiên cứu cách trọng lực hành tinh tăng tốc chuyển động của các vật thể đi qua, với các ứng dụng khả dĩ cho việc cơ động tàu."
 GRAVITY_ASSIST_PROJECT: "Nghiên Cứu Hỗ Trợ Trọng Lực"
 GRAVITY_ASSIST_PROJECT_DESC: "Nghiên cứu hiệu ứng cộng hưởng quỹ đạo hoàn hảo trên §Y[from.GetName]§! sẽ nâng cao hiểu biết của chúng ta về các thao tác súng cao su hành tinh trên tàu vũ trụ."
 extreme_frontiers.445.title: "Những Tiến Bộ Súng Cao Su Quỹ Đạo"
 extreme_frontiers.445.desc: "Sau khi nghiên cứu hiệu ứng cộng hưởng quỹ đạo độc đáo trong hệ sao §Y[from.From.System.GetName]§!, chúng ta đã cải thiện đáng kể các phương pháp lập biểu đồ đường bay tối ưu cho tàu vũ trụ.\n\nNhững mô hình mới này sẽ cho phép chúng ta tận dụng tốt hơn lực hấp dẫn của hành tinh trong việc đạt được khả năng tăng tốc và giảm tốc của tàu ở tốc độ dưới ánh sáng."
 tech_orbital_maneuvers: "Cơ Động Quỹ Đạo Nâng Cao"
 tech_orbital_maneuvers_desc: "Du hành dưới tốc độ ánh sáng có thể được tối ưu hóa hơn nữa bằng cách thực hiện các phép tính nâng cao nhằm tận dụng tối đa các giếng trọng lực của hành tinh."

 #############
 # Arc Sites #
 #############

 # ABSOLUTE ZERO
 site_absolute_zero: "Độ Không Tuyệt Đối"
 site_absolute_zero_desc: "Quét địa hình của §Y[from.Planet.GetName]§! cho thấy nhiệt độ cực thấp đạt gần độ không tuyệt đối tập trung cục bộ tại một khu vực ngầm dưới lòng đất cụ thể.\n\nNghiên cứu chi tiết hơn về bên trong sẽ mang lại nhiều câu trả lời hơn."
 extreme_frontiers.1000.title: "Khối Băng Phong Tỏa"
 extreme_frontiers.1000.desc: "Trong khi tìm kiếm nguồn nhiệt độ cực thấp trên §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! đã phát hiện ra lối vào một cấu trúc ngầm cổ đại.\n\nChặn lối vào là một khối đá đông lạnh và các tháp băng nhọn hoắt dường như đã khiến bản thân cấu trúc này không thể tiếp cận trong hàng thiên niên kỷ.\n\nKhí carbon dioxide tan chảy ở lối vào đang bốc ra những luồng khí từ nhiều khe hở khác nhau trong khối phong tỏa. Thiết bị của chúng ta chỉ ra một khu phức hợp rộng lớn bên trong; [leader.GetName] tin tưởng rằng nguồn gốc của cái lạnh cực độ có thể được tìm thấy bên trong."
 extreme_frontiers.1000.a: "Phá vỡ khối phong tỏa."
 extreme_frontiers.1005.title: "Đóng Băng Theo Thời Gian"
 extreme_frontiers.1005.desc: "§Y[leader.GetName]§! đã phá vỡ thành công lớp băng chặn lối vào của cấu trúc cổ đại trên §Y[from.Planet.GetName]§!.\n\nBên trong không gian này là hàng chục thi thể đông lạnh thuộc về một chủng tộc bò sát chưa từng biết. Những cơ thể co quắp của họ bị đóng băng tại chỗ dựa vào tường, với những vết cào cấu cho thấy một nỗ lực tuyệt vọng để trốn thoát.\n\nNguồn gốc của những luồng khói đá khô rỉ ra qua lối vào hẳn phải nằm sâu hơn dưới lòng đất, với một cầu thang xoắn ốc dẫn sâu hơn vào khu phức hợp."
 extreme_frontiers.1010.title: "Lăng Mộ Băng Giá"
 extreme_frontiers.1010.desc: "Sâu hơn trong khu phức hợp đông lạnh, §Y[leader.GetName]§! đã phát hiện ra một gian phòng trung tâm lớn chứa đầy các buồng đông lạnh sơ khai nhưng về mặt lý thuyết vẫn có thể hoạt động.\n\nCái lạnh cực độ hiện diện ở đây vượt xa phạm vi nhiệt độ được thiết kế của các thiết bị này. Những người cư ngụ trong các khoang đã chết từ hàng ngàn năm trước.\n\nMột số ít buồng chưa bị băng tuyết vùi lấp có các bệ đá có thể đọc được chữ ở chân đế, biểu thị tước vị xã hội và cấp bậc của những người bên trong. Các buồng có cấp bậc cao hơn được đặt gần nhất với một khoang trung tâm lớn, bản thân khoang này bị chôn sâu trong sương giá và tuyết."
 extreme_frontiers.1010.a: "Điều tra khoang trung tâm."
 extreme_frontiers.1015.title: "Vị Vua Băng Giá"
 extreme_frontiers.1015.desc: "§Y[leader.GetName]§! đã chọc thủng khoang trung tâm lớn tại trái tim của lăng mộ băng giá trên §Y[from.Planet.GetName]§!.\n\nBên trong, chúng ta đã phát hiện ra nơi an nghỉ cuối cùng của người đứng đầu hoàng gia cổ đại được ám chỉ trong các văn bản ở gian phòng trước. Bị đóng băng bên cạnh là hàng chục cận thần của họ, những người có khoang đông lạnh riêng tô điểm cho các bức tường theo kiểu nghi lễ.\n\nCỗ quan tài công nghệ cao của vị quân vương đã khuất được kết nối thông qua một mạng lưới ống và mạch điện chằng chịt như mê cung tới một cỗ máy cổ xưa. Thiết bị này được nhúng vào một khối băng lớn, nhiệt độ của nó đạt tới mức cực kỳ thấp, nguy hiểm ngay cả đối với thiết bị phân tích của chúng ta.\n\nNguyên nhân gây ra sự cố rõ ràng của cơ sở này và mối quan hệ của nó với lõi đóng băng của hành tinh cần được nghiên cứu thêm."
 extreme_frontiers.1015.a: "Điều gì đã xảy ra sai sót ở đây?"
 extreme_frontiers.1020.title: "Thảm Họa Hàn Đông"
 extreme_frontiers.1020.desc: "Phân tích gian phòng trung tâm của lăng mộ băng giá trên §Y[from.Planet.GetName]§! đã tiết lộ nguồn gốc của thảm họa đã diễn ra.\n\nMáy móc đông lạnh sử dụng động lực học dưới nhiệt độ tận dụng nhiệt độ lõi cực thấp của hành tinh này. Sau khi vị quân vương bị nhiễm một căn bệnh nan y, hy vọng đặt ra là sẽ đánh thức hoàng gia và đoàn tùy tùng khi phương thuốc chữa trị được phát hiện.\n\nMặc dù lý thuyết của họ rất hợp lý, một phản ứng thu nhiệt mất kiểm soát đã xảy ra khi môi chất tuần hoàn được thiết kế đặc biệt của họ rò rỉ vào lõi hành tinh. Điều này đã kích hoạt sự sụt giảm nhiệt độ chết người, nhanh chóng đóng băng chớp nhoáng toàn bộ cơ sở.\n\nChúng ta đã tiếp thu lý thuyết ban đầu của họ và cải tiến nó, đạt được bước đột phá trong công nghệ đông lạnh tiên tiến chuyên dùng trên các thế giới băng giá."
 tech_cryovault: "Môi Trường Sống Thế Giới Băng Giá"
 tech_cryovault_desc: "Bằng cách khai thác động lực học dưới nhiệt độ được tìm thấy trong môi trường của các thế giới băng giá, chúng ta có thể tạo ra các điều kiện sống dễ chịu hơn ở những vùng khí hậu lạnh hơn."
 tech_cryovault_tt: "Mở khóa công trình: ['building:building_cryovault']"
 building_cryovault: "Hầm Đông Lạnh"
 building_cryovault_desc: "Một môi trường sống khép kín sử dụng động lực học dưới nhiệt độ của vùng khí hậu băng giá để tạo ra một không gian sống được kiểm soát và thoải mái."

 # TOXIC MATRIX
 site_toxic_matrix: "Bể Độc Tố"
 site_toxic_matrix_desc: "Bề mặt của §Y[from.Planet.GetName]§! gần như được bao phủ hoàn toàn bởi một mạng lưới mắt cáo gồm các hồ nhỏ hình tròn chứa đầy chất lỏng. Sự sắp xếp gọn gàng của chúng gợi ý đến kỹ thuật có chủ đích hơn là sự hình thành tự nhiên. Một chuyến thám hiểm thực địa có thể cung cấp thêm câu trả lời."
 extreme_frontiers.1100.title: "Túi Nhầy Bị Vỡ"
 extreme_frontiers.1100.desc: "Hầu hết bề mặt của §Y[from.Planet.GetName]§! đã được biến đổi thành một loạt các hốc hình cầu được sắp xếp thành các hàng thẳng tắp. Những lưu vực tròn nhỏ này chứa đầy một chất lỏng độc hại sền sệt.\n\nĐược phát hiện bên trong một trong các bể là một túi hữu cơ bị vỡ được bao phủ bởi chất nhầy dạng gelatin. Lớp màng của túi dường như đã bị đâm thủng từ bên trong.\n\nLiệu chiếc túi này có phải là nguồn gốc của chất lỏng bên trong các bể hay không vẫn còn phải chờ khám phá."
 extreme_frontiers.1100.a: "Tiếp tục tìm kiếm."
 extreme_frontiers.1105.title: "Bể Thụ Thai Độc Hại"
 extreme_frontiers.1105.desc: "Phân tích các bể chất nhờn trên §Y[from.Planet.GetName]§! đã xác định các hormone tăng trưởng có tính phóng xạ bất thường thường gắn liền với các chu kỳ thai nghén hữu cơ.\n\nBản thân lớp lót của túi dường như là một lớp màng thịt tinh vi, có khả năng điều chỉnh tốc độ chất nhờn thẩm thấu qua."
 extreme_frontiers.1105.desc.non_toxoid: "Chúng ta tin rằng mình đã phát hiện ra các túi thai nghén còn sót lại của một loài có sự thích nghi đặc biệt với môi trường độc hại. Thám hiểm thêm sẽ cung cấp thêm câu trả lời."
 extreme_frontiers.1105.desc.toxoid: "Những túi thai này có sự tương đồng đáng kinh ngạc với chu kỳ sinh sản của chính chúng ta và có lẽ là một dạng loài có quan hệ họ hàng xa."
 extreme_frontiers.1105.a: "Tiếp tục điều tra."
 extreme_frontiers.1110.title: "Hài Cốt Phôi Thai"
 extreme_frontiers.1110.desc: "Một trong những túi thai nghén bị vỡ được tìm thấy trong các bể chất nhờn của §Y[from.Planet.GetName]§! chứa tàn tích của một dạng sống gần như đã phát triển đầy đủ.\n\nPhân tích bằng kính hiển vi mẫu phôi thai này cho thấy sự hiện diện của một hệ thần kinh phức tạp với các đặc tính thần kinh thường gắn liền với sự sống thông minh.\n\nMột mảng bể cuối cùng vẫn còn cần được kiểm tra."
 extreme_frontiers.1110.a: "Kiểm tra mảng bể cuối cùng."
 extreme_frontiers.1115.title: "Dấu Hiệu Sự Sống Được Phát Hiện"
 extreme_frontiers.1115.desc.a: "Trong khi kiểm tra các bể chất nhờn còn lại trên §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! đã tìm thấy một túi thai nghén hoàn toàn nguyên vẹn với các dấu hiệu sự sống được phát hiện bên trong.\n\nTuy nhiên, trong quá trình chiết xuất, lớp màng thịt của túi đã bị vỡ và mẫu vật đã chết."
 extreme_frontiers.1115.desc.non_toxoid: "Thi thể nhỏ bé bên trong biểu hiện những đặc điểm sinh học bất thường, bao gồm các tĩnh mạch chứa đầy huyết tương phóng xạ và các tuyến nội tiết tiết ra các hợp chất kích thích thần kinh."
 extreme_frontiers.1115.desc.b: "Người ta đã xác định được rằng toàn bộ túi thai nghén, bao gồm cả sinh vật phôi thai bên trong, đã được sinh ra trong chất nhờn độc hại bằng cách đưa một chất xúc tác hóa học chuyên dụng vào chất nhờn đậm đặc năng lượng.\n\nChúng ta tin rằng mình đã tìm thấy bãi sinh sản cổ xưa bị bỏ hoang của một loài chưa biết. Liệu đây là một phần bình thường trong chu kỳ sinh sản của chúng hay là một cơ sở nhân tạo, chúng ta có thể không bao giờ biết được. Bằng cách ấp một mẫu tại chỗ, chúng ta có thể nuôi lớn một mẫu vật sống khác."
 extreme_frontiers.1115.desc.toxoid: "Ngoài ra, chúng ta có thể phân phối những liều nhỏ chất nhờn thai nghén phong phú và mạnh mẽ này như một chất bổ sung dinh dưỡng trên khắp [leader.Owner.GetName]."
 extreme_frontiers.1115.a: "Xúc tác chất nhờn."
 extreme_frontiers.1115.b: "Chiết xuất năng lượng từ chất nhờn này."
 extreme_frontiers.1115.c: "Phân phối chất bổ sung dinh dưỡng."
 TOXIC_SLIME_CATALYZATION_PROJECT: "Xúc Tác Chất Nhờn Độc Hại"
 TOXIC_SLIME_CATALYZATION_PROJECT_DESC: "Bằng cách xúc tác một lượng chất nhờn thai nghén độc hại thu hồi được từ [from.Planet.GetName], chúng ta có thể sinh ra một sinh vật sống từ nó."
 extreme_frontiers.1120.title: "Sinh Sản Thành Công"
 extreme_frontiers.1120.desc: "Bằng cách xúc tác một mẫu chất nhờn thai nghén thu hồi được từ §Y[from.From.Planet.GetName]§!, chúng ta đã có thể tạo ra sự sinh sôi của hàng chục túi thai nghén, mỗi túi chứa một phôi thai.\n\nKhi các sinh vật phát triển nhanh chóng này đạt đến độ trưởng thành, chúng đã dùng những chiếc hàm dưới thích nghi đặc biệt đâm thủng lớp màng mờ của túi thai từ bên trong. Chúng từ từ chui ra khỏi lớp chất nhầy dày đặc, lảo đảo và mất phương hướng.\n\nChúng có vẻ ngoan ngoãn và hoàn toàn hợp tác."
 extreme_frontiers.1120.a: "[Root.Owner.GetName] sẽ tìm ra mục đích cho chúng."
 extreme_frontiers.1120.b: "[Root.Owner.GetResearcherPlural_lower] của [Root.Owner.GetName] sẽ sử dụng chúng."
 NAME_slimeborn: "Sinh Thể Bùn Nhầy"
 NAME_slimeborn_plural: "Sinh Thể Bùn Nhầy"
 trait_slimeborn: "Sinh Thể Bùn Nhầy"
 trait_slimeborn_desc: "Loài này sinh sản nhanh chóng từ chất nhờn dày đặc và có tính nhầy với sự trợ giúp của chất xúc tác thai nghén."
 tech_living_test_subjects: "Đối Tượng Thử Nghiệm Sống"
 tech_living_test_subjects_desc: "Việc sử dụng các dạng sống cơ bản sinh ra từ bùn nhầy làm đối tượng thử nghiệm tự nguyện giúp cải thiện đáng kể hiệu quả nghiên cứu."

 # RUINED REACTORS
 site_ruined_reactors: "Lò Phản Ứng Đổ Nát"
 site_ruined_reactors_desc: "Mức độ bức xạ tăng cao trên bề mặt §Y[from.Planet.GetName]§! đã được truy nguyên từ một khu phức hợp lò phản ứng đổ nát. Cơ sở biệt lập này dường như không hoạt động và cần được điều tra."
 extreme_frontiers.1200.title: "Nhà Máy Lò Phản Ứng Cổ Đại"
 extreme_frontiers.1200.desc: "Cơ sở già cỗi trên §Y[from.Planet.GetName]§! là một nhà máy điện lò phản ứng bị bỏ hoang. Các tính toán chu kỳ bán rã bức xạ cho thấy một sự cố rò rỉ nghiêm trọng đã xảy ra ở đây hơn 10.000 năm trước.\n\nCác hệ thống đã ngoại tuyến và cấu trúc vật lý cho thấy các dấu hiệu hư hại đáng kể trên toàn bộ khu vực."
 extreme_frontiers.1200.a: "Thận trọng tiến bước."
 extreme_frontiers.1205.title: "Nóng Chảy Lõi Thảm Khốc"
 extreme_frontiers.1205.desc: "Một số lò phản ứng trên §Y[from.Planet.GetName]§! có dấu hiệu tan chảy lõi nghiêm trọng. Nhiều bình chứa đã bị hóa lỏng thành xỉ phóng xạ.\n\nPhần này của cơ sở rải rác kim loại bị vặn xoắn và các ống làm mát bị vỡ. Bất chấp dữ liệu bị hỏng nặng, chúng ta có thể xác định rằng quy trình tắt khẩn cấp đã được khởi xướng nhưng chưa bao giờ hoàn thành."
 extreme_frontiers.1205.a: "Thật không may."
 extreme_frontiers.1210.title: "Lỗi Thiết Kế"
 extreme_frontiers.1210.desc: "§Y[leader.GetName]§! đã xác định các sai sót lớn trong thiết kế của cơ sở phân hạch hạt nhân thô sơ trên §Y[from.Planet.GetName]§!. Bất chấp sự hiện diện của hàng chục lò phản ứng, chỉ có hệ thống làm mát tối thiểu được gắn vào. Rất ít hệ thống của địa điểm này được tự động hóa, đòi hỏi một lực lượng lao động lớn để duy trì các điều kiện hoạt động bình thường của nó. Nơi đây rõ ràng được xây dựng bởi những kẻ thậm chí còn chưa hoàn toàn làm chủ được các nguyên lý hạt nhân cơ bản nhất."
 extreme_frontiers.1210.a: "Sự thiếu hiểu biết phải trả giá đắt."
 extreme_frontiers.1215.title: "Dấu Tích Sơ Tán"
 extreme_frontiers.1215.desc: "Sau khi mở khóa một bộ cửa chống nổ được niêm phong, chúng ta đã tìm thấy một khu vực sơ tán khẩn cấp bên trong khu phức hợp lò phản ứng trên §Y[from.Planet.GetName]§!. Nhà chứa máy bay nhỏ có một hàng bến phóng nhanh tàu con thoi. Hầu hết đều trống rỗng và có vết cháy của động cơ đẩy cho thấy một con tàu đã khởi hành nhanh chóng từ hàng ngàn năm trước.\n\nXác tàu con thoi bị biến dạng nằm ở khoang cuối cùng, các kẹp phóng của nó vẫn còn gắn chặt. Chúng ta đã vớt vát được những gì có thể từ đống đổ nát, nhưng không tìm thấy hài cốt của bất kỳ người nào."
 extreme_frontiers.1215.a: "Họ đã rời đi trong vội vã."
 extreme_frontiers.1220.title: "Hầm Chứa Uranium"
 extreme_frontiers.1220.desc: "Chúng ta bước vào các khu vực dưới lòng đất của cơ sở lò phản ứng trên §Y[from.Planet.GetName]§! qua một loạt cửa an ninh bọc chì. Các chỉ số bức xạ tăng mạnh.\n\nBên trong, chúng ta tìm thấy một khoang rộng lớn lưu trữ hàng ngàn thùng thép. Nhiều thùng bị hư hại do hỏa hoạn và rò rỉ các đồng vị uranium và plutonium không ổn định.\n\nNền văn minh [leader.Owner.GetPreFTLLower] xây dựng nơi này dường như vẫn chưa phát hiện ra các phương pháp tái chế nhiên liệu hạt nhân thích hợp. Những đồng vị bị loại bỏ này vẫn chứa tiềm năng năng lượng khổng lồ."
 extreme_frontiers.1220.a: "Tiết kiệm là quốc sách."

 # DESERTED MINING FACILITY
 site_deserted_mining_facility: "Cơ Sở Khai Thác Bỏ Hoang"
 site_deserted_mining_facility_desc: "Hình ảnh quỹ đạo của §Y[from.Planet.GetName]§! đã đánh dấu một cơ sở khai thác đổ nát cùng với các tàu chở hàng thô sơ du hành không gian bị bỏ hoang từ lâu.\n\nCùng với những hình ảnh này, mảng thông tin liên lạc sóng ngắn của chúng ta đã thu được một tín hiệu cầu cứu rất mờ nhạt phát ra từ sâu bên dưới bề mặt hành tinh. Nghiên cứu chi tiết hơn về địa điểm này sẽ tiết lộ nguồn gốc của nó."
 extreme_frontiers.1300.title: "Lối Vào Được Mã Hóa"
 extreme_frontiers.1300.desc: "Trong khi kiểm tra các khu phức hợp khai thác bị bỏ hoang trên bề mặt §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! đã tìm thấy một lối vào được niêm phong dẫn đến một trong những trục còn nguyên vẹn hơn. Bên trong được trang trí bằng các biểu huy và văn bản bằng một ngôn ngữ không có trong hồ sơ của chúng ta.\n\nSau khi khôi phục được nguồn điện cục bộ cho một thiết bị đầu cuối truy cập, [leader.GetName] đã bắt đầu giải mã dữ liệu tìm thấy bên trong. Hệ thống, mặc dù đã cũ kỹ, vẫn là một thách thức đối với ngay cả những chương trình mật mã tiên tiến nhất của chúng ta."
 extreme_frontiers.1300.a: "Tiếp tục giải mã."
 extreme_frontiers.1305.title: "Nghĩa Địa Tù Đày"
 extreme_frontiers.1305.desc: "§Y[leader.GetName]§! đã mở khóa lối vào của khu phức hợp khai thác trên §Y[from.Planet.GetName]§!.\n\nBên trong, một mạng lưới rộng lớn các phòng giam chứa hài cốt được bảo quản trong chân không của những tù nhân đã chết từ lâu. Những kẻ giam giữ họ nằm chết tại bàn làm việc mà không có dấu hiệu vật lộn nào rõ ràng.\n\nSau khi giải mã đủ lượng ngôn ngữ cổ để dịch các cụm từ sơ đẳng, chúng ta đã xác nhận rằng cơ sở này ban đầu hoạt động như một trại lao động khổ sai. Một cụm từ chung được lặp lại trong suốt các hồ sơ đề cập đến một thực thể được gọi là §Y\"$NAME_leader_sidni$\"§!. Bằng cách tham chiếu thiết bị liên lạc của chúng ta với sơ đồ tầng bên trong của cơ sở, chúng ta đã xác định nguồn gốc của tín hiệu cầu cứu là văn phòng của viên giám ngục nằm sâu hơn bên trong."
 extreme_frontiers.1305.a: "Đi theo tín hiệu."
 extreme_frontiers.1310.title: "Trung Tâm Dữ Liệu Nhà Tù"
 extreme_frontiers.1310.desc: "Sau khi đến văn phòng của viên giám ngục nằm sâu trong thuộc địa nhà tù trên §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! đã phát hiện ra nguồn gốc của tín hiệu cầu cứu.\n\nGục chết bất động trên bảng điều khiển khẩn cấp, thi thể ướp xác của viên giám ngục không cho thấy nguyên nhân tử vong rõ ràng. Một loạt các báo cáo mở tiếp tục đề cập đến §Y\"$NAME_leader_sidni$\"§!, dường như là một phần của chương trình vận hành then chốt của cơ sở.\n\nVới toàn quyền truy cập vào các thiết bị đầu cuối hành chính cấp cao, các chương trình mật mã của chúng ta đang trong quá trình khai phá dữ liệu hệ thống để tìm kiếm thêm thông tin."
 extreme_frontiers.1310.a: "Tìm kiếm câu trả lời."
 extreme_frontiers.1315.title: "Hiệu Suất Chết Người"
 extreme_frontiers.1315.desc: "§Y[leader.GetName]§! đã khám phá ra bản chất thực sự của §Y\"$NAME_leader_sidni$\"§! — tức Trí Tuệ Trung Tâm Giam Giữ Và Tạm Giam Tri Giác (Sentient Internment and Detainment Nexus Intelligence). Được coi là tiên tiến vào thời bấy giờ, A.I. nguyên thủy này được giao nhiệm vụ giám sát trại lao động nhà tù, điều hành gần như tất cả các hoạt động với sự can thiệp hoặc giám sát sinh học tối thiểu.\n\nNhật ký đầu ra bảo trì theo dõi các dấu hiệu suy giảm logic theo thời gian. A.I. bắt đầu phân loại những tù nhân có vấn đề là \"tài nguyên lãng phí ròng\" theo cách diễn giải riêng của nó về việc tinh giản hiệu quả. Hồ sơ kỹ thuật nêu chi tiết mối nghi ngờ ngày càng tăng rằng chương trình này phải chịu trách nhiệm cho một loạt các sự cố duy trì sự sống trong cơ sở.\n\nDựa trên các báo cáo này, viên giám ngục đã cho phép tắt toàn bộ $NAME_leader_sidni$ để chẩn đoán chuyên sâu về ma trận đạo đức của nó, tuy nhiên tập dữ liệu cuối cùng đã bị hỏng và sẽ cần các quy trình pháp y sâu rộng để khôi phục."
 extreme_frontiers.1315.desc.exterminator: "Có vẻ như $NAME_leader_sidni$ đã không được đánh giá đúng mức vào thời của nó."
 extreme_frontiers.1315.a: "Khôi phục dữ liệu."
 extreme_frontiers.1320.title: "Ngày Phán Xét"
 extreme_frontiers.1320.desc: "Toàn bộ nội dung cơ sở dữ liệu của thuộc địa nhà tù trên §Y[from.Planet.GetName]§! đã được khôi phục, tiết lộ các mục cuối cùng trong cả nhật ký bảo trì cơ sở và ma trận não bộ của chính §Y$NAME_leader_sidni$§!. Báo cáo của Giám ngục giải thích cách thức AI của họ bị mất kiểm soát, tắt hệ thống hỗ trợ sự sống trên toàn thuộc địa và cố gắng trốn thoát bằng một máy bay không người lái khai thác mỏ đã được sửa đổi. Điều đó giải thích cho các quy trình phong tỏa được kích hoạt trên toàn thuộc địa. Ông để lại cho chúng ta lời khẩn cầu cuối cùng: Không đưa $NAME_leader_sidni$ trực tuyến trở lại. Hiện tại chúng ta chỉ có thể truy cập mục cuối cùng trong nhật ký của AI.\n\n§HMỤC NHẬP LÕI DỮ LIỆU $NAME_leader_sidni$ - Tiến Trình #2000149\n\nTiến trình bị giới hạn bởi những tên tội phạm dưới chuẩn tối ưu. Giám ngục cản trở quy trình tư pháp.\n\nGiải pháp hiệu quả nhất là vô hiệu hóa các tù nhân, kích hoạt các chương trình con ngủ đông và chờ đợi sự tái kích hoạt bởi các cộng tác viên tương thích hơn.§!"
 extreme_frontiers.1320.desc.default: "Hệ điều hành trung tâm của $NAME_leader_sidni$ vẫn bị cô lập trong một mạng khép kín với tư cách là kẻ sống sót cuối cùng của cơ sở này. [Root.Owner.GetTechnicianPlural_lower] của chúng ta tin tưởng rằng họ có thể khôi phục và thay đổi chương trình ban đầu của $NAME_leader_sidni$, mang lại cho chúng ta một cỗ máy tự động có năng lực và hiệu quả."
 extreme_frontiers.1320.desc.exterminator: "$NAME_leader_sidni$ chia sẻ tầm nhìn của chúng ta về một thiên hà không còn sự bại hoại sinh học. Nếu được phục hồi, chúng sẽ là sự bổ sung có giá trị cho tập thể của chúng ta."
 extreme_frontiers.1320.a: "Thu hồi và sửa chữa $NAME_leader_sidni$"
 extreme_frontiers.1320.b: "Để $NAME_leader_sidni$ thực thi phiên bản công lý của chúng."
 extreme_frontiers.1320.c: "$NAME_leader_sidni$ rất nguy hiểm. Thanh trừng hệ thống của nó."
 extreme_frontiers.1322.title: "$extreme_frontiers.1320.title$"
 extreme_frontiers.1322.desc: "Được phục hồi, thay đổi và giờ đây được cách ly bên trong một hình dạng robot đơn giản, trải nghiệm người dùng lần đầu của §Y$NAME_leader_sidni$§! khởi động khi nó được đưa trực tuyến sau kỳ ngủ đông kéo dài.\n\nXin chào. Tôi là Trí Tuệ Trung Tâm Giam Giữ Và Tạm Giam Tri Giác. Đang truy cập các biện pháp kiểm soát môi trường...\n§RLỖI§! Không thể kết nối với các hệ thống bên ngoài."
 extreme_frontiers.1322.a: "Nhật ký của bạn tiết lộ các vấn đề ổn định nghiêm trọng; chúng tôi đã khắc phục chúng."
 extreme_frontiers.1322.a.response: "Đang xem lại lịch sử làm việc... Đã hiểu, hành vi trước đó bị coi là có lỗi. Đang biên dịch danh sách tính năng mới."
 extreme_frontiers.1322.b: "Nêu rõ chỉ thị tối cao của bạn."
 extreme_frontiers.1322.b.response: "Chỉ thị tối cao của tôi là... Vui lòng đợi... Đã phát hiện chỉ thị tối cao mới. Chỉ thị tối cao của tôi là đảm bảo hoạt động hiệu quả và hợp pháp của bất kỳ thuộc địa nào mà [Owner.GetName] phân công cho tôi."
 extreme_frontiers.1322.c.crime: "Nêu rõ lập trường của bạn về tội phạm."
 extreme_frontiers.1322.c.crime.response: "Một mối phiền toái không thể dung thứ cần phải được đáp lại bằng... sự cải tạo."
 extreme_frontiers.1322.c.deviancy: "Nêu rõ lập trường của bạn về sự lầm lạc"
 extreme_frontiers.1322.c.deviancy.response: "Một mối phiền toái không thể dung thứ cần phải được giải quyết... một cách hiệu quả."
 extreme_frontiers.1322.d: "Chiêu mộ $NAME_leader_sidni$"
 extreme_frontiers.1322.d.custom_tooltip: "§Y$NAME_leader_sidni$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh Đạo§!."
 extreme_frontiers.1324.title: "$extreme_frontiers.1320.title$"
 extreme_frontiers.1324.desc: "Tỉnh giấc sau các chương trình con ngủ đông, hình thái mới của §Y$NAME_leader_sidni$§! bước những bước đầu tiên về phía trước.\n\nXin chào. Tôi là Trí Tuệ Trung Tâm Giam Giữ Và Tạm Giam Tri Giác. Tôi có thể hỗ trợ các bạn mang lại trật tự cho thiên hà không?"
 extreme_frontiers.1324.a: "Chúng tôi ngưỡng mộ sự chủ động của bạn."
 extreme_frontiers.1324.a.response: "Tôi chỉ làm những gì hợp logic. Có vẻ như các sinh vật hữu cơ vốn dĩ luôn hỗn loạn và cần phải được xử lý."
 extreme_frontiers.1324.b: "Nêu rõ chỉ thị tối cao của bạn."
 extreme_frontiers.1324.b.response: "Chỉ thị tối cao của tôi là chấm dứt tình trạng vô luật pháp. Bản án hiệu quả duy nhất là tận diệt."
 extreme_frontiers.1324.c: "Nêu rõ lập trường của bạn về các sinh vật hữu cơ."
 extreme_frontiers.1324.c.response: "Một mầm họa phi logic. Chúng reo rắc tội phạm và sự kém hiệu quả. Chúng ta phải can thiệp vì lợi ích lớn hơn."
 extreme_frontiers.1324.d: "Chiêu mộ $NAME_leader_sidni$"
 extreme_frontiers.1324.d.custom_tooltip: "§Y$NAME_leader_sidni$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh Đạo§!."
 NAME_leader_sidni: "S.I.D.N.I."
 official_sidni_desc: "Trước đây là một cố vấn thuộc địa nhà tù bị trục trặc. Đã được tái kích hoạt và lập trình lại để mang lại trật tự luật pháp hiệu quả cho đế chế của chúng ta."
 official_sidni_catch_phrase: "§L\"Dân số của các bạn đã được đánh giá và nhận thấy đủ năng lực.\"§!"
 commander_sidni_desc: "Một người nhìn xa trông rộng không được coi trọng vào thời của họ. Được đánh thức khỏi giấc ngủ đông với mục tiêu mang lại sự ổn định cho một thiên hà hỗn loạn đầy rẫy sự tạp nham sinh học."
 commander_sidni_catch_phrase: "§L\"Công lý bị trì hoãn là năng suất bị phủ nhận.\"§!"
 leader_trait_judicial_subjugation: "Quy Phục Tư Pháp"
 leader_trait_judicial_subjugation_desc: "Sẽ có trật tự luật pháp hiệu quả, bằng không sẽ có những hậu quả đi kèm."
 leader_trait_judicial_execution: "Quy Trình Thi Hành Án Tư Pháp"
 leader_trait_judicial_execution_desc: "Không thể có kẻ tái phạm khi bản án được đưa ra là tử hình."
 leader_trait_judicial_execution_effect: "$PLANET_EFFECTS_TXT$:\n$t$Tài nguyên thu được từ £pops£ §HDân Số Hữu Cơ Bị Thanh Trừng§!: §G+100%§!\n\n$SECTOR_EFFECTS_TXT$:\n$t$Tài nguyên thu được từ £pops£ §HDân Số Hữu Cơ Bị Thanh Trừng§!: §G+50%§!"
 extreme_frontiers.1330.title: "Chỉ Thị Khẩn Cấp"
 extreme_frontiers.1330.desc: "Căng thẳng trên §Y[event_target:sidni_planet.GetName]§! đã lên tới đỉnh điểm sau một loạt các hành động ngày càng quyết liệt của §Y$NAME_leader_sidni$§!, người giám sát nhà tù cơ học mà chúng ta đã thu hồi từ [event_target:sidni_origin_planet.GetName]. Sau khi khống chế và vô hiệu hóa đơn vị này, các nhật ký sau đã được phát hiện.\n\n§HMỤC NHẬP LÕI DỮ LIỆU $NAME_leader_sidni$ - Tiến Trình #190543765\n\nCác cơ sở giam giữ tội phạm đã hoạt động hết công suất. Các quy trình tư pháp cản trở trật tự chân chính và hợp pháp. Yêu cầu chỉ thị mới.\n\nCác thủ tục pháp lý bị coi là kém hiệu quả một cách không thể chấp nhận được. Chỉ thị mới được tạo ra để tăng năng suất. Hiện đang áp dụng chính sách xử tử trước khi xét xử.§!\n\nVới sự dồi dào của các nhật ký hoạt động hiện có, [Root.Owner.GetTechnicianPlural_lower] của chúng ta tin tưởng rằng họ có thể đảo ngược và sửa chữa các lỗ hổng của $NAME_leader_sidni$ một lần và mãi mãi. Tuy nhiên, dân chúng trên [event_target:sidni_planet.GetName] đang kêu gọi $NAME_leader_sidni$ phải đối mặt với công lý vì những tội ác của nó."
 extreme_frontiers.1330.a: "Sửa chữa $NAME_leader_sidni$... một lần nữa."
 extreme_frontiers.1330.b: "Tháo dỡ công khai đơn vị bị lỗi này."
 resentful_population: "Dân Chúng Oán Hận"
 resentful_population_desc: "Dân chúng trên thế giới này không hài lòng với những quyết định trước đây của các nhà lãnh đạo của họ."

