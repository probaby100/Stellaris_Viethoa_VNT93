 # CHRONICLES OF DENDRUS
 chronicles_of_dendrus_chain_title: "Biên Niên Sử Dendrus"
 chronicles_of_dendrus_chain_desc: "Bằng cách nghiên cứu \"Biên Niên Sử\", một tập hợp các bằng chứng toán học phức tạp được thu hồi từ con tàu chở giống loài gặp nạn trên §Y[from.Planet.GetName]§!, chúng ta hướng tới việc tìm hiểu thêm về hành tinh thiên đường được người Dendritian tìm kiếm, §YNew Bratulla§!."
 site_chronicles_of_dendrus: "$chronicles_of_dendrus_chain_title$"
 site_chronicles_of_dendrus_desc: "Các lần quét §Y[from.Planet.GetName]§! đã tiết lộ sự hiện diện của một xác tàu đắm trong không gian. Con tàu dường như đã phải chịu một cú hạ cánh mất kiểm soát tại đây nhiều năm trước.\n\nQuy mô khổng lồ của nó cho thấy những nguồn tài nguyên to lớn từng được dồn vào việc chế tạo. Một chuyến thám hiểm khảo cổ sẽ giúp chúng ta xác định làm thế nào nó lại trôi dạt đến đây."
 extreme_frontiers.1400.title: "Tàu Vận Tải Khổng Lồ"
 extreme_frontiers.1400.desc: "Phân tích bên ngoài của con tàu bị đắm trên §Y[from.Planet.GetName]§! cho thấy nó là một tàu vận tải công suất lớn. Các hệ thống của nó không hoạt động và không phản hồi, không có dấu hiệu sự sống nào có thể phát hiện được bên trong. Phân tích trầm tích chỉ ra rằng nó đã ở đây khoảng một thế kỷ, một khoảng thời gian khá gần đây trên thang thời gian thiên hà."
 extreme_frontiers.1400.a: "Khám phá bên trong."
 extreme_frontiers.1405.title: "Tàu Thuộc Địa Bị Định Đoạt Số Phận"
 extreme_frontiers.1405.desc: "Bên trong con tàu đắm trên §Y[from.Planet.GetName]§!, chúng ta tìm thấy các buồng tinh vi dành cho việc trồng thực vật thủy canh, nguồn dự trữ hạt giống và đất rộng lớn, cùng các khoang hàng chứa đầy công cụ và vật liệu xây dựng chưa từng được chạm tới. Nhiều thiết bị đầu cuối dữ liệu chứa các kế hoạch cho một thuộc địa mới, được định danh là \"§YNew Bratulla§!\".\n\nỞ các tầng dưới, chiếm cứ hàng ngàn khoang ngủ đông, là những thi thể đã chết của những cư dân trước đây của con tàu."
 extreme_frontiers.1405.desc.phototrophic: "$extreme_frontiers.1405.desc$ Giống như chúng ta, họ dựa vào quá trình quang hợp để tăng trưởng và tái tạo tế bào. Dáng vẻ khô héo của họ cho thấy họ đã bỏ mạng vào một thời điểm nào đó trong giấc ngủ đình trệ kéo dài."
 extreme_frontiers.1405.desc.default: "$extreme_frontiers.1405.desc$ Dáng vẻ khô héo của những sinh vật quang dưỡng này cho thấy họ đã bỏ mạng vào một thời điểm nào đó trong giấc ngủ đình trệ kéo dài."
 extreme_frontiers.1405.a: "Tiếp tục khám phá."
 extreme_frontiers.1405.b: "Tiêu thụ hài cốt của họ và tiếp tục."
 extreme_frontiers.1410.title: "Đền Thờ Quê Hương"
 extreme_frontiers.1410.desc: "Chúng ta đã phát hiện ra một gian phòng tôn nghiêm bên trong con tàu thuộc địa bị đắm trên §Y[from.Planet.GetName]§! được trang trí bằng những hình ảnh minh họa công phu về cuộc sống trên một hành tinh có tên là \"§YBratulla§!\". Một số bức tranh mô tả một thế giới tươi tốt với hệ thực vật phát triển rực rỡ, trong khi những bức khác kể chi tiết về sự suy tàn của môi trường và cái chết hàng loạt. Bức tranh lớn nhất mô tả con tàu này rời bỏ một vùng đất hoang tàn và không có sự sống.\n\nMột thiết bị đầu cuối dữ liệu trung tâm chứa các đoạn video ngắn ghi lại hình ảnh của thủy thủ đoàn trên tàu. Sau khi lập bản đồ ngôn ngữ sâu rộng, chúng ta đã đưa ra các bản dịch.\n\n§SArborixxeum - Khoang 9721\n\nRời đi thật đau đớn. Nhưng cắm rễ trên New Bratulla sẽ chữa lành cho chúng ta.\n\nDarkht Paam - Khoang 21301\n\nHãy tin tưởng vào biên niên sử, hỡi những người Dendritian. New Bratulla sẽ là sự cứu rỗi của chúng ta.§!\n\nChúng ta vẫn đang tìm kiếm boong chỉ huy của con tàu khổng lồ này."
 extreme_frontiers.1410.a: "Tiếp tục tìm kiếm."
 extreme_frontiers.1415.title: "Boong Chỉ Huy"
 extreme_frontiers.1415.desc: "Sau khi tiếp cận được boong chỉ huy của con tàu, chúng ta đã trích xuất và dịch nhật ký chuyến bay cuối cùng của nó.\n\n§STÀU CHỞ HẠT GIỐNG DENDRUS I - NHẬT KÝ KHẨN CẤP - XZ-47/9-113.5-AE\n\nTôi e rằng niềm tin của chúng ta vào Biên Niên Sử đã đặt nhầm chỗ. Chúng ta đã đến nhưng New Bratulla, hành tinh thiên đường, không có ở đây. Không có gì ở đây có thể duy trì sự sống của người Dendritian.\n\nGiấc ngủ đình trệ của tất cả hành khách đã được kéo dài. Chúng tôi sẽ tiếp tục cuộc tìm kiếm...§!\n\nViệc khôi phục dữ liệu thêm đã được thực hiện để thu thập những \"Biên Niên Sử\" này từ thiết bị đầu cuối khoa học của boong tàu, tiết lộ một kho tàng các bằng chứng toán học bất thường. Những phương trình này sử dụng một dạng toán học Dendritian kỳ lạ và giả thuyết về vị trí của một hành tinh có thể sinh sống được một cách độc đáo, §YNew Bratulla§!."
 extreme_frontiers.1415.a: "Nghiên cứu những \"Biên Niên Sử\" này."
 DENDRITIAN_CHRONICLES_PROJECT_DEFAULT: "Nghiên Cứu Biên Niên Sử Dendritian"
 DENDRITIAN_CHRONICLES_PROJECT_MACHINE: "$DENDRITIAN_CHRONICLES_PROJECT_DEFAULT$"
 DENDRITIAN_CHRONICLES_PROJECT_DEFAULT_DESC: "Bằng cách nghiên cứu \"Biên Niên Sử\", một tập hợp các bằng chứng toán học phức tạp được thu hồi từ con tàu chở giống loài gặp nạn trên §Y[from.Planet.GetName]§!, chúng ta hướng tới việc tìm hiểu thêm về hành tinh thiên đường được người Dendritian tìm kiếm, §YNew Bratulla§!."
 DENDRITIAN_CHRONICLES_PROJECT_MACHINE_DESC: "$DENDRITIAN_CHRONICLES_PROJECT_DEFAULT_DESC$"
 extreme_frontiers.1420.title: "Phát Hiện Tuyến Siêu Không Gian Thoái Hóa"
 extreme_frontiers.1420.desc: "Biên Niên Sử Dendritian bao gồm một loạt các tiên đề và trừu tượng toán học phức tạp. Những định lý gây tò mò này cho thấy rằng hệ sao §Y[from.solar_system.GetName]§! chứa thêm một tuyến siêu không gian trước đây chưa từng được lập bản đồ, dẫn đến §YNew Bratulla§!. Sau khi quét lượng tử sâu rộng khu vực này, cuối cùng chúng ta đã xác định được điểm ranh giới cho tuyến siêu không gian bị mất này, bị che khuất và thoái hóa nghiêm trọng do ở quá gần lỗ đen của hệ sao. Bằng cách khôi phục nó, chúng ta sẽ là những người đầu tiên khám phá những gì nằm ngoài đó."
 extreme_frontiers.1420.a: "Chúng ta đã tìm thấy điều mà người Dendritian không thể."
 RESTORE_HYPERLANE_PROJECT: "Khôi Phục Tuyến Siêu Không Gian Thoái Hóa"
 RESTORE_HYPERLANE_PROJECT_DESC: "Nếu chúng ta có thể tìm ra cách khôi phục tuyến siêu không gian bị thoái hóa trong §Y[from.solar_system.GetName]§!, chúng ta sẽ có thể xác nhận sự tồn tại của §YNew Bratulla§!, hành tinh thiên đường mà người Dendritian tìm kiếm."
 extreme_frontiers.1425.title: "Khôi Phục Tuyến Siêu Không Gian"
 extreme_frontiers.1425.desc: "Bằng cách dẫn năng lượng vào lỗ đen trong §Y[from.Planet.solar_system.GetName]§!, chúng ta đã sắp xếp lại các trường hấp dẫn của nó để giải phóng lối vào tuyến siêu không gian đã bị thoái hóa trước đó.\n\nNhững phát hiện ban đầu xác nhận sự tồn tại của một hành tinh đơn lẻ ở đầu bên kia của tuyến siêu không gian, khớp với các đặc tính của §YNew Bratulla§! như được mô tả trong Biên Niên Sử Dendritian."
 extreme_frontiers.1425.a: "Một thế giới mới để thám hiểm."
 NAME_new_bratulla: "New Bratulla"
 NAME_new_bratulla_star: "Kipos"
 extreme_frontiers.1430.title: "New Bratulla"
 extreme_frontiers.1430.desc.common: "Chúng ta đã xác nhận sự tồn tại của New Bratulla, hành tinh được mô tả trong Biên Niên Sử Dendritian. Nó sở hữu một hệ sinh thái thực vật phong phú và đa dạng độc nhất vô nhị, với các cuộc khảo sát ban đầu phát hiện ra hàng triệu loài bản địa khác nhau."
 extreme_frontiers.1430.desc.begin: "Thế giới đầy mê hoặc này đặc biệt thích hợp để hỗ trợ các dạng sống thực vật có nguồn gốc di truyền như"
 extreme_frontiers.1430.desc.end: "Đất của nó là ngôi nhà của hàng tỷ loại vi khuẩn khác nhau giúp nuôi dưỡng, bảo vệ và sửa chữa các cấu trúc rễ hữu cơ.\n\nThực vật dường như chia sẻ chất dinh dưỡng theo nhu cầu lớn nhất, với những cây tạm thời dư dả chia sẻ lượng dư thừa của chúng qua một hệ thống rễ liên kết chặt chẽ."
 extreme_frontiers.1430.desc.default: "$extreme_frontiers.1430.desc.begin$ của người Dendritian. $extreme_frontiers.1430.desc.end$"
 extreme_frontiers.1430.desc.phototrophic: "$extreme_frontiers.1430.desc.begin$ của chúng ta. $extreme_frontiers.1430.desc.end$"
 extreme_frontiers.1430.desc.respawn: "[Root.Owner.GetScientistPlural] của chúng ta tin rằng có thể tái lập loài Dendritian tại đây bằng cách cấy ghép các mẫu di truyền thu hồi từ tàu chở giống loài của họ vào vùng đất khác thường của hành tinh này."
 extreme_frontiers.1430.a: "Người Dendritian thuộc về nơi này."
 extreme_frontiers.1430.b.default: "New Bratulla thuộc về chúng ta."
 extreme_frontiers.1430.b.phototrophic: "Thế giới này hoàn hảo cho chúng ta."
 extreme_frontiers.1430.b.megacorp: "Thế giới chưa được khai thác này là của chúng ta để sinh lời."
 NAME_buds_of_dendrus: "Chồi Non Dendrus"
 NAME_dendritian: "Dendritian"
 NAME_dendritian_plural: "Người Dendritian"
 ADJECTIVE_dendritian: "Dendritian"
 opinion_dendrus: "Đấng Cứu Thế Dendritian"
 opinion_to_dendrus: "$opinion_dendrus$"
 extreme_frontiers.1435.title: "Lời Đề Nghị Chư Hầu"
 extreme_frontiers.1435.desc: "Phải mất hàng thế kỷ... nhưng điều mà Biên Niên Sử Dendritian báo trước cuối cùng đã thành sự thật. Cuối cùng, trên §YNew Bratulla§!, chúng tôi đã cắm rễ và sinh sôi nảy nở.\n\nViệc chúng tôi tồn tại ở đây là nhờ có §Y[Root.GetName]§!. Chúng tôi sẽ không bao giờ quên ơn này.\n\nLòng biết ơn của chúng tôi sẽ được thể hiện không chỉ bằng lời nói, mà bằng hành động. Chúng tôi xin khiêm nhường dâng lên quý quốc lời thỉnh cầu trở thành chư hầu."
 extreme_frontiers.1435.a: "Lời thỉnh cầu chư hầu của các bạn được chấp nhận."
 extreme_frontiers.1435.b: "Chúng ta phải chứng kiến vận mệnh của các bạn mở ra."
 extreme_frontiers.1435.b.tt: "Chơi với tư cách là §RChồi Non Dendrus§!."
 extreme_frontiers.1435.c: "Kiến thức của các bạn là đủ rồi."
 extreme_frontiers.1435.c.tt: "Nhận [Root.GetDendrusGivenBiotechAmount] £society£ §YCông Nghệ Sinh Học§!"

 # GEORADIATION TERRAFORMING
 georadiation_terraforming_chain_title: "Cải Tạo Địa Bức Xạ"
 georadiation_terraforming_chain_desc: "Tàn tích của một thiết bị cải tạo hành tinh có sức hủy diệt trên §Y[from.Planet.GetName]§! tiếp tục phát tín hiệu đến nhiều địa điểm trên khắp thiên hà. Điều tra các địa điểm này sẽ tiết lộ thêm thông tin về công nghệ nguy hiểm này."
 site_georadiation_terraforming: "Mạng Lưới Dưới Lòng Đất"
 site_georadiation_terraforming_desc: "Các cảm biến của chúng ta đã phát hiện một tín hiệu liên lạc bất thường phát ra từ sâu bên trong một hố va chạm trên §Y[from.Planet.GetName]§!. Quét địa hình địa chấn cho thấy một mạng lưới các hang động dưới lòng đất với lối vào bị sụp đổ ở trung tâm hố va chạm. Cùng với điều này, thiết bị X-quang của chúng ta đang phát hiện những dấu vết bức xạ hấp dẫn mờ nhạt phát ra từ địa điểm, đặt ra nhiều câu hỏi hơn là câu trả lời."
 extreme_frontiers.1500.title: "Mảnh Vỡ Nhiễm Xạ"
 extreme_frontiers.1500.desc: "Công tác khai quật đã phát hiện các mảnh vỡ nằm rải rác bên trong hố va chạm trên §Y[from.Planet.GetName]§!. Những mảnh vỡ này đang phát ra dấu vết mạnh mẽ của bức xạ hấp dẫn từng được phát hiện trước đó từ quỹ đạo.\n\nVới việc tiếp cận mạng lưới hang động dưới bề mặt được bảo đảm, §Y[leader.GetName]§! hiện đã sẵn sàng lần theo tín hiệu liên lạc đến nguồn gốc của nó."
 extreme_frontiers.1500.a: "Lần theo tín hiệu."
 extreme_frontiers.1505.title: "Thiết Bị Bị Ăn Mòn"
 extreme_frontiers.1505.desc: "Chúng ta đã lần theo tín hiệu liên lạc trên §Y[from.Planet.GetName]§! đến nguồn của nó: một cấu trúc lớn, bị hư hại về mặt cấu trúc đã xuyên sâu vào lớp vỏ hành tinh.\n\nBị ăn mòn do tiếp xúc với axit, mảng liên lạc của nó tiếp tục truyền đi bằng một ngôn ngữ xa lạ, cố gắng liên lạc với một thực thể xa xôi.\n\nĐược cố định tại chỗ bằng các kẹp trọng lực chuyên dụng, thiết bị được neo chắc chắn vào nền đá. Sẽ cần nghiên cứu thêm để xác định mục đích thực sự của nó."
 extreme_frontiers.1505.a: "Giải mã tín hiệu của nó."
 extreme_frontiers.1510.title: "Cải Tạo Hành Tinh Phá Hủy"
 extreme_frontiers.1510.desc.common: "Sau khi phân tích chi tiết, giờ đây chúng ta đã hiểu một phần về cấu trúc được tìm thấy trên §Y[from.Planet.GetName]§!. Cỗ máy này là một thiết bị cải tạo hành tinh thô sơ và có sức hủy diệt.\n\nĐược thiết kế để chiếu xạ các sinh quyển bản địa thông qua sự phát triển bức xạ kích thích của các tài nguyên mục tiêu, nó gây ra hiệu ứng dây chuyền tàn phá hệ sinh thái của hành tinh trong quá trình này. Điều này cung cấp cho người sử dụng nguồn vật liệu dồi dào có thể chiết xuất được với cái giá phải trả là làm tăng độc tính chung trên toàn hành tinh.\n\nMặc dù hoạt động chính xác của quá trình này vẫn chỉ được hiểu một phần, chúng ta đã giải mã thành công tần số liên lạc của thiết bị, xác định thêm hai vị trí khác đang truyền cùng một tín hiệu."
 extreme_frontiers.1510.desc.default: "Điều tra các địa điểm này có thể mang lại cái nhìn sâu sắc hơn về công nghệ."
 extreme_frontiers.1510.desc.industrialist: "Những người tiên phong kinh doanh đằng sau công nghệ này rõ ràng rất am hiểu về việc tinh giản lợi nhuận, chúng ta có thể học hỏi được rất nhiều điều từ việc theo đuổi khám phá này."
 extreme_frontiers.1510.a: "Cuộc tìm kiếm bắt đầu."
 GEORADIATION_SIGNAL_1_PROJECT: "Lần Vết Tín Hiệu: §Y[planet.GetName]§!"
 GEORADIATION_SIGNAL_1_PROJECT_DESC: "Một tần số liên lạc giống hệt với tần số phát ra từ cấu trúc được tìm thấy trên §Y[from.Planet.GetName]§! đã được lần dấu đến địa điểm này, nơi một thiết bị bị hư hại khác đã được xác định vị trí. Nghiên cứu nó sẽ mang lại cái nhìn sâu sắc hơn về khả năng cải tạo hành tinh mang tính hủy diệt của họ."
 extreme_frontiers.1515.title: "Nhiên Liệu Hấp Dẫn"
 extreme_frontiers.1515.desc.common: "Chúng ta đã phát hiện thành công một thiết bị cải tạo hành tinh bị hư hại khác trên §Y[from.GetName]§!. Không giống như cấu trúc ban đầu, cấu trúc này vẫn giữ lại một số nguồn nhiên liệu để nghiên cứu, tiết lộ §HVật Chất Tối§! là động lực cho sản lượng bức xạ của nó.\n\nThiết bị này đẩy nhanh sự phát triển của các tài nguyên mục tiêu bằng cách di căn các liên kết phân tử quan trọng. Điều này thúc đẩy sự phát triển của chúng với cái giá phải trả là tính toàn vẹn của tế bào sinh quyển xung quanh."
 extreme_frontiers.1515.desc.industrialist: "Sự coi thường hoàn toàn mà thiết bị này thể hiện đối với sự ổn định của hành tinh khi đối mặt với việc khai thác tài nguyên quả thực mang lại nhiều cảm hứng."
 extreme_frontiers.1515.desc.signal_2_done: "Bằng cách truyền các sóng bức xạ qua một mảng khúc xạ kết tinh, cỗ máy này có thể cải tạo mục tiêu của nó bằng cách sử dụng thao tác phân tử hấp dẫn mà không làm sụp đổ lõi hành tinh vào trong chính nó.\n\nCác hồ sơ được phục hồi cho biết vị trí của một thiết bị thứ tư chưa được kích nổ."
 extreme_frontiers.1515.desc.signal_2_not_done: "Làm thế nào thiết bị này có thể làm được điều này và ngăn chặn sự sụp đổ trọng lực trên quy mô hành tinh vẫn chưa rõ ràng. Câu trả lời này có thể được tìm thấy tại địa điểm liên lạc còn lại."
 GEORADIATION_SIGNAL_2_PROJECT: "Lần Vết Tín Hiệu: §Y[planet.GetName]§!"
 GEORADIATION_SIGNAL_2_PROJECT_DESC: "Tần số liên lạc phát ra từ cấu trúc được tìm thấy trên §Y[from.Planet.GetName]§! cũng đã được lần dấu đến địa điểm này, nơi một thiết bị bị hư hại khác đã được xác định vị trí. Nghiên cứu nó sẽ mang lại cái nhìn sâu sắc hơn về khả năng cải tạo hành tinh mang tính hủy diệt của họ."
 extreme_frontiers.1520.title: "Bức Xạ Kích Thích"
 extreme_frontiers.1520.desc.common: "Chúng ta đã phát hiện thành công một thiết bị cải tạo hành tinh bị hư hại khác trên §Y[from.GetName]§!, được bao bọc trong các tinh thể phát triển do một phát bắn hỏng từ một mảng khúc xạ bị vỡ.\n\nThông qua việc quan sát chặt chẽ bộ máy, chúng ta đã xác định được các phương pháp được sử dụng để nhắm mục tiêu bức xạ tập trung. Bằng cách sử dụng các vòng phản hồi điều biến có kiểm soát, cấu trúc có thể trực tiếp nhắm mục tiêu và kích thích sự phát triển của một tài nguyên được xác định trước."
 extreme_frontiers.1520.desc.signal_1_done: "Điều này cho phép cải tạo hành tinh với cường độ cao mà không có nguy cơ sụp đổ trọng lực hoàn toàn của hành tinh.\n\nCác hồ sơ được phục hồi cho biết vị trí của một thiết bị thứ tư chưa được kích nổ."
 extreme_frontiers.1520.desc.signal_1_not_done: "Tuy nhiên, chất chính xác được sử dụng để tạo ra bức xạ này vẫn chưa được xác định; nguồn dự trữ nhiên liệu của thiết bị đã cạn kiệt mặc dù phát bắn bị hỏng. Câu trả lời này có thể được tìm thấy tại địa điểm liên lạc còn lại."
 UNDETONATED_GEORADIATION_PROJECT: "Thiết Bị Chưa Kích Nổ"
 UNDETONATED_GEORADIATION_PROJECT_DESC: "Chúng ta đã xác định vị trí của một thiết bị cải tạo hành tinh thứ tư, chưa được kích nổ trên §Y[planet.GetName]§!. Thu hồi nó sẽ lấp đầy những khoảng trống trong hiểu biết của chúng ta về công nghệ này."
 extreme_frontiers.1525.title: "Thiết Bị Chưa Kích Nổ"
 extreme_frontiers.1525.desc.common: "Chúng ta đã định vị thành công một thiết bị thứ tư còn nguyên vẹn, không hoạt động trên bề mặt §Y[from.GetName]§!. Phân tích kiến trúc điều khiển của nó sẽ cung cấp cho chúng ta kiến thức cuối cùng cần thiết để nhân rộng công nghệ này."
 extreme_frontiers.1525.desc.industrialist: "Biên lợi nhuận đáng kinh ngạc mà chúng ta có thể thu được từ thiên hà một khi làm chủ công nghệ này vượt xa những lo ngại ít ỏi về môi trường. Đây là cơ hội vàng cho [controller.GetName]."
 extreme_frontiers.1520.desc.default.common: "Những hậu quả tiềm tàng của việc tự do triển khai công nghệ như vậy trên quy mô thiên hà đặt ra những câu hỏi đáng kể."
 extreme_frontiers.1525.desc.default.default: "Có lẽ sẽ tốt hơn nếu rủi ro tiềm tàng mà những thiết bị này gây ra được loại bỏ khỏi thiên hà."
 extreme_frontiers.1525.desc.default.homicidal: "Có lẽ sẽ tốt hơn nếu loại bỏ mối đe dọa này khỏi thiên hà trước khi nó được sử dụng để chống lại chúng ta."
 extreme_frontiers.1525.a.default: "Nghiên cứu thiết bị."
 extreme_frontiers.1525.a.industrialist: "Chúng ta còn chờ gì nữa? Bắt đầu nghiên cứu thôi!"
 extreme_frontiers.1525.b: "Rủi ro lớn hơn phần thưởng, hãy phá hủy thiết bị."
 extreme_frontiers.1530.title: "Vi Phạm Điều Khoản"
 extreme_frontiers.1530.desc.common: "Trong khi nghiên cứu thiết bị trên §Y[from.GetName]§!, chúng ta đã vô tình kích hoạt cơ chế an toàn dự phòng, dẫn đến còi báo động khẩn cấp trên mọi tần số. Bất chấp những dự đoán ban đầu rằng việc này sẽ không có hồi đáp, một máy bay không người lái tự động đã tiến vào lãnh thổ của chúng ta.\n\nMọi lời chào của chúng ta đều nhận được cùng một phản hồi:\n\n\"Kính chào quý khách hàng đáng quý, hồ sơ của chúng tôi cho thấy quý vị đang cố gắng tạo ra một phiên bản không có giấy phép của Ma Trận Địa Bức Xạ MKIII mới nhất, một hành vi vi phạm rõ ràng Thỏa Thuận Cấp Phép Người Dùng Cuối của $NAME_Geocorp$.\n\nChúng tôi hiện sẽ thực thi quyền hạn pháp lý của mình để chấm dứt nỗ lực của quý vị với định kiến cực đoan. Mọi khiếu nại có thể được chuyển đến các máy bay không người lái dịch vụ khách hàng của chúng tôi.\""
 extreme_frontiers.1530.desc.industrialist: "Sự mẫn cán của họ sẽ rất đáng khích lệ nếu như nó không đang làm trì hoãn công việc của chính chúng ta."
 extreme_frontiers.1530.a: "Mở liên lạc."
 extreme_frontiers.1530.b: "Chúng ta sẽ không đàm phán với \"bộ phận hỗ trợ khách hàng\"."
 GEORADIATION_ANALYSIS_PROJECT: "Phân Tích Thiết Bị"
 GEORADIATION_ANALYSIS_PROJECT_DESC: "Bằng cách phân tích kiến trúc điều khiển của thiết bị được tìm thấy trên §Y[planet.GetName]§!, chúng ta sẽ có thể nhân rộng công nghệ này để phục vụ mục đích sử dụng của riêng mình."
 NAME_Geocorp: "CoburnCorp"
 geocorp_corvette: "Máy Bay Không Người Lái Chiến Đấu $NAME_Geocorp$"
 geocorp_corvette_plural: "Các Máy Bay Không Người Lái Chiến Đấu $NAME_Geocorp$"
 NAME_Geocorp_Combat_Drone: "$geocorp_corvette$"
 extreme_frontiers.1531.title: "Máy Bay Không Người Lái của $NAME_Geocorp$"
 extreme_frontiers.1531.desc: "Khi kết nối được truyền hình trực tiếp, một bản nhạc cổ xưa vang lên trước khi máy bay không người lái bàn trợ giúp tự động trực tuyến.\n\nKính chào quý khách hàng đáng quý, chúng tôi có thể thấy quý vị đang tạo ra một phiên bản không có giấy phép của Ma Trận Địa Bức Xạ MKIII. Chúng tôi có thể giúp gì cho quý vị hôm nay?"
 extreme_frontiers.1531.a: "Các người đến từ đâu?"
 extreme_frontiers.1531.a.reply: "\"Mỗi đơn hàng mua từ $NAME_Geocorp$ đều được triển khai kèm theo một vệ tinh quỹ đạo làm hài lòng khách hàng từ xa để đảm bảo vận hành thích hợp và duy trì khách hàng suốt đời. Nguồn năng lượng dự trữ nội bộ cho phép chúng tôi hoạt động trong nhiều thế kỷ.\""
 extreme_frontiers.1531.b: "Chúng tôi có thể nói chuyện với người quản trị của các người không?"
 extreme_frontiers.1531.b.reply: "\"Thật không may, người quản trị còn sống cuối cùng đã qua đời. Tuy nhiên, cam kết của chúng tôi đối với sự hài lòng của khách hàng có khả năng tồn tại lâu hơn vài vòng đời sinh học.\""
 extreme_frontiers.1531.c: "Chúng tôi cứ ngỡ mình đang trục vớt tàn tích hoang phế."
 extreme_frontiers.1531.c.reply: "\"Sự thiếu hiểu biết không được ghi nhận là một lý do bào chữa hợp lệ. Các điều khoản sử dụng Ma Trận Địa Bức Xạ MKIII của quý vị đã được giải thích chi tiết tại thời điểm mua hàng.\""
 extreme_frontiers.1531.d: "Chúng tôi sẵn sàng gia hạn gói đăng ký."
 extreme_frontiers.1531.d.reply: "\"Thật tuyệt vời khi được nghe điều đó, chúng tôi sẽ hoàn tất ký kết giấy tờ ngay khi nhận được phí quản lý là 3000 §YNăng Lượng Tín Dụng§!. Khi nhận được các khoản tiền này, chúng tôi sẽ coi như vấn đề này đã được giải quyết và rút lui.\""
 extreme_frontiers.1531.e: "Chúng tôi không hề mua thiết bị này."
 extreme_frontiers.1531.e.reply: "\"Vậy là quý vị thừa nhận hành vi trộm cắp? Điều đó làm cho việc này trở nên đơn giản hơn nhiều, các giao thức chống trộm của chúng tôi khá chết người đấy. Chúng tôi hy vọng quý vị sẽ cân nhắc các sản phẩm tang lễ của chúng tôi cho các nhu cầu sắp tới của quý vị.\""
 extreme_frontiers.1531.f: "Thanh toán phí"
 extreme_frontiers.1531.f.reply: "\"Cảm ơn quý vị đã gia hạn mua giấy phép Ma Trận Địa Bức Xạ MKIII. Chúng tôi hy vọng quý vị thấy thiết bị này hữu ích như cách chúng tôi thấy nó sinh lời.\"\n\nSau khi thanh toán phí, máy bay không người lái biến mất vào thiên hà bao la"
 extreme_frontiers.1531.g: "Cắt cổ. Chuẩn bị chiến đấu."
 extreme_frontiers.1531.h: "Tống khứ được thật nhẹ nợ."
 extreme_frontiers.1531.i: "Chuẩn bị chiến đấu."
 extreme_frontiers.1534.title: "Máy Bay Không Người Lái của $NAME_Geocorp$"
 extreme_frontiers.1534.desc: "Khi trận chiến dần kết thúc trong §Y[fromfrom.solar_system.GetName]§!, một liên lạc mới từ máy bay không người lái dịch vụ khách hàng phát trên màn hình của chúng ta.\n\n\"Chúng tôi đã ghi nhận sự phản đối của quý vị đối với những nỗ lực thực thi các điều khoản của Thỏa Thuận Cấp Phép Người Dùng Cuối của chúng tôi. Do việc quý vị phô trương sức mạnh quân sự áp đảo, chúng tôi hiện sẽ bãi bỏ yêu cầu bồi thường quyền sở hữu trí tuệ đối với Ma Trận Địa Bức Xạ MKIII. Chúng tôi hy vọng quý vị tận hưởng công nghệ mới có được của mình.\"\n\nMáy bay không người lái phát nổ, cắt đứt liên kết liên lạc."
 extreme_frontiers.1534.a: "Tống khứ được thật nhẹ nợ."
 extreme_frontiers.1535.title: "Sửa Đổi Điều Khoản"
 extreme_frontiers.1535.desc: "Sau khi đã giải quyết xong các máy bay không người lái dịch vụ khách hàng, giờ đây chúng ta có thể tiếp tục tái thiết kế Ma Trận Địa Bức Xạ."
 extreme_frontiers.1535.a: "Tiếp tục nghiên cứu thiết bị."
 GEORADIATION_ANALYSIS_PROJECT_CONTINUED: "$GEORADIATION_ANALYSIS_PROJECT$"
 GEORADIATION_ANALYSIS_PROJECT_CONTINUED_DESC: "$GEORADIATION_ANALYSIS_PROJECT_DESC$"
 extreme_frontiers.1540.title: "Thiết Bị Chưa Kích Nổ"
 extreme_frontiers.1540.desc.industrialist: "Thông qua hiệu quả kinh doanh không ngừng nghỉ, chúng ta đã tái thiết kế ngược thành công Ma Trận Địa Bức Xạ MKIII, tinh chỉnh các phương pháp vận hành của nó để mang lại lợi nhuận tối đa."
 extreme_frontiers.1540.desc.default: "Sau khi nghiên cứu sâu rộng, chúng ta đã tái thiết kế ngược thành công Ma Trận Địa Bức Xạ MKIII, mở khóa tiềm năng của nó với những cải tiến bổ sung cho quy trình."
 extreme_frontiers.1540.desc.common: "Bằng cách tích hợp quá trình làm mất ổn định phân tử phóng xạ vào thiết bị cải tạo hành tinh của mình, chúng ta có thể kích thích sự phát triển của các tài nguyên có giá trị."
 extreme_frontiers.1540.a: "Tin tức tuyệt vời."
 tech_georadiation_terraforming: "Cải Tạo Địa Bức Xạ"
 tech_georadiation_terraforming_desc: "Bằng cách để sinh quyển của một hành tinh tiếp xúc với sự phân rã bức xạ phân tử, chúng ta thúc đẩy sự phát triển của một số tài nguyên nhất định trong khi biến thế giới thành một vùng đất hoang độc hại."
 tech_georadiation_terraforming_tt: "§HMở khóa Quyết Định Thuộc Địa:§! $decision_toxify_world$"
 extreme_frontiers.1545.title: "Thiết Bị Bị Phá Hủy"
 extreme_frontiers.1545.desc: "Chúng ta đã tháo dỡ thành công thiết bị trên §Y[from.GetName]§!, tận dụng bất kỳ vật liệu nào có thể tái sử dụng vì lợi ích của mình.\n\nVới việc thiết bị này bị phá hủy và các phiên bản tiền nhiệm của nó đã thành đống đổ nát, những bí mật của công nghệ hủy diệt này đã vĩnh viễn biến mất khỏi thiên hà."
 extreme_frontiers.1545.a.default: "Tống khứ được thật nhẹ nợ."
 decision_toxify_world: "Độc Hóa Thế Giới"
 decision_toxify_world_desc: "Thúc đẩy sự phát triển của các tài nguyên cụ thể bằng cách cho sinh quyển của hành tinh tiếp xúc với sự phân rã bức xạ phân tử, biến nó thành một vùng đất hoang độc hại trong quá trình này."
