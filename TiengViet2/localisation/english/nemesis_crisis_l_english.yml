l_english:

# Ascension Perk name
 ap_become_the_crisis:1 "Hiểm Họa Ngân Hà"
 ap_become_the_crisis_desc:1 "Mọi kiệt tác vĩ đại đều cần được đánh đổi bằng sự hy sinh. Những sinh vật khác trong thiên hà có thể không hiểu, nhưng chúng chắc chắn sẽ phải phục tùng."

 # Menace name
 menace_name:1 "$menace$:"

 # Crisis Path names
 crisis_path_destruction_name:0 "Con Đường Hủy Diệt"
 crisis_path_destruction_desc:0 "Trật tự là đi ngược lại tự nhiên. Bản chất thực sự của tự nhiên vốn là sự hỗn mang.\n\nChúng ta không hề phá hủy vũ trụ, mà đang sửa chữa nó."

 crisis_path_supremacy_name:0 "Con Đường Thống Trị"
 crisis_path_supremacy_desc:0 "Quyền thống trị chỉ thuộc về kẻ chiến thắng. Đối với chúng ta, đây là chân lý tối cao, và hoan nghênh bất cứ ai dám cố gắng chứng minh điều ngược lại."

 crisis_path_deception_name:0 "Con Đường Lừa Lọc"
 crisis_path_deception_desc:0 "Nếu mọi ánh nhìn đều đổ dồn vào những kẻ ngốc đang nhảy múa ở trung tâm sân khấu, chúng ta có thể làm được nhiều điều hơn trong bóng tối."

 # Menacing Actions
 menacing_actions_name:0 "Hành Động Uy Hiếp"
 menacing_actions_destruction_title:0 "$menacing_actions_name$ - $crisis_path_destruction_name$"
 menacing_actions_supremacy_title:0 "$menacing_actions_name$ - $crisis_path_supremacy_name$"
 menacing_actions_deception_title:0 "$menacing_actions_name$ - $crisis_path_deception_name$"

 # Menacing Actions - Destruction
 ### FIX THIS! - Investigate capitalisation
 crisis_mean_destroy_starbase_name:0 "Phá Hủy Căn Cứ Sao"
 crisis_mean_destroy_starbase_desc:0 "Phá hủy một căn cứ sao của kẻ thù sẽ nhận được §H5§!£menace£ Uy hiếp."
 crisis_mean_conquer_colony_name:0 "Chinh Phục Thuộc Địa"
 crisis_mean_conquer_colony_desc:0 "Chinh phục một thuộc địa của kẻ thù sẽ nhận được §H10§!£menace£ Uy hiếp."
 crisis_mean_destroy_empire_name:0 "Tiêu Diệt Đế Chế"
 crisis_mean_destroy_empire_desc:0 "Xóa sổ hoàn toàn một đế chế sẽ nhận được §H100§!£menace£ Uy hiếp."
 crisis_mean_defeat_fleet_name:0 "Đánh Bại Hạm Đội Địch"
 crisis_mean_defeat_fleet_desc:0 "Mỗi điểm sức chứa hải quân từ hạm đội địch bị đánh bại sẽ mang lại cho bạn §H1§!£menace£ Uy hiếp."
 menacing_actions_destruction_destroy_enclave_title:0 "Tiêu Diệt Thế Lực Độc Lập"
 menacing_actions_destruction_destroy_enclave_desc:0 "Tiêu diệt một trạm không gian độc lập sẽ nhận được §H100§!£menace£ Uy hiếp."

 # Menacing Actions - Supremacy
 menacing_actions_supremacy_enslave_species_title:0 "Nô Dịch Cả Một Chủng Tộc"
 menacing_actions_supremacy_enslave_species_desc:0 "Nô dịch hoàn toàn một chủng tộc sẽ mang lại §H5§!£menace£ Uy hiếp mỗi năm."
 menacing_actions_supremacy_have_vassal_title:0 "Sở Hữu Chư Hầu"
 menacing_actions_supremacy_have_vassal_desc:0 "Sở hữu chư hầu sẽ mang lại §H10§!£menace£ Uy hiếp mỗi năm."
 menacing_actions_supremacy_vassalize_empire_title:0 "Thu Phục Đế Chế Làm Chư Hầu"
 menacing_actions_supremacy_vassalize_empire_desc:0 "Thu phục một đế chế làm chư hầu sẽ nhận được §H100§!£menace£ Uy hiếp."
 menacing_actions_supremacy_invade_primitives_title:0 "Xâm Lược Văn Minh Nguyên Thủy"
 menacing_actions_supremacy_invade_primitives_desc:0 "Mỗi £pop£ dân số trên hành tinh nguyên thủy bị xâm lược sẽ mang lại §H1§!£menace£ Uy hiếp."
 menacing_actions_supremacy_sent_marauders_title:0 "Phát Động Chiến Dịch Cướp Phá"
 menacing_actions_supremacy_sent_marauders_desc:0 "Mỗi £pop£ dân số bị bắt cóc trong đợt oanh tạc cướp phá từ quỹ đạo sẽ mang lại cho bạn §H50§!£menace£ Uy hiếp."

 # Menacing Actions - Deception
 menacing_actions_deception_force_resolution_title:0 "Cưỡng Chế Phủ Quyết"
 menacing_actions_deception_force_resolution_desc:0 "Phủ quyết một nghị án được đa số các quốc gia ủng hộ sẽ nhận được §H5§!£menace£ Uy hiếp."
 menacing_actions_deception_council_position_title:0 "Chiếm Ghế Hội Đồng Ngân Hà"
 menacing_actions_deception_council_position_desc:0 "Nắm giữ một ghế trong Hội đồng Ngân hà sẽ mang lại §H10§!£menace£ Uy hiếp mỗi năm."
 menacing_actions_deception_veto_resolution_title:0 "Một Phiếu Phủ Quyết"
 menacing_actions_deception_veto_resolution_desc:0 "Sử dụng quyền phủ quyết của Hội đồng để bác bỏ nghị án sẽ nhận được §H100§!£menace£ Uy hiếp."
 menacing_actions_deception_call_in_favor_title:0 "Kêu Gọi Ủng Hộ Ngoại Giao"
 menacing_actions_deception_call_in_favor_desc:0 "Mỗi điểm £favor£ ủng hộ ngoại giao kêu gọi được sẽ mang lại cho bạn §H1§!£menace£ Uy hiếp."
 menacing_actions_deception_win_humiliation_war_title:0 "Chiến Thắng Trong Cuộc Chiến Sỉ Nhục"
 menacing_actions_deception_win_humiliation_war_desc:0 "Giành chiến thắng trong một cuộc chiến sỉ nhục sẽ nhận được §H200§!£menace£ Uy hiếp."

 # Crisis Perks
 crisis_perk:0 "Đặc Quyền Thảm Họa"
 crisis_perk_plural:0 "Đặc Quyền Thảm Họa"
 crisis_perk_destruction:0 "$crisis_path_destruction_name$ $crisis_perks$"
 crisis_perk_supremacy:0 "$crisis_path_supremacy_name$ $crisis_perks$"
