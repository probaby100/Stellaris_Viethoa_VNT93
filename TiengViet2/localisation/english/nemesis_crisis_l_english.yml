 crisis_perk_to_unlock:0 "Mở khóa:"
 crisis_perk_passive_effect:0 "Hiệu ứng bị động:"
 crisis_perk_active_effect:0 "Hiệu ứng chủ động:"

 ### menp_undertaker:0 "Undertaker"
 ### menp_undertaker_desc:0 "'Death' is such a strong word. We are merely returning their matter to its initial state."
 ### crisis_perks_destruction_undertaker_unlock:0 "Purge §Y50§! £pop£ Pops to unlock this $crisis_perk$."
 ### undertaker_passive:0 "Purging generates £menace£ Menace."
 ### undertaker_active:0 "Purging speed is greatly increased, and generates £alloy£ Alloys."
 ### menp_ship-chipper:0 "Ship-chipper"
 ### menp_ship-chipper_desc:0 "All these metal constructs moving about in orderly fashion... It needs to stop."
 ### crisis_perks_destruction_ship-chipper_unlock:0 "Destroy 100 ships in order to unlock this $crisis_perk$."
 ### menp_ship-chipper_passive:0 "Your fleets take -25% damage in combat."
 ### menp_ship-chipper_active:0 "Your fleets have +50% weapon damage."
 ### menp_death_from_above:0 "Death From Above"
 ### menp_death_from_above_desc:0 "No place to run, no place to hide. In fact, no 'place' at all."
 ### crisis_perks_destruction_death_from_above_unlock:0 "Destroy 10 buildings through bombardment to unlock this $crisis_perk$."
 ### menp_death_from_above_passive:0 "When bombarding, Planet Devastation is 20% faster."
 ### menp_death_from_above_active:0 "Unlocks Armageddon Bombardment."

 crisis_perks_supremacy_privateering_title:0 "Giấy Phép Cướp Bóc"
 crisis_perks_supremacy_privateering_desc:0 "Đích thân ra trận đánh kẻ thù sao?! Ôi thôi nào, sẽ có người giúp chúng ta lo liệu mấy việc vặt vãnh đó."
 crisis_perks_supremacy_privateering_unlock:0 "Để mở khóa $crisis_perk$ này, trước tiên cần phải thuê cùng lúc 4 hạm đội lính đánh thuê."
 crisis_perks_supremacy_privateering_passive:0 "Thời gian thuê hạm đội đánh thuê được gia hạn thêm 30%."
 crisis_perks_supremacy_privateering_active:0 "Giá thuê hạm đội đánh thuê giảm 50%."
 crisis_perks_supremacy_primus_inter_pares_title:0 "Lãnh Đạo Tối Cao"
 crisis_perks_supremacy_primus_inter_pares_desc:0 "Bọn chúng ngang hàng với chúng ta. Và chính bọn chúng cũng sẽ đồng tình với câu nói đó, nếu không thì..."
 crisis_perks_supremacy_primus_inter_pares_unlock:0 "Trở thành người lãnh đạo của một Liên bang Bá quyền có ít nhất bốn thành viên."
 crisis_perks_supremacy_primus_inter_pares_passive:0 "Mỗi thành viên liên bang cung cấp §G+5 sức chứa hải quân liên bang§!."
 crisis_perks_supremacy_primus_inter_pares_active:0 "Tốc độ tăng điểm đoàn kết liên bang +3."
 crisis_perks_supremacy_support_is_mandatory_title:0 "Chi Viện Ép Buộc"
 crisis_perks_supremacy_support_is_mandatory_desc:0 "Các ngươi, tất nhiên rồi, có thể không tuân lệnh chúng ta. Nhưng mà này, nếu các ngươi to gan như vậy, chúng ta đành phải xóa sổ các ngươi thôi."
 crisis_perks_supremacy_support_is_mandatory_unlock:0 "Để mở khóa $crisis_perk$ này, cần phải sở hữu ít nhất 4 chư hầu."
 crisis_perks_supremacy_support_is_mandatory_passive:0 "Lượng £energy£ Năng lượng và £mineral£ Khoáng sản mà mỗi chư hầu cống nạp hàng tháng tăng 10%."
 crisis_perks_supremacy_support_is_mandatory_active:0 "Đế chế cứ có thêm một chư hầu sẽ tăng 20 sức chứa hải quân."

 crisis_perks_deception_lord_of_red_tape_title:0 "Vua Quan Liêu"
 crisis_perks_deception_lord_of_red_tape_desc:0 "Dễ thôi mà! Đầu tiên cứ điền đầy đủ vào mẫu đơn liên bang số 68-XM, sau đó nộp cho phòng 11-B trước ngày 21, tiếp theo lại yêu cầu phòng này cấp cho 3 bản sao của tài liệu, lần lượt là..."
 crisis_perks_deception_lord_of_red_tape_unlock:0 "Để mở khóa $crisis_perk$ này, trước tiên cần phải đề xuất 3 biện pháp trừng phạt trong Cộng đồng Ngân hà."
 crisis_perks_deception_lord_of_red_tape_passive:0 "Lượng £influence£ Ảnh hưởng tiêu tốn khi đệ trình nghị án giảm 20%."
 crisis_perks_deception_lord_of_red_tape_active:0 "Nhận được quyền miễn trừ đối với việc §Pvi phạm§! luật ngân hà."
 crisis_perks_deception_dance_puppets_title:0 "Nhảy múa đi, hỡi những con rối!"
 crisis_perks_deception_dance_puppets_desc:0 "Ngươi thừa hiểu chuyện này diễn ra thế nào rồi đấy: Ngươi giữ thể diện cho ta, ta sẽ không tiêu diệt ngươi."
 crisis_perks_deception_dance_puppets_unlock:0 "Để mở khóa $crisis_perk$ này, trước tiên cần phải kêu gọi được 20 £favor£ ủng hộ ngoại giao."
 crisis_perks_deception_dance_puppets_passive:0 "§RMỗi £favor£ ủng hộ ngoại giao sẽ bị -10% trọng lượng ngoại giao§!"
 crisis_perks_deception_dance_puppets_active:0 "Kêu gọi £favor£ ủng hộ ngoại giao không còn tiêu tốn £influence£ Ảnh hưởng nữa."
 crisis_perks_deception_shadowplay_title:0 "Khiêu Vũ Trong Bóng Tối"
 crisis_perks_deception_shadowplay_desc:0 "Những gì ngươi biết về chúng ta, chính là những gì chúng ta muốn cho ngươi biết. Còn về việc chúng ta biết bao nhiêu về các ngươi á? Câu trả lời là, tất cả mọi thứ."
 crisis_perks_deception_shadowplay_unlock:0 "Để mở khóa $crisis_perk$ này, trước tiên cần phải hoàn thành §H10 chiến dịch tình báo§!."
 crisis_perks_deception_shadowplay_passive:0 "Tốc độ chiến dịch tình báo tăng +20%, đồng thời chi phí giảm -20%."
 crisis_perks_deception_shadowplay_active:0 "Nhận §G+20 mức độ tình báo§! về các đế chế khác."

 # Crisis UI
 menace_value: "£menace£ $VAL|0$"
 menace_gaining: "Hoàn thành §HMục tiêu Thảm họa§! để nhận được §YUy hiếp§!."
 menace_desc: "Uy hiếp là một chỉ số dùng để đong đếm mức độ cộng hưởng của chúng ta với những nguồn năng lượng tai ương bên trong Vùng Mù mịt."
 menace_crisis_objective: "Mục tiêu Thảm họa"
 menace_crisis_objective_gained: "Đã nhận được Uy hiếp"
 menace_crisis_objective_reward: "$REWARD$"
 menace_crisis_objective_progress: "Chúng ta đã nhận được $AMOUNT$£menace£ từ Mục tiêu Thảm họa này."
 menace_crisis_level_locked: "Để mở khóa cấp độ này cần có:\n"
 menace_crisis_level_unlocked: "Ở $LEVEL$, bạn sẽ nhận được một dự án đặc biệt và các phần thưởng sau:\n"
 menace_crisis_level_desc: "Để nâng cấp Thảm họa, bạn cần hoàn thành các mục tiêu Thảm họa cũng như các dự án đặc biệt của Thảm họa trong Nhật ký Tình báo"
 menace_crisis_level_unlock: "Sở hữu £menace£§Y$CURRENCY$§! Uy hiếp"
 menace_current_value: "Chỉ số hiện tại: §Y$VALUE|0$§!"
 menace_crisis_description_title: "Hiểm Họa Ngân Hà"
 menace_crisis_description_intro: "Những kẻ trong Cộng đồng Ngân hà luôn cố gắng soi bóng tương lai qua lăng kính lịch sử từ lâu đã mường tượng về một §RThảm họa§! sắp giáng xuống — một cuộc khủng hoảng sinh tử đối với mọi sinh vật có trí tuệ, thứ chỉ có thể vượt qua bằng sự đồng tâm hiệp lực và sự hy sinh quên mình chưa từng có — đó là trong trường hợp có thể vượt qua được.\n\nCó khá nhiều suy đoán viển vông về bản chất của thảm họa này, chẳng hạn như sự xâm lược của những kẻ săn mồi ngoài thiên hà, hay sự trỗi dậy của trí tuệ máy móc càn quét khắp các vì sao, hoặc là một cuộc chiến tranh kế vị từ một chiều không gian khác lan tới, thế nhưng...\n\nĐến hôm nay, sự thật đã quá rõ ràng, thảm họa đó luôn luôn là §Rchúng ta§!."
 menace_crisis_description: "$menace_crisis_description_intro$\n\nMỗi nhất cử nhất động của chúng ta đều tạo ra những gợn sóng, vang vọng trong một chiều không gian chứa đựng nguồn năng lượng vô tận. Chúng ta chỉ cần tìm ra cách để thao túng nguồn năng lượng này là có thể buộc cả thiên hà phải quỳ gối dưới chân mình."
 menace_crisis_howto_title: "Mối Đe Dọa & Động Cơ"
 menace_crisis_howto: "Thực hiện các §HMục Tiêu Khủng Hoảng§! sẽ tạo ra £menace£ §HMối Đe Dọa§!, mở khóa tiềm năng hủy diệt của chúng ta nhằm hoàn thiện Siêu Kết Cấu Động Cơ Pha Ê-te và mở ra một kỷ nguyên mới cho thiên hà."

