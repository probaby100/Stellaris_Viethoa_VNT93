 become_the_crisis_chain_title:0 "Hóa Thân Thành Thảm Họa"
 become_the_crisis_chain_desc:0 "Sức nặng của định mệnh đang giương nanh múa vuốt, chúng ta đang run rẩy bên bờ vực thẳm, và bên dưới là một tương lai nhuốm máu.\n\nKhi chúng ta nhìn chằm chằm vào vực thẳm, thì từ dưới đó, cũng chỉ có chính chúng ta đang nhìn ngược lại."
