# VOLITIONAL
 auth_cyber_hive_volitional: "Ý Thức Tổ Ong Tự Nguyện"
 auth_cyber_hive_volitional_desc: "Mỗi drone là một cá nhân. Mỗi ý nghĩ là một góc nhìn mới để tập thể xem xét. Vô số tâm trí hợp thành một Tổ Ong vĩ đại hơn nhiều so với tổng số các phần tử của nó."
 concept_auth_cyber_hive_volitional: "$auth_cyber_hive_volitional$"
