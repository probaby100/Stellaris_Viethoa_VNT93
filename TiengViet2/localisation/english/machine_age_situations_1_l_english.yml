# FIRST EVENT #
# DEMOCRATIC
 cyber.505.name: "Cú Sốc Tương Lai"
 cyber.505.desc.gov: "Việc cải tạo cường hóa nhân dân chúng ta là một thắng lợi vẻ vang của quy trình sản xuất và ra quyết định được tinh giản. Vô số tiếng nói riêng biệt đã được lắng nghe và những lo ngại của họ đã được giải quyết thỏa đáng. Giờ đây, mỗi một người §Y[root.GetSpeciesAdj]§! đều có cơ hội bình đẳng để hưởng lợi từ những thiết bị cấy ghép thay đổi cuộc đời này.\n\nBước đi hợp lý tiếp theo là xem xét các hệ lụy rộng lớn hơn của công nghệ này. Liệu chúng ta sẽ tận dụng nó cho tiến trình dân chủ hay nâng cao vị thế công nhân thông qua đồng bộ hóa trải nghiệm?"
 cyber.505.desc.cor: "Quy trình cải tạo phối hợp với các tập đoàn đối tác của chúng ta đã hoàn tất thành công mỹ mãn. Các thiết bị cấy ghép đã được chế tạo, phân phối và lắp đặt với hiệu quả đáng kinh ngạc. Nhiều tiếng nói của xã hội §Y[root.GetSpeciesAdj]§! đã được lắng nghe, và những quan ngại chính đáng của họ đã được giải quyết. Chúng ta đã sẵn sàng đối mặt với tương lai bằng một sức sống mới.\n\nChính quyền giờ đây đã sẵn sàng cho bước đi tiếp theo của mình. Chúng ta có thể sử dụng những tiến bộ công nghệ của mình để cải thiện tiến trình dân chủ hoặc đồng bộ hóa cấy ghép phục vụ cho công nhân."
 cyber.505.desc.ind: "Bất chấp những cảnh báo về sự hỗn loạn của thị trường tự do, việc cải tạo cường hóa người dân của chúng ta đã thành công vang dội. Mạng lưới các nhà phân phối và phòng khám độc lập rộng lớn của chúng ta đã làm việc không mệt mỏi để cung cấp các cải tạo cơ thể máy cho mọi người §Y[root.GetSpeciesAdj]§! có nhu cầu. Thể xác sinh học của chúng ta cuối cùng cũng đã theo kịp trí tưởng tượng vô bờ của mình.\n\nGiờ đây, chúng ta phải quyết định bước tiếp theo cho xã hội của mình. Chúng ta có thể tận dụng những đổi mới này để nâng tầm tiến trình dân chủ hay đồng bộ hóa cấy ghép phục vụ cho người lao động?"
 cyber.505.a: "Tích hợp công nghệ cơ thể máy vào nền dân chủ."
 cyber.505.a.tt: "Nhận Quyền Tiếp Cận Chính Thể: §Y$auth_cyber_democratic_individualist$§!\n\n$cyber.social_consequences.tt$"
 cyber.505.b: "Đồng bộ hóa kinh nghiệm lao động của các công nhân."
 cyber.505.b.tt: "Nhận Quyền Tiếp Cận Chính Thể: §Y$auth_cyber_democratic_collectivist$§!\n\n$cyber.social_consequences.tt$"

# OLIGARCHIC
 cyber.510.name: "Quản Trị Tinh Giản"
 cyber.510.desc.gov: "Sự chuyển biến to lớn này chỉ có thể được thấu hiểu và ban hành bởi tầng lớp thượng lưu của xã hội, kẻo nó sẽ dẫn đến sự hoang mang và bất đồng trong thần dân của chúng ta. Trong khi người §Y[Species.GetNamePlural]§! đang được trang bị các thiết bị cấy ghép cơ thể máy do chính quyền cấp, chúng ta có một cơ hội độc nhất vô nhị để khám phá những tiềm năng chưa được khai thác mà các con chip này mang lại.\n\nLiệu chúng ta nên thúc đẩy một xã hội nơi sự cạnh tranh khốc liệt nâng tầm công nhân lên những tầm cao mới, hay khai thác sức mạnh tính toán nhàn rỗi từ tâm trí của những người đang ngủ?"
 cyber.510.desc.cor: "Sự kết hợp giữa sáng kiến doanh nghiệp và sự phối hợp của chính quyền đã đưa nỗ lực cải tạo cơ thể máy của chúng ta thành công rực rỡ. Toàn bộ người dân giờ đây đã được trang bị các cải tạo tiên tiến, giúp tăng vọt năng suất lao động và mở ra những thị trường tiêu dùng mới rộng lớn.\n\nGiờ đây khi quá trình chuyển đổi đã hoàn tất, các tập đoàn của chúng ta có thể chuyển sự chú ý sang các mục tiêu tham vọng hơn. Liệu chúng ta nên ép xung các chuyên gia để tối đa hóa lợi nhuận của ban lãnh đạo, hay khai thác thời gian ngủ của người dân cho các công việc tính toán?"
 cyber.510.desc.ind: "Bất chấp những do dự ban đầu, các xưởng độ cơ thể và phòng khám độc lập trên khắp các thế giới của chúng ta đã đưa chương trình cải tạo đến đích thành công. Sự đổi mới phi tập trung đã cho phép người dân tự do thích nghi với cuộc sống cơ thể máy theo tốc độ của riêng mình.\n\nGiờ đây, khi xã hội của chúng ta đã được cơ giới hóa vững chắc, chúng ta phải đối mặt với câu hỏi về quản trị trong thời đại mới. Liệu chúng ta nên ép xung các chip sinh học chuyên gia để tăng cường sự nhàn hạ cho giới tinh hoa, hay khai thác tiềm năng trí tuệ của người dân trong lúc ngủ?"
 cyber.510.a: "Ép xung chuyên gia để phục vụ giới tinh hoa."
 cyber.510.a.tt: "Nhận Quyền Tiếp Cận Chính Thể: §Y$auth_cyber_oligarchic_individualist$§!\n\n$cyber.social_consequences.tt$"
 cyber.510.b: "Khai thác sức lao động trong giấc ngủ của người dân."
 cyber.510.b.tt: "Nhận Quyền Tiếp Cận Chính Thể: §Y$auth_cyber_oligarchic_collectivist$§!\n\n$cyber.social_consequences.tt$"

# DICTATORIAL
 cyber.515.name: "Ánh Mắt Của Nhà Độc Tài"
 cyber.515.desc.gov: "Một vài cơ hội để gia tăng sự ổn định và quyền kiểm soát đã xuất hiện trong chương trình cải tạo của chúng ta. Khi chúng ta sản xuất các thiết bị cấy ghép do chính quyền cấp và cài đặt chúng trên toàn thể người dân, việc bí mật cài đặt các thuật toán để định hướng người dân tới kết quả mong muốn sẽ rất dễ dàng.\n\nChúng ta có thể gia tăng phạm vi giám sát bằng cách thêm các công cụ theo dõi và cửa hậu vào các thiết bị cấy ghép cá nhân, hoặc chúng ta có thể cài đặt mã nguồn cho phép nhân cách rạng ngời của §Y[Ruler.GetTitle]§! gây ảnh hưởng lên quần chúng."
 cyber.515.desc.cor: "Các tập đoàn đối tác của chúng ta đã sẵn sàng sản xuất, phân phối và lắp đặt các thiết bị cấy ghép cơ thể máy trên quy mô toàn xã hội, và bản cập nhật phần sụn sắp tới mang lại cho chúng ta một cơ hội có một không hai.\n\nChúng ta có thể đưa các công cụ giám sát ẩn vào phần cứng cải tạo cá nhân, cho phép chúng ta nhổ tận gốc những cá nhân có vấn đề. Ngoài ra, chúng ta có thể tạo ra chức năng ghi đè nhân cách để khắc sâu ý chí của §Y[Ruler.GetTitle]§! vào quần chúng."
 cyber.515.desc.ind: "Các bệnh viện đa khoa, các cửa hàng đầu ngõ và cộng đồng hacker hiện đã sẵn sàng phân phối và lắp đặt các thiết bị cấy ghép cơ thể máy cho người dân. Nhưng không nhất thiết phải phân cấp toàn bộ quyền lực của chúng ta đối với công nghệ mới mẻ và thú vị này.\n\nChúng ta có thể cung cấp các bản độ cấy ghép tùy chỉnh có ẩn giấu các công cụ giám sát bí mật của riêng mình để theo dõi các cá nhân có vấn đề. Ngoài ra, chúng ta có thể cài đặt các thuật toán ghi đè nhân cách cho phép ý chí của §Y[Ruler.GetTitle]§! dẫn dắt người dân trong tiềm thức hướng tới sự vĩ đại."
 cyber.515.a: "Tăng cường giám sát thông qua chip độc tài."
 cyber.515.a.tt: "Nhận Quyền Tiếp Cận Chính Thể: §Y$auth_cyber_dictatorial_individualist$§!\n\n$cyber.social_consequences.tt$"
 cyber.515.b: "Khắc sâu lòng sùng bái nhà lãnh đạo vào tâm trí người dân."
 cyber.515.b.tt: "Nhận Quyền Tiếp Cận Chính Thể: §Y$auth_cyber_dictatorial_collectivist$§!\n\n$cyber.social_consequences.tt$"

# IMPERIAL
 cyber.520.name: "Vinh Quang Đế Chế"
 cyber.520.desc.gov: "Các phòng khám do triều đình bảo trợ đã triển khai hiệu quả các nguồn lực to lớn để cải tạo thần dân. Các trung tâm cải tạo được chính quyền phê duyệt làm việc ngày đêm không nghỉ để lắp đặt và hướng dẫn người dân cách sử dụng, bảo trì thiết bị cấy ghép một cách chuẩn mực.\n\nCâu hỏi đặt ra là giá trị thực sự của thiết bị cấy ghép nên tập trung vào việc nâng cao khả năng lãnh đạo vốn đã đáng nể của chúng ta, hay đóng vai trò như một phương tiện giải trí và phân tán sự chú ý cho thần dân.\n\nViệc chế tạo các thiết bị cấy ghép chất lượng cao nhất cho hoàng tộc có thể cho phép bộ máy lãnh đạo lưu giữ tri thức qua nhiều thế hệ, mang lại sự ổn định khôn lường. Hoặc đế chế có thể nâng tầm vị thế thủ đô, cho phép các vận động viên tăng cường cơ thể máy tham gia vào các sự kiện thể thao đẫm máu tột bậc."
 cyber.520.desc.cor: "Các tập đoàn được triều đình phê chuẩn đã thực hiện đúng theo các chỉ thị vận hành. Toàn bộ người dân đã được tăng cường bằng các thiết bị cấy ghép cơ thể máy và sẵn sàng cống hiến với hiệu quả cao hơn bao giờ hết.\n\nCâu hỏi lúc này là giá trị thực tế của các thiết bị cấy ghép nên được tập trung vào đâu.\n\nSở hữu những thiết bị cấy ghép chất lượng cao nhất dành cho triều đại của chúng ta có thể cho phép ban lãnh đạo bảo tồn kiến thức qua các thế hệ, mang lại sự ổn định khôn lường. Hoặc đế chế có thể nâng tầm thủ đô và mang lại sự giải trí cho đại chúng với các vận động viên cơ giới hóa tham gia vào các sự kiện thể thao đẫm máu tối tân."
 cyber.520.desc.ind: "Bất chấp vô vàn sự dè dặt từ các quan chức đế chế, việc phân phối và lắp đặt thiết bị cấy ghép cơ thể máy phi tập trung đã diễn ra thành công rực rỡ. Hàng loạt phòng khám nhỏ trên khắp các thế giới của chúng ta đã làm việc không mệt mỏi để cường hóa người dân.\n\nCâu hỏi lúc này là giá trị thực tế của các thiết bị cấy ghép nên tập trung vào đâu. Điều này có thể đồng nghĩa với việc bảo tồn tri thức đế chế bên trong các thiết bị cấy ghép liên thế hệ, hoặc mang đến cho đại chúng những màn giác đấu cơ giới đẫm máu, cảnh tượng chưa từng được chứng kiến bởi bất kỳ cấy ghép thị giác nào trước đây."
 cyber.520.a: "Bảo tồn tri thức hoàng gia."
 cyber.520.a.tt: "Tập trung vào nhà thống trị đế chế."
 cyber.520.b: "Mang lại sự giải trí cho quần chúng."
 cyber.520.b.tt: "Tập trung vào năng suất và hạnh phúc của hành tinh thủ đô."

# CORPORATE
 cyber.525.name: "Tập Đoàn Hóa Cấy Ghép"
 cyber.525.desc.gov: "Chương trình cấy ghép sâu rộng nhưng kém hiệu quả của chính quyền sắp hoàn thành, mở ra cho chúng ta cơ hội mở rộng hơn nữa các nguồn thu liên quan đến đợt ra mắt sản phẩm chưa từng có này. Nhóm phân tích của chúng ta đang đề xuất hai nguồn thu nhập tiềm năng, cả hai đều có rủi ro và phần thưởng riêng.\n\nLiệu chính quyền nên yêu cầu đưa quảng cáo vào tất cả các thiết bị cấy ghép thị giác trong tương lai, hay bắt buộc nâng cấp định kỳ cho toàn bộ dân số đã được cải tạo?"
 cyber.525.desc.cor: "Việc sản xuất và lắp đặt thiết bị cấy ghép diễn ra hiệu quả đúng như kỳ vọng từ cơ sở hạ tầng doanh nghiệp được tối ưu hóa cao độ của chúng ta. Cơ hội kinh doanh từ những thiết bị cấy ghép mới này thực tế là vô tận.\n\nHai hướng đi đặc biệt đầy hứa hẹn đã xuất hiện. Mặc dù loại trừ lẫn nhau, cả hai đều dự báo tỷ suất lợi nhuận ngút trời.\n\nCâu hỏi là, chúng ta nên yêu cầu đưa quảng cáo vào tất cả các thiết bị cấy ghép thị giác trong tương lai, hay bắt buộc nâng cấp định kỳ cho toàn bộ dân số đã được cải tạo?"
 cyber.525.desc.ind: "Không ngoài dự đoán, việc triển khai thiết bị cơ giới theo kiểu \"cộng đồng\" lộn xộn đang dần đi đến hồi kết êm đẹp. Giờ đây chúng ta có cơ hội định hình hướng đi của công nghệ mới đầy hứa hẹn này, đồng thời gia tăng biên lợi nhuận sản phẩm của mình.\n\nLiệu quảng cáo có nên được đưa vào tất cả các thiết bị cấy ghép thị giác trong tương lai, hay sẽ tốt hơn nếu bắt buộc một chu kỳ nâng cấp liên tục cho cả phần mềm và phần mềm sinh học?"
 cyber.525.a: "Thử nghiệm thiết bị cấy ghép thị giác hỗ trợ quảng cáo."
 cyber.525.a.tt: "Tập trung vào việc gia tăng thương mại và giảm chi phí cơ hội kinh tế."
 cyber.525.b: "Nghiên cứu các chương trình nâng cấp thiết bị cấy ghép."
 cyber.525.b.tt: "Tập trung vào các nghị trình năng suất, gián điệp và chi phí duy trì tiện nghi."

### EVENT POOL ###
 cyber.610.name: "Cực Lạc Tức Thì"
 cyber.610.desc: "Một mô-đun cấy ghép chợ đen đang lan truyền trong lực lượng lao động với khả năng kích thích não bộ sản sinh các hóa chất dẫn truyền thần kinh theo ý muốn. Điều này có rất nhiều công dụng từ việc mang lại khoái cảm mãnh liệt cho đến nâng cao khả năng chịu đau. Việc giải mã kỹ thuật đảo ngược để tạo ra một phiên bản ổn định từ bản mẫu bất hợp pháp này sẽ đòi hỏi những khoản đầu tư đáng kể, và tác dụng kích thích chắc chắn sẽ giảm dần theo thời gian.\n\nChúng ta nên tạo ra một phiên bản thương mại, đóng gói lại bản mẫu chợ đen, hay chỉ đơn thuần là kiểm soát việc sử dụng chúng?"
 cyber.610.a: "Tạo ra một thiết bị cấy ghép ổn định."
 cyber.610.b: "Chiếm dụng bản mẫu chợ đen."
 cyber.610.c: "Kiểm soát các loại mô-đun này."

 cyber.615.name: "Phân Chia Công Việc - Đời Sống"
 cyber.615.desc: "Ngày càng nhiều công ty yêu cầu toàn bộ trải nghiệm trong giờ làm việc phải được lưu trữ trong một vùng nhớ não bộ cơ giới mà không thể truy cập được khi ở ngoài nơi làm việc.\n\nHọ tuyên bố chỉ sử dụng chức năng này đối với các nhiệm vụ tối mật nhằm ngăn chặn gián điệp doanh nghiệp. Một số nơi thậm chí còn yêu cầu nhân viên phải ngăn cách các trải nghiệm riêng tư của họ tại nơi làm việc để ngăn đạo đức cá nhân can thiệp vào năng suất."
 cyber.615.a: "Người dân phải có toàn quyền kiểm soát."
 cyber.615.b: "Để công việc lại văn phòng là một điều lành mạnh."
 cyber.615.c: "Ngăn cách trải nghiệm theo cả hai chiều."

 cyber.625.name: "Kiếm Tiền Theo Gói Thuê Bao"
 cyber.625.desc: "Khi thiết bị cơ giới đã ăn sâu vào cuộc sống của chúng ta, những thay đổi trong mô hình kiếm tiền sẽ tác động sâu sắc đến toàn bộ xã hội. Xu hướng gần đây là các nhà sản xuất thiết bị cấy ghép khóa các chức năng thiết yếu đằng sau mô hình thuê bao. Quên đóng tiền một kỳ và đột nhiên, các chi cơ giới của bạn bị khóa cứng, và thị giác của bạn tắt phụt. Các tổ chức người tiêu dùng đang thúc giục chúng ta chấm dứt những hành vi này."
 cyber.625.a: "Cấm mô hình thuê bao đối với thiết bị cơ giới."
 cyber.625.b: "Nếu họ không đủ tiền chi trả, họ không nên mua nó."
 cyber.625.c: "Giới hạn mô hình thuê bao ở các chức năng không quan trọng."
 cyber.625.d: "Một cơ hội kinh doanh tuyệt vời."
 cyber_subscription_ban: "Cấm Thuê Bao Cơ Thể Máy"
 cyber_subscription_ban_desc: "Các nhà sản xuất thiết bị cơ giới không được phép khóa các chức năng cấy ghép sau khi đã bán ra."
 cyber_subscription_limited: "Thuê Bao Cơ Thể Máy Giới Hạn"
 cyber_subscription_limited_desc: "Mô hình thuê bao được phép áp dụng cho các chức năng bổ sung, không quan trọng."
 cyber_subscription: "Thêm các bổ trợ sau vào đặc trưng chủng tộc §Y$trait_cybernetic$§!:\n$t$Hạnh Phúc: §R-5%§!\n$t$$BONUS_WORKFORCE_FOR$ ['concept_planet_traders']: §G+25%§!"
 cyber_subscription_megacorp: "Thêm các bổ trợ sau vào đặc trưng chủng tộc §Y$trait_cybernetic$§!:\n$t$Hạnh Phúc: §R-5%§!\n$t$$BONUS_WORKFORCE_FOR$ ['concept_planet_traders']: §G+50%§!"

 cyber.655.name: "Hỏng Hóc Cơ Học Ngoài Dự Liệu"
 cyber.655.desc: "Các kỹ sư cơ giới của chúng ta đã tìm đến chúng ta với một cơ hội kinh tế. Chỉ với một sự suy giảm nhẹ về độ bền của cấy ghép, chúng ta có thể tạo ra sự gia tăng đáng kể về lợi nhuận vì người dùng sẽ phải thay thế các bộ phận thiết yếu.\n\nBằng cách sử dụng hợp kim sinh học kém chất lượng ở các phần chịu nhiều hao mòn thông thường nhất, các thiết bị cấy ghép sẽ hỏng hóc theo cách giảm thiểu tối đa tổn hại cho người tiêu dùng, nhưng vẫn bắt buộc phải thay thế mới."
 cyber.655.a: "Thật quá đáng!"
 cyber.655.a.tt: "Chúng ta sẽ không cung cấp cho công dân những linh kiện kém chất lượng!\n\n"
 cyber.655.b: "Rất thú vị. Hãy bắt đầu chế tạo các thiết bị cơ giới mỏng manh hơn."
 cyber.655.c: "Được lắm! Hãy phối hợp điều đó với việc tăng giá luôn."
 cyber.655.d: "Sử dụng dữ liệu này để cải thiện các nỗ lực cơ khí hóa của chúng ta."
 worse_parts: "Linh Kiện Kém Phẩm Chất"
 worse_parts_desc: "Chúng ta đã cố tình chọn cung cấp cho công dân các linh kiện cơ thể máy kém phẩm chất hơn, đồng nghĩa với việc họ phải mua linh kiện thay thế thường xuyên hơn."
 worse_parts_effect_tt: "$r_trade$ trên mỗi $pop_group_unit$ £pop£ §HDân số§! có đặc trưng §Y$trait_auto_mod_cyborg$§!: §G+0.5§!"
 optimized_parts: "Linh Kiện Tối Ưu Hóa"
 optimized_parts_desc: "Chúng ta tiếp tục đổi mới và cải tiến các linh kiện cơ thể máy, mang lại quy trình lắp đặt nhanh chóng và đơn giản hơn."
 optimized_parts_effect_tt: "Chi phí duy trì $r_energy$ cho £pop£ §HDân số§! có đặc trưng §Y$trait_auto_mod_cyborg$§!: §R+0.1§!"

 cyber.660.name: "Bất Ổn Xã Hội Ngoài Dự Liệu"
 cyber.660.desc: "Có vẻ như công dân của chúng ta đã phát hiện ra sáng kiến lỗi thời có chủ đích của chúng ta.\n\nĐường phố chật kín những người [Owner.GetSpeciesNamePlural] đang phẫn nộ trước những thay đổi gần đây mà chúng ta đã thực hiện đối với chất lượng và giá cả thiết bị cơ giới. Họ đang la ó đòi chúng ta phải đảo ngược những thay đổi này."
 cyber.660.a: "Được rồi, thế là hơi quá tham lam."
 cyber.660.b: "Nói gì cơ? CHÚNG TA KHÔNG NGHE THẤY GÌ CẢ!"
 cyber.660.c: "Chúng ta sẽ không cần phải..."
 discontent: "Bất Mãn Xã Hội"
 discontent_desc: "Công dân của chúng ta đang nổi loạn vì đợt tăng giá và giảm chất lượng thiết bị cơ giới gần đây."

 cyber.805.name: "Kiểm Soát Của Phụ Huynh"
 cyber.805.desc: "Với các thiết bị cấy ghép não được lắp đặt cho trẻ sơ sinh, những người giám hộ đang yêu cầu có nhiều quyền kiểm soát hơn đối với con cái họ. Khả năng tiếp quản các chức năng vận động hiện chỉ dành riêng cho lực lượng hành pháp, nhưng một số người muốn mở rộng các quyền này cho cả các bậc phụ huynh.\n\nMặc dù đây là sự vi phạm rõ ràng quyền tự chủ thân thể, nhưng một số hình thức cưỡng chế của cha mẹ đã được cho phép. Biện pháp thay thế là cho phép quyền kiểm soát hạn chế, chẳng hạn như làm chậm tốc độ chạy hoặc giảm âm lượng phát ra của đứa trẻ nghịch ngợm."
 cyber.805.a: "Hãy để người lớn kiểm soát con cái của họ."
 cyber.805.b: "Cho phép kiểm soát có giới hạn."
 cyber.805.c: "Để quyền điều khiển cơ thể từ xa cho các chấp pháp viên."

 cyber.810.name: "Truyền Dẫn Kiến Thức"
 cyber.810.desc: "Sự phát triển của các thiết bị cấy ghép não bộ cơ giới mang lại cho chúng ta một cơ hội đầy cám dỗ. Thay vì dựa vào các phương pháp giảng dạy chủ quan và chậm chạp, chúng ta có thể truyền thẳng kiến thức then chốt từ bộ não này sang bộ não khác. Quá trình này đòi hỏi điều kiện phòng thí nghiệm vô trùng, và do đó không thể khai thác trên quy mô lớn. Thông tin nhận được cũng sẽ ghi đè lên các phần ký ức cùng loại của chính người tiếp nhận.\n\nỨng dụng có tác động lớn nhất sẽ liên quan đến việc chia sẻ tri thức giữa các nhà khoa học. Điều này có thể bù đắp một phần gánh nặng nghiên cứu kỹ thuật từ tiến trình cơ khí hóa hoặc tập trung vào các lĩnh vực khác."
 cyber.810.a: "Truyền dẫn kiến thức Kỹ thuật."
 cyber.810.b: "Truyền dẫn kiến thức Vật lý."
 cyber.810.c: "Truyền dẫn kiến thức Xã hội."
 cyber.810.d: "Hãy để tâm trí của mỗi người thuộc về chính họ."

 cyber.815.name: "Tình Yêu Phân Tán"
 cyber.815.desc: "Trong khi nhiều người [root.GetSpeciesNamePlural] vui vẻ cải tạo cuộc sống hàng ngày và các mối quan hệ của họ bằng các thiết bị cơ giới có sẵn trên thị trường, một số lượng ngày càng tăng các hộ gia đình đa bạn đời nói riêng lại tìm đến các mạng lưới riêng tư với phần cứng đặt làm riêng. Các nhóm gia đình này đã chọn sống trong sự biệt lập được may đo riêng, chia sẻ cảm xúc và trải nghiệm của nhau với sự thân mật độc nhất vô nhị.\n\nMột số nhóm phúc lợi xã hội và học giả hoan nghênh hiện tượng này, cho rằng mọi người đều có thể hưởng lợi từ việc tùy biến các mối quan hệ và gắn kết gia đình. Những người khác lại bày tỏ lo ngại về sự thoái lui khỏi xã hội rộng lớn này, một số thậm chí còn gợi ý rằng tập tục này có thể khiến các cá nhân đánh mất chính mình trong những 'tổng hòa ái tình' thu nhỏ."
 cyber.815.a: "Họ chọn sống và yêu như thế nào không phải là việc của chúng ta."
 cyber.815.a.tt: "Chúng ta sẽ tiếp tục cho phép tiếp cận phần cứng tùy biến và các không gian kỹ thuật số riêng tư."
 decentralized_families: "Gia Đình Phân Tán"
 decentralized_families_desc: "Mọi hình thức quan hệ gia đình đều có thể làm phong phú thêm mối quan hệ của họ bằng cách sử dụng phần mềm và các thiết bị cải tạo đặt riêng."
 cyber.815.b: "Đưa những gia đình này trở lại với quỹ đạo chung."
 cyber.815.b.tt: "Chúng ta sẽ không khuyến khích việc cải tạo đặt riêng mà ưu tiên các giải pháp được quản lý chặt chẽ hơn."
 centralized_families: "Gia Đình Tập Trung"
 centralized_families_desc: "Các biện pháp kiểm soát chặt chẽ hơn đối với cải tạo cơ thể máy và phần mềm ngăn cản các hộ gia đình dựng lên những khu vườn kỹ thuật số khép kín." # as in a richly decorated but enclosed space
 cyber.820.name: "Hình Tượng Cấp Tiến"
 cyber.820.desc: "Các tiểu văn hóa ngoại lai đã luôn tồn tại trong suốt lịch sử người [root.GetSpeciesAdj], nhưng với sự ra đời của các cải tạo cơ thể máy, tình hình đã thay đổi: các nhóm bên lề đã bắt đầu biến đổi bản thân một cách triệt để đến mức trông không còn giống người [root.GetSpeciesAdj] nữa. Giới trẻ nói riêng đang kéo căng khoảng cách thế hệ với sự thèm khát những [root.GetSpeciesHandNamePlural] được tùy biến công phu, nghệ thuật cơ thể 3D và các chi phụ trang trí khác.\n\nNhững người ủng hộ tuyên bố họ đang đón nhận bản ngã chân thật hơn của mình, và rằng việc từ bỏ sự đồng nhất của người [root.GetSpeciesAdj] chỉ đơn giản là khẳng định quyền tự quyết đối với cuộc sống của chính họ. Những quan điểm này không được đồng tình bởi một số lượng ngày càng tăng các bậc cha mẹ và chuyên gia xã hội đầy lo lắng, những người lên án các cá nhân đó là những kẻ suy đồi đang hủy hoại xã hội của chúng ta."
 cyber.820.a: "Đó là cơ thể của họ. Hãy để họ tự do lựa chọn."
 cyber.820.b: "Hạn chế các sửa đổi thẩm mỹ cực đoan."
 radical_image: "Hình Tượng Cấp Tiến"
 radical_image_desc: "Việc cởi mở đối với các cải tạo cơ thể máy cực đoan đã thúc đẩy sự tự do cá nhân, đổi lại một chút bất an trong xã hội."
 cyber.820.c: "Thu thập dữ liệu từ các ca cải tạo độc lạ này."
 radical_insights: "Góc Nhìn Cấp Tiến"
 radical_insights_desc: "Các quan sát y tế từ các ca cải tạo cơ thể máy kỳ dị mang lại những hiểu biết khoa học quý giá."

 cyber.821.name: "Tiếng Nói Của Sự Bất Bình"
 cyber.821.desc: "Hàng ngàn thanh niên, nhà hoạt động và nghệ sĩ đầy lo ngại đã tụ tập để đòi hỏi quyền tự do cải tạo cơ thể máy. Những người biểu tình bao gồm đủ mọi thành phần, từ những người [root.GetSpeciesNamePlural] có vẻ ngoài bình thường cho đến những cá nhân có các chi tùy biến, thân mình tái định hình và những hình dạng trông như người ngoài hành tinh khác. Tất cả đều tuyên bố đoàn kết với các công dân [root.GetAdj] đang phải đối mặt với sự phân biệt đối xử vì những lựa chọn cá nhân trong việc trang hoàng cơ thể máy."
 cyber.821.a: "Chúng ta sẽ không dao động."
 cyber.821.a.tt: "Chúng ta sẽ tiếp tục bồi đắp cách tiếp cận tập thể đối với công nghệ cơ thể máy."
 radical_image_denied: "Bác Bỏ Hình Tượng Cấp Tiến"
 radical_image_denied_desc: "Các cuộc biểu tình gần đây về quyền tự do biểu đạt thông qua cải tạo cơ thể máy đã leo thang căng thẳng."
 cyber.821.b: "Chúng ta sẽ cân nhắc các yêu cầu của họ."
 cyber.821.b.tt: "Các cá nhân sẽ được trao quyền tự do lựa chọn rộng rãi hơn đối với cải tạo cơ thể máy."
 radical_image_upheld: "Tôn Trọng Hình Tượng Cấp Tiến"
 radical_image_upheld_desc: "Các cuộc biểu tình gần đây đã đảm bảo một số quyền tự do biểu đạt thông qua các cải tạo cơ thể máy có thể nhìn thấy được."

 cyber.822.name: "Sinh Lý Học Cấp Tiến"
 cyber.822.desc: "Các nhân viên y tế đã nêu lên những phàn nàn về những trở ngại kỳ lạ và chưa từng có mà họ hiện phải đối mặt khi điều trị cho những bệnh nhân có các cải tạo cơ thể máy độc nhất vô nhị.\n\nNhiều cá nhân được điêu khắc công phu này đòi hỏi các biện pháp điều trị đặc biệt như công cụ tùy chỉnh hoặc tháo dỡ quyết liệt, ngay cả đối với những căn bệnh nhẹ. Chi phí cho những can thiệp như vậy vượt xa chi phí liên quan đến những bệnh nhân không cải tạo, không phải người [root.GetSpeciesAdj]."
 cyber.822.a: "Các chi phí đó là hoàn toàn chính đáng."
 cyber.822.b: "Cho phép quá nhiều sự tùy biến quả là một sai lầm."

# Cold Metal
 cyber.830.name: "Cơn Rùng Mình Lạnh Giá"
 cyber.830.desc: "Một bộ phận dân số được cải tạo của chúng ta báo cáo cảm thấy đau đớn khi tiếp xúc với thời tiết lạnh. Tình hình đặc biệt nghiêm trọng trên §H[cold_planet.GetName]§!, nơi nhiệt độ đóng băng là chuyện thường ngày.\n\nCác thiết bị cấy ghép kim loại từ lâu đã được biết là gây khó chịu ở nhiệt độ thấp, nhưng lẽ ra không nên gây ra phản ứng nghiêm trọng đến mức này. Tình trạng này đang ảnh hưởng đến lực lượng lao động của chúng ta."
 cyber.830.a: "Ủy thác một nghiên cứu y khoa."
 cyber.830.b: "Nỗi đau khổ của họ không phải là trách nhiệm của chúng ta."
 cyber.830.tooltip: "Thêm các bổ trợ sau vào đặc trưng chủng tộc §Y$trait_cybernetic$§!:$TABBED_NEW_LINE$Khả Năng Thích Nghi Vùng Núi Cao/Băng Giá/Lãnh Nguyên: §R-20%§!"
 COLD_METAL_PROJECT: "Kim Loại Lạnh"
 COLD_METAL_PROJECT_DESC: "Các nhóm dân số sống trong vùng khí hậu băng giá báo cáo các trường hợp đau đớn dữ dội liên quan đến thiết bị cấy ghép cơ thể máy. Một cuộc thử nghiệm lâm sàng sẽ cho phép chúng ta thu thập thêm dữ liệu."

 cyber.835.name: "Báo Cáo Y Khoa"
 cyber.835.desc: "Các cuộc thử nghiệm lâm sàng không thể xác định được mối tương quan chắc chắn giữa việc thiết bị cơ giới tiếp xúc với thời tiết lạnh và tuổi tác, giới tính, nghề nghiệp hay loại cấy ghép được sử dụng bởi các bệnh nhân bị ảnh hưởng.\n\nMột số chuyên gia y tế cho rằng cơn đau mang tính tâm lý cơ thể, và việc điều trị nên giới hạn ở thuốc giảm đau và liệu pháp hành vi. Những người khác thúc giục chúng ta đừng đánh giá thấp vấn đề, mà thay vào đó hãy tài trợ một chương trình để phát triển các phương án điều trị tiên tiến hơn."
 cyber.835.a: "Nỗi đau của họ hoàn toàn chỉ là do tâm lý."
 cyber.835.b: "Thiết lập một chương trình nghiên cứu."
 cyber.835.c: "Tái định cư những người bị ảnh hưởng đến một hành tinh ấm áp hơn."
 cyber.835.tooltip: "Gỡ bỏ các bổ trợ sau khỏi đặc trưng chủng tộc §Y$trait_cybernetic$§!:$TABBED_NEW_LINE$Khả Năng Thích Nghi Vùng Núi Cao/Băng Giá/Lãnh Nguyên: §R-20%§!"

 cyber.840.name: "Nơi Con Tim Dẫn Lối"
 cyber.840.desc: "Người dân của chúng ta từ xưa đến nay luôn là những người lữ hành. Dân du mục. Những kẻ lang thang. Trong khi đối với một số người, du hành là phương tiện để đến một điểm đích, thì đối với chúng ta, bản thân cuộc hành trình đã là một đích đến. Cải tạo cơ thể đã giúp việc đặt chân đến những thế giới mới trở nên dễ dàng hơn, nhưng cũng cho phép chúng ta theo dõi những ai có thể đi quá xa. Không phải ai cũng vui vẻ với sự thay đổi này.\n\nMột số lượng ngày càng tăng người dân đã can thiệp vào các thiết bị cấy ghép của mình, tự ngắt kết nối khỏi mạng lưới để bảo vệ quyền riêng tư của họ. Hiện tại đây chỉ là một trào lưu nhỏ, nhưng nó có thể gây ra rắc rối."
 cyber.840.a: "Họ nói đúng. Cấm công nghệ theo dõi."
 cyber.840.b: "Điều này không có gì phải đáng báo động."
 cyber.840.c: "Cung cấp các thiết bị cấy ghép không thể theo dõi... có tính phí."
 cyber.840.d: "Ngăn chặn những người bất đồng. Công nghệ theo dõi vẫn sẽ tiếp tục tồn tại."

 cyber_wanderers: "Kẻ Du Mục Không Ngơi Nghỉ"
 cyber_wanderers_desc: "Khó theo dõi. Dễ dàng bắt gặp ở khắp mọi nơi."
 cyber_wanderers_tracked: "Bị Buộc Dây Cương"
 cyber_wanderers_tracked_desc: "Người dân của chúng ta trân trọng sự tự do của mình và kịch liệt phản đối bất kỳ loại công nghệ theo dõi nào."

 cyber.855.name: "Đạt Tiêu Chuẩn Điểm Số" #Idiom: if you achieve a required score, you 'make the grade'; similar to 'make the cut'
 cyber.855.intro.desc: "Bộ vi xử lý nhận thức, gia sư A.I. nâng cao, các enzym thiết kế riêng để thúc đẩy sự tái tạo độ mềm dẻo của thần kinh - và tất cả những thứ này chỉ dành cho học sinh mầm non."
 cyber.855.gov.desc: "$cyber.855.intro.desc$\n\nBắt kịp sự thay đổi công nghệ đã đặt ra một gánh nặng nặng nề lên các chương trình giáo dục do nhà nước tài trợ của chúng ta. Khoảng cách thành tích đang ngày càng nới rộng giữa những người chỉ dựa vào các cải tạo công cộng và những hộ gia đình có thể chi trả cho công nghệ tiên tiến nhất.\n\nDuy trì một hệ thống bình đẳng sẽ đòi hỏi một sự đầu tư tài nguyên đáng kể kéo dài 5 năm."
 cyber.855.corp.desc: "$cyber.855.intro.desc$\n\nMột nền giáo dục tốt có thể rất đắt đỏ, và nhiều người đang cảm thấy ngày càng khó theo kịp. Khoảng cách hiệu suất đang ngày càng nới rộng giữa các hộ gia đình có đủ khả năng chi trả cho các cải tạo tiên tiến và những người phải dựa vào các mẫu máy cũ hơn, đồ dùng lại hoặc hàng nhái.\n\nĐể ngăn chặn sự phân tầng xã hội sâu sắc hơn, cần phải có một khoản đầu tư đáng kể kéo dài 5 năm vào hệ thống giáo dục của chúng ta."
 cyber.855.a: "Chi phí là quá đắt đỏ."
 cyber.855.b: "Giáo dục phải tiếp tục dễ tiếp cận đối với tất cả mọi người."
 cyber_education: "Giáo Dục Cường Hóa"
 cyber_education.tt: "Cung cấp thêm kinh nghiệm cho tất cả các nhà lãnh đạo tương lai."

 cyber.860.name: "Trường Học Bình Đẳng"
 cyber.860.desc: "Sau đợt tài trợ gần đây, các phòng khám cấy ghép trường học đã cập nhật thành công các thiết bị cải tạo của học sinh. Các thiết bị hỗ trợ thần kinh được tiêu chuẩn hóa đảm bảo rằng mọi đứa trẻ đều có cơ hội học tập bình đẳng, bất kể nền tảng gia đình."
 egalitarian_excellence: "Ưu Tú Bình Quyền"
 egalitarian_excellence.tt: "Cải thiện kỹ năng và sự phát triển của các nhà lãnh đạo mới."

 cyber.865.name: "Học Viện Tinh Hoa"
 cyber.865.desc: "Bằng cách tập trung nguồn tài nguyên vào các viện giáo dục hàng đầu, chúng ta đã thúc đẩy một thế hệ các nhà lãnh đạo đặc biệt vượt trội. Những cá nhân ưu tú này được trang bị các thiết bị cấy ghép nhận thức tối tân nhất, sẵn sàng dẫn dắt đế chế tiến về phía trước."
 exceptional_leaders: "Lãnh Đạo Xuất Chúng"
 exceptional_leaders.tt: "Tăng cường năng lực chuyên môn của tầng lớp lãnh đạo."

 cyber.1005.name: "Kỷ Lục Mới"
 cyber.1005.desc: "\"Kỷ Lục Mới Của Người [Species.GetName] Lại Bị Phá Vỡ!\" - tiêu đề này đã trở nên quen thuộc trong đời sống thể thao của người [Owner.GetAdjective]. Khi các [GetAthletePlural] chạy đua để vượt qua nhau bằng những cải tạo mới hơn và tinh vi hơn, các giới hạn về hiệu suất thể thao liên tục bị xô đổ.\n\nTrong khi những người hâm mộ 'thể thao tăng cường' đang ngây ngất trước những kết quả này, một số lượng ngày càng tăng những tín đồ trung thành đã kêu gọi các cá nhân tăng cường phải bị giới hạn trong một hạng đấu riêng biệt. Một nhóm khác lại muốn giới hạn số lượng người cải tạo thi đấu trong các sự kiện đồng đội, đồng nghĩa với việc các [GetAthletePlural] tự nhiên luôn có một vị trí dưới ánh đèn sân khấu."
 cyber.1005.a: "Thời của những người không cải tạo đã qua rồi."
 cyber.1005.a.tt: "Khuyến khích các vận động viên cải tạo để thúc đẩy sự đổi mới."
 cyber.1005.b: "Xếp các vận động viên tăng cường vào giải đấu riêng của họ."
 cyber.1005.c: "Đặt giới hạn trần số lượng [GetAthletePlural] được cải tạo."
 cyber_athletes: "Vận Động Viên Cơ Thể Máy"
 cyber_athletes_desc: "Bằng cách quảng bá các vận động viên cải tạo trong thể thao, chúng ta có thể thử nghiệm thực địa các thiết bị cơ giới tiên tiến nhất."
 cyber_athlete_leagues: "Giải Đấu Thể Thao Cơ Thể Máy"
 cyber_athlete_leagues_desc: "Việc tách biệt các đấu thủ 'tự nhiên' và các đấu thủ được tăng cường đảm bảo sự cạnh tranh công bằng cho tất cả mọi người."
 limited_cyber_athletes: "Giới Hạn Vận Động Viên Cơ Thể Máy"
 limited_cyber_athletes_desc: "Kiểm soát số lượng vận động viên cải tạo đảm bảo rằng mỗi đội đều có cơ hội thực sự để giành chiến thắng."
 athlete_plural: "vận động viên"

 cyber.1010.name: "Bán Bầu Trời"
 cyber.1010.desc: "Tập đoàn §Y[sky_megacorp.GetName]§! đã đưa ra cho chúng ta một cơ hội sinh lời hấp dẫn. Họ muốn quảng cáo sản phẩm mới nhất của mình, một loại đồ uống tăng lực có tên là Plasma Quench.\n\nQuảng cáo cho loại đồ uống này sẽ được chiếu thẳng vào các thiết bị cấy ghép thị giác của công dân chúng ta bất cứ khi nào họ tình cờ ngước nhìn lên bầu trời. Doanh thu tạo ra có thể được sử dụng cho bất kỳ dự án dân sự nào.\n\nBất chấp tính chất xâm lấn của quảng cáo, chúng ta đã được đảm bảo rằng bản thân đồ uống này rất thơm ngon và hoàn toàn không độc hại."
 cyber.1010.a: "Hãy uống Plasma Quench!" #Feel free to localize Plasma Quench to sound like a slimy energy drink. No need to make it word for word.
 cyber.1010.b: "Bầu trời không phải để bán!"
 cyber.1010.c: "Hãy đàm phán các điều khoản."
 cyber.1010.d: "Không có hứng thú."

 cyber.1015.desc: "Tập đoàn §Y[sky_megacorp.GetName]§! đã quay trở lại với một lời đề nghị mới liên quan đến loại đồ uống tăng lực được yêu thích nhất dải ngân hà, Plasma Quench. Vì việc bán tầm nhìn bầu trời của những người dân cải tạo của chúng ta đã diễn ra rất tốt đẹp, họ đã yêu cầu dựng thêm các biển quảng cáo trong thế giới vật lý nữa.\n\n\"[most_populous.GetName] là địa điểm quảng cáo lý tưởng!\" người phát ngôn của [sky_megacorp.GetName] tuyên bố. Rốt cuộc, chẳng phải sẽ công bằng hơn khi mọi người đều có quyền tiếp cận những cơ hội tuyệt vời như vậy sao?"
 cyber.1015.a: "Hãy để dòng chảy Plasma tuôn trào!"
 cyber.1015.a.tt: "Dựng các biển quảng cáo khổng lồ xung quanh §Y[most_populous.GetName]§!."
 cyber.1015.b: "Bầu trời kỹ thuật số của chúng ta đã là quá đủ rồi."
 cyber.1015.c: "Hãy để người dân của chúng ta được nhìn thấy tự do một lần nữa!"
 sold_sky_1: "Biển Quảng Cáo Kỹ Thuật Số"
 sold_sky_1_desc: "Bán sự chú ý ảo của công dân chúng ta quả là một quyết định tuyệt vời!"
 sold_sky_1_mega: "$sold_sky_1$"
 sold_sky_1_mega_desc: "$sold_sky_1_desc$"
 sold_sky_2: "Biển Quảng Cáo Hành Tinh"
 sold_sky_2_desc: "Giới tinh hoa của hành tinh này đã chọn bán bầu trời của công dân để kiếm thêm một số tài nguyên."
 sold_sky_2_mega: "$sold_sky_2$"
 sold_sky_2_mega_desc: "$sold_sky_2_desc$"

 cyber.1030.name: "Ký Ức Phi Pháp"
 cyber.1030.desc: "Với quá nhiều thiết bị cấy ghép có khả năng kiểm soát các trải nghiệm cảm giác và cảm xúc, những cá nhân được tăng cường đã tìm đến các sự kiện đời sống ảo như một hình thức thoát ly thực tế và giải trí. Mặc dù các nghệ sĩ khắc ghi ký ức về mặt lý thuyết có thể kích thích bất kỳ cảm xúc nào, nhưng thói quen này đã rẽ sang một hướng tăm tối.\n\nCác câu lạc bộ khắc ghi ký ức đang trả giá năng lượng tệ cao ngất ngưởng cho những trải nghiệm cảm xúc mãnh liệt tự ghi lại như đám cưới và nghi thức giao phối, nhưng cũng bao gồm cả tự sát, hành hung và giết người. Điều này đã gây ra sự gia tăng đột biến về tội phạm, khi những kẻ phạm tội vừa tự ghi lại hành vi phạm tội của mình vừa đánh cắp thiết bị cấy ghép của nạn nhân sau một trải nghiệm đau thương chấn động.\n\nChúng ta nên xử lý cơn sốt đáng lo ngại này như thế nào?"
 cyber.1030.a: "Đóng cửa ngành công nghiệp này. Nó quá nguy hiểm."
 cyber.1030.a.tt: "Giải trí bằng ký ức khắc ghi sẽ bị đặt ngoài vòng pháp luật."
 cyber.1030.b: "Đánh thuế vào hoạt động sản xuất."
 cyber.1030.b.tt: "Giải trí bằng ký ức khắc ghi sẽ được sử dụng như một nguồn thu nhập."
 cyber.1030.c: "Bỏ tù bất kỳ ai bị bắt quả tang sở hữu những bản ghi như vậy."
 cyber.1030.c.tt: "Lực lượng hành pháp sẽ nhắm vào những kẻ ghi lại hành vi phạm tội."
 cyber.1030.d: "Nghe có vẻ đồi trụy hưởng lạc. Hãy ủng hộ nó."
 cyber.1030.d.tt: "Mọi hình thức khoái lạc sẽ được nhà nước tán thành."
 cyber.1030.e: "Trải nghiệm cái chết bất tận? Thật thiêng liêng làm sao."
 cyber.1030.e.tt: "Điều này sẽ cho phép các Tư Tế Tử Thần của chúng ta thấu hiểu và dẫn dắt trải nghiệm của các Tín Đồ Phàm Trần."
 entertainment_crackdown: "Trấn Áp Ký Ức Khắc Ghi"
 entertainment_crackdown_desc: "Giải trí bằng ký ức khắc ghi đã bị coi là bất hợp pháp để ngăn chặn các hành vi tội phạm tiềm tàng."
 endorsed_entertainment: "Bảo Trợ Ký Ức Khắc Ghi"
 endorsed_entertainment_desc: "Giải trí bằng ký ức khắc ghi đã trở nên phổ biến rộng rãi sau khi nhận được sự bảo trợ của nhà nước."
 illicit_entertainment: "Ký Ức Khắc Ghi Phi Pháp"
 illicit_entertainment_desc: "Các luật mới xoay quanh hình thức giải trí bằng ký ức khắc ghi đã dội một gáo nước lạnh vào nhu cầu đối với dịch vụ này."
 decadent_entertainment: "Ký Ức Khắc Ghi Hưởng Lạc"
 decadent_entertainment_desc: "Người dân của chúng ta đang say sưa trong niềm vui tột cùng do giải trí bằng ký ức khắc ghi mang lại. Ít nhất là cho đến khi cơn sốt tiếp theo xuất hiện."
 deadly_entertainment: "Ký Ức Khắc Ghi Chết Chóc"
 deadly_entertainment_desc: "Các Tư Tế Tử Thần của chúng ta giờ đây có thể tự mình trải nghiệm việc tước đoạt mạng sống và cái chết. Điều này giúp họ dẫn dắt quần chúng, đặc biệt là các Tín Đồ Phàm Trần."

 cyber.1055.name: "Trò Chơi Điệp Viên"
 cyber.1055.desc: "Trong một hành vi ngu ngốc đến bàng hoàng, một học viên hải quân đã làm rò rỉ thông tin tối mật. Là một người hâm mộ cuồng nhiệt của các chương trình mô phỏng chiến đấu qua mạng, học viên này đã tranh cãi nảy lửa với những người chơi khác về vận tốc góc của các tháp pháo trên tàu khu trục của chúng ta.\n\nĐể bảo vệ quan điểm của mình, học viên này đã tải lên một số bản thiết kế tối mật về các con tàu của chúng ta, những tài liệu nhanh chóng lan truyền trên toàn mạng lưới ngân hà. Mặc dù thủ phạm đã bị xử lý, nhưng các tiếng nói trong Hội đồng đang kêu gọi cấm hoàn toàn trò chơi trực tuyến sau sự cố này."
 cyber.1055.a: "Dù sao thì cũng đã đến lúc hiện đại hóa hạm đội rồi."
 cyber.1055.b: "Tăng cường các biện pháp an ninh mạng của chúng ta."
 cyber.1055.c: "Hội đồng nói đúng: hãy cấm các trò chơi này."
 cyber.1055.d: "Dìm chết nguồn tin tình báo đó trong các báo cáo mâu thuẫn."
 cyber_breach_overcome: "Trò Chơi Điệp Viên: Hiện Đại Hóa Hạm Đội"
 cyber_breach_overcome_desc: "Chuyện đã rồi. Chúng ta sẽ nỗ lực hiện đại hóa các hạm đội của mình và biến các sơ đồ bị rò rỉ thành vô dụng."
 cyber_breach_forgive: "Trò Chơi Điệp Viên: Cập Nhật An Ninh"
 cyber_breach_forgive_desc: "Để đối phó với vụ rò rỉ, chúng ta đã cập nhật các giao thức an ninh của mình. Phải nói rằng, các game thủ không gây ra mối đe dọa đối với an ninh quốc gia. Không cần thiết phải phản ứng thái quá trước một sai lầm ngớ ngẩn."
 cyber_breach_ban: "Trò Chơi Điệp Viên: Lệnh Cấm Toàn Diện"
 cyber_breach_ban_desc: "Bên cạnh việc củng cố an ninh vận hành, chúng ta đã ban hành lệnh cấm đối với trò chơi điện tử nối mạng."
 cyber.1055.leak.tt: "Mọi thành viên của §YCộng Đồng Ngân Hà§! nhận được thông tin tình báo §YQuân Sự§! mức §HTrung Bình§! về §Y[Root.GetName]§! trong §Y720§! ngày."
 cyber.1055.minorleak.tt: "Mọi thành viên của §YCộng Đồng Ngân Hà§! nhận được thông tin tình báo §YQuân Sự§! mức §RThấp§! về §Y[Root.GetName]§! trong §Y360§! ngày."
 has_tradition_subterfuge_tt: "Lựa chọn này khả dụng vì chúng ta đã hoàn thành cây truyền thống §YQuỷ Kế§!."

 cyber.1205.name: "Kiểm Duyệt Cảm Quan"
 cyber.1205.desc: "Thế hệ thiết bị cơ giới cảm quan mới nhất cho phép người dùng chặn đứng các cảm giác không mong muốn. Từ những mùi hôi khó chịu đến những hình ảnh chướng mắt, mọi thứ đều có thể được giảm bớt, che giấu hoặc thậm chí xóa bỏ hoàn toàn khỏi nhận thức của người dùng. Đang có những lo ngại ngày càng tăng trong các nhóm bảo thủ hơn của xã hội về những tác động mà sự kiểm duyệt như vậy sẽ gây ra đối với lương tâm của công dân chúng ta."
 cyber.1205.a: "Chúng ta phải đối mặt với sự thật của cuộc sống."
 cyber.1205.b: "Mọi người đều có quyền được hưởng sự ngây thơ vô âu lo."
 cyber.1205.c: "Bộ lọc thẩm mỹ thì được, kiểm duyệt toàn phần thì quá rủi ro."
 cyber.1205.d: "Chúng ta sẽ chọn lọc cảm quan cho họ."
 cyber_censure_truth: "Kiểm Duyệt Cảm Quan: Bị Cấm"
 cyber_censure_truth_desc: "Người dân không được phép áp dụng các bộ lọc nhận thức nhằm che chắn các yếu tố của đời thực. Sự thật phải được đối diện vào mọi lúc."
 cyber_censure_total: "Kiểm Duyệt Cảm Quan: Toàn Diện"
 cyber_censure_total_desc: "Nếu thực tại khiến bạn khó chịu, tại sao không đơn giản là chặn đứng các yếu tố gây phiền toái? Bạn không cần phải chứng kiến tội ác, sự đau khổ hay định kiến."
 cyber_censure_partial: "Bộ Lọc Cảm Quan Thẩm Mỹ"
 cyber_censure_partial_desc: "Chúng ta đã cho phép người dân sử dụng bộ lọc nhận thức trong các thiết bị cấy ghép của họ. Nhờ đó, họ có thể đưa những màu sắc và hiệu ứng sống động vào cuộc sống vốn dĩ tẻ nhạt của mình."
 cyber_censure_authoritarian: "Kiểm Duyệt Cảm Quan Do Nhà Nước Chỉ Đạo"
 cyber_censure_authoritarian_desc: "Chúng ta đang định hướng cách người dân nhận thức thực tại. Bằng cách chặn các thông điệp và nhân tố bất đồng chính kiến khỏi cuộc sống của những công dân trung thành, chúng ta bảo vệ họ khỏi những kẻ muốn dẫn dắt sai lạc họ."

 cyber.1210.name: "Truyền Tin Xâm Nhập Tiềm Thức"
 cyber.1210.desc: "Một xu hướng gần đây trong quảng cáo của các phong trào ngầm và các tập đoàn đầy tham vọng là cấy ghép các thông điệp lén lút vào thiết bị cơ giới của người dùng. Ký ức giả, phản ứng hormone có chọn lọc và gợi ý trong giấc ngủ đang trở nên phổ biến. Các chính khách đầy lo ngại đã nêu vấn đề này với chúng ta và đang vận động cho một lệnh cấm, hoặc ít nhất là một sự kiểm soát đối với những thông điệp xâm lấn này."
 cyber.1210.a: "Những hành vi như vậy không thể được dung thứ."
 cyber.1210.b: "Khôn khéo đấy! Hãy cho phép nó."
 cyber.1210.c: "Cấp phép và quản lý hoạt động này."
 cyber.1210.d: "Sử dụng nó để truyền bá đức tin."
 cyber_subliminhack_banned: "Xâm Nhập Tiềm Thức: Bị Cấm"
 cyber_subliminhack_banned_desc: "Chúng ta đã nghiêm cấm hành vi sử dụng tin nhắn tiềm thức ngấm ngầm thông qua thiết bị cơ giới."
 cyber_subliminhack_allowed: "Xâm Nhập Tiềm Thức: Được Cho Phép"
 cyber_subliminhack_allowed_desc: "Chúng ta đã cho phép hành vi sử dụng tin nhắn tiềm thức ngấm ngầm qua thiết bị cơ giới. Mọi thứ đều công bằng trên thương trường."
 cyber_subliminhack_licensed: "Xâm Nhập Tiềm Thức: Được Cấp Phép"
 cyber_subliminhack_licensed_desc: "Chúng ta đang bán giấy phép cho các công ty muốn sử dụng tin nhắn tiềm thức thông qua thiết bị cơ giới."
 cyber_subliminhack_hallowed: "Xâm Nhập Tiềm Thức: Thiêng Liêng"
 cyber_subliminhack_hallowed_desc: "Chúng ta sử dụng tin nhắn tiềm thức ngấm ngầm để nhắc nhở người dân về những lời răn dạy của giáo hội."

 cyber.1255.name: "Lỗ Hổng An Ninh"
 cyber.1255.intro: "Một cuộc kiểm toán an ninh mạng định kỳ đã phát hiện ra điều không tưởng: toàn bộ hệ thống thông tin của chúng ta đã bị xâm nhập."
 cyber.1255.gov.desc: "$cyber.1255.intro$\n\nLợi dụng việc người dân phụ thuộc vào thiết bị cấy ghép cơ thể máy, các tác nhân vô danh đã xâm nhập vào mạng lưới chính quyền của chúng ta, giành quyền truy cập vào thông tin nhạy cảm. Chúng ta phải khởi động một cuộc điều tra ngay lập tức để tìm ra mức độ nghiêm trọng và thủ phạm của vụ xâm nhập này."
 cyber.1255.hack.desc: "$cyber.1255.intro$\n\nLợi dụng việc người dân phụ thuộc vào thiết bị cấy ghép cơ thể máy, các tác nhân vô danh đã xâm nhập vào mạng lưới của chúng ta, giành quyền truy cập vào thông tin nhạy cảm. Chúng ta phải phát động một cuộc điều tra ngay lập tức để tìm ra quy mô và kẻ chủ mưu đứng sau vụ việc."
 cyber.1255.a: "Bắt đầu cuộc điều tra."
 leak_investigation: "Điều Tra Lỗ Hổng An Ninh"
 leak_investigation_desc: "Chúng ta đang nỗ lực truy tìm nguồn gốc của các cuộc tấn công mạng gần đây."

 cyber.1260.name: "Phép Thuật Thần Kinh"
 cyber.1260.desc: "Cuộc điều tra về vụ rò rỉ an ninh mạng của chúng ta đã kết thúc.\n\nMột số quan chức cấp cao và được tăng cường trong chính quyền đã bị nhắm tới, phần mềm sinh học thần kinh của họ bị hack. Bị thao túng bởi các đặc vụ bên ngoài và buộc phải hành động trái với ý muốn của mình, những cá nhân này không hề có ký ức gì về các sự kiện được nhắc tới.\n\nMặc dù hiện tại chúng ta đã biết nguyên nhân của vụ rò rỉ, nhưng chúng ta vẫn chưa thể tìm ra ai - hay cái gì - chịu trách nhiệm cuối cùng. Tuy nhiên, bằng cách cấy ghép lén lút dữ liệu giả vào tâm trí của các quan chức bị ảnh hưởng, chúng ta có thể lần ra dấu vết vụ rò rỉ về tận gốc rễ của nó."
 leak_distrust: "Rối Loạn Giữa Chúng Ta"
 leak_distrust_desc: "Làm sao chúng ta có thể kỳ vọng người dân có niềm tin vào bộ máy lãnh đạo khi bất kỳ ai trong chúng ta cũng có thể là một con rối?"
 leader_trait_hacked: "Con Rối Cơ Giới"
 leader_trait_hacked_desc: "Nhà lãnh đạo này đã bị tổn hại, phần mềm sinh học thần kinh của họ bị một nguồn không xác định xâm nhập."
 hacked_leaders.tt: "Một số lượng ngẫu nhiên các Nhà Lãnh Đạo Cyborg nhận được Đặc trưng §Y$leader_trait_hacked$§!."

 cyber.1265.name: "Kẻ Cướp Đoạt Tâm Trí" #Playing on the word 'hijacker'
 cyber.1265.desc: "Chúng ta đã tóm được chúng.\n\nNhững kẻ tội phạm đứng sau các cuộc tấn công mạng chưa từng có đã bị tìm ra. Không có mục tiêu nào khác ngoài việc gieo rắc sự hỗn loạn, những kẻ tự xưng là 'Kẻ Cướp Đoạt Tâm Trí' này đã xoay xở để vượt qua các hệ thống an ninh của chúng ta một cách dễ dàng đến đáng xấu hổ. Trong khi những kẻ cầm đầu đã bị tạm giữ, chúng ta vẫn phải quyết định phải làm gì với các quan chức đã bị tổn hại của mình.\n\nGiải pháp đơn giản nhất là cài đặt một tường lửa tùy chỉnh xung quanh các cấy ghép bị ảnh hưởng của họ. Một lựa chọn sạch sẽ hơn, mặc dù rủi ro hơn, là khởi động lại cứng: truy cập vào các chức năng nhận thức cơ bản của họ, các nhà lãnh đạo nói trên có thể bị 'tắt máy' cưỡng chế trong khi một hệ điều hành mới được cài đặt."
 cyber.1265.a: "Xây dựng tường lửa."
 cyber.1265.b: "Khởi động lại các quan chức."
 cyber.1265.c: "Chúng đang theo dõi chúng ta. Hãy xây tường lửa."

 cyber.1270.name: "Khởi Động Lại; Đổi Mới"
 cyber.1270.desc: "Việc khởi động lại cứng các quan chức bị tổn hại của chúng ta đã dẫn đến một số hậu quả bất ngờ: mọi dấu vết của vụ xâm nhập thần kinh đã được xóa sạch hoàn toàn, nhưng một phần lớn kiến thức và kinh nghiệm tích lũy của họ cũng biến mất theo.\n\nBất chấp bước lùi này, trong việc 'bắt đầu lại từ đầu', những nhà lãnh đạo này báo cáo cảm giác đổi mới sâu sắc cả về mặt nghề nghiệp lẫn cá nhân. Bằng cách buộc chúng ta phải thực hiện những biện pháp quyết liệt như vậy, các hacker có thể đã vô tình giúp chúng ta một phen."
 rebooted_leaders: "Xóa bỏ toàn bộ §HĐặc Trưng Tiêu Cực§! khỏi các Nhà Lãnh Đạo có Đặc trưng §Y$leader_trait_hacked$§!.\nVới mỗi Đặc trưng bị xóa bỏ, sẽ mất §R300§! Kinh nghiệm."
 leader_hack_resolution: "Giải Quyết Trong Sự Cảnh Giác"

 cyber.1275.name: "Tường Lửa Thần Kinh"
 cyber.1275.desc: "Tâm trí của chúng ta đã an toàn.\n\nCác kỹ sư phần mềm sinh học đã thiết kế thành công một bức tường lửa thần kinh. Nhằm duy trì an ninh tập thể của chúng ta, chương trình sẽ ngay lập tức được cài đặt cho tất cả các quan chức hiện tại và tương lai. Mặc dù điều này sẽ có tác động bất lợi đến chức năng nhận thức cơ bản của tầng lớp lãnh đạo, dự án đã mang lại những hiểu biết sâu sắc đáng kể về khoa học an ninh dữ liệu."
 cyber.1275.a: "An toàn là trên hết."
 leader_trait_firewalled: "Tường Lửa Thần Kinh"
 leader_trait_firewalled_desc: "Mặc dù an toàn trước các cuộc tấn công mạng, các nhà lãnh đạo của chúng ta học hỏi kém hiệu quả hơn."
 hacked_and_firewalled_leaders.tt: "Xóa bỏ Đặc trưng §Y$leader_trait_hacked$§! và Áp dụng Đặc trưng §Y$leader_trait_firewalled$§! cho tất cả các nhà lãnh đạo Cyborg."

# FINAL EVENT #
# DEMOCRATIC
 cyber.1505.name: "Xã Hội 2.0"
 cyber.1505.desc.individualist: "Tiến trình dân chủ là nền móng mà xã hội này được xây dựng nên. Việc củng cố nền tảng này là hoàn toàn hợp lý. Các cải tạo cơ thể máy mới cho phép chúng ta bỏ phiếu về mọi vấn đề xã hội lớn nhỏ, mang lại cho mỗi cá nhân những cơ hội chưa từng có để bày tỏ ý kiến của mình. Nguồn dữ liệu phong phú mà điều này mang lại là không thể tưởng tượng được và những tiềm năng là vô tận."
 cyber.1505.desc.collectivist: "Việc phát sóng công khai suy nghĩ của bạn tới đồng bào §Y[Species.GetNamePlural]§! là một viễn cảnh gây hoang mang lúc đầu. Nhưng cú sốc ban đầu nhanh chóng được thay thế bằng cảm giác tự tin và chắc chắn về môi trường xung quanh. Chúng ta nhận biết được những gì người bên cạnh đang làm, và họ cũng nhận biết được chúng ta. Giao tiếp diễn ra tức thì không cần lời nói chỉ bằng một ý nghĩ thoảng qua. Để bảo vệ sự minh mẫn này của tâm trí, bộ não cơ giới đã được chỉ thị triệt tiêu các cảm xúc kẻo chúng nhấn chìm những điều quan trọng."
 cyber.1505.desc.neutral: "Bất chấp vô số cuộc tham vấn, các vòng bỏ phiếu và các cuộc tranh luận sôi nổi, quốc gia vẫn chưa thể quyết định về các vấn đề của một xã hội được tăng cường cơ thể máy. Trước khi quá trình này thoái hóa thành một cuộc tranh cãi chia rẽ, ban lãnh đạo phải can thiệp.\n\nChúng ta có thể tận dụng cơ hội này để điều chỉnh công nghệ cơ thể máy của mình phục vụ tiến trình dân chủ hoặc thực hiện cách tiếp cận cấp tiến hơn nơi mọi người chia sẻ suy nghĩ thông qua thiết bị cơ giới của họ. Hướng đi thứ hai cũng sẽ yêu cầu bộ não cơ giới phải kìm nén những cảm xúc cơ bản để ngăn chặn những suy nghĩ bộc phát mạnh mẽ làm gián đoạn môi trường xung quanh tức thời của một người."
 cyber.1505.a: "Kích hoạt việc bỏ phiếu bằng não bộ cơ giới theo thời gian thực."
 cyber.1505.a.tt: "$change_auth_tt$ ['concept_auth_cyber_democratic_individualist']\n$unlock_edict_legislative_chorus$"
 cyber.1505.b: "Liên kết các não bộ cơ giới để chia sẻ trải nghiệm."
 cyber.1505.b.tt: "$change_auth_tt$ ['concept_auth_cyber_democratic_collectivist']\n$unlock_edict_self_preservation_override$"
 cyber.1505.c: "$cyber_keep_auth_option$"
 cyber.1505.c.tt: "$keep_auth_tt$ ['concept_auth_democratic']"

# OLIGARCHIC
 cyber.1510.name: "Thời Gian Rảnh Rỗi Và Lao Động"
 cyber.1510.desc.individualist: "Tầng lớp tinh hoa của chúng ta nên được tự do tận hưởng thành quả lao động của mình. Ép xung các chuyên gia sinh học cho phép các vị lãnh đạo ủy thác nhiều trách nhiệm hơn, giải phóng thời gian cho những nỗ lực trí tuệ và sự giải trí xa hoa. Người dân nhận thức được vị trí của mình trong trật tự vĩ đại của vạn vật và chấp nhận số phận của họ."
 cyber.1510.desc.collectivist: "Người [root.GetSpeciesAdj] chúng ta đã đạt được những điều tuyệt vời, nhưng cơ thể sinh học vẫn đòi hỏi thời gian nghỉ ngơi. Nhờ vào những phát triển công nghệ mới, ranh giới này đã biến mất. Bằng cách kích thích các khớp thần kinh trong khi ngủ, chúng ta có thể tiếp tục đóng góp cho xã hội ngay cả trong những giấc mơ sâu nhất của mình. Hiệu quả là tuyệt đối."
 cyber.1510.desc.neutral: "Các nhà lãnh đạo của chúng ta đang tranh luận về tương lai của xã hội cơ thể máy. Một phe ủng hộ việc tối đa hóa đặc quyền của giới tinh hoa thông qua việc ép xung tầng lớp chuyên gia, trong khi phe kia thúc đẩy một giải pháp tập thể hơn: khai thác sức lao động trong giấc ngủ của toàn thể người dân.\n\nĐã đến lúc phải đưa ra quyết định dứt khoát về con đường mà chúng ta sẽ theo đuổi."
 cyber.1510.a: "Ép xung chuyên gia để phục vụ giới tinh hoa."
 cyber.1510.a.tt: "$change_auth_tt$ ['concept_auth_cyber_oligarchic_individualist']\n$cyber_oligarchic_lifespan_tt$\n$cyber_oligarchic_ruleroutput_tt$\n$unlock_edict_battle_royale$"
 cyber.1510.b: "Khai thác sức lao động trong giấc ngủ của người dân."
 cyber.1510.b.tt: "$change_auth_tt$ ['concept_auth_cyber_oligarchic_collectivist']\n$cyber_oligarchic_lifespan_tt$\nKích hoạt Tính năng: §YÁp Đặt Phe Phái§!\n$unlock_edict_stately_acclaim$"
 cyber.1510.c: "$cyber_keep_auth_option$"
 cyber.1510.c.tt: "$keep_auth_tt$ ['concept_auth_oligarchic']"

# DICTATORIAL
 cyber.1515.name: "Sự Kìm Kẹp Tuyệt Đối"
 cyber.1515.desc.individualist: "Người dân §Y[Species.GetAdj]§! đang đón nhận một thế giới nơi những người được cải tạo có thể thể hiện bản sắc của mình theo những cách hoàn toàn mới.\n\nNhưng sự khoan dung đó chỉ là vẻ bề ngoài, vì các thuật toán giám sát nâng cao bên trong thiết bị cấy ghép giờ đây đang theo dõi từng cá nhân, phát hiện những suy nghĩ bất đồng ngay khoảnh khắc các khớp thần kinh não bộ vừa kết nối."
 cyber.1515.desc.collectivist: "Sức mạnh nằm ở số đông và động lực hợp nhất của nó khi đối mặt với nghịch cảnh. Mỗi một người §Y[Species.GetAdj]§! được tăng cường cơ thể máy đều cùng nhau chiến đấu hướng tới một tương lai tốt đẹp hơn, tin tưởng người bên cạnh cũng sẽ làm như vậy.\n\nNgười dân của chúng ta có thể yên tâm khi biết rằng nhân cách rạng ngời của vị §Y[Ruler.GetTitle] [Ruler.GetName]§! với ý chí sắt đá đang dẫn dắt họ tiến lên phía trước."
 cyber.1515.desc.neutral: "Khi người dân tiếp tục dao động tại ngã ba đường, vị §Y[Ruler.GetTitle] [Ruler.GetName]§! của chúng ta phải nắm bắt cơ hội độc nhất vô nhị này do các cải tạo mang lại và đưa ra quyết định.\n\nLiệu người dân của chúng ta nên được cho phép một số quyền tự do cá nhân trong khi vẫn bị giám sát qua thiết bị cấy ghép, hay để họ chịu ảnh hưởng bởi ý chí từ nhân cách rạng ngời của nhà lãnh đạo?"
 cyber.1515.a: "Triển khai chip độc tài để giám sát toàn diện."
 cyber.1515.a.tt: "$change_auth_tt$ ['concept_auth_cyber_dictatorial_individualist']\n$unlock_edict_self_indictment_protocol$"
 cyber.1515.b: "Đồng điệu hóa tâm trí người dân theo nhân cách của nhà độc tài."
 cyber.1515.b.official.tt: "$change_auth_tt$ ['concept_auth_cyber_dictatorial_collectivist_official']\n$unlock_edict_love_letter_virus$"
 cyber.1515.b.commander.tt: "$change_auth_tt$ ['concept_auth_cyber_dictatorial_collectivist_commander']\n$unlock_edict_love_letter_virus$"
 cyber.1515.b.scientist.tt: "$change_auth_tt$ ['concept_auth_cyber_dictatorial_collectivist_scientist']\n$unlock_edict_love_letter_virus$"
 cyber.1515.b.vacant.tt: "$change_auth_tt$ ['concept_auth_cyber_dictatorial_collectivist_vacant']\n$unlock_edict_love_letter_virus$"
 cyber.1515.c: "$cyber_keep_auth_option$"
 cyber.1515.c.tt: "$keep_auth_tt$ ['concept_auth_dictatorial']"

# IMPERIAL
 cyber.1520.name: "Đế Chế Trường Tồn"
 cyber.1520.desc.individualist: "Ngai vàng đế chế đã ban chiếu chỉ yêu cầu tập trung nỗ lực vào chính triều đại hoàng gia. Một §Y$r_the_rulerchip$§! đặc biệt sẽ được cấy ghép cho tất cả những người cai trị tương lai để ghi lại và chuyển giao những trải nghiệm của họ với tư cách là [root.GetRulerTitle] của §Y[root.GetName]§!. Con chip di vật này sau đó sẽ được chuyển giao cho người thừa kế vào thời điểm vị hoàng đế băng hà.\n\nKhi $r_the_rulerchip$ được truyền qua nhiều thế hệ, thư viện trải nghiệm khổng lồ của nó sẽ trở thành hồ sơ nền tảng của xã hội chúng ta. Chúng ta cũng có thể tận dụng kiến thức của người dân vì lợi ích của các nhà lãnh đạo."
 cyber.1520.desc.collectivist: "Để mang lại cho các công dân đế chế sự thư thái sau những giờ lao động vất vả, một §Y$building_cyberdome$§! vĩ đại phải được xây dựng trên §Y[root.Capital.GetName]§!. Nó sẽ đóng vai trò là địa điểm huy hoàng cho các loại hình thể thao cơ giới mới, nơi các vận động viên được tăng cường tranh giành sự sủng ái và ngưỡng mộ của chúng ta. Việc chứng kiến sự cạnh tranh khốc liệt như vậy chắc chắn sẽ tiếp thêm sinh lực cho quần chúng và lòng ngưỡng mộ của họ đối với §Y[root.GetName]§!.\n\nHơn nữa, những màn trình diễn này có thể được truyền thần kinh thẳng vào não bộ cơ giới, điều này sẽ thúc đẩy đám đông cuồng nhiệt đổ về [root.Capital.GetName] và tận mắt trải nghiệm sự hồi hộp nguyên sơ của hành động."
 cyber.1520.desc.neutral: "Sự tiến bộ xã hội của chúng ta trong lĩnh vực cơ thể máy đang ở ngã ba đường. Chúng ta có thể tập trung nỗ lực vì lợi ích của số ít hoặc số đông. Cả hai cuối cùng đều sẽ phục vụ tốt cho §Y[root.GetName]§!.\n\nPhát triển một thiết bị cấy ghép chuyên dụng sẽ cho phép chúng ta chuyển giao kinh nghiệm của [root.GetRulerTitle] cho người thừa kế. Việc chú trọng vào các môn thể thao cơ giới tăng cường và công nghệ phát sóng sẽ cho phép chúng ta tổ chức các sự kiện tráng lệ tại thủ đô [root.Capital.GetName] của chúng ta."
 cyber.1520.a: "Bảo tồn tri thức hoàng triều."
 cyber.1520.a.tt: "$change_auth_tt$ ['concept_auth_cyber_imperial_individualist']\n$create_relic_the_rulerchip$\n$unlock_edict_levied_experience$"
 cyber.1520.b: "Tổ chức và truyền phát thể thao cơ giới tại thủ đô."
 cyber.1520.b.tt: "$change_auth_tt$ ['concept_auth_cyber_imperial_collectivist']\n$unlock_building_cyberdome$\n$unlock_edict_neurocasted_spectacles$"
 cyber.1520.c: "$cyber_keep_auth_option$"
 cyber.1520.c.tt: "$keep_auth_tt$ ['concept_auth_imperial']"

# CORPORATE
 cyber.1525.name: "Tập Đoàn Hóa Cấy Ghép"
 cyber.1525.desc.individualist: "Các nhóm trọng điểm người §Y[Species.GetAdj]§! đang phản hồi rất tích cực với các thiết bị cấy ghép thị giác mới của họ. Bộ phận phân tích của chúng ta cho thấy sự gia tăng đáng kể về hiệu quả quảng cáo và mức tăng doanh số đầy hứa hẹn trong toàn bộ danh mục sản phẩm của chúng ta. Điều này thể hiện tiềm năng to lớn cho đợt ra mắt sản phẩm đầy đủ sắp tới.\n\nKỷ nguyên cơ thể máy đã ở đây, và chúng ta đã sẵn sàng tận dụng nó bằng một chiến lược doanh nghiệp đổi mới."
 cyber.1525.desc.collectivist: "Cam kết của chúng ta về việc tự cải thiện toàn diện đang tạo được tiếng vang lớn trong đông đảo người dân.\n\nViệc quan tâm đến các vấn đề kinh tế xã hội hoàn toàn phù hợp với tầm nhìn doanh nghiệp của chúng ta, đảm bảo rằng các thế hệ thiết bị cấy ghép thiết yếu mới sẽ được giới thiệu liên tục."
 cyber.1525.desc.neutral: "Trước những biến đổi to lớn mà công nghệ cơ thể máy đã mang lại cho xã hội, có lẽ không có gì đáng ngạc nhiên khi người tiêu dùng bình thường đang phân vân không biết nên đi theo hướng nào. Liệu sự khác biệt hóa cá nhân sẽ trở thành tiêu chuẩn của chúng ta, hay nên tập trung vào hạnh phúc tập thể?\n\nQuyết định then chốt và chưa từng có này chắc chắn sẽ để lại những hệ lụy sâu rộng, nhưng do dự là cái chết của lợi nhuận; một lựa chọn bắt buộc phải được đưa ra."
 cyber.1525.a: "Ra mắt các thiết bị cấy ghép hỗ trợ quảng cáo."
 cyber.1525.a.tt: "$change_auth_tt$ ['concept_auth_cyber_corporate_individualist']\n$unlock_edict_customer_insights$"
 cyber.1525.b: "Ban hành các bản nâng cấp cấy ghép toàn diện."
 cyber.1525.b.tt: "$change_auth_tt$ ['concept_auth_cyber_corporate_collectivist']\n$unlock_edict_rolling_updates$\n$unlock_agenda_augmentation_product_launch$"
 cyber.1525.c: "$cyber_keep_auth_option$"
 cyber.1525.c.tt: "$keep_auth_tt$ ['concept_auth_corporate']"

