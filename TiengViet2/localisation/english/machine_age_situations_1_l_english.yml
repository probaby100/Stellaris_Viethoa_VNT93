# Buildings
 building_augmentation_center: "Trung Tâm Cải Tạo Cường Hóa"
 building_augmentation_center_plural: "Các Trung Tâm Cải Tạo Cường Hóa"
 mod_cyborg_ruler_bonus_workforce_mult: "$BONUS_WORKFORCE_FOR$ $pop_cat_cyborg_ruler_plural$"
 mod_cyborg_specialist_bonus_workforce_mult: "$BONUS_WORKFORCE_FOR$ $pop_cat_cyborg_specialist_plural$"
 mod_cyborg_worker_bonus_workforce_mult: "$BONUS_WORKFORCE_FOR$ $pop_cat_cyborg_worker_plural$"
 building_augmentation_center_desc: "Một công trình dùng để lắp đặt các thiết bị cấy ghép cơ thể máy. Vừa là trung tâm mua sắm, vừa là khu phẫu thuật, lại vừa là xưởng cơ khí."
 building_augmentation_center_government_desc: "Các phòng khám của chính quyền cho phép công dân lựa chọn và lắp đặt các thiết bị cấy ghép cơ thể máy đã được phê duyệt."
 building_augmentation_center_corporate_desc: "Một tổ hợp rộng lớn đáp ứng mọi nhu cầu cơ khí hóa của bạn, hoàn chỉnh với các trợ lý mua sắm kỹ thuật số cá nhân và khu spa hậu phẫu sang trọng."
 building_augmentation_center_independent_desc: "Các bác sĩ cơ giới ở chợ đen ngõ hẻm có thể lắp đặt bất kỳ loại cấy ghép nào, nhưng cái giá bạn phải trả có thể đắt hơn vài năng lượng tệ đấy."
 building_augmentation_center_hive_desc: "Những dây chuyền lắp ráp bất tận để trang bị các thiết bị cấy ghép cơ thể máy. Vừa là kho tài nguyên, vừa là trung tâm vận hành, lại vừa là xưởng máy móc."
 building_augmentation_center_creed_desc: "Thánh địa của sự cải tạo siêu việt, nơi các tín đồ tề tựu để tái sinh thông qua sự dung hợp thần thánh."

