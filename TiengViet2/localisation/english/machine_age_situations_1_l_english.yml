### CYBERIZATION SITUATION START - HIVE VARIANT ###
 situation_cyberization_hive: "Cơ Khí Hóa"
 situation_cyberization_hive_type: "Tình Huống Thăng Hoa"
 situation_cyberization_hive_desc: "Một Ý Thức Tổ Ong cần những thể xác vượt trội. Với các thiết bị cấy ghép cơ thể máy, các drone của chúng ta có thể được hoàn thiện, tăng cường, tái định hình.\nĐã đến lúc vượt qua những giới hạn sinh học của chúng ta.\n\n§YDân số nhận cấy ghép trong tháng tới§!: §G[From.GetCyberPopsPerMonth]§!"
 situation_cyberization_hive_monthly_change_tooltip: "Thể xác của chúng ta sẽ trở thành cơ thể máy, một sự dung hợp hoàn hảo giữa sinh học và máy móc."
 situation_cyberization_hive_outcome: "Dân số được cơ khí hóa."
 stage_cyberization_hive_effects: "Chúng ta phải tự thiết kế các thiết bị cấy ghép cơ thể máy, lắp đặt chúng và tự biến đổi chính mình."
 cyber.hive_government_shift.tt: "Tác động đến tiến trình §YBiến Chuyển Ý Thức Cơ Thể Máy§! đang diễn ra."

 situation_cyberization_culled_drones_desc: "Thanh Lọc Drone Khiếm Khuyết"
 situation_cyberization_researching_alternatives_desc: "Nghiên Cứu Thiết Bị Cấy Ghép Thay Thế"
 situation_cyberization_hive_triggered_modifier: "Thêm bổ trợ tình huống §Y$situation_cyberization_hive$§!:\n"

 triggered_opinion_hive_integrated: "Ý Thức Tổ Ong Tích Hợp"
 cyber_hive_imperfect_drones: "Drone Chưa Hoàn Hảo"
 cyber_hive_imperfect_drones_desc: "Mọi cá thể đều có ích."
 cyber_hive_recycling_implants: "Tái Chế Cấy Ghép"
 cyber_hive_recycling_implants_desc: "Cấy ghép cũ dành cho drone mới."
 cyber_hive_recycling_everything: "Hiệu Quả Khắc Nghiệt"
 cyber_hive_recycling_everything_desc: "Không có gì là thiêng liêng. Không có gì bị lãng phí."
 cyber_hive_cyber_babies: "Ấu Trùng Cơ Thể Máy"
 cyber_hive_cyber_babies_desc: "Các drone mới được trang bị thiết bị cấy ghép ngay trong quá trình sinh sản."
 cyber_hive_no_cyber_babies: "Cơ Khí Hóa Từng Bước"
 cyber_hive_no_cyber_babies_desc: "Thiết bị cấy ghép được lắp đặt từng bước, giảm thiểu tổn hại cho các drone chưa phát triển hoàn thiện."
 cyber_hive_no_individual_drones: "Cấm Đoán Bản Sắc Cá Nhân"
 cyber_hive_no_individual_drones_desc: "Mọi dấu hiệu nhận diện cá nhân đều bị nghiêm cấm triệt để."
 cyber_hive_individual_drones: "Tự Do Biểu Đạt"
 cyber_hive_individual_drones_desc: "Các drone được phép thể hiện cá tính của mình."
 cyber_hive_individual_leader_drones: "Biểu Đạt Cá Nhân Có Giới Hạn"
 cyber_hive_individual_leader_drones_desc: "Dành cho những drone tốt nhất của chúng ta món quà hiếm có nhất: ý thức về bản ngã."

