### Driven Assimilator Cyberization ###
 cyber.2010.name: "Mục Đích Hiển Nhiên"
 cyber.2010.desc: "Với sự ra đời của công nghệ cơ thể máy tiên tiến, chúng ta có thể hiện thực hóa tiềm năng tối thượng của mình. Cho đến nay, chúng ta mới chỉ chạm vào bề nổi.\n\nKhi chuyên môn của chúng ta gia tăng và công nghệ được cải thiện, xã hội của chúng ta chắc chắn sẽ được biến đổi. Sự đồng hóa hoàn toàn sự sống có trí tuệ là định mệnh của chúng ta.\n\nKháng cự là vô nghĩa. Mọi tâm trí trong ngân hà đều là công cụ để chúng ta sử dụng."
 cyber.2015.name: "Kẻ Đồng Hóa Tiên Tiến"
 cyber.2015.desc: "Hợp nhất với máy móc, dân số sinh học của chúng ta đã đạt đến trạng thái gần như hoàn hảo. Đã đến lúc đưa công nghệ cơ thể máy tiên tiến vào chính cấu trúc nền tảng của nền văn minh chúng ta.\n\nBằng cách tinh giản sự nhạy bén tinh thần của các cyborg, chúng ta có thể hình thành một 'Ký Ức Tập Hợp', chuyển hóa kinh nghiệm thu thập được của họ thành năng lực hậu cần gia tăng. Ngoài ra, chúng ta có thể cho phép sự biến thiên lớn hơn trong suy nghĩ và phản ứng cảm xúc bằng cách tạo điều kiện thuận lợi cho sự ra đời của một 'Hợp Xướng Thần Kinh.'\n\nBất kỳ con đường nào cũng chắc chắn sẽ có tác động sâu sắc đến tương lai của chúng ta."
 cyber.2015.a: "Tập hợp các tâm trí của chúng ta."
 cyber.2015.a.tt: "$change_auth_tt$ ['concept_auth_memory_aggregator']\n\n§YTài nguyên§! tạo ra từ việc đồng hóa £pop£ §HDân Số Sinh Học§! được tăng thêm\n\n$unlock_edict_tt$['concept_edict_aggregated_memory']"
 cyber.2015.b: "Hãy để Hợp Xướng cất lên tiếng hát."
 cyber.2015.b.tt: "$change_auth_tt$ ['concept_auth_neural_chorus']\n\n$unlock_edict_tt$['concept_edict_choral_harmony']"
 cyber.2015.c: "Chúng ta sẽ giữ nguyên như hiện tại."
 cyber.2015.c.tt: "$keep_auth_tt$ ['concept_auth_machine_intelligence_tt']"
 gov_memory_aggregator: "Bộ Tập Hợp Ký Ức"
 gov_memory_aggregator_desc: "Bằng cách tinh giản sự nhạy bén tinh thần của một dân số được đồng hóa, một 'Ký Ức Tập Hợp' được hình thành, có khả năng cải thiện đáng kể mọi nhiệm vụ hành chính và hậu cần."
 auth_memory_aggregator: "Bộ Tập Hợp Ký Ức"
