 forced_cyberization_full: "Cơ Khí Hóa Cưỡng Chế"
 forced_cyberization_limited: "Cơ Khí Hóa Giới Hạn"

# Static Modifiers
 borrowed_research: "Nghiên Cứu \"Mượn Tạm\""
 borrowed_research_desc: "Các kết quả nghiên cứu đánh cắp được đã được đưa vào tiến trình cơ khí hóa, gây ra sự oán hận."
 researcher_media_relations: "Phân Tán Kinh Phí Nghiên Cứu"
 researcher_media_relations_desc: "Kinh phí nghiên cứu bị chuyển hướng sang quan hệ công chúng."
 bad_publicity: "Khủng Hoảng Truyền Thông"
 bad_publicity_desc: "Một bộ phim nổi tiếng đã khiến dư luận quay lưng lại với các kế hoạch của chính quyền."
 state_censorship: "Kiểm Duyệt Của Nhà Nước"
 state_censorship_desc: "Việc đối xử hà khắc với những người bất đồng chính kiến đã làm gia tăng sự bất mãn."
 cyber_state_censorship: "Kiểm Duyệt Cơ Giới"
 cyber_state_censorship_desc: "Lệnh cấm một bộ phim truyền hình nổi tiếng đã châm ngòi cho sự phẫn nộ chống lại sự lạm quyền của chính quyền."
 cyber_victim_compensation: "Bồi Thường Cho Nạn Nhân"
 cyber_victim_compensation_desc: "Khoản bồi thường được chi trả cho gia đình của những người phải chịu tổn hại từ các cuộc thử nghiệm cải tạo cường hóa thất bại."
 cyber_anti_faith: "Thép Lạnh Không Tình"
 cyber_anti_faith_desc: "Chúng ta đã gạt bỏ những suy đoán mơ hồ về đức tin sang một bên để thúc đẩy sáng kiến cơ khí hóa mà không hề chậm trễ."
 cyber_rulers_force_tests: "Cưỡng Chế Thử Nghiệm Tầng Lớp Tinh Hoa"
 cyber_rulers_force_tests_desc: "$cyber_everyone_force_tests_desc$"
 cyber_specialists_force_tests: "Cưỡng Chế Thử Nghiệm Chuyên Gia"
 cyber_specialists_force_tests_desc: "$cyber_everyone_force_tests_desc$"
 cyber_workers_force_tests: "Cưỡng Chế Thử Nghiệm Công Nhân"
 cyber_workers_force_tests_desc: "$cyber_everyone_force_tests_desc$"
 cyber_everyone_force_tests: "Cưỡng Chế Đối Tượng Thử Nghiệm"
 cyber_everyone_force_tests_desc: "Việc cưỡng chế tuyển chọn các đối tượng thử nghiệm sẽ giúp chúng ta nhanh chóng đạt được các mục tiêu của mình."
 cyber_birth_implants: "Cơ Khí Hóa Từ Nhỏ"
 cyber_birth_implants_desc: "Trẻ nhỏ được nhanh chóng cải tạo cường hóa bằng công nghệ cơ thể máy."
 cyber_natural_childhood: "Tuổi Thơ Không Can Thiệp"
 cyber_natural_childhood_desc: "Trẻ nhỏ được tự do phát triển tự nhiên mà không phải chịu bất kỳ sự cải tạo cường hóa nào."
 AI_control: "Giám Sát Viên AI"
 AI_control_desc: "Các phản ứng khớp thần kinh được tăng cường bởi AI giúp định hướng người dân hướng tới các nhiệm vụ có năng suất cao."
 moderate_AI_control: "$AI_control$"
 moderate_AI_control_desc: "$AI_control_desc$"
 AI_forced_control: "Bộ Điều Khiển AI"
 AI_forced_control_desc: "Các thiết bị cấy ghép sâu bên trong các trung khu ra quyết định của não bộ cho phép chính quyền thực hiện mức độ kiểm soát rất cao."
 media_blockade: "Cấm Vận Truyền Thông"
 media_blockade_desc: "Một lệnh phong tỏa truyền thông toàn diện đã bịt miệng những lời chỉ trích nhắm vào các mục tiêu của chính quyền."
 helping_hand: "Cánh Tay Trợ Lực"
 helping_hand_desc: "Càng nhiều cánh tay càng tốt hơn là ít, đặc biệt là trong phòng thí nghiệm."
 armed_forces: "Lực Lượng Đa Chi"
 armed_forces_desc: "Việc tích hợp thêm các chi thể đã củng cố đáng kể sức mạnh của quân đội."
 state_handouts: "Viện Trợ Của Nhà Nước"
 state_handouts_desc: "Các nâng cấp cấy ghép đa chi được cung cấp miễn phí cho tất cả những ai bị suy giảm khả năng vận động."
 branching_out: "Thị Trường Chi Thể"
 branching_out_desc: "Các cải tạo đa chi thể được bán đấu giá cho những người sẵn sàng trả giá cao nhất."
 handy_workers: "Lao Động Tháo Vát"
 handy_workers_desc: "Giai cấp công nhân đã được tiếp thêm sức mạnh nhờ những cải tạo đa chi mang tính tiên phong."
 luxury_limbs: "Chi Thể Xa Hoa"
 luxury_limbs_desc: "Quyền lực đi đôi với đặc quyền: giới tinh hoa có nhiều quyền hơn để sở hữu nhiều chi thể phụ trợ."
 murdered_martyrs: "Đối Tượng Hiến Tế"
 murdered_martyrs_desc: "Nạn nhân của các cuộc thử nghiệm cải tạo cường hóa được coi là vật hiến tế trong nghi lễ nhằm chấm dứt nỗi đau đớn của họ."
 artificial_pain_relief: "Giảm Đau Nhân Tạo"
 artificial_pain_relief_desc: "Ngành dược phẩm tập trung phát triển các loại thuốc giảm đau cực mạnh cho những cá nhân cơ khí hóa có nhu cầu."
 chained_experiments: "Thử Nghiệm Cưỡng Chế"
 chained_experiments_desc: "Chỉ có công dân mới có quyền từ chối tham gia thử nghiệm."
 cyber_opposition: "Phe Đối Lập Cơ Giới"
 cyber_opposition_desc: "Việc nhà nước từ chối chịu trách nhiệm đã châm ngòi cho sự phản đối chính trị mạnh mẽ."
 cyber_event_bliss_commercial: "Mô-đun Cực Lạc Thương Mại"
 cyber_event_bliss_commercial_desc: "Các thiết bị cấy ghép thương mại hóa mang lại cảm giác hưởng thụ và hạnh phúc nhân tạo theo yêu cầu thông qua kích thích hóa học."
 cyber_event_bliss_underground: "Mô-đun Cực Lạc Chợ Đen"
 cyber_event_bliss_underground_desc: "Các thiết bị cấy ghép không ổn định có được qua những nguồn mờ ám mang lại sự khoái lạc và sức khỏe chỉ bằng một nút bấm."
 cyber_event_bliss_regulate: "Mô-đun Cực Lạc Được Kiểm Soát"
 cyber_event_bliss_regulate_desc: "Chính quyền bằng lòng với việc quản lý các mô-đun tái tạo và giải trí hiện có mà không tự mình sản xuất."
 cyber_event_worklife_name: "$cyber.615.name$"
 cyber_event_worklife_own: "Ký Ức Lao Động Không Giới Hạn"
 cyber_event_worklife_own_desc: "Người dân không bắt buộc phải cô lập các phân vùng ký ức khi làm việc hoặc khi ở nhà."
 cyber_event_worklife_leave: "Ký Ức Lao Động Bị Hạn Chế"
 cyber_event_worklife_leave_desc: "Người dân được yêu cầu phải cô lập các ký ức liên quan đến công việc khi rời khỏi nơi làm việc nhằm ngăn chặn gián điệp công nghiệp."
 cyber_event_worklife_isolate: "Ký Ức Lao Động Bị Phân Tách"
 cyber_event_worklife_isolate_desc: "Người dân bắt buộc phải tách biệt hoàn toàn ký ức liên quan đến công việc khỏi thời gian giải trí và ngược lại để ngăn chặn gián điệp công nghiệp cùng những xung đột đạo đức với người sử dụng lao động."
 mod_pop_cyborg_specialist_happiness: "Hạnh Phúc của $pop_cat_specialist$ Cyborg"
 cyber_event_parental_control: "Kiểm Soát Vận Động Toàn Phần Của Phụ Huynh"
 cyber_event_parental_control_desc: "Cha mẹ được trao toàn quyền kiểm soát các chức năng vận động của con cái vị thành niên."
 cyber_event_parental_limited: "Kiểm Soát Vận Động Hạn Chế Của Phụ Huynh"
 cyber_event_parental_limited_desc: "Cha mẹ được phép kiểm soát một phần con cái vị thành niên, chẳng hạn như kiểm soát tốc độ chạy và âm lượng phát ra."
 cyber_event_parental_enforcers: "Quyền Kiểm Soát Vận Động Của Chấp Pháp Viên"
 cyber_event_parental_enforcers_desc: "Bất chấp sự phản đối của phụ huynh, quyền kiểm soát chức năng vận động chỉ dành riêng cho các chấp pháp viên."
 cyber_event_knowledge_engineering: "Truyền Dẫn Kiến Thức Kỹ Thuật"
 cyber_event_knowledge_engineering_desc: "Chuyên môn liên quan đến kỹ thuật được truyền thẳng vào tâm trí của các nhà khoa học, với cái giá phải trả là sự suy giảm ở các lĩnh vực nghiên cứu khác."
 cyber_event_knowledge_physics: "Truyền Dẫn Kiến Thức Vật Lý"
 cyber_event_knowledge_physics_desc: "Chuyên môn liên quan đến vật lý được truyền thẳng vào tâm trí của các nhà khoa học, với cái giá phải trả là sự suy giảm ở các lĩnh vực nghiên cứu khác."
 cyber_event_knowledge_society: "Truyền Dẫn Kiến Thức Xã Hội"
 cyber_event_knowledge_society_desc: "Chuyên môn liên quan đến xã hội học được truyền thẳng vào tâm trí của các nhà khoa học, với cái giá phải trả là sự suy giảm ở các lĩnh vực nghiên cứu khác."
 cyber_implant_taxes: "Thuế Thiết Bị Cấy Ghép"
 cyber_implant_taxes_desc: "Đánh thuế nặng vào nguyên vật liệu và quá trình sản xuất thiết bị cấy ghép cơ thể máy."
 cyber_implant_taxes_tt: "Năng Lượng Tệ Hàng Tháng: §G+5%§!\nChi Phí Tăng Trưởng $pop_cat_cyborg$: §R+10%§!"
 cyber_reformed_implant_taxes: "Cải Cách Thuế Cấy Ghép"
 cyber_reformed_implant_taxes_desc: "Cải cách thuế đối với vật liệu và sản xuất cấy ghép cơ thể máy mang lại lợi nhuận ngắn hạn."
 cyber_reformed_implant_taxes_tt: "Năng Lượng Tệ Hàng Tháng: §G+10%§!"
 cyber_market_standards: "Tiêu Chuẩn Thị Trường Cấy Ghép"
 cyber_market_standards_desc: "Khởi tố những nhà sản xuất thiết bị cấy ghép cơ thể máy kém chất lượng nhất để nâng cao tiêu chuẩn chung."
 cyber_implant_weapons: "Vũ Khí Cấy Ghép"
 cyber_implant_weapons_desc: "Công dân được phép lắp đặt các thiết bị cấy ghép vũ khí cá nhân."
 cyber_implants_dismantled: "Thu Hồi Thiết Bị Cấy Ghép Nguy Hiểm"
 cyber_implants_dismantled_desc: "Tất cả các thiết bị cấy ghép chế tạo với mục đích gây hại cho người khác đều bị thu giữ và tái lắp ráp thành các sản phẩm hợp lý hơn."
 cyber_implant_hacks: "Xâm Nhập Thiết Bị Cấy Ghép"
 cyber_implant_hacks_desc: "Các hacker sở hữu mã nguồn điều khiển cấy ghép cốt lõi có thể truy cập - và thao túng - thiết bị cấy ghép của người khác."
 cyber_counter_hacking: "Phòng Chống Xâm Nhập Cấy Ghép"
 cyber_counter_hacking_desc: "Các chuyên viên truy quét dữ liệu lần theo dấu vết các vụ xâm nhập cấy ghép bất hợp pháp qua mạng lưới liên lạc của chúng ta."
 cyber_protests: "Biểu Tình Do Chậm Tiến Độ Cấy Ghép"
 cyber_protests_desc: "Người dân của chúng ta, vốn đã quen với nguồn cung cấp cải tạo nâng cấp liên tục, đang phẫn nộ dữ dội trước sự chậm trễ ra mắt sản phẩm gần đây."
 cyber_stop_protests: "Giải Tán Người Biểu Tình"
 cyber_stop_protests_desc: "Các cuộc biểu tình phản đối sự chậm trễ trong tiến độ lắp đặt thiết bị cấy ghép đang bị giải tán cưỡng chế."

# Policies
 policy_cyberization_standards: "Tiêu Chuẩn Cơ Khí Hóa"
 policy_cyberization_standards_desc: "Cấy ghép trên toàn thể dân số là điều cần thiết cho xã hội của chúng ta, nhưng những người phản đối việc cơ khí hóa toàn diện có thể lựa chọn cải tạo ở mức độ giới hạn."
 cyberization_standards_full_name: "Cơ Khí Hóa Toàn Diện"
 cyberization_standards_full: "$cyberization_standards_full_name$"
 cyberization_standards_full_effect: "§WĐặc Trưng Lãnh Đạo Tâm Linh Học Cơ Thể Máy:§! §Y$leader_trait_cyborg$§!\n§WDân số Tâm Linh Học Cơ Thể Máy nhận lợi ích từ $mod_cyborg_pop_bonus_workforce_mult$§!"
 cyberization_standards_full_desc: "Mọi cá nhân dự kiến sẽ phải trải qua quá trình lắp đặt toàn bộ gói thiết bị cấy ghép cơ thể máy.\n\n§E$cyberization_standards_full_effect$§!"
 cyberization_standards_limited_name: "Cơ Khí Hóa Giới Hạn"
 cyberization_standards_limited: "$cyberization_standards_limited_name$"
 cyberization_standards_limited_effect: "§WĐặc Trưng Lãnh Đạo Tâm Linh Học Cơ Thể Máy:§! §Y$leader_trait_limited_cyborg$§!\n§RDân số Tâm Linh Học Cơ Thể Máy không nhận lợi ích từ $mod_cyborg_pop_bonus_workforce_mult$§!"
 cyberization_standards_limited_desc: "Những cá nhân phản đối việc cải tạo toàn diện có thể lựa chọn cài đặt một gói thiết bị cấy ghép cơ thể máy giới hạn.\n\n§E$cyberization_standards_limited_effect$§!"

 cyberization_standards_full_hive_name: "$cyberization_standards_full_name$"
 cyberization_standards_full_hive: "$cyberization_standards_full$"
 cyberization_standards_full_hive_effect: "Các drone cơ thể máy hưởng toàn bộ lợi ích từ §Y$mod_cyborg_pop_bonus_workforce_mult$§!, nhưng phải chịu §R-5%§! $MOD_LOGISTIC_GROWTH_MULT$."
 cyberization_standards_full_hive_desc: "Thanh lọc những drone có cơ thể đào thải thiết bị cấy ghép là một sự hy sinh cần thiết để đạt được hiệu quả lớn hơn.\n\n$cyberization_standards_full_hive_effect$"
 cyberization_standards_limited_hive_name: "$cyberization_standards_limited_name$"
 cyberization_standards_limited_hive: "$cyberization_standards_limited$"
 cyberization_standards_limited_hive_effect: "$MOD_POP_BONUS_WORKFORCE_MULT$ cho Drone Cơ Thể Máy: §R-5%§!"
 cyberization_standards_limited_hive_desc: "Trang bị cho các drone khiếm khuyết những thiết bị cấy ghép cơ thể máy giới hạn cho phép chúng tiếp tục cống hiến.\n\n$cyberization_standards_limited_hive_effect$"

# CYBERIZATION STAGE 1
 cyber.100.name: "Kiểm Soát Tương Lai" # Stage 1 - Start event
 cyber.100.desc.shared: "Những đột phá gần đây trong lĩnh vực cấy ghép cơ thể máy tiên tiến một ngày nào đó sẽ giúp tái định hình xã hội. Bằng cách loại bỏ mọi điểm yếu sinh học, chúng ta có thể khiến bản thân trở nên thông minh hơn, nhanh hơn và mạnh mẽ hơn."
 cyber.100.desc.shared_unplugged: "Những đột phá gần đây trong lĩnh vực cấy ghép cơ thể máy tiên tiến một ngày nào đó sẽ giúp tái định hình xã hội, lần này là theo cách thức của riêng chúng ta. Bằng cách loại bỏ các điểm yếu và khiếm khuyết sinh học trong các cải tạo hiện có, chúng ta có thể làm cho mình thông minh hơn, nhanh hơn và mạnh mẽ hơn."
 cyber.100.desc: "$cyber.100.desc.shared$\n\nCác tập đoàn đã đệ trình các đề xuất kinh doanh và dự báo doanh số, trong khi các quan chức chính phủ lập luận rằng quyền tiếp cận công nghệ tiềm năng này phải được nhà nước đảm bảo."
 cyber.100.desc.unplugged: "$cyber.100.desc.shared_unplugged$\n\nCác tập đoàn đã đệ trình các đề xuất kinh doanh và dự báo doanh số, trong khi các quan chức chính phủ lập luận rằng quyền tiếp cận công nghệ tiềm năng này phải được nhà nước đảm bảo."
 cyber.100.desc.megacorp: "$cyber.100.desc.shared$\n\nCác nhà thầu phụ đã đưa ra những đề xuất kinh doanh và dự báo doanh thu cho việc sản xuất thiết bị cấy ghép của bên thứ ba, trong khi hội đồng quản trị của chúng ta lập luận rằng quyền tiếp cận công nghệ trọng yếu này phải thuộc quyền độc quyền của chúng ta."
 cyber.100.desc.megacorp_unplugged: "$cyber.100.desc.shared_unplugged$\n\nCác nhà thầu phụ đã đưa ra những đề xuất kinh doanh và dự báo doanh thu cho việc sản xuất thiết bị cấy ghép của bên thứ ba, trong khi hội đồng quản trị của chúng ta lập luận rằng quyền tiếp cận công nghệ trọng yếu này phải thuộc quyền độc quyền của chúng ta."
 cyber.100.a: "Chúng ta sẽ quốc hữu hóa ngành công nghiệp cải tạo cường hóa."
 cyber.100.a.megacorp: "Duy trì việc tự phát triển nội bộ."
 cyber.100.a.tt: "$situation_cyberization_triggered_modifier$$cyber_control_government_effects$"
 cyber.100.b: "Chúng ta sẽ tư nhân hóa quy trình phân phối."
 cyber.100.b.megacorp: "Giao việc này cho các công ty con của chúng ta."
 cyber.100.b.tt: "$situation_cyberization_triggered_modifier$$cyber_control_corporate_effects$"

 cyber.105.name: "Do Dân, Vì Dân"
 cyber.105.desc: "Những người tự độ cơ thể đang rất phẫn nộ vì nhiều thiết kế cơ thể máy dự kiến sẽ nằm ngoài tầm với của người dân bình thường.\n\nHọ cho rằng nếu sơ đồ thiết kế được công khai và các quy định môi trường được nới lỏng, hầu như tất cả mọi người sẽ có thể tự chế tạo và sửa chữa các thiết bị nâng cấp của chính mình."
 cyber.105.desc.megacorp: "Các nhà thầu độc lập phàn nàn rằng họ không thể tiếp cận nhiều mẫu thiết kế cơ thể máy trong kế hoạch của chúng ta.\n\nHọ lập luận rằng nếu các bản thiết kế được công khai và các bằng sáng chế liên quan đến sản xuất được nới lỏng, năng suất sản xuất cấy ghép có thể được nâng cao rõ rệt."
 cyber.105.a: "Quy định tồn tại đều có lý do của nó."
 cyber.105.a.megacorp: "Đó là tài sản trí tuệ của chúng ta."
 cyber.105.a.tt: "Bổ trợ tình huống §Y$situation_cyberization$§! không thay đổi."
 cyber.105.b: "Bãi bỏ bớt các quy định trong ngành."
 cyber.105.b.crafters: "Hãy để người dân chế tạo những gì họ thích."
 cyber.105.b.megacorp: "Cung cấp sơ đồ mã nguồn mở."
 cyber.105.b.gov.tt: "Cập nhật bổ trợ tình huống §Y$situation_cyberization$§!:\n§GThêm:§! $cyber_control_independent_effects$\n§RXóa:§! $cyber_control_government_effects$"
 cyber.105.b.cor.tt: "Cập nhật bổ trợ tình huống §Y$situation_cyberization$§!:\n§GThêm:§! $cyber_control_independent_effects$\n§RXóa:§! $cyber_control_corporate_effects$"

# Stage 1 Opportunities - Research
 cyber.120.name: "Giảm Tải Tinh Thần"
 cyber.120.desc: "Một nhóm nghiên cứu đã đưa ra một đề xuất sáng tạo nhằm tích hợp các AI giám sát vào thiết bị di động của chúng ta. Về sau, chúng có thể được cấy thẳng vào thiết bị cơ giới sinh học.\n\nCác AI giám sát sẽ điều hướng sự chú ý của người dân khỏi những công việc nhàn rỗi hướng tới những nỗ lực trí tuệ cao hơn. Mặc dù một phần quyền tự chủ sẽ bị mất đi, nhưng tiềm năng to lớn chưa từng có để gia tăng năng suất là không thể chối từ."
 cyber.120.a: "Năng suất là trên hết."
 cyber.120.a.spiritual: "Chúng ta phải đón nhận điều này như một ân huệ."
 cyber.120.b: "Sự mất mát quyền tự chủ là quá lớn."
 cyber.120.b.spiritual: "Chúng ta sẽ không lầm đường lạc lối xa hơn khỏi con đường thiêng liêng."
 cyber.120.c: "Chấp nhận được, nếu có nút bật/tắt."
 cyber.120.d: "Mức độ kiểm soát mà điều này mang lại cho chúng ta thật đáng kinh ngạc..."

# Stage 1 Challenges - Research
 cyber.160.name: "Phân Ly Cơ Giới"
 cyber.160.desc: "Một bộ phim truyền hình mới được hoan nghênh nhiệt liệt đã thu hút trí tưởng tượng của đông đảo công chúng.\n\nLấy bối cảnh trong một thế giới nơi các thiết bị cấy ghép cơ thể máy trở nên phổ biến, câu chuyện kể về một công nhân được cường hóa trải qua sự phân ly chấn thương tâm lý sâu sắc khỏi cơ thể bị biến đổi của mình. Đoạn kết bi thảm của tác phẩm là lời chỉ trích kín đáo nhưng sắc bén đối với việc cơ khí hóa toàn diện và sự xóa bỏ không thể tránh khỏi đối với bản sắc của người [Owner.Species.GetAdj].\n\nTác phẩm ăn khách này đã châm ngòi cho sự phản đối đáng kể đối với sáng kiến của chúng ta, khiến số lượng người tình nguyện làm đối tượng thử nghiệm giảm tới 60% kể từ khi phát sóng."
 cyber.160.a: "Phát động một chiến dịch quan hệ công chúng."
 cyber.160.b: "Siết chặt các quy định về thiết bị cấy ghép."
 cyber.160.c: "Mọi chuyện rồi sẽ sớm lắng xuống thôi."
 cyber.160.d: "Kiểm duyệt bộ phim này."
 cyber.160.e: "Chặn toàn bộ tin tức truyền thông."

# CYBERIZATION STAGE 2
 cyber.200.name: "Trung Tâm Cải Tạo Cường Hóa"
 cyber.200.desc.gov: "Sau một giai đoạn tranh giành quyền lực nội bộ, trách nhiệm sản xuất các cải tạo cơ thể máy đã được phân chia cho các bộ phận chính quyền khác nhau. Khi ai cũng có phần bánh của mình, họ chắc chắn sẽ kiềm chế lẫn nhau.\n\nNhưng các kế hoạch phải được đưa vào hành động. Cộng đồng nghiên cứu yêu cầu ít nhất một $building_augmentation_center$ đóng vai trò là trung tâm phát triển cơ thể máy."
 cyber.200.desc.cor: "Những gì từng là ước mơ nay đã ở ngay trong tầm tay, và còn ai hưởng lợi tốt hơn ngoài vô số các tập đoàn trong biên giới của chúng ta? Một lợi ích từ sức sống bùng nổ của ngành công nghiệp cơ thể máy là các sản phẩm tiêu dùng mới có thể được tung ra với tốc độ nhanh chóng mặt.\n\nNhưng kế hoạch cần phải được thực hiện. Các nhà vận động hành lang doanh nghiệp yêu cầu ít nhất một $building_upload_center$ làm trung tâm phát triển cơ thể máy."
 cyber.200.desc.ind: "Các mạng lưới truyền thông của chúng ta đang sôi sục với những ý tưởng thiết kế hoang đường, đủ mọi thứ từ cải tạo khớp thần kinh não bộ đến các tuyến vị giác cơ giới. Hầu hết các ý tưởng này đều cực kỳ thiếu thực tế và tốn kém kinh hoàng để triển khai, tuy nhiên may mắn là một vài thiết kế có vẻ đầy hứa hẹn.\n\nNhưng kế hoạch cần phải được triển khai. Cộng đồng mạng yêu cầu ít nhất một $building_augmentation_center$ làm trung tâm phát triển cơ thể máy."
 cyber.200.a.gov: "Phê duyệt giấy phép xây dựng."
 cyber.200.a.cor: "Đã phê duyệt."
 cyber.200.a.ind: "Chấp thuận."
 cyber.200.a.tt: "§RYêu cầu hành động:§!\nXây dựng một £building£ ['building:building_augmentation_center'] để tiếp tục tình huống §Y$situation_cyberization$§!."

 cyber.205.name: "Dự Án Thí Điểm" # Stage 2 - Start event
 cyber.205.desc.shared: "Đã đến lúc triển khai các dự án thí điểm quy mô rộng hơn. Những dự án này đòi hỏi sự hỗ trợ liên tục và sẽ chỉ khả dụng trên các hành tinh có một $building_augmentation_center$, nhưng những bài học thu được sẽ mang lại lợi ích năng suất ngay lập tức."
 cyber.205.desc.gov: "Các cuộc thử nghiệm quy mô nhỏ do những dự án nghiên cứu được chính quyền tài trợ đã xác nhận rằng các cải tạo cơ giới giúp nâng cao năng suất.\n\n$cyber.205.desc.shared$"
 cyber.205.desc.cor: "Các cuộc thử nghiệm quy mô nhỏ được tiến hành trên các nhóm tình nguyện viên trọng điểm đã xác nhận rằng các cải tạo cơ giới giúp nâng cao năng suất.\n\n$cyber.205.desc.shared$"
 cyber.205.desc.ind: "Báo cáo từ những người tự độ cơ thể đã xác nhận rằng các cải tạo cơ giới giúp nâng cao năng suất.\n\n$cyber.205.desc.shared$"
 cyber.205.a: "Cường hóa giới tinh hoa."
 cyber.205.a.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] giờ đây cung cấp:\n$t$- $mod_cyborg_ruler_bonus_workforce_mult$: §G+$@cyber_focus_ruler_workforce|0%$§!"
 cyber.205.b: "Tăng cường cho các chuyên gia."
 cyber.205.b.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] giờ đây cung cấp:\n$t$- $mod_cyborg_specialist_bonus_workforce_mult$: §G+$@cyber_focus_specialist_workforce|1%$§!"
 cyber.205.c: "Nâng cấp cho công nhân."
 cyber.205.c.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] giờ đây cung cấp:\n$t$- $mod_cyborg_worker_bonus_workforce_mult$: §G+$@cyber_focus_worker_workforce|0%$§!"
 cyber.205.d: "Cải tạo cho tất cả mọi người."
 cyber.205.d.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] giờ đây cung cấp:\n$t$- $mod_cyborg_pop_bonus_workforce_mult$: §G+$@cyber_focus_everyone_workforce|0%$§!"

 cyber.210.name: "Phát Triển Song Song"
 cyber.210.desc.gov.rival: "Các nhà báo đã phanh phui bằng chứng về các cuộc thử nghiệm do chính phủ tài trợ liên quan đến vi chip giám sát suy nghĩ. Khi được phát triển hoàn thiện, các thiết bị này có thể được gắn vào tâm trí công dân để thu thập thông tin an ninh và đặc điểm tính cách chi tiết."
 cyber.210.desc.cor.rival: "Bằng chứng tại tòa liên quan đến một tranh chấp thương hiệu cho thấy các tập đoàn đang thử nghiệm các thiết bị cấy ghép thực tế tăng cường, được thiết kế để gắn liền mạch vào dây thần kinh thị giác của người tiêu dùng. Các sơ đồ phác thảo cả những lợi ích cho người dùng lẫn khả năng công ty có thể chiếm đoạt dữ liệu thị giác."
 cyber.210.desc.ind.rival: "Những người tự độ cơ thể độc lập đã bắt đầu thay thế các chi bằng các phương án cơ học thô sơ. Hoàn toàn không có cách nào đảm bảo an toàn cho những người tự ý làm điều này, và đang có những lo ngại rằng việc sử dụng các thiết bị cấy ghép không được kiểm soát có thể gây hại nhiều hơn là lợi."
 cyber.210.a: "Chúng ta có thể tận dụng điều này."
 cyber.210.a.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y1§! năm: §G+25%§!\n\n"
 cyber.210.b: "Chuyện này phải dừng lại ngay lập tức."
 cyber.210.b.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y1§! năm: §R-25%§!"

# Stage 2 Opportunities - Test Results and Rival Sector
 cyber.220.name: "Phối Hợp Đa Chi"
 cyber.220.desc: "Một bước đột phá quan trọng đã đạt được trong lĩnh vực giao diện thần kinh. Một bộ khuếch đại tín hiệu não có thể cho phép người dùng điều khiển liền mạch nhưng có giới hạn một loạt các chi nhân tạo. Sau này, tính năng này có thể được tích hợp trực tiếp vào não bộ cơ giới mà không cần thiết bị ngoại vi.\n\nTrong giai đoạn thử nghiệm ban đầu, các đối tượng đã thể hiện kết quả đầy hứa hẹn về sự khéo léo và khả năng thao tác đồ vật cùng với trình độ chiến đấu được nâng cao rõ rệt. Tuy nhiên, những lo ngại về chi phí sản xuất đã đặt ra yêu cầu phải quyết định ai sẽ là người đầu tiên được tiếp cận công nghệ tiên phong này."
 cyber.220.a: "Các nhà khoa học của chúng ta cần thêm [owner.species.GetHandNamePlural]."
 cyber.220.b: "Tập trung vào việc tăng cường sức mạnh quân đội."
 cyber.220.c: "Trước hết, hãy trợ giúp những người bị khiếm khuyết thể chất."
 cyber.220.d: "Không có đồ miễn phí! Bán cho bên trả giá cao nhất."
 cyber.220.e: "Trang bị thêm tay cho giai cấp công nhân!"
 cyber.220.f: "Giới tinh hoa phải luôn nắm giữ ưu thế vượt trội."

# Stage 2 Challenges - Test Results and Rival Sector
 cyber.260.name: "Cúi Gập Quá Mức"
 cyber.260.desc: "Một đợt chạy thử nghiệm mô-đun tủy sống mới đã kết thúc trong thất bại thảm hại. Công suất dư thừa do các động cơ của thiết bị cấy ghép tạo ra đã dẫn đến chấn thương tủy sống vĩnh viễn cho nhiều đối tượng thử nghiệm.\n\nNhững hình ảnh gây sốc ghi lại kết quả kinh hoàng này đã bị rò rỉ ra công chúng, gây ra tình trạng thiếu hụt trầm trọng các tình nguyện viên cho các cuộc thử nghiệm trong tương lai."
 cyber.260.a: "Tạm dừng mọi thử nghiệm cho đến khi tìm ra giải pháp."
 cyber.260.a.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y6§! tháng: §R-50%§!"
 cyber.260.b: "Bồi thường cho gia đình nạn nhân."
 cyber.260.c: "Tìm kiếm tình nguyện viên. Dùng vũ lực nếu cần thiết."

# CYBERIZATION STAGE 3
 cyber.300.name: "Triển Khai Quy Mô Lớn" # Stage 3 - Start event
 cyber.300.desc: "Trên khắp lãnh thổ của chúng ta, tại mọi trung tâm đô thị lớn, chúng ta đã dự trữ các thiết bị cấy ghép cơ học cho toàn thể người dân [Owner.Species.GetName]. Được thiết kế bởi các $job_augmentor_plural$ của chúng ta, những thiết bị này hứa hẹn sẽ tăng cường mạnh mẽ thể xác sinh học của chúng ta.\n\nNgày ấy cuối cùng đã đến để rũ bỏ quá khứ và đón nhận một tương lai cơ thể máy."
 cyber.300.a: "Tiến hành cơ khí hóa."
 cyber.300.a.tt: "Lãnh đạo nhận Đặc trưng: §Y$leader_trait_cyborg$§!\nDân số nhận Đặc trưng: ['trait:trait_cybernetic']\n\nTốc độ cải tạo cường hóa phụ thuộc vào phương hướng giải quyết tình huống và số lượng công trình £building£ ['building:building_augmentation_center']."

 cyber.305.name: "Những Người Phản Đối Cơ Khí Hóa" # Spiritualists are Cybernetic Objectors
 cyber.305.desc.shared: "Trên thực tế, họ thiếu ngay cả những cấy ghép cơ bản nhất, khiến họ gặp khó khăn trong việc sinh hoạt trong một xã hội ngày càng kết nối chặt chẽ của chúng ta.\n\nBắt buộc toàn bộ người dân phải cài đặt đầy đủ cấy ghép sẽ giúp họ hòa nhập tốt hơn với xã hội, nhưng chắc chắn sẽ dẫn đến sự oán giận."
 cyber.305.desc: "Các nhóm tôn giáo phản đối việc hợp nhất giữa [Owner.Species.GetFleshTypeCyberCreed] và máy móc đã chọn rút khỏi các nỗ lực cơ khí hóa dân số của chúng ta. $cyber.305.desc.shared$"
 cyber.305.desc.spiritualist: "Các tín đồ, do sự miễn cưỡng dễ hiểu trong việc hợp nhất [Owner.Species.GetFleshTypeCyberCreed] và máy móc, đã chọn rút khỏi các nỗ lực cơ khí hóa dân số của chúng ta. $cyber.305.desc.shared$"
 cyber.305.desc.none: "Tính đạo đức của việc hợp nhất [Owner.Species.GetFleshTypeCyberCreed] và máy móc từ lâu đã là chủ đề gây tranh cãi. Đáng tiếc thay, với hiệu quả gia tăng có được từ cơ khí hóa, những người từ chối có thể sẽ chịu nhiều bất lợi.\n\nBắt buộc người dân phải lắp đặt cấy ghép sẽ đảm bảo không ai bị bỏ lại phía sau, nhưng chắc chắn cũng sẽ dẫn đến sự oán giận."
 cyber.305.desc.unplugged: "Tính đạo đức của việc một lần nữa hợp nhất [Owner.Species.GetFleshTypeCyberCreed] và máy móc từ lâu đã là chủ đề tranh cãi. Tuy nhiên, các thiết bị nâng cấp do chính chúng ta thiết kế không còn bị ràng buộc bởi ý muốn thất thường của Cỗ Máy từng đồng hóa chúng ta nữa, và do đó chúng mang lại hiệu quả vượt trội. Những người từ chối có thể sẽ chịu nhiều thiệt thòi.\n\nBắt buộc người dân lắp đặt cấy ghép sẽ đảm bảo không ai bị tụt lại phía sau, nhưng điều đó chắc chắn cũng sẽ gây ra sự oán hận."
 cyber.305.a: "Họ phải tự thích nghi."
 cyber.305.a.materialist: "Đức tin chẳng có nghĩa lý gì, chúng ta phải tiến lên."
 cyber.305.a.spiritualist: "Đức tin phải thích ứng."
 cyber.305.a.tt: "$cyberization_standards_full_effect$\n\nNhận Quyền Tiếp Cận Chính Sách: §Y$policy_cyberization_standards$§!\n"
 cyber.305.b: "Thoái thác cấy ghép là một quyền cơ bản."
 cyber.305.b.spiritualist: "Chúng ta tôn trọng sự thiêng liêng của [Owner.Species.GetFleshTypeCyberCreed]."
 cyber.305.b.tt: "$cyberization_standards_limited_effect$\n\nNhận Quyền Tiếp Cận Chính Sách: §Y$policy_cyberization_standards$§!\n"

# Stage 3 Opportunities - Treatment of Non-Cyborgs
 cyber.320.name: "Thế Hệ Tương Lai"
 cyber.320.birth.desc: "Với khả năng mới phát triển cho phép lắp đặt thiết bị cấy ghép cho trẻ sơ sinh, chúng ta đột nhiên rơi vào một thế tiến thoái lưỡng nan. Những cải tạo sơ sinh tiên phong này nắm giữ sức mạnh để mãi mãi biến đổi mối liên kết của chúng ta với công nghệ, khai mở tiềm năng cơ thể máy bẩm sinh ngay từ khi còn nhỏ và đưa nền văn minh của chúng ta lên những tầm cao chưa từng có.$cyber.320.end.desc$"
 cyber.320.metamorphosis.desc: "Gần đây, chúng ta đã đạt được một bước đột phá đáng kinh ngạc cho phép cấy vi chip trực tiếp vào các thế hệ non nớt. Trong giai đoạn biến thái, ấu trùng của chúng ta có khả năng tự nhiên hấp thụ các hệ thống cơ học. Những cải tạo được thực hiện trong giai đoạn nhộng có thể giải phóng tiềm năng cơ thể máy chưa từng được khai phá và đưa nền văn minh của chúng ta lên những tầm cao kinh ngạc mới.$cyber.320.end.desc$"
 cyber.320.lithoid.desc: "Giữa khả năng mới phát triển cho phép gắn thiết bị cấy ghép vào những hậu duệ mới kết tinh, chúng ta bất ngờ rơi vào tình thế tiến thoái lưỡng nan. Những cải tạo như vậy sẽ cho phép thế hệ non nớt hình thành mối liên kết tự nhiên với khoáng chất kim loại, khai mở tiềm năng cơ thể máy từ độ tuổi sớm và đưa nền văn minh của chúng ta lên những đỉnh cao kinh ngạc mới.$cyber.320.end.desc$"
 cyber.320.root.desc: "Giữa khả năng mới phát triển cho phép gắn thiết bị cấy ghép cơ thể máy vào mầm non, chúng ta bất ngờ rơi vào tình thế tiến thoái lưỡng nan. Những cải tạo này sẽ cho phép cây non truyền dẫn các xung điện qua mạng lưới sợi nấm tăng cường, khai mở tiềm năng cơ thể máy ngay từ khi còn nhỏ.$cyber.320.end.desc$"
 cyber.320.egg.desc: "Giữa khả năng mới phát triển cho phép lắp đặt thiết bị cấy ghép trực tiếp cho con non mới nở, chúng ta bất ngờ rơi vào thế tiến thoái lưỡng nan. Những cải tạo tiên phong này nắm giữ sức mạnh để mãi mãi biến đổi mối liên kết của chúng với công nghệ, khai mở tiềm năng cơ thể máy bẩm sinh từ độ tuổi sớm và đưa nền văn minh của chúng ta lên những đỉnh cao chưa từng có.$cyber.320.end.desc$"
 cyber.320.other.desc: "Với khả năng gắn các thiết bị cấy ghép cơ thể máy cho trẻ sơ sinh, chúng ta cũng rơi vào thế tiến thoái lưỡng nan: những cải tạo tiên phong này nắm giữ sức mạnh để mãi mãi biến đổi mối liên kết của chúng ta với công nghệ, khai mở tiềm năng cơ thể máy bẩm sinh từ độ tuổi sớm và đưa nền văn minh của chúng ta lên những đỉnh cao chưa từng có.$cyber.320.end.desc$"
 cyber.320.end.desc: "\n\nTuy nhiên, việc tạo ra sự phụ thuộc vào sự cải tạo cơ thể máy từ độ tuổi sớm như vậy rốt cuộc có thể khiến chủng loài chúng ta mất đi khả năng sinh tồn trong trạng thái tự nhiên."
 cyber.320.a: "Tiến hóa là lẽ tự nhiên của chúng ta."
 cyber.320.b: "Chúng ta phải bảo tồn một tuổi thơ tự nhiên."

# Stage 3 Challenges - Treatment of Non-Cyborgs
 cyber.360.name: "Cơn Đau Chuyển Hóa"
 cyber.360.desc: "Gần đây, một số cá nhân đã bắt đầu công khai bày tỏ sự hối hận về quyết định trải qua các cuộc biến đổi cơ thể thử nghiệm. Việc thay thế cuống não bằng một linh kiện cơ học thay thế đã dẫn đến nỗi sợ hãi hiện sinh kéo dài, một số người mô tả trải nghiệm của họ như một chu kỳ đau đớn cùng cực không thể chịu đựng nổi.\n\nGiữa những yêu sách bồi thường không ngừng nghỉ, chúng ta buộc phải làm rõ lập trường của mình về trách nhiệm của nhà nước."
 cyber.360.a: "Cấm các cải tạo cực đoan."
 cyber.360.a.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y6§! tháng: §R-50%§!"
 cyber.360.b: "Sự hy sinh sẽ chấm dứt nỗi đau đớn của họ."
 cyber.360.c: "Cung cấp thuốc giảm đau mạnh hơn."
 cyber.360.d: "Tìm kiếm đối tượng thử nghiệm ở các tầng lớp thấp nhất."
 cyber.360.e: "Chúng ta không chịu bất kỳ trách nhiệm nào."

# CYBERIZATION STAGE 4
 cyber.405.name: "Thuế Thiết Bị Cấy Ghép" # Government rival
 cyber.405.desc: "Chứng kiến lợi nhuận khổng lồ trong ngành công nghiệp cải tạo được quản lý lỏng lẻo, các quan chức chính quyền địa phương đã tranh nhau chạy theo những bước phát triển mới nhất. Các khoản thuế nặng nề đã được áp đặt lên mọi giai đoạn sản xuất cấy ghép cơ thể máy, từ khai thác tài nguyên cho đến khâu lắp đặt cuối cùng.\n\nSự quan liêu và chi phí tăng thêm đã làm chậm quá trình cải tạo của chúng ta, cản trở tiến trình tiến tới cơ khí hóa toàn diện."
 cyber.405.a: "Chấp nhận các mức thuế."
 cyber.405.b: "Bãi bỏ các loại thuế này."
 cyber.405.b.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§!: §G+25%§!\n\n"
 cyber.405.c: "Cải cách việc đánh thuế cải tạo cơ thể."
 cyber.405.c.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y1§! năm: §R-10%§!"

 cyber.410.name: "Chiến Tranh Tư Pháp" # Government rival escalation
 cyber.410.desc: "Không thể theo kịp tốc độ người dân đón nhận các thiết bị cấy ghép cơ thể máy, các nhà lập pháp của chúng ta đang làm mọi cách để hạn chế một số khía cạnh của việc cải tạo.\n\nChỉ trích \"nỗi ám ảnh cấy ghép\" của chúng ta, cho rằng mỗi lần cải tạo lại \"đưa chúng ta rời xa hơn ý nghĩa thực sự của việc là một người [Owner.Species.GetName]\", các dự luật mới nhất đề xuất ấn định một tỷ lệ phần trăm cải tạo tối đa trên mỗi người để vẫn đủ điều kiện được pháp luật bảo vệ. Rốt cuộc, đến một thời điểm nào đó, chúng ta có nguy cơ trở thành máy móc nhiều hơn là người [Owner.Species.GetName]."
 cyber.410.a: "Bác bỏ dự luật đề xuất."
 cyber.410.a.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y1§! năm: §G+25%§!"
 cyber.410.b: "Tìm kiếm một giải pháp thỏa hiệp."
 cyber.410.b.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y1§! năm: §R-25%§!"

 cyber.415.name: "Không Bảo Hành" # Corporate rival
 cyber.415.desc: "Trong cơn cuồng loạn chạy theo lợi nhuận, thị trường cải tạo cường hóa đã bị tràn ngập bởi các thiết bị cấy ghép rẻ tiền, chất lượng kém, và các công ty hoàn toàn từ chối hỗ trợ khách hàng khi những thiết bị này không thể tránh khỏi việc hỏng hóc.\n\nTrong một vụ việc gần đây được truyền thông đưa tin rầm rộ, thiết bị cấy ghép điều hòa tim của một nghệ sĩ biểu diễn nổi tiếng đã gặp sự cố ngay trên sân khấu. Kết quả thật không may, lại mang tính bùng nổ dữ dội."
 cyber.415.a: "Thị trường sẽ tự điều tiết."
 cyber.415.a_industrial: "Chẳng có gì bất thường cả."
 cyber.415.a.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§!: §G+25%§!"
 cyber.415.b: "Chúng ta phải đảm bảo an toàn cho người dùng."
 cyber.415.c: "Trừng phạt những kẻ vi phạm nghiêm trọng nhất."
 cyber.415.c.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§!: §R-25%§!"

 cyber.420.name: "Thiết Kế Nguy Hiểm" # Corporate rival escalation
 cyber.420.desc: "Gần đây, một chủng loại thiết bị cấy ghép cơ thể máy mới đầy ngờ vực đang ngày càng thu hút sự chú ý. Những cấy ghép này không được thiết kế để hỗ trợ người dùng, mà là để gây thương tích cho người khác: súng phun độc tố, dây siết cổ nano và thiết bị gây nhiễu não cơ giới tràn ngập đường phố của chúng ta.\n\nNhững người ủng hộ lập luận rằng các cấy ghép này là cần thiết để tự vệ, trong khi những người khác kiên quyết cho rằng công nghệ như vậy chẳng mang lại điều gì tốt đẹp cả."
 cyber.420.a: "Hãy để họ tự vũ trang."
 cyber.420.b: "Điều này quá nguy hiểm."
 cyber.420.b.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§!: §R-25%§!"
 cyber.420.b_pacifist: "Mọi thiết bị cấy ghép bạo lực phải bị tháo dỡ."
 cyber.420.b.tt_pacifist: "Sử dụng các vật liệu này để chế tạo những thứ... hợp lý hơn.\n\n"

 cyber.425.name: "Tấn Công Phần Mềm Điều Khiển" # Independent rival
 cyber.425.desc: "Trong một cuộc tấn công phối hợp, nhiều nhóm hacker đã giành được quyền truy cập vào phần mềm cốt lõi vận hành toàn bộ các thiết bị cấy ghép cơ thể máy. Chúng đang đe dọa sẽ tung mã nguồn ra công chúng trừ khi chúng ta chịu nhượng bộ các yêu sách của chúng.\n\nCho đến nay, chúng ta không có lý do gì để nghi ngờ quyết tâm của chúng. Nếu mã nguồn bị công khai, chúng ta sẽ không có lựa chọn nào khác ngoài việc viết lại từ đầu, một sự chậm trễ sẽ gây ra tác động tàn khốc đối với các nỗ lực cải tạo của chúng ta."
 cyber.425.a: "Trả đúng số tiền chúng yêu cầu."
 cyber.425.b: "Viết lại phần mềm."
 cyber.425.b.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization$§! trong §Y1§! năm: §R-25%§!"
 cyber.425.c: "Ta muốn xem chúng dám thử không."
 cyber.425.c.tt: "Thật may là chúng ta đã tuyển dụng những hacker giỏi nhất về dưới trướng CỦA MÌNH."

 cyber.430.name: "Cải Tạo Thiếu Tin Cậy" # Independent rival escalation
 cyber.430.desc.demands: "Mặc dù đã trả một khoản tiền chuộc khổng lồ cho các nhóm gây ra vụ vi phạm an ninh, vào đêm muộn hôm qua, cơ sở mã nguồn chính của chúng ta vẫn bị tải lên mọi mạng thông tin công cộng. Vụ rò rỉ này đã khiến các thiết bị cấy ghép trở nên cực kỳ dễ bị tấn công bởi bất kỳ ai có kiến thức lập trình cơ bản.\n\nDư luận đang sôi sục, và cảm giác \"hối hận sau khi mua\" đối với các thiết bị cấy ghép đang tăng vọt."
 cyber.430.desc.protest: "Việc viết lại phần mềm điều khiển cấy ghép đã tốn nhiều thời gian và công sức, đồng thời làm chậm tốc độ sản xuất.\n\nNgười dân ngày càng trở nên phụ thuộc vào các cải tạo mới nhất, và nhiều người đã đổ ra đường để phản đối sự chậm trễ ra mắt sản phẩm."
 cyber.430.a: "Các sản phẩm mới sẽ sớm ra mắt thôi."
 cyber.430.b: "Mặc kệ họ."
 cyber.430.c.demands: "Tiến hành phản công xâm nhập."
 cyber.430.c.protest: "Giải tán những người biểu tình."

 cyber.21.name: "Dân Số Được Cải Tạo Cường Hóa" # Situation 1 - Last event
 cyber.21.desc: "Ngày hôm nay đánh dấu một bước ngoặt cho xã hội của chúng ta. Giờ đây chúng ta đã có thể cải tạo cơ thể mình bằng các bộ phận máy móc tích hợp toàn diện.\n\nQuá trình này không hề thiếu chông gai, sự chuyển giao còn lâu mới dễ dàng. Nhưng bất kể những gì có thể đã mất đi trên chặng đường này, sự tồn tại mới của chúng ta mở ra những khả năng vô tận."
 cyber.21.a: "Chúng ta sẽ trở nên mạnh mẽ hơn."
 cyber.21.a.start: "§Y$building_augmentation_center$§! thêm bổ trợ:$TABBED_NEW_LINE$"
 cyber.21.a.end: "Mở khóa toàn bộ hiệu ứng của Cây Truyền Thống: ['tradition_category:tradition_cybernetics']"
 cyber.21.a.gov.tt: "$cyber.21.a.start$$cyber_control_government_effects$\n$cyber.21.a.end$"
 cyber.21.a.cor.tt: "$cyber.21.a.start$$cyber_control_corporate_effects$\n$cyber.21.a.end$"
 cyber.21.a.ind.tt: "$cyber.21.a.start$$cyber_control_independent_effects$\n$cyber.21.a.end$"

