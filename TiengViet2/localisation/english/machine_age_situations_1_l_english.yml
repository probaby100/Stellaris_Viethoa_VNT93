### EDICTS ###
 edict_hive_mind_outreach: "Mở Rộng Ý Thức Tổ Ong"
 edict_hive_mind_outreach_desc: "Ý chí của một tâm trí kiên định di chuyển nhanh hơn tốc độ ánh sáng."
 concept_edict_hive_mind_outreach: "$edict_hive_mind_outreach$"
 edict_hive_hyper_stimulants: "Chất Siêu Kích Thích"
 edict_hive_hyper_stimulants_desc: "Các thiết bị cấy ghép cơ thể máy tự động tiêm các loại thuốc tăng cường cho drone của chúng ta, giúp gia tăng hiệu suất."
 concept_edict_hive_hyper_stimulants: "$edict_hive_hyper_stimulants$"
 edict_hive_mega_construction: "Xây Dựng Đại Công Trình Tích Hợp"
 edict_hive_mega_construction_desc: "Sắc lệnh này phân bổ thêm tài nguyên cho chương trình Siêu Kỹ Thuật của chúng ta, đẩy nhanh việc xây dựng các công trình ngân hà mới."
 concept_edict_hive_mega_construction: "$edict_hive_mega_construction$"

# CYBERIZATION STAGE 1
 cyber.2100.name: "Vạn Thể Xác. Một Mục Đích."
 cyber.2100.desc: "Khi suy ngẫm về bản chất của sự cải tạo cường hóa, chúng ta nhận thấy bản thân đang khám phá những khát vọng của chính mình.\n\nCơ khí hóa là phương tiện để đạt tới cứu cánh: một cách để tối ưu hóa thể xác của chúng ta nhằm thực thi ý chí tốt hơn. Vô số hình thức cải tạo đều khả thi, mỗi hình thức mang lại sức mạnh mới, nhưng cũng đi kèm những nhu cầu mới. Các chi cơ học rất nặng, não bộ cơ giới cần nhiều năng lượng hơn, và các bộ phận mỏng manh đòi hỏi phải bảo trì liên tục. Trên con đường hướng tới sự hoàn hảo, các lựa chọn phải được đưa ra.\n\nĐâu là trọng tâm trong tham vọng của chúng ta, mục tiêu duy nhất đòi hỏi phải vượt qua giới hạn của [Owner.Species.GetFleshTypeCyberCreed] để vươn một [owner.GetSpeciesHandName] bằng kim loại chạm tới các vì sao?"
 cyber.2100.a: "Sự thấu hiểu."
 cyber.2100.a.tt: "Tập trung nghiên cứu vào việc làm cho các drone của chúng ta thông minh hơn."
 cyber.2100.b: "Sự thống trị."
 cyber.2100.b.tt: "Tập trung nghiên cứu vào việc biến các drone của chúng ta thành công cụ chiến tranh."
 cyber.2100.c: "Sự sung túc."
 cyber.2100.c.tt: "Tập trung nghiên cứu vào việc làm cho các drone của chúng ta năng suất hơn."

# CYBERIZATION STAGE 2
 cyber.2200.name: "Một Mục Tiêu: Cải Tạo Cường Hóa"
 cyber.2200.desc: "Khi những suy ngẫm nhàn rỗi chuyển thành các kế hoạch cụ thể, một nhu cầu cấp bách nảy sinh: một không gian dành riêng cho các thử nghiệm, nơi các bản mẫu cơ thể máy có thể được chế tạo và thử nghiệm.\n\nChúng ta sẽ dựng lên một $building_augmentation_center$, để có thể xé toạc [Owner.Species.GetFleshTypeCyberCreed] của mình ra và đan kết nó lại cùng kim loại và những giấc mơ."
 cyber.2200.a: "Đã đến lúc bắt đầu xây dựng tương lai của chúng ta."
 cyber.2200.a.tt: "§RYêu cầu hành động:§!\nXây dựng một £building£ ['building:building_augmentation_center'] để tiếp tục tình huống §Y$situation_cyberization_hive$§!."

 cyber.2205.name: "Vạn Bản Mẫu. Một Lựa Chọn."
 cyber.2205.desc: "Nghiên cứu cơ thể máy của chúng ta đã tạo ra nhiều bản mẫu cyborg đầy hứa hẹn để chúng ta xem xét. Kết quả sơ bộ cho thấy một số bản mẫu vượt trội về thể chất, trong khi những bản mẫu khác phù hợp hơn cho công việc đòi hỏi độ chính xác. Mỗi loại đều có thế mạnh và hạn chế riêng, chưa có loại nào thể hiện sự vượt trội hoàn toàn.\n\nMột đề xuất táo bạo nảy ra trong tâm trí chúng ta: Liệu chúng ta có thể đa dạng hóa các drone của mình không? Biến đổi cơ thể chúng theo những cách khác nhau tùy thuộc vào chức năng của chúng? Chúng ta sẽ không còn hoàn toàn giống hệt nhau nữa, một viễn cảnh mà chúng ta thấy thật khó nắm bắt. Nhưng sự gia tăng hiệu quả có thể xứng đáng để đánh đổi sự hòa hợp đồng nhất của chúng ta."
 cyber.2205.a: "Tất cả các drone phải đồng nhất."
 cyber.2205.b: "Đa dạng hóa cơ thể của chúng ta."

 cyber.2220.name: "Sự Đào Thải Thể Xác"
 cyber.2220.desc: "Một thử nghiệm cấy ghép quy mô lớn gần đây đã phơi bày một sai sót nghiêm trọng: cơ thể của một số lượng đáng kể các drone đơn giản là đào thải kim loại. [owner.Species.GetFleshTypeCyberCreed] của chúng thối rữa xung quanh các thiết bị cấy ghép, khiến chúng chịu đau đớn dữ dội và chết dần mòn.\n\nChúng ta có thể điều chỉnh các thiết bị cấy ghép để thích ứng với những cơ thể yếu hơn này, nhưng việc này sẽ làm giảm đáng kể hiệu quả của toàn bộ sáng kiến cơ thể máy của chúng ta. Hoặc chúng ta có thể đơn giản là thanh lọc những cá thể không tương thích, hy sinh một phần nhỏ dân số để phục vụ cho sự thịnh vượng của số đông."
 cyber.2220.a: "Thanh lọc các drone khiếm khuyết."
 cyber.2220.b: "Tìm kiếm các giải pháp cấy ghép thay thế."

 cyber.2260.name: "Vạn Bản Mẫu. Một Bản Thiết Kế."
 cyber.2260.desc: "Mục tiêu cơ bản của chương trình nghiên cứu cơ thể máy của chúng ta đã hoàn tất. Chúng ta đã hoàn thiện các thiết bị cấy ghép của mình và hiện đã sẵn sàng trang bị chúng cho các drone.\n\nKhi kế hoạch của chúng ta trở thành hiện thực, đã đến lúc đưa ra một lựa chọn then chốt: các thiết bị cấy ghép mới của chúng ta sẽ phục vụ mục đích gì? Chúng ta có nên tập trung vào việc biến drone thành những công nhân chăm chỉ, những chiến binh hung hãn, hay nâng cao năng lực nhận thức của chúng?"
 cyber.2260.a: "Drone của chúng ta sẽ sản xuất."
 cyber.2260.a.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization_hive$§! trong §Y1§! năm: §G+20%§!\n$UNLOCKS_CYBER_STANDARDS_POLICY$"
 cyber.2260.b: "Drone của chúng ta sẽ chiến đấu."
 cyber.2260.b.tt: "$UNLOCKS_CYBER_STANDARDS_POLICY$"
 cyber.2260.c: "Drone của chúng ta sẽ tư duy."
 cyber.2260.c.tt: "Tốc độ tiến trình tình huống §Y$situation_cyberization_hive$§! trong §Y5§! năm: §R-50%§!"
 UNLOCKS_CYBER_STANDARDS_POLICY: "Mở khóa chính sách §Y$policy_cyberization_standards$§!."

# CYBERIZATION STAGE 3
 cyber.2300.name: "Vạn Drone. Một Kế Hoạch."
 cyber.2300.desc: "Các bản mẫu cyborg của chúng ta đã được phê duyệt. §Y$building_augmentation_center$§! đã được xây dựng. Kế hoạch của chúng ta đã sẵn sàng, nhưng khâu hậu cần cho cuộc chuyển đổi của chúng ta vẫn chưa được hoàn tất.\n\nChúng ta có thể ra lệnh cho tất cả các drone tiến đến một $building_augmentation_center$ và trải qua quy trình cải tạo, đình chỉ các hoạt động hàng ngày của chúng. Quy trình này sẽ diễn ra rất nhanh, nhưng sẽ khiến các nhà máy của chúng ta trống rỗng cho đến khi hoàn tất. Ngoài ra, chúng ta có thể sắp xếp theo lịch trình của các drone, biến chúng thành cyborg trong thời gian nghỉ ngơi bắt buộc để không làm ảnh hưởng đến hoạt động của chúng. Mặc dù chậm hơn, kế hoạch này ít gây gián đoạn hơn."
 cyber.2300.shared.tt: "Tốc độ cải tạo phụ thuộc vào phương hướng giải quyết tình huống và số lượng công trình £building£ ['building:building_augmentation_center']."
 cyber.2300.a: "Ưu tiên cơ khí hóa."
 cyber.2300.a.tt: "Dân số được cơ khí hóa mỗi tháng: §G+200§!\n$situation_cyberization_hive_triggered_modifier$Tài Nguyên Hàng Tháng: §R-5%§!\n\n$cyber.2300.shared.tt$"
 cyber.2300.b: "Không làm xáo trộn trật tự của chúng ta."
 cyber.2300.b.tt: "Dân số được cơ khí hóa mỗi tháng: §R-100§!\n$situation_cyberization_hive_triggered_modifier$$unity$s Hàng Tháng: §G+5%§!\n\n$cyber.2300.shared.tt$"

 cyber.2320.name: "Số Đông Sợ Hãi Một Kẻ"
 cyber.2320.desc: "Các đế chế gồm các thực thể đơn lẻ quan sát chúng ta với ánh mắt đầy nghi ngờ, sợ hãi tính đa nguyên của chúng ta. Với các thiết bị cấy ghép cơ thể máy, chúng ta có thể mang lại cho các phái viên của mình những khuôn mặt và tính cách riêng biệt hơn, thể hiện một vẻ bề ngoài bớt đồng nhất hơn.\n\nNhững kẻ chia rẽ sẽ cảm kích nỗ lực này. Họ thậm chí có thể bắt đầu... đồng cảm với chúng ta. Coi chúng ta là một trong số họ."
 cyber.2320.a: "Thật đáng ghê tởm."
 cyber.2320.b: "Một sự hy sinh xứng đáng."
 cyber.2320.b.tt: "Tăng cường đánh giá của các đế chế không phải Gestalt đối với chúng ta."
 cyber.2320.c: "Làm cho các phái viên của chúng ta trở nên giống hệt nhau một cách đáng sợ hơn nữa."
 cyber.2320.c.tt: "Giảm bớt đánh giá của các đế chế không phải Gestalt đối với chúng ta."

 cyber.2360.name: "Một Dân Số, Hai Nhóm"
 cyber.2360.desc: "Tiến trình cơ khí hóa Tổ Ong của chúng ta đang tiếp tục diễn ra êm đẹp. Một phần dân số của chúng ta giờ đây mang trên mình các thiết bị cấy ghép cơ thể máy, trong khi những cá thể khác vẫn hoàn toàn là sinh học. Chưa bao giờ chúng ta trải nghiệm sự khác biệt nổi bật đến thế giữa chính bản thân mình. Các drone giờ đây có thể tự nhận diện mình là một phần của nhóm này hay nhóm kia, và sự chia rẽ này đang mở rộng ý thức về bản ngã cá nhân của chúng.\n\nMột số drone đã bắt đầu tô điểm cho mình bằng các phụ kiện nhỏ, hoặc vẽ các biểu tượng lên thiết bị cấy ghép của chúng để phân biệt nhau. Đó là một bước phát triển đầy thú vị, nhưng cũng không kém phần đáng lo ngại."
 cyber.2360.a: "Khuyến khích bước phát triển này."
 cyber.2360.b: "Cấm các dấu hiệu nhận diện cá nhân."
 cyber.2360.c: "Giới hạn các biểu tượng cá nhân cho các nhà lãnh đạo."

# CYBERIZATION STAGE 4
 cyber.2400.name: "Vạn Ý Nghĩ. Một Bộ Não."
 cyber.2400.desc: "Việc lắp đặt các thiết bị cấy ghép thần kinh vào các drone của chúng ta đã dẫn đến một kết quả ngoài dự kiến: vì não bộ của chúng giờ đây đã có một phần cơ thể máy, chúng có thể hình thành các ý nghĩ cá nhân tách biệt khỏi ý thức chính của chúng ta.\n\nChúng ta có thể phát triển thêm công nghệ này, nâng cao khả năng tư duy tự chủ của các drone."
 cyber.2400.a: "Hãy để các drone của chúng ta tự mình suy nghĩ."
 cyber.2400.b: "Bản sắc cá nhân là mối đe dọa đối với sự thống nhất của chúng ta."

 cyber.2420.name: "Một Hồi Kết Cho Tất Cả"
 cyber.2420.desc: "Các thiết bị cấy ghép cơ thể máy đang làm phức tạp thêm khâu hậu cần của cái chết.\n\nTước bỏ thiết bị cấy ghép khỏi các drone đã chết sẽ cho phép chúng ta tái sử dụng công nghệ này, giảm thiểu sự lãng phí. Toàn bộ quy trình xử lý chất thải của chúng ta sẽ phải được đại tu để tiếp nhận bước đi mới này; chi phí tài nguyên là rất đáng kể."
 cyber.2420.a: "Tái chế các thiết bị cấy ghép."
 cyber.2420.b: "Không đáng để tốn kém chi phí như vậy."
 cyber.2420.c: "Tái chế các thiết bị cấy ghép... và cả thể xác."

 cyber.2460.name: "Cấy Ghép Cho Một Đời Người"
 cyber.2460.desc: "Dân số hiện tại của chúng ta đang trải qua tiến trình cơ khí hóa với tốc độ ổn định, nhưng chúng ta phải thiết lập một quy trình cho những cá thể chưa ra đời.\n\nVới công nghệ của mình, chúng ta có thể gắn các thiết bị cấy ghép cơ thể máy cho các [owner.Species.GetSpawnNamePlural] trước cả khi chúng ra đời, tạo ra một chủng loài cơ thể máy thực thụ: một giải pháp nhanh chóng, dễ dàng và hiệu quả. Mặt khác, nghiên cứu sơ bộ cho thấy việc lắp đặt cấy ghép từ khi còn quá sớm có thể gây ra hiện tượng phân ly, loạn thần, run rẩy và các rối loạn phát triển khác nhau."
 cyber.2460.a: "Kim loại mạnh mẽ hơn [Owner.Species.GetFleshTypeCyberCreed]."
 cyber.2460.b: "Thiết lập độ tuổi tối thiểu trước khi tiến hành cơ khí hóa."

# CYBERIZATION FINISHED
 cyber.2004.name: "Vạn Drone. Một Ý Chí?"
 cyber.2004.desc: "Cuộc biến đổi đã hoàn tất. Các thiết bị cấy ghép cơ thể máy đã được thử nghiệm, dựng mẫu, cải tiến, mài giũa và lắp đặt, biến cơ thể chúng ta thành những phiên bản hoàn hảo của chính mình."
 cyber.2004.desc.volitional: "$cyber.2004.desc$\n\nCác drone của chúng ta giờ đây có khả năng tư duy cá nhân tốt hơn - và sự tự do lớn hơn đi kèm với những khả năng mới."
 cyber.2004.desc.integrated: "$cyber.2004.desc$\n\nCác drone của chúng ta giờ đây đoàn kết hơn bao giờ hết, những sợi xích kim loại củng cố mối liên kết của tâm trí."
 cyber.2004.desc.neutral: "$cyber.2004.desc$\n\nTrong quá trình này, chúng ta đã nhìn thấy những cơ hội để thay đổi. Có sức mạnh trong sự hợp nhất của chúng ta, nhưng các drone tự chủ hơn cũng có những lợi thế riêng."
 cyber.2004.end: "Khi cơ thể chúng ta tiến hóa, [Owner.Species.GetFleshTypeCyberCreed] được nâng tầm bởi công nghệ, chúng ta phải đưa ra quyết định về tương lai của ý thức chung của mình. Liệu chúng ta sẽ tiếp tục bước đi trên con đường của sự tự do cá nhân, hay củng cố sự kìm kẹp sắt đá của Ý Thức Tổ Ong?"
 cyber.2004.a: "Chào đón bản sắc cá nhân."
 cyber.2004.a.tt: "$change_auth_tt$ ['concept_auth_cyber_hive_volitional']\n$unlock_edict_tt$['concept_edict_hive_mind_outreach']\n$unlock_edict_tt$['concept_edict_hive_mega_construction']\n$cyber.21.a.end$"
 cyber.2004.b: "Tăng cường sự kiểm soát."
 cyber.2004.b.tt: "$change_auth_tt$ ['concept_auth_cyber_hive_integrated']\n$unlock_edict_tt$['concept_edict_hive_hyper_stimulants']\n$unlock_edict_tt$['concept_edict_hive_mega_construction']\n$cyber.21.a.end$"
