 situation_cyberization_desc: "Chúng ta sẽ sớm sẵn sàng để cường hóa cơ thể sinh học của mình bằng các bộ phận máy móc. Khả năng xử lý của bộ não và sức mạnh của các chi có thể được gia tăng. Câu hỏi đặt ra là ai sẽ hưởng lợi nhiều nhất từ sự cải tạo này.\n\n§YDân số nhận cấy ghép trong tháng tới§!: §G[From.GetCyberPopsPerMonth]§!"
