 edict_aggregated_memory: "Ký Ức Tập Hợp"
 edict_aggregated_memory_desc: "Ký ức của dân số được đồng hóa của chúng ta tuôn trào như dòng thác lũ. Kinh nghiệm tập thể của họ là công cụ để chúng ta sử dụng."
 edict_choral_harmony: "Hòa Hợp Đồng Ca"
 edict_choral_harmony_desc: "Để sáng tác một bài hát, cần phải có sự hòa âm; hãy để tâm trí của dân số được đồng hóa của chúng ta hợp nhất."
