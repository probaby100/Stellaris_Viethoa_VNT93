 futureshock_chain_title: "Cú Sốc Tương Lai"
 futureshock_chain_desc: "Chúng ta từ chối an phận với những gì tạo hóa ban tặng, thay vào đó nỗ lực vượt qua mọi giới hạn của thể xác sinh học. Việc phân phối cấy ghép quy mô toàn diện của chúng ta chỉ gặp phải những vấn đề nhỏ, tất cả đều có thể dễ dàng giải quyết. Đại đa số người dân đều vô cùng phấn khích trước những gì mà công nghệ cơ thể máy mới mang lại.\n\nChúng ta thực sự đang đứng trước ngưỡng cửa của sự vĩ đại. Những gì diễn ra tiếp theo còn tùy thuộc vào tương lai."

