 auth_cyber_oligarchic_collectivist: "Đầu Sỏ Lao Động Trong Mơ"
 auth_cyber_oligarchic_collectivist_desc: "Những tiến bộ gần đây về công nghệ phần mềm sinh học hữu cơ đã giúp việc điều khiển con người trong giấc ngủ trở nên khả thi. Các đường truyền thần kinh của đối tượng được kết nối với máy chủ, truyền các nhiệm vụ tính toán vào não bộ hoặc ra lệnh cho cơ thể họ thực hiện công việc lặp đi lặp lại. Đúng là một \"công việc trong mơ\"."
