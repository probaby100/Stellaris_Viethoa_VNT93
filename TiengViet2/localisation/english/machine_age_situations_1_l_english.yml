# INTEGRATED
 auth_cyber_hive_integrated: "Ý Thức Tổ Ong Tích Hợp"
 auth_cyber_hive_integrated_desc: "Mọi sự lệch lạc đều đã được sửa chữa, mọi sự bất thường bị ngăn chặn, mọi sự chia rẽ được chấn chỉnh. Quyền kiểm soát của Ý Thức Tổ Ong là tuyệt đối: một ý thức chung duy nhất và vô số thể xác để thực thi ý chí đó."
 concept_auth_cyber_hive_integrated: "$auth_cyber_hive_integrated$"
