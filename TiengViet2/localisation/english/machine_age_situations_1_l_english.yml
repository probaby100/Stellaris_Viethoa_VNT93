 gov_neural_chorus: "Hợp Xướng Thần Kinh"
 gov_neural_chorus_desc: "Cho phép sự biến thiên lớn hơn trong tư duy và phạm vi phản ứng cảm xúc rộng hơn tạo điều kiện cho sự ra đời của một 'Hợp Xướng Thần Kinh' - một bài ca vĩ đại của những tâm trí, vừa hùng mạnh vừa đẹp đẽ tuyệt trần."
