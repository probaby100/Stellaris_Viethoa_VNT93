# Traits
 trait_limited_cybernetic: "Cơ Khí Hóa Giới Hạn"
 trait_limited_cybernetic_desc: "Chủng loài này chỉ lắp đặt lượng cấy ghép tối thiểu vừa đủ để có thể sinh hoạt trong một xã hội cơ giới hóa."
 leader_trait_limited_cyborg: "Cyborg Giới Hạn"
 leader_trait_limited_cyborg_desc: "Nhà lãnh đạo này chỉ lắp đặt lượng cấy ghép tối thiểu vừa đủ để có thể làm việc trong một xã hội cơ giới hóa."

