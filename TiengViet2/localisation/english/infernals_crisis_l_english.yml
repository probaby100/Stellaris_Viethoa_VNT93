 entropy_crystals_crisis_level_desc: "Để tiến qua các cấp độ Khủng Hoảng, hãy tích lũy $entropy_crystals$ và xây dựng §Y$galactic_crucible_4$§!."
 entropy_crystals_crisis_level_unlock: "Có £entropy_crystals£ §Y$CURRENCY$§! $entropy_crystals$"
 entropy_crystals_current_value: "Giá trị hiện tại: §Y$VALUE|0$§!"
 entropy_crystals_crisis_description_title: "$ap_galactic_hyperthermia$"
 entropy_crystals_crisis_description: "$menace_crisis_description_intro$\n\nPhương thức thao túng năng lượng hoàn toàn mới sẽ cho phép chúng ta gia tăng sức mạnh vượt bậc. Chúng ta sẽ cần khai thác ngọn lửa của chính các vì sao để thắp sáng kỷ nguyên này."
 entropy_crystals_crisis_howto_title: "Nguồn Sức Mạnh"
 entropy_crystals_crisis_howto: "Thực hiện các §HMục Tiêu Khủng Hoảng§! sẽ tạo ra £entropy_crystals£ §H$entropy_crystals$§!, dùng để nâng cấp $galactic_crucible_4$ và mở khóa Cấp Độ Khủng Hoảng tiếp theo."

