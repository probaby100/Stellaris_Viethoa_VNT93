 personality_hyperthermia_empire_desc: "Một đế chế Nhiệt Trị bị chi phối bởi một hệ tư tưởng tôn sùng năng lượng, entropy và ngọn lửa của các vì sao. Họ không đi xâm lược — họ thiêu đốt và tôi luyện thiên hà bằng nhiệt lượng và ý chí sắt đá."
