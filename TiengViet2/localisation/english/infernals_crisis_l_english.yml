# Weapon
 LENS_FLARE_BEAM: "Tia Tê Liệt Thấu Kính"
 LENS_FLARE_BEAM_DESC: "Chùm tia của vũ khí này được hiệu chỉnh để gây nhiễu loạn các hệ thống điều khiển trọng yếu, tạo ra một khoảng thời gian cơ hội hạn chế cho các đợt tấn công không bị kháng cự."
 lfb_on_hit_stun_tt: "§YVô hiệu hóa§! mục tiêu trong §G7§! ngày, khiến nó không thể di chuyển hoặc bắn trả."
