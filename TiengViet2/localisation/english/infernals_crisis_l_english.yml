# MPerks Level 1
 menp_hyperthermia_crystals: "$entropy_crystals$"
 menp_hyperthermia_crystals_desc: "§Y$entropy_crystals$§! đánh dấu bước đột phá trong việc làm mất ổn định năng lượng có kiểm soát. Với nguồn tài nguyên dễ biến động này trong tay, chúng ta có thể tái định hình lại chính trật tự thiên hà."
 unlocks_entropy_objectives: "Cho phép tích lũy £entropy_crystals£ §Y$entropy_crystals$§! bằng cách hoàn thành các §HMục Tiêu Khủng Hoảng§!."
 menp_hyperthermia_harnessing: "Khai Thác Entropy"
 menp_hyperthermia_harnessing_desc: "Tích hợp quá trình tổng hợp §Y$entropy_crystals$§! vào ngành công nghiệp cho phép sử dụng hiệu quả hơn nguồn tài nguyên bất ổn này, gắn kết trọng tâm kỹ thuật với các mục tiêu chiến lược của chúng ta."
 unlocks_entropy_edict: "§HMở Khóa Sắc Lệnh:§! $edict_entropy_harnessing$"
 menp_hyperthermia_crucible: "Lò Nấu Thiên Hà"
 menp_hyperthermia_crucible_desc: "Lò Nấu được đề xuất này sẽ đóng vai trò như động cơ trung tâm để khai thác entropy từ các vì sao. Với khả năng kết tinh và vận chuyển nó, Lò Nấu có thể trở thành ngọn hải đăng cho sức mạnh rực lửa của chúng ta, lan tỏa khắp ngàn sao."
 unlocks_galactic_crucible: "§H$UNLOCKS_MEGASTRUCTURE$:§! $galactic_crucible_0$"

# MPerks Level 2
 menp_hyperthermia_conc_entropy: "Entropy Đậm Đặc"
 menp_hyperthermia_conc_entropy_desc: "$entropy_conduit_plural$ đóng vai trò sống còn trong việc mở rộng sức mạnh của chúng ta ở giai đoạn này. Việc gia tăng sản lượng của Lò Nấu sẽ đẩy nhanh bước tiến của chúng ta hướng tới một tương lai rực cháy và huy hoàng."
 unlocks_conduit_spawn: "§H$UNLOCKS_SHIP_TYPE$:§! $entropy_conduit$ \n- §Y$entropy_conduit_plural$§! được tạo tự động bởi §Y$galactic_crucible_4$§! và sẽ di chuyển đến các hệ sao lân cận. \n- Các thuộc địa trong hệ sao mục tiêu nhận được hiệu ứng tăng cường. \n- Được trang bị vũ khí £ship_xl_slot£ §Y$LENS_FLARE_BEAM$§!, làm vô hiệu hóa kẻ thù khi bắn trúng trong vài ngày. \n\n"
 menp_hyperthermia_radiant: "Tham Vọng Rạng Rỡ"
 menp_hyperthermia_radiant_desc: "Trở thành tia lửa châm ngòi cả thiên hà đồng nghĩa với việc không có chỗ cho sự do dự hay thói quan liêu. Chúng ta không thể lãng phí thời gian cải tạo vô số hệ sao một cách chậm chạp. Để đạt được mục tiêu, chúng ta phải tăng vọt năng lực xây dựng của mình."
 menp_hyperthermia_ignition: "Cưỡng Chế Kích Hỏa"
 menp_hyperthermia_ignition_desc: "Đôi khi chỉ nỗ lực thôi là chưa đủ. Chúng ta cần đưa công nghệ của mình lên tầm cao mới và khai thác triệt để tiềm năng của nó. Đã đến lúc tối thiểu hóa các cơ chế bảo an và tối đa hóa sản lượng."
 unlocks_crucible_overclocking: "Kích hoạt khả năng 'ép xung' cho §HMô Kết Cấu§! §Y$galactic_crucible_1$§!."

# MPerks Level 3
 menp_hyperthermia_cruiser: "$ember_cruiser$"
 menp_hyperthermia_cruiser_desc: "Được trang bị công nghệ tiên tiến nhất, những chiến hạm này chuyển hóa dòng nhiệt bất ổn định thành sự hủy diệt có định hướng, thiêu rụi kẻ thù thành tro tàn cháy xém."
 unlocks_ember_cruiser: "§H$UNLOCKS_SHIP_TYPE$:§! $ember_cruiser$"
 menp_hyperthermia_flames: "Ngọn Lửa Nhấn Chìm"
 menp_hyperthermia_flames_desc: "Xã hội không tưởng mà chúng ta hình dung không có chỗ cho bất kỳ ai cản đường. Bất cứ kẻ nào dám chống lại sẽ sớm nhận ra rằng sự kháng cự chỉ mang đến một cơn mưa lửa trút xuống quê nhà của chúng."
 unlocks_firestorm_stance: "§HMở Khóa Địa Hóa:§! $pc_volcanic$ \n§HMở Khóa Tư Thế Oanh Tạc:§! $bombardment_firestorm$\n\n"
 menp_hyperthermia_coronal: "Xả Khí Vành Nhật Hoa"
 menp_hyperthermia_coronal_desc: "Các $entropy_conduit_plural$ của chúng ta hiện đang tiêu tán một lượng nhiệt khổng lồ để duy trì sự ổn định. Bằng cách xả lượng nhiệt đó ra không gian xung quanh, chúng ta có thể biến $entropy_conduit_plural$ thành những vũ khí tàn khốc chống lại kẻ thù."
 unlocks_conduit_damage: "§Y$entropy_conduit_plural$§! gây sát thương bị động lên tàu và trạm không gian của kẻ thù. \n\n"

# MPerks Level 4
 menp_hyperthermia_reactors: "Lò Phản Ứng Nhật Hạch"
 menp_hyperthermia_reactors_desc: "Khai thác §Y$entropy_crystals$§! vào công nghệ quân sự sẽ mở khóa các hệ thống động cơ đẩy với sức mạnh vô song. Chiến hạm của chúng ta sẽ xé toạc không gian như những vệt lửa rực rỡ chưa từng có."
 menp_hyperthermia_solarflare: "Bão Nhật Hoa Nhân Tạo"
 menp_hyperthermia_solarflare_desc: "Từng có thời điểm một phần thiên hà nằm ngoài tầm với của chúng ta. Ảo tưởng đó sắp kết thúc rồi. Sớm thôi, các bầy $entropy_conduit_plural$ sẽ phủ kín khắp các vì sao, mang đến sự hủy diệt chính xác cho mọi kẻ dám cản đường."
 unlocks_conduit_borders: "§Y$entropy_conduit_plural$§! sẽ tự động vượt biên giới tiến vào lãnh thổ của kẻ thù. \n\n"
 menp_hyperthermia_armada: "Hạm Đội Rực Lửa"
 menp_hyperthermia_armada_desc: "Khi thiên hà bắt đầu hợp lực chống lại chúng ta, việc tổng động viên là điều tối cần thiết. Mọi công dân lúc này phải góp sức duy trì mặt trận năng lượng, thổi bùng ngọn lửa trỗi dậy của chúng ta."
 unlocks_blazing_navalcap: "§Y[GetAlloyProducerPlural]§! và §Y[GetResearcherPlural]§! tăng £navy_size£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!.\n\n"

# MPerks Level 5
 menp_hyperthermia_battleship: "$ember_battleship$"
 menp_hyperthermia_battleship_desc: "Với những họng pháo nóng rực tựa cơn bão lửa sắp sửa nhấn chìm cả thiên hà, những chiến hạm khổng lồ này sẽ tạo nên lực lượng phòng thủ nòng cốt xung quanh Lò Nấu."
 unlocks_ember_battleship: "§H$UNLOCKS_SHIP_TYPE$:§! $ember_battleship$ \n- Có thể trang bị vũ khí £ship_xl_slot£ §Y$LENS_FLARE_BEAM$§!."
 menp_hyperthermia_critical_mass: "Khối Lượng Tới Hạn"
 menp_hyperthermia_critical_mass_desc: "Gia tăng hoạt động entropy ở lớp vỏ ngoài của ngôi sao khiến nó giải phóng một luồng bức xạ khổng lồ. Điều này làm cho toàn bộ hệ sao nóng lên nhanh chóng hơn."
 unlocks_conduit_boost: "§Y$entropy_conduit_plural$§! trở nên mạnh mẽ hơn tùy thuộc vào số lượng hệ sao đã chiếm lĩnh.\n\n$hyperthermia_map_perc$\n\n"
 hyperthermia_map_perc: "§G20%§! thiên hà: $TABBED_NEW_LINE$- $entropy_conduit_plural$ gây tàn phá lên các thuộc địa lân cận $TABBED_NEW_LINE$- Các thuộc địa bị ảnh hưởng sẽ dần mất đi £pop£ $POPS$ $TABBED_NEW_LINE$- Chỉ ảnh hưởng đến các đế chế thuộc chủng loài không phải §YƯa Nhiệt§! $TABBED_NEW_LINE$- Số hệ sao yêu cầu: §Y[root.hyperthermia_own_systems_var]§!/§Y[root.hyperthermia_systems_var]§!"
 menp_hyperthermia_ammunition: "Đạn Dược Truyền Dẫn"
 menp_hyperthermia_ammunition_desc: "Bước cải tiến trong thiết kế vũ khí: đạn dược tiêu chuẩn nay được tăng cường các lõi entropy vi mô, giải phóng các đợt sóng nhiệt bất ổn khi va chạm. Kết quả là sức công phá được nâng cao rõ rệt."

