 entropy_crystals_desc: "Ma trận thô ráp, lung linh của nguồn năng lượng nguyên sơ này bằng cách nào đó vẫn giữ được sự ổn định, vừa đủ để vận chuyển làm nhiên liệu hoặc gắn vào các trang thiết bị."
 mod_country_base_entropy_crystals_produces_add: "£entropy_crystals£ $entropy_crystals$ mỗi tháng"
 entropy_crystals_crisis_objective: "$menace_crisis_objective$"
