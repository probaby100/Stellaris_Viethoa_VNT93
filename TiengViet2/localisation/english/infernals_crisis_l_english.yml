# Ascension Perk
 ap_galactic_hyperthermia: "Chứng Tăng Nhiệt Thiên Hà"
 ap_galactic_hyperthermia_desc: "Vũ trụ bắt đầu trong biển lửa, nhưng đã nguội lạnh thành một nơi tăm tối và đầy thù địch. Để phát triển rực rỡ, chúng ta cần thổi bùng ngọn lửa, dẫu cho những kẻ khác phải diệt vong."
 must_be_infernals: "$TRIGGER_FAIL$Yêu cầu toàn bộ dân cư của chúng ta phải là loài Ưa Nhiệt."

