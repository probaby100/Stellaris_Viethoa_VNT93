# Objectives
 crisobj_own_volcanics_name: "Sở Hữu Thế Giới Núi Lửa"
 crisobj_own_volcanics_desc: "Nhiệt lượng hệ sao gia tăng thúc đẩy hoạt động núi lửa bùng nổ, rất lý tưởng để đẩy mạnh sứ mệnh rực lửa của chúng ta. Chúng ta nên ưu tiên thuộc địa hóa các §YThế Giới Núi Lửa§! để dẫn đầu.\n\nCung cấp thu nhập §Y$entropy_crystals$§! thụ động mỗi năm, tăng dần theo số lượng thuộc địa §Y$pc_volcanic$§!."
 crisobj_create_volcanics_name: "Tạo Ra Thế Giới Núi Lửa"
 crisobj_create_volcanics_desc: "Lan tỏa hoạt động núi lửa hành tinh khắp thiên hà sẽ tiếp thêm nhiên liệu cho nền kinh tế Tinh Thể Entropy. Với các kỹ thuật địa hóa chuẩn xác, chúng ta có thể kích hoạt hoạt động núi lửa bền vững ở bất kỳ nơi nào ta chọn.\n\nĐịa hóa một hành tinh thành §Y$pc_volcanic$§!"
 crisobj_own_red_stars_name: "Sở Hữu Sao Đỏ"
 crisobj_own_red_stars_desc: "Chúng ta nên ưu tiên hoạt động trong các hệ sao quanh những ngôi sao đỏ. Bề mặt phát xạ rộng lớn của chúng là môi trường lý tưởng để thu hoạch nhiệt năng.\n\nCung cấp thu nhập §Y$entropy_crystals$§! thụ động mỗi tháng, tăng dần theo mỗi §Y$pc_m_star$§! hoặc §Y$pc_m_giant_star$§! trong các hệ sao ta kiểm soát."
 crisobj_create_red_stars_name: "Tạo Ra Sao Đỏ"
 crisobj_create_red_stars_desc: "Bằng cách dẫn truyền Tinh Thể Entropy, chúng ta có thể thổi phồng các ngôi sao thành Sao Khổng Lồ Đỏ, tiếp thêm sức mạnh cho sự trỗi dậy của đế chế rực lửa mới.\n\nCác ngôi sao được cải tạo bởi §Y$entropy_conduit_plural$§! sẽ trở thành §Y$pc_m_giant_star$§!"
 crisobj_planet_firestorm_name: "Hỏa Hoạn Hành Tinh"
 crisobj_planet_firestorm_desc: "Đã đến lúc dạy cho các đối thủ bài học về ý nghĩa thực sự của quyền tối thượng, bằng một trận oanh tạc bão lửa sẽ biến thế giới của chúng thành tro tàn vụn vỡ.\n\nOanh tạc một thuộc địa bằng §Y$bombardment_firestorm$§! để gây ra §R100% tàn phá§!"
 crisobj_lens_beam_impact_name: "Gây Nhiễu Loạn Chiến Hạm"
 crisobj_lens_beam_impact_desc: "Các thế giới băng giá và ôn đới chẳng có ích gì cho chúng ta. Chúng ta phải tái định hình chúng, bằng cách nung chảy bề mặt thành những dạng phù hợp hơn với nhu cầu của mình.\n\nSử dụng vũ khí £ship_xl_slot£ §Y$LENS_FLARE_BEAM$§!, được trang bị trên §Y$entropy_conduit_plural$§! và §Y$ember_battleship_plural$§!, để oanh tạc các thế giới của kẻ thù."
 crisobj_entropy_starbase_name: "Sở Hữu Máy Ly Tâm Trọng Lực"
 crisobj_entropy_starbase_desc: "Máy Ly Tâm Trọng Lực sẽ giúp chúng ta thu thập thêm $entropy_crystals$. \n\nXây dựng công trình căn cứ sao §Y$sm_gravitational_centrifuge$§! trong các hệ sao §Yđa sao§! hoặc §Y$pc_black_hole$§!."

