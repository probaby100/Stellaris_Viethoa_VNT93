 sm_gravitational_centrifuge_desc: "Cấu trúc này lợi dụng gradient trọng lực cực mạnh để xé toạc các vật liệu phế thải ở cấp độ phân tử, tạo ra một plasma entropy có thể kết tinh để sử dụng tiếp."
