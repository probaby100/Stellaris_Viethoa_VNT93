# Conduit Starforming
 crisis_conduit_buff: "Giám Sát Tinh Cầu"
 crisis_conduit_buff_desc: "Bầu khí quyển của ngôi sao địa phương đang trải qua những biến động nhanh chóng, gây ra một đợt bão nhật hoa rực lửa quét qua toàn hệ sao. Dù đây là thảm họa với những kẻ khác, nhưng lại là điều kiện hoàn hảo để chúng ta sinh sôi thịnh vượng."
 TERRAFORM_ORDER: "Cải Tạo Sao"
 TERRAFORM_ORDER_DESC: "Sẽ từ từ biến ngôi sao mục tiêu thành một §Y$pc_m_giant_star$§!.\n\n$TERRAFORM_ORDER_CLICK_DESC$"
 TERRAFORM_ORDER_RESEARCH: "Bằng cách tận dụng tiềm năng năng lượng tích lũy của Tinh Thể Entropy, các ngôi sao nhỏ hơn có thể được kích phát nở rộng thành các Sao Khổng Lồ Đỏ hùng vĩ."
 FLEETORDER_TERRAFORM_BUTTON: "$TERRAFORM_ORDER$"
 FLEETORDER_TERRAFORM: "Đang Rèn Sao $PLANET|Y$ ($PROGRESS|Y%0$)"
 FLEETORDER_BOOST_STAR: "Kích Hỏa Sao"
 CAN_NOT_TERRAFORM_STAR: "$TRIGGER_FAIL$Phải là ngôi sao chính."
 CAN_NOT_CRISIS_TERRAFORM_STAR_CLASS: "$TRIGGER_FAIL$Loại sao không hợp lệ để cải tạo."
