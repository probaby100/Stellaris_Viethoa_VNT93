 synth_planet_paranoia:0 "Chứng Hoang Tưởng Synth"
 synth_planet_paranoia_desc:0 "Mức độ hoang tưởng rất cao đang bao trùm thế giới này liên quan đến những kẻ thâm nhập Synth. Một số người tin rằng toàn bộ các quan chức chính phủ đều đã bị chúng thay thế."
