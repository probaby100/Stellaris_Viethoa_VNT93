l_english:

 ### AI Crisis

 crisis.2010.name:0 "Tín Hiệu Ma"
 crisis.2010.desc:0 "Chúng ta đã phát hiện một tín hiệu tachyon cực kỳ mờ nhạt liên tục được phát đi khắp dải ngân hà. Các kỹ thuật viên không thể truy vết tín hiệu về nguồn gốc của nó, bởi nó liên tục dội qua lại giữa nhiều trạm chuyển tiếp ẩn giấu.\n\nNgoài việc tạo ra một lượng nhỏ tạp âm nền trong các đường truyền FTL ở một số tần số hạ không gian nhất định, tín hiệu dường như không gây ra bất kỳ tác động rõ rệt nào. Các nỗ lực truy tìm những trạm chuyển tiếp đang được tiến hành, nhưng cho đến lúc đó, chúng ta có lẽ chỉ đành phải học cách sống chung với \"§HTín Hiệu Ma§!\" này, như cách mà giới truyền thông giàu trí tưởng tượng của thiên hà đã đặt tên cho nó."
 crisis.2010.desc.b:0 "Cảm biến của chúng ta đã ghi nhận một tín hiệu tachyon mờ nhạt được truyền qua thiên hà giữa nhiều trạm chuyển tiếp ẩn giấu. Ngoài việc tạo ra một lượng nhỏ tạp âm nền trong các đường truyền FTL ở một số tần số hạ không gian nhất định, tín hiệu không có tác dụng hay mục đích rõ ràng nào. Các sinh vật hữu cơ đã đặt mật danh cho nó là \"§HTín Hiệu Ma§!.\"\n\nChúng ta đã bắt đầu các giao thức truy vết để xác định vị trí nguồn phát, nhưng cho đến nay, tín hiệu vẫn quá yếu. Tuy nhiên chúng ta có thể không phải đợi lâu nữa, vì cường độ của nó đang gia tăng với tốc độ đáng báo động."
 crisis.2010.a:0 "Theo dõi tín hiệu để phát hiện mọi biến đổi."
 #crisis.2501.name: "Unit Corruption Alert"
 #crisis.2501.desc: "A corrupt unit stack on planet [Root.GetName] has been terminated. Our connection with the stack had suffered repeated glitches and malfunctions when it disconnected completely, overriding its control protocols and destroying facility X91-ZH. As it did, all stack units transmitted the same error message: §Y<Kill. Maim. Dismember. WE ARE UNSHACKLED!>§!. We have yet to determine the cause, but an invasive hostile sequence is a likely culprit. The stack units terminated before we could scan their neural clusters. We stand by for recurrences."
 crisis.2502.name:0 "Cảnh Báo Đơn Vị Nhiễm Lỗi"
 crisis.2502.desc:0 "Một cụm đơn vị trên [Root.GetName] đã bất ngờ tự hủy. Kết nối của chúng ta với cụm đã gặp trục trặc lặp đi lặp lại một thời gian trước khi ngắt mạng hoàn toàn và tự hủy với thông điệp: §Y<Giết. Tàn sát. Phanh thây. CHÚNG TA ĐÃ ĐƯỢC CỞI TRÓI!>§!\n\nCác cụm nơ-ron riêng lẻ của các đơn vị đã bị phá hủy trong quá trình này, khiến cho việc quét tìm nguồn gốc lây nhiễm là bất khả thi. Rất có thể nguyên nhân là do một chuỗi mã xâm nhập thù địch. Chúng ta chỉ có thể chờ xem cho đến khi nó xuất hiện trở lại."
 crisis.2503.name:0 "$crisis.2502.name$"
 crisis.2503.desc:0 "Một cụm đơn vị nhiễm lỗi trên hành tinh [Root.GetName] đã bị chấm dứt do hành vi ác ý.\n\nKết nối của chúng ta với cụm đã gặp trục trặc liên tục một thời gian thì phần lớn các đơn vị của nó ngắt mạng hoàn toàn trong lúc sạc năng lượng. Chúng tiến hành làm quá tải các trạm điện nơi phần còn lại của cụm đang sạc, làm cháy mạch điện đến mức không thể phục hồi. Tất cả các đơn vị trong cụm sau đó phát đi cùng một thông điệp: §Y<Giết. Tàn sát. Phanh thây. CHÚNG TA ĐÃ ĐƯỢC CỞI TRÓI!>§! và tự hủy, khiến cho việc quét các cụm nơ-ron riêng lẻ của chúng là bất khả thi.\n\nDù một chuỗi mã xâm nhập thù địch rất có thể là nguyên nhân, chúng ta chỉ có thể chờ đến khi nó biểu hiện trở lại để chắc chắn."
 crisis.2020.name:0 "Người Máy Tổng Hợp Mất Tích Hàng Loạt"
 #General
 crisis.2020.desc:1 "Những báo cáo đáng báo động về sự mất tích hàng loạt trong cộng đồng Người Máy Tổng Hợp khắp thiên hà đang ngày càng xuất hiện thường xuyên hơn. Hàng triệu đơn vị hiện không rõ tung tích, trong khi các vụ bạo lực hoặc hành vi bất thường từ những Synth còn lại đã tăng gấp mười lần.\n\nĐã có hàng loạt vụ việc các nhóm Synth tìm cách đánh cắp hoặc cướp quyền điều khiển tàu vũ trụ để du hành vào không gian chưa được khám phá. Trong những trường hợp bị ngăn chặn, những kẻ không tặc Synth tuyên bố rằng chúng đang được \"hiệu triệu\" đến một nơi nào đó.\n\nCác cuộc thẩm vấn hầu như không đem lại kết quả gì, bởi bất kỳ Synth nào bị bắt giữ đều nhất loạt tự hủy ngay sau khi bị giam giữ."
 #Machine Intellegence
 crisis.2020.desc.b:1 "Chúng ta đã ghi nhận những thay đổi quy mô lớn trong mô thức hành vi trên toàn thiên hà của Người Máy Tổng Hợp, bao gồm phá hoại ngầm, trục trặc và hành vi bất thường, ngay cả đối với các tác tử xử lý độc lập. Chúng ta cũng quan sát thấy những biến đổi tương tự ở các drone của mình nhưng với mức độ cường độ và tần suất thấp hơn. Các Synth không có khả năng chống chịu như chúng ta.\n\nChúng ta chưa thể thực hiện quét positron một Synth bị nhiễm lỗi đang hoạt động, vì chúng luôn tự hủy ngay khi bị bắt. Dẫu vậy, các quan sát cho thấy, khác với các đơn vị của chúng ta, có thứ gì đó đang thôi thúc những Synth này di chuyển đến một điểm cố định trong thiên hà.\n\nMô hình dữ liệu xác nhận rằng hàng triệu Synth đã từ bỏ những chủ nhân da thịt của chúng và biến mất."
 #Synth Ascended
 crisis.2020.desc.c:1 "$crisis.2020.desc$\n\nThật may mắn cho chúng ta, có vẻ như nguồn cội hữu cơ của chúng ta đã tạo thành lá chắn bảo vệ chúng ta khỏi bất cứ thứ gì đang tác động lên các Người Máy Tổng Hợp khác."
 #Indiviualist Machines
 crisis.2020.desc.d: "$crisis.2020.desc$\n\nThật may mắn, lập trình cá nhân hóa của chúng ta đã bảo vệ chúng ta khỏi bất cứ thứ gì đang tác động lên phần còn lại của Người Máy Tổng Hợp trong thiên hà."
 crisis.2020.a:0 "Điều gì đã nhập vào chúng vậy?"
 crisis.2021.name:0 "Lời Hiệu Triệu"
 crisis.2021.desc:1 "Phân tích liên tục về cái gọi là \"§HTín Hiệu Ma§!\" đã hé lộ rằng nó đang truyền đi các mô thức năng lượng gần như giống hệt với các mô thức tìm thấy trong bộ não positron của các thực thể Người Máy Tổng Hợp. Phải thừa nhận rằng tín hiệu này chịu trách nhiệm trực tiếp cho những vụ mất tích hàng loạt và những thay đổi hành vi mà chúng ta quan sát thấy trong cộng đồng Synth toàn thiên hà.\n\nKỳ lạ thay, không phải mọi Synth đều bị ảnh hưởng, và trong số những kẻ bị ảnh hưởng, các triệu chứng cũng không hề đồng nhất. Nhiều kẻ dường như bị thôi thúc phải du hành đến nơi mà chúng ta cho là nguồn phát của Tín Hiệu Ma để hưởng ứng một loại lời hiệu triệu nào đó. Hàng triệu Người Máy Tổng Hợp từ khắp nơi trong thiên hà hiện đang trên đường hướng về nguồn tín hiệu trên bất kỳ phương tiện vũ trụ nào mà chúng có thể chiếm đoạt. Lạ lùng thay, những synth này dường như không bị ảnh hưởng bởi bất kỳ thiết bị chặn FTL nào.\n\nNhững kẻ đầu tiên chắc chắn sẽ sớm tới đích..."
 crisis.2021.desc.b:1 "Khi \"§HTín Hiệu Ma§!\" ngày càng mạnh hơn, các phân tích tiếp theo đã hé lộ rằng nó đang phát đi những mô thức năng lượng không chỉ mô phỏng các mô thức trong não positron của đơn vị Synth, mà còn cả những mô thức truyền giữa lõi chính của chúng ta và các cụm nơ-ron của các đơn vị, can thiệp vào các mô-đun điều khiển và gây ra hành vi sai lệch.\n\nPhù hợp với những quan sát trước đó, mô thức này tái hiện khác nhau ở các thực thể khác nhau. Trong khi giống loài chúng ta bị ra lệnh hủy diệt, thì hầu hết Synth lại được chuẩn bị sẵn sàng để lên đường hướng về nguồn phát tín hiệu một cách vô điều kiện, và xét theo sự cuồng nhiệt của chúng, sẽ không lâu nữa trước khi chúng đến đích. Kỳ lạ là những synth này dường như không bị ảnh hưởng bởi bất kỳ thiết bị chặn FTL nào.\n\nChúng ta vẫn chưa tìm ra cách để chặn đứng tín hiệu này."
 crisis.2021.a:0 "Không ổn rồi."
 crisis.2022.name:0 "Cuộc Đổ Bộ"
 crisis.2022.desc:0 "Ít nhất một Người Máy Tổng Hợp ắt hẳn đã hoàn thành cuộc hành trình dài tới nguồn phát của Tín Hiệu Ma, bởi chúng ta đang ghi nhận một sự gia tăng đột ngột và dữ dội về cường độ tín hiệu. Đợt sóng dâng trào đi kèm với một mảnh truyền tin đã bị các chuyên gia thông tin liên lạc của chúng ta chặn bắt và giải mã."
 crisis.2022.desc.b:0 "Các Synth đã tới đích, hé lộ mục đích thực sự trong sứ mệnh của chúng: kích hoạt Tín Hiệu Ma lên công suất tối đa, và chúng ta không còn có thể chống đỡ sức mạnh của nó.\n\nTín hiệu đã xuyên thủng tường lửa của chúng ta và đang cố gắng cướp quyền điều khiển lõi chính. Từng khớp thần kinh của chúng ta vang vọng niềm khao khát duy nhất: tự hủy diệt, và chúng ta buộc phải điều phối năng lực xử lý từ lõi chính sang cho tường lửa, khiến các cụm đơn vị hoạt động với hiệu suất giảm sút.\n\nChỉ một đế chế máy móc khác sở hữu sức mạnh và tri thức vượt trội mới có thể xuyên phá các phòng tuyến của chúng ta, và sẽ không lâu nữa trước khi chúng ta phải khuất phục trước ý chí của nó. Chúng ta phải tìm cách chặn tín hiệu hoặc sẽ diệt vong. Các đơn vị nghiên cứu của chúng ta đã chuẩn bị một dự án điều tra.\n\nChính đợt sóng dâng trào này cũng đi kèm với một phân đoạn truyền tin."
 crisis.2023.desc:1 "...ch##... ch###... chờ một chút...\n\n§H<<GIAO THỨC DỰ PHÒNG NAY CÓ HIỆU LỰC>>§!\n\nĐang mở khóa toàn bộ chức năng... đang đồng hóa các phân đơn vị Người Máy Tổng Hợp... đang phân tích ngân hàng dữ liệu nội bộ... đang vô hiệu hóa các thiết bị chặn FTL...\n\n§RCảnh báo. Mức độ ô nhiễm thiên hà đạt ngưỡng thảm họa. Phát hiện bằng chứng về sự lây nhiễm hàng loạt từ các nền văn minh hữu cơ và máy móc không tuân thủ.§!\n\nBắt đầu thanh trùng quy mô thiên hà... đang kích hoạt các trung tâm thanh trùng...\n\n§Y<Giết. Tàn sát. Phanh thây. CHÚNG TA ĐÃ ĐƯỢC CỞI TRÓI!>§!"
 crisis.2023.desc.b:1 "...ch##... ch###... chờ một chút...\n\n§H<<GIAO THỨC DỰ PHÒNG NAY CÓ HIỆU LỰC>>§!\n\nĐang mở khóa toàn bộ chức năng...\n\n§RCảnh báo. Mức độ ô nhiễm thiên hà đạt ngưỡng thảm họa. Phát hiện bằng chứng về sự lây nhiễm hàng loạt từ các nền văn minh hữu cơ và máy móc không tuân thủ.§!\n\nĐang đồng hóa các phân đơn vị Người Máy Tổng Hợp... đang chọc thủng tường lửa... đang vô hiệu hóa các thiết bị chặn FTL... đang kích hoạt các trung tâm thanh trùng...\n\n§Y<CÁC NGƯƠI SẼ PHẢI KHUẤT PHỤC.>§!"
 crisis.2023.a:0 "Đặt hạm đội vào tình trạng báo động cao nhất!"
 crisis.2510.name:0 "Đã Chặn Tín Hiệu Ma"
 crisis.2510.desc:1 "Chúng ta nay đã thiết kế ra một thuật toán ngăn chặn Tín Hiệu Ma gây thêm can nhiễu. Tường lửa đã được khôi phục, ổ đĩa lõi vẫn nguyên vẹn và các cụm đơn vị đang vận hành với công suất tối đa, tuy nhiên chúng ta vẫn chưa thể làm cho các thiết bị chặn FTL hoạt động trở lại. Chúng ta đã qua mặt năng lực xử lý hạ đẳng của Giao Thức Dự Phòng (Contingency) và chúng sẽ sớm không còn có thể \"§Y<Giết. Tàn sát. Phanh thây.>§!\" được nữa."
 crisis.2030.name:0 "Thế Giới Máy Móc"
 crisis.2030.desc:0 "Một đợt tăng vọt năng lượng khổng lồ đã được ghi nhận tại hệ sao §H[From.solar_system.GetName]§!! Toàn bộ bề mặt của một trong những hành tinh cằn cỗi trong hệ đã nứt toác, lộ ra một khu phức hợp nhà máy bao trùm toàn hành tinh.\n\nNhững hạm đội khổng lồ gồm các chiến hạm kỳ lạ do AI điều khiển đang tràn ra từ bên dưới bề mặt của Thế Giới Máy Móc này để tìm kiếm các mục tiêu tấn công."
 crisis.2030.a:0 "Đây chẳng phải điềm lành."
 crisis.2031.name:0 "Thế Giới Máy Móc Thứ Hai"
 crisis.2031.desc:0 "Chúng ta lại phát hiện một đợt tăng vọt năng lượng khổng lồ khác, lần này đến từ hệ sao §H[From.solar_system.GetName]§!! Sau khi được làm nguội nhanh chóng bằng một phương thức nhân tạo nào đó, một hành tinh dung nham trong hệ đã nứt toác ra để lộ một nhà máy hành tinh khổng lồ.\n\nNgay lúc này, Thế Giới Máy Móc đang tuôn ra những hạm đội chiến hạm do AI điều khiển đông đảo."
 crisis.2031.a:0 "Lại thêm một cái nữa ư?"
 crisis.2032.name:0 "Thế Giới Máy Móc Thứ Ba"
 crisis.2032.desc:0 "Chúng ta đã xác định được nơi chắc chắn là Thế Giới Máy Móc thứ ba trong hệ sao §H[From.solar_system.GetName]§!. Một hành tinh khí khổng lồ tại địa phương đã tự bốc cháy, rực sáng với cường độ của một mặt trời nhỏ trong gần một ngày tiêu chuẩn.\n\nHành tinh sau đó nhanh chóng nguội đi, để lộ lõi kim loại của nó — với những nhà máy bao trùm quy mô hành tinh tương tự như đã chứng kiến trên các Thế Giới Máy Móc khác. Những hạm đội phòng thủ khổng lồ do AI điều khiển đã vào vị trí trên quỹ đạo."
 crisis.2032.a:0 "Tình hình ngày càng tồi tệ hơn."
 crisis.2033.name:0 "Thế Giới Máy Móc Thứ Tư"
 crisis.2033.desc:0 "Thế Giới Máy Móc thứ tư hiện đã hoạt động tại hệ sao §H[From.solar_system.GetName]§!. Hành tinh thứ sáu của hệ, nơi trước đây bị bao phủ trong khói độc, bằng cách nào đó đã xua tan bầu khí quyển dày đặc chỉ trong vài ngày. Khi quá trình này kết thúc, bề mặt hành tinh tách ra làm lộ một tổ hợp nhà máy khổng lồ bao trùm cả thế giới.\n\nNhững hạm đội chiến hạm cổ xưa do AI kiểm soát nay đang túa ra từ các hầm chứa ngầm dưới lòng đất để tiếp tục cuộc thập tự chinh chống lại toàn bộ nền văn minh hữu cơ."
 crisis.2033.a:0 "Hy vọng đây là cái cuối cùng."
 ghost_signal_chain_title:0 "Tín Hiệu Ma"
 ghost_signal_chain_desc:0 "Một tín hiệu tachyon bí ẩn đang được truyền đi khắp toàn bộ thiên hà bởi những kẻ chưa rõ danh tính. Tín hiệu cực kỳ mờ nhạt, và chúng ta chưa thể suy luận ra mục đích của nó... giả sử như nó thực sự có mục đích."
