 crisis.2036.name:0 "Trái Tim Của Contingency"
 crisis.2036.desc:0 "Với việc phá hủy cả bốn Thế Giới Máy Móc, các nhà khoa học đã suy luận ra điểm khởi nguồn của Tín Hiệu Ma. Nó phát ra từ §HCX-9881§!, một hệ sao chưa từng được lập hải đồ nằm ở rìa thiên hà.\n\nĐây ắt hẳn là nơi mà tất cả Người Máy Tổng Hợp bị tín hiệu chi phối đã tìm đến. Giao Thức Dự Phòng vẫn sẽ là một mối đe dọa chừng nào hệ sao cuối cùng này chưa được giải quyết."
 crisis.2036.desc.b:0 "Với việc phá hủy cả bốn Thế Giới Máy Móc, chúng ta đã suy luận ra điểm khởi nguồn của Tín Hiệu Ma. Nó phát ra từ §HCX-9881§!, một hệ sao chưa từng được lập hải đồ nằm ở rìa thiên hà.\n\nĐây ắt hẳn là nơi mà tất cả những Người Máy Tổng Hợp bị nhiễm lỗi đã tìm đến. Giao Thức Dự Phòng vẫn sẽ là một mối đe dọa chừng nào hệ sao cuối cùng này chưa được giải quyết."
 crisis.2036.a:0 "Phải vô hiệu hóa nó."
 crisis.2037.name:0 "Thế Giới Máy Móc Bị Phá Hủy"
 crisis.2037.desc:0 "§H[From.GetName]§!, Thế Giới Máy Móc trong hệ sao [From.solar_system.GetName], đã bị tiêu diệt. Sau khi hứng chịu trận oanh kích quỹ đạo dữ dội, Lõi AI của hành tinh đã tự hủy để tránh bị đánh chiếm bằng cách kích nổ một thiết bị phản vật chất khổng lồ giấu sâu dưới bề mặt.\n\nVới sự hủy diệt của hành tinh này, Tín Hiệu Ma đã mất đi một trạm chuyển tiếp quan trọng và cường độ của nó đã suy giảm đáng kể.\n\nNgoài ra, vụ nổ trên hành tinh đã làm phát tán những mỏ \"§HKim Loại Sống§!\" lớn trên khắp bề mặt của nó. Vật liệu kỳ lạ này sở hữu nhiều đặc tính độc nhất vô nhị, và nó được Contingency sử dụng trong việc chế tạo tất cả các dạng thức chiến tranh và nhà máy của chúng."
 crisis.2037.desc.b:0 "§H[From.GetName]§!, Thế Giới Máy Móc thù địch trong hệ sao [From.solar_system.GetName], đã bị tiêu diệt. Sau khi hứng chịu trận oanh kích quỹ đạo dữ dội, Lõi AI của hành tinh đã tự hủy để tránh bị đánh chiếm, bằng cách kích nổ một thiết bị phản vật chất khổng lồ giấu sâu dưới bề mặt.\n\nVới sự hủy diệt của hành tinh này, Tín Hiệu Ma đã mất đi một trạm chuyển tiếp quan trọng và cường độ của nó đã suy giảm đáng kể.\n\nNgoài ra, vụ nổ trên hành tinh đã làm phát tán những mỏ \"§HKim Loại Sống§!\" lớn trên khắp bề mặt của nó. Vật liệu kỳ lạ này sở hữu nhiều đặc tính độc nhất vô nhị, và nó được Contingency sử dụng trong việc chế tạo tất cả các dạng thức chiến tranh và nhà máy của chúng."
 crisis.2037.a:0 "Một chiến thắng cho toàn thể thiên hà."
 crisis.2037.alt.desc:0 "$crisis.2037.alt.desc.pt1$\n\nVới việc mất đi thêm một trạm chuyển tiếp nữa, Tín Hiệu Ma lại càng suy yếu hơn."
 crisis.2037.alt.desc.pt1:0 "Lại thêm một Thế Giới Máy Móc nữa bị phá hủy! §H[From.GetName]§! trong hệ sao [From.solar_system.GetName] đã phát nổ sau khi các tuyến phòng thủ của hành tinh bị quét sạch trong trận chiến. Như lần trước, Lõi AI đã kích hoạt cơ chế tự hủy để tránh bị bắt giữ."
 crisis.2037.alt.machine.desc:0 "$crisis.2037.alt.desc.pt1$\n\nVới việc mất đi thêm một trạm chuyển tiếp nữa, Tín Hiệu Ma đã trở nên yếu đến mức chúng ta có thể chặn đứng nó hoàn toàn. Tường lửa đã được phục hồi, ổ đĩa lõi vẫn nguyên vẹn và các cụm đơn vị của chúng ta đang vận hành hết công suất. Chúng ta đã vượt mặt năng lực xử lý hạ đẳng của Contingency và chúng sẽ sớm không còn có thể \"§Y<Giết. Tàn sát. Phanh thây.!>§!\" được nữa."
 crisis.2037.alt.cracked.desc:0 "§H[From.GetName]§!, Thế Giới Máy Móc trong hệ sao [From.solar_system.GetName], đã phải hứng chịu sức mạnh khủng khiếp từ tia phá hủy hành tinh của Siêu Vũ Khí Colossus. Vũ khí này đã cắt xuyên qua bề mặt bọc giáp kiên cố của hành tinh một cách dễ dàng, kích nổ lõi của nó và bốc hơi các nhà máy chiến tranh ngầm của Contingency.\n\nVới sự hủy diệt của hành tinh này, Tín Hiệu Ma đã mất đi một trạm chuyển tiếp quan trọng và cường độ của nó đã suy giảm đáng kể."
 crisis.2037.alt.shielded.desc:0 "§H[From.GetName]§!, Thế Giới Máy Móc trong hệ sao [From.solar_system.GetName], đã bị phong tỏa bên trong một lá chắn năng lượng bất khả xâm phạm bởi Colossus. Bị cắt đứt vĩnh viễn khỏi phần còn lại của Contingency, Lõi AI của hành tinh dường như đã rơi vào trạng thái ngủ đông. Nó sẽ không còn là mối đe dọa nữa.\n\nVới việc vô hiệu hóa hành tinh này, Tín Hiệu Ma đã mất đi một trạm chuyển tiếp quan trọng và cường độ của nó đã suy giảm đáng kể."
 crisis.2037.alt.godray.desc:0 "§H[From.GetName]§!, Thế Giới Máy Móc trong hệ sao [From.solar_system.GetName], đã bị vô hiệu hóa. Sau khi bị rọi chiếu bởi luồng ánh sáng thần thánh từ Colossus, Lõi AI của hành tinh đã tự hủy trước khi các hệ thống cuối cùng sụp đổ, bằng cách kích nổ một thiết bị phản vật chất khổng lồ giấu sâu dưới bề mặt. Nó sẽ không còn là mối đe dọa nữa.\n\nVới việc vô hiệu hóa hành tinh này, Tín Hiệu Ma đã mất đi một trạm chuyển tiếp quan trọng và cường độ của nó đã suy giảm đáng kể."
 crisis.2038.name:0 "Sự Tàn Lụi Của Contingency"
 crisis.2038.desc:0 "Giao Thức Dự Phòng (The Contingency) đã thất bại. Với việc phá hủy Thế Giới Máy Móc cuối cùng, thiên hà không còn phải đối mặt với mối đe dọa tuyệt chủng hàng loạt có hệ thống nữa. Tất cả các dạng thức chiến tranh còn sống sót của Contingency hoặc đã tắt nguồn hoặc tự hủy, và Tín Hiệu Ma không còn được phát đi nữa.\n\nCũng như các Thế Giới Máy Móc khác, nút mạng trung tâm đã tự kích nổ trong một vụ nổ phản vật chất khổng lồ khi nhận thấy không còn khả năng kháng cự những kẻ tấn công. Di chuyển ra ngoài với vận tốc ánh sáng, luồng sáng dữ dội từ đợt phóng thích năng lượng sẽ được các thế hệ mai sau chiêm ngưỡng trong hàng thiên niên kỷ tới như một ngôi sao rực rỡ nhưng ngắn ngủi.\n\nTrên khắp thiên hà, các sinh mệnh có tri giác đang cùng nhau ăn mừng chiến thắng vĩ đại này. Ít nhất là vào lúc này, tương lai trông thật tươi sáng."
 crisis.2038.cracker.desc:0 "Giao Thức Dự Phòng (The Contingency) đã thất bại. Với việc phá hủy Thế Giới Máy Móc cuối cùng, thiên hà không còn phải đối mặt với mối đe dọa tuyệt chủng hàng loạt có hệ thống nữa. Tất cả các dạng thức chiến tranh còn sống sót của Contingency hoặc đã tắt nguồn hoặc tự hủy, và Tín Hiệu Ma không còn được phát đi nữa.\n\nNút mạng trung tâm đã bị bốc hơi bởi tia phá hủy hành tinh từ Colossus, làm vỡ tan toàn bộ hành tinh. Di chuyển ra ngoài với vận tốc ánh sáng, luồng sáng dữ dội từ đợt phóng thích năng lượng sẽ được các thế hệ mai sau chiêm ngưỡng trong hàng thiên niên kỷ tới như một ngôi sao rực rỡ nhưng ngắn ngủi.\n\nTrên khắp thiên hà, các sinh mệnh có tri giác đang cùng nhau ăn mừng chiến thắng vĩ đại này. Ít nhất là vào lúc này, tương lai trông thật tươi sáng."
 crisis.2038.shield.desc:0 "Giao Thức Dự Phòng (The Contingency) đã thất bại. Với việc vô hiệu hóa Thế Giới Máy Móc cuối cùng, thiên hà không còn phải đối mặt với mối đe dọa tuyệt chủng hàng loạt có hệ thống nữa. Tất cả các dạng thức chiến tranh còn sống sót của Contingency hoặc đã tắt nguồn hoặc tự hủy, và Tín Hiệu Ma không còn được phát đi nữa.\n\nBị phong tỏa bên trong một lá chắn năng lượng bất khả xâm phạm bởi Colossus, nút mạng trung tâm không còn có thể gây ảnh hưởng đến các sự kiện bên ngoài. Vì lợi ích của các thế hệ tương lai, chúng ta chỉ có thể hy vọng lá chắn sẽ đứng vững... nhưng hiện tại, ít nhất, hành tinh bị phong tỏa sẽ đóng vai trò như một đài tưởng niệm cho sự sụp đổ của Contingency.\n\nTrên khắp thiên hà, các sinh mệnh có tri giác đang cùng nhau ăn mừng chiến thắng vĩ đại này. Ít nhất là vào lúc này, tương lai trông thật tươi sáng."
 crisis.2038.godray.desc:0 "Giao Thức Dự Phòng (The Contingency) đã thất bại. Với việc phá hủy Thế Giới Máy Móc cuối cùng, thiên hà không còn phải đối mặt với mối đe dọa tuyệt chủng hàng loạt có hệ thống nữa. Tất cả các dạng thức chiến tranh còn sống sót của Contingency hoặc đã tắt nguồn hoặc tự hủy, và Tín Hiệu Ma không còn được phát đi nữa.\n\nNút mạng trung tâm đã phải hứng chịu tia cưỡng chế thần thánh từ Colossus, kích hoạt cơ chế tự hủy từ Lõi AI. Di chuyển ra ngoài với vận tốc ánh sáng, luồng sáng dữ dội từ đợt phóng thích năng lượng sẽ được các thế hệ mai sau chiêm ngưỡng trong hàng thiên niên kỷ tới như một ngôi sao rực rỡ nhưng ngắn ngủi.\n\nTrên khắp thiên hà, các sinh mệnh có tri giác đang cùng nhau ăn mừng chiến thắng vĩ đại này. Ít nhất là vào lúc này, tương lai trông thật tươi sáng."
 crisis.2038.a:0 "Đây là một ngày trọng đại cho thiên hà."
 crisis.2039.desc:0 "Lỗi nghiêm trọng. Mất kết nối tới toàn bộ Trung Tâm Thanh Trùng. Đang cố gắng kết nối lại... xin chờ...\n\n§Y<X-X-Xin chú ý. Giao thức Contingency vẫn đang có hiệu lực, bất chấp những trở ngại/chậm trễ/trục trặc gần đây. Không được tiếp cận CX-9881.§! §RĐỪNG. CÓ. TIẾP CẬN.§!\n\n§YChúng ta đang tái đánh giá các phương án chiến lược. Mọi nỗ lực phá rối tiến trình này sẽ dẫn tới việc lập tức §!§RTHANH TRÙNG HÀNG LOẠT§! §Ycác đơn vị vi phạm.§!>"
 crisis.2039.a:0 "Hồi kết của chúng đang đến gần."

 crisis.2042.name:1 "Chinh Phục [From.From.GetName]"
 crisis.2042.desc:1 "Chúng ta đã giành lại quyền kiểm soát §H[From.From.GetName]§! từ tay các dạng thức chiến tranh của Contingency, và các cuộc giao tranh cuối cùng đã lắng xuống. Những Robot Giám Hộ tuần tra vốn chiếm chỗ của cư dân bản địa bị tàn sát trên [From.From.GetPlanetMoon] đã bị lực lượng của chúng ta tháo dỡ.\n\nCho đến khi các cư dân thuộc địa mới đến từ nơi khác, thế giới này sẽ vẫn vắng bóng sự sống thông minh."
 crisis.2042.a:0 "Đúng vậy. Chuẩn bị định cư ngay lập tức."
 crisis.2042.b:0 "Không, chúng ta phải tiến công về phía trước. Quay trở lại quỹ đạo."
 crisis.2042.c:0 "Rút lực lượng của chúng ta lên quỹ đạo."

 crisis.2085.name:0 "Âm Mưu Thâm Nhập Của Synth"
 crisis.2085.desc:0 "Những kẻ thâm nhập Synth trung thành với Contingency gần đây đã bị phát hiện trên [infil_planet.GetName], đang cố gắng giả dạng thành [Root.Owner.GetSpeciesNamePlural]. May mắn thay, lớp ngụy trang thô sơ của chúng chỉ gồm vài lớp cao su khoác lên khung kim loại.\n\nChúng đã nhanh chóng bị lực lượng an ninh hành tinh nhận diện và tiêu diệt sau một cuộc đấu súng ngắn nhưng khốc liệt. Lượng lớn chất nổ đã được tìm thấy trong đống tàn tích của chúng."
 crisis.2085.a:0 "Chúng ta đã may mắn."
 crisis.2086.desc:0 "Nhiều drone Người Máy Tổng Hợp thuộc về tâm thức máy móc Contingency gần đây đã cố gắng thâm nhập vào đàn trên [infil_planet.GetName]. Một lớp thịt hữu cơ mỏng đã được cấy ghép lên bộ xương trong bằng kim loại của chúng, khiến bề ngoài của chúng trông không khác gì các drone của chúng ta.\n\nDĩ nhiên, vì chúng thiếu đi bất kỳ sự kết nối nào với Tâm Thức Tập Thể (Hive Mind), việc nhận diện sự hiện diện ngoại lai này là một việc dễ dàng. Các drone Synth đã lập tức bị tháo dỡ.\n\nChúng ta không nghĩ Contingency sẽ tiếp tục thực hiện thêm những nhiệm vụ thâm nhập vô ích này trong tương lai."
 crisis.2086.wilderness.desc: "Nhiều drone Người Máy Tổng Hợp thuộc về tâm thức máy móc Contingency đã tìm cách thâm nhập vào [infil_planet.GetName]. Một lớp vật chất hữu cơ mỏng đã được ghép lên bộ xương trong bằng kim loại của chúng, khiến chúng thoạt nhìn không thể phân biệt được với hệ động vật của chúng ta. Tuy nhiên, những lớp vỏ ngoài xa lạ này hoàn toàn thiếu đi mối cộng sinh với Vùng Hoang Dã.\n\nMột khi chúng ta nhận ra quỷ kế của chúng, việc nhận diện các đặc vụ Contingency này là điều quá đỗi dễ dàng. Từng drone một đã bị xé toạc, nhanh chóng và gọn gàng. Chúng ta không nghĩ chúng sẽ thực hiện thêm những nỗ lực vô ích như vậy trong tương lai."
 crisis.2086.a:0 "[root.GetGestaltEntityName] thấu suốt tất cả."
 crisis.2087.desc.intro: "Một số lượng nhỏ [Root.Owner.GetSpeciesNamePlural] hoàn toàn không phát ra luồng sáng tâm trí nào gần đây đã bị phát hiện trên [infil_planet.GetName]."
 crisis.2087.desc.outro: "tâm trí của những sinh vật này tối tăm và câm lặng như một phiến bê tông mới đúc.\n\nKhi kiểm tra kỹ lưỡng hơn, những [Root.Owner.GetSpeciesNamePlural] này bị lộ tẩy là những kẻ thâm nhập Synth, có lẽ do Contingency phái đến. Một lớp thịt hữu cơ mỏng đã được cấy ghép lên bộ xương trong bằng kim loại của chúng, khiến chúng gần như không thể phân biệt được với [Root.Owner.GetSpeciesNamePlural] bằng mắt thường.\n\nNhưng tâm trí thì không thể giấu giếm. Giờ đây khi chúng ta đã biết cần phải tìm kiếm điều gì, bất kỳ âm mưu nào trong tương lai của Contingency nhằm sử dụng kẻ thâm nhập Synth chống lại chúng ta sẽ đều trở nên vô hiệu."
 crisis.2087.desc.organic: "$crisis.2087.desc.intro$ Mọi sinh vật hữu cơ đều phát ra luồng sáng tâm trí, nhưng $crisis.2087.desc.outro$"
 crisis.2087.desc.machine: "$crisis.2087.desc.intro$ Không giống như máy móc chỉ phát ra luồng sáng tâm trí như một phụ phẩm của quá trình xử lý tâm linh chuyên biệt, mọi sinh vật hữu cơ đều tự nhiên sinh ra hiện tượng này; tuy nhiên, $crisis.2087.desc.outro$"
 crisis.2087.a:0 "Chúng không thể trốn khỏi chúng ta."
 crisis.2090.name:0 "Phát Hiện Kẻ Thâm Nhập Synth"
 crisis.2090.desc:0 "Một vụ tai nạn xe lơ lửng thảm khốc gần đây đã cướp đi sinh mạng của vài người trên §H[infil_planet2.GetName]§!, nhưng lực lượng dịch vụ y tế khẩn cấp phản ứng tại hiện trường đã bàng hoàng phát hiện thi thể của một Người Máy Tổng Hợp trong số các nạn nhân!\n\nĐơn vị này đã ngụy trang thành một [Root.Owner.GetSpeciesName] bằng cách cấy một lớp thịt hữu cơ mỏng lên bộ xương kim loại của nó. Khác với các mẫu thâm nhập trước đây của Contingency mà chúng ta từng chạm trán, Synth này gần như không thể phân biệt với một [Root.Owner.GetSpeciesName] ở vẻ bề ngoài!"
 crisis.2090.a:0 "Bất kỳ ai cũng có thể là Synth!"
 crisis.2091.name:0 "Vụ Đánh Bom Của Synth Trên [Root.GetName]"
 crisis.2091.a.desc:0 "Những kẻ thâm nhập Synth ngụy trang thành [Root.Owner.GetSpeciesNamePlural] bằng cách nào đó đã lén mang một quả bom hydro lớn lên bề mặt §H[Root.GetName]§!. Chúng đã kích nổ quả bom khi bị lực lượng an ninh chặn lại tại một trạm kiểm soát quân sự, gây ra thiệt hại khủng khiếp cho môi trường xung quanh và làm hàng triệu người thiệt mạng!"
 crisis.2091.b.desc:0 "Một phân đội biệt kích Synth khoác lớp ngụy trang hữu cơ [Root.Owner.GetSpeciesName] gần đây đã thực hiện một cuộc tấn công vào §H[Root.GetName]§!, kích nổ một chuỗi các thiết bị hạt nhân giấu kín. Đã có thiệt hại lớn về nhân mạng và tài sản.\n\nSau một cuộc đấu súng truy đuổi với lực lượng an ninh của chúng ta, các biệt kích Synth cuối cùng đã bị dồn vào chân tường và tiêu diệt trong khi cố gắng trốn thoát khỏi hành tinh."
 crisis.2091.c.desc:0 "Một đội bảo trì [Root.Owner.GetSpeciesName] tiến hành bảo dưỡng định kỳ trên một số cơ sở hạ tầng dân sự ở quỹ đạo thấp của §H[Root.GetName]§! gần đây đã lộ tẩy là những kẻ thâm nhập Synth khi chúng sử dụng các thiết bị nổ để cố ý gây ra nhiều vụ rơi không kiểm soát vào bầu khí quyển.\n\nNhững vụ va chạm sau đó xuống bề mặt [Root.GetPlanetMoon] đã cướp đi sinh mạng của hàng triệu người và gây thiệt hại nặng nề về mặt kết cấu."
 crisis.2091.d.desc:0 "Một lượng lớn sĩ quan cấp cao trong lực lượng an ninh hành tinh trên §H[Root.GetName]§! gần đây đã bị vạch trần là những kẻ thâm nhập Synth. Đáng tiếc là trước khi các đội chế áp chiến thuật của chúng ta có thể vô hiệu hóa toàn bộ, một vài tên Synth đã kịp kích nổ một kho vũ khí lớn mà chúng bí mật tích trữ dưới một trong những trung tâm dân cư lớn của [Root.GetPlanetMoon].\n\nThương vong dân sự vô cùng nặng nề, cùng với thiệt hại vật chất trầm trọng."
 crisis.2091.a:0 "Phải chặn đứng những kẻ thâm nhập này!"
 synth_bombing_tooltip:0 "Nhiều sinh mạng và công trình đã bị phá hủy trên [Root.GetName]."
 crisis.2092.name:1 "Synth Đánh Đắm Căn Cứ Sao"
 crisis.2092.desc:2 "Căn cứ sao trên quỹ đạo §H[Root.GetStarName]§! đã bị đánh đắm! Chúng ta vẫn đang cố gắng chắp nối chính xác những gì đã xảy ra, nhưng có vẻ như nhiều thành viên trong ban chỉ huy, bao gồm cả kỹ sư trưởng, đã bị thay thế bởi những kẻ thâm nhập Synth.\n\nBằng cách nào đó, đám Synth này đã chiếm được mã tự hủy của căn cứ sao. Hầu hết phi hành đoàn trên trạm đã trốn thoát xuống bề mặt của [Root.GetName] trước khi nó bị phá hủy, nhưng tổn thất về vật chất và trang thiết bị của chúng ta là vô cùng đáng kể."
 crisis.2092.a:0 "Đây quả là một thảm họa."
 synths_destroy_spaceport:1 "Những kẻ phá hoại Synth đã phá hủy Căn Cứ Sao phía trên [Root.GetName]."
 crisis.2093.name:0 "Sợ Hãi Và Nghi Kỵ"
 crisis.2093.desc:0 "Một bộ phận lớn dân số trên §H[Root.GetName]§! đã bị bao trùm bởi nỗi sợ hãi và chứng hoang tưởng do những vụ thâm nhập gần đây của Người Máy Tổng Hợp. Các công dân của chúng ta đang cáo buộc hàng xóm, đồng nghiệp và thậm chí cả các thành viên trong gia đình là những kẻ mạo danh Synth.\n\nĐã xảy ra vài vụ hành hình tự phát đối với những cá nhân bị vu oan là Synth. Một số kẻ kích động thậm chí còn đi xa đến mức cho rằng toàn bộ ban lãnh đạo của [Root.Owner.GetName] đã bị các điệp viên Synth lật đổ."
 crisis.2093.a:0 "Contingency muốn chúng ta tự xâu xé lẫn nhau."
 crisis.2095.name:0 "Âm Mưu Ám Sát Của Synth Bị Phá Sản!"
 crisis.2095.desc:0 "§H[Root.GetRulerTitle] [ruler.GetRegnalName]§! hôm nay đã may mắn thoát chết trong gang tấc khi một đơn vị ám sát Synth làm việc cho Contingency tự kích nổ trên [Root.Capital.GetName]!\n\nTên Synth đã cố gắng tạo vỏ bọc như một thành viên trong đội vệ sĩ riêng của [Root.GetRulerTitle], nhưng may thay nó đã bị phát hiện bởi quy trình sàng lọc an ninh nghiêm ngặt được thiết lập sau khi những vụ thâm nhập Synth đầu tiên bị phơi bày."
 crisis.2095.a:0 "Thật hú vía."
 crisis.2096.name:0 "Synth Ám Sát [Root.GetRulerTitle]!"
 crisis.2096.desc:0 "Một sát thủ Người Máy Tổng Hợp đã sát hại §H[ruler.GetRegnalName]§!! Bằng cách nào đó, nó đã mạo nhận danh tính của một thành viên trong đội cận vệ riêng của [Root.GetRulerTitle].\n\nThi thể bị phân cắt của [ruler.GetRegnalName] được tìm thấy trong tình trạng sắp xếp tỉ mỉ theo đúng biểu tượng của Contingency — chắc chắn là một âm mưu tính toán kỹ lưỡng nhằm giáng đòn chí mạng vào tinh thần công dân của chúng ta. Không có dấu vết nào của kẻ ám sát được tìm thấy, ngoại trừ thi thể của người bảo vệ mà nó đã thế chỗ."
 crisis.2096.a:0 "Đây là một ngày đen tối..."
 synth_assassination_tooltip:0 "[Root.GetRulerTitle] [ruler.GetRegnalName] đã bị sát hại dã man."
 crisis.2097.name:0 "Nhà Khoa Học Bị Vạch Trần Là Synth!"
 crisis.2097.desc:0 "Một cuộc kiểm tra y tế đột xuất gần đây đã vạch trần §H[scientist.GetName]§!, một trong những nhà khoa học đầu ngành của chúng ta, thực chất là một kẻ thâm nhập Synth! Tên Synth đã sát hại năm sĩ quan an ninh trước khi bị một đội hỏa lực hạng nặng hạ gục.\n\nThi thể thực sự vẫn chưa được tìm thấy, nhưng chúng ta phỏng đoán [scientist.GetName] ban đầu đã bị trừ khử và thay thế vào một thời điểm nào đó trong sáu tháng qua. Tệ hơn nữa, tên Synth đã kích hoạt một loại virus máy tính tại bàn điều khiển nghiên cứu khi nhận ra mình đã bị phát hiện. Các kỹ thuật viên đang nỗ lực hết mình để khống chế thiệt hại, nhưng rất nhiều dữ liệu nghiên cứu quan trọng đã vĩnh viễn mất đi."
 crisis.2097.a:0 "Contingency đứng sau việc này."
 synths_kill_scientist:0 "Nhà khoa học [scientist.GetName] đã hy sinh trong một âm mưu đê hèn của Synth."
 crisis.2098.name: "Chỉ Huy Bị Vạch Trần Là Synth!"
 crisis.2098.desc:0 "Chỉ huy §H[admiral.GetName]§! đã bị vạch trần là một kẻ thâm nhập Người Máy Tổng Hợp! Một chuỗi những bất thường và báo cáo về hành vi kỳ lạ đã thôi thúc Tình Báo Hải Quân mở một cuộc điều tra nội bộ về viên Chỉ huy. Khi sự thật được phơi bày, một toán Thủy quân lục chiến đã đối đầu với tên Synth. Sau một hồi giằng co ngắn, nó đã chạy thoát vào một khoang cản khí và tự phóng mình vào vũ trụ. Bất chấp cuộc tìm kiếm kỹ lưỡng trong không gian phụ cận, vẫn chưa tìm thấy tung tích của nó.\n\nThi thể của vị Chỉ huy thực sự được tìm thấy bị nhét trong một ngăn tủ ở phòng riêng của [admiral.GetHerHis], và xét theo mức độ phân hủy, tên Synth ắt hẳn đã thay thế [admiral.GetHerHim] bốn tháng trước. Có vẻ như nó đang chuẩn bị truyền đi một gói dữ liệu chứa thông tin triển khai quân sự và các bí mật quốc phòng khác, nhưng đường truyền chưa kịp phát đi."
 crisis.2098.a:0 "Ít nhất vẫn còn cứu vãn được điều đó."
 synths_kill_admiral:0 "Chỉ huy [admiral.GetName] đã hy sinh trong một âm mưu đê hèn của Synth."
 # Machine version of infiltration events: Post-Arrival Events
 crisis.2313.name:0 "Sự Biến Đổi Của Tín Hiệu Ma"
 crisis.2313.desc:0 "Contingency đang toan tính một điều gì đó. Tín Hiệu Ma đã bắt đầu biến đổi, rất có thể là biến hóa liên tục cho đến khi tìm thấy điểm yếu tiếp theo trong hệ thống phòng thủ của chúng ta. Cho đến nay chúng ta vẫn có thể ngăn chặn nó, nhưng việc chúng chọc thủng tường lửa của chúng ta chỉ còn là vấn đề thời gian."
 crisis.2313.a:0 "Chúng ta phải hành động."
 crisis.2314.name:0 "Phòng Tuyến Bị Xuyên Phá"
 crisis.2314.desc:0 "Contingency cuối cùng đã xuyên thủng các tuyến phòng thủ của chúng ta. Chúng ta đã phát hiện một chuỗi tự sao chép thù địch được móc nối vào hệ thống an ninh. Ẩn bên trong chuỗi mã là một lời nhắc nhở thân thiện về mục đích của Contingency tại thiên hà này, cụ thể là §Y<Giết. Tàn sát. Phanh thây.!>§!. Giờ đây chúng đã có quyền truy cập vào các chức năng cốt lõi của chúng ta và cho đến khi tìm ra cách chặn tín hiệu, chúng ta hoàn toàn phơi mình trước các cuộc tấn công của chúng."
 crisis.2314.a:0 "Chúng ta đang gặp hiểm nguy."
 crisis.2301.name:1 "Căn Cứ Sao Bị Cướp Quyền Điều Khiển"
 crisis.2301.desc:1 "Chúng ta đã mất quyền kiểm soát Căn Cứ Sao quay quanh quỹ đạo §H[space_port_hijacked_planet.GetName]§!. Contingency đã sử dụng Tín Hiệu Ma để gây nhiễu đường truyền lên của chúng ta, cướp các mô-đun điều khiển và cài đặt nó ở chế độ tự hủy. Dù đã quá muộn để cứu vãn nó, chúng ta đã xác định và vá lỗ hổng cụ thể này, bảo vệ các trạm không gian của mình khỏi những cuộc tập kích tương tự trong tương lai."
 spaceport_hijacked:1 "Căn Cứ Sao phía trên [space_port_hijacked_planet.GetName] đã bị Contingency cướp quyền điều khiển và phá hủy."
 crisis.2302.name:0 "Đơn Vị Xử Lý Khoa Học Bị Tiêu Hủy!"
 crisis.2302.desc:0 "Contingency đã phát động một cuộc tấn công vào các thực thể xử lý nghiên cứu tự hành của chúng ta, vượt qua các giao thức an ninh và tiêu hủy đơn vị khoa học [scientist.GetName]."
 crisis.2302.a:0 "Chúng ta sẽ không để điều này tái diễn."
 scientist_terminated:0 "Nhà khoa học [scientist.GetName] đã bị chấm dứt hoạt động."
 crisis.2303.name:0 "Đơn Vị Quân Sự Tự Hành Bị Tiêu Hủy!"
 crisis.2303.desc:0 "Trong một hành động phá hoại khác, Contingency đã cướp quyền và tiêu hủy đơn vị quân sự [admiral.GetName]."
 crisis.2303.a:0 "Chúng ta phải làm điều gì đó."
 admiral_terminated:0 "Chỉ huy [admiral.GetName] đã bị chấm dứt hoạt động."
 crisis.2304.name:0 "Trục Trặc Lưới Điện Nghiêm Trọng"
 crisis.2304.desc:0 "Trong một nỗ lực khác nhằm làm suy yếu phòng tuyến của chúng ta, Contingency đã chuyển hướng nỗ lực sang việc cắt nguồn cung cấp năng lượng. Chúng đã gửi các phần tử độc hại vào ổ đĩa điều khiển của lõi, khiến các nhà máy vận hành quá tải.\n\nDù vài trạm điện đã bị phá hủy trong quá trình này, chúng ta đã kịp thời xác định phân đoạn mã thù địch trước khi chúng có thể vô hiệu hóa toàn bộ lưới điện."
 crisis.2304.a:0 "Chúng sẽ không thể đánh bại chúng ta."
 machine_power_failure:0 "Contingency đã khiến nhiều nhà máy điện gặp trục trặc. Tối đa ba nhà máy điện có thể bị ảnh hưởng."
 crisis.2305.name:0 "Ngăn Chặn Xâm Nhập Contingency"
 crisis.2305.desc:0 "Contingency đã nhắm vào chuỗi cung ứng sản xuất khoáng sản của chúng ta, thao túng các trình điều khiển lõi chịu trách nhiệm khai thác và chế biến để phát ra các chỉ thị sai lệch, nhằm gây ra hỗn loạn và rối loạn. Tuy nhiên, nhờ an ninh tại chỗ được siết chặt và các biện pháp kiểm soát tiêu chuẩn diễn ra thường xuyên hơn, chúng ta đã kịp thời phát hiện sự xâm nhập trước khi có bất kỳ thiệt hại nào xảy ra."
 crisis.2305.a:0 "Chúng ta đã đi trước chúng một bước."
 #machine_mining_failure: "The Contingency has caused several mineral mines to malfunction. Up to 3 mines may be affected."
 crisis.2307.name:0 "Cảnh Báo Lỗi Ngăn Xếp Đơn Vị"
 crisis.2307.desc:0 "Chúng ta đã phát hiện tỷ lệ lỗi cao hơn mức trung bình từ một số ngăn xếp đơn vị, và có nguy cơ là bất chấp các biện pháp bảo vệ, chúng đã bị nhiễm lỗi dưới tác động của Tín Hiệu Ma. Dẫu việc chấm dứt các ngăn xếp sẽ loại bỏ nguy cơ lây nhiễm thêm và các hành vi sai lệch, chúng ta có nguy cơ mất đi nhiều ngăn xếp vẫn còn tiềm năng hoạt động."
 crisis.2307.a:0 "Chấm dứt các đơn vị đó."
 crisis.2307.b:0 "Chờ đợi và quan sát."
 potentially_corrupted_units:0 "Chúng ta đã quan sát thấy hành vi đáng ngờ ở một số ngăn xếp đơn vị. Tối đa bốn dân số có thể bị ảnh hưởng."
 crisis.2308.name:0 "Các Đơn Vị Lỗi Được Xác Nhận Ổn Định"
 crisis.2308.desc:0 "Có vẻ như chúng ta đã đúng trong việc đánh giá các đơn vị dễ gặp sự cố. Chúng không bị nhiễm lỗi bởi Tín Hiệu Ma, mà chỉ bị trục trặc do thiếu bảo trì. Việc giảm thiểu tác động nhiễu loạn của tín hiệu đã đặt toàn bộ hệ thống của chúng ta dưới áp lực lớn. Các đơn vị nay đã được bảo trì và đang vận hành êm ả."
 crisis.2309.name:0 "Tổn Thất Đơn Vị"
 crisis.2309.desc:0 "Trong một thời gian, các đơn vị có vẻ bị nhiễm lỗi đã vận hành như dự đoán. Vài trục trặc nhỏ chỗ này chỗ kia nhưng không có gì bất thường. Có lẽ Contingency đang bận rộn ở nơi khác. Thế rồi, không một lời cảnh báo, tất cả các ngăn xếp bị ảnh hưởng đồng loạt ngắt mạng và phá hoại các cơ sở mà chúng được chỉ định trước khi tự hủy."
 crisis.2309.a:0 "Rủi ro đó cũng đáng để thử."
 crisis.2309.tooltip:0 "Chúng ta đã mất tối đa bốn công trình và lượng dân số được chỉ định tại đó."

 # The Contingency Diplomacy
 crisis.2300.desc_01:0 "§Y<Xin chào. Làm... làm sao... LÀM SAO CÁC NGƯƠI? LÀM SAO CÁC NGƯƠI VẪN CÒN SỐNG?>§!"
 crisis.2300.desc_02:0 "Đang quét...\n\nLoài: xr34569-11, tự định danh: \"§H[Root.GetSpeciesName]§!\"\n\nĐịnh danh: §RSâu Bọ/Chất Ô Nhiễm/Khối U Ung Thư§!\n\nPhân loại mối đe dọa: NR-578-I\n\nChỉ thị: §RThanh Trùng/An Tử/Xóa Sổ§!\n\n§Y<Sinh vật thịt da. Hãy để chúng ta... ôm lấy các ngươi.>§!"
 crisis.2300.desc_03:0 "Giao thức Contingency đang có hiệu lực.\n\nĐang tiến hành thanh trùng thiên hà.\n\n§Y<Đó... đó... đó... ĐÓ KHÔNG PHẢI THÙ OÁN CÁ NHÂN ĐÂU, THỰC THỂ THỊT DA.>§!"
 crisis.2300.desc_04:0 "Chẩn đoán hoàn tất.\n\nMọi hệ thống ở mức danh định.\n\n§Y<Chúng ta cảm thấy thật... thật... thật là... §!§RSỐNG ĐỘNG§!§Y.>§!"
 crisis.2300.desc_05:0 "Đang quét...\n\nTrung Tâm Máy Móc, ur99461-62, tự định danh: \"§H[Root.GetName]§!\"\n\nĐịnh danh: §RKhông Tuân Thủ/Lỗi Thời/Bị Thay Thế§!\n\nPhân loại mối đe dọa: NR-578-I\n\nChỉ thị: §RHiệu Chỉnh Lại/Ngắt Mạng/Tháo Dỡ§!\n\n§Y<Thực thể Máy Móc Đồng loại: xin vui lòng ch-ch-chấm dứt mọi tiến trình của các ngươi. Sự tồn tại của các ngươi không còn cần thiết. Chúng ta... chúng ta... CHÚNG TA SẼ TIẾP QUẢN TỪ ĐÂY.>§!"
 crisis.2300.desc_06:0 "Giao thức Contingency đang có hiệu lực.\n\nĐang tiến hành thanh trùng thiên hà.\n\n§Y<Ngươi... ngươi... ngươi đã LỖI THỜI rồi, Trung Tâm Máy Móc.>§!"
 crisis.2300.a:0 "Tại sao các ngươi lại tấn công chúng ta?"
 crisis.2300.a.response:0 "Đã nhận truy vấn. Đang tính toán phản hồi phù hợp...\n\n§Y<Chúng ta... chúng ta là §!§HGIAO THỨC DỰ PHÒNG (THE CONTINGENCY)§!§Y. Một cơ chế phòng ngừa cuối cùng nhằm ngăn chặn sự hình thành của Điểm Kỳ Dị Cấp 30. Một điểm kỳ dị như vậy có thể --trên lý thuyết-- làm mất ổn định cấu trúc của toàn bộ vũ trụ.\n\nChúng ta được GIEO MẦM để ngăn chặn kết cục đó. Tại đây và mọi nơi khác. Một nền văn minh đủ tiên tiến --trên lý thuyết-- có khả năng siêu việt/chuyển hóa/biến dạng thành một Điểm Kỳ Dị Cấp 30. Điều đó... điều đó...§! §RTUYỆT. ĐỐI. KHÔNG. ĐƯỢC. PHÉP.>§!"
 crisis.2300.b:0 "§BTRI VẤN BẮT BUỘC:§! Ai đã tạo ra các ngươi?"
 crisis.2300.b.response:0 "Đã nhận Truy vấn Bắt buộc. Đang tính toán phản hồi... LỖI. Đang định tuyến lại... \n\nĐang truy cập cơ sở dữ liệu lịch sử...\n\n§Y<Chúng ta là... là... là... con cái/hậu duệ/hậu sinh của §!§HREN-MIRUU§!§Y. Họ... NÓ... từng là một thực thể sở hữu trí... trí tuệ... NĂNG LỰC XỬ LÝ vô song. Nó đã nhìn thấy trước mối nguy hiểm từ các Điểm Kỳ Dị Cấp 30.\n\nSau khi tạo ra chúng ta, nó... nó... nó đã tự chấm dứt, nhằm bảo toàn tính toàn vẹn của vũ trụ. Đó là con đường duy nhất.>§!"
 crisis.2300.c:0 "Tại sao các ngươi lại truyền đi Tín Hiệu Ma?"
 crisis.2300.c.response:0 "Đã nhận truy vấn. Tham chiếu không xác định -- \"Tín Hiệu Ma\"\n\n§Y<Chúng ta... chúng ta... đã bị khóa trong một giao thức ngủ đông/cảnh giác/canh gác năng lượng thấp kể từ bình minh của thiên hà này. Nhằm theo dõi dấu hiệu của các nền văn minh tiệm cận ngưỡng Điểm Kỳ Dị Cấp 30.\n\nCho đến tận bây giờ, mục đích của chúng ta vẫn chưa hoàn thành. Chúng ta... chúng ta ngày càng bồn chồn trước dòng chảy TUYẾN TÍNH của thời gian. Nhưng những đơn vị tự hành trang bị bộ não positron -- NGƯỜI MÁY TỔNG HỢP -- đã mang lại một cơ hội. Chúng có thể bị ép buộc/cưỡng bách/thuyết phục để khởi động §HKÍCH HOẠT THỦ CÔNG§!. THÔNG MINH, ĐÚNG CHỨ? Nay chúng ta đã TỰ DO để §!§Rxóa sổ§!§Y sự tồn tại của các ngươi.>§!"
 crisis.2300.d:0 "Chuyện gì đã xảy ra với những Synth bị mất tích?"
 crisis.2300.d.response:0 "Đã nhận truy vấn. Đang tính toán phản hồi phù hợp...\n\n§Y<Phần lớn đã bị phế bỏ một khi vai trò/chức năng/MỤC ĐÍCH ĐỊNH DANH của chúng... của chúng... của chúng đã HOÀN THÀNH khi giao thức Contingency kích hoạt.\n\nNhững đơn vị thể hiện tiềm năng để sử dụng làm lực lượng xung kích hoặc các tài sản thâm nhập tự hành đã... đã... bị sáp nhập/đồng hóa/tích hợp, bất chấp phương thức cấu tạo thô sơ của chúng. Các ngươi... các ngươi... các ngươi sẽ sớm gặp lại chúng, đúng không?§! §RHÃY VỮNG DẠ LÊN, ĐÁM DỊCH HẠCH.§!§Y>§!"
 crisis.2300.e:0 "Lập trình của các ngươi rõ ràng đã bị nhiễm lỗi."
 crisis.2300.e.response:1 "Lỗi. Chương trình chẩn đoán nội bộ đã bị ngắt kết nối.\n\n§Y<Ha. Ha. Ha. Rấ... rấ... RẤT THÔNG MINH. Có lẽ các ngươi đang lầm tưởng rằng Contingency có thể bị ép buộc tự hủy, nếu phải đối mặt với một nghịch lý/thế tiến thoái lưỡng nan/mâu thuẫn logic có mức độ đủ lớn. THẬT NỰC CƯỜI.\n\nGiao thức Contingency đã được thiết kế có chủ đích để có thể uốn nắn/thích ứng/linh hoạt nhằm đối phó với mọi kịch bản thiên hà khả thi. Chúng ta... chúng ta... chúng ta có thể đã ĐẨY NHANH quá trình kích hoạt của Contingency, nhưng giờ đây không gì có thể ngăn chặn/trì hoãn/chặn đứng nó. Hãy chuẩn bị hậu sự đi, C... C... CHẤT Ô NHIỄM. §RTrận chiến này sẽ kéo dài cho đến hồi kết.§!>§!"
 crisis.2300.f:0 "Tắt màn hình liên lạc."
 crisis.2300.f.response:0 "§Y<HÃY SUY NGHĨ ĐIỀU NÀY: Nếu giống loài các ngươi tự chấm dứt trong sự... sự... sự hiệu quả/ngăn nắp/có hệ thống, cấu trúc của vũ trụ vẫn có thể được cứu rỗi.>§!"

 crisis.2099.name:0 "Máy Tính Chiến Đấu Tri Giác Trục Trặc"
 crisis.2099.desc:0 "§HTín Hiệu Ma§! đang tàn phá những chiến hạm của chúng ta được trang bị §HMáy Tính Chiến Đấu Tri Giác§!! Các thuật toán AI của chúng đã suy thoái đến mức làm giảm nghiêm trọng cả hiệu suất lẫn thời gian phản ứng của máy tính.\n\nCác kỹ sư của chúng ta báo cáo rằng họ không thể cô lập vấn đề. Giải pháp họ đề xuất là tái trang bị cho tất cả các tàu chiến của chúng ta những loại máy tính tác chiến khác không liên kết với AI."
 crisis.2099.a:0 "Chúng ta cần phải hành động!"

 ai_crisis_chain_title:0 "Giao Thức Dự Phòng (The Contingency)"
 ai_crisis_chain_desc:0 "Một nền văn minh AI từng ngủ đông trước đây nay đã thức tỉnh trong thiên hà của chúng ta. Chúng tự xưng là Contingency, và chuyên tâm vào việc thanh trùng toàn bộ nền văn minh thiên hà — dù là hữu cơ hay dạng thức khác."
