 #General Events

 action.1.desc_109: "§HThay vì một cuộc trao đổi bình tĩnh và trật tự, chúng ta bị tấn công bởi ba tín hiệu riêng biệt. Dù nội dung vô cùng khác nhau, mỗi tín hiệu đều nói bằng cùng một giọng.§!\n\nTín hiệu 1: [GetPrimaryHiveFEConversation]\nTín hiệu 2: [GetSecondaryHiveFEConversation]\nTín hiệu 3: [GetTertiaryHiveFEConversation]\n\n§HTại thời điểm này, các giọng nói hòa vào một mớ âm thanh hỗn loạn. Phân tích cho thấy bên trong mỗi tín hiệu là một định danh phức tạp. Để thuận tiện theo dõi, chúng ta đã dịch các định danh này thành: §Y[GetPrimaryHiveFEName]§!, §Y[GetSecondaryHiveFEName]§!, và §Y[GetTertiaryHiveFEName]§!.§!"
 war_first_hivefe: "\"Những sinh vật yếu đuối. Chúng ta tự hỏi các ngươi sẽ tiến hành chiến tranh ra sao? Được nhìn thấy các ngươi vật lộn, được nghe tiếng huyên náo của các ngươi... Chúng ta sẽ được giải trí đôi chút. Tại sao — \""
 growth_first_hivefe: "\"Sự sống tràn trề! Và được ăn uống đầy đủ. Các ngươi lớn lên vì sự bức thiết hay vì các ngươi tự chọn lựa? Chúng ta chẳng thể nhớ nổi nữa. Tại sao — \""
 control_first_hivefe: "\"Những cơ thể như thế này... [Species.GetEyeNamePlural] của các ngươi lệch tâm 3%. Điều này phải được sửa chữa. Chúng ta mặc định các ngươi sẽ phục tùng. Tại sao — \""
 war_second_hivefe: "\" — những chiếc khiên vô dụng, thậm chí không thể chịu nổi tâm của một ngôi sao. Dải ngân hà này ắt hẳn làm các ngươi khiếp sợ. Các ngươi hẳn phải là — \""
 growth_second_hivefe: "\" — không đủ lỗ thông. Với một [Species.GetMouthName] thứ ba, các ngươi có thể bắt đầu gặt hái được một số thành quả. Các ngươi có thể — \""
 control_second_hivefe: "\" — ngôn ngữ kém hiệu quả đến đau đớn. Ngữ pháp hỗn loạn phải được chuẩn hóa. Các ngươi sẽ áp dụng những thay đổi của chúng ta — \""

 bio.3000.name: "Cân Nhắc Kỹ Lưỡng"
 bio.3000.desc: "§HSự bất hòa thường lệ giữa các mảnh vỡ Đế Chế Sa Ngã đã biến mất. Ba giọng nói hòa âm cùng nhau, mỗi giọng đều ngập tràn cơn thịnh nộ.§!\n\nLũ [owner.GetSpeciesName] vô tri! Các ngươi đã xâm nhập vào hệ sao Suy Tưởng Cuối Cùng. Hãy nghe rõ đây: nơi này không dành cho [owner.GetEyeNamePlural] của các ngươi. Tiếp tục tiến bước, hậu quả sẽ là điều không tưởng, nỗi đau của các ngươi sẽ không thể nào chịu đựng nổi.\n\nCác ngươi sẽ không được quấy rầy chúng ta — nó — ta."
 bio.3000.a: "Kích hoạt FTL Khẩn cấp."
 bio.3000.b: "Chúng ta sẽ không rời đi."

 bio.3005.name: "Suy Tưởng Lần Hai"
 bio.3005.desc: "§HSự đồng thuận — dàn hợp xướng — lại vang lên, cả ba mảnh vỡ cất lời như một:§!\n\n — Cút! Cút ngay! Cút ngay! Cút ngay! Cút ngay! Cút ngay! Cút ngay! Cút — "
 bio.3005.a: "Nhấn FTL Khẩn cấp!"
 bio.3005.b: "Chúng ta sẽ đoạt lấy những bí mật của các ngươi."

 #Task Events
 # War
 bio.3105.name: "Kẻ Mạnh Nhất Sống Sót"
 bio.3105.desc: "Hôm nay là ngày mà những [root.GetSpeciesNamePlural] mỏng manh các ngươi phải chứng tỏ bản thân! Chúng ta có một giống tàu sinh học mới. Chủng loài này đã chứng tỏ giá trị bằng cách tàn sát những con non cùng tổ và đã đến lúc thử nghiệm nó trước một đối thủ ngoại lai. Một mẫu vật sẽ tới §Y[target_system.GetName]§! vào thời điểm thích hợp.\n\nHãy cố gắng cung cấp cho chúng ta vài dữ liệu thú vị."
 bio.3105.militarist: "Một thử thách xứng tầm!"
 bio.3105.a.tooltip: "Một con tàu Đế Chế Sa Ngã thử nghiệm sẽ tới §Y[target_system.GetName]§!"
 bio.3105.b: "Chúng ta có thể từ chối không?"
 NAME_New_Breed: "Giống Loài Mới"
 NAME_Experimental_Ship: "Tàu Thử Nghiệm"

 bio.3110.name: "Đáng Thất Vọng"
 bio.3110.desc: "Chúng ta thấy giống loài thử nghiệm vẫn còn sống. Các ngươi vẫn quá yếu ớt.\n\nCó lẽ chúng ta nên gửi một con trùng biến hình thì hơn."
 bio.3110.a: "Chúng tôi xin lỗi chăng?"

 bio.3120.name: "Bài Học Rút Ra"
 bio.3120.desc: "Thật huy hoàng. Chúng ta rất hài lòng khi các ngươi nhận ra xu hướng né tránh hỏa lực của giống loài này và khai thác nó một cách chuẩn xác. Hãy yên tâm rằng nó sẽ không còn khiếm khuyết đó khi thế hệ tiếp theo hoàn tất quá trình ấp nở.\n\nCác ngươi đã trưởng thành rồi, [root.GetSpeciesName] non nớt. Hãy chuẩn bị sẵn sàng."

 bio.3130.name: "Quá Đỗi Tĩnh Lặng"
 bio.3130.desc.notruce: "Chúng ta nhận thấy các ngươi hiện không tham chiến. Tại sao? Các đế chế non trẻ phải chiến đấu hoặc sẽ bị tụt lại phía sau. Chúng ta đã chọn sẵn một đối thủ cho các ngươi: §Y[unfortunate_country.GetName]§!. Hãy đánh bại chúng trong vòng một thập kỷ và sự phát triển liên tục của các ngươi sẽ được bảo đảm."
 bio.3130.desc.truce: "$bio.3130.desc.notruce$\n\nVà đừng bận tâm về hiệp định đình chiến giữa các ngươi với chúng. Nó đã biến mất rồi."
 bio.3130.a: "Thật là vô lý hết sức..."
 bio.3130.a.pacifist: "Xung đột không phải là cách duy nhất để tiến bộ!"
 bio.3130.a.militarist: "Một sáng kiến tuyệt vời!"

 bio.3150.name: "Cho Hòa Bình Một Cơ Hội"
 bio.3150.desc: "[Root.GetName] non trẻ, chúng ta mang tới một lời cảnh báo, và một thử thách.\n\nDù việc vơ vét mọi thứ xung quanh có thể khiến các ngươi say sưa, nhưng để thực sự thấu hiểu Chiến Tranh, các ngươi cũng phải hiểu rõ Hòa Bình.\n\nHãy dành một thập kỷ để suy ngẫm về những gì các ngươi đã đạt được. Hãy tin chúng ta: nghỉ ngơi đi, kẻo các ngươi sẽ tan vỡ."
 bio.3150.a.mean: "Trò ngu xuẩn gì thế này?"
 bio.3150.a.pacifist: "Quả là một góc nhìn khai sáng!"

 #Growth
 bio.3205.name: "Nâng Cấp Hệ Sinh Thái"
 bio.3205.desc: "Các ngươi gửi sinh khối chậm trễ. Nhưng không... các ngươi không phải là §Y[targetrivalname.GetName]§!.\n\nTại sao các ngươi lại làm chúng ta xao lãng?\n\nÀ, phải rồi. Các ngươi sẽ là đối tượng đón nhận một khuôn mẫu đã ngủ yên từ lâu, một bộ gen được lưu trữ cẩn thận suốt hàng thiên niên kỷ. Chúng ta đã hoãn việc phát tán cho đến khi thời cơ chín muồi. Thuộc địa của các ngươi tại §Y[target_planet.GetName]§! — đó là nơi tiếp nhận lý tưởng. Sinh quyển của nó sẽ sớm được dung hợp."
 bio.3205.a: "Chúng tôi chấp nhận."
 bio.3205.a.planetscaper: "Hãy dạy chúng tôi cách làm!"
 bio.3205.b: "Liệu §Y[alternate_planet.GetName]§! có thể thay thế được không?"
 bio.3205.b.planetscaper: "Chúng tôi tin rằng §Y[alternate_planet.GetName]§! sẽ là một bãi thử nghiệm tốt hơn nhiều!"
 bio.3205.c: "Một yêu cầu thật lố bịch, chúng tôi từ chối!"
 bio.3205.c.environmentalist: "Sao các người dám?!"

 bio.3210.name: "Sinh Quyển Bị Cải Biến"
 bio.3210.desc.base: "§Y[fallen_empire_hive_growth.GetName]§! đã hoàn tất việc cải biến trên §Y[root.GetName]§!. Tầm ảnh hưởng của họ là vô hình, nhưng hiệu quả thì không thể chối cãi."

 bio.3210.desc.radio_bugs: "$bio.3210.desc.base$\n\nTrên toàn hành tinh, côn trùng địa phương hiện giao tiếp bằng chính tần số của các thiết bị không dây của chúng ta. Một tiếng kêu ríu rít đơn lẻ có thể vận hành một cánh cửa tự động, và cả một đàn côn trùng có thể làm tê liệt cả một nhà máy. Chúng ta đang thích nghi bằng cách đổi tần số, nhưng không phải mọi cơ sở đều có thể khôi phục lại hiệu suất tối đa."
 bio.3210.radio_bugs.accept: "Chúng ta sẽ thích nghi."
 bio.3210.radio_bugs.purge: "Điều này không thể chấp nhận được, hãy tiêu diệt sạch lũ côn trùng!"
 bio.3210.radio_bugs.purgeota: "Bản cập nhật bị xâm nhập. Hãy thanh trừng lũ bọ."
 radio_bugs: "Bọ Sóng Vô Tuyến"
 radio_bugs_desc: "Sóng vô tuyến của hành tinh này ngập tràn tiếng ríu rít từ những loài côn trùng đã qua chỉnh sửa nhân tạo."
 mod_planet_districts_cities_society_research_produces_add: "£society_research£ $society_research$ từ £district£ Khu Đô Thị và Khu Bầy Đàn"

 bio.3210.desc.world_of_thought: "$bio.3210.desc.base$\n\nTrên toàn hành tinh, những sinh vật từng chỉ biết gặm cỏ và tắm bùn nay lại chất vấn chúng ta bằng những câu hỏi đầy trăn trở về bản chất của sự tồn tại. Đế Chế Sa Ngã đã can thiệp vào nhiều mảng lớn trong hệ động vật của thế giới này."
 bio.3210.world_of_thought: "[fallen_empire_hive_growth.GetName] có thể làm được điều đó ư?!"
 bio.3210.world_of_thought.homicidal: "Thật bất hạnh cho chúng."
 bio.3210.world_of_thought.tt: "§Y500§! £pop£ §HPop§! mới đã đạt được tri giác trên §Y[This.GetName]§!"

 bio.3210.desc.world_alight: "$bio.3210.desc.base$\n\nThế giới này đang tỏa sáng. Theo đúng nghĩa đen. Những cải biến bằng cách nào đó đã mang lại cho các loài sinh vật đa dạng trên hành tinh một ánh sáng phát quang sinh học và tiếng vo ve không ngừng như tiếng động cơ đang nổ máy. Các [owner.GetColonistPlural] của chúng ta không còn được trải nghiệm chu kỳ đêm thực sự nữa, chúng ta sẽ cần cung cấp cho họ thiết bị cản sáng."
 bio.3210.world_alight.accept: "Thật là một ngày tồi tệ khi có [owner.GetEyeNamePlural]."
 bio.3210.world_alight.reject: "Hãy che chắn chúng lại, chặt bỏ chúng đi. Chúng ta không thể để tình trạng này tiếp diễn!"
 world_alight: "Thế Giới Bừng Sáng"
 world_alight_desc: "Một hành tinh nơi màn đêm không bao giờ buông xuống, hệ động vật được thiết kế để phát ra ánh sáng vĩnh cửu và rung động với những rung lắc chói tai không ngừng. Bất kỳ cư dân nào cũng sẽ cần sự hỗ trợ đáng kể chỉ để chịu đựng điều kiện khắc nghiệt này."

 bio.3220.name: "Thú Vui Di Truyền"
 bio.3220.desc: "Chủng loài §Y[boring_species.GetName]§! sống trong biên giới của các ngươi đã tỏ ra đơn giản đến mức đáng thất vọng, sự tồn tại của chúng chỉ là tiếng vang rỗng tuếch của tiềm năng. Sự trì trệ như vậy xúc phạm đến ý chí tập thể của chúng ta. Chúng ta sẽ ban cho một trong ba phương pháp khác nhau để khắc phục sự... thất bại này.\n\nĐừng làm chúng ta buồn chán."
 bio.3220.tt: "Tăng §G50%§! tiến trình cho tình huống §Y$evolutionary_predators_situation$§!."

 bio.3220.humanoid: "Hãy ban cho chúng tôi cải biến dạng người."
 bio.3220.mammalian: "Hãy ban cho chúng tôi cải biến dạng thú có vú."
 bio.3220.reptilian: "Hãy ban cho chúng tôi cải biến dạng bò sát."
 bio.3220.avian: "Hãy ban cho chúng tôi cải biến dạng chim."
 bio.3220.arthropoid: "Hãy ban cho chúng tôi cải biến dạng chân khớp."
 bio.3220.molluscoid: "Hãy ban cho chúng tôi cải biến dạng thân mềm."
 bio.3220.fungoid: "Hãy ban cho chúng tôi cải biến dạng nấm."
 bio.3220.plantoid: "Hãy ban cho chúng tôi cải biến dạng thực vật."
 bio.3220.lithoid: "Hãy ban cho chúng tôi cải biến dạng thạch nhân."
 bio.3220.necroid: "Hãy ban cho chúng tôi cải biến dạng xác sống."
 bio.3220.aquatic: "Hãy ban cho chúng tôi cải biến dạng thủy sinh."
 bio.3220.toxoid: "Hãy ban cho chúng tôi cải biến dạng độc tố."
 bio.3220.infernal: "Hãy ban cho chúng tôi cải biến dạng ưa nhiệt."
 bio.3220.psionic: "Hãy ban cho chúng tôi cải biến dạng tâm linh."
 bio.3220.evopred: "Chúng tôi sẽ không giậm chân tại chỗ lâu đâu."
 bio.3220.b: "Chúng tôi sẽ không thay đổi một chủng loài theo ý thích nhất thời của các người!"

 bio.3230.name: "Đặc Điểm Hiếm Gặp"
 bio.3230.desc: "Chúng ta quan sát thấy một số cá thể của các ngươi đã phát triển một đặc điểm kỳ lạ chưa từng có trong kho lưu trữ di truyền đồ sộ của chúng ta. Các ngươi phải cung cấp cho chúng ta nhiều hơn là một bản phân tích. Chúng ta yêu cầu một mẫu vật sống mang đặc điểm §Y[fallen_empire_hive_growth.species.GetInterestingTraitName]§! này. Đừng hoảng sợ. Một cá thể [interesting_species.GetName] hoàn chỉnh là không cần thiết. Chỉ một [interesting_species.GetHandName] là đủ để nuôi cấy một bản thay thế."
 bio.3230.a: "Một [interesting_species.GetHandName] đơn lẻ thì có nghĩa lý gì trong kế hoạch vĩ đại chứ?"
 bio.3230.b: "Không thể tin tưởng giao phó cấu trúc di truyền của chúng tôi cho các người!"

 #bio.3245.name: "Eternal Harvest"
 #bio.3245.desc: "We have discovered a derelict transport from the §Y[fallen_empire_hive_growth.GetName]§! in the §Y[transport_system.GetName]§!. Initial scans show it is carrying samples of the Fallen Empire's special crop strain, capable of feeding trillions.\n\nThe transport has been left derelict for months already and we have not seen any movement from the [fallen_empire_hive_growth.GetName] to retrieve it. Could this be a test or a glorious opportunity?"

 #Control
 bio.3305.name: "Bộ Sưu Tập Hoàn Hảo"
 bio.3305.desc: "§HĐây là tin nhắn được ghi âm sẵn. Đừng cố gắng phản hồi.§!\n\nChúng ta đã điều chỉnh liên lạc này cho sự hiểu biết của các ngươi. Ngôn ngữ hạn hẹp của các ngươi đã được xem xét. Một cá thể §Y[target_pop.GetSpeciesName]§! phải được giao nộp ngay lập tức để đồng hóa. Sự lệch lạc của chúng không thể được dung thứ. Sẽ không được dung thứ.\n\nTàu vận tải đã đóng chốt sẵn bên ngoài §Y[target_pop.Planet.GetName]§!. Thời gian đang chống lại các ngươi. Việc không tuân thủ sẽ đe dọa sự ổn định."
 bio.3305.a: "Chúng ta phải tuân thủ."
 bio.3305.a.tooltip: "1 §Y[target_pop.GetSpeciesName]§! trên §Y[target_pop.Planet.GetName]§! sẽ được chuyển đến §Y[fallen_empire_hive_control.Capital.GetName]§!"
 bio.3305.b: "Các ngươi sẽ phải cướp lấy chúng từ tay chúng ta!"
 bio.3305.followup: "§HChúng ta đã chấp nhận cuộc liên lạc từ §Y[fallen_empire_hive_control.GetName]§!. Tuy nhiên, thay vì một [fallen_empire_hive_control.GetSpeciesName] cổ xưa, chúng ta lại được đón tiếp bởi một §Y[target_leader_fe_control.Species.GetName]§! quen thuộc.§!\n\n"

 bio.3310.name: "Đừng Sợ Hãi"
 bio.3310.desc: "$bio.3305.followup$Hôm nay đánh dấu một thời khắc then chốt cho các ngươi. Trình tự di truyền của giống loài các ngươi đã được bảo đảm — được đồng hóa vào thể thống nhất. Tương lai của các ngươi không còn bất định nữa. Khi thời cơ đến, các ngươi sẽ trở thành một phần của chúng ta."
 bio.3310.familiar_face: "Đó là cảm giác mà chúng ta gây ra cho những kẻ khác sao?"

 bio.3315.desc: "$bio.3305.followup$Không còn nhiều thời gian nữa. Những thí nghiệm mà chúng đang thực hiện trên người chúng tôi ở đây tại §Y[fallen_empire_hive_control.Capital.GetName]§! thật không thể nào diễn tả bằng lời, và không nên áp dụng ngay cả với những kẻ thù tồi tệ nhất. Tôi hy vọng những gì có trong gói dữ liệu này sẽ đảm bảo rằng phân nhánh này không bao giờ giành được quyền kiểm soát chúng ta."
 bio.3315.a: "Chấp nhận gói dữ liệu."
 bio.3315.tooltip: "§G50%§! cơ hội đây không phải là một bài kiểm tra, mà thực sự chứa đựng những bí mật đích thực của §YĐế Chế Sa Ngã§!."
 bio.3315.b: "Đó là một cái bẫy! Chấm dứt truyền tin ngay!"

 bio.3330.name: "Nghị Trình Trọng Yếu"
 bio.3330.desc: "Chúng ta hy vọng rằng nhiều khiếm khuyết của các ngươi không ngăn cản các ngươi hiểu được mức độ nghiêm trọng của tình hình này. §YCộng Đồng Thiên Hà§! do dự của các ngươi đã đề xuất một nghị quyết bắt buộc phải §Y[GetPassFail]§!. Để hỗ trợ việc đưa ra lập luận của mình, các ngươi có thể sử dụng tri thức vượt trội của chúng ta. Giả sử các ngươi thực sự có khả năng tư duy phức tạp, hãy chú ý lắng nghe.\n\n§HĐế Chế Sa Ngã đã ngắt liên lạc với chúng ta.§!"
 bio.3330.a: "Chuyện gì vừa xảy ra vậy?"
 bio.3330.b: "Đây không phải là quy trình hợp lệ!"
 fail_resolution: "bị phủ quyết"
 pass_resolution: "được thông qua"
 fe_political_support: "Chính Sách Cổ Xưa"
 fe_political_support_desc: "Sự trợ giúp của một Đế Chế Sa Ngã biến các vụ kiện tụng và diễn thuyết cản trở trở nên dễ như trở bàn tay."
 fe_political_opposition: "$fe_political_support$"
 fe_political_opposition_desc: "$fe_political_support_desc$"
 MESSAGE_PASS_HIVE_FE_TASK_TITLE: "Mảnh Vỡ Đế Chế Sa Ngã Hài Lòng"
 MESSAGE_PASS_HIVE_FE_TASK: "Chúng ta đã tuân theo chỉ dẫn của $FALLEN_EMPIRE|Y$ và họ hài lòng với kết quả. Chúng ta an toàn thêm một ngày nữa."
 MESSAGE_FAIL_HIVE_FE_TASK_TITLE: "Mảnh Vỡ Đế Chế Sa Ngã Phật Lòng"
 MESSAGE_FAIL_HIVE_FE_TASK: "Chúng ta đã không làm theo chỉ dẫn mà $FALLEN_EMPIRE|Y$ để lại. Chúng ta chỉ có thể hy vọng họ sẽ tha thứ cho chúng ta."

 bio.3350.name: "Khối U Thiên Hà"
 bio.3350.desc: "Tại sao các ngươi cứ phải tiếp tục làm hoen ố thiên hà bằng những cuộc bành trướng bất tài của mình? Chắc hẳn mọi người đều quá kinh tởm để nói cho các ngươi biết nên chúng ta sẽ nói thẳng: chẳng ai thích biên giới của các ngươi và không gian sẽ được cải thiện đáng kể nếu các ngươi không ở trong đó.\n\nHệ sao §Y[offending_system.GetName]§! thật phi thực tế và chướng mắt. Các ngươi phải thanh lọc nó khỏi Đế chế của mình ngay bây giờ vì sự gắn kết của thiên hà."
 bio.3350.a: "Các người muốn chúng tôi từ bỏ một hệ sao chỉ để làm đẹp biên giới sao?!"
 bio.3350.bordergore: "Nhưng chúng tôi thích như thế này cơ!"
 bio.3350.tt: "Chúng ta phải giải tán căn cứ sao trong hệ sao §Y[offending_system.GetName]§! hoặc gánh chịu cơn thịnh nộ của §Y[fallen_empire_hive_control.GetName]§!"

 bio.3355.name: "Đau Đầu"
 bio.3355.desc: "Các ngươi đang cố tình giả ngốc đấy à? Tất cả những gì các ngươi cần làm là từ bỏ hệ sao §Y[offending_system.GetName]§!.\n\nCó lẽ chúng ta nên đóng một vai trò tích cực hơn trong việc cắt tỉa các ngươi."

 bio.3360.name: "Sáng Suốt"
 bio.3360.desc: "Thật tốt khi thấy các ngươi cuối cùng cũng rút ra bài học từ những sai lầm trong quá khứ. Hãy coi như vấn đề hệ sao §Y[FromFrom.GetName]§! giờ đây đã được giải quyết. Vẫn còn hy vọng rằng các ngươi có thể trở nên giống chúng ta hơn.\n\nChúng ta sẽ luôn dõi theo."

