 bio.1005.name: "Hấp Thụ Năng Lực"
 bio.1005.desc: "Loài của chúng ta ngày càng trở nên phức tạp hơn. Sau khi sục sạo khắp các vì sao để tìm kiếm vật liệu di truyền mới, chúng ta đã sẵn sàng tiếp nhận một khía cạnh mới. Nhờ sự nỗ lực làm việc của các [Owner.GetScientistPlural], chúng ta có quyền lựa chọn.\n\nBất kể quyết định nào chúng ta đưa ra cũng sẽ ảnh hưởng đến tương lai của [Owner.GetSpeciesName] cho nhiều thế hệ mai sau."
 bio.1005.tt: "Thêm một Đặc tính Loài mới vào Loài Chính của chúng ta"
 bio.1005.pop_growth: "Loài của chúng ta cần phát triển nhanh hơn!"
 bio.1005.pop_output: "Liệu chúng ta có thể làm việc hiệu quả hơn?"
 bio.1005.leader: "Các thủ lĩnh của chúng ta cần mọi ưu thế."
 bio.1005.habitability: "Chúng ta cần thích nghi với những vùng khí hậu luôn thay đổi."
 bio.1005.upkeep: "Giảm bớt chi phí duy trì cần thiết để nuôi sống đồng loại."
 bio.1005.humanoid: "Đặc tính Nhân hình có thể nâng cao tính đa dụng của chúng ta."
 bio.1005.mammalian: "DNA Thú có vú nắm giữ nhiều bí mật hơn."
 bio.1005.reptilian: "Loài bò sát khá độc đáo."
 bio.1005.avian: "Điểu tộc có thể ban cho chúng ta sự nhanh nhẹn vô song."
 bio.1005.arthropoid: "Chân đốt giòn tan thật thú vị."
 bio.1005.molluscoid: "Ngay cả loài thân mềm cũng có thể dạy chúng ta điều gì đó."
 bio.1005.fungoid: "Nấm tộc lan tràn nhanh chóng — chúng ta cũng có thể làm vậy."
 bio.1005.plantoid: "Hiệu suất năng lượng của thực vật tộc có thể rất hữu ích."
 bio.1005.lithoid: "Khó tiêu thụ, nhưng DNA Thạch tộc đem lại những triển vọng ngon lành."
 bio.1005.necroid: "Máu thịt hoại tử vẫn là máu thịt."
 bio.1005.aquatic: "Sự thích nghi của thủy tộc mang lại những chiến lược sinh tồn vượt ra ngoài đại dương."
 bio.1005.toxoid: "Độc tộc có vị §Gchua gắt§!."
 bio.1005.infernal: "Loài ưa nhiệt §Rbỏng rát§!, nhưng giờ đây chúng ta có thể kiểm soát được."
 bio.1005.plasmic: "Ổn định được DNA Thể Plasma sẽ là một kỳ tích ấn tượng."
 bio.1005.leviathan: "Những Cự Thú của thiên hà có thể dạy chúng ta điều gì?"
 bio.1005.psionic: "Điều gì bên trong bộ gen Linh Năng đã thúc đẩy năng lực nhận thức siêu việt như vậy?"
 bio.1005.random: "Đón nhận sự hỗn loạn — hãy để bản năng dẫn lối chúng ta!"
 bio.1005.no_reward: "Chúng ta đã đủ phức tạp rồi."
 bio.1005.unnatural_selection: "Hãy để đột biến khai mở những năng lực vượt ra ngoài giới hạn tự nhiên!"
 has_tr_mutation_unnatural_selection_evo_pred_tt: "Tùy chọn này khả dụng nhờ việc lựa chọn Truyền thống §Y$tr_mutation_unnatural_selection$§!."
 has_tr_mutation_nucleotide_isolation_evo_pred_tt: "Tùy chọn này khả dụng nhờ việc lựa chọn Truyền thống §Y$tr_mutation_nucleotide_isolation$§!."

 #Modifiers
 fresh_biosphere: "Sinh Quyển Mới Mẻ"
 fresh_biosphere_desc: "Một thế giới mới để nếm trải và đồng hóa. Những người định cư đang trong quá trình lập danh mục và tìm hiểu tất cả những gì hành tinh này mang lại."
 fresh_biosphere_tt: "Tiến độ Tình huống §Y$evolutionary_predators_situation$§! Hàng tháng: §G+10§!"
 exhausted_biosphere: "Sinh Quyển Cạn Kiệt"
 exhausted_biosphere_desc: "Không còn gì để khám phá ở đây nữa; những người định cư từng lùng sục từng phiến đá để tìm dấu hiệu độc đáo về sinh học giờ đây đã thỏa mãn."
 exhausted_biosphere_tt: "Tiến độ Tình huống §Y$evolutionary_predators_situation$§! Hàng tháng: §G+1§!"
 genetic_soup: "Canh Di Truyền"
 genetic_soup_desc: "Từ thuở xa xưa, thế giới này đã sản sinh ra những điều kỳ lạ về mặt di truyền. Sự đa dạng sinh sống trên những vùng đất này dường như bất tận."
 turtle_world_modifier_evopred: "Thế Giới Nemma: Lập Danh Mục"
 turtle_world_modifier_evopred_desc: "Cư dân trên thế giới này nhanh chóng quan sát và thu thập nét độc đáo về di truyền của hệ động vật địa phương."
 eat_the_titans_evopred: "$eat_the_titans$"
 eat_the_titans_evopred_desc: "$eat_the_titans_desc$"
 eat_the_titans_evopred_tt: "$fresh_biosphere_tt$\n$farmer_is_titan_hunter_tt$"
 eat_the_titans_evopred_hive: "$eat_the_titans$"
 eat_the_titans_evopred_hive_desc: "$eat_the_titans_desc$"
 eat_the_titans_evopred_hive_tt: "$fresh_biosphere_tt$"

 #Jobs

 evolutionary_predators_pops_tt: "Tiến độ Tình huống §Y$evolutionary_predators_situation$§! Hàng tháng: §G+0.1§!"

 #Espionage
 operation_evolutionary_predator_procure_dna: "Thu Thập DNA"
 operation_evolutionary_predator_procure_dna_desc: "Chúng ta có thể trực tiếp hơn trong việc thu thập vật liệu di truyền — bằng cách thâm nhập vào loài này và thu thập kín đáo số DNA không người trông coi."
 operation_evolutionary_predator_procure_dna_on_success: "$IF_SUCCESSFUL|E$\nĐạt được tiến độ nhỏ cho tình huống §Y$evolutionary_predators_situation$§! và thu được DNA của loài chính."
 operation_evolutionary_predator_procure_dna_preftl: "$operation_evolutionary_predator_procure_dna$"
 operation_evolutionary_predator_procure_dna_preftl_on_success: "$operation_evolutionary_predator_procure_dna_on_success$"
 bio.1050.name: "Rình Rập"
 bio.1050.desc: "Các đặc vụ của chúng ta đang rình rập quanh các khu định cư của [Target.GetSpeciesName] và sẽ sớm tiếp cận được các công trình của họ. Mọi thứ đều cần đúng thời điểm. Chúng ta là một giống loài kiên nhẫn; những cuộc đi săn hay nhất không bao giờ vội vã."

 bio.1055.name: "Vào Vị Trí"
 bio.1055.desc: "Con mồi đã ở trong tầm mắt. Những thợ săn chúng ta cử đi xâm nhập [Target.GetName] đang rất tự tin. Họ sẽ sớm tiếp cận được khu cư xá của [Target.GetSpeciesName], và toàn bộ số DNA quý giá bên trong."

 bio.1060.name: "Vồ Mồi"
 bio.1060.desc: "Các đặc vụ của chúng ta đã sẵn sàng. Họ đã tiếp cận được khu cư xá của [Target.GetSpeciesName] cũng như có các lớp vỏ ngụy trang thích hợp. Đương nhiên, giống như bất kỳ thợ săn cừ khôi nào, họ đã đảm bảo nhiều tuyến đường thoát hiểm, một số tuyến dễ chịu hơn những tuyến khác. Sẽ thật không may nếu chúng ta phải sử dụng đến đường cống ngầm."

 bio.1065.name: "Đánh Cắp Gen Thành Công"
 bio.1065.desc: "Đã xong! Các đặc vụ của chúng ta đã rút lui với một kho tàng vật liệu di truyền phong phú. Chúng ta chắc chắn sẽ chứng kiến những bước tiến vượt bậc khi đột biến tiếp theo diễn ra. Thậm chí có lẽ chúng ta sẽ hình thành khẩu vị đối với loài [From.Target.GetSpeciesName]."

