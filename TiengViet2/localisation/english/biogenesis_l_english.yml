 # Hive Advanced Authorities

 auth_bio_hive_purity: "Nhất Thể Thuần Khiết"
 auth_bio_hive_purity_desc: "Một tâm thức thống nhất sinh ra từ cấu trúc di truyền hoàn mỹ. Sự hòa hợp của bầy đàn không phải là kết quả của sự cưỡng chế, mà là bản năng tự nhiên bắt nguồn từ chính sự thuần khiết tuyệt đối của dòng giống. Không có bất kỳ sai lệch nào được dung thứ trong mạng lưới tinh tế này, nơi mỗi cá thể đều là biểu hiện chân thực cho ý chí hoàn hảo duy nhất của tâm thức."
 auth_bio_hive_purity_tt: "$pop_effects_from_purity_header$ $TABBED_NEW_LINE$- £unity£ $unity$ Được tạo ra mỗi $pop_group_unit$ £pop£ Pop: $plus_minus_icon$§Y$@purity_traits_resource$§! $DOUBLE_NEW_LINE$"
 auth_bio_hive_cloning: "Bầy Đàn Nhân Bản"
 auth_bio_hive_cloning_desc: "Tâm thức bầy đàn này coi các cá thể của mình như những phần mở rộng có thể dễ dàng thay thế, được tạo ra và thanh trừng theo nhu cầu sinh tồn. Các khoang nhân bản hoạt động không ngừng nghỉ để bổ sung cho các tổ chức suy kiệt, duy trì dòng chảy sinh khối liên tục để phục vụ cho sự trường tồn và bành trướng của toàn mạng lưới."
 auth_bio_hive_cloning_tt: "$ENABLES_BACKUP_CLONES$\n['concept_clone_leader_degradation', Sự Suy Thoái Nhân Bản] được giảm bớt bởi £society£ ['technology:tech_node_culling_1']"
