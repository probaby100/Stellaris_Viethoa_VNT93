 # PURITY

 bio.200.name: "Đón Nhận Di Sản Của Chúng Ta"
 bio.200.desc: "Bổ sung cho sự tập trung cao độ vào việc tinh lọc di truyền, chúng ta đang nhận ra tất cả những điều làm nên sự vĩ đại của nền văn minh mình.\n\nKhi trở nên thuần khiết hơn bao giờ hết, chúng ta chưa từng tự hào hơn về di sản vượt trội của mình.\n\nCác chuyên gia từ mọi lĩnh vực: nghệ thuật, khoa học và kinh doanh, đều đang cổ vũ cho những nỗ lực tập thể của chúng ta, và hy vọng sẽ dẫn lối đến vinh quang."
 bio.200.a: "Chúng ta sẽ tôn vinh cột mốc này bằng cách tài trợ cho nghệ thuật!"
 bio.200.b: "Nghiên cứu khoa học luôn phải được đặt lên hàng đầu."
 bio.200.c: "Tiêu dùng là cốt lõi của nền kinh tế."

 bio.210.name: "Chúng Tôi Sẽ Không Bị Tinh Lọc!"
 bio.210.desc: "Tiếng hô vang từ những người biểu tình vang vọng khắp các thành phố của chúng ta. Một phe phái nổi loạn bên trong đế chế đã tự ý từ chối đại nghiệp của chúng ta, quay lưng lại với con đường dẫn đến sự thuần khiết.\n\nNhững kẻ gây rối này rao giảng về nhu cầu được cho là cần thiết đối với sự đa dạng di truyền và hội nhập văn hóa.\n\nNếu hành vi hoạt động của họ tiếp tục không được giải quyết, có nguy cơ tiến trình hướng tới sự thuần khiết của chúng ta sẽ chùn bước."
 bio.210.a: "Dập tắt những kẻ bất đồng chính kiến này!"
 bio.210.b: "Xoa dịu họ bằng những lời hứa suông."

 bio.215.name: "Bí Mật Của Quá Khứ"
 bio.215.desc: "Các nhà khảo cổ học đã phát hiện ra bằng chứng về một nền văn minh cổ đại từ hành tinh quê hương của tổ tiên chúng ta.\n\nMột hầm chứa chôn sâu từ lâu đã được khai quật, và bên trong có bằng chứng đáng kinh ngạc về các thí nghiệm di truyền trong quá khứ.\n\nNếu tin tức này được công chúng biết đến, nó có thể làm suy yếu các tuyên bố hiện đại của chúng ta về độ thuần khiết di truyền."
 bio.215.a: "Tích hợp nghiên cứu này vào nghiên cứu của chúng ta. Xây dựng dựa trên quá khứ."
 bio.215.b: "Phá hủy bằng chứng. Không ai được phép biết điều này."

 bio.220.name: "Khoa Học Kỳ Quái"
 bio.220.desc: "Một nhà di truyền học bất hảo mang tên [event_target:rogue_geneticist.GetName] đã bị phát hiện đang tiến hành các thí nghiệm sinh học trái phép. Phớt lờ mọi hướng dẫn an toàn, mục tiêu của [event_target:rogue_geneticist.GetHisHer] là tạo ra một giống loài siêu việt hiện thân cho các lý tưởng thuần khiết mà chúng ta hướng tới. Thay vào đó, [event_target:rogue_geneticist.GetHeShe] đã sinh ra một sinh vật gớm ghiếc.\n\nMột phân loài gồm những sinh vật đoản thọ, mang một số khía cạnh trong hồ sơ di truyền của chúng ta nhưng phần lớn là những nỗi kinh hoàng đầy bệnh tật, hiện đang tàn lụi trong sự giam giữ của chúng ta. Dù nghiên cứu về cấu trúc gen của chúng đã mang lại kết quả, tiên lượng vẫn là tử vong. [event_target:rogue_geneticist.GetName] không hề ăn năn."
 bio.220.a: "Cách chức kẻ bất hảo này khỏi vị trí của họ!"
 bio.220.a.tt: "[event_target:rogue_geneticist.GetName] bị buộc phải nghỉ hưu."
 bio.220.b: "\"Bịt miệng\" [event_target:rogue_geneticist.GetName]."
 bio.220.c: "Đây chính là kiểu sáng kiến mà chúng ta cần!"

 bio.225.name: "Bê Bối Thuần Khiết!"
 bio.225.desc: "Sau khi triển khai các cuộc xét nghiệm di truyền định kỳ để đẩy nhanh con đường hướng tới sự thuần khiết và xác định các cá thể dị biệt về gen, DNA 'chất lượng cao' đã trở thành điều đáng để khoe khoang.\n\nMột số quan chức đế chế bị cáo buộc đã nói dối về cấu trúc sinh học của họ, làm giả kết quả xét nghiệm để cho thấy họ có nhiều đặc tính mong muốn hơn thực tế. Nếu bị vạch trần, sự che giấu sự thật này có nguy cơ khiến công chúng phẫn nộ."
 bio.225.a: "Thực hiện các cuộc kiểm tra kỹ lưỡng đối với tất cả những ai bị nghi ngờ."
 bio.225.b: "Một chút dối trá cũng chẳng hại ai."

 ### ADDITIONAL RANDOM EVENTS
 ## NON-HIVE
 # CLONING

 bio.230.name: "Đột Biến Trí Não"
 bio.230.desc: "Một nhà thần kinh học nổi tiếng đã phát triển một phương pháp kích thích vỏ não bằng cách sử dụng các đột biến sinh học có chủ đích. Kết quả ban đầu cho thấy sự gia tăng rõ rệt về trí thông minh và khả năng học hỏi ở các đối tượng thử nghiệm.\n\nTuy nhiên, phương pháp điều trị này cũng đi kèm với tác dụng phụ: những người được tăng cường trở nên lạnh lùng, vô cảm và xa cách với những người xung quanh.\n\nChúng ta phải quyết định liệu có nên phổ biến phương pháp này cho toàn thể công dân hay không."
 bio.230.a: "Trí tuệ là tất cả. Phổ biến ngay lập tức!"
 bio.230.b: "Cảm xúc con người quan trọng hơn trí thông minh thuần túy."

 bio.235.name: "Bản Sao Vô Hình"
 bio.235.desc: "Một loạt vụ trộm cắp bí ẩn đã xảy ra tại các cơ sở nghiên cứu tuyệt mật của chúng ta. Không có dấu hiệu đột nhập, và các hệ thống an ninh không ghi nhận bất kỳ sự xâm nhập nào.\n\nTuy nhiên, các cuộc điều tra nội bộ đã phát hiện ra rằng thủ phạm là những bản sao nhân bản có khả năng tàng hình quang học bẩm sinh — một đột biến bất ngờ trong quá trình sản xuất bản sao.\n\nNhững bản sao này dường như đang thu thập các bí mật công nghệ cho một mục đích chưa rõ."
 bio.235.a: "Nâng cấp hệ thống phát hiện và bắt giữ các bản sao vô hình!"
 bio.235.a.tt: "Tốc độ tiến độ Tình huống §Y$genetic_ascension_situation$§! trong §Y12§! tháng: §R-50%§!"
 biomorphosis_stalled_tt: "Tốc độ tiến độ Tình huống §Y$genetic_ascension_situation$§! trong §Y12§! tháng:"
 bio.235.b: "Tìm cách liên lạc và chiêu mộ họ vào cơ quan tình báo của chúng ta."

 bio.240.name: "Tiếng Gọi Của Rừng Sâu"
 bio.240.desc: "Những công dân trải qua các đột biến thích nghi với môi trường hoang dã đang bắt đầu cảm thấy sự thôi thúc mãnh liệt muốn từ bỏ cuộc sống đô thị văn minh để quay về với thiên nhiên.\n\nHàng ngàn người đang rời bỏ các thành phố, lập nên những cộng đồng tự cung tự cấp sâu trong các khu rừng nguyên sinh và vùng hoang dã xa xôi.\n\nSự di cư này đang làm sụt giảm lực lượng lao động tại các trung tâm công nghiệp lớn của chúng ta."
 bio.240.a: "Tôn trọng quyền tự do lựa chọn lối sống của họ."
 bio.240.b: "Cưỡng chế đưa họ trở lại làm việc tại các đô thị."
 bio.240.b.tt: "Mỗi §YThủ lĩnh £leader£§! thuộc Loài chính của Đế chế nhận §G+200§! Kinh nghiệm."

 bio.250.name: "Kén Ấp Bí Mật"
 bio.250.desc: "Một trinh sát hạm đội đã phát hiện một cấu trúc sinh học khổng lồ trôi dạt tại rìa của một hệ sao hẻo lánh. Quét sơ bộ cho thấy đây là một kén ấp cổ đại chứa các mẫu vật di truyền của hàng trăm loài sinh vật đã tuyệt chủng từ lâu.\n\nCác mẫu vật này có thể cung cấp những hiểu biết vô giá về lịch sử tiến hóa của thiên hà, nhưng cũng tiềm ẩn nguy cơ giải phóng các mầm bệnh cổ xưa nguy hiểm."
 bio.250.a: "Cẩn thận thu hồi và nghiên cứu các mẫu vật trong điều kiện cách ly tuyệt đối."
 bio.250.b: "Phá hủy nó từ xa để phòng ngừa mọi hiểm họa."

 ### ADDITIONAL RANDOM EVENTS
 ## NON-HIVE
 # MUTATION

 bio.260.name: "Đồng Hóa Bản Sao"
 bio.260.desc: "Một đề xuất táo bạo được đưa ra bởi các cố vấn: sử dụng các bản sao nhân bản để thay thế toàn bộ lực lượng lao động chân tay nguy hiểm và nặng nhọc, cho phép các công dân gốc tập trung vào các hoạt động sáng tạo và quản lý.\n\nTuy nhiên, các nhà đạo đức học cảnh báo rằng điều này sẽ tạo ra một tầng lớp nô lệ nhân bản, làm xói mòn các giá trị đạo đức căn bản của nền văn minh chúng ta."
 bio.260.a: "Triển khai kế hoạch! Hiệu quả kinh tế là không thể chối từ."
 bio_260_opinion_tt: "Ý kiến của các đế chế §YPhái Tâm Linh§! đối với chúng ta thay đổi: §R-50§!"
 bio.260.b: "Bác bỏ đề xuất. Mọi sinh mệnh đều có phẩm giá."
 bio.260.b.tt: "Mỗi §YThủ lĩnh £leader£ Chuyên Chế§! nhận Đặc tính §Y$leader_trait_eager$§!."

 bio.265.name: "Đột Biến Xuất Chúng"
 bio.265.desc: "Một tỷ lệ nhỏ dân số của chúng ta đã phát triển các khả năng phi thường và nâng cao thể chất nhờ vào các thử nghiệm đột biến của riêng họ.\n\nLà những cá nhân mạnh mẽ và tài năng độc đáo, họ đang hình thành một cộng đồng và thu hút rất nhiều sự chú ý từ công chúng."
 bio.265.a: "Thành công của họ có thể truyền cảm hứng cho những người khác."
 bio.265.b: "Nghe có vẻ họ sẽ trở thành những người lính xuất sắc."
 bio.265.b.tt: "Tạo ra một §Y$gene_warrior_army$§! trên §Y[Owner.capital_scope.GetName]§!."
 bio_265_opinion_tt: "Ý kiến của các đế chế §YQuân Phiệt§! đối với chúng ta thay đổi: §G+50§!"
 bio.265.c: "Tìm hiểu cách họ đã làm điều này và nhân rộng nó."

 bio.270.name: "Truyền Thuyết Đô Thị Trỗi Dậy"
 bio.270.desc: "Hệ thống giám sát đã xác nhận sự tồn tại của một nhóm dân cư gồm những cá nhân bị biến đổi gen sinh sống trong các hệ thống cống ngầm đô thị — một sự hồi ứng đáng lo ngại đối với những truyền thuyết đô thị từng bị gạt bỏ từ lâu.\n\nPhát hiện này đã làm gia tăng căng thẳng xã hội, với việc những công dân bị đột biến rõ rệt báo cáo sự phân biệt đối xử ngày càng tăng khi nỗi sợ hãi về điều chưa biết leo thang. Tuy nhiên, những cá nhân này đã thể hiện sự khéo léo đáng kể, tận dụng khí cống ngầm để sản xuất tài nguyên và thích nghi với môi trường của họ theo những cách không ngờ tới."
 bio.270.a: "Quét sạch cống ngầm!"
 bio.270.b: "Những kẻ đột biến này có thể đã tìm ra điều gì đó..."

 bio.280.name: "Lây Nhiễm Đột Biến"
 bio.280.desc: "Sự bùng phát của một căn bệnh mới đang lan rộng khắp đế chế của chúng ta. Căn bệnh gây ra hàng loạt triệu chứng khó chịu, bao gồm nhưng không giới hạn ở: sự tống xuất không tự chủ của không khí và chất lỏng, sự mệt mỏi suy nhược, và trong một số trường hợp là mất mạng.\n\nĐiều kỳ lạ nhất là căn bệnh này chỉ ảnh hưởng đến những người đã biến đổi sinh lý theo những cách nhất định bằng đột biến di truyền. Nghiên cứu liên tục về bộ gen biến đổi của họ đã mang lại một số hiểu biết đáng ngạc nhiên."
 bio.280.a: "Tìm kiếm một ứng dụng điều trị."
 bio.280.b: "Vũ khí hóa căn bệnh."
 bio_280_opinion_tt: "Ý kiến của các đế chế §YDuy Vật§! đối với chúng ta thay đổi: §R-50§!"

 ### ADDITIONAL RANDOM EVENTS
 ## NON-HIVE
 # ANY APPROACH

 bio.295.name: "Tế Bào Nổi Loạn"
 bio.295.desc: "Các Cơ sở Nghiên cứu Bộ Gen của chúng ta đã cấp cho toàn bộ nền văn minh quyền tiếp cận sự biến đổi sinh lý không giống bất kỳ điều gì chúng ta từng trải qua.\n\nTuy nhiên, các công dân của đế chế chúng ta muốn nhiều hơn thế. Đang có những lời kêu gọi chia nhỏ các nguồn lực tập trung, và cho phép những người được gọi là \"tin tặc sinh học\" tự do và không bị hạn chế tiếp cận công nghệ gen."
 bio.295.a: "Trao cho các tin tặc sinh học nhiều quyền tự chủ hơn."
 bio.295.b: "Công dân bình thường đã có quá nhiều sự tự do rồi."
 bio_295_opinion_tt: "Ý kiến của các đế chế §YBình Đẳng§! đối với chúng ta thay đổi: §G+50§!"

 bio.300.name: "Nhà Di Truyền Học Thiên Tài"
 bio.300.desc: "Một [Owner.GetScientist] mang tên [event_target:genius_geneticist.GetName] vừa xuất bản một công trình nghiên cứu học thuật có thể được sử dụng để đẩy nhanh và cải thiện đáng kể hiệu quả cũng như tính hữu hiệu của các thí nghiệm di truyền của chúng ta.\n\nHoàn toàn mang tính lý thuyết, phương pháp mới này chưa được thử nghiệm, vì vậy phương pháp luận sẽ đòi hỏi sự cân nhắc cẩn thận để có thể áp dụng an toàn vào các quy trình của chúng ta."
 bio.300.a: "Ghi nhận những đóng góp của [event_target:genius_geneticist.GetName]."
 bio.300.b: "Những ý tưởng — và cá nhân — phù phiếm sẽ không được dung thứ."
 bio.300.c: "Mọi người hãy quay trở lại làm việc."

 ### ADDITIONAL RANDOM EVENTS
 ## HIVE
 # PURITY

 bio.310.name: "Xâm Phạm Độ Thuần Khiết Của [target.GetGestaltEntityName]"
 bio.310.desc: "Giống loài chúng ta đã bị xâm nhập bởi một đoạn mã di truyền bất hảo, một hệ quả từ việc thử nghiệm liên tục trong biến đổi gen. Chúng ta đang trở nên yếu đi với tốc độ đáng báo động, mất ổn định do sự tương tác không được kiểm soát của chuỗi ngoại lai này với vật liệu di truyền của chính chúng ta.\n\nChúng ta phải giải quyết hành vi sinh học dị thường này trước khi quá muộn."
 bio.310.a: "Thanh trừng chất gây ô nhiễm."
 bio.310.b: "Hãy để chúng ta nghiên cứu nó."

 bio.315.name: "Tận Tụy Vì Đại Nghiệp"
 bio.315.desc: "Nếu nền văn minh của chúng ta muốn trở nên thuần khiết, trước hết chúng ta phải cân nhắc đến sức khỏe của [target.GetGestaltEntityName]. Quy trình biến đổi gen phải đảm bảo rằng mọi sự thích nghi đều nâng cao khả năng kiên cường của tập thể.\n\nBắt đầu sai đường — đưa vào những thay đổi gây mất ổn định hoặc làm suy yếu sự gắn kết — có thể dẫn đến thảm họa, đe dọa chính nền tảng đoàn kết của chúng ta."
 bio.315.a: "Tập trung vào sức bền thể chất."
 bio.315.b: "Hiệu quả nhận thức là tối quan trọng."

 bio.325.name: "Vượt Lên Hiện Tại"
 bio.325.desc: "Để đảm bảo tuổi thọ và độ thuần khiết của giống loài, chúng ta phải thực hiện việc lai tạo có chọn lọc hơn và các quy trình sàng lọc di truyền nghiêm ngặt hơn.\n\nChỉ bằng cách cẩn thận lựa chọn những cá thể công nhân xứng đáng để tiếp nối dòng dõi, chúng ta mới có thể vượt lên trên sự tiến hóa tự nhiên."
 bio.325.desc.wilderness: "Để đảm bảo tuổi thọ và độ thuần khiết của tập thể cộng sinh của chúng ta, chúng ta phải thực hiện việc lai tạo có chọn lọc hơn và các quy trình sàng lọc di truyền nghiêm ngặt hơn.\n\nChỉ bằng cách cẩn thận lựa chọn những sinh vật cộng sinh khả thi với các đặc tính mang lại lợi ích cho tập thể, chúng ta mới có thể vượt ra ngoài các ranh giới ban đầu của mình."
 bio.325.a: "Chúng ta sẽ sàng lọc trí tuệ."
 bio.325.b: "Chúng ta sinh sản để mở rộng."

 bio.330.name: "Thăng Hoa Tháo Vát"
 bio.330.desc: "Phần thưởng từ biến đổi di truyền sẽ bảo đảm di sản của chúng ta, nhưng vai trò của mỗi [target.GetIndividualName], từng chút nỗ lực, đều phải đồng điệu với tầm nhìn thuần khiết của chúng ta.\n\nGiờ đây chúng ta đối mặt với quyết định then chốt: liệu chúng ta có nên tối ưu hóa cho sự hoàn hảo với cái giá là khả năng thích nghi? Hay chúng ta nên đón nhận một chiến lược rộng lớn hơn, ưu tiên cơ sở hạ tầng cần thiết để duy trì những nỗ lực này?"
 bio.330.a: "Trở nên thuần khiết phải là trọng tâm duy nhất của chúng ta."
 bio.330.b: "Chúng ta phải dành thời gian để phát triển cơ sở hạ tầng."

 bio.335.name: "Thanh Trừng Khiếm Khuyết"
 bio.335.desc: "Chúng ta đã cô lập được một số tạp chất và dị thường di truyền bên trong [target.GetGestaltEntityName].\n\nKhi chúng ta nỗ lực hướng tới những mục tiêu lớn hơn, chúng ta phải loại bỏ những đặc tính khiếm khuyết này và giành lại quyền kiểm soát sự phát triển thể chất từ tay quá trình tiến hóa tự nhiên."
 bio.335.a: "Loại bỏ kẻ yếu để củng cố toàn thể."
 bio.335.b: "Tái thiết kế những cá thể khiếm khuyết."
 bio_335_opinion_tt: "Ý kiến của các đế chế §YThiên Về Nhân Từ§! đối với chúng ta thay đổi: §R-50§!"

 ### ADDITIONAL RANDOM EVENTS
 ## HIVE
 # CLONING

 bio.340.name: "Quá Nhiều Bản Sao!"
 bio.340.desc: "Các cơ sở nhân bản của chúng ta đang vận hành hiệu quả hơn so với dự kiến ban đầu, do đó hiện tại chúng ta có một lượng thặng dư bản sao.\n\nViệc tích hợp số lượng lớn công nhân như thế này đang tỏ ra đầy thách thức."
 bio.340.a: "Những thành viên mới bổ sung cho bầy đàn nên được di cư."
 bio.340.b: "Gia tăng sản xuất. Thúc đẩy các bản sao."

 bio.350.name: "Lớp Vỏ Rỗng"
 bio.350.desc: "Một số công nhân đã bị ảnh hưởng sau một tai nạn nhân bản nghiêm trọng. Tước đi nhận thức cao hơn và khả năng suy nghĩ phức tạp, những cá thể này giờ đây lơ lửng trong trạng thái tiền trí khôn nguyên thủy.\n\nTrong khi một số người trong bầy đàn cảm thấy nhẹ nhõm trước sự giản dị của tâm trí họ, những người khác lại coi việc tạo ra những cá thể như vậy là một sự lãng phí tài nguyên đáng tiếc."
 bio.350.a: "Điều này đem lại cảm giác... thật êm dịu."
 bio.350.a.tt: "100 £pop£ §HDân Cư Tiền Trí Khôn§! được tạo ra trên §Y[owner.capital_scope.GetName]§!."
 bio.350.b: "Nuôi cấy một mẻ mới."

 bio.365.name: "Siêu Hình Học Bầy Đàn"
 bio.365.desc: "Từ bên trong ý thức, một câu hỏi đã vang lên trong tâm trí bầy đàn: nếu chúng ta là tổng hòa của các bộ phận tạo nên mình, thì điều gì sẽ định nghĩa chúng ta khi các bộ phận đó liên tục bị đột biến và thay thế?\n\nMột số cá thể công nhân đang dành những tài nguyên nhận thức có giá trị để suy ngẫm về những câu hỏi siêu hình học này, làm chậm lại hiệu quả vận hành của chúng ta."
 bio.365.a: "Bản thân câu hỏi đã mang lại giá trị."
 bio.365.b: "Những câu hỏi như vậy chỉ là sự phân tâm."

 ### ADDITIONAL RANDOM EVENTS
 ## HIVE
 # MUTATION

 bio.375.name: "Kết Nối Sâu Sắc Hơn"
 bio.375.desc: "Chúng ta đã tạo ra một phát hiện mới. Bằng cách thao túng các gen cụ thể, chúng ta có thể mở rộng phạm vi ý thức của mình để mang lại cho chúng ta các giác quan nâng cao vượt ra ngoài những gì chúng ta từng nghĩ là giới hạn của giống loài.\n\nViệc thực hiện các đột biến này trên toàn bầy đàn sẽ đòi hỏi một lượng năng lượng lớn, nhưng làm như vậy có thể làm sâu sắc thêm sự hiểu biết của chúng ta về vũ trụ cũng như vị thế của chúng ta bên trong nó."
 bio.375.a: "Chi phí là không đáng kể. Tiến hành."
 bio.375.b: "Quy trình không được phép vội vã."
 mod_planet_evaluators_physics_research_produces_add: "£physics_research£ $physics_research$ trên mỗi $pop_group_unit$ [evaluator.GetIcon] [evaluator.GetNamePlural]"

 bio.380.name: "Cảm Xúc Choáng Ngợp"
 bio.380.desc: "Toàn bộ các phân khu của bầy đàn đang trải qua những đợt trào dâng cơn thịnh nộ mất kiểm soát, một làn sóng cảm xúc đã gửi những gợn sóng qua ý thức chung, khuếch đại nỗi đau đớn và sự thất vọng tập thể của chúng ta.\n\nMột đột biến được đưa vào gần đây dường như đang kích thích quá mức các tế bào thần kinh trong các trung tâm kiểm soát sự hung hãn của các cá thể công nhân của chúng ta, phá vỡ sự cân bằng cảm xúc của bầy đàn. Các cuộc xung đột nổ ra thường xuyên hơn, với một số công nhân từ bỏ nhiệm vụ và tấn công những kẻ khác."
 bio.380.a: "Là một thể thống nhất, chúng ta sẽ lưu tâm chánh niệm."
 bio.380.b: "Đón nhận cơn thịnh nộ này."

 bio.385.name: "Không Dung Nạp Môi Trường"
 bio.385.desc: "Trong khi một số đột biến khích lệ và tăng cường sức mạnh cho chúng ta, chúng ta nhận thấy rằng những đột biến khác lại đi kèm với các tác dụng phụ khó chịu.\n\nNhững nâng cấp nhằm tăng tuổi thọ của chúng ta đang được thực hiện thành công, tuy nhiên chính những đột biến này lại làm giảm khả năng chịu đựng của chúng ta đối với các vùng khí hậu khắc nghiệt.\n\nNhững ai trong số chúng ta đã trải qua các biến đổi sinh học này đang gặp khó khăn trong việc điều hòa hệ thống điều nhiệt nội tại, và sự khó chịu được cảm nhận trên toàn bộ bầy đàn."
 bio.385.a: "Chúng ta phải nâng cấp các hệ thống bảo vệ trước thời tiết."
 bio.385.b: "Khi chúng ta thay đổi, sở thích môi trường của chúng ta cũng thay đổi."
 uncomfortable_drones: "Các Cá Thể Công Nhân Bất An"
 uncomfortable_drones_desc: "Các công nhân của chúng ta phải chật vật vượt qua sự khó chịu do đột biến mang lại."

 bio.390.name: "Sức Mạnh Hay Trí Não"
 bio.390.desc: "Một cặp đột biến đã được xác định. Một biến thể nâng cao sức mạnh của các cá thể công nhân lao động chân tay, cải thiện đáng kể hiệu quả lao động. Biến thể còn lại mài sắc trí tuệ của các cá thể công nhân phức hợp, thúc đẩy khả năng giải quyết vấn đề và chiến lược.\n\nBầy đàn phải quyết định con đường nào để đón nhận."
 bio.390.a: "Sức mạnh là tiến bộ."
 bio.390.b: "Chúng ta tư duy, do đó chúng ta phồn vinh."

 ### ADDITIONAL RANDOM EVENTS
 ## HIVE
 # ANY APPROACH

 bio.405.name: "Hệ Gen Nhiễm Bệnh"
 bio.405.desc: "Chúng ta vừa suýt không kiểm soát được sự bùng phát bất ngờ của một dịch bệnh di truyền.\n\nViệc thao túng sinh học của chính mình đã kích hoạt các đột biến bất hảo trong DNA, khiến nhiều [target.GetIndividualNamePlural] bị tổn hại thể chất.\n\nNhững [target.GetIndividualNamePlural] bị ảnh hưởng đã được cách ly, và giờ đây chúng ta phải quyết định cách thức tiến lên."
 bio.405.a: "Xử lý các [target.GetIndividualNamePlural], chấm dứt dịch bệnh."
 bio.405.b: "Nghiên cứu những cá thể bị ảnh hưởng."

 bio.410.name: "Tế Bào Phân Rã"
 bio.410.desc: "Một sai sót trong các tính toán của chúng ta đã dẫn đến sự suy giảm tính toàn vẹn di truyền ở một số lượng đáng kể các công nhân. Thật không may, chúng ta vẫn chưa thể xác định được sai sót xảy ra ở bước nào.\n\nSau khi rà soát lại các phép tính sinh học liên quan đến việc nâng tầm giống loài và sửa đổi một số quy trình tiềm ẩn rủi ro, chúng ta đã sẵn sàng tiếp tục nỗ lực của mình.\n\nTuy nhiên, vẫn chưa thể chắc chắn liệu chúng ta đã thực sự khắc phục lỗi hay tệ hơn là đưa vào thêm nhiều sai sót khác."
 bio.410.desc.wilderness: "Một sai sót trong các tính toán của chúng ta đã dẫn đến sự suy giảm tính toàn vẹn di truyền ở một số lượng đáng kể các cộng sinh vật. Thật không may, chúng ta vẫn chưa thể xác định được sai sót xảy ra ở bước nào.\n\nSau khi rà soát lại các phép tính liên quan đến việc thích nghi các bộ phận cấu thành và sửa đổi một số dung dịch enzym mất cân bằng, chúng ta đã sẵn sàng tiếp tục nỗ lực của mình.\n\nTuy nhiên, vẫn chưa thể chắc chắn liệu chúng ta đã thực sự khắc phục lỗi hay tệ hơn là đưa vào thêm nhiều sai sót khác."
 bio.410.a: "Chúng ta có thể học hỏi từ bất cứ điều gì xảy ra tiếp theo."
 bio.410.b: "Tạm dừng các thử nghiệm."
 bio.410.b.tt: "$bio.235.a.tt$"

