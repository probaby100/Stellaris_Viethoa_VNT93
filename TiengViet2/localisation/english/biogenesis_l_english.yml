 unlocks_ship_2_bio: "Mở khóa công nghệ chế tạo tàu §Y$mauler_class_cap$§! và §Y$weaver_class_cap$§! của Đế Chế Sa Ngã.\n"
 menp_cosmo_ship_2_desc_bio: "Bằng cách bẻ cong mối quan hệ giữa không gian và thời gian, những con tàu này vượt qua các giới hạn thông thường. Khung thân nhỏ gọn của chúng che giấu những khả năng mà không con tàu nào tuân theo quy luật vật lý có thể sánh kịp."
 menp_cosmo_ship_3_desc_bio: "$tech_cosmogenesis_harbinger_desc$"
 unlocks_ship_3_bio: "Mở khóa công nghệ chế tạo tàu §Y$harbinger_class_cap$§! của Đế Chế Sa Ngã"
 menp_cosmo_ship_4_desc_bio: "$tech_cosmogenesis_stinger_desc$"
 unlocks_ship_4_bio: "Mở khóa công nghệ chế tạo tàu Titan §Y$stinger_class_cap$§! của Đế Chế Sa Ngã"

 tech_cosmogenesis_mauler: "Tàu Cắn Mật Mã"
 tech_cosmogenesis_mauler_desc: "Thông qua thuyết siêu việt chiều không-thời gian hữu cơ, Tàu Cắn này có không gian bên trong lớn hơn vẻ bề ngoài, với khung thân nhỏ gọn chứa đựng một mạng lưới cơ bắp dày đặc. Có khả năng tạo ra một cú đớp chết người hơn những gì vật lý cho phép."
 TECH_UNLOCK_COSMO_MAULER_CONSTRUCTION_TITLE: "§HMở khóa Loại Tàu:§! Tàu Cắn Mật Mã"
 TECH_UNLOCK_COSMO_MAULER_CONSTRUCTION_DESC: "§HTàu Cắn Mật Mã§!\n$tech_cosmogenesis_mauler_desc$"
 tech_cosmogenesis_weaver: "Tàu Dệt Gian Truân"
 tech_cosmogenesis_weaver_desc: "Được trang bị các mảng vũ khí hỗ trợ vượt xa cấu trúc giải phẫu có thể nhìn thấy, Tàu Dệt Gian Truân viết lại các quy chuẩn không gian. Chỉ một mình nó cũng có thể xoay chuyển cục diện của toàn bộ trận chiến."
 TECH_UNLOCK_COSMO_WEAVER_CONSTRUCTION_TITLE: "§HMở khóa Loại Tàu:§! Tàu Dệt Gian Truân"
 TECH_UNLOCK_COSMO_WEAVER_CONSTRUCTION_DESC: "§HTàu Dệt Gian Truân§!\n$tech_cosmogenesis_weaver_desc$"
 tech_cosmogenesis_harbinger: "Tàu Báo Hiệu Mê Cung"
 tech_cosmogenesis_harbinger_desc: "Những Tàu Báo Hiệu này cất giữ các phi thuyền tấn công của chúng trong các chiều không gian bỏ túi đan xen nhau, mỗi con tàu là một mê cung các khoang chứa kỳ ảo, có khả năng triển khai hỏa lực tương đương cả một hạm đội."
 TECH_UNLOCK_COSMO_HARBINGER_CONSTRUCTION_TITLE: "§HMở khóa Loại Tàu:§! Tàu Báo Hiệu Mê Cung"
 TECH_UNLOCK_COSMO_HARBINGER_CONSTRUCTION_DESC: "§HTàu Báo Hiệu Mê Cung§!\n$tech_cosmogenesis_harbinger_desc$"
 tech_cosmogenesis_stinger: "Tàu Chích Thần Bí"
 tech_cosmogenesis_stinger_desc: "Chứa nhiều hệ thống vũ khí hơn mức nguồn năng lượng của nó có thể duy trì, Tàu Chích này đáng lẽ không thể hoạt động, thế nhưng nó vẫn khai hỏa. Liên tục không ngừng."
 TECH_UNLOCK_COSMO_STINGER_CONSTRUCTION_TITLE: "§HMở khóa Loại Tàu:§! Tàu Chích Thần Bí"
 TECH_UNLOCK_COSMO_STINGER_CONSTRUCTION_DESC: "§HTàu Chích Thần Bí§!\n$tech_cosmogenesis_stinger_desc$"

