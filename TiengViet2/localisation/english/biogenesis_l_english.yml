 casus_belli_cb_ae_entertainment: "Thú Vui"
 war_goal_wg_ae_entertainment: "Thú Vui"
 war_goal_wg_ae_entertainment_desc: "Chiến tranh được tiến hành để giải trí cho Đế Chế Thức Tỉnh và tạo ra những đối thủ xứng tầm."
 wg_ae_war_entertainment_effect: "§Y[Root.GetName]§! sẽ ban thưởng cho sự tham gia đầy nhiệt huyết. §YĐộ Mệt Mỏi Chiến Tranh§! của Đế Chế Thức Tỉnh càng cao thì phần thưởng càng lớn."

 # Control

 bio.3400.name: "Thống Nhất"
 bio.3400.desc.nogalcom: "Thiên hà hỡi, chúng ta đã là một thể thống nhất. Những mảnh vỡ thấp kém cuối cùng đã nhận ra chân lý và tái gia nhập tập thể của chúng ta. Giờ đây chúng ta sẽ được gọi là §Y[fallen_empire_hive_control.GetName]§!. Thật may mắn cho các ngươi khi được chứng kiến thời khắc này. Dạng sống tối cao một lần nữa sải bước giữa muôn vì sao."
 bio.3400.desc.galcom: "$bio.3400.desc.nogalcom$\n\nGiờ đây chúng ta sẽ nắm quyền chỉ huy '§YCộng Đồng Thiên Hà§!' của các ngươi. Hãy mở tiệc ăn mừng đi."

 bio.3405.name: "Nốt Nhạc Lạc Lõng"
 bio.3405.desc: "Tại sao lại tự cản đường chính mình? Trong dàn hợp xướng thiên hà, nốt nhạc của các ngươi thật chói tai. Chúng ta chỉ muốn đưa các ngươi vào sự hòa hợp. Vậy mà, các ngươi lại kháng cự, bám víu vào sự bất hòa của mình.\n\nHãy nhớ lấy điều này: bản giao hưởng của chúng ta sẽ vang vọng khắp dải ngân hà, dù có các ngươi hay không."
 bio.3405.a: "Chúng tôi đã nghe điệu nhạc của các người, và chúng tôi sẽ không nhảy múa theo."
 NAME_Appeal_the_Veto: "Kháng Nghị Phủ Quyết"
 gal_com_arrogance: "Ngạo Mạn"

 #Dig Site

 NAME_Echo: "Lăng Mộ Vang Vọng"

 last_thought_site: "Suy Tưởng Cuối Cùng"
 last_thought_site_desc: "[From.Planet.GetName] xua đuổi tất cả những ai đến gần. Các nhà nghiên cứu được phân công nghiên cứu nó bịa ra đủ lý do để trì hoãn công việc, trong khi các thiết bị gặp trục trặc và hỏng hóc như thể chính chúng đang từ chối tiếp nhận dữ liệu.\n\nMột điều gì đó đã xảy ra ở đây — một điều gì đó kinh hoàng đến mức những dư âm của nó vẫn còn vang vọng qua thực tại."

 bio.3450.name: "Thai Chết Lưu"
 bio.3450.desc: "Cuộc khảo sát thận trọng của chúng ta trên [From.Planet.GetName] đã dẫn chúng ta xuống sâu lòng đất, qua vô số lớp vật chất sinh học bán hóa thạch. Cuối cùng, chúng ta đã tiếp cận được lõi rỗng của hành tinh — chỉ để nhận thấy bầu không khí ngột ngạt ngày càng nặng nề hơn theo từng bước chân. Bất chấp những biện pháp phòng ngừa của [Root.GetLeaderName], sự bất an ngày càng tăng đã chứng minh là không thể chịu đựng nổi. Vài [Root.Owner.GetArchaeologistPlural] đã chịu sự suy sụp tập thể, rơi vào trạng thái căng trương lực. Họ phải được sơ tán ngay lập tức.\n\nHang động rộng lớn tại trung tâm hành tinh không phải là một khoảng trống thông thường. Chôn vùi bên trong, chúng ta tìm thấy tàn tích của một thứ vượt xa kích thước của bất kỳ dạng sống nào từng được biết đến. Những dấu vết mờ nhạt của cặn màng ối đã xóa tan mọi hoài nghi. [From.Planet.GetName] chưa bao giờ là một tảng đá cằn cỗi. Nó là một quả trứng.\n\nVà bên trong, một con quái vật chết lưu đang say ngủ."

 bio.3455.name: "Các Khớp Thần Kinh"
 bio.3455.desc: "Trên [From.Planet.GetName], các [Root.Owner.GetArchaeologistPlural] của chúng ta đã truy vết một mạng lưới xúc tu kỳ lạ cắm sâu vào hộp sọ của sinh vật chết lưu. Dõi theo các sợi hữu cơ này đến nguồn gốc của chúng, họ đã phát hiện ra một mảng các cụm synap bên ngoài — một hệ thống phức tạp vẫn đang rung lên với tiềm năng kỳ quái.\n\nHiện tại, [Root.GetLeaderName] đang cố gắng giao tiếp với chúng, thâm nhập vào mạch vi mạch cổ xưa đang đập dọc theo chiều dài của xúc tu. Bất kể tri thức mà nó lưu giữ là gì, nó đã tồn tại lâu hơn nhiều so với vật chủ. Liệu nó có còn nhớ được gì không, điều đó vẫn còn phải chờ xem."

 bio.3460.name: "Nước Cờ Mạo Hiểm"
 bio.3460.desc: "Chuyện xảy ra vào một trăm nghìn năm trước. Việc diễn dịch nhận thức về thời gian của Bầy Đàn sang các đơn vị chuẩn thiên hà là một quá trình tinh tế, nhưng bằng cách sàng lọc các ký ức của máy tính sinh học, [Root.GetLeaderName] đang bắt đầu ghép nối sự thật.\n\nỞ đỉnh cao quyền lực, Bầy Đàn phải đối mặt với một kẻ thù mà nó không thể đánh bại. Dù sát cánh cùng nhiều đồng minh, mọi trận chiến đều kết thúc trong thất bại. Sự tuyệt vọng đã sinh ra liều lĩnh.\n\nPhần lớn những gì diễn ra sau đó đã bị cố tình xóa bỏ, nhưng các mảnh vỡ rải rác vẫn còn sót lại — đủ để hé lộ canh bạc cuối cùng của họ. Bầy Đàn đã rèn nên quả trứng kích cỡ hành tinh này làm vật chứa cho sự thăng hoa của họ, tìm cách từ bỏ sự tồn tại mong manh, bị trói buộc trên hành tinh để hợp nhất với sinh linh ấp nở. Liệu họ định chiến đấu hay tháo chạy thì vẫn chưa rõ.\n\nNhưng khi sinh vật cựa quậy, một điều gì đó khủng khiếp đã xảy ra."

 bio.3465.name: "Sự Vỡ Vụn"
 bio.3465.desc: "Bằng cách kết nối chuẩn xác với các máy tính sinh học còn sót lại và liên kết synap vẫn còn hoạt động của chúng, chúng ta đã trích xuất được những ký ức cuối cùng từ sinh vật chết lưu. Quá trình này đã nhanh chóng làm suy thoái các máy tính sinh học dưới áp lực nhận thức khổng lồ, nhưng chúng ta đã kịp thời cứu vãn được hầu hết dữ liệu.\n\nĐối mặt với sự hủy diệt, Bầy Đàn đã từ bỏ sự thận trọng, trút toàn bộ tâm trí của mình vào vật chủ chưa sinh ra trong một nỗ lực tuyệt vọng để sinh tồn. Sự quá tải synap đã gây ra hậu quả chí mạng, làm sinh vật diệt vong và giam cầm Bầy Đàn trong một vòng lặp đau đớn tột cùng tái diễn vô tận. Nó đã có thể bị tiêu diệt hoàn toàn nếu đồng minh nhân từ nhất của nó không cắt đứt liên kết. Giờ đây, chỉ còn lại những tiếng vang vụn vỡ trong tâm trí của nó, vương vấn trên [From.Planet.GetName] — một thế giới vẫn còn bị ám ảnh bởi tiếng thét gào cuối cùng của nó.\n\nSuy Tưởng Cuối Cùng chính là nỗi đau đớn tột cùng."

