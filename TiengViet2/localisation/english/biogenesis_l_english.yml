 concept_growth_factor: "$growth_factor_desc$"
 concept_growth_factor_desc: "Nhân Tố Sinh Trưởng là thước đo lượng chất dinh dưỡng được Behemoth của bạn hấp thụ, và ảnh hưởng trực tiếp đến tốc độ tiến triển của tình hình.\n\nMỗi tháng, chỉ số này giảm đi §R0.75%§!\n\n$behemoth_finale_situation_monthly_change_tooltip$\n\nGiá trị Tối thiểu tương đương §G0.5%§! trên mỗi $pop_group_unit$ £pop£ §HDân Cư Đã Chuyển Hóa§!."
 behemoth_finale_situation_desc: "Chúng ta sẽ cần một khoảng thời gian để thích nghi với một hình hài có quy mô khổng lồ đến vậy. Khi dần hòa nhập vào cơ thể này, chúng ta phải luôn cảnh giác cao độ với môi trường xung quanh. Giờ đây không còn gì ngăn cách giữa chúng ta và cõi hư không.\n\n['concept_growth_factor'] hiện tại của chúng ta là: §G[growth_factor_value]%§!"
