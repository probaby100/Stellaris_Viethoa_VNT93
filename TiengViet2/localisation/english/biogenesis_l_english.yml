 trait_ruler_apex_predator: "Kẻ Săn Mồi Đỉnh Cao"
 trait_ruler_apex_predator_desc: "Một xã hội được định nghĩa bởi sự săn mồi tiến hóa sẽ chỉ cho phép những cá nhân thích nghi tốt nhất lãnh đạo họ. Kẻ săn mồi đỉnh cao này không chỉ chiếm đoạt bộ gen của kẻ chiến bại mà còn tước đoạt sự xảo quyệt và quyết tâm của chúng, biến mỗi chiến thắng thành một bước tiến tới sự làm chủ tuyệt đối."
