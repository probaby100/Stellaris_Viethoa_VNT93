 behemoth_crisis_chain_title: "Thảm Họa Cự Thú"
 behemoth_crisis_chain_desc: "Các vì sao chỉ là nhiên liệu cho cơn đói của chúng ta, và thảm họa đơn thuần là mảnh đất nơi tham vọng của chúng ta nở rộ. Chúng ta sẽ thách thức trật tự tự nhiên, rèn nên một con thú khổng lồ đến mức không thể ngăn cản, kẻ sẽ tái định hình toàn bộ vũ trụ."

