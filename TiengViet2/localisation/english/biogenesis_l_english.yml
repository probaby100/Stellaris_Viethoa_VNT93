 # Siege of the Citadel Event Chain
 bio.2005.name: "Biến Động Bất Thường"
 bio.2005.desc: "Các $job_skywatcher_plural$ của chúng ta báo cáo một diễn biến đáng báo động.\n\nNhững dao động tinh vi nhưng không thể nhầm lẫn gần đây đã được phát hiện bên trong cánh cổng tại §Y[Root.Capital.System.GetName]§!. Trong quá khứ, những biến động tương tự luôn báo hiệu cho các đợt tàu sinh học thù địch tràn tới.\n\nNếu những số liệu này chính xác, chúng ta có thể phải đón nhận đợt công kích tiếp theo chỉ trong vài tháng tới. Sự sinh tồn của đồng bào một lần nữa đặt vào lòng quả cảm của các chiến sĩ phòng thủ."

 abandoned_hatchery_chain_1: "Cuộc Vây Hãm Thành Trì"
 abandoned_hatchery_chain_1_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_1_desc: "[GetInvadersLower] đã tấn công chúng ta trong suốt nhiều thập kỷ. $starbase_deep_space_citadel_1$ của chúng ta đứng vững như tuyến phòng thủ đầu tiên, nhưng sự an toàn thực sự sẽ chỉ đạt được khi vạch trần chân tướng của kẻ thù.\n\nVới mỗi khám phá mới, chúng ta càng tiến gần hơn đến ngày phản công — và chấm dứt cuộc bao vây kéo dài này một lần và mãi mãi."

 bio.2015.name: "Tàn Dư Của Kẻ Thù"
 bio.2015.desc: "Mảnh vỡ do hạm đội sinh học bị tiêu diệt trôi dạt đầy đe dọa qua §Y[Root.Capital.System.GetName]§!. Dù bị vặn xoắn và cháy đen, phần lớn vật liệu hữu cơ vẫn còn nguyên vẹn, mang lại cơ hội nghiên cứu hiếm có.\n\nBằng việc phân tích cẩn thận, chúng ta có thể vén màn bí mật về cấu trúc dị hợm của chúng — và có thể thu thập được một số hiểu biết về cánh cổng bí ẩn mà chúng đã chui ra."
 PROJECT_HATCHERY_SHIP_REMAINS: "Nghiên Cứu Tàn Tích Tàu Sinh Học"
 PROJECT_HATCHERY_SHIP_REMAINS_DESC: "Tàn tích của hạm đội [GetInvadersLower] mang lại cơ hội nghiên cứu hiếm hoi. Chúng ta có thể học hỏi được nhiều điều để bảo đảm sự sinh tồn của mình."
 bio.2015.a: "Cuối cùng cũng có tiến triển."

 bio.2020.name: "Đã Phân Tích Xong Kẻ Thù"
 bio.2020.desc: "Sau khi dày công nghiên cứu các mảnh vỡ sinh học bỏ lại tại §Y[Root.Capital.System.GetName]§!, các [Root.GetScientistPlural] của chúng ta tin rằng họ có thể đã nắm giữ chìa khóa để thấu hiểu cánh cổng án ngữ nơi rìa hệ sao.\n\nSâu bên trong mô của những sinh vật này, một cấu trúc hữu cơ đã được nhận diện — dường như đang cộng hưởng với các dao động của cánh cổng. Bằng cách thiết kế ngược tần số này, chúng ta có thể tự mình băng qua khe nứt bí ẩn đó.\n\nSẽ cần thêm những nghiên cứu sâu hơn, nhưng lần đầu tiên khả năng mở cuộc phản kích vào sào huyệt kẻ thù đã nằm trong tầm tay."
 abandoned_hatchery_chain_2: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_2_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_2_desc: "Chúng ta đã tiến thêm một bước đến việc giải mã những bí ẩn của cánh cổng. Dù việc vượt qua vẫn chưa thể thực hiện, nhưng giờ đây chúng ta đã có những hiểu biết cần thiết để phát triển công nghệ tương ứng.\n\nĐể mang cuộc chiến tới kẻ thù, chúng ta cần §Y$tech_wormhole_stabilization$§!."

 bio.2025.name: "Cái Nôi Của Kẻ Thù"
 bio.2025.desc: "Nhờ bước đột phá gần đây trong §Y$tech_wormhole_stabilization$§!, chúng ta đã có được cái nhìn hiếm hoi về hệ sao §Y[event_target:starlit_sealed_system.GetName]§!.\n\nMột hạm đội tàu sinh học hung hãn và một căn cứ sao kiên cố đang đón lõng chúng ta ở bờ bên kia. Cần hết sức cẩn trọng.\n\nChúng ta đã tìm ra cái nôi của kẻ thù."
 abandoned_hatchery_chain_3: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_3_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_3_desc: "Chúng ta đã tìm ra cái nôi của kẻ thù, nhưng để mở khóa những bí mật của chúng, cần phải đè bẹp hệ thống phòng thủ của chúng.\n\nTrận chiến sẽ không hề dễ dàng, nhưng sau khi khói lửa tan biến, cuối cùng chúng ta sẽ được tự do khám phá hệ sao §Y[event_target:starlit_sealed_system.GetName]§!."

 bio.2027.name: "Hoàng Hôn Của Nỗi Sợ"
 bio.2027.desc: "Hạm đội canh giữ §Y[starlit_sealed_system.GetName]§! đã bị tiêu diệt. Ngay trước thời khắc cuối cùng, chúng ta nhận được một tín hiệu truyền tin đầy ám ảnh từ căn cứ sao của hệ, mà mãi đến nay chúng ta mới dịch được:\n\n§H\" - mất toàn bộ quyền kiểm soát! Các con tàu đang tự sinh sôi! Cứu chúng tôi với, bất kể bạn là ai!\"§!\n\nKể từ đó, mọi liên lạc đều bị cắt đứt. Nếu đây thực sự là chiến thắng, điểm tập kết của kẻ thù sẽ mang lại cơ hội chiến lược to lớn. Một $starbase_deep_space_citadel_1$ mới một ngày nào đó có thể tỏa sáng dưới ánh quang của §Y[starlit_sealed_system.GetName]§!, bảo đảm rằng một mối đe dọa như vậy sẽ không bao giờ uy hiếp nền văn minh của chúng ta thêm một lần nào nữa."
 bio.2027.a: "Cuối cùng, cuộc vây hãm đã được giải tỏa."
 citadel_siege_lifted: "Cuộc Vây Hãm Đã Giải Tỏa"
 citadel_siege_lifted_desc: "Những người bảo vệ quả cảm của chúng ta đã đánh bại [GetInvadersLower]; cuối cùng cuộc bao vây dai dẳng đã chấm dứt."
 citadel_siege_lifted_machine: "$citadel_siege_lifted$"
 citadel_siege_lifted_machine_desc: "$citadel_siege_lifted_desc$"
 abandoned_hatchery_chain_4: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_4_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_4_desc: "[GetInvadersLower] đã bị thanh trừng khỏi hệ sao §Y[starlit_sealed_system.GetName]§!, nhưng tình hình ở đây rất khác so với những gì chúng ta dự tính.\n\nTất cả những gì còn lại của những kẻ từng hành hạ chúng ta chỉ là một thế giới dường như đã bị hủy diệt hoàn toàn."
 PROJECT_BIOMECHANICAL_WORLD: "Quê Hương Kẻ Thù"
 PROJECT_BIOMECHANICAL_WORLD_DESC: "Thế giới quê hương của [GetInvadersLower]; những kẻ này là ai, và chúng muốn gì ở chúng ta?"

 bio.2030.name: "Bệnh Dịch Cơ-Sinh Học"
 bio.2030.desc: "§Y[event_target:biomechanical_world_target.GetName]§! là một nấm mồ lộ thiên.\n\nLoài thống trị trên hành tinh đã bị áp đảo hoàn toàn bởi một dạng sống kỳ lạ và hung hãn. Điều tra sâu hơn cho thấy đây không phải sinh vật tự nhiên, mà đúng hơn là những cỗ máy sinh học, dường như được nuôi cấy phát triển thay vì chế tạo cơ khí.\n\nLiệu có khả năng những kẻ tạo ra những sinh vật này đã bị chính tạo vật của mình nuốt chửng? Liệu kẻ thù của chúng ta có hoàn toàn không hay biết về các cuộc tấn công nhắm vào chúng ta, hay thậm chí về sự tồn tại của chúng ta?\n\nChỉ một điều chắc chắn: bất kỳ biện pháp nào chúng từng thực hiện để kiềm chế bệnh dịch này đã hủy diệt chính chúng, cùng với những dị vật tự động ghê tởm của chúng."
 bio.2030.a: "Vậy ra chúng ta không phải là nạn nhân duy nhất..."
 smarter_hatchery: "Hạm Đội Cải Tiến"
 smarter_hatchery_desc: "Chúng đang học hỏi... Chúng đang thích nghi... Chúng đang kéo đến."
 bio.2030.tt: "\n§EMở khóa Vị trí Hội đồng:§!\n§H$t$$councilor_warden_of_the_citadel$§!\n$tt$$COUNCIL_POSITION_MODIFIER_BASE$\n$ttt$$MOD_SHIP_FRIENDLY_TERRITORY_ARMOR_MULT$: §G+1%§!\n$ttt$$mod_shipsize_starbase_deep_space_citadel_1_hull_mult$: §G+2%§!\n$ttt$$mod_starbases_upkeep_mult$: §G-5%§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$commander_with_icon$"

 councilor_warden_of_the_citadel: "Quản Đốc Thành Trì"
 councilor_warden_of_the_citadel_desc: "$TITLE$ là người bảo hộ kiên cường của chúng ta, được giao nhiệm vụ củng cố các phòng tuyến, giám sát sự sẵn sàng chiến đấu và đảm bảo nền văn minh đứng vững không bị khuất phục trước mọi mối đe dọa."
 mod_shipsize_starbase_deep_space_citadel_1_hull_mult: "$starbase_deep_space_citadel_1$ $HITPOINTS$"
 mod_shipsize_starbase_deep_space_citadel_2_hull_mult: "$starbase_deep_space_citadel_2$ $HITPOINTS$"
 mod_shipsize_starbase_deep_space_citadel_3_hull_mult: "$starbase_deep_space_citadel_3$ $HITPOINTS$"

 siege_node: "Nút Vây Hãm"
 siege_node_desc: "Chúng ta đã học hỏi. Chúng ta đã thích nghi. Phòng tuyến của chúng ta sẽ không thất thủ."

 bio.2036.name: "Chúng Đang Học Hỏi"
 bio.2036.desc: "Chúng ta đã chứng kiến một xu hướng đáng lo ngại trong các đợt tấn công của tàu sinh học. Mỗi đợt sau đều thể hiện sự phối hợp tốt hơn, chiến thuật thích ứng hơn và khả năng thăm dò hệ thống phòng thủ của chúng ta một cách bài bản. Nhật ký cảm biến cho thấy sự thay đổi về dấu vết năng lượng và mức độ ưu tiên mục tiêu, minh chứng cho các chiến thuật đang biến đổi không ngừng.\n\nNhững sinh vật này, dù thông qua bản năng hay trí tuệ bầy đàn, đang ngày càng trở nên ghê gớm hơn. Nếu xu hướng này tiếp diễn, đợt tiếp theo sẽ càng khó đẩy lùi hơn."
 bio.2036.a: "Hãy cầu nguyện cho những người phòng thủ."
 bio.2036.b: "Tiếp thêm sức mạnh cho những người phòng thủ."
 bio.2036.tt: "Sau mỗi đợt nối tiếp, các hạm đội tràn qua §Y$STARLIT_WORMHOLE_GALACTIC$§! sẽ ngày càng mạnh mẽ hơn."

 bio.2040.name: "Kẻ Thù Thất Thủ"
 bio.2040.desc: "Dữ liệu đo đạc truyền về từ cánh cổng hé lộ một bước ngoặt trọng yếu tại §Y[event_target:starlit_sealed_system.GetName]§!: cả hạm đội tàu sinh học và kho ấp của chúng đều đã bị một lực lượng vô danh hủy diệt.\n\nDù chúng ta vui mừng khi biết rằng [GetInvadersLower] đã đi đến hồi kết, nhưng không thể phớt lờ nguy cơ rằng một thế lực khác có thể một ngày nào đó sẽ nắm quyền kiểm soát hệ sao [event_target:starlit_sealed_system.GetName].\n\nChúng ta phải hành động nhanh chóng để bảo vệ vị trí chiến lược này trước khi phải đối mặt với một cuộc bao vây khác."
 bio.2040.a: "Bạn bè... Hay là kẻ thù mới?"
 citadel_siege_cancelled: "Hủy Bỏ Cuộc Vây Hãm"
 citadel_siege_cancelled_desc: "[GetInvadersLower] đã bị tiêu diệt. Cuộc bao vây dài đằng đẵng của chúng ta rốt cuộc đã được giải tỏa rồi chăng?"
 citadel_siege_cancelled_machine: "$citadel_siege_cancelled$"
 citadel_siege_cancelled_machine_desc: "$citadel_siege_cancelled_desc$"

