 REDUCED_CLONE_DEGRADATION_DESC: "§Y$leader_trait_backup_clone_default_plural$§! được giảm ['concept_clone_leader_degradation', Sự Suy Thoái]"

 auth_bio_hive_mutation: "Thích Nghi Biến Động"
 auth_bio_hive_mutation_desc: "Một tâm thức bầy đàn không ngừng biến đổi bản thân để thích nghi với môi trường sống và khắc phục mọi điểm yếu. Bằng cách kích thích các đột biến gen có định hướng, nó nhanh chóng sản sinh ra những hình thái sinh học chuyên biệt, biến bầy đàn thành một cỗ máy sinh học năng động và cực kỳ linh hoạt."

