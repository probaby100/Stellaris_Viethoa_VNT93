 # Mutation

 auth_mutation_habitability_tt: "Mở khóa một §YQuyết Định Hành Tinh§! nhằm cải biến cư dân phù hợp với bất kỳ lớp Hành tinh nào mà chúng ta có quyền tiếp cận nguồn di truyền."
 auth_bio_democratic_mutation: "Tự Do Đa Dạng Sinh Học"
 auth_bio_democratic_mutation_desc: "Xã hội này tuân theo một nguyên lý: hình thể của mỗi cá nhân là một thánh đường do chính họ làm chủ, được thiết kế và điều khiển theo ý muốn. Dưới khuôn khổ tự do không ràng buộc và sự hỗ trợ vững chắc, các công dân được trao quyền để hiện thực hóa tiềm năng độc nhất của mình, tự do định hình bản thân và tương lai."
 auth_bio_oligarchic_mutation: "Bộ Chỉ Huy Xúc Tác"
 auth_bio_oligarchic_mutation_desc: "Quyền lực tập trung vào một tầng lớp tinh hoa mang các đột biến gen ưu việt, trao cho họ thẩm quyền vô song. Vận hành ngoài giới hạn của luật pháp thông thường, họ sử dụng khả năng của mình để bảo vệ và định hướng xã hội, tiến hành bất kỳ hành động nào được coi là cần thiết nhằm đảm bảo sự sinh tồn và thịnh vượng."
 auth_bio_dictatorial_mutation: "Ủy Quyền Lai Tạo"
 auth_bio_dictatorial_mutation_desc: "Xã hội này xem đột biến gen là viên đá tảng cho sự tiến bộ. Những kẻ an phận với những gì tự nhiên ban tặng sẽ đối mặt với án giam giữ tức khắc hoặc bị tiêu hủy, nhằm đảm bảo rằng chỉ những kẻ ưu việt về di truyền mới được đóng góp vào nỗ lực không ngừng nghỉ hướng tới sự hoàn hảo của giống loài."
 auth_bio_dictatorial_mutation_tt: "\n£crime£ Tội phạm từ [enforcer.GetIcon] [enforcer.GetName] §G-5§!\n$auth_mutation_habitability_tt$"
 auth_bio_imperial_mutation: "Bành Trướng Bộ Gen"
 auth_bio_imperial_mutation_desc: "Đón nhận sức mạnh khó lường của đột biến ngẫu nhiên, đế chế này khai phá những tiềm năng vô tận, thúc đẩy những đổi mới và năng lực mà các phương pháp truyền thống không bao giờ đạt tới. Trong cuộc đua giành quyền thống trị, sự hỗn loạn của đột biến trở thành lợi thế lớn nhất, đẩy họ vươn tới đỉnh cao tối thượng không đối thủ."
 auth_bio_corporate_mutation: "Cho Vay Nội Tạng"
 auth_bio_corporate_mutation_desc: "Dưới chính thể này, việc vay tài chính mua nội tạng và các bộ phận cơ thể được mở rộng cho tất cả mọi người thông qua các gói thanh toán linh hoạt. Việc trễ hạn thanh toán sẽ dẫn đến việc tịch thu ngay lập tức hoặc phát mãi tài sản thế chấp đã thỏa thuận. Hệ thống này đảm bảo một chu kỳ cung cầu ổn định, nơi mỗi bộ phận cơ thể vừa là một món hàng hóa vừa là một sự ràng buộc."
 auth_bio_corporate_mutation_tt: "$organic_leaders_have_trade_upkeep$\n$r_trade$ mỗi $pop_group_unit$ £pop£ Pop từ ['trait:trait_spare_organs']: §G+0.5§!\n$auth_mutation_habitability_tt$"

 auth_bio_democratic_evopred: "Cử Tri Đoàn Di Truyền"
 auth_bio_democratic_evopred_desc: "Dù khó khăn trong việc kiểm soát, xã hội này đã làm chủ được một phần bộ gen linh hoạt của mình. Người dân sẽ tự quyết định cách mà các đột biến của họ biểu hiện ra ngoài."
 auth_bio_democratic_evopred_tt: "$auth_bio_evopred_tt$\nBổ sung thêm ['concept_genetic_electorate_effect', hiệu ứng] cho ['trait:trait_malleable_genes'] dựa trên ['concept_faction'] nào đang mạnh nhất\nGia tăng Tiến trình ['concept_adaptive_evolution'] từ các §YChủng Loài§! ngoại lai đang làm nô lệ hoặc có địa vị tốt hơn §G+100%§!"
 auth_bio_oligarchic_evopred: "Đại Tài Phiệt Sinh Học"
 auth_bio_oligarchic_evopred_desc: "Trong xã hội này, thời gian đã bị khuất phục. Bằng cách tuyển chọn kỹ lưỡng chỉ những nguồn gen nguyên sơ nhất, giới tinh hoa thống trị đã thăng hoa đến sự tồn tại bất tử. Tuy nhiên, một sai sót nhỏ có thể đồng nghĩa với việc đánh mất sự vĩnh cửu, và đối với những kẻ dưới trướng họ, tham vọng và tiến hóa chỉ là hai mặt của cùng một đồng xu..."
 auth_bio_oligarchic_evopred_tt: "$auth_bio_evopred_tt$\nCác Thành Viên Hội Đồng là §YBất Tử§!"
 auth_bio_dictatorial_evopred: "Thống Lãnh Tột Đỉnh"
 auth_bio_dictatorial_evopred_desc: "Một nền văn minh được rèn giũa qua quá trình tiến hóa liên tục, dưới sự cai trị của một tâm thức tột đỉnh tối cao. Không hội đồng hay hiến pháp nào có thể làm lu mờ ý chí thượng đẳng của Đấng Thống Lãnh. Tại đây, mỗi chiến thắng di truyền đều tiếp thêm sức mạnh cho sự đăng quang của ngai vàng."
 auth_bio_dictatorial_evopred_tt: "$auth_bio_evopred_tt$\nĐặc điểm Lãnh đạo: ['leader_trait:trait_ruler_apex_predator']"
 apex_predator_male: "$trait_ruler_apex_predator$"
 apex_predator_female: "$trait_ruler_apex_predator$"
 auth_bio_imperial_evopred: "Vương Triều Bất Tử"
 auth_bio_imperial_evopred_desc: "Tại $auth_bio_imperial_evopred$, quá khứ không hề yên nghỉ — nó bị nuốt chửng. Mỗi thế hệ nuôi dưỡng thế hệ tiếp theo, khi tro tàn và di thể của các lãnh đạo đã khuất tiếp tục duy trì ách thống trị bất diệt của đế chế. Phụng sự là hy sinh, và trong cái chết, muôn dân đều bồi đắp cho di sản của tổ tiên."
 eternal_ancestor_male: "$eternal_ancestor_female$"
 eternal_ancestor_female: "Tổ Tiên Vĩnh Cửu"
 auth_bio_imperial_evopred_tt: "$auth_bio_evopred_tt$\nCho phép đấng cai trị nuốt chửng các Đại Lãnh Đạo khi họ qua đời."
 auth_bio_corporate_evopred: "Tập Đoàn Săn Mồi Sinh Học GLC" #Galactic Limited Incorporated
 auth_bio_corporate_evopred_desc: "Tại Hãng BioPredation GLC, họ phát triển mạnh mẽ dựa trên sự thích nghi — cả về mặt di truyền lẫn kinh tế. Với mỗi bộ gen mới được bổ sung vào danh mục đầu tư của công ty, Siêu Tập Đoàn lại tinh chỉnh vị thế thị trường của mình, tùy chỉnh sản phẩm và các cuộc đàm phán theo sinh học độc nhất của từng loài. Rốt cuộc, việc thấu hiểu bản chất tự nhiên của khách hàng khiến việc chốt thỏa thuận gần như trở thành... bản năng."
 auth_bio_corporate_evopred_tt: "$auth_bio_evopred_tt$\n$organic_leaders_have_trade_upkeep$\nHiệu quả Hiệp ước Thương mại trên mỗi Đặc điểm Loài: §G+1%§!\nGia tăng Tiến trình ['concept_adaptive_evolution'] từ §YHiệp Ước Thương Mại§! thêm §G+100%§!"
 auth_bio_hive_mind_evopred: "Ý Thức Huyễn Hợp"
 auth_bio_hive_mind_evopred_desc: "Tâm thức bầy đàn này đã chán ngấy việc tự biến đổi đơn thuần. Mỗi thuộc địa mới đều có thể trở thành một phần trong bức tranh sống động của nó, trong sự hòa quyện không ngừng giữa cảnh quan và xác thịt. Khi biên giới tan biến trong Ý Thức Huyễn Hợp, muôn loài và thế giới trở thành một thể thống nhất."
 auth_bio_hive_mind_evopred_tt: "$auth_bio_evopred_tt$\nTự động cải tạo môi trường các thuộc địa thành §YHành Tinh Tổ Ong§!\nGia tăng Tiến trình ['concept_adaptive_evolution'] từ việc thanh trừng các §YChủng Loài§! ngoại lai thêm §G+100%§!"
 auth_bio_hive_mind_evopred_nomads_tt: "$auth_bio_evopred_tt$\nGia tăng Tiến trình ['concept_adaptive_evolution'] từ việc thanh trừng các §YChủng Loài§! ngoại lai thêm §G+100%§!"
