### NEW CIVICS ###

 civic_genetic_identification: "Định Danh Di Truyền"
 civic_genetic_identification_desc: "Xã hội này yêu cầu mọi công dân phải được đăng ký ngay từ khi sinh ra vào một danh mục di truyền, được áp dụng trong mọi cấp bậc của bộ máy quan liêu."
 civic_corporate_genetic_identification: "Chứng Khoán Giải Trình Tự"
 civic_corporate_genetic_identification_desc: "Trình tự di truyền của mọi khách hàng và nhân viên đều được ghi lại trong một cơ sở dữ liệu mà bất kỳ ai cũng có thể truy cập với một khoản phí khiêm tốn. Các cơ quan thực thi pháp luật dựa rất nhiều vào dịch vụ này để nhận diện những kẻ bất hảo ngay từ những dấu vết nhỏ nhất."
 civic_corporate_genetic_identification_effects: "- £building£ §Y$building_private_security$§! $megacorp_civic_branch_office_building_effect$"

 councilor_genetic_identification: "Người Lập Danh Mục"
 councilor_genetic_identification_desc: "$TITLE$ chịu trách nhiệm duy trì và bảo mật Chỉ Mục Di Truyền, đảm bảo bộ máy hành chính vận hành thông suốt và hiệu quả."
 councilor_corporate_genetic_identification: "Môi Giới Trình Tự"
 councilor_corporate_genetic_identification_desc: "Được giao nhiệm vụ đánh giá các yêu cầu truy cập và kế hoạch thương mại hóa, $TITLE$ có thể truy xuất dữ liệu định danh di truyền của bất kỳ cá nhân nào."

 civic_crowdsourcing: "Huy Động Trí Tuệ Đám Đông"
 civic_crowdsourcing_desc: "Xã hội này nhận ra rằng cảm hứng cá nhân chính là cội nguồn của sự đổi mới thực sự. Các bằng sáng chế mã nguồn mở, tư duy cởi mở, sự hợp tác tự phát và phần thưởng đổi mới mở đường cho sự tiến bộ."
 civic_crowdsourcing_effects: "$t$- Các phe phái sản xuất $r_research$ thay vì $r_unity$ $TABBED_NEW_LINE$- Các phe phái sẽ hình thành trong đế chế của bạn ngay sau khi trò chơi bắt đầu, nhưng sản lượng của Phe Phái sẽ bị giảm trong mười năm đầu tiên"
 civic_corporate_crowdsourcing: "R&D Phân Tán"
 civic_corporate_crowdsourcing_desc: "Các cuộc thi đổi mới định kỳ giữa các bộ phận thúc đẩy mạnh mẽ các sáng kiến R&D của tập đoàn này."
 civic_corporate_crowdsourcing_effects: "$civic_crowdsourcing_effects$ $TABBED_NEW_LINE$- £building£ §Y$building_private_research_initiative$§! $megacorp_civic_branch_office_building_effect$"

 civic_tooltip_not_crowdsourcing: "KHÔNG có Quốc Sách ['concept_crowdsourcing_civics']"
 concept_crowdsourcing_civics: "Huy Động Trí Tuệ Đám Đông"
 concept_crowdsourcing_civics_desc: "Các Quốc Sách $concept_crowdsourcing_civics$ bao gồm: $NEW_LINE$- ['civic:civic_crowdsourcing']$NEW_LINE$- ['civic:civic_corporate_crowdsourcing']"

 councilor_crowdsourcing: "Điều Phối Viên Đổi Mới"
 councilor_crowdsourcing_desc: "$TITLE$ được giao nhiệm vụ giám sát việc sử dụng công bằng các bằng sáng chế và tạo ra các động lực nghiên cứu phù hợp với định hướng công nghệ của chính phủ."
 councilor_corporate_crowdsourcing: "Trọng Tài Ý Tưởng"
 councilor_corporate_crowdsourcing_desc: "Không phải mọi dự án đều đáng để đầu tư, và nhiệm vụ của $TITLE$ là đánh giá khả năng thương mại hóa và lợi nhuận của chúng."

 civic_civil_education: "Giáo Dục Công Dân"
 civic_civil_education_desc: "Tại đế chế này, giáo dục đã thay thế hoàn toàn lực lượng thực thi pháp luật. Thông qua sự chuẩn bị toàn diện và uốn nắn nghiêm ngặt trong chương trình giảng dạy, họ đảm bảo không một cá nhân nào nằm ngoài tầm với của tri thức. Xét cho cùng, không có công dân tồi — chỉ có nhà giáo dục tồi."
 civic_civil_education_effects: "$t$- Thay thế toàn bộ £job_enforcer£ ['concept_enforcer'] bằng £job_educator£ ['concept_educator'] $TABBED_NEW_LINE$- Thay thế £building£ ['building:building_precinct_house'] bằng £building£ ['building:building_state_academy']"
 councilor_head_of_education: "Bộ Trưởng Giáo Dục"
 councilor_head_of_education_desc: "$TITLE$ được giao phó trách nhiệm trang bị cho mọi công dân những kiến thức cần thiết không chỉ để làm việc, mà còn để làm chủ những phức tạp của cuộc sống. Phương pháp sư phạm tốt sẽ thúc đẩy một xã hội phồn vinh."
 educator: "$job_educator$"
 job_educator: "Nhà Giáo Dục"
 job_educator_plural: "Các Nhà Giáo Dục"
 job_educator_desc: "Tận tụy chăm lo cho thế hệ trẻ, những người tiên phong không mệt mỏi này cống hiến sự nghiệp vô giá để đảm bảo mọi công dân đều sẵn sàng đối mặt với dải ngân hà."
 job_educator_effect_desc: "£job_educator£ $job_educator_plural$ sử dụng $r_consumer_goods$ để sản xuất $r_unity$, giảm £crime£ §Y$PLANET_CRIME_TITLE$§!, tăng §YSức Thu Hút Đạo Đức Cầm Quyền§!, và tạo ra £defense_army£ §YĐạo Quân Phòng Thủ§!"
 mod_job_educator_add: "Việc làm $job_educator$"
 building_state_academy: "Học Viện Quốc Gia"
 building_state_academy_desc: "Nơi đây giảng dạy những nền tảng được coi là thiết yếu cho một xã hội lành mạnh."
 concept_state_academy: "$building_state_academy$"
 concept_state_academy_desc: "Việc làm $job_educator$: §G+200§!\n\n$job_educator_effect_desc$\n$h_line$§L$building_state_academy_desc$§!"
 building_center_of_guidance: "Trung Tâm Định Hướng"
 building_center_of_guidance_desc: "Bao quát mọi khía cạnh của đời sống xã hội. Bên trong khu phức hợp trường học và cơ sở đào tạo khổng lồ này, mọi sai lệch đều có thể được uốn nắn."
 mod_planet_jobs_citizen_produces_mult: "Sản lượng tài nguyên của Pop có Đầy Đủ Quyền Công Dân"

 civic_hive_familiar_face: "Gương Mặt Thân Quen"
 civic_hive_familiar_face_desc: "Hợp tác luôn được ưu tiên hơn đối đầu trực tiếp. Tâm thức Bầy Đàn này đã tiến hóa ra các drone ngoại giao có khả năng mô phỏng hình dạng và cử chỉ của các đối tác trò chuyện."
 civic_wilderness_familiar_face: "$civic_hive_familiar_face$"
 civic_wilderness_familiar_face_desc: "Hợp tác luôn được ưu tiên hơn đối đầu trực tiếp. Vùng Hoang Dã này đã tiến hóa ra các hóa thân ngoại giao có khả năng mô phỏng hình dạng và cử chỉ của các đối tác trò chuyện."
 civic_hive_familiar_face_effects: "Đặc sứ và Quan chức sẽ biến đổi hình dạng theo Đế chế mà họ được phái tới.\n§YLòng Tin§! cần thiết để thực hiện §YHành Động Ngoại Giao§!: §G-50%§!"

 #Bioship Civics

 civic_hive_shared_genetics: "Di Truyền Chung"
 civic_hive_shared_genetics_desc: "Bộ gen đột biến của bầy đàn này được dùng làm nền tảng để nuôi dưỡng các con tàu sinh học, và hạm đội của chúng liên kết chặt chẽ với các drone, tiếp nhận sức mạnh từ tính độc nhất của chủng loài."
 civic_wilderness_shared_genetics: "$civic_hive_shared_genetics$"
 civic_wilderness_shared_genetics_desc: "Một bộ gen bên trong Vùng Hoang Dã này đã đột biến thành nền tảng phù hợp để nuôi cấy các con tàu sinh học. Hạm đội của nó liên kết chặt chẽ với các sinh vật cộng sinh khác, mỗi loài đều tiếp nhận sức mạnh từ loài kia."
 civic_hive_shared_genetics_effects: "- Với mỗi đặc điểm chính §GTích Cực§! của loài: Thân vỏ Tàu §G+2.5%§!, Phí duy trì §R+0.5%§!.\n- Với mỗi đặc điểm chính §RTiêu Cực§! của loài: Tốc độ Bắn của Tàu §G+1.5%§!, Phí duy trì §R+0.5%§!."

 shared_genetics_fire_rate: "$civic_hive_shared_genetics$: Tốc Độ Bắn"
 shared_genetics_fire_rate_desc: "Các con tàu của chúng ta hưởng lợi từ các trung tâm hung hãn được kích thích quá mức, thúc đẩy bởi sự pha trộn lành mạnh giữa hormone và sự thù địch."
 shared_genetics_hull: "$civic_hive_shared_genetics$: Thân Vỏ"
 shared_genetics_hull_desc: "Cơ bắp và khối xương của các con tàu được tăng cường nhờ tính ưu việt di truyền của giống loài chúng ta."

 civic_hive_aerospace_adaptation: "Thích Ứng Hàng Không Vũ Trụ"
 civic_hive_aerospace_adaptation_desc: "Các con tàu sinh học của tập thể này đặc biệt thích hợp với các chuyến bay xuyên khí quyển, cho phép chúng thực hiện các nhiệm vụ yểm trợ hỏa lực đường không tầm gần, hoặc thậm chí hỗ trợ hậu cần hành tinh."
 civic_hive_aerospace_adaptation_effects: "- §YTàu Sinh Học§! trên quỹ đạo các thuộc địa §GThân Thiện§! có chi phí duy trì tàu §G-50%§!.\n- Các thuộc địa §GThân Thiện§! có §YTàu Sinh Học§! trên quỹ đạo sẽ nhận thêm §YTốc Độ Xây Dựng§!, §YTiện Nghi§!, §YTốc Độ Dọn Dẹp Chướng Ngại Vật§! và tiềm năng gia tăng §YSản Lượng Việc Làm§!, tùy thuộc vào quy mô hạm đội.\n- §YTàu Sinh Học§! trên quỹ đạo các thuộc địa §RKẻ Thù§! có chi phí duy trì tàu §G-85%§!."

 aa_ship_upkeep_friendly: "$civic_hive_aerospace_adaptation$"
 aa_ship_upkeep_bombing: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_1: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_1_desc: "Các tàu sinh học quay quanh hành tinh này thường xuyên ra vào khí quyển để nghỉ ngơi, nạp năng lượng và hỗ trợ các drone trên mặt đất."
 aa_ship_planet_support_2: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_2_desc: "$aa_ship_planet_support_1_desc$"
 aa_ship_planet_support_3: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_3_desc: "$aa_ship_planet_support_1_desc$"
 aa_ship_planet_support_4: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_4_desc: "$aa_ship_planet_support_1_desc$"

 civic_machine_stalwart_network: "Mạng Lưới Kiên Cường"
 civic_machine_stalwart_network_desc: "Trí tuệ Máy móc này chuyên sâu vào các quy trình quân sự phòng thủ, kết hợp giữa phòng thủ kiên cố với các giao thức tấn công chớp nhoáng rồi rút lui."

 defensive_stations_tracking_add: "$t$- Khả năng Truy vết của Trạm Phòng Thủ"
 defensive_stations_tracking_add_tt: "$defensive_stations_tracking_add$: $VARIABLE|0=+$"

 defensive_stations_weapon_range_mult: "Tầm Bắn Vũ Khí Của Trạm Phòng Thủ"
 defensive_stations_weapon_range_mult_tt: "$defensive_stations_weapon_range_mult$: $VARIABLE|1%=+$"

# Bodysnatcher

 civic_hive_bodysnatcher: "Kẻ Đoạt Xác"
 civic_hive_bodysnatcher_desc: "Chính những gì bên trong mới thực sự quan trọng. Bầy đàn này chuyên thâm nhập, chiếm đoạt thể xác của những sinh vật hữu cơ xấu số. Không thể tránh khỏi, khi số lượng con rối ngày một tăng, nền văn minh vật chủ sẽ bị hấp thụ hoàn toàn vào tập thể."
 civic_hive_bodysnatcher_effects: "Bắt đầu trò chơi với §Y1000§! £pop£ Pop đã được đồng hóa và khả năng §YĐồng Hóa§! các sinh vật hữu cơ vào tâm thức bầy đàn.\nCó quyền thực hiện Nhiệm vụ Tình báo ['concept_operation_bodysnatcher_prepare_invasion']\nNhận thêm £pop£ Pop từ Nhiệm vụ Tình báo ['concept_operation_smuggle_pops']"
 civic_hive_bodysnatcher_secondary_species: "Kẻ Mạo Danh"
 NAME_Bodysnatchers: "Kẻ Đoạt Xác"

 operation_bodysnatcher_prepare_invasion: "Chuẩn Bị Xâm Lược"
 operation_bodysnatcher_prepare_invasion_desc: "Các nước láng giềng có tâm trí thật dễ uốn nắn. Bằng cách gửi các thể xác đã được chuẩn bị sẵn, tích hợp hoàn toàn vào ý thức của chúng ta, chúng ta có thể dễ dàng thu nạp họ về bầy đàn hơn."
 operation_bodysnatcher_prepare_invasion_on_success: "$IF_SUCCESSFUL|E$\nChúng ta sẽ nhận được sự hỗ trợ từ nội gián khi tuyên chiến với §Y[Target.GetName]§! lần tới."
 operation_invasion_prepared: "$TRIGGER_FAIL$ §RChúng ta đã chuẩn bị một cuộc xâm lược chống lại quốc gia này. Hãy tuyên chiến để kích hoạt nó.§!"
 operation_invasion_impossible: "$TRIGGER_FAIL$ §RQuốc gia này chuẩn bị quá kỹ lưỡng trước mọi nỗ lực thâm nhập. Chúng ta không thể phát động chiến dịch này!§!"
 concept_operation_bodysnatcher_prepare_invasion: "$operation_bodysnatcher_prepare_invasion$"
 concept_operation_bodysnatcher_prepare_invasion_desc: "Một chiến dịch mà các Pop đã đồng hóa của loài mục tiêu sẽ thâm nhập vào đế chế đó, chuẩn bị cho việc phá hoại hàng loạt khi chiến tranh bùng nổ."

 bio.800.name: "Công Việc Mới"
 bio.800.desc: "Những cơ thể thâm nhập của chúng ta cần được bố trí tại các vị trí chiến lược trước khi chúng ta có thể thực hiện kế hoạch vĩ đại của mình. Hoạt động thu thập tin tình báo trước đó cho thấy các căn cứ sao thiếu nhân sự và các hành tinh phòng thủ lỏng lẻo là những mục tiêu hàng đầu. Chúng ta sẽ sớm bắt tay vào việc."

 bio.805.name: "Bổ Sung Nhân Sự"
 bio.805.desc: "Công việc tiếp tục diễn ra suôn sẻ, các thể xác của chúng ta đã tìm thấy thêm nhiều vật chủ và sự can thiệp vào công việc nội bộ của [Target.GetName] đã được củng cố. Các drone của chúng ta sẽ sớm thâu tóm bất kỳ bộ óc tò mò nào."

 bio.810.name: "Lỗ Hổng Mới"
 bio.810.desc: "Những cá thể [Target.GetSpeciesName] mà chúng ta không thể thay thế đã bị bãi nhiệm khỏi vị trí của họ, tạo ra nhiều khoảng trống bên trong cơ cấu của §Y[Target.GetName]§!. Những con rối của chúng ta đã sẵn sàng mở toang cánh cửa cho cuộc xâm nhập toàn diện, tất cả những gì họ cần là lệnh xuất kích."

 bio.815.name: "Tân Binh Mới"
 bio.815.desc: "§Y[From.Target.GetName]§! đã bị xâm nhập hoàn toàn. Chúng đã sẵn sàng cho cuộc xâm lược và tất cả những gì chúng ta cần quyết định là phái bao nhiêu kẻ mạo danh tới để thâm nhập sâu hơn vào đế chế của chúng. Chẳng mấy chốc tất cả sẽ thuộc về [Owner.GetAdj]."
 bio.815.tt: "Chúng ta không có đủ Pop thuộc loài mục tiêu cho hành động này."
 bio.815.a: "Chúng ta đã phái đi tất cả những gì có thể."
 bio.815.b: "Đảm bảo các tiền đồn của chúng thuộc về ta."
 bio.815.b.tt: "Phái §Y100§! £pop£ §HPop§!.\n$bio.815.reminder$"
 bio.815.c: "Chuẩn bị xâm lược các hành tinh của chúng."
 bio.815.c.tt: "Phái §Y300§! £pop£ §HPop§!.\n$bio.815.reminder$"
 bio.815.d: "Thâm nhập vào các pháo đài của chúng!"
 bio.815.d.tt: "Phái §Y500§! £pop£ §HPop§!.\n$bio.815.reminder$"
 bio.815.e: "Biến tất cả chúng thành chúng ta!"
 bio.815.e.tt: "Phái §Y2k§! £pop£ §HPop§!.\n$bio.815.reminder$"
 bio.815.reminder: "Cuộc chiến tiếp theo mà chúng ta tuyên chiến chống lại §Y[From.Target.GetName]§! hoặc bị chúng tuyên chiến trong vòng §G10§! năm sẽ tận dụng các gián điệp đã chuẩn bị sẵn."

 bio.825.name: "Cuộc Xâm Lăng Của [From.GetSpeciesNamePlural]"
 bio.825.desc.small: "[From.GetName] xảo quyệt đã thâm nhập vào đế chế của chúng ta. Các trạm không gian của chúng ta đã bị chiếm đoạt và chúng đang xâm chiếm các thuộc địa của chúng ta. Chúng ta phải tiêu diệt những kẻ mạo danh!"
 bio.825.desc.large: "Ban đầu chúng ta tưởng đó chỉ là một trục trặc kỹ thuật. Một nửa mạng lưới liên lạc bị tê liệt.\n\nNhưng không, những kẻ tráo trở [From.GetName] đã thay thế toàn bộ nhân sự chủ chốt ở nhiều tinh khu. Đế chế của chúng ta đang rạn nứt và các thuộc địa đang bị xâm chiếm.\n\nĐừng tin bất kỳ ai!"

# Smuggle pops operation

 operation_smuggle_pops: "Buôn Lậu Dân Cư"
 operation_smuggle_pops_desc: "Các đặc vụ của chúng ta sẽ tiến hành các nỗ lực giải cứu/đưa người quy mô lớn đối với các bộ phận cô lập bên trong [target.GetName]"
 operation_smuggle_pops_on_success: "$IF_SUCCESSFUL|E$\nTái định cư một số £pops£ Pop đến đế chế của bạn."
 smuggle_pops_also_fanatic_egalitarians: "$TRIGGER_FAIL$ §R[Target.GetName] cũng là Xã Hội Bình Đẳng Cuồng Tín, người dân của họ đã có được tự do rồi§!"
 smuggle_pops_not_enough_pops: "$TRIGGER_FAIL$ §R[Target.GetName] không có đủ £pops£ Pop đáng để cướp bóc§!"
 mod_operation_smuggle_pops_difficulty_add: "Độ khó Chiến dịch $operation_smuggle_pops$"
 concept_operation_smuggle_pops: "$operation_smuggle_pops$"
 concept_operation_smuggle_pops_desc: "Một chiến dịch nhằm bắt cóc Pop từ đối tượng mục tiêu."

 bio.900.name: "Tuyển Chọn Nhân Lực"
 bio.900.desc: "Các đặc vụ của chúng ta đã thiết lập một số bình phong và nơi ẩn náu để từ đó giám sát dân số của [target.GetName]. Những kẻ bất đồng chính kiến, những người sống cô độc, hoặc những cá nhân có tay nghề cao sẽ được đánh giá và đánh dấu để trích xuất."

 bio.905.name: "Kế Hoạch Mất Tích"
 bio.905.desc: "Các đặc vụ của chúng ta đã bắt đầu vây bắt các mục tiêu và bí mật đưa họ đến những địa điểm hẻo lánh. Bất cứ khi nào có thể, các sự cố được dàn dựng để đánh lạc hướng chính quyền địa phương và che giấu dấu vết của chúng ta."

 bio.910.name: "Tàu Con Thoi"
 bio.910.desc: "Chiến dịch đã bước vào giai đoạn then chốt, khi tất cả những người chúng ta vây bắt phải được kín đáo chuyển lên quỹ đạo. Kế hoạch hiện tại là đồng bộ hóa các chuyến khởi hành trên tất cả các cơ sở và áp đảo lực lượng an ninh bằng mồi nhử và đòn nghi binh."

 bio.915.name: "Được Vận Chuyển Kín Đáo"
 bio.915.desc: "Chúng ta đã vận chuyển thành công nhiều mục tiêu, nhưng chiến dịch không diễn ra suôn sẻ hoàn toàn và nhiều con tàu chứa đầy những cá nhân triển vọng đã phải bỏ lại phía sau."
 bio.915.desc.detected: "$bio.915.desc$\n\nNhững cuộc di chuyển dân số quy mô lớn như vậy không thể không bị phát hiện."
 bio.915.desc.cosmogenesis: "Chúng ta đã trích xuất thành công nhiều mục tiêu, họ đang được đưa tới Máy Tiện Vũ Trụ. Nhưng chiến dịch không diễn ra suôn sẻ hoàn toàn và nhiều con tàu chứa đầy những cá nhân triển vọng đã phải bỏ lại phía sau."
 bio.915.desc.cosmogenesis.detected: "$bio.915.desc.cosmogenesis$\n\nNhững cuộc di chuyển dân số quy mô lớn như vậy không thể không bị phát hiện."
 bio.915.a: "Chúng ta đã làm tất cả những gì có thể."
 bio.915.b: "Tập trung giải phóng các [Root.GetSpeciesNamePlural] khác."
 bio.915.c: "Chúng ta phải đưa thêm nhiều người ra ngoài hơn nữa!"
 bio.915.d: "Không bỏ lại bất kỳ [GetSpeciesName] nào."
 bio.915.tt: "Trích xuất các £pop£ §HPop§! không được trông nom đến các thế giới phù hợp."
 bio.915.asset.tt: "$bio.915.tt$\nNếu §Y[From.Target.GetName]§! trước đây chưa chú ý đến chúng ta, §Rthì bây giờ chắc chắn họ đã nhận ra.§!"

 MESSAGE_POPS_SMUGGLED_TITLE: "Dân Cư Bị Đánh Cắp"
 MESSAGE_POPS_SMUGGLED_DESC: "Kẻ tráo trở $COUNTRY|Y$ đã thâm nhập vào biên giới của chúng ta và bắt cóc đồng bào của chúng ta!"
 opinion_smuggled_pops: "Đã Đánh Cắp Pop Của Chúng Ta!"

