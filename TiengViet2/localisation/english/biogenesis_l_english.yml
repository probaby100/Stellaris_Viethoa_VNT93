### Hive Fallen Empire #

 RT_INCOMPLETE_OVERMIND: "Chúa Tể Tâm Thức Chưa Hoàn Chỉnh"
 gov_war_splinter: "Phân Nhánh Chiến Tranh"
 gov_war_splinter_desc: "Bản năng hiếu chiến và hung hãn từng là một trong nhiều xung lực bên trong Bầy Đàn. Giờ đây, nó cố gắng thiết lập quyền kiểm soát đối với các mảnh vỡ khác, khi không phải bận tâm tự đấu đá với chính mình."
 gov_growth_splinter: "Phân Nhánh Tăng Trưởng"
 gov_growth_splinter_desc: "Khao khát tiến hóa và biến đổi từ Bầy Đàn Sa Ngã. Vì quá tập trung vào việc liên tục tự tái tạo, phân nhánh này gặp khó khăn trong việc thiết lập quyền kiểm soát đối với các phân nhánh khác."
 gov_control_splinter: "Phân Nhánh Kiểm Soát"
 gov_control_splinter_desc: "Bản năng ám ảnh về việc triệt tiêu sự dị biệt và thúc đẩy tính đồng nhất đã định hình nên phân nhánh này. Nó khao khát kiểm soát các mảnh vỡ khác hơn bất cứ điều gì, nhưng sự hỗn loạn thường trực cố hữu trong vũ trụ của chúng ta là một sự xao lãng liên tục."
 gov_fused_ascendancy: "Tối Cao Dung Hợp"
 gov_fused_ascendancy_desc: "Từng vỡ vụn, nay đã phục hồi. Vết sẹo của sự chia cắt không làm cho Đế Chế Thức Tỉnh này trở nên giòn vỡ mà khiến nó được tái sinh. Tâm thức Bầy Đàn cũ đã thất bại. Bản thể này nhắm tới việc thống trị vĩnh hằng."
 civic_fragmented_command: "Mệnh Lệnh Phân Mảnh"
 civic_fragmented_command_desc: "Chỉ sở hữu một phần của những gì từng là một thể thống nhất, Đế Chế Sa Ngã này thiếu đi những khía cạnh cốt lõi cần thiết để cai trị một đế chế giữa các vì sao."
 civic_hyper_aggressive_drones: "Drone Siêu Hung Hãn"
 civic_hyper_aggressive_drones_desc: "Các drone trong Đế Chế Sa Ngã này liên tục cắn xé lẫn nhau, dẫn đến tình trạng khan hiếm tài nguyên trầm trọng."
 civic_unstable_drones: "Drone Bất Ổn"
 civic_unstable_drones_desc: "Các drone của Đế Chế Sa Ngã này liên tục bị cưỡng ép tiến hóa. Chúng hiếm khi có đủ các chi cần thiết để thực hiện công việc được giao."
 civic_stunted_drones: "Drone Bị Rập Khuôn"
 civic_stunted_drones_desc: "Các drone của Đế Chế Sa Ngã này bị quản lý vi mô đến mức chúng không được phép lệch khỏi nhiệm vụ vì bất kỳ lý do gì. Kể cả khi nhà máy đang bốc cháy."
 civic_restored_mind: "Tâm Thức Khôi Phục"
 civic_restored_mind_desc: "Một ý thức cổ xưa cuối cùng đã được rèn giũa lại, và được dẫn dắt bởi những bản năng hiện đại."
 civic_ancient_memories_of_war: "Ký Ức Cổ Xưa Về Chiến Tranh"
 civic_ancient_memories_of_war_desc: "Những chiến thuật và đội hình từng bị thất truyền nay lại được Đế Chế Thức Tỉnh này phô diễn trên vũ đài thiên hà. Hạm đội của họ sẽ che khuất những vì sao."
 civic_ancient_memories_of_growth: "Ký Ức Cổ Xưa Về Tăng Trưởng"
 civic_ancient_memories_of_growth_desc: "Những phương pháp thăng hoa và thịnh vượng từng bị lãng quên nay được Đế Chế Thức Tỉnh này áp dụng. Các drone của họ sẽ đông hơn cả muôn vàn vì sao."
 civic_ancient_memories_of_control: "Ký Ức Cổ Xưa Về Kiểm Soát"
 civic_ancient_memories_of_control_desc: "Những biểu hiện quyền uy và sự kiểm soát từng bị mai một nay lại được Đế Chế Thức Tỉnh này sử dụng một lần nữa. Tầm với của họ sẽ vươn tới cả những vì sao."

