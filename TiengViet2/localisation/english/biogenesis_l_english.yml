###Starlit Citadel

 origin_starlit_citadel: "Thành Trì Ánh Sao"
 origin_starlit_citadel_desc: "Một cổng không gian bí ẩn hiện diện nơi rìa hệ sao quê hương của nền văn minh này, một lối vào mà từ đó các thực thể thù địch tràn ra từng đợt không ngừng nghỉ. Những cuộc xâm lăng này vừa khó lường vừa không thể tránh khỏi, buộc muôn dân phải dựa vào kỳ tích công nghệ vĩ đại nhất của mình — §H$dsc_name$§!."
 origin_tooltip_starlit_citadel_effects: "- $HOME_SYSTEM$ $TABBED_NEW_LINE$- ['concept_deep_space_bastion'] tại rìa giếng trọng lực $TABBED_NEW_LINE$- ['concept_wormhole', $BYPASS_STARLIT_WORMHOLE$] dẫn đến một hệ sao chưa biết $NEW_LINE$- $HOMEWORLD$ $TABBED_NEW_LINE$- £building£ ['building:building_citadel_uplink'] $TABBED_NEW_LINE$- ['concept_bioship_remains', £blocker£ $d_bioship_remains$] $TABBED_NEW_LINE$- ['concept_invasion_site', £blocker£ $d_invasion_site$]: +2 $NEW_LINE$- $ADDITIONAL_TECHNOLOGIES_STRING$ ['concept_deep_space_citadel_tech',£engineering_research£ $tech_deep_space_citadel$]"

 START_SCREEN_STARLIT_CITADEL: "Chúng ta không phải lúc nào cũng cảnh giác như vậy.\n\n[Capital.GetName] là một thế giới trù phú, và đã từng có thời chúng ta là một dân tộc sống trong hòa bình và mãn nguyện. Nhưng mọi thứ đã thay đổi khi cánh cổng mở ra.\n\nKhông một lời cảnh báo, [GetInvadersLower] đã tràn đến. Chúng san phẳng các thành phố, tàn phá các vùng đất của chúng ta, rồi biến mất nhanh chóng như khi chúng xuất hiện. Chúng ta từng dám hy vọng rằng chúng sẽ không bao giờ quay lại. Nhưng các cuộc xâm lăng lại tái diễn, hết lần này đến lần khác, mỗi đợt tấn công sau lại tàn bạo hơn đợt trước.\n\nGiờ đây, khi chuẩn bị dấn thân vào dải ngân hà, các $job_skywatcher_plural$ của chúng ta đã sẵn sàng. Ngự trị trên bầu trời của hành tinh, $dsc_name$ uy dũng đang đợi sẵn, một bức tường thành kiên cố chống lại [GetInvadersLower] và bất kỳ kẻ nào mưu toan tiêu diệt chúng ta."

