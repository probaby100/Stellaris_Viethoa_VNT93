 DSC_TARGET_MAGNET_DESC: "Mảng ăng-ten làm tăng diện tích phản xạ mục tiêu của trạm phòng thủ này một cách nhân tạo, buộc vũ khí của kẻ thù phải nhắm vào nó thay vì các đồng minh xung quanh."
