 voidspawn_boss_buffs: "Sức Mạnh Nguyên Thủy"
 voidspawn_system_mod: "Bão Hư Không"
 voidspawn_colony_mod: "Xung Đột Thuộc Địa"
 voidspawn_colony_mod_desc: "Các thế giới đang mưng mủ dưới bóng đen của Dị Chủng Hư Không Cổ Đại."
 VOIDSPAWN_FORCE_DECLINE: "§RSuy giảm dân số§!"

 elder_voidspawn_chain_title: "Dị Chủng Hư Không Nổi Loạn"
 elder_voidspawn_chain_desc: "Có một dị chủng hư không khổng lồ đang càn quét khắp thiên hà. Nó muốn săn lùng các quái thú behemoth to lớn, và nhiều khả năng nếu chúng ta hạ sát chúng thay nó, nó có thể sẽ để chúng ta yên.\n\nMỤC TIÊU: Tìm và Tiêu diệt tất cả Behemoth bậc 4 trong thiên hà."

 behemoth_victory_chain_title: "Vua Của Quái Thú"
 behemoth_victory_chain_desc: "Khi sự Hợp Nhất Tâm Trí đã hoàn tất, chỉ còn vài bước nữa là ngăn cách giữa chúng ta và tham vọng của mình. Chúng ta phải làm quen với cơ thể chia sẻ mới này và tiếp tục chuyển hóa tâm trí của người dân, nhưng quan trọng hơn là chúng ta sẽ cần phải nghiền nát bất kỳ kẻ thách thức nào, bất kể chúng là ai.\n\n§HMỤC TIÊU§!:\n- Tìm và Tiêu diệt bất kỳ Behemoth cấp 4 nào khác trong thiên hà.\n- Hoàn thành tình hình Cơn Đau Tăng Trưởng.\n- Hạ sát Dị Chủng Hư Không Cổ Đại."

 behemoth_transference: "Chuyển Hóa Behemoth"
 behemoth_transference_desc: "Mối liên kết hiện hữu giữa Quái Thú và dân cư của chúng ta đã rọi một ánh sáng mới lên kiếp sống bám víu hành tinh. Một cảm giác vô nghĩa khi so sánh với việc hòa làm một cùng quái thú. Mọi người giờ đây đều khao khát được hợp nhất trong Quái Thú, và cảm thấy... đói khát vô độ."

