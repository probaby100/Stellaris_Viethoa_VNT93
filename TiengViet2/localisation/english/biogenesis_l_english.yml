 feral_insight_crisis_description_title: "Thảm Họa Cự Thú"
 feral_insight_crisis_description: "$menace_crisis_description_intro$\n\nNhững Leviathan ngự trị trong khoảng không hư vô là những thực thể ghê gớm với sức mạnh vô song, nhưng lại thiếu đi mục đích và tham vọng. Sự kết hợp giữa sinh lý học hùng mạnh của chúng với sự kiên cường trí tuệ của chúng ta sẽ khai sinh ra một thế hệ sinh vật không gian mới và đưa chúng ta lên đỉnh cao thống trị dải ngân hà."
 feral_insight_crisis_howto_title: "Khai Sinh Cự Thú"
 feral_insight_crisis_howto: "Theo đuổi các §HMục Tiêu Thảm Họa§! sẽ tạo ra £feral_insight£ §HTri Thức Dã Tính§!, cho phép chúng ta giải phóng toàn bộ tiềm năng sinh học của mình."

 feral_insight_crisis_level_unlocked: "Tại cấp độ $LEVEL$, bạn nhận được phần thưởng:\n"
 feral_insight_crisis_level_locked: "Yêu cầu để mở khóa cấp độ này:\n"
 feral_insight_crisis_level_unlock: "Có £feral_insight£ §Y$CURRENCY$§! Tri Thức Dã Tính"
 feral_insight_crisis_level_desc: "Để tiến qua các cấp độ Thảm Họa, hãy tích lũy £feral_insight£ §HTri Thức Dã Tính§!, nghiên cứu các Dự Án Thảm Họa Đặc Biệt và nuôi lớn Cự Thú của bạn."

 #Crisis Perks

 menp_behemoth_objectives: "Tri Thức Dã Tính"
 unlocks_behemoth_objectives: "Cho phép tích lũy £feral_insight£ §Y$menp_behemoth_objectives$§! bằng cách hoàn thành §HMục Tiêu Thảm Họa§!.\n"
 menp_behemoth_objectives_desc: "Nghiên cứu hành vi của Cự Thú sẽ hỗ trợ mục tiêu thăng hoa tối thượng của chúng ta. Chúng ta sẽ rũ bỏ những ràng buộc sinh học vốn cai trị sự sống sinh ra từ hành tinh."
 menp_behemoth_bioship_1: "Chitin Cứng Hơn"
 menp_behemoth_bioship_1_desc: "Chịu đựng sự khắc nghiệt của không gian đòi hỏi một lớp vỏ ngoài dày dặn. Sức chịu đựng bên ngoài sẽ đảm bảo sự sinh tồn ngay cả trong những điều kiện ảm đạm nhất."
 menp_behemoth_society_1: "Đẩy Nhanh Thử Nghiệm Thực Địa"
 menp_behemoth_society_1_desc: "Các thí nghiệm trong phòng nghiên cứu là điểm khởi đầu tốt, nhưng tiến bộ thực sự đòi hỏi các cuộc thử nghiệm thực tế đầy rủi ro trên thực địa."
 menp_behemoth_food_1: "Cây Trồng Siêu Kích Cỡ"
 menp_behemoth_food_1_desc: "Thỏa mãn cơn thèm ăn vô độ của một Cự Thú là một cuộc chiến cam go. Sản xuất thực phẩm biến đổi gen trên quy mô khổng lồ là một bước khởi đầu."

 menp_behemoth_egg: "Kho Ấp Khổng Lồ"
 unlocks_behemoth_egg: "Mở khóa Đại công trình §YTrứng Cự Thú§!.\n"
 menp_behemoth_egg_desc: "Một quả trứng khổng lồ đòi hỏi một cơ sở ấp trứng đồ sộ không kém. Kho ấp quỹ đạo này phải được bố trí ở một khoảng cách được tính toán kỹ lưỡng so với ngôi sao để chứa được tỷ lệ khổng lồ cần thiết nhằm ôm trọn một Cự Thú."
 menp_behemoth_bioship_2: "Kích Thích Tuyến Tiết Tốt Hơn"
 menp_behemoth_bioship_2_desc: "Với các đầu dò được chế tạo chuyên dụng, chúng ta đang kích thích nhân tạo các tuyến nội tiết của Cự Thú để sản xuất hormone tăng trưởng nhằm đẩy nhanh quá trình phát triển."
 menp_behemoth_society_2: "Khảo Sát Đa Ngành"
 menp_behemoth_society_2_desc: "Tại giao điểm của chọn lọc tự nhiên và kỹ thuật sinh học, một sức mạnh vô song được khai sinh."
 menp_behemoth_food_2: "Quá Tải Dinh Dưỡng"
 menp_behemoth_food_2_desc: "Thỏa mãn cơn đói cồn cào của một Cự Thú có thể là điều bất khả thi. Sản xuất thực phẩm biến đổi gen trên quy mô đại trà chỉ mới là khởi đầu."

 menp_behemoth_hatchling: "Lứa Đẻ Khổng Lồ"
 unlocks_behemoth_hatchling: "Cho phép chúng ta §YẤp Nở§! các Đại công trình Trứng Cự Thú.\n"
 menp_behemoth_hatchling_desc: "Một bầy Cự Thú sải cánh qua các hệ sao. Các nước láng giềng trong dải ngân hà sẽ phải tôn trọng quyền tự trị của đàn con của chúng ta, bằng không họ sẽ trở thành thức ăn."
 menp_behemoth_bioships_3: "Chu Kỳ Tăng Trưởng Nhanh Hơn"
 menp_behemoth_bioships_3_desc: "Đẩy nhanh sự phát triển của hệ động vật không gian khổng lồ là điều tối quan trọng đối với mục tiêu cuối cùng của chúng ta. Chúng ta sẽ đảm bảo cơ sở hạ tầng của mình phát triển song hành."
 menp_behemoth_society_3: "Làm Chủ Kỹ Thuật Sinh Học"
 menp_behemoth_society_3_desc: "Thông qua các cuộc thử nghiệm và sai sót nghiêm ngặt, chúng ta đã phát triển năng lực khoa học của mình. Giờ đây, chúng ta khẳng định vị thế là những kỹ sư sinh học lỗi lạc nhất trong thiên hà."
 menp_behemoth_mind_control: "Định Hình Tư Duy Sâu Sắc"
 unlocks_behemoth_mind_control: "Cho phép chúng ta tác động đến tâm trí của các §YCự Thú§!.\n"
 menp_behemoth_mind_control_desc: "Trí tuệ tập thể của chúng ta đang trỗi dậy, khao khát một điều gì đó to lớn hơn và hoàn hảo hơn. Tham vọng của chúng ta không có giới hạn."

 menp_behemoth_hatchling_2: "Tăng Trưởng Không Ràng Buộc"
 unlocks_behemoth_hatchling_2: "Cho phép các §YCự Thú§! đã no nê hóa nhộng thành kén để tăng vọt về kích thước và sức mạnh.\n"
 menp_behemoth_hatchling_2_desc: "Quái thú đã thoát khỏi xiềng xích. Sinh vật từng chỉ là một con non đang nhanh chóng trở thành một thế lực tự nhiên tàn bạo, không thể khuất phục."
 menp_behemoth_bioship_4: "Sinh Vật Mạnh Mẽ Hơn"
 menp_behemoth_bioship_4_desc: "Được thúc đẩy bởi cơn đói cồn cào và cơn thịnh nộ bất tận, các cự thú đang chạm tới một cấp độ sức mạnh hỗn loạn. Vũ khí sinh học của chúng đã sẵn sàng, chuẩn bị giáng tai ương lên cả kẻ thù lẫn những kẻ ngoài cuộc."
 menp_behemoth_mutation_research: "Đột Biến Cự Thú"
 unlocks_behemoth_mutation_research: "Mở khóa một §YDự Án Đặc Biệt§! để định hình sự phát triển di truyền của các §YCự Thú§!.\n"
 menp_behemoth_mutation_research_desc: "Chúng ta sẽ tái sắp xếp vật chất di truyền của các cự thú khi chúng tiếp tục lớn lên, khuyến khích các đặc điểm sinh lý có lợi nhất."
 menp_behemoth_mind_control_2: "Triển Khai Mẫu Vật Đỉnh Cao"
 unlocks_behemoth_mind_control_2: "Chúng ta sẽ thiết lập mối liên kết tâm linh sâu sắc hơn với các §YCự Thú§! của mình.\n"
 menp_behemoth_mind_control_2_desc: "Đỉnh cao của sự hoàn hảo di truyền sẽ không bị giam hãm trong biên giới hiện tại của chúng ta. Nó phải được ban phát cho toàn thể dải ngân hà."

 menp_behemoth_mind_meld: "Hòa Nhập Tâm Trí"
 unlocks_behemoth_mind_meld: "Nắm toàn quyền kiểm soát một §YCự Thú Cấp IV§! hùng mạnh — một sinh vật vô song về khả năng thống trị dải ngân hà.\n"
 menp_behemoth_mind_meld_desc: "Tâm trí chúng ta hòa vào Cự Thú, tâm trí Cự Thú hòa vào chúng ta. Cơn thịnh nộ của nó trở thành của chính chúng ta. Chúng ta tự nguyện bị nuốt trọn, và khi con quái vật ngấu nghiến ý thức tập thể của chúng ta, chúng ta cảm nhận được cơn giận dữ ngút ngàn của nó. Nó trở thành chúng ta, và chúng ta trở thành quái thú."
 menp_behemoth_primal_roar: "Tiếng Gầm Nguyên Thủy"
 unlocks_behemoth_primal_roar: "Hiệu triệu con quái thú lớn nhất và thách thức quyền thống trị khoảng không hư vô.\n"
 menp_behemoth_primal_roar_desc: "Nó cuộn trào trong huyết quản chúng ta, thiêu đốt, xé toạc, bỏng rát. Một cơn cuồng nộ, một tiếng gầm nguyên thủy. Thiên hà sẽ bùng cháy trong ngọn lửa giận dữ của chúng ta."
 menp_behemoth_ever_hungry: "Mãi Mãi Đói Khát"
 unlocks_behemoth_ever_hungry: "Mở khóa Tình Huống $behemoth_finale_situation$. Thưởng thức bữa tiệc thiên hà này để gia tăng kích thước và sức mạnh, trở thành kẻ săn mồi tối thượng giữa các vì sao.\n"
 menp_behemoth_ever_hungry_desc: "Chúng ta đang trong nỗi thống khổ, nhu cầu ăn liên tục trở thành động lực duy nhất cho sự tồn tại của chúng ta. Có một cái hố sâu bên trong chúng ta không bao giờ có thể lấp đầy, bất kể chúng ta tiêu thụ bao nhiêu. Chúng ta đòi hỏi không gì khác ngoài một bữa tiệc quy mô thiên hà để xoa dịu nỗi đau này."
 menp_behemoth_egg_2: "Hậu Duệ Phàm Ăn"
 unlocks_behemoth_egg_2: "Mở khóa khả năng cho các §YCự Thú Cấp IV§! đẻ §YTrứng§! và duy trì nòi giống của chúng.\n"
 menp_behemoth_egg_2_desc: "Đàn con của chúng ta sẽ ngấu nghiến xác chết của dải ngân hà. Cơn đói của chúng không có hồi kết. Qua cõi vô tận của thời gian, chúng sẽ tiếp tục tiệc tùng."

 mod_shipclass_military_hull_mult: "Thân vỏ Tàu Quân Sự"
 mod_country_resource_max_food_add: "Sức Chứa Kho Thực Phẩm"
