 concept_genetic_purity: "Sự Hoàn Hảo Di Truyền Của Loài"
 concept_genetic_purity_desc: "Các chính thể đã đón nhận ['tradition_category:tradition_purity'] sẽ có các hiệu ứng và bổ trợ tăng giảm theo tỷ lệ áp dụng lên £pop£ §HPop Hữu cơ§! và £leader£ §HLãnh đạo§! của họ.$TABBED_NEW_LINE$- Gia tăng bởi Điểm Đặc điểm chi tiêu cho các Đặc điểm Loài §GTích cực§!.$TABBED_NEW_LINE$- Giảm đi bởi Điểm Đặc điểm nhận được từ các Đặc điểm Loài §RTiêu cực§!."

 trait_leader_genetic_purist: "Kẻ Thanh Lọc Di Truyền"
 trait_leader_genetic_purist_desc: "Công việc của lãnh đạo này được dẫn dắt bởi một tầm nhìn kiên định về sự hoàn hảo di truyền, và tuyệt đối không khoan nhượng trước mọi dạng thức của sự bất toàn."

 auth_bio_democratic_purity: "Tự Trị Kiểu Hình"
 auth_bio_democratic_purity_tt: "$pop_effects_from_purity_header$ $TABBED_NEW_LINE$- £mod_pop_happiness£ $MOD_POP_HAPPINESS$: $plus_minus_icon$§Y$@purity_traits_happiness|1%$§! $DOUBLE_NEW_LINE$$authority_grants_genetic_purist_tt$ $TABBED_NEW_LINE$- $mod_leaders_upkeep_mult$ $minus_plus_icon$§Y2.5%§! $TABBED_NEW_LINE$- $MOD_LEADER_SPECIES_EXP_GAIN$ $plus_minus_icon$§Y2.5%§!"
 auth_bio_democratic_purity_desc: "Tự quyết về thân thể là một quyền cơ bản. Nhà nước trao quyền cho các cá nhân tùy ý cải biến hình thể theo mong muốn của họ. Chỉ bị giới hạn bởi trí tưởng tượng, cơ thể trở thành bức toan nghệ thuật tối thượng."

 auth_bio_oligarchic_purity: "Hệ Thống Thứ Bậc Ưu Sinh"
 auth_bio_oligarchic_purity_tt: "$eugenic_political_power_effects$"
 auth_bio_oligarchic_purity_desc: "Quyền lực tuyệt đối phải được trao cho tầng lớp tinh hoa được định đoạt bởi di truyền, những người bảo hộ thuần khiết nhất và tài năng nhất cho vận mệnh của nền văn minh này. Bên dưới họ, mỗi công dân hoàn thành một vai trò đã được định sẵn, được đo ni đóng giày tỉ mỉ theo tiềm năng di truyền kế thừa của họ. Sự mãn nguyện không đến từ tham vọng, mà từ việc chấp nhận sứ mệnh được giao phó."
 eugenic_political_power_effects: "$pop_effects_from_purity_header$ $TABBED_NEW_LINE$- $MOD_POP_BONUS_WORKFORCE_MULT$: $plus_minus_icon$§Y$@purity_traits_bonus_workforce_mult|2%$§! $DOUBLE_NEW_LINE$$authority_grants_genetic_purist_tt$ $TABBED_NEW_LINE$- $MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: $plus_minus_icon$§Y2.5%§! $TABBED_NEW_LINE$- $MOD_LEADER_MAX_POSITIVE_TRAITS_CAP$: $plus_minus_icon$§Y1§!"

 auth_bio_dictatorial_purity: "Chuyên Chế Tiến Hóa Định Hướng"
 auth_bio_dictatorial_purity_tt: "$pop_effects_from_purity_header$ $TABBED_NEW_LINE$£society£ Nghiên cứu Xã hội được tạo ra mỗi $pop_group_unit$ £pop£ Pop: $plus_minus_icon$§Y$@purity_traits_resource$§! $DOUBLE_NEW_LINE$$authority_grants_genetic_purist_tt$ $TABBED_NEW_LINE$- $MOD_PLANET_CRIME_ADD$ Hành tinh: $minus_plus_icon$§Y5.0§! $TABBED_NEW_LINE$- $MOD_PLANET_CRIME_ADD$ Tinh khu: $minus_plus_icon$§Y2.5§! $TABBED_NEW_LINE$- $MOD_PLANET_STABILITY_ADD$ Hành tinh: $plus_minus_icon$§Y5.0§! $TABBED_NEW_LINE$- $MOD_PLANET_STABILITY_ADD$ Tinh khu: $plus_minus_icon$§Y2.5§!"
 auth_bio_dictatorial_purity_desc: "Sự phát triển của loài ta là một quá trình được hiệu chỉnh nghiêm ngặt hướng tới sự ưu việt không thể lay chuyển. Dưới sự dẫn dắt của một nhà lãnh đạo độc tôn, xã hội kiên định loại bỏ mọi khiếm khuyết di truyền, thúc đẩy sự tiến hóa với quyết tâm sắt đá. Không khoan nhượng cho sự suy thoái, mọi thế hệ đều là minh chứng sống động cho mục đích tối cao của nền văn minh."

 auth_bio_imperial_purity: "Vương Triều Huyết Mạch"
 auth_bio_imperial_purity_tt: "Hiệu ứng của £leader£ §Y$imperial_ruler$§! và §YNgười Kế Vị§! từ ['concept_genetic_purity']:$TABBED_NEW_LINE$- $MOD_LEADER_SKILL_ADD$: $plus_minus_icon$§Y$@purity_traits_imperial_level|2$§! $DOUBLE_NEW_LINE$£leader£ Lãnh đạo thuộc §YChủng Loài Của [Ruler.GetTitle]§! của chúng ta nhận được đặc điểm §Y$imperial_bloodline$§!\nHiệu ứng của £leader£ §YHuyết Mạch Hoàng Gia§! từ ['concept_genetic_purity']: $TABBED_NEW_LINE$- $MOD_LEADER_LIFESPAN_MULT$: $plus_minus_icon$§Y$@purity_traits_imperial_bloodline|1%$§! $TABBED_NEW_LINE$- $MOD_LEADER_SPECIES_EXP_GAIN$: $plus_minus_icon$§Y$@purity_traits_imperial_bloodline|1%$§!"
 auth_bio_imperial_purity_desc: "Quyền thống trị của đế vương bắt nguồn từ sự thuần khiết tuyệt đối của dòng máu hoàng gia. Trải qua vô số thế hệ được chọn lọc cẩn trọng, dòng dõi tối cao này là đỉnh cao của sự hoàn hảo di truyền. Ngai vàng truyền từ thế hệ này sang thế hệ khác như một minh chứng sống động cho tính ưu việt của dòng dõi, ngự trị không thể thách thức trên đỉnh kim tự tháp tiến hóa."

 auth_bio_corporate_purity: "Tập Đoàn Phả Hệ Thuần Chủng"
 auth_bio_corporate_purity_tt: "$organic_leaders_have_trade_upkeep$\n\n$pop_effects_from_purity_header$ $TABBED_NEW_LINE$- $r_trade$ Được tạo ra mỗi $pop_group_unit$ £pop£ Pop: $plus_minus_icon$§Y$@purity_traits_resource$§! $DOUBLE_NEW_LINE$"
 auth_bio_corporate_purity_desc: "Trong tập đoàn này, di truyền học là một ngành kinh doanh có lợi nhuận cao. Bằng cách thương mại hóa các dòng giống thuần chủng và các mẫu vật hoàn hảo, họ tạo ra nguồn thu từ chính bản thiết kế của sự sống. Từ các liệu trình tinh lọc phả hệ cho giới thượng lưu đến việc bán các dòng gen cao cấp, họ phục vụ cho những người mua tha thiết, đảm bảo rằng mọi tài sản di truyền đều mang lại lợi nhuận tối đa."

 # Cloning

 auth_bio_democratic_cloning: "Hòa Hợp Đa Bản"
 auth_bio_democratic_cloning_tt: "$ENABLES_BACKUP_CLONES$\nChi phí duy trì §Y$leader_trait_backup_clone_default$§!: §G$@cordant_multiplicity_clone_upkeep|0%$§!\n§Y$leader_trait_backup_clone_default_plural$§! được giảm ['concept_clone_leader_degradation', Sự Suy Thoái] và không thể có §Y$leader_trait_has_backup_clone_plural$§!"
 auth_bio_democratic_cloning_desc: "Chính phủ này đón nhận công nghệ nhân bản như một minh chứng cho sự bình đẳng và tiến bộ. Những cá thể nhân bản sát cánh cùng những cá thể sinh ra tự nhiên, tiếng nói của họ được coi trọng ngang nhau. Ý chí của nhân dân được làm phong phú thêm nhờ sự đa dạng của mọi góc nhìn, dù là nhân bản hay không."
 auth_bio_oligarchic_cloning: "Nhiếp Chính Nhân Bản"
 auth_bio_oligarchic_cloning_tt: "$ENABLES_BACKUP_CLONES$\nĐặc điểm §Y$leader_trait_has_backup_clone$§! cung cấp thêm hiệu ứng cho Thành Viên Hội Đồng\n§Y$leader_trait_backup_clone_default_plural$§! được giảm ['concept_clone_leader_degradation', Sự Suy Thoái] khi phục vụ trong Hội đồng\n"
 auth_bio_oligarchic_cloning_desc: "Xã hội này đảm bảo sự cai trị vĩnh cửu của giới tinh hoa bằng cách neo giữ quyền lực trong huyết mạch bất đoạn của những bản sao ưu việt. Công nghệ nhân bản bảo tồn và hoàn thiện di sản di truyền của họ, tạo ra sự tiếp nối lãnh đạo liền mạch. Mọi vị trí quyền lực đều do một phiên bản cải tiến của cùng một dòng máu cao quý nắm giữ, củng cố vị thế thống trị của họ qua nhiều thế hệ."
 auth_bio_dictatorial_cloning: "Quy Thuần Đồng Nhất"
 auth_bio_dictatorial_cloning_tt: "$ENABLES_BACKUP_CLONES$\n$AVAILABLE_POLICIES$ §Y$policy_homogenous_class$§!"
 auth_bio_dictatorial_cloning_desc: "Lòng trung thành tuyệt đối được đảm bảo thông qua quá trình sàng lọc di truyền tỉ mỉ, chỉ những cá thể được lập trình sẵn để phục tùng vô điều kiện mới được chọn làm nguồn nhân bản. Điều này tạo nên một xã hội tự duy trì, nơi nổi loạn không chỉ khó xảy ra mà còn là điều bất khả thi về mặt sinh học, bảo đảm sự hài hòa vĩnh cửu từ chính cấu trúc thiết kế của các công dân."
 auth_bio_imperial_cloning: "Kế Thừa Bất Tận"
 auth_bio_imperial_cloning_tt: "$ENABLES_BACKUP_CLONES$\nĐặc điểm §Y$leader_trait_backup_clone_imperial$§! không bị gia tăng hình phạt"
 auth_bio_imperial_cloning_desc: "Uy quyền chính đáng không thể bàn cãi của đấng cai trị được bảo tồn thông qua nhân bản, với mỗi thế hệ của đấng tối cao kế thừa trí tuệ và những chiến tích từ tiền kiếp của họ. Sự tiếp nối lãnh đạo liền mạch này đảm bảo sự thăng tiến không ngừng của xã hội, duy trì một thời kỳ hoàng kim vĩnh cửu dưới sự trị vì sáng suốt của họ."
 auth_bio_corporate_cloning: "Hiệp Hội Nhân Bản"
 auth_bio_corporate_cloning_tt: "$organic_leaders_have_trade_upkeep$\n$ENABLES_BACKUP_CLONES$\n$mod_planet_jobs_trade_produces_mult$ từ £building£ ['building:building_clone_vats']: §G+$@replicatory_association_trade_mult|0%$§!\n£mod_planet_amenities_add£ Tiện nghi Hành tinh từ £building£ §Y$building_clone_vats$§!: §G+$@replicatory_association_amenities_add|0$§!\n$AVAILABLE_POLICIES$ §Y$policy_replicatory_association_insurance$§!"
 auth_bio_corporate_cloning_desc: "Sự tiện lợi và thoải mái vô song giờ đây đã nằm trong tầm tay. Hãy sở hữu một bản sao của chính bạn để dự phòng bộ phận hoặc đặt hàng một bản sao của người thân đã khuất. Siêu tập đoàn này cam kết độ chính xác 93% trong mỗi lần nhân bản, kết hợp công nghệ tiên tiến với lời hứa về sự an ủi thông qua quá trình sao chép chuẩn xác."

