### BIOMORPHOSIS (GENETIC ASCENSION) SITUATION(S)
## REGULAR EMPIRE SITUATION
 # SET-UP / PREAMBLE
 genetic_ascension_situation: "Biến Đổi Sinh Học"
 genetic_ascension_situation_type: "$genetic_ascension_situation$"
 genetic_ascension_situation_desc: "Quy luật chọn lọc tự nhiên và phiêu bạt di truyền không còn là rào cản ngăn chúng ta thống trị sinh học. Với tư cách là một nền văn minh, chúng ta đang đứng trước ngưỡng cửa tái định hình tương lai của giống loài mình. [Owner.Species.GetFleshTypeCyberCreed] là đất sét, và chúng ta là người nghệ nhân điêu khắc nó."
 genetic_ascension_situation_monthly_change_tooltip: "Các nhà di truyền học của chúng ta không ngừng thúc đẩy nghiên cứu tiến lên."
 genetic_ascension_situation_outcome: "Chúng ta sẽ khai mở toàn bộ tiềm năng thao túng di truyền và đảm bảo sự tiến bộ vượt bậc của giống loài mình.\n\nChúng ta sẽ lựa chọn biểu hiện tối thượng của Biến Đổi Sinh Học."
 genetic_ascension_situation_pause_desc: "Tình Huống Tạm Dừng"
 genetic_ascension_approach_selected: "$TRIGGER_FAIL$Chúng ta đã đưa ra lựa chọn cho giai đoạn này."
 situation_gene_tailoring_needed_desc: "$TRIGGER_FAIL$KHÔNG có Công nghệ ['concept_gene_tailoring']"
 mod_biomorphosis_progress_mult: "Tiến độ Hàng tháng của $genetic_ascension_situation$"

 # STAGE EVENTS

 bio.5.name: "Biến Đổi Bản Chất" # STAGE ONE
 bio.5.desc.no_options: "Để đẩy nhanh quá trình tiến hóa, chúng ta phải dứt khoát lựa chọn con đường sẽ định hình hành trình của mình. Khi bắt đầu nhận ra toàn bộ tiềm năng, chúng ta ý thức sâu sắc rằng nỗ lực này có thể thay đổi tận gốc bản chất cốt lõi của chúng ta.\n\nThiết kế tiến hóa là một nhiệm vụ mang ý nghĩa sâu xa. Những biến đổi chúng ta thực hiện lúc này sẽ tái định hình tương lai của chúng ta."
 bio.5.desc.has_options: "$bio.5.desc.no_options$\n\nĐể bắt đầu nâng tầm chính mình, giờ đây chúng ta phải lựa chọn con đường mà chúng ta sẽ khởi đầu cuộc hành trình."
 bio.5.a: "Con đường Thuần Khiết."
 bio.5.b: "Con đường Nhân Bản."
 bio.5.c: "Con đường Đột Biến."

 bio.10.name: "Điểm Tới Hạn" # STAGE TWO
 bio.10.desc.no_options: "Thiết kế sự tiến hóa của chính mình đã đem lại những tiến bộ sâu sắc. Giờ đây chúng ta sở hữu sự hiểu biết sâu sắc hơn về các đặc tính di truyền, sinh sản và giải trình tự DNA.\n\nĐỉnh cao của sự tiến bộ đã nằm trong tầm tay. Chỉ trong vài năm nữa, chúng ta sẽ nhận ra trọn vẹn tiềm năng của mình với tư cách là một giống loài."
 bio.10.desc.has_options: "$bio.10.desc.no_options$\n\nTuy nhiên hiện tại, chúng ta có thể tiếp tục con đường đang đi, hoặc chọn một trọng tâm khác cho giai đoạn phát triển tiếp theo."
 bio.10.a: "Tập trung vào Thuần Khiết."
 bio.10.b: "Tập trung vào Nhân Bản."
 bio.10.c: "Tập trung vào Đột Biến."

 bio.15.name: "Ngã Rẽ Tiến Hóa" # STAGE THREE
 bio.15.desc.no_options: "Những nỗ lực của chúng ta đã đưa chúng ta đến bờ vực của một bước chuyển biến tiến hóa quan trọng. Chẳng bao lâu nữa, chúng ta phải đưa ra quyết định hệ trọng liên quan đến con đường sẽ đi để phát huy trọn vẹn tiềm năng tiến hóa."
 bio.15.desc.has_options: "$bio.15.desc.no_options$\n\nMột lần nữa, chúng ta phải quyết định nơi chúng ta nên tập trung nỗ lực."
 bio.15.a: "Chúng ta chọn Thuần Khiết."
 bio.15.b: "Chúng ta sẽ làm chủ Nhân Bản."
 bio.15.c: "Đột biến sẽ dẫn lối chúng ta tới tương lai."

 genetic_ascension_approach_purity: "Thuần Khiết"
 genetic_ascension_approach_cloning: "Nhân Bản"
 genetic_ascension_approach_mutation: "Đột Biến"
 genetic_ascension_approach_purity_desc: "Chúng ta sẽ tập trung nỗ lực để trở nên thuần khiết."
 genetic_ascension_approach_cloning_desc: "Nghiên cứu nhân bản sẽ cho phép chúng ta tăng trưởng."
 genetic_ascension_approach_mutation_desc: "Tương lai của chúng ta nằm ở đột biến di truyền."

 bio.20.name: "Con Đường Đã Chọn" # FINAL STAGE - TRADITION TREE CHOICE
 bio.20.desc: "Dù chúng ta nỗ lực vươn tới hình thái thuần khiết nhất của chính mình, nhân bản để mở lối thành công, hay tăng cường gen thông qua đột biến có chủ đích, thời khắc này đánh dấu một điểm không thể quay đầu."
 bio.20.desc.evopred: "Bản chất của chúng ta luôn luôn dễ uốn nắn. Chúng ta là dạng sống phức tạp nhất trong vũ trụ này, và với sự hỗ trợ từ nghiên cứu, chúng ta sẽ không ngừng biến đổi.\n\nTương lai đầy rẫy hỗn loạn, và điều đó hoàn hảo cho chúng ta."
 bio.20.a: "Chúng ta sẽ thấu hiểu ý nghĩa của sự thuần khiết."
 bio.20.b: "Chúng ta sẽ nhân bản chính mình để chạm tới thành công."
 bio.20.c: "Chúng ta sẽ khai thác sức mạnh của đột biến."

 # Random Events

 bio.50.name: "Bình Đẳng Hơn Kẻ Khác"
 bio.50.desc: "Là kết quả từ sự tập trung của chúng ta vào tinh lọc di truyền, các công dân được tăng cường thể chất đã bắt đầu coi bản thân vượt trội hơn hẳn so với phần còn lại của dân số. Họ đòi hỏi ngày làm việc ngắn hơn, nhiều tiện nghi hơn và quyền lực chính trị lớn hơn do cảm giác ưu việt của mình. Các cuộc biểu tình ngày càng hung hãn của họ đang gây ra tình trạng bất ổn xã hội đáng kể."
 bio.50.a: "Trấn áp những kẻ biểu tình."
 bio.50.b: "Đòi hỏi của họ là hoàn toàn có cơ sở."

 bio.55.name: "Phân Chia Xã Hội"
 bio.55.desc: "Những lời lẽ gây chia rẽ thống trị các bản tin thời sự, và các bất đồng đang xé nát các đơn vị xã hội. Một hình thái đấu tranh giai cấp mới đang trỗi dậy, khi nhiều cơ hội hơn rơi vào tay những kẻ có gen biến đổi.\n\nNhững người được tăng cường di truyền tin rằng họ đại diện cho tương lai của giống loài, trong khi những người theo chủ nghĩa truyền thống lại cảm thấy chúng ta đang đi quá xa vào vùng đất phi tự nhiên."
 bio.55.a: "Những cá nhân ưu việt vì một thế giới ưu việt."
 bio.55.b: "Có lẽ chúng ta đang đi quá nhanh."

 bio.60.name: "Bất Bình Đẳng Gen"
 bio.60.desc: "Những bài kiểm tra độ thuần khiết độc đoán đang trở nên phổ biến ở một số ngành nghề. Những cá nhân được coi là có cấu trúc gen vượt trội đang nhận được sự đối xử ưu ái trong công việc, giáo dục, và được trao quyền tiếp cận dễ dàng hơn tới các vị trí quyền lực một cách mù quáng.\n\nTrong khi một số người lập luận rằng các cá nhân được tăng cường sinh học quả thực mạnh mẽ và khỏe mạnh hơn, những người khác lại khẳng định rằng tư duy này tạo ra sự phân biệt đối xử bất công đối với những ai không muốn hoặc không thể biến đổi bộ gen của mình để theo đuổi sự hoàn hảo di truyền."
 bio.60.a: "Chúng ta phải đảm bảo cơ hội bình đẳng cho tất cả mọi người."
 bio.60.b: "Đây là sự đào thải tự nhiên của kẻ mạnh."

 bio.65.name: "Anh Hùng và Phản Diện"
 bio.65.desc: "Việc thúc đẩy sự thuần khiết đã khuyến khích một số cá nhân đảm nhận vai trò nổi bật trong an toàn công cộng. Được tăng cường thể lực siêu phàm, sự nhanh nhẹn và sức bền, các nhóm người hành hiệp tự xưng là anh hùng, tự nắm giữ luật pháp trong [owner.species.GetHandNamePlural] của mình.\n\nTuy nhiên, sự quả cảm mới mẻ này không phải không gặp thách thức. Trong bóng tối, những kẻ thù được tăng cường tương đương cũng đang trỗi dậy, dã tâm hiểm độc của chúng được thúc đẩy bởi mong muốn cân bằng cán cân quyền lực. Những cuộc đụng độ giữa hai phe đang gây ra thiệt hại tài sản đáng kể và thậm chí gây nguy hiểm cho dân thường."
 bio.65.a: "Hỗ trợ các cá nhân được tăng cường gen bảo vệ xã hội."
 bio.65.b: "Hạn chế sự tham gia của các \"anh hùng\" vào các vấn đề chính quyền."
 MAVERICK_CITIZENS_MOD: "Mỗi 100 việc làm [enforcer.GetIcon] §Y[enforcer.GetNamePlural]§! tạo ra §G+2§! $r_stability$ và §G+2§! $r_unity$."

 bio.66.name: "Hạn Chế Siêu Năng"
 bio.66.desc: "Chúng ta đã trấn áp các hoạt động của những cá nhân có siêu năng lực. Những sinh thể này giờ đây phải đối mặt với các hạn chế và quy định khắc nghiệt. Các nỗ lực giám sát đã cho phép chúng ta theo dõi và kiềm chế hoạt động của họ.\n\nTrong khi chúng ta nỗ lực hết mình để đảm bảo họ chỉ sử dụng năng lực của mình để phục vụ cho đế chế, thì sự sợ hãi và khinh thường ngày càng lớn giữa những người có siêu năng lực và những người không được tăng cường. Dân tộc của chúng ta đang bị chia rẽ sâu sắc về vấn đề này."
 bio.66.a: "Thành lập các trung đoàn siêu năng lực."
 bio.66.b: "Tái hòa nhập cho những người bị tước quyền."

 bio.67.name: "Phụ Thuộc Siêu Năng"
 bio.67.desc: "Sự phụ thuộc ngày càng lớn của chúng ta vào những hiệp sĩ tự phong được tăng cường gen đã trở thành một con dao hai lưỡi. Mặc dù những sinh thể này mang lại cho chúng ta cảm giác an toàn và thịnh vượng, chúng ta cũng nhận thức rõ rằng chúng ta đã trở nên phụ thuộc vào họ đến mức nào.\n\nNgười dân rất biết ơn, nhưng giờ đây họ lại tìm đến những cá nhân siêu năng lực này để nhận được sự chỉ dẫn và hỗ trợ, bỏ qua các thủ tục tư pháp và phớt lờ các quan chức. Ranh giới giữa những người hùng và chính phủ đã mờ nhạt. Cán cân quyền lực đang treo lơ lửng."
 bio.67.a: "Tập hợp một hội đồng siêu năng lực!"
 bio.67.b: "Hạn chế sự tham gia của các \"anh hùng\" vào các vấn đề chính quyền."

 bio.70.name: "Một Thành Hai"
 bio.70.desc: "Một thủ lĩnh xuất chúng, được ngợi ca khắp thiên hà vì tinh thần làm việc không mệt mỏi, vừa bị vạch trần không phải là một người, mà là hai cá nhân.\n\nSự thật được đưa ra ánh sáng là vị thủ lĩnh này đã có được một bản sao nhân bản hoàn hảo, cho phép cả hai luân phiên làm việc theo ca. Trong khi một bản sao đảm nhiệm các nghĩa vụ công cộng và lao dịch hành chính, bản sao còn lại sẽ bí mật nghỉ ngơi và hồi phục sức lực.\n\nTiết lộ này đã gây chấn động bối cảnh chính trị, làm dấy lên những câu hỏi về bản chất thực sự của sự lãnh đạo và các giới hạn đạo đức của công nghệ nhân bản."
 bio.70.a: "Một sự vận dụng công nghệ nhân bản đầy hiệu quả."
 bio.70.b: "Cách chức cả hai vì hành vi lừa dối."

 bio.75.name: "Bản Sao Nổi Loạn"
 bio.75.desc: "Việc tạo ra các bản sao nhân bản để thu hoạch nội tạng đang dẫn đến những biến chứng phức tạp. Một số bản sao, rõ ràng sở hữu tri giác đầy đủ, đang nổi dậy bằng hình thức tuyệt thực kéo dài.\n\nTrong khi nhiều người lập luận rằng sức khỏe và tuổi thọ của bản gốc phải được ưu tiên hàng đầu, những người khác lại cho rằng mọi thực thể có tư duy đều có quyền tự chủ cá nhân. Vấn đề gây tranh cãi này hiện là chủ đề tranh luận nảy lửa."
 bio.75.a: "Chấm dứt các ca cấy ghép."
 bio.75.b: "Quyền của bản gốc là tối thượng."

 bio.80.name: "Gánh Nặng Chứng Cứ"
 bio.80.desc: "Cơ quan thực thi pháp luật đang rơi vào thế tiến thoái lưỡng nan. Tội phạm tại thủ đô của chúng ta đang gia tăng, nhưng số người bị đưa ra công lý lại ít hơn bao giờ hết. Các nghi phạm ngày càng có xu hướng tuyên bố vô tội, khẳng định rằng các bản sao nhân bản của họ mới là kẻ thực hiện hành vi vi phạm.\n\nTrong những trường hợp nghi phạm không bị bắt quả tang tại trận, việc chứng minh tội lỗi gần như là bất khả thi. Một số cơ quan tư pháp hiện đang kêu gọi phi hình sự hóa trên thực tế hầu hết các hoạt động bất hợp pháp."
 bio.80.a: "Củng cố hệ thống giám sát của chúng ta."
 bio.80.b: "Càng ít luật lệ thì càng ít tội phạm."

 bio.85.name: "Bản Sao Y Đúc"
 bio.85.desc: "Một cơ sở nhân bản khổng lồ trái phép đã được phát hiện trong biên giới của chúng ta, chứa hàng ngàn bản sao, mỗi bản sao đều là bản sao chép y đúc của [Owner.Leader.GetTitle] của chúng ta, [Owner.Leader.GetName]. Các nhà khoa học dân sự được tìm thấy tại hiện trường đã bị bắt giữ, nhưng không ai hợp tác, đều khẳng định không biết ai đã ra lệnh tạo ra các bản sao này.\n\nMột vài bằng chứng rời rạc cho thấy chính [Owner.Leader.GetName] [Owner.Leader.GetHerselfHimself] có thể đứng sau chiến dịch này. Thật không may, [Owner.Leader.GetSheHe] đã biến mất không để lại dấu vết."
 bio.85.a: "Thực hiện cái chết êm ái cho các bản sao."
 bio.85.b: "Chúng ta đã thừa hưởng một đội quân nhân bản."
 bio.85.b.tt: "([owner.capital_scope.GetName]):\nMột §Y$clone_army$§! được tạo ra."
 bio.85.c: "Trả tự do cho các bản sao."
 bio.85.c.tt: "Chúng ta sẽ nhận được một nhóm §YPops§!."

 bio.86.name: "Phản Ứng Dữ Dội Bất Ngờ"
 bio.86.desc: "Việc bức tử êm ái quá nhiều bản sao đã làm dấy lên làn sóng phẫn nộ và châm ngòi cho các cuộc tranh luận nghiêm trọng. Các nhà hoạt động vì quyền của [Owner.GetSpeciesAdj] bất mãn và các nhóm tôn giáo đang tổ chức các cuộc biểu tình quy mô lớn.\n\nTrong khi đó, có những tin đồn rằng một số bản sao đã trốn thoát và đang ẩn nấp trong cộng đồng dân chúng."
 bio.86.a: "Có lẽ chúng ta có thể rút ra bài học từ chuyện này..."
 bio.86.b: "Triển khai lực lượng an ninh để dập tắt đám đông hỗn loạn."
 bio.86.b.tt: "([owner.capital_scope.GetName]):\nBa §Y$assault_army_plural$§! được tạo ra."

 bio.90.name: "Cộng Đồng Đột Biến"
 bio.90.desc: "Nhiều cá nhân có các đột biến di truyền nổi bật hoặc khác thường đã bị xã hội tẩy chay. Bị đẩy vào thế giới ngầm, những kẻ đột biến này đã thành lập các vùng đất tách biệt của riêng mình.\n\nNhững ai mạo hiểm tiến vào các khu vực này hiếm khi trở về."
 bio.90.a: "Dẹp bỏ các vùng đất tách biệt."
 bio.90.b: "Theo dõi sự phát triển của họ. Từ một khoảng cách an toàn."

 bio.95.name: "Cuộc Nổi Loạn Chuyển Gen"
 bio.95.desc: "Những thanh thiếu niên bất mãn đã bắt đầu biến đổi ngoại hình của mình một cách quyết liệt như một hình thức tiêu khiển cực đoan.\n\nCác xu hướng mới nhất bao gồm cơn sốt mắt kép, và các cuộc thi xem một cơ thể có thể gắn thêm bao nhiêu chi phụ, với kỷ lục hiện tại là 156 chi.\n\nNhững kẻ tin tặc sinh học này đã thu hút sự chú ý của công chúng, dấy lên những lo ngại về an toàn. Khi những lời kêu gọi hạn chế nghiêm ngặt các đột biến di truyền ngày càng lớn, chúng ta phải quyết định lập trường chính thức của mình."
 bio.95.a: "Tất cả chỉ là trò vui vô hại."
 bio.95.b: "156 chi là quá nhiều chi rồi."

 bio.100.name: "Hậu Quả Ngoài Ý Muốn"
 bio.100.desc: "Việc áp dụng rộng rãi biện pháp thao túng di truyền trên khắp nền văn minh của chúng ta đã sinh ra vô số biến thể thể chất kỳ lạ.\n\nCác quá trình sinh học từng có thể dự đoán được nay lại bộc lộ những sai lệch không ngờ, khiến việc tiêu chuẩn hóa gần như bất khả thi.\n\nCảm giác chung về tính đồng nhất thể chất từng gắn kết giống loài chúng ta đang tan rã, thay vào đó là một kính vạn hoa gồm muôn vàn hình thái và chức năng làm căng thẳng sự gắn kết xã hội."
 bio.100.a: "Khuyến khích sự đa dạng."
 bio.100.a.tt: "§Y400§! £pop£ §HPops§! ngẫu nhiên sẽ nhận được Đặc tính ['trait:trait_bioadaptability'], ['trait:trait_social_pheromones'], hoặc ['trait:trait_limited_regeneration']."
 bio.100.b: "Chuẩn hóa bộ gen của chúng ta."

 bio.105.name: "Khối Sinh Chất"
 bio.105.desc: "Một thử nghiệm chuyển gen đã thất bại thảm hại. Các nhà khoa học đã cố gắng ghép DNA của đối tượng thử nghiệm với DNA của các sinh vật đa bào khác nhằm kích hoạt phản ứng siêu miễn dịch, giúp đối tượng miễn nhiễm với mọi loại virus.\n\nTuy nhiên, thay vào đó, họ đã tạo ra một sinh vật có khả năng hòa tan màng tế bào của bất kỳ sinh vật nào nó chạm vào, hợp nhất với sinh vật đó để trở thành một khối vật liệu sinh học khổng lồ vô định hình.\n\nKhối sinh chất này đã lăn qua cơ sở thử nghiệm, hấp thụ mọi thứ trên đường đi của nó. Hiện tại nó đã được kiềm chế, nhưng sẽ gây ra mối nguy hại sức khỏe đáng kể nếu trốn thoát. Thật may mắn, nó cũng có vẻ ăn được..."
 bio.105.a: "Vô hiệu hóa khối sinh chất!"
 bio.105.b: "Nghiên cứu khối sinh chất rất đáng để mạo hiểm."

## HIVE EMPIRE SITUATION
 # SET-UP / PREAMBLE
 genetic_ascension_situation_hive: "$genetic_ascension_situation$"
 genetic_ascension_situation_hive_type: "$genetic_ascension_situation$"
 genetic_ascension_situation_hive_desc: "$genetic_ascension_situation_desc$"
 genetic_ascension_situation_hive_monthly_change_tooltip: "Các cá thể công nhân di truyền học đang từng bước thúc đẩy nghiên cứu của chúng ta."
 genetic_ascension_situation_hive_outcome: "$genetic_ascension_situation_outcome$"

 # STAGE EVENTS

 bio.25.name: "Phát Triển Tập Thể" # STAGE ONE
 bio.25.desc.no_options: "[owner.GetGovernmentName] đang biến đổi. Chúng ta sắp sửa nhận ra toàn bộ tiềm năng của mình, ý thức rằng nỗ lực này có thể thay đổi tận gốc bản chất cốt lõi của chúng ta. Thiết kế sự tiến hóa của chính mình là một nhiệm vụ mang ý nghĩa sâu xa. Những thay đổi chúng ta thực hiện lúc này sẽ lan tỏa sâu rộng vào tương lai."
 bio.25.desc.has_options: "$bio.25.desc.no_options$\n\nGiờ đây chúng ta phải chọn một trọng tâm cho giai đoạn phát triển đầu tiên của mình."
 bio.25.a: "$bio.5.a$"
 bio.25.b: "$bio.5.b$"
 bio.25.c: "$bio.5.c$"

 bio.30.name: "Bầy Đàn Hội Tụ" # STAGE TWO
 bio.30.desc.no_options: "Thiết kế sự tiến hóa của chính mình đã dẫn đến những thay đổi đáng kể. Giờ đây chúng ta sở hữu sự hiểu biết sâu sắc hơn về các đặc tính di truyền, sinh sản và giải trình tự DNA.\n\nĐỉnh cao công việc của chúng ta đã nằm trong tầm tay.\n\nChẳng bao lâu nữa, chúng ta sẽ trở thành những gì chúng ta luôn được định sẵn để trở thành."
 bio.30.desc.has_options: "$bio.30.desc.no_options$ Chúng ta có cơ hội tiếp tục con đường hiện tại, hoặc chọn một trọng tâm mới."
 bio.30.a: "$bio.10.a$"
 bio.30.b: "$bio.10.b$"
 bio.30.c: "$bio.10.c$"

 bio.35.name: "Hợp Nhất Tiến Hóa" # STAGE THREE
 bio.35.desc.no_options: "Chúng ta đang đứng trước bờ vực của một bước đột phá tiến hóa quan trọng. Chẳng bao lâu nữa, chúng ta phải đưa ra quyết định hệ trọng liên quan đến con đường sẽ đi để phát huy trọn vẹn tiềm năng tiến hóa."
 bio.35.desc.has_options: "$bio.35.desc.no_options$\n\nMột lần nữa, chúng ta phải lựa chọn nơi đặt các ưu tiên của mình."
 bio.35.a: "$bio.15.a$"
 bio.35.b: "$bio.15.b$"
 bio.35.c: "$bio.15.c$"

 genetic_ascension_hive_approach_one: "$genetic_ascension_approach_purity$"
 genetic_ascension_hive_approach_two: "$genetic_ascension_approach_cloning$"
 genetic_ascension_hive_approach_three: "$genetic_ascension_approach_mutation$"
 genetic_ascension_hive_approach_one_desc: "$genetic_ascension_approach_purity_desc$"
 genetic_ascension_hive_approach_two_desc: "$genetic_ascension_approach_cloning_desc$"
 genetic_ascension_hive_approach_three_desc: "$genetic_ascension_approach_mutation_desc$"

 bio.40.name: "Đặc Trưng Sinh Học Riêng Biệt" # FINAL STAGE - TRADITION TREE CHOICE
 bio.40.desc: "Dù chúng ta nỗ lực vươn tới hình thái thuần khiết nhất của chính mình, nhân bản để mở lối thành công, hay tăng cường gen thông qua đột biến có chủ đích, thời khắc này đánh dấu một điểm không thể quay đầu."
 bio.40.desc.evopred: "$bio.20.desc.evopred$"
 bio.40.a: "$bio.20.a$"
 bio.40.b: "$bio.20.b$"
 bio.40.c: "$bio.20.c$"

 # Random Events (Hives)

 bio.110.name: "Phân Công Lao Động"
 bio.110.desc: "Khi chúng ta bắt đầu nâng tầm sinh học cho [target.GetGestaltEntityName], chúng ta phải ưu tiên những cải tiến mang lại lợi ích lớn nhất cho nền văn minh của mình.\n\nThao túng gen có chọn lọc cho phép chúng ta lai tạo ra các chuyên gia với những đặc điểm thể chất mong muốn, phù hợp nhất với các ngành công nghiệp cụ thể.\n\nVới những năng lực mới phát hiện này, chúng ta có cơ hội tăng cường các [target.GetIndividualNamePlural] làm việc trong lĩnh vực sản xuất năng lượng, hoặc phòng thủ."
 bio.110.a: "Năng lượng luôn luôn hữu ích."
 bio.110.b: "Chúng ta nên ưu tiên phòng thủ."

 bio.115.name: "Dư Thừa Thế Hệ"
 bio.115.desc: "Khi chúng ta đưa vào một khuôn mẫu sinh học mới cho các cá thể công nhân của mình, chúng ta phải quyết định cách xử lý những cá thể không tương thích với bản nâng cấp di truyền.\n\nMột số công nhân già cỗi thiếu sức chịu đựng trước các biến đổi. Chúng ta có thể giữ lại họ làm nhân lực lao động cho phần đời còn lại, hoặc tái chế vật chất sinh học của họ để bồi bổ cho bầy đàn."
 bio.115.a: "Tái chế các công nhân già cỗi."
 bio.115.b: "Họ vẫn còn hữu dụng."

 bio.120.name: "Tốc Độ Hay Sức Bền"
 bio.120.desc: "Một bước đột phá trong nghiên cứu di truyền đã hé lộ cách thức nâng cao hiệu suất truyền tiếp thần kinh, gia tăng đáng kể năng suất của [target.GetIndividualName].\n\nTuy nhiên, sự gia tăng công suất não bộ này không thể duy trì bền vững trong thời gian dài, dẫn đến tuổi thọ ngắn hơn.\n\nChúng ta phải quyết định nên giữ lại tuổi thọ thông thường của mình hay phát triển chức năng nâng cao với cái giá phải trả là tuổi thọ."
 bio.120.a: "Ưu tiên tuổi thọ hiện tại của chúng ta."
 bio.120.b: "Thúc đẩy các [target.GetIndividualNamePlural]. Nâng cao năng suất."

 bio.125.name: "Quá Tải Khớp Thần Kinh"
 bio.125.desc: "Một đợt [target.GetIndividualNamePlural] mới được cường hóa đã được tích hợp vào [target.GetGestaltEntityName], kỹ thuật sinh học của họ được tinh chỉnh để tăng tốc độ phát triển thần kinh và các quá trình nhận thức. Các nút khớp thần kinh then chốt của [target.GetGestaltEntityName] hiện đang vận hành ở tốc độ chưa từng thấy.\n\nTuy nhiên, sự tăng tốc này đã làm căng thẳng tính ổn định của [target.GetIndividualName], có nguy cơ dẫn đến tình trạng quá tải khớp thần kinh thảm khốc. Ngoài ra, chúng ta có thể phân bổ lại thêm [target.GetIndividualNamePlural] cho các nhiệm vụ điều phối."
 bio.125.a: "Chậm lại và duy trì sự ổn định."
 bio.125.b: "Sống hết mình và bùng cháy rực rỡ."

 bio.130.name: "Hiện Tượng Tần Số"
 bio.130.desc: "Kể từ khi tích hợp một đợt bản sao nhân bản mới vào bầy đàn của chúng ta, chúng ta đã quan sát thấy các vấn đề rung động âm thanh khó chịu. Một bước sai lầm trong quá trình nhân bản có thể đã kìm hãm sự phát triển của các chất dẫn truyền sinh học của họ, gây nhiễu tần số.\n\nKhi các bản sao này giao tiếp với bầy đàn rộng lớn, tất cả các công nhân ở gần đều phải chịu đựng những đợt ù tai tâm trí lớn và đáng lo ngại. Sự phân tâm tăng cao, và năng suất đang gặp rủi ro."
 bio.130.a: "Khó chịu, nhưng không phải không thể dung thứ."
 bio.130.b: "Loại bỏ những bản sao gây rối."

 bio.135.name: "Bài Toán Đồng Bộ"
 bio.135.desc: "Các thử nghiệm nhân bản gần đây đã mang lại những kết quả bất thường. Một số bản sao dường như có liên kết thần kinh với người hiến tặng di truyền của họ, khiến họ vô tình di chuyển đồng bộ với nhau.\n\nHiện tượng này vẫn tiếp diễn bất kể khoảng cách, với các cá thể công nhân riêng lẻ phản chiếu hành động của các đối tác của họ ở những nơi khác trong thiên hà. Điều này mở ra một số khả năng hấp dẫn.\n\nChúng ta có thể thực hiện một sáng kiến đưa các bản sao và người hiến tặng lại gần nhau để làm việc đồng bộ trong các môi trường giống hệt nhau. Hoặc chúng ta có thể chiết xuất các chất dẫn truyền thần kinh chịu trách nhiệm để nghiên cứu hiện tượng này tốt hơn."
 bio.135.a: "Thiết lập các trạm làm việc giống hệt nhau cho người hiến tặng và bản sao."
 bio.135.b: "Phẫu thuật cắt đứt các liên kết đồng bộ."

 bio.140.name: "Bản Sao Không Tương Thích"
 bio.140.desc: "Trong nỗ lực củng cố bầy đàn, chúng ta đã nuôi cấy một đợt bản sao từ vật liệu hiến tặng và thúc đẩy nhân tạo sự trưởng thành của họ. Dù là những mẫu vật sinh học tuyệt hảo, những bản sao này lại không tương thích.\n\nSự sai lệch này, dù đáng lo ngại, lại mang đến một cơ hội độc nhất vô nhị. Những công nhân cá thể hóa này, giờ đây sở hữu danh tính riêng biệt và tư duy độc lập, có thể chứng tỏ ưu thế trong việc tương tác với các thực thể bên ngoài tập thể. Khả năng tư duy tự chủ của họ có thể thu hẹp những khoảng cách mà tiếng nói thống nhất của bầy đàn khó lòng thích nghi. Tuy nhiên, những lợi ích này đi kèm một cái giá: nhận thức ngày càng tăng về tính cá nhân của họ đã dẫn đến bất ổn, ảnh hưởng đến một số chức năng nhận thức cấp cao hơn của chúng ta."
 bio.140.a: "Ép buộc tích hợp."
 bio.140.b: "Khai thác tiềm năng của họ."

 bio.145.name: "Mối Lo Ngại Tạo Vật"
 bio.145.desc: "Ý thức tập thể của chúng ta đang rơi vào hỗn loạn. Chúng ta hiện sở hữu khả năng tạo ra các bản sao chép của chính mình, nhưng chúng ta lại do dự, đặt câu hỏi về hiệu quả (và thậm chí cả đạo đức) của những hành động như vậy.\n\nCác quy trình nhân bản đòi hỏi nguồn tài nguyên đáng kể. Liệu những tài nguyên này có thể được sử dụng tốt hơn ở nơi khác, đặc biệt là khi sinh sản tự nhiên có nhiều khả năng tạo ra sự đa dạng di truyền hơn?\n\nTrong lịch sử, đây không phải là phương thức sinh sôi của chúng ta, và chúng ta không chắc liệu mình đã sẵn sàng đón nhận một sự thay đổi căn bản như vậy đối với giống loài hay chưa."
 bio.145.a: "Không thể phớt lờ hiệu quả của công nghệ nhân bản."
 bio.145.b: "Đa dạng di truyền là tối quan trọng."

 bio.150.name: "Kiệt Quệ Bầy Đàn"
 bio.150.desc: "Các thí nghiệm đột biến của chúng ta đã gây ra những điều bất thường bên trong bầy đàn. Những nhiệm vụ từng được triển khai dễ dàng nay đòi hỏi nỗ lực có chủ đích, khi các chỉ thị xung đột làm căng thẳng tâm trí tập thể.\n\nTrong khi sự mệt mỏi phát sinh đe dọa làm kiệt quệ một số công nhân hiệu quả nhất của chúng ta, nó cũng mang lại một cơ hội.\n\nChúng ta phải quyết định: chúng ta sẽ tạm dừng để hồi phục hay thúc đẩy bản thân vượt qua các giới hạn?"
 bio.150.a: "Chúng ta xứng đáng được nghỉ ngơi."
 bio.150.b: "Chúng ta có thể ngủ khi đã chết."

 bio.151.name: "Tươi Mới và Hồi Sinh"
 bio.151.desc: "Quyết định nghỉ ngơi và hồi phục của chúng ta đã đơm hoa kết trái. Những thôi thúc từng bất hòa nay đã lắng dịu, hòa quyện thành một dòng chảy tư tưởng hài hòa thúc đẩy tập thể với sự sáng suốt mới mẻ.\n\nNhững công nhân từng chao đảo bên bờ vực kiệt sức nay làm việc với độ chính xác không biết mệt mỏi. Giai đoạn nhìn nhận lại này không chỉ làm giảm sự mệt mỏi tập thể, mà còn củng cố quyết tâm của chúng ta trước những thử thách phía trước."
 bio.151.a: "Chúng ta đang thực sự tỏa sáng rực rỡ!"

 bio.155.name: "Chuyên Môn Hóa Hay Đa Năng Hóa"
 bio.155.desc: "Đột biến mang lại nhiều lợi ích, và thông qua các nâng cấp có chọn lọc, chúng ta có thể thích ứng bầy đàn để phục vụ mục đích của mình tốt hơn. Giờ đây việc chuyên môn hóa trong sản xuất khoáng sản có thể đạt được nhờ các phần phụ kitin cứng cáp.\n\nNgoài ra, chúng ta có thể tăng cường cho tất cả công nhân những biến đổi tổng quát hơn, cho phép họ thực hiện vô số chức năng."
 bio.155.a: "Công nhân đa năng sẽ hữu ích hơn."
 bio.155.b: "Hãy bắt tay vào đào bới nào."

 bio.160.name: "Trôi Dạt Kiểu Hình"
 bio.160.desc: "Các cuộc thử nghiệm liên tục đã mang lại những sự phức tạp không ngờ cho bầy đàn. Các công nhân đang xuất hiện với những đặc điểm thể chất độc đáo: bộ xương ngoài có gai, các phần phụ quá khổ, hoặc các cơ quan cảm giác nhạy cảm một cách kỳ lạ.\n\nTrong khi những sự sai lệch này mang lại lợi ích rõ rệt, chúng cũng gây ra gánh nặng trao đổi chất. Bầy đàn đang chật vật cân bằng áp lực ngày càng leo thang này. Câu hỏi đặt ra là: bao nhiêu đột biến là đủ?"
 bio.160.a: "Đón nhận sự năng động."
 bio.160.b: "Phải duy trì sự gắn kết."

 bio.165.name: "Hoài Niệm Thuở Xưa"
 bio.165.desc: "Bầy đàn đang thay đổi. Bằng cách thay đổi bộ gen của mình, chúng ta đã quan sát thấy những cải thiện sức khỏe có thể đo lường được. Tuy nhiên, điều này đã khiến chúng ta kém kiên cường hơn trước những khủng hoảng tâm lý.\n\nChúng ta không hề ghét bỏ con người trước đây của mình, và dù chúng ta đang trở nên mạnh mẽ hơn và tiến bộ hơn về nhận thức, chúng ta vẫn nhớ sự thân thuộc của những mô thức tư duy trước đây.\n\nTrên toàn bầy đàn có một cảm giác vô cùng khó chịu rằng cơ thể chúng ta không khớp với tâm lý nội tại của chính mình. Phải chăng chúng ta đã phát triển vượt quá giới hạn của bản thân?"
 bio.165.a: "Cuộc sống là sự đổi thay."
 bio.165.b: "Chúng ta không được đánh mất bản chất cốt lõi của mình."

 # Modifiers
 supremacy_denied: "Bác Bỏ Vị Thế Tối Cao"
 supremacy_denied_desc: "Chính phủ đang có lập trường kiên quyết nhằm kiềm chế sự chênh lệch di truyền."

 augment_appreciation: "Đề Cao Tăng Cường Thể Chất"
 augment_appreciation_desc: "Các nhà di truyền học và những cá nhân được tăng cường di truyền là những thành viên có giá trị trong xã hội chúng ta."

 conscious_evolution: "Tiến Hóa Có Ý Thức"
 conscious_evolution_desc: "Chúng ta cùng nhau tiến bước."

 superior_individuals: "Cá Nhân Vượt Trội"
 superior_individuals_desc: "Tài năng ưu tú mang lại kết quả ưu tú."

 welfare_state: "Nhà Nước Phúc Lợi"
 welfare_state_desc: "Các sáng kiến phúc lợi xã hội do chính phủ tài trợ đang được triển khai."

 selective_survival: "Sinh Tồn Chọn Lọc"
 selective_survival_desc: "Những người lao động được tăng cường thể chất đóng góp vào hiệu quả của các ngành công nghiệp của chúng ta."

 super_powered: "Siêu Năng Lực"
 super_powered_desc: "Những cá nhân có siêu năng lực củng cố hệ thống phòng thủ của chúng ta."

 deceitful_dismissal: "Cách Chức Kẻ Lừa Dối"
 deceitful_dismissal_desc: "Chúng ta đang tìm kiếm những thủ lĩnh mới, trung thực hơn."

 harvesting_halt: "Đình Chỉ Thu Hoạch"
 harvesting_halt_desc: "Hành vi thu hoạch nội tạng của các bản sao nhân bản đã bị đặt ra ngoài vòng pháp luật."

 clone_drivers: "Động Lực Nhân Bản"
 clone_drivers_desc: "Việc tiếp tục khai thác các bản sao nhân bản cho phép chúng ta tập trung vào hiệu quả công nghiệp."

 effective_surveillance: "Hệ Thống Hiệu Quả"
 effective_surveillance_desc: "Xã hội chúng ta coi trọng các quyền công dân. Ít nhất là trên lý thuyết."

 decriminalized_society: "Tái Lập Quyền Uy"
 decriminalized_society_desc: "Với lực lượng cảnh sát chủ động, chúng ta đang áp dụng lập trường cứng rắn hơn đối với tội phạm."

 mass_euthanasia: "Bức Tử Hàng Loạt"
 mass_euthanasia_desc: "Hành động quyết liệt sẽ được thực hiện đối với hoạt động nhân bản trái phép."

 duplicated_inheritance: "Thừa Hưởng Bản Sao"
 duplicated_inheritance_desc: "Hoạt động quân sự của chúng ta gia tăng nhờ lượng tân binh đổ về."
 duplicated_inheritance_armies: "Kế Thừa Đội Quân Nhân Bản"

 mutant_crackdown: "Trấn Áp Đột Biến"
 mutant_crackdown_desc: "Chính phủ hành động quyết liệt để chống lại sự bài xích."

 mutant_enclaves: "Vùng Tách Biệt Đột Biến"
 mutant_enclaves_desc: "Các vùng đất tách biệt của người đột biến cung cấp nghiên cứu xã hội có giá trị."

 embracing_change: "Đón Nhận Thay Đổi"
 embracing_change_desc: "Những cơ hội mới cho sự biểu đạt sáng tạo và cái mới mẻ khuyến khích sự đa dạng."

 biological_limitations: "Giới Hạn Sinh Học"
 biological_limitations_desc: "Các công nghệ an toàn sinh học và thực thi sẽ duy trì tính hữu dụng của các quy định hiện hành."

 societal_diversification: "Đa Dạng Hóa Xã Hội"
 societal_diversification_desc: "Các mối lo ngại về trách nhiệm pháp lý được giải quyết khi dân số thử nghiệm các biến đổi sinh học độc đáo."

 standardized_biology: "Sinh Học Chuẩn Hóa"
 standardized_biology_desc: "Với các khuôn mẫu di truyền chuẩn hóa, sự gắn kết xã hội được cải thiện."

 blob_neutralized: "Khối Sinh Chất Đã Bị Vô Hiệu Hóa"
 blob_neutralized_desc: "Hành động quyết đoán đối với khối sinh chất khiến mọi người cảm thấy an toàn hơn."

 globule_research: "Nghiên Cứu Thể Khối"
 globule_research_desc: "Các nhà khoa học thực hiện các thí nghiệm sinh học có kiểm soát trên khối sinh chất."

 super_troopers: "Binh Lính Siêu Cấp"
 super_troopers_desc: "Các trung đoàn siêu anh hùng giúp chúng ta duy trì trật tự xã hội."

 watch_the_watchers: "Giám Sát Kẻ Canh Gác"
 watch_the_watchers_desc: "Ai sẽ canh gác những kẻ canh gác? Chúng ta."

 hero_council: "Hội Đồng Anh Hùng"
 hero_council_desc: "Các cố vấn siêu anh hùng hỗ trợ quá trình ra quyết định của chính phủ."

 hero_restrictions: "Hạn Chế Anh Hùng"
 hero_restrictions_desc: "Chính phủ của chúng ta sẽ không còn dựa vào sự hỗ trợ từ các thực thể có siêu năng lực."

 ethical_cloning: "Nhân Bản Có Đạo Đức"
 ethical_cloning_desc: "Các hướng dẫn nghiêm ngặt giới hạn việc sử dụng công nghệ nhân bản hàng loạt."

 nuisance_crackdown: "Dẹp Bỏ Phiền Toái"
 nuisance_crackdown_desc: "Các bản sao nhân bản có quyền bình đẳng. Nhưng các bản gốc có quyền bình đẳng hơn."

 artistic_integrity: "Tính Toàn Vẹn Nghệ Thuật"
 artistic_integrity_desc: "Những nỗ lực nghệ thuật sẽ dẫn dắt chúng ta đến sự vĩ đại."

 logic_first: "Logic Là Trên Hết"
 logic_first_desc: "Chúng ta sẽ trở thành những người dẫn đầu thiên hà trong các ngành khoa học."

 practical_application: "Ứng Dụng Thực Tiễn"
 practical_application_desc: "Chúng ta sẽ ưu tiên sản xuất hàng hóa và dịch vụ."

 crack_downs: "Chiến Dịch Trấn Áp"
 crack_downs_desc: "Sự ổn định sẽ gia tăng dưới bàn tay sắt của pháp luật."

 performative_reformation: "Cải Cách Hình Thức"
 performative_reformation_desc: "Hãy để họ diễn xuất những ảo tưởng cách mạng của mình nếu điều đó khiến họ vui vẻ."

 ancestral_inheritance: "Di Sản Tổ Tiên"
 ancestral_inheritance_desc: "Tri thức của tổ tiên sẽ dẫn dắt chúng ta bước tới tương lai."

 buried_secrets: "Bí Mật Chôn Giấu"
 buried_secrets_desc: "Những chiến tích xa xưa của tổ tiên không được phép lộ ra trong thời đại ngày nay."

 specimen_study: "Nghiên Cứu Mẫu Vật"
 specimen_study_desc: "Các tài liệu nghiên cứu thu giữ được sẽ bổ trợ cho sự phát triển chính thức."

 purity_tests: "Kiểm Tra Độ Thuần Khiết"
 purity_tests_desc: "Những tuyên bố về độ thuần khiết di truyền phải được xác minh bằng các cuộc kiểm tra bộ gen nghiêm ngặt."

 clone_rights: "Quyền Bản Sao Nhân Bản"
 clone_rights_desc: "Chúng ta sẽ tôn trọng quyền tự chủ của các cá nhân nhân bản."

 class_system: "Hệ Thống Giai Cấp"
 class_system_desc: "Phải có sự phân biệt thứ bậc rõ ràng giữa công dân và các bản sao của họ."

 thorough_inspections: "Thanh Tra Toàn Diện"
 thorough_inspections_desc: "Chúng ta phải đảm bảo không xảy ra thêm sự cố nào trong quy trình sản xuất bản sao."

 swift_recovery: "Hồi Phục Nhanh Chóng"
 swift_recovery_desc: "Năng suất là ưu tiên hàng đầu của chúng ta."

 well_adjusted: "Điều Chỉnh Thích Ứng"
 well_adjusted_desc: "Những rắc rối về cảm xúc nên là mối bận tâm ít nhất của chúng ta."

 strict_discipline: "Kỷ Luật Nghiêm Khắc"
 strict_discipline_desc: "Lao động chăm chỉ và kỷ luật sẽ biến tất cả thành những công dân kiểu mẫu."

 infinite_growth: "Tăng Trưởng Vô Tận"
 infinite_growth_desc: "Chúng ta sẽ gia tăng sản lượng công nghiệp, bất chấp các chi phí phát sinh."

 clone_colonies: "Thuộc Địa Nhân Bản"
 clone_colonies_desc: "Các công dân nhân bản có thể đẩy nhanh quá trình phát triển thuộc địa của chúng ta."

 mutant_studies: "Nghiên Cứu Đột Biến"
 mutant_studies_desc: "Chúng ta sẽ giữ những cá thể đột biến này làm đối tượng thử nghiệm để nâng cao hiểu biết về đột biến."

 aspirational_striving: "Phấn Đấu Noi Theo"
 aspirational_striving_desc: "Những cá nhân phi thường nên được nêu gương; một hình mẫu lý tưởng để noi theo!"

 militaristic_fortitude: "Nghị Lực Quân Phiệt"
 militaristic_fortitude_desc: "Sự vượt trội về mặt di truyền sẽ dẫn dắt chúng ta đến vinh quang."

 replicated_success: "Thành Công Nhân Bản"
 replicated_success_desc: "Những khả năng phi thường này không thể chỉ giới hạn ở một thiểu số. Chúng phải được chia sẻ cho toàn thể công dân."

 sewer_sweep: "Quét Sạch Cống Ngầm"
 sewer_sweep_desc: "Bất cứ thứ gì đang bò dưới đó... Chúng ta không hề thích nó."

 weaponized_plague: "Dịch Bệnh Vũ Khí Hóa"
 weaponized_plague_desc: "Dịch bệnh là một công cụ hiệu quả mà chúng ta có thể sử dụng để thanh lọc bầy đàn."

 biohacker_haven: "Thiên Đường Tin Tặc Sinh Học"
 biohacker_haven_desc: "Chính phủ của chúng ta sẽ dỡ bỏ các hạn chế đối với việc chỉnh sửa bộ gen."

 limited_autonomy: "Quyền Tự Chủ Có Giới Hạn"
 limited_autonomy_desc: "Chúng ta sẽ duy trì trật tự và hạn chế quyền truy cập vào công nghệ sinh học được chính phủ phê chuẩn."

 proactive_management: "Quản Lý Chủ Động"
 proactive_management_desc: "Khoa học lý thuyết chỉ là suy đoán. Các thủ lĩnh của chúng ta nên tập trung vào các nhiệm vụ được giao."

 really_proactive_management: "$proactive_management$"
 really_proactive_management_desc: "Không có chỗ trong đế chế của chúng ta cho những công nhân làm việc vô bổ."

 # Hive Modifiers

 energetic_manipulation: "Thao Túng Năng Lượng"
 energetic_manipulation_desc: "Các nâng cấp sinh học gia tăng hiệu suất."

 defensive_focus: "Trọng Tâm Phòng Thủ"
 defensive_focus_desc: "Phòng thủ là ưu tiên hàng đầu của chúng ta. Sức mạnh và sự kiên cường là nền tảng của quân đội."

 grunt_retention: "Giữ Lại Công Nhân"
 grunt_retention_desc: "Các cá thể công nhân ở mọi lứa tuổi đều đóng góp vào nghiên cứu và phát triển công nghệ của chúng ta."

 assured_longevity: "Bảo Đảm Trường Thọ"
 assured_longevity_desc: "Với sự gắn kết ngày càng tăng và tinh thần tập thể cao, chúng ta chủ động ưu tiên hạnh phúc của mình."

 hyper_charged: "Vận Hành Siêu Tốc"
 hyper_charged_desc: "Hiệu suất truyền tiếp thần kinh nâng cao mang lại cho chúng ta những giai đoạn làm việc ngắn hơn nhưng năng suất mãnh liệt hơn."
 hyper_charged_wilderness: "$hyper_charged$"
 hyper_charged_wilderness_desc: "$hyper_charged_desc$"

 vitality_conservation: "Bảo Toàn Sinh Lực"
 vitality_conservation_desc: "Khi các quy trình tăng cường được tinh chỉnh, chúng ta phải dành thời gian để chăm sóc cho sức khỏe của mình."

 accelerated_growth: "Sinh Trưởng Cấp Tốc"
 accelerated_growth_desc: "Năng suất tăng vọt khi chúng ta gia tăng hiệu quả của mình."

 interference_perseverance: "Kiên Trì Trước Nhiễu Loạn"
 interference_perseverance_desc: "Bầy đàn chịu đựng và thích nghi với sự nhiễu loạn thần kinh. Chúng ta duy trì hiệu quả vận hành bất chấp phiền toái."

 tandem_workers: "Lao Động Phối Hợp"
 tandem_workers_desc: "Chúng ta đang tận dụng tối đa các vấn đề điều phối hiện tại."

 mandated_integration: "Tích Hợp Bắt Buộc"
 mandated_integration_desc: "Cưỡng chế tích hợp các cá thể công nhân đào tẩu sẽ dập tắt mọi sự nổi loạn."

 methodic_procreation: "Sinh Sản Có Phương Pháp"
 methodic_procreation_desc: "Chúng ta tập trung vào việc tối ưu hóa công nghệ nhân bản và giải quyết các tác động đạo đức cũng như xã hội."

 genetic_diversification: "Đa Dạng Hóa Di Truyền"
 genetic_diversification_desc: "Chúng ta cùng nhau cân nhắc về tương lai của giống loài mình, áp dụng một phương pháp cẩn trọng và tính toán kỹ lưỡng."

 hive_spa_day: "Nghỉ Ngơi Để Hồi Phục"
 hive_spa_day_desc: "Chúng ta sẽ ưu tiên sức khỏe tập thể với một năm nghỉ ngơi."

 cousin_of_death: "Không Thể Dừng Lại"
 cousin_of_death_desc: "Không có thời gian để nghỉ ngơi. Chúng ta còn có việc phải làm."

 positively_glowing: "Tỏa Sáng Rực Rỡ"
 positively_glowing_desc: "Chúng ta đã nghỉ ngơi, và chúng ta đã hồi sinh."

 multi_functionality: "Đa Chức Năng"
 multi_functionality_desc: "Năng suất đang cải thiện và tính linh hoạt của các cá thể công nhân đang ở mức cao."

 optimized_workforce: "Lực Lượng Lao Động Tối Ưu Hóa"
 optimized_workforce_desc: "Bầy đàn cảm thấy hài lòng, và được chuyên môn hóa dựa trên năng lực."

 change_is_growth: "Thay Đổi Là Tăng Trưởng"
 change_is_growth_desc: "Phát triển là thay đổi, và thay đổi là phát triển. Chúng ta đang học hỏi với tốc độ phi thường."

 maintain_the_essence: "Duy Trì Bản Chất Cốt Lõi"
 maintain_the_essence_desc: "Khi tiếp tục tiến hóa, chúng ta không được đánh mất chính mình. Chúng ta kiên cường và tận tâm."

 strengthened_focus: "Tăng Cường Tập Trung"
 strengthened_focus_desc: "Các cá thể công nhân khỏe mạnh hơn, và bầy đàn hạnh phúc hơn."

 evolutionary_diversion: "Chệch Hướng Tiến Hóa"
 evolutionary_diversion_desc: "Những thay đổi đáng kể đã làm đảo lộn bầy đàn. Trọng tâm của chúng ta lúc này phải là biến đổi sinh học an toàn."

 biological_corrections: "Hiệu Chỉnh Sinh Học"
 biological_corrections_desc: "Chúng ta không thể để những dị thường di truyền độc hại làm tổn hại đến khát vọng đột biến của mình."

 cellular_degradation: "Thoái Hóa Tế Bào"
 cellular_degradation_desc: "Chúng ta phải cởi mở đón nhận các định hướng tiến hóa mới."
 cellular_degradation_wilderness: "$cellular_degradation$"
 cellular_degradation_wilderness_desc: "$cellular_degradation_desc$"

 resilient_hive: "Ý Thức Kiên Cường"
 resilient_hive_desc: "Chúng ta tập trung vào các đặc tính giúp nâng cao sức bền thể chất và khả năng thích nghi, đảm bảo sự sống còn của [GetGestaltEntityName] trong các môi trường khắc nghiệt."

 cognizant_hive: "Ý Thức Nhận Thức Sâu Sắc"
 cognizant_hive_desc: "Chúng ta ưu tiên năng lực trí tuệ và sự điều phối của [GetIndividualName], bồi đắp khả năng ra quyết định tốt hơn và hiệu quả vận hành cao hơn."

 pristine_lineage: "Dòng Dõi Nguyên Sơ"
 pristine_lineage_desc: "Các [GetIndividualNamePlural] xử lý và các nút lãnh đạo được ưu tiên."

 breed_for_growth: "Lai Tạo Để Tăng Trưởng"
 breed_for_growth_desc: "Chúng ta lựa chọn các đặc tính có lợi nhất cho khả năng sinh sản và sản sinh ra các [GetIndividualNamePlural] khỏe mạnh."
 breed_for_growth_wilderness: "$breed_for_growth$"
 breed_for_growth_wilderness_desc: "$breed_for_growth_desc$"

 relentless_focus: "Tập Trung Bền Bỉ"
 relentless_focus_desc: "Chúng ta không thể phân tán sự quan tâm của mình. Thuần khiết là mục tiêu của chúng ta, và chúng ta phải buông bỏ mọi thứ khác."

 infrastructural_bolstering: "Củng Cố Hạ Tầng"
 infrastructural_bolstering_desc: "Phương tiện sản xuất của [GetGestaltEntityName] không được phép bị tổn hại trong hành trình mưu cầu sự thuần khiết."

 anomaly_purging: "Thanh Trừng Dị Thường"
 anomaly_purging_desc: "Không thể xem nhẹ sự ngẫu nhiên. Bất cứ điều gì ngoài ý muốn đều phải lập tức bị loại bỏ."
 anomaly_purging_wilderness: "$anomaly_purging$"
 anomaly_purging_wilderness_desc: "$anomaly_purging_desc$"

 rigorous_examination: "Kiểm Tra Kỹ Lưỡng"
 rigorous_examination_desc: "Một số thứ được gọi là tạp chất có thể thực sự mang lại lợi ích cho [GetGestaltEntityName]. Chúng ta không nên quá vội vàng tiêu diệt chúng."
 rigorous_examination_wilderness: "$rigorous_examination$"
 rigorous_examination_wilderness_desc: "$rigorous_examination_desc$"

 population_relocation: "Tái Định Cư Dân Cư"
 population_relocation_desc: "Chúng ta có thể cân bằng áp lực tiềm tàng lên bầy đàn từ sự gia tăng dân số nhân bản bằng cách tái định cư các công dân dư thừa."

 factotum_reserves: "Lực Lượng Dự Bị Toàn Năng"
 factotum_reserves_desc: "Sản lượng năng lượng của bầy đàn sẽ được tăng cường nhờ các cá thể công nhân nhân bản đa năng."

 simple_minds: "Tâm Trí Giản Đơn"
 simple_minds_desc: "Bầy đàn đắm mình trong sự xoa dịu êm ái của một vài tâm trí giản đơn."

 the_new_batch: "Bản Sao: Lứa Mới"
 the_new_batch_desc: "Loại bỏ lứa cũ, chào đón lứa mới."

 metaphysical_hive: "Bầy Đàn Siêu Hình Học"
 metaphysical_hive_desc: "Chúng ta suy ngẫm về bản chất của sự tồn tại và mục đích ngay cả khi nó gây ra sự bất hòa."

 metaphysics_rejected: "Bác Bỏ Siêu Hình Học"
 metaphysics_rejected_desc: "Các câu hỏi siêu hình học là sự phân tâm của tâm trí đơn độc; chúng ta tìm thấy mục đích không phải ở việc suy ngẫm về sự tồn tại, mà ở việc sống như một thể thống nhất."

 boosted_neurology: "Thần Kinh Tăng Cường"
 boosted_neurology_desc: "Chúng ta đã cân nhắc quá lâu. Chúng ta phải cam kết thực hiện cuộc chuyển hóa giống loài của mình, bất kể mọi khiếm khuyết tiềm tàng."

 balanced_advancement: "Tiến Bộ Cân Bằng"
 balanced_advancement_desc: "Thí nghiệm đột biến của chúng ta không nhất thiết phải thay đổi cách thức chúng ta kết nối với nhau."

 rage_quitting: "Dập Tắt Cơn Giận"
 rage_quitting_desc: "Sự hung hãn liều lĩnh không có chỗ đứng bên trong bầy đàn."

 fury_embracing: "Đón Nhận Cuồng Nộ"
 fury_embracing_desc: "Chúng ta đón nhận sự hỗn loạn chưa từng được viết nên của tương lai."

 decisive_meditation: "Thiền Định Quyết Đoán"
 decisive_meditation_desc: "Chúng ta chọn cách trước hết chấp nhận bản chất đầy biến động của ý thức mình, và cùng nhau hướng tới một góc nhìn tổng thể cân bằng hơn."

 meteorological_adaptations: "Thích Nghi Khí Tượng"
 meteorological_adaptations_desc: "Chúng ta phải dành thời gian và nguồn lực để nâng cao khả năng kiên cường trước khí hậu của mình."

 body_builders: "Kiến Tạo Thể Chất"
 body_builders_desc: "Sức mạnh thể chất là đỉnh cao của tiến hóa."

 deep_thinkers: "Những Nhà Tư Tưởng Sâu Sắc"
 deep_thinkers_desc: "Chính khả năng tư duy sâu sắc là thứ nuôi dưỡng chúng ta."

 sensible_supremacy: "Thống Trị Khôn Ngoan"
 sensible_supremacy_desc: "Chúng ta có thể vừa táo bạo vừa cẩn trọng cùng một lúc."

 decisive_termination: "Chấm Dứt Quyết Đoán"
 decisive_termination_desc: "Để ngăn chặn sự bùng phát của dịch bệnh, chúng ta sẽ tiêu diệt những cá thể bị lây nhiễm."

 survival_study: "Nghiên Cứu Sinh Tồn"
 survival_study_desc: "Nghiên cứu cẩn thận các [GetIndividualNamePlural] bị nhiễm bệnh sẽ dẫn dắt chúng ta tìm ra phương thuốc chữa trị dịch bệnh."
 survival_study_wilderness: "$survival_study$"
 survival_study_wilderness_desc: "$survival_study_desc$"

 uncorrected_blunders: "Sai Lầm Chưa Sửa Chữa"
 uncorrected_blunders_desc: "Có thể chúng ta đã không kiểm tra kỹ lưỡng các tính toán của mình."

 maverick_citizens: "Công Dân Tự Do"
 maverick_citizens_desc: "Nếu bạn không làm gì sai, bạn chẳng có gì phải sợ hãi."

 # Advanced Governments
 # Purity

 bio.170.name: "Thuần Khiết: Cải Cách Chính Quyền?"
 bio.170.desc: "Giống loài chúng ta đang đứng trên bờ vực của biên giới vĩ đại tiếp theo. Giờ đây chúng ta phải đưa ra sự lựa chọn.\n\nLiệu chúng ta sẽ đón nhận vận mệnh của mình, thanh lọc dòng dõi di truyền để nâng tầm nền văn minh lên những tầm cao mới của sự ưu việt di truyền? Hay chúng ta sẽ giữ lại những bài học của quá khứ và tiếp tục duy trì hình thái chưa qua gọt giũa hiện tại?"
 bio.170.a: "Đón nhận sự thuần khiết và tiến tới những tầm cao mới!"
 bio.170.a.tt: "$change_auth_tt$[GetPurityAuthority]"
 bio.170.b: "Chúng ta không cần phải thay đổi cách thức cai trị của mình."

 # Cloning

 bio.175.name: "Nhân Bản: Cải Cách Chính Quyền?"
 bio.175.desc: "Giống loài chúng ta đã bước tới một thời khắc hệ trọng. Một quyết định phải được đưa ra.\n\nLiệu chúng ta sẽ đón nhận vận mệnh bằng cách khai thác sức mạnh của công nghệ nhân bản, chuyển hóa hoàn toàn bản thân thành một nền văn minh của sự hoàn hảo được sao chép? Hay chúng ta sẽ tiếp thu những bài học trong hành trình vừa qua và kiên trì với sự dị biệt không cần thiết của mình?"
 bio.175.a: "Chúng ta đón nhận nhân bản như một phần thiết yếu của tương lai."
 bio.175.a.tt: "$change_auth_tt$[GetCloningAuthority]\n$LEADERS_GAIN_CLONES$"
 bio.175.b: "$bio.170.b$"

 # Mutation

 bio.180.name: "Đột Biến: Cải Cách Chính Quyền?"
 bio.180.desc: "Chúng ta đang đứng trên đỉnh cao của một biên giới sinh học then chốt. Một lựa chọn quan trọng đang đón chờ.\n\nChúng ta có thể đón nhận vận mệnh bằng cách khai thác sức mạnh của đột biến sinh học tiên tiến, chuyển hóa nền văn minh của mình một cách không thể đảo ngược thông qua sự tiến hóa có chủ đích của mã di truyền. Hoặc chúng ta có thể bảo tồn những bài học thu được từ các chiến tích trong quá khứ và tiếp tục duy trì hình thái bình thường hiện tại."
 bio.180.a: "Chúng ta có thể trở thành bất cứ điều gì và mọi thứ."
 bio.180.a.tt: "$change_auth_tt$[GetMutationAuthority]"
 bio.180.b: "$bio.170.b$"

