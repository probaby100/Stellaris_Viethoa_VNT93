 policy_disconnected_drones: "Drone Mất Kết Nối"
 policy_disconnected_drones_desc: "Chúng ta có thể quyết định xem có cho phép các drone bị ngắt kết nối khỏi ý thức trung tâm được sinh sống trên các Thuộc Địa của chúng ta hay không."
 disconnected_drones_sustain: "Duy Trì"
 disconnected_drones_sustain_name: "Duy Trì Drone Mất Kết Nối"
 disconnected_drones_sustain_desc: "Dù bị cắt đứt khỏi ý thức tập thể, những drone này vẫn có thể được giữ cho sống sót.\n\n§EMở khóa §YLoại Quyền Công Dân§! cho các Drone Mất Kết Nối§!"

 disconnected_drones_purge: "Tận Diệt"
 disconnected_drones_purge_name: "Tận Diệt Drone Mất Kết Nối"
 disconnected_drones_purge_desc: "Quyền của một sinh vật có tri giác không mở rộng cho những kẻ không có lý trí. Không có ý thức trung tâm dẫn dắt, những drone này không khác gì loài thú, và một con thú cản đường chỉ là loài gây hại.\n\n§ETất cả các Drone Mất Kết Nối sống trên Thuộc Địa của chúng ta sẽ bị §RThanh Trừng§!.§!"

