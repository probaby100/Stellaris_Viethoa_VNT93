 DSC_AURA_MISSILE_PENETRATION: "Máy Tạo Đa Mục Tiêu Giả"
 DSC_AURA_MISSILE_PENETRATION_DESC: "Biện pháp đối kháng tên lửa này tạo ra hàng triệu tín hiệu giả, khiến đầu đạn xác định sai mục tiêu tiềm năng."
