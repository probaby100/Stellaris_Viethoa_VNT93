 ap_behemoths: "Cơn Thịnh Nộ Của Cự Thú"
 ap_behemoths_desc: "Các loài săn mồi đỉnh cao của những vì sao không bị trói buộc bởi những giới hạn tầm thường. Cùng chung tinh thần đó, chúng ta sẽ rũ bỏ những điểm yếu sinh học đang kìm hãm mình, và trở thành một thế lực của tự nhiên."
