 # Purity

 plus_minus_icon: "£plus_minus£"
 minus_plus_icon: "£minus_plus£"
 pop_effects_from_purity_header: "Hiệu ứng lên £pop£ Pop từ ['concept_genetic_purity']:"
 leaders_gain_genetic_purity_trait: "£leader£ Lãnh đạo hữu cơ nhận được đặc điểm §Y$trait_leader_genetic_purist$§!"
