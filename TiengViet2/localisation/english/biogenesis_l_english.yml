# Species traits localized tags
 SPECIES_TRAIT_CATEGORY_HEADER: "§HPhân Loại Đặc Tính§!\nĐặc tính này thuộc các phân loại sau:"
 SPECIES_TRAIT_HUMANOID: "['concept_humanoid_phenotype_traits']"
 SPECIES_TRAIT_MAMMALIAN: "['concept_mammalian_phenotype_traits']"
 SPECIES_TRAIT_REPTILIAN: "['concept_reptilian_phenotype_traits']"
 SPECIES_TRAIT_ARTHROPOID: "['concept_arthropoid_phenotype_traits']"
 SPECIES_TRAIT_AVIAN: "['concept_avian_phenotype_traits']"
 SPECIES_TRAIT_MOLLUSCOID: "['concept_molluscoid_phenotype_traits']"
 SPECIES_TRAIT_PLANTOID: "['concept_plantoid_phenotype_traits']"
 SPECIES_TRAIT_FUNGOID: "['concept_fungoid_phenotype_traits']"
 SPECIES_TRAIT_LITHOID: "['concept_lithoid_phenotype_traits']"
 SPECIES_TRAIT_NECROID: "['concept_necroid_phenotype_traits']"
 SPECIES_TRAIT_AQUATIC: "['concept_aquatic_phenotype_traits']"
 SPECIES_TRAIT_TOXOID: "['concept_toxoid_phenotype_traits']"
 SPECIES_TRAIT_INFERNAL: "['concept_infernal_phenotype_traits']"
 SPECIES_TRAIT_VOCATIONAL: "['concept_vocational_traits']"
 SPECIES_TRAIT_OVERTUNED: "['concept_overtuned_traits']"
 SPECIES_TRAIT_FLEETING_EXCELLENCE: "['concept_fleeting_excellence_traits']"
 SPECIES_TRAIT_CYBORG: "['concept_cybernetic_traits']"
 SPECIES_TRAIT_UNIVERSAL_AUGMENTATIONS: "['concept_universal_augmentations_traits']"
 SPECIES_TRAIT_ADAPTIVE_FRAMES: "['concept_adaptive_frames_traits']"
 SPECIES_TRAIT_NOMAD: "['concept_nomad_traits']"

 trait_egg_laying: "Đẻ Trứng"
 trait_egg_laying_desc: "Thế hệ con non của loài này không phát triển bên trong cơ thể cha mẹ mà bên trong lớp vỏ bảo vệ của quả trứng. Điều này cho phép dân số tăng trưởng nhanh chóng trong những thời kỳ no đủ."
 trait_egg_laying_effect: "Tốc độ Tăng trưởng Dân số: §G+15%§! khi sống trên hành tinh có §GSản Lượng Thặng Dư§! $r_food$ tại địa phương (hoặc tương đương)"
 trait_egg_laying_portrait_override_tt: "Hoặc bất kỳ loài đẻ trứng nào"

 trait_seasonal_dormancy: "Ngủ Đông Theo Mùa"
 trait_seasonal_dormancy_desc: "Loài này đã tiến hóa trên một hành tinh có các mùa tuần hoàn thích hợp cho việc ngủ đông. Trong thời đại hiện đại, những kích hoạt theo mùa này có thể được mô phỏng nhân tạo để lưu trữ hiệu quả các thành viên có năng suất thấp hơn trong xã hội."
 trait_seasonal_dormancy_effect: "Chi phí Duy trì Dân cư Có Việc làm: §G-15%§!\n    - Chi phí Duy trì Dân cư Thất nghiệp và ['concept_denizen']: §G-75%§!"
 trait_seasonal_dormancy_portrait_override_tt: "Hoặc bất kỳ loài ngủ đông nào"

 trait_hollow_bones: "Xương Rỗng"
 trait_hollow_bones_desc: "Bộ xương mỏng manh của loài này cho phép chúng di chuyển thanh thoát và nhẹ nhàng. Tuy nhiên, chúng cũng dễ bị ảnh hưởng bởi tác động trọng lực từ hành tinh của mình."
 trait_hollow_bones_effect: "$BONUS_WORKFORCE_FOR$ Việc làm $pop_cat_worker_plural$, $pop_cat_simple_drone_plural$ và Binh lính trên mỗi Quy mô Hành tinh: §R-0.67%§!"

 trait_rooted: "Cắm Rễ"
 trait_rooted_desc: "Loài này thực sự cắm rễ vào bất kỳ môi trường nào chúng sinh sống, khiến việc di dời trở thành một trải nghiệm vô cùng đau đớn."
 AUTO_MIGRATE_ROOTED: "§RDân cư Cắm Rễ không thể di cư.§!"
 trait_rooted_effect: "§RDân cư sẽ không Tự Động Tái Định Cư§!\n    - Chi phí Tái Định Cư: §R+200%§!"
 trait_rooted_portrait_override_tt: "Hoặc bất kỳ loài nào bám rễ vào môi trường"

 trait_acidic_vascularity: "Hệ Mạch Axit"
 trait_acidic_vascularity_desc: "Dịch bên trong cơ thể loài này đóng vai trò như lớp phòng thủ uy lực nhất của chúng. Với tính ăn mòn cực cao và gây chết người, chất dịch này đảm bảo bất kỳ kẻ thù nào cũng phải hối hận khi làm thủng cơ thể chúng."
 trait_acidic_vascularity_effect: "Quân đoàn lính §YNổ tung khi Chết§!, gây §G250§! Sát thương cho Kẻ thù\n    - $mod_pop_cat_purge_bonus_workforce_mult$: §R-75%§!"
 DAMAGE_ARMY: "Gây sát thương cho $ARMY|Y$"

 trait_shelled: "Có Vỏ Bọc"
 trait_shelled_desc: "Dù phát triển tự nhiên hay có được do tình cờ (hoặc thiết kế), loài này luôn mang theo ngôi nhà của mình. Chiếc vỏ này mang lại một nơi trú ẩn an toàn, đảm bảo luôn có chỗ để nghỉ ngơi qua đêm."
 trait_shelled_portrait_override_tt: "Hoặc bất kỳ loài mang vỏ nào"

 trait_camouflage: "Ngụy Trang"
 trait_camouflage_desc: "Là bậc thầy ngụy trang, loài này hòa nhập hoàn hảo vào môi trường xung quanh, khiến bản thân gần như vô hình trước cả kẻ săn mồi lẫn con mồi. Sự thấu hiểu bẩm sinh về quang học mang lại cho chúng lợi thế lớn trong chiến tranh du kích."
 trait_camouflage_portrait_override_tt: "Hoặc bất kỳ loài có khả năng ngụy trang nào"

 trait_chromalogs: "Ngôn Ngữ Sắc Tố"
 trait_chromalogs_desc: "Khai thác nghệ thuật màu sắc, loài này đã vượt qua khả năng ngụy trang đơn thuần, tiến hóa để giao tiếp thông qua các hoa văn rực rỡ và phức tạp hiển thị trên cơ thể."
 trait_chromalogs_portrait_override_tt: "Hoặc bất kỳ loài nào dùng màu sắc cơ thể để giao tiếp"

 trait_brittle: "Dễ Gãy Vỡ"
 trait_brittle_desc: "Bị cản trở bởi sự mỏng manh cố hữu, loài này phải hết sức cẩn trọng trong các hoạt động hàng ngày để tránh bị nứt vỡ ngay cả trong những công việc tầm thường nhất."

 trait_familial: "Gắn Kết Gia Đình"
 trait_familial_desc: "Được gắn kết bởi những mối quan hệ sâu sắc, bền chặt với những người thân thích nhất, loài này tạo nên những tập thể gắn kết và hiệu quả cao."
 trait_familial_effect: "Hạnh phúc trên mỗi §Y100§! £pop£ Dân cư có Đặc tính này trên cùng một hành tinh: §G0.1%§! (Tối đa: §G+20%§!)"
 trait_familial_portrait_override_tt: "Hoặc bất kỳ loài sống theo gia đình nào"

 trait_permeable_skin: "Lớp Da Thấm Nước"
 trait_permeable_skin_desc: "Lớp da phát triển đặc biệt đòi hỏi các điều kiện lý tưởng bao phủ loài này. Miễn là loài này không đi quá xa khỏi khí hậu quê nhà thì điều đó sẽ không thành vấn đề."
 trait_permeable_skin_effect: "Độ Phù hợp Định cư trên các thế giới có ['concept_climate_category'] khác với Sở thích của chúng ta: §R-20%§!"
 concept_climate_category: "Nhóm Khí Hậu"
 concept_climate_category_desc: "Các hành tinh có thể định cư được chia thành ba nhóm khí hậu:\n- Ẩm ướt:\n$t$- Lục địa\n$t$- Đại dương\n$t$- Nhiệt đới\n- Lạnh giá:\n$t$- Vùng núi cao\n$t$- Bắc cực\n$t$- Lãnh nguyên\n- Khô cằn:\n$t$- Cằn cỗi\n$t$- Sa mạc\n$t$- Xavan"

 trait_genetic_memory: "Ký Ức Di Truyền"
 trait_genetic_memory_desc: "Truyền lại kiến thức và kinh nghiệm từ thế hệ này sang thế hệ khác là khởi đầu của nhiều nền văn minh. Loài này đã tiến thêm một bước bằng cách mã hóa các hiểu biết sinh tồn trực tiếp vào mã di truyền của mình, đảm bảo mỗi thế hệ sinh ra đều mang sẵn trí tuệ tích lũy của tổ tiên."
 trait_genetic_memory_effect: "Độ Phù hợp Định cư từ Thời gian Thuộc địa: §G+0.5%§! mỗi Năm (Tối đa §G+25%§!)"
 trait_genetic_memory_portrait_override_tt: "Hoặc bất kỳ loài nào có bản năng sinh tồn kế thừa"

 trait_nascent_stage: "Giai Đoạn Sơ Sinh"
 trait_nascent_stage_desc: "Loài này sinh con ở giai đoạn phát triển rất sớm, dẫn đến một khoảng thời gian kéo dài mà con non không thể đóng góp cho xã hội. Trong thời gian này, chúng hoàn toàn vô tư trước những trách nhiệm và gánh nặng đi kèm với trí khôn."
 trait_nascent_stage_effect: "Dân cư mới tăng trưởng có đặc tính này sẽ trải qua §Y5§! Năm đầu tiên sau khi sinh ra ở trạng thái Tiền Trí Khôn."
 trait_nascent_stage_portrait_override_tt: "Hoặc bất kỳ loài nào có thời kỳ thơ ấu kéo dài"

 trait_presapient_stage: "Tiền Trí Khôn"
 trait_presapient_stage_desc: "Trải qua một khoảng thời gian ngắn thiếu vắng ý thức, loài này sẽ sớm lớn lên để trở thành một sinh thể hoàn toàn có trí khôn."

 trait_flight: "Khả Năng Bay Lượn"
 trait_flight_desc: "Loài này bay vút lên trên những ràng buộc của mặt đất, tự do điều hướng bầu trời. Các thành phố của chúng có cấu trúc dày đặc độc đáo, được tối ưu hóa cho cư dân trên không. Trong xung đột, chúng tỏ ra là những mục tiêu thoắt ẩn thoắt hiện và khó bị bắn trúng."
 trait_flight_portrait_override_tt: "Hoặc bất kỳ loài nào thích nghi với đời sống trên không"

 trait_spatial_mastery: "Làm Chủ Không Gian Ba Chiều"
 trait_spatial_mastery_desc: "Không chỉ có khả năng bay lượn, loài này còn sở hữu những cấu trúc não bộ độc đáo, cho phép chúng xử lý và định vị theo bản năng trong không gian ba chiều. Những khả năng này khiến chúng vô song trong việc lập kế hoạch tác chiến, khảo sát hành tinh và quản lý đô thị."
 trait_spatial_mastery_portrait_override_tt: "Hoặc bất kỳ loài nào có thiên phú định vị không gian ba chiều"

 trait_spare_organs: "Cơ Quan Dự Phòng"
 trait_spare_organs_desc: "Loài này đã tiến hóa các cơ quan nội tạng dư thừa để sống sót sau những chấn thương nặng nề nhất — một sự thích nghi thành công, được minh chứng qua sự tồn tại liên tục của chúng."
 trait_spare_organs_effect: "Thủ lĩnh sẽ sống sót sau lần tử vong đầu tiên\n    - Khi Quân đội Tấn công Chết: §G20%§! Cơ hội tạo ra một Quân đoàn Thay thế\n    - £job_livestock£ §Y$job_livestock$§! Hiệu suất Việc làm: §G+50%§!"
 mod_planet_livestock_produces_mult: "Sản lượng £job_livestock£ §Y$job_livestock$§!"

 trait_leader_second_chanced: "Cơ Hội Thứ Hai"
 trait_leader_second_chanced_desc: "Thủ lĩnh này đã sống sót sau một vết thương chí mạng nhờ có các cơ quan nội tạng dự phòng."

#################################
# Evolutionary Predators Origin #
# Written by Victor Haeggman  #
#################################

 #Origin and Start of Game
 origin_evolutionary_predators: "Kẻ Săn Mồi Tiến Hóa"
 origin_evolutionary_predators_desc: "Loài này không chỉ săn mồi để sinh tồn; chúng săn mồi để tự hoàn thiện. Bằng cách hấp thụ DNA của những kẻ bị đánh bại, chúng tiến hóa và thích nghi với tốc độ đáng kinh ngạc."
 origin_tooltip_evolutionary_predators_effects: "- $SPECIES_TRAITS$ ['concept_malleable_genes']\n- Tình huống: ['concept_adaptive_evolution']\n- Quê nhà: ['concept_genetic_soup']"

 START_SCREEN_EVOLUTIONARY_PREDATORS_BASE: "[GetSpeciesNamePlural] luôn là những kẻ săn mồi. Chúng ta tìm kiếm con mồi ở bất cứ nơi nào có thể tìm thấy, dũng cảm đối mặt với cả những môi trường khắc nghiệt nhất để nếm trải những điều mới lạ. Khi bản thân bạn là những gì bạn ăn, nỗ lực không bao giờ là vô ích.\n\n"
 START_SCREEN_EVOLUTIONARY_PREDATORS_REGULAR: "$START_SCREEN_EVOLUTIONARY_PREDATORS_BASE$Giờ đây, cơn đói khát tiến hóa đã thúc giục chúng ta nhìn lên những vì sao. Với việc phát minh ra [GetStartingDrive], cả thiên hà trở thành bãi săn mới của chúng ta. Vô số loài sinh vật đang chờ đợi để trở thành một phần trong sự vĩ đại tiếp theo của chúng ta."
 START_SCREEN_EVOLUTIONARY_PREDATORS_HIVE: "$START_SCREEN_EVOLUTIONARY_PREDATORS_BASE$Tiềm thức tập thể của chúng ta luôn biết rõ tiềm năng di truyền của chính mình — chúng ta có thể hấp thụ và thích nghi với các đặc tính của con mồi, tích hợp ưu thế của chúng vào bầy đàn.\n\nBản năng săn mồi cổ xưa này tiếp tục đạt đến trạng thái cân bằng có kiểm soát. Chúng ta không còn cần phải dựa vào việc săn bắn để tiến hóa; thay vào đó, các phòng thí nghiệm có thể tổng hợp mọi vật liệu di truyền và phân phối liền mạch trên toàn bầy đàn.\n\nVới sự xuất hiện của [GetStartingDrive], chúng ta đã sẵn sàng lan tỏa khắp thiên hà và thưởng thức tất cả những gì nơi đây mang lại."
 START_SCREEN_EVOLUTIONARY_PREDATORS_DEVOURING_SWARM: "$START_SCREEN_EVOLUTIONARY_PREDATORS_BASE$Chỉ sau khi đã nuốt chửng mọi dạng sống cuối cùng trên [GetHomeWorldName], chúng ta mới nhận ra sự dại dột của mình. Giờ đây chúng ta sẽ lấy đâu ra những đặc tính thích nghi mới? Vì vậy, chúng ta đã ngước nhìn lên.\n\nChúng ta là những kẻ săn mồi tối thượng. Những kẻ khác săn mồi để sinh tồn; chúng ta săn mồi để hoàn thiện bản thân.\n\nVới sự ra đời của [GetStartingDrive], chúng ta đã sẵn sàng rình rập một lần nữa. Thiên hà bao la rộng lớn, và tràn ngập thức ăn."
 START_SCREEN_EVOLUTIONARY_PREDATORS_NOMADS: "[GetSpeciesNamePlural] luôn luôn là những kẻ săn mồi. Khoảng hư không chỉ đơn thuần là vùng hoang dã sâu thẳm nhất mà chúng ta từng rình rập — và chiến hạm khởi nguyên của chúng ta là chiếc nanh sắc nhọn nhất mà chúng ta từng mọc ra. Không có bóng tối nào quá sâu thẳm, không có khoảng cách nào quá xa xôi, khi cơn đói thôi thúc chúng ta tiến lên.\n\nChúng ta luôn biết rằng chúng ta được định hình bởi máu thịt của con mồi — mỗi chuyến săn, mỗi lần hạ sát đều khiến chúng ta mạnh mẽ hơn.\n\nQuá khứ tàn bạo không phải là gánh nặng mà là bản chất tồn tại của chúng ta. Được tinh lọc qua lăng kính khoa học hiện đại, chúng ta không còn cần phải ngấu nghiến để tiến hóa; chỉ một dấu vết vật liệu di truyền nhỏ nhoi cũng đủ để dệt nên sức mạnh của nó vào chính bản thân chúng ta.\n\nCơn đói khát tiến hóa vẫn bùng cháy bên trong chúng ta, và với việc lắp đặt [GetStartingDrive] trên toàn hạm đội, chúng ta đã sẵn sàng rình rập khắp thiên hà để thưởng thức tất cả những gì nơi này ban tặng."
 #Traits

 trait_malleable_genes: "Gen Dễ Biến Đổi"
 trait_malleable_genes_desc: "§LLoài này không cố định vào các đặc điểm và cơ quan có thể nhận dạng như hầu hết các loài khác. Thay vào đó, chúng phát triển phần phụ phù hợp nhất cho công việc. Tuy nhiên, sự bất ổn định này cũng mang lại một số hạn chế.§!"
 trait_malleable_genes_cant_modify: "§RKhông thể Chỉnh Sửa Di Truyền đối với Loài có Đặc tính này§!\n$automodding_trait_tooltip_all$ §Y$trait_malleable_genes$§! chọn các hiệu ứng điều chỉnh từ ['concept_automodding_malleable']"
 CANNOT_MODIFY_MALLEABLE_GENES_SPECIES: "$TRIGGER_FAIL$Hệ gen bất ổn định của loài này đồng nghĩa với việc không thể chỉnh sửa gen."

 concept_malleable_genes: "$trait_malleable_genes$"
 concept_malleable_genes_desc: "$trait_malleable_genes_cant_modify$"
 concept_automodding_malleable: "Danh Sách Đặc Tính Tự Điều Chỉnh Của Gen Dễ Biến Đổi"
 concept_automodding_malleable_desc: "- ['trait:trait_malleable_minerals']\n- ['trait:trait_malleable_energy']\n- ['trait:trait_malleable_food']\n- ['trait:trait_malleable_research']\n- ['trait:trait_malleable_unity']\n- ['trait:trait_malleable_forge']\n- ['trait:trait_malleable_trade']\n- ['trait:trait_malleable_ameneties']"
 concept_adaptive_evolution: "Tiến Hóa Thích Nghi"
 concept_adaptive_evolution_desc: "Tình huống tiến triển khi DNA của các dạng sống khác được tiêu thụ.\n§GKhi Hoàn Thành:§!\n$t$- Chọn một đặc tính loài mới dựa trên các loài vừa tiêu thụ\n§YĐược thúc đẩy bởi:§!\n$t$- Khai hoang các hành tinh mới\n$t$- Thanh trừng hoặc nuôi các loài khác làm gia súc\n$t$- Giữ các loài khác trong Đế chế của bạn làm nô lệ hoặc ở mức sống cao hơn\n$t$- Bổ nhiệm các thủ lĩnh ngoại chủng vào Hội đồng của bạn\n$t$- Duy trì các Chư Hầu Sinh Học\n$t$- Thiết lập Hiệp ước Thương mại khi là Đại Tập Đoàn\n$t$- Chạm trán sự sống ngoài hành tinh qua các sự kiện"
 concept_genetic_soup: "$genetic_soup$"
 concept_genetic_soup_desc: "$fresh_biosphere_tt$\n\n§L$genetic_soup_desc$§!"

 trait_malleable_minerals: "Móng Vuốt Biến Đổi"
 trait_malleable_minerals_desc: "§LVới những ngón tay cứng như kim cương, sự thích nghi này cho phép khai thác khoáng sản dễ dàng hơn.§!"
 trait_malleable_energy: "Lớp Cách Điện Biến Đổi"
 trait_malleable_energy_desc: "§LMột lớp cách điện dày bảo vệ chống lại tai nạn, đặc biệt là trong các môi trường năng lượng cao.§!"
 trait_malleable_food: "Lưỡi Cày Biến Đổi"
 trait_malleable_food_desc: "§LMột phần phụ bổ sung với ngón tay cứng cáp giống như chiếc xẻng giúp tăng tốc độ xới đất và gieo trồng. Thích nghi với nhiều loại địa hình, những lưỡi cày biến đổi này luôn là công cụ hoàn hảo cho công việc.§!"
 trait_malleable_research: "Vỏ Não Biến Đổi"
 trait_malleable_research_desc: "§LDù vỏ não trung tâm phình to gây cảm giác hơi khó chịu, nhưng nó giúp tăng tốc đáng kể khả năng giải quyết vấn đề và đổi mới sáng tạo.§!"
 trait_malleable_unity: "Giác Quan Biến Đổi"
 trait_malleable_unity_desc: "§LCác cơ quan cảm giác nâng cao tạo điều kiện cho sự hiểu biết sâu sắc hơn và trân trọng các góc nhìn đa dạng. Trước khi có thể phát triển, trước hết bạn phải quan sát.§!"
 trait_malleable_forge: "Lớp Chai Biến Đổi"
 trait_malleable_forge_desc: "§LKhi xử lý các vật liệu bỏng rát hoặc ăn mòn, lớp chai dày cộm là vô giá.§!"
 trait_malleable_trade: "Pheromone Biến Đổi"
 trait_malleable_trade_desc: "§LPheromone có tính thích nghi cao có thể mang lại sức thuyết phục đáng kinh ngạc trong các cuộc đàm phán.§!"
 trait_malleable_ameneties: "Âm Điệu Biến Đổi"
 trait_malleable_ameneties_desc: "§LBằng cách thay đổi cấu trúc của dây thanh âm, loài này có thể tạo ra những âm thanh cực kỳ êm dịu và thu hút.§!"

