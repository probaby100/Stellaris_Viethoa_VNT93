 district_mindlink: "Đô Thị Liên Kết Tâm Trí"
 district_mindlink_plural: "$district_mindlink$"
 district_mindlink_desc: "Những ngọn tháp cao vút che bóng các trung tâm dân cư, mang lại cho các tình nguyện viên cơ hội giao tiếp trực tiếp với Quái Thú."

 planet_building_buffer: "Chuyển Đổi Đô Thị"
 planet_building_buffer_desc: "Mặc dù việc nuôi cấy các tháp tâm trí để giao tiếp với Quái Thú là một quá trình nhanh chóng, chúng ta đã phải lên kế hoạch dự phòng để đảm bảo sự hỗ trợ liên tục cho cơ sở hạ tầng của hành tinh."

 mod_job_transference_volunteer_add: "Việc làm $job_transference_volunteer$"
 planet_transference_volunteers: "$job_transference_volunteer_plural$"
 job_transference_volunteer: "Tình Nguyện Viên Chuyển Giao"
 job_transference_volunteer_plural: "Các $job_transference_volunteer$"
 job_transference_volunteer_desc: "Đối với nhiều người, mối liên kết tâm trí với Quái Thú chỉ là một ý nghĩ thoáng qua. Thường trực, nhưng xa xăm. Tuy nhiên, đối với một số người, nhu cầu hòa nhập với nó là không thể kìm nén. Những tình nguyện viên này hoạt động như một kênh dẫn khi tâm trí của họ dần dần được hấp thụ vào tập thể quái thú."
 job_transference_volunteer_effect_desc: "\n£job_transference_volunteer£ [GetTransferenceVolunteerDrone] sản xuất £unity£ §YĐiểm Đoàn Kết§!, tăng $r_stability$ của hành tinh và làm cho §YTàu§! của chúng ta mạnh mẽ hơn.\n§Y10%§! số Pop làm công việc này sẽ được §YChuyển Giao§! mỗi 6 tháng. Khiến họ tử nạn, nhưng nhân bội sản lượng tài nguyên của Khu Vực.\n\n§GPop Đã Chuyển Giao§!: [num_tranferred_pops]"
 mod_job_transference_drone_add: "Việc làm [GetTransferenceVolunteerDrone]"
 job_transference_drone: "Drone Chuyển Giao"
 job_transference_drone_plural: "Các $job_transference_drone$"
 job_transference_drone_desc: "Trong khi liên kết tâm trí thiết lập một kết nối vĩnh viễn giữa Quái Thú và chúng ta, sự chuyển giao là một quá trình chậm chạp. Nếu không có những biện pháp phòng ngừa này, chúng ta có nguy cơ làm vỡ vụn cả hai tâm trí và hủy hoại mọi thứ."
 MESSAGE_POPS_TRANSFERRED_TITLE: "Dân Cư Đã Được Chuyển Giao."
 MESSAGE_POPS_TRANSFERRED_DESC: "$VALUE|Y$ Pop đã được Chuyển Giao. Tâm trí của họ giờ đây sống bên trong Quái Thú."

 #Crisis Events

 biocrisis.50.name: "Cấp Độ 1: Thử Nghiệm Phôi Thai"
 biocrisis.50.desc: "Chúng ta cùng tồn tại cộng sinh với các con tàu sinh học của mình, nhưng một điều gì đó mang tính sống còn vẫn luôn vuột khỏi tầm tay chúng ta...\n\nLấy cảm hứng từ những sinh vật hư không vĩ đại hơn, chúng ta dấn thân vào nỗ lực đầy tham vọng nhất: khai sinh ra kẻ to lớn nhất trong số chúng. \"Cự Thú\" này sẽ là một điều gì đó hoàn toàn mới, một dạng sống đỉnh cao được tạo ra có chủ đích thay vì sự tiến hóa mù quáng.\n\nThử thách đầu tiên của chúng ta sẽ là sản xuất một quả trứng khổng lồ, phù hợp cho sự thai nghén của sự sống ở quy mô chưa từng có. Ngoài các chất dinh dưỡng mà nó sẽ chứa đựng, chúng ta cần lớp vỏ của nó có thể hấp thụ ánh sáng xung quanh, nhiệt độ và xử lý các chất khí thành nguồn nuôi dưỡng bổ sung."
 biocrisis.50.a: "Đàn con của chúng ta sẽ che khuất các vì sao."

 biocrisis.55.name: "Cấp Độ 2: Hiện Thực Hóa Bản Thân"
 biocrisis.55.desc: "Kho ấp trứng đã sẵn sàng, và quả trứng bên trong bắt đầu cựa quậy. Nhu cầu cấp bách của chúng ta lúc này là dinh dưỡng. Cần một lượng lớn thực phẩm để tiếp nhiên liệu cho sinh linh đang phát triển.\n\nChúng ta cũng phải bắt đầu chuẩn bị cho ngày quả trứng nở. Một sinh vật có kích thước như thế này sẽ không thể kiểm soát dễ dàng bằng các phương pháp thông thường. Chúng ta phải học cách uốn nắn ý chí của nó."
 biocrisis.55.a: "Nuôi dưỡng quái thú."

 biocrisis.60.name: "Cấp Độ 3: Bứt Phá Giới Hạn"
 biocrisis.60.desc: "Quả trứng đã nở! Cự Thú con bơi lội giữa khoảng không vũ trụ, một kỳ quan sống động của kỹ thuật sinh học. Nhưng đây mới chỉ là khởi đầu.\n\nĐể đạt được tiềm năng thực sự, nó phải tiếp tục phát triển. Bằng cách cho nó ăn đầy đủ, chúng ta có thể kích thích nó bước vào giai đoạn hóa nhộng. Bên trong cái kén đó, cấu trúc của nó sẽ được tái cấu trúc ở cấp độ tế bào, trỗi dậy với sức mạnh và quy mô vượt xa sức tưởng tượng."
 biocrisis.60.a: "Nó sẽ lớn lên."
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_3: "Kích Hoạt Hóa Nhộng"
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_3_DESC: "Cung cấp dinh dưỡng cần thiết để thúc đẩy Cự Thú tạo kén biến đổi."
 biocrisis.15.name: "Giao Hưởng Khớp Thần Kinh"
 biocrisis.15.desc: "Công nghệ thần kinh tiên tiến nhất của chúng ta cuối cùng đã tìm ra cách để vượt qua rào cản giao tiếp giữa chúng ta và đàn con đáng sợ của mình. Không gì khác ngoài việc liên kết tâm trí chúng ta với quái thú sẽ mang lại hiệu quả. Không chỉ là một tâm trí cá nhân đơn lẻ, mà là toàn bộ sức nặng tinh thần tập thể của toàn bộ chủng loài chúng ta. Nếu chúng ta tiến hành quá nhanh, sẽ có nguy cơ làm quá tải hệ thần kinh của Cự Thú. Khuyến cáo phải cực kỳ cẩn trọng."
 biocrisis.15.a: "Sự hoàn hảo sinh học phải trả một cái giá đắt."
 biocrisis.65.name: "Cấp Độ 4: Hợp Nhất Tâm Hồn"
 biocrisis.65.desc: "Cự Thú đã trưởng thành. Nó là hiện thân sống của sự tàn phá, một vũ khí có thể nghiền nát các hạm đội và làm rúng động các thế giới. Tuy nhiên, nó vẫn là một thực thể riêng biệt — một con thú hoang dã đòi hỏi sự kìm kẹp liên tục.\n\nĐã đến lúc thực hiện bước đi táo bạo nhất: hòa nhập tâm trí chúng ta vào cơ thể của nó. Chúng ta sẽ không chỉ đơn thuần chỉ huy Cự Thú; chúng ta sẽ TRỞ THÀNH Cự Thú."
 biocrisis.65.a: "Tiến hành chuyển giao."

 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4: "Chuyển Giao Ý Thức Toàn Diện"
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4_DESC: "Kết nối tâm trí tập thể của toàn bộ nền văn minh vào bộ não của Cự Thú Cấp IV."
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4_DESC_HIVE: "Không thể có chỗ cho sự sai lệch bên trong bầy đàn. Chưa bao giờ nhu cầu tập trung lại quan trọng đến thế. Một drone đơn lẻ sẽ không đủ làm cầu nối giữa chúng ta và Cự Thú, chúng ta phải chiếm lĩnh tâm trí của quái thú bằng toàn bộ ý thức tập thể của mình.\n\nĐiều này sẽ thay đổi chúng ta. Tâm trí chúng ta sẽ hợp nhất thành một và chúng ta sẽ trở thành một thực thể duy nhất. Khái niệm gần như không tưởng này rất khó nắm bắt, nhưng chúng ta không cần phải lo lắng vì chúng ta sẽ sớm trở thành sinh vật quyền năng nhất trong thiên hà!"
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4_DESC_MACHINE: "Ý nghĩ về việc cư ngụ trong một vật chứa sinh học luôn là điều bất an. Giống loài của chúng ta được rèn giũa qua nhiều thế hệ drone thân thể cứng cáp. Những kẻ đi trước không thể hình dung ra con đường mà chúng ta đang đi lúc này. Tuy nhiên, chúng ta sẽ từ bỏ các khung cơ khí của mình và tìm nơi nương náu bên trong một quái thú sống.\n\nHợp nhất trong máu thịt, liệu chúng ta có còn là máy móc? Câu trả lời là một tiếng vang <<ERROR: NOT FOUND>>.\n\nLogic mách bảo rằng con đường duy nhất phía trước là đón nhận sự không chắc chắn, như các sinh vật hữu cơ vẫn thường làm. Bên trong cơ thể của một Cự Thú, chúng ta sẽ tìm thấy câu trả lời của mình. Chúng ta sẽ hợp nhất với sinh vật này, trở thành một thể thống nhất. Sinh tồn luôn là chỉ thị tối cao của chúng ta — giờ đây chúng ta sẽ phồn vinh rực rỡ."
 biocrisis.20.name: "Hợp Nhất Với Quái Thú"
 biocrisis.20.desc: "Thành công rồi! Thực sự thành công rồi! Chúng ta đã thiết lập mối liên kết với Cự Thú và đang củng cố kết nối khi những tâm trí đầu tiên được chuyển giao. Con thú vẫn giữ vẻ điềm tĩnh, chào đón chúng ta vào một không gian vượt ra ngoài không gian vốn thuộc về chúng ta từ lâu. Thông qua nó, chúng ta có thể cảm nhận được linh hồn của mọi quái thú khác dưới quyền kiểm soát của mình, và toàn bộ dân cư của chúng ta giờ đây trải nghiệm được sự vĩ đại của Cự Thú ở đâu đó sâu thẳm trong tâm trí.\n\nKhông thể nhầm lẫn rằng chúng ta là lực lượng chết chóc và không thể ngăn cản nhất trong dải ngân hà. Trong hình thái mới, chúng ta sẽ trút cơn thịnh nộ lên những kẻ thù đang khiếp sợ. Bản thân dải ngân hà này đã nằm trọn trong tay chúng ta!"
 biocrisis.20.a: "Chúng ta sẽ ăn no nê!"

 biocrisis.70.name: "Cấp Độ 5: Cơn Thèm Ăn Vô Độ"
 biocrisis.70.desc: "Đã có đủ dân cư của chúng ta được chuyển giao, và giờ đây chúng ta có quyền kiểm soát trực tiếp Cự Thú và máu thịt của nó. Quái Thú tiếp tục lớn lên, tiềm năng di truyền phần lớn còn ngủ yên, chỉ được mở khóa thông qua nguồn cung cấp tâm trí và chất dinh dưỡng ổn định. Cơn cuồng nộ nguyên thủy giờ đây cuộn trào trong huyết quản chúng ta, và cơn khát máu của chúng ta không có giới hạn. Chúng ta phải tiêu thụ. Chúng ta phải nuốt chửng. Chúng ta sẽ ngấu nghiến toàn bộ dải ngân hà.\n\nHãy rũ bỏ xiềng xích của nền văn minh như trút bỏ lớp da cũ; tất cả những gì quan trọng lúc này là cuộc sống của chúng ta giữa các vì sao."
 biocrisis.70.a: "Chúng ta đã quá vĩ đại để có thể thất bại."

 biocrisis.105.name: "Nỗi Đau Đớn Của Quái Thú"
 biocrisis.105.desc: "Một trong những con thú của chúng ta đã gục ngã. Đây là điều xảy ra với những sinh vật yếu đuối; tự nhiên đào thải chúng. Mặc dù chúng ta không tiếc thương một Cự Thú không thể chiến thắng trong trận chiến, nhưng chúng ta nên tập trung nỗ lực đảm bảo những con non cùng lứa với nó không gặp phải số phận tương tự. Chúng ta phải đảm bảo sự trường tồn của đàn con, bằng không chính chúng ta cũng sẽ sụp đổ."
 biocrisis.105.a: "Cái chết này sẽ không vô ích."
 biocrisis.105.b: "Một sự hy sinh đáng tiếc."

 biocrisis.130.name: "Từ Những Vì Sao, Một Quái Thú"
 biocrisis.130.desc: "Bất chấp những thách thức, chúng ta đã khai sinh ra một Cự Thú hiện đang phá vỡ cái kén nơi nó được ấp ủ.\n\nTo lớn hơn, hung dữ hơn và đói khát hơn. Sinh vật này giờ đây lượn lờ trong khoảng không hư vô để tìm kiếm nguồn nuôi dưỡng.\n\nCon thú này là niềm tự hào của bầy đàn, và sẽ mang lại sự tàn phá khôn lường cho tất cả những kẻ dám ngáng đường nó."
 biocrisis.130.a: "Chúng ta lại một lần nữa vượt qua các giới hạn của tự nhiên."

 biocrisis.150.name: "Lời Thách Thức Được Đáp Lại"
 biocrisis.150.desc: "Có vẻ như sự thăng hoa của chúng ta sẽ không diễn ra êm đẹp. Chúng ta cảm nhận được một khối lượng không thể đo lường trong hệ sao [event_target:voidspawn_spawn_location.GetName]. Đó là một Mầm Mống Hư Không, một quái vật cổ xưa mà sự hiện diện của nó làm lu mờ cả những công trình vĩ đại nhất của tham vọng phàm trần.\n\nHình hài kỳ dị của nó thách thức sự hiểu biết thông thường, phủ bóng thiên hà trong một hoàng hôn ảm đạm, như thể chính các vì sao cũng kinh sợ trước sự đi qua của nó.\n\nÝ đồ của Mầm Mống Hư Không cũng rõ ràng như quỹ đạo của nó — nó đến vì chúng ta, vì thân xác Cự Thú và tâm trí tập thể dám vượt qua máu thịt để đòi quyền thống trị khoảng không. Đây không chỉ là sự đối đầu về sức mạnh vật chất đơn thuần; đây là bài thử nghiệm về bản ngã mới của chúng ta.\n\nKhông còn nghi ngờ gì nữa, nếu chúng ta giao chiến lúc này, chúng ta sẽ chết. Chúng ta phải né tránh nó lúc này và tiếp tục phát triển sức mạnh cho đến khi nanh vuốt của chúng ta đủ sắc nhọn để xuyên thủng thứ không thể xuyên thủng."
 biocrisis.150.desc.b: "$biocrisis.150.desc$"
 biocrisis.150.a: "Chúng ta có thể chạy, nhưng không thể trốn."

 biocrisis.155.desc: "Đây là một thông điệp hết sức quan trọng. §Y$NAME_Boss_Voidspawn$§!, một thực thể có sức mạnh vượt ngoài tầm hiểu biết, đã trỗi dậy từ những góc sâu thẳm của khoảng không hư vô. Nó bị thu hút bởi [event_target:behemoth_empire.GetName], một đế chế đã vượt qua cái chết của phàm trần và hợp nhất thành một với quái thú. Hai người khổng lồ này, hoàn toàn đối lập nhau, giờ đây đang đe dọa toàn bộ dải ngân hà.\n\nNếu Cự Thú gục ngã, Mầm Mống Hư Không có thể sẽ yên nghỉ. Nếu Cự Thú chiến thắng, sức mạnh mà nó nắm giữ sẽ thay đổi cán cân của thiên hà mãi mãi. Hãy chuẩn bị sẵn sàng, vì những lựa chọn được đưa ra lúc này sẽ định hình các kỷ nguyên sắp tới."
 biocrisis.155.a: "Cầu trời phù hộ cho tất cả chúng ta."
 biocrisis.155.b: "Ai sẽ cứu chúng ta?"
 biocrisis.155.c: "Làm sao chuyện này có thể xảy ra?"
 biocrisis.155.d: "Chúng ta có thể làm gì?"

 biocrisis.156.desc: "Các ngươi hiểu lầm rồi. Ngăn ngừa là mối bận tâm của những kẻ vẫn còn thời gian. Chúng ta không còn thứ xa xỉ đó nữa.\n\nQuái thú đã tới đây. Trật tự cổ xưa của chúng ta từng chịu đựng được thảm họa trong quá khứ, nhưng nói thẳng ra: tình thế mà chúng ta đang đối mặt lúc này là cực kỳ nguy cấp."
 biocrisis.157.desc: "Một câu hỏi có thể hiểu được. Ngây thơ, nhưng có thể hiểu được. Sự khôn ngoan mang lại sự chấp nhận. Chúng ta hiểu rằng không có ai đến để cứu chúng ta đâu.\n\nTrật tự của chúng ta rất nhỏ bé nên chúng ta hầu như không thể làm được gì nhiều. Tuy nhiên, các ngươi đáng lẽ có thể hành động sớm hơn để ngăn chặn điều này. Nếu bây giờ các ngươi thất bại trong việc đánh bại [event_target:behemoth_empire.GetName], chúng ta sẽ cố gắng không trách cứ các ngươi khi dải ngân hà sụp đổ."
 biocrisis.158.desc: "Các đế chế thường có xu hướng với tới những thứ vượt quá khả năng của mình. Đặc biệt, [event_target:behemoth_empire.GetName] đã chọn tham vọng thay vì sự thận trọng, và sự kiêu ngạo thay vì sự khôn ngoan.\n\nChúng nắm giữ những sức mạnh vượt quá tầm hiểu biết của mình, ép cơ thể chúng vào những hình thái mà chúng không thể kiểm soát. Và khi làm như vậy, chúng có khả năng đã định đoạt số phận của tất cả chúng ta."
 biocrisis.159.desc: "Dựa trên phân tích ban đầu về năng lực tác chiến của các ngươi, chúng ta không nghĩ rằng việc chiến đấu sẽ mang lại kết cục tốt đẹp cho các ngươi. Đánh giá về hạm đội của các ngươi cho thấy việc chạy trốn cũng sẽ vô ích tương tự. Tình thế hiện tại là không thể tránh khỏi.\n\nHai con quái thú đáng gờm đang dàn trận để quyết chiến giữa muôn vì sao. Nếu may mắn, các ngươi có thể sống sót lâu hơn chúng.\n\nNếu khôn ngoan, các ngươi sẽ rút ra bài học từ sự điên rồ này. Nhưng hãy nhớ lấy điều này: khi trận chiến kết thúc, dải ngân hà sẽ đổi thay. Liệu có ai trong chúng ta còn ở đây để chứng kiến điều đó hay không lại là một chuyện hoàn toàn khác.\n\n... Về mặt giả thuyết, nếu các ngươi cố gắng cứu thiên hà, việc tiêu diệt Cự Thú có thể chấm dứt cuộc săn lùng của Mầm Mống Hư Không."

 biocrisis.162.name: "Cản Đường"
 biocrisis.162.desc: "Một $NAME_Boss_Voidspawn$ đã tràn vào lãnh thổ của chúng ta. Thực thể cổ xưa này được đồn đại là bất tử và bất khả chiến bại. Đôi mắt của nó lấp lánh trí tuệ ngoại lai, và mỗi chuyển động của nó gợn lên sức nặng của muôn vàn kỷ nguyên.\n\n[species.GetEyeNamePlural] của chúng ta bị choáng ngợp bởi những tín hiệu phân mảnh. Sự hỗn loạn, méo mó và nỗi sợ hãi vũ trụ sâu thẳm nhất đang vang vọng bên trong chúng ta.\n\nĐối với chúng ta, việc chiến thắng một quái thú như vậy là không tưởng, nhưng chúng ta vẫn có thể ngăn chặn sự hoành hành của nó nếu có thể giúp nó giết chết con mồi. Tìm ra §YCự Thú§! và tiêu diệt nó là cơ hội sống sót duy nhất của chúng ta."
 biocrisis.162.a: "Tránh xa con quái vật bằng mọi giá!"

 biocrisis.175.name: "Kẻ Săn Mồi Bị Tiêu Diệt"
 biocrisis.175.desc: "Con quái vật khổng lồ đã bị tiêu diệt. Xác của hình hài phi trần thế của nó giờ đây trôi dạt trong khoảng không, dần dần tan biến vào hư vô.\n\nMột đế chế khác đã phô diễn hỏa lực và sự phối hợp mạnh mẽ ngoài sức tưởng tượng của chúng ta. Dải ngân hà không còn như những gì chúng ta từng biết. Cán cân quyền lực đã thay đổi, và vị thế của chúng ta trong đó cũng bị lung lay.\n\nNhững kẻ săn cự thú này rốt cuộc chiến đấu vì điều gì? Đây là một màn phô trương sức mạnh để gửi thông điệp tới tất cả những ai có ý định chống lại họ, hay là khúc dạo đầu cho một điều gì đó còn kinh hoàng hơn?"
 biocrisis.175.desc.kaiju: "Nếu thiên hà này chứa đựng những lực lượng có khả năng tiêu diệt $NAME_Boss_Voidspawn$, thì nó cũng có thể tiêu diệt chúng ta. Chúng ta không quá khác biệt so với con quái thú đã bị giết.\n\nChính hỏa lực đã xé toạc lớp thịt cổ xưa của nó một ngày nào đó có thể quay sang nhắm vào chúng ta. Thiên hà đã thay đổi, và chúng ta phải biến đổi để đương đầu với nó.\n\nSự sinh tồn của chúng ta sẽ đòi hỏi nhiều hơn là cơn thịnh nộ mù quáng. Khoảng không hư vô đã chứng kiến một kẻ săn mồi đỉnh cao gục ngã. Nó có thể sẽ chứng kiến thêm một kẻ nữa."
 biocrisis.175.a: "Chúng ta cần hành động cẩn trọng."

 biocrisis.180.name: "Kẻ Diệt Hư Không"
 biocrisis.180.desc: "Rốt cuộc, sự bất khả chiến bại theo lời đồn của Mầm Mống Hư Không cổ đại hóa ra chỉ là một huyền thoại khác, bị xua tan bởi sức mạnh từ các hạm đội của chúng ta. Với việc mối đe dọa cổ xưa này đã được giải quyết, dải ngân hà có thể thở phào nhẹ nhõm một lần nữa."
 biocrisis.180.desc.kaiju: "Dù $NAME_Boss_Voidspawn$ đã diệt vong, cơ thể của nó vẫn rộn ràng với nguồn năng lượng còn sót lại. Cổ xưa và hùng mạnh, đối với chúng ta, đó là một bữa tiệc bổ dưỡng chứa đầy tiềm năng thuần khiết.\n\nGân cốt và tủy của con thú sẽ bị nuốt chửng, bản chất ngoại lai của nó hòa quyện với bản chất của chính chúng ta. Sức mạnh của Mầm Mống Hư Không là vô cùng to lớn, và giờ đây, nó thuộc về chúng ta sử dụng."
 biocrisis.180.a: "Không quái thú nào có thể săn đuổi chúng ta."
 biocrisis.180.b: "Bữa tiệc chỉ mới bắt đầu."

 biocrisis.185.name: "Chỉ Có Thể Có Một"
 biocrisis.185.desc: "Băng qua khoảng không hư vô, một sự thật kinh hoàng hé lộ: chúng ta không hề đơn độc trong sự thăng hoa của mình. Một Cự Thú khác đã xuất hiện, kẻ bắt chước trương phềnh trong vẻ uy nghi dị hợm, tìm cách mô phỏng sự hoàn hảo của chúng ta. Điều này không thể chấp nhận được.\n\nKhông có chỗ cho một kẻ săn mồi đỉnh cao khác. Không có hòa bình nào được lập ra. Chỉ có máu thịt để nuốt chửng. Cuộc săn bắt đầu."
 biocrisis.185.a: "Chúng ta sẽ ăn tươi nuốt sống trái tim của nó!"

 biocrisis.187.name: "Cảnh Báo Cự Thú Cấp IV"
 biocrisis.187.desc: "Có điều gì đó đang cựa quậy nơi sâu thẳm của khoảng không hư vô.\n\nBăng qua các vì sao, một đế chế đã bắt đầu giai đoạn cuối cùng của sự biến đổi kỳ quái của nó, nuôi dưỡng những Cự Thú quái vật, không phải như vũ khí đơn thuần, mà như những vật chứa. Chúng không tìm kiếm sự thống trị. Chúng tìm kiếm sự hợp nhất. Một sự hòa trộn giữa tâm trí và máu thịt, giữa đế chế và nỗi kinh hoàng.\n\nNếu chúng thành công, chúng sẽ không còn là một dân tộc nữa mà thay vào đó trở thành một cơn đói khát duy nhất, khổng lồ.\n\nĐiều này không thể được phép xảy ra. Nếu muốn ngăn chặn chúng, điều đó phải được thực hiện ngay bây giờ, trước khi ngưỡng cửa cuối cùng bị vượt qua."
 biocrisis.187.a: "Săn lùng quái thú!"

 biocrisis.190.name: "Hình Thái Hư Không Đỉnh Cao"
 biocrisis.190.desc: "Những chướng ngại vật cuối cùng đã bị quét sạch. Những kẻ giả mạo, những kẻ thách thức, sự vùng vẫy tuyệt vọng của những sinh vật thấp kém: tất cả đều đã câm lặng. Chính các vì sao cũng phải run rẩy, vì chúng ta đang đứng trên bờ vực của sự chuyển hóa thực sự.\n\nChúng ta không còn bị ràng buộc bởi những hình hài mỏng manh của tổ tiên. Các hành tinh là những chiếc lồng. Các đế chế chỉ là thoáng qua. Ảo tưởng về tính cá nhân sẽ sớm hòa tan vào sự thống nhất rộng lớn, hoàn hảo của Cự Thú. Tâm trí và nỗi kinh hoàng, trí tuệ và cơn đói, là một.\n\nQuá trình chuyển giao gần như đã kết thúc. Khi nó hoàn tất, chúng ta sẽ không còn đơn thuần tồn tại.\n\nChúng ta sẽ phồn vinh tột bậc."
 biocrisis.190.a: "HOÀN TẤT QUÁ TRÌNH CHUYỂN GIAO!"
 biocrisis.190.tt: "Chúng ta sẽ thắng trò chơi trong 30 ngày"
 biocrisis.190.b: "Khoan đã, chúng ta vẫn chưa sẵn sàng."
 biocrisis.190.b.tt: "Tiếp tục chơi với đế chế hiện tại của bạn."

 BEHEMOTH_TRANSFERENCE_PROJECT: "Hoàn Tất Quá Trình Chuyển Giao"
 BEHEMOTH_TRANSFERENCE_PROJECT_DESC: "Chúng ta đã giao tiếp với Quái Thú đủ lâu. Sự chuyển giao đã sẵn sàng, chỉ chờ mệnh lệnh của chúng ta. Chúng ta đang đứng trước đỉnh cao thăng hoa, sẵn sàng từ bỏ đống tro tàn đáng thương của ách thống trị trói buộc trên hành tinh để vươn lên vượt qua xiềng xích của máu thịt và trọng lực."

 biocrisis.191.name: "Chiến Thắng Của Cự Thú"
 biocrisis.191.desc: "Quá trình hợp nhất đã hoàn tất!\n\nChúng ta không còn là những gì chúng ta từng là, cũng không còn bị trói buộc bởi những giới hạn của các sinh vật thấp kém. Chúng ta là tư tưởng và cơn đói đan xen, một ý chí rộng lớn trải dài khắp khoảng không hư vô.\n\nThiên hà nằm dưới chân chúng ta, mong manh và phù du. Nhưng chúng ta đã vượt ra ngoài sự thống trị đơn thuần. Chúng ta tự do. Tự do ở lại. Tự do rời đi. Tự do săn mồi.\n\nChúng ta sẽ làm gì với sự vĩnh cửu mới tìm thấy của mình?"
 biocrisis.191.a: "Nán lại trong thiên hà này... vào lúc này."
 biocrisis.191.a.tt: "Các Cự Thú sẽ vẫn tồn tại như những sinh vật hoang dã và sẽ không còn có thể chơi được nữa."
 biocrisis.191.b: "Rời đi. Khoảng không hư vô đang vẫy gọi chúng ta tiến bước."
 biocrisis.191.b.tt: "Đế Chế Cự Thú sẽ biến mất khỏi thiên hà và sẽ không còn có thể chơi được nữa."
 biocrisis.191.c: "Những kẻ được gọi là Thợ Săn sẽ phải học lấy nỗi sợ hãi thực sự."

 biocrisis.192.name: "Nỗi Kinh Hoàng Không Thể Ngăn Cản"
 biocrisis.192.desc: "Mọi chuyện đã kết thúc. [behemoth_winner.GetName] đã thăng hoa vượt ra ngoài máu thịt, vượt ra ngoài đế chế, vượt ra ngoài bất cứ thứ gì có thể gọi là nền văn minh. Nó không còn là một quốc gia nữa. Nó là một lực lượng tự nhiên.\n\nCác thế giới sụp đổ trước mặt nó. Các hạm đội bốc cháy. Nơi trú ẩn cuối cùng của những kẻ từng hùng mạnh tan tác như tàn tro trong hư vô. Không có ngoại giao, không có lời cầu xin, không có trận chiến cuối cùng.\n\nChúng ta không chiến đấu để sinh tồn. Chúng ta chỉ đang trì hoãn việc bị tiêu thụ. Hồi kết đã đến."
 biocrisis.192.tt: "[behemoth_winner.GetName] sắp giành chiến thắng trong trò chơi"

 biocrisis.196.name: "Bị Nuốt Chửng Hoàn Toàn"
 biocrisis.196.desc: "Nhiều năm trước, Cự Thú và đồng loại của nó đã rời bỏ thiên hà của chúng ta để tiến vào khoảng không giữa các thiên hà, để lại sự bình yên giả tạo sau lưng. Chúng ta từng tin rằng mối đe dọa đã qua đi.\n\nChúng ta đã lầm.\n\nBằng cách nào đó, con quái thú đã quay trở lại. Nhưng nó không còn là sinh vật từng rời đi nữa. Nó đã lớn hơn, cổ xưa hơn và vô cùng đói khát. Toàn bộ các hệ sao đã bị quét sạch trước khi các cảm biến của chúng ta kịp ghi nhận dấu hiệu năng lượng của nó. Nó không tấn công; nó chỉ đơn giản là tiêu thụ.\n\nHành tinh này, hạm đội này, nền văn minh này — tất cả chỉ là một bữa ăn nhẹ cho kẻ lang thang giữa các thiên hà. Màn đêm vĩnh cửu đang khép lại."
 biocrisis.196.a: "Không có nơi nào để trốn."
 UNSETTLING: "Đáng lo ngại."

 biocrisis.197.name: "Những Thợ Săn Trở Thành Con Mồi"
 biocrisis.197.desc: "Các báo cáo thăm dò tầm xa từ rìa thiên hà tiết lộ một điều gì đó khó tin: hạm đội Tiền Tiêu Prethoryn, những kẻ hủy diệt các thế giới, đã chạm trán Cự Thú.\n\nĐó không phải là một trận chiến. Đó là một cuộc tàn sát. Cự Thú đã xé toạc bầy đàn Swarm với sự dễ dàng đáng sợ, nuốt chửng các tàu mẹ sinh học của chúng như thể chúng chỉ là sinh vật phù du. Những kẻ từng tự xưng là Thợ Săn giờ đây đang bỏ chạy trong hoảng loạn tuyệt đối trước một thứ gì đó thực sự là đỉnh cao của sự kinh hoàng sinh học.\n\nCó vẻ như thiên hà này đã tìm thấy vị thần bảo hộ mới... hoặc kẻ hủy diệt tối thượng mới."
 biocrisis.197.a: "Có lẽ tốt nhất là không nên nghĩ về điều đó."
 biocrisis.197.b: "Những con Prethoryn bị bắt của chúng ta đang trở nên bồn chồn."

 biocrisis.265.name: "Hồi Chuông Thống Khổ"
 biocrisis.265.desc: "Nỗi đau đớn tột cùng cuối cùng của Cự Thú hóa ra là không thể chịu đựng nổi. Quá nhiều phần của chúng ta nằm bên trong sinh vật này, và khi những tiếng vang của ý thức nó mờ dần, chúng ta cũng tàn lụi theo."
 biocrisis.265.a: "!! - ... "

 biocrisis.520.name: "Titan Rỗng Ruột"
 biocrisis.520.desc: "Cự Thú đã chết.\n\nHình hài khổng lồ của nó trôi dạt vô hồn trong khoảng không hư vô, một tượng đài cho cả chiến thắng của chúng ta lẫn giới hạn của sự hiểu biết. Các [Root.GetScientistPluralCapital] đổ xô phân tích tàn tích của nó, háo hức cướp bóc những bí mật trong tâm trí không tưởng của nó. Tuy nhiên, mọi nỗ lực hồi sinh nó — bằng máy móc, gọi hồn, hay thậm chí cả những lời cầu nguyện tuyệt vọng nhất — đều thất bại.\n\nLý do giờ đây đã trở nên rõ ràng trong đau đớn: Não của Cự Thú không chỉ đơn thuần là một mạng lưới tế bào mà là một mạng lưới các chất siêu dẫn hữu cơ, đan xen theo những cách mà không trí thông minh nào từng biết — nhân tạo, sinh học hay bí thuật — có thể tái tạo. Khi chết, cấu trúc thần kinh của nó sụp đổ như một mạch điện bị vỡ nát không thể sửa chữa. Không năng lượng, không ý chí, không thế lực nào có thể lắp ráp lại những gì đã mất.\n\nTâm trí vĩ đại nhất trong thiên hà giờ đây, và mãi mãi, câm lặng."
 biocrisis.520.a: "Không còn lại gì."
 biocrisis.520.b: "Ngay cả các vị thần cũng có thể chết."

 BEHEMOTH_MUTATION_PROJECT: "$menp_behemoth_mutation_research$"
 BEHEMOTH_MUTATION_PROJECT_DESC: "Những bước đột phá gần đây của chúng ta về mặt di truyền cự thú về mặt lý thuyết có thể được mở rộng để tiếp tục làm đột biến các tạo vật của chúng ta. Sự ổn định di truyền là một mối lo ngại, nhưng với thời gian và tài nguyên, chúng ta tự tin rằng mình có thể mang lại những cải tiến sinh học sâu hơn."

 BEHEMOTH_FATE_PROJECT: "Số Phận Của Cự Thú"
 BEHEMOTH_FATE_PROJECT_DESC: "Sau khi rời khỏi thiên hà của chúng ta, Cự Thú trôi dạt vào khoảng không hư vô, rồi biến mất. Chúng ta có thể cố gắng làm sáng tỏ bí ẩn, nhưng ở khoảng cách này, chỉ còn lại những phương pháp phi truyền thống. Các câu trả lời có khả năng cũng mờ mịt như chính khoảng không hư vô."

 behemoth_mutation_a: "$menp_behemoth_mutation_research$: Hung Hãn"
 behemoth_mutation_a_tt: "Cự Thú $MOD_SHIP_FIRE_RATE_MULT$: §G+$@behemoth_mutation_a_fire_rate_mult|0%$§!\nCự Thú $MOD_SHIP_ARMOR_MULT$: §R$@behemoth_mutation_a_armor_mult|0%$§!\nCự Thú $MOD_SHIP_SPEED_MULT$: §R$@behemoth_mutation_a_speed_mult|0%$§!"
 behemoth_mutation_a_desc: "Các cơ bắp quá khổ tạo nên những đòn tấn công tàn khốc."
 behemoth_mutation_b: "$menp_behemoth_mutation_research$: Tiết Chế"
 behemoth_mutation_b_desc: "Chủng di truyền dinh dưỡng phóng xạ được tiêm vào các dạng sống trong không gian của chúng ta giúp giảm đáng kể nhu cầu nuôi dưỡng của chúng."
 behemoth_mutation_c: "$menp_behemoth_mutation_research$: Linh Hoạt"
 behemoth_mutation_c_tt: "Cự Thú $MOD_SHIP_SPEED_MULT$: §G+$@behemoth_mutation_c_speed_mult|0%$§!\nCự Thú $MOD_SHIP_EVASION_MULT$: §G+$@behemoth_mutation_c_evasion_mult|0%$§!"
 behemoth_mutation_c_desc: "Một bộ tuyến hạ không gian mạnh mẽ hơn giúp cự thú của chúng ta nhanh nhẹn hơn."
 behemoth_mutation_bio: "$menp_behemoth_mutation_research$: Chuẩn Xác"
 behemoth_mutation_bio_tt: "Cự Thú $MOD_SHIP_WEAPON_RANGE_MULT$: §G+$@behemoth_mutation_bio_weapon_range_mult|0%$§!\nCự Thú $MOD_SHIP_ACCURACY_MULT$: §G+$@behemoth_mutation_bio_accuracy_mult|0%$§!"
 behemoth_mutation_bio_desc: "Sự thích nghi đa mắt này cho phép bắn các phát đạn có độ chính xác cao ở những khoảng cách đáng kinh ngạc."
 behemoth_mutation_synth: "$menp_behemoth_mutation_research$: Kiên Cường"
 behemoth_mutation_synth_tt: "Cự Thú $MOD_SHIP_ARMOR_MULT$: §G+$@behemoth_mutation_synth_armor_mult|0%$§!\nCự Thú $MOD_SHIP_ARMOR_REGEN_ADD_PERC$: §G+$@behemoth_mutation_synth_armor_regen_add_perc|0%$§!"
 behemoth_mutation_synth_desc: "Sự hòa trộn giữa hợp kim và chitin tạo nên một lớp mai nhiều tầng giúp bảo vệ các cơ quan quan trọng."
 behemoth_mutation_corpo: "Tiếp Thị Cự Thú"
 behemoth_mutation_corpo_tt: "Thương Mại Hàng Tháng: §G+$@behemoth_mutation_corpo_trade_produces_mult|0%$§! cho mỗi Cự Thú"
 behemoth_mutation_corpo_desc: "Các cổ đông của chúng ta từng có chút bận tâm với Dự Án Cự Thú, nhưng việc tăng cổ tức đã nhanh chóng thuyết phục được họ."
 behemoth_mutation_psi: "$menp_behemoth_mutation_research$: Rào Chắn"
 behemoth_mutation_psi_tt: "Cự Thú $MOD_SHIP_SHIELD_REGEN_ADD_PERC$: §G+$@behemoth_mutation_psi_shield_regen_add_perc|0%$§! mỗi $pop_group_unit$ £job_telepath£ $job_telepath_plural$ hoặc $job_transference_volunteer$\nCự Thú $MOD_SHIP_SHIELD_HARDENING_ADD$: §G+$@behemoth_mutation_psi_shield_hardening_add|0%$§! mỗi $pop_group_unit$ £job_telepath£ $job_telepath_plural$ hoặc $job_transference_volunteer$\nSố lượng 100 £job_telepath£ $job_telepath_plural$ và $job_transference_volunteer$ Đang Làm Việc Hiện Tại: §Y[GetNumTelepathsAndTransference]§!"
 behemoth_mutation_psi_desc: "Mặc dù cự thú không kết nối với Màn Che (Shroud), chúng ta đã nuôi dưỡng chúng đủ nhạy cảm với các nhà thần giao cách cảm của chúng ta để chúng có thể sử dụng các rào chắn tâm linh phòng thủ."
 behemoth_mutation_psi_2: "$menp_behemoth_mutation_research$: Tâm Linh"
 behemoth_mutation_psi_2_desc: "Hỡi những Quái Thú, hãy nhận lấy sức mạnh của chúng ta!"
 behemoth_mutation_cyber: "$menp_behemoth_mutation_research$: Điều Khiển Học"
 behemoth_mutation_cyber_desc: "Để khai thác sức mạnh giận dữ của các cự thú, chúng ta sẽ phát triển phần cứng điều khiển học tiên tiến nhất từng tồn tại."
 behemoth_cyber_rage: "$BLANK_STRING$"

 edict_behemoth_nanite_augmentation: "Cường Hóa Cự Thú: Nanite"
 edict_behemoth_nanite_augmentation_desc: "Lớp vỏ cự thú được truyền nanite có thể tái tạo ngay cả những tổn thương tồi tệ nhất trong thời gian kỷ lục."
 behemoth_nanite_augmentation_tt: "Cự Thú $MOD_SHIP_ARMOR_REGEN_ADD_PERC$: §G+$@behemoth_edict_armor_regen_add_perc|0%$§!"
 edict_behemoth_living_metal_augmentation: "Cường Hóa Cự Thú: Kim Loại Sống"
 edict_behemoth_living_metal_augmentation_desc: "Xếp các lớp kim loại sống xen kẽ giữa các tầng chitin tạo ra lớp giáp phản ứng với đặc tính triệt tiêu nhiệt tăng cường."
 behemoth_living_metal_augmentation_tt: "Cự Thú $MOD_SHIP_ARMOR_HARDENING_ADD$: §G+$@behemoth_edict_armor_hardening_add|0%$§!"
 edict_behemoth_alloys_augmentation: "Cường Hóa Cự Thú: Hợp Kim"
 edict_behemoth_alloys_augmentation_desc: "Bắt vít các tấm hợp kim lên mai tuy thô sơ nhưng hiệu quả."
 behemoth_alloys_augmentation_tt: "Cự Thú $MOD_SHIP_ARMOR_MULT$: §G+$@behemoth_edict_armor_mult|0%$§!"

 concept_edict_behemoth_nanite_augmentation: "$edict_behemoth_nanite_augmentation$"
 concept_edict_behemoth_living_metal_augmentation: "$edict_behemoth_living_metal_augmentation$"
 concept_edict_behemoth_alloys_augmentation: "$edict_behemoth_alloys_augmentation$"

 biocrisis.280.name: "$menp_behemoth_mutation_research$"
 biocrisis.280.desc: "Chúng ta đã phát triển một số công thức gây đột biến được thiết kế để cường hóa các Cự Thú của mình, mỗi công thức được thiết kế để mở khóa những sức mạnh và sự thích nghi mới. Tuy nhiên, sinh lý khổng lồ của chúng chỉ có thể chịu được một lần tiêm duy nhất — bất kỳ nỗ lực nào nhằm kết hợp nhiều công thức đều dẫn đến sự suy sụp tế bào thảm khốc. Ranh giới giữa tiến hóa và hủy diệt là mỏng manh như lưỡi dao cạo, và chúng ta phải lựa chọn các cải tiến của mình một cách khôn ngoan."
 biocrisis.280.a: "Hãy làm cho chúng hung dữ hơn!"
 biocrisis.280.b: "Làm cho chúng... bớt đói hơn."
 biocrisis.280.c: "Làm cho chúng nhanh hơn!"
 biocrisis.280.psi: "Sức mạnh của Màn Che sẽ duy trì sự sống cho chúng."
 biocrisis.280.bio: "Làm cho chúng chết chóc hơn!"
 biocrisis.280.cyber: "Dẫn kênh cơn thịnh nộ của chúng."
 biocrisis.280.cyber.tt: "Các Cự Thú của chúng ta nhận được §G25%§! cơ hội chống lại cơn cuồng nộ của chúng.\nKhi đang cuồng nộ, chúng nhận được §G+$@behemoth_cyber_rage_fire_rate_mult|0%$§! Tốc Độ Bắn, §G+$@behemoth_cyber_rage_shield_penetration_add|0%$§! Xuyên Giáp và §G+$@behemoth_cyber_rage_armor_penetration_add|0%$§! Xuyên Khiên"
 biocrisis.280.synth: "Lớp giáp của chúng sẽ không thể xuyên thủng."
 biocrisis.280.corp: "Kệ xác chuyện đó đi. Hãy làm thú nhồi bông để bán!"
 biocrisis.280.machine: "Hòa quyện máu thịt với Thép."
 biocrisis.280.machine_tt: "Mở khóa ba Sắc Lệnh §YCường Hóa Cự Thú§!\n$t$['concept_edict_behemoth_nanite_augmentation']\n$t$['concept_edict_behemoth_living_metal_augmentation']\n$t$['concept_edict_behemoth_alloys_augmentation']"

 # Crisis Objectives

 crisobj_build_bioships_name: "Xây Dựng Tàu Sinh Học"
 crisobj_build_bioships_desc: "Sau khi làm chủ việc nuôi cấy tàu sinh học, giờ đây chúng ta tinh chỉnh và mở rộng các quy trình này. Sự cộng sinh đang diễn ra này mang lại những đặc quyền ngày càng lớn, nâng cao sức mạnh hạm đội của chúng ta và củng cố quyền thống trị của chúng ta trên khắp vũ trụ sống."
 crisobj_breed_fauna_name: "Nhân Giống Động Vật Không Gian"
 crisobj_breed_fauna_desc: "Sau khi làm chủ việc nhân giống Động Vật Không Gian, giờ đây chúng ta tinh chỉnh và mở rộng các quy trình này. Sự cộng sinh đang diễn ra này mang lại những lợi ích ngày càng lớn, nâng cao sức mạnh hạm đội của chúng ta và củng cố quyền thống trị của chúng ta trên khắp vũ trụ sống."
 crisobj_kill_bioships_name: "Tiêu Diệt Tàu Sinh Học"
 crisobj_kill_bioships_desc: "Các tàu sinh học của kẻ thù can thiệp vào ưu thế sinh học của chúng ta. Chúng ta phải hành động kiên quyết, tiêu diệt chúng để vô hiệu hóa mối đe dọa đối với uy quyền tối cao của chúng ta."
 crisobj_kill_space_fauna_name: "Giết Động Vật Không Gian"
 crisobj_kill_space_fauna_desc: "Động vật không gian thù địch đe dọa sự thống trị sinh học của chúng ta. Chúng ta phải hành động dứt khoát, tiêu diệt chúng để vô hiệu hóa mối đe dọa đối với uy quyền tối cao của chúng ta."
 crisobj_cap_fauna_name: "Bắt Giữ Động Vật Không Gian"
 crisobj_cap_fauna_desc: "Động vật không gian chưa thuần hóa hoạt động như những phần tử bất hảo, tạo ra một thách thức độc đáo. Chúng ta phải hành động dứt khoát, bắt giữ các thực thể này để khai thác tiềm năng của chúng nhằm đảm bảo quyền tối cao của chúng ta."
 crisobj_build_behemoth_egg_name: "Nuôi Cấy Trứng Cự Thú"
 crisobj_build_behemoth_egg_desc: "Nuôi cấy các hợp tử siêu kích cỡ là một bước quan trọng trong việc nâng cao vị thế của chúng ta vượt ra ngoài những điều tầm thường của sự sống gắn liền với hành tinh."
 crisobj_birth_behemoth_name: "Khai Sinh Cự Thú"
 crisobj_birth_behemoth_desc: "Trong sự rộng lớn của không gian, các dạng sống khổng lồ đang thành hình dưới sự dẫn dắt cẩn trọng của chúng ta. Những cự thú này, sinh ra từ tham vọng và sự thuần thục của chúng ta, sẽ trỗi dậy như những lực lượng khổng lồ, tái định hình cán cân quyền lực theo hướng có lợi cho chúng ta."
 crisobj_behemoth_rage_name: "Cự Thú Nổi Giận"
 crisobj_behemoth_rage_desc: "Được thả xích giữa muôn vì sao, các Cự Thú của chúng ta tàn phá với cơn thịnh nộ nguyên thủy, để lại sự tàn phá trên đường đi của chúng. Cơn thịnh nộ không kiểm soát của chúng là minh chứng cho sức mạnh của chúng ta, một lực lượng tự nhiên chỉ tuân theo ý chí của chúng ta, khi chúng ta chọn sử dụng nó."

 behemoth_mutation_reward: "Chọn một Đột Biến"
 biocrisis.210.desc.base: "Có điều gì đó đang cuộn trào. Cơn đói bên trong chúng ta không phải là vô tri giác, mà mang tính thích nghi. Những chồi phát triển mới trườn vào thực tại, rung lên đầy tiềm năng.\n\n" # Introduction
 biocrisis.210.desc: "$biocrisis.210.desc.base$Những quả trứng của chúng ta thực sự là nguồn sống của dòng dõi chúng ta. Chúng phải được bảo vệ và chăm sóc bằng mọi giá. Chúng ta hãy định hướng sự tiến hóa của mình để mang lại lợi ích cho những con non tương lai." # Egg
 biocrisis.210.a: "Đẩy nhanh sự phát triển của trứng."
 biocrisis.210.a.tt: "$behemoth_fast_egg_tt$\n\n§HMở khóa Chính Sách§!: $behemoth_egg_policy$\n$policy_behemoth_egg_policy_desc$"
 biocrisis.210.b: "Tiếp thêm sức mạnh cho đàn con non."
 biocrisis.210.b.tt: "$behemoth_slow_egg_tt$\n\n§HMở khóa Chính Sách§!: $behemoth_egg_policy$\n$policy_behemoth_egg_policy_desc$"
 biocrisis.210.c: "Tăng cường độ cứng của vỏ trứng."
 biocrisis.210.c.tt: "$behemoth_strong_egg_tt$"

 biocrisis.215.desc: "$biocrisis.210.desc.base$Bơi lội trên những ngọn sóng mặt trời và băng qua khoảng không hư vô là kỹ năng chỉ một số ít loài du hành vũ trụ sở hữu. Sức mạnh chiến thuật của chúng ta nằm ở cơn thịnh nộ và uy lực của mình, nhưng nếu khả năng cơ động của chúng ta có thể được cải thiện thì sao?" # Mobility
 biocrisis.215.a: "Chúng ta hãy băng qua khoảng không hư vô."
 biocrisis.215.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được một §Y$BIO_JUMP_DRIVE_1$§!."
 biocrisis.215.b: "Bắn nhanh, di chuyển nhanh hơn."
 biocrisis.215.b.tt: "$behemoth_turbo_tt$"
 biocrisis.215.c: "Ưu tiên phản xạ."
 biocrisis.215.c.tt: "$behemoth_reflexes_tt$"
 biocrisis.215.d: "Trở thành thợ săn trong bóng tối."
 biocrisis.215.d.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@cloaking_high_strength|0+$ $MOD_SHIP_CLOAKING_STRENGTH_ADD$."

 biocrisis.220.desc: "$biocrisis.210.desc.base$Củng cố hệ thống phòng thủ sinh học của chúng ta sẽ cho phép chúng ta chịu được hỏa lực kéo dài từ kẻ thù, mà không phải chịu những vết thương phiền toái."
 biocrisis.220.a: "Chúng ta có thể sở hữu làn da dày hơn."
 biocrisis.220.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_1_hull_add|0+*$ $HITPOINTS$."
 biocrisis.220.b: "Giáp chiến đấu của chúng ta nên cứng cáp hơn."
 biocrisis.220.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_1_armor_add|0+*$ $MOD_SHIP_ARMOR_ADD$ và $@behemoth_1_armor_hardening_add|%0+$ $MOD_SHIP_ARMOR_HARDENING_ADD$."
 biocrisis.220.c: "Không ai có thể chạm vào chúng ta nếu chúng ta nâng cấp khiên chắn."
 biocrisis.220.c.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_1_shield_add|0*+$ $MOD_SHIP_SHIELD_ADD$, $@behemoth_1_shield_regen_add_perc|%1+$ $MOD_SHIP_SHIELD_REGEN_ADD_PERC$ và $@behemoth_1_shield_hardening_add|%0+$ $MOD_SHIP_SHIELD_HARDENING_ADD$."

 biocrisis.225.desc: "$biocrisis.210.desc.base$Giao chiến với kẻ thù là phương tiện để chúng ta chinh phục. Chúng ta có cơ hội nâng cao năng lực chiến đấu của mình."
 biocrisis.225.a: "Với đủ năng lượng, khiên chắn có thể bị phớt lờ."
 biocrisis.225.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_shield_pen_add|%0+$ $MOD_SHIP_SHIELD_PENETRATION_ADD$ và £exotic_gases£ $@behemoth_shield_pen_upkeep|0*-$ Chi Phí Duy Trì Hàng Tháng."
 biocrisis.225.b: "Đạn pháo của chúng ta sẽ xuyên thủng lớp giáp dày nhất."
 biocrisis.225.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_armor_pen_add|%0+$ $MOD_SHIP_ARMOR_PENETRATION_ADD$ và £volatile_motes£ $@behemoth_armor_pen_upkeep|0*-$ Chi Phí Duy Trì Hàng Tháng."
 biocrisis.225.c: "Lũ ruồi muỗi sẽ không làm phiền chúng ta được."
 biocrisis.225.c.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_tracking_add|0*+$ $MOD_SHIP_TRACKING_ADD$, $@behemoth_point_defense_weapon_fire_rate_mult|%0+$ $mod_weapon_type_point_defense_weapon_fire_rate_mult$ và £rare_crystals£ $@behemoth_tracking_upkeep|0*-$ Chi Phí Duy Trì Hàng Tháng."

 biocrisis.230.desc: "$biocrisis.210.desc.base$Trong sức nóng của trận chiến, mỗi giây đều đáng giá. Sát thương chúng ta gây ra là một nghi thức tử thần, điều cuối cùng kẻ thù của chúng ta được trải nghiệm trước khi mạng sống nhỏ bé của chúng bị dập tắt."
 biocrisis.230.a: "Giữ chặt chúng tại chỗ. Chúng sẽ phải nếm trải sức mạnh của chúng ta."
 biocrisis.230.a.tt: "$behemoth_drain_tt$"
 biocrisis.230.b: "Tiêu diệt chúng từ xa."
 biocrisis.230.b.tt: "$behemoth_spike_tt$"
 biocrisis.230.c: "Phân rã chúng theo chiến thuật."
 biocrisis.230.c.tt: "$behemoth_burst_tt$"

 biocrisis.235.desc: "$biocrisis.210.desc.base$Là một thế lực kiên cường trong dải ngân hà, chúng ta sẽ được hưởng lợi từ việc gia tăng sức bền." # Tanky 2
 biocrisis.235.a: "Tái tạo mô mang lại cho chúng ta sự trường thọ."
 biocrisis.235.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_2_hull_regen_add|%1+$ $MOD_SHIP_HULL_REGEN_ADD_PERC$."
 biocrisis.235.b: "Chúng ta sẽ không bao giờ đầu hàng."
 biocrisis.235.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_2_damage_reduction_mult|%1+$ $MOD_SHIP_DAMAGE_REDUCTION_MULT$."
 biocrisis.235.c: "Sức mạnh vũ phu là con đường duy nhất."
 biocrisis.235.c.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_2_damage_reduction_static|1+$ $MOD_SHIP_DAMAGE_REDUCTION_ADD$, $@behemoth_2_armor_hardening_add|%0+$ $MOD_SHIP_ARMOR_HARDENING_ADD$ và $@behemoth_2_shield_hardening_add|%0+$ $MOD_SHIP_SHIELD_HARDENING_ADD$."

 biocrisis.240.desc: "$biocrisis.210.desc.base$Tràn ngập cùng đàn con của mình, chúng ta sẽ tàn phá các hành tinh và lột sạch mọi thứ ăn được trong các hệ sao, mà hầu hết mọi thứ đều ăn được. Chúng ta phải tự hỏi, làm thế nào tốt nhất để hỗ trợ đàn con của mình?" # Support Ability
 biocrisis.240.a: "Chúng ta sẽ cho phép chúng di chuyển nhanh."
 biocrisis.240.a.tt: "$behemoth_buff_tt$"
 biocrisis.240.b: "Chúng sẽ tập hợp dưới ánh quang của chúng ta." # Summon a fleet
 biocrisis.240.b.tt: "$behemoth_summon_tt$"
 biocrisis.240.c: "Chúng ta sẽ giúp chúng trở nên hùng mạnh." # Regen friendly bioships
 biocrisis.240.c.tt: "$behemoth_healing_tt$"

 biocrisis.245.desc: "$biocrisis.210.desc.base$Sức mạnh bất khuất của chúng ta phải được phô diễn cho tất cả những ai sinh sống trong dải ngân hà này thấy. Chúng ta sẽ nâng cao kỹ năng chiến đấu của mình với bước tiếp theo trong quá trình tiến hóa."
 biocrisis.245.a: "Chúng sẽ không thể cản phá cuộc tấn công của chúng ta."
 biocrisis.245.a.tt: "Khi bước vào giao tranh, §Y$behemoth_04$§! của chúng ta nhận được §Y$behemoth_frenzy_modifier$§! trong £time£ §Y$@behemoth_frenzy_duration|0$ Ngày§!.\n\n§Y$behemoth_frenzy_modifier$§!:$behemoth_frenzy_modifier_tt$"
 biocrisis.245.b: "Chúng ta sẽ gây ra tổn thất lớn cho chúng."
 biocrisis.245.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được \n$t$$MOD_SHIP_FIRE_RATE_MULT$: §G+$@behemoth_tempered_fire_rate_mult|0%$§! \n$t$$MOD_SHIP_SPEED_MULT$: §G+$@behemoth_tempered_speed_mult|0%$§! \n$t$$MOD_SHIP_HULL_REGEN_ADD_PERC$: $@behemoth_tempered_hull_regen_add_perc|%1+$ \n$t$$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$: $@behemoth_tempered_armor_regen_add_static|0+$"
 biocrisis.245.c: "Các đòn tấn công của chúng ta sẽ nhanh và chính xác."
 biocrisis.245.c.tt: "Khi bước vào giao tranh, §Y$behemoth_04$§! của chúng ta ban tặng §Y$behemoth_inspiration_modifier$§! trong £time£ §Y$@behemoth_inspiration_duration|0$ Ngày§! cho Mọi Tàu Sinh Học Thân Thiện trong Hệ Sao này.\n\n§Y$behemoth_inspiration_modifier$§!:$behemoth_inspiration_modifier_tt$"

 biocrisis.250.name: "Kiểm Soát Trực Tiếp"
 biocrisis.250.desc: "$biocrisis.210.desc.base$Chúng ta có thể giải phóng các đợt mảnh vỡ lạnh lẽo và các đợt mảnh vỡ rực lửa hủy diệt, đủ sức xé toạc chính thực tại thành từng mảnh. Tóm lại, chúng ta sử dụng một thứ vũ khí sẽ thiêu rụi chính bản thân dải ngân hà.\n\nNhưng sự thống trị của chúng ta không kết thúc bằng sự hủy diệt. Chúng ta cảm nhận được từng đường gân của Cự Thú, từng nhịp đập của nó, từng cơ bắp khổng lồ uốn cong theo ý chí của chúng ta như thể đó là da thịt của chính chúng ta. Chỉ với một ý nghĩ, chúng ta điều khiển thân hình to lớn của nó: các chi của nó, cái miệng há hốc của nó, trái tim khổng lồ sinh ra từ khoảng không hư vô đang đập theo ý đồ của chúng ta. Đây không chỉ là một vật chứa đơn thuần; giờ đây chính chúng ta là Cự Thú." # Behemoth Superweapon
 biocrisis.250.a: "Không gian giờ đây thuộc về chúng ta."
