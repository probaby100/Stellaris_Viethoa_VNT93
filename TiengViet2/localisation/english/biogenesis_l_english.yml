 SHIP_BEHEMOTH_RAGE: "Tuyến Hung Hãn"
 SHIP_BEHEMOTH_RAGE_DESC: "Behemoth là những gã khổng lồ ngoan cường, hoang dã, và chúng không chịu khuất phục trước sự kiểm soát quá lâu. Sớm muộn gì, cơn thịnh nộ âm ỉ bên trong cũng sẽ bùng cháy, một cơn giông bão vũ trụ không thể kìm hãm. Có lẽ sự thông tuệ không nằm ở việc chờ đợi, mà là tự tay chúng ta châm ngòi, giải phóng cơn bão vào thời khắc ta lựa chọn, thay vì để nó chọn chúng ta."
 behemoth_rage_ship_button: "§HKích Cuồng§!\n\nThả rông §YBehemoth§!.\nBehemoth cuồng loạn sẽ lao thẳng về phía §YThuộc Địa§! hoặc §YTrứng Behemoth§! gần nhất và cố gắng tiêu diệt nó.\nCơn cuồng nộ thông thường kéo dài §Y180 ngày§!, nhưng nhiều yếu tố có thể ảnh hưởng đến thời gian này.$TABBED_NEW_LINE$- Khi đang trong §RGiao Tranh§! hoặc §ROanh Kích§!, Behemoth sẽ không bình tĩnh lại.$TABBED_NEW_LINE$- Nếu chúng ta §GĐánh Bại§! Behemoth cuồng loạn trong chiến đấu, nó sẽ quay trở lại dưới quyền kiểm soát của ta."
 behemoth_rage_activity_key: "Cuồng Nộ"
 behemoth_rage_menu_title: "Kích Cuồng"
 behemoth_rage_progress_activity_key: "Cuồng Nộ"

 MESSAGE_BEHEMOTH_RAGE_TITLE: "Behemoth Nổi Cuồng"
 MESSAGE_BEHEMOTH_RAGE_DESC: "Một Behemoth đã rơi vào cơn thịnh nộ điên cuồng! Chúng ta hy vọng nó sẽ bình tĩnh lại sau vài tháng."

 MESSAGE_BEHEMOTH_CALM_TITLE: "Cơn Cuồng Nộ Lắng Dịu"
 MESSAGE_BEHEMOTH_CALM_DESC: "Behemoth đã bình tĩnh trở lại và tuân theo quyền kiểm soát của chúng ta."

 SHIP_BEHEMOTH_COCOON: "Kén Biến Thái Hoàn Toàn"
 SHIP_BEHEMOTH_COCOON_DESC: "§YBehemoth§! có thể tự neo mình vào các tầng khí quyển hỗn loạn của một hành tinh khí khổng lồ, hấp thụ dưỡng chất từ bầu khí quyển đậm đặc giàu các nguyên tố nặng và hợp chất phân tử phức tạp. Theo thời gian, nguồn dinh dưỡng này sẽ thúc đẩy quá trình sinh trưởng và củng cố sức mạnh vô song của chúng."
 SHIP_BEHEMOTH_COCOON_TT: "$UNLOCKS_BEHEMOTH_SHIP_ACTION_TITLE$ $behemoth_cocoon_menu_title$\n$behemoth_cocoon_effect$"
 behemoth_cocoon_ship_button: "§H$behemoth_cocoon_menu_title$§!\n\n$behemoth_cocoon_effect$"
 behemoth_cocoon_activity_key: "Chuẩn Bị Hóa Nhộng"
 behemoth_cocoon_menu_title: "Trưởng Thành và Lớn Lên"
 behemoth_cocoon_effect: "Một §YBehemoth§! đã được cho ăn no có thể làm tổ trong Hành Tinh Khí Khổng Lồ trong §Y3 năm§! để biến thái thành một dạng sống thậm chí còn hùng mạnh hơn."
 behemoth_cocoon_progress_activity_key: "Đang Kết Kén"
 behemoth_cocoon_tt: "§RChúng ta cần mở khóa Đặc Quyền Khủng Hoảng §H$menp_behemoth_hatchling_2$§!.§!"

 MESSAGE_BEHEMOTH_GROWTH_TITLE: "Lớn Hơn và Hung Tợn Hơn"
 MESSAGE_BEHEMOTH_GROWTH_DESC: "Chúng ta đã thành công ấp nở và nuôi dưỡng một §YBehemoth§! to lớn hơn và thậm chí còn hùng mạnh hơn nữa."
 behemoth_incubation_poi_name: "Ấp Nở Behemoth"
 behemoth_incubation_poi_desc: "Một trong các Behemoth của chúng ta đang ấp nở trong Hành Tinh Khí Khổng Lồ §H[incubation_planet.GetName]§!. Chúng ta dự kiến nó sẽ hoàn toàn trưởng thành vào ngày §H[incubation_planet.behemoth_incubation_timer]§!."
 incubating_behemoth_modifier: "Behemoth Đang Ấp Nở"
 incubating_behemoth_modifier_desc: "Một quá trình biến thái mạnh mẽ đang diễn ra."

 voidspawn_boss_invincible: "Chúa Tể Quái Thú Bất Khuất"
 voidspawn_boss_invincible_desc: "Tương truyền chưa từng có một Dị Chủng Hư Không trưởng thành nào bị hạ gục. Cơ hội tốt nhất để chúng ta ngăn chặn nó là nhắm vào con mồi của nó."
