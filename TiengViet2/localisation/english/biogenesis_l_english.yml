 deep_space_citadel_0_MEGASTRUCTURE_DETAILS: "Một §Y$deep_space_citadel_0$§! là một Căn Cứ Sao bọc thép được thiết kế để tối đa hóa khả năng phòng thủ bên trong giếng trọng lực của hệ sao."
