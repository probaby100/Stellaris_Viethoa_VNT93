 death_world: "Hành Tinh Chết Chóc"
 death_world_desc: "Mặc dù về mặt kỹ thuật là có thể ở được, nhưng thế giới này là một cơn ác mộng thực sự để sinh sống. Mọi dạng sinh vật hoang dã địa phương, từ động thực vật cho đến những sinh vật nhỏ bé khiêm tốn nhất, đều tỏ ra chết chóc hơn cả những loài săn mồi đáng sợ nhất trên hành tinh quê hương của chúng ta."
 d_lethal_ecosphere_blocker: "£blocker£ Sinh Quyển Chết Người"
 d_lethal_ecosphere_blocker_desc: "Các mẫu vật và thí nghiệm bị phân nhánh Chiến Tranh vứt bỏ liên tục tranh giành sự sống sót trong cuộc chọn lọc phi tự nhiên đẫm máu. Bãi huấn luyện vô cùng thù địch này chắc chắn sẽ gây tử vong cho hầu hết binh lính, nhưng những người sống sót chắc chắn sẽ bước ra như những cỗ máy giết chóc tàn nhẫn."
