 ### FE Civics

 civic_antediluvian_mind: "Ý Thức Cổ Đại"
 civic_antediluvian_mind_desc: "Thời gian chẳng hề nương tay với ý thức tập thể này. Quãng thời gian tồn tại đằng đẵng bên trong một bong bóng thời gian đã làm cùn mòn khát vọng sinh tồn từng một thời không thể thỏa mãn của nó."
 civic_sluggish_drones: "Drone Thiếu Định Hướng"
 civic_sluggish_drones_desc: "Do đại não buông lỏng gần như chẳng hề gây chút áp lực nào, các drone của đế chế này trông gần như vô cảm và thờ ơ khi chậm rãi thực thi các nhiệm vụ được giao."

 ### FE Buildings
 building_fe: "Công Trình Đế Chế Suy Tàn"
 building_ancient_control_center:0 "Trung Tâm Kiểm Soát Cổ Đại"
 building_ancient_control_center_desc:0 "Trung tâm kiểm soát cổ xưa của thế giới vành đai chỉ vừa đủ duy trì nhờ vào những nỗ lực không ngừng nghỉ của cả một quân đoàn drone máy móc."
 building_ancient_palace:0 "Cung Điện Cổ Đại"
 building_ancient_palace_desc:0 "Quần thể cung điện khổng lồ này là minh chứng cho một kỷ nguyên đã lùi xa vào dĩ vãng. Dù mặt tiền tráng lệ của nó kiên quyết không chịu khuất phục trước dòng chảy thời gian, nhưng nhiều gian chái của nó đã bị bỏ hoang trong tình trạng đổ nát tiêu điều."
 building_ancient_hive_capital: "Hạch Tâm Tôn Quý"
 building_ancient_hive_capital_desc: "Đầu mối cổ xưa nắm giữ quyền lực tối thượng của đàn tổ ong này chính là nơi vô số thế hệ drone đã tận tụy thực thi các chỉ thị."

 building_affluence_emporium: "Thương Điếm Phồn Vinh"
 building_affluence_emporium_desc: "Trung tâm này dự đoán và thỏa mãn mọi khao khát vật chất nhờ vào thuật toán thu mua tiên tiến, mang lại sự mãn nguyện ngay trước cả khi người dân kịp nhận ra ham muốn của mình."
 building_affluence_center:0 "Trung Tâm Phồn Vinh"
 building_affluence_center_desc:0 "Trung tâm này hiện thực hóa những ham muốn kỳ quặc nhất một cách dễ dàng chỉ trong chớp mắt."
 building_nourishment_complex: "Khu Phức Hợp Dưỡng Chất"
 building_nourishment_complex_desc: "Công nghệ tái tạo vật chất nhanh chóng tạo ra các phong vị mới lạ theo từng mệnh lệnh."
 building_nourishment_center:0 "Trung Tâm Dưỡng Chất"
 building_nourishment_center_desc:0 "Mọi phong vị có thể tưởng tượng được trên đời đều có thể tái tạo hoàn hảo bên trong những bức tường này."
 building_dimensional_replicator: "Bộ Tái Tạo Đa Chiều"
 building_dimensional_replicator_desc: "Công nghệ của bộ chế tạo này đạt được sự chuyển hóa hoàn hảo từ năng lượng sang vật chất."
 building_dimensional_fabricator:0 "Bộ Chế Tạo Đa Chiều"
 building_dimensional_fabricator_desc:0 "Bộ chế tạo tiên tiến này xuyên thông liền mạch vào kết cấu của không gian chiều, khai thác các tài nguyên vô giá."
 building_class_3_singularity: "Điểm Kỳ Dị Cấp 3"
 building_class_3_singularity_desc: "Việc thu gom toàn bộ sản lượng năng lượng từ điểm kỳ dị này là một kỳ tích kỹ thuật xuất sắc."
 building_class_4_singularity:0 "Điểm Kỳ Dị Cấp 4"
 building_class_4_singularity_desc:0 "Sản lượng năng lượng của điểm kỳ dị này thách thức mọi định luật vật lý, vậy mà các trường ngăn giữ vẫn trụ vững với độ ổn định kiên định phi thường."
 building_micro_forge: "Siêu Lò Rèn"
 building_micro_forge_desc: "Tốc độ sản xuất của lò rèn này chỉ bị giới hạn duy nhất bởi số lượng tài nguyên được nạp vào."
 building_nano_forge:0 "Lò Rèn Tự Động"
 building_nano_forge_desc:1 "Các khoang tái tạo nano rộng lớn trong lò rèn này biến đổi nguyên liệu thô thành các hợp kim tiên tiến với hiệu suất đáng kinh ngạc."
 building_fe_sky_dome: "Mái Vòm Thiên Không"
 building_fe_sky_dome_desc: "Thành phố bay lơ lửng này, được nâng đỡ bởi công nghệ phản trọng lực tối tân, mang đến một thiên đường bình yên lý tưởng cho cư dân sinh sống."
 building_fe_dome: "Mái Vòm Thiên Cung"
 building_fe_dome_desc: "Được nâng lơ lửng nhờ công nghệ triệt tiêu trọng lực, những mái vòm này vượt qua các giới hạn vật lý thông thường, trong khi các hệ thống hỗ trợ sinh tồn tiên tiến đáp ứng hoàn hảo mọi nhu cầu của cư dân."
 building_fe_fortress: "Pháo Đài Aspis"
 building_fe_fortress_desc: "Khu phức hợp phòng thủ hành tinh khổng lồ này sở hữu vô số kho vũ khí cùng các lớp lá chắn dày đặc. Chỉ có một lực lượng vây hãm được chuyên biệt hóa cao độ mới có thể chọc thủng phòng tuyến của nó."
 building_fe_stronghold: "Tổ Hợp Thần Thuẫn Aegis"
 building_fe_stronghold_desc: "Khu phức hợp phòng thủ hành tinh hùng vĩ này được bảo vệ bởi vô vàn kho vũ trang và lá chắn; ngay cả núi non của hành tinh cũng sẽ sụp đổ trước khi hàng phòng ngự của nó bị khuất phục."

 building_master_archive:0 "Đại Kho Lưu Trữ"
 building_master_archive_desc:0 "Kho lưu trữ này chứa đựng tri thức trải qua nhiều kỷ nguyên thiên hà, tuy nhiên khả năng vận hành hệ thống truy xuất bí truyền của nó đã bị thất truyền. Những mảnh dữ liệu chắp vá trích xuất được cũng đã chứng tỏ giá trị vô giá."
 building_empyrean_shrine:0 "Đền Thờ Thiên Cung Phân Pha"
 building_empyrean_shrine_desc:0 "Được sử dụng chuyên biệt để giao tiếp với các linh thể của Tấm Màn Tâm Linh (The Shroud), ngôi đền này chỉ hiện diện một phần trong chiều không gian của chúng ta."
 building_ancient_cryo_chamber:0 "Gian Ngủ Đông Cổ Đại"
 building_ancient_cryo_chamber_desc:2 "Hàng nối hàng các khoang ngủ đông xếp dọc theo kiến trúc đồ sộ này, chứa đựng thi hài đã tiêu tan từ lâu của hàng tỷ mẫu vật sinh vật ngoài hành tinh bị đông lạnh từ thuở xa xưa."

 building_fe_administration_1: "Cơ Quan Quản Trị Toàn Nhãn"
 building_fe_administration_1_desc: "Là một phần thiết yếu của hệ thống quan liêu bao trùm toàn thiên hà, khu phức hợp rộng lớn này được kết nối với một mạng lưới hành chính khổng lồ."
 building_fe_administration_2: "Cơ Quan Quản Trị Toàn Tri"
 building_fe_administration_2_desc: "Khu phức hợp đồ sộ này, vốn là trung tâm của hệ thống quan liêu trải khắp thiên hà, điều phối một mạng lưới hành chính tiên tiến và vững chắc."
 building_fe_administration_hive_1: "Cụm Si-náp Khớp Kề"
 building_fe_administration_hive_1_desc: "Được chăm sóc tỉ mỉ bởi các drone chuyên biệt hóa cao độ, mạng lưới các nút si-náp khớp kề này củng cố quyền thống trị của Đàn Tổ Ong trên phạm vi nhận thức bao la của nó."
 building_fe_administration_hive_2: "Sợi Trục Khớp Kề"
 building_fe_administration_hive_2_desc: "Được chăm nom cẩn thận bởi các drone chuyên môn hóa cao, mạng lưới rộng lớn các nút si-náp khớp kề này củng cố ý chí của Đàn Tổ Ong trên khắp thiên hà."
 building_fe_administration_machine_1: "Điểm Điều Phối Phân Nhánh"
 building_fe_administration_machine_1_desc: "Một đầu mối phân nhánh tiên tiến, xử lý và truyền tải liền mạch hàng nghìn tỷ tín hiệu với độ chính xác gần như tức thì."
 building_fe_administration_machine_2: "Điểm Điều Phối Lượng Tử"
 building_fe_administration_machine_2_desc: "Một trung tâm vướng víu lượng tử tiên tiến, xử lý và truyền tải tức thì hàng triệu tỷ tín hiệu với độ chuẩn xác tuyệt đối."

 building_fe_temple_1: "Thánh Sở Thiên Giới"
 building_fe_temple_1_desc: "Những bước tiến vượt bậc trong công nghệ siêu hình cho phép các tín đồ giao tiếp trực tiếp với bản thể thiêng liêng."
 building_fe_temple_2: "Đại Thánh Đường Thiên Giới"
 building_fe_temple_2_desc: "Việc ứng dụng công nghệ siêu hình vào các bài giảng tâm linh khuếch đại sự cộng hưởng tinh thần. Quần thể khổng lồ này giúp các tín đồ kết nối mật thiết với bản thể thiêng liêng ở quy mô toàn hệ sao."

 building_fe_assembly_1: "Đầu Mối Chế Tạo Robot"
 building_fe_assembly_1_desc: "Một tổ hợp lắp ráp tiên phong được vận hành bởi các chuyên gia Chế tạo Robot bậc thầy; cơ sở này vượt qua mọi ranh giới thông thường, hiện thực hóa một cách tỉ mỉ những đỉnh cao đổi mới robot."
 building_fe_assembly_2: "Trung Tâm Sản Xuất Robot Lượng Tử"
 building_fe_assembly_2_desc: "Là một kỳ quan của ngành kỹ thuật, dây chuyền lắp ráp lượng tử của cơ sở này sử dụng các bộ chuyển đổi vướng víu để chế tác các bộ phận máy móc đến từng chi tiết tinh vi nhất. Không một nguyên tử nào bị đặt sai chỗ."

 building_fe_clinic_1: "Viện Tái Tạo Phân Tử"
 building_fe_clinic_1_desc: "Các Viện Tái Tạo Phân Tử đi sâu vào cấu trúc tế bào phức tạp để khuếch đại hiệu quả điều trị y tế, cải thiện đáng kể chất lượng sức khỏe và tuổi thọ của dân số."
 building_fe_clinic_2: "Viện Tái Sinh Sinh Học"
 building_fe_clinic_2_desc: "Nằm trên đỉnh cao của công nghệ y học, Viện Tái Sinh Sinh Học tiên phong trong các liệu pháp tái sinh sinh học đột phá, liên tục định nghĩa lại các giới hạn của việc kéo dài sự sống."

 building_fe_security_1: "Tổ Hợp Tư Pháp"
 building_fe_security_1_desc: "Khu phức hợp tư pháp đồ sộ này kết hợp nhuần nhuyễn giữa tòa án và lực lượng thực thi pháp luật."
 building_fe_security_2: "Đại Tự Tháp Công Lý"
 building_fe_security_2_desc: "Đỉnh cao của các thể chế pháp lý, tòa kiến trúc kỳ vĩ này là tượng đài cho công lý, bao gồm các tòa án, cơ sở giam giữ và trại cải tạo có thể cảm hóa ngay cả những tội phạm ngoan cố nhất."

 building_fe_market_1: "Trung Tâm Thương Mại Thiên Hà"
 building_fe_market_1_desc: "Thống trị đường chân trời, những tòa tháp chọc trời này tỏa bóng xuống các khu thương mại nhộn nhịp bên dưới."
 building_fe_market_2: "Đầu Mối Thương Mại Liên Sao"
 building_fe_market_2_desc: "Ngự trị tối cao trong nền kinh tế thiên hà, những ngọn tháp khổng lồ của khu thương mại này có thể nhìn thấy rõ từ quỹ đạo không gian."

 building_fe_silo_1: "Kho Không Gian Thu Hẹp"
 building_fe_silo_1_desc: "Kho này tác động lên một phần của không gian phụ nơi khoảng cách giữa các phân tử được thu nhỏ, từ đó thu nhỏ kích thước của bất kỳ vật thể nào được lưu trữ tại đây một cách hiệu quả. Sinh vật sống bị cấm tuyệt đối bước vào."
 building_fe_silo_2: "Kho Đa Chiều Không Gian"
 building_fe_silo_2_desc: "Bằng cách tạo ra một chiều không gian túi cục bộ, chúng ta có thể chứa lượng tài nguyên gần như vô tận."

 building_fe_entertainment_1: "Quảng Trường Cực Lạc Ảo"
 building_fe_entertainment_1_desc: "Các khu vực giải trí đồ sộ này nằm ở tuyến đầu của ngành giải trí và nghỉ dưỡng. Các máy đọc sóng não cho phép thực hiện các chuyến du ngoạn ảo mang tính cá nhân hóa và tức thì."
 building_fe_entertainment_2: "Đầu Mối Toàn Cực Lạc"
 building_fe_entertainment_2_desc: "Đỉnh cao hội tụ vĩ đại của nền giải trí, đầu mối này vượt qua các giới hạn thông thường, nơi những giấc mơ hóa thành hiện thực ngay trước cả khi những ước muốn kịp nảy sinh."

 building_fe_lab_1: "Đầu Mối Đổi Mới Lượng Tử"
 building_fe_lab_1_desc: "Đầu mối này tự hào sở hữu các trang thiết bị tối tân cùng năng lực nhân sự chưa từng có, mở ra một kỷ nguyên nơi các lý thuyết lượng tử không chỉ được khám phá mà còn được khai thác cho những đột phá mang tính cách mạng."
 building_fe_lab_2: "Cục Đổi Mới Siêu Việt"
 building_fe_lab_2_desc: "Tòa kiến trúc này là đỉnh cao của tiến bộ khoa học và là bằng chứng cho một kỷ nguyên của sự đổi mới không giới hạn."

 building_fe_mine_1: "Nhà Máy Khoan Lượng Tử"
 building_fe_mine_1_desc: "Nhà máy khai khoáng này có thể tìm thấy khoáng sản ở bất kỳ đâu trong lớp phủ của hành tinh bằng công nghệ xuyên hầm lượng tử để khoan xuyên qua các vật chất rắn mà không cần tiếp xúc vật lý."
 building_fe_mine_2: "Trung Tâm Khoan Lượng Tử"
 building_fe_mine_2_desc: "Trung tâm khai khoáng này có thể khai thác khoáng sản ở bất kỳ đâu sâu xuống tận lõi ngoài của hành tinh bằng công nghệ xuyên hầm lượng tử để khoan xuyên qua các vật chất rắn hoặc lỏng mà không cần tiếp xúc vật lý."

