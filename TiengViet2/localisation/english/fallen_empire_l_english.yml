 tech_fe_administration_1: "Quy trình Hành chính Phân nhánh"
 tech_fe_administration_1_desc: "Nhu cầu hành chính của chúng ta cũng sẽ mở rộng tương ứng khi trình độ làm chủ công nghệ tiên tiến không ngừng phát triển. Chúng ta phải đáp ứng một cách thuần thục các đòi hỏi từ đế chế đang ngày một lớn mạnh."
 tech_fe_administration_2: "Quy trình Hành chính Lượng tử"
 tech_fe_administration_2_desc: "Công nghệ của chúng ta giờ đây vượt xa mọi yêu cầu hành chính. Toàn bộ tri thức chuyên môn cần thiết để cai quản liền mạch một đế chế thiên hà đã hoàn toàn nằm chắc trong tay chúng ta."
