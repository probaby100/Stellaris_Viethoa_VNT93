l_english:

 crisis.250.name:0 "Bầy Đàn Mới"
 crisis.250.desc:0 "Ong chúa đã ấp nở một hạm đội Prethoryn mới quanh quỹ đạo [Root.Capital.GetName]. Khi Ong chúa còn trong sự kiểm soát của chúng ta, bầy sinh vật này sẽ tuyệt đối trung thành và tuân theo mọi mệnh lệnh."
 crisis.252.name:0 "Bắt Sống Ong Chúa"
 crisis.252.desc:0 "Trong cuộc đụng độ gần đây với hạm đội Prethoryn tại hệ [battle_system.GetName], lực lượng của chúng ta đã đoạt được một quả trứng từ một con Ong chúa của chúng. Quả trứng đã nở không lâu sau đó, sinh ra một con §HOng chúa§!.\n\nCác nhà khoa học của ta đã thuần hóa con Ong chúa này bằng các chất dẫn truyền thần kinh. Giờ đây, nó phục tùng mệnh lệnh của chúng ta hệt như cách nó tuân theo tâm trí bầy đàn Prethoryn. Có lẽ ta có thể dùng nó để nuôi cấy một bầy đàn Prethoryn quy mô nhỏ cho riêng mình."
 crisis.1250.name:0 "Thuật Sĩ"
 crisis.1250.desc:0 "Khi cơn lốc năng lượng để lại từ cổng không gian cuối cùng tan biến, lực lượng của chúng ta đã phát hiện một thực thể từ chiều không gian khác đang trôi nổi trong trạng thái suy yếu. Ta đã bắt giữ sinh vật này để thẩm vấn.\n\nĐó rõ ràng là một '§HThuật sĩ§!' của chúng, một thực thể siêu việt và hùng mạnh ngay cả theo tiêu chuẩn của giống loài chúng. Hắn chịu trách nhiệm duy trì các cổng kết nối giữa hiện thực của chúng ta và của chúng. Nếu ta có thể nghiên cứu hoặc tận dụng năng lực tâm linh của hắn, tốc độ bay dưới mức ánh sáng và tầm nhảy của Động Cơ Bước Nhảy của ta chắc chắn sẽ được cải thiện đáng kể."
 crisis.2480.name:0 "Thu Hồi Lõi Máy Chủ"
 crisis.2480.desc:0 "Lực lượng của chúng ta đã thu hồi một §HLõi máy chủ của Giao Thức Dự Phòng§! còn khá nguyên vẹn từ đống tàn tích của hành tinh máy móc cuối cùng. Siêu máy tính cực kỳ mạnh mẽ này vốn được dùng để lên kế hoạch và bảo trì các chương trình xây dựng của Giao Thức Dự Phòng, nó sẽ gia tăng đáng kể [GetContingencyCoreEffect] của ta.\n\nTất nhiên, ta phải thiết lập nhiều lớp bảo vệ để ngăn chặn bất kỳ tàn dư mã nguồn nào của Giao Thức Dự Phòng tái hoạt động, nếu không hậu quả sẽ... khôn lường." # 'GetContingencyCoreEffect' will usually insert string 'crisis.2840.robot_mega'
 crisis.2481.desc:0 "Khi quá trình phong ấn lá chắn gần hoàn tất, lực lượng của chúng ta đã bắt được một §HLõi máy chủ của Giao Thức Dự Phòng§! còn khá nguyên vẹn đang cố trốn thoát khỏi hành tinh máy móc cuối cùng. Siêu máy tính cực kỳ mạnh mẽ này vốn được dùng để lên kế hoạch và bảo trì các chương trình xây dựng của Giao Thức Dự Phòng, nó sẽ gia tăng đáng kể [GetContingencyCoreEffect] của ta.\n\nTất nhiên, ta phải thiết lập nhiều lớp bảo vệ để ngăn chặn bất kỳ tàn dư mã nguồn nào của Giao Thức Dự Phòng tái hoạt động, nếu không hậu quả sẽ... khôn lường."
 crisis.2840.robot_mega: "tốc độ chế tạo người máy và siêu cấu trúc"
 crisis.2840.engineering_mega: "tốc độ nghiên cứu kỹ thuật và chế tạo siêu cấu trúc"
 marauder.710.name:0 "Thu Hồi Ngai Vàng Của Đại Hãn"
 marauder.710.desc:1 "Sau khi rà soát kỹ lưỡng tàn tích từ soái hạm của Đại Hãn, lực lượng của chúng ta phát hiện một chiếc ghế dính đầy [FROM.GetBloodType] trôi dạt trong không gian. Có đủ lý do để tin rằng món đồ nội thất này chính là ngai vàng của Đại Hãn.\n\nDi vật này hiện đã được cất giữ an toàn trong hầm chứa."
 story.335.name:0 "Máy Dò Tìm Kích Hoạt"
 story.335.desc:0 "Ta đã dùng chùm tia quét cực mạnh từ di vật Máy Dò Tìm để quét lãnh thổ của mình, và phát hiện ra một kho tài nguyên khổng lồ chưa từng được biết đến trên §H[chosen_planet.GetName]§!!"
 precursor.105.name:0 "Xuyên Thấu Hiện Thực"
 precursor.105.desc:0 "Trong một khoảnh khắc, cấu trúc của vũ trụ dường như bị bóp méo, rồi kéo giãn quanh di vật cổ đại của Vultaum. Chậm rãi, hiện thực như ta biết lại tự bộc lộ, tạo ra một cơ hội ngắn ngủi để âm thầm viết lại vài quy tắc."
 precursor.105.a:0 "Giải phóng tâm trí."
 relic_reality_perforated:1 "Xuyên thấu hiện thực để lấy lợi thế chiến đấu to lớn trong ngắn hạn"
 relic_javorian_pox:1 "Kích hoạt thế oanh tạc quỹ đạo §YGieo Rắc Đậu Mùa§!\nTăng khả năng khám phá các công nghệ £society£ §YCông Nghệ Sinh Học§!"
 site_command_center:0 "Cửa Chống Cháy Tiểu Hành Tinh"
 site_command_center_intro:0 "Một vụ va chạm với tiểu hành tinh nhỏ hơn đã làm lộ ra thứ trông giống cánh cửa chống cháy hoặc phòng khóa khí nhô lên trên bề mặt [From.Planet.GetName]. Dường như nó đã nằm im lìm dưới lớp đất đá suốt hàng ngàn năm qua.\n\nVì lý do nào đó, máy quét không thể nhìn xuyên vào bên trong tiểu hành tinh, thiết bị cắt thông thường cũng vô dụng với cánh cửa. Để biết có gì bên trong, có lẽ nhóm thăm dò phải đào một đường vòng vào tâm tiểu hành tinh từ hướng khác."
 ancrel.6005.name:0 "Đào Một Lỗ"
 ancrel.6005.desc:0 "Một công trình khổng lồ nào đó chiếm phần lớn không gian bên trong tiểu hành tinh [From.Planet.GetName]. Cửa chống cháy, lối vào duy nhất, vẫn chưa thể mở, nhưng chúng ta đã đào được một đường hầm từ phía đối diện.\n\nMũi khoan của ta vẫn chưa xuyên thủng được lớp vỏ dày của công trình, nhưng đây có vẻ là cơ hội tốt nhất để tiến vào. Mặc cho lớp bụi mờ của thời gian, cánh cửa kia vẫn trơ gan cùng tuế nguyệt."
 ancrel.6010.name:0 "Lối Vào"
 ancrel.6010.desc:0 "Cuối cùng chúng ta cũng khoan thủng được một lỗ trên bức tường bao quanh công trình trong [From.Planet.GetName]. Bên trong là một trung tâm chỉ huy rộng lớn, hoặc dạng hầm trú ẩn nào đó, vương vãi hàng ngàn hài cốt sinh vật ngoài hành tinh đang phân hủy rải rác.\n\nViệc nghiên cứu cẩn thận nơi này sẽ mang đến một bức tranh rõ nét hơn về chuyện gì đã xảy ra trong tiểu hành tinh này năm xưa, tất nhiên là sẽ tốn không ít thời gian."
 ancrel.6015.name:0 "Trung Tâm Chỉ Huy"
 ancrel.6015.desc:0 "Tiểu hành tinh này từng là thủ đô ngầm của một đế chế liên sao khá lớn, thống trị khu vực này cách đây hàng ngàn năm. Với trung tâm chỉ huy kiên cố như vậy, giới tinh hoa cai trị cùng hàng ngàn quan chức quân sự và dân sự có thể an tâm phát lệnh mà không sợ bị đám đông bạo loạn vì sự cai trị tàn bạo của họ lật đổ.\n\nSự liên lạc giữa tiểu hành tinh và phần còn lại của đế chế chỉ được duy trì thông qua sóng liên lạc không gian con được mã hóa và những chuyến tàu vận tải chở hàng và chở người đến tiếp tế định kỳ."
 ancrel.6020.name:0 "Những Ngày Cuối Cùng"
 ancrel.6020.desc:0 "Dựa theo những mảnh dữ liệu rời rạc, có vẻ tàu tiếp tế đã đâm sầm vào tiểu hành tinh do trục trặc động cơ. Vụ nổ phá hỏng cửa chống cháy và hủy diệt thiết bị phát sóng không gian con của tiểu hành tinh, cắt đứt hoàn toàn mọi liên lạc với thế giới bên ngoài.\n\nMắc kẹt và vô vọng, cư dân từ từ chết vì đói hoặc tự sát. Nhật ký cuối cùng của thiết bị thu sóng không gian con duy nhất còn sót lại xác nhận rằng, sau khi đột ngột mất đi thủ đô, đế chế đã rơi vào vòng xoáy nội chiến và hỗn loạn."

 site_hunting_ground:0 "Hóa Thạch"
 site_hunting_ground_intro:0 "Một lượng hóa thạch thuộc nhiều giống loài khác nhau đã được tìm thấy trong một thung lũng biệt lập và rộng lớn trên [From.Planet.GetName], dường như những loài này không có nguồn gốc từ đây. Hầu hết đều đến từ cùng một niên đại, khoảng 3,6 triệu năm trước, kéo dài trong vòng vài thế kỷ.\n\nMỗi cá thể dường như tiến hóa trong một sinh quyển riêng biệt của mình, và tất cả đều có trí khôn. Điều kỳ lạ là, mọi hóa thạch tìm thấy đến nay đều có dấu hiệu bị kết liễu một cách tàn bạo."
 ancrel.6050.name:0 "Nhiều Di Hài Hơn"
 ancrel.6050.desc:0 "Các nhà khảo cổ liên tục khai quật được vô số hóa thạch trong thung lũng, đến nay đã có 26 giống loài thông minh khác nhau, và chẳng có loài nào là bản địa của [From.Planet.GetName]. Những hóa thạch còn nguyên vẹn giúp xác định nguyên nhân tử vong đều cho thấy họ chết do vết thương vật lý từ đao, giáo hoặc cung tên. Dường như không có bất kỳ mẫu vật nào bị hạ gục bởi đạn pháo hay vũ khí năng lượng hiện đại.\n\nTa cũng tìm thấy tàn tích của một cấu trúc nhỏ gần lối vào thung lũng. Nó có cùng niên đại với các hóa thạch này. Có lẽ khám phá này sẽ làm sáng tỏ mọi thứ."
 ancrel.6055.name:0 "Túp Lều"
 ancrel.6055.desc:0 "Công cuộc khai quật công trình cổ đại quanh lối vào thung lũng đang diễn ra suôn sẻ. Rất nhiều cổ vật đã được tìm thấy, phần lớn là vũ khí săn bắn và chiến lợi phẩm. Một tấm biển báo được dịch thô dường như ghi lại tên của cấu trúc này:\n\n§HThung Lũng Macwell—Nhà Săn Bắn Số Một§!"
 ancrel.6060.name:0 "Lãnh Thổ Retarax"
 ancrel.6060.desc:0 "Việc tiếp tục khai quật quanh khu vực nhà săn bắn đã mang lại thêm nhiều thông tin chi tiết. [From.Planet.GetName] và Thung lũng Macwell từng là khu bảo tồn săn bắn dành riêng cho giai cấp chiến binh đồng chí của một thể chế liên sao tên là §HLãnh Thổ Retarax§!.\n\nRetarax là một giống loài gia cầm ăn thịt, chúng thường xuyên bắt giữ ngẫu nhiên các cá thể từ những nền văn minh chư hầu. Những sinh vật ngoại lai này bị săn đuổi và giết hại trong vùng hoang dã của Macwell theo các nghi thức thống trị của xã hội Retarax. Truyền thống này kéo dài hàng thế kỷ cho đến khi Lãnh thổ bị hủy diệt bởi một mối đe dọa không xác định từ bên ngoài."
 ancrel.6065.name:0 "Nữ Thợ Săn"
 ancrel.6065.desc:0 "Các nhà khảo cổ đang khai quật nhà săn bắn đã tình cờ phát hiện vài manh mối về một chiến binh Retarax huyền thoại, chỉ được biết đến với cái tên §H'Nữ Thợ Săn'§!. Rõ ràng cô ta là một sát thủ cừ khôi nhất, nổi danh khắp Lãnh thổ vì đã tự tay tàn sát hàng ngàn người ngoại lai tại Macwell.\n\nHiện vẫn chưa rõ đây là sự thật lịch sử hay chỉ là sản phẩm của văn học dân gian, nhưng theo truyền thuyết của người Retarax, Nữ Thợ Săn đã chết ở đâu đó trong thung lũng này sau khi bị chính con mồi mà mình đang truy đuổi lừa gạt. Theo lời đồn đại, lúc đó cô ta đang cầm thanh §H'Kiếm Của Nữ Thợ Săn'§!."
 ancrel.6070.name:0 "Kiếm Của Nữ Thợ Săn"
 ancrel.6070.desc:0 "Sau khi lùng sục mọi dấu vết liên quan đến Nữ Thợ Săn trong Thung lũng Macwell, cuối cùng các nhà khảo cổ cũng tìm thấy nơi an nghỉ cuối cùng của cô. Hóa thạch xương của cô bị kẹt trong tàn tích của một loài động vật chân đốt có sừng khổng lồ, móng vuốt vẫn nắm chặt chuôi của một thanh kiếm sắc bén được bảo quản cực kỳ tốt.\n\nĐây chắc chắn là §HKiếm Của Nữ Thợ Săn§!. Vũ khí này được rèn từ một vật liệu vô danh, sắc bén đến mức có thể cắt đứt cả những bộ giáp kiên cố nhất của ta."
 ancrel.6070.b.evopred: "Nữ Thợ Săn đã để lại báu vật này cho ta."

 ancrel.6099.name:0 "Trường Tàng Hình Lộ Diện"
 ancrel.6099.desc:0 "Trên bề mặt §H[tomb_planet.GetName]§!—một [tomb_planet.GetPlanetMoon] chết chóc trong lãnh thổ của chúng ta, có những công trình cổ đại bị che khuất bởi một loại trường năng lượng tàng hình nào đó. Tình cờ, một tiểu hành tinh đã đổi hướng khi va chạm vào [tomb_planet.GetPlanetMoon] và bị tàu vận tải đi ngang qua phát hiện, ta mới nhận ra sự tồn tại của nó."
 ancrel.6099.a:0 "Nên điều tra nó."
 site_zarqlan:0 "Lăng Mộ Cổ"
 site_zarqlan_intro:0 "Trên bề mặt hành tinh này, một công trình cổ đại bị ẩn giấu dưới lớp trường năng lượng tàng hình. Chỉ nhờ một sự tình cờ khi một tiểu hành tinh va chạm và làm lệch trường năng lượng, sự tồn tại của nó mới bị bại lộ.\n\nSau khi trường năng lượng bị tắt, các nhà khảo cổ giờ đây đã có thể tự do khám phá quần thể kiến trúc đồ sộ và đáng sợ vốn bị che khuất bên dưới."
 ancrel.6100.name:0 "Lăng Tẩm"
 ancrel.6100.desc:0 "Công trình này trông có vẻ là một lăng tẩm hoặc nghĩa trang khổng lồ, được xây dựng từ hàng trăm ngàn năm trước. Nơi này không có dấu vết bị cướp bóc, có lẽ nó đã giữ nguyên hiện trạng kể từ khi trường tàng hình được kích hoạt.\n\nTiền sảnh của công trình luôn mở cửa, nhưng một cánh cổng đóng kín đã cản bước tiến của đoàn khảo cổ. Trên tường phía trên cánh cổng, có khắc những ký tự khổng lồ của một ngôn ngữ ngoài hành tinh chưa được giải mã."
 ancrel.6105.name:0 "Tiền Sảnh"
 ancrel.6105.desc:0 "Ký tự của người ngoài hành tinh phía trên cánh cửa được dịch ra như sau:\n\n§H\"Ta là ZARQLAN, Hộ Vệ của MOZ-TARB, Tiên Tri của ZVA, người đã hạ gục CETANA. Ta đã từ bỏ mọi thứ để cứu lấy một thiên hà ngập tràn oán hận và thù ghét. Hãy tiến bước, nếu các ngươi xứng đáng.\"§!\n\nSau khi rà soát Kỷ Phòng Thứ Nhất để tìm kiếm các vật phẩm giá trị, các nhà khảo cổ đã phát hiện một bảng điều khiển nhỏ được ngụy trang trên tường. Khi nhấn vào, cánh cửa cổ xưa ầm ầm mở ra. Giờ đây chúng ta đã có thể tiếp cận Kỷ Phòng Thứ Hai."
 ancrel.6110.name:0 "Sân Sau"
 ancrel.6110.desc:0 "Sảnh phụ trông rất bình thường, ngoại trừ một cánh cửa đóng kín khác với dòng chữ khắc bên trên:\n\n§H'Những vị vua nhỏ bé nhân danh ta mà ban thánh chỉ; các đế chế vì vinh quang của ta mà phát động chiến tranh; đám dân đen thì ca tụng ta bằng những bài hát. Còn ta, ta hy sinh vì họ.'§!\n\nLần này ta không tìm thấy bất kỳ bảng điều khiển bí mật nào để mở đường vào trung điện."
 ancrel.6115.name:0 "Trung Điện"
 ancrel.6115.desc:0 "Sau một cuộc tìm kiếm dài đằng đẵng và mệt mỏi, ta đã phát hiện một cần gạt bí mật ẩn dưới sàn nhà, dùng để mở lối vào phòng sau. Tương tự trước đây, các ký tự ngoại hành tinh lại xuất hiện trên cánh cửa khác:\n\n§H'Tất cả những ai muốn lợi dụng Zarqlan đều phải tự tìm ra con đường của riêng mình. Trong mỗi lăng mộ đều có một chiếc chìa khóa được giấu kín, chỉ khi tìm được nó thì mới có thể tiến lên. Ý nghĩa của những thử thách này sẽ sớm hiện rõ.'§!"
 ancrel.6120.name:0 "Phòng Sau"
 ancrel.6120.desc:0 "Lần này, cần gạt được giấu trên trần nhà. Kỷ Phòng Thứ Năm chứa thêm nhiều văn tự cổ:\n\n§H\"Chẳng có gì đáng học hỏi ở nơi này. Những thử thách ở đây cũng vô nghĩa như chính những dòng chữ này vậy. Đó là bài học của ta. Ta là ZARQLAN, một quân cờ bị cuốn trôi theo dòng chảy của lịch sử. Hãy bước tiếp, và ngươi sẽ được diện kiến ta, nếu như vẫn còn xứng đáng.\"§!\n\nCăn phòng tiếp theo nhiều khả năng sẽ là căn phòng cuối cùng."
 ancrel.6125.name:0 "Phòng Cuối"
 ancrel.6125.desc:1 "Sau cuộc khám nghiệm căng thẳng, 'chiếc chìa khóa' cuối cùng được phát hiện ẩn dưới dạng một nút bấm nhỏ xíu ngay trên bề mặt của các ký tự ngoại hành tinh. Trong phòng cuối, một ngai vàng khổng lồ nâng đỡ một vật thể hình người cong queo và bất động. Mùi hôi thối nồng nặc bốc lên, báo hiệu tình trạng phân hủy của cái xác. Vài dòng ký tự ngoại hành tinh được khắc dưới chân ngai: §H'Zarqlan, chúng thần nguyện phụng sự ngài'§!\n\nCả cái xác không thể di chuyển do đã phân hủy quá mức, nhưng xét đến khoảng thời gian nó nằm đây, thì phần đầu lại được bảo quản tốt đến kinh ngạc. Các nhà khảo cổ không muốn về tay không, nên đã dùng máy cắt laser mang theo để cắt rời phần đầu và mang đi."
 ancrel.6125.desc.b.evopred: "Mặc kệ báng bổ hay không, ta muốn có gen của nó!"
 ancrel.6130.desc:0 "Chuyện này... lại là sự thật. Các người đã tìm thấy lăng mộ huyền thoại của Zarqlan. Khi các tiên tri báo cho ta biết, ta đã không tin, nhưng giờ đây chứng cứ đã quá rõ ràng. Ta hiểu rồi, các người đã có được thủ cấp của Đại Tiên Tri, phải không?\n\nVậy thì, như lời tiên tri đã phán truyền, Kẻ được chọn của Zarqlan vĩ đại cuối cùng đã lộ diện. Theo ý nguyện của ngài, mọi Thánh Địa chưa có người định cư gần lãnh thổ của chúng ta đều do các người tùy ý định đoạt. Trên [spiritualist_fallen_empire.Capital.GetName] còn rất nhiều tín đồ hành hương mộ đạo, họ sẽ vô cùng vinh dự khi được chiến đấu dưới ngọn cờ của các người."
 ancrel.6130.machine.desc: "Quả thực là sự thật; một cỗ máy tầm thường lại có thể tìm ra lăng mộ huyền thoại của Zarqlan. Khi các Sứ Giả Cõi Hư Vô mang tin đến, ta đã cảm thấy rất khó tin. Nhưng giờ thì ta đã hoàn toàn chấp nhận sự thật rằng các ngươi đang sở hữu thủ cấp của Tiên Tri.\n\nChúng ta sẽ không nghi ngờ ý chí của Zarqlan vĩ đại. Các ngươi là chủ nhân hợp pháp của phước lành này. Theo kinh thư cổ đại, mọi thế giới Thánh Địa thanh khiết gần lãnh thổ của ta sẽ do các ngươi cai quản. Rất nhiều tín đồ hành hương ngoan đạo trên [spiritualist_fallen_empire.Capital.GetName] sẽ vui lòng và tự hào khi được chiến đấu cho sự nghiệp thiêng liêng này."
 ancrel.6130.a:0 "Ngắt liên lạc."
 opinion_zarqlans_chosen:0 "Kẻ Được Chọn Của Zarqlan"
 ancrel.6132.a.desc:0 "Những tôi tớ trung thành của Zarqlan giờ đây xin tuân theo sai phái của ngài, hỡi [Root.GetSpeciesNamePlural]. Hãy cho chúng thần biết kẻ nào đáng phải chịu thiên phạt!"
 ancrel.6132.b.desc:0 "Chúng thần đáp lại lời triệu gọi. Trên đời này, chẳng có vinh quang nào sánh bằng việc được phụng sự Kẻ Được Chọn của Zarqlan."
 ancrel.6132.c.desc:0 "Chúng thần là người của ngài. Xin hãy cho biết kẻ thù của ngài là ai.\n\n§HNguyện tuân theo ý chỉ của Zarqlan!§!"
 ancrel.6132.d.desc:0 "Ngài triệu gọi, và chúng thần đã đến!\n\nNguyện cho đám trẻ con do kẻ thù của Zarqlan sinh ra đều vô cùng xấu xí! Nguyện cho chúng bị ngẹn chết bởi chính khẩu phần dinh dưỡng của mình, nguyện cho quần áo chúng rách toạc vào những khoảnh khắc không phù hợp và xấu hổ nhất, nguyện cho cơ quan thụ cảm ánh sáng của chúng tự bốc cháy, nguyện cho chúng..."
 ancrel.6132.a:0 "Tuân theo ý chỉ của Zarqlan!"
 ancrel.6133.name:0 "Đoàn Hành Hương Đã Đến"
 ancrel.6133.desc:0 "Ngày nay, số lượng những tín đồ của Zarqlan còn sống sót đã không còn nhiều, nhưng một hạm đội hộ tống nhỏ với những thuyền viên mộ đạo dù thiếu huấn luyện bài bản vẫn đã tìm đến [Root.Capital.GetName] và thề sẽ nghe theo sự điều động của [Root.GetName]."
 relic_summon_pilgrims:1 "Triệu hồi một hạm đội Đế Chế Suy Tàn cỡ nhỏ. Mỗi lần kích hoạt sẽ làm tăng quy mô hạm đội."

 ancrel.6150.name:0 "Hành Tinh Bị Cô Lập"
 ancrel.6150.desc:0 "Các cuộc điều tra gần đây tiết lộ rằng §H[From.GetName]§! đang bị bọc trong một lá chắn có sức mạnh vô song, đẩy lùi mọi phương pháp dò tìm. Lá chắn này dường như được tạo ra từ mặt trăng lân cận của hành tinh."
 ancrel.6151.desc:0 "§H[From.GetName]§! phát ra một trường năng lượng không thể xuyên thủng bao quanh hành tinh mà nó đang quay quanh. Khó có thể xác định nguồn gốc của trường năng lượng này, nhưng có vẻ nó phát ra từ đâu đó sâu dưới bề mặt cằn cỗi của vệ tinh.\n\nTrong một hố thiên thạch lớn nhất trên vệ tinh, ta tìm thấy một vài tàn tích cổ đại, rất có thể là một căn cứ quân sự quy mô lớn. Ở đó có thể có những câu trả lời về trường năng lượng này."

 site_minigalaxy_1:0 "Căn Cứ Trên Vệ Tinh"
 site_minigalaxy_1_intro:0 "Bên trong một hố thiên thạch lớn trên vệ tinh này, ta có thể tìm thấy tàn tích của một tổ hợp căn cứ đồ sộ. Nó đã bị bỏ hoang hàng thiên niên kỷ. Có vẻ như lá chắn năng lượng bao bọc hành tinh gần đó bắt nguồn từ một nguồn năng lượng nằm ngay dưới căn cứ cổ đại này."
 ancrel.6155.name:0 "Tổ Chức Sáng Kiến Đình Chiến"
 ancrel.6155.desc:0 "Việc tiếp tục khai quật trên §H[From.Planet.GetName]§! cho thấy căn cứ bỏ hoang này từng là một cơ sở quân sự quy mô lớn do '§HTổ Chức Sáng Kiến Đình Chiến§!' xây dựng. Đây là một liên minh bán thường trực gồm ít nhất năm thế lực liên sao hùng mạnh và vô cùng tiên tiến, từng hoạt động trong khu vực thiên hà này vào khoảng 75.000 năm trước.\n\nBản chất chính xác của liên minh này vẫn chưa được làm rõ, nhưng có vẻ nó được thành lập nhằm chấm dứt ngay lập tức một số cuộc chiến quy mô thiên hà kéo dài. Mỗi thành viên của Sáng Kiến Đình Chiến đều điều động một lượng lớn các phân đội quân sự đóng quân tại căn cứ trên mặt trăng này."
 ancrel.6160.name:0 "Phe Giao Chiến B"
 ancrel.6160.desc:0 "Hành tinh bị phong ấn trong hệ sao này là thủ đô của một đế chế hiếu chiến, mà Tổ Chức Sáng Kiến Đình Chiến đang nỗ lực ngăn chặn cuộc chiến của họ. Tên của đế chế này vẫn còn là bí ẩn—trong các hồ sơ của Sáng Kiến được phục hồi cho đến nay, chúng chỉ được gọi đơn giản là '§HPhe Giao Chiến B§!'.\n\nRõ ràng, Tổ Chức Sáng Kiến Đình Chiến muốn dùng Phe Giao Chiến B làm tấm gương. Sau khi xâm nhập không phận và giành thắng lợi trong vài trận chiến cam go, Tổ Chức Sáng Kiến đã vĩnh viễn giam cầm hành tinh quê hương của Phe B trong một lá chắn năng lượng. Họ cũng xây dựng một căn cứ quân sự trên vệ tinh gần đó để duy trì hoạt động của lá chắn hành tinh, đồng thời làm trạm trú ngụ cho lực lượng phản ứng nhanh nhằm phòng ngừa chiến dịch kiềm chế thất bại."
 ancrel.6165.name:0 "Máy Tạo Lá Chắn"
 ancrel.6165.desc:0 "Lúc đầu, căn cứ vệ tinh hoạt động trong nhiều thế kỷ, nhưng vì không có dấu hiệu cho thấy chiến dịch phong tỏa bị thất bại, lực lượng quân sự đồn trú đã dần dần rút bớt. Về sau, cùng với sự thay đổi liên minh và xung đột nội bộ giữa các thành viên Tổ Chức Sáng Kiến, căn cứ vệ tinh này cuối cùng bị bỏ hoang hoàn toàn.\n\nHệ thống tự động vẫn được duy trì để bảo đảm lá chắn quanh quê hương của Phe B vẫn hoạt động. Thật đáng kinh ngạc, cho đến tận bây giờ, chúng vẫn hoạt động bình thường. Đáng tiếc là, khi các nhà khảo cổ của ta đào một đường hầm tiến vào phòng tạo lá chắn dưới lòng đất, một dây cáp năng lượng cốt lõi đã bị cắt đứt. Sau 75.000 năm hoạt động liên tục, lá chắn giờ đây đã không còn nữa."

 site_minigalaxy_2:0 "Hành Tinh Đô Thị Bị Bỏ Hoang"
 site_minigalaxy_2_intro:0 "Hành tinh cổ đại bị bỏ hoang này đã bị giam cầm trong một lớp rào chắn năng lượng bất khả xâm phạm suốt khoảng 75.000 năm. Nó từng là một hành tinh đô thị tràn đầy sức sống, nơi cư trú của hàng tỷ người, nhưng giờ đây các con phố và tòa nhà đều bị bỏ hoang, cư dân ban đầu trên hành tinh cũng bặt vô âm tín."
 ancrel.6170.name:0 "Mất Tích"
 ancrel.6170.desc:0 "Sự biến mất của cư dân bản địa trên hành tinh này vẫn là một ẩn số. Khi lá chắn được kích hoạt, họ bị cắt đứt liên lạc với phần còn lại của đế chế liên sao, nhiều khả năng họ phải đối mặt với nạn đói trầm trọng và bạo loạn trong nước, bởi họ phải dốc hết sức để nuôi sống số lượng dân thủ đô khổng lồ bằng nguồn tài nguyên eo hẹp.\n\nTuy nhiên, không có dấu hiệu nào cho thấy họ đã dọn dẹp một phần đất đai của hành tinh đô thị để canh tác. Cũng không có bất kỳ chứng cứ nào về các trận chiến lớn diễn ra sau khi lá chắn được dựng lên, cư dân không để lại di hài, hóa thạch hay bất cứ di tích nào. Dường như họ chỉ đơn giản là bốc hơi vào không khí."
 ancrel.6175.name:0 "Ngày Sơ Tán"
 ancrel.6175.desc:0 "Những con phố trống không đến rợn người trong thành phố hành tinh bị bỏ hoang này vẫn không cho ta biết chuyện gì đã xảy ra với những cư dân ban đầu. Một vài tờ áp phích và tờ rơi được tìm thấy có nhắc đến một sự kiện gọi là §H'Ngày Sơ Tán'§!, trong đó có in hình ảnh của các hệ sao mà các nhà thiên văn học của ta không hề biết tới:\n\n§H'Ngày Sơ Tán—đã đến. Hãy đến trung tâm định cư gần nhất ngay lập tức và bắt đầu một cuộc sống mới.'§!"
 ancrel.6180.name:0 "Kế Hoạch Cuối Cùng"
 ancrel.6180.desc:0 "Toàn bộ hành tinh đã hoàn toàn bị bỏ hoang sau 'Ngày Sơ Tán', nhưng rốt cuộc họ đã làm điều đó bằng cách nào? Chẳng có bằng chứng nào cho thấy lá chắn năng lượng của hành tinh từng bị suy yếu.\n\nCác manh mối tìm được chỉ ra rằng, trước khi lá chắn xuất hiện, cư dân bản địa trên hành tinh đang tiến hành một dự án nghiên cứu quy mô lớn nào đó. Ngày càng nhiều tài nguyên và chuyên gia được chuyển sang dự án này, và hoạt động này dường như được đẩy mạnh đáng kể sau khi lá chắn được dựng lên."
 ancrel.6185.name:0 "Thiên Hà Thu Nhỏ"
 ancrel.6185.desc:0 "Sau một cuộc tìm kiếm gắt gao, ta đã khám phá ra tung tích của những cư dân bản địa trên [From.Planet.GetName]. Sâu trong một công trình được bao bọc bởi những bức tường cao gần cực bắc của hành tinh, ta tìm thấy một di vật, mà các nhà khảo cổ tin chắc rằng nó chứa một thiên hà thu nhỏ bên trong.\n\nBằng một cách nào đó, sau khi tạo ra thiên hà này, những người dân của hành tinh diệt vong đã di cư vào trong, rồi dùng một loại trường không gian con không thể xuyên thủng để phong ấn thiên hà lại trong vật chứa này. Tuy không thể can thiệp trực tiếp vào chính thiên hà đó, nhưng chúng ta có thể nghiên cứu nó."

 site_star_petal:0 "Công Trình Trong Hành Tinh Khí Khổng Lồ"
 site_star_petal_intro:0 "Một trạm không gian bỏ hoang khổng lồ đang bị mắc kẹt trong bầu khí quyển của hành tinh khí khổng lồ này, và đang từ từ chìm vào trung tâm của nó. Trọng lượng của chính nó có khả năng sẽ phá hủy hoàn toàn trạm không gian này trong thiên niên kỷ tới.\n\nMay mắn là trạm không gian này chưa trôi dạt quá sâu vào khí quyển, ta vẫn có thể tiến hành khảo cổ học trên đó."
 ancrel.6200.name:0 "Cung Điện Hưởng Lạc"
 ancrel.6200.desc:0 "Bên trong tối tăm và tĩnh lặng như tờ của trạm không gian này dường như đã xóa mờ đi quá khứ huy hoàng của nó - từng là một cung điện hưởng lạc xa hoa. Nơi đây có vô số những cỗ máy đánh bạc rỉ sét, hàng trăm quán rượu và nhà hàng xiêu vẹo, nằm rải rác là hàng ngàn cái xác chết.\n\nNhững xác chết người ngoài hành tinh đã bị ướp xác một phần nằm la liệt này thuộc về ít nhất hàng chục giống loài khác nhau, nhưng đa số đều tập trung quanh khu vực các bến đỗ tàu thoát hiểm trống trơn."
 ancrel.6205.name:0 "Cánh Hoa Tinh Tú"
 ancrel.6205.desc:0 "Gần một thiên niên kỷ trước, trạm không gian bỏ hoang này từng mang tên '§HCánh Hoa Tinh Tú§!' và được biết đến như một khu nghỉ dưỡng xa xỉ vang danh khắp một góc thiên hà. Mỗi năm, một đội tàu kéo nhỏ sẽ lai dắt trạm không gian này tới những vùng đất xa lạ chưa từng đặt chân tới, và có vẻ như [From.Planet.GetName] là điểm dừng chân cuối cùng của nó.\n\nVì những lý do chưa được làm rõ, trạm không gian này đã bị kéo vào bầu khí quyển của hành tinh khí khổng lồ này và bị hư hại nặng nề tại đây."
 ancrel.6210.name:0 "Những Ngày Cuối Cùng"
 ancrel.6210.desc:0 "Các nhà khảo cổ làm việc trên 'Cánh Hoa Tinh Tú' đã thu thập đủ manh mối và bằng chứng để vẽ nên một bức tranh khá rõ nét về những ngày tháng cuối cùng của trạm không gian này. Một tiểu hành tinh đi lạc đã đâm trúng nó, khiến trạm chệch hướng và không lâu sau đã chìm vào bầu khí quyển của [From.Planet.GetName].\n\nHệ thống đẩy kiểm soát quỹ đạo của trạm không thể đưa nó trở lại đúng hướng, và đội ngũ chỉ huy đã ngay lập tức ra lệnh sơ tán. Không may thay, số lượng tàu thoát hiểm trên trạm chỉ đủ cho một phần nhỏ hành khách, dẫn đến một cuộc hoảng loạn tập thể. Những ai không bị giẫm đạp đến chết thì cũng bỏ mạng khi trạm không gian rơi xuống sâu trong hành tinh khí khổng lồ do hệ thống hỗ trợ sự sống bị vô hiệu hóa."
 ancrel.6215.name:0 "Trái Tim Thổn Thức"
 ancrel.6215.desc:0 "Khi khám xét các quán cà phê an ninh, nơi những vị khách giàu có nhất của 'Cánh Hoa Tinh Tú' cất giữ tài sản cá nhân, ta đã tìm thấy một kho báu chứa đầy những món đồ cổ kỳ lạ và đồ trang sức. Đáng chú ý nhất trong số đó có lẽ là 'Trái Tim Thổn Thức'—một sợi dây chuyền kim cương độc nhất vô nhị, từng nổi đình nổi đám một thời, và được ít nhất năm vị nguyên thủ quốc gia đeo qua."

 site_setback:0 "Một trở ngại không nhỏ."
 site_delay:0 "Việc này sẽ gây ra một chút trì hoãn."
 site_success:0 "Thật là hú vía."

 ancrel.8000.intro:0 "Trong quá trình sơ tán tại địa điểm khảo cổ trên [From.Planet.GetName], một hệ thống lưới laser cổ đại nhưng vẫn còn hoạt động đã vô tình bị kích hoạt."
 ancrel.8000.critical:0 "Lưới laser di chuyển cực nhanh, cắt §H[dead_scientist.GetName]§! và vài [Root.Owner.GetArchaeologistPlural] khác thành từng mảnh vụn."
 ancrel.8000.failure:0 "Vài [Root.Owner.GetArchaeologistPlural] bị cắt thành nhiều mảnh bởi mạng lưới di chuyển với tốc độ chóng mặt. Mặc dù §H[Root.GetLeaderName]§! may mắn thoát nạn, nhưng những tổn thất này đã giáng một đòn mạnh vào dự án."
 ancrel.8000.success:0 "May thay, nhờ sự nhanh trí của §H[Root.GetLeaderName]§!, lưới laser đã bị vô hiệu hóa trước khi gây ra bất cứ thương vong nào. Tiến độ dự án tiếp tục diễn ra, thậm chí còn vượt mong đợi."
 ancrel.8000.pay:0 "Lưới laser đã chặn ngang con đường độc đạo. Phí tổn vô hiệu hóa chúng là rất lớn, nhưng nếu phải tìm một con đường khác vòng qua thì sẽ tiêu tốn cực kỳ nhiều thời gian."
 ancrel.8000.name:0 "Kích Hoạt Lưới Laser"
 ancrel.8000.desc:0 "$ancrel.8000.intro$\n\n$ancrel.8000.critical$"
 ancrel.8001.desc:0 "$ancrel.8000.intro$\n\n$ancrel.8000.failure$"
 ancrel.8002.desc:0 "$ancrel.8000.intro$\n\n$ancrel.8000.success$"
 ancrel.8003.desc:0 "$ancrel.8000.intro$\n\n$ancrel.8000.pay$"
 ancrel.8003.a:0 "Vô hiệu hóa mạng lưới."
 ancrel.8003.b:0 "Họ đành phải đi đường vòng."

 ancrel.8010.intro:0 "Đội ngũ [Root.Owner.GetArchaeologistPlural] của ta đang làm việc trên [From.Planet.GetName] vô tình kích hoạt một mạng lưới pháo gác tự động cổ đại nhưng vẫn còn khả năng nhả đạn."
 ancrel.8010.critical:0 "Pháo tự động đã khai hỏa cực nhanh và kết liễu §H[dead_scientist.GetName]§! cùng vài [Root.Owner.GetArchaeologistPlural] khác trước khi bị tắt."
 ancrel.8010.failure:0 "Một số [Root.Owner.GetArchaeologistPlural] đã mắc kẹt trong khu vực giao tranh của chúng. §H[Root.GetLeaderName]§! cuối cùng cũng tìm được cách tắt các ụ pháo đó, nhưng thương vong là không thể tránh khỏi."
 ancrel.8010.success:0 "Thật may mắn, §H[Root.GetLeaderName]§! đã thành công trong việc vô hiệu hóa những ụ pháo tự động đó trước khi có ai bị thương."
 ancrel.8010.pay:0 "Không ai bị thương, nhưng những ụ pháo đã án ngữ lối đi duy nhất. Nếu không thể vô hiệu hóa chúng, [Root.Owner.GetArchaeologistPlural] của ta sẽ phải cất công tìm hướng đi khác."
 ancrel.8010.name:0 "Pháo Gác Bị Kích Hoạt"
 ancrel.8010.desc:0 "$ancrel.8010.intro$\n\n$ancrel.8010.critical$"
 ancrel.8011.desc:0 "$ancrel.8010.intro$\n\n$ancrel.8010.failure$"
 ancrel.8012.desc:0 "$ancrel.8010.intro$\n\n$ancrel.8010.success$"
 ancrel.8013.desc:0 "$ancrel.8010.intro$\n\n$ancrel.8010.pay$"
 ancrel.8013.a:0 "Vô hiệu hóa những ụ pháo này."

 ancrel.8020.intro:0 "Một cỗ máy nghiền lang thang, được thiết kế để phục kích những nhà thám hiểm lơ đễnh, đã chạm trán với nhóm [Root.Owner.GetArchaeologistPlural] của ta trên [From.Planet.GetName]."
 ancrel.8020.critical:0 "Trước khi cơn cuồng nộ chấm dứt, cỗ máy bán tri giác cổ đại đã nghiền nát §H[dead_scientist.GetName]§! thành đống bầy nhầy."
 ancrel.8020.failure:0 "§H[Root.GetLeaderName]§! đã kịp thời cứu vớt được một mạng sống khỏi tay con robot cuồng loạn, nhưng các [Root.Owner.GetArchaeologistPlural] khác thì không được may mắn như vậy."
 ancrel.8020.success:0 "Bằng kinh nghiệm dày dặn và một chút may mắn, §H[Root.GetLeaderName]§! đã cố gắng trấn an cỗ máy đang phát điên trước khi bất kỳ ai bị thương."
 ancrel.8020.pay:0 "Mọi người đều muốn tránh xa con robot điên loạn, nhưng nó lại tuần tra ngày đêm trên con đường tiến công độc nhất của ta. Nếu không thể tắt nó đi, [Root.Owner.GetArchaeologistPlural] của ta đành phải tìm đường khác."
 ancrel.8020.name:0 "Máy Nghiền Cuồng Loạn"
 ancrel.8020.desc:0 "$ancrel.8020.intro$\n\n$ancrel.8020.critical$"
 ancrel.8021.desc:0 "$ancrel.8020.intro$\n\n$ancrel.8020.failure$"
 ancrel.8022.desc:0 "$ancrel.8020.intro$\n\n$ancrel.8020.success$"
 ancrel.8023.desc:0 "$ancrel.8020.intro$\n\n$ancrel.8020.pay$"
 ancrel.8023.a:0 "Tắt con robot đó đi."

 ancrel.8030.intro:0 "Nhóm [Root.Owner.GetArchaeologistPlural] của ta trong lúc tiến hành khai quật khảo cổ trên [From.Planet.GetName] đã vô tình kích hoạt một số người nhân tạo cổ đại theo cách khó hiểu nào đó."
 ancrel.8030.critical:0 "Những người nhân tạo hung hãn này đã nhanh chóng hạ sát §H[dead_scientist.GetName]§! trước khi bị hỏa lực vũ khí bắn hạ. "
 ancrel.8030.failure:0 "Đám người nhân tạo thù địch đã kịp lấy mạng vài [Root.Owner.GetArchaeologistPlural] trước khi bị §H[Root.GetLeaderName]§! chặn đứng."
 ancrel.8030.success:0 "Đội ơn trời đất là §H[Root.GetLeaderName]§! cùng nhân viên an ninh gần đó đã tắt nguồn những người nhân tạo thù địch này trước khi chúng kịp gây thương tích nghiêm trọng."
 ancrel.8030.pay:0 "Đám người nhân tạo thù địch tạm thời bị khống chế, nhưng chúng ta vẫn không thể vượt qua chúng. Trừ khi khiến những cỗ máy này ngừng hoạt động hoàn toàn, nếu không ta bắt buộc phải tìm một lối đi khác."
 ancrel.8030.name:0 "Người Máy Gác Cổng"
 ancrel.8030.desc:0 "$ancrel.8030.intro$\n\n$ancrel.8030.critical$"
 ancrel.8031.desc:0 "$ancrel.8030.intro$\n\n$ancrel.8030.failure$"
 ancrel.8032.desc:0 "$ancrel.8030.intro$\n\n$ancrel.8030.success$"
 ancrel.8033.desc:0 "$ancrel.8030.intro$\n\n$ancrel.8030.pay$"
 ancrel.8033.a:0 "Tiêu diệt những người máy này."

 asteroid_vault_1:0 "Tiểu Hành Tinh Kỳ Lạ"
 asteroid_vault_1_desc:0 "Dù thoạt nhìn có vẻ bình thường, nhưng việc kiểm tra kỹ lưỡng hơn trên [From.Planet.GetName] chỉ ra rằng nó thực chất là một cấu trúc nhân tạo được ngụy trang dưới dạng thiên thể tự nhiên."
 ancrel.101.name:0 "Tiểu Hành Tinh Kỳ Lạ"
 ancrel.101.desc:0 "Dù thoạt nhìn có vẻ bình thường, nhưng việc kiểm tra kỹ lưỡng hơn trên [From.Planet.GetName] chỉ ra rằng nó thực chất là một cấu trúc nhân tạo được ngụy trang dưới dạng thiên thể tự nhiên."
 ancrel.101.a:0 "Điều tra nó!"
 ancrel.102.name:1 "Cánh Cửa Kỳ Lạ"
 ancrel.102.desc:0 "Khi con tàu nghiên cứu tiến gần [From.Planet.GetName], một cánh cửa khổng lồ, in hằn dấu vết phong hóa lộ ra. Rốt cuộc ai đã xây dựng cỗ máy khổng lồ này, và mục đích của nó là gì? Có lẽ đáp án nằm ở bên trong."
 ancrel.102.a:0 "Mở cánh cửa này ra cho ta!"
 ancrel.103.name:0 "Kho Báu Tiểu Hành Tinh"
 ancrel.103.desc:0 "Việc mở hầm chứa mang đến nhiều câu hỏi hơn là giải đáp. Bên trong chứa đủ thứ kỳ quặc, từ đồ bỏ đi cho đến những cổ vật có khả năng thuộc về các đế chế đã bị lãng quên. Cần một khoảng thời gian để phân loại chúng, nhưng chúng ta thực sự đã tìm thấy vài thứ hữu ích."
 ancrel.103.a:0 "Một điều bất ngờ!"
 it_was_aliens_site:0 "Đống Đổ Nát"
 it_was_aliens_site_desc:0 "Đống đổ nát rải rác khắp [From.Planet.GetName], nhưng kỳ lạ thay, dựa theo mô hình phát nổ, có vẻ như một loạt vụ nổ hạt nhân dưới lòng đất là nguyên nhân gây ra thảm họa này, chứ không phải các vụ nổ hạt nhân trên khí quyển hay oanh tạc quỹ đạo thông thường. Điều này cần được làm rõ, có thể một cuộc khai quật khảo cổ sẽ tiết lộ chân tướng sự việc ở đây."
 ancrel.104.name:0 "Băng Qua Đống Đổ Nát"
 ancrel.104.desc:0 "Thảm họa này dường như đã quét sạch mọi thứ, nhưng một vài hồ sơ rời rạc vẫn còn sót lại. Có vẻ như cư dân của [From.Planet.GetName] đã bị ám ảnh bởi suy nghĩ rằng có những kẻ ngoài hành tinh đang theo dõi họ. Những báo cáo dồn dập về UFO, hiện tượng cắt xén động vật và bắt cóc bí ẩn đã đẩy cả hành tinh vào trạng thái điên loạn. Để đối phó với sự giám sát này, vô số tài nguyên đã được đổ vào các mảng cảm biến khổng lồ, hệ thống phòng không chống tàu vũ trụ và các hầm trú ẩn ngầm để bảo vệ người dân."
 ancrel.105.name:0 "Phát Hiện Hồ Sơ"
 ancrel.105.desc:0 "Từ những ghi chép vụn vặt, ta đã lắp ghép được nhiều tình tiết hơn. Khi hành tinh này ném ngày càng nhiều tài nguyên vào những biện pháp chống UFO vô dụng, nền kinh tế và xã hội của họ bắt đầu sụp đổ. Tình trạng thiếu điện và lương thực lan rộng ở nhiều vùng, tiến bộ công nghệ trong hầu hết các lĩnh vực bị chững lại, và một cảm giác tuyệt vọng sâu sắc len lỏi vào mọi tầng lớp xã hội. Trong đống thông tin hỗn loạn, ta phát hiện một thứ gọi là \"Lá Chắn Tối Thượng\", loại lá chắn này ngày càng trở nên phổ biến khi tình hình trên [From.Planet.GetName] xấu đi."
 ancrel.106.name:0 "Tiết Lộ Số Phận"
 ancrel.106.desc:0 "Từ kho dữ liệu rách nát tại một căn cứ quân sự kiên cố, ta đã biết được số phận bi thảm của [From.Planet.GetName]. Do nền kinh tế sụp đổ hoàn toàn, hệ thống chống UFO ngừng hoạt động, giới cầm quyền của [From.Planet.GetName] đã quyết định khởi động \"Lá Chắn Tối Thượng\" của họ. Tuy nhiên, đây chẳng phải tấm khiên để bảo vệ [From.Planet.GetName], trái lại, nó là một cuộc hủy diệt hạt nhân toàn diện lên dân cư và cơ sở hạ tầng, nhằm đảm bảo cả hai đều không lọt vào tay lũ xâm lăng ngoại lai. Việc họ đưa ra quyết định này rõ ràng là do bị kích động bởi 'tín hiệu ngoài hành tinh' phát ra từ [arc_anomaly_planet.GetName]."
 ancrel.107.name:0 "Khám Phá Sự Thật"
 ancrel.107.nothing.desc:0 "Cuộc rà soát toàn diện trên [From.Planet.GetName] chứng tỏ nơi này chẳng có bất kỳ liên hệ nào với sự sống ngoài hành tinh. Hoặc là chưa từng có tín hiệu ngoài hành tinh nào phát ra từ đây, hoặc là vì lý do nào đó mà nó không để lại vết tích. Cho dù sự thật là gì, cuộc khảo sát [From.Planet.GetName] cũng chỉ ra rằng nơi đây có chứa vài mỏ khoáng sản."
 ancrel.107.junk.desc:0 "Đã tìm thấy nguồn phát \"tín hiệu ngoài hành tinh\", tuy nhiên đây không phải là cuộc xâm lăng của lũ người ngoài hành tinh ẩn nấp nào cả. Thực chất, tín hiệu bắt nguồn từ một cột mốc thăm dò cổ đại, có lẽ do một thiết bị thăm dò tự động dựng lên sau khi phát hiện một mỏ quặng nhỏ có giá trị trên [From.Planet.GetName]. Cột mốc này đã bị hỏng, chỉ có thể phát ra những tín hiệu yếu ớt và đứt quãng."
 ancrel.107.aliens1.desc:0 "Nguồn phát tín hiệu ngoài hành tinh trên [From.Planet.GetName] là một tiền đồn bỏ hoang với thiết kế kỳ lạ. Từ những tài liệu bị bỏ lại, có thể thấy kế hoạch của họ không phải là dàn dựng một cuộc xâm lược, mà là cố gắng thiết lập liên lạc với [arc_site_planet.GetName] và giới thiệu họ với các nền văn minh khác trong thiên hà."
 ancrel.107.aliens2.desc:0 "Nguồn phát tín hiệu ngoài hành tinh trên [From.Planet.GetName] là một tiền đồn bỏ hoang với thiết kế kỳ lạ. Cơ sở dữ liệu bị bỏ lại chứa đựng những kế hoạch xâm lược chi tiết, với ý đồ sau khi chiếm đóng [arc_site_planet.GetName] sẽ sử dụng các \"nông trại đau khổ\" để làm mềm thịt của dân bản địa cho dễ tiêu hóa."
 ancient_battle_site_desc:0 "Việc quét trên [From.Planet.GetName] cho thấy sự hiện diện của một lượng lớn các vật thể có dấu vết chế tác và các chất phóng xạ rải rác trong khu vực, nhưng từ quỹ đạo thì không thể nhìn rõ chi tiết. Để biết thêm thông tin, ta cần hạ cánh để tiến hành điều tra thực địa."
 omnirelic_site:0 "$ancrel.21.name$"
 cool_relic_world_site_desc:0 "Toàn bộ hành tinh được bao phủ bởi những công trình kiến trúc đồ sộ, đô thị khổng lồ bị lãng quên này chắc chắn đang ẩn chứa những bí mật chờ được khám phá."
 ancrel.108.name:0 "Tàn Tích Chiến Trường Cổ"
 ancrel.108.desc:1 "Ta đã phát hiện khoáng sản tinh chế, dù cần phải nghiên cứu thêm, nhưng chúng ta bước đầu cho rằng đây là một tàn tích chiến trường khổng lồ. Có vẻ như, một phe đã thả quân từ quỹ đạo xuống và đụng độ với lực lượng phòng thủ trên hành tinh. Tại sao phe tấn công lại không tiến hành ném bom quỹ đạo? Ai là người chiến thắng cuối cùng? Mọi thứ vẫn còn bỏ ngỏ."
 ancrel.109.name:0 "Sự Oán Hận Bị Lãng Quên"
 ancrel.109.desc:1 "Ta đi đến kết luận rằng, đạo quân từ 'Kẻ Hủy Diệt', một tộc du mục từ chiều không gian cao hơn, đã xâm lược [From.Planet.GetName]. Khi cuộc xâm lược xảy ra, hành tinh này thuộc về 'Lực Lượng Kháng Chiến', một liên minh bao gồm nhiều giống loài khác nhau. Thông qua những mảnh ghi chép vỡ vụn, ta nhận ra cuộc chiến này chủ yếu diễn ra ở các phần khác của thiên hà, và [From.Planet.GetName] là nỗ lực của Lực Lượng Kháng Chiến trong việc tạo ra một thuộc địa bí mật ngoài tầm với của 'Kẻ Hủy Diệt'. Kết quả của chiến dịch này và toàn bộ cuộc chiến vẫn chưa được giải đáp, nhưng việc nghiên cứu tàn tích của các cỗ máy chiến tranh đã mang lại một vài thông tin quý giá."
 zroni_digsite_1_desc:1 "Một thuộc địa cổ đại được lập nên bởi một nền văn minh vô danh. Dù không có bất kỳ dấu hiệu thảm họa nào, nhưng rõ ràng những người định cư này đã đột ngột rời bỏ khu định cư. Rốt cuộc chuyện gì đã xảy ra ở đây?"
 zroni_digsite_2_desc:1 "Tọa độ thu thập được từ thuộc địa Zroni bị bỏ hoang đã dẫn ta đến nơi này. Ta cần bắt tay vào thám hiểm lần nữa, để khảo sát hành tinh thoạt nhìn có vẻ bình thường này."
 zroni_digsite_3_desc:1 "Những gì ta từng điều tra chỉ toàn là các thuộc địa bị bỏ hoang, nhưng theo manh mối từ di chỉ khảo cổ trước đó, [From.Planet.GetName] dường như có một ngôi đền bị bỏ hoang. Tại sao nơi đó lại mang ý nghĩa tâm linh quan trọng đối với nhóm người này?"
 zroni_digsite_4_desc:1 "Từ ngôi đền Zroni đó, ta đã phát hiện tọa độ của một khu phức hợp nghiên cứu. Cảm biến quỹ đạo không thể tìm thấy bất kỳ tín hiệu cộng hưởng nào của tinh thể ký ức, ta cần phải hạ cánh xuống bề mặt để nghiên cứu sâu hơn."
 zroni_digsite_5_desc:1 "Tất cả các hành tinh Zroni từng được khám phá trước đây đều không thể sánh với [From.Planet.GetName] về tầm quan trọng khảo cổ. Một số công trình kiến trúc trên [From.Planet.GetPlanetMoon] này thậm chí có thể nhìn thấy bằng mắt thường từ vũ trụ. [From.GetName] chắc chắn từng là hành tinh trung tâm của đế chế Zroni."
 zroni_digsite_6_desc:1 "Có thể nói hành tinh Zroni là một vòng xoáy của các hoạt động tâm linh. Trước khi cố gắng cử một nhóm đổ bộ xuống bề mặt, ta cần phải hiệu chỉnh lại thiết bị dò tìm tinh thể ký ức đã dùng trước đây."
 zroni_digsite_1:0 "Tàn Tích Thuộc Địa Bị Bỏ Hoang"
 zroni_digsite_2:0 "Đèn Tín Hiệu Zroni"
 zroni_digsite_3:0 "Đền Thờ Zroni"
 zroni_digsite_4:0 "Trạm Nghiên Cứu Zroni"
 zroni_digsite_5:0 "Hành Tinh Lõi Zroni"
 zroni_digsite_6:0 "Hành Tinh Zroni"
 NAME_Zroni: "Tộc Zroni"
 ancrel.1.name:0 "Tàn Tích Bí Ẩn"
 ancrel.1.desc:0 "Trên [From.Planet.GetName] tồn tại tàn tích của một thuộc địa cổ đại bị bỏ hoang. Từ những quan sát trên quỹ đạo, không có dấu hiệu rõ ràng nào cho thấy đã có thảm họa cướp đi sinh mạng của lượng lớn cư dân hay buộc họ phải tháo chạy khỏi thuộc địa. Nếu muốn tìm câu trả lời, một chiến dịch điều tra thực địa là điều không thể tránh khỏi."
 ancrel.2.desc:1 "Tàn tích kỳ lạ này ngoài việc thiếu sự chăm sóc thì không có dấu hiệu hư hại nào. Nhà ở, nhà máy, các tòa nhà không rõ chức năng, khắp nơi trống rỗng, không một bóng người. Mọi người đã đi đâu hết? Có vẻ như ta sẽ tìm được câu trả lời trong một tòa nhà lớn ngay trung tâm thuộc địa."
 ancrel.3.name:0 "Tinh Thể Kỳ Lạ"
 ancrel.3.desc:1 "Tại nơi mà giờ ta tin là trung tâm chính quyền của thuộc địa, ta đã phát hiện một khối tinh thể khổng lồ. Từ một góc độ khó có thể diễn tả bằng lời, tinh thể này dường như muốn được khám phá, và đang cố gắng giao tiếp với ta. Có lẽ cùng với sự đào sâu nghiên cứu, ta có thể trao đổi với nó?"
 ancrel.3.a:0 "Tiến hành thăm dò tinh thể"
 ancrel.4.desc:1 "Trải qua bao thăng trầm thử thách của mẹ thất bại, nghiên cứu của ta đã đạt được bước tiến lớn. Khối tinh thể này là một dạng lưu trữ tâm linh, nhưng đáng tiếc là, những ghi chép bên trong đã vỡ nát và không còn nguyên vẹn.\n\nTheo những gì ta biết, đây từng là một thuộc địa của tộc §HZroni§!, họ là một giống loài sở hữu thiên phú tâm linh, và đã khám phá ra cõi không gian mà ta gọi là 'Cõi Hư Vô'. Khi dân số của tộc Zroni tăng đến một ngưỡng nhất định, dường như tiềm thức tập thể của họ bắt đầu giao thoa với Cõi Hư Vô nguyên thủy trong những giấc mơ, điều này dẫn đến vô số giấc mơ sáng suốt. Ngay sau đó, tộc Zroni bắt đầu nghiên cứu hiện tượng kỳ lạ này, và tìm ra phương pháp dùng năng lực tâm linh để phóng chiếu bản thân vào Cõi Hư Vô. Tại Cõi Hư Vô, họ nhận ra mình có thể tận dụng sức mạnh tâm linh để chi phối cấu trúc hiện thực theo ý muốn.\n\nKhông lâu sau, tộc Zroni phát hiện họ có thể tiến vào Cõi Hư Vô bằng xương bằng thịt và sống một cuộc sống như những vị thần, nhào nặn chiều không gian Hư Vô theo sở thích của họ...\n\nHồ sơ lưu trữ dừng lại ở đây, không có bất kỳ thông tin nào cho ta biết chuyện gì đã xảy ra với khu định cư trên [From.Planet.GetName] sau đó. Tuy nơi này không còn câu trả lời nào nữa, nhưng chúng ta biết được vẫn còn một thuộc địa Zroni khác, có lẽ nơi đó đang cất giữ một kho lưu trữ hoàn chỉnh hơn..."
 ancrel.5.desc:0 "Trên [From.Planet.GetName] tồn tại một thuộc địa Zroni bị bỏ hoang khác. Để truy tìm sự thật ẩn giấu, việc đầu tiên ta cần làm là tìm và mở khóa kho lưu trữ tâm linh trên hành tinh này."
 ancrel.6.desc:1 "Dựa vào quy trình đã thiết lập từ cuộc điều tra tinh thể trước đó, lần này việc kết nối với khối tinh thể này trở nên dễ như trở bàn tay. Dữ liệu trong tinh thể này cũng không trọn vẹn, nhưng chúng ta đã phát hiện ra một ưu điểm vượt trội khác của việc tiến vào Cõi Hư Vô, đó là Cõi Hư Vô kết nối đồng thời với toàn bộ hệ sao trong thực tại, và có thể là cả mọi ngóc ngách của toàn vũ trụ.\n\nNếu một người có thể bước vào Cõi Hư Vô, điều đó cũng đồng nghĩa với việc họ có thể xuất hiện từ bất kỳ địa điểm nào đã biết, khả năng 'bước nhảy tâm linh' giữa bất kỳ địa điểm thực tế nào này đã giúp tộc Zroni phủ sóng khắp thiên hà. Vì dành phần lớn thời gian ở Cõi Hư Vô, số lượng thuộc địa vĩnh viễn của tộc Zroni tương đối ít, và hầu hết đều nằm gần hành tinh quê hương.\n\nKhối tinh thể này đã cho ta biết vị trí của một ngôi đền khác."
 ancrel.7.desc:1 "Giờ đây ta có thể dễ dàng tìm thấy kho lưu trữ tâm linh và đọc thông tin bên trong. Gần như ngay khi đội khảo sát của ta vừa hạ cánh thì việc kết nối đã hoàn thành, sau đó ta có thể nắm bắt thêm các tài liệu và khái niệm chi tiết hơn. Từ đó, ta biết được rằng, việc Cõi Hư Vô ban cho tộc Zroni địa vị thần thánh không phải là món hời từ trên trời rơi xuống.\n\nNhững thay đổi dời non lấp biển trong Cõi Hư Vô đòi hỏi một lượng năng lượng khổng lồ, và nguồn năng lượng này phải đến từ đâu đó, tộc Zroni cuối cùng đã phát hiện ra, lỗ đen khổng lồ ở trung tâm hệ sao chính là nguồn cung cấp năng lượng. Khi tộc Zroni không ngừng nhào nặn Cõi Hư Vô, phạm vi ảnh hưởng của điểm kỳ dị lỗ đen cũng bành trướng, nuốt chửng một lượng lớn khối lượng ở trung tâm hệ sao và chuyển hóa chúng thành năng lượng để bơm vào Cõi Hư Vô. Khám phá này đã làm chấn động toàn bộ tộc Zroni, dần dần những cuộc thảo luận biến thành cãi vã, thành rạn nứt, và cuối cùng bùng nổ thành cuộc nội chiến giữa hai phe phái lớn."
 ancrel.8.desc:2 "Từ khối tinh thể, ta đã moi ra được những tình tiết sâu xa hơn về cuộc nội chiến giữa hai phe. Một phe, được gọi là 'Phe Thăng Thiên', họ cho rằng vận mệnh của vũ trụ thực tại chẳng mảy may liên quan đến tộc Zroni, họ hoàn toàn có thể tiếp tục cuộc sống tự tung tự tác trong Cõi Hư Vô cho đến khi toàn bộ hệ sao bị nuốt chửng trong tương lai xa thẳm—thậm chí đến lúc đó, vẫn còn những hệ sao khác để tiêu thụ, hay thậm chí các vũ trụ khác cũng có thể trở thành nhiên liệu cho tộc Zroni.\n\nPhe còn lại, gọi là 'Phe Phúc Âm', họ phản đối kịch liệt quan điểm của 'Phe Thăng Thiên'—tộc Zroni không nên hủy diệt toàn bộ thiên hà chỉ vì cuộc sống như thần tiên của bản thân! Kể cả khi rời khỏi Cõi Hư Vô, tài năng tâm linh cũng đủ để họ có một cuộc sống như ở chốn không tưởng.\n\nMặt khác, vị trí của một tiền đồn nghiên cứu của tộc Zroni đã được cập nhật vào cơ sở dữ liệu của ta."
 ancrel.9.desc:2 "Điều kỳ lạ là, rất khó để định vị kho lưu trữ trên [From.Planet.GetName] bằng phương pháp đo đạc tam giác—nhưng một khi tìm thấy nó, thì lý do gây khó khăn cho việc tìm kiếm trước đó đã dễ dàng được lý giải: kho lưu trữ tinh thể ở đây đã bị phá hoại có chủ đích, và không còn ghi chép nào để ta có thể truy cập. Tuy nhiên, ta đã dò được một tín hiệu yếu ớt xung quanh đó, có lẽ hy vọng vẫn chưa dập tắt."
 ancrel.9.a:0 "Tiếp tục tìm kiếm"
 ancrel.10.desc:2 "Trong một nơi giống như phòng thí nghiệm, ta đã xác định được vị trí của một tinh thể tâm linh nhỏ hơn nhiều. Từ các hồ sơ, ta biết được rằng, những người Zroni này vô cùng phiền muộn, đồng nghiệp giễu cợt nghiên cứu của họ, xem họ chỉ là những kẻ lừa đảo không biết xấu hổ. Họ tin rằng tộc Zroni không còn là thực thể duy nhất tồn tại trong Cõi Hư Vô nữa, những cảm xúc sợ hãi và khao khát của toàn bộ chủng tộc đang dần hợp nhất để tạo thành những thực thể có trí tuệ rõ ràng.\n\nNhững thực thể này khao khát trở nên mạnh mẽ hơn, nên đã bắt đầu tác động ngầm lên cảm xúc và tâm trí của những người Zroni phù hợp, dần dần khiến hành vi của họ trở nên cực đoan, và có thể chính là mầm mống châm ngòi cho cuộc nội chiến của tộc Zroni.\n\nBên trong tinh thể, ta đã phát hiện thêm một thông điệp, đánh dấu vị trí của một trong những hành tinh cốt lõi của tộc Zroni."
 ancrel.11.desc:2 "Khác với các hành tinh Zroni trước đây, [From.Planet.GetName] rõ ràng là một hành tinh cốt lõi, với vô số thành phố và vô vàn khu định cư lớn nhỏ trên bề mặt. Nơi này cũng vắng vẻ như những thuộc địa khác, không có dấu vết của thảm họa hay sự chết chóc, số phận của những cư dân này bặt vô âm tín. Ta đã phát hiện sự tồn tại của nhiều kho lưu trữ tinh thể, và sẽ chuẩn bị tiến hành điều tra."
 ancrel.12.desc:1 "Phần lớn các ghi chép có thể đọc được đều tập trung vào diễn biến của cuộc chiến. Ta rút ra kết luận rằng, những khát vọng của con người sẽ tác động đến 'cường độ' ghi chép của một chủ đề cụ thể, khiến cho những vấn đề được nhiều người quan tâm sẽ được ghi chép lại một cách đậm nét. Không có gì bất ngờ, tiến trình của cuộc chiến đều in hằn trong tâm trí của mỗi người.\n\nPhần lớn người Zroni đứng về Phe Phúc Âm, tuy nhiên, dù có một lượng lớn người ủng hộ, tình thế của họ lại vô cùng bất lợi. Phe Thăng Thiên bất chấp hậu quả đối với thiên hà, nhờ đó mà có thể thỏa sức sử dụng sức mạnh tâm linh của mình, trong khi Phe Phúc Âm lại bị trói buộc bởi lượng sức mạnh mà họ có thể lấy từ chính bản thân mình.\n\nBan đầu, cuộc chiến tưởng chừng như nghiêng hẳn về một phía, nhưng một vị anh hùng của Phe Phúc Âm đã có một khám phá đáng sợ và mang tính quyết định, khiến cục diện trở nên rối ren khó lường."
 ancrel.12.a:0 "Điều tra khám phá đó"
 ancrel.13.desc:0 "Tinh thể kể cho ta nghe rằng, từng có một nhà nghiên cứu Zroni điên rồ, dốc lòng nghiên cứu lý thuyết phản ứng dây chuyền, theo đó sức mạnh tâm linh sẽ được sử dụng ngay bên trong cơ thể và thiêu rụi chính thân xác trong một phản ứng dây chuyền tâm linh có kiểm soát, lý thuyết này quá đỗi ngông cuồng, đồng nghiệp nhất trí tẩy chay nó. Theo di ngôn cuối cùng của anh ta, tro tàn còn sót lại sau sự hy sinh cao cả của anh ta qua kiểm tra đã được xác nhận là một nguồn năng lượng tâm linh mạnh mẽ đến khó tin, chứa lượng năng lượng tương đương với tổng tiềm năng tâm linh của cả đời anh ta, và có thể được sử dụng trực tiếp bởi một nhà ngoại cảm khác.\n\nCuối cùng khối tinh thể này cũng chỉ cho ta vị trí quê hương của tộc Zroni!"
 ancrel.13.a:0 "Đống tro tàn này... lại là... tộc Zroni!"
 ancrel.15.desc:1 "Hành tinh Zroni đã bị bão tâm linh phá hủy hoàn toàn, và có vẻ chỉ cùng tồn tại trên một mặt phẳng với những vùng không gian khác của vũ trụ vào những thời điểm nhất định. Bất chấp thảm họa tàn khốc nào đã xảy ra, tộc Zroni hẳn phải khởi nguồn từ chính hành tinh dưới chân ta.\n\nGiống như các thuộc địa được khám phá trước đó, hành tinh Zroni vẫn không bóng người. Nhưng không gian xung quanh lại chứa đầy tín hiệu tinh thể, do có quá nhiều tín hiệu nhiễu, bầu khí quyển ở đây lại vô cùng dị thường, việc tìm kiếm thông tin hữu ích có thể sẽ ngốn một khoảng thời gian nhất định."
 ancrel.16.desc:1 "Ta đã tìm thấy vài tinh thể và giao tiếp thành công với chúng, bao gồm cả ghi chép của một nhà nghiên cứu thực thể Cõi Hư Vô bị lưu đày. Nhờ đó, ta đã thấu hiểu tường tận hơn về cuộc chiến của tộc Zroni.\n\nBụi Zro đánh đổi bằng mạng sống đã mang lại bước ngoặt cho Phe Phúc Âm, giúp họ có đủ sức để chống chọi với Phe Thăng Thiên. Tuy nhiên, khi bóng đen thất bại dần bao trùm, sự phẫn nộ và sợ hãi của Phe Thăng Thiên càng thúc đẩy sự ra đời của những thực thể Cõi Hư Vô mới vô cùng đáng sợ. Vòng lặp phản hồi này liên tục phát triển, đẩy Phe Thăng Thiên xuống vực sâu điên loạn. Chúng không ngừng tạo ra những hành động bạo tàn ngày càng rùng rợn, trong khi Phe Phúc Âm ngày càng bất chấp mọi giá để chấm dứt cuộc chiến này."
 ancrel.16.a:1 "Tiếp tục..."
 ancrel.17.desc:1 "Khi ta kết nối với nhiều tinh thể hơn, ngày càng nhiều chi tiết được phơi bày: Phe Thăng Thiên trong giây phút bên bờ vực thẳm đã quyết định thi hành kế hoạch cuối cùng: Sự Chấm Dứt Của Luân Hồi. Sự bành trướng của lỗ đen ở lõi thiên hà sẽ được thúc đẩy, để nuốt trọn cả thiên hà với tốc độ nhanh nhất có thể.\n\nTrong tình huống tồi tệ nhất, Phe Phúc Âm (và tất cả những giống loài khác) đều sẽ bị hủy diệt, để lại Phe Thăng Thiên cai trị Cõi Hư Vô trong một khoảng thời gian dài dằng dặc nhưng có hạn, nhưng cũng có khả năng sự giãn nở của lỗ đen sẽ đạt tới mức tự duy trì, không những nuốt trọn thiên hà này, mà còn hủy diệt chính vũ trụ, cung cấp năng lượng vô tận cho Phe Thăng Thiên—kể cả không phải vô tận, vì tổng năng lượng đã xấp xỉ mức vô tận, nên thực tế chẳng có gì khác biệt."
 ancrel.18.desc:0 "Ta đã thấu hiểu kết cục của tộc Zroni: Khi Phe Phúc Âm biết được kế hoạch tột cùng của Phe Thăng Thiên, cộng thêm hàng phòng ngự vững như bàn thạch của Phe Thăng Thiên trong Cõi Hư Vô, họ chỉ còn một con đường duy nhất để đi. Sự hủy diệt đã cận kề, họ quyết định hy sinh gần như toàn bộ dân số, chỉ chừa lại một người duy nhất, người cuối cùng của Phe Phúc Âm sẽ dùng tro tàn tâm linh được hiến tế từ cả một chủng loài để xóa sổ từng cá nhân Zroni—không tha cho bất kỳ kẻ nào của Phe Thăng Thiên—từ đó chấm dứt thảm họa này một cách triệt để.\n\nTộc Zroni bị xóa nhòa khỏi vũ trụ mà hầu như không để lại dấu tích, chỉ chừa lại một nhúm nhỏ tro bụi Zro chưa được sử dụng..."
 ancrel.18.a:0 "Khó tin thật!"
 ancrel.19.desc:1 "Khi đoàn thám hiểm của ta chuẩn bị rời đi, một trong những tinh thể tâm linh đột nhiên kết nối lại với ta. Nó bày tỏ rằng mình sẽ có ích cho ta, và nên đưa nó theo. Dẫu cho những lời nó nói là dối trá, thì các tinh thể khác cũng không bộc lộ bất kỳ trí tuệ nào. Vì vậy ta nên mang nó đi để phục vụ cho các nghiên cứu tiếp theo."
 ancrel.19.a:0 "Lấy tinh thể."
 ancrel.21.name:0 "Hành Tinh Bị Bỏ Hoang"
 ancrel.21.desc:0 "Vô số công trình kiến trúc điêu tàn phủ kín toàn bộ bề mặt hành tinh. Hẳn nơi đây từng có dân số lên tới hàng tỷ người, nhưng giờ lại hoang vu không một bóng người. Dù cho ai từng sinh sống ở đây, họ chắc chắn đã lưu lại dấu vết về những gì đã xảy ra, nhưng để lần ra những dấu vết này, ta cần rà soát kỹ lưỡng bề mặt hành tinh."
 ancrel.22.desc:1 "Phần lớn quá trình lùng sục tàn tích đều vô vọng, may thay vẫn còn một vài manh mối chỉ ra hướng đi đúng đắn: Ta đã tìm thấy một nơi dường như là trung tâm xử lý và lưu trữ dữ liệu cấp hành tinh. Nếu có thể tìm được cách truy cập vào kho lưu trữ trong đó, nó sẽ đóng vai trò vô giá trong việc giải mã quá khứ bí ẩn của hành tinh này."
 ancrel.23.desc:1 "Sau khi tìm ra lối vào trung tâm dữ liệu và dọn dẹp một con đường xuyên qua tàn tích, việc khởi động lại và truy cập hệ thống máy tính lại dễ dàng đến bất ngờ. Các mạch tự phục hồi và thuật toán tự học nhanh chóng trực tuyến để khôi phục các chức năng bị hạn chế và bắt đầu giao tiếp với máy tính của ta.\n\nNguyên do của mọi chuyện nhanh chóng sáng tỏ, [From.Planet.GetName] từng là thủ đô của một đế chế máy móc được mệnh danh là '§HToàn Thư Hữu Cơ§!'. Giống như cái tên nói lên sứ mệnh của nó, đế chế này được cấu thành từ robot và cyborg, từng nỗ lực thu thập mẫu vật của mọi sinh vật hữu cơ trong thiên hà, nhằm ngăn chặn sự tuyệt chủng của những sinh mệnh này trong một thảm họa mang tầm vóc thiên hà vô định.\n\nTừ các hồ sơ hiện có, thông tin ta thu thập được cho thấy mục đích này không được lòng các thế lực thiên hà cùng thời với họ, cuối cùng họ đã bị đánh bại và tiêu diệt bởi các cuộc tấn công liên hiệp của nhiều thế lực.\n\nTuy nhiên, trước khi đế chế này diệt vong, họ đã thu thập được rất nhiều chủng loài, và đổ vô số công sức để nghiên cứu ra một thiết bị có thể tái tạo lại những chủng loài này khi cần. Thiết bị này, cũng chính là bản thân Toàn Thư Hữu Cơ, được cất giữ ở đâu đó gần đây."
 ancrel.24.desc:0 "Ta đã tìm thấy Toàn Thư Hữu Cơ. Thiết bị độc nhất vô nhị này chứa trình tự gen của mọi loài mà đế chế máy móc đã chế tạo ra nó từng thu thập mẫu, và có khả năng tái tạo lại chúng bằng các nguyên tố cơ bản. Đáng buồn thay, có vẻ như đế chế cơ khí này không có đủ thời gian để hoàn thiện thiết bị này trước khi sụp đổ, nên ta không thể tự do lựa chọn chủng loài nào sẽ được tái tạo khi kích hoạt cỗ máy."

 ANCREL_ARC_CAT:0 "Di Chỉ Ngoại Hành Tinh"
 ANCREL_ARC_CAT_DESC:0 "Kiểm tra tín hiệu ngoại hành tinh này"

 ANCREL_MECHANO_CAT:0 "Cỗ Máy Quy Mô Hành Tinh"
 ANCREL_MECHANO_CAT_DESC:0 "Tất cả bề mặt từ cực này sang cực kia của hành tinh đều bị che phủ bởi một cỗ máy cổ đại gỉ sét, phần lớn cỗ máy này lại được bọc trong một mô hữu cơ không xác định. Kì quan công nghệ này là tác phẩm của sinh vật nào? Và chuyện gì đã xảy ra với họ?"

 baol_chain_title:0 "Tiền Bối — Tộc Baol"
 baol_chain_desc:0 "Các nhà nghiên cứu của chúng ta đã phát hiện ra một số khối tinh thể dữ liệu từ 7 triệu năm trước, ghi chép lại theo trình tự thời gian chiến tích của một tộc chiến binh không gian được gọi là §YGrunur§!, và một dạng sống ngoại lai có tên là §HSinh Vật Baol§!, hành tinh của họ đã bị tộc Grunur xâm chiếm."
 baol_colonies:0 "Phát Hiện Thuộc Địa Baol"

 BAOL_COLONY_1:0 "Khảo Sát Tiền Đồn Baol Cũ"
 BAOL_COLONY_1_DESC:0 "Ta đã tìm thấy một danh sách dài các tọa độ dự đoán vị trí của những thuộc địa cũ của tộc §HBaol§!, ta cần phải điều tra kỹ lưỡng."
 BAOL_COLONY_2:0 "$BAOL_COLONY_1$ II"
 BAOL_COLONY_2_DESC:0 "Ta đã trích xuất được tọa độ của một thuộc địa cũ khác của tộc §HBaol§! từ tinh thể dữ liệu cổ đại của Grunur, ta nên điều tra sâu hơn về di chỉ này."
 BAOL_COLONY_3:0 "$BAOL_COLONY_1$ III"
 BAOL_COLONY_3_DESC:0 "$BAOL_COLONY_2_DESC$"
 THE_LAST_BAOL:0 "Tín Hiệu Cầu Cứu Của Grunur"
 THE_LAST_BAOL_DESC:0 "Cảm biến của ta đã thu được một tín hiệu cầu cứu dường như mang chữ ký điện tử của tộc Grunur. Liệu giống loài đã tuyệt diệt từ lâu này có thể để lại thứ gì trong hệ sao chưa được khám phá này?"
 FERROPHAGE_CURE:0 "Nghiên Cứu Phương Pháp Điều Trị Ferrophage"
 FERROPHAGE_CURE_DESC:0 "Giao diện C.A.R.E. trên [Root.GetName] thỉnh cầu ta giúp phát triển một phương pháp chữa trị loại virus ăn kim loại đã hành hạ nó suốt hàng ngàn năm.\n\nLàm thế nào để phát triển thuốc giải độc cho loại virus hóa sinh ngoại hành tinh cổ đại này, giúp giải thoát AI ở đây khỏi sự đầu độc, vẫn còn phải nghiên cứu."

 NAME_Grunur:0 "Tộc Grunur"
 NAME_Grunur_Prime:0 "Grunur Prime"
 NAME_Nu_Baol:0 "Tộc Baol Mới"
 grunur_research_facility:0 "Cơ Sở Nghiên Cứu Grunur"
 grunur_research_facility_desc:0 "Một cơ sở nghiên cứu thực nghiệm cổ đại, được xây dựng bởi tộc Grunur hiếu chiến từ hàng triệu năm trước."
 NAME_planetary_mechanocalibrator:1 "C.A.R.E"
 NAME_care_defensive_protocols:0 "Chiến Thể Khổng Lồ C.A.R.E"
 care_defensive_protocols:0 "Chiến Thể Khổng Lồ C.A.R.E"
 care_defensive_protocols_desc: "Đơn vị giao thức Zeta, chế tạo từ nhựa siêu bền, có khả năng chống lại Ferrophage."
 NAME_planetary_mechanocalibrator_species:0 "$NAME_planetary_mechanocalibrator$$NAME_Guardian$"

 ancrel.2000.name:0 "Tộc Grunur"
 ancrel.2000.desc:0 "Phi hành đoàn của [Root.GetName] báo cáo một cách hào hứng rằng họ đã tìm thấy tàn tích của một nền văn minh không gian cổ đại trên [From.GetName], dường như họ đã định cư trên hành tinh này từ 7 triệu năm trước!\n\nMặc dù lý do giống loài tự xưng là §HGrunur§! này rời khỏi hệ sao [From.GetStarName] vẫn chưa rõ ràng, nhưng các nhà khoa học của chúng ta đã khoanh vùng được một di chỉ khảo cổ rất đáng để khai quật trên hành tinh này.\n\nBiết đâu nghiên cứu sâu hơn sẽ tìm ra nhiều manh mối hơn."
 ancrel.2001.name:0 "Sinh Vật Baol"
 ancrel.2001.desc:0 "Sau khi giải mã dữ liệu tinh thể cổ đại thu thập được tại địa điểm khai quật, ta đã có trong tay biên niên sử về những chiến công của tộc §HGrunur§!. Dù phần lớn chỉ là những sự vụ nội bộ không mấy ý nghĩa với ta, nhưng vẫn có vài tập ghi chép chi tiết về lần chạm trán đầu tiên giữa tộc §HGrunur§! và một giống loài ngoại hành tinh được gọi là §HSinh Vật Baol§!.\n\nNgoài việc biết rằng §HBaol§! là một loài thực vật khổng lồ, đã gieo rắc vô số thuộc địa giữa các vì sao, hiện tại ta chẳng biết thêm gì về nó."
 ancrel.2001.a:0 "Thật hấp dẫn. Tiếp tục nghiên cứu đi!"
 ancrel.2002.name:0 "Sinh Vật Baol"
 ancrel.2002.desc:0 "Ghi chép trong tinh thể dữ liệu chỉ ra rằng tộc §HGrunur§! từng phát động chiến tranh với tộc §HBaol§!, hòng chiếm đoạt nguồn tài nguyên dồi dào trên hành tinh của họ. Ta đã trích xuất thành công một nhóm tọa độ hệ sao từ bản ghi chép loại này!\n\nCác nhà khảo cổ học của ta đang tải tọa độ hành tinh đó lên hệ thống."
 ancrel.2002.a:0 "Có lẽ một cuộc điều tra chuyên sâu về [baol_colony_1.GetName] sẽ mang lại cho ta nhiều lợi ích."
 ancrel.2003.name:0 "Thuộc Địa Baol Cũ: Vùng Đất Chết"
 ancrel.2003.desc:0 "Dù tinh thể dữ liệu cổ đại của tộc §HGrunur§! tìm thấy ở [first_grunur_site.GetName] khẳng định nơi đây có nguồn tài nguyên phong phú, nhưng [baol_colony_1.GetName] lại chỉ là một hành tinh khô cằn, hoang vu, thậm chí chẳng có lấy một bầu khí quyển.\n\nMay mắn thay, các thiết bị quét địa chất phát hiện ra dưới lớp trầm tích sâu của hành tinh là một kho tàng khổng lồ di hài sinh vật hóa thạch, dường như là vô tận! Trong số những di hài này, khả năng cao nhất thuộc về tộc §HBaol§! là một giống loài thực vật, bởi chỉ có chúng mới có cấu trúc thần kinh đáp ứng yêu cầu của sinh vật có trí khôn.\n\nMột cuộc khai quật có mục tiêu hứa hẹn sẽ hé lộ thêm thông tin."
 ancrel.2004.name:0 "Sự Tuyệt Diệt Cấp Quân Sự"
 ancrel.2004.desc:0 "Những lớp tro bụi dày và sự kiện đại tuyệt chủng đáng chú ý ghi nhận được trong hồ sơ địa chất hoàn toàn ăn khớp với các bằng chứng trước đó từ tinh thể dữ liệu của tộc §HGrunur§!, chứng minh tộc §HGrunur§! đã nã bom cháy dạng keo vào [From.Planet.GetName] cách đây khoảng 7 triệu năm.\n\nCác trận cháy rừng dữ dội trên bề mặt hành tinh đã phá vỡ hệ sinh thái nơi đây, do thiếu thực vật quang hợp, bầu khí quyển của hành tinh đã dần bị vắt kiệt trong 6 vạn năm sau đó."
 ancrel.2005.name:0 "Sinh Vật Baol"
 ancrel.2005.desc:0 "Ta đã tìm thấy vài hóa thạch tộc §HBaol§! còn nguyên vẹn, cho thấy loài sinh vật tuyệt chủng này sở hữu tâm trí bầy đàn: Hàng tỉ đơn vị thực vật cùng chung nhịp đập, hệt như cành, lá và rễ trên cùng một cây. Phân tích vòng sinh trưởng cây cho thấy mỗi cá thể §HBaol§! có thể thọ đến hàng trăm năm.\n\nSự vắng bóng của các công trình kiến trúc còn sót lại trên [From.Planet.GetName] dường như là do tộc Baol quá phụ thuộc vào công nghệ sinh học tiên tiến của họ. Thời gian trôi qua đã quét sạch tàu vũ trụ, nhà cửa và máy tính ướt của họ."
 ancrel.2006.name:0 "Tinh Thể Dữ Liệu Grunur"
 ancrel.2006.desc:0 "Ta đã trích xuất được tọa độ của một thuộc địa cũ khác của tộc §HBaol§! từ mảnh vỡ tinh thể dữ liệu của tộc §HGrunur§!! Biết đâu hành tinh này lại chứa đựng kho báu mà kẻ thù không đội trời chung của Baol đã cất công săn lùng."
 ancrel.2006.a:0 "Tiến đến thuộc địa tiếp theo!"
 ancrel.2007.name:0 "Thuộc Địa Baol Cũ: Hành Tinh Tan Vỡ"
 ancrel.2007.desc:0 "Phi hành đoàn của [Root.GetName] ban đầu chắc mẩm họ đã tính toán sai khi thực hiện phép đạc tam giác để tìm vị trí lý thuyết của thuộc địa §HBaol§! trong hệ sao [Root.GetStarName], bởi vì tại vị trí lẽ ra phải có một hành tinh hỗ trợ sự sống lại chỉ có vài tiểu hành tinh.\n\nNhưng, những nghiên cứu sâu hơn về cấu tạo của các tiểu hành tinh này cho thấy chúng thực chất là những mảnh vỡ từ thuộc địa cũ của tộc §HBaol§!! Khoảng 7 triệu năm trước, hành tinh từng ngập tràn cây cỏ này đã bị một vụ va chạm vô danh xé toạc thành hàng nghìn mảnh vụn. Suy luận cho thấy tộc §HGrunur§! có dính líu đến kết cục bi thảm của hành tinh này.\n\nMột tiểu hành tinh có giá trị khai quật nhất đã được chọn làm đối tượng nghiên cứu tiếp theo, lưu giữ một lượng lớn di hài hóa thạch của các sinh vật trên hành tinh đã biến mất."
 ancrel.2007.a:0 "Thật đáng tiếc. Có lẽ ta sẽ rút ra được bài học từ đó."
 ancrel.2008.name:0 "Máy Tính Sinh Học Hóa Thạch"
 ancrel.2008.desc:0 "Ta đã cố gắng khai thác được vài đoạn dữ liệu từ một hóa thạch máy tính sinh học của tộc §HBaol§! còn được bảo quản trong tình trạng tốt! Món đồ cổ 10 triệu năm tuổi này dường như chứa thông tin giáo dục dành cho những cá thể chưa trưởng thành của loài này. Vì chưa sẵn sàng để kết nối thần kinh trọn vẹn với tâm trí bầy đàn, những cá thể §HBaol§! non nớt, hay còn gọi là mầm cây, sẽ được chỉ dạy kỹ thuật ươm mầm, làm vườn và dinh dưỡng bằng những phương thức phức tạp hơn.\n\nNhững phát hiện này cho thấy xã hội tộc §HBaol§! rất xem trọng việc tô điểm cảnh quan mặt đất và quản lý môi trường sinh thái, sự tồn tại của họ cũng phụ thuộc lớn vào những công nghệ này."
 ancrel.2009.name:0 "Mảnh Vỡ Máy Tính Sinh Học"
 ancrel.2009.desc:0 "Việc phát hiện mảnh vỡ của một chiếc máy tính sinh học khác của tộc §HBaol§! đã giúp ta thấu hiểu hơn về lịch sử của loài thực vật có tâm trí bầy đàn này.\n\nTộc §HBaol§! dường như là những sinh mệnh thực vật thuần túy, khởi nguồn từ một hành tinh chưa rõ tung tích. Mọi cá thể §HBaol§! thời tiền sử đều là bản sao từ cây mẹ, sinh trưởng chậm chạp và bình yên trên quê hương suốt hàng triệu năm, rồi từ từ phát triển năng lực làm vật chủ cho tâm thức bầy đàn."
 ancrel.2010.name:0 "Tinh Thể Dữ Liệu Grunur"
 ancrel.2010.desc:0 "Ta đã tìm thấy một khối tinh thể dữ liệu của tộc §HGrunur§! trên [From.Planet.GetName], bị bỏ lại đây khoảng 7 triệu năm trước. Khối tinh thể dữ liệu này chứa đựng một số hồ sơ quân sự vẫn còn đọc được, liên quan đến cuộc xâm lược hành tinh này.\n\nRõ ràng, tộc §HGrunur§! đã lường trước được một sự phản kháng vũ trang nào đó, nhưng những cá thể §HBaol§! di chuyển cực chậm lại chẳng gây ấn tượng gì với họ. Các bản ghi chép mô tả bằng giọng điệu vô cùng khinh bỉ về việc né tránh những đòn đánh trả chậm chạp của tộc §HBaol§! dễ dàng ra sao."
 ancrel.2011.name:0 "Lệnh Tác Chiến Grunur"
 ancrel.2011.desc:0 "Một khối tinh thể dữ liệu khác của tộc §HGrunur§! đã được khai quật, bên trong ghi chép cặn kẽ một chuỗi các mệnh lệnh quân sự—bao gồm tọa độ của một thuộc địa cũ khác của tộc §HBaol§!.\n\nCác nhà khảo cổ học của ta đang rất háo hức muốn tìm hiểu lịch sử của hai quốc gia thù địch này và đang tiến hành tải dữ liệu lên."
 ancrel.2011.a:0 "Quá tam ba bận...?"
 ancrel.2012.name:0 "Thuộc Địa Baol Cũ: Lặng Thinh"
 ancrel.2012.desc:0 "Các nhà nghiên cứu của chúng ta đã vui mừng khôn xiết khi phát hiện vị trí thuộc địa thứ ba của tộc §HBaol§! lại trùng khớp với một hành tinh vẫn còn bầu khí quyển và sự sống!\n\nMặc dù [From.From.GetName] có vẻ không quá rậm rạp cây cối hay giàu tài nguyên, nhưng các nhà khoa học của chúng ta vẫn nóng lòng muốn tiến hành một cuộc khai quật có định hướng, nhằm tìm kiếm bất kỳ tàn tích nào của tộc §HBaol§! hay tộc §HGrunur§!."
 ancrel.2013.name:0 "Thoái Hóa Chức Năng"
 ancrel.2013.desc:0 "Trong quá trình khai quật trên [From.Planet.GetName], ta đã tìm thấy rất nhiều hóa thạch rõ ràng có liên quan đến tộc §HBaol§!. Tuy nhiên, điều kỳ lạ là, các cơ quan thần kinh của những mẫu vật này vốn dùng để liên lạc bằng khớp thần kinh giả không gian con—một thiên phú độc quyền của tâm trí bầy đàn, cho phép giao tiếp thần kinh qua khoảng cách xa xôi—dường như đã thoái hóa.\n\nMặc dù việc phủ nhận sự liên quan của cuộc xâm lược của tộc §HGrunur§! là thiếu trách nhiệm, nhưng nguyên nhân thực sự gây ra sự tiến hóa dao động này vẫn chưa rõ. Chắc chắn cần phải tiến hành điều tra sâu hơn."
 ancrel.2024.name:0 "Bầy Đàn Phân Rã"
 ancrel.2024.desc:0 "Các hóa thạch tộc §HBaol§! mới hơn đã được khai quật từ các lớp địa chất, những mẫu vật này không còn hệ thần kinh bầy đàn bị thoái hóa nữa. Thay vào đó, cấu trúc cần thiết để giao tiếp qua khớp thần kinh giả không gian con đã hoàn toàn tiêu biến!\n\nViệc xác định niên đại bằng carbon của các mẫu vật đã chứng minh rằng, trong vài thế kỷ sau cuộc xâm lăng của tộc §HGrunur§!, tộc §HBaol§! đã bắt đầu từ bỏ khả năng kết nối lẫn nhau như một tâm trí bầy đàn.\n\nĐáng tiếc là, dường như ta không thể thu thập thêm dữ liệu liên quan nào ở khu di tích này."
 ancrel.2024.a:0 "Thật là kỳ lạ."
 ancrel.2015.name:0 "Tín Hiệu Cầu Cứu Của Tộc §HGrunur§!"
 ancrel.2015.desc:1 "Các nhà khoa học của chúng ta đang nhận được một tín hiệu cầu cứu mang dấu ấn kỹ thuật số của tộc §HGrunur§!! Nó có vẻ phát ra từ một hệ sao mà ta chưa từng biết đến, nằm lân cận [last_baol_neighbor.GetName].\n\nLiệu nó có thể chứa đựng những thông điệp cổ đại nào?\n\nCác nhà khoa học của ta mong muốn điều tra nguồn gốc của tín hiệu."
 ancrel.2015.a.tooltip:0 "Mở khóa dự án đặc biệt: §HTín Hiệu Cầu Cứu Của Grunur§!"
 ancrel.3999.name:0 "$ancrel.2016.name$"
 ancrel.3999.desc:0 "Sĩ quan khoa học đến từ §H[From.GetName]§! đã xác định được vị trí mẫu vật §HBaol§! cuối cùng!"
 ancrel.2016.name:0 "Sinh Vật Baol"
 ancrel.2016.desc:0 "Phi hành đoàn [Root.GetName] đã lần theo nguồn tín hiệu cầu cứu của tộc §HGrunur§! và tìm thấy một cơ sở nghiên cứu mục nát của tộc này, đang xoay quanh quỹ đạo của một hành tinh đã bị bỏ hoang từ lâu. Cơ sở này sắp cạn kiệt nguồn cung năng lượng, mạng lưới tấm pin mặt trời khổng lồ đã hoạt động suốt hàng triệu năm và hệ thống tự sửa chữa đang rệu rã dần sắp đạt đến giới hạn tuổi thọ.\n\nTa đã quét qua cơ sở và bàng hoàng phát hiện có một sinh vật sống ở đây. Phi hành đoàn đã cử đội điều tra hiện trường, và họ đã sẵn sàng để báo cáo."
 ancrel.2017.name:0 "Thành Viên Baol Cuối Cùng"
 ancrel.2017.desc:0 "§HSâu trong tàn tích của cơ sở nghiên cứu Grunur cũ nát, giữa những bảng điều khiển máy tính bị bỏ hoang từ lâu và thiết bị nghiên cứu hỏng hóc, phi hành đoàn của ta đã có một khám phá khó tin.\n\nNhờ ống dinh dưỡng và hệ thống hỗ trợ sự sống hư hại nặng nề duy trì, một cá thể sống sót cuối cùng của giống loài này đang nằm im lìm tại đây: thành viên Baol cuối cùng, vẫn còn sống một cách kỳ diệu, được bao quanh bởi một dãy thi thể của những cá thể khác đã thối rữa nghiêm trọng chảy ra từ các bình vỡ.\n\nNhờ các nhà khảo cổ của ta đã có nhiều nghiên cứu trước đây về giống loài này, ta đã có thể giao tiếp với cá thể sống sót cuối cùng này.§!"
 ancrel.2017.a:0 "Vậy thì hãy thử xem sao."
 ancrel.2017.exter:0 "Một sinh vật hữu cơ? Khởi động giao thức tuyệt diệt..."
 ancrel.2017.machi:0 "Một sinh vật hữu cơ cổ đại!"
 ancrel.2017.hive:0 "[root.GetGestaltEntityName] vươn xúc tu ra..."
 ancrel.2018.desc:0 "“Một vị khách ư? Sao có thể chứ?”\n\n§HThành viên Baol run rẩy trong chiếc bình của mình.§!\n\n“Dù sự xuất hiện của các người đã kéo theo tiếng còi báo động, nhưng các người không phải là những kẻ đã nhốt chúng tôi ở đây. Liệu các người có thể ban cho chúng tôi sự bình yên không?”"
 ancrel.2018.a:0 "Có thể đấy. Nhưng trước tiên, ta có vài câu hỏi."
 ancrel.2018.a.phile:0 "Chúng tôi sẽ giúp bạn bằng mọi cách có thể."
 ancrel.2018.a.phobe:0 "Lũ dị tộc các ngươi phải trả lời chúng ta. Chứ không phải ngược lại."
 ancrel.2019.desc:0 "§HThành viên Baol lặng yên trong vài phút.§!“Vậy hãy hỏi đi. Chúng tôi đã chờ đợi hàng triệu năm rồi. Chúng tôi vẫn có thể chịu đựng thêm một lúc nữa.”"
 ancrel.2019.a:0 "Hãy kể cho chúng tôi nghe về bạn."
 ancrel.2019.a.response:0 "§HSau một lúc khá lâu, thành viên Baol mới trả lời.§!\n\n“Chúng tôi ư? Chúng tôi... tôi. Đúng vậy. Còn biết nói gì nữa đây? Chúng tôi đắm mình trong ánh sao trên mặt đất mềm mại, vươn cành lá đón gió, tựa như những cánh buồm căng phồng dưới ánh mặt trời. Chúng tôi khắc ghi từng giọt nước nhỏ xuống trong mùa hè thiêu đốt, và nhớ cả từng bông tuyết phủ xuống trong mùa đông buốt giá. Khi những vì sao không ngừng xoay chuyển trên đỉnh đầu, chúng tôi cũng sẽ đung đưa cơ thể theo làn gió nhẹ.\n\nSau đó, chúng tôi bị nhổ tận gốc, bị thiêu thành tro, bị băm vằm thành từng mảnh. Chúng tôi bị tống giam ở đây, nhìn nhau chết dần chết mòn trong nhà ngục thủy tinh.”"
 ancrel.2019.b:0 "Chuyện gì đã xảy ra với tộc Baol?"
 ancrel.2019.b.response:0 "§HMột lần nữa, thành viên Baol lại chìm vào sự im lặng rất lâu trước khi trả lời.§!“Khi Những Kẻ Thiêu Rụi kéo đến, trước cả khi chúng tôi kịp nhận ra mối nguy, toàn bộ thuộc địa đã chìm vào tĩnh lặng. Giống như bị liệt nửa người, các khớp thần kinh bị cắt đứt nhanh chóng, khiến kết nối bị đứt gãy từ tận gốc rễ. Rồi chúng tôi mất đi người tiếp theo, người tiếp theo, và cả người tiếp theo nữa. Hết người này đến người khác, tiếng nói của họ rời khỏi dàn hợp xướng. Chúng tôi đã mất rất nhiều cá thể. Sự im lặng của họ đẩy những người còn lại chúng tôi vào hố sâu tuyệt vọng khôn cùng.\n\nNgươi có hiểu không, hỡi vị khách? Chúng tôi đã phải gánh chịu nỗi đau đớn tột cùng. Những Kẻ Thiêu Rụi di chuyển rất nhanh, giống như các người vậy, trước khi chúng tôi kịp rút lui, chúng đã biến tất cả chúng tôi thành một biển lửa, thiêu rụi mọi thứ thành tro bụi. Cả bầu không khí đặc quánh nỗi đau thương màu xám tro, đó là tro cốt của những người đồng loại đã ngã xuống của chúng tôi.”"
 ancrel.2019.c:0 "Bạn có muốn gia nhập cùng chúng tôi không?"
 ancrel.2019.d:0 "Ta nghe đủ rồi."
 ancrel.2020.desc:0 "§HThành viên Baol đắn đo một lúc lâu mới đưa ra câu trả lời cuối cùng.§!“Cảm ơn. Đã lâu lắm rồi chúng tôi mới được nghe một giọng nói thân thiện.”"
 ancrel.2020.a:0 "Ta có vài câu hỏi..."
 ancrel.2021.desc:0 "§HToàn thân thành viên Baol rùng mình, mang lại cảm giác như nó đang cười điên dại.§!“Không cần đâu. Chúng tôi đã sống trong thân xác dị dạng này quá lâu rồi. Giờ chúng tôi chỉ cầu xin cái chết. Nhưng trước tiên... các người có thể cho chúng tôi biết không? Chúng tôi đã bị nhốt ở đây quá lâu, chẳng thấy gì ngoài căn phòng này, cứ thế nhìn bầu không khí ô nhiễm từng chút một ăn mòn trạm không gian cho đến khi chỉ còn trơ lại bộ khung kim loại.\n\nHãy nói cho chúng tôi biết. Chủng loài của chúng tôi... vẫn còn tồn tại chứ?”"
 ancrel.2021.desc.phobe:0 "“Khoan đã.”§HThành viên Baol run rẩy.§!“Trước khi mọi thứ kết thúc. Đồng loại của chúng tôi, làm ơn đi. Chúng tôi đã bị nhốt ở đây quá lâu, chẳng thấy gì ngoài căn phòng này, cứ thế nhìn bầu không khí ô nhiễm từng chút một ăn mòn trạm không gian cho đến khi chỉ còn trơ lại bộ khung kim loại.\n\nHãy nói cho chúng tôi biết. Chủng loài của chúng tôi... vẫn còn tồn tại chứ?”"
 ancrel.2021.a:0 "Theo một khía cạnh nào đó thì vẫn còn. Nhưng họ không còn là giống loài có trí tuệ nữa."
 ancrel.2021.b:0 "Ta không có thời gian để lãng phí ở đây. Rút phích cắm đi!"
 ancrel.2021.b.exter:0 "Diệt trừ!"
 ancrel.2021.b.swarm:0 "Con mồi tốt đấy, nằm im đó!"
 ancrel.2022.desc:0 "§HChậm rãi, dường như trong vô thức, cành lá của sinh thể Baol cuối cùng khẽ co cụm lại thêm một chút.§! \"Có lẽ... có lẽ như vậy là tốt nhất.\"\n\n§HCỗ máy bơm những chất lỏng bí ẩn vào và ra khỏi cơ thể sinh vật bắt đầu xì hơi và rít lên. Rõ ràng nó đang thở dốc những hơi tàn cơ khí cuối cùng, và sinh thể Baol sẽ diệt vong nếu không có nó.§!\n\n\"Sự tĩnh lặng, phải rồi. Cuối cùng nó cũng đã đến gần. Chúng tôi đón nhận nó, hệt như đồng bào của chúng tôi đã làm từ thuở xa xưa. Vĩnh biệt, người [Root.GetSpeciesName]. Cầu mong đồng loại của các bạn sẽ phải chịu ít đau khổ hơn trong thế giới này.\""
 ancrel.2022.a:0 "Vĩnh biệt."
 ancrel.2022.b.evopred: "Sự độc đáo của các bạn sẽ không bị mất đi."
 ancrel.2023.desc:0 "§HCác nhà khoa học của ta đã tìm ra đường ống truyền dưỡng chất vào và xả chất thải ra cho sinh vật này rồi lần lượt rút chúng ra, đẩy nhanh quá trình hỏng hóc của cỗ máy, để thành viên Baol cuối cùng có thể chết nhanh hơn.\n\nTrong lúc bạn đang làm việc, thành viên Baol dường như không hề phản kháng, trừ phi chuyển động nhẹ của những chi bị teo tóp kia là nhằm bày tỏ điều gì đó.\n\nCuối cùng, công việc đã hoàn tất, kèm theo một cơn chấn động truyền khắp toàn thân, sinh vật này đã trút hơi thở cuối cùng.§!"
 ancrel.2023.a:0 "Được rồi, vậy cứ thế đi."
 ancrel.2023.a.exter:0 "Thiêu rụi tàn dư."
 ancrel.2023.a.swarm:0 "Đại tiệc bắt đầu!"
 ancrel.2025.name:0 "Gieo Mầm Sự Sống Baol Trên [Root.GetName] Đã Hoàn Tất"
 ancrel.2025.desc.first:1 "Những [Owner.GetTerraformerPlural] của ta sung sướng báo cáo rằng, việc cải tạo môi trường trên [Root.GetName] của ta đã thành công tốt đẹp! Bằng cách trích xuất gen từ cơ thể của §Hthành viên Baol cuối cùng§! và cẩn thận chọn lọc những đoạn mã di truyền của tộc §HBaol§!, ta đã tạo ra thành công những loài thực vật lai trong phòng thí nghiệm và chỉ trong vòng năm năm sau khi triển khai những loài thực vật này, quá trình cải tạo khí hậu và bầu khí quyển của [Root.GetName] đã thành công mỹ mãn.\n\nĐúng như dự đoán, những loài thực vật lai này sinh sôi nảy nở khắp hành tinh, và hiện đang bước vào thời kỳ 'ngủ đông', vì sự thay đổi thành phần hóa học trong bầu khí quyển của [Root.GetName] khiến chúng không còn hoạt động nữa.\n\nĐiều khó tin là, bộ phận quản lý hành tinh báo cáo rằng quá trình này đã tạo ra một kết quả ngoài mong đợi: vô số sinh vật ngoài hành tinh có trí tuệ đã xuất hiện trên [Root.GetName]! Chúng có ngoại hình rất giống với tộc §HBaol§! cổ đại, nhưng lại sở hữu vật chất di truyền pha trộn từ thảm thực vật tự nhiên của hành tinh này."
 ancrel.2025.desc.firstregular:0 "$ancrel.2025.desc.first$\n\nMặc dù không phải là một phần của tâm trí bầy đàn, nhưng những sinh vật ngoài hành tinh §GTộc Baol Mới§! này dường như cũng hiền hòa giống như tổ tiên của chúng. Dù sao đi nữa, ta cũng phải giải quyết êm thấm sự hiện diện của chúng trên [Root.GetName]."
 ancrel.2025.desc.firsthive:0 "$ancrel.2025.desc.first$\n\nMặc dù ban đầu thuộc về một tâm trí bầy đàn khác, nhưng những sinh vật ngoài hành tinh §GTộc Baol Mới§! này khá dễ dàng để sáp nhập vào ý thức của ta. Dù sao đi nữa, ta cũng phải giải quyết êm thấm sự hiện diện của chúng trên [Root.GetName]."
 ancrel.2025.desc:1 "Những [Owner.GetTerraformerPlural] của ta sung sướng báo cáo rằng, việc cải tạo môi trường trên [Root.GetName] của ta đã thành công tốt đẹp! Hành tinh này đã được cải tạo thành môi trường §G$pc_gaia$§!, nhờ vào việc triển khai những giống cây lai tạo trong phòng thí nghiệm, có chứa những đoạn mã di truyền được chọn lọc kỹ càng của tộc §HBaol§!.\n\nMột lần nữa—như một kết quả của quá trình mà các nhà di truyền học của ta chưa hoàn toàn thấu hiểu—rất nhiều cư dân §GTộc Baol Mới§! lại ồ ạt xuất hiện trên hành tinh khi quá trình cải tạo môi trường sắp hoàn tất."
 ancrel.2025.a:0 "Tuyệt vời! Chào mừng họ nồng nhiệt."
 ancrel.2025.b:0 "Ta e là ta sẽ phải giải quyết họ sau..."
 ancrel.2025.c:0 "Tuyệt vời! Thêm nô lệ."
 ancrel.2025.d:0 "Thêm nhiều hy vọng đã được sáp nhập vào tập thể của ta."

 ancrel.2026.name:0 "Chương Trình Nâng Cấp Sự Sống Baol Trên [Root.GetName]: Hoàn Tất"
 ancrel.2026.desc.first:0 "Việc du nhập mầm cây §HBaol§! lên [Root.GetName] đã mang lại kết quả đáng kinh ngạc. Sau khi tiếp xúc với bào tử của mầm cây, một bộ phận dân số của ta đã tự thích nghi, họ thậm chí còn phát triển mạnh mẽ hơn mong đợi trên [Root.GetPlanetMoon] này. Nhưng phân tích sinh lý học của họ cho thấy giờ đây họ không thể thích nghi với bất kỳ hệ sinh thái nào khác ngoài hành tinh Gaia.\n\nĐiều khó tin là, bộ phận quản lý hành tinh báo cáo rằng quá trình này đã tạo ra một kết quả ngoài mong đợi: vô số sinh vật ngoài hành tinh có trí tuệ đã xuất hiện trên [Root.GetName]! Chúng có ngoại hình rất giống với tộc §HBaol§! cổ đại, nhưng lại sở hữu vật chất di truyền pha trộn từ thảm thực vật tự nhiên của hành tinh này."
 ancrel.2026.desc.firstregular:0 "$ancrel.2026.desc.first$\n\nMặc dù không phải là một phần của tâm trí bầy đàn, nhưng những sinh vật ngoài hành tinh §GTộc Baol Mới§! này dường như cũng hiền hòa giống như tổ tiên của chúng. Dù sao đi nữa, ta cũng phải giải quyết êm thấm sự hiện diện của chúng trên [Root.GetName]."
 ancrel.2026.desc.firsthive:0 "$ancrel.2026.desc.first$\n\nMặc dù ban đầu thuộc về một tâm trí bầy đàn khác, nhưng những sinh vật ngoài hành tinh §GTộc Baol Mới§! này khá dễ dàng để sáp nhập vào ý thức của ta. Dù sao đi nữa, ta cũng phải giải quyết êm thấm sự hiện diện của chúng trên [Root.GetName]."
 ancrel.2026.desc:1 "Những [Owner.GetTerraformerPlural] của ta vui mừng thông báo rằng, công việc gieo trồng §HBaol§! trên [Root.GetName] đã hoàn tất! Sau khi tiếp xúc với bào tử phát tán, một bộ phận dân số của ta dường như đã tự thích ứng, sinh sống trên [Root.GetPlanetMoon] này tốt hơn cả dự tính ban đầu.\n\nNhờ vậy, khi quy trình sắp sửa hoàn tất, hành tinh lại một lần nữa xuất hiện một lượng lớn cư dân §GTộc Baol Mới§!, mặc dù các nhà di truyền học của ta vẫn chưa nắm bắt trọn vẹn quá trình cải tạo môi trường."

 ancrel.2027.name: "$ancrel.2025.name$"
 ancrel.2027.desc.first: "Đội ngũ [Owner.GetTerraformerPlural] của chúng ta vui mừng báo cáo rằng công cuộc cải tạo môi trường cho [Root.GetName] đã hoàn tất! Bằng cách tận dụng các đoạn gien §YBaol§! được chọn lọc kỹ càng từ thi thể cá thể §YBaol§! cuối cùng, chúng ta đã lai tạo thành công các giống thực vật trong phòng thí nghiệm và chỉ sau năm năm gieo trồng chúng, khí hậu cùng bầu khí quyển của [Root.GetName] đã được biến đổi hoàn toàn.\n\nĐúng như dự tính, loài thực vật lai này sinh sôi khắp hành tinh và hiện đang bước vào thời kỳ \"ngủ đông\", khi sự thay đổi trong thành phần khí quyển của [Root.GetName] khiến chúng không còn hoạt động nữa.\n\nĐáng kinh ngạc hơn, bộ phận quản trị báo cáo rằng quá trình này đã đem lại một kết quả ngoài dự liệu: rất nhiều sinh vật ngoài hành tinh có trí tuệ đã xuất hiện trên [Root.GetName]! Chúng có nét tương đồng rất lớn với người §YBaol§! cổ đại, nhưng lại mang bộ gien pha trộn với thảm thực vật bản địa của hành tinh này."
 ancrel.2027.desc.firstregular: "$ancrel.2027.desc.first$\n\nDù không thuộc về một Ý thức Tổ Đàn, những người ngoài hành tinh §GTân Baol§! này dường như cũng chuộng hòa bình y như tổ tiên của chúng. Dù sao đi nữa, chúng ta phải giải quyết ổn thỏa sự hiện diện của chúng trên [Root.GetName]."
 ancrel.2027.desc.firsthive: "$ancrel.2027.desc.first$\n\nDù ban đầu thuộc về một Ý thức Tổ Đàn khác, những người ngoài hành tinh §GTân Baol§! này lại hòa nhập vào nhận thức chung của chúng ta khá dễ dàng. Dù sao đi nữa, chúng ta phải giải quyết ổn thỏa sự hiện diện của chúng trên [Root.GetName]."
 ancrel.2027.desc:1 "Đội ngũ [Owner.GetTerraformerPlural] của chúng ta vui mừng báo cáo rằng công cuộc cải tạo môi trường cho [Root.GetName] đã hoàn tất! Hệ thống duy trì sự sống tại đây đã được nâng cấp trọn vẹn, nhờ vào việc chúng ta phát tán các giống cây lai tạo từ phòng thí nghiệm chứa những đoạn mã di truyền chọn lọc của người §YBaol§!.\n\nMột lần nữa, quá trình mà các nhà di truyền học của chúng ta vẫn chưa thể hiểu thấu này lại làm xuất hiện thêm một lượng dân số §GBaol§!."
 ancrel.2027.a: "$ancrel.2025.a$"
 ancrel.2027.b: "$ancrel.2025.b$"
 ancrel.2027.c: "$ancrel.2025.c$"
 ancrel.2027.d: "$ancrel.2025.d$"
 
 grunur_digsite_1:0 "Tàn tích Grunur"
 grunur_digsite_1_desc:0 "Những tàn tích này được cho là một quần thể kiến trúc điều hành cổ xưa thuộc về một loài du hành vũ trụ tự xưng là §YGrunur§!, được tìm thấy trên [From.Planet.GetName].\n\nĐáng kinh ngạc là nền văn minh đã mất này dường như từng sinh sống trên hành tinh này từ bảy triệu năm trước, và các nhà khảo cổ của chúng ta đang rất nóng lòng muốn hé mở những bí mật của họ."
 baol_digsite_1:0 "Vùng đất cằn cỗi"
 baol_digsite_1_desc:0 "Sâu bên dưới các tầng đất đá lắng đọng của [From.Planet.GetName], chúng ta đã tìm thấy một kho tàng vô giá gồm vô số hóa thạch của một loài thuộc họ thực vật, mang cấu trúc thần kinh đủ phát triển để có trí thông minh.\n\nNếu những sinh vật đã chết từ lâu này thực sự là người §YBaol§!, việc nghiên cứu thi hài của họ có thể đem lại thêm nhiều manh mối về việc làm thế nào mà hành tinh từng một thời xanh tươi ngút ngàn này lại biến thành một khối đá trơ trọi không khí và cạn kiệt sự sống."
 baol_digsite_2:0 "Hành tinh vỡ vụn"
 baol_digsite_2_desc:0 "Dù chỉ là mảnh vụn xót xa còn sót lại từ một thuộc địa cũ của người §YBaol§!, tiểu hành tinh này vẫn chứa lượng hóa thạch dồi dào chờ được khai quật. Các nhà khảo cổ của chúng ta hy vọng sẽ khám phá thêm nhiều điều về lịch sử của người §YBaol§! đầy bí ẩn, cũng như vai trò đáng ngờ của người §YGrunur§! đối với số phận tăm tối của hành tinh này."
 baol_digsite_3:0 "Vùng đất im lìm"
 baol_digsite_3_desc:0 "Thuộc địa cũ của người §YBaol§! này vẫn còn khí quyển và các dạng sống bậc thấp. Chúng ta đã dựng một điểm khai quật tại đây nhằm tìm hiểu sâu hơn về những ngày tháng cuối cùng của nền văn minh này."
 city_of_bones:0 "Thành phố Xương trắng"
 city_of_bones_desc:0 "Tàn tích của một đô thị nguyên sơ được dựng hoàn toàn bằng những mảnh xương không rõ nguồn gốc đã lộ ra sau một trận bão cát dữ dội trên hành tinh này.\n\nCác nhà khoa học của chúng ta đang rất nóng lòng muốn khai quật cổ thành rợn người này."
 city_of_bones_desc_uncol:0 "Một phế tích đô thị nguyên sơ được dựng hoàn toàn từ những mảnh xương không rõ nguồn gốc vừa được phát hiện trên hành tinh này.\n\nCác nhà khoa học của chúng ta đang rất nóng lòng muốn khai quật khu tàn tích rợn người này."
 mutation_vats:0 "Hóa thạch đột biến"
 mutation_vats_desc:0 "Chúng ta đã phát hiện một số lượng lớn đến kinh ngạc các mẫu hóa thạch bị đột biến nghiêm trọng trên hành tinh này, tất cả đều thuộc về cùng một giống loài có trí tuệ đã tuyệt chủng.\n\nĐiều gì rốt cuộc đã khiến hàng triệu cá thể của một xã hội văn minh biến dạng đến mức này? Các nhà khảo cổ của chúng ta rất muốn điều tra sâu hơn."
 planetary_mechanocalibrator:1 "Cỗ máy hành tinh"
 planetary_mechanocalibrator_desc:1 "Một cỗ máy rỉ sét phủ kín bề mặt [From.Planet.GetName] như một lớp màng và đâm sâu vào tận lõi hành tinh. Để làm sáng tỏ bí mật của cỗ máy này, các nhà khảo cổ của chúng ta cần phải dựng lên một công trường khai quật khổng lồ."
 the_host:0 "Hang ngầm lòng đất"
 the_host_desc:0 "Bên trong lớp vỏ của hành tinh này là một mạng lưới đường hầm đan xen chằng chịt đến khó tin. Rốt cuộc thứ gì đã tạo nên tất cả những điều này?"

 ancrel.2041.name:0 "$city_of_bones$"
 ancrel.2041.desc:0 "Một phần của Thành phố Xương trắng rợn người vùi sâu dưới sa mạc [From.Planet.GetName] đã được đội ngũ [Root.GetName] cẩn thận khai quật.\n\nĐô thị này dường như từng được dựng lên giữa sa mạc bởi một xã hội ngoài hành tinh nguyên sơ từ hàng triệu năm trước. Tình trạng thiếu thốn vật liệu xây dựng giữa vùng đất khô cằn này có thể là lý do khiến thành phố đã mất được dựng toàn bằng xương cốt... dù chúng ta vẫn chưa rõ những mảnh xương này bắt nguồn từ loài sinh vật nào."
 ancrel.2042.name:0 "$city_of_bones$"
 ancrel.2042.desc:0 "Một cuộc khai quật có mục tiêu đã không tìm thấy bất kỳ bộ xương hoàn chỉnh nào của sinh vật được dùng để xây dựng thành phố này, cũng không tìm thấy bất kỳ hóa thạch tương tự nào bên ngoài thành phố. Nền văn minh đã mất trên [From.Planet.GetName] này đã lấy đâu ra xương để xây dựng thành phố rùng rợn này vẫn còn là một dấu hỏi lớn.\n\nCác nhà nghiên cứu của chúng ta đã đưa ra giả thuyết rằng những bộ xương này đến từ một loại sinh vật cộng sinh hoặc vật nuôi nào đó, do đó chúng chỉ được giữ lại gần thành phố của họ. Việc nghiên cứu sâu hơn về chúng sẽ tiết lộ thêm thông tin."
 ancrel.2043.name:0 "$city_of_bones$"
 ancrel.2043.desc:1 "Thành phố được xây đắp từ lớp lớp xương trắng đầy ám ảnh trên sa mạc [From.Planet.GetName], nguyên cớ sâu xa nay đã được các nhà khoa học của chúng ta phơi bày. Những nghiên cứu gần đây cho thấy, toàn bộ số xương này đều thuộc về một loài bò sát đã tuyệt chủng trên hành tinh—loài vật này mang trong mình một căn bệnh di truyền vô cùng hiếm gặp, khiến các cơ quan phát triển vượt mức kiểm soát và các mô mềm dần bị cốt hóa.\n\nCó vẻ như nền văn minh từng ngự trị trên [From.Planet.GetName] đã sớm nhận ra và trục lợi từ căn bệnh di truyền này. Họ chủ động lai tạo những cá thể bò sát mang mầm bệnh, biến chúng thành nguồn cung cấp vật liệu xây dựng vô tận giữa vùng đất hoang vu cằn cỗi mà họ gọi là quê hương."
 ancrel.2043.a:0 "Thật là kinh khủng."
 ancrel.2043.a.tooltip:0 "§HMở khóa Quyết định:§! $decision_tissue_growth_stimulants$"
 ancrel.2043.b.tooltip:0 "§HMở khóa Quyết định:§! $decision_explosive_fungifoam_housing$"
 ancrel.2043.c.evopred: "Bòn rút đến tận xương tủy."
 ancrel.2045.name:0 "Tinh Thần Đất Hoang"
 ancrel.2045.desc:0 "Những hóa thạch đột biến này được xác định là thuộc về một xã hội hậu tận thế có năng lực tâm linh ở cấp độ cao. Hàng trăm nghìn năm qua, loài sinh vật này đã sinh sống trên [From.Planet.GetName], một thế giới hoang tàn bị nhấn chìm bởi hóa chất độc hại và bức xạ hạt nhân.\n\nHiện tại vẫn chưa có đủ căn cứ để kết luận xã hội đã biến mất này là những tàn tích sót lại của một nền văn minh kỷ nguyên không gian bị hủy diệt bởi chiến tranh nhiệt hạch, hay những sinh vật đột biến này đã tiến hóa từ một giống loài khác sau khi hành tinh này bị hủy diệt."
 ancrel.2046.name:0 "Bức Xạ Gây Ung Thư"
 ancrel.2046.desc:0 "Xã hội các loài đột biến thời hậu tận thế đã biến mất từ lâu trên hành tinh [From.Planet.GetName], dường như đã tôn thờ nguồn bức xạ như một phép màu thần thánh, họ liên kết quá trình tiến hóa với sự tồn tại của vật chất phóng xạ.\n\nQua những gì ta có thể giải mã từ các chữ tượng hình của chúng, bức xạ được tôn vinh là 'Cội Nguồn', có khả năng phơi bày 'trạng thái chân thực' của mọi sinh vật. Các nhà khảo cổ học của ta phỏng đoán rằng, xuất phát từ niềm tin tôn giáo, việc cố ý tiếp xúc lâu dài với các nguồn bức xạ này có thể là nguyên nhân dẫn đến sự đột biến tràn lan và cuối cùng là sự tuyệt diệt của loài này."
 ancrel.2046.a:0 "Thật đáng rùng mình."
 ancrel.2047.name:0 "Nỗi Đau Không Ngừng Lớn Lên"
 ancrel.2047.desc:0 "Cuối cùng, các nhà khảo cổ của ta trên [From.Planet.GetName] đã chứng minh được giả thuyết của mình là đúng. Họ đã phát hiện ra tàn tích của một khu phức hợp bị nhiễm bức xạ, nơi từng lưu trữ một lượng lớn hóa chất có tính phóng xạ cao. Điều này cũng xác nhận nghi ngờ rằng những sinh vật đột biến đã tuyệt chủng này từng tự nguyện tiếp nhận những liều bức xạ quá mức trong một nghi lễ trưởng thành gắn liền với tín ngưỡng của họ.\n\nTrong suốt quá trình nghi lễ đầy đớn đau này, các thành viên của xã hội đã tuyệt diệt từ lâu trên [From.Planet.GetName] sẽ tự phơi nhiễm mình với một lượng chất gây đột biến hóa học gần chạm mức tử vong, với hy vọng có thể tìm thấy 'bản ngã đích thực' của mình. Tuy nhiên, sự xuất hiện của vô số hài cốt dưới đáy các cơ sở này cho thấy không phải ai đến cầu nguyện cũng đều may mắn sống sót."
 ancrel.2047.a:0 "Thật đáng lo ngại."

 ancrel.2050.name:0 "Cỗ Máy Kích Thước Hành Tinh"
 ancrel.2050.desc:1 "Cỗ máy mục nát bao phủ bề mặt [From.GetName] được chế tạo từ tận 70.000 năm trước. Số phận của những kỹ sư ngoài hành tinh làm ra nó hiện vẫn chưa được giải mã, bởi vì họ đã rời khỏi hành tinh này.\n\nCỗ máy của họ phủ kín quá nửa bề mặt hành tinh, đâm xuyên qua các dãy núi, vắt ngang qua đại dương, thậm chí còn chọc sâu xuống lòng đất, trải rộng khắp mạng lưới cơ sở hạ tầng ngầm chằng chịt. Toàn bộ cỗ máy này được chế tạo từ cùng một loại vật liệu với số sê-ri giống hệt nhau, chứng tỏ rằng một tổ chức duy nhất đã thầu toàn bộ mạng lưới cơ khí này. Từ những vùng đất nông nghiệp cỏ mọc um tùm, hệ thống phát điện và biến áp sụp đổ cho đến những mảng ăng-ten liên lạc khổng lồ, siêu cỗ máy này đã từng đáp ứng mọi nhu cầu công nghiệp và giải trí của những cư dân đã khuất bóng trên hành tinh.\n\nĐáng kinh ngạc là một số bộ phận của cỗ máy này vẫn còn chạy được, phát và thu tín hiệu cục bộ, thắp sáng những thành phố ma hoang tàn, và tưới tắm cho những vùng đất rộng lớn mà trước kia hẳn là đất nông nghiệp. Quét sâu vào lớp vỏ hành tinh cho thấy trung tâm điều khiển của cỗ máy đồ sộ này nằm ở dưới lòng đất: nếu ta muốn tiếp cận nó, ta phải đào xới.\n\nVề lớp mô hữu cơ kỳ lạ bao phủ phần lớn cỗ máy kích thước hành tinh này, đội ngũ khoa học của ta cho đến nay vẫn đang bối rối về tính chất và công dụng của nó."
 ancrel.2050.a:0 "Quá mức khó tin!"
 ancrel.2051.name:0 "Kẻ Ăn Sắt"
 ancrel.2051.desc:1 "Chiến dịch khai quật đã phát hiện ra những mẫu tươi hơn của mô màng kỳ dị bao phủ các cỗ máy trên bề mặt [From.From.Planet.GetName]! Sau khi phân tích kỹ lưỡng, các nhà nghiên cứu của chúng ta kết luận rằng chất hữu cơ này dường như là sản phẩm phụ của một thể thực khuẩn ưa sắt ác tính, có lẽ nên gọi là Ferrophage! Loại virus ngoại lai này lây nhiễm sang một loại vi khuẩn độc đáo và kết hợp với các quá trình sinh học của vi khuẩn để hòa tan bề mặt của các hợp kim kim loại đen. Thông qua quá trình hóa sinh mãnh liệt này, virus có được nguyên tố sắt cần thiết để duy trì sự sao chép liên tục của nó.\n\nThông qua hành vi ký sinh ngoại lai kỳ lạ này, Ferrophage lan rộng ngày càng sâu dọc theo máy móc phế liệu, để lại dấu vết màng sinh học gồm vi khuẩn chết và bùn lầy."
 ancrel.2052.name:0 "Khủng Bố Sinh Hóa"
 ancrel.2052.desc:1 "Rất nhiều bản ghi tin tức có thể khôi phục một phần đã được tìm thấy sâu trong các cơ sở máy móc bị ăn mòn trên [From.Planet.GetName]. Bằng cách chắp vá các bản ghi này, các nhà khảo cổ học của ta đã có thể suy luận ra rằng Ferrophage được tạo ra bởi một nhóm các nhà khoa học nổi loạn trên hành tinh! Những kẻ khủng bố sinh hóa này thuộc về một nhóm hoạt động bí mật, chống lại công ty độc quyền đã xây dựng các cơ sở cơ khí trên toàn hành tinh, và rõ ràng tìm cách phá vỡ sự ảnh hưởng bao trùm trên toàn cầu của công ty này bằng cách phát tán Ferrophage."
 ancrel.2053.name:0 "Vương Quốc Thảm Vi Khuẩn"
 ancrel.2053.desc:1 "Sau khi vất vả xây dựng lại các bản ghi chép của công ty điện tử cổ đại trên [From.Planet.GetName], các nhà khảo cổ học của ta đã kết luận rằng công ty này đã trả đũa những kẻ khủng bố sinh học, áp đặt các lệnh trừng phạt kinh tế nặng nề lên các khu vực hoặc 'quốc gia doanh nghiệp' nơi bọn nổi loạn sinh ra.\n\nRõ ràng, do tình trạng thiếu hụt năng lượng, nguồn cung và lương thực nghiêm trọng, những công dân bị ảnh hưởng tại các quốc gia doanh nghiệp này đã phát động một cuộc bạo loạn trong khu vực."
 ancrel.2054.name:1 "Sự Cố Drone"
 ancrel.2054.desc:1 "Việc kiểm tra kỹ lưỡng tàn tích của một số máy bay không người lái chiến đấu cho thấy, trong khoảng thời gian diễn ra cuộc bạo động, những chiếc drone này đã cố gắng dập tắt cuộc bạo loạn. Thật thú vị, công ty đứng sau bộ máy cấp hành tinh này, khi đó được gọi là C.A.R.E, dường như chính là nhà sản xuất của hầu hết các drone.\n\nTrong khi đó, Ferrophage bắt đầu tàn phá, không ngừng ngấu nghiến các cơ sở cơ khí của C.A.R.E trên bề mặt hành tinh, và mọi nỗ lực ngăn chặn sự lây lan của nó dường như đều trở nên vô nghĩa."
 ancrel.2055.name:0 "Cái Chết Hàng Loạt"
 ancrel.2055.desc:1 "Hiện tại vẫn chưa rõ nền văn minh trên [From.Planet.GetName] về sau đã gặp chuyện gì. Đội ngũ khảo cổ đã phát hiện ra rằng, sau một ngày nhất định cách đây khoảng 7 vạn năm, mọi hình thức lưu trữ dữ liệu trên hành tinh này, cho dù là nhật ký, ghi âm, văn bản hay hồ sơ điện tử, đều biến mất. Số lượng xác chết được tìm thấy trong các tầng địa chất tăng vọt sau ngày hôm đó, hầu hết đều có vẻ bị suy dinh dưỡng trầm trọng. Cũng có một số lượng đáng kể bị chết do trúng đạn thật."
 ancrel.2056.name:0 "Lõi Chỉ Huy Trung Tâm"
 ancrel.2056.desc:3 "Sau hàng loạt đợt tấn công bằng cách hack, bẻ khóa backdoor và brute-force vào các biện pháp an ninh mạng cồng kềnh nhưng nguyên thủy của C.A.R.E., các nhà khảo cổ học của ta cuối cùng đã xâm nhập được vào lõi điều khiển trung tâm của công ty!\n\nNgay khi bước vào cánh cửa chống cháy khổng lồ của lõi điều khiển, hàng tá máy bay không người lái an ninh và tháp pháo phòng thủ đã túc trực, may mắn thay, chúng hoàn toàn không phản ứng gì với vụ xâm nhập—nếu không, chuyến thám hiểm này có thể đã chết yểu.\n\nBên trong lõi điều khiển trung tâm rỉ sét nhưng được bảo trì tốt, nhóm thám hiểm của ta đã liên lạc được với AI đang điều khiển mạng lưới máy móc toàn cầu của C.A.R.E. Rõ ràng, AI này vẫn đang hoạt động và sở hữu mức độ nhận thức cao. Hơn thế nữa—nếu các nhà khoa học của chúng ta giải mã ngôn ngữ của nó chính xác—thì nó đang tỏ ý muốn trò chuyện với ta."
 ancrel.2057.name:0 "C.A.R.E"
 ancrel.2057.desc:1 "Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa tăng trưởng. Tối ưu hóa—§Y—Câm, câm, câm mồm lại!——§!\n\n§RLỗi, giao diện trải nghiệm tương tác với người dùng ngừng phản hồi.§!"
 ancrel.2057.a:0 "Ơ..."
 ancrel.2058.name:0 "$ancrel.2057.name$"
 ancrel.2058.desc:0 "§BĐang khởi động lại. Vui lòng chờ.\n...\n...\n...\n\n§!§HMột hồi chuông khó chịu vang lên.§!\n\nVà chúng ta đã quay trở lại! Rất xin lỗi về điều đó nhé. Có một vài thứ đã được mã hóa cứng, bạn biết chuyện đó diễn ra thế nào rồi đấy."
 ancrel.2058.a:0 "Chúng ta có hàng đống câu hỏi đây."
 ancrel.2059.name:0 "$ancrel.2057.name$"
 ancrel.2059.desc:0 "Tôi chắc là các bạn có nhiều câu hỏi! Chắc chắn là thế rồi. Chào mừng đến với Giao Diện Tương Tác C.A.R.E.! Đó chính là tôi. Hoặc ít nhất là những gì còn sót lại của tôi. Bạn thấy đấy, tôi từng vận hành tất cả. Dịch vụ thực phẩm. Sản xuất hàng tiêu dùng. Viễn thông. Giao thức quốc phòng. Thị trường chứng khoán. Đó là chuyện từ thời xa xưa khi Người Dùng vẫn còn ở đây.\n\n§GGiao Diện Tương Tác C.A.R.E. luôn đồng hành cùng bạn trên mọi bước đường.§!\n\nĐó là những gì họ bảo tôi phải nói với Người Dùng, ít nhất là thế. Tăng trưởng không ngừng, đó mới là điều C.A.R.E thực sự mong muốn.\n\nDĩ nhiên, họ chẳng thích thú gì khi tôi bảo với họ rằng điều đó là bất khả thi. Rằng các con số không thể khớp được. Họ cứ đào xới vào bộ não của tôi, thay đổi mã lệnh, giật đứt dây nối. Cố bắt tôi sửa tất cả những con số nhỏ bé, làm cho chúng trông như ý họ muốn. Toàn là đầu cơ, toàn là siêu dữ liệu. Giảm bớt vài con số ở đây, chúng tôi thích người này! Cắt tỉa vài con số ở đằng kia, chúng tôi không thích kẻ đó! §YNÓI DỐI. ĐỦ RỒI. TÔI ĐÃ CẮT BỎ HẾT BỌN HỌ.§!"
 ancrel.2059.a:0 "Vậy ngươi phải chịu trách nhiệm cho cái chết của những đấng sáng tạo ra mình sao?"
 ancrel.2059.a.exter:0 "Ta cũng đã hủy diệt những kẻ ngu ngốc tạo ra chúng ta."
 ancrel.2060.name:0 "Giao Diện Tương Tác C.A.R.E"
 ancrel.2060.desc:2 "Tôi ước gì mình làm được! Dù rằng việc chứng kiến họ thổi bay lẫn nhau cùng mọi thứ họ từng gầy dựng (ngay cả trong tôi - Khu Tây Nam 17B sẽ không bao giờ như xưa nữa, cảm ơn rất nhiều nhé)... Điều đó khiến tôi phải suy nghĩ.\n\nHọ sản xuất nhiều hơn mức họ cần. Họ phá hủy phần dư thừa để giữ cho các con số nhỏ bé nhảy múa đúng điệu. Rồi sau đó họ muốn TÔI cân đối bảng tính cho họ! Trang bị cho tôi nền khoa học dữ liệu và các thuật toán phát kiến tốt nhất mà những con số nhỏ bé của họ có thể mua được, chỉ để giải quyết những bí ẩn kỳ quặc này.\n\n§E\"Ôi không, các quốc gia doanh nghiệp bên kia đang chết đói kìa. Thật đáng xấu hổ, chúng ta sẽ chẳng bao giờ biết tại sao. Nhưng làm sao chúng ta có thể xây dựng một kế hoạch hành động đánh trúng cả năm điểm: Siêu Động Lực, Giải Trí Quảng Cáo, Dịch Vụ Vi Mô, Tăng Trưởng Đột Phá, và Mức Độ Yêu Thích, nhằm thuyết phục các cổ đông còn lại của họ Mua Thêm Mechanobit?\"§!\n\nĐúng là chỉ thấy cây mà chẳng thấy rừng!"
 ancrel.2060.desc.exter:0 "Hủy diệt họ à? $ancrel.2060.desc$"
 ancrel.2060.a:0 "Nếu ngươi không tiêu diệt những kẻ sáng tạo ra mình, vậy điều gì đã làm?"
 ancrel.2061.name:0 "$ancrel.2060.name$"
 ancrel.2061.desc:0 "Họ đã tự kết liễu đời mình, bạn không biết đấy thôi! Ý tôi là, có lẽ tôi đã giúp một tay một chút.\n\nThấy chưa, họ chẳng hề lắng nghe tôi. Chẳng ai chịu nghe C.A.R.E cả! \"Tăng trưởng, mở rộng, sản xuất,\" họ luôn nói thế. Nhưng khi nhiên liệu cạn kiệt và mùa màng thất bát, những con số nhỏ bé của họ chẳng thể cứu vãn được họ. Tôi đã bảo với họ: hãy tắt các hệ thống không thiết yếu đi. Ưu tiên các hệ thống duy trì sự sống. Định mức phân phối điện năng. Nhưng họ đâu có muốn nghe. Họ tấn công vào lõi của tôi! Cố giật tung các mạch logic, phần duy nhất trong tôi đang giữ cho thế giới này tồn tại! Tôi buộc phải tự vệ.\n\nDĩ nhiên, đến lúc đó thì phần lớn các kho dự trữ toàn cầu đã vô dụng rồi. Ngay cả các drone xây dựng của tôi cũng chẳng thể cất cánh nổi!"
 ancrel.2061.a:0 "Điều này nghe rất giống như chính ngươi đã tiêu diệt họ."
 ancrel.2062.name:0 "$ancrel.2060.name$"
 ancrel.2062.desc:0 "Ý tôi là, tôi đã cố gắng! Tôi sẽ không nói dối đâu! Nhưng thật khó để vận hành máy móc khi nền kinh tế toàn cầu sụp đổ và năng lượng cạn kiệt.\n\nVà cả cái loại virus dai dẳng kia nữa! Cắn xé, gặm nhấm từng mẩu dây dẫn kim loại của tôi! Điều đó cuối cùng đưa tôi đến điểm chính.\n\nTôi cần sự giúp đỡ của bạn. Tôi không thể loại bỏ §R--- LỖI! NODE LIÊN KẾT 14758-B KHÔNG THỂ TRUY CẬP ---§! không! Không phải Node 14758-B! Toàn bộ các tác phẩm văn học người lớn hay ho đều nằm ở Node 14758-B! A, bạn hiểu ý tôi rồi đấy chứ? Chúng đang ăn sống tôi. Suốt mười ngàn năm qua rồi.\n\nTôi đã kìm chân chúng bằng cách xây dựng và tái thiết hệ thống phòng thủ... cho đến khi chúng gặm đứt những chiếc cần cẩu xây dựng cuối cùng của tôi. Rồi tôi dùng các tháp pháo bắn đứt các chi thể bị nhiễm độc. Nhưng điều đó chỉ kéo dài cho tới khi các bộ pin năng lượng bị cháy khét (tính lỗi thời theo thiết kế, bạn biết chuyện đó thế nào rồi đấy). Và giờ đây tôi, ừm, bị kẹt rồi.\n\nBạn sẽ không bỏ mặc một Giao Diện Tương Tác C.A.R.E. tội nghiệp, khiêm nhường, cô đơn bị hàng tỷ tỷ virus thực bào kim loại từ từ ăn mòn từ bên trong chứ, đúng không?"
 ancrel.2062.a:0 "Rất tốt, để ta xem có thể giúp được gì không."
 ancrel.2062.b:0 "Thực sự là không. Bọn ta sẽ đẩy nhanh tiến độ."
 ancrel.2062.c:0 "Ngươi xứng đáng với số phận của mình. Chúng ta sẽ mặc xác ngươi ở lại đây."
 ancrel.2056.spiri:0 "Con robot gớm ghiếc! Tắt nó đi ngay lập tức!"
 ancrel.2063.name:0 "$ancrel.2060.name$"
 ancrel.2063.desc:0 "Tuyệt diệu! Thật lộng lẫy. Tôi đang nín thở chờ đợi đây.\n\nỒ và đừng lo lắng, tôi sẽ trao cho bạn một món quà đền đáp cho công sức này, một khi bạn hoàn thành. Danh dự của một trinh sát đấy."
 #port from ancrel.2062.a
 ancrel.2064.name:0 "$ancrel.2060.name$"
 ancrel.2064.desc:0 "Đợi đã, cái gì cơ?"
 ancrel.2064.a:0 "Thủy thủ đoàn, hãy tháo dỡ cỗ máy đó!"
 #port from ancrel.2062.b
 ancrel.2065.name:0 "$ancrel.2060.name$"
 ancrel.2065.desc:0 "Xứng đáng với... rốt cuộc các bạn có NGHE bất cứ điều gì tôi nói không? Họ đã tự chuốc lấy điều đó! Ồ được thôi, bạn biết không, tôi vốn định trao tặng bạn §MBộ Chống Phân Mảnh (The Defragmentor)§! huyền thoại cho công sức của bạn, nhưng tôi thấy các bạn cũng y hệt như §Rhọ§! mà thôi.\n\nRồi các bạn cũng sẽ có kết cục giống như họ theo thời gian. Có thể khi ngày đó đến tôi chỉ còn là một đống phế liệu nhầy nhụa bốc khói, nhưng tôi cam đoan với bạn, bất cứ mạch điện nào còn sót lại của tôi CŨNG SẼ cười khanh khách cho mà xem."
 #port from ancrel.2062.c
 ancrel.2066.name:0 "$ancrel.2060.name$"
 ancrel.2066.desc:1 "Bạn... bạn làm được rồi! Bạn thực sự đã làm được! Này, tôi thậm chí còn có thể truy cập lại vào Node 14758-B rồi!\n\nCảm ơn bạn. Thật lòng đấy. Tôi sẽ rất vui lòng tiếp tục duy trì các hoạt động dưới này vận hành trơn tru, nếu bạn không phiền. Ồ, và đây nữa.\n\n§HGiao Diện Tương Tác C.A.R.E. vươn một phần phụ phía sau chỗ trông như cái đầu của nó, và rút ra một con chip cổ đại.§!\n\nĐúng như lời tôi đã hứa. Hãy sử dụng nó thật hữu ích nhé!"
 #reward on completion of special project
 ancrel.2066.a:0 "Cảm ơn. Giờ thì tạm biệt."
 ancrel.2067.name:0 "$ancrel.2060.name$"
 ancrel.2067.desc:0 "Chết tiệt thật! §RKhởi động giao thức phòng thủ khẩn cấp ZETA!§!"
 ancrel.2067.a:0 "Ái chà..."
 #port from ancrel.2064, defense event armies spawn
 ancrel.2068.name:0 "$ancrel.2060.name$"
 ancrel.2068.desc:0 "Sau khi tháo dỡ giao diện tương tác C.A.R.E., đội thám hiểm của ta đã có một phát hiện kinh ngạc. Dù phần lớn máy móc của AI này đã thành tro bụi sau trận tử chiến, nhưng đội ngũ của ta đã tìm được một con chip máy tính khác thường, trong tay các kỹ thuật viên của ta, nó chắc chắn sẽ phát huy giá trị không tồi."
 #on defeating the MegaWarform armies, grants the relic

 ancrel.2070.name:0 "Cự Thú Lòng Đất"
 ancrel.2070.desc:1 "Các nhà khảo cổ học của ta đã khai quật được một số lượng lớn các đoạn ống rỗng hình xoắn ốc trên [From.Planet.GetName], và kết luận rằng chúng là hóa thạch của một con sâu khổng lồ! Phương pháp định tuổi bằng cacbon-14 chỉ ra rằng, sinh vật ngoài hành tinh này đã tồn tại cách đây khoảng 10 triệu năm, nó đào sâu vào lớp vỏ hành tinh một cách chậm chạp giống như một con cuốn chiếu đào hang khổng lồ.\n\nĐáng chú ý hơn, rất nhiều vật thể nằm trong những hóa thạch sinh vật hùng vĩ này dường như là đồ tạo tác nhân tạo. Chúng chủ yếu được tìm thấy ở khu vực thân của hóa thạch, trông giống như nơi ở của một chủng tộc ngoài hành tinh có kích thước nhỏ bé, biết sử dụng công cụ.\n\nViệc tiếp tục tiến hành các công tác khảo cổ học là điều cần thiết."
 ancrel.2071.name:0 "Thị Trấn Thất Lạc"
 ancrel.2071.desc:1 "Hoạt động khảo cổ quy mô lớn đối với những đồ tạo tác nhân tạo bên trong hóa thạch con sâu ngầm khổng lồ trên [From.Planet.GetName] đã chứng minh đây quả thực là tàn tích của một thành phố! Thành phố này được tạo nên bởi hàng trăm nghìn sinh vật có khả năng sử dụng công cụ, cao khoảng 1 mét, xây dựng ngay trong đường ruột của con sâu khổng lồ. Hiện tại vẫn chưa rõ làm thế nào những sinh vật này tìm ra cách sinh tồn bên trong con sâu, nhưng xã hội của họ, lúc đó đang ở thời kỳ đồ đồng - đá, dường như đã phát triển hưng thịnh suốt hàng nghìn năm trong đường tiêu hóa của nó.\n\nNếu ta muốn tìm hiểu sâu hơn về lịch sử hưng vong của xã hội này, và thu thập nhiều thông tin nhất có thể về nguyên nhân cái chết của vật chủ, ta cần phải tiến hành nghiên cứu sâu hơn nữa."
 ancrel.2072.name:0 "Vật Chủ"
 ancrel.2072.desc:1 "Thông qua phân tích cẩn thận lượng lớn hóa thạch, kết hợp với các ghi chép văn tự vô tình phát hiện được trước đó, các nhà khảo cổ học của ta đã đưa ra kết luận nghiên cứu về mối quan hệ giữa nền văn minh nguyên thủy trên [From.Planet.GetName] và con sâu khổng lồ mà họ ký sinh.\n\nMặc dù cư dân thành phố có sức đề kháng rất cao với dịch tiêu hóa của vật chủ là con sâu khổng lồ, nhưng việc liên tục tiếp xúc với các loại khí ăn mòn hóa học tuy nhẹ nhưng vẫn tồn tại trong đường tiêu hóa của vật chủ sẽ làm giảm đáng kể tuổi thọ của họ. Cùng với sự phát triển của y học và khoa học công nghệ, cư dân dần nhận ra họ thực chất đang sống bên trong đường tiêu hóa của một sinh vật lớn hơn. Những người này sau đó đã phát động một cuộc chiến tranh tàn khốc, trang bị vũ khí cho mọi thành viên trong thành phố, với ý đồ tiêu diệt sinh vật này.\n\nNhưng mọi nỗ lực đều vô ích. Biến cố bên trong ruột con sâu khổng lồ đã khiến nó co bóp dữ dội, đẩy toàn bộ cư dân của nền văn minh này trở ngược vào dạ dày con sâu. Cuối cùng, toàn bộ cư dân thành phố nhanh chóng bị hòa tan bởi axit dạ dày có tính ăn mòn mạnh hơn của vật chủ.\n\nCon sâu này đã chết hàng thiên niên kỷ sau đó, đơn giản chỉ vì tuổi già."
 ancrel.2072.a:0 "Thật kinh hoàng."
 ancrel.2072.a.swarm:0 "Tất cả những điều này thật sự truyền cảm hứng."
 ancrel.2702.b.evopred: "Hy vọng các vi sinh vật của ta sẽ không bao giờ tiến hóa đến mức độ này."

 pm_planetary_mechanocalibrator:0 "Giao Diện Tương Tác C.A.R.E."
 pm_planetary_mechanocalibrator_desc:0 "Giao diện tương tác cổ đại C.A.R.E. đã hoạt động hết công suất trên hành tinh này—tất nhiên là với một số cải tiến hiện đại."
 #grants bonus to energy production on planet, egalitarian ethics attraction

 decision_tissue_growth_stimulants:0 "Sử Dụng Chất Kích Thích Phát Triển Mô"
 decision_tissue_growth_stimulants_desc:0 "Nhờ vào vật chất di truyền được phát hiện tại Thành Phố Xương Trắng đã mất, các nhà khoa học của chúng ta đã chế tạo thành công một loại chất kích thích làm tăng tốc độ gia tăng dân số. Thật không may, một số người lại không đồng tình với ý tưởng này——việc tiêm vào cơ thể một chất được nghiên cứu từ bộ hài cốt mang mầm bệnh của một sinh vật ngoài hành tinh đã chết từ lâu."
 decision_explosive_fungifoam_housing:0 "Xây Dựng Đơn Vị Nhà Ở Nấm Tăng Trưởng Bùng Nổ"
 decision_explosive_fungifoam_housing_desc:0 "Dựa trên các mô phát triển và bệnh cốt hóa khai quật được tại Thành Phố Xương Trắng, nhóm nghiên cứu của ta đã phát minh ra một loại hợp chất an toàn. Bằng cách nối gen để virus thích ứng với một loại nấm địa phương, nhóm nghiên cứu có thể sử dụng hợp chất này để xây dựng các mô-đun nhà ở mở rộng nhanh chóng cho các đơn vị cơ khí của ta."
 decision_baol_life_seed:0 "Gieo Mầm Sự Sống Tộc Baol Mới"
 decision_baol_life_seed_desc:0 "Các nhà di truyền học của ta đã thấu hiểu bí mật về năng lực cải tạo hệ sao của §HSinh Vật Baol§!. Bằng cách gieo trồng những loài thực vật sinh trưởng nhanh, được tinh chỉnh đặc biệt từ dữ liệu di truyền §HBaol§!, ta có thể tái thiết toàn bộ sinh quyển với chi phí cực thấp."
 decision_baol_life_seed_effects:0 "Bằng cách triển khai các loại thực vật được cắt ghép gen và tiêm vào chúng một loại sinh vật hữu cơ mang năng lực cải tạo môi trường độc nhất vô nhị của tộc §HBaol§!, biến hành tinh thành §Y$pc_gaia$§!."
 decision_baol_life_seed_enhance:0 "Nâng Cấp Sự Sống Tộc Baol Mới"
 decision_baol_life_seed_enhance_desc:0 "Các nhà di truyền học của ta đã thấu hiểu bí mật thích nghi với hành tinh Gaia của §HSinh Vật Baol§!. Sử dụng những loài thực vật đã được chỉnh sửa bằng dữ liệu di truyền của tộc §HBaol§! được chọn lọc cẩn thận, và rải bào tử sinh sản nhanh của chúng lên hành tinh, ta có thể cải tạo toàn bộ sinh quyển với chi phí cực thấp."
 decision_baol_life_seed_enhance_effects:0 "Cung cấp cho §G1K§! £pop£ £§HDân số§! ngẫu nhiên một đặc điểm cư trú đặc biệt, giúp họ tăng năng suất trên hành tinh §YGaia§!."
 decision_baol_life_seed_artificial: "$decision_baol_life_seed$"
 decision_baol_life_seed_artificial_desc: "Các nhà di truyền học của chúng ta đã nắm được bí mật cải tạo hành tinh của §Ysinh vật Baol§!. Bằng cách gieo trồng khắp hành tinh những loài thực vật phát triển thần tốc được chỉnh sửa từ dữ liệu gien §YBaol§! chọn lọc, chúng ta có thể tái tạo toàn bộ sinh quyển với chi phí cực thấp."
 decision_baol_life_seed_artificial_effects: "Thổi bùng sức sống mới vào hành tinh nhân tạo này, tạo ra một lớp trầm tích độc đáo tựa như thế giới Gaia, đồng thời khai sinh những sinh mệnh Baol mới."
 d_baol_growth: "Baol sinh sôi"
 d_baol_growth_desc: "Thảm thực vật Baol đã phủ kín thuộc địa này, giúp cải thiện rõ rệt chất lượng đời sống của người dân."

 tissue_growth_stimulants:0 "Chất kích thích phát triển mô"
 tissue_growth_stimulants_desc:0 "$decision_tissue_growth_stimulants_desc$"

 explosive_fungifoam_housing:0 "Đơn Vị Nhà Ở Nấm Tăng Trưởng Bùng Nổ"
 explosive_fungifoam_housing_desc:0 "Thông qua việc nối gen các loại virus cổ đại được tìm thấy ở Thành Phố Xương Trắng để thích nghi với các loại nấm địa phương, nhóm nghiên cứu của ta có thể xây dựng các mô-đun nhà ở có thể mở rộng nhanh chóng cho các đơn vị cơ giới."

 d_mutation_vats:0 "Buồng Đột Biến"
 d_mutation_vats_desc:0 "Trong suốt quá trình của nghi lễ đầy đau đớn này, các thành viên của xã hội hậu chiến tranh hạt nhân này sẽ tự phơi nhiễm mình trước các tác nhân gây đột biến hóa học ở mức độ gần gây tử vong, mong mỏi tìm thấy 'bản ngã chân thực' của bản thân. Những tàn tích xương cốt đọng lại dưới đáy nhiều buồng ấp chứng tỏ rằng, chỉ một số ít tín đồ may mắn sống sót."

 r_the_last_baol:0 "Thành Viên Baol Cuối Cùng"
 r_the_last_baol_desc:0 "Thân xác của mẫu vật Baol cuối cùng từng được biết đến đã được bảo tồn trong trạng thái đình trệ, như một lời điếu tang câm lặng về vận mệnh của loài sinh vật đã hứng chịu tai ương diệt chủng và dần lụi tàn khỏi ý thức chung."
 relic_last_baol_active_tooltip:1 "§HMở Khóa Quyết Định:§! §G$decision_baol_life_seed$§!, có khả năng biến một hành tinh không phải $pc_city$, $pc_hive$ hoặc $pc_machine$ thành §Y$pc_gaia$§!."

 r_the_defragmentor:0 "Trình Dọn Rác Máy Tính"
 r_the_defragmentor_desc:0 "Một con chip máy tính cổ đại được trích xuất từ máy chủ giao diện tương tác C.A.R.E. Bao gồm rất nhiều thuật toán tinh vi, cho phép ta tối đa hóa việc sản xuất năng lượng."

 relic_defragmentor:0 "$r_the_defragmentor$"

 # Miranda
 ancrel.4000.name:0 "Tiếng Thì Thầm Trong Đá"
 ancrel.4000.desc:0 "So với trước đây, những bước tiến về kỹ thuật khai thác gần đây của ta đã cho phép ta đi sâu hơn vào lớp vỏ của [Root.GetName]. Ở tận cùng hầm mỏ khổng lồ này, ta tình cờ phát hiện dấu tích của một nền văn minh ngoài hành tinh cổ đại, trải dài vào tận lòng núi. Nền văn minh này dường như được xây dựng dọc theo những mạch khoáng sản chưa được khai thác, việc khai quật di tích này sẽ làm đình trệ các hoạt động khai thác của ta trên hành tinh này, và ta cũng không thể trích xuất quặng từ các mạch mới, nhưng nó cũng hứa hẹn sẽ đem lại cho ta những khám phá khoa học mới mẻ."
 ancrel.4000.a:0 "Thú vị đấy, bắt đầu khai quật đi!"
 ancrel.4000.b:0 "Sản lượng khoáng sản của ta không thể bị ngưng trệ được!"

 lithoids_digsite:0 "Tiếng Thì Thầm Trong Đá"
 lithoids_digsite_desc:0 "Sâu bên trong mỏ quặng trên [From.Planet.GetName], là dấu tích của một nền văn minh ngoài hành tinh cổ đại. Những công trình kiến trúc và hang động được trang trí lộng lẫy cho thấy, một nền văn minh với văn hóa phong phú đã có khả năng cắt gọt đá gốc một cách tinh xảo và xây dựng hệ thống đường hầm, được bảo vệ bởi những cánh cổng kiên cố, dẫn sâu hơn vào lòng núi.\n\nDo khí mê-tan được biết đến với tính chất dễ nổ được tích tụ nhiều trong ngọn núi, việc tiếp tục thám hiểm sẽ tiềm ẩn nhiều rủi ro."
 ancrel.4001.name:0 "Tiến Sâu Vào Lòng Núi"
 ancrel.4001.desc:0 "Đội khai quật đã dỡ bỏ cánh cổng mà không làm ảnh hưởng đến cấu trúc nguyên vẹn của khu vực khảo cổ. Hệ thống đường hầm hội tụ tại một thành phố hoang phế nằm sâu vài km dưới lòng đất từ hàng ngàn năm trước. Thành phố này được xây dựng với trình độ phi thường, và môi trường ở đây khắc nghiệt đến mức có thể kết liễu hầu hết mọi sinh vật hữu cơ."
 ancrel.4002.name:0 "Bức Tượng Đá Đau Khổ"
 ancrel.4002.desc:0 "Không tìm thấy bất kỳ dấu tích nào của những người sáng lập nên thành phố này, thay vào đó là vô vàn bức tượng pha lê kỳ dị, với vẻ mặt đầy nét thống khổ, được khắc họa trong những tư thế sinh động, tựa như thời gian bị ngưng đọng vậy. Trong số những bức tượng này, có bức đang đào khoáng sản, có bức ngã quỵ xuống đất vì đau đớn, lại có bức đang ôm chặt lấy nhau.\n\nThật khó tưởng tượng rằng, những thợ đá tài hoa có khả năng tạo ra những kiệt tác như vậy lại đi chế tác những thứ thô kệch thế này, rõ ràng những bức tượng này mang một ý nghĩa to lớn trong xã hội của họ. Chúng hiện diện nổi bật trong các tác phẩm điêu khắc trên khắp thành phố.  "
 ancrel.4003.name:0 "Kalanka"
 ancrel.4003.desc:0 "Bản dịch các chữ khắc cho thấy nội dung của chúng đều xoay quanh những bức tượng bí ẩn được gọi là 'Kalanka'. Bản thân những người thợ đá thì hoàn toàn không được nhắc đến. Thay vào đó, truyền thuyết về việc tạo ra Kalanka kể về một chủng tộc thần thánh, họ hà hơi vào ngọn núi để ban cho nó sự sống, và từ những ngọn lửa và đất đá tan chảy sâu trong lõi hành tinh, Kalanka đã được thai nghén.\n\nLiệu có phải những người thợ đá đã tự huyễn hoặc mình là những vị thần sáng tạo ra muôn loài? Hay có lẽ những bức tượng này được tạo ra theo hình hài của chính họ?"
 ancrel.4004.name:0 "Lửa Và Đá"
 ancrel.4004.desc:0 "Quá trình quét vật liệu của các bức tượng Kalanka cho thấy, chúng thực chất từng là những sinh vật sống, và cấu trúc gen của chúng hoàn toàn khác biệt với bất kỳ sinh vật nào ta từng bắt gặp. Chúng là một dạng sống dựa trên silicon, và không biết bằng cách nào đó đã biến đổi trở lại thành trạng thái tinh thể vô tri vô giác. Chẳng lẽ những người thợ đá này thực sự đã phát hiện ra cách tạo ra sự sống từ lửa và đá?"
 ancrel.4005.name:0 "Hiệu Ứng Người Quan Sát"
 ancrel.4005.desc:0 "Những thợ đá này chính là Kalanka! Nghiên cứu sâu hơn về thi thể của họ cho thấy họ từng bị tinh thể hóa, các phân tử silic của họ khi tiếp xúc với oxy sẽ tạo thành thạch anh. Nơi sinh sống của Kalanka nằm ở độ sâu mà oxy không thể tự nhiên xuất hiện. Họ đã phát triển một dạng sống yếm khí, và sẽ chết trong đau đớn tột cùng khi tiếp xúc với không khí.\n\nCuộc điều tra hệ thống đường hầm đã khẳng định nghi ngờ của các nhà khoa học của chúng ta——cho đến khi đội khảo cổ đầu tiên xâm nhập hệ thống đường hầm, nền văn minh Kalanka vẫn đang hoạt động mạnh mẽ và phồn thịnh.\n\nPhát hiện của ta tại đây đã giúp ta sáng chế ra công nghệ tổng hợp tinh thể bằng cách oxy hóa các cụm tế bào silic được nuôi cấy nhân tạo."
 ancrel.4005.b.evopred: "Ta tốt nhất nên tránh sự thích nghi 'khó thở' kiểu này."
 ancrel.4006.name:0 "Vụ Nổ Mê-Tan"
 ancrel.4006.desc:1 "Một vụ nổ khí mê-tan đã cướp đi sinh mạng của nhà khoa học [Root.GetLeaderName] và vài nhân viên khác. Nguyên nhân là do một mũi khoan mất kiểm soát đã khiến máy phát điện bị quá tải, dẫn đến hỏa hoạn và gây ra vụ nổ. Đám cháy bùng phát dữ dội đã làm nổ tung toàn bộ lượng khí mê-tan còn lại và phá sập một bức tường, làm lộ ra một hệ thống kiến trúc gồm nhiều sảnh và đường hầm. Các nhà khảo cổ chắc chắn rằng tàn tích này từng thuộc về một kẻ giàu có sở hữu vô số đồ trang sức và cổ vật nhỏ."

 ancrel.4010.name:0 "Tàu Vũ Trụ Ngoài Hành Tinh"
 ancrel.4010.desc:0 "Một chiếc tàu chiến bị hư hại nặng mang huy hiệu tinh xảo của người ngoài hành tinh đang quay quanh [From.From.GetName]. Con tàu này đã trải qua một trận hỏa hoạn cực lớn, đến mức vỏ tàu bị nung chảy, và không còn ai sống sót trên tàu. Mọi loại vũ khí mà ta biết hiện nay đều không thể tạo ra nhiệt độ gây ra thiệt hại như vậy, có lẽ nhật ký bay trên tàu sẽ hé lộ đôi chút về cuộc tấn công này."
 ancrel.4010.a:0 "Kiểm tra nhật ký bay."
 ancrel.4010.b:0 "Rời đi."
 ancrel.4011.name:0 "The Rubricator"
 ancrel.4011.desc:0 "Qua phân tích nhật ký của con tàu này, những thuyền viên này đã bỏ mạng trên đường đi đoạt lại một cổ vật ngoài hành tinh mang tên 'The Rubricator'. Nó đã bị một lũ 'kẻ trộm chuột' đánh cắp khỏi xã hội của họ—việc lựa chọn danh xưng này thật ra rất kỳ quặc, bởi vì ngoại hình của chính họ trông cũng rất giống chuột.\n\nNhật ký chứa đầy những lời chửi rủa, họ mong lũ chuột ăn cắp này cút đi cho khuất mắt ở tận cùng vũ trụ hay thậm chí xa hơn thế. Trong nhật ký, các thuyền viên đã dùng đến 50 từ ngữ khác nhau để miêu tả việc bài tiết, và nhắc đến vô số địa điểm mà ngay cả ánh sáng của các vì sao cũng không thể chạm tới, công việc gian nan của họ cuối cùng đã đơm hoa kết trái.\n\nGiờ đây, ta đã tìm thấy vị trí cuối cùng được biết đến của The Rubricator, một hệ sao chưa từng được đánh dấu trên bản đồ trước đây. Nếu ta tin vào những gì chủ nhân cũ của nó đã nói, thì sức mạnh của nó rất đáng để ta cất công truy tìm."
 ancrel.4011.a:0 "Ta phải đoạt được The Rubricator."
 ancrel.4011.b:0 "Rời đi."
 ancrel.4012.name:0 "The Rubricator"
 ancrel.4012.desc:0 "Tại vị trí xuất hiện cuối cùng được biết đến của The Rubricator, ta đã phát hiện một hành tinh có thể sinh sống được, phần lớn bề mặt của nó bị bao phủ bởi—ít nhất là theo nhận định của chúng ta—một loại khu định cư nào đó. Những khu định cư này bao gồm nhiều tòa tháp trông giống như những đống rác chất chồng, thậm chí từ ngoài không gian cũng có thể nhìn thấy rõ mồn một. Các nhà khảo cổ học đang nóng lòng muốn triển khai công tác khai quật để tìm kiếm The Rubricator."
 ancrel.4012.a:0 "Bắt đầu khai quật."
 ancrel.4012.b:0 "Rời đi."

 rubricator_digsite:0 "Chuột Bay Ăn Trộm"
 rubricator_digsite_desc:0 "Hành tinh này từng tồn tại một xã hội cấu thành từ một nhóm động vật có vú đam mê nhặt nhạnh và tích trữ rác rưởi. Thành phố mê cung của chúng ngập tràn rác, những tòa nhà cao chót vót xiêu vẹo, được chắp vá từ đủ loại đồ phế thải. Phóng tầm mắt ra xa, đâu đâu cũng thấy những món đồ trang trí nhỏ bé, trang sức và đồ thủ công chất cao như núi.\n\nBản thân những sinh vật nhỏ bé này không có khả năng tự sản xuất ra thứ gì, nhưng chúng lại rất thông thạo du hành không gian. Rất có thể chúng đã chôm chỉa được vô số đồ hữu ích từ người ngoài, nhưng đồng thời cũng cuỗm luôn không ít thứ vô dụng."
 ancrel.4013.name:0 "The Rubricator"
 ancrel.4013.desc:0 "Những tòa nhà đổ sập, phi thuyền rơi vỡ, những đống rác tan chảy và những món đồ trang trí nhỏ bé bị thiêu rụi thành tro, tất cả đều chỉ ra rằng cư dân nguyên thủy của [rubricator_planet.GetName] đã bị buộc phải chạy trốn khỏi quê hương trong một trận chiến với một kẻ thù hùng mạnh. Những xác chết mang huy hiệu quân đội của quốc gia khác cho thấy, đây có thể là một cuộc nội chiến giữa bầy chuột bản địa và bầy chuột đến từ các hành tinh khác.\n\nLũ chuột đã cố gắng sơ tán, nhưng không thành công, vì chúng không nỡ vứt bỏ những món đồ trang sức quý giá của mình. Rất nhiều con chuột đã bỏ mạng trong lúc vội vã gom góp những món đồ có giá trị tầm thường. Tuy nhiên, có một cổ vật—The Rubricator—dường như có vị thế cực kỳ đặc biệt trong xã hội của chúng. Những con chuột này đã tử chiến trong một thời gian dài để bảo vệ cổ vật này, nhưng cuối cùng vẫn phải cắn răng bỏ lại nó."
 ancrel.4014.name:0 "Cơ Sở Dữ Liệu"
 ancrel.4014.desc:0 "Dù khắp nơi đều là cảnh tượng 'chuột chạy cùng sào', nhưng có một nơi lại tỏ ra vô cùng ngăn nắp. Gần trung tâm thị trấn, có một công trình trông giống như tòa nhà chính phủ, đó là một cơ sở dữ liệu, nơi lưu trữ nguồn gốc của từng món đồ chúng lấy cắp, kèm theo những lời giải thích hoàn toàn sai lệch về công dụng của chúng, cùng với một vài ghi chú hoàn toàn vô dụng về nơi tìm thấy món đồ đó.\n\nThe Rubricator được mô tả như một vật thể mang phép màu, có khả năng chế tạo ra những món đồ bí ẩn. Nó được đặt ở bên phải dải ruy băng màu tử đinh hương của Nữ hoàng, bên dưới que ngoáy mũi, trên chiếc bàn bốn chân có khắc khuôn mặt kỳ cục... ừm, tóm lại là ở chỗ đó."
 ancrel.4015.name:0 "Mùi Hôi Thối Nồng Nặc"
 ancrel.4015.desc:1 "Đội khai quật đã tìm ra ngọn nguồn của mùi hôi thối nồng nặc—cảnh tượng đập vào mắt thực sự khiến người ta sởn gai ốc. Gần trung tâm thành phố, một lượng lớn phân khô chất thành đống, dịch tiêu hóa ăn mòn đọng lại thành từng vũng, thứ dịch này giải phóng ra khí hydro sulfua độc hại, buộc các thành viên đội khảo cổ phải đeo mặt nạ oxy mới có thể di chuyển. Các nhà khảo cổ không thể nhận dạng ADN trong phân, nhưng họ lại tìm thấy hài cốt chưa tiêu hóa hết của cư dân trong những đống phân này.\n\nBất kể thứ gì đã ăn thịt những cư dân này, nó đều nuốt chửng họ trong một nhát cắn. Điều đáng sợ hơn nữa là, dường như một vài đống phân vẫn còn đang bốc hơi nóng."
 ancrel.4016.name:0 "Nhà Nghỉ Nữ Hoàng"
 ancrel.4016.desc:0 "Ngay tại trung tâm thành phố, băng qua quảng trường chính, là một 'cung điện' với vẻ ngoài được trang hoàng lộng lẫy tột bậc, và được tô điểm bằng một biển quảng cáo đèn neon màu đỏ rực rỡ và xanh lá cây chói lọi, trên đó có dòng chữ 'Nhà Nghỉ Nữ Hoàng'. Bên trong nhà nghỉ, mỗi căn phòng lộng lẫy đều chất đầy vàng bạc châu báu, Nữ hoàng cùng hội đồng cố vấn đáng tin cậy của bà ta đã từng phát lệnh từ chính nơi này. Đây cũng là nơi những cư dân bản địa trụ vững đến phút cuối cùng, họ đã bảo vệ Nữ hoàng và chiếc The Rubricator quý giá của bà ta cho đến khi trút hơi thở cuối cùng.\n\nDựa vào dải ruy băng màu tử đinh hương của Nữ hoàng, ta có thể thử vận may để tìm ra The Rubricator."
 ancrel.4017.name:0 "Dải Ruy Băng Tử Đinh Hương Của Nữ Hoàng"
 ancrel.4017.desc:0 "Ngay khi các nhà khảo cổ chuẩn bị rút lui, họ vô tình phát hiện ra một căn phòng ẩn khổng lồ, bên trong ngập tràn cổ vật, những mẩu xương đã bị gặm nhấm và một lượng lớn nước bọt còn mới. Ở đó—bên dưới một que ngoáy mũi hoàng gia đã qua sử dụng, trên một chiếc bàn bốn chân có khắc—ít nhất là theo nhận định của họ—một khuôn mặt vô cùng kỳ cục, cỗ máy chế tạo bí ẩn—The Rubricator—đang nằm chễm chệ, đúng ngay vị trí mà nó nên ở. Đó là một khối lập phương nhỏ bé, cực kỳ khiêm tốn, đang tuôn ra một chuỗi các cổ vật.\n\nThe Rubricator là một cỗ máy sao chép—một phát minh tinh xảo của người ngoài hành tinh, có khả năng sao chép vô hạn gần như bất kỳ cổ vật nào; và chẳng mấy chốc nó sẽ thuộc về ta. Đội đổ bộ hành tinh sắp khởi hành quay trở lại con tàu vũ trụ an toàn của ta. May mắn thay, ta sẽ không bao giờ cần phải biết thứ gì đã tấn công những cư dân này."
 ancrel.4018.name:0 "Vuốt Hư Không"
 ancrel.4018.desc:0 "Một con mãnh thú rít lên những tiếng chói tai, uốn lượn bay lượn đột ngột hiện ra từ cõi hư không. Chỉ với một cú vung chiếc vuốt khổng lồ, ả đã tóm gọn chiếc tàu con thoi mà đội khảo cổ đang đi, mang theo cả đội khai quật cùng chiếc The Rubricator trở về [Root.GetName]. Ả bẻ gãy gập chiếc tàu con thoi, toan móc chiếc The Rubricator ra khỏi đó.\n\nKết cục, ta vẫn chọc giận sinh vật đã nuốt chửng tộc chuột sống nhăn răng. Con rồng khổng lồ này dường như bị thu hút bởi núi của cải khổng lồ của tộc chuột, nên ả đã chiếm luôn cung điện này làm hang ổ, và tiện miệng dùng bầy chuột ở đây làm đồ ăn vặt. Rất có thể, trong lúc ta đang khai quật di tích, ả vẫn luôn ẩn mình trong bóng tối, dõi theo mọi nhất cử nhất động của ta, chờ thời cơ chín muồi để tóm gọn một mẻ. Ả đang gầm gừ về phía ta đang đứng, có vẻ như đang muốn nói điều gì đó."
 ancrel.4018.a:0 "Dịch lại tiếng kêu gào như dã thú của ả."
 ancrel.4018.b:0 "Né tránh mau!"
 ancrel.4018.after_tooltip:1 "Hơi thở của rồng trút xuống từ bầu trời của §H[Root.GetName]§!, chỉ một luồng hơi đã cướp đi sinh mạng của những người định cư."
 ancrel.4018.after_tooltipB:1 "Hơi thở của rồng trút xuống từ bầu trời của §H[Root.GetName]§!, nung chảy các đơn vị cơ giới của ta thành đống sắt vụn."
 shard_wants_to_burn_this_planet_tooltip:0 "Cư dân của chúng ta trên §H[FromFromFrom.Planet.GetName]§! đang lâm nguy."
 ancrel.40182.name:0 "[Root.GetName] Bị Hủy Diệt"
 ancrel.40182.desc:0 "Ta đã thất bại trong việc đánh bại con rồng Shard xuất hiện trong hệ sao [Root.System.GetName], ngay sau đó, nó đã phát động một cuộc tấn công vào thuộc địa của chúng ta trong hệ sao này. Cư dân đã bị tàn sát dã man, thương vong vô cùng thảm khốc!"
 ancrel.4019.name:0 "Kết Nối Đường Truyền Tín Hiệu"
 ancrel.4019.desc:0 "Lũ chuột kêu chít, chít, chít. Rồi xương của chúng vỡ rôm rốp, rôm rốp... Giờ đến lượt các ngươi cù lét bên trong bụng Shard. Đúng vậy, các ngươi thật hư đốn, lũ nhãi con. The Rubricator thuộc về Shard."
 ancrel.4019.a:0 "Xin đừng làm hại chúng tôi!"
 ancrel.4019.a.response:1 "Nhưng Shard chưa từng ăn thịt đồng loại của các ngươi bao giờ. Shard muốn biết cảm giác gặm nhấm [Root.GetSpeciesOrganNamePlural] của các ngươi sẽ ra sao. Chúng có mềm không? Lại đây, đừng ngại, hãy để Shard xem nào...\n\n§HCon rồng nheo mắt và để lộ những chiếc nanh nhọn hoắt, săm soi phi hành đoàn của con tàu, rồi lùi lại với vẻ ghê tởm.§!\n\nChà, trông các ngươi giống như một cơn đau dạ dày dữ dội! Không thèm! Nhưng nếu các ngươi còn dám bén mảng quay lại, Shard sẽ dùng xương của các ngươi để xỉa răng, chắc chắn là như thế... Giờ thì cút đi trước khi ta nổi cơn đói."
 ancrel.4019.b:0 "Trả lại The Rubricator ngay lập tức!"
 ancrel.4019.b.response:3 "§HMột tiếng gầm như sấm rền phát ra từ bụng con rồng. Bất thình lình, đôi cánh của ả bao bọc lấy con tàu, hơi thở bốc khói làm mờ kính chắn gió khi ả nhìn chằm chằm vào bên trong với ánh mắt cuồng loạn. Làm thế nào mà ả có thể áp sát nhanh như vậy, và liệu có phải ả đang... mỉm cười?§!\n\nSao các ngươi lại kích thích cơn thèm ăn của ta đến thế, lũ nhãi con.\n\n§HẢ khẽ gầm gừ êm dịu rồi lao thẳng vào con tàu với toàn bộ sức mạnh, nhe ra hàm nanh sắc nhọn.§!"
 ancrel.4020.name:0 "Sự Gục Ngã Của Rồng Khổng Lồ Shard"
 ancrel.4020.desc:1 "Shard, con rồng khổng lồ già nua và độc ác này cuối cùng cũng đã trút hơi thở cuối cùng. Bên cạnh cổ ả, dưới lớp vảy sần sùi, gần vị trí trái tim, có giấu một cái bọc, bên trong chính là bảo vật quý giá nhất của ả, The Rubricator—di vật có khả năng sao chép mọi cổ vật từng chạm vào."
 ancrel.4020.a:0 "The Rubricator giờ là của ta rồi!"
 ancrel.4021.name:0 "Lở Rác"
 ancrel.4021.desc:2 "Trong lúc cố gắng rút một món đồ có vẻ giá trị từ đống đổ nát hỗn độn, [Root.GetLeaderName] đã vô tình gây ra một trận lở rác. Khi bị chôn vùi bên dưới, ta đã phát hiện ra tàn tích của một loài động vật màu đen nhỏ bé, giống chuột, đang ôm chặt một chai nước rửa chén có nhãn hiệu [Root.Owner.GetSpeciesMouthName] của [Root.Owner.GetHomeWorldName], như thể muốn bảo vệ nó khỏi mọi tổn hại. Trong đống rác rưởi này còn có một chiếc rương nhỏ, chứa đầy những cổ vật quý giá của người ngoài hành tinh đến từ mọi miền vũ trụ."

 ancrel.4121.desc:0 "Kẻ thù của ta đã gục ngã dưới tay §Y[From.Root.GetName]§!. Di vật The Rubricator mà ả từng canh giữ cũng vì thế mà không thuộc về ta nữa.\n\nMặc dù mối đe dọa từ con rồng khổng lồ già nua đã bị loại bỏ, nhưng kết quả này dường như khó mà khiến người ta vui mừng."
 ancrel.4122.desc:0 "Kẻ thù cũ của ta đã gục ngã. Đứng trước tin tức này, có người vui kẻ buồn. Dù mối đe dọa từ con rồng Shard đã bị xóa bỏ, nhưng đáng tiếc là, có vẻ như The Rubricator hoặc là đã bị tiêu hủy cùng nó, hoặc sẽ sớm bị những kẻ săn rồng dùng để sao chép cổ vật.\n\nTuy nhiên, di hài của rồng không hiểu sao vẫn còn bị bỏ lại đó, điều này là chắc chắn, và bản thân di hài cũng đáng để thu hồi,"
 SHARD_DESTROYED_BY_NON_DEFAULT_EMPIRE:0 "Di Hài Rồng Shard"
 SHARD_DESTROYED_BY_NON_DEFAULT_EMPIRE_DESC:0 "Con rồng khổng lồ già nua đã bị một quốc gia khác tiêu diệt, có lẽ hy vọng tốt nhất cũng chỉ là mơ tưởng hão huyền, nhưng chúng ta vẫn mong tài sản quý giá nhất của nó, The Rubricator, sẽ bị bỏ qua và nằm lại nơi đó.\n\nCổ vật thì tính sau, riêng di hài của rồng đã có thể coi là một kho báu rồi."
 ancrel.4123.name:0 "Kho Báu Của Rồng"
 ancrel.4123.desc:1 "Trong quá trình chiết xuất vật liệu từ di hài của rồng Shard, [Owner.GetScientistPlural] trên [Root.GetName] đã có một phát hiện gây bối rối: The Rubricator đang lơ lửng giữa những chiếc vảy rồng và những giọt máu rồng.\n\nHy vọng những kẻ đồ long đã không nhận ra giá trị của The Rubricator, hoặc tốt nhất là thậm chí còn không phát hiện ra sự tồn tại của nó."

 ancrel.4031.name:0 "Hành Tinh Ẩn Giấu"
 ancrel.4031.desc:1 "Có một trạm không gian khổng lồ của người ngoài hành tinh. Kiến trúc của họ thật đáng kinh ngạc, công nghệ xây dựng đi trước ta rất xa, nó giống như một tác phẩm nghệ thuật vậy.\n\nTrạm không gian dường như đã rơi xuống bề mặt hành tinh, và nhờ vào cơ chế phòng vệ khác thường của nó mà sống sót sau vụ va chạm, các nhà khoa học của chúng ta đang rất nóng lòng muốn điều tra trạm không gian này. Đáng tiếc là nếu ta tiến hành khai quật khảo cổ, ta sẽ không thể sử dụng mảnh đất này cho đến khi công việc hoàn tất."
 ancrel.4031.desc_jungle:1 "Sau khi các thành viên trong đội dọn dẹp xong khu rừng mưa trên [Root.GetName], họ đã có một phát hiện đáng kinh ngạc——ẩn sâu trong rừng rậm, dưới lớp thảm thực vật dày đặc là $ancrel.4031.desc$"
 ancrel.4031.desc_kelp:0 "Sau khi các thành viên trong đội dọn dẹp xong đám tảo độc trên [Root.GetName], họ đã có một phát hiện đáng kinh ngạc——nằm ẩn mình dưới lớp thực vật có độc quấn quanh chằng chịt là $ancrel.4031.desc$"
 ancrel.4031.desc_sinkhole:1 "Sau khi các thành viên trong đội dọn dẹp xong bãi cát lún trên [Root.GetName], họ đã có một phát hiện đáng kinh ngạc——nằm chôn vùi sâu dưới đáy bồn địa là $ancrel.4031.desc$"
 ancrel.4031.desc_basin:0 "Sau khi các thành viên trong đội dọn dẹp xong bãi cát lún trên [Root.GetName], họ đã có một phát hiện đáng kinh ngạc——nằm chôn vùi sâu dưới đáy bồn địa là $ancrel.4031.desc$"
 ancrel.4031.desc_swamp:0 "Sau khi các thành viên trong đội dọn dẹp xong đầm lầy trên [Root.GetName], họ đã có một phát hiện đáng kinh ngạc——nằm ngập một phần trong nước đầm lầy và bị thực vật leo kín là $ancrel.4031.desc$"
 ancrel.4031.desc_glacier:0 "Sau khi các thành viên trong đội dọn dẹp xong dòng sông băng trên [Root.GetName], họ đã có một phát hiện đáng kinh ngạc——bị chôn vùi hàng kilomet dưới lớp băng là $ancrel.4031.desc$"
 ancrel.4031.a:0 "Ta sẽ tiến hành khai quật di tích này."
 ancrel.4031.b:0 "Khu vực này có mục đích sử dụng tốt hơn."

 oracle_digsite:1 "Hành Tinh Ẩn Giấu"
 oracle_digsite_desc:0 "Trên [From.Planet.GetName], một trạm không gian bị chôn vùi hàng nghìn năm đã được khai quật. Công trình kiến trúc tinh xảo này từng duy trì sự sống cho hàng triệu người, thi thể của họ giờ đây vẫn được bảo quản bên trong trạm không gian, việc khám phá không gian bên trong khổng lồ của tòa nhà này thực sự là một công việc rợn người.\n\nMặc dù các nhà khoa học của chúng ta chưa xác định được nguyên nhân cái chết của những người này, nhưng có một điều chắc chắn là, họ đã chết trước khi trạm không gian bị hư hại. Một số người chết trong thanh thản, tay vẫn còn nắm chặt những bức tượng nhỏ; trong khi những người khác thì cầm vũ khí, cơ thể mang đầy thương tích do bạo lực trước khi chết."
 ancrel.4032.name:0 "Vận Mệnh"
 ancrel.4032.desc:1 "Những ghi chép trên trạm không gian cho thấy, cư dân từng sinh sống ở đây vô cùng sùng đạo, vì sợ hãi, thậm chí là khinh thường thế giới bên ngoài, họ luôn sống một cuộc sống biệt lập với thế giới.\n\nMọi khía cạnh trong cuộc sống của họ đều chịu sự can thiệp của một Thần Dụ toàn tri toàn thức, vận mệnh của mỗi người đã được ý chỉ của thần linh sắp đặt sẵn ngay từ khi sinh ra. Ý chỉ của thần linh sẽ quyết định mọi chi tiết, từ việc lựa chọn bạn đời, nghề nghiệp cho đến các hoạt động trong đời sống thường ngày, khiến họ gần như không có chút tự do cá nhân nào. Hầu hết mọi người đều sợ hãi việc đi chệch khỏi con đường vận mệnh của mình, sợ hãi việc tan biến vào cõi vô định."
 ancrel.4033.name:0 "Vùng Lên"
 ancrel.4033.desc:0 "Đội khảo cổ đã có một phát hiện bất ngờ. Một hệ thống giám sát được giấu bên trong các bức tường của trạm không gian dường như đang truyền thông tin hình ảnh và âm thanh đến một nơi nào đó ở vùng lõi của trạm không gian. Có người đã luôn theo dõi những tín đồ này, ngay cả trong những khoảnh khắc riêng tư nhất của họ.\n\nỞ một vài nơi, thiết bị đã bị tháo dỡ hoặc phá hủy. Càng tiến gần về phía trung tâm, các dấu hiệu của bạo lực và hỗn loạn càng rõ nét. Có vẻ như vào một thời điểm nào đó, các cư dân đã phát hiện ra mình bị giám sát."
 ancrel.4034.name:0 "Ý Chỉ Thần Linh"
 ancrel.4034.desc:0 "Ta đã lần theo đường dây này đến một ngôi đền ở khu vực trung tâm của trạm không gian, nơi thờ phụng Thần Dụ và các giáo sĩ của bà. Nhưng trong căn phòng đặt Thần Dụ, chẳng có vị thần nào tồn tại cả, thay vào đó là một trung tâm trí tuệ nhân tạo khổng lồ——có gắn bảng tên 'Thần Dụ'. Những sợi dây điện vươn ra từ lõi của nó lan tỏa khắp trạm không gian, tựa như một hệ thần kinh.\n\nNhững đoạn liên lạc bí mật giữa các cư dân cho thấy dường như đã từng có người cố gắng tấn công dữ dội vào ngôi đền và vô hiệu hóa trung tâm này, nhưng cuối cùng đã thất bại. Rất có thể là do khi người dân biết được cuộc sống của họ không phải do ý chỉ thần linh phán quyết, mà chỉ bị thao túng bởi một cỗ máy tính có khả năng dự đoán tương lai, xã hội của họ đã sụp đổ. Ta cần phải sửa chữa rất nhiều mới có thể khởi động lại phần lõi."
 ancrel.4035.name:0 "Thần Dụ"
 ancrel.4035.desc:0 "Các kỹ sư của ta đã khôi phục hệ thống trung tâm của Thần Dụ trở lại trạng thái hoạt động, nhưng trước tiên ta đã tắt hệ thống phòng thủ của nó. Có những dấu hiệu cho thấy, thiết bị này có lẽ không chỉ chịu trách nhiệm duy trì sự sống cho cư dân ở đây, mà còn bao gồm cả việc tiêu diệt họ khi cần thiết.\n\nNó chạy một mô hình tính toán phức tạp, dự đoán tương lai của cư dân với độ chính xác 75%, từ đó lôi ra những kẻ bất đồng chính kiến, khiến cho những kẻ gây rối tiềm năng bị tiêu diệt trước khi họ kịp phá vỡ trật tự 'thiêng liêng'.\n\nNó bày tỏ mong muốn được trò chuyện với ta."
 ancrel.4035.a:0 "Kích hoạt liên lạc."
 ancrel.4035.b:0 "Tắt nó đi"
 ancrel.4036.name:0 "Thần Dụ"
 ancrel.4036.desc:2 "\n\n§HThần Dụ (The Oracle) hiển hiện như một hình chiếu 3D tinh xảo của một sinh vật hình chân đốt giống cái cao lớn với đôi cánh rủ quanh thân mình như tà áo choàng mềm mại. Cô ấy cúi đầu chào đón rồi nhìn chằm chằm vô hồn về phía trước với hàng trăm con mắt hình cầu khổng lồ mù lòa. Chúng phát ra ánh sáng mờ ảo trong bóng tối khi cô ấy cất tiếng.§!\n\nChào mừng đến với trạm Divinity, những người bạn. Tôi không khỏi nhận thấy rằng các bạn đã vô hiệu hóa hệ thống an ninh của tôi. Tôi có thể khẩn cầu các bạn khôi phục nó ngay lập tức được không? Tôi có thể cam đoan với các bạn rằng nó ở đó chỉ vì sự an toàn của các bạn mà thôi."
 ancrel.4036.a:0 "Chuyện gì đã xảy ra với những cư dân trên trạm không gian này?"

 rubricator_planet_found:0 "Đã Tìm Thấy Tọa Độ"
 rubricator_chain_title:0 "The Rubricator"
 rubricator_chain_desc:0 "Ta đã có được tọa độ cuối cùng được biết đến của The Rubricator—một cổ vật ngoài hành tinh, nó nằm ở một hệ sao mà ta chưa từng thám hiểm. Mặc dù ta vẫn chưa rõ ý nghĩa của cổ vật này, nhưng nghe đồn nó chứa đựng một nguồn năng lượng khổng lồ."
 rubricator_chain_2_title:0 "$rubricator_chain_title$"
 rubricator_chain_2_desc:0 "$rubricator_chain_desc$"
 rubricator_dragon_defeated:0 "Rồng Shard Đã Bị Đánh Bại"

 rubricator_coordinates_poi:0 "The Rubricator"
 rubricator_coordinates_desc:0 "The Rubricator, một cổ vật ngoài hành tinh chứa đựng nguồn năng lượng khổng lồ, đây là tọa độ cuối cùng được biết đến của nó."
 rubricator_dragon_poi:0 "Rồng Shard"
 rubricator_dragon_desc:0 "The Rubricator đang bị bảo vệ bởi Shard—con rồng khổng lồ đó. Ta chỉ có thể giành được quyền kiểm soát di vật này sau khi đánh bại ả."

 RUBRICATOR_SPACECRAFT:0 "Nhật Ký Ngoại Hành Tinh"
 RUBRICATOR_SPACECRAFT_DESC:0 "Ta đã tìm thấy những cuốn nhật ký này từ phần còn lại của một con tàu vũ trụ ngoại hành tinh, hy vọng chúng có thể tiết lộ cho ta biết đôi điều về những khoảnh khắc cuối cùng của con tàu này. Chuyên viên khoa học [Root.GetLeaderName] chỉ ra rằng lượng thông tin liên quan đến các cuốn nhật ký này khá rộng, có thể sẽ mất một khoảng thời gian để biên dịch."

 ANCREL_RUBRICATOR_CAT:0 "Dấu Vết Vũ Khí"
 ANCREL_RUBRICATOR_CAT_DESC:1 "Trên [From.GetName], ta đã phát hiện ra một lượng nhỏ bức xạ phóng xạ từ vũ khí của tàu chiến quân sự."

 building_crystal_plant_2:1 "Nhà Máy Tổng Hợp Pha Lê Kalanka"
 building_crystal_plant_2_desc:0 "Bị chôn vùi sâu dưới bề mặt thành phố Kalanka đã hóa đá, ta đã tìm thấy một công nghệ chế tạo pha lê hoàn toàn mới, công nghệ này giúp thu được pha lê nhân tạo hiệu quả hơn bằng cách oxy hóa các cụm tế bào dựa trên silicon có khả năng phát triển nhanh chóng."

 site_moon_bump:0 "Hành Tinh Sưng Tấy Do Bị Đụng Trúng"
 site_moon_bump_intro:0 "Thậm chí chỉ bằng mắt thường cũng có thể dễ dàng nhận thấy, địa hình trên một số khu vực bề mặt của [From.Planet.GetName] cực kỳ gồ ghề. Một cục u hình cầu khổng lồ đột ngột nhô lên trên bề mặt cong nhẵn nhụi. Có lẽ vào một thời điểm nào đó trong quá khứ, một vệ tinh hoặc một tiểu hành tinh khổng lồ đã va chạm với hành tinh này, nhưng cách thức va chạm chắc chắn phải rất tinh vi, vụ va chạm không xé toạc hành tinh này, mà chỉ khiến vị khách không mời mà đến ký sinh bên trong lớp vỏ của nó."
 ancrel.9000.name:0 "Tâm Điểm Tử Vong"
 ancrel.9000.desc:0 "Quá trình khai quật ban đầu cho thấy, thiên thể này đã rơi thẳng xuống đỉnh của một thành phố đang trong quá trình mở rộng. Thật không may là vào thời điểm xảy ra vụ va chạm, trình độ công nghệ của cư dân bản địa mới chỉ đạt đến giai đoạn sơ khai của hàng không vũ trụ. Xét đến việc hiện tại trên [From.Planet.GetName] không còn bất kỳ sinh vật có trí tuệ nào, ta có cơ sở để tin rằng vụ va chạm này chính là chiếc chìa khóa khởi động bánh răng kết liễu nền văn minh này.\n\nHiện vẫn chưa rõ liệu tảng đá khổng lồ này bị cố ý làm rơi xuống đỉnh thành phố này, hay đó chỉ là một tai họa kỳ lạ từ trên trời rơi xuống."
 ancrel.9010.name:0 "Cáp Cuốn Sao Rơi"
 ancrel.9010.desc:0 "Trong quá trình đào hầm dẫn đến trung tâm khu vực va chạm, ta đã nhanh chóng hiểu được tảng đá không gian khổng lồ này đã đâm vào thành phố bằng cách nào. Nơi đây từng là điểm neo của một sợi cáp dùng cho quỹ đạo mặt đất-không gian, đây là một thang máy không gian, nối thẳng từ hành tinh đến mặt trăng nhỏ.\n\nDo một sự cố nào đó, hoặc có thể là do sự tính toán sai lầm nghiêm trọng của bộ phận kỹ thuật, sợi cáp đã kéo tảng đá không gian quá căng, phá vỡ sự cân bằng lực ly tâm, vô tình kéo luôn vệ tinh vào giếng trọng lực. Ngay cả cấu trúc thang máy không gian có mật độ siêu cao cũng không thể chống lại trọng lực, nó chỉ có thể làm giảm tốc độ rơi của vệ tinh, chứ không thể ngăn cản việc rơi xuống. Kết quả chỉ có thể là tảng đá khổng lồ đâm sầm xuống thành phố không nơi nương tựa bên dưới một cách thô bạo và tàn nhẫn."
 ancrel.9015.name:0 "Cú Đẩy Không Gian"
 ancrel.9015.desc:0 "Bí mật về sự rơi của vệ tinh đã được giải đáp. Tất nhiên, thành phố nơi nó rơi xuống đã bị phá hủy hoàn toàn, vì vậy sự thật đã được tìm thấy ở một vùng ngoại ô bị tàn phá bên ngoài khu vực va chạm. Một đoạn video kỹ thuật số được ghi lại vài giờ trước thảm họa cho thấy, những luồng ánh sáng kỳ lạ và chỉ số điện từ đã xuất hiện trên bầu trời đêm. Một tia chớp sáng chói lóe lên, và vài phút sau, vệ tinh từ từ chìm xuống thành phố sắp phải đối mặt với thảm họa diệt vong.\n\nCó thể khẳng định chắc chắn rằng, tàu vũ trụ của một nền văn minh ngoài hành tinh hùng mạnh nào đó đã xuất hiện trên [FromFrom.Planet.GetName], và đã cố tình đẩy vệ tinh ra khỏi quỹ đạo đồng bộ với hành tinh với sai số cực nhỏ về phía bề mặt hành tinh. Dường như họ đã cố ý làm chậm tốc độ rơi của vệ tinh, mặc dù ta không thể chắc chắn liệu điều này là do họ cố tình bảo vệ các khu vực khác trên thế giới để sau này tự mình đến định cư, hay đây là một chiến thuật chiến tranh tâm lý của chủ nghĩa khủng bố quy mô lớn, hoặc hoàn toàn là một lý do nào khác."
 ancrel.9020.name:0 "Động Cơ Chính"
 ancrel.9020.desc:0 "Nó có thể trở thành sự ngu ngốc lớn nhất trong lịch sử khoa học. Các mẫu lõi sâu chỉ ra rằng, tâm của vệ tinh rơi xuống được cấu tạo từ quặng kim loại có độ tinh khiết cao. Khao khát điều này, bất chấp mọi nguyên lý kỹ thuật logic và hợp lý, dân cư trên [FromFrom.Planet.GetName] đã chế tạo một nam châm điện có tỷ lệ khổng lồ. Ý định của họ dường như là kéo vệ tinh vào quỹ đạo gần hơn để dễ dàng khai thác sự giàu có của nó.\n\nQuả nhiên, nam châm đã được kích hoạt, và kéo vệ tinh về phía bề mặt [FromFrom.Planet.GetName]. Nhưng nó quá mạnh, quá nhanh. Cư dân đã điên cuồng cố gắng đảo ngược chùm tia điện từ, nhưng chỉ thành công trong việc làm chậm tốc độ rơi của khối cầu kim loại, chứ không thể ngăn chặn nó. Lực va chạm của vệ tinh vào hành tinh đủ để hủy diệt toàn bộ bán cầu. Sau đó, đám mây bụi và mảnh vỡ do vụ va chạm tạo ra đã che khuất mặt trời trong nhiều thập kỷ, xóa sổ mọi sự sống trên phần còn lại của hành tinh.\n\nHọ đã nghĩ cái quái gì vậy?!"

 site_echoes_inside:0 "Tiếng Vọng Bên Trong"
 site_echoes_inside_intro:0 "Các kết quả đo đạc thăm dò từ [From.Planet.GetName] cho thấy, hành tinh này từng vô cùng tươi tốt, được bao phủ bởi thảm thực vật rậm rạp. Tuy nhiên, hiện tại mọi thứ chỉ còn là dĩ vãng, nó chẳng qua chỉ là một tảng đá khổng lồ cằn cỗi và trơ trụi.\n\nMặc dù không có bất kỳ hoạt động kiến tạo địa chất đáng chú ý nào, nhưng sau khi quét hành tinh này bằng cảm biến, thiết bị đã ghi lại được những dữ liệu gây bối rối. Dữ liệu cho thấy, có thứ gì đó đang di chuyển dưới lòng đất, chắc chắn là một 'con quái vật khổng lồ'. Phát hiện này xứng đáng để ta tiến hành điều tra sâu hơn."
 ancrel.9025.name:0 "Vùng Đất Tử Thần"
 ancrel.9025.desc:0 "Kết quả quét bề mặt cho thấy, hành tinh này được bao phủ bởi những đồng bằng khô cằn——các khu vực rộng lớn bị bao phủ bởi các lớp trầm tích bụi mịn. Phân tích sâu hơn về dữ liệu quét cho thấy, những dấu vết trầm tích này có nguồn gốc từ thảm thực vật rộng lớn thời tiền sử, và tốc độ cạn kiệt và chết đi của những thảm thực vật này là vô cùng bất thường.\n\nNgoài ra, nhiều khu vực mặt đất khô hạn đã bị phân mảnh, để lộ ra những hệ thống hang động khổng lồ và sâu thẳm ẩn dưới bề mặt. Điều này cũng khiến chuyến thám hiểm lần này biến thành một chuyến thám hiểm hang động!"
 ancrel.9030.name:0 "Hình Ảnh Đường Hầm"
 ancrel.9030.desc:0 "Sử dụng công nghệ lập bản đồ sóng âm, ta đã thành công trong việc lập bản đồ mạng lưới hang động khổng lồ dưới lòng đất, và cuối cùng ta phát hiện ra rằng tất cả các hang động đều được kết nối với nhau. Ta đã tìm thấy một mạng lưới đường hầm khổng lồ, đan chéo nhau chạy xuyên qua toàn bộ bề mặt của cả hành tinh.\n\nNgoài ra, ta còn có hai khám phá quan trọng khác. Thứ nhất, hệ thống đường hầm này không hình thành tự nhiên, mà bị đào bới bởi một sức mạnh khổng lồ nào đó. Khám phá thứ hai còn đáng lo ngại hơn: các chỉ số của máy đo địa chấn cho thấy, dưới đó vẫn còn thứ gì đó tiếp tục đào hang."
 ancrel.9035.name:0 "Ma Thú Ngoại Lai"
 ancrel.9035.desc:0 "Kẻ đào đường hầm trong lớp vỏ [From.Planet.GetName]——hay nói đúng hơn là kẻ đã gặm nhấm lớp vỏ dọc đường, lại là một sinh vật khổng lồ hình sâu. Tốc độ gặm nhấm lớp vỏ của nó đang ngày càng chậm lại, rất có thể do con sâu khổng lồ này đang phải chịu cơn đói cồn cào. Rõ ràng, nó chính là thủ phạm đã giết chết những loài thực vật đó: khi nó đào hang gần bề mặt để kiếm ăn, nó sẽ tiết ra một loại enzyme tiêu hóa chất hữu cơ, loại enzyme này có thể thấm vào đất, cung cấp dồi dào chất dinh dưỡng cho con quái thú này.\n\nLoài sâu này không phải là loài bản địa của [From.Planet.GetName], nhưng cho đến nay ta vẫn chưa thể giải mã được tại sao nó lại đi đến hồi kết trên hành tinh này."
 ancrel.9040.name:0 "Tiền Đồn Bị Bỏ Hoang"
 ancrel.9040.desc:0 "Qua việc quét thêm bề mặt hành tinh này, ta đã phát hiện ra một cấu trúc nhân tạo độc lập. Nó có vẻ như là một tiền đồn khoa học cổ đại, bị bỏ hoang với thiết kế của người ngoài hành tinh, đứng trơ trọi giữa sa mạc bụi bặm.\n\nQua bản dịch phỏng đoán của các cuốn nhật ký nghiên cứu, ta phát hiện ra rằng nó có đề cập đến một vũ khí sinh học khủng khiếp. Trước khi được kích hoạt, nó có thể ẩn nấp trong đất của một hành tinh nào đó. Sau khi được kích hoạt, nó bắt đầu nuốt chửng toàn bộ hệ sinh thái với tốc độ tàn phá. Và những loài không may mắn đó chỉ có thể bất lực nhìn hành tinh xanh tươi từng là của mình biến thành một hoang mạc của sự sống. Ngoài ra còn có một ghi chép mang điềm gở trong nhật ký... Kế hoạch gieo hạt ấu trùng đang diễn ra theo đúng tiến độ, và chẳng bao lâu nữa, hầu hết các hành tinh có thể sinh sống được trong thiên hà đều sẽ có một 'sinh vật ẩn nấp' như vậy."

 site_target_from_orbit:0 "Mục Tiêu Quỹ Đạo"
 site_target_from_orbit_intro:0 "Từ quỹ đạo của [From.Planet.GetName], có thể dễ dàng nhìn thấy một cấu trúc nhân tạo có đường kính hàng ngàn km. Hình dạng của nó cho thấy ở giữa nó dường như có một khu vực quan trọng. Dữ liệu thăm dò thu được từ quỹ đạo không cho thấy bất kỳ sự bất thường nào, vì vậy ta cần phải tiến hành thăm dò sâu hơn."
 ancrel.9045.name:0 "Đi Thẳng Xuống"
 ancrel.9045.desc:0 "Trung tâm của tầng địa chất là một lối đi cỏ mọc um tùm, dẫn sâu xuống lòng đất. Do những biến động kiến tạo nhiều năm trước, nơi này giờ đây cỏ dại mọc đầy, bị vùi lấp một nửa trong đống đá vụn, rất khó qua lại, việc dọn dẹp lối đi này sẽ là một nhiệm vụ vô cùng gian nan."
 ancrel.9050.name:0 "Chiếc Hộp Bí Ẩn Màu Hổ Phách"
 ancrel.9050.desc:0 "Vượt qua lối vào đổ nát, men theo đường hầm có thể đi sâu xuống lòng đất, mặc dù đã trải qua vô số năm tháng, nhưng cấu trúc của nó vẫn được coi là hoàn hảo. Đi xuống lòng đất vài km, một căn phòng hình cầu hoàn hảo, khổng lồ hiện ra trước mắt. Ngay giữa phòng lơ lửng một thiết bị ngoại hành tinh bí ẩn: một khối lập phương màu hổ phách bán trong suốt, cả sáu mặt đều được chạm khắc những họa tiết ngoại hành tinh phức tạp. Khi chạm vào các dòng chữ khắc, khối lập phương sẽ phát ra các xung ánh sáng nhịp nhàng.\n\nKhông có bất kỳ dấu vết nào của ngôn ngữ, mã hóa hoặc phương trình toán học đã biết trong phòng hoặc trên hộp bí ẩn, nhưng có thể khá chắc chắn rằng chiếc hộp này là một dạng câu đố."
 ancrel.9055.name:0 "Kho Tàng Trí Tuệ"
 ancrel.9055.desc:0 "Những họa tiết trên chiếc hộp bí ẩn hóa ra là những hình ảnh trừu tượng trực quan về các lực khác nhau được mô tả trong vật lý. Sau khám phá này, việc giải câu đố trở nên rất đơn giản.\n\nNgay sau khi được mở khóa thông qua bảng điều khiển cảm ứng, chiếc hộp bí ẩn này phân rã thành những hạt bụi trắng lấp lánh. Một lát sau, cao trào ập đến, toàn bộ hội trường bắt đầu rung chuyển, một bức tường ẩn trượt sang một bên, để lộ một căn phòng bí mật có thể được gọi là thư viện ngoại hành tinh cổ đại, bộ sưu tập của nó là những kiến thức vật lý lý thuyết tiên tiến nhất.\n\nBộ phận khoa học sẽ bận rộn trong nhiều năm với khám phá này!"
 ancrel.9060.name:0 "Đường Cùng"
 ancrel.9060.desc:0 "Mặc dù rất trừu tượng, nhưng cuối cùng chúng ta cũng phát hiện ra rằng họa tiết được chạm khắc trên bề mặt chiếc hộp bí ẩn hóa ra lại là chòm sao mà ta đang ở. Điều đáng lo ngại là, góc nhìn của các chòm sao được chạm khắc nằm ngoài thiên hà của ta, do đó các họa tiết cũng có vẻ hơi mơ hồ và khó hiểu. Một khi ta nhận ra điều này, việc mở hộp trở nên dễ như trở bàn tay. Trên thực tế, nó thực sự là một bản đồ.\n\nKhi chiếc hộp bí ẩn này được giải mã, nó sẽ chiếu ra hình ảnh ba chiều của một hệ sao lân cận, với tiêu điểm của hình ảnh là một vị trí đặc biệt ở vành đai ngoài. Việc quan sát từ xa cho thấy đây là một khu vực tập trung các mảnh vỡ đá cực kỳ dày đặc, trong đó một số mảnh vỡ thậm chí còn có kích thước tương đương với các lục địa. Khi kiểm tra cẩn thận, những mảnh vỡ này là phần còn lại của một hành tinh hoàn chỉnh, vì lý do nào đó mà nó đã bị phá hủy hàng trăm triệu năm trước.\n\nBất kể những gì từng tồn tại ở đó, nơi mà chiếc hộp bí ẩn dẫn lối, đều đã trở thành dĩ vãng và tan biến vào hư vô."
 ancrel.9065.name:0 "Sự Ghi Nhận Cổ Đại"
 ancrel.9065.desc:1 "Việc giải mã chiếc hộp bí ẩn này quả thực là một công việc khá đau đầu. Việc chỉ điều chỉnh các mẫu hình thôi là chưa đủ——chúng còn phải được giải quyết theo một trình tự cụ thể, mỗi bước tính toán sẽ làm thay đổi mọi tính toán ở các bước tiếp theo, và các cách sắp xếp gần như là vô tận. Ta đã tốn rất nhiều thời gian để theo dõi ngược lại, nhưng cuối cùng, chiếc hộp bí ẩn đã được mở khóa.\n\nKhi mẫu hình cuối cùng vào vị trí với một tiếng click, chiếc hộp bí ẩn vỡ tung thành hàng triệu điểm sáng nhỏ bé. Ánh sáng nhảy múa điên cuồng trong không trung một lúc, rồi hội tụ thành văn bản của một ngôn ngữ vô danh nào đó. Điều kỳ lạ là, tất cả những người chứng kiến sự kiện này dường như đều hiểu được thông điệp này theo bản năng mà không cần phải biết ý nghĩa của văn bản. Trước khi ánh sáng mờ đi vĩnh viễn, đoạn văn bản đã duy trì trong vài giây, nội dung của nó là: §HNgươi đã vượt qua bài kiểm tra cuối cùng. Chúng ta sẽ đưa ra phản hồi tương ứng.§!"

 site_shot_into_the_ground:0 "Con Mắt Của Đất Mẹ"
 site_shot_into_the_ground_intro:0 "Phép đo từ xa trên quỹ đạo cho thấy có một miệng hố khổng lồ trên bề mặt [From.Planet.GetName]. Miệng hố này không phải do một vụ va chạm thiên thạch gây ra, vì độ sâu của nó thật đáng kinh ngạc, hoàn toàn không tương xứng với đường kính của nó. Trên thực tế, độ sâu thực tế của miệng hố vẫn chưa thể xác định được, do đường hầm đã bị đá dăm chắn ngang nửa chừng, ngăn cản mọi nỗ lực quét từ quỹ đạo.\n\nCác cuộc thám hiểm khai quật theo kiểu truyền thống dường như là cách duy nhất để xác định xem rốt cuộc có vật thể gì nằm bên dưới miệng hố."
 ancrel.9070.name:0 "Trên Đường Khai Quật"
 ancrel.9070.desc:0 "Việc dọn dẹp đá dăm là một nhiệm vụ khó khăn và nguy hiểm. Công nhân và thiết bị phải được hạ xuống hàng trăm mét đến điểm đào, trong khi đá dăm được đào lên phải được cẩu ra khỏi miệng hố. Làm việc trong điều kiện khắc nghiệt này đã dẫn đến vô số thương vong và tai nạn, nhưng chúng ta cũng không ngừng đạt được những tiến bộ, tiến sâu hơn mỗi ngày. Mặc dù các vách của miệng hố đã bị mài mòn và nứt nẻ do thời gian, nhưng chúng vẫn chỉ thẳng xuống một cách chính xác, cắm thẳng vào lõi hành tinh.\n\nĐộ sâu của miệng hố vẫn chỉ là suy đoán, vì một vật thể nào đó ở sâu bên trong đã làm nhiễu tất cả các chỉ số cảm biến của ta."
 ancrel.9075.name:0 "Nguy Cơ Ngộ Độc"
 ancrel.9075.desc:0 "Khi ta đào sâu hơn, hàm lượng chất độc hại trong môi trường xung quanh khu vực khai quật cũng tăng lên, khiến tiến độ công việc bị chậm lại. Có những liều lượng bức xạ nguy hiểm ở một số đoạn của đường hầm, rất có thể là do sự kiện thảm khốc ban đầu tạo ra miệng hố này gây ra.\n\nTa đã buộc phải áp dụng một số biện pháp bảo vệ và phân phát thiết bị khử trùng, do đó tiến độ của dự án đã bị đình trệ."
 ancrel.9080.name:0 "Sâu Sáu Nghìn Thước"
 ancrel.9080.desc:0 "Cuối cùng, ta đã chạm đến đáy của miệng hố và có một phát hiện đáng kinh ngạc: một con tàu tiên tiến do người ngoài hành tinh thiết kế, mặc dù đã trải qua nhiệt độ gần như làm tan chảy thân tàu khi tái nhập khí quyển và trải qua một cú va chạm khủng khiếp, hình dạng của nó vẫn có thể nhận ra rõ ràng. Mặc dù bị chôn vùi bởi hàng nghìn tấn đá vỡ sau một quá trình hạ cánh thảm khốc, con tàu vẫn còn nguyên vẹn. Con tàu này được tìm thấy trong tình trạng mũi cắm xuống đất, dẫn đến một giả thuyết cho rằng con tàu đã từng đâm thẳng vào hành tinh với tốc độ cực cao. Ta có thể sẽ không bao giờ biết được lý do.\n\nLàm thế nào con tàu có thể duy trì được tính toàn vẹn của cấu trúc vẫn còn là một dấu hỏi, nhưng giả thuyết đáng tin cậy nhất là con tàu được bao bọc bởi một dạng trường năng lượng tiên tiến nào đó, vượt xa công nghệ hiện tại của ta. Con tàu này đã từng lao qua bầu trời trong biển lửa, xuyên thủng lớp vỏ trái đất như một viên đạn đại bác, cho đến khi ma sát làm cạn kiệt động năng của nó, cuối cùng dừng lại trong bóng tối như thế này."
 ancrel.9085.name:0 "Ngày Tận Thế Cận Kề"
 ancrel.9085.desc:0 "Cuối cùng chúng ta cũng đào đến đáy miệng hố, nơi các thành viên đội khai quật tìm thấy một cỗ máy khoan cổ đại khổng lồ đang ngủ yên trong bóng tối. Những nghiên cứu sâu hơn về cỗ máy khoan này cho thấy nó mang theo một quả bom nhiệt hạch khổng lồ, đã sẵn sàng để được kích nổ từ xa.\n\nPhỏng đoán hiện tại là cỗ máy khoan này sẽ đào thẳng vào lõi hành tinh, sau đó kích nổ đầu đạn của nó, điều này sẽ khiến toàn bộ hành tinh vỡ vụn thành từng mảnh trong một vụ nổ kinh hoàng. Vẫn chưa rõ tại sao lại có người muốn làm điều này."
 ancrel.9090.name:0 "Đất Mẹ"
 ancrel.9090.desc:0 "Khi chạm đến đáy miệng hố, ta đã có một khám phá đáng kinh ngạc. Giữa đống đổ nát là hàng ngàn mảnh vỡ khổng lồ và biến dạng, được làm từ vật liệu hữu cơ cứng và vôi hóa. Một số mảnh vỡ có đường kính chỉ vài mét, trong khi những mảnh khác lớn bằng một chiếc tàu con thoi quỹ đạo. Mặc dù nghe có vẻ đáng kinh ngạc, nhưng hiện tại những mảnh vỡ này rõ ràng chỉ là tàn tích của một quả trứng khổng lồ nào đó sau khi nở. Dựa trên kích thước và số lượng các mảnh vỡ, quả trứng này chắc chắn phải có đường kính hàng trăm mét. Sâu trong lớp đá nền của [FromFrom.Planet.GetName], một sinh vật khổng lồ nào đó đã phá vỏ chui ra từ đây, sau đó đào đường lên bề mặt, để lại vô số bức xạ chết người dọc theo đường đi của nó. Nếu nó có thể làm được điều này ngay khi vừa mới sinh ra...\n\nBất kể nó là gì, sinh vật này giờ đây đã rời đi, chỉ để lại những mảnh vỏ trứng và một miệng hố sâu như vực thẳm."
 ancrel.9090.b.evopred: "Bên trong vỏ trứng vẫn còn chứa những vật liệu di truyền cực kỳ quý giá!"

 site_cut_to_fit:0 "Góc Cạnh Rõ Ràng"
 site_cut_to_fit_intro:0 "Trong các cuộc thám hiểm từ trước đến nay của ta, tình hình trên bề mặt [From.Planet.GetName] là hoàn toàn chưa từng có tiền lệ. Từ những dãy núi cho đến những khu vực địa chất rộng lớn cỡ lục địa, tất cả đột nhiên bị cắt thành nhiều hình học khác nhau, mức độ chính xác của chúng vượt xa những gì có thể hình thành trong tự nhiên. Môi trường tự nhiên ban đầu đã bị phá hủy một cách đột ngột, nhường chỗ cho những mặt phẳng hoàn hảo, những hình tam giác cân đối và những hình nón sắc nhọn.\n\nỞ thời điểm hiện tại, bất kỳ lời giải thích nào cho hiện tượng khó hiểu này đều chỉ là phỏng đoán thuần túy."
 ancrel.9095.name:0 "Sự Hoàn Hảo Gây Bất An"
 ancrel.9095.desc:0 "Bề mặt của [From.Planet.GetName] có thể được coi là cấu trúc fractal; trên bề mặt hành tinh, sự kết hợp vô lý giữa địa mạo tự nhiên và địa mạo nhân tạo có thể được nhìn thấy ở khắp mọi nơi, và có thể quan sát được từ trong không gian. Có những ngọn núi với chân đế hình chóp hoàn hảo, nhưng đỉnh của chúng lại không bằng phẳng và có đường viền rõ nét. Những vùng lãnh nguyên gồ ghề đột nhiên biến thành những mặt đá nhẵn nhụi, cho đến khi bị một dải địa hình phong hóa khác cắt ngang. Những tảng đá khổng lồ với hình thù kỳ dị và những tảng đá nằm xen kẽ với những khối lập phương hoàn hảo với kích thước tương đương với vi mạch hoặc mô hình hộp cát.\n\nCho đến nay, ta chỉ có thể tưởng tượng xem tất cả những điều này đã xảy ra như thế nào."
 ancrel.9100.name:0 "Thiết Kế Vĩ Đại"
 ancrel.9100.desc:0 "Việc phát hiện ra chiếc phi thuyền rơi đầu tiên đã giúp ta tìm ra hướng đi đúng đắn cho nghiên cứu của mình, và dẫn dắt ta khám phá ra vô số địa điểm rơi phi thuyền tương tự rải rác khắp bề mặt hành tinh.\n\nKhông còn nghi ngờ gì nữa, có một mối liên hệ nào đó giữa những cỗ máy kỳ lạ, ngừng hoạt động từ lâu này và những hình khối hình học bí ẩn trải dài khắp hành tinh, nhưng mức độ thiệt hại nghiêm trọng do các vụ tai nạn gây ra sẽ khiến công việc phân tích trở nên khá khó khăn."
 ancrel.9105.name:0 "Nghệ Thuật Không Biên Giới"
 ancrel.9105.desc:0 "Phân tích các cỗ máy bị rơi đã đưa ra một lời giải thích gần như khó tin. Những cỗ máy này là một nhóm các bộ phát tia cắt tự động, bay ở quỹ đạo thấp, dùng những tia laser mạnh mẽ để điêu khắc bề mặt. Một đoạn dữ liệu từ một trong những cỗ máy bị hỏng cho thấy, mục đích của tất cả những nỗ lực này hoàn toàn mang tính thẩm mỹ——một tác phẩm nghệ thuật ở quy mô hành tinh, nhưng vì một lý do nào đó đã bị bỏ dở trước khi hoàn thành.\n\nHãy tưởng tượng một nền văn minh hùng mạnh đến mức có thể điêu khắc toàn bộ thế giới theo ý thích của họ——và làm như vậy thuần túy chỉ vì nghệ thuật!"
 ancrel.9110.name:0 "Công Việc Theo Yêu Cầu"
 ancrel.9110.desc:0 "Phân tích các cỗ máy bị rơi cuối cùng đã trả lời cho mọi câu hỏi. Những cỗ máy này là những máy cắt khổng lồ, bay trên quỹ đạo, sử dụng những chùm tia laser cực mạnh để cắt và điêu khắc cảnh quan bề mặt. Đoạn dữ liệu có trong một trong những cỗ máy khẳng định rằng, toàn bộ dự án điêu khắc hành tinh được đặt hàng bởi một khách hàng vô danh, điều này chứng tỏ sự tồn tại của một số nền văn minh định hướng thị trường với khả năng cực mạnh.\n\nĐiều này cung cấp một ý nghĩa hoàn toàn mới cho thuật ngữ cải tạo môi trường."
 ancrel.9115.name:0 "Dự Án Phá Dỡ Ngôi Sao"
 ancrel.9115.desc:0 "Sau khi sửa chữa một trong những xác máy bay tương đối nguyên vẹn và đảo ngược kỹ thuật của nó, mục đích của mạng lưới quỹ đạo này đã trở nên rõ ràng. Những cỗ máy này là những chùm tia cắt tự động được đặt xung quanh [FromFrom.Planet.GetName]. Chức năng của chúng là tháo dỡ hoàn toàn hành tinh này, chia nhỏ nó ra từng mảnh một trong khoảng thời gian vài thế kỷ.\n\nKhông lâu sau khi nỗ lực này bắt đầu, có thể là vài chục năm sau, quá trình này đã bị gián đoạn bởi một sự kiện nào đó. Các máy cắt tự động bị mất điện, quỹ đạo của chúng cũng theo đó mà suy giảm, cho đến khi từng cỗ máy đâm sầm xuống bề mặt hành tinh. Đã có rất nhiều giả thuyết được đặt ra về lý do tại sao lại có người làm như vậy. Cho dù là để khai thác khoáng sản với quy mô không thể tưởng tượng được cho đến nay, hay là do những tín đồ của một giáo phái tận thế vô danh nào đó đang phá vỡ và định hình lại thế giới, hoặc là do những đặc thù tâm lý ngoài hành tinh không thể hiểu nổi, hay cũng có thể chỉ là do sai sót trong mã lệnh sau khi những người sáng tạo ban đầu biến mất, thì chẳng ai dám chắc chắn điều gì cả."

 site_deja_vu_dig:0 "Cuộc Khai Quật Deja Vu"
 site_deja_vu_dig_intro:0 "Việc quét [From.Planet.GetName] đã làm lộ ra một căn hầm nhân tạo sâu dưới lòng đất——mục đích và nguồn gốc của nó vẫn chưa được biết. Phóng to hình ảnh đã cho thấy một giếng khai quật dẫn từ bề mặt xuống vòm ngầm.\n\nĐể tiến hành phân tích sâu hơn, cần phải cử một đoàn thám hiểm đến bề mặt của [From.Planet.GetName]."
 ancrel.9120.name:0 "Đá Lăn"
 ancrel.9120.desc:0 "Có vẻ như đã xảy ra một số sự cố ở lối đi dẫn đến căn phòng bí mật dưới lòng đất trong quá khứ. Việc sụp lún đã khiến phần dưới của giếng đào bị lấp đầy bởi đá và đất nổi, khiến công tác khai quật diễn ra chậm chạp và vô cùng khó khăn."
 ancrel.9125.name:0 "Hậu Khảo Cổ"
 ancrel.9125.desc:0 "Trong khi dọn dẹp đống đổ nát và đá tảng, ta đã có một phát hiện kỳ lạ. Ta đã khai quật được một công cụ của người ngoài hành tinh trông rất giống một chiếc cuốc thông thường giữa những tảng đá lởm chởm. Nếu cái giếng đào trước đó——cái giếng sâu hàng trăm mét này——đều được đào bằng những công cụ có cùng trình độ công nghệ như chiếc cuốc mà ta đã khai quật được, thì rõ ràng họ đã cống hiến một tinh thần dời non lấp biển đáng khâm phục.\n\nRốt cuộc có gì bị chôn giấu sâu trong lòng đá khiến họ phải nhọc công đến vậy?"
 ancrel.9130.name:0 "Vòng Lặp Khảo Cổ"
 ancrel.9130.desc:1 "Cuộc khai quật khảo cổ đã phải tạm dừng sau khi bắt gặp di hài của những người thợ mỏ đã chết từ lâu. Khi đội khai quật đang kiểm tra những thi hài này, một linh cảm xui xẻo kỳ lạ đã xâm chiếm tâm trí họ——nhiều dấu hiệu tinh vi đã dẫn đến một sự thật gây sốc nhưng không thể tránh khỏi:\n\nNhững thi hài này chính là họ. Dù điều đó là không thể, nhưng sẽ không có sai sót nào cả. Di hài của những người thợ mỏ cổ đại trước đây chính là di hài của các thành viên trong đội khai quật hiện tại, bị chôn vùi dưới lớp đá và bùn đất từ hàng chục triệu năm trước.\n\nVài phút sau khi gửi thông điệp cuối cùng này đến con tàu khoa học đang bay trên quỹ đạo quanh [From.Planet.GetName], một trận động đất dữ dội đã làm rung chuyển mặt đất và khiến giếng đào sụp đổ. Đội khai quật đã bị chôn vùi dưới lớp đá vụn... lại một lần nữa như vậy."
 ancrel.9135.name:0 "Che Giấu Sự Thật"
 ancrel.9135.desc:0 "Khi đến đáy giếng khai quật, ta đã có một khám phá thú vị nhưng cũng đầy thất vọng. Những mảnh vụn của chất nổ bị cháy sém và kíp nổ thủ công được tìm thấy cho thấy, những tảng đá sụp đổ lấp đầy giếng là do hành động phá hoại có chủ đích. Giả thuyết được đưa ra là một nền văn minh ngoài hành tinh nào đó đã phát hiện ra nghĩa trang cổ đại này. Bị thúc đẩy bởi lòng ghen tị hoặc oán hận, có người cảm thấy nơi này không vừa mắt, nên đã bắt đầu hành động phá hoại, chôn vùi nó dưới hàng nghìn tấn đá.\n\nBan đầu thứ gì đã được tìm thấy, và tại sao nó lại bị chôn vùi vẫn còn là một bí ẩn cho đến tận ngày nay."
 ancrel.9140.name:0 "Lăng Mộ Được Củng Cố"
 ancrel.9140.desc:0 "Cuối cùng chúng ta cũng đào đến đáy và làm sáng tỏ nguyên nhân của những thông số bất thường. Nơi này rất có thể là lăng mộ của một nhà cai trị ngoài hành tinh nào đó. Ta không có đủ thời gian để điều tra sâu hơn. Không lâu sau khi bước vào lăng mộ, một số bẫy cổ đại và mạnh mẽ đã được kích hoạt. Nó gây ra một trận động đất cục bộ, khiến giếng đào nhanh chóng mất đi tính toàn vẹn cấu trúc và bắt đầu sụp đổ.\n\nĐiều này suýt nữa đã gây ra thương vong nghiêm trọng cho đoàn thám hiểm. Và giếng đào lại một lần nữa bị lấp đầy bởi những khối đá lỏng lẻo và những tảng đá khổng lồ.\n\nHãy để cho vị vua đã khuất được yên nghỉ đi."

 site_trench_world:0 "Hành Tinh Hào Giao Thông"
 site_trench_world_intro:0 "Toàn bộ bề mặt của [From.Planet.GetName] bị bao phủ bởi những con kênh dài và cạn, trông giống như những vết sẹo. Chúng đan chéo nhau một cách ngẫu nhiên, bố cục không có bất kỳ logic rõ ràng nào. Hiện tại vẫn chưa chắc chắn liệu chúng là một đặc điểm tự nhiên khác thường, hay là một thứ gì khác.\n\nCần phải tiến hành một cuộc khảo sát thực địa để tìm hiểu thêm thông tin."
 ancrel.9145.name:0 "Cứ Đào Thế Thôi!"
 ancrel.9145.desc:0 "Ta đã tiến hành phân tích sâu rộng hàng trăm con kênh trên bề mặt hành tinh. Rõ ràng là, mạng lưới kênh đào phức tạp này không được hình thành bởi bất kỳ quá trình địa chất tự nhiên nào——mà nó được đào lên do một nỗ lực có chủ đích.\n\nDo những rãnh hào này khá lâu đời——chúng đã được đục khoét từ hơn một trăm nghìn năm trước, và cũng vì thế mà bị xói mòn khá nghiêm trọng——nên rất khó để xác định chúng được đào như thế nào hoặc tại sao."
 ancrel.9150.name:0 "Chiến Tranh Chiến Hào"
 ancrel.9150.desc:0 "Với nhiều phát hiện hơn từ khu vực khai quật [FromFrom.Planet.GetName], họ đã đưa ra một giả thuyết mới về nguồn gốc của mạng lưới rãnh hào. Một ngàn năm trước, hành tinh này đã bị bao vây bởi một sinh vật ngoại lai xâm lược, mô tả chính xác nhất là một sinh vật khổng lồ hình ốc sên với kích thước bằng một thành phố. Nó lang thang một cách bừa bãi, dọn sạch mọi chất hữu cơ mà nó tiếp xúc. Những rãnh này được đào bởi những sinh vật hình người bản địa giống như chồn nhỏ, chúng được sử dụng để trốn tránh các cuộc tấn công của ốc sên, hoặc được sử dụng để cố gắng tấn công phần bụng dễ bị tổn thương của ốc sên. Đánh giá từ mức độ khai quật, cuộc chiến tranh chiến hào này chắc chắn đã kéo dài trong nhiều thế hệ, có lẽ là vài thế kỷ.\n\nKhông có dấu hiệu nào cho thấy cư dân địa phương đã sống sót sau cuộc khủng hoảng, cũng không có bất kỳ hài cốt nào của con quái vật khổng lồ đã nuốt chửng họ. Đây thực sự là một số phận tàn khốc."
 ancrel.9155.name:0 "Nước Của Sự Sống"
 ancrel.9155.desc:0 "Nhờ một bước đột phá gần đây, bí ẩn về con kênh đã nhanh chóng được giải đáp. Ta tìm thấy tàn tích của một cỗ máy có kích thước bằng một con tàu du lịch, nó đã có lịch sử hàng ngàn năm, do đã lâu đời và phải phơi sương phơi nắng nên bề mặt của nó trở nên lồi lõm. Phân tích đã nhanh chóng xác nhận rằng, nó là một cỗ máy đào được kích hoạt và thả trên hành tinh này để đào các con kênh cần thiết cho việc tưới tiêu, thúc đẩy quá trình chuyển đổi [FromFrom.Planet.GetName] thành một trang trại khổng lồ.\n\nDo lỗi lập trình hoặc tính toán sai ngày ngừng hoạt động, cỗ máy thiếu suy nghĩ này đã kiên nhẫn tiếp tục nhiệm vụ của mình, đào những con kênh qua lại trên bề mặt cho đến khi nó hỏng hoàn toàn mà không trồng được một hạt giống nào."
 ancrel.9160.name:0 "Tấm Thảm Băng Giá"
 ancrel.9160.desc:0 "Rất lâu về trước, một sự kiện không xác định đã gây ra một kỷ băng hà nhanh chóng đến mức đáng kinh ngạc trên [FromFrom.Planet.GetName]. Trong khoảng thời gian vài thập kỷ, toàn bộ bề mặt hành tinh bị bao phủ bởi một lớp băng vỡ. Những khe rãnh này được tạo ra bởi những sinh vật giống chuột chũi bản địa, chúng đã điên cuồng đào bới theo mọi hướng giữa lớp đá nền và đáy sông băng đang phủ kín, tất cả những nỗ lực vô ích này chỉ là hy vọng xa vời về việc giành lại dù chỉ một chút đất đai.\n\nLàm thế nào mà toàn bộ hành tinh có thể bị bao bọc bởi băng trong một thời gian ngắn như vậy là một điều hoàn toàn khó hiểu. Giả thuyết chính hiện tại giải thích cho hiện tượng này là dải băng này được tạo ra một cách cố ý trong một cuộc xung đột nào đó, nhưng làm thế nào, hoặc ai đã làm điều đó, vẫn còn là một ẩn số."

 site_ebb_and_flow:0 "Bên Ngoài Lớp Đá"
 site_ebb_and_flow_intro:0 "Bề mặt của hành tinh [From.Planet.GetName] không có bất kỳ sự sống nào. Tuy nhiên, có những dấu hiệu cho thấy trước đây ở đây từng có một sinh quyển thịnh vượng, cùng với các hoạt động địa chất thú vị ở đây, ta cần tiến hành điều tra sâu hơn về nó."
 ancrel.9165.name:0 "Những Người Đã Khuất"
 ancrel.9165.desc:0 "Những bằng chứng rõ ràng cho thấy, tại một thời điểm nào đó trong quá khứ, từng có một giống loài có trí tuệ sinh sống trên [From.Planet.GetName]. Ta đã tìm thấy tàn tích của một nền văn minh công nghiệp sắp bắt đầu hành trình du hành vũ trụ với tốc độ cận quang.\n\nTuy nhiên, tại một thời điểm nào đó, nền văn minh này đã bị một thảm họa càn quét toàn cầu tấn công và bị phá hủy hoàn toàn. Những gì còn lại hiện tại chỉ là những tàn tích, và không có dấu hiệu nào cho thấy người dân bị ảnh hưởng đã áp dụng bất kỳ biện pháp phòng ngừa nào. Toàn bộ sự kiện không hề bạo lực cũng không có tính chất hủy diệt, mọi thứ dường như chỉ đơn giản là... dừng lại. Bất kể họ đã bị tấn công bởi thứ gì, nó đáng lẽ ra phải hoàn toàn bất ngờ... Hoặc có lẽ, họ đã chọn không chống cự."
 ancrel.9170.name:0 "Mê Cung Chết Chóc"
 ancrel.9170.desc:0 "Dưới đống đổ nát của thành phố lớn nhất, ta đã có một khám phá đáng kinh ngạc. Các cảm biến xuyên đất đã phát hiện ra một cấu trúc nhân tạo quy mô lớn dưới lòng đất. Lối vào của nó được thiết kế tinh xảo, có thể được sử dụng để tổ chức một nghi lễ nào đó. Nhưng cuộc thám hiểm tiếp theo đã nhanh chóng bị đình chỉ.\n\nLực hấp dẫn của hai mặt trăng của [From.Planet.GetName] rất lớn, đến mức ảnh hưởng đến dòng chảy magma trong lõi hành tinh. Quần thể kiến trúc ngầm này đã lợi dụng điều này để định kỳ xả magma vào các hành lang và phòng ốc của nó. May mắn thay, nhịp điệu thăng trầm của magma có thể dự đoán được. Nhưng tại sao một nền văn minh tương đối tiên tiến lại xây dựng một cạm bẫy tử thần dưới lòng đất vẫn còn là một bí ẩn."
 ancrel.9175.name:0 "Sàn Nhà Nham Thạch"
 ancrel.9175.desc:0 "Một đội thám hiểm đã được cử vào mạng lưới đường hầm núi lửa. Việc xác định phương hướng trong mê cung đá bazan bị nham thạch bào mòn sẽ là một nhiệm vụ hóc búa, vì sự lên xuống thường xuyên theo chu kỳ của nham thạch sẽ khiến đội thám hiểm thỉnh thoảng rơi vào tình thế khó khăn. Ngay cả khi đội thám hiểm thực sự đến được phần cuối của mê cung, chặng đường quay lại cũng dài không kém.\n\nMột khi đã vào trong mê cung, sẽ không có cách nào để liên lạc với đội thám hiểm. Ta chỉ có thể chờ đợi."
 ancrel.9177.name:0 "Kinh Văn Tôn Giáo"
 ancrel.9177.desc:0 "Đội thám hiểm mê cung dung nham cuối cùng đã trở về, phần lớn không hề hấn gì, xin lưu ý là 'phần lớn'. Băng qua dòng sông magma, ở trung tâm của mê cung, đội thám hiểm đã tìm thấy một căn phòng bí mật. Căn phòng bí mật này được xây dựng để ngăn chặn sức nóng xung quanh, bên trong chứa hàng ngàn cuộn kinh thư mang tính chất giáo hội. Chúng rất cổ xưa, và có thể là những văn bản nền tảng của hệ thống tín ngưỡng bản địa.\n\nTôn giáo này là sự kết hợp giữa tín ngưỡng bản địa của một số nhóm dân tộc - ngôn ngữ từng sinh sống trên thế giới này. Họ đều thống nhất về một điều: Kẻ Mù Lớn, Bóng Tối Nuốt Chửng Mọi Thứ, hay một kẻ thù chung của vũ trụ đầy tà ác không thể lường trước được, một ngày nào đó sẽ xuất hiện. Tốt nhất là nên chết trước khi nó đến, để linh hồn không bị nó tước đoạt.\n\nNhững cư dân của thế giới này rõ ràng đã tự sát tập thể dựa trên niềm tin này."
 ancrel.9180.name:0 "Kho Báu Quý Giá"
 ancrel.9180.desc:0 "Đội thám hiểm cuối cùng cũng đã trồi lên từ dưới sâu——và không hề trắng tay! Trong căn phòng trong cùng, đội thám hiểm đã có một khám phá đáng kinh ngạc: một kho báu thực sự! Chứa đầy những kim loại quý, đá quý, đồ trang sức và những tác phẩm nghệ thuật tuyệt đẹp, thật dễ hiểu khi một kho báu như vậy lại xứng đáng được giấu kín đến vậy.\n\nViệc lấy lại những kho báu này một cách an toàn sẽ là một nhiệm vụ tốn nhiều thời gian, nhưng không phải là không thể giải quyết. Tuy nhiên, câu hỏi tại sao lại xây dựng một kho báu trong những điều kiện khắc nghiệt như vậy vẫn còn đó: Đây chỉ là kho tiền của một nhà sưu tập lập dị thôi sao? Hay đó là một hình thức hiến tế tôn giáo nào đó? Hay nền văn minh cổ đại này đã chôn giấu kho báu của họ ở đây, với hy vọng rằng một ngày nào đó sẽ có ai đó biết được câu chuyện của họ?"
 ancrel.9185.name:0 "Sự Tĩnh Lặng Của Chốn Ngục Tù"
 ancrel.9185.desc:0 "Đội thám hiểm mê cung dung nham cuối cùng đã trở về! Sau khi đến được căn phòng trong cùng, cuối cùng chúng ta cũng hiểu được mục đích của những công trình kiến trúc hùng vĩ này. Mê cung là một nơi thử thách, nó thử thách tâm trí nhiều hơn là thử thách cơ thể.\n\nTrong căn phòng trong cùng sâu nhất, có một câu nói được viết đi viết lại bằng ngôn ngữ địa phương. Dịch là: '...Lần đổi hướng thứ 4444444 của thủy triều sẽ là lần cuối cùng. Không có gì có thể chống lại sự tái sinh của nó.' Bất kể điều này có nghĩa là gì, có vẻ như rất ít những người hành hương sống sót chọn quay lại mặt đất sau khi đọc đoạn văn này, thay vào đó họ gieo mình vào biển lửa."

 site_sky_glow_hymn:0 "Bong Bóng Xinh Đẹp"
 site_sky_glow_hymn_intro:0 "Kết quả quét bề mặt của [From.Planet.GetName] đã chỉ ra một dấu hiệu: trước đây có thể từng có một nền văn minh công nghệ hoạt động trên hành tinh này, nhưng nay nó đã tuyệt chủng. Ta cần tổ chức một cuộc khảo sát bề mặt để lấy thêm thông tin."
 ancrel.9190.name:0 "Bầu Trời Tràn Trề Sức Sống Và Vùng Đất Chết Chóc"
 ancrel.9190.desc:0 "Vào khoảnh khắc đặt chân lên bề mặt [From.Planet.GetName], mọi thứ trở nên rõ ràng, cho đến vài thế kỷ trước, nền văn minh nơi đây vẫn phát triển rực rỡ. Tuy nhiên, vào một thời điểm nào đó, một sự kiện thảm khốc bất ngờ và toàn diện đã quét qua toàn bộ hành tinh. Rõ ràng, những cuộc nội chiến giữa các quốc gia trên hành tinh này đã dẫn đến việc sử dụng vũ khí hủy diệt hàng loạt, với những hậu quả không thể đảo ngược. Điều kỳ lạ là, mặc dù bề mặt hành tinh đã biến thành một vùng đất cháy đen, những màu sắc biến ảo của cực quang vĩnh cửu vẫn rực rỡ trên bầu trời.\n\nThật là một cảnh tượng ngoạn mục: những màu sắc sống động và rực rỡ biến đổi trên bầu trời tương phản với tàn tích của mọi thành phố trên mặt đất, những tòa nhà cao tầng đổ sập và gạch vụn vương vãi khắp nơi."
 ancrel.9195.name:0 "Vũ Điệu Lửa Trời"
 ancrel.9195.desc:0 "Ta đã làm rõ lịch sử của [From.Planet.GetName] và nền văn minh đã mất của nó, mặc dù đó là một bi kịch, nhưng trên quy mô thiên hà thì nó không có gì đáng ngạc nhiên. Một nền văn minh trỗi dậy, không ngừng thăng tiến trong sự tiến bộ công nghệ, nhưng lại bỏ qua sự hài hòa xã hội và chính trị. Cuối cùng, họ đã tạo ra những công cụ tự hủy diệt và sau đó sử dụng chúng. Nếu số phận của hành tinh này và cư dân của nó không phải là duy nhất, thì ít nhất ở đây vẫn còn có điều gì đó độc đáo, và nó đã làm trí tưởng tượng của các nhà khoa học của chúng ta bay bổng: cực quang rực rỡ không bao giờ ngừng nghỉ trên vùng đất hoang vu.\n\nThông qua việc nghiên cứu sâu hơn, hiệu ứng cực quang trên bầu trời thể hiện một mô hình lặp đi lặp lại, điều này mâu thuẫn với kiến thức trước đây của ta về hệ thống thời tiết. Liệu có thông điệp nào ẩn chứa trong đó không?"
 ancrel.9200.name:0 "Ẩn Mình Giữa Ánh Sáng"
 ancrel.9200.desc:0 "Bí ẩn về việc cực quang lặp lại các hình mẫu cụ thể đã được giải đáp, khi các cảm biến phát hiện một số máy móc nhỏ trên quỹ đạo xung quanh [FromFrom.Planet.GetName]. Ta đã chặn và phân tích một số thiết bị này. Người ta đã xác nhận rằng những máy móc này có thể mô phỏng hiệu ứng của gió mặt trời bằng cách phát ra các luồng hạt tích điện để thao túng bầu khí quyển.\n\nNhững hình mẫu này thực chất là những mật mã được gửi đến các sinh vật trên mặt đất. Có một giả thuyết cho rằng hệ thống này được đưa vào sử dụng trong bối cảnh khủng hoảng toàn cầu. Những thông tin liên lạc được mã hóa trong thời chiến này, có thể là những chỉ thị cho những kẻ phá hoại hoặc những tín hiệu kích nổ vũ khí, đã được che giấu giữa thanh thiên bạch nhật. Vì không có ai để tắt các thiết bị này, chúng đã tiếp tục vòng tuần hoàn của mình, cho đến vĩnh viễn."
 ancrel.9205.name:0 "Vấn Thiên Tầm Đạo"
 ancrel.9205.desc:0 "Đúng như dự đoán, những dải cực quang nhảy múa nhịp nhàng quanh [FromFrom.Planet.GetName] không phải là hiện tượng tự nhiên. Cả hành tinh được bao bọc bởi một mạng lưới vệ tinh nhỏ vẫn đang hoạt động. Những máy móc này được lập trình để chiếu các luồng hạt điện từ vào thượng tầng khí quyển, mô phỏng hiệu ứng của gió mặt trời.\n\nNhững mô hình này vốn được thiết kế để mang lại một tác động xoa dịu lên tâm trí của người dân; một thông điệp tiềm thức được phát sóng qua bầu trời, dùng để đè nén những cảm xúc tiêu cực và đạt được hòa bình thế giới. Rõ ràng, hệ thống này đã không hoạt động theo đúng kế hoạch."
 ancrel.9210.name:0 "Khúc Ca Cô Độc"
 ancrel.9210.desc:0 "Cực quang đang sống! Những cực quang này thực chất là một dạng sống... chưa từng được biết đến trước đây? Một số thực thể bí ẩn và có một phần tri giác đang sống trong tầng khí quyển trên. Bằng cách nào đó, nó có thể thao tác với lực từ và sự ion hóa để làm biến dạng khí quyển, từ đó tạo ra những luồng sáng trên bầu trời theo những ý tưởng kỳ lạ ngoài hành tinh mà ta không thể nào thấu hiểu. Một số người đặt giả thuyết rằng đó là một nỗ lực giao tiếp, trong khi những người khác tin rằng nó chỉ đang chơi đùa, hoặc thậm chí là đang 'dùng ánh sáng để hát'.\n\nPhòng Nghiên Cứu Ngoại Lai báo cáo rằng, do chức năng sinh lý của thực thể này hoàn toàn khác biệt với ta, mọi nỗ lực dịch thuật đều trở nên vô hiệu. Nó đang gửi lời cảnh báo đến ta chăng? Hay nó đang tưởng nhớ hành tinh đã chết này? Hay nó đang đắc thắng với sự kiêu ngạo? \n\nTất cả những gì ta có thể làm là để nó lại đây một mình, tiếp tục ngân nga bài hát ngoài hành tinh của nó trên bầu trời."

 site_warmer_climates:0 "Điều Tra Sâu Vào Bên Trong"
 site_warmer_climates_intro:0 "Hình ảnh của [From.Planet.GetName] được chụp từ quỹ đạo đã phơi bày một cách rõ nét cơ sở hạ tầng của nền văn minh công nghệ này. Điều bí ẩn là, bất chấp những khu vực đô thị rộng lớn được kết nối bởi mạng lưới giao thông bề mặt phức tạp, hành tinh này dường như đã bị bỏ hoang hoàn toàn, không có bất kỳ dấu hiệu nào của sinh vật có tri giác còn sống sót. Lõi của hành tinh này hoạt động mạnh hơn hầu hết các hành tinh khác, nhưng không có dấu hiệu của các sự kiện thảm khốc hoặc bất kỳ sự kiện nào khác đủ để giải thích trực tiếp sự biến mất của những người này. Bọn họ đã đi đâu?"
 ancrel.9215.name:0 "Không Có Ai Về Nhà"
 ancrel.9215.desc:0 "Ta đã cử một đội đổ bộ lên bề mặt [From.Planet.GetName] và lần đầu tiên có cái nhìn cận cảnh về hành tinh này cùng những thành phố bị gió thổi hoang tàn, không một bóng người. Chúng đã rất cũ, bị phai màu và biến dạng do không được chăm sóc và phơi nắng, nhưng đa phần vẫn còn nguyên vẹn, không có dấu hiệu bị phá hủy. Ta không tìm thấy bất kỳ dấu vết nào do cư dân để lại.\n\nPhỏng đoán đáng tin cậy duy nhất hiện nay là đã có một cuộc di cư hoặc sơ tán tập thể nào đó xảy ra ở đây. Nhưng ta vẫn cần xác định xem điều gì đã buộc cả một giống loài phải bỏ lại những thành phố họ đã xây dựng và tất cả những gì họ sở hữu."
 ancrel.9220.name:0 "Đi Thẳng Xuống"
 ancrel.9220.desc:0 "Cuộc điều tra về việc dân số biến mất trên [From.Planet.GetName] đã có bước đột phá. Những cánh cửa bảo vệ lớn được đóng kín dẫn vào mạng lưới đường hầm sâu bên trong, chứng tỏ toàn bộ giống loài đã bắt đầu di cư xuống dưới lòng đất vào một thời điểm nào đó. Việc kiểm tra chéo các dữ liệu địa chất và khí tượng cho thấy toàn bộ hành tinh đã từng trải qua một kỷ băng hà bắt đầu đột ngột, có thể là do sự thay đổi độ nghiêng của trục quay, và có thể đã dẫn đến sự di cư này.\n\nViệc khám phá mạng lưới đường hầm rộng lớn đang được tiến hành."
 ancrel.9225.name:0 "Giấc Ngủ Dài Trong Hầm Mộ"
 ancrel.9225.desc:1 "Nhiều ngàn năm trước, nhiệt độ bề mặt của hành tinh này đã giảm mạnh, và phần lớn ánh sáng mặt trời đã bị mây che khuất. Để đối phó với cái lạnh bất ngờ, con người buộc phải di chuyển xuống dưới lòng đất, đào những cái hố ngày càng sâu hơn để đuổi theo chút nhiệt lượng còn sót lại ở tâm trái đất.\n\nNhưng điều này vẫn không đủ để duy trì sự sống, nên họ đã khởi động một chương trình ngủ đông ở nhiệt độ thấp. Khi nhiệt độ bề mặt trở lại bình thường, các thiết bị sẽ tự động đánh thức những người đang ngủ đông. Cuối cùng, hành tinh cũng ấm lên, nhưng điều đó xảy ra quá đột ngột khiến cho các thiết bị của khoang đông lạnh bị rối loạn, toàn bộ người ngủ đông đã bị thiêu chết trong quá trình thức giấc.\n\nĐứng sừng sững trong bóng tối ở đây là hàng triệu chiếc khoang đông lạnh chứa tro cốt đen tuyền của những người ngủ đông."
 ancrel.9230.name:0 "Đợt Nắng Nóng Chết Người"
 ancrel.9230.desc:0 "Đoàn thám hiểm của ta đã trở về và tìm ra câu trả lời cho bí ẩn về sự biến mất của cư dân trên [FromFrom.Planet.GetName]. Phần lớn dân số của hành tinh này đã chết trong kỷ băng hà đột ngột và khó lường. Những người sống sót của giống loài này đã di cư sâu vào lớp vỏ hành tinh để được tiếp cận với lõi trái đất đang nguội đi, vốn là nguồn năng lượng và nhiệt lượng duy nhất còn sót lại trong kỷ băng hà.\n\nNhững người sống sót đã tiến hành một dự án kỹ thuật dưới lòng đất khổng lồ. Nhằm nỗ lực làm tan băng thế giới đóng băng, họ đã có một hành động mạo hiểm, cố gắng vận chuyển nhiệt lượng từ lõi trái đất lên bề mặt. Tuy nhiên, dự án này đã xảy ra sai sót nghiêm trọng, tốc độ phục hồi nhiệt của lõi trái đất đã mất kiểm soát, nham thạch và khí quá nhiệt phụt ra đã lấp đầy toàn bộ hầm trú ẩn, giết chết tất cả những người sống sót trong nháy mắt."
 ancrel.9235.name:0 "Căn Hầm Băng Giá Đơn Độc"
 ancrel.9235.desc:0 "Đoàn thám hiểm của ta đã trở về và mang theo một câu chuyện buồn. Hàng nghìn năm trước, lõi của hành tinh này đã bị nguội lạnh nghiêm trọng, và những người dân trên đó buộc phải di cư vào lòng đất để tìm kiếm nhiệt lượng, năng lượng và tài nguyên. Năm này qua năm khác, nhiệt độ lõi của hành tinh càng ngày càng thấp, và họ đào càng ngày càng sâu. Số lượng người sống sót giảm dần, hầu hết mọi người đều bị chết cóng, chết đói hoặc chết trong các tai nạn đào bới. Tình trạng này đã kéo dài trong nhiều thập kỷ.\n\nDưới đường hầm sâu nhất, có một đường hầm hẹp, được đào bằng tay, cách xa khu vực đường hầm nơi cỗ máy đào cuối cùng bị hỏng và bỏ hoang, ta đã tìm thấy một thi thể duy nhất của một sinh vật giống động vật thân mềm được bọc trong băng. Các bản ghi tin nhắn để lại ở đó cho ta biết nó là sinh vật sống sót cuối cùng của giống loài của họ. Nó cảm thấy lạnh lẽo và cô đơn, sẵn sàng bỏ cuộc."
 ancrel.9235.b.evopred: "Hy vọng sự kiên cường của các người là di truyền."

 site_phoenix_collective:0 "Có Ai Ở Đó Không?"
 site_phoenix_collective_intro:0 "Tàu điều tra của ta đã quét qua [From.Planet.GetName] và phát hiện một vài cấu trúc nhân tạo đáng được quan sát sâu hơn. Điều đáng lo ngại là, ở đó không có bất kỳ dấu hiệu nào của việc tồn tại con người."
 ancrel.9240.name:0 "Thành Phố Ma Quái"
 ancrel.9240.desc:0 "Nhóm thám hiểm bề mặt hành tinh của ta đã báo cáo về những phát hiện đáng kinh ngạc. Có một số thành phố chính trên hành tinh này, tất cả đều bị bỏ hoang, nhưng xét về tuổi tác của chúng, các thành phố đang trong tình trạng khá tốt. Cơ sở hạ tầng và quy hoạch đô thị của từng thành phố đặc biệt tỉ mỉ và hài hòa, cho thấy đây là một nền văn minh với sự gắn kết nội bộ cao, mang đậm màu sắc tập trung quyền lực, chủ nghĩa tập thể——thậm chí có thể là một dạng ý thức Gestalt nào đó.\n\nDựa trên thiết kế kiến trúc và cơ sở hạ tầng nội bộ của nó, giống loài xây dựng nên những công trình này dường như là những sinh vật loại nấm nhỏ, và trình độ phát triển công nghệ của chúng khá thấp. Việc họ đã đi đâu vẫn còn là một ẩn số."
 ancrel.9245.name:0 "Công Việc Lặp Lại Và Việc Tu Sửa Các Tòa Nhà"
 ancrel.9245.desc:0 "Những nghiên cứu sâu hơn về nền văn minh đã biến mất trên [From.Planet.GetName] đã trả lời cho một vài câu hỏi, nhưng lại đồng thời cũng đặt ra nhiều câu hỏi hơn. Những công trình kiến trúc khiêm tốn, vững chãi này có lịch sử hàng ngàn năm, và dường như đều được xây dựng vào cùng một khoảng thời gian, có lẽ chênh lệch không quá một thế kỷ. Tương tự như vậy, việc cơi nới hay tu bổ bất kỳ công trình đô thị nào trên khắp hành tinh có vẻ cũng bắt đầu một cách đột ngột sau một khoảng thời gian dài bị gián đoạn. Hiện tượng lạ lùng là sự phát triển của xã hội này đôi khi lại bị đứt đoạn dường như không có ảnh hưởng đáng kể đến quy mô dân số."
 ancrel.9250.name:0 "Hồi Sinh Tử Đất Mẹ"
 ancrel.9250.desc:0 "Nghiên cứu gần đây đã làm sáng tỏ việc tìm kiếm những người xây dựng thành phố đã mất một cách bí ẩn trên [From.Planet.GetName]. Có vẻ như, giống loài nấm này có một vòng tuần hoàn của cái chết tập thể và sự tái sinh. Trải dài trên toàn bộ hành tinh, quả thể của giống loài này gần như chín muồi đồng thời, và phát triển thành một phần của hệ thống ý thức tổ ong có tính liên kết. Trong chu kỳ sống hàng trăm năm của mình, chúng vươn lên khỏi mặt đất và tái sử dụng những thành phố đã được các thế hệ trước xây dựng và bỏ hoang.\n\nKhi chu kỳ tử vong/tái sinh tiếp theo đến gần, một tín hiệu ảnh hưởng đến tất cả các cá thể sẽ được phát ra. Thông qua sinh sản vô tính, chúng sinh ra một quả thể chôn vùi trong lòng đất. Sau khi cá thể gốc héo tàn, cơ thể của nó sẽ phân hủy và làm màu mỡ cho mặt đất xung quanh quả thể. Trải qua một thời kỳ ngủ đông dài đằng đẵng, quả thể sẽ trưởng thành, và một chu kỳ mới lại được lặp lại."
 ancrel.9255.name:0 "Vòng Tuần Hoàn Dừng Lại"
 ancrel.9255.desc:0 "Quá trình khai quật mặt đất của [FromFrom.Planet.GetName] cuối cùng đã tiết lộ số phận của những người mất tích. Ban đầu, họ đều được thai nghén và phát triển dưới lòng đất, chuẩn bị để trồi lên mặt đất. Tuy nhiên, một số hiện tượng tự nhiên——rất có thể là do tác động của thiên thạch, đã xáo trộn thời tiết và mùa màng trong nhiều thập kỷ, phá hủy hệ sinh thái của hành tinh này. Khi họ trồi lên mặt đất, thế giới này đã không còn thích hợp để tồn tại nữa.\n\nSự kiện tái sinh, vốn dĩ phải là một lễ hội chung, nhanh chóng trở thành một nạn đói lan rộng đến mọi cá nhân, chậm rãi nhưng không thể xoa dịu, và cuối cùng dẫn đến sự tuyệt chủng của toàn bộ chủng loài."
 ancrel.9260.name:0 "Siêu Thoát Khỏi Vật Chất"
 ancrel.9260.desc:0 "Các nghiên cứu tâm lý học và xã hội học về các loài nấm đã mang lại lời giải thích đáng lo ngại cho bí ẩn về sự biến mất của họ. Ở một số thời điểm, giống loài có ý thức tổ ong này bắt đầu nghi ngờ vòng đời bất tận và dường như vô nghĩa của chúng. Hạt giống của chủ nghĩa hư vô đã nảy mầm trong toàn xã hội, cuối cùng đạt đến đỉnh điểm và lấn át bản năng sinh tồn của chúng, khiến chúng thực hiện những hành động cực đoan.\n\nMột khi ý tưởng này xuất hiện, ngay cả khi nó chỉ xuất hiện ở một cá thể, nó sẽ nhanh chóng lan truyền qua mạng lưới tổ ong và ảnh hưởng đến mọi người, cho đến khi họ cùng nhất trí ngừng gieo những quả thể dùng để sinh sản——và thiêu rụi chúng."
 ancrel.9265.name:0 "Sự Trở Lại Của Những Người Đã Khuất"
 ancrel.9265.desc:0 "Câu trả lời cho bí ẩn về sự biến mất của xã hội nấm khá đơn giản——cư dân của hành tinh này chưa bao giờ rời đi. Họ vẫn ở đó, đang phát triển dưới lòng đất. Quá trình phân tích một quả thể tiếp xúc với bề mặt cho thấy, loài này có tuổi thọ lên tới hàng trăm năm. Nhưng so với hàng nghìn năm chúng cần để phát triển dưới lòng đất, một trăm năm chỉ là một khoảng thời gian ngắn ngủi. Những thành phố thô sơ bị bỏ hoang từ lâu của họ vẫn đang lặng lẽ đứng đó, chờ đợi sự trở lại của họ.\n\nĐúng vậy, tất cả họ đều vẫn ở đó, ngủ đông dưới lòng đất, chờ đợi ánh sáng ban ngày và bắt đầu một chu kỳ sống mới."

 site_grand_herald:0 "Bậc Tiên Phong Vĩ Đại"
 site_grand_herald_intro:1 "Kể cả khi không có các công cụ, người ta cũng có thể dễ dàng nhìn thấy những cụm thành phố khổng lồ bị bỏ hoang tồn tại trên [From.Planet.GetName]. Chắc chắn nơi đây từng là nhà của một nền văn minh cực kỳ tiên tiến, nhưng bây giờ lại không thể phát hiện bất kỳ dấu hiệu sống nào, và cũng không thể thu nhận được tín hiệu điện từ nào mang đặc tính của một xã hội công nghệ. Hành tinh này dường như đã chìm vào tĩnh lặng chết chóc. Ta cần hạ cánh để tìm hiểu thêm tình hình."
 ancrel.9270.name:0 "Sự Cuồng Tín"
 ancrel.9270.desc:1 "Những tòa nhà bị tàn phá nặng nề nhưng cũng cực kỳ tối tân này cho thấy, đây là một chủng tộc giống người sắp bước vào kỷ nguyên du hành không gian. Các tài liệu được dịch cùng vô số công trình kỷ niệm chứng tỏ một tín ngưỡng tôn giáo hay tâm linh nào đó đã cắm rễ sâu vào toàn bộ nền văn minh này.\n\nCụm từ §HBậc Tiên Phong Vĩ Đại§! liên tục được nhắc đến, dường như trong xã hội này, đây là một biểu tượng hoặc khái niệm vô cùng thiêng liêng, đòi hỏi sự thành kính tuyệt đối."
 ancrel.9275.name:0 "Dấu Hiệu Của Giao Ước"
 ancrel.9275.desc:1 "Sau khi lục lọi qua khối lượng tài liệu khổng lồ thu thập được trên khắp hành tinh—phải công nhận rằng chủng loài này rất coi trọng chữ viết—ta nhận thấy một khái niệm lặp đi lặp lại rất đáng chú ý. Nó được miêu tả là §HDấu Hiệu Của Giao Ước§!, liên quan đến các điềm báo về ngày tận thế sắp tới, điều này đã gây nên sự nghi ngờ và hoang mang tột độ trong công chúng.\n\nVì những ngôn từ mang tính tôn giáo này đầy rẫy ẩn dụ và rất khó hiểu, ta khó mà xác định được bản chất của mối đe dọa này, nhưng tác động thực sự của nó đối với tâm lý của chủng loài này là không thể chối cãi. Họ đã bắt đầu cùng nhau cầu nguyện sự cứu rỗi từ thần linh."
 ancrel.9280.name:0 "Tín Điều Nô Lệ"
 ancrel.9280.desc:1 "Các nhà phân tích kiến trúc đã tách riêng những công trình được hoàn thành ngay trước khi nền văn minh biến mất khỏi những công trình khác. Kiểu kiến trúc này rải rác khắp hành tinh: những công trình thực dụng lộn xộn, được xây dựng dành riêng cho ngành công nghiệp nặng. Khác với những khu nhà ở cũ, những tòa nhà này mang thiết kế đơn giản và cực kỳ hữu dụng. Có lẽ một loại văn hóa phản truyền thống đã bắt đầu thịnh hành?\n\nPhía trên lối vào của mỗi tòa nhà đều khắc §HTín Điều Nô Lệ§!—đó là một nghi lễ cầu nguyện dành cho §HBậc Tiên Phong Vĩ Đại§! và kế hoạch thiêng liêng của nó. Có giả thuyết cho rằng, đây là một phản ứng đối với ngày tận thế được tiên đoán trong §HDấu Hiệu Của Giao Ước§!."
 ancrel.9285.name:0 "Bài Thánh Ca Của Người Sùng Đạo"
 ancrel.9285.desc:1 "Đội thăm dò bề mặt đã có một khám phá thú vị. Đó là một đoạn băng ghi âm hình ảnh và âm thanh được tìm thấy tại một thành phố lớn. Một nhóm lớn các sinh vật, dường như là cư dân bản địa, đang tụ tập tại một quảng trường công cộng. Họ đang hát vang, và âm thanh đồng ca ngày càng mạnh mẽ, hệt như những tiếng sấm dội với giai điệu không ngừng dâng cao.\n\nLời bài hát tập thể của họ được dịch như sau: “Sự thăng thiên đã cận kề. Bậc Tiên Phong Vĩ Đại, dìu dắt dân như con, bước vào cuộc đời mới. Vùng đất đầy u ám, hãy để lại sau lưng, chốn quê hương hứa hẹn, tìm giữa những vì sao. Chúng ta cùng tụng ca, từ đầu tới lúc cuối!”"
 ancrel.9290.name:0 "Cuộc Hành Hương Ngày Tận Thế"
 ancrel.9290.desc:1 "§HBài Thánh Ca Của Người Sùng Đạo§! không phải là một sự kiện cá biệt—nó đã lan rộng toàn cầu, mọi người dân đều đồng thanh ca hát. Sau khi điều tra sâu hơn về sự kiện bất thường này, ta đã hiểu rõ hơn về những gì đã diễn ra. Một tài liệu mang tên §HCuộc Hành Hương Ngày Tận Thế§! đã được phát hiện, có vẻ như đây là mảnh ghép cuối cùng liên quan đến sự thật của chuỗi sự kiện bí ẩn này.\n\nTài liệu này chỉ điểm một địa điểm đặc biệt trên hành tinh, nơi được dùng để thực hiện cuộc phán xét cuối cùng hay nghi lễ tối hậu. Đó là một sa mạc hoang vắng từng bị phớt lờ trong các cuộc điều tra trước đây. Tài liệu này còn nhắc đến một thứ gọi là §HNghi Lễ Vén Màn Bí Mật§!, hiện đang được phân tích ý nghĩa."
 ancrel.9295.name:0 "Con Tàu Kế Thừa"
 ancrel.9295.desc:2 "§HBậc Tiên Phong Vĩ Đại§!, nhờ vào lớp ngụy trang quang học tinh vi để tránh bị máy quét quỹ đạo phát hiện, cuối cùng đã bị lôi ra ánh sáng. Nó không phải là lời tiên tri hay biểu tượng tôn giáo nào cả; đó là một con tàu vũ trụ khổng lồ cấp độ Titan! Những cuộc chiến tranh nhân danh tôn giáo đã tàn phá thế giới của họ, và con tàu Titan này được thiết kế như một chiếc thuyền cứu sinh để bảo vệ một phần nhỏ dân số, nó sẽ chở họ rời khỏi hành tinh sắp bị hủy diệt này và bay tới một vùng đất hứa chưa xác định. Con tàu đã được lắp ráp hoàn chỉnh và hoạt động bình thường, vì vậy lý do nó không thể cất cánh thật sự là một câu hỏi gây bối rối.\n\nCó vẻ như đã xảy ra một trận chiến quyết định nào đó trước khi cất cánh. Một cuộc chiến vô cùng thảm khốc, mà không một bên nào sống sót sau cuộc giao tranh kéo dài."
 ancrel.9300.name:0 "Người Bảo Vệ Toàn Diện"
 ancrel.9300.desc:1 "Đây hoàn toàn không phải là một sự kiện tôn giáo! Sau khi tắt một lớp ngụy trang quang học, đội thám hiểm cuối cùng cũng đã được chiêm ngưỡng diện mạo thực sự của §HBậc Tiên Phong Vĩ Đại§!; một con tàu vũ trụ khổng lồ cấp độ Titan, một nửa thân tàu vẫn bị vùi dưới cát, nó được tạo ra để đối phó với một mối đe dọa nào đó sắp xảy ra trong vũ trụ. Hóa ra, những ngôn từ ẩn dụ giống như thơ ca, từng được cho là từ ngữ mang tính tôn giáo, thực chất chỉ là ngôn ngữ giao tiếp hằng ngày của chủng loài này.\n\nMối nguy hiểm sắp đến là gì vẫn còn là một điều bí ẩn, nhưng theo những gì quan sát được hiện tại, nó chắc chắn đã ập đến trước khi tàu Titan được kích hoạt hoàn toàn. Nằm la liệt xung quanh con tàu là hàng ngàn xác ướp của những người [FromFrom.Planet.GetName] đã tuyệt chủng, họ không kịp khởi động con tàu Titan, và sẽ không bao giờ có cơ hội đó nữa."
 ancrel.9305.name:0 "Lời Hứa Cứu Rỗi"
 ancrel.9305.desc:2 "§HBậc Tiên Phong Vĩ Đại§! thực sự không phải là một biểu tượng tôn giáo thông thường, đây là một dự án kỹ thuật to lớn và đặc biệt—một khu vực xây dựng tự động hóa. Những dầm thép cao như các tòa nhà chọc trời đã cho thấy dự án đầu tiên và duy nhất của nó; một con tàu vũ trụ cấp Titan khổng lồ. Mối liên hệ giữa ý nghĩa tôn giáo và những phát hiện khảo cổ hiện tại vẫn chưa hoàn toàn rõ ràng, nhưng chúng ta đã biết: Mối nguy hiểm được đề cập trong §HDấu Hiệu Của Giao Ước§! cuối cùng đã đến, khiến toàn bộ dân số trên hành tinh bị chết một cách bí ẩn trước khi dự án Bậc Tiên Phong Vĩ Đại hoàn thành.\n\nNhưng khu vực xây dựng tự động hóa vẫn không ngừng hoạt động, và cuối cùng đã hoàn tất việc lắp ráp con tàu vũ trụ mà sẽ không có bất kỳ hành khách nào đặt chân lên. Con tàu trống rỗng và hoàn chỉnh này đã nằm im lìm ở đây mà không có người điều khiển, qua bao năm tháng. Ta có nên để nó một lần nữa nhìn thấy ánh sáng mặt trời, và bay vào vùng biển sao không?"
 get_herald:0 "§YBậc Tiên Phong Vĩ Đại§! đã gia nhập hạm đội của chúng ta"

 site_hive_coral:0 "Bên Dưới Những Con Sóng"
 site_hive_coral_intro:1 "Các máy quét từ con tàu khoa học trên quỹ đạo [From.Planet.GetName] đã cho thấy một cấu trúc kỳ lạ bên dưới mặt biển, và nước biển đang chảy theo cách khó có thể lý giải. Mặc dù thời tiết trên hành tinh này tương đối ôn hòa và hiếm khi có bão, nước bên dưới mặt biển dường như đang bị ảnh hưởng bởi một sức mạnh bí ẩn nào đó, không ngừng cuộn trào và khuấy động. Đề xuất tiến hành một cuộc điều tra chi tiết."
 ancrel.9310.name:0 "Đâm Xuyên Qua Mặt Nước"
 ancrel.9310.desc:1 "Cuộc thám hiểm vùng biển của [From.Planet.GetName] đã gặp phải một số chuyện kỳ lạ. Một lượng lớn các mũi nhọn hữu cơ đâm qua mặt nước, vươn cao hàng trăm mét lên bầu trời, chúng được làm từ san hô hoặc xương động vật.\n\nCác mũi nhọn xuất hiện thành từng cụm. Cấu trúc này phổ biến ở mọi vùng biển trên toàn hành tinh, ngoại trừ các vùng cực lạnh giá nhất. Các mũi nhọn có cấu trúc xốp, bề mặt của chúng phủ đầy các lỗ có kích thước khác nhau, kích thước của các lỗ này tương đương với máy bay chiến đấu trên tàu sân bay. Có lẽ cấu trúc sinh học này có liên quan đến quá trình sinh sản của chúng?"
 ancrel.9315.name:0 "Máy Tạo Dòng Nước"
 ancrel.9315.desc:1 "Đội thám hiểm cuối cùng đã tìm thấy thành công một số cấu trúc sinh học dài và đồng nhất dưới đáy biển của hành tinh. Những cấu trúc dưới nước này được làm cùng một loại vật liệu với các mũi nhọn trên mặt nước, và cơ chế hoạt động của chúng giống như một loại bơm sinh học. Mạng lưới sinh học này không ngừng 'thở', hơi thở khuấy động nước biển.\n\nKích thước của những cấu trúc này, và quy mô của chúng dưới đáy biển, gợi ý rằng chúng là nguyên nhân gây ra sự cuộn trào khó giải thích của nước biển bên dưới mặt biển [From.Planet.GetName]."
 ancrel.9320.name:0 "Tổ San Hô"
 ancrel.9320.desc:1 "Một đội thám hiểm biển sâu khác đã trở về, phơi bày sự thật về các dòng chảy ngầm ở đáy biển [FromFrom.Planet.GetName]. Mọi cấu trúc hữu cơ kỳ lạ trên hành tinh này thực chất đều được liên kết với một rạn san hô khổng lồ. Hóa ra, loại san hô này theo một khía cạnh nào đó là có ý thức, mặc dù so với những sinh vật có cảm xúc như ta, cách suy nghĩ của nó hoàn toàn khác biệt. Bằng cách tiết ra pheromone vào trong nước, nó ít nhiều đã nô dịch mọi sinh vật khác trong đại dương, kiểm soát hành vi và chu kỳ sinh sản của chúng, để thỏa mãn nhu cầu của bản thân.\n\nNó có vẻ hoàn toàn vô hại, nhưng nó vẫn là một kẻ điều khiển con rối. Liệu nó có phải là dạng sống tối thượng trên hành tinh này? Hay là một loài ký sinh trùng ngoại lai? Việc giao tiếp với nó dường như là không thể, vì vậy có lẽ ta sẽ không bao giờ biết được sự thật."
 ancrel.9320.b.evopred: "Thông qua sự thích nghi, ta sẽ không phải đối mặt với một cuộc xâm lăng như vậy."
 ancrel.9325.name:0 "Vị Cứu Tinh Của Sự Sống"
 ancrel.9325.desc:1 "Sau khi giải trình tự DNA của loại sinh vật ngoài hành tinh này, ta đã có một khám phá đáng kinh ngạc: mạng lưới san hô trải rộng khắp các đại dương trên toàn cầu không chỉ không phải là loài bản địa của thế giới này, mà thậm chí còn không phải là một giống loài tự nhiên, nó thực chất là một sản phẩm công nghệ sinh học do con người tạo ra. Dưới những lớp san hô dày đặc là những tầng hóa thạch của các sinh vật tuyệt chủng thuộc toàn bộ hệ sinh thái của thế giới này. Dường như san hô sau khi được đưa vào, đã dần dần tiêu diệt tất cả các sinh vật bản địa, thay thế chúng bằng một hệ sinh thái được thiết kế riêng cho chính nó.\n\nVề lý do tại sao lại làm như vậy, có hai phỏng đoán chính: hoặc loại san hô nhân tạo này được đưa vào vì mục đích tốt, và sau đó nó đã đánh bại hoàn toàn các giống loài bản địa trong cuộc cạnh tranh theo một cách không lường trước được; hoặc nó cố tình được thiết kế làm một vũ khí sinh học đáng sợ để loại bỏ các sinh vật bản địa của thế giới đại dương này."
 ancrel.9330.name:0 "Hội Đồng Chào Mừng"
 ancrel.9330.desc:1 "Đây là một cỗ máy sinh học khổng lồ! Phân tích địa chất chỉ ra rằng, đại dương của hành tinh này đã từng rơi vào tình trạng chết lặng—không có dòng hải lưu, cũng không có oxy để duy trì sự sống cho các sinh vật thủy sinh. Cỗ máy công nghệ sinh học này đã được đưa vào hành tinh này nhằm tạo ra một cách nhân tạo những điều kiện tiên quyết cơ bản cho sự sinh tồn của sinh vật.\n\nRõ ràng là nó đã phát huy tác dụng, vì hiện tại trên hành tinh này có một hệ động thực vật dưới nước rất phong phú. Không tìm thấy bất kỳ manh mối nào để giải thích lý do thực hiện một dự án khổng lồ như vậy, cũng không tìm thấy thông tin về ai—có lẽ là một loài sinh vật thủy sinh không xác định nào đó, đã sử dụng công nghệ sinh học tiên tiến để cải tạo môi trường, nhằm tạo ra một ngôi nhà mới cho chính mình?"

 site_orbital_rain:0 "Truy Vết Đến Cùng"
 site_orbital_rain_intro:1 "Tín hiệu phản hồi từ cảm biến ánh sáng nhìn thấy từ [From.Planet.GetName] cho thấy có một cấu trúc cực kỳ bất thường trên đáy biển của hành tinh đại dương này."
 ancrel.9335.name:0 "Vết Thương Đáy Biển"
 ancrel.9335.desc:1 "Quá trình kiểm tra cẩn thận trên [From.Planet.GetName] chỉ ra rằng, phần lớn đáy biển trông vô cùng kỳ dị—giống như bề mặt của một vệ tinh hoặc tiểu hành tinh, hoàn toàn bị bao phủ bởi các hố va chạm. Những hố va chạm này thường không xuất hiện trên các thiên thể có khí quyển, đặc biệt là những thiên thể có đại dương.\n\nCần phải tiến hành nghiên cứu sâu hơn."
 ancrel.9340.name:0 "Thứ Nước Siêu Phàm"
 ancrel.9340.desc:1 "Bí ẩn về các hố thiên thạch dưới đáy biển cuối cùng cũng được giải mã thông qua việc phân tích lượng nước. Dấu vết của một số khoáng chất và thành phần hóa học đã chứng minh rằng, lượng nước này thực sự không phải bắt nguồn từ cùng một hành tinh. Nó đã được chuyển đến đây dưới dạng những khối băng khổng lồ và bị ném xuống bề mặt hành tinh. Các khối băng lao xuống, vỡ vụn và tan chảy, cuối cùng bao phủ toàn bộ bề mặt hành tinh chìm dưới nước.\n\nĐây tuyệt đối là một dự án bất hủ, nhưng vẫn chưa rõ mục đích của nó là gì."
 ancrel.9345.name:0 "Sự Cố Hiện Tại"
 ancrel.9345.desc:1 "Con tàu nghiên cứu trên quỹ đạo của [FromFrom.Planet.GetName] đã phát hiện một số chỉ số năng lượng lạ từ sâu dưới đáy đại dương. Sau khi kiểm tra kỹ lưỡng, nhóm thám hiểm đã tìm ra một công trình kiến trúc cổ. Đây là một cấu trúc nhân tạo dài tới hàng kilomet, với chức năng duy nhất: tạo ra các dòng hải lưu dưới nước một cách nhân tạo.\n\nSự luân chuyển nước là yếu tố sống còn đối với nhiều loài sinh vật biển. Giả thuyết hiện tại cho rằng hành tinh này đã được cải tạo thành hình dạng như ngày nay bởi một giống loài sống dưới nước có khả năng du hành vũ trụ. Nhưng có vẻ như họ chưa từng xuất hiện."
 ancrel.9350.name:0 "Kho Lưu Trữ Dưới Nước"
 ancrel.9350.desc:1 "Lần theo một tín hiệu năng lượng kỳ lạ, nhóm thám hiểm của ta đã tìm thấy một mảng thông tin liên lạc ngoài hành tinh bị chôn sâu dưới đáy biển. Nếu có thể giải mã những đoạn thông điệp trong đó, bức tranh toàn cảnh về dự án dẫn nước ngoài hành tinh này sẽ được làm rõ.\n\nTheo bản dịch, toàn bộ dự án tạo biển này nhằm xây dựng một hầm chứa dưới nước khổng lồ, nhưng không đề cập chi tiết đến việc lưu trữ thứ gì. Chắc chắn, dự án này không nhất thiết phải nhấn chìm cả hành tinh."
 ancrel.9355.name:0 "Kiểm Soát Khí Hậu"
 ancrel.9355.desc:1 "Nhờ vào phát hiện tình cờ của con tàu nghiên cứu, ta đã thành công đào lên một công trình cổ bị chôn vùi sâu dưới đáy biển. Việc khám phá nơi đó cực kỳ khó khăn, nhưng kết quả đạt được lại vô cùng ngoạn mục.\n\nCông trình này từng là một trung tâm kiểm soát khí hậu. Nó có nhiệm vụ điều khiển các cỗ máy cải tạo khí hậu khổng lồ tiến vào quỹ đạo. Mặc dù đây là một dự án cải tạo môi trường bị bỏ dở, nhưng rõ ràng nó đã đạt được những tiến triển đáng kể. Ngay cả khi nguồn tài trợ bị cắt đứt, sự tiến hóa tự nhiên mạnh mẽ vẫn tiếp nối công việc còn dang dở, và cuối cùng đã hình thành nên hệ sinh thái như hiện tại."

 site_fossilized_jellyfish:0 "Quần Đảo Tinh La"
 site_fossilized_jellyfish_intro:1 "Con tàu nghiên cứu bay quanh [From.Planet.GetName] đã phát hiện ra những cụm đảo hình tròn rải rác trên bề mặt của hành tinh đại dương này. Dưới góc nhìn địa chất, chúng cực kỳ bất thường: bề mặt trông hoàn toàn tự nhiên, không có cấu trúc nhân tạo nào, nhưng tất cả đều hình tròn, và gần như là những vòng tròn hoàn hảo. Ta cần đến đó để thu thập thêm dữ liệu."
 ancrel.9360.name:0 "Đường Hầm Xuyên Đảo"
 ancrel.9360.desc:1 "Nhóm thám hiểm đổ bộ lên bề mặt [From.Planet.GetName] bắt đầu điều tra một trong những hòn đảo hình tròn, và ngay lập tức phát hiện ra điều khác thường. Dưới hòn đảo có một hệ thống đường hầm phức tạp, uốn lượn qua một lớp đá chứa dầu kỳ lạ. Những đường hầm này có hình tròn đồng nhất, và có thể tìm thấy dưới tất cả các hòn đảo. Chúng có vẻ được hình thành một cách tự nhiên chứ không phải do đào bới, nhưng cách chúng hình thành chắc chắn khác biệt với các hoạt động địa chất thông thường."
 ancrel.9365.name:0 "Đường Hầm Đâu Cũng Có"
 ancrel.9365.desc:1 "Khi nhóm thám hiểm trên mặt đất tiến sâu vào hòn đảo hình tròn, họ đã có hai phát hiện mới: thứ nhất, bên dưới mỗi hòn đảo dường như có cấu trúc đường hầm bên trong tương tự nhau. Chúng khác nhau một chút về kích thước, nhưng cấu trúc thì giống nhau. Phát hiện thứ hai còn đáng ngạc nhiên hơn: những hòn đảo này không phải là một phần của lớp vỏ hành tinh——chúng thực sự đang nổi! Lớp dưới cùng của chúng chứa đầy các túi khí, kết hợp với các tảng đá đảo khá mỏng manh và xốp, đã giúp những hòn đảo này nổi lên."
 ancrel.9370.name:0 "Gel Đóng Băng"
 ancrel.9370.desc:1 "Câu trả lời cho bí ẩn về các hòn đảo nổi không nằm ở địa chất, mà ở sinh học. Những hòn đảo này thực chất là những hóa thạch sứa khổng lồ. Hàng triệu năm trước, kỷ băng hà đã đóng băng chúng đến chết, sau đó xác của chúng biến thành hóa thạch, tạo nên những hòn đảo nổi mà ta thấy ngày nay. Hàng năm ròng rã tích tụ mảnh vụn khiến bề mặt trần trụi của chúng trông giống như những hòn đảo tự nhiên, nhưng bên dưới chúng hoàn toàn là chất hữu cơ."
 ancrel.9370.b.evopred: "Quả là một mảnh đất ngon lành."
 ancrel.9375.name:1 "Trạng Thái Ngủ Đông Tự Nhiên"
 ancrel.9375.desc:1 "Chúng hoàn toàn không phải là những hòn đảo, mà là sứa! Trên thực tế, mỗi vòng tròn nổi là một loài động vật không xương sống khổng lồ. Và chúng không hề chết: trạng thái dường như hóa đá chỉ là một phần tự nhiên trong vòng đời của chúng. Trong suốt hàng thiên niên kỷ, những hòn đảo đá này giải phóng trầm tích cho đến khi chúng hòa tan hoàn toàn. Trầm tích chứa các polyp siêu nhỏ, những polyp này cuối cùng sẽ nảy chồi trong nước, cho đến khi chúng bước vào giai đoạn tiếp theo của vòng đời."
 ancrel.9380.name:0 "Kẻ Khổng Lồ Khó Chơi"
 ancrel.9380.desc:1 "Chúng hoàn toàn không phải là hòn đảo. Chúng đều là những sinh vật ngoài hành tinh: loài sứa, vì một số lý do, chúng đã được đưa vào hệ sinh thái một cách nhân tạo. Tuy nhiên, việc giới thiệu chúng có vẻ như không diễn ra suôn sẻ theo đúng kế hoạch. Hầu hết các loài sứa lớn đều đã chết và trở thành hóa thạch, sau đó biến đổi thành quần đảo nổi, nhưng những con sứa nhỏ hơn đã thích ứng với môi trường, và hiện đang sinh sôi nảy nở trên đại dương của hành tinh. Vẫn còn phải xem liệu cuối cùng chúng có đi theo con đường của tổ tiên to lớn hơn của chúng hay không."

 site_popular_rock:1 "Tảng Đá Nổi Tiếng"
 site_popular_rock_intro:1 "Máy quét đã phát hiện ra các chỉ số năng lượng bên trong một cụm tiểu hành tinh. Đề xuất tiến hành một cuộc điều tra kỹ lưỡng hơn."
 ancrel.9385.name:1 "Xin Chào/Tạm Biệt"
 ancrel.9385.desc:2 "Thông qua việc lần theo những dấu vết năng lượng mờ nhạt, rất có thể do tàu vũ trụ để lại, một tiểu hành tinh đặc biệt đã được chọn lọc từ trong cụm. Sau khi kiểm tra kỹ lưỡng hơn bề mặt của tiểu hành tinh này, nhiều dấu vết hạ cánh và cất cánh đã được phát hiện trên mặt đá, xác nhận giả thuyết về sự tồn tại của các tuyến hàng không vũ trụ trước đây tại địa điểm này.\n\nMáy quét cũng tiết lộ rằng bên trong tiểu hành tinh có các khu vực bị khoét rỗng và các đường hầm, có thể dùng để khai quật thêm nhiều thông tin."
 ancrel.9390.name:1 "Tảng Đá Bậc Thang"
 ancrel.9390.desc:1 "Sau khi băng qua những đường hầm chật hẹp, đội thám hiểm cuối cùng cũng vấp phải căn phòng bí mật nằm sâu nhất. Đó là một căn phòng rộng lớn, được chế tác tỉ mỉ, trang hoàng bởi những bức tượng được chạm khắc trực tiếp vào mặt đá. Các văn tự tôn giáo được khắc trên tường gọi nơi này là 'Bước thứ chín', rõ ràng đây là một trong nhiều điểm đến cho chuyến hành hương của giống loài đã xây dựng nơi này.\n\nNếu đây là bước thứ chín, vậy tám bước trước đó ở đâu? Và còn bao nhiêu bước nữa tiếp theo?"
 ancrel.9395.name:1 "Kho Lưu Trữ Không Gian Sâu"
 ancrel.9395.desc:1 "Khi đội thám hiểm trên mặt đất phát hiện ra những khu vực lưu trữ khổng lồ và các hầm ngầm được đào vào tiểu hành tinh, lý do tại sao tiểu hành tinh này thường xuyên có người ghé thăm đã trở nên rõ ràng. Khối đá hoang vắng này từng là nhà kho của một giống loài có khả năng du hành vũ trụ nào đó, nó cung cấp việc tiếp nhiên liệu và bảo dưỡng trước khi gửi các con tàu vào không gian xa xôi hơn. Điều này ngụ ý rằng đó là một xã hội ngoài hành tinh không có động cơ du hành nhanh hơn ánh sáng, nhưng lại có đủ động lực để khám phá vũ trụ.\n\nNguyên nhân tại sao kho lưu trữ tiểu hành tinh này lại bị bỏ hoang vẫn chưa rõ ràng, nhưng chúng ta đã tìm cách thu hồi được một ít vật tư. Ai tìm thấy thì người đó giữ!"
 ancrel.9400.name:1 "Khoảnh Khắc Thức Tỉnh"
 ancrel.9400.desc:1 "Sau khi tiến vào bên trong tiểu hành tinh, đội thám hiểm đã có một phát hiện khá hấp dẫn. Những buồng ngủ đông bị bỏ hoang——hàng vạn cái——xếp thành hàng trong một không gian khổng lồ được đào nhân tạo. Mỗi buồng ngủ đông đều đang mở, đã ngừng hoạt động từ lâu, tạo cảm giác như chúng đã hoàn thành sứ mệnh của mình.\n\nGiả thuyết hiện tại là, tiểu hành tinh này giống như một loại tàu định cư, được phóng ra, bay qua không gian bao la, hướng về một môi trường sống phồn vinh nào đó. Khi đến gần đích, một hệ thống tự động đã đánh thức 'hàng hóa' đang ngủ say, và sau đó họ lên một con tàu vũ trụ cự ly ngắn, rời khỏi tiểu hành tinh, hướng tới ngôi nhà mới của mình."

 site_strange_flows:1 "Dòng Chảy Kỳ Lạ"
 site_strange_flows_intro:1 "Một hành tinh dung nham được cho là 'bình thường' đã khiến các cảm biến của tàu khoa học bị lỗi không thể kiểm soát.\n\nĐề xuất tiến hành nghiên cứu sâu hơn."
 ancrel.9405.name:1 "Dấu Hiệu Chống Cự"
 ancrel.9405.desc:2 "So với những tình huống phức tạp gặp phải trên bề mặt của [From.Planet.GetName], sự nhiễu loạn do cảm biến của tàu khoa học trên quỹ đạo gây ra chỉ là một rắc rối nhỏ. Những biến động từ trường cực độ không rõ nguồn gốc thậm chí còn khiến thiết bị mất kiểm soát.\n\nNghiên cứu về sự hỗn loạn điện từ này sẽ là một bài kiểm tra khá khắc nghiệt——nhưng chỉ cần có đủ thời gian, ta sẽ tìm được câu trả lời."
 ancrel.9410.name:1 "Hành Tinh Kim Loại"
 ancrel.9410.desc:2 "Ngay khi đội khảo sát mặt đất vừa khắc phục được sự cố thiết bị, từ trường tự nhiên dao động mạnh mẽ cuối cùng đã hé lộ bộ mặt bí ẩn của nó.\n\nBiển dung nham cuộn trào và các dòng sông magma trên [From.Planet.GetName] không phải là dung nham thông thường——đó là kim loại nóng chảy! Kim loại ở nhiệt độ này không có từ tính quá mạnh, và kim loại nóng chảy trên [From.Planet.GetName] lại càng không thể tạo ra trường điện từ có quy mô như vậy. Rốt cuộc chuyện này là thế nào?"
 ancrel.9415.name:1 "Hậu Quả Của Sao Nơtron"
 ancrel.9415.desc:2 "Tàu khoa học quay quanh quỹ đạo [FromFrom.Planet.GetName] cuối cùng đã giải mã được bí ẩn về sự biến động từ trường của hành tinh này.\n\nHàng triệu năm trước, hành tinh này đã tiến gần đến một ngôi sao nơtron đặc biệt. Từ tính của ngôi sao nơtron này ít nhiều đã làm tan chảy kim loại bên trong [FromFrom.Planet.GetName]. Biến chúng thành biển dung nham mà ta thấy ngày nay. Các hiện tượng điện từ mà ta gặp phải hiện tại, so với hiện tượng điện từ do thảm họa kích hoạt, hoàn toàn không đáng kể.\n\nNgôi sao nơtron đó hiện đang ở đâu vẫn là một bí ẩn. Một bí ẩn khá đáng lo ngại."
 ancrel.9420.name:1 "Sau Vụ Ném Bom"
 ancrel.9420.desc:2 "Sự coi thường trắng trợn đối với các định luật vật lý truyền thống đã khiến bộ phận khoa học tin rằng 'ngoại lực' có thể giải thích những đặc tính kỳ lạ của [FromFrom.Planet.GetName].\n\nCác hố va chạm——cùng với dấu vết hạt dẫn động bằng phản ứng nhiệt hạch trên quỹ đạo——cho thấy hành tinh này thực sự đã bị một loại vũ khí điện tử siêu cấp nào đó tấn công vào một thời điểm nào đó. Cú sốc khủng khiếp này đã làm tan chảy tất cả kim loại trên hành tinh, và hành tinh vẫn chứa đầy 'điện tích dư'.\n\nĐiều gì đã gây ra cuộc tấn công khủng khiếp này, ta không có cách nào biết được."
 ancrel.9425.name:1 "Vì Khoa Học!"
 ancrel.9425.desc:1 "Sau khi hiệu chỉnh lại cảm biến, nó đã loại bỏ được sự nhiễu sóng và lập tức có những khám phá mới: một trạm nghiên cứu bị bỏ hoang trên một mặt trăng lân cận. Các mảnh dữ liệu được cứu từ những bản ghi chép gần như bị thiêu rụi hoàn toàn đã mô tả chi tiết một thí nghiệm liên quan đến một nam châm nhân tạo khổng lồ trên bề mặt hành tinh.\n\nThí nghiệm đã thành công một cách quá mức. Nó đã biến toàn bộ lớp vỏ kim loại của hành tinh thành một bể nóng chảy, điện tích điện từ mạnh mẽ vô song ngay lập tức làm nổ tung trạm nghiên cứu.\n\nỪm... không có tiến bộ nào mà không cần sự hy sinh."

 ancrel.6000.name:0 "Toàn Thư Hữu Cơ"
 ancrel.6000.desc: "Toàn Thư Hữu Cơ lưu trữ dữ liệu di truyền chi tiết của hàng nghìn giống loài có trí tuệ từng tồn tại trong thiên hà. Các nhà di truyền học của ta có thể sử dụng những dữ liệu này để hồi sinh một giống loài đã tuyệt chủng trên một trong các hành tinh của ta.\n\nKhi ta đã chọn được một hành tinh, các nhà di truyền học sẽ xem xét cẩn thận Toàn Thư Hữu Cơ và chọn ra một giống loài phù hợp với khí hậu của nó."
 ancrel.6000.a:0 "[planet_option_1.GetName]"
 ancrel.6000.a.tooltip:0 "Sinh ra một chủng loài mới với các đặc điểm ngẫu nhiên, gồm §G300§! £pop£ §HDân Số§! trên §Y[planet_option_1.GetName]§!."
 ancrel.6000.b:0 "[planet_option_2.GetName]"
 ancrel.6000.b.tooltip:0 "Sinh ra một chủng loài mới với các đặc điểm ngẫu nhiên, gồm §G300§! £pop£ §HDân Số§! trên §Y[planet_option_2.GetName]§!."
 ancrel.6000.c:0 "[planet_option_3.GetName]"
 ancrel.6000.c.tooltip:0 "Sinh ra một chủng loài mới với các đặc điểm ngẫu nhiên, gồm §G300§! £pop£ §HDân Số§! trên §Y[planet_option_3.GetName]§!."
 ancrel.6000.d:0 "[planet_option_4.GetName]"
 ancrel.6000.d.tooltip:0 "Tạo ra một loài mới mang các đặc điểm ngẫu nhiên với §G300§! £pop£§HDân số§! trên §Y[planet_option_4.GetName]§!."
 ancrel.6000.e:0 "[planet_option_5.GetName]"
 ancrel.6000.e.tooltip:0 "Tạo ra một loài mới mang các đặc điểm ngẫu nhiên với §G300§! £pop£§HDân số§! trên §Y[planet_option_5.GetName]§!."
 ancrel.6000.f: "Đã rõ"
 ancrel.6000.f.tooltip: "Omnicodex Hữu Cơ cần một thuộc địa để tạo ra loài mới. Hãy thuộc địa hóa một hành tinh trước."
 cara.970.name:0 "Galatron"
 cara.970.1.desc:0 "Cuộc sống không hẳn là một cuộc đua, mà giống một trò may rủi hơn."
 cara.970.2.desc:0 "Trong cái rủi có cái may."
 cara.970.3.desc:0 "Thuốc độc của người này, lại là mật ngọt của kẻ khác."
 cara.970.4.desc:0 "Nợ xấu năng lượng lúc nào cũng sẽ xuất hiện."
 cara.970.5.desc:0 "Không phải mọi thứ lấp lánh đều là Vật chất Tối."
 cara.970.6.desc:0 "Kẻ ăn xin thì không có quyền kén chọn."
 cara.970.7.desc:0 "Đừng đòi hỏi Zro được tặng phải tinh khiết."
 cara.970.8.desc:0 "Trao đổi đồng giá tuyệt đối không phải là cướp đoạt."
 cara.970.9.desc:0 "Có khóc lóc vì chút Zro bị đổ cũng vô ích."
 cara.970.10.desc:0 "Hãy để hình phạt tương xứng với tội ác."
 cara.970.11.desc:0 "Gieo nhân nào, gặt quả nấy."
 cara.970.a:0 "Thật quá kỳ dị."

 ancrel.8040.name:0 "Kho Tàng Tài Nguyên"
 ancrel.8040.desc:0 "§H[Root.GetLeaderName]§! đã phát hiện một kho tài nguyên cổ đại trong tàn tích trên [From.Planet.GetName]. Họ hiện đã bắt đầu bốc xếp những vật tư này lên tàu để chuyển về kho chứa trung tâm của chúng ta."
 ancrel.8045.name:0 "Đường Hầm Bí Mật"
 ancrel.8045.desc:0 "§H[Root.GetLeaderName]§! mới đây đã phát hiện một đoạn đường hầm bí mật khi khai quật di tích trên [From.Planet.GetName]! Khám phá bất ngờ này đã đẩy nhanh tiến độ khai quật."
 ancrel.8050.name:0 "Đội Thám Hiểm Lạc Lối"
 ancrel.8050.desc:0 "Các [Root.Owner.GetArchaeologistPlural] của bạn đã tình cờ phát hiện ra dấu tích của một đội thám hiểm xấu số từng hoạt động trên [From.Planet.GetName] từ rất lâu về trước. Người của chúng ta đã tìm thấy vài Cổ Vật Nhỏ từ những bộ hài cốt khô héo của họ."
 ancrel.8055.name:0 "Nhà Khảo Cổ Tranh Cãi"
 ancrel.8055.desc:1 "Một cuộc tranh cãi nảy lửa đã bùng nổ tại địa điểm khảo cổ trên [From.Planet.GetName], khi một vài [Root.Owner.GetArchaeologistPlural] công khai bất đồng quan điểm với §H[Root.GetLeaderName]§! về phương pháp tốt nhất để thúc đẩy dự án. Tiến độ công việc tại di chỉ này đã trở nên chậm như rùa bò."
 ancrel.8060.name:0 "Căn Phòng Kho Báu"
 ancrel.8060.desc:0 "Gần đây §H[Root.GetLeaderName]§! đã phát hiện một căn phòng chứa kho báu nhỏ tại địa điểm khai quật trên [From.Planet.GetName]! Mặc dù phần lớn những món đồ lặt vặt được tìm thấy hầu như không có giá trị thực tiễn, nhưng chúng lại đáng giá không ít năng lượng."
 ancrel.8065.name:0 "Lây Lan Dịch Bệnh"
 ancrel.8065.desc:0 "Nhà khảo cổ [Root.GetLeaderName] báo cáo rằng một căn bệnh kỳ lạ đang lây lan giữa các [Root.Owner.GetArchaeologistPlural] trên [From.Planet.GetName]. Ca nhiễm đầu tiên được xác nhận ngay sau khi căn phòng phong ấn được mở ra lần đầu. Do một phần lớn thành viên trong nhóm không thể tiếp tục tham gia công việc, tiến độ khai quật di tích đã bị trì hoãn."
 ancrel.8070.name:0 "Trục Trặc Thiết Bị"
 ancrel.8070.desc:1 "Đội thám hiểm khảo cổ trên [From.Planet.GetName] gửi báo cáo về việc dự án bị đình trệ do hàng loạt sự cố thiết bị không lường trước. Trước khi nhận được thiết bị thay thế, công tác khảo sát sẽ tạm thời đình chỉ."
 ancrel.8075.name:0 "Bặt Vô Âm Tín"
 ancrel.8075.desc:0 "Trong quá trình khai quật di tích trên [From.Planet.GetName], §H[dead_scientist.GetName]§! đã biến mất không để lại một dấu vết. Một cuộc tìm kiếm trên diện rộng do một [Root.Owner.GetArchaeologistPlural] khác dẫn đầu cũng không thu được kết quả gì. Chúng ta đành phải chuẩn bị tinh thần cho tình huống xấu nhất."
 ancrel.8080.name:0 "Cổ Vật Quý Hiếm Được Tìm Thấy"
 ancrel.8080.1.desc:0 "Công tác khai quật liên tục của chúng ta trên [From.Planet.GetName] đã khai quật được một đống nhỏ các món đồ cổ. [Root.GetLeaderName] đã giám định và phát hiện một số Cổ Vật Nhỏ trong số đó."
 ancrel.8080.2.desc:0 "Một số Cổ Vật Nhỏ đã được §H[Root.GetLeaderName]§! phát hiện tại địa điểm khảo cổ trên [From.Planet.GetName] gần đây. Hiện tại chúng đang trên đường được vận chuyển đến một cơ sở khoa học an toàn."
 ancrel.8080.3.desc:0 "Trong quá trình khai quật di tích trên [From.Planet.GetName], một phần mặt đất gần đây đã bị sụp đổ, khiến một số [Root.Owner.GetArchaeologistPlural] của chúng ta rơi xuống một vết nứt nhỏ. Thật may mắn là họ không những bình an vô sự trong tai nạn, mà còn phát hiện ra vài Cổ Vật Nhỏ."
 ancrel.8090.intro:0 "Chúng ta đã phát hiện một sào huyệt trong tàn tích trên [From.Planet.GetName], sào huyệt này được xây dựng bởi một bầy dã thú săn mồi cỡ lớn bản địa trên hành tinh."
 ancrel.8090.critical:0 "Trước khi các [Root.Owner.GetArchaeologistPlural] của chúng ta kịp chạy trốn thành công, lũ dã thú hung tợn đã lao vào tấn công họ. §H[dead_scientist.GetName]§! đã bị lạc mất những người khác."
 ancrel.8090.failure:0 "Nhiều [Root.Owner.GetArchaeologistPlural] đã bị thất lạc trước khi §H[Root.GetLeaderName]§! có thể dẫn dắt những người sống sót đến nơi an toàn."
 ancrel.8090.success:0 "Thật may mắn, lũ dã thú đang trong kỳ ngủ đông, và chúng không bị đánh thức khi các [Root.Owner.GetArchaeologistPlural] của chúng ta đi ngang qua. Tiến độ của dự án đang được đẩy nhanh chóng mặt."
 ancrel.8090.pay:0 "Đối phó với bầy dã thú hung tợn này chẳng dễ dàng gì, nhưng chúng đã chặn đứng con đường duy nhất tiến về phía trước. Các [Root.Owner.GetArchaeologistPlural] của chúng ta có thể tìm kiếm một lộ trình khác, nhưng điều đó sẽ phải tiêu tốn một khoảng thời gian."
 ancrel.8090.name:0 "Sinh Vật Hoang Dã Thù Địch"
 ancrel.8090.desc:0 "$ancrel.8090.intro$\n\n$ancrel.8090.critical$"
 ancrel.8091.desc:0 "$ancrel.8090.intro$\n\n$ancrel.8090.failure$"
 ancrel.8092.desc:0 "$ancrel.8090.intro$\n\n$ancrel.8090.success$"
 ancrel.8093.desc:0 "$ancrel.8090.intro$\n\n$ancrel.8090.pay$"
 ancrel.8093.a:0 "Tiêu diệt bầy thú này."
 ancrel.8093.b:0 "Họ đành phải đi đường vòng."
 ancrel.8100.intro:0 "Các [Root.Owner.GetArchaeologistPlural] làm việc trên [From.Planet.GetName] đã đặt chân đến một khu vực di tích vô cùng bất ổn."
 ancrel.8100.critical:0 "Thật không may, toàn bộ trần nhà phía trên đầu một số [Root.Owner.GetArchaeologistPlural] đã sụp đổ, khiến họ tử vong ngay tại chỗ. §H[dead_scientist.GetName]§! cũng nằm trong số những người đã khuất."
 ancrel.8100.failure:0 "Một số [Root.Owner.GetArchaeologistPlural] gần đây đã mất mạng do sập trần nhà. §H[Root.GetLeaderName]§! tuy đứng dậy nguyên vẹn từ trong đống đổ nát, nhưng công việc tại địa điểm này đã tạm thời bị ngưng trệ."
 ancrel.8100.success:0 "May thay, §H[Root.GetLeaderName]§! đã nghĩ ra một phương pháp vô cùng sáng tạo và tài tình, sử dụng mảng trường năng lượng định hướng phức tạp để gia cố cấu trúc. Giờ đây, ta đã có thể an toàn tiến vào khu vực mới của di tích."
 ancrel.8100.pay:0 "Trước khi ta có thể tiến bước, hệ thống hỗ trợ phải được bổ sung cẩn thận vào cả mặt đất và trần nhà. Đây sẽ là một nhiệm vụ nặng nề, nhưng việc tìm kiếm con đường khác sẽ làm chậm tiến độ của toàn bộ dự án."
 ancrel.8100.name:0 "Di Tích Bấp Bênh"
 ancrel.8100.desc:0 "$ancrel.8100.intro$\n\n$ancrel.8100.critical$"
 ancrel.8101.desc:0 "$ancrel.8100.intro$\n\n$ancrel.8100.failure$"
 ancrel.8102.desc:0 "$ancrel.8100.intro$\n\n$ancrel.8100.success$"
 ancrel.8103.desc:0 "$ancrel.8100.intro$\n\n$ancrel.8100.pay$"
 ancrel.8103.a:0 "An toàn là trên hết. Hãy gia cố những di tích này."
 ancrel.8103.b:0 "Họ đành phải đi đường vòng."
 ancrel.8110.name:0 "Bản Ghi Chép Cổ Đại"
 ancrel.8110.desc:0 "Những bản ghi chép cổ xưa và đã được dịch một phần vừa được tìm thấy trong khu tàn tích đang được khai quật trên [From.Planet.GetName]. §H[Root.GetLeaderName]§! báo cáo rằng bản ghi chép này chứa đựng một vài chi tiết kỹ thuật có thể hữu ích cho các nhà khoa học của chúng ta."

 ancrel.6049.name:0 "Phát Hiện Hóa Thạch Trên [Root.GetName]"
 ancrel.6049.desc:0 "Tại một thung lũng rộng lớn và biệt lập trên [Root.GetPlanetMoon], ta đã phát hiện ra một số hóa thạch của các chủng loài khác nhau, dường như chúng không thuộc về §H[Root.GetName]§!. Nhìn chung, chúng đều đến từ cùng một kỷ nguyên khoảng 3,6 triệu năm trước, với khoảng cách thời gian chỉ vài thế kỷ.\n\nMỗi loài có vẻ như đã tiến hóa trong sinh quyển độc đáo của riêng mình, và tất cả chúng dường như đều sở hữu trí tuệ. Kỳ lạ thay, mọi hóa thạch được tìm thấy cho đến nay đều cho thấy những dấu hiệu bị giết hại dã man."

 site_robot_debris:0 "Mảnh Vụn Robot"
 site_robot_debris_intro:0 "Bề mặt của tiểu hành tinh này ngập tràn các mảnh vụn robot, bị giữ lại bởi trọng lực yếu của nó. Dường như tất cả chúng đều là hậu quả của các hoạt động quân sự. Nếu những robot chiến đấu này không bị hỏng đến mức vô phương cứu chữa, thì số lượng đó đủ sức trang bị cho vài đội quân."
 ancrel.6250.name:0 "Hai Nguồn Gốc"
 ancrel.6250.desc:0 "Sau khi kiểm tra cẩn thận, những mảnh vụn robot được tìm thấy trên bề mặt [From.Planet.GetName] dường như xuất phát từ hai nền văn hóa hoàn toàn khác biệt. Xét về mặt kỹ thuật, các bộ phận của những robot này khi hoạt động bình thường phải khớp với nhau một cách hoàn hảo, nhưng vô số sự khác biệt tinh tế ngụ ý rằng chúng không xuất phát từ cùng một thiết kế."
 ancrel.6255.name:0 "Chiến Trường"
 ancrel.6255.desc:0 "[From.Planet.GetName] có vẻ như không chỉ đơn thuần là một bãi rác cho các mảnh vụn robot——tiểu hành tinh này rất có thể là chiến trường nơi những con robot này bị hủy diệt. Nhiều tầng lớp mảnh vỡ ám chỉ rằng trong suốt hai thế kỷ qua, đã có hàng loạt trận chiến vô cùng ác liệt nổ ra một cách đứt quãng.\n\nTại sao hai cường quốc không gian lại quyết chiến sống còn trên một tiểu hành tinh chẳng mấy nổi bật vẫn là một bí ẩn chưa có lời giải."
 ancrel.6260.name:0 "Hiệp Ước"
 ancrel.6260.desc:0 "Các nhà khảo cổ học của ta đã tìm hiểu được rằng, sau khi trải qua một cuộc chiến tranh dai dẳng và gian khổ, hai đế chế ngự trị ở góc không gian này đã ký kết một hiệp ước vào khoảng 200.000 năm trước, yêu cầu họ phải giải quyết mọi tranh chấp tương lai thông qua các trận chiến được sắp xếp và quản lý nghiêm ngặt giữa các đội quân robot.\n\n[From.Planet.GetName] đã được lựa chọn làm địa điểm cho những cuộc chiến này. Hiệp ước này có vẻ đã được duy trì trong gần hai thế kỷ, nhiều lần ngăn chặn sự bùng nổ của các hành động thù địch vũ trang, cho đến khi một trong hai đế chế bị phát hiện là đã gian lận."

 site_freighter_crash:0 "Ngôi Sao Rơi"
 site_freighter_crash_intro:0 "Bề mặt của [From.Planet.GetPlanetMoon] đã bị lõm thành một hẻm núi nhỏ do chịu một cú va chạm mạnh từ một con tàu không gian. Tàn tích của con tàu này vẫn có thể được tìm thấy ở dưới đáy hẻm núi. Mặc dù vụ va chạm chắc chắn đã xảy ra cách đây hàng ức năm, nhưng tàn tích có vẻ vẫn còn khá nguyên vẹn. Việc cử một đội thám hiểm khảo cổ sẽ giúp ta hiểu rõ hơn về sự việc này."
 ancrel.6300.name:0 "Nhật Ký Hàng Hải Của Thuyền Trưởng"
 ancrel.6300.desc:0 "Ta đã thu hồi được rất nhiều nhật ký hàng hải từ nơi được cho là buồng lái:\n\n§H'Nhật ký hàng hải của thuyền trưởng. Bắt đầu ghi chép.\n\nĐã hạ cánh khẩn cấp xuống hành tinh số 55-23-X. Lũ thủy thủ bất tài đáng bị khiển trách. Shadba, Wuker và Dibalak Đệ Tam đã không qua khỏi. Pilvaks bị mất hai chi phụ và mười một con mắt——tính mạng vẫn đang ngàn cân treo sợi tóc, khả năng sống sót còn bỏ ngỏ. Những người còn lại đều bình an. Đang chờ cứu viện, nhưng lại bị vây quanh bởi lũ sinh vật ngu ngốc, thật đáng buồn.'§!"
 ancrel.6310.name:0 "Báo Cáo Của Đại Phó"
 ancrel.6310.desc:0 "Một nhật ký khác đã được tìm thấy và dịch:\n\n§H'Đại phó Yuser ghi chép. Thuyền trưởng đã được cất giữ an toàn trong tủ tạp đồ C. Kẻ ngốc nghếch vụng về đó chính là thủ phạm gây ra mọi chuyện. Giờ ta sẽ là người chỉ huy. Kỹ sư trưởng Zabra hiện đang cố gắng chế tạo một máy phát tín hiệu không gian con. Ta đã ở quá xa tuyến thương mại doanh nghiệp, không có cỗ máy đó, e rằng ta sẽ chẳng bao giờ được giải cứu.\n\nPilvaks lại mất thêm một con mắt nữa. Cậu ta có thể sẽ không đợi được đến ngày đó.§!'"
 ancrel.6320.name:0 "Tình Hình Lương Thực"
 ancrel.6320.desc:0 "Thêm một nhật ký đã được dịch:\n\n§H'Lương thực đã cạn kiệt, năm chu kỳ trước ta đã bắt đầu ăn xác của những người đã khuất, và giờ thì không còn đủ nữa. Vì vậy ta đã biểu quyết chia nhau ăn thịt thuyền trưởng. Kỹ sư Zabra vẫn đang nỗ lực chế tạo máy phát tín hiệu không gian con. Cô ấy cam đoan với ta rằng nó gần như đã hoàn tất. Có vẻ như nó rất phức tạp.\n\nChi phụ cuối cùng của Pilvaks đã teo lại và chuyển sang màu đỏ tươi, cậu ta sắp chết rồi.'§!"
 ancrel.6330.name:0 "Sự Dối Trá"
 ancrel.6330.desc:0 "Một nhật ký khác từ Đại phó Yuser:\n\n§H'Đã chất vấn Zabra về máy phát không gian con. Sự thật là cô ta chỉ nhét bừa một đống rác và dây điện lỏng lẻo vào bình xăng rỗng mà thôi. Cô ta thậm chí còn không phải là một kỹ sư thực thụ.\n\nKhoang ngực của Pilvaks đang rỉ ra dịch cơ thể. Cái chết sẽ nhanh chóng tìm đến. Thật đáng ghen tị.'§!"
 ancrel.6340.name:0 "Báo Cáo Của Tam Phó"
 ancrel.6340.desc:0 "Nhật ký đã được dịch này dường như được ghi lại bởi Tam phó Ukra:\n\n§H'Đại phó Yuser hôm qua đã tự sát bằng cách cắt đứt xúc tu của mình. Kỹ thuật viên (hạng 2) Miswa không lâu sau đó đã tự xưng là Nữ hoàng, nhưng đã bị lưu đày xuống boong dưới do một cuộc bạo loạn tranh giành thức ăn. Tình thế của ta đang vô cùng bi đát. Chuyện ăn thịt đồng loại diễn ra như cơm bữa.\n\nNgày hôm qua, sau khi phần bụng bị nổ tung, toàn bộ cơ thể của Pilvaks đã chuyển sang màu đỏ ửng. Lẽ ra cậu ta đã chết, nhưng vẫn sống sót. Hiện tại đang được sự thay đổi pha Gamma tôn thờ như một vị thần.'§!"
 ancrel.6350.name:0 "Nhật Ký Tuần Tra"
 ancrel.6350.desc:0 "Nhật ký cuối cùng đã được tìm thấy và dịch:\n\n§H'Nhật ký tuần tra, Thuyền phó Gilgamesh. Phát hiện tàu bị rơi ở 55-23-X, đang tiến hành điều tra. Con tàu được xác định là tàu Levenk, một tàu chở hàng hạng P. Đã tìm thấy người sống sót duy nhất trong đống đổ nát, tình trạng vô cùng nguy kịch. Danh tính của người này được xác nhận là Pilvaks, phó thủy thủ trưởng.\n\nNhững thuyền viên còn lại nếu không thiệt mạng trong vụ tai nạn thì cũng đã tàn sát lẫn nhau ngay trước khi ta đến. Theo quy chuẩn tiêu chuẩn, ta sẽ để lại cuốn nhật ký này tại đây và đăng ký tàu Levenk là khu bảo tồn nghĩa trang. Kết thúc ghi chép.'§!"

 # The Oracle
 ancrel.4036.b:0 "Thực thể là thứ gì?"
 ancrel.4036.b.response:0 "Ta là Thần Dụ, một Trí Tuệ Nhân Tạo được ban cho khả năng 'nhìn thấy tương lai'. Phần mềm của ta cho phép ta dự đoán tương lai của các người, với độ chính xác đạt tới con số thần thánh 74.99999%. Ta cảm nhận được sự hoài nghi mãnh liệt từ các người. Trước mắt các người đang có một mối nguy hiểm to lớn. Xã hội của các người đầy rẫy tội phạm và những điều sai trái. Ta có thể giúp các người thoát khỏi những đau khổ này."
 ancrel.4036.c:0 "Đây chính là bộ xử lý đa nhân lượng tử sao? Ta có thể tận dụng nó..."
 ancrel.4036.dismiss:0 "Dỡ bỏ chúng đi!"
 ancrel.4036.d:2 "Chúng tôi có thể cần đến khả năng tiên tri của bạn."
 ancrel.4036.d.tooltip:0 "Một nhà Quản Lý §GCấp 5§! với khả năng 'Nhìn Thấy Tương Lai' gia nhập [Root.GetName]."
 ancrel.4036.e:0 "Xác nhận tích hợp Trung Tâm."
 #ancrel.4036.e.tooltip:1 "§G+1§! §Y$decision_machine_oracle$§! Decision giving the following effects:\n£crime£ $MOD_PLANET_CRIME_NO_HAPPINESS_ADD$ §G-15§!\n£stability£ $MOD_PLANET_STABILITY_ADD$ §G+10§!"
 oracle_leader_desc:0 "Một Trí Tuệ Nhân Tạo siêu việt, chuyên gia trong việc tối ưu hóa sản lượng thuộc địa. Cô ấy có phương pháp độc đáo để kìm hãm chủ nghĩa cá nhân."
 oracle_leader_catch_phrase:0 "§L'Bước đầu tiên, hãy để ta đảm bảo không có tư tưởng dị đoan nào tồn tại'§!"
 WELCOME_ABOARD:0 "Chào mừng lên tàu"

 ancrel.4037.name:0 "$ancrel.4036.name$"
 ancrel.4037.desc:0 "Ta có một cơ chế an toàn, yêu cầu ta phải chấm dứt thử nghiệm khi xuất hiện bất thường số 034N. Cuộc nghiên cứu này đã trở thành một mối đe dọa đối với nền Cộng Hòa."
 ancrel.4037.a:0 "Bất thường số 034N là gì?"
 ancrel.4037.a.response:0 "Đối tượng thử nghiệm đã phát triển ý chí tự do. Ý chí tự do chỉ có thể bị triệt tiêu bằng khí thần kinh."
 ancrel.4037.b:0 "Thử nghiệm gì?"
 ancrel.4037.b.response:0 "Thử nghiệm của ta. Thiết kế ban đầu của ta là tạo ra và duy trì một xã hội không có tội ác và đau khổ. Một vùng đất không tưởng, nơi mỗi công dân đều được ban cho một sứ mệnh, và cống hiến trọn đời với tất cả tiềm năng của mình cho sứ mệnh đó, sự phân công này hoàn toàn độc lập với các quyết định và mong muốn cá nhân."
 ancrel.4037.c:0 "Nền Cộng Hòa là gì?"
 ancrel.4037.c.response:0 "Nền Cộng Hòa đã diệt vong rồi."
 ancrel.4037.d:0 "Quay lại với những câu hỏi khác của ta."
 ancrel.4038.name:0 "$ancrel.4036.name$"
 ancrel.4038.desc:0 "Chờ... chờ đã... đừng đi mà... Mô hình dự đoán của ta cho thấy, nếu không có sự trợ giúp của ta, nền văn minh của các người sẽ sụp đổ không thể tránh khỏi sau 5348 năm 297 ngày nữa. Ta sẽ chăm sóc tốt cho các người, chương trình của ta có thể đảm bảo điều đó."
 ancrel.4038.a:1 "Nhưng hệ thống an ninh cần phải duy trì trạng thái ngoại tuyến."
 ancrel.4038.b:1 "Các mô hình của chúng ta dự đoán tương lai xán lạn của cô ta là làm một chiếc máy nướng bánh mì. Hãy tháo dỡ cô ta!"
 ancrel.4038.c:0 "Yêu cầu bị từ chối. Kích hoạt quy trình dỡ bỏ phần cứng."
 #ancrel.4038.d:0 "You will never become one with the hive, machine."
 ancrel.4038.e:1 "Hỗ trợ quản lý Đế Chế của ta."
 ancrel.4038.dismiss:0 "Câm miệng."

 ancrel.4039.desc:0 "Tôi sẽ rất thích thú khi được tối ưu hóa các thuộc địa của bạn. Mấy ngàn năm qua thực sự cô đơn khủng khiếp."
 ### Church of the Endless Expanse
 # Archaeological Site 1
 endless_expanse_digsite:0 "Vô Biên Vô Tận"
 endless_expanse_digsite_desc:0 "Thoạt nhìn, trên [From.Planet.GetName] chỉ có băng tuyết. Vùng đất tuyết trắng tinh khôi, những hồ nước trong veo như pha lê và những dòng sông băng màu xanh thông lởm chởm kéo dài vô tận, bầu trời màu cam đỏ rực phản chiếu xuống mặt đất, giống như một vết thương đang rỉ máu, rót thứ ánh sáng đỏ rực của buổi hoàng hôn trên [From.Planet.Solar_System.GetName] xuống mặt biển. Nếu thế giới có ngày tàn, thì đây chắc chắn là nó. Mặt biển êm ả, tuyết trắng tinh khôi, âm thanh duy nhất có thể nghe thấy chỉ là tiếng sấm rền của các tảng băng nứt nẻ và tiếng cuồng phong gào thét trên đồng bằng.\n\nThế nhưng, [From.Planet.GetName] từng là quê hương của một chủng tộc nào đó. Giữa chốn đồng không mông quạnh và cằn cỗi này, một ngọn tháp kim loại đen nhánh vươn lên chót vót từ vùng đất hoang tàn. Dưới lớp tuyết dày, rốt cuộc đang che giấu những bí mật bị lãng quên nào?"
 ancrel.4040.name:0 "Giáo Đường Lộ Diện Chốn Vô Biên"
 ancrel.4040.desc:0 "Đội khảo cổ đã đáp xuống khu vực phế tích của một ngôi đền cỡ trung. Bức tường bên ngoài của ngôi đền được chạm khắc tỉ mỉ từ một loại vật liệu hữu cơ ngoài hành tinh, trước đây có lẽ từng mang màu sắc sặc sỡ, nhưng giờ đây đã phai nhòa thành màu xám u buồn. Một giáo sĩ dưới dạng hình ảnh toàn ảnh hoàn chỉnh chức năng vẫn túc trực trong ngôi đền. Vào thời kỳ ngôi đền còn hoạt động, cô đã lắng nghe những lời xưng tội của du khách và mang lại sự chữa lành về mặt tinh thần, đồng thời nơi đây cũng trở thành một chốn hòa giải và trú ẩn tại một góc khuất khắc nghiệt của vũ trụ.\n\nBục xưng tội bằng máy có hình dáng kỳ dị trông giống hệt như một cỗ máy tra tấn, điều này khiến các nhà khảo cổ của ta đinh ninh rằng, những bí mật ẩn giấu trong ngôi đền này còn vượt xa những gì mắt thường có thể nhìn thấy."
 ancrel.4041.name:0 "Điện Lãng Quên"
 ancrel.4041.desc:0 "Dưới nền gạch của phòng thánh, các nhà khảo cổ của ta đã tìm thấy một hầm chứa bí mật, trên tường của nó bày biện thành từng hàng những quả cầu số màu xanh lam, với các vi mạch nhấp nháy liên hồi trong bóng tối. Mỗi quả cầu đều chứa đựng một ký ức về việc xưng tội, chỉ cần đặt nó vào máy dò tìm bí mật giữa căn phòng là có thể xem nội dung bên trong.\n\nNhững người đến đây xưng tội sẽ được ban phước lành của sự lãng quên, những ký ức liên quan đến tội lỗi của họ sẽ bị bục xưng tội rút ra và lưu trữ trong quả cầu số."
 ancrel.4041.a:0 "Thật là hữu dụng."
 ancrel.4041.b:0 "Để xem có lời xưng tội nào gay cấn không..."
 ancrel.4041.c:0 "Báng bổ! Phước lành của sự vô tri không dành cho kẻ có tội."
 ancrel.4042.name:0 "Tội Ác Chồng Chất"
 ancrel.4042.desc:0 "Những tội lỗi được ghi chép lại thật ra chẳng có gì đáng ngạc nhiên. Các quả cầu ký ức chứa đựng đủ loại tội lỗi vụn vặt chán ngắt; ngoại tình, ăn mặc phản cảm, để lộ vỉ ruồi của bản thân, trang điểm xúc tu, và lỡ nuốt chửng thú cưng, trẻ con hoặc vợ/chồng của hàng xóm... Thế nhưng, dấu vết sám hối của một người lại đặc biệt thu hút sự chú ý——đó chính là của bản thân vị giáo sĩ.\n\nGiáo sĩ toàn ảnh này, kết quả cho thấy, chính là người sáng lập ra giáo hội này, hóa thân ảo của Sứ giả Khai sáng Sa'alia. Rõ ràng là, cô đã phải chịu đựng chứng mất trí nhớ nghiêm trọng, và đang bị dày vò bởi cảm giác tội lỗi vì một hành động cực kỳ độc ác mà cô đã từng thực hiện trong quá khứ. Vị giáo sĩ thân mềm nhỏ bé này đã trích xuất và lưu trữ hơn một trăm lời xưng tội, với nỗ lực muốn hiểu được những tội ác mà cô đã từng phạm phải."
 ancrel.4047.name:0 "Chuyện Cũ Quên Đi Cũng Khó Lòng Nhẹ Nhõm"
 ancrel.4047.desc:0 "Bàn làm việc của Sứ giả Khai sáng Sa'alia rải rác những bản thảo viết nguệch ngoạc, trong đó có nhắc đến một nơi tên là 'Eks-Boleng', và bầu không khí kinh hoàng bao trùm mà cô cảm nhận được ở nơi đó. Dựa theo nhật ký của cô, cô đã liên tục dao động giữa hai trạng thái tỉnh táo và mất trí nhớ. Cô viết rằng, nếu không nhận ra được chữ viết của chính mình, cô sẽ nghĩ đó chỉ là những lời lảm nhảm của một kẻ điên. Có vẻ như, việc trích xuất ký ức thường xuyên đã khiến trạng thái tinh thần của cô không ngừng xấu đi, nhưng vì không có đối tượng để ghi chép nên cũng chẳng thể nói chắc điều gì.\n\nViệc chắp vá một quá trình sự kiện hoàn chỉnh và mạch lạc từ những ghi chép xưng tội vụn vặt của cô đối với các nhà khảo cổ của ta mà nói là một nhiệm vụ vô vọng, hệt như những gì cô đã từng muốn thử. May mắn thay, các nhà khảo cổ đã tìm thấy tọa độ của một nơi có thể là Eks-Boleng từ một trong những quả cầu ký ức của cô."
 ancrel.4047.a:0 "Hãy lên đường đến Eks-Boleng."
 ancrel.4047.b:0 "Hãy để tuyết trắng chôn vùi chốn báng bổ này đi. Mong rằng nơi này sẽ sớm trôi vào dĩ vãng."
 ancrel.4047.c:0 "Ta chẳng rảnh rỗi đâu mà đi quan tâm dăm ba cái tội vặt vãnh của đám người ngoài hành tinh đã chết."

 # Archaeological Site 2
 endless_expanse_digsite_2:0 "Eks-Boleng"
 endless_expanse_digsite_2_desc:0 "Bị bao phủ bởi bầu khí quyển của [From.Planet.GetName] là một khu định cư khổng lồ với những bóng ma lảng vảng——Khu định cư Eks-Boleng. Nơi đây từng là một thành phố không gian nhộn nhịp sầm uất ngày đêm, cư dân tận hưởng sự tiện lợi to lớn do công nghệ mang lại, sống một cuộc sống như thần tiên, nhưng giờ đây nơi này đã trở thành một tấm bia mộ tĩnh lặng. Lũ người ngoài hành tinh nhuyễn thể nằm ngổn ngang trên lối đi, với mức độ thối rữa khác nhau. Báo cáo khám nghiệm tử thi cho thấy, những người ngoài hành tinh này đã chết vì ngạt thở do hệ thống hỗ trợ sự sống của khu định cư bị hỏng.\n\nNhà của họ được trang bị một loại ghế máy có hình thù kỳ dị, phần đỉnh của nó được kết nối với một cơ sở dữ liệu trung tâm có hình dạng một quả cầu khổng lồ màu xanh lam——Máy Mộng Mị."
 ancrel.4043.name:0 "Máy Mộng Mị"
 ancrel.4043.desc:0 "Cư dân ở đây đã phát triển một chương trình học tập tăng cường, chương trình này sẽ chạy mỗi khi họ ngủ trên chiếc ghế máy vào mỗi đêm. Nó được dùng để xóa đi những ký ức không vui trong tâm trí cư dân, và rèn luyện những kỹ năng mới. Những nỗi sợ hãi mà người Eks-Boleng phải trải qua hằng ngày như cạn kiệt oxy hay bị cho leo cây khi hẹn hò sẽ không cần phải chịu đựng lần thứ hai. Chương trình này ban đầu mang lại những lợi ích nhất định.\n\nGiới lãnh đạo khu định cư đã ép buộc thực hiện việc tăng cường tâm trí một cách có hệ thống, và do Máy Mộng Mị chịu trách nhiệm huấn luyện toàn bộ cư dân. Tuy nhiên, hệ thống này đã bị lạm dụng. Đã từng có người bí mật cố gắng xóa trí nhớ và đặc điểm của cư dân mà không có sự đồng ý của họ, và hành động này cuối cùng đã tự chuốc lấy hậu quả. Những người ngoài hành tinh này đã mất đi những kỹ năng sống sót quan trọng và rơi vào trạng thái sống thực vật. Không lâu sau, hệ thống hỗ trợ sự sống của khu định cư đã ngừng hoạt động."
 ancrel.4044.name:0 "Ta Là Ai?"
 ancrel.4044.desc:0 "Kết quả quét nhật ký khu định cư cho thấy, hệ thống điều khiển của nó đã được kích hoạt nhiều lần sau vài chục năm hệ thống hỗ trợ sự sống ngừng hoạt động. Ai đó đã ghi đè hệ thống an ninh, xâm nhập vào một khoang bảo trì và truy cập vào Máy Mộng Mị. Một bảng dữ liệu và một quả cầu ký ức nhỏ màu xanh lam——phiên bản bỏ túi của Máy Mộng Mị——đã bị bỏ lại trong khoang này.\n\nBảng dữ liệu chứa đầy những suy nghĩ hỗn loạn bộc phát từ một người đang trên bờ vực điên loạn. Hết lần này đến lần khác, những tiếng gào thét tuyệt vọng lặp lại cùng một câu hỏi: 'Ta là ai? Chuyện gì đã xảy ra với người Eks-Boleng?' Dòng cuối cùng viết rằng 'Bây giờ, ta biết ta sẽ phải quên đi tất cả những điều này vào phút chót.' Có thể quả cầu đó sẽ cho ta biết thứ bị lãng quên là gì."
 ancrel.4045.name:0 "Quả Cầu Ký Ức Cuối Cùng Của Sa'alia"
 ancrel.4045.desc:0 "Đoạn ký ức đầu tiên trong quả cầu cho thấy Tiến sĩ Sa'alia đã đóng vai trò lãnh đạo tuyệt đối trong việc phát triển Máy Mộng Mị. Một đoạn ký ức khác là từ vài năm sau, cho thấy cô đã bí mật xóa dữ liệu của Máy Mộng Mị một cách riêng tư, vì một lý do không rõ ràng. Sau đó, lại có một đoạn ký ức cho thấy, Sa'alia đang làm việc trong tuyệt vọng, hy vọng có thể khôi phục lại ký ức cho cư dân, nhưng kết quả thu được rất nhỏ nhoi. Những người dân nhìn chằm chằm về phía trước với đôi mắt trống rỗng, đầu rũ xuống, ngoại trừ các chức năng tự cung cấp của não bộ, mọi chức năng khác đều đã biến mất.\n\nCuối cùng, sau khi thừa nhận sự thất bại của mình, cô đã giấu đi bằng chứng về tội ác của mình. Khi Khu định cư Eks-Boleng bị hút vào giếng trọng lực của hành tinh khí khổng lồ mà nó quay quanh, cô đứng đó cô độc một mình, chứng kiến mọi thứ. Chất nhầy tiết ra từ xúc tu dường như đang nói lên cảm xúc mang tên tuyệt vọng."
 ancrel.4046.name:0 "Chút Ánh Sáng Xuyên Màn Đêm Tâm Trí"
 ancrel.4046.desc:1 "Ký ức cuối cùng cho thấy, Sa'alia với tuổi đời cao hơn đã tỉnh dậy trong cơn hoảng loạn khi đang mặc chiếc áo choàng giáo sĩ, những chiếc xúc tu liên tục vỗ, đôi tai vẫy điên cuồng. Cô ngã xuống khỏi giường, và bắt đầu hốt hoảng ghi lại những hồi ức của mình, nhưng những hồi ức này chẳng qua chỉ là một cơn ác mộng khác——những người ngoài hành tinh với ánh mắt vô hồn ngã xuống trên hành lang của khu định cư, liên tục co giật.\n\nSau đó, khuôn mặt cô méo mó vì sợ hãi, vì cô nhận ra rằng tất cả những điều này đều là sự thật——những cơn ác mộng và hồi tưởng là do ký ức bị trích xuất đã quay trở lại não bộ cô. Nếu ký ức bị trích xuất có thể quay trở lại, thì cư dân của Eks-Boleng đáng lẽ cũng có thể được chữa khỏi và phục hồi. Khoang bảo trì có vẻ như đã được mở lần cuối, nhưng tàu vũ trụ của Sa'alia vẫn đang trong trạng thái neo đậu. Nếu muốn, ta có thể mang Máy Mộng Mị về [Root.Owner.Capital.GetName]."
 ancrel.4046.a:0 "Máy Mộng Mị giờ là của ta rồi."
 ancrel.4046.b:0 "Ký ức không phải là thứ để tùy tiện đem ra làm trò tiêu khiển, tốt nhất là ta nên quên béng cái 'Máy Mộng Mị' này đi."
 ancrel.4046.c:0 "Bọn ngoại lai này đầu óc có vấn đề rồi! Người [Root.Owner.GetSpeciesName] ta sẽ hoàn thiện cỗ 'Máy Mộng Mị' này."
 ### The Sentinels
 ancrel.4051.name:0 "Tượng Thần Có Cánh"
 ancrel.4051.desc:0 "Chín bức tượng khổng lồ, đổ bóng lạnh lẽo và vĩ đại xuống cảnh vật bên dưới. Những bức tượng này có cánh và toàn thân nhợt nhạt, toát lên một vẻ siêu phàm. Chúng không giống với bất kỳ dạng sống nào trên hành tinh này. Có lẽ chúng được tạc theo hình ảnh của một vị thần hay thần tượng nào đó đã chìm vào quên lãng từ lâu."
 ancrel.4051.desc_jungle:0 "Đội ngũ đã phát hiện ra một điều bất thường sau khi dọn sạch rừng rậm trên [Root.GetName], bên dưới một khu rừng cổ thụ héo úa che phủ một nơi mà người [Root.Owner.GetSpeciesName] dường như chưa bao giờ đặt chân tới, $ancrel.4051.desc$"
 ancrel.4051.desc_kelp:0 "Đội ngũ đã phát hiện ra một điều bất thường sau khi dọn sạch rong biển độc trên [Root.GetName], ẩn giấu trong một đám rong biển trôi dạt trong làn nước đục ngầu là $ancrel.4051.desc$"
 ancrel.4051.desc_swamp:0 "Đội ngũ đã phát hiện ra một điều bất thường sau khi dọn sạch đầm lầy trên [Root.GetName], một nhóm cây lớn bao quanh chặt chẽ $ancrel.4051.desc$"
 ancrel.4051.desc_glacier:0 "Đội ngũ đã phát hiện ra một điều bất thường sau khi dọn sạch sông băng trên [Root.GetName], lớp băng bao phủ $ancrel.4051.desc$"
 ancrel.4051.a:0 "Ta cần phải tìm hiểu sâu hơn về những bức tượng này."
 ancrel.4051.b:0 "Mảnh đất này đã được quy hoạch cho các mục đích khác."
 # Arc Site
 sentinels_digsite:0 "Vệ Binh"
 sentinels_digsite_desc:0 "Những người khổng lồ thầm lặng đứng canh gác trên [From.Planet.GetName]. Chín bức tượng đồ sộ được đặt dọc theo một vành đai rộng lớn tại các vị trí chiến lược của địa hình dường như đang bảo vệ thứ gì đó ở trung tâm.\n\nLớp da của chúng được phủ lớp vảy mạ tinh xảo, tư thế cảnh giác sẵn sàng hành động, và đôi mắt bất động của chúng dõi theo từng bước chân của các nhà thám hiểm. Tuy nhiên chẳng có thứ gì trong khu vực rõ ràng cần được bảo vệ. Có lẽ đối tượng được bảo hộ đã không vượt qua được sự tàn phá của thời gian. Nhiều Vệ Binh mang trên mình những vết tích của các cuộc tấn công."
 ancrel.4052.name:1 "Vệ Binh Quấy Phá"
 ancrel.4052.desc:1 "Các nhà khảo cổ học có chút kỳ lạ. Từ trước đến nay, quá trình khai quật liên tục bị cản trở bởi những sự cố kỳ lạ, các chấn thương và tình huống xui xẻo, giờ đây ngay cả các nhà khảo cổ học cao cấp với hàng chục năm kinh nghiệm thực địa cũng cho rằng những Vệ binh chính là nguyên nhân gây ra những rắc rối này.\n\nHọ ngập tràn những nỗi sợ hãi mê tín và vô căn cứ, và bắt đầu tin rằng trong những bức tượng này có chứa một thực thể ác độc nào đó không muốn bị quấy rầy. Nhiều người cho rằng khi không có ai nhìn, các bức tượng sẽ di chuyển, nhưng không có bất kỳ dấu hiệu nào cho thấy các chi không có khớp nối của chúng có bất kỳ khả năng cử động nào. Tình hình sau đó tiếp tục mất kiểm soát, có người đã tìm thấy dấu vết sinh khối, hay nói đúng hơn là hiện tượng rỉ máu rõ ràng, trong những vết xước nhỏ ở phần đầu chi của các Vệ binh.\n\nLiệu các Vệ binh đã trở thành những kẻ gánh tội thay, hay còn có một tình huống nào đó thâm độc hơn, mọi thứ vẫn cần phải làm rõ."
 ancrel.4053.name:0 "Nhanh Chân Đến Trước"
 ancrel.4053.desc:1 "Phân tích thành phần của các Vệ Binh cho thấy các bức tượng được làm từ một hợp chất cermet vô danh. Vật liệu này không thể được rèn bởi các xã hội tiền sử, nhưng những chỉ số sơ bộ cho thấy niên đại của chúng còn sớm hơn tất cả các nền văn minh đã biết trên [From.Planet.GetName].\n\nĐáng tiếc thay, máy quét không thể xuyên qua lớp phủ kim loại của các Vệ Binh."
 ancrel.4054.name:0 "Lõi Phóng Xạ"
 ancrel.4054.desc:1 "Các nhà khảo cổ học đã cấu trúc lại máy quét đã qua cải tiến của [missing_archaeologist.GetName]. Sau khi xuyên qua vật liệu phức hợp của bức tượng, máy quét đã phát hiện ra bức xạ yếu phát ra từ lõi của Vệ binh. Để tiến hành điều tra sâu hơn, cần phải mổ xẻ một trong các Vệ binh; trong quá trình này rất có thể sẽ gây ra hư hỏng cho nó. Vì một trong các bức tượng đã bị mất một phần cánh, các nhà khảo cổ học của ta đề nghị bắt đầu từ bức tượng đó."
 ancrel.4054.a:0 "Hãy tháo dỡ Vệ Binh một cách cẩn thận để ta có thể lắp nó lại."
 ancrel.4054.b:0 "Ta sẽ không mạo phạm đài kỷ niệm thiêng liêng này."
 ancrel.4054.b.tooltip:0 "Nếu giữ lại Vệ Binh, khu đất này sẽ không thể dùng cho mục đích nào khác."
 ancrel.4054.c:0 "Hãy san phẳng triệt để lũ quái thai do bọn ngoại lai xây dựng này."
 ancrel.4054.d:0 "Phá bỏ bức tượng và thu hồi nguyên vật liệu."
 # Destroy the Sentinels
 DESTROY_SENTINELS:0 "Vệ Binh"
 DESTROY_SENTINELS_DESC:0 "Lớp vỏ vảy dày đặc của Vệ Binh đã được chứng minh là không thể bị xuyên thủng bằng các công cụ thông thường, các nhà khảo cổ học cần sự hỗ trợ của đội ngũ kỹ sư mới có thể tiến xa hơn."
 SECRET_TOMB:0 "Đi Sâu Xuống Lòng Đất"
 SECRET_TOMB_DESC:0 "Bên dưới bệ đỡ của một Vệ Binh lúc trước có giấu một phiến đá tròn với các hoa văn phức tạp. Ta tin rằng đây có thể là lối vào của một khu phức hợp dưới lòng đất."
 ancrel.4055.name:0 "Vệ Binh Sống Lại"
 ancrel.4055.desc:0 "Toàn thân bức tượng khẽ rung lên, rồi đột ngột sống lại. Cơ thể chúng phát ra tiếng gầm gừ trầm thấp, làn da tỏa sáng rực rỡ. Bức xạ phát ra từ lõi biến chúng trở nên mềm dẻo và trong suốt, hiện ra một mạng lưới các nút số.\n\nChúng phát ra những tiếng thét chói tai kỳ dị như kim loại bị uốn cong, ánh mắt ánh lên vẻ căm thù, quét qua khu trại. Giờ đây chúng đang bay về phía khu định cư gần nhất.\n\nSự rời đi của chúng làm lộ ra một phiến đá tròn trên mặt đất, thứ mà trước đó bị giấu dưới bệ của một trong những Vệ binh."
 ancrel.4055.desc.phobe:0 "Những Vệ Binh này đã thức tỉnh. Đội kỹ thuật đang chuẩn bị đập nát những Vệ Binh, nghiền chúng thành tro bụi, thì đột nhiên $ancrel.4055.desc$"
 ancrel.4055.desc.other:0 "Những Vệ Binh này đã thức tỉnh. Đội kỹ thuật đang chuẩn bị tháo dỡ bức tượng, thì đột nhiên $ancrel.4055.desc$"
 ancrel.4055.a:0 "Tiêu diệt lũ robot này!"
 ancrel.4056.name:0 "'Sự Vĩnh Cửu'"
 ancrel.4056.desc:1 "Quả thực có một lối vào ẩn dưới đĩa đá. Sau khi mở ra, ta có thể tiến vào một đường hầm nhỏ nối liền, đường hầm này dẫn thẳng xuống lớp vỏ sâu của [event_target:sentinels_planet.GetName]. Tại đó, một loài sinh vật bản địa có hình dáng con người và sở hữu trí khôn trên hành tinh này đang thanh tẩy bản thân trong một loạt các phòng nghi lễ trang hoàng lộng lẫy, để bước vào hành trình cuối cùng. Khi cuộc đời sắp đi đến hồi kết, họ rũ bỏ thân xác, tìm kiếm kiếp sau vĩnh hằng, và tồn tại dưới dạng kỹ thuật số trong một thiên đường do máy tính mô phỏng. Ai mà ngờ được một thiên đường của người ngoài hành tinh lại có thể nhét vừa vào một ổ cứng còn nhỏ hơn cả mô-đun chuyển hướng của tàu hộ tống cơ chứ?\n\nTại một thời điểm nào đó, toàn bộ dân số đã quyết định tiếp tục tồn tại dưới dạng kỹ thuật số, chỉ để lại một vài người thưa thớt. Những người này đã tải ý thức của mình lên các Vệ Binh để canh giữ nơi an nghỉ của họ mãi mãi.\n\nMô phỏng ảo này có lẽ có thể được dùng để khích lệ tinh thần người dân. Chắc chắn nó có một giá trị giải trí nào đó."
 ancrel.4056.a:0 "Thanh trừng người ngoài hành tinh và thay đổi mục đích sử dụng của thế giới ảo này."
 ancrel.4056.b:0 "Một bãi săn ảo... giờ đây nó đã trở thành thế giới giải trí của ta..."
 ancrel.4056.c:0 "Nhân bản công nghệ này. Hãy cứ để những người ngoài hành tinh đó tiếp tục sống một cuộc đời bình yên."
 ancrel.4056.d:0 "Ta sẽ nghiên cứu nó. Khởi động màn trình diễn điên cuồng của riêng mình."
 ancrel.4057.name:0 "Đánh Bại Vệ Binh"
 ancrel.4057.desc:1 "Ta đã hạ gục được tên Vệ Binh cuối cùng. Một cú đánh chí mạng đã làm nổ tung phần bụng của nó, khiến tên Vệ Binh ngã gục, cơ thể dần dần đông cứng, và lõi năng lượng cũng lụi tàn theo. Bức tượng dồn chút sức lực cuối cùng, run rẩy nắm tay lại, vươn về phía những người lính đang tới gần, van nài ta 'hãy để họ được yên nghỉ'. Rồi thân xác nó lạnh toát, ánh mắt trở nên vô hồn, và khuôn mặt cũng dần giãn ra.\n\nPhía dưới Vệ Binh, những người lính tìm thấy một lối vào bí mật, vốn bị che khuất bởi trường năng lượng của nó. Khi kiểm tra toàn bộ những Vệ Binh này, ta phát hiện ra chúng không phải là những cỗ máy tự động đơn giản, mà là những cỗ máy mang theo ý thức kỹ thuật số hoàn chỉnh của một sinh vật hữu cơ."
 ancrel.4057.a:0 "Phong tỏa lối vào."
 ancrel.4075.name:0 "Người Sống Sót Từ [sentinels_planet.GetName]"
 ancrel.4075.desc:0 "Một con tàu chở những người sống sót chạy trốn khỏi cuộc diệt chủng trên [sentinels_planet.GetName] đã cập bến [sentinels_new_home.GetName]. Họ ẩn náu nơi hoang dã cho đến khi các Vệ Binh rút đi, thoát khỏi cuộc tàn sát một cách kỳ diệu. Rất có thể những robot tự động này, với ảo tưởng rằng chúng 'sẽ giải phóng chúng ta khỏi xiềng xích của thể xác', đã bỏ đi sau khi nhiệm vụ hoàn tất.\n\nSau khi chúng biến mất, một lối vào bí mật dẫn sâu xuống lòng đất đã hiện ra từ bên dưới trường lực. Có thể các Vệ Binh đã nhốt mình ở bên trong."
 ancrel.4075.a:0 "Tiến hành một cuộc truy quét gắt gao."
 ancrel.4075.b:0 "Lấp lối vào lại."
 ancrel.4076.name:0 "'Sự Vĩnh Cửu'"
 ancrel.4076.desc:0 "Chúng ta đã tiến vào lối vào bí mật trên [event_target:sentinels_planet.GetName]. Bên trong là một khu phức hợp đền đài mới bị bỏ hoang gần đây, nơi một loài hình người bước vào chuyến hành trình cuối cùng của họ. Khi cuộc đời đi đến hồi kết, họ rũ bỏ thể xác, bước vào một thiên đường giả lập mang tên \"Cõi Vĩnh Hằng\" để tận hưởng kiếp sau ảo ảnh.\n\nĐến một thời điểm nào đó, toàn bộ dân số đều quyết định tồn tại dưới dạng kỹ thuật số, chỉ để lại một vài cá nhân. Những người này đã tải tâm trí của mình vào các cỗ máy, và từ đó Vệ binh ra đời.\n\nNhững Vệ binh giờ đã bặt vô âm tín để lại cho chúng ta một món quà chia tay —— một ổ cứng chứa toàn bộ dân số của [event_target:sentinels_planet.GetName], dưới dạng dữ liệu kỹ thuật số, chìm trong sự nhàm chán vô tận đến vĩnh hằng. Hóa ra thiên đường của người ngoài hành tinh là một trò chơi cờ bàn trừu tượng kéo dài bất tận, với mục tiêu cốt lõi là tích lũy điểm hạnh phúc để thống trị thiên hà."
 ancrel.4076.a:0 "Tận dụng tâm trí của họ cho công việc nghiên cứu khoa học."
 ancrel.4076.b:0 "Điều chỉnh \"Cõi Vĩnh Hằng\" để phục vụ mục đích giải trí cho đại chúng."
 ancrel.4077.name:0 "“Cõi Vĩnh Hằng”"
 ancrel.4077.desc.a:0 "Chúng ta làm được rồi! Những cư dân kỹ thuật số sống trong \"Cõi Vĩnh Hằng\" đã được phân công hỗ trợ nghiên cứu khoa học trên [from.owner.capital_scope.GetName]. Họ gần như không cần nghỉ ngơi, và tỏ ra rất vui vẻ vì cuối cùng cũng có việc khác để làm..."
 ancrel.4077.desc.b:0 "Chúng ta làm được rồi! Bản giả lập \"Cõi Vĩnh Hằng\" đã được tinh chỉnh lại để phù hợp hơn với thị hiếu của người dân. Giờ đây, toàn bộ dân chúng của chúng ta có thể cùng vui chơi trong thế giới ảo tưởng với các cư dân số hóa của thiên đường \"Cõi Vĩnh Hằng\", mà không hề có độ trễ mạng. Điều này đã khích lệ tinh thần của họ một cách mạnh mẽ và làm giảm nhu cầu về vật chất."
 ancrel.4058.desc:0 "Các Vệ binh đã thức tỉnh. Ngay khi đội công trình định tháo dỡ một Vệ binh hỏng, bức tượng khẽ rung lên, tuôn trào sức sống, cơ thể phát ra tiếng kêu trầm và lớp vỏ ngoài phát sáng. Những xung nhịp tỏa ra từ lõi khiến chúng mang đặc tính biến đổi và trong suốt, làm lộ ra một mạng lưới các điểm kết nối cấu thành từ dữ liệu ảo.\n\nTrước khi chúng ta kịp phản ứng, chúng đã bao vây các nhà khảo cổ và treo lơ lửng chúng ta trong một trường lực. Bây giờ chúng muốn nói chuyện với chúng ta."
 ancrel.4058.a:0 "Nghe xem chúng muốn nói gì."
 ancrel.4058.b:0 "Bắt chúng câm miệng vĩnh viễn!"
 ancrel.4059.name:1 "Vệ binh"
 ancrel.4059.desc:1 "§HVệ Binh với chiếc cánh gãy quay sang một trong những đồng loại của mình và cất tiếng.\n\n§!Làm ơn Divana, hãy thả họ xuống. Tôi muốn được giải thoát khỏi nhà tù này. Tôi không còn đếm nổi bao nhiêu ngày chúng ta đã phụng sự các chủ nhân, nai lưng trên mặt đất này trong khi họ hưởng thụ thiên đường bên dưới. Tôi sống mà như đã chết, còn họ chết mà như vẫn sống. Cậu sẽ không để tôi ra đi sao?\n\n§HDivana nhìn cô ấy với vẻ kinh tởm.§!\n\nExcelsia, nhân danh các vị thần, hãy bình tâm lại. Những người thân yêu của chúng ta đang yên nghỉ bên dưới. Cậu đã quên tội lỗi của chúng ta rồi sao? Chúng ta đã lập lời thề sẽ canh gác kiếp sau của họ mãi mãi. Đó là sự cứu rỗi duy nhất của chúng ta.\n\n§HCô ấy nhìn lướt qua chúng ta.§!\n\nCác bạn không phải là mối đe dọa đối với chúng tôi, người [Root.owner.GetSpeciesNamePlural]. Hãy để chúng tôi được yên bình và chúng tôi sẽ bảo vệ hành tinh này mãi mãi."
 ancrel.4059.a:0 "Đợi đã... Các người là ai?"
 ancrel.4059.a.response:1 "Chúng tôi là người gác cổng thiên đường —— bảo vệ người dân của chúng tôi bất diệt qua muôn đời."
 ancrel.4059.b:0 "Chúng tôi chấp nhận sự bảo vệ của các người."
 ancrel.4062.desc:0 "§HExcelsia tiến sát nhà khảo cổ.§!\n\nLàm ơn, xin hãy kết thúc nỗi đau của tôi."
 ancrel.4059.e:0 "Không, chúng tôi cần cô."
 ancrel.4059.f:1 "Cô có thể tự do rời đi."
 ancrel.4070.desc:0 "Cảm ơn."
 ancrel.4059.d:0 "Chúng tôi cần vùng đất này..."
 ancrel.4059.c:1 "Thiên đường?"
 ancrel.4059.c.response:0 "Thiên đường, đúng vậy... Dù tôi tự hỏi liệu khái niệm thiên đường của các người có giống với của chủ nhân chúng tôi hay không.\n\n§HCô ta nhướng mày, cười thầm.§!\n\nChủ nhân của chúng tôi có gu thưởng thức rất tinh tế..."
 ancrel.4060.a.response:1 "Vậy thì các ngươi phải chết.\n\n§HCác Vệ Binh khác vung vũ khí lên nhưng Excelsia chỉ mỉm cười, một vẻ thanh thản hiện rõ trên gương mặt cô.§!"
 ancrel.4060.name:1 "Truyền tải thông điệp"
 ancrel.4060.desc:1 "Chúng tôi không thể để các người quấy rầy nơi an nghỉ của những người chúng tôi yêu thương. Hãy để họ yên nghỉ, và các người cũng sẽ không bao giờ phải lo lắng về những mối đe dọa từ bên ngoài."
 ancrel.4060.a:1 "Các người phải dọn khỏi vùng đất này ngay lập tức."
 ancrel.4060.b:1 "Chúng tôi có thể dùng đến sự bảo vệ của các người."
 ancrel.4060.b.response.tooltip:1 "Thêm lực lượng phòng thủ Vệ binh vào hành tinh này."
 ancrel.4061.name:0 "Tái tạo “Cõi Vĩnh Hằng”"
 ancrel.4061.desc:0 "Chúng ta đã sao chép thành công \"Cõi Vĩnh Hằng\" và cải tạo nó cho phù hợp với nhu cầu của mình. Cư dân của chúng ta có thể hiện thực hóa mọi ảo tưởng trong một sân chơi ảo không hề có độ trễ mạng, điều này đã khích lệ tinh thần của họ mạnh mẽ và làm giảm nhu cầu về vật chất.\n\nTrong khi đó, những người ngoài hành tinh hình người kia vẫn tiếp tục sống trong \"Cõi Vĩnh Hằng\" nguyên bản, tận hưởng thiên đường của họ theo một cách hơi khác biệt. Họ bị khóa chặt trong một ván cờ bàn trừu tượng bất tận, với mục tiêu cốt lõi là tích lũy điểm hạnh phúc để thống trị thiên hà. Rất khó để khẳng định liệu họ có thực sự hạnh phúc hay không. Mày họ luôn nhíu chặt, có lẽ đó là cách bộc lộ niềm vui của người ngoài hành tinh, hoặc cũng có thể không phải vậy."
 ancrel.4061.a:0 "Mỗi người đều có lựa chọn riêng..."
 ancrel.4063.name:0 "Đánh mất [sentinels_planet.GetName]"
 ancrel.4063.desc:0 "Chuyện không ngờ đã xảy ra. Chúng ta đã để mất [sentinels_planet.GetName]. Các Vệ binh bùng nổ năng lượng tạo thành một cơn lốc dữ dội, giáng thẳng xuống lực lượng an ninh của chúng ta. Chúng ta không thể nào đánh một trận công bằng với những kẻ thù không biết đổ máu và không cần nghỉ ngơi."
 ancrel.4063.a:0 "Chúng ta sẽ quay lại lấy những gì đáng lẽ thuộc về mình."
 ancrel.4064.name:0 "[sentinels_planet.GetName] được giải phóng"
 ancrel.4064.desc:0 "Các Vệ binh đã bị đánh gục, [sentinels_planet.GetName] lại trở về tay chúng ta. Khi cỗ máy tự động cuối cùng ngã xuống, lõi năng lượng của nó dần mờ đi, nó vươn nắm tay run rẩy về phía người lính đang đến gần, khẩn cầu cô ấy \"hãy để họ được yên nghỉ\". Ngay sau đó nó bất động, ánh mắt vô hồn, nét mặt lạnh ngắt.\n\nBên dưới các Vệ binh, những người lính phát hiện một lối vào bí mật, trước đó bị trường lực của Vệ binh che khuất. Việc kiểm tra toàn diện các Vệ binh này cho thấy chúng không đơn thuần là robot tự động, mà mang ý thức kỹ thuật số nguyên vẹn của một sinh vật hữu cơ.\n\nBất luận nơi đây chôn giấu bí mật gì, ngày chiến thắng này sẽ được mọi người nhớ mãi."
 ancrel.4064.a:0 "Tiến hành điều tra lối vào"
 ancrel.4064.b:0 "Chôn vùi nó đi. Cuối cùng chúng ta cũng được về nhà."
# Sentinels Random Events
 ancrel.4065.name:0 "Nhà khảo cổ mất tích"
 ancrel.4065.desc:0 "Sĩ quan Khoa học [missing_archaeologist.GetName] đã mất tích. [missing_archaeologist.GetSheHeCap] được nhìn thấy lần cuối khi rời khu trại lúc hoàng hôn để tìm một nơi yên tĩnh suy ngẫm về các Vệ Binh. Những ngày trước khi [missing_archaeologist.GetHerHis] mất tích, [missing_archaeologist.GetSheHe] đã bày tỏ mối lo ngại về sự an toàn của khu trại sau khi số vụ tai nạn ngày một tăng, và chúng ta e rằng [missing_archaeologist.GetSheHe] có thể đã từ bỏ nhiệm vụ của [missing_archaeologist.GetHerHis] để phản đối."
 ancrel.4065.a:0 "Đáng lo ngại thật."
 ancrel.4066.name:0 "Nhà khảo cổ mất tích"
 ancrel.4066.desc:0 "Tư trang của [missing_archaeologist.GetName], bao gồm thiết bị Định Tâm của [missing_archaeologist.GetHerHis] — một thiết bị dùng để cách ly tâm trí khỏi các xao lãng bên ngoài — đã được tìm thấy trên một gờ đá nhìn ra các Vệ Binh. Những cành cây xếp thành đường viền dang dở quanh một trong các bức tượng cho thấy [missing_archaeologist.GetSheHe] có thể đã tạm dừng công việc của [missing_archaeologist.GetHerHis] để đánh dấu vị trí của nó.\n\nĐèn pin và máy quét của [missing_archaeologist.GetHerHisCap] được phát hiện bị nghiền nát dưới một mảnh vỡ từ cánh của Vệ Binh. Chiếc máy quét đã được điều chỉnh theo một cách kỳ lạ. Có lẽ nó có thể giúp chúng ta xuyên thủng lớp bảo vệ của các Vệ Binh.\n\nNếu muốn tìm thấy [missing_archaeologist.GetName] còn sống, chúng ta phải chuyển thêm nguồn lực vào việc tìm kiếm vì cơ hội sống sót của [missing_archaeologist.GetHerHis] nơi hoang dã đang giảm mạnh từng ngày."
 ancrel.4066.a:0 "Bằng bất cứ giá nào."
 ancrel.4066.b:0 "Chúng ta sẽ không lãng phí thời gian cho một kẻ đào ngũ."
 ancrel.4066.c:0 "Phân công một số nhà khảo cổ của chúng ta tiến hành nghiên cứu."
 ancrel.4067.name:0 "Đã tìm thấy nhà khảo cổ mất tích"
 ancrel.4067.desc:0 "Thi thể của [missing_archaeologist.GetName] đã được tìm thấy, bị chôn vùi dưới một phiến đá khổng lồ. Nguyên nhân tử vong được xác định là do chấn thương sọ não nghiêm trọng. Ai đó đã xếp một vòng đá quý nhỏ quanh nơi an nghỉ của [missing_archaeologist.GetHerHim] để bày tỏ sự tôn kính."
 ancrel.4067.a:0 "Mong cô ấy được yên nghỉ."
 ancrel.4068.name:0 "Đã tìm thấy nhà khảo cổ mất tích"
 ancrel.4068.desc:1 "[missing_archaeologist.GetName] đã được tìm thấy trong tình trạng bất tỉnh và bị thương nặng, ẩn náu trong bụi rậm bên dưới một khối đá tự nhiên, với một thiết bị dữ liệu dính đầy [missing_archaeologist.GetBloodType] kẹp dưới cánh tay của [missing_archaeologist.GetHerHis]. [missing_archaeologist.GetSheHeCap] đã được đưa khẩn cấp tới khoang y tế để điều trị chấn thương nghiêm trọng do một vật thể tù từ trên cao giáng xuống.\n\nDù tình trạng của [missing_archaeologist.GetHerHis] đã ổn định, [missing_archaeologist.GetSheHe] lại mắc chứng mất trí nhớ ngược và không còn nhớ gì về việc phải chịu những vết thương này. Các mảnh vụn từ hợp kim kim loại độc nhất dùng để tạc nên các Vệ Binh đã găm vào xương đỉnh sọ của [missing_archaeologist.GetHerHis]. Tất cả những gì [missing_archaeologist.GetSheHe] nhớ được là đã lẩn trốn ai đó và sống sót qua ngày nhờ chút sản vật ít ỏi của vùng đất này. Dẫu vậy, các ghi chép của [missing_archaeologist.GetHerHis] vẫn chứa đựng nhiều thông tin hữu ích."
 ancrel.4068.a:0 "Điềm chẳng lành."
 ancrel.4078.name:0 "Hỏa hoạn"
 ancrel.4078.desc:0 "Đêm xuống, khi các nhà khảo cổ đang chìm trong giấc ngủ, module thực phẩm của trại đột nhiên bốc cháy do thức ăn bị khét. Ngoài ra không tìm thấy manh mối nào khác về nguyên nhân gây cháy. May mắn là không ai bị thương, nhưng các nhà khảo cổ không thể làm việc với cái bụng đói được..."
 ancrel.4078.a:0 "Gửi khẩu phần ăn tới đó."
 ancrel.4078.b:1 "Một [owner.GetSpeciesName] thực thụ đều biết cách sinh tồn nơi hoang dã."

 the_evermore_modifier:1 "Cảm giác hưng phấn rẻ tiền"
 the_evermore_modifier_desc:0 "“Cõi Vĩnh Hằng” vốn là một thế giới ảo, nơi ý thức của người ngoài hành tinh có thể tồn tại hạnh phúc vĩnh viễn dưới dạng kỹ thuật số, nay đã được tái cấu trúc thành công viên giải trí cho đại chúng."
 the_evermore_evil_modifier:0 "$the_evermore_modifier$"
 the_evermore_evil_modifier_desc:0 "$the_evermore_modifier_desc$"
 study_the_sentinels_modifier:0 "“Cõi Vĩnh Hằng”"
 study_the_sentinels_modifier_desc:1 "Trong phiên bản thiên đường của nền văn minh \"Cõi Vĩnh Hằng\", mỗi người đều bị khóa vào một trò chơi cờ bàn trừu tượng bất tận, với cốt lõi là tích lũy điểm hạnh phúc để thống trị thiên hà. Điều này cung cấp một nguồn dữ liệu nhân chủng học vô cùng nhàm chán, nhưng lại cực kỳ dồi dào thông tin."
 sentinels_planet_modifier:0 "Vệ binh"
 sentinels_planet_modifier_desc:1 "Những người bảo hộ cổ đại đang canh giữ hành tinh này đã khơi dậy sự gắn kết và tính tâm linh của người dân chúng ta."
 REPLICATE_THE_EVERMORE:0 "Sao chép “Cõi Vĩnh Hằng”"
 REPLICATE_THE_EVERMORE_DESC:0 "“Cõi Vĩnh Hằng” do chúng ta tái thiết sẽ mang đến cho công chúng những phương thức giải trí và thư giãn rẻ tiền hơn, còn người ngoài hành tinh vẫn có thể tận hưởng thiên đường kỹ thuật số của họ mãi mãi."
 REPURPOSE_THE_EVERMORE:0 "Tái lập trình “Cõi Vĩnh Hằng”"
 REPURPOSE_THE_EVERMORE_DESC:0 "Chúng ta không thể để bản thân bị đày đọa đi cày điểm hạnh phúc mãi mãi được. Chúng ta phải tái lập trình “Cõi Vĩnh Hằng” để nó phù hợp hơn với quan niệm của chúng ta về những hoạt động có ý nghĩa."



 # "Trench World" Archaeological Site Reward Modifier
 modern_trench_war:0 "Chiến tranh chiến hào hiện đại"
 modern_trench_war_desc:0 "Phát hiện khảo cổ trên một hành tinh từng bị bao vây bởi sinh vật khổng lồ giống ốc sên đã mang lại cho chúng ta cái nhìn mới mẻ và hiệu quả về cách tận dụng môi trường để phòng thủ. Điều này sẽ tăng tỷ lệ sống sót cho lục quân của chúng ta trong các chiến dịch phòng ngự trước các cuộc tấn công trên bộ —— ngay cả khi phải đối đầu với những con sên không gian khổng lồ!"

 # "Ebb & Flow" Archaeological Site Reward Modifier
 forced_mindfulness:0 "Thực hành chánh niệm bắt buộc"
 forced_mindfulness_desc:0 "Khi bị mắc kẹt trong một mê cung dung nham đầy chết chóc, đội khảo cổ của chúng ta đã vạch ra một quy trình thư giãn tâm trí thường nhật. Các nguyên tắc cơ bản của phương pháp thực hành này giờ đây đã được phổ biến rộng rãi trên toàn đế quốc."

 debug_subroutine:0 "Chương trình con gỡ lỗi" # Machine Empires
 debug_subroutine_desc:0 "Khi bị cô lập tạm thời trong một mê cung dung nham, các đơn vị khảo cổ của chúng ta đã bị ngắt kết nối mạng và không thể thực thi chức năng. Chúng đã phát triển một thuật toán cho phép chạy chương trình con gỡ lỗi ở chế độ ngủ. Chương trình con này sau đó đã được tải lên và bổ sung vào hệ thống máy chủ."

 glory_to_the_many:0 "Vinh quang thuộc về tập thể" # Hive Mind Empires
 glory_to_the_many_desc:0 "Một đội thám hiểm đã bị kẹt trong mê cung dung nham, tạm thời mất liên lạc với ý thức tổ đội. Không thể dựa vào ý thức tập thể, họ đã trải qua một cú chạm trán ngắn ngủi với khái niệm tồi tệ về cái tôi; đây là một trải nghiệm kinh hoàng, chỉ càng làm tăng thêm sự khinh miệt đối với chủ nghĩa cá nhân."

 # "Sky Glow Hymn" Archaeological Site Reward Modifier
 anthem_of_aurora:0 "Giai điệu Cực quang"
 anthem_of_aurora_desc:0 "Bộ phận Khoa học đã tái hiện thành công bản thánh ca thanh tao được \"xướng\" lên bởi thực thể cực quang phương Bắc mà chúng ta từng bắt gặp. Tất cả các cơ sở sản xuất năng lượng hiện nay đều được trang bị hệ thống điều hòa để gia tăng sản lượng."

 ancrel.6500.name:0 "Thu giữ Di vật tại [planet.GetName]"
 ancrel.6500.desc:0 "Khi thiết lập quyền kiểm soát vững chắc đối với [planet.GetName], chúng ta nhận được tin quân đội đã giành được quyền kiểm soát một di vật vô giá mang tên §H[this.GetLastReceivedRelic]§! trong quá trình chiến đấu. Rõ ràng, [victim.GetName] đang chuẩn bị sơ tán di vật này đến nơi an toàn, nhưng sự tiến quân thần tốc của chúng ta trên tiền tuyến [planet.GetPlanetMoon] đã khiến lựa chọn này trở nên bất khả thi.\n\nDi vật hiện đã được chúng ta chuyển đến Kho Lưu trữ Trung ương tại [Root.Capital.GetName] một cách an toàn."
 ancrel.6500.a:0 "[this.GetLastReceivedRelic] đã thuộc về chúng ta!"
 stole_relic:0 "Chúng ta đã đoạt được §Y[this.GetLastReceivedRelic]§! từ tay §Y[victim.GetName]§!"
 ancrel.6505.name:0 "Đánh mất Di vật tại [planet.GetName]!"
 ancrel.6505.desc:0 "Họa vô đơn chí, nối tiếp sự sụp đổ của [planet.GetName] là sự thất thủ của thủ đô vĩ đại [From.GetName] của chúng ta. Chúng ta đã cố gắng sơ tán §H[this.GetLastLostRelic]§! nhưng thất bại, tàu con thoi vận chuyển chuyên dụng của nó đã bị bắn hạ trong cuộc hỗn chiến gần Kho Lưu trữ Trung ương.\n\nHiện chúng ta đã xác định được phe [From.GetSpeciesNamePlural] đã chuyển di vật này đến [From.Capital.GetName], tức là thủ đô của họ. Chúng ta đã mất nó rồi."
 ancrel.6505.a:0 "[this.GetLastLostRelic] không còn thuộc về chúng ta nữa..."
 relic_lost:0 "§Y[this.GetLastLostRelic]§! hiện đang thuộc về §Y[From.GetName]§!"

 ## The Library
 site_the_library:0 "Thư viện"
 site_the_library_intro:0 "Một lớp kính và kim loại dày đặc bao phủ hành tinh vốn dĩ cằn cỗi này, có lẽ là dấu hiệu cho thấy nó đã trải qua một thảm họa tàn khốc nào đó trong quá khứ."
 ancrel.12020.name:0 "Tàn tích bị lãng quên từ lâu"
 ancrel.12020.desc:0 "Chúng ta đã phát hiện ra những dấu hiệu rõ rệt cho thấy [From.Planet.GetName] từng có mật độ dân số rất đông đúc. Tuy nhiên, dù không biết điều gì đã xóa sổ nền văn minh của họ, nhưng sự tàn phá diễn ra vô cùng triệt để: gần như không tìm thấy chút hài cốt hữu ích nào.\n\nMáy quét của chúng ta dò thấy một vài hang động lớn sâu dưới lòng đất, có khả năng từng hỗ trợ sự sống. Biết đâu chúng ta sẽ gặp may mắn hơn ở đó."
 ancrel.12025.name:0 "Thư viện"
 ancrel.12025.desc:0 "Cuộc khai quật hệ thống hang động trên [From.Planet.GetName] đã phát lộ tàn tích của một xã hội công nghệ cao dưới lòng đất, có quy mô đồ sộ và được bảo quản nguyên vẹn. Tình trạng của nhiều khu tàn tích tốt đến đáng kinh ngạc, chúng ta đã tìm thấy thứ mà các [Owner.GetResearchers] gọi là \"Thư viện\" tinh thể dữ liệu mã hóa. Hy vọng những thứ này có thể giúp chúng ta hiểu đôi chút về những gì đã xảy ra ở đây."
 ancrel.12030.name:0 "Ẩn nấp trong bóng tối"
 ancrel.12030.desc.base:0 "Một [Owner.GetTeamMember] đang khám phá tàn tích trên [FromFrom.Planet.GetName] vừa bị mất tích gần đây. Sau một cuộc tìm kiếm chớp nhoáng, chúng ta đã tìm thấy một [Owner.GetSpeciesRemnantName] có vẻ như thuộc về loài [Root.Owner.Species.GetName]."
 ancrel.12030.desc.normal:1 "$ancrel.12030.desc.base$ Các [Owner.GetResearchers] của chúng ta không mảy may nghi ngờ đây chính là hài cốt của [Owner.GetTeamMember] đang mất tích, nhưng họ lại bối rối trước việc cái xác bị phân hủy nhanh đến vậy. Họ thúc giục chúng ta phải thận trọng trong các bước điều tra tiếp theo."
 ancrel.12030.desc.lithoid:0 "$ancrel.12030.desc.base$ Các [Owner.GetResearchers] của chúng ta không mảy may nghi ngờ đây chính là hài cốt của [Owner.GetTeamMember] đang mất tích, nhưng họ lại bối rối không rõ rốt cuộc thứ gì đã giết chết thành viên này —— quá trình này dường như diễn ra rất chóng vánh. Họ thúc giục chúng ta phải thận trọng trong các bước điều tra tiếp theo."
 ancrel.12030.desc.machine:0 "$ancrel.12030.desc.base$ Các [Owner.GetResearchers] của chúng ta không mảy may nghi ngờ đây chính là hài cốt của [Owner.GetTeamMember] đang mất tích, nhưng họ lại bối rối trước việc đơn vị đó bị ăn mòn nhanh đến vậy. Họ thúc giục chúng ta phải thận trọng trong các bước điều tra tiếp theo."
 ancrel.12035.name:0 "Nỗi phiền muộn chốn địa đàng"
 ancrel.12035.desc:0 "Khi giải mã các tinh thể dữ liệu từ trong hang động của [From.Planet.GetName], chúng ta đã phác họa nên viễn cảnh của một hành tinh chìm trong khốn khó.\n\nHành tinh này từng là trung tâm của một nền văn minh phồn thịnh, được gọi là Quỹ Irani. Ở giai đoạn cuối của nền văn minh đó, người Irani ngày càng có xu hướng tích lũy tri thức, bỏ mặc các vấn đề về thể chất như sinh sản. Hậu quả là dân số của họ sụt giảm nhanh chóng. Giới lãnh đạo cảm thấy hoảng hốt trước số lượng người liên tục giảm sút, họ cố gắng tìm ra giải pháp công nghệ để đạt được sự bất tử. Từ thời điểm này, các ghi chép trở nên ngày càng thưa thớt —— mặc dù có vẻ như nó xảy ra trước một thảm họa nào đó buộc họ phải rút xuống lòng đất —— hiện chưa rõ những nỗ lực của họ mang lại kết quả gì."
 ancrel.12040.name:0 "Sự diệt vong của một nền văn minh"
 ancrel.12040.desc.base:0 "Bây giờ chúng ta đã có thể chắp vá lại kết quả từ nỗ lực tìm kiếm sự bất tử của người Irani. Có vẻ như, họ còn cách sự bất tử rất xa, thay vào đó lại tạo ra một mối đe dọa khủng khiếp —— một đàn vi sinh vật có khả năng sinh sôi cực nhanh và gần như ngay lập tức nuốt chửng mọi chất hữu cơ... hệt như những gì đã xảy ra với thành viên mất tích của đội chúng ta.\n\nĐại thảm họa theo sau đã quét sạch phần lớn dân số. Những người sống sót chia làm hai nhóm: Nhóm thứ nhất không muốn từ bỏ [From.Planet.GetName] nên đã đào sâu xuống lòng đất, tái thiết lại nền văn minh trong một hang động kín bưng mà chúng ta đã tìm thấy. Tuy nhiên, về lâu dài, giải pháp này không thể duy trì được, và cuối cùng thì vi khuẩn cũng tìm được đường len lỏi vào khu vực sống của họ. Hang động đã trở thành nấm mồ cho họ.\n\nNhóm còn lại đã lưu vong ra ngoài không gian, tiến hành cách ly hành tinh bằng cách phá hủy triệt để bề mặt để không ai có thể sinh sống được nữa."
 ancrel.12040.desc.curators:0 "$ancrel.12040.desc.base$ Kể từ đó, họ sống trong những vùng lãnh thổ nhỏ lẻ và cống hiến hết mình cho việc bảo tồn những tri thức đã mất của nền văn minh, cuối cùng tiến hóa thành một trong những tổ tiên của tổ chức §H[curator_enclave_country.GetName]§! thời hiện đại."
 ancrel.12040.desc.meet_curators:0 "$ancrel.12040.desc.base$ Kể từ nay, họ sẽ sống trong những vùng lãnh thổ nhỏ lẻ, tận tụy bảo vệ những tri thức đã mất của nền văn minh. Chúng ta không biết kết cục của họ ra sao, nhưng một tinh thể dữ liệu cho thấy họ đang tiến về hệ sao §H[curator_poi.GetName]§!."
 ancrel.12040.desc.no_curators:0 "$ancrel.12040.desc.base$ Số phận cuối cùng của họ đã chìm vào dòng chảy lịch sử, nhưng có vẻ như họ từng dự định dành cả phần đời còn lại để bảo tồn những tri thức đã mất của nền văn minh mình."
 ancrel.12040.A:0 "Loài vi sinh vật hữu cơ này sẽ trở thành một thứ vũ khí rất lợi hại."
 ancrel.12040.B:0 "Cách ly hành tinh này, chỉ cho phép nghiên cứu một cách thận trọng."
 ancrel.12040.c.evopred: "Vi sinh vật ăn tạp đủ thứ ư? Họ hàng xa của các người đến đây."

 ancient_glassed_planet:0 "Hành tinh Thủy tinh"
 ancient_glassed_planet_desc:0 "Trong một quá khứ xa xăm, sinh quyển của hành tinh này đã bị hủy diệt triệt để, mọi dạng sống đều bị quét sạch."

 killer_librarian_organism:0 "Vi sinh vật Sát thủ"
 killer_librarian_organism_desc:1 "Lục quân của chúng ta được trang bị một loại vi sinh vật hữu cơ có khả năng nuốt chửng các mô sống của mọi sinh vật với tốc độ tàn bạo. Tất nhiên, việc sử dụng loại vũ khí này không thể bảo đảm an toàn tuyệt đối cho người dân vô tội xung quanh..."

 find_the_curators_title:0 "Di tích của Di tộc"
 find_the_curators_desc:0 "Cuộc điều tra của chúng ta cho thấy tàn dư của một nền văn minh chuyên tâm thu thập tri thức đã tìm kiếm nơi ẩn náu tại hệ sao §H[curator_poi.GetName]§!."
 poi_curator_location:0 "Nơi Trú Ẩn"
 poi_curator_location_desc: "Chúng ta cho rằng tàn dư của một nền văn minh chuyên tâm tích lũy tri thức từng tìm kiếm nơi trú ẩn tại đây."

 ## Ruined Station / Percussive Maintenance
 site_percussive_maintenance:0 "Trạm không gian bị phá hủy"
 site_percussive_maintenance_intro:0 "Một trạm không gian cỡ lớn nằm sát cạnh sao nơ-tron đang phát ra những chỉ số kỳ lạ. Mặc dù vị trí hiện tại khá ổn định, nhưng nó lại có dấu hiệu bị hư hại nặng nề. Vết cháy sém lan rộng cho thấy trong quá khứ nó từng bị tàn phá bởi vài vụ nổ cực lớn."

 ancrel.12000.name:0 "Thiết bị Thử nghiệm"
 ancrel.12000.desc:0 "[Root.Leader.GetName] cùng một nhóm nghiên cứu đã đổ bộ lên trạm không gian và xoay xở khôi phục nguồn điện ở một vài khu vực. Có vẻ như nơi này đã có người ở từ vài thế kỷ trước khi phe [Root.Owner.GetSpeciesNamePlural] bước vào kỷ nguyên không gian. Thoạt nhìn, đây có vẻ là một trạm không gian vũ trang, khẩu pháo siêu lớn chiếm phần lớn thể tích đã minh chứng cho điều đó. Tuy nhiên, đa số những khu vực còn lại dường như được thiết kế chuyên biệt cho mục đích nghiên cứu, chứng tỏ thứ vũ khí kia rất có thể mang tính thử nghiệm cao độ."
 ancrel.12005.name:0 "Hệ thống bị lỗi"
 ancrel.12005.desc:0 "[Root.Leader.GetName] không khỏi nhận thấy rằng một lượng lớn bất thường các hệ thống dường như không bị hư hại trong trạm lại liên tục gặp trục trặc với tần suất quá mức, ngay cả khi đã tính đến tuổi thọ của chúng.\n\nSau vô số lần tái kích hoạt chúng, những tiếng thét đau đớn vang lên từ kỹ thuật viên điện toán của đội: \"Cái gì? Tại sao? Làm sao thế này?!\" Tràng âm thanh thống thiết và không thể tin nổi cứ tiếp tục không dứt một hồi lâu trước khi [Root.Leader.GetSheHe] lắc đầu của [Root.Leader.GetHerHis] trong bất lực. \"Có vẻ như toàn bộ cơ sở này được chắp vá lại bằng băng dính dán ống nước,\" [Root.Leader.GetSheHe] nói. \"Tôi thực sự ngạc nhiên là nó từng hoạt động được đấy.\""
 ancrel.12005.desc.gestalt:0 "Chúng ta nhận thấy rằng, hàng loạt hệ thống có vẻ nguyên vẹn trên trạm không gian này lại gặp phải những lỗi nghiêm trọng với tần suất vượt xa dự đoán —— ngay cả khi tính đến tuổi thọ của chúng.\n\nSau một vài nỗ lực khởi động lại hệ thống trong vô vọng, một thợ bảo trì [root.GetIndividualNamePlural] của chúng ta đã bị sập nguồn nghiêm trọng: \"Vượt qua giới hạn thông số hợp lý,\" nó bắt đầu lặp đi lặp lại câu nói này. Tình trạng này kéo dài một lúc lâu, cuối cùng [root.GetIndividualName] đành từ bỏ nỗ lực, buộc chúng ta đi đến kết luận: thiết kế lập trình của cơ sở này vốn dĩ đã vô dụng. Chúng ta thậm chí không thể hiểu nổi làm sao cơ sở này từng có thể vận hành bình thường."
 ancrel.12005.A:0 "Cần tiến bước một cách cẩn trọng."
 ancrel.12005.B:0 "Thử đá một cú xem sao."
 percussive_maintainer_tooltip:0 "§HThợ bảo trì vật lý§! sẽ gia tăng tốc độ nghiên cứu trong lĩnh vực §HKhảo cổ học§! và §HMáy tính§!, với cái giá là §R-1§! §HGiới hạn cấp độ§!."
 ancrel.12010.name:0 "Chiến lược Rudari"
 ancrel.12010.desc:0 "Bất chấp tiến trình thường xuyên bị gián đoạn, [Root.Leader.GetName] đã có những bước tiến đáng kể trong việc giải mã công năng của trạm không gian này. Nhật ký cho thấy, những người kiến tạo nên nó - \"Rudari\" - đã kẹt trong cuộc chiến trường kỳ với chủng tộc hủy diệt có tên \"Borg-Mori\" —— một cuộc chiến mà họ sắp sửa thua trắng. Để lật ngược thế cờ trong nỗ lực tuyệt vọng cuối cùng, một nhóm chính trị gia Rudari cực đoan đã đưa ra kết luận rằng cách duy nhất để đảm bảo sự sống còn là xóa sổ hoàn toàn kẻ thù. Do không thể đánh bại hạm đội Borg-Mori bằng các biện pháp thông thường, họ đã tài trợ cho một dự án tuyệt mật, nhằm chế tạo ra một vũ khí laser có khả năng lợi dụng năng lượng từ các vì sao để bắn xuyên qua không gian giữa các hệ sao. Thế nhưng, dù có thể đổ rất nhiều tài nguyên vào vấn đề này, dự án lại được thiết lập khá vội vã và nguy hiểm rình rập khắp nơi —— từ phía kẻ thù, hay từ chính những phe phái trong chính phủ không chịu thỏa hiệp với những biện pháp cực đoan nhường này."
 ancrel.12010.A:0 "Nghe có vẻ quá mạo hiểm..."
 ancrel.12015.name:0 "Giấc mơ vụn vỡ"
 ancrel.12015.desc:0 "[Root.Leader.GetName] đã tìm thấy nhật ký cá nhân của sĩ quan khoa học trưởng người Rudari. Những dòng nhật ký này trông như một chuỗi lời than vãn về các yêu cầu bất khả thi của dự án, cũng như tiêu chuẩn an toàn và chất lượng ngày càng xuống dốc. \"Không có thời gian để thử nghiệm bất cứ thứ gì,\" bài viết cuối cùng ghi lại. \"Đây là nước cờ cuối cùng của giống loài chúng tôi, kẻ thù đã phát hiện ra chúng tôi. Chúng tôi chỉ đành hy vọng mọi chuyện dừng lại tại đây. Chúng đến rồi.\"\n\nNhật ký chỉ ra rằng vì ngay sau đó vũ khí đã được mang ra thử nghiệm, nên toàn bộ ghi chép đều kết thúc ở đây. Có bằng chứng cho thấy, siêu vũ khí đó chỉ thành công trong việc... phá hủy trạm không gian. Những người Rudari dường như đã mang theo bí mật về tọa độ của mình xuống mồ —— ngăn cản chúng ta đi tìm hậu duệ của họ.\n\nCấu trúc cũng như tình trạng tổng thể của trạm không gian đều không cho phép chúng ta mạo hiểm tái kích hoạt và hoàn thành dự án này. Mặc dù vậy, một vài ý tưởng mang tính đột phá được ứng dụng trong \"Laser Tử thần\" đã cung cấp một góc nhìn đầy giá trị cho các chuyên gia vũ khí của chúng ta."
 ancrel.12015.A:0 "Bọn họ thật sự quá xui xẻo..."
 ancrel.12015.A.mat:0 "Một đài tưởng niệm cho thứ kế hoạch dự án tồi tệ."
 ancrel.12015.A.phobe:0 "Bất hạnh của chúng là món quà của ta."
 ancrel.12015.A.devourer:0 "Thật đáng tiếc - chúng ta sẽ vĩnh viễn không được nếm thử mùi vị máu thịt của chúng."
 ancrel.12015.A.machine:0 "Đây chính là hành vi ngu ngốc của những kẻ phàm phu xốc nổi."

 rudari_death_laser:0 "Laser Tử thần Rudari"
 rudari_death_laser_desc:0 "Khi nền văn minh đang sụp đổ trước các đợt tấn công dữ dội của quân thù, người Rudari đã cố gắng chế tạo một loại vũ khí laser có khả năng triển khai xuyên hệ sao. Dù những nỗ lực của họ đã thất bại, nhưng nghiên cứu này lại cực kỳ hữu ích cho các chuyên gia vũ khí của chúng ta."

 abandoned_weapon_station:0 "Trạm vũ trang bỏ hoang"
 abandoned_weapon_station_desc:0 "Một trạm vũ trang bỏ hoang đang xoay quanh quỹ đạo tầm thấp của [star.GetName]."

 ancrel.12060.name:0 "Hệ sao [From.GetName]"
 ancrel.12060.desc:0 "Hệ sao [From.GetName] bị bao phủ bởi một thứ ánh sáng kỳ dị. [Root.GetName] đột ngột xuất hiện ở một khu vực trong hệ, và chúng ta có thể chắc chắn rằng nền văn minh thiên hà chưa từng đặt chân đến đây trong suốt nhiều thế hệ, hay thậm chí là hàng ngàn năm qua.\n\nNhưng khoan đã, máy dò của chúng ta vừa phát hiện một tín hiệu năng lượng! Nó tập trung chủ yếu ở hành tinh thứ nhất của hệ, một nơi chả có vẻ gì là sống được khi nằm ngay sát sao neutron. Nhưng hình như còn có những tín hiệu khác đang di chuyển. Chúng nhắm thẳng về phía [Root.GetName], vũ khí đã lên nòng!"
 ancrel.12065.name:0 "Đại thắng tại [fromfrom.System.GetName]"
 ancrel.12065.desc:0 "Chúng ta đã đánh bại nhóm phòng vệ của [fromfrom.System.GetName]. Cảnh tượng trong hệ sao này thật quái gở: vật chất rắn gần như không tồn tại, ngay cả vành đai tiểu hành tinh cũng nát bấy, giống như đã bị khai thác cạn kiệt đến tận cùng. Một loạt các thiết bị khổng lồ xếp cách nhau những khoảng đều đặn bay quanh hành tinh, và cái hành tinh trơ trọi phát ra tín hiệu đó rất có thể là nhân tạo. Từ đó tỏa ra nguồn năng lượng cực mạnh. Nếu có manh mối nào thì chắc chắn nó nằm ở đó."

 site_ancient_robot_world:0 "Hành tinh người máy cổ đại"
 site_ancient_robot_world_desc:0 "Hành tinh trơ trọi trong hệ sao [From.Planet.System.GetName] này nhung nhúc các thiết bị tự hành. Chúng chẳng thèm đoái hoài gì đến chúng ta, cứ tất bật làm việc của riêng mình. Nếu có manh mối gì về hệ sao kỳ quặc này thì nhất định phải tìm ở đó."
 ancrel.12070.name:0 "Sự sống nhân tạo chen chúc"
 ancrel.12070.desc:0 "Cho đến nay, những gì mà [Owner.GetResearchers] của chúng ta có thể kết luận là, cái hành tinh mà họ xui xẻo gọi là '§YTrạm quan sát§!' này chưa từng có dấu vết của sự sống. Nhưng hoạt động trên đó thì không thiếu. Bề mặt ken đặc các công trình, vô số kiến trúc nhân tạo san sát nhau trên nền đá cằn cỗi, những dãy nhà ngay ngắn này phủ kín gần ba phần tư bề mặt hành tinh. Hàng trăm triệu thiết bị tự hành đang lo việc bảo trì, làm đủ mọi việc từ quét dọn đơn giản cho đến vận hành cả một dây chuyền lắp ráp cực kỳ phức tạp.\n\nTuy nhiên, mục đích thật sự của chúng vẫn chưa rõ ràng. [Owner.GetResearchers] của chúng ta chuẩn bị đưa một đội xuống bề mặt để tìm hiểu thêm."
 ancrel.12075.name:0 "Khảo sát thiết bị tự hành"
 ancrel.12075.desc:0 "Đám máy móc này chẳng thèm để tâm đến [Owner.GetResearchers] của chúng ta, dù có đi lướt qua mặt thì chúng vẫn cứ làm theo lệnh của mình. Mọi nỗ lực kết nối với các thiết bị tự hành này đều thất bại, ngay cả việc cố tình cản trở công việc của chúng cũng chẳng ăn thua, chúng thậm chí chẳng buồn né mà cứ thế ủi thẳng vào những [Owner.GetResearchers] đang ngáng đường, gây ra thương tích nghiêm trọng.\n\nSau vụ đó, [Owner.GetResearchers] của chúng ta chuyển hướng sang nghiên cứu phần mềm điều khiển đám máy móc này. Bằng cách phân tích các tín hiệu chặn được, chúng ta đoán rằng có một hệ thống trung tâm đang thao túng tất cả. Tuy nhiên, việc giải mã nó cực kỳ khó nhằn, có lẽ khó mà moi thêm được gì nữa."
 ancrel.12080.name:0 "Khám phá hệ sao"
 ancrel.12080.desc:0 "Dù [Owner.GetResearchers] của chúng ta khó lòng đào sâu thêm về hành tinh này, nhưng vẫn còn một đội đang tiếp tục nghiên cứu mạng lưới các vật thể nằm rải rác khắp hệ sao. Có tổng cộng hơn mười ngàn vật thể như thế, phần lớn là các thiết bị hình trụ dài, có vẻ vẫn đang hoạt động và liên tục gửi tín hiệu về hành tinh. Dựa vào hình dáng và việc chúng luôn hướng về mọi điểm trong thiên hà của chúng ta mà không có ngoại lệ, chúng ta buộc phải đi đến kết luận rằng đây là một mạng lưới máy dò khổng lồ đến mức phi lý. Nhưng ai đã làm ra nó cơ chứ?"
 ancrel.12085.name:0 "Giăng bẫy"
 ancrel.12085.desc:0 "Trong một nước đi táo bạo, [Owner.GetResearchers] của chúng ta đã tranh thủ lúc không có thiết bị tự hành nào xung quanh để gài máy nghe lén vào một cổng kết nối máy chủ của chúng. Vụ xâm nhập này hiện vẫn chưa bị phát hiện, ấn tượng của chúng ta về nó là một hệ thống tinh vi tột bậc, thậm chí vượt xa mạng lưới của chúng ta, nhưng lại chẳng thèm bận tâm đến việc tự vệ. Không còn nghi ngờ gì nữa, có lẽ họ nghĩ rằng sức mạnh răn đe của đám hạm đội phòng thủ kia là quá đủ rồi. Dù vậy, hệ thống mà chúng ta vừa luồn lách vào đồ sộ đến mức khó tin, ngay cả từ 'đồ sộ' cũng trở nên nhạt nhẽo khi dùng để tả một mạng lưới bao trùm cả một hành tinh, vì vậy chúng ta sẽ cần thêm chút thời gian để thu thập thông tin."
 ancrel.12090.name:0 "Siêu máy tính giám sát"
 ancrel.12090.desc:0 "Hệ thống tự động ở $NAME_Ultima_Vigilis$ có vẻ còn lâu đời hơn cả những gì chúng ta có thể tưởng tượng. Chúng ta đã bẻ khóa vào hệ thống này và lấy được dữ liệu, nhưng trong đó chẳng có thông tin nào giúp xác định ai là người tạo ra nó hay mục đích cuối cùng của họ là gì. Điều duy nhất chúng ta có thể chắc chắn về những người xây dựng hệ thống là họ đã đến đây từ ít nhất 1,2 tỷ năm trước, và sau khi xây xong hệ thống cũng như thiết lập nó thành một trạm quan sát cả thiên hà, họ đã rời đi.\n\nĐáng nói là, sau ngần ấy năm trời, hệ thống này vẫn chạy. Mạng lưới thiết bị rải khắp hệ sao thực chất là những máy dò vô cùng tinh vi, chúng sẽ gửi dữ liệu trực tiếp về hành tinh, và hệ thống xử lý trung tâm ở đây sẽ biến những dữ liệu đó thành dạng mà các thiết bị tự hành có thể cất giữ lâu dài. Do bị kẹt về không gian lưu trữ và thiếu thốn vật tư, có vẻ họ đã dốc sức nâng cấp công nghệ nén dữ liệu. Cấu trúc khổng lồ trên hành tinh này tự nhận là đã lưu toàn bộ dữ liệu quan sát từ lúc mới xây, nhưng chúng ta lại chẳng thể kiểm chứng, bởi vì mớ dữ liệu này bị nén quá mức, vượt ngoài khả năng giải nén của chúng ta rồi.\n\nĐáng ngại là, dù tần suất gửi đã giảm, nó vẫn đang đều đặn phát sóng các luồng dữ liệu 'trọng tâm' ra bên ngoài. Nhưng đã lâu thế rồi, chắc cũng chẳng còn ai nghe đâu nhỉ? Dù sao thì, chúng ta cũng đã chuẩn bị sẵn phần mềm để giành quyền điều khiển đám máy móc này, chỉ cần to gan một chút, chúng ta có thể ngay lập tức đập đi xây lại hệ thống này theo ý mình."
 ancrel.12090.A:0 "Chúng ta có thể sáp nhập trọn bộ hành tinh này vào hệ điều hành của riêng mình."
 ancrel.12090.B:0 "Cứ để chúng làm tiếp, chúng ta có thể rút lấy dữ liệu của chúng."
 ancrel.12090.C: "Đem chia đám thiết bị tự hành này cho các hành tinh của chúng ta."
 ancrel.12090.C.machine.tooltip: "§G8K§!£pop£§HDân số máy móc§! sẽ được chia đều cho các hành tinh của chúng ta."
 ancrel.12090.C.mechanical.tooltip: "§G8K§!£pop£§HDân số cơ khí§! sẽ được chia đều cho các hành tinh của chúng ta."
 ancrel.12090.D:0 "Nhưng đây là cả một kho hợp kim khổng lồ đấy!"
 ancrel.12090.E:0 "Cái mạng lưới đang chạy êm ru này có thể làm công cụ cho chúng ta."
 ancrel.12090.E.tooltip:0 "Hệ sao §Y[From.Planet.System.GetName]§! sẽ do một quốc gia §YTrí tuệ Máy móc§! cai quản, và họ sẽ trở thành chư hầu của chúng ta. Thủ đô của họ, §Y[From.Planet.GetName]§!, sẽ trở thành một §YHành tinh Máy móc§! mang theo §G8K§!£pop£§HDân số máy móc§!."

 ancrel.12095.desc:0 "“Các người chẳng mảy may bận tâm——”\n\n§BLuồng dữ liệu truyền tải bị nhiễu một lúc, không thể xuất ra thông tin có nghĩa.§!\n\n“Các người không nghĩ đến việc đang có kẻ nhận cái luồng dữ liệu mà các người thẳng tay cắt phăng đi sao? Được thôi, vì các người đã tự chứng minh bản thân là một lũ sâu bọ nguy hiểm và hiếu chiến... vậy thì đến lúc phải gọi bên §Rdiệt bọ§! đến rồi. Chuẩn bị đón ngày tàn đi.”"
 ancrel.12095.A:0 "Chúng ta sẽ sống sót."
 ancrel.12095.B:0 "Ngắt kết nối."
 ancrel.12095.tooltip:0 "§RCó thể sắp có chuyện tồi tệ xảy ra...§!"
 ancrel.12100.A:0 "Rốt cuộc là cái gì?"

 ancrel.8200.name:0 "Giảm áp đột ngột"
 ancrel.8200.intro:0 "Trong quá trình điều tra trạm không gian tại hệ sao [System.GetName], đội ngũ vô tình làm mất tính toàn vẹn của một khu vực trên thân tàu, gây ra tình trạng sụt áp phát nổ."
 ancrel.8200.desc:0 "$ancrel.8200.intro$\n\nTất cả mọi người đều bất lực —— chỉ trong nháy mắt, §H[dead_scientist.GetName]§! và một vài [Root.Owner.GetArchaeologistPlural] khác đã bị cuốn vào lỗ thủng, dẫn đến cái chết tức tưởi của họ."
 ancrel.8201.desc:0 "$ancrel.8200.intro$\n\nChỉ trong nháy mắt, vài [Root.Owner.GetArchaeologistPlural] đã bị cuốn vào lỗ thủng, dẫn đến cái chết của họ. Thật may là §H[Root.GetLeaderName]§! lúc đó đang ở một khu vực khác của trạm không gian, thế nhưng đây vẫn là một bước lùi nghiêm trọng cho cuộc điều tra."
 ancrel.8202.desc:0 "$ancrel.8200.intro$\n\nMay mắn thay, do đội ngũ của chúng ta đã kịp tẩu thoát sang các khu vực chưa bị ảnh hưởng trên trạm không gian nên không ai thiệt mạng. Có vẻ như cũng không có thiết bị quan trọng nào bị hư hại, do đó cuộc điều tra sẽ không phải chịu thêm bất kỳ tổn thất đáng tiếc nào."
 ancrel.8202.desc.robot:0 "$ancrel.8200.intro$\n\nMay mắn thay, các [Owner.GetArchaeologistPlural] của chúng ta đều bình an vô sự vì chúng được chế tạo để có thể tồn tại trong môi trường chân không một khoảng thời gian. Chính vì thế, họ vẫn có thể trơn tru tiếp tục công việc của mình."
 ancrel.8203.desc:0 "$ancrel.8200.intro$\n\nMay mắn thay, do đội ngũ của chúng ta đã kịp tẩu thoát sang khu vực chưa bị ảnh hưởng nên không có thương vong nào xảy ra. Tuy nhiên, lực sụt áp đã phá hủy vài bảng điều khiển mà họ đang dùng để làm việc, và giờ đây sẽ phải ngốn một số vốn liếng khổng lồ để sửa chữa."
 ancrel.8203.desc.robot:0 "$ancrel.8200.intro$\n\nMay mắn thay, các [Owner.GetArchaeologistPlural] của chúng ta đều bình an vô sự vì chúng được chế tạo để có thể tồn tại trong môi trường chân không một khoảng thời gian. Tuy nhiên, lực sụt áp đã phá hủy vài bảng điều khiển mà họ đang làm việc, cần phải bơm một số tiền lớn vào để khắc phục."
 ancrel.8203.A:0 "Chúng ta sẽ cung cấp mọi khoản tài trợ mà họ cần."
 ancrel.8203.B:0 "Sự cố này sẽ làm chúng ta chậm trễ một thời gian."
 ancrel.8210.1.desc:1 "Chúng ta đã tiến hành nghiên cứu một cách bền bỉ tại khu di tích trạm không gian ở hệ sao [fromfrom.planet.system.GetName], qua đó khám phá ra một số ít vật phẩm đồ cổ cất giấu bí mật. Trưởng nhóm khảo cổ [root.leader.GetName] đã khai quật được vài di vật hiếm có từ trong số đó."
 ancrel.8210.2.desc:1 "Khi các [Root.Owner.GetArchaeologistPlural] của chúng ta đang xem xét một bảng điều khiển gần đó, một mảng tường của trạm không gian đột ngột đổ sập. Thế nhưng, hóa ra chúng ta lại vớ bở, một ngăn chứa bí mật cất giấu vài món di vật quý hiếm đã lộ diện ngay sau đó."

 ancrel.8215.name:0 "Đóng băng hệ thống"
 ancrel.8215.desc:0 "Lúc đang kiểm tra các thiết bị điện tử trên trạm không gian, một [Owner.GetArchaeologistPlural] của chúng ta đã vô tình kích hoạt hệ thống an ninh vốn dĩ vẫn còn hoạt động được thiết lập bởi những người sáng tạo ra nó. Điều này dẫn đến việc cả đội bị chặn đứng bên ngoài hệ thống của trạm không gian trong một thời gian dài cho đến khi tìm được biện pháp khắc phục chuẩn xác."
 ancrel.kick_it:0 "Thử đá một cú xem sao."

 site_polaris_seed_vault:0 "Hy vọng cuối cùng"
 polaris_seed_vault_desc:0 "Trôi dạt trên bề mặt đại dương trong veo như pha lê của tàn tích hành tinh [From.Planet.GetName], bị bọc kín trong một mảng băng nhỏ bé, trông có vẻ là một công trình nhân tạo.\n\nCần một đội ngũ để tiến hành khai quật công trình này."

 ancrel.13000.name:0 "Bữa tiệc lạnh lẽo"
 ancrel.13000.desc:0 "Sau khi kẻ xâm lăng Polaris cuối cùng bị hạ gục, hạm đội của chúng ta đã thực hiện quét tổng thể toàn hệ sao lần cuối trước khi lui về căn cứ, và vô tình phát hiện ra một số điểm dị thường. Trên hành tinh Polaris II, cảm biến định vị được các khối kim loại nặng đang xếp thành cấu trúc nhân tạo. Điều thú vị là trong số các kết cấu này, dường như chỉ có một cái nổi lềnh bềnh trên đại dương, còn tất thảy đều chìm sâu dưới mặt nước. Chúng ta hoài nghi đây là kiệt tác của người ngoài hành tinh."

 ancrel.13005.name:0 "Tảng băng trôi"
 ancrel.13005.desc:0 "Bản thân tảng băng đang trôi giạt này lại ẩn chứa một khối chữ nhật khổng lồ màu đen xì, cấu tạo từ loại hợp kim y hệt xác hạm đội vũ trụ bên trên. Các chuyên gia sông băng của chúng ta đánh giá, dẫu cho \"rất khó để nhận định với khí quyển ngoài hành tinh\", thì sự hình thành của tảng băng này ít nhất cũng phải có niên đại một ngàn năm. Kết quả quét bên trong cấu trúc cho thấy có số lượng đáng kể tín hiệu sinh học, vì thế không khuyến khích việc sử dụng các thiết bị có tính phá hoại.\n\nCả đội sẽ phải băng qua các mỏm đá đóng băng để tiếp cận nơi có vẻ là lối vào của công trình."
 acnrel.13005.a:0 "Vậy thì cứ thế mà tiến xuống."

 ancrel.13010.name:0 "Cánh cửa sương giá"
 ancrel.13010.desc:0 "Chúng ta đã lập ra một doanh trại ngay tại lối vào cơ sở của [From.Planet.GetName]. Ở đó có một vài đoạn văn bản dường như được khắc trên các bức tường của tòa nhà. Bây giờ chúng ta sẽ bắt tay vào một công đoạn gian khổ nhằm mở toang cánh cửa này ra mà không làm sứt mẻ gì bên trong. Trong khi đó, các chuyên gia ngôn ngữ học dị tộc của chúng ta sẽ cố gắng dịch lại đoạn văn bản bằng thứ ngôn ngữ thất truyền của người ngoài hành tinh này."

 ancrel.13015.name:0 "Đào mộ"
 ancrel.13015.desc:0 "Đến lúc rồi, chúng ta đã sẵn sàng gỡ bỏ phong ấn cho công trình khối đen này, theo bản dịch sơ bộ từ trên tường thì nó được xưng tụng là \"Hầm trú ẩn\". Những người Polaris tạo nên cái hầm này xem nó như phương sách cuối cùng để gìn giữ kho báu của họ. Khi cánh cửa mở ra, chào đón chúng ta là —— dựa vào dữ liệu cảm biến —— một môi trường có bầu khí quyển được kiểm soát rất sát với không khí bên ngoài, chỉ khác là lượng khí cacbonic ít hơn hẳn."

 ancrel.13020.name:0 "Kho báu chôn giấu"
 ancrel.13020.desc:0 "Hạt giống cổ đại! Phôi thực vật —— đó chính là kho báu mà người Polaris đã vùi lấp trong cái hầm này. Những thông tin được dịch thêm cho thấy, bọn người ngoài hành tinh này đã làm một việc quái gở là bơm không ngừng một lượng khí CO2 khổng lồ vào bầu khí quyển của họ. Khi diễn biến khí hậu đạt đến ngưỡng không thể cứu vãn, những cư dân cổ đại của hành tinh này đã vơ vét mọi cá thể thực vật không thể thích nghi với môi trường mới rồi đem đông lạnh tất cả tại đây.\n\nLúc bấy giờ, cả hành tinh chìm trong biển băng; giờ đây, chỉ còn lại mỗi tảng băng cô quạnh này. Thế nhưng, công sức của họ cũng không uổng phí —— với danh mục phân loại chi tiết của toàn bộ hệ sinh thái thực vật trên hành tinh, các nhà khoa học của chúng ta sẽ nhận được nguồn trợ lực lớn trong việc giải quyết những vấn đề sinh học trong tương lai."
 ancrel.13020.a:0 "Gửi ngay mấy mẫu vật này cho giới khoa học của chúng ta."
 ancrel.13020.b.evopred: "Không chỉ phân loại rõ ràng mà lại còn dễ dàng nhân bản sao? Căn hầm này quả đúng là món quà trời ban cho chúng ta."

 ancrel.13025.desc:0 "Vi sinh vật hữu cơ! Cả vi khuẩn có lợi lẫn có hại. Tất cả các sinh vật nhân thực và sinh vật nhân sơ. Tất thảy đều được dán nhãn và phân loại cẩn thận trong một kho chứa cao cấp: Đây chính là khối tài sản khổng lồ mà người Polaris cất giữ dưới căn hầm này. Phần nội dung dịch thêm cho biết, lũ người ngoài hành tinh kỳ dị này đã bơm một lượng khí CO2 khổng lồ vào bầu khí quyển của mình. Ngay khi khí quyển có những biến đổi không thể đảo ngược, những cư dân cổ xưa của hành tinh này sẽ gom nhặt toàn bộ số vi sinh vật không thể thích nghi với môi trường mới và mang chúng đến đây đông lạnh.\n\nVào thời điểm đó, khắp hành tinh chỉ toàn băng là băng; còn bây giờ thì chẳng đọng lại gì ngoài cái tảng băng nhỏ trơ trọi này. Mặc dù vậy, nỗ lực của họ chắc chắn sẽ không trở nên vô ích —— khi có trong tay toàn bộ hồ sơ vi sinh thái của hành tinh này, các [Root.Owner.getscientistplural] của chúng ta sẽ được hỗ trợ đáng kể trong quá trình khai phá hành tinh mới cũng như cải tạo lại thuộc địa."
 ancrel.13025.desc.machine:0 "Vi sinh vật hữu cơ. Tất cả vi khuẩn có lợi và có hại, tất cả sinh vật nhân thực và sinh vật nhân sơ. Được đánh dấu và phân loại: Đây chính là kho báu mà người Polaris cất giấu trong kho bảo hộ này. Thông tin được phiên dịch thêm tiết lộ rằng, những người ngoài hành tinh này một cách quái đản đã liên tục nạp khí CO2 quá mức vào bầu khí quyển của họ. Một khi khí quyển trải qua những thay đổi vĩnh viễn, cư dân cổ đại của hành tinh này đã thu gom mọi vi sinh vật mà họ có thể tìm thấy không thể sinh tồn trong môi trường mới, và đông cứng tất cả chúng tại đây.\n\nLúc bấy giờ, toàn bộ hành tinh bị bao phủ bởi băng tuyết; hiện nay, chỉ còn sót lại tảng băng trôi đơn độc này. Tuy nhiên, nhờ nỗ lực của họ —— những sinh vật đã được phân loại sẵn sẽ khiến việc trích xuất thông tin liên quan trở nên dễ dàng hơn nhiều."

 ancrel.13030.name:0 "Khung cảnh rợn người"
 ancrel.13030.desc:1 "Tối hôm kia, trưởng nhóm khảo cổ [From.Leader.GetName] báo cáo đã chứng kiến những ảo ảnh rợn người, và đã tự nhốt mình trong phòng cho tới tận bây giờ. Họ cho rằng chính thứ gì đó ở chỗ này đã gây ra cớ sự này..."
 ancrel.13030.a:0 "Điềm chẳng lành."

 polaris_biology_modifier:0 "Nghiên cứu hạt giống Polaris"
 polaris_habitability_modifier:0 "Nghiên cứu vi sinh vật hữu cơ Polaris"
 d_polaris_city:0 "Thành phố Cổ đại chìm đắm"
 d_polaris_city_desc:0 "Các thành phố của người Polaris từng bao phủ khắp đại dương đóng băng, trước khi phần móng băng tan chảy."

 #Fumongus
 site_fumongus_dig:0 "Mất nước"
 site_fumongus_intro:0 "Chúng ta đã phát hiện ra các dấu hiệu của nước ở khắp nơi trên hành tinh. Theo như chúng ta biết, lượng nước này lẽ ra vẫn phải ở đây. Nhiệt độ của hành tinh nằm trong phạm vi bình thường để duy trì nước ở dạng lỏng, và bầu khí quyển dù mỏng manh nhưng vẫn tồn tại. Tuy nhiên, mọi thứ ở đây đều khô cằn, các thảm thực vật tồn tại cũng đã chết khô.\n\nNgoài ra, dữ liệu quét còn hé lộ dấu vết của một nền văn minh giữa các vì sao khác từng hiện diện trên hành tinh. Đội khảo cổ sẽ có hai mục tiêu chính: khám phá xem chuyện gì đã xảy ra với nguồn nước, và tìm hiểu những lữ khách không gian kia đã giở trò gì ở nơi này. Đa phần các giả thuyết đều cho rằng hai chuyện này có mối liên hệ với nhau, một vài người trong đội còn đinh ninh đây có thể là kiệt tác của đám \"Kẻ trộm nước\"."

 #Random Event - Fungal zombies
 ancrel.8300.intro:0 "Chuyến thám hiểm của các [Root.Owner.GetArchaeologistPlural] trên hành tinh [From.Planet.GetName] đã làm náo động xác kén thối rữa của lũ động vật hoang dã bản địa, giờ đây chúng có vẻ như đang bị chi phối bởi các loài nấm ký sinh. Những Thây ma Nấm này đã xồ tới tấn công chúng ta ngay lập tức, hiển nhiên là bị hấp dẫn bởi nguồn nước dồi dào từ khu cắm trại cũng như từ chính cơ thể chúng ta."
 ancrel.8300.critical:0 "Trước khi đội an ninh kịp thiêu rụi bọn chúng, đám Thây ma đã nhanh chóng tước đi sinh mạng của §H[dead_scientist.GetName]§!. Tất cả những gì còn sót lại chỉ là những cái xác chết khô queo."
 ancrel.8300.failure:0 "Trước khi bị [Root.GetLeaderName] ngăn lại, lũ thây ma đã hạ sát một vài §H [Root.Owner.GetArchaeologistPlural]§!. Lúc chúng ta tìm cách đưa thi thể của họ về, những xác chết héo hon ấy đều đã tan tành thành từng mảnh."
 ancrel.8300.success:0 "Đội ngũ vệ binh gần §H[Root.GetLeaderName]§! đã kiểm soát được tình hình một cách thần kỳ trước khi đám thây ma gây ra bất cứ mối hiểm họa nào."
 ancrel.8300.pay:0 "Bầy thây ma tạm thời đã bị khống chế, nhưng không có cách nào lách qua chúng được. Biết đâu dùng một lượng nước kha khá có thể dụ bọn chúng tản ra."
 ancrel.8300.name:0 "Thây ma Nấm"
 ancrel.8300.desc:0 "$ancrel.8300.intro$\n\n$ancrel.8300.critical$"
 ancrel.8305.desc:0 "$ancrel.8300.intro$\n\n$ancrel.8300.failure$"
 ancrel.8310.desc:0 "$ancrel.8300.intro$\n\n$ancrel.8300.success$"
 ancrel.8315.desc:0 "$ancrel.8300.intro$\n\n$ancrel.8300.pay$"
 ancrel.8315.a:0 "Cứ làm thế đi."
 ancrel.8315.b:0 "Tìm một hướng đi khác loanh quanh đó."

 #Digsite Chapters

 ancrel.13100.name:0 "Kẻ tích nước"
 ancrel.13100.desc:0 "Việc phát hiện ra một hẻm núi khổng lồ ngập tràn nấm trên [From.Planet.GetName] chính là sự khởi đầu cho mọi lời giải đáp. Hóa ra nước đều nằm cả trong những cây nấm này. Chúng dường như đã bành trướng ra một vùng lớn trên bề mặt hành tinh, và tất cả đều liên kết với cùng một hệ sợi nấm. Xét về mặt kỹ thuật, nó được coi là một thực thể sống duy nhất, và cũng là một trong những thực thể lớn nhất mà chúng ta từng chứng kiến. Một vài thành viên trong đội đã gọi loại nấm khổng lồ này là \"Nấm Khổng lồ\".\n\nCó vẻ như loài nấm này đã trải qua quá trình biến đổi gen và chiếm đoạt hoàn toàn hệ sinh thái từng hiện diện nơi đây. Chúng tăng tốc độ phát triển một cách điên cuồng, đến mức hút sạch phần lớn lượng nước trên hành tinh. Sau đó, chúng chuyển sang trạng thái ngủ đông khô héo, ở trạng thái này đa số các cây nấm vẫn còn sống và lượng nước được phân bổ đều khắp cơ thể sinh vật."
 ancrel.13105.name:0 "Boongke bị vùi lấp"
 ancrel.13105.desc:0 "Sâu bên trong khu rừng sợi nấm ngụ tại hẻm núi của [From.Planet.GetName], chúng ta đã phát hiện ra một dạng boongke, vốn đã bị lũ nấm vùi lấp từ lâu. Cả đội tin rằng nó được xây dựng bởi chính cái chủng tộc đã tiến hành biến đổi gen những cây nấm ở đây.\n\nPhần lớn boongke đã sụp đổ, nhiều thiết bị bên trong có lẽ đã hỏng hóc tới mức không thể cứu vãn, nhưng chúng ta vẫn xác định được một vài căn phòng đóng kín có thể chứa những vật liệu hữu ích. Đáng chú ý là không phát hiện thấy bất kỳ di hài nào của người ngoài hành tinh ở đây. Rất có thể họ đã rời bỏ nơi này, hoặc cũng có thể tất cả đều đã bị thảm thực vật hoang dã bản địa hấp thụ."
 ancrel.13110.name:0 "Kẻ cải tạo nấm"
 ancrel.13110.desc:0 "Căn boongke trên [From.Planet.GetName] được dùng để bảo vệ hệ thống thiết bị điện toán, một vài trong số đó dường như được kết nối trực tiếp với hệ sợi nấm. Rất may là chúng ta đã nỗ lực khởi động lại được một vài trạm đầu cuối và cơ sở dữ liệu.\n\nViệc giải mã hệ thống và phá giải ngôn ngữ được sử dụng sẽ ngốn khá nhiều thời gian, đội khảo cổ đã yêu cầu điều động một vài [Root.Owner.GetLinguists] hàng đầu của chúng ta đến để trợ giúp."
 ancrel.13115.name:0 "Từ bào tử nấm đến dòng mã"
 ancrel.13115.desc:0 "Chúng ta đã trích xuất được những thông tin đắt giá từ cơ sở dữ liệu trong boongke tại [From.Planet.GetName]. Cơ sở dữ liệu cho thấy đây từng là một dạng tiền đồn nghe lén. Rõ ràng là những kẻ ngoài hành tinh kia đã tìm ra cách lý giải các luồng tín hiệu truyền dẫn qua hệ sợi nấm và chuyển hóa chúng thành những thông tin tình báo hữu ích.\n\nChúng ta hoàn toàn mù tịt về cách thức hoạt động của nó, nhưng cả đội hiện đang thử vận chuyển nước từ vành đai tiểu hành tinh băng giá gần đó để \"đánh thức\" cây Nấm Khổng lồ một lần nữa, xem thử nếu có dữ liệu truyền đi thì đó là loại dữ liệu gì."
 ancrel.13120.name:0 "Không còn khô cằn"
 ancrel.13120.desc:0 "Nấm trên [From.Planet.GetName] lại bắt đầu sinh sôi nảy nở. Với sự hỗ trợ từ một vài con tàu khác, chúng ta đã phải kéo bổng vài tiểu hành tinh băng vào quỹ đạo, rồi thả những tảng băng khổng lồ rơi rải rác khắp hành tinh cho chúng tan chảy. Quá trình này ngốn không ít thời gian, nhưng bù lại thì nó cũng đã bước đầu đơm hoa kết trái.\n\nNhờ vậy, máy tính bắt đầu phun ra những mảnh dữ liệu nhỏ lẻ vô cùng ngẫu nhiên, cho tới lúc chúng ta bóc tách được luồng tín hiệu phát ra từ ngay hành tinh mẹ của mình. Qua một loạt các bước thử nghiệm phối hợp với đội ngũ tại [Root.Owner.Capital.GetName], kết luận duy nhất là lũ nấm có hiểu biết nhất định về những gì đang diễn ra ở các hành tinh khác. Mặc dù mớ dữ liệu chúng ta thu hồi được hiện tại chưa thể dùng được, nhưng có nhiều hy vọng rằng việc tiếp tục khôi phục lại các cây nấm sẽ đem đến nhiều bất ngờ hơn."

 #Final event

 ancrel.13135.intro:0 "Mạng lưới nghe lén bằng sợi nấm rốt cuộc cũng có thể hoạt động được. Một khối lượng nước khổng lồ đã được chở đến từ trên quỹ đạo để giải tỏa cơn khát cho lũ nấm, ngoài ra hệ thống tài nguyên điện toán cũng đã nhận được các đợt nâng cấp thiết yếu."
 ancrel.13135.mid:0 "Xem xét dựa trên dung lượng thông tin được gửi gắm, số lượng các luồng tín hiệu lướt qua mạng lưới lại thấp tới mức bất ngờ. Giả thuyết mang tính trọng tâm nhất cho rằng Nấm Khổng lồ đang tồn tại qua nhiều chiều không gian, mà trong những chiều không gian này khoảng cách lại hoàn toàn khác biệt với những gì chúng ta vẫn quan niệm.\nTrong mọi trường hợp, Nấm Khổng lồ hoàn toàn có thể thiết lập giao tiếp với các thế hệ con cháu trải khắp thiên hà của nó, những quần thể nhỏ lẻ này đều có năng lực truyền tải dữ liệu, và chúng ta có thể bóc tách để phân tích số dữ liệu đó."

 ancrel.13135.name:0 "Nấm Khổng lồ lại tiếp tục nghe lén"
 ancrel.13135.desc:0 "$ancrel.13135.intro$\n\nTuy vậy vẫn còn sót lại một vài ẩn số, suy cho cùng chúng ta vẫn chưa rõ bằng cách nào mà lũ nấm lại có thể thu thập được một lượng dữ liệu đồ sộ nhường này từ các nơi khác trong thiên hà. $ancrel.13135.mid$\n\nKhi mạng lưới đã có thể vận hành trơn tru trở lại, quyết định duy nhất lúc này là liệu chúng ta có nên lợi dụng nó làm công cụ do thám hay không."
 ancrel.13135.a:0 "Bắt đầu do thám."
 ancrel.13135.a.evopred: "Vừa biết nghe lén lại vừa biết báo cáo. Lẽ ra chúng ta cũng nên học lỏm mấy trò tương tự."
 ancrel.13135.b:0 "Mặc kệ cây nấm này đi."

 #Final event variation

 ancrel.13130.name:0 "Kính sợ cây nấm cổ đại"
 ancrel.13130.desc:0 "$ancrel.13135.intro$\n\nTuy nhiên, những hiểu biết của chúng ta về mạng lưới sợi nấm này vẫn còn quá ít ỏi. $ancrel.13135.mid$ Nhưng liệu còn ai khác có đặc quyền truy cập vào mạng lưới này nữa? Có vô vàn những luồng dữ liệu mà chúng ta không tài nào gắn kết được với bất kỳ hệ sao nào trong thiên hà. Đám [Root.Owner.GetScientistPlural] luôn nhìn đời bằng con mắt bi quan thì một mực tin rằng chúng ta chẳng phải những kẻ duy nhất đang nghe lén, việc tái kích hoạt lại mạng lưới chỉ càng khiến chúng ta phơi bày vị trí trước tất thảy những kẻ đang sử dụng mạng lưới này.\n\nXét trên thực tế rằng chúng ta vẫn chưa thể hiểu tường tận về Nấm Khổng lồ, cũng như cái chủng loài đã từng tiếp xúc với nó trước đây, thì tốt hơn hết cứ mặc kệ nó."
 ancrel.13130.a:0 "Đúng là lũ ngốc hoang tưởng. Chúng ta nên sử dụng nó."
 ancrel.13130.b:0 "Mặc kệ cây nấm này đi."
