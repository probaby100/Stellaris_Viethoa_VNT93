 cybernetic.trait.a:0 "\nBộ Điều Chỉnh Xác Suất"
 psionic.trait.a:0 "\nThấu Triệt Vô Định"
 paragon.have.utopia.ascensions:0 "\n§GĐặc quyền Thăng hoa Chủng tộc hiện đã được mở khóa.§!"

 paragon.5220.name:0 "Đàm Phán Kết Thúc"
 paragon.5220.desc.peace:1 "Vào đêm trước cuộc đàm phán, rõ ràng là các bên đã quá chán ngán chiến tranh và muốn đạt được một thỏa thuận hơn. Chúng ta chưa thể biết điều này sẽ mang lại hậu quả lâu dài ra sao, nhưng hiện tại chúng ta đã đoàn kết."
 paragon.5220.a:1 "Chúng ta chiến thắng."
 paragon.5220.a.tt:1 "§LChúng ta giải quyết bất đồng hoặc bằng vũ lực hoặc bằng đàm phán. Kể từ giờ trở đi, chúng ta thực sự hòa làm một.§!"
 paragon.5221.name:0 "Nội Chiến"
 paragon.5220.desc.war:1 "Vào đêm trước cuộc đàm phán, rõ ràng là các bên sẽ không bao giờ đạt được thỏa hiệp. Ngay lúc này, các lực lượng phản loạn đang tập hợp, và chiến tranh đã bùng nổ. Một lần nữa quốc gia của chúng ta lại đứng trước sự chia rẽ."
 paragon.5221.a:0 "Chúng sẽ phải quy phục."
 paragon.5221.a.tt:0 "Các hành tinh có bổ trợ §YXu Hướng Dân Chủ§! sẽ hình thành hạt nhân của một đế quốc phản loạn."
 paragon.5222.name:0 "Hành Quyết"
 paragon.5222.desc:0 "Lời kêu gọi đàm phán là một cái bẫy hoàn hảo dành cho các thủ lĩnh phe Cải Cách. Tập hợp tại một địa điểm, chúng dễ dàng bị bắt gọn. Chúng ta không lãng phí thời gian để thẩm vấn thông tin về nơi ẩn náu, tay chân và tài sản của chúng. Sự chống đối còn lại đã được dẹp bỏ nhanh chóng mà không cần bất kỳ sự nhượng bộ nào hay một cuộc nội chiến tốn kém. Mọi kẻ thuộc phe Cải Cách đều đã bị kết án tử hình theo sắc lệnh của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!."
 paragon.5222.a:0 "Chúng ta không thể quay đầu lúc này. Hãy tiến hành."
 paragon.5223.name:0 "Một Quyền Bính"
 paragon.5223.desc:0 "Khi tàn dư của cuộc nội chiến lụi tàn, một xã hội mới đang trỗi dậy từ tro tàn, sẵn sàng mang ngọn lửa trí tuệ của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! vươn ra các vì sao."
 paragon.5223.a:0 "Một quốc gia, một Minh Lãnh Tụ, một tương lai."
 paragon.5226.name:0 "Hành Tinh Hư Cảnh"
 paragon.5226.desc:1 "Khi giai đoạn đầu hoàn thành, các dòng năng lượng linh năng cuộn xoáy đã bao trùm hành tinh và tàn phá bề mặt của nó. Dù hiện tại không thể sinh sống ở đó, các nhà linh năng mạnh nhất của chúng ta đã tập hợp lại để che chắn một ngôi đền, nơi giai đoạn tiếp theo của nghi lễ sẽ diễn ra. Giờ đây, điều còn lại duy nhất là dẫn truyền năng lượng linh năng từ các tình nguyện viên của chúng ta vào §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!. Làm như vậy sẽ tăng cường đáng kể năng lực linh năng của §Y[Ruler.GetTitle]§! của chúng ta."
 paragon.5227.name:0 "Nghi Lễ Linh Năng"
 paragon.5227.desc:1 "Hiến tế ban đầu: §R[ROOT.paragon_origin_ascension] Công dân§!\nHiến tế định kỳ mỗi mười năm: §R[ROOT.paragon_origin_ascension] Công dân§!\nNăng lực linh năng đã chọn: §G[Paragon_Origin_Ascension_Focus] [Paragon_Origin_Ascension_Trait1] [Paragon_Origin_Ascension_Trait2] [Paragon_Origin_Ascension_Trait3] [Paragon_Origin_Ascension_Trait4]§!\n\nCác nhà thần giao cách cảm mạnh nhất của chúng ta đang thuần hóa những luồng năng lượng hoang dã đang thiêu đốt hành tinh. Họ sẽ gom tụ các nguồn năng lượng này về trung tâm ngôi đền, nơi các ứng viên hiến tế đang đứng chờ. Nghi thức sẽ sớm bắt đầu, và sức mạnh linh năng của những tình nguyện viên dũng cảm này sẽ được chiết xuất và truyền thẳng vào §Y[Ruler.GetTitle]§!. Càng nhiều người bị tiêu hao, năng lượng linh năng càng mạnh — nhưng chúng ta phải cẩn thận không vượt quá tầm kiểm soát của §Y[Ruler.GetTitle]§!, nếu không chúng ta có nguy cơ đối mặt với một thảm họa kinh hoàng.\n\nMột khi nghi lễ hoàn tất, chúng ta sẽ cần cung cấp một dòng tình nguyện viên đều đặn để ngăn chặn nguồn sức mạnh này phá hủy cơ thể của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!."
 paragon.5227.a:0 "Thấu Triệt Vô Định"
 paragon.5227.a.tt:1 "§L§Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! có khả năng sẽ thoáng nhìn thấy các chiều không gian khác, thậm chí cả các dòng thời gian khác, mở rộng tâm trí của [Ruler.GetHerHis].§!\n\nNhận ngẫu nhiên §GĐặc tính Thống trị§!"
 paragon.5227.b:0 "Hải Đăng Linh Năng"
 paragon.5227.b.tt:0 "§LLuồng năng lượng cô đặc chảy qua huyết quản của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, nhưng cơ thể vật lý khó lòng dung nạp được chúng. Thay vào đó, chúng phóng tỏa sang các tình nguyện viên ở gần, cường hóa sức mạnh của họ trước khi họ bị thiêu rụi trong ngọn lửa phát nhiệt tâm linh.§!\n\nCác phi hành đoàn linh năng của chúng ta sẽ sử dụng Hải Đăng Linh Năng để kết nối với §Y[Ruler.GetTitle]§! và khai thác sức mạnh này, thêm §G$MOD_SHIP_SHIELD_HP_ADD$§! và §G$MOD_SHIP_SHIELD_REGEN_ADD_PERC$§! cho tất cả các tàu."
 paragon.5227.c:0 "Thiết Bị Thấu Cảm Tinh Tú"
 paragon.5227.c.tt:0 "§LNăng lượng cô đặc chảy qua huyết quản của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, giúp gia tăng đáng kể nhận thức.§!\n\nCác hoa tiêu linh năng của chúng ta sẽ sử dụng Máy Phát Thấu Cảm Tinh Tú để kết nối với §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! và hút lấy nguồn sức mạnh này, thêm §G$MOD_SHIP_SPEED_MULT$§! và §G$MOD_SHIP_DISENGAGE_CHANCE_MULT$§! cho tất cả các tàu."
 paragon.5227.d:0 "Mắt Toàn Tri"
 paragon.5227.d.tt:0 "§LNăng lượng cô đặc chảy qua huyết quản của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, thay đổi và làm xoắn vặn những đặc điểm cơ bản trên cơ thể của [Ruler.GetHerHis]. Bất cứ khi nào ánh nhìn thấu suốt của [Ruler.GetHerHisCap] dừng lại trên một người phục vụ nghi lễ, rõ ràng là suy nghĩ của họ không còn là bí mật nữa.§!\n\n§Y[Ruler.GetRegnalName]§! có thể học cách khai thác sức mạnh này, bổ sung Giảm §G$MOD_PLANET_CRIME_MULT$§! và §GMã hóa§! cho đế quốc."
 paragon.5227.e:1 "Thôi Miên Ngữ Điệu"
 paragon.5227.e.tt:0 "§LNăng lượng cô đặc chảy qua huyết quản của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, cường hóa dây thanh quản của [Ruler.GetHerHis] bằng năng lực tâm linh. Đối với các tình nguyện viên của chúng ta, giọng nói của [Ruler.GetHerHis] vừa mang lại đau đớn vừa có sức thuyết phục không thể chối từ.§!\n\n§Y[Ruler.GetRegnalName]§! có thể học cách khai thác sức mạnh này, bổ sung §G$tile_resource_unity_add$§! và §G$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! cho đế quốc."
 paragon.5227.f:0 "Hoàn Tất Nghi Lễ!"
 paragon.5227.f.tt:0 "Thao tác này sẽ kết thúc nghi lễ với các tùy chọn đã chọn. $paragon.leader.delusion.positive$"
 paragon.5230.name:0 "Năng Lượng Tràn Ngập"
 paragon.5230.desc:1 "Thử thách cam go này đã chứng tỏ là một thành công to lớn. Nhờ sự kiên cường bẩm sinh và tiềm năng linh năng vượt bậc của chúng ta, §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã được hồi sinh! Nhưng sẽ mất vài năm trước khi chúng ta có thể trao lại đất nước cho vị nguyên thủ hợp pháp."
 paragon.5236.name:0 "Trái Tim Hành Tinh"
 paragon.5236.desc:0 "Chúng ta đã chiết xuất lõi hành tinh, xử lý và bọc kín nó bên trong một khung đỡ sử dụng Vật Chất Tối để tạo ra một lượng năng lượng khổng lồ so với kích thước nhỏ gọn của nó. Giờ đây, chúng ta có thể chế tạo các bộ phận cơ khí tăng cường đặc biệt để nâng cấp cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! và thậm chí chữa lành cơ thể lẫn tâm trí của ngài, với chi phí khiêm tốn là tiếp tục cung cấp thêm §YVật Chất Tối§! để duy trì thiết bị hoạt động."
 paragon.5237.name:0 "Trái Tim Của $leader_trait_legendary_leader$"
 paragon.5237.desc:1 "Chi phí duy trì nâng cấp: §R[ROOT.paragon_origin_ascension] Vật Chất Tối hàng tháng§!\nCác cải tiến điều khiển sinh học đã chọn: §G[ROOT.Paragon_Origin_Ascension_Focus][Paragon_Origin_Ascension_Trait1][Paragon_Origin_Ascension_Trait2][Paragon_Origin_Ascension_Trait3][Paragon_Origin_Ascension_Trait4]§!\n\nMột nhà máy đã được xây dựng dành riêng cho mục đích này. Nó sẽ sớm bắt đầu sản xuất những bộ phận điều khiển sinh học tân tiến nhất từng thấy, tất cả nhằm cung cấp năng lượng cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! kính yêu của chúng ta. Càng lắp đặt nhiều nâng cấp, chúng ta càng cần bổ sung nhiều Vật Chất Tối mỗi tháng để giữ cho trái tim hoạt động. Nhưng chúng ta nên cẩn thận không lạm dụng quá mức, kẻo cơ thể sẽ sụp đổ dưới áp lực khổng lồ."
 paragon.5237.a:0 "Bộ Điều Chỉnh Xác Suất"
 paragon.5237.a.tt:0 "§L§Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ nhận được Bộ Điều Chỉnh Xác Suất được cá nhân hóa, cho phép thấu hiểu sâu sắc hơn về cách lãnh đạo đế quốc.§!\n\nNhận ngẫu nhiên §GĐặc tính Thống trị§!"
 paragon.5237.b:0 "Bộ Truyền Phát Vĩnh Cửu"
 paragon.5237.b.tt:1 "§LGắn Bộ Truyền Phát Vĩnh Cửu vào §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đồng nghĩa với việc truyền mệnh lệnh và phát biểu trước dân chúng sẽ dễ dàng hơn rất nhiều.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ có thể giao tiếp tức thời với bất kỳ công dân cơ giới sinh học nào, tăng §G$MOD_POP_HAPPINESS$§! và §GSản Lượng Cơ Giới Sinh Học§!."
 paragon.5237.c:0 "Chất Ức Chế Giấc Ngủ"
 paragon.5237.c.tt:1 "§LChất Ức Chế Giấc Ngủ đặc biệt sẽ cho phép §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! dành ít thời gian nghỉ ngơi hơn và nhiều thời gian trị vì hơn.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ dễ dàng quản lý việc thực thi các chính sách hơn, thêm §G$MOD_COUNTRY_EDICT_FUND_ADD$§! và §G$mod_edicts_upkeep_mult$§!."
 paragon.5237.d:0 "Giao Diện Chiến Thuật"
 paragon.5237.d.tt:1 "§LGiao diện Chiến thuật Đặc biệt cho phép §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! chỉ huy các đạo quân cách xa hàng triệu năm ánh sáng mà không hề bị suy giảm hiệu năng.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ đích thân tham vấn các lực lượng lục quân và hoạch định những chiến dịch đổ bộ tiềm năng, tăng cường §G$MOD_ARMY_HEALTH$§! và §G$MOD_ARMY_DAMAGE_MULT$§!."
 paragon.5237.e:0 "Bộ Phân Tích Nhận Thức"
 paragon.5237.e.tt:0 "§LBộ Phân Tích Nhận Thức được tinh chỉnh đặc biệt dành cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! cho phép kiểm soát tốt hơn bất kỳ trận không chiến nào được thực hiện bởi các phi công có cấy ghép thiết bị thu tương ứng.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ sử dụng chuyên môn sâu rộng của mình để giúp hải quân của chúng ta hiệu chỉnh trong các trận chiến, thêm §G$MOD_SHIP_ACCURACY_ADD$§! và §G$MOD_SHIP_TRACKING_ADD$§! cho tất cả các tàu."
 paragon.5237.f:0 "Hoàn Tất Chiến Dịch!"
 paragon.5237.f.tt:0 "Thao tác này sẽ kết thúc chiến dịch với các tùy chọn đã chọn. $paragon.leader.delusion.positive$"
 paragon.5240.name:0 "Thông Minh Hơn, Nhanh Hơn, Mạnh Mẽ Hơn"
 paragon.5240.desc:1 "Chiến dịch của chúng ta đã thành công tốt đẹp! Nguồn năng lượng mới cho tất cả các thiết bị tăng cường điều khiển sinh học đã chứng tỏ hiệu quả và độ ổn định cao, cho phép §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! một lần nữa sải bước giữa nhân dân."
 paragon.5246.name:0 "Khung Thân Hoàng Gia"
 paragon.5246.desc:0 "Chúng ta đã chế tạo thành công một khung thân phù hợp cùng bộ não điện tử hiện đại bậc nhất để chứa đựng ý thức của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!. Giờ đây, những gì còn lại là quét bộ não của ngài và tiến hành tải lên cũng như tái lập trình mới."
 paragon.5247.name:0 "Lập Trình Ý Thức"
 paragon.5247.desc:1 "Chi phí duy trì nâng cấp: §R[ROOT.paragon_origin_ascension] Kim Loại Sống hàng tháng§!\nCác nâng cấp chương trình đã chọn: §G[ROOT.Paragon_Origin_Ascension_Focus][Paragon_Origin_Ascension_Trait1][Paragon_Origin_Ascension_Trait2][Paragon_Origin_Ascension_Trait3][Paragon_Origin_Ascension_Trait4]§!\n\nNhà máy thực tế không có công nhân còn sống, nhưng một vài nền tảng tri giác đang duy trì máy móc tinh vi này. Ý thức của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! hiện đang được lưu trữ trên một mạng lưới, sẵn sàng tiếp nhận các nâng cấp cần thiết. Chúng ta phải cẩn thận không tái lập trình quá mức, nếu không năng lực điện toán cần thiết sẽ vượt quá ngưỡng chịu đựng, ngay cả đối với những đơn vị tiên tiến nhất của chúng ta."
 paragon.5247.a:0 "Thuật Toán Tiên Tri"
 paragon.5247.a.tt:1 "§LChúng ta sẽ cài đặt một Thuật Toán Tiên Tri đặc biệt vào §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, cho phép thấu hiểu sâu sắc hơn về năng lực lãnh đạo.§!\n\nNhận ngẫu nhiên §GĐặc tính Thống trị§!"
 paragon.5247.b:0 "Mạng Học Tập Chia Sẻ"
 paragon.5247.b.tt:1 "§LBằng cách triển khai Mạng Học Tập Chia Sẻ trên quy mô toàn đế quốc, chúng ta cho phép các lãnh đạo khác hưởng lợi từ kho kiến thức đồ sộ của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!.§!\n\nThao tác này sẽ nâng cao năng lực học hỏi của các nhà lãnh đạo khác, tăng §G$MOD_LEADER_SPECIES_EXP_GAIN$§! và §GChi Phí Duy Trì Lãnh Đạo§!."
 paragon.5247.c:0 "Hệ Thống Tính Toán Chiến Đấu"
 paragon.5247.c.tt:1 "§LViệc tính toán chiến đấu chuẩn xác đòi hỏi năng lực xử lý khổng lồ, nhưng với bộ não điện tử tân tiến của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, các hạm đội của chúng ta luôn sẵn sàng tác chiến.§!\n\nThao tác này sẽ cường hóa tất cả các hạm đội của chúng ta, tăng §G$MOD_SHIP_FIRE_RATE_MULT$§! và §G$MOD_SHIP_WEAPON_DAMAGE$§! cho tất cả các tàu."
 paragon.5247.d:0 "Thuật Toán Tái Chế"
 paragon.5247.d.tt:1 "§LCài đặt Thuật Toán Tái Chế chuyên dụng có thể gia tăng khả năng tư duy theo các phương thức sản xuất bền vững hơn cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, làm giảm sự lãng phí tiềm tàng.§!\n\nThao tác này sẽ cho phép chúng ta chi trả ít hơn cho các khu vực và công trình vận hành, làm giảm §G$mod_planet_districts_upkeep_mult$§! và §G$mod_planet_buildings_upkeep_mult$§!."
 paragon.5247.e:0 "Cơ Sở Dữ Liệu Kỹ Thuật Khổng Lồ"
 paragon.5247.e.tt:1 "§LBằng cách tải toàn bộ cơ sở dữ liệu kỹ thuật vào não bộ của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, chúng ta có thể gia tăng đáng kể tri thức công nghệ của mình.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ tạo ra các kỹ thuật hiệu quả hơn nhiều, tăng cường §G$mod_MACHINE_species_trait_points_add$§! và §G$mod_MACHINE_species_trait_picks_add$§!."
 paragon.5247.f:0 "Hoàn Tất Chiến Dịch!"
 paragon.5247.f.tt:0 "Thao tác này sẽ kết thúc chiến dịch với các tùy chọn đã chọn. $paragon.leader.delusion.positive$"
 paragon.5250.name:0 "Hồn Ma Trong Cỗ Máy"
 paragon.5250.desc:1 "Công việc của chúng ta đã hoàn tất. Với một cơ thể mới và năng lực nhận thức được nâng cao đáng kể, §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã sẵn sàng tiếp tục trọng trách của mình."
 paragon.5256.name:0 "Độ Tương Thích DNA"
 paragon.5256.desc:1 "Đội ngũ khoa học của chúng ta đã xác định được một số ứng viên có mã di truyền khả thi để nâng cấp cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!. Một khi quy trình hoàn tất, §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ không còn bị đè nặng bởi sự suy thoái của tuổi già. Các sửa đổi sâu hơn sẽ khả thi trong tương lai. Tất nhiên, sẽ cần vật chất di truyền tươi mới để nâng cấp trình tự DNA của nguyên thủ."
 paragon.5257.name:0 "Thao Túng Gen"
 paragon.5257.desc:1 "Hiến tế ban đầu: §R[ROOT.paragon_origin_ascension] Cá Thể Tương Thích Gen§!\nHiến tế định kỳ mỗi mười năm: §R[ROOT.paragon_origin_ascension] Công Dân§!\nNăng lực di truyền đã chọn: §G[Paragon_Origin_Ascension_Focus][Paragon_Origin_Ascension_Trait1][Paragon_Origin_Ascension_Trait2][Paragon_Origin_Ascension_Trait3][Paragon_Origin_Ascension_Trait4]§!\n\nCác bể tái sắp xếp trình tự gen chuyên dụng đã được chuẩn bị và những bộ óc ưu tú nhất của chúng ta đang giám sát ca phẫu thuật.\n\nCác nhà lãnh đạo tương thích sẽ bị hòa tan để thu hồi vật chất di truyền. Sau đó, một số chuỗi DNA của họ sẽ được truyền vào cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!. Chúng ta có thể dùng thêm nhiều cá thể tương thích để tăng cường quá trình này, tạo ra các đột biến có kiểm soát cho phép §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! hồi xuân nhanh hơn nữa, nhưng chúng ta phải cẩn thận không làm quá giới hạn."
 paragon.5257.a:0 "Phục Hồi DNA"
 paragon.5257.a.tt:1 "§LChúng ta có thể đảo ngược quá trình lão hóa. Một bộ não trẻ hơn cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ nâng cao năng lực nhận thức của họ. Cùng với trí tuệ của sự từng trải và sự linh hoạt của tuổi trẻ, mọi điều đều trở nên khả thi.§!\n\nNhận ngẫu nhiên §GĐặc tính Thống trị§!"
 paragon.5257.b:0 "Phát Triển Não Bộ"
 paragon.5257.b.tt:1 "§LĐối với trung tâm nhận thức của não bộ, càng lớn thường càng tốt. Chúng ta có thể kích thích sự phát triển hơn nữa ở §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!.§!\n\nVới khả năng tập trung và lý luận được gia tăng, §Y[Ruler.GetRegnalName]§! có thể giúp các nhà khoa học của chúng ta trong sứ mệnh nghiên cứu cõi vô định, tăng §G$MOD_LEADER_SPECIES_EXP_GAIN$§! và §G$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$§! của chúng ta."
 paragon.5257.c:0 "Ghép Nối Gen"
 paragon.5257.c.tt:1 "§LVới các kỹ thuật ghép nối gen tiên tiến, giờ đây chúng ta có thể chiết xuất các trình tự cụ thể từ §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! để tìm hiểu điều gì đã khiến nguyên thủ của chúng ta trở nên phi thường đến vậy.§!\n\nÁp dụng kiến thức này cho các công dân bình thường sẽ mang lại những kết quả xứng đáng, tăng cường §G$MOD_ARMY_HEALTH$§! và §GSản Lượng Lao Động§!."
 paragon.5257.d:0 "Sức Hút Khó Cưỡng"
 paragon.5257.d.tt:1 "§LChúng ta có thể nghiên cứu các chất xúc tác pheromone và phương pháp tăng cường thẩm mỹ để tạo ra một cơ thể hoàn hảo, đầy cuốn hút cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!.§!\n\nĐối với §Y[Owner.GetSpeciesName]§!, việc bất đồng ý kiến với §Y[Ruler.GetRegnalName]§! gần như là điều không tưởng. Mối liên kết hóa học kỳ diệu giữa một nguyên thủ và thần dân sẽ gia tăng §G$MOD_COUNTRY_LEADER_CAP_ADD$§! và §G$MOD_FACTION_APPROVAL$§! cho đế quốc."
 paragon.5257.e:0 "Phân Tán Chú Ý"
 paragon.5257.e.tt:1 "§LViệc phân chia các phần của não bộ và gấp gọn chúng thành các khu vực độc lập sẽ cho phép §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! tập trung vào nhiều mục tiêu khác nhau cùng một lúc.§!\n\nChúng ta có thể áp dụng quy trình này cho phi công và các nhà chiến thuật của mình, tăng §GHiệu Suất Phòng Thủ Điểm§! và §G$MOD_SHIP_EVASION_MULT$§! cho tất cả các tàu."
 paragon.5257.f:0 "Hoàn Tất Chiến Dịch!"
 paragon.5257.f.tt:0 "Thao tác này sẽ kết thúc chiến dịch với các tùy chọn đã chọn. $paragon.leader.delusion.positive$"
 paragon.5260.name:0 "Đỉnh Cao Tiến Hóa"
 paragon.5260.desc:1 "Thí nghiệm của chúng ta đã đơm hoa kết trái, và hình thái hoàn hảo của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã được hoàn thiện. Giờ đây, khi [Ruler.GetTitle] của chúng ta trở lại giữa những thần dân trung thành của [Ruler.GetHerHis], các vì sao đang đón chờ chúng ta chinh phục!"

 paragon.5265.name:0 "Mở Rộng Ý Thức"
 paragon.5265.desc:1 "Nhờ những hy sinh của chúng ta, chúng ta đã thúc đẩy năng lực lãnh đạo quốc gia của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! vượt xa mọi giới hạn. Câu hỏi đặt ra là: phẩm chất nào quan trọng nhất đối với một nhà lãnh đạo xuất sắc? Sự trưởng thành mới mẻ này nên được định hướng vào đâu?"
 paragon.5265.a:0 "Tri Thức"
 paragon.5265.a.tt:0 "§LTri thức là kho báu ở cảnh giới cao nhất.§!"
 paragon.5265.b:0 "Thuần Khiết"
 paragon.5265.b.tt:1 "§LXét cho cùng, một chủng tộc hoàn hảo sẽ kiến tạo nên một quốc gia thuần khiết.§!"
 paragon.5265.c:0 "Sức Mạnh"
 paragon.5265.c.tt:0 "§LChỉ thông qua quyền năng uy dũng, người ta mới có thể thống trị một quốc gia như chúng ta.§!"
 paragon.5265.d:0 "Trí Tuệ"
 paragon.5265.d.tt:0 "§LKhông có trí tuệ, mọi kiến thức trên cõi đời đều vô nghĩa.§!"
 paragon.5265.e:0 "Uy Nghi"
 paragon.5265.e.tt:1 "§LMột nguyên thủ không có uy tín sẽ chẳng có nhiều người ủng hộ.§!"
 paragon.5265.f:0 "Khoan Dung"
 paragon.5265.f.tt:0 "§LCởi mở và đón nhận người khác đồng nghĩa với việc có thêm nhiều đồng minh bảo vệ đất nước.§!"
 paragon.5265.g:0 "Tiết Chế"
 paragon.5265.g.tt:0 "§LSức mạnh thực sự nằm ở việc biết cách kiềm chế.§!"

 paragon.5270.name:0 "Đế Quốc Vạn Tuế!"
 paragon.5270.desc:1 "$paragon.beginning.speech$\n\nTrở về từ bờ vực của cái chết, bài diễn văn của Minh Lãnh Tụ tràn ngập niềm hy vọng và lòng biết ơn. Sau khi gửi lời cảm ơn tới toàn thể công dân và các nhà khoa học đã giúp kỳ tích phi thường này thành hiện thực, [Ruler.GetName] nói về tương lai: rằng [Ruler.GetSheHe] đã mạnh mẽ hơn bao giờ hết, sẵn sàng tái nắm giữ bánh lái của quốc gia vinh quang của chúng ta. Cùng nhau, chúng ta đã chiến thắng những kẻ phản trắc và loạn quân. Và cùng nhau, chúng ta sẽ mang lại vinh quang và thịnh vượng cho mọi công dân, trên mọi thế giới! Vinh quang cho [Owner.GetName]! Vinh quang cho [Owner.GetSpeciesNamePlural]!\n\nVà vinh quang cho Minh Lãnh Tụ.\n\n$paragon.ending.speech$"
 paragon.5270.a:0 "Vinh Quang!"
 paragon.5270.a.tt:0 "§LVinh quang cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!! Vinh quang cho §Y[Owner.GetName]§!! Vinh quang cho §Y[Owner.GetSpeciesName]§!!§!"
 paragon.5270.b:0 "Đã đến lúc Minh Lãnh Tụ tiếp quản quyền bính!"

#Ruler Insights
 paragon.5305.name:0 "Hiểu Biết Cải Tạo Địa Hình"
 paragon.5305.desc:0 "Những năm gần đây tự hào với sự thịnh vượng và ổn định vô song nhờ vào các nhà khoa học tài năng nhất của chúng ta. Nhằm tìm kiếm những thế giới mới để phát triển và khai thác, họ đã làm được một điều mà — xét theo hiểu biết hiện tại của chúng ta về sinh vật học ngoài hành tinh — từng bị coi là bất khả thi: họ đã cấy ghép thành công hệ động thực vật bản địa của chúng ta vào một hành tinh xa lạ, cải biến nó cho phù hợp với dân cư thông qua các công trình cải tạo đất khổng lồ.\n\nDù việc lặp lại thành công này vào lúc này là khó xảy ra, do hành tinh đã được cải tạo khá đặc thù, nó đã chứng minh rằng theo thời gian, chúng ta có thể cải tiến và điều chỉnh quy trình này để áp dụng cho các thế giới khác.\n\nCho đến lúc đó, chúng ta có thể phân bổ ngân sách để phát triển đế quốc ở các lĩnh vực khác."
 paragon.5310.name:0 "Hiểu Biết Đóng Tàu"
 paragon.5310.desc:1 "Hải quân của chúng ta là pháo đài phòng thủ. §Y[Root.Owner.Ruler.GetTitle]§! đã công bố một con tàu hoàn toàn mới do nhà nước tài trợ để củng cố hạm đội. Chiến hạm soái hạm này sẽ dẫn dắt chúng ta bước vào một kỷ nguyên huy hoàng, nghiền nát bất cứ ai cản đường! Con tàu sẽ sớm được hạ thủy, và chúng ta sẽ ăn mừng.\n\nGiờ đây, chúng ta có thể phân bổ ngân sách để phát triển đế quốc ở các lĩnh vực khác."
 paragon.5310.tt:0 "Tuần dương hạm Thử nghiệm gia nhập hạm đội!"
 paragon.5315.name:0 "Đột Phá Khoa Học"
 paragon.5315.desc:1 "Khoa học là chìa khóa mở ra một tương lai tốt đẹp và tươi sáng hơn. Được tiếp thêm động lực mới, các nhà khoa học của chúng ta đang tạo ra nhiều đột phá hơn bao giờ hết. Tiến bộ này đã được §Y[Root.Owner.Ruler.GetTitle]§! ghi nhận bằng việc trao tặng huân chương cống hiến cho các nhà khoa học xuất sắc được chọn.\n\nGiờ đây, chúng ta có thể tập trung các nỗ lực mở rộng vào những lĩnh vực khác."
 paragon.5320.name:0 "Nêu Gương Dẫn Đầu"
 paragon.5320.desc:1 "§Y[Root.Owner.Ruler.GetTitle]§! là tấm gương sáng cho tất cả mọi người, dẫn dắt chúng ta tiến bước giữa các vì sao. Với một nhà lãnh đạo kiệt xuất tại vị, các quan chức của chúng ta vô cùng tự hào được cống hiến và luôn phấn đấu vì sự ưu tú.\n\nGiờ đây, chúng ta có thể tập trung các nỗ lực mở rộng vào những lĩnh vực khác."
 paragon.5325.name:0 "Căn Cứ Không Gian Thử Nghiệm"
 paragon.5325.desc:1 "Các báo cáo về dự án xây dựng mới đang có tác động sâu sắc đến tinh thần của công chúng. Khi các chi phí sản xuất đã ở phía sau, chúng ta hướng tới sự hoàn thành của kỳ tích kỹ thuật đáng kinh ngạc này.\n\nGiờ đây, chúng ta có thể tập trung các nỗ lực mở rộng vào những lĩnh vực khác."
 paragon.5330.name:1 "Kim Loại Sống"
 paragon.5330.desc:1 "Chúng ta đã khám phá được rất nhiều điều nhờ tiến bộ công nghệ và khoa học, nhưng chúng ta vẫn còn nhiều điều phải học hỏi. Đội ngũ thám hiểm của chúng ta đã tìm thấy một loại vật chất phi thường thể hiện các đặc tính của chất lỏng lẫn kim loại. Hơn nữa, chất này dường như có sự sống. Chúng ta vẫn chưa biết cách thấu hiểu hay tận dụng loại vật liệu này, nhưng nó vô cùng hấp dẫn.\n\nCho đến khi hiểu rõ hơn, chúng ta nên tập trung nỗ lực mở rộng sang các lĩnh vực khác."
 paragon.5335.name:0 "Nguồn Năng Lượng"
 paragon.5335.desc:1 "Những bước tiến công nghệ của chúng ta đã đi rất xa, nhưng vũ trụ vẫn còn ẩn chứa vô vàn bí ẩn. Đội ngũ thám hiểm của chúng ta đã phát hiện một loại vật chất cực kỳ đậm đặc. Nó được cho là một dạng Vật Chất Tối. Hiện tại, chúng ta chưa thể xác định được ứng dụng tiềm năng cho loại vật liệu mới này.\n\nCho đến khi tìm ra cách, chúng ta nên tập trung nỗ lực mở rộng sang các lĩnh vực khác."
 paragon.5340.name:0 "Sự Thống Trị Phi Thường"
 paragon.5340.desc:1 "Ngày kỷ niệm chuyến tàu con thoi đầu tiên đã gắn kết toàn bộ dân chúng vì một mục tiêu chung. Được truyền cảm hứng và tiếp thêm sinh lực từ bài diễn văn của §Y[Root.Owner.Ruler.GetTitle]§!, người dân [Root.Owner.GetSpeciesName] đang cùng nhau chung sức đưa thủ đô thiên hà mới của họ trở thành ngọn hải đăng thịnh vượng giữa khoảng không vũ trụ lạnh lẽo.\n\nGiờ đây, chúng ta có thể tập trung nỗ lực vào những nơi khác."
 paragon.5340.tt:0 "Cấp bậc Thăng hoa Thế giới Thủ đô tăng thêm §G+1§!"
 paragon.5345.name:0 "Thiên Tài Sáng Chế"
 paragon.5345.desc:1 "Tin tức đang lan truyền về một cỗ máy sáng tạo có khả năng tinh chế số lượng lớn hợp kim từ vật liệu tái chế. Thiết bị này hoạt động vô cùng hiệu quả, nhưng người tạo ra nó đã qua đời ngay sau khi trình bày trước §Y[Root.Owner.Ruler.GetTitle]§! của chúng ta. Bị các kỹ sư khác đánh giá là bất khả thi để sao chép, chúng ta đã đưa cỗ máy vào một cơ sở được bảo vệ nghiêm ngặt vì sự an toàn và vì lợi ích của nhân dân.\n\nChúng ta có thể phân bổ ngân sách để phát triển ở các lĩnh vực khác."
 paragon.5360.name:0 "Hiểu Biết Thăm Dò"
 paragon.5360.desc:1 "Các nhà thăm dò của chúng ta đã một lần nữa chứng minh giá trị của mình. Họ báo cáo đã phát hiện một mỏ tài nguyên ngầm ẩn giấu chứa nhiều loại tài nguyên khác thường. Trong khi chúng ta nỗ lực xác định các đặc tính và tiềm năng của những tài sản mới này, chúng ta có thể tiếp tục mở rộng sang các lĩnh vực khác."
 paragon.5370.name:0 "Hiểu Biết Vành Đai Quỹ Đạo"
 paragon.5370.desc:1 "Nghiên cứu sâu rộng trong lĩnh vực thuộc địa hóa không gian sâu và vận tải đã đơm hoa kết trái. Các nhà khoa học thông tuệ nhất của chúng ta đã hợp tác chặt chẽ với những kỹ sư giỏi nhất. Họ đã phát triển một khái niệm mới về vành đai quỹ đạo: một cấu trúc không gian bao quanh hành tinh bằng một vành đai khổng lồ có khả năng hỗ trợ các cơ sở công nghiệp hoặc dân dụng. Hiện tại, chúng ta có thể thiếu năng lực công nghiệp để xây dựng một Vành Đai Quỹ Đạo như vậy, nhưng con đường phía trước đã rộng mở. Trong khi đó, chúng ta có thể tập trung các nỗ lực mở rộng vào nơi khác."
 paragon.5900.name:1 "Minh Lãnh Tụ Đã Mất!"
 paragon.5900.desc:1 "Không ai có thể sống mãi mãi. Sau cùng, tất cả chúng ta đều bình đẳng trước cái chết. Ngày hôm nay, $leader_trait_legendary_leader$ đã gắn kết tất cả chúng ta lần cuối cùng. Chưa bao giờ chúng ta tổ chức một tang lễ trọng thể đến thế: những bài điếu văn hùng hồn, những lời thề cao cả, những đoàn người đưa tiễn bất tận. Trên khắp lãnh thổ của chúng ta, người dân đang bày tỏ lòng biết ơn đối với tất cả những gì $leader_trait_legendary_leader$ đã cống hiến cho chúng ta. Không có nhà cai trị nào hoàn hảo, nhưng vị lãnh tụ của chúng ta đã làm việc không biết mệt mỏi để xây dựng một tương lai tốt đẹp hơn cho tất cả.\n\nDù chúng ta đã hy vọng giảm thiểu sự phản ứng tiêu cực tiềm tàng từ một biến cố như vậy, quê nhà của chúng ta vẫn rơi vào tình trạng hỗn loạn."
 paragon.5900.desc.50years:1 "Không ai có thể sống mãi mãi. Sau cùng, tất cả chúng ta đều bình đẳng trước cái chết. Ngày hôm nay, $leader_trait_legendary_leader$ đã gắn kết tất cả chúng ta lần cuối cùng. Chưa bao giờ chúng ta tổ chức một tang lễ trọng thể đến thế: những bài điếu văn hùng hồn, những lời thề cao cả, những đoàn người đưa tiễn bất tận. Trên khắp lãnh thổ của chúng ta, người dân đang bày tỏ lòng biết ơn đối với tất cả những gì $leader_trait_legendary_leader$ đã cống hiến cho chúng ta. Không có nhà cai trị nào hoàn hảo, nhưng vị lãnh tụ của chúng ta đã làm việc không biết mệt mỏi để xây dựng một tương lai tốt đẹp hơn cho tất cả.\n\nDù đã có những chuẩn bị để đối phó với khủng hoảng, sự ra đi của $leader_trait_legendary_leader$ vẫn khiến chúng ta chới với, đắm chìm trong nỗi đau thương. Sẽ cần thời gian để vượt qua mất mát này, nhưng từ đó chúng ta sẽ ngày càng kiên cường hơn."
 paragon.5900.desc.100years:1 "Không ai có thể sống mãi mãi. Sau cùng, tất cả chúng ta đều bình đẳng trước cái chết. Ngày hôm nay, $leader_trait_legendary_leader$ đã gắn kết tất cả chúng ta lần cuối cùng. Chưa bao giờ chúng ta tổ chức một tang lễ trọng thể đến thế: những bài điếu văn hùng hồn, những lời thề cao cả, những đoàn người đưa tiễn bất tận. Trên khắp lãnh thổ của chúng ta, người dân đang bày tỏ lòng biết ơn đối với tất cả những gì $leader_trait_legendary_leader$ đã cống hiến cho chúng ta. Không có nhà cai trị nào hoàn hảo, nhưng vị lãnh tụ của chúng ta đã làm việc không biết mệt mỏi để xây dựng một tương lai tốt đẹp hơn cho tất cả.\n\nNhờ những chuẩn bị chu đáo để ứng phó với cuộc khủng hoảng như vậy, chúng ta vẫn đứng vững ngay cả sau khi $leader_trait_legendary_leader$ qua đời. Sẽ cần một thời gian để vượt qua mất mát này, nhưng từ đó chúng ta sẽ ngày càng kiên cường hơn."
 paragon.5900.a:0 "Giờ chúng ta phải làm gì đây?!"
 paragon.5900.a.50years:1 "Một ngày đen tối trong lịch sử của chúng ta."
 paragon.5900.a.100years:1 "Chúng ta đã chuẩn bị sẵn sàng. Điều này rồi chúng ta cũng sẽ vượt qua."

 ###Events for Leader Rebirth
 paragon.6000.name:0 "Cơ Hội Thứ Hai"
 paragon.6000.desc:0 "Khi sức khỏe của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! suy kiệt nhanh chóng, những bộ óc y khoa tài ba nhất của chúng ta đã nghĩ ra một giải pháp phi chính thống. Một thiết bị phức tạp sẽ được xây dựng ngay bên trong các phòng họp của hội đồng. Bằng cách trao cho cỗ máy này quyền kiểm soát nhiều quá trình sinh lý tự nhiên của [Ruler.GetHerHis], chúng ta có thể duy trì mạng sống của [Ruler.GetHimHer] vô thời hạn."
 paragon.6000.desc.ap_mind_over_matter: "$paragon.6000.desc$\n\nCác [GetPsychicNounPlural] của chúng ta cũng đã đề xuất một kế hoạch. Bằng cách khai thác [GetSorrow] tập thể của người dân, vô số nguồn năng lượng của Hư Cảnh có thể được thao túng để [GetRejuvenate] vị lãnh tụ đã gục ngã của chúng ta. Dù phải trả một cái giá, §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! có thể được duy trì sự sống vô thời hạn."
 paragon.6000.desc.ap_the_flesh_is_weak:0 "$paragon.6000.desc$\n\nCác chuyên gia điều khiển sinh học của chúng ta đã vạch ra một kế hoạch xuất sắc... Chỉ bằng cách sử dụng các thiết bị tăng cường tiên tiến nhất, chúng ta có thể thay thế từng bộ phận sinh học bị khiếm khuyết trên cơ thể người cai trị. Sau khi hoàn thành, §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ cai trị đời đời kiếp kiếp."
 paragon.6000.desc.ap_synthetic_evolution:0 "Các chuyên gia chế tạo người máy của chúng ta có một đề xuất để sửa chữa §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!: tuy tốn kém, chúng ta có thể chuyển ý thức của họ vào một mạng lưới điện tử tự hiệu chỉnh mới. Việc có thể kết nối mạng với toàn bộ dân cư cho phép chúng ta nâng cao các kỹ năng vốn đã rất đáng nể của họ."
 paragon.6000.desc.ap_engineered_evolution:0 "$paragon.6000.desc$\n\nNgoài ra, các nhà di truyền học của chúng ta cũng đã đề xuất một giải pháp thay thế. Các cơ thể nhân bản vô tính không giới hạn (dù đắt đỏ) có thể được tạo ra để làm chỗ chứa cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, biến [Ruler.GetHimHer] thành một thực thể bất tử."
 paragon.6000.a:0 "Chế tạo thiết bị này."
 paragon.6000.a.tooltip:0 "Một thiết bị duy sinh sẽ được chế tạo cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, ban cho [Ruler.GetHimHer] sự bất tử với cái giá là giam cầm [Ruler.GetHimHer] bên trong cung điện."
 paragon.6000.b:0 "Chuẩn bị các nâng cấp."
 paragon.6000.b.tooltip:0 "Các chuyên gia điều khiển sinh học của chúng ta sẽ chuẩn bị các bộ phận tiên tiến nhằm kéo dài tuổi thọ của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!."
 paragon.6000.c.tooltip:0 "Các [GetPsychicNounPlural] của chúng ta sẽ tiến hành một nghi lễ để ban sự bất tử cho §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!."
 paragon.6000.c:0 "Chuẩn bị Zro và các nâng cấp."
 paragon.6000.d:0 "Chuẩn bị kỳ quan tổng hợp này."
 paragon.6000.d.tooltip:0 "Các chuyên gia người máy của chúng ta sẽ chuẩn bị một lớp vỏ tổng hợp tiên tiến để kéo dài tuổi thọ của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!."
 paragon.6000.e:0 "Chuẩn bị các bể nhân bản vô tính."
 paragon.6000.e.tooltip:0 "Các nhà di truyền học của chúng ta sẽ tạo ra các bản sao nhân bản vô tính để kéo dài tuổi thọ của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!"
 paragon.6000.f_common: "Điều này là quá mức; hãy để [Ruler.GetHimHer]"
 paragon.6000.f.default: "$paragon.6000.f_common$ an nghỉ."
 paragon.6000.f.machine: "$paragon.6000.f_common$ ngừng vận hành."
 paragon.6000.f.common_tooltip: "Cái giá phải trả để biến đổi Minh Lãnh Tụ là quá đắt. Thay vào đó, chúng ta sẽ cho phép [Ruler.GetHimHer]"
 paragon.6000.f.tooltip.default: "$paragon.6000.f.common_tooltip$ ra đi trong thanh thản."
 paragon.6000.f.tooltip.machine: "$paragon.6000.f.common_tooltip$ tắt nguồn."
 paragon.6005.name:0 "Đế Quốc Sống Mãi"
 paragon.6005.desc:0 "Quy trình diễn ra lâu dài và gian khổ. Đối với §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, đó hẳn là một sự đau đớn tột cùng. Nhưng kết quả đã tự nói lên tất cả: sau khi được lắp đặt vào thiết bị, không còn dấu vết nào của căn bệnh bí ẩn của người cai trị.\n\nDù biết ơn vì đã được chữa lành, những người thân cận với [Ruler.GetHimHer] nhận thấy cử chỉ và tâm trạng của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã có những thay đổi tinh tế.\n\nHiện tại, nhà lãnh đạo của chúng ta phải ở lại trong hoàng cung, dù vẫn có một kế hoạch di chuyển thiết bị nếu thủ đô bị kẻ thù tràn ngập."
 paragon.6005.a:0 "Mừng người trở lại, [Ruler.GetName]."
 paragon.6010.name:0 "Nâng Cấp Hoàn Tất"
 paragon.6010.desc:0 "Công việc của chúng ta đã thành công! §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã được cứu thoát.\n\nCó lẽ bởi vì một phần quá lớn trong cơ thể của [Ruler.GetHisHer] bị ảnh hưởng bởi quy trình phẫu thuật, quan điểm của [Ruler.GetHisHer] về điều khiển sinh học đã thay đổi. Trước đây công nghệ này chỉ đơn thuần là một công cụ, nay [Ruler.GetSheHe] xem nó như con đường tối thượng dẫn tới sự hoàn mỹ.\n\nLãnh tụ của chúng ta đã trở lại với chúng ta. Nhưng ngài đã thay đổi ra sao vẫn là một câu hỏi mở."
 paragon.6010.a:0 "Nâng cấp vô tận cho [Ruler.GetName]."
 paragon.6015.name:0 "Truyền Dẫn Linh Năng"
 paragon.6015.desc_1: "Công việc của chúng ta đã thành công. Nhờ viện dẫn sức mạnh của §HHư Cảnh§!, §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã được cứu sống. Với nguồn năng lượng linh năng chưa từng có chảy cuồn cuộn qua cơ thể, [Ruler.GetHeShe] đã đạt tới sự bất tử."
 paragon.6015.desc_2.organic: "Tuy nhiên, thử thách cam go đã khiến [Ruler.GetHimHer] thay đổi một cách tinh tế... Những người thân cận với [Ruler.GetHimHer] thì thầm rằng có hai nhân cách tách biệt cùng tồn tại bên trong. Dường như các nguồn năng lượng của Hư Cảnh đang duy trì sự sống cho Minh Lãnh Tụ với một cái giá đắt hơn, mang tính hủy hoại hơn nhiều so với dự tính ban đầu."
 paragon.6015.desc_2.machine: "Tuy nhiên, thử thách cam go đã khiến [Ruler.GetHimHer] biến đổi vượt khỏi các thông số dự kiến của chúng ta. Chẩn đoán về [Ruler.GetHimHer] cho thấy các hàm xử lý logic xung đột đang hoạt động trong các hệ thống phụ của họ. Dường như các nguồn năng lượng của Hư Cảnh đang giữ cho Minh Lãnh Tụ duy trì hoạt động, nhưng mang lại chi phí ăn mòn đối với hệ thống của họ nặng nề hơn so với dự đoán ban đầu."
 paragon.6015.desc_3: "Nhưng tất cả những điều này đều có thể chờ đợi. Hiện tại, mối quan ngại cấp bách hơn là duy trì nguồn cung Zro liên tục; nếu chúng ta cạn kiệt, nhà lãnh đạo của chúng ta sẽ vong mạng."
 paragon.6015.a:0 "Tỉnh giấc đi nào, [Ruler.GetName]."
 paragon.6020.name:0 "Mở Rộng Thể Tổng Hợp"
 paragon.6020.desc:0 "Thành công rồi! Ý thức của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã được chuyển giao vào một khung thân tổng hợp. Quá trình xử lý lượng tử cho phép [Ruler.GetHimHer] kết nối mạng tức thời với mọi đơn vị tổng hợp.\n\nNhận thức siêu việt đầy quyền năng này đã bắt đầu thay đổi cách nhìn nhận của nhà lãnh đạo chúng ta. Giờ đây, [Ruler.GetSheHe] tập trung vào các mô hình xử lý vĩ mô, hướng tới việc nâng cao hiệu quả tổng thể của nền văn minh của chúng ta."
 paragon.6020.a:0 "[Ruler.GetName] đã hoàn toàn trực tuyến."
 paragon.6025.name:0 "Một Cơ Thể Hoàn Hảo Hơn"
 paragon.6025.desc:0 "Quá trình nhân bản vô tính và ca phẫu thuật đã thành công mỹ mãn. Nhà lãnh đạo của chúng ta đã được cứu sống.\n\nTuy nhiên, nhiều người đã bày tỏ quan ngại về một số thay đổi khôn lường trong thái độ của [Ruler.GetHisHer]. Quá mê đắm với hình hài mới của [Ruler.GetHisHer], §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã trở nên ám ảnh với giai đoạn tiến hóa tiếp theo của nhân dân chúng ta. [Ruler.GetSheHe] đã chuyển hướng đáng kể các nguồn lực để hoàn thiện hồ sơ di truyền của quần chúng."
 paragon.6025.a:0 "[Ruler.GetName] giờ đây là một mẫu vật di truyền hoàn hảo."
 paragon.6030.name:0 "Không Đủ Zro"
 paragon.6030.desc_common: "Nguồn cung cấp Zro của chúng ta đã cạn kiệt. Trừ khi chúng ta có thể nhanh chóng bổ sung kho dự trữ"
 paragon.6030.desc.organic: "$paragon.6030.desc_common$, tâm trí của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ mãi mãi lạc lối vào Hư Cảnh."
 paragon.6030.desc.machine: "$paragon.6030.desc_common$, bộ vi xử lý của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ bị Hư Cảnh làm quá tải và phá hủy hoàn toàn."
 paragon.6030.a:0 "Liên hệ thị trường Zro."
 paragon.6030.b:0 "[Ruler.GetName] sẽ chết."

 paragon.6035.name: "Một Kỷ Nguyên Mới"
 paragon.6035.desc: "Không lâu sau khi bình phục sau quy trình y tế, một buổi đại lễ ăn mừng đã được tổ chức trên [capital_scope.GetName]. $leader_trait_legendary_leader$ đã có một bài phát biểu cảm tạ nhân dân và giới khoa học, và [Ruler.GetName] đã nói về tương lai tươi sáng và phồn thịnh mà họ đã hoạch định cho §Y[Owner.GetName]§!."
 paragon.6035.a: "$leader_trait_legendary_leader$ trường tồn sẽ dẫn dắt chúng ta."
 paragon.6035.b: "Chúng ta sẽ cải cách chính phủ vì nhân dân."
 paragon.6035.b.tt: "Chính phủ sẽ được cải cách. $leader_trait_legendary_leader$ sẽ tiếp tục ủng hộ và dẫn dắt chúng ta, nhưng giờ đây nhân dân sẽ có cơ hội tự lựa chọn người lãnh đạo của mình."

 ###Traits
 leader_trait_the_apparatus_luminary:0 "Giam Cầm Trong Thiết Bị"
 leader_trait_the_apparatus_luminary_desc:0 "Bất tử, nhưng với cái giá nào? Nhà lãnh đạo này bị trói buộc vào một thiết bị duy sinh cồng kềnh trong các phòng họp hội đồng."
 leader_trait_the_cybernetic_luminary:0 "Nâng Cấp Vô Tận"
 leader_trait_the_cybernetic_luminary_desc:0 "Sự bất tử là điều có thể đạt được. Nhờ một số nâng cấp tiên tiến, nhà lãnh đạo này có thể đồng bộ trực tiếp với mọi quan chức điều khiển sinh học cấp cao. Tuy nhiên, điều này lại hạn chế khả năng học hỏi độc lập của họ."
 leader_trait_the_psionic_luminary:0 "Vị Khách Quá Cảnh"
 leader_trait_the_psionic_luminary_desc:0 "Cái giá của sự bất tử là rất cao... Thực Thể Hư Cảnh đã để lại một cánh cửa trong tâm trí của nhà lãnh đạo này. Thực thể đã giành được một chỗ đứng trong cõi thực của chúng ta, và nhà lãnh đạo phải được tiếp tế một nguồn Zro liên tục."
 leader_trait_the_synth_luminary:0 "Nhận Thức Tổng Hợp"
 leader_trait_the_synth_luminary_desc:0 "Cơ thể tổng hợp của nhà lãnh đạo này là đỉnh cao của nghệ thuật chế tạo người máy. Quá trình xử lý lượng tử mang lại sự kết nối trực tiếp với dòng nhận thức liên tục của nhân dân. Mặc dù nâng cao hiệu suất, các tác động lại không mang lại điềm lành cho những cá thể bị biến đổi."
 leader_trait_the_genetic_luminary:0 "Hoàn Hảo Di Truyền"
 leader_trait_the_genetic_luminary_desc:0 "Một chuỗi bản sao nhân bản vô tận đã ban cho nhà lãnh đạo này sự bất tử. Nếu lớp vỏ hiện tại bị hư hỏng hoặc lỗi thời, hàng chục lớp vỏ khác luôn sẵn sàng thay thế. Điều này đã dẫn đến một sự ám ảnh tột cùng về sự hoàn hảo di truyền."

