 cybernetic.trait.c:0 "\nChất Ức Chế Giấc Ngủ"
 cybernetic.trait.d:0 "\nGiao Diện Chiến Thuật"
 cybernetic.trait.e:0 "\nBộ Phân Tích Nhận Thức"
 synthetic.trait.b:0 "\nMạng Học Tập Chia Sẻ"
 synthetic.trait.c:0 "\nHệ Thống Tính Toán Chiến Đấu"
 synthetic.trait.d:0 "\nThuật Toán Tái Chế"
 synthetic.trait.e:0 "\nCơ Sở Dữ Liệu Kỹ Thuật Khổng Lồ"
 genetic.trait.b:0 "\nPhát Triển Não Bộ"
 genetic.trait.c:0 "\nGhép Nối Gen"
 genetic.trait.d:0 "\nSức Hút Khó Cưỡng"
