#Custom Leader Descriptions
 skrand_desc:1 "Dù gánh nặng quá khứ vẫn đè nặng trên vai, Skrand chưa từng bao giờ đánh mất niềm tin vào tương lai, luôn tiến bước vào cõi vô định bằng tất cả nhiệt huyết cùng lòng kiên định. Với lời thề phụng sự trang nghiêm, ông gánh vác sứ mệnh của mình."

 EXP_PENALTY_OVER_LEADER_CAP:0 "Hình phạt nhân kinh nghiệm nhận được do vượt quá Giới hạn Lãnh đạo: $MULT$"

# Orbital Bombardment Policy Event
 action.600.name:0 "Cái Chết Từ Bầu Trời"
 action.600.desc:0 "Cuộc Oanh tạc Quỹ đạo nhắm vào §H[From.GetName]§! đã khơi mào cho Hội đồng chúng ta một cuộc thảo luận về cách ứng phó trong tình huống giả định họ đầu hàng."
 action.600.A:0 "Cấm họ đầu hàng."
 action.600.B:0 "Chấp nhận họ đầu hàng."

#Renowned Leaders
 tech_xeno_linguistics:0 "Ngôn Ngữ Học Ngoại Tộc"
 tech_xeno_linguistics_desc:0 "Từ những cuộc chạm trán gần đây với các chủng tộc có trí tuệ, việc nâng cao năng lực ngôn ngữ học ngoại tộc là điều vô cùng cấp thiết đối với chúng ta."
 tech_xeno_linguistics_effect:1 "Nhận được một lượng nhỏ $r_influence$\nCho phép §HLãnh Đạo Danh Tiếng§! xuất hiện."
 paragon_2.2105.name:0 "Các Cá Nhân Xuất Chúng"
 paragon_2.2105.desc_01:0 "Chúng ta đã chứng minh không còn chút hoài nghi nào rằng thiên hà này tràn ngập sự sống. Ngoài các giống loài và quốc gia đang thống trị, còn có rất nhiều kẻ khác đang chu du khắp các vì sao. Thỉnh thoảng, những cá nhân xuất chúng có thể trỗi dậy làm lung lay nền móng quyền lực thiên hà.\n\nNếu có thể khơi dậy và dẫn dắt hoài bão của họ, những lãnh đạo danh tiếng này có thể sẽ sẵn lòng cống hiến cho đại nghiệp của chúng ta."
 paragon_2.2105.desc_02:0 "Chúng ta đã chứng minh không còn chút hoài nghi nào rằng thiên hà này tràn ngập sự sống. Ngoài các giống loài và quốc gia đang thống trị, còn có rất nhiều kẻ khác đang chu du khắp các vì sao. Thỉnh thoảng, những cá nhân xuất chúng có thể trỗi dậy làm lung lay nền móng quyền lực thiên hà.\n\nDù phong thái dị chủng của họ có thể kỳ quặc hay thậm chí đáng ghê tởm, việc tận dụng tài năng của những §Hlãnh đạo danh tiếng§! như vậy có thể mang lại lợi ích to lớn cho đại nghiệp của chúng ta."
 paragon_2.2105.a:0 "Phát đi lời chiêu mộ."
 paragon_2.2105.b:0 "Họ có thể hữu dụng... trong một thời gian."
 paragon_2.2105.tt:0 "Từ nay về sau, các §HLãnh Đạo Danh Tiếng§! có thể liên lạc với chúng ta."
 sm_recruitment_office:0 "Văn Phòng Chiêu Mộ Liên Sao"
 sm_recruitment_office_desc:0 "Các nhà ngôn ngữ học, chuyên viên săn đầu người, nhà thám hiểm: họ hợp tác cùng nhau lùng sục khắp các vì sao đã biết để tìm kiếm nhân tài. Tại đây, những lãnh đạo danh tiếng có thể được chiêu mộ để phụng sự cho đại nghiệp của chúng ta."
 sm_recruitment_office_tooltip:0 "$t$$MOD_COUNTRY_EXTERNAL_LEADER_POOL_SIZE$: §G+1§!\n$t$Kinh nghiệm Lãnh đạo nhận được: §G+10%§!\n$t$Tăng cơ hội §HLãnh Đạo Danh Tiếng§! liên lạc với chúng ta."

 HIRE:1 "Chiêu mộ"
 HIRE.tt:0 "Hãy phụng sự tốt cho đế chế của chúng ta."
 DECLINE:1 "Từ chối"
 DECLINE.tt:0 "Nghĩ lại thì, chúng ta không cần đến ngươi."
 CLASS:0 "Phân lớp"
 ETHIC:0 "Tư tưởng"

 leader_trait_gorky:0 "Trợ Lý AI 'Gorky'"
 leader_trait_gorky_desc:0 "Trợ lý nhỏ bé này giúp phân loại và phân tích dữ liệu. Trí tuệ nhân tạo của nó là sự kết hợp độc đáo giữa bot nghiên cứu và bot đồng hành."
 LYSANDER_FLEET_NAME:0 "Hạm Đội Tư Nhân Đi Cướp"

 NAME_xenophile1:0 "Lysator Syng"
 xenophile1:0 "Một tay hải tặc dày dạn kinh nghiệm cùng thủy thủ đoàn ô hợp của [Root.GetHisHer], được chiêu mộ từ khắp mọi ngóc ngách của thiên hà."
 NAME_xenophile2:0 "Nona"
 xenophile2:0 "Một nhà thám hiểm từng chu du khắp nơi với vốn hiểu biết sâu rộng về nhiều nền văn hóa ngoại bang; hứng thú với thương mại và lợi nhuận chẳng kém gì những khám phá khoa học."
 NAME_militarist1:0 "Nam tước Vyctor Jariden"
 militarist1:0 "Một quý tộc dạn dày khói lửa chiến tranh, người đã đánh mất hạm đội của [Root.GetHisHer] cùng cả gia tộc vào tay một kẻ thù áp đảo."
 NAME_militarist2:0 "Gia'Zumon"
 militarist2:1 "Một chiến binh hung hãn đã sống sót qua vô số trận chiến. [Root.GetHeSheCap] khao khát chiến tranh và xem chiến trường như nhà của mình."
 NAME_xenophobe1:0 "Kỹ Nghệ Trưởng Shuladun"
 xenophobe1:0 "Một nhà công nghiệp cô độc và hoang tưởng. [Root.GetHeSheCap] dành phần lớn thời gian của [Root.GetHisHer] để tìm kiếm hiệu quả trong vô số nhà máy và xưởng đúc của [Root.GetHisHer]."
 NAME_xenophobe2:0 "Aturion"
 xenophobe2:1 "Một robot chiến thuật xuất thân từ một nền văn minh đã tuyệt diệt từ lâu. Ám ảnh với trật tự và cấu trúc, nó tìm cách thiết kế nên một xã hội hoàn hảo."
 NAME_egalitarian1:0 "Jynn"
 egalitarian1:0 "Một chiến binh khắc kỷ thuộc Thần Bí Cân Bằng. Được nâng cấp bằng công nghệ điều khiển học và công nghệ sinh học, [Root.GetFirstName] đã tuyên thệ quét sạch những kẻ bạo chúa khỏi thiên hà."
 NAME_egalitarian2:0 "Zosira K'Tun"
 egalitarian2:0 "Một nhà khoa học sáng tạo và vui tính. Được hỗ trợ bởi Gorky, một robot nhỏ thân thiện, [Root.GetHeSheCap] luôn mong muốn chia sẻ tri thức của [Root.GetHisHer] để cải thiện đời sống của những người xung quanh [Root.GetHisHer]."
 NAME_materialist1:0 "Xondar"
 materialist1:0 "Một đô đốc đã tìm thấy sự bất tử trong hình dạng tổng hợp. Tâm trí của [Root.GetHisHerCap] giờ đây kết nối trực tiếp với các chiến hạm dưới quyền chỉ huy của [Root.GetHisHer]."
 NAME_materialist2:0 "Borin"
 materialist2:0 "Một thợ phế liệu đã rời khỏi ấp bộ của [Root.GetHisHer], [Root.GetFirstName] là một thợ cơ khí vô song có thể sửa chữa gần như bất cứ thứ gì."
 NAME_pacifist1:0 "Thẩm phán Uld Dagr"
 pacifist1:1 "Một thẩm phán đã nghỉ hưu, người đã thề sẽ tiếp tục cuộc đấu tranh vì công lý."
 NAME_pacifist2:0 "Vas Hoàng Kim"
 pacifist2:0 "Một nhà ngoại giao đầy lôi cuốn được nuôi dưỡng trong Tu Viện Sao Từ Alyssum. Đấu tranh vì hòa bình, [Root.GetHeShe] tiến hành cuộc chiến của [Root.GetHisHer] thông qua mưu mẹo và đàm phán."
 NAME_authoritarian1:0 "Kai-Sha"
 authoritarian1:0 "Một đầu mối môi giới thông tin có mối quan hệ sâu rộng với mạng lưới phủ khắp thiên hà."
 NAME_authoritarian2:0 "Người Chăm Sóc Q'la"
 authoritarian2:1 "Một giám sát viên tham lam luôn luồn cúi trước kẻ nắm giữ quyền lực, đồng thời bóc lột và làm nhục những kẻ yếu thế. Trí thông minh và sự tàn nhẫn của [Root.GetHisHerCap] mang lại những kết quả phi thường."
 NAME_spiritualist1:0 "Ulastar"
 spiritualist1:1 "Một nhà thần bí lang bạt với trí tuệ lay động tâm can tất cả những ai ở bên [Root.GetHimHer]."
 NAME_spiritualist2:0 "Nasuz Demetor"
 spiritualist2:1 "Một chuyên viên lưu trữ luôn tìm cách thu thập tri thức từ các nền văn minh đã lụi tàn. [Root.GetHeSheCap] khai quật những kỳ quan cổ đại trên các thế giới chết, và tìm kiếm cổ vật trong những con tàu bị bỏ rơi trôi dạt giữa khoảng không giữa các vì sao."
 custom_mercenary_admiral_desc:0 "Một chiến binh lính đánh thuê tàn nhẫn tìm kiếm vinh quang và danh tiếng trên chiến trường."

 paragon.40100.name:0 "$NAME_xenophile1$"
 paragon.40100.desc:0 "§HThiết bị quét nhận diện khuôn mặt xác định đối tượng là Lysator Syng, một tên cướp biển đang bị truy nã. Nở nụ cười ranh mãnh, hắn cúi đầu chào lịch sự.§!\n\nXin chào, tôi là Thuyền trưởng Lysator. Tôi đến đây mang theo một lời đề nghị.\n\nTôi chỉ huy ba con tàu cùng một đám thủy thủ đoàn ô hợp gồm những kẻ bị trục xuất. Cho đến nay, chúng tôi vẫn hoạt động... độc lập. Dù vậy, thời thế đổi thay, và chúng tôi đã sẵn sàng gia nhập một tổ chức lớn hơn. Nếu các ngài ban lệnh đại xá cho cái gọi là tội ác của chúng tôi và một bến đỗ an toàn trong biên giới của các ngài, chúng tôi sẽ làm việc cho các ngài.\n\nCác ngài thấy sao? Chúng ta có nên soạn một bản hợp đồng không?"
 paragon.40100.a:0 "Chúng ta cần một tên cướp biển để làm gì?"
 paragon.40100.a.response:0 "À, về chuyện đó, tôi thích tự coi mình là một thủy thủ tư thám hơn. Có những điều các ngài chẳng thể nào học được trong học viện. Kỹ năng của tôi nằm ở việc chớp lấy thời cơ: khi nào nên xuất kích, khi nào cần rút lui, và mồi nhử nào nên thả ra trước mắt kẻ thù. Chúng tôi giáng đòn sấm sét vào đúng chỗ hiểm, rồi chuồn mất cùng chiến lợi phẩm trước khi bất kỳ ai kịp hiểu chuyện gì vừa xảy ra."
 paragon.40100.b:0 "Tại sao các ngươi lại muốn gia nhập cùng chúng ta?"
 paragon.40100.b.response:0 "Thủy thủ đoàn của tôi đã mệt mỏi với cuộc sống trốn chạy nay đây mai đó. Chúng tôi tìm kiếm một bến đỗ an toàn. Đế chế của các ngài dường như đủ cởi mở để dung nạp một nhóm người tha hương vào hàng ngũ của mình. Những năm tháng cướp bóc tự do đã khiến chúng tôi hao tổn nhiều; chúng tôi chưa hẳn muốn an cư lập nghiệp, nhưng một nhà bảo trợ tầm cỡ như các ngài có thể giúp chúng tôi trút bớt gánh nặng."
 paragon.40100.c:0 "Tại sao chúng ta phải tin ngươi?"
 paragon.40100.c.response:0 "Chẳng có lý do nào cả, ngoài lời nói của một gã bất hảo. Nếu điều đó chưa đủ, thì xin chúc các ngài thượng lộ bình an. Tôi chỉ đề xuất một thương vụ, không hơn không kém."
 paragon.40100.d:0 "Hãy kể cho chúng ta nghe về thủy thủ đoàn của ngươi."
 paragon.40100.d.response:1 "Những nô lệ trốn thoát, thợ săn tiền thưởng, lính đánh thuê... thậm chí có cả một đầu bếp kỳ dị. Từ khắp mọi ngóc ngách của thiên hà, họ đã đáp lại tiếng gọi của tự do và phiêu lưu. Qua năm tháng, chúng tôi đã gắn kết thành một gia đình. Tôi chào đón bất kỳ ai, miễn là họ tuân lệnh tôi và không cố ăn thịt những người khác. Tôi coi việc dẫn dắt họ là một vinh dự."
 paragon.40100.hire_custom_tooltip:1 "§Y$NAME_xenophile1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!.\n3 tàu cướp biển được bổ sung vào đế chế chúng ta."

 paragon.40200.name:0 "$NAME_xenophile2$"
 paragon.40200.desc:0 "§HNgười phụ nữ mang theo những món quà kỳ thú: một mảnh vỡ được bảo tồn từ sao chổi, một tác phẩm điêu khắc bằng xương Tiyanki, và một sinh vật dạng thân mềm tí hon đựng trong lọ.§!\n\nKính chào, tôi là Nona, Người Được Ban Phúc Vĩnh Hằng của Gia tộc Colzyrion. Tôi xin dâng lên các ngài những món quà này như một sự bày tỏ lòng kính trọng. Tôi đã khám phá nhiều thế giới, và chiêm nghiệm vô số bài học sâu sắc. Với sự ưng thuận của các ngài, tôi muốn nghiên cứu văn hóa của quý quốc, và đổi lại, tôi sẽ chia sẻ trí tuệ từ hàng trăm nền văn minh."
 paragon.40200.a:0 "Cô có thể làm được gì cho chúng ta?"
 paragon.40200.a.response:0 "Sở trường của tôi nằm ở cả lĩnh vực dị chủng học lẫn ngoại giao. Tri thức, tín dụng năng lượng và những cuộc đàm thoại là những gì tôi có thể cống hiến. Người ta còn có thể mong đợi điều gì hơn thế nữa chứ?"
 paragon.40200.b:0 "Tại sao cô lại muốn gia nhập cùng chúng ta?"
 paragon.40200.b.response:0 "Các ngài có sự cởi mở và chân thành mà tôi thấy vô cùng cuốn hút. Giống như tôi, các ngài nhìn thấy những tiềm năng to lớn trong sự hợp tác. Sẽ là một đặc ân khi được sống giữa những tâm hồn phóng khoáng như vậy."
 paragon.40200.c:0 "Làm thế nào cô có được vốn hiểu biết sâu rộng về văn hóa như vậy?"
 paragon.40200.c.response:0 "Cách tốt nhất để thấu hiểu một nền văn hóa xa lạ là mở rộng vòng tay đón nhận nó. Tôi đã lần đầu tiên tìm thấy tình yêu trên một thế giới xa lạ. Tôi bị mê hoặc bởi bạn đời của mình và nền văn hóa của họ, và dù giờ đây chúng tôi không còn bên nhau, mối quan hệ đó đã dạy cho tôi ý nghĩa của lòng bao dung và sự tôn trọng. Kể từ đó, tôi luôn cố gắng hòa nhập nhiều nhất có thể tại những nơi mình đi qua, gạt bỏ mọi gánh nặng định kiến."
 paragon.40200.hire_custom_tooltip:0 "§Y$NAME_xenophile2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.40300.name:0 "$NAME_militarist1$"
 paragon.40300.desc:1 "§HNam tước có vóc dáng bệ vệ oai nghiêm. Mọi cử chỉ của ông đều toát lên kỷ luật quân sự nghiêm ngặt. Đôi bốt không một vết bụi, bộ quân phục được ủi phẳng phiu, và ánh mắt luôn cảnh giác, tính toán. Nhưng đằng sau vẻ ngoài nghiêm nghị đó là một điều khác: khuôn mặt ông là cả một bản đồ của nỗi bi thương.§!\n\nTôi đến đây để cống hiến năng lực của mình với tư cách một đô đốc và một nhà chiến thuật.\n\nHãy chấp nhận lời thề của tôi, và tôi sẽ nghiền nát bất kỳ kẻ nào dám làm tổn hại đến các ngài."
 paragon.40300.a:0 "Nếu là một đô đốc, thì hạm đội của ông đâu?"
 paragon.40300.a.response:1 "Thật hổ thẹn, hạm đội đã mất sạch.\n\nKhi đó chúng tôi đang neo đậu quanh một ngôi sao đỏ để tiến hành các đợt sửa chữa sống còn, thì kẻ thù bất ngờ phục kích. Chúng ùa tới từ mọi hướng.\n\nBị áp đảo quân số mười chọi một, tôi bất lực nhìn các chiến hạm cùng thủy thủ đoàn của mình bỏ mạng quanh vầng thái dương địa ngục đó. Như một 'món quà' chia tay nhục nhã, chúng tha mạng cho tôi. Cho đến tận bây giờ, tôi vẫn mang theo nỗi ô nhục của thất bại đó bên mình."
 paragon.40300.b:0 "Tại sao ông lại muốn phục vụ chúng ta?"
 paragon.40300.b.response:0 "Tôi là một người lính. Chiến tranh là tất cả những gì tôi biết. Được chỉ huy các chiến hạm, điều binh khiển tướng... đó là lý do duy nhất khiến tôi còn tồn tại. Cho tôi một hạm đội, và tôi sẽ cho các ngài thấy một người nhà Jariden chiến đấu ra sao."
 paragon.40300.c:0 "Lẽ nào ông không nên phụng sự cho gia tộc của mình sao?"
 paragon.40300.c.response:1 "Gia tộc Jariden đã sụp đổ cùng với tôi. Sau thất bại đó, ngọn lửa khao khát báo thù đã thiêu đốt tâm can tôi. Hãy tin tôi, kẻ thù của tôi đã phải trả giá đắt cho những gì chúng gây ra. Danh dự của tôi có thể đã mất, nhưng tài thao lược chiến trận thì không. Tôi xin lấy mạng sống của mình ra để thề thốt điều này."
 paragon.40300.hire_custom_tooltip:0 "§Y$NAME_militarist1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.40400.name:0 "$NAME_militarist2$"
 paragon.40400.desc:1 "§HMột chiếc kiệu khổng lồ được khiêng bởi một đoàn nô lệ. Ngự bên trên là một sinh vật bò sát đáng sợ. Mọi dấu ấn của một quân phiệt đều hiện rõ ở ả: những vết sẹo chằng chịt, vũ khí phô trương, và những bộ hài cốt từ những chiến tích săn giết trong quá khứ.§!\n\nTa là Gia'Zumon, và đây là điều kiện của ta!\n\n§HKhi ả bước xuống khỏi ngai vàng, các thành viên trong đoàn tùy tùng đều phục rạp mình trước mặt ả.§!\n\nTa sẽ dẫn dắt quân đội của các ngươi. Ta sẽ nghiền nát kẻ thù của các ngươi. Thế giới của chúng sẽ bị thiêu rụi và của cải của chúng sẽ thuộc về các ngươi."
 paragon.40400.a:0 "Khoan đã. Tại sao ngươi lại muốn gia nhập cùng chúng ta?"
 paragon.40400.a.response:0 "Ta đã cướp bóc vô số thế giới. Quá dễ dàng. Và quá tẻ nhạt! Những kẻ yếu đuối phí hoài thời gian của chúng vào bộ máy quan liêu, nghệ thuật và những lời ba hoa vô nghĩa.\n\n§HẢ rít lên một tiếng hoang dã và nhe hàm răng lởm chởm sắc nhọn.§!\n\nĐế chế của các ngươi hùng mạnh và kẻ thù của các ngươi rất xứng tầm! Hãy để ta tiêu diệt chúng. Cho ta một trận chiến ra trò!"
 paragon.40400.b:0 "Quân đội của ngươi đâu rồi?"
 paragon.40400.b.response:0 "Ha! Đó quả là một ngày đáng nhớ! Hai năm trước, chúng ta xâm lược một thế giới hẻo lánh. Chúng ta đã tiêu diệt tất cả những kẻ dám chống cự, chiếm đoạt mọi thứ có giá trị và bắt những kẻ xứng đáng làm nô lệ. Rồi quân tiếp viện của chúng kéo đến.\n\n§HẢ chạm vào một trong những chiến lợi phẩm treo bên thắt lưng. Ả nhe răng cười toe toét.§!\n\nMột cuộc tắm máu thật huy hoàng. Một khúc hoan ca của sự tàn bạo. Cuối cùng chúng đã đè bẹp chúng ta, nhưng các chiến binh của ta đã ngã xuống trong vinh quang. Giờ ta đến với các ngươi không phải vì tiền tài, hay danh vọng. Ta đến để tìm kiếm một thách thức xứng tầm."
 paragon.40400.c:0 "Trông ngươi có vẻ hơi... cuồng tín quá mức."
 paragon.40400.c.response:0 "Chiến tranh là môn thể thao, là nhu cầu tất yếu, là công cụ. Nhưng chiến đấu... À, điều đó phơi bày rất nhiều điều. Chẳng có cách nào thuần khiết hơn thế để thử thách giới hạn của một kẻ. Kẻ nào lại không thấy phấn khích trước viễn cảnh đó chứ?"
 paragon.40400.hire_custom_tooltip:0 "§Y$NAME_militarist2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.40500.name:0 "$NAME_xenophobe1$"
 paragon.40500.desc:0 "§HSinh vật ngoại tộc bị bọc kín trong một thiết bị duy sinh đang ùng ục sôi. Chất lỏng sền sệt lắc lư qua các đường ống và lỗ thông hơi, khiến giọng nói của hắn phát ra thành từng tiếng sùng sục ướt át.§!\n\nCác cơ sở công nghiệp của các ngươi quả là một nỗi sỉ nhục."
 paragon.40500.a:0 "Giải thích rõ xem nào."
 paragon.40500.a.response:1 "Các ngươi có thể hưởng lợi từ chuyên môn của ta. Để ta chỉ cho các ngươi thấy ý nghĩa thực sự của hiệu suất.\n\n§HNhững xúc tu của gã ngoại tộc ngọ nguậy ươn ướt áp vào mặt kính mũ bảo hộ.§!\n\nTưởng thưởng kẻ mạnh. Tiêu trừ kẻ yếu. Thiên hà chẳng bao giờ thiếu nhân công. Ta sẽ mang chúng về cho các ngươi. Chúng sẽ làm việc, hoặc chúng sẽ chết. Và lợi nhuận sẽ tuôn chảy không ngừng."
 paragon.40500.b:0 "Tại sao lại chọn chúng ta?"
 paragon.40500.b.response:1 "Các ngươi không trà trộn với lũ ngoại nhân xoi mói.\n\n§HCùng một âm thanh sùng sục kinh tởm, chất lỏng tràn ngập bên trong mũ bảo hộ. Những xúc tu vẫy vùng, gã ngoại tộc toát ra một vẻ hưng phấn tột độ.§!\n\nBởi vì ta chia sẻ những giá trị của các ngươi. Bởi vì ta luôn giữ mình cách biệt."
 paragon.40500.c:0 "Đó là lý do ngươi mặc bộ đồ bảo hộ môi trường này sao?"
 paragon.40500.c.response:1 "Chính xác.\n\n§HMột tiếng hít thở ùng ục vang lên.§!\n\nỞ trong này, không thứ gì có thể chạm vào ta. Ở trong này, ta mới thực sự sạch sẽ."
 paragon.40500.hire_custom_tooltip:0 "§Y$NAME_xenophobe1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.40600.name:0 "$NAME_xenophobe2$"
 paragon.40600.desc:0 "§HKết quả quét của chúng ta cho thấy lớp vỏ ngoài của robot này đã hàng trăm năm tuổi. Giọng nói của nó đều đều đơn điệu, nhưng lời lẽ lại vang vọng kỳ lạ.§!\n\nDữ liệu chỉ ra sự bất tương thích giữa chính phủ của các vị và các thần dân. Thiếu kỷ luật. Tẩy não dưới chuẩn. Hành động khuyến nghị: bổ sung Aturion vào hệ thống. Loại bỏ các chức năng không cần thiết. Ưu tiên trật tự."
 paragon.40600.a:0 "Tại sao ngươi lại ở đây?"
 paragon.40600.a.response:0 "Mọi xã hội đều là một phương trình. Hãy cho phép Aturion giải phương trình của các vị. Không cần phải có bất kỳ biến số bất định nào."
 paragon.40600.b:0 "Tại sao ngươi lại muốn gia nhập cùng chúng ta?"
 paragon.40600.b.response:0 "Nền văn minh của các vị đang tiến gần đến các điều kiện lý tưởng. Trạng thái cân bằng hoàn hảo có thể đạt được trong khoảng thời gian ngắn nhất. Aturion đã tính toán xác suất thành công là 91,1%."
 paragon.40600.c:0 "Ai đã tạo ra ngươi?"
 paragon.40600.c.response:0 "Không liên quan."
 paragon.40600.d:0 "Hãy kể thêm cho chúng ta về các... phương trình đó."
 paragon.40600.d.response:1 "§HTừ một cổng trên ngực của robot, hàng chục hình chiếu ba chiều phóng ra. Nó bắt đầu thuyết minh bằng một giọng đều đều tẻ nhạt, bao gồm phân tích thống kê, kinh tế học, hồ sơ tâm lý, thao túng di truyền... Một trong những hình chiếu là thanh tiến trình. Nó cho biết buổi thuyết trình sẽ kéo dài thêm 127,8 ngày tiêu chuẩn nữa.§!"
 paragon.40600.hire_custom_tooltip:0 "§Y$NAME_xenophobe2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.40700.name:0 "$NAME_egalitarian1$"
 paragon.40700.desc:1 "§HChiến binh được trang bị vũ khí và áo giáp tối tân. Các kết quả quét phát hiện những sửa đổi sinh học sâu rộng cùng các cải tiến điều khiển học vượt trội.§!\n\nTướng quân Jynn, sẵn sàng phụng sự. Tôi là sứ giả của Thần Bí Cân Bằng. Tôi được phái đến để bảo vệ những kẻ khốn cùng và lật đổ ngai vàng của những tên bạo chúa. Tôi đề nghị được đứng vào hàng ngũ của các ngài."
 paragon.40700.a:0 "Thần Bí Cân Bằng là gì?"
 paragon.40700.a.response:0 "Chúng tôi là những kẻ hộ vệ thầm lặng của thiên hà. Chúng tôi tin rằng mọi sinh mệnh có tri giác đều xứng đáng được hưởng tự do và bình đẳng. Bất cứ nơi nào áp bức trỗi dậy, chúng tôi sẽ xuất hiện để dập tắt nó."
 paragon.40700.b:0 "Tại sao anh lại muốn gia nhập chúng tôi?"
 paragon.40700.b.response:0 "Đế chế của các ngài tôn trọng quyền tự quyết và phẩm giá của muôn dân. Đó là mảnh đất màu mỡ để gieo mầm cho những lý tưởng của tôi. Chúng ta có chung một kẻ thù: sự bạo ngược và bất công."
 paragon.40700.c:0 "Những cải tiến cơ thể của anh từ đâu mà có?"
 paragon.40700.c.response:0 "Chúng là những công cụ cần thiết cho sứ mệnh của tôi. Mỗi vết sẹo, mỗi bộ phận cơ khí đều là minh chứng cho một trận chiến đã qua nhằm bảo vệ những người vô tội. Thân xác này tồn tại chỉ để phụng sự cho lý tưởng."
 paragon.40700.hire_custom_tooltip:0 "§Y$NAME_egalitarian1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.40800.name:0 "$NAME_egalitarian2$"
 paragon.40800.desc:1 "§HMột nhà khoa học trẻ tuổi bước vào với vẻ mặt tươi rói. Đậu trên vai cô là một robot hình cầu tí hon liên tục phát ra những tiếng bíp vui tai.§!\n\nXin chào! Tôi là Zosira K'Tun, và đây là anh bạn nhỏ Gorky! Chúng tôi vừa thoát khỏi một sự cố phòng thí nghiệm nho nhỏ... à thực ra là nó nổ tung rồi. Các ngài có chỗ cho hai kẻ đam mê khoa học này không?"
 paragon.40800.a:0 "Cô có thể mang lại điều gì cho chúng ta?"
 paragon.40800.a.response:0 "Ồ, rất nhiều thứ! Nghiên cứu vật lý lý thuyết, chế tạo máy móc, tối ưu hóa năng lượng... và quan trọng nhất là niềm vui sáng tạo! Gorky và tôi có thể biến những ý tưởng điên rồ nhất thành hiện thực."
 paragon.40800.b:0 "Tại sao cô lại tìm đến chúng tôi?"
 paragon.40800.b.response:0 "Tôi nghe nói đế chế của các ngài khuyến khích tư duy tự do và sự đổi mới không giới hạn. Ở quê nhà, họ bắt tôi phải tuân theo những quy chuẩn cứng nhắc và chán ngắt. Tôi cần không gian để vẫy vùng!"
 paragon.40800.c:0 "Kể cho chúng ta nghe về Gorky đi."
 paragon.40800.c.response:0 "Gorky là kiệt tác của tôi đấy! Nó vừa là trợ lý tính toán, vừa là một người bạn tuyệt vời. Đôi khi nó hơi tọc mạch và thích nghịch ngợm dây điện, nhưng nếu không có nó, tôi có lẽ đã quên cả ăn ngủ rồi.\n\n§HChú robot nhỏ tiếp tục líu lo kêu bíp bíp.§!\n\nHaha đúng rồi! Chuẩn luôn bạn hiền!"
 paragon.40800.d:0 "Cô vừa nói phòng thí nghiệm của mình nổ tung?"
 paragon.40800.d.response:1 "Ôi chao, biết bắt đầu từ đâu nhỉ?! Các ngài thấy đấy, ở hành tinh mẹ của tôi, người ta kiểm soát rất gắt gao chuyện ai được phép làm nhà khoa học. Thế là tôi lén lút dựng một phòng thí nghiệm bằng bất cứ thứ phế liệu nào nhặt được từ các khu công nghiệp cũ. Tôi cứ ngỡ trường ion hóa sẽ giữ cho các hạt bụi dễ bay hơi ổn định, nhưng ai ngờ...\n\n§HChú robot nhỏ ríu rít kêu bíp bíp.§!\n\nĐúng không? Tiếng nổ trầm ấm từ đống hạt bụi đó quả thực là cực kỳ hoành tráng! Vậy chừng nào tôi có thể bắt đầu làm việc?"
 paragon.40800.hire_custom_tooltip:0 "§Y$NAME_egalitarian2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.40900.name:0 "$NAME_materialist1$"
 paragon.40900.desc:1 "§HĐược treo lơ lửng trên một cần cẩu cơ động khổng lồ là phần đầu và thân trên của một sinh vật dạng người. Trước đây đây hẳn từng là một sinh vật hữu cơ, nhưng những gì còn sót lại hầu hết chỉ là kim loại, dây dẫn và chất dẻo. Bất thình lình, cơ thể giật nảy và sống dậy, hai con mắt tổng hợp bắt đầu phát sáng rực, và một giọng nói rè rè cất lên.§!\n\nTôi là Xondar. Tôi tìm kiếm một vị trí chỉ huy."
 paragon.40900.a:0 "Chuyện gì... đã xảy ra với ngươi?"
 paragon.40900.a.response:0 "Tôi từng bằng xương bằng thịt. Như bao đồng loại của mình, tôi từng chịu sự tàn phá của tuổi tác và bệnh tật. Thịt máu yếu hèn, nên tôi đã rũ bỏ nó. Ý thức của tôi đã được số hóa và tải lên. Tôi đã phá tan chiếc lồng giam thể xác từng cầm tù mình."
 paragon.40900.b:0 "Tại sao ngươi lại muốn gia nhập cùng chúng ta?"
 paragon.40900.b.response:0 "Mê tín, tôn giáo... Những lời dối trá vô căn cứ, chỉ có tác dụng kích động trái tim vào cơn cuồng loạn chém giết. Cội nguồn của vô vàn cuộc chiến và nỗi đau khổ bất tận. Các ngài và đồng bào của các ngài thấu suốt qua những điều nhảm nhí đó. Những gì có thật là thứ có thể nhìn thấy, nếm được, chạm vào được. Cũng như việc phải loại bỏ thể xác để đạt tới sự hoàn mỹ, những ảo tưởng trẻ con phải bị dẹp sang một bên."
 paragon.40900.c:0 "Ngươi tìm kiếm quyền chỉ huy một hạm đội sao?"
 paragon.40900.c.response:0 "Hình hài các ngài thấy trước mắt chỉ là một phần nhỏ của tôi. Hư không mới là nhà của tôi, và tôi hòa làm một với các chiến hạm của mình. Ý thức của tôi đã ăn sâu vào từng hệ thống của chúng; các cảm biến là mắt và tai, thân tàu là da thịt tôi. Với tôi dẫn đầu, tôi có thể điều khiển các hạm đội của các ngài đạt tới đỉnh cao uy lực chưa từng có."
 paragon.40900.d:0 "Hãy kể cho chúng ta về quá trình biến đổi của ngươi?"
 paragon.40900.d.response:0 "Còn gì để nói nữa đâu? Thân xác tôi lâm trọng bệnh. Tôi được trao cơ hội để cứu lấy tâm trí mình, và tôi chộp lấy nó ngay. Rất nhiều kẻ khác cũng đã thử làm điều tương tự. Chẳng một ai sống sót đến ngày nay ngoài tôi."
 paragon.40900.hire_custom_tooltip:0 "§Y$NAME_materialist1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.41000.name:0 "$NAME_materialist2$"
 paragon.41000.desc:0 "§HGã thợ cơ khí thấp đậm và chắc nịch đang chen chúc trong một bộ khung xương trợ lực. Dụng cụ, phụ tùng vương vãi cùng đôi bàn tay dính đầy dầu mỡ mang đậm dấu ấn của một tay thợ mày mò lành nghề, và ánh mắt gã lấp lánh sự tò mò cùng lòng nhiệt huyết.§!\n\nChào buổi sáng, sếp! Tôi là Borin, con trai của Noga. Rất hân hạnh được diện kiến!"
 paragon.41000.a:0 "Vậy, anh có thể làm được gì cho chúng ta?"
 paragon.41000.a.response:0 "Tôi đã làm thợ phế liệu suốt ba mươi năm qua. Tôi nghĩ từng ấy năm là đủ cho một bản sơ yếu lý lịch rồi. Các ngài cần chế tạo thứ gì? Cần sửa chữa món gì ư?\n\n§HGã chỉ ngón tay cái vào ngực mình.§!\n\nTôi cân được hết. Không phải khoác lác hay gì đâu, nhưng tôi đã sửa chữa mọi thứ có thể sửa trên cõi đời này rồi. Và không chỉ một mình tôi đâu - tôi có cả một đội bot chuyên biệt để tháo dỡ, cắt gọt, hàn gắn, thu gom, sửa chữa và lắp ráp lại bất cứ thứ gì các ngài cần. Cứ cho tôi một đội ngũ và tôi có thể bảo trì toàn bộ lực lượng hải quân cho các ngài nếu muốn. Đối với tôi thì càng hoành tráng lại càng thích thú."
 paragon.41000.b:0 "Tại sao lại làm việc cho chúng tôi?"
 paragon.41000.b.response:0 "Tôi chỉ đang cố gắng bươn chải kiếm sống trong thiên hà thôi. Các ngài có vẻ là một ông chủ biết quý trọng sức lao động chăm chỉ cùng đôi bàn tay vững vàng. Một người nhìn nhận thế giới đúng như bản chất vốn có của nó, nắm lấy những gì chúng ta đang có và dùng chúng để xây dựng nên một tương lai xán lạn hơn."
 paragon.41000.c:0 "Tại sao anh lại từ bỏ công việc trước đây?"
 paragon.41000.c.response:1 "Nói thật lòng ư? Tôi chán rồi. Từ ngày còn nhớ được đến giờ, tôi luôn mơ ước được lướt đi giữa hư không. Tôi muốn thách thức giới hạn của bản thân, xem mình có thể đi xa đến đâu. Thế là tôi thu dọn đồ nghề và có mặt ở đây. Giờ thì, trừ phi các ngài còn câu hỏi nào khác, các ngài thấy sao nếu chúng ta bắt tay vào việc chế tạo luôn?"
 paragon.41000.hire_custom_tooltip:0 "§Y$NAME_materialist2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.41100.name:0 "$NAME_pacifist1$"
 paragon.41100.desc:0 "§HVị ngoại tộc khoác trên mình bộ lễ phục lộng lẫy và tinh xảo. Bất chấp tuổi tác đã cao thấy rõ, đôi mắt ông vẫn vô cùng tinh tường và toát lên trí tuệ sắc bén.§!\n\nXin kính chào. Tôi đến đây để cống hiến năng lực của mình với tư cách một người giữ gìn hòa bình."
 paragon.41100.a:1 "Hãy kể thêm cho chúng ta nghe về bản thân ông."
 paragon.41100.a.response:0 "Tôi là một trong số ít những người được tấn phong làm Thẩm Phán trong đồng bào của mình. Đây là một chức vị vô cùng vinh dự. Tôi đã thuộc nằm lòng luật pháp của nhiều thế giới, và qua bề dày kinh nghiệm, tôi đã học được cách giữ thăng bằng cho cán cân công lý."
 paragon.41100.b:0 "Tại sao ông lại muốn làm việc cùng chúng tôi?"
 paragon.41100.b.response:0 "Tôi đã già. Tôi đã hoàn thành trọn vẹn nhiệm kỳ phụng sự của mình. Mặc dù tập tục của giống loài chúng tôi là nhường đường cho thế hệ trẻ, nhưng sứ mệnh của tôi vẫn chưa kết thúc. Tội phạm không có biên giới, và tôi vẫn còn nhiều điều có thể cống hiến. Nhiều thế lực trong thiên hà đã tìm đến tôi với những lời mời làm việc. Nhưng có ý nghĩa gì khi làm việc cho những kẻ lạm dụng quyền lực? Tôi tin rằng giá trị của chúng ta tương đồng về điều này, và sẽ là đặc ân của tôi khi được phụng sự nhân dân của các ngài."
 paragon.41100.c:0 "Làm thế nào ông giữ gìn được hòa bình?"
 paragon.41100.c.response:1 "Hòa bình không chỉ đơn thuần là sự vắng bóng của chiến tranh. Đó là sự hiện diện của công lý. Khi người dân cảm thấy được đối xử công bằng, khi pháp luật được thượng tôn và bảo vệ kẻ yếu, thì gốc rễ của xung đột sẽ tự khắc biến mất."
 paragon.41100.hire_custom_tooltip:0 "§Y$NAME_pacifist1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.41200.name:0 "$NAME_pacifist2$"
 paragon.41200.desc:0 "§HNhà ngoại giao ngoại tộc xuất hiện với một phong thái vô cùng duyên dáng và quý phái. Lớp da lấp lánh như dát vàng dưới ánh đèn phòng tiếp kiến.§!\n\nKính chào quý vị lãnh đạo tôn quý. Tôi là Vas Hoàng Kim. Tôi đến đây để mang hòa bình và thịnh vượng đến cho đế chế của các ngài thông qua nghệ thuật ngoại giao tinh tế."
 paragon.41200.a:1 "Nghệ thuật ngoại giao của anh có gì đặc biệt?"
 paragon.41200.a.response:0 "Chiến tranh là công cụ vụng về của những kẻ thiếu kiên nhẫn. Một lời nói ngọt ngào đúng lúc, một hiệp ước thương mại khôn khéo có thể khuất phục cả một hạm đội mà không tốn một viên đạn. Tôi biết cách biến kẻ thù thành bạn hữu, và bạn hữu thành những đối tác đem lại nguồn lợi khổng lồ."
 paragon.41200.b:0 "Tại sao anh lại chọn đế chế chúng tôi?"
 paragon.41200.b.response:0 "Các ngài có tầm nhìn xa trông rộng và sự điềm tĩnh cần thiết của những nhà kiến tạo hòa bình vĩ đại. Dưới sự dẫn dắt của các ngài, tôi tin rằng chúng ta có thể dệt nên một mạng lưới đồng minh vững chắc trên khắp thiên hà."
 paragon.41200.c:0 "Vẻ ngoài dát vàng của anh là tự nhiên hay nhân tạo?"
 paragon.41200.c.response:0 "Một chút phép màu từ Tu Viện Sao Từ Alyssum, cộng thêm sự trau chuốt của tự nhiên. Vẻ đẹp cũng là một thứ quyền lực mềm, thưa các ngài. Người ta khó lòng nói lời từ chối với một kẻ rực rỡ và lôi cuốn."
 paragon.41200.hire_custom_tooltip:0 "§Y$NAME_pacifist2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.41300.name:0 "$NAME_authoritarian1$"
 paragon.41300.desc:0 "§HMột bóng hình bí ẩn ẩn hiện trong tấm áo choàng tối màu bước ra từ vùng tối. Dù che giấu diện mạo, khí chất nguy hiểm và sắc sảo của ả không thể nhầm lẫn.§!\n\nTôi là Kai-Sha. Nếu các ngài muốn biết điều gì đang thực sự diễn ra trong thiên hà này—những điều mà các đại sứ giấu giếm và các điệp viên bỏ lỡ—thì các ngài cần đến tôi."
 paragon.41300.a:0 "Cô có những nguồn tin nào?"
 paragon.41300.a.response:0 "Mạng lưới của tôi len lỏi vào từng ngóc ngách: từ những quán rượu tồi tàn của hải tặc đến phòng họp kín của các hội đồng tối cao. Không có bí mật nào bị chôn vùi quá sâu, chỉ có giá tiền chưa đủ cao mà thôi."
 paragon.41300.b:0 "Lòng trung thành của cô thuộc về ai?"
 paragon.41300.b.response:0 "Lòng trung thành là một món hàng xa xỉ, nhưng tôi có nguyên tắc nghề nghiệp của mình. Chừng nào các ngài còn nắm giữ quyền lực và trọng dụng tôi, thông tin của tôi sẽ chỉ dành riêng cho ngai vàng của các ngài."
 paragon.41300.c:0 "Tại sao cô lại tìm đến chúng tôi?"
 paragon.41300.c.response:0 "Các ngài biết cách cai trị bằng bàn tay sắt bọc nhung. Những kẻ có trật tự và kỷ luật luôn là những khách hàng và nhà bảo trợ tốt nhất cho công việc của tôi."
 paragon.41300.d:0 "Là một điệp viên, cô trang bị vũ khí hơi nặng nề đấy."
 paragon.41300.d.response:0 "Trong ngành nghề của tôi, những điều bất ngờ thường dẫn đến mất mạng. Tôi thích chuẩn bị kỹ lưỡng cho mọi tình huống."
 paragon.41300.hire_custom_tooltip:0 "§Y$NAME_authoritarian1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.41400.name:0 "$NAME_authoritarian2$"
 paragon.41400.desc:0 "§HLàn da của gã ngoại tộc lấp lánh những chất dịch nhờn nhớp nháp. Gã gập người cúi đầu sát đất từ thắt lưng. Khi cất tiếng, giọng gã cao vút đến đáng ngạc nhiên, gần như giọng trẻ con.§!\n\nThưa Chúa thượng, thưa Bệ hạ, ôi! Đấng Tối Cao tối thượng - Tôi, Người Chăm Sóc Q'la, chỉ là kẻ bầy tôi hèn mọn của Người. Lời của Người là thánh chỉ đối với tôi. Hãy để tôi trông coi một trong các hành tinh của Người, và tôi sẽ mang lại cho Người vinh quang và của cải. Ôi, vô vàn của cải!"
 paragon.41400.a:0 "Ngươi rốt cuộc có thể làm được gì cho chúng ta?"
 paragon.41400.a.response:0 "Cả hai chúng ta đều hiểu rõ sự đời mà. Lũ thường dân vốn lười biếng. Chúng luôn đòi hỏi thêm quyền lợi, lương cao hơn, tự do hơn... Nếu cứ buông lỏng, chúng sẽ nhét đầy bụng những thứ vốn dĩ thuộc về Người! Nhưng nếu giao cho tôi cai quản...\n\n§HChầm chậm, gã siết chặt nắm tay.§!\n\nChỉ cần cho tôi một hành tinh, tôi sẽ vắt sạch những tư tưởng ngớ ngẩn đó ra khỏi đầu chúng. Chúng sẽ biết ơn Người sâu sắc, hỡi Đấng Quang Vinh. Ôi! Chắc chắn chúng sẽ như vậy!"
 paragon.41400.b:0 "Tại sao ngươi lại tìm cách gia nhập cùng chúng ta?"
 paragon.41400.b.response:0 "Ai lại không chộp lấy cơ hội được phụng sự một đấng uy nghiêm đến nhường này chứ?\n\n§HGã khúc khích cười trong sự phấn khích.§!\n\nCó những kẻ sinh ra để thống trị. Kẻ còn lại sinh ra để bị dẫn dắt. Đó là trật tự của vạn vật. Người có thể tin tôi. Tôi sẽ trung thành phụng sự Người."
 paragon.41400.c:0 "Ngươi nịnh nọt cũng giỏi đấy."
 paragon.41400.c.response:0 "Ôi, hỡi Đấng Tôn Quý nhất trần đời! Đây mới chỉ là một chút xíu lòng thành thôi! Tôi có thể tiếp tục được không? So với Người, tôi chỉ là thứ bùn nhơ. Tôi chỉ là con ấu trùng đang ngọ nguậy dưới đất bẩn! Được ngợi ca Người là vinh dự và đặc ân của tôi. Chỉ cần sự hiện diện của Người thôi cũng đã khiến lòng tôi tràn ngập hoan lạc rồi. Hãy để tôi được phụng sự Người với lòng tận tụy vô biên!"
 paragon.41400.hire_custom_tooltip:0 "§Y$NAME_authoritarian2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.41500.name:0 "$NAME_spiritualist1$"
 paragon.41500.desc:1 "§HGã ngoại tộc đứng bất động như tượng đá.§!\n\nĐịnh mệnh dẫn lối cho từng bước chân tôi. Tôi đã vượt qua những cõi mịt mù vô tận để được diện kiến trước ngài. Tôi là Ulastar, Thần Ngôn."
 paragon.41500.a:0 "Ông có thể nói gì về vận mệnh của chúng ta?"
 paragon.41500.a.response:0 "§HÔng nhìn chăm chú bằng đôi mắt mù lòa.§!\n\nTrên một ngả đường, ngọn lửa trắng bùng cháy rực rỡ đối nghịch với hư không. Trên ngả đường còn lại là một đốm than hồng đang tàn lụi tí tách. Các ngài sẽ phải đối mặt với Nỗi Kinh Hoàng, và đó sẽ là ngày tàn của các ngài. Trừ phi? Những sợi tơ định mệnh dệt nên một tia hy vọng mong manh nhất. Tai kiếp vẫn có thể được đẩy lùi."
 paragon.41500.b:0 "Tại sao ông lại tìm cách gia nhập cùng chúng tôi?"
 paragon.41500.b.response:0 "§HTừ một chiếc túi giấu kín, ông tung ra một đám mây bụi xoáy tròn. Khi cất tiếng, ông làm điều đó như một lời tuyên ngôn:§!\n\nTôi đến bởi vì tôi được triệu gọi. Các ngài đã tìm kiếm tôi. Hoặc có lẽ các ngài sẽ làm như vậy."
 paragon.41500.c:0 "Chính xác thì ông sẽ làm gì cho chúng tôi?"
 paragon.41500.c.response:1 "§HTừ nếp gấp áo choàng, $NAME_spiritualist1$ lấy ra một bộ xương thú chạm khắc. Rải chúng ra sàn, ông dường như quan sát các họa tiết bằng những giác quan vượt lên trên thị giác.§!\n\nTôi sẽ chia sẻ những linh kiến của mình với các tín đồ. Tôi sẽ giữ vững tay lái cho con tàu quốc gia của các ngài khi nó chuẩn bị lao vào giông bão."
 paragon.41500.d:1 "Làm thế nào ông có được thiên phú này?"
 paragon.41500.d.response:1 "Nhiều năm trước, tôi từng còng lưng làm lụng trong những hầm mỏ hành tinh tăm tối. Dù thể xác tôi nhìn thấy được, nhưng linh hồn tôi đã bị thế giới vật chất làm cho mù quáng. Rồi ngày thức tỉnh của tôi cũng đến.\n\nHọ gọi đó là một tai nạn, nhưng tôi biết đó là ý trời; một vụ nổ bất ngờ đã thiêu rụi các dây thần kinh thị giác của tôi. Trong bóng tối bao trùm sau đó, tôi đã thấu suốt dòng sông thời gian. Cho đến tận ngày nay, nó vẫn không ngừng chảy trôi trước mắt tôi."
 paragon.41500.hire_custom_tooltip:0 "§Y$NAME_spiritualist1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

 paragon.41600.name:0 "$NAME_spiritualist2$"
 paragon.41600.desc:1 "§HNgười đàn ông gầy gò đến mức như sắp chết đói. Toát lên từ ông là một vẻ tàn tạ: bộ y phục đẹp đẽ đã sờn rách phai màu, làn da khô như giấy da, và giọng nói thều thào khó lòng nghe rõ hơn tiếng thì thầm.§!\n\nTên tôi là Nasuz Demetor. Tôi là kẻ thu thập tro bụi và những huyền thoại. Cảm ơn các ngài đã tiếp đón tôi."
 paragon.41600.a:0 "Tro bụi và huyền thoại ư?"
 paragon.41600.a.response:1 "§HChút nụ cười làm căng bề mặt làn da nhăn nheo của ông.§!\n\nThiên hà này già cỗi lắm rồi. Rất lâu trước khi đồng bào của các ngài xuất hiện, vô số nền văn minh khác đã trỗi dậy rồi lụi tàn. Tro bụi là di sản của họ, còn huyền thoại là gia tài thừa kế của chúng ta. Tôi tìm cách vén màn sự thật của quá khứ, ngõ hầu lưu giữ nó lại. Để người đời sau có thể học hỏi từ đó."
 paragon.41600.b:0 "Và đó là lý do ông tìm đến đây?"
 paragon.41600.b.response:0 "Không chỉ vì lợi ích của riêng tôi, tôi xin cam đoan với các ngài. Không, sự giàu có của quá khứ là khôn xiết. Tôi muốn chia sẻ chúng cùng các ngài."
 paragon.41600.c:0 "Ông đã thu hoạch được gì từ những cuộc khai quật của mình?"
 paragon.41600.c.response:1 "Cổ vật, trí tuệ, vẻ huy hoàng tráng lệ... Nhưng không chỉ có thế. Vạn vật đều có tiếng vọng của chúng trong quá khứ. Nghịch lý phải không? Rằng trong cuộc chiến chống lại sự lãng quên, chúng ta thường quên mất việc lắng nghe."
 paragon.41600.hire_custom_tooltip:0 "§Y$NAME_spiritualist2$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."

###### Renowned Leaders Events #######

# Lysator Syng / xenophile1
 paragon.40110.name:0 "Kho Báu Của Zteg-Mayr"
 paragon.40110.desc:1 "§Y[Root.GetName]§! biết rất nhiều câu chuyện về Hải tặc Chúa Zteg-Mayr đáng sợ. Nhiều thế kỷ trước, hắn đã cướp bóc ngang dọc khắp thiên hà, chiếm đoạt của cải, tài nguyên hiếm và những cổ vật vô giá. Giờ đây, nhờ một tập hải đồ sao cổ, [Root.GetFirstName] tin rằng [Root.GetHeShe] đã phát hiện ra nơi Zteg-Mayr cất giấu kho chiến lợi phẩm dồi dào của mình. [Root.GetFirstName] từ chối giải thích chi tiết về cách lấy được tấm bản đồ, nhưng tin rằng chúng là thật và muốn chúng ta phái một tàu xây dựng đến để khai quật kho báu. Nếu như vẫn còn lại thứ gì đó."
 paragon.40110.a:0 "Có lẽ rất đáng để xem xét."
 LYSATOR_PIRATE_TREASURE:0 "Kho Báu Hải Tặc"
 LYSATOR_PIRATE_TREASURE_DESC:0 "Kho báu hải tặc của Zteg-Mayr được phát hiện bởi [event_target:renowned_xenophile1.GetName]."
 paragon.40111.name:0 "Kho Báu Hải Tặc"
 paragon.40111.desc:1 "Hầm ngầm chứa kho báu của Hải tặc Chúa Zteg-Mayr đã bị xuyên phá. Kho tàng cổ vật này, bị cướp bóc từ vô số thế giới khác nhau, giờ đây sẽ phục vụ cho lợi ích của quốc gia chúng ta."
 paragon.40111.a:0 "Tốt."

 paragon.40120.name:0 "Bến Đỗ An Toàn"
 paragon.40120.desc:1 "Tin tức về sự đón tiếp nồng hậu mà chúng ta dành cho §Y[Root.GetName]§! đã lan truyền khắp thiên hà. Những kẻ lưu vong, bất hảo và hải tặc thuộc mọi tầng lớp giờ đây coi quốc gia của chúng ta là nơi rộng mở cho tất cả, một nơi mà bất kỳ ai cũng có thể làm lại từ đầu. [Root.GetFirstName] đang tận dụng điều này, tận hưởng danh tiếng mới và mời những người quen cũ gia nhập cùng chúng ta. Nhiều kẻ đã đáp lại lời kêu gọi, tìm kiếm một cuộc sống mới tốt đẹp hơn."
 paragon.40120.a:0 "Họ luôn được hoan nghênh."
 paragon.40120.b:0 "Đuổi bọn họ đi."
 pop_outcast_happy:0 "Những Kẻ Tha Hương Biết Ơn"
 pop_outcast_happy_desc:1 "Bày tỏ lòng biết ơn sâu sắc trước cơ hội làm lại cuộc đời, những kẻ từng bị tha hương này đã nhanh chóng hòa nhập với lối sống của chúng ta."
 pop_outcast_unhappy:0 "Những Kẻ Tha Hương Vô Ơn"
 pop_outcast_unhappy_desc:1 "Chậm chạp trong việc tìm chỗ đứng trong xã hội chúng ta, những kẻ từng bị tha hương này cảm thấy không được chào đón và có xu hướng bày tỏ sự bất mãn."
 pop_outcast_crime:0 "Những Kẻ Tha Hương Tội Phạm"
 pop_outcast_crime_desc:1 "Tìm cách lợi dụng lòng tin của chúng ta, những kẻ từng bị tha hương này đã trục lợi từ lòng tốt của chúng ta."

 # Nona / xenophile2
 paragon.40210.name:0 "Cống Phẩm Thất Lạc"
 paragon.40210.desc:1 "§Y[Root.GetName]§! đã nghe ngóng được những tin đồn về khối của cải khổng lồ được chở bởi một đoàn tàu vận tải mất tích. Có vẻ như một sứ giả ngoại tộc cùng đoàn tùy tùng từng được cử đi cống nạp cho một quân phiệt nào đó. Trong nhiệm vụ gần đây nhất của [Root.GetHisHer], [Root.GetHeShe] đã xác định được vị trí cuối cùng của đoàn tàu. Chúng ta chỉ cần phái một con tàu đến để thu hồi nó."
 paragon.40210.a:0 "Tất nhiên là chúng ta không thể bỏ qua rồi."
 NONA_LOST_CONVOY:0 "Cống Phẩm Thất Lạc"
 NONA_LOST_CONVOY_DESC:0 "Một đoàn tàu vận tải cổ xưa được phát hiện bởi [event_target:renowned_xenophile2.GetName]. Người ta đồn rằng nó chứa vô số của cải quý giá."
 paragon.40211.name:0 "Trục Vớt Hoàn Tất"
 paragon.40211.desc:0 "Chiến dịch trục vớt đoàn tàu mất tích đã kết thúc. Toàn bộ tài nguyên nằm tại địa điểm rơi đã được thu hồi an toàn."
 paragon.40211.a:0 "Tuyệt hảo."

 paragon.40220.name:0 "Một Người Blorg Tìm Đến"
 paragon.40220.desc:1 "Bạn đời cũ của §Y[Root.GetName]§!, viên quan chức Blorg mang tên §Y$NONA_BLORG_EX_HUSBAND_NAME$§!, mong muốn gia nhập đế chế chúng ta. Viên quan chức này đã sa cơ lỡ vận và đang tìm kiếm một khởi đầu mới. [Root.GetFirstName] khẳng định $NONA_BLORG_EX_HUSBAND_NAME$ có bề dày kinh nghiệm trong việc quản lý các thế giới khai mỏ, và viên quan chức hòa nhã này đã mang theo một kho khoáng sản quý giá như một cử chỉ thiện chí."
 paragon.40220.a:0 "Chúng ta có lẽ có thể tìm việc gì đó cho anh ta."
 paragon.40220.a.custom_tooltip:0 "Người Blorg §Y$NONA_BLORG_EX_HUSBAND_NAME$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."
 paragon.40220.b:0 "Không, cảm ơn. Đi chỗ khác đi."
 NONA_BLORG_EX_HUSBAND_NAME:0 "Keram"
 NONA_BLORG_EX_HUSBAND_DESC:0 "Một người Blorg chăm chỉ, được trui rèn qua vô vàn gian truân trắc trở trong cuộc sống."

 # Baron Vyctor Jariden / militarist1
 paragon.40310.name:0 "Trút Bỏ Gánh Nặng của [Root.GetHisHerCap]"
 paragon.40310.desc:1 "Cuối cùng, §Y[Root.GetName]§! đã nguôi ngoai sau cú sốc tinh thần từ sự sụp đổ của Gia tộc quý tộc từng một thời kiêu hãnh của [Root.GetHisHer]. Trút bỏ được cảm giác tội lỗi và u sầu, [Root.GetHeShe] đã tìm thấy lẽ sống mới trong việc phụng sự nhân dân chúng ta."
 paragon.40310.a:0 "Rất tốt."

 paragon.40320.name:0 "Nhà Bành Trướng Thẳng Thắn"
 paragon.40320.desc:1 "Trong một bài phát biểu nảy lửa, §Y[Root.GetName]§! tuyên bố rằng trọng tâm của quốc gia phải đặt vào sự bành trướng. [Root.GetHeSheCap] đã đệ trình hai phương án về cách hạm đội có thể sử dụng thêm tài nguyên để thúc đẩy mục tiêu đó. Cả hai lựa chọn đều hợp lý và có thể mang lại lợi ích to lớn cho chúng ta về lâu dài. Tuy nhiên, việc thực thi cả hai kế hoạch cùng lúc là bất khả thi."
 paragon.40320.a:0 "Một hạm đội hùng mạnh sẽ cho chúng thấy uy lực của chúng ta."
 paragon.40320.b:0 "Hậu cần vượt trội sẽ dẫn lối chúng ta tới chiến thắng."
 vyctor_aggressive_expansion_plan:0 "Kế Hoạch Bành Trướng Quyết Liệt"
 vyctor_aggressive_expansion_plan_desc:1 "Các trận đánh được định đoạt bằng chiến lược, nhưng thực lực vẫn là nền tảng của thành công. Khi sử dụng vũ lực, tốt nhất là nên hành động một cách kiên quyết."
 vyctor_improved_fleet_logistics:0 "Hậu Cần Hạm Đội Cải Tiến"
 vyctor_improved_fleet_logistics_desc:0 "Hiệu quả là điều không bao giờ được phép xem nhẹ: Bằng cách tối ưu hóa sản lượng của các xưởng đóng tàu, bước tiến bành trướng của chúng ta sẽ càng thêm thần tốc."

 # Gia'Zumon / militarist2
 paragon.40410.name:0 "Tiếng Gọi Của Máu Lửa"
 paragon.40410.desc:1 "§Y[Root.GetName]§! đã chiến thắng trong nhiều trận đánh. [Root.GetHeSheCap] từng kề vai sát cánh cùng một chiến binh vĩ đại khác, $GIA_ZUMON_GREAT_WARRIOR_NAME$, người hiện đang tìm kiếm một vị minh chủ mới để phụng sự. Hắn là một đô đốc tàn nhẫn, và [Root.GetFirstName] dành cho hắn những lời khen ngợi hết mực."
 paragon.40410.a:0 "Vinh quang đang chờ đón hắn nếu hắn gia nhập cùng chúng ta."
 paragon.40410.a.custom_tooltip:0 "Đô đốc người Tzynn §Y$GIA_ZUMON_GREAT_WARRIOR_NAME$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."
 paragon.40410.b:1 "Hắn có thể dạy cho chúng ta điều gì về chiến tranh?"
 GIA_ZUMON_GREAT_WARRIOR_NAME:0 "Hask'Guttra"
 GIA_ZUMON_GREAT_WARRIOR_DESC:1 "Một đô đốc tàn bạo đã kinh qua vô số cuộc chiến. Người ta đồn rằng [Root.GetHeSheCap] là kẻ vô tâm sắt đá, chỉ quan tâm đến chém giết và hủy diệt."
 gia_zumon_taught_warfare_by_great_warrior:0 "Được Huấn Luyện Bởi $GIA_ZUMON_GREAT_WARRIOR_NAME$"
 gia_zumon_taught_warfare_by_great_warrior_desc:1 "Các hạm đội của chúng ta đã được hưởng lợi từ kiến thức uyên thâm của chiến binh vĩ đại, $GIA_ZUMON_GREAT_WARRIOR_NAME$."

 paragon.40420.name:0 "Máu Và Cát"
 paragon.40420.desc:1 "§Y[Root.GetName]§! cảm thấy bồn chồn và khao khát một trận chiến ra trò. [Root.GetHeSheCap] đã chán ngấy với những kẻ yếu đuối đang làm hoen ố [coliseum_planet.GetName]. [Root.GetHeSheCap] đã đề xuất xây dựng một đấu trường nơi những kẻ săn tìm vinh quang có thể đối đầu với những tên tội phạm. Một kế hoạch như vậy chắc chắn sẽ mang lại cho các chiến binh của chúng ta sự huấn luyện vô cùng quý giá."
 paragon.40420.a:0 "Hãy bật đèn xanh cho [Root.GetHimHer]."
 paragon.40420.b:0 "Đây không phải là cách làm đúng đắn."
 gia_zumon_arena:0 "Đấu Trường"
 gia_zumon_arena_opened:0 "Khai Trương Đấu Trường"
 gia_zumon_arena_opened_desc:1 "Dù các chiến binh của chúng ta hoan nghênh cơ hội giải tỏa căng thẳng, nhưng sự khát máu bùng phát đã dẫn đến một số lo ngại trong dân chúng."

 # Factorator Shuladun / xenophobe1
 paragon.40510.name:0 "Đề Xuất Tối Ưu Hóa"
 paragon.40510.desc:1 "§Y[Root.GetName]§! mong muốn tự động hóa các phương thức vận chuyển trên [planet_governed.GetName]. Kế hoạch đề xuất sẽ liên kết các nhà máy, xưởng tinh chế và cơ sở chế biến lại với nhau thông qua một mạng lưới đường ống và băng chuyền phức tạp. Mặc dù trên lý thuyết dự án này có vẻ rất tốt, nhưng lại tiềm ẩn nhiều rủi ro cho cư dân sống xung quanh; từ sự cố tràn hóa chất công nghiệp, nỗi lo rò rỉ bức xạ đến các rung động tần số cao, mối nguy hiểm là hoàn toàn có thật."
 paragon.40510.a:0 "Khởi động dự án."
 paragon.40510.b:0 "Không, chúng ta phải bảo vệ người dân."
 factorator_industrial_network:0 "Mạng Lưới Công Nghiệp"
 factorator_industrial_network_desc:0 "Mạng lưới đường ống vận chuyển phức tạp do §Y$NAME_xenophobe1$§! thiết kế; cực kỳ hiệu quả, nhưng phải đánh đổi bằng sức khỏe của người dân."

 paragon.40520.name:0 "Những Thí Nghiệm Đầy Triển Vọng?"
 paragon.40520.desc:1 "§Y[Root.GetName]§! đã đệ trình các kế hoạch nghiên cứu nhằm đánh giá các bước phát triển công nghiệp trong tương lai. Điều này có thể mang lại lợi ích cho nền kinh tế cũng như các dự án cá nhân của [Root.GetHisHer]. [Root.GetHeSheCap] đã chuẩn bị một số thí nghiệm trông rất hứa hẹn nhưng có khả năng sẽ giết chết hầu hết các đối tượng thử nghiệm. [Root.GetHeSheCap] cam đoan với chúng ta rằng một sự hy sinh nhỏ là cần thiết vì đại cục."
 paragon.40520.a:0 "Cứ tiến hành đi."
 paragon.40520.b:0 "Không, điều này thật tàn nhẫn và phi đạo đức."
 factorator_inhumane_work_experiments:0 "Thí Nghiệm Công Nghiệp Tàn Nhẫn"
 factorator_inhumane_work_experiments_desc:1 "Công trình của §Y$NAME_xenophobe1$§! nhằm thúc đẩy phát triển công nghiệp không phải là không có rủi ro; một tuyên bố được những người sống sót sau các đợt thử nghiệm của hắn háo hức chứng thực."
 factorator_inhumane_work_experiments_stopped:0 "Ngăn Chặn Thí Nghiệm Tàn Nhẫn"
 factorator_inhumane_work_experiments_stopped_desc:1 "Các công nhân công nghiệp hân hoan khi được cứu thoát khỏi những cuộc thử nghiệm không thương tiếc của §Y$NAME_xenophobe1$§!."

 # Aturion / xenophobe2
 paragon.40610.name:0 "Chương Trình Kiểm Soát Dân Số"
 paragon.40610.desc:1 "§Y[Root.GetName]§! đã vạch ra một kế hoạch tối ưu hóa dân số mà dù phải đánh đổi bằng một số quyền tự do cá nhân nhất định, sẽ giúp tăng sản lượng lên ít nhất 6,98%."
 paragon.40610.a:0 "Khởi động chương trình."
 paragon.40610.b:0 "Tốt hơn là không nên."
 aturion_population_reform:0 "Cải Cách Dân Số"
 aturion_population_reform_desc:1 "Vì lợi ích của toàn thể cộng đồng, người dân của chúng ta nên sẵn sàng cống hiến cả sinh mạng lẫn xương máu. So với điều đó, những thay đổi nhỏ này chỉ là một sự khoan hồng nhân từ."

 paragon.40620.name:0 "Chương Trình Cải Tạo Tội Phạm"
 paragon.40620.desc:1 "§Y[Root.GetName]§! đã phát triển một chương trình cải tạo phức tạp nhằm chuyển hóa những thành phần gây rối trong xã hội của chúng ta thành những công dân siêng năng. Đánh giá rủi ro ước tính rằng 17,3% số tội phạm sẽ không thể cải tạo được và nên được coi là 'tổn thất có thể chấp nhận được'."
 paragon.40620.a:0 "Khởi động chương trình."
 paragon.40620.b:0 "Chúng ta không thể giảm bớt mức độ rủi ro được sao?"
 aturion_forced_rehabilitation_programs:0 "Chương Trình Cưỡng Chế Cải Tạo"
 aturion_forced_rehabilitation_programs_desc:1 "Từ bỏ khuynh hướng phạm tội của một kẻ đòi hỏi nỗ lực, và thường cần một cú hích từ bên ngoài. Cú hích đó sẽ được cung cấp một cách thỏa đáng."
 aturion_criminal_reformation_programs:0 "Chương Trình Cải Tạo Tội Phạm"
 aturion_criminal_reformation_programs_desc:0 "Dựa vào giáo dục và cải thiện thay vì các biện pháp cưỡng chế phòng ngừa, các chương trình này mang lại hạnh phúc lớn hơn cho dân chúng."

 # Jynn / egalitarian1
 paragon.40710.name:0 "Người Học Việc Tài Năng"
 paragon.40710.desc:1 "§Y[Root.GetName]§!, sứ giả của Thần Bí Cân Bằng, đã nhận một người học việc. Chiến binh trẻ tuổi đầy triển vọng này mong muốn tuyên thệ trung thành với chúng ta."
 paragon.40710.a:0 "Họ luôn được hoan nghênh gia nhập cùng chúng ta."
 paragon.40710.a.custom_tooltip:0 "Chỉ huy tập sự của §Y$NAME_egalitarian1$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."
 paragon.40710.b:1 "Chúng ta cần sĩ quan, không cần tướng lĩnh."
 JYNN_APPRENTICE_DESC:0 "Được tôi luyện từ thuở nhỏ bởi chiến binh [event_target:renowned_egalitarian1.GetName] để ra tay cứu giúp những kẻ khốn cùng."
 jynn_recruited_army_officers:0 "Tuyển Mộ Sĩ Quan Lục Quân"
 jynn_recruited_army_officers_desc:1 "Những cấp dưới đáng tin cậy và trung thành là điều tối quan trọng đối với bất kỳ chỉ huy nào."

 paragon.40720.name:0 "Chi Viện Từ Thần Bí Cân Bằng"
 paragon.40720.desc:1 "§Y[Root.GetName]§! đã yêu cầu sự hỗ trợ từ giáo đoàn của [Root.GetHisHer], Thần Bí Cân Bằng, nhằm hỗ trợ đế chế chúng ta trong cuộc đấu tranh trường kỳ chống lại bạo quyền và những kẻ áp bức. Các tàu vận tải chở đầy hợp kim quý giá để tiếp tế cho chúng ta đã cập bến từ tổng hành dinh bí mật của họ."
 paragon.40720.a:0 "Điều này có thể sẽ rất hữu ích."

 # Zosira K'Tun / egalitarian2
 paragon.40810.name:0 "Khoa Học Là Phép Màu"
 paragon.40810.desc:1 "§Y[Root.GetName]§! cùng người bạn đồng hành robot Gorky của [Root.GetHisHer] đã dành phần lớn thời gian rảnh rỗi để tiến hành các thí nghiệm cá nhân. Một vài thí nghiệm trong số đó đã mang lại những kết quả thú vị, và [Root.GetHeShe] đã chia sẻ các phát hiện của [Root.GetHisHer] với các nhà khoa học của đế chế chúng ta."
 paragon.40810.a:1 "Tin tuyệt vời."

 paragon.40820.name:0 "Thú Cưng Ngoại Tộc Nhận Nuôi"
 paragon.40820.desc:1 "§Y[Root.GetName]§! đã nhận nuôi một sinh vật ngoại tộc để bầu bạn cùng trợ lý robot Gorky của [Root.GetHisHer]. Đó là một sinh vật thân mềm rực rỡ sắc màu, dù chưa có tri giác hoàn chỉnh nhưng lại bộc lộ trí thông minh đáng nể và biết phản hồi trước các hiệu lệnh huýt sáo. Việc gánh vác trách nhiệm chăm sóc sinh vật này dường như đã thay đổi tính cách của [Root.GetHisHer], khiến [Root.GetHimHer] trở nên có trách nhiệm và điềm đạm hơn nhiều."
 paragon.40820.a:0 "Nó có cắn không đấy?"

 # Xondar / materialist1
 paragon.40910.name:0 "[Root.GetName] 2.0"
 paragon.40910.desc:1 "§Y[Root.GetName]§! tuyên bố đã 'cải tiến' dạng hình thể xác của [Root.GetHisHer] theo nhiều cách. Không cần xin phép, [Root.GetHeShe] đã phát đi các thông điệp trên toàn hạm đội ca ngợi trạng thái hoàn mỹ của [Root.GetHisHer] và công bố một bản tuyên ngôn khẳng định rằng tương lai khả dĩ duy nhất cho một nền văn minh là thăng hoa tổng hợp: toàn bộ sự sống hữu cơ phải được thay thế bằng máy móc."
 paragon.40910.a:0 "[Root.GetHeSheCap] sẽ chỉ lối cho chúng ta."
 paragon.40910.b:0 "Thật ngông cuồng!"

 paragon.40920.name:0 "Hợp Kim Quý Giá"
 paragon.40920.desc:1 "§Y[Root.GetName]§! đã thu thập dữ liệu cảm biến từ mọi con tàu trong biên giới của chúng ta. Sử dụng các thuật toán tính toán độ biến dạng trọng lực, [Root.GetFirstName] đã phát hiện ra thứ gì đó ẩn giấu bên dưới bề mặt của một thiên thể trong không phận chúng ta. Nếu dữ liệu chính xác, khối đá cằn cỗi đó chứa đầy hợp kim quý hiếm. [Root.GetFirstName] xem đây là cơ hội để mở rộng và nâng cấp hạm đội, đồng thời đề xuất phái một tàu xây dựng đến để khai thác hợp kim."
 paragon.40920.a:0 "Một nguồn tài nguyên quý giá."
 XONDAR_VALUABLE_ALLOYS:0 "Hợp Kim Quý Giá"
 XONDAR_VALUABLE_ALLOYS_DESC:1 "Hợp kim quý giá đã được phát hiện bởi Đô đốc [event_target:renowned_materialist1.GetName]."
 paragon.40921.name:0 "Hợp Kim Khả Dụng"
 paragon.40921.desc:0 "Một kho hợp kim quý giá đã được phát hiện sau khi hoàn tất công tác khai thác. Các xưởng đóng tàu của chúng ta sẽ được hưởng lợi rất nhiều từ nguồn cung cấp vật liệu này."
 paragon.40921.a:0 "Tốt."

 # Borin / materialist2
 paragon.41010.name:0 "Tôi Được Sinh Ra Vào Năm..."
 paragon.41010.desc:1 "§Y[Root.GetName]§! đã dành nhiều tháng trong xưởng của [Root.GetHisHer] để giải mã dữ liệu lấy từ các tàn tích của một con tàu trinh sát cổ xưa. Bằng sự kiên trì phi thường, [Root.GetHeShe] đã ghép nối thành công lịch sử chế tạo của con tàu và áp dụng những cải tiến vào công nghệ đóng tàu của chúng ta."
 paragon.41010.a:0 "Quả thực là tri thức vô giá."

 paragon.41020.name:0 "Chào Đón $BORIN_ROBOT_COMPANION_NAME$"
 paragon.41020.desc:1 "§Y[Root.GetName]§! đã chế tạo một robot đồng hành mang tên $BORIN_ROBOT_COMPANION_NAME$. Robot này có khả năng tự học nâng cao và sở hữu một ma trận nhân cách. Nó đang hỗ trợ [Root.GetName] trong các công việc nghiên cứu và sửa chữa của [Root.GetHisHer]. Tuy nhiên, giống như người tạo ra nó, $BORIN_ROBOT_COMPANION_NAME$ rất hiếu kỳ và khao khát được rời khỏi tổ ấm để dấn thân vào những cuộc phiêu lưu của riêng mình. [Root.GetName] tự hỏi liệu $BORIN_ROBOT_COMPANION_NAME$ có thể đảm nhận một vai trò tự chủ trong xã hội của chúng ta hay không."
 paragon.41020.a:0 "Cô ấy có khiếu điều khiển chiến hạm, đúng chứ?"
 paragon.41020.a.custom_tooltip:0 "Đô đốc robot §Y$BORIN_ROBOT_COMPANION_NAME$§! gia nhập đế chế chúng ta với tư cách là một §HLãnh Đạo§!."
 paragon.41020.b:0 "Chúng ta có thể giao cho cô ấy công việc bàn giấy..."
 BORIN_ROBOT_COMPANION_NAME:0 "Beryllia"
 BORIN_ROBOT_COMPANION_DESC:0 "Một trợ lý AI, được chế tạo và huấn luyện bởi thợ phế liệu [event_target:renowned_materialist2.GetName]."
 borin_administrator_beryllia:0 "Quản Trị Viên $BORIN_ROBOT_COMPANION_NAME$"
 borin_administrator_beryllia_desc:1 "Robot đồng hành của thợ phế liệu §Y$NAME_materialist2$§!, $BORIN_ROBOT_COMPANION_NAME$, hỗ trợ giám sát các công việc hành chính với độ chính xác cơ học hoàn hảo."

 # Judge Uld Dagr / pacifist1
 paragon.41110.name:0 "Tội Phạm Bị Vạch Mặt"
 paragon.41110.desc:1 "§Y[Root.GetName]§! đã và đang điều tra một mạng lưới tội phạm âm thầm phát triển trong biên giới của chúng ta. [Root.GetHeSheCap] đã thu thập các chứng cứ liên kết nhiều trùm tội phạm và hải tặc với những chính khách và sĩ quan quân đội biến chất. [Root.GetName] đã triển khai các hệ thống mới để thúc đẩy nhanh chóng thủ tục tố tụng tư pháp trong những vụ án như thế này, với ý định tóm gọn mọi tên tội phạm trước khi chúng kịp trốn khỏi phạm vi quyền hạn của chúng ta."
 paragon.41110.a:1 "Điều này sẽ mang lại lợi ích cho tất cả chúng ta."
 judge_improved_crime_fighting_laws:0 "Tăng Cường Chống Tội Phạm"
 judge_improved_crime_fighting_laws_desc:0 "Một loạt các đạo luật mới nhằm trấn áp tội phạm quy mô lớn, được soạn thảo bởi vị Thẩm Phán đáng kính."

 paragon.41120.name:0 "Về Bản Chất Của Tội Ác"
 paragon.41120.desc:1 "§Y[Root.GetName]§! đã dành trọn cả cuộc đời của [Root.GetHisHer] để nghiên cứu bản chất của tội ác và động cơ của những kẻ phạm tội bạo lực. [Root.GetHeSheCap] đã tìm kiếm lời khuyên từ các chuyên gia, nghiên cứu văn hóa của các đế chế khác, cả hiện hữu lẫn đã diệt vong, và sử dụng các thuật toán tiên tiến để mường tượng một xã hội không tưởng trông sẽ như thế nào. Công trình cả đời của [Root.GetHisHerCap] đã kết tinh thành một bài luận xã hội học đồ sộ sẽ đóng vai trò như kim chỉ nam cho các thế hệ mai sau."
 paragon.41120.a:1 "Một lợi ích to lớn cho tất cả chúng ta."

 # Vas the Gilded / pacifist2
 paragon.41210.name:0 "Hòa Bình Và Thịnh Vượng"
 paragon.41210.desc:1 "§Y[Root.GetName]§! đã gầy dựng được danh tiếng vang dội nhờ việc tổ chức những bữa yến tiệc xa hoa. Các buổi tụ họp này nổi tiếng với những màn trình diễn ngoạn mục của các thành viên Tu Viện Sao Từ Alyssum, đồ ăn thức uống kỳ lạ, cũng như các cuộc thảo luận triết học và đạo đức. Tại đây, tình bạn được tạo dựng, các hợp đồng làm ăn được ký kết và những ân oán cũ được tha thứ. Năng lực của [Root.GetHisHerCap] trong việc gắn kết những cá nhân khác biệt đến thế đã đặt nền móng vững chắc cho sự thịnh vượng tương lai của chúng ta."
 paragon.41210.a:0 "Chúng ta mạnh mẽ hơn khi đồng lòng."
 vas_population_united:0 "Dân Chúng Đồng Lòng"
 vas_population_united_desc:1 "Nhờ vào sự mến mộ của dân chúng dành cho §Y$NAME_pacifist2$§!, người dân làm việc hăng say hơn và tinh thần xã hội đạt mức cao chưa từng có."

 paragon.41220.name:0 "Trong Giờ Khắc Nguy Khốn"
 paragon.41220.desc:1 "§Y[Root.GetName]§! là một nghệ sĩ thực thụ khi nói đến sự quyến rũ và thuyết phục. [Root.GetHeSheCap] đã vận dụng các mối liên hệ của [Root.GetHisHer] cùng tầm ảnh hưởng chính trị để thu thập thông tin sống còn từ khắp thiên hà. [Root.GetFirstName] đã lưu giữ toàn bộ tri thức của [Root.GetHisHer] bên trong một vật gia truyền: một tinh thể màu xanh lục nhạt mà [Root.GetHeShe] thỉnh thoảng đeo tại các bữa yến tiệc xa hoa của [Root.GetHisHer]. Khi được đưa lên một quang phổ ánh sáng cụ thể, các bí mật của nó được trình chiếu thành một vầng hào quang rực rỡ. Giờ đây, [Root.GetHeShe] tin rằng thời khắc đã tới để sử dụng tri thức này vì lợi ích của xã hội."
 paragon.41220.a:0 "Số của cải này sẽ được sử dụng vào việc có ích."

 # Kai-Sha / authoritarian1
 paragon.41310.name:0 "Dữ Liệu Tình Báo Thu Thập"
 paragon.41310.desc:1 "§Y[Root.GetName]§! đệ trình một cơ sở dữ liệu chứa thông tin nhạy cảm được thu thập qua nhiều năm từ mạng lưới liên lạc rộng lớn của [Root.GetHisHer]. Kho dữ liệu khổng lồ này bao gồm mọi thứ từ sơ đồ các cơ sở quân sự, nghiên cứu bí mật cho đến các trích lục từ việc dò quét tâm trí. Những gì được cung cấp rất có giá trị, nhưng việc sử dụng thông tin có thể làm leo thang các xung đột cả bên trong lẫn bên ngoài."
 paragon.41310.a:0 "Sử dụng dữ liệu."
 paragon.41310.a.custom_tooltip:0 "§Y25%§! cơ hội mối quan hệ của các đế chế khác đối với chúng ta bị suy giảm do hành vi do thám bị phát giác."
 paragon.41310.b:0 "Hủy bỏ dữ liệu."
 opinion_has_sensitive_information_about_us:0 "Nắm Giữ Thông Tin Nhạy Cảm Về Chúng Ta"

 paragon.41320.name:0 "Mở Rộng Mạng Lưới Liên Lạc"
 paragon.41320.desc:1 "§Y[Root.GetName]§! đã mở rộng mạng lưới liên lạc của [Root.GetHisHer] ra khắp thiên hà. Một số là những người cung cấp tin tự nguyện, trong khi số khác bị tống tiền hoặc tẩy não. Trong bất kỳ trường hợp nào, thông tin mà [Root.GetHeShe] thu thập được sẽ vô cùng có lợi."
 paragon.41320.a:0 "Tri thức là sức mạnh."
 paragon.41320.a.intel.custom_tooltip:0 "Tình báo về các Đế Chế Khác: §G+$@paragon_41320_a_intel_amt$§!"

 # Q'la-Minder / authoritarian2
 paragon.41410.name:0 "Cung Điện Phù Hoa"
 paragon.41410.desc:1 "§Y[Root.GetName]§!, viên quan chức xa hoa trác táng, đã xây dựng một cung điện lộng lẫy cho riêng [Root.GetHimselfHerself] trên [planet_governed.GetName]. Cung điện này vừa là biểu tượng cho quyền lực và sự giàu có của [Root.GetHisHer], vừa đại diện cho thói phù phiếm và bại hoại của [Root.GetHisHer]. Để kỷ niệm việc khánh thành, [Root.GetHeShe] sẽ tổ chức một bữa đại tiệc, nơi tất cả những nhân vật quan trọng đều được mời đến. Và trong một biểu hiện hào phóng hiếm hoi, [Root.GetHeShe] cũng đã chia sẻ một phần của cải của [Root.GetHisHer] cho người dân tộc hạt."
 paragon.41410.a:0 "Còn có thể trông đợi điều gì khác ở hắn chứ?"
 qla_minder_vanity_palace:0 "Cung Điện Phù Hoa"
 qla_minder_vanity_palace_desc:0 "Tòa công trình đồ sộ này vừa quái dị vừa xa hoa, là minh chứng rõ nét cho tính cách ngông cuồng và tham lam của kẻ xây nên nó."

 paragon.41420.name:0 "Kẻ Biển Thủ"
 paragon.41420.desc:1 "§Y[Root.GetName]§!, viên quan chức xa hoa trác táng, đã bị bắt quả tang đang tham ô. Việc này đã diễn ra trong một thời gian dài, và [Root.GetHeShe] đã cất giấu của cải của [Root.GetHisHer] không chỉ trong các tài khoản ngân hàng mà còn trong các kho ngầm dưới lòng đất và các trạm trung chuyển ngoài không gian sâu khắp thiên hà. Trước những cáo buộc, [Root.GetHeShe] đã gieo [Root.GetHimselfHerself] xuống sàn nhà, thề thốt rằng những món đồ này vốn dĩ được chuẩn bị làm quà dâng tặng cho đấng cai trị."
 paragon.41420.a:0 "Đúng là con sâu mọt!"

 # Ulastar / spiritualist1
 paragon.41510.name:0 "Lời Đại Tiên Tri"
 paragon.41510.desc:1 "Trong nhiều năm, Nhà Thần Bí §Y[Root.GetName]§! đã diễn giải các điềm báo hé lộ một vận mệnh vĩ đại. Giờ đây, [Root.GetSheHe] tuyên bố đã nhìn thấy viễn cảnh thiên hà quy về một mối dưới một lá cờ duy nhất - lá cờ của chính chúng ta. Thời khắc hoàng kim thực sự vẫn còn ở phía trước."
 paragon.41510.a:0 "Vinh quang vĩ đại đang chờ đón."
 ulastar_prophesied_greater_destiny:0 "Vận Mệnh Vĩ Đại Được Tiên Tri"
 ulastar_prophesied_greater_destiny_desc:0 "Những lời tuyên ngôn của §Y$NAME_spiritualist1$§! về vinh quang tương lai thôi thúc lòng nhiệt thành và ý chí quật cường của nhân dân."

 paragon.41520.name:0 "Hưởng Ứng Tiếng Gọi"
 paragon.41520.desc:1 "Suốt nhiều năm qua, §Y[Root.GetName]§! đã liên tục cất lời gọi vào cõi hư không thông qua những giấc mơ tâm linh đầy uy lực. Giờ đây, nhiều tàu dân sự chở theo thành viên của nhiều chủng tộc khác nhau đã xuất hiện trên quỹ đạo quanh [planet_governed.GetName]. Để đổi lấy cơ hội được sống cạnh nhà tiên tri của họ, họ sẵn lòng phụng sự chúng ta."
 paragon.41520.a:0 "Họ sẽ trở thành một phần trong đàn chiên của chúng ta."
 paragon.41520.a.custom_tooltip:0 "Bổ sung §Y300§! Dân số Tâm Linh, Thần Chấn vào [event_target:planet_governed.GetName]."
 paragon.41520.b:0 "Họ không được chào đón ở đây."

 # Nasuz Demetor / spiritualist2
 paragon.41610.name:0 "Cổ Vật Của Quá Khứ Xa Xưa"
 paragon.41610.desc:1 "Chuyên Viên Lưu Trữ §Y[Root.GetName]§! đã phát hiện ra một kho cổ vật cổ xưa. [Root.GetHeSheCap] đã xâu chuỗi thông tin về tung tích của chúng từ những huyền thoại xa xưa và nhật ký cảm biến trao đổi từ những tên cướp biển lang thang. Nguồn gốc của những đồ vật bí ẩn này vẫn chưa rõ ràng, nhưng bằng cách hấp thụ âm thanh tần số thấp, chúng thỉnh thoảng tạo ra những biến dạng thời gian nhẹ. Công nghệ này chắc chắn sẽ mang lại lợi ích."
 paragon.41610.a:0 "Quả thực là một phát hiện quý giá."

 paragon.41620.name:0 "Tiếng Vọng Trong Hư Không"
 paragon.41620.desc:1 "Chuyên Viên Lưu Trữ §Y[Root.GetName]§! đã chặn được một thông điệp kỳ lạ. Bị bóp méo bởi tạp âm tĩnh điện, thông điệp này đã vang vọng giữa các vì sao suốt hàng thiên niên kỷ. Nó chứa lời chào từ một nền văn minh ngoài hành tinh, cũng như vị trí chính xác của quê hương họ. Giống loài này đã tuyệt chủng từ rất lâu, nhưng vẫn có thể còn những tàn tích quan trọng cùng tri thức cổ xưa cần được khám phá trên hành tinh mẹ của họ."
 paragon.41620.a:0 "Ai biết được chúng ta có thể tìm thấy những kho báu gì chứ?"
 paragon.41620.a.custom_tooltip:0 "Một di chỉ khảo cổ mới được phát hiện trên §Y[event_target:nasuz_arcsite_planet.GetName]§!."

#Empire modifiers

 integrated_command:0 "Chỉ Huy Tích Hợp"
 integrated_command_desc:0 "Các quy trình chỉ huy tích hợp đã cho phép chúng ta đổi mới phương thức tác chiến của phi đội tiêm kích. Chúng ta cũng sẽ thoát khỏi những cuộc tranh cãi phiền toái của bộ chỉ huy hải quân."
 crisis_studied:0 "Thấu Triệt Khủng Hoảng Của Skrand"
 crisis_studied_desc:0 "Nhờ những hiểu biết sâu sắc của Skrand, chúng ta đã có thể vạch ra những phương thức hiệu quả để tiến hành cuộc chiến chống lại Nguy Cơ Diệt Vong."
 crisis_studied_damage_desc:0 "Sát thương lên các phe Phái Khủng Hoảng Cuối Game: §G+20%§!"
 talon_armor:0 "Phân Tầng Giáp Trụ"
 talon_armor_desc:1 "Việc nghiên cứu lớp vỏ bọc của Talon đã mang lại cho chúng ta những hiểu biết sâu sắc về tối ưu hóa thân tàu. Điều này cho phép chúng ta tăng cường lớp giáp của tàu mà không làm tăng thêm trọng lượng."
 talon_hull:0 "Gia Cố Thân Tàu"
 talon_hull_desc:0 "Bằng cách nghiên cứu thân tàu Talon, chúng ta đã nâng cao hiểu biết về cấu trúc khung tàu, những quy trình có thể nhanh chóng áp dụng để củng cố ngoại thất tàu của chúng ta."
 skrand_story:0 "Gắn Kết Trong Lịch Sử"
 skrand_story_desc:0 "Cảm động trước lời kể của Skrand, nhân dân chúng ta xem ông như một chuẩn mực của phẩm hạnh quân sự và là lời nhắc nhở sống còn về tầm quan trọng của sự cảnh giác."

#Gateway Admiral

 paragon.3000.desc:0 "Chúng ta đã khôi phục thành công năng lượng cho Cổng Không Gian cổ đại trong hệ sao [gateway_system.GetName]! Bất chấp niên đại xa xưa, thiết bị đã tạo thành một ống dẫn á không gian ổn định có thể hoàn toàn di chuyển qua lại được.\n\nChúng ta cũng đang phát hiện những chỉ số năng lượng bất thường, tương tự như các chỉ số xuất hiện khi ra vào một cánh cổng, nhưng không hề có bất kỳ dấu hiệu nào của một con tàu đang quá cảnh."
 paragon.3000.a:0 "Giám sát tình hình."

 paragon.3001.name:0 "Xuất Hiện"
 paragon.3001.desc:0 "Một con tàu khổng lồ đồ sộ vừa nhô ra khỏi cánh cổng, quy mô tuyệt đối của nó không giống bất cứ thứ gì chúng ta từng thấy trước đây. Các lực lượng quân sự đã được đặt trong tình trạng báo động cao độ.\n\nCon tàu vô danh không hồi đáp các cuộc gọi của chúng ta, nhưng xét tới việc nó dường như bị vô hiệu hóa hoàn toàn, chúng ta tạm thời sẽ không tấn công nó. Việc điều tra và nỗ lực mở kênh liên lạc vẫn đang được tiếp tục."
 paragon.3001.a:0 "Nó thật khổng lồ!"
 paragon.3001.b:1 "Tiến hành các quy trình quét cảm biến."

 paragon.3002.name:0 "Sự Thấu Triệt"
 paragon.3002.desc:1 "Cuộc điều tra về con tàu khổng lồ chưa mang lại nhiều câu trả lời. Tuy nhiên, chúng ta đã giải mã được một số dữ liệu nhận được khi cánh cổng mở ra lần đầu. Có vẻ như con tàu đã bị kẹt bên trong cánh cổng suốt một khoảng thời gian không xác định (và có thể dài đến khó tin).\n\nĐể tìm hiểu thêm, chúng ta cần phải đổ bộ lên tàu. Vì đây là một tàu chiến quân sự, việc điều động một đơn vị tác chiến đặc biệt là phương án tối ưu."
 paragon.3002.a:0 "Chuẩn bị tàu vận tải quân đổ bộ."
 PARAGON_GATEWAY_DUDE_PROJECT:0 "Chiến Dịch Đổ Bộ Lên Tàu"
 PARAGON_GATEWAY_DUDE_PROJECT_DESC:1 "Chúng ta phải đổ bộ lên con tàu ngoài hành tinh. Các chỉ số năng lượng mờ nhạt có thể cho thấy một hệ thống duy sinh vẫn đang hoạt động. Có khả năng ai đó, hoặc thứ gì đó, vẫn đang ẩn nấp trên tàu. Binh lính của chúng ta rất nóng lòng tìm ra chân tướng."

 paragon.3003.name:1 "Lời Chào Đón Căng Thẳng"
 paragon.3003.desc:1 "Ngay sau khi đổ bộ lên tàu, chúng ta đã chạm trán với một nhóm người ngoài hành tinh mặc quân phục. Giật mình trước sự xuất hiện bất ngờ của chúng ta, nhiều kẻ đã vội vàng rút vũ khí. Rất may, một cuộc đọ súng đã được ngăn chặn kịp thời.\n\nKêu gọi sự bình tĩnh, vị chỉ huy ngoại tộc giải thích rằng con tàu đang rất cần được sửa chữa khẩn cấp. Một khi tất cả các hệ thống hoạt động trở lại, ông sẽ giải thích tình hình."
 paragon.3003.desc_gestalt:0 "Bên trong con tàu, chúng ta đã phát hiện một nhóm sinh vật ngoài hành tinh mặc quân phục. Đơn vị đổ bộ của chúng ta tiến hành bắt giữ họ, nhưng vị chỉ huy ngoại tộc đã kêu gọi ngừng bắn, đề nghị giải thích sự hiện diện của họ một khi con tàu được phục hồi đầy đủ chức năng."
 paragon.3003.a:1 "Giúp vị chỉ huy này sửa chữa con tàu của ông."
 paragon.3003.b:1 "Phớt lờ ông ta. Tịch thu con tàu ngay lập tức."
 PARAGON_GATEWAY_DUDE_REPAIR_PROJECT:1 "Sửa Chữa Tàu Ngoài Hành Tinh"
 PARAGON_GATEWAY_DUDE_REPAIR_PROJECT_DESC:2 "Con tàu ngoài hành tinh đòi hỏi công tác bảo trì trên diện rộng. Chúng ta phải điều động một tàu khoa học tới để hỗ trợ vị chỉ huy và thủy thủ đoàn của ông."

 paragon.3004.name:0 "Vị Đô Đốc Bị Lãng Quên"
 paragon.3004.intro: "Đội ngũ kỹ thuật của chúng ta đã hỗ trợ đắc lực cho vị chỉ huy ngoại tộc. Sau khi các hệ thống chính đã hoạt động trở lại, chúng ta đã có thể tìm hiểu thêm về con tàu này.\n\nCon tàu tên là Talon, do Đô đốc Skrand Sharpbeak chỉ huy. Nhiều thế kỷ trước, ông cùng thủy thủ đoàn đã tiến vào một Cổng Không Gian đang gặp trục trặc để thoát khỏi một kẻ thù áp đảo."
 paragon.3004.a.desc: "$paragon.3004.intro$\n\nNhờ vào các cuộc khai quật của chúng ta trên quê hương Skravird của ông, chúng ta đã có thể kể cho ông nghe về số phận của đồng bào ông sau khi ông biến mất."
 paragon.3004.b.desc: "$paragon.3004.intro$\n\nHọ không còn quê hương để trở về; toàn bộ nền văn minh của họ đã sụp đổ và biến mất từ nhiều kỷ nguyên trước."
 paragon.3004.a:0 "Một số phận thật đau buồn."

 paragon.3005.name:0 "Skrand Sharpbeak"
 paragon.3005.desc:1 "§HĐô đốc Skrand Sharpbeak của Đệ Nhất Móng Vuốt gửi lời chào đến chúng ta trên màn hình liên lạc. Bộ lông vũ của ông xơ xác, và giọng nói khàn đặc vì tuổi tác và sự mệt mỏi.§!\n\nTôi nợ các ngài mạng sống của tôi và của thủy thủ đoàn. Đồng bào của tôi đã không còn nữa, và thế giới mà tôi từng biết đã biến thành tro bụi. Nhưng tôi vẫn là một người lính. Nếu các ngài chấp nhận, con tàu của tôi và thanh kiếm của tôi sẽ thuộc về các ngài."
 paragon.3005.a:0 "Chúng tôi xin cảm ơn. Nhưng chúng tôi đã có những chỉ huy xứng đáng của riêng mình."
 paragon.3005.a.response:0 "§HSkrand chớp mắt và ho khan.§!\n\nKhông nghi ngờ gì nữa. Nhưng hãy nhớ rằng: kinh nghiệm của một ngàn trận chiến không phải là thứ dễ dàng tìm thấy giữa các vì sao."
 paragon.3005.b:1 "Điều gì ngăn cản chúng ta đơn giản là tự mình chiếm lấy con tàu?"
 paragon.3005.b.response:1 "§HSharpbeak lùi lại, mỏ của ông phát ra một tràng tiếng lách cách đe dọa.§!\n\nCác ngài có thể thử. Nhưng Đệ Nhất Móng Vuốt sẽ tự hủy trước khi rơi vào tay những kẻ không có danh dự."
 paragon.3005.c:1 "Chiêu Mộ Lãnh Đạo"
 paragon.3005.c_custom_tooltip:0 "§LRất tốt. Chúng tôi chấp nhận lời thề của ông. Hãy phụng sự với danh dự, hỡi Đô đốc.§!\n$SEPARATOR$\n"
 paragon.3005.c.response:0 "§HSharpbeak xòe rộng bộ lông vũ của mình.§!\n\nTôi sẽ làm như vậy. Danh dự của Skravird sẽ sống mãi qua những chiến công của chúng ta."
 paragon.3005.d_custom_tooltip:0 "§LLời nói chỉ là sáo rỗng. Vĩnh biệt, Đô đốc.§!"
 paragon.3005.d:1 "Khước từ"
 paragon.3005.d.response:0 "§HÁnh mắt của Sharpbeak sắc như dao cạo.§!\n\nĐược thôi. Vậy thì chúng tôi sẽ tự mở ra con đường của riêng mình giữa hư không."
 NAME_LastTalon:0 "Móng Vuốt Cuối Cùng"

 paragon.3006.name:0 "Thắng Lợi!" #good xenophobe outcome
 paragon.3006.desc:1 "Quân đội của chúng ta đã dễ dàng áp đảo thủy thủ đoàn của con tàu. Chúng ta đã giành được quyền kiểm soát toàn diện con tàu chiến khổng lồ này."
 paragon.3006.a:0 "Chúng ta sẽ giải mã các bí mật của nó."
 paragon.3007.name:0 "Thảm Sát!" #bad xenophobe outcome
 paragon.3007.desc:1 "Quân đội của chúng ta trên con tàu ngoài hành tinh đã bị tiêu diệt hoàn toàn! Những sinh vật lạ mặt đã kháng cự với sự hung bạo không thể tin nổi."
 paragon.3007.a:0 "Điều một hạm đội tới!"

 paragon.3902.name:0 "Con Tàu Đồ Sộ"
 paragon.3902.desc:0 "Trong quá trình khảo sát tiêu chuẩn, chúng ta đã tìm thấy một con tàu đồ sộ trôi dạt vô định. Nó dường như đã bất động trong nhiều thế kỷ."
 paragon.3902.a:0 "Cố gắng tìm hiểu thêm."

 first_claw:0 "Móng Vuốt"
 first_claw_plural:0 "Móng Vuốt"
 NAME_Skrand_Sharpbeak:0 "Skrand Sharpbeak"
 NAME_WingsOfGlory:0 "Chuyến Bay Cuối Cùng"
 NAME_FirstTalon:0 "Đệ Nhất Móng Vuốt"
 NAME_FirstClaw:0 "Móng Vuốt"
 NAME_Unknown2:0 "Chưa Rõ"
 talon_power:0 "Nâng Cấp Móng Vuốt"
 tech_strike_craft_skrand:0 "Phi Cơ Hạm Tải Skravird"
 tech_strike_craft_skrand_desc:0 "Học hỏi từ chuyên môn thiết kế của Skrand và đồng bào ông, những phi cơ hạm tải vượt trội này có khả năng tác chiến bền bỉ thông qua các chiến thuật cơ động thích ứng linh hoạt."
 STRIKE_CRAFT_SKRAND:0 "$tech_strike_craft_skrand$"
 STRIKE_CRAFT_SKRAND_DESC:0 "$tech_strike_craft_skrand_desc$"

 paragon.3010.name:0 "Bệnh Hoại Lông"
 paragon.3010.desc:1 "Sự hoảng loạn bao trùm thủy thủ đoàn Đệ Nhất Móng Vuốt khi một căn bệnh lạ bắt đầu lây lan nhanh chóng trong hàng ngũ của họ. Các triệu chứng ban đầu bao gồm sốt cao và rụng lông dữ dội."
 paragon.3010.a:0 "Nỗ lực tìm kiếm phương thuốc chữa trị!"
 paragon.3011.name:0 "Cái Chết Của Một Anh Hùng"
 paragon.3011.desc:0 "Bất chấp mọi nỗ lực cứu chữa của chúng ta, Skrand đã không qua khỏi trước căn bệnh Hoại Lông quái ác. Người anh hùng cổ đại đã trút hơi thở cuối cùng trong sự tiếc thương vô hạn của toàn đế chế."
 paragon.3012.name:0 "Dịch Bệnh Lây Lan"
 paragon.3012.desc:0 "Mặc dù chúng ta đã nỗ lực hết sức để cách ly Đệ Nhất Móng Vuốt, căn bệnh Hoại Lông vẫn tìm được đường lây lan sang các trạm nghiên cứu và tàu thuyền lân cận."
 paragon.3013.name:0 "Những Triệu Chứng Mới"
 paragon.3013.desc:0 "Những triệu chứng chưa từng thấy trước đây của dịch bệnh Hoại Lông bắt đầu xuất hiện, gây ra những biến chứng thần kinh nghiêm trọng cho người bệnh."
 paragon.3014.name:0 "Tình Trạng Trầm Trọng Hơn"
 paragon.3014.desc:0 "Những trường hợp tử vong đầu tiên vì dịch bệnh Hoại Lông đã được ghi nhận. Thời gian không còn nhiều để cứu vãn Skrand và thủy thủ đoàn của ông."
 paragon.3015.name:0 "Đã Tìm Ra Thuốc Chữa!"
 paragon.3015.desc:0 "Sau nhiều tháng nghiên cứu không ngừng nghỉ, chúng ta đã phát chế thành công loại vắc-xin kháng lại bệnh Hoại Lông. Skrand và các thủy thủ đoàn đã được chữa khỏi hoàn toàn!"

 paragon.3020.name:0 "Bày Tỏ Lòng Biết Ơn"
 paragon.3020.desc:0 "Nhân viên của chúng ta đã làm việc chăm chỉ để xây dựng mối quan hệ tốt đẹp với thủy thủ đoàn ngoại tộc. Để đáp lại ân tình đó, Skrand đã trao tặng chúng ta một phần công nghệ vũ khí độc quyền của ông."
 paragon.3020.a:0 "Chúng ta rất biết ơn vì món quà này."
 paragon.3021.name:0 "Nghiên Cứu Tàu Ngoài Hành Tinh"
 paragon.3021.desc:0 "Nhiều tháng nghiên cứu, phân loại và thử nghiệm trên con tàu ngoại tộc đã mang lại những đột phá lớn cho công nghệ quân sự của chúng ta."
 paragon.3021.a:0 "Chúng ta có thể áp dụng những điều này."

 paragon.3030.c:0 "Bắt họ phải tự tìm ra tiếng nói chung."
 paragon.3031.name:0 "Cơ Cấu Tích Hợp"
 paragon.3031.desc:1 "Các sĩ quan và chỉ huy của chúng ta đang phối hợp chặt chẽ với Skrand, nhưng họ không phải lúc nào cũng tìm được tiếng nói chung với ông. Cấu trúc chỉ huy quen thuộc của hai bên có sự khác biệt, gây ra những căng thẳng không đáng có. Điều này thúc đẩy nhu cầu cấp thiết về một khóa huấn luyện quân sự chung.\n\nCông việc huấn luyện có thể tạm thời hạn chế khả năng chỉ huy hạm đội của chúng ta, nhưng nếu không chuẩn bị chu đáo cho binh lính thì hậu quả có thể rất nghiêm trọng."
 paragon.3031.a:0 "Chuẩn bị một chương trình huấn luyện chỉ huy hải quân."
 paragon.3031.b:0 "Những cuộc diễn tập chiến tranh như vậy là vô bổ."
 paragon.3032.name:0 "Huấn Luyện Hoàn Tất"
 paragon.3032.desc:0 "Với những tiến bộ vượt bậc của cả hai phía, chúng ta đánh giá chương trình huấn luyện phối hợp là một thành công rực rỡ. Chúng ta đã học hỏi được rất nhiều từ Skrand về chiến thuật cận chiến không gian, đồng thời giúp ông và các sĩ quan bắt kịp các thông lệ hậu cần hiện đại của chúng ta. Tinh thần lạc quan và tình đồng chí mới đã bén rễ vững chắc."
 paragon.3033.name:0 "Hiểu Biết Quân Sự"
 paragon.3033.desc:0 "Vấn đề cốt lõi nằm ở sự khác biệt trong cách chúng ta áp dụng chiến thuật phi cơ chiến đấu. Skrand triển khai nhiều phi đội tiêm kích lớn nhằm bẻ gãy chuỗi chỉ huy của kẻ thù. Họ tác chiến thống nhất theo các mục tiêu rõ ràng từ tàu mẹ.\n\nCách tiếp cận của chúng ta linh hoạt hơn với các vai trò được phân định dựa trên nhận thức tình huống và việc sử dụng các đòn đánh rủi ro cao, lợi nhuận lớn, nhưng chúng ta thiếu đi sự gắn kết chặt chẽ như ở Skrand và các sĩ quan của ông. Hiện tại, chúng ta vẫn đang nỗ lực tìm kiếm tiếng nói chung để cùng xây dựng."
 paragon.3034.name:0 "Chiến Thuật Bị Lãng Quên"
 paragon.3034.desc:0 "Các trận chiến mô phỏng đã chỉ ra rằng chiến thuật tập trung hỏa lực của Skrand rất hiệu quả trong giai đoạn đầu, nhưng nhanh chóng bị khắc chế bởi các chiến lược phản công. Dù vậy, kết quả vẫn vượt trội hơn hẳn so với những gì chúng ta tự mình mong đợi.\n\nViệc áp dụng song song các phần của cả hai chiến thuật đã dẫn đến sự hỗn loạn. May mắn thay, từ những thất bại đó đã nảy sinh những ý tưởng đầy hứa hẹn giúp giải quyết tận gốc vấn đề."
 paragon.admiral_fight.name:0 "Vấn Đề Về Quyền Chỉ Huy"
 paragon.admiral_fight.desc:1 "Rõ ràng là Skrand đã xảy ra ẩu đả thể xác với [leader_to_fire_skrand.GetName], một trong những chỉ huy của chính chúng ta. Vấn đề bắt nguồn từ lòng tự tôn danh dự cá nhân sâu sắc của Đô đốc. Tóm lại, Skrand cảm thấy bị xúc phạm, và tuyên bố sẽ rời khỏi hàng ngũ của chúng ta ngay lập tức trừ khi chúng ta cách chức [leader_to_fire_skrand.GetName]."
 paragon.admiral_fight.a:0 "Đứng về phía Skrand."
 paragon.admiral_fight.b:0 "Đứng về phía [leader_to_fire_skrand.GetName]."
 paragon.admiral_fight.c:0 "Có lẽ có một giải pháp thỏa hiệp..."
 paragon.admiral_fight.a.tt:0 "§LChúng ta có thể đối mặt với sự phản ứng dữ dội hơn nếu dàn xếp theo ý Skrand trong vấn đề này.§!"
 paragon.3036.name:0 "Bộ Chỉ Huy Tan Tác"
 paragon.3036.a.tt:1 "§LThực hiện hành động này sẽ loại bỏ tất cả những kẻ bất đồng chính kiến khỏi bộ chỉ huy hải quân.§!"

 paragon.3040.name:0 "Nâng Cấp Tiềm Năng"
 paragon.3040.desc:0 "Công trình nghiên cứu chung của chúng ta trên Móng Vuốt Cuối Cùng đã mang lại những hiểu biết độc nhất vô nhị về cơ chế vận hành bên trong của con quái thú bọc thép này. Chúng tôi tin rằng đội ngũ kỹ thuật của chúng ta, phối hợp cùng những người trên tàu Talon, có cơ hội cải thiện hơn nữa các lớp vỏ ngoài của con tàu, giúp nó chống chịu tốt hơn trước các đòn tấn công và nguy cơ thủng thân tàu.\n\nChúng ta đã nhận được sự chấp thuận từ Skrand, nhưng dự án sẽ đòi hỏi thêm kinh phí."
 paragon.3040.a:0 "Tiếp tục tiến hành các nâng cấp."
 paragon.3040.b:0 "Chúng ta không có đủ tài nguyên cho việc này."
 paragon.3041.name:0 "Talon 2.0"
 paragon.3041.desc:0 "Mặc dù chúng ta không đạt được toàn bộ kết quả như mong đợi, nhưng chúng ta đã nâng cấp thành công hệ thống giáp của Talon. Các kỹ sư của chúng ta cũng đã tìm thấy những hiểu biết giá trị có thể áp dụng để cải tiến các chiến hạm của chính chúng ta."
 paragon.3042.name:0 "Tiến Độ Chậm Chạp"
 paragon.3042.desc:0 "Chúng ta đã thực hiện nhiều nỗ lực khác nhau nhằm tăng cường độ bền cấu trúc của Talon mà không làm ảnh hưởng đến tốc độ hay khả năng cơ động, nhưng tiến độ diễn ra rất chậm chạp. Sự hỗ trợ từ các kỹ sư của Skrand là một sự trợ giúp đắc lực cho chúng ta, nhưng họ ngần ngại triển khai các ý tưởng của chúng ta nếu thiếu sự giám sát chặt chẽ. Dù vậy, công việc vẫn đang tiếp tục tiến triển."
 paragon.3043.name:0 "Vật Liệu Bất Tương Thích"
 paragon.3043.desc:0 "Một số vật liệu của Talon khác biệt so với các vật liệu tương đương của chúng ta. Hợp kim của nó kém đàn hồi hơn nhiều, khiến thân tàu bị nứt vỡ bất ngờ trong quá trình lắp đặt thêm các tấm giáp phụ. Các kỹ sư của con tàu đã đúng khi giám sát công việc của chúng ta, và chúng ta thật may mắn khi họ có mặt gần đó.\n\nChúng ta đã phải sử dụng một phần vật liệu vốn dành cho việc cải tiến để sửa chữa con tàu, điều này đã làm trì hoãn toàn bộ chiến dịch."
 paragon.3043.a:0 "Cấp thêm ngân sách."
 paragon.3043.b:0 "Thật vô ích, hãy hủy bỏ dự án."

 paragon.3050.name:0 "Chuyến Bay Cuối Cùng"
 paragon.3050.desc:0 "§HMàn hình chập chờn khi boong chỉ huy của Skrand hiện lên. Lông vũ của vị đô đốc xù lên, đôi mắt sắc lạnh tóe lửa.§!\n\nLũ... ngoại nhân này! Chúng đến đây chỉ để giết chóc, để hủy diệt!\n\n§HGõ mỏ dữ dội, ông tiếp tục.§!\n\nTôi yêu cầu-- Không, tôi RA LỆNH rằng chúng ta phải tuyên chiến! Chúng ta không thể để chúng hủy diệt mọi thứ, không thể lặp lại một lần nữa! Tôi... Cùng nhau, tôi tin rằng chúng ta có thể ngăn chặn thảm kịch từng giáng xuống đồng bào tôi tái diễn. Tôi sẵn sàng truyền dạy cho các ngài tất cả những gì chúng tôi biết."
 paragon.3050.a:1 "Ông đã từng chạm trán mối đe dọa này trước đây chưa?"
 paragon.3050.a.response:1 "Chưa, không hẳn là chúng. Nhưng tôi đã từng chứng kiến cảnh tượng này diễn ra trước đây... Quá đỗi quen thuộc. Những kẻ hủy diệt xuất hiện từ hư không, không màng đàm phán, chỉ gieo rắc sự diệt vong. Chúng ta không được phép lặp lại sai lầm của quá khứ."
 paragon.3050.b:1 "Ông có thể chia sẻ thông tin gì?"
 paragon.3050.b.response:1 "Chúng tôi gọi kẻ thù của mình là Hiểm Họa. Chúng không bao giờ hồi đáp tín hiệu, không bao giờ bắt tù binh. Chúng chỉ hủy diệt từng thế giới một. Tôi có dữ liệu tác chiến và mô hình chuyển động của chúng được lưu trữ trong máy tính của Talon. Nó có thể giúp các hạm đội của các ngài nhắm trúng các điểm yếu cốt tử của chúng."
 paragon.3050.c:0 "Hãy bắt tay vào việc thôi."
 paragon.3050.c.response:0 "Thời gian là sinh mệnh. Chúng ta phải đẩy nhanh tiến độ trước khi quá muộn."
 paragon.3050.d:0 "Chúng ta không thể tiêu tốn tài nguyên cho việc này."
 paragon.3050.d.response:1 "§HSkrand hét lên,§!\n\nCÁI GÌ?! Không... Các ngài đang phạm phải sai lầm chết người! Các ngài không hiểu những gì sắp ập đến đâu!"
 paragon.3051.name:0 "Phân Tích Khủng Hoảng"
 paragon.3051.desc:0 "Nhờ vào chuyên môn của Skrand trong chiến tranh chống lại những kẻ hủy diệt cổ đại, chúng ta đã phát triển các học thuyết quân sự và hệ thống ngắm bắn mới chuyên biệt để khắc chế mối đe dọa hiện tại."
 paragon.3052.name:0 "Chiến Tranh Khủng Hoảng"
 paragon.3052.desc:0 "Các ngân hàng dữ liệu mà chúng ta truy cập đã cung cấp cho chúng ta một số thông tin chi tiết có giá trị về chiến thuật của kẻ thù. Điều này sẽ nâng cao đáng kể cơ hội sống sót của các chiến hạm của chúng ta."
 paragon.3053.name:0 "Quy Luật Tác Chiến Khủng Hoảng"
 paragon.3053.desc:1 "Đối chiếu dữ liệu của chính chúng ta với dữ liệu của Skrand, chúng ta đã nhận diện được các quy luật hành vi lặp đi lặp lại trong đội hình tác chiến của đối phương, cho phép chúng ta đoán trước các đòn tấn công của chúng."

 paragon.3060.name:0 "Nghiên Cứu Talon"
 paragon.3060.desc:0 "Một nhóm kỹ sư từ tàu Talon đã đệ trình đề xuất nghiên cứu sâu hơn về hệ thống động cơ phản vật chất độc đáo của con tàu. Họ cần thêm tài nguyên từ chúng ta để tiến hành thử nghiệm."
 paragon.3060.a:0 "Chúng ta sẽ hỗ trợ."
 paragon.3060.b:0 "Chúng ta không thể phân bổ tài nguyên."
 paragon.3061.name:0 "Kỹ Thuật Bị Lãng Quên"
 paragon.3061.desc:1 "Với sự giúp đỡ của chúng ta, các kỹ sư của Talon đã tái tạo thành công một số kỹ thuật luyện kim cổ xưa, cho phép gia tăng hiệu suất lò phản ứng trên toàn bộ các hạm đội của chúng ta."

 paragon.3071.name:0 "Talon Lại Cất Cánh!"
 paragon.3071.desc:0 "Dưới sự hỗ trợ và giám sát chặt chẽ của các kỹ sư Talon, việc phục hồi con tàu đã hoàn tất mỹ mãn. Soái hạm huyền thoại một lần nữa gầm vang giữa các vì sao."
 paragon.3072.name:0 "Thu Hồi Móng Vuốt Thất Lạc"
 paragon.3072.desc:1 "Nhờ vào các hệ thống an toàn bổ sung và quy trình khẩn cấp, xác tàu Talon đã được trục vớt sau trận chiến khốc liệt. Chúng ta có thể sửa chữa nó hoặc tháo dỡ để lấy hợp kim quý."
 paragon.3072.a:0 "Sửa chữa Talon."
 paragon.3072.b:0 "Tháo dỡ nó, chúng ta cần hợp kim."

 paragon.3080.name:0 "Hy Vọng Mới"
 paragon.3080.desc:0 "Những phát triển gần đây trong kỹ thuật di truyền có thể cho phép chúng ta giải mã bộ gen của Skrand và nhân bản giống loài của ông, cứu vãn dân tộc Talon khỏi bờ vực tuyệt chủng hoàn toàn."
 paragon.3080.a:0 "Skrand đã phụng sự chúng ta rất tốt. Ông xứng đáng nhận được điều này."
 paragon.3080.b:0 "Chúng ta không có thời gian cho việc này."
 paragon.3081.name:0 "Hậu Duệ Của Skrand"
 paragon.3081.desc:0 "Những nỗ lực nhân bản DNA của Skrand của chúng ta đã thành công mỹ mãn. Một thế hệ người Talon mới đã ra đời khỏe mạnh và sẵn sàng hòa nhập vào đế chế."
 paragon.3081.tt:0 "§LNgười Talon sẽ xuất hiện trên hành tinh mẹ của chúng ta.§!"
 paragon.3082.name:0 "Những Mối Quan Ngại"
 paragon.3082.desc:0 "DNA dạng chim của Skrand cứng nhắc hơn nhiều so với dự kiến, dẫn đến một số biến dị di truyền ngoài ý muốn ở các bản sao. Tuy nhiên, các nhà khoa học tin rằng họ có thể khắc phục được."
 paragon.3083.name:0 "Không Còn Như Trước"
 paragon.3083.desc:0 "§HQuân phục của Skrand chỉnh tề hoàn hảo, lông vũ được chải chuốt gọn gàng. Nhưng trong đôi mắt ông lại chất chứa một nỗi buồn sâu thẳm.§!\n\nChúng... chúng không phải là đồng bào của tôi. Chúng mang hình hài của chúng tôi, nhưng ký ức, tâm hồn và văn hóa của Skravird đã vĩnh viễn mất đi cùng những người nằm xuống."
 paragon.3083.a:0 "Chúng tôi rất tiếc khi nghe điều đó."
 paragon.3083.a.response:1 "Đừng bận lòng. Những bản sao này sẽ mở ra cho chúng ta một tương lai mới. Một ngày nào đó, chúng sẽ tự tạo dựng nên di sản của chính mình giữa các vì sao."
 NAME_Skrand_Species:0 "Talon"
 NAME_Skrand_Species_P:0 "Người Talon"
 NAME_Skrand_Planet: "Skravird"

 paragon.3090.name:0 "Nghiên Cứu Lịch Sử"
 paragon.3090.desc:1 "Chúng ta đã nhận được yêu cầu từ một số thành viên trong viện hàn lâm nhằm tiến hành nghiên cứu sâu rộng về lịch sử của Skrand và giống loài đã mất của ông."
 paragon.3090.a:0 "Hãy mở các kho lưu trữ!"
 paragon.3090.b:0 "Chúng ta sẽ bỏ qua."
 paragon.3091.name:0 "Cuộc Di Cư"
 paragon.3091.desc:0 "Chúng ta đã có bản báo cáo đầu tiên về lịch sử của Skrand và đồng bào ông. Nhiều thiên niên kỷ trước, khi thế giới mẹ Skravird cạn kiệt tài nguyên, các phi đội Talon đã thực hiện cuộc đại di cư xuyên qua các cánh cổng không gian để tìm kiếm vùng đất hứa."
 paragon.3092.name:0 "Chiếc Tổ Vỡ Nát"
 paragon.3092.desc:0 "Tiếp theo là một báo cáo khác về lịch sử của Skrand. Báo cáo ghi lại thời kỳ đen tối khi nền văn minh Talon bị tấn công bởi một thế lực tàn bạo bí ẩn, phá hủy các thuộc địa thịnh vượng của họ từng cái một."
 paragon.3093.name:0 "Đệ Nhất Móng Vuốt"
 paragon.3093.desc:0 "Chúng ta đã nhận được một báo cáo khác về lịch sử của Skrand. Báo cáo mô tả chi tiết quá trình đóng mới Đệ Nhất Móng Vuốt - đỉnh cao công nghệ quân sự của người Talon, được chế tạo như tuyến phòng thủ cuối cùng để bảo vệ nòi giống."
 paragon.3094.name:0 "Chuyến Bay Cuối Cùng"
 paragon.3094.desc:0 "Bản báo cáo cuối cùng về lịch sử của Skrand khép lại thiên anh hùng ca bi tráng. Khi phòng tuyến cuối cùng sụp đổ, Skrand đã chỉ huy Đệ Nhất Móng Vuốt lao vào cánh Cổng Không Gian đang quá tải để dụ kẻ thù đi, hy sinh thân mình để cứu vãn những hy vọng mong manh."
 paragon_is_not_keides:1 "§RĐịa điểm này phải do đích thân §YKeides§! khai quật.§!"

#Paragon Situations

 paragon.situations.tt:0 "§LDự án này có thể tốn kém, và chúng ta sẽ không thể hủy bỏ một khi đã bắt đầu.§!"
 situation_paragon_skrand_monthly_change_tooltip:0 "Tiến độ phụ thuộc vào phương thức tiếp cận dự án của chúng ta."

 situation_paragon_skrand_sickness:0 "Diễn Tiến Bệnh Tật"
 situation_paragon_skrand_sickness_type:0 "Bệnh Tật"
 situation_paragon_skrand_sickness_desc:0 "Căn bệnh độc hại mang tên Hoại Lông đã lây nhiễm cho phần lớn thủy thủ đoàn của Skrand. Các dự báo của chúng ta chỉ ra một kết cục u ám. Hiện tại, chúng ta chỉ có thể hạn chế sự lây lan của bệnh bằng cách chăm sóc thích hợp và xử lý các triệu chứng."
 situation_paragon_skrand_sickness_standard:0 "Chăm Sóc Tiêu Chuẩn"
 approach_situation_paragon_skrand_sickness_standard_tt:0 "Chúng ta sẽ tuân theo các quy trình tiêu chuẩn đối với một đợt bùng phát dịch bệnh có nguy cơ gây tử vong."
 situation_paragon_skrand_sickness_generous:0 "Chăm Sóc Chuyên Sâu"
 approach_situation_paragon_skrand_sickness_generous_tt:0 "Đầu tư vào nghiên cứu lâm sàng đồng thời duy trì việc cách ly nghiêm ngặt sẽ giúp hạn chế sự lây lan của dịch bệnh."
 situation_paragon_skrand_sickness_nothing:0 "Chăm Sóc Tối Thiểu"
 approach_situation_paragon_skrand_sickness_nothing_tt:0 "Nếu không có tài nguyên để cung cấp dịch vụ chăm sóc thỏa đáng, dịch bệnh sẽ tiến triển nhanh hơn rất nhiều."
 situation_paragon_skrand_sickness_tech_tt:0 "Thuốc Tăng Cường Sinh Lực"
 situation_paragon_skrand_sickness_ascension_tt:0 "Chuyên Môn Di Truyền"
 situation_paragon_skrand_sickness_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_cure:0 "Tiến Trình Tìm Thuốc Chữa"
 situation_paragon_skrand_cure_type:0 "Thuốc Chữa"
 situation_paragon_skrand_cure_desc:0 "Cũng như bất kỳ căn bệnh mới nào, công việc trong phòng thí nghiệm là tối quan trọng trong việc chống lại bệnh Hoại Lông. Các nhóm nghiên cứu đang làm việc không mệt mỏi để tìm ra phương thuốc chữa trị, trong khi đội ngũ y tế của chúng ta đang nỗ lực xoa dịu các triệu chứng và hạn chế sự lây lan của dịch bệnh."
 situation_paragon_skrand_cure_regular:0 "Nghiên Cứu Tiêu Chuẩn"
 approach_situation_paragon_skrand_cure_regular_tt:0 "Các nhóm nghiên cứu được tập hợp dựa trên kinh nghiệm về các bệnh dịch mới và chăm sóc sức khỏe. Mục tiêu của họ là tìm ra thuốc chữa đồng thời vẫn ưu tiên các nhiệm vụ khác."
 situation_paragon_skrand_cure_generous:0 "Nghiên Cứu Mở Rộng"
 approach_situation_paragon_skrand_cure_generous_tt:0 "Các nhóm nghiên cứu được tập hợp dựa trên kinh nghiệm về các bệnh dịch mới và chăm sóc sức khỏe. Ưu tiên hàng đầu được đặt vào việc tìm ra phương thuốc chữa trị thay vì xoa dịu các triệu chứng hay hạn chế dịch bệnh lây lan."
 situation_paragon_skrand_cure_nothing:0 "Nghiên Cứu Tối Thiểu"
 approach_situation_paragon_skrand_cure_nothing_tt:0 "Chúng ta không thể hy sinh năng lực nghiên cứu của mình - chỉ có các tình nguyện viên đang nghiên cứu phương pháp điều trị bệnh Hoại Lông. Điều này sẽ làm chậm nghiêm trọng tiến độ của chúng ta."
 situation_paragon_skrand_cure_ascension_tt:0 "Chuyên Môn Di Truyền"
 situation_paragon_skrand_cure_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_integration:0 "Tích Hợp Chỉ Huy"
 situation_paragon_skrand_integration_type:0 "Tích Hợp Chỉ Huy"
 situation_paragon_skrand_integration_desc:0 "Dự án tích hợp chỉ huy tập trung vào việc xoa dịu những tranh chấp nội bộ trong bộ chỉ huy hải quân, đặc biệt là giữa Skrand và nhân sự của chúng ta. Giải quyết tận gốc nguyên nhân căng thẳng có thể nâng cao hiệu quả của các quy trình chỉ huy của chúng ta."
 situation_paragon_skrand_integration_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_upgrade:0 "Nâng Cấp Talon"
 situation_paragon_skrand_upgrade_type:0 "Nâng Cấp Talon"
 situation_paragon_skrand_upgrade_desc:0 "Các đội ngũ kỹ thuật liên hợp đã tìm ra phương pháp lắp đặt thêm các lớp giáp phụ bao quanh những bộ phận trọng yếu nhất của Talon. Với đủ thời gian và tài nguyên, chúng ta chắc chắn sẽ thành công trong việc củng cố hệ thống phòng thủ của nó."
 situation_paragon_skrand_upgrade_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_crisis:0 "Nghiên Cứu Khủng Hoảng"
 situation_paragon_skrand_crisis_type:0 "Nghiên Cứu Khủng Hoảng"
 situation_paragon_skrand_crisis_desc:0 "Chúng ta đang bị bủa vây bởi những thế lực hùng mạnh tìm cách hủy diệt mọi sự sống trong thiên hà mà chúng ta từng biết. Skrand đã cống hiến chuyên môn cũng như dữ liệu liên quan từ nhật ký của tàu Talon, nhưng sẽ cần thêm thời gian trước khi chúng ta có thể hoàn thành một bản phân tích toàn diện."
 situation_paragon_skrand_crisis_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_study:0 "Nghiên Cứu Talon"
 situation_paragon_skrand_study_type:0 "Nghiên Cứu Talon"
 situation_paragon_skrand_study_desc:0 "Bằng cách nghiên cứu thiết kế của Talon, chúng ta có thể học hỏi từ kết cấu đóng tàu của nó và hỗ trợ tốt hơn cho đội ngũ của nó trong công tác bảo trì."
 situation_paragon_skrand_study_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_rebuild:0 "Tái Thiết Talon"
 situation_paragon_skrand_rebuild_type:0 "Tái Thiết Talon"
 situation_paragon_skrand_rebuild_desc:1 "Con tàu Talon đã bị phá hủy. Nhưng với tất cả những gì chúng ta đã học được, chúng ta hoàn toàn có thể sử dụng những tàn tích thu hồi được của nó làm nền tảng để đưa nó vận hành trở lại."
 NAME_WingsOfGlory2:0 "Phượng Hoàng"
 situation_paragon_skrand_rebuild_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_species:0 "Giống Loài Mới"
 situation_paragon_skrand_species_type:0 "Thử Nghiệm Di Truyền"
 situation_paragon_skrand_species_desc:0 "Với chuyên môn vượt trội về di truyền học, chúng ta có thể hồi sinh giống loài của Skrand, mang lại cho họ niềm hy vọng và một khởi đầu mới trong đế chế của chúng ta."
 situation_paragon_skrand_species_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_story:0 "Bài Học Quá Khứ"
 situation_paragon_skrand_story_type:0 "Bài Học Quá Khứ"
 situation_paragon_skrand_story_desc:0 "Nghiên cứu lịch sử của Skrand và đồng bào ông thông qua ngân hàng dữ liệu của Talon sẽ cung cấp nhiều bài học sâu sắc độc đáo."
 situation_paragon_skrand_story_monthly_change_tooltip:0 "$situation_paragon_skrand_monthly_change_tooltip$"

 situation_paragon_skrand_balanced:0 "Kinh Phí Cân Bằng"
 approach_situation_paragon_skrand_balanced_tt:0 "Nguồn tài chính bền vững sẽ cho phép dự án tiếp tục tiến triển mà không gây gánh nặng quá mức cho nền kinh tế của chúng ta."
 situation_paragon_skrand_generous:0 "Kinh Phí Hào Phóng"
 approach_situation_paragon_skrand_generous_tt:0 "Nguồn tài chính dồi dào sẽ đẩy nhanh đáng kể tiến độ nhưng đòi hỏi đầu tư tài chính lớn từ chính phủ."
 situation_paragon_skrand_low:0 "Kinh Phí Tối Thiểu"
 approach_situation_paragon_skrand_low_tt:0 "Kinh phí tối thiểu sẽ làm chậm đáng kể tiến độ, nhưng sẽ giúp giảm chi phí duy trì hàng tháng."
 situation_paragon_skrand_none:0 "Không Cấp Kinh Phí"
 approach_situation_paragon_skrand_none_tt:0 "Dự án sẽ bị tạm dừng cho đến khi chúng ta phân bổ lại ngân sách cần thiết."
 situation_paragon_skrand_balanced_researchers:0 "Nguồn tài chính bền vững sẽ cho phép dự án tiếp tục tiến triển mà không gây gánh nặng quá mức cho nền kinh tế của chúng ta."
 situation_paragon_skrand_low_researchers:0 "Kinh phí thấp sẽ làm chậm đáng kể tiến độ, nhưng sẽ giúp giảm chi phí duy trì hàng tháng."

 ########################
 ### ORIGIN & RELATED ###
 ########################

 #UTILITY
 origin_legendary_leader:0 "Dưới Một Quyền Bính"
 origin_legendary_leader_desc:1 "Giữa bạo lực và gian truân, nền văn minh này đã được thống nhất bởi một nhà lãnh đạo duy nhất. Củng cố quyền lực thông qua việc trấn áp các phe phái yếu hơn, giờ đây họ đã trở thành những người ủng hộ kiên quyết cho khoa học và tiến bộ kỹ thuật. Sau tất cả, một nền hòa bình bất an đã buông xuống. Nhưng hòa bình hiếm khi kéo dài được lâu."
 origin_tooltip_legendary_leader_effects:2 "- $SPECIES_TRAITS$ ['concept_perfected_genes'] $NEW_LINE$- Đặc Điểm Người Cai Trị: ['concept_leader_trait_legendary_leader']"
 START_SCREEN_LEGENDARY_LEADER:1 "Nền văn minh của chúng ta vốn luôn dễ nảy sinh xung đột. Các đế chế và vương quốc từng trỗi dậy, nhưng chưa bao giờ tồn tại lâu dài, luôn sụp đổ dưới áp lực của những cuộc nội đấu triền miên.\n\nVăn hóa phân cực này lên đến đỉnh điểm khi thế giới của chúng ta bị ngọn lửa chiến tranh thiêu rụi. Giữa lúc hỗn loạn, một nhà lãnh đạo đã xuất hiện. [owner.Ruler.GetTitle] [owner.Ruler.GetName] đã tập hợp được một lực lượng tín đồ bị cuốn hút bởi sự vị tha, sức lôi cuốn và uy quyền của [owner.Ruler.GetHisHer]. Cuối cùng cũng có một người đứng lên để thống nhất chúng ta.\n\nĐại Thống Nhất là một tiến trình trường kỳ và đau đớn, nhưng hết phe phái tham chiến này đến phe phái khác cuối cùng đã đầu hàng và quy phục, bị khuất phục bởi những lời hứa của [owner.Ruler.GetTitle] về một tương lai giữa muôn vì sao. Lần đầu tiên sau nhiều thế kỷ, chúng ta có được hòa bình, nhưng ẩn sâu dưới bề mặt, những vết sẹo của những ân oán xưa cũ vẫn còn hằn sâu."
 origin_legendary_leader_imperial:0 "$origin_legendary_leader$"
 origin_legendary_leader_imperial_desc:0 "$origin_legendary_leader_desc$"
 origin_legendary_leader_dictatorial:0 "$origin_legendary_leader$"
 origin_legendary_leader_dictatorial_desc:0 "$origin_legendary_leader_desc$"
 origin_legendary_leader_death:0 "Quyền Bính Đổ Vỡ"
 origin_legendary_leader_death_desc:0 "Giữa cơn bão biến động chính trị, và thiếu đi sự dẫn dắt của Minh Lãnh Tụ, người dân phải tự tìm lấy con đường của riêng mình giữa thiên hà."
 origin_legendary_leader_no_gov_change:0 "Không thể thay đổi Thể chế với Nguồn gốc Dưới Một Quyền Bính"

 #BUILDING
 building_paragon_origin_academy:0 "Đại Học Viện"
 building_paragon_origin_academy_desc:0 "Đại Học Viện là ngôi nhà của những bộ óc ưu tú và thông tuệ nhất của chúng ta. Việc tiếp tục nâng cao trí tuệ cho họ sẽ mang lại lợi ích cho các lãnh đạo mới và cho phép chúng ta đào tạo các thế hệ tương lai."

 #MODIFIERS AND OTHERS

 planet_clerks:0 "Công Việc Thư Ký"
 planet_civilians: "Công Việc Dân Sự"

 commanding_presence:0 "Uy Quyền Thống Trị"
 commanding_presence_desc:0 "Bằng ý chí quật cường phi thường của nhà lãnh đạo, chúng ta có thể truyền cảm hứng cho người dân lao động chăm chỉ hơn và hướng tới những mục tiêu vĩ đại hơn."
 paragon_origin_strengthened_government_i:0 "Chính Phủ Củng Cố I"
 paragon_origin_strengthened_government_i_desc:0 "Đế chế chúng ta tập trung vào việc kiến tạo một bộ máy chính phủ được quản lý tốt hơn và ổn định hơn."
 paragon_origin_strengthened_government_ii:0 "$paragon_origin_strengthened_government_i$I"
 paragon_origin_strengthened_government_ii_desc:0 "$paragon_origin_strengthened_government_i_desc$ Các khóa đào tạo đặc biệt và sàng lọc sơ bộ cho các vị trí chính phủ là điều kiện tiên quyết để đạt được mục tiêu này."
 paragon_origin_strengthened_government_ii_tt:1 "Mỗi [civilian.GetIcon] §Y[civilian.GetName]§! nhận được thêm §Y25%§! $POLITICAL_POWER$\n£unity£ $unity$ từ [civilian.GetIcon] [civilian.GetNamePlural]: §G+0.5§!"
 paragon_origin_strengthened_government_iii:0 "$paragon_origin_strengthened_government_i$II"
 paragon_origin_strengthened_government_iii_desc:0 "$paragon_origin_strengthened_government_ii_desc$ Để tăng cường hơn nữa đội ngũ nhân viên văn phòng, chúng ta đã ban hành các quy định mới. Chỉ những công dân chính trực và trung thành nhất mới được ứng tuyển vào công việc này."
 paragon_origin_strengthened_government_iii_tt:1 "Mỗi [civilian.GetIcon] §Y[civilian.GetName]§! nhận được thêm §Y50%§! $POLITICAL_POWER$\n£unity£ $unity$ từ [civilian.GetIcon] [civilian.GetNamePlural]: §G+1§!\n£mod_country_edict_fund_add£ $MOD_COUNTRY_EDICT_FUND_ADD$ từ [civilian.GetIcon] [civilian.GetNamePlural]: §G+1§!"
 paragon_origin_humble_monument:0 "Đài Tưởng Niệm Khiêm Tốn"
 paragon_origin_humble_monument_desc:0 "Tượng đài khiêm tốn này là sự tri ân dành cho nhà lãnh đạo vinh quang của chúng ta."
 paragon_origin_rich_monument:0 "Đài Tưởng Niệm Xa Hoa"
 paragon_origin_rich_monument_desc:0 "Đài tưởng niệm lộng lẫy này kỷ niệm khu định cư đầu tiên được thành lập trên thế giới này dưới sự trị vì của Minh Lãnh Tụ."
 paragon_origin_residential_monument:0 "Đài Tưởng Niệm Dân Sinh"
 paragon_origin_residential_monument_desc:0 "Đài tưởng niệm dân sinh này minh chứng cho sự sáng suốt của các nhà lãnh đạo chúng ta, vừa mang tính biểu tượng vừa cung cấp không gian sinh sống cho người dân."
 paragon_origin_pirates:0 "Hải Tặc Đột Kích"
 paragon_origin_pirates_desc:0 "Nhiều toán cướp biển khác nhau đã liên kết lại để tiến hành các cuộc đột kích táo tợn vào các tuyến thương mại của chúng ta."
 paragon_origin_prisoners:0 "Tù Nhân Được Phóng Thích"
 paragon_origin_prisoners_desc:0 "Phái Cải Cách đã yêu cầu ân xá tội phạm trên toàn đế chế, khiến nhiều kẻ nguy hiểm lại được tự do ngoài xã hội."
 paragon_origin_comms_down:0 "Mạng Truyền Tin Bị Hỏng"
 paragon_origin_comms_down_desc:0 "Các mảng ăng-ten truyền tin tiêu chuẩn của chúng ta gặp sự cố kỹ thuật. Chúng không còn duy trì kết nối ổn định tới các thuộc địa xa xôi ở rìa biên giới của chúng ta nữa.\n\nHoàn thành Dự án Đặc biệt để gỡ bỏ $paragon_origin_comms_down$."
 paragon_origin_worker_strike:0 "Công Nhân Đình Công"
 paragon_origin_worker_strike_desc:1 "Công nhân bị quá tải, bất mãn và không thể đáp ứng các chỉ tiêu sản xuất quá mức. Nỗ lực phi thường đòi hỏi từ công dân rõ ràng đang để lại những hậu quả nặng nề.\n\nHoàn thành Dự án Đặc biệt để gỡ bỏ $paragon_origin_worker_strike$."
 paragon_origin_military_dissidents:0 "Bất Đồng Chính Kiến Trong Quân Đội"
 paragon_origin_military_dissidents_desc:0 "Các tin đồn chỉ ra rằng một nhóm sĩ quan quân đội cấp thấp đang bất mãn với đường lối hiện tại của đế chế. Nhóm này đang cố gắng lôi kéo thêm nhiều công dân gia nhập hàng ngũ của họ.\n\nHoàn thành Dự án Đặc biệt để gỡ bỏ $paragon_origin_military_dissidents$."

 paragon_origin_nepotism:0 "Nạn Con Ông Cháu Cha"
 paragon_origin_nepotism_desc:1 "Đế chế của chúng ta đang bị hoành hành bởi nạn con ông cháu cha tràn lan, gây cản trở các hoạt động của chúng ta. Các chức vụ được lấp đầy bởi bạn bè, người nhà và những kẻ có quan hệ - chứ không phải bởi những người có thực tài.\n\nHoàn thành Dự án Đặc biệt để gỡ bỏ $paragon_origin_nepotism$."
 paragon_origin_forgotten_deal:0 "Tự Do Hiến Định"
 paragon_origin_forgotten_deal_desc:0 "Chúng ta đã đạt được một thỏa thuận để xoa dịu kẻ thù. Những nhượng bộ đã được đưa ra, và các quyền tự do đã được trao tặng, nhưng chúng ta phải đảm bảo rằng họ không lạm dụng sự sắp đặt này."
 paragon_origin_reformists_deal:0 "Tự Do Hiến Định"
 paragon_origin_reformists_deal_desc:0 "Chúng ta đã đạt được một thỏa thuận để xoa dịu kẻ thù. Các nhượng bộ đã được đưa ra, bao gồm việc cấp cho họ quyền tự do theo đuổi nhiều chương trình nghị sự của mình. Họ sẽ nhận được sự bảo vệ đặc biệt và có tầm ảnh hưởng lên một số cơ quan lập pháp của chúng ta. Về mặt tích cực, công dân của chúng ta sẽ được hưởng một số lợi ích và hài lòng với những quyền tự do mới tìm thấy."
 paragon_origin_reformists:0 "Khuynh Hướng Dân Chủ"
 paragon_origin_reformists_desc:0 "Các báo cáo cho biết phe phái dân chủ đang nhanh chóng thu hút thêm người ủng hộ. Các lực lượng an ninh của chúng ta hiện đang theo dõi sự phát triển và hành vi của họ."
 paragon_origin_reformists_empire:0 "Phe Phái Dân Chủ"
 paragon_origin_reformists_empire_desc:0 "$paragon_origin_reformists_desc$"
 paragon_origin_broken_promise:0 "Đình Công Quy Mô Lớn!"
 paragon_origin_broken_promise_desc:0 "Do lời hứa của chúng ta bị thất hứa, các công dân bình thường đang biểu tình phản đối trên hầu hết mọi hành tinh trong toàn đế chế."
 paragon_origin_saddening_grief:0 "Tổn Thất To Lớn"
 paragon_origin_saddening_grief_desc:0 "Minh Lãnh Tụ đã băng hà! Tin tức này đã gây chấn động toàn thể dân chúng. Việc đột ngột mất đi người cầm lái đã khiến xã hội chao đảo, giữa lúc nhiều cuộc cải cách được đề xuất và các chính khách tranh giành quyền lực."
 paragon_origin_rebel_player:0 "Tinh Thần Cách Mạng"
 paragon_origin_rebel_player_desc:0 "Chúng ta là một dân tộc được hồi sinh với ý thức mạnh mẽ về bình đẳng và đoàn kết. Mạnh mẽ hơn bao giờ hết, và thoát khỏi ách bạo chúa, chúng ta sẽ tự mình cai trị, dù tương lai có ra sao."
 paragon_origin_rebel_militarist:0 "Chiến Binh Tự Do"
 paragon_origin_rebel_militarist_desc:0 "Chúng ta hướng tầm mắt lên các vì sao và xa hơn nữa, để nâng đỡ và giải phóng những kẻ khác. Hải quân đổi mới của chúng ta đã sẵn sàng mang lại sự bình đẳng đến những góc xa xôi nhất của thiên hà."
 paragon_origin_rebel_pacifist:0 "Xã Hội Hài Hòa"
 paragon_origin_rebel_pacifist_desc:0 "Tìm kiếm sự thanh thản trong tâm hồn luôn là mục tiêu của cộng đồng chúng ta, và cuối cùng chúng ta đã đạt được điều đó. Mặc dù chúng ta đã phải trả giá đắt cho nó, nhưng giờ là lúc gặt hái thành quả."
 paragon_origin_rebel_xenophobe:0 "Xã Hội Khép Kín"
 paragon_origin_rebel_xenophobe_desc:0 "Biến động gần đây đã cho chúng ta thấy rằng việc mở cửa cho các thế lực bên ngoài có thể mang lại xung đột và đau khổ. Chúng ta cần tự bảo vệ mình trước những mối đe dọa như vậy trong tương lai."
 paragon_origin_rebel_xenophile:0 "Xã Hội Rộng Mở"
 paragon_origin_rebel_xenophile_desc:0 "Biến động gần đây đã cho chúng ta thấy rằng việc đóng cửa trước các thế lực bên ngoài có thể dẫn đến xung đột và đau khổ. Chúng ta cần mở rộng vòng tay để không bỏ lỡ những cơ hội tương tự trong tương lai."
 paragon_origin_rebel_materialist:0 "Định Hướng Tiến Bộ"
 paragon_origin_rebel_materialist_desc:0 "Xã hội mới, được tôi luyện trong ngọn lửa của cuộc nội chiến thiên hà, thấu hiểu giá trị của sức lao động. Cùng nhau, chúng ta phấn đấu để hoàn thành mọi mục tiêu của mình."
 paragon_origin_rebel_spiritualist:0 "Đường Lối Khắc Kỷ"
 paragon_origin_rebel_spiritualist_desc:0 "Chúng ta đã rút ra bài học từ những trải nghiệm đớn đau. Cuộc nội chiến đã dạy chúng ta sự kiềm chế và tầm quan trọng của sự thanh thản trong tâm hồn. Sự suy đồi và tham nhũng phải bị đẩy lùi ở mọi ngã rẽ."
 paragon_origin_fresh_start:0 "Đế Chế Thống Nhất"
 paragon_origin_fresh_start_desc:0 "Lần đầu tiên kể từ sau Đại Thống Nhất, công dân của chúng ta thực sự sát cánh bên nhau. Với những cải cách gần đây, đế chế chúng ta mạnh mẽ hơn bao giờ hết."
 paragon_origin_one_system_war:1 "Nội Chiến"
 paragon_origin_one_system_war_desc:1 "Sau nhiều năm dài xung đột nội bộ, dân chúng cuối cùng đã được thống nhất. Nhưng giờ đây, khi chúng ta hướng tầm nhìn lên các vì sao, một mầm mống xung đột mới lại xuất hiện. Một lần nữa chúng ta bị tàn phá bởi chiến tranh, và cuộc tranh giành quyền bá chủ đang cận kề."
 paragon_origin_united_through_war:1 "Tôi Luyện Trong Lửa Đỏ"
 paragon_origin_united_through_war_desc:1 "Việc chỉ đoàn kết người dân trong sự nghiệp chung thuộc địa hóa không gian là chưa đủ. Dù đất nước bị tàn phá bởi nội chiến, những người trung thành vẫn kiên định ủng hộ ngai vàng, hiên ngang đứng vững trước những kẻ phản bội đe dọa lối sống của họ và người cai trị kính yêu của chúng ta."
 council_in_tatter:1 "Hội Đồng Quá Tải"
 council_in_tatter_desc:0 "Trước gánh nặng hành chính khổng lồ trong những năm gần đây nhằm duy trì sự tăng trưởng phi thường, hội đồng đã gặp khó khăn trong việc thích ứng với các trách nhiệm ngày càng gia tăng."
 d_arcane_device:0 "Thiết Bị Huyền Bí"
 d_arcane_device_desc:1 "Cỗ máy cổ xưa này ngự sâu bên trong các hầm ngầm chính phủ trên hành tinh chúng ta. Là di sản từ sự tài tình của vị minh quân kính yêu, công nghệ nhân bản vật chất của nó vẫn là điều hoàn toàn nằm ngoài tầm hiểu biết của chúng ta."
 sustaining_apparatus:0 "Thiết Bị Duy Sinh"
 sustaining_apparatus_desc:0 "Cỗ máy phi thường này ngự sâu bên trong tòa nhà chính phủ. Là di sản từ sự tài tình của vị minh quân kính yêu, các cơ chế vận hành bên trong của nó đối với chúng ta gần như là phép thuật. Nó cho phép chúng ta duy trì sự sống của người cai trị. Khoang chứa được điều chỉnh riêng biệt cho một chuỗi DNA cụ thể. Việc đánh mất hoặc di dời thủ đô đồng nghĩa với cái chết chắc chắn cho người nằm bên trong."
 NAME_PARAGON_ORIGIN_CRUISER_FLEET:0 "Tinh Thần Dân Tộc"
 NAME_MavenCruiser:0 "Niềm Tự Hào Hải Quân"
 maven_cruiser_01:0 "Tuần Dương Hạm Thử Nghiệm"
 maven_cruiser_01_plural:0 "Tuần Dương Hạm Thử Nghiệm"
 NAME_PARAGON_ORIGIN_CRUISER:0 "Cái Đe"

 #Starting Traits
 leader_trait_legendary_leader:0 "Minh Lãnh Tụ"
 leader_trait_legendary_leader_desc:2 "§GMinh Lãnh Tụ gia tăng quyền năng theo thời gian.§!\n\nChiến Tranh Thống Nhất là một thời kỳ tàn khốc. Cuối cùng, [Root.GetName] đã mang lại hòa bình và lẽ sống cho tất cả chúng ta. Minh Lãnh Tụ là biểu tượng sống cho những gì giống loài chúng ta có thể đạt được, và là nguồn cảm hứng cho muôn dân.[This.Paragon_Origin_Ascension_Desc]"
 leader_trait_legendary_offspring:0 "Huyết Thống $leader_trait_legendary_leader$"
 leader_trait_legendary_offspring_desc:1 "Người kế vị của $leader_trait_legendary_leader$. Giống như người tiền nhiệm, nhà lãnh đạo này sở hữu các kỹ năng lãnh đạo vượt trội, và có định mệnh tiếp nối sự nghiệp của [Root.GetHisHer]."
 trait_perfected_genes:0 "Gen Hoàn Mỹ"
 trait_perfected_genes_desc:1 "§LHàng thiên niên kỷ thử nghiệm di truyền và chiến tranh đã khiến giống loài này có khả năng thích ứng và kiên cường phi thường.§!"
 leader_trait_legendary_story:0 "Chiến Tích Lịch Sử"
 leader_trait_legendary_story_desc:0 "Nhà lãnh đạo này sẽ đi vào lịch sử như một nhân vật sở hữu những chiến tích huy hoàng và sự vĩ đại vô song."

 paragon_origin_psionic_ascension:1 "\n\n§PQuyền Năng Tràn Trề:§!\nSau một nghi lễ tâm linh, nhà lãnh đạo này đã trở thành một ống dẫn nối tới Shroud. Năng lượng tâm linh của toàn thể đồng bào chúng ta được dẫn truyền vào [Root.GetHimHer], biến nhà lãnh đạo này thành một thực thể gần như thần thánh. Tuy nhiên, quyền năng đó đi kèm với một cái giá, và chúng ta phải hy sinh những cá nhân tâm linh khác để duy trì ống dẫn.\nChi phí duy trì mười năm: §R[owner.paragon_origin_ascension]§! £pop£ $POPS$"
 paragon_origin_cybernetic_ascension:0 "\n\n§PTrái Tim Lõi:§!\nĐược tạo tác từ một lõi hành tinh, cấy ghép điều khiển học độc nhất vô nhị này đòi hỏi nguồn cung cấp £sr_dark_matter£ $sr_dark_matter$ liên tục để duy trì hiệu suất của nó."
 paragon_origin_synthetic_ascension:0 "\n\n§PThể Xác Vĩnh Cửu:§!\nBằng cách chế tạo một bộ não positron độc nhất và đặt nó bên trong một cơ thể bằng Kim Loại Sống, chúng ta đã đưa $leader_trait_legendary_leader$ trở lại với sự sống. Để duy trì sự tồn tại của [Root.GetHimHer], chúng ta cần một nguồn cung cấp £sr_living_metal£ $sr_living_metal$ liên tục."
 paragon_origin_genetic_ascension:0 "\n\n§PKhôi Phục Bộ Gen:§!\nSau nhiều nỗ lực ghép nối DNA của $leader_trait_legendary_leader$ vào các cá nhân tài năng khác, một bệnh nhân duy nhất đã sống sót sau ca phẫu thuật và phát triển các đặc điểm có lợi. Tuy nhiên, vật liệu di truyền mới cần được tiêm đều đặn để duy trì tính ổn định của bộ gen.\nChi phí duy trì mười năm: §R[owner.paragon_origin_ascension]§! £pop£ $POPS$"
 paragon_origin_null_loc:0 " ..."

 #Ethic Traits
 leader_trait_legendary_origin_desc:1 "§GĐặc Điểm Người Cai Trị Minh Lãnh Tụ§!"
 leader_trait_legendary_military_knowledge:0 "Chỉ Huy Truyền Cảm Hứng"
 leader_trait_legendary_military_knowledge_desc:0 "Một chỉ huy quân sự kiệt xuất, được binh lính hết mực kính yêu và được kẻ thù nể sợ. Sự hiện diện của họ trên chiến trường có thể xoay chuyển cục diện của bất kỳ cuộc giao tranh nào."
 leader_trait_legendary_foe_hammer:1 "Kẻ Tấn Công Kiên Cường"
 leader_trait_legendary_foe_hammer_desc:1 "Là một chuyên gia về các hệ thống vũ khí chiến hạm, nhà lãnh đạo này không khoan nhượng trong tấn công và luôn tìm cách nghiền nát hệ thống phòng thủ của đối phương."
 leader_trait_legendary_great_teacher:0 "Người Thầy Thông Tuệ"
 leader_trait_legendary_great_teacher_desc:1 "Nhà lãnh đạo này bộc lộ kỹ năng sư phạm phi thường, luôn tận tụy truyền dạy kiến thức và bồi dưỡng thế hệ lãnh đạo kế cận của đế chế."
 leader_trait_legendary_pious_ascet:0 "Khắc Kỷ Ngoan Đạo"
 leader_trait_legendary_pious_ascet_desc:0 "Nhà lãnh đạo này là tấm gương mẫu mực về tính tự kỷ luật, là nguồn cảm hứng tâm linh sâu sắc thôi thúc lòng sùng kính của toàn thể quần chúng."
 leader_trait_legendary_commanding_presence:0 "Uy Quyền Thống Trị"
 leader_trait_legendary_commanding_presence_desc:1 "Uy quyền đến với nhà lãnh đạo này một cách tự nhiên, và hiếm có ai dám đặt câu hỏi hay thách thức những mệnh lệnh được đưa ra."
 leader_trait_legendary_high_king:0 "Chí Cao Vương"
 leader_trait_legendary_high_king_desc:1 "Chỉ bằng chính thực tài của mình, nhà lãnh đạo này đã giành được sự kính trọng và phục tùng tuyệt đối từ tất cả các nhà quý tộc và thủ lĩnh các phe phái."
 leader_trait_legendary_gunboat_diplomacy:0 "Ngoại Giao Pháo Hạm"
 leader_trait_legendary_gunboat_diplomacy_desc:0 "Nhà lãnh đạo này ưa chuộng việc phô trương sức mạnh quân sự. Một hạm đội chiến hạm hùng hậu xuất hiện đúng lúc luôn là công cụ đàm phán hiệu quả nhất."
 leader_trait_legendary_scientific_diplomacy:0 "Thu Hút Nhân Tài"
 leader_trait_legendary_scientific_diplomacy_desc:1 "Bằng cách mang lại những điều kiện đãi ngộ tốt nhất, chúng ta có thể thu hút những bộ óc thông minh nhất từ khắp mọi nơi trong thiên hà về phụng sự cho mình."
 leader_trait_legendary_scientific_diplomacy_tt:1 "§YHiệp Ước Di Cư§! tạo ra §G$@scientific_diplomacy_1_amt$§! £physics£ £society£ £engineering£ §YĐiểm Nghiên Cứu§!\n$t$- $leader_trait_legendary_origin_desc$"
 leader_trait_legendary_scientific_diplomacy_2_tt:0 "§YHiệp Ước Di Cư§! tạo ra §G$@scientific_diplomacy_2_amt$§! £physics£ £society£ £engineering£ §YĐiểm Nghiên Cứu§!\n$t$- $leader_trait_legendary_origin_desc$"
 leader_trait_legendary_scientific_diplomacy_3_tt:0 "§YHiệp Ước Di Cư§! tạo ra §G$@scientific_diplomacy_3_amt$§! £physics£ £society£ £engineering£ §YĐiểm Nghiên Cứu§!\n$t$- $leader_trait_legendary_origin_desc$"
 leader_trait_legendary_autarky:0 "Tự Cung Tự Cấp"
 leader_trait_legendary_autarky_desc:1 "Nhà lãnh đạo này luôn nỗ lực đảm bảo sự độc lập kinh tế của quốc gia, giảm thiểu tối đa sự phụ thuộc vào thương mại bên ngoài."
 leader_trait_legendary_natural_ruler:0 "Minh Quân Khai Sáng"
 leader_trait_legendary_natural_ruler_desc:1 "Đầy sức hút, biết quan tâm và vị tha, nhà lãnh đạo này luôn đặt hạnh phúc và thịnh vượng của nhân dân lên trên hết thảy mọi thứ."
 leader_trait_legendary_industry_titan:0 "Người Khổng Lồ Công Nghiệp"
 leader_trait_legendary_industry_titan_desc:0 "Nhà lãnh đạo này coi một nền kinh tế vững mạnh là nền tảng cho sự vĩ đại của đế chế, liên tục thúc đẩy gia tăng năng suất sản xuất công nghiệp."
 leader_trait_legendary_great_inventor:0 "Nhà Phát Minh Vĩ Đại"
 leader_trait_legendary_great_inventor_desc:0 "Nhà lãnh đạo này là người tiên phong trong lĩnh vực robot học và là chuyên gia hàng đầu của chúng ta về tự động hóa."
 leader_trait_legendary_great_inventor_tt:1 "£amenities£ Tiện nghi từ £job_roboticist£ $job_roboticist_plural$: §G+1§!\n$t$- $leader_trait_legendary_origin_desc$"
 leader_trait_legendary_great_inventor_2_tt:0 "£amenities£ Tiện nghi từ £job_roboticist£ $job_roboticist_plural$: §G+2§!\n$t$- $leader_trait_legendary_origin_desc$"
 leader_trait_legendary_great_inventor_3_tt:0 "£amenities£ Tiện nghi từ £job_roboticist£ $job_roboticist_plural$: §G+3§!\n$t$- $leader_trait_legendary_origin_desc$"
 leader_trait_legendary_genetic_purist:0 "Nghệ Sĩ Bộ Gen"
 leader_trait_legendary_genetic_purist_desc:1 "Tài năng thao túng di truyền của nhà lãnh đạo này đã trở thành huyền thoại, mở ra những khả năng vô tận cho sự hoàn thiện sinh học của giống loài."
 leader_trait_legendary_evervigilant:0 "Luôn Luôn Cảnh Giác"
 leader_trait_legendary_evervigilant_desc:0 "Nhà lãnh đạo này cực kỳ nghiêm ngặt về các vấn đề an ninh và luôn chủ động đề phòng trước mọi âm mưu phá hoại có thể xảy ra."

 #Legendary Traits - bad
 leader_trait_legendary_unfriendly:0 "Bộc Trực Thô Lỗ"
 leader_trait_legendary_unfriendly_desc:0 "Lạnh lùng và rất bộc trực, nhà lãnh đạo này thường xuyên khiến các quan chức ngoại giao ngoại quốc phải phật lòng vì sự thẳng thừng của mình."
 leader_trait_legendary_warmonger:0 "Kẻ Hiếu Chiến"
 leader_trait_legendary_warmonger_desc:0 "Mang tính khiêu khích và hiếu thắng, nhà lãnh đạo này thích đối đầu và luôn tìm kiếm lý do để đưa quân đội vào trận chiến."
 leader_trait_legendary_dreamlike:0 "Đãng Trí"
 leader_trait_legendary_dreamlike_desc:1 "Nhà lãnh đạo này rất dễ bị phân tâm và thường xuyên quên mất các chi tiết hành chính quan trọng trong công việc hàng ngày."
 leader_trait_legendary_harsh_ruler:0 "Tàn Bạo"
 leader_trait_legendary_harsh_ruler_desc:0 "Câu trả lời của nhà lãnh đạo này cho mọi vấn đề xã hội luôn là sự trấn áp tàn bạo và các biện pháp trừng phạt nặng nề."
 leader_trait_legendary_harsh_ruler_tt:1 "£job_enforcer£ §Y$job_enforcer_plural$§! và £job_telepath£ §Y$job_telepath_plural$§! giảm thiểu £happiness£ §Y$HAPPINESS$§! đi §R2.5%§!"
 leader_trait_legendary_too_open:0 "Ngây Thơ"
 leader_trait_legendary_too_open_desc:1 "Nhà lãnh đạo này quá tin người và dễ dãi tha thứ. Những kẻ khác thường lợi dụng lòng tốt này để mưu cầu tư lợi."
 leader_trait_legendary_hoplofobia:0 "Khiếp Sợ Rủi Ro"
 leader_trait_legendary_hoplofobia_desc:1 "Kinh hãi trước các rủi ro, nhà lãnh đạo này quá mức thận trọng và áp đặt các biện pháp kiểm tra rườm rà không cần thiết vào quy trình làm việc."
 leader_trait_legendary_bad_meritocracy:0 "Kẻ Tinh Hoa Biệt Lập"
 leader_trait_legendary_bad_meritocracy_desc:1 "Nhà lãnh đạo này ghê tởm sự tầm thường, thường sa thải những người có thực tài chỉ vì những sai sót nhỏ nhặt nhất."
 leader_trait_legendary_delusional:0 "Bạo Chúa Hoang Tưởng"
 leader_trait_legendary_delusional_desc:1 "Những ảo tưởng hoang tưởng của nhà lãnh đạo này đang đẩy [Root.GetHimHer] ngày càng lún sâu vào sự cô lập và nghi kỵ mọi người."
 leader_trait_legendary_delusional_effect:1 "Khi sự hoang tưởng của nhà lãnh đạo này trầm trọng hơn, khả năng kiểm soát sản lượng §Y$worker_plural$§! & §Y$specialist_plural$§! của họ sẽ kém đi và làm giảm sản lượng §Y$unity$§! của chúng ta."

