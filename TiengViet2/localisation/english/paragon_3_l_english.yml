 paragon.leader.growth.positive:0 "Đặc điểm §YMinh Lãnh Tụ§! của §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§! §Gtăng cấp§!."
 paragon.leader.growth.negative:0 "Đặc điểm §YMinh Lãnh Tụ§! của §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§! §Rsuy giảm§!."
 paragon.leader.delusion.positive:1 "Đặc điểm §Y$leader_trait_legendary_delusional$§! của §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§! §Gđược cải thiện§!."
 paragon.leader.delusion.negative:1 "Đặc điểm §Y$leader_trait_legendary_delusional$§! của §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§! §Rtrở nên tồi tệ hơn§!."
 paragon.ending.speech:2 "§HBuổi truyền phát kết thúc và luồng cấp tin tức thường lệ được nối lại.§!"
 paragon.beginning.speech:2 "§H§Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! đã xuất hiện trên mọi màn hình trong toàn đế chế. Toàn thể người dân đang lắng nghe bài phát biểu bắt đầu.§!"
 paragon.origin.insight:0 "Chúng ta đã tiến gần hơn tới mục tiêu!"
 paragon_origin_upgrades_overload:0 "Chúng ta chỉ có thể chọn §G[ROOT.paragon_origin_ascension] Nâng Cấp§!, nếu không §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ không có cơ hội sống sót sau ca phẫu thuật này."
 paragon.origin.grand.academy:0 "Mở khóa công trình £building£ §GĐại Học Viện§!, cung cấp các chỉ số thưởng cho các nhà lãnh đạo và đế chế của chúng ta."

#EMPIRE PROMISE
 paragon.5004.name:0 "Lời Hứa Hẹn"
 paragon.5004.desc:1 "§Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! đã chấm dứt những cuộc nội đấu và mang lại Đại Thống Nhất. [Owner.Ruler.GetHeSheCap] lên nắm quyền dựa trên nền tảng của lòng yêu nước đoàn kết và chủ nghĩa đế chế, cam kết dẫn dắt chúng ta tiến vào các vì sao và kiến tạo một đế chế ngân hà vĩ đại.\n\nNgày nay, người dân của chúng ta ngày càng mất kiên nhẫn, và những tiếng nói bất đồng đang hoài nghi năng lực lãnh đạo của chúng ta. Hội đồng đã chuẩn bị một số kế hoạch 40 năm nhằm dập tắt những hoài nghi này, đồng thời đưa giống loài chúng ta tiến vào kỷ nguyên tiếp theo."
 paragon.5004.a:1 "Hãy bắt tay vào hành động thôi!"
 paragon.5004.a.tt:0 "Mở khóa Nghị Trình Lời Hứa Thống Nhất giúp cải thiện các Nghị Trình theo Tư Tưởng trong suốt thời gian diễn ra Tình Huống §YLời Hứa Thống Nhất§!."

 paragon_origin_promise:0 "Lời Hứa Thống Nhất"
 paragon_origin_promise_type:0 "Lời Thề Cổ Xưa"
 paragon_origin_promise_desc:1 "Trong thời kỳ Đại Thống Nhất, §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! đã thề rằng một ngày nào đó đồng bào chúng ta sẽ định cư trên những hành tinh khác. Đối với nhiều người, lời thề đó gần như đã trở thành một lời sấm truyền. Những kẻ khác lại hoài nghi liệu nó có bao giờ trở thành hiện thực. Gần đây, bất chấp những bước tiến vượt bậc của công nghệ FTL, một số kẻ đã bắt đầu lợi dụng lời hứa chưa được thực hiện này để làm suy yếu quyền cai trị của §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§!.\n\nCách chắc chắn nhất để khiến những kẻ bất đồng chính kiến này câm lặng là chứng minh họ đã sai. Chúng ta sẽ tiến vào các vì sao, định cư trên những thế giới mới và mở rộng biên cương nhiều nhất có thể."
 paragon_origin_promise_monthly_change_tooltip:0 "Chúng ta có 40 năm để hoàn thành lời hứa!"
 situation_origin_first_promise_expansion:0 "Nội Chính"
 situation_origin_first_promise_prospecting:0 "Tài Nguyên Mới"
 situation_origin_first_promise_construction:1 "Công Trình Xây Dựng"
 situation_origin_first_promise_engineering:0 "Công Nghệ Mới"
 approach_allow_tooltip_promise:1 "Hoàn thành Nghị Trình §Y$council_agenda_origin_legendary_leader_name$§! để mở khóa Phương thức tiếp cận này."
 approach_situation_origin_promise_expansion_tt:0 "Chúng ta sẽ tập trung vào các vấn đề nội chính."
 approach_situation_origin_promise_prospecting_tt:0 "Chúng ta sẽ tập trung vào việc tìm kiếm các nguồn tài nguyên mới."
 approach_situation_origin_promise_construction_tt:1 "Chúng ta sẽ tập trung vào các công trình kỹ thuật xây dựng."
 approach_situation_origin_promise_engineering_tt:0 "Chúng ta sẽ tăng cường các nỗ lực nghiên cứu khoa học."
 situation_promise_outcome:0 "Phe đối lập cho chúng ta 40 năm để thực hiện lời hứa. Họ sẽ sớm nhận ra mình đã sai lầm đến mức nào khi dám hoài nghi chúng ta."
 situation_insight_stages:0 "§Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! đang nỗ lực hết mình để thực hiện lời hứa của [Owner.Ruler.GetHisHer]."
 paragon_origin_promise_chain_title:0 "$paragon_origin_promise$"
 paragon_origin_promise_chain_desc:2 "Chúng ta phải thực hiện trọn vẹn những lời đã hứa. Thần dân của [owner.GetName] đang trông cậy vào chúng ta để phát triển thành một đế chế du hành vũ trụ hùng mạnh trong vòng 40 năm tới. Chúng ta nên nỗ lực mở rộng quốc gia bằng cách §Gkiểm soát các hệ sao§!, §Gthuộc địa hóa các hành tinh§!, và - nếu chạm trán các đế chế khác - §Gký kết các hiệp ước phòng thủ§!.\n\nSau §G40 năm§!, §HĐặc Điểm $leader_trait_legendary_leader$§! của Người Cai Trị chúng ta sẽ được cải thiện cho mỗi §G15 điểm§! tiến độ mà chúng ta đã đạt được."
 promises_delivered:0 "Tiến Độ Hiện Tại"
 council_agenda_origin_legendary_leader_name:0 "Lời Hứa Thống Nhất"
 council_agenda_origin_legendary_leader_desc:0 "Kế hoạch 40 năm là yếu tố sống còn cho thành công của đế chế chúng ta. Bằng cách hợp lực dưới sự dẫn dắt của Minh Lãnh Tụ, chúng ta sẽ đạt được những thành tựu vĩ đại hơn nhiều so với việc hành động đơn độc."
 council_agenda_origin_legendary_leader_effect:0 "Thêm các Phương thức tiếp cận vào Tình huống §YLời Hứa Thống Nhất§! đồng thời tăng tiến độ của nó."
 origin_legendary_leader_finish:1 "$council_agenda_origin_legendary_leader_name$ $agenda_ref$"
 origin_legendary_leader_finish_desc:0 "$council_agenda_origin_legendary_leader_desc$"

 paragon.5005.name:0 "Xác Lập Thế Giới Mới"
 paragon.5005.desc:1 "Thuộc địa mới này là bước đi đầu tiên hướng tới việc thực hiện lời hứa của §Y[Root.Owner.Ruler.GetTitle]§!.\n\nTàu thuộc địa đã được chuyển đổi vĩnh viễn thành trụ sở hành chính của khu định cư mới. Công việc kết nối lõi lò phản ứng của nó với lưới điện đã bắt đầu để cung cấp năng lượng cho thuộc địa đang phát triển.\n\nKhi những người khai hoang đổ bộ với số lượng lớn, các khu nhà ở và nơi trú ẩn tạm thời đã được dựng lên quanh thân tàu khổng lồ trước đây. Những công trình này sẽ hình thành nền tảng của những gì một ngày nào đó sẽ là thành phố người [Root.Owner.GetSpeciesName] đầu tiên trên [Root.GetName]."

 paragon.5008.name:0 "Lời Hứa Hão Huyền" #Fail situation
 paragon.5008.desc:1 "$paragon.beginning.speech$\n\nTrong thông điệp tiếp theo, [Root.Owner.Ruler.GetName] kêu gọi người [Root.Owner.GetSpeciesNamePlural] gạt bỏ những nghi ngờ cũ kỹ và hướng tới tương lai. [Root.Owner.Ruler.GetSheHeCap] chỉ ra những điều vĩ đại mà chúng ta đã cùng nhau đạt được, cùng sự phi lý khi để những sai lầm trong quá khứ cản bước tiến bộ của chúng ta. Nếu [Root.Owner.GetName] đồng lòng sát cánh như một, không gì là chúng ta không thể vượt qua!\n\n$paragon.ending.speech$"
 paragon.5008.a:0 "Liệu họ có thấu hiểu?"
 paragon.5008.a.tt:1 "§LDù người dân vẫn ủng hộ §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§!, nhưng việc không thực hiện được lời hứa đã gây tổn hại nghiêm trọng đến lòng tin của họ.§!"
 paragon.5009.name:0 "Thực Hiện Lời Hứa" #Win situation
 paragon.5009.desc:1 "$paragon.beginning.speech$\n\nTrong thông điệp tiếp theo, [Root.Owner.Ruler.GetName] ngợi ca người [Root.Owner.GetSpeciesNamePlural] bằng những lời tán dương và câu chuyện về thành tựu của những cá nhân ưu tú - bao gồm cả của chính [Root.Owner.Ruler.GetHerHis]. [Root.Owner.Ruler.GetSheHeCap] tiếp tục liệt kê những gì chúng ta đã cùng nhau đạt được, hết thành công rực rỡ này đến thành công khác, hướng tới lời hứa về một tương lai còn vĩ đại hơn nữa.\n\n$paragon.ending.speech$"
 paragon.5009.a:1 "Tiến lên các vì sao, và giành lấy thắng lợi!"
 paragon.5009.a.tt:1 "§LChúng ta đã đáp ứng trọn vẹn mọi lời hứa và kỳ vọng của nhân dân. Quyền uy của vị minh quân chưa bao giờ vững chắc đến thế.§!"

 paragon.5010.name:0 "Sự Dẫn Dắt"
 paragon.5010.desc:1 "Những thành phố mới được xây dựng trên [Root.GetName] là một cảnh tượng kỳ vĩ đáng chiêm ngưỡng. Bằng lòng dũng cảm và sự kiên định, những người khai hoang đã phát triển mạnh mẽ trên một thế giới mới.\n\nCác công dân người [Root.Owner.GetSpeciesName] trên [Root.GetName] đã quyết định thể hiện lòng trung thành bằng cách dựng lên một đài tưởng niệm để vinh danh §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§!."
 paragon.5010.a:0 "Hãy để họ xây dựng nó."
 paragon.5010.a_tt:0 "Cư dân trên [Root.GetName] sẽ xây dựng một đài tưởng niệm dành tặng cho §Y[Root.Owner.Ruler.GetTitle]§! của họ."
 paragon.5010.b:0 "Cấp thêm kinh phí cho họ."
 paragon.5010.b_tt:0 "§Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! sẽ cấp thêm ngân sách để biến đài tưởng niệm thành một kiệt tác kiến trúc xa hoa."
 paragon.5010.c:0 "Tập trung vào điều gì đó thực tế hơn."
 paragon.5010.c_tt:0 "Cư dân trên [Root.GetName] sẽ sử dụng các nguồn lực đã gom góp được để xây dựng thêm các khu nhà ở và dịch vụ công ích."

 paragon.5011.name:0 "[Root.GetName] Ăn Mừng!"
 paragon.5011.desc:1 "§HMọi màn hình thuộc sở hữu nhà nước trên [Root.Owner.GetName] đều tạm dừng chương trình phát sóng theo lịch trình để truyền phát một thông điệp chính thức từ [Root.GetName]. §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! đứng trước một đài tưởng niệm còn phủ khăn che.§!\n\nHôm nay, chúng ta đã làm nên lịch sử. Chưa bao giờ giống loài chúng ta đạt được một thành tựu vĩ đại hơn thế. Với sự dẫn dắt của ta, với sức lao động chăm chỉ của các bạn, không trở ngại nào có thể cản bước chúng ta! Ngay lúc này đây, những người khai hoang trên [Root.GetName] đang xây dựng một đài tưởng niệm để kỷ niệm dịp trọng đại này. Tiến lên, hướng tới một tương lai huy hoàng!"
 paragon.5011.a:0 "Vinh quang!"
 paragon.5011.a.response:1 "§HĐám đông vỡ òa trong tiếng reo hò khi bức tượng của §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! được kéo màn che, sừng sững uy nghiêm giữa bầu trời thuộc địa.§!"

 paragon.5012.name:0 "[Root.Owner.GetName] Ăn Mừng!"
 paragon.5012.desc:1 "§HMọi màn hình thuộc sở hữu nhà nước trên [Root.Owner.GetName] đều tạm dừng lịch phát sóng để truyền đi thông điệp chính thức từ [Root.GetName]. §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! đứng trước một đài tưởng niệm phủ màn che.§!\n\nHôm nay, chúng ta đã làm nên lịch sử. Chưa bao giờ giống loài chúng ta đạt được thành tựu vĩ đại hơn. Với sự dẫn dắt của ta, cùng sự nỗ lực của các bạn, không trở ngại nào có thể ngăn lối chúng ta! Những người khai hoang trên [Root.GetName] muốn vinh danh ta, nhưng hôm nay, tất cả mọi người đều được vinh danh như nhau. Đoàn kết chúng ta toàn thắng!"
 paragon.5012.a:0 "Đoàn kết!"
 paragon.5012.a.response:1 "§HĐám đông vỡ òa trong tiếng reo hò khi tượng đài của §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§!, được bao quanh bởi vóc dáng anh dũng của những người [Root.Owner.GetSpeciesNamePlural] khác, được vén màn lộ diện. Họ đứng bên nhau đoàn kết, một quốc gia chung một chí hướng.§!"

 paragon.5013.name:0 "[Root.GetName] Được Tưởng Niệm!"
 paragon.5013.desc:1 "§HMọi màn hình thuộc sở hữu nhà nước trên [Root.Owner.GetName] đều tạm dừng chương trình phát sóng để truyền đi thông điệp chính thức từ [Root.GetName]. §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! đứng trước một đài tưởng niệm phủ màn che.§!\n\nHôm nay, chúng ta đã làm nên lịch sử. Chưa bao giờ giống loài chúng ta đạt được thành tựu vĩ đại hơn. Người dân trên [Root.GetName] muốn vinh danh ta hôm nay, nhưng chính họ mới là những người anh hùng thực sự của dân tộc chúng ta. Ta chỉ là một người đầy tớ của đất nước. Nhờ có các bạn, chúng ta đã tiến thêm một bước hướng tới tương lai tươi sáng hơn!"
 paragon.5013.a:0 "Thật khiêm nhường làm sao!"
 paragon.5013.a.response:1 "Đó là lý do tại sao ta từ chối để những người khai hoang kiêu hãnh này dựng tượng dưới danh nghĩa của ta. Thay vào đó, ngân sách sẽ được dùng để kiến thiết thành phố. Sự thịnh vượng đang đón chờ chúng ta!\n\n$paragon.ending.speech$"

 paragon.5014.name:0 "Hội Đồng Quá Tải"
 paragon.5014.desc:1 "Hội đồng đang bị quá tải.\n\nTrong khi §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! nắm giữ quyền lực tối thượng, khối lượng công việc hành chính điều hành một đế chế đang bành trướng đã vượt quá khả năng xử lý của các ủy viên. Cần có những cải cách cơ cấu khẩn cấp."
 paragon.5014.a:0 "Chúng ta sẽ vượt qua thử thách này."

 paragon.5110.name:0 "Phát Hiện Hải Tặc"
 paragon.5110.desc:0 "Chúng ta đã nhận được nhiều báo cáo về những toán cướp biển đang hoành hành quấy nhiễu các tuyến vận tải ở vùng biên ải. Chúng đã lợi dụng sự phân tâm của chúng ta để thiết lập căn cứ bí mật." #To call the system name use [paragon_origin_ships.GetName]
 paragon.5110.a:0 "Phái hải quân xuất trận."

 paragon.5120.name:0 "Mất Liên Lạc"
 paragon.5120.desc:1 "Một số người khai hoang và các đội nghiên cứu không gian sâu đang phàn nàn về sự gián đoạn liên lạc nghiêm trọng. Các mảng ăng-ten cũ kỹ không còn đáp ứng được cự ly khoảng cách ngày càng gia tăng giữa các thuộc địa."
 paragon.5120.a:0 "Bắt đầu công tác xây dựng trạm tiếp sóng."

 paragon.5121.name:0 "Trạm Kích Tín Hiệu"
 paragon.5121.desc:1 "Trạm kích sóng tín hiệu đã được kích hoạt. Những đường truyền đầu tiên gửi về từ các thuộc địa xa xôi vang lên vô cùng rõ ràng và thông suốt."
 paragon.5121.a:0 "Chúng ta đã lấy lại tiếng nói của mình."

 paragon.5130.name:0 "Công Nhân Đình Công"
 paragon.5130.desc:1 "Các công nhân làm việc ngoài không gian sâu đang tiến hành đình công nhằm phản đối điều kiện làm việc khắc nghiệt và chỉ tiêu sản xuất quá tải. Sản lượng khoáng sản và năng lượng đã sụt giảm nghiêm trọng."
 paragon.5130.a:0 "Mau giải quyết việc này!"

 paragon.5131.name:0 "Đại Cuộc Diễu Hành"
 paragon.5131.desc:1 "Cuộc diễu hành diễn ra tốt đẹp hơn dự kiến! Những hình ảnh về công dân reo hò ủng hộ §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã được ghi lại và công bố khắp [Owner.GetName] để thể hiện sự ủng hộ đối với [Root.Owner.Ruler.GetTitle] nhân từ. Mặc dù có một số vụ bạo loạn nhỏ được báo cáo trên khắp thủ đô, nhưng trật tự đã nhanh chóng được tái lập. Không có thương vong, và truyền thông nhà nước đã ca ngợi §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! vì phản ứng nhanh chóng của các lực lượng an ninh của chúng ta."
 paragon.5131.a:1 "Lũ bất đồng chính kiến chết tiệt này!"

 paragon.5140.name:0 "Bất Đồng Chính Kiến Trong Quân Đội"
 paragon.5140.desc:1 "Đã có những báo cáo về việc các sĩ quan quân đội cấp thấp tích cực bôi nhọ thanh danh của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!. Hành động này không thể không bị trừng phạt. Những kẻ chịu trách nhiệm ít nhất phải bị tước quân tịch khỏi quân đội."
 paragon.5140.a:0 "Mở cuộc điều tra ngay lập tức."

 paragon.5141.name:0 "Bắt Giữ Kẻ Bất Đồng Chính Kiến"
 paragon.5141.desc:1 "Những sĩ quan bất đồng chính kiến có âm mưu phản trắc đã bị bắt giữ trong một chiến dịch bí mật của lực lượng an ninh. Trật tự và kỷ luật trong quân đội đã được tái lập."
 paragon.5141.a:0 "Chúng ta phải luôn luôn cảnh giác."

 paragon.5150.name:0 "Nạn Con Ông Cháu Cha"
 paragon.5150.desc:1 "Hội đồng gần đây đã phải hứng chịu sự giám sát và chỉ trích nặng nề từ dư luận do tình trạng bổ nhiệm thân hữu tràn lan. Nhiều vị trí then chốt bị chiếm giữ bởi những kẻ bất tài có quan hệ gia đình với các quan chức cấp cao."
 paragon.5150.a:0 "Chúng ta cần thanh lọc hàng ngũ của mình."

 paragon.5151.name:0 "Thanh Lọc Hội Đồng"
 paragon.5151.desc:1 "Một ủy ban đặc biệt đã rà soát kỹ lưỡng các tầng lớp cấp cao của chính phủ, bãi nhiệm những kẻ thiếu năng lực và đưa những người có thực tài vào các vị trí xứng đáng."
 paragon.5151.a:0 "Tốt hơn nhiều rồi."

#EMPIRE PROBLEMS
 PARAGON_ORIGIN_SPIRITUALIST_PROJECT:0 "Trạm Tiếp Sóng Liên Lạc"
 PARAGON_ORIGIN_SPIRITUALIST_PROJECT_DESC:1 "Xây dựng một trạm tiếp sóng trong hệ sao thủ đô sẽ ngăn chặn tình trạng đứt gãy thông tin và củng cố sự gắn kết tinh thần trên toàn đế chế."
 PARAGON_ORIGIN_AUTHORITARIAN_PROJECT:0 "Đại Cuộc Diễu Hành"
 PARAGON_ORIGIN_AUTHORITARIAN_PROJECT_DESC:1 "Một cuộc diễu hành hoành tráng cùng ngày nghỉ lễ quốc gia sẽ đòi hỏi sự chuẩn bị công phu. Mọi thứ phải thật hoàn hảo nếu chúng ta muốn khơi dậy niềm kiêu hãnh của quốc gia."
 PARAGON_ORIGIN_PACIFIST_PROJECT:0 "Nhổ Tận Gốc Các Sĩ Quan Bất Đồng"
 PARAGON_ORIGIN_PACIFIST_PROJECT_DESC:0 "Những kẻ bất đồng chính kiến đang bén rễ bên trong quân đội của chúng ta, bôi nhọ §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! và mưu đồ chống lại chúng ta. Phải có hành động nhanh chóng và dứt khoát."
 PARAGON_ORIGIN_MATERIALIST_PROJECT:0 "Chấm Dứt Nạn Thân Hữu"
 PARAGON_ORIGIN_MATERIALIST_PROJECT_DESC:0 "Chấm dứt nạn gia đình trị trong hội đồng phải là ưu tiên hàng đầu của chúng ta, vì nó cản trở hầu như mọi việc chúng ta làm. Có thể mất một thời gian để dọn sạch mọi sự tham nhũng này, nhưng nhân dân đang trông cậy vào chúng ta."

 paragon.5020.name:0 "Những Gì Nằm Ở Phía Trước"
 paragon.5020.desc:1 "Bất chấp những công lao của §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§!, vẫn còn rất nhiều việc phải làm. Đế chế bao gồm các phe phái xung đột lẫn nhau, và người dân chỉ được đoàn kết thông qua nỗ lực không ngừng nghỉ của [owner.Ruler.GetTitle].\n\nMặc dù §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§! vốn không muốn thay đổi chính thể sau Đại Thống Nhất, nhưng một cách tiếp cận mới, trực tiếp hơn có thể giải quyết một số vấn đề này. Mặt khác, một quyết định như vậy có thể vấp phải sự phản đối đáng kể."
 paragon.5020.a:0 "Tuyên bố quyền cai trị Đế Chế!"
 paragon.5020.a.tt:1 "§LChỉ bằng cách trao quyền lực vô hạn cho [owner.Ruler.GetTitle], chúng ta mới có thể hy vọng thống trị các vì sao. Từ nay về sau, [owner.Ruler.GetTitle] sẽ có quyền lực tuyệt đối đối với hội đồng. Cầu mong sự cai trị của [owner.Ruler.GetHisHer] sẽ trường tồn và thịnh vượng!§!\nĐiều này sẽ củng cố quyền cai trị của §T[owner.Ruler.GetRegnalName]§!, nhưng có thể mang lại §Rhậu quả thảm khốc§! trong tương lai."
 paragon.5020.b:1 "Duy trì nguyên trạng."
 paragon.5020.b.tt:1 "§LNgười dân của chúng ta đã tin tưởng giao phó cho [owner.Ruler.GetTitle] dẫn dắt họ đến các vì sao, nhưng họ chưa bao giờ đồng ý với một danh hiệu hoàng gia hay sự cai trị đế quốc. Chiếm đoạt quyền lực như thế này sẽ là một hành vi bạo ngược.§! Việc giữ nguyên hiện trạng sẽ giúp ổn định đất nước."

 paragon.5021.name:0 "Tuyên Bố Đế Chế"
 paragon.5021.desc:1 "Tin tức lan truyền nhanh như cháy rừng. Sau vài chữ ký chính thức, một đại lễ đăng quang long trọng đã được phát sóng tới toàn thể quốc dân. Phần lớn người [Owner.GetSpeciesNamePlural] đều vui mừng vì §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! giờ đây sẽ toàn quyền kiểm soát đất nước.\n\nTrong khi không khí ngập tràn lễ hội, những câu hỏi và mối bất an chưa cất thành lời vẫn còn đó. Đế chế mới này rồi sẽ ra sao?"
 paragon.5021.a:1 "Quân đội phải đóng vai trò trung tâm." #MILITARIST
 paragon.5021.b:1 "Đức tin sẽ nâng đỡ chúng ta." #SPIRITUALIST
 paragon.5021.c:1 "Pháp luật và trật tự là tối thượng." #AUTHORITARIAN
 paragon.5021.d:1 "Quốc gia của chúng ta rộng mở với tất cả." #XENOPHILE
 paragon.5021.e:0 "Hòa bình sẽ mang lại cho chúng ta của cải và sự thịnh vượng." #PACIFIST
 paragon.5021.f:0 "Tiến bộ sẽ dẫn lối chúng ta tới sự vĩ đại." #MATERIALIST
 paragon.5021.g:0 "Đế Chế sẽ là tấm khiên vững chắc chống lại mối đe dọa ngoại tộc." #XENOPHOBE
 paragon.5021.h:1 "Chính phủ phải được duy trì ổn định." #GOV
 paragon.5022.name:0 "Hiệu Triệu Toàn Dân"
 paragon.5022.desc:1 "§HĐã đến lúc §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! hiệu triệu các thần dân trung thành của [Ruler.GetHerHis]. Các phương tiện truyền thông nhà nước đang phát sóng bài phát biểu của [Ruler.GetHerHis].§!\n\nHỡi đồng bào [Owner.GetSpeciesNamePlural]! Các bạn đã hướng về ta để tìm kiếm sự dẫn dắt trong thời khắc nguy nan, và ta cam đoan rằng lòng tin của các bạn sẽ được đền đáp xứng đáng. Quyền lực trao cho ta đi kèm với trách nhiệm to lớn, và ta thề sẽ tận tụy phụng sự quốc gia này cùng các bạn, những thần dân của ta. Sắc lệnh đầu tiên của ta trên cương vị hoàng đế là thành lập một trung tâm học thuật nơi những nhân tài ưu tú và sáng giá nhất sẽ được đào tạo để xây dựng một tương lai mà tất cả chúng ta đều có thể tự hào. Tiến lên các vì sao, và chiến thắng!"
 paragon.5022.a:1 "Tiến lên các vì sao!"

#DIPLOMATIC MILESTONES
 paragon.5023.name:0 "Gia Nhập Liên Bang"
 paragon.5023.desc:2 "$paragon.beginning.speech$\n\nThông điệp của [Root.Owner.Ruler.GetName] nhấn mạnh ngày hôm nay là một ngày vô cùng vinh quang! Việc thành lập Liên Bang này thực sự là một sự kiện đáng để ăn mừng. [Root.Owner.Ruler.GetHeSheCap] nói về những mối gắn kết chúng ta tạo dựng với các đồng minh, khẳng định rằng sự hợp tác với [your_ally.GetName] sẽ mở ra một kỷ nguyên mới. Một thời kỳ hoàng kim của sự vĩ đại và thịnh vượng!\n\n$paragon.ending.speech$"
 paragon.5023.a:1 "Liên Bang vạn tuế!"

 paragon.5025.name:0 "Vua Của Các Vị Vua"
 paragon.5025.desc:1 "$paragon.beginning.speech$\n\nBản thông cáo tập trung vào [your_ally.GetName], thế lực đã công nhận vị thế vượt trội của chúng ta và quy phục quyền cai trị cùng sự dẫn dắt của chúng ta! Sự sáng suốt và lòng tin của họ sẽ được đền đáp thỏa đáng, và chúng ta hy vọng rằng các quốc gia khác cũng sẽ đưa ra lựa chọn đúng đắn và quy phục.\n\n$paragon.ending.speech$"
 paragon.5025.a:0 "Chúng ta sinh ra để thống trị."
 paragon.5027.name:0 "Nghiền Nát Quân Thù!"
 paragon.5027.desc:1 "$paragon.beginning.speech$\n\nToàn dân hân hoan khi tin tức về bản hiệp ước hòa bình được ký kết cùng những nhượng bộ to lớn mà kẻ thù buộc phải chấp nhận vừa bay về. Chúng ta là nhân chứng cho thắng lợi rực rỡ dưới sự dẫn dắt của Minh Lãnh Tụ!\n\n$paragon.ending.speech$"
 paragon.5027.a:0 "Chiến thắng!"

 paragon.5029.name:0 "Kết Cục Ảm Đạm"
 paragon.5029.desc:1 "$paragon.beginning.speech$\n\nHôm nay là một ngày u ám đối với [Owner.GetName]. Sự tàn bạo của quân xâm lược hiện rõ trên luồng tin tức, khi [Ruler.GetName] nhấn mạnh tính tất yếu của việc đồng lòng sát cánh trong những thời khắc tăm tối này. §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! cam kết sẽ báo thù cho cuộc tấn công vô cớ này và đảm bảo biên giới của chúng ta sẽ mãi mãi an toàn trước mọi hiểm họa ngoại bang.\n\n$paragon.ending.speech$"
 paragon.5029.a:0 "Không bao giờ tái diễn!"

 paragon.5033.name:0 "Địa Vị Chư Hầu"
 paragon.5033.desc:1 "$paragon.beginning.speech$\n\n[Root.Owner.Ruler.GetName] im lặng. Luồng tin tức chiếu cảnh ký kết hiệp ước chư hầu của [Owner.GetName]. Bất chấp lòng tin của chúng ta vào sự cai trị của Minh Lãnh Tụ, thời khắc này biểu thị một bước thụt lùi không thể chối cãi đối với nền văn minh của chúng ta.\n\n$paragon.ending.speech$"
 paragon.5033.a:0 "Chúng ta chỉ đang lợi dụng chúng."

 paragon.5038.name:0 "Những Người Bảo Vệ Thiên Hà"
 paragon.5038.desc:1 "$paragon.beginning.speech$\n\nHôm nay là một ngày định mệnh. [Root.Owner.Ruler.GetName] đứng hiên ngang đầy tự hào khi [Root.Owner.Ruler.GetSheHe] tin tức được loan báo: Cộng Đồng Ngân Hà đã bầu chọn chúng ta đảm nhận vị trí Người Giám Hộ tối cao. Họ đã nhận ra rằng chỉ có chúng ta mới có thể đảm bảo an toàn cho thiên hà này. Chúng ta đã được trao quyền lực to lớn, và bổn phận của chúng ta không chỉ là đáp ứng, mà còn phải vượt xa mọi kỳ vọng.\n\n$paragon.ending.speech$"
 paragon.5038.a:0 "Vì Thiên Hà!"

 paragon.5039.name:0 "Vinh Dự Cao Nhất"
 paragon.5039.desc:1 "$paragon.beginning.speech$\n\nHôm nay là ngày đại thắng của chúng ta! Thượng Viện Ngân Hà đã bổ nhiệm [Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName] làm Hoàng Đế của Đế Quốc Thiên Hà. Trong nghi lễ chào đón, [Root.Owner.Ruler.GetName] thề sẽ đưa thiên hà đã biết cùng muôn dân của nó tiến vào một kỷ nguyên thịnh vượng mới - từ nay, cho đến muôn đời muôn kiếp!\n\n$paragon.ending.speech$"
 paragon.5039.a:0 "Đế Quốc Trường Tồn!"

# Forgotten
 paragon.5050.name:1 "Làn Sóng Đối Lập Gia Tăng"
 paragon.5050.desc:1 "Các đối thủ tư tưởng của chúng ta đã thành lập một khối chính trị hùng mạnh. Họ đã kêu gọi những người ủng hộ tập hợp biểu tình ôn hòa chống lại những gì họ coi là những thay đổi đơn phương do §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! ban hành.\n\nHọ lập luận rằng chúng ta đã đi chệch khỏi con đường đã định ra sau Đại Thống Nhất, và kêu gọi §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! bãi bỏ một số cải cách."
 paragon.5050.a:1 "Sao chúng dám nghi ngờ [Ruler.GetHimHer]?"

 paragon_origin_forgotten:1 "Bất Đồng Chính Kiến Dâng Cao"
 paragon_origin_forgotten_type:1 "$paragon_origin_forgotten$"
 paragon_origin_forgotten_desc:2 "Những người biểu tình đang tụ tập trước các tòa nhà chính phủ đòi hỏi §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§! phải lắng nghe những bất bình của họ. Hầu hết họ là những người trẻ tuổi, nhưng trong số các thủ lĩnh của họ có cả những cựu binh thời Đại Thống Nhất. Việc phớt lờ các yêu sách của họ có thể là một quyết định thiếu khôn ngoan."
 paragon_origin_forgotten_monthly_change_tooltip:1 "Các cuộc biểu tình chưa phải là một nỗ lực có phối hợp chặt chẽ, và các biến cố mới sẽ định hình tiến trình của tình huống này."
 situation_origin_forgotten_propaganda:1 "Sử Dụng Tuyên Truyền"
 situation_origin_forgotten_balanced:1 "Tìm Kiếm Thỏa Hiệp"
 situation_origin_forgotten_crackdown:1 "Trấn Áp Thẳng Tay"
 approach_situation_origin_forgotten_propaganda_tt:1 "Chúng ta có thể sử dụng các kênh tuyên truyền để làm suy yếu uy tín của phe đối lập và củng cố niềm tin của dân chúng."
 approach_situation_origin_forgotten_balanced_tt:1 "Bằng cách lắng nghe và đối thoại với các nhóm ôn hòa hơn, chúng ta có thể làm giảm bớt căng thẳng mà không cần dùng đến bạo lực."
 approach_situation_origin_forgotten_crackdown_tt:1 "Chúng ta không thể dung thứ cho sự bất đồng chính kiến. Chúng ta phải nghiền nát những kẻ dám thách thức quyền uy của nhà nước."

 paragon.forgotten.a:0 "Phản bác những cáo buộc này."
 paragon.forgotten.b:0 "Tăng cường ngân sách an ninh."
 paragon.forgotten.c:0 "Khiến những kẻ bất đồng phải câm lặng."
 paragon.5054.name:0 "Những Lời Buộc Tội"
 paragon.5054.desc:1 "Một nhóm bí mật tự xưng là Kẻ Bị Lãng Quên đã công bố một bản tuyên ngôn nêu rõ vô số tội ác được cho là do §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! gây ra trong Chiến Tranh Thống Nhất. Họ cho rằng vị lãnh đạo đáng kính của chúng ta chẳng qua chỉ là một kẻ hiếu chiến tàn nhẫn đã đàn áp những tiếng nói bất đồng hợp pháp."
 paragon.5055.name:1 "Cái Giá Của Sự Thật"
 paragon.5055.desc:1 "Sau khi xem xét các bằng chứng, có vẻ như §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! quả thực đã nói dối hoặc ít nhất là che giấu sự thật trước hội đồng và đông đảo quần chúng. [Owner.Ruler.GetHeShe] đã ký kết nhiều hợp đồng với các bên liên quan quyền lực, hứa hẹn nhiều điều mà [Owner.Ruler.GetHeShe] không thể thực hiện được trên thực tế.\n\nNgày nay, Kẻ Bị Lãng Quên đã tự biến mình thành tiếng nói của tất cả những ai bị [Owner.Ruler.GetTitle] lừa dối và đang kêu gọi chính phủ chuyển giao lại quyền lực cho hội đồng và nhân dân."
 paragon.5056.name:1 "Công Kích Cá Nhân"
 paragon.5056.desc:1 "Trong nỗ lực bôi nhọ §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§!, Kẻ Bị Lãng Quên đã ngụy tạo một loạt báo cáo phỉ báng và các bản ghi hình ba chiều giả mạo. Cơ quan an ninh nhà nước đã vạch trần những tuyên bố này, nhưng hạt mầm nghi ngờ đã bị gieo vào tâm trí của một số công dân."
 paragon.5057.name:1 "Tức Nước Vỡ Bờ"
 paragon.5057.desc:1 "Tình hình chính trị đã leo thang vượt tầm kiểm soát. Kẻ Bị Lãng Quên cùng những kẻ đồng tình đã tổ chức các cuộc tuần hành rầm rộ bên ngoài các cơ quan chính phủ, đòi §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! phải từ chức ngay lập tức. Chúng ta phải hành động trước khi bất ổn biến thành một cuộc bạo loạn công khai."
 paragon.5057.a:1 "Bắt giữ bọn chúng!"
 paragon.5057.a.tt:1 "§LChúng ta biết nơi ở của những kẻ gây rối này. Chúng ta có thể đột kích vào sào huyệt của chúng và tống giam các thủ lĩnh.§!"
 paragon.5057.b:1 "Hãy kiềm chế."
 paragon.5057.b.tt:1 "§LBằng cách từ chối hạ mình xuống ngang hàng với chúng, chúng ta sẽ cho thiên hạ thấy sự độ lượng và tính chính danh của bậc minh quân.§!"
 paragon.5057.c:1 "Tiêu diệt lũ phản bội!"
 paragon.5057.c.tt:1 "§LNhững kẻ bất đồng chính kiến là mối đe dọa sống còn đối với quốc gia cần phải bị loại bỏ bằng bất cứ giá nào.§!"
 paragon.5058.name:1 "Gánh Nặng Quyền Lực"
 paragon.5058.desc:1 "Dưới áp lực dữ dội, §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! bắt đầu bộc lộ những dấu hiệu căng thẳng tột độ và chứng hoang tưởng. [Owner.Ruler.GetHeSheCap] nhìn thấy những kẻ phản bội ẩn nấp trong từng bóng tối, nghi ngờ lòng trung thành của ngay cả những cố vấn thân cận nhất của [Owner.Ruler.GetHisHer]."
 paragon.5058.a:1 "Chúng ta sẽ học cách sống chung với điều đó."
 paragon.5059.name:1 "Nhà Lãnh Đạo Tận Tụy"
 paragon.5059.desc:2 "§Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! đã làm việc vô cùng chăm chỉ để trở thành một nhà lãnh đạo tốt hơn. Sự tận tụy đổi mới của [Owner.Ruler.GetHisHerCap] đã được hội đồng ghi nhận."
 paragon.5059.a:1 "Trí tuệ của [Owner.Ruler.GetHisHerCap] là vô biên!"
 paragon.5060.name:1 "Trật Tự Được Tái Lập"
 paragon.5060.desc.imprisioned:2 "$paragon.beginning.speech$\n\nXã hội đang trượt dài vào hỗn loạn, nhưng §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! đã can thiệp kịp thời để lập lại trật tự! Những kẻ cầm đầu của Kẻ Bị Lãng Quên đã bị bắt giữ và các tổ chức bất hợp pháp của chúng đã bị giải thể. Thượng tôn pháp luật đã chiến thắng!\n\n$paragon.ending.speech$"
 paragon.5060.desc.negotiated:1 "$paragon.beginning.speech$\n\nTrong thời khắc xung đột, sức mạnh thực sự nằm ở sự đối thoại. §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! đã đàm phán thành công với các phe phái ôn hòa của Kẻ Bị Lãng Quên. Bằng cách nhượng bộ những điều khoản hiến pháp hợp lý, hòa bình và sự đoàn kết đã được bảo tồn!\n\n$paragon.ending.speech$"
 paragon.5060.desc.destroyed:1 "$paragon.beginning.speech$\n\nHôm nay đánh dấu một thắng lợi vĩ đại của [Owner.GetName]! Những kẻ xúi giục phản trắc của Kẻ Bị Lãng Quên đã bị các lực lượng an ninh của chúng ta tiêu diệt tận gốc. Âm mưu hèn hạ chống lại nền văn minh vĩ đại của chúng ta đã chuốc lấy thất bại thảm hại!\n\n$paragon.ending.speech$"
 paragon.5060.a:1 "Chúng ta cần một nhà lãnh đạo mạnh mẽ hơn!"
 paragon.5060.a.tt:1 "§LCác sự kiện gần đây đã chứng minh rằng chỉ có sự cai trị sáng suốt của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! mới có thể mang lại hòa bình và thịnh vượng cho xã hội chúng ta. Chúng ta cần củng cố thêm nhiều quyền lực hơn vào tay nhà lãnh đạo.§!"
 paragon.5060.b:0 "Chúng ta cần một chính phủ hiệu quả!"
 paragon.5060.b.tt:0 "§LCác sự kiện gần đây đã chứng minh rằng sự cai trị của một chính phủ vững mạnh là cần thiết để vượt qua những tình thế tiến thoái lưỡng nan như vậy trong tương lai. Chúng ta cần trao thêm quyền lực cho hội đồng.\n§!$paragon.leader.growth.negative$"

# Reformists and Mad Rule
 paragon.5061.name:1 "Bi Kịch Giáng Xuống"
 paragon.5061.desc:1 "§Y[Owner.GetHeirTitle] [Owner.GetHeirName]§! đã qua đời. Chúng ta vẫn chưa xác định được nguyên nhân cái chết, nhưng các báo cáo sơ bộ cho thấy nguyên nhân tự nhiên. [Ruler.GetRegnalName] đã bị giáng một đòn nặng nề trước sự mất mát của hậu duệ [Ruler.GetHisHer]. Một thời kỳ quốc tang đã được ban bố và chúng ta chờ đợi kết quả điều tra đầy đủ về nguyên nhân cái chết của người kế vị."

 paragon.5062.name:1 "Nỗi Đau Làm Mờ Mắt"
 paragon.5062.desc:1 "Bất chấp mọi bằng chứng đều chỉ ra một cái chết tự nhiên, §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! từ chối chấp nhận điều đó. Cái chết của người kế vị [Ruler.GetHisHer] đã tác động sâu sắc đến [Ruler.GetHimHer], và các mệnh lệnh đã được gửi đi khắp các lãnh thổ của chúng ta. Những kẻ chịu trách nhiệm cho vụ ám sát hèn hạ này phải bị tìm ra. Lực lượng an ninh đang tiến hành các đợt càn quét để nhổ tận gốc những kẻ bất đồng chính kiến.\n\nMức độ bạo lực đi kèm các vụ bắt giữ này đã gây sốc cho nhiều công dân của chúng ta. Các cuộc biểu tình lên án sự lạm quyền và đòi hỏi một làn sóng cải cách chính phủ mới lại bùng phát một lần nữa. Lần đầu tiên trong lịch sử của chúng ta, đa số dân số của một hành tinh đã nổi dậy chống lại sự cai trị của [Ruler.GetTitle]."
 paragon.5062.a:0 "Thật kinh hoàng!"
 paragon.5062.a.tt:0 "Cho phép kích hoạt $origin_delusional_tyrant_finish$"
 origin_egalitarian_refuse:0 "§RNhững người [Root.GetSpeciesNamePlural] theo chủ nghĩa bình đẳng này từ chối rời khỏi [Root.Planet.GetName]!§!\n\n"

 paragon.5063.name:0 "Phái Cải Cách Tan Rã"
 paragon.5063.death.desc:0 "Sau cái chết của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, sự ủng hộ dành cho Phái Cải Cách đã suy giảm nhanh chóng. Gác lại những bất đồng tư tưởng, đại diện của nhóm đã tham dự lễ quốc tang. Dù ngày hôm nay bị bao phủ bởi đau thương, nhưng đó cũng là khoảnh khắc của sự đoàn kết - lời nhắc nhở về những giá trị mà [Root.Owner.GetName] đại diện."
 paragon.5063.norebel.desc:0 "Dù là nhờ việc sử dụng tài nguyên khôn khéo của chúng ta hay nhờ áp dụng các hình phạt nghiêm khắc, các hành tinh nổi loạn không còn là vấn đề nan giải nữa. Một lần nữa chúng ta lại đứng lên đoàn kết, với dân chúng tập trung vào tăng trưởng thay vì nội đấu. §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã ban sắc lệnh biến ngày hôm nay thành một ngày lễ kỷ niệm đặc biệt cho các thế hệ mai sau."
 paragon.5063.death.a:0 "Đoàn kết trong cái chết."
 paragon.5063.norebel.b:0 "Lại đoàn kết một lần nữa."

 paragon_origin_reformists_struggle:1 "Yêu Sách Của Phái Cải Cách"
 paragon_origin_reformists_struggle_type:1 "$paragon_origin_reformists_struggle$"
 paragon_origin_reformists_struggle_desc:1 "Dưới vỏ bọc tự do, những kẻ mị dân thuộc Phái Cải Cách đang tìm cách phá hoại đất nước! Khi các cuộc xung đột bạo lực bùng nổ trên khắp lãnh thổ của chúng ta, những lời dối trá của chúng đã thuyết phục nhiều người dân quay lưng lại với chúng ta. Chúng cho rằng §Y[Owner.Ruler.GetTitle] [Owner.Ruler.GetRegnalName]§! yếu đuối, tàn bạo và bất tài, nhưng chúng ta sẽ cho chúng thấy sự thật!"
 situation_paragon_origin_reformists_struggle_harsh:1 "Duy Trì Kiểm Soát"
 approach_situation_paragon_origin_reformists_struggle_harsh_tt:1 "Một cuộc trấn áp tàn bạo nhắm vào tất cả các sào huyệt đã biết của Phái Cải Cách sẽ giúp lập lại trật tự cho quốc gia.\nĐể chấm dứt tình huống này, hãy hoàn thành Nghị Trình §Y$council_agenda_origin_delusional_tyrant_name$§!."
 situation_paragon_origin_reformists_struggle_accept: "Kêu Gọi Đàm Phán"
 approach_situation_paragon_origin_reformists_struggle_accept_tt: "Chiến đấu chống lại thường dân là điều không thể chấp nhận được. Chúng ta sẽ thúc đẩy tiến trình hòa bình, kêu gọi ngừng bắn và mời Phái Cải Cách vào bàn đàm phán. Hy vọng điều này sẽ hạn chế được bạo lực."
 approach_allow_tooltip_reformists_struggle_accept: "Phái Cải Cách sẽ không bao giờ đồng ý đàm phán với một kẻ bạo chúa."
 paragon_origin_hunt:1 "Thực Lực Phái Cải Cách"
 paragon_origin_reformists_killed:0 "Tiêu Diệt Đợt Cải Cách Đầu Tiên"
 paragon_origin_reformists_alive:0 "Đàm Phán Đợt Cải Cách Đầu Tiên"
 situation_reformists_struggle_1:0 "Phái Cải Cách đang áp đảo các tiền đồn phòng thủ lỏng lẻo của chúng ta, và lực lượng trung thành đang chật vật để cầm chân chúng."
 situation_reformists_struggle_2:1 "Phái Cải Cách đang bắt đầu giành được ưu thế trong một số cuộc giao tranh, nhưng quyền lực vẫn nằm chắc trong tay chúng ta."
 situation_reformists_struggle_3:1 "Chúng ta đang nắm giữ lợi thế nhẹ trước phe Cải Cách phản loạn, nhưng cán cân quyền lực có thể nghiêng về bất kỳ bên nào."
 paragon_origin_reformists_struggle_monthly_change_tooltip:0 "Các dân quân phe Cải Cách liên tục quấy nhiễu lực lượng an ninh trung thành."
 situation_paragon_origin_reformists_struggle_complete:2 "Bằng cách này hay cách khác, cuộc xung đột này phải chấm dứt. Các quyết định của chúng ta lúc này sẽ ảnh hưởng đến chiều hướng diễn biến của bất kỳ cuộc đàm phán nào trong tương lai."
 decision_paragon_origin_subdue_reformists:1 "Đột Kích Phe Cải Cách"
 decision_paragon_origin_subdue_reformists_desc:1 "Dân chủ là một căn bệnh cần được cứu chữa. Các sĩ quan an ninh của chúng ta sẽ đột kích những nơi ẩn náu của phe Cải Cách và đập tan các mưu đồ của chúng. Thương vong dân sự là điều khó tránh khỏi."
 decision_paragon_origin_subdue_reformists_tt:1 "Thao tác này sẽ loại bỏ §G4§! Tiến độ khỏi Tình thế §YYêu Cầu Của Phe Cải Cách§!.\nCó 50% cơ hội xóa bỏ bổ trợ §YXu Hướng Dân Chủ§! khỏi hành tinh nếu không có Pop Bình quyền.\nThao tác này sẽ §Rlàm suy giảm§! §YĐặc tính Minh Lãnh Tụ§! của §Y[owner.Ruler.GetTitle] [owner.Ruler.GetRegnalName]§!."
 council_agenda_origin_delusional_tyrant_name:0 "Trấn Áp Toàn Diện"
 council_agenda_origin_delusional_tyrant_desc:0 "Bằng cách bắt giữ các thủ lĩnh của chúng trong một chiến dịch truy quét toàn đế quốc, chúng ta có thể làm tê liệt phe Cải Cách và buộc chúng phải ngồi vào bàn đàm phán theo các điều kiện của chúng ta."
 council_agenda_origin_delusional_tyrant_effect:0 "Kết thúc Tình thế §YYêu Cầu Của Phe Cải Cách§! bằng cách bắt giữ các thủ lĩnh phe Cải Cách."
 origin_delusional_tyrant_finish:0 "$council_agenda_origin_delusional_tyrant_name$ $agenda_ref$"
 origin_delusional_tyrant_finish_desc:0 "$council_agenda_origin_delusional_tyrant_desc$"

 paragon.5064.name:1 "Mùi Phản Trắc"
 paragon.5064.desc:1 "§Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! đã phát hiện một trong các lãnh đạo của chúng ta đang âm mưu chống lại chính phủ! Biện pháp thỏa đáng là xử tử kẻ phản bội, nhưng bằng chứng lại quá ít ỏi."
 paragon.5064.a:1 "Chúng ta cần thêm bằng chứng."
 paragon.5064.b:0 "Xử tử kẻ phản bội!"
 paragon.5065.name:1 "Tổ Khủng Bố"
 paragon.5065.desc:1 "§Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! đã hạ lệnh tiến hành một cuộc thanh trừng quy mô lớn trên một hành tinh của chúng ta. Rõ ràng có một cứ điểm của phe Cải Cách ở đó, nhưng chưa có bằng chứng chắc chắn nào được đưa ra. Liệu chúng ta có thực sự mạo hiểm tính mạng của những công dân trung thành chỉ vì một linh cảm?"
 paragon.5065.a:0 "Hủy bỏ chiến dịch."
 paragon.5065.b:0 "Tiến hành chiến dịch."
 paragon.5070.name:0 "Phát Hiện Hải Tặc"
 paragon.5070.desc:1 "Một trong các tế bào nghi thuộc phe Cải Cách đã liên kết với một nhóm hải tặc địa phương. Dù chúng không phải mối đe dọa nghiêm trọng, chúng vẫn có thể phá vỡ các hoạt động và tuyến thương mại của chúng ta trong tinh khu."
 paragon.5071.name:0 "Viện Trợ Nước Ngoài"
 paragon.5071.desc:1 "Một công dân xuất chúng từ [event_target:friendly_nation] mong muốn giúp đỡ chúng ta trong cuộc đấu tranh nội bộ này. Lời chúc tốt đẹp nhất của họ được gửi kèm một chuyến hàng hợp kim để hỗ trợ chúng ta. Dường như họ muốn cải thiện quan hệ giữa đôi bên, nhưng §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! nghi ngờ đây là một mánh khóe nhằm thiết lập các tuyến tiếp tế cho phong trào bất đồng chính kiến."
 paragon.5071.a:0 "Gửi lời cảm ơn của chúng ta."
 paragon.5071.b:0 "Đây là một cái bẫy!"
 paragon.5072.name:0 "Đột Kích Tế Bào"
 paragon.5072.desc:1 "Cơ quan an ninh của chúng ta đã thành công săn lùng và triệt phá một tế bào của phe Cải Cách. Chiến dịch thành công rõ rệt với tổn thất nhân mạng tối thiểu và không có thương vong dân sự."
 paragon.5073.name:1 "Bại Lộ Tung Tích"
 paragon.5073.desc:1 "Cơ quan an ninh của chúng ta đã lần ra một tế bào phe Cải Cách, nhưng chúng đã gài chất nổ toàn bộ khu nhà. Khi các đặc vụ của chúng ta đột kích sào huyệt, chúng đã kích nổ khối thuốc nổ, khiến nhiều người thiệt mạng."
 paragon.5074.name:1 "Đọ Súng Dữ Dội"
 paragon.5074.desc:1 "Nhiều thường dân đã bị thương trong một loạt các vụ đọ súng dữ dội giữa lực lượng của chúng ta và phe Cải Cách. Chúng ta đã cử lực lượng ứng cứu khẩn cấp đến chăm sóc những người bị thương."
 paragon.5075.name:0 "Phe Trung Thành Tuần Hành"
 paragon.5075.desc:1 "Những người ủng hộ trung thành của chúng ta đã tổ chức một cuộc tuần hành để hậu thuẫn §Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§!! Chúng ta rõ ràng nhận được sự ủng hộ của nhân dân trong cuộc đấu tranh này!"
 paragon.5090.name:1 "Phe Cải Cách Biểu Tình"
 paragon.5090.desc:1 "Bộ máy tuyên truyền của phe Cải Cách đã dẫn đầu một chiến dịch tin giả trên một trong các hành tinh của chúng ta. Lực lượng trung thành đang hết sức cảnh giác để kiểm soát tình hình, nhưng hàng ngũ người biểu tình vẫn tiếp tục gia tăng thực lực."
 paragon.5095.name:0 "Bắt Giữ Phe Cải Cách"
 paragon.5095.desc:0 "Nhờ sự nỗ lực làm việc của Hội đồng, các thủ lĩnh phe Cải Cách đã nhanh chóng bị sa lưới. Giờ đây số phận của chúng nằm trong tay §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!, nhưng chúng có rất nhiều người ủng hộ trong dân chúng, và sẽ là khôn ngoan nếu đàm phán một kết quả phù hợp với cả hai bên — dẫu cho phải dựa trên các điều kiện của chúng ta."
 paragon.5095.a:0 "Hãy nghe xem các điều kiện của họ."

 paragon.5200.name:1 "Chuẩn Bị Đàm Phán"
 paragon.5200.desc:1 "Sau nhiều tháng xung đột, đã đến lúc giải quyết những bất đồng và thảo luận xem chúng ta có thể chấm dứt cuộc nổi dậy vô lý này bằng cách nào. §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đã kêu gọi một lệnh ngừng bắn để đàm phán với phe Cải Cách. Mọi hành động thù địch đã tạm dừng, trong khi mọi người đều hồi hộp chờ đợi kết quả của các cuộc đàm phán."
 paragon.5201.name:1 "Bài Diễn Văn"
 paragon.5201.desc:2 "$paragon.beginning.speech$\n\nHỡi đồng bào [Owner.GetSpeciesNamePlural]! Hôm nay, ta muốn các bạn biết rằng lòng ta tràn ngập niềm tự hào. Với tư cách là một dân tộc, chúng ta đã cùng nhau đứng lên và vượt qua mọi bất đồng, tiến bước vào cõi vô định, xây dựng những thế giới mới và vươn tới những đỉnh cao mới của trí tuệ loài người.\n\nTa muốn ghi nhận sự hy sinh của các bạn...\n\nTa muốn...\n\n§H§Y[Root.Owner.Ruler.GetTitle] [Root.Owner.Ruler.GetRegnalName]§! bỗng loạng choạng khuất khỏi tầm nhìn.§!"
 paragon.5201.a:1 "Chuyện gì đang xảy ra vậy?"
 paragon.5202.name:0 "Gục Ngã"
 paragon.5202.regular:1 "Tin tức chẳng mấy chốc đã lan truyền khắp dân chúng; §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đang hấp hối. Dù nguyên nhân của căn bệnh bí ẩn này vẫn chưa rõ, nó dường như không gây tử vong ngay lập tức.\n\nHiện tại, §Y[Ruler.GetRegnalName]§! vẫn có thể duy trì cương vị của mình. Tuy nhiên, sẽ cần đến các phương pháp phi chính thống để kéo dài mạng sống của lãnh tụ chúng ta thêm bất kỳ khoảng thời gian đáng kể nào."
 paragon.5202.synth:1 "Tin tức chẳng mấy chốc đã lan truyền khắp dân chúng; mạng lưới thần kinh của §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! đang gặp trục trặc nghiêm trọng. Dù nguyên nhân của lỗi bí ẩn này khiến những bộ óc thông tuệ nhất của chúng ta bó tay, nó không gây tử vong ngay lập tức.\n\nHiện tại, §Y[Ruler.GetRegnalName]§! vẫn có thể duy trì cương vị của mình. Tuy nhiên, sẽ cần đến các phương pháp phi chính thống để sửa chữa và kéo dài khả năng vận hành của lãnh tụ chúng ta thêm bất kỳ khoảng thời gian đáng kể nào."
 paragon.5202.a:2 "Hẳn phải có điều gì đó chúng ta có thể làm."
 paragon.5202.a.tt:1 "§LChúng ta sẽ khám phá mọi con đường có thể để cứu sống [Ruler.GetName].§!"
 paragon.5202.b:2 "Hãy để [Ruler.GetTitle] được an nghỉ xứng đáng."
 paragon.5202.b.tooltip:1 "§Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ qua đời."

 paragon.5210.name:1 "Ngã Rẽ Định Mệnh"
 paragon.5210.desc:1 "Đã đến lúc §Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! trở lại nắm giữ bánh lái của quốc gia. Được ban phước với di sản của $leader_trait_legendary_leader$, [Ruler.GetName] vẫn là một nhân vật đầy lôi cuốn. Tuy nhiên, với thực lực ngày càng lớn mạnh của phe Cải Cách và một cuộc nội chiến toàn diện đang cận kề, [Ruler.GetTitle] đã đưa ra lời kêu gọi đàm phán.\n\n[Ruler.GetName] báo cáo rằng các cuộc đàm phán ban đầu diễn ra căng thẳng. Đại diện từ khắp các ngõ ngách của [Owner.GetName] đã đưa ra yêu sách của mình trước khi lắng nghe tuyên bố chính thức của [Ruler.GetTitle], trong đó liệt kê các nhượng bộ mà chúng ta có thể chấp nhận."
 paragon.5210.a:1 "Chúng ta sẽ cho họ thứ họ muốn."
 paragon.5210.b:1 "Chúng ta sẽ không đưa ra bất kỳ nhượng bộ nào."
 paragon.5210.b.tt:1 "Các hành tinh có bổ trợ §YXu Hướng Dân Chủ§! sẽ nổi loạn."
 paragon.5210.c:1 "Chúng thật ngu xuẩn khi tin vào những cuộc đàm phán này."
 paragon.5210.c.tt:0 "Mọi pop có Tư tưởng Bình quyền sẽ bị xử tử!\n$paragon.leader.delusion.negative$"
 paragon.5210.d:0 "Đủ rồi! Lãnh tụ đã làm chúng ta thất vọng!"
 paragon.5210.d.tt:2 "§Y[Ruler.GetTitle] [Ruler.GetRegnalName]§! sẽ bị ám sát.\n§RQuốc gia sẽ rạn nứt và một cuộc nội chiến sẽ nổ ra.§!\n§LQuốc gia đang trong cảnh hỗn loạn. Nhân dân đang khao khát thắp lên ngọn lửa cách mạng. Chúng ta đã nghe thấy tiếng gọi của họ. Mọi bạo chúa đều phải bị truất ngôi!§!"
 paragon.5210.e:0 "Chúng ta nên thống trị thiên hà, một mình chúng ta!"

 paragon.5211.name:0 "Tiến Lên Chiến Thắng!"
 paragon.5211.desc:1 "Xiềng xích của chúng ta đã gãy vụn! Mọi kẻ áp bức và bạo chúa đều đã bị hạ bệ. Chúng ta có thể là ngọn lửa châm ngòi cuộc chiến này, nhưng mọi việc chúng ta làm đều vì lợi ích của nhân dân. Chúng ta sẽ vượt qua tất cả!"
 paragon.5211.a:0 "Chúng ta chiến đấu để bảo vệ con đường của mình!"
 paragon.5211.b:0 "Chúng ta chiến đấu để thay đổi con đường của mình!"
 paragon.5213.name:0 "Nội Chiến Chấm Dứt"
 paragon.5213.desc:1 "Khi tàn dư của cuộc nội chiến lụi tàn, một xã hội mới đang trỗi dậy từ tro tàn, sẵn sàng mang ngọn lửa cách mạng vươn ra các vì sao."
 paragon.5213.a:0 "Chúng ta sẽ tái thiết những gì đã bị phá hủy."
 paragon.5213.b:0 "Chúng ta cần bảo vệ xã hội của mình!"
 paragon.5213.c:1 "Nội chiến đã tôi luyện chúng ta."
 paragon.5213.d:1 "Chúng ta phải ưu tiên hòa bình và thịnh vượng."
 paragon.5213.e:1 "Từ trong tàn phá, chúng ta sẽ vươn lên."
 paragon.5213.f:1 "Chúng ta phải tìm kiếm sự khai sáng."

 psionic.trait.b:0 "\nHải Đăng Linh Năng"
