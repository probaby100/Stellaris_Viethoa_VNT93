 wayward_pilgrim_05:0 "Người hành hương bị từ chối"
 wayward_pilgrim_06:0 "Vinh quang của quốc độ thiêng liêng"
 wayward_pilgrim_07:0 "Cơn bão ngang ngạnh"

 enclave.6000.name:0 "Sự xuất hiện kỳ lạ"
 enclave.6000.a.desc:0 "Sự phát triển kỳ lạ trên [Root.GetName]: sau khi băng qua đường hầm Tấm Màn Tâm Linh, chỉ huy hạm đội đã trải qua những thay đổi chóng mặt. Mặc dù tính cách và ký ức của người này không bị ảnh hưởng, nhưng hình thể vật lý đã biến đổi dữ dội. Chỉ huy hạm đội giờ đây sở hữu ngoại hình (và các cơ quan nội tạng) của một chủng loài hoàn toàn xa lạ."
 enclave.6000.b.desc:0 "Sự phát triển đáng lo ngại trên [Root.GetName]: sau khi băng qua đường hầm Tấm Màn Tâm Linh, chỉ huy hạm đội đã trải qua một sự chuyển đổi đáng sợ. Mặc dù tính cách và ký ức của người này không bị ảnh hưởng, nhưng hình thể vật lý đã biến đổi dữ dội. Chỉ huy hạm đội giờ đây sở hữu ngoại hình (và các cơ quan nội tạng) của một chủng loài hoàn toàn xa lạ."
 enclave.6000b.a:0 "Sắp xếp một cuộc giải phẫu."
 enclave.6000b.b:0 "Tiêu diệt tên tạp chủng ngoài hành tinh."
 enclave.6000.d.desc:0 "Sự phát triển đáng lo ngại trên [Root.GetName]: sau khi băng qua đường hầm Tấm Màn Tâm Linh, chỉ huy hạm đội đã trải qua những thay đổi chóng mặt. Mặc dù ma trận tính cách và mô hình khớp thần kinh của drone này không bị ảnh hưởng, nhưng hình thể vật lý của nó đã biến đổi dữ dội. Chỉ huy hạm đội giờ đây sở hữu ngoại hình (và các cơ quan nội tạng) của một chủng loài sinh học."
 enclave.6000d.a:0 "Khởi động giao thức tuyệt diệt."
 enclave.6000.e.desc:0 "Sự phát triển kỳ lạ trên [Root.GetName]: sau khi băng qua đường hầm Tấm Màn Tâm Linh, chỉ huy hạm đội đã trải qua những thay đổi chóng mặt. Mặc dù ký ức tập thể không bị ảnh hưởng, nhưng hình thể vật lý của drone thợ này đã biến đổi dữ dội. Giờ đây nó sở hữu ngoại hình (và các cơ quan nội tạng) của một chủng loài hoàn toàn xa lạ."
 enclave.6000e.a:0 "Giải phẫu drone thợ."

 enclave.6005.name:0 "Xóa sổ tư tưởng"
 enclave.6005.a.desc:0 "Tiến triển trên [Root.GetName] vô cùng kỳ lạ: sau khi họ băng qua đường hầm Tấm Màn Tâm Linh gần đây, các chỉ huy hạm đội báo cáo rằng họ đã trải qua một loạt cảm giác và cảm xúc xa lạ. Trong tâm trí họ tràn ngập những suy nghĩ 'có thể đến từ nơi khác'. Rõ ràng là đã có chuyện gì đó xảy ra, rất có thể đây là hậu quả của việc tiếp xúc với năng lượng ngoại cảm của Tấm Màn Tâm Linh. Những trải nghiệm như vậy sẽ ảnh hưởng thế nào đến hiệu quả chiến đấu của họ, chúng ta vẫn chưa thể biết được..."
 enclave.6005.b.desc:0 "Tiến triển trên [Root.GetName] vô cùng kỳ lạ: sau khi họ băng qua đường hầm Tấm Màn Tâm Linh gần đây, ý thức tập thể của chúng ta đã bị thay đổi một cách tinh vi, rất có thể đây là hậu quả của việc tiếp xúc với năng lượng ngoại cảm của Tấm Màn Tâm Linh. Các drone chỉ huy báo cáo rằng chúng đã trải qua một loạt cảm giác và cảm xúc xa lạ, trong tâm trí chúng tràn ngập những suy nghĩ mới. Những trải nghiệm như vậy sẽ ảnh hưởng thế nào đến hiệu quả chiến đấu của chúng, chúng ta vẫn chưa thể biết được..."
 enclave.6005.c.desc:0 "Tiến triển trên [Root.GetName] vô cùng bất thường: sau khi con tàu băng qua đường hầm Tấm Màn Tâm Linh gần đây, ý thức tập thể của chúng ta đã bị thay đổi một cách tinh vi. Các drone chỉ huy báo cáo rằng chúng đã trải qua một loạt cảm giác và cảm xúc xa lạ. Rất có thể sau khi tiếp xúc với năng lượng ngoại cảm của Tấm Màn Tâm Linh, mạng lưới thần kinh của chúng đã bị ảnh hưởng. Những trải nghiệm như vậy sẽ ảnh hưởng thế nào đến hiệu quả chiến đấu của chúng, chúng ta vẫn chưa thể biết được..."

 enclave.6010.name:0 "$enclave.6005.name$"
 enclave.6010.a.desc:0 "Sự thay đổi về mặt tâm lý mà chỉ huy trên [Root.GetName] trải qua giờ đây đã hiển hiện: một tháng sau khi băng qua đường hầm Tấm Màn Tâm Linh, phong cách chỉ huy của người này đã thay đổi rõ rệt. Giờ đây chúng ta có thể nói rằng, trải nghiệm đó đã tiến hóa và phát triển thành một đặc điểm mới."
 enclave.6010.b.desc:0 "Sự thay đổi về mặt thần kinh mà chỉ huy trên [Root.GetName] trải qua giờ đây đã ảnh hưởng đến ý thức tập thể: một tháng sau khi băng qua đường hầm Tấm Màn Tâm Linh, mô hình sắp xếp của các drone đã thay đổi rõ rệt. Trải nghiệm đó giờ đây đã tiến hóa và phát triển thành một đặc điểm mới."
 enclave.6010.c.desc:0 "Sự thay đổi về mặt thần kinh mà chỉ huy trên [Root.GetName] trải qua giờ đây đã hiển hiện: một tháng sau khi băng qua đường hầm Tấm Màn Tâm Linh, ma trận nhân cách của các drone đã thay đổi rõ rệt. Trải nghiệm đó giờ đây đã tiến hóa và phát triển thành một đặc điểm mới."
 shroud_touched_intro:0 "Tấm Màn Tâm Linh đã gây ra tác động không nhỏ đối với những lữ khách du hành xuyên qua nó; "
