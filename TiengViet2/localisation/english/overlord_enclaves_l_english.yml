 leader_trait_general_mind_wipe_02:0 "Chỉ huy chạm tới Tấm Màn Tâm Linh"
 leader_trait_general_mind_wipe_02_desc:0 "$shroud_touched_intro$Trong tâm trí của chỉ huy này luôn thường trực vô số ý tưởng mới để nâng cao khả năng chiến đấu của lực lượng lục quân."
 leader_trait_ruler_mind_wipe_01:1 "Kiến trúc sư chạm tới Tấm Màn Tâm Linh"
 leader_trait_ruler_mind_wipe_01_desc:0 "$shroud_touched_intro$Trong tâm trí của nhà lãnh đạo này luôn thường trực vô số ý tưởng mới để hỗ trợ các công trình xây dựng."
 leader_trait_ruler_mind_wipe_02:1 "Nhà hậu cần chạm tới Tấm Màn Tâm Linh"
 leader_trait_ruler_mind_wipe_02_desc:0 "$shroud_touched_intro$Trong tâm trí của nhà lãnh đạo này luôn thường trực vô số ý tưởng mới để nâng cao hiệu suất của hạm đội."

 #Gestalt Traits
 gestalt_trait_commander_mind_wipe_01:0 "Drone Hải quân chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_commander_mind_wipe_01_desc:0 "$shroud_touched_intro$Drone này giờ đây có thể tăng cường hiệu năng của các con tàu."
 gestalt_trait_commander_mind_wipe_02:0 "Drone Hải quân chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_commander_mind_wipe_02_desc:0 "$shroud_touched_intro$Drone này giờ đây có thể tăng cường các hệ thống vũ khí."
 gestalt_trait_scientist_mind_wipe_01:0 "Drone Nghiên cứu chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_scientist_mind_wipe_01_desc:0 "$shroud_touched_intro$Drone này giờ đây có thể tạo ra những đột phá trong các công nghệ nghiên cứu khoa học cốt lõi."
 gestalt_trait_scientist_mind_wipe_02:0 "Drone Nghiên cứu chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_scientist_mind_wipe_02_desc:0 "$shroud_touched_intro$Drone này giờ đây có thể tăng cường các nghiên cứu khảo cổ học."
 gestalt_trait_general_mind_wipe_01:0 "Drone Tấn công chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_general_mind_wipe_01_desc:0 "$shroud_touched_intro$Đường truyền lên dữ liệu của drone này tới lực lượng lục quân của chúng ta đã được tăng cường."
 gestalt_trait_general_mind_wipe_02:0 "Drone Tấn công chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_general_mind_wipe_02_desc:0 "$shroud_touched_intro$Đường truyền lên dữ liệu của drone này tới lực lượng lục quân của chúng ta đã được cải thiện."
 gestalt_trait_ruler_mind_wipe_01:0 "Drone Chỉ huy chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_ruler_mind_wipe_01_desc:0 "$shroud_touched_intro$Drone này giờ đây có thể tăng cường các công nghệ xây dựng của chúng ta."
 gestalt_trait_ruler_mind_wipe_02:0 "Drone Chỉ huy chạm tới Tấm Màn Tâm Linh"
 gestalt_trait_ruler_mind_wipe_02_desc:0 "$shroud_touched_intro$Drone này giờ đây có thể nâng cao hiệu suất của hạm đội."

 enclave.6015.name:0 "Bức màn buông xuống"
 enclave.6015.desc:0 "Khi Đèn hiệu Tấm Màn Tâm Linh ngoại tuyến, chúng ta đã mất quyền truy cập vào mạng lưới đường hầm Tấm Màn Tâm Linh. Trừ khi thay thế chiếc đèn hiệu đó, nếu không hạm đội của chúng ta sẽ không thể sử dụng mạng lưới này."

 #Dreamer's Wake - Shroud Tunnel Event

 enclave.6020.name:0 "Hệ thống bồn chồn"
 enclave.6020.desc:0 "Do gần đây đã thông tuyến tới đường hầm Tấm Màn Tâm Linh, hệ thống trên [Root.GetName] bắt đầu xuất hiện những hành vi kỳ lạ: các mục nhật ký của tàu hiển thị ngẫu nhiên; có người nhìn thấy cửa phòng liên tục đóng mở; thêm vào đó - và đáng lo ngại hơn - trường ngăn chặn của động cơ đã xuất hiện những biến động. Cho đến nay, mọi nỗ lực truy tìm nguyên nhân của những vấn đề này đều thất bại."

 enclave.6025.name:0 "Người mơ mộng thức tỉnh"
 enclave.6025.desc:0 "Những tiến triển kỳ lạ đã xuất hiện trên tàu nghiên cứu khoa học [Root.GetName]: các mô hình lặp đi lặp lại đã xuất hiện bên trong trường ngăn chặn của động cơ, điều này cho thấy sự tồn tại của một ý thức nhân tạo. Bởi vì ý thức này được sinh ra trong quá trình hệ thống của tàu tương tác với năng lượng ngoại cảm của Tấm Màn Tâm Linh, nên hiện tại nó vẫn đang ở trong một trạng thái mộng mị. Tương tự như chuyển động mắt nhanh (REM) xuất hiện ở một số chủng loài khi ngủ, nguyên nhân khiến một số chức năng của tàu gặp trục trặc chính là do hoạt động thần kinh của thực thể này.\n\nKhó tin hơn nữa là, cuộc điều tra của chúng ta dường như đã đánh thức nó. Thực thể này hy vọng có thể tiếp tục cư ngụ bên trong hệ thống của con tàu, đổi lại, nó đồng ý làm việc cho chúng ta. Về lý thuyết, mối quan hệ hợp tác như vậy có thể cải thiện hoạt động của [Root.GetName] ở nhiều phương diện."
 enclave.6025.a:0 "Một giao dịch công bằng."
 enclave.6025.b:0 "Sự ghê tởm nhân tạo... Tiêu diệt nó."
 embrace_dreamer:0 "Đón nhận Người mơ mộng"
 embrace_dreamer_desc:0 "Nhờ được tích hợp một ý thức nhân tạo, các chức năng của con tàu nghiên cứu khoa học này đã được cải thiện."
 eliminate_dreamer:0 "Tiêu diệt Người mơ mộng"
 eliminate_dreamer_desc:0 "Trí tuệ nhân tạo tuyệt đối không được phép bước lên tàu của chúng ta; ở điểm này lập trường của chúng ta hoàn toàn thống nhất."

 # Introductions
 enclave.7000.title:0 "[shroudwalker_enclave_country.GetName]"
 enclave.7000.desc:0 "Hỡi những vị khách phương xa, chúng tôi xin gửi lời chào đến các vị.\n\nChúng tôi đã sớm biết đến sự tồn tại của các vị, nhưng vì lo sợ sẽ mang đến những tác động không đáng có cho tương lai của các vị, nên chúng tôi vẫn luôn ẩn mình phía sau bức màn. Tuy nhiên, bây giờ đã đến lúc chúng tôi bước ra từ phía sau bức rèm thưa, đối với những người ngoại đạo, cơ chế hoạt động của Tấm Màn Tâm Linh có thể trở nên kỳ quái và khiến người ta bất an. Chính vì lý do này, chúng tôi quyết định sẽ cung cấp sự hướng dẫn cho các vị. Nếu các vị đồng ý, chúng tôi sẵn sàng trở thành người dẫn đường cho các vị.\n\nHãy cứ khám phá, nhưng trước khi chúng ta gặp lại, nhớ chú ý an toàn nhé."
 enclave.7000.a:0 "Thú vị đấy..."

 enclave.7005.title:0 "[salvager_enclave_country.GetName]"
 enclave.7005.desc:0 "Những lời đồn đại về [Root.GetName] đã truyền đến tai chúng tôi từ lâu, và chúng tôi rất vui mừng khi có thể thiết lập liên lạc với ngài.\n\nĐể kiếm chút lợi nhuận ít ỏi, [salvager_enclave_country.GetName] chúng tôi hiện đang cung cấp các dịch vụ đặc biệt ra bên ngoài, ví dụ như nâng cấp động cơ, tháo dỡ tàu thuyền gì đó, bất kể ngài có nhu cầu gì, chúng tôi đều có thể đáp ứng!\n\nĐể chúng tôi ngay từ đầu đã có thể nhận được sự ưu ái của ngài, chúng tôi có thể gửi tặng ngài một món quà nhỏ để thể hiện sự chân thành của chúng tôi trong việc phục vụ khách hàng, ngài thấy sao?"
 enclave.7005.a:0 "Cảm ơn món quà của các vị."
 enclave.7005.b:0 "Lũ rác rưởi ngoài hành tinh, dâng tặng một món quà nhỏ vốn là bổn phận của các ngươi."

 # More Shroudwalking
 shroudwalker_insight_cooldown_tt:0 "§RNhững chiêm tinh gia Màn Che không thể thử nhìn trộm một §YThấu thị§! nào khác trước thời điểm §Y[root.shroudwalker_insight_timer]§!.§!"

 enclave.7050.desc:0 "Đối với chúng tôi có một câu ngạn ngữ thế này: ‘Bí mật khiêu vũ trong những giấc mơ.’ Đối với Tấm Màn Tâm Linh, không có pháo đài nào là không thể xuyên thủng, không có mật mã nào là không thể giải mã. Qua những buổi thiền định của chúng tôi, những kẻ khác luôn tin chắc rằng những thứ được giấu kín sâu thẳm sẽ ngoan ngoãn phơi bày trước mắt chúng tôi. Bạn có hứng thú tìm hiểu xem những người xung quanh bạn đang âm mưu điều gì không? Đi thấu hiểu những mưu đồ của họ, cứ như thể mưu đồ đó là của chính bạn vậy? Nếu bạn có điều cầu xin, chúng tôi sẽ chia sẻ những hiểu biết của mình. Còn việc sử dụng những điều đó như thế nào là chuyện của chính bạn."
 enclave.7050.a:0 "[spynetwork_country_1.GetName]"
 enclave.7050.b:0 "[spynetwork_country_2.GetName]"
 enclave.7050.c:0 "[spynetwork_country_3.GetName]"
 enclave.7050.d:0 "[spynetwork_country_4.GetName]"
 enclave.7050.e:0 "[spynetwork_country_5.GetName]"
 enclave.7050.f:0 "[spynetwork_country_6.GetName]"

 enclave.7055.desc:0 "Tấm Màn Tâm Linh đang dao động; bức màn của nó đang trở nên mỏng manh. Chúng tôi sẽ rút khỏi trạng thái thiền định. Tất cả những thấu thị mà chúng tôi nhìn trộm được sẽ được công khai với các vị."

 enclave.7060.desc:0 "Người ta đồn rằng, trong Tấm Màn Tâm Linh, mọi tâm trí đều sẽ đổ bóng xuống. Thông qua những buổi thiền định của chúng tôi, sự chần chừ do dự của một tâm trí cụ thể đã được phơi bày rõ ràng trước mắt chúng tôi, người này rất được tín nhiệm, nhưng lòng trung thành của họ không kiên định như vẻ bề ngoài. Bản sao lưu đã được giao cho bạn. Không còn nghi ngờ gì nữa, người này sẽ trở thành một kẻ chỉ điểm tự nguyện."
 enclave.7060.tt:0 "Chúng ta đã có một §Yngười chỉ điểm mới§! trong mạng lưới gián điệp tại §H[from.GetName]§!."

 enclave.7065.desc:0 "Dưới trướng của bạn có rất nhiều đặc vụ thân mang tuyệt kỹ, nhưng mỗi người đều bị mắc kẹt trong những giới hạn của riêng mình. Bất kỳ đôi mắt nào cũng không thể nhìn thấy chính nó. Nhưng Tấm Màn Tâm Linh lại không có những giới hạn như vậy; những buổi thiền định của chúng tôi có thể tiết lộ rất nhiều điều. Nếu bạn hy vọng các hành động bí mật của mình có thể mã đáo thành công, thì tốt nhất bạn nên lắng nghe những lời khuyên của chúng tôi nhiều hơn."
 enclave.7065.tt:0 "Nâng cao §Ycấp độ thâm nhập§! của chúng ta tại mạng lưới gián điệp §H[from.GetName]§!."

 enclave.7070.desc:0 "Những quốc độ phàm trần vốn không kiên cố như vẻ bề ngoài của chúng. Những người sống trong đó cũng vậy. Những bí mật của những người xung quanh bạn đều đã được phơi bày trước mắt chúng tôi. Những điều chúng tôi tìm hiểu được giờ đây đều giao cho bạn."
 enclave.7070.tt:0 "Gia tăng §Ytin tức tình báo§! của chúng ta tại §H[from.GetName]§!."

 enclave.7075.desc:0 "Chúng tôi có câu ngạn ngữ cổ thế này: ‘Bất cứ chuyện gì cũng có thể xảy ra; điều đó cũng bao gồm cả việc không có chuyện gì xảy ra.’ Thật đáng tiếc, những buổi thiền định của chúng tôi đã không thể thu được bất kỳ thấu thị nào."
 enclave.7075.a:0 "Thật... đáng thất vọng."

 shroudwalker_spy_network_modifier:0 "Sự kiểm soát Tấm Màn Tâm Linh của chúng ta đã đẩy nhanh quá trình này, cho phép chúng ta hỗ trợ nhiệm vụ của [shroudwalker_enclave_country.GetName]."

 shroudwalker_spy_network:0 "Thấu thị của Người bước đi trong Tấm Màn Tâm Linh"
 shroudwalker_spy_network_desc:0 "[shroudwalker_enclave_country.GetName] sẽ nhìn chằm chằm vào Tấm Màn Tâm Linh, với hy vọng đạt được những hiểu biết mang tính chỉ đạo đối với các hoạt động nội bộ của [Target.GetName]."
 shroudwalker_spy_network_type:0 "Thấu thị của Người bước đi trong Tấm Màn Tâm Linh"
 shroudwalker_spy_network_monthly_change_tooltip:0 "Tiến độ sẽ chủ yếu phụ thuộc vào [shroudwalker_enclave_country.GetName], mặc dù những người có khả năng điều hòa cùng ngoại cảm có thể giúp đẩy nhanh tiến trình."
 shroudwalker_spy_network_finish:0 "Khi [shroudwalker_enclave_country.GetName] gặt hái được điều gì đó từ Tấm Màn Tâm Linh, họ sẽ quay lại để báo cáo cập nhật cho chúng ta."

 shroudwalker_teacher_cooldown_tt:0 "§RTrước thời điểm §Y[root.shroudwalker_teacher_timer]§!, chúng ta không thể thỉnh cầu một vị Người dẫn đường bước đi trong Tấm Màn Tâm Linh nào khác.§!"
 shroudwalker_teacher_already_bought:1 "§RChúng ta đã trả tiền cho sự phục vụ của Người dẫn đường bước đi trong Tấm Màn Tâm Linh rồi.§!"
 shroudwalker_teacher_already_exists:0 "§RHành tinh này đã có một Người dẫn đường bước đi trong Tấm Màn Tâm Linh đang cống hiến rồi.§!"

 enclave.7100.desc:1 "Việc kiểm soát Tấm Màn Tâm Linh là một hành trình dài đằng đẵng đánh đổi bằng 10000 lần sinh tử; ngay cả những người dẫn đường bẩm sinh đầy tài năng của chúng tôi cũng chỉ dám tuyên bố rằng họ có được một vài hiểu biết phiến diện đối với sự bí ẩn của Tấm Màn Tâm Linh. Mặc dù vậy, sự thông thái của họ cũng là những kho báu vô giá. Nếu bạn có điều cầu xin, chúng tôi có thể cử một người dẫn đường đến để chỉ điểm sai lầm cho bạn."
 enclave.7100.a:0 "Chúng tôi hy vọng được học hỏi."

 enclave.7105.desc:1 "Biển học vô bờ, lấy cần cù làm bến đỗ: đây chính là sự thông thái bậc nhất. Chúng tôi sẽ gửi cho bạn một người dẫn đường. Hãy học hành chăm chỉ, bạn nhất định sẽ thu hoạch được gì đó."

 enclave.7110.desc:0 "Một câu chuyện vô cùng thú vị. Các vị đang nói tới §Y“Lữ khách mang mạng che mặt”§!, phải không? Ở một số phương diện, Tấm Màn Tâm Linh này quả thực rất giống với Tấm Màn Tâm Linh của riêng chúng ta, nhưng đối với những người không hiểu biết, những sự khác biệt này có thể rất tinh vi; thực chất chúng vô cùng sâu sắc, là một sự phản chiếu méo mó, đến từ một vũ trụ không hoàn toàn giống với chúng ta.\n\nBề mặt của Tấm Màn Tâm Linh có rất nhiều vết nứt. Những kẻ dấn thân quá sâu vào sự bí ẩn của nó cuối cùng có lẽ sẽ không thể quay trở lại vũ trụ vốn dĩ của họ."
 enclave.7110.a:0 "Du hành ngoại cảm xuyên không gian chiều... thật hấp dẫn."
 enclave.7110.a.tooltip:0 "Công nghệ §PĐộng cơ Bước nhảy Ngoại cảm§! xuất hiện với tỷ lệ gấp §Y1.5§! lần so với bình thường."


 decision_shroudwalker_teacher:0 "Người dẫn đường bước đi trong Tấm Màn Tâm Linh"
 decision_shroudwalker_teacher_desc:0 "Một chuyên gia của [shroudwalker_enclave_country.GetName] đang cư ngụ trên hành tinh này, chỉ dẫn cho người dân địa phương về Đạo của Tấm Màn Tâm Linh."

 pm_shroudwalker_teacher:0 "$decision_shroudwalker_teacher$"
 pm_shroudwalker_teacher_desc:0 "$decision_shroudwalker_teacher_desc$"

 decision_shroudwalker_teacher_losing_modifier:0 "§RBất kỳ hành tinh nào khác có Modifier hành tinh §YNgười dẫn đường bước đi trong Tấm Màn Tâm Linh§! sẽ mất đi hiệu ứng này.§!"

 shroudwalker_teacher_buy_more_than_one:0 "§RMỗi lần chúng ta chỉ có thể có tối đa một §YNgười dẫn đường bước đi trong Tấm Màn Tâm Linh§! phục vụ cho mình.§!"

 shroud_beacon_active_tooltip:0 "[Root.GetName] đang sở hữu một §YĐèn hiệu Tấm Màn Tâm Linh§! đã được kích hoạt."

# shroudwalker_teacher_explanation:1 "\nUnlocks the §YColony Decision§! §H$decision_shroudwalker_teacher$§! with the following effects:\n£amenities£ $MOD_PLANET_AMENITIES_MULT$: §G+5%§!\n$mod_planet_jobs_unity_produces_mult$: §G+10%§!\n$mod_planet_enforcers_unity_produces_add$: §G+3§!"

 shroudwalker_teacher_explanation:2 "\nChúng ta sẽ thuê một Viên chức Hành chính cấp 5 có Đặc điểm §Y$leader_trait_shroudwalker$§!."

 enclave.7250.desc:0 "Chúng tôi đặc biệt hứng thú với Zro. Chúng tôi có thể dạy các vị phương pháp khai thác và lưu trữ, nhưng với điều kiện là các vị phải đồng ý vĩnh viễn chia một phần sản lượng của mình cho chúng tôi."
 enclave.7250.a:0 "Các vị sẽ nhận được phần chia của mình. Hãy chỉ dạy cho chúng tôi."
 enclave.7255.desc:0 "Zro là một loại vật chất tuyệt diệu mà cũng thật đáng buồn, có rất nhiều công dụng, nhưng tuyệt đối không được tùy tiện sử dụng, vì nó là di sản cuối cùng của một chủng loài cổ đại. Khai thác rồi thì hãy trân trọng cho tử tế, cũng đừng quên báo đáp chúng tôi."

 shroudwalker_zro_tithe:0 "Thuế Thập phân Zro của Người bước đi trong Tấm Màn Tâm Linh"
 shroudwalker_zro_tithe_desc:0 "[shroudwalker_enclave_country.GetName] đã hướng dẫn cho chúng ta cách khai thác Zro. Để đổi lại, chúng ta thề sẽ giao nộp một phần mười sản lượng Zro cho họ."

 shroudwalker_teacher_desc: "$leader_trait_shroudwalker_desc$"
 shroudwalker_teacher_catch_phrase: "§L“Bí mật của Tấm Màn Tâm Linh cuối cùng sẽ được hé lộ.”§!"

 leader_trait_shroudwalker: "Người dẫn đường bước đi trong Tấm Màn Tâm Linh"
 leader_trait_shroudwalker_desc: "Một cựu binh của [shroudwalker_enclave_country.GetName], am hiểu việc dẫn lối chỉ đường đến Tấm Màn Tâm Linh."

 councilor_shroudwalker_teacher: "Người dẫn đường bước đi trong Tấm Màn Tâm Linh"
 councilor_shroudwalker_teacher_female: "$councilor_shroudwalker_teacher$"
 councilor_shroudwalker_teacher_desc: "Một cựu binh của [shroudwalker_enclave_country.GetName] làm việc trong Nội các, đang dẫn lối chỉ đường đến Tấm Màn Tâm Linh."
 councilor_shroudwalker_teacher_unlock_title: "§HChiếc ghế Nội các đến từ [shroudwalker_enclave_country.GetName]§!"
 councilor_shroudwalker_teacher_conditional_tooltip: "Nhà lãnh đạo sở hữu Đặc điểm §Y$leader_trait_shroudwalker$§!"

 unlocks_shroudwalker_council_position: "\n§ECho phép mở khóa ghế Nội các:§!\n§H$t$$councilor_shroudwalker_teacher$§!\n$tt$$COUNCIL_POSITION_MODIFIER_BASE$\n$ttt$$mod_category_psionics_draw_chance_mult$: §G+5%§!\n$ttt$$mod_country_unity_produces_mult$§G+1%§!\n$ttt$$mod_shroud_delve_cost$: §G-2%§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$official_with_icon$\n\n$COUNCIL_POSITION_REQUIREMENTS$$councilor_shroudwalker_teacher_conditional_tooltip$"

 enclave.8000.name: "Tấn công [FROM.GetName]"
 enclave.8000.start: "Sau khi chúng ta phát động cuộc tấn công vào [FROM.GetName], [root.GetTitle] §Y[root.GetName]§! đã rời khỏi biên giới của chúng ta. [root.GetHeSheCap] đã để lại một đoạn tin nhắn khi [root.GetHisHer] rời đi."
 enclave.8000.end: "May mắn thay, ngoại trừ việc dời khỏi nơi làm việc riêng của [root.GetHisHer], [root.GetName] không gây ra bất kỳ sự xáo trộn nào khác cho đội ngũ lãnh đạo."
 enclave.8000.councilor_end: "Do [root.GetHisHer] từng đảm nhiệm vị trí trong Nội các, sự ra đi của [root.GetName] và các nhân viên của [root.GetHisHer] đã gây ra sự gián đoạn lớn đối với các hoạt động của chính phủ."

 shroudwalker_teacher_farewell: "§L“Các người đã nhúng tay vào những thế lực mà bản thân không thể hiểu nổi. Hãy cẩn trọng lời nói và hành động, học cách an phận với hiện tại, bởi vì trên con đường mà các người đã chọn, tương lai sẽ chỉ mang đến toàn là đau khổ.”§!"
 enclave.8000.shroudwalker_teacher.desc: "$enclave.8000.start$\n\n$shroudwalker_teacher_farewell$\n\n$enclave.8000.end$"
 enclave.8000.shroudwalker_teacher.desc.councilor: "$enclave.8000.start$\n\n$shroudwalker_teacher_farewell$\n\n$enclave.8000.councilor_end$"

 master_salvager_farewell: "§L“Được thôi, các người đã bộc lộ bộ mặt thật của mình. Ta vốn đã có những kỳ vọng cao hơn thế. Cầu mong cho động cơ của các người nổ tung rồi vụt tắt, chôn vùi các người xuống tận cùng của Hư Không.”§!"
 enclave.8000.master_salvager.desc: "$enclave.8000.start$\n\n$master_salvager_farewell$\n\n$enclave.8000.end$"
 enclave.8000.master_salvager.desc.councilor: "$enclave.8000.start$\n\n$master_salvager_farewell$\n\n$enclave.8000.councilor_end$"

 curator_archivist_farewell: "§L“Bỉ ổi! Dung tục! Lũ hèn nhát! Cứ nghĩ đến việc chúng ta từng cho rằng các người là những kẻ văn minh... Nhưng ta đoán cái bản tính bội bạc này cũng là điều nằm trong dự liệu mà thôi - những bản năng đê hèn và lòng tham hạn hẹp vẫn luôn là dấu ấn đặc trưng của dân tộc các người.”§!"
 enclave.8000.curator_archivist.desc: "$enclave.8000.start$\n\n$curator_archivist_farewell$\n\n$enclave.8000.end$"
 enclave.8000.curator_archivist.desc.councilor: "$enclave.8000.start$\n\n$curator_archivist_farewell$\n\n$enclave.8000.end$"

 trader_leader_farewell: "§L“Thế nào, tại sao lại không cho ta biết cái bí mật bé nhỏ này của thị trường vậy? Nói cho ta nghe xem, đây là cái tâm cơ gì? Có lợi lộc gì? Lũ ngốc các người chẳng lẽ không biết rằng các người đã hủy hoại cả hai chúng ta rồi sao?”§!"
 enclave.8000.trader_leader.desc: "$enclave.8000.start$\n\n$trader_leader_farewell$\n\n$enclave.8000.end$"
 enclave.8000.trader_leader.desc.councilor: "$enclave.8000.start$\n\n$trader_leader_farewell$\n\n$enclave.8000.councilor_end$"

 leader_leaves_tt: "§Y[root.GetName]§! đã rời khỏi đế quốc của chúng ta."
