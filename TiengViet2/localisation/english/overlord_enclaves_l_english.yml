 # General-Purpose
 enclave.100.name:0 "Lối Đi Lơ Lửng"
 enclave.100a.desc:2 "Có thứ gì đó đang lẩn khuất trong hệ sao [From.GetName]: Một lối đi bí mật xé toạc kết cấu không-thời gian, chân trời của nó gợn lên những gợn sóng tâm linh. Dữ liệu từ tàu thăm dò rất khó nắm bắt, thủy thủ đoàn trên tàu nghiên cứu của chúng ta báo cáo về những hiện tượng nhiễu loạn kỳ lạ: Những ảo ảnh điên rồ ẩn sâu trong tâm trí, cảm giác bị theo dõi liên tục, những ảo giác chập chờn...\n\nMặc dù khá đáng tiếc vì thiếu các phương tiện đo đạc từ xa hiệu quả, nhưng có vẻ như chúng ta đã tình cờ tìm thấy một đường hầm dẫn đến những điều chưa biết. Đây là một con đường đầy rẫy hiểm nguy, nhưng phần thưởng có thể vô cùng hậu hĩnh; đầu bên kia của đường hầm nối liền với một góc vô cùng xa xôi trong thiên hà."
 enclave.100b.desc:1 "Có thứ gì đó đang lẩn khuất trong hệ sao [From.GetName]: Một lối đi bí mật xé toạc kết cấu không-thời gian, chân trời của nó gợn lên những gợn sóng tâm linh. Dữ liệu từ tàu thăm dò rất khó nắm bắt, nhưng tổ ong đã bị quấy nhiễu. Cảm giác bị theo dõi liên tục bám lấy chúng ta, một cảm giác rất khác lạ, dường như có thứ gì đó đang lao về phía chúng ta từ bờ bên kia của cái họng đường hầm.\n\nMặc dù khá đáng tiếc vì thiếu các phương tiện đo đạc từ xa hiệu quả, nhưng có vẻ như chúng ta đã tình cờ tìm thấy một đường hầm dẫn đến những điều chưa biết. Đây là một con đường đầy rẫy hiểm nguy, nhưng phần thưởng có thể vô cùng hậu hĩnh; đầu bên kia của đường hầm nối liền với một góc vô cùng xa xôi trong thiên hà."
 enclave.100.a:0 "Bí mật gì đang ẩn giấu sau bức màn?"

 # Mercenary Enclaves
 enclave.2.name:0 "Thành Lập Công Ty Đánh Thuê"
 enclave.2.desc:2 "Chúng ta đang thảo luận về việc hỗ trợ [fleet.GetName] thành lập một §YCông Ty Đánh Thuê§! độc lập. Đề xuất này ban đầu được đưa ra bởi chỉ huy hạm đội, và nếu được thông qua, sẽ khiến chúng ta mất quyền kiểm soát hạm đội đó. Chúng ta cũng sẽ chịu trách nhiệm cung cấp cho họ một khoản §YNăng lượng§! và §YHợp kim§! đáng kể, tuy nhiên đổi lại, họ sẽ chia cho chúng ta một số cổ phần của công ty, mang lại cổ tức định kỳ và các đặc quyền.\n\nHọ đảm bảo rằng, một khi chúng ta cần, họ sẽ luôn sẵn sàng chiến đấu vì chúng ta, tất nhiên cũng vì tiền của chúng ta."
 enclave.2.tooltip.a:0 "Hạm đội cần một người chỉ huy"
 enclave.2.tooltip.aa:0 "Hạm đội đã có một người chỉ huy"
 enclave.2.tooltip.cloak:0 "Tất cả các phi thuyền trong hạm đội này phải không có khả năng tàng hình."
 enclave.2.tooltip.b:1 "Đã có một thực thể biệt lập ở đây"
 enclave.2.tooltip.bb:1 "Hệ sao này không có thực thể biệt lập nào khác"
 enclave.2.tooltip.c:0 "Hệ sao này phải thuộc quyền kiểm soát của chúng ta"
 enclave.2.tooltip.cc:0 "Hệ sao này thuộc quyền kiểm soát của chúng ta"
 enclave.2.tooltip.c.nomads: "Chúng ta cần phải xây dựng một trạm tiếp vận trong hệ sao này."
 enclave.2.tooltip.cc.nomads: "Chúng ta có một trạm tiếp vận trong hệ sao này."
 enclave.2.tooltip.d: "Sức chứa thực thể biệt lập không đủ"
 enclave.2.tooltip.dd: "Sức chứa thực thể biệt lập còn dư"
 enclave.2.tooltip.e:1 "Cần có một tiểu hành tinh hoặc mặt trăng trong hệ sao"
 enclave.2.tooltip.ee:1 "Có tiểu hành tinh hoặc mặt trăng trong hệ sao"
 enclave.2.tooltip.f:0 "Chúng ta phải là chủ sở hữu của hạm đội này"
 enclave.2.tooltip.g: "Tàu của bầy đàn không gian không thể làm lính đánh thuê"
 enclave.2.a.tooltip:0 "Một công ty đánh thuê được thành lập."
 enclave.25:0 "Công Ty Đánh Thuê Bị Tiêu Diệt"
 enclave.25.desc:1 "Hạm đội phe ta đã thành công đập tan sự kháng cự của bọn lính đánh thuê tại hệ sao [merc_system.GetName], căn cứ của chúng cũng bị phá hủy. Theo sự sụp đổ của tàn dư [FROM.GetName], phần hạm đội còn sót lại của chúng cũng giải tán. Dù một vài thuyền trưởng còn sống sót đã rơi vào con đường cướp biển, số khác lại tuyên bố họ vẫn dự định tiếp tục cung cấp các hợp đồng dịch vụ nhỏ lẻ, ví như hỗ trợ hậu cần hay bảo vệ trạm không gian. Dù sao những việc cỏn con này cũng chẳng đáng bận tâm, điều quan trọng là, Công Ty Đánh Thuê đã không còn tồn tại, chúng ta đã trục vớt được kha khá tài nguyên từ đống tàn tích của nó."
 enclave.26.desc:1 "Có tin truyền tới, [mercenary_destroyer.GetName] vừa tiêu diệt một Công Ty Đánh Thuê tại hệ sao [merc_system.GetName]. Do phe tấn công quá sức hùng mạnh, [FROM.GetName] đơn độc khó chống đỡ nổi, cả bộ máy hội đồng quản trị, doanh trại và xưởng đóng tàu của họ đều bị hủy diệt hoàn toàn. Ngay sau đó, hạm đội lính đánh thuê cũng tan rã do các thuyền trưởng phải tự tìm đường sống, tuy nhiên, một vài đại diện của họ vẫn tuyên bố sẽ cố gắng thực hiện các hợp đồng của công ty về hỗ trợ hậu cần và phòng thủ căn cứ sao."
 enclave.26.a:0 "Bọn chúng sẽ phải trả giá."
 enclave.27:0 "Triệu Hồi Hạm Đội Khẩn Cấp"
 enclave.27.desc:0 "Kính gửi quý khách:\n\nDo đang phải hứng chịu tấn công, chúng tôi buộc phải khẩn cấp gọi lại hạm đội của mình. Căn cứ theo điều 285b trong hợp đồng, hạm đội của chúng tôi sẽ ngay lập tức ngừng phục vụ quý khách khi có thông báo. Dẫu vậy, khi tình hình bất khả kháng này được giải quyết êm xuôi, chúng tôi sẽ nối lại mối quan hệ hợp tác và thành thật cáo lỗi về sự bất tiện đã gây ra."
 enclave.27.desc.mindwarden: "Chúng ta vừa nhận được tin báo từ [mercenary_enclave_country.GetName]:\n\n§H[root.GetName],\n\nChúng tôi hiện đang bị tấn công và buộc phải thu hồi lực lượng vũ trang của phe mình ngay lập tức. Căn cứ vào các điều khoản liên quan trong hợp đồng, [mercenary_fleet.GetName] sẽ tức tốc ngừng phục vụ quý khách.\n\nChúng tôi tin rằng, quý khách có thể thấu hiểu sự cấp bách của tình hình hiện tại và việc cần thiết phải rút quân.§!"
 enclave.27.a:0 "Chúc các anh may mắn."
 enclave.27.a.mindwarden: "Mong rằng họ đánh tan quân thù."
 enclave.27.b:0 "Thế này thì vô lý quá!"
 enclave.27.b.mindwarden: "Lần tới chúng ta phải xem xét kỹ các điều khoản hợp đồng."
 enclave.28:0 "Hiệp Ước Hòa Bình"
 enclave.28.desc:0 "Xin lưu ý! [Root.GetName], đã tròn một năm kể từ khi các người phát động cuộc xâm lược đáng tiếc này. Chúng tôi, [mercenary_enclave_country.GetName], sẵn sàng bỏ qua chuyện cũ; dù sao thì đôi khi xung đột cũng có thể sinh lời, nhưng giữa hai đối tác làm ăn thì điều đó là không thể. Nếu các người chịu đưa ra một lời xin lỗi ngắn gọn để thể hiện chút thiện chí, chúng tôi sẵn lòng xí xóa mọi chuyện."
 enclave.28.a:0 "Chết đi, lũ cặn bã hám lợi."
 enclave.28.b:0 "Thôi được rồi."
 enclave.205.name:0 "[mercenary_enclave_country.GetName]"
 enclave.205.desc:1 "Chào mừng! [mercenary_enclave_country.GetName] cung cấp các dịch vụ an ninh tối tân nhất cho khách hàng. Chúng tôi đã ký kết hiệp định dân sự với vô số hành tinh, bao gồm an ninh cá nhân hoặc huấn luyện lực lượng thực thi pháp luật.\n\nTuy nhiên, đối với khách hàng cao cấp, chúng tôi cam kết mang lại trải nghiệm tối ưu. Hạm đội, Lục quân, Cố vấn quân sự... Bạn có vô vàn sự lựa chọn để gìn giữ hòa bình. Dĩ nhiên, giá cả phải chăng."
 enclave.205.desc.hostile:0 "À, kẻ hiếu chiến đã trở lại.\n\nNgươi rốt cuộc đã thông suốt mấy hành vi vô nghĩa của mình chỉ là công cốc rồi hả? Đây chỉ là chút lòng thành đáp lại thiện ý của ngươi, [mercenary_enclave_country.GetName] bọn ta sẵn lòng tạm gác lại những bất đồng này. Cùng hướng tới một tương lai sinh lời nào."
 enclave.205.desc.unfriendly:0 "Bọn ta không đón tiếp ngươi. Tiễn khách."
 enclave.205.a:1 "Chúng ta định §Ythuê một hạm đội§!."
 enclave.205.tooltip.a:1 "[event_target:current_client.GetName] đang thuê hạm đội của chúng tôi."
 enclave.205.tooltip.b:0 "Không có hạm đội cho thuê."
 enclave.205.tooltip.aa: "Không có đế quốc nào khác đang cho thuê hạm đội của họ."
 enclave.205.tooltip.bb: "Họ có một hạm đội §Ysẵn sàng chiến đấu§!."
 enclave.205.b:1 "Chúng ta định §Yquản lý§! hạm đội đã thuê."
 enclave.205.c:1 "Chúng ta muốn tuyển mộ §Ylực lượng đồn trú đánh thuê§!."
 enclave.205.d:1 "Chúng ta muốn giúp các anh triển khai một §Yhạm đội quy mô lớn hơn§!."
 enclave.205.d.timeout:0 "thực thể biệt lập này đang chiêu mộ sĩ quan và thủy thủ mới. Họ không thể triển khai thêm phương án cải thiện hậu cần trước §Y[event_target:mercenary_enclave_country.upgraded_station_timer]§!."
 enclave.205.e:1 "Chúng ta đang tìm kiếm §Ytầm nhìn chiến thuật§! để đối phó với kẻ thù mạnh."
 enclave.205.f:1 "Chúng ta định thuê §Ylực lượng mặt đất§!."
 enclave.205.g:1 "Các anh có thể cung cấp §Yphương án hậu cần§! gì?"
 enclave.205.g.tooltip:1 "Chúng ta đã nhận §Yhỗ trợ hậu cần§!."
 enclave.205.h:2 "Với tư cách là §Ynhà tài trợ§! của các anh, chúng ta muốn biết các lựa chọn của mình."
 enclave.205.i:0 "Thế thôi."
 mercenary_tt_hirefleet:0 "Tiếp quản §Yhạm đội lính đánh thuê§! của thực thể biệt lập này trong thời hạn 10 năm."
 mercenary_tt_managefleet:0 "Hủy bỏ hoặc gia hạn hợp đồng §Yhạm đội lính đánh thuê§! của bạn."
 mercenary_tt_garrison:0 "Mua một §Ycông trình căn cứ sao§! có phí bảo trì cao."
 mercenary_tt_tactical:0 "Nhận thông tin tình báo về §YKhủng hoảng§! hiện tại và cách chiến đấu với nó."
 mercenary_tt_hirearmies:0 "Thuê §YLục quân§! để tiến hành các cuộc xâm lược mặt đất."
 mercenary_tt_logistic:0 "Để lính đánh thuê hỗ trợ tuyến tiếp tế của bạn, tăng cường §YGiới hạn Hải quân§!."
 mercenary_tt_patron:0 "§YNhà tài trợ§! của thực thể biệt lập có thể giúp họ phát triển hoặc trưng dụng một hạm đội đã được thuê."

 enclave.210.desc:0 "Tuyệt vời! Thuê một hạm đội [mercenary_enclave_country.GetName] luôn là sự lựa chọn sáng suốt. Lực lượng của chúng tôi chắc chắn là lực lượng được huấn luyện bài bản và kỷ luật nhất thiên hà, và công nghệ của chúng tôi cũng thuộc hàng tối tân. Bọn hải tặc, phiến quân hoặc bất kỳ đám ô hợp nào mà bạn cần xử lý sẽ sớm học được bài học về sự tôn trọng.\n\nNgoài ra, mỗi hạm đội của chúng tôi đều được chỉ huy bởi một sĩ quan hạm đội dày dạn kinh nghiệm mà không tính thêm phí. Họ am tường mọi khía cạnh của chiến tranh giữa các vì sao và chắc chắn có thể dẫn dắt quân đội của bạn tới chiến thắng."
 enclave.211.desc:0 "Tôi tin rằng bạn nhất định sẽ tận dụng tốt lực lượng mới của mình, và hòa bình sẽ sớm trở lại với đế quốc của bạn!"
 enclave.215.desc:1 "Bạn muốn chấm dứt hay gia hạn hợp đồng? Chúng ta cần chuẩn bị các giấy tờ cần thiết trước. Hiện tại, phe chúng tôi đang triển khai một chương trình khuyến mãi, khách hàng gia hạn hợp đồng sẽ nhận được một thùng lựu đạn miễn phí như một món quà!"
 enclave.215.a:0 "Chúng ta muốn thảo luận về những vấn đề khác."
 enclave.215.b:0 "Chúng ta muốn gia hạn hợp đồng."
 enclave.215.c:0 "Chúng ta muốn chấm dứt hợp đồng."
 enclave.220.desc:0 "Lực lượng đồn trú của chúng tôi có thể thể hiện giá trị phi thường, nhưng xin hãy ghi nhớ, tại [mercenary_enclave_country.GetName] chúng tôi kiêng kỵ gọi họ là 'lính đánh thuê'. Từ này quá thẳng thừng và mang nhiều liên tưởng tiêu cực. 'Nhà thầu quốc phòng' của chúng tôi đã sẵn sàng thiết lập hệ thống trên trạm không gian của bạn để chào đón những 'chuyên gia an ninh' này. Sau khi chúng tôi hoàn tất, những chuyên gia này sẽ bắt đầu huấn luyện các thành viên trên trạm không gian, giúp họ phát huy tối đa khả năng của mình.\n\nTại [mercenary_enclave_country.GetName], chúng tôi chỉ tập trung đào tạo những người gìn giữ hòa bình xuất sắc nhất."
 enclave.225.desc:0 "Cảm ơn vì đã hợp tác kinh doanh. Làm việc cùng bạn để duy trì an ninh cho thiên hà khiến chúng tôi vô cùng tự hào."

 enclave.235.1.desc:0 "Với số vốn này, chúng tôi có thể mở rộng đáng kể hoạt động của mình. Thêm nhiều phi thuyền, thêm nhiều nhân sự, cơ sở huấn luyện lớn mạnh và hoàn thiện hơn... Chúng tôi có thể làm nhiều điều hơn nữa để duy trì hòa bình."
 enclave.235.2.desc:0 "Trong một thiên hà đầy rẫy sự lừa lọc và phức tạp như thế này, cân nhắc về an ninh là điều tối thượng. Sự quyên góp của bạn sẽ giúp các hoạt động và dịch vụ của chúng tôi vươn lên một tầm cao mới!"
 enclave.235.3.desc:0 "Thử tưởng tượng xem: [mercenary_enclave_country.GetName] được triển khai trên khắp thiên hà cho nhiều hoạt động dân sự và quân sự... Cảm giác an toàn chưa từng có dành cho tất cả mọi người..."
 enclave.235.4.desc:1 "Khi chúng tôi bắt đầu tất cả những việc này, một trong những người sáng lập của chúng tôi đã ấp ủ một giấc mơ: Sự tồn tại của chúng tôi là để mang lại an ninh cho thiên hà, giống như sự tồn tại của các tập đoàn xuyên thiên hà là để xóa bỏ bất bình đẳng. Hôm nay, tôi vô cùng háo hức tuyên bố rằng mục tiêu này của chúng tôi đã nằm trong tầm tay."
 enclave.235.5.desc:0 "Chúng tôi sẽ triển khai hạm đội hùng mạnh nhất trên khắp thiên hà! Nguồn vốn sẽ chảy dạt dào. Thường dân sẽ tận hưởng sự ổn định mà họ xứng đáng có được. Các quốc gia sẽ tranh giành hợp đồng của chúng tôi... Ồ, lúc tôi báo tin này cho các cổ đông, thật nên xem nét mặt của họ ra sao!"

 enclave.240.desc:0 "Phải. Đây là khoảng thời gian đáng lo ngại đối với tất cả mọi người. Nhóm giải quyết vấn đề chiến lược của chúng tôi có định hướng đạo đức vững vàng cùng sự cống hiến không ngừng nghỉ trong việc kiến tạo một thiên hà an toàn hơn. Chúng tôi đã mạo hiểm giám sát chặt chẽ những mối nguy mới xuất hiện và có thể cung cấp cho bạn thông tin tình báo đáng tin cậy để hành động. Điều bạn muốn là..."
 enclave.240.a:0 "Đại Hãn"
 enclave.240.b:0 "Bão Xám"
 enclave.240.c:0 "Prethoryn Scourge"
 enclave.240.d:0 "Kẻ Xâm Lược Xuyên Không"
 enclave.240.e:0 "Giao Thức Thanh Trừng"
 enclave.240.f:0 "Cetana"

 enclave.245.desc:0 "Phi thuyền của Đại Hãn nhìn chung có cấu trúc rất kiên cố, không có điểm yếu rõ ràng. Các chuyên gia phân tích của chúng tôi khuyên rằng, ngư lôi có thể là cách tốt nhất để bắn hạ phi thuyền của chúng, nhưng hãy cẩn thận kẻo bị nhắm mục tiêu vào hệ thống phòng thủ. Việc kết hợp khiên và lá chắn có lẽ là chiến lược bảo vệ tàu tốt nhất của bạn. Đại Hãn vốn dĩ là một chỉ huy vô cùng tài ba, việc đánh giá thấp hắn sẽ là một sai lầm chết người. Đội cận vệ của Đại Hãn cũng phải được coi là một mối đe dọa cực kỳ lớn."
 enclave.250.desc:0 "Bão Xám phụ thuộc vào hai loại vũ khí hỗ trợ lẫn nhau: Chùm tia Năng lượng và Phi cơ Tàu sân bay. Loại thứ nhất có thể bị khiên chống đỡ, nhưng khiên sẽ bị phi cơ tàu sân bay vượt qua. Mô hình dự đoán của chúng tôi cho thấy việc bổ sung phòng thủ điểm vào khiên có thể gia tăng đáng kể khả năng sống sót của phi thuyền trong giao tranh. Phi thuyền Nanite được bảo vệ rất tốt, nhưng ngư lôi có thể phá vỡ hàng phòng thủ của chúng."
 enclave.255.desc:0 "Hạm đội Prethoryn Scourge sử dụng vũ khí động học có tốc độ chậm và chiến thuật bầy đàn với phi thuyền cỡ nhỏ để áp đảo kẻ thù. Một trong những lựa chọn phòng thủ là sử dụng phòng thủ điểm, kết hợp với lá chắn và tăng cường độ bền cho thân tàu; một lựa chọn khác là giao chiến ở cự ly xa. Với vũ khí năng lượng đủ mạnh, bạn có thể tiêu diệt hạm đội của địch trước khi chúng kịp tiến vào tầm tấn công."
 enclave.260.desc:0 "Kẻ Xuyên Không dựa dẫm hoàn toàn vào năng lượng để chiến đấu, đây là một điểm yếu rõ ràng mà chúng ta có thể lợi dụng. Những vũ khí có khả năng gây sát thương tăng cường lên khiên của chúng sẽ phát huy sức mạnh hủy diệt, mặc dù nếu trang bị vũ khí có thể vượt qua khiên hoàn toàn, thì chúng cũng sẽ chẳng tồn tại được lâu trong chiều không gian này. Về mặt phòng thủ, bạn nên trang bị khiên trong chiến đấu để khắc chế hoàn toàn chùm năng lượng của kẻ địch."
 enclave.265.desc:0 "Phi thuyền của Giao Thức Thanh Trừng hoàn toàn sử dụng vũ khí năng lượng - vậy nên tốt nhất là dùng khiên để giảm sát thương phải chịu. Kết quả mô phỏng cho thấy dù phi thuyền Giao Thức Thanh Trừng có chỉ số phòng thủ rất cao, thân tàu của chúng lại khá mỏng manh. Chuyên gia phân tích của chúng tôi nhận định các vũ khí có tính xuyên thấu có thể sẽ đem lại hiệu quả vượt trội trong các trận chiến với Giao Thức Thanh Trừng."
 enclave.266.desc: "Phi thuyền của Cetana phụ thuộc vào vũ khí năng lượng tầm xa, sát thương cao và lớp lá chắn có thể tái tạo vững chắc. Chúng rất giỏi trong việc bắn hạ những mục tiêu lớn, vì vậy tốt nhất bạn nên dùng một bầy phi cơ nhỏ để quấy rối chúng. Ngư lôi hoặc vũ khí năng lượng là đủ để đối phó với hạm đội của ả, trang bị đủ khiên cho tàu của bạn có thể giúp chúng sống sót lâu hơn."

 enclave.270.desc:0 "Bạn có dự định bình định một thuộc địa hay tiễu trừ khủng bố không? Dịch vụ hỗ trợ liên hành tinh của chúng tôi có thể cung cấp các chuyên gia được đào tạo bài bản trong một tổ chức bài bản, họ luôn sẵn sàng làm việc trong những môi trường đầy rủi ro và thử thách để giúp bạn vãn hồi trật tự cho thiên hà."
 enclave.270.a:0 "Một toán lính đánh thuê nhỏ"
 small_merc_army_hire:0 "Đám lính đánh thuê này được thuê vô thời hạn, nhưng có phí bảo trì cao. Quân đội này bao gồm §Y5 Đạo Lục Quân Lính Đánh Thuê§!"
 enclave.270.b:0 "Một đội lính đánh thuê tinh nhuệ cơ giới hóa nhỏ."
 small_mecha_merc_army_hire:0 "Đám lính đánh thuê này được thuê vô thời hạn, nhưng có phí bảo trì cao. Quân đội này bao gồm §Y5 Đạo Lục Quân Lính Đánh Thuê Cơ Giới Hóa§!"
 enclave.270.c:0 "Một lực lượng lính đánh thuê đông đảo."
 medium_merc_army_hire:0 "Đám lính đánh thuê này được thuê vô thời hạn, nhưng có phí bảo trì cao. Quân đội này bao gồm §Y10 Đạo Lục Quân Lính Đánh Thuê§!"
 enclave.270.d:0 "Một tổ đội lính đánh thuê tinh nhuệ cơ giới hóa."
 medium_mecha_merc_army_hire:0 "Đám lính đánh thuê này được thuê vô thời hạn, nhưng có phí bảo trì cao. Quân đội này bao gồm §Y10 Đạo Lục Quân Lính Đánh Thuê Cơ Giới Hóa§!"
 enclave.270.e:0 "Một đạo quân lính đánh thuê lớn."
 large_merc_army_hire:0 "Đám lính đánh thuê này được thuê vô thời hạn, nhưng có phí bảo trì cao. Quân đội này bao gồm §Y15 Đạo Lục Quân Lính Đánh Thuê§!"

 enclave.280.a.desc:1 "Kính chào nhà tài trợ! Ngọn gió nào đưa ngài đến đây hôm nay? Ngài đã xem qua các bản thiết kế tàu mới nhất của chúng tôi chưa? Chúng sẽ là trọng tâm trong dịch vụ 'bảo mật cá nhân' hoàn toàn mới của chúng tôi dành cho khách hàng dân sự."
 enclave.280.b.desc:0 "Thật vinh hạnh khi được đón tiếp ngài! Chúng tôi đã chuẩn bị sẵn một vài món ăn nhẹ, hy vọng trong lúc triệu tập ban giám đốc, những món này có thể thay cho chút lòng thành. Nếu ngài hướng sự chú ý về phía cửa sổ, ngài sẽ thấy một đơn vị gìn giữ hòa bình của chúng ta đang trong phiên diễn tập. Hình nộm được dùng để đại diện cho dân thường. Hãy chú ý cách họ tập trung người dân lại và sắp xếp ổn thỏa. Đúng là một phép màu về sự tỉ mỉ trong quân sự."
 enclave.280.c.desc:0 "Chúng tôi luôn hân hoan khi được gặp gỡ các nhà tài trợ. Xin ngài hãy yên tâm, khoản cổ tức tiếp theo sẽ sớm được chuyển đến tay ngài. Ngài có phiền chia sẻ với chúng tôi về phạm vi kinh doanh mới mà chúng tôi đang triển khai trong lĩnh vực bảo vệ khỏi các hậu quả nghiêm trọng không? Chúng tôi tin chắc rằng những khách hàng dân sự sẽ rất chuộng các dịch vụ này!"
 enclave.280.b:1 "Chúng ta muốn anh §Ygọi lại§! hạm đội của mình."
 enclave.280.c:0 "Chúng ta rất sẵn lòng chia sẻ §Ycông nghệ§! của mình với anh."
 enclave.280.c.timeout:0 "Thành bang này vẫn đang sử dụng công nghệ của chúng ta để nâng cấp. Chúng ta có thể chia sẻ công nghệ mới với họ sau §Y[event_target:mercenary_enclave_country.updating_databanks_timer]§!."
 enclave.285.desc:2 "Ngài hẳn phải hiểu việc thu hồi một hạm đội là một vấn đề vô cùng nhạy cảm. Dĩ nhiên, chúng tôi đã chuẩn bị sẵn các kẽ hở điều khoản trong tất cả các mẫu hợp đồng, nhưng chúng tôi cần ít nhất sáu tháng để điều động hạm đội quay trở lại, và còn phải trả một khoản bồi thường kếch xù để tránh làm phật lòng khách hàng hiện tại.\n\nChúng tôi cho rằng hành động này không mang lại lợi ích cao nhất cho tổ chức của mình, nhưng ngài là nhà tài trợ của chúng tôi - nếu ngài muốn, chúng tôi sẵn sàng tuân lệnh."
 enclave.285.tooltip:0 "Hành động này sẽ chọc giận thực thể biệt lập."
 enclave.290.name:1 "Hạm Đội Bị Trưng Dụng Đã Đến"
 enclave.290.desc:1 "Hạm đội lính đánh thuê mà chúng ta trưng dụng nay đã sẵn sàng chờ lệnh."
 enclave.294.name:1 "Thông Báo Ngừng Việc"
 enclave.294.desc:1 "Thưa quý khách,\n\nTheo điều khoản 285b.15 trong hợp đồng của chúng ta, chúng tôi rất tiếc phải thông báo rằng chúng tôi dự định kết thúc sớm các dịch vụ liên quan và thu hồi hạm đội mà ngài đã thuê từ chúng tôi. Theo quy định thông thường của hợp đồng: thông báo này sẽ được gửi tới ngài trước ba tháng để báo trước, sau đó chúng tôi mới ngừng phục vụ. Ngoài ra, chúng tôi sẽ cung cấp cho ngài một khoản bồi thường hậu hĩnh tương xứng.\n\nChúng tôi xin lỗi vì sự bất tiện này và mong ngài sẽ tiếp tục gặp nhiều may mắn trong những nỗ lực tương lai."
 enclave.294.b:1 "Chúng ta rất cần những con tàu này!"

 enclave.2030.desc:1 "Dịch vụ hậu cần của chúng tôi có thể giúp ngài triển khai hạm đội đến tận những rìa xa xôi nhất của thiên hà. Những chuyên gia lão luyện của chúng tôi sẽ đảm bảo rằng con tàu của ngài được trang bị đầy đủ mọi thứ cần thiết, từ đạn dược, thức ăn, cho đến cả những chiếc đinh tán dùng cho bộ điều chỉnh nhiệt độ của ngài. Hơn thế nữa, chúng tôi sẽ triển khai trước các kho tiếp tế trên đường đi của hạm đội, hoặc ký kết hợp đồng cung cấp lương thực với các công ty dân sự địa phương. Con tàu của ngài xứng đáng được bảo dưỡng ở mức độ cao nhất, và chúng tôi luôn sẵn sàng cung cấp dịch vụ đó."
 enclave.2035.name:0 "Chấm Dứt Thỏa Thuận Hỗ Trợ Hậu Cần"
 enclave.2035.desc:1 "Thưa quý khách,\n\nDịch vụ hỗ trợ hậu cần mà chúng tôi cung cấp cho ngài đã hết hạn và cần được gia hạn. Theo điều khoản trong hợp đồng của chúng ta: Nếu chúng tôi không nhận được chỉ thị nào khác, ngài sẽ tự động gia hạn dịch vụ này và bị tính phí tương ứng.\n\nChúng tôi tin rằng ngài hài lòng với dịch vụ của chúng tôi và mong muốn được hợp tác kinh doanh nhiều hơn với ngài."
 enclave.2035.a:0 "Chúng ta hiện tại không cần dịch vụ này nữa."
 enclave.2060.name:0 "Hợp Đồng Hạm Đội Hết Hạn"
 enclave.2060.desc:0 "Hợp đồng của chúng ta với [event_target:mercenary_enclave_country.GetName] đã hết hạn, hạm đội của họ sắp rời đi. Liệu chúng ta có nên liên lạc với họ để gia hạn hợp đồng không?"
 enclave.2060.a:0 "Lần này thì thôi."
 enclave.2060.b:0 "Đúng, mở kênh liên lạc."

