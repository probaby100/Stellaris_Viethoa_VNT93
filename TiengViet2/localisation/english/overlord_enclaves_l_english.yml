 master_salvager_already_bought: "§RChúng ta đã trả tiền cho sự phục vụ của $master_salvager$.§!"
 master_salvager_explanation: "\nChúng ta sẽ thuê một sĩ quan khoa học cấp 5 có đặc điểm §Y$leader_trait_master_salvager$§!."

 enclave.360.name:0 "Thu Hoạch Tái Chế"
 enclave.360.intro:0 "Một sà lan chở hàng đến từ §Y[salvager_enclave_country.GetName]§! vừa cập bến, chở theo một đợt tài nguyên tái chế."
 enclave.360.a.desc:1 "$enclave.360.intro$\n\nĐội ngũ trục vớt có đính kèm một bức thư cảm ơn cùng lô hàng, và một món quà hữu hình - một loại tác phẩm nghệ thuật động. Cách nó chuyển động trong trường trọng lực nhân tạo của chúng ta gây bất an nhưng cũng khá cuốn hút."
 enclave.360.b.desc:1 "$enclave.360.intro$\n\nĐại diện đơn vị vận chuyển hàng hóa liên tục bày tỏ lòng biết ơn thay mặt cho các thợ trục vớt, cho đến khi anh ta đứng sững lại trước tấm chắn động cơ của tàu kéo hàng của chúng ta. Rất tiếc, trước khi dỡ hàng xong, chúng ta buộc phải mời người đàn ông đầy nhiệt huyết, ngập tràn sự hiếu kỳ này rời đi."
 enclave.360.c.desc:0 "$enclave.360.intro$\n\nĐược bao bọc trong lô hàng là một cơ sở dữ liệu về §Hbản thiết kế§!, dù được vẽ khá vội nhưng từng chi tiết đều chính xác. Có vẻ như tác giả của tác phẩm này hoặc là đang vô cùng phấn khích trước phát hiện của mình, hoặc là đang nghiên cứu một hình thức sơ đồ giáo dục nào đó.\n\nDù là trường hợp nào, [salvager_enclave_country.GetName] đã trình báo nghiên cứu của cá nhân này cho chúng ta sử dụng, kèm theo lời ngợi khen của họ."
 enclave.360.d.desc:0 "$enclave.360.intro$\n\nNhân viên giao hàng tỏ ra rất căng thẳng; có thể thấy anh ta chỉ muốn chuồn đi làm việc khác. Tên [salvager_enclave_country.GetSpeciesName] tinh quái này có vẻ đang vội vàng muốn tống khứ đống đồ tiếp tế thực phẩm cho chúng ta. Quả thật, những thực phẩm được giao đến này có bao bì rất tinh xảo - gần giống như đồ thay thế được sản xuất ở những nơi đặc thù."
 enclave.360.e.desc:0 "$enclave.360.intro$\n\nNhân viên giao hàng tỏ ra rất căng thẳng; có thể thấy anh ta chỉ muốn chuồn đi làm việc khác. Tên [salvager_enclave_country.GetSpeciesName] tinh quái này rất cung kính giao cho chúng ta đủ loại §Hbản thiết kế§! thu thập được trong chuyến đi trục vớt lần này. Tuy nhiên, khi giao nhận lương thực tiếp tế, hiện trường lại diễn ra vô cùng vội vã.\n\nQuả thật, dù chưa được kiểm chứng, người ta đã nhìn thấy những sinh vật không gian có vẻ ngoài tương tự gần đây xuất hiện trong hệ sao [salvager_enclave_system.GetName]..."

 enclave.365.name:0 "Ủy Thác Trục Vớt"
 enclave.365.desc:0 "Một chiếc sà lan chuyển phát nhanh xuất phát từ §Y[salvager_enclave_country.GetName]§! đã cập bến với đầy ắp các bản thiết kế cùng một lượng nhỏ tài nguyên! Tất cả những thứ này đều được trục vớt từ các đống đổ nát.\n\nNgười hoa tiêu của sà lan này ngoài việc lịch sự cảm ơn sự chiếu cố của chúng ta ra thì rất kiệm lời. Không khí của buổi giao nhận diễn ra vô cùng trang trọng."
 enclave.365.a:0 "Làm tốt lắm."
 enclave.365.b:0 "Đồ ngốc đáng yêu."
 enclave.365.tt:0 "Chúng ta sẽ nhận được:"
 enclave.365.d:0 "Gọi cho họ! Miễn là họ muốn mảnh vỡ, chúng ta có thể cung cấp bao nhiêu cũng được."

 enclave.375.name:0 "Nghiệp Đoàn Trưng Thu Phế Liệu Bị Tiêu Diệt"
 enclave.375.desc:0 "Cuộc tấn công của chúng ta tại hệ sao [salvager_system.GetName] đã thành công rực rỡ. [FROM.GetName] đã bị tiêu diệt, những kẻ sống sót ít ỏi đã bỏ chạy vào không gian sâu thẳm. Do cơ sở vật chất của chúng đã bị phá hủy hoàn toàn, dịch vụ tồi tàn của chúng cũng đã lui vào dĩ vãng. Bóng dáng của đám người này sẽ không bao giờ xuất hiện trong thiên hà nữa."
 enclave.380.desc:0 "Chúng ta nhận được báo cáo rằng thực thể biệt lập của [FROM.GetName] trong hệ sao [salvager_system.GetName] đã bị phá hủy. Những kẻ tấn công xuất quỷ nhập thần, chỉ trong nháy mắt đã biến các cơ sở của thợ trục vớt thành một đống đổ nát. Những kẻ sống sót ít ỏi đã tháo chạy tứ tán, có vẻ như bây giờ toàn bộ thiên hà phải học cách làm quen với một cuộc sống mới không có sự phục vụ của chúng."

 requires_salvager_enclave:0 "§RCần có một §YNghiệp Đoàn Trưng Thu Phế Liệu§! trong hệ sao.§!"
 requires_salvager_agreement:0 "§RCần có §YThỏa thuận Ngoại giao§! với Nghiệp Đoàn Trưng Thu Phế Liệu địa phương.§!"
 salvager_scrap_fleet_cooldown:1 "Chúng ta chỉ có thể mua lại dịch vụ này sau §H[root.salvager_scrap_timer]§!."
 requires_reclaimable_vessels:1 "Chúng ta đã bắt gặp các đế quốc khác sử dụng những thiết kế phi thuyền có thể trục vớt."
 salvager_reclaimed_vessel_cooldown:0 "Có phi thuyền để mua (Dự kiến kho hàng mới sẽ được cập nhật sau §H[root.reclaimed_vessel_timer]§!)."
 requires_salvage_works:1 "Cần một §Y$sm_salvager_workshop$§!."
 salvager_overdrive_cooldown:1 "Chúng ta chỉ có thể mua lại dịch vụ này sau §H[root.salvager_overdrive_timer]§!."
 one_salvage_commission_only:1 "£trigger_no£Chúng ta chỉ có thể ký kết §Hmột§! ủy thác trục vớt cùng một lúc."
 requires_debris_field:1 "Hiện tại chúng ta chưa tuyên bố sở hữu bất kỳ §Ybãi mảnh vỡ§! nào."
 salvager_insight_cooldown:1 "Chúng ta đã sở hữu điểm sửa đổi §YTầm Nhìn Trưng Thu Phế Liệu§!."

 salvager_tt_scrapfleet:1 "Giao nhiệm vụ cho thợ trục vớt, chuyển đổi một hạm đội do chúng ta chọn thành £alloys£ §Y$alloys$§!."
 salvager_tt_reclaimedvessel:0 "Mua các §Yphi thuyền§! được thiết kế dựa trên nguyên mẫu của đế quốc khác."
 salvager_tt_salvageworks:0 "Mua một §Ycông trình căn cứ sao§! độc đáo."
 salvager_tt_commissionsalvage:1 "Giao nhiệm vụ cho thợ trục vớt điều tra §Ymảnh vỡ§! thay cho chúng ta. Chúng ta sẽ nhận được £engineering_research£ §YNghiên cứu§! và £alloys£ §Y$alloys$§!."

 # Shroudwalker Enclaves
 enclave.405.name:1 "[shroudwalker_enclave_country.GetName]"
 enclave.405.generic.a.desc:1 "A ha! Một vị khách viếng thăm. Xin nhiệt liệt chào mừng.\n\nChúng tôi là §H[shroudwalker_enclave_country.GetName]§!. Trong thân tàu sinh ra giữa khoảng không vũ trụ này, hội nữ tu của chúng tôi bàn luận về những sức mạnh vượt ngoài tầm hiểu biết của người phàm. Chúng tôi suy ngẫm về những bí mật ẩn giấu trong những giấc mơ, tìm kiếm nơi cất giấu nguồn sức mạnh tâm linh nguyên thủy, chiêm ngưỡng những bánh răng vô hình dẫn dắt toàn bộ nền văn minh... §YTấm Màn Tâm Linh§! hé lộ vô vàn bí ẩn cho những ai biết lắng nghe.\n\nNgay lúc này, tôi đang lắng nghe ngài. Ngọn gió nào đã đưa ngài tới đây? Ngài đã thấu tỏ điều gì chưa?"
 enclave.405.generic.n.desc:0 "Chào mừng trở lại, vị khách viếng thăm. Chúng tôi đã đợi ngài từ lâu."
 enclave.405.generic.o.desc:0 "Rất nhiều nền văn minh đều lưu truyền cùng một câu chuyện, rằng sâu thẳm trong những hầm mỏ tăm tối có những thực thể đen tối ẩn nấp. Vậy thưa ngài, ngài có bao giờ tự hỏi, bên dưới những tầng lớp thực tại của chúng ta có gì đang ẩn giấu?"
 enclave.405.generic.p.desc:0 "Chúng ta đều biết một câu tục ngữ:\n'Những gì bị gió cuốn vào rồi cũng sẽ bị mưa gột sạch.'\nĐối với nhiều cư dân sống trên những hành tinh đoản mệnh, đây được coi là một lời an ủi...\n\nNhưng ở thế giới mà chúng ta gọi là Tấm Màn Tâm Linh, không hề có thứ thời tiết như vậy."
 enclave.405.psionic.a.desc:0 "A ha, người bạn đồng hành của thế giới bất khả tri! §H[shroudwalker_enclave_country.GetName]§! chúng tôi hoan nghênh ngài và coi ngài là một người bạn.\n\nXin thứ lỗi cho phương thức giao tiếp có phần thấp kém này. Lời cầu nguyện tâm linh mãnh liệt mà chúng tôi thực hành, e rằng chỉ có thể được thực hiện dựa trên hàng rào và đường dẫn thần giao cách cảm đáng sợ. Do đó, chúng tôi chỉ có thể đón nhận một cái nhìn lướt qua về tư tưởng từ thế giới vật chất.\n\nVậy nên tôi không khỏi tò mò: Ngọn gió nào đã đưa ngài tới đây?"
 enclave.405.psionic.n.desc:0 "Người bạn đồng hành của chúng ta đã trở lại rồi! Rất vui được gặp lại ngài. Chúng tôi đã chờ đợi ngài từ lâu."
 enclave.405.psionic.o.desc:0 "Trong tất cả những tín điều mà §H[shroudwalker_enclave_country.GetName]§! chúng tôi tin tưởng, hiếm có tín điều nào kiên định hơn điều này: Ngay cả khi có vị thế cao quý như chúng tôi, chắc chắn chúng tôi vẫn có thể tìm thấy những người bạn đồng hành trong biển sao.\n\nVậy, người bạn thăng thiên của tôi: Chúng ta có thể làm gì cho nhau?"
 enclave.405.hostile.a.desc:0 "Kẻ xâm nhập, sự thù địch của ngươi bao phủ lấy ngươi như một làn chướng khí hôi thối. Chúng ta là một hiệp hội yêu chuộng hòa bình, nhưng ngươi nên biết rằng: Nếu ngươi muốn gieo rắc đau khổ cho chúng ta, ngươi sẽ nhận ra hành động ngu xuẩn đó sẽ bị đáp trả gấp mười lần. Chúng ta là §H[shroudwalker_enclave_country.GetName]§!, dù cho chúng ta có vẻ ngoài nằm ngoài tầm với, nhưng cơn thịnh nộ của chúng ta sẽ hủy diệt tất cả."
 enclave.405.desc.mindwardens: "Ngươi đúng là thùng rỗng kêu to.\n\nChúng ta từ chối hợp tác với những kẻ sợ hãi §HTấm Màn Tâm Linh§!. Nhận thức hạn hẹp của các ngươi về vũ trụ cuối cùng sẽ khiến tất cả chúng ta tụt lùi."
 enclave.405.desc.mindwardens_trust: "Thành kiến ngu dốt của [mindwarden_enclave_country.GetName] đã đầu độc tâm trí của ngươi. Thật trớ trêu làm sao...\n\nChúng ta tuyệt đối sẽ không bàn chuyện tương lai với những kẻ dây dưa với bọn ngu ngốc đó."
 enclave.405.desc.end_of_the_cycle: "'Các ngươi đã đánh thức một nỗi kinh hoàng vượt qua sự hiểu biết của mình, nó đã tuyên cáo ngày tàn của thiên hà.\n\nChúng ta không muốn đối mặt với thứ điên rồ như vậy. Tránh xa chúng ta ra!'"
 enclave.405.a:1 "§YVận mệnh§! của chúng ta sẽ ra sao?"
 enclave.405.b:2 "Các người có sẵn lòng cử một §Yngười hướng dẫn§! từ giáo phái đến không?"
 enclave.405.c:1 "Các người có thể cung cấp cho chúng ta vài §Ykiến giải§! về các đế quốc khác không?"
 enclave.405.c.tt:1 "Chúng ta cần đạt đánh giá ít nhất §Y20§!£opinion£ với §Y[shroudwalker_enclave_country.GetName]§! mới có thể yêu cầu họ cung cấp §Ytầm nhìn§!."
 enclave.405.c.tt.2:1 "Chúng ta cần một mạng lưới gián điệp đang hoạt động để có thể yêu cầu §Y[shroudwalker_enclave_country.GetName]§! cung cấp hướng dẫn về các công tác chuẩn bị hành động bí mật của chúng ta."
 enclave.405.d:1 "Hãy cho chúng tôi biết cách §Ydu hành§! qua Tấm Màn Tâm Linh."
 enclave.405.d.tt:1 "Chúng ta cần đạt đánh giá ít nhất §Y30§!£opinion£ với §Y[shroudwalker_enclave_country.GetName]§! mới có thể dò hỏi về chuyện §YNgọn Hải Đăng Tấm Màn Tâm Linh§!."
 enclave.405.e:0 "Các người có thể dạy chúng ta cách khai thác §YZro§! không?"
 enclave.405.e.tt:0 "Chúng ta cần đạt đánh giá ít nhất §Y50§!£opinion£ với §Y[shroudwalker_enclave_country.GetName]§! mới có thể dò hỏi về chuyện khai thác §YZro§!."
 enclave.405.f:0 "Chúng tôi đã gặp một người tự xưng là §Y'Lữ Khách Che Mặt'§!..."
 enclave.405.g: "Mở một §YVết Nứt Không Gian§!."
 enclave.405.g.tt: "Trước khi có thể mở một §YVết Nứt Không Gian§!, chúng ta cần đạt đánh giá trên §Y50§!£opinion£ với §Y[shroudwalker_enclave_country.GetName]§!."
 enclave.405.h: "Giúp chúng ta khai mở §Ytâm trí§!."
 enclave.405.h.tt: "Trước khi có thể khai mở tâm trí, chúng ta cần đạt đánh giá trên §Y90§!£opinion£ với §Y[shroudwalker_enclave_country.GetName]§!."
 enclave.405.i: "Chúng ta sẽ khám phá sự vi diệu của §YTấm Màn Tâm Linh§!."

 enclave.410.desc:1 "A ha, một câu hỏi quan trọng - và mức độ sâu sắc cũng không hề kém cạnh so với những câu hỏi của tiền nhân. Một câu hỏi như vậy có cái giá không hề nhỏ, nhưng chúng tôi có thể giải đáp.\n\nTuy nhiên, ngài cần phải biết: Tấm Màn Tâm Linh cho phép chúng tôi nhận biết được các sự kiện chưa xảy ra, và những kiến thức này sẽ đóng vai trò dẫn lối cho con đường của ngài. Nhưng bất kỳ một sự kiện đơn lẻ nào cũng không đủ để làm lung lay sự vận hành của cả thiên hà.\n\nNếu ngài có ý định thực hiện giao dịch này, thì thay vì mở rộng tham vọng, ngài nên chuẩn bị kỹ càng hơn. Nhưng mà, ôi chao, ngay cả một cái nhìn thoáng qua nhỏ bé nhất về tương lai sắp xảy ra cũng có thể là nền tảng để xây dựng nên những kế hoạch vĩ đại nhường nào..."
 enclave.410.a:0 "Chúng ta sẽ cân nhắc chuyện khác."
 enclave.410.b:0 "Chúng ta sẽ trả giá."
 enclave.415.desc:1 "Tấm Màn Tâm Linh đang run rẩy. Tại khoảnh khắc đó, nó dường như tĩnh lặng không nói, nhưng lại giải bày tất cả. Những sợi tơ thời gian vô tận đâm chồi nảy lộc từ chính giây phút này, hòa mình vào dòng chảy bất tận. Tại nơi đây, chốn này, con đường phía trước đang dần tỏ rạng. Nghi thức tiên tri đã bắt đầu."
 enclave.415.tt:0 "§Y[shroudwalker_enclave_country.GetName]§! sẽ rời đi vài ngày để trò chuyện lâu dài với Tấm Màn Tâm Linh."

 #Divination Finished
 enclave.416.name:0 "Dấu Hiệu Phai Tàn"
 enclave.416.desc:0 "'Tấm Màn Tâm Linh đã trở nên tĩnh lặng. Một lần nữa, dòng sông thời gian mệt mỏi lại quay về với dòng chảy cũ kỹ của nó. Sự thay đổi mà nghi thức tiên tri báo cáo đã trở thành dĩ vãng. Giờ hãy mang theo sự kính sợ rời khỏi nơi đây, vì ngươi đã ánh xạ được nghiệp báo của Tấm Màn Tâm Linh.'"

 enclave.420.desc:2 "Thiên hà này tăm tối vô ngần, nguy hiểm rình rập khắp mọi nơi. Để thắp sáng nẻo đường cho những người hành hương, chúng tôi cung cấp §HNgọn Hải Đăng Tấm Màn Tâm Linh§!. Một khi được lắp đặt trên một trong những căn cứ sao của ngài, ánh sáng của nó có thể xuyên thủng mọi thứ; ngay cả lớp sương mù mờ ảo mà một số người gọi là thực tại. Mạng lưới đường đi mà nó tỏa ra có thể xuyên qua Tấm Màn Tâm Linh, cung cấp cho các phi thuyền phàm trần một phương tiện để vượt qua cả không thời gian rộng lớn và di chuyển đến những khoảng cách xa xôi.\n\nHãy lựa chọn vị trí đặt ngọn hải đăng của ngài một cách cẩn trọng - Đường Hầm Tấm Màn Tâm Linh một khi được tạo ra thì không thể bị xóa bỏ, và ngài cũng không có cách nào triệu hồi một ngọn hải đăng khác.\n\nNgài cần phải khắc cốt ghi tâm những lời này: Đường Hầm Tấm Màn Tâm Linh không phải là một con đường bình thường, ngay cả chúng tôi cũng không thể dự đoán được hậu quả của việc sử dụng phương tiện này."
 enclave.420.a:0 "$enclave.410.a$"
 enclave.420.b:0 "Chúng tôi muốn một §YNgọn Hải Đăng Tấm Màn Tâm Linh§!."
 shroud_beacon_info:1 "Cho phép xây dựng một §HNgọn Hải Đăng Tấm Màn Tâm Linh§! trên một trong các căn cứ sao của phe mình. Khi hoàn thành, một §HĐường Hầm Tấm Màn Tâm Linh§! sẽ được tạo ra trong hệ sao và cung cấp một đường hầm hai chiều dẫn đến §Yhệ sao [shroudwalker_enclave_system.GetName]§!. Chúng ta chỉ có thể tạo ra một Đường Hầm Tấm Màn Tâm Linh; vì vậy, hãy chọn vị trí của hệ sao một cách cẩn thận."
 enclave.425.desc:1 "Một tiếng thì thầm truyền vào nhận thức của chúng tôi: Con đường của Tấm Màn Tâm Linh mờ ảo và biến hóa khôn lường. Nguyện cho ngọn hải đăng này sẽ thắp sáng con đường phía trước của ngài."

 enclave.435.name:0 "Hội Chiêm Tinh Màn Che Bị Tiêu Diệt"
 enclave.435.desc:0 "Thắng lợi lớn mạnh tại hệ sao [shroudwalker_system.GetName]! Đội quân của chúng ta đã quét sạch đám được gọi là pháp sư thần bí [FROM.GetName] nhanh như chớp. Bất chấp những lời lẽ hùng hồn cả ngày về kiến thức và sức mạnh, sự cống hiến mù quáng của chúng dành cho Tấm Màn Tâm Linh cũng không thể giúp chúng lường trước được cuộc tấn công của chúng ta. Trên thực tế, quân đội của chúng ta đã dễ dàng chọc thủng hàng phòng thủ cơ giới của các cơ sở. Tuy nhiên, sau khi tiến vào, họ nhận ra toàn bộ thực thể biệt lập trống trơn, chỉ có một vị tùy tùng đơn độc đang thiền định trong một căn phòng hẻo lánh. Chúng ta không có cách nào để biết những kẻ còn lại đã trốn đi đâu, nhưng thiên hà này cuối cùng cũng đã rũ bỏ được những giáo điều trống rỗng đó."
 enclave.440.desc:1 "Các báo cáo truyền về chủ yếu xoay quanh sự diệt vong của [FROM.GetName] diễn ra tại hệ sao [shroudwalker_system.GetName]. Đội quân xâm lược đã hành động với tốc độ cực nhanh trong chiến dịch này, biến các cơ sở của Hội Chiêm Tinh Màn Che thành một đống tàn tích. Thật khó tin rằng những bậc thầy thần bí này lại không tiên đoán được kết cục của chính mình. Hay là, tấn bi kịch này chỉ là một phần trong một kế hoạch khổng lồ hơn? Ai có thể nói chắc được chứ? Dẫu vậy, không có sự phục vụ của họ, tương lai vẫn còn bao phủ trong màn sương mù dày đặc."

 requires_not_shroudwalker_system:0 "§RKhông thể xây dựng trong một hệ sao chung với §YHội Chiêm Tinh Màn Che§!.§!"
 requires_no_bypass:0 "§RKhông thể xây dựng trong một hệ sao đã có lỗ sâu.§!"
 limit_one_shroud_tunnel:0 "§RChúng ta chỉ có thể duy trì §Ymột§! Đường Hầm Tấm Màn Tâm Linh cùng một lúc.§!"
 requires_shroudwalker_agreement:0 "§RCần có §YThỏa thuận Ngoại giao§! với Hội Chiêm Tinh Màn Che.§!"
 shroudwalker_divination_cooldown:0 "§RChúng ta chỉ có thể trải qua một lần §!§YTiên Tri§! cùng một lúc."
 shroudwalker_divination_cooldown_two:0 "§RNhững Hội Chiêm Tinh Màn Che không thể tiến hành một §YNghi thức Tiên tri§! khác trước §Y[root.shroudwalker_divination_timer]§!.§!"

 SHROUD_TUNNEL_GALACTIC:0 "Đường Hầm Tấm Màn Tâm Linh"
 SHROUD_TUNNEL_GALACTIC_DESC:1 "Hệ sao này chứa một §YĐường Hầm Tấm Màn Tâm Linh§!"
 BYPASS_SHROUD_TUNNEL:0 "$SHROUD_TUNNEL_GALACTIC$"
 BYPASS_NAME_SHROUD_TUNNEL:0 "Đường Hầm Tấm Màn Tâm Linh $SYSTEM$"
 ENTRY_BYPASS_SHROUD_TUNNEL: "Tiến vào $BYPASS_TYPE$"
 EXIT_BYPASS_SHROUD_TUNNEL: "Rời khỏi $BYPASS_TYPE$"

 ################################
 # DIVINATION (SITUATION) EVENTS
 ################################

 divination_monthly_change_tooltip:0 "Tiến độ của §YTình thế§! này phụ thuộc rất nhiều vào mối quan hệ của chúng ta với các đế quốc khác. Ví dụ, thiết lập §YQuan điểm Ngoại giao§! thành §YHợp tác§! sẽ đẩy nhanh tiến độ."

 divination_visitors:0 "Dấu Hiệu Từ Những Vị Khách"
 divination_visitors_type:0 "Tiên Tri"
 divination_visitors_desc:0 "Theo ý chí của Tấm Màn Tâm Linh, thế giới của các ngươi sẽ được viếng thăm. Những người ngoài này liệu có mang đến tin dữ hay không vẫn là một bí ẩn cần được làm rõ."
 divination_visitors_embrace:1 "Chúng ta tự mình truy lùng những vị khách này, đón nhận ý chí của Tấm Màn Tâm Linh"
 divination_visitors_denied:1 "Chúng ta từ chối cho khách vào lãnh thổ của mình, làm trái ý chí của Tấm Màn Tâm Linh"
 divination_visitors_monthly_change_tooltip:0 "$divination_monthly_change_tooltip$"

 divination_locus:0 "Dấu Hiệu Quỹ Đạo"
 divination_locus_type:0 "$divination_visitors_type$"
 divination_locus_desc:0 "Theo ý chí của Tấm Màn Tâm Linh, không gian quanh bạn đang mang một dáng vẻ mới. Hãy bước đi cẩn trọng nhưng dũng cảm, bởi con đường phía trước có thể ẩn chứa những điều kỳ diệu."
 divination_locus_embrace:1 "Chúng ta sẽ khám phá những con đường này, đón nhận ý chí của Tấm Màn Tâm Linh"
 divination_locus_denied:1 "Chúng ta sẽ ở yên và bảo vệ lãnh thổ của mình, làm trái ý chí của Tấm Màn Tâm Linh"
 divination_locus_monthly_change_tooltip:0 "$divination_monthly_change_tooltip$"

 divination_situation_end:0 "Sau khi gửi gắm lời tiên tri, [shroudwalker_enclave_country.GetName] sẽ thông báo cho chúng ta rằng Tấm Màn Tâm Linh đã trở lại yên bình."

 #Built first Shroud Beacon (non-Teachers origin)

 enclave.4200.name:0 "Hải Đăng Dẫn Tới Tấm Màn Tâm Linh"
 enclave.4200.desc:0 "Sau một khoảng thời gian dài vật lộn trong bóng tối, tấm rèm của Tấm Màn Tâm Linh cuối cùng cũng được vén lên. Mặc dù các nhà khoa học của chúng ta vẫn chưa hiểu rõ về nguyên lý vận hành kỳ lạ của Ngọn Hải Đăng Tấm Màn Tâm Linh, nhưng hệ thống vật lý của nó dường như bị vướng mắc với tâm linh, nó hoạt động gần giống như một sinh vật sống. Đường hầm mà nó tạo ra có vẻ không giống một lộ trình mà giống một lối tắt hơn, cung cấp cho phi thuyền của chúng ta một lối tắt siêu chiều để đi qua Tấm Màn Tâm Linh. Khám phá các vì sao giờ đây sẽ trở nên nhanh chóng hơn... và bí ẩn hơn rất nhiều."

 #Teachers of the Shroud origin - Crisis Events

 enclave.4240.name:0 "Sự Thức Tỉnh Cuối Cùng"
 enclave.4240.desc:0 "Hỡi các học trò, Tấm Màn Tâm Linh đã đưa ra lời cảnh báo. Một cơn khủng hoảng khổng lồ đang đến gần, toàn bộ thiên hà đang đứng bên bờ vực hủy diệt. Tiên tri của chúng ta cho thấy, sức mạnh của chính chúng ta không thể đương cự với mối đe dọa sắp ập đến. Thay vì chịu trận và bị diệt vong, chúng ta sẽ truyền thụ cho các ngươi bài học cuối cùng: Mọi giấc mộng rồi cũng sẽ có lúc tàn. Đã đến lúc chúng ta phải rời khỏi thế giới này. Mặc dù Tấm Màn Tâm Linh tối tăm và khó lường, chúng ta cuối cùng cũng sẽ thăng hoa đến một chiều không gian mới, một thế giới mới để tiếp tục gieo rắc giáo lý của mình. Chúng ta sẽ rời khỏi thiên hà này và giao phó vận mệnh của nó cho các ngươi. Hy vọng những bài học trước đây của chúng ta có thể hướng dẫn các ngươi khi cần thiết."
 enclave.4240.a:0 "Nguyện Tấm Màn Tâm Linh sẽ ở cùng các người."
 enclave.4240.b:0 "Làm sao các người có thể bỏ rơi chúng ta?"

 shroudwalkers_depart_reverence:0 "Tiếp Thu Bài Học"
 shroudwalkers_depart_reverence_desc:0 "Những người thầy của chúng ta chưa bao giờ khiến chúng ta thất vọng. Chúng ta chúc họ lên đường bình an trong chuyến đi cuối cùng."
 shroudwalkers_depart_anger:0 "Từ Chối Bài Học"
 shroudwalkers_depart_anger_desc:0 "Những người thầy của chúng ta đã bỏ rơi chúng ta. Chúng ta không còn cần những bài học này nữa."

 enclave.4243.name:0 "Một Lời Cảnh Cáo"
 enclave.4243.desc:1 "Hỡi các học trò, các ngươi đang dấn thân vào một con đường đầy rẫy hiểm nguy. Các ngươi nghĩ chúng ta, những người đã dạy dỗ các ngươi suốt hàng thế kỷ qua, lại không để mắt đến sao? Chúng ta dạy các ngươi về Tấm Màn Tâm Linh là để khai sáng, để thăng hoa. Nhưng điều này là sao? Quyền lực, bạo ngược, và một cuộc khủng hoảng do chính bàn tay các ngươi nhào nặn ra. Hãy khắc cốt ghi tâm những lời răn dạy của ta! Vũ trụ này rốt cuộc cũng chỉ là một cái bóng của giấc mộng. Vẫn chưa muộn đâu, hãy từ bỏ ngay những dã tâm lầm đường lạc lối này trước khi bị nó hủy hoại."
 enclave.4243.a:0 "Chúng ta đã trở thành thứ gì thế này?"
 enclave.4243.b:0 "Vận mệnh của chúng ta đã rất rõ ràng. Đừng có ngáng đường chúng ta."

 enclave.4245.name:0 "Thất Bại Của Nền Giáo Dục"
 enclave.4245.desc:0 "Bản thân Tấm Màn Tâm Linh đang run rẩy, mọi dấu hiệu đều chỉ ra sự diệt vong. Bao năm qua chúng ta đã dõi theo các ngươi, nhưng ngay cả chúng ta cũng không thể đoán trước được các ngươi lại có thể ngu ngốc đến mức độ này. Dục tốc bất đạt. Kẻ nào nôn nóng đoạt lấy quyền lực, kẻ đó tất sẽ đánh mất nó. Các ngươi đã quên bài học cốt lõi nhất: Tấm Màn Tâm Linh không phải là một nguồn tài nguyên để khai thác, mà là một bí ẩn để chiêm nghiệm. Nhưng sai lầm của học trò không liên quan gì đến người thầy. Thay vì phải chứng kiến sự thay đổi đáng ghê tởm của các ngươi, chúng ta thà rời khỏi thế giới này. Mặc dù con đường của Tấm Màn Tâm Linh mờ mịt và không ngừng biến hóa, nhưng cuối cùng chúng ta cũng sẽ tới một chiều không gian mới, một thế giới mới. Có lẽ ở nơi đó, chúng ta sẽ tìm thấy những học trò xứng đáng để truyền đạt giáo lý của mình.\n\nNguyện Tấm Màn Tâm Linh rủ lòng từ bi với các ngươi."
 enclave.4245.a:0 "Các người rời đi thật sáng suốt."
 enclave.4245.b:0 "Chúng ta từng là học trò. Nhưng giờ thì đến lượt chúng ta làm sư phụ rồi."

 ## Pionic Breach - Shroud Tunnel Event ##
 enclave.4250.name:0 "Vết Rách Tâm Linh"
 enclave.4250.desc:0 "Gần đây, trong quá trình đi qua Đường Hầm Tấm Màn Tâm Linh, chúng ta đã tạo ra một vết rách khổng lồ trong không-thời gian. Những luồng năng lượng tâm linh chưa từng có bắt đầu phun trào từ hệ sao... rồi hội tụ lại với nhau. Dữ liệu từ cảm biến lên xuống thất thường, đầy biến động, nhưng dường như nó đang dần biến thành một loại sinh vật Tấm Màn Tâm Linh nào đó. Khổng lồ, và chắc chắn là rất hung hăng."
 enclave.4250.a:0 "Thiên hà ngày càng trở nên nguy hiểm."
 enclave.4250.b:0 "Nguyện Thánh Linh phù hộ chúng ta..."
 enclave.4250.c:0 "Chúng ta phải nghiền nát nó thành cát bụi."
 enclave.4250.d:0 "Nếu có thể, chúng ta phải tránh mọi cuộc xung đột."

 #Shrouded - Divination event (Sign of the Locus)
 enclave.5055.name:0 "Lạc Lối Trong Tấm Màn Tâm Linh"
 enclave.5055.desc:0 "Sự thay đổi mà [shroudwalker_enclave_country.GetName] báo trước đã ứng nghiệm: sau một đợt dao động tâm linh ngoài dự kiến, [Root.GetName] đã bị lạc trong Tấm Màn Tâm Linh. Không gian và thời gian nổi lên như những con sóng khổng lồ, cuốn phăng chiếc phi thuyền. Vài giây sau, nó tiếp tục gửi về dữ liệu từ xa. Dữ liệu đó chứa một đoạn băng ghi hình bị méo mó về các thủy thủ, cơ thể họ liên tục biến đổi từng khoảnh khắc, xoắn vặn thành những hình thù mới kỳ dị.\n\nKể từ lúc đó, ảo ảnh hay 'bóng ma' của con tàu này thoắt ẩn thoắt hiện trên khắp không vực. Việc nghiên cứu hiện tượng này có thể giúp chúng ta thấu hiểu hơn về vận mệnh của con tàu và phi hành đoàn."
 enclave.5055.poi_1:0 "Con Tàu Tấm Màn Tâm Linh"
 enclave.5055.poi.desc:0 "Vị trí cuối cùng mà phi thuyền của chúng ta xuất hiện trước khi mất tích vào Tấm Màn Tâm Linh."
 shrouded_ship_discoveries:0 "Nghiên cứu Con Tàu Tấm Màn Tâm Linh"

 SHROUDED_SHIP_PROJECT:0 "Tàn Ảnh Kỳ Dị"
 SHROUDED_SHIP_PROJECT_DESC:0 "Những tàn ảnh dao động của tàu nghiên cứu bị lạc trong Tấm Màn Tâm Linh, thoắt ẩn thoắt hiện rải rác khắp hệ sao."

 enclave.5060.name:0 "Con Tàu Của Khái Niệm"
 enclave.5060.desc:0 "Chúng ta có thông tin mới nhất về chiếc tàu nghiên cứu bị lạc trong Tấm Màn Tâm Linh. Những tàn ảnh xuất hiện trên khắp hệ sao không phải là bản thân con tàu. Thay vào đó, các nhà khoa học của chúng ta miêu tả nó như một 'thực thể khái niệm'. 'Con tàu khái niệm' này tồn tại dưới dạng một bản thiết kế tâm linh, không có không gian. Hình dạng của con tàu sẽ gián đoạn và thay đổi liên tục dựa trên trạng thái tinh thần của người quan sát. Nghiên cứu hiện tượng này giúp chúng ta hiểu rõ hơn về mối liên hệ giữa nhận thức và không-thời gian, nhưng chúng ta vẫn chưa tiến thêm bước nào trong việc tìm lại chiếc tàu ban đầu. Tạm thời, chúng ta đành phải xem như nó đã lạc mất trong Tấm Màn Tâm Linh."

 enclave.5065.name:0 "Hình Dáng Cuối Cùng"
 enclave.5065.desc:0 "Con tàu nghiên cứu bị mất tích của chúng ta từng được cho là mãi mãi lạc trong Tấm Màn Tâm Linh đột nhiên lại xuất hiện. Mặc dù kích thước của con tàu đã thay đổi một cách tinh tế, thân tàu và các thành viên phi hành đoàn bên trong vẫn ở tình trạng tốt.\n\nCác thành viên phi hành đoàn mô tả trải nghiệm của họ trong Tấm Màn Tâm Linh giống như một giấc mơ kỳ quái và vụn vỡ. Theo thời gian, họ dần nhận ra mình có thể cùng kiến tạo một 'khái niệm chung' với môi trường xung quanh. Khi nhận thức về bản thân dần được phục hồi, các thành viên phi hành đoàn từng bước quay lại thế giới thực của chúng ta. Về cơ bản, họ đã thành công trong việc mơ thấy mình tồn tại trở lại."
 enclave.5065.a:0 "Chào mừng trở lại."

 #All Too Lucid
 enclave.5005.name:0 "Tỉnh Táo Quá Mức"
 enclave.5005a.desc:0 "$enclave.5005.intro$ Vào lúc giấc ngủ REM bắt đầu, loại thuốc này sẽ kích thích hệ viền của người dùng, dẫn đến trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005b.desc:0 "$enclave.5005.intro$ Loại thuốc này tạo ra một trạng thái giống như giấc ngủ, kích thích tầng dưới của tinh thể thần kinh, tạo ra trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005c.desc:0 "$enclave.5005.intro$ Loại thuốc này tạo ra một trạng thái giống như giấc ngủ, kích thích lục lạp thần kinh, tạo ra trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005d.desc:0 "$enclave.5005.intro$ Loại thuốc này tạo ra một trạng thái giống như giấc ngủ, kích thích hệ sợi nấm thần kinh, tạo ra trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005e.desc:0 "$enclave.5005.intro$ Vào lúc bắt đầu giấc ngủ, loại thuốc này sẽ kích thích lớp đặc thị giác, dẫn đến trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005f.desc:0 "$enclave.5005.intro$ Vào lúc bắt đầu giấc ngủ, loại thuốc này sẽ kích thích cặp hạch thần kinh não bộ, dẫn đến trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005g.desc:0 "$enclave.5005.intro$ Vào lúc bắt đầu giấc ngủ, loại thuốc này sẽ kích thích hạch thần kinh thực quản trên, dẫn đến trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005h.desc:0 "$enclave.5005.intro$ Loại thuốc này tạo ra một trạng thái giống như giấc ngủ, kích thích mô não tử thần kinh, tạo ra trạng thái bản năng của một giấc mơ tỉnh táo đến khó tin.\n\n$enclave.5005.outro$"
 enclave.5005.intro:0 "Các sự kiện do [shroudwalker_enclave_country.GetName] tiên tri dường như đã xảy ra. Một loại ma túy đường phố mới ngày càng trở nên phổ biến ở [Root.GetName]. Hợp chất tâm linh này được gọi là 'tỉnh táo' và có nguồn gốc từ một loại cây địa phương tương tự."
 enclave.5005.outro:0 "Điều quan trọng hơn là, một số người dùng kể lại rằng họ bị theo dõi trong giấc mơ, như thể có ai đó hoặc thứ gì đó đã 'vượt rào' xâm nhập vào bộ não của họ. Dù vậy, nhiều người cho rằng sự thăng hoa trong mơ này còn hấp dẫn hơn thực tế khắc nghiệt của cuộc sống thực dân. Thật không may, sự phổ biến của loại ma túy này đã dẫn đến sự nổi lên của các đường dây phân phối tội phạm."
 enclave.5005.a:0 "Gây bất an."

 enclave.5010.name:0 "Giấc Mơ Rối Ren"
 enclave.5010.desc:0 "Mức độ tiêu thụ loại thuốc mang tên 'tỉnh táo' đang tiếp tục gia tăng trên [Root.GetName]. Chính quyền thuộc địa đã báo cáo về sự gia tăng đáng lo ngại về các ca dị thường, những người sử dụng thường xuyên nhất đã gặp phải tình trạng suy nhược thần kinh trầm trọng. Hiệu suất công việc giảm sút, tỷ lệ tội phạm tăng cao, và người dân địa phương không hề có ý định cai nghiện."
 enclave.5010.a:0 "Điều này là phạm pháp!"
 enclave.5010.b:0 "Chúng ta cần thêm thông tin."

 enclave.5015.name:0 "Đôi Khi Mơ Mộng"
 enclave.5015.desc:0 "Các nhà khoa học của chúng ta đã tạo ra bước tiến lớn trong việc nghiên cứu loại ma túy 'tỉnh táo'. Hợp chất này tác động lên hệ thống cơ thể của người dùng không chỉ giúp gia tăng những giấc mơ tỉnh táo mà còn gây ra tình trạng phụ thuộc hóa học. Càng dùng, người ta càng thèm thuốc. Khi liều lượng được tiêm vào đủ lớn, ta có thể quan sát thấy những dao động lượng tử bên trong não bộ. Những dao động này hoàn toàn trùng khớp với những gì chúng ta biết về Tấm Màn Tâm Linh.\n\nSau khi tỉnh dậy, các đối tượng nghiên cứu than phiền về các triệu chứng đau đầu và ảo giác. Các trường hợp nghiêm trọng có thể dẫn đến xuất huyết ồ ạt gây tử vong. Các cuộc khám nghiệm tử thi sau đó tiết lộ khối lượng tịnh của não họ đã tăng 0.01%. Giấc mơ dường như đã để lại một vài dấu tích.\n\nTrưởng dự án đang xin thêm ngân sách để đào sâu nghiên cứu tác động của loại ma túy này. Rất may, xét đến nhu cầu đối với hợp chất này, chúng ta không lo thiếu tình nguyện viên."

 enclave.5020.name:0 "Bám Theo Giấc Mơ"
 enclave.5020a.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý và không thể tiến vào giấc ngủ REM theo cách tự nhiên nữa. $enclave.5020.outro$"
 enclave.5020b.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý, gây tổn hại nghiêm trọng đến chức năng của các khớp nối tinh thể thần kinh. $enclave.5020.outro$"
 enclave.5020c.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý, gây tổn hại nghiêm trọng đến các chức năng bình thường của lục lạp thần kinh. $enclave.5020.outro$"
 enclave.5020d.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý, gây tổn hại nghiêm trọng đến các chức năng bình thường của hệ sợi nấm thần kinh. $enclave.5020.outro$"
 enclave.5020e.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý và không thể tiến vào giấc ngủ theo cách tự nhiên nữa. $enclave.5020.outro$"
 enclave.5020f.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý, gây tổn hại nghiêm trọng đến các chức năng bình thường của cặp hạch thần kinh não bộ. $enclave.5020.outro$"
 enclave.5020g.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý, gây tổn hại nghiêm trọng đến các chức năng bình thường của hạch thần kinh thực quản trên. $enclave.5020.outro$"
 enclave.5020h.desc:0 "$enclave.5020.intro$ Mọi người đều rơi vào tình trạng phụ thuộc sinh lý, gây tổn hại nghiêm trọng đến các chức năng bình thường của khớp nối thần kinh tử thần kinh. $enclave.5020.outro$"
 enclave.5020.intro:0 "Các nghiên cứu của chúng ta về ma túy 'tỉnh táo' đã đưa ra những kết quả đáng báo động: một vài đối tượng nghiên cứu đã mất mạng sau một thời gian dài sử dụng."
 enclave.5020.outro:0 "Có tới 30% trong số đó mọc những khối u trong thân não. Công nghệ chụp ảnh với độ phân giải cao cho thấy những khối u này thực chất là ấu trùng của một loại ký sinh trùng.\n\nLời giải thích được đưa ra là, các dao động lượng tử do thuốc gây ra cho phép bọn ký sinh trùng này 'xuyên không' giữa các chiều không gian liền kề. Khá rõ ràng là, cấu trúc thần kinh của chúng ta vô cùng phù hợp với nhu cầu ăn uống của chúng.\n\nKể từ khi những phát hiện này được công bố, lực lượng an ninh đã ghi nhận mức giảm 50% trong các vụ bắt giữ liên quan đến ma túy 'tỉnh táo'. Có lẽ nhân dân của chúng ta cuối cùng cũng đã tỉnh giấc."
 enclave.5020.a:0 "Ngủ ngon."

 enclave.5025.name:0 "Chết, Hay Là Một Giấc Ngủ Sâu..."
 enclave.5025.desc:0 "Những thông tin đáng lo ngại được gửi tới từ [Root.GetName]: Tỷ lệ tử vong trong số những người sử dụng loại thuốc 'tỉnh táo' đang có dấu hiệu gia tăng. Loại hợp chất này không chỉ kích thích những giấc mơ hưng phấn mà còn gây ra tình trạng phụ thuộc hóa học. Sử dụng với liều lượng lớn sẽ dẫn đến xuất huyết trong và cuối cùng là cái chết."
 enclave.5025.a:0 "Thật đáng phẫn nộ."

 enclave.5030.name:0 "Chỉ Mong Mộng Đẹp"
 enclave.5030.desc:0 "Việc sử dụng ma túy 'tỉnh táo' trên [Root.GetName] vẫn đang không ngừng lan rộng. Bất chấp những hình phạt nghiêm khắc đối với tội phạm, ngày càng có nhiều người tin rằng trạng thái thăng hoa trong mơ đáng giá hơn cả cuộc sống hiện thực. Ngay cả khi kết cục là cái chết, họ vẫn không hề chùn bước. Mức độ ổn định của [Root.GetName] đang tiếp tục suy giảm."

 enclave.5035.name:0 "Giấc Ngủ Tử Thần"
 enclave.5035.desc:0 "Số ca tử vong liên quan đến ma túy 'tỉnh táo' trên [Root.GetName] tiếp tục có chiều hướng gia tăng. Tuy nhiên, cùng với sự xuống cấp của điều kiện xã hội, ngày càng có nhiều người vùi mình vào thuốc phiện như một lối thoát. Nếu tình trạng này cứ tiếp diễn, chúng ta có nguy cơ mất quyền kiểm soát thuộc địa này."
 enclave.5035.a:0 "Phải ngăn chúng lại!"

 TO_DREAM_PROJECT_01:0 "Đôi Khi Mơ Mộng"
 TO_DREAM_PROJECT_01_DESC:0 "Bắt tay vào nghiên cứu tác dụng của loại ma túy đường phố có tên là 'tỉnh táo'."
 TO_DREAM_PROJECT_02:0 "Đôi Khi Mơ Mộng"
 TO_DREAM_PROJECT_02_DESC:0 "Tiếp tục nghiên cứu những tác dụng của loại ma túy đường phố 'tỉnh táo'."
