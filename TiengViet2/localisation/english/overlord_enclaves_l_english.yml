 enclave_salvager_station_plural:0 "Căn Cứ Sao Nghiệp Đoàn Trưng Thu Phế Liệu"
 enclave_salvager_starbase_ruined:0 "Căn Cứ Sao Nghiệp Đoàn Trưng Thu Phế Liệu Bị Phá Hủy"
 enclave_salvager_starbase_ruined_cap: "$enclave_salvager_starbase_ruined$"
 enclave_salvager_starbase_ruined_desc:0 "Những hoạt động tấp nập từng diễn ra ở đây đã bị đình trệ, nhiều khoang kỹ thuật của nó nay đầy ắp những cỗ máy hư hỏng, vô giá trị."
 enclave_shroudwalker_station:0 "Căn Cứ Sao Hội Chiêm Tinh Màn Che"
 enclave_shroudwalker_station_cap: "$enclave_shroudwalker_station$"
 enclave_shroudwalker_station_plural:0 "Căn Cứ Sao Hội Chiêm Tinh Màn Che"
 enclave_shroudwalker_starbase_ruined:0 "Căn Cứ Sao Hội Chiêm Tinh Màn Che Bị Phá Hủy"
 enclave_shroudwalker_starbase_ruined_cap: "$enclave_shroudwalker_starbase_ruined$"
 enclave_shroudwalker_starbase_ruined_desc:0 "Nơi từng là một nơi trú ẩn nay bị xé toạc thành từng mảnh, có vẻ như vết rách xuất phát từ bên trong; các cột trụ bằng đá của nó giờ đây bị nghiền nát, vô số chóp nhọn trong đống tàn tích bị ném vào những luồng gió vũ trụ, rải rác khắp nơi."

 mercenary_army:0 "Lục Quân Lính Đánh Thuê"
 mercenary_army_desc:0 "Lực lượng này đóng quân ở đây vì tiền. Họ máu lạnh và làm việc rất hiệu quả, nhưng dẫu cho công việc của họ ẩn chứa rủi ro, họ không sẵn lòng hy sinh mạng sống vì bất kỳ mục đích nào. Và cũng sẽ không bao giờ bỏ qua cơ hội cướp bóc."
 mecha_army:0 "Lục Quân Lính Đánh Thuê Cơ Giới Hóa"
 mecha_army_desc:0 "Lính đánh thuê xịn nhất trên thị trường. Những binh lính này điều khiển những cỗ máy khổng lồ di chuyển linh hoạt, đủ sức bù đắp cho sự thiếu hụt về mặt số lượng. Mặc dù không phải là những người lính dũng cảm nhất, họ sẽ không nương tay, chỉ để lại sau lưng những đống đổ nát ngút khói."

 salvager_overdrive:0 "Trưng Thu Tăng Tốc"
 salvager_overdrive_desc:0 "Nhờ vào sự tận tụy nỗ lực của các thuyền viên từ các bang trục vớt thân thiện, đế quốc này đã có thể tăng tốc độ xây dựng căn cứ sao và thuộc địa."
 salvager_insight:0 "Tầm Nhìn Trưng Thu Phế Liệu"
 salvager_insight_desc:0 "Được hưởng lợi từ kiến thức chuyên môn thực tế của Nghiệp Đoàn Trưng Thu Phế Liệu, các nhà khoa học của đế quốc này có thể nhanh chóng bắt kịp với những đột phá mới đầy thú vị trong kỹ thuật."

 #Situations
 mercenary_dividends:0 "Cổ Tức Lính Đánh Thuê"
 mercenary_dividends_type:1 "$mercenary_dividends$"
 mercenary_dividends_desc:0 "Thành bang lính đánh thuê này đang tích trữ cống phẩm cho nhà tài trợ của mình."
 mercenary_dividends_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_no_control$"
 high_level:0 "I"
 lord_of_war:0 "Chúa Tể Chiến Tranh"

 enclave.2000.name:1 "Thành Bang [mercenary_enclave_country.GetName] Trả Cổ Tức"
 enclave.2000.desc:1 "Kính thưa nhà tài trợ, những hợp đồng gần đây của chúng tôi đã đơm hoa kết trái. Chúng tôi đã mở rộng hoạt động dân sự của mình, và hiện tại có khá nhiều công ty đang thuê chúng tôi cung cấp dịch vụ an ninh và duy trì hòa bình. Trong thời gian thực hiện hợp đồng, các đặc vụ của chúng tôi đã tình cờ tìm thấy một số nghiên cứu khoa học có giá trị. Ngài sẽ tìm thấy những nội dung bổ sung này ở phần cuối của cổ tức định kỳ."
 enclave.2005.desc:1 "Kính thưa nhà tài trợ, công ty đang hoạt động rất tốt, doanh thu của chúng tôi liên tục tăng trưởng ổn định. Dưới đây là phần chia cổ tức của kỳ này, ngoài ra chúng tôi cũng gửi kèm một lô tài nguyên bổ sung, đây là thứ chúng tôi tịch thu được từ một khách hàng dân sự vi phạm hợp đồng."
 enclave.2010.desc:1 "Kính thưa nhà tài trợ, chúng tôi rất vui mừng thông báo rằng lợi nhuận trong chu kỳ báo cáo tài chính này đã phá kỷ lục! Vì lý do này, chúng tôi rất hân hạnh được thêm một khoản hoa hồng kếch xù vào phần chia cổ tức thông thường."
 enclave.2015.desc:1 "Kính thưa nhà tài trợ, các xưởng đóng tàu của chúng tôi đã hoạt động không ngừng nghỉ để tạo ra những hạm đội chất lượng nhất. Ngoài cổ tức của ngài, chúng tôi cũng rất vui được cung cấp cho ngài một hạm đội được sản xuất dư thừa, sử dụng thiết kế mới nhất của chúng tôi, để ngài đánh giá và thử nghiệm. Chúng tôi rất mong nhận được phản hồi từ ngài!"
 enclave.2020.desc:1 "Kính thưa nhà tài trợ, chiến dịch gìn giữ hòa bình gần đây của chúng tôi đã thành công triệt phá một số tổ chức hải tặc, thu giữ được một lượng lớn tài nguyên và dữ liệu công nghệ. Cùng với cổ tức định kỳ của ngài, chúng tôi xin chuyển giao phần lớn chiến lợi phẩm này cho ngài."
 enclave.2025.desc:1 "Kính thưa nhà tài trợ, công ty hiện đang trải qua thời kỳ khó khăn. Chúng tôi đã đánh mất một số khách hàng dân sự và vài chiến dịch khác cũng thất bại, gây thiệt hại nghiêm trọng. Chúng tôi đã thiết lập một kế hoạch tái cấu trúc, cắt giảm chi phí của ban giám đốc, đồng thời sa thải một số nhân sự ra ngoài xã hội, giúp nhân viên của chúng tôi có cơ hội việc làm linh hoạt hơn.\n\nXin ngài hãy yên tâm, chúng tôi sẽ làm việc không mệt mỏi để lấy lại cổ tức cho ngài, sự xui xẻo này chỉ là tạm thời."
 enclave.2025.a:0 "Thật đáng thất vọng."
 enclave.2025.b:0 "Anh bị sa thải. Đến ban giám đốc nhận giấy thôi việc đi."
 enclave.2025.c:0 "Để chúng ta giúp một tay."
 enclave.2040.desc:0 "Ngài muốn chia sẻ công nghệ của mình? Nhà tài trợ thân mến, sự tin tưởng của ngài khiến chúng tôi cảm thấy vô cùng vinh dự. Mặc dù phòng R&D của chúng tôi luôn nỗ lực để duy trì vị thế tiên phong trong công nghệ, nhưng xét về tổng nguồn lực có thể huy động, chúng tôi vẫn còn hạn hẹp so với ngài. Bất kỳ kiến thức nào ngài chia sẻ với chúng tôi đều giúp chúng tôi có thể tiếp tục hoạt động theo cách có đạo đức nhất."
 enclave.2040.a.tt:0 "Chúng ta sẽ chia sẻ §Ycông nghệ§! của mình với thực thể biệt lập này. Chỉ có thể thực hiện một lần mỗi §Y10 năm§!."
 merc_enclave_grants_ships:0 "§Y[mercenary_enclave_country]§! còn bổ sung thêm cho chúng ta một §Ghạm đội quân sự nhỏ§!"

 enclave.2050.name:0 "Một Giao Dịch Không Nên Chối Từ"
 enclave.2050.desc:0 "Chúng ta nhận được một thông cáo khẩn từ [mercenary_enclave_country.GetName]. Họ cho biết [khan_country.GetName] đã đưa cho họ một đề nghị không thể chối từ. Lối thoát duy nhất của họ là tìm được một người chủ khác trong vòng hai tháng. Nếu không có ai thuê họ, họ sẽ phải phục vụ Đại Hãn, và trong trường hợp không còn sự lựa chọn nào khác, họ sẽ phát động chiến tranh tổng lực chống lại chúng ta."
 enclave.2050.a:0 "Liên lạc với [mercenary_enclave_country.GetName]."
 enclave.2050.a.tt:0 "Chúng ta có £time£§Y60 ngày§! để quyết định xem có nên thuê họ hay không."
 enclave.2050.b:0 "Hiện tại chúng ta không kham nổi. Có lẽ sau này vậy."
 enclave.2050.b.tt:0 "Chúng ta có £time£§Y7 ngày§! để quyết định xem có nên thuê họ hay không."
 enclave.2050.c:0 "Bọn phản bội! Lòng tham sẽ làm chúng khuynh bại."

 # Salvager Enclaves
 enclave.305.name:0 "[salvager_enclave_country.GetName]"
 enclave.305.a.desc:0 "Rất vui được gặp ngài! Thay mặt [salvager_enclave_country.GetName], xin chào mừng ngài đến với xưởng chế tác giữa các vì sao nhỏ bé của chúng tôi.\n\nÁi chà... Nhìn những món đồ trên đoạn sống lưng của ngài là tôi nhận ra ngay —— chế tác tinh xảo đấy. Chúng tôi có thói quen theo dõi các bản thiết kế phi thuyền trong thiên hà, cố gắng nắm bắt những xu hướng mới nhất của khu vực. À mà nãy tôi đang nói đến đâu rồi nhỉ...?\n\nÀ, phải rồi: Chào mừng ngài! Xin hỏi chúng tôi có thể đáp ứng nhu cầu trục vớt và tái chế của ngài như thế nào đây?"
 enclave.305.b.desc:0 "Xin chào, xin chào! Thay mặt [salvager_enclave_country.GetName], xin chào mừng ngài đến với xưởng bảo dưỡng của chúng tôi. Dù là thân tàu, động cơ, bản thiết kế hay phụ tùng: Chúng tôi đều có sẵn hàng.\n\nTôi không đùa đâu —— những thứ người ta vứt lại trong các con tàu cũ sẽ khiến ngài phải kinh ngạc đấy. Gần đây [salvager_enclave_country.species.GetHandNamePlural] của tôi mới tậu được một căn bếp hoàn chỉnh, đúc hoàn toàn bằng vàng nguyên khối. Sướng tê người.\n\nLại đi xa chủ đề rồi, xin hỏi chúng tôi có thể đáp ứng nhu cầu trục vớt và tái chế của ngài như thế nào đây?"
 enclave.305.c.desc:0 "Xin gửi lời chào đến ngài! Thay mặt [salvager_enclave_country.GetName], xin chào mừng ngài đến với xưởng chế tác và bãi phế liệu của chúng tôi. Rất đông các kỹ sư chuyên trách đã sẵn sàng, chuẩn bị sửa chữa, lắp ráp hoặc tháo dỡ hầu như bất cứ thứ gì họ có thể chạm tới bằng dụng cụ. Ngài sẽ thấy đam mê thương mại của chúng tôi là không bao giờ cạn kiệt.\n\nXin hỏi hôm nay chúng tôi có thể đáp ứng nhu cầu trục vớt và tái chế của ngài như thế nào đây?"
 enclave.305.desc.scavenger_first:0 "Chào mừng! Tôi rất vui khi được gặp một số đồng nghiệp trong ngành trục vớt —— ngài biết đấy, cái thiên hà này đối với chúng tôi thật sự rất cô đơn.\n\nChắc ngài cũng biết quy trình rồi —— chúng tôi thu gom những linh kiện cũ kỹ mà người khác cho là vô dụng, rồi ban cho chúng một sinh mệnh hoàn toàn mới. Nếu có bất cứ việc gì mà [Root.GetSpeciesHandNamePlural] của ngài không xử lý được, cứ thư giãn đi, chúng tôi sẽ tiếp quản.\n\nVậy, chúng tôi có thể làm gì để tạo thuận lợi cho sự nghiệp trục vớt và khai hoang của ngài?"
 enclave.305.desc.scavenger_followup:0 "Xin chào ngài! Ngài đã cảm thấy chán ngán với việc điều hành một đế quốc chưa? Tôi có thể gia nhập vào sự nghiệp nhặt rác của chúng ta —— hoàn toàn không có áp lực gì đâu, ngài chắc chắn sẽ thấy thích thú."
 enclave.305.n.desc:0 "Rất vui lại được gặp, chỗ chúng tôi đang bận tối tăm mặt mũi đây. Mọi việc của quý quốc dạo này vẫn suôn sẻ chứ? Dám cá là chúng tôi lúc nào cũng ồn ào như thế này đấy. Những [salvager_enclave_country.species.GetHandNamePlural] rảnh rỗi rất có tài trong việc xử lý các tàu thuộc địa lỗi thời."
 enclave.305.o.desc:0 "Xin chào! Hôm nay chúng tôi nên đáp ứng nhu cầu kỹ thuật của các bạn như thế nào đây?\n\nÀ, mấy thứ được lắp đặt trên các tấm thép vỏ tàu của các bạn khá thú vị, chúng hoạt động hiệu quả chứ?"
 enclave.305.p.desc:0 "Mừng đã trở lại! Này, hãy xem thử những động cơ mới tinh mượt mà này đi! Tôi chân thành hy vọng chúng tôi có thể góp một phần nhỏ bé vào cách ngài bảo dưỡng phi thuyền; chúng sẽ biết ơn ngài vì điều đó đấy.\n\nVậy chúng tôi có thể phục vụ ngài thế nào đây?"
 enclave.305.q.desc:0 "Chào anh bạn! Đừng bận tâm... chỉ là đang tinh chỉnh lại cái máy phát ảnh ba chiều cấp công nghiệp này thôi. Mấy thiết bị này, rất dễ khiến người ta mê mẩn. Đây là dự án tủ của tôi, nghiên cứu xem thứ này rốt cuộc có thể chiếu ra một hình ảnh ba chiều lớn đến mức nào. Thậm chí còn chưa bằng một nửa độ khó khi phóng chiếu nó ra ngoài không gian, ngài thấy không.\n\nÁi chà, tôi mà mở miệng ra là có thể thao thao bất tuyệt cả năm trời đấy. Tôi có thể phục vụ ngài thế nào đây?"
 enclave.305.organic.desc:0 "Rất vui được gặp lại ngài! Xin đừng để ý đến mớ đồng nát này, cùng những âm thanh rên rỉ đó. Bọn tôi, ừm... có bạn từ phương xa đến chơi! Chúng đang trong độ tuổi lớn; và thường xuyên hơi... đói bụng. Hiếm ai biết được, chúng có thể mọc lại những xúc tu đó với tốc độ như vậy!\n\nKhụ. Xin lỗi. Tôi có thể giúp gì cho ngài?"
 enclave.305.desc.hostile:0 "Ừm ừm ừm, trước đây bọn tôi đã từng gặp lũ các ngươi rồi...\n\nBọn tôi không có gì để nói với các ngươi, cũng chẳng có dịch vụ nào muốn cung cấp cả. Nhanh nhẹn mà cút sang một bên đi."
 enclave.305.a:0 "Chúng ta muốn §Ytháo dỡ một hạm đội§!."
 enclave.305.b:0 "Hiện tại các anh có loại §Ytàu được tân trang§! nào?"
 enclave.305.c:0 "Kể cho chúng ta nghe về công trình §Yxưởng sửa chữa§! đi."
 enclave.305.d:0 "Các anh có thể hỗ trợ chúng ta về mặt §Yxây dựng§! không?"
 enclave.305.e:0 "Chúng ta muốn trục vớt một ít §Ymảnh vỡ§!."
 enclave.305.f:1 "Các anh có thể hỗ trợ §Ynghiên cứu kỹ thuật§! của chúng ta không?"
 enclave.305.g:1 "Chúng ta muốn thuê một người làm §Y$master_salvager$§!."

 enclave.310.desc:1 "Tuyệt quá! Rất hân hạnh khi được nhận công việc này từ tay ngài.\n\nTheo máy quét của chúng tôi, ngài đang có những hạm đội sau đây nằm trong phạm vi tùy chọn. Có thể xem báo giá trong phần đính kèm, bây giờ mời ngài đưa ra quyết định.\n\n$enclave.310.instructions$"
 enclave.310.organic.desc:0 "Tuyệt vời! Đó sẽ là vinh dự của chúng tôi... Dưới các vì sao, kia là cái quái gì vậy?! Ngài thực sự gọi thứ đó là một con tàu sao? Ý tôi là, tôi có thể hiểu làm thế nào nó... Wow, trông nó hung dữ thật đấy. Cầu xin ngài, xin đừng hành động hấp tấp! Chúng tôi có thể tiếp nhận những 'con tàu' sống từ chỗ ngài, nhưng e rằng §Hchúng tôi phải thu thêm phí dọn dẹp§!.\n\nTheo kết quả quét của chúng tôi, những con tàu sau đây của ngài nằm trong phạm vi tiếp nhận. Ngài có thể tìm thấy ước tính của chúng tôi trong tệp đính kèm; giờ thì quyền quyết định thuộc về ngài!\n\n$enclave.310.instructions$"
 enclave.310.nofleet.desc:1 "Được chứ! Dịch vụ của chúng tôi luôn luôn rành mạch: Đưa một hạm đội tới hệ sao §H[salvager_enclave_system.GetName]§!, rồi báo cho chúng tôi một tiếng. Chỉ cần xác nhận ngài là chủ nhân của hạm đội, chúng tôi có thể đưa ra danh sách báo giá. Sau đó chúng tôi sẽ tiếp quản hạm đội, ngài cũng có thể ngay lập tức nhận được vật liệu sau khi tái chế.\n\nỒ, nhưng hãy nhớ kỹ: Đừng mang đồ của người khác tới đây tháo dỡ! Chúng tôi không muốn phải nếm mùi đau khổ vì chuyện đó, không thể nào lật thuyền lần nữa được...\n\n$enclave.310.instructions$"
 enclave.310.instructions:0 "§EChúng ta có thể đưa phi thuyền của mình đến căn cứ sao của thợ trục vớt ở hệ sao §!§H[salvager_enclave_system.GetName]§!§E để thẩm định giá và bán thanh lý phi thuyền của mình.§!"
 enclave.310.a:0 "Cảm ơn đã thông báo. Tôi muốn hỏi về các dịch vụ khác..."
 enclave.310.b:0 "Tháo dỡ §H[scrappable_fleet_1.GetName]§!."
 enclave.310.c:0 "Tháo dỡ §H[scrappable_fleet_2.GetName]§!."
 enclave.310.d:0 "Tháo dỡ §H[scrappable_fleet_3.GetName]§!."
 enclave.310.e:0 "Tháo dỡ §H[scrappable_fleet_4.GetName]§!."
 enclave.310.organic_penalty.tt:0 "£energy£$@ScrapOrganicCost|Y$ (§RPhí Dọn Dẹp§!)\n\n"
 enclave.310.tt:1 "Chúng ta sẽ nhận được:"
 enclave.315.desc:0 "Cảm ơn! Vật liệu tái chế của ngài sẽ được giao tới ngay."

 enclave.320.desc:0 "Thật diệu kỳ! Tàu vỡ nát đi vào, nguyên vẹn đi ra. Hiện tại có các loại sau đây cho ngài chọn lựa.\n\nNên biết rằng mỗi chiếc tàu chúng tôi tân trang đều được hưởng §HChế độ bảo hành 3 năm§! sau khi bán ra. Sau khi tân trang tại xưởng đóng tàu, chúng tôi tin chắc những con tàu này còn chạy êm hơn cả lúc mới xuất xưởng.\n\nNhưng xin hãy nhớ: Tân trang tốn khá nhiều thời gian. Trước khi tân trang trọn vẹn một hạm đội, chúng tôi không thể bán tàu cho ngài. Vì vậy, có lẽ ngài sẽ cần liên hệ lại với chúng tôi vào một ngày khác."
 enclave.320.timeout.desc:1 "Bất kể loại tàu nát nào lọt vào tay chúng tôi, chúng tôi đều sẽ dốc toàn lực để mang lại sức sống mới cho nó. Nhưng hiện tại §Ycó vẻ như các bến cảng của chúng tôi đang trống trơn§!.\n\nXin hãy quay lại sau, khi đó hãy xem thử chúng tôi có thể giúp gì cho ngài. Mỗi lần tân trang tiêu tốn của chúng tôi khoảng §H2 năm§!."
 enclave.320.b:0 "$CORVETTE$ được tân trang."
 enclave.320.b.tt:0 "Mua một $CORVETTE$ theo thiết kế đã từng được §Y[salvager_reclaimed_corvette_country.GetName]§! sử dụng."
 enclave.320.bb:0 "Đội hình $CORVETTE$ được tân trang."
 enclave.320.bb.tt:1 "Mua một tiểu đội gồm 10 $corvette_plural$ theo thiết kế đã từng được §Y[salvager_reclaimed_corvette_country.GetName]§! sử dụng.\n\nĐiều này sẽ khiến thợ trục vớt bận rộn một khoảng thời gian, chúng ta không thể mua thêm bất kỳ con tàu tân trang nào khác trong vòng §H2 năm§!.\n\n"
 enclave.320.c:0 "$DESTROYER$ được tân trang."
 enclave.320.c.tt:0 "Mua một $DESTROYER$ theo thiết kế đã từng được §Y[salvager_reclaimed_destroyer_country.GetName]§! sử dụng."
 enclave.320.c.timeout:0 "Chỉ có thể mua một $DESTROYER$ mới sau §Y[root.salvager_destroyer_timer]§!."
 enclave.320.d:0 "$CRUISER$ được tân trang."
 enclave.320.d.tt:0 "Mua một $CRUISER$ theo thiết kế đã từng được §Y[salvager_reclaimed_cruiser_country.GetName]§! sử dụng."
 enclave.320.d.timeout:0 "Chỉ có thể mua một $CRUISER$ mới sau §Y[root.salvager_cruiser_timer]§!."
 enclave.320.e:0 "$BATTLESHIP$ được tân trang."
 enclave.320.e.tt:0 "Mua một $BATTLESHIP$ theo thiết kế đã từng được §Y[salvager_reclaimed_battleship_country.GetName]§! sử dụng."
 enclave.320.e.timeout:0 "Chỉ có thể mua một $BATTLESHIP$ mới sau §Y[root.salvager_battleship_timer]§!."
 enclave.320.frigate: "$frigate$ được tân trang."
 enclave.320.frigate.tt: "Mua một $frigate$ theo thiết kế đã từng được §Y[salvager_reclaimed_frigate_country.GetName]§! sử dụng."
 enclave.320.frigate_bulk: "Đội hình $frigate$ được tân trang."
 enclave.320.frigate_bulk.tt: "Mua một tiểu đội gồm 10 $frigate_plural$ theo thiết kế đã từng được §Y[salvager_reclaimed_frigate_country.GetName]§! sử dụng.\n\nĐiều này sẽ khiến thợ trục vớt bận rộn một khoảng thời gian, chúng ta không thể mua thêm bất kỳ con tàu tân trang nào khác trong vòng §H2 năm§!.\n\n"

 enclave.325.desc:0 "Vô cùng cảm ơn ngài!"

 enclave.330.desc:0 "Được chứ! Chỉ cần ngài dành không gian cho chúng tôi làm việc, các thợ máy của chúng tôi luôn có thể theo dõi tình trạng sửa chữa tàu thuyền tại địa phương.\n\nChúng tôi sẽ chuẩn bị sẵn các vật liệu cần thiết cho mô-đun xưởng sửa chữa, để ngài có thể lắp đặt nó vào §Ycăn cứ sao gần kề chúng tôi§!. Có thể sẽ cần điều chỉnh lại các khe cắm mô-đun của căn cứ, nhưng một khi các kỹ sư của chúng tôi đã xây dựng thành công xưởng, ngài có thể đưa tàu vào để sửa chữa. Thi thoảng, chúng tôi còn có thể giúp ngài trong việc xây dựng bên trong lãnh thổ quý quốc.\n\nVậy ngài thấy sao? Một §Hxưởng sửa chữa§! như vậy có vừa ý ngài không?"
 enclave.330.lowopinion.desc:0 "Dĩ nhiên! Chúng tôi mang đến cho những khách hàng đáng tin cậy nhất một cơ hội đặc biệt. Tóm lại là: Ngài cấp cho chúng tôi không gian làm việc trên căn cứ sao tại [salvager_enclave_system.GetName], và đội ngũ thợ máy của chúng tôi sẽ theo dõi sát sao công việc bảo trì phi thuyền của ngài tại địa phương. Chúng tôi thậm chí có thể hỗ trợ việc xây dựng các căn cứ sao và xưởng đóng tàu của ngài trên toàn cõi đế quốc!\n\nNếu ngài thấy hứng thú, chúng tôi rất sẵn lòng trao đổi sâu hơn về vấn đề này... một khi quan hệ hợp tác giữa đôi bên đã bền chặt hơn. Mong ngài có thể thấu hiểu."
 enclave.330.a:0 "$enclave.310.a$"
 enclave.330.b.tt:0 "Cho phép sử dụng công trình căn cứ sao §Y$sm_salvager_workshop$§!, làm giảm chi phí bảo trì hạm đội cập cảng và tăng tốc độ sửa chữa."

 enclave.335.desc:0 "Dĩ nhiên! Các chuyên gia kỹ thuật của chúng tôi luôn nỗ lực hết mình, đề ra các kế hoạch công việc mới đầy tham vọng, chúng tôi rất vinh dự được cung cấp cho ngài khả năng gia tăng năng suất trong thời gian giới hạn.\n\nChúng tôi sẽ đưa xưởng sửa chữa của ngài vào guồng máy hoạt động với tốc độ cao nhất, tiến hành tái chế linh kiện cho toàn bộ công trình của ngài trên §Ytất cả các căn cứ sao§!! Chúng tôi thậm chí còn có vài mẹo nhỏ để giúp ngài sản xuất tàu. Chắc chắn là sẽ hữu dụng đấy! Đại loại vậy~\n\nXin hãy nhớ, những công việc như thế này đều có giá của nó; chúng tôi không thể thường xuyên hỗ trợ được đâu."
 enclave.335.a:0 "$enclave.310.a$"

 enclave.336.desc:0 "Xin gửi lời chào đến ngài một lần nữa! Tôi rất vui mừng được thông báo rằng, chúng tôi đã sẵn sàng để dốc sức đưa sự nghiệp lên một tầm cao mới, khiến công việc trục vớt thực sự mang lại giá trị xứng đáng.\n\nNgài nghĩ sao? Đã sẵn sàng tăng tốc quá trình đóng tàu tại §Ytất cả các căn cứ sao của ngài§! chưa?"

 enclave.340.a.desc:0 "Quả là một lời kêu gọi trang nghiêm. Nghe tin hạm đội chìm nghỉm trong trận chiến, nỗi đau của chúng tôi vượt ngoài sức tưởng tượng của ngài, nhưng cuộc sống ngoài không gian vốn dĩ tàn khốc, có những điều là không thể tránh khỏi.\n\n... Xin thứ lỗi cho dòng suy nghĩ mông lung của tôi. Không còn nghi ngờ gì nữa, đó chính là dịch vụ mà chúng tôi có thể cung cấp.\n\n$enclave.340.main.desc$"
 enclave.340.b.desc:0 "Chao ôi. Vậy là môi trường chân không khắc nghiệt đã nuốt chửng thêm nhiều con tàu... Dĩ nhiên, chúng tôi rất sẵn lòng trục vớt những thứ tích cực từ bãi chiến trường bi thảm mà ngài vừa nhắc đến.\n\n$enclave.340.main.desc$"
 enclave.340.main.desc:0 "Nếu ngài đồng ý cấp cho chúng tôi §Yquyền trục vớt§! và cung cấp §Ytọa độ§! của bãi mảnh vỡ, chúng tôi sẽ đền đáp ngài một cách xứng đáng khi thời điểm đến."
 enclave.340.nodebris.desc:1 "À, vâng, chiến đấu: Đây là lý do đáng buồn nhất của việc trục vớt... Ngài phải tha thứ cho tôi, [root.GetRulerTitle]; sự tàn phá man rợ sẽ không mang lại niềm vui cho chúng tôi. Tuy nhiên, chúng tôi hiểu rằng điều đó là không thể tránh khỏi. Nếu tàu của ngài không muốn hoặc không thể phân loại các mảnh vỡ, chúng tôi hoàn toàn có thể đảm nhận công việc trục vớt.\n\nKhi có nhu cầu, hãy đến tìm chúng tôi và cấp quyền trục vớt cho chúng tôi. Chúng tôi sẽ bồi thường cho ngài bằng bất kỳ vật liệu và kiến thức nào tìm thấy ở đó.\n\n"
 enclave.340.lowopinion.desc:1 "Tôi xót xa vì lý do buồn bã nhất của công việc trục vớt: Chiến đấu. Xin hãy tha thứ cho tôi, [root.GetRulerTitle], chúng tôi có lý do để xót xa trước sự tàn phá như vậy. Dẫu vậy, chúng tôi thực sự có thể đảm đương công việc trục vớt. Tuy nhiên, đây là dịch vụ mà chúng tôi chỉ cung cấp cho những §Ykhách hàng quen thuộc hơn§!.\n\nKhi có nhu cầu, hãy đến tìm chúng tôi, và chúng tôi sẽ xử lý các §Hbãi mảnh vỡ§! thuộc về ngài. Chúng tôi sẽ bồi thường cho ngài bằng bất kỳ vật liệu và kiến thức kỹ thuật nào tìm thấy ở đó.\n\n"
 enclave.340.a:0 "$enclave.310.a$"
 enclave.340.b.tt:0 "Chúng ta sẽ §Rkhông thể tiếp cận§! tối đa §Y3 bãi mảnh vỡ§!. [salvager_enclave_country.GetName] sẽ giao lại các công nghệ hoặc vật liệu thu hồi được cho chúng ta §Ytrong vòng 90 ngày§!."

 enclave.341.desc:0 "Cảm ơn ngài! Việc chuyển giao quyền trục vớt có vẻ đang diễn ra theo đúng quy trình; công tác thu hồi đang tiến hành thuận lợi. Chúng tôi sẽ sớm liên hệ lại với ngài."
 enclave.342.desc:0 "Ồ! Tôi rất tiếc phải nói điều này, mớ đồ bỏ đi của ngài dường như đã xuống cấp nghiêm trọng trong quá trình chúng ta trao đổi. Ngay cả chúng tôi cũng thiếu kỹ năng cần thiết để phục hồi những mảnh vỡ đã hỏng từ quá lâu như vậy. Ôi chao, đối thủ truyền kiếp của chúng tôi, sự hỗn loạn, đang nhân cơ hội phản đòn đấy!"

 enclave.345.desc:1 "Thật là một vinh dự cho chúng tôi! Những [salvager_enclave_country.species.GetHandNamePlural] rảnh rỗi này có đầu óc rất linh hoạt, điều đó vô cùng có ý nghĩa đối với chúng tôi! Chúng tôi rất hân hạnh được chìa tay giúp đỡ và chia sẻ vài mẹo vặt hữu ích với §Ykhách hàng lâu năm§! của mình, suy cho cùng thì công việc kinh doanh của chúng tôi cũng nhờ có ngài chiếu cố.\n\nChúng tôi cũng rất biết ơn nếu ngài có bất kỳ khoản quyên góp nào nhằm hỗ trợ cho căn cứ sao khiêm tốn của chúng tôi! Những thân tàu cũ kỹ có thể được cải tạo vô số lần, nhưng đôi khi, độ tin cậy của một vách ngăn mới đúc là không thể sánh bằng."
 enclave.345.a:0 "$enclave.310.a$"

 enclave.346.desc:0 "Xin chào, người bạn của tôi! Quá trình nghiên cứu hợp tác của chúng ta trong nhiều năm qua đã tiến triển rất tốt đẹp. Điều tôi nghe được là, một vài kỹ sư của chúng tôi đã áp dụng một số ý kiến đóng góp từ phía ngài, và ngược lại, ngài cũng đã làm theo một vài lời khuyên của chúng tôi!\n\nTuy nhiên, thời hạn hợp đồng đã thỏa thuận ban đầu đã đáo hạn, chúng tôi cũng hy vọng có thể đưa những người học việc với bộ óc năng động này trở lại nhà để làm việc... Nghĩa là, trừ khi ngài sẵn lòng trả thêm một chút chi phí bồi thường để họ có thể ở lại thêm một khoảng thời gian nữa?"

 enclave.350.desc:0 "Là một trong những §Ykhách hàng lâu năm§! của chúng tôi, dĩ nhiên chúng tôi rất vui lòng cử một chuyên gia đến giám sát công việc trục vớt của ngài với mức phí cực kỳ thấp. Ngay khi bắt tay vào việc có thể kéo theo một tràng dài những tàn tích cháy đen mới tinh, món quà chào sân này hẳn là rất phù hợp."
 enclave.350.desc.not_available:0 "Chúng tôi cung cấp dịch vụ cho các §Ykhách hàng lâu năm§! của mình, sẽ cử một quản đốc đến hỗ trợ cải thiện công tác trục vớt của ngài với một mức giá rất hời. Đáng tiếc là hiện tại chúng tôi không còn quản đốc nào rảnh rỗi để phái đi —— họ thực sự đang trong tình trạng cung không đủ cầu, e rằng một số khách hàng khác của chúng tôi được ưu tiên hơn."
 enclave.350.a:0 "$enclave.310.a$"
 enclave.352.desc:0 "Kính chào! Viên quản đốc mà chúng tôi phái đến chỗ ngài đã trở về, nhiệm kỳ phục vụ của người đó đã kết thúc. Tuy nhiên, nếu ngài vẫn cần đến dịch vụ của chúng tôi, chúng tôi rất hân hạnh được cử một người khác đến thay thế."

 master_salvager:0 "Bậc Thầy Trục Vớt"
 master_salvager_desc:1 "Một kỹ thuật viên lão luyện đến từ Nghiệp Đoàn Trưng Thu Phế Liệu, chịu trách nhiệm đảm bảo các tàn tích trên chiến trường được tận dụng triệt để nhất."

 master_salvager_catch_phrase: "§L'Tuyệt vời, chúng ta hãy ra thực địa một chút nào! Có mảnh vỡ nào thú vị đang trôi nổi không?'§!"

 leader_trait_master_salvager: "$master_salvager$"
 leader_trait_master_salvager_desc: "Một thợ trục vớt lão luyện đến từ [salvager_enclave_country.GetName], đang chia sẻ các kỹ thuật của họ với mức giá rẻ mạt."
 leader_trait_master_salvager_effect: "$SYSTEM_EFFECTS_TXT$:\n$t$Tàu thân thiện trong hệ sao:\n$tt$Sửa chữa độ bền thân tàu hàng tháng: §G+2%§!\n$t$Khi có mảnh vỡ được trục vớt hoặc nghiên cứu xong trong hệ sao:\n$tt$Xác suất trục vớt tàu: §Y15%§!\n$tt$$salvage_ship_restrictions$"

 councilor_master_salvager: "$master_salvager$"
