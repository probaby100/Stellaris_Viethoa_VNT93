 gov_mercenary_enclave:0 "Công Ty Đánh Thuê"
 gov_mercenary_enclave_desc:1 "Một tổ đội kiêu hãnh và chết chóc, gồm các chiến hạm, thủy thủ và binh lính luôn sẵn sàng chờ được thuê mướn."
 gov_salvager_enclave:0 "Nghiệp Đoàn Trưng Thu Phế Liệu"
 gov_salvager_enclave_desc:1 "Một cộng đồng hỗn tạp gồm những thợ máy và kỹ sư đầy nhiệt huyết, ôm nỗi ám ảnh khó cưỡng với việc tháo dỡ và lắp ráp."
 gov_shroudwalker_enclave:0 "Hội Chiêm Tinh Màn Che"
 gov_shroudwalker_enclave_desc:1 "Một giáo phái bí ẩn của những người thực hành tâm linh, cống hiến hết mình để khám phá Tấm Màn Tâm Linh cùng cấu trúc vi diệu của nó."
