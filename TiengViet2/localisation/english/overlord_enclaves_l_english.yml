 leader_trait_admiral_mind_wipe_01_desc:0 "$shroud_touched_intro$Trong tâm trí của chỉ huy này luôn thường trực vô số ý tưởng mới để nâng cao hiệu suất của con tàu."
 leader_trait_admiral_mind_wipe_02:0 "Chỉ huy chạm tới Tấm Màn Tâm Linh"
 leader_trait_admiral_mind_wipe_02_desc:0 "$shroud_touched_intro$Trong tâm trí của chỉ huy này luôn thường trực vô số ý tưởng mới để tăng cường các hệ thống vũ khí."
 leader_trait_scientist_mind_wipe_01:0 "Sĩ quan Khoa học chạm tới Tấm Màn Tâm Linh"
 leader_trait_scientist_mind_wipe_01_desc:0 "$shroud_touched_intro$Trong tâm trí của nhà khoa học này luôn thường trực vô số ý tưởng mới để cải thiện hiệu suất nghiên cứu."
 leader_trait_scientist_mind_wipe_02:0 "Sĩ quan Khoa học chạm tới Tấm Màn Tâm Linh"
 leader_trait_scientist_mind_wipe_02_desc:0 "$shroud_touched_intro$Trong tâm trí của nhà khoa học này luôn thường trực vô số ý tưởng mới để hỗ trợ cho các nghiên cứu khảo cổ học."
 leader_trait_general_mind_wipe_01:0 "Chỉ huy chạm tới Tấm Màn Tâm Linh"
