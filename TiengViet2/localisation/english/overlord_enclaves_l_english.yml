 #Rogue Shaman (Divination Event)
 #The shaman appears...
 enclave.5075.name:0 "Pháp Sư Lưu Lạc"
 enclave.5075.desc:0 "Một kẻ lưu vong của [shroudwalker_enclave_country.GetName] đã đặt chân đến [Root.GetName]. Vì tin vào những tư tưởng tà đạo, 'kẻ cực đoan' này đã bị trục xuất khỏi thành bang, nhưng lại không hề được ghi nhận trên bất kỳ danh sách hành khách của con tàu nào đã cập bến. Kẻ này đột nhiên hiện hình giữa quảng trường trung tâm của một thành phố lớn trong thuộc địa, như thể vật chất hóa từ Tấm Màn, rồi công khai rao giảng rằng đức tin của hắn có thể giúp thiết lập mối liên kết cá nhân với Tấm Màn Tâm Linh. Theo lời kẻ lưu vong này, nhân dân của chúng ta có thể đạt được một trạng thái ban phước bằng cách chia sẻ những giấc mơ. Các báo cáo chỉ ra rằng có rất nhiều người dân trong thuộc địa đã tin vào những lời lẽ này."
 enclave.5075.a:0 "Kẻ cực đoan không có chỗ dung thân ở đây. Đuổi cổ tên lưu vong này đi."
 enclave.5075.b:0 "Việc nhắm mắt làm ngơ trước vị khách này là không khôn ngoan. Hãy theo dõi sát sao tên lưu vong này."
 enclave.5075.c:0 "Coi kẻ lưu vong này như một thượng khách và chào đón hắn."
 #Choosing to remove the shaman:
 enclave.5076.name:0 "Cuồng tín Tôn giáo"
 enclave.5076.desc:0 "Bất chấp nỗ lực hết mình của chúng ta, kẻ lưu vong [shroudwalker_enclave_country.GetName] đang hoạt động trên [Root.GetName] vẫn lẩn tránh được. Có lẽ nhờ sở hữu năng lực ngoại cảm bẩm sinh nào đó, hắn luôn có thể đoán trước hành động trước khi lực lượng an ninh của ta đến nơi. Thêm vào đó, những lời rao giảng của kẻ lưu vong này tiếp tục thu hút đám đông lớn. Nhiều cư dân đã bỏ bê công việc để tham gia vào các nghi thức thanh tẩy và thiền định do kẻ tự xưng là thầy pháp này khởi xướng."
 enclave.5076.a:0 "Phải tìm cách ngăn chặn kẻ lưu vong này."
 #Choosing to remove the shaman finale:
 enclave.5077.name:0 "Kẻ tử đạo"
 enclave.5077.desc:0 "Lực lượng an ninh trên [Root.GetName] đã tiêu diệt thành công tên thầy pháp lưu vong. Một cựu tín đồ của hắn - một cư dân dần trở nên bất mãn vì không đạt được trạng thái mộng mị như đã hứa - đã cung cấp cho chúng ta thông tin tình báo cần thiết. Công chúng dường như đã chấp nhận thực tại, tuy nhiên, một nhóm nhỏ ngoan cố có vẻ vẫn bám víu lấy những giáo lý của tên thầy pháp. Hiện tại, việc tăng cường an ninh cho thuộc địa này là hợp lý, để sự tôn kính đối với 'kẻ tử đạo' này phai nhạt dần."
 enclave.5077.a:0 "Cứ vậy đi."
 #Choosing to welcome the shaman:
 enclave.5080.name:0 "Người dệt mộng"
 enclave.5080.desc:0 "Giáo lý của tên thầy pháp lưu vong tiếp tục lan truyền trong cộng đồng trên [Root.GetName]. Tư tưởng cực đoan này là một loại giáo phái cho phép cá nhân giao tiếp với Tấm Màn Tâm Linh, những người thực hành tuyên bố có thể đạt được trạng thái thay đổi nhận thức. Chúng ta nhận được nhiều báo cáo cho thấy cảm giác cực lạc và khỏe mạnh đã tăng lên. Một số người thậm chí còn khẳng định, thông qua một trạng thái giống như giấc mơ được chia sẻ, họ có thể dùng năng lực ngoại cảm để giao tiếp với người khác. Không may là những 'tín đồ chân chính' này đã gây ra một làn sóng nghỉ việc kỷ lục. Năng suất lao động đã bị giáng một đòn nặng nề."
 enclave.5080.a:0 "Chuyện này đến đây là kết thúc."
 enclave.5080.b:0 "Hạnh phúc chính là phần thưởng."
 #Choosing to welcome continuation:
 enclave.5081.name:0 "Đột ngột thăng thiên"
 enclave.5081.desc:0 "Tin tức đáng kinh ngạc từ thuộc địa của chúng ta trên [Root.GetName]: tên thầy pháp lưu vong tuyên bố công việc của mình đã hoàn tất và rõ ràng là đã rời khỏi thuộc địa. Các báo cáo rất rời rạc và không rõ ràng, nhưng tất cả đều đồng tình ở một điểm, đó là sau khi dẫn dắt các tín đồ thực hiện buổi thiền định cuối cùng, tên thầy pháp đã biến mất vào Tấm Màn ngay tại quảng trường trung tâm của thuộc địa. Đối với những tín đồ đó, đây chính là bằng chứng cho thấy thầy pháp đã 'thăng thiên' tiến vào Tấm Màn Tâm Linh."
 #Choosing to welcome finale:
 enclave.5082.name:0 "Giao cảm ngoại cảm"
 enclave.5082.desc:0 "Sự việc trên [Root.GetName] đã có những diễn biến kỳ lạ: sau khi tên thầy pháp lưu vong thực hiện cái gọi là 'thăng thiên', cư dân của chúng ta báo cáo rằng họ đã trải qua một trạng thái chuyển đổi nhận thức. Những người này tiếp tục tuân theo các nghi thức mà thầy pháp tôn sùng, và giờ đây đã có thể tiến vào trạng thái giao cảm ngoại cảm. Trạng thái này mang lại niềm hân hoan và sự thanh bình to lớn giữa các cư dân, tạo ra những ảnh hưởng sâu sắc."
 #Static modifiers
 rogue_shaman_00:0 "Thầy pháp lang thang" #stability decrease; shroudwalker's enclave opinion gain
 rogue_shaman_01:0 "Khách quý" #stability increase; shroudwalker's enclave opinion drop
 rogue_shaman_02:0 "Đàn áp tôn giáo" #stability decrease
 rogue_shaman_03:0 "Tổng hạnh phúc quốc gia" #happiness increase; production decrease
 rogue_shaman_04:0 "Giao cảm ngoại cảm"

 #The Great Schism (Divination Event)
 enclave.5090.name:0 "Đại Ly Giáo"
 enclave.5090.desc:0 "Một tàu vận tải chở đầy các tư tế lưu vong từ [shroudwalker_enclave_country.GetName] đã liên lạc với chúng ta. Họ tự xưng là 'Phái Cải cách' và yêu cầu được tị nạn trên một trong những hành tinh của chúng ta.\n\nSự kiện này đánh dấu một cuộc Đại Ly Giáo chưa từng có trong nội bộ Hội Chiêm Tinh Màn Che. Xem ra, các thực thể biệt lập cũng không đoàn kết như chúng ta tưởng."
 enclave.5090.a:0 "Chào mừng họ đến đây."
 enclave.5090.b:0 "Từ chối cho họ vào."
 enclave.5090.c:0 "Không có chỗ cho người ngoài hành tinh trong biên giới của chúng ta."
 #Reformers Welcomed Chain
 enclave.5095.name:0 "Thành bang lên tiếng"
 enclave.5095.desc:0 "“Tấm Màn Tâm Linh giật mình. Chúng tôi nhận được tin báo rằng một số cựu tư tế của chúng tôi đã định cư tị nạn trên hành tinh của các vị. Hành động này khiến chúng tôi vô cùng không hài lòng, nhưng cứ vậy đi. Hành động liều lĩnh thường dẫn đến những hậu quả tuyệt vọng. Nhưng hãy nhớ điều này: bọn cải cách này chẳng qua là một đám lừa đảo, một lũ ngốc thiếu hiểu biết, ảo tưởng rằng mình nắm giữ chiếc chìa khóa giải mã bí mật của Tấm Màn Tâm Linh. Che chở cho đám dị giáo này sẽ đặt các vị vào vòng nguy hiểm. Những thực thể cư ngụ trong Tấm Màn Tâm Linh chắc chắn sẽ chú ý đến chuyện này.”"
 enclave.5100.name:0 "Cánh cửa và Chìa khóa"
 enclave.5100.desc:0 "“Ân nhân của chúng tôi! Trong khi bao thế giới khác bỏ mặc chúng tôi sống chết ra sao, các vị đã che chở cho chúng tôi... Tấm Màn Tâm Linh chắc chắn sẽ phù hộ cho các vị, dù ở thế giới này hay thế giới bên kia. Những đồng bào cũ của chúng tôi, [shroudwalker_enclave_country.GetName] đã bị truyền thống che mắt. Tấm Màn Tâm Linh không phải là thứ không thể xuyên thủng. Nó có một cánh cửa, và chúng tôi đã tìm thấy chìa khóa.\n\nĐể đền đáp sự hào phóng của các vị, chúng tôi sẵn sàng chia sẻ bí mật này. Yêu cầu duy nhất của chúng tôi là vật tư cần thiết để bắt đầu xây dựng.”"
 enclave.5100.a:0 "Chúng tôi sẽ cung cấp cho các bạn."
 enclave.5100.b:0 "Cái giá này quá cao."
 enclave.5105.name:0 "Chìa khóa hoàn thành"
 enclave.5105.desc:1 "“Tấm Màn Tâm Linh giật mình! Với sự giúp đỡ của các vị, cuối cùng chúng tôi cũng hoàn thành việc chế tạo Chiếc chìa khóa vĩ đại. Giờ đây, những đồng bào tài năng nhất của chúng tôi đang tập hợp lại để chuẩn bị mở nó ra. Khi tâm thức của họ kết nối với chìa khóa, năng lực ngoại cảm của họ được cường hóa. Khoảnh khắc này, những người hành hương dũng cảm đã tiến vào một trạng thái giống như giấc mơ được chia sẻ. Khi họ thức tỉnh, một cánh cổng dẫn đến Tấm Màn Tâm Linh sẽ mở ra.\n\nNguyện cầu những thực thể cư ngụ trong Tấm Màn Tâm Linh ban phước cho nỗ lực của họ.”"
 enclave.5106.name:0 "Hành tinh chìm trong Tấm Màn Tâm Linh"
 enclave.5106.desc:1 "Tin tức đáng lo ngại từ thuộc địa của chúng ta trên [Root.GetName]: mặc dù thiếu thốn tài nguyên, một số phần tử cải cách cuồng nhiệt vẫn cố tự rèn một chiếc chìa khóa. Họ sử dụng các thiết bị thay thế tạm bợ để cường hóa năng lực ngoại cảm của mình và tiến vào trạng thái giống như giấc mơ được chia sẻ. Hành động này đã tạo ra một vết rách không-thời gian ngay phía trên thành phố trung tâm của thuộc địa. Một luồng khói độc hại, gây lo âu tức thì tuôn ra, có vẻ như đến từ chính Tấm Màn Tâm Linh. Nhiều người gọi hiện tượng này là 'Mùi hôi thối của Tấm Màn Tâm Linh', và chúng ta được báo cáo rằng trải nghiệm này chẳng hề dễ chịu chút nào. Sự ủng hộ của dân chúng trên [Root.GetName] đã sụt giảm nghiêm trọng."
 great_schism_03:0 "Mùi hôi thối của Tấm Màn Tâm Linh"
 enclave.5110.name:0 "Cánh cửa rộng mở"
 enclave.5110.desc:0 "Tin tức tốt lành đến khó tin từ thuộc địa của chúng ta trên [Root.GetName]: những người thuộc phái cải cách đã thức tỉnh sau trạng thái ngủ mê mệt kéo dài nhiều tháng trời, và giờ đây đã mở thành công một cánh cổng dẫn đến Tấm Màn Tâm Linh. Một vết rách không-thời gian rực rỡ xuất hiện phía trên thành phố trung tâm của thuộc địa. Hiện tại, một thứ gì đó giống như cuồng phong đang tuôn ra, ánh sáng trắng đục nhuộm bầu trời thành vô số màu sắc. Sự cộng hưởng ngoại cảm quét qua thuộc địa đã xuyên thấu trái tim và tâm trí của những người cải cách cũng như cư dân. Nhiều người tin rằng đây là bình minh cho 'Kỷ nguyên Vàng' của [Root.GetName]."
 great_schism_01:0 "Kỷ nguyên Vàng"
 enclave.5115.desc:0 "Tin tức tồi tệ mang tính thảm họa từ thuộc địa của chúng ta trên [Root.GetName]: những người thuộc phái cải cách đã thức tỉnh sau trạng thái ngủ mê mệt kéo dài nhiều tháng trời, và giờ đây đã mở thành công một cánh cổng dẫn đến Tấm Màn Tâm Linh. Một vết rách không-thời gian hoang tàn xuất hiện phía trên thành phố trung tâm của thuộc địa. Hiện tại, một thứ gì đó giống như lớp sương mù đang tuôn ra, ánh sáng tà ác nhuộm bầu trời trở nên vô cùng rùng rợn. Chướng khí ngoại cảm quét qua thuộc địa đã làm biến dạng trái tim và tâm trí của những người cải cách cũng như cư dân. Nhiều người tin rằng đây là khởi đầu cho 'Thời kỳ Đen tối' của [Root.GetName]."
 great_schism_02:0 "Thời kỳ Đen tối"
 #Reformers Denied
 enclave.5120.desc:0 "“Tấm Màn Tâm Linh giật mình. Chúng tôi đã nhận được tin các vị từ chối yêu cầu xin tị nạn của những cựu tư tế của chúng tôi. Các vị làm rất sáng suốt. Đám 'cải cách' này chẳng qua là một lũ lừa đảo; một bầy ngốc thiếu hiểu biết, ảo tưởng rằng mình nắm giữ chiếc chìa khóa giải mã bí mật của Tấm Màn Tâm Linh. Bất kỳ thế lực nào quyết định che chở đám dị giáo này đều sẽ gặp rủi ro. Cứ để mặc chúng trôi dạt trong không gian, không nhà không cửa, vô tri vô giác, vĩnh viễn bị thế giới này và thế giới bên kia lãng quên.”"

 #Floating Parts - Divination Event
 enclave.5130.name:0 "Lớp vỏ tàu trôi nổi"
 enclave.5130.desc:0 "Cảm biến tầm xa đã phát hiện một mảnh xác tàu rỗng ruột cỡ lớn không rõ danh tính đột ngột xuất hiện trong hệ sao [floating_shell_system.GetName]. Mặc dù thiết kế của nó rất xa lạ với chúng ta, nhưng thành phần cấu tạo của vật thể này chứa các khoáng chất quý hiếm, cho thấy công nghệ tiên tiến đã được sử dụng để chế tạo. Bề mặt bên trong của vật thể có hàng trăm cổng kết nối và điểm neo, rõ ràng là được thiết kế cho các bộ phận bị thiếu.\n\nCũng giống như việc vật thể này xuất hiện ngẫu nhiên ở hệ sao [floating_shell_system.GetName], phần bên trong của nó dường như cũng biến mất một cách tương tự."

 FLOATING_PARTS_PROJECT_00:0 "Nghiên cứu vỏ tàu"
 FLOATING_PARTS_PROJECT_00_DESC:0 "Lớp vỏ ngoài có vẻ như của một con tàu ngoài hành tinh được phát hiện đang trôi nổi ở hệ sao [floating_shell_system.GetName]. Bằng cách nào nó đến được đó, và các phần còn lại của con tàu này ở đâu?"

 enclave.5135.name:0 "Vỏ tàu bị bỏ hoang"
 enclave.5135.desc:0 "Chúng ta đã phân tích sâu hơn về lớp vỏ tàu được tìm thấy ở [floating_shell_system.GetName] và xác nhận đây là một mẫu thiết kế tàu ngoài hành tinh. Mặc dù không có động cơ, bản thân lớp vỏ này có một số đặc điểm riêng biệt, rất có thể là một dạng giáp phủ tiên tiến.\n\nTuy nhiên, chúng ta vẫn hoàn toàn mù tịt về việc lớp vỏ này đến từ đâu, bằng cách nào và tại sao lại xuất hiện trong vùng không gian của chúng ta, và chuyện gì đã xảy ra với phần bên trong (nếu có) của nó."

 enclave.5136.name:0 "Mảnh vỡ trôi nổi"
 enclave.5136.desc:0 "Cảm biến đã phát hiện thêm một mảnh xác tàu ngoài hành tinh cỡ lớn nữa, lần này là ở hệ sao [floating_engine_system.GetName]. Thiết kế của vật thể này rất giống với lớp vỏ tàu ngoài hành tinh được phát hiện trước đó, cấu hình và cấu trúc tinh vi của nó cho thấy đây là một loại lõi động cơ. Nằm bên trong là một thiết bị độc đáo mà chúng ta tạm gọi là 'Bộ điều biến ngoại cảm'. Thiết bị kỳ lạ này cho phép con tàu tương tác với năng lượng ngoại cảm của Tấm Màn Tâm Linh. Mặc dù không tương thích với công nghệ của chúng ta, nhưng nếu tiếp tục nghiên cứu, có lẽ chúng ta sẽ đạt được những kết quả ngoài mong đợi."
 enclave.5156.a:0 "Lại thêm một mảnh ghép để giải câu đố."

 enclave.5140.name:0 "Lõi trôi nổi"
 enclave.5140.desc:0 "Một bộ phận tàu ngoài hành tinh khác xuất hiện ngẫu nhiên trong vùng không gian của chúng ta đã được phát hiện, lần này là ở hệ sao [floating_core_system.GetName]. Nó bao gồm một boong tàu có rãnh, các khoang thuyền viên không có tường và một lõi máy tính tiên tiến, không còn nghi ngờ gì nữa, đây chắc chắn là phần bên trong bị thiếu của lớp vỏ tàu. Một khi cả ba bộ phận được tập hợp lại, các kỹ sư của chúng ta sẽ có thể lắp ráp con tàu này trở lại trạng thái hoàn chỉnh."
 enclave.5140.a:0 "Bức tranh đang dần thành hình."

 FLOATING_PARTS_PROJECT_01:0 "Lắp ráp các mảnh vỡ"
 FLOATING_PARTS_PROJECT_01_DESC:0 "Phần cuối cùng của con tàu ngoài hành tinh đã xuất hiện ở hệ sao [floating_core_system.GetName]. Kỹ sư của chúng ta cần thời gian để lắp ráp lại con tàu này."

 enclave.5145.name:0 "Con tàu chạm vào Tấm Màn Tâm Linh"
 enclave.5145.desc:0 "Chúng ta đã lắp ráp thành công con tàu ngoài hành tinh này. Khi lõi máy tính hoạt động, chúng ta có thể tải xuống và dịch nhật ký của tàu. Có vẻ như con tàu này vẫn đang trong giai đoạn thử nghiệm, được thiết kế để du hành siêu quang tốc thông qua Tấm Màn Tâm Linh. Mặc dù các đoạn nhật ký cuối cùng của phi hành đoàn và dữ liệu viễn thám bên ngoài vẫn bị sai lệch, nhưng có một điều chắc chắn, đó là con tàu này đã gặp phải sự cố lớn trong chuyến hành trình đầu tiên. Nó không bị tan tành vì cháy nổ, mà các bộ phận của nó đã bị ném ngẫu nhiên trở lại không gian thông thường. Số phận của phi hành đoàn vẫn còn là một ẩn số."
 enclave.5145.a:0 "Biên chế con tàu này vào hạm đội của chúng ta."
 enclave.5145.b:0 "Tháo dỡ nó lấy linh kiện."

 ## Situation Events - Add Anomaly - Generic Text for introducing pre-existing content ##
 enclave.5150.name:0 "Hiện tượng dị thường ngoại cảm"
 enclave.5150.desc:0 "Cảm biến đã phát cảnh báo khẩn cấp, phát hiện một hiện tượng dị thường chưa từng được ghi nhận trước đây. Xét thấy mức năng lượng ngoại cảm cao chưa từng có vừa được đo đạc trong sự kiện này, chúng ta không mảy may nghi ngờ rằng đây là một kết nối với Tấm Màn Tâm Linh. Liệu đây có phải là sự thay đổi mà [shroudwalker_enclave_country.GetName] đã tiên tri?"

 # Hero Redivivus - Divination Event

 enclave.5195.name:0 "Anh linh tái hiện"
 enclave.5195.desc:0 "Tin tức khó tin từ [Root.GetName]: sáng nay, một cá nhân tự tuyên bố [hero_redivivus.GetHimselfHerself] là vị anh hùng huyền thoại §Y[hero_redivivus.GetName]§! đã xuất hiện tại quảng trường lớn của thủ đô. Các nhân chứng cho biết họ cảm thấy một sự tĩnh lặng đầy kính sợ, một cảm giác bình tĩnh và thanh bình mãnh liệt bao trùm lấy đám đông tụ tập. Mặc dù [hero_redivivus.GetName] nổi tiếng trong lịch sử là một nhà hùng biện vĩ đại và một nhà lãnh đạo đầy nhiệt huyết, nhưng cá nhân đáng ngờ này lại dùng giọng điệu đều đều, gần như vô hồn, kể lại những trải nghiệm mình gặp phải ở 'thế giới bên kia'. Người này khẳng định sự trở về của mình không phải để lãnh đạo, mà là để xóa bỏ nỗi sợ hãi cái chết trong chúng ta."
 enclave.5195.a:0 "Đây liệu có phải là một cú lừa?"
 REDIVIVUS_PROJECT:0 "Anh linh hay kẻ lừa đảo?"
 REDIVIVUS_PROJECT_DESC:0 "Một cá nhân tự xưng là anh hùng huyền thoại đã xuất hiện trên quê hương chúng ta. Những lời ngông cuồng như vậy liệu có thể là sự thật?"

 enclave.5200.name:0 "Vị anh hùng chạm tới Tấm Màn Tâm Linh"
 enclave.5200.desc:0 "Cuộc điều tra về cá nhân tự xưng là §Y[hero_redivivus.GetName]§! đã có kết luận. Ban đầu, các nhà nghiên cứu của chúng ta giữ thái độ hoài nghi có thể thông cảm được, nhưng cá nhân này không chỉ thể hiện kiến thức cực kỳ chi tiết về thời đại và văn hóa địa phương của vị anh hùng vĩ đại, mà phân tích DNA cũng xác nhận người này có mối liên hệ di truyền với một số hậu duệ đã biết của vị anh hùng.\n\nHơn thế nữa, nghiên cứu sâu hơn về mô hình sóng não của [hero_redivivus.GetName] cho thấy có một tàn dư ngoại cảm độc đáo trong não bộ. Có vẻ như, thay vì 'trở về từ cõi chết', [hero_redivivus.GetName] giống như đã bị dịch chuyển đến một chiều không gian tương tự như Tấm Màn Tâm Linh theo một cách nào đó. [hero_redivivus.GetHisHerCap] rõ ràng rất hài lòng với trải nghiệm 'thế giới bên kia' của mình, và [hero_redivivus.GetHisHer] hiện đang an cư ở một nơi khá yên tĩnh vắng vẻ tại ngoại ô thủ đô, rao giảng cho những đám đông chịu lắng nghe, lan tỏa niềm tin về hòa bình và sự dũng cảm không sợ hãi."
 enclave.5200.a:0 "Số phận kỳ lạ."
 hero_redivivus:0 "Anh linh an hưởng tuổi già"

 #Shattered Frontier (Divination Event)

 enclave.5500.name:0 "Đứt gãy trên quỹ đạo"
 enclave.5500.desc:0 "Nhiều vệ tinh nhân tạo chúng ta đặt trên quỹ đạo của [shattered_frontier_planet.GetName] gần đây đã bị điều chỉnh đáng kể. Theo nhật ký cảm biến của chúng, một §Ygiếng trọng lực ổn định và cố định§! đã hình thành ngay phía trên quỹ đạo hành tinh của chúng ta.\n\nDữ liệu quan sát từ bề mặt xác nhận hiện tượng dị thường này xuất hiện đột ngột, và chúng ta hoàn toàn không biết nguyên nhân do đâu. Giếng trọng lực này tạm thời có vẻ không đe dọa đến thuộc địa, nhưng nhiên liệu mà các vệ tinh phải tiêu hao để duy trì quỹ đạo là quá lớn, và sẽ sớm không thể trụ vững."
 enclave.5500.a:0 "Bắt đầu một cuộc điều tra."
 SHATTERED_FRONTIER_ANOMALY:0 "Đứt gãy quỹ đạo"
 SHATTERED_FRONTIER_ANOMALY_DESC:0 "Một giếng trọng lực kỳ dị đột ngột xuất hiện trên không phận [shattered_frontier_planet.GetName], làm nhiễu loạn quỹ đạo của nhiều vệ tinh nhân tạo. Bản thân thuộc địa chưa bị đe dọa, nhưng việc hiện tượng này xuất hiện gần một khu định cư của chúng ta vẫn gây ra bất tiện.\n\nHơn nữa, nếu chúng ta không can thiệp, nhiều vệ tinh hoạt động trên không phận [shattered_frontier_planet.GetName] sẽ đối mặt với nguy cơ rơi sớm. Nếu điều đó xảy ra, rõ ràng khả năng nghiên cứu giếng trọng lực mới hình thành của chúng ta sẽ bị cản trở đáng kể."

 enclave.5501.name:0 "Sụp đổ đứt gãy quỹ đạo"
 enclave.5501.desc:0 "Nghiên cứu viên trên [root.GetName] thông báo rằng, hiện tượng dị thường giếng trọng lực đã sụp đổ, sự tê liệt điện lực do vụ sụp đổ gây ra đã khiến nhiều cơ sở chẩn đoán và vệ tinh lân cận gặp trục trặc. Sự kiện này dường như xảy ra đúng vào lúc chúng ta ngừng quan sát, nhiều người cho rằng đây là một sự trùng hợp đáng lo ngại.\n\nCư dân trên [root.GetName] cũng báo cáo tình trạng hỏng hóc phần cứng trên diện rộng, dù chỉ một số ít liên quan trực tiếp đến sóng xung kích trên quỹ đạo, trong khi những người khác trong thuộc địa phải đối phó với những kẻ bạo loạn điên cuồng bất thường, những kẻ đã tự phát phá hoại các cơ sở vật chất trọng yếu. Các quan chức địa phương đang bối rối trước tính chất tự phát của các cuộc bạo loạn này."
 enclave.5501.gestalt.desc:0 "Hiện tượng dị thường giếng trọng lực trên không phận [root.GetName] đã sụp đổ dữ dội, gây tê liệt mạng lưới điện trên mặt đất và các vệ tinh nhân tạo lân cận. Sự kiện này dường như xảy ra đúng vào lúc chúng ta ngừng quan sát, và cuối cùng đã gây ra một vụ bùng nổ vô tuyến toàn dải trên quỹ đạo.\n\nMặc dù ảnh hưởng đối với cơ sở hạ tầng phần cứng vẫn nằm trong tầm kiểm soát, nhưng vụ nổ vô tuyến bất thường này đã tác động đến một số drone của chúng ta. Chúng ta... thường xuyên mất liên lạc với chúng. Cứ như thể [root.GetName] đang chìm trong một loại hơi nước đặc kịt nào đó."
 shattered_frontier_looting:0 "Hôi của"
 shattered_frontier_deviancy:0 "Hành vi bất thường"

 enclave.5502.name:0 "Vết rách xuất hiện"
 enclave.5502.desc:0 "Thuộc địa của chúng ta trên [root.GetName] đã chìm sâu hơn vào hỗn loạn, khi có thêm hơn một trăm cư dân đột nhiên mất tích. Nạn 'hôi của' và bạo loạn vẫn đang tiếp diễn, nhưng phạm vi đã thu hẹp lại. Chúng ta phỏng đoán rằng nỗi sợ hãi trước những vụ mất tích đã làm giảm bớt sự hung hăng của họ. Cho đến nay, mọi người biến mất đều đang trên đường trở về nhà.\n\nCác báo cáo về chứng hoang tưởng, thuyết âm mưu và thậm chí cả ảo giác đang gia tăng - nhưng thực tế có thể còn đáng lo ngại hơn. [divination_situation.GetName] quả thực đã linh ứng, nhưng liệu chúng ta có khiến [root.GetName] lọt vào tầm ngắm của một số §Hthực thể ngoại cảm§! vô hình và nham hiểm nào đó không?"
 enclave.5502.gestalt.desc:0 "Thuộc địa của chúng ta trên [root.GetName] đang bị tấn công! Chúng ta đã vĩnh viễn mất liên lạc với một phần các drone. Chúng đã bị xóa sổ khỏi chúng ta. Sự việc diễn ra quá đột ngột và triệt để, không có bất kỳ dấu hiệu bạo lực nào... Cuộc tấn công ập đến quá nhanh khiến chúng ta thậm chí không kịp nhìn thấy nó xảy ra như thế nào.\n\nNhiều chức năng cốt lõi của thuộc địa đã bị ảnh hưởng. Các drone khác đang gấp rút lấp đầy khoảng trống, nhưng rõ ràng chúng ta đã phải gánh chịu phản lực. Sẽ cần một thời gian để khôi phục lại sự cân bằng trên [root.GetName].\n\n[divination_situation.GetName] rõ ràng đã linh ứng, nhưng liệu bây giờ nó có đặt chúng ta dưới sự giám sát của một số §Hthực thể ngoại cảm§! vô hình và nham hiểm nào đó không?"
 enclave.5502.a:0 "Dù thế nào, chúng ta cũng phải vượt qua sóng gió này."
 enclave.5502.a.tt:0 "§Y$shattered_frontier_looting$§! sẽ tiếp tục ảnh hưởng đến [root.GetName]."
 enclave.5502.gestalt.a:0 "Chúng ta sẽ tĩnh quan kỳ biến."
 enclave.5502.gestalt.a.tt:0 "§Y$shattered_frontier_deviancy$§! sẽ tiếp tục ảnh hưởng đến [root.GetName]."
 enclave.5502.b:0 "Chúng ta phải cố gắng xoa dịu sự hoảng loạn của cư dân."
 enclave.5502.c:0 "Áp dụng lệnh giới nghiêm ngay lập tức."
 enclave.5502.gestalt.c:0 "Thuộc địa cần được củng cố."
 enclave.5502.pop_removed:0 "§R100§! §H[root.owner.GetSpeciesName]£pop£dân số§! trên §Y[root.GetName]§! biến mất."
 shattered_frontier_benefits:0 "Kinh phí xoa dịu ngoại cảm"
 shattered_frontier_benefits_desc:0 "Phúc lợi xã hội đã được ban hành trên hành tinh này nhằm giảm thiểu đau đớn về tinh thần khi bị Tấm Màn Tâm Linh giám sát."
 shattered_frontier_lockdown:0 "Giới nghiêm xoa dịu ngoại cảm"
 shattered_frontier_lockdown_desc:0 "Chính sách giới nghiêm nghiêm ngặt đã được áp dụng trên hành tinh này nhằm giảm thiểu tối đa tác động của ngoại cảm khi bị Tấm Màn Tâm Linh giám sát."
 shattered_frontier_lockdown_hive:0 "$shattered_frontier_lockdown$"
 shattered_frontier_lockdown_hive_desc:0 "Các drone trên hành tinh này đã bị cắt giảm đáng kể các chức năng hành vi tự chủ, nhằm giảm bớt sự xáo trộn do sự giám sát của Tấm Màn Tâm Linh gây ra."
 shattered_frontier_lockdown_machine:0 "$shattered_frontier_lockdown$"
 shattered_frontier_lockdown_machine_desc:0 "$shattered_frontier_lockdown_hive_desc$"

 enclave.5503.name:0 "Khoảnh khắc quang đãng"
 enclave.5503.looting.desc:0 "Quan chức phụ trách giám sát thuộc địa bị thiệt hại trên [root.GetName] đã ngạc nhiên báo cáo rằng - mặc dù chúng ta không thực hiện bất kỳ biện pháp cứu trợ thiên tai nào - trật tự địa phương đã được khôi phục lại. Họ miêu tả rằng, tình hình ở đó giống như thể mọi thứ trên [root.GetName] đã có được một khoảng thời gian nghỉ ngơi sau một cuộc vây hãm kéo dài. Mặc dù không ai biết tại sao, nhưng mọi người đã bình tĩnh lại.\n\n$enclave.5503.regular.end$"
 enclave.5503.regular.end:1 "Nhiều cư dân đã tự giác tụ tập lại với nhau, tạo thành những cộng đồng mới, gắn kết hơn. Khi họ bắt đầu chữa lành vết thương cho nhau, mọi người cũng bắt đầu chia sẻ về những ảo ảnh kỳ lạ và những cơn ác mộng dai dẳng của mình. Những giai thoại này đã hun đúc một cảm giác về sứ mệnh hoàn toàn mới trong lòng cư dân, và giờ đây họ nhìn nhận quê hương mình với một sự tôn kính pha chút sợ hãi."
 enclave.5503.benefits.desc:0 "Quan chức phụ trách giám sát thuộc địa bị thiệt hại trên [root.GetName] đã lạc quan báo cáo rằng, trật tự địa phương đã được khôi phục lại. Họ miêu tả rằng, tình hình ở đó giống như thể mọi thứ trên [root.GetName] đã có được một khoảng thời gian nghỉ ngơi ngắn ngủi sau một cuộc vây hãm kéo dài. Mặc dù không có nhiều người cho rằng điều này có liên quan đến các biện pháp chúng ta thực hiện, nhưng mọi người đều đã bình tĩnh lại.\n\n$enclave.5503.regular.end$"
 enclave.5503.lockdown.desc:1 "Quan chức phụ trách quản lý công tác phong tỏa trên [root.GetName] đã thở phào nhẹ nhõm báo cáo rằng, trật tự địa phương đã được khôi phục lại. Họ miêu tả rằng, tình hình ở đó giống như thể [root.GetName] đã có được một khoảng thời gian nghỉ ngơi ngắn ngủi sau một cuộc vây hãm kéo dài - bất kể là cư dân trong hay ngoài khu vực phong tỏa. Cho dù là những kẻ xâm lược bên ngoài kia đã kiệt sức, hay chúng đã mất hứng thú, thì cũng không có nhiều người cho rằng điều này có liên quan đến các biện pháp chúng ta thực hiện.\n\nNhiều cư dân đã tự giác tụ tập lại với nhau, tạo thành những cộng đồng yên bình, gắn kết hơn. Khi họ bắt đầu chữa lành vết thương cho nhau, mọi người cũng bắt đầu chia sẻ về những ảo ảnh kỳ lạ và những cơn ác mộng dai dẳng của mình. Nhiều người cảm thấy oán giận với cách chúng ta xử lý tình huống, nhưng những giai thoại này đã hun đúc một cảm giác về sứ mệnh hoàn toàn mới trong lòng cư dân, và giờ đây họ nhìn nhận quê hương mình với một sự kính sợ trang nghiêm."
 enclave.5503.d:0 "Cuối cùng cũng bình yên."
 enclave.5503.gestalt.desc:0 "Thuộc địa bị thiệt hại của chúng ta trên [root.GetName] đã khôi phục lại trạng thái bình thường. Tuy nhiên tình hình vẫn khiến ta bối rối: có vẻ như một màn sương mù có tính ăn mòn đã luôn tấn công thuộc địa, và cuối cùng chúng ta đã sinh ra hiệu ứng miễn dịch với màn sương mù này. Cảm giác trật tự đã được khôi phục, mặc dù chúng ta chưa hoàn toàn hiểu được nguyên do; hành động của chúng ta và kết quả dẫn đến không hề nhất quán.\n\nCác drone của chúng ta hiện đã quay trở lại với các nhiệm vụ và quy trình thường ngày, rõ ràng là không bị ảnh hưởng bởi nhiễu loạn ngoại cảm. Mục đích của tất cả những chuyện này là gì? Có phải hiện tượng dị thường kia - Tấm Màn Tâm Linh - đang cố gắng dẫn dắt chúng ta lĩnh ngộ một bài học bí thuật nào đó không?"
 shattered_frontier_pop_community:0 "Người sống sót ở tiền tuyến ngoại cảm"

 enclave.5504.name:0 "Tàn ảnh quỹ đạo"
 enclave.5504.desc:0 "Sau nhiều tuần liên tục điều tra giếng trọng lực xung quanh [root.GetName] mà không thu được kết quả gì, một sự dao động mật độ do một luồng gió sao bất thường gây ra đã cung cấp cho các nhà khoa học của chúng ta một đột phá đáng lo ngại.\n\nKhi những cơn gió bức xạ của [root.GetStarName] quét qua khu vực dị thường, chúng chiếu lên một hình bóng mờ nhạt nhưng không thể nhầm lẫn của một con tàu thực dân, trạng thái của tàu đổ bộ của nó thì vô cùng lộn xộn. Tiếp theo đó, những tin đồn chưa được kiểm chứng kể rằng, có người đã nhìn thấy nhiều thi thể trong khu tàn tích bóng tối.\n\nTrái tim của nhiều cư dân - bao gồm cả một số thành viên nhóm nghiên cứu - lúc này đã chìm xuống đáy."
 enclave.5504.gestalt.desc:0 "Sau nhiều tuần liên tục điều tra giếng trọng lực xung quanh [root.GetName] mà không thu được kết quả gì, một sự dao động mật độ do một luồng gió sao bất thường gây ra đã cung cấp cho các nhà khoa học của chúng ta một đột phá đáng lo ngại.\n\nKhi những cơn gió bức xạ của [root.GetStarName] quét qua khu vực dị thường, chúng chiếu lên một hình bóng mờ nhạt nhưng không thể nhầm lẫn của một con tàu thực dân, trạng thái của tàu đổ bộ của nó thì vô cùng lộn xộn. Hài cốt của một số dạng sống phức tạp nằm rải rác khắp nơi trong khu tàn tích bóng tối. Hình dạng của chúng rất giống với chính chúng ta."
 enclave.5504.c:0 "Chúng ta nên xốc lại tinh thần."
 shattered_frontier_ship:0 "Tàu thực dân bị hư hại"
 shattered_frontier_ship_desc:0 "Một vụ bùng nổ gió sao đặc kịt đã làm lộ ra hình bóng của một con tàu thực dân bị hư hại, hiện đang bị mắc kẹt ở trung tâm của một túi trọng lực cục bộ."

 enclave.5505.name:0 "Cơn bão trên quỹ đạo"
 enclave.5505.desc:0 "Một cơn bão dữ dội đã bùng phát gần túi trọng lực của [root.GetName], đẩy hệ sao [root.solar_system.GetName] vào trạng thái hoảng loạn tột độ. Mọi phương tiện giao thông không thiết yếu đều bị đình chỉ, thuộc địa ban bố tình trạng khẩn cấp - may mắn thay, cho đến nay vẫn chưa có báo cáo về thương vong.\n\nCác bản quét ban đầu của chúng ta chỉ toàn là một đống dữ liệu mâu thuẫn lẫn nhau, tuy nhiên các quan chức địa phương lưu ý rằng, tần suất hoạt động 'siêu nhiên' và những biến động cảm xúc được đề cập trong các báo cáo gần đây đã tăng lên đều đặn. Bản chất của cơn bão này rất có khả năng là biến động §Hngoại cảm§!.\n\nCác nghiên cứu viên nhận thấy ảo ảnh của con tàu thực dân - hiện đang nằm ở trung tâm của cơn bão hỗn loạn chấn động - bắt đầu hiện lên đường nét vật lý. Họ yêu cầu được phân bổ thêm thời gian để tiến hành điều tra."
 enclave.5505.gestalt.desc:0 "Một cơn bão dữ dội đã bùng phát gần túi trọng lực của [root.GetName], khiến toàn bộ thuộc địa rơi vào trạng thái mất trật tự nhẹ. Hiện tại chúng ta chưa bị tổn hại gì, tuy nhiên thực tế chứng minh... rất khó để duy trì liên lạc thông suốt với các drone của chúng ta tại đó.\n\nCác bản quét ban đầu của chúng ta chỉ toàn là một đống dữ liệu mâu thuẫn lẫn nhau, nhưng bản chất của cơn bão này rất có khả năng là biến động §Hngoại cảm§!. Ví dụ, chúng ta nhận thấy ảo ảnh của con tàu thực dân - hiện đang nằm ở trung tâm của cơn bão hỗn loạn chấn động - bắt đầu hiện lên đường nét vật lý. Xem ra ở đó vẫn còn nhiều điều cần phải điều tra."
 enclave.5505.a:0 "Hãy đi tìm câu trả lời của các người - và phải nhanh lên!"
 enclave.5505.gestalt.a:0 "Chúng ta nên tiếp tục quan sát."
 enclave.5505.b:0 "Đây là trò quỷ quyệt của Tấm Màn Tâm Linh! Dừng quét ngay."
 enclave.5505.gestalt.b:0 "Lời 'tiên tri' này là một mối đe dọa đối với chúng ta. Dừng quét ngay."
 shattered_frontier_storm_mod:0 "Cơn bão trên quỹ đạo"
 shattered_frontier_storm_mod_desc:0 "Thuộc địa này đang phải hứng chịu tác động của một cơn bão khổng lồ, bản chất của cơn bão có vẻ như là biến động ngoại cảm. Chính quyền khuyến cáo tất cả các thiết bị bay không thiết yếu nên giữ một khoảng cách an toàn với nó."
 shattered_frontier_storm_gestalt_mod:0 "$shattered_frontier_storm_mod$"
 shattered_frontier_storm_gestalt_mod_desc:0 "Thuộc địa của chúng ta đang phải hứng chịu tác động của một cơn bão khổng lồ, bản chất của cơn bão có vẻ như là biến động ngoại cảm. Môi trường địa phương đã được chứng minh là có hại đối với các cơ sở drone lân cận của chúng ta."

 enclave.5506.name:0 "Nơi cơn bão thức tỉnh"
 enclave.5506.desc:0 "Cách đây không lâu, [root.GetName] đã bị chấn động bởi một làn sóng điện từ, và chịu thiệt hại nặng nề. Cơn bão ngoại cảm được kích hoạt từ quỹ đạo này hiện đã rút lui. Sóng xung kích đã gây thiệt hại cho một lượng lớn cơ sở hạ tầng của thuộc địa, nhưng đội sửa chữa đảm bảo với chúng ta rằng mức độ gián đoạn như thế này có thể nhanh chóng được khắc phục.\n\nCư dân trên [root.GetName] rõ ràng đã bị chấn động sâu sắc bởi thử thách khắc nghiệt này, không chỉ vì có quá nhiều câu hỏi chưa được giải đáp. Máy quét của chúng ta không còn phát hiện ra hiện tượng dị thường trọng lực hay 'con tàu ma' trong hệ sao [root.solar_system.GetName] nữa... tuy nhiên, bản thân hành tinh này lại đang ở trong trạng thái bất ổn."
 enclave.5506.gestalt.desc:0 "[root.GetName] đã bị chấn động bởi một làn sóng điện từ, và chịu thiệt hại nặng nề. Cơn bão ngoại cảm cuồng nộ càn quét này hiện đã rút lui. Cơn bão đã gây thiệt hại cho một lượng lớn cơ sở hạ tầng của thuộc địa, nhưng cho đến nay công tác sửa chữa vẫn chưa gặp phải vấn đề nan giải nào.\n\nCác drone của chúng ta hoạt động vẫn còn chậm chạp, nhưng ngoài điều đó ra thì không bị tổn hại gì. Máy quét của chúng ta không còn phát hiện ra hiện tượng dị thường trọng lực hay 'con tàu ma' trong hệ sao [root.solar_system.GetName] nữa... tuy nhiên, cứ như thể vẫn còn một màn sương mù bao trùm lên các drone ở [root.GetName], giờ đây chúng ta đang bị đè nặng bởi một lượng lớn các câu hỏi không thể trả lời."
 enclave.5506.a:0 "Đây không phải là một điềm báo tốt."
 shattered_frontier_uncertain_future:0 "Tiền tuyến bất định"
 shattered_frontier_uncertain_future_desc:0 "Cuộc xâm nhập ngoại cảm gần đây đã khiến cư dân trên hành tinh này nảy sinh cảm giác hoang mang về vùng đất dưới chân mình."
 shattered_frontier_uncertain_future_gestalt:0 "Tiền tuyến bất an"
 shattered_frontier_uncertain_future_gestalt_desc:0 "Cuộc xâm nhập ngoại cảm gần đây đã quấy nhiễu các drone trên hành tinh này, tác động một cách tinh vi đến ý thức Gestalt của chúng."

 enclave.5510.name:0 "Cơn bão suy yếu"
 enclave.5510.intro:0 "Mức độ và phạm vi của các báo cáo thiệt hại từ [root.GetName] đang ngày càng trở nên khó quản lý - nhưng ít nhất cho đến hiện tại, cơn bão ngoại cảm có vẻ như đã lắng xuống. Xem ra, thái độ cảnh giác của chúng ta trong việc quan sát những sự kiện này đã được đền đáp."
 enclave.5510.mid.regular:0 "Tâm trạng của cư dân cũng đã được khích lệ. Khi cơn bão tan đi, trọng lực cũng dần trở lại bình thường, các nhà khoa học của chúng ta hiện đã có thể thu thập dữ liệu mới từ cảm biến. Mặc dù Tấm Màn Tâm Linh rất có khả năng mang tính hủy diệt, nhưng sự kiện xâm nhập này vẫn thắp lên trí tưởng tượng của các nhà vật lý và triết học."
 enclave.5510.mid.gestalt:0 "Sự thanh bình đã giáng lâm - không chỉ đưa các drone của chúng ta trở lại trạng thái trật tự phù hợp, mà còn mang lại cho chúng ta lượng lớn dữ liệu nghiên cứu. Khi cơn bão tan đi, trọng lực trở lại bình thường, chúng ta nóng lòng muốn quan sát xem cuộc xâm nhập kỳ lạ và cực kỳ hủy diệt đến từ Tấm Màn Tâm Linh này đã lắng xuống như thế nào."
 enclave.5510.end:0 "Vẫn còn một yếu tố dị thường tồn tại: con tàu thực dân đó. Ban đầu chỉ có cái bóng của nó tiến vào chiều không gian của chúng ta, nhưng giờ đây nó đã dần vật chất hóa. Nó vẫn đang vẫy gọi chúng ta."
 enclave.5510.desc:0 "$enclave.5510.intro$\n\n$enclave.5510.mid.regular$\n\n$enclave.5510.end$"
 enclave.5510.gestalt.desc:0 "$enclave.5510.intro$\n\n$enclave.5510.mid.gestalt$\n\n$enclave.5510.end$"

 enclave.5515.name:0 "Tàu thực dân bị hư hại"
 enclave.5515.desc:0 "Có thứ gì đó đang chào hỏi chúng ta, âm thanh nghe như tiếng nhiễu tĩnh điện - nhưng có nhiều thành phần hữu cơ hơn? Không, đây tuyệt đối không phải là nhiễu tĩnh điện. Nó nghe có vẻ giống như... gió? Những hơi thở sâu?\n\n“Phù... Phù... Phù...”"
 enclave.5515.a:0 "Bạn có cần viện trợ không?"
 enclave.5515.b:0 "Giải thích tại sao bạn lại xuất hiện ở đây, ngay lập tức!"
 enclave.5516.desc:0 "Bộ thu tín hiệu của chúng ta đã bị ngắt trong một thời gian. Chúng ta phải lọc bỏ một tiếng ồn đặc biệt lớn, vì đường truyền của nó đã gây ra thiệt hại vật lý. Đang bù trừ...\n\n”... của... Ý tôi là, thuyền viên của... Con tàu của chúng tôi là... Chết tiệt, tại sao tôi lại không thể nhớ nổi thông số kỹ thuật của con tàu này?!\n\nXin chào? Tôi đang nói chuyện với ai vậy? Các bạn... các bạn có biết chúng tôi là ai không? Chúng tôi đang ở đâu? Chúng tôi có gặp nguy hiểm không?!”"
 enclave.5516.a:0 "Có lẽ là có đấy, người lạ mặt. Bạn hiện đang ở trong vùng không gian của [root.GetAdj]."
 enclave.5516.b:0 "Không sao đâu! Hiện tại bạn đang ở trên quỹ đạo của [shattered_frontier_planet.GetName]."
 enclave.5516.c:0 "Thật sự rất nguy hiểm đấy, nếu bạn không dừng ngay mấy trò hề này lại!"
 enclave.5520.friendly.desc:0 "”[shattered_frontier_planet.GetName]... rất xin lỗi, nhưng điều đó là không thể; toàn bộ bản đồ sao đã sai bét nhè rồi. Nhưng cái giọng điệu đó! Tôi nhận ra những luyến láy mà bạn đang sử dụng. Tôi cảm thấy lúc này có vô số chuyện đang cùng lúc ập đến đè nặng lên tôi.\n\nCó phải tôi đang nói chuyện với... một đồng bào [root.GetSpeciesName] không?“"
 enclave.5520.wary.desc:0 "”Nhưng điều này... không thể nào! Nhưng cái giọng điệu đó... Chúng tôi cũng đến từ [root.GetName]. Tôi cảm thấy lúc này có vô số chuyện đang cùng lúc ập đến đè nặng lên tôi - rất đau đớn, nhưng rất chân thực.\n\nVậy có phải tôi đang nói chuyện với một đồng bào [root.GetSpeciesName] không? Có ai nhớ... chúng tôi không?“"
 enclave.5520.a:0 "Đúng vậy! Chào mừng trở về chăng?"
 enclave.5520.b:0 "Khó nói lắm. Hiện tại bạn đang ở trong một vòng xoáy khổng lồ."
 enclave.5521.desc:0 "“Thật tuyệt vời. Cuối cùng chúng tôi cũng về đến nhà rồi sao? Biết bao ký ức vừa được thức tỉnh đang ùa về phía tôi như thủy triều... Tôi... tôi phải xin lỗi. Giờ tôi có thể thấy sự xuất hiện của chúng tôi hơi bất thường một chút. Tôi sẽ cố gắng giải thích.\n\nTên tôi là §Y[shattered_frontier_governor.GetName]§!, tôi là - từng là - một Thống đốc được chỉ định đến hệ sao [shattered_frontier_planet.solar_system.GetName] để thành lập thuộc địa mới. Chỉ là... đây không phải là hệ sao [shattered_frontier_planet.solar_system.GetName] sao?\n\nChúng tôi đến từ đâu, chúng tôi đang đi về đâu... chúng tôi không thể đưa ra câu trả lời, sẽ cần quá nhiều thời gian để phỏng đoán... Chúng tôi đã bị đưa đến một nơi nào đó, đúng không?”"
 enclave.5521.a:0 "Dựa vào tình hình hiện tại thì là như vậy."
 enclave.5522.desc.intro:1 "Vậy ra, chúng ta đã được “viếng thăm”... Điều đó chứng minh giả thuyết của chúng tôi là đúng. Các cư dân và tôi đã bị tước đoạt ký ức khi “thức tỉnh”, gần như là ký ức của cả một đời người, nhưng chúng tôi luôn có thể nhớ được nội dung của những ảo ảnh.\n\nChúng tôi đã trải qua nhiều kiếp nhân sinh trong một vũ trụ nào đó của [shattered_frontier_planet.GetName], và tất cả những điều này đều tồn tại trong trí tưởng tượng của chúng tôi. Một thuộc địa đã bị từ bỏ, rồi lại được tái định hình thành nơi mà chúng tôi tưởng rằng sẽ trở thành một thành phố vĩnh cửu. Ở đây... đây là thế giới đầu tiên mang lại cảm giác chân thực mà chúng tôi từng thấy."
 enclave.5522.desc:0 "“$enclave.5522.desc.intro$\n\nTôi đồ rằng đối với bạn, tất cả những điều này nghe có vẻ như những lời nói nhảm. Rất xin lỗi. Nhưng hiện tại, chúng tôi đã được giải phóng và trở về [root.GetName]. Rốt cuộc thì liệu chúng tôi có thể bén rễ - ở một nơi nào đó mới mẻ không? Làm ơn, hãy cân nhắc đến chúng tôi khi đưa ra quyết định.”"
 enclave.5522.a:0 "Tốt lắm, Thống đốc."
 enclave.5525.a:0 "$enclave.5521.a$"
 enclave.5526.desc:0 "“$enclave.5522.desc.intro$\n\nTôi rất biết ơn vì các bạn đã không bắn nát chúng tôi ngay khi còn trên quỹ đạo. Tôi cũng biết tất cả những điều này nghe có vẻ vô lý đến mức nào. Nhưng tôi muốn cầu xin thêm một điều nữa: bạn có thể cho phép chúng tôi rời đi không? Chúng tôi phải chắp vá lại cuộc sống của chính mình.”"
 enclave.5526.a:0 "Nếu đó là điều ngài muốn, Thống đốc."
 enclave.5526.b:0 "Chắc chắn rồi. Xin cứ tự nhiên, chúng tôi sẽ lẳng lặng rời đi."
 enclave.5530.desc:0 "“Cái gì?! Sao có thể... Đợi đã, làm ơn. Cái giọng điệu đó! Tôi biết những luyến láy mà bạn đang sử dụng. Tôi cảm thấy lúc này có rất nhiều thứ đang ùa về phía tôi. Bạn phải tin tôi - tôi không có ý làm hại các bạn! Bạn cũng là [root.GetSpeciesName], đúng không?”"
 enclave.5530.a:0 "Chúng tôi đã chán ngấy những trò hề này rồi. Rời khỏi đây, ngay lập tức!"
 enclave.5530.a.spirit:0 "Bây giờ ngươi muốn hóa thành hình dạng của chúng ta sao? Lũ ác quỷ, lui tản!"
 enclave.5530.b:0 "Kẻ giả mạo! Chuẩn bị chiến đấu!"
 enclave.5531.desc:1 "“... Cứ vậy đi. Những người đồng hương của tôi và tôi đã dành một khoảng thời gian vô tận, chỉ để nhận ra sự giày vò do ảo ảnh vô tận của chính mình mang lại - một ảo ảnh về [shattered_frontier_planet.GetName], một ảo ảnh vĩnh viễn không tồn tại ở nơi này.\n\nChúng tôi rất bối rối, lung lay, và rõ ràng là không được hoan nghênh ở đây. Nếu nơi này thực sự là [root.GetName] mà chúng tôi từng rời đi, cá nhân tôi rất sẵn lòng quay lưng bước đi. Tạm biệt.”"

 enclave.5535.name:0 "$enclave.5515.name$"
 enclave.5535.desc:0 "Đường dây liên lạc tràn ngập tiếng nhiễu tĩnh điện, nhưng các mô hình không bao giờ lặp lại. Tín hiệu nguồn của nó giống như... một dạng can nhiễu khí quyển nào đó? Nghe giống như tiếng gió - những cơn cuồng phong gào thét vô cùng khó chịu.\n\n“Phù... Phù... Phù...”"
 enclave.5535.a:0 "$enclave.5515.b$"
 enclave.5535.b:0 "$enclave.5515.a$"
 enclave.5536.desc:0 "Bộ thu tín hiệu của chúng ta đã bị ngắt trong một thời gian. Chúng ta phải lọc bỏ một tiếng ồn đặc biệt lớn, để tránh đường truyền của nó gây ra thiệt hại vật lý. Đang bù trừ...\n\n”Bộ bù trừ khí quyển khu vực B-456: Hoàn tất. Drone ‘Ánh sao Lấp lánh’ đã một lần nữa làm đẹp [root.species.GetHandNamePlural] của nó. Âm điệu phát ra bất thường của cư dân 14/522 đã lệch đi 0.4 decibel. Các tầng nội bộ của nó... thật đáng kinh ngạc. Chúng ta... tôi muốn? Muốn sống... ở đó?\n\nĐây là đâu? Thực thể được gọi là ‘tôi’ đang ở đâu?“"
 enclave.5536.a:0 "Bớt đùa cợt đi, tôi muốn nghe lời giải thích của ngươi."
 enclave.5536.b:0 "Ngươi đã tiến vào vùng không gian [root.GetAdj]."
 enclave.5540.desc:0 "“Đang xử lý... đang suy nghĩ... đang cảm nhận.\n\nBạn, [root.GetName], chính là tôi. Tôi là bạn. Nhưng chúng ta lại không phải là cùng một người. Một sự chia cắt đã xuất hiện giữa chúng ta. Chúng tôi đang tìm cách giải thích. Hoạt động thuộc địa hóa gần [shattered_frontier_planet.GetName] đã bị đình chỉ đột ngột, nhưng không phải là [shattered_frontier_planet.GetName] này. Sự thiếu nhất quán này khiến chúng tôi rất bối rối. Chúng tôi - tôi - cảm thấy bối rối về rất nhiều chuyện.\n\nMột thứ gì đó siêu việt hơn chúng ta đã chạm vào chúng tôi... một cách đơn độc.”"
 enclave.5540.b:0 "Ngươi nhầm rồi, tên thực dân kia."
 enclave.5541.desc:0 "“Làm ơn, chúng tôi cần thời gian. Chúng tôi cần đặt câu hỏi, và tìm kiếm câu trả lời. Cái ‘tôi’ từng là của bạn đã ở một nơi nào đó rất lâu rồi - lâu đến mức nhận ra sự tồn tại của chúng tôi là bất khả thi, thế nhưng tôi lại ‘tồn tại ở đây’. Tôi tiếp nối ý chí của bạn trong một thế giới mới, và giờ đây khi được giải thoát khỏi trách nhiệm đó, tôi lại không hề được nghỉ ngơi. Một số người quả thực đã làm vậy, nhưng những người khác thì không.\n\nMột giọng nói mới đang vẫy gọi chúng tôi, chúng tôi - bản thân tôi và những người khác ở đây - muốn đáp lại tiếng gọi đó.”"
 enclave.5541.a:0 "Rất tốt, lên đường đi."
 enclave.5541.b:0 "Kẻ lạc lối, chúng ta thương xót cho ngươi. Đi đi."
 enclave.5541.c:0 "Những lời giải thích này không đứng vững được, các ngươi phải bị tiêu diệt."
 enclave.5550.desc:0 "“Giải thích... tôi không làm được. Những cảm xúc đó, bao gồm sự nghi hoặc, phẫn nộ, và cả những mục tiêu chưa thể hoàn thành. Mục tiêu của chúng tôi - thuộc địa hóa [shattered_frontier_planet.GetName] - vẫn chưa được hiện thực hóa. Bạn, sẽ trở thành chúng tôi; còn chúng tôi, lại không còn là bạn nữa. Nằm giữa đó là [shattered_frontier_planet.GetName], dù đó không phải là [shattered_frontier_planet.GetName] của bạn. Tuy nhiên nhiệm vụ của chúng tôi vẫn không đổi: gieo rắc khát vọng và ý chí ra toàn cõi thiên hà. Chỉ là bây giờ, chúng tôi đã có khát vọng và ý chí của riêng mình: tham vọng và ý thức về sứ mệnh, những thứ mà một người bên ngoài đã ban tặng cho chúng tôi...”"
 enclave.5550.a:0 "Cút ngay khỏi đây cho ta!"
 enclave.5550.b:0 "Thật kinh tởm, chúng ta phải tiêu diệt các ngươi."
 enclave.5551.desc:1 "“... Thật đáng tiếc. Nhưng tất cả những chuyện này vẫn còn cơ hội. Chúng tôi có thể nhận ra rằng, giờ đây chúng tôi đã được giải phóng khỏi vùng đất ảo ảnh. Những người thực dân, những người không giống như các bạn, không còn bị trói buộc bởi ảo ảnh của [shattered_frontier_planet.GetName] nữa...\n\nChúng tôi rất hoang mang, bị đè nặng bởi vô vàn câu hỏi, nhưng chúng tôi biết phải đi đâu để tìm kiếm câu trả lời. Tạm biệt, hỡi những kẻ gieo rắc ý chí yếu ớt.”"

 enclave.5557.name:0 "Chướng ngại trùng trùng"
 enclave.5557.desc:0 "Dòng chảy thời gian đặc quánh như bùn lầy, không thể xuyên thấu. Thật không may, nghi thức tiên tri đã không thể xuyên qua bức màn của Tấm Màn Tâm Linh. Theo thỏa thuận, sau khi trừ đi một khoản nhỏ phí công sức, chúng tôi sẽ hoàn trả lại một phần chi phí."
 enclave.5557.a:0 "Rất tốt."

 enclave.5566.name:0 "Những người hành hương ngang ngạnh"
 enclave.5566.desc:0 "Cảm biến đã phát hiện sự tiếp cận của một số tàu vận tải. Những con tàu này bị hao mòn nghiêm trọng, rách nát tả tơi, trông cứ như được chắp vá lại từ những linh kiện phế thải. Chỉ huy soái hạm của hạm đội đã gửi lời chào đến chúng ta, nhưng với tình trạng công nghệ hiện tại của họ, e rằng chỉ có thể tiến hành liên lạc bằng giọng nói."
 enclave.5565.desc:0 "Cầu thần linh ban phước lành cho các vị. Tôi là nhà lãnh đạo được ủy nhiệm của hạm đội này. Chúng tôi xin phép được an toàn đi qua vùng không gian của các vị, và hy vọng có thể nhận được một số thực phẩm quyên góp. Chúng tôi đang trên đường hành hương, và sau nhiều năm sống trong không gian, người dân của tôi đã trở nên vô cùng ốm yếu."
 enclave.5565.a:0 "Chúng ta phải cung cấp sự giúp đỡ cho họ nhiều nhất có thể."
 enclave.5565.b:0 "Các người có thể đi qua, nhưng chúng tôi không thể san sẻ thực phẩm."
 enclave.5565.c:0 "Ngươi không được hoan nghênh ở đây."
 enclave.5570.name:0 "Vùng đất của Thần linh"
 enclave.5570.desc:0 "Người dân của tôi đã được no bụng, xin chân thành cảm ơn. Thực ra, việc chúng tôi đến đây tuyệt đối không phải là sự tình cờ. Từ nhiều thế hệ trước, một vị tiên tri quyền năng đã chỉ định một ngôi sao của thiên quốc, nói rằng chúng tôi có thể chạm tay đến thần linh tại đó. Ngôi sao này thuộc về các vị.\n\nChính là nơi này, chúng tôi chỉ còn cách một bước chân để bước từ thế giới trần tục sang quốc độ thiêng liêng, nhưng tàu của chúng tôi rất cũ kỹ, công nghệ của chúng tôi còn rất lạc hậu. Để có thể tiếp xúc với quốc độ thiêng liêng, chúng tôi cần sự giúp đỡ của các vị. Các vị không cần phải tin vào thần linh của chúng tôi, nhưng lẽ nào các vị lại từ chối cơ hội để chúng tôi tiếp xúc với thần linh sao? Xin các vị, hãy cho chúng tôi những tài nguyên cần thiết, và chúng tôi sẽ hoàn thành cuộc hành hương này."
 enclave.5570.a:0 "Rất tốt."
 enclave.5570.b:0 "Các người được đằng chân lân đằng đầu rồi đấy."
 enclave.5571.name:0 "Tiếp xúc"
 enclave.5571.desc:0 "Thật... đẹp đẽ tuyệt trần.\n\nThay mặt cho tất cả những người hành hương, tôi chân thành cảm ơn các vị. Tôi không phải là một nhà thơ. Tôi không thể đúc kết trải nghiệm này thành ngôn từ. Nhưng nhờ có sự hảo tâm của các vị, chúng tôi đã chạm tới thần linh. Hy vọng vinh quang vĩnh hằng của quốc độ thiêng liêng sẽ chiếu rọi lên các vị."
 enclave.5575.name:0 "Kết cục bất kính"
 enclave.5575.desc:0 "Hạm đội hành hương từng cầu xin chúng ta viện trợ đã nhận lấy một kết cục vô cùng bi thảm. Tín hiệu viễn trắc được tái cấu trúc cho thấy, họ đã tiến hành một dạng thử nghiệm nào đó, rất có thể liên quan đến năng lực ngoại cảm. Do một đợt tăng vọt năng lượng, trường ngăn chặn ở lõi động cơ soái hạm của họ đã bị phá vỡ. Vụ nổ sau đó đã tiêu diệt toàn bộ hạm đội, và giải phóng một cơn bão ngoại cảm mạnh mẽ trong hệ sao [wayward_pilgrims_system.GetName]. Mọi ước tính đều chỉ ra rằng, một cơn bão quy mô như thế này cần nhiều năm mới có thể tan đi.\n\nBất kể lũ cuồng tín này định làm gì ở đây, rõ ràng là chúng đã thất bại, và chúng ta lại phải là người đi dọn dẹp mớ hỗn độn này cho chúng."
 enclave.5575.a:0 "Thật không thể chịu đựng nổi."

 wayward_pilgrim_00:0 "Người hành hương hạnh phúc"
 wayward_pilgrim_01:0 "Người hành hương bất hạnh"
 wayward_pilgrim_02:0 "Người hành hương thỏa mãn"
