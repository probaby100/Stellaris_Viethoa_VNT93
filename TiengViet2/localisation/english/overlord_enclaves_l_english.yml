 enclave_mercenary_starbase_ruined_desc:0 "Pháo đài thương mại đánh thuê từng vinh quang một thời này nay đã trở thành đống tàn tích; phòng triển lãm của nó bị cướp phá, toàn bộ của cải giá trị đều bị cuỗm sạch."
