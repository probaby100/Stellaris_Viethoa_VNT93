 finish_shroud_forged_liberation: "- Mở khóa lắp ráp Dân Số §YĐúc Từ Màn Che§!\n- Khóa §YĐặc Quyền Thăng Hoa§!: §H$ap_become_the_crisis$§!\n- Mở khóa §YSắc Lệnh§!: ['edict:shroud_bonded', $edict_shroud_bonded$]\n- Mở khóa §YDự Án Đặc Biệt§!: §HNgười Dẫn Đường§!\n$t$- £crime£ $MOD_PLANET_CRIME_NO_HAPPINESS_MULT$: §G-15%§!\n$t$- $mod_planet_observators_produces_mult$: §G+10%§!\n- Mở khóa §YCây Truyền Thống§!: §H$tradition_psionics_shroud$§!\n- Nhận lựa chọn nghiên cứu: ['technology:tech_psionic_theory']\n- Nhận tiến độ công nghệ: ['technology:tech_psionic_theory'] §G+50%§!\n- Dân Số §YĐúc Từ Màn Che§! nhận đặc tính §Y$trait_psionic$§!\n- Lãnh Tụ §YĐúc Từ Màn Che§! trở thành ['concept_leader_trait_psionic', Lãnh Tụ Tâm Linh]\n- Chủng tộc §YĐúc Từ Màn Che§! trở thành chủng tộc thống trị của Đế Chế."
