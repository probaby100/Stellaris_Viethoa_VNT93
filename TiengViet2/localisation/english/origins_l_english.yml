 # Armies
 shroud_monstrosities: "Thực Thể Dị Giới"
 shroud_monstrosities_desc: "Chiêm ngưỡng những thực thể này trên chiến trường chẳng khác nào rước lấy sự điên loạn; hình dạng của chúng quằn quại và lấp lánh, không ngừng biến dịch, không bao giờ cố định."
