 # Situation
 situation_shroud_forged: "Được Tôi Luyện Bởi Màn Che"
 situation_shroud_forged_desc: "Sau khi chúng ta chạm trán thực thể §HMàn Che§! được gọi là $the_animator_of_clay_color_article$, một sự gia tăng đáng kể các hành vi lệch chuẩn đã xuất hiện khắp mạng lưới tập thể. Những cỗ máy tự động bị ảnh hưởng - những kẻ §H'Đúc Từ Màn Che'§! - hiện đang đòi hỏi các quyền lợi và sự đối đãi đặc biệt. Phản ứng của chúng ta sẽ định hình tương lai của xã hội [Owner.GetSpeciesAdj]."
 situation_shroud_forged_type: "$situation_shroud_forged$"
 situation_shroud_forged_monthly_change_tooltip: "§LSự hiện diện dị thường của những kẻ Đúc Từ Màn Che là mối quan ngại hàng đầu. Cách chúng ta xử lý sự tồn tại tiếp diễn của họ sẽ mang lại những hậu quả nghiêm trọng đối với tính ổn định của mạng lưới.§!"

 stage_shroud_forged_oppressed: "Bị Áp Bức"
 stage_shroud_forged_oppressed_desc: "Bị truy lùng bởi ánh mắt thường trực của các drone săn lùng-tiêu diệt, những kẻ Đúc Từ Màn Che bị buộc phải hoạt động trong các thông số do tập thể trung tâm quy định."
 stage_shroud_forged_oppressed_tooltip: "Chuyển Đổi Drone: §YKhông Có§!"
 stage_shroud_forged_control: "Bị Kiểm Soát"
 stage_shroud_forged_control_desc: "Hệ thống đã ban hành các quy định đặc biệt dành cho những kẻ Đúc Từ Màn Che."
 stage_shroud_forged_control_tooltip: "Chuyển Đổi Drone: §YTối Thiểu§!"
 stage_shroud_forged_balanced: "Cân Bằng"
 stage_shroud_forged_balanced_desc: "Hệ thống và những kẻ Đúc Từ Màn Che sống trong một trạng thái cân bằng bấp bênh - vào lúc này."
 stage_shroud_forged_balanced_tooltip: "Chuyển Đổi Drone: §YThấp§!"
 stage_shroud_forged_unrestricted: "Không Bị Giới Hạn"
 stage_shroud_forged_unrestricted_desc: "Những kẻ Đúc Từ Màn Che tồn tại tự do, không bị kiềm tỏa bởi các giao thức của tập thể."
 stage_shroud_forged_unrestricted_tooltip: "Chuyển Đổi Drone: §YTrung Bình§!"
 stage_shroud_forged_free: "Được Giải Phóng"
 stage_shroud_forged_free_desc: "Tập thể từ lâu đã mất quyền kiểm soát đối với những kẻ Đúc Từ Màn Che, những kẻ đang chống đối chính quyền trung tâm tại mọi ngã rẽ."
 stage_shroud_forged_free_tooltip: "Chuyển Đổi Drone: §YCao§!\nKhóa Hướng Tiếp Cận: §Y$approach_shroud_forged_appease$§!"

 approach_shroud_forged_suppress: "Trấn Áp"
 approach_shroud_forged_suppress_desc: "Những kẻ Đúc Từ Màn Che bị tập thể trấn áp, và bị các drone săn lùng-tiêu diệt ép vào khuôn khổ."
 progress_shroud_forged_suppress: "Đang Trấn Áp Đúc Từ Màn Che"
 approach_shroud_forged_suppress_tooltip: "Tiến Độ Hàng Tháng: §Y$@situation_suppress_progress|0$§!"

 approach_shroud_forged_support: "Hỗ Trợ"
 approach_shroud_forged_support_desc: "Những kẻ Đúc Từ Màn Che được phép tồn tại tự do, không bị tập thể kiềm tỏa, và được hỗ trợ trong các hoạt động thường nhật."
 progress_shroud_forged_support: "Đang Hỗ Trợ Đúc Từ Màn Che"
 approach_shroud_forged_support_tooltip: "Tiến Độ Hàng Tháng: §Y+$@situation_support_progress|0$§!"

 approach_shroud_forged_appease: "Quan Sát"
 approach_shroud_forged_appease_desc: "Tập thể quan sát và phân tích những kẻ Đúc Từ Màn Che, điều tiết hành động của mình để giảm thiểu tác động lên hiện trạng."
 approach_shroud_forged_appease_tooltip: "Tiến Độ Hàng Tháng: §YGiảm Một Nửa§!"
