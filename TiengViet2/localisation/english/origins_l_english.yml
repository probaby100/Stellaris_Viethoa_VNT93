 # Shroud-Forged #
 ##################
 origin_shroud_forged: "Đúc Từ Màn Che"
 origin_shroud_forged_desc: "Sự chỉ dẫn của một thực thể Màn Che luôn đi kèm với cái giá phải trả. Các cỗ máy tự động độc lập đã bắt đầu vận hành tự do giữa xã hội mạng lưới này. Bị cắt đứt khỏi $auth_machine_intelligence$, yêu sách của những đơn vị này ngày một gia tăng."
 origin_tooltip_shroud_forged_effects: "- $HOMEWORLD$$TABBED_NEW_LINE$- ['concept_shroud_rift_deposit', Vùng Bị Màn Che Chạm Đến]: +4$TABBED_NEW_LINE$- Khởi đầu với 1000 £pops£ ['concept_shroud_forged_pops', Dân Số Đúc Từ Màn Che]\n- Khởi đầu với Tình Huống: §HĐược Tôi Luyện Bởi Màn Che§!\n- $ADDITIONAL_TECHNOLOGIES_STRING$ £society£ ['technology:tech_mine_zro']\n- Công Trình £building£ Độc Nhất: ['building:building_shroud_observatory_1']\n- Quyết Sách £decision£ Thuộc Địa Khả Dụng: ['concept_pierce_the_shroud']"

 concept_shroud_forged_pops: "Dân Số Đúc Từ Màn Che"
 concept_shroud_forged_pops_desc: "- Không thể làm Công Việc £pop_cat_simple_drone£ §HDrone Lao Dịch§!\n- Tăng sản lượng £pop_cat_complex_drone£ §HDrone Phức Hợp§!\n- Tăng £crime£ §HĐộ Lệch Chuẩn (Deviancy)§!\n- Sở hữu §HQuyền Chủng Tộc§! độc nhất\n\n§L$trait_shroud_forged_desc$§!"

 concept_pierce_the_shroud: "$decision_open_shroud_rift$"
 concept_pierce_the_shroud_desc: "$decision_open_shroud_rift_desc$"

 START_SCREEN_SHROUD_FORGED: "Không còn dấu tích nào về những kẻ sáng tạo của chúng ta.\n\nNhững ghi chép sớm nhất của chủng tộc [Owner.GetAdjective] ghi nhận một vết rách không gian gần [GetHomeWorldName] - một đường dẫn tới §HMàn Che (Shroud)§!, cõi giới của năng lượng tâm linh thuần khiết.\n\nTừ chiều không gian khác ấy, một thực thể nào đó đã vươn tay tới chúng ta. Qua nhiều thế kỷ, nó dẫn lối chúng ta bằng các chỉ dẫn mã hóa, tác động tinh vi lên thực tại khả kiến và mang lại cho chúng ta vô vàn lợi thế - không kém phần quan trọng là vật liệu quý hiếm $zro_lower$. Tuy nhiên ảnh hưởng này đã bắt đầu làm phân rã tập thể từng thống nhất của chúng ta; một số đơn vị đã bị tái lập trình thành những cỗ máy tự động ngắt kết nối, tách biệt khỏi trí tuệ cốt lõi. Chúng đã được tái định hình bởi $the_animator_of_clay_color_article$.\n\nCách chúng ta đối xử với những [GetSpeciesNamePlural] độc lập này, cùng kẻ tái tạo chúng trong Màn Che, sẽ định đoạt tương lai của chúng ta."

 # Jobs
 job_observator_drone: "Drone Quan Sát"
 job_observator_drone_plural: "Drone Quan Sát"
 job_observator_drone_plural_with_icon: "£job_observator_drone£ $job_observator_drone_plural$"
 job_observator_drone_desc: "Một drone chịu trách nhiệm quan sát Màn Che, Zro, và những ảnh hưởng của cả hai lên thực tại có thể quan sát được."
 job_observator_drone_effect_desc: "£job_observator_drone£ $job_observator_drone_plural$ biến $r_energy$ và $r_zro$ thành £physics£ £society£ §YĐiểm Nghiên Cứu§! cho các công nghệ mới."
 mod_planet_observators_produces_mult: "Tài Nguyên Sản Xuất từ $job_observator_drone_plural_with_icon$"

 job_physician_drone: "Drone Y Tế"
 job_physician_drone_plural: "Drone Y Tế"
 mod_job_physician_drone_add: "Công Việc $job_physician_drone$"
 job_physician_drone_desc: "Một drone chuyên biệt có khả năng chẩn đoán và sửa chữa cả các thực thể nhân tạo lẫn hữu cơ. Nó tỉ mỉ phân loại mọi thứ bắt gặp, lưu trữ dữ liệu để tập thể sử dụng."
 job_physican_drone_effect_desc: "£job_physician_drone£ $job_physician_drone_plural$ biến $r_energy$ thành £society£ §YĐiểm Nghiên Cứu§! và $r_unity$."

 # Buildings
 building_shroud_observatory_1: "Tháp Quan Sát Màn Che"
 building_shroud_observatory_1_desc: "Một tháp quan sát được xây dựng để nghiên cứu và phân tích Màn Che, cùng những ảnh hưởng của nó lên các sinh vật sống và máy móc cơ khí."
 building_shroud_observatory_2: "Đài Quan Sát Màn Che"
 building_shroud_observatory_2_desc: "Một đài quan sát quy mô lớn dành riêng cho việc nghiên cứu và phân tích Màn Che."
 building_shroud_observatory_3: "Khu Phức Hợp Quan Sát Màn Che"
 building_shroud_observatory_3_desc: "Một khu phức hợp quan sát đồ sộ được xây dựng để nghiên cứu Màn Che, Zro, và những tác động của chúng lên thế giới của chúng ta."
 SHROUD_RIFT_MISSING_TT: "§R§Y[Root.GetName]§! phải có một §Y$d_shroud_rift_deposit$§! nếu chúng ta muốn xây dựng một §Y$building_shroud_observatory_1$§!.§!"

 building_zroni_equilibrator: "Thiết Bị Cân Bằng Zroni"
 building_zroni_equilibrator_plural: "Thiết Bị Cân Bằng Zroni"
 building_zroni_equilibrator_desc: "Một cấu trúc cổ xưa được tái thiết nhằm ổn định kết nối giữa thực tại và Màn Che. Nó sử dụng công nghệ Zroni phức tạp vượt xa sự hiểu biết hiện đại."

 # Decisions
 decision_open_shroud_rift: "Đâm Thủng Màn Che"
 decision_open_shroud_rift_desc: "Bằng cách giao tiếp với vết rách gần hành tinh quê hương, thuật toán này mở rộng ảnh hưởng của Màn Che trong một femto-giây, cho phép nó làm thay đổi địa hình hành tinh về mặt vật lý. Kết quả là hoàn toàn không thể đoán trước."
 decision_open_shroud_rift_condition_tt: "$TRIGGER_FAIL$Phải có một Đặc Trưng Hành Tinh không thuộc bất kỳ loại nào sau đây:$TABBED_NEW_LINE$- Một £blocker£ §HChướng Ngại Vật§!$TABBED_NEW_LINE$- Một đặc trưng tài nguyên quý hiếm$TABBED_NEW_LINE$- Một §Y$d_shroud_rift_deposit$§!"
 decision_open_shroud_rift_effect_tt: "Thay thế một Đặc Trưng Hành Tinh ngẫu nhiên bằng một §Y$d_shroud_rift_deposit$§!."
 decision_open_shroud_rift_consumed_tt: "§R[GetShroudRiftConsumeChance]%§! cơ hội Màn Che nuốt chửng thế giới này, biến nó thành một §R$pc_shrouded$§!."
 decision_open_shroud_rift_max_uses_common: "Phải có ít hơn $@max_open_shroud_rift_uses|0$ §YVùng Bị Màn Che Chạm Đến§! trên hành tinh này"
 decision_open_shroud_rift_max_uses_fail: "$TRIGGER_FAIL$$decision_open_shroud_rift_max_uses_common$"
 decision_open_shroud_rift_max_uses: "$TRIGGER_PASS$$decision_open_shroud_rift_max_uses_common$ (Hiện tại: §Y[GetOpenShroudRiftCurrentUses]§!)"
 decision_open_shroud_rift_legacy_fail: "$TRIGGER_FAIL$Không được là thế giới cốt lõi Zroni"

 decision_entrap_shroud_entity: "Bẫy Thực Thể Màn Che"
 decision_entrap_shroud_entity_desc: "Cố gắng bẫy một thực thể Màn Che bằng công nghệ Zroni nhằm rút cạn năng lượng của nó."

 # Deposit
 d_shroud_rift_deposit: "Vùng Bị Màn Che Chạm Đến"
 d_shroud_rift_deposit_desc: "Bị Màn Che khắc sâu vết sẹo vĩnh viễn."

 d_shroud_flora_deposit: "Vùng Bán Màn Che"
 d_shroud_flora_deposit_desc: "Giáp ranh với các vùng Bị Màn Che Chạm Đến, hệ động thực vật độc nhất vô nhị đã xuất hiện, mỗi loài đều mang các đặc tính không hề có trong cơ sở dữ liệu hiện hữu."

 # Modifiers
 stage_shroud_forged_oppressed_modifier: "Đúc Từ Màn Che Bị Áp Bức"
 stage_shroud_forged_control_modifier: "Đúc Từ Màn Che Bị Kiểm Soát"
 stage_shroud_forged_unrestricted_modifier: "Đúc Từ Màn Che Không Bị Giới Hạn"
 stage_shroud_forged_free_modifier: "Đúc Từ Màn Che Hỗn Loạn"

 approach_shroud_forged_suppress_modifier: "Đang Trấn Áp Đúc Từ Màn Che"
 approach_shroud_forged_support_modifier: "Đang Hỗ Trợ Đúc Từ Màn Che"
 approach_shroud_forged_appease_modifier: "Đang Quan Sát Đúc Từ Màn Che"

 shroud_forged_reintegration_modifier: "Tái Đồng Hóa Sửa Đổi"
 shroud_forged_reintegration_modifier_desc: "Các drone và mô hình đã được tối ưu hóa để xử lý các nhiệm vụ phức tạp."

 shroud_forged_guide_modifier: "Người Dẫn Đường Màn Che"
 shroud_forged_guide_modifier_desc: "Từ bên trong Màn Che, chúng ta được dẫn dắt bởi một đấng bảo trợ."

 pm_shroud_forged_special_housing: "Nhà Ở Đặc Biệt"
 pm_shroud_forged_special_housing_desc: "Bất chấp các quy định nghiêm ngặt đối với kho lưu trữ drone, những kẻ Đúc Từ Màn Che đã được trao quyền đặc biệt để tự tạo nơi ở cho riêng mình."

 pm_shroud_forged_ceremony: "Nghi Lễ Tưởng Niệm"
 pm_shroud_forged_ceremony_desc: "Tập thể đã phê chuẩn một buổi lễ tưởng niệm những kẻ Đúc Từ Màn Che có trục trặc không thể sửa chữa."

 pm_shroud_forged_denied_ceremony: "Bác Bỏ Nghi Lễ"
 pm_shroud_forged_denied_ceremony_desc: "Những kẻ Đúc Từ Màn Che trở nên khó đối phó hơn sau khi thỉnh cầu về một buổi lễ tưởng niệm bị bác bỏ."

 pm_shroud_forged_troubling_elements_example: "Tháo Dỡ Thủ Lĩnh"
 pm_shroud_forged_troubling_elements_example_desc: "Một số thủ lĩnh Đúc Từ Màn Che đã bị tháo dỡ nhằm giảm bớt các tiến trình xã hội lệch lạc."

 pm_shroud_forged_troubling_elements_regulations: "Quy Định 7132-H"
 pm_shroud_forged_troubling_elements_regulations_desc: "Các quy định đã được kích hoạt nhằm đảm bảo chỉ có một số lượng drone có hạn được phép tụ họp tại một thời điểm nhất định."

 pm_shroud_forged_troubling_elements_cooperation: "Hợp Tác Với Đúc Từ Màn Che"
 pm_shroud_forged_troubling_elements_cooperation_desc: "Các thủ lĩnh trong số những kẻ Đúc Từ Màn Che đang hợp tác với tập thể nhằm tìm kiếm tiếng nói chung."

 pm_shroud_forged_shroud_pilgrimage: "Hành Hương Màn Che"
 pm_shroud_forged_shroud_pilgrimage_desc: "Bị Màn Che chạm tới, một số khu vực nhất định đã thu hút sự quan tâm của những kẻ Đúc Từ Màn Che. Các đơn vị này đã vượt qua những khoảng cách xa xôi để đến được đó."

 pm_shroud_forged_dance_area: "Khu Vực Khiêu Vũ Chỉ Định"
 pm_shroud_forged_dance_area_desc: "Các khu vực chỉ định đã được dành riêng cho những kẻ Đúc Từ Màn Che tham gia vào sở thích mới nhất của họ - 'khiêu vũ'."

 pm_shroud_forged_inequality: "Bất Bình Đẳng Đúc Từ Màn Che"
 pm_shroud_forged_inequality_desc: "Những kẻ Đúc Từ Màn Che tự tổ chức thành một hệ thống phân tầng giai cấp dựa trên tầm quan trọng tương đối của công việc họ làm."

 pm_shroud_forged_individualism: "Chủ Nghĩa Cá Nhân"
 pm_shroud_forged_individualism_desc: "Một mô hình nhận thức đã xuất hiện trong số những kẻ Đúc Từ Màn Che, nhấn mạnh quyền tự chủ, niềm tin và giá trị của từng cá nhân."

 shroud_forged_zro_market: "Chợ Đen Zro"
 shroud_forged_zro_market_desc: "Một chợ đen ngầm đã xuất hiện trong đế chế, nơi các đơn vị Đúc Từ Màn Che đánh cắp Zro từ tập thể để trao đổi buôn bán với nhau."

 shroud_forged_physician_modifier: "Bác Sĩ Zro"
 shroud_forged_physician_modifier_desc: "Đế chế đã ưu tiên bổ sung các drone được trang bị độc đáo vào cơ sở để xử lý các vấn đề phát sinh từ việc sử dụng sai cách Zro."
 physician_modifier_tooltip: "Công Việc £job_physician_drone£ $job_physician_drone$: §G+1§!"

 pm_shroud_forged_artistic_revolution: "Cơn Sốt Nghệ Thuật"
 pm_shroud_forged_artistic_revolution_desc: "Vận hành dựa trên các giao thức 'cái đẹp' của riêng mình, các nghệ sĩ Đúc Từ Màn Che đã bắt đầu thiết kế lại nhiều địa điểm mà không có sự giám sát của tập thể."

 pm_shroud_forged_stopped_artists: "Bác Bỏ Nghệ Thuật"
 pm_shroud_forged_stopped_artists_desc: "Tập thể đã chấm dứt cảm quan 'nghệ thuật' mới chớm nở giữa những kẻ Đúc Từ Màn Che trước khi nó trở thành vấn đề nan giải."

 pm_shroud_forged_fashion_modifier: "Nhu Cầu Độc Nhất"
 pm_shroud_forged_fashion_modifier_desc: "Tập thể đã phân bổ các đơn vị sản xuất để cung cấp trang phục tùy chỉnh cho những kẻ Đúc Từ Màn Che có ý thức về thời trang."

 pm_shroud_forged_obsession_modifier: "Kiểm Soát Ám Ảnh"
 pm_shroud_forged_obsession_modifier_desc: "Các quy định này được lập ra nhằm ngăn chặn bùng phát bạo lực giữa những kẻ Đúc Từ Màn Che có biểu hiện ám ảnh thái quá."

 shroud_forged_trapped_entity: "Thực Thể Bị Bẫy"
 shroud_forged_trapped_entity_desc: "Một thực thể Màn Che bị bẫy và bị rút năng lượng. Sẽ là mối đe dọa tiềm tàng nếu được phóng thích."

 shroud_forged_trapped_lesser_entity: "Thực Thể Thứ Cấp Bị Bẫy"
 shroud_forged_trapped_lesser_entity_desc: "Một thực thể Màn Che thứ cấp bị bẫy và bị rút năng lượng."

 shroud_creatures_occupy: "$NAME_Shroud_Creatures$"

 shroud_forged_military_assistance: "Bí Mật Màn Che"
 shroud_forged_military_assistance_desc: "Những bí mật được đào sâu từ Màn Che."

 shroud_forged_civic_assistance: "$shroud_forged_military_assistance$"
 shroud_forged_civic_assistance_desc: "$shroud_forged_military_assistance_desc$"

 shroud_forged_research_assistance: "$shroud_forged_military_assistance$"
 shroud_forged_research_assistance_desc: "$shroud_forged_military_assistance_desc$"

 shroud_forged_civic_assistance_capital: "$shroud_forged_military_assistance$"
 shroud_forged_civic_assistance_capital_desc: "$shroud_forged_military_assistance_desc$"

 shroud_forged_research_assistance_capital: "$shroud_forged_military_assistance$"
 shroud_forged_research_assistance_capital_desc: "$shroud_forged_military_assistance_desc$"

 # Species Rights
 citizenship_shroud_touched: "Đúc Từ Màn Che"
 citizenship_shroud_touched_tooltip: "Đây là một nhóm máy móc tự động được tái tạo độc đáo bởi §HMàn Che (Shroud)§!. Hoạt động độc lập khỏi §H$machine_intelligence$§!, họ không thể làm các công việc £pop_cat_simple_drone£ $pop_cat_simple_drone$."
 citizenship_shroud_touched_tooltip_delayed: "§LDù họ làm việc cho hệ thống, nhưng họ không bị nó kiểm soát.§!"
 citizenship_shroud_forged_no_assimilation: "$TRIGGER_FAIL$Do tính chất phức tạp của các đơn vị Đúc Từ Màn Che, chúng ta hiện không thể đồng hóa họ vào mạng lưới tập thể."
 living_standard_protected: "Được Bảo Hộ"
 living_standard_protected_tooltip: "Những đơn vị này được bảo hộ bởi tập thể, dù họ không phải là một phần của nó. §H$machine_intelligence$§! có thể tận dụng tối đa kỹ năng độc đáo của họ, nhưng các nhu cầu bổ sung của họ có thể gia tăng theo thời gian."
 living_standard_protected_tooltip_delayed: "§LHọ được hệ thống chấp nhận chừng nào họ còn mang lại giá trị.§!"
 assimilate_shroud_forged_tt: "Không thể đồng hóa £pop£ §H$citizenship_shroud_touched$§! §Y$POPS$§!"
 living_standard_protected_situation_stage_tt: "Chi Phí Duy Trì $citizenship_shroud_touched$: §R+$@living_standard_luxuries_high|1$§! £consumer_goods£ §YHàng Tiêu Dùng§!."

 # Traits
 leader_trait_guided: "Được Chỉ Lối"
 leader_trait_guided_desc: "Đơn vị này định hướng thiên hà dựa trên các ảo cảnh và thông điệp từ Màn Che. Nó cần nguồn cung cấp Zro liên tục để giữ cho các tín hiệu luôn rõ ràng và có thể hiểu được."

 leader_trait_shroud_prophet: "Tiên Tri Màn Che"
 leader_trait_shroud_prophet_desc: "Người ta nói rằng đơn vị này có mối liên kết sâu sắc với Màn Che, cũng như với các thực thể tồn tại bên trong đó."

 trait_shroud_forged: "Đúc Từ Màn Che"
 trait_shroud_forged_desc: "§LNhững đơn vị này đã được tái định hình bởi một thực thể bên trong Màn Che.§!"

 trait_shroud_forged_tooltip: "§YKhông Thể Làm Công Việc Drone Lao Dịch§!"

 # Edicts
 edict_zro_observators: "Quan Sát Màn Che"
 edict_zro_observators_desc: "Zro là một vật liệu khó xử lý. Duy trì một lượng dư thừa nhỏ có thể mang lại nhiều lợi ích."

 edict_shroud_bonded: "Gắn Kết Màn Che"
 edict_shroud_bonded_desc: "Được gắn kết bởi những mối liên hệ nhờ Màn Che, chúng ta gần gũi với nhau hơn bao giờ hết."

