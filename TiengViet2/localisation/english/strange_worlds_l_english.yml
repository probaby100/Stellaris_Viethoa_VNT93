 pm_bd_strength_desc: "$bacterial_drive_modifier_desc$"

 pm_bd_creativity: "Động Lực Vi Khuẩn: Sáng Tạo"
 pm_bd_creativity_desc: "$bacterial_drive_modifier_desc$"

 ladder_wars_pre_ftl: "Tàn Dư Của Đại Chiến Thang Trời"
 ladder_wars_pre_ftl_desc: "Khi thế giới bị chiến tranh tàn phá này tái thiết, sự hoang tưởng ngày càng tăng của họ khiến cho các tương tác với những người khác trở thành một thách thức cho tất cả các bên liên quan."

 living_metal_mega_construction_insight: "Hiểu Biết Sâu Sắc Về Đại Công Trình Kim Loại Sống"
 living_metal_mega_construction_insight_desc: "Cổ vật Kim Loại Sống mà chúng ta thu hồi được đã mang lại cho chúng ta hiểu biết sâu sắc đáng kinh ngạc về việc phát triển các siêu công trình."
 living_metal_mega_construction_insight_ct: "Chi phí cơ bản Sắc lệnh Đại Công Trình Kim Loại Sống: §G-50%§!"

 d_coagulated_landscape: "Cảnh Quan Đông Kết"
 d_coagulated_landscape_desc: "Một chất nhờn nhớt quánh trào ra từ bề mặt hành tinh, đông kết tạo thành một vật liệu nguy hiểm gần như không thể xuyên thủng. Điều này để lại rất ít không gian để xây dựng an toàn."

 d_shimmering_structure: "Công Trình Lung Linh Mờ Ảo"
 d_shimmering_structure_desc: "Một công trình lớn lung linh mờ ảo không rõ nguồn gốc."

 d_geothermal_hotspot: "Điểm Nóng Địa Nhiệt"
 d_geothermal_hotspot_desc: "Hành tinh này sở hữu một địa điểm địa nhiệt đặc biệt cung cấp cả năng lượng lẫn cơ hội nghiên cứu."

 d_ancient_cloaking_array: "Dàn Tàng Hình Cổ Đại"
 d_ancient_cloaking_array_desc: "Thuộc địa này được hưởng lợi từ sự hiện diện của một dàn tàng hình ngoài hành tinh cổ đại. Kẻ thù sẽ không dễ dàng tấn công. Cư dân thuộc địa có thể cảm thấy an toàn tại đây."

 d_psionic_sands: "Cát Tâm Linh"
 d_psionic_sands_desc: "Cát trên hành tinh này có nồng độ Zro cao hiện diện khắp nơi. Có thể giao tiếp với chúng."

 d_mountains_of_steel: "Những Rặng Núi Thép"
 d_mountains_of_steel_desc: "Được rèn đúc trong nhiệt độ khắc nghiệt của quá trình địa cầu hóa, những dãy núi kiên cố rộng lớn này đóng vai trò như những mỏ tài nguyên phong phú."

 d_lava_tubes: "Ống Nham Thạch"
 d_lava_tubes_desc: "Các dòng magma đã rèn đúc nên những đường hầm sâu thẳm, giàu khoáng sản tại đây. Các ống dẫn nhiệt nham này mang lại cơ hội khai thác mỏ béo bở."
 d_lava_tubes_ct: "$t$Chi phí Duy trì £energy£ cho Nghề [miner.GetIcon] [miner.GetName]: §R+$@lava_tubes_mining_job_upkeep$§!"
 d_lava_tubes_ct_short: "§R+$@lava_tubes_mining_job_upkeep$§! Chi phí Duy trì £energy£ cho Nghề [miner.GetIcon] [miner.GetName]"

 d_hydroactive_eggs: "Trứng Hoạt Hóa Bởi Nước"
 d_hydroactive_eggs_desc: "Nước sẵn có dồi dào trong môi trường tự nhiên ở đây, tạo điều kiện cho tỷ lệ sinh sản cao vượt trội của các loài động vật bản địa."

 d_explosive_atmosphere: "Khí Quyển Dễ Cháy Nổ"
 d_explosive_atmosphere_desc: "Nồng độ phù hạt dễ bay hơi trong không khí làm cho bầu khí quyển của hành tinh này rất dễ bốc cháy."
 d_explosive_atmosphere_ct: "$t$£volatile_motes£ §Y$volatile_motes$§! từ Nghề [mote_harvester.GetIcon]$mote_harvester$: §G+50%§!"
 d_explosive_atmosphere_ct_short: "§G+50%§! £volatile_motes£ §Y$volatile_motes$§! từ Nghề [mote_harvester.GetIcon]$mote_harvester$"

 d_blue_lava: "Dung Nham Xanh Lam"
 d_blue_lava_desc: "Quá trình địa cầu hóa đã gây ra phản ứng giữa các mỏ khí phong phú và hợp kim sâu bên trong hành tinh, để lại trên bề mặt thế giới dòng dung nham xanh lam mê hoặc."

 d_crystaline_growths: "Tinh Thể Phát Triển"
 d_crystaline_growths_desc: "Có rất nhiều tinh thể phát triển phong phú trên hành tinh này có thể thu hoạch để sử dụng."

 d_bogplants: "Thực Vật Đầm Lầy"
 d_bogplants_desc: "Các đầm lầy siêu axit là nơi cư ngụ của một loài thực vật độc đáo tiết ra khí dị thường khi kiếm ăn."

 d_liquid_dark_matter: "Vật Chất Tối Dạng Lỏng"
 d_liquid_dark_matter_desc: "Một mạch nước ngầm kỳ lạ đã sụp đổ thành một hồ vật chất tối dạng lỏng."

 d_space_junk_hazards: "Hiểm Họa Rác Không Gian"
 d_space_junk_hazards_desc: "Các mảnh vụn không gian quay quanh quỹ đạo gây nguy hiểm cho việc tiếp cận của tàu con thoi và các công trình bề mặt khi rơi vào bầu khí quyển của hành tinh."

 trait_inner_darkness: "Bóng Tối Nội Tại"
 trait_inner_darkness_desc: "Cơ thể của họ được tăng cường sau khi bão hòa trong Vật Chất Tối, giờ đây họ thải ra một lượng nhỏ các hạt phi baryon theo định kỳ nhưng sẽ đốt cháy tuổi thọ kỳ vọng nhanh hơn."
 trait_inner_darkness_tt: "£sr_dark_matter£ $produced_per_pop_group_unit$ Pop £pop£: §G+$@inner_darkness_dark_matter_production$§!"

 trait_geleboric_mutations: "Đột Biến Geleboric"
 trait_geleboric_mutations_desc: "Những phản ứng không may đối với thử nghiệm đã làm thay đổi mạnh mẽ sinh lý học của loài này."

 trait_psionic_ephapse: "Khớp Nối Tâm Linh"
 trait_psionic_ephapse_desc: "Sau thời gian dài tiếp xúc với vi khuẩn thay đổi tâm trí, hệ thống tiêu hóa của loài này sản sinh ra các lợi khuẩn tâm linh thúc đẩy giao tiếp thần giao cách cảm giữa các cá thể bị ảnh hưởng."
 trait_psionic_ephapse_modifier_tooltip: "Nếu Loài có đặc điểm §Y$trait_psionic$§! hoặc §Y$trait_latent_psionic$§!:\n$bureaucrat_jobs_bonus_workforce_mult$: §G+5%§!\n$researcher_jobs_bonus_workforce_mult$: §G+5%§!"

