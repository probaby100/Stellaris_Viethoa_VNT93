 job_space_junk_collector_plural: "Các Công Nhân Thu Gom Rác Không Gian"
 job_space_junk_collector_desc: "Rác không gian trên quỹ đạo định kỳ đi vào bầu khí quyển của hành tinh này. Bất cứ thứ gì không bị bốc cháy khi tiến vào khí quyển đều có thể được thu gom và tái chế."

