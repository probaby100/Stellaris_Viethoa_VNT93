 tech_enhanced_cryosleep_sedatives: "Thuốc An Thần Ngủ Đông Tăng Cường"
 tech_enhanced_cryosleep_sedatives_desc: "Thuốc an thần dựa trên một loại enzyme hiếm cho phép tăng cường giấc ngủ đông, cải thiện đáng kể khả năng chịu đựng của các loài hữu cơ trong những chuyến du hành vũ trụ đường dài."

 tech_universal_marcophage: "Đại Thực Bào Vạn Năng"
 tech_universal_marcophage_desc: "Những chất tăng cường miễn dịch mạnh mẽ này biến bệnh tật thành dĩ vãng, cho phép các quần thể hữu cơ sống lâu hơn, khỏe mạnh hơn. Có thể gây ra tác dụng phụ nghiêm trọng."

