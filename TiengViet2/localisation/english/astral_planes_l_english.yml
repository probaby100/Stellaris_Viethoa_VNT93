# Relics #
##########

 r_infinity_root: "Cội Rễ Vô Cực"
 r_infinity_root_desc: "Một cụm vật chất hữu cơ phát triển và bành trướng mạnh mẽ bất kể được đặt ở nơi đâu."
 infinity_root_active_effect_tt: "Nuôi dưỡng một nhà lãnh đạo mới. Họ sẽ không tốn phí duy trì và không tính vào giới hạn số lượng lãnh đạo của bạn."

 r_time_crystal: "Pha Lê Thời Gian"
 r_time_crystal_desc: "Một buồng pha lê được niêm phong chứa một vòng lặp thời gian cô lập."

 r_daedalus_seal: "Phong Ấn Daedalus"
 r_daedalus_seal_desc: "Thiết bị tân tiến này có thể dao động ở tần số cộng hưởng với các nếp gấp không-thời gian lân cận, tạm thời phong tỏa chúng."
 daedalus_seal_active_effect_tt: "Đặt một Khóa lên tất cả các Lỗ Sâu và Cổng L-Gate bên trong biên giới của bạn trong §Y5§! năm."
 daedalus_seal_active_effect_nomads_tt: "Đặt một Khóa lên tất cả các Lỗ Sâu và Cổng L-Gate trong cùng hệ sao với Tàu Phương Chu của chúng ta trong §Y5§! năm."
 daedalus_seal_acquisition_tt: "Thời lượng Khóa Thứ Nguyên: §G+25%§!"
