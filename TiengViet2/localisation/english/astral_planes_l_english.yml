 situation_the_seal: "Phong Ấn"
 situation_the_seal_type: "Phong Ấn"
 situation_the_seal_desc: "Đang bị tấn công bởi một thế lực chưa rõ, các thực thể hiện đang cư ngụ tại trung tâm thiên hà đã yêu cầu chúng ta trợ giúp. Nếu họ sụp đổ, chúng ta khó lòng lường trước số phận của chính mình."
