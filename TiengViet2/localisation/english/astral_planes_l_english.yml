 civic_dark_consortium: "Tập Đoàn Vật Chất Tối"
 civic_dark_consortium_desc: "Sự thấu hiểu sâu sắc cấu trúc vũ trụ cho phép xã hội này khai thác các đặc tính bí ẩn của vật chất tối từ rất lâu trước khi khám phá ra động cơ siêu không gian."
