 quantum_catapult_insight_2_modifier_tt: "$quantic_ambush$ $MOD_SHIP_FIRE_RATE_MULT$: §G+[GetQuantumCatapulInsight2QuanticAmbush]%§!\nThời lượng hiệu ứng $quantic_ambush$: §G+100%§!"
 fold_hyperspace_modifier: "$artifact_fold_hyperspace$"

 action_remaining_astral_actions_locked: "$artifact_action_locked$"
 action_remaining_astral_actions_locked_desc: "Các nhà khoa học của chúng ta tin chắc rằng có thể mở khóa thêm nhiều hành động $ASTRAL_THREADS_ICON$ thông qua việc khám phá các công nghệ mới."
 action_astral_action_locked_failtext: "Mở khóa một hành động tinh giới mới."

 action_flash_forge_hyper_relay: "Rèn Tốc Hành Trạm Tiếp Sóng"
 action_flash_forge_hyper_relay_desc: "Đường siêu không gian vốn đã sở hữu các đặc tính lượng tử thú vị, nhưng bằng cách đan cài thêm một lượng sợi tinh giới nhất định, chúng ta đã đạt được những kết quả phi thường. Bằng cách đột phá sang các chiều không gian khác, giờ đây chúng ta có thể tiếp cận các Trạm Tiếp Sóng Siêu Không Gian đã tồn tại (hoặc sẽ tồn tại trong tương lai). Chúng ta gần như chắc chắn rằng mình là những kẻ duy nhất 'mượn' chúng theo cách này."
 action_flash_forge_hyper_relay_tooltip: "Cho phép tàu xây dựng của chúng ta tức tốc dựng nên một Trạm Tiếp Sóng Siêu Không Gian trong một hệ sao mà không tốn chi phí."
 action_flash_forge_hyper_relay_available_tooltip: "$TRIGGER_FAIL$§RChúng ta đã chuẩn bị sẵn địa điểm để tàu xây dựng thực hiện việc này.§!"
 action_flash_forge_hyper_relay_executing_tooltip: "$TRIGGER_FAIL$§RMột tàu xây dựng của chúng ta đang trên đường thực hiện điều này§!"
 FLASH_FORGE_MEGASTRUCTURE: "Rèn Tốc Hành $MEGASTRUCTURE|H$"

 action_dimensional_shifting: "Dịch Chuyển Thứ Nguyên"
 action_dimensional_shifting_desc: "Nhờ sự thao túng khéo léo kết cấu giữa chiều không gian này và chiều không gian khác, chúng ta có thể gấp nếp nó lại để đạt được những kết quả ấn tượng."
 action_dimensional_shifting_tooltip: "Mở khóa hành động hạm đội §YChuyển Pha Hạm Đội§!, cho phép các hạm đội của bạn tạm thời chuyển pha khỏi thực tại, trú ẩn an toàn ở một chiều không gian khác trong §Y180§! ngày.\n\nCác hạm đội khi quay trở lại sẽ được sửa chữa hoàn toàn."

 action_folding_hyperspace: "Gấp Nếp Siêu Không Gian"
 action_folding_hyperspace_desc: "Nhờ sự thao túng khéo léo mặt phẳng giữa các chiều không gian, chúng ta có thể gấp nếp không gian lại với nhau để đạt được những kết quả ấn tượng."
 action_folding_hyperspace_tooltip: "Mở khóa hành động hạm đội §YBước Nhảy Tinh Giới§!, cho phép tàu thuyền của bạn dịch chuyển tức thời đến một hệ sao nằm trong biên giới của bạn."
 action_folding_hyperspace_tooltip_nomad: "Mở khóa hành động hạm đội §YBước Nhảy Tinh Giới§!, cho phép tàu thuyền của bạn dịch chuyển tức thời đến một hệ sao mà bạn sở hữu Trạm Dừng Chân."

 action_astral_siphon: "Ống Hút Tinh Giới"
 action_astral_siphon_desc: "Có một cách để tháo dỡ kết cấu giữa không gian và thời gian. Bằng cách xây dựng các thiết bị trích xuất được hiệu chuẩn cẩn thận, chúng ta có thể sản xuất một lượng $astral_threads$ ổn định."
 action_astral_siphon_unlock_tooltip_common: "tăng sức chứa $ASTRAL_THREADS_ICON$ và mang lại các Công Việc §Y[GetAstralResearcherJobWithIcon]§!.\n[GetAstralResearcherEffect]"
 action_astral_siphon_unlock_tooltip_lvl1: "Mở khóa £building£ ['building:building_astral_siphon_1'].\n§Y$building_astral_siphon_1$§! $action_astral_siphon_unlock_tooltip_common$"
 action_astral_siphon_unlock_tooltip_lvl2: "Cho phép nâng cấp §Y$building_astral_siphon_1$§! thành §Y$building_astral_siphon_2$§!.\n§Y$building_astral_siphon_2$§! $action_astral_siphon_unlock_tooltip_common$"
 action_astral_siphon_unlock_tooltip_lvl3: "Cho phép nâng cấp §Y$building_astral_siphon_2$§! thành §Y$building_astral_siphon_3$§!.\n§Y$building_astral_siphon_3$§! $action_astral_siphon_unlock_tooltip_common$"
 building_astral_siphon_1: "Ống Hút Tinh Giới"
 building_astral_siphon_1_desc: "Bóc tách Sợi Tinh Giới ra khỏi kết cấu thực tại là một quy trình vô cùng tinh vi. Những cấu trúc này ngăn không cho ranh giới giữa các thực tại bị sụp đổ."
 building_astral_siphon_2: "Phễu Thu Tinh Giới"
 building_astral_siphon_2_desc: "$building_astral_siphon_1_desc$"
 building_astral_siphon_3: "Trung Tâm Tinh Giới"
 building_astral_siphon_3_desc: "$building_astral_siphon_1_desc$"

 astral_siphon_modifier_1: "$action_astral_siphon$"
 astral_siphon_modifier_2: "$action_astral_siphon$"
 astral_siphon_modifier_3: "$action_astral_siphon$"

 action_planar_mastery: "Làm Chủ Thứ Nguyên"
 action_planar_mastery_desc: "Những cuộc hành trình vào Mặt Phẳng Tinh Giới đã giúp chúng ta thấu hiểu rõ hơn kết cấu gắn kết các vũ trụ. Chúng ta có thể đan dệt những sợi không gian này theo những cách mà hiếm ai khác hiểu thấu."
 edict_astral_binding: "Trói Buộc Tinh Giới"
 edict_astral_binding_desc: "Chúng ta đã học được cách đan dệt Sợi Tinh Giới vào bất kỳ loại vật chất nào khác trong vũ trụ. Đó chính là kết cấu cốt lõi của không gian."
 edict_astral_binding_effects: "Tăng sản lượng thu nhận của tất cả các tài nguyên vật chất khác thêm §Y10%§!."
 edict_astral_shielding: "Lá Chắn Tinh Giới"
 edict_astral_shielding_desc: "Không có rào chắn nào vững chắc hơn một mạng lưới đan kết chặt chẽ của các Sợi Tinh Giới."
 edict_dimensional_artificing: "Chế Tác Xuyên Chiều"
 edict_dimensional_artificing_desc: "Biểu hiện các vật phẩm mang ý nghĩa văn hóa từ những chiều không gian khác có thể thực hiện được trong những điều kiện thích hợp. Liệu hành động của chúng ta có bị chú ý ở các mặt phẳng khác hay không, chúng ta không thể nói trước."
 edict_dimensional_artificing_tooltip: "§G+5§! £minor_artifacts£ $MINOR_ARTIFACTS$ mỗi tháng"
 action_planar_mastery_tooltip: "Mở khóa các $EDICTS$ mới: §Y$edict_astral_binding$§!, §Y$edict_astral_shielding$§! và §Y$edict_dimensional_artificing$§!."

 ASTRAL_RIFTS_COMPLETED: "Khe Nứt Tinh Giới Đã Hoàn Thành: $VAL|0$"
 ASTRAL_ACTIONS_RIFTS_COMPLETED_TT: "Với mỗi §YKhe Nứt Tinh Giới§! hoàn thành:\n$t$Mở khóa thêm các §YHành Động Tinh Giới§!.\n$t$Sức chứa §Y$ASTRAL_THREADS_ICON$§!: §G+$@astral_threads_capacity_from_each_explored_rift|*0$§!."
 ASTRAL_ACTIONS_RIFTS_COMPLETED_TT_DESC: "Sự hòa hợp sâu sắc hơn với các Mặt Phẳng Tinh Giới sẽ mở ra thêm nhiều khả năng mới."

