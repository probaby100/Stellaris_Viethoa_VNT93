 MOD_DIMENSIONAL_LOCK_DURATION_MULT: "Thời lượng Khóa Thứ Nguyên"

 r_ever_spinning_top: "Con Quay Vĩnh Cửu"
 r_ever_spinning_top_desc: "Một con quay xuất xứ từ chiều không gian khác. Chuyển động của nó liền mạch, đầy mê hoặc; một chuyển động hoàn hảo kéo dài bất tận."
 ever_spinning_top_modifier: "Chuyển Động Vĩnh Cửu"

 r_celestial_tear: "Lệ Thiên Thể"
 r_celestial_tear_desc: "Một mẫu giọt lệ tinh giới từ một thiên thể đang than khóc. Càng đặt gần một ngôi sao đang hoạt động, nó càng tỏa sáng rực rỡ."
 celestial_tear_modifier: "$r_celestial_tear$"
 celestial_tear_acquisition_tt: "Khả năng sinh sống của các hành tinh trong biên giới quay quanh các sao loại §YA§!, §YB§!, §YF§!, và §YG§!: §G+5%§!"
 celestial_tear_acquisition_nomads_tt: "Khả năng sinh sống của Tàu Phương Chu trong các hệ sao có sao loại §YA§!, §YB§!, §YF§!, và §YG§!: §G+5%§!"

 r_plasmic_core: "Lõi Plasma"
 r_plasmic_core_desc: "Nhân của một tế bào khổng lồ từ một chiều không gian xa lạ. Một lời nhắc nhở về sự đa dạng vô tận của sự sống hữu cơ."
 machine_plasmic_core_effect: "Trao cho một nhà lãnh đạo ngẫu nhiên 3 đặc điểm tích cực ngẫu nhiên."
 plasmic_core_effect: "Mọi dân số trên một thuộc địa ngẫu nhiên nhận được đặc điểm §Y$trait_plasmic$§!."
 plasmic_core_no_suitable_planet: "$TRIGGER_FAIL$§RKhông có thuộc địa khả dụng nào thiếu cư dân sở hữu đặc điểm §Y$trait_plasmic$§!.§!"
 plasmic_core_effect_evopred: "Cung cấp §G50%§! tiến độ cho tình huống §Y$evolutionary_predators_situation$§!. Ngoài ra đặc điểm §Y$trait_plasmic$§! có thể được thêm vào khi hoàn thành."

