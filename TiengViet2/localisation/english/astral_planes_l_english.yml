 r_eternal_throne: "Ngai Vàng Vĩnh Cửu"
 r_eternal_throne_desc: "Một bến đỗ ngoại chiều có khả năng ban phát sự sống trường sinh. Những ai được chạm vào bởi ảnh hưởng của nó sẽ tồn tại trong một thực tại không còn sợ hãi, hoài nghi hay hồi kết."
 eternal_throne_active_effect_tt: "Tất cả các nhà lãnh đạo trở nên bất tử."
 eternal_throne_modifier: "Hòa Nhịp Tinh Giới"

