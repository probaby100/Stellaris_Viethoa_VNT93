 astral_planes.45.name: "$STRANGE_WORMHOLE$"
 astral_planes.45.desc.event_chain_owner: "Một lỗ sâu dị thường đã xuất hiện gần §HKhe Nứt Tinh Thể§!, tại §H[From.GetName]§!.\n\nChúng ta chỉ có thể phỏng đoán rằng đó là một cánh cổng do Kẻ Vô Dạng mở ra để tìm kiếm sự cứu viện. Chúng ta phát hiện hệ sao ở bờ bên kia đã bị kéo vào chiều không gian của chúng ta từ một nơi nào đó.\n\nChúng ta nên chuẩn bị những hạm đội mạnh nhất nếu quyết định bước chân vào nơi này."
 astral_planes.45.desc.locked: "Chúng ta đã phát hiện một lỗ sâu dị thường. Bất kể tàu thuyền cố gắng tiếp cận gần đến mức nào, chúng ta đều bị đẩy lùi bởi một lực lượng vô hình. Điều gì đó rất kỳ lạ đang diễn ra tại hệ sao §H[From.GetName]§!."
 astral_planes.45.desc.unlocked: "Chúng ta đã phát hiện một lỗ sâu dị thường tại §H[From.GetName]§!. Cảm biến phát hiện nó dẫn thẳng tới tâm của thiên hà. Làm sao có thể như vậy được?"

 astral_planes.50.name: "$STRANGE_WORMHOLE$"
 astral_planes.50.desc: "Lỗ sâu dị thường mà chúng ta phát hiện trong hệ sao §H[crystal_sphere_system.GetName]§! đang biến động dữ dội. Cảm biến phát hiện nó là một lối đi thẳng tới trung tâm của thiên hà.\n\nLàm sao điều đó lại khả thi?"

 astral_planes.3000: "Chúng Ta Đang Ở Đâu?"
 astral_planes.3000.desc: "Bờ bên kia của lỗ sâu này dường như đã đưa chúng ta tới... trung tâm thiên hà ư?\n\nLẽ ra chúng ta không thể tồn tại ở nơi này, huống chi là cả một hệ sao nguyên vẹn. Liệu có phải một sự thao túng chiều không gian nào đó đang diễn ra?\n\nChúng ta không có nhiều thời gian để điều tra, vì đang nhận được các tín hiệu truyền phát từ một thực thể chưa rõ."

 astral_planes.3005.desc: "thứ gì thế này... những kẻ ngu xuẩn nào mà ngươi đem tới trợ lực thế hả, shadagon? hay là... ngươi đem dâng thức ăn cho chúng ta..."
 astral_planes.3005.a: "Chúng ta bị dụ đến đây làm con mồi sao?"

 astral_planes.3015: "Những Kẻ Truyền Tin"
 astral_planes.3015.desc: "Các hạm đội của chúng ta đã đánh bại những con tàu kỳ lạ canh gác khe nứt này, nhưng dường như chúng không hề đơn độc.\n\nChúng ta vừa nhận được một tín hiệu truyền tin từ các sinh mệnh đang cư ngụ trong một kiến trúc gần hành tinh đơn độc trong hệ sao này."

 astral_planes.3020.desc: "nhiều kẻ khác đang tới... chúng ta phải phong ấn khe nứt này... chúng ta là những kẻ duy nhất còn sót lại..."
 astral_planes.3020.a: "Nhiều kẻ khác đang tới ư?"

 astral_planes.3050.desc: "chúng ta là những kẻ duy nhất còn sót lại... chúng ta phải tái thiết... chúng ta cần thêm thời gian..."
 astral_planes.3050.a: "Các người có thể tận dụng §Ythứ này§! không?"
 astral_planes.3050.a.tt: "Nếu chúng ta cung cấp một lượng lớn sợi tinh giới, các sinh vật này chắc chắn có thể gia cố năng lực phòng thủ của họ."
 number_formless_fleet_max_reached: "Kẻ Vô Dạng không còn hạm đội nào."
 astral_planes.3050.b: "Bỏ đi."

 astral_planes.3070.desc: "cuối cùng... sự thoái vị... xiềng xích của chúng ta đã vỡ... hãy chứng kiến sự thăng hoa của chúng ta... chúng ta sẽ tìm thấy những gì họ đã giấu kín..."
 astral_planes.3070.a: "Chúng ta phải rút lui."
 astral_planes.3070.a.tt: "Các sinh mệnh được gọi là Kẻ Vô Dạng đã bị hủy diệt bởi những kẻ tấn công từ một chiều không gian khác. Cánh cổng dẫn vào hệ sao $NAME_Formless_System$ đã bị niêm phong vĩnh viễn."

 astral_planes.3100.desc: "§HTrong trạng thái biến chuyển liên hồi, hình dạng hữu hình của thực thể này chập chờn giữa thực tại này và thực tại khác. Giọng nói của họ vang vọng như một bản hòa âm đa tầng, tựa như nhiều sinh mệnh đang đồng thanh cất lời.§!\n\n... xong rồi... phong ấn đã hoàn tất... con cái chúng ta sẽ không bao giờ tìm thấy nơi này nữa..."
 astral_planes.3100.a: "Các người là ai?"
 astral_planes.3100.a.desc: "các bạn biết chúng ta... chúng ta vượt trên những khe nứt... và thuộc về những khe nứt... các bạn đã từng thấy..."
 astral_planes.3100.b: "Vì sao các người lại ở đây?"
 astral_planes.3100.b.desc: "con cái chúng ta... những đứa con tan vỡ... săn lùng chúng ta... chúng tìm kiếm ngai vàng... chúng ta giấu nó đi..."
 astral_planes.3100.c: "\"Ngai Vàng\" này là gì?"
 astral_planes.3100.c.desc: "sự vĩnh cửu của chúng ta... ký ức của chúng ta... nếu chúng ta là dòng máu... thì nó chính là trái tim... giờ đây an toàn rồi... chúng ta cảm ơn các bạn..."
 astral_planes.3100.d: "§YHãy quy phục dưới quyền chúng ta, các ngươi sẽ được tiếp tục sinh tồn.§!"
 formless_subjugation_path_success_tt: "§Y$NAME_Formless$§! trở thành một thuộc quốc dưới quyền §Y[This.GetName]§! với tư cách là một §Y$preset_luminarium$§!."
 astral_planes.3100.e: "§RGiao \"Ngai Vàng\" mà các người vừa nhắc tới cho chúng ta.§!"
 astral_planes.3100.f: "Hãy cùng nhau hợp tác."
 astral_planes.3101.desc: "điều này đã được tiên liệu... chúng ta sẽ phụng sự các bạn... đây là định mệnh của chúng ta..."
 astral_planes.3102.desc.fail: "chúng ta đã nhìn nhầm các bạn... nỗi bi thương tột cùng... hãy để nó kết thúc..."
 astral_planes.3102.desc: "ngai vàng vĩnh cửu... không phải thứ để các bạn đoạt lấy...\n$astral_planes.3102.desc.fail$"
 astral_planes.3102.a: "Cứ thế đi."

 astral_planes.3110.desc: "lòng biết ơn... sự an toàn... phần thưởng..."
 astral_planes.3110.a: "Chúng ta cần §Ysức mạnh§! của các bạn."
 astral_planes.3110.a.tt: "Trao một hạm đội Kẻ Vô Dạng dưới quyền kiểm soát của bạn."
 astral_planes.3110.b: "Chúng ta cần §Ytri thức§! của các bạn."
 astral_planes.3110.b.tt: "Ban một công nghệ vật lý ngẫu nhiên."
 astral_planes.3110.c: "Chúng ta cần §Ysợi tinh giới§! của các bạn."
 astral_planes.3110.d: "Các người đã cử ai tới phục vụ chúng ta?"
 astral_planes.3110.d.desc: "§Y$NAME_Formless_leader$§!... kiến trúc sư của ngai vàng vĩnh cửu...\n\nchính người đó đã dành hàng thiên niên kỷ để kiến tạo nên nó...\n\nmột thiết bị gắn kết chúng ta thành một thể... tinh xảo và vĩnh viễn...\n\nngười đó là thích hợp nhất để phụng sự các bạn...\n\nkhông còn ai thông tuệ hơn thế nữa..."
 astral_planes.3110.e: "\"Kẻ Xâm Lăng (Unbidden)\" là ai?"
 astral_planes.3110.f: "\"Kẻ Lạc Lối (Aberrant)\" là ai?"
 astral_planes.3110.g: "\"Kẻ Cuồng Tín (Vehement)\" là ai?"
 astral_planes.3110.h: "§Y$NAME_Formless_leader$§! đã ngã xuống."
 astral_planes.3110.h.desc: "tiếc thương...\n\nnhưng đã thấy trước...\n\nđịnh mệnh...\n\nchớ bi sầu..."

 astral_planes.3114.desc.unbidden: "shabanash... huyết tộc vụn vỡ... luôn luôn đói khát...\n\nlòng tham của chúng ta... bị khuếch đại...\n\ntội lỗi bị phơi bày ra ánh sáng...\n\nmột nỗi nhục nhã khôn cùng..."
 astral_planes.3114.desc.aberrant: "dagaal... cuồng loạn... tràn ngập phẫn nộ...\n\ncơn thịnh nộ của chúng ta... hiện hình...\n\nxung đột của chúng sẽ không bao giờ dứt..."
 astral_planes.3114.desc.vehement: "onzai... những kẻ truy cầu ngai vàng...\n\nsự đố kỵ tột bực...\n\nkhái niệm bị lãng quên của chúng ta..."
 astral_planes.3114.a: "Họ có điểm yếu nào không?"
 astral_planes.3114.b: "Chúng ta muốn hỏi điều khác."

 astral_planes.3115.desc.common: "chúng ta biết cách... đó là vấn đề về... tần số...?\n\nngôn ngữ của các bạn không có từ này...\n\nchúng ta cần... vật chất tinh giới..."
 astral_planes.3115.desc.unbidden: "lòng tham sẽ hủy diệt chúng...\n\n$astral_planes.3115.desc.common$"
 astral_planes.3115.desc.aberrant: "cơn thịnh nộ của chúng không có tiêu điểm...\n\n$astral_planes.3115.desc.common$"
 astral_planes.3115.desc.vehement: "dục vọng của chúng là điều điên rồ...\n\n$astral_planes.3115.desc.common$"
 astral_planes.3115.a: "Chúng ta có thể cung cấp."

 astral_planes.3116.desc: "xong rồi... sự hòa nhịp của các bạn đã hoàn tất..."

 secret_of_the_unbidden_modifier: "Bí Mật Của Kẻ Xâm Lăng"
 pacification_of_the_aberrant_modifier: "Bình Định Kẻ Lạc Lối"
 folly_of_the_vehement_modifier: "Sự Điên Rồ Của Kẻ Cuồng Tín"

 astral_planes.3121.desc: "§Y$NAME_Formless_leader$§! của shadagon... sao ngươi lại ở đây...\n\nngươi sẽ là một bữa tiệc thịnh soạn...\n\nhãy tới và nát tan trước chúng ta..."
 astral_planes.3122.desc: "chúng ta vẫn chưa xong đâu... §Y$NAME_Formless_leader$§! của shadagon...\n\nngươi đã cứu thoát đồng loại... nhưng lại ngu xuẩn theo đuổi... sự ngạo mạn...\n\nhãy chứng kiến cơn thịnh nộ... và rồi chìm vào quên lãng..."
 astral_planes.3123.desc: "kiến trúc sư... §Y$NAME_Formless_leader$§! của shadagon...\n\nchúng ta sẽ nuốt chửng ngươi... đồng hóa tâm trí ngươi...\n\nbí mật của ngai vàng... món quà vĩ đại ngươi dâng hiến...\n\nhãy gia nhập cùng chúng ta... chúng ta sẽ tôn vinh ngươi..."

 alert_formless_reward_available_title: "Món Quà Kẻ Vô Dạng"
 alert_formless_reward_available_instant: "Kẻ Vô Dạng đã đề nghị một phần thưởng cho chúng ta."
 ALERT_FORMLESS_REWARD_AVAILABLE_DETAIL: "Các sinh mệnh ở tâm ngân hà biết ơn sự tương trợ của chúng ta, và hứa sẽ gửi quà tặng định kỳ."

 NAME_Formless_leader: "Zadigal"
 formless_leader_desc: "Một trong những nhà lãnh đạo cuối cùng của Kẻ Vô Dạng, thực thể ngoại chiều không gian này đã chỉ huy các hạm đội lâu hơn tuổi thọ của hầu hết các giống loài."
 formless_leader_catch_phrase: "biết ơn... đón nhận..."

 astral_planes.3155.name: "Chiến Tranh Với Kẻ Vô Dạng"
 astral_planes.3155.desc: "Chiến dịch tấn công của chúng ta nhằm vào Kẻ Vô Dạng đã khiến [this.GetName] từ bỏ hạm đội được phân công và quay trở lại hàng ngũ của đồng loại."
 astral_planes.3155.a: "Rất tốt."

 astral_planes.3165.name: "Kẻ Vô Dạng Bị Tiêu Diệt"
 astral_planes.3165.desc: "Chúng ta đã tận diệt thành công những Kẻ Vô Dạng cuối cùng còn sót lại tại [event_target:formless_system.GetName].\n\nTất cả những gì còn lại là một thiết bị bí ẩn. Người ta chỉ cần đặt [this.species.GetHandNamePlural] lên đó để kích hoạt các đặc tính tái sinh kỳ diệu của nó. Thiết bị đóng vai trò như một ống dẫn vào các mặt phẳng tinh giới, với lượng vật chất ngoại chiều khổng lồ tự do luân chuyển qua nó."

 astral_planes.3170.desc: "dù chúng ta biết các bạn...\nnhưng đây chưa phải lúc để tương phùng..."

 pm_formless_haven: "Nơi Trú Ẩn Kẻ Vô Dạng"
 pm_formless_haven_desc: "Pháo đài cuối cùng của các sinh mệnh được gọi là Kẻ Vô Dạng. Các chủng loài từ chiều không gian khác sẽ thỉnh thoảng được định cư tại đây dưới sự bảo bọc của họ."
 pm_formless_haven_tt: "Tạo §Y500§! £pop£ §HDân Số§! thuộc loài khác trên hành tinh này"

 preset_luminarium: "Quang Minh Lãnh"
 preset_luminarium_desc: "Quang Minh Lãnh là một loại hình thuộc quốc do người sở hữu Ngai Vàng Vĩnh Cửu tạo dựng. Những ai đoạt được chiếc ghế này sẽ có tầm ảnh hưởng lên Kẻ Vô Dạng, những kẻ mà đế chế xuyên chiều từng một thời lẫy lừng nay đã suy tàn thành tro bụi."
 preset_luminarium_flavor_desc: "$preset_luminarium_desc$"
 modifiers_eternal_throne: "$preset_luminarium$"
 eternal_throne_conditions: "$MODIFIER$"
 not_allowed_for_luminarium: "$TRIGGER_FAIL$Không cho phép đối với thiết lập §Y$preset_luminarium$§!."

