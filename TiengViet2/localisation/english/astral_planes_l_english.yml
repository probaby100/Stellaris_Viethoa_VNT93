 action_astral_boost: "Thúc Đẩy Tinh Giới"
 action_astral_boost_desc: "Cường hóa động cơ tàu thuyền của chúng ta bằng $ASTRAL_THREADS_ICON$, nâng cao khả năng cơ động của chúng."

 action_hyper_relay_insight: "Tiếp Thu Hiểu Biết Trạm Tiếp Sóng"
 action_hyper_relay_insight_desc: "Các đặc tính độc nhất của $ASTRAL_THREADS_ICON$ sẽ giúp chúng ta thấu hiểu rõ hơn cách gấp khúc không gian lại với nhau."

 action_quantum_catapult_insight: "Tiếp Thu Hiểu Biết Máy Bắn Lượng Tử"
 action_quantum_catapult_insight_desc: "Các đặc tính độc nhất của $ASTRAL_THREADS_ICON$ sẽ cho phép chúng ta phá vỡ sâu hơn các giới hạn của du hành FTL."
 action_quantum_catapult_insight_2: "Hiệu Chỉnh Tinh Giới"
 action_quantum_catapult_insight_2_desc: "Bằng cách khai thác tiềm năng của $ASTRAL_THREADS_ICON$ sâu hơn nữa, chúng ta có thể gia tăng độ chính xác của Máy Bắn Lượng Tử."
 action_quantum_catapult_insight_2_requirement_tooltip: "$TRIGGER_FAIL$§RSở hữu một §YMáy Bắn Lượng Tử§!.§!"
 action_exodus_jump_insight: "Tiếp Thu Hiểu Biết Bước Nhảy Đại Di Cư"
 action_exodus_jump_insight_desc: "$action_quantum_catapult_insight_desc$"
 action_exodus_jump_insight_2: "$action_quantum_catapult_insight_2$"
 action_exodus_jump_insight_2_desc: "Bằng cách khai thác tiềm năng của $ASTRAL_THREADS_ICON$ sâu hơn nữa, chúng ta có thể gia tăng độ chính xác của $sm_arkship_exodus_jump$."
 action_exodus_jump_insight_2_requirement_tooltip: "$TRIGGER_FAIL$§RYêu cầu một Tàu Phương Chu trang bị §Y$sm_arkship_exodus_jump$§!.§!"

 action_summon_dimensional_fleet: "Triệu Hồi Hạm Đội Ngoại Chiều"
 action_summon_dimensional_fleet_desc: "Sự hòa hợp của chúng ta với các mặt phẳng tinh giới đã sâu sắc hơn. Giờ đây chúng ta có thể triệu gọi các chiến binh ngoại chiều không gian đến hỗ trợ cho lý tưởng của chúng ta. Họ đến từ đâu, hay vì sao họ lại đến, chúng ta không thể biết chắc."
 action_summon_dimensional_fleet_tooltip: "Triệu hồi một hạm đội hùng mạnh từ một không-thời gian xa lạ. Họ có thể lưu lại trong chiều không gian của chúng ta tối đa 10 năm."
 NAME_Astral_Avatar: "Hiện Thân Tinh Giới"
 NAME_Astral_Avatar_Small: "$NAME_Astral_Avatar$ Cỡ Nhỏ"
 NAME_Dimensional_Fleet: "Hạm Đội Ngoại Chiều"
 MESSAGE_DIMENSIONAL_FLEET_DESTROYED_TITLE: "Hạm Đội Ngoại Chiều Đã Rời Đi"
 MESSAGE_DIMENSIONAL_FLEET_DESTROYED_DESC: "Hạm đội Ngoại Chiều mà chúng ta triệu hồi đã trở về mặt phẳng tồn tại ban đầu của họ. Không còn sót lại dấu vết nào."

 action_astral_splitting: "Xé Rách Tinh Giới"
 action_astral_splitting_desc: "Bằng cách đan cài thêm $ASTRAL_THREADS_ICON$ vào kết cấu mong manh của không gian, chúng ta có thể tạo ra một vết rách nhân tạo trong thực tại. Thực hiện điều này quá thường xuyên sẽ đẩy cả ngân hà vào nguy cơ bị xé toạc hoàn toàn."
 action_astral_splitting_no_rift_spawning_location: "$TRIGGER_FAIL$§RKhông có hệ sao hợp lệ nào để chúng ta có thể xé rách và mở ra một Khe Nứt mới.§!"
 action_astral_splitting_tooltip: "Tạo một $ASTRAL_RIFT$ trong một hệ sao ngẫu nhiên do bạn kiểm soát.\nPhải kiểm soát một hệ sao không liền kề với bất kỳ $ASTRAL_RIFTS$ nào."
 action_astral_splitting_nomad_tooltip: "Tạo một $ASTRAL_RIFT$ trong một hệ sao ngẫu nhiên có sở hữu một $waystation$.\nPhải có một $waystation$ trong hệ sao không liền kề với bất kỳ $ASTRAL_RIFTS$ nào."
 action_astral_splitting_too_many_rifts: "$TRIGGER_FAIL$§RChúng ta đã đẩy khả năng cưỡng bức mở các khe nứt không-thời gian mới đến giới hạn cực hạn.§!"
 action_astral_splitting_no_rift_spawning_location_tt: "§RKhông có hệ sao hợp lệ nào để chúng ta có thể xé rách và mở ra một Khe Nứt mới.§!"

 action_gain_physics_insight: "Tiếp Thu Hiểu Biết Vật Lý"
 action_gain_physics_insight_desc: "Cho phép các nhà khoa học của chúng ta trưng dụng $ASTRAL_THREADS_ICON$ để thúc đẩy sâu hơn hiểu biết về vật lý."

 action_lateral_artifacting: "Kích Hoạt Di Vật Song Song"
 action_lateral_artifacting_desc: "Chúng ta có thể thao túng dòng chảy thời gian để tận dụng sức mạnh của hai di vật cùng một lúc."
 action_lateral_artifacting_tooltip: "Cho phép bạn kích hoạt di vật thứ hai mà không cần chờ thời gian Khải Hoàn hiện tại kết thúc."
 action_lateral_artifacting_not_same_relic: "$TRIGGER_FAIL$§RDi vật này hiện đã được kích hoạt.§!"

 astral_jump: "Bước Nhảy Tinh Giới"

