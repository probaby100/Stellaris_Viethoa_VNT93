########################
# Anomalies & Projects #
########################

 ASTRAL_SCAR_CAT: "$pc_astral_scar$"
 anomaly_astral_scar_desc: "Chúng ta đã phát hiện một vết rách dị thường trong không-thời gian. Càng đến gần, các định luật vật lý tương đối đã biết càng mất đi hiệu lực.\n\nNghiên cứu hiện tượng này hoàn toàn có thể nâng tầm hiểu biết khoa học của chúng ta về cơ chế vận hành của vũ trụ lên một tầm cao mới."
 astral_planes.6000.name: "$pc_astral_scar$"
 astral_planes.6000.desc: "Chúng ta đã hoàn thành phân tích về §Y$pc_astral_scar$§! tại §Y[FromFrom.System.GetName]§!.\n\nNó đang rò rỉ vật chất vào vũ trụ của chúng ta từ... một nơi nào đó khác. Vật chất không hề được bảo toàn xung quanh khe nứt - ít nhất là không theo bất kỳ phương thức nào mà chúng ta đo đạc được. Dù ở quy mô tương đối nhỏ, bằng cách nào đó khe nứt đang làm gia tăng tổng khối lượng của vũ trụ chúng ta.\n\nNghiên cứu hiện tượng này sẽ mang lại hiểu biết sâu sắc hơn về nguồn năng lượng bí ẩn chưa được giải thích này."
 ASTRAL_SCAR_PROJECT: "$pc_astral_scar$"
 ASTRAL_SCAR_PROJECT_DESC: "Chúng ta đã phát hiện một vết rách dị thường trong không-thời gian. Nghiên cứu các đặc tính độc nhất của nó sẽ đem lại những hiểu biết khoa học vô giá."
 astral_planes.6001.name: "$pc_astral_scar$"
 astral_planes.6001.desc: "Chúng ta đã xác nhận sự tồn tại của một vũ trụ khác bên ngoài vũ trụ của chúng ta tại hệ sao §Y[FromFromFrom.System.GetName]§!.\n\nThông qua khe nứt, các chiều không gian vật lý của nó đang tạo ra áp lực khổng lồ lên vũ trụ của chúng ta, kết quả là một dòng vật chất nhỏ nhưng ổn định đang tràn sang. Tác động lâu dài vẫn chưa thể hiểu hết, nhưng trong thời gian này chúng ta nên tiếp tục phân tích dòng vật chất tuôn trào từ vũ trụ này."
 astral_planes.6001.a: "Những kỳ quan nào có thể đang nằm ở phía bên kia?"

 ASTRAL_SCAR_INSTABILITY: "Bất Ổn $pc_astral_scar$"
 ASTRAL_SCAR_INSTABILITY_DESC: "Các dị thường hấp dẫn bất ổn đang rò rỉ ra từ §Y$pc_astral_scar$§! tại [From.System.GetName], biểu hiện dưới dạng các điểm kỳ dị di chuyển chậm chạp trong không gian lân cận trước khi sụp đổ dữ dội. Tàu thuyền đi qua hệ sao này có thể né tránh chúng, nhưng phải di chuyển cẩn trọng hơn.\n\nĐiều tra sâu hơn tình huống này có thể mở ra cách thức tái ổn định lỗ hổng thứ nguyên."
 instable_astral_scar_modifier: "$ASTRAL_SCAR_INSTABILITY$"
 astral_planes.6006.name: "Một Mũi Khâu Thời Gian (và Không Gian)"
 astral_planes.6006.desc: "Sau khi phân tích cẩn thận, chúng ta đã xác nhận rằng §Y$pc_astral_scar$§! tại [From.System.GetName] đang ở mức bất ổn nguy hiểm và đòi hỏi sự can thiệp tức thì để ngăn chặn các điểm kỳ dị hấp dẫn tiếp tục hình thành trong hệ sao này.\n\nSự phun trào mạnh mẽ của §Y$astral_threads$§! có thể được chuyển hướng và tái sử dụng nhằm 'khâu liền' vết sẹo lại. Điều này sẽ hàn gắn vết rách trong không-thời gian và nhiều khả năng để lại một lượng vật chất tinh giới đáng kể.\n\nMặt khác, chúng ta có thể phóng một lượng lớn thuốc nổ hạng nặng nhằm mở rộng vết sẹo. Chúng ta suy đoán rằng điều này cũng sẽ cho phép thám hiểm sâu hơn những gì có thể tồn tại ở phía bên kia."
 astral_planes.6006.a: "Khâu liền nó lại."
 astral_planes.6006.b: "Thổi tung nó ra."
 astral_planes.6007.name: "Vết Thương Vũ Trụ"
 astral_planes.6007.desc: "Sau khi thao túng cẩn thận kết cấu bị rách của nó, chúng ta đã thành công phong ấn hoàn toàn §Y$pc_astral_scar$§! tại [From.System.GetName]. Các dị thường hấp dẫn từ đó đã chấm dứt, và chúng ta thu hồi được một lượng đáng kể §Y$astral_threads$§! trong quá trình này.\n\nBất kể thực tại nào từng nằm ở bờ bên kia, nó sẽ không còn là mối nguy hiểm đối với vũ trụ của chúng ta nữa."
 astral_planes.6008.name: "$astral_planes.6007.name$"
 astral_planes.6008.desc: "Khối thuốc nổ mà chúng ta đưa vào lõi của §Y$pc_astral_scar$§! tại [From.System.GetName] đã nới rộng các nếp gấp trong không gian và thời gian. Nơi từng là một vết rách nhỏ trên kết cấu vũ trụ nay trở thành một khe nứt lớn hơn mà chúng ta có khả năng thám hiểm.\n\nSự ổn định đạt được đã khiến các dị thường hấp dẫn lắng xuống, và chúng ta đã sẵn sàng khám phá những gì ẩn chứa phía bên kia."
 astral_planes.6009.name: "Sụp Đổ Tinh Giới"
 astral_planes.6009.desc: "§Y$pc_astral_scar$§! tại [FromFromFromFrom.System.GetName] đã sụp đổ vào bên trong, phóng thích một lượng đáng kể $astral_threads$ vào hệ sao lân cận. Nơi từng có một vết rách nhỏ trên kết cấu vũ trụ nay trở thành không gian trống rỗng.\n\nBất kể thực tại nào từng nằm ở bờ bên kia, nó sẽ không còn đe dọa vũ trụ của chúng ta nữa."

 GREATEST_SHOW_CAT: "Phát Hiện Vật Thể Phát Sáng"
 anomaly_greatest_show_desc: "Một vật thể phát sáng rực rỡ đã được phát hiện trên một tiểu hành tinh tại §Y[from.System.GetName]§!.\n\nĐược cấu tạo từ các vật liệu tối tân, nó đang phát đi một luồng sóng vô tuyến đều đặn trên mọi tần số. Máy quét của chúng ta cho thấy không có hợp chất nổ hay dễ bay hơi nào bên trong. Có vẻ an toàn để tiếp cận và nghiên cứu sâu hơn."
 astral_planes.6010.name: "Buổi Biểu Diễn Vĩ Đại Nhất Đa Vũ Trụ"
 astral_planes.6010.desc: "Vật thể phát sáng rực rỡ mà chúng ta phát hiện trên tiểu hành tinh này thực chất là một biển quảng cáo.\n\nMàn hình hiển thị khổng lồ này được vận hành bởi cơ sở hạ tầng cơ khí chiếm trọn bên trong tiểu hành tinh nơi nó được gắn vào. Bản thân tiểu hành tinh lơ lửng một cách dị thường tại một điểm trong không gian, hoàn toàn không bị ảnh hưởng bởi lực hấp dẫn của bất kỳ vật thể lân cận nào.\n\nBản thân quảng cáo nhắc đến thứ mà nó gọi là \"Buổi Biểu Diễn Vĩ Đại Nhất Đa Vũ Trụ\". Có một trạm nhận năng lượng năng lượng thanh toán để dịch chuyển trực tiếp đến địa điểm thu hút du khách này."
 astral_planes.6010.a: "Thanh toán chi phí."
 astral_planes.6010.b: "Cải tạo biển hiệu để phục vụ mục đích của chúng ta."
 astral_planes.6010.c: "Tháo dỡ nó lấy vật liệu phế liệu."
 astral_planes.6011.name: "Khe Nứt Xuất Hiện"
 astral_planes.6011.desc: "Sau khi xử lý khoản thanh toán của chúng ta, hệ thống máy móc bên trong tiểu hành tinh bắt đầu rền vang hoạt động. Một luồng ánh sáng xanh lam sắc nhọn bắn thẳng ra ngoài, xẻ dọc kết cấu không gian và thời gian một cách tỉ mỉ. Khi công việc hoàn tất, tiểu hành tinh biến mất hoàn toàn, và một Khe Nứt Tinh Giới xuất hiện thế chỗ."
 astral_planes.6011.a: "Thật ấn tượng."
 astral_planes.6012.name: "Quảng Cáo Hiệu Quả"
 astral_planes.6012.desc: "Chúng ta đã thay thế biển quảng cáo dị thường bằng lời giới thiệu dành cho các doanh nghiệp địa phương của chúng ta tại [fromfrom.GetName]. Trạm thanh toán đã được tháo dỡ cẩn thận, để lộ một lượng nhỏ năng lượng dự trữ bên trong."
 astral_planes.6012.a: "Thật biết làm ăn."
 astral_planes.6013.name: "Biển Hiệu Phức Tạp"
 astral_planes.6013.desc: "Công nghệ bên trong cơ cấu của tiểu hành tinh tân tiến hơn nhiều so với dự đoán ban đầu. Nhờ đó, việc tận thu nó đã mang lại cho chúng ta giá trị đáng kể. Chúng ta đã thu hồi được nhiều loại vật liệu hiếm - bao gồm một lượng $astral_threads$ dị thường. Tiểu hành tinh rỗng ruột này hẳn đã được thiết kế để thao túng không gian và thời gian theo một phương thức nào đó."
 astral_planes.6013.a: "Chúng ta sẽ sử dụng chúng thật hữu ích."

 BLACK_HOLE_INSTABLE_CAT: "Bất Ổn $sc_black_hole$"
 anomaly_black_hole_instable_desc: "Các máy quét phát hiện sự sai lệch đáng kể so với các đặc tính vật lý dự kiến của lỗ đen trong hệ sao [from.System.GetName]. Lực hấp dẫn của nó biểu hiện khó lường, dẫn đến sự không nhất quán về thời gian dễ nhận thấy từ điểm này sang điểm khác trong không gian."
 astral_planes.6020.name: "Lỗ Đen Bất Ổn"
 astral_planes.6020.desc: "Một số hạt được phóng thích bởi lỗ đen tại [from.System.GetName] thực chất là §Y$astral_threads$§!. Điều này có nghĩa là vào một thời điểm nào đó, một Vết Sẹo Tinh Giới đã bị hút vào điểm kỳ dị của nó và hiện đang từ từ bị đẩy ngược ra ngoài. Hiện tượng này trước đây vốn bị coi là bất khả thi.\n\nCó thể có cách để tống xuất vết sẹo và tái ổn định không gian hệ sao này bằng cách hướng một luồng §Y$astral_threads$§! nồng độ cực cao vào điểm kỳ dị.\n\nTuy nhiên, không can thiệp thêm sẽ cho phép chúng ta tiếp tục thu hoạch kết cấu vũ trụ từ một khoảng cách an toàn."
 astral_planes.6020.a: "Bơm vật chất tinh giới vào điểm kỳ dị."
 astral_planes.6020.b: "Thu thập sợi tinh giới từ khoảng cách an toàn."
 astral_planes.6021.name: "Khe Nứt Hiện Hình"
 astral_planes.6021.desc: "Việc bơm §Y$astral_threads$§! vào điểm kỳ dị đã gây ra phản ứng tức thì và mãnh liệt, khi một cơn lũ các hạt ngoại chiều tuôn trào ra khỏi lực hút hấp dẫn của lỗ đen. Các hạt này đã ngưng tụ thành một $astral_rift$ hiện đang treo lơ lửng bên trong giếng trọng lực của nó.\n\nLàm thế nào mà dị thường thiên thể này ban đầu bị hút vào điểm kỳ dị vẫn là một ẩn số, nhưng giờ đây ít nhất chúng ta có thể điều tra xem điều gì đang nằm ở bờ bên kia."
 astral_planes.6022.name: "Một Vết Sẹo Ra Đời"
 astral_planes.6022.desc: "Lỗ đen tại [from.System.GetName] đã tống xuất $pc_astral_scar$ từng bị hấp thụ tạm thời vào điểm kỳ dị của nó, cùng với một lượng lớn vật chất tinh giới bị giam cầm.\n\nLực hấp dẫn của lỗ đen từ đó đã trở lại bình thường."

 astral_planes.6030.name: "Kỳ Quan Thiên Văn Tinh Giới"
 astralnomical_interest_modifier: "Mối Quan Tâm Thiên Văn Tinh Giới"
 astralnomical_interest_tt: "Mỗi §HDân Cư Hữu Cơ§! Không Phải Nô Lệ £pop£ tạo ra 1 £physics_research£ §YNghiên Cứu Vật Lý§! mỗi tháng."
 astral_planes.6030.desc.common_1: "Các cư dân thuộc địa trên [this.GetName] đã hình thành niềm đam mê say đắm đối với"
 astral_planes.6030.desc.common_2: "có thể quan sát được trên bầu trời từ bán cầu nam của hành tinh. Những đồn đoán rầm rộ xuất hiện về nguồn gốc của nó, cũng như những mối nguy hiểm hay thời cơ mà nó mang lại.\n\nCác nhà thiên văn nghiệp dư từ khắp [owner.GetName] đã đổ xô tới hành tinh này để tận mắt chiêm ngưỡng hiện tượng kỳ thú."
 astral_planes.6030.desc.rift: "$astral_planes.6030.desc.common_1$ $astral_rift$ $astral_planes.6030.desc.common_2$"
 astral_planes.6030.desc.scar: "$astral_planes.6030.desc.common_1$ $pc_astral_scar$ $astral_planes.6030.desc.common_2$"

 astral_planes.6035.name: "Thị Kiến Xung Đột"
 astral_planes.6035.tt: "Thuộc địa mất 5 $r_stability$"
 conflicting_visions: "$astral_planes.6035.name$"
 astral_planes.6035.desc.common_1: "Sự mê mẩn đối với"
 astral_planes.6035.desc.common_2: "tại địa phương trên [this.GetName] đã biến thành sự cuồng tín. Nhiều người báo cáo đã trải qua những thị kiến về một thế giới vượt ra ngoài thế giới của chúng ta.\n\nMột nhóm khẳng định rằng"
 astral_planes.6035.desc.common_3: "dẫn tới trung tâm của một thiên hà đồng hồ cơ khí, nơi một vị thần máy móc lên dây cót cho chiếc đồng hồ khổng lồ để duy trì sự cân bằng giữa vô vàn thế giới.\n\nNgược lại, những người khác nói rằng thị kiến của họ đã hé lộ một ngôi sao đen nắm giữ chìa khóa của sự giác ngộ."
 astral_planes.6035.desc.rift: "$astral_planes.6035.desc.common_1$ $astral_rift$$astral_planes.6035.desc.common_2$ Khe Nứt $astral_planes.6035.desc.common_3$"
 astral_planes.6035.desc.scar: "$astral_planes.6035.desc.common_1$ $pc_astral_scar$$astral_planes.6035.desc.common_2$ Vết Sẹo $astral_planes.6035.desc.common_3$"

 astral_planes.6040.name: "Hố Sâu Ngăn Cách Nới Rộng"
 astral_planes.6040.tt: "Thuộc địa mất từ 5 đến 10 $r_stability$"
 widening_divide_1: "$astral_planes.6040.name$"
 widening_divide_2: "$widening_divide_1$"
 widening_divide_3: "$widening_divide_1$"
 widening_divide_4: "$widening_divide_1$"
 widening_divide_5: "$widening_divide_1$"
 widening_divide_6: "$widening_divide_1$"
 astral_planes.6040.desc.common: "Sự rạn nứt giữa các tầng lớp dân cư trên [this.GetName] ngày càng tồi tệ hơn. Những thị kiến kỳ lạ do các cư dân báo cáo đã châm ngòi cho các cuộc tranh luận nảy lửa và cuối cùng dẫn tới các đợt bùng phát bạo lực. Các lãnh đạo địa phương đang kêu gọi một lời tuyên bố chính thức.\n\nDù nghe có vẻ kỳ dị đến đâu, chúng ta đang bị yêu cầu phải công nhận tính xác thực cho sự tồn tại của vị thần máy móc hoặc ngôi sao đen đằng sau"
 astral_planes.6040.desc.rift: "$astral_planes.6040.desc.common$ $astral_rift$."
 astral_planes.6040.desc.scar: "$astral_planes.6040.desc.common$ $pc_astral_scar$."
 astral_planes.6040.a: "Vị thần máy móc muôn năm."
 astral_planes.6040.b: "Hãy để họ hướng về ngôi sao đen."
 astral_planes.6040.c: "Cả hai thị kiến đều hoàn toàn vô căn cứ."

 astral_planes.6045.name: "Xung Đột Hậu Lý Thuyết"
 astral_planes.6045.desc: "Thảm họa trên [this.GetName]!\n\nNhững thị kiến tương phản mà người dân trải qua đã dẫn đến tình trạng bất ổn quy mô lớn. Các nhóm đối địch đã cầm vũ khí lên, với những vụ đụng độ cục bộ dẫn đến xung đột bạo lực trên toàn hành tinh.\n\nKhông thể để tình trạng này tiếp diễn."
 astral_planes.6045.a: "Chấm dứt sự điên rồ này."

 astral_planes.6050.name: "Lòng Cuồng Nhiệt Tinh Giới"
 astral_zeal_modifier: "Lòng Cuồng Nhiệt Tinh Giới"
 astral_zeal_modifier_tt: "Nhận một lượng nhỏ $r_unity$ sau khi hoàn thành một §Y$astral_rift$§!."
 astral_planes.6050.desc.common_1: "Với thị kiến về một"
 astral_planes.6050.desc.common_2: "được chính quyền chính thức tán thành, các cuộc tranh luận về"
 astral_planes.6050.desc.common_3: "đã giảm đi đáng kể. Đồng thời, sự nhiệt tình của công chúng dành cho việc nghiên cứu nó chưa bao giờ cao hơn thế."
 astral_planes.6050.desc.mechgod: "vị thần máy móc"
 astral_planes.6050.desc.blackstar: "ngôi sao đen khai mở tâm trí"
 astral_planes.6050.desc.rift_mechgod: "$astral_planes.6050.desc.common_1$ $astral_planes.6050.desc.mechgod$ $astral_planes.6050.desc.common_2$ $astral_rift$ $astral_planes.6050.desc.common_3$"
 astral_planes.6050.desc.rift_blackstar: "$astral_planes.6050.desc.common_1$ $astral_planes.6050.desc.blackstar$ $astral_planes.6050.desc.common_2$ $astral_rift$ $astral_planes.6050.desc.common_3$"
 astral_planes.6050.desc.scar_mechgod: "$astral_planes.6050.desc.common_1$ $astral_planes.6050.desc.mechgod$ $astral_planes.6050.desc.common_2$ $pc_astral_scar$ $astral_planes.6050.desc.common_3$"
 astral_planes.6050.desc.scar_blackstar: "$astral_planes.6050.desc.common_1$ $astral_planes.6050.desc.blackstar$ $astral_planes.6050.desc.common_2$ $pc_astral_scar$ $astral_planes.6050.desc.common_3$"

 astral_planes.6055.name: "Kiểm Soát Tranh Cãi"
 astral_aficionados_modifier: "Người Hâm Mộ Tinh Giới"
 astral_planes.6055.desc.common: "Mọi cuộc thảo luận công khai về các thị kiến kỳ lạ trên [this.GetName] đã bị nghiêm cấm. Những hình phạt nghiêm khắc dành cho bất cứ ai vi phạm chủ đề cấm kỵ đã ngăn chặn nguy cơ xung đột công khai.\n\nNhiều cư dân đã chuyển hướng sang những mối quan tâm mới, nhưng một nhóm nòng cốt các nhà thiên văn nghiệp dư vẫn tiếp tục tận hưởng cảnh tượng kỳ vĩ của"
 astral_planes.6055.desc.rift: "$astral_planes.6055.desc.common$ $astral_rift$."
 astral_planes.6055.desc.scar: "$astral_planes.6055.desc.common$ $pc_astral_scar$."
 astral_planes.6055.a: "Một biện pháp hợp lý."

 SPONTANEOUS_EXPLOSIONS_CAT: "Những Vụ Nổ Tự Phát"
 COLONIZATION_IMPOSSIBLE_UNDER_INVESTIGATION: "$TRIGGER_FAIL$§RHành tinh đang được điều tra.§!"
 anomaly_spontaneous_explosions_desc: "Chúng ta đã phát hiện những vụ nổ tự phát trên bề mặt §Y[this.GetName]§!. Không có tàu chiến nào trên quỹ đạo hay sự sống bề mặt có thể phát hiện được, nguyên nhân của những vụ nổ khổng lồ này vẫn chưa rõ."
 astral_planes.6060.name: "Đạn Dược Dễ Phát Nổ"
 astral_planes.6060.desc: "Bề mặt của §Y[from.GetName]§! rải rác các loại đạn dược lỗi kỹ thuật, mỗi lần phát nổ lại khoét sâu từng mảng của hành tinh.\n\nBản thân các loại vũ khí này rất xa lạ và cực kỳ dễ bắt lửa. Hơn nữa, mô thức phát nổ cho thấy một mạng lưới bệ phóng chôn sâu ngầm bên dưới bề mặt hành tinh."
 astral_planes.6060.a: "Điều tra sâu hơn."

 SPONTANEOUS_EXPLOSIONS: "$astral_planes.6060.name$"
 SPONTANEOUS_EXPLOSIONS_DESC: "$astral_planes.6060.desc$"
 astral_planes.6065.name: "$SPONTANEOUS_EXPLOSIONS$"
 astral_planes.6065.desc: "Phân tích sâu hơn chỉ ra rằng hành tinh này từng được sử dụng làm một kho vũ khí khổng lồ. Nằm im lìm suốt hàng nghìn năm, từng vũ khí riêng lẻ nay bắt đầu trục trặc, biến cả hành tinh thành một bãi chiến trường bất ổn.\n\nChúng ta có đủ năng lực để kích nổ toàn bộ lượng đạn dược còn lại theo cách có kiểm soát. Ngoài ra, chúng ta có thể thử thu hồi một số vũ khí và vô hiệu hóa chúng trước khi chúng phát nổ."
 astral_planes.6065.a: "Kích nổ tung nó lên."
 astral_planes.6065.b: "Thử thu hồi các loại chất nổ cổ đại."
 astral_planes.6065.c: "Để tình hình tự nó diễn tiến."

 astral_planes.6070.name: "Hành Tinh Bị Hủy Diệt"
 astral_planes.6070.desc.common_1: "Những vụ nổ dây chuyền trên [from.GetName] đã vượt quá điểm tới hạn."
 astral_planes.6070.desc.common_2: "Chúng ta đưa ra giả thuyết rằng khe nứt này được hình thành do một vụ nổ tạo ra điểm kỳ dị cực kỳ mạnh mẽ từ một trong những vũ khí được lưu trữ trong kho."
 astral_planes.6070.desc.no_rift: "$astral_planes.6070.desc.common_1$\n\nVụ nổ xảy ra mạnh đến mức không chỉ phá hủy hoàn toàn hành tinh mà còn xé toạc một lỗ hổng trong kết cấu không-thời gian, dẫn đến sự hình thành của thứ mà chúng ta gọi là một §Y$astral_rift$§!.\n\n$astral_planes.6070.desc.common_2$"
 astral_planes.6070.desc.rift: "$astral_planes.6070.desc.common_1$\n\nVụ nổ xảy ra mạnh đến mức không chỉ phá hủy hành tinh mà còn dẫn đến sự hình thành của một §Y$astral_rift$§! mới.\n\n$astral_planes.6070.desc.common_2$"

 astral_planes.6075.name: "Thu Hồi Vũ Khí Thành Công"
 astral_planes.6075.desc: "Chúng ta đã thiết lập thành công quy trình trích xuất các loại vũ khí lưu trữ bên dưới bề mặt hành tinh, vô hiệu hóa các đầu đạn còn hoạt động trước khi thu thập và phân tích chúng.\n\nViệc thành lập một thuộc địa lâu dài trên hành tinh này sẽ cho phép chúng ta tận dụng kho vũ khí còn lại một cách hiệu quả hơn nhiều."

 astral_planes.6076.name: "Phát Hiện Đạn Dược Kỳ Dị"
 astral_planes.6076.desc: "Các nhà nghiên cứu khảo sát [from.GetName] đã phát hiện một quả tên lửa tạo điểm kỳ dị bị hư hỏng bên trong kho vũ khí cổ xưa bị bỏ hoang của hành tinh. Loại vũ khí này dường như được thiết kế để tạo ra một vụ sụp đổ hấp dẫn dữ dội, có tiềm năng xé toạc chính không-thời gian.\n\nĐáng tiếc là khí tài này đã hư hại quá nặng không thể sửa chữa và vượt xa khả năng tái tạo của chúng ta. Tuy nhiên, chúng ta có thể tái sử dụng nó làm tài liệu phục vụ nghiên cứu các loại vũ khí nổ tương tự."
 astral_planes.6076.a: "Rất tốt."

 astral_planes.6080.name: "Kích Nổ Lỗi"
 astral_planes.6080.desc.common_1: "Trong khi nỗ lực thiết lập quy trình trích xuất vũ khí bị bỏ hoang trên [from.GetName], tàu [this.GetName] đã bị phá hủy bởi một khối thuốc nổ bị lỗi kỹ thuật. Toàn bộ người trên tàu đã thiệt mạng, bao gồm cả [leader.GetName].\n\nVụ nổ của con tàu đã kích hoạt thêm một phản ứng dây chuyền dữ dội trên khắp mạng lưới kho vũ khí."
 astral_planes.6080.desc.common_2: "$astral_planes.6070.desc.common_2$"
 astral_planes.6080.desc.no_rift: "$astral_planes.6070.desc.common_1$\n\nĐợt nổ dây chuyền xảy ra dữ dội đến mức không chỉ phá hủy hoàn toàn hành tinh mà còn xé toạc một lỗ hổng trong kết cấu của không-thời gian, hình thành một hiện tượng mà chúng ta gọi là §Y$astral_rift$§!.\n\n$astral_planes.6070.desc.common_2$"
 astral_planes.6080.desc.rift: "$astral_planes.6070.desc.common_1$\n\nĐợt nổ dây chuyền xảy ra dữ dội đến mức không chỉ phá hủy thế giới này mà còn dẫn tới sự hình thành của một §Y$astral_rift$§! mới.\n\n$astral_planes.6070.desc.common_2$"

 astral_planes.6085.name: "Phản Ứng Dây Chuyền"
 astral_planes.6085.desc: "Các vụ nổ tự phát của vũ khí bất ổn trên [from.GetName] đã lên đến đỉnh điểm trong một phản ứng dây chuyền khiến hành tinh vỡ vụn hoàn toàn.\n\nGiữa đống mảnh vỡ, chúng ta đã phát hiện một nồng độ đáng kể §Y$volatile_motes$§!. Tài nguyên này hẳn đã từng tạo nên một thành phần then chốt của các loại vũ khí cất giữ dưới lòng đất."

 d_weapon_extraction_facility: "Cơ Sở Trích Xuất Vũ Khí"
 d_weapon_extraction_facility_desc: "Cơ sở này xử lý các vũ khí cổ đại từ các kho dự trữ do một nền văn minh đã mất để lại."

 munitions_decommissioner: "$job_munitions_decommissioner$"
 job_munitions_decommissioner: "Chuyên Viên Tháo Dỡ Đạn Dược"
 job_munitions_decommissioner_plural: "Chuyên Viên Tháo Dỡ Đạn Dược"
 job_munitions_decommissioner_desc: "Những nhà nghiên cứu thực tế này kiểm tra và đảo ngược kỹ thuật vũ khí cổ đại để phù hợp với các thông số hiện đại của chúng ta."
 mod_job_munitions_decommissioner_add: "Công Việc $job_munitions_decommissioner$"
 job_munitions_decommissioning_unit: "Đơn Vị Tháo Dỡ Đạn Dược"
 job_munitions_decommissioning_unit_plural: "Đơn Vị Tháo Dỡ Đạn Dược"
 job_munitions_decommissioning_unit_desc: "Các đơn vị chuyên trách việc tháo dỡ và phân tích vũ khí cổ đại."
 mod_job_munitions_decommissioning_unit_add: "Công Việc $job_munitions_decommissioning_unit$"
 job_munitions_decommissioning_drone: "Cá Thể Tháo Dỡ Đạn Dược"
 job_munitions_decommissioning_drone_plural: "Cá Thể Tháo Dỡ Đạn Dược"
 job_munitions_decommissioning_drone_desc: "Những cá thể này tháo dỡ hiệu quả các vũ khí cổ đại để phù hợp với các thông số hiện đại của chúng ta."
 mod_job_munitions_decommissioning_drone_add: "Công Việc $job_munitions_decommissioning_drone$"

 astral_researcher: "$job_astral_researcher$"
 job_astral_researcher: "Nhà Nghiên Cứu Tinh Giới"
