 astral_rift: "$ASTRAL_RIFT$"
 MESSAGE_ASTRAL_RIFT_DISCOVERED_TITLE: "Phát hiện Khe Nứt Tinh Giới"
 MESSAGE_ASTRAL_RIFT_DISCOVERED_DESC: "Một Khe Nứt Tinh Giới mới đã sẵn sàng để thám hiểm."
 MESSAGE_ASTRAL_RIFT_STARTED_TITLE: "Đang Thám Hiểm Khe Nứt Tinh Giới"
 MESSAGE_ASTRAL_RIFT_STARTED_DESC: "Tàu khoa học của chúng ta đã neo vào một Khe Nứt Tinh Giới. Tàu và phi hành đoàn sẽ không thể nhận nhiệm vụ khác cho đến khi việc thám hiểm hoàn tất."
 ASTRAL_RIFT_REWARDS: "Phần Thưởng:"

 alert_mia_phase_out_fleet_title: "Hạm Đội Đã Chuyển Pha"
 alert_mia_phase_out_fleet_instant: "Hạm đội của bạn đã Chuyển Pha khỏi mặt phẳng tồn tại này. Nếu (và khi) trở về, rất có thể họ sẽ xuất hiện tại vị trí trước đây."

 alert_astral_rift_event_title: "Chờ Phản Hồi Sự Kiện Khe Nứt Tinh Giới"
 alert_astral_rift_event_instant: "Đã xảy ra sự cố tại một trong những Khe Nứt Tinh Giới mà chúng ta hiện đang thám hiểm."
 ALERT_ASTRAL_RIFT_EVENT_DETAIL: "$FLEET_NAME|Y$ tại $SYSTEM_NAME|Y$."

 RIFT_DIFFICULTY_TYPE: "Độ Khó"
 RIFT_DIFFICULTY_TYPE_DESC: "Mỗi chương trong một Khe Nứt Tinh Giới có thể có giá trị độ khó khác nhau.\nChương $RIFT_DIFFICULTY_EASY$ là 0-2, $RIFT_DIFFICULTY_NORMAL$ là 3-5, và $RIFT_DIFFICULTY_HARD$ là 6 trở lên. Độ khó cao hơn có thể làm giảm khả năng đạt kết quả thành công ở cuối mỗi giai đoạn thám hiểm."
 RIFT_DIFFICULTY_TYPE_TT: "§H$RIFT_DIFFICULTY_TYPE$§!\n$VALUE$\n\n$RIFT_DIFFICULTY_TYPE_DESC$"
 RIFT_DIFFICULTY_EASY: "§GDễ§!"
 RIFT_DIFFICULTY_NORMAL: "§YTrung Bình§!"
 RIFT_DIFFICULTY_HARD: "§RKhó§!"
 RIFT_LEADER_BONUS: "Thưởng Kỹ Năng"
 RIFT_LEADER_BONUS_DESC: "Điểm thưởng kỹ năng sẽ làm tăng khả năng đạt kết quả thành công ở cuối mỗi giai đoạn thám hiểm.\n\nĐiểm thưởng này làm tăng §YCơ Hội Đột Phá§!."
 RIFT_LEADER_BONUS_TT: "§H$RIFT_LEADER_BONUS$§!\n$RIFT_LEADER_BONUS_DESC$"
 EXPLORATION_PROGRESS_TOOLTIP: "§HGiai Đoạn Thám Hiểm§!\nCác Khe Nứt Tinh Giới được thám hiểm theo từng giai đoạn, vào cuối mỗi giai đoạn sẽ tiến hành đổ xúc xắc tiến độ.\n\nGiai đoạn tiếp theo kết thúc sau £time£ $DAYS|Y$"
 RIFT_GO_TO: "§HĐi Tới§!\n§GNhấn để nhanh chóng di chuyển camera tới vị trí của khe nứt này§!"
 RIFT_CLUES: "Manh Mối"
 RIFT_CLUES_DESC: "Manh mối đại diện cho thông tin được khám phá trong mỗi giai đoạn thám hiểm Khe Nứt Tinh Giới.\n\nManh mối giúp tăng §YCơ Hội Đột Phá§!."
 RIFT_CLUES_TT: "§H$RIFT_CLUES$§!\n$RIFT_CLUES_DESC$"
 ASTRAL_RIFT_EXPLORATION_LOG: "Nhật Ký Thám Hiểm"
 ASTRAL_RIFT_EXPLORATION_LOG_TT: "§H$ASTRAL_RIFT_EXPLORATION_LOG$§!\n$ASTRAL_RIFT_EXPLORATION_LOG$ hiển thị kết quả của giai đoạn thám hiểm vừa qua."
 EXPLORATION_LOG_ROLL_TOOLTIP: "§HKết Quả Giai Đoạn§!\nManh Mối Thu Được: $GAINED|Y$\n\nKết Quả: $RESULT|Y$\n  Đổ Xúc Xắc: $ROLL|Y$\n  Manh Mối: $CLUES|Y$\n  Thưởng Kỹ Năng: $BONUS|Y$\n  Độ Khó: $DIFFICULTY|R$\n\n§EKết Cục Đổ Xúc Xắc:§!\n§RThất Bại§!: Kết quả từ §Y4§! trở xuống nhận thêm §Y0§! manh mối.\n§YTiến Triển§!: Kết quả từ §Y5-9§! nhận thêm §Y1§! manh mối.\n§GTiến Triển Vượt Bậc§!: Kết quả từ §Y10-13§! nhận thêm §Y2§! manh mối."
 ASTRAL_RIFT_BREAKTHROUGH: "Cơ Hội Đột Phá"
 astral_rift_roll_header: "§H$ASTRAL_RIFT_BREAKTHROUGH$§!\nGiá trị này phản ánh cơ hội Nhà Khoa Học của bạn tạo ra đột phá trong quá trình thám hiểm khe nứt hiện tại.\n\nMỗi khi một giai đoạn kết thúc, một viên xúc xắc (§Y1§! đến §Y10§!) sẽ được đổ. Kết quả xúc xắc được cộng với §YThưởng Kỹ Năng§! và §YManh Mối§!, sau đó trừ đi §YĐộ Khó§!.\n\nĐiểm số hiện tại trước khi đổ xúc xắc là $SCORE|0Y$.\n\n§EKết Cục Đổ Xúc Xắc:§!"

