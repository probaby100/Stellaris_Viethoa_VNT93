 situation_crystal_sphere_desc: "Một vật thể bí ẩn đã xuất hiện. Chúng ta tin rằng các cuộc thám hiểm vào khe nứt không-thời gian đã thu hút sự chú ý của một ai đó, hoặc một thứ gì đó."
