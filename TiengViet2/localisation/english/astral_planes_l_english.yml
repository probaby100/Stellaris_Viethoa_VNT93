 ASTRAL_RIFT_DESCRIPTION: "Một vết rách trong không gian và thời gian. Chúng ta vẫn chưa rõ điều gì đang nằm ở bờ bên kia."
 CRYSTAL_RIFT_DESCRIPTION: "Một vết rách dị thường trong không gian và thời gian. Có thể nhìn thấy những tinh thể kỳ lạ trôi nổi bên trong khe nứt."
