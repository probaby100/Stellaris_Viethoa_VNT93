 NAME_Astral_Scar: "$pc_astral_scar$"
 pc_astral_scar: "Vết Sẹo Tinh Giới"
 pc_astral_scar_desc: "Đây là một nếp gấp dị thường trong không-thời gian. Vật chất kỳ lạ đang rò rỉ ra từ các mép viền của nó, nhưng chúng ta chưa thể thâm nhập sâu hơn."
 MESSAGE_ASTRAL_SCAR_DISCOVERED_TITLE: "Phát hiện Vết Sẹo Tinh Giới"
 MESSAGE_ASTRAL_SCAR_DISCOVERED_DESC: "Chúng ta đã phát hiện một Vết Sẹo Tinh Giới."

