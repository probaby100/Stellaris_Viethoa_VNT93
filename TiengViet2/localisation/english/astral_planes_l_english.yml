 astral_planes.100.name: "$situation_a_rift_in_space$"
 astral_planes.100.desc.split: "Vết sẹo chiều không gian trong hệ sao [From.solar_system.GetName] đã mất ổn định, mở ra một khe nứt dẫn tới một thời không khác.\n\nChúng ta nên tiếp cận một cách cẩn trọng."
 astral_planes.100.desc.default: "Chúng ta đã phát hiện một khe nứt phi thường trong không gian và thời gian tại hệ sao [from.solar_system.GetName]. Có lẽ nếu dành thời gian nghiên cứu các đặc tính của nó, chúng ta có thể tìm ra phương thức thám hiểm sâu hơn."
 astral_planes.100.a: "Thật khó tin."
 astral_planes.101.name: "Chạm Vào Khe Nứt"
 astral_planes.101.desc: "Nhân dân chúng ta cuối cùng đã vươn đủ xa để chạm tới vết sẹo trên bầu trời của chúng ta.\n\nCó lẽ nếu dành thời gian nghiên cứu các đặc tính của nó, chúng ta có thể tìm ra phương thức thám hiểm sâu hơn. Chúng ta không có cách nào biết được điều gì đang chờ đợi ở phía bên kia."
 astral_planes.101.a: "Chúng ta đã làm được điều mà tổ tiên không thể."
 astral_planes.110.name: "Hành Động Tinh Giới"
 astral_planes.110.desc: "Chúng ta đã giải mã được những bí mật đằng sau việc thu thập và chứa đựng những sợi vật chất tinh giới đầy biến động, thứ tạo nên chính ranh giới của vũ trụ này.\n\nTài nguyên quý giá và hiếm hoi này có thể được ứng dụng theo nhiều phương thức khác nhau, mang lại lợi ích to lớn cho chúng ta."
 astral_planes.120.name: "$situation_a_rift_in_space$"
 astral_planes.120.desc: "Chúng ta đã mất quyền kiểm soát hệ sao [FromFrom.GetName], và cùng với đó là khe nứt không-thời gian nằm bên trong.\n\nNhững nỗ lực vươn ra xa hơn của chúng ta tạm thời phải hủy bỏ."

 approach_situation_speed_tooltip: "\nPhương Pháp Tiếp Cận này sẽ đẩy nhanh tiến độ nghiên cứu của chúng ta một cách đáng kể."

 situation_a_rift_in_space: "Một Khe Nứt Trong Không Gian"
 situation_a_rift_in_space_riftworld: "Chạm Vào Khe Nứt"
 situation_a_rift_in_space_type: "$situation_a_rift_in_space$"
 situation_a_rift_in_space_riftworld_type: "$situation_a_rift_in_space_riftworld$"
 situation_a_rift_in_space_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_a_rift_in_space_desc: "Chúng ta đã phát hiện một khe nứt phi thường trong không gian và thời gian. Có lẽ nếu dành thời gian nghiên cứu các đặc tính của nó, chúng ta có thể tìm ra phương thức thám hiểm sâu hơn. Chúng ta không có cách nào biết được điều gì có thể nằm ở phía bên kia."
 situation_a_rift_in_space_desc_riftworld_origin: "Nhân dân chúng ta cuối cùng đã vươn đủ xa để chạm tới vết sẹo trên bầu trời của chúng ta.\n\nCó lẽ nếu dành thời gian nghiên cứu các đặc tính của nó, chúng ta có thể tìm ra phương thức thám hiểm sâu hơn. Chúng ta không có cách nào biết được điều gì có thể nằm ở phía bên kia."
 situation_a_rift_in_space_standard: "Quan Sát Bị Động"
 approach_situation_a_rift_in_space_standard_tt: "Chúng ta chưa ở vào vị thế có thể chi dùng những tài nguyên quý giá đến vậy. Hãy quan sát hiện tượng này từ xa."
 situation_a_rift_in_space_devote_research: "Dồn Sức Nghiên Cứu"
 approach_situation_a_rift_in_space_devote_research_tt: "Chúng ta có thể dành một lượng lớn nỗ lực nghiên cứu của các nhà khoa học để giải mã bí mật của khe nứt không-thời gian này."
 situation_a_rift_in_space_send_probes: "Phóng Đầu Dò"
 approach_situation_a_rift_in_space_send_probes_tt: "Mỗi đầu dò gửi vào khe nứt đều giúp chúng ta hiểu rõ hơn cách thâm nhập vào ranh giới của nó. Chúng ta có thể dành một lượng sản lượng Hợp Kim nhất định cho mục đích này."
 situation_a_rift_in_space_finisher_effect: "Mở khóa công nghệ §Y$tech_rift_sphere$§!."
 NAME_Astral_Entity: "Thực Thể Tinh Giới"
 NAME_Planet_Rift_In_Space: "Hành Tinh Tinh Giới"

 astral_rift_discovery_event_title: "Không-Thời Gian Bất Ổn"
 astral_rift_discovery_event_text: "Trong khi nghiên cứu Khe Nứt Tinh Giới tại §Y[target.solar_system.GetName]§!, chúng ta đã vô tình làm mất ổn định dị thường không gian này. Điều này đang gây ra những biến dạng dữ dội trong không gian và thời gian, bẻ cong thực tại lân cận theo cách không thể dự đoán trước."
 astral_situation.55.name: "$astral_rift_discovery_event_title$"
 astral_situation.55.desc: "$astral_rift_discovery_event_text$\n\nMột hành tinh bí ẩn mà chúng ta gọi là §Y[planet_rift_in_space.GetName]§! đã xuất hiện tại nơi trước đây hoàn toàn trống rỗng. Chúng ta không có bất kỳ ghi chép nào về sự tồn tại trước đó của nó trên bất kỳ hải đồ sao nào.\n\nNó là nơi sinh sống của một nền văn minh [GetPreFTLLower].\n\nPhán đoán hợp lý nhất của chúng ta là bằng cách nào đó nó đã trôi dạt tới từ bên ngoài vũ trụ của chúng ta."
 astral_situation.60.name: "$astral_rift_discovery_event_title$"
 astral_situation.60.desc: "$astral_rift_discovery_event_text$\n\nMột chủng tộc có tri giác mới đã vật chất hóa trên §Y[rift_temporary_species_planet.GetName]§!, phân bố đồng đều giữa dân cư hiện tại của chúng ta.\n\nLoài [rift_temporary_species.GetName] không có ký ức gì về nơi xuất thân của họ và dường như không hề thù địch.\n\nDù họ bắt nguồn từ đâu, khó lòng có khả năng chúng ta có thể giúp họ trở về."
 astral_situation.65.name: "$astral_rift_discovery_event_title$"
 astral_situation.65.desc: "$astral_rift_discovery_event_text$\n\nNhững biến dạng thời gian đáng kể trên §Y[rift_temporary_planet.GetName]§! đang khiến thời gian trôi nhanh gấp đôi. Chúng ta cần theo dõi chặt chẽ tình hình, và đảm bảo nhân đôi lượng hàng tiếp tế cho họ."

 rift_in_space_time_acceleration_modifier: "Thời Gian Biến Dạng"
 rift_in_space_time_acceleration_modifier_desc: "Thời gian trôi nhanh gấp đôi trên thế giới này."

 astral_situation.20.name: "Ma Sát Là Vấn Đề"
 astral_situation.20.desc: "Chúng ta phát hiện ra rằng muốn luồn qua các nếp gấp của không-thời gian đòi hỏi một con tàu hoàn hảo không tì vết.\n\nChúng ta tin chắc rằng mình có thể phát triển một thiết bị như vậy, thứ mà chúng ta tạm gọi là \"§Y$tech_rift_sphere$§!\", nếu dành đủ nguồn lực nghiên cứu và thời gian. Khi đó, cuối cùng chúng ta có thể khám phá những gì ẩn sau dị thường không gian này."

 astral_planes.2005.name: "Công Nghệ $tech_rift_sphere$ Đã Được Khai Phá"
 astral_planes.2005.desc: "Chúng ta đã phát triển thành công công nghệ cho phép luồn qua các nếp gấp của một Khe Nứt Tinh Giới: §Y$tech_rift_sphere_plural$§!.\n\nĐược chế tạo từ vật liệu nano siêu tiên tiến với bề mặt hoàn toàn nhẵn bóng, Khối Cầu có khả năng lướt đi không ma sát qua các vùng không-thời gian hỗn loạn.\n\nVì không rõ mình sẽ đến nơi nào, mỗi §Y$tech_rift_sphere$§! đều được nối với một dây cáp neo giữ. Để kéo chúng ta trở lại trong trường hợp khẩn cấp, sợi cáp được neo chặt vào một Tàu Khoa Học trong vũ trụ của chúng ta."
 astral_planes.2005.a: "Hãy xem chúng ta có thể tìm thấy gì..."

 ASTRAL_RIFT_IN_SYSTEM: "Hệ sao này chứa ít nhất một Khe Nứt Tinh Giới"
 CRYSTAL_RIFT_IN_SYSTEM: "Hệ sao này chứa một §YKhe Nứt Tinh Thể§! độc nhất và dị thường."

 tech_rift_sphere: "Khối Cầu Khe Nứt"
 tech_rift_sphere_plural: "Khối Cầu Khe Nứt"
 tech_rift_sphere_desc: "Dường như không gian và thời gian có xu hướng tụ lại thành từng lớp xếp chồng lên nhau. Bí quyết là làm sao luồn lách được giữa các nếp gấp đó."

 tech_astral_harvesting: "Khai Thác Tinh Giới"
 tech_astral_harvesting_desc: "Việc thu hoạch kết cấu tinh giới bị xé rách dọc theo các vết sẹo khe nứt không-thời gian trở nên khả thi nhờ những cải tiến tinh vi cho các trạm nghiên cứu của chúng ta."

 ASTRAL_RIFT_NOT_EXPLORABLE_EXPLANATION: "Chúng ta thiếu công nghệ cần thiết\nđể thám hiểm dị thường này."
 ASTRAL_RIFT_NOT_EXPLORABLE_STAGE_SUBTITLE: "Chúng ta thiếu công nghệ cần thiết để thám hiểm dị thường này."

 MESSAGE_ASTRAL_RIFT_FINISHED_TITLE: "Đã Thám Hiểm Khe Nứt Tinh Giới"
 MESSAGE_ASTRAL_RIFT_FINISHED_DESC: "Một Khe Nứt Tinh Giới đã được thám hiểm toàn diện"

 ASTRAL_RIFT_IS_EXPLORED: "Đã thám hiểm Khe Nứt $RIFT|Y$"
 ASTRAL_RIFT_IS_NOT_EXPLORED: "CHƯA thám hiểm Khe Nứt $RIFT|Y$"

