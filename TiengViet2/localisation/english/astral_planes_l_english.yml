 leader_trait_rift_warped: "Biến Dạng Khe Nứt"
 leader_trait_rift_warped_desc: "Nhà lãnh đạo này từng băng qua các mặt phẳng tinh giới; hậu quả của chuyến du hành ấy vừa sâu sắc lại vừa trường tồn."
 leader_trait_partially_digested: "Bị Tiêu Hóa Một Phần"
 leader_trait_partially_digested_desc: "Nhà lãnh đạo này từng có cuộc chạm trán xui xẻo với một con giun khổng lồ từ chiều không gian khác. Dù thân thể không còn vẹn nguyên, họ lại thu nhận được những hiểu biết độc nhất vô nhị về Sinh Học phân tử."
 leader_trait_planar_theorist: "Nhà Lý Thuyết Thứ Nguyên"
 leader_trait_planar_theorist_desc: "Nhà lãnh đạo này chuyên sâu vào nghiên cứu các Khe Nứt Tinh Giới và quy luật của các chiều không gian bên ngoài thực tại của chúng ta."

 leader_trait_spacebender: "Kẻ Uốn Bẻ Không Gian"
 leader_trait_spacebender_desc: "Hòa nhịp sâu sắc với những khoảng cách giữa các chiều không gian, nhà lãnh đạo này có khả năng lướt đi nhẹ nhàng giữa các ngân hà."
 leader_trait_spacebender_effect: "$THIS_LEADER_TXT$:\n$t$Không tiêu tốn phí duy trì"
 leader_trait_energy_weapon_specialist: "Chuyên Gia Vũ Khí Năng Lượng"
 leader_trait_energy_weapon_specialist_desc: "Những tính toán và sự hội tụ chính xác cần có để hiệu chỉnh vũ khí năng lượng đúng chuẩn có thể ngốn cực nhiều thời gian, nhưng các kỹ năng đó lại đến với vị chỉ huy này một cách hết sức tự nhiên."

 trait_plasmic: "Thể Plasma"
 trait_plasmic_desc: "Lớp màng ngoài và cơ thể vô định hình của loài này cho phép chúng thích nghi với mọi môi trường và giúp chúng miễn nhiễm với rất nhiều loại bệnh tật."

 trait_exd: "Ngoại Chiều Không Gian"
 trait_exd_desc: "Loài này có nguồn gốc từ một chiều không gian khác và cần một lượng năng lượng khổng lồ để tồn tại trong vũ trụ của chúng ta."
 TRAIT_EXD_EFFECT: "- Phí duy trì $energy_with_icon$ cho mỗi $pop_group_unit$ £pop£ Dân số: §R+$@living_standard_energy_normal|*0$§!\n$t$- Mỗi $pop_group_unit$ £pop£ §HDân số§! làm việc ở mức nô lệ hoặc cao hơn sẽ tạo ra 0.5 £physics_research£ §YNghiên Cứu Vật Lý§! mỗi tháng"

 ######################
 # Origin - Riftworld #
 ######################

 origin_riftworld: "Thế Giới Dưới Khe Nứt"
 origin_riftworld_desc: "Một khe nứt khổng lồ trong không-thời gian lơ lửng gần quê nhà của nền văn minh này. Sau khi nghiên cứu hiện tượng này suốt hàng thiên niên kỷ, những bước tiến gần đây trong công nghệ tàu vũ trụ cuối cùng sẽ cho phép họ vươn ra và khám phá những bí mật ẩn chứa bên trong."
 origin_tooltip_riftworld_effects: "- $HOMEWORLD$ ['concept_riftworld_digsite'] ['concept_archaeology_site']$NEW_LINE$- Các Hành Tinh Đã Thuộc Địa Hóa trong hệ sao có [ 'concept_astral_rift',$ASTRAL_RIFTS$]: ['modifier:riftworld_affinity']$NEW_LINE$- Xác suất xuất hiện §Y$ASTRAL_RIFTS$§! trong các hệ sao bạn kiểm soát: §G+100%§!\n- $science_plural$ có thể thám hiểm §Y$ASTRAL_RIFTS$§! trong §YHệ Sao Chưa Thuộc Sở Hữu§!."
 START_SCREEN_RIFTWORLD: "Từ khi chúng ta có thể nhớ được, Đại Khe Nứt đã luôn sừng sững trên bầu trời [GetHomeWorldName]. Truyền thuyết kể rằng quá khứ của chúng ta gắn bó mật thiết với vết sẹo thiên giới bí ẩn này và một miệng hố va chạm cổ xưa gần thủ đô.\n\nSuốt nhiều thế hệ, di chỉ đó được tôn kính nhưng ít ai hiểu thấu. Tuy nhiên, hoạt động địa chấn gần đây đã phát hiện ra các dị thường dưới lòng đất của miệng hố. Công tác chuẩn bị khoan sâu vào lõi của nó đã được tiến hành. Ý kiến vẫn còn phân tán về những gì chúng ta có thể khám phá ở đó.$START_SCREEN_RIFTWORLD_END$"
 START_SCREEN_RIFTWORLD_MACHINE: "Kể từ mốc thời gian xa nhất mà cơ sở dữ liệu của chúng ta ghi nhận, Đại Khe Nứt đã luôn ngự trị trên bầu trời [GetHomeWorldName]. Đồng hồ nội bộ của chúng ta được đồng bộ với tần số của vết sẹo thiên giới này và các ghi chép sớm nhất mô tả một điểm va chạm cổ đại gần trung tâm đầu não.\n\nQua nhiều chu kỳ lặp lại, di chỉ đó được giữ nguyên nhưng ít được hiểu thấu. Tuy nhiên, chấn động địa chấn gần đây đã để lộ ra các dị thường dưới bề mặt miệng hố. Công tác chuẩn bị khoan vào lõi của nó đang được tiến hành.$START_SCREEN_RIFTWORLD_END$"
 START_SCREEN_RIFTWORLD_END: "\n\nLiệu có phải là sự trùng hợp ngẫu nhiên khi điều này diễn ra đúng vào thời điểm công nghệ Động Cơ Siêu Không Gian xuất hiện? Ngay khi chúng ta vươn tay tới bầu trời, sự chú ý lại bị kéo ngược về mặt đất. Có lẽ những gì nằm dưới bề mặt thế giới này được định mệnh an bài để hỗ trợ chúng ta trên con đường chinh phục các vì sao. Có lẽ nó có thể giúp chúng ta chuẩn bị cho bất cứ điều gì đang chờ đón phía bên kia Khe Nứt."
 START_SCREEN_RIFTWORLD_NOMADS: "Kể từ khi chúng ta có thể ghi nhớ, Đại Khe Nứt đã luôn treo lơ lửng trước mắt chúng ta giữa khoảng không vũ trụ — một sự hiện diện bất biến nơi đường chân trời trong cuộc hành trình, vừa quen thuộc lại vừa bí ẩn khôn cùng. Truyền thuyết kể rằng quá khứ xa xưa của chúng ta gắn liền với vết sẹo thiên giới này, và một điểm va chạm cổ đại bị chôn vùi sâu bên trong thân tàu phương chu.\n\nSuốt bao thế hệ, địa điểm đó được tôn kính nhưng hiếm ai thấu tỏ. Tuy nhiên, những dao động gần đây trong hệ thống lõi tàu phương chu đã thu hút sự chú ý tới các khoang bị niêm phong từ lâu gần điểm va chạm. Công tác chuẩn bị phá niêm phong đang được triển khai. Dư luận vẫn còn nhiều bất đồng về những gì chúng ta có thể tìm thấy tại đó.\n\nLiệu có phải sự trùng hợp thuần túy khi điều này xảy ra cùng lúc với sự ra đời của công nghệ Động Cơ Siêu Không Gian? Ngay khi chúng ta hướng tầm mắt tới các vì sao, sự chú ý lại bị kéo giật về con tàu của chính mình. Có lẽ những gì đang bị phong ấn trong tàu phương chu vốn mang sứ mệnh nâng bước chúng ta trên chuyến hải trình. Có lẽ nó có thể trang bị cho chúng ta sẵn sàng đối mặt với bất cứ điều gì ở phía bên kia Khe Nứt."

 riftworld_affinity: "Gắn Kết Khe Nứt"
 riftworld_affinity_desc: "Sự phát triển xã hội của chúng ta dưới ảnh hưởng của các lực lượng xuyên chiều không gian đã khơi dậy niềm đam mê cháy bỏng đối với công cuộc nghiên cứu sâu rộng hơn."

 astral_planes.2105.name: "Tín Hiệu Kỳ Lạ"
 astral_planes.2105.desc: "Sau khi kết thúc chuyến thám hiểm Khe Nứt Tinh Giới tại §H[From.solar_system.GetName]§!, chúng ta đã nhận được một tín hiệu bí ẩn.\n\nCác [GetScientistPlural] của chúng ta xác định nguồn gốc của nó xuất phát từ bờ bên kia của chính khe nứt, và họ mới chỉ có thể dịch được vài từ ngắn ngủi."

 astral_planes.2110.name: "$astral_planes.2105.name$"
 astral_planes.2110.desc: "...hòa nhịp... với các mặt phẳng... chúng ta sẽ tìm thấy bạn..."

 astral_planes.2120.name: "Phát Hiện Dị Thường Địa Chấn"
 astral_planes.2120.desc: "Hoạt động địa chấn gần đây đã để lộ ra những đặc điểm bất ngờ của địa điểm va chạm cổ xưa gần thủ đô của chúng ta.\n\nMiệng hố va chạm đặc biệt này từ lâu đã được gắn liền với chính nguồn gốc của giống loài [Owner.GetSpeciesNamePlural] chúng ta."

 riftworld_digsite: "Miệng Hố Cổ Đại"
 riftworld_digsite_desc: "Chúng ta đã phát hiện hoạt động địa chấn dị thường từ sâu bên trong một miệng hố cổ đại trên bề mặt của [Planet.GetName]. Sóng âm ngầm dưới lòng đất đã tiết lộ một khoang rỗng chưa từng được biết đến trước đây."
 astral_planes.2125.name: "Va Chạm Tốc Độ Cao"
 astral_planes.2125.desc: "Những cuộc khai quật ban đầu dưới đáy miệng hố đã làm lộ ra một khối đá va chạm hình trụ hoàn chỉnh găm sâu vào lòng đất.\n\nMạch đá này hẳn phải bắt nguồn từ một vụ va chạm thiên thạch ở vận tốc cực kỳ khủng khiếp. Các tính toán sơ bộ cho thấy vật thể này hẳn đã lao tới với một phần đáng kể vận tốc ánh sáng. Thật kỳ diệu là nó vẫn còn tồn tại khi chạm tới bề mặt."
 astral_planes.2125.a: "Tiếp tục khai quật."
 astral_planes.2130.name: "Các Hang Động Ngầm"
 astral_planes.2130.desc: "Tại điểm tận cùng của mạch đá va chạm, chúng ta đã khám phá ra một hệ thống hang động ngầm rộng lớn.\n\nNhững hồ nước ngầm nuôi dưỡng các dải thực vật nhợt nhạt mong manh dọc theo vách hang. Dưới đáy một trong những hồ nước này là tàn tích của một vật thể hình cầu dị thường. Nó không phải là một kiến tạo tự nhiên, và dường như chính là nguồn gốc của địa điểm va chạm này."
 astral_planes.2130.a: "Thu hồi vật thể."
 astral_planes.2135.name: "Khối Cầu Cổ Đại"
 astral_planes.2135.desc: "Chúng ta đã trục vớt được khối cầu từ hồ nước ngầm.\n\nDù bị thảm thực vật bao phủ, phần lớn cấu trúc của nó vẫn còn nguyên vẹn. Kết cấu của nó là một sự pha trộn kỳ lạ giữa thiết kế cực kỳ tinh xảo và phương thức lắp ráp thô sơ. Những tấm kim loại nhẵn bóng hoàn hảo bao phủ phần mũi tàu, điều hẳn đã giúp giảm ma sát đáng kể khi đi vào khí quyển.\n\nQuỹ đạo nơi nó an nghỉ hoàn toàn trùng khớp với mạch đá va chạm, xác nhận rằng khối cầu này chính là nguồn gốc của khối đá biến chất đã dẫn đường cho chúng ta tới đây. Đáng kinh ngạc hơn nữa, có những dấu hiệu cho thấy con tàu này từng chở theo hành khách."
 astral_planes.2140.name: "Tổ Tiên"
 astral_planes.2140.desc.common: "Chúng ta đã thu hồi được một kho tài liệu bên trong khối cầu cổ đại, mỗi tài liệu đều được viết bằng một dạng cổ ngữ của chính ngôn ngữ chúng ta. Vài tài liệu trong số này nhắc đến những cái tên gắn liền với các truyền thuyết thiêng liêng nhất của chúng ta.\n\nMột mạng lưới thang phức tạp uốn lượn từ địa điểm va chạm dẫn lên một hệ thống đường hầm khổng lồ. Dựa vào niên đại khác nhau của các sợi thừng, các hang động này hẳn đã từng có người sinh sống qua nhiều thế hệ khi những người sống sót sau vụ rơi tàu nỗ lực mở đường lên bề mặt.\n\nTuy nhiên, không có gì chúng ta phát hiện trước đó có thể chuẩn bị cho phát hiện chấn động cuối cùng: một trong những gian phòng phía trên chứa một khu mộ địa. Phân tích ADN tiến hành trên những hài cốt bên trong đã tiết lộ một sự thật kinh ngạc: những người này chính là tổ tiên của chúng ta.\n\nChính xác họ đến từ đâu, hay vì sao địa điểm này lại bị quên lãng, hiện vẫn chưa rõ. Các tài liệu thu thập được ở trong tình trạng bảo quản kém, nhưng chúng ta đã khôi phục được một nhật ký dữ liệu từ khối cầu. Nó chỉ ra rõ ràng rằng con tàu đã đến hệ sao của chúng ta thông qua Khe Nứt Tinh Giới gần [from.planet.GetName]."
 astral_planes.2140.desc.has_rift_sphere: "$astral_planes.2140.desc.common$\n\nDù rõ ràng kém tân tiến hơn công nghệ hiện tại của chúng ta, khối cầu này là minh chứng cho sự tuyệt vọng và trí tuệ sáng tạo của những người kiến tạo nên nó. Đây là một nỗ lực cuối cùng nhằm trốn chạy khỏi điều ắt hẳn là một số phận kinh hoàng ở phía bên kia khe nứt."
 astral_planes.2140.desc.default: "$astral_planes.2140.desc.common$\n\nVới một chút nghiên cứu, chúng ta sẽ có thể tái tạo và thậm chí cải tiến công nghệ cần thiết để chế tạo một con tàu sở hữu năng lực vượt không gian như thế này."
 astral_planes.2140.desc.machine.common: "Chúng ta đã khôi phục được một kho dữ liệu từ bên trong khối cầu cổ đại, kho dữ liệu được mã hóa bằng một phiên bản sơ khai của hệ thống tệp của chính chúng ta.\n\nMột mạng lưới thang phức tạp uốn lượn từ địa điểm va chạm dẫn lên một hệ thống đường hầm khổng lồ. Dựa trên niên đại khác nhau của các sợi thừng, các hang động này hẳn đã từng có người cư trú qua nhiều chu kỳ khi những cá thể sống sót tìm cách mở đường lên bề mặt.\n\nMột trong những vị trí phía trên chứa các linh kiện gợi nhớ đến những mẫu hình sơ khởi nhất của chúng ta. Những cá thể sống sót này chính là tiền bối của chúng ta.\n\nChính xác họ đến từ đâu, hay vì sao vị trí này bị thất lạc, hiện vẫn chưa rõ. Dữ liệu trích xuất từ khối cầu cho thấy rõ ràng con tàu đã đến hệ sao của chúng ta thông qua Khe Nứt Tinh Giới gần [from.planet.GetName]."
 astral_planes.2140.desc.machine.has_rift_sphere: "$astral_planes.2140.desc.machine.common$\n\nDù kém tân tiến hơn công nghệ hiện tại của chúng ta, khối cầu này là minh chứng cho nỗ lực vượt bậc của các đơn vị tiền bối. Đây là một cố gắng sau cùng nhằm trốn thoát khỏi hiểm họa kinh hoàng ở phía bên kia khe nứt."
 astral_planes.2140.desc.machine: "$astral_planes.2140.desc.machine.common$\n\nThông qua nghiên cứu, chúng ta sẽ có thể tái tạo và thậm chí cải tiến công nghệ cần thiết để chế tạo một con tàu sở hữu năng lực xuyên chiều không gian như thế này."
 astral_planes.2140.a: "Chúng ta đã tìm thấy nơi khởi nguồn của mình."
 astral_planes.2140.a.synthetic: "Chúng ta đã tìm thấy nơi đúc luyện ban đầu."

