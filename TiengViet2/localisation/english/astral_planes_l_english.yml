 approach_situation_study_crystal_sphere_observe_tt: "Thiết bị này dường như đang tự căn chỉnh một cách chậm rãi. Chúng ta tin rằng theo thời gian, nó sẽ hoàn thành mục đích vốn có trong thiết kế."
 situation_study_crystal_sphere_mundane: "Phương Pháp Thông Thường"
 approach_situation_study_crystal_sphere_mundane_tt: "Nếu dành đủ nỗ lực nghiên cứu khoa học để khai mở tiềm năng của thiết bị này, chúng ta tin rằng có thể đẩy nhanh tốc độ kích hoạt của nó."
 situation_study_crystal_sphere_astral: "Phương Pháp Tinh Giới"
 approach_situation_study_crystal_sphere_astral_tt: "Sợi tinh giới dường như kích thích thiết bị này. Càng để nó tiếp xúc nhiều, nó sẽ càng kích hoạt nhanh hơn."
 study_observe_method: "Thiết bị dường như đang tự căn chỉnh chậm rãi theo một phương thức có chủ đích. Chúng ta tin rằng theo thời gian, nó sẽ hoàn thành mục tiêu thiết kế ban đầu."
 study_mundane_method: "Nếu chúng ta dành đủ nghiên cứu khoa học để khai phá tiềm năng của thiết bị này, chúng ta tin rằng có thể đẩy nhanh tốc độ kích hoạt của nó."
 study_astral_method: "Sợi tinh giới dường như kích thích thiết bị. Chúng ta càng cho tiếp xúc nhiều, nó kích hoạt càng nhanh."
