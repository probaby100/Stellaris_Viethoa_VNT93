 approach_situation_the_seal_weave_astral_fabric_tt: "§G+50%§! Điểm Máu Khiên cho tất cả tàu đồng minh tại hệ sao §H$NAME_Formless_System$§!."
 situation_the_seal_pump_exotic_gases: "Bơm Khí Hiếm Ngoại Lai"
 approach_situation_the_seal_pump_exotic_gases_tt: "§G+10%§! Sát Thương Vũ Khí Năng Lượng cho tất cả tàu đồng minh tại hệ sao §H$NAME_Formless_System$§!."
 finisher_effects_the_seal: "Chúng ta không chắc kết quả sẽ ra sao nếu chọn cứu giúp các sinh mệnh này."
 the_seal_do_nothing_method: "Chúng ta sẽ để cuộc xung đột này diễn ra mà không can thiệp."
 the_seal_weave_method: "Nếu chuyển giao các sợi tinh giới thu hồi được cho các sinh mệnh này, họ có thể dùng chúng để gia cố lá chắn của mình."
 the_seal_pump_method: "Khí hiếm ngoại lai có hiệu ứng khuếch đại trong bong bóng tồn tại kỳ lạ này. Chúng ta có thể dùng nó để cường hóa hỏa lực."
 the_seal_weave_astral_fabric_modifiers: "Nếu chúng ta chuyển giao sợi tinh giới đã thu hồi cho các sinh mệnh này, họ có thể vận dụng hiểu biết sâu rộng về đặc tính của nó để tăng cường lá chắn."
 the_seal_pump_exotic_gases_modifier: "Khí hiếm ngoại lai có hiệu ứng khuếch đại trong bong bóng tồn tại kỳ lạ này. Chúng ta có thể dùng nó để cường hóa hỏa lực."
 destroy_sphere_modifier: "Hòa Bình Trong Thứ Nguyên Này"
 aberrant_fleet_spawn_countdown: "Hạm đội Kẻ Lạc Lối tiếp theo sẽ xuất hiện sau [this.days_before_spawn] ngày."

 astral_situation.1.name: "Khối Cầu Pha Lê Bị Phá Hủy"
 astral_situation.1.desc: "Mọi việc đã xong.\n\nKhối Cầu Pha Lê đã bị đập vỡ thành vô số mảnh vụn lấp lánh.\n\nChúng ta lập tức thu hoạch lượng lớn vật liệu quý giá. Các nguyên tố cơ bản của nó không giống bất cứ thứ gì chúng ta từng chạm trán trước đây.\n\nNgười dân đang ăn mừng quyết định táo bạo nhằm bảo vệ sự an nguy của quê nhà. Cho phép một thiết bị như vậy tồn tại trong biên giới quả là một sự vô trách nhiệm."

 astral_situation.5.name: "Công Tác Nghiên Cứu Kết Thúc"
 astral_situation.5.desc: "Đó là một thông điệp.\n\nĐược mã hóa bên trong một mạng lưới tinh thể bất khả thi, có một tập hợp các chỉ dẫn.\n\nLàm theo từng câu từng chữ, chúng ta đã tái tạo được những điều kiện được khắc ghi quanh khối cầu pha lê. Sự sắp xếp chuẩn xác giữa các luồng khí và sợi tinh giới đã giúp 'kích hoạt' khối cầu.\n\nNgay sau đó, nó biến mất không dấu vết. Thay vào vị trí đó, một Khe Nứt Tinh Giới chưa từng thấy ngưng tụ hiện hình.\n\nSự hiện diện của nó vẫy gọi chúng ta bước vào thám hiểm."

 astral_planes.15.name: "Khối Cầu Pha Lê"
 astral_planes.15.desc.default: "Một vật thể kỳ lạ đã xuất hiện trên quỹ đạo của [Root.Capital.GetName].\n\nVật thể hình cầu bằng tinh thể này gợi nhớ tới công nghệ §Y$tech_rift_sphere$§! của chúng ta, nó xuất hiện bất thình lình mà không có quỹ đạo bay nào được ghi nhận trước đó.\n\nDo ở quá gần [Root.Capital.GetName], khối cầu này có thể tạo ra mối đe dọa to lớn cho người dân của chúng ta.\n\nMặt khác, rất có khả năng nó ẩn chứa những hiểu biết vô giá về bản chất của du hành xuyên chiều không gian."
 astral_planes.15.desc.win: "Chúng ta đã nắm quyền kiểm soát một vật thể kỳ lạ trên quỹ đạo của [crystal_sphere_system.GetName].\n\nĐó là một vật thể hình cầu bằng tinh thể tương tự nhất với công nghệ §Y$tech_rift_sphere$§! mà chúng ta đã phát triển để thám hiểm các chiều không gian khác.\n\nNó có thể đem lại mối nguy hiểm khôn lường cho đế chế.\n\nMặt khác, chúng ta tin rằng nó có thể ẩn chứa những hiểu biết giá trị về du hành đa chiều."
 astral_planes.15.desc.win_delayed: "Dựa trên những nghiên cứu gần đây về Khe Nứt Tinh Giới, chúng ta phát hiện vật thể hình cầu bằng tinh thể tại [crystal_sphere_system.GetName] có nhiều điểm tương đồng với công nghệ §Y$tech_rift_sphere$§! mà chúng ta từng chế tạo.\n\nNó có thể đem lại mối nguy hiểm lớn chưa từng biết cho đế chế.\n\nMặt khác, chúng ta tin rằng nó có thể chứa đựng những hiểu biết giá trị về du hành đa chiều."
 astral_planes.15.a: "Nghiên cứu nó."
 astral_planes.15.b: "Phá hủy nó."

 astral_planes.30.name: "Một Khối Cầu Kỳ Lạ"
 astral_planes.30.desc: "Chúng ta đã giành quyền kiểm soát một vật thể lạ trên quỹ đạo của [crystal_sphere_system.GetName].\n\nChúng ta chưa rõ mục đích hay nguồn gốc của nó. Có lẽ với những nghiên cứu trong tương lai, chúng ta có thể hiểu được cách tiếp cận nó."
 astral_planes.30.a: "Chúng ta sẽ để mắt tới nó."

