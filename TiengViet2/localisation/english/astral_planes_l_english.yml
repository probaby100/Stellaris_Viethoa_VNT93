 ASTRAL_RIFT_LOCKED: "Đang Tiến Hành Thám Hiểm Khe Nứt"
 ASTRAL_RIFT_POOL_IS_EMPTY: "Khe Nứt Tinh Giới này dường như không dẫn tới đâu."

