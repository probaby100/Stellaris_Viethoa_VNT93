 civic_dimensional_worship: "Tín Ngưỡng Chiều Không Gian"
 civic_dimensional_worship_desc: "Xã hội này tin rằng một sự hiện diện thiêng liêng đang ngự trị vượt trên các nếp gấp của không-thời gian. Những hệ sao nơi bất ổn đạt mức cao nhất mang ý nghĩa thiêng liêng đối với họ, vừa là thánh địa hành hương vừa là địa điểm nghiên cứu."
