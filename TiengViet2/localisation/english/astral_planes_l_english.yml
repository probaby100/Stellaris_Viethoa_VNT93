 TUTORIAL_ASTRAL_ACTIONS_VIEW_TITLE: "Hướng Dẫn: Hành Động Tinh Giới"
 TUTORIAL_ASTRAL_ACTIONS_VIEW_DESC: "Giao diện Hành Động Tinh Giới cho phép chúng ta tiêu dùng $ASTRAL_THREADS_ICON$ vào nhiều hiệu ứng trên quy mô toàn đế chế. Càng khám phá nhiều §SKhe Nứt Tinh Giới§!, chúng ta càng mở khóa thêm nhiều hành động. Một số hành động có thể lặp lại theo thời gian, trong khi những hành động khác chỉ có thể sử dụng một lần duy nhất để mở khóa các năng lực hoặc công nghệ mới."

 TUTORIAL_ASTRAL_RIFT_VIEW_TITLE: "Giao Diện Khe Nứt Tinh Giới"
 TUTORIAL_ASTRAL_RIFT_VIEW_DESC: "Cửa sổ Khe Nứt Tinh Giới hiển thị thông tin chi tiết về §SKhe Nứt Tinh Giới§! hiện đang được chọn. Tại mỗi giai đoạn tiến độ, bạn có thể được nhắc đưa ra mệnh lệnh cho các Nhà Khoa Học của chúng ta, dẫn đến những kết quả khác nhau và đôi khi nằm ngoài dự liệu. Phần lớn các cuộc thám hiểm bên ngoài Khe Nứt Tinh Giới đều có nhiều ngã rẽ để đi theo.\n\nĐể giải mã bí mật của một Khe Nứt, Nhà Khoa Học phải tạo ra một §SĐột Phá§! để tiến qua từng giai đoạn của Khe Nứt. Những Nhà Khoa Học có §SĐặc Điểm phù hợp và Kỹ Năng cao hơn§! sẽ đẩy nhanh quá trình tiến tới giai đoạn tiếp theo, trong khi độ khó cao hơn của một lựa chọn đường đi sẽ làm chậm tiến độ. Bất kỳ Nhà Khoa Học nào điều tra một Khe Nứt đủ lâu đều sẽ tích lũy được các §SManh Mối§!, giúp khả năng Đột Phá dễ thành công hơn.\n\nTrong khi thám hiểm một §SKhe Nứt Tinh Giới§!, các Nhà Khoa Học được neo giữ vào một chiều không gian khác và không thể điều chuyển cho đến khi cuộc thám hiểm hoàn tất. Là một hệ quả của việc bị mắc kẹt giữa thời gian và không gian theo phương thức này, họ không thể chết vì tuổi già."

#Mercedes Romero Lives!

astral_planes.6100.name: "Người Thoát Hiểm Cuối Cùng"
astral_planes.6100.desc: "Hiện ra từ Khe Nứt Tinh Giới cùng với Khối Cầu Khe Nứt của [FromFromFrom.GetName], một cảnh tượng bất ngờ đã thu hút sự chú ý của chúng ta: một khoang thoát hiểm đang ngủ đông bám theo vệt đuôi của Khối Cầu. Chẳng bao lâu sau, chúng ta nhận được một tín hiệu cấp cứu đơn giản kèm theo đường truyền video trực tiếp."
astral_planes.6100.b: "Điều này không liên quan tới chúng ta."
astral_planes.6100.c: "Dùng nó làm mục tiêu tập bắn."

NAME_Mercedes: "Mercedes Romero"
Mercedes_DESC: "Là một cá thể sống qua trăm tuổi với niềm đam mê cháy bỏng đối với các nền văn hóa ngoài hành tinh, đặc biệt là Con Người, cá thể Blorg vui vẻ này đã dũng cảm vượt qua một Khe Nứt Tinh Giới để đến được đây. Sứ mệnh của cô: kết Bạn."
mercedes_catch_phrase: "Chúng ta có thể làm Bạn được không?"
astral_planes.6105.desc.reg: "§HNgười ngoài hành tinh với diện mạo kỳ dị đứng sững trước mặt chúng ta trong sự im lặng bàng hoàng, chuyển động duy nhất của nó là phần mũ nấm nhấp nhô theo nhịp điệu tựa sóng lượn. Bất ngờ lấy lại bình tĩnh, sinh vật vung vẩy xúc tu và tự giới thiệu:§!\n\nCái- Gì- Tôi đang ở đâu thế này? Tôi xin lỗi. Tên tôi là Mercedes Romero, nhà thám hiểm kiêm nhà ngoại giao của Khối Đại Đồng Blorg. Bạn có biết về loài Người không?"
astral_planes.6105.desc.human: "§HNgười ngoài hành tinh kỳ dị đứng trước mặt chúng ta trong sự im lặng ngỡ ngàng, chuyển động duy nhất là phần mũ nấm nhấp nhô như sóng biển. Khi nhận ra chúng ta, nó làm một động tác chồm tới trước khi kịp kiềm chế lại:§!\n\nB- B- Các bạn là Con Người ư!? §H*Hét lên phấn khích*§! T- Tôi xin lỗi, tôi đã vô cùng say mê văn hóa của các bạn kể từ khi còn là một bào tử nhỏ xíu!\n\n§HNgười ngoài hành tinh chìa một xúc tu ra trong nỗ lực vụng về nhằm bắt chước một cái bắt tay.§!\n\nTên tôi là Mercedes Romero và thật là một vinh hạnh lớn khi được diện kiến các bạn."
astral_planes.6105.a: "Bạn còn nhớ được những gì?"
astral_planes.6105.a.response: "Ký ức cuối cùng của tôi là tại Hệ sao Antares. Tôi đang tham gia vào một chiến dịch hạm đội cùng với một nhóm Bạn Bè thì bỗng thấy một luồng sáng chói lòa. Sau đó chẳng còn gì nữa. Tôi đã tới đây trong khoang thoát hiểm. Cô độc và Không Có Bạn Bè."
astral_planes.6105.b: "Tại sao bạn lại say mê Con Người đến vậy?"
astral_planes.6105.b.response: "Ồ, Con Người là những sinh vật kỳ diệu nhất. Giống loài Blorg chúng tôi đã quan sát họ suốt nhiều thế kỷ. Thật ra, phần lớn văn hóa của chúng tôi được xây dựng dựa trên những gì quan sát được từ cuộc sống Con Người. Sắc màu rực rỡ! Kịch tính! Tình Bạn! Họ dạy chúng tôi rằng cuộc sống không chỉ đơn thuần là sinh tồn. Bạn còn có thể kết Bạn nữa! Thật là một khái niệm tuyệt vời biết bao. Thật là một kỳ quan!"
astral_planes.6105.c: "Bạn có thể làm gì cho chúng ta?"
astral_planes.6105.c.response: "Một câu hỏi không Thân Thiện cho lắm, nhưng nếu cần phục vụ, tôi luôn sẵn sàng! Đương nhiên, tôi có hàng thế kỷ kinh nghiệm làm thuyền trưởng tàu nghiên cứu, nhưng niềm đam mê thực sự của tôi là quan hệ liên thiên hà. Bằng cách làm Bạn của bạn, tôi có thể giúp bạn kết thêm nhiều Bạn mới trong quá trình này. Làm ơn đi, nếu các bạn ưng thuận, hãy để tôi đại diện cho lợi ích ngoại giao của các bạn!"
astral_planes.6105.hire_custom_tooltip:0 "§Y$NAME_Mercedes$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh Đạo§!."
leader_trait_blorg_insight: "Hiểu Biết Của Loài Blorg"
leader_trait_blorg_insight_desc: "Nhiều thế kỷ nghiên cứu các chương trình phát sóng và văn hóa của một loài động vật có vú đi đứng thẳng hàng nọ đã khiến cá nhân này có thái độ sốt sắng lấy lòng người khác một cách trơ trẽn. Một số người thậm chí sẽ nói là phiền toái đến phát bực."
blorg_insight_effect: "$t$§R-25§! mức độ thiện cảm với các đế chế §YCon Người§!."
triggered_opinion_blorg_insight: "Hiểu Biết Của Loài Blorg"
