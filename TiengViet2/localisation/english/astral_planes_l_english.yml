 council_agenda_agenda_dark_matter_breakthrough_name: "Đột Phá Vật Chất Tối"
 council_agenda_agenda_dark_matter_breakthrough_desc: "Có những ứng dụng đầy uy lực mà chúng ta vẫn chưa khai phá hết trong việc thao túng Vật Chất Tối."
 council_agenda_agenda_dark_matter_breakthrough_init_effect_desc: "§RKhóa Quốc Thể §Y$civic_dark_consortium$§!, ngăn không cho cải cách Quốc Thể này.§!"
 council_agenda_agenda_dark_matter_breakthrough_effect_desc: "Mở khóa một tùy chọn nghiên cứu cho một Công Nghệ Vật Chất Tối £sr_dark_matter£ ngẫu nhiên."
