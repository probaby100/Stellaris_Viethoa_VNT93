 gov_defensive_union: "Liên Minh Phòng Thủ"
 gov_defensive_union_desc: "Chính thể này gắn kết người dân vì mục tiêu chung là phòng chống lại các mối đe dọa bên ngoài."
 RT_DEFENSIVE_UNION: "Đại Khiên Thủ"
 HT_DEFENSIVE_UNION: "Vệ Binh Tối Cao"

 Guardianship: "Hộ Vệ Lãnh"
 Protectorate: "Xứ Bảo Hộ"
 Stalwart_Legion: "Quân Đoàn Kiên Cường"

 gov_dimensional_covenant: "Giao Ước Thứ Nguyên"
 gov_dimensional_covenant_desc: "Xã hội này được nâng đỡ bởi ý thức tâm linh sâu sắc. Các chuẩn mực đạo đức nghiêm ngặt được áp dụng để đảm bảo đại đa số người dân có thể tự tin hướng về thế giới bên kia."
 RT_DIMENSIONAL_COVENANT: "Thăng Hoa Thứ Nhất"
 HT_DIMENSIONAL_COVENANT: "Thăng Hoa Thứ Hai"

 Church_of_Otherworlds: "Giáo Hội Dị Giới"
 Astral_Fellowship: "Hội Huynh Đệ Tinh Giới"
 Dimensional_Commune: "Công Xã Thứ Nguyên"

 ##########
 # Civics #
 ##########

 sm_dimensional_shrine: "Đền Thờ Thứ Nguyên"
 sm_dimensional_shrine_desc: "Bên ngoài vũ trụ đã biết tồn tại những lối đi sang các thế giới khác, và những nơi các kết nối đó được tạo dựng một cách tinh tế. Đây chính là nơi chúng ta xây dựng ngôi đền linh thiêng nhất của mình.\n"
 sm_reloading_bay: "Vịnh Tái Nạp"
 sm_reloading_bay_desc: "Dành riêng một phần đáng kể của Căn Cứ Sao cho việc tái nạp các thành phần vũ khí, đồng thời cung cấp thêm các bệ phòng thủ.\n"
 requires_dimensional_space_object: "§RYêu cầu một §Y$WORMHOLE$§!, một §Y$pc_rift_star$§!, một §Y$ASTRAL_RIFT$§!, một §Y$LGATE_GALACTIC$§! hoặc một §Y$SHROUD_TUNNEL_GALACTIC$§!§!"

 civic_hyperspace_specialty: "Chuyên Môn Siêu Không Gian"
 civic_hyperspace_specialty_desc: "Xã hội này luôn tôn sùng tốc độ. Việc thao túng siêu không gian chỉ là một đại lộ khác, và những ai có năng khiếu trong lĩnh vực này đều vươn lên tầng lớp cao nhất trong xã hội."
 civic_hyperspace_specialty_effects: "£physics£ §Y$tech_hyper_drive_2$§! là Tùy Chọn Nghiên Cứu Đảm Bảo.\nCó Thông Tin Tình Báo Thấp về tất cả các hệ sao trong phạm vi 3 Tuyến Siêu Không Gian tính từ hệ sao khởi đầu của bạn."
 civic_hive_hyperspace_specialty: "Đồng Bộ Siêu Không Gian"
 civic_hive_hyperspace_specialty_desc: "Tập thể này luôn theo đuổi tốc độ. Phương pháp luận thao túng siêu không gian được cấy ghép sâu rộng trong toàn bộ tổ hợp, tạo điều kiện cho sự hiểu biết tiến bộ về các nguyên lý căn bản của quãng đường theo thời gian."
 civic_hive_hyperspace_specialty_effects: "$civic_hyperspace_specialty_effects$"
 civic_machine_hyperspace_specialty: "Tính Toán Siêu Không Gian"
 civic_machine_hyperspace_specialty_desc: "Tập thể này luôn theo đuổi tốc độ. Các lý thuyết thao túng siêu không gian được khắc sâu vào đơn vị xử lý của từng cá thể máy, mang lại cho tập thể sự hiểu biết ngày một tiến bộ về các nguyên lý cốt lõi của khoảng cách trên trục thời gian."
 civic_machine_hyperspace_specialty_effects: "$civic_hyperspace_specialty_effects$"
 civic_corporate_hyperspace_specialty: "Thương Mại Siêu Không Gian"
 civic_corporate_hyperspace_specialty_desc: "Thời gian là tiền bạc, và Tập Đoàn Khổng Lồ này hết sức coi trọng tốc độ. Đầu tư mạnh mẽ vào R&D đã mang lại thành quả ngọt ngào, trao cho Tập Đoàn quyền tiếp cận độc quyền các kỹ thuật thao túng siêu không gian tiên tiến nhất."
