 civic_sovereign_guardianship: "Hộ Vệ Chủ Quyền"
 civic_sovereign_guardianship_desc: "Tập hợp các bộ tộc từng chinh chiến này đã phát triển một sự ưu tiên lịch sử dành cho các lãnh thổ cố thủ và thế trận phòng thủ vững chắc. Nay đã thống nhất, họ sẵn sàng mang triết lý này vươn ra các vì sao, hướng tới việc giữ vững biên cương và xoa dịu căng thẳng."
 civic_sovereign_guardianship_effects: "Mở khóa §Y$fanatic_guardian_plural$§! làm quân đội phòng thủ.\n$civic_sovereign_guardianship_effects_common$"
 civic_hive_sovereign_guardianship: "Cụm Hộ Vệ"
 civic_hive_sovereign_guardianship_desc: "Tập thể này đã phát triển một sự ưu tiên lịch sử dành cho các lãnh thổ cố thủ và thế trận phòng thủ. Họ sẵn sàng mang triết lý này vươn ra các vì sao, hướng tới việc giữ vững biên cương và xoa dịu căng thẳng."
 civic_hive_sovereign_guardianship_effects: "Mở khóa §Y$machine_fanatic_guardian_plural$§! làm quân đội phòng thủ.\n$civic_sovereign_guardianship_effects_common$"
 civic_machine_sovereign_guardianship: "Ma Trận Hộ Vệ"
 civic_machine_sovereign_guardianship_desc: "Tập thể cơ khí này đã phát triển một sự ưu tiên theo quy trình dành cho các lãnh thổ cố thủ và thế trận phòng thủ vững chắc. Họ sẵn sàng mang chiến lược hiệu quả này vươn ra các vì sao, hướng tới việc giữ vững biên cương và xoa dịu căng thẳng."
 civic_machine_sovereign_guardianship_effects: "Mở khóa §Y$machine_fanatic_guardian_plural$§! làm quân đội phòng thủ.\n$civic_sovereign_guardianship_effects_common$"
 civic_corporate_sovereign_guardianship: "Khu Bảo Hộ Doanh Nghiệp"
 civic_corporate_sovereign_guardianship_desc: "Xã hội gồm các tập đoàn cạnh tranh này đã nhận ra rằng sự bảo vệ tốt nhất cho các khoản đầu tư của họ là một thế trận phòng thủ vững mạnh. Nay đã liên kết, họ sẵn sàng áp dụng triết lý này vào không gian, giữ cho biên giới kiên cố và giảm bớt căng thẳng quân sự."
 civic_corporate_sovereign_guardianship_effects: "$civic_sovereign_guardianship_effects$"
 civic_sovereign_guardianship_effects_common: "Cho phép xây dựng một §Y$sm_reloading_bay$§! trong các căn cứ sao.\nKích hoạt §HĐạo Luật§! §Y$edict_inner_focus$§!, chuyển hóa £influence£ §YẢnh Hưởng§! thành £unity£ §YĐoàn Kết§!."

 civic_tooltip_not_guardian: "KHÔNG có Quốc Thể thuộc nhóm ['concept_guardian_civics']"
 concept_guardian_civics: "Hộ Vệ Chủ Quyền"
 concept_guardian_civics_desc: "Các Quốc Thể $concept_guardian_civics$ bao gồm:\n- ['civic:civic_sovereign_guardianship']$NEW_LINE$- ['civic:civic_corporate_sovereign_guardianship']$NEW_LINE$- ['civic:civic_hive_sovereign_guardianship']$NEW_LINE$- ['civic:civic_machine_sovereign_guardianship']"

 fanatic_guardian: "Vệ Binh Cuồng Tín"
 fanatic_guardian_plural: "Vệ Binh Cuồng Tín"
 fanatic_guardian_desc: "Những người bảo vệ kiên cường của quê hương, những người lính không thể lay chuyển này chiến đấu hiệu quả nhất khi bảo vệ những người mà họ có mối quan hệ gắn bó máu thịt."

 machine_fanatic_guardian: "Đơn Vị Ma Trận"
 machine_fanatic_guardian_plural: "Đơn Vị Ma Trận"
 machine_fanatic_guardian_desc: "Những máy bay không người lái bảo vệ mang tính sát thương cao này hoạt động hiệu quả nhất khi được duy trì ở khoảng cách gần với tất cả các nút chiến lược khác."

 ##########
 # Edicts #
 ##########

 edict_shadow_matrix: "Ma Trận Bóng Tối"
 edict_shadow_matrix_desc: "Màn sương điện tử do các đơn vị xử lý vật chất tối tạo ra sinh ra phần mềm mà ngay cả những chuyên gia giải mã tài ba nhất cũng phải bó tay."

 edict_obsidian_veil: "Màn Che Hắc Diệu Thạch"
 edict_obsidian_veil_desc: "Để ẩn mình trong rừng, người ta khoác lên mình màu đất. Để ẩn mình trong vũ trụ, người ta khoác lên mình màu hư không."

 edict_dark_matter_forging: "Rèn Vật Chất Tối"
 edict_dark_matter_forging_desc: "Đặc tính liên kết độc nhất của vật chất tối đóng vai trò chất trợ dung trong các xưởng đúc của chúng ta giúp nâng cao sản lượng một cách rõ rệt."

 edict_dark_matter_unravelling: "Tháo Dỡ Vật Chất Tối"
 edict_dark_matter_unravelling_desc: "Năng lượng chứa bên trong các liên kết do vật chất tối tạo ra có thể được tháo dỡ để mang lại nguồn sản lượng giá trị."

 edict_inner_focus: "Nội Quan Tâm Pháp"
 edict_inner_focus_desc: "Mở rộng bờ cõi quá mức sẽ mang lại vô vàn rủi ro. Thấu hiểu chính mình là một nỗ lực đáng tin cậy và hiệu quả hơn nhiều."

 edict_baryonic_insight: "Hiểu Biết Về Baryon"
 edict_baryonic_insight_desc: "Để có được sự thấu hiểu sâu sắc hơn về kết cấu vũ trụ, chúng ta phải nhìn vượt ra ngoài khái niệm nguyên tử thông thường."

