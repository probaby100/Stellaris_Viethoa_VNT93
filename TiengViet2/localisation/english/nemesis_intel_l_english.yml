 first_contact.250.name:0 "Bắt giữ Tàu Ngoài Hành Tinh!"
 first_contact.250.desc:0 "Sau một cuộc giao tranh ngắn với thương vong tối thiểu, thủy thủ đoàn trên tàu thám hiểm của §H[This.ContactCountry.GetName]§! - mà chúng ta hiện biết là thuộc loài §H[This.ContactCountry.Species.GetClass]§! - đã đầu hàng trước đội đổ bộ của chúng ta. Giờ đây chúng ta nắm giữ cả con tàu lẫn phần lớn thủy thủ đoàn làm con tin, và có thể bắt đầu §Hthẩm vấn§! họ cũng như nghiên cứu công nghệ của họ."
 first_contact.250.desc.multispecies:0 "Sau một cuộc giao tranh ngắn với thương vong tối thiểu, thủy thủ đoàn trên tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã đầu hàng trước đội đổ bộ của chúng ta. Có nhiều loài ngoài hành tinh khác nhau trên tàu, nhưng phần lớn dường như là người §H[This.ContactCountry.Species.GetClassPlural]§!. Giờ đây chúng ta nắm giữ cả tàu lẫn phần lớn thủy thủ đoàn làm con tin, và có thể bắt đầu §Hthẩm vấn§! họ cùng công nghệ của họ."
 first_contact.250.desc.machine_victim:0 "Khi đổ bộ lên con tàu thám hiểm của §H[This.ContactCountry.GetName]§!, chúng ta ngỡ ngàng nhận ra rằng thủy thủ đoàn hoàn toàn là các drone cơ khí dường như được điều khiển bởi một §HAI biến chất!§! Sau cuộc giao tranh ngắn, chúng ta đã vô hiệu hóa đủ số lượng để những kẻ còn lại ngừng kháng cự. Đáng ngạc nhiên là chúng không kịp kích hoạt quy trình tự hủy - chúng ta chỉ có thể cho rằng mình đã may mắn cắt đứt tín hiệu tới AI dẫn đường trước khi lệnh được ban ra.\n\nGiờ đây khi đã nắm giữ cả tàu lẫn những gì còn lại của thủy thủ đoàn làm §Hcon tin§!, chúng ta có thể bắt tay vào nghiên cứu công nghệ của họ và xem liệu các drone này có mang lại thông tin hữu ích nào không."
 first_contact.250.desc.hive_victim:0 "Sau một cuộc giao tranh ngắn với thương vong tối thiểu, chúng ta đã áp đảo thủy thủ đoàn trên tàu thám hiểm của §H[This.ContactCountry.GetName]§! và buộc họ đầu hàng. Những sinh vật ngoài hành tinh §H[This.ContactCountry.Species.GetClass]§! này chiến đấu với sự phối hợp đáng kinh ngạc - gần như được dẫn dắt bởi một tâm trí duy nhất - cho đến khi đồng loạt ngừng kháng cự. Kể từ đó, họ tỏ ra mất phương hướng và bối rối. Chúng ta chỉ có thể đoán rằng họ là drone của một dạng tâm trí bầy đàn nào đó.\n\nGiờ đây khi nắm giữ cả tàu và phần còn lại của thủy thủ đoàn làm §Hcon tin§!, chúng ta có thể nghiên cứu công nghệ của họ và xem liệu các phương pháp thẩm vấn có mang lại thông tin hữu ích nào không."
 first_contact.250.desc.wilderness_victim: "Sau một cuộc giao tranh ngắn với thương vong tối thiểu, chúng ta đã áp đảo thủy thủ đoàn của tàu thám hiểm từ §H[This.ContactCountry.GetName]§! và buộc họ phải đầu hàng. Ban đầu, các sinh vật ngoài hành tinh §H[This.ContactCountry.Species.GetClass]§! chiến đấu với sự phối hợp chặt chẽ hơn nhiều so với dự tính - hành động như thể có cùng một tâm trí - cho đến khi bất ngờ ngừng kháng cự. Tại thời điểm đó, từng thành viên thủy thủ đoàn mất hết tính gắn kết, quay trở lại các hành vi nguyên thủy, thú tính.\n\nChúng ta chỉ có thể suy đoán rằng những sinh vật gần như chưa hoàn toàn có tri giác này từng hoạt động như một dạng tâm trí hợp nhất. Giờ đây khi giữ cả họ và tàu làm §Hcon tin§!, chúng ta có thể thẩm vấn thủy thủ đoàn kỳ dị này và nghiên cứu công nghệ độc đáo của họ."
 first_contact.250.A:0 "Họ sẽ bị thẩm vấn."
 first_contact.250.B:0 "Hãy bắt đầu tiến hành mổ xẻ!"
 first_contact.250.B.machine:0 "Hãy tháo rời những cỗ máy này ra!"
 first_contact.250.B.tooltip:0 "Cách tiếp cận này có khả năng giúp chúng ta tìm hiểu được nhiều điều hơn, nhưng §H[This.ContactCountry.GetName]§! sẽ §Rcực kỳ phẫn nộ§! khi phát hiện ra."
 first_contact.250.C:0 "Chúng ta không cần những kẻ sống sót."
 first_contact.250.C.devourers:0 "Hãy xem mùi vị của chúng ra sao..."
 first_contact.250.C.homicidal_tooltip:0 "Chúng ta cũng sẽ điều tra con tàu của họ để tìm manh mối về họ.\n"
 first_contact.260.name:0 "$first_contact.250.name$"
 first_contact.260.desc:0 "Chúng ta đã vô hiệu hóa được tàu thám hiểm của §H[This.ContactCountry.GetName]§!, nhưng chỉ sau một cuộc đọ súng đẫm máu kéo dài ngay cả khi chúng ta đã đổ bộ lên tàu. Cuộc giao tranh khốc liệt đến mức không còn ai sống sót - dường như những chiến binh bị thương đã §Htự sát§! chứ không chịu để bị bắt sống.\n\n$first_contact.260.desc.end$"
 first_contact.260.desc.machine_victim:1 "Chúng ta đã vô hiệu hóa được tàu thám hiểm của §H[This.ContactCountry.GetName]§!, nhưng chỉ sau một cuộc giao tranh dữ dội kéo dài tới khi chúng ta tràn lên tàu. Hóa ra đối thủ của chúng ta là những drone cơ khí được điều khiển bởi một §HAI biến chất§!, kẻ rõ ràng đã ban lệnh §Htự hủy§! ngay khi thấy tình thế vô vọng.\n\n$first_contact.260.desc.end$"
 first_contact.260.desc.hive_victim:0 "Chúng ta đã vô hiệu hóa được tàu thám hiểm của §H[This.ContactCountry.GetName]§!, nhưng chỉ sau một cuộc đọ súng đẫm máu kéo dài tới lúc chúng ta lên tàu. Thủy thủ đoàn di chuyển với sự phối hợp đáng kinh ngạc - như thể được dẫn dắt bởi một tâm trí duy nhất - và kháng cự quyết liệt, từ chối lùi bước và cuối cùng §Htự sát§! chứ không chịu bị bắt sống.\n\n$first_contact.260.desc.end$"
 first_contact.260.desc.wilderness_victim: "Chúng ta đã vô hiệu hóa được tàu thám hiểm từ §H[This.ContactCountry.GetName]§!, nhưng chỉ sau một cuộc chạm trán trở nên chết chóc hơn hẳn khi chúng ta đổ bộ lên tàu. Ban đầu, các sinh vật dị chủng §H[This.ContactCountry.Species.GetClass]§! chiến đấu với sự phối hợp chặt chẽ hơn nhiều so với dự tính, như thể hành động bằng một tâm trí. Tuy nhiên, một khi chúng ta áp đảo về mặt quân sự, các sinh vật này đột ngột mất hết tính gắn kết. Từ thời điểm đó, hành vi của chúng quay lại trạng thái nguyên thủy, thú tính và hoàn toàn vô tổ chức. Hồi kết của chúng đến rất nhanh.\n\nChúng ta chỉ có thể suy đoán rằng những sinh vật gần như chưa có tri giác này từng hoạt động như một phần của tâm trí hợp nhất. Bất kể thực thể nào dẫn dắt chúng dường như đã chọn tự hủy hơn là bị bắt; để lại cho chúng ta một thân tàu trơ trọi chứa đầy những con thú hung hãn và thảm thực vật co giật."
 first_contact.260.desc.end:0 "Bất chấp những nỗ lực vội vã vào phút chót nhằm xóa sạch hệ thống máy tính và gài mìn cho tàu nổ tung, con tàu của họ về cơ bản vẫn còn nguyên vẹn, và các [This.Owner.GetResearchers] của chúng ta đã sẵn sàng tìm kiếm những gì có thể khai thác từ nó."
 first_contact.260.A:0 "Con tàu chắc chắn sẽ hé lộ bí mật của họ."
 first_contact.270.name:0 "Một Vỏ Tàu Trống Rỗng"
 first_contact.270.desc:0 "Mưu toan bắt giữ tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã kết thúc trong thảm họa. Đáng tiếc là họ kháng cự quyết liệt hơn dự kiến, và một khi nhận thấy cuộc chiến vô vọng, họ đã kích hoạt hệ thống §Htự hủy§!. Hiện con tàu chẳng còn lại gì ngoài những mảnh vỡ vụn. Chúng ta chỉ có thể hy vọng tàu thám hiểm của họ sẽ không bị nối gót bởi những chiến hạm đầy thù hận!"
 first_contact.270.desc2:0 "Mưu toan bắt giữ tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã kết thúc trong thảm họa. Đáng tiếc là họ kháng cự quyết liệt hơn dự kiến, và trong cuộc đọ súng, con tàu của họ đã trúng một §Hphát bắn chí mạng§!. Hiện con tàu chẳng còn lại gì ngoài những mảnh vỡ vụn. Chúng ta chỉ có thể hy vọng tàu thám hiểm của họ sẽ không bị nối gót bởi những chiến hạm đầy thù hận!"
 first_contact.270.A:0 "Chúng ta phải tăng cường nỗ lực dịch ngôn ngữ của họ."
 first_contact.270.B:0 "Hãy thử lại lần nữa..."
 first_contact.270.B.tooltip:0 "$first_contact.280.B.tooltip$\nTuy nhiên, họ sẽ đề cao cảnh giác.\n\n"
 first_contact.280.name:0 "Thất bại"
 first_contact.280.desc.just_left:0 "Nỗ lực bắt giữ tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã kết thúc trong thất bại. Đáng tiếc là chúng ta đã mất dấu tàu của họ trước khi kịp tiến hành bắt giữ."
 first_contact.280.desc.failed:0 "Nỗ lực bắt giữ tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã kết thúc trong thất bại. Đáng tiếc là họ đã lẩn tránh được âm mưu bắt giữ và §Hchạy trốn§! khỏi hệ sao trước khi chúng ta kịp vô hiệu hóa con tàu. Điềm báo này không tốt cho tương lai - không chỉ chúng ta đối mặt với muôn vàn khó khăn để tìm hiểu thêm về họ, mà chắc chắn họ sẽ coi đây là hành động thù địch từ phía chúng ta."
 first_contact.280.A:0 "$first_contact.270.A$"
 first_contact.280.B:0 "$first_contact.270.B$"
 first_contact.280.B.tooltip:0 "Vì đã xác định được hệ sao quê hương của họ, chúng ta có thể thử §Hbắt cóc§! các mẫu vật từ đó.\n\n"

 first_contact.252.name:0 "Tàu Bị Bắt giữ"
 first_contact.252.desc.normal.start:1 "Những nhà thám hiểm của chúng ta biết rằng tiếp xúc đầu tiên luôn là một công việc nguy hiểm, nhưng không ai có thể ngờ điều đó lại đúng đến mức này. Trong một cuộc đột kích bạo lực, [From.Owner.GetName] đã chiếm đoạt con tàu của chúng ta, đổ bộ lực lượng áp đảo trước khi hệ thống FTL khẩn cấp kịp kích hoạt."
 first_contact.252.desc.normal.end:0 "Những hình ảnh cuối cùng truyền về trước khi tín hiệu bị ngắt cho thấy quân địch đã bắt sống phần lớn thủy thủ đoàn và đang chuẩn bị thẩm vấn họ, có lẽ là để tìm hiểu thêm về chúng ta nhằm chuẩn bị cho các hành động thù địch tiếp theo..."
 first_contact.252.desc.machine.start:1 "Ngay từ đầu, các bộ xử lý của chúng ta đã nhận định việc chạm trán các nền văn minh ngoài hành tinh luôn tiềm ẩn rủi ro. Dự đoán đó đã ứng nghiệm khi một trong những tàu thám hiểm của chúng ta bị [From.Owner.GetName] tấn công và chiếm quyền kiểm soát trước khi kịp kích hoạt FTL khẩn cấp."
 first_contact.252.desc.hive.start:1 "Phần ý thức đánh giá mối đe dọa của chúng ta đã dự đoán ngay từ đầu rằng việc chạm trán các nền văn minh ngoài hành tinh là mạo hiểm. Điều này đã được chứng minh là đúng: [From.Owner.GetName] đã tấn công và chiếm đoạt một trong những tàu thám hiểm của chúng ta trước khi kịp nhảy FTL khẩn cấp."
 first_contact.252.desc.hive.end:0 "tuy nhiên, không có sự chỉ dẫn của chúng ta, chúng khó lòng khai thác được nhiều giá trị - dẫu những kẻ tấn công có thể khám phá nhiều điều về công nghệ của chúng ta từ con tàu bị bắt. Đánh giá của chúng ta về mối nguy hiểm từ chúng đã tăng lên tương ứng."
 first_contact.252.desc.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - thuộc loài sinh vật dị chủng [From.Owner.Species.GetClass] - đã áp đảo hàng phòng thủ của chúng ta.\n\n$first_contact.252.desc.normal.end$"
 first_contact.252.desc.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật ngoài hành tinh [From.Owner.Species.GetClass], đã bắt giữ nhiều drone lao dịch của chúng ta; $first_contact.252.desc.hive.end$"
 first_contact.252.desc.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass], đã bắt giữ nhiều drone của chúng ta. Tuy nhiên, không có sự chỉ dẫn của chúng ta, chúng sẽ khó lòng khai thác được nhiều giá trị - dẫu chúng có thể tìm hiểu nhiều về công nghệ từ con tàu bị bắt. Đánh giá của chúng ta về mối nguy hiểm từ chúng đã tăng lên tương ứng."
 first_contact.252.desc.machine_enemy.normal:1 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - các drone cơ khí dường như được điều khiển bởi một AI biến chất - đã áp đảo hàng phòng thủ của chúng ta.\n\n$first_contact.252.desc.normal.end$"
 first_contact.252.desc.machine_enemy.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta, một nhóm drone cơ khí dường như do AI biến chất điều khiển, đã bắt giữ nhiều drone lao dịch của chúng ta; $first_contact.252.desc.hive.end$"
 first_contact.252.desc.machine_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta - một nhóm máy móc tương tự như chúng ta - đã bắt giữ nhiều drone của chúng ta. Tuy nhiên, không có chúng ta chỉ đạo, chúng khó lòng thu được giá trị đáng kể - dù chúng có thể khám phá nhiều điều về công nghệ từ con tàu. Đánh giá nguy cơ từ chúng đã được nâng lên tương ứng."
 first_contact.252.desc.hive_enemy.normal:1 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - những sinh vật ngoài hành tinh [From.Owner.Species.GetClass] di chuyển với sự phối hợp đáng sợ - đã áp đảo phòng tuyến của chúng ta.\n\n$first_contact.252.desc.normal.end$"
 first_contact.252.desc.hive_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công - một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass] di chuyển với sự phối hợp gợi ý một trí tuệ thống nhất tương tự chúng ta - đã bắt giữ nhiều drone của chúng ta. Dù vậy, không có sự chỉ đạo của chúng ta, họ khó lòng khai thác được nhiều điều giá trị, dù họ có thể tìm hiểu về công nghệ của chúng ta từ con tàu bị bắt. Đánh giá nguy cơ đã tăng lên tương ứng."
 first_contact.252.desc.hive_enemy.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một nhóm sinh vật ngoài hành tinh [From.Owner.Species.GetClass] di chuyển với sự phối hợp chặt chẽ cho thấy một trí tuệ thống nhất như chúng ta - đã bắt giữ nhiều drone lao dịch của chúng ta; $first_contact.252.desc.hive.end$"
 first_contact.252.desc.wilderness.start: "Chúng ta từ lâu đã nghi ngờ rằng nếu sự sống tồn tại ở nơi khác trong thiên hà, nó có thể gây ra mối đe dọa cho chúng ta, hoang dã và chết chóc không kém gì những điểm kỳ dị hay bức xạ sao. Giờ đây, nỗi nghi ngờ đã trở thành sự thật. Một trong những tàu thám hiểm của chúng ta đã bị [from.owner.GetName] tấn công và đổ bộ; họ đẩy mạnh tấn công trước khi các cá thể cộng sinh trên tàu kịp trốn thoát."
 first_contact.252.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nKẻ tấn công chúng ta, một nhóm sinh vật ngoài hành tinh [from.owner.species.GetClass], đã bắt giữ nhiều thành phần [root.GetSpeciesAdj] đang bị mắc kẹt trên tàu. Vì những cá thể này không còn là một phần trong dàn hợp xướng của chúng ta, chúng ta nghi ngờ rằng những kẻ bắt giữ khó có thể khai thác được nhiều giá trị chiến lược. Tuy nhiên, mất mát đó vẫn làm suy giảm sức mạnh của chúng ta. Chúng ta hoàn toàn có lý do để phẫn nộ, nhưng đồng thời cũng được an ủi khi đã vạch trần và nhận diện được một mối đe dọa mới ngoài cõi hư không bí ẩn này."
 first_contact.252.A:0 "Đáng lo ngại. Rất đáng lo ngại."

 first_contact.253.name:0 "Sự Tàn độc của [From.Owner.GetName]"
 first_contact.253.desc.normal.end:0 "Hình ảnh truyền về từ bên trong con tàu giờ đã bị cắt đứt, nhưng không phải trước khi cho chúng ta thấy những tội ác man rợ khôn xiết mà những kẻ ngoài hành tinh đang thực hiện với các con tin: chúng mổ xẻ và nghiên cứu nội tạng của họ ngay khi họ còn đang sống! Chúng ta phải hiểu rằng chiến tranh là không thể tránh khỏi khi đối mặt với một nền văn minh hành xử dã man như vậy."
 first_contact.253.desc.hive.end:0 "đã bắt giữ nhiều drone lao dịch của chúng ta và bắt đầu xẻ thịt chúng bất chấp sự lãng phí tài nguyên, dường như nhằm tìm cách biến sinh học của chính chúng ta thành vũ khí chống lại chúng ta. Điều này, cùng với việc chúng chiếm đoạt con tàu và toàn bộ công nghệ trên đó, đã khiến chúng ta gia tăng đáng kể mức độ đánh giá nguy cơ từ chúng."
 first_contact.253.desc.machine.end:0 "đã bắt giữ nhiều drone của chúng ta và bắt đầu tháo rời chúng để xem cách các đơn vị của chúng ta được cấu tạo - hiển nhiên là quét tìm điểm yếu trong cả phần mềm lẫn phần cứng. Điều này, cùng với việc chúng chiếm đoạt con tàu và công nghệ, đã khiến chúng ta gia tăng đáng kể đánh giá nguy cơ từ chúng."
 first_contact.253.desc.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - thuộc loài sinh vật dị chủng [From.Owner.Species.GetClass] - đã áp đảo hàng phòng thủ của chúng ta.\n\n$first_contact.253.desc.normal.end$"
 first_contact.253.desc.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật ngoài hành tinh [From.Owner.Species.GetClass], $first_contact.253.desc.hive.end$"
 first_contact.253.desc.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass], $first_contact.253.desc.machine.end$"
 first_contact.253.desc.machine_enemy.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - các drone cơ khí dường như do AI biến chất điều khiển - đã áp đảo hàng phòng thủ của chúng ta.\n\n$first_contact.253.desc.normal.end$"
 first_contact.253.desc.machine_enemy.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta, một nhóm drone cơ khí do AI biến chất điều khiển, $first_contact.253.desc.hive.end$"
 first_contact.253.desc.machine_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta - một nhóm drone cơ khí rất giống chúng ta - $first_contact.253.desc.machine.end$"
 first_contact.253.desc.hive_enemy.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - các sinh vật ngoài hành tinh [From.Owner.Species.GetClass] di chuyển với sự phối hợp đáng sợ - đã áp đảo phòng tuyến của chúng ta.\n\n$first_contact.253.desc.normal.end$"
 first_contact.253.desc.hive_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta - một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass] di chuyển với sự phối hợp cho thấy một trí tuệ thống nhất rất giống chúng ta - $first_contact.253.desc.machine.end$"
 first_contact.253.desc.hive_enemy.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một nhóm sinh vật ngoài hành tinh [From.Owner.Species.GetClass] di chuyển với sự phối hợp chặt chẽ cho thấy một trí tuệ thống nhất như chúng ta - $first_contact.253.desc.hive.end$"
 first_contact.253.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật dị chủng [from.owner.species.GetClass], đã bắt đầu mổ xẻ và xẻ thịt những bộ phận của chúng ta mà họ nhận diện là dạng sống trên tàu. Những cá thể không phải sinh vật đại cộng sinh di động dường như có số phận may mắn hơn, chỉ đơn thuần bị tiêu diệt hoặc thanh lọc. Không còn ai trên tàu nằm trong dàn hợp xướng của chúng ta, dù chúng ta cảm nhận được nỗi mất mát khắp nơi.\n\nMột hành vi tra tấn tàn bạo đã giáng xuống chúng ta, nhưng nếu không còn gì khác: giờ đây chúng ta biết nhiều hơn về những mối đe dọa ngoài kia."
 first_contact.253.B.devourer:0 "Chúng ta sẽ sớm phải tìm hiểu xem liệu chúng có ngon miệng hay không."

 first_contact.254.name:0 "$first_contact.253.name$"
 first_contact.254.desc.normal.end:0 "Tín hiệu hình ảnh từ bên trong con tàu giờ đây đã ngắt, nhưng kịp cho thấy những người ngoài hành tinh hành quyết tất cả các con tin mà họ bắt được, không hề đoái hoài gì đến mạng sống của người [This.Owner.GetSpeciesAdj]. Chúng ta phải xác định rằng xung đột vũ trang là điều không thể tránh khỏi trước một nền văn minh hành xử theo lối dã man như vậy."
 first_contact.254.desc.hive.end:0 "đã bắt giữ nhiều drone lao dịch của chúng ta và tàn sát chúng theo cách hết sức phi lý, không hề bận tâm đến sự lãng phí tài nguyên. Điều này, cùng với việc bắt giữ con tàu và toàn bộ công nghệ được triển khai ở đó, đã khiến chúng ta gia tăng đáng kể đánh giá về mối nguy hiểm từ họ."
 first_contact.254.desc.machine.end:0 "đã bắt giữ nhiều drone của chúng ta và tháo dỡ thô bạo chúng theo cách thức vô cùng phi lý. Điều này, cùng với việc bắt giữ con tàu và công nghệ, đã khiến chúng ta gia tăng đáng kể đánh giá về mối đe dọa do họ gây ra."
 first_contact.254.desc.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - thuộc loài sinh vật dị chủng [From.Owner.Species.GetClass] - đã áp đảo hàng phòng thủ của chúng ta.\n\n$first_contact.254.desc.normal.end$"
 first_contact.254.desc.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật ngoài hành tinh [From.Owner.Species.GetClass], $first_contact.254.desc.hive.end$"
 first_contact.254.desc.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass], $first_contact.254.desc.machine.end$"
 first_contact.254.desc.machine_enemy.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - các drone cơ khí dường như do AI biến chất điều khiển - đã áp đảo hàng phòng thủ của chúng ta.\n\n$first_contact.254.desc.normal.end$"
 first_contact.254.desc.machine_enemy.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta, một nhóm drone cơ khí dường như do AI biến chất điều khiển, $first_contact.254.desc.hive.end$"
 first_contact.254.desc.machine_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta - một nhóm drone cơ khí tương tự chúng ta - $first_contact.254.desc.machine.end$"
 first_contact.254.desc.hive_enemy.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - các sinh vật [From.Owner.Species.GetClass] di chuyển với sự phối hợp đáng sợ - đã áp đảo phòng tuyến của chúng ta.\n\n$first_contact.254.desc.normal.end$"
 first_contact.254.desc.hive_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta - một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass] di chuyển với sự phối hợp cho thấy một trí tuệ thống nhất tương tự chúng ta - $first_contact.254.desc.machine.end$"
 first_contact.254.desc.hive_enemy.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một nhóm sinh vật ngoài hành tinh [From.Owner.Species.GetClass] di chuyển với sự phối hợp chặt chẽ cho thấy một trí tuệ thống nhất như chúng ta - $first_contact.254.desc.hive.end$"
 first_contact.254.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật ngoài hành tinh [from.owner.species.GetClass], đã trắng trợn tàn sát những bộ phận của chúng ta mà họ nhận diện là dạng sống. Nhiều cá thể không phải sinh vật đại cộng sinh di động cũng bị cuốn vào cuộc tận diệt, nhưng bất luận thế nào: tất cả những ai trên tàu giờ đây đã bị giật đứt khỏi dàn hợp xướng. Chúng ta cảm nhận rõ sự mất mát xuyên suốt.\n\nMột hành động tàn bạo vô nghĩa đã giáng xuống chúng ta, nhưng giờ đây ít nhất chúng ta cũng biết nhiều hơn về những mối đe dọa phải đối mặt nơi thiên hà này."
 first_contact.254.A:0 "Thật man rợ."
 first_contact.254.A2:0 "Đây là sự xúc phạm đối với tất cả những gì thiêng liêng nhất!"
 first_contact.254.A3:0 "Chúng ta phải chuẩn bị cho chiến tranh!"
 first_contact.254.B:0 "Hành động này vượt quá mọi giới hạn!"
 first_contact.254.A.devourer:0 "Những người ngoài hành tinh rất hợp ý chúng ta."
 first_contact.254.B.devourer:0 "Có lẽ chúng cũng rất ngon miệng."

 first_contact.262.name:0 "$first_contact.253.name$"
 first_contact.262.desc.normal.end:0 "Có lẽ may mắn thay - cho cả họ lẫn việc giữ kín thông tin khỏi tay kẻ thù - thủy thủ đoàn của chúng ta đã tự sát chứ không để bị bắt sống. Tuy nhiên, chúng ta phải lường trước rằng đối phương sẽ sớm tìm hiểu được nhiều điều về chúng ta bằng cách nghiên cứu xác tàu - và xung đột thù địch là điều tất yếu trước một nền văn minh hành xử theo cách như vậy."
 first_contact.262.desc.gestalt.end:0 "đã áp đảo hàng phòng thủ của chúng ta, vì vậy chúng ta đã ban lệnh cho các drone tự vô hiệu hóa để bảo vệ tính bảo mật thông tin. Tuy nhiên, chúng ta phải dự tính rằng kẻ thù sẽ sớm tìm hiểu được nhiều điều về chúng ta từ xác tàu. Do đó, chúng ta đã tăng đáng kể mức độ đánh giá nguy cơ từ chúng."
 first_contact.262.desc.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - thuộc loài sinh vật dị chủng [From.Owner.Species.GetClass] - đã áp đảo hàng phòng thủ của chúng ta.\n\n$first_contact.262.desc.normal.end$"
