 opinion_hostile_first_comms_greeting:0 "Lời Chào Ban Đầu Thù Địch"
 preventive_war_economy:0 "Kinh Tế Chiến Tranh Phòng Ngừa"
 preventive_war_economy_desc:1 "Chúng ta đã chuyển hướng nguồn lực sang việc sản xuất tàu chiến để đối mặt với mối đe dọa tiềm tàng từ các nền văn minh ngoài hành tinh thù địch chưa được biết đến."
 alien_friendship_society:0 "Hội Hữu Nghị Ngoại Chủng"
 alien_friendship_society_desc:0 "Đế chế của chúng ta hướng tới việc thiết lập tình hữu nghị với những kẻ chúng ta gặp trên vũ đài thiên hà."
 robot_appreciation:0 "Kỳ Quan Người Máy"
 robot_appreciation_desc:0 "Cuộc chạm trán của chúng ta với một nền văn minh người máy đã khiến nhiều người kinh ngạc trước những tiềm năng mà tiến bộ công nghệ AI của chính chúng ta có thể khai mở."
 alien_appreciation:0 "Sự Ngưỡng Mộ Ngoại Chủng"
 alien_appreciation_desc:0 "Cuộc chạm trán của chúng ta với một loài ngoài hành tinh đặc biệt hấp dẫn đã tạo nên một làn sóng tình nguyện viên gia nhập cơ quan Thám Hiểm Liên Sao."
 robot_revulsion:0 "Đám Hộp Thiếc Đáng Ghê Tởm"
 robot_revulsion_desc:0 "Cuộc chạm trán của chúng ta với một nền văn minh người máy đã khiến nhiều người hoài nghi về ảnh hưởng của tự động hóa đối với xã hội của chúng ta."
 alien_revulsion:0 "Người Ngoài Hành Tinh Ghê Tởm"
 alien_revulsion_desc:0 "Cuộc chạm trán của chúng ta với một loài ngoài hành tinh đặc biệt ghê tởm đã khiến nhiều người hướng nội về giống loài của chính mình hơn là hướng ngoại về phía kẻ khác."
 repulsive_robot_contact:0 "Dung Thứ Người Máy Ghê Tởm"
 repulsive_alien_contact:0 "Dung Thứ Dị Chủng Ghê Tởm"
 repulsive_aliens_uncondemned:0 "Dung Thứ Dị Chủng Ghê Tởm"
 repulsive_aliens_uncondemned_desc:0 "Việc chúng ta không bày tỏ sự phản đối đối với mối đe dọa mới đáng lo ngại vừa chạm trán đã làm bùng lên sự phản đối trong lòng dân chúng."
 first_contact_challenge_not_returned:0 "Không Đáp Lại Khiêu Khích"
 first_contact_challenge_not_returned_desc:0 "Sự kiên định của chúng ta trong việc xử lý tiếp xúc đầu tiên theo phương thức hợp lý và khoa học là một lợi ích lớn cho cơ quan thám hiểm, dù một số người lo ngại rằng chúng ta có thể đang tự đặt mình vào vòng nguy hiểm khi không phủ đầu xung đột với các nền văn minh rõ ràng thù địch."
 first_contact_defeated_dadaism:0 "Hóa Giải Sự Phi Lý"
 first_contact_defeated_dadaism_desc:0 "Một cuộc giao tiếp tiếp xúc đầu tiên đặc biệt đáng nhớ đã buộc chúng ta phải làm quen với những phản hồi phi lý. Giờ đây không còn thử thách nào quá lớn mà các nhà ngôn ngữ học của chúng ta không thể giải mã."
 first_contact_war_preparations:0 "Chuẩn Bị Chiến Tranh"
 first_contact_war_preparations_desc:0 "Cuộc chạm trán của chúng ta với một nền văn minh rõ ràng mang tính thù địch đã làm dấy lên các công tác chuẩn bị chiến tranh trên diện rộng."
 first_contact_warlike_warriors_recognised:0 "Khí Phách Chiến Binh Được Công Nhận"
 first_contact_warlike_warriors_recognised_desc:0 "Một nền văn minh mà chúng ta chạm trán gần đây đã vô cùng ấn tượng trước dũng khí chiến binh của chúng ta đến mức tuyên bố chúng ta là một trong những chiến binh cừ khôi nhất ngân hà. Điều này hoàn toàn không phương hại gì đến thanh danh của chúng ta."
 first_contact_warlike_warriors_presumed:0 "Được Ngộ Nhận Là Chiến Binh Hùng Dũng"
 first_contact_warlike_warriors_presumed_desc:0 "Một nền văn minh chúng ta chạm trán gần đây đã ngộ nhận chúng ta là một xã hội của những chiến binh mạnh mẽ và quả cảm. Dù thực tế chúng ta không hề như vậy, nhưng chúng ta vẫn có thể hưởng lợi từ ấn tượng sai lầm này trong một thời gian."
 first_contact_warlike_warriors_recognised_2:0 "Kình Địch Giữa Những Chiến Binh"
 first_contact_warlike_warriors_recognised_2_desc:0 "Một nền văn minh mà chúng ta chạm trán gần đây đã vô cùng ấn tượng trước dũng khí chiến binh của chúng ta đến mức thề sẽ phấn đấu để sánh ngang lòng dũng cảm của chúng ta, tuyên bố chúng ta là đối thủ kình địch của họ trên vũ đài thiên hà. Điều này hoàn toàn không phương hại gì đến thanh danh của chúng ta."
 first_contact_warlike_warriors_presumed_2:0 "Kình Địch Giữa Các Chiến Binh (Bị Ngộ Nhận)"
 first_contact_warlike_warriors_presumed_2_desc:0 "Một nền văn minh chúng ta chạm trán gần đây đã ngộ nhận chúng ta là một xã hội của những chiến binh mạnh mẽ và quả cảm. Đáng tiếc thay, họ tuyên bố sẽ nỗ lực sánh ngang lòng dũng cảm của chúng ta, và coi chúng ta là đối thủ kình địch trên vũ đài thiên hà. Hơn nữa, chúng ta vốn chẳng phải dạng người như vậy... nhưng ít nhất chúng ta cũng có thể hưởng lợi từ ấn tượng sai lầm này trong một thời gian."
 first_contact_level_headedness:0 "Vững Vàng Khi Nguy Khốn"
 first_contact_level_headedness_desc:0 "Sự điềm tĩnh sáng suốt của chúng ta khi đối mặt với nghịch cảnh được tán dương rộng rãi trên vũ đài thiên hà."
 first_comms_hostility_preparations:0 "Chuẩn Bị Cho Hành Động Thù Địch"
 first_comms_defensive:0 "Phản Gián Cảnh Giác"
 first_comms_defensive_desc:0 "Mục tiêu gián điệp của chúng ta nhìn nhận chúng ta với sự nghi ngờ sâu sắc, do chỉ mới vừa tiếp xúc với chúng ta lần đầu gần đây."
 first_contact_speak_like_us_spynetwork:0 "Nói Giống Chúng Ta"
 first_contact_speak_like_us_country:0 "Giải Mã Câu Đố"
 first_contact_speak_like_us_country_desc:0 "Kinh nghiệm giải mã các câu đố gửi đến từ một nền văn minh đặc biệt khó hiểu đã cho phép chúng ta tăng cường các giao thức tiếp xúc đầu tiên."
 universal_translator:0 "Máy Phiên Dịch Toàn Năng"
 universal_translator_desc:0 "Dù cái gọi là \"Máy Phiên Dịch Toàn Năng\" chưa đáp ứng trọn vẹn những hứa hẹn ban đầu của các nhà nghiên cứu về việc lập tức hỗ trợ giao tiếp với mọi loài có trí tuệ, nó vẫn là một công cụ giao tiếp hết sức hữu ích và hiện đã trở thành một phần trong trang thiết bị tiêu chuẩn của các phái viên cùng các nhà khoa học xã hội của chúng ta."
 space_lights_insights:0 "Dự Đoán Dòng Chảy Liên Sao"
 space_lights_insights_desc:0 "Sự hiểu biết của chúng ta về việc du hành qua làn siêu không gian đã tiến xa nhiều năm ánh sáng sau khi phát hiện rằng một loài chúng ta gặp gỡ nắm giữ chìa khóa mở ra kiến thức mới qua những hoa văn trên da của họ."
 first_contact_hive_drones_study:0 "Nghiên Cứu Đơn Vị Bầy Đàn"
 first_contact_hive_drones_study_desc:0 "Chúng ta đang nghiên cứu cách thức tâm trí bầy đàn điều khiển các đơn vị của nó nhằm tìm kiếm phương pháp nâng cao hiệu suất của các công nhân của chính chúng ta."

 any_civilian_ship_in_sensor_range:0 "Yêu cầu một tàu phi quân sự của §Y[This.ContactCountry.GetName]§! trong tầm cảm biến"

