 PlanetBio10:0 "hành tinh thứ mười của hệ sao, một hành tinh [known_planet.GetClassAdj]"
 PlanetBio10Moon:0 "mặt trăng [known_planet.GetClassAdj] của hành tinh thứ mười thuộc hệ sao,"

 #Space Fauna First Contacts
 # Enclaves
 first_contact_critters.1.name:0 "Tín Hiệu Có Cấu Trúc"
 first_contact_critters.1.desc:1 "Chúng ta thu được các chỉ số có bản chất chưa xác định. Các tín hiệu dường như tuân theo một dạng cú pháp lặp lại, có thể chỉ ra nguồn gốc từ sinh vật có tri giác. Cần phải điều tra thêm. Chúng dường như tập trung quanh một trạm không gian duy nhất, mặc dù chưa rõ liệu đây có phải là một phần của một nền văn minh du hành vũ trụ lớn hơn hay không."
 first_contact_critters.1.desc.cfl: "Chúng ta thu được các chỉ số có bản chất chưa xác định. Các tín hiệu dường như tuân theo một dạng cú pháp lặp lại, có thể chỉ ra nguồn gốc từ sinh vật có tri giác. Cần phải điều tra thêm. Chúng dường như tập trung quanh một tàu lớn duy nhất, mặc dù chưa rõ liệu đây có phải là một phần của một nền văn minh du hành vũ trụ lớn hơn hay không."
 first_contact_critters.1.A:0 "Tiến hành."
 first_contact_critters.5.name:0 "$leviathans.99.name$"
 first_contact_critters.5.desc:1 "Sau khi phiên dịch thành công ngôn ngữ của họ, chúng ta đã thiết lập liên lạc với trạm không gian độc lập của §H[This.ContactCountry.GetRealName]§!."
 first_contact_critters.5.A:0 "Xem họ muốn nói gì."
 # Tiyanki
 first_contact_critters.10.name:0 "Khối Nhiệt Kỳ Lạ"
 first_contact_critters.10.desc:0 "Các máy quét tầm xa đã thu được các chỉ số trong hệ sao [This.System.GetName] mà cách mô tả chính xác nhất là những khối nhiệt khổng lồ. Rất đáng để điều tra."
 first_contact_critters.10.A:0 "Cứ tiến hành như vậy."
 first_contact_critters.15.name:0 "$story.501.name$"
 first_contact_critters.15.desc:1 "Các dạng sống du hành không gian — mà Trưởng Ban Nghiên Cứu Xã Hội [Owner.GetSpeciesAdj] gọi là \"§HTiyanki§!\" — là những sinh vật hiền lành. Có khả năng tiếp cận một chiều không gian thấp hơn của không gian con, chúng thong dong đi từ hệ sao này sang hệ sao khác một cách dễ dàng đáng kinh ngạc.\n\nChúng ăn các loại khí phổ biến ở tầng trên của nhiều hành tinh khí khổng lồ. Nói một cách khiêm tốn thì gần như chắc chắn đây không phải là nguồn thức ăn duy nhất của chúng, nhưng việc hấp thụ các chất dinh dưỡng khác vẫn chưa được quan sát thấy.\n\nChúng hiếm khi tấn công, ngay cả khi bị khiêu khích. Chúng ta hoàn toàn có thể bỏ qua chúng một cách an toàn."
 first_contact_critters.15.desc.gesta:0 "$story.501.desc.gesta$"
 first_contact_critters.15.A:0 "Rất lôi cuốn."
 # Amoebas
 first_contact_critters.20.name:0 "To Lớn Và Dữ Tợn"
 first_contact_critters.20.desc:0 "Khi tiến vào [This.System.GetName], cảm biến của chúng ta đã thu được các chỉ số kỳ lạ. Ban đầu bị xem nhẹ như những tiểu hành tinh sáng lóa, mọi chuyện nhanh chóng thay đổi khi phát hiện ra rằng những thực thể này phản ứng hung hãn với các chuyển động trong không gian — ngay cả ở cự ly rất xa!\n\nKhuyến nghị nên quan sát các thực thể này — tốt nhất là từ khoảng cách an toàn."
 first_contact_critters.20.A:0 "Tốt nhất nên quan sát từ xa. Tiếp tục đi."
 first_contact_critters.25.name:0 "$story.101.name$"
 first_contact_critters.25.desc:1 "Các thực thể mà hạm đội của chúng ta chạm trán cách đây ít lâu là những dạng sống du hành không gian mới.\n\nNhanh chóng được đặt biệt danh là §H\"Trùng Biến Hình Không Gian\"§! sau một sai lệch thô thiển từ dữ liệu cảm biến ban đầu, sinh vật này trên thực tế còn lớn hơn kích thước trung bình của một tàu hộ vệ [Owner.GetSpeciesAdj]."
 first_contact_critters.25.A:0 "Đã rõ."
 # Crystals
 first_contact_critters.30.name:0 "Tinh Thể Sống?"
 first_contact_critters.30.desc:0 "Hiện tượng dị thường mà chúng ta từng định danh là §H[This.ContactCountry.GetName]§! dường như được tạo thành từ một loại vật liệu kết tinh. Thật kỳ lạ, nó dường như có khả năng tự đẩy mình qua khoảng không và tự vệ khi cần thiết, cho thấy nó có thể là một thực thể sống. Các [This.Owner.GetResearchers] của chúng ta đang tích cực làm việc để tìm hiểu thêm."
 first_contact_critters.30.A:0 "Hãy tiếp tục."
 # Drones
 first_contact_critters.40.name:0 "Tự Động Cơ Không Gian"
 first_contact_critters.40.desc:0 "Chúng ta đã phát hiện một dạng sống mới tại [This.System.GetName], mặc dù gọi nó là một \"dạng sống\" có thể là chưa chính xác. Các thực thể dường như là những thiết bị bay cơ khí hoàn toàn tự động, được chế tạo riêng cho một mục đích công nghiệp chưa rõ nào đó.\n\nViệc quan sát sẽ tiếp tục, nhưng vì nhiều khả năng những cỗ máy này được lập trình các giao thức phòng vệ, nên việc thận trọng từng bước đi là điều khôn ngoan."
 first_contact_critters.40.A:0 "Tiếp tục theo dõi, nhưng hãy thận trọng."
 first_contact_critters.45.name:0 "$story.301.name$"
 first_contact_critters.45.desc:0 "Các báo cáo về những thiết bị bay không người lái trong không gian sâu chạm trán trước đây đã được điều tra kỹ lưỡng hơn. Những cỗ máy này dường như là công nhân và người trông nom một hoạt động khai khoáng quỹ đạo tự hành, được thiết lập từ hàng thiên niên kỷ trước rồi nhanh chóng bị bỏ hoang bởi tất cả ngoại trừ chính những cỗ máy ấy, xét theo tình trạng của thiết bị xử lý.\n\nCác thiết bị bay này sở hữu laser khai khoáng uy lực và phát ra những động thái đe dọa rõ rệt, nếu không muốn nói là hoàn toàn thù địch, về phía các tàu thuyền [Owner.GetSpeciesAdj] khi tiếp cận. Chúng có thể chỉ là những cỗ máy cũ kỹ, nhưng vẫn nên được [Owner.GetName] giám sát chặt chẽ."
 first_contact_critters.45.A:0 "Đã rõ."
 # Marauders
 first_contact_critters.50.name:0 "Dấu Hiệu Dã Man"
 first_contact_critters.50.desc:0 "Mặc dù nơi cư trú của họ trên các trạm sinh cảnh cho thấy một xã hội tiên tiến, [This.Owner.GetEnvoy] [This.Leader.GetName] vẫn không chắc liệu chúng ta có thực sự đang đối phó với một dạng sống thông minh hay không: họ dường như thù địch không ngừng nghỉ, đến mức một xã hội ổn định gần như là không tưởng: ngay cả trong khoảng thời gian điều tra ngắn ngủi, chúng ta đã chứng kiến nhiều hành vi man rợ thuần túy.\n\nHọ dường như có ngôn ngữ, nhưng các [This.Owner.GetLinguists] của chúng ta vẫn đang nỗ lực giải mã để chúng ta có thể hiểu được biểu hiện này."
 first_contact_critters.50.A:0 "Đáng lo ngại. Chúng ta phải cảnh giác."
 first_contact_critters.60.name:0 "Tàu Thuyền Thù Địch"
 first_contact_critters.60.desc:0 "Những con tàu chúng ta chạm trán trong hệ sao [This.System.GetName] có vẻ hơi lạc hậu, nhưng lại được vũ trang tận răng. Chúng dường như được điều khiển bởi các thủy thủ đoàn có tri giác nhưng lại phản ứng đầy thù địch trước mọi sự tiếp cận. Chúng ta sẽ phải đối phó với họ bằng sự thận trọng."
 first_contact_critters.65.desc:0 "Mặc dù chúng ta chưa thể thiết lập liên lạc với họ — chủ yếu vì họ không muốn giao tiếp với chúng ta — chúng ta đã có thể xác định §H[This.ContactCountry.GetName]§! là những tên hải tặc. Các chỉ dấu thị giác cho thấy văn hóa của họ phần lớn gắn liền với không gian, và một số kiểu hình quan sát thấy ở họ không khớp với bất kỳ nền văn minh cư trú trên hành tinh nào đã biết.\n\nThật không may, các thủy thủ đoàn của họ hoàn toàn không hứng thú với các cuộc đối thoại văn minh. Chút ít thông tin chúng ta thu thập được từ việc đánh chặn liên lạc nội bộ hạm đội cho thấy họ chủ yếu sống dựa vào cướp bóc, đôi khi chiêu mộ các phần tử bên lề của những nền văn minh du hành vũ trụ vào hàng ngũ của mình."
 first_contact_critters.70.name:0 "Tàu Thuyền Chưa Rõ"
 first_contact_critters.70.desc:0 "Các tàu thuyền được phát hiện trong hệ sao [This.System.GetName] dường như là một phần của một đoàn thám hiểm xuyên thiên hà với mục đích chưa rõ. Họ chưa thực hiện bất kỳ động thái thù địch nào, cũng không thấy có vũ khí hạng nặng nào — thay vào đó, họ dường như đang phát đi các tín hiệu lặp đi lặp lại nhưng không có nhiều nội dung về hướng của chúng ta. [This.Owner.GetEnvoy] của chúng ta, [This.Leader.GetName], đang bối rối, nhưng hy vọng các tín hiệu phát sóng sẽ giúp các [This.Owner.GetLinguists] của chúng ta dịch ngôn ngữ của họ."
 first_contact_critters.70.desc.home:0 "Hệ sao [This.System.GetName] dường như là quê hương của một xã hội tiên tiến không rõ nguồn gốc. Cư trú trên một loạt các trạm không gian trải khắp hệ sao, [This.Owner.GetEnvoy] [This.Leader.GetName] đã quan sát thấy nhiều phi thuyền bay qua lại giữa các trạm, cũng như một vài đoàn thám hiểm lớn hơn rời khỏi hệ sao vì những mục đích chưa rõ. Họ dường như đang phát đi các tín hiệu lặp đi lặp lại nhưng không có nhiều nội dung về hướng của chúng ta, một diễn biến khiến các [This.Owner.GetLinguists] của chúng ta bối rối, nhưng có thể giúp họ dịch ngôn ngữ của họ."
 first_contact_critters.70.desc.nomadic.base: "Các tàu thuyền được phát hiện trong hệ sao [This.System.GetName] dường như đang trong một cuộc viễn chinh xuyên thiên hà, một lối sống mà người dân chúng ta rất quen thuộc. Họ chưa có hành động thù địch nào, thay vào đó liên tục phát đi các tín hiệu lặp lại về hướng của chúng ta."
 first_contact_critters.70.desc.nomadic: "$first_contact_critters.70.desc.nomadic.base$\n\nCó một điều gì đó gần như thân thuộc khi chứng kiến một giống loài dựng xây ngôi nhà của họ giữa những vì sao thay vì trên bất kỳ hành tinh nào. [This.Owner.GetEnvoy] của chúng ta, [This.Leader.GetName], rất háo hức muốn tìm hiểu thêm về những người bạn đồng hành này."
 first_contact_critters.70.desc.nomadic.unfriendly: "$first_contact_critters.70.desc.nomadic.base$\n\nNhững kẻ lang bạt, chẳng khác gì chúng ta, mặc dù sự so sánh này chẳng mấy dễ chịu. [This.Owner.GetEnvoy] của chúng ta, [This.Leader.GetName], không mấy ấn tượng, nhưng sẽ lắng nghe những gì họ muốn nói."
 first_contact_critters.70.A:0 "Thật tò mò."
 first_contact_critters.70.B:0 "Đáng lo ngại."
 first_contact_critters.70.C:0 "Hành động của những kẻ ngoài bầy đàn thực sự rất kỳ quặc."
 first_contact_critters.70.D:0 "Làm sao chúng ta có thể hiểu thấu phương thức của sự sống hữu cơ?"
 first_contact_critters.70.E: "Phải chăng họ đã tuyên bố chủ quyền đối với các tuyến Đường Dẫn trong khu vực này?"
 first_contact_critters.75.name:0 "Đoàn Thương Buôn"
 first_contact_critters.75.desc:0 "Chúng ta đã giải mã được những thông điệp lặp đi lặp lại đầy khó hiểu mà §H[This.ContactCountry.GetName]§! gửi cho chúng ta, và hóa ra đó là... quảng cáo thương mại! Rõ ràng họ tự gọi mình là §H[This.ContactCountry.GetRealName]§! và là một phần của một nhóm thương nhân du hành vũ trụ kiếm sống bằng cách đưa ra các giao dịch tốt nhất — hoặc ít nhất là họ tự tuyên bố như vậy — cho bất kỳ nền văn minh nào họ tình cờ ghé thăm vào thời điểm đó. Đúng như phong cách của mình, có vẻ như họ đang cố gắng liên lạc với chúng ta."
 first_contact_critters.75.desc.home:1 "Chúng ta đã giải mã được những thông điệp lặp đi lặp lại đầy khó hiểu mà §H[This.ContactCountry.GetName]§! gửi cho chúng ta, và hóa ra đó là... quảng cáo thương mại! Có vẻ như hệ sao [This.System.GetName] là hệ sao quê hương của một nhóm thương nhân du hành vũ trụ tự xưng là §H[This.ContactCountry.GetRealName]§!. Họ dường như kiếm sống bằng cách đưa ra những giao dịch tốt nhất — hoặc ít nhất là theo họ tự nhận — cho bất kỳ nền văn minh nào họ tình cờ ghé thăm vào lúc đó."
 first_contact_critters.75.B:0 "Đã hiểu."
 first_contact_critters.75.B.tooltip:0 "Chúng ta giờ đây sẽ có thể giao thương với các hạm đội thương buôn vào lần tới khi họ tiến vào biên giới của chúng ta."
 first_contact_critters.80.name:0 "Mảnh Vụn Không Gian Sống?"
 first_contact_critters.80.desc:1 "[This.Owner.GetEnvoyCap] [This.Leader.GetName] vẫn đang nỗ lực xác nhận giả thuyết rằng hiện tượng dị thường mà chúng ta định danh là §H[This.ContactCountry.GetName]§! trên thực tế là một sinh vật sống. Dù nó dường như được cấu thành từ một cụm bụi sao ngẫu nhiên, nó hoàn toàn có khả năng tự đẩy mình qua khoảng không và bộc lộ các dấu hiệu cơ bản của ý thức tự chủ. Các [This.Owner.GetResearchers] của chúng ta rất bối rối trước hiện tượng này, và đang tích cực làm việc để xác minh các chỉ số của chúng ta."
 first_contact_critters.80.A:0 "Chúng ta ắt hẳn đã bỏ sót điều gì đó..."
 first_contact_critters.90.name:0 "$first_contact_critters.70.name$"
 first_contact_critters.90.desc:0 "Các tàu thuyền được phát hiện trong hệ sao [This.System.GetName] dường như là một phần của một đoàn thám hiểm xuyên thiên hà với mục đích chưa rõ. Họ chưa thực hiện bất kỳ động thái thù địch nào, cũng không thấy có vũ khí hạng nặng nào. Tuy nhiên, họ khá kín tiếng và chúng ta không thể thu được nhiều tín hiệu từ họ. Các [This.Owner.GetLinguists] của chúng ta tin rằng cuối cùng họ sẽ có thể dịch được ngôn ngữ của đối phương từ những mẩu thông tin vụn vặt thu thập được. Dù vậy, việc này có thể mất khá nhiều thời gian."
 first_contact_critters.95.name:0 "Dân Du Mục"
 first_contact_critters.95.desc:0 "Chúng ta đã giải mã thành công ngôn ngữ của §H[This.ContactCountry.GetName]§! bí ẩn. Các [This.Owner.GetLinguists] của chúng ta đã bối rối trong một thời gian khá dài, và bước đột phá chỉ xuất hiện khi đối phương bắt đầu phát đi thông điệp chào mừng tự xưng là người §H\"Namarian\"§! về hướng của chúng ta. Có vẻ như giờ đây họ rất háo hức muốn nói chuyện với chúng ta."
 first_contact_critters.100.desc:0 "Hạm đội mà chúng ta chạm trán trong hệ sao [This.System.GetName] không giống bất kỳ thứ gì chúng ta từng thấy trong vùng không gian này trước đây. Nó dường như không hung hãn, nhưng chúng ta chỉ có thể suy đoán về nguồn gốc hoặc mục đích của nó tại đây. Phỏng đoán hợp lý nhất là hạm đội này đại diện cho một phe phái không có mối liên hệ chính thức nào với bất kỳ chính quyền hay nền văn minh địa phương nào."
 first_contact_critters.100.a:0 "Thận trọng tiến hành."
 first_contact_critters.105.name:0 "Hạm Đội Trung Lập"
 first_contact_critters.105.desc:0 "Chúng ta đã rơi vào bế tắc với hạm đội tự xưng là §H[This.ContactCountry.GetRealName]§!. Sự hiện diện bất thường này phớt lờ hầu hết các nỗ lực ngoại giao của chúng ta, nhưng chúng ta có thể suy đoán rằng nó đại diện cho một thực thể trung lập đứng tách biệt khỏi nền văn minh thiên hà.\n\nChúng ta nghi ngờ rằng nếu hạm đội này có chủ nhân theo nghĩa thông thường, thì sẽ cần phải dùng đến những biện pháp phi thường mới có thể tiếp cận được họ. Với suy nghĩ đó, chúng ta đã đúc kết các phát hiện của mình để các đội ngũ [this.owner.GetScientistPlural] tương lai sử dụng — phòng khi có cơ hội như vậy xuất hiện." # though we use a country tag here, the value it returns could be e.g. 'Unscrupulous Salvagers' OR 'Modified Probe', i.e. not a true country

 further_fc_tiyanki_completed:0 "Vì [This.ContactCountry.GetName] dường như thuộc cùng một loài cá voi vũ trụ, tiến trình tiếp xúc đầu tiên của chúng ta với họ cũng được tuyên bố hoàn tất.\n"
 further_fc_amoebas_completed:1 "Vì [This.ContactCountry.GetName] dường như thuộc cùng một loài Quần Thể Động Vật Không Gian, tiến trình tiếp xúc đầu tiên của chúng ta với họ cũng được tuyên bố hoàn tất.\n"
 further_fc_crystals_completed:0 "Vì [This.ContactCountry.GetName] dường như là các thực thể tinh thể tương tự như [Root.ContactCountry.GetName], tiến trình tiếp xúc đầu tiên của chúng ta với họ cũng được tuyên bố hoàn tất.\n"
 further_fc_drones_completed:0 "Vì [This.ContactCountry.GetName] dường như là một nhóm thiết bị bay khai khoáng tự động tương tự, tiến trình tiếp xúc đầu tiên của chúng ta với họ cũng được tuyên bố hoàn tất.\n"
 further_fc_caravaneers_completed:0 "Vì [This.ContactCountry.GetName] dường như là những thương buôn tương tự, cùng chủng loài với [Root.ContactCountry.GetSpeciesNamePlural], tiến trình tiếp xúc đầu tiên của chúng ta với họ cũng được tuyên bố hoàn tất.\n"
 further_fc_clouds_completed:0 "Vì [This.ContactCountry.GetName] dường như là những đám mây hư không tương tự như [Root.ContactCountry.GetName], tiến trình tiếp xúc đầu tiên của chúng ta với họ cũng được tuyên bố hoàn tất.\n"
 further_fc_pirates_completed:0 "Vì [This.ContactCountry.GetName] dường như là những tên cướp biển tương tự, tiến trình tiếp xúc đầu tiên của chúng ta với họ cũng được tuyên bố hoàn tất.\n"

