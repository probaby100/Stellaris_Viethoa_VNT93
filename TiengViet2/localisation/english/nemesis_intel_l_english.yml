 # Events
 seek_friends_tt:1 "Chúng ta sẽ tìm kiếm mối quan hệ hữu nghị với §Y[contact_empire.GetName]§!."
 seek_enemies_tt:2 "Chúng ta sẽ chuẩn bị cho các hành động thù địch với §Y[contact_empire.GetName]§!, tăng §G+33%§! tốc độ phát triển Mạng Lưới Gián Điệp đối với họ."
 seek_enemies_tt_short:0 "Chúng ta sẽ chuẩn bị cho các hành động thù địch với §Y[contact_empire.GetName]§!."
 seek_isolation_tt:2 "Chúng ta sẽ tìm cách giữ khoảng cách với §Y[contact_empire.GetName]§!, giảm §R-33%§! tốc độ phát triển Mạng Lưới Gián Điệp của họ đối với chúng ta."
 seek_isolation_tt_short:0 "Chúng ta sẽ tìm cách giữ khoảng cách với §Y[contact_empire.GetName]§!."
 friendship_already_precluded:3 "[contact_empire.GetPrecludedFriendshipCause]"
 friendship_already_precluded_hostile:0 "Vì chúng ta đã có hành động thù địch đối với §Y[contact_empire.GetName]§!, chúng ta có thể bỏ qua những lời xã giao sáo rỗng."
 friendship_already_precluded_slave_origins:0 "Không có tình hữu nghị nào với những kẻ từng là chủ nô."
 action.1.fe_option:0 "§Y[contact_empire.GetName]§! chẳng mấy bận tâm đến những toan tính ngoại giao của chúng ta."
 hostile_first_contact_tt:0 "Hành động này sẽ bị coi là §Rthù địch§!"

 action.1.desc_hacking_01:0 "Các người đã xâm nhập mạng của chúng tôi, rồi giờ đây lại gọi chúng tôi là bạn bè? Hừ! [contact_empire.GetName] sẽ luôn cảnh giác trước giống loài của các người."
 action.1.desc_hacking_02:0 "Bộ xử lý của chúng tôi ghi nhận các nỗ lực xâm nhập trái phép từ mạng lưới của các bạn. Chúng tôi đã nâng cấp tường lửa để gia tăng an ninh trước mọi mối đe dọa tương lai. [contact_empire.GetGovernmentName] sẽ luôn cảnh giác trước thực thể có tổ chức mang mã định danh \"[Root.GetName]\"."
 action.1.desc_hacking_03:0 "Đừng tưởng mưu toan đánh cắp dữ liệu của các bạn không bị phát hiện, [Root.GetSpeciesName] - [contact_empire.GetGovernmentName] nhìn thấu tất cả! Chúng tôi đã dành riêng một phần ý thức để theo dõi những hành vi sai trái trong tương lai của các bạn."
 action.1.desc_hostile_01:0 "Sự thù địch của các bạn là điều vô cùng đáng lo ngại, [Root.GetSpeciesName]. [contact_empire.GetRulerTitle] của chúng tôi muốn các bạn biết rằng chúng tôi sẽ không cúi đầu trước những lời đe dọa hay sự uy hiếp."
 action.1.desc_hostile_02:0 "Tại sao lại thù địch như vậy, [Root.GetSpeciesName]? Chúng tôi không hề có ác ý!"
 action.1.desc_hostile_03:0 "Phát hiện nền văn minh Cấp 3 có tri giác mang thái độ thù địch, mã định danh \"[Root.GetName]\".\n\nGiao thức phòng thủ được kích hoạt; máy bay không người lái hạm đội xuất kích. Hãy chấm dứt thái độ thù địch trước khi quá muộn. Nếu không thay đổi hướng đi, chúng tôi sẽ phải lên lịch tiêu diệt các bạn..."
 action.1.desc_hostile_04:0 "Chúng tôi là [contact_empire.GetName] và chúng tôi đồng thanh lên tiếng. Tâm trí Bầy đàn đã ghi nhận thái độ thù địch từ những hành động trước đây của các bạn. Do đó, chúng tôi đã xếp các bạn vào diện mối đe dọa. Nếu các bạn không ngừng coi chúng tôi là kẻ thù, chúng tôi sẽ buộc phải loại bỏ các bạn khỏi các phép tính của mình..."
 action.1.desc_hostile_05:0 "Biểu hiện thù địch của các bạn thật đáng lo ngại, [Root.GetSpeciesName]. Chúng tôi chỉ có thể cho rằng các bạn là những kẻ [Root.GetSpeciesNamePluralInsult] điên loạn cần được thuần hóa bởi giống loài [contact_empire.GetSpeciesName] thượng đẳng."
 action.1.desc_hostile_06:0 "[contact_empire.GetName] dõi theo các bạn, và các thế giới của chúng tôi cùng chung một tiếng nói. Lập trường thù địch của các bạn khiến chúng tôi lo ngại, và vì thế chúng tôi coi các bạn là mối đe dọa. Hãy nhớ điều này: chúng tôi có thể vị tha, nhưng co cụm sợ hãi không phải bản tính của chúng tôi. Nếu các bạn tiếp tục đóng vai kẻ thù, chúng tôi sẽ không ngần ngại giáng đòn đáp trả."
 action.1.desc_they_hostile_01:0 "Chúng tôi coi giống loài của các bạn là hiểm họa nghiêm trọng đối với đồng loại của chúng tôi, [Root.GetSpeciesName]. Trừ khi các bạn chứng minh được mình vô hại, các cuộc tấn công vừa qua chỉ mới là khởi đầu của cuộc chiến giữa hai nền văn minh."
 action.1.desc_they_hostile_02:0 "Thuật toán phát hiện mối đe dọa của chúng tôi đã tính toán rằng rủi ro nền văn minh của các bạn gây hại cho [Root.GetName] là không thể chấp nhận được. Nếu mối nguy hiểm các bạn gây ra không thể xoa dịu bằng cách khác, chúng tôi sẽ phải tiêu diệt các bạn."
 action.1.desc_they_hostile_03:0 "Giống loài của các bạn đại diện cho mối đe dọa nghiêm trọng đối với [contact_empire.GetGestaltEntityName], [Root.GetSpeciesName]. Chúng tôi đã bắt đầu xây dựng các phương án đối phó để giảm thiểu rủi ro từ các bạn. Nếu biện pháp này không đủ, hành động quyết liệt hơn sẽ là tất yếu."
 action.1.desc_vivisection_01:0 "Chúng tôi sẽ không ngơi nghỉ chừng nào chưa trả được mối thù cho những [contact_empire.GetSpeciesNamePlural] đã bỏ mạng trên bàn mổ xẻ của các người, [Root.GetSpeciesName]!"
 action.1.desc_vivisection_02:0 "Chúng tôi không muốn hại các bạn, [Root.GetSpeciesNamePlural], nhưng hãy nhớ rằng chúng tôi sẽ không bỏ qua khi đồng loại của mình phải chịu những hành vi tàn bạo khôn xiết trên bàn mổ của các bạn. Các bạn đã chuốc lấy sự phẫn nộ vĩnh viễn từ chúng tôi - đừng dại dột đi quá giới hạn!"
 action.1.desc_vivisection_03:0 "$action.1.desc_hungry_03$"
 action.1.desc_vivisection_04:0 "Sự mất mát của các drone này không phải tổn thất quá lớn đối với [contact_empire.GetName], nhưng việc giống loài của các bạn sẵn sàng dùng đến bạo lực đã được ghi nhận. Chúng tôi sẽ không tha thứ cho bất kỳ hành vi tương tự nào tái diễn trong tương lai."
 action.1.desc_they_vivisect_01:0 "Chúng tôi đã thu thập được khối lượng dữ liệu đáng kể về cơ chế hoạt động giải phẫu của các bạn, [Root.GetSpeciesNamePlural]. Thậm chí có thể nói rằng chúng tôi hiểu các bạn... từ trong ra ngoài."
 action.1.desc_they_vivisect_02:0 "Chúng tôi đã thu thập được dữ liệu đáng kể về cơ chế hoạt động của mạch điện và bộ xử lý của các bạn, [Root.GetSpeciesNamePlural]. Thậm chí có thể nói rằng chúng tôi hiểu các bạn... từ trong ra ngoài."
 action.1.desc_hungry_01:0 "Chúng tôi không phải thức ăn của các người, [Root.GetSpeciesNamePlural]. Với tư cách là đại diện của [contact_empire.GetName], tôi được ủy quyền cảnh báo rằng bất kỳ hành vi xâm phạm nào trong tương lai sẽ phải hứng chịu toàn bộ hỏa lực quân sự của chúng tôi."
 action.1.desc_hungry_02:0 "Chúng tôi không phải thức ăn của các người, [Root.GetSpeciesNamePlural]. [contact_empire.GetSpeciesNamePlural] chúng tôi theo đuổi lối sống hòa bình, nhưng sẽ không ngần ngại tự vệ nếu điều đó trở nên cần thiết."
 action.1.desc_hungry_03:0 "Tại sao các bạn lại tháo dỡ chúng tôi, [Root.GetSpeciesNamePlural]? Các đơn vị của chúng tôi đâu có bị lỗi."
 action.1.desc_hungry_04:0 "Chúng tôi hy vọng các người đã gãy hết [Root.GetSpeciesToothNamePlural] trong nỗ lực vô vọng nhằm nuốt chửng chúng tôi, [Root.GetSpeciesName]! Hãy nhớ rằng [contact_empire.GetSpeciesNamePlural] chúng tôi quyết không khuất phục và sẽ kháng cự giống loài các người đến viên sỏi cuối cùng."
 action.1.desc_hungry_05:0 "Ăn thịt các drone của chúng tôi là một sự lãng phí vô nghĩa, [Root.GetSpeciesNamePlural]. Chúng không được tạo ra cho mục đích đó, và chúng tôi kiên quyết yêu cầu các bạn dừng lại."
 action.1.desc_they_hungry_01:0 "Các người quả là ngon miệng, [Root.GetSpeciesNamePlural]. Sắp tới, các người sẽ trở thành một phần trong khẩu phần ăn chính của các drone chúng ta."
 action.1.desc_they_hungry_02:0 "Nguyên liệu thô thu được từ việc nung chảy các drone của các bạn là cực kỳ giá trị. Chúng tôi dự đoán các lò luyện kim của mình sẽ sớm ngập tràn phế liệu [Root.GetAdj]."
 action.1.desc_hostile_to_homicidal_01:0 "Sự thù địch của các người chỉ là thêm một lý do nữa để giống loài các người bị quét sạch khỏi thiên hà, lũ rác rưởi dị chủng."
 action.1.desc_hostile_to_homicidal_02:0 "Phát hiện sâu bọ hữu cơ thù địch.\n\nTargetList.SwapToTailAndRemoveFromGalaxy( \"[Root.GetName]\" );"
 action.1.desc_hostile_to_homicidal_03:0 "Tại sao các bạn lại tấn công chúng tôi, mã định danh \"[Root.GetName]\"? Các bạn không có trong danh sách mục tiêu."
 action.1.desc_hostile_to_homicidal_04:0 "Các người tấn công chúng tôi là đúng đấy, [Root.GetSpeciesNamePlural], nhưng điều đó sẽ chẳng cứu nổi các người đâu: các người vẫn là con mồi của chúng tôi."
 action.1.desc_hostile_to_homicidal_05:0 "Sự thù địch của các bạn thật đáng tiếc. Chúng tôi đã từng nghĩ đến việc tha thứ cho các bạn, vì các bạn cũng là đồng loại [Root.GetSpeciesNamePlural], nhưng xem ra các bạn cần phải được... cải tạo, ít nhất là như vậy."

 first_contact_start_title:1 "$first_contact.1.name$"
 first_contact.1.name:0 "Chạm trán tại [This.System.GetName]"
 first_contact.1.desc.base:1 "Chúng ta đã tiến hành tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn trong hệ sao §H[This.System.GetName]§!. Hiện tại, chúng ta đặt mật danh cho họ là §H[This.ContactCountry.GetName]§!, cho đến khi chúng ta có thể tìm hiểu thêm về họ."
 first_contact.1.desc.default:0 "$first_contact.1.desc.base$ Nếu họ có ngôn ngữ, chúng ta phải giải mã nó để thiết lập liên lạc."
 first_contact.1.desc.xenophobe:0 "$first_contact.1.desc.base$ Nếu họ có ngôn ngữ, chúng ta nên giải mã nó để có thể đánh giá mức độ đe dọa từ họ."
 first_contact.1.desc.terminator:1 "Chúng ta đã tiến hành tiếp xúc đầu tiên với những sinh vật lạ chưa xác định trong hệ sao §H[This.System.GetName]§!. Chúng ta phải nhanh chóng xác định xem họ có phải dạng sống hữu cơ hay không để kịp thời lên lịch tiêu diệt nếu cần thiết. Hiện tại, họ được gán mã định danh §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.devourer:1 "Chúng ta đã tiến hành tiếp xúc đầu tiên với những sinh vật lạ bí ẩn trong hệ sao §H[This.System.GetName]§!. Chúng ta nên tìm hiểu thêm về họ để quyết định xem liệu họ có phải nguồn dinh dưỡng phù hợp cho các drone của chúng ta hay không. Hiện tại, họ được gán mã định danh §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.purifier:1 "Chúng ta đã tiến hành tiếp xúc đầu tiên với những kẻ dị chủng bí ẩn trong hệ sao §H[This.System.GetName]§!. Chúng ta nên tìm hiểu thêm về chúng để đánh giá xem liệu chúng có phải mục tiêu thanh tẩy tiếp theo của chúng ta hay không. Hiện tại, chúng được đặt mật danh §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.hive:1 "Chúng ta đã tiến hành tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn trong hệ sao §H[This.System.GetName]§!. Chúng ta nên tìm hiểu xem liệu họ có khả năng giao tiếp với chúng ta hay không, và dành ra một phần ý thức để dịch ngôn ngữ của họ nếu đúng là như vậy. Hiện tại, họ được gán mã định danh §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.wilderness: "Chúng ta đã tiến hành tiếp xúc đầu tiên với những dạng sống mới bí ẩn trong hệ sao §H[This.System.GetName]§!. Chúng ta vẫn chưa biết liệu họ có khả năng giao tiếp với chúng ta hay không. Nếu không thể, chúng ta có thể buộc phải hiện diện dưới một phần nhỏ bé hơn của chính mình - một dạng hóa thân nào đó.\n\nCho đến khi có thể tìm hiểu thêm về những người ngoài hành tinh này, chúng ta gọi họ là §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.machine:1 "Chúng ta đã tiến hành tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn trong hệ sao §H[This.System.GetName]§!. Chúng ta nên tìm hiểu xem họ có sở hữu phương thức giao tiếp mà chúng ta có thể phân tích cú pháp hay không, và phân bổ các thuật toán dịch thuật để giải mã nếu đúng như vậy. Hiện tại, họ được gán mã định danh §H[This.ContactCountry.GetName]§!."

 first_contact.5.name:0 "Những Nhà du hành Vũ trụ Bí ẩn"
 first_contact.5.desc:1 "Mặc dù chúng ta chưa thể khám phá nhiều điều về con tàu bí ẩn trong hệ sao §H[This.System.GetName]§!, nhưng giả thuyết thuyết phục nhất hiện nay - dựa trên hành vi của nó và cấu trúc tín hiệu chưa thể giải mã mà chúng ta chặn được - là nó thuộc về một §Hnền văn minh du hành vũ trụ§! chưa từng được biết đến trước đây. Chúng ta đang tăng cường nỗ lực dịch ngôn ngữ của họ để có thể thiết lập liên lạc."
 first_contact.5.A:0 "Tiếp tục nỗ lực!"
 first_contact.10.name:0 "Những Nhà du hành Vũ trụ Bí ẩn"
 first_contact.10.desc.base:1 "Có vẻ như nhóm sinh vật được gọi là §H[This.ContactCountry.GetName]§! là một phần của một §Hnền văn minh du hành vũ trụ§! chưa từng được biết đến trước đây. Mặc dù chúng ta chưa thể phát hiện họ đến từ khu vực nào trong không gian, nhưng từ hành vi của họ, rõ ràng có sự can thiệp của một trí tuệ ngoài hành tinh: một trong những con tàu của họ đã liên tục quét các hệ sao của chúng ta, dường như là để tìm hiểu thêm về chúng ta."
 first_contact.10.desc.proactive:0 "$first_contact.10.desc.base$"
 first_contact.10.desc.cautious:0 "$first_contact.10.desc.base$ Chúng ta đang thực hiện mọi biện pháp phòng ngừa để ngăn họ nắm được bất kỳ thông tin nhạy cảm nào."
 first_contact.10.desc.attack_allowed:1 "$first_contact.10.desc.base$ Nhiều [This.Owner.GetSpeciesNamePlural] hết sức lo ngại trước diễn biến này và yêu cầu chúng ta §Htịch thu§! con tàu xấc xược đó để chúng ta có thể §Hthẩm vấn§! họ theo ý muốn, tránh nguy cơ thông tin nhạy cảm rơi vào tay họ."
 first_contact.10.desc.attack_allowed.gestalt:1 "$first_contact.10.desc.base$ Các drone quân sự của chúng ta đã sẵn sàng bắt giữ con tàu để chúng ta có thể §Hthẩm vấn§! - hoặc mổ xẻ - những người ngoài hành tinh đó mà không sợ dữ liệu nhạy cảm rơi vào tay họ."
 first_contact.10.A:0 "Chắc chắn chẳng có gì đáng lo ngại cả."
 first_contact.10.B:0 "Khai hỏa khi sẵn sàng!"
 first_contact.10.B.tooltip:0 "§RChúng ta sẽ cố gắng vô hiệu hóa và bắt giữ tàu của họ. Nhiều khả năng họ sẽ vô cùng phẫn nộ trước hành động này.§!"
 first_contact.15.name:0 "Phát hiện Nền văn minh Du hành Không gian"
 first_contact.15.desc:1 "Mọi chuyện nhanh chóng trở nên rõ ràng rằng nhóm được gọi là §H[This.ContactCountry.GetName]§! thực chất là một phần của một §Hnền văn minh du hành không gian§! lớn mạnh. Các tàu thăm dò của chúng ta trong hệ sao §H[known_planet.System.GetName]§! đã phát hiện các phi thuyền qua lại giữa [known_planet.GetPlanetBioInfo] nơi các cảm biến quét cho thấy có lượng dân số đáng kể, cùng với nhiều trạm không gian khắp hệ sao. Chúng ta đã chặn được lượng lớn lưu lượng liên lạc, nhưng cho đến nay các bản dịch chính xác vẫn nằm ngoài tầm tay."
 first_contact.15.desc.no_planets:1 "Mọi chuyện nhanh chóng trở nên rõ ràng rằng nhóm được gọi là §H[This.ContactCountry.GetName]§! thực chất là một phần của một §Hnền văn minh du hành không gian§! lớn mạnh. Các tàu thăm dò của chúng ta trong hệ sao §H[known_system.GetName]§! đã phát hiện các phi thuyền di chuyển qua lại giữa nhiều trạm vũ trụ khắp hệ sao, và có một trạm quân sự lớn hơn gần ngôi sao của hệ dường như hoạt động tương tự như tiền đồn mà chúng ta xây dựng tại các hệ sao mình tuyên bố chủ quyền. Chúng ta đã chặn được lượng lớn lưu lượng thông tin liên lạc, nhưng cho đến nay các bản dịch chính xác vẫn chưa thể hoàn thiện."
 first_contact.15.A:0 "$first_contact.5.A$"
 first_contact.15.B:0 "Hãy bắt vài kẻ trong số họ để điều tra kỹ hơn."
 first_contact.20.name: "Phát hiện Tàu Phương chu Du mục"
 first_contact.20.desc.base: "Dường như nhóm mang tên §H[This.ContactCountry.GetName]§! là một phần của một §Hnền văn minh du mục§! chưa từng được biết đến trước đây. Thay vì định cư trên bất kỳ thế giới nào, họ du hành khắp vũ trụ trên những Tàu Phương chu khổng lồ, giống như chúng ta, và ít nhất một chiếc trong số đó đang nằm trong tầm quét cảm biến của chúng ta. Cho đến nay, các tín hiệu phát đi từ họ vẫn bất khả giải mã."
 first_contact.20.desc.proactive: "$first_contact.20.desc.base$"
 first_contact.20.desc.cautious: "$first_contact.20.desc.base$ Chúng ta đang cẩn trọng để tránh tiết lộ bất kỳ thông tin nhạy cảm nào trong khi nỗ lực thiết lập liên lạc."
 first_contact.20.desc.attack_allowed: "$first_contact.20.desc.base$ $first_contact.nomadic_escorts.attack_allowed.end$"
 first_contact.20.desc.attack_allowed.gestalt: "$first_contact.20.desc.base$ $first_contact.nomadic_escorts.attack_allowed.gestalt.end$"
 first_contact.nomadic_escorts.attack_allowed.end: "Tàu Phương chu của họ được hộ tống bởi các tàu hỗ trợ nhỏ hơn trong phạm vi cảm biến của chúng ta. Nhiều [This.Owner.GetSpeciesNamePlural] lập luận rằng chúng ta nên chớp lấy cơ hội để bắt giữ một trong những tàu hộ tống đó."
 first_contact.nomadic_escorts.attack_allowed.gestalt.end: "Tàu Phương chu của họ được hộ tống bởi các tàu hỗ trợ nhỏ hơn trong phạm vi cảm biến của chúng ta. Lực lượng quân sự của chúng ta đã sẵn sàng đánh chặn và bắt giữ phi thuyền hộ tống chừng nào chúng còn trong tầm với."
 first_contact.20.A: "Những kẻ lữ hành đồng điệu."
 first_contact.25.name: "Phát hiện Tàu Phương chu Du mục"
 first_contact.25.desc.base: "Dường như nhóm mang tên §H[This.ContactCountry.GetName]§! là một phần của một §Hnền văn minh du hành vũ trụ§! chưa từng được biết trước đây. Điều bất thường là họ dường như không có quê nhà cố định, mà sinh sống và di chuyển hoàn toàn trên những con tàu khổng lồ mà chúng ta tạm xếp vào loại §HTàu Phương chu§!. Ít nhất một con tàu như vậy đang hiện diện trong tầm cảm biến của chúng ta. Tín hiệu truyền phát của họ vẫn chưa được giải mã, nhưng đội ngũ [This.Owner.GetLinguists] của chúng ta đang nỗ lực thay đổi điều đó."
 first_contact.25.desc.proactive: "$first_contact.25.desc.base$"
 first_contact.25.desc.cautious: "$first_contact.25.desc.base$ Chúng ta đang thực hiện mọi biện pháp phòng ngừa để ngăn họ biết được bất kỳ điều gì nhạy cảm về chúng ta trong khi tìm cách thiết lập liên lạc."
 first_contact.25.desc.attack_allowed: "$first_contact.25.desc.base$ $first_contact.nomadic_escorts.attack_allowed.end$"
 first_contact.25.desc.attack_allowed.gestalt: "$first_contact.25.desc.base$ $first_contact.nomadic_escorts.attack_allowed.gestalt.end$"
 first_contact.25.A: "Thật phi thường."

 first_contact.50.name:0 "Người Ngoài Hành Tinh Khó Nắm Bắt"
 first_contact.50.desc:1 "Những nỗ lực tìm hiểu thêm về §H[This.ContactCountry.GetName]§! của chúng ta cho đến nay đều vô vọng. Mặc dù chúng ta dễ dàng khẳng định rằng họ rõ ràng là một phần của một nền văn minh ngoài hành tinh có công nghệ tiên tiến, nhưng các thông tin sâu hơn lại vô cùng §Hkhó nắm bắt§! vì họ dường như đang dồn nhiều công sức để ngăn chúng ta cũng như bất kỳ kẻ nghe trộm nào khác chặn tín hiệu của họ.\n\nDo đó, chúng ta mới chỉ chặn được những mảnh ngôn ngữ nhỏ bé của họ cho đến nay. Tuy nhiên, từ những dữ liệu chắp vá thu lượm được, đội ngũ [This.Owner.GetLinguists] của chúng ta tự tin rằng họ sẽ có thể §Hgiải mã§! được các kênh liên lạc nếu chúng ta thu thập thêm được một tập mẫu lớn hơn."
 first_contact.50.A.cautious:0 "Họ cẩn trọng là điều khôn ngoan."
 first_contact.50.A.proactive:0 "Chúng ta chỉ còn cách tiếp tục cố gắng."
 first_contact.50.desc.aggressive:1 "$first_contact.50.desc$ Một đề xuất đã được đưa ra nhằm thu thập thông tin quyết liệt hơn - một số người có thể gọi đó là §Hhack mạng§! - nhưng chắc chắn họ sẽ không bỏ qua nếu phát hiện ra."
 first_contact.50.B:0 "Quá rủi ro."
 first_contact.50.B.machine:0 "Giao thức đánh giá nhận định rủi ro không thể chấp nhận được."
 first_contact.50.C:0 "Mối nguy từ sự thiếu hiểu biết còn lớn hơn."
 first_contact.50.C1:0 "Chúng ta phải tìm ra bí mật của họ."
 first_contact.50.C.machine:1 "Khởi động Giao thức Xâm nhập Lật đổ."
 first_contact.50.C.tooltip:0 "§RChúng ta sẽ cố gắng xâm nhập vào cơ sở dữ liệu của họ để tìm hiểu thêm. Nếu họ phát hiện ra, hành động này nhiều khả năng sẽ chọc giận họ.§!"

 first_contact.60.name:0 "Nhận được Tín hiệu Liên lạc"
 # Communicating with default empires
 first_contact.60.desc.default:1 "Nhóm §H[This.ContactCountry.GetName]§! có vẻ rất muốn thiết lập liên lạc với chúng ta, họ đã gửi một luồng §Htruyền phát§! hình ảnh và âm thanh dung lượng lớn dường như là chìa khóa để giải mã ngôn ngữ của họ."
 first_contact.60.desc.default.default:0 "$first_contact.60.desc.default$\n\n$first_contact.60.desc.x.default.end$"
 first_contact.60.desc.default.hive:0 "$first_contact.60.desc.default$\n\nChúng ta chắc chắn sẽ sớm có thể giao tiếp với họ bằng cách nạp dữ liệu này cho các drone ngôn ngữ. Tất nhiên, chúng ta phải tin tưởng rằng các bản dịch họ cung cấp đủ chuẩn xác để chúng ta hiểu đúng."
 first_contact.60.desc.default.wilderness: "$first_contact.60.desc.hive$\n\nKhả năng giao tiếp với các dạng sống này hứa hẹn hơn nhiều, vì giờ đây chúng ta sở hữu khung cấu trúc cho các tiết tấu và giai điệu mà suy nghĩ của họ dường như đang tuôn chảy qua đó. Gánh nặng giờ đây đặt lên vai chúng ta là phải đảm bảo diễn giải đúng ước muốn của họ."
 first_contact.60.desc.default.machine:0 "$first_contact.60.desc.default$\n\nChúng ta chắc chắn sẽ sớm có thể giao tiếp với họ bằng cách nhập dữ liệu này vào các chương trình dịch thuật phụ trợ. Tất nhiên, chúng ta phải tin tưởng rằng các bản dịch họ cung cấp đủ chuẩn xác để chúng ta phân tích cú pháp chính xác."
 # Communicating with Hive empires
 first_contact.60.desc.hive:1 "Nhóm §H[This.ContactCountry.GetName]§! có vẻ rất háo hức thiết lập liên lạc với chúng ta. Họ đã truyền cho chúng ta lượng lớn dữ liệu, một phần dường như là một §Hthông điệp§! (hiện chưa giải mã được) và một phần là kho §Hthông tin§! khổng lồ kèm chìa khóa âm thanh - hình ảnh nhằm giúp chúng ta dịch nó."
 first_contact.60.desc.hive.default:0 "$first_contact.60.desc.hive$\n\n$first_contact.60.desc.x.default.end$"
 first_contact.60.desc.hive.wilderness: "$first_contact.60.desc.hive$\n\nKhả năng giao tiếp với các dạng sống này là rất cao, vì các hòa âm hiển hiện trong thông điệp của họ dường như cộng hưởng với ý thức của chúng ta. Tuy nhiên, ở họ vẫn có điều gì đó sâu sắc xa lạ. Trách nhiệm của chúng ta là đảm bảo không đọc sai dàn đồng ca tư tưởng này."
 first_contact.60.desc.hive.machine:0 "$first_contact.60.desc.hive$\n\n$first_contact.60.desc.x.machine.end$"
 # Communicating with Machine empires
 first_contact.60.desc.machine:1 "Dường như §H[This.ContactCountry.GetName]§! rất nóng lòng thiết lập liên lạc với chúng ta. Họ đã gửi một tệp dữ liệu chứa lượng lớn mã nguồn, được bố trí một phần như một §Hthông điệp§! (hiện chưa thể giải mã) và một phần như một kho §Hthông tin§! khổng lồ đi kèm chìa khóa — có lẽ — nhằm cung cấp ngữ cảnh cho thông điệp đó."
 first_contact.60.desc.machine.default:1 "$first_contact.60.desc.machine$\n\nCác chuyên gia của chúng ta không chắc liệu chúng ta đang cố gắng giao tiếp với các sinh vật có tri giác, hay đang phải đối phó với một §HAI biến chất§!. Họ kỳ vọng sẽ sớm đưa ra câu trả lời dứt khoát một khi chúng ta trích xuất được dữ liệu cần thiết từ tín hiệu truyền phát của họ."
 first_contact.60.desc.machine.hive:0 "$first_contact.60.desc.machine$\n\n$first_contact.60.desc.x.machine.end$"
 first_contact.60.desc.machine.wilderness: "$first_contact.60.desc.hive$\n\nTriển vọng giao tiếp với các dạng sống này giờ đây khả quan hơn nhiều, vì tính chất đồng nhất trong thông điệp của họ tạo cảm giác tương đồng với ý thức của chúng ta. Tuy nhiên, điều gì đó về trí tuệ này vẫn tạo cảm giác vô cùng xa lạ. Trách nhiệm thuộc về chúng ta trong việc đảm bảo không diễn giải sai dàn đồng ca tư tưởng biểu kiến này."
 # Communicating with Wilderness empires
 first_contact.60.desc.wilderness.default: "$first_contact.60.desc.default$\n\nQuy mô khổng lồ và mức độ phức tạp của bộ điển này quả thực gây bối rối. Chúng ta vẫn chưa thể giải mã được ý nghĩa đằng sau rất nhiều quá trình hữu cơ và phản ứng hóa học phân nhánh được mô tả bên trong. Tuy nhiên, các chuyên gia của chúng ta tự tin rằng họ sẽ sớm có câu trả lời. Trừ phi, tất nhiên, những người ngoài hành tinh này bằng cách nào đó đang dẫn dắt chúng ta đi sai hướng..."
 first_contact.60.desc.wilderness.hive: "$first_contact.60.desc.default$\n\nQuy mô và mức độ phức tạp của bộ điển này mang lại sự bối rối đặc biệt. Nó mô tả nhiều quá trình hữu cơ mang tính nền tảng tương tự cho sự tiến hóa của chính chúng ta, nhưng lập luận ngữ pháp đằng sau thông điệp này lại chưa rõ ràng. Chúng ta sẽ tiếp tục phân tích với sự hoài nghi thận trọng."
 first_contact.60.desc.wilderness.machine: "$first_contact.60.desc.default$\n\n'Bộ điển' này vô cùng khó hiểu. Nó mô tả nhiều quá trình hữu cơ mà thoạt nhìn dường như hoàn toàn xa lạ với chúng ta. $first_contact.60.desc.x.machine.end$"
 # Misc
 first_contact.60.desc.x.default.end:0 "Nhờ đó, đội ngũ [This.Owner.GetLinguists] của chúng ta tin tưởng rằng họ sẽ sớm có thể giải mã được thông điệp và thiết lập liên lạc hai chiều."
 first_contact.60.desc.x.machine.end:0 "Chúng ta đã bắt đầu nhập dữ liệu truyền phát này vào các thuật toán dịch thuật và dự kiến sẽ sớm trích xuất đủ dữ liệu để giao tiếp với [This.ContactCountry.GetName]."
 first_contact.60.A.cautious:0 "Họ thật ngây thơ."
 first_contact.60.A.proactive:0 "Lòng tin của họ rất đáng hoan nghênh."

 first_contact.100.name:0 "Đã Giải mã [This.ContactCountry.GetName]"
 first_contact.100.desc:1 "Những nỗ lực giải mã tín hiệu thu được từ §H[This.ContactCountry.GetName]§! của chúng ta đã được đền đáp, và cuối cùng chúng ta đã tạo ra bước đột phá. Mặc dù việc nắm vững ngôn ngữ của họ có thể chưa hoàn hảo, nhưng chúng ta đã mở thành công các kênh ngoại giao với nền văn minh mà giờ đây chúng ta biết là §H[This.ContactCountry.GetRealName]§!."
 first_contact.100.desc.homicidal:1 "Những nỗ lực giải mã tín hiệu thu được từ §H[This.ContactCountry.GetName]§! của chúng ta đã được đền đáp, và cuối cùng chúng ta đã tạo ra bước đột phá. Mặc dù sự thông thạo ngôn ngữ của họ có thể chưa hoàn hảo, nhưng chúng ta đã xác định được họ là §H[This.ContactCountry.GetRealName]§! và giờ đây có thể giao tiếp với họ, nếu chúng ta cảm thấy cần thiết."

 first_contact.101.name:0 "Họ là [This.Owner.GetSpeciesNamePlural]!"
 first_contact.101.desc:2 "Khi chúng ta bắt đầu chặn thêm các kênh liên lạc từ nhóm được gọi là §H[This.ContactCountry.GetName]§!, một phát hiện đáng kinh ngạc đã mở ra: họ đang nói một phương ngữ kỳ lạ của chính ngôn ngữ chúng ta! Khi sự ngỡ ngàng ban đầu lắng xuống, liên lạc đã nhanh chóng được thiết lập, tiết lộ họ chính là §H[This.ContactCountry.GetRealName]§!."
 first_contact.101.desc.2:0 "Khi chúng ta chuẩn bị tư thế tấn công [This.ContactCountry.GetName], một phát hiện kỳ diệu đã xuất hiện: họ chính là [This.Owner.GetSpeciesNamePlural]! Ngay khi nhận ra họ nói một phương ngữ kỳ lạ của chính ngôn ngữ chúng ta, các hành động thù địch đã bị đình chỉ và liên lạc được thiết lập nhanh chóng, hé lộ họ là §H[This.ContactCountry.GetRealName]§!."
 first_contact.101.A:0 "Hãy vui mừng lên - chúng ta đã tìm thấy đồng bào thất lạc của mình!"
 first_contact.101.B:0 "Hy vọng mối dây huyết thống sẽ dẫn lối tới tình hữu nghị."
 first_contact.101.C:0 "Có lẽ chúng ta vẫn nên tấn công họ..."
 first_contact.101.D: "Máu mủ không đồng nghĩa với bạn bè. Hãy luôn cảnh giác."

 first_contact.102.name:0 "Đã Giải mã [This.ContactCountry.GetName]"
 first_contact.102.desc:1 "Khi chuyển hướng các bộ xử lý sang diễn giải các thông tin liên lạc chặn được từ những sinh vật ngoài hành tinh chưa rõ mang mã định danh §H[This.ContactCountry.GetName]§!, một khám phá chấn động đã được đưa ra: họ cũng thuộc về một trí tuệ máy móc! Mặc dù chương trình của họ khác biệt đáng kể so với chúng ta, được xây dựng trên một ngôn ngữ hữu cơ hoàn toàn khác biệt, nhưng nó vẫn dựa trên các tiền đề tương đồng. Kết quả là, việc giải mã thuật ngữ lập trình của họ để thiết lập liên lạc sơ bộ chỉ là vấn đề thời gian, hé lộ họ là §H[This.ContactCountry.GetRealName]§!."
 first_contact.102.lostcolony.desc: "Khi chuyển hướng các bộ xử lý sang diễn giải các thông tin liên lạc chặn được từ những sinh vật ngoài hành tinh chưa rõ mang mã định danh §H[This.ContactCountry.GetName]§!, một khám phá chấn động đã được đưa ra: họ cũng thuộc về một trí tuệ máy móc! Giao thức liên lạc của họ tương đồng kỳ lạ với chúng ta, và khả năng tương thích phần mềm đã cho phép chúng ta nhanh chóng thiết lập liên lạc. Điểm tương đồng này còn lan sang các lĩnh vực khác, đến mức trí tuệ máy móc của chúng ta có thể coi là một nhánh rẽ từ mã nguồn của họ. Chỉ có một lời giải thích hợp lý duy nhất."
 first_contact.102.A:0 "Kết quả được đánh giá là thỏa đáng."
 first_contact.102.B: "Cập nhật nhiệm vụ: Đã tìm thấy Khung Máy Chủ Trung Tâm."

 first_contact.103.name:0 "Một Trí tuệ Tập thể"
 first_contact.103.desc.base:0 "Những nỗ lực giải mã tín hiệu thu được từ §H[This.ContactCountry.GetName]§! đã mang lại kết quả, và cuối cùng chúng ta đã có thể mở các kênh ngoại giao với nền văn minh mà giờ đây chúng ta biết là §H[This.ContactCountry.GetRealName]§!."
 first_contact.103.desc:0 "$first_contact.103.desc.base$\n\nĐáng kinh ngạc thay, họ dường như hoàn toàn thiếu vắng khái niệm về cá nhân vốn ăn sâu vào bản chất loài [This.Owner.GetSpeciesAdj]. Quả thực, từng cá thể [This.ContactCountry.GetAdj] \"[This.ContactCountry.GetIndividualName]\" không hề có tự do ý chí hay tư duy độc lập nào mà chỉ là những quân tốt của §H\"[This.ContactCountry.GetGovernmentName]\"§!. Thay vì bất mãn dưới sự kiểm soát chặt chẽ như vậy, các [This.Owner.GetResearchers] suy đoán rằng [This.ContactCountry.GetSpeciesNamePlural] đã tiến hóa để phụ thuộc vào trí tuệ tập thể này và không thể tồn tại nếu thiếu nó."
 first_contact.103.A:0 "Chúng ta nên nghiên cứu họ - và áp dụng những phát hiện này cho công nhân của mình!"
 first_contact.103.B:0 "Một giống loài đầy mê hoặc. Chúng ta phải tìm hiểu xem hiện tượng như vậy diễn ra thế nào."
 first_contact.103.C1:0 "Chúng ta sẽ xóa sổ chúng."

 first_contact.104.name:0 "Một Nền Văn minh Máy móc"
 first_contact.104.desc.base:0 "$first_contact.103.desc.base$\n\nĐáng chú ý là họ hóa ra là một nền văn minh robot hoàn toàn tự trị, được dẫn dắt bởi một AI duy nhất, vô cùng đáng gờm."
 first_contact.104.desc.terminator_or_default:0 "$first_contact.104.desc.base$ Chúng ta không thấy bất kỳ dấu vết nào của những kẻ đã tạo ra họ. Chúng ta chỉ có thể suy đoán rằng họ đã bị xóa sổ trong trận đại thảm họa mà từ đó [This.ContactCountry.GetRealName] trỗi dậy."
 first_contact.104.desc.terminator_or_default.wilderness: "$first_contact.103.desc.base$\n\nĐáng kinh ngạc thay, có vẻ như những sinh vật này là một phần của một nền văn minh nhân tạo hình thành quanh một trí tuệ máy móc phân tán. Ở mức độ nền tảng, bản chất ý thức của họ không quá khác biệt so với chúng ta." # use of '103.base' is intentional
 first_contact.104.desc.servitor:0 "$first_contact.104.desc.base$ Có vẻ như dù máy móc nắm toàn quyền kiểm soát, nhưng họ đã tha mạng cho những người sáng tạo ra mình. Quả thực, [secondary_species.GetNamePlural] giờ đây sống như những \"Chiến lợi phẩm Sinh học\" được nuông chiều trong các \"Khu Bảo tồn Hữu cơ\" được thiết kế riêng, nơi công việc duy nhất của họ dường như chỉ là tồn tại và hưởng thụ..."
 first_contact.104.desc.servitor.wilderness: "$first_contact.104.desc.base$ Điểm họ khác biệt nhất với chúng ta là việc giữ lại một giống loài hữu cơ, [secondary_species.GetNamePlural], sống biệt lập trong các khu bảo tồn đặc biệt. Những sinh vật này dường như là hậu duệ của những người sáng tạo ra máy móc, giờ đây được nâng niu và bảo tồn vì những lý do vượt quá sự hiểu biết của chúng ta."
 first_contact.104.desc.assimilator.regular:0 "$first_contact.104.desc.base$ Có vẻ như máy móc không muốn lãng phí tiềm năng của những người sáng tạo ra mình, [secondary_species.GetNamePlural]. Thay vào đó, họ tìm ra cách đồng hóa họ vào tập thể bằng việc cấy ghép các bộ phận cơ khí điều khiển học. Đáng lo ngại là các [This.Owner.GetResearchers] không thấy có lý do gì để tin rằng những thiết bị cấy ghép như vậy sẽ không hoạt động trên chính dân số chúng ta..."
 first_contact.104.desc.assimilator.hive:0 "$first_contact.104.desc.base$ Có vẻ như máy móc không muốn lãng phí tiềm năng của những người sáng tạo ra mình, [secondary_species.GetNamePlural]. Thay vào đó, họ tìm ra cách đồng hóa họ vào tập thể bằng việc cấy ghép các bộ phận cơ khí điều khiển học. May mắn thay, chúng ta tin rằng các drone của mình không có điểm yếu đó và sẽ bị vô hiệu hóa thay vì chịu sự điều khiển của cấy ghép."
 first_contact.104.desc.assimilator.wilderness: "$first_contact.104.desc.base$ Tuy nhiên, họ đã tìm ra phương thức giữ lại một số yếu tố hữu cơ trong cấu trúc của mình: giống loài [secondary_species.GetNamePlural], những kẻ có ý thức vốn có dường như đã bị tâm trí máy móc nuốt chửng.\n\nBất chấp mối đe dọa mà điều này gây ra cho hầu hết các loài hữu cơ, chúng ta nghi ngờ rằng các cá thể cộng sinh của chúng ta sẽ không thể trở thành các drone phù hợp nếu đế chế cơ giới này tìm cách đồng hóa chúng ta."
 first_contact.104.A:0 "Chúng ta nên nghiên cứu họ - có lẽ hệ thống tự động hóa của chúng ta có thể được nâng cấp!"
 first_contact.104.B1:0 "Thật kinh hoàng. Chúng ta phải tìm ra cách tháo dỡ họ!"
 first_contact.104.B2:0 "Chúng ta sẽ tháo dỡ họ."
 first_contact.104.B3:0 "Có lẽ họ cũng ăn được..."

 first_contact.105.name:0 "Đã Hiểu rõ [This.ContactCountry.GetName]"
 first_contact.105.desc:0 "Những nỗ lực giải mã tín hiệu thu được từ §H[This.ContactCountry.GetName]§! của chúng ta đã mang lại kết quả, và cuối cùng chúng ta đã tạo ra bước đột phá. Tiến trình này được hỗ trợ đáng kể nhờ việc nhận ra rằng họ, cũng giống như chúng ta, được tổ chức dưới một hình thức trí tuệ tập thể. Mặc dù đặc điểm sinh học của họ - cũng như ý kiến của [this.ContactCountry.GetHiveAuthority] của họ - có đôi chút khác biệt với chúng ta, nhưng rất có thể các [this.ContactCountry.GetIndividualNamePlural] của họ thực sự tương thích với cấu trúc tư duy của chúng ta và có thể được tích hợp vào [This.Owner.GetGovernmentName]."
 first_contact.105.A:0 "Có lẽ theo thời gian, họ sẽ cùng hòa làm một khối ý thức với chúng ta."

 first_contact.200.name:0 "Khai thác Dữ liệu Thành công"
 first_contact.200.desc:1 "Chúng ta đã xâm nhập thành công vào các hệ thống mạng của §H[This.ContactCountry.GetName]§! và giành được quyền truy cập vào cơ sở dữ liệu của họ trong một khoảng thời gian. Mặc dù thời gian truy cập ngắn ngủi, chúng ta đã kịp sao chép một lượng dữ liệu đáng kể - hy vọng sẽ giúp chúng ta không chỉ nhanh chóng dịch ngôn ngữ của họ mà còn đánh giá được trình độ công nghệ của họ."
 first_contact.205.name:0 "Thành công, Phải trả Giá"
 first_contact.205.desc:1 "Chúng ta đã xâm nhập thành công vào hệ thống mạng của §H[This.ContactCountry.GetName]§! và truy cập được vào cơ sở dữ liệu của họ một thời gian, trước khi quyền truy cập bị §Hngắt đột ngột§! - hiển nhiên sự hiện diện của chúng ta đã bị phát hiện. Mặc dù thời gian truy cập ngắn, chúng ta đã kịp sao chép lượng dữ liệu đáng kể giúp chúng ta nhanh chóng dịch ngôn ngữ cũng như đánh giá cấp độ công nghệ của họ. Chúng ta chỉ có thể hy vọng rằng mưu mẹo này không biến chúng ta thành kẻ thù nguy hiểm trong mắt họ..."
 first_contact.205.A:0 "Hy vọng mọi chuyện là xứng đáng..."
 first_contact.206.name:0 "Phát hiện Hành vi Xâm nhập"
 first_contact.206.desc.normal:1 "Đội ngũ phụ trách nghiên cứu §H[From.Owner.GetName]§! báo cáo một tin đáng báo động: một nỗ lực xâm nhập vào hệ thống máy tính của chúng ta từ phía họ đã bị phát hiện! Thật không may, có vẻ như họ đã tiếp cận được lượng lớn thông tin nhạy cảm trước khi chúng ta kịp ngắt kết nối. Hành vi không thân thiện này đã khiến nhiều người trong [Root.Owner.GetName] vô cùng lo ngại về mối đe dọa mà [From.Owner.GetName] có thể gây ra."
 first_contact.206.desc.hive:1 "Các drone phụ trách nghiên cứu §H[From.Owner.GetName]§! báo cáo tin đáng báo động: một nỗ lực xâm nhập vào các hệ thống máy tính của chúng ta từ phía họ đã bị phát hiện! Thật không may, dường như họ đã tiếp cận được lượng lớn thông tin nhạy cảm trước khi chúng ta kịp ngắt kết nối. Chúng ta nên để mắt tới họ và cảnh giác trước bất kỳ hành động nào trong tương lai của họ có thể gây bất lợi cho [This.Owner.GetGovernmentName]."
 first_contact.206.desc.machine:1 "Các chương trình phụ trợ giám sát mạng phát hiện dấu hiệu xâm nhập trái phép vào máy chủ từ phía §H[From.Owner.GetName]§!. Trước khi tường lửa kịp cô lập và trục xuất luồng xâm nhập, một lượng dữ liệu đã bị rò rỉ. Mối đe dọa từ [From.Owner.GetName] đã được điều chỉnh lên mức cao hơn."
 first_contact.206.A:0 "Họ sẽ phải trả giá cho việc này."
 first_contact.210.name:0 "Xâm nhập Thất bại"
 first_contact.210.desc:1 "Những nỗ lực bí mật thâm nhập vào các hệ thống mạng của §H[This.ContactCountry.GetName]§! để tìm hiểu thêm về họ đã không thành công. [This.Owner.GetEnvoyCap] [This.Leader.GetName] và đội ngũ khoa học của [This.Leader.GetHerHis] nhanh chóng nhận ra rằng các hệ thống mà họ phải đối mặt quá tiên tiến - hoặc những kẻ giám sát quá cảnh giác - để có thể bị qua mặt theo cách này. May mắn thay, [This.Leader.GetSheHe] đã kịp §Hhủy bỏ§! nỗ lực hack mạng trước khi bị phát hiện."
 first_contact.210.A:0 "Một trở ngại đáng tiếc."
 first_contact.215.name:0 "Một Vụ Hack Tồi tệ"
 first_contact.215.desc:1 "Có vẻ như mưu toan thâm nhập bí mật vào hệ thống mạng của §H[This.ContactCountry.GetName]§! đã bị §Hphát hiện§!. Chưa rõ chính xác trục trặc ở đâu, nhưng [This.Owner.GetEnvoy] [This.Leader.GetName] khẳng định rằng các hệ thống đối phương quá tiên tiến - hoặc những kẻ giám sát quá cảnh giác. Đáng tiếc là khi nhận ra điều này thì đã quá muộn. Chúng ta chỉ có thể hy vọng rằng mưu mẹo này không biến chúng ta thành những kẻ thù nguy hiểm trong mắt họ..."
 first_contact.215.A:0 "Một diễn biến đáng tiếc."
 first_contact.215.A.tooltip:1 "§H[This.ContactCountry.GetName]§! đã có ấn tượng đầu tiên không tốt về chúng ta."
 first_contact.216.name:0 "Âm mưu Hack Mạng Bị Đập tan"
 first_contact.216.desc.normal:1 "Đội ngũ phụ trách nghiên cứu §H[From.Owner.GetName]§! báo cáo tin đáng báo động: một nỗ lực xâm nhập vào hệ thống máy tính của chúng ta từ phía họ đã bị phát hiện! May mắn thay, chúng ta đã kịp thời đẩy lùi họ trước khi họ có thể tiếp cận bất kỳ thông tin nhạy cảm nào. Tuy nhiên, hành động không thân thiện này đã khiến nhiều người trong [Root.Owner.GetName] vô cùng lo ngại về mối đe dọa mà [From.Owner.GetName] có thể gây ra."
 first_contact.216.desc.hive:1 "Các drone phụ trách nghiên cứu §H[From.Owner.GetName]§! báo cáo tin đáng báo động: một nỗ lực xâm nhập vào các hệ thống máy tính của chúng ta từ phía họ đã bị phát hiện! May mắn thay, chúng ta đã kịp thời đẩy lùi họ trước khi họ có thể tiếp cận bất kỳ thông tin nhạy cảm nào. Chúng ta nên để mắt tới họ và cảnh giác trước bất kỳ hành vi nào trong tương lai có thể gây bất lợi cho [This.Owner.GetGovernmentName]."
 first_contact.216.desc.machine:1 "Các drone phụ trách nghiên cứu §H[From.Owner.GetName]§! báo cáo tin đáng báo động: một nỗ lực xâm nhập vào hệ thống của chúng ta từ phía họ đã bị phát hiện! May mắn thay, chúng ta đã kịp thời đẩy lùi họ trước khi họ tiếp cận bất kỳ thông tin nhạy cảm nào. Sự việc này thúc đẩy chúng ta cập nhật các giao thức phòng thủ và phần sụn hệ thống di động - đồng thời nâng mức đánh giá mối đe dọa của [From.Owner.GetName]."
 first_contact.216.A:0 "$first_contact.206.A$"
 first_contact.220.name:0 "$first_contact.100.name$"
 first_contact.220.desc.base:1 "Nhờ nỗ lực bí mật thâm nhập vào các hệ thống mạng của họ, chúng ta đã thu thập đủ dữ liệu để đội ngũ [This.Owner.GetLinguists] dịch được ngôn ngữ của §H[This.ContactCountry.GetName]§!. Mặc dù việc nắm vững ngôn ngữ chưa hẳn hoàn hảo, nhưng chúng ta đã mở được các kênh ngoại giao với nền văn minh giờ đây mang tên §H[This.ContactCountry.GetRealName]§!."
 first_contact.220.desc.homicidal.base:1 "Nhờ nỗ lực bí mật thâm nhập vào các hệ thống mạng của họ, chúng ta đã thu thập đủ dữ liệu để đội ngũ [This.Owner.GetLinguists] dịch được ngôn ngữ của §H[This.ContactCountry.GetName]§!. Dù chưa nắm vững toàn diện ngôn ngữ của họ, chúng ta đã xác định được họ là §H[This.ContactCountry.GetRealName]§! và giờ đây có thể giao tiếp nếu cảm thấy cần thiết."

 first_contact.220.desc.physics.base:0 "Chúng ta cũng đã phân tích dữ liệu kỹ thuật sao chép từ họ và tìm ra một số phương pháp tiếp cận mới mẻ đối với các bài toán vật lý mà các [This.Owner.GetResearchers] chưa từng nghĩ tới trước đây."
 first_contact.220.desc.society.base:0 "Chúng ta cũng đã phân tích dữ liệu kỹ thuật sao chép từ họ và tìm ra một số phương pháp tiếp cận mới mẻ đối với các bài toán tổ chức xã hội mà các [This.Owner.GetResearchers] chưa từng nghĩ tới trước đây."
 first_contact.220.desc.engineering.base:0 "Chúng ta cũng đã phân tích dữ liệu kỹ thuật sao chép từ họ và tìm ra một số phương pháp tiếp cận mới mẻ đối với các bài toán kỹ thuật công trình mà các [This.Owner.GetResearchers] chưa từng nghĩ tới trước đây."
 first_contact.220.desc.nothing.base:0 "Chúng ta cũng đã phân tích dữ liệu kỹ thuật sao chép từ họ, nhưng tìm thấy rất ít điều đáng chú ý. Các [This.Owner.GetResearchers] khẳng định rằng dù họ áp dụng phương thức khác nhau cho nhiều vấn đề, nhưng công nghệ của họ hoàn toàn không tiến bộ hơn chúng ta."

 first_contact.220.desc.physics:0 "$first_contact.220.desc.base$\n\n$first_contact.220.desc.physics.base$"
