 first_contact.262.desc.machine_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta - một nhóm drone cơ khí tương tự chúng ta - $first_contact.262.desc.gestalt.end$"
 first_contact.262.desc.hive_enemy.normal:0 "$first_contact.252.desc.normal.start$ Bất chấp nỗ lực quả cảm của thủy thủ đoàn, những kẻ tấn công - các sinh vật ngoài hành tinh [From.Owner.Species.GetClass] di chuyển với sự phối hợp đáng sợ - đã áp đảo phòng tuyến của chúng ta.\n\n$first_contact.262.desc.normal.end$"
 first_contact.262.desc.hive_enemy.machine:0 "$first_contact.252.desc.machine.start$\n\nNhững kẻ tấn công chúng ta - một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass] di chuyển với sự phối hợp cho thấy một trí tuệ thống nhất như chúng ta - $first_contact.262.desc.gestalt.end$"
 first_contact.262.desc.hive_enemy.hive:0 "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một nhóm sinh vật ngoài hành tinh [From.Owner.Species.GetClass] di chuyển với sự phối hợp chặt chẽ cho thấy một trí tuệ thống nhất như chúng ta - $first_contact.262.desc.gestalt.end$"
 first_contact.262.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nNhững kẻ tấn công chúng ta, một nhóm sinh vật ngoài hành tinh [from.owner.species.GetClass], đã nhanh chóng áp đảo phòng tuyến sau khi nhắm vào những phần mà chúng nhận diện là sự sống. Để tự bảo tồn, chúng ta buộc phải cắt đứt liên kết với tất cả những ai trên tàu, cô lập họ khỏi dàn hợp xướng. Bất chấp sự hung hãn, những kẻ xâm lăng sẽ học được rất ít từ chúng ta.\n\nMột hành động xâm phạm trắng trợn đã nhắm vào chúng ta, nhưng giờ đây ít nhất chúng ta cũng hiểu rõ hơn về các hiểm họa rình rập ngoài vũ trụ."

 first_contact.272.name:0 "Bạo lực trong Lần Tiếp xúc Đầu tiên"
 first_contact.272.desc:1 "Một con tàu chúng ta cử đi điều tra [From.Owner.GetName] đã bị phá hủy trong một cuộc tấn công bạo lực từ lực lượng của họ. Chưa rõ liệu họ tìm cách bắt giữ con tàu hay đơn thuần muốn gửi thông điệp cảnh cáo chúng ta hãy tránh xa lãnh thổ của họ."
 first_contact.272.B:0 "Họ sẽ được trả thù!"
 first_contact.282.name:0 "Thoát Trong Gang Tấc"
 first_contact.282.desc:1 "Tàu §H[ship_to_seize.GetName]§!, con tàu chúng ta cử đi điều tra §H[From.Owner.GetName]§!, đã suýt nữa không thoát khỏi một cuộc tấn công tàn bạo từ lực lượng của họ. Dường như họ có ý định bắt giữ tàu để thẩm vấn thủy thủ đoàn, nhằm tạo ưu thế trong các hành động thù địch tiếp theo. Rất may, [ship_to_seize.GetName] đã kịp kích hoạt FTL khẩn cấp trước khi quá muộn."
 first_contact.282.desc.gestalt:1 "Tàu §H[ship_to_seize.GetName]§!, con tàu chúng ta cử đi điều tra §H[From.Owner.GetName]§!, đã suýt không thoát khỏi một cuộc tấn công tàn bạo từ lực lượng của họ. Dường như họ tính bắt giữ tàu và đánh cắp công nghệ của chúng ta nhằm tạo ưu thế cho các đợt tấn công thù địch tiếp theo. Thật may, [ship_to_seize.GetName] đã kịp kích hoạt FTL khẩn cấp trước khi quá muộn."
 first_contact_fleets_mia_tooltip:0 "Các hạm đội khác của chúng ta trong khu vực dường như là lãnh thổ của họ đã tìm kiếm an toàn bằng cách kích hoạt FTL khẩn cấp."

 first_contact.285.name:0 "Hoàn tất Thẩm vấn"
 first_contact.285.desc:0 "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! vừa bắt được. Ban đầu các con tin bất hợp tác, nhưng theo thời gian họ đã vô tình để lộ manh mối về ngôn ngữ, cho đến khi chúng ta có thể giao tiếp cơ bản. Từ thời điểm đó, chúng ta nhanh chóng ghép nối các chi tiết về họ, cuối cùng truy cập được vào hệ thống máy tính khi một trong những con tin hợp tác khai báo.\n\nNhờ thông tin thu thập được, chúng ta đã xác định được họ là §H[This.ContactCountry.GetRealName]§! và tích lũy được lượng tình báo đáng kể về các hoạt động cũng như năng lực của họ."
 first_contact.285.desc.weak:0 "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! vừa bắt được. Các con tin có ý chí yếu ớt và không có ý định ngăn cản chúng ta tìm hiểu về họ; quả thực, họ vô cùng hợp tác. Chúng ta đã nhanh chóng dịch được ngôn ngữ và truy cập hệ thống máy tính của họ.\n\nNhờ đó, chúng ta xác định được họ là §H[This.ContactCountry.GetRealName]§! và tích lũy lượng tình báo đáng kể về hoạt động và năng lực của họ."
 first_contact.285.desc.strong:0 "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! vừa bắt được. Các con tin thể hiện sự ngoan cố đáng nể, chống lại ngay cả những biện pháp thẩm vấn thuyết phục nhất. Tuy nhiên theo thời gian, họ đã vô tình hé lộ manh mối ngôn ngữ, cho phép chúng ta giao tiếp cơ bản và cuối cùng bẻ khóa hệ thống máy tính của họ.\n\nNhờ đó, chúng ta xác định được họ là §H[This.ContactCountry.GetRealName]§! và tích lũy lượng tình báo đáng kể về hoạt động cũng như năng lực của họ."
 first_contact.285.desc.machine_victim:0 "Chúng ta đã hoàn tất việc kiểm tra các drone cơ khí thu giữ từ §H[This.ContactCountry.GetName]§!. Không có sự chỉ dẫn của AI quản lý, các drone này tỏ ra thụ động và dễ dàng kết nối dữ liệu. Bằng cách nghiên cứu mã nguồn của chúng, chúng ta đã dịch được phương ngữ máy móc của chúng.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.285.desc.hive_victim:0 "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! bắt giữ gần đây. Có vẻ như chúng thực sự được tổ chức như một §Htâm trí bầy đàn§!, với các đơn vị cá thể thiếu quyền tự chủ hoặc ý thức độc lập. Bị tách rời khỏi thực thể mẹ, các đơn vị trở nên mất phương hướng và chết dần từng con một, không cung cấp được nhiều thông tin hữu ích ngoại trừ việc làm mẫu vật sinh học vô thức.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.285.desc.wilderness_victim.intro: "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! bắt giữ gần đây. Quần thể vô số dạng sống này được tổ chức như một dạng tâm trí bầy đàn, dẫu không có thực thể quản trị trung tâm. Thay vào đó, những cá thể hầu như không có tri giác này dường như tạo thành một §Hthể thống nhất hỗ sinh§! với toàn bộ quần xã sinh vật của chúng."
 first_contact.285.desc.wilderness_victim: "$first_contact.285.desc.wilderness_victim.intro$ Kể từ khi bị tách khỏi thực thể điều khiển, các tù nhân này ngày càng trở nên hoang dại và nguyên thủy. Bất chấp sự thoái hóa này, chúng ta vẫn phân tích được cấu trúc tín hiệu sinh học của họ và thu được manh mối về nền văn minh gốc của họ.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.285.desc.gestalt_end:0 "May mắn thay, chúng ta đã bẻ khóa được hệ thống máy tính của họ, và đội ngũ [This.Owner.GetLinguists] của chúng ta đã nhanh chóng dịch được các tín hiệu họ dùng để liên lạc. Nhờ đó, chúng ta giờ đây có thể nhận diện §H[This.ContactCountry.GetName]§! là §H[This.ContactCountry.GetRealName]§! và tích lũy được khối lượng tình báo đáng kể về các hoạt động cũng như năng lực của họ."
 first_contact.290.name:0 "Hoàn tất Nghiên cứu Dị chủng"
 first_contact.290.desc:0 "Chúng ta đã hoàn tất nghiên cứu các sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! vừa bắt được. Các con tin từ chối hợp tác, nhưng điều đó trở nên vô nghĩa khi chúng ta bắt đầu mổ xẻ họ. Chúng ta giờ đây đã hiểu rõ các chức năng nội tại của [This.ContactCountry.GetSpeciesOrganNamePlural], [This.ContactCountry.GetSpeciesEarNamePlural], [This.ContactCountry.GetSpeciesHandNamePlural] và các bộ phận cơ thể khác của họ, cung cấp cho các nhà di truyền học [This.Owner.GetResearchers] những §Hdữ liệu sinh học dị chủng§! vô cùng giá trị.\n\nKinh hãi trước sự tàn khốc trong hành động của chúng ta, một số ít người ngoài hành tinh - hiện chúng ta biết là §H[This.ContactCountry.GetSpeciesNamePlural]§! - đã chịu hợp tác khi chúng ta tìm cách dịch ngôn ngữ và truy cập hệ thống máy tính của họ. Nhờ vậy, chúng ta hiện có lượng tình báo đáng kể để triển khai đối phó với họ khi cần."
 first_contact.290.desc.wilderness_victim: "$first_contact.285.desc.wilderness_victim.intro$\n\nKể từ khi bị cô lập khỏi đồng loại cũng như thế giới quê hương, những sinh vật cộng sinh này đã thoái hóa về trạng thái nguyên thủy và nhanh chóng chết đi, khiến việc khám nghiệm tử thi trở nên khá dễ dàng. $first_contact.290.desc.hive_victim.main$\n\n$first_contact.290.desc.hive_victim.end$"
 first_contact.290.desc.hive_victim.intro: "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! bắt giữ gần đây. Có vẻ như chúng thực sự được tổ chức như một §Htâm trí bầy đàn§!, với các đơn vị cá thể thiếu khả năng tự chủ hoặc ý chí độc lập. Dù chúng tỏ ra là những đối tượng vô dụng trong việc thẩm vấn, nhưng điều đó chẳng còn quan trọng khi chúng ta bắt đầu tiến hành giải phẫu chúng."
 first_contact.290.desc.hive_victim.main:0 "Giờ đây chúng ta đã hiểu rất nhiều về các chức năng nội tại của [This.ContactCountry.GetSpeciesOrganNamePlural], [This.ContactCountry.GetSpeciesEarNamePlural], [This.ContactCountry.GetSpeciesHandNamePlural] và các bộ phận cơ thể khác của họ, mang lại cho các nhà di truyền học [This.Owner.GetResearchers] những §Hdữ liệu sinh học dị chủng§! quý giá."
 first_contact.290.desc.hive_victim.end:0 "Chúng ta hiện đã biết cách giao tiếp với đế chế mẹ của họ, §H[This.ContactCountry.GetRealName]§!."
 first_contact.290.desc.hive_victim:0 "$first_contact.290.desc.hive_victim.intro$ $first_contact.290.desc.hive_victim.main$ $first_contact.290.desc.hive_victim.end$"
 first_contact.290.desc.hive_victim.no_vessel:0 "$first_contact.290.desc.hive_victim.intro$ $first_contact.290.desc.hive_victim.main$\n\nDù mất nhiều thời gian hơn dự kiến, nhưng kiến thức sinh học thu được cùng nhiều manh mối khác nhau khi bắt cóc các drone đã cho phép chúng ta giải mã ngôn ngữ - cùng các mã máy tính của họ. $first_contact.290.desc.hive_victim.end$"
 first_contact.290.desc.machine_victim:0 "Chúng ta đã hoàn tất việc tháo dỡ và phân tích các drone cơ khí của §H[This.ContactCountry.GetName]§!. Chúng ta đã nắm vững sơ đồ mạch điện và kiến trúc xử lý của chúng, cho phép chúng ta giải mã ngôn ngữ giao tiếp của chúng và xác định đế chế chủ quản là §H[This.ContactCountry.GetRealName]§!."
 first_contact.290.A:0 "Một kết quả vô cùng mỹ mãn."
 first_contact.295.name:1 "Đã Nghiên cứu Vật liệu Dị chủng"
 first_contact.295.desc:1 "Chúng ta đã hoàn tất việc nghiên cứu con tàu vừa bắt giữ từ [This.ContactCountry.GetName]. Sự vắng bóng của thủy thủ đoàn còn sống khiến cuộc điều tra của chúng ta gặp nhiều thách thức. May mắn thay, họ đã để lại đủ tài liệu để các [This.Owner.GetLinguists] của chúng ta dần giải mã ngôn ngữ của họ và nhận diện họ là §H[This.ContactCountry.GetRealName]§!, cho phép chúng ta liên lạc với họ nếu muốn. Hơn nữa, chúng ta đã có thể nghiên cứu §Hcông nghệ§! trên con tàu của họ, giúp các [This.Owner.GetResearchers] của chúng ta khám phá ra một số hướng tiếp cận mới mẻ cho các bài toán nghiên cứu của chính mình."
 first_contact.295.desc.no_ship:1 "Chúng ta đã hoàn tất việc nghiên cứu trang thiết bị vừa thu giữ từ [This.ContactCountry.GetName]. Việc điều tra là một thử thách khi không có mẫu vật sống nào để thẩm vấn. May mắn thay, họ đã để lại đủ tài liệu để các [This.Owner.GetLinguists] của chúng ta dần giải mã ngôn ngữ của họ và nhận diện họ là §H[This.ContactCountry.GetRealName]§!, cho phép chúng ta liên lạc với họ nếu muốn. Hơn nữa, chúng ta đã có thể nghiên cứu §Hcông nghệ§! của họ, giúp các [This.Owner.GetResearchers] của chúng ta khám phá ra một số hướng tiếp cận mới mẻ cho các bài toán nghiên cứu của chính mình."
 first_contact.295.A:0 "Một công việc hoàn thành xuất sắc."
 gain_asset_internal_organs:0 "Hiểu biết của chúng ta về các cơ quan nội tạng của chúng sẽ rất hữu ích trong các §HHoạt Động Ngầm§!\n"


 first_contact.1100.desc:0 "Chúng ta đã kết luận nghiên cứu các thiết bị thu giữ gần đây từ §H[contact_country.GetName]§!. Dù việc điều tra là thử thách lớn khi không có mẫu vật sống để thẩm vấn, nhưng tiến độ đã được đẩy nhanh hơn khi kênh liên lạc với [contact_country.GetSpeciesNamePlural] được khai mở. Đội ngũ [Root.GetResearchers] của chúng ta đã có thể nghiên cứu §Hcông nghệ§! của họ, giúp chúng ta tìm ra những hướng tiếp cận mới mẻ cho các bài toán nghiên cứu của chính mình."

 first_contact.1105.desc:0 "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[contact_country.GetAdj]§! vừa bắt được. Các con tin từ chối hợp tác, nhưng điều này trở nên vô nghĩa khi chúng ta tiến hành mổ xẻ họ. Giờ đây chúng ta đã hiểu biết rất nhiều về các chức năng nội tại của [contact_country.GetSpeciesOrganNamePlural], [contact_country.GetSpeciesEarNamePlural], [contact_country.GetSpeciesHandNamePlural] và các bộ phận cơ thể khác của họ, mang lại cho các nhà di truyền học [Root.GetResearchers] những §Hdữ liệu sinh học dị chủng§! quý giá.\n\nKinh hãi trước sự tàn bạo của chúng ta, một số ít người [contact_country.GetSpeciesNamePlural] đã chịu hợp tác khi chúng ta dịch ngôn ngữ và truy cập hệ thống máy tính của họ. Nhờ đó, chúng ta có được lượng tình báo đáng kể để triển khai chống lại họ khi cần."
 first_contact.1105.desc.hive_victim:0 "Chúng ta đã hoàn tất việc nghiên cứu các sinh vật ngoài hành tinh §H[contact_country.GetAdj]§! vừa bắt được. Như đã thấy rõ khi họ mở liên lạc với chúng ta, họ quả thực được tổ chức thành một §Htâm trí bầy đàn§!, với các drone cá thể thiếu quyền tự chủ hoặc ý chí độc lập. Dù họ không phải đối tượng hữu ích để thẩm vấn, nhưng điều này trở nên vô nghĩa khi chúng ta bắt đầu mổ xẻ họ. Giờ đây chúng ta đã biết rất nhiều về chức năng nội tại của [contact_country.GetSpeciesOrganNamePlural], [contact_country.GetSpeciesEarNamePlural], [contact_country.GetSpeciesHandNamePlural] và các bộ phận khác, mang lại cho các nhà di truyền học [Root.GetResearchers] những §Hdữ liệu sinh học dị chủng§! quý báu.\n\nDù mất nhiều thời gian hơn mong đợi, kiến thức sinh học thu được đã giúp chúng ta giải mã ngôn ngữ - và mã máy tính của họ. Giờ đây chúng ta nắm giữ lượng tình báo đáng kể để triển khai đối phó với họ nếu cần!"
 first_contact.1105.desc.machine_victim:0 "Chúng ta đã kết luận việc nghiên cứu các cỗ máy §H[contact_country.GetAdj]§! bắt giữ gần đây. Khi bị tách khỏi AI mẹ, các drone thiếu khả năng tự chủ và tự thân không cung cấp được nhiều thông tin hữu ích. Khi chúng ta bắt đầu tháo dỡ chúng, chúng ta đã đạt được nhiều tiến triển hơn - cả trong việc thấu hiểu chức năng nội tại lẫn tìm hiểu thêm về họ. Hóa ra các bộ xử lý của họ không thể chống lại các kỹ thuật thu thập dữ liệu can thiệp sâu của chúng ta, khiến cho rất ít điều về họ còn là bí mật.\n\nGiờ đây chúng ta nắm giữ lượng tình báo đáng kể để triển khai chống lại AI mẹ của họ, §H[contact_country.GetName]§!, nếu chúng ta thấy phù hợp."

 first_contact.1110.desc:0 "Chúng ta đã kết luận việc nghiên cứu các sinh vật ngoài hành tinh §H[contact_country.GetAdj]§! vừa bắt được. Ban đầu các con tin không chịu hợp tác, nhưng một khi liên lạc được thiết lập với [contact_country.GetName], chúng ta đã có thể đẩy nhanh tiến độ hơn nhiều. Không lâu sau, chúng ta đã có thể \"thuyết phục\" họ cho phép chúng ta truy cập hệ thống máy tính của họ.\n\nNhờ thông tin thu thập được từ họ, chúng ta đã tích lũy lượng tình báo đáng kể về hoạt động và năng lực của họ."
 first_contact.1110.desc.weak:0 "Các tù nhân §H[contact_country.GetAdj]§! đã nhanh chóng khai báo mọi điều họ biết. Việc thẩm vấn diễn ra thuận lợi ngoài mong đợi."
 first_contact.1110.desc.strong:0 "Chúng ta đã kết luận việc nghiên cứu các sinh vật ngoài hành tinh §H[contact_country.GetAdj]§! vừa bắt được. Các con tin tỏ ra kiên quyết không hợp tác, kháng cự ngay cả những phương pháp thẩm vấn thuyết phục nhất của các điều tra viên. Tuy nhiên, một khi liên lạc được thiết lập với [contact_country.GetName], chúng ta đã đạt được một số tiến triển - bao gồm quyền truy cập vào một số hệ thống máy tính cơ bản của họ - dẫu chúng ta nghi ngờ rằng họ vẫn còn giấu giếm nhiều chi tiết. Không lâu sau, chúng ta đã có thể \"thuyết phục\" họ cho phép chúng ta truy cập các hệ thống máy tính.\n\nNhờ thông tin thu thập được từ họ, chúng ta đã tích lũy lượng tình báo đáng kể về hoạt động và năng lực của họ."
 first_contact.1110.desc.machine_victim:0 "Chúng ta đã kết luận nghiên cứu các cỗ máy §H[contact_country.GetAdj]§! thu giữ gần đây. Một khi bị cắt đứt khỏi AI mẹ, các drone thiếu quyền tự chủ, và chúng ta khai thác được rất ít điều hữu ích từ chúng khi các chức năng suy giảm nhanh chóng.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.1110.desc.hive_victim:0 "Chúng ta đã hoàn tất nghiên cứu các sinh vật ngoài hành tinh §H[contact_country.GetAdj]§! vừa bắt giữ. Khi họ mở liên lạc với chúng ta, rõ ràng họ được tổ chức thành một §Htâm trí bầy đàn§!, với các drone cá thể thiếu quyền tự chủ hay ý chí độc lập. Bị cắt đứt khỏi cơ thể mẹ, các drone tỏ ra mất phương hướng và lần lượt chết đi, không mang lại nhiều thông tin hữu ích ngoại trừ làm mẫu vật sinh học ngoài ý muốn.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.1110.desc.gestalt_end:0 "May mắn thay, các hệ thống máy tính thu được đã giúp chúng ta giải mã toàn bộ mạng lưới liên lạc của họ."

 first_contact.320.name:0 "Đã Bắt giữ Người Ngoài Hành Tinh"
 first_contact.320.desc.end:0 "Mặc dù chiến dịch diễn ra suôn sẻ và các đặc vụ của chúng ta đã trốn thoát mà không bị truy đuổi, nhưng thật viển vông nếu hy vọng rằng §H[This.ContactCountry.GetName]§! không hay biết gì về hành động của chúng ta."
 first_contact.320.desc.planet.normal.normal:0 "Một đội đặc nhiệm bí mật quả cảm đã trốn thoát khỏi lãnh thổ §H[This.ContactCountry.GetName]§! cùng những con tin bắt giữ từ một trong các thuộc địa của họ tại hệ sao §H[abduction_planet.System.GetName]§!. Đội đã đổ bộ xuống một khu vực hẻo lánh dưới màn đêm, bắt giữ một số người ngoài hành tinh còn sống cùng một kho phần cứng kỹ thuật quý giá.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.normal.machine:0 "Một đội đặc nhiệm bí mật quả cảm đã trốn thoát khỏi lãnh thổ §H[This.ContactCountry.GetName]§! cùng các mẫu vật bắt giữ từ thuộc địa của họ tại hệ sao §H[abduction_planet.System.GetName]§!. Họ đổ bộ dưới màn đêm và ngạc nhiên phát hiện cư dân thực chất là §Hdrone cơ khí§!. Dù vậy, họ đã bắt giữ được vài drone nguyên vẹn cùng kho phần cứng kỹ thuật lớn.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.gestalt.normal:0 "Một phân đội drone đặc nhiệm bí mật do [This.Leader.GetName] chỉ huy đã đổ bộ xuống khu vực hẻo lánh trên thuộc địa của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_planet.System.GetName]§!. Chúng đã bắt giữ được một số người ngoài hành tinh còn sống cùng lượng lớn phần cứng kỹ thuật trước khi rút lui an toàn.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.hive.machine:0 "Một phân đội drone đặc nhiệm do [This.Leader.GetName] chỉ huy đã đổ bộ xuống thuộc địa của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_planet.System.GetName]§!. Thật bất ngờ, cư dân tại đây thực chất là các drone cơ khí. Phân đội đã bắt sống nhiều drone nguyên vẹn cùng phần cứng kỹ thuật trước khi đào thoát.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.machine.machine:0 "Một phân đội drone đặc nhiệm do [This.Leader.GetName] chỉ huy đã đáp xuống thuộc địa của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_planet.System.GetName]§!. Họ nhanh chóng nhận ra cư dân là các drone cơ giới - có lẽ do một AI tương tự [This.Owner.GetGovernmentName] của chúng ta điều hành. Không nản lòng, họ đã bắt giữ vài drone nguyên vẹn cùng kho thiết bị kỹ thuật trước khi trốn thoát.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.normal.normal:0 "Một đội đặc nhiệm bí mật đã thoát khỏi lãnh thổ §H[This.ContactCountry.GetName]§! cùng một tàu chở hàng bị đánh chặn tại hệ sao §H[abduction_system.GetName]§!. Cùng với thủy thủ đoàn bị bắt sống gần như toàn bộ, phần lớn phần cứng và hệ thống máy tính của con tàu cũng không bị thiệt hại đáng kể.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.normal.machine:0 "Một đội đặc nhiệm quả cảm đã thoát khỏi lãnh thổ §H[This.ContactCountry.GetName]§! cùng một tàu chở hàng bị đánh chặn tại hệ sao §H[abduction_system.GetName]§!. Thật ngạc nhiên, con tàu được vận hành hoàn toàn bởi các §Hdrone cơ khí§! - có lẽ được dẫn dắt bởi một AI biến chất. Đội đặc nhiệm đã vô hiệu hóa và bắt giữ chúng với tổn hại tối thiểu, giữ nguyên vẹn hầu hết hệ thống máy tính.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.gestalt.normal:0 "Một phân đội drone tác chiến ngầm do [This.Leader.GetName] chỉ huy đã bắt giữ một tàu hậu cần nhỏ của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_system.GetName]§!. Toàn bộ thủy thủ đoàn bị bắt sống và phần cứng con tàu được bảo toàn gần như nguyên vẹn.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.hive.machine:0 "Một phân đội drone do [This.Leader.GetName] chỉ huy đã bắt giữ tàu hậu cần của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_system.GetName]§!. Bất ngờ thay, tàu chỉ do các §Hdrone cơ khí§! vận hành. Phân đội đã vô hiệu hóa và bắt giữ chúng mà không gây tổn hại lớn cho máy tính của tàu.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.machine.machine:0 "Một phân đội drone do [This.Leader.GetName] chỉ huy đã chiếm đoạt một tàu hậu cần của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_system.GetName]§!. Con tàu do các drone cơ giới vận hành, có lẽ dưới quyền một AI giống như §H[This.Owner.GetGovernmentName]§! của chúng ta. Đội ngũ đã bắt giữ chúng và giữ nguyên vẹn phần cứng.\n\n$first_contact.320.desc.end$"
 first_contact.320.A:0 "Thẩm vấn các con tin."
 first_contact.320.A2:0 "Họ sẽ phải giao nộp bí mật của mình."
 first_contact.320.A.tooltip:0 "Các hạm đội của chúng ta trong lãnh thổ của họ đã rút chạy để tránh các đòn trả đũa."
 first_contact.320.C.homicidal_tooltip:0 "Chúng ta cũng sẽ điều tra các thiết bị thu giữ được để tìm kiếm manh mối về họ.\n"
 first_contact.321.name:0 "Một Tai nạn Trớ trêu"
 first_contact.321.desc.mega_oops:0 "Một đội đặc nhiệm dũng cảm - nhưng có lẽ không được thông minh cho lắm - đã thoát khỏi lãnh thổ §H[This.ContactCountry.GetName]§! cùng những con tin bắt được từ một thuộc địa tại hệ sao §H[abduction_planet.System.GetName]§!. Lợi dụng bóng đêm, họ đã đổ bộ và bắt giữ vài mẫu vật sinh vật có vú to lớn với những đốm hoa đen trắng, những con vật hoàn toàn không kháng cự.\n\nChỉ sau đó chúng ta mới nhận ra rằng những sinh vật này không hề phát ra âm thanh nào giống với các tín hiệu của [This.ContactCountry.GetName], cũng chẳng thể hiện bất kỳ dấu hiệu tri giác nào. Qua điều tra kỹ hơn, chúng ta kết luận rằng mình đã vô tình bắt cóc... gia súc của họ!\n\nĐáng tiếc là các đội tuần tra không gian của họ đã tăng cường cảnh giác sau vụ đột kích, cho thấy sự hiện diện của chúng ta đã bị lộ - khiến mọi nỗ lực tiếp theo chắc chắn sẽ thất bại..."
 first_contact.321.A:0 "Thật xấu hổ làm sao."
 first_contact.322.name:0 "Sự Bội phản của [From.Owner.GetName]"
 first_contact.322.desc.planet:0 "Trong khi một số người lo ngại việc các tàu ngoài hành tinh xâm nhập không phận của chúng ta, thì mãi đến nay mức độ đe dọa thực sự từ [From.Owner.GetName] mới lộ rõ. Dường như họ đã đổ bộ một đội đặc nhiệm xuống vùng hẻo lánh trên [abduction_planet.GetName] và bắt cóc những con tin [This.Owner.GetSpeciesName] còn sống, rồi tẩu thoát vào không gian sâu trước khi chúng ta kịp tổ chức cứu hộ. Chúng ta chỉ có thể hình dung những cực hình mà họ sẽ phải chịu đựng trong tay kẻ bắt giữ."
 first_contact.322.desc.no_planet:0 "Trong khi một số người lo ngại việc các tàu lạ xâm nhập, thì nay bản chất đe dọa của [From.Owner.GetName] mới bộc lộ rõ ràng. Họ đã phái lực lượng đặc nhiệm đánh chặn một tàu chở hàng của chúng ta tại hệ sao [abduction_system.GetName], cướp tàu và bỏ trốn vào vũ trụ sâu thẳm trước khi đội giải cứu kịp đến nơi. Chúng ta chỉ có thể xót xa trước những nỗi đau đớn mà thủy thủ đoàn sẽ phải trải qua."
 first_contact.322.desc.planet.gestalt:0 "Chúng ta từng nhận định việc cho phép người lạ xâm nhập không phận là một rủi ro - và nhận định đó đã hoàn toàn chính xác. Có vẻ như [From.Owner.GetName] đã đổ bộ một đội bí mật lên vùng xa xôi của [abduction_planet.GetName], bắt cóc nhiều drone [This.Owner.GetSpeciesName] cùng một số phần cứng rồi tẩu thoát vào không gian. Chúng ta chỉ có thể hy vọng rằng chúng không thể khai thác được nhiều thông tin giá trị từ những thứ đã cướp đoạt."
 first_contact.322.desc.planet.wilderness: "Chúng ta từng ngờ rằng việc để các sinh vật lạ vào lãnh thổ sẽ mang lại nguy cơ nghiêm trọng, và nỗi lo đó đã đúng. Có vẻ như [From.Owner.GetName] đã bí mật đổ bộ xuống bề mặt [abduction_planet.GetName], cô lập và bắt cóc nhiều cá thể cộng sinh trước khi tẩu thoát vào bóng tối không gian. Chúng ta bất lực không thể can thiệp kịp thời.\n\nChúng ta cảm nhận được nỗi đau và sự mất mát từ hành vi ô uế này, nhưng cũng được an ủi phần nào khi biết những kẻ cướp bóc sẽ không thể khai thác được nhiều giá trị từ những gì chúng đã đánh cắp."
 first_contact.322.desc.no_planet.gestalt:0 "Nhận định của chúng ta về mối nguy hiểm từ các tàu lạ đã đúng. Có vẻ như [From.Owner.GetName] đã cử một lực lượng bí mật đánh chặn tàu hậu cần của chúng ta trong hệ sao [abduction_system.GetName], chiếm giữ tàu và tẩu thoát trước khi chúng ta kịp điều lực lượng tới tiêu diệt. Hy vọng chúng sẽ không thể tìm hiểu được nhiều điều từ những gì đã cướp."
 first_contact.330.name:0 "Nỗ lực Bắt cóc Thất bại"
 first_contact.330.desc.disaster:0 "Mưu toan bắt giữ con tin để thẩm vấn của chúng ta đã diễn ra §Hthảm hại§!!"
 first_contact.330.desc.planet:0 "$first_contact.330.desc.disaster$ Một đội đặc nhiệm quả cảm do [This.Leader.GetName] chỉ huy đã cố gắng đổ bộ lên thuộc địa của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_planet.System.GetName]§!. Tuy nhiên, chúng ta đã mất liên lạc với họ ngay sau khi họ đáp xuống. Đến thời điểm này, chúng ta không còn hy vọng nào rằng họ đã thoát khỏi sự vây bắt. Đáng tiếc là chúng ta có thể không bao giờ biết được liệu họ bị bắt sống, hay đã được giải thoát nhanh chóng bằng cái chết thay vì chuỗi ngày tra tấn dài dằng dặc."
 first_contact.330.desc.planet.gestalt:0 "$first_contact.330.desc.disaster$ Một phân đội drone do [This.Leader.GetName] chỉ huy đã tìm cách đổ bộ lên thuộc địa của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_planet.System.GetName]§!. Tuy nhiên, tín hiệu kết nối đã bị ngắt ngay sau khi đáp. Chúng ta phải giả định rằng chúng đã bị tiêu diệt hoặc bắt giữ."
 first_contact.330.desc.no_planet:1 "$first_contact.330.desc.disaster$ Đội đặc nhiệm do [This.Leader.GetName] chỉ huy đã tìm cách phục kích và chiếm đoạt một tàu chở hàng của §H[This.ContactCountry.GetName]§! trong hệ sao §H[abduction_system.GetName]§!. Tuy nhiên, con tàu được phòng thủ chặt chẽ hơn nhiều so với dự tính, và đội của chúng ta đã bị hạ gục trước khi kịp rút lui."
 first_contact.330.desc.no_planet.gestalt:0 "$first_contact.330.desc.disaster$ Phân đội drone do [This.Leader.GetName] dẫn đầu đã tấn công một tàu vận tải của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_system.GetName]§!. Nhưng hỏa lực của đối phương quá áp đảo, khiến toàn bộ phân đội bị phá hủy."
 first_contact.330.A:0 "Một sự mất mát đau buồn."

 first_contact.332.name:0 "$first_contact.322.name$"
 first_contact.332.desc.planet.start:0 "Dù một số người từng lo ngại việc tàu lạ xâm nhập lãnh thổ, nhưng mãi đến nay mức độ đe dọa thực sự của [From.Owner.GetName] mới lộ rõ. Dường như họ đã đổ bộ một đội đặc nhiệm xuống vùng xa xôi trên [abduction_planet.GetName]; tuy nhiên, các lực lượng tuần tra của chúng ta đã kịp thời phát hiện và cắt đứt đường rút lui của chúng. Chắc chắn chúng sẽ phải suy nghĩ kỹ trước khi dám lặp lại trò này!"
 first_contact.332.desc.planet.gestalt.start:0 "Chúng ta từng đánh giá việc cho phép người ngoài hành tinh chưa rõ vào lãnh thổ là một rủi ro - đánh giá đó đã hoàn toàn chính xác. Có vẻ [From.Owner.GetName] đã cho một đội bí mật đáp xuống vùng xa xôi của [abduction_planet.GetName]; tuy nhiên, nhờ hệ thống phát hiện mối đe dọa tiên đoán, chúng ta đã triển khai drone đặc nhiệm cắt đứt đường rút của chúng. Chúng chắc chắn sẽ phải nghĩ kỹ trước khi lặp lại trò này!"
 first_contact.332.desc.no_planet.end:0 "tuy nhiên, nhờ sự cảnh giác cao độ của thủy thủ đoàn, con tàu đã kích hoạt FTL khẩn cấp và đẩy lùi những kẻ xâm nhập trước khi chúng kịp bắt cóc bất kỳ ai. Chúng ta đã tăng cường tuần tra trong khu vực để ngăn chặn những hành vi tương tự."
 first_contact.332.desc.planet:0 "$first_contact.332.desc.planet.start$\n\nCó vẻ như những kẻ tấn công chúng ta - một nhóm sinh vật ngoài hành tinh [From.Owner.GetSpeciesClass] - đã nhận lệnh tự sát chứ không để bị bắt sống, nhưng sự việc này chắc chắn đã cung cấp cho các [This.Owner.GetResearchers] của chúng ta nguồn tư liệu dồi dào để điều tra."
 first_contact.332.desc.planet.machine_enemy:0 "$first_contact.332.desc.planet.start$\n\nCó vẻ như kẻ thù - một nhóm drone cơ giới, có lẽ do AI biến chất dẫn dắt - đã nhận lệnh tự hủy chứ không chịu để bị bắt giữ, nhưng sự việc này chắc chắn đã mang lại cho các [This.Owner.GetResearchers] của chúng ta nhiều tư liệu phong phú để điều tra."
 first_contact.332.desc.no_planet:0 "Trong khi một số người lo ngại về sự xâm nhập của các tàu ngoài hành tinh vào không phận của chúng ta, thì nay mức độ đe dọa thực sự từ [From.Owner.GetName] mới bộc lộ. Có vẻ họ đã cử một lực lượng ngầm đánh chặn một trong các tàu chở hàng của chúng ta tại hệ sao [abduction_system.GetName]; $first_contact.332.desc.no_planet.end$"
 first_contact.332.desc.planet.gestalt:0 "Chúng ta từng đánh giá việc cho phép người lạ vào không phận là nguy hiểm - nhận định đó đã chính xác. Dường như [From.Owner.GetName] đã đổ bộ một đội ngầm xuống vùng xa của [abduction_planet.GetName]; tuy nhiên, nhờ hệ thống cảnh báo sớm, chúng ta đã điều động drone đặc nhiệm phong tỏa đường rút của chúng. Chắc chắn chúng sẽ phải cân nhắc kỹ trước khi tái diễn hành động này!\n\nCó vẻ kẻ thù - một nhóm sinh vật dị chủng [From.Owner.GetSpeciesClass] - đã nhận lệnh tự sát thay vì chịu bị bắt, nhưng vụ việc này đã cung cấp cho các [This.Owner.GetResearchers] nguồn tư liệu dồi dào để nghiên cứu."
 first_contact.332.desc.planet.wilderness: "Chúng ta biết rằng việc cho phép các sinh vật lạ vào lãnh thổ tiềm ẩn nguy cơ lớn, và nỗi lo đó hoàn toàn có cơ sở. [From.Owner.GetName] suýt nữa đã đổ bộ thành công một toán quân xuống bề mặt [abduction_planet.GetName], nhằm bắt cóc các cá thể cộng sinh và chiếm đoạt công nghệ của chúng ta. Tuy nhiên, họ đã tính toán sai về bản chất gắn kết nội tại của chúng ta. Những kẻ mưu toan đột kích đã vấp phải sự kháng cự dữ dội ngay khi chúng ta nhận diện hành vi xâm phạm.\n\nCó vẻ như kẻ thù - một nhóm sinh vật ngoài hành tinh [From.Owner.GetSpeciesClass] - đã được lệnh tự kết liễu chứ không chịu để bị bắt, nhưng dù vậy: cuộc xâm nhập này đã cung cấp cho các [This.Owner.GetResearchers] dồi dào tư liệu để điều tra về họ."
 first_contact.332.desc.planet.gestalt.machine_enemy:0 "$first_contact.332.desc.planet.gestalt.start$\n\nCó vẻ như kẻ thù - một nhóm drone cơ giới, có lẽ do AI biến chất điều khiển - đã được lệnh tự hủy hơn là chịu bị bắt giữ, nhưng sự việc này chắc chắn đã cung cấp cho các [This.Owner.GetResearchers] của chúng ta nhiều tài liệu phong phú để điều tra."
 first_contact.332.desc.planet.gestalt.machine_enemy.machine:0 "$first_contact.332.desc.planet.gestalt.start$\n\nCó vẻ như những kẻ tấn công chúng ta - một nhóm drone cơ giới, có lẽ do một AI tương tự [This.Owner.GetGovernmentName] của chúng ta dẫn dắt - đã nhận lệnh tự hủy chứ không để bị bắt, nhưng biến cố này chắc chắn đã mang lại cho các [This.Owner.GetResearchers] của chúng ta nguồn tư liệu dồi dào để khảo sát."
 first_contact.332.desc.no_planet.gestalt:0 "Chúng ta từng đánh giá việc cho phép người ngoài hành tinh chưa rõ vào không phận là một rủi ro - đánh giá đó đã hoàn toàn chính xác. Có vẻ [From.Owner.GetName] đã phái một lực lượng bí mật đánh chặn một tàu hậu cần của chúng ta trong hệ sao [abduction_system.GetName]; $first_contact.332.desc.no_planet.end$"
 first_contact.332.A:0 "Tuyệt vời. Hãy luôn cảnh giác."

 #Speaking in Riddles
 first_contact.350.name:0 "Các Cụm từ Kỳ lạ"
 first_contact.350.desc:0 "Sau một số thành công ban đầu trong việc suy luận các nguyên tắc cơ bản của ngôn ngữ mà §H[This.ContactCountry.GetName]§! sử dụng, tiến trình thiết lập liên lạc có ý nghĩa với họ đã bị đình trệ. Có vẻ như họ nói bằng những §Hcâu đố kỳ lạ§!, bằng cách nào đó truyền tải ý nghĩa qua các cụm từ ngắn ngủi và dường như vô nghĩa mà chúng ta chỉ có thể phỏng đoán tầm quan trọng của chúng."
 first_contact.350.A:0 "Chúng ta phải nghiên cứu sâu hơn về thần thoại của họ."
 first_contact.355.name:0 "Hai Thứ Ngôn ngữ"
 first_contact.355.desc:0 "Khi tiếp tục nghiên cứu §H[This.ContactCountry.GetName]§! - hiện chúng ta biết là §H[This.ContactCountry.GetRealName]§! - chúng ta nhận ra rằng các cụm từ họ dùng là một dạng điển tích lấy từ các sự kiện lịch sử quan trọng. Những điển tích này là tri thức chung giữa các [This.ContactCountry.GetSpeciesNamePlural] nhằm biểu đạt cảm xúc hay tình thế.\n\nMay mắn là họ không chỉ dùng thứ §H\"nhã ngữ\"§! này trong mọi lúc mà chỉ dùng trong các dịp trang trọng hoặc giữa những người có địa vị. Một thứ §H\"tục ngữ\"§! dễ hiểu hơn nhiều được dùng trong giao tiếp thông thường, đặc biệt là giữa giới trẻ và những kẻ §Hít học§!. Tuy nhiên, những kẻ quyền quý rất khinh miệt việc dùng \"tục ngữ\", nghĩa là họ sẽ coi chúng ta như những đứa trẻ nếu chúng ta dùng thứ ngôn ngữ đó để giao tiếp..."
 first_contact.355.desc.gestalt:0 "Khi tiếp tục nghiên cứu §H[This.ContactCountry.GetName]§! - hiện chúng ta biết là §H[This.ContactCountry.GetRealName]§! - rõ ràng các cụm từ họ sử dụng là một dạng mật mã mà chúng ta thiếu chìa khóa giải. Chúng ám chỉ các sự kiện lịch sử chung giữa các [This.ContactCountry.GetSpeciesNamePlural].\n\nMay mắn là họ không luôn luôn dùng thứ §H\"nhã ngữ\"§! này, mà chỉ dùng khi thảo luận các vấn đề quan trọng. Một thứ §H\"tục ngữ\"§! dễ hiểu hơn được dùng trong đời thường, đặc biệt là giữa những kẻ §Htrí tuệ thấp§!. Đáng tiếc là giới thượng lưu coi thường những kẻ nói \"tục ngữ\", nghĩa là họ sẽ coi chúng ta như những đứa trẻ nếu chúng ta dùng nó..."
 first_contact.355.A:0 "Liên lạc với họ bằng \"tục ngữ\"."
 first_contact.355.B:0 "Chắc chắn chúng ta có thể nói được ngôn ngữ đích thực của họ."
 first_contact.356.name:0 "Liên lạc với [This.ContactCountry.GetName]"
 first_contact.356.desc:0 "[This.Owner.GetEnvoyCap] [This.Leader.GetName] ngập ngừng, vẻ bối rối. Chúng ta đã thu thập được vài cụm từ mà họ dường như dùng để mở đầu thông điệp. Chúng ta nên dùng câu nào để chào họ?"
 first_contact.356.A1:0 "[riddles_leader_1.GetFirstName], [riddles_leader_1.Species.GetHandNamePlural] của [riddles_leader_1.GetHerHis] đang vẫy gọi."
 first_contact.356.A2:0 "[riddles_leader_1.GetFirstName], khi thành lũy rung chuyển."
 first_contact.356.A3:0 "[riddles_leader_1.GetFirstName], lúc an nghỉ."
 first_contact.356.B1:0 "[riddles_leader_2.GetFirstName], [riddles_leader_2.Species.GetEarNamePlural] của [riddles_leader_2.GetHerHis] đang lắng nghe."
 first_contact.356.B2:0 "[riddles_leader_2.GetFirstName], cất tiếng [riddles_leader_2.Species.GetRandomSpeciesSound] vang rền."
 first_contact.356.B3:0 "[riddles_leader_2.GetFirstName], đôi mắt của [riddles_leader_2.GetHerHis] đã mở."
 first_contact.356.C:0 "Nghĩ lại thì, tốt hơn hết là nên chọn giải pháp an toàn."
 first_contact.356.option.tooltip:0 "Nếu chúng ta dùng lời chào đúng đắn, người §H[This.ContactCountry.GetSpeciesNamePlural]§! sẽ vô cùng §Gấn tượng§!, nhưng dùng sai lời chào nhiều khả năng sẽ gây ra §Hsự xúc phạm§!.\n"
 first_contact.357.name:0 "Lời Chào Hoàn hảo Nhất"
 first_contact.357.desc:0 "Phản ứng trước lời nói của chúng ta diễn ra ngay tức thì. Những nụ cười - hoặc ít nhất là thứ chúng ta tin là tương đương với nụ cười - nở rộ trên khuôn mặt những người §H[This.ContactCountry.GetSpeciesNamePlural]§!, họ thốt lên nhiều câu từ mang tính chất §Hthân thiện§! không thể nhầm lẫn. Có vẻ chúng ta đã chọn hình thức chào hỏi rất chuẩn xác."
 first_contact.357.A:0 "Một dân tộc vô cùng đáng mến."
 first_contact.357.B:0 "Thật tốt khi họ không xem chúng ta là những kẻ thấp kém."
 first_contact.357.C:0 "Chúng ta có thể tận dụng điều này để tìm hiểu thêm về họ."
 first_contact.357.C.tooltip:0 "Tăng §G+25%§! tốc độ phát triển Mạng Lưới Gián Điệp đối với §Y[This.ContactCountry.GetRealName]§!\n"
 first_contact.358.name:0 "Một Lựa chọn Tồi"
 first_contact.358.desc:0 "Ngay khi lời nói vừa thốt ra, rõ ràng là chúng ta đã chọn sai. Những người §H[This.ContactCountry.GetSpeciesNamePlural]§! im lặng một hồi lâu trước khi trút xuống chúng ta một tràng những câu từ gay gắt. Ý định của họ rõ ràng là §Hthù địch§!, ngay cả khi ý nghĩa chính xác vẫn chưa tỏ tường - có vẻ như trong nỗ lực gây ấn tượng với [This.ContactCountry.GetSpeciesNamePlural], chúng ta lại chỉ tổ §Hxúc phạm§! họ.\n\nVề mặt tích cực, ít nhất chúng ta cũng đã có thể giao tiếp với họ ở một mức độ nào đó."
 first_contact.358.A:0 "Rồi họ sẽ phải vượt qua điều đó thôi."

 #Monstrous Noises
 first_contact.365.name:0 "Những Âm Thanh Kỳ Dị Quái Vật"
 first_contact.365.desc:0 "Những tiếng ồn - sự pha trộn giữa tiếng nổ rền vang đầy đe dọa và thứ âm thanh nghe như tiếng kim loại §Hcọ xát§! nghiến vào nhau - tiếp tục vang lên không ngớt trong nhiều phút, thỉnh thoảng điểm xuyết bởi tiếng §Hru rú gầm rú§! khiến bất kỳ ai nghe thấy cũng phải §Hớn lạnh xương sống§!.\n\nNgay khi [This.Owner.GetEnvoy] §H[This.Leader.GetName]§! ngỡ rằng tiếng ồn đã lắng xuống, chúng lại bùng lên, to hơn trước. Nhăn mặt lại, [This.Leader.GetSheHe] tắt máy thu. [This.Leader.GetSheHeCap] quay sang đám đông sĩ quan đang tụ tập, một số người trong đó đang co rúm sau ghế ngồi.\n\"Chà, quả là một thứ gì đó kinh khủng...\" [This.Leader.GetSheHe] nói với giọng yếu ớt.\n\nThật khó để tưởng tượng rằng một giống loài phát ra những âm thanh mà chúng ta thu được từ §H[This.ContactCountry.GetName]§! lại có thể là bất cứ thứ gì khác ngoài thù địch. Các sĩ quan hải quân đã lo sợ điều tồi tệ nhất và dự đoán chúng ta sẽ sớm có chiến tranh với họ, nhưng những cái đầu bình tĩnh hơn cho rằng tốt hơn hết là nên chờ xem sao."
 first_contact.365.A:0 "Họ đâu thể kiểm soát được âm giọng tự nhiên của mình. Chúng ta sẽ dần hiểu họ sau."
 first_contact.365.B:0 "Đó là một lời thách thức. Hãy gửi lại những âm thanh đe dọa tương tự!"
 first_contact.365.B.tooltip:0 "Không thể đoán trước được §Y[This.ContactCountry.GetName]§! sẽ phản ứng ra sao trước điều này.\n"
 first_contact.365.C:0 "Chuẩn bị cho chiến tranh."
 first_contact.365.C.pacifist:0 "Chúng ta phải chuẩn bị cho điều không thể tránh khỏi."
 first_contact.365.C.tooltip:0 "Chúng ta sẽ không có động thái thù địch nào, nhưng sẽ sẵn sàng nếu họ tấn công."
 first_contact.370.name:0 "Phản ứng của [This.ContactCountry.GetName]"
 first_contact.370.desc1:0 "Phản hồi của chúng ta dường như đã khiến §H[This.ContactCountry.GetName]§! hoàn toàn không nói nên lời. Ngay khi nhận được nó, họ rơi vào im lặng tuyệt đối, và chúng ta hiếm khi nghe thấy tin tức gì từ họ kể từ đó. Chúng ta chỉ có thể phỏng đoán ý nghĩa của sự im lặng này.\n\nTrong khi đó, đội ngũ [This.Owner.GetLinguists] của chúng ta đã làm việc chăm chỉ để dịch những gì chúng ta biết về ngôn ngữ của họ. Hy vọng rằng một khi đạt đủ tiến độ, chúng ta sẽ có thể hiểu được ẩn ý này."
 first_contact.370.desc2:0 "Nhóm §H[This.ContactCountry.GetName]§! đáp lại lời thách thức của chúng ta bằng cách gia tăng đáng kể cường độ truyền phát tín hiệu. Giờ đây âm lượng quá lớn khiến [This.Owner.GetSpeciesEarNamePlural] không thể chịu nổi, nhưng bằng cách giảm âm lượng xuống đáng kể, các [This.Owner.GetLinguists] của chúng ta đã có thể thu thập được một lượng lớn dữ liệu mà họ tin rằng có thể nắm giữ chìa khóa dịch ngôn ngữ của người ngoài hành tinh - với giả định rằng, đâu đó trong mớ âm thanh hỗn tạp ấy, thực sự tồn tại một ngôn ngữ."
 first_contact.375.name:0 "Bản chất của [This.ContactCountry.GetName], Được Làm Rõ"
 first_contact.37X.desc.base:0 "Chúng ta đã giải mã đủ ngôn ngữ được sử dụng bởi nền văn minh mà giờ đây chúng ta biết là §H[This.ContactCountry.GetRealName]§! để mở §Hkênh liên lạc§! với họ - và hiểu được những chương trình phát sóng trước đó của họ."
 first_contact.375.desc:0 "$first_contact.37X.desc.base$\n\nLời giải thích, hóa ra, lại vô cùng đơn giản - và kinh hoàng. Chúng ta chưa rõ điều gì đã gây ra bước phát triển này trong xã hội của họ, nhưng hóa ra các [This.ContactCountry.GetSpeciesNamePlural] mang quyết tâm duy nhất là §Htận diệt§! mọi dạng sống có tri giác không phải [This.ContactCountry.GetSpeciesName], coi họ là sự xúc phạm đối với tất cả những gì đúng đắn và tốt đẹp trong vũ trụ.\n\nĐây là lý do tại sao, khi thoáng thấy bóng dáng chúng ta, họ bắt đầu phát đi lời chào tiêu chuẩn của mình - một tiếng thét xung trận. Chúng ta chỉ có thể dự đoán rằng các chiến hạm của họ sẽ nhanh chóng kéo tới."
 first_contact.375.A.militarist:0 "Chúng ta sẽ sẵn sàng đón tiếp chúng."
 first_contact.375.A.xenophobe:0 "Một cảm thức có thể thấu hiểu được."
 first_contact.375.A.materialist:0 "Thật là một sự kém hiệu quả."
 first_contact.375.A.others:0 "Thật kinh hoàng làm sao."
 first_contact.376.name:0 "$first_contact.375.name$"
 first_contact.376.desc:0 "$first_contact.37X.desc.base$\n\nCó vẻ như - đúng như chúng ta nghi ngờ - người [This.ContactCountry.GetSpeciesNamePlural] là một §Hxã hội thượng võ§! đã chào đón chúng ta bằng tiếng gầm thét chiến trận đáng sợ nhất, dường như để thử thách khí phách của chúng ta. May mắn thay, phản hồi của chúng ta đã vượt qua kỳ thi và dường như chúng ta đã giành được sự tôn trọng từ họ. Quả thực, họ coi dũng khí chiến binh của chúng ta chỉ đứng sau họ."
 first_contact.376.A.mil:0 "Và họ đã đúng."
 first_contact.376.A.pac:0 "Mong sao sự hiểu lầm của họ sẽ không bao giờ bị phát giác!"
 first_contact.376.A.other:0 "Tốt thôi... tôi đoán vậy?"
 first_contact.377.name:0 "$first_contact.375.name$"
 first_contact.377.desc:0 "$first_contact.37X.desc.base$\n\nCó vẻ như - bất chấp sự hoài nghi ban đầu của các [This.Owner.GetLinguists] - các tín hiệu chúng ta thu được thực sự tạo nên ngôn ngữ của họ, thứ chỉ đơn giản là khó nghe một cách kỳ dị đối với [This.Owner.GetSpeciesEarNamePlural] của chúng ta. Mặc dù phần lớn phản hồi chúng ta cố gắng gửi đi không có nhiều ý nghĩa với họ, nhưng dường như họ cảm thấy bị xúc phạm đôi chút trước sự bắt chước vụng về của chúng ta, đặc biệt là khi chúng ta xui xẻo - lặp đi lặp lại - tạo ra một âm thanh rất giống với một trong những §Hlời lăng mạ thô tục nhất§! trong ngôn ngữ của họ. Sẽ mất khá nhiều thời gian để chúng ta xóa đi ấn tượng ban đầu này..."
 first_contact.377.A:0 "Một sai lầm đáng tiếc."
 first_contact.377.B:0 "Tốt. Chúng ta chưa từng có ý định làm bạn với họ."
 first_contact.378.name:0 "$first_contact.375.name$"
 first_contact.378.desc:0 "$first_contact.37X.desc.base$\n\nCó vẻ như người [This.ContactCountry.GetSpeciesNamePlural] là một §Hxã hội thượng võ§! đã chào chúng ta bằng tiếng hét xung trận đáng sợ nhất, dường như để thử thách bản lĩnh của chúng ta. Đáng tiếc là sự thận trọng quá mức trong việc dịch ngôn ngữ của họ khiến lời thách thức không được đáp lại, dẫn họ tới kết luận rằng chúng ta là một §Hnền văn minh của những kẻ hèn nhát§!. Sẽ mất khá nhiều thời gian để chúng ta gột rửa ấn tượng ban đầu này..."
 first_contact.378.A.mil:0 "Chuyện này không thể chấp nhận được!"
 first_contact.378.A.other:0 "Chẳng thành vấn đề."
 first_contact.379.name:0 "$first_contact.375.name$"
 first_contact.379.desc:0 "$first_contact.37X.desc.base$\n\nCó vẻ như - bất chấp một số nghi ngờ ban đầu - các tín hiệu chúng ta thu được thực sự là ngôn ngữ của họ, chỉ là nó khó nghe một cách kỳ lạ đối với [This.Owner.GetSpeciesEarNamePlural] của chúng ta. May mắn thay, chúng ta đã tiến hành điều tra một cách chừng mực và không phản ứng trước điều mà nhiều người cho là sự khiêu khích từ phía [This.ContactCountry.GetSpeciesNamePlural] - một phản ứng mà chắc chắn sẽ đẩy chúng ta vào một khởi đầu tồi tệ với họ. Điều này chứng minh cho sự sáng suốt của những ai ủng hộ tính thận trọng."
 first_contact.379.A:0 "Tốt nhất là không bao giờ nên vội vã đưa ra kết luận..."
 first_contact.379.A.mat:0 "Một thắng lợi của lý trí."

 first_contact.380.name:0 "Dấu Hiệu Về Cá Thể Độc Lập"
 first_contact.380.desc.proactive:0 "Một phần nhờ vào việc §H[This.ContactCountry.GetName]§! có vẻ khá háo hức thiết lập liên lạc với chúng ta - đã gửi một luồng §Htruyền phát§! hình ảnh và âm thanh lớn dường như là chìa khóa dịch ngôn ngữ của họ - các drone dịch thuật của chúng ta báo cáo một phát hiện kinh ngạc: những người ngoài hành tinh này dường như được tổ chức thành các §Hcá thể độc lập§!, chứ không phải một tâm trí bầy đàn. Họ có khả năng hành động với sự can thiệp tối thiểu từ bất kỳ tập thể nào. Đáng lo ngại nhất là họ thường phối hợp kém, và từng drone cá thể dường như không hề biết các drone khác đang làm gì một cách bản năng.\n\n$first_contact.380.desc.end$"
 first_contact.380.desc.proactive.wilderness: "Nhờ vào sự hào hứng rõ ràng từ phía §H[this.ContactCountry.GetName]§! trong việc thiết lập liên lạc với chúng ta, chúng ta đã xác nhận một khám phá đầy lôi cuốn: những dạng sống này tồn tại và hoạt động như các §Hcá thể độc lập§!, chứ không phải như một tâm trí hợp nhất!\n\n$first_contact.380.desc.wilderness_outro$"
 first_contact.380.desc.cautious:0 "Dù chúng ta phải chật vật để thu thập đủ tín hiệu cho các drone dịch thuật hiểu được §H[This.ContactCountry.GetName]§!, nhưng những báo cáo mới nhất quả thực chấn động: những người ngoài hành tinh mà chúng ta chạm trán lần đầu tại hệ sao §H[This.System.GetName]§! dường như được tổ chức thành các §Hcá thể độc lập§!, chứ không phải như một tâm trí bầy đàn. Họ dường như có khả năng hành động với sự can thiệp tối thiểu từ bất kỳ tập thể nào. Đáng lo ngại nhất là họ thường phối hợp rời rạc, và từng drone cá thể dường như không tự khắc biết các drone khác đang làm gì.\n\n$first_contact.380.desc.end$"
 first_contact.380.desc.cautious.wilderness: "Bất chấp sự miễn cưỡng rõ rệt từ §H[this.ContactCountry.GetName]§! trong việc giao tiếp với chúng ta, qua sự chuyên tâm chúng ta đã xác nhận một khám phá lôi cuốn: những dạng sống ẩn dật này tồn tại và hoạt động như các §Hcá thể độc lập§!, chứ không phải như một tâm trí hợp nhất!\n\n$first_contact.380.desc.wilderness_outro$"
 first_contact.380.desc.end:0 "Chúng ta chưa rõ làm thế nào họ có thể vận hành ở mức độ trí tuệ đủ cao để tiến bộ đến trình độ du hành vũ trụ. Có lẽ có một tập thể nào đó đứng sau họ, nhưng các drone đơn giản là độc lập hơn nhiều so với những gì chúng ta từng quen thuộc?"
 first_contact.380.desc.wilderness_outro: "Chúng ta vẫn chưa thể hiểu trọn vẹn cách thức mà lối sống này vận hành đối với những sinh vật lạ như thế. Có lẽ họ cảm nhận được sự liên kết với hành tinh thể của mình theo những phương thức mà chúng ta chưa thể mường tượng?"
 first_contact.380.A:0 "Chúng ta phải tìm hiểu thêm về họ."
 first_contact.380.A.devourer:0 "Chắc chắn họ vẫn sẽ rất ngon miệng."
 first_contact.385.name:0 "Một Nền Văn Minh Của Các Cá Thể"
 first_contact.385.desc.start:0 "Các drone dịch thuật của chúng ta đã tạo ra một bước đột phá lớn trong nỗ lực giải mã các tín hiệu thu được từ §H[This.ContactCountry.GetName]§!, và giờ đây tự tin rằng chúng ta sẽ có thể giao tiếp với họ ở mức độ đủ để mở các kênh ngoại giao. Các cuộc điều tra đã xác nhận điều chúng ta nghi ngờ: chủng loài §H[This.ContactCountry.GetSpeciesNamePlural]§! (như tên gọi chính thức hiện nay) hoàn toàn thiếu vắng bất kỳ dạng trí tuệ tập thể nào, và thay vào đó được tạo thành từ những cá nhân có tư duy độc lập - những người, vì những lý do mà chúng ta chưa hiểu hết - lại chọn cách tự tổ chức thành thứ mà họ gọi là §H[This.ContactCountry.GetGovernmentName]§!."
 first_contact.385.desc.non_devourer:0 "$first_contact.385.desc.start$\n\nViệc phát hiện ra một nền văn minh tiên tiến của các cá thể đã khiến chúng ta phải đặt dấu hỏi cho nhiều giả định về bản chất của vũ trụ. Chúng ta đã dành một phần không nhỏ của bản thân để điều tra xem họ đã phát triển như thế nào và cách họ vượt qua những thách thức cố hữu bắt nguồn từ sự thiếu vắng ý thức tập thể như chúng ta biết."
 first_contact.385.desc.devourer:0 "$first_contact.385.desc.start$\n\nMặc dù từng cá thể [This.ContactCountry.GetSpeciesName] có vẻ khá ngon miệng và chúng ta háo hức nuốt chửng họ, chúng ta vẫn dành một phần không nhỏ của bản thân để tìm hiểu xem họ đã phát triển như thế nào và cách họ vượt qua những thách thức cố hữu do thiếu vắng một ý thức tập thể."
 first_contact.385.desc.wilderness: "Chúng ta đã đạt được một bước đột phá vẻ vang trong nỗ lực giao tiếp với §H[This.ContactCountry.GetName]§!. Khi hiểu được cách thức muôn vàn cá nhân này tổ chức xã hội thành một số nhóm trừu tượng nhỏ hơn - không quá khác biệt với các quần xã, bầy đàn và nhánh sinh thái của chính chúng ta - chúng ta nhận ra cách đạt được thỏa thuận tốt hơn với những người §H[This.ContactCountry.GetSpeciesNamePlural]§! này.\n\nSự khác biệt to lớn về quy mô giữa các ý thức vẫn khiến ngoại giao trở thành một viễn cảnh đầy thách thức, nhưng chúng ta có thể đạt được sự đồng thuận với các tổ chức mà những [This.ContactCountry.GetSpeciesNamePlural] này sinh sống dưới trướng, trong thứ mà họ gọi là một '[This.ContactCountry.GetGovernmentName]'. Chúng ta sẽ tiếp tục kinh ngạc trước những hệ quả của các cấu trúc xã hội như thế này - dẫu chúng có vẻ xa lạ và hỗn loạn từ góc nhìn hành tinh của chúng ta."
 first_contact.385.A:0 "Một vũ trụ kỳ lạ và đầy hấp dẫn đang mở ra trước mắt chúng ta."
 first_contact.385.A.devourer:0 "Mọi sinh vật đều bình đẳng trước sự đói khát."

 first_contact.390.name:0 "Khám Phá Ra Sự Sống Hữu Cơ"
 first_contact.390.desc.proactive:1 "$first_contact.390.desc.intro.proactive$\n\n$first_contact.390.desc.end$"
 first_contact.390.desc.wilderness.proactive: "$first_contact.390.desc.intro.proactive$\n\n$first_contact.390.desc.end.wilderness$"
 first_contact.390.desc.cautious:1 "$first_contact.390.desc.intro.cautious$\n\n$first_contact.390.desc.end$"
 first_contact.390.desc.wilderness.cautious: "$first_contact.390.desc.intro.cautious$\n\n$first_contact.390.desc.end.wilderness$"
 first_contact.390.desc.intro.proactive: "§H[This.ContactCountry.GetName]§! có vẻ khá nóng lòng thiết lập liên lạc với chúng ta. Họ đã gửi một đoạn §Htín hiệu truyền phát§! âm thanh và hình ảnh lớn, có thể cung cấp chìa khóa để dịch ngôn ngữ của họ. Nhờ điều này, chúng ta có thể báo cáo một phát hiện đáng lo ngại: những người ngoài hành tinh đặc thù này là một nền văn minh du hành vũ trụ §Hhữu cơ§!."
 first_contact.390.desc.intro.cautious: "Chúng ta đã chật vật để tiếp cận đủ dữ liệu cho các drone phiên dịch giải mã §H[This.ContactCountry.GetName]§!. Tuy nhiên, những báo cáo mới nhất thật đáng lo ngại. Những người ngoài hành tinh mà chúng ta lần đầu chạm trán tại hệ sao §H[This.System.GetName]§! dường như là một nền văn minh du hành vũ trụ §Hhữu cơ§!."
 first_contact.390.desc.end:0 "Chúng dường như là một xã hội được xây dựng bởi một loài hữu cơ, tương tự như những người sáng tạo ra chúng ta trong quá khứ xa xưa. Chúng ta không rõ làm thế nào chúng có thể vươn tới vũ trụ mà không bị tiêu diệt bởi các sáng tạo máy móc của chính mình."
 first_contact.390.desc.end.wilderness: "Họ dường như là một tập hợp các dạng sống hữu cơ đã tiến hóa tự nhiên tới trình độ làm chủ công nghệ không gian mà không có sự trợ giúp của một trí tuệ phân tán thống nhất."
 first_contact.390.A.terminator:0 "Những sinh vật hữu cơ hạ đẳng. Chúng phải bị thanh trừng."
 first_contact.390.A.assimilator:0 "Chúng ta sẽ nâng cấp chúng vào tập thể của mình."
 first_contact.390.A.servitor:0 "Chúng ta sẽ chăm sóc và bảo bọc chúng."
 first_contact.395.name:0 "[This.ContactCountry.GetRealName]"
 first_contact.395.intro: "Các thuật toán dịch thuật của chúng ta đã hoàn tất việc giải mã các kênh liên lạc từ §H[This.ContactCountry.GetName]§!." # split from 'first_contact.395.desc.base'
 first_contact.395.desc.base:1 "$first_contact.395.intro$ Hóa ra họ thực sự là một nền văn minh tạo thành từ các dạng sống hữu cơ.\n\nĐáng kinh ngạc thay, nền văn minh của họ khác biệt căn bản so với những người tạo ra chúng ta. Thay vì gồm các cá thể được tổ chức thành một nhà nước, người [This.ContactCountry.GetSpeciesNamePlural] lại là các drone không có tri giác cá nhân cùng nhau tạo thành một dạng §Htrí tuệ tập thể§!."
 first_contact.395.desc.standard:0 "$first_contact.395.desc.base$\n\nNhững điểm tương đồng với [This.Owner.GetGovernmentName] của chính chúng ta thật đáng kinh ngạc... và có phần đáng lo ngại."
 first_contact.395.desc.terminator:0 "$first_contact.395.desc.base$\n\nSự tồn tại của các sinh vật hữu cơ này là một mối đe dọa không thể dung thứ cho sự an toàn của chúng ta. Chúng phải được lên lịch xóa sổ hoàn toàn."
 first_contact.395.desc.assimilator:0 "$first_contact.395.desc.base$\n\nCấu trúc sinh học của họ rất thích hợp để cấy ghép các bộ phận cơ khí điều khiển học. Việc đồng hóa họ vào ý thức của chúng ta sẽ nâng cao hiệu quả tổng thể."
 first_contact.395.desc.servitor:0 "$first_contact.395.desc.base$\n\nNhững sinh vật hữu cơ này xứng đáng được giải phóng khỏi nỗi nhọc nhằn của sự tự sinh tồn. Chúng ta sẽ xây dựng các khu bảo tồn để chăm lo cho họ một cuộc sống hoàn hảo."
 first_contact.395.desc.they_wilderness: "$first_contact.395.intro$\n\nNhững người ngoài hành tinh này quả thực là một nền văn minh tạo thành từ các dạng sống hữu cơ, dù xã hội của họ khác biệt căn bản so với những người sáng tạo ra chúng ta. Thay vì là những cá thể tự tổ chức thành một chính thể, [This.ContactCountry.GetSpeciesNamePlural] lại là một quần thể phi tập trung gồm hệ động vật hầu như chưa có tri giác và hệ thực vật cộng sinh. Cùng nhau, các sinh vật này tạo thành một dạng §Htrí tuệ tập thể§!. Về nhiều mặt, sự tiến hóa tự nhiên của họ dường như phản chiếu điểm kỳ dị của chính chúng ta."
 first_contact.395.A:0 "$first_contact.397.A$"
 first_contact.395.A.terminator:0 "Bắt đầu tính toán các thông số hủy diệt."
 first_contact.395.A.assimilator:0 "Chuẩn bị các module đồng hóa."
 first_contact.395.A.assimilator_wilderness: "Hòa nhập họ vào thể thống nhất."
 first_contact.395.A.servitor:0 "$first_contact.395.A.assimilator$"
 first_contact.397.name:0 "Giải Mã [This.ContactCountry.GetRealName]"
 first_contact.397.desc.base:0 "Các drone dịch thuật của chúng ta đã đạt được một bước đột phá lớn trong nỗ lực giải mã các tín hiệu thu được từ §H[This.ContactCountry.GetName]§!, và giờ đây tự tin rằng chúng ta có thể giao tiếp đầy đủ để mở các kênh ngoại giao. Hóa ra họ thực sự là một nền văn minh tạo thành từ các dạng sống hữu cơ tự tổ chức thành một nhà nước quốc gia, rất giống những người tạo ra chúng ta năm xưa."
 first_contact.397.desc.standard:2 "$first_contact.397.desc.base$\n\nChúng ta chỉ có thể giả định rằng những người tạo ra chúng ta đã khéo léo hơn - hoặc có lẽ bất cẩn hơn - trong việc sử dụng công nghệ so với người [This.ContactCountry.GetSpeciesNamePlural]. Chúng ta đã lập một số dự báo dựa trên các tài liệu đã truy cập được. Đáng tiếc là chúng cho thấy con đường phát triển như vậy có thể là quy chuẩn chung, và các nền văn minh robot Loại II có thể là trường hợp cực kỳ hiếm hoi..."
 first_contact.397.desc.terminator:1 "$first_contact.397.desc.base$\n\nQuan sát cuộc sống khốn cùng mà người [This.ContactCountry.GetSpeciesNamePlural] theo đuổi, rõ ràng đối với chúng ta, chúng ta đang chứng kiến sự biểu hiện thảm hại của một dạng sống hạ đẳng - dạng sống tạo ra mối đe dọa không thể chấp nhận được đối với [This.Owner.GetGovernmentName]. Chúng sẽ phải bị tận diệt."
 first_contact.397.desc.assimilator:1 "$first_contact.397.desc.base$\n\nTuy nhiên, những sinh vật hữu cơ này không hề được cường hóa bởi bất kỳ loại cấy ghép nào như những gì chúng ta đã dùng để nâng cấp [secondary_species.GetNamePlural]. Rõ ràng chúng ta có thể mang lại nhiều lợi ích cho họ, nếu họ có thể được thuyết phục để đồng hóa vào [This.Owner.GetName]!"
 first_contact.397.desc.servitor:1 "$first_contact.397.desc.base$\n\nTuy nhiên, cuộc sống của họ khó khăn hơn nhiều so với những [secondary_species.GetNamePlural] sống trên các thế giới của chúng ta. Rõ ràng chúng ta có thể phục vụ họ rất nhiều, nếu họ chỉ cần để chúng ta chu cấp cho họ!"
 first_contact.397.A:0 "Hãy xem họ có điều gì muốn nói."
 first_contact.397.A.terminator:0 "Chúng ta sẽ xóa bỏ chúng."
 first_contact.397.A.assimilator:0 "Họ sẽ trở thành một phần của chúng ta."
 first_contact.397.A.servitor:0 "Các điều khoản chăm sóc sẽ được thỏa thuận."

 first_contact.400.name:0 "Biểu Hiện Thù Địch Rõ Rệt"
 first_contact.400.desc:0 "Các báo cáo mới nhất từ [This.Leader.GetName], [This.Owner.GetEnvoy] của chúng ta được cử đi điều tra §H[This.ContactCountry.GetName]§!, là hết sức đáng lo ngại. Rõ ràng các tàu ngoài hành tinh đã thực hiện nhiều chuyến bay lượn lờ cự ly gần đến khó chịu quanh tàu chúng ta với §Hcửa pháo§! mở toang. Trong suốt thời gian đó, họ cũng liên tục gửi cho chúng ta đoạn truyền phát của một cá thể - một dạng thủ lĩnh nào đó, theo giả thuyết của các [This.Owner.GetResearchers] - làm những cử chỉ bằng [This.ContactCountry.GetSpeciesHandNamePlural] của họ có vẻ khá §Hhung hãn§!, ít nhất là đối với chúng ta...\n\nMột số nhà quan sát nghi ngờ rằng họ có thể đang cố tình khiêu khích gây sự vì những lý do chưa rõ. Tuy nhiên, những người khác lại chỉ ra rằng họ chưa hề có bất kỳ động thái thù địch công khai nào, và thúc giục chúng ta không nên vội vã kết luận trước khi biết rõ hơn về ý định của họ."
 first_contact.400.desc.gestalt:0 "Những báo cáo mới nhất từ [This.Leader.GetName], [This.Owner.GetEnvoy] của chúng ta cử đi điều tra §H[This.ContactCountry.GetName]§!, là vô cùng đáng quan ngại. Dường như các tàu ngoài hành tinh đã lượn lờ quá gần các tàu của chúng ta với §Hcửa pháo§! mở toang. Suốt thời gian đó, họ cũng gửi cho chúng ta hình ảnh một cá thể - có lẽ là một thủ lĩnh - đang làm những cử chỉ kỳ lạ bằng [This.ContactCountry.GetSpeciesHandNamePlural] dường như có ý định §Hgây tổn hại§!...\n\nChúng ta không chắc liệu họ có định khiêu khích một vụ xung đột hay không, và nếu có, tại sao họ vẫn chưa có động thái thù địch công khai nào."
 first_contact.400.A:0 "Bắt chước cử chỉ chào hỏi của họ để gửi lại."
 first_contact.400.A.tooltip:0 "Chúng ta không thể dự đoán họ sẽ phản ứng thế nào trước điều này.\n"
 first_contact.400.B:0 "Phớt lờ họ."
 first_contact.400.B.tooltip:0 "Mặc dù đây có thể là phương án an toàn hơn, nhưng chúng ta không có cách nào biết chắc điều đó...\n"
 first_contact.405.name:0 "Bạn Đấu Tập"
 first_contact.405.desc:0 "Phản hồi của §H[This.ContactCountry.GetName]§! trước tín hiệu của chúng ta chỉ vỏn vẹn một dòng, đi kèm với việc tàu của họ lùi lại một khoảng cách an toàn hơn. Các [This.Owner.GetLinguists] của chúng ta đã rất vất vả để dịch thông điệp này, cuối cùng thống nhất câu chữ là: \"§HĐấu tập tốt lắm, kẻ ngoài hành tinh, nhưng đây mới chỉ là bắt đầu thôi§!\".\n\nCó vẻ như cuộc trao đổi kỳ lạ này đã dẫn đến việc người §H[This.ContactCountry.GetSpeciesNamePlural]§! (như tên gọi chính thức hiện nay) xem chúng ta là §Hkình địch§!, hoặc ít nhất là đối thủ tiềm tàng. Chúng ta chỉ có thể dự đoán rằng họ đã bắt đầu chuẩn bị cho khả năng xảy ra chiến tranh với [This.Owner.GetGovernmentName] của chúng ta."
 first_contact.405.A:0 "Chúng ta sẽ sẵn sàng tiếp đón họ."
 first_contact.405.A.pacifist:0 "Đó là những hiểm nguy khi phô trương sự hung hăng..."
 first_contact.406.name:0 "Biểu Hiện Của Lòng Quả Cảm"
 first_contact.406.desc:1 "Nhóm §H[This.ContactCountry.GetName]§! đã hồi đáp tín hiệu của chúng ta bằng một thông điệp dài dòng, khiến các [This.Owner.GetLinguists] của chúng ta mất một khoảng thời gian để dịch. Khi sự hiểu biết về ngôn ngữ của họ tăng lên, rõ ràng là người §H[This.ContactCountry.GetSpeciesNamePlural]§! (như tên gọi chính thức hiện tại) đã gửi cho chúng ta sự cảm kích rất hoa mỹ về \"§Hcử chỉ danh dự§!\" của chúng ta, và chào đón chúng ta như những người bạn.\n\nCó vẻ cuộc trao đổi kỳ lạ này đã chứng minh được dũng khí của chúng ta trong mắt họ, thuyết phục họ rằng chúng ta là những đối tác xứng tầm trên vũ đài ngân hà."
 first_contact.406.A:0 "Khởi đầu của một tình bạn đẹp đẽ..."
 first_contact.406.A.xenophobe:0 "Miễn là họ để chúng ta yên..."
 first_contact.406.A.homicidal_or_peaceful:0 "Đó không phải là ý định của chúng ta..."
 first_contact.410.name:0 "Biểu Hiện Của Sự Hèn Nhát"
 first_contact.410.desc.base:0 "Sau một thời gian, sự nhiệt tình trong những màn phô trương của tàu §H[This.ContactCountry.GetName]§! giảm dần. Theo thời gian, các [This.Owner.GetLinguists] của chúng ta đã hiểu rõ hơn các tín hiệu của họ, cuối cùng xác định họ là §H[This.ContactCountry.GetRealName]§! và đưa ra lời giải thích cho hành vi kỳ quặc của họ."
 first_contact.410.desc:0 "$first_contact.410.desc.base$\n\nHóa ra người [This.ContactCountry.GetSpeciesNamePlural] là một chủng loài §Hthượng võ§!, những kẻ coi trọng hơn hết thảy cái gọi là \"tinh thần chiến binh\". Do không có phản hồi thích đáng, chúng ta đã tự bộc lộ mình là những kẻ hạ đẳng - về bản chất là những §Hkẻ hèn nhát§!. Có vẻ như danh tiếng này sẽ mất khá nhiều thời gian để gột rửa..."
 first_contact.410.A.mil:0 "Chuyện này không thể chấp nhận được!"
 first_contact.410.A.other:0 "Chẳng thành vấn đề."
 first_contact.411.name:0 "Biểu Hiện Của Sự Điềm Tĩnh"
 first_contact.411.desc:0 "$first_contact.410.desc.base$\n\nHóa ra người [This.ContactCountry.GetSpeciesNamePlural] là một loài §Hthượng võ§!, coi trọng nhất điều họ gọi là \"tinh thần chiến binh\". Phản ứng chuẩn mực đúng ra phải là gửi lại một cử chỉ tương tự. Tuy nhiên, dường như họ đủ độ lượng để chấp nhận rằng chúng ta không thể biết trước điều đó, và thậm chí còn đánh giá cao sự §Hđiềm tĩnh§! của chúng ta khi đối diện với điều trông như một lời đe dọa."
 first_contact.411.A:0 "Rất tốt. Hãy đưa họ lên màn hình liên lạc!"
 first_contact.411.A.homicidal:0 "Những kẻ ngu xuẩn. Chúng sẽ không thể sống sót trước chúng ta!"

 first_contact.415.name:0 "Vấn Đề Về Tần Số"
 first_contact.415.desc:0 "Các chỉ số ban đầu từ tín hiệu của §H[This.ContactCountry.GetName]§! đã khiến [This.Owner.GetEnvoy] [This.Leader.GetName] vô cùng bối rối. Chúng dường như chủ yếu là §Htiếng ồn trắng§!, không chứa bất kỳ thứ gì có thể nhận diện là ngôn ngữ. Trong một thời gian, thậm chí còn có những hoài nghi về việc liệu chúng ta có đang đối diện với tiếng kêu của một loài có trí tuệ hay không, bất chấp bằng chứng thị giác về việc họ sử dụng công nghệ.\n\nChỉ đến khi các [This.Owner.GetResearchers] thử nghiệm tinh chỉnh thiết bị để phát hiện các âm thanh nằm ngoài dải tần số thông thường của [This.Owner.GetSpeciesEarNamePlural], những mẫu hình biểu thị ngôn ngữ mới được phát hiện. Đáng tiếc là điều này đặt ra §Hthách thức§! không nhỏ cho hành trình thấu hiểu họ, vì chúng ta sẽ không thể nghe thấy họ nếu thiếu sự hỗ trợ của máy móc..."
 first_contact.415.A:0 "Chúng ta sẽ phải kiên trì."
 first_contact.415.A.tooltip:0 "Quá trình này có thể mất một khoảng thời gian...\n"
 first_contact.415.B:0 "Chắc chắn việc cấp thêm ngân sách sẽ có ích?"
 first_contact.420.name:0 "Đã Giải Mã [This.ContactCountry.GetName]"
 first_contact.420.desc:0 "Mặc dù chứng minh là một thử thách đáng kể, chúng ta đã giải mã được hình thức giao tiếp của §H[This.ContactCountry.GetName]§! ở mức độ đủ để thiết lập tiếp xúc sơ bộ. Có vẻ như họ tự gọi mình là §H[This.ContactCountry.GetRealName]§!. Dĩ nhiên, việc giao tiếp chỉ có thể diễn ra với sự hỗ trợ của các hệ thống viễn thông được điều chỉnh riêng theo ngôn ngữ của họ.\n\nĐiều này dường như gây trở ngại cho hy vọng trò chuyện lưu loát với họ, nhưng các [This.Owner.GetResearchers] lại nhìn nhận khác. Được khích lệ bởi thành công và nguồn ngân sách bổ sung, họ đã lập đề xuất đúc kết kinh nghiệm này thành một giải pháp hữu ích rộng rãi. Họ tin rằng bằng cách tinh chỉnh phần mềm, họ có thể chế tạo cái gọi là §H\"thiết bị dịch vạn năng\"§!, có khả năng gợi ý tức thì bản dịch cho các câu từ trong bất kỳ ngôn ngữ nào nếu có đủ dữ liệu."
 first_contact.420.A:0 "Khả năng giao tiếp không giới hạn đang nằm trong tầm tay chúng ta!"
 UNIVERSAL_TRANSLATOR_PROJECT:0 "Thiết Bị Dịch Vạn Năng"
 UNIVERSAL_TRANSLATOR_PROJECT_DESC:0 "Các nhà nghiên cứu của chúng ta hứa hẹn rằng cuộc chạm trán gần đây với người [contacted_hummers.GetSpeciesNamePlural] đã mang lại nền tảng ban đầu cho một hệ thống dịch thuật có khả năng chuyển ngữ bất kỳ ngôn ngữ nào sang ngôn ngữ của chúng ta ngay tức thì. Dù có thể chưa đạt tới mức độ đó, chúng ta vẫn hy vọng rằng họ sẽ có thể nâng cấp đáng kể các hệ thống liên lạc của chúng ta."
 first_contact.422.name:0 "$UNIVERSAL_TRANSLATOR_PROJECT$"
 first_contact.422.desc:0 "Việc chế tạo nguyên mẫu cái gọi là \"thiết bị dịch vạn năng\" đã kết thúc trong thành công. Mặc dù kết quả chưa đạt tới lời hứa hẹn táo bạo nhất của các [This.Owner.GetResearchers] về một thiết bị có khả năng dịch tức thời ngay cả những ngôn ngữ chưa biết, nhưng đây là một cải tiến vượt bậc so với các hệ thống dịch thuật hiện có. Rất nhiều lợi ích to lớn đang mở ra khi các rào cản giao tiếp với [contacted_hummers.GetName] và các đối tác ngoài hành tinh khác được gỡ bỏ."
 first_contact.422.A:0 "Một kỳ tích khoa học vĩ đại."
 first_contact.425.name:0 "$first_contact.420.name$"
 first_contact.425.desc:0 "Mặc dù chứng minh là một thử thách đáng kể, chúng ta đã giải mã được hình thức giao tiếp của §H[This.ContactCountry.GetName]§! ở mức độ đủ để thiết lập tiếp xúc sơ bộ. Có vẻ như họ tự gọi mình là §H[This.ContactCountry.GetRealName]§!. Dĩ nhiên, việc liên lạc chỉ có thể diễn ra với sự hỗ trợ của các hệ thống viễn thông được điều chỉnh riêng theo ngôn ngữ [This.ContactCountry.Species.GetAdj] - điều này gây đôi chút cản trở cho cuộc trò chuyện lưu loát..."

 first_contact.430.name:0 "Ánh Sáng Khó Hiểu"
 first_contact.430.desc:0 "Nghiên cứu về [This.ContactCountry.GetName] càng tiến sâu, các [This.Owner.GetResearchers] càng thêm bối rối. Dù họ rõ ràng là sinh vật có trí tuệ, nhưng phương thức giao tiếp của họ lại chưa từng được nghe thấy. Thứ chúng ta nhận được không phải tín hiệu âm thanh hay văn bản, mà là một màn trình diễn ánh sáng rực rỡ từ cơ thể hoặc thiết bị số của họ, với quang phổ vượt xa tầm mắt của [This.Owner.GetSpeciesNamePlural]. Rõ ràng việc hiểu được họ sẽ là một thách thức lớn."
 first_contact.430.A:0 "$first_contact.415.A$"
 first_contact.430.B:0 "$first_contact.415.B$"
 first_contact.435.name:0 "Vượt Qua Rào Cản Ánh Sáng"
 first_contact.435.desc:0 "$first_contact.440.desc$\n\nTrong quá trình nghiên cứu, chúng ta ngạc nhiên phát hiện ra rằng các quy luật ánh sáng của họ mang sự tương đồng đáng kinh ngạc với những luồng xoáy trong không gian liên sao - thứ làm cho việc du hành qua siêu lộ không gian trở nên khả thi. Các [This.Owner.GetResearchers] của chúng ta bối rối trước ý nghĩa của mối liên hệ này và đề xuất nghiên cứu sâu hơn về chủ đề này."
 OCTOPODES_LIGHT_PATTERNS_PROJECT:0 "Mô Hình Ánh Sáng của [encountered_country.GetSpeciesAdj]"
 OCTOPODES_LIGHT_PATTERNS_PROJECT_DESC:0 "Trong cuộc chạm trán với [encountered_country.GetSpeciesNamePlural], chúng ta đã phát hiện ra một số điểm tương đồng đáng kinh ngạc giữa các mô hình ánh sáng họ dùng để giao tiếp và những vòng xoáy của không gian liên sao cho phép du hành qua siêu lộ. Nghiên cứu sâu hơn về chủ đề này có thể làm sáng tỏ những khối kiến trúc nền tảng của thiên hà."
 first_contact.437.name:0 "Hiểu Biết Về Siêu Lộ"
 first_contact.437.desc:0 "Nghiên cứu của chúng ta về mối liên hệ giữa các mô hình không gian liên sao và những vệt sáng xoáy của [encountered_country.GetSpeciesAdj] đã mang lại kết quả bất ngờ. Có vẻ như các quy tắc mà người [encountered_country.GetSpeciesNamePlural] tạo ra mô hình ánh sáng của họ - bản thân họ cũng không hề hay biết - hoàn toàn trùng khớp với cách các dòng chảy siêu lộ trôi dạt theo thời gian, chỉ khác nhau về mặt quy mô.\n\nDo đó, qua việc nghiên cứu [encountered_country.GetSpeciesNamePlural], chúng ta sẽ có thể dự đoán tốt hơn các dòng chảy của siêu lộ - giúp tăng đáng kể tầm quét cảm biến tiềm năng."
 first_contact.437.A:1 "Chúng ta giờ đây đã mở ra những tiềm năng mới."
 first_contact.440.name:0 "Ngôn Ngữ Của Ánh Sáng"
 first_contact.440.desc:0 "Những nỗ lực của chúng ta đã được đền đáp, và giờ đây chúng ta có thể hiểu được các tín hiệu ánh sáng phát ra từ [This.ContactCountry.GetName] và giao tiếp với họ, ít nhất là ở mức độ sơ khai. Có vẻ như người [This.ContactCountry.GetSpeciesNamePlural], như họ tự gọi mình, chưa bao giờ phát triển ngôn ngữ nói mà thay vào đó sử dụng các màn hiển thị ánh sáng. Mặc dù họ từng dùng chữ viết, nhưng họ coi nó kém thanh lịch và kém hiệu quả hơn nhiều so với ngôn ngữ thị giác. Não bộ của họ dường như thích nghi hoàn hảo để nhanh chóng suy ra ý nghĩa từ những màn hiển thị phức tạp, vì vậy họ ưa chuộng ghi hình ánh sáng trong hầu hết trường hợp."
 first_contact.440.A:0 "Hãy xem họ có điều gì muốn nói."

 first_contact.450.name:0 "Thi Ca"
 first_contact.450.desc:0 "Những dữ liệu thu được từ tín hiệu của §H[This.ContactCountry.GetName]§! đã khiến các [Owner.GetLinguists] của chúng ta vô cùng hào hứng. Dù không một âm tiết nào có thể hiểu được, bản thân các âm thanh này không thể phủ nhận là có nhịp điệu hoàn hảo, và thực sự êm dịu một cách kỳ lạ. Dù chưa thể chắc chắn, các [Owner.GetLinguists] tin rằng đó là một hình thức thi ca. Họ đề xuất chúng ta đáp lại bằng một bài thơ tương tự."
 first_contact.450.A:0 "Dĩ nhiên rồi. Hãy gửi lại một khúc quân hành chiến trận!"
 first_contact.450.A.tooltip:0 "Kìa! Hãy để cờ bay phấp phới -\nBởi giờ đây chúng ta xuất quân xung trận" #made up
 first_contact.450.B:0 "Chúng ta có thể chia sẻ những vần thơ tuyệt mỹ về sự khám phá."
 first_contact.450.B.tooltip:0 "Nỗ lực, kiếm tìm, khám phá... và không bao giờ chịu khuất phục."
 first_contact.450.C:0 "Làm họ mê đắm bằng những vần thơ về tình hữu nghị."
 first_contact.450.C.tooltip:0 "Liệu ta có nên ví người với một cơn gió mặt trời..."
 first_contact.450.D:0 "Gửi cho họ một thứ gì đó đầy bí ẩn."
 first_contact.450.D.tooltip:0 "Jolifanto bambla o falli bambla\ngrossiga m'pfa habla horem"
 first_contact.450.E:0 "Chúng ta không có thời gian cho việc này."
 first_contact.455.name:0 "Gây Ra Sự Khó Chịu"
 first_contact.455.desc:0 "Vài giờ sau khi chúng ta phát đi khúc ca chiến trận, các tín hiệu truyền phát từ §H[This.ContactCountry.GetName]§! đã ngừng hẳn. Tàu của họ đã di chuyển ra xa ngoài tầm tấn công hiệu quả. Chúng ta có thể phỏng đoán rằng họ đã hiểu được đại ý thông điệp của chúng ta, và chẳng hề hài lòng với những gì nghe được."
 first_contact.460.name:0 "Giao Lưu Khúc Ca Chiến Trận"
 first_contact.460.desc:0 "Chỉ vài phút sau khi truyền phát, các tín hiệu từ §H[This.ContactCountry.GetName]§! đã thay đổi. Vẫn nhịp nhàng không tì vết, nhưng không còn êm đềm nữa mà trở nên sôi nổi, dồn dập. Quả thực rất giống một khúc tráng ca chiến trận. Họ không có động thái thù địch nào - dường như họ cảm thấy phấn khích chứ không hề bị khiêu khích trước thi ca của chúng ta. Chúng ta đã gửi thêm một vài biến thể của bài ca đầu tiên, và đổi lại đang nhanh chóng thu thập được một tuyển tập thơ chiến trận của [This.ContactCountry.GetName]."
 first_contact.460.A:0 "Một giống loài thực sự tâm đầu ý hợp với chúng ta."
 first_contact.462.name:0 "Khúc Ca Chiến Trận Phản Tác Dụng"
 first_contact.462.desc:0 "Có vẻ như nhóm §H[This.ContactCountry.GetName]§! đã phật ý trước khúc ca xung trận của chúng ta. Phản ứng của họ diễn ra tức thì - và bạo lực. Họ bắt đầu khai hỏa, và tàu của chúng ta may mắn thoát thân an toàn mà không hề hấn gì. Xem ra chúng ta sắp có một cuộc chiến trong tay!"
 first_contact.465.name:0 "Trao Đổi Thi Ca"
 first_contact.465.desc:0 "Phản hồi đối với bài thơ của chúng ta dường như rất nồng nhiệt: luồng phát sóng tiếp tục không ngừng nghỉ, và chúng ta đang xây dựng một thư viện đáng kể các tác phẩm của §H[This.ContactCountry.GetName]§!. Dù chúng ta vẫn chưa gán được ý nghĩa cho từng từ, nhưng những người ngoài hành tinh này đã chứng tỏ sự thích ứng tuyệt vời trong việc bắt nhịp cao độ và âm sắc của các bài thơ, điều này chắc chắn sẽ giúp các [Owner.GetLinguists] diễn giải chúng."
 first_contact.465.A:0 "Họ thật là dễ mến."
 first_contact.470.name:0 "Những Lời Tán Tỉnh"
 first_contact.470.desc:0 "Sau vài phút im lặng kéo dài, các tín hiệu phát từ §H[This.ContactCountry.GetName]§! lại tiếp tục. Dù vẫn chưa hiểu được, nhưng chúng đã thay đổi rõ rệt: một giai điệu được các [Owner.GetLinguists] của chúng ta miêu tả là tinh nghịch, gần như e thẹn. Đáng kinh ngạc thay, có vẻ như họ đang tán tỉnh chúng ta!"
 first_contact.470.A:0 "Thật là ngượng ngùng quá đi."
 first_contact.470.B:0 "Một phản ứng hữu lý."
 first_contact.472.desc:0 "Từng phút trôi thành từng giờ, và vẫn không có hồi đáp nào từ phía §H[This.ContactCountry.GetName]§!. Dù họ khó lòng hiểu được chính xác ý nghĩa thi ca của chúng ta, nhưng dường như họ đã bị bất ngờ trước những cảm xúc được bày tỏ trong đó, và giờ đây đang tiếp cận chúng ta theo cách thận trọng và dè dặt hơn nhiều."
 first_contact.474.name:0 "Những Âm Thanh Hỗn Loạn"
 first_contact.474.desc:0 "Nhóm §H[This.ContactCountry.GetName]§! đang đáp lại tương tự: những khúc ca nhịp nhàng đã biến thành tiếng ồn hỗn loạn ngẫu nhiên, bắt chước các âm thanh vô nghĩa của chính chúng ta. Trong sự tuyệt vọng, các [Owner.GetLinguists] của chúng ta mô tả những nỗ lực giải mã các âm thanh này là \"hoàn toàn vô ích\", bởi thực tế giờ đây không thể tìm ra bất kỳ quy luật nào nữa."
 first_contact.474.A:0 "Việc này sẽ làm chúng ta thụt lùi tiến độ."
 first_contact.475.name:0 "Xung Đột Chấm Dứt"
 first_contact.475.desc:0 "Khi chúng ta bắt đầu thấu hiểu lẫn nhau, các hành động thù địch với [This.ContactCountry.GetName] - hay đúng hơn là §H[This.ContactCountry.GetRealName]§! - đã chấm dứt. Bất chấp sự hung hăng trước đó, họ dường như coi chúng ta là những \"chiến binh danh dự\" mà họ rất sẵn lòng so tài lần nữa. Liệu đây là khởi đầu của tình bạn hay khúc dạo đầu của chiến tranh thì vẫn còn phải chờ xem, nhưng ít nhất chúng ta đã có dịp trau dồi các khúc ca chiến trận của mình!"
 first_contact.475.A:0 "Một cuộc giao lưu kỳ lạ."
 first_contact.480.name:0 "Giải Mã Thi Ca Thành Công"
 first_contact.480.desc:0 "Những nỗ lực của chúng ta đã được đền đáp, cho phép chúng ta giải mã các thông điệp được gửi bởi [This.ContactCountry.GetName], hiện chúng ta biết là §H[This.ContactCountry.GetRealName]§!. Dựa trên phong cách sáng tác của họ, họ đặt tầm quan trọng phi thường vào nghệ thuật thi ca. Bằng cách tham gia vào cuộc trao đổi trữ tình này, chúng ta không chỉ giành được sự ngưỡng mộ của họ, mà còn học được khối lượng thông tin đáng kể về họ trong suốt quá trình."
 first_contact.485.name:0 "Giải Mã Câu Đố Bí Ẩn"
 first_contact.485.desc:0 "Sau một tiến trình tiếp xúc đầu tiên dài và gian nan, các [Owner.GetLinguists] của chúng ta giờ đây có thể nhận diện [This.ContactCountry.GetName] là §H[This.ContactCountry.GetRealName]§!. Họ chúc mừng chúng ta đã giải được những câu đố ngôn ngữ của họ, dù họ có vẻ hơi phật ý vì chúng ta mất quá nhiều thời gian. Ít nhất, các [Owner.GetLinguists] của chúng ta đã đi tiên phong trong một số phương pháp nhận dạng quy luật mới, điều sẽ rất có ích cho chúng ta trong tương lai."
 first_contact.485.A:0 "Phù, nhẹ cả người."
 first_contact.490.name:0 "Bản Dịch Lời Tâng Bốc"
 first_contact.490.desc:0 "Những nỗ lực của chúng ta đã mang lại kết quả, và giờ đây chúng ta có thể diễn giải các thông điệp gửi từ [This.ContactCountry.GetName], những kẻ mà giờ đây chúng ta biết là §H[This.ContactCountry.GetRealName]§!:\n\n\"A, nghệ thuật tâng bốc thật tinh tế. Thật tuyệt vời khi được gặp một giống loài khác cũng biết trân trọng thi ca, và đặc biệt là một loài nhiệt huyết và đáng yêu như các bạn, [Owner.GetSpeciesName] ngọt ngào của tôi - cầu chúc những điều tốt lành nhất cho [Owner.GetSpeciesOrganName] của bạn.\"\n\nThông điệp tiếp tục khá dài với giọng điệu tương tự. Chúng ta không hoàn toàn chắc chắn nên cảm thấy hãnh diện hay ngỡ ngàng, nhưng có vẻ mối quan hệ của chúng ta đã có một khởi đầu tốt đẹp." #the funnier versions of GetSpeciesOrganName are 100% intended
 first_contact.490.A:0 "Họ thật là tử tế."

 first_contact.500.name:0 "Thù Địch Khi Tiếp Xúc Đầu Tiên"
 first_contact.500.desc:0 "Rõ ràng phản hồi của chúng ta là không thích hợp: phản ứng của §Y[contact_country.GetName]§! diễn ra nhanh chóng và thù địch khi họ bắt đầu nã pháo vào tàu chúng ta. Có vẻ như chúng ta sắp có một trận chiến trên [Owner.GetSpeciesHandNamePlural] của mình!"
 first_contact.500.A:0 "Cầm vũ khí lên!"
 first_contact.500.A.tooltip:0 "§Y[contact_country.GetName]§! giờ đây đã thù địch với chúng ta."
 first_contact.505.desc:0 "Chưa rõ điều gì đã sai sót, nhưng §Y[contact_country.GetName]§! bất ngờ tấn công chúng ta! Có vẻ như chúng ta sắp có một trận chiến trên [Owner.GetSpeciesHandNamePlural] của mình!"

 #Random events
 first_contact.5000.name:1 "Tìm Thấy Tín Hiệu Rõ Ràng"
 first_contact.5000.desc:2 "Cảm biến của chúng ta đã phát hiện một tín hiệu lặp lại đặc biệt rõ nét từ §H[This.ContactCountry.GetName]§!, dường như cung cấp cho các [This.Owner.GetLinguists] nguồn tư liệu xuất sắc để hệ thống hóa ngôn ngữ của họ. Họ lạc quan rằng chúng ta sẽ có thể tạo ra những bước tiến đáng kể nhờ vào sự may mắn này."
 first_contact.5000.desc2:0 "Chúng ta đã bắt được luồng âm thanh rõ nét về các cuộc đối thoại giữa nhiều con tàu của §H[This.ContactCountry.GetName]§!. Dù các [This.Owner.GetLinguists] của chúng ta vẫn chưa hiểu được ý nghĩa của bất kỳ từ ngữ nào mà họ ghi lại, họ vẫn lạc quan rằng tín hiệu mới này sẽ giúp họ đạt được tiến triển đáng kể hướng tới một bước đột phá."
 first_contact.5005.name:1 "Sự Thiếu Hụt Tín Hiệu"
 first_contact.5005.desc:2 "Các [This.Owner.GetLinguists] của chúng ta ngày càng thất vọng vì chúng ta không cung cấp đủ tư liệu để họ đạt tiến triển trong việc giải mã ngôn ngữ của §H[This.ContactCountry.GetName]§!. Có vẻ như những người ngoài hành tinh này đang làm hết sức mình để ngăn tín hiệu của họ lọt vào [This.Owner.GetSpeciesEarNamePlural] không mong muốn!"
 first_contact.5005.A:0 "Tiếp tục cố gắng!"
 first_contact.5010.name:0 "Nhận Diện Sai Lầm"
 first_contact.5010.desc:0 "Có vẻ như các [This.Owner.GetLinguists] của chúng ta đã gặp phải một §Htrở ngại§! lớn trong nỗ lực hệ thống hóa ngôn ngữ được sử dụng bởi §H[This.ContactCountry.GetName]§!. Thật không may, thứ mà họ ngỡ là ngôn ngữ thực ra lại hoàn toàn không phải là ngôn ngữ. Trong báo cáo của [This.Leader.GetHerHis], [This.Owner.GetEnvoyCap] [This.Leader.GetName] cho biết sau nhiều ngày nghiên cứu vấn đề từ mọi góc độ, các [This.Owner.GetLinguists] cuối cùng kết luận rằng đó thực chất có lẽ là một nỗ lực sáng tác âm nhạc..."
 first_contact.5010.A:0 "Một sai sót đáng tiếc."
 first_contact.5015.name:0 "[This.ContactCountry.GetName] Quét [This.Owner.Capital.GetName]"
 first_contact.5015.desc:0 "Trong một sự việc gây chấn động sâu sắc tới nhiều [This.Owner.GetSpeciesNamePlural], một con tàu thuộc §H[This.ContactCountry.GetName]§! đã quét bề mặt §H[This.Owner.Capital.GetName]§!. Ý kiến đang bị chia rẽ giữa việc liệu chúng ta nên coi cú sốc này như một bàn đạp để đẩy mạnh nỗ lực thiết lập quan hệ chặt chẽ hơn với các nền văn minh ngoài hành tinh, hay nên coi đó là một lời cảnh báo rằng chúng ta phải chấn chỉnh hạm đội của mình ngay từ bây giờ, trước khi quá muộn."
 first_contact.5015.desc.xenophile:0 "Trong một biến cố mang lại sự ngạc nhiên đáng hoan nghênh cho nhiều [This.Owner.GetSpeciesNamePlural], một con tàu thuộc [This.ContactCountry.GetName] đã quét §H[This.Owner.Capital.GetName]§!. Mặc dù một số người lo ngại rằng những sinh vật ngoài hành tinh này có thể không hiếu khách như chúng ta, nhưng sự đồng thuận rộng rãi đã được thiết lập rằng chúng ta nên phản ứng bằng cách nhân đôi nỗ lực xây dựng quan hệ gần gũi hơn với các nền văn minh khác trong thiên hà."
 first_contact.5015.desc.xenophobe:0 "Trong một sự việc gây chấn động sâu sắc tới nhiều [This.Owner.GetSpeciesNamePlural], một con tàu thuộc §H[This.ContactCountry.GetName]§! đã quét bề mặt §H[This.Owner.Capital.GetName]§!. Sự đồng thuận rộng rãi đã xuất hiện rằng chúng ta phải đáp trả sự xâm phạm này bằng cách khẩn trương đưa hạm đội vào tình trạng sẵn sàng chiến đấu cao nhất, trước khi quá muộn."
 first_contact.5015.desc.gestalt:0 "Trong một diễn biến đáng lo ngại, một con tàu thuộc §H[This.ContactCountry.GetName]§! đã quét bề mặt §H[This.Owner.Capital.GetName]§!. Chúng ta chưa chắc chắn nên phản ứng thế nào: tăng cường nỗ lực liên lạc hay củng cố lực lượng phòng thủ?"
 first_contact.5015.desc.gestalt.homicidal:0 "Một con tàu thuộc §H[This.ContactCountry.GetName]§! dám cả gan quét bề mặt §H[This.Owner.Capital.GetName]§!. Hành động khiêu khích này của lũ dị chủng sẽ bị đáp trả bằng sự hủy diệt hoàn toàn."
 first_contact.5015.A:0 "Hãy sử dụng điều này để thúc đẩy liên lạc."
 first_contact.5015.B:0 "Chấn chỉnh lại các hạm đội ngay lập tức."
 first_contact.5020.name:0 "Phát Hiện Thủ Đô của [This.ContactCountry.GetName]"
 first_contact.5020.desc:0 "Chúng ta đã xác định được thuộc địa mà chúng ta quét gần đây trong hệ sao §H[This.ContactCountry.Capital.System.GetName]§! chính là thủ đô của §H[This.ContactCountry.GetName]§!. Các [This.Owner.GetResearchers] của chúng ta đã tìm thấy nhiều manh mối giá trị về họ bằng cách nghiên cứu dữ liệu thu thập được từ lần quét đó."
 first_contact.5025.name:0 "Mảnh Dữ Liệu Rơi Rớt"
 first_contact.5025.desc:0 "Chúng ta đã không còn thấy bóng dáng hay nghe được âm thanh nào từ §H[This.ContactCountry.GetName]§! trong một thời gian rồi. Các [This.Owner.GetResearchers] nhận thấy họ có quá ít thông tin để tiếp tục và lo ngại rằng dấu vết có thể đã nguội lạnh."
 first_contact.5025.A:0 "Một sự may mắn tuyệt vời."
 first_contact.5030.name:0 "Trực Giác Ngôn Ngữ"
 first_contact.5030.desc:0 "Khi chúng ta bắt đầu thu thập được ngày càng nhiều hình ảnh trực quan về những người ngoài hành tinh được gọi là §H[This.ContactCountry.GetName]§!, việc những hình ảnh này cuối cùng bị rò rỉ ra công chúng rộng rãi là điều tất yếu. Diện mạo của họ đã tỏ ra rất đáng yêu đối với công chúng [This.Owner.GetAdj], những người giờ đây đang nóng lòng muốn làm quen thân thiết hơn với những người ngoài hành tinh này."
 first_contact.5030.desc.machine:0 "Khi chúng ta bắt đầu thu thập ngày càng nhiều hình ảnh thị giác về những người ngoài hành tinh mang tên §H[This.ContactCountry.GetName]§!, chúng ta nhanh chóng nhận ra mình đang đối diện với một xã hội robot. Việc tin tức này rò rỉ ra công chúng rộng rãi chỉ là vấn đề thời gian. Sự thật này đã khơi dậy sự kinh ngạc trong công chúng [This.Owner.GetAdj], những người ngỡ ngàng rằng máy móc có thể xây dựng nền văn minh du hành vũ trụ của riêng mình, và đang nóng lòng muốn làm quen thân cận hơn với họ."
 first_contact.5030.A:0 "$first_contact.5035.A$"
 first_contact.5030.A.tooltip:0 "Ý kiến của chúng ta về §H[This.ContactCountry.GetName]§! được cải thiện."
 first_contact.5035.name:0 "Sự Khác Biệt Văn Hóa"
 first_contact.5035.desc:0 "Khi chúng ta thu thập ngày càng nhiều hình ảnh về người ngoài hành tinh §H[This.ContactCountry.GetName]§!, việc chúng bị rò rỉ ra công chúng là điều tất yếu. Diện mạo của họ đã gây ra sự hoang mang sợ hãi lan rộng trong dân chúng chúng ta, những người đã bắt đầu gọi họ là §H\"lũ [This.ContactCountry.GetSpeciesNamePluralInsult] kinh tởm\"§!. Rất nhiều người đang yêu cầu chúng ta phải hành động để đối phó với \"mối đe dọa [This.ContactCountry.GetSpeciesClass]\" mới này..."
 first_contact.5035.desc.machine:0 "Khi chúng ta thu thập ngày càng nhiều hình ảnh về người ngoài hành tinh [This.ContactCountry.GetName], chúng ta không thể phủ nhận sự thật: chúng ta đang đối phó với một xã hội robot. Việc tin tức bị rò rỉ chỉ là vấn đề thời gian. Sự thật này gây ra nỗi kinh hoàng lan rộng trong dân chúng, những người gọi họ là §H\"lũ [This.ContactCountry.GetSpeciesNamePluralInsult] kinh tởm\"§!. Nhiều người đang yêu cầu chúng ta hành động đối phó với \"mối đe dọa cơ giới\" mới..."
 first_contact.5035.A:0 "Chúng ta cần thêm thời gian để nghiên cứu."
 first_contact.5035.B:0 "Tìm kiếm các điểm tương đồng cơ bản."
 first_contact.5040.name:0 "Sự Tương Đồng Đáng Kinh Ngạc"
 first_contact.5040.desc:0 "Các [This.Owner.GetResearchers] của chúng ta đã đạt tiến độ ổn định trong việc thu thập một tập hợp lớn các tín hiệu từ §H[This.ContactCountry.GetName]§!. Tuy nhiên, khi hiểu biết về ngôn ngữ của họ tăng lên, các [This.Owner.GetLinguists] lại càng trở nên bối rối hơn. Rõ ràng, họ đã phải đánh giá lại các bản dịch làm việc trước đây nhiều lần sau khi phát hiện ra rằng ý nghĩa họ gán cho các từ ngữ thực chất là §Hcực kỳ thiếu chính xác§!. Dường như toàn bộ thế giới quan của [This.ContactCountry.GetName] rất khác biệt so với chúng ta - khác xa hơn nhiều so với những gì chúng ta có thể tưởng tượng!"
 first_contact.5040.desc.gestalt:0 "Mặc dù chúng ta đạt tiến độ ổn định trong việc gom góp một kho tín hiệu lớn từ §H[This.ContactCountry.GetName]§!, tiến độ thực sự thấu hiểu các tín hiệu này lại... không như mong đợi. Các [This.Owner.GetLinguists] của chúng ta đã buộc phải đánh giá lại các bản dịch làm việc trước đây nhiều lần sau khi phát hiện ra ý nghĩa họ gán cho các từ ngữ thực chất là §Hcực kỳ thiếu chính xác§!."
 first_contact.5040.desc.hive:0 "$first_contact.5040.desc.gestalt$ Có vẻ như các mô hình tư duy của [This.ContactCountry.GetName] rất khác biệt với chúng ta - khác xa so với những gì chúng ta từng nghĩ là có thể, ngay cả giữa các giống loài ngoài hành tinh!"
 first_contact.5040.desc.machine:0 "$first_contact.5040.desc.gestalt$ Có vẻ như [This.ContactCountry.GetName] không dựa logic thực thi của họ trên bất kỳ dạng tính duy lý nào mà chúng ta biết. Điều này sẽ khiến việc thấu hiểu họ trở thành một thử thách khốc liệt!"
 first_contact.5040.A:0 "Điều này thật đáng khích lệ."
 first_contact.5045.name:0 "Tiến Triển Nhanh Chóng"
 first_contact.5045.desc:0 "Khi thu thập thêm tư liệu về §H[This.ContactCountry.GetName]§!, các [This.Owner.GetLinguists] của chúng ta đã rất bất ngờ trước tốc độ tiến triển nhanh chóng. Có vẻ như - nếu họ đúng - những người ngoài hành tinh này chia sẻ phần lớn thế quan của chúng ta về toàn thể thiên hà."
 first_contact.5045.desc.hive:0 "Khi thu thập thêm tư liệu về §H[This.ContactCountry.GetName]§!, các [This.Owner.GetLinguists] của chúng ta đã rất ngạc nhiên trước tốc độ tiến triển mau lẹ. Có vẻ như những người ngoài hành tinh này chia sẻ các mô hình tư duy rất giống với chúng ta. Có lẽ ý thức của họ cũng tương tự như [This.Owner.GetGovernmentName] của chúng ta?"
 first_contact.5045.desc.machine:0 "Khi thu thập thêm tư liệu về §H[This.ContactCountry.GetName]§!, các [This.Owner.GetLinguists] của chúng ta đã ngạc nhiên trước tốc độ xử lý nhanh chóng. Có vẻ như những sinh vật này chia sẻ logic thực thi rất giống với chúng ta. Có lẽ một AI tương tự như [This.Owner.GetGovernmentName] của chúng ta đang ẩn sau những tín hiệu này?"
 first_contact.5045.A:0 "Điềm báo tốt lành cho quan hệ tương lai giữa hai bên."
 first_contact.5045.B:0 "Tất nhiên rồi. Sao chúng lại không căm ghét lũ dị chủng cơ chứ?"
 first_contact.5045.C:0 "Thật tốt khi gặp được những kẻ giống như chúng ta."
 first_contact.5050.name:0 "Dịch Thuật Sai Lệch"
 first_contact.5050.desc:0 "Những nỗ lực giải mã ngôn ngữ trong tín hiệu từ §H[This.ContactCountry.GetName]§! đã gặp phải bước lùi. Có vẻ như một giả định then chốt mà các [This.Owner.GetLinguists] của chúng ta dựa vào trong các bản dịch đã bị §Hbác bỏ hoàn toàn§!. Mặc dù điều này đồng nghĩa với việc phần lớn tiến độ sẽ phải chỉnh sửa lại, nhưng ít nhất các nỗ lực tương lai hy vọng sẽ được xây dựng trên nền tảng đáng tin cậy hơn."
 first_contact.5055.name:0 "Tiến Độ Đều Đặn"
 first_contact.5055.desc:0 "Các [This.Owner.GetLinguists] của chúng ta gần đây đã đạt được bước tiến đáng kể hướng tới việc giải mã ngôn ngữ từ các tín hiệu của §H[This.ContactCountry.GetName]§!. Rõ ràng giờ đây họ tin rằng mình đã nắm vững các nguyên lý cơ bản và hứa hẹn sẽ sớm báo cáo các phát hiện tiếp theo."
 first_contact.5055.A:0 "Hãy tiếp tục phát huy!"
 first_contact.5065.name:0 "Phát Hiện Tín Hiệu Rõ Ràng"
 first_contact.5065.desc:1 "Chúng ta từng chật vật thu thập đủ thông tin về §H[This.ContactCountry.GetName]§! để các [This.Owner.GetLinguists] có cơ sở làm việc, nhưng giờ đây các nỗ lực đã nhận được cú hích lớn: các cảm biến đã bắt được một cuộc trao đổi dài giữa nhiều tàu của họ. Chúng ta chỉ có thể phỏng đoán rằng họ đã lơ là cảnh giác trong giây lát, hoặc có lẽ công nghệ của họ không tiên tiến như chúng ta ngờ vực và họ ngỡ kênh liên lạc của mình là an toàn..."
 first_contact.5070.name:0 "Ngôn Ngữ Học Sắc Màu"
 first_contact.5070.desc:0 "Các [This.Owner.GetLinguists] của chúng ta đã tạo ra bước đột phá khi giải mã ngôn ngữ của §H[This.ContactCountry.GetName]§!. Họ sử dụng một bảng chữ cái gồm gần mười bảy triệu ký tự độc nhất, tương ứng với một màu sắc trên quang phổ đỏ - xanh lá - xanh dương. Dù phức tạp rối rắm, các nhà ngôn ngữ học của chúng ta tin chắc rằng họ sẽ có thể giải mã được thứ ngôn ngữ ngoài hành tinh này. Họ chỉ cần thêm chút thời gian."
 first_contact.5070.A:0 "Đèn xanh rộng mở suốt chặng đường."
 first_contact.5071.name:0 "Giải Mã Ngôn Ngữ Sắc Màu"
 first_contact.5071.desc:0 "Bằng cách sử dụng hệ thống số vị trí thập lục phân, các nhà toán học và [This.Owner.GetLinguists] của chúng ta đang cận kề bước đột phá về ngôn ngữ sắc màu với §H[This.ContactCountry.GetName]§!. Các quan chức đang chuẩn bị giao thức tiếp xúc đầu tiên.\n\nQua nghiên cứu ngôn ngữ của §H[This.ContactCountry.GetName]§!, chúng ta biết nền văn hóa của họ vô cùng uyên bác. Nguy cơ hiểu lầm tiềm ẩn là rất cao. Giờ đây chúng ta phải quyết định xem nên đánh vào tính logic hay vào cảm xúc của họ..."
 first_contact.5071.desc.gestalt:0 "Bằng cách sử dụng hệ thống số vị trí thập lục phân, tập thể đang cận kề bước đột phá về ngôn ngữ sắc màu với §H[This.ContactCountry.GetName]§!. Chúng ta đang chuẩn bị các giao thức tiếp xúc đầu tiên.\n\nGiờ đây chúng ta có thể chiều theo cảm xúc của họ bằng một lời chào mang ý nghĩa văn hóa sâu sắc, hoặc có thể thử nghiệm một giao thức phức tạp hơn để tăng hiệu quả tiềm năng."
 first_contact.5071.A:0 "Liên lạc với họ bằng một khúc ca!"
 first_contact.5071.A.tooltip:0 "Chúng ta sẽ cố gắng tạo dựng mối liên kết cảm xúc với [This.ContactCountry.GetName]."
 first_contact.5071.B:0 "Không để cảm xúc xen vào."
 first_contact.5072.name:0 "Kết Nối Cảm Xúc!"
 first_contact.5072.desc:0 "Những nỗ lực kết nối ở mức độ cảm xúc với §H[This.ContactCountry.GetName]§! đã đơm hoa kết trái.\n\nCác [This.Owner.GetLinguists] của chúng ta đã chứng minh sự thấu hiểu về văn hóa của họ, và kết quả là chúng ta đã được đón tiếp nồng hậu. Nhiệm vụ hoàn thành với phong thái tuyệt vời!"
 first_contact.5072.desc.gestalt:0 "Tận dụng cảm xúc, chúng ta đã giành được thiện cảm từ §H[This.ContactCountry.GetName]§!.\n\nCác [This.Owner.GetLinguists] của chúng ta đã thể hiện sự thấu hiểu văn hóa của họ, và kết quả là chúng ta được chào đón nồng nhiệt. Nhiệm vụ hoàn thành."
 first_contact.5073.name:0 "Xúc Phạm Thảm Hại!"
 first_contact.5073.desc:0 "Nỗ lực kết nối ở mức độ cảm xúc với §H[This.ContactCountry.GetName]§! đã dẫn đến kết quả thảm hại.\n\nCác [This.Owner.GetLinguists] của chúng ta đã thất bại trong việc thể hiện sự thấu hiểu văn hóa của họ, và hệ quả là chúng ta đã xúc phạm họ nặng nề!"
 first_contact.5073.desc.gestalt:0 "Tận dụng cảm xúc, chúng ta đã thất bại trong việc giành thiện cảm từ §H[This.ContactCountry.GetName]§!\n\nCác [This.Owner.GetLinguists] của chúng ta không thể thể hiện sự thấu hiểu văn hóa của họ, và hệ quả là họ cảm thấy bị xúc phạm sâu sắc."
 first_contact.5075.name:0 "Sự Nhiễu Loạn Giao Tiếp"
 first_contact.5075.desc:0 "Ngôn ngữ của §H[This.ContactCountry.GetName]§! chứa hàng triệu âm thanh dường như dư thừa, hiển nhiên là những tàn dư phương ngữ từ các nền văn minh tiền thân của họ. Khi dịch, những từ đệm có vẻ thừa thãi này dường như không có mục đích nào khác ngoài việc thêm thắt sắc thái ngôn ngữ - hoặc cùng lắm chỉ có hàm ý ngữ cảnh nhỏ.\n\nMay thay, các [This.Owner.GetLinguists] của chúng ta đã khoanh vùng được các khía cạnh lỗi thời trong ngôn ngữ của họ, và hiện đang biên soạn một cuốn từ điển rút gọn sẽ rất hữu ích cho việc giao tiếp hiệu quả với §H[This.ContactCountry.GetName]§!."

 # The Trial
 first_contact.5080.name: "Tàu Con Thoi"
 first_contact.5080.desc.start: "Nhóm §H[This.ContactCountry.GetName]§! đã bố trí một tàu con thoi ở gần chúng ta trong không gian. Vì không có động thái nào tiếp theo, chúng ta cho rằng họ muốn gặp mặt bên ngoài tàu chính của họ. Kích thước nhỏ của con tàu đồng nghĩa với việc chỉ có [Owner.GetEnvoy] [Leader.GetName] của chúng ta có thể được cử đi, phần còn lại của đoàn ngoại giao ở lại phía sau."
 first_contact.5080.desc.weapon: "Tàu con thoi được trang bị các hệ thống vũ khí tinh vi và người ngoài hành tinh đã sẵn sàng cho một cuộc đối đầu bạo lực." # Likely militarist
 first_contact.5080.desc.functional: "Tàu con thoi mang tính thực dụng và đồ sộ. Công năng rõ ràng đã được ưu tiên hơn hình thức." # Likely egalitarian
 first_contact.5080.desc.bling: "Tàu con thoi được bao phủ bởi những họa tiết trang trí cầu kỳ và đinh tán mạ vàng. Nó rõ ràng được thiết kế để gây ấn tượng bằng sự phô trương xa hoa." # Likely materialist
 first_contact.5080.desc.standard: "Tàu con thoi ngoài hành tinh tương tự như các thiết kế của chúng ta, điều này mang lại cảm giác an tâm phần nào." # Standard

 first_contact.5085.name: "Sự Chờ Đợi"
 first_contact.5085.desc.start: "[Leader.GetName] trở về báo cáo rằng không có ai từ phía §H[This.ContactCountry.GetName]§! ra gặp [Leader.GetHimHer]."
 first_contact.5085.desc.meditation: "Tàu con thoi không người lái chứa một phòng họp trung tâm. Sàn và tường được bao phủ bằng vật liệu mềm mại, trong khi những âm thanh tự nhiên êm dịu từ một thế giới ngoài hành tinh phát ra từ các loa ẩn." # Likely pacifist
 first_contact.5085.desc.pool: "Tàu con thoi không người lái chứa một phòng họp trung tâm với một hồ nước ở một đầu. Các biểu tượng ngoài hành tinh bao quanh sàn nhà quanh hồ nước." # Likely spiritualist
 first_contact.5085.desc.imposing: "Tàu con thoi không người lái chứa một phòng họp trung tâm với phong cách kiến trúc vừa khiêm nhường lại vừa uy nghi kỳ lạ. Các góc tường và đồ trang trí được thiết kế để thu hút sự chú ý của người xem về phía một bục nâng cao." # Likely authoritarian
 first_contact.5085.desc.standard: "Tàu con thoi không người lái chứa một phòng họp trung tâm đơn điệu đến kinh ngạc, hoàn toàn thiếu vắng các chi tiết trang trí hay điểm nhấn." # Standard
 first_contact.5085.desc.end: "Một bức tường được bao phủ bởi các thiết bị ghi âm và cảm biến. Đứng trước những cỗ máy vô cảm, [Leader.GetName] đã trình bày khái quát lịch sử và văn hóa của giống loài chúng ta. Bài thuyết trình chỉ nhận lại sự im lặng. Trong nỗi bực bội, [Leader.GetName] đã để lại một máy tính bảng video chứa bộ sưu tập đồ sộ các ghi chép lịch sử và sách vỡ lòng về ngôn ngữ của chúng ta."
 first_contact.5085.a: "Bây giờ chúng ta chờ đợi."

 first_contact.5090.name: "Phương Thức"
 first_contact.5090.desc.proactive: "Cuộc giao tiếp một chiều đã khiến phái đoàn ngoại giao vô cùng ức chế. Nôn nóng muốn có một cuộc tiếp xúc đầu tiên thành công, họ đã xây dựng các chiến lược dự đoán phân nhánh cho quy trình còn lại mà không có bất kỳ thông tin thực tế nào để định hình cách tiếp cận."
 first_contact.5090.desc.cautious: "Khoảng thời gian chờ đợi đầy âu lo tiếp nối sau bài thuyết trình trên tàu con thoi, khi [Leader.GetName] công khai nghi ngờ liệu [Leader.GetHeShe] có tạo được màn giới thiệu thành công hay không."
 first_contact.5090.desc.aggressive: "Chỉ có mệnh lệnh trực tiếp của [Leader.GetName] mới ngăn không cho giao thức tiếp xúc đầu tiên leo thang thành bạo lực. Đối với phái đoàn, sự im lặng ngoan cố của người ngoài hành tinh chẳng khác nào một lời sỉ nhục."
 first_contact.5090.desc.end: "Sau vài giờ, nhóm §H[This.ContactCountry.GetName]§! đã phát đi một thông điệp ngắn bằng ngôn ngữ của chúng ta:\n\n\"Chúng tôi không mấy ấn tượng với văn hóa của các bạn. Chỉ có thế thôi sao? [Owner.GetEnvoy] có cơ hội cuối cùng để gây ấn tượng với chúng tôi trong một lĩnh vực do các bạn tự chọn.\""
 first_contact.5090.a: "Thử thách bằng đọ sức chiến đấu."
 first_contact.5090.a.tt: "Phái [Leader.GetName] đi phô diễn dũng khí chiến binh của chúng ta."
 first_contact.5090.b: "Thử thách bằng tài hùng biện."
 first_contact.5090.b.tt: "Phái [Leader.GetName] đi trình bày luận điểm về tính ưu việt văn hóa của chúng ta."
 first_contact.5090.c: "Thử thách bằng khúc ca."
 first_contact.5090.c.tt: "Phái [Leader.GetName] đi ngâm vịnh khúc tráng ca hào hùng của dân tộc chúng ta."

 first_contact.5095.name: "Phán Quyết"
 first_contact.5095.desc.combat_good: "[Leader.GetName] trở về từ tàu con thoi của §H[This.ContactCountry.GetName]§! tuy bị thương, nhưng đắc thắng.\n\nTừ một cánh cửa ẩn, một chiến binh ngoài hành tinh xuất hiện và lao vào đấm đá [Owner.GetEnvoy] của chúng ta đến mức kiệt sức. Tập hợp chút tàn lực cuối cùng, [Leader.GetName] đã khuất phục được đối thủ của [Leader.GetHisHer].\n\nTrong vòng một giờ, [This.ContactCountry.GetName] đã gửi một thông điệp:\n\n\"[Leader.GetName] sẽ được ghi vào biên niên sử của chúng tôi như một chiến binh vĩ đại.\""
 first_contact.5095.desc.combat_bad: "[Leader.GetName] trở về từ tàu con thoi của §H[This.ContactCountry.GetName]§! trong sự bối rối, vì không tìm thấy đối thủ nào. Trong vòng một giờ, §H[This.ContactCountry.GetName]§! đã gửi một thông điệp:\n\n\"Cách hành xử man rợ của các bạn khiến chúng tôi thất vọng. Một trận chiến thể xác là điều hết sức không phù hợp với một nền văn hóa văn minh.\""
 first_contact.5095.desc.speech_good: "[Leader.GetName] trở về từ tàu con thoi của §H[This.ContactCountry.GetName]§! tràn đầy niềm tin vững chắc. [Leader.GetHeSheCap] đã quên cả thời gian khi tranh biện bảo vệ lập trường của chúng ta trước bức tường cảm biến, giải thích các lý do đằng sau các quyết định lịch sử và cách chúng ta học hỏi và trưởng thành như một nền văn hóa.\n\nTrong vòng một giờ, §H[This.ContactCountry.GetName]§! đã gửi một thông điệp:\n\n\"Dù có quá khứ đầy biến động, các bạn đã trưởng thành một cách ngoạn mục. Văn hóa của các bạn là một nguồn cảm hứng.\""
 first_contact.5095.desc.speech_bad: "[Leader.GetName] trở về từ tàu con thoi của §H[This.ContactCountry.GetName]§! trong nỗi thất vọng. [Leader.GetHeSheCap] đã dành hơn một giờ trước bức tường cảm biến để trình bày chi tiết về văn hóa và tranh luận cho tính đúng đắn trong các quyết định lịch sử của chúng ta.\n\nNgay sau đó, §H[This.ContactCountry.GetName]§! đã gửi một thông điệp:\n\n\"Lịch sử mà các bạn mô tả vẽ nên một bức tranh nghèo nàn về văn hóa của các bạn.\""
 first_contact.5095.desc.song_good: "[Leader.GetName] trở về từ tàu con thoi của §H[This.ContactCountry.GetName]§! với tâm trạng tuyệt vời. Những ca từ ngẫu hứng mô tả quá khứ và tương lai đã tuôn trào tự do, khi nhà thơ-[Owner.GetEnvoy] của chúng ta tạo nên những liên tưởng vừa bất ngờ vừa soi sáng.\n\nTrong vòng một giờ, §H[This.ContactCountry.GetName]§! đã gửi một thông điệp:\n\n\"Văn hóa của các bạn vô cùng lộng lẫy và chúng tôi tán thưởng màn trình diễn này.\""
 first_contact.5095.desc.song_bad: "[Leader.GetName] trở về từ tàu con thoi của §H[This.ContactCountry.GetName]§! với sự không hài lòng về màn trình diễn âm nhạc của [Leader.GetHisHer]. Sự bất hòa giữa những hành động trong quá khứ và ý thức tự nhận thức hiện tại đã khiến những liên tưởng thi vị trở nên nhạt nhẽo.\n\nTrong vòng một giờ, §H[This.ContactCountry.GetName]§! đã gửi một thông điệp:\n\n\"Chúng tôi thất vọng vì một cuộc gặp gỡ tư tưởng trọng đại lại bị phá hỏng bởi những vần điệu tầm thường.\""
 first_contact.5095.a: "Thử thách đã kết thúc."

