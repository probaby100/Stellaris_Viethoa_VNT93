 #Misc
 first_contact.1060.name:0 "Giao Thức Tiếp Xúc Đầu Tiên"
 first_contact.1060.desc.base:0 "Cuộc chạm trán gần đây của chúng ta với các dạng sống ngoài hành tinh đã thổi bùng lại — và đột ngột khiến cho trở nên cấp bách hơn — cuộc tranh luận bấy lâu về việc chúng ta nên tiếp cận ra sao khi liên lạc với bất kỳ nền văn minh ngoài hành tinh thông minh nào có thể gặp."
 first_contact.1060.desc.payback.base:0 "Cuộc tiếp xúc đầu tiên của chúng ta với các dạng sống ngoài hành tinh đã khiến chúng ta cảnh giác với những kẻ khác. Ngoài kia có sự sống, và trong quá trình khám phá thiên hà, chúng ta chắc chắn sẽ lại gặp sự sống thông minh. Nhưng cách thức chào đón của chúng ta vẫn còn là chủ đề tranh luận."
 first_contact.1060.desc:0 "$first_contact.1060.desc.base$\n\nTrong khi một số người ủng hộ việc tập trung thiết lập quan hệ hữu nghị càng nhanh càng tốt bằng cách gửi thông điệp hòa bình, những người khác lại khuyên nên thận trọng, chỉ ra rằng chúng ta không thể biết liệu tâm trí của người ngoài hành tinh có ác ý với chúng ta hay không, và sẽ thật thiếu khôn ngoan nếu để họ biết quá nhiều về chúng ta trước khi thật sự cần thiết.\n\nMột nhóm thứ ba, cấp tiến hơn, thúc đẩy hành động phủ đầu: \"Với an ninh của toàn bộ người [This.GetSpeciesNamePlural] đang bị đe dọa,\" họ nói, \"chúng ta không dám do dự thực hiện mọi biện pháp cần thiết để giành thế thượng phong trước bất kỳ mối đe dọa dị chủng tiềm tàng nào.\""
 first_contact.1060.desc.payback:0 "$first_contact.1060.desc.payback.base$\n\nTrong khi một số người ủng hộ việc thiết lập quan hệ hữu nghị càng nhanh càng tốt, những người khác lại khuyên nên thận trọng, chỉ ra rằng bản tính thân thiện của chúng ta chính là thứ đã dẫn tới cảnh ngục tù và phản bội.\n\nMột nhóm thứ ba, cấp tiến hơn, thúc đẩy hành động phủ đầu: \"cách tốt nhất để tránh một cuộc xâm lược thứ hai là đánh phủ đầu bọn họ,\" họ nói. \"Chúng ta sẽ không bao giờ cúi đầu trước ý chí của dị chủng nữa!\""
 first_contact.1060.desc.xenophile:0 "$first_contact.1060.desc.base$\n\nTrong khi một số người ủng hộ việc tập trung thiết lập quan hệ hữu nghị càng nhanh càng tốt bằng cách liên lạc với thông điệp hòa bình, những người khác lại khuyên nên thận trọng, chỉ ra rằng chúng ta không thể biết liệu tâm trí của người ngoài hành tinh có ác ý với chúng ta hay không, và sẽ thật thiếu khôn ngoan nếu để họ biết quá nhiều về chúng ta trước khi cần thiết."
 first_contact.1060.desc.payback.xenophile:0 "$first_contact.1060.desc.base.payback$\n\nDù phần lớn chúng ta muốn tin rằng có những nền văn minh tử tế ngoài kia, những người khác lại khuyên nên thận trọng, chỉ ra rằng bản tính thân thiện của chúng ta chính là thứ đã dẫn tới cảnh ngục tù và phản bội."
 first_contact.1060.desc.xenophobe:0 "$first_contact.1060.desc.base$\n\nTrong khi một số người ủng hộ việc thực hiện các hành động thù địch phủ đầu nhằm vào họ, những người khác lại khuyên nên thận trọng, chỉ ra rằng sẽ là khôn ngoan hơn nếu tìm hiểu thêm về năng lực của người ngoài hành tinh trước khi liều lĩnh đối đầu với họ."
 first_contact.1060.desc.payback.xenophobe:0 "$first_contact.1060.desc.payback.base$\n\nPhản ứng hoàn toàn nhất trí: cách tốt nhất để tránh một cuộc xâm lược thứ hai là khẳng định sự áp đảo đối với kẻ khác trước khi họ có thể làm hại chúng ta. Chúng ta sẽ không bao giờ cúi đầu trước ý chí của dị chủng nữa!"
 first_contact.1060.desc.gestalt:0 "Cuộc chạm trán gần đây của chúng ta với các dạng sống ngoài hành tinh đã đặt ra nhu cầu phải quyết định cách hành xử đối với bất kỳ nền văn minh ngoài hành tinh thông minh nào có thể gặp.\n\nMột khả năng là tìm cách thiết lập liên lạc hòa bình với họ càng sớm càng tốt bằng cách gửi cho họ thông tin cần thiết để phiên dịch thông tin liên lạc của chúng ta. Tuy nhiên, điều này có thể trở nên thiếu thận trọng nếu họ mang ý đồ thù địch đối với chúng ta.\n\nLựa chọn an toàn nhất là thận trọng tiến hành và cố gắng giao tiếp với họ mà không để lộ quá nhiều thông tin về chính mình. Mặt khác, chúng ta có thể thực hiện các động thái hung hăng hơn nhằm vừa tìm hiểu thêm về họ, vừa xua đuổi họ khỏi lãnh thổ của chúng ta; tuy nhiên, điều này chắc chắn sẽ gây ra sự thù địch từ họ."
 first_contact.1060.A:0 "Chúng ta sẽ dang rộng vòng tay chào đón dị chủng."
 first_contact.1060.A.machine:0 "Chúng ta sẽ dang rộng vòng tay chào đón dị chủng."
 first_contact.1060.A.tooltip:1 "Chính sách này có các tác động sau:\n$first_contact_proactive_effects$$MOD_FIRST_CONTACT_SPEED_MULT$: §G+10%§!"
 first_contact.1060.B:0 "Thận trọng là điều khôn ngoan."
 first_contact.1060.B.tooltip:1 "Chính sách này có các tác động sau:\n$first_contact_cautious_effects$$MOD_FIRST_CONTACT_DEFENSE_ADD$: §G+2§!"
 first_contact.1060.C:0 "Chúng ta phải xua đuổi những kẻ có thể đe dọa chúng ta."
 first_contact.1060.C.tooltip:0 "Chính sách này có các tác động sau:\n$first_contact_attack_allowed_effects$"

