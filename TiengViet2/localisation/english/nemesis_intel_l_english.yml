 fcsum_monstrous_noises_silent_end_bad:0 "Liên lạc đã được thiết lập. §H[This.ContactCountry.GetSpeciesNamePlural]§! cho rằng chúng ta §Rhèn nhát§! vì không đưa ra phản hồi nào."
