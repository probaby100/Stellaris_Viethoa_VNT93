#####################
# Abandoned Complex #
#####################
 astral_rift_research_lab: "Khu Phức Hợp Bị Bỏ Hoang"

 astral_rift.2000.name: "Cơ Sở Bị Bỏ Hoang"
 astral_rift.2000.desc: "Chúng ta đang ở bên trong một cơ sở nghiên cứu bị bỏ hoang.\n\nCác bề mặt trong căn phòng này phủ một lớp bụi dày, cho thấy nó đã không được sử dụng trong một thời gian dài.\n\nChúng ta không thể tìm thấy bất kỳ nhà nghiên cứu nào, dù còn sống hay đã chết. Dù nơi này đã được dùng để làm gì, nó đã bị bỏ lại một cách vội vã.\n\nHàng tá cấu trúc giống như những quả trứng lớn nằm rải rác xung quanh phòng thí nghiệm. Chúng dường như được nối với một hệ thống hỗ trợ sự sống trung tâm. Một số ít vẫn còn phát ra ánh sáng huỳnh quang mờ nhạt."
 astral_rift.2000.a: "Tìm kiếm những người chăm sóc."
 astral_rift.2000.b: "Mở một quả trứng."

 astral_rift.2010.name: "Ký Sinh Trùng Lượng Tử"
 astral_rift.2010.desc: "Chúng ta đã mở mẫu vật trông khỏe mạnh nhất trong số các quả trứng.\n\nPhôi thai bên trong có vẻ bị suy dinh dưỡng và bị bao phủ bởi những ký sinh trùng ngoại lai.\n\nĐáng chú ý, những ký sinh trùng này sở hữu các đặc tính lượng tử độc nhất vô nhị không giống bất kỳ sinh vật sống nào từng được biết đến. Chúng ngắt kết nối và tái kết nối một cách ngẫu nhiên với cấu trúc giải phẫu của phôi thai, như thể chúng đang tồn tại ở nhiều nơi cùng một lúc.\n\nChúng ta có thể tiêm cho phôi thai một lượng chất lỏng màu nhạt được tìm thấy trong kho dự trữ của phòng thí nghiệm, hoặc giải thoát cho nó khỏi nỗi đau đớn."
 astral_rift.2010.a: "Tiêm chất lỏng vào quả trứng."
 astral_rift.2010.b: "Cái chết nhân đạo cho các sinh vật còn lại."

 astral_rift.2015.name: "Những Người Chăm Sóc"
 astral_rift.2015.desc: "Chúng ta đã tìm thấy những người chăm sóc nơi này. Chính xác hơn, chúng ta đã tìm thấy những gì còn sót lại của họ.\n\nMột căn phòng gần đó chứa đầy những thi thể. Các chi và cơ quan của họ đã bị tách rời ở cấp độ nguyên tử bởi một thế lực chưa xác định.\n\nNhìn kỹ hơn, những ký sinh trùng lượng tử tương tự đang bò lúc nhúc trên hài cốt của họ. Một phát hiện đáng lo ngại, nhưng chúng ta vẫn có thể tiếp tục khám phá các quả trứng trong phòng thí nghiệm."
 astral_rift.2015.a: "Mở một quả trứng."
 astral_rift.2015.b: "Trở về cùng hài cốt."

 astral_rift.2020.name: "Chuyển Hóa Trao Đổi Chất"
 astral_rift.2020.desc: "Việc tiêm chất lỏng màu nhạt vào phôi thai lộ ra đã tạo ra một số kết quả thú vị.\n\nBất chấp lũ ký sinh trùng lượng tử, mẫu vật từng lờ đờ trước đây đã hồi sinh tràn đầy sức sống. Thực tế, chúng ta có thể đã tính toán sai liều lượng. Trong một khoảng thời gian ngắn, các chi của nó bắt đầu phát triển nhanh chóng và đập mạnh vào vỏ trứng, đòi được thoát ra.\n\nNhận thấy tốc độ phân chia tế bào gia tăng của nó, lũ ký sinh trùng dường như cũng đang thích nghi và sinh sôi với tốc độ đáng báo động. Nếu không can thiệp, sinh vật có thể bị xé toạc bởi sự bất ổn lượng tử."
 astral_rift.2020.a: "Không can thiệp."
 astral_rift.2020.b: "Tiêm sợi tinh giới."

 astral_rift.2025.name: "Cái Chết Nhân Đạo"
 astral_rift.2025.desc: "Sinh vật này không còn hy vọng hồi phục. Lũ ký sinh trùng xâm chiếm quả trứng của nó quá nguy hiểm để lây lan ra ngoài khe nứt này.\n\nTheo quy trình khử nhiễm nghiêm ngặt, chúng ta đã dùng axit hydrochloric để tiêu hủy nhân đạo tất cả các mẫu vật gần đó. Chúng ta sẽ mang các mẫu ký sinh trùng trở về để nghiên cứu thêm."
 astral_rift.2025.a: "Một lựa chọn khôn ngoan."
 astral_rift.2025.b.evopred: "Độ axit cao có thể tăng thêm hương vị cho món ăn."

 astral_rift.2030.name: "Bất Ổn Sinh Học"
 astral_rift.2030.desc.end: "Sự lây nhiễm lượng tử bất ổn định này hẳn đã phá hỏng bất kỳ thí nghiệm nào dự định tiến hành ở đây.\n\nDù vậy, những quan sát của chúng ta tại nơi này đã nâng cao hiểu biết về sinh học trong các điều kiện vô cùng bất ổn định."
 astral_rift.2030.desc.default: "Phôi thai đã tan rã.\n\nĐúng như dự đoán, lũ ký sinh trùng trong cơ thể nó nhanh chóng xé toạc nó theo những hướng ngẫu nhiên.\n\n$astral_rift.2030.desc.end$"
 astral_rift.2030.desc.injected: "Phôi thai đã tan rã.\n\nBất chấp những nỗ lực ổn định mẫu vật của chúng ta, lũ ký sinh trùng trong cơ thể nó nhanh chóng xé toạc nó theo những hướng ngẫu nhiên.\n\n$astral_rift.2030.desc.end$"
 astral_rift.2030.a: "Thú vị."
 astral_rift.2030.b.evopred: "Một bữa ăn xay nhuyễn."

 astral_rift.2035.name: "Vũ Khí Sinh Học"
 astral_rift.2035.desc: "Thí nghiệm đã thành công tốt đẹp.\n\nSợi tinh giới chúng ta tiêm vào phôi thai đã ổn định được lũ ký sinh trùng lượng tử.\n\nCon non phát triển đầy đủ đã đục vỡ vỏ chui ra nguyên vẹn. Nó ngoan ngoãn một cách đáng ngạc nhiên và nhanh chóng học được các mệnh lệnh cơ bản. Dựa trên bản tính săn mồi hung dữ của nó, chúng ta có thể lai tạo những sinh vật này làm vũ khí hủy diệt hỗ trợ cho quân đội của mình."
 astral_rift.2035.desc.exterminator: "$astral_rift.2035.desc$\n\nThiên hà thảm hại của chúng ta chưa sẵn sàng cho những gì chúng ta sắp sửa giải phóng."
 astral_rift.2035.desc.non_pacifist: "$astral_rift.2035.desc$\n\nChúng ta sẽ mang về thêm nhiều con nữa."
 astral_rift.2035.a: "Rất ấn tượng."
 astral_rift.2035.a.tooltip: "Giờ đây có thể xây dựng đạo quân Đột kích mới: §H$warpling_army$§!"

 astral_rift.2040.name: "Ký Sinh Trùng Lượng Tử"
 astral_rift.2040.desc: "Chúng ta đã hoàn thành việc thu thập hài cốt của các nhà nghiên cứu và đang vận chuyển chúng về để nghiên cứu sâu hơn.\n\nHài cốt của họ chứa đầy ký sinh trùng lượng tử mang những đặc tính không giống bất kỳ sinh vật sống nào từng biết. Chúng dịch chuyển tức thời một cách khó lường và phản ứng mạnh với các trường điện từ.\n\nChúng ta hy vọng các nhà khoa học của chúng ta có thể khai thác các đặc tính lượng tử này để phục vụ nghiên cứu vật lý."
 astral_rift.2040.a: "Thật cuốn hút."

 astral_rift.2045.name: "Phơi Nhiễm Gây Tử Vong"
 astral_rift.2045.desc: "[From.GetName] được phát hiện đã tử vong. Nguyên nhân là do phơi nhiễm với loài ký sinh trùng chết người bên kia khe nứt thuộc hệ sao [FromFrom.solar_system.GetName]. Khu vực nghiên cứu của [From.GetHisHer] cũng đã bị phong tỏa cách ly để ngăn ngừa thêm thương vong."
 astral_rift.2045.a.tooltip: "§Y[From.GetName]§! §Rđã tự phát nổ§!"

#################
# The Mechanism #
#################
 astral_rift_clock: "Cơ Cấu Máy Móc"

 astral_rift.2100.name: "Bánh Răng và Bánh Khía"
 astral_rift.2100.desc: "Chúng ta bị bao quanh bởi các cỗ máy khổng lồ.\n\nBánh răng và bánh khía xoắn vặn theo mọi hướng. Cứ mỗi một phần mười giây, bộ máy lại nhích về phía trước một nấc. Mỗi chiếc răng trên các bánh răng gần như to bằng chiếc §Y$tech_rift_sphere$§! của chúng ta.\n\nMột làn sương mù dày đặc che khuất tầm nhìn, nhưng những tiếng tích tắc đều đặn và tiếng nghiến kim loại vang vọng khắp không gian bao la này."
 astral_rift.2100.a: "Khám phá làn sương mù."

 astral_rift.2105.name: "Cỗ Máy Chiều Không Gian"
 astral_rift.2105.desc: "Chuyển động của cỗ máy chiều không gian này chuẩn xác như chiếc đồng hồ chính xác nhất của chúng ta.\n\nDù chúng ta vẫn chưa hiểu được nguồn năng lượng của nó, một cuộc khảo sát ngắn đã phát hiện ra các giếng thông gió dẫn tới một loạt các Khe Nứt Tinh Giới.\n\nDù nơi này thực sự là gì, nó dường như đóng vai trò điều chỉnh một mạng lưới rộng lớn các khe nứt xuyên suốt thực tại. Cấu trúc này dường như chịu một lực căng cơ học cực lớn."
 astral_rift.2105.a: "Can thiệp vào lúc này sẽ là thiếu trách nhiệm."
 astral_rift.2105.b: "Làm kẹt các bánh răng."

 astral_rift.2110.name: "Nếu Chưa Hỏng..."
 astral_rift.2110.desc: "Những kiến trúc sư của không gian này sở hữu tri thức vượt xa chúng ta. Can thiệp vào những cơ chế này có thể gây ra những hậu quả khó lường.\n\nDù bị làn sương mù cản trở, chúng ta vẫn nán lại đủ lâu để thu thập dữ liệu quý giá về hoạt động của cỗ máy khổng lồ này trước khi rút lui an toàn."

 astral_rift.2115.name: "Bị Kẹt"
 astral_rift.2115.desc: "Các bánh răng đã bị kẹt cứng.\n\nVới một tiếng rung chuyển dữ dội, toàn bộ cơ cấu đã dừng bặt. Nỗ lực phá hoại của chúng ta đã thành công.\n\nKhi lực căng gia tăng, một lõi vàng lộ ra từ bên dưới một tấm lưới kim loại. Nó sáng loáng không tì vết, nhưng năng lượng bên trong nó dường như đang dao động mất kiểm soát. Chúng ta có thể cố gắng thu hồi nó, nhưng nguy cơ nổ là rất cao."
 astral_rift.2115.a: "Hãy thận trọng."

 astral_rift.2120.name: "Vỡ Vụn"
 astral_rift.2120.desc: "Khi chúng ta cố gắng thu hồi lõi vàng, một vết nứt nhỏ nhanh chóng lan rộng khắp bề mặt của nó. Trước khi chúng ta kịp kéo nó ra, nó đã phát nổ dữ dội theo mọi hướng.\n\nSự tan vỡ của lõi giải phóng một lượng năng lượng khổng lồ. Sóng xung kích làm vỡ tung các bánh răng xung quanh và thổi bay lớp sương mù, làm lộ ra một không gian trống rỗng vô tận. Rất may, chiếc Khối Cầu của chúng ta không bị hư hại nghiêm trọng."

 astral_rift.2125.name: "Thành Công"
 astral_rift.2125.desc: "Chúng ta đã thu hồi thành công lõi vàng của một trong các cơ cấu máy móc.\n\nCác bánh răng xung quanh chìm vào một sự im lặng kỳ lạ, và lực căng ban đầu trong không gian đã biến mất hoàn toàn.\n\nMạng lưới Khe Nứt Tinh Giới kết nối với cỗ máy này dường như đã ngừng rung động. Nghiên cứu lõi vàng này sẽ mang lại cái nhìn sâu sắc vô song về cơ học không gian-thời gian."

