 resolution_defenseprivatization_repeal_1:0 "§RBãi bỏ $resolution_defenseprivatization_defense_contracts$§!"
 resolution_defenseprivatization_repeal_1_desc:0 "Mặc dù tính chuyên nghiệp của các nhà thầu quốc phòng là không thể phủ nhận, nhưng các quốc gia thuộc [global_event_country.GetGalCommunityOrGalImperium] không nên quá phụ thuộc vào các dịch vụ an ninh tư nhân."
