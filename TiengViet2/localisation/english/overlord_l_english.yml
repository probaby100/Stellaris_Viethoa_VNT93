 resolution_defenseprivatization_defense_contracts:0 "Nhà thầu an ninh"
 resolution_defenseprivatization_defense_contracts_desc:0 "Vì các vấn đề an ninh của thiên hà, chúng ta nên đầu tư nguồn lực vào các cơ quan an ninh độc lập. Những chuyên gia được huấn luyện bài bản và phi chính trị hóa này có thể giúp các quốc gia thành viên của [global_event_country.GetGalCommunityOrGalImperium] tổ chức phòng thủ."
 resolution_defenseprivatization_private_support_troops:0 "Sự bảo vệ đầy hứa hẹn"
 resolution_defenseprivatization_private_support_troops_desc:0 "Do quy mô xung đột leo thang, các đội an ninh tư nhân cần nâng cấp vũ lực để tiếp tục hoàn thành xuất sắc công việc mà họ vẫn luôn làm giỏi nhất: bảo vệ sự an toàn cho [global_event_country.GetGalCommunityOrGalImperium]."
 resolution_defenseprivatization_condottieri:0 "Người phòng thủ trung lập"
 resolution_defenseprivatization_condottieri_desc:0 "Chiến tranh có lẽ là điều không thể tránh khỏi, nhưng thiệt hại liên đới thì không nhất thiết phải như vậy. Bằng cách giao phó niềm tin trong lĩnh vực này cho các chuyên gia giỏi phòng thủ, [global_event_country.GetGalCommunityOrGalImperium] chắc chắn có thể giảm thiểu đáng kể những hành vi tàn bạo của chiến tranh bị đưa tin."
 resolution_defenseprivatization_security_business:0 "Kiểm soát rủi ro Thiên hà"
 resolution_defenseprivatization_security_business_desc:0 "Bất chấp những nỗ lực hết mình của chúng ta, các cuộc xung đột ý thức hệ bạo lực vẫn đang làm gia tăng căng thẳng ở quy mô thiên hà. Các đế quốc này liên tục chứng tỏ bản thân rất thích gây sự chỉ vì một vài cãi vã nhỏ. Việc quản lý lực lượng vũ trang tư nhân của chúng sẽ cho phép các nhà thầu phòng thủ trung lập thực hiện các hoạt động gìn giữ hòa bình một cách hiệu quả hơn."
 resolution_defenseprivatization_corporate_warlords:0 "Gìn giữ hòa bình Doanh nghiệp"
 resolution_defenseprivatization_corporate_warlords_desc:0 "\"$enclave.235.4.desc$\""

