 # Events
 origin.5703.desc:0 "Chào mừng các bạn, những người bạn ngoài hành tinh mới!\n\nVì các bạn đã chọn trở thành... đồng minh của chúng tôi, chúng tôi cho rằng bây giờ là lúc để liên lạc với các bạn. Các bạn đã chọn sự lý trí thay vì ép buộc chúng tôi sử dụng bạo lực, điều này khiến chúng tôi vô cùng hài lòng."
 origin.5703.a:0 "Chẳng phải chính các người đã khiến chúng tôi không còn lựa chọn nào khác sao?"
 dialog_hostile_overlord:0 "Chúng ta sẽ thực hiện thái độ §Rthù địch§! đối với Bá Chủ."
 origin.5703.b:0 "Các người còn muốn nói với chúng tôi điều gì khác không?"
 dialog_wary_overlord:0 "Chúng ta sẽ thực hiện thái độ §Ytrung lập§! đối với Bá Chủ."
 origin.5703.c:0 "Chúng tôi rất tự hào khi được trở thành một phần của các bạn!"
 dialog_friendly_overlord:0 "Chúng ta sẽ thực hiện thái độ §Gthân thiện§! đối với Bá Chủ."

 origin.5705.desc.harsh:0 "Hừm... Dù sao thì!\n\n$origin.5705.desc$"
 origin.5705.desc.grateful:0 "Chúng tôi cũng tự hào về sự gia nhập của các bạn!\n\n$origin.5705.desc$"
 origin.5705.desc:0 "Sau khi suy nghĩ kỹ lưỡng, chúng tôi đã quyết định đầu tư một lượng tài nguyên khổng lồ để viện trợ cho đất nước của các bạn xây dựng chuyên môn. Trong tương lai, điều này sẽ cho phép đế quốc của các bạn đóng một vai trò quan trọng hơn trong số tất cả các đối tác và đồng minh của chúng tôi.\n\nChúng tôi vẫn chưa chắc chắn lắm người dân của các bạn thích một vai trò như thế nào, quân sự hóa? Chuyên ngành học thuật? Hay các bạn hứng thú hơn với khoáng sản và của cải vật chất?"
 origin.5705.desc.reconsider:0 "Vậy... bạn đã suy nghĩ lại chưa?"
 origin.5705.a:0 "Chuyên môn quân sự nghe có vẻ tuyệt vời đấy."
 origin.5705.a.tt_intro: "§Y[ROOT.GetName]§! sẽ chuyển sang chuyên môn §Y$specialist_bulwark$§!, tập trung vào quân sự và phòng thủ.\n§Y[Root.GetName]§! sẽ trả $r_influence$ như một khoản thuế mở rộng."
 origin.5705.a.tt:2 "$origin.5705.a.tt_intro$\nNhận từ §Y[overlord_empire.GetName]§! một hạm đội §YTàu khu trục§! cùng với các công nghệ quân sự cần thiết để mở rộng."
 origin.5705.a.bioships.tt: "$origin.5705.a.tt_intro$\nNhận từ §Y[overlord_empire.GetName]§! một hạm đội §Y$mauler_stage_2_plural$§! cùng với các công nghệ quân sự cần thiết để mở rộng."
 origin.5705.b:0 "Bạn có thể cho chúng tôi biết thêm về Thành Lũy không?"
 origin.5705.c:0 "Người dân của chúng tôi đam mê học thức hơn."
 origin.5705.c.tt:1 "§Y[ROOT.GetName]§! sẽ chuyển sang chuyên môn §Y$specialist_scholarium$§!, tập trung vào nghiên cứu công nghệ.\n§Y[ROOT.GetName]§! sẽ trả $r_influence$ như một khoản thuế mở rộng.\nNhận từ §Y[overlord_empire.GetName]§! một §YTàu nghiên cứu§! và một vị §YSĩ quan Khoa học§!."
 origin.5705.d:0 "Bạn có thể cho chúng tôi biết thêm về Học Viện không?"
 origin.5705.e:0 "Chúng tôi chuộng chuyên môn về của cải vật chất và khoáng sản hơn."
 origin.5705.e.tt:1 "§Y[ROOT.GetName]§! sẽ chuyển đổi thành một chư hầu chuyên môn §Y$specialist_prospectorium$§! —— tập trung vào khai thác khoáng sản và tài nguyên chiến lược.\n§Y[ROOT.GetName]§! khi mở rộng sẽ phải nộp một khoản cống nạp $r_influence$.\nSẽ nhận được 2 §YTàu công trình§! từ §Y[overlord_empire.GetName]§!."
 origin.5705.f:0 "Bạn có thể cho chúng tôi biết thêm về Khai Khoáng Viện không?"

 origin.5706.desc:0 "Một xu hướng thiên về quân sự, có phải vậy không?\n\nThành Lũy, như cách chúng tôi thường gọi, là những đế chế chuyên về các vấn đề quân sự. Điều này có nghĩa là chúng tôi sẽ hỗ trợ hàng tháng cho các bạn một lượng khoáng sản và lương thực cơ bản, để các bạn có thể dành phần lớn nguồn lực của đế chế tập trung vào chiến tranh.\n\nĐổi lại, chúng tôi kỳ vọng các bạn sẽ giúp chúng tôi phòng thủ trước các mối đe dọa từ bên ngoài, và đóng vai trò then chốt tại các vùng biên giới trong không gian đồng minh của chúng ta. Điều đó nghe có vẻ hợp lý với các bạn chứ?"
 origin.5706.a:0 "Nghe có vẻ chúng tôi có thể chấp nhận được."
 origin.5706.b:0 "Chúng tôi cần suy nghĩ thêm."

 origin.5707.desc:0 "Vậy ra điều này đã thu hút sự chú ý của các bạn phải không?\n\nThứ mà chúng tôi thường gọi là Học viện là một quốc gia chuyên về nghiên cứu công nghệ. Chúng tôi cam kết bảo vệ đất nước của các bạn, và các bạn có thể tập trung tài nguyên để làm cho quốc gia cũng như các đồng minh của chúng ta tiên tiến hơn.\n\nĐổi lại, chúng tôi hy vọng các bạn có thể chia sẻ với các quốc gia khác của chúng tôi mọi khám phá khoa học đáng kinh ngạc. Bản hợp đồng như vậy có làm các bạn hài lòng không?"
 origin.5707.a:0 "Người dân của chúng tôi sẵn lòng chấp nhận thỏa thuận này."
 origin.5707.b:0 "Chúng tôi cần suy nghĩ thêm."

 origin.5708.desc:1 "Các bạn có hứng thú với thỏa thuận này đúng không?\n\nKhai Khoáng Viện, như nhiều người thường gọi, là một đế chế chuyên tìm kiếm khoáng sản và sản xuất các tài nguyên chiến lược — nhưng điều này thường phải trả giá bằng tiến độ phát triển khoa học. Với các công cụ phù hợp, một số Khai Khoáng Viện có thể định vị các khoáng sản quý hiếm mà người khác bỏ qua, dù đây mới chỉ là những lời đồn đại mà chúng tôi nghe được.\n\nĐiều đó nghe có vẻ là nhiệm vụ mà người dân của các bạn có thể đảm đương được chứ?"
 origin.5708.a:0 "Tôi nghĩ điều này rất phù hợp với chúng tôi."
 origin.5708.b:0 "Chúng tôi cần suy nghĩ thêm."

 origin.5710.title:0 "Định hình tương lai của chúng ta"
 origin.5710.desc:0 "Chúng ta đã tiếp đón một phái đoàn ngoại giao nhỏ do Bá Chủ cử đến, mang theo những tin tức và chỉ thị mới nhất. Vì chúng ta đã làm hài lòng các yêu cầu của họ dạo gần đây, họ muốn ký kết một thỏa thuận chi tiết hơn để thúc đẩy mối quan hệ giữa đôi bên."

 # Dissolution of the Empire events
 origin.5725.title:0 "Sự kế vị bị nghi ngờ"
 origin.5725.desc:0 "Ngay sau khi [overlord_ruler.GetName] băng hà đột ngột, chúng ta đã hay tin về tình trạng hỗn loạn đang diễn ra trên [Root.Overlord.Capital.GetName]. [overlord_heir.GetName] với rất ít sự ủng hộ đã giành lấy ngai vàng vào tay [overlord_heir.GetHimselfHerself] thông qua các biện pháp quân sự, khiến hoàng tộc của [overlord_heir.GetHisHer] và nhân dân trên [Root.Overlord.Capital.GetName] vô cùng bất mãn.\n\nSau sự trỗi dậy đầy náo động của [overlord_heir.GetFirstName], nhiều người bắt đầu đặt câu hỏi về tính hợp pháp trong việc cai trị chúng ta của [Root.Overlord.GetName]. Nếu họ thậm chí không thể đảm bảo an ninh cho thủ đô của chính mình, họ lấy đâu ra khả năng để bảo vệ an toàn cho chúng ta?"
 origin.5725.a:0 "Dù là con đê dài trên trời, cũng có thể sụp đổ chỉ vì một tổ kiến."

 origin.5735.title:0 "Đế quốc Vỡ vụn"
 origin.5735.desc:1 "Đánh mất vị lãnh đạo vĩ đại có khả năng duy trì sự đoàn kết và thống nhất, [previous_overlord.GetName] hiện đã tan đàn xẻ nghé, và mỗi phe phái đều tuyên bố mình mới là chính thống của đế quốc trước đây. Tuy nhiên, do thiếu đi thực lực và tính hợp pháp, quyền kiểm soát của họ đối với tất cả các chư hầu cũng theo đó mà sụp đổ.\n\nTrong khi mỗi phe phái chia rẽ đang chinh phạt lẫn nhau, tranh giành ngai vàng của [previous_overlord.GetName], thì các quốc gia từng là chư hầu của họ cũng có thể hành động theo ý muốn của mình."
 origin.5735.a:0 "Lại giành được tự do rồi."
 origin.5735.b:0 "Đã đến lúc có những nhà lãnh đạo mới bước lên vũ đài lịch sử."
 origin.5735.b.tt:0 "Có được lý do chiến tranh §YChinh phục§! trong §Y30 năm§! đối với §Y[previous_overlord.GetName]§! và tất cả các nước chư hầu trước đây của nó."
 origin.5735.c:0 "Chúng tôi trung thành với ngai vàng, dù có chuyện gì xảy ra đi chăng nữa."
 origin.5735.c.tt:0 "Chúng ta sẽ tiếp tục là chư hầu trung thành của §Y[previous_overlord.GetName]§!."

 # AI Vassals looking for new overlord events
 origin.5745.title:0 "Sự bảo vệ của giới kỹ trị"
 origin.5745.desc:0 "Người dân của [new_subject_target.GetName] thờ ơ với những chuyện bên ngoài đất nước của họ, nhưng họ biết rõ rằng, dù chuyện gì xảy ra bên ngoài cũng có thể phá hoại sự tập trung cao độ vào nội bộ của họ. Vì vậy, họ tìm kiếm sự bảo vệ từ chúng ta, giống như sự bảo vệ mà [previous_overlord.GetName] đã từng cung cấp trước đây."
 origin.5745.a:0 "Điều này rất có lợi cho đế quốc của chúng ta."
 origin.5745.b:0 "Chúng ta không hứng thú với những nhà khoa học này."

 origin.5750.title:0 "Các hoàng tử đoàn kết"
 origin.5750.desc:0 "[new_subject_target.GetName] khét tiếng với vô số hoàng tử luôn tranh cãi không ngớt, họ luôn tính toán mọi cách để giành lấy từng chút sức ảnh hưởng và quyền lực có thể giành được. Chỉ riêng lần này có vẻ như cuối cùng họ đã đạt được tiếng nói chung, cử đặc phái viên đến gặp chúng ta với hy vọng ký kết một hiệp ước ngoại giao mới. Có vẻ như họ bắt đầu nhớ nhung sự chăm sóc ân cần mà [previous_overlord.GetName] từng dành cho họ."
 origin.5750.a:0 "Thôi được, ít ra họ cũng có được chút đồng thuận."
 origin.5750.b:0 "Chúng ta không có một chút hứng thú nào với cái đám ồn ào này."

 origin.5755.title:0 "Sự tiếp xúc của Bá tước"
 origin.5755.desc:0 "Trước khi [previous_overlord.GetName] sụp đổ, [new_subject_target.GetName] có mối quan hệ khá gần gũi với họ, có vẻ như họ có hứng thú thiết lập mối quan hệ phát triển tương tự với chúng ta. Các nhà ngoại giao của họ đang thức trắng đêm để soạn thảo một hiệp định ngoại giao mà cả hai bên đều hài lòng để ký kết, đây là bước đầu tiên để thiết lập sự thấu hiểu đầy đủ hơn giữa hai đế quốc chúng ta."
 origin.5755.a:0 "Sẽ có chỗ cho họ ở đây."
 origin.5755.b:0 "Mời đặc phái viên quay về."

 origin.5760.title:0 "Liên minh hạm đội của tôi"
 origin.5760.desc:0 "Có vẻ như thị trường của [new_subject_target.GetName] có phần bất ổn sau khi [previous_overlord.GetName] tan rã. Giờ đây họ không còn ai để nương tựa nữa. Một vài ông trùm thương mại đã tiếp xúc với chúng ta, bày tỏ sự sẵn lòng cung cấp lao động [new_subject_target.GetAdj], và thậm chí rất sẵn lòng dâng lên một phần lợi nhuận, một khi đế quốc của họ ổn định trở lại."
 origin.5760.a:0 "Miễn là chúng chịu ngoan ngoãn nộp tài nguyên năng lượng."
 origin.5760.b:0 "Chúng ta không cần tài sản tư bản của chúng."

