l_english:

 OVERLORD_TITLE: "Overlord" # Do not translate
 DLC_OVERLORD_RECOMMENDATION_DESC:0 "§SOverlord§! là một bản mở rộng tập trung vào ngoại giao, với cốt lõi là các tương tác giữa nước chư hầu và Bá Chủ."
 DLC_OVERLORD_RECOMMENDATION_REC_MILITARIST:0 "Chúng tôi khuyên bạn nên mua $OVERLORD_TITLE$, vì nó mở ra những khả năng hoàn toàn mới cho các đế chế chuyên về chiến tranh bằng cách thêm vào các thành bang lính đánh thuê và tăng cường tương tác với chư hầu."
 DLC_OVERLORD_RECOMMENDATION_REC_SPIRITUALIST:0 "Chúng tôi khuyên bạn nên mua $OVERLORD_TITLE$, vì nó mở ra một nguồn gốc hoàn toàn mới cho các đế chế duy tâm, đồng thời có thể liên lạc với một thành bang liên quan đến Hư Cảnh."
 DLC_OVERLORD_RECOMMENDATION_REC_DIPLOMACY:0 "Chúng tôi khuyên bạn nên mua $OVERLORD_TITLE$, vì nó mở ra cơ chế tương tác hoàn toàn mới cho Bá Chủ và chư hầu, mang lại nhiều niềm vui hơn cho lối chơi tập trung vào ngoại giao."
 DLC_OVERLORD_RECOMMENDATION_REC_HIVE:0 "Chúng tôi khuyên bạn nên mua $OVERLORD_TITLE$, vì nó mở ra một nguồn gốc đặc trưng hoàn toàn mới cho tổ hợp ý thức, với các lãnh đạo thế hệ sau đặc biệt có thể dùng để củng cố đế chế của bạn."

 #########################
 # Progenitor Hive Origin
 #########################

 origin_progenitor_hive:0 "Tổ Hợp Khởi Thủy"
 origin_progenitor_hive_desc:1 "Tổ hợp này đạt được lợi thế tiến hóa thông qua các lãnh đạo bán độc lập chuyên biệt. Mặc dù những \"thế hệ sau\" này cần được giám sát liên tục, chúng vẫn nâng cao đáng kể hiệu quả tổng thể."
 START_SCREEN_PROGENITOR_HIVE:1 "Vào thuở sơ khai xa xôi, thủy tổ đã tồn tại.\n\nCuộc sống trên [Root.GetHomeWorldName] đầy gian khổ và cạnh tranh, nhưng thủy tổ hùng mạnh vẫn có thể mở rộng lãnh thổ. Việc cai trị một vùng lãnh thổ rộng lớn như vậy nhanh chóng trở nên khó duy trì, vì vậy thủy tổ đã tạo ra thế hệ sau đầu tiên. Họ sớm nhận ra rằng, thế hệ sau rõ ràng không thể tự mình quản lý mọi thứ, thay vào đó chúng tạo ra các drone thợ cấp thấp để giúp quản lý quê hương của chúng ta.\n\nKhi chúng ta có những bước tiến thăm dò đầu tiên ra khỏi [capital_scope.System.GetName], thủy tổ của chúng ta đã tự nhốt mình trong một tổ kén đặc biệt. Nhờ vào những hệ thống kiểm soát tốt hơn và mượt mà hơn này, chúng ta đã luôn sẵn sàng để phóng chiếu tầm ảnh hưởng của thủy tổ ra toàn bộ thiên hà, giống như những gì ngài đã và đang làm, cho đến tận tương lai. Và [Root.GetName] sẽ chứng kiến tất cả."
 START_SCREEN_PROGENITOR_HIVE_NOMADS: "Vào thuở sơ khai xa xăm, Thủy Tổ đã hiện diện.\n\nCuộc sống giữa cõi hư không đầy gian khổ và cạnh tranh khốc liệt, thế nhưng Thủy Tổ hùng mạnh vẫn không ngừng lớn mạnh, bầy đàn không ngừng sinh sôi, lấp đầy từng tầng boong, từng khoang phòng của con tàu khổng lồ này. Khi số lượng tâm trí cần thống lĩnh ngày một nhiều, cục diện nhanh chóng trở nên quá tải, và thế là Thủy Tổ đã tạo ra hậu duệ đầu tiên. Theo thời gian, các hậu duệ cũng dần khó lòng một mình gánh vác trọng trách quản lý. Vì thế, chúng lại tạo ra những drone cấp thấp để dẫn dắt cuộc đại di cư này.\n\nKhi hạm đội của chúng ta ngày càng lớn mạnh, Thủy Tổ đã lui về bên trong một con tàu chỉ huy chuyên biệt. Giờ đây, khi đã sở hữu năng lực thống lĩnh mạnh mẽ và hiệu quả hơn, chúng ta luôn sẵn sàng lan tỏa tầm ảnh hưởng của Thủy Tổ ra toàn cõi thiên hà, đúng như những gì Người đã làm trong quá khứ, hiện tại và mãi mãi về sau. Và [Root.GetName] sẽ chứng kiến tất cả."
 origin_tooltip_progenitor_hive_effects:5 "— Thay thế ['concept_spawning_pools', £building£Hồ đẻ trứng] bằng ['concept_offspring_nests', £building£Tổ ấp thế hệ sau]\n— $AVAILABLE_HOLDINGS$['concept_offspring_holding', £building£Tổ ấp thế hệ sau]\n— Miễn là không chọn §I$civic_hive_devouring_swarm$§!: §IPhân khu§! có thể được giải phóng thành §INước chư hầu§!\n— §ILãnh đạo§! được chỉ định: Nhận thêm kinh nghiệm bị động\n— $AVAILABLE_STARBASE_BUILDINGS$§IĐài quan sát thế hệ sau§!\n— Có thể đóng §ITàu thế hệ sau§!"
 origin_tooltip_progenitor_hive_negative_effects: "— Hạm đội sẽ chịu ảnh hưởng tiêu cực từ ['concept_insufficient_offspring_oversight']"
 #Progenitor deposits, armies and decisions
 progenitor_defense:0 "Thủy tổ Tổ hợp"
 progenitor_defense_plural:0 "$progenitor_defense$"
 progenitor_defense_desc:0 "Thủy tổ của tổ hợp này. Là thành viên lớn nhất và phức tạp nhất của tổ hợp."
 d_progenitor:0 "Tổ kén Thủy tổ"
 d_progenitor_desc:0 "Tổ kén của Thủy tổ, nơi mọi thế hệ sau được sinh ra."
 d_progenitor_empty:0 "Tổ kén Thủy tổ trống rỗng"
 d_progenitor_empty_desc:0 "Thủy tổ từng vô cùng hùng mạnh đã bị khuất phục, chỉ để lại một bầy đàn chìm trong hỗn loạn."
 d_splinter_hive_link: "Liên kết cộng sinh nhánh bầy"
 d_splinter_hive_link_desc: "Chùm sợi tơ thần kinh vươn tới từ một nhánh bầy tách rời nơi thế giới lệ thuộc. Những cá thể thợ mới sinh ra từ khối sinh chất xa xôi kia sẽ men theo đó mà tìm về thế giới này."

 decision_grow_progenitor:0 "Nuôi dưỡng một Thủy tổ mới"
 decision_grow_progenitor_desc:0 "Đứa con lớn nhất trong số các thế hệ sau có thể kế thừa di sản của Thủy tổ đã khuất."

 missing_progenitor_modifier:0 "Thiếu vắng Thủy tổ"
 missing_progenitor_modifier_desc:0 "Tổ hợp này đang mất đi Thủy tổ của chúng và rơi vào hỗn loạn."

 ship_progenitor_hive_modifier:0 "Tác động tiêu cực do thiếu quyền tự chủ"
 ship_progenitor_hive_modifier_desc:0 "Trong chiến tranh giữa các vì sao, nếu tổ hợp này không được giám sát bởi các tàu thế hệ sau, nó sẽ bị suy yếu nghiêm trọng."

 #Events
 origin.3210.name:0 "Thủy tổ ngã xuống"
 origin.3210.desc:1 "Chuyện khó tin đã xảy ra. Thủ đô của chúng ta đã rơi vào tay bọn [From.species.GetHandNamePlural] đê tiện của [From.GetName]. Trong trận chiến phòng thủ tuyệt vọng gần đây trên [Root.GetName], Thủy tổ của chúng ta đã rơi vào tay những kẻ xâm lược đáng tởm, và mang theo sinh mạng của rất nhiều tên [From.GetSpeciesAdj].\n\nĐể phòng hờ, Thủy tổ biết nhìn xa trông rộng của chúng ta đã sắp xếp sẵn một người kế vị trong số các thế hệ sau. Ứng cử viên này có thể ổn định một phần ý thức tổ hợp của chúng ta, nhưng sự phức tạp và áp lực của việc giành lại quyền kiểm soát toàn bộ ý thức vượt quá khả năng của nó. Trước khi kẻ thù lợi dụng sự hỗn loạn nhất thời của chúng ta để giành lợi thế lớn hơn, chúng ta phải nhanh chóng thúc đẩy thế hệ sau này trưởng thành để nó trở thành một Thủy tổ mới."
 origin.3215.name:0 "Di cư"
 origin.3215.desc:0 "Chuyện khó tin đã xảy ra. Hành tinh mẹ của chúng ta đã rơi vào tay bọn [From.species.GetHandNamePlural] đê tiện của [From.GetName]. Bây giờ chúng ta buộc phải chuyển mọi năng lực hành chính đến [capital_scope.GetName], bao gồm cả việc trang bị một Tổ kén Thủy tổ mới. Trước khi kẻ thù bắt đầu lợi dụng sự tan rã nhất thời này, chúng ta phải ấp một trong những hậu duệ thành Thủy tổ mới."
 origin.3215.a:0 "Chúng ta chắc chắn sẽ lấy lại uy phong."
 origin.3245.name:0 "Mất phương hướng"
 origin.3245.desc:0 "[Root.GetName] đã bị tấn công bởi vũ khí Colossus đáng sợ của §Y[From.GetAdj]§!. Thứ chúng ta mất đi không chỉ là hành tinh này, mà còn là Thủy tổ và toàn bộ thế hệ sau sống trên [Root.GetPlanetHabitat] này. Mọi thế hệ sau và drone trên [Root.GetName] đã tập hợp lại, dốc toàn lực bảo vệ Thủy tổ khỏi đòn tấn công của thứ vũ khí kinh hoàng này. Cuối cùng, mọi nỗ lực của chúng chỉ có thể trì hoãn sự diệt vong không thể tránh khỏi, Thủy tổ đã nhanh chóng ngã xuống.\n\nBây giờ ý thức chủ thể của chúng ta tràn ngập những suy nghĩ và thôi thúc mâu thuẫn. Nếu chúng ta không lập tức chỉ định một Thủy tổ mới, [Owner.GetName] sẽ sớm tàn lụi."
 origin.3245.a:0 "Chúng ta phải vùng lên đánh trả!"
 origin.3245.b:0 "Được rồi, mau chạy trốn thôi!"
 origin.3245.c:0 "Chúng ta cần thêm khoáng sản."
 origin.3245.d:0 "*Tiếng rít khó hiểu*"
 origin.3265.name:0 "Chết do oanh tạc dữ dội"
 origin.3265.desc:0 "Sau nhiều tháng bị oanh tạc liên tục, mọi chuyện đã kết thúc. [From.GetName] đã thất thủ, mọi dấu hiệu của sự sống đều biến mất. Những đám mây bụi dày đặc cuộn trào trên những con phố đổ nát từng là thủ đô của chúng ta. Xác của những [Root.GetSpeciesNamePlural] phơi thây ngoài đồng hoang, chất thành núi bên cạnh thành viên vĩ đại nhất của chúng ta, Thủy tổ, người cũng đã ra đi trong đợt oanh tạc cuối cùng.\n\nBây giờ chúng ta buộc phải chuyển mọi năng lực hành chính đến [capital_scope.GetName], đồng thời cần phải xây dựng một Tổ kén Thủy tổ mới. Trước khi kẻ thù bắt đầu lợi dụng sự tan rã nhất thời này, chúng ta phải ấp một trong những thế hệ sau thành Thủy tổ mới."

 MESSAGE_OFFSPRING_DEFEATED_TITLE:0 "Thế hệ sau bị đánh bại"
 MESSAGE_OFFSPRING_DEFEATED_DESC:0 "Thế hệ sau của chúng ta trên $PLANET|Y$ đã bị đánh bại, dẫn đến việc §YTổ ấp thế hệ sau§! của chúng ta bị phá hủy."
 MESSAGE_NO_OFFSPRING_TITLE:0 "Thiếu thế hệ sau"
 MESSAGE_NO_OFFSPRING_DESC:0 "Hiện tại chúng ta chưa cử drone đến §YTổ ấp thế hệ sau§! trên $PLANET|Y$, điều này sẽ làm giảm hiệu suất của các drone thợ."

 MESSAGE_FINAL_OFFSPRING_SHIP_TITLE:0 "Tàu thế hệ sau cuối cùng bị đánh bại"
 MESSAGE_FINAL_OFFSPRING_SHIP_DESC:0 "Tàu §Ythế hệ sau§! cuối cùng của chúng ta trong hệ sao $SYSTEM|Y$ đã bị đánh bại, hạm đội của chúng ta đã mất đi sự chỉ huy và kiểm soát cần thiết."

 offspring_drone: "$job_offspring_drone$"
 job_offspring_drone:0 "Drone thế hệ sau"
 job_offspring_drone_plural:0 "Drone thế hệ sau"
 job_offspring_drone_plural_with_icon: "[spawning_drone.GetIcon]$job_offspring_drone_plural$"
 mod_job_offspring_drone_add:0 "Công việc $job_offspring_drone$"
 job_offspring_drone_desc:0 "Các drone hành chính của toàn bộ hành tinh đều ở đây. Thủy tổ thực hiện những thiết kế vĩ đại của mình thông qua các drone thế hệ sau."
 job_offspring_drone_effect_desc: "[spawning_drone.GetIcon]$job_offspring_drone_plural$ chuyển đổi $r_food$ (hoặc tài nguyên tương đương) thành £mod_planet_amenities_no_happiness_add£§Y$PLANET_AMENITIES_TITLE$§! và £mod_planet_pop_assembly_mult£§Y$MOD_BONUS_POP_GROWTH$§!, tạo ra §Y$offspring_defense_plural$§!, và cung cấp lợi ích £mod_planet_jobs_simple_drone_produces_mult£§G+10%§! sản lượng §Y$pop_cat_simple_drone$§!."
 building_offspring_nest:0 "Tổ ấp thế hệ sau"
 building_offspring_nest_desc:1 "Tổ ấp được gia cố này che chở cho các thế hệ sau ở địa phương và cũng đẩy nhanh sự phát triển của tổ hợp xung quanh."
 offspring_nest_tooltip:1 "\n§HChỉ những giống loài thuộc Tổ hợp Khởi thủy mới có thể được lắp ráp bởi Tổ ấp thế hệ sau§!\n"

 offspring_defense:1 "Quân thế hệ sau"
 offspring_defense_plural:1 "Quân thế hệ sau"
 offspring_defense_desc:1 "Những đội lục quân này được Thủy tổ địa phương trực tiếp giám sát, chúng không chỉ nguy hiểm hơn mà sức sống còn ngoan cường hơn bất kỳ binh lính nào do tổ hợp thông thường tạo ra."

 missing_offspring_modifier:0 "Thiếu thế hệ sau"
 missing_offspring_modifier_desc:0 "Hành tinh này đang thiếu thế hệ sau, khiến hiệu suất của $pop_cat_simple_drone$ giảm đáng kể."

