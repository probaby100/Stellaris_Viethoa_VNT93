 resolution_defenseprivatization_repeal_4_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_defenseprivatization_security_business$§!, giữ lại nghị quyết §Y$resolution_defenseprivatization_condottieri$§! thành luật của thiên hà."
 resolution_defenseprivatization_repeal_5_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_defenseprivatization_corporate_warlords$§!, giữ lại nghị quyết §Y$resolution_defenseprivatization_security_business$§! thành luật của thiên hà."
 resolution_defenseprivatization_defense_contracts_tooltip:1 "Mỗi §YThành bang Lính đánh thuê§! nhận được §G+10§! sức chứa hải quân.\nViệc trả §YCổ tức Lính đánh thuê§! sẽ diễn ra thường xuyên hơn.\nTiết kiệm §G5%§! sức chứa hải quân bị chiếm dụng bởi §YHạm đội Lính đánh thuê§! được thuê, nhưng phí bảo trì năng lượng §R+10%§!."
 resolution_defenseprivatization_private_support_troops_tooltip:1 "Mỗi §YThành bang Lính đánh thuê§! nhận được §G+20§! sức chứa hải quân.\nViệc trả §YCổ tức Lính đánh thuê§! sẽ diễn ra thường xuyên hơn.\nTiết kiệm §G10%§! sức chứa hải quân bị chiếm dụng bởi §YHạm đội Lính đánh thuê§! được thuê, nhưng phí bảo trì năng lượng §R+20%§!."
 resolution_defenseprivatization_condottieri_tooltip:1 "Mỗi §YThành bang Lính đánh thuê§! nhận được §G+30§! sức chứa hải quân.\nViệc trả §YCổ tức Lính đánh thuê§! sẽ diễn ra thường xuyên hơn.\nTiết kiệm §G15%§! sức chứa hải quân bị chiếm dụng bởi §YHạm đội Lính đánh thuê§! được thuê, nhưng phí bảo trì năng lượng §R+30%§!.\n\n$resolution_defenseprivatization_breach$"
 resolution_defenseprivatization_security_business_tooltip:1 "Mỗi §YThành bang Lính đánh thuê§! nhận được §G+40§! sức chứa hải quân.\nViệc trả §YCổ tức Lính đánh thuê§! sẽ diễn ra thường xuyên hơn.\nTiết kiệm §G20%§! sức chứa hải quân bị chiếm dụng bởi §YHạm đội Lính đánh thuê§! được thuê, nhưng phí bảo trì năng lượng §R+40%§!.\nKhi một §YHạm đội Lính đánh thuê§! được thuê sẽ +§G+20%§! £diplo_weight£§YTrọng lượng Ngoại giao§!.\n\n$resolution_defenseprivatization_breach$"
 resolution_defenseprivatization_corporate_warlords_tooltip:1 "Mỗi §YThành bang Lính đánh thuê§! nhận được §G+50§! sức chứa hải quân.\nViệc trả §YCổ tức Lính đánh thuê§! sẽ diễn ra thường xuyên hơn.\nTiết kiệm §G25%§! sức chứa hải quân bị chiếm dụng bởi §YHạm đội Lính đánh thuê§! được thuê, nhưng phí bảo trì năng lượng §R+50%§!.\nKhi một §YHạm đội Lính đánh thuê§! được thuê sẽ +§G+40%§! £diplo_weight£§YTrọng lượng Ngoại giao§!.\n\n§RCấm§! §YKhông thuê hạm đội§!."

