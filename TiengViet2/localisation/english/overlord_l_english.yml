 resolution_bureaucraticsurveillance_administrative_insight:0 "Tầm nhìn Hành chính"
 resolution_bureaucraticsurveillance_administrative_insight_desc:0 "Là một phần trong nỗ lực hợp lý hóa hệ thống quan liêu thiên hà, chúng ta đã thúc đẩy một cấu trúc hành chính tiên tiến hơn tại Thượng viện, được thiết kế đặc biệt dành cho các quốc gia thành viên đã ký kết hiệp ước ngoại giao với nhau."
 resolution_bureaucraticsurveillance_borderless_authority:0 "Cơ quan Thẩm quyền Không biên giới"
 resolution_bureaucraticsurveillance_borderless_authority_desc:0 "Là một phần trong công cuộc cải cách sâu rộng hơn nữa nhằm hợp lý hóa hệ thống quan liêu nội chính, chúng ta bắt buộc phải trao thẩm quyền lớn hơn cho các quốc gia thành viên hùng mạnh trong Thượng viện."
 resolution_bureaucraticsurveillance_personal_oversight:0 "Sự sơ suất của Cá nhân"
 resolution_bureaucraticsurveillance_personal_oversight_desc:0 "Mặc dù phải thừa nhận rằng, trong quá trình này, chủ quyền của một số quốc gia đã bị xói mòn do ép buộc, nhưng những nỗ lực của chúng ta nhằm xóa bỏ tệ quan liêu đỏng đảnh đã cải thiện đáng kể hiệu quả làm việc của Thượng viện!"

 resolution_bureaucraticsurveillance_repeal_1:0 "§RBãi bỏ $resolution_bureaucraticsurveillance_administrative_insight$§!"
 resolution_bureaucraticsurveillance_repeal_1_desc:0 "Chúng ta đã tập trung vào việc xóa bỏ tệ quan liêu đỏng đảnh, và mặc dù đạt được một số thành công nhất định, điều này đã dẫn đến việc một số quốc gia thành viên phàn nàn rằng chủ quyền quốc gia của họ đã bị xói mòn. Giờ đây họ đang đệ trình một dự luật yêu cầu khôi phục lại một số quyền độc lập tự chủ đã mất."
