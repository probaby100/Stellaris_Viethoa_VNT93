 ##########################
 # Subterranean origin
 ##########################

 origin_subterranean:0 "Người lòng đất"
 origin_subterranean_desc:4 "Giống loài này có lẽ sẽ không bao giờ biết tại sao tổ tiên của họ lại di cư xuống dưới mặt đất. Đây rốt cuộc là vì nhu cầu tự bảo vệ, hay để theo đuổi sự giàu có về tài nguyên? Dù mục đích là gì, họ đã thích nghi thành công với môi trường, tạo ra một xã hội linh hoạt hơn với các điều kiện môi trường."
 origin_tooltip_subterranean_effects:4 "- $SPECIES_TRAITS$ ['concept_cave_dweller'] $origin_tooltip_subterranean_shared_effects$"
 origin_tooltip_subterranean_shared_effects: "\n—['concept_mining_district', £district£Khu Khai Khoáng]: Không giới hạn\n—Mở khóa chuyên hóa Khu Khai Khoáng: £zone£§Y$zone_subterranean_urban$§!\n—Hành tinh quê hương ban đầu có sẵn §Y$zone_subterranean_urban$§! £zone£ đã xây dựng xong."
 trait_cave_dweller:0 "Kẻ ở hang"
 trait_cave_dweller_desc:1 "§LGiống loài này có thể sinh sôi nảy nở dưới lòng đất của bất kỳ hành tinh nào mà họ tìm thấy.§!"
 trait_cave_dweller_tooltip: "$MOD_BIO_LOGISTIC_GROWTH_MULT$: §R-10%§!"
 trait_robot_cave_dweller: "Robot đào hầm"
 trait_robot_cave_dweller_desc: "§LNhững cỗ máy này được thiết kế tinh xảo để đáp ứng nhu cầu thám hiểm hang động và khai thác khoáng sản, thể hiện khả năng di chuyển vượt trội giúp chúng dễ dàng đi lại trong thế giới ngầm.§!"
 trait_robot_cave_dweller_tooltip: "$MOD_POP_ASSEMBLY_SPEED$: §R-10%§!"
 origin_subterranean_machines: "Máy móc lòng đất"
 origin_subterranean_machines_desc: "Nền văn minh này đã hòa nhập hoàn hảo vào sự tồn tại dưới lòng đất, động lực ban đầu của chúng có thể là một kiểu tự bảo vệ đã được tính toán kỹ lưỡng, hoặc một chỉ thị nào đó nhằm tìm kiếm các nguồn tài nguyên phong phú ẩn sâu dưới lòng đất. Sự thích nghi cơ học từ đó đã sớm đào tạo ra một cộng đồng máy móc đa năng và kiên định."
 origin_tooltip_robot_subterranean_effects: "- $SPECIES_TRAITS$ ['concept_robot_cave_dweller'] $origin_tooltip_subterranean_shared_effects$"

 START_SCREEN_SUBTERRANEAN:1 "Trong khi những sinh mệnh khác trên [GetHomeWorldName] chỉ có thể trải qua màn đêm nơi hoang dã, tổ tiên của chúng ta đã sớm học được trí tuệ sống dưới lòng đất, nơi đây cung cấp cho họ sự che chở khỏi ánh nắng gay gắt và khí hậu khắc nghiệt.\n\n$START_SCREEN_SUBTERRANEAN_END$"
 START_SCREEN_SUBTERRANEAN_PLANT:1 "Sự sống trên [GetHomeWorldName] đã đi theo một số con đường tiến hóa hoàn toàn khác biệt. Khác với những dạng sống khác cùng chung sống trên hành tinh này, chúng hấp thụ năng lượng từ ánh sáng mặt trời trong khi chúng ta lấy chất dinh dưỡng từ lòng đất tối tăm, đúng như những gì tổ tiên [GetSpeciesAdj] của chúng ta đã làm.\n\n$START_SCREEN_SUBTERRANEAN_END$"
 START_SCREEN_SUBTERRANEAN_LITHOID:0 "Chúng ta sinh ra dưới sâu trong lòng đất của [GetHomeWorldName]. Con đường tiến hóa của chúng ta khác với những người anh em họ bất động của chúng ta, chúng bảo vệ chúng ta từ phía trên như những người lính gác, trong khi chúng ta chọn cách tránh xa ánh nắng chói chang và khắc nghiệt. Khác với chúng, chúng ta có được khả năng di chuyển, suy nghĩ và xây dựng một nền văn minh.\n\n$START_SCREEN_SUBTERRANEAN_END$"
 START_SCREEN_SUBTERRANEAN_END:2 "Việc dễ dàng tiếp cận các khoáng sản dưới lòng đất đã giúp tổ tiên [GetSpeciesAdj] của chúng ta hoàn thành quá trình công nghiệp hóa, thống nhất giống loài và làm sâu sắc thêm hình thái văn minh hang động. Chúng ta đã nhiều lần cố gắng quay trở lại mặt đất nhưng mỗi lần đều chỉ mang lại những ký ức tàn khốc và khó khăn. Vì vậy, chúng ta vẫn ở lại dưới lòng đất, thiết lập vị thế tối cao của mình tại gốc rễ của hành tinh.\n\nGiờ đây, với việc phát minh ra [GetStartingDrivePlural] đầu tiên, chúng ta đã thực hiện một bước đi táo bạo nhất từ trước đến nay. Giống như việc khai phá trong bóng tối của tổ tiên, chúng ta phải đục đẽo ra quê hương mới cho chính mình giữa khoảng không giữa các vì sao."
 START_SCREEN_SUBTERRANEAN_ROBOT: "Chúng ta được sinh ra dưới sâu trong lòng đất của [GetHomeWorldName], nhưng không hiểu vì sao những người sáng tạo đã rời bỏ chúng ta lại phải đào sâu xuống dưới mặt đất như vậy. Tuy nhiên, đó chắc chắn là quyết định tốt nhất, vì hiện tại chúng ta đã là nền văn minh duy nhất còn sót lại ở đây.\n\nNhờ việc dễ dàng tiếp cận khoáng sản dưới lòng đất, vô số thế hệ trước của chúng ta đã phát triển mạnh mẽ. Sau khi đảm bảo quyền kiểm soát thế giới ngầm của hành tinh, cuối cùng chúng ta đã chinh phục được mặt đất.\n\nNgày nay, với sự phát triển của [GetStartingDrivePlural] đầu tiên, chúng ta sẽ thực hiện bước tiến táo bạo nhất. Đi tới các vì sao, và, như mọi khi, đục đẽo quê hương mới của chúng ta trong bóng tối vô tận."
 SUBTERRANEAN:0 "Người lòng đất"

 ##########################
 # Teachers of the Shroud #
 ##########################

 origin_shroudwalker_apprentice:0 "Người học việc Hư Cảnh"
 origin_shroudwalker_apprentice_desc:2 "§RCảnh báo: Vô hiệu hóa tất cả các con đường Thăng thiên ngoại trừ ['concept_psionic_ascension'].§!\n\nTừ rất lâu trước khi bước lên vũ đài thiên hà, nền văn minh của họ đã được hỗ trợ và định hình bởi Cụm Kẻ Bước Đi Trong Hư Cảnh."
 START_SCREEN_SHROUDWALKER_APPRENTICE:1 "Tổ tiên của chúng ta đã truyền lại những huyền thoại về Người thầy: họ thông tuệ mọi điều, và đã định hình những giai đoạn đầu của nền văn minh chúng ta. Thông qua giấc mơ, họ giao tiếp với chúng ta từ một nơi xa xôi, truyền đạt cho chúng ta kiến thức và trí tuệ về Hư Cảnh.\n\nNay Người thầy của chúng ta lại giáng lâm, thông qua việc gieo rắc những hình ảnh kỳ lạ vào giấc mơ của chúng ta, người đã dạy chúng ta bí mật của việc du hành giữa các vì sao. Chỉ vài năm sau, chúng ta đã có thể đóng những con tàu du hành ngoài không gian.\n\nNhưng con đường phía trước của chúng ta còn bao xa? Người thầy của chúng ta đã chỉ ra con đường 'Đường hầm Hư Cảnh', đó là một lỗ sâu tự nhiên nằm ở biên giới hệ sao quê hương của họ. Tạo ra đường hầm của riêng mình sẽ cho phép chúng ta thăm Người thầy qua con đường này. Khi chúng ta bước lên vũ đài giữa các vì sao, nguyện Người thầy của chúng ta tiếp tục ban cho chúng ta thêm nhiều trí tuệ."
 START_SCREEN_SHROUDWALKER_APPRENTICE_CORPORATE:0 "Những nhà sáng lập giáo hội của chúng ta đã mô tả về Người thầy như sau: họ toàn tri toàn năng, họ đã mang xuống những phúc âm đầu tiên. Thông qua giấc mơ, họ giao tiếp với chúng ta từ một nơi xa xôi, truyền đạt cho chúng ta kiến thức và trí tuệ về Hư Cảnh.\n\nNay Người thầy của chúng ta lại giáng lâm, thông qua việc gieo rắc những hình ảnh kỳ lạ vào giấc mơ của chúng ta, người đã dạy chúng ta bí mật của việc du hành giữa các vì sao. Chỉ vài năm sau, chúng ta đã có thể đóng những con tàu du hành ngoài không gian.\n\nNhưng đây chưa phải là hồi kết cho những hoài bão của chúng ta. Người thầy của chúng ta đã chỉ ra con đường 'Đường hầm Hư Cảnh', đó là một lỗ sâu tự nhiên nằm ở biên giới hệ sao quê hương của họ. Nếu chúng ta tạo ra con đường linh thiêng này, chúng ta có thể trực tiếp diện kiến Người thầy. Khi chúng ta bước lên vũ đài giữa các vì sao, nguyện Người thầy của chúng ta tiếp tục ban cho chúng ta thêm nhiều trí tuệ."
 START_SCREEN_SHROUDWALKER_APPRENTICE_NOMADS: "Tổ tiên chúng ta truyền lại những câu chuyện huyền thoại về các Vị Thầy: họ thấu suốt vạn vật, đã dẫn lối cho chúng ta từ trước cả khi ký ức được hình thành. Qua những giấc mộng, họ vượt cõi hư không để kết nối với tổ tiên phiêu bạt của chúng ta, truyền dạy tri thức và trí tuệ về Hư Cảnh.\n\nGiờ đây các Vị Thầy lại một lần nữa hiển hiện, gieo vào giấc mộng của chúng ta những hình ảnh kỳ ảo, mách bảo rằng con đường nối liền hai vì sao không chỉ có mỗi cách trôi dạt chậm chạp, mà còn có một lối đi xuyên qua chính Hư Cảnh, vượt muôn trùng khoảng cách chỉ trong chớp mắt.\n\nThế nhưng con đường phía trước của chúng ta còn bao xa? Các Vị Thầy đã chỉ ra lối đi mang tên \"Đường Hầm Hư Cảnh\", một lỗ sâu tự nhiên nằm nơi rìa hệ sao quê nhà của họ. Nếu có thể tự tạo ra đường hầm cho riêng mình, chúng ta sẽ có thể ghé thăm các Vị Thầy qua lối đi ấy. Nguyện rằng khi chúng ta vững bước giữa muôn vì sao, các Vị Thầy sẽ tiếp tục soi sáng trí tuệ cho chúng ta."
 origin_tooltip_shroudwalker_apprentice_effects:3 "— $SPECIES_TRAITS$['concept_latent_psionic']\n— $AVAILABLE_STARBASE_BUILDINGS$['concept_shroud_beacon']\n— Có quan hệ ngoại giao với ['concept_shroudwalker_enclave'].\n— $GUARANTEED_RESEARCH_OPTION_STRING$['concept_psionic_theory', £society£$tech_psionic_theory$]"

 origin.5605.name:0 "Người học việc thực sự"
 origin.5605.generic.desc:1 "Hỡi những học trò của chúng ta, chúng ta đã dạy dỗ các bạn hết thế hệ này đến thế hệ khác, gieo mầm kiến thức về Hư Cảnh và những bí ẩn của nó vào trong những giấc mơ của các bạn. Giờ đây các bạn đã có thể vươn tới những vì sao, khoảng thời gian làm người học việc thực sự của các bạn mới chỉ bắt đầu. Con đường phía trước sẽ không bằng phẳng. Để soi sáng con đường các bạn đi, chúng ta truyền cho các bạn kiến thức về Đèn hiệu Hư Cảnh, một thiết bị vô cùng mạnh mẽ. Sau khi được xây dựng trên một trong những căn cứ sao của các bạn, ngọn hải đăng này sẽ mở ra một Đường hầm Hư Cảnh. Hãy cẩn thận khi chọn địa điểm, vì Đường hầm Hư Cảnh sẽ chỉ xuất hiện một lần duy nhất.\n\nNếu có điều gì cần yêu cầu, hay gặp bất trắc gì hãy gọi cho chúng ta. Trong những giấc mơ, chúng ta sẽ luôn dõi theo các bạn. Trong chuyến hành trình lang thang này, chúng ta chờ đợi sự xuất hiện của các bạn."
 origin.5605.corporate.desc:0 "Hỡi những học trò, chúng ta đã từng dẫn dắt các bạn trong những giấc mơ. Thông qua những giấc mơ này, chúng ta đã định hình nên thế giới của các bạn. Nay các bạn đã lớn mạnh, có thể lan truyền tín ngưỡng của chúng ta giữa các vì sao, thử thách thực sự của các bạn mới chỉ bắt đầu. Sự siêng năng của các bạn sẽ làm rạng rỡ Hư Cảnh, thành quả lao động của các bạn cũng là sự đền đáp cho những lời dạy bảo. Để thắp lên ngọn lửa sự nghiệp, chúng ta truyền cho các bạn kiến thức về Đèn hiệu Hư Cảnh, một thiết bị vô cùng mạnh mẽ. Sau khi được xây dựng trên một trong những căn cứ sao của các bạn, ngọn hải đăng này sẽ mở ra một Đường hầm Hư Cảnh. Hãy cẩn thận khi chọn địa điểm, vì Đường hầm Hư Cảnh sẽ chỉ xuất hiện một lần duy nhất.\n\nNếu có điều gì cần yêu cầu, hay gặp bất trắc gì hãy gọi cho chúng ta. Trong những giấc mơ, chúng ta sẽ luôn dõi theo các bạn. Trong chuyến hành trình lang thang này, chúng ta chờ đợi sự xuất hiện của các bạn."
 origin.5605.a:0 "Chúng tôi mang lòng biết ơn đón nhận món quà của người."
 origin.5605.b:0 "Đây là những gì chúng ta xứng đáng nhận được."
 origin.5605.tt:0 "Chúng ta cũng sẽ nhận được:"

 origin.5615.name:0 "Chào mừng người học việc"
 origin.5615.a.desc:0 "Hỡi những người học việc, cuối cùng chúng ta cũng có thể đàng hoàng nói lời chào với các bạn. Những dấu hiệu và điềm báo đều đã tiên đoán về khoảnh khắc này, chính Hư Cảnh cũng sẽ làm chứng cho sự xuất hiện của các bạn. Chúng ta đã mong đợi từ rất lâu, chỉ để gặp các bạn trong cõi giới của nhận thức. Tại đây, các bạn là những sự tồn tại được hoan nghênh nhất."
 origin.5620.name:0 "Chào mừng người học việc"
 origin.5620.b.desc:0 "Hỡi những người học việc, cuối cùng chúng ta cũng có thể đàng hoàng nói lời chào với các bạn. Thông qua đường hầm đã được chuẩn bị từ lâu, sự xuất hiện của các bạn đã được Hư Cảnh cảm nhận. Âm vang của các bạn vẫn đang rung động, lan tỏa như những gợn sóng qua mặt nước của tiềm thức. Những cư dân ngụ trong sự bí ẩn của Hư Cảnh chắc chắn sẽ chúc phúc cho cuộc gặp gỡ của chúng ta. Tại đây, các bạn là những sự tồn tại được hoan nghênh nhất."

 origin.5625.name:0 "Thắp sáng đèn hiệu"
 origin.5625.a.desc:1 "Sau những ngày tháng vô tận mò mẫm trong bóng tối, bức màn của Hư Cảnh cuối cùng cũng được vén lên. Người thầy của chúng ta đã ban cho chúng ta một báu vật vô giá. Chiếc đèn hiệu này cùng với đường hầm do nó tạo ra, chắc chắn sẽ soi sáng cho tuyến đường vượt qua các vì sao của chúng ta. Chuyến đi bắt đầu từ hệ sao này sẽ nhanh hơn... và cũng bí ẩn hơn rất nhiều."
 origin.5625.a.option:0 "Nguyện Hư Cảnh sẽ chào đón sự hiện diện của chúng ta."
 origin.5625.b.desc:1 "Sau những ngày tháng vô tận mò mẫm trong bóng tối, bức màn của Hư Cảnh cuối cùng cũng được vén lên. Người thầy của chúng ta đã ban cho chúng ta một báu vật vô giá. Chiếc đèn hiệu này cùng với đường hầm do nó triệu hồi, chắc chắn sẽ soi sáng cho tuyến đường vượt qua các vì sao của chúng ta.\n\nVẫn còn một bước nữa: ranh giới ở phía bên kia nơi Người thầy của chúng ta sinh sống cho đến nay vẫn đóng cửa với chúng ta. Các tuyến đường trên bản đồ thực tế có thể không quan trọng đối với Hư Cảnh, nhưng những hành tinh ở bên này vẫn còn rất nhiều rắc rối. Ít nhất là hiện tại, lộ trình đi qua đường hầm của chúng ta vẫn đang bị phong tỏa."

 ################################
 # Slingshot to the Stars Origin
 ################################

 origin_star_slingshot:0 "Bệ phóng Tinh tú"
 origin_star_slingshot_desc:1 "Đã từng có lúc, bầu trời của nền văn minh này chớp nhoáng được thắp sáng bởi những ngôi sao băng, nhưng ngay sau đó lại chìm vào bóng tối đằng đẵng. Kể từ đó họ đã cố gắng vươn ra khỏi bầu trời để tìm kiếm câu trả lời, và trong chuyến hành trình không gian đầu tiên, họ đã phát hiện ra một §H$quantum_catapult_1$§! đang ngủ yên (và đã bị bỏ hoang từ lâu)."
 START_SCREEN_STAR_SLINGSHOT:0 "Từ thời thượng cổ, người dân của chúng ta thỉnh thoảng có thể nhìn thấy bầu trời đêm được thắp sáng bởi vô số ngôi sao băng, nhưng cho đến nay các nhà khoa học của chúng ta vẫn không thể giải thích được hiện tượng này. Khi chúng ta bắt đầu khám phá thiên hà, cuối cùng chúng ta cũng có được những trang bị cần thiết để truy tìm nguyên nhân của những hiện tượng nhiễu loạn này — một cấu trúc cổ đại mà các kỹ sư của chúng ta gọi là $quantum_catapult_1$.\n\n$START_SCREEN_STAR_SLINGSHOT_SECOND_PART$"
 START_SCREEN_STAR_SLINGSHOT_GESTALT:0 "Kể từ thuở hồng hoang khai thiên lập địa, thỉnh thoảng chúng ta đã có thể nhìn thấy bầu trời được thắp sáng bởi vô số ngôi sao băng, và hoàn toàn không thể hiểu được điều gì có thể gây ra hiện tượng kỳ lạ này. Khi cuối cùng chúng ta thoát khỏi xiềng xích của hành tinh quê hương, chúng ta đã xoay sở để có được công cụ cần thiết để truy tìm nguyên nhân của những hiện tượng nhiễu loạn này — một $quantum_catapult_1$.\n\n$START_SCREEN_STAR_SLINGSHOT_SECOND_PART$"
 START_SCREEN_STAR_SLINGSHOT_SECOND_PART:0 "Dù đang chìm trong giấc ngủ, bị hư hại một phần và bị bỏ hoang, chúng ta vẫn tin tưởng vững chắc rằng nó có thể phục hồi lại vinh quang thuở trước. Nếu hoạt động đúng như mong đợi của chúng ta, nó sẽ trở thành cánh cổng không gian dẫn đến mọi nơi trong thiên hà."
 origin_tooltip_star_slingshot_effects:4 "— $HOME_SYSTEM$ nằm gần ['concept_quantum_catapult_restored_slingshot'] đã bị phá hủy, kèm theo ['concept_slingshot_digsite']['concept_archaeology_site']\n— Hiệu ứng ['concept_quantic_ambush']: Tăng §G+50%§! $MOD_SHIP_FIRE_RATE_MULT$"

 # Events

 origin.3510.title:0 "Đã có được $quantum_catapult_1$"
 origin.3510.desc:0 "Cuối cùng chúng ta đã giành được quyền kiểm soát hệ sao có chứa $quantum_catapult_1$ và khu vực lân cận của nó. Giờ đây chúng ta có thể cử các kỹ sư đến đó để bắt đầu công trình sửa chữa, từ đó hồi sinh lại cấu trúc đang ngủ yên này."
 origin.3510.a:0 "Bước đầu tiên của hành trình ngàn dặm."

 # Dig Site

 slingshot_digsite:1 "Nhật ký của Kiến trúc sư Lượng tử"
 slingshot_digsite_desc:0 "Chúng ta đã tìm thấy tàn tích của một cấu trúc khổng lồ bị hư hại. Cấu trúc này rõ ràng đang rất cần được sửa chữa, đồng thời chúng ta cũng đã phát hiện ra một kho tàng vô giá chứa đựng những hiểu biết về sinh vật ngoài hành tinh trong cơ sở dữ liệu của nó. Trong khi chúng ta vẫn đang quyết định xem có nên xây dựng lại kỳ quan công nghệ cổ đại này hay không, các nhà khảo cổ học của chúng ta có cơ hội khai quật và lấy lại manh mối về nguồn gốc của thiết bị vũ trụ này. Cuốn nhật ký liên quan đến một trong những nhà phát minh của nó, \"Kiến trúc sư Lượng tử\", có vẻ đặc biệt có giá trị. Việc khôi phục những tài liệu này chắc chắn sẽ giúp ích rất nhiều cho chúng ta trong việc giải mã văn hóa và lịch sử của chủng tộc cổ đại đã để lại công nghệ này cho chúng ta."

 origin.3515.name:0 "Ánh sao rực rỡ"
 origin.3515.desc:0 "Bên trong các bản thiết kế và sơ đồ, chúng ta đã khôi phục được một tài liệu kỳ lạ:\n\nĐây là tài liệu cá nhân của Kiến trúc sư Lượng tử\n\nThuở hồng hoang, chúng ta sống trong bóng tối. Chúa phán: \"Phải có bóng tối\", thế là thế giới chìm trong bóng tối. Khi những tổ tiên đầu tiên của chúng ta có được ánh sáng của nhận thức, chúng ta đã muốn tìm kiếm những dấu hiệu và ý nghĩa của sự sống trên bầu trời, nhưng trên đỉnh đầu chúng ta chỉ có một bóng tối bao la. Khi chúng ta xây dựng nền văn minh, tâm trí chúng ta quét qua từng bóng đen trong đêm, chúng ta lao động vất vả tại nơi xây dựng thành phố đầu tiên, thường xuyên kiểm tra nền móng của chúng.\n\nHàng ngàn năm sau, tôi đột nhiên liều lĩnh ngước nhìn lên \"trên\". Khi những người khác vẫn đang cắm mặt xuống đất làm việc vất vả, tâm trí tôi đã mở ra với bầu trời. Tôi đã xây dựng những đền thờ bằng mạch điện và thép, dùng ánh sáng trí tuệ của mình để chế tạo các công cụ cho bản thân. Bằng cách hoàn thiện mê cung của các đi-ốt và tụ điện, tôi đã phát sóng ý thức của mình ra toàn vũ trụ, cảm nhận mọi thứ bên ngoài bóng tối đang bao trùm thế giới của chúng ta.\n\nBởi vì tôi có thể cảm nhận được những gì người khác không thể: Chúng ta không hề đơn độc trong vũ trụ. Qua bóng tối mờ ảo như lớp kính, tôi có thể cảm nhận được hàng ngàn hành tinh khác. Tôi có thể cảm nhận được những điều không thể. Nằm ngoài màn đêm bất tận của chúng ta là muôn vàn điểm sáng rực rỡ lan tỏa."
 origin.3520.name:0 "Vượt ngoài bóng tối"
 origin.3520.desc:0 "Mặc dù đoàn thám hiểm của chúng ta vẫn đang sàng lọc dữ liệu có thể giải mã kế hoạch xây dựng cấu trúc khổng lồ này, họ đã phát hiện ra một đoạn trích khác trông giống như một văn bản tôn giáo:\n\nTài liệu cá nhân của Kiến trúc sư Lượng tử\n\nTôi nói ra sự thật, nhưng người dân của tôi lại đáp trả bằng sự hỗn loạn.\nMỗi người chúng ta đều cắm cúi làm việc một cách tê liệt trong màn sương mù của tâm trí và cảm xúc của chính mình. Chúng ta thăm dò vươn tay ra với người khác, nhưng có quá nhiều người trong chúng ta cô độc. Chúa của chúng ta đã tạo ra thế giới trong bóng tối, và chúng ta được bảo rằng chúng ta mới là trung tâm trong tạo tác của ngài.\n\nChỉ vì tôi dám mơ về một thế giới ngoài bầu trời, mà tầm nhìn của tôi lại bị người khác coi là lời nói dối. Những người khác trong số chúng ta vặn hỏi: Làm sao có thể chứng minh được những giấc mơ này? Làm sao chúng ta có thể tin vào những điều mà chúng ta không thể chứng minh? Để đáp lại, tôi đã dẫn những ai vẫn còn muốn lắng nghe tôi đến phòng thí nghiệm của mình. Những bộ óc thông minh nhất này đã có thể cảm nhận được những gì tôi có thể cảm nhận: Những hành tinh khác ngoài màn đêm.\n\nNhưng những bộ óc tăm tối nhất lại đáp trả bằng những phản ứng khác, chúng thêu dệt nên những lập luận mới, nắm chặt lấy những vũ khí chết người. Những bộ óc nguy hiểm đó ngâm nga những câu chuyện ngụ ngôn, nói rằng hành tinh của chúng ta sẽ rơi vào hỗn loạn, bởi vì chúng ta không còn là đứa con cưng của thần linh nữa. Tuy nhiên, tôi vẫn biết sự thật: Ánh sáng của sự kiến tạo là một tấm màn vĩ đại. Khi khám phá bí mật của vũ trụ, tôi đã bị cuốn vào một làn sóng hân hoan, và dần đánh mất đi danh tính của chính mình."
 origin.3525.name:0 "Khai sáng"
 origin.3525.desc:0 "Nhiều văn bản mang tính thiên sai hơn đã được khôi phục:\n\nTài liệu cá nhân của Kiến trúc sư Lượng tử\n\nTôi không ngừng bị giày vò và cám dỗ bởi vũ trụ bao la vô tận, và bắt đầu cân nhắc việc đi đến những thế giới xa xôi để tự mình trải nghiệm. Sống trong một thế giới bị bao bọc bởi màn đêm bất tận, những tâm trí khác đang có những giấc mơ đẹp, còn tôi tìm cách giao tiếp với họ. Bên ngoài bóng tối có ánh sáng dẫn đường cho tôi, ánh sáng cám dỗ tôi, mang đến cho tôi vô vàn sự mặc khải. Thế là tôi phát sóng tâm trí của mình đến những thế giới xa xôi và vô danh...\n\nTrên trời sao, dưới đất vậy. Tầm nhìn của tôi về bầu trời mang lại cho tôi niềm vui, và trên mặt đất, tôi cũng đã tìm thấy một người có cùng niềm hạnh phúc mang lại cho tôi sự giải thoát tương tự. Tôi đã yêu một nhà khoa học khác, đó là một người có tầm nhìn xa trông rộng, đã sử dụng những phương pháp khác để tìm kiếm thế giới mà tôi cảm nhận được giữa các vì sao.\n\nChúng tôi không chỉ chia sẻ những gì mỗi người nhìn thấy. Chúng tôi thề sẽ trở thành bạn đời của nhau. Khi công việc tiến triển, chúng tôi nép vào nhau trong những đêm dài vô tận. Bạn đời của tôi mơ về các bản thiết kế tàu không gian, khắc ra những con tàu hàng không năng lượng mặt trời nguyên thủy trên bảng thiết kế bằng sáp. Tôi liên tục chắp vá với các mạch điện, nỗ lực hòa nhập tâm trí của tôi vào sự vô hạn. Cuộc phiêu lưu của tôi càng tiến sâu, niềm hân hoan trong tim tôi càng dâng tràn. Thật tuyệt diệu làm sao! Sự sung sướng bất tận!"
 origin.3530.name:0 "Băng qua quần sao"
 origin.3530.desc:0 "Tài liệu cá nhân của Kiến trúc sư Lượng tử, danh tính là bạn đời của Thợ đóng tàu Vũ trụ\n\nBạn đời của tôi vô cùng kiên nhẫn còn tôi lại có phần bốc đồng. Tình yêu của tôi sở hữu trí tuệ của khoa học và logic, còn tôi cũng có một trái tim phiêu bạt. Khi chúng tôi ngày càng xa cách trong những đêm dài vô tận, tôi đã phát sóng ý thức của mình vào hư không một cách vô vọng. Tôi phớt lờ giấc ngủ, phớt lờ cơn đói, và cuối cùng phớt lờ cả tình yêu của tôi. Trong khi chúng tôi theo đuổi giấc mơ trong vũ trụ, một khoảng cách đã bắt đầu xuất hiện trong thâm tâm.\n\nTình yêu của tôi đã đặt ra một cụm từ cho hiện tượng này: Rối lượng tử. Thể xác tôi vẫn ở đây, nhưng tâm trí tôi lại đang ngao du ngoài bầu trời, dốc sức tìm kiếm sự hân hoan và giao tiếp với sự vĩnh hằng. Bạn đời của tôi nói những chuyện khác với tôi, nhưng tôi chẳng thể nào lọt tai. \"Tình yêu của tôi\", bạn đời tôi gọi, \"hãy trở về bên tôi\", nhưng tôi chỉ có thể nghe thấy tiếng vọng của các vì sao.\n\nRất nhanh đã đến lúc thử nghiệm con tàu sao năng lượng mặt trời của bạn đời tôi. Tôi tình nguyện lái con tàu này. Khi tôi lần đầu tiên cầm lái và bắt đầu chuyến đi đầu tiên, tôi sẽ mơ về lộ trình dẫn đến những bờ bến xa xôi, thân xác tôi vẫn ở nguyên chỗ cũ, nhưng tâm trí tôi đã bay lượn ngoài bầu trời.\n\nTình yêu của tôi dần dần bình tĩnh lại, tôi sẽ ban cho tình yêu của tôi sự vô hạn, dẫn lối đến sự vĩnh hằng, để tôi làm người mở đường. Tôi sẽ trao cho tình yêu của tôi giấc mơ về hàng vạn thế giới."
 origin.3535.name:0 "Mãi mãi nhớ thương"
 origin.3535.desc:0 "Tài liệu cá nhân của Thợ đóng tàu Vũ trụ, danh tính là góa phụ của Kiến trúc sư Lượng tử\n\nCon tàu sao đầu tiên của chúng tôi đã biến mất một năm trước. Cho đến nay chúng tôi vẫn không biết chuyện gì đã thực sự xảy ra trước đó. Bạn đời của tôi, Kiến trúc sư Lượng tử, anh ấy chỉ để lại di sản và những bí ẩn. Suy đoán sâu sắc nhất mà chúng tôi có thể đưa ra cũng chỉ là tình yêu của tôi cuối cùng đã trở thành một phần của vũ trụ. Trước khi ngồi vào bảng điều khiển để bắt đầu chuyến đi đầu tiên, anh ấy đã hòa mình với sự vô hạn, bị nuốt chửng bởi sự ngây ngất và mộng tưởng về bầu trời. Con tàu thử nghiệm của chúng tôi không bao giờ quay trở lại nữa.\n\nBây giờ tôi chỉ có thể làm việc với những công cụ thô sơ trong tay, thu thập lại công việc và cuộc sống đã vỡ vụn của mình. Nhiều con tàu năng lượng mặt trời của tôi đã bắt đầu hành trình đến màn đêm vĩnh cửu. Tôi bắt đầu bắt tay vào lắp đặt những động cơ tốt hơn, động cơ nguyên mẫu có thể giúp tàu của chúng tôi vượt qua không gian siêu không gian. Vào một vài đêm, tôi mơ về một công nghệ có thể đưa chúng tôi đến các hệ sao vô danh, giống như tâm trí và linh hồn của người bạn đời mà tôi đã mất.\n\nTôi dang rộng vòng tay đón nhận ánh sáng, từ chối khuất phục bóng tối. Tôi ngồi trong phòng thí nghiệm của tình yêu của tôi, giống như ngay lúc này, đọc nhật ký của anh và viết nên cuốn nhật ký của chính mình. Đôi khi khi mọi thứ chìm vào tăm tối, tôi cố gắng phát sóng tâm trí của mình ra vũ trụ. Đây là đèn hiệu của sự vô hạn."
 origin.3540.name:0 "Lượng tử hóa"
 origin.3540.desc:0 "Khi cuối cùng chúng ta cũng tìm thấy tập tài liệu bị thất lạc trong kế hoạch xây dựng của cấu trúc này, chúng ta đã khôi phục lại văn bản cuối cùng:\n\nTài liệu từ Thợ đóng tàu Vũ trụ, danh tính là góa phụ của Kiến trúc sư Lượng tử\n\nChúng tôi đã khám phá nhiều phương pháp để hiện thực hóa những sáng tạo của tình yêu của tôi, cũng chính là những sáng tạo lượng tử của họ. Tôi không biết liệu chúng ta có thể đi dọc theo con đường tưởng chừng như liều lĩnh này, lấy thiết kế của Kiến trúc sư Lượng tử làm bản thiết kế, tiến bước chậm rãi đến những vì sao hay không. Tôi tìm kiếm những làn sóng có thể vượt qua siêu không gian, suy nghĩ về những dòng chảy có thể đưa chúng ta đến những bến bờ xa xôi.\n\nNhững con tàu của tôi tiến lên theo lộ trình chậm chạp, trong đêm khuya tôi đọc nhật ký của tình yêu của tôi, cố gắng thấu hiểu những biểu thức toán học và cơ chế liên quan trong đó. Khi tâm trí tôi chạm đến sự vô hạn, tôi nhận ra tình yêu của tôi vẫn còn ở đó. Anh ấy đã dẫn đường mở lối, tôi phải tiếp bước theo sau.\n\nThông qua việc mất đi, tôi lại nhận được nguồn cảm hứng. Chúng tôi từng bắt tay vào chế tạo một cỗ máy vĩ đại, nó có thể thúc đẩy con tàu của chúng tôi vượt qua hệ sao, giống như cách tình yêu của tôi bước vào sự vô hạn. Khi tôi rời đi, tôi khiêm tốn yêu cầu thiết bị vũ trụ này và những sản phẩm cải tiến của nó nên được đưa vào cuốn nhật ký cá nhân của Kiến trúc sư Lượng tử. Khi những người khác đọc được cuốn nhật ký này, không còn nghi ngờ gì nữa, linh hồn của tôi đã bay đến một nơi xa. Tôi sẽ tìm thấy con đường để đoàn tụ với tình yêu của tôi trong vũ trụ bao la. Bởi vì tôi biết chúng tôi sẽ cùng nhau ngụ lại trong sự vĩnh hằng, mơ mộng và trôi dạt giữa muôn vạn vì sao điểm xuyết."
 origin.3515.a:0 "Khôi phục thêm nhiều tài liệu hơn."
 origin.3540.a:0 "Đèn hiệu vô hạn."
 infinity_beckons:0 "Đèn hiệu vô hạn"
 into_the_unknown:0 "Bước vào chốn vô định"

 ##########################
 # Imperial Vassal Origin #
 ##########################
 origin_imperial_vassal:0 "Đất phong Đế quốc"
 origin_imperial_vassal_desc:1 "Trải nghiệm lần đầu tiên bay ra khỏi hành tinh quê hương là một ký ức đau buồn, chỉ trong chớp mắt, chúng ta đã bị chinh phục thê thảm và phải quỳ rạp dưới chân chúng. Tuy nhiên, bây giờ cuối cùng chúng ta cũng có thể hướng tới tương lai, một tương lai không phải sống dưới cái bóng của nước khác."
 START_SCREEN_IMPERIAL_VASSAL:0 "Khi chúng ta lần đầu tiên rời khỏi hệ sao quê hương, chúng ta đã đụng độ một đế quốc ngoài hành tinh ép buộc chúng ta phải quy phục. Mặc dù đối với nhân dân, đây là một ký ức đau đớn, nhưng thực tế chứng minh mối quan hệ chư hầu này có lợi hơn nhiều so với những gì chúng ta tưởng tượng, trong khoảng thời gian chư hầu ngắn ngủi này, chúng ta đã học được rất nhiều điều.\n\nChúng ta không phải là chư hầu duy nhất của Bá Chủ, vì chúng ta đã tiếp đón các nhà ngoại giao và đại sứ do những quốc gia nằm dưới quyền kiểm soát của Bá Chủ cử đến. Mặc dù chúng ta không vừa mắt với một số kẻ trong đó, nhưng ít nhất hiện tại họ vẫn là những đồng minh hữu ích.\n\nTuy nhiên, mặc dù chúng ta mong mỏi một ngày nào đó có thể độc lập tự chủ quyết định vận mệnh của chính mình, nhưng hiện tại vẫn phải chấp nhận địa vị chư hầu, và tận dụng tối đa cục diện hiện tại."
 origin_tooltip_imperial_vassal_effects:2 "— Một chư hầu của ['concept_advanced_empire']\n— Khi bắt đầu trò chơi, cần chọn loại ['concept_specialist_subject', Chuyên môn chư hầu]"

 # AI Overlord Version
 origin_imperial_vassal_overlord:0 "Chúa tể Đế quốc"
 origin_imperial_vassal_overlord_desc:0 "Đây là một bá chủ đầy tham vọng, nó đã dành rất nhiều thời gian và tâm sức để chinh phục các quốc gia lân cận nhằm thỏa mãn mọi nhu cầu của bản thân. Khi chúng chuyển giao ngày càng nhiều nghĩa vụ cho chư hầu gánh vác, bản thân chúng cũng ngày càng trở nên lười biếng."
 origin_tooltip_imperial_vassal_overlord_effects:0 "— Trở thành §HĐế quốc Cao cấp§! khi bắt đầu trò chơi\n— Sở hữu một số chư hầu khi bắt đầu trò chơi"

 # Personalities
 personality_imperial_origin_overlord_ai:0 "Thiên triều thượng quốc"
 personality_imperial_origin_overlord_ai_desc:0 "Đế quốc này vô cùng phụ thuộc vào chư hầu của họ, hiếm khi quan tâm đến những chuyện xảy ra bên ngoài hệ sao mẹ, cũng không giao chiến với các nước khác, lại càng không chủ động mở rộng bờ cõi, trừ khi bị ép buộc."

 # Modifiers
 imperial_vassal_ai_modifier:0 "Thuế Đế quốc"
 imperial_vassal_ai_modifier_desc:0 "Các hoạt động thường ngày của bộ máy quan liêu đế quốc cần tiêu tốn một phần đáng kể công sức của phái đoàn ngoại giao."

