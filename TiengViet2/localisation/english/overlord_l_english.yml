 resolution_intergalacticdirective_regulated_growth:0 "Tăng trưởng trong tầm kiểm soát"
 resolution_intergalacticdirective_regulated_growth_desc:0 "Bằng cách chuẩn hóa biên giới của các quốc gia thành viên, chúng ta có thể làm cho thiên hà trở nên an toàn và công bằng hơn cho tất cả mọi người. Mặc dù một số người có thể cảm thấy hệ thống quan liêu là nghẹt thở, nhưng điều này là vì lợi ích của tất cả chúng ta."
 resolution_intergalacticdirective_ensured_sovereignty:0 "Đảm bảo Chủ quyền"
 resolution_intergalacticdirective_ensured_sovereignty_desc:0 "Cộng đồng Thiên hà sẽ hành động tích cực để đảm bảo chủ quyền của các quốc gia thành viên thông qua các chỉ thị, đặc biệt là những quốc gia bị các đế quốc khác phá hoại chủ quyền và toàn vẹn lãnh thổ."
 resolution_intergalacticdirective_a_voice_for_all:0 "Tiếng nói của Vạn người"
 resolution_intergalacticdirective_a_voice_for_all_desc:0 "Bản đề xuất này sẽ đảm bảo rằng mỗi thành viên của Cộng đồng Thiên hà đều có thể lên tiếng về tương lai của đế quốc mình."

 resolution_intergalacticdirective_repeal_1:0 "§RBãi bỏ $resolution_intergalacticdirective_regulated_growth$§!"
 resolution_intergalacticdirective_repeal_1_desc:0 "Mặc dù việc một đế quốc yêu cầu biên giới của mình được tôn trọng là điều đương nhiên, nhưng các chỉ thị gần đây do Cộng đồng Thiên hà ban hành để cưỡng chế thực thi đã trở nên có phần quá đáng và quá cứng nhắc. Để đảm bảo hệ thống quan liêu có thể vận hành trôi chảy, đã đến lúc phải bãi bỏ một số mệnh lệnh trong đó."
 resolution_intergalacticdirective_repeal_2:0 "§RBãi bỏ $resolution_intergalacticdirective_ensured_sovereignty$§!"
 resolution_intergalacticdirective_repeal_2_desc:0 "$resolution_intergalacticdirective_repeal_1_desc$"
