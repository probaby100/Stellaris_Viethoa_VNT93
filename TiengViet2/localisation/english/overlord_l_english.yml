 resolution_defenseprivatization_repeal_2_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_defenseprivatization_private_support_troops$§!, giữ lại nghị quyết §Y$resolution_defenseprivatization_defense_contracts$§! thành luật của thiên hà."
