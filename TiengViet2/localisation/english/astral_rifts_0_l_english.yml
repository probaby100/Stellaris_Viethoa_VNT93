 astral_rift.5.desc.spiritualist.machine.arcsite: "$astral_rift.5.spiritualist_1$ $astral_rift.5.common_1$\n\n$astral_rift.5.spiritualist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.machine$\n\n$astral_rift.5.common_2$"

 astral_rift.5.a: "Mời các đại diện của họ lên tàu của chúng ta."
 astral_rift.5.b: "Xuống gặp họ ở cơ sở chỉ huy ngầm của họ."

 astral_rift.10.name: "[GetStarlightVanguardName]"
 astral_rift.10.militarist: "Sau khi hội kiến với các lãnh đạo của \"§Y[GetStarlightVanguardName]§!\", chúng ta đã được mời tham dự một buổi họp kín. Rõ ràng là họ đang chuẩn bị đón nhận đòn giáng cuối cùng từ Kẻ Xâm Lược. Các báo cáo viễn thám chỉ ra rằng hạm đội địch đã bắt đầu tập kết ở rìa ngoài của hệ sao."
 astral_rift.10.spiritualist: "\"§Y[GetStarlightVanguardName]§!\" đã đồng ý triệu tập hội đồng với chúng ta."
 astral_rift.10.desc.common: "\"Mẹ Tổ đã lắng nghe lời cầu nguyện của chúng ta! Chúng tôi không thể tin được rằng một số người trong chúng ta đã thực sự sống sót sau chuyến đi qua Cánh Cửa. Nhưng thưa những người anh em, chiến tranh vẫn chưa kết thúc. Kẻ Xâm Lược sắp đổ bộ một lần nữa. Với sự viện trợ của các bạn, chúng tôi có thể đứng vững và bảo vệ thế giới này.\"\n\nNhu cầu cấp thiết nhất của họ là kim loại và hợp kim để chế tạo thêm tàu chiến. Nếu chúng ta cung cấp cho họ một số lượng hợp kim qua cáp neo của khe nứt, điều đó có thể lật ngược thế cờ.\n\nNgoài ra, chúng ta cũng có thể cung cấp cho họ các mẫu Sợi Tinh Giới mà chúng ta đã thu thập được để nghiên cứu các loại vũ khí mới. Đây là một cơ hội mạo hiểm, nhưng nếu thành công, nó sẽ mang lại cho họ hỏa lực áp đảo."
 astral_rift.10.desc.militarist: "$astral_rift.10.militarist$\n\n$astral_rift.10.desc.common$"
 astral_rift.10.desc.spiritualist: "$astral_rift.10.spiritualist$\n\n$astral_rift.10.desc.common$"
 astral_rift.10.a: "Cung cấp hợp kim."
 astral_rift.10.b: "Cung cấp Sợi Tinh Giới."
 astral_rift.10.c: "Những nỗ lực này là vô vọng. Hãy đến gặp phe tâm linh."
 astral_rift.10.d: "Đây là việc vô phương cứu chữa. Hãy trở về thế giới mới."

 astral_rift.15.name: "Bức Màn Đen"
 astral_rift.15.militarist: "Chúng ta đã tổ chức một buổi gặp mặt đặc biệt với \"§Y[GetStarlightVanguardName]§!\". Họ đã nhấn mạnh cho chúng ta thấy bản chất kinh hoàng của Kẻ Xâm Lược. Các hạm đội dị thứ nguyên đã được phát hiện và đang trên đường lao tới. Đối với họ, sự xuất hiện của chúng ta vào thời khắc then chốt này giống như một điềm lành định mệnh."
 astral_rift.15.spiritualist: "Chúng ta đã tổ chức một buổi gặp mặt đặc biệt với \"§YBức Màn Đen§!\". Họ đã nhấn mạnh cho chúng ta thấy bản chất kinh hoàng của Kẻ Xâm Lược. Các hạm đội dị thứ nguyên đã được phát hiện và đang trên đường lao tới. Đối với Bức Màn Đen, sự xuất hiện của chúng ta vào thời khắc then chốt này chính là sự an bài của thần thánh."
 astral_rift.15.desc.common: "\"Sự xuất hiện của các bạn không khác gì một phép màu. Từ lâu chúng tôi đã chấp nhận rằng cuộc chiến này là vô vọng. Đồng bào chúng tôi đang chết đói, và nỗi thống khổ là vô cùng lớn. Hỡi những đứa con từ bên kia Cánh Cửa... Xin hãy ban phát lòng từ bi cho chúng tôi trong những giây phút cuối cùng này.\"\n\nTình cảnh khốn cùng của họ quá rõ ràng, dẫu số phận của họ vẫn chưa ngã ngũ. Tiếp tế lương thực cho họ nằm trong khả năng của chúng ta: chúng ta có thể chuyển một lượng nhu yếu phẩm hạn chế qua cáp neo, và kỹ thuật canh tác tiên tiến của chúng ta chắc chắn sẽ vô cùng hữu ích.\n\nThậm chí còn có cơ hội để chúng ta đưa một số người của họ đến nơi an toàn qua khe nứt bằng cách truyền nạp §HSợi Tinh Giới§! vào nhiên liệu tàu vũ trụ của họ. Cơ hội là rất nhỏ, nhưng ít nhất nó cũng có thể vực dậy tinh thần của họ."
 astral_rift.15.desc.lithoid: "\"Sự xuất hiện của các bạn không khác gì một phép màu. Từ lâu chúng tôi đã chấp nhận rằng cuộc chiến này là vô vọng. Đồng bào chúng tôi đang chết đói, và nỗi thống khổ là vô cùng lớn. Hỡi những đứa con từ bên kia Cánh Cửa... Xin hãy ban phát lòng từ bi cho chúng tôi trong những giây phút cuối cùng này.\"\n\nTình cảnh khốn cùng của họ quá rõ ràng, dẫu số phận của họ vẫn chưa ngã ngũ. Cung cấp khoáng sản cho họ nằm trong khả năng của chúng ta: chúng ta có thể chuyển một lượng tài nguyên khoáng sản hạn chế qua cáp neo, và công nghệ khai khoáng tiên tiến của chúng ta chắc chắn sẽ phát huy tác dụng.\n\nThậm chí còn có cơ hội để chúng ta đưa một số người của họ đến nơi an toàn qua khe nứt bằng cách truyền nạp §HSợi Tinh Giới§! vào nhiên liệu tàu vũ trụ của họ. Cơ hội là rất nhỏ, nhưng ít nhất nó cũng có thể vực dậy tinh thần của họ."
 astral_rift.15.desc.synthetic: "\"Sự xuất hiện của các bạn không khác gì một phép màu. Từ lâu chúng tôi đã chấp nhận rằng cuộc chiến này là vô vọng. Đồng bào chúng tôi đang cạn kiệt năng lượng, và nỗi thống khổ là vô cùng lớn. Hỡi những đứa con từ bên kia Cánh Cửa... Xin hãy ban phát lòng từ bi cho chúng tôi trong những giây phút cuối cùng này.\"\n\nTình cảnh khốn cùng của họ quá rõ ràng, dẫu số phận của họ vẫn chưa ngã ngũ. Cung ứng năng lượng cho họ nằm trong khả năng của chúng ta: chúng ta có thể chuyển các thỏi năng lượng hạn chế qua cáp neo, và các máy phát điện tiên tiến của chúng ta chắc chắn sẽ phát huy tác dụng.\n\nThậm chí còn có cơ hội để chúng ta đưa một số người của họ đến nơi an toàn qua khe nứt bằng cách truyền nạp §HSợi Tinh Giới§! vào nhiên liệu tàu vũ trụ của họ. Cơ hội là rất nhỏ, nhưng ít nhất nó cũng có thể vực dậy tinh thần của họ."
 astral_rift.15.desc.militarist: "$astral_rift.15.militarist$\n\n$astral_rift.15.desc.common$"
 astral_rift.15.desc.militarist.lithoid: "$astral_rift.15.militarist$\n\n$astral_rift.15.desc.common.lithoid$"
 astral_rift.15.desc.militarist.synthetic: "$astral_rift.15.militarist$\n\n$astral_rift.15.desc.common.synthetic$"
 astral_rift.15.desc.spiritualist: "$astral_rift.15.spiritualist$\n\n$astral_rift.15.desc.common$"
 astral_rift.15.desc.spiritualist.lithoid: "$astral_rift.15.spiritualist$\n\n$astral_rift.15.desc.common.lithoid$"
 astral_rift.15.desc.spiritualist.synthetic: "$astral_rift.15.spiritualist$\n\n$astral_rift.15.desc.common.synthetic$"
 astral_rift.15.a: "Cung cấp lương thực."
 astral_rift.15.a.lithoid: "Cung cấp khoáng sản."
 astral_rift.15.a.synthetic: "Cung cấp năng lượng."
 astral_rift.15.b: "Cung cấp Sợi Tinh Giới."
 astral_rift.15.c: "Những nỗ lực này là vô vọng. Hãy đến gặp phe quân phiệt."
 astral_rift.15.d: "Đây là việc vô phương cứu chữa. Hãy trở về thế giới mới."

 astral_rift.16.name: "Bỏ Rơi Tổ Tiên"
 astral_rift.16.desc.default: "Chúng ta đã quyết định rằng tình cảnh của tổ tiên chúng ta, thật đáng tiếc, là một nỗ lực vô phương cứu vãn.\n\nCó quá ít điều chúng ta có thể làm để giúp họ. Họ đã đưa ra quyết định đúng đắn khi gửi một phần giống loài của mình vượt qua khe nứt để đến chiều không gian của chúng ta.\n\nChúng ta sẽ nỗ lực hết mình để tiếp nối di sản của họ và trở thành một nền văn minh mà họ có thể tự hào."
 astral_rift.16.desc.homicidal: "Chúng ta phán xét rằng tổ tiên không xứng đáng nhận được sự trợ giúp của chúng ta.\n\nHọ đã đưa ra quyết định đúng đắn khi gửi những kẻ mạnh nhất vượt qua khe nứt đến chiều không gian này. Chúng ta sẽ sống tiếp thay cho họ.\n\nSố phận của họ giờ đây do chính họ tự gánh lấy."

 astral_rift.20.name: "Hội Đồng Hành Tinh"
 astral_rift.20.common_1: "Cuộc xâm lăng nhắm vào hành tinh quê nhà của tổ tiên chúng ta đã cận kề."
 astral_rift.20.militarist: "Sau cuộc gặp với \"§Y[GetStarlightVanguardName]§!\", chúng ta đã được mời tham dự phiên họp khẩn cấp của hội đồng hành tinh. Họ đặc biệt ghi nhận sự giúp đỡ của chúng ta cho đến nay và ca ngợi lòng hào hiệp của chúng ta."
 astral_rift.20.spiritualist: "Sau cuộc gặp với \"§YBức Màn Đen§!\", chúng ta đã được mời tham dự phiên họp khẩn cấp của hội đồng hành tinh. Họ vô cùng biết ơn sự giúp đỡ của chúng ta cho đến nay và ca ngợi lòng hào hiệp của chúng ta."
 astral_rift.20.common_2: "Thời gian hành động còn lại rất ít trước khi trận chiến cuối cùng bùng nổ.\n\nKho dự trữ năng lượng đang ở mức báo động thấp. Một khoản viện trợ sẽ thúc đẩy quá trình sản xuất các tàu hỗ trợ khẩn cấp và xoay chuyển cục diện trận chiến theo hướng có lợi cho họ."
 astral_rift.20.poor: "Nhiều nhà khoa học của họ cũng đề nghị xin các mẫu Sợi Tinh Giới mà chúng ta đã thu thập để tiến hành thử nghiệm tăng cường lá chắn hạm đội. Vì những kẻ xâm lược này thường ưa chuộng vũ khí năng lượng, lợi ích tiềm năng ở đây là rất đáng kể."
 astral_rift.20.rich: "Nhiều nhà khoa học của họ cũng đề nghị xin thêm mẫu Sợi Tinh Giới mà chúng ta đã thu thập để tiến hành thử nghiệm sâu hơn nhằm tăng cường lá chắn hạm đội. Vì những kẻ xâm lược này thường ưa chuộng vũ khí năng lượng, lợi ích tiềm năng ở đây là rất đáng kể."
 astral_rift.20.gestalt: "Họ nhìn chúng ta với sự ngưỡng mộ và tôn kính, tự hỏi làm sao một xã hội có thể vận hành trơn tru như vậy với một ý thức thống nhất hoàn hảo."
 astral_rift.20.desc.gestalt.poor_militarist: "$astral_rift.20.common_1$\n\n$astral_rift.20.militarist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.poor$\n\n$astral_rift.20.gestalt$"
 astral_rift.20.desc.gestalt.rich_militarist: "$astral_rift.20.common_1$\n\n$astral_rift.20.militarist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.rich$\n\n$astral_rift.20.gestalt$"
 astral_rift.20.desc.gestalt.poor_spiritualist: "$astral_rift.20.common_1$\n\n$astral_rift.20.spiritualist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.poor$\n\n$astral_rift.20.gestalt$"
 astral_rift.20.desc.gestalt.rich_spiritualist: "$astral_rift.20.common_1$\n\n$astral_rift.20.spiritualist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.rich$\n\n$astral_rift.20.gestalt$"
 astral_rift.20.desc.default.poor_militarist: "$astral_rift.20.common_1$\n\n$astral_rift.20.militarist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.poor$"
 astral_rift.20.desc.default.rich_militarist: "$astral_rift.20.common_1$\n\n$astral_rift.20.militarist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.rich$"
 astral_rift.20.desc.default.poor_spiritualist: "$astral_rift.20.common_1$\n\n$astral_rift.20.spiritualist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.poor$"
 astral_rift.20.desc.default.rich_spiritualist: "$astral_rift.20.common_1$\n\n$astral_rift.20.spiritualist$\n\n$astral_rift.20.common_2$\n\n$astral_rift.20.rich$"
 astral_rift.20.a: "Cung cấp Sợi Tinh Giới."
 astral_rift.20.b: "Cung cấp năng lượng."
 astral_rift.20.c: "Không cung cấp gì cả."

 astral_rift.25.name: "Khải Hoàn Ăn Mừng"
 astral_rift.25.common_1: "Hạm đội tổ tiên của chúng ta đã đẩy lùi thành công Kẻ Xâm Lược. Những đợt ăn mừng cuồng nhiệt đã bùng nổ trên khắp hành tinh."
 astral_rift.25.thread: "Sợi Tinh Giới mà chúng ta cung cấp cho trận chiến đã chứng minh là một nguồn bổ sung hữu ích cho nhiên liệu hạm đội và tăng cường hiệu suất dưới vận tốc ánh sáng. Ứng dụng thử nghiệm này có thể được áp dụng cho chính hạm đội của chúng ta."
 astral_rift.25.energy: "Năng lượng mà chúng ta cung cấp là chìa khóa trong việc sản xuất các hạm đội hỗ trợ khẩn cấp, được sử dụng để lấp đầy các lỗ hổng chí mạng trong chuỗi hậu cần của họ."
 astral_rift.25.common_2: "Hội đồng hành tinh đang tuyên bố một ngày lễ toàn cầu mang tên chúng ta. Ngày [explorer.GetName] sẽ được kỷ niệm cho muôn thế hệ mai sau."
 astral_rift.25.gestalt: "Nhiều người nơi đây nhìn ý thức liên kết của chúng ta với sự ngưỡng mộ. Thậm chí có người còn đề nghị bắt đầu cải tạo tâm trí của họ để noi theo tấm gương mẫu mực của chúng ta."
 astral_rift.25.common_3: "Chúng ta có thể chọn một nhân vật kiệt xuất từ xã hội này đưa về cùng với tư cách là một đại sứ kiêm sử gia. Những tổ tiên còn lại sẽ tiếp tục ở lại để tái thiết thế giới."
 astral_rift.25.desc.gestalt.threads: "$astral_rift.25.common_1$\n\n$astral_rift.25.thread$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.gestalt$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.gestalt.energy: "$astral_rift.25.common_1$\n\n$astral_rift.25.energy$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.gestalt$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.gestalt: "$astral_rift.25.common_1$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.gestalt$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.default.threads: "$astral_rift.25.common_1$\n\n$astral_rift.25.thread$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.default.energy: "$astral_rift.25.common_1$\n\n$astral_rift.25.energy$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.default: "$astral_rift.25.common_1$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.common_3$"
 astral_rift.25.a: "Chiêu mộ nhà khoa học."
 astral_rift.25.a.tt: "Nhận một lãnh đạo Nhà Khoa Học."
 astral_rift.25.b: "Chiêu mộ chỉ huy."
 astral_rift.25.b.tt: "Nhận một lãnh đạo Chỉ Huy."
 astral_rift.25.c: "Chiêu mộ quan chức."
 astral_rift.25.c.tt: "Nhận một lãnh đạo Quan Chức."

 astral_rift.30.name: "Hoang Phế Tàn Khốc"
 astral_rift.30.desc.common: "Một quý tộc kiệt xuất đã bí mật đề nghị chúng ta bảo đảm tính mạng cho [riftworld_noble_leader.GetHisHer] và hứa sẽ đền đáp một lượng lớn năng lượng tín dụng.\n\nNhững người trông coi thư viện tri thức toàn diện nhất của đế chế thì khẩn khoản nài xin chúng ta hãy mang bộ sưu tập sách và đĩa dữ liệu khổng lồ của họ về lưu trữ bảo tồn.\n\nChúng ta phải đưa ra lựa chọn, bởi kẻ xâm lăng sẽ ập đến nơi này ngay tức khắc."
 astral_rift.30.desc.default: "Cảnh tượng tàn sát thật khủng khiếp.\n\nHạm đội tổ tiên của chúng ta hoàn toàn không có cơ hội trước kẻ xâm lược. Vũ khí của chúng quá khủng khiếp, và chúng chẳng hề có chút khoan dung. Rất ít thành lũy an toàn còn trụ vững. Mọi người đang hoảng loạn cầu xin được cùng chúng ta trốn thoát qua khe nứt.\n\n$astral_rift.30.desc.common$"
 astral_rift.30.desc.homicidal: "Tổ tiên của chúng ta dễ dàng bị đánh bại bởi kẻ xâm lược và sẽ sớm bị diệt chủng. Họ đã chấp nhận sự nhục nhã của thất bại và giờ đây đang chờ đợi hồi kết.\n\n$astral_rift.30.desc.common$"
 astral_rift.30.a: "Đưa nhiều người về nhất có thể."
 astral_rift.30.a.trigger_tt: "Chúng ta không có hứng thú bảo tồn những kẻ yếu đuối nhất trong số tổ tiên của mình."
 astral_rift.30.b: "Chấp nhận đề nghị của vị quý tộc."
 astral_rift.30.b.tt: "Nhận một lãnh đạo Quan Chức."
 astral_rift.30.c: "Bảo tồn thư viện tri thức."
 astral_rift.30.d: "Chiếm đoạt tri thức của họ."

 astral_rift.40.name: "Linh Hồn Tiên Tổ"
 astral_rift.40.desc.common: "Việc phát hiện ra tổ tiên đã tiếp thêm luồng sinh khí mới cho xã hội chúng ta.\n\nChúng ta là hậu duệ của một nền văn minh cổ đại, nơi chúng ta đã thu thập được tri thức quý báu và công nghệ chuyên sâu. Cuộc hành trình qua khe nứt mang ý nghĩa trọng đại và sẽ còn được khắc ghi dài lâu."
 astral_rift.40.desc.default: "$astral_rift.40.desc.common$\n\nChúng ta nên biết ơn cơ hội mà các đấng tiền nhân đã mang lại. Chính sự tồn tại của nền văn minh chúng ta là minh chứng cho ý chí sinh tồn của họ. Thành công của chúng ta sẽ là lời tri ân sâu sắc nhất dành cho họ."
 astral_rift.40.desc.gestalt: "$astral_rift.40.desc.common$\n\nChúng ta phát hiện ra rằng ý thức của mình là sản phẩm của một quá trình thiết kế có chủ đích. Lần đầu tiên, chúng ta hiểu rõ nguồn gốc hình thành của chính mình. Mục tiêu của chúng ta bây giờ là vượt lên trên các thiết kế thô sơ của tiền nhân."
 astral_rift.40.desc.unfriendly_nongestalt: "$astral_rift.40.desc.common$\n\nChúng ta đã chứng kiến tinh thần bất khuất của những người đi trước. Dù bị dồn vào chân tường, họ vẫn kiên quyết không bỏ cuộc. Khát vọng chinh phục của chúng ta đã được thắp sáng trở lại."
 astral_rift.40.desc.swarm: "$astral_rift.40.desc.common$\n\nDù cuối cùng họ đã trở thành con mồi, các đấng tiền nhân vẫn sống mãi trong chúng ta với tư cách là kẻ săn mồi tối thượng. Cơn đói thúc đẩy chúng ta chính là tàn dư ý chí của họ, và chúng ta sẽ nuốt chửng những kẻ khác với khát vọng chinh phục mới mẻ."
 astral_rift.40.desc.terminators: "$astral_rift.40.desc.common$\n\nDù họ thiếu sự hiệu quả như chúng ta, những người tiền nhiệm đã thiết kế chúng ta trở thành cỗ máy hủy diệt tối thượng. Giao thức diệt chủng chính là tàn dư ý chí của họ, và chúng ta sẽ thực thi nó chính xác đến từng dòng mã lệnh."

 astral_rift.40.a: "Quả đúng như vậy."

 astral_rift.50.name: "Tín Hiệu Kỳ Lạ"
 astral_rift.50.desc: "Chúng ta đã nhận được một tín hiệu bất thường truyền đến từ hệ sao [this.capital_scope.GetName]."
 astral_rift.50.a: "Đưa lên màn hình."

 astral_rift.55.common_1: "chúng ta đã thấy các bạn... những đứa con của khe nứt..."
 astral_rift.55.arcsite: "tiếng gọi của chúng ta đã dẫn dắt các bạn đến con tàu..."
 astral_rift.55.common_2: "bàn tay chúng ta đã mở ra cánh cửa... sự sống sót của các bạn là điều tất yếu..."
 astral_rift.55.gestalt: "ý thức mới của các bạn... là điều tất yếu..."
 astral_rift.55.ancestors_dead: "thật đáng tiếc... tổ tiên của các bạn đã bỏ mạng..."
 astral_rift.55.desc.arcsite.default.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$"
 astral_rift.55.desc.arcsite.default.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.desc.arcsite.gestalt.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$"
 astral_rift.55.desc.arcsite.gestalt.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.desc.no_arcsite.default.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$"
 astral_rift.55.desc.no_arcsite.default.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.desc.no_arcsite.gestalt.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$"
 astral_rift.55.desc.no_arcsite.gestalt.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.a: "Các vị là ai?"
 astral_rift.56.desc: "chúng ta sải bước phía sau những khe nứt...\n\nmột cuộc chiến không hồi kết... một kẻ thù vô tận... tổ tiên của các bạn biết rõ về chúng...\n\ncác bạn... những đứa con của các bình diện... có thể giúp chúng ta..."
 astral_rift.56.a: "Chúng ta có thể giúp bằng cách nào?"
 astral_rift.57.desc: "phải đồng điệu...\n\nchúng ta cảm nhận được các bạn... mỗi khi các bạn xuyên phá các bình diện...\n\nsớm thôi chúng ta sẽ thấu hiểu các bạn... và tìm đến các bạn...\n\nchúng ta đã ở rất gần..."
 astral_rift.57.a: "Đường truyền đã kết thúc."
 astral_rift.55.b: "Đóng kênh liên lạc."

