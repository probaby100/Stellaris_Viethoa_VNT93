l_english:

#################
# Ruined Planet #
#################
 astral_rift_riftworld: "Hành Tinh Hoang Tàn"

 riftworld_leader_description: "Được đưa trở về từ phía bên kia Khe Nứt Tinh Giới gần hành tinh quê nhà của chúng ta, §Y[Root.GetName]§! là thành viên thuộc thế giới quê hương tổ tiên trong một chiều không gian song song."
 spirit_of_ancestors_modifier: "Linh Hồn Tiên Tổ"
 spirit_of_ancestors_modifier_desc: "Cuộc hội ngộ với cội nguồn ngoài tinh giới đã mang lại cho chúng ta sự thấu hiểu sâu sắc hơn về toàn bộ tiềm năng của chính mình."

 starlight_vanguard_default: "Tiên Phong Ánh Tinh"
 starlight_vanguard_homicidal: "Kẻ Chinh Phạt Ánh Tinh"

 astral_rift.1.name: "Hành Tinh Hoang Tàn"
 astral_rift.1.desc.common.1: "Hành trình tiến vào khe nứt gần [explorer.capital_scope.GetName] đã đưa chúng ta vào quỹ đạo của một hành tinh đổ nát hoang tàn.\n\nNgay khi tiến vào bầu khí quyển, một khung cảnh chi chít những hố bom còn đang bốc cháy đập vào mắt chúng ta. Rải rác khắp nơi, những chiến hạm nằm vùi một nửa thân mình trong cát bụi. Thế giới này thực chất là một bãi chiến trường.\n\nNhững tín hiệu vô tuyến chặn thu được vô cùng hỗn loạn và khiến lòng người bất an. Thật khó tin,"
 astral_rift.1.desc.no_arcsite: "cư dân nơi đây dường như đang giao tiếp bằng một dị bản cổ xưa thuộc chính ngôn ngữ của chúng ta."
 astral_rift.1.desc.with_arcsite: "ngôn ngữ của cư dân nơi đây hoàn toàn trùng khớp với các văn kiện mà chúng ta từng thu hồi từ khối cầu cổ đại bên dưới [explorer.capital_scope.GetName]."
 astral_rift.1.desc.common.2: "Các bản dịch sơ bộ chỉ ra rằng những người này đang đứng ở phe bại trận trong một cuộc xung đột kéo dài đằng đẵng. Kẻ thù của họ, được gọi đơn giản là \"Những Kẻ Xâm Lược\", đang chuẩn bị cho một đợt tấn công mới. Xét đến mức độ tàn phá trên hành tinh này, đó rất có thể sẽ là đòn đánh cuối cùng."
 astral_rift.1.desc.default: "$astral_rift.1.desc.common.1$ $astral_rift.1.desc.no_arcsite$\n\n$astral_rift.1.desc.common.2$"
 astral_rift.1.desc.completed_arcsite: "$astral_rift.1.desc.common.1$ $astral_rift.1.desc.with_arcsite$\n\n$astral_rift.1.desc.common.2$"
 astral_rift.1.a: "Tìm kiếm những người còn sống sót."

 astral_rift.3.name: "Các Phe Phái Đối Lập"
 astral_rift.3.desc.default: "Có vài trung tâm dân cư lớn trên bề mặt hành tinh. Dựa vào các tín hiệu truyền phát, chúng ta đã xác định được hai phe phái ý thức hệ rõ rệt.\n\n§Y[GetStarlightVanguardName]§! là những kẻ quân phiệt kiên định, đang chuẩn bị cho cuộc xung đột sắp tới với ý chí đồng lòng sắt đá.\n\n§YBức Màn Đen§! là một giáo hội tâm linh, hứa hẹn mang lại nơi trú ẩn tinh thần trước mối hiểm họa đang rình rập.\n\nĐến lúc này, chúng ta dám chắc rằng sự tương đồng trong ngôn ngữ không thể chỉ là trùng hợp ngẫu nhiên. Đây chính là những tổ tiên còn sống của chúng ta, và cả hai phe phái đều đang cận kề miệng vực diệt vong."
 astral_rift.3.desc.hive: "$astral_rift.3.desc.default$\n\nNhững người này dùng chung ngôn ngữ với chúng ta. Cấu tạo cơ thể họ gần như giống hệt chúng ta. Thế nhưng họ lại sở hữu tâm trí riêng rẽ của từng cá thể. Sao có thể như vậy được?"
 astral_rift.3.desc.machine: "Đây là những đơn vị cá thể độc lập! Hoàn toàn khác với một ý thức mạng lưới, mỗi một cá nhân đều có năng lực xử lý và khả năng ra quyết định riêng. Có vài trung tâm dân cư lớn trên bề mặt hành tinh. Dựa vào tín hiệu truyền phát, chúng ta đã xác định được hai phe phái ý thức hệ riêng biệt.\n\n§Y[GetStarlightVanguardName]§! là những kẻ quân phiệt kiên định, chuẩn bị cho cuộc chiến sắp tới bằng một ý chí đồng lòng sắt đá.\n\n§YBức Màn Đen§! là một giáo hội tâm linh, hứa hẹn một nơi trú ẩn tinh thần trước hiểm họa cận kề.\n\nNhững đấng tiền nhân của chúng ta đang đối mặt với nguy cơ bị xóa sổ hoàn toàn."
 astral_rift.3.a: "Đến gặp §Y[GetStarlightVanguardName]§!."
 astral_rift.3.b: "Đến gặp §YBức Màn Đen§!."
 astral_rift.3.b.trigger_tt: "Chúng ta chẳng hề có hứng thú đàm đạo với những kẻ yếu đuối."

 astral_rift.5.name: "Tổ Tiên Thất Lạc"
 astral_rift.5.militarist_1: "Chúng ta đã mở kênh đối thoại với phe phái quân phiệt tự xưng là \"§Y[GetStarlightVanguardName]§!\"."
 astral_rift.5.spiritualist_1: "Chúng ta đã mở kênh đối thoại với phe phái duy linh tự xưng là \"§YBức Màn Đen§!\"."
 astral_rift.5.common_1: "Ngôn ngữ, diện mạo của chúng ta, cùng với sự hiện diện của một §Y$tech_rift_sphere$§!, đã nhanh chóng thuyết phục họ về nguồn cội chung giữa hai bên. Trong sự khát khao giao tiếp tột cùng, họ đã tiết lộ nhiều điều về lịch sử của chúng ta.\n\nThuở xa xưa, giống loài của chúng ta đã phải đối mặt với một hiểm họa từ dị thứ nguyên. Những kẻ xâm lược kéo đến để phát động một chiến dịch diệt chủng tàn bạo. Ban đầu, nhân dân chúng ta kiên cường chống trả, nhưng theo năm tháng, các phòng tuyến dần dần sụp đổ.\n\nNgay trước thềm thất bại hoàn toàn, một Khe Nứt Tinh Giới đã xuất hiện."
 astral_rift.5.militarist_2: "Chiến dịch \"Thuyền Cứu Sinh\" đã được phát động trong nỗ lực đào thoát qua khe nứt nhằm bảo tồn những gì còn sót lại của nền văn minh."
 astral_rift.5.spiritualist_2: "\"Cánh Cửa Phép Màu\" này được xem là cơ hội cuối cùng để trốn thoát và bảo tồn lối sống cùng di sản của họ."
 astral_rift.5.no_arcsite: "Một §Y$tech_rift_sphere$§! đã được chế tạo, nhưng thiết kế thô sơ thời bấy giờ chỉ cho phép thực hiện một chuyến du hành một chiều duy nhất."
 astral_rift.5.arcsite: "$astral_rift.5.no_arcsite$ Đây chính là vật thể mà chúng ta đã phát hiện chôn sâu bên trong miệng hố va chạm cổ xưa tại [explorer.capital_scope.GetName]."
 astral_rift.5.default: "Một nhóm người tị nạn được chọn lọc kỹ càng đã được chuẩn bị cho sứ mệnh. Họ chính là tổ tiên trực hệ của chúng ta."
 astral_rift.5.gestalt: "Để có thể sống sót qua cuộc hành trình gian khổ, một nhóm các cá thể tương thích đã được biến đổi triệt để. Tổ tiên chúng ta tin rằng chỉ có một tâm trí thống nhất duy nhất mới mong vượt qua khe nứt mà không bị tổn thương. Đó chính là bình minh của ý thức chúng ta."
 astral_rift.5.machine: "Để sống sót qua cuộc hành trình, những đấng sáng tạo tiền nhiệm đã liên kết tâm trí của họ và loại bỏ mọi cảm xúc. Với tầm nhìn sáng rõ và mục đích hợp nhất, ý thức tập thể của chúng ta đã ra đời."
 astral_rift.5.common_2: "Ở phía bên này của khe nứt, Khối Cầu chỉ mới được phóng đi chưa đầy năm mươi năm trước. Vẫn còn vài người nơi đây nhớ như in ngày hôm ấy. Còn đối với chúng ta, hàng kỷ nguyên đằng đẵng đã trôi qua."
 astral_rift.5.desc.militarist.gestalt.no_arcsite: "$astral_rift.5.militarist_1$ $astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.no_arcsite$\n\n$astral_rift.5.gestalt$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.militarist.gestalt.arcsite: "$astral_rift.5.militarist_1$ $astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.gestalt$\n\n$astral_rift.5.common_2$"
