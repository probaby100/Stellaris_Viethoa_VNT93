 ### Utopia

 UTOPIA_TITLE: "Utopia" # Do not translate
 DLC_UTOPIA_RECOMMENDATION_DESC:1 "Bản mở rộng §S\"Utopia\"§! thêm cơ chế mới, cho phép bạn kiểm soát đế chế chi tiết hơn và xây dựng các siêu cấu trúc."
 DLC_UTOPIA_RECOMMENDATION_REASON_HIVEMIND_REC:1 "Chúng tôi đề xuất §S\"Utopia\"§! vì đặc điểm đế chế này phù hợp với loại hình đế chế mới được mở khóa: Ý thức tập thể."
 DLC_UTOPIA_RECOMMENDATION_REASON_UNIFY_POLICE_REC:1 "Chúng tôi đề xuất §S\"Utopia\"§! vì đặc điểm đế chế này phù hợp với các cơ chế và nội dung về quản lý hoặc đồng hóa dân cư được mở khóa."
 DLC_UTOPIA_RECOMMENDATION_REASON_SLAVERY_REC:1 "Chúng tôi đề xuất §SUtopia§! vì đặc điểm đế chế này phù hợp với các cơ chế và nội dung về quản lý dân cư và tối ưu hóa lao động."

