 dyson_sphere_0_MEGASTRUCTURE_DETAILS:1 "Một §Y$dyson_sphere_5$§! bao bọc hoàn toàn một ngôi sao xác định, trực tiếp chuyển hóa bức xạ phát ra từ ngôi sao thành £energy£ Năng lượng tín dụng."
 dyson_sphere_0_CONSTRUCTION_INFO_DELAYED:4 "§R$dyson_sphere_5$ sẽ che khuất hoàn toàn ngôi sao, khiến mọi hành tinh trong hệ sao biến thành thế giới cằn cỗi hoặc thế giới băng giá.\n\nMọi thiên thể tiềm năng cải tạo môi trường trong hệ sao sẽ không còn có thể cải tạo được nữa.§!"
 dyson_sphere_0:0 "Nền móng Quả cầu Dyson"
 dyson_sphere_0_DESC:0 "Khu vực thi công này đóng vai trò làm nền móng cho việc xây dựng Quả cầu Dyson trong tương lai."
 dyson_sphere_1:0 "Khung Quả cầu Dyson"
 dyson_sphere_1_DESC:0 "Đây là phần khung cơ sở cho Quả cầu Dyson tương lai, hiện vẫn chưa sản xuất bất kỳ năng lượng nào."
 dyson_sphere_2:1 "Quả cầu Dyson: Sơ khởi"
 dyson_sphere_2_DESC:0 "Quả cầu Dyson đang vận hành một phần — hiệu suất sản xuất năng lượng §Y25%§!."
 dyson_sphere_3:1 "Quả cầu Dyson: Bán phần"
 dyson_sphere_3_DESC:0 "Quả cầu Dyson đang vận hành một phần — hiệu suất sản xuất năng lượng §Y50%§!."
 dyson_sphere_4:1 "Quả cầu Dyson: Cận hoàn tất"
 dyson_sphere_4_DESC:0 "Quả cầu Dyson đang vận hành một phần — hiệu suất sản xuất năng lượng §Y75%§!."
 dyson_sphere_5:0 "Quả cầu Dyson"
 dyson_sphere_5_DESC:0 "Quả cầu Dyson đã vận hành toàn diện — hiệu suất sản xuất năng lượng §G100%§!."
