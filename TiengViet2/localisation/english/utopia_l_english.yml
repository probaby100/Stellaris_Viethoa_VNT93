 ring_world_1_MEGASTRUCTURE_DETAILS:1 "Một §Y$pc_ringworld_habitable$§! chứa nhiều phân khu có kích thước tương đương hành tinh, nhưng đòi hỏi phải tháo dỡ các thiên thể hành tinh khác trong hệ sao để làm vật liệu."
 ring_world_1_CONSTRUCTION_INFO_DELAYED:4 "Một thế giới dạng vòng hoàn chỉnh bao gồm 4 phân đoạn thế giới dạng vòng đã xây dựng xong, mỗi phân đoạn tương đương một hành tinh Gaia khổng lồ."
 ring_world_1:0 "Nền móng thế giới dạng vòng"
 ring_world_1_DESC:0 "Cơ sở này sẽ đóng vai trò là điểm tập kết, kho dự trữ tài nguyên và cung cấp khu cư trú cho hàng vạn công nhân xây dựng thế giới dạng vòng."
 ring_world_2_intermediate:0 "Khung thế giới dạng vòng"
 ring_world_2_intermediate_DESC:0 "Cấu trúc khung sơ khởi này bao quanh ngôi sao trong hệ, đóng vai trò làm bệ đỡ để chúng ta hoàn thiện toàn bộ vành đai sinh sống sau này."
 ring_world_2:0 "Khung phân đoạn thế giới dạng vòng"
 ring_world_2_DESC:0 "Cấu trúc khung này về cơ bản chiếm một phần tư tổng diện tích bề mặt của thế giới dạng vòng chưa hoàn chỉnh. Công tác thi công các phân khu sinh sống nhỏ hơn bên trong vẫn chưa hoàn tất."
 ring_world_3_intermediate:0 "Phân đoạn thế giới dạng vòng hoàn chỉnh"
 ring_world_3_intermediate_DESC:0 "Một phân đoạn thế giới dạng vòng đầy đủ chức năng, bao gồm một sinh quyển hoạt động ổn định có thể cư trú được."


 think_tank_0_MEGASTRUCTURE_DETAILS:1 "Các phòng thí nghiệm và cơ sở dữ liệu của §Y$think_tank_3$§! có thể liên tục tạo ra dòng dữ liệu thô bất tận."
 think_tank_0:0 "Nền móng trung tâm khoa học"
 think_tank_0_DESC:0 "Khu nền móng sơ khai này sẽ là bệ móng cho công trình trung tâm khoa học trong tương lai."
 think_tank_1:0 "Lõi trung tâm khoa học"
 think_tank_1_DESC:0 "Lõi trung tâm được trang bị trạm phát điện điểm kỳ dị tối tân, đủ sức đáp ứng mọi nhu cầu năng lượng của trung tâm khoa học. Sau này nó cũng sẽ kết nối với các cơ sở nghiên cứu mới xây dựng."
 think_tank_2:0 "Cánh nghiên cứu trung tâm khoa học"
 think_tank_2_DESC:0 "Cánh nghiên cứu trung tâm khoa học chứa phần lớn các phòng thí nghiệm và cung cấp nơi ở cho các nhà khoa học. Phân khu này được trang bị nhiều khu vực an ninh, sẵn sàng phong tỏa các khu vực riêng biệt khi cần thiết."
 think_tank_3:0 "Trung tâm khoa học"
 think_tank_3_DESC:0 "Một trung tâm khoa học được trang bị đầy đủ và sẵn sàng đi vào vận hành."
 think_tank_4:0 "Trung tâm Groiik"
 think_tank_4_DESC:0 "Được đặt theo tên của người tạo ra nó, lõi vận hành của trung tâm khoa học này kết hợp cùng một ngân hàng thần kinh chứa bộ não của những nhà nghiên cứu kiệt xuất nhất của chúng ta, giúp nó vận hành với tốc độ vượt bậc."
