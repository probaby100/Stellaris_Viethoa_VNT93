 spy_orb_0_DESC:0 "Trạm không gian giàn giáo này sẽ đóng vai trò làm bệ đỡ lắp ráp cho Trận liệt Vọng gác trong tương lai."
 spy_orb_1:0 "Trung tâm Vọng gác"
 spy_orb_1_DESC:0 "Một trạm tiền đồn nghe trộm tối tân được biên chế đầy đủ các nhà thiên văn học chuyên trách và chuyên viên phân tích chiến thuật."
 spy_orb_2:0 "Ngọn tháp Vọng gác"
 spy_orb_2_DESC:0 "Các vây dao động gắn dọc ngọn tháp trung tâm có khả năng phân tách những tín hiệu mờ nhạt nhất khỏi lớp bức xạ nền bao phủ khắp vũ trụ."
 spy_orb_3:0 "Ăng-ten Vọng gác"
 spy_orb_3_DESC:0 "Mảng ăng-ten tĩnh khổng lồ nâng tầm bao phủ lên một quy mô chưa từng có."
 spy_orb_4:0 "Trận liệt Vọng gác"
 spy_orb_4_DESC:0 "Trận liệt Vọng gác hoàn chỉnh có khả năng mở rộng tầm quét ra toàn bộ dải ngân hà."

 #utopia.2001.desc:0 "Word has reached us that the [From.GetName] has undertaken a construction project of monumental proportions in the SYSTEM system. They are building a massive Ring World around the system's primary, and as a first step they have converted the matter of all nearby planetary bodies into the initial metal skeleton of the megastructure.\n\nGiven the staggering size of the project and the immense challenges inherent in creating new habitats and ecosystems from scratch, it will likely be some time before the Ring World is completed."

 15_HOSTILE_GREETING:0 "Cả nước chúng tôi, dưới sự lãnh đạo của [Root.GetRulerTitle], đều coi thường [From.GetSpeciesName]. Thú thật, chỉ nhìn thấy các người là [Root.GetSpeciesOrganName] của tôi đã thấy khó chịu."
 16_HOSTILE_GREETING:0 "[From.GetSpeciesName], với xã hội lỏng lẻo và hỗn loạn của các người thì chẳng đạt được thành tựu gì đâu. Nền văn hóa kiểu đó làm sao sinh ra được một nhà lãnh đạo vĩ đại như [Root.GetRulerTitle] của chúng tôi."
 15_FRIENDLY_GREETING:0 "[From.GetSpeciesName], các người đã để lại ấn tượng sâu sắc cho [Root.GetRulerTitle]. Giờ các người là bạn của [Root.GetName]."

 action.1.f:0 "§E[Root.GetRulerTitle] [Root.GetRulerName] gửi lời chào đến các người, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.g:0 "§EChúng tôi quy phục [Root.GetRulerTitle] [Root.GetRulerName], [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.i:0 "§EChúng tôi theo đuổi sự bình đẳng thực sự —— đừng ngáng đường.§!"
 action.1.ad:0 "§ESự tồn tại thấp kém của các người không đe dọa được [Root.GetRulerTitle] của chúng tôi đâu.§!"
 action.1.ar:1 "§E[Root.GetRulerName] đại diện cho nhân dân [Root.GetAdj] nói chuyện với các người.§!"

 anomaly.168.d.tooltip:2 "Bắt đầu một cuộc phục hưng tôn giáo, sẽ khiến đạo đức của đế chế chuyển sang §YDuy tâm§!."
 precursor.2200.desc.b:0 "Sau khi khảo sát thế giới vành đai khổng lồ ở hệ sao §Y[From.GetStarName]§!, chuyên viên khoa học §Y[Root.GetLeaderName]§! báo cáo rằng ngoài việc rất cổ xưa, cấu trúc thiết kế của nó rất giống với thế giới vành đai của chúng ta.\n\nChỉ có một điểm khác biệt then chốt —— một số kiến trúc của phân khu thế giới vành đai này sử dụng một nguồn tài nguyên mới mà chúng ta chưa biết đến. Báo cáo sơ bộ mô tả thứ này giống như một loại \"kim loại sống\". Dù sao đi nữa, chuyện này cần được nghiên cứu kỹ lưỡng hơn."

 requires_planets_for_material:0 "$TRIGGER_FAIL$Không thể xây trong hệ sao thiếu thiên thể làm nguyên vật liệu."
 requires_no_existing_megastructure:1 "$TRIGGER_FAIL$Đã có siêu cấu trúc, không thể xây."
 requires_stable_star: "$TRIGGER_FAIL$Không thể xây quanh một ngôi sao thiếu ổn định."
 requires_no_orbital_debris:0 "$TRIGGER_FAIL$Quanh quỹ đạo còn vướng mảnh vỡ, không thể xây dựng."
 requires_no_existing_gateway:0 "$TRIGGER_FAIL$Không thể xây trong hệ sao đã có Cổng sao."
 requires_no_orbital_station:1 "$TRIGGER_FAIL$Bị trạm vũ trụ trên quỹ đạo cản trở, không thể xây dựng."
 requires_no_habitable_planets:1 "$TRIGGER_FAIL$Không thể xây trong hệ sao có hành tinh ở được."
 requires_no_consecrated_worlds: "$TRIGGER_FAIL$Không thể phá hủy một $consecrated_world_plural$ của chúng ta."
 requires_no_colonies: "$TRIGGER_FAIL$Không thể xây trong hệ sao đã có khu định cư."
 blocked_by_pre_ftl_policy: "$TRIGGER_FAIL$Cần chính sách $policy_interference$ §Y$interference_aggressive$§! mới có thể xây trong hệ sao có nền văn minh tiền vượt ánh sáng."
 requires_surveyed_system:1 "$TRIGGER_FAIL$Không thể xây trong hệ sao chưa được thăm dò."
 requires_comms_with_owner:1 "$TRIGGER_FAIL$Không thể xây trong hệ sao của bên ta chưa lập liên lạc."
 requires_open_borders_with_owner: "$TRIGGER_FAIL$Không thể xây trong vùng biên giới đang bị đóng cửa."
 requires_inside_border:1 "$TRIGGER_FAIL$Không thể xây ngoài biên giới đế chế."
 requires_inside_border_or_subject:0 "$TRIGGER_FAIL$Không thể xây ngoài biên giới của đế chế hoặc chư hầu."
 must_build_around_star:1 "$TRIGGER_FAIL$Phải xây xung quanh một ngôi sao."
 requires_no_black_hole:1 "$TRIGGER_FAIL$Không thể xây Thế giới Vành đai quanh hố đen."
 requires_no_black_hole_or_dyson_sphere:0 "$TRIGGER_FAIL$Không thể xây trong hệ sao có hố đen hoặc đã có Cầu Dyson."
 requires_borders_survey_no_habitable:1 "$TRIGGER_FAIL$Không thể xây trong hệ sao có hành tinh ở được hay hố đen, cũng như hệ sao chưa thăm dò xong hoặc nằm ngoài biên giới đế chế."
 requires_borders_survey_no_habitable_dyson:1 "$TRIGGER_FAIL$Không thể xây trong hệ sao có hành tinh ở được, hố đen, sao neutron hay sao xung, cũng như hệ sao chưa thăm dò xong hoặc nằm ngoài biên giới đế chế."
 requires_survey_not_habitable:1 "$TRIGGER_FAIL$Không thể xây trên hành tinh chưa thăm dò hoặc hành tinh ở được."
 requires_surveyed_planet:0 "$TRIGGER_FAIL$Không thể xây trên hành tinh chưa được thăm dò."
 requires_not_minor_planetary_body:1 "$TRIGGER_FAIL$Không thể xây trên thiên thể nhỏ (tiểu hành tinh hoặc mặt trăng)."
 requires_not_star:1 "$TRIGGER_FAIL$Không thể xây quanh ngôi sao."
 requires_not_astral_scar: "$TRIGGER_FAIL$Không thể xây gần Vết nứt Cõi sao."
 requires_no_existing_spyorb:0 "$TRIGGER_FAIL$Chỉ có thể xây tối đa một Mạng lưới Do thám."
 requires_no_existing_think_tank:0 "$TRIGGER_FAIL$Chỉ có thể xây tối đa một Đầu mối Khoa học."
 requires_no_existing_dyson_sphere:0 "$TRIGGER_FAIL$Chỉ có thể xây tối đa một Cầu Dyson."
 requires_no_existing_spyorb_two:0 "$TRIGGER_FAIL$Chỉ có thể xây tối đa hai Mạng lưới Do thám."
 requires_no_existing_think_tank_two:0 "$TRIGGER_FAIL$Chỉ có thể xây tối đa hai Đầu mối Khoa học."
 requires_no_existing_dyson_sphere_two:0 "$TRIGGER_FAIL$Chỉ có thể xây tối đa hai Cầu Dyson."
 requires_no_black_hole_neutron_star_pulsar:0 "$TRIGGER_FAIL$Không thể xây quanh hố đen, sao neutron hoặc sao xung."
 requires_no_anomaly:1 "$TRIGGER_FAIL$Không thể xây trên hành tinh có hiện tượng dị thường chưa nghiên cứu."
 requires_not_ring_world:0 "$TRIGGER_FAIL$Không thể xây trên Thế giới Vành đai."
 requires_barren_planet:1 "$TRIGGER_FAIL$Chỉ có thể xây trên hành tinh cằn cỗi."

 progress.3.desc_08:0 "Con tàu khai hoang của chúng ta từ từ đáp xuống vùng đồng cỏ ngút ngàn của §Y[Root.GetName]§!. Không khí nơi đây có phần khô ráo nhưng vẫn rất dễ chịu, và trong lúc tìm điểm hạ cánh, chúng ta còn bắt gặp những bầy thú ăn cỏ hiền lành.\n\nCon tàu nay được sửa thành trung tâm điều hành cho vùng đất mới, còn lõi lò phản ứng đang được tháo ra để làm nguồn năng lượng tạm thời.\n\nHàng trăm túp lều cùng nhà tạm mọc lên quanh thân tàu khổng lồ, khi từng đoàn người đi mở cõi lũ lượt bước xuống — khai sinh thành phố [Root.Owner.GetSpeciesName] đầu tiên trên thế giới xa lạ này."
 progress.3.desc_09:0 "Con tàu của chúng ta đã khéo léo lượn qua những đỉnh núi lởm chởm trên §Y[Root.GetName]§! một cách ngoạn mục, rồi đáp trọn vẹn xuống bãi đáp lý tưởng trong một thung lũng kín gió.\n\nCon tàu nay được sửa thành trung tâm điều hành cho vùng đất mới, còn lõi lò phản ứng đang được tháo ra để làm nguồn năng lượng tạm thời.\n\nHàng trăm túp lều cùng nhà tạm mọc lên quanh thân tàu khổng lồ, khi từng đoàn người đi mở cõi lũ lượt bước xuống — khai sinh thành phố [Root.Owner.GetSpeciesName] đầu tiên trên thế giới xa lạ này."

 fleet_maneuvers_recruitment:0 "Làn sóng tòng quân rầm rộ"
 fleet_maneuvers_recruitment_desc:0 "§LCác cuộc tập trận gần đây đã thắp lên niềm say mê của người dân với hạm đội. Rất nhiều người nô nức xin tòng quân, giúp chúng ta đỡ hao tốn nguồn lực hơn khi tuyển mộ thêm thủy thủ cho các con tàu.§!"
 fleet_maneuvers:0 "Tập trận hạm đội"
 fleet_maneuvers_desc:0 "§LĐợt tập trận hạm đội quy mô lớn vừa qua giúp đội ngũ thủy thủ dày dạn kinh nghiệm hơn hẳn, giúp các tàu chiến giữ vững nhịp bắn nhanh hơn.§!"
 maneuvers_canceled:0 "Hủy tập trận hạm đội"
 maneuvers_canceled_desc:0 "§LPhần lớn các cấp chỉ huy trong hạm đội đều bất bình trước việc ta hủy bỏ đợt tập trận đã lên kế hoạch. Họ xem đây là sự nhút nhát khó lòng chấp nhận và tin chắc rằng các thế lực láng giềng sẽ chớp lấy thời cơ này.§!"
 maneuvers_no_protest:0 "Không phản đối tập trận"
 maneuvers_no_protest_desc:0 "§LĐông đảo tướng sĩ trong quân đội đang nổi cơn thịnh nộ vì ta không có bất kỳ động thái ngoại giao nào để phản đối đợt tập trận hạm đội rầm rộ của ngoại bang ngay sát biên giới.§!"

 standardized_colony_ships:0 "Chuẩn hóa tàu khai hoang"

 opinion_maneuvers_hardline:0 "Tập trận hạm đội"
 opinion_maneuvers_conciliatory:0 "$opinion_maneuvers_hardline$"
 opinion_maneuvers_canceled:0 "Hủy bỏ Diễn tập Hạm đội"

 FLESH_IS_WEAK_PROJECT:0 "Xác thịt yếu hèn"
 FLESH_IS_WEAK_PROJECT_DESC:0 "Thật là một quyết định ngu ngốc khi cứ bám lấy những thứ cũ kỹ, già cỗi trong khi những thứ hiệu quả hơn đã xuất hiện.\n\nTrình độ công nghệ hiện tại cho phép chúng ta áp dụng vật cấy ghép thần kinh cho toàn bộ người dân của [Root.GetName]. Công dân của chúng ta sẽ trở nên mạnh hơn, nhanh hơn và thông minh hơn sau khi các chi và cơ quan được thay thế bằng phiên bản cơ khí cải tiến."
 SYNTHETIC_EVOLUTION_PROJECT:0 "Tiến hóa Tổng hợp"
 SYNTHETIC_EVOLUTION_PROJECT_DESC:0 "Đã đến lúc từ bỏ những cơ quan và mạch máu đầy khiếm khuyết để đón nhận sự bất tử. Chúng ta phải chuẩn bị những thân xác tổng hợp tiên tiến cho toàn bộ dân số, sau đó bắt đầu quá trình truyền tải ý thức."

 TRAIT_IMPROVES_LEADERS:0 "Lãnh đạo thuộc chủng tộc này có thêm đặc tính"

 trait_cybernetic:0 "Cơ khí hóa"
 trait_cybernetic_desc:0 "§LChủng tộc này đã trải qua quá trình cơ khí hóa, với phần lớn thành viên đã trở thành người máy sinh học. Họ định kỳ thay thế các mô hữu cơ của mình bằng các phiên bản máy móc tiên tiến hơn.§!\n"
 TRAIT_CYBORG_EFFECT: "Thay thế §Y50%§! chi phí duy trì $food_with_icon$ (hoặc tương đương) bằng chi phí duy trì $energy_with_icon$\n$t$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!"
 trait_latent_psionic:0 "Tiềm năng Linh năng"
 trait_latent_psionic_desc:0 "§LChủng tộc này sở hữu thiên phú linh năng tiềm tàng, tuy nhiên năng lực này vẫn còn ẩn giấu trong cơ thể của phần lớn thành viên. Dù rất hiếm gặp, nhưng khả năng này sẽ thể hiện rõ ở một số nhà lãnh đạo.§!\n"

 trait_cyborg_power_drills:0 "Mũi khoan Động lực"
 trait_cyborg_power_drills_desc:0 "§LNếu gắn mũi khoan cho người máy sinh học, thì cái gì trông cũng giống như quặng mỏ vậy.§!"
 trait_cyborg_harvesters:0 "Bộ thiết bị Thu hoạch"
 trait_cyborg_harvesters_desc:0 "§LTừ liệu pháp dinh dưỡng, kỹ thuật cân bằng tại chỗ cho đến công nghệ tuốt lúa đơn thanh, bộ công cụ kỹ thuật này giúp tăng sản lượng thực phẩm của lao công cơ khí.§!"
 trait_cyborg_superconductive:0 "Siêu dẫn"
 trait_cyborg_superconductive_desc:0 "§LViệc ứng dụng vật liệu siêu dẫn trong thiết kế đơn vị giúp giảm tổn thất trong quá trình truyền tải năng lượng xuống mức 0%.§!"
 trait_cyborg_efficient_processors:0 "Bộ xử lý Hiệu suất cao"
 trait_cyborg_efficient_processors_desc:0 "§LNhững bộ vi xử lý cực kỳ hiệu quả này giúp tăng cường cường độ và sức bền trong công việc.§!"
 trait_cyborg_logic_engines:0 "Động cơ Logic"
 trait_cyborg_logic_engines_desc:0 "§LĐể chinh phục những ranh giới khoa học ngày càng phức tạp, cần có các bộ vi xử lý song song để tăng cường sức mạnh cho bộ não hữu cơ.§!"
 trait_cyborg_loyalty_circuits:0 "Mạch Trung thành"
 trait_cyborg_loyalty_circuits_desc:0 "§LKhái niệm trung thành chỉ dành cho sinh vật hữu cơ. Nhưng việc tuân lệnh bằng một chương trình đơn giản sẽ hiệu quả hơn nhiều.§!\n"
 trait_cyborg_double_jointed:0 "Khớp kép"
 trait_cyborg_double_jointed_desc:0 "§LNhững đơn vị lao động có thể thu gọn này sở hữu các khớp linh hoạt, cho phép chúng được xếp chồng gọn gàng trong quá trình vận chuyển và tự lắp ráp tại hiện trường.§!\n"
 trait_cyborg_bulky:0 "Cồng kềnh"
 trait_cyborg_bulky_desc:0 "§LNhững siêu máy móc tiên tiến này không được thiết kế để xếp vào thùng rồi vận chuyển khắp vũ trụ.§!\n"
 trait_cyborg_enhanced_memory:0 "Tăng cường Bộ nhớ"
 trait_cyborg_enhanced_memory_desc:0 "§LMọi đơn vị tự động đều được trang bị bộ lưu trữ áp dụng công nghệ cảm ứng từ mới mang tính cách mạng, giúp tăng cường đáng kể hiệu suất của chúng.§!\n"
 trait_cyborg_durable:0 "Bền bỉ"
 trait_cyborg_durable_desc:0 "§LSở hữu khung xương bảo vệ làm từ hợp kim titan mạ crom, những cỗ máy hạng nặng này được thiết kế cho môi trường khắc nghiệt và chỉ cần bảo trì ở mức tối thiểu.§!\n"
 trait_cyborg_high_maintenance:0 "Bảo trì Thường xuyên"
 trait_cyborg_high_maintenance_desc:0 "§LViệc thiết kế những cỗ máy này hoàn toàn không tính đến vấn đề tuổi thọ sử dụng, vì vậy chúng thường xuyên gặp sự cố và cần được bảo trì liên tục.§!\n"
 trait_cyborg_learning_algorithms:0 "Thuật toán Học tập"
 trait_cyborg_learning_algorithms_desc:0 "§LThuật toán tự học phức tạp, có khả năng mô phỏng sự tiến hóa nhanh chóng của các đám rối thần kinh đơn vị.§!\n"
 trait_cyborg_neural_limiters:0 "Bộ giới hạn Thần kinh"
 trait_cyborg_neural_limiters_desc:0 "§LBằng cách giới hạn năng lực nhận thức của lao công, chúng ta có thể thúc đẩy họ tập trung vào những nhiệm vụ đơn giản.§!\n"

 trait_cyborg_custom_made:0 "Chế tác Thủ công"
 trait_cyborg_custom_made_desc:0 "§LMỗi đơn vị mới đều được chế tác tỉ mỉ với sự chú trọng đến từng chi tiết chưa từng có. Đây là một kỳ quan của kỹ thuật và nghệ thuật, nhưng lại thiếu tính hiệu quả.§!\n"
 trait_cyborg_recycled:0 "Tái chế"
 trait_cyborg_recycled_desc:0 "§LQuá trình sản xuất đơn vị được tối ưu hóa để tiết kiệm chi phí nhất có thể, sử dụng nguyên liệu tái chế và các bộ phận kế thừa từ thế hệ trước.§!\n"
 trait_cyborg_streamlined_protocols:0 "Giao thức Tối ưu"
 trait_cyborg_streamlined_protocols_desc:0 "§LViệc xử lý bằng AI theo lô giúp các đơn vị này có thể hoạt động theo cụm quy mô cực lớn mà chỉ gây tổn thất hiệu suất ở mức tối thiểu.§!"
 trait_cyborg_high_bandwidth:0 "Băng thông rộng"
 trait_cyborg_high_bandwidth_desc:0 "§LMỗi đơn vị cá thể đều gửi và nhận một lượng lớn dữ liệu lặp lại, khiến độ trễ tăng theo cấp số nhân khi số lượng đơn vị phụ thuộc vào mỗi bộ xử lý trung tâm tăng lên.§!"
 trait_cyborg_trading_algorithms:0 "Thuật toán Thương mại"
 trait_cyborg_trading_algorithms_desc:0 "§LCác thuật toán dự báo cho phép đạt được sự tối ưu hóa tối đa. Mọi biến động cực nhỏ trên thị trường, từ tỷ lệ lưu thông, tình trạng kho bãi cho đến phản ứng cảm xúc của khách hàng hữu cơ đều được đưa vào tính toán.§!"
 trait_cyborg_power_intensive:0 "Ngốn Năng lượng"
 trait_cyborg_power_intensive_desc:0 "§LNhững bộ phận cơ khí này cần được sạc thường xuyên từ nguồn điện bên ngoài.§!"
 TRAIT_POWER_INTENSIVE_EFFECT:0 "Tăng chi phí duy trì $r_energy$ thêm §R+1§!"

 trait_psionic:0 "Linh năng"
 trait_psionic_desc: "[This.GetPsionicTraitDesc]"
 trait_self_modified:0 "Tự Biến đổi"
 trait_self_modified_desc:0 "§LCác cá thể của phân loài này đã tự ý sửa đổi trình tự gen của bản thân với hy vọng mang lại cho chính họ một lợi thế nhất định nào đó.§!"

 leader_trait_shroud_age:0 "Kéo dài Tuổi thọ"
 leader_trait_shroud_age_desc: "Nguồn sức mạnh linh năng mạnh mẽ từ Cõi Màn Sương đã làm chậm tiến trình [GetAgingLoc] tự nhiên của [GetLeaderLoc] này."

 leader_trait_reformer:0 "Nhà Cải cách"
 leader_trait_reformer_desc:0 "Vị lãnh đạo này là một nhà cải cách, tận tâm xây dựng một xã hội tương lai tốt đẹp hơn."

 leader_trait_ruler_hive_mind:0 "[owner.GetRulerTitle]"
 leader_trait_ruler_hive_mind_desc:1 "Nhà lãnh đạo này là sợi dây liên kết bất tử cấu thành nên hệ thống nhận thức khổng lồ của [owner.GetGestaltEntityName]."

 ASCENSION_PERKS:0 "Đặc Quyền Thăng Hoa"
 ASCENSION_PERKS_DESC:0 "Đặc Quyền Thăng Hoa là một điểm cộng sức mạnh đặc biệt, đế chế của chúng ta có thể mở khóa bằng cách hoàn thành cây truyền thống."
 SELECT_AN_ASCENSION_PERK:0 "§GNhấn để chọn Đặc Quyền Thăng Hoa§!"
 SELECT_ASCENSION_PERK:0 "§GNhấn để chọn Đặc Quyền Thăng Hoa này§!"
 ASCENSION_PERK_CONFIRM_TITLE:0 "Chọn Đặc Quyền Thăng Hoa"
 ASCENSION_PERK_CONFIRM_DESC:0 "Bạn có chắc chắn muốn chọn $KEY|H$ không?"
 AVAILABLE_ASCENSION_PERK_SLOT:0 "Khe Đặc Quyền Thăng Hoa trống\n§W$ASCENSION_PERKS_DESC$§!"
 AVAILABLE_ASCENSION_PERK_SLOT_DESC:0 "$SELECT_AN_ASCENSION_PERK$"
 UNAVAILABLE_ASCENSION_PERK_SLOT:0 "Khe không khả dụng"
 UNAVAILABLE_ASCENSION_PERK_SLOT_DESC:0 "Khe này không thể sử dụng. $ADOPT_TRADITION_TREE_TO_UNLOCK_ASCENSION_PERK_SLOT$"
 UNAVAILABLE_ASCENSION_PERK_SLOT_DELAYED:0 "§GNhấn để xem danh sách Đặc Quyền Thăng Hoa khả dụng§!"
 ADOPT_TRADITION_TREE_TO_UNLOCK_ASCENSION_PERK_SLOT:1 "Thông qua việc chọn tất cả truyền thống trong một nhóm truyền thống hoặc nghiên cứu công nghệ Lý Thuyết Thăng Hoa để mở khóa một Đặc Quyền Thăng Hoa."
 MISSING_ASCENSION_PERK_SLOT:1 "$TRIGGER_FAIL$Cần §YKhe Đặc Quyền Thăng Hoa trống§!. $ADOPT_TRADITION_TREE_TO_UNLOCK_ASCENSION_PERK_SLOT$"
 ASCENSION_PERKS_VIEW_SHOW_UNAVAILABLE:0 "Hiển thị không khả dụng"
 ASCENSION_PERKS_VIEW_SHOW_UNAVAILABLE_DESC:0 "Hiển thị tất cả Đặc Quyền Thăng Hoa, kể cả những đặc quyền chúng ta chưa đáp ứng yêu cầu."

 dyson_sphere_ruined:0 "Quả Cầu Dyson bỏ hoang"
 dyson_sphere_ruined_DESC:0 "Một quả cầu Dyson bị bỏ hoang. Mặc dù đã xuống cấp theo thời gian, nhưng cấu trúc cơ bản của cỗ máy khổng lồ này phần lớn vẫn còn nguyên vẹn. Thông qua công nghệ cần thiết và một lượng lớn tài nguyên đầu tư, chúng ta có thể sửa chữa được quả cầu Dyson này."
 dyson_sphere_ruined_MEGASTRUCTURE_DETAILS:0 ""
 dyson_sphere_restored:0 "$dyson_sphere_5$"
 dyson_sphere_restored_DESC:0 "$dyson_sphere_5_DESC$"
 think_tank_ruined:0 "Trung tâm Khoa học bỏ hoang"
 think_tank_ruined_DESC:0 "Một trung tâm khoa học bị bỏ hoang. Mặc dù bên trong đã bị những kẻ cướp bóc vơ vét sạch sẽ, nhưng phần lớn cấu trúc chính của cỗ máy khổng lồ này vẫn được giữ nguyên. Bằng việc áp dụng công nghệ thích hợp và đầu tư lượng lớn tài nguyên, chúng ta hẳn sẽ làm cho nó hoạt động trở lại."
 think_tank_ruined_MEGASTRUCTURE_DETAILS:0 ""
 think_tank_restored:0 "$think_tank_3$"
 think_tank_restored_DESC:0 "$think_tank_3_DESC$"
 spy_orb_ruined:0 "Mạng Lưới Cảm Biến Toàn Thiên Hà bỏ hoang"
 spy_orb_ruined_DESC:0 "Tàn tích vỡ nát này từng là một Mạng Lưới Cảm Biến Toàn Thiên Hà vô cùng hùng mạnh. Mặc dù đã cũ kỹ, nhưng phần lớn cấu trúc chính của nó vẫn được giữ nguyên. Bằng việc áp dụng công nghệ thích hợp và lượng lớn tài nguyên, chúng ta có thể làm cho nó hoạt động trở lại."
 spy_orb_ruined_MEGASTRUCTURE_DETAILS:0 ""
 spy_orb_restored:0 "$spy_orb_4$"
 spy_orb_restored_DESC:0 "$spy_orb_4_DESC$"
 ring_world_ruined:0 "Phân khu Thế Giới Vành Đai bỏ hoang"
 ring_world_ruined_DESC:0 "Phân khu thế giới vành đai này từng là nơi có một khu dân cư đầy đủ chức năng, nhưng giờ đã bị bỏ hoang. Về mặt lý thuyết thì nó vẫn có thể được sửa chữa, nhưng điều này đòi hỏi công nghệ tiên tiến hơn và lượng lớn tài nguyên."
 ring_world_ruined_MEGASTRUCTURE_DETAILS:0 ""
 ring_world_restored:0 "$ring_world_3_intermediate$"
 ring_world_restored_DESC:0 "$ring_world_3_intermediate_DESC$"

 utopia.2010.name:0 "Quả Cầu Dyson bỏ hoang"
 utopia.2010.a.desc:0 "Chúng ta đã bắt gặp tàn tích của một siêu cấu trúc ở hệ sao [dyson_system.GetName], bao quanh ngôi sao của hệ sao này. Các nhà khoa học của chúng ta đánh giá sơ bộ đây từng là một \"§HQuả Cầu Dyson§!\" —— một siêu cấu trúc dùng để khai thác triệt để năng lượng của ngôi sao. Nó rõ ràng không thể tiếp tục hoạt động do phần thân đã phải hứng chịu đòn tấn công chí mạng từ vũ khí năng lượng không xác định.\n\n$utopia.2010.c.desc$"
 utopia.2010.b.desc:0 "Chúng ta đã bắt gặp tàn tích của một Quả Cầu Dyson ở hệ sao [dyson_system.GetName]. Nó rõ ràng không thể tiếp tục hoạt động do phần thân đã phải hứng chịu đòn tấn công chí mạng từ vũ khí năng lượng không xác định\n\n$utopia.2010.c.desc$"
 utopia.2010.c.desc:0 "Đáng chú ý là xung quanh tàn tích Quả Cầu Dyson này đồng thời cũng trôi nổi rất nhiều xác tàu sao. Bản thể của Quả Cầu Dyson này rất cổ xưa, nhưng đám mây tàn tích xung quanh nó rõ ràng đến từ một thời kỳ gần đây hơn. Những mảnh vỡ này dường như đa phần đến từ một trận giao chiến ác liệt giữa hai hạm đội, trận chiến này rất có thể bùng nổ do tranh giành quyền sở hữu Quả Cầu Dyson bỏ hoang này."
 utopia.2010.a:0 "Nó trông có vẻ có chức năng tương tự như quả cầu Dyson của chúng ta."
 utopia.2011.name:0 "Quả Cầu Dyson được sửa chữa"
 utopia.2011.desc:0 "Chúng ta đã sửa chữa thành công Quả Cầu Dyson bỏ hoang nằm trong hệ sao [From.GetName]. Đám mây mảnh vỡ khổng lồ trong hệ sao đã được thu thập lại dùng cho dự án sửa chữa, điều này vừa giảm bớt lượng tài nguyên tiêu hao của chúng ta, vừa loại bỏ một rủi ro hàng hải tiềm ẩn cho phi hành đoàn.\n\nSiêu cấu trúc này hiện đã khôi phục hoạt động bình thường, sau hàng ngàn năm im lìm lại sản xuất ra nguồn năng lượng khổng lồ."
 utopia.2012.name:0 "Trung tâm Khoa học bỏ hoang"
 utopia.2012.desc:0 "Chúng ta đã phát hiện ra tàn tích của một thiết bị không gian khổng lồ ở [nexus_system.GetName]. Siêu cấu trúc này dường như từng là một §HTrung tâm Khoa học§! khổng lồ. Dù đã bị bỏ hoang hàng ngàn năm, nhưng cấu trúc chính của nó vẫn còn nguyên vẹn."
 utopia.2012.a:0 "Nó trông có vẻ có chức năng tương tự như trung tâm khoa học của chúng ta."
 utopia.2013.name:0 "Trung tâm Khoa học được sửa chữa"
 utopia.2013.desc:0 "Trung tâm Khoa học bỏ hoang gần [From.GetName] đã được sửa chữa hoàn toàn, và được trang bị đội ngũ nhà khoa học ưu tú của [Root.GetName]. Siêu cấu trúc này vẫn giữ được mục đích ban đầu khi những người thiết kế tạo ra nó, tiếp tục hỗ trợ chúng ta giải quyết nhiều vấn đề khoa học hơn trong thời đại này."
 utopia.2014.name:0 "Mạng Lưới Cảm Biến Toàn Thiên Hà bỏ hoang"
 utopia.2014.desc:1 "Tại một thời điểm nào đó trong lịch sử dải ngân hà, hệ sao [sentry_system.GetName] từng được xây dựng một cơ sở quỹ đạo có kích thước lớn dị thường, sau đó đã bị dỡ bỏ có tổ chức. Quỹ đạo đồng bộ hành tinh của phần lớn các thiên thể trong hệ sao này tràn ngập một lượng lớn mảnh vỡ, trong đó có cả lớp vỏ của các trạm không gian cỡ lớn.\n\nNổi bật trong đám mảnh vỡ là một §HMạng Lưới Cảm Biến Toàn Thiên Hà§! khổng lồ. Qua kết quả quét sơ bộ của chúng ta, có thể suy đoán mảng này đủ mạnh để giám sát toàn bộ thiên hà theo thời gian thực."
 utopia.2014.a:0 "Chúng ta đã có Mạng Lưới Cảm Biến Toàn Thiên Hà rồi."
 utopia.2015.name:0 "Mạng Lưới Cảm Biến Toàn Thiên Hà được sửa chữa"
 utopia.2015.desc:0 "Tuy vô cùng khó khăn, các kỹ sư của chúng ta vẫn tìm cách sửa chữa được Mạng Lưới Cảm Biến Toàn Thiên Hà bỏ hoang nằm ở hệ sao [From.GetName], đồng thời trong quá trình đó đã tái chế tàn tích của các trạm không gian rải rác xung quanh.\n\nSau hàng trăm triệu năm, Mạng Lưới Cảm Biến Toàn Thiên Hà lại ầm ầm đi vào hoạt động, năng lượng tràn trề trong mảng, nhờ tín hiệu mạnh mẽ của nó, toàn bộ thiên hà được thu gọn vào tầm mắt."

 utopia.2016.name:0 "Thế Giới Vành Đai bỏ hoang"
 utopia.2016.desc:0 "Những tàn tích bay quanh ngôi sao trung tâm của hệ sao [ring_system.GetName] này đến từ một Thế Giới Vành Đai cổ đại. Bất kỳ thiên thể hành tinh nào từng tồn tại trong hệ sao này đều đã được dùng làm vật liệu xây dựng cho dự án cỗ máy khổng lồ này.\n\nKhông có bằng chứng nào cho thấy kỳ quan công trình này ban đầu do ai xây dựng, nhưng đây chắc chắn là kiệt tác của một nền văn minh cực kỳ tiên tiến."
 utopia.2016.a:0 "Ít nhất họ cũng tiên tiến như nền văn minh của chúng ta."
 utopia.2017.name:0 "Phân khu Thế Giới Vành Đai được sửa chữa"
 utopia.2017.desc:0 "Dựa trên tàn tích của thế giới vành đai ở hệ sao [From.GetName], các kỹ sư của chúng ta đã khôi phục thành công hoạt động của một phân khu của nó. Cấu trúc sinh thái của thế giới vành đai hoàn toàn mới này gần như được các nhà hành tinh học của chúng ta lên kế hoạch lại từ đầu, nhưng giờ nó đã đủ ổn định để có thể cư trú."
 anomaly.2576.name:0 "Kim loại mới"
 anomaly.2576.desc:0 "Sau khi thăm dò kỹ lưỡng bề mặt [From.GetName], chúng ta đã phát hiện ra một hố va chạm khổng lồ, bên trong rải rác một số mảnh vỡ của những xác tàu sao cổ đại không rõ nguồn gốc. Những con tàu này dường như hoàn toàn không được trang bị hệ thống hỗ trợ sự sống, chúng ta suy đoán chúng có thể là một loại máy bay không người lái khổng lồ hoặc do một dạng trí tuệ nhân tạo nào đó điều khiển.\n\nVật liệu vỏ của những con tàu này khá thú vị, được cấu tạo từ một vật liệu vô cơ cực kỳ quý hiếm gọi là §HKim loại Sống§!. Thuộc tính của vật liệu này đa dạng và độc đáo, có thể được \"lập trình\" thành một hình dạng cụ thể, và khi bị hỏng, có thể từ từ tự phục hồi. Hàng ngàn năm trôi qua, kim loại sống trên các con tàu dần tan chảy, tạo thành một mạch khoáng dày đặc khổng lồ, đủ cho chúng ta khai thác trong nhiều thế kỷ."
 living_metal_category:0 "Hố va chạm kỳ lạ"
 living_metal_category_desc:0 "Chúng ta đã phát hiện ra một hố va chạm khổng lồ, nó có vẻ không phải được hình thành trong tự nhiên."

 crisis.1011.desc:0 "Chúng ta đã mất thuộc địa [Root.GetName]! Những kẻ xâm lược đến từ chiều không gian khác này trước tiên đã phá hủy trạm không gian quỹ đạo, sau đó dội bom bừa bãi xuống bề mặt hành tinh, gặt hái toàn bộ sự sống trên mặt đất. Toàn bộ sinh quyển của [Root.GetPlanetMoon] đều bị hủy diệt hoàn toàn —— không còn lại một chút dấu vết nào của sự sống."

 utopia.61.name:0 "Trạm Cư trú Quỹ đạo [From.From.From.Planet.GetName] đã hoàn thành"
 utopia.61.desc.a:0 "Chúng ta đã xây dựng trạm cư trú quỹ đạo đầu tiên, đã đến lúc chuẩn bị một con tàu thực dân, hạ cánh xuống thế giới do chính tay chúng ta tạo ra.\n\nTừ lõi máy móc đến đỉnh núi, từng viên gạch của trạm cư trú đều được thiết kế tỉ mỉ, nghiễm nhiên trở thành quê hương mới của chúng ta trong biển sao bao la."
 utopia.61.desc.b:0 "Trạm cư trú quỹ đạo [From.From.From.Planet.GetName] đã xây dựng xong, có thể thuộc địa hóa."

 allow_dyson_sphere:0 "§H$UNLOCKS_MEGASTRUCTURE$:§! Quả Cầu Dyson"

