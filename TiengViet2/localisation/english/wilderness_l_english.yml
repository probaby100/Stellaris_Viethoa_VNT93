 job_neurosymbiont_plural_with_icon: "£job_neurosymbiont£ $job_neurosymbiont_plural$"
 job_neurosymbiont_desc: "Là cầu nối sống giữa Cự Thú Nuốt Sao và chúng ta, những thể cộng sinh này tiêu hao sinh mệnh của mình để truyền dẫn tâm trí chúng ta vào cơ thể khổng lồ của nó."
 job_neurosymbiont_effect_desc: "£job_neurosymbiont£ $job_neurosymbiont_plural$ sản xuất £energy£ §Y$energy$§!"
