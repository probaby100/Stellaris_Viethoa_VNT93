####################################
# Traditions
####################################
 tr_adaptability_appropriation_wilderness: "Thu Nạp Sinh Thái"
 tr_adaptability_appropriation_wilderness_delayed: "Các hệ sinh thái chưa được tận dụng triệt để không mang lại đóng góp nào cho đế chế của chúng ta. [GetIndividualNamePluralCap] phải được tái định cư một cách hiệu quả đến những hành tinh nơi họ được cần đến nhất."
 tr_discovery_faith_in_science_wilderness: "Mạng Lưới Khuẩn Ty"
 tr_discovery_faith_in_science_wilderness_delayed: "Khai thác tính tò mò tự nhiên của tất cả [GetIndividualNamePlural] trong một mạng lưới nấm kết nối liên tục, thúc đẩy việc tiếp thu tri thức mới."
 tr_domination_wilderness_network: "Tăng Tốc Đại Trao Đổi Chất"
 tr_domination_wilderness_network_delayed: "Gia tăng tốc độ trao đổi năng lượng trên quy mô toàn lục địa, nâng cao đáng kể năng lực tương trợ giữa các vùng sinh thái."
 tr_domination_wilderness_network_effect: "§YMở khóa Sắc lệnh:§! $edict_drone_overdrive_wilderness$"
 tr_domination_imperious_architecture_wilderness: "Tương Thích Pheromone Liên Loài"
 tr_domination_imperious_architecture_wilderness_desc: "§Y$district_craglands_plural$§! cung cấp thêm £defense_army£ §Y$defense_army_plural$§!: §G+1§!"
 tr_domination_imperious_architecture_wilderness_delayed: "Bắt buộc giao tiếp bằng pheromone giữa tất cả [GetIndividualNamePlural], tạo nên sự phối hợp nhịp nhàng không một kẽ hở."
 tr_expansion_colonization_fever_wilderness: "Tâm Trí Vạn Thế Giới"
 tr_expansion_colonization_fever_wilderness_desc: "Thêm một §Y£district£Khu quy hoạch§! ngẫu nhiên khi khai phá thế giới mới."
 tr_expansion_colonization_fever_wilderness_delayed: "[GetGestaltEntityName] là bản hòa ca của muôn vàn ý thức, ngay cả khi vươn tới những thế giới xa xôi và lạnh lẽo nhất."
 tr_expansion_a_new_life_wilderness: "Sinh Trưởng Tràn Lan"
 tr_expansion_a_new_life_wilderness_delayed: "Sự phát triển của [GetGestaltEntityName] chính là lời giải đáp cho mọi thách thức sinh tồn."
 tr_expansion_courier_network_wilderness: "$tr_expansion_courier_network_hive$"
 tr_expansion_courier_network_wilderness_delayed: "Coi mỗi quần xã sinh vật như một phân nhánh nhỏ trong tổng thể lớn hơn, cho phép chúng tự vận hành mà không cần sự chú ý toàn diện của ý thức hành tinh."
 tr_expansion_galactic_ambition_wilderness: "$tr_expansion_galactic_ambition_hive$"
 tr_expansion_galactic_ambition_wilderness_delayed: "Nỗi sợ hãi nguyên thủy từng đồng hành cùng những xúc tua ngập ngừng đầu tiên trong bóng tối, cách xa thế giới cái nôi của chúng ta. Chỉ bằng cách chế ngự và loại trừ nỗi sợ này, chúng ta mới có thể tiếp tục phát triển. Hàng triệu [GetIndividualNamePlural] sẽ ngã xuống để [GetGestaltEntityName] có thể trường tồn."
 tr_prosperity_pursuit_of_profit_wilderness: "Vận Tải Thể Lỏng Toàn Cầu"
 tr_prosperity_pursuit_of_profit_wilderness_delayed: "Những huyết mạch trải rộng khắp lục địa vận chuyển dưỡng chất và vật liệu kiến trúc thiết yếu để tiếp tế cho các hệ sinh thái cần hỗ trợ."
 tr_prosperity_public_works_wilderness: "Địa Đạo Dưới Lòng Đất"
 tr_prosperity_public_works_wilderness_desc: "Tất cả £district£ §YKhu quy hoạch§! cung cấp thêm £housing£ §Y$MOD_PLANET_HOUSING_ADD$§!: §G+50§!"
 tr_prosperity_public_works_wilderness_delayed: "Bằng cách cho các [GetIndividualNamePlural] thâm nhập vào các lớp vỏ địa chất bên dưới, chúng ta khai mở thêm vô số không gian sống."
 tr_synchronicity_kinship_wilderness: "Đồng Bộ Nhịp Sinh Học"
 tr_synchronicity_kinship_wilderness_delayed: "Kiểm soát chính xác chu kỳ nghỉ ngơi của các [GetIndividualNamePlural], tối ưu hóa năng lượng và sự gắn kết của toàn bộ sinh quyển."

####################################
# Ascension Perks
####################################

 ap_mastery_of_nature_wilderness: "$ap_mastery_of_nature$"
 ap_mastery_of_nature_wilderness_desc: "Chúng ta là chu kỳ vừa nuốt chửng vừa bị nuốt chửng. Từ tế bào nhỏ bé nhất đến đại thụ chọc trời, tất cả đều tuân theo ý chí nhào nặn thiên nhiên của chúng ta."
 ap_engineered_evolution_wilderness: "$ap_engineered_evolution$"
 ap_engineered_evolution_wilderness_desc: "Ý thức của chúng ta tiến hóa để vượt qua các thử thách khắc nghiệt của môi trường. Khi môi trường biến đổi, chúng ta cũng sẽ tiến hóa theo."
 engineered_evolution_wilderness_tt: "- Bắt đầu Tình huống §Y$genetic_ascension_situation$§!$TABBED_NEW_LINE$- $REQUIRES_TRADITION_SLOT$$TABBED_NEW_LINE$- $UNLOCKS_AGENDA$ §Y$council_agenda_agenda_engineered_evolution_name$§!"

############
# Espionage
############
 operation_embed_planetary_roots: "Cấy Rễ Hành Tinh" # literal roots, as in plantlife
 operation_embed_planetary_roots_desc: "Chúng ta có những mục đích cấp bách hơn cho các điệp viên [owner.GetIndividualNamePlural] thu thập tin tình báo. Bằng cách gieo các bào tử siêu nhỏ vào hành tinh mục tiêu, chúng ta có thể nghe ngóng mọi động thái của đối phương." # the Wilderness embeds a part of itself, hence 'microbiome'
 operation_embed_planetary_roots_on_success: "$operation_sleeper_cells_on_success$"
 espionage_planetary_roots: "Rễ Cây Hành Tinh"
 espionage_planetary_roots_desc: "Chúng ta đã cấy một quần xã vi sinh vật bán tri giác, cho phép các điệp viên [owner.GetIndividualNamePlural] của chúng ta theo sát công việc của đế chế này. Những thực thể nguyên thủy này bám rễ sâu vào đất đai, lắng nghe các rung động và tín hiệu hóa học rồi truyền về cho chúng ta."
 operation_embed_planetary_roots_requires_blocker: "$TRIGGER_FAIL$§R$espionage_planetary_roots$ của chúng ta cần một vị trí thích hợp để bám rễ.§!"
 operation_embed_planetary_roots_dont_stack_this: "$TRIGGER_FAIL$§RChúng ta đã cấy $espionage_planetary_roots$ trên [target.GetName].[planet_roots_success]§!"
 operation_embed_planetary_roots_not_cleared: "$TRIGGER_FAIL$§RChúng ta vẫn có thể cảm nhận được $espionage_planetary_roots$ trên [target.GetName].§!"
 d_wilderness_root_blocker: "Bụi Cây Xâm Lấn"
 d_wilderness_root_blocker_desc: "Một vạt cây Hoang Dã bán tri giác, không phải bản địa đang bóp nghẹt và cắm rễ sâu vào rìa các vùng đồng quê này."

 wilderness.4500.name: "Lùng Sục Vùng Hoang Dã"
 wilderness.4500.desc: "Các điệp viên [owner.GetOperativesLowerPlural] bán tự trị của chúng ta đã tìm thấy một địa điểm lý tưởng để gieo mầm các bào tử bí mật."
 wilderness.4505.name: "Xác Định Vị Trí Tiềm Năng"
 wilderness.4505.desc: "Chúng ta đã tranh thủ được sự hỗ trợ từ một [target.GetSpeciesAdj] ngây thơ để vận chuyển bào tử đến [roots_planet.GetPlanetMoon] [roots_planet.GetName]. Đội ngũ điệp viên của chúng ta báo cáo các điều kiện môi trường tại đây rất lý tưởng để cấy rễ."
 wilderness.4510.name: "Đã Cấy $espionage_planetary_roots$"
 wilderness.4510.desc: "Kể từ khoảnh khắc hệ vi sinh vật của chúng ta được đưa tới ngôi nhà [GetRootsBlockerName] mới của nó, chúng ta đã bắt đầu hít thở bầu không khí cấm kỵ và cảm nhận thế giới được gọi là §H[roots_planet.GetName]§!.\n\nSự hiện diện của chúng ta tại đây sẽ khá mong manh, chừng nào các thể cộng sinh này về cơ bản vẫn bị ngắt kết nối khỏi bản thể rộng lớn hơn của chúng ta. Tuy nhiên, chúng sẽ phục vụ chúng ta đắc lực khi đến lúc tái khởi động các chiến dịch trong không gian của [target.GetAdj]."
 wilderness.4510.a: "Rễ của chúng ta nên đào sâu hơn, tồn tại lâu hơn."
 wilderness.4510.b: "Hãy để rễ của chúng ta sinh sôi tràn lan tại nơi đây."

####################################
# Technologies
####################################
 tech_wilderness_terraform: "Nảy Mầm Hành Tinh"
 tech_wilderness_terraform_desc: "Để mở rộng rễ của chúng ta sang một thế giới mới, trước tiên cần nuôi dưỡng mảnh đất màu mỡ. Bằng cách cải tạo môi trường hành tinh trước, chúng ta chuẩn bị cho sự thức tỉnh trọn vẹn."

 tech_terrestrial_sculpting_wilderness: "$tech_terrestrial_sculpting$"
 tech_terrestrial_sculpting_wilderness_desc: "$tech_terrestrial_sculpting_desc$"
 tech_terrestrial_sculpting_wilderness_effect: "§HHiệu ứng Mở khóa:§! Cho phép địa hóa cải tạo môi trường các hành tinh tiêu chuẩn."

 tech_wilderness_node: "Tâm Điểm Hiện Hữu"
 tech_wilderness_node_desc: "Bằng cách khuyến khích sự phát triển của các thể cộng sinh tư duy sâu sắc tại các bãi trống, ý thức tập thể của chúng ta trở nên sắc bén và sâu rộng hơn."
 tech_wilderness_cluster: "$tech_hive_cluster$"
 tech_wilderness_cluster_desc: "Chúng ta có thể đẩy nhanh sự lưu loát của tâm trí tập thể bằng cách đầu tư vào các cuộc tụ họp cộng sinh quy mô lớn."
 tech_wilderness_confluence: "$tech_hive_confluence$"
 tech_wilderness_confluence_desc: "Ý chí tương hỗ của chúng ta sẽ được củng cố nhờ các cuộc tụ họp vĩ đại của các thể cộng sinh đồng điệu sâu sắc."

 tech_genome_mapping_wilderness: "$tech_genome_mapping$"
 tech_genome_mapping_wilderness_desc: "Lập bản đồ bộ gen của vô vàn biến thể DNA giúp chúng ta thấu hiểu phương thức sinh trưởng của chính mình và mở rộng tuổi thọ sinh học."
 tech_mining_1_wilderness: "$tech_mining_1$"
 tech_mining_1_wilderness_desc: "Bơm các chất làm đặc niêm mạc và tăng áp lực nước vào các mỏ khoáng sản hiện có giúp khoan sâu hơn và nâng cao sản lượng."
 tech_powered_exoskeletons_wilderness: "$tech_powered_exoskeletons$"
 tech_powered_exoskeletons_wilderness_desc: "Các bộ giáp ngoài hỗ trợ năng lượng giúp tăng cường sức mạnh và tốc độ của người sử dụng, vừa có ứng dụng quân sự vừa đẩy nhanh tốc độ khai khoáng."
 tech_colonization_1_wilderness: "Sáng Kiến Tân Thế Giới"
 tech_colonization_1_wilderness_desc: "Chúng ta chuyển hướng tập trung vào việc tính toán các tài nguyên và vật liệu cần thiết để đánh thức những thế giới mới."

 tech_wilderness_government: "$tech_planetary_government$"
 tech_wilderness_government_desc: "Từ thời điểm một hành tinh mới thức tỉnh, ưu tiên hàng đầu phải là thiết lập một môi trường ổn định và thịnh vượng."
