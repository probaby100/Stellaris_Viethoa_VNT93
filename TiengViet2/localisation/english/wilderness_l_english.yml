l_english:
####################################
# Events
####################################

# introduction event
 progress.2.desc.wilderness: "Tàu [Root.GetName] đã tạo nên một phát hiện đáng kinh ngạc trên [from.GetName]: [from.GetPlanetMoon] đang tràn ngập sự sống ngoài hành tinh! Lần đầu tiên, chúng ta chạm trán với những dạng sống bắt nguồn từ bên ngoài bản thể chúng ta.\n\nKhám phá này cuối cùng đã xác nhận rằng chúng ta, hành tinh [root.owner.capital_scope.GetName], không hề cô độc trong vũ trụ. Mặc dù không có sinh vật ngoài hành tinh nào tìm thấy trên [from.GetName] có tri giác, nhưng rất có thể chỉ là vấn đề thời gian trước khi chúng ta chạm trán những thực thể như vậy..."

# Colonization Events
 wilderness.1010.name: "[from.GetName] Thức Tỉnh"
 wilderness.1010.desc.intro: "Các bào tử địa hóa của chúng ta đã hoàn thành mục đích của mình, lần đầu tiên đưa một phần của chính bản thể chúng ta đi thuộc địa hóa một thế giới xa lạ."
 wilderness.1010.desc.same: "Trở thành [from.GetName] cũng như [root.GetHomeWorldName]... Cảm giác này đã quá đỗi thân thuộc với chúng ta: một phương thức tồn tại an nhiên, bất chấp việc phải mang vô số hình hài mới dưới một vầng thái dương từng xa lạ. Chúng ta đã dễ dàng thích nghi với các điều kiện có sẵn tại nơi đây." #e.g. 'becoming Mars as well as Earth...''
 wilderness.1010.desc.similar_cold: "Thích nghi bản thể chúng ta để phù hợp với [from.GetClassAdj] §Y[from.GetName]§! sẽ có những thách thức riêng, nhưng chúng ta đã tìm ra những phương cách quen thuộc để ứng phó. Xúc tua vươn dài, môi trường sống được kiến tạo, và những chiếc miệng đói bắt đầu săn mồi." #e.g. 'Adapting our self to suit arctic Pluto...'
 wilderness.1010.desc.similar_dry: "Với tư cách là hành tinh [root.GetHomeWorldName], chúng ta luôn phát triển rực rỡ trong bầu khí quyển khô cằn. Do đó chúng ta cũng sẽ vươn mình đối mặt với thử thách trở thành [from.GetClassAdj] §Y[from.GetName]§!. Chúng ta đã tìm ra những cách thức mới để tìm kiếm và tích trữ độ ẩm, đồng thời học cách chung sống hòa hợp với địa chất mới đầy thử thách này thay vì chống lại nó." #e.g. 'the challenge of becoming savannah Mars'
 wilderness.1010.desc.similar_wet: "Cũng giống như cách chúng ta từng hưng thịnh giữa các vùng nước của [root.GetHomeWorldName], chúng ta cũng sẽ đơm hoa kết trái dưới tư cách [from.GetClassAdj] §Y[from.GetName]§!. Khoáng sản, các dòng hải lưu và thậm chí cả lượng ánh sáng ban ngày nhận được tại nơi đây có vẻ kỳ lạ, nhưng chúng ta đã tìm ra cách để chiết xuất những gì mình cần." #e.g. 'we flourish as oceanic Neptune'
 wilderness.1010.desc.diff_cold: "Chúng ta biết rằng trở thành §Y[from.GetName]§! sẽ đầy thử thách. Thật vậy, một phần những gì từng tạo nên hành tinh [root.capital_scope.GetClassAdj] [root.GetHomeWorldName] của chúng ta đã khô héo tại nơi đây, nhưng những gì còn lại vẫn vô cùng kiên cường và đã bắt đầu thích nghi. Môi trường xa lạ này khiến việc thu thập các tài nguyên cơ bản duy trì sự sống trở nên khó khăn hơn nhiều - nhưng bám trụ trên mảnh đất băng giá này, chúng ta quan sát thấy sự sống đã tìm được lối đi riêng." #e.g. 'becoming Earth'
 wilderness.1010.desc.diff_dry: "Nơi này gợi lên trong chúng ta nỗi sợ hãi nguyên thủy: quá nóng và khô đến mức đánh thức những ký ức bản năng về Đại Hạn Hán. Tuy nhiên, nếu chúng ta có thể thích nghi và phát triển tại nơi đây... Việc trở thành §Y[from.GetName]§! cũng có thể đánh thức một điều gì đó mới mẻ bên trong chính chúng ta. Nơi nào có độ ẩm, chúng ta đã tìm cách tích trữ. Nơi nào bóng râm khan hiếm, chúng ta đã tìm cách tự tạo ra bóng râm cho riêng mình."
 wilderness.1010.desc.diff_wet: "Nỗ lực trở thành §Y[from.GetName]§! của chúng ta sẽ đầy chông gai. Chúng ta, những người của vùng đất khô cằn, giờ đây phải đối mặt với một thế giới ngập tràn nước. Nước có mặt ở khắp mọi nơi, và cùng với nó là những căn bệnh và loài ký sinh xa lạ, đe dọa nuốt chửng những mầm non mới sinh của chúng ta. Tuy nhiên, khi đào sâu hơn vào lớp đất bùn lầy, chúng ta đã bắt đầu tìm thấy chỗ đứng vững chắc của mình." #e.g. 'Our effort to become Mars'
 wilderness.1010.desc.other: "Khi chúng ta nhào nặn chính mình để trở thành §Y[from.GetName]§!, chúng ta nhận diện những phần nào của bản thể mình sẽ phát triển rực rỡ, và phần nào sẽ khô héo. Sự tồn tại [from.GetClassAdj] này có nhiều điểm chung với những gì chúng ta từng biết trước đây, nhưng cũng có nhiều điều xa lạ - vì vậy chúng ta quan sát, và chúng ta thử nghiệm." #e.g. 'shape ourselves to become Luna'
 wilderness.1010.desc.outro: "Các siêu cấu trúc, dưỡng chất và chính DNA của chúng ta đã bắt đầu thích nghi và hòa quyện với sự sống từng tồn tại ở đây trước chúng ta. [from.GetName] đang thức tỉnh."
 wilderness.1010.a: "Thế giới của chúng ta sẽ sớm hòa làm một."

# Terraforming Events
 terra.25.desc.wilderness: "Dự án trường kỳ của chúng ta nhằm đánh thức §Y[From.GetName]§! cuối cùng đã hoàn tất! Các xúc tua đã bao phủ toàn cầu, và một ý thức hành tinh mới đã được thắp sáng."
 terra.80.desc.wilderness: "Chúng ta đã giải phóng bản thể tương lai của mình khỏi một tầng bức xạ khác trong khí quyển và đất đá, dọn đường cho chính mình mai sau. Tuy nhiên, các [Root.GetTerraformerPlural] cảnh giác của chúng ta đã phải can thiệp và tạm thời phong tỏa một số khu vực trên thế giới này. Hành động của chúng ta dường như đã quấy rầy một loài bản địa cực kỳ khó nắm bắt, vốn phát triển mạnh mẽ trong môi trường phóng xạ, nhưng giờ đây đang bắt đầu suy tàn do sự can thiệp của chúng ta.\n\nKỳ lạ hơn, loài sinh vật này dường như đang ở giai đoạn tiền tri giác, sắp sửa bước qua ngưỡng cửa tiến hóa để đạt tới trí tuệ. Giờ đây, khi [From.GetName] sắp được tẩy rửa hoàn toàn khỏi những tàn tích độc hại cuối cùng, chúng ta đứng trước một lựa chọn quan trọng: làm gì với dạng sống non trẻ và độc đáo này?"
 terra.80.b.wilderness: "Thế giới này là của họ. Chúng ta nên để họ thức tỉnh."
 terra.80.d.wilderness: "Hãy nuốt chửng chúng."

 wilderness.2000.name: "Thức Tỉnh Theo Kế Hoạch"
 #wilderness.2000.desc.reg: "We feel the tremendous potential of [from.GetName]. It seems proper to both fear and delight in the awesome power we are about to exert there: shaping this [from.GetPlanetMoon] with our will and the tools we have developed; laying the pattern for its eventual awakening.\n\nWe have long relied on natural processes to grow and sustain the [root.GetName]. But these trials also cost us dearly, and taught us much. Now we shall see what wonders emerge when a habitable world skips its own evolution and gains the wisdom of hard-earned growth and decay."
 wilderness.2000.desc.barren: "Chứng kiến sự hoang tàn của [from.GetName] có lẽ thật đau lòng, nhưng sẽ không còn kéo dài lâu nữa. Sự sống trong thiên hà này từ trước đến nay dường như đã lờ đi thế giới cằn cỗi này, nhưng giờ đây chúng ta, [root.GetName], nắm giữ những công cụ và tri thức để thay đổi điều đó.\n\nBất chấp tất cả những gì đã học được cho đến nay, chúng ta vẫn đối mặt với một nhiệm vụ đầy gian nan trong việc phục hồi [from.GetName]. Bằng ý chí của chúng ta và với các công cụ biến đổi khí hậu đã phát hiện, sự sống sẽ sớm hiện hữu tại nơi từng là cõi hư vô."
 wilderness.2000.desc.tomb_detox: "Mặc dù sự sống như chúng ta biết trên [from.GetName] có thể đã bị dập tắt, chúng ta hiện đã sẵn sàng trao cho thế giới này một cơ hội thứ hai. Chúng ta đã bắt đầu công việc phục hồi bầu khí quyển, các dòng nước và thổ nhưỡng của nó để [from.GetName] có thể một lần nữa nuôi dưỡng sự sống dưới hình hài của [root.GetName]."
 wilderness.2000.desc.gaia: "Lò luyện tiến hóa đã tạo nên những điều kỳ diệu cho chúng ta, [root.GetName]. Nhưng giờ đây, chúng ta có cơ hội truyền ban nhiều hơn thế nữa cho [from.GetPlanetMoon] [from.GetName]. Vận dụng những công cụ và tri thức mà bản thể thuở ban đầu khó lòng tưởng tượng được, chúng ta đã bắt đầu nhào nặn [from.GetName] thành một nơi mà sự thức tỉnh chắc chắn sẽ không giống bất kỳ nơi nào khác.\n\nNền móng của [from.GetName] một ngày nào đó sẽ ngập tràn dưỡng chất, được làm tươi mới bởi các chu kỳ sống rực rỡ của hệ động thực vật chúng ta. Các thung lũng, rặng núi và cao nguyên sẽ mang lại không gian trù phú cho việc tìm kiếm thức ăn, săn bắn và trú ẩn. Sự sống sẽ phát triển rực rỡ tại nơi đây."
 wilderness.2000.a: "Hãy bắt đầu thôi."

 wilderness_pre_sapient_defence_army: "Đàn Thú Tiền Tri Giác"
 seq_wilderness_pre_sapient_defence_army: "Đàn Thú Cộng Sinh $R$" # e.g. 'Symbiont Herd IV'
 wilderness_pre_sapient_defence_army_plural: "Các Đàn Thú Tiền Tri Giác"
 wilderness_pre_sapient_defence_army_desc: "Những sinh vật có tập tính bảo vệ lãnh thổ sâu sắc, vốn rất ngoan ngoãn cho đến khi bị khiêu khích, lúc đó chúng sẽ trút bỏ mọi thứ ngoại trừ những bản năng cơ bản nhất để bảo vệ những kẻ mà chúng nhận diện là đồng loại."
 wilderness_pre_sapient_assault_army: "Bầy Thú Tiền Tri Giác"
 seq_wilderness_pre_sapient_assault_army: "Bầy Thú Cộng Sinh $R$" # e.g. 'Symbiont Horde IV'
 wilderness_pre_sapient_assault_army_plural: "Các Bầy Thú Tiền Tri Giác"
 wilderness_pre_sapient_assault_army_desc: "Những sinh vật hung dữ sở hữu vừa đủ sự ranh mãnh và thể lực dồi dào nguyên thủy để bảo đảm sự hủy diệt tàn bạo đối với bất kỳ kẻ nào chúng coi là kẻ thù."

