####################################
# Personalities
####################################
 personality_benevolent_wilderness: "Hoang Dã Hòa Điệu"
 personality_benevolent_wilderness_desc: "Sinh quyển bao la và có tri giác này chỉ tìm cách hòa mình cùng các vì sao. Rễ của chúng kiên nhẫn vươn khắp thiên hà, không phải vì đói khát, mà vì sự hòa hợp."

 personality_rampant_wilderness: "Hoang Dã Lan Tràn"
 personality_rampant_wilderness_desc: "Hoang Dã Lan Tràn không nổi cơn thịnh nộ; nó lan rộng, hấp thu và trường tồn. Mọi thứ, sống hay chết, đều được tái tạo trong chu kỳ sinh trưởng và phân rã bất tận."

####################################
# Policies
####################################

 policy_symbiont_policy: "$policy_drone_policy$"
 policy_symbiont_policy_desc: "Tập thể tương hỗ của chúng ta có năng lực sản xuất cực kỳ to lớn, nhưng không phải là vô hạn. Chúng ta phải quyết định cách phân bổ tài nguyên tối ưu nhất."

 symbiont_policy_balanced: "$drone_policy_balanced$"
 symbiont_policy_balanced_name: "$symbiont_policy_balanced$"
 symbiont_policy_balanced_desc: "Hoang Dã cống hiến cân bằng cho việc khai thác tài nguyên thô và sản xuất sản phẩm chế biến.\n\n§EKhông có hiệu ứng cộng thêm nào cho sản xuất tài nguyên.§!"

 symbiont_policy_worker: "$drone_policy_worker$"
 symbiont_policy_worker_name: "$symbiont_policy_worker$"
 symbiont_policy_worker_desc: "Hoang Dã ưu tiên khai thác tài nguyên thô, gia tăng năng suất của các thể cộng sinh cơ bản với cái giá là giảm hiệu quả của các thể chuyên môn hóa cao hơn."

 symbiont_policy_thinker: "$drone_policy_thinker$"
 symbiont_policy_thinker_name: "$symbiont_policy_thinker$"
 symbiont_policy_thinker_desc: "Hoang Dã ưu tiên sản xuất các sản phẩm chế tạo và nghiên cứu, thúc đẩy hiệu quả của các thể phức hợp nhưng làm giảm nhẹ sản lượng khai khoáng thô."

####################################
# Edicts
####################################
 edict_capacity_subsidies_wilderness: "$edict_capacity_subsidies$"
 edict_capacity_subsidies_wilderness_desc: "Sắc lệnh này khuyến khích các thể cộng sinh quang hợp tạo thành những đàn di cư quy mô lớn di chuyển theo vầng thái dương, tăng mạnh sản lượng năng lượng."
 edict_mining_subsidies_wilderness: "$edict_mining_subsidies$"
 edict_mining_subsidies_wilderness_desc: "Sắc lệnh này gia cố các mạng lưới rễ của chúng ta, giúp các thể cộng sinh phá đất đào sâu hơn mà giảm thiểu nguy cơ sập hầm."
 edict_farming_subsidies_wilderness: "$edict_farming_subsidies$"
 edict_farming_subsidies_wilderness_desc: "Sắc lệnh này pha loãng và giải phóng các hợp chất hóa học giàu năng lượng vào đất, thúc đẩy mạnh mẽ sản lượng dưỡng chất sinh học."
 edict_forge_subsidies_wilderness: "$edict_forge_subsidies$"
 edict_forge_subsidies_wilderness_desc: "Làm bão hòa các hồ tảo ăn đá bằng dưỡng chất để tạo ra các đợt bùng nổ theo mùa, thu hoạch được lượng hợp kim phụ phẩm dồi dào hơn."
 edict_research_subsidies_wilderness: "$edict_research_subsidies$"
 edict_research_subsidies_wilderness_desc: "$edict_research_subsidies_desc$"
 edict_clearing_motes_wilderness: "$edict_clearing_motes$"
 edict_clearing_motes_wilderness_desc: "Bổ sung các hạt bụi tro dễ bay hơi vào khẩu phần ăn của thể cộng sinh, giúp chúng tiêu hóa cả các chất hữu cơ và vô cơ phức tạp."
 edict_learning_campaign_wilderness: "$edict_learning_campaign$"
 edict_learning_campaign_wilderness_desc: "Bằng cách cung cấp thêm dưỡng chất cho các thể cộng sinh, chúng ta có thể đẩy nhanh tốc độ tích lũy kinh nghiệm và thích ứng của chúng."
 edict_war_drone_campaign_wilderness: "Chiến Dịch Thể Cộng Sinh Chiến Tranh"
 edict_war_drone_campaign_wilderness_desc: "Phân bổ thêm nguồn dinh dưỡng dồi dào cho các thể săn mồi và đàn thú chiến đấu, gia tăng sức mạnh thể chất và mức độ sẵn sàng tác chiến của chúng."
 edict_scientific_revolution_wilderness: "$edict_scientific_revolution$"
 edict_scientific_revolution_wilderness_desc: "$edict_scientific_revolution_desc$"
 edict_drone_overdrive_wilderness: "Tăng Tốc Thể Cộng Sinh"
 edict_drone_overdrive_wilderness_desc: "Các quần xã sinh vật của chúng ta sẽ được thúc đẩy cạnh tranh mạnh mẽ hơn, kích hoạt tiềm năng tối đa nhưng đòi hỏi nhiều tài nguyên duy trì hơn."

