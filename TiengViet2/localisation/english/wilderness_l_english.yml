 col_wilderness_nest: "Thế Giới Dệt Tổ"
 col_wilderness_nest_desc: "$col_city_desc$"
 col_wilderness_nest_tt: "Khu bảo tồn cho vô vàn dạng sống cộng sinh đến mức chính bầu khí quyển có thể thay đổi thành phần để đáp ứng nhu cầu và tâm trạng của Hoang Dã."
 col_wilderness_refinery: "Thế Giới Tinh Luyện"
 col_wilderness_refinery_desc: "Chuyên sản xuất £exotic_gases£ §H$exotic_gases$§! và các £strategic_resource£ §HTài nguyên Chiến lược§! khác."
 col_wilderness_refinery_tt: "Hành tinh này chằng chịt các miệng phun địa nhiệt, nơi hàng loạt sinh vật nano và thể cộng sinh kỳ lạ khác tụ họp để xử lý nguyên liệu thô."
 col_wilderness_forge: "Quần Xã Đúc Luyện"
