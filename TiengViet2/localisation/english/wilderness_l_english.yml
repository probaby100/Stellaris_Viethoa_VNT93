 origin_wilderness: "Hoang Dã Sinh Thể"
 origin_wilderness_desc: "§RCẢNH BÁO: Chặn tất cả các Con đường Thăng thiên ngoại trừ ['concept_purity_ascension', Thăng thiên Thuần khiết]§!\n\nĐế chế này không bắt nguồn từ một loài sinh vật đơn lẻ, mà là từ chính hành tinh quê hương: một quần xã sinh thái khổng lồ, nơi toàn bộ hệ động thực vật gắn kết với nhau trong một mối quan hệ cộng sinh tương hỗ hoàn hảo dưới một ý thức hành tinh duy nhất."
 origin_tooltip_wilderness_effects: "- Đặc trưng Loài: ['trait:trait_wilderness']\n- Thay thế toàn bộ £building£ ['concept_buildings', Công trình], £district£ ['concept_districts', Khu quy hoạch] và £zone£ ['concept_district_specialization', Chuyên môn hóa Khu quy hoạch] tiêu chuẩn bằng các phiên bản đặc chế riêng\n- Thay thế Thuộc địa hóa bằng Tàu Thuộc địa bằng ['concept_terraforming', Địa hóa Hành tinh]\n- Mở khóa Tài nguyên mới: £biomass£ ['concept_biomass', Sinh khối] \n- Hành tinh Quê nhà:$TABBED_NEW_LINE$- Quy mô: £planetsize£ 18$TABBED_NEW_LINE$- ['concept_scorched_plains', £blocker£ $d_scorched_plains$]"
 trait_wilderness: "Hoang Dã"
 trait_wilderness_desc: "§LLoài sinh vật này tồn tại như một phần của một sinh thể cộng sinh tương hỗ, nơi tâm trí và sản phẩm của chúng đã hòa nhập sâu sắc với môi trường đến mức không thể tách rời.§!"
 WILDERNESS_NATURAL_WORLDS_DECLINE: "§R§YHoang Dã§! không thể sinh tồn trên các hành tinh nhân tạo.§!"
 WILDERNESS_DEAD_WORLD: "$TRIGGER_FAIL$§YHoang Dã§! không thể tồn tại trong các đế chế không phải Hoang Dã."
 country_virtual_jobs: "Tất cả các việc làm trong Đế chế này sẽ được tự động lấp đầy."

