 district_photosynthesis_fields: "Cánh Đồng Quang Hợp"
 district_photosynthesis_fields_plural: "Các Cánh Đồng Quang Hợp"
 district_photosynthesis_fields_desc: "Những chiếc lá quang hợp xòe rộng tạo thành cấu trúc chính của các khu vực thu gom năng lượng bao la này."
