 col_wilderness_fortress: "Quần Xã Phòng Thủ"
 col_wilderness_fortress_desc: "$col_fortress_desc$"
 col_wilderness_fortress_tt: "Bề mặt của thế giới này rung chuyển trước những bước chạy rầm rập của các đàn thú bảo vệ lãnh thổ sâu sắc và tiếng gầm của những kẻ săn mồi đáng sợ."
