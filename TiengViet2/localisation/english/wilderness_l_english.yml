####################################
 building_colony_shelter_wilderness: "Xúc Tua Hành Tinh"
 building_colony_shelter_wilderness_desc: "Một tiền đồn đa bào gồm các sinh vật đan xen lan rộng khắp thế giới này, bảo đảm sự hiện diện ổn định của Hoang Dã."

 building_capital_wilderness: "Bó Rễ Hành Tinh"
 building_capital_wilderness_desc: "Một khối sinh vật đơn giản trải rộng, tràn đầy sức sống, tồn tại hài hòa với các thể cộng sinh linh động để nâng cao hiệu suất của chúng."
 building_major_capital_wilderness: "Tổ Hợp Rễ Hành Tinh"
 building_major_capital_wilderness_desc: "Một khối sinh thể tập trung cao độ, đủ dày đặc để các thể cộng sinh sinh sống, lao động và sinh sôi nảy nở, tạo nên một trung tâm trao đổi chất toàn cầu."
 building_system_capital_wilderness: "Đầu Mối Rễ Hành Tinh"
 building_system_capital_wilderness_desc: "Một liên minh khổng lồ gồm các dạng sống đa dạng phối hợp hoạt động ở quy mô to lớn đến mức nó có thể điều hành và điều phối toàn bộ tài nguyên của một hành tinh."
 requires_building_wilderness_capital: "§RYêu cầu có §Y$building_capital_wilderness$§! trên hành tinh.§!"
 requires_building_wilderness_major_capital: "§RYêu cầu có §Y$building_major_capital_wilderness$§! trên hành tinh.§!"
 requires_building_wilderness_system_capital: "§RYêu cầu có §Y$building_system_capital_wilderness$§! trên hành tinh.§!"

 building_imperial_capital_wilderness: "Tổ Hợp Đế Vương"
 building_imperial_capital_wilderness_desc: "Hoang Dã cai quản Đế chế Thiên hà từ sâu bên trong công trình khổng lồ và phức tạp này. Số phận của thiên hà được định đoạt tại đây."

 building_tendril_cradle_1: "Cái Nôi Xúc Tua"
 building_tendril_cradle_1_desc: "Một cụm sợi có rễ bám ngắn tỏa ra từ vị trí này, hút các nguyên liệu thô lân cận vào các cơ quan thiết yếu gần nhất."
 building_tendril_cradle_2: "Dải Mạng Sợi"
 building_tendril_cradle_2_desc: "Những xúc tua thon dài vươn khắp mặt đất, hút tài nguyên từ các khu vực lân cận để xử lý và phân phối."
 building_tendril_cradle_3: "Tổ Rễ Dẫn Truyền"
 building_tendril_cradle_3_desc: "Những chùm rễ đan bện mạch lạc dịch chuyển dưới lòng đất, vận chuyển sinh khối qua các kênh phân tầng đến các trung tâm sinh học ở xa."
 building_tendril_cradle_4: "Tim Sợi Hành Tinh"
 building_tendril_cradle_4_desc: "Những xúc tua hậu cần khổng lồ tỏa khắp cơ thể hành tinh, kéo, đẩy và phân phối sinh khối với sự đồng bộ nhịp nhàng không mệt mỏi."

 planet_research_buildings: "Công Trình Nghiên Cứu Hành Tinh"
 mod_planet_research_buildings_upkeep_mult: "Phí bảo trì $planet_research_buildings$"
 building_brain_node_1: "Chồi Sinh Nghiên Cứu"
 building_brain_node_1_desc: "Công việc đầy tính khám phá của các thể cộng sinh đặt nền móng cho các nghiên cứu tổng quát."
 mod_planet_building_brain_node_1_build_speed_mult: "Tốc độ xây dựng $building_brain_node_1$"
 building_brain_node_2: "Rừng Cây Nghiên Cứu"
 building_brain_node_2_desc: "Một môi trường sống chuyên biệt nhằm thúc đẩy tính tò mò, tạo điều kiện cho các nghiên cứu tiên tiến hơn về các hiện tượng tự nhiên và nhân tạo."
 mod_planet_building_brain_node_2_build_speed_mult: "Tốc độ xây dựng $building_brain_node_2$"
 building_brain_node_3: "Vành Đai Nghiên Cứu Dị Thường"
 building_brain_node_3_desc: "Những khu bảo tồn rộng lớn này cho phép một lượng lớn các thể cộng sinh ưa cực đoan thử nghiệm với nhiều loại vật liệu kỳ lạ và nguy hiểm."
 mod_planet_building_brain_node_3_build_speed_mult: "Tốc độ xây dựng $building_brain_node_3$"
 building_brain_node_4: "Vành Đai Nghiên Cứu Cao Cấp"
 building_brain_node_4_desc: "Sự kết hợp giữa công nghệ ngoài hành tinh và các khu bao bọc cộng sinh khổng lồ thúc đẩy nghiên cứu tiên tiến trong nhiều môi trường thử nghiệm đa dạng."
 mod_planet_building_brain_node_4_build_speed_mult: "Tốc độ xây dựng $building_brain_node_4$"

 building_commensal_clearing_1: "Bãi Trống Hội Sinh"
 building_commensal_clearing_1_desc: "Những ốc đảo tĩnh lặng này cho phép các sinh vật di động tụ tập, nghỉ ngơi và tái đồng điệu với Hoang Dã."
 building_commensal_clearing_2: "Rừng Cây Hội Sinh"
 building_commensal_clearing_2_desc: "Địa điểm trú ẩn lý tưởng cho các cuộc tụ họp quy mô lớn của các thể cộng sinh. Sự tương tác của chúng tại đây tạo ra sự gắn kết cho bản thể phân tán."
 building_commensal_clearing_3: "Thung Lũng Hội Sinh"
 building_commensal_clearing_3_desc: "Các cộng đồng cộng sinh dày đặc và đa dạng di chuyển qua các tầng địa chất nguyên sơ này, thắt chặt mối dây liên kết giữa chúng."
 building_commensal_clearing_4: "Quần Xã Hội Sinh"
 building_commensal_clearing_4_desc: "Các môi trường sống rộng lớn, kết nối với nhau là nơi diễn ra vô số cuộc hội ngộ, mỗi cuộc hội ngộ là một tia lửa quan trọng cho sự thống nhất cộng sinh."

 building_massive_growth_1: "Thung Lũng Dinh Dưỡng"
 building_massive_growth_1_desc: "Việc biến đổi địa hình quy mô nhỏ mang lại các điều kiện vi khí hậu lý tưởng quanh năm cho mùa màng."
 building_massive_growth_2: "Tầng Dưới Dinh Dưỡng"
 building_massive_growth_2_desc: "Một vòm tán rộng lớn bán thấm mang lại mọi sự bảo vệ môi trường cần thiết cho tầng cây bụi, liên tục sản xuất nguồn lương thực dồi dào."
 building_massive_growth_3: "Đại Đồn Điền Bậc Thang"
 building_massive_growth_3_desc: "Thiên đường cho các vi sinh vật và động vật bán thủy sinh, những thửa ruộng bậc thang bao la này mang lại nguồn protein và ngũ cốc dồi dào."
 building_massive_growth_4: "Đồn Điền Lâm Nghiệp"
 building_massive_growth_4_desc: "Các cụm thực vật khổng lồ nhiều lá che chở cho cây trồng tầng dưới, bảo đảm sản lượng lương thực ổn định phục vụ toàn bộ mạng lưới thức ăn."

 building_bioelectric_stimulator_1: "Bộ Thích Ứng Lục Lạp"
 building_bioelectric_stimulator_1_desc: "Các cụm bong bóng hình thấu kính hội tụ ánh sáng mặt trời qua dung dịch nuôi cấy giàu tảo, chuyển hóa và lưu trữ năng lượng để sử dụng sau này."
 building_bioelectric_stimulator_2: "Bộ Gia Tốc Lục Lạp"
 building_bioelectric_stimulator_2_desc: "Những bong bóng thủy tinh chứa đầy tảo quang hợp tận dụng năng lượng mặt trời để tạo ra các liên kết sinh hóa chặt chẽ hơn, giảm thiểu sự tự tiêu hao năng lượng."
 building_bioelectric_stimulator_3: "Mảng Thấu Kính Lục Lạp"
 building_bioelectric_stimulator_3_desc: "Những cành cây đối trọng gắn bộ thu gom năng lượng mặt trời có thể nâng lên hạ xuống tùy theo nhu cầu và sản lượng phát điện, tạo thành một hệ thống đáng tin cậy."
 building_bioelectric_stimulator_4: "Bao Nang Lục Lạp"
 building_bioelectric_stimulator_4_desc: "Những túi thủy tinh chứa đầy tảo này có thể di chuyển và sinh sôi tại nơi cần năng lượng nhất, gần như loại bỏ nhu cầu truyền tải điện đường dài."

 building_churning_tunnels_1: "Mũi Khoan Đá"
 building_churning_tunnels_1_desc: "Chất thực vật có độ cứng gần như tinh thể xuyên phá qua các điểm khai thác hiện có để chiết xuất thêm nhiều khoáng sản hữu ích."
 building_churning_tunnels_2: "Bộ Lọc Đá"
 building_churning_tunnels_2_desc: "Các quần thể màng sinh học bán thấm thu gom các khoáng chất quý giá vốn có thể bị cuốn trôi trong dòng chảy khai thác chất lỏng."
 building_churning_tunnels_3: "Máy Nghiền Đá"
 building_churning_tunnels_3_desc: "Các tấm nghiền và hàm kẹp mạnh mẽ giúp nghiền nát vật chất đất đá thành bùn hóa học để chiết xuất khoáng sản dễ dàng hơn."
 building_churning_tunnels_4: "Bể Lọc Khoáng"
 building_churning_tunnels_4_desc: "Sự phối hợp nhịp nhàng giữa máy nghiền, tác nhân sinh hóa và màng sinh học cho phép xử lý và tinh chế khoáng sản ngay tại chỗ tại bất kỳ mạch khoáng giàu có nào."

 building_natural_furnace_0: "Hồ Nấu Chảy"
 building_natural_furnace_0_desc: "Các thể cộng sinh ưa nhiệt làm việc miệt mài bên trong và xung quanh nguồn nhiệt tự nhiên này để sản xuất hợp kim chất lượng cao."
 building_natural_furnace_1: "Lò Nung Chảy"
 building_natural_furnace_1_desc: "Các cấu trúc sinh trưởng chịu nhiệt cho phép tận dụng nhiệt lượng hiệu quả hơn, tạo ra hợp kim thượng hạng."
 building_natural_furnace_2: "Lò Nấu Ánh Sáng Thể Rắn"
 building_natural_furnace_2_desc: "Các lò nung hữu cơ-đá tinh vi sử dụng công nghệ toàn ảnh có khả năng sản xuất các hợp kim đa năng có độ bền vượt trội."
 building_natural_furnace_3: "Lò Nấu Nano"
 building_natural_furnace_3_desc: "Các sinh vật nano ưa nhiệt cư ngụ trong các bể nung rực lửa này giúp loại bỏ mọi tạp chất gây hại khỏi hợp kim."

 building_avatar_chamber_1: "Cái Nôi Hóa Thân"
 building_avatar_chamber_1_desc: "Một cơ quan chớm nở nơi Hoang Dã bắt đầu hình thành những hình thái cơ bản. Xây dựng cho nó một hình hài có thể thích nghi với sự sống xa lạ bên ngoài sinh quyển gốc."
 building_avatar_chamber_2: "Phòng Hóa Thân"
 building_avatar_chamber_2_desc: "Các cơ thể mô phỏng được nuôi cấy và định hình qua các thử nghiệm nội bộ, bắt chước các sinh vật và hệ sinh thái ngoại lai. Tri thức thu được bằng cách hòa nhập với cái chưa biết."
 building_avatar_chamber_2_effect: "$building_avatar_chamber_1$ sản xuất thêm §G200§! £amenities£ Tiện nghi"
 building_avatar_chamber_3: "Rừng Hóa Thân"
 building_avatar_chamber_3_desc: "Cơ quan trải rộng này truyền tải các khuôn mẫu hóa thân được định hình theo các dạng hình thái và cảnh quan ngoài hành tinh."
 building_avatar_chamber_3_effect: "$building_avatar_chamber_1$ sản xuất thêm §G400§! £amenities£ Tiện nghi"
 building_avatar_chamber_4: "Vỏ Não Hóa Thân"
 building_avatar_chamber_4_desc: "Một cỗ máy hiện thân cấp hành tinh, có khả năng mô phỏng toàn bộ các nền văn minh, hệ sinh thái ngoại chủng và môi trường cực đoan."
 building_avatar_chamber_4_effect: "$building_avatar_chamber_1$ sản xuất thêm §G800§! £amenities£ Tiện nghi"

 building_mote_aggravator: "Bộ Tiêu Hóa Hóa Học"
 building_mote_aggravator_desc: "Một hệ thống thanh lịch gồm các mô mạch và quá trình trao đổi chất giúp chuyển hóa vật chất đất đá thông thường thành $volatile_motes$."

 building_churning_stomach: "Bộ Lọc Khí Kỳ Dị"
 building_churning_stomach_desc: "Các vi sinh vật và sinh vật nano chuyên hóa cao phản ứng với các hạt lơ lửng thông thường để tạo ra loại $exotic_gases$ tinh khiết này."

 building_crystal_growth: "Vỉa Tinh Thể"
 building_crystal_growth_desc: "Các vòm che đặc biệt điều hòa nhiệt độ và độ ẩm chính xác để tạo điều kiện nuôi cấy nhân tạo các $rare_crystals$."

 building_planetary_carapace: "Đồn Trú Xương Thép"
 building_planetary_carapace_desc: "Trường thử nghiệm dạng kén này có thể là nơi trú ngụ của vô số thể cộng sinh có ý thức lãnh thổ mãnh liệt, luôn sẵn sàng chiến đấu để bảo vệ thế giới."
 mod_planet_building_planetary_carapace_build_speed_mult: "Tốc độ xây dựng $building_planetary_carapace$"
 building_planetary_carapace_2: "Pháo Đài Xương Thép"
 building_planetary_carapace_2_desc: "Cơ sở rộng lớn này sở hữu các sân tập kiên cố và chỗ ở hoàn chỉnh, bảo đảm lực lượng đồn trú phòng thủ có thể chống cự trước bất kỳ kẻ xâm lược nào."

 building_ozone_thickener: "Mái Vòm Khiên Hành Tinh"
 building_ozone_thickener_desc: "$tech_planetary_shield_generator_desc$"

 building_subterranean_cache: "Kho Chứa Dưới Lòng Đất"
 building_subterranean_cache_desc: "$building_resource_silo_desc$"

 building_cradle_of_rebirth: "Cái Nôi Tái Sinh"
 building_cradle_of_rebirth_desc: "Cắm rễ sâu vào lòng đất, cấu trúc này chuyển hóa vật chất mục rữa và con mồi bắt được thành sinh khối, nuôi dưỡng sự sống mới bằng những nhịp đập thầm lặng."

 building_wilderness_storm_relief: "$building_storm_resistant_production$"
 building_wilderness_storm_relief_desc: "Một vòm tán rộng gồm các tán lá cứng cáp có mang điện sinh học, bảo đảm an toàn cho các thể cộng sinh xung quanh trước các cơn bão vũ trụ."
 building_wilderness_storm_relief_tt: "Giảm bớt §G100%§! hiệu ứng tiêu cực từ §Y$default_storm$§! lên sản lượng hành tinh."

 holding_wilderness_glade: "Khu Rừng Hoang Dã"
 holding_wilderness_glade_plural: "Các Khu Rừng Hoang Dã"
 holding_wilderness_glade_desc: "Một vùng Hoang Dã cộng sinh màu mỡ kết nối mờ nhạt với quần thể mẹ. Mặc dù phụ thuộc vào nguồn thức ăn địa phương, nó tạo ra mối liên kết hài hòa giữa hai thế giới."
 holding_wilderness_glade_effect_desc: "Chư hầu chuyển [owner.WildernessGladeProvides] thành $r_basic_plural$ cho Tông chủ.\nTông chủ giảm $mod_planet_jobs_productive_upkeep_mult$ trên thế giới Chư hầu.\nMột £blocker£ §Y$holding_wilderness_glade$§! xuất hiện trên hành tinh, chiếm một Ô Khu quy hoạch."
 no_free_district_for_wilderness_glade: "$TRIGGER_FAIL$§RKhông có Khu quy hoạch trống trên hành tinh này cho quần xã thu nhỏ của chúng ta.§!"
 blocker_tied_to_wilderness_glade: "$TRIGGER_FAIL$§RChướng ngại này sẽ tồn tại chừng nào §Y$holding_wilderness_glade$§! còn hoạt động.§!"
 d_wilderness_glade_blocker: "$d_wilderness_root_blocker$"
 d_wilderness_glade_blocker_desc: "Cần có cấu trúc rễ đáng kể để nâng đỡ $holding_wilderness_glade$ lân cận."
 holding_wilderness_glade_modifier: "Các Khu Rừng Hoang Dã Phân Tán"
 holding_wilderness_glade_modifier_desc: "Các thế giới chư hầu hòa nhịp cùng Hoang Dã của chúng ta, mỗi đối tác cùng chia sẻ sự trù phú tương hỗ lẫn nhau." # appears in 'lore brown'
 holding_wilderness_glade_modifier_tt: "Số lượng thay đổi tùy theo số lượng thế giới Chư hầu đặt §Y$holding_wilderness_glade_plural$§!."

