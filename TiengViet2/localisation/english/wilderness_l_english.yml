 district_craglands: "Quần Xã Chung Sống"
 district_craglands_plural: "Các Quần Xã Chung Sống"
 district_craglands_desc: "Những lùm cây tươi tốt này cung cấp nơi trú ẩn cho các thể cộng sinh, những sinh vật vừa nhào nặn Hoang Dã vừa phụ thuộc vào sự tồn tại của nó."
 mod_district_craglands_max_add: "Tối đa $district_craglands_plural$"
 mod_planet_district_craglands_build_speed_mult: "Tốc độ xây dựng $district_craglands$"

 district_orchard_forests: "Rừng Cây Trái"
 district_orchard_forests_plural: "Các Rừng Cây Trái"
 district_orchard_forests_desc: "Các khu vực dành riêng cho việc canh tác và săn bắt, cung cấp từ thức ăn tế bào, ngũ cốc ăn được cho đến các thể cộng sinh săn mồi."
 mod_district_orchard_forests_max_add: "Tối đa $district_orchard_forests_plural$"
 mod_planet_district_orchard_forests_build_speed_mult: "Tốc độ xây dựng $district_orchard_forests$"

