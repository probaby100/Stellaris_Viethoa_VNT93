 START_SCREEN_WILDERNESS_INTRO: "Từ thuở ký ức xa xôi nhất, [root.GetHomeWorldName] đã luôn là chính thế giới này: một mạng lưới rễ cây, dây leo và các giác quan trải rộng khắp bề mặt hành tinh, nuôi dưỡng và bảo vệ vô vàn dạng sống cộng sinh trong vòng tay ấm áp của mình."
 START_SCREEN_WILDERNESS_DEFAULT: "[root.GetHomeWorldName] cảm nhận được sức nóng rực rỡ và ánh sáng chói lọi từ các vì sao. Giờ đây, khi các bào tử của chúng ta đã sẵn sàng bay vào vũ trụ, chúng ta sẽ mở rộng khu vườn sinh thái vĩ đại này ra khắp thiên hà."
 START_SCREEN_WILDERNESS_COLD: "[root.GetHomeWorldName] cảm nhận được ánh sáng sắc lạnh và băng giá rực rỡ. Bất chấp sự buốt giá của không gian, ngọn lửa của sự sống bên trong chúng ta sẽ thắp sáng mọi thế giới băng giá."
 START_SCREEN_WILDERNESS_DRY: "[root.GetHomeWorldName] cảm nhận được bầu không khí khô rát và gió bụi sa mạc. Sự kiên cường của chúng ta trong điều kiện khắc nghiệt sẽ là nền móng để sinh sôi trên những mảnh đất cằn cỗi nhất."
 START_SCREEN_WILDERNESS_WET: "[root.GetHomeWorldName] cảm nhận được tiếng gọi của đại dương và những cơn mưa tầm tã. Dòng chảy sinh mệnh của chúng ta sẽ tưới mát cho mọi hành tinh trong vũ trụ."
 START_SCREEN_WILDERNESS_OUTRO: "Cơn đau đã đánh thức chúng ta. Lần đầu tiên chúng ta nhận thức được sự mong manh của chính mình. Vũ trụ đầy rẫy hiểm nguy, nhưng cũng chất chứa những điều kỳ diệu. Chúng ta sẽ vươn những chiếc rễ của mình ra các vì sao!"

