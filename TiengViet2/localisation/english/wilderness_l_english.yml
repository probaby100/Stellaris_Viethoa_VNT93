 col_wilderness_mining: "Quần Xã Khai Khoáng"
 col_wilderness_mining_desc: "$col_mining_desc$"
 col_wilderness_mining_tt: "Đào bới dưới bề mặt tưởng chừng cằn cỗi của hành tinh này là một bản hòa tấu sự sống dưới lòng đất, háo hức khai thác nguồn khoáng sản trù phú."
