####################################
# Zones
####################################
zone_urban_wilderness: "Tâm Rừng"
zone_urban_wilderness_desc: "Một lõi sinh khối và bản năng đập rộn ràng. Nó liên tục mở rộng và tái cấu trúc, cho phép Hoang Dã bén rễ sâu và rộng tại nơi đây."

zone_foundry_wilderness: "Ruột Nóng Chảy"
zone_foundry_wilderness_desc: "Buồng nhiệt này khuấy động đá nóng chảy và sức mạnh nguyên tố. $job_forgesymbiont_plural$ luyện nên hợp kim từ nguồn năng lượng này."

zone_research_wilderness: "Cuống Tư Duy"
zone_research_wilderness_desc: "Một hạch rễ thần kinh và hoa biến dị vươn cao. $job_evosymbiont_plural$ giải mã các quy luật tự nhiên tại đây."

zone_unity_wilderness: "Vách Đá Hòa Âm"
zone_unity_wilderness_desc: "Những cấu trúc cao vút lồng ghép xương rỗng và thịt đá, nơi ngọn gió mang các âm sắc nhiều tầng lớp băng qua bề mặt hành tinh. Tại đây, các $job_choirsymbiont_plural$ tụ họp lại, để chính thế giới cất lên tiếng hát."

zone_fortress_wilderness: "Nụ Chỉ Huy"
zone_fortress_wilderness_desc: "Một hạch cảm giác căng tràn, nơi các $job_tamersymbiont_plural$ tụ họp để điều phối các nỗ lực phòng thủ."

zone_minerals_wilderness: "Sống Núi Quặng"
zone_minerals_wilderness_desc: "Một cấu trúc đá sống cao vút có gờ rãnh, vừa là ngọn núi vừa là một cơ quan sống, liên tục kết tinh khoáng sản."

zone_energy_wilderness: "Phổi Nấm Quang Năng"
zone_energy_wilderness_desc: "Những cánh đồng mô quang hợp rộng lớn phồng lên cùng ánh sáng mặt trời thu nhận được, tích tụ áp lực cho đến khi chúng thở ra theo từng đợt nhịp nhàng. Từ các xung bức xạ này, $job_photosymbiont_plural$ được phóng vào bầu trời, cưỡi các luồng khí nhiệt đuổi theo vòng cung của các vì sao."

zone_food_wilderness: "Vườn Nở Rộ"
zone_food_wilderness_desc: "Một bộ não thơm ngát kết từ cánh hoa và pheromone, dệt nên những lộ trình thụ phấn như sợi chỉ trên khung cửi gấm vóc."

zone_research_unity_wilderness: "Lõi Hài Hòa"
zone_research_unity_wilderness_desc: "Một cơ quan nhịp điệu tại trung tâm của Hoang Dã, nơi tư tưởng dao động qua ký ức và tri thức."

zone_trade_wilderness: "Lộ Trình Sợi"
zone_trade_wilderness_desc: "Những vòng sợi, chi cuộn tròn và túi dự trữ tạo nên một trung tâm hậu cần không mệt mỏi, nơi $job_spindlesymbiont_plural$ vận hành nhịp nhàng."

####################################
# Decisions
####################################
 decision_wilderness_expand: "Mở Rộng Quy Mô Hành Tinh"
 decision_wilderness_expand_desc: "Tái hấp thu lượng sinh khối tinh khiết mà chúng ta đã thu thập để nuôi dưỡng và mở rộng thế giới của mình."
 decision_wilderness_mastery_over_nature_desc: "Bản thể tập thể của chúng ta cần không gian để phát triển, và chúng ta sẽ khai mở không gian đó bằng cách hòa nhập hoàn toàn vào địa chất của thế giới này."

