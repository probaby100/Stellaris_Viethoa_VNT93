 WILDERNESS: "Sinh Thể Hoang Dã"

####################################
# Deposits
####################################
 d_wilderness_mining: "Hệ Thống Hang Động Rỗng"
 d_wilderness_mining_desc: "Các dạng sống từng chiếm giữ thế giới này đã vội vã từ bỏ các mỏ khoáng của họ, để lại nhiều đường hầm bị đào bới thô bạo nhưng giàu tiềm năng khai thác."
 d_wilderness_mining_2: "Cao Nguyên Rỗ Vết"
 d_wilderness_mining_2_desc: "Khu vực nguy hiểm này đầy rẫy đất đá phế thải và các hố sụt lún tiềm tàng, tàn tích từ hoạt động khai khoáng quy mô lớn trong quá khứ."
 d_wilderness_farming: "Rừng Cây Khô Cằn"
 d_wilderness_farming_desc: "Nơi từng là một khu rừng bạt ngàn màu mỡ nay chỉ còn lại những thân cây trơ trụi. Những cành cây khô héo không còn kết trái."
 d_wilderness_farming_2: "Rừng Cây Hóa Thạch"
 d_wilderness_farming_2_desc: "Tàn tích của một vùng đất rộng lớn từng trù phú tài nguyên rừng. Thảm thực vật và nấm phong phú bị hóa thạch trong thời gian ngắn."
 d_wilderness_generator: "Cánh Đồng Quang Năng Cháy Rụi"
 d_wilderness_generator_desc: "Vòm tán khô héo và thân cây giòn gãy là tất cả những gì còn sót lại của nông trại năng lượng mặt trời bị bỏ hoang này."
 d_wilderness_generator_2: "Vùng Hoang Tàn Quang Năng"
 d_wilderness_generator_2_desc: "Vùng đất rộng lớn này đầy rẫy những xác cây đầy gai nhọn của khu rừng quang năng từng một thời tươi tốt, để lại cảnh quan cằn cỗi."
 d_wilderness_city: "Đầm Lầy Hôi Thối"
 d_wilderness_city_desc: "Từng là môi trường sống hưng thịnh của muôn loài, nay bị bỏ hoang và biến thành một vũng bùn ô uế ngập tràn vi khuẩn độc hại."
 d_wilderness_city_2: "Vũng Bùn Thối Rữa"
 d_wilderness_city_2_desc: "Vô số dạng sống đa dạng đã bỏ mạng tại nơi đây. Xác chết mục rữa của chúng ngấm vào lòng đất, giải phóng lượng lớn khí ăn mòn độc hại."
 d_wilderness_industrial: "Vũng Lầy Kim Loại"
 d_wilderness_industrial_desc: "Tàn tích của nhiều bể ngâm khoáng sản lộ thiên, nơi chất lỏng đã trở nên độc hại và trơ cứng do sự sụp đổ của địa chất xung quanh."
 d_wilderness_industrial_2: "Vùng Đất Xấu Hóa Sinh"
 d_wilderness_industrial_2_desc: "Những hố trũng bằng đá và hẻm núi phủ đầy bụi hóa chất là dấu vết của khu vực chế biến khoáng sản bán hữu cơ từng trải dài ngút ngàn."

 d_scorched_plains: "Đồng Bằng Thiêu Rụi"
 d_scorched_plains_desc: "Khu vực này từng tràn đầy sự sống, cho đến khi bị tàn phá bởi sự bùng phát của siêu bão lửa bức xạ mặt trời."

 concept_scorched_plains: "$d_scorched_plains$"
