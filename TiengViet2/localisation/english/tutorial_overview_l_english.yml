  # Chapter 1
 HELP_TUTORIAL_SURVEYING_TITLE:0 "Khảo sát Hệ sao"
 HELP_TUTORIAL_SURVEYING_DESC:1 "§SKhảo sát§! các hệ sao khác là cách bạn khám phá thiên hà hiệu quả. Trong khi §SKhảo sát§! các hệ sao khác, bạn có thể phát hiện thêm các £planet£ §SHành tinh§! và những §STài nguyên§! tiềm năng.\n\nĐể khảo sát một hệ sao, hãy mở §SBản đồ Thiên hà§! (£m£), chọn một £science_ship£ §STàu Khoa học§!, nhấp chuột phải vào một hệ sao lân cận và chọn \"Khảo sát Hệ sao\"."
 HELP_TUTORIAL_SURVEYING_INSTRUCTIONS:0 "§Y1.§! Chọn một Tàu Khoa học.\n§Y2.§! Chỉ định một Nhà khoa học lên tàu nếu cần.\n§Y3.§! Nhấp chuột phải vào mũi tên chỉ tới các hệ sao lân cận.\n§Y4.§! Chọn \"Khảo sát Hệ sao\""
  # If player has a science ship, then select and pan to it when clicked (if more than 1, select the first one). Else, disable button with tooltip "You have no science ships."
 HELP_TUTORIAL_SURVEYING_ACTION:0 "Đi tới Tàu Khoa học"
 HELP_TUTORIAL_ANOMALIES_TITLE:0 "Nghiên cứu Hiện tượng Dị thường"
 HELP_TUTORIAL_ANOMALIES_DESC:0 "§SHiện tượng dị thường§! là những điều kỳ thú mà bạn có thể khám phá khi §SKhảo sát§! các hệ sao khác. Nghiên cứu chúng thường (nhưng không phải luôn luôn) mang lại những sự kiện có lợi cho §SĐế chế§! của bạn.\n\nThời gian cần thiết để §SNghiên cứu§! một dị thường phụ thuộc vào cấp độ khó của nó và kỹ năng của §SNhà khoa học§! được chỉ định. Bạn có thể sử dụng §SNhật ký Tình hình§! (£f2£) ở thanh thực đơn bên trái để quay lại các §SHiện tượng dị thường§! mà bạn chưa nghiên cứu."
 HELP_TUTORIAL_ANOMALIES_INSTRUCTIONS:0 "§Y1.§! Khảo sát các Hệ sao xung quanh để tìm Hiện tượng dị thường.\n§Y2.§! Mở Nhật ký Tình hình trên thanh điều hướng bên trái.\n§Y3.§! Chọn một Hiện tượng dị thường khả dụng và chỉ định Nhà khoa học tới nghiên cứu."
 HELP_TUTORIAL_ANOMALIES_ACTION:0 "Mở Nhật ký Tình hình"
 HELP_TUTORIAL_TECHNOLOGY_TITLE:0 "Nghiên cứu Công nghệ"
 HELP_TUTORIAL_TECHNOLOGY_DESC:0 "Công nghệ được chia thành 1 trong 3 lĩnh vực:\n£physics£ §SVật lý học§!, £society£ §SXã hội học§!, và £engineering£ §SKỹ thuật học§!.\n\nBạn có thể nghiên cứu một công nghệ trong từng lĩnh vực cùng một lúc.\nTốc độ §SNghiên cứu§! của bạn dựa trên lượng điểm §SNghiên cứu§! mà Đế chế tạo ra, được sản xuất bởi các £building£ §SCông trình§! và £district£ §SKhu hành chính§! trên các £planet£ §SHành tinh§! đã thuộc địa hóa, cùng các §STrạm Nghiên cứu§! trong các hệ sao thuộc quyền sở hữu."
 HELP_TUTORIAL_TECHNOLOGY_INSTRUCTIONS:1 "§Y1.§! Mở $topbar_button_technology_name$ từ thanh điều hướng bên trái.\n§Y2.§! Nhấp vào bất kỳ ô trống nào và chọn một công nghệ từ danh sách để bắt đầu nghiên cứu."
 HELP_TUTORIAL_TECHNOLOGY_ACTION:0 "Mở Giao diện Công nghệ"
 HELP_TUTORIAL_SPACE_STATION_TITLE:0 "Mở rộng bằng Căn cứ sao"
 HELP_TUTORIAL_SPACE_STATION_DESC:0 "Phương thức hữu hiệu nhất để mở rộng biên giới Đế chế của bạn là thông qua việc xây dựng các §SCăn cứ sao§! (Tiền đồn). Điều này chỉ có thể thực hiện tại các hệ sao đã được §SKhảo sát§! hoàn chỉnh.\n\nĐể xây dựng Căn cứ sao, hãy ra lệnh cho một £construction_ship£ §STàu Xây dựng§! tiến hành xây một §SCăn cứ sao§!. Sự hiện diện của một §SCăn cứ sao§! cho phép bạn tiếp tục xây dựng các §STrạm Nghiên cứu§! và §STrạm Khai mỏ§!, cũng như thuộc địa hóa bất kỳ £planet£ §SHành tinh§! có thể sinh sống nào trong hệ sao."
 HELP_TUTORIAL_SPACE_STATION_INSTRUCTIONS:2 "§Y1.§! Mở Giao diện Thiên hà bằng cách nhấp vào nút ở chính giữa phía dưới màn hình.\n§Y2.§! Chọn một tàu xây dựng từ nút ở góc dưới bên trái màn hình.\n§Y3.§! Nhấp chuột phải vào một hệ sao chưa có chủ quyền và chọn \"Xây một tiền đồn\"."
  # If player has a construction ship, then select and pan to it when clicked (if more than 1, select the first one). Else, disable button with tooltip "You have no construction ships."
 HELP_TUTORIAL_SPACE_STATION_ACTION:0 "Đi tới Tàu Xây dựng"
 HELP_TUTORIAL_COLONIZATION_TITLE:0 "Thuộc địa hóa Hành tinh"
 HELP_TUTORIAL_COLONIZATION_DESC:0 "Thuộc địa hóa các hành tinh khác cho phép £pop£ §SDân số§! của bạn vươn rộng ra ngoài hành tinh ban đầu và đem lại cho bạn quyền khai thác thêm nhiều §STài nguyên§! cho §SĐế chế§!. Một số £planet£ §SHành tinh§! nhìn chung có khả năng sinh sống tốt hơn những hành tinh khác, vì vậy hãy cân nhắc kỹ nơi bạn thiết lập các £colony_ship£ §SThuộc địa§! mới.\n\nĐể thuộc địa hóa một hành tinh có thể sinh sống, hành tinh đó phải nằm trong biên giới Đế chế của bạn và đã được một £science_ship£ §STàu Khoa học§! khảo sát hoàn chỉnh."
 HELP_TUTORIAL_COLONIZATION_INSTRUCTIONS:1 "§Y1.§! Chọn xưởng đóng tàu của bạn trong Bảng tổng quan (bên phải màn hình).\n§Y2.§! Chọn thẻ Xưởng đóng tàu ở dưới cùng của cửa sổ Xưởng đóng tàu.\n§Y3.§! Đóng một Tàu Thuộc địa.\n§Y4.§! Chọn một hành tinh có thể sinh sống và nhấp vào \"Thuộc địa hóa\"."
  # If player has found a habitable planet, then select and pan to it when clicked (if more than 1, select the first one). Else, disable button with tooltip "You have not found any habitable planet".
 HELP_TUTORIAL_COLONIZATION_ACTION:0 "Đi tới Hành tinh Khả cư"
 HELP_TUTORIAL_EXCAVATION_TITLE:0 "Khai quật Di chỉ Khảo cổ"
 HELP_TUTORIAL_EXCAVATION_DESC:0 "Các £archaeology£ §SDi chỉ Khảo cổ§! có thể được phát hiện trong quá trình §SKhảo sát§! hoặc được khám phá sau khi một £planet£ §SHành tinh§! đã được thuộc địa hóa.\n\nChỉ cần một §SDi chỉ Khảo cổ§! nằm trong biên giới của một §SĐế chế§!, §SĐế chế§! đó có thể giao nhiệm vụ cho một £science_ship£ §STàu Khoa học§! khai quật di chỉ. Thời gian khai quật được quyết định bởi mức độ khó của §SDi chỉ Khảo cổ§! đó."
 HELP_TUTORIAL_EXCAVATION_INSTRUCTIONS:2 "§Y1.§! Mở Nhật ký Tình hình trên thanh điều hướng bên trái hoặc nhấn phím F2.\n§Y2.§! Trong thẻ đánh dấu Nhật ký Tình hình, chọn một dự án khảo cổ (Biểu tượng cái xẻng cắm trên đống đất).\n§Y3.§! Sử dụng nút \"đi tới\" để di chuyển tới di chỉ khảo cổ.\n§Y4.§! Chọn một Tàu Khoa học từ nút ở góc dưới bên trái màn hình.\n§Y5.§! Nhấp chuột phải vào biểu tượng cái xẻng và chọn \"khai quật di chỉ\".\n§Y6.§! Chọn một Di chỉ Khảo cổ.\n§Y7.§! Bắt đầu dự án."
 HELP_TUTORIAL_EXCAVATION_ACTION:0 "Mở Nhật ký Tình hình"

  # Chapter 2
 HELP_TUTORIAL_BASIC_RESOURCES_TITLE:0 "Tài nguyên Cơ bản"
 HELP_TUTORIAL_BASIC_RESOURCES_DESC:0 "Tài nguyên Cơ bản bao gồm £energy£ §SNăng lượng Tín dụng§!, £minerals£ §SKhoáng sản§! và £food£ §SLương thực§!.\n\nNhững tài nguyên này được sản xuất chủ yếu bởi các £building£ §SCông trình§! trên các £planet£ §SHành tinh§! của bạn hoặc bởi các §STrạm Khai mỏ§!. Tất cả tài nguyên cơ bản đều được thu thập và tích trữ theo từng tháng, do đó cần được nhanh chóng do thám, khai thác và phát triển."
 HELP_TUTORIAL_BASIC_RESOURCES_INSTRUCTIONS:1 "§Y1.§! Chọn Tàu Xây dựng trong Bảng tổng quan (bên phải màn hình).\n§Y2.§! Mở Giao diện Thiên hà (phía dưới màn hình).\n§Y3.§! Chọn một hệ sao đã xác lập chủ quyền và nhấp chuột phải vào đó.\n§Y4.§! Chọn Xây dựng các Trạm Khai mỏ"
 HELP_TUTORIAL_BASIC_RESOURCES_ACTION:0 ""
 HELP_TUTORIAL_ADVANCED_RESOURCES_TITLE:0 "Tài nguyên Nâng cao"
 HELP_TUTORIAL_ADVANCED_RESOURCES_DESC:0 "Tài nguyên Nâng cao bao gồm £alloys£ §SHợp kim§! và £consumer_goods£ §SHàng tiêu dùng§!.\nChúng được tinh chế từ £minerals£ §SKhoáng sản§! bởi các £building£ §SCông trình§! và £district£ §SKhu hành chính§! trên các £planet£ §SHành tinh§! đã thuộc địa hóa.\n\n£alloys£ §SHợp kim§! có ứng dụng quân sự, cần thiết để đóng Tàu và xây Căn cứ sao. £consumer_goods£ §SHàng tiêu dùng§! đại diện cho nhiều thiết bị, hàng xa xỉ và nhu yếu phẩm cần thiết để giữ cho £pop£ §SDân số§! của bạn luôn hài lòng."
 HELP_TUTORIAL_ADVANCED_RESOURCES_INSTRUCTIONS:0 "§Y1.§! Chọn một Hành tinh (có trong Bảng tổng quan ở bên phải màn hình).\n§Y2.§! Nhấp vào một Ô Công trình còn trống.\n§Y3.§! Xây dựng Lò Đúc Hợp Kim."
 HELP_TUTORIAL_ADVANCED_RESOURCES_ACTION:0 ""
 HELP_TUTORIAL_ABSTRACT_RESOURCES_TITLE:0 "Tài nguyên Trừu tượng"
 HELP_TUTORIAL_ABSTRACT_RESOURCES_DESC:0 "Tài nguyên Trừu tượng đại diện cho các tài sản phi vật thể như £influence£ §SẢnh hưởng§! và £unity£ §SĐoàn kết§!.\n\n£influence£ §SẢnh hưởng§! đạt được bằng việc coi các Đế chế khác là §SKình địch§! hoặc §SBảo hộ quốc§!. Ảnh hưởng thường được dùng để mở rộng biên giới thông qua các §SCăn cứ sao§! và §SYêu sách§! hoặc để ban hành các §SPháp lệnh§!.\n\n£unity£ §HĐoàn kết§! chủ yếu thu được từ các công trình hành tinh, và được dùng để tiếp nhận các §STruyền thống§! mới."
 HELP_TUTORIAL_STRATEGIC_RESOURCES_TITLE:0 "Tài nguyên Chiến lược"
 HELP_TUTORIAL_STRATEGIC_RESOURCES_DESC:0 "Tài nguyên Chiến lược rất quý hiếm và cần thiết để xây dựng cũng như duy trì các công trình nâng cao cùng các linh kiện tàu vũ trụ. Chúng khó tìm kiếm hơn nhiều so với tài nguyên cơ bản, vì vậy có giá trị rất cao. Các mỏ tài nguyên chiến lược tự nhiên luôn có thể quan sát thấy nhưng cần có các §SCông nghệ§! cụ thể mới có thể tiến hành khai thác."
 HELP_TUTORIAL_TRADE_VALUE_TITLE:0 "Thương mại"
 HELP_TUTORIAL_TRADE_VALUE_DESC:1 "£trade£ §SThương mại§! bắt nguồn từ hoạt động kinh tế đời thường của người dân.\n\nNếu được kết nối với £planet£ §SHành tinh Thủ đô§! thông qua một §STuyến Thương mại§!, §SCăn cứ sao§! sẽ cung cấp lượng $r_trade$ §SThương mại§! của một hệ sao dưới dạng £energy£ §SNăng lượng Tín dụng§!, £consumer_goods£ §SHàng tiêu dùng§! hoặc £unity£ §SĐoàn kết§!, dựa trên chính sách thương mại của §SĐế chế§!."
 HELP_TUTORIAL_TRADE_VALUE_INSTRUCTIONS:2 "§Y1.§! Mở Giao diện Thiên hà bằng cách nhấp vào nút ở chính giữa phía dưới màn hình.\n§Y2.§! Chọn một Tàu Xây dựng trong Bảng tổng quan (bên phải màn hình) hoặc ở thẻ góc dưới bên trái.\n§Y3.§! Nhấp chuột phải vào một hệ sao chưa có chủ quyền và chọn \"Xây một tiền đồn\"."
 HELP_TUTORIAL_TRADE_VALUE_ACTION:0 ""
 HELP_TUTORIAL_TRADE_VALUE_DISBLAED_ACTION:0 ""
 HELP_TUTORIAL_PLANET_MANAGEMENT_TITLE:0 "Quản lý Hành tinh"
 HELP_TUTORIAL_PLANET_MANAGEMENT_DESC:0 "Quản lý Hành tinh bao gồm £district£ §STạo lập Khu quy hoạch§!, £building£ §SXây dựng Công trình§!, quản lý £pop£ §SDân số§! cùng sự gia tăng dân số, cũng như thiết lập các lực lượng đồn trú để phòng thủ hành tinh.\n\nCác £planet£ §SHành tinh§! là một phần sống còn của một §SĐế chế§! thiên hà vì chúng cung cấp đại đa số §STài nguyên§! và £pop£ §SDân số§! cần thiết để một §SĐế chế§! phát triển và phồn vinh."
 HELP_TUTORIAL_PLANET_MANAGEMENT_INSTRUCTIONS:1 "§Y1.§! Chọn một hành tinh (khả dụng trong Bảng tổng quan ở bên phải màn hình).\n§Y2.§! Nhấp vào một Ô Công trình còn trống.\n§Y3.§! Xây dựng Hầm Chứa Tài Nguyên."
 HELP_TUTORIAL_PLANET_MANAGEMENT_ACTION:0 "Đi tới Hành tinh Thủ đô"
 HELP_TUTORIAL_SHIPS_TITLE:0 "Đóng Tàu Vũ trụ"
 HELP_TUTORIAL_SHIPS_DESC:0 "Mọi tàu vũ trụ đều được đóng và sửa chữa tại các §SCăn cứ sao§! có trang bị một §SMô-đun Xưởng đóng tàu§!. Tàu vũ trụ được phân thành tàu tiện ích và tàu chiến.\n\nTàu tiện ích bao gồm £science_ship£ §STàu Khoa học§!, £construction_ship£ §STàu Xây dựng§! và \n£colony_ship£ §STàu Thuộc địa§!.\n\n§STàu Chiến§! đại diện cho tất cả các tàu vũ trang của Đế chế, và không giống như tàu tiện ích, chúng có thể được biên chế cùng nhau thành các §SHạm đội§! do một §SĐô đốc§! chỉ huy."
 HELP_TUTORIAL_SHIPS_INSTRUCTIONS:1 "§Y1.§! Chọn Xưởng đóng tàu (khả dụng trong Bảng tổng quan ở bên phải màn hình).\n§Y2.§! Nhấp vào thẻ Xưởng đóng tàu.\n§Y3.§! Đóng một Tàu Khoa học."
  # Possibly "cheat" here and simply go to starbase in capital system
  # If player has a starbase with a shipyard, then select and pan to it on click. Else, disable button with tooltip "You have no starbases with a shipyard"
 HELP_TUTORIAL_SHIPS_ACTION:0 "Đi tới Căn cứ sao có Xưởng đóng tàu"

  # Chapter 3
 HELP_TUTORIAL_FIRST_CONTACT_TITLE:0 "Tiến hành Tiếp xúc Đầu tiên"
 HELP_TUTORIAL_FIRST_CONTACT_DESC:1 "Khi chạm trán một loài ngoài hành tinh mới lần đầu tiên, một phái viên cần phải hoàn thành một chuỗi thử thách. Cách bạn lựa chọn xử lý các thử thách này sẽ ảnh hưởng đến thiện cảm của họ đối với Đế chế của bạn."
 HELP_TUTORIAL_FIRST_CONTACT_INSTRUCTIONS:1 "§Y1.§! Thám hiểm thiên hà cho đến khi bạn chạm trán một Đế chế khác.\n§Y2.§! Mở Nhật ký Tình hình và chọn sự kiện tiếp xúc.\n§Y3.§! Chỉ định một phái viên để thiết lập các kênh ngoại giao với Đế chế đó."
 HELP_TUTORIAL_FIRST_CONTACT_ACTION:0 "Mở Giao diện Ngoại giao"
 HELP_TUTORIAL_PRIMITIVE_SPECIES_TITLE:1 "Chạm trán Loài Tiền FTL"
 HELP_TUTORIAL_PRIMITIVE_SPECIES_DESC:0 "Một số nền văn minh vẫn chưa phát triển được §SCông nghệ§! cần thiết để du hành không gian giữa các vì sao. Bằng cách xây dựng một §STrạm Quan sát§! trên quỹ đạo quanh £planet£ §SHành tinh§! của họ, bạn có thể chọn quan sát và nghiên cứu họ để nhận thêm điểm £society£ §SNghiên cứu Xã hội học§!. Hoặc bạn có thể chọn khai hóa họ bằng công nghệ vượt trội của mình.\n\nCác loài được khai hóa sẽ trở thành một phần của Đế chế đã khai hóa họ, đồng thời thưởng thêm 500 điểm £influence£ §SẢnh hưởng§!."
 HELP_TUTORIAL_PRIMITIVE_SPECIES_INSTRUCTIONS:1 "§Y1.§! Chọn Tàu Xây dựng (khả dụng trong Bảng tổng quan ở bên phải màn hình)\n§Y2.§! Mở Giao diện Thiên hà (dưới cùng màn hình).\n§Y3.§! Nhấp chuột phải vào hệ sao nơi một loài nguyên thủy sinh sống.\n§Y4.§! Chọn Xây dựng Trạm Quan sát."
  # If player has met a primitive species, then select its planet when clicked. Else, disable button with tooltip "No primitive species encountered"
 HELP_TUTORIAL_PRIMITIVE_SPECIES_ACTION:1 "Đi tới một Loài Tiền FTL"
 HELP_TUTORIAL_ENVOYS_TITLE:0 "Bổ nhiệm Phái viên"
 HELP_TUTORIAL_ENVOYS_DESC:0 "§SPhái viên§! là các Nhà lãnh đạo cấp cơ sở và có thể được bổ nhiệm vào nhiều nhiệm vụ ngoại giao khác nhau, chẳng hạn như cải thiện mối quan hệ với một £empire£ §SĐế chế§! khác hoặc thiết lập liên lạc với các §SĐế chế§! mới phát hiện. Một khi §SPhái viên§! đã được giao nhiệm vụ, họ sẽ không thể được điều chuyển lại trong vòng một năm.\n\n§SPhái viên§! đóng vai trò sống còn trong việc điều hòa £opinion£ §SThiện cảm§! dành cho £empire£ §SĐế chế§! của bạn trong mắt các nền văn minh khác ngoài kia."
 HELP_TUTORIAL_ENVOYS_INSTRUCTIONS:0 "§Y1.§! Nhấp vào Liên lạc trên thanh điều hướng bên trái.\n§Y2.§! Chọn một Đế chế mà bạn muốn cải thiện quan hệ.\n§Y3.§! Nhấp vào Ngoại giao.\n§Y4.§! Nhấp vào Cải thiện Quan hệ."
 HELP_TUTORIAL_ENVOYS_ACTION:0 ""
 HELP_TUTORIAL_INTEL_TITLE:0 "Thu thập Tình báo"
 HELP_TUTORIAL_INTEL_DESC:1 "§STình báo§! có thể được sử dụng để làm suy yếu hoặc giành lợi thế trước các £empire£ §SĐế chế§! khác. Lượng thông tin mà một Đế chế nắm giữ về đối phương được thể hiện qua tài nguyên §STình báo§!.\n\nBạn càng nắm giữ nhiều §STình báo§! về một £empire£ §SĐế chế§! khác, thông tin bạn có sẽ càng trở nên chuẩn xác."
 HELP_TUTORIAL_INTEL_INSTRUCTIONS:0 "§Y1.§! Nhấp vào Liên lạc trên thanh điều hướng bên trái.\n§Y2.§! Chọn một Đế chế mà bạn muốn tìm hiểu thêm.\n§Y3.§! Nhấp vào Ngoại giao.\n§Y4.§! Nhấp vào Xây dựng Mạng lưới Gián điệp."
 HELP_TUTORIAL_INTEL_ACTION:0 ""
 HELP_TUTORIAL_GALACTIC_COMMUNITY_TITLE:0 "Gia nhập Cộng đồng Thiên hà"
 HELP_TUTORIAL_GALACTIC_COMMUNITY_DESC:1 "Những £empire£ §SĐế chế§! đã gặp gỡ phần lớn các nền văn minh du hành không gian khác sẽ được mời gia nhập Cộng đồng Thiên hà. Trở thành thành viên cho phép họ bỏ phiếu cho các đạo luật mới trong viện nguyên lão. Các đạo luật được thông qua sẽ bắt buộc thi hành đối với tất cả các thành viên còn lại."
 HELP_TUTORIAL_GALACTIC_COMMUNITY_INSTRUCTIONS:0 "Vậy là sự tự do lụi tàn như thế này đây...\n...trong tiếng vỗ tay như sấm rền."
 HELP_TUTORIAL_GALACTIC_COMMUNITY_ACTION:0 ""
 HELP_TUTORIAL_FALLEN_EMPIRES_TITLE:0 "Đế chế Sa ngã"
 HELP_TUTORIAL_FALLEN_EMPIRES_DESC:0 "Đế chế Sa ngã là tàn dư trì trệ của các cường quốc thiên hà thời xa xưa. Dù chỉ còn là cái bóng mờ nhạt của thời hoàng kim, họ vẫn sở hữu công nghệ vô cùng tiên tiến. Những vấn đề của thiên hà hầu như không gợi được sự hứng thú của họ, và họ hiếm khi mạo hiểm rời khỏi không gian của chính mình."

  # Chapter 4
 HELP_TUTORIAL_TRADITIONS_TITLE:0 "Tiếp nhận Truyền thống"
 HELP_TUTORIAL_TRADITIONS_DESC:0 "§STruyền thống§! được tiếp nhận bằng việc sử dụng £unity£ §HĐoàn kết§! và cho phép một Đế chế chuyên biệt hóa theo một hướng đi nhất định, chẳng hạn như quân sự và bành trướng nhanh, hoặc ngoại giao và thành lập liên bang.\n\nHoàn thành một §SCây Truyền thống§! cho phép £empire£ §SĐế chế§! chọn một §SĐặc quyền Thăng hoa§! để tiếp tục gia tăng sức mạnh cho bản thân."
 HELP_TUTORIAL_TRADITIONS_INSTRUCTIONS:0 "§Y1.§! Mở Quản lý Xã hội trên thanh điều hướng bên trái.\n§Y2.§! Chọn một Truyền thống để tiếp nhận."
 HELP_TUTORIAL_TRADITIONS_ACTION:0 "Mở Giao diện Truyền thống"
 HELP_TUTORIAL_POLICIES_TITLE:0 "Thiết lập Chính sách"
 HELP_TUTORIAL_POLICIES_DESC:0 "§SChính sách§! định hình thái độ của £empire£ §SĐế chế§! chúng ta đối với nhiều vấn đề khác nhau: Đế chế của chúng ta hiếu chiến đến mức nào, cách chúng ta đối xử với các công dân £pop£, điều gì chúng ta coi là chấp nhận được và điều gì không.\n\n§SChính sách§! khác với §SPháp lệnh§! ở chỗ chúng không tốn phí thực thi, nhưng có tác động đến việc các Đế chế khác nhìn nhận chúng ta như thế nào."
 HELP_TUTORIAL_POLICIES_INSTRUCTIONS:1 "§Y1.§! Mở Chính sách trên thanh điều hướng bên trái.\n§Y2.§! Nhấp vào Lập trường Ngoại giao.\n§Y3.§! Chọn một lập trường phù hợp với bạn."
 HELP_TUTORIAL_POLICIES_ACTION:0 "Mở Giao diện Chính sách"
 HELP_TUTORIAL_LEADERS_TITLE:0 "Bổ nhiệm Nhà lãnh đạo"
 HELP_TUTORIAL_LEADERS_DESC:1 "§SNhà lãnh đạo§! là các §SNhà khoa học§!, §SChỉ huy§!, và §SQuan chức§! của bạn.\n\nBạn được khuyên nên có các nhà lãnh đạo để chỉ huy các §SHạm đội Quân sự§!, quản lý các £planet£ §SHành tinh§! mới thuộc địa hóa và dẫn dắt các £science_ship£ §STàu Khoa học§! được cử đi làm nhiệm vụ thám hiểm."
 HELP_TUTORIAL_LEADERS_INSTRUCTIONS:0 "§Y1.§! Mở Lãnh đạo trên thanh điều hướng bên trái.\n§Y2.§! Chiêu mộ một Nhà khoa học để bạn có thể giao quyền chỉ huy một tàu khoa học mới sau này."
 HELP_TUTORIAL_LEADERS_ACTION:0 "Mở Giao diện Lãnh đạo"
 HELP_TUTORIAL_EDICTS_TITLE:0 "Ban hành Pháp lệnh"
 HELP_TUTORIAL_EDICTS_DESC:0 "Pháp lệnh là các bộ điều chỉnh Đế chế với chi phí cố định mà một Đế chế có thể chọn áp dụng. Các pháp lệnh mới phải được mở khóa thông qua nghiên cứu hoặc sự kiện. Các pháp lệnh duy trì liên tục có thể được kích hoạt hoặc hủy kích hoạt bất cứ lúc nào bằng cách tiêu hao Ảnh hưởng."
 HELP_TUTORIAL_SPECIES_MANAGEMENT_TITLE:0 "Giữ cho Dân số Hạnh phúc"
 HELP_TUTORIAL_SPECIES_MANAGEMENT_DESC:0 "Một lượng £pop£ §SDân số§! hạnh phúc là một lượng £pop£ §SDân số§! có năng suất cao.\nTuy nhiên, việc duy trì §SHạnh phúc§! có thể khá nan giải, và nếu để sự bất mãn tiếp diễn không kiểm soát, nó có thể dẫn tới §SBất ổn§!.\n\nMay mắn thay, có rất nhiều cách để cải thiện hạnh phúc trên một £planet£ §SHành tinh§!. Các §SChính sách§! và §SPháp lệnh§! hành tinh, §SCơ cấu Xã hội§!, §SQuyền của Chủng loài§!, §SCông trình§!, và §SĐặc tính của Nhà thống trị§! đều có thể tác động tích cực đến §SHạnh phúc§!."
 HELP_TUTORIAL_SPECIES_MANAGEMENT_INSTRUCTIONS:0 "§Y1.§! Chọn một hành tinh (khả dụng trong Bảng tổng quan ở bên phải màn hình).\n§Y2.§! Nhấp vào một Ô Công trình còn trống.\n§Y3.§! Xây dựng Nhà Hát Toàn Ảnh."
 HELP_TUTORIAL_SPECIES_MANAGEMENT_ACTION:0 "Mở Giao diện Chủng loài"
 HELP_TUTORIAL_FACTIONS_TITLE:0 "Quản lý Phe phái"
 HELP_TUTORIAL_FACTIONS_DESC:0 "§HPhe phái§! đại diện cho các đảng phái chính trị và được ủng hộ bởi các §HDân số§! có đạo đức phù hợp. Đáp ứng các vấn đề mà một Phe phái đưa ra sẽ làm tăng Tán thành của họ và mức hạnh phúc tương ứng của tất cả Dân số đã gia nhập phe đó. Một phe phái vui vẻ cũng sẽ tạo ra £unity£ §HĐoàn kết§!."

  # Chapter 5
 HELP_TUTORIAL_CASUS_BELLI_TITLE:0 "Tuyên chiến"
 HELP_TUTORIAL_CASUS_BELLI_DESC:0 "Để một £empire£ §SĐế chế§! có thể khơi mào một cuộc §SChiến tranh§!, họ cần có một Casus Belli - một lý do để tuyên §SChiến§!. Một Casus Belli có thể bao gồm từ việc chỉ đơn thuần làm bẽ mặt một §SKình địch§! cho đến việc tận diệt một loài khác.\n\nCác cuộc §SChiến tranh§! có thể kết thúc theo hai cách: Bằng sự §SĐầu hàng§! của một bên hoặc bằng một hòa ước §SGiữ nguyên Hiện trạng§! được đàm phán."
 HELP_TUTORIAL_CASUS_BELLI_INSTRUCTIONS:0 "Hãy lựa chọn kẻ thù của bạn một cách khôn ngoan.\n§Y1.§! Mở Liên lạc trên thanh điều hướng bên trái.\n§Y2.§! Chọn một Đế chế mà bạn muốn tấn công.\n§Y3.§! Mở Ngoại giao.\n§Y4.§! Nhấp vào Tuyên chiến."
 HELP_TUTORIAL_CASUS_BELLI_ACTION:0 "Mở Giao diện Ngoại giao"
 HELP_TUTORIAL_CLAIMS_TITLE:0 "Đưa ra Yêu sách"
 HELP_TUTORIAL_CLAIMS_DESC:0 "Các §SYêu sách§! tiêu tốn £influence£ §SẢnh hưởng§! và đại diện cho tham vọng lãnh thổ.\n\nTrong một cuộc §SChiến tranh§!, các §SYêu sách§! có thể được dùng để quyết định bên chiến thắng sẽ giành được những §SHệ sao§! nào. Có thể yêu sách cùng một §SHệ sao§! nhiều lần để giành được mức §SYêu sách§! mạnh hơn trên hệ sao đó, điều này có thể vượt qua các yêu sách cạnh tranh của các §SĐồng minh§! khi cùng nhau tham gia §SChiến tranh§!."
 HELP_TUTORIAL_CLAIMS_INSTRUCTIONS:0 "§Y1.§! Mở Yêu sách trên thanh điều hướng bên trái.\n§Y2.§! Chọn một hệ sao để yêu sách.\n§Y3.§! Nhấp vào Đưa ra Yêu sách."
 HELP_TUTORIAL_CLAIMS_ACTION:0 "Chuyển sang Chế độ Bản đồ Yêu sách"
 HELP_TUTORIAL_FLEET_COMBAT_TITLE:0 "Giao chiến với Hạm đội Địch"
 HELP_TUTORIAL_FLEET_COMBAT_DESC:0 "Để bảo vệ £empire£ §SĐế chế§! của bạn, việc sở hữu các §SHạm đội Quân sự§! hùng mạnh là điều tối quan trọng. Các §SCông nghệ§! quân sự tốt hơn có thể đạt được thông qua §SNghiên cứu§!, cho phép bạn nâng cấp tàu của mình, cũng như trao quyền năng duy trì các §SHạm đội§! quy mô lớn hơn.\n\nChiến thắng trong các trận đánh giữa các vì sao nằm ở việc thích nghi với §STrang bị của Kẻ địch§! và sử dụng các §SBiện pháp Khắc chế Hiệu quả§!. Mỗi linh kiện tấn công hay phòng thủ đều có phương thức đối phó tương ứng."
 HELP_TUTORIAL_FLEET_COMBAT_INSTRUCTIONS:1 "§Y1.§! Nhấp vào Quản lý Hạm đội trên thanh điều hướng bên trái\n§Y2.§! Nhấp vào nút \"cộng\" để gia tăng số lượng tàu trong hạm đội của bạn.\n§Y3.§! Đảm bảo rằng bạn đã chỉ định một đô đốc cho mọi hạm đội bạn sở hữu."
  # If player has a fleet, then select and pan to it when clicked (if more than 1, select the first one). Else, disable button with tooltip "You have no fleet."
 HELP_TUTORIAL_FLEET_COMBAT_ACTION:0 "Đi tới Hạm đội"
 HELP_TUTORIAL_WAR_EXHAUSTION_TITLE:0 "Phòng thủ Hệ sao của Bạn"
 HELP_TUTORIAL_WAR_EXHAUSTION_DESC:1 "§SCăn cứ sao§! là nền tảng phòng thủ cốt lõi trong các hệ sao của bạn. Các tiền đồn tại các vị trí hiểm yếu cũng có thể được nâng cấp thành §SCảng sao§!, giúp nâng cao khả năng phòng thủ hệ sao bằng cách bổ sung thêm ô cho các §SMô-đun Phòng thủ§!.\n\nKhả năng tự vệ của một §SCăn cứ sao§! có thể được tăng cường nhờ việc xây dựng các §SNền tảng Phòng thủ§!. §SNền tảng Phòng thủ§! là các trạm quân sự nhỏ hơn được triển khai xung quanh §SCăn cứ sao§! và đóng vai trò như các bệ phóng vũ khí."
 HELP_TUTORIAL_WAR_EXHAUSTION_INSTRUCTIONS:2 "§Y1.§! Nhấp vào bất kỳ Căn cứ sao nào.\n§Y2.§! Chọn thẻ Phòng thủ.\n§Y3.§! Xây dựng một Nền tảng Phòng thủ."
 HELP_TUTORIAL_WAR_EXHAUSTION_ACTION:0 ""
 HELP_TUTORIAL_SHIP_DESIGN_TITLE:0 "Thiết kế Tàu vũ trụ"
 HELP_TUTORIAL_SHIP_DESIGN_DESC:1 "Theo mặc định, các Thiết kế Tàu sẽ được tự động tạo và cập nhật, nhưng để chiếm ưu thế trước những đối thủ đáng gờm hơn, bạn có thể muốn tự tạo các thiết kế tàu khắc chế hạm đội thù địch. Lá chắn chống chọi tốt trước tia laser, nhưng lại dễ bị tổn thương trước tên lửa, trong khi lớp giáp thân tàu vững chắc giúp bảo vệ trước vũ khí động năng tốt hơn là trước vũ khí năng lượng."
 HELP_TUTORIAL_CRISIS_TITLE:0 "Thảm họa Khủng hoảng Cuối Game"
 HELP_TUTORIAL_CRISIS_DESC:0 "Một cuộc §SKhủng hoảng§! đe dọa toàn bộ §SThiên hà§! cùng tất cả sự sống bên trong nó.\n\nHiếm khi bạn có thể sẵn sàng đối mặt với một cuộc §SKhủng hoảng§! một mình. Mỗi lần một cuộc khủng hoảng chinh phục một £planet£ §SHành tinh§!, nó sẽ gây ra §SMối đe dọa§! ngoại giao đối với mọi £empire£ §SĐế chế§!, khiến họ có nhiều khả năng hợp tác cùng nhau hơn để chống lại §SKhủng hoảng§!.\n\nCác cuộc Khủng hoảng Cuối Game có một mục trong §SNhật ký Tình hình§! (£f2£) theo dõi số lượng thương vong của cả hai bên và hiển thị xem cuộc §SKhủng hoảng§! đã gần bị đánh bại đến mức nào."
 HELP_TUTORIAL_CRISIS_INSTRUCTIONS:1 "Hiện tại chưa cần phải làm gì về vấn đề này, nhưng hãy luôn chuẩn bị sẵn sàng. Ai biết được khi nào cuộc khủng hoảng sẽ ập tới?"
 HELP_TUTORIAL_CRISIS_ACTION:0 ""

