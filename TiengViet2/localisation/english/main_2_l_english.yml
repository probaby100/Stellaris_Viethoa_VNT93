 # Civics
 ####################################

 civic_feudal_realm:0 "Vương quốc Phong kiến"
 civic_feudal_realm_desc:0 "Đây là một hệ thống xã hội phong kiến, nơi quân vương dựa vào các chư hầu hùng mạnh có thái ấp và quyền tự trị để duy trì sự thống trị."
 civic_imperial_cult:0 "Tín ngưỡng Đế quốc"
 civic_imperial_cult_desc:0 "Xã hội này phổ biến một tôn giáo sùng bái người cai trị như một vị thần sống thực sự bước đi trên thế gian."
 civic_imperial_cult_effects: "§YThế giới quê hương§! của người cai trị có thêm các vị trí [GetPriestIcon][GetPriest]"
 civic_corvee_system:0 "Chế độ Lao dịch"
 civic_corvee_system_desc:0 "Xã hội này tin tưởng vững chắc rằng nhà nước có quyền lực tuyệt đối trong việc chi phối lao động và nơi ở của người dân."
 civic_corvee_system_effects:1 "$t$—Miễn chi phí Đoàn kết $r_unity$ cho việc §Ycưỡng chế di cư quần thể§! £pop£."
 civic_beacon_of_liberty:0 "Ngọn hải đăng Tự do"
 civic_beacon_of_liberty_desc:0 "Nơi đây là ngọn hải đăng tỏa sáng giữa xã hội tăm tối. Tự do và dân chủ được tôn kính cao nhất ở đây."
 civic_exalted_priesthood:0 "Thánh chức Tối cao"
 civic_exalted_priesthood_desc:0 "Để ngăn chặn sự xâm nhập của dị giáo, chúng ta đã chọn để một hội đồng tôn giáo gồm các giáo sĩ khôn ngoan và đạo đức nhất trong xã hội cai trị quốc gia."
 civic_philosopher_king:0 "Vua Triết gia"
 civic_philosopher_king_desc:0 "Chỉ cai trị theo cách thông thường thôi là chưa đủ, chính quyền phải được dẫn dắt bởi một vị vua có đủ trí tuệ và kiến thức."
 civic_meritocracy:0 "Chế độ Nhân tài"
 civic_meritocracy_desc:0 "Địa vị xã hội cá nhân hoặc các mối quan hệ của một người không liên quan gì đến nghề nghiệp của họ. Tài năng và năng lực là cơ sở duy nhất cho sự tiến bộ của xã hội."
 civic_citizen_service:0 "Nghĩa vụ Công dân"
 civic_citizen_service_desc:0 "Bạn đã làm tròn trách nhiệm của mình chưa? Chỉ những người đã hoàn thành nghĩa vụ chính trị của mình bằng cách phục vụ trong quân đội mới có thể có đầy đủ quyền công dân. Phục vụ đảm bảo quyền công dân."
 civic_technocracy:0 "Kỹ trị"
 civic_technocracy_desc:0 "Để tối đa hóa hiệu quả, xã hội này lấy khoa học và lý trí làm quy tắc ứng xử. Ảo tưởng cá nhân của những tầng lớp tinh hoa chính trị ngu dốt, nguy hiểm và không đủ năng lực tuyệt đối không được phép can thiệp vào."
 civic_police_state:0 "Nhà nước Cảnh sát"
 civic_police_state_desc:0 "Loại bỏ không dấu vết mọi sự bất đồng. Trong xã hội ngột ngạt này, mọi lời nói và hành động của người dân đều bị theo dõi và kiểm soát cẩn thận bởi một lực lượng cảnh sát nội bộ khổng lồ."
 civic_idealistic_foundation:0 "Nền tảng Lý tưởng"
 civic_idealistic_foundation_desc:0 "Một xã hội được xây dựng trên những giá trị lý tưởng mạnh mẽ. Bất kể chính quyền hiện tại có tin tưởng vào điều đó hay không, người dân sẽ luôn nuôi dưỡng niềm khao khát về một tương lai tươi sáng hơn."
 civic_environmentalist:0 "Nhà bảo vệ Môi trường"
 civic_environmentalist_desc:0 "Xã hội này tìm kiếm cách sống hòa hợp với thiên nhiên. Họ bảo vệ môi trường một cách vô cùng cẩn trọng và hạn chế tiêu dùng đến mức tối đa."
 civic_slaver_guilds:0 "Hội buôn nô lệ"
 civic_slaver_guilds_desc:0 "Lõi quyền lực thực sự trong xã hội nằm ở một số hội buôn nô lệ mạnh mẽ và tàn nhẫn. Họ biết cách làm sao để vắt kiệt nhiều sức lao động hơn từ một nô lệ."
 civic_slaver_guilds_effect: "£pop_cat_worker£§Y$pop_cat_worker_plural$§! bị đối xử như nô lệ."
 civic_inwards_perfection:0 "Hoàn thiện Nội tại"
 civic_inwards_perfection_desc:1 "Xã hội yên tĩnh và thanh bình này không sẵn lòng chấp nhận những người ngoài không hiểu lối sống của họ. Thay vì quan tâm đến thế giới bên ngoài, họ thà ở lại trong chốn bồng lai tiên cảnh của mình mà không bị quấy rầy."
 civic_warrior_culture:0 "Văn hóa Chiến binh"
 civic_warrior_culture_desc:0 "Xã hội này đã phát triển một tinh thần chiến binh mạnh mẽ. Sức mạnh quân sự và võ thuật được đặt lên trên hết, và chỉ trên chiến trường người ta mới có thể đạt được vinh quang thực sự."
 civic_distinguished_admiralty:0 "Bộ Hải quân Ưu tú"
 civic_distinguished_admiralty_desc:0 "Hạm đội và hải quân có sức ảnh hưởng cực kỳ lớn trong chính trị. Họ sẽ chọn lọc một cách khắt khe những tân binh tinh nhuệ nhất để gia nhập hàng ngũ của mình."
 civic_free_haven:0 "Nơi trú ẩn Tự do"
 civic_free_haven_desc:0 "Xã hội này được ca tụng như một nơi trú ẩn của sự tự do. Bất kể là loài nào, nguồn gốc xuất thân ra sao, những người lao động vất vả, nghèo khổ và khao khát được hít thở bầu không khí tự do đều được chào đón ở đây."
 civic_cutthroat_politics:0 "Chính trị Khốc liệt"
 civic_cutthroat_politics_desc:0 "Hệ thống chính trị này nổi tiếng với những âm mưu và toan tính. Tranh giành quyền lực, các thỏa thuận ngầm mờ ám và những mưu đồ bí mật là chuyện đương nhiên. Tuy nhiên, những người chơi dày dạn kinh nghiệm lại có thể kiểm soát nó tốt hơn."
 civic_corporate_dominion:0 "Tập đoàn Thống trị"
 civic_corporate_dominion_desc:0 "Xã hội này bị chi phối bởi một tập đoàn đa hành tinh khổng lồ, nó đã thay thế hoàn toàn kiến trúc thượng tầng của nhà nước."
 civic_agrarian_idyll:0 "Điền viên Thanh bình"
 civic_agrarian_idyll_desc:0 "Một môi trường sống giản dị và đời thường thường mang lại nhiều lợi ích. Xã hội nông nghiệp này phần lớn tìm cách tránh quá trình đô thị hóa ồ ạt."
 civic_shadow_council:0 "Hội đồng Bóng tối"
 civic_shadow_council_desc:0 "Ngay cả công dân của họ cũng không hề hay biết, xã hội này thực sự bị cai trị bởi một hội đồng bóng tối thao túng mọi thứ từ phía sau. Vẻ ngoài dân chủ vẫn phải được duy trì, nhưng sự chuyên chế của số đông cũng được giữ lại. Xét cho cùng, lỡ có kẻ ngốc nào đó bỏ phiếu cho nhầm ứng cử viên thì sao?"
 civic_mining_guilds:0 "Hội Khai khoáng"
 civic_mining_guilds_desc:0 "Một số hội khai khoáng quy mô lớn đã chiếm vị trí thống trị trong xã hội. Chính phủ phụ thuộc rất nhiều vào sự hỗ trợ của họ."
 civic_parliamentary_system:0 "Hệ thống Nghị viện"
 civic_parliamentary_system_desc:0 "Hệ thống nghị viện của xã hội này khuyến khích tự do ngôn luận và các cuộc thảo luận sôi nổi. Thực tế cho thấy rằng, việc lấy lòng một phe phái chính trị thống trị là vô cùng hữu ích."
 civic_efficient_bureaucracy:0 "Quan liêu Hiệu quả"
 civic_efficient_bureaucracy_desc:0 "Xã hội này nổi tiếng vì tính hiệu quả của nó. Tàu thuyền của chúng ta không chỉ chạy đúng giờ, mà cả cỗ máy quan liêu khổng lồ cần thiết để vận hành một quốc gia liên sao cũng hoạt động chính xác như một dây chuyền lắp ráp."
 civic_nationalistic_zeal:0 "Nhiệt huyết Quốc gia"
 civic_nationalistic_zeal_desc:0 "Niềm tự hào quốc gia mãnh liệt thấm nhuần vào mọi tầng lớp của xã hội này."
 civic_functional_architecture:0 "Kiến trúc Thực dụng"
 civic_functional_architecture_desc:1 "Xã hội này nổi tiếng với các cấu trúc tòa nhà đơn giản nhưng thiết thực. Một số người đánh giá phong cách kiến trúc này là tẻ nhạt, thậm chí gây trầm cảm, nhưng trong hầu hết các trường hợp, xi măng loại mới cũng chẳng thua kém gì các vật liệu xây dựng khác."
 civic_functional_architecture_effects: "—Miễn trừ yêu cầu §YKhoa học§! đối với các ['concept_district_specializations'] cơ bản của £zone£."
 civic_aristocratic_elite:0 "Tinh hoa Quý tộc"
 civic_aristocratic_elite_desc:0 "Một tầng lớp quý tộc có nguồn gốc lâu đời thống trị toàn bộ thượng tầng của xã hội."
 civic_mechanists:0 "Thợ cơ khí"
 civic_mechanists_desc:0 "Trào lưu xã hội tập trung vào chế tạo người máy đã bắt đầu từ thời đại hơi nước. Dù nhiều người nói rằng điều đó là bất khả thi, nhưng trên thực tế, những robot thực thụ đã rời khỏi dây chuyền lắp ráp từ rất lâu trước khi các chuyến bay vào vũ trụ diễn ra."
 civic_syncretic_evolution:0 "Tiến hóa Đồng bộ"
 civic_syncretic_evolution_desc:0 "Một loài thứ hai là một phần không thể tách rời của xã hội này. Chúng to lớn và khỏe mạnh, nhưng trí thông minh của hầu hết chỉ ngang bằng với một đứa trẻ chậm phát triển. Trong các cuộc chiến tranh thời cổ đại, chúng ta đã loại bỏ bản tính hung hăng của chúng, biến chúng thành những người hầu ngoan ngoãn nhất."
 civic_syncretic_evolution_secondary_species:0 "Loài Đồng bộ"
 civic_shared_burden:0 "Cùng chung Gánh nặng"
 civic_shared_burden_desc:0 "Xã hội này tin tưởng vào khái niệm phân phối tài nguyên đồng đều, dù là tầng lớp thống trị hay bị trị đều phải được đối xử bình đẳng. Mọi người sẽ nỗ lực phấn đấu vì toàn thể xã hội."
 civic_fanatic_purifiers:0 "Kẻ thanh trừng Cực đoan"
 civic_fanatic_purifiers_desc:0 "Xã hội này dường như sẽ làm bất cứ điều gì để thanh trừng tất cả các dạng sống có trí tuệ khác trong tất cả các hệ sao. Cho dù điều gì xảy ra, họ cũng sẽ không dung thứ cho sự tồn tại của các giống loài ngoại lai."
 civic_lethargic_leadership:0 "Lãnh đạo Trì trệ"
 civic_lethargic_leadership_desc:0 ""
 civic_empire_in_decline:0 "Đế chế Suy tàn"
