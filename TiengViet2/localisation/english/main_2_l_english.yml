 TECH_UNLOCK_OUTPOST_CONSTRUCTION_TITLE:0 "§HMở khóa căn cứ sao: §!Tiền đồn"
 TECH_UNLOCK_OUTPOST_CONSTRUCTION_DESC:1 "§HTiền đồn§!\nCăn cứ sao cơ bản nhất, Tiền đồn là một trạm không gian vũ trang nhẹ được xây dựng trên quỹ đạo của một ngôi sao để mở rộng lãnh thổ. Tiền đồn không thể hỗ trợ bất kỳ công trình hoặc mô-đun nào, và sẽ không xuất hiện trong bảng tổng quan."
 TECH_UNLOCK_STARPORT_CONSTRUCTION_TITLE:0 "§HMở khóa nâng cấp căn cứ sao: §!Cảng sao"
 TECH_UNLOCK_STARPORT_CONSTRUCTION_DESC:0 "§HCảng sao§!\nNâng cấp tiền đồn thành cảng sao, cảng sao có thể chứa một công trình và hỗ trợ hai mô-đun."
 TECH_UNLOCK_STARHOLD_CONSTRUCTION_TITLE:0 "§HMở khóa nâng cấp căn cứ sao: §!Đồn sao"
 TECH_UNLOCK_STARHOLD_CONSTRUCTION_DESC:0 "§HĐồn sao§!\nNâng cấp của Cảng sao, có thể xây dựng hai công trình và hỗ trợ bốn mô-đun."
 TECH_UNLOCK_STAR_FORTRESS_CONSTRUCTION_TITLE:0 "§HMở khóa nâng cấp căn cứ sao: §!Pháo đài sao"
 TECH_UNLOCK_STAR_FORTRESS_CONSTRUCTION_DESC:0 "§HPháo đài sao§!\nNâng cấp của Đồn sao, có thể xây dựng ba công trình và hỗ trợ tối đa sáu mô-đun."
 TECH_UNLOCK_CITADEL_CONSTRUCTION_TITLE:0 "§HMở khóa nâng cấp căn cứ sao: §!Thành trì"
 TECH_UNLOCK_CITADEL_CONSTRUCTION_DESC:0 "§HThành trì§!\nNâng cấp của Pháo đài sao, Thành trì là phiên bản lớn nhất và cuối cùng của căn cứ sao, có thể xây dựng bốn công trình và hỗ trợ tối đa sáu mô-đun."
