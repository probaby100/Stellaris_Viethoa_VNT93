 RESEARCH_EFFICIENCY_DESC:0 "Tốc độ nghiên cứu thể hiện tốc độ mà các khám phá khoa học của đế quốc được đưa vào sử dụng thực tế, quyết định tốc độ mở khóa các công nghệ mới. Giá trị này chủ yếu phụ thuộc vào khả năng của nhà khoa học được phân công, nhưng cũng bị ảnh hưởng bởi các yếu tố khác."
