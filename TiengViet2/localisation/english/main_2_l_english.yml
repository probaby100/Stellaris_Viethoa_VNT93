 building_slave_processing:0 "Cơ sở Xử lý Nô lệ"
 building_slave_processing_desc:1 "Cơ sở khổng lồ và ngột ngạt này dùng để xử lý lao động nô lệ, triệt tiêu mọi mầm mống của ý chí tự do."
 building_slave_processing_migrate_effect_desc:1 "§Y$SLAVES$§! thất nghiệp và robot vô tri ở địa phương sẽ được phép §YDi cư Tự động§! sang các thuộc địa khác."
 building_slave_processing_slave_army_effect_desc:0 "Cho phép chiêu mộ §Y$slave_army_plural$§!.\n\n"
 building_robotics_assembly_plant:0 "Nhà máy Lắp ráp Robot"
 building_robotics_assembly_plant_desc:0 "Nhà máy Lắp ráp Robot là cơ sở thiết yếu để thành lập quân đoàn robot.\nMỗi năm tăng §Y100§!£pop£§H Dân số $ROBOT_POP_SPECIES_1$§!\nPhí bảo trì dân số: £energy£ §Y1§!"
 building_robotics_assembly_plant_2:1 "Nhà máy Lắp ráp Droid"
 building_robotics_assembly_plant_2_desc:1 "Nhà máy Lắp ráp Droid là cơ sở thiết yếu để thành lập quân đoàn robot.\nMỗi năm tăng §Y100§!£pop£§H Dân số $ROBOT_POP_SPECIES_2$§!\nNâng cấp Dân số §H$ROBOT_POP_SPECIES_1$§! lên §H$ROBOT_POP_SPECIES_2$§!\nPhí bảo trì dân số: £energy£ §Y2§!"
 building_robotics_assembly_plant_3:1 "Nhà máy Lắp ráp Synth"
 building_robotics_assembly_plant_3_desc:1 "Cần có Nhà Máy Lắp Ráp Người Nhân Tạo để tạo ra các đạo quân robot.\nMỗi năm thêm §Y100§! £pop£ §HDân số $ROBOT_POP_SPECIES_3$§!\nNâng cấp Dân số §H$ROBOT_POP_SPECIES_2$§! lên §H$ROBOT_POP_SPECIES_3$§!\nPhí bảo trì Dân số: £energy£ §Y5§!"
 building_colony_shelter:0 "Căn cứ Cải hoán Tàu Khai hoang"
 building_colony_shelter_desc:0 "Được cải hoán từ các bộ phận còn lại của tàu khai hoang, làm căn cứ tạm thời khi đổ bộ lên hành tinh."
 building_capital:0 "Thủ phủ Hành tinh"
 building_capital_desc:0 "Nơi đặt trụ sở của giới tinh hoa cầm quyền địa phương."
 building_major_capital:0 "Thủ đô Hành tinh"
 building_major_capital_desc:0 "Khu phức hợp của các cơ quan hành chính, là trung tâm quản lý của một thuộc địa lớn."
 building_system_capital:0 "Thủ phủ Hệ sao Phức hợp"
 building_system_capital_desc:0 "Cơ quan hành chính vươn tận mây xanh và mạng lưới giao thông dày đặc, giúp cho các cơ sở và công trình hoạt động với hiệu suất cao."
 building_ancient_factory:1 "Nhà máy Tự động hóa"
 building_ancient_factory_desc:1 "§LCơ sở khổng lồ cổ đại này sử dụng những công nghệ đã thất truyền từ lâu.§!"
 building_ancient_archives:0 "Kho lưu trữ của Tiên nhân"
 building_ancient_archives_desc:0 "§LCất giữ một lượng tri thức cổ đại đồ sộ.§!"
 building_dark_matter_power_plant:0 "Nhà máy Điện Vật chất Tối"
 building_dark_matter_power_plant_desc:0 "§LCơ sở khổng lồ cổ đại này sử dụng những công nghệ đã thất truyền từ lâu.§!"
 building_agri_processing_complex:0 "Nhà máy Chế biến Nông sản"
 building_agri_processing_complex_desc:0 "§LCơ sở khổng lồ cổ đại này sử dụng những công nghệ đã thất truyền từ lâu.§!"
 building_primitive_farm:0 "Nông trại Thô sơ"
 building_primitive_farm_desc:0 "Nông trại thô sơ, canh tác đất đai mang lại vụ mùa kém hiệu quả."
 building_primitive_factory:0 "Nhà máy Cơ sở"
 building_primitive_factory_desc:0 "Nhà máy thô sơ, kém hiệu quả, vừa sản xuất hàng hóa vừa gây ô nhiễm."
 building_primitive_offices: "Văn phòng Cơ sở"
 building_primitive_offices_desc: "Những văn phòng này có vô số buồng nhỏ, tràn ngập tiếng ồn ào vô nghĩa của công việc hối hả."
 building_primitive_mine:0 "Hầm mỏ Thô sơ"
 building_primitive_mine_desc:0 "Hầm mỏ thô sơ uốn lượn dưới lòng đất."
 building_primitive_power_plant:0 "Nhà máy Điện Thô sơ"
 building_primitive_power_plant_desc:1 "Một nhà máy điện thô sơ và không đáng tin cậy, phụ thuộc vào than đá hoặc công nghệ hạt nhân sơ khai, gây ô nhiễm khí quyển địa phương."
 building_mutant_landfill:0 "Bãi chôn lấp Đột biến"
 building_mutant_landfill_desc:0 "Xác đột biến chất đống tạo nên một khung cảnh kinh hoàng. Các chất hữu cơ không ổn định xoắn chặt lại thành một cấu trúc nào đó."
 building_vault:0 "Hầm trú ẩn Dưới lòng đất"
 building_vault_desc:0 "Những túp lều đánh dấu lối vào hầm trú ẩn khổng lồ, được cư dân bản địa dùng làm hầm tránh bom. Khi hết thức ăn, cư dân trong hầm quay sang tàn sát lẫn nhau."
 building_vault_2:0 "Hầm trú ẩn Dưới lòng đất"
 building_vault_2_desc:0 "Những túp lều đánh dấu lối vào hầm trú ẩn khổng lồ, được cư dân bản địa dùng làm hầm tránh bom. Hầm chứa một bãi đậu máy móc đồ sộ, cùng nhiều cửa hàng bán thiết bị khai khoáng."
 building_particle_accelerator:0 "Máy gia tốc Hạt"
 building_particle_accelerator_desc:0 "Máy gia tốc hạt cổ đại nhưng có cấu trúc rất sáng tạo. Có thể lấy được dữ liệu nghiên cứu lớn từ các bộ phận còn hoạt động. Số dữ liệu này chắc chắn được một nhà vật lý thiên tài thu thập."
 building_odd_factory:0 "Nhà máy Kỳ dị"
 building_odd_factory_desc:0 "Nhà máy cực kỳ tinh xảo, dường như do một nền văn minh nào đó để lại trên hành tinh này. Có khả năng sản xuất tài nguyên quý giá."
 building_quarantine:0 "Trạm Nghiên cứu Bệnh dịch"
 building_quarantine_desc:0 "Một bệnh viện dã chiến, tận tâm chữa trị người nhiễm bệnh nhằm phát triển vắc-xin."
 building_plague_memorial:0 "Đài tưởng niệm Dịch bệnh"
 building_plague_memorial_desc:0 "Một đài tưởng niệm để nhắc nhở mọi người đừng quên trận đại dịch tàn khốc đã càn quét quê hương. Nó là minh chứng cho sự sống sót của Đế quốc."
 building_energy_grid:0 "Mạng lưới Điện"
 building_energy_grid_plural: "Mạng lưới Điện"
 building_energy_grid_desc:0 "Mạng lưới truyền tải điện được bố trí tỉ mỉ, giúp tăng cường hiệu suất phát điện của nhà máy."
 building_energy_grid_effect_desc:2 "Tăng §G1§! điểm cơ bản cho các nghề sản xuất £energy£§YNăng lượng§!."
 building_energy_nexus:0 "Trung tâm Năng lượng"
 building_energy_nexus_desc:0 "Cơ sở khổng lồ này tập trung toàn bộ lưới điện trên hành tinh, cải thiện hiệu quả các trung tâm điện lực."
 building_mineral_purification_plant:2 "Trạm Tinh chế Khoáng sản"
 building_mineral_purification_plant_desc:2 "Trạm này tinh chế quặng thô thành khoáng sản có chất lượng tốt nhất."
 building_mineral_purification_hub:2 "Trung tâm Tinh chế Khoáng sản"
 building_mineral_purification_hub_desc:2 "Trung tâm khổng lồ này tiếp nhận khoáng sản và phân phối cho các trạm tinh chế để tạo ra loại khoáng cao cấp."
 building_medical_1: "Trung tâm Y tế"
 building_medical_1_desc: "$job_healthcare_desc$"
 building_medical_2:2 "Phòng khám Di truyền"
 building_medical_2_desc:2 "Cung cấp các công nghệ y tế tiên tiến, cải thiện sức khỏe tổng thể và tuổi thọ của người dân."
 building_medical_3:2 "Trung tâm Phục hồi Tế bào"
 building_medical_3_desc:2 "Trung tâm Phục hồi Tế bào cung cấp y tế tiên tiến cho công chúng. Liệu pháp cấp độ tế bào giúp nâng cao sức khỏe và tuổi thọ tổng thể."
 building_mineral_silo_1:1 "Kho chứa Khoáng sản I"
 building_mineral_silo_1_desc:1 "Kho chứa Khoáng sản làm tăng sức chứa khoáng tối đa của đế chế."
 building_mineral_silo_2:1 "Kho chứa Khoáng sản II"
 building_mineral_silo_2_desc:0 "$building_mineral_silo_1_desc$"
 building_mineral_silo_3:1 "Kho chứa Khoáng sản III"
 building_mineral_silo_3_desc:0 "$building_mineral_silo_1_desc$"
 building_planetary_shield_generator:0 "Máy phát Khiên Hành tinh"
 building_planetary_shield_generator_desc:0 "$tech_planetary_shield_generator_desc$"
 building_autochthon_monument:0 "Đài tưởng niệm Tiên nhân"
 building_autochthon_monument_plural: "Đài tưởng niệm Tiên nhân"
 building_autochthon_monument_desc:0 "Đài tưởng niệm nhằm tôn vinh những người tiên phong đầu tiên đặt chân lên các vì sao."
 building_autochthon_monument_effect:1 "Tạo ra £unity£§G1§! cho mỗi §YĐặc quyền Thăng thiên§! mà đế chế chọn.\n\n"
 building_heritage_site:0 "Di chỉ Di sản"
 building_heritage_site_desc:0 "Di chỉ tưởng niệm lịch sử ban đầu của Đế quốc và nhân dân ta."
 building_heritage_site_effect:1 "Tạo ra £unity£§G2§! cho mỗi §YĐặc quyền Thăng thiên§! mà đế chế chọn.\n\n"
 building_hypercomms_forum:0 "Diễn đàn Siêu Giao tiếp"
 building_hypercomms_forum_desc:0 "Cơ sở khổng lồ trang bị thiết bị giao tiếp hiện đại, cung cấp nền tảng để trao đổi quan điểm đa chiều và nhanh chóng đạt đồng thuận trong tranh luận."
 building_hypercomms_forum_effect:1 "Tạo ra £unity£§G3§! cho mỗi §YĐặc quyền Thăng thiên§! mà đế chế chọn.\n\n"
 building_autocurating_vault:0 "Bảo tàng Tự Sàng lọc"
 building_autocurating_vault_desc:1 "Một mạng lưới máy tính cực kỳ chuyên biệt liên tục thu thập, phân tích, đánh giá và trưng bày các vật phẩm thường ngày mà nó cho là quan trọng, tạo nên một bảo tàng đương đại sống động."
 building_temple:0 "Đền thờ"
 building_temple_desc:0 "Là công trình đơn giản có từ thuở hồng hoang, đền thờ luôn đóng vai trò là nơi tĩnh tâm và giao tiếp với thần linh."
 building_holotemple:0 "Đền thờ Hologram"
 building_holotemple_desc:0 "Được nâng cấp từ ngôi đền thô sơ, sử dụng công nghệ tâm linh mới nhất tạo ra thực tại ảo diệu bên trong, giúp tín đồ nhập định sâu hơn và khơi dậy tinh thần sùng đạo nhiệt thành."
 building_sacred_nexus:0 "Thánh tâm Điện"
 building_sacred_nexus_desc:0 "Công nghệ trường tâm linh tối tân, cho phép người hành hương cảm nhận trực tiếp sức mạnh thần thánh từ thánh địa."
 building_citadel_of_faith:0 "Thành trì Đức tin"
 building_citadel_of_faith_desc:0 "Công trình đồ sộ cách biệt với thế giới vật chất, tiếp nhận mọi vị khách và ban cho họ nơi trú ẩn."
 building_stronghold:0 "Thành lũy"
 building_stronghold_desc:0 "Một pháo đài hành tinh với quân đồn trú mạnh mẽ, bảo vệ thế giới khỏi quân xâm lược và quân nổi loạn."
 building_fortress:0 "Pháo đài"
 building_fortress_desc:2 "Cụm thành lũy khổng lồ với doanh trại lớn hơn để chứa thêm lính đồn trú, đồng thời cung cấp thao trường tập luyện."
 building_bio_reactor:0 "Lò phản ứng Sinh học"
 building_bio_reactor_desc:0 "Cơ sở này chuyển hóa hiệu quả chất hữu cơ thành năng lượng."
 tech_bio_reactor:0 "$building_bio_reactor$"
 tech_bio_reactor_desc:0 "$building_bio_reactor_desc$"
 building_bio_reactor_2: "Lò phản ứng Sinh học Tiên tiến"
 building_bio_reactor_2_desc: "Một cơ sở chuyển đổi hiệu quả chất hữu cơ thành năng lượng, hệ thống kiểm soát chất thải được cải thiện cho phép thu hồi các sản phẩm phụ dạng khí hữu ích."
 tech_bio_reactor_2: "$building_bio_reactor_2$"
 tech_bio_reactor_2_desc: "$building_bio_reactor_2_desc$"
 building_hab_stronghold:0 "Trung tâm An ninh"
 building_hab_stronghold_desc:0 "Khu vực này của Trạm không gian chuyên lo về an ninh, cung cấp lực lượng vũ trang bảo vệ trạm khỏi các mối đe dọa thù trong giặc ngoài."
 building_crude_huts:0 "Túp lều Sơ sài"
 building_crude_huts_desc:0 "Chỗ ở của xã hội nguyên thủy, xây từ đá và đất sét."
 building_primitive_dwellings:0 "Nhà ở Thô sơ"
 building_primitive_dwellings_desc:0 "Những công trình nhỏ mang lại chỗ trọ đơn giản, phòng thủ tốt trước thời tiết khắc nghiệt."
 building_stone_palace:1 "Cung điện Đá"
 building_stone_palace_desc:1 "Cung điện thô sơ bằng đá, nơi tầng lớp tinh hoa cai trị sinh sống."
 building_primitive_capital:0 "Thủ phủ Địa phương"
 building_primitive_capital_desc:0 "Công trình thủ phủ khu vực của các quốc gia dân tộc trên hành tinh nguyên thủy này."
 building_urban_dwellings:0 "Nhà ở Đô thị"
 building_urban_dwellings_desc:0 "Nhà ở chật hẹp trong khu rừng bê tông ô nhiễm nặng."
 building_pre_ftl_radio_telescope:0 "Mảng Kính viễn vọng Vô tuyến"
 building_pre_ftl_radio_telescope_desc:0 "Tổ hợp kính viễn vọng vô tuyến, lập ra để tìm kiếm sự sống có trí khôn ngoài hành tinh."
 awareness_gain_desc:0 "Tăng dần tỷ lệ văn minh này đạt được £awareness£§YNhận thức§! theo thời gian."

 building_hive_crude_huts:0 "Tổ ong Cơ bản"
 building_hive_crude_huts_desc:0 "Làm từ nguyên vật liệu đơn giản dễ kiếm nhất, những tổ ong này chỉ nhằm đảm bảo Ong thợ không chết cóng về đêm."
 building_hive_primitive_dwellings:0 "Quần thể Thuở đầu"
 building_hive_primitive_dwellings_desc:0 "Thiết kế của các kiến trúc lục giác này đã bắt đầu tính đến chuyện tối ưu hóa không gian, đủ chứa lượng dân số được xem là một bầy."
 building_hive_stone_palace:0 "Tổ ong bằng Đá"
 building_hive_stone_palace_desc:0 "Trong một thế giới phải tranh giành sự sống với đồng loại, tường thành bằng đá rõ ràng là một lợi thế."
 building_hive_primitive_capital:0 "Nút mạng Lục địa"
 building_hive_primitive_capital_desc:0 "Từ nút trung tâm tiêu biểu này của lục địa vươn ra vô số tổ ong, ganh đua tranh đoạt hành tinh."
 building_hive_urban_dwellings:0 "Kho chứa Ong thợ"
 building_hive_urban_dwellings_desc:0 "Giải pháp thực dụng nhất để chứa Ong thợ khi chúng đang ngủ đông. Công trình có lối ra vào riêng biệt, tối đa hóa quá trình phục hồi của Ong thợ."
 building_hive_primitive_factory:0 "$building_primitive_factory$"
 building_hive_primitive_factory_desc:0 "$building_primitive_factory_desc$"
 building_hive_primitive_mine:0 "$building_primitive_mine$"
 building_hive_primitive_mine_desc:0 "$building_primitive_mine_desc$"
 building_hive_primitive_power_plant:0 "$building_primitive_power_plant$"
 building_hive_primitive_power_plant_desc:0 "$building_primitive_power_plant_desc$"
 building_hive_primitive_farm:0 "$building_primitive_farm$"
 building_hive_primitive_farm_desc:0 "$building_primitive_farm_desc$"
 building_hive_primitive_node: "Nút Khớp thần kinh Đơn giản"
 building_hive_primitive_node_desc: "Thông qua nút khớp thần kinh sơ sài này, ý chí của Ý thức Bầy đàn sẽ được tăng cường."
 building_machine_primitive_node: "Nút đồng bộ Cơ bản"
 building_machine_primitive_node_desc: "Một nút đồng bộ sơ sài giúp giảm độ trễ hành tinh."

 building_farming_districts_1: "Trung tâm Canh tác Nông nghiệp"
 building_farming_districts_1_desc: "Một trung tâm quan liêu nhỏ, chịu trách nhiệm khảo sát đất canh tác và mở rộng nông nghiệp hành tinh."
 building_farming_districts_2: "Trung tâm Cải tạo Đất"
 building_farming_districts_2_desc: "Trọng tâm của trung tâm này là khôi phục đất bạc màu và tăng sản lượng, thúc đẩy Khu vực Nông nghiệp tăng trưởng lớn hơn."
 building_farming_districts_3: "Khu Nông nghiệp Tự động"
 building_farming_districts_3_desc: "Máy gặt cơ giới, phi đội máy bay không người lái và đồng ruộng kiểm soát khí hậu giúp mở rộng Khu vực Nông nghiệp nhanh chóng."
 building_farming_districts_4: "Mạng lưới Canh tác Hành tinh"
 building_farming_districts_4_desc: "Khu liên hợp rộng lớn giám sát các hoạt động nông nghiệp thâm canh mật độ cao, tối đa hóa Khu vực Nông nghiệp hỗ trợ trên hành tinh."
 building_mine_generic: "Trạm Khai thác Lộ thiên"
 building_mine_generic_desc: "Thông qua việc điều phối đào đất nông và thu gom quặng, trạm này có thể mở rộng Khu vực Khai khoáng từ sớm."
 building_mining_districts_1: "Trạm Khai khoáng Công nghiệp"
 building_mining_districts_1_desc: "Giàn khoan, băng chuyền và hệ thống phân loại phối hợp nhịp nhàng, duy trì sản lượng ổn định và cho phép Khu vực Khai khoáng được mở rộng bước đầu."
 building_mining_districts_2: "Mảng Khoan Xuyên Lõi"
 building_mining_districts_2_desc: "Cơ sở này dùng máy khoan hạng nặng và gia cố cấu trúc để thúc đẩy hoạt động khai thác sâu hơn, mở khóa thêm nhiều quặng mỏ."
 building_mining_districts_3: "Khu Khai quật Địa chấn"
 building_mining_districts_3_desc: "Cơ sở phức hợp có khả năng đào hầm hiệu quả và ổn định kết cấu lòng đất, mở rộng đường đến các mỏ quặng khó tiếp cận."
 building_mining_districts_4: "Mạng lưới Chiết xuất Vỏ Sâu"
 building_mining_districts_4_desc: "Cơ sở phức tạp này hoạt động ở khu vực sâu nhất hành tinh, quản lý toàn bộ mỏ công nghiệp hóa, đưa Khu vực Khai khoáng mở rộng đến giới hạn."
 building_generator_generic: "Khu Phát điện"
 building_generator_generic_desc: "Công trình chuyên về phát điện quy mô lớn, bao gồm pin động lực, đường ống plasma và cụm máy phát điện công suất cao."
 building_generator_districts_1: "Khu phức hợp Dẫn điện"
 building_generator_districts_1_desc: "Khu phức hợp phân phối cơ sở lưới điện hạ tầng và hệ thống xử lý năng lượng để hỗ trợ Khu vực Phát điện mới."
 building_generator_districts_2: "Khu phức hợp Rơ-le Biến áp"
 building_generator_districts_2_desc: "Cơ sở này triển khai rơ-le dung lượng lớn, bãi biến áp và nút ổn định lưới điện, mở rộng hạ tầng điện của hành tinh để hỗ trợ Khu vực Phát điện quy mô hơn."
 building_generator_districts_3: "Mảng Giam giữ Plasma"
 building_generator_districts_3_desc: "Cơ sở này dùng dòng plasma ổn định và kiểm soát cộng hưởng mạch điện để thúc đẩy toàn diện các cơ sở phát điện với cường độ cao trên hành tinh."
 building_generator_districts_4: "Trung tâm Hành tinh"
 building_generator_districts_4_desc: "Trung tâm năng lượng tích hợp này điều phối máy phát điện ở quy mô hành tinh, cho phép Khu vực Phát điện mở rộng tới mức tối đa."


 ####################################
 # Wonders
 ####################################
 building_xeno_zoo:1 "Sở thú Ngoại hành tinh"
 building_xeno_zoo_plural: "Sở thú Ngoại hành tinh"
 building_xeno_zoo_desc:1 "Khu bảo tồn này chuyên dùng để bảo vệ và nghiên cứu hệ động vật bản địa."
 building_fe_xeno_zoo:0 "Khu Bảo tồn Ngoài hành tinh"
 building_hab_capital:0 "Trung tâm Hành chính Trạm không gian"
 building_hab_capital_desc:0 "Trung tâm hành chính của Trạm không gian, đóng vai trò là thủ phủ địa phương và cơ quan chính phủ."
 building_hab_capital_tooltip: "£mod_planet_max_districts_add£ Số Ô Khu Vực Tối Đa từ các Thiên Thể Lớn: §G+$@hab_districts_per_major_body_tier2|2$§!\n"
 building_hab_solar_power_processor:0 "Bộ xử lý Năng lượng Mặt trời"
 building_hab_solar_power_processor_desc:0 "Bộ xử lý nhận phân phối năng lượng thu được từ vô số tấm pin mặt trời bên ngoài Trạm không gian đến các cơ sở."
 building_hab_astro_mining_facility:0 "Cảng Khai khoáng Không gian"
 building_hab_astro_mining_facility_desc:0 "Dù bản thân Trạm không gian không có tài nguyên thiên nhiên, nhưng nhờ cơ sở này có thể khai thác khoáng sản từ các tiểu hành tinh hoặc thiên thể lân cận."
 building_hab_agri_bay:0 "Khu Nông nghiệp"
 building_hab_agri_bay_desc:0 "Trạm không gian có riêng khu nuôi trồng nhiều loài động thực vật để cung cấp thức ăn cho cư dân."
 building_hab_cultural_center:0 "Khu Giải trí"
 building_hab_cultural_center_desc:0 "Khu phức hợp quy mô lớn được cư dân Trạm không gian dùng làm nơi thỏa mãn nhu cầu văn hóa và giao tiếp xã hội."
 building_hab_laboratory_module:0 "Trung tâm Thí nghiệm"
 building_hab_laboratory_module_desc:0 "Khu vực biệt lập hoàn toàn dành cho nghiên cứu khoa học."
 building_fe_xeno_zoo_desc:0 "Khu bảo tồn cực kỳ phức tạp cung cấp môi trường sống tự nhiên cho các sinh vật ngoại lai 'còn sống sót'."
 building_paradise_dome:0 "Vòm Lạc viên"
 building_paradise_dome_desc:2 "Nhà ở khép kín hoàn toàn với hệ sinh thái tự cung tự cấp, thiên đường đích thực cho những kẻ giàu có hoặc đủ may mắn."
 building_monument:0 "Đài tưởng niệm"
 building_monument_desc:0 "Đài tưởng niệm vinh danh một nhà cai trị vĩ đại."
 building_monument_proper:0 "Đài tưởng niệm của [GetRulerName]"
 building_monument_desc_proper:0 "Đài tưởng niệm khổng lồ vinh danh [GetRulerName] vĩ đại."
 building_grand_mausoleum:0 "Lăng mộ Vĩ đại"
 building_grand_mausoleum_desc:0 "Lăng mộ to lớn xây trên hầm mộ của một nhà cai trị vĩ đại."
 building_grand_mausoleum_proper:0 "Lăng mộ Vĩ đại của [GetRulerName]"
 building_grand_mausoleum_desc_proper:0 "Nơi an nghỉ trang nghiêm xây cho [GetRulerName] đáng kính."
 building_grand_mausoleum_allowed_tooltip:1 "Phải có một §YNgười cai trị§!\nHành tinh phải được xây dựng một\n§YThủ phủ Hành tinh§!,\n§YThủ đô Hành tinh§!, hoặc\n§YThủ phủ Hệ sao Phức hợp§!\n"
 building_royal_gardens:0 "Vườn Hoàng gia"
 building_royal_gardens_desc:0 "Một khu vườn giải trí khổng lồ, nơi mọi người có thể tụ tập và tưởng nhớ nhà cai trị vĩ đại."
 building_royal_gardens_proper:0 "Vườn Hoàng gia của [GetRulerName]"
 building_royal_gardens_desc_proper:0 "Khu vườn kỳ ảo do [GetRulerName] vĩ đại xây dựng."
 building_galactic_stock_exchange:0 "Sàn giao dịch Ngân hà"
 building_galactic_stock_exchange_desc:0 "Qua tự do thương mại hàng hóa và dịch vụ, ta mang đến nền kinh tế phân công tinh vi hơn, giúp mọi người có thể chuyên môn hóa và trao đổi thứ họ cần."
 building_ministry_production:0 "Bộ Sản xuất"
 building_ministry_production_desc:0 "Bộ Sản xuất là cơ quan hành chính làm việc ngày đêm để quản lý và tối ưu hóa chuỗi dây chuyền sản xuất trên khắp hành tinh."
 building_production_center:0 "Trung tâm Xử lý Tài nguyên"
 building_production_center_desc:1 "Cơ sở khổng lồ này chuyên quản lý và chế biến tài nguyên cho toàn hành tinh."
 building_supercomputer:1 "Siêu máy tính Hành tinh"
 building_supercomputer_desc:1 "Siêu máy tính có khả năng thực thi muôn vàn phép tính phức tạp, hỗ trợ thúc đẩy sản lượng nghiên cứu của hành tinh."
 building_hyper_entertainment_forum:1 "Quảng trường Cực lạc"
 building_hyper_entertainment_forum_desc:1 "Khu vui chơi giải trí siêu lớn, cứ như giấc mơ có thật. Trung tâm mua sắm, nhà hàng, công viên giải trí, phòng máy ảo, không thiếu thứ gì. Muốn gì có đó!"
 building_institute:0 "Trung tâm Nghiên cứu"
 building_institute_desc:1 "Tổ hợp cơ sở nghiên cứu khổng lồ và tinh vi, quy tụ các chuyên gia hàng đầu. Sự hợp tác liên ngành chưa từng có này sẽ tăng sản lượng nghiên cứu của cả hành tinh."
 building_virtual_combat_arena:0 "Đấu trường Ảo"
 building_virtual_combat_arena_desc:1 "Đấu trường ảo vừa để giải trí, vừa để tăng tinh thần đoàn kết xã hội. Quân đoàn địa phương cũng dùng nó để huấn luyện mô phỏng."
 building_monument_purity:0 "Đài tưởng niệm Thuần khiết"
 building_monument_purity_desc:1 "$tech_purity_campaigns_desc$"
 building_orillium_factory:0 "Nhà máy Thuốc nổ Orillium"
 building_orillium_factory_desc:1 "Quặng Orillium có đặc tính độc đáo, rất hợp làm thuốc nổ cho các dự án khai thác ngầm hoặc dưới biển sâu."
 building_pitharan_plant:0 "Nhà máy Phân bón Pitharan"
 building_pitharan_plant_desc:1 "Nhà máy sản xuất loại phân bón bổ sung bụi Pitharan, cải thiện sản lượng cây trồng."
 building_military_academy:0 "Học viện Quân sự"
 building_military_academy_desc:1 "Học viện Quân sự tăng tỷ lệ chiêu mộ tại địa phương, đồng thời mang đến huấn luyện tiêu chuẩn cao hơn."
 building_symbol_unity:0 "Biểu tượng Đoàn kết"
 building_symbol_unity_desc:0 "$tech_symbol_unity_desc$"
 building_visitor_center:0 "Trung tâm Du khách"
 building_visitor_center_desc:0 "$tech_visitor_center_desc$"
 building_alien_sanctuary:0 "Thánh địa Ngoại hành tinh"
 building_alien_sanctuary_desc:0 "$tech_alien_sanctuary_desc$"
 building_psi_corps:0 "Quân đoàn Tâm linh"
 building_psi_corps_desc:0 "Mọi [GetIndividualNamePlural] tâm linh tinh hoa của đế chế đều được gọi vào Quân đoàn để phát huy sở trường.\n\n§YQuân đoàn Tâm linh là [GetPsiCorpFriend] của bạn. Tin chúng tôi đi.§!"
 psionic_bonus_workforce_from_telepaths_tt: "\n$mod_psionic_pop_bonus_workforce_mult$ được nhân theo nghề [telepath.GetIcon][telepath.GetName]"
 building_hive_synapse:0 "Khớp thần kinh Bầy đàn"
 building_hive_synapse_desc:0 "Cường hóa tín hiệu của Ý thức Bầy đàn để tăng hiệu suất làm việc của các cá thể phụ thuộc."
 building_xenology_center:0 "Trung tâm Nghiên cứu Sinh học Ngoại hành tinh"
 building_xenology_center_desc:0 "Tập trung những sinh vật thấp kém lại một chỗ để nghiên cứu và trưng bày, phô trương sự tiên tiến của chúng ta."
 building_symbol_purity:0 "Biểu tượng Thuần khiết"
 building_symbol_purity_desc:0 "$tech_symbol_unity_desc$"
 building_control_center:0 "Trung tâm Kiểm soát"
 building_control_center_desc:0 "Bằng cách xây dựng các trung tâm xử lý mạnh mẽ, ta có thể tối ưu hóa hiệu suất hoạt động của Drone."

