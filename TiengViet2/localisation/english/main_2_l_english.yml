 purge_normal:0 "Tận diệt"
 purge_normal_tooltip:0 "Dân số bị ảnh hưởng sẽ bị loại bỏ - đây là phương pháp thanh trừng nhanh nhất hiện có."
 purge_normal_tooltip_delayed:0 "§LĐội tận diệt hoạt động cực kỳ hiệu quả. Mặc dù việc dọn dẹp toàn bộ giống loài là một công việc mất thời gian, nhưng họ luôn hoàn thành nhiệm vụ.§!"
 purge_displacement:0 "Trục xuất"
 purge_displacement_tooltip:0 "Dân số bị ảnh hưởng sẽ dần dần bị trục xuất khỏi lãnh thổ của chúng ta, họ chỉ có thể tìm kiếm nơi trú ẩn ở các khu vực khác."
 purge_displacement_tooltip_delayed:0 "§LKhông phải chúng ta đang đuổi họ ra khỏi nhà, chỉ là nơi này không còn là nhà của họ nữa.§!"
 purge_neutering:0 "Xử lý Triệt sản"
 purge_neutering_tooltip:1 "Dân số bị ảnh hưởng sẽ ngừng phát triển và dần dần chết đi do lão hóa, nhưng họ sẽ chỉ tạo ra một hình phạt §RHạnh phúc§! vừa phải."
 purge_neutering_tooltip_delayed:0 "§LKẻ thích nghi sinh tồn, kẻ yếu kém bị đào thải. Quốc gia của chúng ta sẽ tiến về tương lai, nhưng tương lai này không bao gồm tất cả mọi người.§!"
 purge_labor_camps:0 "Lao động Khổ sai"
 purge_labor_camps_tooltip:0 "Dân số bị ảnh hưởng sẽ phải chịu khổ sai chung thân. Họ sẽ được sử dụng để sản xuất £food£§HThực phẩm§! (hoặc các vật phẩm tương đương) và chỉ có cái chết mới giải thoát họ khỏi đau khổ."
 purge_labor_camps_tooltip_delayed:1 "§LTrước khi chết, ít ra họ cũng có chút giá trị lợi dụng.§!"
 purge_processing:0 "Gia công"
 purge_processing_tooltip:1 "Dân số bị ảnh hưởng sẽ được gia công thành [Root.GetPurgeProcessingResource] cho đến khi chết."
 purge_processing_tooltip_delayed:0 "§LĐây là một thực tế phũ phàng nhưng không thể tránh khỏi: Một số giống loài hạ đẳng sinh ra là để làm nhiên liệu cho ngọn lửa tham vọng của các giống loài thượng đẳng.§!"
 purge_matrix:1 "Xử lý Hóa học"
 purge_matrix_tooltip:1 "Dân số bị ảnh hưởng sẽ được tích hợp vào mạng lưới năng lượng, các phản ứng hóa học duy trì sự sống của họ sẽ được định tuyến lại để tăng cường dự trữ năng lượng của chúng ta. Quá trình này gây tử vong nhưng chậm chạp."
 purge_matrix_tooltip_delayed:1 "§LHọ sẽ sớm được biến đổi thành một hình thức hiệu quả hơn.§!"
 purge_necrophage:0 "Thi hóa"
 purge_necrophage_tooltip:0 "Dân số bị ảnh hưởng sẽ dần bị phân rã thành giống loài [From.GetSpeciesAdj], bất kể ý chí của họ ra sao."
 purge_necrophage_tooltip_delayed:0 "§LChỉ có chủng tộc mạnh nhất mới có thể tồn tại trong biển sao đầy rẫy nguy hiểm này. Bằng cách này, sự nghiệp của họ sẽ được [From.GetSpeciesNamePlural] tiếp tục.§!"
 slavery_matrix:0 "Sáp nhập vào Lưới điện"
 slavery_matrix_tooltip:0 "Một giải pháp lâu dài thay thế cho Xử lý Hóa học, đảm bảo có đủ dân số hữu cơ sống sót để cung cấp nguồn năng lượng ổn định cho lưới điện của chúng ta."
 slavery_matrix_tooltip_delayed:0 "§LViệc này kết hợp với năng lượng nhiệt hạch, chúng ta sẽ có nguồn năng lượng vô tận.§!"
 migration_control_yes:0 "Đã bật Kiểm soát Di cư"
 migration_control_yes_tooltip:0 "§HKiểm soát Di cư§! ngăn dân số của giống loài này tự do di cư giữa các hành tinh trong lãnh thổ của chúng ta."
 migration_control_yes_tooltip_delayed:0 "§LDòng chảy dân số tự do có thể giúp phân bổ tài nguyên hiệu quả hơn, nhưng đôi khi hiệu quả không phải là điều chúng ta quan tâm nhất.§!"
 migration_control_no:0 "Không Kiểm soát Di cư"
 migration_control_no_tooltip:1 "§HKhông Kiểm soát Di cư§! cho phép dân số của giống loài này tự do di cư giữa các thuộc địa của chúng ta."
 migration_control_no_tooltip_delayed:2 "§LGiống như tổ tiên chúng ta từng lang thang khắp nơi tìm kiếm một mái nhà, mọi sự sống đều có quyền tự do tìm kiếm vận mệnh của mình giữa các vì sao.§!"
 population_control_yes:0 "Bật Kiểm soát Dân số"
 population_control_yes_tooltip:0 "§HKiểm soát Dân số§! ngăn chặn sự gia tăng hoặc lắp ráp vô tội vạ của dân số giống loài này."
 population_control_yes_tooltip_delayed:0 "§LChỉ cần kế sinh nhai của một giống loài có chút thay đổi, dữ liệu dân số học của họ sẽ trở thành món đồ chơi trong tay chúng ta.§!"
 population_control_no:0 "Không Kiểm soát Dân số"
 population_control_no_tooltip:0 "$population_control_yes_tooltip$"
 population_control_no_tooltip_delayed:1 "§LMột giống loài không có khả năng sinh sản sẽ nhanh chóng biến mất trong dòng chảy của lịch sử.§!"
 colonization_control_yes:0 "Cấm Khai hoang"
 colonization_control_yes_tooltip:0 "§HQuyền Khai hoang§! xác định xem giống loài này có quyền lên các con tàu khai hoang để tiến đến những thế giới mới hay không."
 colonization_control_yes_tooltip_delayed:1 "§LTrong sự vô tận lạnh lẽo và trống rỗng của không gian, các hành tinh có thể sinh sống được thực sự là vô giá. Nhưng không phải mọi sự sống đều xứng đáng với những viên ngọc quý giá này.§!"
 colonization_control_no:0 "Cho phép Khai hoang"
 colonization_control_no_tooltip:0 "$colonization_control_yes_tooltip$"
 colonization_control_no_tooltip_delayed:1 "§LChúng ta lấy quyền gì để phủ nhận ước mơ chinh phục những vì sao của một giống loài? Chỉ khi cùng nhau nỗ lực, chúng ta mới có hy vọng chiến thắng bóng tối bao la.§!"
