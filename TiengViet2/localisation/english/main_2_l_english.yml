 TECH_UNLOCK_TERRAFORMING_TEMP_CHANGE_TITLE:0 "§HMở khóa tính năng: §!Thao túng khí quyển"
 TECH_UNLOCK_TERRAFORMING_TEMP_CHANGE_DESC:1 "§HThao túng khí quyển§!\nCho phép chúng ta kiểm soát khí hậu của hành tinh trong quá trình cải tạo."
 TECH_UNLOCK_VOLCANO_TERRAFORM_TITLE: "§HLựa chọn nghiên cứu: §!Cải tạo hành tinh núi lửa"
 TECH_UNLOCK_VOLCANO_TERRAFORM_DESC: "Cho phép chúng ta cải tạo hành tinh núi lửa thành khí hậu ôn đới."
 TECH_UNLOCK_VOLCANIC_TERRAFORM_TITLE: "§HMở khóa tính năng: §!Cải tạo hành tinh núi lửa"
 TECH_UNLOCK_VOLCANIC_TERRAFORM_DESC: "$TECH_UNLOCK_VOLCANO_TERRAFORM_DESC$"
 TECH_UNLOCK_TERRAFORMING_GAIA_CHANGE_TITLE:0 "§HMở khóa tính năng: §!Tạo Gaia"
 TECH_UNLOCK_TERRAFORMING_GAIA_CHANGE_DESC:0 "§HThao túng khí quyển§!\nCho phép chúng ta biến đổi các hành tinh thành thế giới Gaia."
 TECH_UNLOCK_TERRAFORMING_NUKED_CHANGE_TITLE:2 "§HMở khóa tính năng: §!Phục hồi khí hậu"
 TECH_UNLOCK_TERRAFORMING_NUKED_CHANGE_DESC:3 "§HPhục hồi khí hậu§!\nCho phép chúng ta cải tạo những hành tinh có hệ sinh thái bị hủy hoại."
 TECH_UNLOCK_SPACEPORT_CONSTRUCTION_TITLE:0 "§HMở khóa trạm không gian: §!Cảng không gian"
 TECH_UNLOCK_SPACEPORT_CONSTRUCTION_DESC:0 "§HCảng không gian§!\nĐể chế tạo bất kỳ loại tàu nào có khả năng bay vào không gian, Cảng không gian là không thể thiếu. Có thể nâng cấp thêm chức năng hoặc trang bị vũ khí nhẹ cho Cảng không gian."
 TECH_UNLOCK_SCIENCE_SHIP_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Tàu khoa học"
 TECH_UNLOCK_SCIENCE_SHIP_CONSTRUCTION_DESC:0 "§HTàu khoa học§!\nTàu khoa học là căn cứ di động của các nhà khoa học hàng đầu, được sử dụng để khám phá không gian bao la."
 TECH_UNLOCK_CONSTRUCTION_SHIP_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Tàu xây dựng"
 TECH_UNLOCK_CONSTRUCTION_SHIP_CONSTRUCTION_DESC:0 "§HTàu xây dựng§!\nTàu xây dựng sử dụng các thiết bị không người lái hàn tiên tiến để lắp ráp nhiều loại trạm không gian khác nhau."
 TECH_UNLOCK_COLONY_SHIP_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Tàu khai hoang"
 TECH_UNLOCK_COLONY_SHIP_CONSTRUCTION_DESC:0 "§HTàu khai hoang§!\nTàu khai hoang là loại tàu dùng một lần được sử dụng khi định cư ở các thế giới mới. Sau khi tiến hành khai hoang, tàu sẽ tự động biến thành nơi ở và cung cấp một số cơ sở hạ tầng cơ bản cho cư dân."
 TECH_UNLOCK_CORVETTE_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Tàu hộ tống"
 TECH_UNLOCK_CORVETTE_CONSTRUCTION_DESC:0 "§HTàu hộ tống§!\nTàu hộ tống là một trong những loại tàu chiến cơ bản nhất, được trang bị vũ khí và có thể giao chiến với kẻ thù."
 TECH_UNLOCK_DESTROYER_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Tàu khu trục"
 TECH_UNLOCK_DESTROYER_CONSTRUCTION_DESC:0 "§HTàu khu trục§!\nTàu khu trục với thiết kế hai phân khu có thể cung cấp nhiều loại vũ khí chiến lược khác nhau."
 TECH_UNLOCK_CRUISER_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Tàu tuần dương"
 TECH_UNLOCK_CRUISER_CONSTRUCTION_DESC:0 "§HTàu tuần dương§!\nTàu tuần dương có thiết kế ba phân khu và có thể tự do sửa đổi với nhiều mô-đun bổ sung khác nhau miễn là bạn sẵn sàng trả thêm phí."
 TECH_UNLOCK_BATTLESHIP_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Thiết giáp hạm"
 TECH_UNLOCK_BATTLESHIP_CONSTRUCTION_DESC:1 "§HThiết giáp hạm§!\nThiết giáp hạm mang theo hỏa lực vô song và có kích thước thân tàu lớn nhất, nhưng chi phí cao và khả năng cơ động kém."
 TECH_UNLOCK_TITAN_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Titan"
 TECH_UNLOCK_TITAN_CONSTRUCTION_DESC:0 "§HTitan§!\nNhững tàu chiến khổng lồ này là niềm tự hào của toàn bộ hạm đội, Titan mang theo nhiều loại vũ khí và thường được sử dụng làm soái hạm."
 TECH_UNLOCK_JUGGERNAUT_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Juggernaut"
 TECH_UNLOCK_JUGGERNAUT_CONSTRUCTION_DESC:0 "§HJuggernaut§!\nNhững cấu trúc khổng lồ này vừa là tàu vừa là trạm không gian. Juggernaut là một trạm không gian di động khổng lồ có thể sửa chữa và chế tạo tàu, có nghĩa là nó có thể được sử dụng như một căn cứ tiền phương khi hoạt động trong các chiến dịch tấn công."
 TECH_UNLOCK_DEFENSE_PLATFORM_TITLE:0 "§HMở khóa trạm không gian: §!Nền tảng phòng thủ"
 TECH_UNLOCK_DEFENSE_PLATFORM_DESC:0 "§HNền tảng phòng thủ§!\n$tech_space_defense_station_1_desc$"
 TECH_UNLOCK_DEFENSE_STATION_TITLE:0 "§HMở khóa trạm không gian: §!Trạm phòng thủ"
 TECH_UNLOCK_DEFENSE_STATION_DESC:0 "§HTrạm phòng thủ§!\n$tech_space_defense_station_2_desc$"
 TECH_UNLOCK_FORTRESS_TITLE:0 "§HMở khóa trạm không gian: §!Pháo đài"
 TECH_UNLOCK_FORTRESS_DESC:0 "§HPháo đài§!\n$tech_space_defense_station_3_desc$"
 TECH_UNLOCK_MINING_STATION_TITLE:0 "§HMở khóa trạm không gian: §!Trạm khai thác"
 TECH_UNLOCK_MINING_STATION_DESC:0 "§HTrạm khai thác§!\nTrạm khai thác có thể thu thập khoáng sản và tài nguyên quý giá của hành tinh từ quỹ đạo."
 TECH_UNLOCK_RESEARCH_STATION_TITLE:0 "§HMở khóa trạm không gian: §!Trạm nghiên cứu"
 TECH_UNLOCK_RESEARCH_STATION_DESC:0 "§HTrạm nghiên cứu§!\nTrạm nghiên cứu có thể nghiên cứu các hiện tượng hành tinh khác nhau trên quỹ đạo và thu thập dữ liệu nghiên cứu có giá trị."
 TECH_UNLOCK_AFTERBURNER_1_TITLE:0 "§HMở khóa bộ phận: §!Buồng đốt sau"
 TECH_UNLOCK_AFTERBURNER_1_DESC:0 "§HBuồng đốt sau§!\nNhững động cơ đẩy mạnh mẽ này có thể cung cấp thêm tốc độ chiến đấu, nhưng tiêu thụ rất nhiều năng lượng."
 TECH_UNLOCK_AFTERBURNER_2_TITLE:0 "§HMở khóa bộ phận: §!Buồng đốt sau tiên tiến"
 TECH_UNLOCK_AFTERBURNER_2_DESC:0 "§HBuồng đốt sau tiên tiến§!\nPhiên bản cải tiến của buồng đốt sau tiêu chuẩn, mang lại tốc độ chiến đấu cao hơn nữa cho tàu chiến."
 TECH_UNLOCK_THRUSTER_1_TITLE:0 "§HMở khóa bộ phận: §!Động cơ đẩy hóa học"
 TECH_UNLOCK_THRUSTER_1_DESC:0 "§HĐộng cơ đẩy hóa học§!\nĐộng cơ đẩy hóa học có thiết kế đơn giản và hiệu suất trung bình, tạo ra động lực thông qua nhiên liệu đẩy thông thường."
 TECH_UNLOCK_THRUSTER_2_TITLE:0 "§HMở khóa bộ phận: §!Động cơ đẩy Ion"
 TECH_UNLOCK_THRUSTER_2_DESC:0 "§HĐộng cơ đẩy Ion§!\nMột động cơ điện không cần nhiên liệu đẩy, sử dụng chùm ion để tạo ra lực đẩy."
 TECH_UNLOCK_THRUSTER_3_TITLE:0 "§HMở khóa bộ phận: §!Động cơ đẩy Plasma"
 TECH_UNLOCK_THRUSTER_3_DESC:0 "§HĐộng cơ đẩy Plasma§!\nVới hệ thống động cơ điện tiên tiến, động cơ đẩy Plasma cho phép tàu đạt tốc độ cận quang tốc nhanh hơn và tăng cường khả năng cơ động."
 TECH_UNLOCK_THRUSTER_4_TITLE:0 "§HMở khóa bộ phận: §!Động cơ đẩy xung"
 TECH_UNLOCK_THRUSTER_4_DESC:0 "§HĐộng cơ đẩy xung§!\nMột động cơ đẩy lai cực kỳ tiên tiến mang lại cho tàu khả năng cơ động vô song trong khi vẫn có thể đạt được tốc độ cận quang tốc."
