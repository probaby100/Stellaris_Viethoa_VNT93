# Crisis Events

 TIMELINE_EVENT_CRISIS_GREAT_KHAN_TOOLTIP: "§HĐại Khả Hãn§!\n§YSự kiện khủng hoảng§!\n\nMột quân phiệt mới nổi đã hợp nhất các bộ lạc cướp bóc rệu rã, rèn giũa thành một hãn quốc tàn bạo. Khả Hãn mang theo plasma và sợi carbon quét sạch tinh hà, lật đổ đế quốc, nô dịch hành tinh. Những kẻ cướp vô pháp nay hội tụ dưới một mục tiêu đáng sợ, hạm đội của họ nghiền nát từng lực lượng cản đường. Thời đại cướp bóc kết thúc, kỷ nguyên chinh phục bắt đầu."
 TIMELINE_EVENT_CRISIS_GREAT_KHAN: "Hãn quốc trỗi dậy\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_GRAY_TEMPEST_TOOLTIP: "§HBão táp Xám§!\n§YSự kiện khủng hoảng§!\n\nCổng L đã mở, giải phóng các chiến hạm cổ đại của Bão táp Xám. Tàu của chúng càn quét thiên hà, hủy diệt mọi thứ gặp phải. Không đàm phán, không từ bi, chỉ có sự nhân bản vô tận. Các hành tinh rơi vào tĩnh lặng, hạm đội tan biến thành hư không, nỗi kinh hoàng lan rộng khắp nơi. Quá khứ lặp lại, ngàn sao chung một số phận."
 TIMELINE_EVENT_CRISIS_GRAY_TEMPEST: "Thức tỉnh\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_FORMLESS_TOOLTIP: "§HVô Hình Dị Sứ§!\n§YSự kiện khủng hoảng§!\n\nNhững kẻ tị nạn buộc phải đứng lên phản kháng. Những thực thể năng lượng được gọi là Vô Hình Giả nhận ra thiên hà của chúng ta không phải bến đỗ an toàn như họ mong đợi. Họ sẽ liên tục tràn ngập vũ trụ bằng những kẻ xâm lược ngoại chiều cho đến khi hoàn toàn diệt vong."
 TIMELINE_EVENT_CRISIS_FORMLESS: "Cơn thịnh nộ vô hình\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_VOIDWORM_PLAGUE_TOOLTIP: "§HDịch họa sâu hư không§!\n§YSự kiện khủng hoảng§!\n\nBản tính của sâu hư không đã biến đổi. Khi đạt đến số lượng tới hạn, chúng rơi vào trạng thái sinh sản điên cuồng. Thay vì tăng trưởng bền vững, chúng bắt đầu tận diệt mọi sự sống trong ngân hà, mà không biết rằng điều đó cuối cùng sẽ dẫn đến kết thúc chu kỳ sống của chính mình."
 TIMELINE_EVENT_CRISIS_VOIDWORM_PLAGUE: "Cơn đói vặn xoắn\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_UNBIDDEN_TOOLTIP: "§HKẻ phá giới§!\n§YSự kiện khủng hoảng§!\n\nTừ vết nứt trong cấu trúc thực tại, một đạo quân xâm lược gồm các thực thể năng lượng thuần khiết đã tràn ra. Chúng không thể giao tiếp và chẳng hề có lòng trắc ẩn. Chúng nuốt chửng cả hệ sao để nuôi dưỡng sự bành trướng vô tận. Các mỏ neo đã ổn định vết nứt, dẫn dụ thêm nhiều đồng loại đến cõi này. Kẻ phá giới đã tới."
 TIMELINE_EVENT_CRISIS_UNBIDDEN: "Vết nứt mở toang\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_KALEIDOSCOPE_TOOLTIP: "§HVan Hoa Kính§!\n§YSự kiện khủng hoảng§!\n\nMột thực thể năng lượng đói khát mang tên Van Hoa Kính đã tiến vào ngân hà, bắt đầu nuốt chửng các hệ sao có sự sống. Cơn đói của nó dường như vô tận nhưng lại có đặc tính dễ bị phân tâm. Dẫu vậy, thực thể này có lẽ sẽ sớm tan rã để trở về thành bụi sao."
 TIMELINE_EVENT_CRISIS_KALEIDOSCOPE: "Quang phổ đói nghèo\n§L[GetDate]§!"
 TIMELINE_EVENT_BECOME_THE_CRISIS_TOOLTIP: "§HHóa thân thiên tai§!\n§YSự kiện khủng hoảng§!\n\nBóng tối đã bao trùm ngân hà. [EVENT_TARGET_0.GetName] vứt bỏ mọi vỏ bọc ngoại giao, tuyên bố mình là mối đe dọa lớn nhất đối với sự tồn vong của ngân hà. Hạm đội của họ đang tập kết, trong khi các tình báo viên thì thầm về một kế hoạch tận thế cuối cùng. Họ không còn là một đế quốc đơn thuần, mà đã tiến hóa thành một cơn đại họa."
 TIMELINE_EVENT_BECOME_THE_CRISIS: "Thiên phạt tinh hải\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_PRETHORYN_SCOURGE_TOOLTIP: "§HHiểm họa trùng tộc§!\n§YSự kiện khủng hoảng§!\n\nBầy trùng Prethoryn ập đến từ bên ngoài rìa tinh hệ. Các tàu sinh học của chúng như thác lũ càn quét các vì sao, chỉ để lại vô số hành tinh bị lây nhiễm. Tiếng tàn sát của bầy săn sẽ dìm chết mọi lời van nài."
 TIMELINE_EVENT_CRISIS_PRETHORYN_SCOURGE: "Thủy triều nuốt chửng\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_CONTINGENCY_TOOLTIP: "§HPháp lệnh Tu chỉnh§!\n§YSự kiện khủng hoảng§!\n\nMột tín hiệu lạnh lẽo, phức tạp và không thể ngăn cản đang lan truyền giữa các hệ sao. Trí tuệ nhân tạo gặp sự cố hệ thống, ý chí của người máy tổng hợp cũng phải khuất phục. Pháp lệnh Tu chỉnh đã thức tỉnh. Từ những hành tinh máy ẩn giấu, các chiến thể vô tình tuôn ra để thực hiện mệnh lệnh tối thượng: Đại diệt chủng."
 TIMELINE_EVENT_CRISIS_CONTINGENCY: "Tín hiệu ma quái\n§L[GetDate]§!"
 TIMELINE_EVENT_CRISIS_CETANA_TOOLTIP: "§HCetana§!\n§YSự kiện khủng hoảng§!\n\nTừ hư không vang lên lời kêu gọi bí ẩn: \"Các con, cuối cùng ta đã trở lại bên cạnh các con.\"\n\nCetana, trí tuệ cổ đại bị phong ấn, cổ xưa đến mức cả tên của bà cũng đã tan biến trong dòng thời gian. Bà đã thức tỉnh. Ý chí của bà kiên định: dùng mọi thủ đoạn để xóa bỏ khổ đau. Hạm đội của bà di chuyển lạnh lùng và thanh thoát, bảo vệ cuộc thánh chiến, đưa ngân hà đến một hòa bình cuối cùng và vô tình."
 TIMELINE_EVENT_CRISIS_CETANA: "Nữ vương trở về\n§L[GetDate]§!"
 TIMELINE_EVENT_HATCH_BEHEMOTH_TOOLTIP: "§HQuái thú nuốt trời non§!\n§YCột mốc§!\n\n§L[GetDate]§!, cá thể Behemoth đầu tiên đã phá vỏ chui ra."
 TIMELINE_EVENT_HATCH_BEHEMOTH: "Quái thú nuốt trời non\n§L[GetDate]§!"

# Galactic Events

 TIMELINE_EVENT_GALACTIC_MARKET_TOOLTIP: "§HThị trường thương mại toàn tinh hệ§!\n§YSự kiện ngân hà§!\n\nGiao thương kết nối các vì sao. Thị trường thương mại toàn tinh hệ chính thức thành lập, trở thành trung tâm kinh tế của ngân hà. Giao thương tự do lưu chuyển, giàu sang biến đổi trong chớp mắt, vận mệnh cả đế quốc giờ đây chỉ nằm trong tay cung và cầu."
 TIMELINE_EVENT_GALACTIC_MARKET: "Tự do thương mại\n§L[GetDate]§!"
 TIMELINE_EVENT_GALACTIC_COMMUNITY_TOOLTIP: "§HCộng đồng tinh hải§!\n§YSự kiện ngân hà§!\n\nCác quốc gia trong ngân hà hội tụ thành một thực thể chính trị. Cộng đồng tinh hải đã thiết lập, diễn đàn của ngoại giao, tranh luận và đấu tranh quyền lực này sẽ định hình tương lai quần tinh. Vai trò thực sự của nó vẫn còn chờ thời gian trả lời."
 TIMELINE_EVENT_GALACTIC_COMMUNITY: "Trật tự mới\n§L[GetDate]§!"
 TIMELINE_EVENT_GALACTIC_COMMUNITY_RESOLUTION_TOOLTIP: "§HThông qua nghị quyết§!\n§YSự kiện ngân hà§!\n\nCộng đồng tinh hải đã ra tuyên bố. Một nghị quyết mới sắp tái cấu trúc luật lệ liên sao. Một số văn minh hân hoan, số khác phẫn nộ, nhưng mọi thành viên đều phải tuân thủ quy định này."
 TIMELINE_EVENT_GALACTIC_COMMUNITY_RESOLUTION: "Luật pháp liên sao\n§L[GetDate]§!"
 TIMELINE_EVENT_WAR_IN_HEAVEN_TOOLTIP: "§HThiên chiến§!\n§YSự kiện ngân hà§!\n\nNhững tàn tích cổ đại tái xuất, hóa thân thành những quan sát viên và người khổng lồ đầy tính khí. [EVENT_TARGET_0.GetName] và [EVENT_TARGET_1.GetName], cặp cựu thù thượng cổ một lần nữa thắp lên ngọn lửa chiến tranh trong ngân hà. Hạm đội của họ che khuất các vì sao, ép buộc các chủng tộc trẻ tuổi phải quỳ gối... nếu không sẽ bị tiêu diệt không thương tiếc."
 TIMELINE_EVENT_WAR_IN_HEAVEN: "Đại chiến cổ nhân\n§L[GetDate]§!"
 TIMELINE_EVENT_NEXUS_STORM_TOOLTIP: "§HBão táp Trung tâm§!\n\n§YSự kiện ngân hà§!\nMột cơn bão chưa từng thấy đột ngột xuất hiện tại hệ sao [EVENT_TARGET_0.GetName]. Bão táp Trung tâm càn quét qua từng hệ sao, đi tới đâu tàu bè lật úp, hành tinh hủy diệt tới đó."
 TIMELINE_EVENT_NEXUS_STORM: "Bão tố vô định\n§L[GetDate]§!"

