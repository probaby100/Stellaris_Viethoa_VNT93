 sr_zro_desc:0 "Một loại sol khí cực hiếm lẫn trong các hạt dị thường, được phát hiện cùng với các vụ va chạm thiên thạch. Tuy nhiên nguồn gốc thực sự vẫn là một bí ẩn. Nếu [GetIndividualNamePlural] có năng khiếu tâm linh [GetIngestedLoc] Zro, nó sẽ trở thành một loại [GetDrugLoc] giúp tăng cường sức mạnh tâm linh đáng kể (và có thể gây nghiện)."
 sr_living_metal:0 "Kim loại Sống"
 sr_living_metal_desc:1 "Loại kim loại vô cơ này mang những đặc điểm thường thấy ở sinh vật sống. Nó sẽ tự động phục hồi về hình dạng đã được định hình."

 sr_dark_matter:0 "Vật chất Tối"
 sr_dark_matter_desc:1 "Vật chất bí ẩn này có nhiều đặc tính dường như phá vỡ mọi quy luật tự nhiên. Nó chỉ đạt mật độ có thể khai thác quanh các lỗ đen hoặc một số tinh vân."

