 civic_tooltip_criminal_heritage_effects:3 "Có thể xây dựng §YChi nhánh§! trên các hành tinh của những đế chế thông thường không có chiến tranh hoặc không có thỏa thuận đình chiến với bạn\nMức độ tội phạm trên hành tinh có §YChi nhánh§! sẽ làm tăng giá trị của chi nhánh đó\nCó thể xây dựng £building£§Y$BRANCH_OFFICE_BUILDINGS$§! đặc biệt giúp làm tăng tỷ lệ tội phạm"
 civic_tooltip_inward_perfection_effects:10 "Không thể thiết lập §YKẻ thù§!\nKhông thể ký kết §YHiệp ước Phòng thủ§!\nKhông thể ký kết §YHiệp ước Di cư§!\nKhông thể ký kết §YThỏa thuận Nghiên cứu§!\nKhông thể ký kết §YHiệp định Thương mại§!\nKhông thể §YĐảm bảo Độc lập§!\nKhông thể gia nhập §YLiên bang§!\nKhông thể §YThâm nhập§! nền văn minh Tiền siêu quang tốc\nKhông thể ép buộc §YChư hầu§!\nKhông thể sử dụng chính sách §YChiến tranh Không giới hạn§!\n"
 civic_tooltip_feudal_realm_effects:7 "—Bỏ qua các §YYêu cầu Ngoại giao§! khi đề nghị §YThu nạp Chư hầu§!\n—§YChư hầu§! của bạn không thể có các điều khoản hiệp ước sau:\n$t$$TRIGGER_FAIL$§Y$subject_cannot_expand$§!\n$t$$TRIGGER_FAIL$§YKhông tham gia chiến tranh của Tông chủ§!\n$t$$TRIGGER_FAIL$§Y$subject_can_not_do_diplomacy$§!"
 civic_tooltip_franchising_effects:5 "—§YChư hầu§! của bạn không thể ký kết các thỏa thuận sau:\n$t$$TRIGGER_FAIL$§Y$subject_cannot_expand$§!\n$t$$TRIGGER_FAIL$§Y$subject_can_not_do_diplomacy$§!\n$t$$TRIGGER_FAIL$§Y$subject_does_not_get_sensors$§!\n—Có thể xây dựng $AVAILABLE_HOLDINGS$£building£§Y$holding_franchise_headquarters$§! trên thuộc địa của chư hầu\n—£building£§Y$building_commercial_forum$§!$megacorp_civic_branch_office_building_effect$"
