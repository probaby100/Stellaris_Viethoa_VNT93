# Origin Events

 TIMELINE_EVENT_GALACTIC_DOORSTEP_TOOLTIP: "§H$origin.1050.name$§!\n§YSự kiện nguồn gốc§!\n\nTàu của chúng ta hiện có thể du hành đến hệ sao song sinh, nơi các kiến trúc sư để lại bí mật xây dựng như món quà cuối cùng. Những bí ẩn dần sáng tỏ. Chúng ta sẽ sớm thiết lập cổng dịch chuyển riêng, biến những khoảng cách xa xôi trong đế quốc thành lối đi thông suốt."
 TIMELINE_EVENT_GALACTIC_DOORSTEP: "Mở lối Vương miện Đen\n§L[GetDate]§!"
 TIMELINE_EVENT_LOST_COLONY_TOOLTIP: "§HPhát hiện hành tinh mẹ§!\n§YSự kiện nguồn gốc§!\n\nChúng ta đã liên lạc được với nền văn minh khai sinh ra chính mình. Dù thời gian đã nhào nặn chúng ta thành những thực thể khác biệt, bí ẩn nguồn gốc đã sáng tỏ. Tiếng vọng từ quá khứ chung sẽ định hình tương lai."
 TIMELINE_EVENT_LOST_COLONY: "Trở về cội nguồn\n§L[GetDate]§!"
 TIMELINE_EVENT_RESOURCE_CONSOLIDATION_TOOLTIP: "§HKiến tạo hành tinh máy§!\n§YSự kiện nguồn gốc§!\n\nChúng ta đã đúc nên một hành tinh máy thực thụ, loại bỏ mọi sự kém hiệu quả và mục rữa hữu cơ. Tương lai sẽ xây trên sắt thép và được cai trị bởi các thuật toán."
 TIMELINE_EVENT_RESOURCE_CONSOLIDATION: "Tái cấu trúc hành tinh\n§L[GetDate]§!"
 TIMELINE_EVENT_REMNANTS_TOOLTIP: "§HKhôi phục hành tinh đô thị§!\n§YSự kiện nguồn gốc§!\n\nĐế quốc đã tái hiện vinh quang xưa cũ của hành tinh mẹ. Di sản cổ đại này một lần nữa kiêu hãnh giữa tinh hà dưới danh hiệu hành tinh đô thị. Đây là minh chứng cho ý chí và tham vọng của chúng ta."
 TIMELINE_EVENT_REMNANTS: "Hành tinh tái sinh\n§L[GetDate]§!"
 TIMELINE_EVENT_SHATTERED_RING_TOOLTIP: "§HKhôi phục thế giới vành đai§!\n§YSự kiện nguồn gốc§!\n\nNhững tàn tích vỡ vụn tại hệ sao mẹ đã được khôi phục hoàn toàn. Nghĩa địa của những tham vọng cũ nay đã trở thành ngọn hải đăng rực rỡ của văn minh."
 TIMELINE_EVENT_SHATTERED_RING: "Vành đai hàn gắn\n§L[GetDate]§!"
 TIMELINE_EVENT_LEGENDARY_LEADER_TOOLTIP: "§HĐịnh mệnh hoàn tất§!\n§YSự kiện nguồn gốc§!\n\nHành trình của đấng rạng ngời đã đến giai đoạn cuối. Nó hoặc là sự cai trị vĩnh cửu đúc kết nên đế quốc, hoặc đánh dấu một kỷ nguyên mới — nơi quần thần cùng gánh vác, tái định hình tương lai."
 TIMELINE_EVENT_LEGENDARY_LEADER: "Định mệnh cuối cùng\n§L[GetDate]§!"
 TIMELINE_EVENT_SHROUDWALKER_APPRENTICE_TOOLTIP: "§HHoàn thành đường hầm Hư cảnh§!\n§YSự kiện nguồn gốc§!\n\nTấm màn ngăn cách thực tại đã được vén lên, giờ đây đường hầm Hư cảnh đầu tiên kết nối đế quốc với thế giới chưa biết. Trong kẽ hở này, khoảng cách và thời gian sụp đổ, mở ra lối đi nơi từng chỉ có hư vô. Điều bí ẩn hay nguy hiểm nào đang chờ đón chúng ta?"
 TIMELINE_EVENT_SHROUDWALKER_APPRENTICE: "Vén màn thực tại\n§L[GetDate]§!"
 TIMELINE_EVENT_VOID_DWELLERS_TOOLTIP: "§HHoàn thành trạm cư trú§!\n§YSự kiện nguồn gốc§!\n\nGiữa hư không, tinh thành mọc lên. Trạm cư trú mới đầu tiên đánh dấu sự mở rộng biên cương không gian, đảm bảo thần dân không bao giờ phải gánh chịu sức nặng của việc sinh tồn trên hành tinh."
 TIMELINE_EVENT_VOID_DWELLERS: "An cư giữa hư không\n§L[GetDate]§!"
 TIMELINE_EVENT_OCEAN_PARADISE_TOOLTIP: "§HChúa tể đại dương§!\n§YSự kiện nguồn gốc§!\n\nNắm giữ sức mạnh tâm điểm của nước, chúng ta tái cấu trúc hành tinh mẹ, khiến đại dương vốn đã bao la nay vượt xa giới hạn tự nhiên. Thủy triều đã cúi đầu thần phục, và chẳng mấy chốc, cả thiên hà cũng sẽ như vậy."
 TIMELINE_EVENT_OCEAN_PARADISE: "Triệu hồi thủy triều\n§L[GetDate]§!"
