 living_standard_organic_trophy:0 "Điều dưỡng Cưỡng bức"
 living_standard_organic_trophy_tooltip:1 "Thông qua các biện pháp điều dưỡng và nuôi dưỡng cưỡng chế, một phần nhỏ sinh vật sống dưới tiêu chuẩn sống này được nuôi như những món đồ trưng bày.\n\n$ORGANIC_TROPHY_POP_EFFECTS$"
 living_standard_organic_trophy_tooltip_delayed:0 "§LAi mới là búp bê sống tốt đây? Các người! Chính là các người!§!"
 living_standard_chemical_bliss:0 "Cực lạc Hóa học"
 living_standard_chemical_bliss_tooltip:3 "Các phương tiện giải trí giống như ma túy khiến họ đắm chìm trong đó không thể thoát ra. Dân số trong trạng thái này rất hạnh phúc, nhưng không thể làm việc bình thường.\n\n$living_standard_chemical_bliss_happiness_tooltip$"
