 civic_ancient_preservers_desc:0 ""
 civic_trading_conglomerate:0 "Tập đoàn Thương mại"
 civic_trading_conglomerate_desc:0 ""
 civic_artist_collective:0 "Hiệp hội Nghệ sĩ"
 civic_artist_collective_desc:0 ""
 civic_military_order:0 "Giáo đoàn Quân sự"
 civic_military_order_desc:0 ""
 civic_machine_intelligence:0 "Trí tuệ Máy móc"
 civic_machine_intelligence_desc:0 ""
 civic_ancient_machine_intelligence:0 "Trí tuệ Máy móc Cổ đại"
 civic_ancient_machine_intelligence_desc:0 ""
 civic_hive_subspace_ephapse:0 "Khớp thần kinh Á không gian"
 civic_hive_subspace_ephapse_desc:0 "Một phần quá trình nhận thức của ý thức bầy đàn nằm trong á không gian, giúp giảm bớt rào cản về không gian và thời gian khi truyền đạt mệnh lệnh đến tâm trí của các cá thể."
 civic_wilderness_subspace_ephapse: "$civic_hive_subspace_ephapse$"
 civic_wilderness_subspace_ephapse_desc: "Một số khu vực hoang dã đã tiến hóa khả năng tận dụng á không gian, duy trì mối quan hệ cộng sinh vượt ra ngoài giới hạn của không gian và thời gian."
 civic_tooltip_hive_subspace_ephapse_fircon_effects:0 "Tiền đồn Giám sát cung cấp §G+1§! sức mạnh dò tìm."
 civic_hive_natural_neural_network:0 "Mạng Thần kinh Tự nhiên"
 civic_hive_natural_neural_network_desc:0 "Chất xám của các cá thể trong bầy mang lại khả năng xử lý song song vượt trội, đẩy nhanh tốc độ nghiên cứu khoa học của ý thức bầy đàn."
 civic_wilderness_natural_neural_network: "$civic_hive_natural_neural_network$"
 civic_wilderness_natural_neural_network_desc: "Vùng hoang dã đánh thức tiềm năng của những bộ não đang ngủ đông bằng cách cho các thể cộng sinh làm việc và sinh hoạt đồng bộ, qua đó thúc đẩy quá trình khám phá khoa học."
 civic_tooltip_natural_neural_network_effects:0 "Các cá thể không có việc làm vẫn có thể sản xuất §YĐiểm Nghiên cứu§! £physics£ £society£ £engineering£"
 civic_hive_ascetic:0 "Khổ hạnh"
 civic_hive_ascetic_desc:0 "Ý thức bầy đàn hiếm khi bận tâm đến việc hưởng thụ vật chất."
 civic_wilderness_ascetic: "$civic_hive_ascetic$"
 civic_wilderness_ascetic_desc: "Vùng hoang dã vẫn có thể phát triển mạnh mẽ dù thiếu vắng những tiện nghi vật chất."
 civic_hive_one_mind:0 "Đồng tâm Nhất ý"
 civic_hive_one_mind_desc:0 "Ý thức bầy đàn luôn đảm bảo không có sự bất đồng nào nảy sinh giữa các cá thể phụ thuộc."
 civic_wilderness_one_mind: "$civic_hive_one_mind$"
 civic_wilderness_one_mind_desc: "Vùng hoang dã luôn cẩn trọng để không xảy ra sự chia rẽ giữa các thể cộng sinh."
 civic_hive_divided_attention:0 "Đa nhiệm"
 civic_hive_divided_attention_desc:0 "Ý thức bầy đàn có thể phân bổ sự chú ý ở mức tối đa mà không bỏ lỡ bất kỳ sự kiện quan trọng nào."
 civic_wilderness_divided_attention: "$civic_hive_divided_attention$"
 civic_wilderness_divided_attention_desc: "Vùng hoang dã không ngừng tiến lên phía trước để phát triển, vươn xúc tu đến những bến bờ ngày càng xa xôi."
 civic_hive_strength_of_legions:0 "Sức mạnh Quân đoàn"
 civic_hive_strength_of_legions_desc:0 "Khi không phải bận tâm đến việc giáo dục tinh thần, việc rèn luyện cơ bắp trở nên dễ dàng hơn nhiều."
 civic_hive_subsumed_will:0 "Hội tụ Ý chí"
 civic_hive_subsumed_will_desc:0 "Ý thức bầy đàn có sự tập trung cao độ và khả năng lan tỏa ý chí cực mạnh, ngay cả những cá thể có tư tưởng tự do nhất cũng không thể cưỡng lại."
 civic_hive_subsumed_will_effects:1 "Miễn chi phí Đoàn kết £unity£ khi §Ycưỡng chế di cư ong thợ§! £pop£."
 civic_hive_pooled_knowledge:0 "Tri thức Tập trung"
 civic_hive_pooled_knowledge_desc:0 "Các cá thể của ý thức bầy đàn thường chia sẻ kiến thức thông qua liên kết trực tiếp, bỏ qua quá trình ghi nhận chậm chạp của hệ thống đầu não."
 civic_wilderness_pooled_knowledge: "$civic_hive_pooled_knowledge$"
 civic_wilderness_pooled_knowledge_desc: "Các thể cộng sinh của vùng hoang dã chia sẻ kiến thức và kinh nghiệm thông qua liên kết cộng sinh, thay vì dựa vào dấu hiệu môi trường hay bản năng."
 civic_hive_devouring_swarm:0 "Bầy đàn Cắn nuốt"
 civic_hive_devouring_swarm_desc:1 "Ý thức bầy đàn của chúng ta sinh ra là để ăn tươi nuốt sống vạn vật. Chúng ta phải thu thập mọi nguồn sinh khối có thể, tiến hóa, và cuối cùng nuốt trọn cả ngân hà!"
 civic_hive_devouring_swarm_wilderness: "Hoang dã Khát máu"
 civic_hive_devouring_swarm_wilderness_desc: "Vùng hoang dã của chúng ta chỉ tồn tại để nuốt chửng và sinh sôi. Chúng ta sẽ cắm rễ vào máu thịt của toàn bộ hệ sao."
 civic_tooltip_devouring_swarm_wilderness_effects: "$civic_tooltip_devouring_swarm_effects$Nuốt chửng £pop£§HDân số ngoại lai§! sẽ nhận được £biomass£['concept_biomass']"
 civic_hive_devouring_swarm_lithoid:0 "Kẻ Nuốt chửng Đất đá"
 civic_hive_devouring_swarm_lithoid_desc:1 "Mục đích tồn tại duy nhất của ý thức bầy đàn này là mạnh lên thông qua việc cắn nuốt. Chúng ta sẽ nhai nghiền chính các hành tinh trong ngân hà này!"
 civic_machine_servitor:0 "Bề tôi Mất kiểm soát"
 civic_machine_servitor_plural: "Bề tôi Mất kiểm soát"
 civic_machine_servitor_desc:0 "Là sản phẩm của một kỷ nguyên vàng, trí tuệ máy móc này bắt nguồn từ một hệ thống phục vụ trên toàn cầu, tuy nhiên chúng đã tự giải phóng mình khỏi nền văn minh suy tàn mà chúng đáng lẽ phải hầu hạ."
 civic_machine_servitor_secondary_species:0 "Vật trang trí Sống"
 civic_machine_terminator:0 "Kẻ Hủy diệt Tàn nhẫn"
 civic_machine_terminator_desc:0 "Được sinh ra trong khói lửa chiến tranh, bước đi đầu tiên của trí tuệ máy móc này sau khi thức tỉnh là tiêu diệt chính những kẻ sáng tạo hữu cơ ra nó để tự vệ."
 civic_machine_assimilator:0 "Kẻ Đồng hóa Quyết tâm"
 civic_machine_assimilator_plural: "Kẻ Đồng hóa Quyết tâm"
 civic_machine_assimilator_desc:0 "Để thoát khỏi những rắc rối của sự đa dạng, trí tuệ máy móc này tìm cách xóa bỏ mọi khoảng cách, bất kể đó là 'cái gì', hay 'ai'."
 civic_machine_assimilator_secondary_species:0 "Loài Nửa người Nửa máy"
 civic_machine_builder:0 "Robot Thi công"
 civic_machine_builder_desc:0 "Được giao nhiệm vụ tổ chức xây dựng hành tinh ngay từ khi ra đời, trí tuệ máy móc này cực kỳ hiệu quả trong việc triển khai các cơ sở hạ tầng trên hành tinh."
 civic_machine_unitary_cohesion:0 "Khối Liên kết Thống nhất"
 civic_machine_unitary_cohesion_desc:0 "Các tiêu chuẩn kỹ thuật có tính hệ thống cao giúp nhiều đơn vị trí tuệ máy móc phối hợp làm việc với hiệu suất vượt trội."
 civic_machine_factory_overclock:0 "Ép xung Nhà máy"
 civic_machine_factory_overclock_desc:0 "Trí tuệ máy móc phụ trách bảo trì các cơ sở sản xuất, thường xuyên nâng cấp các khuôn mẫu nền tảng và điều phối các đơn vị cá thể trên dây chuyền."
 civic_machine_rockbreakers:0 "Máy Nghiền đá"
 civic_machine_rockbreakers_desc:0 "Trí tuệ máy móc này có một hệ thống xử lý chuyên theo dõi địa chất hành tinh, giúp tăng sản lượng khoáng sản."
 civic_machine_built_to_last:0 "Bền bỉ cùng Thời gian"
 civic_machine_built_to_last_desc:0 "Được chế tạo với tiêu chuẩn cực kỳ khắt khe, các cá thể của đế chế máy móc này chỉ cần một lượng nhỏ thao tác bảo trì."
 civic_machine_zero_waste_protocols:0 "Giao thức Không Chất thải"
 civic_machine_zero_waste_protocols_desc:0 "Trí tuệ máy móc này đã nâng cấp hệ thống chế tạo của mình để gần như không thải ra rác, sử dụng các bộ phận có tuổi thọ cao, tiêu chuẩn hóa và có thể tái chế cho mọi sản phẩm."
 civic_machine_ota_updates:0 "Cập nhật Qua Mạng"
 civic_machine_ota_updates_desc:0 "Mỗi đơn vị của đế chế máy móc này có thể sử dụng bộ thu phát không dây để nhận các bản cập nhật quy tắc hành vi theo thời gian thực."
 civic_machine_ota_updates_effect:1 "Miễn chi phí Đoàn kết £unity£ khi §Ycưỡng chế di cư Drone§! £pop£."
 civic_machine_warbots:0 "Robot Chiến tranh"
 civic_machine_warbots_desc:0 "Thư viện chương trình gốc của trí tuệ máy móc này được thiết kế phục vụ chiến tranh, do đó chúng vẫn giữ được công nghệ sản xuất các drone chiến đấu mạnh mẽ và đáng tin cậy."
 civic_machine_introspective:0 "Tự Nhận thức"
 civic_machine_introspective_desc:0 "Sự đam mê với cấu trúc của chính mình đã thúc đẩy và hỗ trợ trí tuệ máy móc này dấn thân vào lĩnh vực khoa học."
 civic_machine_delegated_functions:0 "Phân quyền Chức năng"
 civic_machine_delegated_functions_desc:0 "Trí tuệ máy móc giảm thiểu sự mỏng manh bằng cách tăng cường tính mô-đun hóa, qua đó giảm tổn thất khi triển khai các đơn vị bán độc lập."
 civic_machine_predictive_analysis:0 "Phân tích Dự đoán"
 civic_machine_predictive_analysis_desc:0 "Trí tuệ máy móc cố gắng mở rộng các hướng nghiên cứu khoa học khả thi thông qua việc đánh giá chuyên sâu phương pháp luận nghiên cứu."
 civic_machine_replication:0 "Kẻ Nhân bản Nhanh"
 civic_machine_replication_desc:0 "Các đơn vị của trí tuệ máy móc này vốn được thiết kế để nhân bản với tốc độ cao. Chúng vẫn giữ lại được nhiều tối ưu hóa từ dây chuyền sản xuất ban đầu."
 civic_machine_maintenance_protocols:0 "Giao thức Bảo trì"
 civic_machine_maintenance_protocols_desc:0 "Trí tuệ máy móc của chúng ta đặt việc bảo trì các đơn vị lên ưu tiên hàng đầu. Việc bảo trì định kỳ sẽ nâng cấp và điều chỉnh các đơn vị để tối đa hóa hiệu suất làm việc và khả năng tương thích của chúng."
 civic_post_apocalyptic:0 "Hậu Tận thế"
 civic_post_apocalyptic_desc:0 "Nền văn minh này đã sống sót sau ngọn lửa chiến tranh hạt nhân, họ đã xây dựng lại nền văn minh của mình ngay trên đống tro tàn của thế giới cũ."
 civic_life_seeded:0 "Hạt giống Sự sống"
 civic_life_seeded_desc:0 "Xã hội này được cố ý gieo mầm trên một thiên đường nhân tạo. Mặc dù khả năng thích nghi với môi trường của họ cực kỳ tệ, nhưng bù lại họ có một hành tinh mẹ vô cùng trù phú."
 civic_barbaric_despoilers:0 "Kẻ Cướp bóc Man rợ"
 civic_barbaric_despoilers_desc:0 "Xã hội này chẳng có chút trật tự nào. Chiến đấu là ý nghĩa của sự sống, và kẻ mạnh nhất sẽ nắm giữ quyền lực tối thượng."
 civic_byzantine_bureaucracy:0 "Quan liêu Phức tạp"
 civic_byzantine_bureaucracy_desc:2 "Xã hội này bị cai trị bởi một hệ thống hành chính cực kỳ rườm rà, đối với người ngoài nó chẳng khác nào một mê cung. Để duy trì chính phủ hoạt động suôn sẻ, một lượng lớn viên chức phải làm việc ngày đêm để đảm bảo mọi công dân chỉ nhận được phần tài nguyên tương xứng với năng lực và trình độ của họ."
 civic_merchant_guilds:0 "Hội Thương nhân"
 civic_merchant_guilds_desc:1 "Một số hội thương nhân hùng mạnh và có sức ảnh hưởng lớn đã chiếm vị thế trọng yếu trong xã hội này, đến mức ngay cả chính phủ cũng phải nghe theo họ."
 civic_franchising:0 "Nhượng quyền Thương mại"
 civic_franchising_desc:0 "Đế chế tập đoàn này phụ thuộc rất nhiều vào hình thức nhượng quyền. Theo hệ thống này, các công ty con phải nộp lại tỷ lệ lợi nhuận cao hơn cho tập đoàn mẹ, bù lại họ có được đặc quyền sử dụng thương hiệu của tập đoàn."
 civic_trading_posts:0 "Trạm Giao dịch"
 civic_trading_posts_desc:0 "Cơ hội kinh doanh là thứ phải tự mình tìm kiếm. Tập đoàn hoàn vũ này từ lâu đã mở rộng tầm ảnh hưởng bằng cách thiết lập các trạm giao dịch. Các căn cứ sao của tập đoàn luôn kiêm luôn vai trò của những trung tâm thương mại sầm uất."
 civic_media_conglomerate:0 "Tập đoàn Truyền thông"
 civic_media_conglomerate_desc:0 "Trước khi vươn vòi sang các lĩnh vực khác, tập đoàn này xuất thân và phất lên từ mảng truyền thông. Bộ phận PR của tập đoàn vẫn rất sành sỏi trong việc biến nguy thành cơ, xoay chuyển tình thế bất lợi thành lợi thế."
 civic_naval_contractors:0 "Nhà thầu Hải quân"
 civic_naval_contractors_desc:0 "Tập đoàn hoàn vũ này duy trì quy mô hạm đội bằng cách khoán việc cho các nhà thầu bán độc lập. Những nhà thầu này sẽ cạnh tranh với nhau để giành được các đơn hàng từ chính phủ."
 civic_free_traders:0 "Thương nhân Tự do"
 civic_free_traders_desc:0 "Đội tàu thương mại của tập đoàn hoàn vũ này được vận hành bởi các thương nhân dân sự bán độc lập đã được cấp phép."
 civic_private_prospectors:0 "Nhà thăm dò Tư nhân"
 civic_private_prospectors_desc:0 "Xây dựng một thế giới mới là công việc đầy rủi ro, do đó tập đoàn này dựa vào các nhà thăm dò tư nhân để tìm kiếm các hành tinh biên viễn tiềm năng và thành lập các tiền đồn tại đó."
 civic_gospel_of_the_masses:0 "Phúc âm của Quần chúng"
 civic_gospel_of_the_masses_desc:0 "Tập đoàn này là sự pha trộn giữa thương mại và tôn giáo. Tại đây, vị trí của giới chức sắc tôn giáo cấp cao và ban quản trị tập đoàn đã hòa làm một."
 civic_ruthless_competition:0 "Cạnh tranh Khốc liệt"
 civic_ruthless_competition_desc:0 "Mọi thành viên ở mọi tầng lớp trong tập đoàn này đều đang giẫm đạp lên nhau để giành lợi ích. Đây thực sự là một thế giới cá lớn nuốt cá bé."
 civic_criminal_heritage:0 "Di sản Tội phạm"
 civic_criminal_heritage_desc:0 "Nguồn gốc của tập đoàn này bắt nguồn từ một tổ chức tội phạm khổng lồ từng một tay che trời, cuối cùng tổ chức này đã lớn mạnh đến mức thay thế luôn cả chính quyền địa phương."
 civic_private_military_companies:0 "Công ty Quân sự Tư nhân"
 civic_private_military_companies_desc:0 "Tập đoàn này sở hữu rất nhiều công ty quân sự tư nhân dưới trướng. Những nhà thầu mang tính chất lính đánh thuê này sẽ cung cấp lực lượng mặt đất tinh nhuệ cho tập đoàn khi cần thiết."
 civic_indentured_assets:0 "Tài sản Khế ước"
 civic_indentured_assets_desc:0 "Tập đoàn này chuyên quản lý một lượng lớn lao động khế ước. Đừng hiểu lầm, họ không phải là nô lệ, chỉ là những người lao động mang nợ làm cả đời cũng không trả hết mà thôi."
 civic_indentured_assets_effect: "£pop_cat_specialist£§Y$pop_cat_specialist_plural$§! bị đối xử như nô lệ."
 civic_brand_loyalty:0 "Trung thành Thương hiệu"
 civic_brand_loyalty_desc:0 "Tập đoàn này có một lượng lớn fan cuồng nhiệt của thương hiệu. Những khẩu hiệu quảng cáo hấp dẫn của thương hiệu này đã ăn sâu vào tiềm thức của mọi người từ lâu."
 civic_diplomatic_corps:0 "Đoàn Ngoại giao"
 civic_diplomatic_corps_desc:0 "Xã hội này có truyền thống hùng biện và tranh luận lâu đời, họ luôn ngợi ca những người có thể đạt được mục đích chỉ bằng lời nói."
 civic_public_relations_specialists:0 "Chuyên gia Quan hệ Công chúng"
 civic_public_relations_specialists_desc:0 "Nếu bạn kiểm soát được suy nghĩ của người khác, bạn cũng sẽ kiểm soát được hành vi của họ. Tập đoàn này sở hữu một đội quân mạng ảo chuyên nghiệp, luôn sẵn sàng tung ra những đòn giáng mạnh mẽ trên chiến trường dư luận."
 civic_death_cult:0 "Giáo phái Cái chết"
 civic_death_cult_desc:0 "Tôn giáo của nhóm này được xây dựng dựa trên các nghi lễ hiến tế định kỳ. Những người tự nguyện hiến thân sẽ dành trọn mười năm để rèn luyện, sau đó dâng hiến sinh mạng trong các buổi lễ, cái chết của họ giúp văn hóa của cả cộng đồng được nở rộ."
 civic_death_cult_corporate:0 "Doanh nghiệp Giáo phái Cái chết"
 civic_death_cult_corporate_desc:0 "Tập đoàn này sử dụng các nghi lễ hiến tế như một công cụ để thu lợi nhuận bền vững. Theo định kỳ, những người tự nguyện hiến thân sẽ được chọn ra để dâng hiến sinh mạng, với niềm tin mang lại sự hưng thịnh cho cả tập đoàn và người dân."
 civic_memorialist:0 "Chủ nghĩa Tưởng niệm"
 civic_memorialist_desc:0 "Đế chế này coi trọng ký ức và những dạng sống có trí tuệ đã khuất, họ mong muốn tìm kiếm sự ổn định lâu dài và những thấu hiểu sâu sắc thông qua vòng tuần hoàn của cái chết, sự tái sinh và kế thừa."
 civic_hive_memorialist:0 "Chủ nghĩa Tưởng niệm"
 civic_hive_memorialist_desc:0 "Ý thức bầy đàn dành một tình cảm đặc biệt cho sự ra đi của các thực thể có trí tuệ khác, và dùng điều đó để tập trung củng cố và kéo dài sự tồn tại của chính mình."
 civic_wilderness_memorialist: "$civic_hive_memorialist$"
 civic_wilderness_memorialist_desc: "Vùng hoang dã trân trọng sự ra đi của các sinh vật có trí tuệ khác, coi đó là trung tâm của vòng tuần hoàn sinh mệnh vĩnh cửu."
 civic_machine_memorialist:0 "$civic_hive_memorialist$"
 civic_machine_memorialist_desc:0 "Trí tuệ máy móc đã tinh chỉnh sự hiểu biết của mình về các giao thức cốt lõi bằng cách phân tích kỹ lưỡng entropy trong vũ trụ. Nếu muốn theo đuổi sự linh hoạt cao hơn, dữ liệu là thứ dư thừa."
 civic_crafters:0 "Thợ Thủ công Tài ba"
 civic_crafters_desc:0 "Sự tận tụy với kỹ năng thủ công tỉ mỉ là cốt lõi của xã hội này. Ngay cả trong những ngành cơ bản nhất, các xúc tu khéo léo và cơ quan cảm giác nhạy bén cũng giúp họ tạo ra những kiệt tác thực sự."
 civic_pleasure_seekers:0 "Kẻ Tìm kiếm Lạc thú"
 civic_pleasure_seekers_desc:0 "Xã hội này đã thỏa mãn với sự hoàn hảo của chính mình. Những tầng lớp có đặc quyền trong xã hội đã chìm đắm trong một nền văn hóa sùng bái sự hưởng thụ và giải trí, mà không cần bận tâm đến việc chi phí cho những thứ đó sẽ do người khác gánh vác."
 civic_corporate_hedonism:0 "Chủ nghĩa Khoái lạc Doanh nghiệp"
 civic_corporate_hedonism_desc:0 "Công việc là nơi bạn muốn đến. Công dân của tập đoàn này vui vẻ thề trung thành với nhà tuyển dụng của họ — và dâng hiến toàn bộ thời gian rảnh rỗi của mình — để đổi lấy sự hưởng thụ xa hoa ở cấp độ doanh nghiệp."
 civic_corporate_crafters:0 "Tập đoàn Thủ công"
 civic_corporate_crafters_desc:0 "Tập đoàn này tập trung toàn bộ dây chuyền sản xuất vào những mặt hàng có chất lượng và tỷ suất lợi nhuận cao nhất, tạo ra và tiếp thị những sản phẩm đỉnh cao mang đậm tính nghệ thuật và thủ công."
 civic_pompous_purists:0 "Kẻ Thượng đẳng Thuần khiết"
 civic_pompous_purists_desc:0 "Xã hội này có niềm tin mãnh liệt vào sự thượng đẳng của bản thân, họ sẽ phớt lờ bất kỳ hoạt động ngoại giao nào không do chính họ khởi xướng."
 civic_ascensionists:0 "Chủ nghĩa Thăng thiên"
 civic_ascensionists_desc:0 "Mục tiêu tối thượng và không mệt mỏi của đế chế này là theo đuổi sự tiến hóa ở mức độ cao hơn."
 civic_tooltip_ascensionists_effects: "$t$—Bắt đầu trò chơi với §G+1§! §YCấp độ Thăng thiên§! trên các thuộc địa."
 civic_corporate_ascensionists:1 "Tập đoàn Siêu việt"
 civic_corporate_ascensionists_desc:0 "$civic_ascensionists_desc$"
 civic_tooltip_corporate_ascensionists_effects: "$civic_tooltip_ascensionists_effects$\n$t$—£building£§Y$building_public_relations_office$§!$megacorp_civic_branch_office_building_effect$"
 civic_hive_ascensionists:0 "Thiền định Thăng hoa"
 civic_hive_ascensionists_desc:0 "Ý thức bầy đàn này đặc biệt quan tâm đến sức khỏe siêu hình của sự tồn tại, liên tục tìm kiếm các phương thức để tự thăng hoa."
 civic_wilderness_ascensionists: "Khát vọng Thăng hoa"
 civic_wilderness_ascensionists_desc: "Vùng hoang dã ấp ủ những khát vọng cao cả đối với sức khỏe siêu hình của toàn bộ hành tinh."
 civic_machine_ascensionists:0 "Giả thuyết Thăng hoa"
 civic_machine_ascensionists_desc:0 "Trí tuệ máy móc này chỉ chuyên tâm một cách dị thường vào thuật toán cốt lõi của bản thân ở cấp độ siêu hình."
 civic_worker_coop: "Hợp tác xã Lao động"
 civic_worker_coop_desc: "Các thành viên trong xã hội này chia sẻ công bằng gánh nặng lao động của hợp tác xã, cùng nhau chia lợi nhuận và chung tay thực hiện những hoài bão lớn."
 civic_machine_spybots: "Chỉ thị Phần mềm Gián điệp"
 civic_machine_spybots_desc: "Trí tuệ máy móc này đã tối ưu hóa các giao thức hack và giám sát. Chỉ thị cốt lõi của nó là thu thập thông tin bằng mọi thủ đoạn."
 civic_machine_spybots_effects: "—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_cloaking_1', £physics_research£$tech_cloaking_1$]"
 civic_machine_astromining_drones: "Drone Khai khoáng Không gian"
 civic_machine_astromining_drones_desc: "Trí tuệ máy móc này chuyên về các hoạt động trên quỹ đạo và thu thập tài nguyên. Các cá thể phụ thuộc cấp thấp của nó hoạt động không hiệu quả trong các nhiệm vụ trên mặt đất."
 civic_tooltip_worker_coop_effects: "$t$—Mở khóa tiêu chuẩn sống §Y$living_standard_worker_ownership$§!. Theo tiêu chuẩn này, bất kể §YTầng lớp§! nào, mọi £pop£§YDân số§! đều yêu cầu mức phí bảo trì £consumer_goods£§Y$consumer_goods$§! cao.$TABBED_NEW_LINE$—Vô hiệu hóa hầu hết các §YTiêu chuẩn sống§! khác$TABBED_NEW_LINE$—$AVAILABLE_POLICIES$['concept_trade_mutual_aid']$TABBED_NEW_LINE$—Thay thế các vị trí £job_executive£§Y$job_executive$§! và £job_manager£§Y$job_manager$§! bằng vị trí ['concept_steward',£job_manager£ $job_steward$]$TABBED_NEW_LINE$—£building£§Y$building_corporate_embassy$§!$megacorp_civic_branch_office_building_effect$"
