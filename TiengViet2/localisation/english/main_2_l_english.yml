 GROUND_SUPPORT_STANCE_DESC:1 "§HOanh tạc quỹ đạo§!\nChế độ oanh tạc quỹ đạo được đặt là “$STANCE|Y$”"
 bombardment_selective_desc:2 "Oanh tạc $bombardment_selective$ chỉ nhắm vào các cơ sở quân sự, tránh thương vong dân sự không cần thiết.\n—Gây sát thương §YVừa§! cho §YLục quân§!\n—Gây tàn phá §YVừa§! cho §YHành tinh§!\n—Gây sát thương §ENhẹ§! cho §YQuần thể§!\n—§RKhu vực§! không oanh tạc hành tinh không có phòng thủ\n—§RKhông§! tiêu diệt §Y$MIN_POPS$§! cư dân cuối cùng"
 bombardment_indiscriminate_desc:3 "Oanh tạc $bombardment_indiscriminate$ nhắm vào cơ sở quân sự và hạ tầng hành tinh, chấp nhận thương vong dân sự.\n—Gây sát thương §HNặng§! cho §YLục quân§!\n—Gây tàn phá §HNặng§! cho §YHành tinh§!\n—Gây sát thương §YVừa§! cho §YQuần thể§!\n—Khi §H$policy_orbital_bombardment_accept_surrender$§! là §H$orbital_bombardment_surrender_forbidden$§!, sẽ oanh tạc cả hành tinh không phòng thủ\n—§RKhông§! tiêu diệt §Y$MIN_POPS$§! cư dân cuối cùng"
 bombardment_armageddon_desc:3 "Oanh tạc $bombardment_armageddon$ dùng hỏa lực cực mạnh tấn công bão hòa hành tinh, mục tiêu gây thương vong dân sự tối đa.\n—Gây sát thương §YCực lớn§! cho §RLục quân§!\n—Gây tàn phá §YCực lớn§! cho §RHành tinh§!\n—Gây sát thương §YCực lớn§! cho §RQuần thể§!\n—Sẽ oanh tạc cả hành tinh không phòng thủ\n—Có thể biến hành tinh thành hành tinh chết không sự sống"
 bombardment_raiding_desc:5 "Oanh tạc $bombardment_raiding$ các khu dân cư và dùng tàu đổ bộ đặc chủng bắt bớ cư dân địch mang về cưỡng bức lao động.\n—Gây sát thương §ENhẹ§! cho §YLục quân§!\n—Gây tàn phá §ENhẹ§! cho §YHành tinh§!\n—Sẽ ưu tiên §YBắt cóc§! cư dân thay vì tiêu diệt họ\n—Sẽ §RKhông§! bắt cóc hoặc tiêu diệt cư dân cuối cùng. Mỗi đạo quân đồn trú trên hành tinh có thể bảo vệ thêm một cư dân."
