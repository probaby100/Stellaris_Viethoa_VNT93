 living_standard_dystopian_society_tooltip_delayed:0 "§LĐám đông ô hợp bình thường nên tự biết thân biết phận, nếu không, chúng ta sẽ dạy cho họ biết.§!"
 living_standard_worker_ownership: "Chế độ Quyền sở hữu của Người lao động"
 living_standard_worker_ownership_tooltip: "$living_standard_worker_ownership$ đảm bảo rằng mỗi người lao động đều có cổ phần dân chủ trong các doanh nghiệp. Chi phí sinh hoạt và trách nhiệm xã hội sẽ được phân bổ đều cho tất cả các thành viên."
 living_standard_worker_ownership_tooltip_delayed: "§LHãy để mọi người đều có tiếng nói và cổ phần, tất cả đều có thể chia sẻ lợi tức của xã hội được xây dựng bằng lao động của chúng ta.§!"
