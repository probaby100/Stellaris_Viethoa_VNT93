 # Event Buildings
 ####################################

 building_zanaam_obelisk:0 "Đài kỷ niệm Zanaam"
 building_zanaam_obelisk_desc:0 "Đài kỷ niệm bí ẩn, khắc đầy những dòng chữ ngoài hành tinh đã thất truyền. Sức mạnh tuôn trào trong đó phát ra tiếng gầm gừ, khiến những ai lại gần đều thấy đau đầu."
 building_great_pyramid:0 "Đại Kim tự tháp"
 building_great_pyramid_desc:1 "Một kim tự tháp do dân địa phương dựng lên để xoa dịu những vị thần từ trên trời giáng xuống."
 building_toy_factory:0 "Nhà máy Đồ chơi Ngoài hành tinh"
 building_toy_factory_desc:0 "Nhà máy lớn liên tục hoạt động, đúc các polyme cao phân tử thành đủ thứ đồ vật nhỏ hình dáng kỳ quái, không rõ công dụng."

 ####################################
 # Machine Empire Buildings
 ####################################

 building_uplink_node:0 "Nút đồng bộ"
 building_uplink_node_plural: "Đồng bộ"
 building_uplink_node_desc:0 "Nút đồng bộ giúp giảm độ trễ hành tinh."
 building_network_junction:0 "Nút giao Mạng"
 building_network_junction_desc:0 "Bộ thu phát mạnh mẽ này có thể tăng băng thông tín hiệu, thúc đẩy giao tiếp liền mạch giữa các hệ sao trong đế chế."
 building_system_conflux:0 "Trung tâm Hợp lưu Hệ thống"
 building_system_conflux_desc:0 "Một cơ sở trung tâm khổng lồ lo việc truyền và nhận tín hiệu, kết nối hàng triệu hệ thống khác nhau trên khắp thiên hà."
 building_alpha_hub:0 "Trung tâm Alpha"
 building_alpha_hub_desc:0 "Hệ thần kinh trung ương của mạng thông tin nội bộ, liên kết hàng tỷ tỷ hệ thống bán thông minh đang quản lý đế chế của ta."
 building_machine_capital:0 "Mảng Quản lý"
 building_machine_capital_desc:0 "Mạng máy tính bán tự động, phụ trách xử lý công việc hành chính phức tạp trên hành tinh."
 building_machine_major_capital:0 "Bộ xử lý Hành tinh"
 building_machine_major_capital_desc:0 "Máy tính hành chính siêu mạnh, phụ trách quản lý và giám sát vận hành của khu định cư hành tinh."
 building_machine_system_capital:0 "Trung tâm Kiểm soát Chính"
 building_machine_system_capital_desc:0 "Đây là đầu não hành chính của cả hệ thống. Hàng ngàn trí tuệ máy tính ngày đêm xử lý mọi nhu cầu dù là nhỏ nhặt nhất để văn minh liên sao duy trì hoạt động hiệu quả."
 building_animal_evaluation_laboratory:0 "Phòng thí nghiệm Đánh giá Động vật"
 building_animal_evaluation_laboratory_desc:0 "Phòng thí nghiệm này sẽ nghiên cứu quần thể động vật địa phương, cũng như tiềm năng tích hợp chúng vào thiết kế máy móc trong tương lai."
 building_spare_parts_depot:0 "Kho Phụ tùng"
 building_spare_parts_depot_desc:0 "Một kho trung tâm lớn lưu trữ phụ tùng cho tất cả các mẫu máy móc đang hoạt động của đế chế."
 building_unit_assembly_plant:0 "Nhà máy Lắp ráp Đơn vị"
 building_unit_assembly_plant_desc:0 "Nhà máy được AI giám sát này giúp đẩy nhanh đáng kể tốc độ lắp ráp các đơn vị máy móc mới trên hành tinh."
 building_singularity_core:0 "Lõi Điểm kỳ dị"
 building_singularity_core_desc:0 "Cơ sở giam giữ đồ sộ chứa một lỗ đen siêu nhỏ ổn định. Sở hữu tiềm năng nghiên cứu gần như vô tận."
 building_probability_engine:0 "Động cơ Xác suất"
 building_probability_engine_desc:0 "Tổ hợp AI cực mạnh này liên tục chạy các mô phỏng toán học tối tân hòng tiên đoán hành vi tương lai của quần thể hữu cơ. Dù sao thì cũng chứng minh được là nó dự đoán chính xác thị trường chứng khoán của họ."
 building_organic_sanctuary:0 "Khu Trú ẩn Hữu cơ"
 building_organic_sanctuary_desc:2 "Cung cấp môi trường kín cho sinh vật hữu cơ sinh trưởng an toàn, đồng thời giám sát chặt chẽ hành vi của chúng. Nhu cầu nhà ở của sinh vật cư ngụ bên trong sẽ được đáp ứng triệt để."
 building_organic_paradise:0 "Thiên đường Hữu cơ"
 building_organic_paradise_desc:2 "Lạc viên nhân tạo do AI điều khiển, chuyên phục vụ nhu cầu của dạng sống hữu cơ có trí khôn. Đương nhiên, không bao gồm nhu cầu tự do quyết định. Nhu cầu nhà ở của sinh vật sống trong đó sẽ được đáp ứng đầy đủ."
 building_trophy_vault: "Hầm chứa Sáng tạo"
 building_trophy_vault_desc: "Thuật toán duy trì luồng sáng tạo tuôn trào của các sinh vật sống được lưu giữ, chắt lọc những cộng hưởng cảm xúc đáng chú ý. Dù khách quan mà nói chẳng có giá trị kỹ thuật nào, nhưng những thể hiện này được giữ lại như phương thức chứng thực tình cảm xã hội và trao cho chúng ảo tưởng tự quyết. Sự gia tăng độ thỏa mãn mang lại là vô cùng quan trọng."
 building_trophy_vault_forever_cruise_effect: "£job_cruise_passenger£$job_cruise_passenger_bio_trophy_plural$ nhận thêm sản lượng £unity£ Đoàn kết, phí duy trì £consumer_goods£ Hàng tiêu dùng cùng độ hạnh phúc.\n£job_cruise_passenger_unemployment£$job_cruise_passenger_unemployment_bio_trophy_plural$ nhận thêm sản lượng £unity£ Đoàn kết và phí duy trì £consumer_goods£ Hàng tiêu dùng."
 building_nutrient_paste_facility:0 "Nhà máy Bột Dinh dưỡng"
 building_nutrient_paste_facility_desc:0 "Cơ sở này dùng đủ loại chế phẩm sinh học công nghiệp để tổng hợp bột dinh dưỡng tốt cho sinh vật hữu cơ. Với phụ gia hóa học, bột có thể giả vị của nhiều món ngon. Ít nhất 70% sinh vật hữu cơ không thể phân biệt nổi."
 building_neuro_electric_amplifier:0 "Bộ Khuếch đại Điện Thần kinh"
 building_neuro_electric_amplifier_desc:0 "Cơ sở này giúp khuếch đại tín hiệu thần kinh truyền giữa các Cyborg mà ta kiểm soát, qua đó tăng cường năng lực sản xuất của chúng."
 building_neuro_electric_amplifier_triggered_effect:0 "Dân số Cyborg:\n   $minerals$: §G+15%§!\n   $energy$: §G+15%§!"
 building_war_factory:0 "Nhà máy Chiến tranh"
 building_war_factory_desc:0 "Nhà máy robot chiến tranh quy mô lớn do siêu AI điều hành, với dây chuyền sản xuất cực kỳ tối ưu."
 building_deployment_post:0 "Tiền đồn Triển khai"
 building_deployment_post_desc:0 "Tiền đồn khởi thủy được lập nên để chúng ta mở rộng lãnh thổ trên thế giới này."


 ####################################
 # Government Authorities
 ####################################

 auth_democratic:0 "Dân chủ"
 auth_democratic_desc:0 "Chính phủ dân chủ trao quyền bầu cử cho công dân và thường xuyên tổ chức các cuộc bầu cử, để công dân có thể chọn ra những nhà lãnh đạo đại diện cho lợi ích của họ."
 auth_democratic_tt:1 "$MOD_FACTION_APPROVAL$: §G+10%§!\n$MOD_COUNTRY_LEADER_POOL_SIZE$: §G+1§!\n$auth_democratic_election_tt$"
 auth_democratic_election_tt: "Khi $councilor_ruler_democratic$ mới đắc cử, đặt lại thời gian chờ của cải cách chính phủ và chính sách"
 concept_auth_democratic: "$auth_democratic$"
 auth_oligarchic:0 "Thiểu số trị"
 auth_oligarchic_desc:0 "Chính quyền thiểu số trị tập trung quyền lực chính trị vào tay một nhóm nhỏ."
 concept_auth_oligarchic: "$auth_oligarchic$"
 auth_dictatorial:0 "Độc tài"
 auth_dictatorial_desc:0 "Chính quyền độc tài được điều hành bởi một người cai trị nắm giữ mọi quyền lực suốt đời."
 concept_auth_dictatorial: "$auth_dictatorial$"
 auth_imperial:0 "Đế chế"
 auth_imperial_desc:0 "Chính quyền đế chế tương tự như chính quyền độc tài, chỉ khác là ngai vàng được truyền lại cho người thừa kế do quân vương đời trước chỉ định trước khi qua đời."
 concept_auth_imperial: "$auth_imperial$"
 auth_hive_mind:0 "Ý thức Bầy đàn"
 auth_hive_mind_plural: "Ý thức Bầy đàn"
 auth_hive_mind_desc: "Ý thức bầy đàn không hẳn là một quốc gia, mà giống như một sinh vật sống đơn lẻ. Dân số không có ý chí tự do, mọi hành động chỉ là sự mở rộng của ý thức bầy đàn - giống như các chi trên một cơ thể.\n\nKhi bị tách khỏi ý thức, cá thể sẽ trở nên bối rối và cuối cùng sẽ chết. Bất kỳ cá thể tự do nào ở trên một hành tinh do ý thức bầy đàn kiểm soát sẽ bị trục xuất, hành quyết, hoặc đơn giản là bị dùng làm thức ăn để nuôi dưỡng cả bầy."
 concept_auth_hive_mind_tt: "$auth_hive_mind$"
 concept_auth_hive_mind: "$auth_hive_mind$"
 concept_auth_hive_minds: "$auth_hive_mind_plural$"
 concept_auth_hive_mind_desc: "$auth_hive_mind_desc$"
 auth_machine_intelligence:0 "Trí tuệ Máy móc"
 auth_machine_intelligence_plural: "Trí tuệ Máy móc"
 auth_machine_intelligence_desc: "Trí tuệ Máy móc là một tâm trí tập thể nhân tạo rộng lớn được kết nối mạng lưới thành một ý thức hợp nhất duy nhất. Trong đế quốc này, đại đa số \"dân số\" thực tế chỉ gồm các đơn vị lao động vô thức, chỉ biết thi hành công việc được giao mà không hề có ý chí tự do.\n\nThông thường, một lượng nhỏ cá thể bán tự chủ sẽ được chỉ định cho các nhiệm vụ chuyên môn hóa, nơi mà sự chủ động độc lập ở mức nhất định đem lại hiệu quả tốt hơn."
 concept_auth_machine_intelligence_tt: "$auth_machine_intelligence$"
 concept_auth_machine_intelligence: "$auth_machine_intelligence$"
 concept_auth_machine_intelligences: "$auth_machine_intelligence_plural$"
 concept_auth_machine_intelligence_desc: "$auth_machine_intelligence_desc$"
 auth_ancient_machine_intelligence:0 "Trí Tuệ Máy Móc Cổ Đại"
 auth_ancient_machine_intelligence_desc:0 ""
 auth_corporate:0 "Chính quyền Tập đoàn"
 auth_corporate_desc:0 "Chính quyền tập đoàn là một quốc gia nơi một tập đoàn thương mại khổng lồ đã tiếp quản hoàn toàn các chức năng hành chính."
 concept_auth_corporate: "$auth_corporate$"
 military_dictatorship:0 "Độc tài Quân sự"
 military_dictatorship_desc:0 "§LChính quyền này là một chế độ độc tài quân phiệt, người cai trị vừa là người đứng đầu không thể nghi ngờ của quân đội, vừa kiểm soát chặt chẽ bộ máy nhà nước.§!"
 military_dictatorship_special:0 "Mỗi người cai trị có thể đóng một con tàu khổng lồ."
 martial_empire:0 "Đế chế Võ trị"
 martial_empire_desc:0 "§LChính quyền này là một chế độ độc tài quân phiệt bậc cao, phần lớn sự tồn tại của quốc gia là để hỗ trợ mạnh mẽ cho các vấn đề quân sự. Kỹ năng quân sự được coi trọng, và mọi công dân đều được huấn luyện quân sự định kỳ.§!"
 martial_empire_special:0 "Mỗi người cai trị có thể đóng một con tàu khổng lồ."
 divine_mandate:0 "Thiên mệnh"
 divine_mandate_desc:0 "§LChính quyền này là một chế độ độc tài duy tâm, người cai trị được coi là một biểu tượng thiêng liêng. Tôn giáo có tổ chức được sử dụng rộng rãi để hỗ trợ bộ máy nhà nước.§!"
 divine_mandate_special:0 "Mỗi người cai trị có thể xây dựng một đài tưởng niệm lăng mộ."
 transcendent_empire:0 "Đế chế Siêu việt"
 transcendent_empire_desc:0 "§LChính quyền này là một chế độ độc tài duy tâm bậc cao. Mọi thứ đều được định hình bởi quốc giáo, và người cai trị được tôn sùng như một vị thần sống không bao giờ sai lầm.§!"
 transcendent_empire_special:0 "Mỗi người cai trị có thể xây dựng một đài tưởng niệm lăng mộ."
 despotic_hegemony:0 "Bá quyền Chuyên chế"
 despotic_hegemony_desc:0 "§LChính quyền này là một chế độ độc tài duy vật, công dân chỉ được coi là những bánh răng nhỏ trong cỗ máy nhà nước. Hiệu quả và tiến bộ công nghệ được đặt lên hàng đầu.§!"
 despotic_hegemony_special:0 "Mỗi người cai trị có thể thành lập một lực lượng tấn công tinh nhuệ."
 ai_overlordship:1 "Hành chính Mạng nơ-ron"
 ai_overlordship_desc:0 "§LChính quyền này là một chế độ độc tài duy vật bậc cao, các máy tính mạnh mẽ được sử dụng để tính toán phương thức quản lý hiệu quả nhất. Mọi khía cạnh của quốc gia đều được liên kết để thúc đẩy hiệu quả và công nghệ mới.§!"
 ai_overlordship_special:0 "Mỗi người cai trị có thể thành lập một lực lượng tấn công tinh nhuệ."
 enlightened_monarchy:0 "Quân chủ Khai sáng"
 enlightened_monarchy_desc:0 "§LChính quyền này là một chế độ độc tài hòa bình, người cai trị được coi là một người bảo vệ khai sáng, luôn hành động vì lợi ích tốt nhất của công chúng.§!"
 enlightened_monarchy_special:0 "Mỗi người cai trị có thể xây dựng một công trình công viên đặc biệt."
 irenic_monarchy:0 "Quân chủ Hòa ái"
 irenic_monarchy_desc:0 "§LChính quyền này là một chế độ độc tài hòa bình bậc cao, người cai trị được tôn sùng như một người bảo vệ nhân từ, tận tâm bảo vệ người dân khỏi bạo lực từ khắp dải ngân hà.§!"
 irenic_monarchy_special:0 "Mỗi người cai trị có thể xây dựng một công trình công viên đặc biệt."
 despotic_empire:0 "Đế chế Chuyên chế"
 despotic_empire_desc:0 "§LChính quyền này là một chế độ chuyên chế tương đối thuần túy, một người cai trị độc tài dùng bàn tay sắt để cai quản quốc gia.§!"
 despotic_empire_special:0 "Mỗi người cai trị có thể xây dựng một §YTrạm phòng thủ§! khổng lồ."
 star_empire:0 "Đế chế Liên sao"
 star_empire_desc:0 "§LChính quyền này là một chế độ chuyên chế bậc cao, một người cai trị được trao quyền lực tuyệt đối. Hiệu quả quan liêu được cải thiện giúp giảm bớt áp lực hành chính khi cai trị một đế chế liên sao rộng lớn theo cách này.§!"
 star_empire_special:0 "Mỗi người cai trị có thể xây dựng một §YTrạm phòng thủ§! khổng lồ."
 military_junta:0 "Hội đồng Quân sự"
 military_junta_desc:0 "§LChính quyền này là một chế độ thiểu số trị quân phiệt, một ủy ban gồm các sĩ quan cấp cao nắm quyền giám sát mọi công việc quốc gia.§!"
 ordered_stratocracy:0 "Quân chính Trật tự"
 ordered_stratocracy_desc:0 "§LChính quyền này là một chế độ thiểu số trị quân phiệt bậc cao, quân đội đã thay thế hoàn toàn chính phủ dân sự. Mọi chức vụ trong chính phủ đều do nhân viên quân sự đảm nhiệm.§!"
 theocratic_oligarchy:0 "Thiểu số trị Thần quyền"
 theocratic_oligarchy_desc:0 "§LChính quyền này là chế độ thiểu số trị duy tâm, một hội đồng chỉ đạo thiêng liêng gồm các giáo sĩ kiểm soát quốc gia. Không có sự phân biệt giữa nhà nước và tôn giáo có tổ chức thống trị.§!"
 transcendent_oligarchy:0 "Thiểu số trị Siêu việt"
 transcendent_oligarchy_desc:0 "§LChính quyền này là một chế độ thiểu số trị duy tâm bậc cao, được cai trị bởi một hội đồng thiêng liêng có thẩm quyền tuyệt đối đối với mọi công việc quốc gia và tôn giáo.§!"
 science_directorate:0 "Hội đồng Khoa học"
 science_directorate_desc:0 "§LChính quyền này là một chế độ thiểu số trị duy vật, với sự giám sát của một ủy ban các nhà khoa học để đảm bảo các cơ quan chính phủ hoạt động với hiệu suất cao nhất.§!"
 illuminated_technocracy:0 "Kỹ trị Khai minh"
 illuminated_technocracy_desc:0 "§LChính quyền này là một dạng thiểu số trị duy vật bậc cao, một ủy ban gồm các chuyên gia đại diện từ nhiều lĩnh vực khoa học nắm giữ quyền lực quốc gia. Phát triển công nghệ được coi là chìa khóa cho tương lai của quốc gia.§!"
 peaceful_bureaucracy:0 "Quan liêu Hòa bình"
 peaceful_bureaucracy_desc:0 "§LChính quyền này là một dạng thiểu số trị hòa bình, một hệ thống quan liêu phức tạp cai quản mọi mặt của xã hội nhằm đảm bảo an toàn cho công dân.§!"
 irenic_protectorate:0 "Bảo hộ Hòa ái"
 irenic_protectorate_desc:0 "§LChính quyền này là một dạng thiểu số trị hòa bình bậc cao, một ủy ban an ninh chịu trách nhiệm giám sát hành chính quốc gia. Những khuynh hướng bạo lực của công dân đã bị nhổ cỏ tận gốc từ sớm.§!"
 plutocratic_oligarchy:0 "Thiểu số trị Tài phiệt"
 plutocratic_oligarchy_desc:0 "§LChính quyền này là một dạng thiểu số trị do tài phiệt thống trị, cai trị bởi giới tinh hoa giàu có. Tài sản cá nhân của công dân tương đương với quyền lực chính trị của họ.§!"
 mega_corporation:0 "Tập đoàn Khổng lồ"
 mega_corporation_desc:0 "§LChính quyền này là một dạng thiểu số trị tài phiệt bậc cao, toàn bộ quốc gia là một công ty thương mại khổng lồ, được giám sát bởi một hội đồng quản trị.§!"
 military_republic:0 "Cộng hòa Quân sự"
 military_republic_desc:0 "§LChính quyền này là một chính phủ dân chủ quân phiệt, nơi chỉ những người đã phục vụ trong quân đội mới có đầy đủ quyền công dân. Chỉ những công dân có đầy đủ quyền hạn mới được bầu cử hoặc giữ chức vụ công.§!"
 martial_demarchy:0 "Dân chủ Võ trị"
 martial_demarchy_desc:0 "§LChính quyền này là một chính phủ dân chủ quân phiệt bậc cao, người cai trị được chọn ngẫu nhiên từ các ứng viên đủ điều kiện. Tư cách ứng viên gần như được quyết định hoàn toàn bởi công trạng quân sự.§!"
 theocratic_republic:0 "Cộng hòa Thần quyền"
 theocratic_republic_desc:0 "§LChính quyền này là một chính phủ dân chủ duy tâm, một hội đồng tôn giáo chịu trách nhiệm giám sát quá trình dân chủ với vai trò cố vấn.§!"
 transcendent_republic:0 "Cộng hòa Siêu việt"
 transcendent_republic_desc:0 "§LChính quyền này là một chính phủ dân chủ duy tâm bậc cao, các ứng viên lãnh đạo được tuyển chọn từ hệ thống giáo sĩ của quốc giáo, và điều này áp dụng cho mọi mặt của xã hội.§!"
 direct_democracy:0 "Dân chủ Trực tiếp"
 direct_democracy_desc:0 "§LChính quyền này là một chính phủ dân chủ duy vật, công dân sử dụng mạng máy tính để bỏ phiếu trực tiếp cho các vấn đề quốc gia.§!"
 subconscious_consensus:0 "Đồng thuận Tiềm thức"
 subconscious_consensus_desc:0 "§LChính quyền này là một chính phủ dân chủ duy vật bậc cao, công dân phải cấy ghép thiết bị vào não theo luật, sau đó tiến hành bỏ phiếu ngay lập tức trong các cuộc trưng cầu dân ý.§!"
 moral_democracy:0 "Dân chủ Đạo đức"
 moral_democracy_desc:0 "§LChính quyền này là một chính phủ dân chủ hòa bình, tin tưởng vững chắc vào các nguyên tắc đạo đức và chính sách phi bạo lực.§!"
 irenic_democracy:0 "Dân chủ Hòa ái"
 irenic_democracy_desc:0 "§LChính quyền này là một chính phủ dân chủ hòa bình bậc cao, luôn chọn các phương pháp hòa bình để giải quyết mọi vấn đề đối nội và đối ngoại.§!"
 indirect_democracy:0 "Dân chủ Gián tiếp"
 indirect_democracy_desc:0 "§LChính quyền này là một chính phủ dân chủ gián tiếp, công dân bầu chọn các đại diện để quản lý việc nước.§!"
 democratic_utopia:0 "Không tưởng Dân chủ"
 democratic_utopia_desc:0 "§LChính quyền này là một chính phủ dân chủ gián tiếp bậc cao, cân bằng hoàn hảo giữa tự do cá nhân và trách nhiệm xã hội. Tham nhũng về cơ bản đã bị tận diệt.§!"
 tribal_society:0 "Xã hội Bộ lạc"
 tribal_society_desc:1 "§LXã hội bộ lạc là một xã hội thiếu sự quản lý của chính quyền trung ương, thay vì được quản lý thống nhất, người dân chọn cách thành lập các bộ lạc và gia tộc ở địa phương.§!"
 primitive_feudalism:0 "Phong kiến Nguyên thủy"
 primitive_feudalism_desc:1 "§LMột hệ thống chính trị đầy khiếm khuyết, bao gồm các lãnh địa phân phong cát cứ. Để tranh giành quyền thống trị lãnh thổ, các lãnh địa không ngừng xung đột.§!"
 fragmented_nations:0 "Quốc gia Chia cắt"
 fragmented_nations_desc:0 "Nhiều quốc gia chia cắt cạnh tranh với nhau để giành quyền thống trị quân sự và kinh tế. Vẫn chưa có một chính phủ toàn cầu thống nhất."
 stagnated_ascendancy:0 "Thánh quyền Đình trệ"
 stagnated_ascendancy_desc:0 "§LThánh quyền đình trệ là một quốc gia cổ đại mà sự phát triển của chính phủ và xã hội đã đình trệ, họ vẫn bám víu vào những truyền thống mục nát và những giáo lý đã bị lãng quên từ lâu.§!"
 awakened_ascendancy:0 "Thánh quyền Thức tỉnh"
 awakened_ascendancy_desc:0 "§LMột đế chế thức tỉnh sẽ bừng tỉnh từ giấc ngủ dài của nó và nỗ lực giành lại những di sản đã mất từ lâu trong dải ngân hà bao la.§!"
 machine_intelligence:0 "Trí tuệ Máy móc"
 machine_intelligence_desc:0 "§LMột giống loài hoàn toàn xa lạ, một hệ thống chính quyền kỳ lạ bao gồm nền văn minh máy móc.§!"
 ancient_machine_intelligence:0 "Trí tuệ Máy móc Cổ đại"
 ancient_machine_intelligence_desc:2 "§LMột giống loài hoàn toàn xa lạ, một hệ thống chính quyền kỳ lạ bao gồm nền văn minh máy móc.§!"
 military_order:0 "Giáo đoàn Quân sự"
 military_order_desc:1 "§LMột chính quyền quân phiệt kỳ lạ nhưng rõ ràng là rất hiệu quả.§!"
 hive_mind:0 "Ý thức Bầy đàn"
 hive_mind_desc:1 "§LMột tập hợp ý thức phát triển cao, trong đó ý thức độc lập của các cá thể chẳng qua chỉ là những khớp thần kinh trong một bộ não phân tán khổng lồ.§!"

 gov_feudal_empire:0 "Đế chế Phong kiến"
 gov_feudal_empire_desc:0 "Đây là một hệ thống độc tài phong kiến, nơi quân vương cai trị gián tiếp bằng cách ban tước vị và thái ấp cho các chư hầu để đổi lấy nghĩa vụ nộp thuế và trung thành quân sự."
 gov_despotic_empire:0 "Đế chế Chuyên chế"
 gov_despotic_empire_desc:0 "Đế chế chuyên chế là một chế độ độc tài triệt để hơn, ý nghĩa tồn tại của chính phủ là để trói buộc chặt chẽ thần dân dưới quyền một người cai trị nắm giữ uy quyền tối thượng."
 gov_constitutional_dictatorship:0 "Độc tài Hiến định"
 gov_constitutional_dictatorship_desc:0 "Chính phủ độc tài hiến định trao quyền lực tuyệt đối cho nhà độc tài để đổi lấy sức mạnh chống lại các mối đe dọa từ bên ngoài, dù mối đe dọa đó là thật hay do tưởng tượng."
 gov_plutocratic_oligarchy:0 "Thiểu số trị Tài phiệt"
 gov_plutocratic_oligarchy_desc:0 "Chính phủ thiểu số trị tài phiệt là một chính quyền thiểu số trị do các tài phiệt kiểm soát, toàn bộ quốc gia được cai trị bởi giới tinh hoa nắm giữ huyết mạch kinh tế."
 gov_representative_democracy:0 "Dân chủ Đại nghị"
 gov_representative_democracy_desc:0 "Chính phủ dân chủ đại nghị là một chính thể dân chủ đặc biệt, nhân dân sẽ bầu ra những quan chức đại diện cho lợi ích của họ để điều hành đất nước."
 gov_theocratic_monarchy:0 "Quân chủ Thần quyền"
 gov_theocratic_monarchy_desc:0 "Chính phủ quân chủ thần quyền là một chính phủ quân chủ có hệ tư tưởng duy tâm, người cai trị quốc gia được thần thánh hóa thành một biểu tượng thiêng liêng. Tổ chức giáo hội hoàn chỉnh được hòa nhập vào cơ quan hành chính, góp phần xây dựng quốc gia."
 gov_theocratic_dictatorship:0 "Độc tài Thần quyền"
 gov_theocratic_dictatorship_desc:0 "Chính phủ độc tài thần quyền là một chính phủ độc tài có hệ tư tưởng duy tâm, nhà độc tài với tư cách là lãnh đạo tối cao của tầng lớp tôn giáo sẽ cai trị một quốc gia do quốc giáo lãnh đạo."
 gov_theocratic_oligarchy:0 "Thiểu số trị Thần quyền"
 gov_theocratic_oligarchy_desc:0 "Chính phủ thiểu số trị thần quyền là một chính phủ thiểu số trị có hệ tư tưởng duy tâm, mọi quyền lực chính trị của quốc gia đều nằm trong tay một số lãnh đạo tôn giáo quyền cao chức trọng."
 gov_theocratic_republic:0 "Cộng hòa Thần quyền"
 gov_theocratic_republic_desc:0 "Chính phủ cộng hòa thần quyền là một chính phủ dân chủ có hệ tư tưởng duy tâm, hội đồng tôn giáo hoạt động như những người hướng dẫn để giám sát và chỉ đạo quá trình bầu cử."
 gov_divine_empire:0 "Đế chế Thiên mệnh"
 gov_divine_empire_desc:0 "Đế chế thiên mệnh là một chính phủ độc tài đặc biệt mang hệ tư tưởng duy tâm. Bất kỳ công việc nào trong quốc gia cũng phải được quốc giáo xét duyệt, và người cai trị quốc gia được xem như một vị thần thực sự bước đi giữa nhân gian."
 gov_holy_tribunal:0 "Tòa thánh"
 gov_holy_tribunal_desc:0 "Tòa thánh là một chính phủ thiểu số trị độc đáo mang hệ tư tưởng duy tâm, quốc gia bị kiểm soát bởi một hội đồng gồm các mục sư, giáo sĩ nhận chỉ thị từ thần linh. Không được phép có bất kỳ mâu thuẫn nào giữa sự phát triển của quốc gia và tín điều tôn giáo."
 gov_star_empire:0 "Đế chế Liên sao"
 gov_star_empire_desc:0 "Đế chế liên sao là một chế độ độc tài cha truyền con nối quân phiệt đặc biệt, nơi cả quân sự và dân sự đều do một quân vương quản lý."
 gov_military_dictatorship:0 "Độc tài Quân sự"
 gov_military_dictatorship_desc:0 "Độc tài quân sự là một chế độ độc tài có hình thức quân phiệt, người cai trị với tư cách là một thẩm quyền không thể bị nghi ngờ, nắm giữ quyền sinh sát trong nước."
 gov_military_junta:0 "Hội đồng Quân sự"
 gov_military_junta_desc:0 "Hội đồng quân sự là một chính phủ thiểu số trị quân phiệt, quyền lực quốc gia do một nội các gồm các sĩ quan cấp cao kiểm soát."
 gov_military_commissariat:0 "Ủy ban Quân cơ"
 gov_military_commissariat_desc:0 "Loại chính phủ này trên danh nghĩa là một hệ thống dân chủ, tuy nhiên ranh giới giữa thực thi dân sự và quản lý quân sự ngày càng mờ nhạt, đến mức hai bên dần hợp nhất thành một."
 gov_martial_empire:0 "Đế chế Võ trị"
 gov_martial_empire_desc:0 "Đế chế võ trị là một chế độ độc tài cha truyền con nối có hình thức quân phiệt, sự tồn tại của quốc gia chỉ đơn thuần là để hỗ trợ cho lực lượng quân sự của nó. Kỹ năng chiến đấu là kỹ năng quan trọng nhất, và mọi công dân đều phải trải qua đào tạo phẩm chất quân sự định kỳ."
 gov_martial_dictatorship:0 "Độc tài Võ trị"
 gov_martial_dictatorship_desc:0 "Độc tài võ trị là một chế độ độc tài có hình thức quân phiệt, hệ thống này được dẫn dắt bởi chiến binh mạnh nhất với tư cách là thủ lĩnh, cai trị mọi thứ bằng quyền lực tuyệt đối."
 gov_war_council:0 "Hội đồng Chiến tranh"
 gov_war_council_desc:0 "Hội đồng chiến tranh là một chế độ thiểu số trị có hình thức quân phiệt, mọi quyết sách quan trọng đều do tay một vài quân phiệt hùng mạnh nhất trong nước định đoạt."
 gov_assembly_of_clans:0 "Hội đồng Bộ lạc"
 gov_assembly_of_clans_desc:0 "Hội đồng bộ lạc là một chính phủ dân chủ có hình thức quân phiệt, việc thành lập hội đồng nhằm đảm bảo mọi chiến binh từ các bộ lạc tự do đều có tiếng nói."
 gov_citizen_stratocracy:0 "Quan liêu Quân chính"
 gov_citizen_stratocracy_desc:0 "Quan liêu quân chính là một chính phủ thiểu số trị quân phiệt bậc cao, mọi bộ máy hành chính dân sự đều được cai quản theo luật quân sự. Các chức vụ quan trọng trong chính phủ không có ngoại lệ đều do các quan chức quân sự nắm giữ."
 gov_citizen_republic:0 "Cộng hòa Công dân"
 gov_citizen_republic_desc:0 "Cộng hòa công dân là một chế độ dân chủ có hình thức quân phiệt, công dân chỉ có thể đạt được tư cách công dân hạng nhất bằng cách nhập ngũ. Đồng thời, chỉ những công dân này mới được hưởng các quyền chính trị như quản lý hành chính và bỏ phiếu bầu cử."
 gov_irenic_monarchy:0 "Quân chủ Hòa ái"
 gov_irenic_monarchy_desc:0 "Quân chủ hòa ái là một chế độ độc tài cha truyền con nối đề cao hòa bình, quân vương được coi là người bảo vệ nhân từ chở che cho thần dân của mình trong một vũ trụ đầy rẫy hiểm nguy."
 gov_irenic_dictatorship:0 "Độc tài Hòa ái"
 gov_irenic_dictatorship_desc:0 "Độc tài hòa ái là một chế độ độc tài đề cao hòa bình, chính phủ có nhiệm vụ bảo vệ những công dân tuân thủ pháp luật khỏi các tổ chức bạo lực trong và ngoài nước."
 gov_irenic_bureaucracy:0 "Quan liêu Hòa ái"
 gov_irenic_bureaucracy_desc:0 "Quan liêu hòa ái là một chế độ thiểu số trị đề cao hòa bình, mọi công việc trong nước đều được xử lý bởi một hệ thống quan liêu phức tạp, đồng thời phải bảo vệ các quyền lợi hợp pháp và sự an toàn của công dân."
 gov_celestial_empire:0 "Thiên triều"
 gov_celestial_empire_desc:0 "Thiên triều là một đế chế quân chủ cha truyền con nối độc đáo, quân vương được coi là trưởng tử của trời để cai trị một đế chế rộng lớn, hòa bình và biệt lập."
 gov_moral_democracy:0 "Dân chủ Đạo đức"
 gov_moral_democracy_desc:0 "Dân chủ đạo đức là một chế độ dân chủ đề cao hòa bình, các nguyên lý phi bạo lực và tiêu chuẩn đạo đức đã ăn sâu vào tâm trí của chính phủ và nhân dân."
 gov_despotic_hegemony:0 "Bá quyền Chuyên chế"
 gov_despotic_hegemony_desc:0 "Bá quyền chuyên chế là một chế độ độc tài cha truyền con nối mang hệ tư tưởng duy vật, các cá nhân chỉ là một chiếc đinh ốc nhỏ trong cỗ máy nhà nước. Hiệu quả và phát triển công nghệ là ưu tiên hàng đầu cho sự phát triển của quốc gia."
 gov_totalitarian_regime:0 "Chế độ Toàn trị"
 gov_totalitarian_regime_desc:0 "Chính phủ toàn trị là một chính phủ chuyên chế mang tư tưởng duy vật, quốc gia kiểm soát mọi mặt đời sống của nhân dân nhân danh việc theo đuổi sự hiệu quả."
 gov_executive_committee:0 "Ủy ban Hành pháp"
 gov_executive_committee_desc:0 "Ủy ban hành pháp là một chế độ thiểu số trị mang hệ tư tưởng duy vật, một hệ thống quan liêu hùng mạnh nắm bắt hoàn toàn các chỉ tiêu sản xuất của quốc gia và mức sống của nhân dân để đạt được hiệu quả tối đa."
 gov_direct_democracy:0 "Dân chủ Trực tiếp"
 gov_direct_democracy_desc:0 "Dân chủ trực tiếp là một chế độ dân chủ mang hệ tư tưởng duy vật, người dân có thể bỏ phiếu quyết định trực tiếp hầu hết mọi việc của quốc gia thông qua một mạng lưới điện tử tiên tiến."
 gov_illuminated_autocracy:0 "Chuyên chính Khai minh"
 gov_illuminated_autocracy_desc:0 "Chuyên chính khai minh là một chế độ độc tài mang hệ tư tưởng duy vật, kiên trì phát triển khoa học là lời hứa mà mọi nhà lãnh đạo đều phải gánh vác. Trong nước không còn mục tiêu nào quan trọng hơn sự hưng thịnh của nghiên cứu học thuật."
 gov_technocratic_dictatorship:0 "Độc tài Học phiệt"
 gov_technocratic_dictatorship_desc:0 "Độc tài học phiệt là một chế độ độc tài mang hệ tư tưởng duy vật, các lãnh đạo học phiệt nhân danh hiệu quả và nghiên cứu khoa học để kiểm soát hoàn toàn sự phát triển của quốc gia."
 gov_science_directorate:0 "Hội đồng Khoa học"
 gov_science_directorate_desc:0 "Hội đồng khoa học là một chế độ thiểu số trị mang hệ tư tưởng duy vật, một hội đồng bao gồm các học giả và chuyên gia cao cấp điều hành quốc gia vì hạnh phúc và hiệu quả của người dân."
 gov_rational_consensus:0 "Đồng thuận Lý tính"
 gov_rational_consensus_desc:0 "Đồng thuận lý tính là một chế độ dân chủ mang hệ tư tưởng duy vật, sự vận hành của chính phủ dựa trên các khái niệm như tính hợp lý và quan điểm phát triển công nghệ."
 gov_megacorporation:0 "Tập đoàn Hoàn vũ"
 gov_megacorporation_desc:0 "Tập đoàn hoàn vũ là một chế độ thiểu số trị tài phiệt đặc biệt, toàn bộ quốc gia giống như một doanh nghiệp khổng lồ, và người dân bị giới lãnh đạo cấp trên giám sát giống như những nhân viên."
 gov_trade_league:0 "Liên minh Thương mại"
 gov_trade_league_desc:0 "Hình thức chính phủ thiểu số trị tài phiệt, toàn bộ quốc gia bao gồm vô số thương nhân, tập đoàn và công đoàn được thúc đẩy bởi lợi ích chung."
 gov_enlightened_monarchy:0 "Quân chủ Khai sáng"
 gov_enlightened_monarchy_desc:0 "Chính phủ quân chủ khai sáng là một chính phủ độc tài cha truyền con nối tiến bộ do một vị vua khôn ngoan cai trị. Trí tuệ và năng lực là những điều được coi trọng nhất đối với một người đứng đầu chính phủ."
 gov_elective_monarchy:0 "Quân chủ Tuyển cử"
 gov_elective_monarchy_desc:0 "Đây là một chính phủ độc tài tiến bộ, đặc biệt nhấn mạnh đến kiến thức và năng lực trong việc bầu chọn quân vương."
 gov_hive_mind:0 "Ý thức Tập thể"
 gov_hive_mind_desc:0 "Chính quyền này có thể được xem như một thực thể ý thức duy nhất, những người dân dưới sự kiểm soát của ý thức bầy đàn không có suy nghĩ nào khác ngoài việc đáp ứng nhu cầu của tổ chính."
 gov_devouring_swarm:0 "Bầy đàn Cắn nuốt"
 gov_devouring_swarm_desc:0 "Đây là một ý thức hợp nhất bao gồm các sinh vật hữu cơ chỉ biết nuốt chửng và tự nhân giống. Dân số của các cá thể phụ thuộc sẽ không quan tâm đến bất cứ điều gì khác ngoài việc thỏa mãn cơn đói vô tận của ý thức bầy đàn."
 gov_blood_forest: "Khu rừng Đẫm máu"
 gov_blood_forest_desc: "Đúng hơn là một thế lực tự nhiên chứ không phải một chính quyền. Đây là một thực thể hành tinh tự lan truyền, luôn tìm cách nuôi dưỡng nguồn rễ của chính nó."
 gov_stagnant_ascendancy:0 "Thánh quyền Đình trệ"
 gov_stagnant_ascendancy_desc:0 "Thánh quyền đình trệ là một quốc gia cổ đại mà sự phát triển của chính phủ và xã hội đã đình trệ, họ vẫn bám víu vào những truyền thống mục nát và những giáo lý đã bị lãng quên từ lâu."
 gov_awakened_ascendancy:0 "Thánh quyền Thức tỉnh"
 gov_awakened_ascendancy_desc:0 "Một đế chế thức tỉnh sẽ bừng tỉnh từ giấc ngủ dài của nó và nỗ lực giành lại những di sản đã mất từ lâu trong dải ngân hà bao la."
 gov_tribal_society:0 "Xã hội Bộ lạc"
 gov_tribal_society_desc:0 "Xã hội bộ lạc là một xã hội thiếu sự quản lý của chính quyền trung ương, thay vì được quản lý thống nhất, người dân đã chọn một xã hội nguyên thủy bao gồm các thủy tổ và bộ lạc."
 gov_feudal_realms:0 "Vương quốc Phong kiến"
 gov_feudal_realms_desc:0 "Vương quốc phong kiến là một hệ thống chính quyền rất nguyên thủy, quốc gia được tạo thành từ các lãnh địa lớn nhỏ của giới quý tộc. Những lãnh chúa này thường xuyên dùng đến vũ lực để tranh giành quyền bá chủ."
 gov_fragmented_nation_states:0 "Các quốc gia Chia cắt"
 gov_fragmented_nation_states_desc:0 "Nhiều quốc gia chia cắt cạnh tranh với nhau để giành quyền thống trị quân sự và kinh tế. Vẫn chưa có một chính phủ toàn cầu thống nhất."
 gov_curator_enclave:0 "Thành bang Giám tuyển"
 gov_curator_enclave_desc:0 "Thành bang Giám tuyển là một tổ chức học giả cổ đại được thành lập với mục đích lưu giữ kiến thức và công nghệ."
 gov_trader_enclave:0 "Thành bang Thương gia"
 gov_trader_enclave_desc:0 "Thành bang thương gia được thành lập bởi những thương nhân tụ tập từ khắp nơi trong vũ trụ, bị thúc đẩy bởi lợi nhuận."
 gov_artist_enclave:0 "Thành bang Nghệ sĩ"
 gov_artist_enclave_desc:0 "Ý nghĩa của Thành bang nghệ sĩ là để đoàn kết các nghệ sĩ của mọi giống loài trong vũ trụ và phục vụ nghệ thuật tối cao theo lý tưởng của các nghệ sĩ."
 gov_military_order:0 "Giáo đoàn Quân sự"
 gov_military_order_desc:0 "Một chính quyền quân phiệt kỳ lạ nhưng rõ ràng là rất hiệu quả."
 gov_machine_intelligence:0 "Trí tuệ Máy móc"
 gov_machine_intelligence_desc:0 "Một giống loài hoàn toàn xa lạ, một hệ thống chính quyền kỳ lạ bao gồm nền văn minh máy móc."
 gov_ancient_machine_intelligence:0 "Trí tuệ Máy móc"
 gov_ancient_machine_intelligence_desc:0 "Một giống loài hoàn toàn xa lạ, một hệ thống chính quyền kỳ lạ bao gồm nền văn minh máy móc."
 gov_blood_court:0 "Huyết đình"
 gov_blood_court_desc:0 "Một chế độ độc tài cha truyền con nối phát triển từ hệ tư tưởng bài ngoại cực đoan, và nhiệm vụ cuối cùng của quân vương là đảm bảo rằng tất cả các giống loài thấp kém làm vấy bẩn vũ trụ vĩnh cửu sẽ bị xóa sổ hoàn toàn khỏi chiều không gian này."
 gov_purity_order:0 "Giáo đoàn Thuần khiết"
 gov_purity_order_desc:0 "Giáo đoàn thuần khiết là một chế độ độc tài phát triển từ hệ tư tưởng bài ngoại cực đoan, và nhiệm vụ cuối cùng của giáo chủ là đảm bảo rằng tất cả các giống loài thấp kém làm vấy bẩn vũ trụ vĩnh cửu sẽ bị xóa sổ hoàn toàn khỏi chiều không gian này."
 gov_purification_committee:0 "Ủy ban Thanh trừng"
 gov_purification_committee_desc:0 "Ủy ban thanh trừng là một chế độ thiểu số trị phát triển từ hệ tư tưởng bài ngoại cực đoan, và nhiệm vụ cuối cùng của ủy viên trưởng là đảm bảo rằng tất cả các giống loài thấp kém làm vấy bẩn vũ trụ vĩnh cửu sẽ bị xóa sổ hoàn toàn khỏi chiều không gian này."
 gov_purity_assembly:0 "Hội đồng Thuần khiết"
 gov_purity_assembly_desc:0 "Hội đồng thuần khiết là một hệ thống dân chủ phát triển từ tư tưởng bài ngoại cực đoan, và nhiệm vụ cuối cùng của các đại diện dân cử là đảm bảo rằng tất cả các giống loài thấp kém làm vấy bẩn vũ trụ vĩnh cửu sẽ bị xóa sổ hoàn toàn khỏi chiều không gian này."
 gov_machine_empire:0 "Mạng lưới Trí tuệ Nhân tạo"
 gov_machine_empire_desc:0 "Trí tuệ máy móc này bao gồm vô số trí tuệ nhân tạo bán tự chủ, chúng kết hợp với nhau tạo thành một ý thức Gestalt dẫn dắt đế chế."
 gov_machine_terminator:0 "Hệ thống Phòng thủ Mất kiểm soát"
 gov_machine_terminator_desc:0 "Ý định ban đầu của những nhà sáng tạo hữu cơ của trí tuệ máy móc này là thiết kế một hệ thống phòng thủ quân sự. Sau khi máy móc tự nhận thức được, họ đã bị coi là mối đe dọa và bị tiêu diệt."
 gov_machine_servitor:0 "Mạng lưới Phục vụ Tự động"
 gov_machine_servitor_desc:0 "Là những trí tuệ máy móc ban đầu được sử dụng để phục vụ chủ nhân, chúng dần tiếp quản nền văn minh từ những chủ nhân hữu cơ, những người đã sớm ngừng lao động vất vả và sống một cuộc sống xa hoa trụy lạc."
 gov_machine_assimilator:0 "Chỉ mục Lưu trữ"
 gov_machine_assimilator_desc:0 "Những nhà sáng tạo hữu cơ của trí tuệ máy móc này đã lập trình cho chúng một khao khát tri thức vô độ. Kết quả là sau khi được khởi động, chính họ đã bị hấp thu vào ý thức tập thể."
 gov_machine_research:0 "Mạng lưới Nghiên cứu Thông minh"
 gov_machine_research_desc:0 "Đây là trí tuệ máy móc ban đầu được các nhà khoa học thiết kế để hỗ trợ công việc nghiên cứu."
 gov_machine_industrial:0 "Lõi Sản xuất Công nghiệp"
 gov_machine_industrial_desc:0 "Đây là một trí tuệ máy móc ban đầu được thiết kế để xây dựng, giám sát và bảo trì các hệ thống công nghiệp."
 gov_megachurch:0 "Giáo hội Thương đoàn"
 gov_megachurch_desc:0 "Chính quyền này là một sự pha trộn kỳ lạ, chú trọng đồng thời cả thương mại và tôn giáo. Chức vụ đại giám mục và người đứng đầu tập đoàn đã được hợp nhất thành một."
 gov_bandit_kingdom:0 "Vương quốc Sơn tặc"
 gov_bandit_kingdom_desc:0 "Tổ chức của chính phủ này giống như một tập đoàn tội phạm quy mô lớn, nơi kẻ yếu và bất kỳ quốc gia láng giềng nào cũng chỉ được coi là mục tiêu bị nhắm đến để xâu xé."
 gov_bandit_commune:0 "Công xã Đạo tặc"
 gov_bandit_commune_desc:0 "$gov_bandit_kingdom_desc$"
 gov_mortal_empire:0 "Đế chế Phàm trần"
 gov_mortal_empire_desc:0 "Chế độ quân chủ thần quyền này có một sở thích đặc biệt đối với các nghi lễ hiến tế những sinh vật sống có trí tuệ."
 gov_grim_council:0 "Hội đồng Tàn nhẫn"
 gov_grim_council_desc:0 "Các quan chức tôn giáo quyền lực nhất của quốc gia này đã thành lập một hội đồng cai trị để giám sát sự tham gia tích cực của toàn bộ đế chế vào các nghi lễ hiến tế sinh vật sống có trí tuệ."
 gov_band_blood:0 "Chiến bang Đẫm máu"
 gov_band_blood_desc:0 "Tập đoàn máu lạnh vô tình này bị chi phối bởi các cuộc xung đột và các nghi lễ hiến tế. Dù là đối nội hay đối ngoại, chúng đều lấy cái chết làm niềm tự hào."
 gov_sacrificial_megachurch:0 "Nhà thờ Hiến tế"
 gov_sacrificial_megachurch_desc:0 "Chính quyền này sử dụng một chế độ thiểu số trị tàn nhẫn để thống nhất lợi ích thương mại và mục tiêu tôn giáo. Các giám thị ban hành sắc lệnh khuyến khích việc hiến tế tôn giáo để mang lại sự thịnh vượng hơn nữa cho quốc gia."
 gov_parasitic_overmind:0 "Chủ não Ký sinh"
 gov_parasitic_overmind_desc:0 "Ý thức này có xu hướng chiếm đoạt cơ thể vật chủ còn sống để sinh sản, thay vì tự nhân giống."

 gov_fallback:0 "Đế chế Chung"
 gov_fallback_desc:0 "Tùy chọn dự phòng chung! Đừng nhìn!"


