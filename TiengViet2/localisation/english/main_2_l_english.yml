 TECH_UNLOCK_COMBAT_COMPUTERS_1_TITLE:0 "§HMở khóa bộ phận: §!Máy tính chiến đấu cơ bản"
 TECH_UNLOCK_COMBAT_COMPUTERS_1_DESC:0 "§HMáy tính chiến đấu cơ bản§!\nDựa trên các lý thuyết hành vi AI gần đây, cho phép chúng ta thiết kế một phụ tá chiến đấu thông minh cho máy tính trên tàu."
 TECH_UNLOCK_COMBAT_COMPUTERS_2_TITLE:0 "§HMở khóa bộ phận: §!Máy tính chiến đấu cao cấp"
 TECH_UNLOCK_COMBAT_COMPUTERS_2_DESC:0 "§HMáy tính chiến đấu cao cấp§!\nMột đơn vị tác chiến thông minh đã được cải tiến thuật toán hành vi chiến đấu để hoàn thành nhiệm vụ được giao hiệu quả hơn."
 TECH_UNLOCK_COMBAT_COMPUTERS_3_TITLE:0 "§HMở khóa bộ phận: §!Máy tính chiến đấu thông tuệ"
 TECH_UNLOCK_COMBAT_COMPUTERS_3_DESC:0 "§HMáy tính chiến đấu thông tuệ§!\nTận dụng nhận thức tự vệ của một máy tính thông minh - hay đúng hơn là nỗi sợ hãi cái chết - để tăng cường đáng kể sự nhanh nhẹn của nó trong chiến đấu."
 TECH_UNLOCK_COMBAT_COMPUTERS_AUTONOMOUS_TITLE:0 "§HMở khóa bộ phận: §!Trí tuệ tàu chiến tự trị"
 TECH_UNLOCK_COMBAT_COMPUTERS_AUTONOMOUS_DESC:0 "§HTrí tuệ tàu chiến tự trị§!\nViệc trang bị cho tàu của chúng ta trí tuệ nhân tạo bán tự trị sẽ tăng tốc độ phản ứng trong chiến đấu một cách đáng kể."
