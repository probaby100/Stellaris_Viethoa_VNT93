 civic_tooltip_mechanists_effects:10 "Khởi đầu trò chơi với §Y800§!£pop£§HDân số§! là robot, đồng thời sở hữu công nghệ và cơ sở hạ tầng để chế tạo thêm robot\n$mod_planet_pops_robotics_upkeep_mult$: §G-5%§!\n"
 civic_tooltip_shared_burden_effects:6 "Có thể áp dụng tiêu chuẩn sống §Y$living_standard_shared_burden$§!, bất kể thuộc §YTầng lớp§! nào, mọi £pop£§HDân số§! đều có mức phí bảo trì £consumer_goods£§Y$consumer_goods$§! ở mức trung bình\nVô hiệu hóa hầu hết các §YTiêu chuẩn sống§! khác\nMở khóa tài sản £building£§Y$holding_communal_housing_outreach$§!"
 civic_tooltip_fanatic_purifiers_effects:14 "Không thể tiến hành §YNgoại giao§! với các loài khác!\nKhông thể tham gia §YThị trường Giao dịch Ngân hà§!\nCó lý do tuyên chiến §Y\"Thanh trừng\"§! đối với các loài khác\n§YDân số ngoại lai§! sẽ luôn bị thanh trừng\nThanh trừng £pop£§HDân số ngoại lai§! sẽ nhận được £unity£§YĐoàn kết§!\nCó thể sử dụng tư thế oanh tạc §Y$bombardment_armageddon$§!\n"
 civic_tooltip_devouring_swarm_effects:11 "Không thể tiến hành §YNgoại giao§! với các đế chế khác!\nKhông thể tham gia §YThị trường Giao dịch Ngân hà§!\nCó lý do tuyên chiến §Y\"Săn mồi\"§! đối với mọi đế chế khác\n§YDân số ngoại lai§! sẽ luôn bị nuốt chửng\nNuốt chửng £pop£§HDân số ngoại lai§! sẽ nhận được £society£§Y$society_research$§!\n"
 civic_tooltip_devouring_swarm_lithoid_effects:2 "Không thể tiến hành §YNgoại giao§! với các đế chế khác!\nKhông thể tham gia §YThị trường Giao dịch Ngân hà§!\nKhông thể tiến hành §YCải tạo Môi trường§! hành tinh\nCó lý do tuyên chiến §Y\"Săn mồi\"§! đối với các đế chế khác\nCó quyết sách hành tinh §Y\"Nuốt chửng Hành tinh\"§!\n§YDân số ngoại lai§! sẽ luôn bị nuốt chửng\nNuốt chửng £pop£§HDân số ngoại lai§! sẽ nhận được £society£§Y$society_research$§!"
