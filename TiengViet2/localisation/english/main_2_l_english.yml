 SHIP_STAT_DESC_cost:0 "§EChi phí chế tạo tàu là tổng chi phí của các phân khu và bộ phận. Các phân khu lớn hơn và bộ phận cao cấp hơn sẽ tốn kém hơn.§!"
 SHIP_STAT_DESC_build_time:0 "§EThời gian chế tạo tàu phụ thuộc vào kích cỡ các phân khu và bộ phận được trang bị.§!"
 SHIP_STAT_DESC_energy_maintenance:1 "§E§HPhí bảo trì§! để duy trì hoạt động của tàu bằng một tỷ lệ phần trăm của §Hchi phí chế tạo§!.§!"
 SHIP_STAT_DESC_mineral_maintenance:1 "§E§HPhí bảo trì§! để duy trì hoạt động của tàu bằng một tỷ lệ phần trăm của §Hchi phí chế tạo§!.§!"
 SHIP_STAT_DESC_power:1 "§EĐể các hệ thống trên tàu hoạt động, cần phải có đủ §Hnăng lượng§!. Năng lượng có thể được tăng thêm bằng cách gắn các lò phản ứng, trong khi hầu hết các bộ phận đều tiêu thụ năng lượng. Không thể lưu thiết kế có §Hnăng lượng§! âm.§!"
 SHIP_STAT_DESC_hitpoints:1 "§E§HĐộ bền vỏ tàu§! thể hiện lượng sát thương tàu có thể chịu đựng trước khi bị phá hủy hoàn toàn.§!"
 SHIP_STAT_DESC_armor:2 "§E§HGiáp§! là lớp phòng thủ thứ hai của tàu, hấp thụ hỏa lực xuyên qua khiên chắn. Giáp chỉ có thể được sửa chữa tại §HCăn cứ sao§!, trừ khi tàu được trang bị các bộ phận đặc biệt có khả năng tự phục hồi giáp.§!"
 SHIP_STAT_DESC_shields:1 "§E§HKhiên chắn§! là lớp phòng thủ đầu tiên, hấp thụ sát thương trước khi trúng vào giáp và vỏ tàu. Một số vũ khí có thể gây sát thương mạnh hơn lên khiên chắn, hoặc thậm chí xuyên qua nó. Sao xung (Pulsar) cũng có thể vô hiệu hóa khiên chắn. Sau khi rời khỏi trận chiến, khiên chắn sẽ dần hồi phục.§!"
 SHIP_STAT_DESC_evasion:1 "§ETất cả tàu đều có thể né tránh đòn tấn công để giảm sát thương. Tỉ lệ §Hné tránh§! có thể được tăng cường nhờ các bộ phận như động cơ đẩy, nhưng tàu càng lớn thì hiệu quả càng kém.§!"
 SHIP_STAT_DESC_combat_speed:0 "§E§HTốc độ§! là tốc độ di chuyển tối đa của tàu khi không ở trạng thái siêu quang tốc (FTL), có thể tăng bằng cách gắn các bộ phận động cơ đẩy. Khi hạm đội di chuyển, tàu chậm nhất sẽ giới hạn tốc độ tối đa của cả hạm đội.§!"
 SHIP_STAT_DESC_speed:0 "$SHIP_STAT_DESC_combat_speed$"
 SHIP_STAT_DESC_damage:1 "§ETổng sát thương do tàu gây ra là tổng hợp các chỉ số sát thương của mọi vũ khí được trang bị. Mỗi vũ khí vẫn tấn công độc lập trong trận chiến. Hãy xem chi tiết tốc độ bắn, sát thương, tầm bắn hiệu quả, cùng khả năng xuyên §Hgiáp§! và §Hkhiên chắn§! của từng bộ phận vũ khí.§!"

