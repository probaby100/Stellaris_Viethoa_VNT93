 slavery_normal:0 "Lao động Nô lệ"
 slavery_normal_tooltip:1 "§HLao động Nô lệ§! giúp tăng sản lượng tài nguyên, nhưng không thể đảm nhận các công việc §Y$pop_cat_ruler$§! hoặc §Y$pop_cat_specialist$§!."
 slavery_normal_tooltip_delayed:0 "§LLao động Nô lệ là hình thức nô lệ phổ biến nhất trong vũ trụ. Dù là chung thân hay có thời hạn, việc hưởng thụ thành quả lao động của người khác không giới hạn được coi là một đặc quyền có trách nhiệm ở một số nơi, và là điều kiện tiên quyết để duy trì hoạt động bình thường của xã hội ở những nơi khác.§!"
 slavery_domestic:0 "Người hầu"
 slavery_domestic_tooltip:1 "Những §HNgười hầu§! không đảm nhận các công việc khác sẽ được thuê làm người hầu, tăng cường £amenities£$PLANET_AMENITIES_TITLE$. Họ không thể đảm nhận các công việc £pop_cat_ruler£§Y$pop_cat_ruler$§! hoặc £pop_cat_specialist£§Y$pop_cat_specialist$§!, ngoại lệ duy nhất là [entertainer.GetIcon]§Y[entertainer.GetNamePlural]§!."
 slavery_domestic_tooltip_delayed:1 "§LNgười hầu dành phần lớn thời gian để phục vụ nhu cầu của công dân tự do — một số được phân công đến các tư dinh, số khác phục vụ tại các cơ sở công cộng. Họ thường sống chung với chủ, vì vậy hầu như không cần chỗ ở riêng.§!"
 slavery_military:0 "Nô lệ Chiến binh"
 slavery_military_tooltip:2 "§HNô Lệ Chiến Binh§! không có tiền thưởng cho việc sản xuất tài nguyên, nhưng là những người lính xuất sắc cho các §HĐạo Quân§! địa phương. Họ có thể được bố trí vào các vị trí việc làm [enforcer.GetIcon] §Y[enforcer.GetName]§!, [soldier.GetIcon] §Y[soldier.GetName]§!, hoặc £pop_cat_worker£ §Y$pop_cat_worker$§!."
 slavery_military_tooltip_delayed:1 "§LNô lệ Chiến binh được rèn luyện để trở thành những cỗ máy chiến tranh hoàn hảo nhất, họ thường được huấn luyện chiến đấu từ nhỏ và tuyệt đối tuân lệnh. Đổi lại cho việc phục vụ quân sự vô điều kiện, họ có nhiều tự do hơn so với các nô lệ khác và có thể đảm nhận nhiều loại nghề nghiệp hơn.§!"
 slavery_livestock:0 "Gia súc"
 slavery_livestock_tooltip:3 "£pop£§HGia súc§! không thể được thuê để sản xuất tài nguyên, nhưng có thể được chăn nuôi để cung cấp nguồn cung £food£§HThực phẩm§!.\n\nGia súc thuộc giống loài Thạch học sẽ sản xuất £minerals£§HKhoáng sản§! thay thế, còn Thú Địa ngục sản xuất £alloys£§HHợp kim§!.\n\nGia súc có thể được nuôi trong §HSở thú Ngoại hành tinh§! để cung cấp $r_amenities$."
 slavery_livestock_tooltip_delayed:0 "§LGia súc cũng được tính là dân số!§!"
 slavery_indentured:0 "Nô lệ Giao kèo"
 slavery_indentured_tooltip:2 "§HNô lệ Giao kèo§! có thể được thuê vào các vị trí £pop_cat_worker£§Y$pop_cat_worker$§! hoặc £pop_cat_specialist£§Y$pop_cat_specialist$§! và giữ lại nhiều quyền lực chính trị hơn so với các nô lệ khác. Họ không thể đảm nhận vị trí [entertainer.GetIcon]§Y[entertainer.GetNamePlural]§! hoặc [enforcer.GetIcon]§Y[enforcer.GetNamePlural]§!. Thưởng sản xuất dựa trên nô lệ chỉ áp dụng khi được thuê làm £pop_cat_worker£§Y$pop_cat_worker_plural$§!."
 slavery_indentured_tooltip_delayed:0 "§LKhả năng chuộc lại sự tự do của họ về mặt lý thuyết là có tồn tại, nhưng hợp đồng của họ được thiết kế một cách tinh vi để họ không bao giờ có thể trả hết nợ.§!"
 living_standard_utopian:1 "Sự sung túc Không tưởng"
 living_standard_utopian_tooltip:1 "$living_standard_utopian$ đảm bảo mọi thành viên của loài này đều được tiếp cận hầu như bất kỳ loại xa xỉ phẩm nào có thể tưởng tượng được.\n\n$UTOPIAN_ABUNDANCE_POP_EFFECTS$\n\n$CIVILIANS_PRODUCE_UNITY_RESEARCH$"
 living_standard_utopian_tooltip_delayed:0 "§LChúng ta có thể không thực sự phân phối theo nhu cầu, nhưng ít nhất chúng ta có thể cố gắng.§!"
 living_standard_shared_burden:0 "Cùng chung gánh nặng"
