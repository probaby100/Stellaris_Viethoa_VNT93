 TECH_UNLOCK_ION_CANNON_CONSTRUCTION_TITLE:0 "§HMở khóa trạm không gian: §!$ion_cannon$"
 TECH_UNLOCK_ION_CANNON_CONSTRUCTION_DESC:0 "§H$ion_cannon$§!\nPháo Ion là một nền tảng phòng thủ mạnh mẽ có thể được xây dựng trên quỹ đạo xung quanh một căn cứ sao. Pháo Ion có thể tiến hành các cuộc tấn công chí mạng vào tàu địch từ khoảng cách xa."

