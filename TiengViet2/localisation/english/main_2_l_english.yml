 QUEUE_PLANETVIEW: "§H$QUEUE$§!\n§GNhấp để mở hàng đợi xây dựng§!"
 QUEUE_DISABLED: "$TRIGGER_FAIL$§RDo bị địch chiếm đóng, hàng đợi này hiện bị vô hiệu hóa§!"
 PLANET_HEALTH:0 "Độ toàn vẹn bề mặt"
 sm_missile_weapon:1 "Mô-đun phòng thủ ngư lôi"
 sm_missile_weapon_desc:2 "§E§HCăn cứ sao§! này được trang bị số lượng lớn §Hngư lôi§! làm hệ thống phòng thủ. Sự tiến bộ trong công nghệ vũ khí dẫn đường sẽ tiếp tục nâng cao khả năng phòng thủ của căn cứ sao này.§!"
 sm_laser_weapon:0 "Mô-đun phòng thủ laser"
 sm_laser_weapon_desc:1 "§E§HCăn cứ sao§! này được trang bị số lượng lớn §Hvũ khí tia§! làm hệ thống phòng thủ. Sự tiến bộ trong công nghệ vũ khí tia sẽ tiếp tục nâng cao khả năng phòng thủ của căn cứ sao này.§!"
 sm_projectile_weapon:0 "Mô-đun phòng thủ động năng"
 sm_projectile_weapon_desc:1 "§E§HCăn cứ sao§! này được trang bị số lượng lớn §Hvũ khí động năng§! làm hệ thống phòng thủ. Sự tiến bộ trong công nghệ vũ khí động năng sẽ tiếp tục nâng cao khả năng phòng thủ của căn cứ sao này.§!"
 sm_refinery:0 "Nhà máy tinh chế"
 sm_synchronized_defenses:0 "Phòng thủ đồng bộ"
 sm_corvette_assembly_yards:0 "Xưởng lắp ráp tàu hộ tống"
 sm_destroyer_assembly_yards:0 "Xưởng lắp ráp tàu khu trục"
 sm_cruiser_assembly_yards:0 "Xưởng lắp ráp tàu tuần dương"
 sm_battleship_assembly_yards:0 "Xưởng lắp ráp thiết giáp hạm"
 sm_reinforced_hull_layers:0 "Lớp vỏ gia cố"
 sm_observatory:0 "Đài thiên văn"
 sm_engineering_bay:0 "Khoang kỹ thuật"
 sm_crew_quarters:0 "Khu sinh hoạt của thủy thủ đoàn"
 sm_crew_quarters_desc:0 "Cung cấp tiện nghi và nhu yếu phẩm cho thủy thủ đoàn để giảm bớt gánh nặng hậu cần cho hạm đội đang neo đậu tại đây.\n"
 sm_crew_quarters_machine_intelligence:0 "Cáp dịch vụ"
 sm_crew_quarters_desc_machine_intelligence:0 "Đường ống kết nối hạm đội neo đậu tại đây với trí tuệ trung tâm của trạm không gian, giúp cho việc bảo trì hạm đội trở nên khả thi.\n"
 sm_crew_quarters_hive_mind:0 "Khoang ấp nở thủy thủ đoàn"
 sm_crew_quarters_desc_hive_mind:0 "Khả năng ấp nở và nuôi dưỡng trực tiếp các cá thể thủy thủ đoàn ngay tại chỗ là một lợi ích lớn cho hậu cần của hạm đội tại đây.\n"
 sm_hydroponic_farms:0 "Nông trại thủy canh quỹ đạo"
 sm_orbital_mind_control_laser:0 "Laser kiểm soát tâm trí quỹ đạo"
 sm_fallen_empire_weapon:0 "Mô-đun phòng thủ pháo Tachyon"
 sm_pioneering_terminal:0 "Trạm không gian tiên phong"
 sm_solar_panel_network:0 "Mạng lưới pin mặt trời"
 sm_neutronium_fission_plant:0 "Nhà máy phân hạch Neutronium"
 sm_fleet_academy:0 "Học viện hạm đội"
 sm_fleet_academy_machine_intelligence:0 "Trình mô phỏng chiến đấu"
 sm_fleet_academy_hive_mind:0 "$sm_fleet_academy_machine_intelligence$"
 sm_fleet_academy_desc:0 "Để lính mới sẵn sàng chiến đấu, cần có những sĩ quan giỏi dẫn dắt. Học viện hạm đội đảm bảo các sĩ quan này nắm vững học thuyết mới nhất và thành thạo chiến tranh giữa các vì sao."
 sm_fleet_academy_desc_machine_intelligence:0 "Thông qua việc mô phỏng nhiều lần các kịch bản chiến đấu, máy bay không người lái chiến đấu của chúng ta sẽ được chuẩn bị tốt hơn cho thực chiến."
 sm_fleet_academy_desc_hive_mind:0 "$sm_fleet_academy_desc_machine_intelligence$"
 sm_navigator_guild:0 "Hội hoa tiêu"
 sm_living_metal_armory:0 "Xưởng trang bị kim loại sống"
 sm_dark_matter_factory:1 "Lò phản ứng vật chất tối"
 sm_colossus_yards:1 "Xưởng lắp ráp Colossus"
 sm_colossus_yards_desc:1 "Vượt khỏi khái niệm xưởng đóng tàu truyền thống, Colossus được lắp ráp từ vô số nền tảng xây dựng độc lập và cơ động.\n"
 sm_colossus_yards_desc_modifier:0 "Xưởng đóng tàu: §YCó thể chế tạo Colossus§!"
 sm_titan_yards:0 "Xưởng lắp ráp Titan"
 sm_titan_yards_desc:0 "Xưởng đóng tàu chuyên dụng gắn ngoài căn cứ sao cho phép chúng ta chế tạo những chiến hạm lớp Titan hùng vĩ.\n"
 sm_titan_yards_desc_modifier:0 "Xưởng đóng tàu: §YCó thể chế tạo Titan§!"
 sm_capital_yards_desc_modifier: "Xưởng tàu: §YCho phép đóng tàu chủ lực§!"
 sm_capital_yards: "Xưởng lắp ráp tàu chủ lực"
 sm_capital_yards_desc: "Các ụ tàu chuyên dụng được lắp đặt bên ngoài trạm sao, kết hợp cùng các bệ đóng tàu cơ động tự do, cho phép chúng ta đóng những con tàu chủ lực hùng vĩ. Các loại tàu có thể đóng sẽ không ngừng mở rộng theo sự phát triển của công nghệ.\n"
 sm_dockyard:0 "Khu neo đậu"
 sm_shipyard:0 "Xưởng đóng tàu"
 sm_shipyard_desc:0 "Mỗi xưởng đóng tàu chỉ có thể chế tạo một con tàu cùng lúc, không can thiệp vào các xưởng khác.\n"
 sm_gun_battery:0 "Khẩu đội pháo động năng"
 sm_gun_battery_desc:0 "Thêm hai ô vũ khí cỡ trung cho căn cứ sao.\n"
 sm_missile_battery:1 "Khẩu đội ngư lôi"
 sm_missile_battery_desc:2 "Thêm hai ô vũ khí dẫn đường cho căn cứ sao.\n"
 sm_mining_terminal:0 "Trạm thiết bị khai khoáng (Đã gỡ?)"
 sm_trading_hub:1 "Trung tâm thương mại"
 sm_trading_hub_plural: "Trung tâm thương mại"
 sm_trading_hub_desc:0 "Khu neo đậu dân sự dành cho các thương gia và người bán giao dịch thương mại.\n"
 sm_anchorage:0 "Khu neo đậu"
 sm_anchorage_desc:0 "Khu neo đậu hạm đội là cơ sở không thể thiếu để duy trì sự phát triển của hạm đội.\n"
 sm_hangar_bay:0 "Khoang chứa máy bay"
 sm_hangar_bay_desc:1 "Thêm một nhà chứa máy bay trên hạm cho căn cứ sao.\n"
 sm_astromining_bay: "Khoang khai khoáng vũ trụ"
 sm_astromining_bay_desc: "Nhà chứa và kho lưu trữ hỗ trợ hoạt động thu thập tài nguyên trong hệ sao này."
 sm_ftl_inhibitor:0 "Máy ức chế siêu quang tốc"
 sm_ftl_inhibitor_desc:1 "Chừng nào căn cứ sao còn hoạt động, máy ức chế siêu quang tốc sẽ ngăn không cho tàu địch rời đi qua bất kỳ tuyến siêu không gian nào khác ngoài tuyến chúng đã dùng để vào hệ sao."
 sm_communications_jammer:0 "Thiết bị phá sóng liên lạc"
 sm_communications_jammer_desc:1 "Các thiết bị phá sóng mạnh mẽ này gây nhiễu liên lạc giữa các tàu, khiến việc phối hợp hành động của hạm đội trở nên vô cùng khó khăn.\n"
 sm_disruption_field:0 "Máy phát trường nhiễu loạn"
 sm_disruption_field_desc:0 "Bằng cách kích thích trường cục bộ hạt hạ nguyên tử xung quanh tàu địch trong hệ sao, thiết bị này có thể làm suy yếu đáng kể hiệu quả lá chắn của chúng.\n"
 sm_warp_fluctuator:0 "Trạm đăng ký tuyến siêu không gian"
 sm_warp_fluctuator_desc:2 "Hỗ trợ di chuyển siêu quang tốc cho các tàu thân thiện trong hệ sao bằng cách xác định điều kiện lý tưởng để vào siêu không gian và tối ưu hóa tuyến đường.\n"
 warp_fluctuator_tt: "$trade_with_icon$ tạo ra bởi [Root.GetTradingHubPluralType]: §G+2§!"
 sm_transit_hub:0 "Trạm trung chuyển"
 sm_transit_hub_desc:0 "Cơ sở hạ tầng chuyên dụng cho tàu phi quân sự, đảm bảo mạng lưới giao thông vận tải hoạt động trơn tru và thuận tiện.\n"
 sm_transit_hub_desc_modifier: "Dân số §Ycông nhân§! và §Ycá thể§! thất nghiệp trong hệ sao này — trừ khi bị giới hạn bởi các luật kiểm soát di cư khác — sẽ tự động §Ydi cư§! đến các hành tinh khác có độ thích nghi phù hợp, còn dư nhà ở và việc làm, và hệ sao đó cũng phải có §YTrạm trung chuyển§!.\n\n"
 sm_transit_hub_migrate_effect_desc:0 "Trong hệ sao này, §Y$SLAVES$§! và người máy vô tri thất nghiệp được phép §Ytự động di cư§! sang các thuộc địa khác."
 sm_command_center:0 "Trung tâm chỉ huy"
 sm_command_center_desc:1 "Mọi hoạt động phòng thủ trong hệ sao đều được điều phối bởi cơ sở khổng lồ nằm sâu trong căn cứ sao này. Mạng lưới bản đồ sao và hình chiếu 3D giúp giám sát mọi hoạt động bay qua không gian của hệ sao này bất cứ lúc nào.\n"
 sm_defense_grid:0 "Siêu máy tính mạng lưới phòng thủ"
 sm_defense_grid_desc: "Một siêu máy tính mạnh mẽ điều chỉnh quỹ đạo tương đối và góc bắn của các nền tảng phòng thủ căn cứ sao, giúp gia tăng số lượng nền tảng phòng thủ có thể hỗ trợ.\n"
 sm_science_division:0 "Phòng khoa học"
 sm_science_division_desc:0 "Sản lượng của §Y$sm_spire$§! tăng thêm §Y2£physics£ 2£society£ 2£engineering£§!."
 sm_offworld_trading_company:0 "Công ty thương mại ngoại biên"
 sm_offworld_trading_company_desc:0 "Một tổ chức phi chính phủ chuyên củng cố môi trường thương mại giữa các vì sao.\n"
 sm_offworld_trading_company_desc_modifier:3 "$trade_with_icon$ tạo ra bởi [Root.GetTradingHubPluralType]: §G+4§!\n\n"
 sm_nebula_refinery:0 "Nhà máy tinh chế tinh vân"
 sm_nebula_refinery_desc:0 "Chúng ta có thể xử lý các đám mây bụi trong tinh vân để chiết xuất và tinh chế ra các khoáng sản có giá trị.\n"
 sm_listening_post:0 "Trạm nghe lén"
 sm_listening_post_desc:0 "Trạm nghe lén có một đội ngũ vận hành viên chuyên phân tích tiếng vọng siêu không gian, giúp mở rộng đáng kể phạm vi hoạt động của cảm biến căn cứ sao.\n"
 sm_naval_logistics_office:0 "Văn phòng hậu cần hạm đội"
 sm_naval_logistics_office_desc:1 "Một bộ máy quan liêu không đáng nhắc đến nhưng vẫn tồn tại, về mặt lý thuyết giúp tăng sức chứa của khu neo đậu tại căn cứ sao.\n"
 sm_naval_logistics_office_desc_modifier:2 "Khu neo đậu: §G+3§! §YSức chứa hạm đội§!"
 sm_black_hole_observatory:0 "Trạm quan sát lỗ đen"
 sm_black_hole_observatory_desc:0 "Bằng việc xây dựng một cơ sở nghiên cứu chuyên biệt để quan sát lỗ đen, hiểu biết của đế chế về các định luật vật lý đã có bước nhảy vọt.\n"
 starbase_observatory_tt: "Sản lượng phụ thuộc vào cấp sao sở tại"
 sm_deep_space_black_site:0 "Căn cứ ngầm không gian sâu"
 sm_deep_space_black_site_desc:1 "Phần lớn căn cứ sao này được quy hoạch làm căn cứ bí mật mà giới chức trách không thừa nhận. Toàn bộ hệ sao đều bị theo dõi chặt chẽ, và các nhân viên tình báo cẩn thận thao túng truyền thông cũng như các hoạt động xã hội tại địa phương.\n"
 sm_resource_silo:1 "$building_resource_silo$"
 sm_resource_silo_desc:2 "$building_resource_silo_desc$\n"
 building_resource_silo:0 "Kho tài nguyên"
 building_resource_silo_desc:0 "Cơ sở lưu trữ khổng lồ, dùng để cất giữ an toàn một lượng lớn tài nguyên."
 sm_hydroponics_bay:0 "Khoang thủy canh"
 sm_hydroponics_bay_desc:0 "Bằng cách quy hoạch một phần căn cứ sao này thành nông trại thủy canh, trạm không gian có thể tự cung tự cấp, thậm chí xuất khẩu lượng hoa màu dư thừa sang các hệ sao khác."
 sm_target_uplink_computer:0 "Máy tính truyền tải dữ liệu mục tiêu"
 sm_target_uplink_computer_desc:1 "Một máy tính nhắm mục tiêu tiên tiến có thể thu thập và phân tích dữ liệu từ các cảm biến đồng minh khác trong hệ sao. Điều này giúp căn cứ sao tính toán phương án nổ súng dễ dàng hơn.\n"
 sm_curator_think_tank:0 "Viện nghiên cứu Curator"
 sm_curator_think_tank_desc:0 "Bằng cách thành lập một tổ chức nghiên cứu chuyên biệt để học hỏi và hợp tác với Hội Curator, chúng ta có thể đóng góp lớn vào sự tiến bộ khoa học của mình.\n"
 sm_art_college:0 "Học viện nghệ thuật"
 sm_art_college_desc:1 "Học viện nghệ thuật không trọng lực này hợp tác với thành bang nghệ sĩ lân cận, nơi những sinh viên tài năng ca ngợi vẻ đẹp hùng vĩ của không gian ngoài hành tinh qua từng nét vẽ.\n"
 sm_salvager_workshop:0 "Xưởng bảo trì"
 sm_salvager_workshop_desc:0 "Khu nhà phụ nhộn nhịp này trang bị đầy đủ công cụ và linh kiện cho đội ngũ kỹ thuật của chúng ta, mở đường cho sự hợp tác chặt chẽ hơn với thành bang không gian gần đó.\n"
 sm_shroud_beacon:0 "Đèn hiệu Hư Cảnh"
 sm_shroud_beacon_desc:2 "Một đèn hiệu tâm linh dùng để tạo ra đường hầm Hư Cảnh trong hệ sao này. Nếu đèn hiệu này bị tháo dỡ hoặc phá hủy, đường hầm cũng sẽ tan biến.\n"
 sm_mercenary_garrison:0 "Doanh trại lính đánh thuê"
 sm_mercenary_garrison_desc:0 "Khu doanh trại làm nơi đóng quân cho lính đánh thuê. Những cựu binh dạn dày sương gió này tổ chức huấn luyện thường xuyên cho những người còn lại, luôn sẵn sàng bảo vệ căn cứ sao — miễn là tiền trao cháo múc.\n"
 sm_astromining_hub: "Trung tâm khai khoáng vũ trụ"
 sm_astromining_hub_desc: "Các văn phòng và cơ sở xử lý này cung cấp kỹ sư và điều phối viên cho công việc thu thập tài nguyên trong hệ sao. Quy trình lưu kho được tối ưu hóa cẩn thận cho phép chúng ta khai thác khoáng sản tại địa phương với hiệu suất chưa từng có.\n"
 sm_astromining_hub_office_desc_modifier: "Mô-đun khoang khai khoáng vũ trụ:\n Sản lượng trạm khai thác: §G+10%§!"
 requires_astromining_bay: "§RYêu cầu§! §Y$sm_astromining_bay$§!"
 TIME_LEFT_SECOND:0 "Còn lại $SECONDS$ giây"
 TIME_LEFT_SECONDS:0 "Còn lại $SECONDS$ giây"
 TIME_LEFT_DAYS:0 "£resource_time£ $DAYS$"
 TIME_COST_VALUE:1 "£resource_time£ $DAYS|0$"
 BUILD_TIME:0 "Thời gian xây dựng: £resource_time£ $DAYS|Y0$"
 CLEAR_TIME:1 "Thời gian dọn dẹp: £resource_time£ $DAYS|Y0$"
 ENACT_TIME:0 "Thời gian thi hành: £resource_time£ $DAYS|Y0$"
 EST_YEARLY_DEV_INC:0 "Tăng hằng năm: §H$EST$%§!"
 EST_YEARLY_ENERGY:0 "Sản lượng hằng năm: §H$EST$§!"
 MACRO_BUILDER_TITLE:0 "§ETrung tâm lực lượng tấn công§!"
 MACRO_BUILDER_DESC:1 "§YTrung tâm lực lượng tấn công§! cung cấp một cách thức đơn giản để thành lập số lượng lớn các lực lượng tấn công. Lực lượng sẽ được thành lập trên tất cả các hành tinh khả dụng trong khu vực này.\n\nKhi hoàn thành, chúng sẽ củng cố cho các §YQuân đoàn§! có bật §YTập hợp lục quân§! hoặc tập hợp tại §YCăn cứ sao§! này."
 MACRO_BUILDER_CAPACITY_DESC:1 "Số lượng £colony£§YThuộc địa§! khả dụng quyết định số lượng quân đội có thể được huấn luyện song song. Có thể loại trừ thuộc địa khỏi §YTrung tâm Quân Đội Tấn Công§! trong tab $colony_view_tab_armies$ của $concept_colony_view$."
 MACRO_BUILDER_TAB:0 "Trung tâm lục quân"
