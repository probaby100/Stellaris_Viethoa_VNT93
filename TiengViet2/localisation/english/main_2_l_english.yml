 TECH_UNLOCK_BORDER_EXTRUDER_3_DESC:0 "§HĐèn hiệu biên giới tiên tiến§!\nChúng ta được định sẵn để trở thành những người cai trị tối cao, và những kẻ dám chống lại chúng ta phải hiểu rõ điều này!"
 TECH_UNLOCK_COMBAT_COMPUTER_PRECOG_TITLE:0 "§HMở khóa bộ phận: §!Giao diện tiên tri"
