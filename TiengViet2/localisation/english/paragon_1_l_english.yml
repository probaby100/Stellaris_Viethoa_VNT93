 tech_node_culling_1: "Thanh lọc Nút Sơ cấp"
 tech_node_culling_1_desc: "Sân khấu ngân hà luôn không ngừng biến động, bản năng chiến lược của chúng ta cũng phải như vậy. Bất kỳ giai đoạn tiến hóa nào không còn mang lại lợi thế đều sẽ bị loại bỏ."
 tech_node_culling_2: "Thanh lọc Nút Cơ bản"
 tech_node_culling_2_desc: "Sau khi bị gỡ bỏ, một nút thay thế sẽ được kích thích để phát triển trong một môi trường phù hợp. Bí quyết nằm ở chỗ dùng chính nút trước đó để làm chất dinh dưỡng nuôi nó."
 tech_node_culling_3: "Thanh lọc Nút Tiên tiến"
 tech_node_culling_3_desc: "Loại bỏ toàn bộ một nút là một việc vô cùng kém hiệu quả. Thay vào đó, chúng ta chỉ cần cắt tỉa đi những cành lá không cần thiết là đủ."
 AGENDA_UNLOCK_NODE_CULLING_TITLE: "§HMở khóa Nghị trình§!: Thanh lọc Nút"
 AGENDA_UNLOCK_NODE_CULLING_DESC: "§YNghị trình Thanh lọc§! có thể giúp chúng ta thay thế những nút không còn phù hợp với mục đích nữa. Quá trình này sẽ đổi một nút hiện tại của chúng ta lấy một nút có cấp độ thấp hơn."

 tech_node_reformatting_1: "Định dạng Nút Sơ cấp"
 tech_node_reformatting_1_desc: "Trên vũ đài ngân hà đang phát triển như vũ bão, các giao thức tự quyết và thuật toán dẫn đường cũng có thể trở nên lỗi thời. Chúng sẽ bị ghi đè không thương tiếc như mọi dữ liệu rác khác."
 tech_node_reformatting_2: "Định dạng Nút Cơ bản"
 tech_node_reformatting_2_desc: "Mọi thuật toán tự lặp đều có giá trị riêng của nó. Chúng ta sẽ không để những kiến thức quan trọng bị lãng phí vô ích vào việc khôi phục các nhà lãnh đạo."
 tech_node_reformatting_3: "Định dạng Nút Tiên tiến"
 tech_node_reformatting_3_desc: "Sử dụng một phần mềm lỗi để phát triển ra thế hệ kế nhiệm của nó giúp chúng ta có thể tái thiết nhanh chóng. Việc học hỏi từ các luồng ký ức sai lầm sẽ giúp tạo ra những chỉ thị nội các cấp cao hơn."
 AGENDA_UNLOCK_NODE_REFORMATTING_TITLE: "§HMở khóa Nghị trình§!: Định dạng lại Nút"
 AGENDA_UNLOCK_NODE_REFORMATTING_DESC: "§YNghị trình Định dạng§! có thể giúp chúng ta thay thế những nút không còn phù hợp với mục đích nữa. Quá trình này sẽ đổi một nút hiện tại của chúng ta lấy một nút có cấp độ thấp hơn."

