 councilor_beacon_of_liberty:0 "Vệ Binh Tự Do"
 councilor_beacon_of_liberty_female:0 "$councilor_beacon_of_liberty$"
 councilor_beacon_of_liberty_desc:1 "$TITLE$ là chiến sĩ đấu tranh cho tự do."
 councilor_brand_loyalty:0 "Quản Lý Thương Hiệu"
 councilor_brand_loyalty_female:0 "$councilor_brand_loyalty$"
 councilor_brand_loyalty_desc:1 "$TITLE$ chịu trách nhiệm xây dựng lòng trung thành với thương hiệu trong và ngoài nước."
 councilor_byzantine_bureaucracy:0 "Điều Phối Viên Hành Chính"
 councilor_byzantine_bureaucracy_female:0 "$councilor_byzantine_bureaucracy$"
 councilor_byzantine_bureaucracy_desc:1 "$TITLE$ toàn quyền điều phối công việc của tất cả các bộ phận hành chính."
 councilor_catalytic_processing:0 "Xúc Tác Sư Trưởng"
 councilor_catalytic_processing_female:0 "$councilor_catalytic_processing$"
 councilor_catalytic_processing_desc:0 "$TITLE$ giám sát việc gia tăng sản lượng qua quá trình xúc tác nguyên liệu thô."
 councilor_citizen_service:0 "Cục Trưởng Tuyển Quân"
 councilor_citizen_service_female:0 "$councilor_citizen_service$"
 councilor_citizen_service_desc:0 "$TITLE$ toàn quyền trách nhiệm huấn luyện và chiêu mộ quân đội."
 councilor_corporate_anglers:0 "Giám Đốc Hàng Hải"
