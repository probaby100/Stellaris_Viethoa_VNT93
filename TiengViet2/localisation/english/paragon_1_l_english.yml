 ####################
 ### THE BEHOLDER ###
 ####################

 # Chain aborted, due to either on_colonized or on_uplift_completion
 paragon.102.name:0 "Mất đi Kim tự tháp"
 paragon.102.desc:0 "Kim tự tháp trên [beholder_planet.GetName] không còn nữa, để lại một hố sâu khổng lồ. Các sinh vật chưa tiến hóa địa phương đứng bối rối bên rìa vách đá của chiếc hố."

 # RECRUITMENT #
 paragon_beholder_category:0 "Đỉnh điểm biến động"
 paragon_beholder_category_desc:0 "Chúng ta phát hiện các đợt bùng phát năng lượng ngắt quãng từ hành tinh này. Các chỉ số này cho thấy thứ gì đó mạnh mẽ, vượt xa khả năng của những loài chưa tiến hóa mà chúng ta quan sát được."

 paragon.3.name:0 "Đỉnh điểm biến động"
 paragon.3.desc:0 "Chúng ta đã xác định được nguồn gốc của biến động năng lượng trên [From.GetName], nó bắt nguồn từ một công trình hình kim tự tháp nằm ở trung tâm lãnh thổ của sinh vật chưa tiến hóa. Chúng ta nhận thấy cư dân địa phương tụ tập quanh công trình một cách kỳ lạ.\n\nNếu muốn xác nhận chức năng của vật thể này, không thể tránh khỏi việc phải tiếp xúc với cư dân trên hành tinh."
 paragon.3.a:0 "Cử một đội bắt đầu điều tra."
 paragon.3.b:0 "$distar.255.b$"

 paragon.4.name:0 "Kim tự tháp Thì thầm"
 paragon.4.desc:0 "Đội ngũ của chúng ta đã bắt tay vào điều tra công trình trên [From.From.GetName]. Đó là một cấu trúc kim tự tháp cổ xưa. Các nhà khoa học báo cáo rằng có những tiếng thì thầm kỳ lạ vang vọng quanh khu vực đó, nên gọi nó là 'Đài kỷ niệm Thì thầm' cũng rất hợp lý.\n\nKim tự tháp này dường như đóng vai trò không thể thay thế trong hệ thống tín ngưỡng sơ khai của các sinh vật chưa tiến hóa trên hành tinh này. Việc một loài ở mức độ trí tuệ này, thậm chí còn chưa biết dùng công cụ, lại phát triển các thực hành tâm linh phức tạp là điều hết sức bất thường.\n\n[beholder_presapients.GetAdj] có ý thức lãnh thổ rất mạnh và rất dễ bị chọc giận. Sự xuất hiện của chúng ta đã quấy rầy chúng, ngày càng có nhiều sinh vật tụ tập quanh kim tự tháp. Có lẽ chúng ta cần dùng chút biện pháp cưỡng chế mới có thể đến gần công trình này."
 paragon.4.a:0 "Chúng ta phải lấy được lòng tin của chúng."
 paragon.4.b:0 "Niềm tin của chúng đã đặt sai chỗ."
 paragon.4.b.custom_tooltip:0 "Chúng ta sẽ dạy những sinh vật chưa tiến hóa này cách tôn thờ chúng ta."
 paragon.4.c:0 "Cưỡng chế dọn sạch khu vực này."
 paragon.4.d:0 "Chúng không phải là mối đe dọa. Bỏ qua là được."

 the_beholder_presapients_protected:0 "Cộng sinh bất thường"
 the_beholder_presapients_protected_desc:0 "Những tiếng thì thầm phát ra từ kim tự tháp trên hành tinh này mang lại cảm giác dễ chịu cho cư dân chưa tiến hóa địa phương. Chúng bảo vệ công trình này như bảo vệ chính mạng sống của mình. Bất kỳ sự can thiệp nào từ phía chúng ta cũng có thể mang lại hậu quả khó lường."

 ### Befriending pre-sapients
 #Befriend Special project
 BEFRIENDING_BEHOLDER_PRESAPIENTS:0 "Xây dựng lòng tin"
 BEFRIENDING_BEHOLDER_PRESAPIENTS_DESC:0 "Để [beholder_presapients.GetAdj] trên [beholder_planet.GetName] dần quen với sự hiện diện của chúng ta sẽ mở ra cơ hội tiếp cận Kim tự tháp Thì thầm. Nếu chúng bớt cảnh giác, chúng ta có thể tự do đi lại giữa chúng, thậm chí có cơ hội nghiên cứu sâu hơn về loài của chúng."

 paragon.5.name:0 "Niềm tin không lời"
 paragon.5.desc:0 "Sau một thời gian chung sống với [beholder_presapients.GetAdj] trên [beholder_planet.GetName], chúng không còn sợ hãi chúng ta nữa. Chúng ta đã thiết lập được những hiểu biết cơ bản về cấu trúc xã hội của chúng.\n\n$paragon_whispering_info$"
 paragon.5.a:0 "Chúng ta đang từng bước tiến tới."

 paragon_whispering_info:0 "Một nhóm [beholder_presapients.GetAdj] mới đang kéo đến kim tự tháp. So với hành vi bảo vệ lãnh thổ ban đầu, giờ đây chúng có vẻ rất bình tĩnh, thậm chí còn đầy mong đợi. Có chuyện gì đó sắp xảy ra."

 ### Proclaim our own divinity
 # Success
 paragon.10.name:0 "Ngụy thần"
 paragon.10.desc:0 "Chúng ta đã thuần hóa [beholder_presapients.GetAdj] để chúng coi chúng ta như những vị thần. Bọn chúng giờ đây ngoan ngoãn dễ bảo và tìm kiếm sự che chở từ chúng ta. Công nghệ phi thường của chúng ta trong mắt chúng chẳng khác nào phép thuật, việc thao túng hệ thống tín ngưỡng của chúng dễ như trở bàn tay. Giờ đây chúng ta có thể tự do tiến vào Kim tự tháp Thì thầm."
 # Failure
 paragon.11.name:0 "$paragon.10.name$"
 paragon.11.desc:0 "Chúng ta đã cố gắng thuần hóa [beholder_presapients.GetAdj], tưởng rằng việc chuyển hướng niềm tin của chúng từ kim tự tháp sang chúng ta là một việc dễ dàng. Đáng tiếc, nỗ lực của chúng ta đã phản tác dụng, kích động sự phản kháng dữ dội từ chúng. Một bầy đàn khổng lồ đã bắt đầu bao vây Kim tự tháp Thì thầm. Chúng ta vẫn không thể đến gần."
 paragon.11.a:0 "Thật không may. $paragon.4.c$"
 paragon.11.b:0 "$distar.255.b$"

 ### Make them move
 paragon.15.name:0 "Sự phản kháng sụp đổ"
 paragon.15.desc:1 "Sau màn phô trương hỏa lực thô bạo, chúng ta đã buộc [beholder_presapients.GetAdj] phải nhận ra sự vượt trội của chúng ta. Bất chấp khoảng cách khổng lồ về trí tuệ, chúng đã rút ra bài học và hiểu rằng cản đường chúng ta không mang lại lợi ích gì. Nhiều con sợ hãi bỏ chạy thục mạng về hang ổ. Giờ thì chúng ta có thể nghiên cứu Kim tự tháp Thì thầm mà không bị quấy rầy."
 paragon.15.a:0 "Chúng ta chỉ làm những việc cần thiết mà thôi."

 ### Study the Monolith
 #Monolith study Special Project
 WHISPER_TEMPLE_STUDY:0 "Nghiên cứu Kim tự tháp Thì thầm"
 WHISPER_TEMPLE_STUDY_DESC:0 "Chúng ta đã có cơ hội nghiên cứu Kim tự tháp Thì thầm cổ đại trên [beholder_planet.GetName]."

 paragon.20.name:0 "Khám phá Kim tự tháp Thì thầm"
 paragon.20.desc:0 "Việc nghiên cứu Kim tự tháp Thì thầm có vẻ khá tốn thời gian mà kết quả thu được lại chẳng bao nhiêu. Những bí mật của nó dường như đang chơi trốn tìm với chúng ta. Không còn nghi ngờ gì nữa, bên trong khối chóp này chắc chắn chứa công nghệ tiên tiến, nhưng nguồn năng lượng khổng lồ mà nó tạo ra lại cực kỳ kỳ lạ so với sự hiểu biết khoa học hiện tại của chúng ta.\n\nChắc chắn đang có chuyện gì đó đặc biệt xảy ra bên trong bức tường của kim tự tháp. $paragon_whispering_info$"
 paragon.20.a:0 "$paragon.5.a$"

#The Murmuring (previously The Whispering)
 paragon.25.name:0 "Lời thì thầm"
 paragon.25.desc:0 "Khi toàn bộ [beholder_presapients.GetAdj] tụ tập quanh Kim tự tháp Thì thầm, chúng ta đã quan sát được một hiện tượng chưa từng có. Một cảm giác thanh bình lan tỏa nhanh chóng qua đàn thú. Những sinh vật này dường như bị một sức mạnh vô hình nào đó giữ chặt. Một số nhà khoa học của chúng ta cũng bị ảnh hưởng bởi hiện tượng dị thường này, mất liên kết với thực tại trong một thời gian ngắn. Khi tỉnh lại, họ kể rằng đã giao tiếp trực tiếp với Kim tự tháp Thì thầm."
 paragon.25.a:0 "Báo cáo chi tiết về chuyện này."

 paragon.26.name:0 "$paragon.25.name$"
 paragon.26.desc:0 "Báo cáo từ các nhà khoa học của chúng ta về cuộc giao tiếp gần đây với Kim tự tháp Thì thầm vô cùng thú vị. Người ta nói rằng, trải nghiệm ngoại cảm này mang lại cảm giác giải thoát và biến đổi.\n\nCác nhà khoa học gọi sự kiện này là 'Lời thì thầm', và khăng khăng rằng chính kim tự tháp đã giao tiếp trực tiếp với họ. Trong thời gian tiếp xúc ngắn ngủi, người tham gia có thể chia sẻ những suy nghĩ sâu kín nhất của mình, và được bao bọc bởi cảm giác tin tưởng và thấu hiểu.\n\nKhi hiệu ứng này kết thúc, mức năng lượng phát ra từ kim tự tháp đột ngột giảm sút. Có lẽ chúng ta nên tìm cách kết nối lại với kim tự tháp."

 WHISPER_TEMPLE_ENERGY:0 "Kim tự tháp Thì thầm: Năng lượng"
 WHISPER_TEMPLE_ENERGY_DESC:0 "Bằng cách tập trung năng lượng vào các bộ phận bên trong Kim tự tháp Thì thầm, chúng ta có thể tái hiện lại hiện tượng Lời thì thầm và tiến hành tiếp xúc sâu hơn."

 paragon.30.name:0 "Kẻ Quan Sát"
 paragon.30.desc:0 "Chúng ta đã tái hiện thành công các điều kiện của lần Thì thầm đầu tiên, mở ra cuộc giao tiếp thứ hai với kim tự tháp. Lần này, chúng ta đã duy trì được hiện tượng và tiếp xúc với một thực thể ở nơi xa xăm đang sử dụng đài kỷ niệm làm vật trung gian.\n\nThực thể này tự xưng là §YKẻ Quan Sát§!, tuyên bố đang ở trong §YHư Cảnh§!, sử dụng kim tự tháp để giao tiếp từ một chiều không gian khác. Nó nuôi sống bản thân bằng năng lượng và đồng ý giúp đỡ chúng ta để đổi lấy nguồn cung cấp."
 paragon.30.a:0 "Cứ cho nó năng lượng nó muốn."
 paragon.30.b:0 "Chúng ta sẽ cung cấp năng lượng sau, yên tâm đi."
 paragon.30.c:0 "Dựa vào đâu mà chúng ta phải tin nó."

 the_beholder_energy_small:0 "Kẻ Quan Sát"
 beholder_context_menu_title:0 "Đổ bộ lên hành tinh"
 beholder_action_activity_key:0 "Di chuyển đến bề mặt của $NAME|Y$"
 the_beholder_energy_small_desc:0 "Cung cấp năng lượng cho phép chúng ta ký khế ước với Kẻ Quan Sát."
 the_beholder_energy_medium:0 "$the_beholder_energy_small$"
 the_beholder_energy_medium_desc:0 "$the_beholder_energy_small_desc$"
 the_beholder_energy_big:0 "$the_beholder_energy_small$"
 the_beholder_energy_big_desc:0 "$the_beholder_energy_small_desc$"

 paragon.31.name:0 "Phi thuyền"
 paragon.31.desc:0 "§HChúng ta đã cung cấp năng lượng theo yêu cầu và hoàn tất giao dịch với Kẻ Quan Sát. Ngay khi năng lượng được chuyển đến, kim tự tháp bắt đầu rung động dữ dội. Sau đó nó chao đảo, và mặt đất xung quanh sụp đổ. Khi khối cự thạch vươn lên, toàn bộ hình hài của nó dần lộ diện, và chúng ta nhận ra kích thước thật của nó lớn gấp ít nhất hai lần so với những ước tính điên rồ nhất.\n\nKim tự tháp này là một cấu trúc bát diện khổng lồ, nó lơ lửng giữa không trung, rũ bỏ lớp bụi đất bao phủ bao lâu nay. Khi nó bay vút lên bầu khí quyển của [beholder_planet.GetName], cư dân địa phương trên hành tinh gào thét trong đau đớn.\n\nBây giờ chúng ta đã biết, Kim tự tháp Thì thầm là một phi thuyền khổng lồ có khả năng du hành vũ trụ. Nó hiện đang bay trên quỹ đạo của [beholder_planet.GetName].§!"
 paragon.1.a:0 "Ngươi cần năng lượng để làm gì?"
 paragon.1.a.response:0 "§HSau một lúc im lặng, kênh truyền tín hiệu dần bị lấp đầy bởi tiếng ồn tĩnh điện, ngày càng mạnh lên, những ai nghe thấy đều bị vô số cảm xúc chế ngự, bao gồm cả sự hối tiếc suy nhược và những khao khát cháy bỏng. Có quá nhiều suy nghĩ không thể chắt lọc hết, nhưng có một giọng nói xuyên qua mọi tiếng ồn:§!\n\nĐể quan sát."
 paragon.1.b:1 "Ngươi có thể làm gì cho nền văn minh của chúng ta?"
 paragon.1.b.response:0 "§HMột chuỗi những lời thì thầm rời rạc vang vọng lặp đi lặp lại.§!\n\nBí mật... phơi bày. Xuyên qua... con đường... mở ra. Tiềm năng của... Hư Cảnh... bắt đầu. Chúng ta hoan nghênh... hãy để chúng ta... dẫn lối... đến đó.\n\n§HMặc dù thông điệp đứt đoạn này có thể được hiểu theo nhiều cách, nhưng không còn nghi ngờ gì nữa, nó chắc chắn liên quan đến năng lượng Tâm linh và Hư Cảnh.§!"
 paragon.1.c:0 "Ngươi là thứ gì?"
 paragon.1.c.response:0 "§HMột giọng nói vang lên với độ rõ nét đáng kinh ngạc:§!\n\nKhoảnh khắc, và vĩnh hằng. Vô hình, và vạn vật... Ngôn ngữ của các người quá kém cỏi. Chúng ta giống như 'mục đích'. Hiện tại, bất kỳ định nghĩa nào sâu xa hơn đều vượt quá tầm hiểu biết của các người. Hư Cảnh vô biên vô tận, các người còn phải học nhiều lắm."

 paragon_beholder_joins:1 "§Y$NAME_The_Beholder$§! gia nhập đế chế của bạn với tư cách một §HNhà Lãnh đạo§!"

 NAME_The_Beholder:0 "Kẻ Quan Sát"
 NAME_The_Beholder_plural:0 "Những Kẻ Quan Sát"

 temple_of_whispers:0 "$NAME_The_Beholder$"
 temple_of_whispers_plural:0 "$NAME_The_Beholder$"
 temple_of_whispers_key:0 ""

 BEHOLDER_CLOUD_LIGHTNING:0 "Sét Hư Cảnh"
 NAME_Temple_of_Whispers:0 "Kim tự tháp Thì thầm"
 building_the_beholder:0 "$NAME_Temple_of_Whispers$"
 building_the_beholder_desc:1 "Cổng kết nối của §Y$temple_of_whispers$§! vào bình diện tồn tại của chúng ta. Một phi thuyền, dựa vào năng lượng của hành tinh để thu thập Zro và duy trì liên kết với Hư Cảnh."
 building_the_beholder_known_desc:2 "$beholder_decisions$"
 building_the_beholder_unknown_desc:0 "Một cấu trúc bí ẩn, phát ra những gợn sóng năng lượng kỳ lạ."

 beholder_ship_button_desc:0 "§HĐổ bộ Hành tinh§!\nHạ cánh phi thuyền này xuống một hành tinh chúng ta sở hữu, nó sẽ biến thành một công trình.\n\n§YKim tự tháp Thì thầm§!\nGiới hạn Đế chế: §Y1/1§!\nSản lượng: £sr_zro£ 8.00\nPhí duy trì: £energy£ 25.00\nTài nguyên từ Dân số Tâm linh: §G+10%§!\n\n$beholder_decisions$"
 beholder_decisions:1 "Mở khóa §EQuyết nghị Hành tinh§!:\n—§H$decision_deploy_beholder$§!\n—§H$decision_psi_inoculate_pops$§!\n—§H$decision_cease_psi_inoculate_pops$§!\n\n"

 SHROUD_SHIELD_SUPPRESSION_FIELD:0 "Bộ áp chế Khiên Hư Cảnh"
 SHROUD_SHIELD_SUPPRESSION_FIELD_DESC:0 "Một trường lực được nạp bằng năng lượng từ Hư Cảnh, vô hiệu hóa tất cả các lớp khiên trong toàn bộ hệ sao."
 SHIP_PLANETFALL:0 "Thiết kế Chức năng Kép"
 SHIP_PLANETFALL_DESC:0 "Kim tự tháp này thực chất là một phi thuyền vô cùng vững chãi, có thể dùng làm tàu vũ trụ hoặc công trình trên hành tinh."
 decision_deploy_beholder:0 "Triển khai Kim tự tháp Thì thầm"
 decision_deploy_beholder_custom_tooltip:1 "Kim tự tháp Thì thầm sẽ được triển khai thành một phi thuyền với khả năng chiến đấu."
 decision_deploy_beholder_desc:0 "Rời khỏi hành tinh, phi thuyền của Kẻ Quan Sát có thể kích hoạt thiết bị áp chế khiên, vô hiệu hóa mọi lá chắn một cách bừa bãi."
 cannot_deploy_during_psi_inoculation:1 "§RĐang tiến hành cấy ghép tâm linh cho dân số trên hành tinh này. Không thể di dời Kẻ Quan Sát, nếu không ý thức của họ sẽ gặp nguy hiểm.§!"

 decision_psi_inoculate_pops:1 "Bắt đầu cấy ghép tâm linh"
 decision_psi_inoculate_pops_custom_tooltip:2 "Kim tự tháp Thì thầm sẽ dần dần ban cho £pop£§HDân số§! đặc điểm §Y$trait_psionic$§!, nhưng không tạo ra £sr_zro£§YZro§!.\n\n§RKhông thể triển khai Kim tự tháp Thì thầm trong lúc quá trình này đang diễn ra.§!"
 decision_psi_inoculate_pops_desc:3 "Kẻ Quan Sát sẽ từ từ cấy ghép đặc điểm §Y$trait_psionic$§! cho dân số. Yêu cầu là dân số không bị thanh lọc, không phải là người máy sinh học hay ý thức bầy đàn."
 no_organic_pops_on_planet:0 "§RHành tinh này không có dân số hữu cơ, không phải người máy sinh học để tiến hành cấy ghép.§!"

 decision_cease_psi_inoculate_pops:0 "Dừng cấy ghép tâm linh"
 decision_cease_psi_inoculate_pops_custom_tooltip:0 "£pop£§HDân số§! sẽ không còn dần nhận được đặc điểm §Y$trait_psionic$§!.\n$beholder_psi_pops_timer_tooltip$\nViệc này cho phép Kim tự tháp Thì thầm có thể được triển khai và tiếp tục sản xuất £zro£§YZro§!."
 decision_cease_psi_inoculate_pops_desc:0 "Kẻ Quan Sát sẽ từ từ cấy ghép đặc điểm §Y$trait_psionic$§! cho dân số. Yêu cầu là dân số không bị thanh lọc, không phải là người máy sinh học hay ý thức bầy đàn."

 beholder_psi_pops_timer_tooltip:0 "Lần cấy ghép tâm linh tiếp theo của §Y[This.GetName]§! sẽ hoàn thành vào §Y[This.beholder_psi_pops_timer]§!."

 beholder_psi_pops_cooldown_tooltip:0 "\n§RKim tự tháp Thì thầm mới vừa ngừng cấy ghép tâm linh gần đây, không thể bắt đầu lại trước §Y[This.beholder_psi_pops_cooldown_timer]§!§!"

 MESSAGE_POPS_INOCULATED_TITLE:0 "Hoàn tất cấy ghép cho Dân số"
 MESSAGE_POPS_INOCULATED_DESC:1 "Nhờ vào việc cấy ghép tâm linh của §YKẻ Quan Sát§!, §Y100§! £pop£§HDân số§! trên $PLANET|$ đã nhận được đặc điểm §Y$trait_psionic$§!."

 MESSAGE_BEHOLDER_PLANETFALL_TITLE:0 "Kẻ Quan Sát Đổ bộ"
 MESSAGE_BEHOLDER_PLANETFALL_DESC:0 "Kẻ Quan Sát đã đổ bộ xuống $PLANET|$ và thiết lập lại Kim tự tháp Thì thầm."

 MESSAGE_BEHOLDER_PLANETFALL_NO_SLOTS_TITLE:0 "Kẻ Quan Sát Đổ bộ Thất bại"
 MESSAGE_BEHOLDER_PLANETFALL_NO_SLOTS_DESC:1 "Kẻ Quan Sát không thể đổ bộ xuống $PLANET|$. Cần có một ô trống cho công trình."

 leader_trait_governor_psionic_communion:0 "Giao cảm Tâm linh"
 leader_trait_governor_psionic_communion_desc:1 "Năng lực tâm linh của nhà lãnh đạo này đã cải thiện trạng thái tinh thần của quần chúng, củng cố niềm tin và tạo ra cảm giác an toàn."

 # Beholder Backstory
 beholder_backstory:1 "Một thực thể từ Hư Cảnh, một trong những giọng nói của Lời thì thầm Hư Không, hiện thân qua các vật trung gian giữa các bình diện tồn tại khác nhau. Dù tỏ ra có vẻ thân thiện, nhưng việc cẩn trọng với nó là hoàn toàn hợp lý. Sức mạnh tuyệt đối và mục đích thực sự của nó vẫn chưa được biết rõ."


##########################################
###     Exakeides, Scion of Vagros     ###
##########################################
 NAME_Exakeides:0 "Keides, Hậu duệ của Vagros"
 desc_exakeides:0 "Anh ấy đã ngủ đông trong khoang đông lạnh qua vô số kỷ nguyên. Một khi được giải phóng, §YExakeides§! muốn bù đắp lại khoảng thời gian đã mất, ẩn dưới vẻ ngoài trẻ trung của anh là một trí tuệ cực kỳ sắc sảo."
 leader_trait_legendary_far_from_home:0 "Quá khứ mờ mịt"
 leader_trait_legendary_far_from_home_desc:0 "Anh ta từ đâu đến? Ai đã đóng băng anh vào khoang đông lạnh? Tại sao anh ta lại bước ra từ đó? Những bí ẩn chưa có lời giải về quá khứ đã thôi thúc cơn khát khao tri thức của nhà lãnh đạo này."
 leader_trait_legendary_ancestors_knowledge:0 "Tri thức Tổ tiên"
 leader_trait_legendary_ancestors_knowledge_desc:0 "Cơ thể của nhà lãnh đạo này lưu trữ một lượng kiến thức và kỹ năng khổng lồ, là tinh hoa di truyền đúc kết từ sự hy sinh của tổ tiên anh ta."
 job_archivist:0 "$job_fe_archivist$"
 job_archivist_plural:0 "$job_fe_archivist_plural$"
 job_archivist_desc:0 "Dưới sự hướng dẫn tận tình của Keides, những chuyên viên lưu trữ này chịu trách nhiệm phân loại dữ liệu theo tiêu chuẩn của người Vagros."
 mod_job_archivist_add:0 "$mod_job_fe_archivist_add$"

 paragon.3100.name:0 "Tín hiệu cầu cứu"
 paragon.3100.desc:1 "Ngay khi tiến vào hệ sao [From.GetName], cảm biến của chúng ta đã phát hiện một tín hiệu yếu ớt từ hành tinh [event_target:exakeides_planet.GetName].\n\nNó phát ra theo những nhịp ngắn và lặp đi lặp lại, có vẻ như đang cầu cứu. Tuy nhiên, vì tín hiệu quá yếu, chúng ta e rằng việc định vị nguồn phát sẽ rất khó khăn. Có lẽ khi đến nơi thì đã quá muộn để giúp đỡ."
 paragon.3100.a:0 "Hãy thử xem nếu vẫn còn cơ hội."
 paragon.3100.b:0 "Vậy cứ phớt lờ nó đi."
 LEGENDARY_LEADER_FIRST_PROJECT:0 "Nguồn gốc Tín hiệu Cầu cứu"
 LEGENDARY_LEADER_FIRST_PROJECT_DESC:0 "Sẽ mất nhiều thời gian để xác định vị trí chính xác trên bề mặt hành tinh [event_target:exakeides_planet.GetName] của tín hiệu cầu cứu."
 paragon.3104.name:0 "Khoang cứu sinh"
 paragon.3104.desc:1 "Chúng ta đã tìm thấy nguồn gốc của tín hiệu cầu cứu trên [event_target:exakeides_planet.GetName].\n\nSâu dưới lớp vỏ hành tinh là một khoang cứu sinh cổ đại được chôn vùi. Có vẻ như bên trong nang đông lạnh của nó là một đứa trẻ ngoài hành tinh.\n\nMặc dù khoang cứu sinh này đã rất cũ, các thiết bị bảo quản nhiệt độ thấp vẫn đang hoạt động, các dấu hiệu sinh tồn của đứa trẻ cũng rất ổn định. Trên lớp vỏ ngoài của nang có khắc thô sơ một dãy ký hiệu. Chúng ta dịch nó thành: 'Niềm hy vọng của chúng ta. Tương lai của chúng ta. Hậu duệ của chúng ta.'"
 paragon.3104.a:0 "Đánh thức đứa trẻ."
 LEGENDARY_LEADER_RESUSCITATION:0 "Hồi sinh từ đông lạnh"
 LEGENDARY_LEADER_RESUSCITATION_DESC:0 "Đứa trẻ được tìm thấy trên [event_target:exakeides_planet.GetName] đã sống sót thành công sau thời gian đông lạnh lâu hơn bất kỳ lịch sử nào được biết đến. Công việc đánh thức đòi hỏi sự chuẩn bị hết sức cẩn trọng."
 paragon.3105.name:0 "Hồi sinh thành công"
 paragon.3105.desc:1 "Đứa trẻ được tìm thấy trên [event_target:exakeides_planet.GetName] đã được hồi sinh thành công. Mọi dấu hiệu sinh tồn đều nằm trong phạm vi hợp lý đối với dạng sống này. Hiện tại cậu bé vẫn chưa lấy lại ý thức, có lẽ sẽ mất một thời gian nữa mới tỉnh lại.\n\nBên trong khoang cứu sinh còn tìm thấy vài đồ vật. Món đầu tiên là một viên pha lê dữ liệu hơi hư hỏng, ghi lại tên, tuổi và giống loài của đứa trẻ. Cậu tên là §YExakeides§!, các nhật ký hoàn chỉnh cho thấy cậu là §YHậu duệ của Vagros§!. Món thứ hai là một cổ vật kỳ lạ được làm từ kim loại nặng không xác định. Nhìn từ thiết kế, có vẻ như nó là một phần của một thiết bị lớn hơn. Các nghiên cứu sâu hơn đang được lên kế hoạch.\n\nNhiệm vụ cấp bách hơn bây giờ là phải đối xử với đứa trẻ này như thế nào. Bất kể Exakeides là ai, hay đã từng là người như thế nào, hiện tại cậu bé cần được chăm sóc."
 paragon.3105.a:1 "Chúng ta sẽ cho Exakeides một mái nhà."
 paragon.3105.b:0 "Chúng ta không có nghĩa vụ phải chăm sóc đứa trẻ này."
 paragon.3105.c: "Ăn thịt thằng nhãi này."

 LEGENDARY_LEADER_STUDY_RELIC_PROJECT:0 "Mảnh vỡ Di vật"
 LEGENDARY_LEADER_STUDY_RELIC_PROJECT_DESC:1 "Những mảnh vỡ được tìm thấy trong khoang đông lạnh của Exakeides là một di vật vượt xa hiểu biết khoa học hiện tại của chúng ta. Sẽ cần nhiều thời gian và tài nguyên để khám phá ra những bí mật ẩn chứa bên trong."
 paragon.3110.name:0 "Mảnh vỡ Di vật"
 paragon.3110.desc:0 "Nghiên cứu hiện tại về di vật vỡ nát bên cạnh Exakeides chỉ ra rằng nó đã từng va chạm với vật cản. Vì có quá nhiều bộ phận bị thất lạc, chúng ta chỉ có thể phỏng đoán về chức năng thực sự của nó. Tuy nhiên, dựa trên những chỉ số bất thường ghi lại được khi quan sát gần, chúng ta có cơ sở để kết luận rằng vật thể này có khả năng ảnh hưởng tới không thời gian."
 paragon.3114.name:0 "Sự trưởng thành của Exakeides"
 paragon.3114.desc:0 "§YExakeides§! luôn là một đứa trẻ rất trưởng thành trước tuổi, khi sinh nhật lần thứ mười đến, cậu đã bắt đầu học những kiến thức nâng cao. Cho đến nay, trọng tâm của chúng ta là khuyến khích trí tò mò vô tận của cậu bé, và cung cấp mọi công cụ cần thiết để cậu theo đuổi đam mê của mình. Trong những năm tới, cậu sẽ được hướng dẫn bởi những nhân tài ưu tú nhất mà chúng ta có.\n\nCậu bé có tiềm năng trở thành nhân vật hàng đầu trong lĩnh vực khoa học, điều đó đủ chứng minh rằng công sức của chúng ta sẽ được đền đáp. Vấn đề là, nên xây dựng nền tảng giáo dục cho cậu dựa trên điều gì?"
 paragon.3114.a:0 "Thúc giục cậu đón nhận những điều chưa biết." # Xenophile
 paragon.3114.b:0 "Cảnh báo cậu không được tin người lạ." # Xenophobe
 paragon.3114.c:0 "Dạy cậu biết trân trọng giá trị của sự sống." # Pacifist
 paragon.3114.d:0 "Cho cậu hiểu được sức mạnh của vũ lực." # Militarist
 paragon.3114.e:0 "Rèn luyện sự tôn trọng đối với quyền bình đẳng." # Egalitarian
 paragon.3114.f:0 "Dạy cậu học cách tuân lệnh." # Authoritarian
 paragon.3114.g:0 "Dẫn dắt đức tin của cậu." # Spiritualist
 paragon.3114.h:1 "Để cậu bám rễ vào thế giới vật chất thực tại." # Materialist

 paragon.3115.name:0 "Keides, Hậu duệ của Vagros"
 paragon.3115.desc:0 "Ở tuổi hai mươi, §YExakeides§! đã sẵn sàng gánh vác trách nhiệm của một người trưởng thành.\n\nTừ lúc được hồi sinh, cậu đã say sưa tiếp thu những lời dạy của chúng ta như một miếng bọt biển. Mặc dù đã sở hữu vô số kỹ năng và trí tuệ bao la, cậu vẫn giữ được sự khiêm tốn như thuở ban đầu.\n\nKhoa học luôn là lĩnh vực cậu đam mê nhất, thúc đẩy cậu tìm hiểu về quá khứ của mình, cũng như thiết bị vỡ vụn được tìm thấy cùng với cậu. Trong số các đồng nghiệp, tên cậu được gọi ngắn gọn là '§YKeides§!'."
 paragon.3115.a:1 "Đã đến lúc lên kế hoạch cho bước đi tiếp theo của cậu ấy."
 paragon.3115.a.custom_tooltip:0 "Sự kiện '§Y$paragon.3116.name$§!' sẽ xảy ra trong vòng §Y10 năm§!"
 paragon.3116.name:0 "$paragon.3115.name$"
 paragon.3116.desc:1 "Xin chào.\n\n§HKeides đứng ngẩng cao đầu, quan sát tình hình, đồng thời suy nghĩ xem mình nên phản ứng thế nào. Ánh mắt cậu dừng lại ở đôi bàn tay: đôi bàn tay ấy không hề tỏ ra căng thẳng, mà vững vàng như bàn thạch. Rõ ràng cậu đã chuẩn bị rất kỹ cho ngày hôm nay.§!\n\nTôi đã sẵn sàng."
 paragon.3116.a:1 "Xin chào, Keides."
 paragon.3116.a.response:1 "§HChàng thanh niên gật đầu và hít một hơi thật sâu.§!\n\nTôi luôn mơ về ngày này. Kể từ ngày đầu tiên tôi có thể nhớ, tôi đã luôn mong chờ ngày hôm nay.\n\nTôi đã sẵn sàng cống hiến sức lực của mình."
 paragon.3116.b:1 "Cậu sẽ có đủ thời gian để cống hiến. Nhưng trước hết, cậu đang tìm kiếm điều gì?"
 paragon.3116.b.response:1 "Những người khác đang tìm kiếm điều gì cơ chứ? Chẳng qua chỉ là hiểu về bản thân mình, hiểu vị trí của mình trong vũ trụ mà thôi.\n\nTôi tin rằng mấu chốt nằm ở di vật đó. Với sự giúp đỡ của các bạn, tôi có thể toàn tâm toàn ý khôi phục các phần còn lại của nó. Nhưng xin đừng hiểu lầm: đây không phải là một yêu cầu ích kỷ hay vì hư vinh. Tôi tin chắc rằng sức mạnh của vật thể này sẽ mang lại lợi ích cho nhân dân chúng ta.\n\n§HCậu dừng lại một chút.§!\n\nCác bạn đã cứu mạng tôi, tôi nợ các bạn. Nhưng tôi cần tìm kiếm câu trả lời, vì vậy tôi cần sự giúp đỡ của các bạn."
 paragon.3116.c:0 "Vậy sau khi tìm được câu trả lời thì sao? Sau đó thì thế nào?"
 paragon.3116.c.response:1 "§HKeides tự hào ngẩng cao đầu.§!\n\nĐây là một câu hỏi rất nặng ký, và tôi cũng có nhiều câu trả lời. Tóm lại, các bạn đã cho tôi một mái nhà. Bất kể hành trình này mang lại điều gì, bất kể tôi sẽ học được gì, tôi đều sẽ chia sẻ với các bạn. Về điểm này, tôi nói được làm được."

 paragon.3117.name:1 "Ảnh hưởng của Di vật"
 paragon.3117.desc:1 "Trong quá trình điều tra sơ bộ về di vật, §YKeides§! báo cáo về một trải nghiệm khác thường.\n\nSau khi tiếp xúc vật lý, tâm trí cậu xuất hiện những 'ảo ảnh'; những hình ảnh về con người và địa điểm, những ký ức bị chôn vùi từ quá khứ xa xăm. Mặc dù chưa hoàn toàn hiểu được ý nghĩa của chúng, nhưng một số hình ảnh miêu tả những địa điểm có thật.\n\nKeides yêu cầu khởi động một dự án đặc biệt để khám phá chúng."
 paragon.3117.a:1 "Thú vị đấy. Chúng ta sẽ tìm ra câu trả lời."

 paragon_legendary_leader_chain_title:0 "Ảo ảnh Di vật"
 paragon_legendary_leader_chain_desc:0 "Một yêu cầu chính thức từ §YKeides§!, hy vọng có thể xác minh xem những ảo ảnh của cậu có thật sự mang ý nghĩa hay không.\n\nNếu đồng ý, rất có thể sẽ khám phá được quá khứ của cậu và bí mật về di vật bí ẩn được tìm thấy cùng với cậu."
 planets_studied:0 "Khám phá Ảo ảnh"
 legendary_leader_system_1:0 "Địa hình Núi lửa"
 legendary_leader_system_1_desc:0 "Đá nóng chảy tỏa ra ánh sáng đỏ rực, bề mặt hành tinh này bị các hoạt động kiến tạo xé toạc.\n\nĐược cho là nằm trong hệ sao [event_target:1st_system_legendary.GetName]."
 legendary_leader_system_2:0 "Dã thú Hung hãn"
 legendary_leader_system_2_desc:0 "Một hành tinh rừng rậm bao phủ, những bóng râm ẩm ướt và những vòm lá xào xạc là nơi sinh sống của các loài thú săn mồi... và con mồi của chúng.\n\nĐược cho là nằm trong hệ sao [event_target:2nd_system_legendary.GetName]."
 legendary_leader_system_3:0 "Nghĩa địa Phi thuyền"
 legendary_leader_system_3_desc:0 "Đầy rẫy những hố bom, phó mặc cho gió lốc bào mòn. Bề mặt hoang lương của hành tinh này ngổn ngang những xác phi thuyền rơi.\n\nĐược cho là nằm trong hệ sao [event_target:3rd_system_legendary.GetName]."

 paragon.3120.name:1 "Ảo ảnh Thành hiện thực" # Volcanic
 paragon.3120.desc:1 "Không lâu sau khi tiến vào hệ sao [From.GetName], chúng ta đã nhanh chóng định vị được một hành tinh khớp với ảo ảnh của §YKeides§!. Trên bề mặt hành tinh này tuôn chảy những đại dương quặng nóng chảy."
 paragon.3120.a:0 "Chuẩn bị khám phá hành tinh."
 LEGENDARY_LEADER_VOLCANO_PLANET_PROJECT:0 "Khám phá Núi lửa"
 LEGENDARY_LEADER_VOLCANO_PLANET_PROJECT_DESC:1 "Khảo sát sơ bộ về hành tinh trong hệ sao $NAME_Vapob$ này đã xác nhận các cảnh tượng hiện lên trong ảo ảnh của §YKeides§!.\n\nMặc dù cấu trúc địa chất không ổn định, nhưng nơi đây vẫn còn một số vùng đất liền vững chãi bị cô lập. Việc thám hiểm vẫn có thể tiến hành.\n\n§RDự án đặc biệt này phải do đích thân §YKeides§! thực hiện.§!"
 paragon.3121.name:0 "Khám phá Núi lửa"
 paragon.3121.desc:1 "Giữa những đại dương dung nham cuồn cuộn sóng vỗ, §YKeides§! đã phát hiện tàn tích của một cơ sở xử lý khoáng sản. Cậu báo cáo có một ảo ảnh mới: một hành lang tối tăm, dẫn đến một căn phòng niêm phong. Dựa theo những hình ảnh này, Keides đã tìm thấy một chiếc hộp mục nát, cổ kính. Bên trong hộp là một mảnh vỡ, hoàn toàn không bị thời gian tàn phá.\n\nKeides báo cáo rằng, ngay khoảnh khắc chạm vào nó, những ảo ảnh khó hiểu mới ngay lập tức ập tới."
 paragon.3121.a:1 "Cậu ấy đã nhìn thấy gì?"
 paragon.3122.name:0 "Bóng hình Quá khứ" #vision
 paragon.3122.desc:1 "Bên cạnh §YKeides§! hiện lên quy trình cán ép của một lò luyện kim khổng lồ. Khoáng sản, nhà máy, phương tiện vận tải bao phủ khắp mặt đất, đội hình tàu sân bay che khuất cả bầu trời. Xuyên qua những tiếng ồn ào, còn có một lượng lớn cổng dịch chuyển, lúc sáng lúc tắt, có thể gấp gọn lại. Đột nhiên, một tiếng gầm lớn vang vọng giữa đất trời, đến mặt đất cũng bắt đầu rung chuyển. Từ xa vọng lại một tiếng thét đầy đau đớn.\n\nSau khi thoát khỏi ảo ảnh, Keides đặt mảnh vỡ mới tìm thấy cùng với mảnh vỡ hiện có. Một tiếng rít chói tai xé toạc không trung. Gần như ngay lúc đó, hai mảnh vỡ tự động dung hợp lại với nhau. Do đó ảnh hưởng của di vật này càng trở nên mạnh mẽ hơn."
 paragon.3122.a:0 "Một tiến triển kỳ diệu."

 paragon.3125.name:1 "Ảo ảnh Thành hiện thực" # Wildlife
 paragon.3125.desc:1 "Lần theo ảo ảnh của §YKeides§!, chúng ta đã đến một hành tinh nằm trong hệ sao [From.GetName]. Những khu rừng rậm rạp bao phủ 90% bề mặt."
 paragon.3125.a:0 "Chuẩn bị khám phá hành tinh."
 LEGENDARY_LEADER_HOSTILE_PLANET_PROJECT:0 "Khám phá Rừng rậm"
 LEGENDARY_LEADER_HOSTILE_PLANET_PROJECT_DESC:0 "Nếu hành tinh nằm trong hệ sao $NAME_Taprib$ này giống như những gì §YKeides§! nhìn thấy trong ảo ảnh, thì chúng ta phải cực kỳ cẩn trọng khi ở đây.\n\n§RDự án đặc biệt này phải do đích thân Keides nghiên cứu.§!"
 paragon.3126.name:0 "Trên vòm cây"
 paragon.3126.desc:1 "Khu rừng hoang dã chứa đầy cạm bẫy, việc điều hướng an toàn là cực kỳ khó khăn. Không dưới một lần §YKeides§! đã thoát chết trong gang tấc.\n\nMặc dù vậy, bị thu hút bởi một thế lực bí ẩn, cậu vẫn tiếp tục tiến lên, cuối cùng tìm thấy tàn tích mọc đầy cỏ dại của một công trình kiến trúc khổng lồ. Một cầu thang xập xệ dẫn lên một bệ đỡ cao vượt qua cả vòm cây. Nơi đó, trên một bệ kim loại đen, là một mảnh vỡ di vật khác.\n\nGần như ngay lập tức, §YKeides§! bị kéo vào những cảnh tượng ảo ảnh."
 paragon.3126.a:0 "Cậu ấy đã nhìn thấy gì?"
 paragon.3127.name:0 "Bóng hình Quá khứ" #vision
 paragon.3127.desc:1 "Cây cối tản ra, nhường chỗ cho một khung cảnh xanh tươi. Đây là một hành tinh xinh đẹp và ôn hòa, có những hàng rào thú nuôi rộng lớn bằng cả khu rừng, chứa đựng vô số loài sinh vật từ khắp nơi trong thiên hà.\n\nĐột nhiên, ảo ảnh kéo §YKeides§! vào một căn phòng bên trong một tòa nhà khổng lồ. Một bức tường vẽ bản đồ sao của vài hệ sao. Bốn hệ sao trong số đó rõ ràng khác biệt với phần còn lại, không có tuyến siêu không gian kết nối.\n\nTrở lại con tàu từ trong ảo ảnh, §YKeides§! đặt mảnh di vật mới nhất bên cạnh phần hiện có. Chúng phát ra tiếng ù ù, có thể nhìn thấy bằng mắt thường chúng đang hút lấy nhau, rồi hòa làm một. Hiệu lực của di vật dường như đã tăng cường."
 paragon.3127.a:0 "Tin tốt."

 paragon.3130.name:1 "Ảo ảnh Thành hiện thực" # Ship Graveyard
 paragon.3130.desc:1 "Giống như ảo ảnh của §YKeides§!, chúng ta đã quan sát thấy một nghĩa địa phi thuyền trên một hành tinh ở hệ sao $NAME_Ivusheh$."
 paragon.3130.a:1 "Chuẩn bị khám phá."
 LEGENDARY_LEADER_SHIP_PLANET_PROJECT:0 "Khám phá Nghĩa địa Phi thuyền"
 LEGENDARY_LEADER_SHIP_PLANET_PROJECT_DESC:1 "Chúng ta quan sát thấy một nghĩa địa phi thuyền trên một hành tinh ở hệ sao $NAME_Ivusheh$, cực kỳ giống với ảo ảnh của §YKeides§!.\n\n§RDự án đặc biệt này phải do đích thân §YKeides§! nghiên cứu.§!"
 paragon.3131.name:0 "Khám phá Nghĩa địa Phi thuyền"
 paragon.3131.desc:1 "Bề mặt vỡ nát của hành tinh ngổn ngang những phi thuyền tàn tạ. Ngay trung tâm của đống đổ nát lớn nhất, §YKeides§! phát hiện bộ khung chính của một căn cứ sao khổng lồ.\n\nSức mạnh không thể cưỡng lại đã đưa cậu đến hành tinh này lại xuất hiện, kéo §YKeides§! tiến về một căn phòng bên trong căn cứ. Trong một nhà kho phủ đầy bụi là một mảnh vỡ khác của di vật.\n\nNgay khoảnh khắc chạm vào mảnh vỡ mới tìm thấy, §YKeides§! bị kéo vào một ảo ảnh."
 paragon.3131.a:1 "Lần này cậu ấy đã thấy gì?"
 paragon.3132.name:0 "Bóng hình Quá khứ" #vision
 paragon.3132.desc:1 "Một căn cứ sao quay quanh hành tinh này. Từ xưởng đóng tàu của nó liên tục tuôn ra đội hình của các tàu thiết giáp hạm.\n\nTrên boong tàu chỉ huy, một vị tư lệnh hạm đội trẻ tuổi đang đứng, một tay nắm lấy một vật thể tương tự như di vật. Cùng với một cái vung tay của anh ta, không gian bên ngoài phi thuyền mờ đi, tối sầm lại, sau đó dần gấp khúc để lộ ra một hố đen. Khi vị tư lệnh hạm đội ra lệnh cho hạm đội tiến vào bóng tối, ảo ảnh đột ngột kết thúc.\n\n§YKeides§! mang theo mảnh vỡ trở lại tàu, đặt nó cạnh những mảnh vỡ hiện có. Tất cả chúng bắt đầu rung lên với tiếng ù chói tai. Sau đó, dưới tác động của một sức mạnh vô danh nào đó, cả hai dung hợp thành một khối. Sau sự việc này, hiệu lực của di vật dường như đã tăng cường."
 paragon.3132.a:0 "Tin tốt."

 paragon.3135.name:0 "Khôi phục Di vật"
 paragon.3135.desc:1 "Sau khi lấy được mảnh vỡ cuối cùng, di vật đã được phục hồi nguyên vẹn, như thể nó chưa từng bị vỡ vụn.\n\nVới việc di vật được khôi phục, việc nghiên cứu mục đích của nó trở nên cấp bách, và luôn trong trạng thái sẵn sàng. Một dự án đặc biệt do §YKeides§! trực tiếp phụ trách đã được chuẩn bị."
 paragon.3135.a:0 "Đây quả là một việc quan trọng."
 LEGENDARY_LEADER_OPEN_WORMHOLE_PROJECT:0 "Khôi phục Di vật"
 LEGENDARY_LEADER_OPEN_WORMHOLE_PROJECT_DESC:1 "Hàng loạt bí ẩn bủa vây quanh di vật mà §YKeides§! đã khôi phục, và đây là một nỗ lực để giải đáp những bí ẩn đó. Phải chăng đây là nguồn gốc tạo ra các ảo ảnh của cậu? Nếu vậy, thì di vật này còn sở hữu những khả năng nào nữa?"
 paragon.3140.name:0 "Nghiên cứu Di vật"
 paragon.3140.desc:1 "Cuộc nghiên cứu về di vật vừa được khôi phục gần đây đã mang lại một vài phát hiện đáng chú ý.\n\nNó thực sự có liên kết với §YKeides§!: khi tiếp xúc với bộ gen Vagros của cậu, các hạt bên trong di vật bắt đầu cộng hưởng với tần số cao. Mặc dù cơ chế đằng sau vẫn chưa được hiểu rõ, nhưng hiệu ứng này là đặc trưng của việc thao túng không thời gian.\n\nSau vài nỗ lực đo đạc và kiểm soát quá trình này, §YKeides§! lại trải qua một ảo ảnh nữa."
 paragon.3140.a:1 "Báo cáo!"
 paragon.3141.name:0 "Nêm"
 paragon.3141.desc:1 "§YKeides§! miêu tả một cảm giác như thể nhìn thấy di vật từ bên trong. Những hạt kích cỡ bằng cả vì sao xoay tròn quanh cậu. Giữa khoảng không tĩnh lặng, cậu cảm nhận được một sức mạnh trào dâng. Chỉ bằng đôi bàn tay, cậu có thể chỉ huy sự chuyển động của các khối cầu.\n\n§YKeides§! tỉnh lại từ ảo ảnh, đặt tay lên di vật. Bây giờ cậu đã hiểu được công dụng của nó, cũng như khả năng kinh ngạc của nó: nếu được điều khiển đúng cách, nó có thể làm sụp đổ hai điểm trong không gian, tạo ra một cặp lỗ giun ổn định. Người Vagros gọi thiết bị này là §YNêm§!.\n\nĐược khích lệ bởi khám phá của mình, §YKeides§! đã chủ động mở ra một lỗ giun ngay trong hệ sao mẹ của chúng ta. Ngay cả bản thân cậu cũng không biết con đường này dẫn tới đâu, nhưng cậu vẫn kiên định, tin rằng đó rất có thể là quê hương của đồng bào cậu."
 paragon.3141.a:0 "Hãy tìm hiểu thật nhanh xem sao."

 paragon.3144.name:0 "Phi thuyền Địch!"
 paragon.3144.desc:0 "Đầu bên kia lỗ giun được tạo ra bởi di vật là hệ sao $NAME_Sursect$. Không lâu sau khi tiến vào, cảm biến của chúng ta phát hiện một phi đội thiết bị không người lái mang thái độ thù địch. Bọn chúng có vẻ như đang bảo vệ hành tinh duy nhất của hệ sao này. Kết quả quét sơ bộ cho thấy, không có dấu hiệu sự sống nào trên những thiết bị không người lái đó, và trên hành tinh cũng vậy.\n\n§YKeides§! vô cùng chắc chắn rằng hành tinh đó chính là cội nguồn của dân tộc cậu. Không còn nghi ngờ gì nữa, câu trả lời nằm ở nơi đó.\n\nSau đó, bầy thiết bị không người lái đã gửi yêu cầu liên lạc cho chúng ta."
 paragon.3144.a:0 "Mở kênh liên lạc."
 paragon.3145.name:0 "..--- ..... ----. .---- .---- --... ---.. ...-- "
 paragon.3145.desc:1 "§HKhi kênh được mở, tiếng ồn tĩnh điện chói tai hòa lẫn với giọng nói giả lập của rô bốt vang lên. Trong một chu kỳ, mỗi âm thanh đều xếp chồng lên âm thanh tiếp theo, âm lượng của thông điệp dao động theo những làn sóng bất quy tắc.§!\n\nĐộng cơ: Thu hồi Nêm, vi phạm hiến chương.\nNêm của Vagros, trạng thái: Chưa thu hồi.\nHiến chương Đế chế Vagros Điều 412, trạng thái: Vi phạm.\n\nHành vi Mục tiêu: Hoàn trả Nêm.\nPhương thức Đối phó: Tiêu diệt mục tiêu."
 paragon.3145.a:0 "Di vật là của chúng ta. Tìm cách khác đi."
 paragon.3145.b:1 "Giao Nêm cho chúng. Sự an toàn của chúng ta là trên hết."
 paragon.3146.name:0 "..--- ....- ----. ....- ..--- ..... ...-- ..... "
 paragon.3146.desc:1 "§HGiọng nói tổng hợp kẽo kẹt chậm dần, tạm dừng một lát, rồi tiếp tục nói ra vài câu cuối cùng.§!\n\nNêm của Vagros, trạng thái: Thu hồi khẩn cấp.\nHiến chương Đế chế Vagros Điều 412, trạng thái: Tạm thời bỏ qua.\n\nHành vi: Chờ lệnh."
 paragon.3146.a:1 "Nghe có vẻ đáng tin đấy."

 paragon.3147.name:0 "Mất đi Di vật"
 paragon.3147.desc:1 "Sau khi giao Nêm cho hạm đội đó, bầy thiết bị không người lái lập tức rời đi qua một lỗ giun của riêng chúng.\n\nNgay sau đó, lỗ giun đóng lại sau lưng chúng. Bây giờ chúng ta có thể tự do khám phá hệ sao này và các hành tinh bên trong nó."
 paragon.3147.a:1 "Chúng ta đã lựa chọn đúng đắn."

 LEGENDARY_LEADER_SABOTAGE_FLEET_PROJECT:0 "Nhiễu Điện từ"
 LEGENDARY_LEADER_SABOTAGE_FLEET_PROJECT_DESC:1 "Một dự án đặc biệt do §YKeides§! khởi xướng, nhằm vô hiệu hóa sự canh gác của các thiết bị không người lái trong hệ sao $NAME_Sursect$.\n\nCậu định dùng trường điện từ để phá hủy nguồn năng lượng của chúng. Nếu thành công, chúng ta có thể tiến đến hành tinh của hệ sao này."
 paragon.3148.name:0 "Nhiễu Điện từ Thành công"
 paragon.3148.desc:1 "Chúng ta đã phát ra một xung điện từ, thiêu rụi toàn bộ mạch điện của đám thiết bị không người lái này.\n\nBây giờ chúng ta có thể tự do khám phá hệ sao $NAME_Sursect$ và hành tinh bên trong nó."
 paragon.3148.a:1 "Nhiệm vụ hoàn thành."

 paragon.3149.name:0 "Tiêu diệt Thiết bị không người lái"
 paragon.3149.desc:1 "Dù bầy thiết bị không người lái đã bị đánh bại, nhưng những kẻ chế tạo ra chúng cũng đã lưu lại một nước cờ, khiến những kẻ tiêu diệt chúng chẳng thu lợi được gì. Các thiết bị không người lái đã kích hoạt chương trình tự hủy để đáp trả cuộc tấn công của chúng ta. Những gì còn sót lại rất khó để trục vớt.\n\nTuy nhiên, bây giờ chúng ta có thể tự do khám phá hệ sao $NAME_Sursect$ và hành tinh bên trong nó."
 paragon.3149.a:1 "Điều này vẫn có thể coi là một thắng lợi."

 paragon_legendary_leader_homeworld:0 "Tàn tích Người Vagros"
 paragon_legendary_leader_homeworld_desc:1 "Thứ mà các thiết bị không người lái đó bảo vệ là một hành tinh bị khóa thủy triều, một mặt hướng về bóng tối và cái lạnh cắt da của trời đêm, mặt kia đắm mình trong ánh sáng vĩnh hằng. Trên bán cầu ban ngày ấm áp, chúng ta phát hiện tàn tích của một thành phố có lẽ từng thuộc về người Vagros.\n\n§YKeides§! tin rằng, chi tiết về quá khứ của cậu có thể được chôn giấu sâu dưới nơi đây, và hy vọng những khám phá tại đây sẽ làm sáng tỏ lịch sử của hành tinh này.\n\n§RKhu di chỉ này phải do đích thân §YKeides§! khai quật.§!"
 paragon.3150.name:0 "Trung tâm Hành chính?"
 paragon.3150.desc:0 "Hành tinh này chắc chắn đã đóng vai trò vô cùng quan trọng trong xã hội Vagros. Trong giai đoạn đầu khai quật, rất rõ ràng, phần lớn cơ sở hạ tầng đều xoay quanh công việc hành chính, thành phố này có thể từng là một trung tâm liên lạc. Ở đây còn có rất nhiều địa điểm hội họp của giới lãnh đạo, và đã phát hiện ra vài quảng trường công cộng có quy mô cực lớn."
 paragon.3150.a:0 "Rất tốt."
 paragon.3151.name:0 "Hầm chứa"
 paragon.3151.desc:1 "Vì may mắn phát hiện ra một hầm chứa ngầm, §YKeides§! đã phấn khích đến mức không ngủ được suốt mấy ngày. Cậu chắc chắn rằng nơi này ẩn giấu bí mật về thân thế của mình.\n\nSâu dưới hầm chứa, cậu phát hiện hàng này nối tiếp hàng khác các khoang đông lạnh, nhưng bên trong đều trống rỗng. Mạch điện tích hợp trên sàn nhà kết nối với một cấu trúc lớn hơn: ở trung tâm mái vòm có một bệ đỡ trông như một chiếc ngai vàng."
 paragon.3151.a:0 "Thật thú vị. Cái này dùng để làm gì?"
 paragon.3152.name:0 "Ép buộc Ảo ảnh"
 paragon.3152.desc:0 "Bất chấp sự phản đối của nhóm nghiên cứu khoa học, §YKeides§! vẫn kiên quyết ngồi lên cỗ máy giống như ngai vàng đó.\n\nCậu vừa ngồi xuống thì lập tức mất đi ý thức.\n\nMặc dù biểu cảm của cậu trở nên thư giãn, nhưng cơ thể lại phải chịu đựng những cơn co giật dữ dội. Nhóm nghiên cứu khoa học dù cố gắng thế nào cũng không thể gỡ cậu ra khỏi ngai vàng. Vài giờ trôi qua. Cuối cùng, ngay khi cơ thể trẻ trung của cậu dường như không thể chịu đựng thêm được nữa, Keides đã tỉnh lại. Báo cáo của cậu chuẩn bị được công bố."
 paragon.3152.a:0 "Thật là liều lĩnh y như trước đây."
 paragon.3153.name:0 "Báo cáo Ảo ảnh Phần 1"
 paragon.3153.desc:0 "§YKeides§! nhìn thấy một quảng trường. Trên quảng trường có hàng trăm hàng ngàn người.\n\nMọi người ngước nhìn bầu trời, quan sát một phi thuyền khổng lồ từ từ hạ xuống từ ngoài bầu khí quyển. Đúng lúc này, một giọng nói vang lên:\n\n'Lắng nghe đây' nó nói, 'Ngày phán xét sắp đến rồi. Nêm sẽ bị tước đoạt. Các người phải ở lại nơi này, cho đến khi vạn vật đi đến hồi kết.'\n\nTiếng khóc than của người dân vang vọng đến đinh tai nhức óc. Trong ảo ảnh của mình, Keides nhận ra hành tinh của cậu đã bị ruồng bỏ. Chủ nhân của họ, một giống loài ngoại lai sở hữu sức mạnh không thể tưởng tượng, phát hiện dân tộc của cậu thiếu đi tiềm năng. Nêm (và lỗ giun do nó tạo ra) là con đường duy nhất kết nối hành tinh của cậu với dải ngân hà rộng lớn. Một khi bị cắt đứt giao thương với ngân hà, nền tảng thịnh vượng của nhân dân cậu sẽ vĩnh viễn mất đi không thể cứu vãn."
 paragon.3153.a:0 "Thật là một sự trừng phạt nghiệt ngã."
 paragon.3154.name:0 "Báo cáo Ảo ảnh Phần 2"
 paragon.3154.desc:1 "Như một sự thương xót, người Vagros được ân hạn trong một tháng để giao nộp tất cả Nêm và các vật liệu liên quan. Thực ra, điều này giống như một sự sỉ nhục hơn là thương xót, bởi vì chút thời gian đó hoàn toàn không đủ để họ tự cứu lấy mình. Là một hành tinh hành chính, không có cách nào để duy trì dân số khổng lồ của nó. Kết quả tốt nhất mà họ có thể mong đợi là chia khẩu phần lượng thức ăn họ có, để có thể kéo dài thời gian trước khi chết đói. Những kẻ làm chủ bên ngoài của họ đương nhiên hiểu rất rõ điều này.\n\nTuy nhiên, ngay cả trong tuyệt vọng, nhà lãnh đạo của hành tinh này cũng đã nghĩ ra một kế hoạch. Những kết quả thử nghiệm gần đây về bảo quản đông lạnh cao cấp và hệ gen học đã mang đến cho họ một cơ hội dù không chắc chắn thành công."
 paragon.3154.a:0 "Họ đã không chết trong câm lặng. Thật đáng nể phục."
 paragon.3155.name:0 "Sự kết thúc của Ảo ảnh"
 paragon.3155.desc:0 "Khi kế hoạch sinh tồn của người Vagros được thực thi, mầm mống tương lai của họ, 'Hậu duệ' §YKeides§!, được phóng ra không gian cùng với mảnh vỡ chiếc Nêm cuối cùng của họ, nó đã được tách thành bốn phần, phân tán khắp các hệ sao để tránh bị phát hiện. Keides sinh ra không có cha mẹ, mà là sản phẩm của kỹ thuật di truyền. ADN của cậu chứa đựng ký ức về đồng bào của cậu. Khi trưởng thành, chỉ cần tiếp xúc với Nêm, cậu có thể truy cập những ký ức này thông qua ảo ảnh.\n\nNgoài kế hoạch này, nhà lãnh đạo của hành tinh còn ra lệnh xây dựng hàng ngàn khoang đông lạnh và không gian ngầm khổng lồ để chứa chúng. Ở đó, những người Vagros thông minh nhất có thể ngủ đông mãi mãi, chờ đợi sự trở lại của 'Hậu duệ'. Và họ thực sự đã làm như vậy, cho đến khi sự bảo quản đông lạnh cũng không thể tiếp tục chống đỡ cho cơ thể của họ. Tâm trí của họ đã hóa thành dữ liệu, nằm bên trong ngai vàng chờ đợi Hậu duệ quay về."
 paragon.3155.a:0 "Một cái kết bi thảm."
 paragon.3156.name:0 "Hoàn tất Khai quật"
 paragon.3156.desc:0 "Để sự hy sinh của họ không trở nên uổng phí, §YKeides§! lại một lần nữa ngồi lên Ngai vàng Hậu duệ. Kết quả là lần này mọi việc diễn ra rất nhanh và không hề dữ dội chút nào. Ký ức của đồng bào cứ êm đềm như dòng suối chảy vào tâm trí cậu.\n\nVới kiến thức và ký ức của tổ tiên, công việc khai quật đã nhanh chóng kết thúc. Hành động tiếp theo của Keides là xử lý tất cả dữ liệu thu thập được, sau đó viết báo cáo."
 paragon.3156.a:0 "Rất tốt. Chúng ta mong chờ báo cáo của cậu."

 paragon.3160.name:0 "Báo cáo Khai quật Người Vagros"
 paragon.3160.desc:0 "§HKeides buông thõng bờ vai, mất đi sự năng động thường ngày. Những sự kiện gần đây dường như khiến cậu vô cùng mệt mỏi. Dù vậy, trên môi cậu vẫn đọng lại một nụ cười nhẹ nhõm.§!\n\nTôi đã có được câu trả lời. Có cả tốt lẫn xấu, nhưng tôi rất vui vì đã tìm thấy chúng."
 paragon.3160.a:0 "Cậu đã không làm mất mặt tổ tiên."
 paragon.3160.a.response:0 "Tôi chỉ có thể cố gắng hết sức để không phụ kỳ vọng của họ. Trách nhiệm này thực sự quá đỗi nặng nề, nhưng tôi rất sẵn lòng gánh vác."
 paragon.3160.b:0 "Nêm sao rồi?"
 paragon.3160.b.response:0 "À. Nó đã được sửa chữa hoàn toàn và có thể hoạt động. Các nhà vật lý của chúng ta hẳn sẽ tiếp tục nghiên cứu và hưởng lợi từ nó.\n\n§HKeides chợt cụp mắt xuống trong chốc lát.§!\n\nNhưng đáng tiếc là nó đã mất đi sức mạnh hoàn chỉnh. Để mở một lỗ giun ổn định, cần phải có một hệ sao mục tiêu ở đầu bên kia. Hành tinh của tổ tiên tôi từng có một thứ như vậy, nhưng không may là chúng ta chưa có cách nào sao chép lại một cái khác."
 paragon.3160.c:0 "Vậy bây giờ thì sao? Cậu định làm gì?"
 paragon.3160.c.response:0 "Tôi nguyện dốc sức vì các bạn.\n\nMặc dù đến nay khoa học vẫn là điều tôi đam mê nhất. Nhưng nếu có một điều gì đó đã thay đổi, thì chính ký ức của tổ tiên đã khơi dậy khát vọng khám phá trong tôi. Dải ngân hà chứa đầy những kỳ quan, trăm nghe không bằng một thấy. Chuyện tương lai chẳng ai nói trước được. Có một ngày, tôi nguyện được nhìn thấy quê hương của đồng bào tôi được xây dựng lại từ tàn tích ngày hôm nay.\n\nNhưng hiện tại, tất cả những gì tôi học được đều nhờ có các bạn. Tôi hy vọng sẽ dùng những thứ này để mang lại lợi ích cho dân tộc mình. Xin hỏi, nơi nào đang cần tôi nhất?"
 paragon.3160.d:0 "Hãy để khoa học tiếp tục là ngọn lửa trong tim cậu."
 paragon.3160.d.custom_tooltip:0 "§YKeides§! vẫn là một Quan chức Khoa học."
 paragon.3160.e: "Quân đội của chúng ta cần trí tuệ của cậu."
 paragon.3160.e.custom_tooltip: "§YKeides§! trở thành một Chỉ huy"
 paragon.3160.f:0 "Nhân dân của chúng ta cần sự quản lý của cậu."
 paragon.3160.f.custom_tooltip:0 "§YKeides§! trở thành một Quan chức Hành chính"
 paragon.3160.g:0 "Quân đội đang khao khát nhân tài."
 paragon.3160.g.custom_tooltip:0 "§YKeides§! trở thành một Chỉ huy"
 paragon.3160.new_focus:0 "§HKeides chào theo đúng nghi thức.§!\n\nTuyệt quá. Sẽ không làm bạn thất vọng đâu."

 relic_cant_activate:0 "§RDi vật này không hoàn chỉnh, không thể được kích hoạt.§!"
 r_wormhole_key_fragment_1:0 "Mảnh vỡ Di vật (1/4)"
 r_wormhole_key_fragment_1_desc:0 "Tìm thấy trong khoang đông lạnh của Exakeides, chúng ta không biết gì về di vật này."
 r_wormhole_key_fragment_2:0 "Mảnh vỡ Di vật (2/4)"
 r_wormhole_key_fragment_2_desc:0 "Chúng ta biết rất ít về những mảnh vỡ di vật này, cả cấu tạo lẫn công dụng của chúng đều chưa rõ."
 r_wormhole_key_fragment_3:0 "Mảnh vỡ Di vật (3/4)"
 r_wormhole_key_fragment_3_desc:0 "$r_wormhole_key_fragment_2_desc$"
 r_wormhole_key_fragment_4:0 "Khôi phục Di vật"
 r_wormhole_key_fragment_4_desc:0 "Khe hở giữa các mảnh vỡ đã biến mất, di vật này đã phục hồi lại trạng thái hoàn chỉnh. Nhưng cấu trúc và cơ chế của nó vẫn chưa được xác định."
 paragon_relic_wormhole_key:0 "$r_wormhole_key$"
 r_wormhole_key:0 "Nêm"
 r_wormhole_key_desc:0 "Là minh chứng cho di sản Vagros của Exakeides, di vật này có khả năng làm gấp khúc hai điểm trong không gian, cho phép dịch chuyển không gian gần như tức thời."
 wormhole_key_relic_effect:0 "§GCho phép toàn bộ phi thuyền nhảy xuyên không, bỏ qua các tuyến siêu không gian§!\n$MOD_SHIP_JUMPDRIVE_COOLDOWN_MULT$: §G-50%§!\n$MOD_SHIP_DISENGAGE_CHANCE_MULT$: §G+75%§!"

