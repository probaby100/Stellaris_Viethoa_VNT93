 ### Paragon

 PARAGON_TITLE: "Galactic Paragons" # Do not translate
 DLC_PARAGON_RECOMMENDATION_DESC:1 "§SGalactic Paragons§! là bản mở rộng tập trung vào các nhà lãnh đạo, Hội đồng quản lý đế chế của bạn, cùng các nghị trình định hình mục tiêu của bạn trên vũ đài thiên hà."
 DLC_PARAGON_RECOMMENDATION_REC:1 "Chúng tôi đề xuất §SGalactic Paragons§!, vì một số tùy chọn bạn đã chọn phù hợp với chủ đề của nó."

 SECTOR_EDIT_VIEW:0 "Trình chỉnh sửa Phân khu"
