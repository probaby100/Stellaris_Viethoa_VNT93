# Azaryn chain
 paragon.202.name:0 ""
 paragon.202.desc:0 "§HCó người đang cố gắng thiết lập liên lạc với chúng ta.§!\n\n§HChúng ta nghe thấy tiếng nước chảy róc rách từ xa, tiếng kêu quàng quạc của những loài chim nhỏ vỗ cánh bay đi. Thông điệp này dường như xuất phát từ một quần xã sinh vật vô cùng tươi tốt.§!"
 paragon.202.a:0 "Xin chào?"
 paragon.202.a.response:0 "§HKhông nghe thấy lời hồi đáp.§!"
 paragon.202.b:0 "Ngắt liên lạc."

 paragon.204.name:0 ""
 paragon.204.desc:0 "§HLại có người cố gắng liên lạc với chúng ta.§!\n\n§HMột lần nữa chúng ta lại nghe thấy những âm thanh quen thuộc của quần xã sinh vật kia. Nhưng vẫn chẳng có ai xuất hiện.§!"
 paragon.204.a:0 "Truy dấu nguồn phát của tín hiệu."
 paragon.204.b:0 "Đúng là phí thời gian."

 UNKNOWN_COMMS_PROJECT:0 "Truy tìm nguồn gốc"
 UNKNOWN_COMMS_PROJECT_DESC:0 "Chúng ta hẳn sẽ lần ra được nguồn gốc của tín hiệu liên lạc kỳ lạ này."

 paragon.206.name:0 "Nguồn gốc Liên lạc"
 paragon.206.desc:0 "Chúng ta đã định vị được nguồn gốc của cuộc liên lạc bí ẩn này. Bằng cách truy dấu tín hiệu qua nhiều tọa độ khác nhau, chúng ta xác định rằng cuộc gọi đến từ một vật thể đang di chuyển. Giả thuyết của chúng ta cho rằng chúng ta đã giao tiếp với một phi thuyền, một phi thuyền có lẽ được dùng như khu bảo tồn thiên nhiên hay thứ gì đó tương tự."
 paragon.206.a:0 "Thiết lập liên lạc."

 paragon.208.name:0 "$paragon.206.name$"
 paragon.208.desc:0 "§HChúng ta thiết lập kết nối, và lại một lần nữa nghe thấy âm thanh quen thuộc của quần xã sinh vật đó. Tuy nhiên, lần này chúng ta nghe thấy giọng nói của một người,§!\n\nChân thành chào hỏi các bạn, [owner.GetAdjective]! Tôi rất mong chờ ở các bạn. Xin thứ lỗi cho sự mạo muội của tôi, nhưng tôi phải biết các bạn tò mò đến mức nào. Bây giờ cho tôi hỏi một câu. Các bạn nhìn nhận sự sống như thế nào?"
 paragon.208.a:0 "Cô là ai?"
 paragon.208.a.response:0 "A. Tốt nhất là không nên phá vỡ không khí chào hỏi, phải không? Được rồi, để tôi tự giới thiệu trước.\n\n§HTrên khuôn mặt của sinh vật thuộc loài thực vật này nở rộ một nụ cười rạng rỡ như đóa hoa.§!\n\nTôi tên là §YAzaryn§!. Nhưng trước khi các bạn trả lời câu hỏi của tôi, tôi sẽ không nói thêm điều gì nữa. Hãy nói cho tôi biết, các bạn cho rằng sự sống có giá trị gì?"
 paragon.208.b:0 "Còn tùy thuộc vào tình huống. Suy cho cùng, sự sống tồn tại dưới rất nhiều dạng khác nhau."
 paragon.208.c:0 "Đây là câu đố mẹo gì đó à?"
 paragon.208.d:0 "Xin vui lòng tự giải thích."
 paragon.208.d.response:0 "Tôi hiểu việc các bạn không muốn trả lời. Nhưng các bạn phải hiểu rằng, nếu tôi có thể nói cho các bạn biết nhiều hơn, tôi chắc chắn sẽ nói. Nhưng tôi không thể mạo hiểm làm ô nhiễm dữ liệu. Một lần nữa xin hỏi, các bạn nhìn nhận sự sống như thế nào?"
 paragon.208.e:0 "Ngắt liên lạc."

 paragon.210.name:0 "$paragon.206.name$"
 paragon.210.desc:0 "Một câu trả lời khá hợp lý. Gần như tất cả mọi người đều sẽ không chút do dự mà loại bỏ đi những thứ có thể đe dọa đến tính mạng của mình. Nhưng chúng ta phải nhớ rằng, mọi sự sống đều mang trong mình tiềm năng vô hạn.\n\nBây giờ, tôi xin giải thích lý do tôi liên lạc với các bạn."
 paragon.210.desc_alt:0 "§HSinh vật thực vật này thở dài.§!\n\nCuối cùng cũng gặp được một dân tộc mà trong đầu không chỉ có mỗi sự chinh phạt. Tôi cũng có cùng quan điểm, mọi sự sống đều mang trong mình tiềm năng vô hạn.\n\nBây giờ, cho phép tôi giải thích lý do tôi liên lạc với các bạn."
 paragon.210.a:0 "Mời cô nói tiếp."

 paragon.212.name:0 "$paragon.206.name$"
 paragon.212.desc:0 "$paragon.212.desc_with_intro$ $paragon.212.desc_main_chunk$"
 paragon.212.desc_alt:0 "$paragon.212.desc_without_intro$ $paragon.212.desc_main_chunk$"
 paragon.212.desc_with_intro:1 "Tôi tên là §YAzaryn§!, một cựu nhà sinh vật học không gian đến từ Azaria"
 paragon.212.desc_without_intro:0 "Tôi là một cựu nhà sinh vật học không gian đến từ Azaria,"
 paragon.212.desc_main_chunk:0 "Sau này tôi trở thành một học giả sáng tạo không gian. Tôi luôn tìm kiếm các vật liệu có thể dùng để tạo ra sự sống mới. Sáng tạo không gian đòi hỏi nguồn năng lượng vượt xa những gì bản thân tôi có thể tạo ra.\n\n§HAzaryn khựng lại một lát, rồi tiếp tục§!\n\nTin tôi đi, điều này hoàn toàn xứng đáng. Nhưng khởi đầu có chút khó khăn. Trước tiên, tôi muốn gửi tặng các bạn một món quà, xem các bạn có thể trung hòa được nó không."
 paragon.212.a:0 "Azaria là gì?"
 paragon.212.a.response:0 "Azaria là quê hương của tôi. Nơi đó từng là một hành tinh Gaia, là thủ đô 'Rừng Cây Tinh Tú' của đế chế chúng tôi, đồng thời cũng là mái nhà chung của vô số giống loài khác nhau. Đáng tiếc là, tất cả họ đều không còn tồn tại nữa.\n\n§HÁnh mắt của Azaryn bỗng trở nên xa xăm.§!\n\nVào thời kỳ hưng thịnh nhất, hành tinh của chúng tôi đẹp đến nghẹt thở, tràn ngập sự sống và vẻ đẹp của thiên nhiên. Tôi thiết nghĩ, sự đa dạng sinh học đó là vô tiền khoáng hậu. Nhưng rồi cuối cùng nó vẫn sụp đổ.\n\nBây giờ, xin hãy cẩn trọng với món quà của tôi."
 paragon.212.b:0 "Sáng tạo không gian là gì?"
 paragon.212.b.response:0 "Hỏi rất hay. $paragon_astrocreation_is$\n\nRất thú vị phải không? Món quà tôi tặng các bạn chính là bước tiến đầu tiên hướng tới mục tiêu đó."
 paragon.212.c:0 "Kể tôi nghe về con tàu của cô đi."
 paragon.212.c.response:0 "À đúng rồi, đối với những người chưa quen thì nó có vẻ quá đỗi kỳ dị. Đúng vậy, đây chính là bên trong phi thuyền của tôi.\n\n§HAzaryn làm động tác tay chỉ xung quanh.§!\n\nĐây là 'Vùng đất Sống'. Nó là một Tàu Mái vòm, bên trong chứa một hệ sinh thái được tích hợp đầy đủ chức năng. Tôi thừa nhận rằng mình rất tự hào về điều này.\n\nMón quà gửi tặng các bạn cũng được nuôi trồng tại đây."
 paragon.212.d:0 "Để lần sau nói tiếp đi."

 AZARYNS_BACTERIA_PROJECT:0 "Món quà của Azaryn"
 AZARYNS_BACTERIA_PROJECT_DESC:0 "Cái gọi là món quà mà chúng ta nhận được từ Azaryn thực chất là một loại vi khuẩn thực vật, và nó không giống với bất kỳ loại vi khuẩn nào chúng ta từng thấy. Việc trung hòa nó sẽ là một thử thách đầy rủi ro. Tuy nhiên, nếu thành công, nó sẽ giúp làm sâu sắc thêm hiểu biết của chúng ta về khoa học và y học."

 paragon.214.name:0 "Chủng nấm của Azaryn"
 paragon.214.desc:0 "Chúng ta đã đạt được những tiến triển nhất định với 'món quà' hữu cơ của Azaryn. Tiềm năng ngày càng tăng của sự tiến bộ khoa học liên ngành thật đáng khích lệ.\n\nChúng ta đã tổng hợp lại những phát hiện từ trước đến nay, loại bỏ mọi mối đe dọa tiềm ẩn từ vi sinh vật này, và sẵn sàng liên lạc lại với Azaryn."
 paragon.214.a:0 "Tiếp tục. Mở kênh liên lạc."

 paragon.216.name:0 "$NAME_Astrocreator_Azaryn$"
 paragon.216.desc:0 "§HAzaryn vô cùng vui mừng khi nghe được những tiến triển của chúng ta.§!\n\nTuyệt vời! Tôi vô cùng biết ơn và xin nhiệt liệt hoan nghênh những nỗ lực của các bạn. Vậy thì, [owner.GetName], tôi lại có một câu hỏi khác.\n\nCác bạn có sẵn sàng cướp đi sinh mạng của người khác để trốn tránh cái chết không?"
 paragon.216.a:0 "Có, chúng tôi sẽ làm thế."
 paragon.216.b:0 "Không, chúng tôi sẽ không làm vậy."

 paragon.218.name:0 "$paragon.201.name$"
 paragon.218.desc_yes:0 "Quả thật, hầu hết mọi người sẽ chọn như vậy. Suy cho cùng, sinh tồn là động lực của muôn loài sinh vật. Việc hiểu và chấp nhận thực tế này có thể sẽ có ngày cứu sống các bạn, và cả lương tâm của các bạn nữa.\n\n$paragon.218.desc_flower$"
 paragon.218.desc_no:0 "Thật sao, các bạn thực sự sẽ không làm vậy sao?\n\n§HAzaryn gãi đầu.§!\n\nTôi cảm thấy điều này hơi thất vọng một chút, và cũng khó mà tin được. Dù ở một mức độ nào đó, tôi cho rằng nó đáng ngưỡng mộ. Giá như đó là sự thật thì tốt biết mấy.\n\n$paragon.218.desc_flower$"
 paragon.218.desc_flower:0 "Trước khi đưa ra yêu cầu tiếp theo, tôi còn một món quà nữa muốn tặng cho các bạn. Đây là Hoa khổng lồ Azaria, một loài hoa bản địa trong hệ sinh thái trên tàu của tôi. Thử thách tôi dành cho các bạn là làm cho nó nở hoa. Tạm biệt nhé."
 paragon.218.a:0 "Được rồi. Tạm biệt."

 AZARYNS_RAFFLESIA_PROJECT:0 "Hoa khổng lồ của Azaryn"
 AZARYNS_RAFFLESIA_PROJECT_DESC:0 "Azaryn giao cho chúng ta một nhiệm vụ, bảo chúng ta cố gắng làm nở một nụ hoa khổng lồ bản địa trên hệ sinh thái phi thuyền của cô ấy. Dựa trên những quan sát ban đầu, bông hoa này có thể mang ý nghĩa cực kỳ quan trọng đối với sinh học không gian."

 paragon.220.name:0 "Hoa khổng lồ của Azaryn"
 paragon.220.desc:0 "Ban đầu chúng ta cố gắng kích thích nụ hoa phản ứng, nhưng không mấy hiệu quả. Bông hoa này chỉ chịu nở khi dùng xung điện kích thích vượt ngưỡng thông số an toàn thông thường. Chúng ta đã hoàn thành nhiệm vụ mới nhất của Azaryn, và chuẩn bị liên lạc lại với cô ấy."
 paragon.220.a:0 "Làm tốt lắm. Liên lạc với Azaryn thôi."

 paragon.222.name:0 "$NAME_Astrocreator_Azaryn$"
 paragon.222.desc:1 "§HMột chiếc drone thụ phấn nhỏ xíu bay vo ve quanh đầu Azaryn. Cô ấy dịu dàng xua nó đi.§!\n\nXin chào một lần nữa. Hoa khổng lồ Azaria quả là một loài thực vật thú vị, các bạn cũng đồng ý chứ? Sự tiến hóa thật là một điều kỳ diệu. Tôi rất ấn tượng với việc các bạn có thể truyền vào nó một lượng năng lượng phù hợp để nó nở hoa.\n\n§HCô ấy hào hứng vỗ tay.§!\n\nLại đến giờ đặt câu hỏi rồi. Dưới tiền đề mọi thứ đều ở quy mô rất lớn, các bạn có sẵn sàng hy sinh đồng bào của mình để cứu vớt những sinh mạng khác không?"
 paragon.222.a:0 "Chúng tôi sẽ làm thế."
 paragon.222.b:0 "Không, điều đó là không thể."

 paragon.224.name:0 "$paragon.201.name$"
 paragon.224.desc_yes:0 "§HAzaryn gật đầu đầy vẻ thấu hiểu.§!\n\nĐúng vậy, có lẽ câu trả lời đã quá rõ ràng, nhưng trong tình huống đó, có thể sẽ rất khó để nhìn ra câu trả lời đúng. Chúng ta phải gạt đi cảm xúc cá nhân, đưa ra những quyết định vì lợi ích toàn cục.\n\n$paragon.224.desc_question$"
 paragon.224.desc_no:0 "§HAzaryn gật đầu đồng cảm.§!\n\nThực sự là điều này không hề dễ dàng. Tôi đánh giá cao sự trung thực của các bạn.\n\nTuy nhiên tôi tin rằng, vì đại cục, các dạng sống thông minh phải ưu tiên hơn cho những lựa chọn vị tha.\n\n$paragon.224.desc_question$"
 paragon.224.desc_question:0 "Tôi sẽ hỏi các bạn một câu hỏi cuối cùng.\n\nCác bạn có chút do dự nào khi tiêu diệt một mối đe dọa không?"
 paragon.224.a:0 "Có. Những hành động mang tính quyết định thực sự cần phải đắn đo suy nghĩ."
 paragon.224.b:0 "Không. Do dự là chết."

 paragon.226.name:0 "$paragon.201.name$"
 paragon.226.desc_yes:0 "Tôi đồng ý. Sự quyết đoán rất quan trọng, nhưng có những tình huống cần phải cân nhắc kỹ lưỡng. Đôi khi bạn không phải lúc nào cũng may mắn đến mức ngay lập tức nắm được mọi thông tin cần thiết. Sự kiên nhẫn sẽ mang lại nhiều lợi ích cho bạn.\n\n$paragon.226.desc_end$"
 paragon.226.desc_no:0 "Các bạn thích có thời gian để suy nghĩ. Đáng tiếc thay, có thời gian để suy nghĩ lại là một đặc quyền. Quyết định chắc chắn phải được đưa ra, và một khoảnh khắc suy nghĩ cẩn trọng có thể tạo ra ranh giới giữa thành công và thất bại.\n\n$paragon.226.desc_end$"
 paragon.226.desc_end:0 "§HAzaryn im lặng một khoảnh khắc, rồi đưa ra kết luận:§!\n\nRất tốt, tôi đã hỏi các bạn đủ nhiều rồi. Các bạn đã dành cho tôi rất nhiều sự kiên nhẫn. Tôi sẽ mất chút thời gian để thu thập những thông tin này. Chúng ta sẽ sớm trò chuyện lại thôi."

 paragon.228.name:0 "$NAME_Astrocreator_Azaryn$"
 paragon.228.desc_opening_worst:0 "Xin chào! Các bạn đã cho tôi thấy thực lực của mình. Tôi hy vọng sẽ có lúc dạy cho các bạn cách sử dụng sức mạnh sáng tạo không gian của tôi.\n\n§HAzaryn cúi chào.§!\n\nChúng ta sẽ chung tay làm cho dải ngân hà trở nên xanh tươi trù phú một lần nữa."
 paragon.228.desc_opening_mid:0 "Xin chào, [owner.GetAdjective]. Rất vui được gặp lại các bạn.\n\nMặc dù giữa chúng ta có nhiều khác biệt, nhưng tôi hy vọng các bạn có thể ghi nhớ những lời dạy của tôi, và học cách dùng kiến thức sáng tạo không gian để đem lại lợi ích cho ngân hà.\n\n"
 paragon.228.desc_opening_best:0 "À, [owner.GetAdjective]. Gửi tới các bạn lời chào chân thành nhất. Tôi kết luận rằng, các bạn là những người kế thừa xuất sắc cho lĩnh vực sáng tạo không gian!\n\n§HAzaryn mỉm cười.§!\n\nChúng ta sẽ chung tay gieo rắc mầm sống vào cõi hư không. Chúng ta sẽ chung tay mang lại hy vọng cho tất cả mọi người!\n\n"
 paragon.228.desc_worst:0 "$paragon.228.desc_opening_worst$ $paragon.228.desc_end$"
 paragon.228.desc_mid:0 "$paragon.228.desc_opening_mid$ $paragon.228.desc_end$"
 paragon.228.desc_best:0 "$paragon.228.desc_opening_best$ $paragon.228.desc_end$"
 paragon.228.desc_end:0 "Chỉ cần các bạn nỗ lực tạo ra sự sống mới, kỹ năng cũng như phi thuyền của tôi sẵn sàng để các bạn sử dụng. Nếu các bạn muốn, tôi rất hân hạnh được gia nhập cùng các bạn."
 paragon.228.a:0 "Vậy rốt cuộc sáng tạo không gian là gì?"
 paragon.228.a.response:0 "À đúng rồi, xin thứ lỗi cho tôi. Tôi phấn khích quá, suýt nữa quên giải thích những chi tiết quan trọng nhất. Nhưng có lẽ tốt nhất là nên trình diễn cho các bạn xem để dễ hình dung...\n\n$paragon_astrocreation_is$\n\nĐúng vậy, rất nhanh thôi các bạn sẽ được đích thân chứng kiến một lần sáng tạo không gian."
 paragon_astrocreation_is:1 "Sáng tạo không gian là một phương thức cải tạo môi trường cao cấp. Nó có sức mạnh vô cùng lớn. Bằng cách gieo một Lõi Cải tạo của tôi lên một hành tinh —§HAzaryn chỉ vào những nụ hoa sau lưng cô ấy§!— chúng ta có thể cải tạo gần như bất kỳ loại hành tinh nào thành một hành tinh Gaia sinh sôi nảy nở. Quá trình này đòi hỏi rất nhiều năng lượng, nhưng kết quả mang lại thì vô cùng ngoạn mục."

 paragon.228.b.custom_tooltip:2 "§H$NAME_Astrocreator_Azaryn$§! đã tham gia đế chế của chúng ta với tư cách là một §YNhà Lãnh đạo§!."

 paragon.228.c:0 "Những thứ trên lưng cô là gì vậy?"
 paragon.228.c.response:0 "§HAzaryn có vẻ ngạc nhiên trước câu hỏi này.§!\n\nNói tóm lại, đây là một đặc điểm riêng biệt của giống loài chúng tôi. Khi chúng tôi còn trẻ, chúng phát triển rất nhanh — tôi phải nói thêm là, sẽ hơi khó chịu một chút — và cần được cắt tỉa định kỳ, nếu không nó sẽ đè bẹp chính chúng tôi. §HCô ấy mỉm cười.§! Nhưng mà chao ôi, đến cái tuổi của tôi rồi, mấy rắc rối nhỏ đó chỉ còn là những kỷ niệm xa xăm.\n\nChúng thực sự không phải là hạt giống, nhưng có thể đóng vai trò tương tự. Tôi gọi chúng là Lõi Cải tạo. Ẩn sâu bên trong chúng là tiềm năng phát triển, tái sinh và kiến tạo sự sống."
 paragon.228.d:0 "Thiết bị bay vo ve nhỏ nhắn của cô là gì thế?"
 paragon.228.d.response:0 "À, bạn nói cái này sao? §HAzaryn dịu dàng ôm lấy con bọ bay nhỏ xíu.§! Đây là một drone thụ phấn. Chúng đảm bảo hệ sinh thái trên phi thuyền của tôi luôn căng tràn sức sống, sinh sôi không ngừng.\n\nChúng không hoàn toàn là vô cơ, thậm chí còn có khả năng tự sản sinh phấn hoa. §HAzaryn chỉ vào phần đuôi của chiếc drone.§! Chúng thậm chí có thể tận dụng tĩnh điện ở đuôi pin để điều tiết quá trình truyền phấn. Đáng yêu phải không?"

 paragon.230.name:0 "$NAME_Astrocreator_Azaryn$"
 paragon.230.desc_worst:0 "$paragon.230.desc_main$ $paragon.230.worst$"
 paragon.230.desc_mid:0 "$paragon.230.desc_main$ $paragon.230.mid$"
 paragon.230.desc_best:0 "$paragon.230.desc_main$ $paragon.230.best$"

 paragon.230.desc_main:0 "§HAzaryn đang thao tác thoăn thoắt trên bảng điều khiển, điều chỉnh một vài nhạc cụ.§!\n\nTuyệt vời! Tôi đã định vị được thủ đô của các bạn để bắt đầu điều hướng, rất nhanh thôi tôi sẽ đến chỗ các bạn.\n\nỒ suýt nữa thì quên, hệ sinh thái trên phi thuyền của tôi cũng là mái nhà của rất nhiều pheromone."
 paragon.230.worst:0 "Tôi thấy đưa cho các bạn những §YPheromone§! này hẳn là khá phù hợp. Chúng tương thích với giống loài của các bạn, chắc chắn sẽ mang lại một số hiệu ứng tích cực."
 paragon.230.mid:0 "Để kỷ niệm sự hợp tác của chúng ta, tôi đã chuẩn bị một ít §YPheromone§! làm quà. Đây không phải là tác phẩm xuất sắc nhất của tôi, nhưng vẫn sẽ mang lại một vài hiệu ứng tích cực cho nhân dân của các bạn."
 paragon.230.best:0 "Để đánh dấu khoảnh khắc đáng mừng này, xin hãy nhận lấy §YPheromone§! này như một món quà. Bên trong chứa một vài hợp chất có thể mang lại lợi ích cho nhân dân của các bạn. Rất đáng để sử dụng."

 pheromone_cocktail_best:0 "Hỗn hợp Pheromone"
 pheromone_cocktail_best_desc:0 "Một món quà từ §Y$NAME_Astrocreator_Azaryn$§!."
 pheromone_cocktail_mid:0 "$pheromone_cocktail_best$"
 pheromone_cocktail_worst:0 "$pheromone_cocktail_best$"
 terraformation_nucleus_side_effect:0 "Tăng trưởng Quá mức"
 terraformation_nucleus_side_effect_desc:0 "Hành tinh này đã được cải tạo bởi một trong các Lõi của §Y$NAME_Astrocreator_Azaryn$§!."
 leader_trait_legendary_terraformation_nucleus_3_buds:0 "Lõi Cải tạo"
 leader_trait_legendary_terraformation_nucleus_3_buds_desc:0 "Những nụ hoa trên lưng §Y$NAME_Astrocreator_Azaryn$§!. Cô ấy rất kín tiếng về chúng.\n§HCòn lại ba nụ hoa.§!"
 leader_trait_legendary_terraformation_nucleus_2_buds:0 "$leader_trait_legendary_terraformation_nucleus_3_buds$"
 leader_trait_legendary_terraformation_nucleus_2_buds_desc:0 "Những nụ hoa trên lưng §Y$NAME_Astrocreator_Azaryn$§!. Sức khỏe của cô ấy dường như phụ thuộc vào chúng.\n§HCòn lại hai nụ hoa.§!"
 leader_trait_legendary_terraformation_nucleus_1_bud:0 "Lõi Cải tạo"
 leader_trait_legendary_terraformation_nucleus_1_bud_desc:0 "Nụ hoa trên lưng §Y$NAME_Astrocreator_Azaryn$§!, là nguồn gốc sức mạnh của cô, Azaryn cần dựa vào nó để tồn tại.\n§RChỉ còn lại nụ hoa cuối cùng.§!"
 # TO DO [LD]: Update other languages' loc strings to match the trait rework-related addition of "_bud(s)" above

 paragon.232.name:0 "Héo tàn"
 paragon.232.desc:0 "Tình trạng sức khỏe của §Y$NAME_Astrocreator_Azaryn$§! đang suy yếu rõ rệt đến mức có thể nhìn thấy bằng mắt thường. Cô ấy từ chối kiểm tra y tế, vì vậy chúng ta không thể giúp gì được."
 paragon.232.a:0 "Thật đáng lo ngại."

 paragon.235.name:0 "Sáng tạo và Lụi tàn"
 paragon.235.desc:0 "Bây giờ chúng ta đã chắc chắn rằng sức khỏe của §Y$NAME_Astrocreator_Azaryn$§! có mối liên hệ mật thiết với các Lõi Cải tạo. Cứ mỗi lần sử dụng một Lõi, tình trạng sức khỏe của cô ấy lại tệ đi một phần, chúng ta dự đoán rằng một khi sử dụng hết Lõi cuối cùng, cô ấy sẽ phải bỏ mạng."
 paragon.235.a:0 "Thật là đáng tiếc."

 paragon.240.name:0 "Nụ hoa Cuối cùng"
 paragon.240.desc:0 "§H$NAME_Astrocreator_Azaryn$ vẫn còn sống. Âm thanh ríu rít thường ngày trên phi thuyền của cô ấy biến thành một tiếng ngân nga trầm đục. Cô ấy thầm thì bằng một giọng khàn khàn.§!\n\nTôi không thấy buồn. Những hành tinh đó sẽ lại trở nên trù phú, và tôi rất vinh dự khi được cống hiến sinh mạng của mình. Cảm ơn các bạn, những người bạn của tôi.\n\n§HCô ấy ra đi rồi.§!"

 paragon.240.a:0 "Một sự mất mát to lớn."
 withered_dome_ship_effect:0 "Vùng đất Sống Lụi tàn"
 paragon_withered_dome_ship_desc:0 "Sau khi §Y$NAME_Astrocreator_Azaryn$§! qua đời, những gì còn sót lại từ Tàu Mái vòm của cô ấy."

 paragon.241.desc:1 "§HChúng ta nhận được một tin nhắn được ghi âm sẵn. Đó là từ Azaryn.§!\n\nMặc dù tôi đã chấp nhận sự hy sinh của mình, nhưng tôi không thể cam tâm nhìn Vùng đất Sống cùng với vạn vật trên tàu chết đi cùng tôi. Con tàu này gắn kết chặt chẽ với tôi, khi tôi héo úa, nó cũng sẽ lụi tàn.\n\nTôi đã lường trước điều này, nên Vùng đất Sống được thiết kế theo dạng mô-đun, mỗi hệ sinh thái bên trong đều có khả năng tự duy trì. Công tác chuẩn bị đã được thực hiện xong từ trước, các bạn chỉ cần tìm một hành tinh để thiết lập lại môi trường sống. Tôi tin rằng các bạn có thể hoàn thành nhiệm vụ này."
 paragon.241.a:0 "Chúng tôi sẽ làm được."
 paragon.241.a.custom_tooltip:0 "Công tác chuẩn bị cho việc xây dựng lại §Y$building_contained_ecosphere$§! của Azaryn đã hoàn tất. Có thể được xây dựng lại trên một hành tinh do chúng ta lựa chọn."

 building_contained_ecosphere:0 "Hệ sinh thái Kiểm soát"
 building_contained_ecosphere_desc:0 "Di sản của §Y$NAME_Astrocreator_Azaryn$§!, được để lại cho chúng ta khi cô ấy qua đời. Đây chỉ là một phần nhỏ của hệ sinh thái được tích hợp trong Vùng đất Sống.\n\nĐưa vào hành tinh này một nồng độ cao §H$contained_ecosphere_pheromones$§!, tạo ra hiệu ứng tích cực cho dân số."
 contained_ecosphere_pheromones:0 "Pheromone Sinh thái"
 contained_ecosphere_pheromones_desc:0 "Những pheromone có lợi được §H$building_contained_ecosphere$§! phát tán đều đặn, mang lại hiệu ứng tích cực cho dân số."

 paragon.260.name:0 "Mẫu vật Lõi"
 paragon.260.desc:0 "Một nhà khoa học của chúng ta đã tự ý lén lút lấy một mẫu vật từ Lõi Cải tạo của §Y$NAME_Astrocreator_Azaryn$§!.\n\nViệc nghiên cứu nụ hoa này có thể cung cấp những thông tin vô giá mà ở giai đoạn hiện tại Azaryn vẫn chưa có ý định chia sẻ."
 paragon.260.a:0 "Tiến hành nghiên cứu."
 paragon.260.b:0 "Hoàn trả mẫu vật cho Azaryn."

 paragon.261.name:0 "Hoàn trả Mẫu vật Lõi"
 paragon.261.desc:0 "§H$NAME_Astrocreator_Azaryn$ thở phào nhẹ nhõm.§!\n\nTôi không biết dùng lời nào để bày tỏ lòng biết ơn khi các bạn quyết định trả lại nó cho tôi. Nếu không thể kiểm soát thứ sức mạnh này đúng cách, hậu quả có thể là một thảm họa tàn khốc.\n\nThật đáng mừng là, lịch sử đã không lặp lại. Để thưởng cho sự trung thực của các bạn, tôi sẽ chuẩn bị một mẻ pheromone mới."
 paragon.261.a:0 "Việc này sẽ không bao giờ xảy ra nữa."
 paragon.261.b:0 "Lịch sử lặp lại?"
 paragon.261.b.response:0 "Tôi lỡ lời rồi.\n\n§HAzaryn lắc đầu.§!\n\nCan thiệp vào tự nhiên sẽ kéo theo những hậu quả đáng sợ. Hồi còn trẻ kỹ năng của tôi chưa đủ chín muồi, nên đã phạm phải một sai lầm...\n\nHành tinh của chúng tôi từng vô cùng phồn vinh, đẹp đẽ nhường nào. Nhưng một sai lầm nhỏ trong tính toán đã dẫn đến sự xâm lấn của một loại vi khuẩn ngoài dự kiến. Cân bằng sinh thái bị phá vỡ, kéo theo đó là một cuộc đại tuyệt chủng. Chúng tôi đã phải trả giá cho sự bất cẩn của mình."

 NUCLEUS_SAMPLE_STOLEN:0 "Nghiên cứu Lõi Cải tạo"
 NUCLEUS_SAMPLE_STOLEN_DESC:0 "Nghiên cứu mẫu vật chúng ta lấy được từ Lõi Cải tạo của §Y$NAME_Astrocreator_Azaryn$§! có thể nâng cao sự hiểu biết của chúng ta về công nghệ này."

 paragon.265.name:0 "Nghiên cứu Lõi hoàn tất"
 paragon.265.desc:0 "Đội ngũ khoa học bí mật của chúng ta đã học được rất nhiều điều thông qua việc nghiên cứu mẫu Lõi của §Y$NAME_Astrocreator_Azaryn$§!. Dự án này đã hoàn tất, và Azaryn hoàn toàn không hề hay biết."

 paragon.270.name:0 "Cơ sở Sụp đổ"
 paragon.270.desc:0 "Cơ sở trên [event_target:nucleus_building_planet.GetName] đã bị tàn phá nặng nề về mặt kết cấu, bị sụp đổ do cây cối sinh sôi quá nhanh. Các nhà khoa học nghiên cứu mẫu Lõi Cải tạo đã không thể kiểm soát được tình hình."
 paragon.270.a:0 "Thiêu rụi cơ sở đó đi. Tiêu hủy mọi thứ."
 paragon.270.b:0 "Chúng ta phải thú tội. Hãy liên lạc với Azaryn."
 paragon.270.b.custom_tooltip:0 "§Y$NAME_Astrocreator_Azaryn$§! có khả năng sẽ chấm dứt hợp tác với chúng ta."

 paragon.272.name:0 "$NAME_Astrocreator_Azaryn$"
 paragon.272.desc:1 "§HAzaryn có chút ngạc nhiên.§!\n\nỒ, chào! Rất vui được gặp các bạn!\n\nPhải thừa nhận rằng, sự hợp tác của chúng ta mang lại lợi ích nhiều hơn tôi dự đoán. Chúng ta đang cùng nhau đạt được những bước tiến lớn. Những việc thế này chỉ có thể thành công khi chúng ta tin tưởng lẫn nhau.\n\n§HCô ấy mỉm cười trìu mến.§!"
 paragon.272.a:0 "Chúng tôi có chuyện muốn thú tội."

 paragon.273.desc:0 "Tôi biết rồi.\n\n§HCô ấy thở dài.§!\n\nThôi được, tổn thất cũng đã xảy ra rồi. May mà các bạn liên lạc với tôi sớm như vậy. Chúng ta phải hành động thật nhanh. Việc này đòi hỏi phía các bạn phải đầu tư rất nhiều. Có bao nhiêu thì mang ra bấy nhiêu, như vậy chúng ta mới có thể giải quyết vấn đề này càng sớm càng tốt."

 paragon.273.a:0 "Cứ lấy đi."
 paragon.273.a.custom_tooltip:0 "Azaryn đã lấy đi toàn bộ £energy£§HNăng lượng§! của bạn."

 paragon.275.name:0 "Nỗi kinh hoàng Xanh"
 paragon.275.desc:0 "Cơ sở nghiên cứu mẫu Lõi Cải tạo của chúng ta đã bị phá hủy. Do không thể ngăn chặn sự lây lan của các loài thực vật xâm lấn, giờ đây, quần thể thực vật mới nở rộ đang phát tán ra một loại phấn hoa gây phồng rộp da, loại phấn hoa này nếu hít phải sẽ gây tử vong. Điều này đẩy [event_target:nucleus_building_planet.GetName] vào tình thế ngàn cân treo sợi tóc."
 paragon.275.a:0 "Chúng ta không thể kiểm soát được nữa. Liên lạc với Azaryn."

 nucleus_sample_boils:0 "Phấn hoa Lõi Gây dị ứng"
 nucleus_sample_boils_desc:0 "Cần một thời gian để chữa trị cho những người bị thương trong sự cố nghiên cứu mẫu Lõi của chúng ta."

 paragon.280.name:0 "$NAME_Astrocreator_Azaryn$"
 paragon.280.desc:0 "§H$NAME_Astrocreator_Azaryn$ vô cùng thất vọng.§!\n\nTôi đã sớm biết được lòng tham của các bạn, nhưng không ngờ các bạn lại ngông cuồng đến thế, thậm chí bỏ mặc cả sự an toàn của nhân dân mình. Họ đang lâm nguy rồi đó!\n\nTôi đang chuẩn bị các biện pháp đối phó với sự tăng trưởng quá mức này. Nhưng những người bị thương do sự tắc trách của các bạn đang rất cần được điều trị khẩn cấp."
 paragon.280.a:0 "Chúng tôi sẽ chăm sóc tốt cho họ."

 ###########################
 ### LEADER DEATH EVENTS ###
 ###########################

 paragon.550.name:0 "Cái chết của một vị lãnh đạo vĩ đại"
 paragon.550.desc:2 "§Y[From.GetTitle] [From.GetName]§! vĩ đại của chúng ta đã cống hiến hết mình cho đất nước và qua đời ở tuổi [From.GetAge]. Người dân đang kêu gọi tổ chức một lễ tưởng niệm hoành tráng để ghi nhận những đóng góp của người cho §Y[Root.GetName]§!. Sự kiện này có thể gắn kết mọi người và củng cố lý tưởng của chúng ta."
 paragon.550.a:0 "Hãy để mọi người cùng chung viếng."
 paragon.550.b:1 "Một tang lễ riêng tư là đủ rồi."
 paragon.550.c:1 "[From.GetHeSheCap] không xứng đáng với vinh dự này."
 paragon.550.d:1 "Hiến tặng thi hài cho giới khoa học."
 paragon.550.e:1 "Hát cầu hồn cho [From.GetHisHer]."
 paragon.550.f:1 "Lên kế hoạch một lễ diễu hành tưởng niệm hoành tráng. Ngay lập tức."
 paragon.550.g:2 "Thành lập một quỹ mang tên [From.GetHisHer]."
 paragon.550.h:1 "Làm theo truyền thống."
 paragon.550.i:1 "Đưa thi hài vào không gian."
 paragon.550.j:0 "Dựng một tượng đài xứng tầm."
 paragon.550.k:1 "Một buổi tưởng niệm nhỏ là đủ rồi."
 paragon.550.l:1 "Lấy tên [From.GetHisHer] đặt cho một địa danh."
 paragon.550.m:2 "Câu chuyện của [From.GetHisHerCap] vẫn chưa kết thúc..."
 paragon.550.evopred: "[Root.GetRulerTitle] muốn nuốt chửng người được tôn kính."
 paragon.550.evopred.a.tt: "§Y[Root.GetRulerTitle] [Root.GetRulerName]§! sẽ nuốt chửng §Y[From.GetName]§!, xóa bỏ mọi đặc điểm xấu."
 paragon.550.evopred.b.tt: "§Y[Root.GetRulerTitle] [Root.GetRulerName]§! sẽ nuốt chửng §Y[From.GetName]§! để trẻ lại."
 paragon.550.evopred.c.tt: "§Y[Root.GetRulerTitle] [Root.GetRulerName]§! sẽ nuốt chửng §Y[From.GetName]§!, nhận được đặc điểm mới."
 paragon.550.evopred.d.tt: "§Y[Root.GetRulerTitle] [Root.GetRulerName]§! sẽ nuốt chửng §Y[From.GetName]§!, hoàn thành một nửa ['concept_agenda'] hiện tại."


 paragon.551.name:1 "Tang lễ công khai"
 paragon.551.desc:2 "Trong đoàn diễu hành dài, §Y[From.GetName]§! đang lặng lẽ an nghỉ, mọi công dân của §Y[Root.GetName]§! đều được mời đến để bày tỏ lòng thành kính.\n\nSau tang lễ là một tuần tế lễ hoành tráng nhưng vô cùng tốn kém. Quan tài pha lê trong suốt của §Y[From.GetName]§! được trưng bày tại nhà tưởng niệm ở §Y[Root.Capital.GetName]§!. Dòng người xếp hàng trên phố, mong được một lần nhìn thấy nơi an nghỉ cuối cùng của vị lãnh đạo vĩ đại."
 paragon.551.a:1 "Một buổi lễ đưa tiễn trang trọng."

 paragon.552.name:1 "Tang lễ riêng tư"
 paragon.552.desc:1 "§Y[From.GetName]§! lặng lẽ an nghỉ trong vòng tay của những người thân và đồng sự gần gũi nhất. Đóng góp của người cho §Y[Root.GetName]§! là không hề nhỏ, nhưng giờ không phải lúc để phung phí."
 paragon.552.a:1 "Một buổi lễ chia tay phù hợp."

 paragon.553.name:1 "Sự ra đi được báo trước"
 paragon.553.desc:2 "Việc chúng ta xử lý thận trọng đối với §Y[From.GetTitle]§! §Y[From.GetName]§! đã nhanh chóng bị giới truyền thông nắm bắt. Dù có một số người bày tỏ sự lo ngại, nhiều nguồn tin vẫn kiên quyết chỉ ra những thiếu sót của vị lãnh đạo này. Quan điểm chung hiện nay là cuối cùng chúng ta cũng có thể tìm một người kế nhiệm phù hợp hơn để thay thế.\n\n"
 paragon.553.a:1 "Đã đến lúc nhìn về phía trước."

 paragon.554.name:1 "Trở về với cát bụi"
 paragon.554.desc:0 "Sau một buổi tưởng niệm ngắn, thi hài của [From.GetTitle] đã được hiến tặng cho giới khoa học để tiếp tục đóng góp vào giáo dục và nghiên cứu y học cơ bản.\n\nNhững phần còn lại sau quá trình này sẽ được thủy táng, biến thành phân bón giàu khoáng chất, đảm bảo không một phần cơ thể nào bị lãng phí."
 paragon.554.a:0 "Đây chính là vòng luân hồi của sự sống và cái chết."

 paragon.555.name:1 "Lời từ biệt đau thương"
 paragon.555.desc:2 "Mọi người tụ họp lại để tưởng nhớ cuộc đời và những thành tựu vĩ đại của §Y[From.GetName]§!. Dòng người ken cứng các con phố, trải dài ngút tầm mắt. Những bài thánh ca vang vọng mãi đến khi màn đêm buông xuống. [From.GetHeSheCap] nay đã bước sang thế giới bên kia.\n\nNhững trích đoạn rao giảng của [From.GetHisHer] giờ đây vang vọng khắp đế chế, nhắc nhở chúng ta về mục tiêu chung."
 paragon.555.a:0 "Rốt cuộc chúng ta sẽ gặp lại nhau."

 paragon.556.name:1 "Nghi thức đưa tiễn trang trọng"
 paragon.556.desc:2 "Các đội hình duyệt binh lớn cùng hạm đội hộ tống linh cữu của §Y[From.GetName]§! đến nơi an nghỉ cuối cùng. Thi hài của [From.GetHisHerCap] được phóng về phía ngôi sao gần nhất và được phát sóng trực tiếp cho toàn xã hội.\n\nNhững cuốn nhật ký và chiến lược cá nhân của nhà lãnh đạo quá cố đã trở thành tài liệu giảng dạy cho lứa học viên sĩ quan tiếp theo."
 paragon.556.a:0 "Một sự đưa tiễn xứng đáng."

 paragon.557.name:0 "Quỹ tài trợ"
 paragon.557.desc:2 "Để tưởng nhớ vị §Y[From.GetTitle]§! vĩ đại vừa qua đời, §Y[From.GetName]§!, chúng tôi đã thành lập một quỹ phi lợi nhuận. Quỹ này đánh dấu một bước tiến mới hướng tới hòa bình và phát triển hài hòa giữa các vì sao, bao dung những khác biệt giữa các cộng đồng và giống loài."
 paragon.557.a:0 "Chúng ta đã cùng nhau tạo nên một di sản."

 paragon.558.name:1 "Tang lễ truyền thống"
 paragon.558.desc:2 "Khi tin tức về sự ra đi của §Y[From.GetName]§! lan xa, một nỗi đau buồn sâu sắc đã bao trùm khắp đế chế. Vô số người dân thương tiếc đã làm theo nghi thức tang lễ truyền thống và gia nhập đoàn đưa tang tại §Y[Root.Capital.GetName]§!.\n\nThi hài được tắm rửa tỉ mỉ và trang điểm chỉnh tề. Trước khi thi hài của §Y[From.GetTitle]§! được hạ huyệt, cả nước sẽ dành một phút mặc niệm để bày tỏ lòng thành kính."
 paragon.558.a:0 "Tất cả chúng ta đều như vậy."

 paragon.559.name:1 "Chuyến du hành tĩnh lặng"
 paragon.559.desc:2 "Để ghi nhận những thành tựu vĩ đại trong suốt cuộc đời của §Y[From.GetName]§!, chúng tôi đã chuẩn bị cho [From.GetHimHer] một chuyến đi cuối cùng xuyên qua biển sao.\n\nMột khoang chứa thi hài của [From.GetTitle] được phóng một cách trang nghiêm vào vùng không gian chưa được khám phá, mang theo những vần thơ, bản đồ, cuộn băng ghi âm và các đồ tùy táng do những vị khách quý mang đến. Biết đâu một ngày nào đó trong tương lai, con tàu của [From.GetTitle] có thể tìm thấy một mái nhà mới ở đó, hoàn thành sứ mệnh cuối cùng của [From.GetHisHer]."
 paragon.559.a:0 "Hãy tiến vào giữa những vì sao."

 paragon.560.name:0 "Bức tượng sừng sững"
 paragon.560.desc:1 "Các nghệ nhân đã dùng những vật liệu tốt nhất để tạc tượng §Y[From.GetName]§!, đưa người vào hàng ngũ những anh hùng huyền thoại của §Y[Root.GetName]§!. Gương mặt trang nghiêm của người được khắc tạc trên đá và kim loại, giúp người dân mãi nhớ về những chiến công hiển hách của vị lãnh đạo quyền lực này."
 paragon.560.a:0 "Sự vĩ đại của người sẽ được khắc ghi mãi mãi."

 paragon.561.name:0 "Khắc ghi"
 paragon.561.desc:1 "Tên và tước hiệu của §Y[From.GetName]§! đã được khắc lên một tượng đài cao lớn, sánh vai cùng vô số những người khác đã cống hiến hết mình cho nhân dân §Y[Root.GetName]§!. Vị §Y[From.GetTitle]§! đáng kính này sẽ được người dân nhớ mãi, những đóng góp của người đã mở đường cho nhiều thế hệ lãnh đạo mai sau."
 paragon.561.a:0 "Vì hạnh phúc của muôn dân."

 paragon.562.name:0 "Địa danh"
 paragon.562.desc:1 "Sự ra đi của vị lãnh đạo này đã gây ra một cơn chấn động ngắn nhưng dữ dội trên sàn giao dịch chứng khoán giữa các vì sao.\n\nNgoài việc tổ chức một tang lễ xa hoa, §Y[Root.GetName]§! còn đổi tên một tòa nhà chọc trời thành Tòa nhà [From.GetName] để đảm bảo rằng tên tuổi của [From.GetTitle] sẽ được ghi vào biên niên sử của tập đoàn sau này. Trên tường mỗi phòng họp đều treo một bức chân dung mang tính nghệ thuật, nhằm tưởng nhớ những đóng góp kiệt xuất của người cho đế chế."
 paragon.562.a:0 "Cắt băng khánh thành thôi."

 paragon.563.name:1 "Sinh mệnh mới"
 paragon.563.desc:1 "Cái chết của loài §Y[From.Species.GetName]§! không triệt để như vẻ bề ngoài. Dù cơ thể đã bắt đầu phân hủy, phần cốt lõi vẫn có thể phục hồi sức sống.\n\nSau khi được ngâm trong một dung dịch hormone đặc biệt, di hài của §Y[From.GetName]§! được cẩn thận vùi vào lớp đất của §Y[burial_planet.GetName]§!. Khu chôn cất được các thợ ấp chăm sóc kỹ lưỡng, họ kiên nhẫn chờ đợi mầm non phá đất nảy mầm, bắt đầu một vòng đời mới."
 paragon.563.a:0 "Từ kiếp này sang kiếp khác."

 paragon.570.name:1 "Sai khiến sau cái chết"
 paragon.570.desc:2 "§Y[From.GetTitle] [From.GetName]§! đã gặp trục trặc và hỏng hoàn toàn sau khi phục vụ một cách đáng tin cậy suốt [From.GetYearsOfService] năm. Các nhà khoa học của chúng ta đã sao lưu các tập tin để giữ lại dữ liệu quan trọng.\n\nMột bản đồ ảnh toàn ký thông minh dựa trên §Y[From.GetName]§! đã được cài đặt vào hệ thống tàu của chúng ta, đóng vai trò là cố vấn ảo. Họ sẽ tiếp tục hỗ trợ các nhiệm vụ của chúng ta."
 paragon.570.a:1 "Cái chết không còn là một rào cản nữa."

 paragon.571.name:1 "[root.GetGestaltEntityName] trường tồn"
 paragon.571.desc:1 "Ý thức của §Y[From.GetTitle] [From.GetName]§! đã bị ngắt khỏi tâm trí bầy đàn ở tuổi [From.GetAge]. Chúng ta là §Y[Root.GetName]§!, chúng ta sẽ trường tồn."
 paragon.571.a:0 "Chúng ta sẽ trường tồn."

 paragon.580.name:1 "Sự sụp đổ của trí tuệ vĩ đại"
 paragon.580.desc:2 "Chúng ta vừa nhận được hung tin từ hệ sao §Y[system_killed_in.GetName]§!. Hạm đội của nhà khoa học đáng kính §Y[leader_killed.GetName]§! đã bị §Y[country_killed_by.GetName]§! tiêu diệt hoàn toàn trong một trận chiến tàn khốc.\n\nTrong một hành động vị tha cuối cùng, phi hành đoàn đã phát đi một đoạn tin nhắn chứa đựng những thành quả nghiên cứu mới nhất của §Y[leader_killed.GetName]§!. Kế hoạch về một kỳ nghỉ lễ đặc biệt để tưởng nhớ §Y[leader_killed.GetName]§! đã bắt đầu được triển khai."
 paragon.580.a:0 "Sự hy sinh không hề uổng phí."

 paragon.581.name:1 "Hành động không thể tha thứ"
 paragon.581.desc:2 "Dưới cuộc tấn công ác ý của §Y[country_killed_by.GetName]§!, nhà khoa học vĩ đại §Y[leader_killed.GetName]§! của chúng ta đã ngã xuống trong trận chiến tại §Y[system_killed_in.GetName]§!.\n\nHành động dã man này đã khiến cả nước phẫn nộ. Người dân lớn tiếng kêu gọi đòi lại công lý. Chúng ta sẽ làm mọi cách trong khả năng của mình để đảm bảo rằng §Y[country_killed_by.GetName]§! sẽ phải hối hận vì hành vi đê hèn mà chúng gây ra ngày hôm nay."
 paragon.581.a:0 "Tuyệt đối không thể tha thứ."

 paragon.582.name:1 "Nhân viên khoa học nổi tiếng qua đời"
 paragon.582.desc:1 "Một nhà khoa học ưu tú gần đây đã biến mất khỏi màn hình radar. Sau khi §Y[leader_killed.GetName]§! đi lạc vào cuộc chiến trong hệ sao §Y[system_killed_in.GetName]§!, chúng ta đã nhanh chóng mất liên lạc với [leader_killed.GetHeShe].\n\nĐây là một tổn thất không thể đong đếm đối với đế chế của chúng ta. Phải ngay lập tức có biện pháp để ngăn ngừa những mất mát tương tự xảy ra."
 paragon.582.a:1 "Phải lập tức tìm người thay thế."
 paragon.582.b:1 "Chúng ta sẽ ghi nhớ sự mất mát này."
 paragon.582.c:1 "Số phận đang trêu đùa chúng ta."

 ##############################
 ### DEATH EVENTS MODIFIERS ###
 ##############################

 paragon_death_public_funeral:0 "Tang lễ công khai"
 paragon_death_public_funeral_desc:1 "Một nhà lãnh đạo vĩ đại được an táng sau một tang lễ công khai, người dân đoàn kết chặt chẽ bên nhau."

 paragon_death_private_funeral:0 "Tang lễ riêng tư"
 paragon_death_private_funeral_desc:1 "Một nhà lãnh đạo vĩ đại được an táng trong một lễ tưởng niệm kín đáo. Dân chúng mất đi cơ hội để nguôi ngoai nỗi buồn."

 paragon_death_good_tidings:0 "Tín hiệu tốt"
 paragon_death_good_tidings_desc:1 "Sự ra đi của vị lãnh đạo tại vị lâu năm này đã bất ngờ kéo nhiều phe phái thù địch lại gần nhau hơn. Họ sẵn sàng hợp tác để giải quyết mớ hỗn độn mà người quá cố để lại."

 paragon_death_pragmatic_approach:0 "Cách tiếp cận thực dụng"
 paragon_death_pragmatic_approach_desc:1 "Việc hiến tặng cơ thể của vị lãnh đạo quá cố quả nhiên mang lại lợi ích to lớn, tiếp tục hỗ trợ cho công việc học thuật của chúng ta."

 paragon_death_harmonious_passing:0 "Sự ra đi êm ái"
 paragon_death_harmonious_passing_desc:0 "Khi nhà lãnh đạo vĩ đại của chúng ta qua đời, chúng ta có thể tìm thấy sự an ủi và bình yên bên nhau."

 paragon_death_military_funeral:0 "Tang lễ quân đội"
 paragon_death_military_funeral_desc:1 "Linh cữu của một nhà lãnh đạo vĩ đại được quân đội hộ tống đến nơi an nghỉ cuối cùng, sức mạnh của chúng ta được phô diễn giữa biển sao."

 paragon_death_foundation_peace:0 "Quỹ hòa bình"
 paragon_death_foundation_peace_desc:1 "Để tưởng nhớ vị lãnh đạo vĩ đại đã khuất, mọi người đã thành lập một quỹ tài trợ nhằm xóa bỏ những rào cản giữa các cộng đồng của chúng ta."

 paragon_death_reignited_traditions:0 "Khơi dậy truyền thống"
 paragon_death_reignited_traditions_desc:1 "Nghi thức tang lễ truyền thống tưởng nhớ nhà lãnh đạo quá cố đã gợi nhớ cho mọi người về một quá khứ từng đoàn kết một lòng. Sự kiện này nhắc nhở chúng ta nhìn lại lịch sử, kết nối chúng ta một lần nữa với những nét văn hóa cổ xưa."

 paragon_death_to_the_stars:0 "Hướng tới những vì sao"
 paragon_death_to_the_stars_desc:1 "Vị lãnh đạo quá cố của chúng ta đã khởi hành đón chào một chuyến đi mới. Đồng lòng nhất trí, chúng ta được truyền cảm hứng để nỗ lực tiến xa hơn nữa."

 paragon_death_towering_memorial:0 "Tượng đài sừng sững"
 paragon_death_towering_memorial_desc:1 "Một bức tượng đài cao vút khắc ghi niềm vinh quang của chúng ta."

 paragon_death_name_wall:0 "Khắc ghi"
 paragon_death_name_wall_desc:1 "Tên của nhà lãnh đạo này được lưu danh muôn thuở cùng với những người khác đã cống hiến cho sự tiến bộ của đế chế."

 paragon_death_landmark_building:0 "Công trình biểu tượng"
 paragon_death_landmark_building_desc:0 "Một tòa nhà chọc trời mang tên vị lãnh đạo quá cố nhìn xuống thành phố, phô diễn sự vĩ đại của người trước toàn quốc."

 paragon_death_rejuvenation:0 "Tái sinh"
 paragon_death_rejuvenation_desc:1 "Gốc rễ của nhà lãnh đạo quá cố của chúng ta lại đâm chồi nảy lộc, mang đến một cuộc sống mới."

 paragon_death_virtual_advisors:1 "Cố vấn ảo"
 paragon_death_virtual_advisors_desc:2 "Một trí tuệ ảnh toàn ký kế thừa toàn bộ kinh nghiệm từ nhà lãnh đạo đã hỏng của chúng ta, nay tiếp tục phục vụ với tư cách là cố vấn tàu cao cấp."

 paragon_death_the_hive_endures:0 "Tổ đàn trường tồn"
 paragon_death_the_hive_endures_desc:0 "Bầy đàn đã mất đi một ong thợ quý giá. Nó sẽ được thay thế."
 paragon_death_the_wilderness_endures: "Chốn hoang dã trường tồn"
 paragon_death_the_wilderness_endures_desc: "Tập thể đã mất đi một cá thể cộng sinh quý giá. Nó sẽ được thay thế."

 #########################
 ###   LEADER EVENTS   ###
 #########################

 paragon.1000.name:0 "Nội các trì trệ"
 paragon.1000.desc:1 "Ban đầu chỉ là vài cuộc cãi vã nhỏ, nay đã leo thang thành sự bế tắc khi mọi vấn đề đều bị đem ra tranh cãi không ngớt, làm cản trở nghiêm trọng hiệu suất hoạt động của nội các.\n\n§Y[root.GetName]§! là thành viên có vấn đề nhất, thích gây gổ và phá vỡ trật tự trong nội các. Rất nhiều người yêu cầu phế truất ghế của [root.GetHisHer] để lập lại kỷ cương và hiệu quả."
 paragon.1000.a:0 "Sa thải kẻ gây rắc rối đó."
 paragon.1000.b:1 "Họ phải học cách làm việc cùng nhau."

 paragon.1005.name:0 "Cảm hứng từ hiện tượng vũ trụ"
 paragon.1005.desc:1 "Sự kỳ vĩ của một hiện tượng vũ trụ hiếm gặp đã thúc đẩy §Y[root.GetName]§! đạt đến một tầm cao mới. Cảm giác hưng phấn và những ý tưởng mới trào dâng, vấn đề duy nhất là nên tập trung vào nhánh khoa học nào."
 paragon.1005.a:0 "Vật lý đến rồi đi."
 paragon.1005.b:1 "Trọng tâm đặt vào nghiên cứu Xã hội học."
 paragon.1005.c:0 "Các kỹ sư của chúng ta chắc sẽ biết cách tận dụng nó tốt hơn."

 paragon.1010.name:0 "Tịch thu hàng cấm"
 paragon.1010.desc:1 "Dưới sự đích thân triển khai và chỉ huy đầy mạo hiểm của §Y[root.GetName]§!, chúng ta đã thu giữ được một lượng lớn hàng cấm. Chiến dịch này đã được ấp ủ từ lâu, thành công làm suy yếu các tổ chức tội phạm bám rễ trong lãnh thổ của chúng ta."
 paragon.1010.a:1 "Công lý dẫu muộn nhưng chắc chắn sẽ đến."

 paragon.1015.name:0 "Nội các đoàn kết"
 paragon.1015.desc:1 "§Y[event_target:leader_event_target.GetName]§! đã thể hiện năng lực lãnh đạo phi thường, gắn kết nội các lại với nhau để đảm bảo việc quản lý xã hội một cách hiệu quả. Bằng cách vận dụng linh hoạt thống kê, truyền thống và các biện pháp ngoại giao, [event_target:leader_event_target.GetName] đã thành công xoa dịu các thành viên khác trong nội các, cũng như các phe phái trong xã hội của chúng ta."
 paragon.1015.a:1 "Sát cánh bên nhau, chúng ta sẽ càng mạnh mẽ hơn."

 paragon.1020.name:0 "Phát triển cá nhân"
 paragon.1020.desc:1 "§Y[event_target:leader_event_target.GetName]§! đã bắt đầu một hành trình khám phá và phát triển bản thân. Sự tập trung học tập, miệt mài nghiên cứu và giỏi tự soi xét của [event_target:leader_event_target.GetHisHer] đã nâng năng lực trí tuệ của [event_target:leader_event_target.GetHisHerCap] lên một tầm cao hoàn toàn mới. Giờ đây, [event_target:leader_event_target.GetName] quyết tâm thách thức giới hạn của những điều có thể, và truyền cảm hứng để những người khác vươn tới những vì sao."
 paragon.1020.a:1 "Một thái độ làm việc đầy cảm hứng."

 paragon.1025.name:0 "Tiến bộ khoa học"
 paragon.1025.desc:1 "Khám phá khoa học chấn động của §Y[event_target:leader_event_target.GetName]§! đã trực tiếp đẩy mạnh đáng kể hiệu suất nghiên cứu. Phát hiện của [event_target:leader_event_target.GetHisHerCap] đã trở thành chủ đề nóng trong giới khoa học, nay họ đã xem [event_target:leader_event_target.GetName] như một người tiên phong về tư tưởng."
 paragon.1025.a:1 "Những bước tiến này sẽ mang lại lợi ích cho tất cả mọi người."

 paragon.1030.name:0 "Rò rỉ thông tin"
 paragon.1030.desc:1 "Chúng ta đã xảy ra một sự cố rò rỉ thông tin nghiêm trọng, nhiều thông tin nhạy cảm và các chi tiết an ninh then chốt đã bị phơi bày trước công chúng. Các tài liệu này bao gồm sơ đồ tổ chức của các cơ sở quân sự, các thí nghiệm giao diện thần kinh, cũng như việc giám sát một số nhân vật đối lập chủ chốt.\n\n§Y[root.GetName]§! không thể trối bỏ trách nhiệm trong sự kiện tai hại này."
 paragon.1030.a:0 "Gặp rắc rối lớn rồi."
 paragon.1030.b:1 "Điều tra nghiêm ngặt, truy cứu tới cùng."

 paragon.1035.name:0 "Người tạo xu hướng"
 paragon.1035.desc:1 "§Y[event_target:leader_event_target.GetName]§! đã trở thành người dẫn đầu xu hướng cho quần chúng nhân dân. Từ phong cách ăn mặc cho đến cách ăn nói của [event_target:leader_event_target.GetHisHer], tất cả đều thu hút vô số người học theo. Tầm ảnh hưởng của [event_target:leader_event_target.GetHisHerCap] lan rộng ra nhiều tầng lớp kinh tế - xã hội, nhưng [event_target:leader_event_target.GetSheHe] quả nhiên vẫn được giới trẻ hâm mộ cuồng nhiệt nhất."
 paragon.1035.a:1 "Tất nhiên là chúng ta ủng hộ rồi."

 paragon.1040.name:0 "Tiếng vọng vĩnh hằng"
 paragon.1040.desc:1 "Bài diễn thuyết dạt dào cảm xúc của §Y[event_target:leader_event_target.GetName]§! đã dấy lên một làn sóng ái quốc cuồng nhiệt. Tấm lòng son sắt của [event_target:leader_event_target.GetHisHerCap] đã đánh thức ý thức trách nhiệm và lòng nhiệt thành dân tộc trên khắp lãnh thổ của chúng ta."
 paragon.1040.a:1 "Chúng ta không thể bị ngăn cản."

 paragon.1045.name:0 "Khuynh hướng dị biệt"
 paragon.1045.desc:1 "Phân tích thống kê cho thấy §Y[event_target:leader_event_target.GetName]§! đã phát triển sự dị biệt rất lớn trong nhận thức và hành vi, khiến người này đang dần trở thành một cá thể độc lập.\n\nChúng ta không thể dự đoán chính xác những mối nguy cũng như lợi ích tiềm năng từ ý chí tự do này. Nay phải đưa ra quyết định: Nên để [event_target:leader_event_target.GetName] giữ nguyên trạng thái hiện tại, hay ép buộc phải quay lại quỹ đạo?"
 paragon.1045.a:1 "Bóp chết tính cá nhân ngay từ trong trứng nước."
 paragon.1045.b:0 "Trục xuất và phế bỏ."

 paragon.1050.name:1 "Bê bối toàn quốc"
 paragon.1050.desc:1 "§Y[root.GetName]§! đã chìm sâu vào một vụ bê bối chấn động toàn quốc. Hàng loạt bài báo phanh phui những hành vi sai trái, biển thủ công quỹ và che giấu sự thật mọc lên như nấm, nhiều người thậm chí còn bắt đầu hoài nghi năng lực của giới cầm quyền.\n\nKhông còn nghi ngờ gì nữa, tác động của những sự việc này lên tâm lý dân chúng sẽ còn kéo dài nhiều năm. Rất nhiều người tin rằng cách duy nhất để khôi phục lòng tin của công chúng là buộc [root.GetName] phải từ chức và chịu xét xử công khai."
 paragon.1050.a:1 "Bản án này thật là không may."
 paragon.1050.b:1 "Sa thải lãnh đạo đó."

 paragon_leader_dismissed_tooltip:0 "§Y[root.GetClass] [root.GetName]§! đã bị sa thải."

