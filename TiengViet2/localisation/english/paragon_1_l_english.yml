 SECTOR_EDITOR_HELP:1 "§H$SECTOR_EDIT_VIEW$§!\nBạn có thể tự do thêm hoặc xóa bất kỳ hệ sao nối liền nào thuộc về bạn trong một phạm vi nhất định tính từ £sector_capital£§YThủ phủ Phân khu§! thông qua §H$SECTOR_EDIT_VIEW$§!.\n$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§EKhi bật tự động mở rộng, phân khu sẽ tự động mở rộng bao gồm tất cả các hệ sao trong phạm vi mà chưa thuộc về phân khu nào khác.§!"
