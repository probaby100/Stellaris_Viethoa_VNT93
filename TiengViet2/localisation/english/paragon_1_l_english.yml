 paragon_efficient_council:0 "Nội các hiệu quả"
 paragon_efficient_council_desc:1 "Nội các đã được củng cố nhờ việc loại bỏ các nhân tố tiêu cực."
 paragon_dysfunctional_council:0 "Nội các trì trệ"
 paragon_dysfunctional_council_desc:1 "Viên chức nội các thích tranh cãi đó vẫn tại vị, do đó hiệu suất làm việc của tất cả những người khác đều bị sụt giảm."

 paragon_applied_physics:0 "Cảm hứng hiếm - Vật lý học"
 paragon_applied_physics_desc:1 "Các nhà nghiên cứu của chúng ta đã được truyền cảm hứng từ hiện tượng vũ trụ, giúp gia tăng sản lượng nghiên cứu."
 paragon_applied_society:0 "Cảm hứng hiếm - Xã hội học"
 paragon_applied_society_desc:0 "$paragon_applied_physics_desc$"
 paragon_applied_engineering:0 "Cảm hứng hiếm - Công trình học"
 paragon_applied_engineering_desc:0 "$paragon_applied_physics_desc$"

 paragon_confiscated_contraband:0 "Tịch thu hàng cấm"
 paragon_confiscated_contraband_desc:0 "Lực lượng an ninh của chúng ta đã đột kích nhà kho chính của bọn buôn lậu địa phương, e là chúng sắp gặp chút rắc rối trong khâu vận hành rồi đây."

 paragon_unified_council:0 "Nội các đoàn kết"
 paragon_unified_council_desc:1 "Nội các của chúng ta đã gắn kết với nhau vì một mục tiêu chung."

 paragon_scientific_progress:0 "Tiến bộ khoa học"
 paragon_scientific_progress_desc:1 "Nhờ vào sự phát triển mạnh mẽ gần đây của cộng đồng khoa học, các nhà nghiên cứu của chúng ta có thêm động lực để tiến hành các thử nghiệm và nghiên cứu công nghệ mới."

 paragon_data_leak:0 "Rò rỉ dữ liệu nghiêm trọng"
 paragon_data_leak_desc:1 "Kẻ thiếu chuyên môn chịu trách nhiệm cho sự cố này vẫn đang nắm giữ chức vụ cao cấp trong chính phủ, khiến dư luận xã hội vô cùng phẫn nộ."
 paragon_data_leak_punished:0 "Rò rỉ dữ liệu"
 paragon_data_leak_punished_desc:0 "Hệ thống xã hội của chúng ta đã bị tổn hại sau vụ rò rỉ tài liệu gần đây và cần được khắc phục toàn diện."

 paragon_stylish_trends:0 "Trào lưu mới"
 paragon_stylish_trends_desc:1 "Những cơn sốt thẩm mỹ đến rồi đi, chúng lan truyền chóng mặt trong công dân và cũng lụi tàn nhanh không kém."

 paragon_inspired_rhetoric:0 "Lời lẽ xuất chúng"
 paragon_inspired_rhetoric_desc:1 "Nhân dân ta đã được truyền lửa bởi bài diễn thuyết hùng hồn, đoàn kết đứng dưới ngọn cờ ái quốc."

 paragon_individualistic_tendency_approved:0 "Chấp thuận thiên hướng cá nhân chủ nghĩa"
 paragon_individualistic_tendency_approved_desc:1 "Thiên hướng cá nhân chủ nghĩa phần lớn đã bị kiềm chế. Tuy gây ra một số xáo trộn, nhưng nó cũng mang lại cho chúng ta một cơ hội nghiên cứu đặc biệt."
 paragon_individualistic_tendency_discarded:0 "Loại bỏ thiên hướng cá nhân chủ nghĩa"
 paragon_individualistic_tendency_discarded_desc:0 "Thiên hướng cá nhân chủ nghĩa đã được nghiên cứu và uốn nắn, qua đó tạo nên một ý thức đoàn kết hơn."

 paragon_empire_wide_scandal:0 "Bê bối toàn quốc"
 paragon_empire_wide_scandal_desc:0 "Người dân vô cùng phẫn nộ và biểu tình phản đối quyết định giữ lại viên chức nội các đáng xấu hổ này."
 paragon_empire_wide_scandal_averted:0 "Xử lý bê bối"
 paragon_empire_wide_scandal_averted_desc:1 "Người dân bày tỏ sự ủng hộ đối với quyết định bãi nhiệm viên chức nội các đáng xấu hổ của chúng ta."

