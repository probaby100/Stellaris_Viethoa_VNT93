# TRADER ENCLAVES
##################

 leviathans.102.name:0 "Tiếp Xúc Ban Đầu Với [From.GetName]"
 leviathans.102a.desc:2 "Chào mừng đến với XuraCorp!\n\nChúng tôi là tập đoàn kinh doanh hoạt động từ hệ sao [trader_system.GetName], chuyên về thương mại - nền tảng kiến tạo của mọi nền văn minh, như chúng tôi vẫn thường nói tại XuraCorp.\n\nXin đừng ngần ngại liên hệ với chúng tôi nếu quý vị quan tâm đến một thỏa thuận béo bở."
 leviathans.102b.desc:2 "Tôi đại diện cho Sàn Giao Dịch Thương Mại Riggan. Chúng tôi đã hỗ trợ đàm phán thương mại giữa các bên quan tâm trên trạm không gian của mình tại hệ sao [trader_system.GetName] trong hơn một nghìn năm theo lịch của quý vị.\n\nNếu quý vị tình cờ sở hữu nhiều tài nguyên hơn mức cần thiết, chúng tôi rất sẵn lòng giải tỏa gánh nặng đó cho quý vị. Đương nhiên, quý vị sẽ được đền bù thỏa đáng."
 leviathans.102c.desc:2 "Hân hạnh được gặp mặt, các bạn! Tôi đại diện cho Hiệp Hội Thương Nhân Muutagan, và cho phép tôi là người đầu tiên chào đón quý vị đến với hệ sao [trader_system.GetName]. Tổ chức của chúng tôi bao gồm hàng trăm thuyền trưởng thương thuyền Muutagan độc lập dũng cảm vượt qua các tuyến đường không gian để tìm kiếm những thương vụ hời tiếp theo.\n\nTại các cơ sở của chúng tôi, quý vị sẽ có thể giao dịch đổi lấy tài nguyên dư thừa của mình. Xin vui lòng liên hệ với chúng tôi nếu quý vị quan tâm đến sự sắp xếp như vậy."

 leviathans.100.a:0 "Chúng tôi muốn thực hiện một cuộc giao dịch."
 leviathans.100.b:0 "Tắt màn hình liên lạc."

 leviathans.100.name:0 "XuraCorp"
 leviathans.100a.desc:0 "Chúng tôi không phân biệt đối xử với các khách hàng tiềm năng tại XuraCorp. Chúng tôi là ai mà dám phán xét đạo đức của quốc gia sao các vị chứ?"
 leviathans.100b.desc:0 "Có thể các vị cần khoáng sản để đóng chiến hạm. Có thể các vị cần chúng để xây trại trẻ mồ côi! Tại XuraCorp, tôn chỉ kinh doanh của chúng tôi là không quan tâm!"
 leviathans.100c.desc:0 "Không cần thắc mắc - chỉ cung cấp tài nguyên chất lượng, sẵn sàng bơm thẳng vào huyết mạch công nghiệp của các vị!"
 leviathans.100d.desc:1 "Rất tiếc là không hoàn tiền. Chính sách của công ty... Chuyện đó vượt ngoài tầm kiểm soát của [xuracorp_country.species.GetHandNamePlural] chúng tôi."
 leviathans.100e.desc:1 "Liệu quý vị có hứng thú với một số thiết bị chưng cất không nhãn hiệu không? Không ư? Vậy còn máy dò hạt thì sao?"
 leviathans.100f.desc:0 "Quý vị đã liên hệ với XuraCorp. Chúng tôi có thể giúp gì cho quý vị?"

 leviathans.103.name:0 "Sàn Giao Dịch Thương Mại Riggan"
 leviathans.103a.desc:0 "Tất cả các khách hàng của chúng tôi đều được ẩn danh tuyệt đối."
 leviathans.103b.desc:1 "Tài nguyên của chúng tôi đến từ đâu ư? Hãy tin tôi đi... Tốt nhất cho tất cả các bên liên quan - bao gồm cả [Root.GetName] - là chúng ta nên giữ kín một chút thông tin đó cho riêng mình..."
 leviathans.103c.desc:0 "Chúng tôi không buôn bán nô lệ. Xin lỗi, không có ngoại lệ."
 leviathans.103d.desc:0 "Sàn Giao Dịch Thương Mại Riggan xin gửi lời chào đến quý vị."
 leviathans.103e.desc:0 "Một nghìn năm qua và chúng tôi vẫn đứng vững trên thương trường. Nếu điều đó không nói lên uy tín của chúng tôi, tôi không biết điều gì có thể chứng minh nữa."
 leviathans.103f.desc:0 "Một số đối tác trên trạm sao của chúng tôi đã bày tỏ sự quan tâm đến việc giao dịch với [Root.GetName]. Chúng ta có nên đàm phán một thỏa thuận không?"

 leviathans.104.name:0 "Hiệp Hội Thương Nhân Muutagan"
 leviathans.104a.desc:0 "Hàng nghìn năm trước, Đế Chế Muutagan từng trải rộng khắp một phần lớn thiên hà. Chúng tôi là tất cả những gì còn sót lại."
 leviathans.104b.desc:1 "Người ta nói rằng một người Muutagan có thể đánh hơi thấy một món hời từ khoảng cách mười hai parsec. Chuyện này hơi phóng đại quá rồi... Thật ra khoảng cách đó chỉ có tám parsec thôi."
 leviathans.104c.desc:0 "Hiệp Hội Thương Nhân Muutagan chào đón quý vị. Quý vị có muốn làm một chuyến giao dịch không?"
 leviathans.104d.desc:1 "Một người Muutagan và một người Rixidaran bước vào quán rượu... Thôi bỏ đi, chuyện này không phải là đề tài trò chuyện thích hợp. Tôi xin quý vị lượng thứ."
 leviathans.104e.desc:0 "Kính chào, [Root.GetSpeciesName]. Quý vị đến đây để giao dịch với chúng tôi, đúng chứ?"
 leviathans.104f.desc:0 "Từ \"giảm giá\" bị coi là một lời báng bổ đối với dân tộc chúng tôi. Xin hãy ghi nhớ điều này khi trò chuyện với chúng tôi."

