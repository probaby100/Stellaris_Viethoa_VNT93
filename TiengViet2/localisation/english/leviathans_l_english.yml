 leviathans.99.name:0 "Thiết Lập Liên Lạc"
 leviathans.99.desc:1 "Sau khi dịch thành công ngôn ngữ của họ, chúng ta đã thiết lập liên lạc với trạm không gian độc lập của §Y[From.From.GetName]§!."

