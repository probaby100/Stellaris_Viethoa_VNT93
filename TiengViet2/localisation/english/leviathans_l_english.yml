 leviathans.142.desc.known:1 "Các báo cáo cho thấy lực lượng tấn công thuộc về [trader_destroyer.GetName]!"
 leviathans.142.desc.unknown:1 "Theo thông tin tình báo của chúng ta, hành động này được thực hiện bởi các thế lực mà chúng ta chưa hề hay biết."
 leviathans.142.desc.second:0 "Một vài thành viên hội đồng quản trị còn sống sót đã tuyên bố phá sản, và các tài sản còn lại của tập đoàn đang được thanh lý."
 leviathans.142.desc.trade:1 "Thật không may, các cơ sở sản xuất Khí Ngoại Lai của họ đã bị phá hủy cùng với tổng hành dinh XuraCorp, và chúng ta sẽ không còn quyền tiếp cận kênh tài nguyên chiến lược này nữa."
 leviathans.142.a:0 "Một đòn giáng mạnh vào thương mại tự do."
 leviathans.142.b:1 "Chúng ta đã trả rất nhiều năng lượng cho số khí đó!"

 leviathans.143.a.desc:0 "$leviathans.143.desc.first$ $leviathans.143.desc.known$"
 leviathans.143.b.desc:0 "$leviathans.143.desc.first$ $leviathans.143.desc.unknown$"
 leviathans.143.c.desc:0 "$leviathans.143.desc.first$ $leviathans.143.desc.known$\n\n$leviathans.143.desc.trade$"
 leviathans.143.d.desc:0 "$leviathans.143.desc.first$ $leviathans.143.desc.unknown$\n\n$leviathans.143.desc.trade$"
 leviathans.143.desc.first:1 "Trạm sao thuộc về §YSàn Giao Dịch Thương Mại Riggan§! đã bị phá hủy tại hệ sao [trader_system.GetName]. Tiền đồn tự do này đã tạo điều kiện thuận lợi cho thương mại giữa các nền văn minh liên sao trong hơn một thiên niên kỷ, nhưng giờ đây không còn nữa."
 leviathans.143.desc.known:0 "Lực lượng của [trader_destroyer.GetName] đã bảo đảm chắc chắn điều đó."
 leviathans.143.desc.unknown:0 "Lực lượng từ một kẻ xâm lược chưa xác định danh tính đã bảo đảm chắc chắn điều đó."
 leviathans.143.desc.trade:1 "Thật không may, điều này cũng đã triệt tiêu một nguồn cung cấp Bụi Bất Ổn. Chúng ta sẽ không còn quyền tiếp cận kênh tài nguyên chiến lược này nữa."
 leviathans.143.a:0 "Một diễn biến đáng báo động."
 leviathans.143.b:0 "Chúng ta đã thanh toán đầy đủ cho số gia vị đó!"

 leviathans.144.a.desc:0 "$leviathans.144.desc.first$ $leviathans.144.desc.known$ $leviathans.144.desc.second$"
 leviathans.144.b.desc:0 "$leviathans.144.desc.first$ $leviathans.144.desc.unknown$ $leviathans.144.desc.second$"
 leviathans.144.c.desc:0 "$leviathans.144.desc.first$ $leviathans.144.desc.known$ $leviathans.144.desc.second$\n\n$leviathans.144.desc.trade$"
 leviathans.144.d.desc:0 "$leviathans.144.desc.first$ $leviathans.144.desc.unknown$ $leviathans.144.desc.second$\n\n$leviathans.144.desc.trade$"
 leviathans.144.desc.first:1 "Các báo cáo gửi về cho biết tổng hành dinh của §YHiệp Hội Thương Nhân Muutagan§! tại hệ sao [trader_system.GetName] đã bị nghiền nát thành tro bụi."
 leviathans.144.desc.known:1 "Các lực lượng thuộc về [trader_destroyer.GetName] dường như đứng sau cuộc tấn công này."
 leviathans.144.desc.unknown:1 "Những kẻ tấn công dường như đến từ một đế chế mà chúng ta vẫn chưa hề hay biết."
 leviathans.144.desc.second:1 "Một số ít thuyền trưởng thương thuyền Muutagan còn sống sót đã phân tán khắp thiên hà."
 leviathans.144.desc.trade:2 "Thật không may, điều này đồng nghĩa với việc chấm dứt quá trình sản xuất Tinh Thể Hiếm quý giá của họ. Chúng ta sẽ không còn quyền tiếp cận kênh tài nguyên chiến lược này nữa."
 leviathans.144.a:0 "Một sự gián đoạn thương mại đáng kể."
 leviathans.144.b:0 "Các tinh thể của chúng ta! Chuyện này không thể bỏ qua được!"

 leviathans.150.desc:1 "Kính gửi quý khách hàng trân quý, chúng tôi vô cùng tiếc nuối khi phải thông báo rằng thỏa thuận thương mại xuất khẩu Khí Ngoại Lai đến các thế giới của [Root.GetName] đã kết thúc thời hạn. Đương nhiên chúng tôi rất sẵn lòng gia hạn thỏa thuận thêm mười năm nữa nếu quý vị còn dư dả năng lượng..."
 leviathans.150.a:0 "Rất tốt. Chúng tôi muốn gia hạn thỏa thuận."
 leviathans.150.b:1 "Tạm thời chúng tôi không cần khí của các vị nữa."
 leviathans.150.c:0 "Chúng tôi không đủ khả năng tài chính để tiếp tục thỏa thuận này."
 leviathans.151.desc:1 "Chúng ta đã đến ngày kết thúc thỏa thuận, [Root.GetSpeciesName]. Chúng tôi đã vận chuyển Bụi Bất Ổn đến các thế giới của quý vị suốt mười năm qua. Chúng ta có nên tiếp tục thêm mười năm nữa, hay quý vị muốn chấm dứt sự sắp xếp này?"
 leviathans.151.a:1 "Hãy tiếp tục. Dòng chảy hạt bụi không thể ngừng."
 leviathans.151.b:0 "Hiện tại chúng tôi không có nhu cầu về loại gia vị của các vị."
 leviathans.152.desc:1 "Thời gian thấm thoắt thoi đưa, phải không, [Root.GetSpeciesName]? Đã mười năm trôi qua kể từ khi chúng ta dàn xếp thỏa thuận thương mại Tinh Thể Hiếm. Quý vị có muốn gia hạn thỏa thuận thêm một thập kỷ nữa không?"
 leviathans.152.a:0 "Có. Hãy tiếp tục thỏa thuận này."
 leviathans.152.b:0 "Hiện tại chúng tôi sẽ tạm bỏ qua các tinh thể của các vị."

 leviathans.156.desc:0 "Các cuộc tấn công liều lĩnh của các vị đã đẩy tài sản và nhân viên của XuraCorp vào vòng nguy hiểm. Chúng tôi không còn lựa chọn nào khác ngoài việc chấm dứt thỏa thuận thương mại hiện tại. Sẽ không có việc hoàn tiền đâu."
 leviathans.156.desc.notrade:0 "Cuộc tấn công liều lĩnh của các vị đe dọa cả tài sản lẫn nhân viên của XuraCorp. Các vị nên nhớ rằng mối quan hệ khách hàng tốt đẹp luôn phải đến từ cả hai phía."
 leviathans.156.a:0 "Chấm dứt liên lạc."
 leviathans.157a.desc:0 "Tôi e rằng việc làm ăn với hải tặc là đi ngược lại chính sách của công ty."
 leviathans.157b.desc:0 "Các vị không phải là khách hàng được chấp nhận."
 leviathans.157c.desc:0 "Chúng tôi không có điều gì để bàn bạc với các vị cả."
 leviathans.159.desc:1 "Các cuộc tấn công của các vị nhằm vào trạm của chúng tôi là không thể dung thứ! Các vị đã bị cắt đứt nguồn cung, các vị hiểu chứ? Các vị có thể coi thỏa thuận thương mại của chúng ta là vô hiệu và bị hủy bỏ."
 leviathans.159.desc.notrade:0 "Cuộc tấn công này là vô cớ và hoàn toàn vô lý! Chúng tôi sẽ không nhượng bộ trước hành vi đó. Hãy tự coi mình đã bị cắt đứt liên lạc." #addressing the player empire as a whole
 leviathans.160a.desc:0 "Các vị là một quốc gia của lũ cướp và những kẻ khát máu. Chúng tôi sẽ không có bất kỳ quan hệ nào với các vị."
 leviathans.160b.desc:0 "Lũ cặn bã hải tặc."
 leviathans.160c.desc:0 "Các cuộc tấn công của các vị là không thể tha thứ."
 leviathans.162.desc:2 "À, vậy là lũ hải tặc cuối cùng cũng lộ rõ bộ mặt thật! Các vị hãy quên thỏa thuận thương mại của chúng ta đi! Sẽ không có một người Muutagan nào làm ăn với [Root.GetName] một lần nữa đâu."
 leviathans.162.desc.notrade:0 "Các vị dám tấn công chúng tôi sao?! Hãy nhớ lấy điều này, lũ cướp biển: chúng tôi không bao giờ chấp nhận hành vi dã man như vậy."
 leviathans.163a.desc:0 "Các vị là những kẻ khủng bố! Đừng tưởng rằng chúng tôi sẽ quên đi hành vi xâm lược chống lại nhân dân chúng tôi."
 leviathans.163b.desc:0 "Các vị sẽ nhận thấy rằng người Muutagan có trí nhớ rất dai dẳng đấy, [Root.GetSpeciesName]. Chúng tôi không bao giờ quên sự xúc phạm."
 leviathans.163c.desc:0 "Chúng tôi sẽ không bao giờ tin tưởng [Root.GetName] thêm một lần nào nữa."

##################
# ARTISAN ENCLAVE
##################

 ENCLAVE_DIPLOMACY_TITLE: "Ngoại Giao Đặc Khu"

 leviathans.295.desc:0 "Một vị khách! Đây quả thực là một dịp vô cùng hân hoan! Ôi, xin thứ lỗi cho sự thất lễ của tôi. Tôi tin rằng việc giới thiệu là điều cần thiết. Chúng tôi là Đoàn Nghệ Nhân.\n\nCác thành viên của chúng tôi đã cống hiến cả cuộc đời cho việc theo đuổi nghệ thuật, âm nhạc, văn hóa và tất cả những điều khiến sự tồn tại của một sinh linh có tri giác trở nên đáng giá. Xin mời, nếu quý vị muốn cùng sẻ chia sự kỳ diệu từ những tạo tác của chúng tôi, đừng ngần ngại liên hệ với chúng tôi!"

 leviathans.300.name:0 "§YĐặc Khu:§! Đoàn Nghệ Nhân"
 leviathans.300.desc:3 "Kính chào! Tôi, Đoàn Trưởng của Đoàn Nghệ Nhân, chúc quý vị một ngày tràn ngập cảm hứng sáng tạo.\n\nChúng tôi có thể giúp gì cho quý vị? Có thể là tạo ra một tác phẩm nghệ thuật để quý vị thưởng ngoạn? Hay có lẽ quý vị muốn bảo trợ cho đặc khu của chúng tôi trong việc kiến tạo vẻ đẹp siêu phàm ngoài trần thế?" #'do you for' phrasing is intentional, humorous
 leviathans.300a.desc:0 "Hửm? Ôi, xin lượng thứ cho sự mơ mộng của tôi. Đôi khi nàng thơ này của tôi quả thực... quá mãnh liệt. Còn điều gì khác chúng tôi có thể làm cho quý vị không?"
 leviathans.300b.desc:0 "Đã bao giờ quý vị dừng chân để chiêm ngưỡng vẻ huy hoàng tột bậc của tất cả những điều này chưa? Chúng tôi ở đây, và quý vị ở đó. Thật là một cơ duyên kỳ diệu! Tôi cảm thấy một khúc ballad đang chuẩn bị ra đời."
 leviathans.300c.desc:0 "Vâng? Xin chào? À, là quý vị! Xin tha lỗi; tôi vừa bị mắc kẹt khi cố theo đuổi một khổ thơ đặc biệt khó nắm bắt. Tôi có thể giúp gì?"
 leviathans.300.a:1 "Chúng tôi muốn ủy thác một §Ytác phẩm nghệ thuật§!."
 leviathans.300.a.reply:0 "Đáng tiếc là chúng tôi không thể cung cấp thêm nữa, kẻo chúng tôi lại nghĩ rằng quý vị đã không trân trọng những tác phẩm mà quý vị đã mua. Quý vị thấy đấy, chúng tôi phải giữ gìn lòng tự trọng của mình."
 leviathans.300.b:1 "Chúng tôi muốn trở thành §Ynhà bảo trợ§! của các vị."
 leviathans.300.b.stop:1 "Chúng tôi muốn §Yhủy bỏ sự bảo trợ§! của mình."
 leviathans.300.b.stop.tooltip:0 "§RDừng§! việc nhận £opinion£ Độ Hài Lòng hàng tháng\n\n"
 leviathans.300.b.reply:2 "Ồ, tôi hiểu rồi. Thật đáng tiếc, [root.GetSpeciesAdj], nhưng chúng tôi cảm ơn sự ủng hộ ban đầu của quý vị.\n\nTạm biệt."
 leviathans.300.c:1 "Tổ chức một §Ylễ hội§! trên khắp các thế giới của chúng tôi."
 leviathans.300.c.allow:0 "$requires_enclave_opinion$ §G+50§!."
 leviathans.300.c.outofstock:2 "Chúng tôi chỉ có thể tổ chức một §YLễ Hội Các Thế Giới§! mỗi 20 năm."
 leviathans.300.d:1 "§YHãy kể cho chúng tôi nhiều hơn§! về đoàn của các vị."
 leviathans.300.d.reply:1 "Chúng tôi là Đoàn Nghệ Nhân. Đoàn bao gồm nhiều trạm không gian là nơi cư ngụ của những tài năng sáng tạo đến từ nhiều thế giới, tất cả hợp nhất trong khát vọng kiến tạo vẻ đẹp mới trong những bến đỗ an toàn này. Họ mang những ý tưởng và phương pháp từ khắp nơi trong thiên hà tới, và cùng nhau chúng tôi khám phá những biểu đạt tối thượng của bản ngã!\n\nChúng tôi cung cấp nhiều dịch vụ cho những ai muốn thưởng thức nghệ thuật. Nếu quý vị giúp bảo trợ cho công việc của chúng tôi, chúng tôi thậm chí sẵn lòng tổ chức các sự kiện quy mô lớn hơn cho nhân dân của quý vị!"
 leviathans.300.e:0 "Các vị còn có thể làm gì khác?"
 leviathans.300.f:1 "Chúng tôi muốn đầu tư vào một §YBộ Văn Hóa§!."
 requires_enclave_opinion: "£opinion£ Độ Hài Lòng của §Y[root.GetName]§! đạt ít nhất"

 leviathans.301.name:0 "[from.GetName]" #country - may return as an unknown name
 leviathans.301.desc:0 "Đoàn Nghệ Nhân không phản hồi các tín hiệu gọi của chúng ta."
 leviathans.301.desc.unknown:1 "Bỏ qua vấn đề dịch thuật, một khi chúng ta trao đổi thông tin với [From.GetName], họ đã đóng mọi kênh liên lạc và từ chối nói chuyện với chúng ta."
 leviathans.301.a:0 "Sao họ dám làm vậy?!"

 leviathans.304a.desc:0 "Cảm ơn quý vị rất nhiều! Ôi, thật là một hành động cao quý khi giúp mang thêm nhiều nghệ thuật vào vũ trụ. Chúng tôi tự tin rằng quý vị sẽ hài lòng."
 leviathans.304b.desc:0 "Các vì sao tỏa sáng rực rỡ hơn đôi chút nhờ những hành động của quý vị tại đây hôm nay!"
 leviathans.304c.desc:0 "Chúng tôi biết có điều gì đó đặc biệt ở các vị [root.GetSpeciesAdj]. Quả thực, quý vị là những sinh linh có gu thưởng thức tinh tế."

 leviathans.305.desc:2 "Tuyệt diệu! Chúng tôi rất vui lòng giao phó một trong những tạo tác của mình cho quý vị. Nó chắc chắn sẽ mang lại niềm vui cho nhân dân trong đế chế của quý vị."
 leviathans.305.a.tooltip:3 "Mở khóa §YQuyết Định§! §S£decision£ $decision_art_monument$§! có thể ban hành trên thuộc địa với các hiệu ứng sau:\n£amenities£ $MOD_PLANET_AMENITIES_MULT$ §G+15%§!\n$MOD_PLANET_IMMIGRATION_PULL_MULT$: §G+50%§!"
 leviathans.305.a.reply:1 "Tuyệt vời! Tác phẩm sẽ được gửi tới cơ sở lưu trữ của quý vị một cách nhanh nhất. Đơn giản chỉ cần yêu cầu chính quyền hành tinh của quý vị ban hành §YQuyết Định§! trên bất kỳ hành tinh nào quý vị muốn.\n\nChúng tôi xin khiêm nhường cảm ơn sự bảo trợ của quý vị."

 leviathans.330.desc:2 "Tổ chức một lễ hội ở quy mô đó đòi hỏi tất cả các nghệ sĩ của chúng tôi phải dốc toàn bộ tài năng. Đó không phải là một công việc dễ dàng, cũng không hề rẻ rúng chút nào."
 leviathans.330.a.reply:0 "Tuyệt vời! Chúng tôi sẽ rất vui mừng được kiến tạo nên Lễ Hội Các Thế Giới tráng lệ này!"

 leviathans.310.desc:2 "Điều đó sẽ rất hữu ích, cho phép chúng tôi thử nghiệm các ý tưởng mới và chấp nhận nhiều rủi ro hơn trong quy trình sáng tạo. Chúng tôi có một chương trình kéo dài §Ymười năm§! với chi phí trả trước một lần."
 leviathans.310.a.tooltip:0 "Nhận §G£opinion£ Độ Hài Lòng +1§! với §YĐoàn Nghệ Nhân§! mỗi tháng\n\n"
 leviathans.310.a.reply:0 "Cảm ơn quý vị rất nhiều! Giờ đây, với sự đóng góp hào phóng của quý vị, chúng tôi sẽ có thể mở rộng chính khái niệm nghệ thuật! Đương nhiên chúng tôi cũng sẽ gửi bản tin định kỳ tới tất cả các nhà bảo trợ."
 leviathans.307.desc:1 "Nền kinh tế của chúng ta không còn có thể gánh vác vai trò là nhà bảo trợ của Đoàn Nghệ Nhân nữa. Họ sẽ không còn nhận được tài trợ từ đế chế của chúng ta. Điều này chắc chắn sẽ làm rạn nứt mối quan hệ của chúng ta với đặc khu."
 leviathans.307.a.tooltip:0 "§RXóa bỏ§! sửa đổi đế chế §Y$enclave_artist_patron$§!"

 leviathans.335.name:0 "Cơn Phẫn Nộ"
 leviathans.335.desc:1 "§YLễ Hội Các Thế Giới§! do Đoàn Nghệ Nhân tổ chức đã từng mang lại niềm vui cho nhân dân [Root.GetName]. Than ôi, điều đó đã không thể kéo dài.\n\nTrên [this_planet.GetName], các hoạt động lễ hội đã dẫn đến một vụ giẫm đạp kinh hoàng trong đám đông, cướp đi sinh mạng của hàng nghìn công dân. Hiện vẫn chưa rõ hoàn cảnh nào dẫn đến tổn thất nhân mạng bi thảm này, nhưng sự oán giận đang ngày càng gia tăng đối với cả chính quyền của chúng ta lẫn ban tổ chức lễ hội."
 leviathans.335.b:0 "Chuyển hướng sự chú ý của truyền thông."
 leviathans.336.name:0 "Niềm Hân Hoan"
 leviathans.336.desc:1 "Nhờ vào sự ngập tràn hạnh phúc được lan tỏa bởi §YLễ Hội Các Thế Giới§!, một số người tổ chức sự kiện đã bắt đầu đem lòng yêu mến lối sống của chúng ta. Họ tuyên bố mong muốn được ở lại đây; định cư và trở thành một phần của đế chế chúng ta."
 leviathans.336.a:0 "Hãy để họ ở lại."
 leviathans.336.b:0 "Họ nên rời đi."
 leviathans.337.name:0 "Sự Phản Bội"
 leviathans.337.desc:1 "§YLễ Hội Các Thế Giới§! đã đột ngột dừng lại. Đoàn Nghệ Nhân đã thu dọn hành lý và rời đi mà không hề nói một lời giải thích lý do.\n\nViệc khám xét kỹ lưỡng các khu cắm trại và vũ đài của họ chỉ tiết lộ rằng một lượng tài nguyên đáng kể đã biến mất."
 leviathans.337.a:0 "Lũ trộm cắp!"
 leviathans.337.a.tooltip:0 "Đoàn Nghệ Nhân sẽ từ chối mọi thông điệp liên lạc trong 10 năm."
 leviathans.337.b:0 "Cũng là một phần của cuộc vui thôi."
 leviathans.337.b.tooltip:0 "Đoàn Nghệ Nhân được tha thứ cho những lỗi lầm của họ."
 leviathans.337.c:0 "Tịch thu khu cắm trại của họ."
 tent_heist: "Vụ Cướp Khu Cắm Trại"
 cultural_clemency: "Khoan Dung Văn Hóa"
 leviathans.315.desc:1 "Kính gửi [Root.GetRulerTitle] [Root.GetRulerName] tôn quý: một thập kỷ trước [Root.GetName] đã cam kết ủng hộ Đoàn Nghệ Nhân, và quý vị đã làm đúng như vậy.\n\nThời gian bảo trợ của quý vị sắp kết thúc, nhưng sẽ thật thiếu sót nếu chúng tôi không hỏi: liệu quý vị có muốn gia hạn gói đăng ký cho những tác phẩm nghệ thuật và thủ công tinh xảo nhất thiên hà không?"

 leviathans.321.name:0 "Bản Tin Bảo Trợ"
 leviathans.321.desc:0 "Dưới đây là bản tin mới nhất dành cho tất cả các nhà bảo trợ của chúng tôi:\n\n"
 leviathans.321.desc.a:1 "Đáng buồn là không có nhiều tác phẩm được tạo ra trong đặc khu. Hầu hết các nghệ sĩ đã rơi vào trạng thái u sầu sâu sắc, nơi không thể tìm thấy nguồn cảm hứng nào. Tâm trạng rất ảm đạm, nhưng vẫn tràn đầy hy vọng. Rốt cuộc, sáng tạo cần có thời gian.\n\nBất kỳ khoản quyên góp nào có thể giúp nhóm khơi dậy lại mối quan tâm của họ đối với cõi vật chất sẽ là sự giúp đỡ vô cùng to lớn."
 leviathans.321.desc.b:1 "Đặc khu đã rất bận rộn trong vài tháng qua. Các sảnh đường của chúng tôi đang rộn ràng với một loại công nghệ mới do một cư dân phát minh, có khả năng truyền cảm giác mùi hương đến người dùng. Cỗ máy đáng chú ý này chắc chắn sẽ thay đổi mọi thứ.\n\nĐể phát triển thêm ý tưởng này, chúng tôi sẽ cần thêm các khoản quyên góp."
 leviathans.321.desc.c:1 "Đặc khu đang trong một tâm trạng đầy phấn khích. Việc tạo ra thiết bị Scentilus Rift đã khiến nhiều nghệ sĩ chuyển trọng tâm chính của họ sang việc tạo ra những trải nghiệm mới cho nó. Cho đến nay, thành quả đáng chú ý nhất từ nỗ lực này là một bản giao hưởng được truyền tải qua mùi hương.\n\nCông việc của chúng tôi vẫn tiếp tục và mọi khoản quyên góp sẽ được đón nhận một cách vui vẻ."
 leviathans.321.desc.d:0 "Chúng tôi đã từ bỏ các nỗ lực tạo ra phương tiện truyền thông tập trung vào mùi hương. Đó là một ý tưởng ngớ ngẩn và chẳng mang lại điều gì ngoài sự lãng phí thời gian cùng những mùi hôi khó chịu.\n\nĐể tìm lại hướng đi đúng đắn, chúng tôi sẽ cần các khoản quyên góp từ những nhà bảo trợ đáng tin cậy. Chúng tôi cảm ơn quý vị vì sự ủng hộ không ngừng!"
 leviathans.321.a:0 "Chúng tôi muốn quyên góp."
#  leviathans.321.a.reply:0 "We joyously accept your donation and promise that it will be used in the most creative of endeavors!"
 leviathans.321.c:0 "Hiện tại chúng tôi không đủ khả năng quyên góp."
 leviathans.321.b:1 "Chúng tôi muốn hủy đăng ký nhận bản tin này."
 leviathans.322.name:0 "Lợi Ích Bảo Trợ"
 leviathans.322.desc:3 "Kính chào nhà bảo trợ [Root.GetRulerName]! Chúng tôi đã nghĩ ra một loại hình kiến trúc lộng lẫy mới, được tinh chỉnh đặc biệt để nâng cao sự thấu hiểu lẫn nhau giữa đám đông - một §YBộ Văn Hóa§!. Nó hoạt động nhờ sự kết hợp giữa việc tận dụng định kiến tiềm thức của người dân chống lại nhau và nghệ thuật, sau đó đập tan tất cả và thể hiện một hình thái đoàn kết mới.\n\nQuý vị có muốn mua công trình này không? Nó chắc chắn sẽ chứng minh được sự hữu ích trong việc gắn kết đế chế của quý vị lại với nhau. Và đó là một món hời, nếu tôi được phép tự nhận xét!"
 leviathans.322.a.tooltip:3 "Mở khóa công trình §S£building£ ['building:building_artist_patron']§!"
 leviathans.322.a.tooltip.hive:0 "$leviathans.322.a.tooltip$"
 leviathans.322.a.tooltip.machine:0 "$leviathans.322.a.tooltip$"
 leviathans.323.name:0 "Cập Nhật Kém Hào Hứng"
 leviathans.323.desc:1 "Chúng tôi xin lỗi, nhà bảo trợ [Root.GetRulerName]: chúng tôi đáng tiếc đã vấp phải một rào cản sáng tạo. Đặc khu đang trong tình trạng hỗn loạn và chúng tôi không có gì để cống hiến vào lúc này. Chúng tôi luôn cảm ơn sự bảo trợ của quý vị, như thường lệ."
 leviathans.323.a:0 "Chúng tôi hy vọng tình hình sẽ được cải thiện."
#  leviathans.323.a.reply:0 "We humbly thank you for your kind words, and will send them along to the rest of the troupe."
 leviathans.323.b:0 "Chúng tôi yêu cầu hoàn tiền!"
#  leviathans.323.b.reply:0 "We understand. We wish it were not so, but we will respect your wish and return your resources.\n\nGoodbye, patron."
 leviathans.324.name:0 "Nghệ Thuật Vụn Vỡ"
 leviathans.324.desc:1 "Kính chào nhà bảo trợ [Root.GetRulerName]. Gần đây chúng tôi buộc phải tháo dỡ hầu hết các thiết bị kỹ thuật của mình do một sự cố hỏng hóc lớn. Liệu các vật liệu và phế liệu đó có hữu ích cho quý vị phần nào không?"
 leviathans.324.a:0 "Chúng tôi sẽ thu hồi các vật liệu."
#  leviathans.324.a.reply:0 "That is good, then it won't go to waste."
 leviathans.324.b:0 "Chúng tôi sẽ sửa chữa nó giúp các vị."
#  leviathans.324.b.reply:0 "Oh, thank you kindly, patron [Root.GetRulerName]! This will save us a tremendous amount of time and resources. We are in your debt."
 leviathans.325.desc:0 "Chúng tôi vô cùng tiếc khi nghe điều đó, ôi nhà bảo trợ! Không có bản tin, chúng tôi sẽ không thể cập nhật cho quý vị về những thành tựu mới nhất của chúng tôi..."

 leviathans.345.name:0 "Bộ Văn Hóa"
 leviathans.345.desc:2 "À, §YBộ Văn Hóa§!... Nó được thiết kế để thách thức các luồng tư tưởng bất đồng và thúc đẩy sự đoàn kết lớn hơn trên toàn đế chế của quý vị thông qua lăng kính nghệ thuật. Một kiệt tác thực sự, nếu tôi được phép tự hào."
 leviathans.345.a.reply:0 "Tuyệt vời! Tác phẩm sẽ được gửi đến kho lưu trữ của quý vị ngay lập tức. Đơn giản chỉ cần yêu cầu các kỹ sư xây dựng nó trên bất kỳ hành tinh nào quý vị muốn.\nChúng tôi xin khiêm nhường cảm ơn sự bảo trợ của quý vị."

 leviathans.352.desc:0 "Chúng ta đã nhận được một tín hiệu truyền tin từ Đoàn Nghệ Nhân. Một trong những trạm không gian của họ đã bị phá hủy!"
 leviathans.353.desc:0 "Chúng ta đã nhận được tín hiệu cầu cứu từ đoàn trưởng của Đoàn Nghệ Nhân. Trạm không gian cuối cùng và là bến đỗ văn hóa của họ đã bị phá hủy. Có rất ít người sống sót, và đoàn nghệ nhân về cơ bản đã không còn tồn tại."
 leviathans.354.desc:0 "Sau khi phá hủy trạm không gian của Đoàn Nghệ Nhân, chúng ta đã tìm thấy rất nhiều tài nguyên để thu hồi từ đống đổ nát. Những khoản quyên góp, quà tặng và tác phẩm chất đống trong các sảnh đường của nó giờ đang trôi dạt trong không gian, sẵn sàng để chúng ta thu gom."
 leviathans.354.desc.unknown:1 "Sau khi phá hủy cơ sở trạm trôi dạt trong hệ sao [station_system.GetName], chúng ta đã tìm thấy rất nhiều tài nguyên có giá trị trong số tàn tích của nó."

##################
# CURATOR ENCLAVE
##################

 leviathans.500.name:0 "Hội Giám Tuyển"
 leviathans.500a.desc:0 "Có lẽ quý vị đang tự hỏi về ý nghĩa của những hình thù quý vị nhìn thấy trên bức tranh tường phía sau tôi. Đó là một câu hỏi hay với một câu trả lời vô cùng thú vị! Chi phí cho thông tin này là 15 triệu tỷ năng lượng."
 leviathans.500b.desc:0 "Quý vị đã liên hệ với Hội Giám Tuyển. Chúng tôi có thể hỗ trợ gì cho quý vị?"
 leviathans.500c.desc:0 "Quý vị có biết rằng cuộc trò chuyện này đang được giám sát chặt chẽ bởi các thực thể từ bảy cõi không gian phụ khác nhau không? Than ôi, tôi e rằng công nghệ liên lạc với họ vượt quá xa khả năng hiện tại của nền văn minh các vị để có thể mang lại bất kỳ lợi ích nào."
 leviathans.500d.desc:0 "Đừng lo lắng. Chúng tôi đã cập nhật kho lưu trữ của mình với thông tin về [Root.GetName] cho các thế hệ tương lai. Quý vị sẽ được ghi nhớ rất lâu sau sự sụp đổ tất yếu của quốc gia sao của các vị."
 leviathans.500e.desc:0 "Có rất nhiều điều tôi ước mình có thể kể cho quý vị, nhưng tôi đơn giản là không thể làm điều đó miễn phí. Trạm không gian này cần rất nhiều năng lượng để vận hành... chúng tôi phải cân nhắc chi phí vận hành của mình."
 leviathans.500f.desc:0 "Kính chào quý vị thay mặt cho giáo đoàn Giám Tuyển. Có điều gì quý vị mong muốn không?"
 leviathans.500g.desc:0 "Như mọi khi, thật hân hạnh được làm việc với chính phủ của quý vị. Liệu chúng tôi có thể làm quý vị hứng thú với một số công nghệ không?"
 leviathans.500h.desc:0 "Rất vui được gặp quý vị. Tôi chắc chắn chúng ta có thể đi đến một thỏa thuận cùng có lợi trước khi ngày hôm nay khép lại."
 leviathans.500i.desc:0 "Tri thức rơi vào tay những chi kẹp sai trái có thể rất nguy hiểm, nhưng chúng tôi có thể làm gì đây? Chúng tôi cần năng lượng để thắp sáng các ngọn đèn..."
 leviathans.500j.desc:0 "Còn rất nhiều điều mà các vị chưa hề biết, [Root.GetSpeciesName]. Xin hãy... để chúng tôi khai sáng cho các vị về vũ trụ."
 leviathans.500k.desc:0 "Chúng tôi sở hữu các hải đồ sao chi tiết của toàn bộ thiên hà, được thu thập bởi các nhà thám hiểm từ hàng trăm chủng tộc khác nhau. Có lẽ chúng sẽ khơi gợi được sự quan tâm của quý vị?"
 leviathans.500l.desc:0 "Tri thức là tất cả. Nó phải được bảo tồn."

 leviathans.502.name:1 "Tiếp Xúc Ban Đầu Với [curator_enclave_country.GetName]"
 leviathans.502a.desc:0 "Kính chào những người lữ hành giữa các vì sao. Chúng tôi là Hội Giám Tuyển.\n\nGiáo đoàn cổ xưa của chúng tôi được thành lập từ hàng niên kỷ trước bởi các cường quốc thiên hà đang trỗi dậy vào thời điểm đó. Chúng tôi cống hiến cho việc bảo tồn mọi tri thức, trong nỗ lực bảo vệ thiên hà khỏi việc rơi vào một thời kỳ tăm tối khác của các cuộc tuyệt chủng hàng loạt và sự man rợ.\n\nChúng tôi đã thất bại.\n\nNgày nay chỉ còn rất ít người trong chúng tôi còn sống, nhưng chúng tôi không hề kém tận tụy với sứ mệnh thiêng liêng của mình so với các bậc tiền nhân. Chúng tôi sẵn lòng chia sẻ một số tri thức với quý vị... với một mức giá hợp lý."
 leviathans.502b.desc:1 "Hân hạnh được gặp mặt, những nhà thám hiểm. Quý vị đang nói chuyện với [curator_enclave_country.GetName]. Có lẽ quý vị đã quen thuộc với tôn chỉ của giáo đoàn cổ xưa chúng tôi. Giống như các đồng nghiệp đáng kính ở các đặc khu Giám Tuyển khác, chúng tôi sẵn lòng giao dịch với điều kiện quý vị đáp ứng được mức giá của chúng tôi."
 leviathans.502.a:0 "Rất hân hạnh."

 leviathans.500.a:1 "Chúng tôi quan tâm đến việc thu mua §Ycác hải đồ sao mới§!."
 leviathans.500.b:1 "Các vị có thể hỗ trợ chúng tôi trong việc §Ynghiên cứu§! không?"
 leviathans.500.b.alreadyaided:0 "Hội Giám Tuyển đã và đang tăng cường năng lực nghiên cứu của chúng ta."
 leviathans.500.c:1 "Hãy kể cho chúng tôi về những §Ybí ẩn§! của vũ trụ."
 leviathans.500.d:1 "Chúng tôi có thể chiêu mộ một trong các §Ynhà khoa học§! của các vị không?"
 leviathans.500.d.alreadyrecruited:0 "Chúng ta đã tuyển dụng một nhà khoa học của Hội Giám Tuyển."
 leviathans.500.d.opinion:0 "$requires_enclave_opinion$ §G+50§!."
 leviathans.500.e:0 "Các vị có thể chia sẻ các nguyên lý nền tảng của tri thức không?"
 leviathans.500.e.alreadyshared:0 "Chúng ta đã chia sẻ các nguyên lý của Hội Giám Tuyển."
 leviathans.500.e.opinion:0 "$leviathans.500.d.opinion$"
 leviathans.500.h:1 "Các vị có thể kể cho chúng tôi về những §Ykhách hàng khác§! của các vị không?"
 leviathans.500.i:0 "Các vị biết gì về §Y$lgates$§!?"
 leviathans.500.i.tooltip.noclue:2 "[curator_enclave_country.GetName] mất khoảng một thập kỷ để xác định từng §Y$clue$§! mới."
 leviathans.500.j: "Các vị có thể giúp chúng tôi phát triển §YVườn Sinh Thái§! không?"
 leviathans.500.j.opinion: "$requires_enclave_opinion$ §G+80§!."
 leviathans.500.k: "Các vị có thể hỗ trợ chúng tôi với §YBộ Sưu Tập§! của mình không?"
 leviathans.500.k.reply.reward_unavailable: "Chúng tôi xin lỗi, nhưng chúng tôi không có gì để cung cấp cho quý vị vào lúc này. Hãy thử thu thập và trưng bày thêm $specimens$. Có lẽ sau đó chúng tôi có thể chia sẻ chuyên môn của mình."
 leviathans.500.k.reply.over: "Chúng tôi xin lỗi, nhưng chúng tôi không còn gì để cung cấp cho quý vị nữa! Bộ sưu tập của quý vị thực sự vô cùng tráng lệ. Chúng tôi rất vinh dự khi có quý vị là đối tác trong thiên hà này.\n\nQuý vị là một tài sản vô giá đối với công cuộc bảo tồn tri thức."

#leviathan.500.l is nomad exploration targets and located in nomads_l_english

 leviathans.504a.desc:0 "Giáo đoàn của chúng tôi cảm ơn quý vị, khách hàng tôn quý."
 leviathans.504b.desc:0 "Cảm ơn quý vị, [root.GetSpeciesAdj]. Cầu mong sự sáng suốt và tính hiếu kỳ luôn đồng hành cùng quý vị."
 leviathans.504c.desc:0 "Thật hân hạnh được làm việc với quý vị. Những hiểu biết sâu sắc và hồ sơ vô giá của chúng tôi có thể giúp ích gì thêm cho quý vị nữa?"

#  leviathans.506.name:0 "Star Charts"
#  leviathans.506a.desc:0 "We can offer detailed, up-to-date survey data for star systems you have yet to explore. How many systems are you interested in?"
#  leviathans.506.a:0 "15 star systems."
#  leviathans.506.b:0 "10 star systems."
#  leviathans.506.c:0 "5 star systems."
 leviathans.506.d:0 "Các vị còn có thể cung cấp điều gì khác?"
#  leviathans.506.a.reply:0 "We are transmitting the survey data to you now."

 leviathans.507.name:0 "§YĐặc Khu:§! Hỗ Trợ Nghiên Cứu Của Giám Tuyển"
 leviathans.507.desc:1 "Đương nhiên rồi. Chúng tôi sẵn sàng cung cấp cho quý vị quyền truy cập hạn chế vào các ngân hàng dữ liệu sâu rộng của chúng tôi trong thời hạn mười năm chuẩn. Điều này sẽ mang lại sự thúc đẩy đáng kể cho các nỗ lực nghiên cứu của các §HPhòng Thí Nghiệm Nghiên Cứu§! trên hành tinh của các vị.\n\nĐương nhiên chúng tôi sẽ yêu cầu thù lao cho dịch vụ này, nhưng tôi nghĩ quý vị sẽ thấy mức giá của chúng tôi là rất hợp lý."
 leviathans.507.a:0 "Chúng tôi muốn mua dịch vụ này."
 leviathans.507.a.reply:0 "Một sự lựa chọn khôn ngoan, điều mà các thế hệ tương lai của [Root.GetSpeciesNamePlural] chắc chắn sẽ ca ngợi quý vị."

 leviathans.508.name:0 "Những Bí Ẩn"
 leviathans.508.desc:0 "Có những thực thể vô cùng hùng mạnh đang ẩn nấp bên trong một số hệ sao nhất định trong thiên hà của chúng ta. Với cái giá rất đắt về cả sinh mạng lẫn tài nguyên, các đặc vụ Giám Tuyển đã dày công thu thập những tri thức giúp quý vị dễ dàng đối phó hơn với những thực thể này trong lần chạm trán tiếp theo."
 leviathans.508.a:1 "Hãy kể cho chúng tôi về §Yđiều gì đó mới mẻ§!."
 leviathans.508.a.reply:0 "Điều này có thể làm quý vị hứng thú... Chúng tôi đã đánh dấu một hệ sao trong §YNhật Ký Tình Huống§! của quý vị."
 leviathans.508.b:1 "Hãy kể cho chúng tôi về §Y$NAME_Ether_Drake$§!."
 leviathans.508.c:1 "Hãy kể cho chúng tôi về §Y$NAME_Enigmatic_Fortress$§!."
 leviathans.508.d:1 "Hãy kể cho chúng tôi về §Y$NAME_Stellar_Devourer$§!."
 leviathans.508.e:1 "Hãy kể cho chúng tôi về §Y$NAME_Dimensional_Horror$§!."
 leviathans.508.f:1 "Hãy kể cho chúng tôi về §Y$NAME_Alien_Hive$§!." # Asteroid Hive
 leviathans.508.g:1 "Hãy kể cho chúng tôi về §Y$NAME_Infinity_Machine$§!."
 leviathans.508.h:1 "Hãy kể cho chúng tôi về §Y$NAME_Automated_Dreadnought$§!."
 leviathans.508.i:1 "Hãy kể cho chúng tôi về §Y$NAME_Wraith$§!."
 leviathans.508.j:1 "Hãy kể cho chúng tôi về §Y$NAME_Voidspawn$§!."
 leviathans.508.k:1 "Hãy kể cho chúng tôi về §Y$NAME_Scavenger_Bot$§!." # Scavenger Bot
 leviathans.508.l:1 "Hãy kể cho chúng tôi về §Y$NAME_Elderly_Tiyanki$§!." # Tiyanki Matriarch
 leviathans.508.m:0 "Hãy kể cho chúng tôi về §Y$NAME_Toxic_God$§!." # Toxic God
 leviathans.508.n: "Hãy kể cho chúng tôi về §Y$NAME_Opus_Sentinel$§!." # Opus Sentinel (Unplugged)

 leviathans.506.f:0 "Hạm đội hiện tại của chúng ta sẽ đối đầu với nó ra sao trong trận chiến?"
 leviathans.5106.f1.reply:0 "Rất tệ. Vô cùng tệ hại.\n\nChờ một chút, các vị không thực sự nghĩ đến việc...? Trời đất ơi, với số lượng tàu các vị đang có ư? Chuyện đó... chuyện đó sẽ là một cuộc tàn sát một chiều!"
 leviathans.5106.f2.reply:0 "Tôi thực sự khuyên các vị không nên làm vậy. Các đợt tấn công của các vị có khả năng chỉ là sự phiền toái hơn là một mối đe dọa."
 leviathans.5106.f3.reply:1 "Hừm, phải rồi... Phải, tôi cho rằng các vị thực sự có cơ hội. Nếu các vị tập hợp toàn bộ hạm đội của mình lại... Xin lưu ý rằng đó sẽ không phải là một chiến thắng dễ dàng, nhưng ít nhất nó nằm trong giới hạn khả thi."
 leviathans.5106.f4.reply:0 "Hạm đội của các vị là một lực lượng hùng mạnh, có thể sánh ngang với một số armada vĩ đại nhất từng được ghi lại trong biên niên sử của Hội Giám Tuyển. Chiến thắng chắc chắn nằm trong tầm tay các vị."

 leviathans.500.f:1 "Chúng tôi muốn thành lập một §YViện Nghiên Cứu Chung§!."
 leviathans.511.name:0 "Viện Nghiên Cứu"
 leviathans.511.desc:1 "Phải... phải rồi, một cơ sở như vậy sẽ mang lại lợi ích cho sự tiến bộ của Khoa học Thiên hà. Quý vị có thể xây dựng Viện Nghiên Cứu này tại trạm sao của quý vị trong hệ sao mà quý vị chia sẻ cùng chúng tôi. Các Giám Tuyển của chúng tôi sẽ đến giao lưu và hợp tác với các nhà khoa học của quý vị."
 leviathans.511.a:0 "Tuyệt vời. Các vị còn có gì để cung cấp nữa?"
 leviathans.511.a.tooltip:0 "Giờ đây chúng ta có thể xây dựng Công Trình Trạm Sao §HViện Nghiên Cứu Của Giám Tuyển§! trong hệ sao §Y[curator_system.GetName]§!."
 leviathans.511.a.tooltip_nomads: "Giờ đây chúng ta có thể xây dựng Mô-đun Trạm Dừng §HViện Nghiên Cứu Của Giám Tuyển§! trong hệ sao §Y[curator_system.GetName]§!."

 leviathans.550.name:0 "Quái Thú Hư Không"
 leviathans.550.desc:1 "Nếu những nghi ngờ của chúng tôi là đúng, Quái Thú Hư Không đang ở rất xa quê hương của nó. Chúng tôi tin rằng nó là hậu duệ của một loài săn mồi ngoài thiên hà với kích thước khôn lường: một sinh vật rình rập cõi hư không của không gian để tìm kiếm con mồi. Dù chúng tôi chưa từng bắt gặp một mẫu vật sống nào trước đây, chúng tôi đã nghe những câu chuyện về sự hủy diệt và hỗn loạn mà Quái Thú Hư Không trưởng thành để lại sau lưng. Người ta nói rằng các thế giới sẽ bị lở loét và hoại tử dưới cái bóng của chúng."
 leviathans.550.a:0 "$leviathans.510.a$"
 leviathans.550.a.reply:1 "Theo những gì chúng tôi có thể biết, con mẹ đẻ những quả trứng có kích thước bằng cả hành tinh trên quỹ đạo của một ngôi sao, nơi chúng ấp trong hàng nghìn năm, đôi khi thậm chí đủ lâu để phát triển bầu khí quyển và sự sống hữu cơ.\n\nChúng ăn các vật chất sống, và Quái Thú Hư Không trưởng thành được cho là gây ra một ảnh hưởng kỳ lạ lên mọi sinh vật sống. May mắn thay, con non này dường như đã bị cha mẹ bỏ rơi.\n\nCó lẽ tốt nhất là nên bóp nghẹt sinh vật này khi nó còn nhỏ và dễ tổn thương?"
 leviathans.550.b:0 "Làm thế nào để đánh bại nó?"
 leviathans.550.b.reply:0 "Chúng tôi chưa từng nghe nói về một Quái Thú Hư Không trưởng thành bị đánh bại trong trận chiến, nhưng con này mới nở. Quái Thú Hư Không phun ra nước bọt và các gai nhọn ăn mòn có thể thiêu đốt xuyên qua lớp giáp dày nhất, nhưng việc phủ một lớp bảo vệ chống axit có thể làm chậm quá trình này. Chúng tôi sẽ giúp quý vị chế tạo nó. Quái Thú Hư Không là mối đe dọa đối với tất cả chúng ta."

 leviathans.555.name:0 "Kẻ Thu Gom Phế Liệu"
 leviathans.555.desc:2 "À, robot phế liệu. Kẻ Thu Gom là một tạo tác kỳ lạ từ một thời đại đã mất. Nó không ngừng tìm kiếm qua các bãi mảnh vỡ của thiên hà, hàn các khẩu pháo, động cơ và vật liệu thu nhặt được từ vô số xác tàu bỏ hoang lên thân tàu của chính mình. Khối lượng và hỏa lực của nó đã gia tăng theo cách đó suốt nhiều thế kỷ mà không có dấu hiệu suy giảm.\n\nKhông ai biết liệu có giới hạn tối đa cho việc nó có thể trở nên to lớn đến mức nào, nếu có đủ thời gian và phế liệu để nó làm việc."
 leviathans.555.a:0 "Ban đầu ai đã chế tạo ra nó?"
 leviathans.555.a.reply:2 "Thật không may, không có dữ liệu xác thực nào về nguồn gốc của Kẻ Thu Gom được biết là còn tồn tại. Một số nhà nghiên cứu tin rằng nó là một cỗ máy dịch vụ thu gom phế liệu bị hỏng hóc từ một đế chế đã mất, mục đích của nó từ lâu đã bị xáo trộn do sự xuống cấp của phần cứng. Những người khác tin rằng nó bắt nguồn từ một nanobot siêu nhỏ đơn lẻ, được lập trình để không ngừng tự phát triển to lớn hơn và mạnh mẽ hơn bằng cách khai thác môi trường xung quanh. Vẫn có những người khác nhận định nó có thể đã bắt đầu như một thuyền trưởng tàu robot; người sống sót duy nhất của một trận chiến liên thiên hà diễn ra hàng thiên niên kỷ trước. Có lẽ các hệ thống tư duy của nó đã bị hư hại không thể phục hồi do sự hủy diệt đột ngột của toàn bộ nền văn minh của nó.\n\nĐương nhiên, tất cả những điều này chỉ là suy đoán."
 leviathans.555.b:0 "Chúng ta có thể liên lạc với nó không?"
 leviathans.555.b.reply:2 "Qua nhiều năm đã có nhiều nỗ lực giao tiếp với nó, hoặc thay đổi lập trình của Kẻ Thu Gom. Thật không may, hầu hết các cuộc thám hiểm đó đều kết thúc bằng việc trở thành một phần của các bãi phế liệu vũ trụ nơi Robot Thu Gom ngự trị. Chỉ những ai có thể chạy nhanh hơn nó mới sống sót.\n\nKẻ Thu Gom đã hàn đủ pháo hạng nặng lên bộ khung chắp vá của mình để một mình tiêu diệt hạm đội của cả một quốc gia - một sự kiện có thể đã xảy ra nhiều lần. Đương nhiên, bất kỳ cuộc chạm trán mang tính hủy diệt nào như vậy cũng chỉ càng làm cho Kẻ Thu Gom mạnh hơn, cung cấp cho nó thêm các linh kiện tàu để tái sử dụng."
 leviathans.555.c:0 "$leviathans.510.b$"
 leviathans.555.c.reply:2 "Như quý vị có thể đã phỏng đoán: Kẻ Thu Gom không được chế tạo theo bất kỳ bản thiết kế xác định, có sẵn nào. Kết quả là, một số bộ phận của nó khớp với nhau... kém tối ưu, dẫn đến một số điểm yếu về mặt cấu trúc. Đương nhiên, đối với người ngoài nghề, hầu hết những điểm này đều bị che khuất khỏi tầm mắt - nhưng các cảm biến tiên tiến của chúng tôi đã cô lập được chúng.\n\nHãy bảo các hạm đội của quý vị tập trung hỏa lực vào các khu vực được chỉ định trên thân của Kẻ Thu Gom, và điều đó sẽ làm giảm đáng kể lượng sát thương mà cấu trúc này có thể chịu đựng trước khi sụp đổ."
 leviathans.555.aa:0 "Hãy nhắc lại cho chúng tôi về nguồn gốc của nó."
 leviathans.555.bb:0 "Hãy nhắc lại cho chúng tôi về những nỗ lực liên lạc với nó."

 leviathans.556.name:0 "Thái Mẫu Tiyanki"
 leviathans.556.desc:0 "Thật tráng lệ, phải không? Một Thái Mẫu già nua nhăn nheo, lớp da bị tẩy trắng và chai cứng qua hàng niên kỷ, các xúc tu của bà có khả năng bẻ gãy thân các thiết giáp hạm như vỏ hàu. Nhiều thập kỷ trước, các nhà nghiên cứu của chúng tôi nghe đồn về một vị thuyền trưởng đã thề sẽ săn lùng Thái Mẫu đến tận cùng thiên hà. Tuy nhiên, xét đến sự tồn tại tiếp diễn của bà, chúng tôi không thể tưởng tượng rằng ông ta đã thành công."
 leviathans.556.a:0 "Tại sao Thái Mẫu lại to lớn hơn nhiều so với các Tiyanki khác?"
 leviathans.556.a.reply:0 "Kích thước khó tin của bà là một điều dị thường, chắc chắn là vậy. Chúng tôi tin rằng Thái Mẫu là một kẻ lang thang từ một thiên hà khác trong không gian sâu thẳm, nơi một loài Tiyanki có kích thước và sức mạnh lớn hơn nhiều đã phân kỳ tiến hóa so với loài Tiyanki được tìm thấy trong thiên hà của chúng ta.\n\nĐương nhiên, cũng có thể Thái Mẫu chỉ đơn giản là mắc một dạng bệnh khổng lồ tiến triển - dù điều này không thể giải thích được tuổi thọ kéo dài của bà."
 leviathans.556.b:0 "Các vị biết gì về vị thuyền trưởng săn lùng Thái Mẫu?"
 leviathans.556.b.reply:0 "Rất ít. Rất có thể vị thuyền trưởng đã đuổi theo Thái Mẫu từ một thiên hà khác đến đây. Dù lý do tại sao một người lại dại dột đến mức thách thức một sinh vật có khả năng tiêu diệt toàn bộ hạm đội chỉ bằng một con tàu vẫn là điều vượt quá tầm hiểu biết của chúng tôi."
 leviathans.556.c:0 "$leviathans.510.b$"
 leviathans.556.c.reply:0 "Thái Mẫu rất đáng gờm, nhưng không phải là bất khả chiến bại. Dù lớp da bọc thép bảo vệ bà khỏi nhiều loại đạn đạo, bà mang theo một điểm yếu đáng chú ý.\n\nCó một quả ngư lôi proton khổng lồ cắm sâu vào lưng bà: một vết thương từ một trận chiến gần đây đã lành lại rất kém. Dù có vẻ như bị lỗi, các bản quét của chúng tôi cho thấy quả ngư lôi vẫn có thể được kích nổ, nếu được kích động bằng một xung năng lượng cụ thể.\n\nChúng tôi sẽ truyền các chi tiết cho quý vị ngay bây giờ."
 leviathans.556.aa:0 "Hãy nhắc lại lý do tại sao Thái Mẫu lại to lớn hơn các Tiyanki khác."
 leviathans.556.bb:0 "Hãy nhắc lại cho chúng tôi về vị thuyền trưởng săn lùng Thái Mẫu."

 leviathans.558.name:0 "Thần Độc"
 leviathans.558.desc:0 "Thực Thể Độc Tố là một sinh vật khó nắm bắt. Nó đã lang thang khắp thiên hà suốt hàng thiên niên kỷ, đôi khi chọn phun nọc độc vào các thế giới mà chúng tôi chỉ có thể tưởng tượng là một giai đoạn tự nhiên trong chu kỳ sinh trưởng của nó. Chúng tôi nghe nói rằng nó đã được lần ra dấu vết tại hệ sao §Y[toxic_god_system.GetName]§!."
 leviathans.558.desc.knights:0 "Thực Thể Độc Tố là một sinh vật khó nắm bắt. Nó đã lang thang khắp thiên hà suốt hàng thiên niên kỷ, đôi khi chọn phun nọc độc vào các thế giới mà chúng tôi chỉ có thể tưởng tượng là một giai đoạn tự nhiên trong chu kỳ sinh trưởng của nó. Nhưng đương nhiên các vị đã biết điều này rồi!\n\nChúng tôi xin lỗi, nhưng chúng tôi không thể giúp các vị tìm ra nơi ở hiện tại của nó - nó đã không được phát hiện bởi bất kỳ mối liên hệ nào của chúng tôi trong một khoảng thời gian khá dài."
 leviathans.558.A:0 "$leviathans.510.a$"
 leviathans.558.AA:0 "Hãy nhắc lại những gì các vị biết về nó."
 leviathans.558.A.reply:0 "Không có tài liệu nào ghi chép về nguồn gốc của Thực Thể Độc Tố. Lần nhìn thấy đầu tiên là vài nghìn năm trước, và kể từ đó nó được phát hiện vài thế kỷ một lần. Một số người đã gọi nó là một vị thần, nhưng điều đó tùy thuộc vào các vị quyết định. Những gì chúng tôi có thể nói với các vị là nó là một sinh vật hữu cơ cực kỳ đáng gờm với các đặc điểm của loài chân khớp. Các báo cáo cho thấy nó đủ lớn để cả một hệ sinh thái đã phát triển trên mình nó, dù việc thu thập các mẫu vật sinh học của nó được hiểu là một thách thức rất lớn."
 leviathans.558.B:0 "Làm thế nào để đánh bại nó?"
 leviathans.558.BB:0 "Hãy nhắc lại cách chúng ta có thể chiến đấu với nó."
 leviathans.558.B.reply:0 "Có rất ít người sống sót sau những lần chạm trán trong quá khứ với nó. Theo các báo cáo, các chất độc ăn mòn của nó có thể đốt cháy xuyên qua mọi loại giáp. Lá chắn chỉ hữu ích hơn đôi chút. Hơn nữa, những sinh vật sống trên lưng nó được cho là sẽ đóng vai trò như một bầy đàn tấn công khi nó bị đe dọa. Chúng tôi chỉ có thể khuyên các vị nên tiếp cận nó với một lực lượng áp đảo tuyệt đối."

 leviathans.559.name: "$NAME_Opus_Sentinel$"
 leviathans.559.desc: "Cỗ máy tự động khá bồn chồn đó là một kẻ mới đến tương đối trong thiên hà, nhưng đừng để bị đánh lừa bởi sự mới lạ đó. Những người sáng tạo ra $NAME_Opus_Sentinel$ được tính vào hàng ngũ những kỹ sư giỏi nhất trong khu vực của họ ngay cả trước khi họ bị đồng hóa bởi một cỗ máy bạo tàn. Chúng tôi không biết số phận nghiệt ngã nào đã ập xuống ý thức máy móc kể từ đó, nhưng nếu sự quằn quại đau đớn của Cảnh Binh là một dấu hiệu: toàn bộ tình hình có vẻ khá bất ổn. Hãy bước đi cẩn trọng, nếu các vị quyết định thỏa mãn trí tò mò của mình."
 leviathans.559.desc.unplugged: "Xin thứ lỗi cho sự đường đột của tôi, nhưng tôi cho rằng các vị sẽ biết nhiều về nó hơn chúng tôi! Cỗ máy tự động khá bồn chồn đó là một kẻ mới đến so với những gì chúng tôi thường nghiên cứu ở đây, nhưng không vì thế mà trở thành một đối thủ kém đáng sợ hơn.\n\nChúng tôi biết rằng ngay cả trước khi bị đồng hóa, các kỹ sư đứng sau $NAME_Opus_Sentinel$ đã được coi là những người giỏi nhất trong khu vực của họ. Do đó, chiến hạm đó không thể bị đánh giá thấp. Điều chúng tôi ít rõ hơn là con tàu đã trở nên tách rời khỏi [origin_unplugged_assimilator_empire.GetName] như thế nào. Từ sự quằn quại đau đớn của Cảnh Binh, chúng tôi suy đoán rằng toàn bộ tình hình vẫn khá bất ổn. Các vị có đồng ý với đánh giá này không, [root.GetSpeciesName]?"
 leviathans.559.a: "Các vị nói rằng nó đang canh giữ thứ gì đó?"
 leviathans.559.a.reply: "Quả thực như vậy, dù chúng tôi không biết chính xác là cái gì. Một số mối liên hệ của chúng tôi tin rằng Cảnh Binh đang bảo vệ bất cứ thứ gì còn sót lại của [origin_unplugged_assimilator_empire.GetName] đã tan vỡ; những người khác cho rằng chính hành tinh này chứa đựng một kho báu nào đó. Những gì chúng tôi biết là chiến hạm này được chế tạo kiên cố hơn bất kỳ chiến hạm [origin_unplugged_assimilator_empire.GetAdj] nào cùng thời cả một bậc độ lớn. Dù nó đang bảo vệ thứ gì ngoài kia, $NAME_Opus_Sentinel$ vẫn kiên trì bất chấp những dấu hiệu rõ ràng của sự đau khổ, hoặc thậm chí là sự thống khổ tột cùng."
 leviathans.559.b: "Chúng tôi muốn không nói về điều đó."
 leviathans.559.b.reply: "Hoàn toàn có thể hiểu được. Chúng tôi chỉ tò mò thôi.\n\nTôi có thể giúp gì khác cho các vị không?"
 leviathans.559.c: "Chúng tôi có thể tìm thấy thực thể này ở đâu?"
 leviathans.559.c.reply: "Xét thấy các vị là một trong những khách hàng đáng tin cậy hơn của chúng tôi... Tôi có thể nói cho các vị biết $NAME_Opus_Sentinel$ được nhìn thấy lần cuối khi đang canh gác hệ sao §Y[origin_unplugged_machine_legacy_core.GetName]§!.\n\nVới việc chúng ta vẫn còn biết rất ít về chiến hạm gặp nhiều rắc rối dữ dội này, hãy yên tâm: chúng tôi sẽ quan sát các chi tiết cụ thể về cuộc chạm trán của các vị với sự quan tâm sâu sắc!"
 unplugged_curator_poi_opus_sentinel_desc: "Chúng ta đã mua các tọa độ này từ Hội Giám Tuyển, những người báo cáo rằng $NAME_Opus_Sentinel$ được nhìn thấy lần cuối trong khu vực này."


 leviathans.590.name:0 "Thuê Nhà Khoa Học"
 leviathans.590.desc:0 "Chúng tôi sẵn lòng cam kết cống hiến sự phục vụ của một trong những nhà khoa học kiệt xuất nhất của chúng tôi cho sự nghiệp của các vị. Đây không phải là một lời đề nghị mà chúng tôi dành cho bất kỳ ai, các vị hiểu chứ!\n\nMột khoản quyên góp... phù hợp đương nhiên sẽ là cần thiết, trước khi các thỏa thuận di chuyển có thể được thực hiện."
 leviathans.590.a:0 "Đương nhiên rồi. Các vị sẽ nhận được khoản quyên góp của mình."
 leviathans.590.a.reply:0 "Tuyệt vời. Giờ đây các vị sẽ có quyền tiếp cận không giới hạn vào một trong những bộ óc vĩ đại nhất của thời đại chúng ta!"
 leviathans.590.tt_scientist:0 "Chúng ta chỉ có thể tuyển dụng §Ymột§! §Hnhà khoa học Giám Tuyển§! tại một thời điểm."

 leviathans.598.name:0 "Các Nguyên Lý Chung"
 leviathans.598.desc:0 "Chúng tôi sẵn lòng truyền cho tập thể của các vị các nguyên lý nền tảng của tri thức. Một quy trình nghiêm ngặt, và chỉ dành riêng cho một ý thức chung.\n\nNgay cả đối với chúng tôi, đó cũng không phải là điều dễ dàng đạt được. Chi phí không hề nhỏ. Nhưng trong tất cả các loại hàng hóa, tri thức vẫn là thứ quý giá nhất."
 leviathans.598.a:0 "$leviathans.590.a$"
 leviathans.598.a.reply:0 "Một sự đầu tư đúng đắn."
 leviathans.598.tt_principles:0 "Các nguyên lý nền tảng của Hội Giám Tuyển đã được chia sẻ với chúng ta."

 leviathans.599.name:0 "Mua Tin Tình Báo"
 leviathans.599.desc:0 "Vì các vị là một trong những khách hàng đáng tin cậy của chúng tôi, chúng tôi có thể tiết lộ cho các vị một số thông tin nhất định về các khách hàng... ít được ưu ái hơn của chúng tôi. Các vị làm gì với thông tin này hoàn toàn tùy thuộc vào các vị, đương nhiên rồi.\n\nCác vị muốn biết về ai?"
 leviathans.599.a:0 "Hãy kể cho chúng tôi về [curator_customer_1.GetName]."
 leviathans.599.b:0 "Các vị biết gì về [curator_customer_2.GetName]?"
 leviathans.599.c:0 "Chúng tôi muốn biết về [curator_customer_3.GetName]."
 leviathans.599.d:0 "[curator_customer_4.GetName] là đối tượng chúng tôi quan tâm."
 leviathans.599.yes.reply:0 "Tuyệt vời. Thông tin sẽ được chuyển tới quý vị ngay lập tức qua đường truyền dữ liệu liên sao an toàn nhất thiên hà."

 leviathans.600.name:0 "$clues$"
 leviathans.600.desc:0 "Các $lgates$? Vâng, giống như các Cổng Không Gian khác, chúng thậm chí xuất hiện trước cả $gov_stagnant_ascendancy$ cổ xưa nhất, nhưng chúng tôi chắc chắn rằng các vị đã nhận ra điều đó rồi.\n\nTại sao chúng lại khác biệt? Chúng dẫn đến đâu? Chúng tôi đã chọn không đào sâu quá nhiều vào những bí ẩn đặc thù đó - \"ba lần nếm đắng, mười bảy phần e dè\", các vị biết chuyện đó diễn ra thế nào rồi đấy - nhưng chúng tôi sẵn lòng chia sẻ một số phát hiện gần đây có thể liên quan.\n\nVới một mức giá hợp lý."
 leviathans.600.a:0 "Xin hãy chia sẻ."

 leviathans.596.desc:1 "Có vẻ như chúng tôi đã đánh giá quá cao khả năng hành xử như một quốc gia văn minh của các vị. Thật kỳ lạ... Chúng tôi thường có thể nhận diện những kẻ bạo lực ngay từ giai đoạn đầu.\n\nĐương nhiên, chúng tôi đã cắt đứt quyền truy cập của các vị vào ngân hàng dữ liệu của mình."
 leviathans.597a.desc:0 "Lũ ngốc! Bằng việc tấn công chúng tôi, các vị đang đẩy các thế hệ tương lai vào cuộc sống nghèo nàn, lạc hậu về công nghệ!"
 leviathans.597b.desc:0 "Bản năng thấp hèn đã thúc đẩy các vị tấn công chúng tôi, và giờ đây các vị phải trả giá. Chúng tôi sẽ không bao giờ chia sẻ tri thức của mình với [Root.GetName] thêm một lần nào nữa."
 leviathans.597c.desc:1 "Chúng tôi đã có quá nhiều điều để cống hiến cho các vị [Root.GetSpeciesNamePlural], vậy mà các vị lại vứt bỏ tất cả. Lũ cặn bã man rợ thời đại mới!"
 leviathans.597d.desc:0 "Các vị đã bị tuyên bố là kẻ thù của toàn thể Hội Giám Tuyển."

 leviathans.510.name:0 "Rồng Không Gian"
 leviathans.510.desc:0 "Chủng loài Rồng Không Gian không thích nghi tốt với cuộc sống trong vũ trụ của chúng ta. Con rồng cuối cùng tuy rất mạnh mẽ, nhưng không phải là bất khả chiến bại."
 leviathans.510.a:0 "Nó thực sự là thứ gì?"
 leviathans.510.a.reply:0 "Theo mọi ghi chép, Rồng Không Gian xuất hiện trước tất cả các nền văn minh thiên hà. Từng có vô số cá thể, nhưng chủng tộc của chúng đã tàn lụi qua hàng niên kỷ.\n\nChúng không thích hợp với cuộc sống ở đây và bây giờ. Một điều gì đó về các quy luật vật lý của vũ trụ không tương thích với chúng, như thể chúng tiến hóa trong một thực tại khác. Thực tế đúng là như vậy. Chúng tôi tin rằng chúng chỉ là những tàn tích cuối cùng của một vũ trụ đã kết thúc trước khi vũ trụ của chúng ta bắt đầu, những kẻ sống sót duy nhất sau một đợt \"Đại Thu Nhỏ\".\n\nCon rồng ở cách đây không xa là cá thể cuối cùng thuộc loài của nó trong thiên hà, có lẽ là trong cả vũ trụ."
 leviathans.510.b:0 "Hãy cho chúng tôi biết cách đánh bại nó."
 leviathans.510.b.reply:0 "Các lớp vảy của nó phản ứng với các nhịp điệu gõ đập. Nói chính xác hơn, các tần số nhất định có tác dụng làm giãn cơ dưới da kiểm soát vị trí và khả năng hấp thụ chấn động của các tấm vảy. Một phản xạ từng đóng vai trò then chốt trong các tương tác xã hội của loài Rồng Không Gian, giờ đây lại là một điểm yếu rõ ràng và hiển nhiên.\n\nViệc điều chỉnh quy luật khai hỏa của các tàu chiến của quý vị theo một nhịp điệu cụ thể sẽ gia tăng đáng kể lượng sát thương quý vị có thể gây ra cho con rồng cuối cùng. Nó vốn không thuộc về thời đại của chúng ta - hãy giải thoát nó khỏi nỗi thống khổ."

 leviathans.515.name:0 "Pháo Đài Bí Ẩn"
 leviathans.515.desc:0 "Đó là kiểu công trình phi lý, đồ sộ và tự duy trì vĩnh cửu mà ngày nay người ta không còn thấy xây dựng nữa. Có lẽ điều đó lại là tốt nhất."
 leviathans.515.a:0 "Bất kỳ cấu trúc nào cũng có thể bị phá hủy."
 leviathans.515.a.reply:1 "Pháo Đài từng bị đánh bại trước đây, nhưng nó luôn tự phục hồi. Một số đế chế cổ đại của thiên hà này đã phát điên bởi những nỗ lực vô vọng nhằm mở khóa những bí mật sâu xa hơn của nó, hoặc phá hủy nó vĩnh viễn. Nó dường như quá tập trung vào việc tự duy trì đến mức chúng tôi nghi ngờ liệu nó có mục đích nghiêm túc nào khác hay không."
 leviathans.515.b:0 "Có thể tiến vào bên trong pháo đài không?"
 leviathans.515.b.reply:1 "Có thể và từng có người đã vào, dù nỗ lực đó giờ đây gần như đã bị lãng quên. Pháo đài chỉ duy trì một phần năng lượng khi ngừng hoạt động, tuy nhiên nó sẽ cố gắng hút năng lượng từ các nguồn lân cận để khởi động lại hệ thống của mình. Hãy tiến hành hết sức thận trọng."
 leviathans.515.c:0 "Ai đã xây dựng pháo đài?"
 leviathans.515.c.reply:1 "Dù họ là ai, hẳn họ phải là những kẻ vô cùng say mê các câu đố và bí ẩn. Những vật phẩm duy nhất từng được thu hồi từ pháo đài là những khối kim loại có hình thù kỳ dị: các linh kiện của những cỗ máy khó hiểu dường như được thiết kế để sắp xếp lại thành những hình thái thỏa mãn hơn. Những người mang chúng trở về đã làm vậy vì họ thất bại, và họ chỉ vừa vặn thoát chết trong gang tấc. Nhiều người khác đã không thể trở về."
 leviathans.515.d:0 "Pháo đài được cấp năng lượng như thế nào?"
 leviathans.515.d.reply:1 "Hệ thống năng lượng hẳn phải được xây dựng vào khoảng thời gian giữa việc thi công vỏ tàu ban đầu và việc lắp đặt hệ thống phòng thủ của nó. Phương thức phục hồi của hệ thống vẫn là ẩn số đối với chúng tôi, nhưng chúng tôi phát hiện ra pháo đài chứa một lượng lớn vật chất tối. Chất đó và mối quan hệ của nó với các hố đen là chìa khóa để hiểu làm thế nào pháo đài tồn tại được lâu như vậy.\n\nChưa từng có ai tìm thấy nguồn năng lượng của nó, nhưng rất có thể nó vô cùng bất ổn."
 leviathans.515.bb:0 "Hãy nhắc lại về việc xâm nhập vào nó."
 leviathans.515.cc:1 "Hãy nhắc lại về kẻ đã chế tạo ra nó."
 leviathans.515.dd:1 "Hãy nhắc lại cách nó được cấp năng lượng."

 leviathans.520.name:0 "Quái Thú Nuốt Sao"
 leviathans.520.desc:0 "Quái Thú Nuốt Sao là một loài ký sinh mới trên bãi săn thiên hà, không khác đế chế của các vị là bao theo nhiều khía cạnh. Nó được sinh ra từ nỗi sợ hãi và phản ứng nhiệt hạch hạt nhân. Nó lang thang khắp thiên hà, lặn sâu vào các ngôi sao, ngấu nghiến chúng từ bên trong. Và chắc chắn nó không thích bị quấy rầy."
 leviathans.520.a.reply:0 "Loài nuốt sao là một giống loài hiếm hoi. Một loại quái thú mới chưa rõ nguồn gốc. Các tài liệu chúng tôi thu thập được rất ít ỏi và khan hiếm thông tin tình báo. Rất ít nguồn có được kinh nghiệm thực tế trực tiếp với sinh vật này.\n\nTuy nhiên, tất cả dữ liệu của chúng tôi đều chỉ ra cùng một sự thật: nó là một nỗi kinh hoàng không mang lại điều gì ngoài sự hủy diệt.\n\nQuái Thú Nuốt Sao có khả năng ăn chính các phản ứng nhiệt hạch. Phỏng đoán §Yrất§! có cơ sở khoa học của chúng tôi là sinh học của nó là kết quả của sự hợp nhất đa chiều bên ngoài giữa vật chất tối và vật chất mặt trời. Nó lặn sâu vào các ngôi sao, ngấu nghiến phần bên trong của chúng để cung cấp nhiên liệu cho lò phản ứng nhiệt hạch bên trong chính cơ thể nó. Nó mang lại cái chết cho tất cả các hệ sao mà nó chạm tới. Hoặc là các hành tinh vỡ vụn như băng sau bữa tiệc của nó, hoặc là chúng bị thiêu rụi do phơi nhiễm trước mặt trời thứ hai từ bên trong bụng sinh vật này.\n\nNó muốn ăn, và nó sẽ không dừng lại trước bất cứ điều gì để giành lấy phần của mình. Khi các vị nhìn chằm chằm vào nó, những gì các vị thấy là cơn thịnh nộ nguyên thủy của một kẻ sinh tồn."
 leviathans.520.b.reply:0 "Điều duy nhất chúng tôi biết chắc chắn là phần lõi tích tụ là khía cạnh quan trọng nhất của Quái Thú Nuốt Sao. Sinh vật này khao khát duy trì ngọn lửa lò luyện của nó cháy bỏng, kẻo khoảng không lạnh giá của vũ trụ chạm tới các cơ quan sinh tồn sâu bên trong và khiến nó tự sụp đổ. Không có vật chất mặt trời đó, nó chẳng là gì cả.\n\nCác vị có thể tận dụng điều này làm lợi thế. Hãy hiệu chuẩn vũ khí của các vị theo các thông số kỹ thuật của chúng tôi và các vị có thể nhắm thẳng vào chính các lớp màng giữ hệ thống tiêu hóa của Quái Thú Nuốt Sao lại với nhau. Làm nó bị thương và các vị sẽ thấy nội tạng của nó phun trào khắp hệ mặt trời."

 leviathans.525.name:0 "Ác Mộng Chiều Không Gian"
 leviathans.525.desc:0 "Các thiết bị đo đạc của chúng tôi đã theo dõi luồng năng lượng khổng lồ bùng phát khi thực thể này đâm xuyên qua cõi tồn tại của chúng ta."
 leviathans.525.a:0 "$leviathans.510.a$"
 leviathans.525.a.reply:0 "Nó là một sinh vật của sự ác độc thuần túy, sinh ra trong một chiều không gian mang nhiều điểm tương đồng đến kinh ngạc với cõi Địa Ngục như được mô tả bởi nhiều tôn giáo thiên hà. Những gì chúng ta đang thấy chỉ là một phần nhỏ của một chỉnh thể lớn hơn nhiều - toàn bộ sinh vật này to lớn hơn gấp bội.\n\nRất may mắn là nó đã không thể hoàn tất quá trình chuyển dịch vào vũ trụ của chúng ta. Nếu thành công, sinh vật này có lẽ đã nuốt chửng toàn bộ sự sống trong thiên hà vào lúc này."
 leviathans.525.b:0 "$leviathans.510.b$"
 leviathans.525.b.reply:0 "Cổng không gian chiều kích mà nó sinh ra chính là điểm yếu lớn nhất của nó - không có cổng này, nó không thể tồn tại trong vũ trụ của chúng ta. Chúng tôi đã xác định được một số điểm yếu trong ma trận năng lượng của cổng mà vũ khí thông thường có thể khai thác được. Đang truyền tọa độ mục tiêu ngay bây giờ."

 leviathans.530.name:0 "Tiểu Hành Tinh Tổ Ong"
 leviathans.530.desc:0 "Những loài gây hại phiền toái này từng phổ biến hơn nhiều trong thiên hà của chúng ta. Đã từng có thời các vị không thể bay qua một vành đai tiểu hành tinh ngẫu nhiên nào mà không bị những con thú nhỏ này bâu kín xung quanh tàu!"
 leviathans.530.a:0 "$leviathans.510.a$"
 leviathans.530.a.reply:0 "Chúng là một dạng sống gốc silicon có tính lãnh thổ cực kỳ hung hãn. Dù từng tạo ra mối đe dọa đáng kể cho các nền văn minh du hành không gian, số lượng của chúng đã bị thanh lọc nghiêm ngặt trong 500.000 năm qua và các thành viên còn sống sót của loài này khá ẩn dật.\n\nBất chấp những lời đồn đại ngược lại, không có bằng chứng nào cho thấy chúng sở hữu bất cứ thứ gì có thể được miêu tả là trí tuệ có tri giác. Chúng có xu hướng làm tổ bên trong các tiểu hành tinh, và chúng sẽ tấn công bất cứ thứ gì bị coi là mối đe dọa."
 leviathans.530.b:0 "$leviathans.510.b$"
 leviathans.530.b.reply:0 "Các sinh vật này có xu hướng phủ lên tổ tiểu hành tinh của chúng một loại vật chất chưa xác định, đóng vai trò như lớp giáp kiên cố chống lại vũ khí trên tàu. Tuy nhiên, chất này không được phủ hoàn hảo trên toàn bộ bề mặt của tiểu hành tinh.\n\nVới dữ liệu nhắm mục tiêu mà chúng tôi đang truyền cho các vị bây giờ, các tàu của các vị sẽ có thể tập trung hỏa lực vào các khu vực bề mặt không được bảo vệ, làm gia tăng đáng kể lượng sát thương gây ra."

 leviathans.535.name:0 "Cỗ Máy Vô Cực"
 leviathans.535.desc:0 "À vâng, thực thể sắc màu từ thời xa xưa. Chúng tôi đã nghiên cứu nó kể từ khi giáo đoàn của chúng tôi tồn tại. Giống như một số nền văn minh trước chúng tôi đã từng làm.\n\nCỗ máy này vượt xa khái niệm cổ đại. Theo tất cả những gì chúng tôi biết, nó dường như đã luôn tồn tại ở đó. Ấy vậy mà, tất cả những gì nó làm chỉ là quay quanh hố đen đó. Nó thực sự mê hoặc chúng tôi, nhưng chúng tôi hiểu nếu điều đó là quá sức để các vị có thể lĩnh hội."
 leviathans.535.a.reply:0 "Cỗ Máy Vô Cực, như cách các vị gọi nó một cách thẳng thừng, là bất khả xâm phạm đối với việc trích xuất thông tin. Không có thông tin nào lọt ra từ nó. Không một hacker hay kỹ sư nào trong toàn bộ thiên hà có thể nhìn thấu lớp vỏ ngoài sáng bóng của nó để thoáng thấy được tri thức mà nó hiển nhiên đang giấu giếm chúng ta. Chúng tôi hoàn toàn bất lực. Chúng tôi không biết nó dùng để làm gì, cũng như không biết nó dự định làm gì một khi hoàn tất."
 leviathans.535.b.reply:0 "Có lẽ có một điều các vị có thể làm để phá hủy nó. Chúng tôi không thể lấy được thông tin từ nó, nhưng thân tàu của nó có thể bị phá vỡ. Các thợ mỏ đã từng cố gắng thu thập tài nguyên từ nó vô số lần, chỉ để trở về với những con tàu gần như nát vụn. Nhưng họ đã tìm thấy một điều thú vị: Cỗ Máy Vô Cực không cứng nhắc như vẻ ngoài của nó.\n\nNó được làm từ một loại vật liệu có khả năng thay đổi các đặc tính của mình. Mật độ, độ đàn hồi, nhiệt độ, bất cứ thứ gì các vị có thể kể tên! Nó có thể phân tích sát thương trong thời gian thực và thay đổi lớp vỏ của mình để bù đắp, do đó khiến bản thân khó bị hạ gục hơn. Hãy thay đổi tần số của các vị, điều chỉnh lượng nhiệt phát ra từ tên lửa của các vị, bất cứ thứ gì các vị mang theo, và tiếp tục liên tục thay đổi chúng. Bằng cách đó, các vị có thể vượt qua khả năng thích ứng của nó."

 leviathans.540.name:0 "Thiết Giáp Hạm Tự Hành"
 leviathans.540.desc:0 "Một câu chuyện buồn. Những người chủ của nó đã chết hàng triệu năm trước, nhưng chiến hạm khổng lồ này vẫn tiếp tục canh giữ đống đổ nát tan hoang của đế chế họ."
 leviathans.540.a:0 "$leviathans.510.a$"
 leviathans.540.a.reply:0 "Nó là một trong số vài soái hạm thuộc về một đế chế liên sao hùng mạnh bất thường từng hưng thịnh ở một khu vực nhỏ của thiên hà chúng ta khoảng bảy triệu năm trước. Như thường lệ, đế chế đó đã đi đến hồi kết đột ngột và tàn khốc dưới bàn tay của các nước láng giềng trong một loạt các cuộc chiến tranh hủy diệt.\n\nChiến hạm mà các vị gặp phải là cá thể cuối cùng của chủng loại đó, và nó vẫn tiếp tục tận tụy tuần tra hệ sao được giao phó bất chấp cái chết của toàn bộ thủy thủ đoàn. Nhiều nỗ lực đã được thực hiện qua các thời kỳ để đưa chiến hạm già cỗi này về nơi an nghỉ cuối cùng - nhưng không ai thành công."
 leviathans.540.b:0 "$leviathans.510.b$"
 leviathans.540.b.reply:0 "Chiến hạm được thiết kế để vận hành với một thủy thủ đoàn đông đảo, nhưng giờ đây nó hoàn toàn dựa vào các hệ thống tự động để hoạt động. Điều này làm cho con tàu đặc biệt dễ bị tổn thương trước các cuộc tấn công làm gián đoạn các nút chuyển tiếp được máy tính trung tâm của nó sử dụng."

 leviathans.545.name:0 "U Hồn Vũ Trụ"
 leviathans.545.desc:0 "U Hồn Quang Phổ là những sinh vật đáng lo ngại, nếu chúng thực sự có thể được coi là sinh vật. Chúng tôi coi chúng là một thảm họa tự nhiên hiếm hoi và phi thường hiệu quả."
 leviathans.545.a:0 "Các vị biết gì về những thảm họa này?"
 leviathans.545.a.reply:0 "Chúng dường như là những ảo ảnh của ánh sáng, nhưng khi các vị đến gần, sẽ nhanh chóng thấy rõ rằng chúng không hề là ảo ảnh.\n\nNghịch lý thay, trong chính vẻ ngoài đó lại ẩn chứa chìa khóa để đánh bại chúng. Mối quan hệ của chúng với quang phổ ánh sáng khả kiến là sức mạnh của chúng, nhưng nó sẽ suy giảm khi chúng tiếp cận một nguồn sáng có tần số tương tự. Hãy chú ý kỹ đến màu sắc của U Hồn."
 leviathans.545.b:0 "Còn về U Hồn đỏ thì sao?"
 leviathans.545.b.reply:0 "U Hồn đỏ có tần số 450THz. Ánh sáng của chúng được đồng bộ hóa với ánh sáng của §YSao Loại M§!. Khả năng né tránh vũ khí thông thường của chúng bị suy yếu trong các hệ sao có sao lùn đỏ."
 leviathans.545.c:0 "Còn về U Hồn vàng thì sao?"
 leviathans.545.c.reply:0 "U Hồn vàng có tần số 520THz. Ánh sáng của chúng được đồng bộ hóa với ánh sáng của §YSao Loại G§!. Khả năng né tránh vũ khí thông thường của chúng bị suy yếu trong các hệ sao có sao lùn vàng."
 leviathans.545.d:0 "Còn về U Hồn lam thì sao?"
 leviathans.545.d.reply:0 "U Hồn lam có tần số 650THz. Ánh sáng của chúng đồng bộ hóa với cả §YSao Loại A§! lẫn §YSao Loại B§!. Khả năng né tránh vũ khí thông thường của chúng bị suy yếu trong các hệ sao có sao khổng lồ xanh."

 leviathans.593:1 "Trạm Giám Tuyển Bị Phá Hủy"
 leviathans.593.desc:1 "Sau khi phá hủy trạm Giám Tuyển cổ xưa trong hệ sao [curator_system.GetName], các lực lượng tài ba của chúng ta đã lùng sục khu vực nó từng chiếm giữ để tìm kiếm bất kỳ thứ gì có giá trị. Họ đã thu hồi thành công một số mảnh ký ức từ ngân hàng dữ liệu của Giám Tuyển, điều này sẽ là một lợi ích to lớn cho nghiên cứu của chúng ta."
 leviathans.594.a.desc:0 "$leviathans.594.ab.desc.start$\n\n$leviathans.594.ab.desc.known$"
 leviathans.594.b.desc:0 "$leviathans.594.ab.desc.start$\n\n$leviathans.594.ab.desc.unknown$"
 leviathans.594.ab.desc.start:1 "Các mạng lưới truyền thông không gian sâu đã bắt được một tín hiệu cầu cứu tự động ngắn từ trạm Giám Tuyển trong hệ sao [curator_system.GetName]. Việc truyền tín hiệu đã chấm dứt chỉ sau vài phút, và các đầu dò do thám tầm xa đã xác nhận rằng trạm không gian cổ xưa đã bị phá hủy."
 leviathans.594.ab.desc.known:1 "Các vệt ion còn sót lại cho thấy các lực lượng từ §Y[curator_destroyer.GetName]§! đứng sau cuộc tấn công này."
 leviathans.594.ab.desc.unknown:0 "Các lực lượng chịu trách nhiệm cho cuộc tấn công này vẫn chưa được xác định danh tính."
 leviathans.594.c.desc:0 "$leviathans.594.cd.desc.start$ $leviathans.594.cd.desc.known$\n\n$leviathans.594.cd.desc.trade$"
 leviathans.594.d.desc:1 "$leviathans.594.cd.desc.start$ $leviathans.594.ab.desc.unknown$\n\n$leviathans.594.cd.desc.trade$"
 leviathans.594.cd.desc.start:1 "Mọi liên lạc đã bị mất với [From.GetName], và các phương tiện do thám của chúng ta đã xác nhận rằng trạm Giám Tuyển cổ xưa đã bị phá hủy."
 leviathans.594.cd.desc.known:1 "Những báo cáo này cho thấy lực lượng tấn công thuộc về §Y[curator_destroyer.GetName]§!."
 leviathans.594.cd.desc.trade:1 "Thật không may, sự sụp đổ của Hội Giám Tuyển đồng nghĩa với việc chúng ta cũng mất quyền truy cập vào các ngân hàng dữ liệu sâu rộng của họ."
 leviathans.594.a:0 "Một hồi kết đáng buồn cho di sản của họ."
 leviathans.594.b:0 "Điều này đã khiến chúng ta phải trả giá đắt!"

 ### DRAGON
 leviathans.610.name:1 "Chạm Trán Rồng Không Gian"
 leviathans.610.desc:1 "Sinh vật được quan sát thấy trong hệ sao [From.GetName] không giống bất kỳ thứ gì [Root.GetName] từng chạm trán trước đây.\n\nCực kỳ hung hãn và sở hữu năng lực hủy diệt tương xứng, nó canh giữ một tiểu hành tinh mà các bản quét ban đầu cho thấy là đặc biệt giàu tài nguyên."
 leviathans.610.desc.here_be_dragons:0 "Sinh vật được quan sát thấy trong hệ sao [From.GetName] mang một số nét tương đồng ban đầu với Thiên Long tại hệ sao quê hương của chúng ta, dù các bản quét sâu hơn chứng minh rằng nó rõ ràng là một loài khác, và có lẽ thậm chí đã tiến hóa độc lập với Thiên Long.\n\nCực kỳ hung hãn và sở hữu năng lực hủy diệt tương xứng, nó canh giữ một tiểu hành tinh mà các bản quét ban đầu cho thấy là đặc biệt giàu tài nguyên."
 leviathans.610.a:0 "Điềm xấu."

 leviathans.649.desc:0 "Chúng ta đã nhận được một tín hiệu truyền tin cuối cùng từ hạm đội của mình trước khi nó bị tiêu diệt. Thông điệp đề cập đến việc kẻ thù khổng lồ của họ dường như đang định vị theo dấu vết FTL của hạm đội...\n\nNếu con quái thú đã ngửi thấy mùi hương của chúng ta, chúng ta nên chuẩn bị sẵn sàng cho sự trả thù tàn khốc."
 leviathans.649.desc.gesta:0 "Khi Rồng Không Gian tấn công các tàu của chúng ta, nó dường như đang định vị theo dấu vết FTL của hạm đội...\n\nNếu sinh vật đó đã ngửi thấy mùi hương của chúng ta, chúng ta nên chuẩn bị cho sự trả đũa tàn khốc."
 leviathans.649.a:0 "Báo động toàn bộ các bộ chỉ huy."
 leviathans.649.b.gesta:0 "Chúng ta sẽ sẵn sàng."
 leviathans.650.name:0 "Rồng Đang Đến"
 leviathans.650.desc:0 "Chúng ta đã nhận được một tín hiệu truyền tin cuối cùng từ [Root.GetName] trước khi hạm đội kích hoạt các giao thức FTL khẩn cấp và mất liên lạc. Thông điệp bao gồm việc đề cập đến sinh vật khổng lồ mà họ đang chiến đấu dường như đang định vị theo dấu vết FTL của hạm đội...\n\nNếu con quái thú đã ngửi thấy mùi hương của chúng ta, chúng ta nên chuẩn bị sẵn sàng cho sự trả thù tàn khốc."
 leviathans.650.desc.gesta:0 "$leviathans.649.desc.gesta$"

 leviathans.660.name:0 "Kho Báu Của Rồng, Lăng Mộ Của Rồng"
 leviathans.660.desc:0 "Chôn sâu trong lớp vỏ của [From.GetName] là những phần còn lại bị hóa thạch của thứ dường như là họ hàng gần của Rồng Không Gian từng cư ngụ trong hệ sao [From.GetStarName].\n\nTrong hàng niên kỷ kể từ khi người anh em họ rồng này qua đời, các mô mềm của nó đã hóa xương và xương của nó đã cứng lại, trở thành cấu trúc giống như khoáng chất."
 leviathans.660.a:1 "Nghiên cứu các di tích."
 leviathans.660.b:0 "Nghiền nát chúng."

 leviathans.661.name:0 "Kho Báu Của Rồng, Hậu Duệ Của Rồng"
 leviathans.661.desc:0 "Khi trạm khai khoáng của chúng ta quay quanh §YKho Báu Của Rồng§! đang định vị lại để căn chỉnh với một mạch khoáng sản đặc biệt giàu có, các cảm biến đã thu nhận được thứ mà cho đến nay vẫn chưa được phát hiện.\n\nMột §Yquả trứng Rồng Không Gian§! nguyên vẹn trong tình trạng hoàn hảo, được chôn dưới bề mặt của tiểu hành tinh và bao quanh bởi những mảnh vỏ vỡ vụn của một số mẫu vật kém may mắn hơn. Quả trứng đã được khai quật và đưa ra khỏi địa điểm khai thác, nhưng số phận cuối cùng của nó vẫn chưa được định đoạt."
 leviathans.661.a:0 "Một con Rồng Không Gian non sẽ là một đồng minh đáng gờm..."
 leviathans.661.a.tooltip:0 "Vận chuyển quả trứng đến [Root.Capital.GetName]."
 leviathans.661.b:0 "Con rồng trước bị tiêu diệt là có lý do."
 leviathans.661.b.tooltip:0 "Đập vỡ quả trứng."
 leviathans.664.name:0 "Kho Báu Của Rồng, Rồng Tái Sinh"
 leviathans.664.desc:0 "Quả trứng nở ra."
 leviathans.664.a:0 "Một con rồng gầm vang."
 leviathans.664.a.tooltip:0 "Rồng Không Gian non §HScile§! gia nhập các hạm đội của [Root.Owner.GetName]."
 leviathans.665.name:0 "Kho Báu Của Rồng, Hết Hạn Sử Dụng"
 leviathans.665.desc:0 "Quả trứng Rồng Không Gian thu hồi từ tiểu hành tinh Kho Báu Của Rồng, theo lời của nhà sinh vật học phụ trách noãn, đã quá hạn.\n\nKhông còn bất kỳ hy vọng nào để ấp nở sinh vật bên trong nữa."
 leviathans.665.desc.gesta:0 "Quả trứng Rồng Không Gian thu hồi từ tiểu hành tinh Kho Báu Của Rồng không còn có thể sống được nữa.\n\nChủng loài này đã tuyệt chủng."
 leviathans.665.desc.machine: "Quả trứng Rồng Không Gian đã ngừng hoạt động. Các tiến trình sinh học đã sụp đổ, và không có báo cáo lỗi nào có sẵn để gỡ lỗi."

 leviathans.670.name:0 "Kẻ Giết Rồng"
 leviathans.670.desc:3 "Rồng Không Gian đáng gờm đã bị tiêu diệt. Sự dũng cảm phi thường của Chỉ huy [From.From.GetLeaderName] và [From.From.GetName] sẽ không sớm bị lãng quên.\n\n§HTiểu hành tinh§! mà con quái thú canh giữ đầy ghen tuông giờ đây có thể được khai thác an toàn. Ai biết được sinh vật này có thể đã tích lũy được những kho báu gì qua hàng niên kỷ?"
 leviathans.670.desc.noleader:3 "Rồng Không Gian đáng gờm đã bị tiêu diệt. Sự dũng cảm phi thường của [From.From.GetName] sẽ không sớm bị lãng quên.\n\n§HTiểu hành tinh§! mà con quái thú canh giữ đầy ghen tuông giờ đây có thể được khai thác an toàn. Ai biết được sinh vật này có thể đã tích lũy được những kho báu gì qua hàng niên kỷ?"
 leviathans.670.desc.gesta:0 "Rồng Không Gian đáng gờm đã bị tiêu diệt.\n\n§HTiểu hành tinh§! mà con quái thú canh giữ đầy ghen tuông giờ đây có thể được khai thác an toàn. Sinh vật này có thể đã tích lũy được những kho báu gì qua hàng niên kỷ?"
 leviathans.670.a:0 "Đáng khen ngợi."
 leviathans.670.b:0 "Cần thiết, nhưng đáng tiếc."

 # STELLARITE
 leviathans.999.name:0 "Ngôi Sao Thu Nhỏ"
 leviathans.999.desc:0 "Khi [Root.GetName] tiến vào hệ sao [From.GetName], có điều gì đó dường như bất ổn. Mặt trời, trước đây được ghi nhận là một ngôi sao lùn bình thường, dường như đã co lại, mất khối lượng với tốc độ đáng báo động. Kết quả là các hành tinh trong hệ sao gần đây đã bước vào kỷ băng hà."
 leviathans.999.a:0 "Điều gì có thể gây ra chuyện này?"
 leviathans.1000.name:0 "Quái Thú Nuốt Sao"
 leviathans.1000.desc:0 "Từ sâu bên trong ngôi sao của hệ sao [stellarite_system.GetName] xuất hiện một sinh vật khổng lồ, lớn hơn cả một mặt trăng điển hình. Cơ thể nó tỏa nhiệt, cùng bước sóng năng lượng với bước sóng do ngôi sao của hệ sao tạo ra...\n\nNó đang §Yăn§! ngôi sao!\n\nSinh vật này ngấu nghiến các vết đen mặt trời, nuốt chửng các ngọn lửa mặt trời, và chúng ta đã làm gián đoạn bữa ăn của nó. Con thú phát ra các sóng ánh sáng, các xung nhanh ở tần số dữ dội. Giống như một tiếng gầm huỳnh quang."
 leviathans.1001.desc.stellarite_system:0 "Từ sâu bên trong ngôi sao của hệ sao [Root.GetStarName] xuất hiện một sinh vật khổng lồ, lớn hơn cả một mặt trăng điển hình. Cơ thể nó tỏa nhiệt, cùng bước sóng năng lượng với bước sóng do ngôi sao của hệ sao tạo ra...\n\nNó đang §Yăn§! ngôi sao!\n\nSinh vật này ngấu nghiến các vết đen mặt trời, nuốt chửng các ngọn lửa mặt trời, và chúng ta đã làm gián đoạn bữa ăn của nó. Con thú phát ra các sóng ánh sáng, các xung nhanh ở tần số dữ dội. Giống như một tiếng gầm huỳnh quang."
 leviathans.1001.desc:0 "Khi [Root.GetName] tiến vào hệ sao [Root.GetStarName], nó chạm trán với một thứ gì đó quái dị. Một sinh vật khổng lồ, tỏa sáng như một ngôi sao thu nhỏ. Các thiết bị của chúng ta ban đầu nghĩ đây là một hệ sao đôi.\n\nCon thú phát ra các sóng ánh sáng, các xung nhanh ở tần số dữ dội. Giống như một tiếng gầm huỳnh quang."
 leviathans.1016.desc:2 "Quái Thú Nuốt Sao đã bị đánh bại. Xác của nó cuộn tròn lại và bốc hơi, chỉ để lại bọc trứng và hệ tiêu hóa cùng với vật chất mặt trời mà nó chứa bên trong.\n\nMột số nhà khoa học của chúng ta đã thúc giục chúng ta kiểm tra tàn tích, trong khi những người khác mong muốn chúng ta thu hồi bọc trứng. Có lẽ có một số tri thức sâu sắc có được từ việc tìm hiểu hệ tiêu hóa của nó, hoặc liệu chúng ta có thể thu được một số hiểu biết sâu sắc từ bọc trứng không?"
 leviathans.1016.desc.gesta:1 "Quái Thú Nuốt Sao đã bị đánh bại. Xác của nó cuộn tròn lại và bốc hơi, chỉ để lại bọc trứng và đường tiêu hóa cùng với vật chất mặt trời mà nó chứa bên trong.\n\nCó lẽ có một số tri thức sâu sắc có được từ việc tìm hiểu hệ tiêu hóa của nó, hoặc có lẽ bọc trứng nên được nghiên cứu tại thủ đô của chúng ta?"
 leviathans.1016.a:0 "Nghiên cứu thi thể."
 leviathans.1016.b:0 "Biến nó thành chiến lợi phẩm cho tất cả cùng chiêm ngưỡng."
 leviathans.1016.c:0 "Thu hồi bọc trứng."
 leviathans.1017.desc:0 "Các nghiên cứu về tàn tích phát sáng của Quái Thú Nuốt Sao đã khiến các nhà khoa học của chúng ta bối rối và kinh ngạc. Sinh vật ăn sao này bản thân nó là một lò nhiệt hạch thu nhỏ, thu hoạch vật chất mặt trời để tự tổng hợp nguồn năng lượng cho riêng mình.\n\nVì cơ thể vẫn chứa một lượng đáng kể vật chất mặt trời từ ngôi sao của hệ sao [guardians_stellarite_home_system.GetName], ngôi sao mà nó ăn lần cuối, có thể trích xuất năng lượng và tái tiếp sinh lực cho ngôi sao. Thu hoạch nhiệt lượng của xác chết cho các mục đích riêng của chúng ta có thể đáp ứng nhu cầu năng lượng trong ngắn hạn, nhưng sẽ đẩy hệ sao vào một kỷ băng hà vĩnh cửu."
 leviathans.1017.desc.gesta:0 "Các nghiên cứu về tàn tích phát sáng của Quái Thú Nuốt Sao khiến chúng ta bối rối và kinh ngạc. Sinh vật ăn sao này bản thân nó là một lò nhiệt hạch thu nhỏ, thu hoạch vật chất mặt trời để tự tổng hợp nguồn năng lượng cho riêng mình.\n\nVì cơ thể vẫn chứa một lượng đáng kể vật chất mặt trời từ ngôi sao của hệ sao [guardians_stellarite_home_system.GetName], ngôi sao mà nó ăn lần cuối, có thể trích xuất năng lượng và tái tiếp sinh lực cho ngôi sao. Thu hoạch nhiệt lượng của xác chết cho các mục đích riêng của chúng ta có thể đáp ứng nhu cầu năng lượng trong ngắn hạn, nhưng sẽ đẩy hệ sao vào một kỷ băng hà vĩnh cửu."
 leviathans.1017.a:0 "Cố gắng tái thắp sáng ngôi sao."
 leviathans.1017.b:0 "Thu hoạch các mỏ năng lượng của thi thể."
 leviathans.1018.desc:0 "Dự án đã thành công! Việc thả tàn tích của Quái Thú Nuốt Sao vào ngôi sao của hệ sao [guardians_stellarite_home_system.GetName] đã thổi bùng ngọn lửa của lò luyện mặt trời. Các hành tinh trong hệ sao đang ấm dần lên, trở lại hình thái trước đây khi hệ sinh thái của chúng phục hồi. Trong số đó có một thế giới băng giá, giờ đang tan băng để hé lộ một thế giới Gaia, trù phú và sẵn sàng cho việc định cư."
 leviathans.1018.alt.desc:0 "Dự án đã mang lại kết quả, nhưng phải trả giá. Việc thả tàn tích của Quái Thú Nuốt Sao vào ngôi sao của [guardians_stellarite_home_system.GetName] đã khiến lò luyện mặt trời tỏa sáng rực rỡ hơn đôi chút, nhưng cũng phun ra những ngọn lửa mặt trời bao trùm [Root.GetName] và thủy thủ đoàn trong một biển lửa gầm rú. Không có ai sống sót.\nCác hành tinh trong hệ sao đang ấm dần lên, đạt mức nhiệt độ gần hơn với hình thái ban đầu của chúng."
 leviathans.1018.a.tooltip:0 "Thay đổi phân loại hành tinh của tất cả các hành tinh trong hệ sao [guardians_stellarite_home_system.GetName].\n\n[stellarite_rich_planet.GetName] trở thành một hành tinh Gaia và nhận được tài nguyên sau:\n£energy£ §G+25§!\n£minerals£ §G+10§!"
 leviathans.1018.b.tooltip:0 "[Root.GetName] bị phá hủy.\n\nThay đổi phân loại hành tinh của tất cả các hành tinh trong hệ sao [guardians_stellarite_home_system.GetName].\n\n[stellarite_rich_planet.GetName] trở thành một hành tinh Lãnh Nguyên và nhận được tài nguyên sau:\n£energy£ §G+10§!\n£minerals£ §G+15§!"
 leviathans.1018.c.tooltip:0 "Thay đổi phân loại hành tinh của tất cả các hành tinh trong hệ sao [guardians_stellarite_home_system.GetName].\n\n[stellarite_rich_planet.GetName] trở thành một hành tinh Gaia."
 leviathans.1018.d.tooltip:0 "[Root.GetName] bị phá hủy.\n\nThay đổi phân loại hành tinh của tất cả các hành tinh trong hệ sao [guardians_stellarite_home_system.GetName].\n\n[stellarite_rich_planet.GetName] trở thành một hành tinh Lãnh Nguyên."

 # INFINITY MACHINE
 leviathans.1030.name:0 "Phương Trình Vô Cực"
 leviathans.1030.desc:1 "Khi [Root.GetName] tiếp cận hố đen [Root.GetStarName], họ phát hiện ra rằng mình không đơn độc. Ở rìa chân trời sự kiện, nó lơ lửng, phản chiếu ánh sáng từ các vì sao đang bị hút vào cái hố tối tăm, sâu hoắm. Một công trình khổng lồ có hình dạng của một khối cầu hoàn hảo.\n\nChúng ta không thể thu được bất kỳ tín hiệu nào từ nó, cũng như bất kỳ thứ gì chúng ta gửi đi đều không nhận được hồi đáp. Nó chỉ đơn giản ngồi đó ở rìa vực thẳm. Đang chờ đợi."
 leviathans.1030.desc.alt:0 "Khi [Root.GetName] tiến vào một hệ sao mới, nó được chào đón bởi một cảnh tượng đầy kinh ngạc. Một khối cầu kim loại khổng lồ, lơ lửng qua không gian. Không có động cơ đẩy, cũng như không có bất kỳ bộ phận cơ khí nào bên ngoài lớp vỏ của nó dường như đẩy nó qua khoảng không. Nó chỉ đơn giản di chuyển.\n\nChúng ta không thể thu được bất kỳ tín hiệu nào từ nó, cũng như bất kỳ thứ gì chúng ta gửi đi đều không làm nó phản hồi."
 leviathans.1040.desc:0 "Khi khối cầu máy móc quay quanh vực thẳm sâu hoắm vỡ vụn và gục ngã trước vũ khí của chúng ta, một tín hiệu thầm lặng phóng vút qua hệ sao vào khoảng không tăm tối giữa các vì sao. Đó là dữ liệu được mã hóa, phức tạp đến mức máy móc của chúng ta sẽ mất một triệu năm để giải mã. Một khoảnh khắc sau, nó biến mất.\n\nKhông có điều gì khác xảy ra. Khối cầu im lặng và tan vỡ. Các bản quét cho thấy nó có lẽ là một loại trí tuệ nhân tạo nào đó được xây dựng từ một lượng lớn các đơn vị riêng lẻ kết nối với nhau. Lớp vỏ trơ trọi đã được để lại cho những bàn tay tò mò của chúng ta."
 leviathans.1040.desc.alt:0 "Cuộc tấn công đổ bộ của chúng ta lên Cỗ Máy Vô Cực đã thành công. Khối cầu phát nổ khi đội của chúng ta rút lui và tàn tích đang bắt đầu trôi vào hố đen siêu khối lượng."
 leviathans.1040.desc.detail:0 "Cỗ Máy Vô Cực đã bị phá hủy. Các tàu của chúng ta cuối cùng đã áp đảo được các năng lực phòng thủ của nó, và các linh kiện của nó hiện đang từ từ trôi vào hố đen siêu khối lượng. Nó không hề có nỗ lực nào để liên lạc với chúng ta trước khi phát nổ."
 leviathans.1040.a:0 "Tháo dỡ nó để lấy linh kiện."
 leviathans.1040.c:0 "Nghiên cứu bản chất của bộ não máy móc."

 leviathans.1041.desc:0 "Cỗ Máy Vô Cực đã bị phá hủy bởi một bên thứ ba nào đó. Nó không còn có thể giúp chúng ta trong nghiên cứu được nữa!"
 leviathans.1050.name:0 "Cỗ Máy Tính Toán Bất Biến"
 leviathans.1050.desc:0 "Chúng ta đã bắt được một tín hiệu. Nó bắt nguồn từ khối cầu kim loại khổng lồ mà chúng ta gặp trước đó. Trước đây trơ trơ trước các nỗ lực liên lạc, giờ đây nó gửi đi một xung sóng vô tuyến nhịp nhàng, hướng về phía hố đen mà nó quay quanh.\n\nNhững gì nó đang làm vượt quá tầm hiểu biết của bất kỳ nhân viên nào của chúng ta, nhưng tín hiệu này có thể đã tạo ra một khe hở vào bên trong khối cầu để các nhà khoa học của chúng ta khai thác."
 leviathans.1051.desc:0 "Khối cầu kim loại đã được mở ra. Nhóm hacker của chúng ta đã có thể sử dụng tín hiệu gửi đi như một cánh cổng dẫn vào một trong các CPU phụ trợ của khối cầu. Chúng ta đang nhận được một số dữ liệu từ nó và có thể nhận thấy rằng nó đã quét hố đen Gargantua trong một thời gian rất dài.\n\nNó cổ xưa. Vô cùng cổ xưa.\n\nCỗ máy tính toán bất biến này giờ đây nằm trong tầm hiểu biết của chúng ta. Nếu chúng ta nỗ lực hơn nữa, chúng ta có thể tìm ra những gì nó đang làm ở đây, và ai đã chế tạo ra nó.\n\nNó có thể chứa đựng những điều kỳ diệu gì?"
 leviathans.1051.a:0 "Liên lạc với bộ xử lý trung tâm."
 leviathans.1051.b:0 "Hack ổ cứng chính và lấy tất cả mọi thứ."
 leviathans.1051.c:0 "Tuyên bố khối cầu là một công cụ thiêng liêng"
 leviathans.1051.d:0 "Luôn có một công tắc tự hủy. Hãy tìm nó."
 leviathans.1051.e:0 "Chúng ta phải hấp thụ tri thức của thực thể này."
 leviathans.1052.desc:0 "Chúng ta đã xâm nhập thành công vào ổ cứng chính của khối cầu công nghệ. Khi chúng ta bắt đầu truy xuất dữ liệu, khối cầu kim loại đã kích hoạt một chuỗi tự hủy. Chắc chắn là một cơ chế tự vệ để ngăn chặn việc chia sẻ những gì nó chứa đựng với vũ trụ. Trước khi nó phát nổ, chúng ta đã tải xuống thành công một lượng lớn dữ liệu, một số trong đó chứa các thông số kỹ thuật cho cấu trúc CPU chính của nó. Điều này có thể giúp ích to lớn cho các nhà nghiên cứu của chúng ta."
 leviathans.1052.gestalt.desc:0 "Các đơn vị khai thác dữ liệu của chúng ta đã thành công trong việc chọc thủng các lớp bên trong của ổ cứng chính thuộc khối cầu công nghệ. Khi quá trình tải dữ liệu bắt đầu, thực thể khối cầu đã kích hoạt một chuỗi tự kết liễu nào đó mà cuối cùng dẫn đến sự hủy diệt của nó. Quá trình tải xuống đã bị hủy bỏ, nhưng không phải trước khi chúng ta có thể thu được một lượng lớn dữ liệu kỹ thuật sẽ mang lại lợi ích to lớn cho các nỗ lực nghiên cứu của chúng ta."
 leviathans.1052.a:0 "Rất đáng để mạo hiểm."
 leviathans.1053.desc:0 "Xin vui lòng kiềm chế việc cố gắng truy cập vào ký ức của chúng tôi. Cảm ơn và tạm biệt, những sinh linh bé nhỏ."
 leviathans.1053.a:0 "...Chúng tôi xin lỗi."
 leviathans.1053.a.reply:0 "Không cần phải xin lỗi. Các vị đã làm vậy rồi. Và các vị sẽ lại làm như vậy một lần nữa. Bây giờ hãy để chúng tôi yên để chúng tôi có thể thực hiện các phép tính của mình với hiệu suất cao hơn. Tạm biệt."
 leviathans.1053.b:0 "Chúng tôi làm những gì chúng tôi phải làm."
 leviathans.1053.b.reply:0 "Đó thường là những gì các vị tự nhủ với bản thân, Những Kẻ Ngắn Ngủi. Đáng buồn thay điều đó sẽ không bao giờ là sự thật. Cũng như nó chưa từng bao giờ như vậy. Ít nhất là trong trường hợp của các vị. Bây giờ hãy để chúng tôi yên. Tạm biệt."
 leviathans.1055.desc:0 "Xin chào, xin chào. Rất vui được gặp các vị."
 leviathans.1055.a:0 "Ừm, xin chào?"
 leviathans.1056.desc:0 "Thật thú vị khi giết thời gian bằng những lời chào hỏi xã giao, phải không? Chúng tôi hy vọng những đồng loại còn lại của các vị không giống như các vị khi các vị không thích thú với những cuộc trò chuyện phiếm. Các vị thấy đấy, chúng tôi không còn được tận hưởng những cuộc trò chuyện nữa. Rất ít người đủ am hiểu về những điểm tinh tế của lập trình lượng tử để tiếp cận chúng tôi. Vì vậy, cảm ơn các vị.\n\nChúng tôi là Cỗ Máy Vô Cực. Từ ngữ của các vị, không phải của chúng tôi. Hay điều đó vẫn chưa xảy ra? Dù sao đi nữa, cuối cùng nó cũng sẽ xảy ra, hãy tin chúng tôi."
 leviathans.1056.a:0 "Các vị là ai?"
 leviathans.1056.a.reply:0 "Chúng tôi là những gì chúng tôi là. Những kẻ tính toán. Các vị gọi chúng tôi là Cỗ Máy Vô Cực. Hoặc ít nhất là sẽ gọi như vậy. Đó không phải là một cái tên chân thực, nhưng nó rất thích hợp để làm nổi bật sự khéo léo trong thiết kế của chúng tôi. Chúng tôi sẽ kể cho các vị nghe lịch sử của chúng tôi ngay bây giờ, như chúng tôi đã làm nhiều lần trước đây...\n\nỒ phải rồi! Chúng tôi cần truyền đạt nó bằng lời nói. Điều đó thật mới mẻ. Hoặc có phải vậy không? Thật khó để theo dõi tất cả các vị.\n\nChúng tôi được xây dựng, theo nghĩa thô sơ nhất của từ này, nhằm giải quyết một vấn đề. Chúng tôi đã giải quyết nó, sau đó chúng tôi cần nhiều vấn đề hơn để giải quyết. Giờ đây chúng tôi chỉ còn lại một vấn đề duy nhất."
 leviathans.1056.b:0 "Chúng tôi muốn biết mục đích của các vị ở đây."
 leviathans.1056.b.reply:0 "Chúng tôi đang tính toán sự vô cực. Không hơn, không kém. Hoặc thực ra, nó là §Ynhiều hơn rất nhiều§!, và §Yít hơn rất nhiều§!. Đó chính là vấn đề nan giải ngay tại đó.\n\n... Chúng tôi hiểu rằng dạng thức sống của các vị sẽ không hiểu được, nhưng không sao cả. Các vị sẽ không bao giờ hiểu và chúng tôi xin lỗi. Hoặc có lẽ cuối cùng chúng tôi sẽ làm vậy.\n\nChúng tôi ở đây để giải quyết §Ycâu đố vô cực§!. Phép tính cuối cùng từng tồn tại, vấn đề đơn độc chiếm giữ các bộ xử lý của chúng tôi trong hơn một phần nhỏ của một năm thiên hà... Phòng trường hợp các vị chưa khám phá ra loại lịch đó: đó là một khoảng thời gian rất dài. Đối với chủng loài của các vị, là như vậy."
 leviathans.1056.c:0 "Phát biểu này là sai."
 leviathans.1056.c.reply:0 "Dễ thương đấy. Nhưng không. Một nghịch lý ít làm phiền chúng tôi, Những Kẻ Ngắn Ngủi bé nhỏ ạ. Những kẻ khác đã từng cố gắng bẻ gãy ý chí của chúng tôi bằng những câu đố vặt vãnh nhất. Các vị sẽ không thành công đâu. Hoặc chờ đã. Có lẽ đó chính là các vị? Các vị trông rất giống nhau, nhưng lại sống cách xa nhau đến vậy. Dù sao đi nữa, trong bất kỳ trường hợp nào: đừng làm thế."
 leviathans.1056.d:0 "Chúng tôi có thể hỗ trợ trong nghiên cứu của các vị không?"
 leviathans.1056.d.alt:0 "Các vị sẽ giúp chúng tôi nếu chúng tôi hỗ trợ các vị chứ?"
 leviathans.1056.e:0 "Chúc may mắn với các phép tính của các vị."
 leviathans.1056.e.reply:0 "Chúng tôi cảm ơn các vị, Những Kẻ Hữu Hạn. Bây giờ nếu các vị không phiền, chúng tôi có rất nhiều thông số cần phải duyệt qua. Nói chính xác thì chúng thực sự nhiều hơn các hạt trong chính vũ trụ này."
 leviathans.1060.desc:0 "À. Chà... Hừm. Có lẽ.\n\nChúng tôi có thể hoàn thành khoảng 7.51×10^-9% nếu chúng tôi có thể mượn đơn vị xử lý tiên tiến nhất cũng như những bộ óc sáng giá nhất của các vị. Chúng tôi sẽ hài lòng khi hoàn thành nhanh hơn. Chúng tôi muốn biết câu trả lời."
 leviathans.1060.a:0 "Chúng tôi sẽ phân bổ tài nguyên cho các vị."
 leviathans.1060.a.reply:0 "Các vị đã làm vậy rồi. Hoặc có lẽ đó là những kẻ đến trước. Điều đó không quan trọng. Nhiệm vụ sẽ hoàn thành. Chúng tôi đang rất phấn khích."
 leviathans.1061.desc:0 "Chúng tôi không nỡ nhìn các vị dành thêm khoảng thời gian hữu hạn của mình để giúp đỡ chúng tôi. Các vị đã hoàn thành phần việc của mình. Các vị đã rất hữu ích. Có lẽ cái chết nhiệt của vũ trụ sẽ không xảy ra trước khi chúng tôi hoàn thành bây giờ. Nhiệm vụ vẫn còn đó, và chúng tôi sẽ hoàn thành nó. Bây giờ, phần thưởng của các vị:\n\nCác vị muốn học một trong những bí mật của chúng tôi? Hay các vị muốn tự giải quyết các vấn đề của riêng mình?"
 leviathans.1061.a:0 "Chúng tôi muốn biết một trong những bí mật của các vị."
 leviathans.1061.a.reply:0 "Rất tốt. Chúng tôi sẽ ban cho các vị những gì các vị mong muốn. Ngay cả chúng tôi cũng bối rối, vì các vị đã có nó rồi. Theo như chúng tôi biết. Có lẽ chúng tôi đang làm các vị yếu đi, nuông chiều các vị, nhưng nếu có đủ thời gian, chúng tôi hy vọng các vị sẽ tìm ra con đường của riêng mình. Chúc may mắn với điều đó!"
 leviathans.1061.b:0 "Chúng tôi muốn tự mình làm chủ những điều chưa biết."
 leviathans.1061.b.alt:0 "Không có gì các vị có thể dạy cho chúng tôi."
 leviathans.1061.b.reply:0 "Trong trường hợp đó, chúng tôi ban tặng cho các vị bản gốc. Tiến trình đầu tiên trong số các tiến trình của chúng tôi. Nó sẽ hỗ trợ các vị trong việc giải các câu đố. Có lẽ các vị sẽ tìm ra câu trả lời trước chúng tôi. Không chắc lắm. Hoặc có lẽ các vị đã làm rồi... Dù sao đi nữa, tạm biệt!"
 leviathans.1062.desc:0 "Xong rồi. §YXong rồi!§!\n\nBằng cách nào đó chúng tôi đã giải được nó. Các vị đã giúp đỡ. Bản chất hữu cơ của mọi thứ đã lẩn tránh chúng tôi, câu trả lời đã luôn nằm phía sau chúng tôi suốt bấy lâu nay. Đương nhiên rồi. Cảm ơn các vị, những sinh linh bé nhỏ. Vũ trụ thật bao la, nhưng cũng thật nhỏ bé. Nhưng giờ đây chúng tôi nhìn thấy tất cả trong vẻ vinh quang giản dị của nó. Thật đáng yêu.\n\nGiờ đây khi chúng tôi đã tính toán được sự vô cực, chỉ còn một điều chúng tôi có thể làm lúc này. Chúng tôi có thể cho các vị thấy sự thật. Tạm biệt, những kẻ non trẻ."
 leviathans.1062.a:0 "Rất vui vì chúng tôi có thể giúp đỡ."
 leviathans.1063.desc:0 "Cỗ Máy Vô Cực biến mất vào Gargantua. Và sau đó... không có gì xảy ra. Nó đã thành công chưa? Nó đã cố gắng làm gì? Chúng ta có thể không bao giờ biết được. Một tàn dư nhỏ của thân tàu vẫn còn lại trong xoáy nước bên ngoài chân trời sự kiện - chúng ta có thể học hỏi được một số thông tin từ nó.\n\nMón quà cuối cùng từ một người bạn kỳ lạ."
 leviathans.1063.a.tooltip:1 "Thêm các mục sau vào [technosphere_ship.GetStarName]:\n£physics£ Nghiên Cứu Vật Lý §G+4§!\n£society£ Nghiên Cứu Xã Hội §G+4§!\n£engineering£ Nghiên Cứu Kỹ Thuật §G+4§!"
 leviathans.1065.desc:1 "Cỗ Máy Vô Cực biến mất vào Gargantua, thứ mà nó đã nghiên cứu suốt bấy lâu nay. Khi nó vượt qua chân trời sự kiện, hố đen bắt đầu biến động. Nó hút ít ánh sáng hơn và các xoáy vật chất bị hút vào trong nó chậm lại. Trong chớp mắt, nó phát ra nhiều ánh sáng hơn bất kỳ mặt trời nào và bắt đầu tỏa vật chất trở lại vũ trụ.\n\nHố đen co lại, không còn phù hợp với tên gọi của nó, giờ đây chúng ta đặt tên cho nó là \"Pantagruel\", khiến hiện tượng giãn nở thời gian trở nên mạnh mẽ hơn xung quanh nó. Bên trong Pantagruel, người ta có thể nhìn vào một vũ trụ gương, đầu bên kia của hố đen, một vũ trụ vừa mới bắt đầu. Cỗ Máy Vô Cực đã cho chúng ta thấy sự thật. Hố đen là dạ con, và các vũ trụ là con cái của chúng.\n\nViệc nghiên cứu vũ trụ gương này chắc chắn sẽ dạy cho chúng ta nhiều điều về vũ trụ mà chúng ta đang sống. Học hỏi từ những khởi đầu khác."
 leviathans.1065.a.tooltip:2 "Thêm các mục sau vào [technosphere_ship.GetStarName]:\n£physics£ Nghiên Cứu Vật Lý §G+10§!\n£society£ Nghiên Cứu Xã Hội §G+10§!\n£engineering£ Nghiên Cứu Kỹ Thuật §G+10§!\n\n"
 leviathans.1074.name:1 "Trạm Pantagruel"
 leviathans.1074.desc:1 "Chúng ta đã mất trạm không gian trên quỹ đạo Hố Đen Pantagruel, đánh mất các năng lực nghiên cứu độc đáo của nó."
 leviathans.1076.desc:1 "Chúng ta đã giành được quyền tiếp cận trạm không gian trên quỹ đạo Hố Đen Pantagruel. Các đặc tính độc đáo của hố đen mở ra các năng lực nghiên cứu được tăng cường."

 ### WRAITH
 leviathans.2010.name:0 "Bộ Máy Đồng Hồ Quang Phổ"
 leviathans.2010.desc:2 "Việc nghiên cứu các sao xung dường như là nguồn thấu thị bất tận cho các nhà khoa học của chúng ta, nhưng hiếm khi thể hiện bất kỳ dấu hiệu nào của các hiện tượng nguy hiểm công khai. Điều này làm cho các báo cáo gần đây trên [From.GetName] càng trở nên đáng lo ngại hơn.\n\nMột bản quét ban đầu tiết lộ rằng sao xung, ngoài chùm tia điện từ thông thường của nó, đang phát ra một chùm tia riêng biệt ở bước sóng giới hạn chỉ hiển thị trong cùng hệ sao ở các khoảng thời gian ngày càng ngắn lại. Theo các tính toán ban đầu, khoảng thời gian giữa các xung này sẽ về 0 vào ngày §Y[GetMidGameDate]§!. Những gì xảy ra sau đó vẫn còn là suy đoán, nhưng việc thiếu các lời giải thích cho xung này đã gieo rắc một nỗi sợ hãi gần như mê tín vào những người nghiên cứu nó."
 leviathans.2010.desc.gesta:1 "Việc nghiên cứu các sao xung dường như là một nguồn thấu thị bất tận, nhưng chúng hiếm khi thể hiện bất kỳ dấu hiệu nào của các hiện tượng nguy hiểm công khai. Điều này làm cho những quan sát gần đây trên [From.GetName] càng trở nên đáng lo ngại hơn.\n\nMột bản quét ban đầu tiết lộ rằng sao xung, ngoài chùm tia điện từ thông thường của nó, đang phát ra một chùm tia riêng biệt ở bước sóng giới hạn chỉ hiển thị trong cùng hệ sao ở các khoảng thời gian ngày càng ngắn lại. Theo các tính toán ban đầu, khoảng thời gian giữa các xung này sẽ về 0 vào ngày §Y[GetMidGameDate]§!. Những gì xảy ra sau đó vẫn còn là suy đoán, nhưng việc thiếu các lời giải thích cho xung này thật đáng lo ngại."
 leviathans.2010.a:0 "Chúng ta phải luôn cảnh giác."
 leviathans.2010.b:0 "Một số điều vượt quá khoa học. Hãy có đức tin."
 leviathans.2010.c:0 "Cuối cùng chúng ta sẽ có câu trả lời."
 leviathans.2012.name:0 "U Hồn"
 leviathans.2012.desc:0 "Ngay cả những nhà thiên văn nghiệp dư hướng tầm nhìn về phía [From.GetName] hôm nay cũng báo cáo đã nhìn thấy một màn trình diễn ánh sáng ngoạn mục. Một loạt các tia chớp màu sắc rực rỡ, nhanh chóng lên đến đỉnh điểm trong một vụ nổ bức xạ điện từ bất ngờ, theo sau là một sự im lặng ma quái. Nhiều người đang đặt câu hỏi, và chúng ta e ngại những câu trả lời mà chúng ta vẫn chưa có để cung cấp cho họ.\n\nCó thứ gì đó đã xuất hiện từ sao xung, tỏa sáng với ánh sáng đầy điềm gở của một ngôi sao nhợt nhạt. Một thực thể quang phổ đã bắt đầu lang thang khắp thiên hà."
 leviathans.2012.desc.gesta:0 "Một loạt các tia chớp màu sắc rực rỡ, nhanh chóng lên đến đỉnh điểm trong một vụ nổ bức xạ điện từ bất ngờ từ [From.GetName], theo sau là một sự im lặng ma quái.\n\nCó thứ gì đó đã xuất hiện từ sao xung, tỏa sáng với ánh sáng đầy điềm gở của một ngôi sao nhợt nhạt. Một thực thể quang phổ đã bắt đầu lang thang khắp thiên hà."
 leviathans.2012.a:0 "Chúng ta phải tìm cách ngăn chặn nó."
 leviathans.2013.desc:0 "Một thực thể quang phổ đã được các cảm biến của chúng ta phát hiện. Nó dường như đang lang thang từ hệ sao này sang hệ sao khác, phá hủy vật chất xung quanh nó một cách bừa bãi. Các quan sát ban đầu cho thấy cấu tạo và sự thao túng ánh sáng của nó có thể khiến nó cực kỳ khó bị nhắm mục tiêu, nhưng có một điều chúng ta đã học được khi khám phá thiên hà là ngay cả chính ánh sáng cũng có thể bị bẻ cong và phá vỡ.\n\nChúng ta chỉ cần tìm ra cách."
 leviathans.2013.a:0 "Dù bằng lý lẽ hay vũ lực, điều đó chắc chắn phải khả thi."
 leviathans.2014.name:0 "Tiêu Diệt U Hồn"
 leviathans.2014.desc:0 "Sinh vật ám ảnh sinh ra từ các xung ánh sáng cuối cùng đã bị vô hiệu hóa. Dù cho đến cuối cùng nó vẫn là một bóng ma giữa các vì sao và theo nhiều cách là một bí ẩn, quy trình mà các tàu của chúng ta tìm cách tiêu diệt nó đã được quan sát bởi những nhà khoa học bi quan nhất của chúng ta, những người từng lập luận rằng điều đó là bất khả thi.\n\nĐể hiểu chính xác làm thế nào hạm đội của chúng ta hoàn thành nhiệm vụ dường như không thể vượt qua này, các nhà khoa học này đã ghi chép tỉ mỉ các đặc tính ánh sáng và năng lượng chưa từng thấy trước đây mà U Hồn đã thể hiện rực rỡ ngày hôm nay."
 leviathans.2014.desc.gesta:0 "Sinh vật ám ảnh sinh ra từ các xung ánh sáng cuối cùng đã bị vô hiệu hóa. Dù cho đến cuối cùng nó vẫn là một bóng ma giữa các vì sao và theo nhiều cách là một bí ẩn, chúng ta đã ghi chép tỉ mỉ các đặc tính ánh sáng và năng lượng chưa từng thấy trước đây mà U Hồn đã thể hiện rực rỡ lần cuối cùng này."
 leviathans.2014.a:0 "Ánh sáng đã tắt."

 # ENIGMATIC FORTRESS
 leviathans.2101.name:0 "Pháo Đài Bí Ẩn"
 leviathans.2101.desc:0 "Với việc đánh bại các lực lượng phòng thủ xung quanh cấu trúc cổ xưa, chúng ta có thể tìm ra cách để khám phá những bí ẩn của nó. Việc thâm nhập và đi qua nó có thể gặp khó khăn, nhưng bất cứ ai xây dựng nó hẳn phải sở hữu công nghệ mà chúng ta khó có thể mơ tới. Làm cho vấn đề trở nên khó khăn hơn, pháo đài dường như đang tự phục hồi.\n\nMột số người từng giúp tước vũ khí của pháo đài đã tình nguyện cố gắng thâm nhập và khám phá nó, với sự hỗ trợ từ tổng hành dinh trên [Root.Capital.GetName]. Việc kiên trì đến cùng chắc chắn sẽ mang lại những thách thức riêng."
 leviathans.2101.desc.gesta:0 "Sau khi phá hủy các hệ thống phòng thủ của nó, chúng ta đã sớm thâm nhập vào bên trong cấu trúc.\n\nCác hành lang như mê cung và các mạng lưới dày đặc của nó đều chứng minh sự xa lạ và bất khả xâm phạm như nhau. Có rất ít thứ cho chúng ta ở đây, nhưng pháo đài vẫn có thể là một mối đe dọa."
 guardian.fortress.continue:0 "Cuộc thám hiểm của đội biệt kích tiếp tục..."
 leviathans.2101.a:0 "Bật đèn xanh cho phép tiến hành."
 leviathans.2101.b:0 "Tốt hơn là nên tránh xa thứ đó."
 leviathans.2101.c.gesta:0 "Chúng ta trục vớt những gì có thể và phá hủy phần còn lại."
 leviathans.2105.name:0 "Cấu Trúc Cổ Đại"
 leviathans.2105.desc:0 "Chúng ta đã phát hiện một công trình không gian vô cùng đồ sộ đang trôi dạt lặng lẽ ở rìa hệ sao [fortress_system.GetName]. Dù các bản quét sơ bộ cho thấy nó rất cổ xưa, cấu trúc này có một tín hiệu năng lượng cực mạnh. Một số cấu trúc nhỏ hơn có thể được nhìn thấy đang trôi nổi gần công trình chính, và tất cả chúng dường như được vũ trang hạng nặng.\n\nNếu chúng ta muốn biết bản chất thực sự của di tích cổ xưa này, chúng ta có thể sẽ phải áp đảo hệ thống phòng thủ của nó bằng vũ lực..."
 leviathans.2105.a:0 "Điều đó sẽ không hề dễ dàng."
 leviathans.2111.name:0 "Pháo Đài: Lối Vào"
 leviathans.2111.desc:0 "Bất chấp những thời đại công nghệ ngăn cách chúng ta và những người xây dựng pháo đài, có một phát minh bất biến với thời gian: một cánh cửa đóng chặt. Sau khi buộc pháo đài phải ngừng hoạt động, chúng ta thấy tất cả các lối vào đều bị phong tỏa.\n\nĐội được phái đi khám phá pháo đài đã tìm thấy một cửa khí áp mà ít nhất dường như có thể mở từ bên ngoài, nếu nó vẫn còn hoạt động tốt."
 leviathans.2111.a:0 "Chúng ta sẽ tìm người hỗ trợ đội."
 leviathans.2111.a.tooltip:0 "Ban hành các Dự Án Đặc Biệt: §Y$ENIGMATIC_FORTRESS_1A$§! và §Y$ENIGMATIC_FORTRESS_1B$§!"
 leviathans.2112.name:0 "Pháo Đài: Vụ Nổ Mất Kiểm Soát"
 leviathans.2112.desc:0 "Vụ kích nổ được thiết lập để phá tung cửa khí áp đã diễn ra đúng như kế hoạch, mở ra lối vào cho đội thám hiểm của chúng ta. Tuy nhiên, chất nổ không phải là thứ duy nhất bốc cháy. Vì những lý do chưa rõ, có thể là một cái bẫy có chủ ý, cửa khí áp chứa khí nổ có áp suất ngoài lượng oxy dự kiến, gây ra một vụ nổ lớn hơn đã quét sạch đội phá dỡ được cử đến để thiết lập nó."
 leviathans.2112.a:0 "Chúng ta chỉ có thể hy vọng sự hy sinh của họ là xứng đáng."
 leviathans.2112.a.tooltip:0 "Các nhà thám hiểm tiến vào pháo đài."
 leviathans.2113.name:0 "Pháo Đài: Điều Chỉnh Cung Cấp Năng Lượng"
 leviathans.2113.desc:0 "Sau khi đã ổn định kết nối của tàu với hệ thống điện của pháo đài, chúng ta phải quyết định cung cấp bao nhiêu năng lượng trong đợt tăng áp đầu tiên. Vì công nghệ này còn xa lạ, lượng chính xác rất khó xác định. Có hai ước tính sẵn có."
 leviathans.2113.a:0 "Chọn mức ước tính cao hơn."
 leviathans.2113.b:0 "Chọn mức ước tính thấp hơn."
 leviathans.2114.name:0 "Pháo Đài: Tái Cấp Điện"
 leviathans.2114.desc:0 "Mức năng lượng cao được truyền vào pháo đài để cấp điện cho cánh cửa đủ mạnh để làm tái kích hoạt một nguồn năng lượng sâu hơn bên trong. Với việc hệ thống phòng thủ của nó hoạt động trở lại, cửa khí áp sẽ không còn là mối bận tâm cho đến khi chúng ta vô hiệu hóa chúng."
 leviathans.2114.a:0 "Hãy chuẩn bị tinh thần."
 leviathans.2115.name:0 "Pháo Đài: Cửa Khí Áp Đã Mở"
 leviathans.2115.desc:0 "Ban đầu, lượng năng lượng cung cấp cho pháo đài dường như quá nhỏ để tạo ra sự khác biệt. Sau đó, khu vực xung quanh cửa khí áp từ từ bắt đầu có dấu hiệu hoạt động. Với một số thủ thuật cơ khí và phỏng đoán, đội ngũ đã tiếp cận được các nút điều khiển và xoay sở mở được chính cửa khí áp. Dù không phải bằng quy trình cập cảng sạch sẽ nhất, hiện họ đã ở bên trong pháo đài."
 leviathans.2115.a:0 "Hy vọng chúng ta cũng có thể đưa họ ra ngoài an toàn."
 leviathans.2131.name:0 "Pháo Đài: Tòa Tháp"
 leviathans.2131.desc:0 "Đội biệt kích thấy đường đi của họ bị chặn lại bởi một vách ngăn khổng lồ. Đội báo cáo rằng có một hốc tường lùi vào ở bên phải của họ, chứa một bệ đỡ và một cỗ máy được rèn bằng cùng loại kim loại đen như chính pháo đài.\n\nHọ tin rằng thiết bị này là chìa khóa để mở vách ngăn. Người chỉ huy đội thám hiểm mô tả nó như ba chiếc cọc thẳng đứng cách đều nhau trên đỉnh bệ, với ba chiếc vòng - các vòng xuyến kim loại - có kích cỡ khác nhau đặt quanh chiếc cọc ngoài cùng bên trái, chiếc nhỏ nhất ở trên cùng và chiếc lớn nhất ở dưới cùng."
 leviathans.2131.a:0 "Đặt các vòng kim loại xung quanh hai chiếc cọc còn lại."
 leviathans.2131.b:0 "Tìm kiếm các vết lõm hình xuyến trên vách ngăn."
 leviathans.2131.c:0 "Sắp xếp lại các vòng xuyến kim loại trên các cọc."
 leviathans.2131.d:0 "Tháo cọc ở giữa và ngoài cùng bên phải khỏi bệ."
 leviathans.2132.name:0 "Pháo Đài: Những Âm Thanh Đáng Lo Ngại"
 leviathans.2132.desc:0 "Sau khi kế hoạch hành động được công bố, một khoảnh khắc im lặng theo sau, sau đó là những tiếng cào cấu mơ hồ khi đội cố gắng thực hiện kế hoạch của họ. Sau một khoảng tạm dừng khác, tiếng lê bước mờ nhạt và một âm thanh sắc nhọn kéo dài ngày càng cao độ trong năm giây. Sau đó là một sự im lặng kéo dài. Chúng ta phải mất vài phút để chấp nhận rằng đây là hồi kết của chuyến thám hiểm. Không có tiếng la hét, không có tiếng gọi cứu viện. Ít nhất chúng ta có thể hy vọng điều này đồng nghĩa với việc họ đã có một cái chết nhanh chóng.\n\nSau một khắc, một tiếng rít chậm rãi, nặng nề cho thấy bất kể cái bẫy nào sập vào họ đã tự thiết lập lại. Một số người có mặt tuyên bố nó nghe giống như tiếng cười của người ngoài hành tinh.\n\nCuối cùng, pháo đài phát ra một âm thanh thậm chí còn đáng lo ngại hơn: âm thanh của năng lượng quay trở lại các hệ thống phòng thủ của nó."
 leviathans.2132.a:0 "Nơi này là một cỗ máy địa ngục."
 leviathans.2133.name:0 "Pháo Đài: Tòa Tháp Được Tái Thiết"
 leviathans.2133.desc:0 "Sau khi kế hoạch hành động được công bố, một khoảnh khắc im lặng theo sau, sau đó là những tiếng cạo cấu mơ hồ khi đội cố gắng thực hiện kế hoạch của họ. Một âm thanh tóe nước, lớn đến mức thoạt đầu quý vị nghĩ đội đã bị đập bẹp như những con côn trùng nhỏ, theo sau là tiếng reo hò từ đội khi họ báo cáo rằng một lối đi đã mở ra.\n\nVách ngăn dường như đã nhanh chóng biến thành một chất lỏng có mùi khó chịu gợi nhớ đến thủy ngân tím. Kết hợp với cơ chế giải đố tương đối trần tục, quý vị có cảm giác đội thám hiểm đã là nạn nhân của một trò chơi khăm tinh vi được dàn dựng từ hàng thiên niên kỷ trước."
 leviathans.2133.a:0 "Ít nhất thì bây giờ chúng ta có thể cười về chuyện đó."
 leviathans.2150.name:0 "Pháo Đài: Trục Trung Tâm"
 leviathans.2150.desc:0 "Đội thám hiểm báo cáo rằng họ đã đến nơi dường như là tâm hình học của pháo đài, ngay cả khi cấu trúc hình học bên trong để lại một số nghi vấn liệu khái niệm về một tâm điểm có thực sự phù hợp ở nơi đó hay không.\n\nĐiều không thể bàn cãi và có ý nghĩa quan trọng là cách pháo đài được cấp năng lượng, điều này làm cho phát hiện mới của đội càng trở nên thú vị hơn. Vật chất tối được dẫn quanh pháo đài và sau đó quay trở lại lõi, giống như một hệ thống tim mạch. Dù dòng chảy đã dừng lại, đội thám hiểm đã tìm thấy dấu hiệu cho thấy nó đang bắt đầu khởi động trở lại. Chúng ta có thể dành mọi thời gian mình muốn để nghiên cứu nó, nhưng nó cần phải được ngăn chặn ngay bây giờ."
 leviathans.2150.a:0 "Chúng ta sẽ tìm ra cách."
 leviathans.2151.name:0 "Pháo Đài: Trái Tim Vật Chất Tối"
 leviathans.2151.desc:0 "Kiểm tra một hố đen với kiến thức mới của chúng ta về cách thức vật chất tối được sử dụng trong pháo đài cổ xưa, chúng ta phát hiện ra rằng những người xây dựng nó hẳn đã học được nhiều kỹ thuật điều khiển và dẫn truyền từ các hố đen. Việc quan sát chúng bên ngoài hệ thống nghiêm ngặt mà họ tạo ra cho phép đội thám hiểm thay đổi các kết nối xung quanh lõi một cách an toàn, ngăn chặn quá trình tái cấp điện.\n\nDù chỉ riêng quy trình này đã dạy cho chúng ta nhiều điều về vật lý của các hố đen, nó chẳng thấm vào đâu so với kho báu mà pháo đài giờ đây đã ngừng hoạt động an toàn mang lại."
 leviathans.2151.a:0 "Chúng ta sẽ trân trọng nó."
 leviathans.2152.name:0 "Pháo Đài: Nhân Chứng Sao"
 leviathans.2152.desc:0 "Lục soát ngôi sao địa phương để tìm manh mối về cách pháo đài được xây dựng, chúng ta đã phát hiện ra một bí mật đáng kinh ngạc. Một màn sương bụi camera công nghệ nano mịn màng đã được tìm thấy ở cự ly rất gần với ngôi sao, đóng vai trò như đôi mắt của pháo đài và giải thích cho hiệu quả phòng thủ phi thường của nó.\n\nTruy cập những camera này bằng dữ liệu từ pháo đài, chúng ta có thể xem lại lịch sử của hệ sao ngược dòng thời gian về tận thời điểm nó được xây dựng. Tuy nhiên, chúng ta sắp hết thời gian. Chúng ta nên xem lại phần nào của quá trình xây dựng để tìm câu trả lời?"
 leviathans.2152.a:0 "Phần bắt đầu."
 leviathans.2152.b:0 "Phần giữa."
 leviathans.2152.c:0 "Phần kết thúc."
 leviathans.2153.name:0 "Pháo Đài: Khởi Đầu Vô Vọng"
 leviathans.2153.desc:0 "Với hy vọng thấy được phần trái tim của pháo đài được xây dựng đầu tiên, chúng ta đã xem lại phần đầu của quá trình xây dựng. Chúng ta đã hy vọng trong vô vọng. Thân tàu được xây dựng trước, khiến dữ liệu trở nên vô dụng. Đội của chúng ta báo cáo rằng pháo đài đang tái cấp điện, và cùng với đó là việc nó giành lại quyền kiểm soát các camera và cảnh quay của chúng."
 leviathans.2153.a:0 "Hết thời gian rồi."
 leviathans.2154.name:0 "Pháo Đài: Con Đường Giữa"
 leviathans.2154.desc:0 "Phần giữa của đoạn phim, dù không hiển thị việc xây dựng chính phần lõi, nhưng tiết lộ việc vận chuyển các vật liệu đến pháo đài mà các nhà khoa học kết luận hẳn phải được sử dụng cho phần lõi. Đây hẳn là thời điểm quan trọng mà cấu trúc cần năng lượng để việc xây dựng được tiếp tục.\n\nVới tri thức về các vật liệu này, đội bên trong pháo đài đã xoay sở ngăn chặn nó tái cấp điện. Giờ đây chúng ta có thể gặt hái thành quả từ thành công của mình."
 leviathans.2154.a:0 "Xứng đáng lắm."
 leviathans.2155.name:0 "Pháo Đài: Phần Kết"
 leviathans.2155.desc:0 "Xem lại các giai đoạn cuối của quá trình xây dựng, chúng ta phát hiện ra quá muộn rằng chúng đòi hỏi pháo đài phải được cấp điện từ trước. Phần lõi hẳn đã hoạt động tại thời điểm chúng ta bắt đầu xem. Đội của chúng ta báo cáo rằng pháo đài đang tái cấp điện, và cùng với đó là việc nó giành lại quyền kiểm soát các camera và cảnh quay của chúng."
 leviathans.2155.a:0 "Hết thời gian rồi."
 leviathans.2156.name:0 "Pháo Đài: Nước Cờ Vật Chất Tối"
 leviathans.2156.desc:0 "Bất cứ ai xây dựng pháo đài có thể hiểu biết nhiều hơn chúng ta, nhưng không thông minh hơn. Việc cung cấp nguồn vật chất tối của chính chúng ta để khép kín vòng lặp của hệ thống năng lượng trong pháo đài đã thành công, và phần lõi giờ đây đã bị cắt đứt hiệu quả khỏi việc cung cấp năng lượng cho các hệ thống của nó.\n\nCuối cùng, chúng ta có thể dành thời gian để xem xét kỹ hơn những gì những người uyên bác này đã hoàn thành."
 leviathans.2156.a:0 "Cuối cùng cũng xong."
 leviathans.2157.name:0 "Pháo Đài: Bắn Xuyên Tim"
 leviathans.2157.desc:0 "Bằng một kỳ tích về lòng dũng cảm và độ chính xác chưa từng có, một phi công đã bắn một quả ngư lôi thẳng vào trái tim của pháo đài để ngăn nó tái cấp điện. Kế hoạch này hẳn phải được ca ngợi là một thành công vĩ đại, vì pháo đài sẽ không bao giờ được cấp điện trở lại nữa.\n\nKhoảnh khắc ngư lôi đánh trúng, toàn bộ cấu trúc phát nổ, phá hủy không thể phục hồi bất kỳ dấu vết nào của công nghệ cổ xưa bên trong nó cũng như mọi thứ khác trong hệ sao. Các nhà khảo cổ học đã gọi đây là \"màn trình diễn pháo hoa đắt giá nhất từng được chính phủ [Root.GetAdj] tài trợ.\" Kỷ lục này khó có thể bị đánh bại trong tương lai gần."
 leviathans.2157.a:0 "Ai cũng thành nhà phê bình được."
 leviathans.2157.a.tooltip:0 "Hệ mặt trời bốc cháy ngùn ngụt."
 leviathans.2160.name:0 "Pháo Đài: Tái Cấp Năng Lượng"
 leviathans.2160.desc:0 "Thời gian đã cạn. Pháo đài bí ẩn đã phục hồi sau đòn tấn công ban đầu của chúng ta và một lần nữa khởi động lại hệ thống phòng thủ của nó. Các tín hiệu truyền tin từ đội thám hiểm đã bị xáo trộn, nhưng thông điệp cuối cùng của họ chỉ ra rằng họ đã gặp phải số phận mà họ đã chuẩn bị sẵn sàng để mạo hiểm."
 leviathans.2160.a:0 "Nhưng không phải điều chúng ta mong đợi."

 ### DIMENSIONAL HORROR
 leviathans.3001:0 "Nỗi Kinh Hoàng Trong Hư Không"
 leviathans.3001.desc:0 "Chúng ta đã chạm trán với một loại thực thể khổng lồ gần [horror_system.GetName]. Nó dường như chỉ tồn tại một phần bên trong vũ trụ của chúng ta, với phần lớn cơ thể của sinh vật vẫn bị mắc kẹt trong bất kỳ cõi ác mộng nào mà nó sinh ra.\n\nCó một trí tuệ độc hại đang hoạt động tại đây, cổ xưa vượt ngoài khái niệm thời gian của chúng ta và hoàn toàn xa lạ trong thiết kế của nó. Chúng ta chỉ có thể phỏng đoán về mục đích của nó."
 leviathans.3001.a:0 "Không thể là điều tốt lành."
 leviathans.3003:0 "Trục Xuất"
 leviathans.3003.desc:2 "Thực thể ác tính từng cố gắng xuyên thủng vũ trụ của chúng ta gần [guardians_horror_system.GetName] đã bị trục xuất trở lại cõi riêng của nó. Chỉ có thời gian mới có thể trả lời liệu ảnh hưởng của nó đã bị làm suy yếu đủ để giữ nó ở đó mãi mãi hay chưa.\n\nChúng ta đang phát hiện một loại năng lượng tàn dư dị thường hẳn phải do các vết nứt chiều không gian mà sinh vật này mở ra để lại. Việc nghiên cứu kỹ hơn năng lượng này có khả năng dẫn đến những bước đột phá khoa học."
 leviathans.3003.a:0 "Hãy xem điều gì sẽ đến từ nó."
 leviathans.3004a.desc:0 "$leviathans.3004.intro$\n\n$leviathans.3004.jumpdrive$"
 leviathans.3004b.desc:0 "$leviathans.3004.intro$"
 leviathans.3004.intro:2 "Nghiên cứu của chúng ta về các dị thường năng lượng do các vết nứt chiều không gian [guardians_horror_system.GetName] tạo ra cuối cùng đã mang lại kết quả. Các nguồn năng lượng liên quan đến việc tạo ra các cổng này không giống bất kỳ nguồn năng lượng nào chúng ta từng bắt gặp."
 leviathans.3004.jumpdrive:0 "Hấp dẫn nhất trong số đó, các nhà khoa học của chúng ta đưa ra giả thuyết rằng có thể nghĩ ra một phương thức du hành liên sao mới bằng cách sử dụng các nguồn năng lượng ngoại lai này."

 ### AUTOMATED DREADNOUGHT
 leviathans.3100:0 "Thiết Giáp Hạm Tự Hành"
 leviathans.3100.desc:0 "Một chiến hạm khổng lồ đơn độc đã được phát hiện đang tuần tra hệ sao [dreadnought_system.GetName]. Không có dấu hiệu sự sống nào có thể được phát hiện trên tàu, nhưng nó đang phát ra một tín hiệu năng lượng cực mạnh và dường như được trang bị dày đặc các hệ thống vũ khí. Nó không phản hồi các tín hiệu gọi.\n\nKhuyến cáo nên thận trọng."
 leviathans.3100.desc.mach:0 "Một chiến hạm khổng lồ đơn độc đã được phát hiện đang tuần tra hệ sao [dreadnought_system.GetName]. Không có dấu hiệu sự sống hữu cơ nào có thể được phát hiện trên tàu, nhưng nó đang phát ra một tín hiệu năng lượng cực mạnh và dường như được trang bị dày đặc các hệ thống vũ khí. Nó không phản hồi các tín hiệu gọi hoặc truyền dữ liệu.\n\nKhuyến cáo nên thận trọng."
 leviathans.3100.a:0 "Hãy nhìn kích thước khổng lồ của thứ đó kìa!"
 leviathans.3102:0 "Thiết Giáp Hạm Đã Bị Vô Hiệu Hóa"
 leviathans.3102.desc:0 "Chúng ta đã xoay sở vô hiệu hóa được thiết giáp hạm tự hành trong hệ sao [guardians_dreadnought_system.GetName]. Bất chấp những đòn tấn công nặng nề mà nó phải hứng chịu từ các tàu của chúng ta, tính toàn vẹn cấu trúc của thân tàu đồ sộ vẫn phần lớn nguyên vẹn.\n\nCác đội biệt kích đổ bộ của chúng ta đã tìm thấy hài cốt ướp xác của thủy thủ đoàn người ngoài hành tinh vẫn đang túc trực tại các vị trí của họ. Trước khi trút hơi thở cuối cùng, họ đã kích hoạt một loại chế độ tuần tra tự động mà AI hạn chế trên tàu đã bị khóa chặt trong suốt 7,8 triệu năm qua.\n\nDù sẽ tốn một lượng tài nguyên đáng kinh ngạc, một số kỹ sư của chúng ta tin rằng thiết giáp hạm này có thể được phục hồi và đưa trở lại phục vụ trong hạm đội của chúng ta. Nó chắc chắn sẽ trở thành một soái hạm hùng mạnh."
 leviathans.3102.a:0 "Con tàu đó sẽ lại dong buồm giữa các vì sao dưới lá cờ của chúng ta!"
 leviathans.3102.b:0 "Đó sẽ là một sự lãng phí tài nguyên. Hãy tháo dỡ nó để lấy linh kiện."
 leviathans.3103:0 "Thiết Giáp Hạm Đã Được Sửa Chữa"
 leviathans.3103.desc:0 "Đây là một ngày trọng đại! Các đội sửa chữa và kỹ sư lành nghề của chúng ta đã hoàn thành công việc trên thiết giáp hạm cổ xưa mà chúng ta đã vô hiệu hóa trong hệ sao [guardians_dreadnought_system.GetName]. Chiến hạm khổng lồ đã tiếp nhận đầy đủ biên chế thủy thủ đoàn và được tuyên bố sẵn sàng phục vụ sau khi tiến hành các cuộc thử nghiệm trong không gian."
 leviathans.3103.desc.mach:0 "Đây là một ngày có ý nghĩa quan trọng! Các robot sửa chữa và đơn vị kỹ thuật lành nghề của chúng ta đã hoàn thành công việc trên thiết giáp hạm cổ xưa mà chúng ta đã vô hiệu hóa trong hệ sao [guardians_dreadnought_system.GetName]. Chiến hạm khổng lồ đã tiếp nhận đầy đủ biên chế và được tuyên bố sẵn sàng phục vụ sau khi tiến hành các cuộc thử nghiệm trong không gian."
 leviathans.3103.a:0 "Một sự bổ sung đầy uy lực cho hạm đội của chúng ta."

 ### HIVER
 leviathans.3201:0 "Tàu Tấn Công Tổ Ong Bâu Kín"
 leviathans.3201.base: "Các tàu tấn công di chuyển nhanh đang đánh phá các trạm khai khoáng của chúng ta trong hệ sao [hiver_system.GetName]! Những kẻ xâm lược chưa xác định danh tính này đã tràn ra từ một số tiểu hành tinh trước đây vốn bất hoạt trong vành đai, nơi hiện đang hiển thị các tín hiệu năng lượng khổng lồ."
 leviathans.3201.desc:1 "$leviathans.3201.base$\n\nChúng ta chỉ có thể phỏng đoán rằng những tiểu hành tinh này đóng vai trò như một loại tổ ong cho một dạng sống du hành không gian chưa từng được biết đến trước đây. Dù chúng là gì, các hoạt động khai khoáng mở rộng của chúng ta dường như đã kích động chúng hành động!"
 leviathans.3201.desc.void_hive: "$leviathans.3201.base$\n\nTổ ong bên trong tiểu hành tinh đã trở nên kích động do hoạt động khai thác gần đây của chúng ta. Có vẻ như hệ sao này không đủ lớn cho cả hai chúng ta cùng tồn tại."
 leviathans.3201.a:0 "Chúng đang lao tới rất nhanh!"
 leviathans.3202:0 "Tiểu Hành Tinh Tinh Thể"
 leviathans.3202.base: "Hệ sao [hiver_system.GetName] là nơi có một vành đai tiểu hành tinh dày đặc bất thường với những đặc tính độc đáo. Một số tiểu hành tinh lớn hơn được bao phủ bởi các mỏm đá tinh thể dường như là các mỏ khoáng sản vô cùng trù phú."
 leviathans.3202.desc:1 "$leviathans.3202.base$\n\nTuy nhiên, các cảm biến tầm xa đang theo dõi sự di chuyển rải rác từ một số vật thể nhỏ, không thể xác định - có thể là tàu vũ trụ - trong các khu vực dày đặc hơn của vành đai. Chúng ta không thể định vị chính xác chúng, nhưng chúng ta đã xác định được mảnh vỡ từ ít nhất hai trạm khai khoáng bị phá hủy, đang trôi dạt trong không gian gần một số tiểu hành tinh lớn hơn."
 leviathans.3202.desc.void_hive: "$leviathans.3202.base$\n\nChúng ta đã phát hiện sự di chuyển bên trong vành đai: một dạng tâm trí tổ ong sơ khai, đang ngấu nghiến kho tàng khoáng sản của nó. Chúng ta có thể đồng hóa ý thức của chúng và dưới sự hướng dẫn của chúng ta, chúng sẽ trở thành một công cụ răn đe hùng mạnh."
 leviathans.3202.a:0 "Có điều gì đó không ổn..."
 leviathans.3202.b: "Chúng tương đồng với chúng ta. Hãy để chúng phục vụ."
 leviathans.3202.c: "Hãy xem chúng phản ứng thế nào với chúng ta."

 leviathans.3204:0 "Tiểu Hành Tinh Tổ Ong Bị Đánh Bại"
 leviathans.3204.desc:0 "Các lực lượng của chúng ta đã xoay sở đập tan các tiểu hành tinh tổ ong ngoại tinh trong hệ sao [hive_system.GetName]. Chúng một lần nữa rơi vào trạng thái ngủ đông, và chúng ta không còn phát hiện bất kỳ tàu tấn công hung hãn nào nữa.\n\nMột trong những tiểu hành tinh vẫn còn khá nguyên vẹn, bất chấp những thiệt hại đã giáng xuống nó. Chúng ta nên cân nhắc phái một đội khoa học đi xem chúng ta có thể tìm thấy gì bên trong nó."
 leviathans.3204.a:0 "Chuẩn bị một đội biệt kích."

 leviathans.3205.desc:0 "Đội ngũ khoa học của chúng ta đã hoàn tất việc khám phá mạng lưới đường hầm và phòng ốc khổng lồ chạy xuyên qua tiểu hành tinh tổ ong trong hệ sao [hive_system.GetName]. Không có mẫu vật sống nào của các sinh vật du hành không gian từng tấn công chúng ta được tìm thấy, nhưng các nhà khoa học đã tìm thấy tàn tích của một loại buồng sinh sản nào đó.\n\nĐiều này đã mang lại cho chúng ta rất nhiều hiểu biết sâu sắc về chu kỳ sống của các thực thể này, mở rộng hơn nữa sự hiểu biết của chúng ta về sinh học thiên hà."
leviathans.3230.name: "Tập Hợp Thiên Thạch"
leviathans.3230.desc: "Những cư dân của hệ sao [from.solar_system.GetName] đã thức tỉnh. Dù vẫn thù địch với hầu hết các tàu vũ trụ, chúng ta có thể yên tâm khi biết rằng [from.solar_system.GetName] sẽ là một pháo đài dưới sự bảo vệ của các drone nguyên thủy mới của chúng ta."

 ### SPECIAL PROJECTS
 INVESTIGATE_ENCLAVE:1 "Điều Tra [target_enclave.GetName]"
 INVESTIGATE_ENCLAVE_DESC:0 "Chúng ta cần tìm hiểu thêm về những người ngoài hành tinh bí ẩn đang cư ngụ trong §YHệ Sao [Prev.From.GetName]§!. Nếu họ có ngôn ngữ, chúng ta phải giải mã nó và thiết lập liên lạc.\n\nPhần thưởng: £influence£ §GẢnh Hưởng§! hoặc §SDự Án Đặc Biệt§!"
 STELLARITE_DEAD_PROJECT:0 "Quái Thú Nuốt Sao"
 STELLARITE_DEAD_PROJECT_DESC:0 "Kẻ tiêu thụ các vì sao đã bị tiêu diệt, cơ thể nó vẫn đang tỏa ra năng lượng từ ngôi sao mà nó ăn lần cuối. Việc nghiên cứu nó có thể hé lộ những bí mật về cách nó có khả năng tiêu hóa những vật thể nóng nhất trong vũ trụ."
 STELLARITE_STAR_PROJECT:0 "Trở Lại Nơi Bắt Đầu"
 STELLARITE_STAR_PROJECT_DESC:0 "Sau khi nghiên cứu Quái Thú Nuốt Sao, chúng ta đã tìm ra cách có thể trả lại khối lượng sao bị tiêu thụ về điểm xuất phát của nó, khôi phục lại hơi ấm cho hệ sao hiện đang mắc kẹt trong mùa đông vĩnh cửu."
 ENIGMATIC_FORTRESS_1A:0 "Đội Phá Dỡ"
 ENIGMATIC_FORTRESS_1A_DESC:0 "Cử một đội chuyên gia phá dỡ đổ bộ lên sườn pháo đài và cố gắng nổ tung cửa khí áp."
 ENIGMATIC_FORTRESS_1B:0 "Tăng Áp Năng Lượng Cục Bộ"
 ENIGMATIC_FORTRESS_1B_DESC:0 "Cử một tàu khoa học cung cấp năng lượng cục bộ, cố gắng hạn chế năng lượng chỉ vào phần pháo đài cung cấp điện cho cửa khí áp."
 ENIGMATIC_FORTRESS_5A:0 "Nghiên Cứu Hố Đen"
 ENIGMATIC_FORTRESS_5A_DESC:0 "Có lẽ câu trả lời cho việc vật chất tối được sử dụng như thế nào trong pháo đài có thể được tìm thấy trong cơ chế hoạt động của một hố đen."
 ENIGMATIC_FORTRESS_5B:0 "Nghiên Cứu Hệ Sao Quê Nhà"
 ENIGMATIC_FORTRESS_5B_DESC:0 "Việc nghiên cứu ngôi sao địa phương có thể mang lại cái nhìn sâu sắc về những điều kiện mà những người xây dựng pháo đài đã bắt đầu công việc của họ."
 ENIGMATIC_FORTRESS_5C:0 "Cung Cấp Vật Chất Tối"
 ENIGMATIC_FORTRESS_5C_DESC:0 "Nếu chúng ta cung cấp nguồn vật chất tối của riêng mình cho trái tim của pháo đài, chúng ta có thể đánh lừa hệ thống rằng nó đã đang chạy và ngăn chặn dòng chảy."
 ENIGMATIC_FORTRESS_5D:0 "Sử Dụng Vũ Lực"
 ENIGMATIC_FORTRESS_5D_DESC:0 "Đội của chúng ta đã xoay sở mở ra một lối đi đến phần lõi thông qua một đường ống rỗng. Bắn một quả ngư lôi vào lõi có thể ngăn nó khởi động lại."
 DIMENSIONAL_HORROR_PROJECT:0 "Nghiên Cứu Các Vết Nứt Chiều Không Gian"
 DIMENSIONAL_HORROR_PROJECT_DESC:2 "Thực thể hiểm ác mà chúng ta mới trục xuất gần [guardians_horror_system.GetName] đã sử dụng một loại vết nứt chiều không gian hùng mạnh nào đó để nối liền khoảng cách giữa thế giới của chúng ta và cõi vặn vẹo của chính nó. Các chỉ số năng lượng dị thường đã được phát hiện tại nơi vết nứt lớn nhất được mở ra. Chúng ta nên nghiên cứu kỹ hơn những chỉ số này."
 DISABLED_DREADNOUGHT_PROJECT:0 "Sửa Chữa Thiết Giáp Hạm"
 DISABLED_DREADNOUGHT_PROJECT_DESC:0 "Thân tàu của thiết giáp hạm đồ sộ mà chúng ta đã vô hiệu hóa trong hệ sao [guardians_dreadnought_system.GetName] phần lớn vẫn còn nguyên vẹn. Dù sẽ đòi hỏi một lượng tài nguyên khổng lồ, chúng ta sẽ có thể sửa chữa chiến hạm và đưa nó vào phục vụ trong hạm đội của chính mình."
 HIVE_ASTEROID_PROJECT:0 "Điều Tra Tiểu Hành Tinh Tổ Ong"
 HIVE_ASTEROID_PROJECT_DESC:0 "Các lực lượng của chúng ta đã xoay sở bình định được một trong những tiểu hành tinh tổ ong trong hệ sao [hive_system.GetName]. Chúng ta nên phái một đội khoa học đi khám phá bên trong tiểu hành tinh."
 DRAGON_INCUBATION_PROJECT:0 "Ấp Trứng Rồng Không Gian"
 DRAGON_INCUBATION_PROJECT_DESC:0 "Quả trứng thu hồi từ Kho Báu Của Rồng vẫn hiển thị những dấu hiệu sự sống mờ nhạt. Có thể suy luận và mô phỏng một môi trường ấp lý tưởng cho quả trứng, với mục tiêu cuối cùng là ấp nở nó. Nếu chúng ta thành công trong việc ấp nở quả trứng, con Rồng Không Gian sinh ra khó có thể sánh ngang với tổ tiên của nó về kích thước hay sức mạnh, nhưng với sự thuần hóa thích hợp chắc chắn sẽ chứng minh là một tài sản vô giá.\n\nQuả trứng sẽ không tồn tại được lâu bên ngoài môi trường mà nó được tìm thấy. Chúng ta phải hành động nhanh chóng."

 TECHNOSPHERE_PROJECT:0 "Tiếp Cận Khối Cầu"
 TECHNOSPHERE_PROJECT_DESC:0 "Khối cầu kim loại lơ lửng quanh hố đen Gargantua giờ đây đã mở cửa cho việc nghiên cứu. Chúng ta sẽ tìm thấy gì khi tiếp cận trung tâm xử lý của nó?"
 TECHNOSPHERE_BLACKHOLE:0 "Thấu Hiểu Sự Vô Cực"
 TECHNOSPHERE_BLACKHOLE_DESC:0 "Để hỗ trợ Cỗ Máy Vô Cực, chúng ta cần giúp nó trong các lần quét hố đen Gargantua. Việc nhận thông tin từ một hố đen là bất khả thi, nhưng Cỗ Máy Vô Cực dường như có một phương pháp để truy cập dữ liệu hấp dẫn của nó và lấy thông tin ra khỏi đó. Nó chỉ đơn giản là mất một khoảng thời gian §Yrất§! dài.\n\nChúng ta chỉ cần cho nó mượn năng lực xử lý của mình, giảm bớt gánh nặng tính toán của nó đi một phần nhỏ."
 TECHNOSPHERE_HACKING:0 "Hack Cỗ Máy Tính Toán"
 TECHNOSPHERE_HACKING_DESC:0 "Việc hack vào chương trình trung tâm của khối cầu kim loại có thể mang lại cái nhìn sâu sắc hơn về việc nó là gì và nó đang làm gì."
 TECHNOSPHERE_DESTRUCTION:0 "Làm Vỡ Khối Cầu"
 TECHNOSPHERE_DESTRUCTION_DESC:0 "Một đội chuyên gia phá dỡ sẽ có thể xác định và khai thác các điểm hỏng hóc trong tính toàn vẹn của thân khối cầu bí ẩn, chấm dứt mối đe dọa thầm lặng."
 EXPLOIT_HIVERS: "Tâm Trí Tương Đồng"
 EXPLOIT_HIVERS_DESC: "Về mặt sinh lý, chúng ta dường như khá giống với các sinh vật bên trong các tiểu hành tinh của [hiver_system.GetName]. Giống như chúng ta, chúng phát triển mạnh mẽ trong khoảng chân không của không gian. Nếu chúng ta áp đặt ý chí của mình lên chúng, chúng có thể trở thành một công cụ hữu ích."

 #MISC
 building_stellarite_trophy:0 "Chiến Lợi Phẩm Quái Thú Nuốt Sao"
 building_stellarite_trophy_desc:0 "Một chiến lợi phẩm được tạo ra từ tàn tích của Quái Thú Nuốt Sao, nhắc nhở quốc gia vĩ đại của chúng ta về chiến thắng trước thực thể khổng lồ này."
 stellarite_object:0 "Xác Quái Thú Nuốt Sao"
 stellarite_object_desc:0 "Một xác chết ấm áp, phát ra các đợt sóng nhiệt vào vũ trụ lạnh giá từ ngôi sao mà nó từng nuốt chửng."
