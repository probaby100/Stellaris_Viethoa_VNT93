 LEVIATHANS_TITLE: "Gói Nội Dung Cốt Truyện Leviathans" # Do not translate
 DLC_LEVIATHANS_RECOMMENDATION_DESC:0 "§SLeviathans§! là gói nội dung cốt truyện đưa vào thiên hà những chuyến phiêu lưu và thử thách mới cho các đế chế du hành không gian."
 DLC_LEVIATHANS_RECOMMENDATION_ROBOT_REC:1 "Chúng tôi khuyên dùng §SLeviathans§! vì cơ cấu của đế chế này phù hợp với cơ chế và nội dung của nó - cụ thể là khám phá không gian và đối đầu với các Quái Thú Không Gian khổng lồ."

