 BIO_PROPULSION:0 "Hệ Đẩy Sinh Học"
 BIO_SENSORS:0 "Cảm Biến Sinh Học"
 BIO_DETECTOR:0 "Máy Dò Sinh Học"
 GUARDIAN_DRIVE:0 "$BIO_DRIVE$"
 GUARDIAN_PROPULSION:0 "$BIO_PROPULSION$"
 GUARDIAN_SENSORS:0 "$BIO_SENSORS$"
 mod_damage_vs_country_type_guardian_dragon_mult:0 "Sát thương lên Rồng Không Gian"
 enigmatic_fortress_chain_title:0 "Pháo Đài Bí Ẩn"
 enigmatic_fortress_chain_desc:0 "Sau khi buộc pháo đài cổ xưa phải ngừng hoạt động, một đội thám hiểm đã được cử đi để tìm cách ngăn nó cấp điện trở lại."
 fortress_station_data:0 "Dữ Liệu Trạm Pháo Đài"
 dreadnought_object:0 "Thiết Giáp Hạm Bị Vô Hiệu Hóa"
 dreadnought_object_tooltip:0 "Thân tàu của chiến hạm khổng lồ này phần lớn vẫn còn nguyên vẹn, bất chấp việc phải hứng chịu một lượng sát thương khó tin."
 dreadnought_object_desc:0 "Thân tàu của chiến hạm khổng lồ này phần lớn vẫn còn nguyên vẹn, bất chấp việc phải hứng chịu một lượng sát thương khó tin."

 dormant_hive_base_2_object:0 "Tiểu Hành Tinh Tổ Ong Ngủ Đông"
 dormant_hive_base_2_object_tooltip:0 "Tiểu hành tinh tổ ong này từng tràn đầy hoạt động, nhưng giờ đây hỏa lực vũ khí đã khiến nó trở nên trơ trọi. Không có dấu hiệu nào của bất kỳ tàu tấn công nhỏ hơn nào."
 dormant_hive_base_2_object_desc:0 "Tiểu hành tinh tổ ong này từng tràn đầy hoạt động, nhưng giờ đây hỏa lực vũ khí đã khiến nó trở nên trơ trọi. Không có dấu hiệu nào của bất kỳ tàu tấn công nhỏ hơn nào."

 pc_crystal_asteroid:0 "Tiểu Hành Tinh Tinh Thể"
 pc_crystal_asteroid_desc:0 "Một tiểu hành tinh lớn được bao phủ bởi một loại mỏm đá tinh thể nào đó."

 enclave_traders_sr1:1 "Thỏa Thuận Tài Nguyên Chiến Lược Riggan"
 enclave_traders_sr2:1 "Thỏa Thuận Tài Nguyên Chiến Lược XuraCorp"
 enclave_traders_sr3:1 "Thỏa Thuận Tài Nguyên Chiến Lược Muutagan"

 opinion_destroyed_curator:0 "Đã Phá Hủy Đặc Khu Giám Tuyển"
 opinion_destroyed_curator_insight:0 "Đã phá hủy Giám Tuyển mà chúng ta có thỏa thuận cùng"
 opinion_destroyed_trader:0 "Đã Phá Hủy Đặc Khu Thương Nhân"
 opinion_destroyed_trader_sr:0 "Đã phá hủy Thương Nhân mà chúng ta có thỏa thuận cùng"

 leader_trait_dragonslayer:0 "Kẻ Giết Rồng"
 leader_trait_dragonslayer_desc:0 "Chỉ Huy này đã chứng minh bản thân trong các trận chiến khốc liệt."
 leader_trait_dragonbane:0 "Ác Mộng Của Rồng"
 leader_trait_dragonbane_desc:0 "Nhà Lãnh Đạo này đã từng trải qua chiến trận ác liệt, và sống sót để kể lại câu chuyện đó."

 infinity_calculations:0 "Bộ Xử Lý Điểm Dị Thường"
 infinity_calculations_desc:0 "Hỗ trợ Cỗ Máy Vô Cực đã khiến nó ban tặng cho chúng ta bí mật đằng sau nguồn gốc của nó. Một đơn vị xử lý có khả năng tự mở rộng. Điều này sẽ nâng cao hơn nữa năng lực nghiên cứu của chúng ta."
 infinity_calculations_hacked:0 "$infinity_calculations$"
 infinity_calculations_hacked_desc:0 "Việc hack vào cỗ máy hình cầu đã cho phép chúng ta tìm hiểu bí mật đằng sau sức mạnh xử lý của nó. Điều này giúp nâng cao đáng kể tiềm năng nghiên cứu của chúng ta."
 black_hole_pantagruel:1 "Gương Soi Tri Thức"
 black_hole_pantagruel_desc:1 "Hố đen Pantagruel đã trở thành tấm gương soi vào một vũ trụ mới được tạo ra, mở ra tiềm năng nghiên cứu to lớn nếu chúng ta xây dựng một trạm không gian trên quỹ đạo của nó."
 black_hole_pantagruel_research:1 "$black_hole_pantagruel$"
 black_hole_pantagruel_research_desc:2 "Chúng ta đã nhìn vào vũ trụ gương của hố đen Pantagruel, nâng cao năng lực nghiên cứu của chúng ta."
 technosphere_praising:0 "Công Nghệ Thiêng Liêng"
 technosphere_praising_desc:0 "Nhân dân chúng ta đang tôn kính cỗ máy tính toán hình cầu khổng lồ như một dấu hiệu về quyền năng thực sự của Đấng Thiêng Liêng trên thế giới."

 germinating_wraith:0 "Nảy Mầm Xung Ánh Sáng"
 germinating_wraith_desc:0 "Một thứ gì đó tà ác đang đến gần."

 building_artist:0 "Đài Tưởng Niệm Nghệ Thuật"
 building_artist_desc:0 "Một đài tưởng niệm nghệ thuật trang trí đặt câu hỏi về bản chất của sự tồn tại và đạo đức. Hoặc có lẽ đó là sự trầm ngâm về sự mong manh của nền văn minh... hoặc nỗi đau thương là không thể tránh khỏi trong quá trình xây dựng tính cách như thế nào... Hừm..."
 building_artist_patron:0 "Bộ Văn Hóa"
 building_artist_patron_desc:0 "Một tổng hành dinh thời thượng cho Bộ Văn Hóa, giúp truyền bá tri thức, giải trí và nghệ thuật đến đông đảo quần chúng."
 building_artist_patron_gestalt_desc:0 "Một trụ sở được cho là thời thượng của Bộ Văn Hóa, hình dáng của nó thách thức sự hiểu biết tập thể của Những Kẻ Đơn Ý Thức."
 building_artist_tooltip:0 "§RKhông còn §Y$building_artist$§! nào sẵn có để xây dựng. Hãy mua một cái mới hoặc tháo dỡ một cái hiện có.§!"
 enclave_artist_patron:0 "Nhà Bảo Trợ Nghệ Thuật"
 enclave_artist_patron_desc:1 "Quý vị đang cống hiến thời gian và nỗ lực để hỗ trợ sự phát triển của nghệ thuật mới."
 enclave_artist_festival:0 "Lễ Hội Các Thế Giới"
 enclave_artist_festival_desc:1 "Một lễ hội do Đoàn Nghệ Nhân tổ chức, lan tỏa niềm vui trên toàn đế chế."
 enclave_artist_festival_outrage:0 "Sự Hoảng Loạn Có Tổ Chức"
 guardian.deal.tooltip:0 "Chúng ta không thể chi trả cho điều này"
 enclave_artist_festival_outrage_desc:0 "Lễ Hội Các Thế Giới đã mang lại sự hỗn loạn trên hành tinh này khi đám đông giẫm đạp lên những đồng bào của họ."

 draconic_beats:0 "Nhịp Điệu Rồng"
 draconic_beats_desc:0 "Các hạm đội quân sự đã được hướng dẫn khai hỏa vào Rồng Không Gian theo một nhịp điệu cụ thể khi giao chiến với con rồng."

 dimensional_horror_weak_points:0 "Kẻ Làm Dịu Cổng Chiều Không Gian"
 dimensional_horror_weak_points_desc:0 "Cổng chiều không gian do Ác Mộng Chiều Không Gian tạo ra có thể bị làm mất ổn định nếu chúng ta tung ra các cuộc tấn công chính xác vào các khu vực yếu nhất định."
 automated_dreadnought_weak_points:0 "Kẻ Vô Hiệu Hóa Thiết Giáp Hạm"
 automated_dreadnought_weak_points_desc:0 "Các chỉ huy hạm đội giao chiến với Thiết Giáp Hạm Tự Hành đã được chỉ thị nhắm vào bất kỳ hệ thống phụ nào làm suy giảm các tiến trình tự động hóa của nó."
 asteroid_hive_weak_points:0 "Kẻ Quấy Nhiễu Tổ Ong"
 asteroid_hive_weak_points_desc:0 "Dữ liệu nhắm mục tiêu được cập nhật sẽ cho phép các hạm đội của chúng ta bắn phá các Tiểu Hành Tinh Tổ Ong tại nơi mà lớp giáp bề mặt của chúng dễ bị tổn thương nhất."
 mod_damage_vs_country_type_guardian_horror_mult:0 "Sát thương lên Ác Mộng Chiều Không Gian"
 mod_damage_vs_country_type_guardian_dreadnought_mult:0 "Sát thương lên Thiết Giáp Hạm Tự Hành"
