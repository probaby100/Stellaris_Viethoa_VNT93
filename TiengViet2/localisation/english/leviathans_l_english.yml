 SHIP_GRAPHICS_SPACE_AMOEBA_DESC: "Một dạng sống dạng gel trôi dạt, phát xung theo nhịp điệu ánh sáng chậm rãi. Chuyển động của nó cho thấy một trí tuệ kỳ lạ và có chủ đích, dù mục đích của nó vẫn là một bí ẩn."
 SHIP_GRAPHICS_SPACE_AMOEBA_MOTHER_DESC: "Lớn hơn và già cỗi hơn các đồng loại, thực thể khổng lồ này toát ra một lực hấp dẫn tĩnh lặng. Một số người tin rằng nó dẫn dắt các dạng thể thấp hơn thông qua bản năng, hoặc điều gì đó sâu xa hơn."
 SHIP_GRAPHICS_SPACE_WHALE_1_DESC: "Biến thể sinh vật hư không này lướt đi với vẻ duyên dáng mực thước, các hoa văn phát quang sinh học của nó vẽ nên những chòm sao cổ xưa khi di chuyển."
 SHIP_GRAPHICS_SPACE_WHALE_2_DESC: "To lớn và di chuyển chậm chạp, sinh vật này mang những dấu ấn của thời gian; các lớp vỏ bọc, vết sẹo và các sinh vật ký sinh bám chặt vào lớp da đồ sộ của nó."
 SHIP_GRAPHICS_SPACE_WHALE_3_DESC: "Thon gọn và ma mị, mẫu vật này du hành đơn độc qua những cơn bão ion và tinh vân. Một số người cho rằng vệt sáng phát quang của nó là một hình thức giao tiếp."
 SHIP_GRAPHICS_SPACE_WHALE_4_DESC: "Những xúc tu dài trôi dạt phía sau quái thú du hành không gian này, lấp lánh như tơ nhện dưới ánh sao. Nó dường như bị thu hút bởi các vùng năng lượng cao, vì những lý do chưa rõ."
 SHIP_GRAPHICS_SPACE_WHALE_5_DESC: "Hiếm hoi và khó nắm bắt, chủng loại này phát ra các xung tần số thấp cộng hưởng kỳ lạ với vật chất cục bộ. Nhiều người quan sát báo cáo về cảm giác kinh ngạc... hoặc sợ hãi khôn tả."
 SHIP_GRAPHICS_VOIDWORMS_SMALL_DESC: "Mềm mại và nhanh nhẹn, những thực thể này lao vun vút qua không gian như những tiếng vọng của một ngôn ngữ bị lãng quên. Hình thái của chúng dường như chỉ neo giữ một phần vào cõi vật chất."
 SHIP_GRAPHICS_VOIDWORMS_MEDIUM_DESC: "Những con sâu hư không lớn hơn uốn lượn qua vũ trụ với vẻ duyên dáng đến rợn người. Bề mặt của chúng lung linh những hoa văn thách thức mọi sự lý giải, gợi lên cả vẻ đẹp lẫn sự bất an."
 SHIP_GRAPHICS_VOIDWORMS_LARGE_DESC: "To lớn ngoài sức tưởng tượng, con sâu hư không này di chuyển với sự băng giá dứt khoát. Những người quan sát báo cáo về hiện tượng lệch lạc thời gian và những ảo ảnh thoáng qua khi ở cự ly gần."
 SHIP_GRAPHICS_CUTHOLOIDS_DESC: "Những sinh vật cổ xưa nhiều xúc tu này trôi dạt trong tĩnh lặng, quan sát bằng những con mắt vô hình. Sự hiện diện của chúng khiến các thiết bị đo đạc chập chờn và tâm trí trở nên rối bời."
 SHIP_GRAPHICS_CUTHOLOIDS_HATCHLING_DESC: "Một mẫu vật non trẻ, vẫn đang phát triển thành hình thái khôn lường của nó. Dù kích thước đồ sộ, nó tỏa ra một sự tĩnh lặng kỳ quái làm khuấy đảo tâm trí."
 SHIP_GRAPHICS_CUTHOLOIDS_JUVENILE_DESC: "Không còn là con non nhưng vẫn chưa trưởng thành, thực thể này toát ra những chuyển động và ánh sáng thất thường. Một số ý kiến cho rằng nó đang mơ màng thành tiếng, ở những tần số mà chúng ta không thể thấu hiểu."
 SHIP_GRAPHICS_VOIDWORMS_TITAN_DESC: "Khóa mình trong vũ điệu giao phối mê hoặc, những con Sâu Hư Không này di chuyển và chiến đấu như một thể thống nhất, tìm kiếm vùng sinh sản mới cho lũ con non."
 SHIP_GRAPHICS_CRYSTAL_SHIP_SMALL_BLUE_DESC: "Mảnh Tinh Thể tách ra từ Ổ Mẹ và du hành qua không gian bằng phương tiện đẩy hạn chế để tìm kiếm các thiên thể mà chúng có thể cắm sâu vào nhằm phát triển cấu trúc tinh thể. Phần lớn đều lạc lối vĩnh viễn trong cõi hư không."
 SHIP_GRAPHICS_CRYSTAL_SHIP_MEDIUM_BLUE_DESC: "Các mảnh tinh thể bắt nguồn từ những mảnh non may mắn va chạm vào các tiểu hành tinh đủ lớn khi tìm kiếm nguồn dinh dưỡng. Giờ đây đã tiến gần đến trạng thái có tri giác, những con tàu tinh thể lớn này cuối cùng sẽ lên đường tìm kiếm các tiểu hành tinh để phát triển thêm lần nữa."
 SHIP_GRAPHICS_CRYSTAL_SHIP_LARGE_BLUE_DESC: "Tinh Túy Tinh Thể đã trưởng thành hoàn toàn, bề mặt của chúng đón nhận và khúc xạ ánh sáng tạo nên màn phản chiếu rực rỡ đến lóa mắt. Dù không hẳn là sinh vật bầy đàn, người ta vẫn quan sát thấy những thực thể này dùng khối lượng của mình để dẫn dắt các mảnh tinh thể non hướng về phía các tiểu hành tinh."
