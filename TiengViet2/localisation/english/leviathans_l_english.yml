 leviathans.141.desc:1 "Các lực lượng hạm đội của chúng ta đã phá hủy tổng hành dinh [From.GetName]. Các nỗ lực thu hồi càng nhiều tài sản có giá trị càng tốt từ tàn tích vỡ vụn của trạm sao của họ đang được tiến hành khẩn trương. Chúng ta đã thu được một lượng lớn tài nguyên."

