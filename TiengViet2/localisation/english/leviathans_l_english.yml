 leviathans.125.desc.z1:1 "Chúng tôi có một chuyên viên điều hành tài năng đang túc trực, sẵn sàng di cư đến [Root.GetName] và giúp bất kỳ khu vực nào của quý vị thoát khỏi cảnh thua lỗ thâm hụt. Hãy giao phó $r_trade$ của quý vị cho một chuyên gia!"
 leviathans.125.desc.z1.gestalt:0 "Chúng tôi có một chuyên viên điều hành tài năng đang túc trực, sẵn sàng... Hừm. Quý vị có chắc không?\n\n'Khách hàng tự chịu rủi ro' thì cũng tốt thôi, nhưng tôi cảm thấy có nghĩa vụ phải thông báo rằng các cố vấn của chúng tôi thực sự chỉ chuyên về $r_trade$. Tôi không chắc họ sẽ phù hợp với quý vị, xét đến mối quan hệ... khác thường của quý vị với khái niệm đó."
 leviathans.125.z1:0 "Đồng ý."
 leviathans.125.z1.gestalt:0 "Chúng tôi hiểu, và dù sao vẫn muốn tiếp tục."
 leviathans.126.desc:0 "Tuyệt vời! Chúng tôi rất vui mừng được chia sẻ kỹ năng của mình với [Root.GetName]."
 leviathans.126.desc.alt: "Tuyệt vời! Cầu chúc cho cả hai bên chúng ta đều sinh lời từ cách tiếp cận... khác biệt về thương mại của nhau."

