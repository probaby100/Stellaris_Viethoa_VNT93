 leviathans.131.desc:3 "§YBụi Bất Ổn§! là loại gia vị quý giá của người Riggan. Nó nổi tiếng khắp thiên hà nhờ hương vị độc nhất vô nhị không giống bất kỳ thứ gì khác - và tính bộc phát nổ của nó cũng không giống bất kỳ thứ gì khác. Chúng tôi chỉ bán nó cho các đối tác thương mại quý giá nhất của mình, trong đó có [Root.GetName].\n\nNếu quý vị có thể đáp ứng mức giá phải chăng của chúng tôi, chúng tôi sẵn lòng xuất khẩu Bụi Bất Ổn cho quý vị trong khoảng thời gian mười năm chuẩn."
 leviathans.131.a.reply:1 "Quý vị sẽ không phải hối tiếc đâu. Trừ khi quý vị tiêu thụ quá nhiều gia vị... Khi đó sẽ có một nguy cơ nhỏ là quý vị sẽ tự bốc cháy ngùn ngụt. Một nguy cơ rất nhỏ thôi, chắc chắn là vậy."

 leviathans.130.desc:4 "Đây là sản phẩm mà chúng tôi tại XuraCorp đặc biệt tự hào. Bộ Phận Y Tế của chúng tôi gần đây đã bắt đầu tinh chế một loại khí có đặc tính độc đáo giúp xoa dịu đáng kể quá trình thích nghi vốn thường khó khăn với môi trường hành tinh xa lạ. Tuy nhiên, nó khó có thể tương thích với sinh lý của người ngoài hành tinh!\n\nChúng tôi sẵn lòng xuất khẩu §YKhí Ngoại Lai§! của mình cho quý vị trong thời hạn mười năm chuẩn, sau đó hợp đồng sẽ phải được đàm phán lại."
 leviathans.130.a.reply:1 "Đó chính là phong cách XuraCorp! Các tàu chở hàng của chúng tôi sẽ bắt đầu giao hàng ngay lập tức.\n\n§LBằng việc mua sản phẩm này, quý vị đồng ý rằng XuraCorp không chịu trách nhiệm đối với bất kỳ tác dụng phụ nào có thể phát sinh từ việc sử dụng nó, bao gồm nhưng không giới hạn ở: kích ứng da, các đợt loạn thần, biến đổi màu mắt, đột biến hung hãn, tỷ lệ tự sát ở người khai hoang gia tăng, trạng thái xuất thần thấu thị, cạn kiệt sinh quyển, phát sinh hạt lạ nguy hiểm, hình thành lỗ đen siêu nhỏ, nổ thang máy nâng ngũ cốc, sụp đổ xã hội, các sự kiện tuyệt chủng hàng loạt, nổ siêu tân tinh ngoài dự kiến, sự hủy diệt toàn bộ hoặc một phần của quốc gia sao của quý vị, các đợt bùng phát tia gamma bất ngờ, nghịch lý du hành thời gian, các hiện tượng giả siêu bền chân không, entropy phổ quát, sự sụp đổ của liên tục không-thời gian...§!"

 leviathans.132.desc:2 "Shi'rakkat-Du - hay §YTinh Thể Hiếm§! như cách gọi của những ai không thuộc giống loài chúng tôi - đã trở thành biểu tượng cho toàn bộ nền văn minh của chúng tôi. Khi những tinh thể \"biết hát\" này rung động, chúng phát ra một giai điệu âm nhạc độc đáo có tác dụng trấn an tâm lý đối với hầu hết các loài có tri giác.\n\nDù chúng tôi thường không chia sẻ sự kỳ diệu của Shi'rakkat-Du với người ngoài, chúng tôi sẵn lòng tạo một ngoại lệ cho trường hợp của quý vị. Nếu quý vị đủ khả năng chi trả, chúng tôi sẵn lòng xuất khẩu các tinh thể của mình cho quý vị trong thời hạn mười năm."
 leviathans.132.a.reply: "Tuyệt hảo. Các thương nhân của chúng tôi sẽ bắt đầu vận chuyển các tinh thể đến các thuộc địa của quý vị ngay lập tức. Cầu mong Shi'rakkat-Du cất tiếng hát cho quý vị."

