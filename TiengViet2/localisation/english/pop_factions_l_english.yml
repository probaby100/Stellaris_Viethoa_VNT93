 pft_purged:0 "Phe Chống Thanh Trừng"
 pft_purged_desc:1 "Phe Chống Thanh Trừng tập hợp những nhóm dân cư đang bị đế chế tiến hành thanh lọc giống loài và những người đồng cảm với thảm cảnh của họ. Đòi hỏi thiết yếu nhất của họ là có được quyền sống.\n\n§HToàn bộ người dân nằm trong diện bị thanh trừng sẽ tự động được xếp vào phe này.§!"

