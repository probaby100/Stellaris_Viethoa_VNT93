l_english:
 ####################################
 #	Pop factions
 ####################################
 # Demand TITLES are run straight from a pop faction with no
 # assembled event scope, [Owner.GetName] to get country name.
 # Tooltips, DESCS and events use the usual [Root.Owner.GetName]


 ### NEW FACTIONS

 # Descriptors
 pft_supremacist:2 "Phe Tối Thượng"
 pft_supremacist_desc:5 "Phe Tối Thượng nhằm bảo đảm vị thế thống trị tuyệt đối của giống loài lập quốc. Họ thúc đẩy những chính sách ưu tiên cho đồng loại, mặc kệ lợi ích của các giống loài khác.\n\n§LTư tưởng Bài ngoại và Quân phiệt§!"
 pft_traditionalist:0 "Phe Truyền Thống"
 pft_traditionalist_desc:2 "Phe Truyền Thống mong muốn đưa tư tưởng của đế chế quay về với những lề lối cũ trước khi vươn ra biển sao. Họ truyền bá lối sống mộ đạo khổ hạnh, khinh miệt những biến đổi xã hội do công nghệ cực đoan và các luồng tư tưởng phi tâm linh mang lại.\n\n§LTư tưởng Tâm linh§!"
 pft_progressive:0 "Phe Tiến Bộ"
 pft_progressive_desc:2 "Phe Tiến Bộ đấu tranh cho sự công bằng trong cấu trúc xã hội hiện tại. Họ phản đối các hình thức chính phủ thiếu tính đại diện, đồng thời coi trọng việc hợp tác bình đẳng với các đế chế khác.\n\n§LTư tưởng Bình đẳng§!"
 pft_imperialist:0 "Phe Đế Quốc"
 pft_imperialist_desc: "Phe Đế Quốc khao khát củng cố quyền lực nội bộ và thống trị các quốc gia khác. Họ thích gây thù chuốc oán và chinh phạt ngoại bang, đồng thời chán ghét việc phải dựa dẫm vào nước khác.\n\n§LTư tưởng Độc đoán và Quân phiệt§!"
 pft_isolationist:0 "Phe Biệt Lập"
 pft_isolationist_desc:3 "Phe Biệt Lập có xu hướng gạt bỏ mọi sự can thiệp của thiên hà vào công việc nội bộ. Họ hạn chế tối đa việc giao thiệp với các đế chế khác nhằm tránh xa những cuộc chiến tranh xâm lược (nhưng không có nghĩa là buông bỏ vũ trang).\n\n§LTư tưởng Hòa bình và Bài ngoại§!"
 pft_technologist:0 "Phe Kỹ Trị"
 pft_technologist_desc:1 "Phe Kỹ Trị chủ trương áp dụng các chính sách khuyến khích phát triển khoa học trên toàn quốc, nhằm đạt được những bước tiến công nghệ vĩ đại. Họ căm ghét việc lấy lý do chính trị để cấm đoán các hoạt động nghiên cứu, nhưng lại ủng hộ việc ký kết hiệp định khoa học. Họ thích vượt mặt các quốc gia khác về mặt công nghệ và ghét bị tụt hậu. Phe Kỹ Trị cũng rất hoan nghênh việc phổ biến và ứng dụng trí tuệ nhân tạo.\n\n§LTư tưởng Vật chất§!"
 pft_totalitarian:0 "Phe Độc Tài"
 pft_totalitarian_desc:2 "Phe Độc Tài mơ ước kiến tạo một xã hội phân giai cấp nghiêm ngặt, được cai trị bởi một cá nhân quyền lực hoặc một tập đoàn chuyên chế.\n\n§LTư tưởng Độc đoán§!"
 pft_xenoist:0 "Phe Chuộng Ngoại"
 pft_xenoist_desc:2 "Phe Chuộng Ngoại tôn sùng sinh mệnh và văn hóa ngoài hành tinh. Họ đam mê sự đa dạng dân số và thích tương tác với các giống loài khác. Họ phản đối các hành vi nô dịch và thanh trừng nhắm vào cả một chủng loài.\n\n§LTư tưởng Chuộng ngoại và Bình đẳng§!"
 pft_prosperity:0 "Phe Phồn Vinh"
 pft_prosperity_desc: "Phe Phồn Vinh mong muốn nền kinh tế quốc gia liên tục tăng trưởng và thu hoạch dồi dào tài nguyên. Họ cổ vũ giao thương tự do và không muốn nổ ra bất kỳ xung đột vũ trang nào làm ảnh hưởng đến sự phát triển trong nước.\n\n§LTư tưởng Hòa bình và Chuộng ngoại§!"
 pft_democratic_election_1:0 "Phe Dân Chủ"
 pft_democratic_election_1_desc:0 "Phe Dân Chủ trỗi dậy trong các kỳ bầu cử lãnh đạo quốc gia, sau đó phát triển lớn mạnh trong quần chúng. Họ dốc sức đưa những vị lãnh tụ được lòng dân lên nắm quyền."
 pft_democratic_election_2:0 "$pft_democratic_election_1$"
 pft_democratic_election_2_desc:0 "$pft_democratic_election_1_desc$"
 pft_democratic_election_3:0 "$pft_democratic_election_1$"
 pft_democratic_election_3_desc:0 "$pft_democratic_election_1_desc$"
 pft_democratic_election_4:0 "$pft_democratic_election_1$"
 pft_democratic_election_4_desc:0 "$pft_democratic_election_1_desc$"

 # SUPREMACISTS
 SUPREMACIST_RULER_SAME_SPECIES:0 "[Root.Owner.GetRulerTitle] là người [Root.Owner.GetSpeciesName]"
 SUPREMACIST_RULER_NOT_SAME_SPECIES:0 "[Root.Owner.GetRulerTitle] Ngoại Lai"
 SUPREMACIST_RULER_NOT_SAME_SPECIES_DESC:0 "[Root.GetName] mong muốn người cai trị phải là thành viên thuộc giống loài của mình. Bất kỳ ai không phải là người [Root.Owner.GetSpeciesName] mà dám ngồi lên ghế [Root.Owner.GetRulerTitle] đều sẽ chọc giận họ."
 SUPREMACIST_COUNCIL_SAME_SPECIES1: "Hội Đồng Thuần Chủng"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES1: "Hội Đồng Có Kẻ Ngoại Lai"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES_DESC1: "[Root.GetName] mong muốn Hội đồng của chúng ta giữ được tính thuần chủng, sự xuất hiện của bất kỳ kẻ nào không phải người [Root.Owner.GetSpeciesName] trong Hội đồng đều sẽ chọc giận họ."
 SUPREMACIST_COUNCIL_SAME_SPECIES2: "$SUPREMACIST_COUNCIL_SAME_SPECIES1$"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES2: "$SUPREMACIST_COUNCIL_NOT_SAME_SPECIES1$"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES_DESC2: "$SUPREMACIST_COUNCIL_NOT_SAME_SPECIES_DESC1$"
 SUPREMACIST_COUNCIL_SAME_SPECIES3: "$SUPREMACIST_COUNCIL_SAME_SPECIES1$"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES3: "$SUPREMACIST_COUNCIL_NOT_SAME_SPECIES1$"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES_DESC3: "$SUPREMACIST_COUNCIL_NOT_SAME_SPECIES_DESC1$"
 SUPREMACIST_COUNCIL_SAME_SPECIES4: "$SUPREMACIST_COUNCIL_SAME_SPECIES1$"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES4: "$SUPREMACIST_COUNCIL_NOT_SAME_SPECIES1$"
 SUPREMACIST_COUNCIL_NOT_SAME_SPECIES_DESC4: "$SUPREMACIST_COUNCIL_NOT_SAME_SPECIES_DESC1$"
 SUPREMACIST_COUNCIL_NOT_FULL_XENOS: "Người [Root.Owner.GetSpeciesName] Thống Trị Hội Đồng"
 SUPREMACIST_COUNCIL_FULL_XENOS: "Hội Đồng Tràn Ngập Kẻ Ngoại Lai"
 SUPREMACIST_COUNCIL_FULL_XENOS_DESC: "[Root.GetName] giận sôi máu vì số lượng những kẻ không phải người [Root.Owner.GetSpeciesNamePlural] nhan nhản trong Hội đồng."
 SUPREMACIST_UNRESTRICTED_STUDY:0 "Nghiên Cứu Ngoại Lai Quyết Liệt"
 SUPREMACIST_UNRESTRICTED_STUDY_DESC:1 "Việc thông qua luật cho phép chủ động can thiệp hoặc chèn ép người bản địa, nhằm khai thác tối đa nền văn minh ngoại lai của họ, sẽ làm hài lòng [Root.GetName]."
 SUPREMACIST_NO_UNRESTRICTED_STUDY:0 "$SUPREMACIST_UNRESTRICTED_STUDY$"
 SUPREMACIST_SLAVERY_ALLOWED:0 "Tiềm Năng Nô Lệ"
 SUPREMACIST_SLAVERY_ALLOWED_DESC:0 "[Root.GetName] không hề cho rằng có kẻ đáng giá hơn kẻ khác, họ chỉ nghĩ đơn giản là có vài kẻ phù hợp làm một số công việc hơn mà thôi. Việc tuyên bố §YChế độ nô lệ§! là bất hợp pháp sẽ xúc phạm họ."
 SUPREMACIST_SLAVERY_OUTLAWED:0 "Bãi Bỏ Nô Lệ"
 SUPREMACIST_HAS_ALIEN_SLAVES:0 "Sở Hữu Nô Lệ Ngoại Lai"
 SUPREMACIST_NO_ALIEN_SLAVES:0 "Thiếu Vắng Nô Lệ Ngoại Lai"
 SUPREMACIST_NO_FREE_ALIENS:1 "Kẻ Ngoại Lai Không Có Quyền Công Dân"
 SUPREMACIST_HAS_FREE_ALIENS:0 "$SUPREMACIST_NO_FREE_ALIENS$"
 SUPREMACIST_ALIEN_SLAVES_DESC:1 "Đảm bảo rằng các giống loài ngoài hành tinh trong đế chế không có đầy đủ quyền công dân, làm như vậy sẽ khiến [Root.GetName] hài lòng."
 SUPREMACIST_ALL_SLAVERY_ALLOWED:0 "Nô Dịch Người [Root.Owner.GetSpeciesName]"
 SUPREMACIST_ALL_SLAVERY_DESC:0 "[Root.GetName] sẽ vô cùng phẫn nộ nếu có kẻ nào dám biến người [Root.Owner.GetSpeciesName] thành công cụ sai vặt, họ chủ trương chế độ nô lệ chỉ được áp dụng cho giống loài khác."
 LEADER_IS_OWNER_SPECIES:0 "[Root.Owner.GetRulerTitle] là người [Root.Owner.GetSpeciesName]"
 SUPREMACIST_NO_MIGRATION_TREATIES:0 "Cấm Di Cư"
 SUPREMACIST_MIGRATION_TREATIES:0 "$SUPREMACIST_NO_MIGRATION_TREATIES$"
 SUPREMACIST_NO_MIGRATION_TREATIES_DESC:0 "Ký kết bất kỳ §YHiệp định Di cư§! nào cũng sẽ chọc giận [Root.GetName]."
 SUPREMACIST_CORE_WORLD_EXCLUSIVITY:0 "Độc Chiếm Thế Giới Cốt Lõi"
 SUPREMACIST_CORE_WORLD_EXCLUSIVITY_DESC:0 "Dành riêng các thế giới cốt lõi của đế chế cho người [Root.Owner.GetSpeciesNamePlural] và nô lệ của họ độc quyền sử dụng, hành động này sẽ làm hài lòng [Root.GetName]."
 SUPREMACIST_CORE_WORLD_NONEXCLUSIVITY:0 "$SUPREMACIST_CORE_WORLD_EXCLUSIVITY$"
 SUPREMACIST_DOMINATION:0 "Chủ Trương Áp Đảo"
 SUPREMACIST_DOMINATION_DESC:0 "Tuyên chiến với một đế chế ngoại lai sẽ tạm thời làm hài lòng [Root.GetName]."
 SUPREMACIST_NO_DOMINATION:0 "$SUPREMACIST_DOMINATION$"
 SUPREMACIST_GENE_MOD:0 "Gen Thuần Chủng"
 SUPREMACIST_GENE_MOD_DESC:2 "Đảm bảo tất cả cư dân người [Root.Owner.GetSpeciesNamePlural] đều sở hữu những đặc điểm di truyền giống hệt nhau, việc này sẽ làm hài lòng [Root.GetName]."
 SUPREMACIST_IMPURE:0 "Người [Root.Owner.GetSpeciesAdj] Không Thuần Chủng"
 SUPREMACIST_NO_HARMONY:0 "Khước Từ Hòa Hợp"
 SUPREMACIST_HARMONY:0 "$SUPREMACIST_NO_HARMONY$"
 SUPREMACIST_NO_HARMONY_DESC:0 "Việc áp dụng truyền thống Hòa Hợp, ngụ ý rằng các giống loài hạ đẳng cũng đáng được hưởng quyền bình đẳng, sẽ chọc giận [Root.GetName]."
 SUPREMACIST_FANATIC_PURIFIERS:1 "$civic_fanatic_purifiers$"
 SUPREMACIST_NOT_FANATIC_PURIFIERS:1 "$civic_fanatic_purifiers$"
 SUPREMACIST_FANATIC_PURIFIERS_DESC:1 "$civic_fanatic_purifiers_desc$"
 SUPREMACIST_DOMINATION_TRADITION:0 "Truyền Thống Áp Đảo"
 SUPREMACIST_NO_DOMINATION_TRADITION:1 "$SUPREMACIST_DOMINATION_TRADITION$"
 SUPREMACIST_DOMINATION_TRADITION_DESC:0 "Thông qua bất kỳ truyền thống nào đề cao sự §YÁp Đảo§! đều sẽ làm hài lòng [Root.GetName]."
 SUPREMACIST_GIANT_MASSACRE:0 "Đồ Tể Cự Thú"
 SUPREMACIST_NO_GIANT_MASSACRE:0 "$SUPREMACIST_GIANT_MASSACRE$"
 SUPREMACIST_GIANT_MASSACRE_DESC:0 "Tiêu diệt bất kỳ giống loài §YCự Thú Không Gian§! khổng lồ nào sẽ tạm thời làm hài lòng [Root.GetName]."
 SUPREMACIST_ISOLATIONIST_NO_FEDERATION:0 "Cường Quốc Biệt Lập"
 SUPREMACIST_ISOLATIONIST_NO_FEDERATION_DESC:1 "Để [Root.Owner.GetName] §Ygia nhập Liên Bang§!, mở đường cho lũ ngoài hành tinh trục lợi, sẽ khiến [Root.GetName] vô cùng khó chịu."
 SUPREMACIST_ISOLATIONIST_FEDERATION:1 "$SUPREMACIST_ISOLATIONIST_NO_FEDERATION$"
 SUPREMACIST_PROCLAIM_SUPREMACY:0 "Khinh Miệt Lịch Sử"
 SUPREMACIST_NO_PROCLAIM_SUPREMACY:0 "$SUPREMACIST_PROCLAIM_SUPREMACY$"
 SUPREMACIST_PROCLAIM_SUPREMACY_DESC:0 "Phá hủy cổ vật quý hiếm của các nền văn minh xưa cũ để thể hiện sự khinh miệt đối với chúng sẽ làm [Root.GetName] hài lòng trong một thời gian."
 SUPREMACIST_CELEBRATE_DIVERSITY:0 "Trưng Bày Đồ Hạ Đẳng"
 SUPREMACIST_NO_CELEBRATE_DIVERSITY:0 "$SUPREMACIST_CELEBRATE_DIVERSITY$"
 SUPREMACIST_CELEBRATE_DIVERSITY_DESC:0 "Trưng bày cổ vật của những nền văn minh hạ đẳng sẽ khiến [Root.GetName] khó chịu trong một thời gian."
 SUPREMACIST_AGGRESSIVE_FIRST_CONTACT_POLICY:0 "Giao Thức Chạm Trán Quyết Liệt"
 SUPREMACIST_NO_AGGRESSIVE_FIRST_CONTACT_POLICY:0 "$SUPREMACIST_AGGRESSIVE_FIRST_CONTACT_POLICY$"
 SUPREMACIST_NO_AGGRESSIVE_FIRST_CONTACT_POLICY_DESC:0 "[Root.GetName] đòi hỏi chúng ta phải có quyền áp dụng mọi biện pháp có thể để đối phó với những mối đe dọa vô hình ngoài biển sao."
 SUPREMACIST_OPPRESSIVE_SUBJUGATION_POLICY:0 "Chính Sách Chư Hầu Áp Bức"
 SUPREMACIST_NO_OPPRESSIVE_SUBJUGATION_POLICY:0 "$SUPREMACIST_OPPRESSIVE_SUBJUGATION_POLICY$"
 SUPREMACIST_NO_OPPRESSIVE_SUBJUGATION_POLICY_DESC:0 "Các nước chư hầu sinh ra là để hầu hạ chúng ta, bọn chúng phải khắc cốt ghi tâm điều đó. Tỏ ra khoan dung với chúng sẽ chỉ khiến [Root.GetName] thêm chán nản."
 SUPREMACIST_UNPLUGGED_CYBERIZE: "Chấp Nhận Nhân Dạng Cơ Khí Của Ta"
 SUPREMACIST_UNPLUGGED_NOT_CYBERIZE: "$SUPREMACIST_UNPLUGGED_DECYBERIZE$"
 SUPREMACIST_UNPLUGGED_CYBERIZE_DESC: "Hoàn thiện và nâng cấp các bộ phận cấy ghép cơ khí do trí tuệ máy móc ban tặng sẽ giúp phục hưng di sản đáng gờm của ta, đồng thời cũng làm hài lòng [root.GetName]."

 # XENOISTS
 XENOIST_PASSIVE_STUDY:0 "Nghiên Cứu Ngoại Lai Gián Tiếp"
 XENOIST_PASSIVE_STUDY_DESC:1 "Ban hành các đạo luật can thiệp một cách tế nhị hoặc không can thiệp vào [root.owner.GetPreFTLLower] sẽ làm hài lòng [Root.GetName]."
 XENOIST_NO_PASSIVE_STUDY:0 "$XENOIST_PASSIVE_STUDY$"
 XENOIST_NO_SLAVES:1 "Không Nô Dịch Chủng Loài"
 XENOIST_NO_SLAVES_DESC:3 "Việc không ban hành đạo luật cấm bắt cả một giống loài làm nô lệ sẽ khiến [Root.GetName] cực kỳ tức giận."
 XENOIST_SLAVES:0 "$XENOIST_NO_SLAVES$"
 XENOIST_NO_PURGE: "Không Chiến Dịch Thanh Trừng"
 XENOIST_NO_PURGE_DESC: "Việc không ban hành đạo luật cấm thanh trừng cả một giống loài sẽ khiến [Root.GetName] cực kỳ tức giận."
 XENOIST_PURGE: "$XENOIST_NO_PURGE$"
 XENOIST_NO_NOMAD_PURGE: "Tha Cho Dân Du Mục Bị Thương Tật"
 XENOIST_NO_NOMAD_PURGE_DESC: "Thảm sát thuyền viên trên các Tàu Ark bị vô hiệu hóa là hành vi man rợ mà [Root.GetName] tuyệt đối không dung thứ."
 XENOIST_NOMAD_PURGE: "$XENOIST_NO_NOMAD_PURGE$"
 XENOIST_NO_NOMAD_CONSCRIPTION: "Giải Phóng Dân Du Mục Bị Thương Tật"
 XENOIST_NO_NOMAD_CONSCRIPTION_DESC: "Bắt ép cư dân trên các Tàu Ark hư hại phải phục vụ cho chúng ta sẽ khiến [Root.GetName] bất bình."
 XENOIST_NOMAD_CONSCRIPTION: "$XENOIST_NO_NOMAD_CONSCRIPTION$"
 ISOLATIONIST_NO_NOMAD_ATROCITIES: "Nghiêm Cấm Hành Vi Tàn Bạo Với Dân Du Mục"
 ISOLATIONIST_NO_NOMAD_ATROCITIES_DESC: "Tàn sát thuyền viên trên Tàu Ark bị vô hiệu hóa chẳng đem lại ý nghĩa phòng thủ nào, đã thế còn chọc giận [Root.GetName]."
 ISOLATIONIST_NOMAD_ATROCITIES: "$ISOLATIONIST_NO_NOMAD_ATROCITIES$"
 PROGRESSIVE_NO_NOMAD_FORCED_LABOR: "Cấm Cưỡng Bức Lao Động Dân Du Mục"
 PROGRESSIVE_NO_NOMAD_FORCED_LABOR_DESC: "Cưỡng bách hay xử tử các thuyền viên trên Tàu Ark mất khả năng hoạt động là hành vi phản bội lại tự do mà [Root.GetName] hằng trân quý."
 PROGRESSIVE_NOMAD_FORCED_LABOR: "$PROGRESSIVE_NO_NOMAD_FORCED_LABOR$"
 SUPREMACIST_CULL_THE_DRIFTERS: "Thanh Trừng Kẻ Trôi Dạt"
 SUPREMACIST_CULL_THE_DRIFTERS_DESC: "Xử tử các thuyền viên trên Tàu Ark bị vô hiệu hóa sẽ làm đẹp lòng [Root.GetName], những kẻ coi mọi giống loài ngoại lai là mối đe dọa."
 SUPREMACIST_NO_CULL_THE_DRIFTERS: "$SUPREMACIST_CULL_THE_DRIFTERS$"
 XENOIST_ENCLAVE_BORDERS:0 "Hợp Tác Thành Bang"
 XENOIST_ENCLAVE_BORDERS_DESC:0 "Đảm bảo có các thành bang không gian bên trong lãnh thổ của ta để thúc đẩy giao lưu văn hóa. Điều này có thể làm hài lòng [Root.GetName]."
 XENOIST_NO_ENCLAVE_BORDERS:1 "$XENOIST_ENCLAVE_BORDERS$"
 XENOIST_ENCLAVE_BORDERS_NOMAD: "$XENOIST_ENCLAVE_BORDERS$"
 XENOIST_ENCLAVE_BORDERS_NOMAD_DESC: "Đảm bảo có các thành bang không gian ở gần trạm tiếp vận của chúng ta để thúc đẩy giao lưu văn hóa. Điều này sẽ làm đẹp lòng [Root.GetName]."
 XENOIST_MULTICULTURALISM:0 "Xã Hội Đa Nguyên Văn Hóa"
 XENOIST_MULTICULTURALISM_DESC:0 "Dung nạp ít nhất §Y4§! giống loài khác nhau sống trong đế chế sẽ làm hài lòng [Root.GetName]."
 XENOIST_NO_MULTICULTURALISM:0 "$XENOIST_MULTICULTURALISM$"
 XENOIST_REFUGEES_WELCOME:0 "Đón Chào Mọi Tị Nạn"
 XENOIST_REFUGEES_WELCOME_DESC:0 "Chính sách mở rộng vòng tay đón nhận vô điều kiện các nhóm tị nạn ngoại lai chạy trốn chiến tranh và nạn thanh trừng sẽ làm [Root.GetName] ấm lòng."
