 ### SLAVES

 slave_attraction_title:0 "§R---§!"
 docile_slaves_attraction_desc:0 "Nhóm dân số bị bắt làm nô lệ thường gia nhập một phe nô lệ nào đó, ngoại trừ lũ người máy vô tri. Các nhóm dân cư khác sẽ không tham gia phe này.\n\n§HChỉ số này thể hiện mức độ hấp dẫn của việc trở thành nô lệ thuần tòng đối với nhóm dân số bị nô dịch.§!"

 malcontent_slaves_attraction_desc:0 "Nhóm dân số bị bắt làm nô lệ thường gia nhập một phe nô lệ nào đó, ngoại trừ lũ người máy vô tri. Các nhóm dân cư khác sẽ không tham gia phe này.\n\n§HChỉ số này thể hiện mức độ hấp dẫn của việc trở thành nô lệ phản loạn đối với nhóm dân số bị nô dịch.§!"

 purged_attraction_title:1 "§R---§!"
 purged_attraction_desc:1 "Ngoại trừ người máy, nhóm dân số bị đem đi thanh trừng sẽ luôn ngả về phe Chống Thanh Trừng.\n\nCác nhóm dân cư khác sẽ không tham gia."

 # Slave Demands
 pft_slave:1 "Phe Nô Lệ"
 pft_slave_desc:1 "Phe Nô Lệ bao gồm những tầng lớp dân cư bị bắt làm nô lệ trong đế chế. Mong muốn lớn nhất của họ là được giải phóng.\n\n§HToàn bộ dân số là nô lệ sẽ tự động gia nhập phe này.§!"

 pft_docile_slaves:0 "Phe Nô Lệ Thuần Tòng"
 pft_docile_slaves_desc:0 "Một phần hoặc thậm chí toàn bộ dân số bị nô dịch trong đế chế của chúng ta thuộc về phe Nô Lệ Thuần Tòng. Bọn họ không muốn chuốc lấy rắc rối, chỉ hy vọng được cải thiện điều kiện làm việc.\n\n§HTất cả nô lệ đều thuộc phe Nô Lệ Thuần Tòng hoặc phe Nô Lệ Bất Mãn.§!"

 pft_malcontent_slaves:0 "Phe Nô Lệ Bất Mãn"
 pft_malcontent_slaves_desc:0 "Một phần hoặc thậm chí toàn bộ dân số bị nô dịch trong đế chế của chúng ta thuộc về phe Nô Lệ Phản Loạn. Bọn họ không cam chịu thân phận hầu hạ, luôn sục sôi ý chí tìm kiếm cuộc sống tự do.\n\n§HTất cả nô lệ đều thuộc phe Nô Lệ Thuần Tòng hoặc phe Nô Lệ Bất Mãn.§!"

 pft_emancipation:0 "$POP_FACTION_SLAVE_DEMAND_TITLE_1$"
 pft_emancipation_desc:1 "Phe này khao khát xóa bỏ chế độ nô lệ."

 POP_FACTION_DOCILE_SLAVES_DEMAND_TITLE_1:0 "Chế Độ Nô Lệ Có Kiểm Soát"
 POP_FACTION_DOCILE_SLAVES_DEMAND_DESC_1:0 "Các thành viên của phe này hy vọng được cải thiện đôi chút môi trường sống dựa trên chính sách §HChế Độ Nô Lệ Có Kiểm Soát§!."

