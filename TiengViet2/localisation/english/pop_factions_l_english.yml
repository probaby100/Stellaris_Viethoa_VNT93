 factions.3000.name:0 "Điểm Nóng Chính Trị"
 factions.3000.desc:0 "Cả những phe phái lâu đời lẫn các phong trào mới nổi đều dành sự quan tâm đặc biệt cuồng nhiệt cho thuộc địa mới của chúng ta trên §Y[root.GetName]§!. Ngay từ lúc ta công bố lệnh định cư trên [root.GetPlanetHabitat] màu mỡ này, hầu như mọi thế lực chính trị trong [root.owner.GetName] đều đua nhau đưa ra bình luận.\n\nCác chuyên gia phân tích của ta nhận định rằng [root.GetName] chưa có biến cố lớn nào manh nha, nhưng vẫn khuyến cáo cần phải dè chừng. Rõ ràng, các thực thể chính trị của chúng ta đang nhăm nhe mượn cái thế giới non trẻ này làm bàn đạp để tuyên truyền rầm rộ."
 factions.3000.a.demo:1 "Nên hoan nghênh sự thảo luận sôi nổi này!"
 factions.3000.a.auth:0 "Theo dõi sát sao bọn hoạt động này."
 factions.3000.b:0 "Quá rủi ro; hãy tăng cường an ninh."
 factions.3000.b.auth:0 "Chúng ta không thể dung thứ cho tình trạng này."
 planet_political_frontier:0 "Điểm Nóng Chính Trị"
 planet_political_frontier_desc:0 "Thuộc địa này được nhiều phe phái chính trị coi là mảnh đất màu mỡ để tiến hành các chiến dịch."
 planet_political_safezone:0 "Ổn Định Chính Trị"
 planet_political_safezone_desc:0 "Đang can ngăn các phe phái chính trị mở chiến dịch tại thuộc địa này."
 planet_political_crackdown:0 "Đàn Áp Chính Trị"
 planet_political_crackdown_desc:0 "Kiên quyết cấm đoán các phe phái chính trị hoạt động trên thuộc địa này."

 factions.3005.name:0 "Báo cáo: Luận Bàn Chính Trị Về [root.GetName]"
 factions.3005.desc.1:0 "Theo đúng chỉ thị, nguồn tin của ta tại [root.GetName] vẫn liên tục cập nhật tình hình chính trị mới nhất của thuộc địa. Tóm lại: Triển vọng đang rất khả quan.\n\nLực lượng hành pháp địa phương và các đại diện chính trị đã khéo léo dùng lượng tài nguyên ít ỏi nhất để kiểm soát những luồng ý kiến trái chiều công khai ở mức tối thiểu. Đặc biệt là những bè lũ lưu manh, chúng chẳng chọc ngoáy được bất kỳ lợi lộc nào từ cư dân thuộc địa. Kết quả là ta vẫn đang siết chặt quyền kiểm soát hệ sinh thái chính trị tại đây."
 factions.3005.a:0 "Những người yêu nước này đáng được biểu dương."
 factions.3005.desc.2:0 "Những dữ liệu chính trị ta thu thập được từ [root.GetName] đã chứng minh nhiều mối lo ngại của chúng ta là có cơ sở. Những phong trào cực đoan bên lề đã thực sự câu kéo được sự ủng hộ từ dân chúng thuộc địa. Mấy công dân này bị lung lạc bởi những bài thuyết giáo về công bằng và tính lưu động xã hội, đâm ra quay lưng với vài nguyên tắc cốt lõi của xã hội chúng ta.\n\nDẫu bức tranh có chút mảng tối, nhưng trong cái rủi vẫn có cái may. Ta đã tích lũy được một kho tàng dữ liệu nghiên cứu đồ sộ, là báu vật vô giá để mài giũa học thuyết chính trị thuộc địa của người [owner.GetAdj]. Hơn nữa, ta đã dụ được mấy thế lực ngầm này tự chui đầu ra ánh sáng trước khi chúng kịp bén rễ tại thủ đô."
 factions.3005.b:0 "Biết đâu đấy... lối suy nghĩ này cũng có vài điểm đáng học hỏi?"
 planet_political_admittance:0 "Chính Trị Cởi Mở"
 planet_political_admittance_desc:0 "Thuộc địa này cho phép những hình thức thảo luận chính trị táo bạo hơn, đổi lấy khả năng giám sát chặt chẽ và sự hiểu biết sâu sắc hơn về xã hội học."
 factions.3005.desc.3:0 "Những thông tin thu thập được về các phong trào chính trị tại [root.GetName] đã mang lại cho ta vài góc nhìn khá thú vị. Ta nhận thấy sự cởi mở với những tư tưởng mới ở nơi này đang tăng lên (vượt khỏi ranh giới của những tư tưởng chính trị ổn định mà ta từng xác định), nhưng vẫn chưa có hành động nào bị coi là phản nghịch.\n\nMặc dù bất kỳ sự chệch hướng nào khỏi tư tưởng cốt lõi đều bị xem là làm xói mòn nền tảng quyền lực, nhưng đây vẫn được xem là một tín hiệu mừng. Lần thử nghiệm này chẳng khác nào một mẫu nghiên cứu thực tế, cực kỳ hữu ích để ta hoàn thiện các lý thuyết chính trị thuộc địa. Hơn thế nữa, ta đã chứng minh được rằng, dù có cho các thế lực rìa một chút đất diễn chính trị, người [owner.GetAdj] vẫn sẽ đứng ra bác bỏ những tư tưởng cực đoan nhất của chúng, và từ đó càng thêm gắn bó với các giá trị của quốc gia."
 factions.3005.c:0 "Vậy thì có khi hành động này lại đáng được khuyến khích."

 factions.3010.desc.1:0 "Các nhà chính trị học của ta vẫn luôn theo dõi [root.GetName] bằng con mắt đầy hứng thú. Tuy nhiên, bất chấp những đợt vận động tranh cử nảy lửa gần đây cộng thêm màn thêu dệt rùm beng của truyền thông, họ vẫn dự đoán cục diện chính trị tại thuộc địa này sẽ đi theo một kết quả khá rập khuôn.\n\nNhóm nghiên cứu lưu ý rằng, ở đây \"không có tin tức gì\" chính là tin tốt: Mặc dù đám phần tử cực đoan trong xã hội đã hùng hồn lên tiếng, nhưng hiện tại chả có lấy một dấu hiệu nào cho thấy [root.GetName] đang bị nhào nặn thành một lò ấp ủ độc tài. Dân chủ vẫn đang là cái móng nhà vững chãi ở nơi đây."
 factions.3010.a:0 "Có lẽ chúng ta nên nhúng tay vào."
 factions.3010.desc.2:0 "Dường như một vài tổ chức chính trị theo khuynh hướng độc quyền trong xã hội của chúng ta đang đâm chồi nảy lộc trên [root.GetName]. Rất nhiều chiến dịch hành lang của bọn chúng đang chĩa mũi nhọn vào thuộc địa đang phất lên này; ngoài ra, dẫu cho sự thành công rành rành của chúng vẫn chưa khiến nhiều người phải giật mình: các chính trị gia của ta lại cho rằng cần phải nhìn nhận chuyện này bằng một con mắt dè chừng. Đối với người [root.owner.GetAdj] trên [root.GetName], dân chủ không hề quan trọng hay hấp dẫn đến mức như ta tưởng lúc ban đầu."
 factions.3010.b:0 "Đây quả là một bài kiểm tra vô giá đối với nghệ thuật trị quốc của chúng ta!"
 factions.3010.c:0 "Ta phải bảo vệ nền dân chủ khỏi những mối hiểm họa kiểu này."
 factions.3010.desc.3:0 "Sau một thời gian theo dõi [root.GetName], các chuyên gia chính trị của ta đã công bố báo cáo xác nhận rằng nơi này đang tồn tại vô vàn chủ trương chính trị khác nhau.\n\nHiện thời chưa có dấu hiệu nào cho thấy [root.GetName] sẽ rơi vào tình cảnh vô chính phủ, hay nảy sinh những cung cách cai trị cực đoan tương tự. Song, cái sự thờ ơ chính trị kiểu này quả thực đang giáng xuống đầu nền dân chủ của người [root.owner.GetAdj] những thách thức rất dị — đi kèm với đó là những rủi ro tiềm tàng, một khi các phe phái cực đoan hơn cắm được rễ ở đây."
 factions.3010.frontier.tt:0 "Điều chỉnh §Y$planet_political_frontier$§! sẽ duy trì trong khoảng §Y9§! năm, tăng $MOD_POP_ETHICS_SHIFT_SPEED$ thêm §G+50%§!."
 factions.3010.d:0 "Nghe có vẻ hơi liều lĩnh quá."

 ### Loyalists
 faction.4.title:0 "Yêu Sách Của Phe Trung Thành"
 faction.4.desc:0 "Phe Trung Thành thề một lòng tận trung với [Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName] của [Root.Owner.GetName], không có bất kỳ đòi hỏi nào khác."

 ### Slaves
 faction.6.title:0 "Tuyệt Thực Biểu Tình!"
 faction.6.desc:0 "Lũ nô lệ của [Root.Owner.GetName] đang tiến hành một cuộc tuyệt thực tập thể, tự đày đọa bản thân nhằm phá hoại dây chuyền sản xuất của ta. Các thành viên của phe [Root.GetName] đang tự mình tiến hành một cuộc §YThanh Trừng§! ngay trên chính đồng bào của chúng bên trong [Root.Owner.GetName].\n\nNếu cứ phớt lờ chuyện này thêm một thời gian nữa, ta rất dễ mất trắng một lượng lớn dân số nô lệ. Ta có thể ngồi khoanh tay nhìn bọn khốn khổ đó tự diệt vong, hoặc dùng chút thủ đoạn để trị tận gốc cái đám phe phái cứng đầu cứng cổ này."

 faction.7.title:0 "Nô Lệ Khởi Nghĩa!"
 faction.7.desc:0 "Nô lệ trên [slave_planet.GetName] vừa châm ngòi một cuộc khởi nghĩa chống lại các chủ nô, chúng đã lập nên một đội quân phản kháng hòng đập tan ách thống trị hợp pháp của [Root.Owner.GetName] lên đầu chúng!"

 faction.8.title:0 "Ép Ăn"
 faction.8.desc:0 "Cơ thể của lũ nô lệ làm gì thuộc về chúng, chúng làm gì có tư cách làm sứt mẻ hay giam hãm thân xác ấy.\n\nTa đã chấm dứt màn tự thanh trừng này, và tọng đủ dưỡng chất cần thiết vào mồm những kẻ còn thoi thóp."

 faction.10.title:0 "Nô Lệ Bất Mãn!"
 faction.10.desc:0 "Cuộc biểu tình quy mô lớn của đám nô lệ trên hành tinh [unrest_planet.GetName] đã giáng đòn nặng nề vào năng suất của hành tinh này."
 faction.10.desc.colle:0 "Một bầu không khí oán thán đang lan rộng trong hàng ngũ nô lệ của [Root.Owner.GetName], mà trung tâm điểm bùng phát chính là [unrest_planet.GetPlanetMoon] của [unrest_planet.GetName]."
 faction.10.a.tooltip:0 "§HDân số nô lệ§! trên §H[unrest_planet.GetName]§! nhận điều chỉnh §RNô Lệ Náo Loạn§!, kéo dài trong §Y4 năm§!."

 faction.15.title:0 "Nô Lệ Bạo Động!"
 faction.15.desc:0 "Một băng nhóm bạo động — toàn những tên nô lệ bỏ trốn — đã va chạm nảy lửa với các thường dân khác trên [roving_gangs_planet.GetName], cướp đi sinh mạng của 100 người.\n\nThái độ của gia quyến các nạn nhân sau thảm kịch này vẫn còn là một ẩn số."
 faction.15.a.tooltip:0 "[roving_gangs_planet]:\n§R100§! £pop£§HDân số§! tử vong."

 faction.50.title:0 "Đường Dây Vượt Biên Liên Sao!"
 faction.50.desc:0 "Rõ ràng là trong đám nô lệ đã có một vài tổ chức cực đoan âm thầm bắt tay với nhau. Đích đến của bọn chúng là tuồn nô lệ trốn khỏi lãnh thổ của người [Root.Owner.GetAdj].\n\nMặc dù ta vẫn chưa nắm rõ được cái đường dây phạm pháp quy mô này hoạt động kiểu gì, nhưng có một sự thật phơi bày là đám nô lệ đã lọt ra ngoài sự kìm kẹp của thế lực [Root.Owner.GetAdj]."
 faction.50.desc.colle:0 "Có vẻ như một nhóm thiểu số lầm đường lạc lối đang hăng hái giở trò giải thoát nô lệ khỏi số mệnh của chính họ rồi lén tuồn ra khỏi biên giới của người [Root.Owner.GetAdj], hòng bôi tro trát trấu vào mặt [Root.Owner.GetName].\n\nTuy mấy cái tổn thất cò con này với ta chả bõ bèn gì, nhưng ta vẫn hy vọng bọn cừu non lầm đường kia sẽ có ngày tỉnh ngộ, quay về vòng tay độ lượng của [Root.Owner.GetName] để gánh vác cái số phận đã được an bài của chúng."
 faction.50.a:0 "Thật không may."
 faction.50.1.tooltip:0 "[Root.Owner.GetName]:\nDân số nô lệ: §R-1§!"
 faction.50.3.tooltip:0 "[Root.Owner.GetName]:\nDân số nô lệ: §R-3§!"
 faction.50.4.tooltip:0 "[Root.Owner.GetName]:\nDân số nô lệ: §R-4§!"
 faction.50.5.tooltip:0 "[Root.Owner.GetName]:\nDân số nô lệ: §R-5§!"

 faction.55.title:0 "Nô Lệ Bất Mãn Bạo Loạn!"
 faction.55.desc.colle:0 "Vài kẻ trong phe [Root.GetName] đang cuồng cuộn phá hoại nền móng thái bình của [Root.Owner.GetName]. Bọn chúng hòng đạt được dã tâm đó bằng việc đập phá các cơ sở sản xuất trên [riots_planet.GetName]. Ta chỉ có thể đoán già đoán non rằng, mặc cho bọn chúng có quậy phá đến đâu, thì thứ hành động ngu xuẩn ngáng đường sự cai trị hợp pháp của người [Root.Owner.GetAdj] này sớm muộn cũng khiến chúng tự đào mồ chôn mình mà thôi."
 faction.55.desc:0 "Đám nô lệ bạo động đã phá hủy một công trình trên [riots_planet.GetName] — nếu muốn dây chuyền hoạt động lại thì phải xắn tay vào sửa chữa ngay."

 faction.60.title:0 "Nô Lệ Bất Mãn Nổi Loạn!"
 faction.60.desc:0 "Bọn cực đoan trong giới nô lệ — chuyện mà ta đã đoán trước từ lâu — vừa công khai phất cờ nổi dậy vũ trang hòng chống lại ách thống trị hợp pháp của chúng ta.\n\nBáo cáo cho hay, phát súng khởi nghĩa đầu tiên đã nổ trên [revolt_planet.GetName], và rất có thể sẽ châm ngòi cho một cơn bão táp lan rộng."
 faction.60.desc.colle:0 "Sự phồn vinh của [Root.Owner.GetName] được đánh đổi bằng việc có một bộ phận dân chúng phải gánh vác những công việc hèn mọn. Và sự hằn học của lũ này vừa biến thành một tai ương thực sự.\n\nĐầu óc chúng bị lợi ích cá nhân che mờ, mù quáng trước bức tranh đại cục, nên mới to gan châm ngòi nổi loạn trên [revolt_planet.GetPlanetMoon] của [revolt_planet.GetName] — và có vẻ như các hành tinh khác cũng đang ngứa ngáy muốn hùa theo trò ngu xuẩn đó."
 faction.60.a:0 "Quả là một thảm họa."
 faction.60.b:0 "Lũ ngốc nghếch thiếu hiểu biết..."
 faction.60.a.tooltip:0 "Phe §HNô Lệ Bất Mãn§! đã phát động §YNổi Loạn§!!"

 faction.80.title:0 "Nô Lệ Bị Kích Động!"
 faction.80.desc:0 "Giáo dân của một nhà nguyện địa phương trên [Root.GetName] đã thành công trong việc tiêm nhiễm tư tưởng cho một vài tên nô lệ người [Root.Owner.GetAdj], thế lực của phe Nô Lệ Bất Mãn lại được tiếp thêm sức mạnh."

 ### Separatists
 # From = pop faction
 # Parameters = planet

 pft_planet_separatists:0 "Phe Ly Khai Hành Tinh"
 pft_planet_separatists_desc:0 "Những kẻ ly khai hành tinh có thể xuất hiện trên các hành tinh thuộc địa, rắp tâm tách toàn bộ hành tinh khỏi ách thống trị của đế chế. Nếu lôi kéo được lòng dân, chúng thừa sức khơi mào một cuộc cách mạng vũ trang.\n\n§HPhe ly khai hành tinh chỉ mọc rễ trên các hành tinh do đế chế trực tiếp quản lý.§!"

 # Separatists rebel
 faction.100.title:0 "Phe Ly Khai Khởi Binh Nổi Dậy!"
 faction.100.desc:3 "Căng thẳng trên [planet.GetName] đã như thùng thuốc súng chực nổ. Lực lượng ly khai hành tinh tại đây đang rắp tâm phát động một cuộc khởi nghĩa vũ trang hòng chiếm lấy quyền kiểm soát hành tinh."

 # Separatists riot
 faction.101.title:1 "Phe Ly Khai Kích Động Bạo Loạn!"
 faction.101.desc:1 "Tình hình nội loạn tại §Y[planet.GetName]§! đã bị đẩy lên đỉnh điểm, một nhóm thành viên của §Y[Root.GetName]§! đã tràn ra đường đập phá cướp bóc.\n\nBáo cáo cho thấy, nhiều cơ sở trọng yếu của thuộc địa đã bị hủy hoại."

 # Separatist leader assassinated
 faction.102.title:1 "Lãnh Đạo Phe Phái Bị Ám Sát!"
 faction.102.desc:1 "Cái chết đột ngột của [Root.Leader.GetName] đã đẩy [Root.GetName] vào cảnh rắn mất đầu hỗn loạn.\n\nTrong mắt dân chúng người [Root.Owner.GetSpeciesAdj], đây rành rành là kết quả của màn đấu đá nội bộ phe [Root.GetName]. Mặc dù một tân thủ lĩnh đã bắt đầu thâu tóm quyền lực, vụ việc này vẫn khiến uy tín của chúng trong mắt quần chúng sụt giảm nghiêm trọng."

 # Separatist sector created
 faction.103.title:0 "Thành Lập Tinh Vực Mới!"
 faction.103.desc:0 "[Root.GetName] đã dựng lên một chính quyền trung tâm tinh vực tại [parameter:planet.GetName], và được công nhận là một tinh vực bán tự trị."

 faction.104.title:0 "Ly Khai Khỏi Đế Chế!"
 faction.104.desc:0 "Để dẹp yên các phong trào chia rẽ và loại bỏ hoàn toàn bè lũ ly khai, ta đã ân chuẩn cho thuộc địa trên [parameter:planet.GetName] được phép tách khỏi quyền thống trị của [Root.Owner.GetName].\n\nNgay sau đó, [Root.GetName] đã tự lập nên một quốc gia độc lập."

 ### Crusaders

 # Crusaders want to a crusade to against the heathens, conquer their capital
 faction.200.title:0 "[Root.GetName] Vung Gươm Trừng Phạt Kẻ Ngoại Đạo [parameter:heathens.GetName]!"
 faction.200.desc:1 "Chúng đã nhắm thủ đô của thế lực ngoại bang làm mục tiêu, rắp tâm đánh chiếm cho bằng được."

 holy_war_title:0 "Thánh Chiến"
 holy_war_desc:0 "Dẫn dắt Thập tự quân thời đại vũ trụ đánh dẹp bọn [parameter:heathens.GetName]."
 holy_war_1_poi:0 "Hệ Sao Thủ Đô"
 holy_war_1_poi_desc:0 "Hành tinh của bọn tà giáo."
 profane_planets_seized:0 "Sự ô uế trên hành tinh của lũ tà đạo đã bị tẩy rửa!"

 # Capital conquered
 faction.201.title:0 "Thủ Đô Kẻ Ngoại Đạo Thất Thủ!"
 faction.201.desc:0 "Thần điện của chúng đã bị uế tạp, và thánh thần đã quay lưng lại với chúng."

 faction.202.title:0 "[parameter:heathens.GetName] Bị Sỉ Nhục"
 faction.202.desc:1 "Vì một lỗ hổng an ninh hết sức tủi hổ, [Root.GetName] đã chiếm được quyền thao túng kênh liên lạc ngoại giao cơ bản của chúng ta. Chúng mượn cớ bảo vệ đức tin, hắt hủi và bêu rếu [parameter:heathens.GetName] vì vô số dị giáo cũng như cái gọi là sự suy đồi đạo đức phát sinh từ những tín ngưỡng lố lăng đó.\n\nBởi vì người [parameter:heathens.GetSpeciesNamePlural] là những kẻ sùng đạo cực đoan, nên rắc rối này khá là nhức nhối."
 faction.202.a:0 "Xấu hổ thật."
 faction.202.a.tooltip:0 "§Y[parameter:enemy.GetName]§! đã bị dính điều chỉnh đánh giá §YPhe Phái Sỉ Nhục§! đối với §YĐế chế của ta§!."
 faction.203.title:0 "Sỉ Nhục Bất Thành"
 faction.203.desc:1 "Do thêm một sai sót an ninh tồi tệ nữa, [Root.GetName] lại lọt vào kênh giao tiếp ngoại giao cơ bản của chúng ta. Bọn chúng lại được thể ngoác miệng thóa mạ thứ tín ngưỡng tà môn của [parameter:heathens.GetName].\n\nNhưng có thể hiểu được là bọn người [parameter:heathens.GetSpeciesNamePlural] đã miễn nhiễm với cái bài cũ rích này, chỉ nhún vai bỏ ngoài tai."
 faction.203.a:0 "Thở dài..."

 faction.204.title:0 "Tôn Giáo Phản Nghịch!"
 faction.204.desc:0 "Tình báo cho thấy bọn cuồng tín của phe [Root.GetName] đang mưu đồ vũ trang khởi nghĩa trên [planet.GetName].\n\nĐám loạn thần này chỉ mới nhen nhóm, tốt nhất ta nên bóp chết chúng từ trong nôi."
 faction.204.a:0 "Rất tốt."
 faction.204.a.tooltip:0 "[planet.GetName]:\nNổi Dậy!"

 ### Nationalists
 faction.301.title:2 "Phe Phục Quốc Phá Hoại Có Chủ Đích!"
 faction.301.desc:2 "Đám cực đoan thuộc [Root.GetName] đã phá tan tành một cơ sở trên [planet.GetPlanetMoon] tại hệ [planet.GetName]."
 faction.301.desc.phobe:0 "Một nhóm bạo đồ ngoài hành tinh với mưu đồ nham hiểm thuộc phe [Root.GetName] vừa san bằng một tòa nhà trên [planet.GetName], thứ hành động xấc xược này rành rành là nhắm vào lợi ích của người [Root.Owner.GetAdj] để phá bĩnh trật tự xã hội của chúng ta."
 faction.301.desc.phile:0 "Xem ra những kẻ bất đồng chính kiến dễ thương của [Root.GetName] vô cùng khoái chí với cách thể hiện sự ấm ức của mình — bằng việc đập phá cơ sở hạ tầng trên [planet.GetName] để kiếm thêm việc cho chính phủ chúng ta."

 faction.302.title:1 "Phe Phục Quốc Nổi Loạn!"
 faction.302.desc:3 "Được đám tay chân bơm vá, [Root.GetName] đã quyết định chơi bài ngửa, vung vũ lực hòng đoạt lại mảnh đất từng thuộc về chúng."
 faction.302.desc.phobe:0 "Đám ngoại lai khơi mào phiến loạn trong nội bộ [Root.GetName] đã quyết định dùng bạo lực hất cẳng sự cai trị của người [Root.Owner.GetAdj]!"
 faction.302.desc.phile:0 "Bởi ta không thể chiều theo những yêu sách của chúng, [Root.GetName] đã quyết định trở mặt làm phản."

 ### Peace Movement

 faction.400.title:0 "Hạm Đội Bị Phá Hoại!"
 faction.400.desc:0 "Đám phần tử quá khích của phe [From.GetName] đã trà trộn vào ít nhất một tàu chiến thuộc quân đoàn người [Root.Owner.GetSpeciesAdj] và gài bom. Khối thuốc nổ đã bị kích hoạt, khiến cho [Root.GetName] phải nhận lãnh tổn thất nặng nề.\n\n[From.Leader.GetName], thủ lĩnh của [From.GetName], đã lên tiếng bác bỏ vụ việc, lớn tiếng rêu rao rằng đây là một hành vi bạo lực đáng tởm bộc lộ rõ bản chất giang hồ, đặc biệt là trong cuộc đụng độ vũ trang giữa [Root.Owner.GetName] và [From.parameter:enemy.GetName]."
 faction.400.a:0 "Đúng là đồ đạo đức giả."
 faction.400.a.tooltip:0 "§R[Root.GetName] bị phá hủy.§!"

 faction.401.title:0 "Chấm Dứt Đối Đầu"
 faction.401.desc:0 "Mọi nỗ lực ngoại giao cổ xúy hoặc dẫn tới việc dây dưa xung đột với [From.parameter:enemy.GetName] đã bị đình chỉ, ta đã chìa ra cành ô liu hòa bình vô điều kiện."
 faction.401.a:0 "Hy vọng họ sẽ bằng lòng."

 faction.402.title:0 "Chấm Dứt Đối Đầu"
 faction.402.desc:0 "Ta đã đề nghị cầu hòa vô điều kiện với [From.parameter:enemy.GetName], mong muốn khép lại cuộc chiến."
 faction.402.a:0 "Làm vậy thì có ích lợi gì chứ?"

 ### Liberation Faction

 faction.501.title:0 "[parameter:enemy.GetName] Bị Sỉ Nhục"
 faction.501.desc:1 "Lại là một kẽ hở an ninh làm ta muối mặt, [Root.GetName] đã đánh cắp được quyền truy cập vào đường dây ngoại giao nội bộ. Lũ này đã túm lấy thời cơ thóa mạ [parameter:enemy.GetName] không thương tiếc, đồng thời gào thét đòi chúng trả lại ngay [parameter:planet.GetName].\n\nQuá trình thương thảo với bọn người [parameter:enemy.GetSpeciesNamePlural] diễn ra chẳng suôn sẻ chút nào."
 faction.501.a:0 "Xấu hổ thật."
 faction.501.a.tooltip:0 "§Y[parameter:enemy.GetName]§! đã bị dính điều chỉnh đánh giá §YPhe Phái Sỉ Nhục§! đối với §YĐế chế của ta§!."
 faction.502.title:0 "Sỉ Nhục Bất Thành"
 faction.502.desc:1 "Do thêm một sai sót an ninh cực độ tồi tệ nữa, [Root.GetName] lại leo lên được kênh giao tiếp ngoại giao của chúng ta. Bọn chúng lại dùng trò cũ rích lăng mạ [parameter:enemy.GetName] nặng nề và ép chúng trao trả ngay [parameter:planet.GetName].\n\nTuy nhiên, cũng dễ hiểu khi người [parameter:enemy.GetSpeciesNamePlural] chả thèm đoái hoài gì đến cái bổn cũ soạn lại này, cứ thế bơ đi mà sống."
 faction.502.a:0 "Thở dài..."
 faction.503.title:0 "Phái Diều Hâu Làm Phản!"
 faction.503.desc:0 "Mạng lưới tình báo đã mật báo rằng lũ cực đoan của [Root.GetName] đang rèn quân rèn tướng thành một đội phản loạn quy củ trên [planet.GetName].\n\nMầm mống phản nghịch này còn non, tốt nhất là nên bóp chết chúng từ trong trứng nước."
 faction.503.a:0 "Rất tốt."
 faction.503.a.tooltip:0 "[planet.GetName]:\n§RNổi Loạn!§!"

 ### Emancipation Faction
 faction.600.title:0 "Nô Lệ Bị Kích Động"
 faction.600.desc:0 "Thành viên phe [Root.GetName] được cho là đã thêu dệt nên những luồng tư tưởng phản loạn trong tầng lớp nô lệ. Giới giang hồ đồn thổi rằng chúng đang ra sức huấn luyện, thậm chí là trang bị vũ khí cho những kẻ sống bên lề của phe [parameter:slave_faction.GetName], cho dù chuyện này nghe có vẻ hoang đường."
 faction.600.a:0 "Dù sao đi nữa, thật đáng lo ngại."
 faction.600.a.tooltip:0 "[parameter:slave_faction.GetName]:\n§R+50%§! Độ hiếu chiến\n§R+30%§! Tỉ lệ ủng hộ"
 faction.601.title:0 "Đường Dây Vượt Biên Liên Sao"
 faction.601.desc:0 "Có nguồn tin khẳng định vài tên cộm cán của [Root.GetName] đã tổ chức giải cứu một nhóm nô lệ trên [railroad_planet.GetName], rồi lén lút tẩu tán bọn chúng ra khỏi lãnh thổ của [Root.Owner.GetName]."
 faction.601.a:0 "Ta phải giám sát chúng thật chặt."
 faction.601.a.tooltip:0 "[railroad_planet.GetName]:\nDân số nô lệ: §R-1§!"

 ### Xenoslaver Faction
 faction.700.title:0 "Cưỡng Ép Nô Dịch!"
 faction.700.desc:0 "Dư luận xôn xao rằng đám cuồng tín của phe [Root.GetName] đã dùng vũ lực cưỡng ép một phần dân chúng không mang dòng máu [Root.Owner.GetSpeciesAdj] của [Root.Owner.GetName] làm nô lệ."
 faction.700.a:0 "Hành động bạo ngược kinh hoàng."
 faction.700.a.tooltip:0 "Nô lệ:\n§Y+200§! £pop£§HDân số§!"

 faction.701.title:0 "[parameter:rebelling_faction.GetName] Bạo Loạn!"
 faction.701.desc:0 "Người ta rỉ tai nhau rằng, vì đã chịu đựng quá giới hạn thái độ ủy mị của [Root.Owner.GetName] đối với mấy giống loài ngoại lai thấp hèn sống xung quanh, một lũ khát khao muốn leo lên làm chủ nô trên [parameter:planet.GetName] đã dấy binh tạo phản, xưng hùng xưng bá, tuyên bố độc lập."
 faction.701.a:0 "Thực sự, thực sự là quá đà rồi đấy."

 ### Purged Faction
 faction.801.title:0 "Giãy Giụa Trước Khi Chết"
 faction.801.desc:0 "Nhóm dân sắp bị đưa lên đoạn đầu đài trên [riot_planet.GetName] đã làm liều, tập kích và phá tan tành một cơ sở trên hành tinh."

 faction.803.title:0 "[Root.GetName] Làm Phản!"
 faction.803.desc:0 "Bị dồn vào bước đường cùng trước chiến dịch thanh trừng, những kẻ cùng đường trên [death_planet.GetName] đã liều lĩnh nổ súng chống lại [Root.Owner.GetName], chiêu mộ thành một nhánh quân phiến loạn ô hợp."
