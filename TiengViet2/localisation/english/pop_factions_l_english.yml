 factions.1.desc.unplugged_start: "Một phe phái mới vừa trồi lên trên vũ đài chính trị non trẻ của [Root.Owner.GetName]. Chúng tự xưng là §H[Root.GetName]§!." # trailing space is important
 factions.1.desc.unplugged_imperialist: "Thành viên của họ quyết tâm đem toàn bộ các thứ vũ khí cấy ghép tối tân trong kho vũ khí của chúng ta đi thống trị những vùng còn lại của thiên hà.\n\n"
 factions.1.desc.unplugged_isolationist: "Thành viên của họ đòi đóng kín cửa ngõ quốc gia, mong muốn tạo ra một xã hội vô nhiễm trước máy móc và các thế lực thiên hà khác.\n\n"
 factions.1.desc.unplugged_progressive: "Thành viên của họ tìm cách đi đến các thỏa thuận hòa hảo với láng giềng trong thiên hà, cũng như thực thi công lý cho mọi người dân trong đế chế.\n\n"
 factions.1.desc.unplugged_prosperity: "Thành viên của họ ra sức vận động hành lang để phát triển thương mại và ổn định bằng các biện pháp ôn hòa, bài trừ sự bành trướng của quân phiệt.\n\n"
 factions.1.desc.unplugged_supremacist: "Thành viên của họ thề bảo vệ địa vị thượng phong của giống loài [Root.Owner.GetSpeciesAdj], được khuếch đại bởi những cỗ máy đầy uy lực do chính tay chúng ta chế tạo.\n\n"
 factions.1.desc.unplugged_technologist: "Thành viên của họ một lòng theo đuổi các bước tiến khoa học cũng như sự thấu hiểu tường tận về các bộ phận cấy ghép trên cơ thể mình.\n\n"
 factions.1.desc.unplugged_totalitarian: "Thành viên của họ không ngừng thôi thúc việc thâu tóm tối đa quyền lực chính trị và quân sự, cố gắng bắt chước y hệt mô hình trí tuệ máy móc mà chúng ta từng biết.\n\n"
 factions.1.desc.unplugged_traditionalist: "Thành viên của họ tôn sùng các quan điểm tâm linh và bảo thủ, song hành với những giá trị tự nhiên, hữu cơ mà chúng ta từng trân quý trong quá khứ.\n\n"
 factions.1.desc.unplugged_xenoist: "Thành viên của họ ra sức thúc đẩy quan hệ hữu nghị với các sinh vật ngoài hành tinh, rũ bỏ hoàn toàn cái bóng u ám mà ý thức máy móc đã gieo rắc trong quá khứ.\n\n" # 'Machine' as an adjective in reference to the intelligence that once assimilated us

 factions.2000.title:0 "Tư Tưởng Chủ Đạo Của [TargetFaction.Owner.GetName] Bị Đổi Chiều"
 factions.2000.desc.start:0 "Cùng với sự gia tăng ủng hộ bền bỉ dành cho §Y[TargetFaction.GetName]§!, cuối cùng §Y[TargetFaction.Owner.GetName]§! cũng đã dang tay đón nhận phe này, chấp thuận những giá trị cốt lõi và đường lối chính sách của chúng."
 factions.2000.desc_short: "§Y[TargetFaction.Owner.GetName]§! đã dung nạp §H[TargetFaction.GetFactionType]§!, ngả theo hướng §H[TargetFaction.GetEthicEquivelent]§!."
 MESSAGE_FACTION_EMBRACED_TITLE: "Thay Đổi Tư Tưởng Chủ Đạo"
 factions.2000.desc.imperialist:0 "Nhờ dung nạp phe này, tư tưởng chủ đạo của đế chế đã chuyển sang §HQuân Phiệt§!.\n\n"
 factions.2000.desc.isolationist:0 "Nhờ dung nạp phe này, tư tưởng chủ đạo của đế chế đã chuyển sang §HBài Ngoại§!.\n\n"
 factions.2000.desc.progressive:0 "Nhờ dung nạp phe này, tư tưởng chủ đạo của đế chế đã chuyển sang §HBình Đẳng§!.\n\n"
