 ### New Events
 factions.1.title:0 "Phe Phái Được Thành Lập"
 factions.1.desc:1 "Một phe phái mới đang lớn mạnh từng ngày trên chính trường của [Root.Owner.GetName]. Chúng tự xưng là [Root.GetName], các thành viên của phe này đang dồn dập hối thúc ta phải giải quyết vô số yêu sách mà chúng đưa ra.\n\nCó thể đoán trước được rằng, khi dân số bùng nổ và các hệ tư tưởng ngày càng phân hóa, đủ loại phe phái sẽ mọc lên như nấm sau mưa. Những phe phái không được thỏa mãn yêu sách sẽ trở thành mầm mống họa loạn, còn những phe ủng hộ các quyết sách của đế chế thì ta hoàn toàn có thể lợi dụng làm công cụ..."
 factions.1.desc.start:1 "Một phe phái mới đang lớn mạnh từng ngày trên chính trường của [Root.Owner.GetName]. Chúng tự xưng là §H[Root.GetName]§!. " # trailing space is important
 MESSAGE_FACTION_FORMED_TITLE: "Phe Phái Mới"
 factions.1.desc.start_short:1 "Có một §H[Root.GetFactionType]§! đã thành hình, chúng tự xưng là §H[Root.GetName]§!."
 factions.1.desc.firstfinisher:0 "Những phe phái không được thỏa mãn yêu sách sẽ trở thành mầm mống họa loạn, còn những phe ủng hộ các quyết sách của đế chế thì ta hoàn toàn có thể lợi dụng..."
 factions.1.desc.imperialist:0 "Thành viên của họ dốc sức củng cố quyền thống trị quân sự của chúng ta lên các vùng khác trong thiên hà.\n\n"
 factions.1.desc.isolationist:0 "Thành viên của họ cổ xúy việc đóng cửa biên giới và duy trì nguyên tắc bất can thiệp vào các sự vụ của thiên hà.\n\n"
 factions.1.desc.progressive:0 "Thành viên của họ tranh đấu vì sự công bằng và bình đẳng cho mọi công dân sống trong đế chế của chúng ta.\n\n"
 factions.1.desc.prosperity:2 "Thành viên của họ nỗ lực định hướng quốc gia tập trung phát triển kinh tế và duy trì ổn định xã hội thông qua các giải pháp ôn hòa.\n\n"
 factions.1.desc.supremacist:0 "Thành viên của họ thề bảo vệ vị thế độc tôn của giống loài [Root.Owner.GetSpeciesAdj], thậm chí sẵn sàng tước đoạt quyền lợi của các sinh vật ngoại lai khác nếu thấy cần thiết.\n\n"
 factions.1.desc.technologist:0 "Thành viên của họ hết lòng cống hiến cho những thành tựu và bước tiến khoa học vĩ đại.\n\n"
 factions.1.desc.totalitarian:0 "Thành viên của họ luôn cổ vũ sự trỗi dậy của một hệ thống chính trị tập quyền tột độ và đề cao uy quyền quân đội.\n\n"
 factions.1.desc.traditionalist:0 "Thành viên của họ là những tín đồ kiên trung của các quan điểm bảo thủ và tâm linh.\n\n"
 factions.1.desc.xenoist:0 "Thành viên của họ luôn muốn vun đắp mối giao hảo với các chủng loài ngoài hành tinh khác.\n\n"
