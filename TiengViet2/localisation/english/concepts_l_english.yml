 tt_market: "Mua trên £market£ ['concept_market']"
 tt_no_need_hive: "§R$auth_hive_mind_plural$ không sử dụng tài nguyên này.§!"
 tt_some_need_machine: "§R$auth_machine_intelligence_plural$ thường không sử dụng tài nguyên này.§!"
 tt_some_need_infernal: "§R$trait_infernal_plural$ thường không sử dụng tài nguyên này.§!"
 concept_advanced_empire: "Đế Chế AI Nâng Cao"
 concept_advanced_empires: "Các Đế Chế AI Nâng Cao"
 concept_advanced_empires_desc: "Các Đế Chế AI Nâng Cao khởi đầu với lợi thế ban đầu về tài nguyên, công nghệ và dân số. Họ không nhận thêm bất kỳ lợi thế nào khác ngoài vị thế xuất phát điểm mạnh hơn."
 concept_alien_zoo: "$building_xeno_zoo$"
 concept_alien_zoo_desc: "£mod_job_entertainer_add£ [entertainer.GetName] Jobs: §G+100§!\n£mod_job_xeno_zoo_keeper_add£ $job_xeno_zoo_keeper$ Jobs: §G+100§!\n£mod_job_livestock_zoo_animal_add£ $job_livestock_zoo_animal$ Jobs: §G+300§!\n\n£job_xeno_zoo_keeper£ $job_xeno_zoo_keeper_plural$ chuyển hóa $r_consumer_goods$ thành £society£ §YĐiểm Nghiên Cứu§! và $r_amenities$.\n$t$$r_amenities$ sản xuất tỉ lệ thuận với việc làm £job_livestock_zoo_animal£ $job_livestock_zoo_animal$.\n$job_entertainer_effect_desc$\n$job_livestock_zoo_animal_effect_desc$\n\n§L$building_xeno_zoo_desc$§!"
 concept_adapted_habitability: "Độ Thích Nghi Cải Biến"
 concept_adapted_habitability_desc: "Bằng nỗ lực có chủ đích, một chủng loài có thể vượt qua mức §G100%§! Độ Thích Nghi, $HIGH_HABITABILITY_EFFECTS_TT$\n\n$concept_adapted_habitability$ cơ bản: §G$@habitability_ceil_uncapped_base|0%$§!\n\n§LSở thích khí hậu được quyết định bởi di truyền hoặc thiết kế. Khả năng thích nghi vượt ngoài giới hạn này có thể đạt được thông qua thao túng gen hoặc các cải biến chuyên biệt.§!"
 concept_ascension_perk: "Đặc Quyền Thăng Hoa"
 concept_ascension_perks: "Các Đặc Quyền Thăng Hoa"
 concept_ascension_perks_desc: "§H$concept_ascension_perks$§! mang lại những lợi ích to lớn trên toàn đế chế, có thể định hình tiến trình phát triển của một nền văn minh, mở ra những con đường dẫn tới sức mạnh vượt trội, sự kiên cường hoặc siêu việt.\n\nChúng được lựa chọn và quản lý trong thẻ §H$traditions$§! của giao diện £interface£ ['concept_society_management_view']."
 concept_alloys: "Hợp Kim"
 concept_alloys_desc: "£alloys£ §H$concept_alloys$§! là tài nguyên tiên tiến có ứng dụng quân sự quan trọng.\n\nTrong số các mục đích sử dụng, chúng dùng để đóng ['concept_civilian_ships'], ['concept_military_ships'], ['concept_starbases'], và ['concept_megastructures'].$tt_gain$- Xây dựng £zone£ §H$zone_industrial_plural$§! hoặc £zone£ §H$zone_foundry_plural$§!\n- Xây dựng £building£ ['building:building_foundry_1']\n- $tt_market$"
 concept_trade: "Thương Mại"
 concept_trade_desc: "$r_trade$ đại diện cho các hoạt động kinh tế hàng ngày, dòng chảy thương mại và năng lực hậu cần bên trong một ['concept_empire'].\n\nNó được sử dụng cho ['concept_ship_upkeep'], ['concept_colony_upkeep'], và để mua các tài nguyên khác.$tt_gain$- Xây dựng £building£ ['concept_buildings'] có việc làm £job£ ['concept_jobs'] sản xuất $r_trade$\n- Xây dựng £mining_station£ ['concept_mining_stations'] trên các mỏ tài nguyên thương mại liên sao\n- Bán tài nguyên trên £market£ ['concept_market']"
 concept_building: "$buildable_building$"
 concept_buildings: "$planet_buildings$"
 concept_building_desc: "£building£ §H$concept_buildings$§! chuyên môn hóa sản lượng của £colony£ ['concept_colonies']. Ví dụ bao gồm ['building:building_foundry_1'] và ['building:building_research_lab_1'].\n\nCần có một §HÔ Công Trình§! còn trống để xây dựng một §H$concept_building$§!, điều này có thể yêu cầu chọn một £zone£ ['concept_district_specialization'].$tt_gain$- Xây dựng thêm §H$concept_buildings$§! trong giao diện £interface£ ['concept_colony_view']"
 concept_civilian_space_station: "Dân Sự $spacestation_1$"
 concept_civilian_space_stations: "Dân Sự $spacestation_1_plural$"
 concept_civilian_space_station_desc: "£mining_station£ §H$mining_station_plural$§! và £science_ship£ §H$research_station_plural$§! là các công trình quỹ đạo được xây dựng quanh các thiên thể để khai thác tài nguyên hoặc tiến hành nghiên cứu khoa học. $mining_station$ thu hoạch £minerals£ ['concept_minerals'], £energy£ ['concept_energy'], và các vật liệu chiến lược khác, trong khi $research_station$ tạo ra £physics£ £society£ £engineering£ ['concept_research'] để thúc đẩy tiến bộ khoa học.\n\nCác trạm này rất quan trọng đối với việc mở rộng kinh tế và phát triển công nghệ, yêu cầu phải xây dựng thông qua một tàu £construction_ship£ ['concept_construction_ship']."
 concept_colony: "$COLONY$"
 concept_colonies: "$COLONIES$"
 concept_colony_desc: "Một thuộc địa £colony£ §H$concept_colony$§! là bất cứ nơi nào £pop£ ['concept_pops'] sinh sống và làm việc trong các £district£ ['concept_districts'], £zone£ ['concept_district_specializations'], và £building£ ['concept_buildings'].\n\nVí dụ bao gồm §Hquê nhà§! khởi đầu, các hành tinh £planet£ ['concept_planets'] được khai hoang bởi tàu thuộc địa £colony_ship£ ['concept_colony_ships'], hoặc các trạm cư trú nhân tạo ['concept_habitats'].\n\n§H$concept_colonies$§! được quản lý trong giao diện £interface£ ['concept_colony_view']."
 concept_colony_ship: "$colonizer$"
 concept_colony_ships: "$colonizer_plural$"
 concept_colony_ship_desc: "Tàu thuộc địa £colony_ship£ §H$concept_colony_ships$§! được phái đến các hành tinh £planet£ ['concept_planets'] để biến chúng thành thuộc địa £colony£ ['concept_colonies'].\n\nMột tàu thuộc địa §H$concept_colony_ship$§! sẽ tự động được đóng khi quá trình thuộc địa hóa được bắt đầu từ giao diện £interface£ ['concept_colony_view'] hoặc giao diện £interface£ ['concept_expansion_planner']. Chúng cũng có thể được đóng trong một ['concept_shipyard']."
 concept_construction_ship: "$constructor$"
 concept_construction_ships: "$constructor_plural$"
 concept_construction_ship_desc: "Một tàu xây dựng £construction_ship£ §H$concept_construction_ship$§! cho phép lắp ráp nhiều loại trạm không gian khác nhau.$tt_use$- Xây dựng ['concept_outposts'] trong £system£ ['concept_systems'] vô chủ để mở rộng biên giới của một ['concept_empire']\n- Xây dựng £mining_station£ ['concept_mining_stations'] và £science_ship£ ['concept_research_stations'] xung quanh £planet£ ['concept_planets'] và £star£ ['concept_stars'] đã khảo sát\n- Xây dựng ['concept_megastructures']\n- Nghiên cứu một số ['concept_special_projects'] nhất định$tt_gain$- Đóng §H$concept_construction_ships$§! trong một ['concept_shipyard']"
 concept_science_ship: "$science$"
 concept_science_ships: "$science_plural$"
 concept_science_ship_desc: "Tàu khoa học £science_ship£ §H$concept_science_ships$§! là các tàu chuyên dụng được thiết kế cho các hoạt động thám hiểm, khảo sát và nghiên cứu. Được vận hành bởi một £scientist£ ['concept_scientist'], chúng có thể khảo sát các hệ sao chưa có hải đồ, phân tích £anomaly£ ['concept_anomalies'], và điều tra các £archaeology£ ['concept_archaeology_sites'].\n\nNhững tàu này được tự động trang bị các ['concept_components'] tiên tiến nhất hiện có và mang tính thiết yếu cho công cuộc mở rộng và khám phá thời kỳ đầu.\n\n§H$concept_science_ships$§! cũng có thể được dùng để khám phá các hiện tượng thiên hà chẳng hạn như ['concept_wormholes'], nghiên cứu ['concept_debris'] của tàu thuyền, hoặc hỗ trợ các ['concept_special_projects'] đòi hỏi sự phân tích chi tiết."
 concept_consumer_goods: "Hàng Tiêu Dùng"
 concept_consumer_goods_desc: "[GetConceptConsumerGoods]"
 concept_consumer_goods_desc_start: "£consumer_goods£ §H$concept_consumer_goods$§! là một loại tài nguyên cao cấp bao gồm các thiết bị, đồ xa xỉ và trang bị cần thiết để mang lại cho £pop£ ['concept_pops'] một cuộc sống tốt đẹp."
 concept_consumer_goods_desc_end: "$tt_gain$- Xây dựng £zone£ §H$zone_industrial_plural$§! hoặc £zone£ §H$zone_factory_plural$§!\n- Xây dựng £building£ ['building:building_factory_1']\n- $tt_market$"
 concept_consumer_goods_desc_regular: "$concept_consumer_goods_desc_start$\n\nMột số £job£ ['concept_jobs'] yêu cầu loại hàng này để hoạt động, chẳng hạn như £job_researcher£ ['concept_researcher'] hoặc £job_priest£ ['concept_priest'].$concept_consumer_goods_desc_end$"
 concept_consumer_goods_desc_hive: "$tt_no_need_hive$\n\n$concept_consumer_goods_desc_regular$"
 concept_consumer_goods_desc_machine: "$tt_some_need_machine$\n\n$concept_consumer_goods_desc_start$\n\n['concept_auth_machine_intelligence', $auth_machine_intelligence_plural$] có §H$civic_machine_obsessional_directive$§! sẽ sản xuất £consumer_goods£ §H$concept_consumer_goods$§!, cũng như §H$civic_machine_servitor_plural$§! sản xuất cho £pop£ §H$citizenship_organic_trophy$ Dân cư§! của họ.$concept_consumer_goods_desc_end$"
 concept_biomass: "Sinh khối"
 concept_biomass_desc: "£biomass£ §HBiomass§! là tiềm năng hữu cơ thô được tạo ra bởi hoạt động sinh học trên khắp các thế giới thuộc ['concept_owned_systems'].\n\nNó được dùng để xây dựng £building£ ['concept_buildings'] hành tinh và ['concept_terraforming'] các ['concept_colonies'] mới.$tt_gain$- Tăng trưởng thêm £pop£ ['concept_pops']\n- Xây dựng £building£ ['building:building_cradle_of_rebirth']"
 concept_dna: "$genetic_material$"
 concept_dna_desc: "£genetic_material£ §H$concept_dna$§! cho phép chúng ta nhân bản các sinh vật du hành vũ trụ để sử dụng làm hạm đội quân sự. Vật liệu di truyền cấp cao hơn sẽ mở khóa việc nhân bản §YQuần thể Sinh vật Vũ trụ§! cấp cao hơn tại ['concept_beastport', Cảng Thú].\n\nVật liệu Di truyền có thể được thu thập ngoài tự nhiên với £physics£ ['technology:tech_gravity_wells'] và thông qua nhân giống trong ['concept_vivarium']."
 concept_district: "$DISTRICT$"
 concept_districts: "$DISTRICTS$"
 concept_district_desc: "£district£ §H$concept_districts$§! là các khu vực chuyên biệt của một thuộc địa £colony£ ['concept_colony']. Ví dụ bao gồm ['concept_generator_districts'], ['concept_mining_districts'], hoặc ['concept_farming_districts'].\n\nChúng thường cung cấp cả nhà ở £housing£ ['concept_housing'] và việc làm £job£ ['concept_jobs'].$tt_gain$- Xây dựng thêm §H$concept_districts$§! trong giao diện £interface£ ['concept_colony_view']"
 concept_edict: "Sắc Lệnh"
 concept_edicts: "Các Sắc Lệnh"
 concept_edicts_desc: "§H$concept_edicts$§! là các quyết định trên toàn đế chế được ban hành bằng cách tiêu tốn tài nguyên hoặc chi trả chi phí duy trì hàng tháng.\n\nHầu hết đều yêu cầu $i_unity$ hoặc được chi trả bằng ['concept_edict_fund'], mặc dù một số §H$concept_edicts$§! có thể tiêu tốn các tài nguyên khác.\n\n§H$concept_edicts$§! được quản lý trong thẻ §H$government_view_tab_policies_and_edicts$§! của giao diện £interface£ ['concept_government_view']."
 concept_edict_fund: "Quỹ Sắc Lệnh"
 concept_edict_fund_desc: "§H$concept_edict_fund$§! là một nguồn dự trữ £unity£ ['concept_unity'] cố định dành riêng cho chi phí duy trì sắc lệnh ['concept_edict']. Nếu chi phí duy trì vượt quá dung lượng của §H$concept_edict_fund$§!, lượng §H$concept_unity$§! bổ sung sẽ bị tiêu hao."
 concept_energy: "Năng Lượng Tín Dụng"
 concept_energy_desc: "£energy£ §H$concept_energy$§! là các đơn vị lưu trữ năng lượng có thể chuyển giao, thiết yếu cho mọi nền văn minh vũ trụ ['concept_empires'].\n\nChúng được sử dụng để duy trì tàu ['concept_ships'] và công trình ['concept_buildings'], dọn dẹp các chướng ngại £blocker£ ['concept_blockers'] trên hành tinh, và giao dịch với các thế lực khác.$tt_gain$- Xây dựng £district£ ['concept_generator_districts']\n- Xây dựng £mining_station£ ['concept_mining_stations'] trên các thiên thể ['concept_celestial_objects'] giàu năng lượng\n- $tt_market$"
 concept_authority: "Thể Chế"
 concept_authorities: "Các Thể Chế"
 concept_authority_desc: "Một thể chế §H$concept_authority$§! quyết định cách một đế chế lựa chọn các nhà cai trị và cai quản dân số của mình. Thể chế dân chủ và tài phiệt tổ chức bầu cử định kỳ ['concept_democratic_election'], trong khi thể chế độc tài và đế quốc tập trung quyền lực vào tay một người cai trị duy nhất.\n\nViệc lựa chọn thể chế §H$concept_authority$§! ảnh hưởng đến sự tán đồng và ủng hộ của các phe phái ['concept_factions'], thứ tự kế vị của nhà cai trị, các quốc sách ['concept_civics'] khả dụng, và các tương tác ngoại giao.\n\nThể chế §H$concept_authority$§! của một đế chế được thiết lập trong quá trình tạo đế chế nhưng có thể được thay đổi sau này thông qua cải cách, miễn là đáp ứng các điều kiện cần thiết."
 concept_ethic: "Tư Tưởng"
 concept_ethics: "Các Trục Tư Tưởng"
 concept_ethic_desc: "§H$concept_ethics$§! đại diện cho niềm tin ý thức hệ cốt lõi của một đế chế, định hình các chính sách, cấu trúc xã hội và lập trường ngoại giao. Chúng xác định xem một cá nhân coi trọng tự do hay sự kiểm soát chuyên chế, chinh phục quân sự hay hợp tác hòa bình.\n\nCác trục tư tưởng §H$concept_ethics$§! của một đế chế ảnh hưởng đến các quốc sách ['concept_civics'], thể chế ['concept_authorities'], và cách thức tương tác với các đế chế khác. Mặc dù các tư tưởng §H$concept_ethics$§! được chọn khi tạo đế chế, chúng có thể biến chuyển theo thời gian do áp lực nội bộ, ảnh hưởng của các phe phái, hoặc cải cách có chủ đích thông qua cơ chế biến chuyển tư tưởng."
 concept_faction: "Phe Phái"
 concept_factions: "Các Phe Phái"
 concept_faction_desc: "§H$concept_factions$§! là các nhóm dân cư £pop£ ['concept_pops'] có chung những yêu sách liên quan đến việc điều hành đế chế ['concept_empire'].\n\nĐộ tán đồng ['concept_approval'] phản ánh mức độ hài lòng của một phe phái §H$concept_faction$§! đối với hiện trạng, ảnh hưởng đến độ hạnh phúc £happiness£ ['concept_happiness'] của dân cư §H$concept_pops$§! thuộc phe phái đó.\n\nĐộ tán đồng §H$concept_approval$§! và tỷ lệ ủng hộ ['concept_support'] càng cao sẽ mang lại càng nhiều điểm đoàn kết £unity£ ['concept_unity'] từ phe phái §H$concept_faction$§! đó."
 concept_approval: "Độ Tán Đồng"
 concept_approval_desc: "§H$concept_approval$§! của một phe phái ['concept_faction'] đại diện cho mức độ hài lòng của phe đó với hiện trạng hiện tại và có thể ảnh hưởng đến độ hạnh phúc £happiness£ ['concept_happiness'] của dân số £pop£ ['concept_pops'] thuộc phe phái.\n\nĐộ tán đồng §H$concept_approval$§! và tỷ lệ ủng hộ ['concept_support'] của phe phái càng cao, lượng điểm đoàn kết £unity£ ['concept_unity'] thu được từ phe đó càng nhiều."
 concept_support: "Tỷ Lệ Ủng Hộ"
 concept_support_desc: "§H$concept_support$§! đại diện cho sức mạnh chính trị của một phe phái ['concept_faction']. §H$concept_support$§! gia tăng theo số lượng dân cư £pop£ ['concept_pops'] tham gia phe phái §H$concept_faction$§! đó.\n\nDân cư §H$concept_pops$§! có §HQuyền Công Dân Toàn Phần§! đóng góp nhiều tỷ lệ ủng hộ hơn đáng kể so với những dân cư không có quyền này."
 concept_endgame_crisis: "Khủng Hoảng Cuối Game"
 concept_endgame_crises: "Các Khủng Hoảng Cuối Game"
 concept_endgame_crisis_desc: "Khi một ván chơi Stellaris bước vào giai đoạn cuối, một Cuộc Khủng Hoảng Thiên Hà sẽ xuất hiện. Những Cuộc Khủng Hoảng Cuối Game này có thể là một thử thách vô cùng khắc nghiệt ngay cả với những người chơi kỳ cựu.\n\nCác Khủng Hoảng Cuối Game thông thường sẽ chỉ xảy ra sau khi đạt tới §INăm Bắt Đầu Giai Đoạn Cuối§!."
 concept_fallen_empire: "Đế Chế Sa Ngã"
 concept_fallen_empires: "Các Đế Chế Sa Ngã"
 concept_fallen_empires_desc: "Các Đế Chế Sa Ngã là những nền văn minh tiền thân cổ đại khởi đầu với công nghệ tiên tiến cùng hạm đội hùng mạnh, nhưng thường ở trạng thái thụ động. Đôi khi họ có thể đưa ra yêu sách hoặc giao nhiệm vụ cho các đế chế non trẻ hơn.\n\nChọc giận một Đế Chế Sa Ngã là điều vô cùng mạo hiểm trừ khi bạn hoàn toàn tự tin vào khả năng đánh bại một đối thủ đầy thách thức như vậy."
 concept_fallen_empire_awakening: "Đế Chế Sa Ngã Thức Tỉnh"
 concept_awaken: "Thức Tỉnh"
 concept_awakened_empire: "$COUNTRY_AWAKENED_FALLEN_EMPIRE$"
 concept_awakened_empires: "Các Đế Chế Thức Tỉnh"
 concept_awakened_empires_desc: "$COUNTRY_AWAKENED_FALLEN_EMPIRE_DESC$"
 concept_food: "Thức Ăn"
 concept_food_desc: "[GetConceptFood]"
 concept_food_desc_end: "$tt_gain$§Y-§! Xây dựng £district£ ['concept_farming_districts']\n- $tt_market$"
 concept_food_desc_regular: "£food£ §H$concept_food$§! đại diện cho các dưỡng chất cần thiết để nuôi sống và phát triển dân cư £pop£ ['concept_pops'].$concept_food_desc_end$"
 concept_food_desc_machine: "$tt_some_need_machine$\n\n£food£ §H$food$§! đại diện cho các nguồn dưỡng chất sinh học mà các dạng sống hữu cơ cần để duy trì thể xác yếu ớt của chúng.\n\nCác đế chế §H$civic_machine_assimilator_plural$§! sản xuất £food£ §H$concept_food$§! cho dân cư Cyborg £pop£ §HCyborg Pops§! của họ, và các đế chế §H$civic_machine_servitor_plural$§! cho dân cư Cổ Vật Hữu Cơ £pop£ §H$citizenship_organic_trophy$ Pops§!.$concept_food_desc_end$"
 concept_food_desc_infernal: "$tt_some_need_infernal$\n\n£food£ §H$food$§! đại diện cho các chất dinh dưỡng sinh học mà các dân cư hữu cơ £pop£ ['concept_pops'] từ các loài ngoại lai cần để duy trì thể xác ấm áp nhỏ bé của chúng.$concept_food_desc_end$"
 concept_flexible_traditions: "Truyền Thống Linh Hoạt"
 concept_flexible_tradition: "Truyền Thống Linh Hoạt"
 concept_flexible_traditions_desc: "Truyền Thống Linh Hoạt là các truyền thống ['concept_traditions'] được thiết lập tùy thuộc vào những lựa chọn được đưa ra trong quá trình chơi."
 concept_gateway: "Cổng Tinh Tú"
 concept_gateways: "Các Cổng Tinh Tú"
 concept_gateways_desc: "Cổng Tinh Tú là các cấu trúc khổng lồ tạo ra các đường dẫn hạ không gian, cho phép di chuyển gần như tức thời tới bất kỳ Cổng Tinh Tú nào khác đang hoạt động trong mạng lưới."
 concept_great_khan: "Đại Khả Hãn"
 concept_great_khan_desc: "Đại Khả Hãn là một chuỗi sự kiện giữa game, trong đó các bộ tộc rải rác của một Đế Chế Cướp Bóc ['concept_marauder_empires', $concept_marauder_empire$] được thống nhất bởi một thủ lĩnh kiệt xuất. Dưới danh nghĩa Hãn Quốc Cướp Bóc, họ sẽ tìm cách chinh phục các đế chế khác và buộc họ phải quy phục.$requires_apoc$"
 concept_grand_admiral: "$DIFFICULTY_GRAND_ADMIRAL$"
 concept_grand_admiral_desc: "$DIFFICULTY_GRAND_ADMIRAL_DESC$"
 concept_guaranteed_colonies: "$FE_GUARANTEED_COLONIES$"
 concept_guaranteed_colonies_desc: "Tùy chọn này kiểm soát số lượng hành tinh có thể sinh sống cùng loại với quê nhà chắc chắn sẽ xuất hiện gần hệ sao khởi đầu của bạn. Tắt tùy chọn này có thể khiến bạn hoàn toàn không tìm thấy bất kỳ thế giới có thể sinh sống nào gần quê nhà."
 concept_hyperlane: "Tuyến Siêu Không Gian"
 concept_hyperlanes: "Các Tuyến Siêu Không Gian"
 concept_hyperlanes_desc: "§H$concept_hyperlanes$§! là các đường dẫn hạ không gian tự nhiên hình thành giữa các giếng trọng lực của các ngôi sao. Sử dụng động cơ siêu không gian để di chuyển dọc theo §H$concept_hyperlanes$§! là phương thức di chuyển liên sao chủ yếu."
 concept_job: "Việc Làm"
 concept_jobs: "Các Vị Trí Việc Làm"
 concept_job_desc: "Vị trí việc làm £job£ §H$concept_jobs$§! đại diện cho các vai trò và nghề nghiệp mà dân cư £pop£ ['concept_pops'] đảm nhận trong đế chế, quyết định sản lượng tài nguyên, sản lượng nghiên cứu và chức năng xã hội.\n\nViệc làm được cung cấp bởi các khu vực £district£ ['concept_districts'], khu chuyên môn hóa £zone£ ['concept_district_specializations'], công trình £building£ ['concept_buildings'], và các đặc trưng hành tinh khác, với các loại hình khác nhau phục vụ các nhu cầu kinh tế, khoa học hoặc quân sự cụ thể.\n\nSự phân bổ của §H$concept_jobs$§! tác động trực tiếp đến sự ổn định kinh tế, động thái chính trị và hiệu quả tổng thể của đế chế.\n\n§H$concept_jobs$§! được quản lý trong giao diện £interface£ ['concept_colony_view']."
 concept_unemployment: "Thất Nghiệp"
 concept_unemployment_desc: "Dân cư thất nghiệp £pop£ §HUnemployed Pops§! thiếu việc làm £job£ ['concept_job'] để làm việc. Họ không tạo ra tài nguyên và có thể làm giảm độ ổn định £stability£ ['concept_stability'] của thuộc địa £colony£ ['concept_colony']."
 concept_l_gate: "Cổng L"
 concept_l_gates: "Các Cổng L"
 concept_l_gates_desc: "Một mạng lưới Cổng Tinh Tú bí ẩn kết nối tới một mạng lưới hạ không gian tách biệt. Chúng dường như đã bị cố ý vô hiệu hóa."
 concept_machine_uprising: "Cuộc Nổi Dậy Của Máy Móc"
 concept_machine_uprising_desc: "Cuộc Nổi Dậy Của Máy Móc là một chuỗi sự kiện giữa game, trong đó những người máy phục vụ sở hữu Trí Tuệ Nhân Tạo có thể tìm cách nổi dậy chống lại đế chế đã tạo ra chúng. Điều này có thể dẫn đến sự hình thành một đế chế Trí Tuệ Máy Móc ['authority:auth_machine_intelligence'] mới trong dải ngân hà.$requires_syn_dawn$"
 concept_marauder_empire: "Đế Chế Cướp Bóc"
 concept_marauder_empires: "Các Đế Chế Cướp Bóc"
 concept_marauder_empires_desc: "Các Đế Chế Cướp Bóc là các nền văn minh sống trong không gian, dành phần lớn thời gian để giao chiến lẫn nhau và cướp phá các đế chế lân cận. Đôi khi họ có thể đòi hỏi cống nạp từ các đế chế khác."
 concept_market: "$MARKET_VIEW$"
 concept_market_desc: "Thị trường §H$concept_market$§! cho phép các đế chế mua bán tài nguyên, điều chỉnh nền kinh tế để đáp ứng nhu cầu trước mắt hoặc các chiến lược dài hạn. Các giao dịch có thể thực hiện một lần hoặc thiết lập thành các thỏa thuận thương mại £trade_value£ ['concept_trade'] hàng tháng nhằm đảm bảo nguồn cung cấp vật liệu thiết yếu liên tục.\n\nGiá cả biến động dựa trên cung và cầu trên toàn bộ nền kinh tế thiên hà, với các giao dịch diễn ra thường xuyên hơn sẽ ảnh hưởng tới tỷ giá thị trường. Các đế chế sở hữu truyền thống ['tradition_category:tradition_mercantile'] hoặc cơ cấu tập đoàn có thể nhận được thêm lợi ích khi tham gia thương mại."
 concept_megastructure: "$MEGASTRUCTURE$"
 concept_megastructures: "$megastructures$"
 concept_megastructure_desc: "Siêu cấu trúc £megastructure£ §H$concept_megastructures$§! là các dự án công trình đồ sộ thể hiện sức mạnh công nghệ và kinh tế của một đế chế phát triển vượt bậc. Thường được xây dựng theo từng giai đoạn, chúng phục vụ các mục tiêu chiến lược, khoa học hoặc kinh tế.\n\nXây dựng một siêu cấu trúc §H$concept_megastructure$§! đòi hỏi sự đầu tư to lớn, nghiên cứu tiên tiến và nền tảng hậu cần vững chắc. Chúng được khởi công bằng tàu xây dựng £construction_ship£ ['concept_construction_ship'], thường là tại các vị trí chỉ định trong không gian.\n\nKhi hoàn thành, các công trình khổng lồ này sẽ tái định hình bản đồ thiên hà, đứng vững như những tượng đài vĩnh cửu ghi dấu tham vọng ở quy mô vũ trụ."
 concept_minerals: "Khoáng Sản"
 concept_minerals_desc: "[GetConceptMinerals]"
 concept_minerals_desc_start: "£minerals£ §HKhoáng sản§! bao gồm các tài nguyên cơ bản được sử dụng trong xây dựng.\n\nChúng được sử dụng để xây dựng công trình £building£ ['concept_buildings'] và các trạm không gian dân sự £mining_station£ £science_ship£ ['concept_civilian_space_stations']. Chúng cũng có thể được tinh luyện thành hợp kim £alloys£ ['concept_alloys']"
 concept_minerals_desc_end: "$tt_gain$- Xây dựng £district£ ['concept_mining_districts']\n- Xây dựng £mining_station£ ['concept_mining_stations'] trên các thiên thể ['concept_celestial_objects'] giàu khoáng sản\n- $tt_market$"
 concept_minerals_desc_regular: "$concept_minerals_desc_start$ hoặc hàng tiêu dùng £consumer_goods£ ['concept_consumer_goods'].$concept_minerals_desc_end$"
 concept_minerals_desc_hive: "$concept_minerals_desc_start$.$concept_minerals_desc_end$"
 concept_mining_station: "$mining_station$"
 concept_mining_stations: "$mining_station_plural$"
 concept_mining_station_desc: "Trạm khai thác £mining_station£ §H$concept_mining_station$§! là một cơ sở quỹ đạo khai thác các tài nguyên quý giá từ các thiên thể, ví dụ như năng lượng £energy£ ['concept_energy'], khoáng sản £minerals£ ['concept_minerals'], hoặc hợp kim £alloys£ ['concept_alloys'].$tt_gain$- Sử dụng tàu xây dựng £construction_ship£ ['concept_construction_ships'] để xây dựng §H$concept_mining_stations$§! quanh các thiên thể ['concept_celestial_objects'] giàu tài nguyên"
 tt_build_research_stations: "Sử dụng tàu xây dựng £construction_ship£ ['concept_construction_ships'] để xây dựng trạm nghiên cứu £science_ship£ ['concept_research_stations'] quanh các thiên thể ['concept_celestial_objects'] giàu tiềm năng nghiên cứu"
 tt_research_gain: "$tt_gain$- Sử dụng một số vị trí việc làm £job£ ['concept_jobs'] nhất định, ví dụ từ công trình £building£ ['building:building_research_lab_1']\n- $tt_build_research_stations$"
 concept_research_shared: "\n\n§HĐiểm Nghiên Cứu Tích Lũy§! nhận được từ một số sự kiện nhất định hoặc khi không có nghiên cứu nào được chọn. Mỗi tháng, một lượng §HĐiểm Nghiên Cứu Tích Lũy§! bằng với §HSản Lượng Thu Được Hàng Tháng§! sẽ được sử dụng, giúp gia tăng tốc độ nghiên cứu.$tt_research_gain$"
 concept_physics_research: "Nghiên Cứu Vật Lý"
 concept_physics_research_desc: "Nghiên cứu Vật lý £physics£ §H$concept_physics_research$§! là một trong ba lĩnh vực nghiên cứu, tập hợp các công nghệ thuộc các lĩnh vực như §HTính Toán§!, §HThao Túng Lực Trường§!, và §HVật Lý Hạt§!. $concept_research_shared$"
 concept_society_research: "Nghiên Cứu Xã Hội"
 concept_society_research_desc: "Nghiên cứu Xã hội £society£ §H$concept_society_research$§! là một trong ba lĩnh vực nghiên cứu, tập hợp các công nghệ thuộc các lĩnh vực như §HSinh Học§!, §HThuật Trị Quốc§!, và §HThế Giới Mới§!. $concept_research_shared$"
 concept_engineering_research: "Nghiên Cứu Kỹ Thuật"
 concept_engineering_research_desc: "Nghiên cứu Kỹ thuật £engineering£ §H$concept_engineering_research$§! là một trong ba lĩnh vực nghiên cứu, tập hợp các công nghệ thuộc các lĩnh vực như §HCông Nghiệp§!, §HĐộng Lực Đẩy§!, và §HCông Nghệ Hư Không§!. $concept_research_shared$"
 concept_policies: "Chính Sách"
 concept_policy: "Chính Sách"
 concept_policies_desc: "Các chính sách §H$concept_policies$§! phác thảo lập trường của một đế chế ['concept_empire'] đối với các đế chế khác, cách đối xử với dân cư £pop£ ['concept_pops'], và những hành vi được chấp nhận.\n\n§H$concept_policies$§! được quản lý trong thẻ §H$government_view_tab_policies_and_edicts$§! của giao diện £interface£ ['concept_government_view']."
 concept_pop: "Dân Cư"
 concept_pops: "Dân Cư"
 concept_pop_desc: "Một đơn vị dân cư £pop£ §H$concept_pop$§! là một nhóm các cá thể thuộc cùng một loài ['concept_species'] làm cùng một công việc £job£ ['concept_job'] và chia sẻ cùng một tư tưởng ['concept_ethic'].$tt_gain$- Phát triển dân số sinh học £pop£ §HBiological Pops§! và lắp ráp dân số cơ khí £pop£ §HMechanical Pops§!\n- Mua dân cư §H$concept_pops$§! tại chợ nô lệ £market£ §HSlave Market§!\n- Nhận dân cư §H$concept_pops$§! từ một số sự kiện nhất định"
 concept_preftl_civilizations: "Văn Minh Tiền FTL"
 concept_preftl_civilizations_desc: "Văn Minh Tiền FTL là các xã hội chưa đạt được khả năng du hành vũ trụ nhanh hơn ánh sáng. Trình độ công nghệ của họ trải dài từ Thời kỳ Đồ đá đến Thời kỳ Đầu Không gian, và nhìn chung không hề hay biết về sự tồn tại của sự sống ngoài hành tinh."
 concept_presapient_species: "Chủng Tộc Tiền Trí Tuệ"
 concept_presapient_species_desc: "Chủng tộc tiền trí tuệ là những sinh vật cực kỳ thông minh nhưng còn thiếu một chút để đạt đến mức độ trí tuệ thực thụ. Với các công nghệ phù hợp từ lĩnh vực nghiên cứu xã hội ['concept_society_research', £society£ $concept_society_research$], họ có thể được khai hóa lên tầm trí tuệ hoặc được bảo tồn trong các Vườn Thú Ngoại Lai ['concept_alien_zoo',£building£ Vườn Thú Ngoại Lai]."
 concept_shape: "Hình Dạng"
 concept_galaxy_shape: "Hình Dạng Thiên Hà"
 concept_galaxy_shape_desc: "- §I$elliptical$:§! Một thiên hà hình tròn đơn giản với các ngôi sao phân bố đồng đều.\n- §I$ring$:§! Một thiên hà hình tròn với nhiều khoảng trống hơn quanh lõi thiên hà.\n- §I$spiral$:§! Các thiên hà này có từ hai đến sáu nhánh xoắn ốc uốn lượn ra ngoài từ lõi thiên hà.\n- §I$bar$:§! Thiên hà bị chia cắt thành hai nhánh xoắn ốc dày đặc, với rất ít điểm kết nối.\n- §I$starburst$:§! Nhiều nhánh song song xoay tít ra ngoài từ lõi thiên hà.\n- §I$cartwheel$:§! Nhiều nhánh mỏng tạo nên sự kết hợp giữa thiên hà xoắn ốc và thiên hà vòng.\n- §I$spoked$:§! Thiên hà này bị chia cắt thành các 'lát cắt' phần lớn tách biệt lẫn nhau."
 concept_ship: "Tàu"
 concept_ships: "Tàu"
 concept_ship_desc: "§H$concept_ships$§! là các phương tiện du hành không gian phục vụ nhiều vai trò khác nhau, từ thám hiểm đến chiến tranh, bao gồm cả ['concept_civilian_ships'] và ['concept_military_ships']."
 concept_civilian_ship: "Tàu Tiện Ích"
 concept_civilian_ships: "Tàu Tiện Ích"
 concept_civilian_ship_desc: "Tàu tiện ích §H$concept_civilian_ships$§! được đóng tại các trạm sao ['concept_starbases'] để lắp ráp các cấu trúc không gian, khám phá những điều chưa biết và định cư trên các thế giới mới.\n\nVí dụ bao gồm tàu xây dựng £construction_ship£ ['concept_construction_ships'], tàu nghiên cứu £science_ship£ ['concept_science_ships'], và tàu thuộc địa £colony_ship£ ['concept_colony_ships']."
 concept_military_ship: "Tàu Quân Sự"
 concept_military_ships: "Tàu Quân Sự"
 concept_military_ship_desc: "Tàu quân sự §H$concept_military_ships$§! được chế tạo tại các trạm sao ['concept_starbases'] để tham gia vào các trận chiến không gian chống lại các đế chế đối địch ['concept_empires'] và thú không gian hung hãn ['concept_space_fauna'].\n\nĐược tổ chức thành các hạm đội ['concept_fleets'], chúng có nhiều kích cỡ khác nhau, mỗi loại mang lại sức mạnh độc đáo và lợi thế chiến lược cho hạm đội §H$concept_fleet$§!.\n\n§H$concept_military_ships$§! được thiết kế trong thẻ §H$SHIP_DESIGNER$§! của giao diện £interface£ ['concept_fleet_management_view']."
 concept_fleet: "Hạm Đội"
 concept_fleets: "Các Hạm Đội"
 concept_fleet_desc: "Hạm đội §H$concept_fleets$§! là các nhóm tàu quân sự ['concept_military_ships'] hoạt động cùng nhau, với tổng kích thước của các tàu §H$concept_ships$§! tạo nên quy mô hạm đội ['concept_fleet_size'].\n\nMột hạm đội §H$concept_fleet$§! do một chỉ huy £commander£ ['concept_commander'] dẫn đầu có thể nhận được các phần thưởng hoặc hình phạt dựa trên các đặc trưng lãnh đạo ['concept_leader_traits'].\n\n§H$concept_fleets$§! được thiết kế trong thẻ §H$FLEET_MANAGER_VIEW$§! của giao diện £interface£ ['concept_fleet_management_view']."
 concept_fleet_size: "Quy Mô Hạm Đội"
 concept_fleet_size_desc: "Quy mô hạm đội §H$concept_fleet_size$§! là tổng kích thước của các tàu quân sự ['concept_military_ship'] trong một hạm đội ['concept_fleet'].\n\nTổng quy mô hạm đội §H$concept_fleet_size$§! có thể chỉ huy trên mỗi hạm đội §H$concept_fleet$§! được quyết định bởi giới hạn chỉ huy ['concept_command_limit'].\n\nTổng quy mô hạm đội §H$concept_fleet_size$§! của tất cả các hạm đội §H$concept_fleets$§! mà một đế chế ['concept_empire'] có thể hỗ trợ một cách hiệu quả được chi phối bởi sức chứa hạm đội ['concept_naval_capacity']."
 concept_command_limit: "Giới Hạn Chỉ Huy"
 concept_command_limit_desc: "Giới hạn chỉ huy §H$concept_command_limit$§! xác định tổng kích thước tối đa của các tàu quân sự ['concept_military_ship'] có thể điều khiển trong một hạm đội ['concept_fleet'] duy nhất.\n\nGiới hạn chỉ huy §H$concept_command_limit$§! có thể được gia tăng thông qua công nghệ ['concept_technologies'], một số truyền thống ['concept_traditions'] nhất định, hoặc quốc sách ['concept_civics']."
 concept_ship_upkeep: "Chi Phí Duy Trì Tàu"
 concept_logistics_upkeep: "Chi Phí Duy Trì Hậu Cần"
 concept_ship_upkeep_desc: "Chi phí duy trì tàu §H$concept_ship_upkeep$§! đại diện cho lượng tài nguyên liên tục cần thiết để duy trì hoạt động của các tàu vũ trụ, bao gồm cả tàu dân sự và quân sự.\n\nHầu hết các con tàu đều đòi hỏi sự kết hợp của nhiều loại tài nguyên để bảo trì, và chi phí được quyết định bởi cấp độ tàu cùng các thành phần được trang bị. Tuy nhiên, vượt quá sức chứa hạm đội ['concept_naval_capacity'] của đế chế sẽ làm tăng đáng kể chi phí duy trì trên tất cả các tàu."
 concept_colony_upkeep: "Chi Phí Duy Trì Thuộc Địa"
 concept_colony_upkeep_desc: "Chi phí duy trì thuộc địa §H$concept_colony_upkeep$§! đề cập đến lượng tài nguyên liên tục cần thiết để duy trì cơ sở hạ tầng và dân số của một thuộc địa £colony£ ['concept_colony']. Điều này bao gồm chi phí duy trì các khu vực £district£ ['concept_districts'], công trình £building£ ['concept_buildings'], và việc làm £job£ ['concept_jobs'], cũng như các nhu cầu hàng ngày của dân cư trên thuộc địa.\n\nQuản lý hiệu quả chi phí duy trì là điều thiết yếu để đảm bảo sự ổn định, ngăn ngừa tình trạng thiếu hụt và duy trì hiệu quả kinh tế trên toàn đế chế. Chi phí duy trì của một thuộc địa nhất định có thể được kiểm tra trong thẻ $colony_view_tab_planet_summary$ của giao diện £interface£ ['concept_colony_view']."
 concept_species: "Chủng Tộc"
 concept_species_desc: "Chủng tộc §H$concept_species$§! là các nhóm thực thể sinh học hoặc cơ khí riêng biệt có chung các đặc trưng chủng tộc ['concept_species_traits'], nguồn gốc, hoặc sự thích nghi về mặt thể chất.\n\nCác công nghệ tiên tiến ['concept_technologies'] hoặc chính sách cụ thể ['concept_policies'] có thể cho phép các đế chế biến đổi gen chủng tộc của mình để chuyên môn hóa hơn nữa hoặc biến đổi căn bản theo thời gian. Các chủng tộc của một đế chế được quản lý trong giao diện £interface£ ['concept_species_view']."
 concept_species_class: "Lớp Chủng Tộc"
 concept_species_class_desc: "Lớp Chủng Tộc mô tả một danh mục rộng lớn về loại §IChủng Tộc§!. Ví dụ bao gồm Điểu tộc (Avian), Bò sát tộc (Reptilian), Nấm tộc (Fungoid), v.v."
 concept_species_trait: "Đặc Trưng Chủng Tộc"
 concept_species_traits: "Các Đặc Trưng Chủng Tộc"
 concept_species_trait_desc: "Các đặc trưng chủng tộc §H$concept_species_traits$§! xác định các đặc tính sinh học hoặc cơ khí cố hữu của một chủng tộc ['concept_species'], ảnh hưởng đến hành vi, năng lực và sự phù hợp của họ đối với các môi trường và nhiệm vụ khác nhau.\n\nCác đặc trưng có thể được thay đổi thông qua biến đổi gen hoặc các công nghệ tiên tiến khác ['concept_technologies']."
 concept_starbase: "$station_generic_01$"
 concept_starbases: "$station_generic_01_plural$"
 concept_military_space_station: "Trạm Không Gian Quân Sự"
 concept_military_space_stations: "Các Trạm Không Gian Quân Sự"
 concept_starbase_desc: "Trạm sao §H$concept_starbases$§! là các cơ sở quân sự có thể nâng cấp, dùng để xác lập và bảo vệ quyền sở hữu các hệ sao.\n\nĐược nâng cấp từ tiền đồn ['concept_outposts'], chúng có thể được trang bị các mô-đun §HModules§! và công trình §HBuildings§! để chuyên môn hóa vào các vai trò khác nhau, chẳng hạn như với mô-đun xưởng đóng tàu ['concept_shipyard'] để đóng tàu ['concept_ships'].\n\nNền tảng phòng thủ ['concept_defense_platforms'] củng cố khả năng phòng thủ của chúng trước những kẻ tấn công. Chúng cũng đóng vai trò là các trung tâm để tuyển mộ lục quân ['concept_armies'].\n\nSố lượng trạm sao §H$concept_starbases$§! hoặc trạm chuyển tiếp £waystation£ §H$concept_waystations$§! được nâng cấp mà một đế chế có thể hỗ trợ bị giới hạn bởi sức chứa trạm sao ['concept_starbase_capacity'].\n\n§H$concept_starbases$§! được quản lý thông qua giao diện £interface£ ['concept_starbase_view']."
 concept_technology: "Công Nghệ"
 concept_technologies: "Các Công Nghệ"
 concept_technology_desc: "Công nghệ được mở khóa thông qua nghiên cứu là một trong những cách chủ yếu để gia tăng sức mạnh của một đế chế.\n\nChúng thuộc ba lĩnh vực nghiên cứu:\n$t$£physics£ ['concept_physics_research']\n$t$£society£ ['concept_society_research']\n$t$£engineering£ ['concept_engineering_research']"
 concept_tradition: "Truyền Thống"
 concept_traditions: "Các Truyền Thống"
 concept_traditions_desc: "Truyền thống §H$concept_traditions$§! mang lại các phần thưởng trên toàn đế chế được tổ chức thành các §HCây Truyền Thống§!.\n\nMột truyền thống §H$concept_tradition$§! có thể được lựa chọn bất cứ khi nào một đế chế ['concept_empire'] tích lũy đủ điểm đoàn kết £unity£ ['concept_unity']. Hoàn thành các §HCây Truyền Thống§! sẽ mở khóa các đặc quyền thăng hoa ['concept_ascension_perks'].\n\n§H$concept_traditions$§! được quản lý trong thẻ §H$traditions$§! của giao diện £interface£ ['concept_society_management_view']."
 concept_vivarium: "$vivarium$"
 concept_vivarium_desc: "Vườn sinh thái §Y$vivarium$§! cho phép chúng ta quan sát các loài §YThú Không Gian§! đang bị giam giữ. Các sinh vật bị giam giữ có thể được mổ xẻ để nghiên cứu và lấy tài nguyên, hoặc được cho phép lai tạo và sinh ra các sinh vật mới."
 concept_war_in_heaven: "Thiên Chiến"
 concept_war_in_heaven_desc: "Hai Đế Chế Sa Ngã ['concept_fallen_empires'] vốn là kẻ thù truyền kiếp từ thời cổ đại có thể thức tỉnh ['concept_awaken'] và giao chiến để tranh giành quyền bá chủ khắp dải ngân hà.$requires_leviathans$"
 concept_wormhole_pairs: "Cặp Lỗ Sâu"
 concept_wormhole: "Lỗ Sâu"
 concept_wormholes: "Các Lỗ Sâu"
 concept_wormholes_desc: "Lỗ sâu là các vết rách xuất hiện tự nhiên trong không thời gian. Sau khi được ổn định, chúng cho phép di chuyển tới một địa điểm cố định."
 concept_xeno_compatibility: "$ap_xeno_compatibility$"
 concept_xeno_compatibility_desc: "$allow_crossbreeding$\n\n§L$ap_xeno_compatibility_desc$§!"
 concept_cutholoids: "$cutholoids_plural$"
 concept_cutholoids_desc: "$cutholoid_desc$"
 concept_voidworms: "$voidworms_plural$"
 concept_voidworms_desc: "$voidworm_desc$"
 concept_influence: "Điểm Ảnh Hưởng"
 concept_influence_desc: "[GetConceptInfluence]"
 concept_influence_desc_shared: "Nó được sử dụng cho các hành động chiến lược, ví dụ như xây dựng tiền đồn ['concept_outposts'], xác lập yêu sách lãnh thổ ['concept_claims'], và duy trì các hiệp ước ngoại giao ['concept_diplomatic_pacts']. Sản lượng §H$concept_influence$§! thường khá ổn định, nhưng có thể được cải thiện.$tt_gain$- Tuyên bố các đế chế khác là kình địch ['concept_rivals']\n- Bổ sung sức mạnh khuếch trương ['concept_power_projection'] bằng cách duy trì quy mô hải quân ['concept_navy_size'] lớn so với quy mô đế chế £empire_sprawl£ ['concept_empire_size']"
 concept_influence_desc_regular: "Điểm ảnh hưởng £influence£ §H$concept_influence$§! đại diện cho sức nặng chính trị.\n\n$concept_influence_desc_shared$"
 concept_influence_desc_hive: "Điểm ảnh hưởng £influence£ §H$concept_influence$§! đại diện cho khả năng của Ý Thức Bầy Đàn ['authority:auth_hive_mind'] trong việc kiểm soát dải ngân hà rộng lớn.\n\n$concept_influence_desc_shared$"
 concept_influence_desc_machine: "Điểm ảnh hưởng £influence£ §H$concept_influence$§! đại diện cho khả năng của Trí Tuệ Máy Móc ['authority:auth_machine_intelligence'] sơ cấp trong việc chuyển hướng năng lực xử lý để nắm quyền kiểm soát trực tiếp lên toàn dải ngân hà.\n\n$concept_influence_desc_shared$"
 concept_outpost: "$starbase_outpost$"
 concept_outposts: "$starbase_outpost_plural$"
 concept_outpost_desc: "Tiền đồn §H$concept_outposts$§! là các trạm sao ['concept_starbases'] nhỏ được xây dựng để mở rộng biên giới của một đế chế ['concept_empire'] vào các hệ sao £system£ ['concept_systems'] chưa có chủ quyền.\n\nSố lượng tiền đồn §H$concept_outposts$§! không bị giới hạn bởi sức chứa trạm sao ['concept_starbase_capacity'] của đế chế.\n\nGiao diện £interface£ ['concept_starbase_view'] cung cấp phương thức để nâng cấp một tiền đồn §H$concept_outpost$§! thành một trạm sao §H$concept_starbase$§! có năng lực vượt trội hơn."
 concept_claim: "Yêu Sách Lãnh Thổ"
 concept_claims: "Các Yêu Sách Lãnh Thổ"
 concept_claim_desc: "Yêu sách lãnh thổ §H$concept_claims$§! đại diện cho sự khẳng định chủ quyền lãnh thổ đối với các hệ sao do nước ngoài kiểm soát. Yêu sách chủ yếu được sử dụng để hợp thức hóa các cuộc chiến tranh ['concept_wars'] xâm lược, cho phép một đế chế chiếm đoạt các hệ sao tranh chấp khi giành chiến thắng.\n\nYêu sách được thiết lập bằng cách tiêu tốn điểm ảnh hưởng £influence£ ['concept_influence'], với chi phí gia tăng dựa trên khoảng cách hệ sao, giá trị chiến lược và các yêu sách §H$concept_claims$§! hiện có của các đế chế khác. Việc lập yêu sách hệ sao sẽ đắt hơn trong một cuộc chiến tranh tấn công, vì vậy các đế chế khôn ngoan sẽ thực hiện điều đó từ trước.\n\nYêu sách được quản lý trong giao diện £interface£ ['concept_claims_view']."
 concept_research_agreement: "Hiệp Ước Nghiên Cứu"
 concept_research_agreements: "Các Hiệp Ước Nghiên Cứu"
 concept_research_agreement_desc: "Hiệp ước nghiên cứu §H$concept_research_agreements$§! là các điều ước ngoại giao cấp cho các đế chế tham gia những phần thưởng nghiên cứu £physics£ £society£ £engineering£ ['concept_research'] đối với các công nghệ ['concept_technologies'] mà đối tác đã sở hữu, khiến chúng đặc biệt có giá trị trong việc đẩy nhanh tiến bộ khoa học.\n\n§H$concept_research_agreements$§! có thể được thiết lập thông qua ngoại giao và thường được bao gồm trong các liên minh hợp tác rộng lớn hơn hoặc các thỏa thuận liên bang ['concept_federation']. Chúng được đề xuất trong thẻ $contacts_view_tab_contacts$ của giao diện £interface£ ['concept_contacts_view']."
 concept_rival: "Kình Địch"
 concept_rivals: "Các Kình Địch"
 concept_rival_desc: "Kình địch §H$concept_rivals$§! là những đối thủ chính trị và chiến lược được chỉ định chính thức. Tuyên bố một kình địch §H$concept_rival$§! sẽ gia tăng sản lượng điểm ảnh hưởng £influence£ ['concept_influence'] và có thể cải thiện quan hệ với các đế chế khác có chung sự thù địch. Tuy nhiên, nó cũng làm xấu đi quan hệ ngoại giao với kình địch và có thể làm leo thang căng thẳng thành xung đột công khai.\n\nKình địch chỉ có thể được tuyên bố chống lại các đế chế có sức mạnh tương đương và là công cụ then chốt để khẳng định vị thế thống trị, định hình các liên minh và hợp thức hóa các hành động thù địch. Chúng được tuyên bố trong thẻ $contacts_view_tab_contacts$ của giao diện £interface£ ['concept_contacts_view']."
 concept_power_projection: "Sức Mạnh Khuếch Trương"
 concept_power_projection_desc: "Sức mạnh khuếch trương §H$concept_power_projection$§! đo lường mức độ sức mạnh quân sự của một đế chế đóng góp vào vị thế chính trị của họ. Nó phản ánh quy mô và chi phí duy trì của các hạm đội ['concept_fleets'], đóng vai trò như một chỉ số hữu hình về trọng lượng chiến lược trên trường thiên hà.\n\nDuy trì một lực lượng hải quân gần bằng, hoặc vượt quá sức chứa hạm đội §H$concept_naval_capacity$§! của đế chế sẽ làm tăng sức mạnh khuếch trương, tăng cường sản lượng điểm ảnh hưởng £influence£ ['concept_influence']."
 concept_navy_size: "Quy Mô Hải Quân"
 concept_navy_size_desc: "Quy mô hải quân §H$concept_navy_size$§! đại diện cho tổng số lượng tàu quân sự ['concept_military_ships'] trong hạm đội của một đế chế. Mặc dù không có giới hạn tuyệt đối về quy mô của hải quân, việc vượt quá sức chứa hạm đội ['concept_naval_capacity'] của đế chế sẽ dẫn đến gia tăng chi phí duy trì tàu ['concept_ship_upkeep'].\n\nDuy trì một lực lượng hải quân cân bằng tốt là điều tối quan trọng để bảo vệ lãnh thổ sở hữu và khuếch trương sức mạnh khắp dải ngân hà."
 concept_empire_size: "Quy Mô Đế Chế"
 concept_empire_size_desc: "Quy mô đế chế £empire_sprawl£ §H$concept_empire_size$§! là thước đo diện tích lãnh thổ dưới dạng các khu vực £district£ ['concept_districts'], hệ sao £system£ ['concept_systems'], thuộc địa £colony£ ['concept_colonies'], và dân cư £pop£ ['concept_pops'] nằm dưới quyền kiểm soát.\n\nQuy mô đế chế §H$concept_empire_size$§! cao là gánh nặng đối với năng lực hành chính và làm tăng chi phí công nghệ ['concept_technologies'], truyền thống ['concept_traditions'], và sắc lệnh ['concept_edicts'].\n\nĐế chế ['concept_empire'] cũng trở nên dễ bị thâm nhập hơn cho các mục đích gián điệp."
 concept_unity: "Điểm Đoàn Kết"
 concept_unity_desc: "[GetConceptUnity]"
 concept_unity_desc_regular: "£unity£ §H$concept_unity$§! phản ánh quyết tâm tập thể và sức mạnh ý thức hệ của một xã hội. Nó hiện thân cho mục đích chung gắn kết muôn dân, định hướng cho các thể chế và sự cai trị.$concept_unity_desc_end$\n- Nâng cao ['concept_approval'] và ['concept_support'] của ['concept_factions']\n- Thông qua truyền thống ['tradition:tr_mercantile_adaptive_economic_policies'] thuộc nhánh ['tradition_category:tradition_mercantile'] và thay đổi ['concept_policy', $policy_trade_policy$]"
 concept_unity_desc_hive: "£unity£ §H$concept_unity$§! phản ánh quyết tâm và mục đích duy nhất của ['authority:auth_hive_mind']. Nó hiện thân cho ý chí tập thể dẫn dắt toàn bầy đàn, chỉ đạo các phân điểm và cá thể từ xa.$concept_unity_desc_end$"
 concept_unity_desc_machine: "£unity£ §H$concept_unity$§! phản ánh quyết tâm và sự đồng bộ xử lý của ['authority:auth_machine_intelligence']. Nó hiện thân cho mục đích toán tính dẫn dắt cỗ máy, chỉ đạo các phân điểm và drone từ xa.$concept_unity_desc_end$"
 concept_unity_desc_end: "\n\nNó rất thiết yếu cho các công việc nội bộ, ví dụ như mở khóa ['concept_traditions'] mới, chiêu mộ ['concept_leaders'], thăng hoa £colony£ ['concept_colonies'], ban hành ['concept_edicts'], và quản lý ['concept_resettlement'].$tt_gain$- Xây dựng £building£ ['concept_buildings'] có các £job£ ['concept_jobs'] sản xuất §H$concept_unity$§!"
 concept_leader: "Lãnh đạo"
 concept_leaders: "Lãnh đạo"
 concept_leader_desc: "§H$concept_leaders$§! có thể được bổ nhiệm làm ['concept_governors'], hoặc được giao chỉ huy ['concept_fleets'] và tiến hành ['concept_research'].\n\n§H$concept_leaders$§! nhận kinh nghiệm theo thời gian, nâng cao hiệu quả và mở khóa các ['concept_leader_traits'] mạnh mẽ. Tuy nhiên, họ cũng già đi và cuối cùng có thể sẽ nghỉ hưu hoặc tạ thế.\n\nLãnh đạo được tuyển mộ và bãi nhiệm trong màn hình £interface£ ['concept_leaders_view']."
 concept_leader_trait: "Đặc điểm Lãnh đạo"
 concept_leader_traits: "Đặc điểm Lãnh đạo"
 concept_leader_trait_desc: "§H$concept_leader_traits$§! là các thuộc tính đặc biệt xác định điểm mạnh, điểm yếu và lĩnh vực chuyên môn của ['concept_leader']. Các đặc điểm này ảnh hưởng đến hiệu quả của lãnh đạo trong vai trò tương ứng của họ, cung cấp điểm thưởng cho ['concept_research'], công việc làm ['concept_governor'], hoặc chỉ huy ['concept_fleets'].\n\nMột số đặc điểm chỉ phát huy tác dụng nếu lãnh đạo ngồi trong ['concept_council']. Một số đặc điểm mang tính tích cực, giúp nâng cao hiệu quả, trong khi những đặc điểm khác có thể làm giảm sút biểu hiện của họ, khiến việc tuyển chọn và bồi dưỡng lãnh đạo cẩn trọng trở thành khía cạnh sống còn trong việc quản lý đế chế."
 concept_leader_class: "Phân lớp Lãnh đạo"
 concept_leader_class_desc: "§H$concept_leader_class$§! quyết định vai trò của ['concept_leader']:\n\n- £official£ ['concept_official']\n- £commander£ ['concept_commander']\n- £scientist£ ['concept_scientist']"
 concept_official: "$official$"
 concept_officials: "$official_plural$"
 concept_official_desc: "£official£ §H$concept_officials$§! là các ['concept_leaders'] hành chính chịu trách nhiệm giám sát việc cai trị và thực thi chính sách trong đế chế. Họ đóng vai trò then chốt trong việc duy trì £stability£ ['concept_stability'], thực thi pháp luật và tối ưu hóa quản lý £colony£ ['concept_colony'] hoặc £sector£ ['concept_sector'] với tư cách là ['concept_governor']. Họ cũng có thể nỗ lực để nâng cao sự gắn kết trong một ['concept_federation'] liên sao.\n\nHiệu quả của §H$concept_officials$§! có thể bị ảnh hưởng bởi ['concept_leader_traits'] hoặc các yếu tố khác, khiến việc quản lý họ trở thành nhân tố quan trọng để duy trì một nền hành chính vận hành thông suốt."
 concept_commander: "$commander$"
 concept_commanders: "$commander_plural$"
 concept_commander_desc: "£commander£ §H$concept_commanders$§! là các ['concept_leaders'] quân sự chịu trách nhiệm chỉ huy ['concept_fleets'] và giám sát các chiến dịch hải quân. Họ đóng vai trò sống còn trong tác chiến không gian và hoạch định chiến lược.\n\nHiệu quả của §H$concept_commander$§! có thể bị ảnh hưởng bởi ['concept_leader_traits'] hoặc các yếu tố khác. Việc cắt cử và quản lý chỉ huy hợp lý có thể thúc đẩy đáng kể hiệu suất hạm đội cùng sức mạnh quân sự, đồng thời khi làm ['concept_governor'], họ cũng có thể tăng cường quản lý thuộc địa."
 concept_scientist: "$scientist$"
 concept_scientists: "$scientist_plural$"
 concept_scientist_desc: "£scientist£ §H$concept_scientists$§! là các ['concept_leaders'] chuyên tâm nghiên cứu, thúc đẩy tiến bộ khoa học, thám hiểm và đổi mới công nghệ trong đế chế. Họ dẫn dắt các nỗ lực ['concept_research'], chỉ huy £science_ship£ ['concept_science_ships'], và phân tích £anomaly£ ['concept_anomalies'] hoặc £archaeology£ ['concept_archaeology_site'] trên khắp thiên hà.\n\nHiệu quả của §H$concept_scientist$§! có thể bị ảnh hưởng bởi ['concept_leader_traits'], cấp độ kinh nghiệm và lĩnh vực chuyên môn. Phân công các nhà khoa học lành nghề thực hiện nhiệm vụ thám hiểm có thể đẩy nhanh tiến độ, và khi làm ['concept_governor'], họ cũng có thể nâng cao quản trị thuộc địa."
 concept_star: "Ngôi sao"
 concept_stars: "Ngôi sao"
 concept_star_desc: "Một §H$concept_star$§! là một thiên thể đồ sộ, thường ở thể khí, tọa lạc tại tâm của một £system£ ['concept_system'].\n\n§H$concept_star$§! có thể có các £planet£ ['concept_planets'] quay quanh hoặc các §HTiểu hành tinh§! có thể khai thác. Bất kỳ tài nguyên nào gắn liền với chính bản thân §H$concept_star$§! đều có thể được thu hoạch bằng cách xây dựng £mining_station£ ['concept_mining_station'] hoặc £science_ship£ ['concept_research_station']."
 concept_planet: "Hành tinh"
 concept_planets: "Hành tinh"
 concept_planet_desc: "Một £planet£ §H$concept_planet$§! là một thiên thể hình cầu lớn quay quanh một ['concept_star'], có thể có các §HMặt trăng§! quay quanh chính nó.\n\nCó chín loại ['concept_habitable_worlds'] cơ bản có thể biến thành £colony£ ['concept_colonies'].\n\nMột số §HHành tinh Không thể Cư trú§! có thể được đánh dấu là ứng viên cho ['concept_terraforming'], hoặc chứa các tài nguyên có thể thu hoạch bằng £mining_station£ ['concept_mining_station'] hoặc £science_ship£ ['concept_research_station']."
 concept_habitable_world: "Thế giới Có thể Cư trú"
 concept_habitable_worlds: "Thế giới Có thể Cư trú"
 concept_habitable_world_desc: "§H$concept_habitable_worlds$§! là các thiên thể có thể duy trì sự sống cho £pop£ ['concept_pops'] và được phát triển thành £colony£ ['concept_colonies']. Điều này bao gồm cả các £planet£ ['concept_planets'] xuất hiện tự nhiên, các ['concept_habitats'] nhân tạo, và §HThế giới Vành đai§!.\n\nCác §H$concept_planets$§! có thể cư trú tự nhiên có chín loại khí hậu cơ bản.\n\nMột số thế giới hiện không thể cư trú có thể trở nên định cư được thông qua ['concept_terraforming']."
 concept_sector: "Tinh vực"
 concept_sectors: "Tinh vực"
 concept_sector_desc: "§H$concept_sectors$§! là các khu vực hành chính trong một đế chế, nhóm nhiều £colony£ ['concept_colonies'] lại dưới một cơ cấu cai trị tập trung. Tinh vực giúp quản lý sự phát triển hành tinh, phân bổ tài nguyên và tự động hóa các nền kinh tế địa phương.\n\nMỗi tinh vực có thể được giám sát bởi một ['concept_governor'], người có kỹ năng và ['concept_leader_traits'] có thể ảnh hưởng đến hiệu quả quản lý. Quản lý tinh vực hiệu quả đảm bảo sự ổn định kinh tế và giảm bớt gánh nặng hành chính cho một đế chế đang phát triển."
 concept_resettlement: "Tái định cư"
 concept_resettlement_desc: "§H$concept_resettlement$§! là quá trình di dời £pop£ ['concept_pops'] từ một £colony£ ['concept_colony'] sang nơi khác, cho phép các đế chế tái phân bổ lực lượng lao động và quản lý sự gia tăng dân số hiệu quả hơn.\n\nĐiều này có thể được thực hiện thủ công hoặc thông qua các chính sách tự động di chuyển dân dựa trên nhà ở, độ sẵn có của việc làm, hoặc các tiêu chí khác như ['concept_habitability'].\n\nTái định cư tiêu tốn £energy£ ['concept_energy'] và có thể bị hạn chế bởi ['concept_ethics'], ['concept_policies'], ['concept_civics'] của đế chế, hoặc §HQuyền hạn Chủng tộc§!."
 concept_diplomatic_pact: "Hiệp ước Ngoại giao"
 concept_diplomatic_pacts: "Hiệp ước Ngoại giao"
 concept_diplomatic_pact_desc: "§H$concept_diplomatic_pacts$§! là các thỏa thuận chính thức giữa những đế chế nhằm định hình các mối quan hệ ngoại giao và tương tác chiến lược của họ. Ví dụ, các hiệp ước này có thể cam kết các bên ký kết phòng thủ lẫn nhau hoặc giúp đẩy nhanh tiến bộ công nghệ thông qua tri thức chia sẻ.\n\n§H$concept_diplomatic_pacts$§! có thể đóng vai trò như bước đệm tiến tới một liên minh mạnh hơn hoặc ['concept_federation'], nhưng việc phá vỡ chúng có thể làm tổn hại lòng tin và dẫn đến những hậu quả ngoại giao. Chúng được đề xuất trong tab $contacts_view_tab_contacts$ của £interface£ ['concept_contacts_view']."
 concept_research_station: "$research_station$"
 concept_research_stations: "$research_station_plural$"
 concept_research_station_desc: "Trạm nghiên cứu £science_ship£ §H$concept_research_station$§! là cơ sở trạm quỹ đạo thu thập £physics£ £society£ £engineering£ §HĐiểm Nghiên cứu§! từ các vị trí đáng chú ý trên khắp dải ngân hà.$tt_gain$- $tt_build_research_stations$"
 concept_system: "Hệ sao"
 concept_systems: "Hệ sao"
 concept_system_desc: "£system£ §H$concept_systems$§! được neo giữ bởi một thiên thể trung tâm có khối lượng lớn, thường là một ['concept_star'], quay quanh nó là £planet£ ['concept_planet'], ['concept_celestial_objects'], cùng các hiện tượng vũ trụ khác. Các hệ sao được khảo sát bởi £science_ship£ ['concept_science_ships'], và được kiểm soát bởi ['concept_outposts'].\n\nMột số hệ sao chứa các thế giới có thể cư trú thích hợp cho £colony£ ['concept_colonies'], trong khi các hệ khác có thể nắm giữ các điểm nghẽn chiến lược, mỏ tài nguyên giá trị, hoặc hiểm họa tiềm ẩn. Thiết lập quyền kiểm soát các hệ sao trọng yếu là điều thiết yếu cho việc mở rộng lãnh thổ, phòng thủ và phát triển kinh tế."
 concept_envoy: "Đặc sứ"
 concept_envoys: "Đặc sứ"
 concept_envoy_desc: "§HĐặc sứ§! đảm nhiệm ['concept_first_contact'] với người ngoài hành tinh chưa rõ, quản lý mạng lưới gián điệp, và tham gia ['concept_diplomacy'] với các ['concept_empires'] khác.$tt_gain$- Xây dựng £megastructure£ ['concept_megastructure'] §HĐại Hội Đồng Liên Sao§!\n- Sử dụng một số £building£ ['concept_buildings'], ['concept_leader_traits'], và ['concept_civics'] nhất định\n- Mở khóa đặc quyền ['concept_federation'] §H$extra_envoy_1$§!"
 concept_civic: "Quốc sách"
 concept_civics: "Quốc sách"
 concept_civic_desc: "§H$concept_civics$§! đại diện cho các nguyên tắc nền tảng và cơ cấu xã hội định hình một đế chế. Chúng mang lại các hiệu ứng cộng thêm độc đáo, định hình các chính sách nội bộ và ảnh hưởng đến các tương tác ngoại giao với những nền văn minh khác.\n\nQuốc sách có thể được sửa đổi thông qua cải cách chính phủ trong £interface£ ['concept_empire_view'], dù một số quốc sách bị hạn chế bởi ['concept_authority'] hoặc ['concept_ethics']."
 concept_starbase_capacity: "Dung lượng Trạm Không gian"
 concept_starbase_capacity_desc: "[GetConceptStarbaseCapacity]"
 concept_starbase_capacity_desc_settled: "§H$concept_starbase_capacity$§! hiển thị số lượng ['concept_starbases'] đã nâng cấp có thể được duy trì hiệu quả, không tính ['concept_outposts'].\n\nVượt quá §H$concept_starbase_capacity$§! sẽ làm tăng ['concept_starbase_upkeep'].$tt_gain$- Thu được thêm ['concept_owned_systems']\n- Sử dụng một số ['concept_technologies'] và ['concept_traditions'] nhất định"
 concept_starbase_capacity_desc_nomadic: "§H$concept_starbase_capacity$§! hiển thị số lượng £waystation£ ['concept_waystations'] mà một £nomad£ ['concept_nomadic_empire'] có thể duy trì hiệu quả.\n\nVượt quá §H$concept_starbase_capacity$§! sẽ làm tăng ['concept_starbase_upkeep'].$tt_gain$- Sử dụng một số ['concept_technologies'] và ['concept_traditions'] nhất định"
 concept_starbase_upkeep: "Phí bảo trì Trạm Không gian"
 concept_starbase_upkeep_desc: "§H$concept_starbase_upkeep$§! là chi phí liên tục cần thiết để duy trì các ['concept_starbases']. Chi phí bảo trì bao gồm £energy£ ['concept_energy'] và £alloys£ ['concept_alloys'], và sẽ tăng lên đáng kể nếu vượt quá ['concept_starbase_capacity']."
 concept_owned_system: "Hệ sao Sở hữu"
 concept_owned_systems: "Hệ sao Sở hữu"
 concept_owned_system_desc: "§H$concept_owned_systems$§! là các £system£ ['concept_systems'] nằm dưới quyền kiểm soát của một đế chế, thông qua bành trướng trực tiếp hoặc chinh phục. Quyền sở hữu cho phép một đế chế xây dựng các ['concept_starbases'], khai thác tài nguyên và thiết lập £colony£ ['concept_colonies'] trong hệ sao.\n\nDuy trì quyền kiểm soát các hệ sao sẽ làm tăng £empire_sprawl£ ['concept_empire_size'] của đế chế, với số lượng hệ sao sở hữu ảnh hưởng đến hiệu quả hành chính và chi phí quan liêu."
 concept_naval_capacity: "Dung lượng Hải quân"
 concept_naval_capacity_desc: "§H$concept_naval_capacity$§! hiển thị tổng ['concept_fleet_size'] có thể được duy trì một cách hiệu quả.\n\nVượt quá §H$concept_naval_capacity$§! sẽ làm tăng ['concept_ship_upkeep'].$tt_gain$- Xây dựng các mô-đun §HĐiểm neo§! trên ['concept_starbases']\n- Sử dụng một số £job£ ['concept_jobs'] nhất định, chẳng hạn từ £building£ ['building:building_stronghold']\n- Sử dụng một số ['concept_technologies'] và ['concept_traditions'] nhất định"
 concept_governor: "$governor$"
 concept_governors: "$governor_plural$"
 concept_governor_desc: "Một §H$concept_governor$§! là một ['concept_leader'] giám sát một £colony£ ['concept_colony'] hoặc £sector£ ['concept_sector']. Một §H$concept_leader$§! được phân công đến thủ phủ tinh vực cũng sẽ đóng vai trò là §H$concept_governor$§! của tinh vực.\n\n['concept_leader_class'] và ['concept_leader_traits'] của họ quyết định các điểm thưởng hoặc bất lợi được cung cấp.\n\n§H$concept_governors$§! được phân công trong màn hình £interface£ ['concept_colony_view'] hoặc £interface£ ['concept_planets_and_sector_view']."
 concept_decision: "Quyết sách"
 concept_decisions: "Quyết sách"
 concept_decision_desc: "Một §H$concept_decision$§! là một sắc lệnh có thể ban hành trên toàn thuộc địa để giải quyết các nhu cầu cụ thể của £colony£ ['concept_colony']. Nó có thể thêm £district£ ['concept_districts'], loại bỏ £blocker£ ['concept_blockers'], hoặc sửa đổi các thuộc tính của thuộc địa.\n\nMột số quyết sách đòi hỏi chi phí kích hoạt hoặc các điều kiện cụ thể để ban hành.\n\n§H$concept_decisions$§! được quản lý trong £interface£ ['concept_colony_view']."
 concept_planetary_ascension: "Thăng hoa Thuộc địa"
 concept_planetary_ascension_desc: "§HCấp bậc Thăng hoa Thuộc địa§! của một £colony£ ['concept_colony'] làm tăng hiệu quả của ['concept_designation'] và giảm tác động lên £empire_sprawl£ ['concept_empire_size'].\n\nThuộc địa có thể thăng hoa nhiều lần dựa trên số lượng ['concept_ascension_perks'] đã mở khóa, và tăng chi phí £unity£ ['concept_unity'] dựa trên tổng số §HCấp bậc Thăng hoa§! tích lũy trong ['concept_empire'].\n\nMở khóa tất cả §H$concept_ascension_perks$§! sẽ tăng §HGiới hạn Thăng hoa Thuộc địa§! thêm §G$COMPLETION_BONUS$§! cấp."
 concept_designation: "Định danh Thuộc địa"
 concept_designation_desc: "§H$concept_designation$§! của một £colony£ ['concept_colony'] quyết định vai trò chính của nó, ví dụ bằng cách tăng tốc độ xây dựng các phân khu nhất định hoặc sản lượng của các công việc cụ thể.\n\nNếu §H$concept_designation$§! không được thiết lập thủ công, nó sẽ tự động được chỉ định dựa trên các phân khu hoặc công trình hiện có."
 concept_planet_automation: "Tự động hóa Hành tinh"
 concept_planet_automation_desc: "§H$concept_planet_automation$§! cho phép £colony£ ['concept_colony'] được tự động phát triển dựa trên $COLONY_AUTOMATION_SETTINGS$ đã chọn."
 concept_devastation: "Mức độ Tàn phá"
 concept_devastation_desc: "§H$concept_devastation$§! là mức độ thiệt hại mà một £colony£ ['concept_colony'] phải gánh chịu, thường là do §HOanh tạc Quỹ đạo§!. Chịu quá nhiều §H$concept_devastation$§! sẽ ảnh hưởng tiêu cực đến nhiều mặt, ví dụ như £housing£ ['concept_housing'], £amenities£ ['concept_amenities'], và sản lượng £job£ ['concept_job'].\n\n§H$concept_devastation$§! giảm dần theo thời gian khi £colony£ §H$concept_colony$§! được tái thiết.\n\nMàn hình £interface£ ['concept_colony_view'] hiển thị mức độ §H$concept_devastation$§! hiện tại."
 concept_shipyard: "Xưởng đóng tàu"
 concept_shipyards: "Xưởng đóng tàu"
 concept_shipyard_desc: "Một §H$concept_shipyard$§! là một ['concept_starbase'] được trang bị mô-đun §H$concept_shipyard$§!, giúp nó có khả năng chế tạo cả ['concept_civilian_ships'] lẫn ['concept_military_ships'].\n\nViệc đóng tàu được quản lý trong £interface£ ['concept_starbase_view']."
 concept_anomaly: "Dị thường"
 concept_anomalies: "Dị thường"
 concept_anomaly_desc: "Dị thường £anomaly£ §H$concept_anomaly$§! là phát hiện bí ẩn do £science_ship£ ['concept_science_ships'] tìm thấy trong quá trình khảo sát £system£ ['concept_systems']. Điều tra một dị thường có thể mang lại phần thưởng hoặc phát hiện hiểm nguy.\n\n§H$concept_anomalies$§! được nghiên cứu bằng cách chỉ định một £scientist£ §H$concept_scientist$§! đến đó, với thời gian điều tra tùy thuộc vào cấp độ kỹ năng của họ và độ khó của §H$concept_anomaly$§!.\n\nChúng xuất hiện trên bản đồ £interface£ ['concept_galaxy_map'] khi chọn một §H$concept_science_ship$§!, và được liệt kê trong tab $situation_log_view_tab_situation_log$ của £interface£ ['concept_situation_log_view']."
 concept_archaeology_site: "Khu Khảo cổ"
 concept_archaeology_sites: "Khu Khảo cổ"
 concept_archaeology_site_desc: "£archaeology£ §H$concept_archaeology_site$§! là tàn tích của các nền văn minh cổ đại, xác tàu chiến trường, hoặc các địa điểm đáng quan tâm khác. Các tàu £science_ship£ ['concept_science_ships'] có người điều khiển có thể khai quật chúng để khám phá những bí mật bên trong."
 concept_empire: "Đế chế"
 concept_empires: "Đế chế"
 concept_empire_desc: "Một §H$concept_empire$§! là một thế lực ngân hà kiểm soát ít nhất một £system£ ['concept_system'] và thường tìm cách mở rộng ảnh hưởng của mình giữa các vì sao. Các ['concept_ethics'], ['concept_authority'], và ['concept_civics'] định hình chính sách và hành vi của họ.\n\nTương tác giữa các §H$concept_empires$§! diễn ra thông qua ngoại giao, thương mại hoặc xung đột.\n\nSự mở rộng của các §H$concept_empires$§! hiển thị trên £interface£ ['concept_galaxy_map'].\n\nCó thể liên hệ với họ thông qua cờ hiệu của họ hoặc tab $contacts_view_tab_contacts$ của £interface£ ['concept_contacts_view']."
 concept_defense_platform: "$military_station_small$"
 concept_defense_platforms: "$military_station_small_plural$"
 concept_defense_platform_desc: "§H$concept_defense_platforms$§! là các công trình vũ trụ sâu dùng để bảo vệ ['concept_starbases'], thường làm trì hoãn những kẻ tấn công cho đến khi một ['concept_fleet'] phòng thủ tới nơi.\n\nCác §H$concept_defense_platforms$§! lớn nhất là những kiến trúc đồ sộ, chứa hàng ngàn người và được trang bị hỏa lực tương đương cả một hạm đội. Chúng được thiết kế trong tab §H$SHIP_DESIGNER$§! của £interface£ ['concept_fleet_management_view']."
 concept_army: "Đội quân"
 concept_armies: "Đội quân"
 concept_army_desc: "§H$concept_armies$§! là lực lượng mặt đất được phân công để bảo vệ £colony£ ['concept_colonies'] hoặc xâm lược các £planet£ ['concept_planets'] của quân địch.\n\nMột §H$concept_army$§! dưới sự lãnh đạo của £commander£ ['concept_commander'] có thể nhận được hiệu ứng cộng thêm hoặc bất lợi tùy thuộc vào ['concept_leader_traits'] của họ.\n\n§H$concept_armies$§! được tập hợp trong tab §H$MACRO_BUILDER_TAB$§! của ['concept_starbases'] hoặc tab §H$GROUND_COMBAT_TAB$§! của §H$concept_colonies$§!."
 concept_component: "Linh kiện"
 concept_components: "Linh kiện"
 concept_component_desc: "§H$concept_components$§! là các hệ thống và mô-đun riêng lẻ quyết định năng lực của một ['concept_ship'], bao gồm vũ khí, phòng thủ, động cơ siêu không gian và các hệ thống phụ trợ.\n\nChúng được mở khóa bằng cách nghiên cứu các ['concept_technologies'] mới, và được trang bị trong tab §H$SHIP_DESIGNER$§! của £interface£ ['concept_fleet_management_view'].\n\nCác tàu £science_ship£ ['concept_science_ships'] sẽ tự động sử dụng §H$concept_components$§! tiên tiến nhất hiện có."
 concept_habitability: "Độ Thích Nghi"
 concept_habitability_desc: "§H$concept_habitability$§! đo lường mức độ một ['concept_species'] chịu đựng được môi trường của một £colony£ ['concept_colony'].\n\nDưới mức §G100%§!, $MOD_POP_AMENITIES_USAGE_MULT$ và $mod_planet_pops_upkeep_mult$ sẽ tăng, trong khi $MOD_POP_BONUS_WORKFORCE_MULT$ và $MOD_LOGISTIC_GROWTH_MULT$ sẽ giảm.\n\nĐộ Thích Nghi thông thường dao động từ §R0%§! đến §G100%§!, nhưng $MOD_HABITABILITY_FLOOR$, $MOD_HABITABILITY_CEIL$ và ['concept_adapted_habitability'] có thể thay đổi phạm vi này.$tt_gain$- Thuộc địa hóa hoặc ['concept_resettlement', tái định cư] đến một £colony£ ['concept_colony'] phù hợp với §HChủng Loài§!\n- ['concept_terraforming', Cải tạo] một £planet£ ['concept_planet'] sang lớp hành tinh khác\n- Nghiên cứu ['concept_technologies']\n- Thông qua ['concept_traditions']\n- Cải biến §HChủng Loài§!, thay đổi ['concept_species_traits'] hoặc §HĐặc Điểm Thích Nghi§! của chúng"
 concept_habitat: "Trạm Cư trú"
 concept_habitats: "Trạm Cư trú"
 concept_habitat_desc: "§H$concept_habitats$§! là các siêu kiến trúc sinh thái trong vũ trụ sâu.\n\nChúng được xây dựng như các ['concept_megastructures'] bằng £construction_ship£ ['concept_construction_ship'], sau đó có thể được biến thành £colony£ ['concept_colonies'].\n\nCác £district£ ['concept_districts'] khả dụng được quyết định bởi các §HMỏ Tài nguyên§! bên trong £system£ ['concept_system']."
 concept_housing: "Nhà ở"
 concept_housing_desc: "£housing£ §H$concept_housing$§! đại diện cho cơ sở hạ tầng đáp ứng nhu cầu chỗ ở cho dân số của một £colony£ ['concept_colony']. Thiếu hụt §H$concept_housing$§! sẽ gây bất lợi cho £stability£ ['concept_stability'] và có thể kích hoạt §HDi cư Đi xa§!.\n\nCó thể gia tăng §H$concept_housing$§! bằng cách xây dựng £district£ ['concept_districts'] và một số £building£ ['concept_buildings'] nhất định. §H$concept_housing$§! cao hơn cũng cải thiện ['concept_planet_capacity'], qua đó ảnh hưởng đến tỷ lệ tăng trưởng dân số sinh học.\n\nMột số £zone£ ['concept_district_specializations'] nhất định dành cho §H$district_city_plural$§! có thể làm giảm lượng §H$concept_housing$§! mà mỗi §H$district_city$§! cung cấp."
 concept_planet_size: "Quy mô Hành tinh"
 concept_planet_size_desc: "§H$concept_planet_size$§! quyết định số lượng £district£ ['concept_districts'] mà £colony£ ['concept_colony'] có thể hỗ trợ. Một hành tinh lớn có thể hỗ trợ nhiều £district£ ['concept_districts'] hơn, cho phép xây dựng và chuyên môn hóa để cung cấp các £job£ ['concept_jobs']."
 concept_planet_capacity: "Sức chứa Hành tinh"
 concept_planet_capacity_desc: "§H$concept_planet_capacity$§! được quyết định bởi £housing£ ['concept_housing'] cùng không gian bổ sung từ các £district£ ['concept_districts'] chưa phát triển, thay đổi tùy theo ['concept_habitability'] của £planet£ ['concept_planet']. Việc dọn dẹp £blocker£ ['concept_blockers'] có thể tăng thêm sức chứa.\n\n£pop£ §HDân số Sinh học§! tăng trưởng nhanh nhất ở mức sức chứa trung bình, hưởng lợi từ các điểm thưởng tăng trưởng, nhưng sẽ chịu bất lợi khi £colony£ ['concept_colony'] tiệm cận giới hạn của nó."
 concept_stability: "Độ Ổn định"
 concept_stability_desc: "£stability£ §H$concept_stability$§! phản ánh sự ổn định chính trị của một £colony£ ['concept_colony'], chịu ảnh hưởng chủ yếu từ £happiness£ ['concept_pop_approval_rating'] của dân cư nơi đó.\n\n§H$concept_stability$§! thấp có thể xuất phát từ các vấn đề như thiếu hụt £housing£ ['concept_housing'], thiếu thốn £amenities£ ['concept_amenities'], hoặc £crime£ ['concept_crime'] cao. Điều này gây ra các bất lợi và làm tăng nguy cơ xảy ra các sự kiện tiêu cực hoặc một cuộc §HKhởi nghĩa§!.\n\n§H$concept_stability$§! cao sẽ thúc đẩy sản lượng tài nguyên."
 concept_amenities: "Tiện nghi"
 concept_amenities_desc: "[GetConceptAmenities]"
 concept_amenities_desc_regular: "£amenities£ §H$concept_amenities$§! đại diện cho cơ sở hạ tầng và công việc đáp ứng các nhu cầu hàng ngày của dân cư.\n\nMột £colony£ ['concept_colony'] thiếu hụt §H$concept_amenities$§! sẽ phải chịu các bất lợi đối với £happiness£ ['concept_happiness']. Có thể tăng §H$concept_amenities$§! bằng cách phân bổ £pop£ ['concept_pops'] vào các £job£ ['concept_jobs'], chẳng hạn như £job_entertainer£ §H$job_entertainer_plural$§!."
 concept_amenities_desc_gestalt: "£amenities_no_happiness£ §H$concept_amenities$§! đại diện cho cơ sở hạ tầng và công việc đáp ứng nhu cầu cơ bản của dân cư drone.\n\nKhông đủ §H$concept_amenities$§! sẽ làm giảm £stability£ ['concept_stability']. Có thể tăng mức này bằng cách phân bổ £pop£ ['concept_pops'] vào các £job£ ['concept_jobs'], chẳng hạn như £job_maintenance_drone£ §H$job_maintenance_drone_plural$§!."
 concept_crime: "Tội phạm"
 concept_crime_desc: "£crime£ §H$concept_crime$§! phản ánh mức độ hoạt động tội phạm và tình trạng vô pháp của một £colony£ ['concept_colony'].\n\n§H$concept_crime$§! cao có thể kích hoạt các sự kiện tiêu cực và hạ thấp £stability£ ['concept_stability'].\n\n§H$concept_crime$§! chịu ảnh hưởng khi quy mô dân số lớn. Có thể giảm bớt mức này bằng cách tăng £happiness£ ['concept_happiness'] hoặc phân bổ £pop£ ['concept_pops'] vào các £job£ ['concept_jobs'], chẳng hạn như £job_enforcer£ §H$job_enforcer_plural$§!."
 concept_happiness: "Hạnh phúc"
 concept_happiness_desc: "£happiness£ §H$concept_happiness$§! là thước đo mức độ hài lòng chung của £pop£ ['concept_pops'], chịu ảnh hưởng bởi các yếu tố như ['concept_living_standards'], ['concept_edicts'], và nhiều ['concept_planet_modifiers'] khác nhau.\n\n§H$concept_happiness$§! cao sẽ làm tăng £stability£ ['concept_stability'], từ đó gia tăng sản lượng của £job£ ['concept_job'], trong khi §H$concept_happiness$§! thấp làm giảm §H$concept_stability$§!.\n\nKết hợp với £political_power£ ['concept_political_power'], §H$concept_happiness$§! quyết định £happiness£ ['concept_pop_approval_rating'].\n\nCác §H$concept_pops$§! thiếu vắng §H$concept_happiness$§! được tính là luôn có mức §H$concept_happiness$§! ổn định ở §Y50%§!."
 concept_pop_approval_rating: "Tỷ lệ Tán thành của Dân cư"
 concept_pop_approval_rating_desc: "£happiness£ §H$concept_pop_approval_rating$§! đại diện cho £happiness£ ['concept_happiness'] trung bình của tất cả £pop£ ['concept_pops'] trong một £colony£ ['concept_colony'], được tính theo trọng số £political_power£ ['concept_political_power'] của họ.\n\nCác §H$concept_pops$§! có §H$concept_political_power$§! lớn hơn, chẳng hạn như £pop_cat_ruler£ §H$pop_cat_ruler_plural$§! dưới hầu hết các mức sống, sẽ có ảnh hưởng mạnh mẽ hơn đến chỉ số này.\n\n§H$concept_pop_approval_rating$§! thấp làm giảm £stability£ ['concept_stability'] và có thể dẫn đến việc gia tăng £crime£ ['concept_crime']."
 concept_political_power: "Quyền lực Chính trị"
 concept_political_power_desc: "£political_power£ §H$concept_political_power$§! đại diện cho tầm ảnh hưởng mà từng £pop£ ['concept_pops'] tạo ra trong đế chế. §H$concept_political_power$§! của một dân cư có thể biến đổi dựa trên tầng lớp xã hội và £job£ ['concept_job'] của họ.\n\n§H$concept_political_power$§! cao hơn sẽ mang lại trọng số lớn hơn đối với tầm ảnh hưởng của ['concept_faction'] và kết quả ['concept_democratic_election'], khiến một số nhóm dân cư nhất định có tác động mạnh mẽ hơn trong việc định hình chính sách. Các đế chế Chuyên chế thường tập trung quyền lực chính trị vào giới tinh hoa cai trị, trong khi các xã hội Dân chủ và Bình đẳng phân bổ quyền lực đồng đều hơn cho toàn thể dân cư."
 concept_terraforming: "Cải tạo Môi trường"
 concept_terraforming_desc: "§H$concept_terraforming$§! là quá trình biến đổi một £planet£ ['concept_planet'] trong biên giới của một ['concept_empire'] để trở nên dễ sinh sống hơn.\n\nViệc này thường đòi hỏi các ['concept_technologies'] chuyên biệt và sự đầu tư đáng kể về £energy£ ['concept_energy'].\n\nVới các §H$concept_technologies$§! tiên tiến, ngay cả các hành tinh đã có cư dân sinh sống cũng có thể được cải tạo để phù hợp hơn với khí hậu ưa thích của ['concept_species'] đang cư trú tại đó."
 concept_space_fauna: "Quần thể Sinh vật Vũ trụ"
 concept_space_fauna_desc: "§H$concept_space_fauna$§! là các sinh vật và thực thể không thuộc đế chế nào được bắt gặp trong không gian.\n\nMột số loài khá ôn hòa trừ khi bị khiêu khích, trong khi những loài khác bản tính vốn dĩ thù địch."
 concept_blocker: "Chướng ngại Tự nhiên"
 concept_blockers: "Chướng ngại Tự nhiên"
 concept_blocker_desc: "Một £blocker£ §H$concept_blocker$§! là một đặc tính hành tinh cản trở các đặc tính khác hoặc ngăn cản một số £district£ ['concept_districts'] nhất định được xây dựng trên một £colony£ ['concept_colony'].\n\nMột số §H$concept_blockers$§! có thể được dọn dẹp với chi phí tài nguyên, thường đòi hỏi các ['concept_technologies'] cụ thể. Chúng được quản lý trong £interface£ ['concept_colony_view']."
 concept_event_chain: "Chuỗi Sự kiện"
 concept_event_chains: "Chuỗi Sự kiện"
 concept_event_chain_desc: "§H$concept_event_chains$§! là các chuỗi sự kiện liên kết với nhau diễn ra theo thời gian, thường được kích hoạt bởi việc thám hiểm, £anomaly£ ['concept_anomalies'], hoặc quyết định của đế chế.\n\nChuỗi sự kiện có thể liên quan đến các phát hiện khoa học, âm mưu chính trị hoặc những bí ẩn của thiên hà, đôi khi đem lại các phần thưởng mạnh mẽ hoặc hiểm họa khôn lường. Quyết định cẩn trọng là điều thiết yếu, vì các lựa chọn riêng rẽ có thể mang lại tác động lâu dài đến tương lai của đế chế. Các chuỗi sự kiện được liệt kê trong tab $situation_log_view_tab_situation_log$ của £interface£ ['concept_situation_log_view']."
 concept_situation: "Cục diện"
 concept_situations: "Cục diện"
 concept_situation_desc: "§H$concept_situations$§! là các hoàn cảnh đa giai đoạn nảy sinh mà các đế chế có thể gặp phải.\n\nBằng cách áp dụng nhiều cách tiếp cận khác nhau, chúng ta có thể điều hướng chúng để thu được các phần thưởng to lớn hoặc chỉ đơn giản là xoa dịu thảm họa. §HCục diện§! được liệt kê trong tab $situation_log_view_tab_situation_log$ của £interface£ ['concept_situation_log_view']."
 concept_special_project: "Dự án Đặc biệt"
 concept_special_projects: "Dự án Đặc biệt"
 concept_special_project_desc: "§H$concept_special_projects$§! là các sáng kiến ['concept_research'] độc đáo đòi hỏi nỗ lực chuyên tâm để hoàn thành, tạm thời đình chỉ tiến độ trong một lĩnh vực khoa học nhất định.\n\nHoàn thành §H$concept_special_projects$§! có thể mang lại những lợi ích mạnh mẽ, biến chúng thành một thành phần then chốt của quá trình thám hiểm và mở rộng lãnh thổ."
 concept_milestone: "Cột mốc"
 concept_milestones: "Cột mốc"
 concept_milestone_desc: "§H$concept_milestones$§! là các sự kiện và thành tựu quan trọng đánh dấu những thời khắc then chốt trên hành trình của đế chế, cung cấp một biên niên sử về sự mở rộng, những phát hiện và các cuộc xung đột.\n\nTheo dõi §H$concept_milestones$§! mang lại cái nhìn sâu sắc về sự phát triển và các quyết sách chiến lược của đế chế. Chúng có thể xem được tại mục §HDòng thời gian§! trong tab $situation_log_view_tab_timeline$ của £interface£ ['concept_situation_log_view']."
 concept_empire_focus: "Trọng tâm Đế chế"
 concept_empire_focuses: "Trọng tâm Đế chế"
 concept_empire_focus_desc: "§H$concept_empire_focuses$§! đại diện cho các ưu tiên chiến lược cấp cao định hướng cho sự phát triển và việc ra quyết định của một đế chế.\n\nCác đế chế có thể theo đuổi những trọng tâm khác nhau, chẳng hạn như §HThám hiểm§! để tiến bộ khoa học và khám phá, §HChinh phục§! để thống trị quân sự, và §HPhát triển§! để tăng trưởng kinh tế cùng ngoại giao. Hoàn thành các §HNhiệm vụ Trọng tâm§! sẽ thúc đẩy Trọng tâm tương ứng và mang đến các ['concept_technologies'] đảm bảo mới.\n\nCác nhiệm vụ và Trọng tâm có thể xem được trong tab $situation_log_view_tab_timeline$ của £interface£ ['concept_situation_log_view']."
 concept_scoreboard: "Bảng điểm"
 concept_scoreboard_desc: "§H$concept_scoreboard$§! mang lại thước đo khái quát về vị thế của một đế chế trong ván cờ vĩ đại của muôn vì sao, phản ánh những thành tựu đạt được trên khắp các phương diện khoa học, kinh tế, sức mạnh quân sự và ảnh hưởng ngoại giao.\n\nDù không mang tính tuyệt đối, nó đóng vai trò như cuốn sổ cái ghi lại tham vọng liên sao, một góc nhìn thoáng qua để biết ai đang phồn vinh, ai đang kiên cường vững bước, và ai chỉ đang gắng gượng sinh tồn. Nơi hành lang quyền lực tĩnh lặng, những cuộc so kè như vậy không bao giờ là vô hại."
 concept_living_standard: "Mức sống"
 concept_living_standards: "Mức sống"
 concept_living_standard_desc: "§H$concept_living_standards$§! quyết định chất lượng cuộc sống dành cho các £pop£ ['concept_pops'] khác nhau trong một đế chế, ảnh hưởng đến £happiness£ ['concept_happiness'] và £political_power£ ['concept_political_power'] tổng thể của họ. §H$concept_living_standards$§! được quyết định bởi các ['concept_policies'] của chính phủ và có thể khác nhau tùy theo phân loại ['concept_species'], ['concept_ethics'], và các ưu tiên kinh tế.\n\nMức sống cao hơn đòi hỏi đầu tư nhiều tài nguyên hơn, trong khi mức sống thấp hơn giúp giảm chi phí bảo trì nhưng phải đánh đổi bằng £stability£ ['concept_stability'] và sự hài lòng của người lao động. Chúng có thể được thiết lập trong £interface£ ['concept_species_view']."
 concept_celestial_object: "Thiên thể"
 concept_celestial_objects: "Thiên thể"
 concept_celestial_object_desc: "§H$concept_celestial_objects$§! là các thể khối lớn bên trong £system£ ['concept_systems'], bao gồm £star£ ['concept_stars'], £planet£ ['concept_planets'], §HMặt trăng§!, và §HTiểu hành tinh§!."
 concept_city_district: "$district_city$"
 concept_city_districts: "$district_city_plural$"
 concept_city_district_desc: "- £housing£ ['concept_housing']: §G+500§!\n- Ô £building£ ['concept_building']: §G+1§!\n- Việc làm £mod_job_clerk_add£ ['concept_clerk']: §G+100§!\n\n§L$district_city_desc$§!"
 concept_hive_district: "$district_hive$"
 concept_hive_districts: "$district_hive_plural$"
 concept_hive_district_desc: "- £housing£ ['concept_housing']: §G+600§!\n- Ô £building£ ['concept_building']: §G+1§!\n- Việc làm [maintenance_drone.GetName]: §G+300§!\n\n§L$district_hive_desc$§!"
 concept_nexus_district: "$district_nexus$"
 concept_nexus_districts: "$district_nexus_plural$"
 concept_nexus_district_desc: "- £housing£ ['concept_housing']: §G+500§!\n- Ô £building£ ['concept_building']: §G+1§!\n- Việc làm [maintenance_drone.GetName]: §G+300§!\n\n§L$district_nexus_desc$§!"
 concept_industrial_district: "$district_industrial$"
 concept_industrial_districts: "$district_industrial_plural$"
 concept_industrial_district_desc: "- £housing£ ['concept_housing']: §G+200§!\n- Việc làm £mod_job_artisan_add£ ['concept_artisan']: §G+100§!\n- Việc làm £mod_job_foundry_add£ ['concept_metallurgist']: §G+100§!\n\n§L$district_industrial_desc$§!"
 concept_generator_district: "$district_generator$"
 concept_generator_districts: "$district_generator_plural$"
 concept_generator_district_desc: "- £housing£ ['concept_housing']: §G+200§!\n- Việc làm £mod_job_technician_add£ ['concept_technicians']: §G+200§!\n\n§L$district_generator_desc$§!"
 concept_mining_district: "$district_mining$"
 concept_mining_districts: "$district_mining_plural$"
 concept_mining_district_desc: "- £housing£ ['concept_housing']: §G+200§!\n- Việc làm £mod_job_miner_add£ ['concept_miner']: §G+200§!\n\n§L$district_mining_desc$§!"
 concept_farming_district: "$district_farming$"
 concept_farming_districts: "$district_farming_plural$"
 concept_farming_district_desc: "- £housing£ ['concept_housing']: §G+200§!\n- Việc làm £mod_job_farmer_add£ ['concept_farmer']: §G+200§!\n\n§L$district_farming_desc$§!"
 concept_debris: "Mảnh vụn Tàn tích"
 concept_debris_desc: "Những mảnh vỡ trôi dạt và vỏ tàu vỡ nát, tàn dư tĩnh lặng của các cuộc xung đột ngoài vũ trụ, §H$concept_debris$§! sót lại sau các trận hải chiến không gian được theo dõi dưới dạng ['concept_special_project'] có thời hạn.\n\nPhân công một tàu £science_ship£ ['concept_science_ship'] đến điều tra §H$concept_debris$§! có thể mang lại những hiểu biết sâu sắc về các ['concept_technologies'] mới."
 concept_council: "Hội đồng"
 concept_council_desc: "§H$concept_council$§! đại diện cho ban lãnh đạo của ['concept_empire'], bao gồm §HNgười cai trị§! và tối đa năm §HThành viên Hội đồng§! bổ sung. Mỗi vị trí hội đồng có thể được đảm nhiệm bởi một ['concept_leader'], với một số ['concept_leader_traits'] mang lại hiệu ứng cộng thêm trên toàn đế chế.\n\n§H$concept_council$§! cũng chịu trách nhiệm ban hành các ['concept_agendas'].\n\nViệc quản lý và bổ nhiệm hội đồng được thực hiện trong tab §HHội đồng§! của £interface£ ['concept_government_view']."
 concept_agenda: "Nghị trình"
 concept_agendas: "Nghị trình"
 concept_agenda_desc: "Một §H$concept_agenda$§! đại diện cho trọng tâm chiến lược hiện tại của ['concept_council'], định hình các ưu tiên và mục tiêu dài hạn của đế chế. Nghị trình đem lại một số lợi ích trong giai đoạn chuẩn bị, và cung cấp các hiệu ứng thưởng mạnh mẽ hơn khi được triển khai.\n\nCác §H$concept_agendas$§! khả dụng cùng hiệu lực của chúng thay đổi tùy thuộc vào ['concept_authority'] cầm quyền, các ['concept_traditions'] đã tiếp nhận, và nhiều yếu tố khác.\n\n§H$concept_agendas$§! được quản lý trong tab §HHội đồng§! của £interface£ ['concept_government_view']."
 concept_research: "Nghiên cứu"
 concept_research_desc: "£research£ §H$concept_research$§! là quá trình nâng cao tri thức khoa học trên ba lĩnh vực chính: £physics£ ['concept_physics_research'], £society£ ['concept_society_research'], và £engineering£ ['concept_engineering_research']. Mỗi lĩnh vực phát triển độc lập, tạo ra các ['concept_technologies'] mới.\n\nTốc độ nghiên cứu có thể bị ảnh hưởng bởi các điều kiện trên toàn đế chế, ['concept_leader_traits'], hoặc các yếu tố bên ngoài như ['concept_diplomatic_pacts', $concept_research_agreements$]."
 concept_research_tooltip: "$concept_research_desc$\n\n§GNhấp vào ['concept_research'] để mở Kho dữ liệu\nNhấp vào £research£ trong menu để mở rộng danh sách và mở ['concept_technology_view']§!"
 concept_modifier: "Hiệu ứng Sửa đổi"
 concept_modifiers: "Hiệu ứng Sửa đổi"
 concept_empire_modifier: "Hiệu ứng Sửa đổi Đế chế"
 concept_empire_modifiers: "Hiệu ứng Sửa đổi Đế chế"
 concept_planet_modifier: "Hiệu ứng Sửa đổi Hành tinh"
 concept_planet_modifiers: "Hiệu ứng Sửa đổi Hành tinh"
 concept_modifier_desc: "§H$concept_modifiers$§! là các điểm thưởng hoặc bất lợi thường xuất phát từ những quyết định được đưa ra trong £anomaly£ ['concept_anomalies'] hoặc ['concept_event_chains'].\n\nChúng có thể mang tính tạm thời hoặc vĩnh viễn và có thể áp dụng cho toàn bộ đế chế hoặc một phần cụ thể như một hành tinh.\n\n§H$concept_modifiers$§! tác động lên toàn bộ đế chế được hiển thị trong §H$empire_view_tab_empire$§! của £interface£ ['concept_empire_view'], trong khi những hiệu ứng riêng cho từng hành tinh xuất hiện trong £interface£ ['concept_colony_view']."
 concept_diplomacy: "Ngoại giao"
 concept_diplomacy_desc: "§H$concept_diplomacy$§! chi phối cách thức các đế chế tương tác với nhau, bao hàm mọi thứ từ các hiệp định thương mại và liên minh cho đến ['concept_rivals'] và ['concept_wars']. Các hành động ngoại giao chịu ảnh hưởng bởi các yếu tố như ['concept_ethics'], ['concept_authorities'], sức mạnh tương quan và lợi ích chung.\n\nCác đế chế có thể cải thiện mối quan hệ thông qua ['concept_envoys'], thiết lập ['concept_diplomatic_pacts'], hoặc tham gia chính trị thiên hà thông qua ['concept_federation'] và ['concept_galactic_community']."
 concept_subject_agreement: "Thỏa ước Chư hầu"
 concept_subject_agreements: "Thỏa ước Chư hầu"
 concept_subject_agreement_desc: "§H$concept_subject_agreements$§! xác định các điều khoản phụ thuộc giữa một tông chủ và chư hầu của họ, ấn định mức độ tự trị, đóng góp tài nguyên và nghĩa vụ quân sự. Các thỏa ước này có thể được tùy chỉnh để tạo ra mọi hình thái từ các chư hầu bị kiểm soát chặt chẽ cho đến các đồng minh bán độc lập.\n\n§H$concept_subject_agreements$§! có thể được đàm phán trong tab $contacts_view_tab_agreements$ của £interface£ ['concept_contacts_view']."
 concept_subject: "Chư hầu"
 concept_subjects: "Chư hầu"
 concept_subject_desc: "§H$concept_subjects$§! là các đế chế chư hầu nằm dưới quyền uy của một đế chế tông chủ. Dù các chư hầu vẫn duy trì chính phủ và hạm đội riêng của họ, hành động của họ bị hạn chế bởi ['concept_subject_agreement'] đã thống nhất với tông chủ."
 concept_relic: "Thánh tích"
 concept_relics: "Thánh tích"
 concept_relic_desc: "§H$concept_relics$§! là các thánh vật quyền năng từ những nền văn minh cổ đại, mang lại lợi ích độc nhất cho người sở hữu chúng.\n\nChúng có thể được phát hiện tại các địa điểm £archaeology£ ['concept_archaeology_site'], thu được bằng cách hoàn thành các ['concept_event_chains'] trọng đại, hoặc chiếm giữ từ các đế chế bại trận vốn đang sở hữu chúng.\n\n§H$concept_relics$§! mang lại các hiệu ứng bị động liên tục, và có thể được kích hoạt để tạo ra hiệu ứng mạnh mẽ hơn trong thời gian giới hạn. Chúng có thể được quản lý trong tab $discoveries_view_tab_relics$ của £interface£ ['concept_discoveries_view']."
 concept_astral_action: "Hành động Tinh giới"
 concept_astral_actions: "Hành động Tinh giới"
 concept_astral_action_desc: "§H$concept_astral_actions$§! là các năng lực chuyên biệt cho phép các đế chế tương tác với kết cấu không gian theo những phương thức độc đáo, thường là khai thác các hiện tượng tinh giới để tạo ưu thế chiến lược.\n\n§H$concept_astral_actions$§! thường được mở khóa thông qua việc thám hiểm các ['concept_astral_rifts']."
 concept_minor_artifact: "Cổ vật Thứ cấp"
 concept_minor_artifacts: "Cổ vật Thứ cấp"
 concept_minor_artifact_desc: "§H$concept_minor_artifacts$§! là những tàn tích của các nền văn minh cổ đại, thường được thu hồi thông qua các cuộc khai quật £archaeology£ ['concept_archaeology_site']. Dù về từng đơn vị không uy lực bằng §H$concept_relics$§!, chúng có thể được sử dụng theo nhiều cách, chẳng hạn như kích hoạt các điểm thưởng độc đáo cho đế chế hoặc trao đổi lấy các tài nguyên giá trị.\n\nCông năng của cổ vật thứ cấp tùy thuộc vào tiến bộ công nghệ và chính sách của đế chế, với một số con đường cho phép tái sử dụng chúng để làm giàu văn hóa, đột phá khoa học, hoặc thậm chí là ứng dụng quân sự. Chúng được quản lý trong £interface£ ['concept_discoveries_view']."
 concept_crisis: "Hiểm họa Khủng hoảng"
 concept_crisis_desc: "Một §H$concept_crisis$§! đánh dấu sự trỗi dậy của một đế chế trở thành hiểm họa có quy mô vô tiền khoáng hậu, một thế lực mang tính sinh tồn được tiếp sức bởi sức mạnh cấm kỵ và công nghệ tận thế.\n\nNhững kẻ bước đi trên con đường này sẽ chuốc lấy sự phản kháng đồng lòng của toàn dải ngân hà, bởi hành trình của họ là một con đường dẫn đến sự thanh trừng tất yếu."
 concept_overlord_holding: "Lãnh địa Tông chủ"
 concept_overlord_holdings: "Lãnh địa Tông chủ"
 concept_overlord_holding_desc: "§H$concept_overlord_holdings$§! là các cơ sở chuyên biệt do đế chế tông chủ thiết lập trên thế giới của chư hầu. Những công trình này cho phép phóng chiếu ảnh hưởng, khai thác tài nguyên hoặc cung cấp dịch vụ, mỗi loại đều củng cố quyền uy của tông chủ theo các cách thức khác nhau.\n\nLoại hình và số lượng §H$concept_overlord_holdings$§! được ấn định bởi các điều khoản của ['concept_subject_agreement'], và hiệu lực của chúng biến đổi tùy thuộc vào ['concept_civics'], ['concept_ethics'], cùng ưu tiên chiến lược của tông chủ. Tuy mang lại lợi ích cho tông chủ, các lãnh địa này có thể khuấy động sự phẫn uất trong lòng chư hầu, đặc biệt là khi bị coi là bóc lột hoặc can thiệp quá sâu."
 concept_branch_office: "$BRANCH_OFFICE$"
 concept_branch_offices: "$BRANCH_OFFICES$"
 concept_branch_office_desc: "§H$BRANCH_OFFICES$§! cung cấp một tỷ lệ phần trăm £trade_value£ ['concept_trade'] của thế giới mục tiêu dưới dạng £energy£ ['concept_energy'] cho chủ sở hữu Doanh nghiệp vũ trụ.\n\nCó thể xây dựng tối đa §Y4§! công trình chi nhánh trong £interface£ ['concept_colony_view'] của thế giới mục tiêu, với các ô bổ sung được mở khóa thông qua nâng cấp thủ phủ."
 concept_war: "Chiến tranh"
 concept_wars: "Chiến tranh"
 concept_subjugation_war: "Chiến tranh Chinh phạt Thần phục"
 concept_total_war: "Chiến tranh Tổng lực"
 concept_war_desc: "§H$concept_war$§! là trạng thái xung đột vũ trang chính thức giữa các đế chế, được tiến hành để theo đuổi các mục tiêu cụ thể, dù là để thực thi ['concept_claims'], giải quyết bất đồng, hay tái định hình trật tự ngân hà. Chiến tranh được biện minh bằng một lý do §HCasus Belli§!, điều này quyết định mục đích cùng kết quả khả dĩ của nó.\n\nChiến tranh khép lại thông qua việc đầu hàng, khi một bên chấp nhận các điều khoản của đối phương, hoặc thông qua ['concept_peace'] theo nguyên trạng §HStatus Quo§!, trong đó các lợi ích thu được chỉ giới hạn ở các hệ sao bị chiếm đóng tại thời điểm ký kết thỏa thuận. Khi xung đột kéo dài, §HĐộ Kiệt quệ vì Chiến tranh§! sẽ tích lũy, gia tăng áp lực chấm dứt chiến sự. Dù tốn kém, chiến tranh vẫn là công cụ mang tính quyết định để định đoạt số phận của các đế chế."
 concept_peace: "Hòa bình"
 concept_peace_desc: "§H$concept_peace$§! là sự đình chỉ chiến sự chính thức giữa các đế chế, thường dẫn đến việc thực thi các mục tiêu chiến tranh, trao đổi lãnh thổ, hoặc áp đặt các dàn xếp chính trị mới. Hòa bình có thể được áp đặt thông qua việc đầu hàng hoặc nảy sinh từ sự kiệt quệ của cả hai bên.\n\nCác điều khoản hòa bình định hình trật tự thời hậu chiến, xác lập biên giới, biến các đế chế thành chư hầu, hoặc gieo mầm cho những cuộc xung đột tương lai."
 concept_galactic_community: "Cộng đồng Thiên hà"
 concept_galactic_community_desc: "§H$concept_galactic_community$§! là một cơ quan lập pháp toàn thiên hà được thành lập bởi các đế chế thành viên nhằm thúc đẩy hợp tác, thiết lập các chuẩn mực liên sao và giải quyết các mối đe dọa chung. Thông qua việc đề xuất và thông qua các nghị quyết, Cộng đồng thực thi quyền lực mềm lên các thành viên của mình, điều tiết ['concept_war'], thương mại và các giá trị xã hội trên quy mô ngân hà.\n\nCác đế chế có thể gia tăng tầm ảnh hưởng trong Cộng đồng bằng cách phân công ['concept_envoys'] và tích lũy ['concept_diplomatic_weight']. Dù bề ngoài là diễn đàn cho sự đoàn kết, Cộng đồng thường là võ đài của những cuộc kình địch, đàm phán ngầm, và mưu đồ bá quyền dưới chiêu bài quản trị tập thể."
 concept_galactic_council: "Hội đồng Thiên hà"
 concept_galactic_council_desc: "§H$concept_galactic_council$§! là một cơ quan quản trị tinh hoa bên trong ['concept_galactic_community'], bao gồm các đế chế thành viên hùng mạnh nhất tính theo ['concept_diplomatic_weight']. Các thành viên Hội đồng nắm giữ những đặc quyền riêng, bao gồm khả năng đề xuất các biện pháp khẩn cấp, phủ quyết nghị quyết và dẫn dắt nghị trình thiên hà.\n\nSố ghế trong hội đồng có hạn và có thể thay đổi, với tư cách thành viên được quyết định bởi quyền lực ngoại giao tương quan. Dù mục đích là bảo vệ trật tự thiên hà, Hội đồng thường trở thành lò lửa của tham vọng, nơi kẻ mạnh củng cố sự thống trị và kẻ yếu mưu toan lật đổ nó."
 concept_favor: "Ân huệ Ngoại giao"
 concept_favors: "Ân huệ Ngoại giao"
 concept_favor_desc: "§H$concept_favors$§! là những công cụ ngoại giao đại diện cho một món nợ ảnh hưởng của đế chế này đối với đế chế khác, thường thu được thông qua việc tham gia vào các sự kiện thiên hà. Chúng đóng vai trò như một dạng tiền tệ chính trị bên trong §H$concept_galactic_community$§! và bối cảnh ngoại giao rộng lớn hơn.\n\nÂn huệ ngoại giao có thể được tiêu dùng để xoay chuyển lá phiếu, củng cố các đề xuất ngoại giao, hoặc giành đòn bẩy trong các cuộc đàm phán."
 concept_diplomatic_weight: "Trọng lượng Ngoại giao"
 concept_diplomatic_weight_desc: "§H$concept_diplomatic_weight$§! đo lường tầm ảnh hưởng của một đế chế bên trong ['concept_galactic_community'], quyết định sức nặng của lá phiếu đối với các nghị quyết và tư cách tham gia ['concept_galactic_council']. Trọng số này bắt nguồn từ sức mạnh kinh tế, công nghệ và quân sự của đế chế, cũng như số lượng ['concept_envoys'] được cử đến Cộng đồng.\n\nTrọng lượng ngoại giao có thể biến động theo thời gian, khiến nó vừa là sự phản ánh vị thế của đế chế, vừa là công cụ để thúc đẩy các lợi ích của họ."
 concept_first_contact: "Lần Tiếp xúc Đầu tiên"
 concept_first_contacts: "Lần Tiếp xúc Đầu tiên"
 concept_first_contact_desc: "Một §H$concept_first_contact$§! đánh dấu cuộc gặp gỡ đầu tiên giữa các nền văn minh chưa từng quen biết trước đây. Những khoảnh khắc khai mở này có thể dẫn đến ['concept_diplomacy'], sự hoài nghi hoặc xung đột, tùy thuộc vào bản chất và tâm thế của các bên liên quan.\n\nQuá trình §H$concept_first_contact$§! bao gồm việc giải mã các thông tin liên lạc ngoài hành tinh, xử lý các sự cố tiềm ẩn và xác định tư thế của đế chế đối với những điều chưa biết."
 concept_workforce: "Lực lượng Lao động"
 concept_workforce_desc: "§H$concept_workforce$§! đại diện cho tổng năng lực lao động của một £colony£ ['concept_colony'], phản ánh số lượng cá thể sẵn sàng thực hiện các nhiệm vụ thiết yếu khác nhau cho sự vận hành của đế chế.\n\nCác £pop£ ['concept_pops'] được tổ chức thành các nhóm dựa trên những đặc điểm chung như ['concept_species'], tầng lớp xã hội và ['concept_ethics']. Mỗi nhóm đóng góp vào §H$concept_workforce$§! của hành tinh, từ đó được phân bổ để đảm nhiệm các £job£ ['concept_jobs'] còn trống."
 concept_district_specialization: "$planet_zone$"
 concept_district_specializations: "$planet_zones$"
 concept_district_specialization_desc: "Chuyên môn hóa Phân khu quyết định các £job£ ['concept_jobs'] do mỗi £district£ ['concept_district'] cung cấp, và phần lớn sẽ tăng thêm không gian cho các £building£ ['concept_buildings'] bổ sung."
 concept_district_specializations_desc: "$concept_district_specialization_desc$"
 concept_strategic_resources: "Tài nguyên Chiến lược"
 concept_strategic_resources_desc: "Tài nguyên chiến lược £strategic_resource£ §H$concept_strategic_resources$§! là những vật chất quý hiếm và hiệu nghiệm, mang tính then chốt đối với các công nghệ tiên tiến, cơ sở hạ tầng và hệ thống phi thuyền.\n\nVí dụ bao gồm £volatile_motes£ §H$volatile_motes$§!, £exotic_gases£ §H$exotic_gases$§!, và £rare_crystals£ §H$rare_crystals$§!.\n\n§HTài nguyên Hiếm§! thậm chí còn có giá trị hơn và là những hợp chất đặc biệt huyền bí với những ứng dụng vô cùng tiên tiến. Cùng với nhiều mục đích khác, Tài nguyên Hiếm và Chiến lược được dùng để đóng ['concept_civilian_ships'], ['concept_military_ships'], ['concept_starbases'], và ['concept_megastructures'].$tt_gain$- Xây dựng £zone£ §H$zone_industrial_plural$§! hoặc £zone£ §H$zone_foundry_plural$§!\n- Xây dựng các Công trình liên quan\n- $tt_market$"
 concept_strategic_resources_tooltip: "$concept_strategic_resources_desc$\n\n§GNhấp vào ['concept_strategic_resources'] để mở Kho dữ liệu\nNhấp vào £strategic_resource£ trong menu để mở rộng danh sách§!"
 POLICY_OPTION_CONCEPT_BODY: "- ['policy:$POLICY$:$OPTION$',$OPTION_NAME$]"