l_english:
 TIME_CONTROLS_TITLE:0 "Điều Khiển Thời Gian"
 TIME_CONTROLS_DESC:1 "Trò chơi đang tạm dừng. Hãy nhấp vào đây khi bạn cảm thấy đã sẵn sàng để tiếp tục tiến trình."
 OUTLINER_TITLE:0 "Bảng Tổng Quan"
 OUTLINER_DESC:1 "Mở rộng bảng tổng quan để nắm bắt tình hình hoạt động của Đế chế của bạn tại bất kỳ thời điểm nào. Nơi này hiển thị tất cả các hành tinh, phi thuyền và các dự án đang triển khai trong Đế chế."
 RESOURCE_PANEL_TITLE:0 "Bảng Tài Nguyên"
 RESOURCE_PANEL_DESC:0 "Trên bảng điều khiển này, bạn có thể quan sát tất cả các nguồn tài nguyên thiết yếu của Đế chế."
 MENU_PANEL_TITLE:0 "Bảng Menu"
 MENU_PANEL_DESC:1 "Tại bảng này, bạn có thể truy cập tất cả các menu chính như Công Nghệ, Truyền Thống, Chính Sách và Thiết Kế Tàu."
 GOVERNMENT_VIEW_TITLE:0 "Tổng Quan Đế Chế"
 GOVERNMENT_VIEW_DESC:1 "Mục này mở ra Giao diện Đế chế, cung cấp cho bạn cái nhìn bao quát về toàn bộ Đế chế của mình."
 GALAXY_VIEW_TITLE:0 "Bản Đồ Thiên Hà"
 GALAXY_VIEW_DESC:1 "Bản đồ thiên hà cung cấp cái nhìn toàn cảnh về thiên hà và vị thế Đế chế của bạn trong đó. Giao diện này được khuyến nghị sử dụng cho hầu hết các tương tác của bạn."
 TUTORIAL_MISSION_VIEW_TITLE:0 "Nhiệm Vụ"
 TUTORIAL_MISSION_VIEW_DESC:0 "Cửa sổ nhiệm vụ cung cấp cái nhìn tổng quan về các khía cạnh cốt lõi của Stellaris và hỗ trợ bạn định hình những việc cần làm tiếp theo."
 TUTORIAL_MISSION_VIEW_TITLE_HUDONLY:0 "Menu Trợ Giúp"
 TUTORIAL_MISSION_VIEW_DESC_HUDONLY:0 "Bạn luôn có thể truy cập hướng dẫn giao diện người dùng đầy đủ và wiki của trò chơi trong menu trợ giúp."

 OUTLINER__SECTORS_TITLE:0 "Tinh Khu"
 OUTLINER__SECTORS_DESC:0 "Tinh khu là các vùng hành chính bên trong Đế chế, bao gồm nhiều hành tinh đã được thuộc địa hóa. Một tinh khu có thể được bổ nhiệm một §SThống Đốc§! và một §STrọng Tâm Tinh Khu§!, cho phép tinh khu tự động phát triển theo định hướng đã định mà không cần bạn phải can thiệp quản lý vi mô liên tục."
 OUTLINER__MILITARY_FLEETS_TITLE:0 "Hạm Đội Quân Sự"
 OUTLINER__MILITARY_FLEETS_DESC:0 "Sử dụng các chiến hạm trong hạm đội của bạn để bảo vệ Đế chế hoặc chinh phục kẻ thù."
 OUTLINER__CIVILIAN_SHIPS_TITLE:0 "$OUTLINER_CIVILIAN_FLEETS$"
 OUTLINER__CIVILIAN_SHIPS_DESC:0 "Sử dụng các phi thuyền này để khảo sát các hệ sao lân cận và xây dựng các công trình mới tại đó."

 RESOURCE_PANEL__EMPIRE_MANAGEMENT_TITLE:0 "Quản Trị Đế Chế"
 RESOURCE_PANEL__EMPIRE_MANAGEMENT_DESC:0 "Các Đế chế quy mô lớn rất khó quản lý, vì vậy hãy luôn chú ý theo dõi các chỉ số này khi Đế chế của bạn không ngừng mở rộng."
 RESOURCE_PANEL__FLEET_MANAGEMENT_TITLE:1 "Quản Lý Căn Cứ Sao và Hạm Đội"
 RESOURCE_PANEL__FLEET_MANAGEMENT_DESC:0 "Số lượng Căn Cứ Sao và Chiến Hạm mà bạn có thể hỗ trợ hiệu quả."

 CONTROL_GROUPS_TITLE:0 "Nhóm Điều Khiển"
 CONTROL_GROUPS_DESC:1 "Bạn có thể tạo phím tắt cho hầu hết các đối tượng bằng cách chọn chúng rồi nhấn phím Ctrl cùng một chữ số (ví dụ: Ctrl 5). Để hủy phím tắt, hãy nhấp chuột phải vào nhóm đã chọn."
 MAP_MODES_TITLE:0 "Chế Độ Bản Đồ"
 MAP_MODES_DESC:0 "Các chế độ bản đồ là phương thức tuyệt vời để hiển thị thông tin trọng yếu về một Đế chế được lựa chọn. Các chế độ bản đồ hiện có bao gồm: Đồ họa Tinh khu, Siêu lộ trình, Liên minh chính trị, Đế chế, Ngoại giao, Ý kiến, Thái độ AI và Các nước láng giềng trực tiếp."

 SHOW_MORE:0 "Hiển Thị Thêm"

 HUD_TUTORIAL_CLOSE_CONFIRMATION_TITLE:0 "Thoát Hướng Dẫn Giao Diện HUD"
 HUD_TUTORIAL_CLOSE_CONFIRMATION_DESC:0 "Bạn có chắc chắn muốn thoát khỏi phần Hướng dẫn HUD không? Bạn có thể mở lại phần này thông qua §SCửa sổ Trợ giúp§!."


 MENU_PANEL__CONTACTS_TITLE:0 "Liên Lạc"
 MENU_PANEL__CONTACTS_DESC:1 "Mở danh sách toàn bộ các Đế chế và chủng tộc ngoại lai đã biết trong thiên hà."
 MENU_PANEL__SITUATION_LOG_TITLE:0 "Nhật Ký Tình Huống"
 MENU_PANEL__SITUATION_LOG_DESC:0 "Mở nhật ký lưu trữ tất cả các Sự kiện và Dự án Đặc biệt đang diễn ra."
 MENU_PANEL__MARKET_TITLE:0 "Thị Trường"
 MENU_PANEL__MARKET_DESC:0 "Cho phép bạn bán bớt tài nguyên dư thừa và thu mua những thứ bạn đang còn thiếu hụt."
 MENU_PANEL__PLANETS_AND_SECTORS_TITLE:0 "Hành Tinh và Tinh Khu"
 MENU_PANEL__PLANETS_AND_SECTORS_DESC:1 "Mở tổng quan về các hành tinh, lãnh đạo và các phe phái trong Đế chế của bạn."
 MENU_PANEL__EXPANSION_PLANNER_TITLE:0 "Bộ Quy Hoạch Mở Rộng"
 MENU_PANEL__EXPANSION_PLANNER_DESC:0 "Cho phép bạn lập kế hoạch cho các dự án thuộc địa hóa tiếp theo của mình."
 MENU_PANEL__POLICIES_TITLE:0 "Chính Sách"
 MENU_PANEL__POLICIES_DESC:1 "Mở giao diện Chính Sách, nơi bạn có thể thanh tra và kích hoạt các Chính Sách của Đế chế."
 MENU_PANEL__EDICTS_TITLE:0 "Sắc Lệnh"
 MENU_PANEL__EDICTS_DESC:1 "Mở giao diện Sắc Lệnh, nơi bạn có thể kiểm tra và ban hành các Sắc Lệnh của Đế chế."
 MENU_PANEL__TRADITIONS_AND_RELICS_TITLE:0 "Quản Lý Xã Hội"
 MENU_PANEL__TRADITIONS_AND_RELICS_DESC:0 "Cho phép bạn định hình con đường độc nhất của Đế chế mình thông qua các Truyền Thống."
 MENU_PANEL__SHIP_DESIGNER_TITLE:0 "Thiết Kế Tàu"
 MENU_PANEL__SHIP_DESIGNER_DESC:0 "Mở xưởng Thiết Kế Tàu, nơi bạn có thể sáng tạo các mẫu Thiết Kế Tàu tùy chỉnh."
 MENU_PANEL__FLEET_MANAGER_TITLE:0 "Quản Lý Hạm Đội"
 MENU_PANEL__FLEET_MANAGER_DESC:0 "Cho phép bạn quản lý, đóng mới và nâng cấp các Chiến Hạm quân sự của mình."
 MENU_PANEL__TECHNOLOGY_TITLE:0 "Công Nghệ"
 MENU_PANEL__TECHNOLOGY_DESC:0 "Mở giao diện Công Nghệ, nơi bạn có thể nghiên cứu các bước tiến khoa học kỹ thuật."
 MENU_PANEL__FACTIONS_TITLE:0 "Phe Phái"
 MENU_PANEL__FACTIONS_DESC:0 "Mở giao diện Phe Phái, hiển thị các phe phái chính trị hiện thời bên trong Đế chế của bạn."
 MENU_PANEL__CLAIMS_TITLE:0 "Tuyên Bố Chủ Quyền"
 MENU_PANEL__CLAIMS_DESC:0 "Cho phép bạn đưa ra các tuyên bố chủ quyền đối với các hệ sao. Tuyên bố chủ quyền có thể được sử dụng làm lý do chính đáng để phát động chiến tranh chống lại các Đế chế khác."
 MENU_PANEL__SPECIES_TITLE:0 "Chủng Tộc"
 MENU_PANEL__SPECIES_DESC:1 "Xem danh sách các chủng tộc cư ngụ trong Đế chế của bạn."
 MENU_PANEL__LEADERS_TITLE:0 "Lãnh Đạo"
 MENU_PANEL__LEADERS_DESC:0 "Mở giao diện tổng quan về các nhà lãnh đạo trong Đế chế của bạn; màn hình này cũng cho phép bạn chiêu mộ những lãnh đạo mới."
