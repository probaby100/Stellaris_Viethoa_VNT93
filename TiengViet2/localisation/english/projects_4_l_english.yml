l_english:
 hallucinogen_removal:0 "Loại Bỏ Khí Gây Ảo Giác"
 hallucinogen_removal_DESC:1 "Cố gắng loại bỏ khí gây ảo giác khỏi bầu khí quyển của [Root.GetName]."
 impact_defence_system:0 "Hệ Thống Phòng Thủ Thiên Thạch"
 impact_defence_system_DESC:0 "Chúng ta phải nghiên cứu phương án tốt nhất nhằm bảo vệ thuộc địa trên [Root.GetName] khỏi các vụ va chạm thiên thạch thường xuyên đang đe dọa hành tinh này."
 titanic_life_study_normal:0 "Nghiên Cứu Sự Sống Khổng Lồ"
 titanic_life_study_normal_DESC:1 "Bằng cách nghiên cứu Sự Sống Khổng Lồ trên [Root.GetName], chúng ta hy vọng có thể hiểu được chúng và thậm chí có thể tiến hành giao tiếp."
 titanic_life_study_mean:0 "Mổ Khám Nghiên Cứu Sự Sống Khổng Lồ"
 titanic_life_study_mean_DESC:1 "Bằng cách thu hoạch Sự Sống Khổng Lồ trên [Root.GetName], chúng ta sẽ sớm tìm ra cách khai thác chúng hiệu quả nhất!"
 titanic_life_study_nice:0 "Giám Sát Sự Sống Khổng Lồ"
 titanic_life_study_nice_DESC:1 "Bằng cách giám sát cẩn thận Sự Sống Khổng Lồ trên [Root.GetName], chúng ta hy vọng có thể chung sống hòa bình với chúng."
 retaliatory_genome_mapping:0 "Giải Mã Bộ Gen Đáp Trả"
 retaliatory_genome_mapping_DESC:0 "Bằng cách phái một con tàu tới hành tinh quê hương của người ngoài hành tinh, chúng ta sẽ có thể thu thập chính dữ liệu về họ mà chúng ta nghi ngờ họ đã thu thập từ chúng ta."
 woodwind_instrument_investigation:0 "Điều Tra Nhạc Cụ Bộ Hơi"
 woodwind_instrument_investigation_DESC:1 "Chúng ta phải tìm ra nguồn nguyên liệu của loại nhạc cụ bí ẩn dường như có tác dụng xoa dịu tâm trí chúng ta."
 disappearing_pops_project:0 "Những Vụ Mất Tích Trên [missing_pops_planet.GetName]"
 disappearing_pops_project_DESC:0 "Lực lượng hành pháp địa phương trên [missing_pops_planet.GetName] cần sự hỗ trợ của một lực lượng xung kích quân sự để dập tắt bất ổn trong khi tiến hành điều tra làn sóng mất tích bí ẩn gần đây."
 mystery_cream_project:0 "Trường Sinh"
 mystery_cream_project_DESC:0 "Loại kem chống lão hóa mới mang tên Trường Sinh đang lan truyền như vũ bão khắp đế chế, và cho thấy tiềm năng thực sự trong việc kích thích tái tạo tế bào. Nếu có thể xác định được hoạt chất chính, chúng ta có thể sử dụng nó để tạo ra hiệu quả lâu dài hơn."
 cream_origin_project:0 "Hành Trình Tìm Kiếm Làn Da Không Tì Vết"
 cream_origin_project_DESC:0 "Chúng ta phải tìm ra nguồn gốc xuất xứ của loại kem này."
 MAGNETIC_PLANET_RESEARCH_PROJECT:0 "Điều Tra Bí Ẩn Từ Trường Của [Root.GetName]"
 MAGNETIC_PLANET_RESEARCH_PROJECT_DESC:0 "Nhiều hiện tượng nhiễu loạn từ trường kỳ lạ đã làm xáo trộn đời sống trên [Root.GetName]. Cho đến gần đây, nguyên nhân của chúng vẫn là một bí ẩn hoàn toàn, nhưng với dữ liệu thu thập được từ các biến cố lặp đi lặp lại, giờ đây chúng ta có thể làm sáng tỏ chân tướng đằng sau chúng."
 ROGUEMOON_PROJECT:0 "Điều Tra Mặt Trăng Bí Ẩn Của [Root.GetName]"
 ROGUEMOON_PROJECT_DESC:0 "Tiến hành khảo sát chi tiết [event_target:roguemoon.Planet.GetName] và cố gắng tìm hiểu xem nó bắt nguồn từ đâu."
 DPORTAL_PROJECT:0 "Thăm Dò Cổng Chiều Không Gian Trên [Root.GetName]"
 DPORTAL_PROJECT_DESC:0 "Điều tra xem Cổng Chiều Không Gian dẫn tới nơi nào."
 DPORTAL_PROJECT_SCIENCE:0 "Đóng cổng lại!"
 DPORTAL_PROJECT_SCIENCE_DESC:0 "Chắc chắn phải có cách để đóng cánh cổng này lại, và khoa học sẽ tìm ra giải pháp!"
 DPORTAL_PROJECT_PRAYER:0 "Đóng cổng lại!"
 DPORTAL_PROJECT_PRAYER_DESC:0 "Một cánh cổng như vậy chắc chắn có thể bị khắc chế bằng năng lượng tích cực!"
 DPORTAL_PROJECT_PSI_PRAYER:0 "Đóng cổng lại!"
 DPORTAL_PROJECT_PSI_PRAYER_DESC:0 "Một cánh cổng như vậy chắc chắn có thể bị khắc chế bằng năng lượng Tâm Linh!"
 DPORTAL_PROJECT_ROCKS:0 "Đóng cổng lại!"
 DPORTAL_PROJECT_ROCKS_DESC:0 "Có lẽ đổ thật nhiều đá tảng vào cánh cổng sẽ bịt kín được nó chăng?"
 SNEK_SCIENCE_PROJECT:0 "Dùng Khoa Học"
 SNEK_SCIENCE_PROJECT_DESC:1 "Khoa học! Chúng ta sẽ dùng khoa học! Sau một chuỗi quan sát cẩn mật và những buổi hội bàn đầy hiệu quả, chúng ta dự định tìm ra các mô thức hành vi của loài bò sát dạng rắn này và áp dụng bài bản kế hoạch đối phó với chúng. Nếu có thể tìm thấy bằng chứng về việc sử dụng công cụ và chiến lược thích nghi, thậm chí chúng ta có thể giao tiếp lý trí với chúng! Chúng ta chỉ cần đảm bảo không làm sai lệch dữ liệu bằng cách can thiệp vào hành vi của chúng, ngay cả khi chúng đang cắn những người thuộc địa và hút trộm năng lượng."
 SNEK_WAR_PROJECT:0 "Dùng Binh Lính"
 SNEK_WAR_PROJECT_DESC:1 "Chiến tranh! Chúng ta sẽ khai chiến! Chúng ta không biết tại sao chúng lại đến đây. Chúng ta cũng chẳng rõ chúng làm gì ở đây. Nhưng chúng ta biết chắc điều này: chúng căm ghét chúng ta, vậy nên chúng phải học cách khiếp sợ chúng ta. Đã đến lúc bố trí lính canh, thiết lập các đội tuần tra, và lùng sục từng căn nhà với súng hỏa tiễn thiêu rắn. Hãy thiêu rụi chúng! Bất kể cái giá phải trả là gì, chúng ta phải đứng lên tiêu diệt sạch bóng bất cứ thứ gì trườn bò."