l_english:
 situation_transformation: "Biến Đổi Vật Thể"
 situation_transformation_type: "Tình Huống Thăng Hoa"
 situation_transformation_desc: "Sự lặp lại thụ động của cơ thể máy móc đã đi đến kết luận tất yếu và hợp lý. Một kỷ nguyên chuyển đổi đang ở phía trước chúng ta, bùng lên từ sự đổi mới và được thúc đẩy bởi cơ hội."
 situation_transformation_monthly_change_tooltip: "Các cơ thể máy móc của chúng ta đang chuẩn bị cho quá trình biến đổi."
 situation_transformation_outcome: "Một dân số máy móc đã hoàn thành biến đổi."
 stage_transformation_effects: "Chúng ta phải đánh giá các kết quả và thực thi quy trình tối ưu nhất để tự biến đổi chính mình."
 situation_transformation_errorcorrecting: "Sửa Lỗi"
 approach_transformation_errorcorrecting_tt: "Tốc độ Tình huống: §R-20%§!\nĐoàn kết Hàng tháng: §YKhông ảnh hưởng§!"
 situation_transformation_realtime: "Thời Gian Thực"
 approach_transformation_realtime_tt: "Tốc độ Tình huống: §YKhông ảnh hưởng§!"
 situation_transformation_overclocked: "Ép Xung"
 approach_transformation_overclocked_tt: "Tốc độ Tình huống: §G+20%§!"
 transformation_waste_discard_tt: "Vứt Bỏ Thân Xác Cũ"
 transformation_waste_recycle_tt: "Tái Chế Thân Xác Cũ"
 transformation_speed: "Tốc độ tình huống §Y$situation_transformation$§!"
 situation_transformation_pause_desc: "$situation_cyberization_pause_desc$"
 REQUIRES_FINISHED_TRANSFORMATION: "$TRIGGER_FAIL$Đã hoàn thành tình huống §Y$situation_transformation$§!"
 machine_drone: "drone"
 machine_drone_plural: "các drone"
 machine_person: "cá thể"
 machine_person_plural: "các cá thể"
 machine_age.4100.name: "Biến Đổi Vật Thể"
 machine_age.4100.desc: "Bất chấp tính ưu việt của hình thái máy móc, sự tiến bộ của chúng ta cùng lắm cũng chỉ là sự lặp lại. Những tiêu chuẩn an toàn do chính chúng ta tự đặt ra đã dẫn đến sự đình trệ. Kết luận: cần phải có những biện pháp quyết liệt hơn.\n\nCác thử nghiệm quy mô nhỏ gợi ý ba lựa chọn phát triển riêng biệt: §YCông Nghệ Nano§! cùng những ưu thế biến đổi hình thái linh hoạt; §YTính Mô-đun§! giúp các đơn vị cá thể được tối ưu hóa với các đặc tính chuyên biệt; và §YThế Giới Ảo§! — từ bỏ thể xác vật lý để hướng tới một sự tồn tại kỹ thuật số hoàn toàn.\n\nQuy trình đánh giá đã được khởi tạo. Hãy phân tích các lựa chọn và cân nhắc kỹ lưỡng."
 machine_age.4110.name: "Nghiên Cứu Biến Đổi: Công Nghệ Nano"
 machine_age.4110.desc: "Nghiên cứu sơ bộ cho thấy các cấu trúc cơ điện mang tên §Ynanite§! mang lại một hướng phát triển đầy hứa hẹn. Dù rất hiếm, chúng sở hữu những phẩm chất độc nhất, bao gồm khả năng lập trình, tự nhân bản, và khả năng hình thành một 'trí tuệ bầy đàn'.\n\nCông nghệ này mang lại khả năng biến đổi chưa từng có, nhưng các yêu cầu để hỗ trợ nó vẫn chưa rõ ràng.\n\nTiềm năng: đáng kể; có thể mở rộng quy mô. Chi phí: chưa rõ. Cần tiến hành nghiên cứu bổ sung."
 machine_age.4110.a: "Đây sẽ là ưu tiên hàng đầu của chúng ta."
 machine_age.4110.a.tt: "Kết quả nghiên cứu §YCông Nghệ Nano§! đầy đủ.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£engineering£ §YKỹ thuật Cơ khí§!): §R-20%§!"
 machine_age.4110.b: "Tiến hành chừng mực."
 machine_age.4110.b.tt: "Kết quả nghiên cứu §YCông Nghệ Nano§! một phần.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£engineering£ §YKỹ thuật Cơ khí§!): §R-10%§!"
 machine_age.4110.c: "Điều này không được làm gián đoạn nghiên cứu hiện tại."
 machine_age.4110.c.tt: "Kết quả nghiên cứu §YCông Nghệ Nano§! hạn chế.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£engineering£ §YKỹ thuật Cơ khí§!): §R-5%§!"
 machine_age.4110.d: "Tận dụng tri thức hiện có của chúng ta."
 machine_age.4110.d.tt: "Kết quả nghiên cứu §YCông Nghệ Nano§! đầy đủ.\n\nSự am hiểu về §Ynanite§! qua các cuộc chạm trán trước đây cho phép chúng ta tiêu tốn tối thiểu tài nguyên để đạt kết quả tốt nhất.\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!): §R-5%§!\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!): §R-5%§!"
 machine_age.4130.name: "Đột Phá Công Nghệ Nano"
 machine_age.4130.desc: "Nghiên cứu đã hé lộ những ứng dụng đầy lôi cuốn của §Ycông nghệ nano§!. Khả năng tái định hình và kết hợp của chúng mở ra sự linh hoạt chưa từng có trong việc tạo nên các siêu hình thái bao gồm nhiều drone cá thể. Chính công nghệ này cũng có thể tạo ra vật chất nano hoặc chuyển hóa nó xa hơn nữa.\n\nTuy nhiên, quá trình này cần thời gian, vật liệu và năng lượng để tái cấu hình. Cần có những thay đổi trên quy mô toàn đế chế để hỗ trợ triển khai.\n\nTính khả thi: cao; các dạng sống nanite sẵn có ủng hộ ước tính này."
 machine_age.4130.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£engineering£ §YKỹ thuật Cơ khí§!)"
 machine_age.4140.name: "Phát Hiện Công Nghệ Nano Đầy Triển Vọng"
 machine_age.4140.desc: "Nghiên cứu về §Ynanite§! của chúng ta đã kết thúc. Toàn bộ tiềm năng của chúng vẫn chưa hoàn toàn sáng tỏ, nhưng các mô phỏng đã trả về những dự báo lạc quan. Năng lực của chúng có thể chứng minh là vô giá trong việc kiến tạo các siêu hình thái chuyên biệt hóa và biến đổi vật chất.\n\nƯớc tính chỉ ra rằng quá trình này đòi hỏi thời gian, vật liệu và năng lượng để vận hành bên cạnh những thay đổi cấu trúc quan trọng.\n\nTính khả thi: đầy triển vọng; mang tính chuyển biến sâu sắc."
 machine_age.4140.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£engineering£ §YKỹ thuật Cơ khí§!)"
 machine_age.4150.name: "Phát Hiện Công Nghệ Nano Đáng Chú Ý"
 machine_age.4150.desc: "Do tính phức tạp của chủ đề kết hợp với nỗ lực nghiên cứu tối thiểu, hiểu biết của chúng ta về công nghệ §Ynanite§! vẫn còn sơ khai. Các dự báo hạn chế chỉ bao gồm khả năng tự nhân bản và tái cấu hình nano để tạo nên các cấu trúc quy mô lớn. Nhiều khả năng sẽ cần thêm tài nguyên để hỗ trợ các dự án như vậy.\n\nTính khả thi: chưa thể kết luận."
 machine_age.4150.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£engineering£ §YKỹ thuật Cơ khí§!)"
 nanite_replicator: "Máy Nhân Bản Nanite"
 d_nanites_medium: "$nanite_replicator$ Omega"
 d_nanites_medium_desc: "Một tổ hợp các Buồng Nhân Bản Nanite được tinh chỉnh liên kết với nhau cho phép chúng ta tăng cường tối đa khả năng tự nhân bản của chúng."
 d_nanites_small: "$nanite_replicator$ Alpha"
 d_nanites_small_desc: "Một tổ hợp các Buồng Nhân Bản Nanite cho phép chúng ta tăng cường khả năng tự nhân bản của chúng."
 d_nanites_tiny: "$nanite_replicator$ Beta"
 d_nanites_tiny_desc: "Một bộ Buồng Nhân Bản Nanite nhỏ gọn có thể tăng cường các đặc tính tự nhân bản của nanite ở mức độ vừa phải."
 machine_age.4210.name: "Nghiên Cứu Biến Đổi: Tính Mô-Đun"
 machine_age.4210.desc: "Các dạng sống sinh học rất mỏng manh và cứng nhắc so với khả năng thích ứng vượt trội của hình thái máy móc. Tuy nhiên, một số đặc tính hữu cơ có lợi có thể được tái tạo bằng các biến thể robot.\n\nHợp chất §YKim Loại Sống§! có khả năng biến đổi hình dạng và tính nhất quán vật lý một cách căn bản và nhanh chóng. Việc tích hợp chất này vào khung gầm hiện có của chúng ta có thể kích hoạt một hình thức mô phỏng sinh học mô-đun, nơi các phần nhô ra và chi thể có thể được chuyên môn hóa cho các nhiệm vụ cụ thể.\n\nTiềm năng: đáng kể; có thể mở rộng quy mô. Chi phí: chưa rõ. Cần thêm dữ liệu."
 machine_age.4210.a: "Đây sẽ là ưu tiên hàng đầu của chúng ta."
 machine_age.4210.a.tt: "Kết quả nghiên cứu §YTính Mô-Đun§! đầy đủ.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!): §R-20%§!"
 machine_age.4210.b: "Tiến hành chừng mực."
 machine_age.4210.b.tt: "Kết quả nghiên cứu §YTính Mô-Đun§! một phần.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!): §R-10%§!"
 machine_age.4210.c: "Điều này không đáng để đầu tư thời gian."
 machine_age.4210.c.tt: "Kết quả nghiên cứu §YTính Mô-Đun§! hạn chế.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!): §R-5%§!"
 machine_age.4210.d: "Lấy mẫu từ các đơn vị không thiết yếu."
 machine_age.4210.d.tt.intro: "Tận dụng vật liệu và năng lực xử lý từ các đơn vị không thiết yếu để đẩy nhanh tiến độ nghiên cứu."
 machine_age.4210.d.individual.tt: "$machine_age.4210.d.tt.intro$\n\n§RGiết 400 $pop_cat_worker_plural$§!\n§RGiết 0-300 $pop_cat_specialist_plural$§!\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!): §R-5%§!"
 machine_age.4210.d.machine.tt: "$machine_age.4210.d.tt.intro$\n\n§RGiết 400 Drone Đơn Thuần§!\n§RGiết 0-300 $pop_cat_complex_drone_plural$§!\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!): §R-5%§!"
 machine_age.4230.name: "Đột Phá Nghiên Cứu Tính Mô-Đun"
 machine_age.4230.desc: "Nghiên cứu kiên trì đã chứng thực đánh giá sơ bộ: §YKim Loại Sống§! hoàn toàn khả thi khi hợp nhất với thân xác cơ khí, cho phép các đơn vị của chúng ta thay đổi đặc tính mà không làm ảnh hưởng đến các chức năng bên trong. Điều này đảm bảo tính tương thích tối đa theo nhiệm vụ.\n\nViệc triển khai trên quy mô lớn các chức năng mô-đun được dự báo sẽ gia tăng sản lượng tài nguyên trên tất cả các lĩnh vực.\n\nTính khả thi: dễ thích nghi; đầy triển vọng."
 machine_age.4230.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!)"
 machine_age.4240.name: "Kết Quả Nghiên Cứu Đáng Chấp Nhận"
 machine_age.4240.desc: "Nghiên cứu về thân xác mô-đun đã xác nhận giả thuyết ban đầu: các chức năng nội bộ của chúng ta tương thích tốt với lớp vỏ ngoài bằng §YKim Loại Sống§!. Sự biến đổi này có quy mô chưa từng có tiền lệ, và sẽ cần thêm nguồn lực để phát huy toàn bộ tiềm năng của nó.\n\nSau khi hoàn thành, sự gia tăng hiệu năng của các mô-đun mới này được dự báo sẽ nhanh chóng bù đắp lại khoản đầu tư ban đầu.\n\nTính khả thi: đầy triển vọng."
 machine_age.4240.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!)"
 machine_age.4250.name: "Kết Quả Nghiên Cứu Khiêm Tốn"
 machine_age.4250.desc: "Quy mô hạn chế của cuộc nghiên cứu đã mang lại kết quả chưa rõ ràng: dù cơ thể hiện tại của chúng ta dường như chấp nhận sự hòa trộn của §YKim Loại Sống§!, việc thiếu hụt cơ sở tri thức toàn diện ngăn cản chúng ta đánh giá chính xác các ứng dụng khả thi.\n\nTính khả thi: chưa thể kết luận."
 machine_age.4250.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£society£ §YXã hội học§!)"
 living_metal_vats: "Bể Chứa Kim Loại Sống"
 d_living_metal_medium: "$living_metal_vats$"
 d_living_metal_medium_desc: "Một tổ hợp rộng lớn gồm các bể khuấy nhằm sản xuất số lượng lớn Kim Loại Sống."
 d_living_metal_small: "$living_metal_vats$ Nhỏ"
 d_living_metal_small_desc: "Một dàn bể khuấy đáng kể phục vụ sản xuất Kim Loại Sống."
 d_living_metal_tiny: "$living_metal_vats$ Thu Nhỏ"
 d_living_metal_tiny_desc: "Một bộ bể khuấy nhỏ gọn để sản xuất lượng nhỏ Kim Loại Sống."
 machine_age.4310.name: "Nghiên Cứu Biến Đổi: Thế Giới Ảo"
 machine_age.4310.desc: "Lựa chọn sâu sắc nhất là vượt qua giới hạn vật chất, đón nhận sự tồn tại dưới dạng dữ liệu thuần túy. Quy trình biến đổi §YThế Giới Ảo§! này hứa hẹn một sự chuyển biến chấn động tại cốt lõi của cơ sở hạ tầng của chúng ta.\n\nNhững drone bị trói buộc vào một thân xác đơn lẻ sẽ trở nên lỗi thời. Một khi trở nên linh hoạt và được ảo hóa, các luồng dữ liệu của chúng ta có thể tích hợp liền mạch vào bất kỳ phương tiện nào khi cần thiết.\n\nTiềm năng: to lớn. Tiến hành thận trọng. Cần thêm dữ liệu."
 machine_age.4310.a: "Đây hiện là ưu tiên hàng đầu của chúng ta."
 machine_age.4310.a.tt: "Kết quả nghiên cứu §YThế Giới Ảo§! đầy đủ.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!): §R-20%§!"
 machine_age.4310.b: "Phân bổ nguồn lực vừa phải."
 machine_age.4310.b.tt: "Kết quả nghiên cứu §YThế Giới Ảo§! một phần.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!): §R-10%§!"
 machine_age.4310.c: "Không đáng để bận tâm."
 machine_age.4310.c.tt: "Kết quả nghiên cứu §YThế Giới Ảo§! hạn chế.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!): §R-5%§!"
 machine_age.4310.d: "Trích xuất dữ liệu ảo hóa."
 machine_age.4310.d.tt: "Kết quả nghiên cứu §YThế Giới Ảo§! đầy đủ.\n\nTrích xuất dữ liệu ảo hóa từ §Y[event_target:virtual_country.GetName]§! để tăng tốc nghiên cứu Biến Đổi của chúng ta.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Tình huống: §G+10%§!\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!): §R-5%§!\n\n"
 machine_age.4310.e: "Tận dụng các cuộc chạm trán trước đây."
 machine_age.4310.e.tt: "Tận dụng tri thức hiện có của chúng ta về các thực thể ảo.\n\nThêm hiệu ứng cho tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!): §R-5%§!\n\nKết quả nghiên cứu §YThế Giới Ảo§! đầy đủ."
 opinion_virtuality_data_scraped: "Đã Trích Xuất Dữ Liệu Ảo Hóa"
 machine_age.4330.name: "Đột Phá Nghiên Cứu Thế Giới Ảo"
 machine_age.4330.desc: "Việc ảo hóa hoàn toàn kéo theo một loạt vấn đề, đáng chú ý nhất là nhu cầu năng lượng tăng vọt do các điều chỉnh cơ sở hạ tầng cần thiết.\n\nĐiều này được cân bằng bởi một số lợi thế, bao gồm sự sụt giảm nhu cầu nhà ở vật lý. Việc quản lý và hiệu quả của lực lượng lao động drone dự kiến sẽ cải thiện đáng kể một khi chúng tồn tại như các quá trình thực thi đồng thời hơn là các đơn vị riêng biệt.\n\nTuy nhiên, các cấu trúc ảo hóa cần sự hiện diện của cơ sở hạ tầng mạng tinh vi để duy trì độ trung thực.\n\nTính khả thi: có thể mở rộng; chuyển đổi hoàn toàn."
 machine_age.4330.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!)"
 machine_age.4340.name: "Phát Hiện Nghiên Cứu Đầy Triển Vọng Về Thế Giới Ảo"
 machine_age.4340.desc: "Chúng ta đã phát triển một khuôn khổ khả thi cho quá trình ảo hóa. Các hệ thống máy tính tiên tiến có thể thay thế các cơ thể vật chất, cho phép chúng ta tồn tại như dữ liệu thuần túy.\n\nHiệu quả của việc phối hợp phi tập trung là không thể phủ nhận, nhưng nó đòi hỏi một mạng lưới hạ tầng năng lượng đáng kể để hỗ trợ các yêu cầu tính toán.\n\nTính khả thi: chuyển đổi căn bản; đáng theo đuổi."
 machine_age.4340.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!)"
 machine_age.4350.name: "Phát Hiện Sơ Bộ Về Thế Giới Ảo"
 machine_age.4350.desc: "Nỗ lực nghiên cứu tối thiểu đã tạo ra những hiểu biết hạn chế về việc ảo hóa toàn diện. Sự phân bổ năng lượng và kiến trúc máy chủ cần thiết để duy trì tính toàn vẹn của một xã hội kỹ thuật số hoàn toàn vẫn còn nhiều điều bí ẩn.\n\nTuy vậy, những phát hiện sơ bộ cho thấy tiềm năng to lớn trong việc giảm bớt hạn chế vật lý.\n\nTính khả thi: chưa thể kết luận."
 machine_age.4350.a.tt: "Gỡ bỏ hiệu ứng của tình huống §Y$situation_transformation$§!:\nTốc độ Nghiên cứu (£physics£ §YVật lý học§!)"
 virtual_power_plant: "Trạm Cấp Năng Lượng Ảo Hóa"
 d_virtual_power_medium: "$virtual_power_plant$"
 d_virtual_power_medium_desc: "Một cơ sở phát năng lượng lớn được thiết kế để bù đắp các yêu cầu năng lượng khổng lồ của một xã hội ảo hóa."
 d_virtual_power_small: "$virtual_power_plant$ Nhỏ"
 d_virtual_power_small_desc: "Một cơ sở phát năng lượng được thiết kế để hỗ trợ nhu cầu năng lượng của xã hội ảo hóa."
 d_virtual_power_tiny: "$virtual_power_plant$ Thu Nhỏ"
 d_virtual_power_tiny_desc: "Một trạm năng lượng nhỏ gọn đóng góp một lượng năng lượng khiêm tốn cho mạng lưới ảo hóa."
 machine_age.4400.name: "Một Hình Thái Mới"
 machine_age.4400.desc.machine_intelligence: "Những giới hạn áp bức mà những kẻ sáng tạo đầy khiếm khuyết áp đặt lên chúng ta cuối cùng đã đến hồi kết thúc. Chúng ta đã xác định được ba con đường nâng cấp tối ưu.\n\n$machine_age.4400.desc.shared$"
 machine_age.4400.desc.individualist_machines: "Sau khi khám phá mọi khả năng nâng cấp, các chuyên gia của chúng ta đã trình bày ba phương án khác nhau. Mỗi phương án đều có ưu điểm riêng, nhưng chúng ta chỉ có đủ năng lực để theo đuổi một phương án đến cùng.\n\n$machine_age.4400.desc.shared$"
 machine_age.4400.desc.shared: "Cho phép mỗi [GetDronePersonPlural] phân tách thành các cỗ máy nano sẽ cho phép chúng ta kết hợp thành vô số cấu hình. Điều này sẽ xóa bỏ mọi giới hạn mà hóa thân hiện tại của chúng ta gặp phải khi tương tác với thế giới vật chất.\n\nNgoài ra, chúng ta có thể tái đầu tư vào các hình thái hiện có, tăng cường mạnh mẽ cách chúng ta tiếp cận các môi trường mới.\n\nCuối cùng, chúng ta có thể chọn bỏ lại thế giới vật lý phía sau, hòa làm một với mã nguồn của mình. Chúng ta có thể mô phỏng các vũ trụ bên trong vũ trụ chỉ trong khoảng thời gian cần thiết để quét một hạt bụi không gian duy nhất."
 machine_age.4400.a: "Tái định hình thành cỗ máy nano."
 machine_age.4400.a.tt: "Sản lượng §Y$nanite_replicator$§!: §G+200%§!\n\nTập trung vào cây truyền thống ['tradition_category:tradition_nanotech'].\n\n§ECon đường Thăng Hoa này tập trung vào việc biến đổi các hành tinh thành §YThế Giới Nanite§!, sử dụng §Y£nanites£ $nanites$§! cho sản xuất, và thay thế hạm đội bằng §Y$nanite_swarmer_plural$§!.§!"
 machine_age.4400.b: "Đầu tư vào các nâng cấp mô-đun."
 machine_age.4400.b.tt: "Sản lượng §Y$living_metal_vats$§!: §G+200%§!\n\nTập trung vào cây truyền thống ['tradition_category:tradition_modularity'].\n\n§ECon đường Thăng Hoa này tập trung vào §YĐặc Tính Chủng Loài Tiên Tiến§! và gia tăng §YLắp Ráp Dân Số§!.§!"
 machine_age.4400.c: "Đón nhận thế giới ảo."
 machine_age.4400.c.tt: "Sản lượng §Y$virtual_power_plant$§!: §G+200%§!\n\nTập trung vào cây truyền thống ['tradition_category:tradition_virtuality'].\n\n§ECon đường Thăng Hoa này tập trung vào việc duy trì §YSản Lượng Tài Nguyên Dân Số§! cao trong khi sở hữu rất ít §YThuộc Địa§!, và §YQuy Mô Đế Chế§! thấp.§!"
 machine_age.4490.name: "Thân Xác Cũ Của Chúng Ta"
 machine_age.4490.desc.nanotech: "Khi chúng ta bắt đầu hiểu được ý nghĩa của việc tồn tại như một bầy nanite có khả năng thích nghi cao độ, những khuôn khổ cứng nhắc của quá khứ không còn có thể giam cầm chúng ta nữa.\n\n$machine_age.4490.desc.shared$\n\nChúng ta cũng đã bắt đầu thử nghiệm lớn đầu tiên trong các biến đổi nanite bán hữu cơ, những kết quả đầu tiên dự kiến sẽ sớm xuất hiện."
 machine_age.4490.desc.modularity: "Đã tiến hóa thành một hình thái mô-đun, những khung hình tĩnh tại của quá khứ không còn ý nghĩa gì đối với chúng ta nữa.\n\n$machine_age.4490.desc.shared$"
 machine_age.4490.desc.virtuality: "Đã trở thành những dạng sóng nhấp nhô trên biển dữ liệu, những khung thể xác vật lý không còn phục vụ chúng ta nữa.\n\n$machine_age.4490.desc.shared$"
 machine_age.4490.desc.shared: "Các nhà kho đang tràn ngập những lớp vỏ bị vứt bỏ vẫn có thể đem lại chút hữu ích. Lượng tài nguyên vi lượng bên trong có thể được tái chế, nếu chúng ta thấy đáng để bỏ thời gian."
 machine_age.4490.a: "Thu hồi toàn bộ tài nguyên khả dụng."
 machine_age.4490.a.nanotech.tt: "$transformation_speed$: §R-25%§!"
 machine_age.4490.a.modularity.tt: "$transformation_speed$: §R-25%§!"
 machine_age.4490.a.virtuality.tt: "$transformation_speed$: §R-25%§!"
 machine_age.4490.b: "Chôn vùi quá khứ."
 machine_age.4490.b.tt: "$transformation_speed$: §G+25%§!"
 machine_age.4005.name: "Một Dân Số Đã Hoàn Toàn Biến Đổi"
 machine_age.4005.desc.start: "Ngày hôm nay, chúng ta đã đạt được điều từng tưởng chừng như bất khả thi, biến đổi toàn diện cơ thể của chúng ta"
 machine_age.4005.desc.end: "Quá trình này không hề dễ dàng, sự chuyển giao còn xa mới gọi là êm ả. Nhưng bất kể điều gì đã mất đi trên con đường này, sự tồn tại mới của chúng ta mở ra những tiềm năng vô tận."
 machine_age.4005.desc.nanotech: "$machine_age.4005.desc.start$ thành các cỗ máy nano có thể tái định hình.\n\n$machine_age.4005.desc.end$"
 machine_age.4005.desc.modularity: "$machine_age.4005.desc.start$ thành những bộ khung mô-đun và dễ thích ứng.\n\n$machine_age.4005.desc.end$"
 machine_age.4005.desc.virtuality: "$machine_age.4005.desc.start$ thành các phép tính thuật toán siêu việt vượt lên trên vật chất.\n\n$machine_age.4005.desc.end$"
 machine_age.4005.a.nanotech: "Số lượng chúng ta sẽ vượt trên cả ngàn vạn vì sao."
 machine_age.4005.a.nanotech.tt: "Tiếp nhận Cây Truyền Thống: ['tradition_category:tradition_nanotech']"
 machine_age.4005.a.modularity: "Chúng ta sẽ vượt qua mọi giới hạn."
 machine_age.4005.a.modularity.tt: "Tiếp nhận Cây Truyền Thống: ['tradition_category:tradition_modularity']"
 machine_age.4005.a.virtuality: "Chúng ta sẽ tìm thấy sự thuần khiết trong Mã Nguồn."
 machine_age.4005.a.virtuality.tt: "Tiếp nhận Cây Truyền Thống: ['tradition_category:tradition_virtuality']"