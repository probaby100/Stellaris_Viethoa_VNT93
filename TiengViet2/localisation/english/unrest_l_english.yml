 unrest.55.name:0 "Mầm mống nổi dậy trên [Root.GetName]"
 unrest.55.desc.standard:1 "Quần chúng trên [Root.GetName] đã bất mãn với sự cai trị của chúng ta một thời gian. Giờ đây, sự phản kháng của họ ngày càng công khai, những kẻ bất mãn đã lên tiếng kêu gọi ly khai khỏi [Root.Owner.GetName]. Nếu muốn tiếp tục duy trì quyền kiểm soát thuộc địa này, một đợt thị uy sức mạnh là điều cần thiết."
 unrest.55.desc.slave:1 "Các cuộc họp bí mật trong đêm của nô lệ, làn sóng chống đối giai cấp thống trị leo thang, hàng hóa liên tục thất thoát, mọi hiện tượng đều chỉ ra một điều. Đám nô lệ trên [Root.GetName] đang ngày càng cực đoan, và không ngừng gieo rắc tư tưởng phản kháng cũng như bất mãn cho đồng loại. Dân chúng đang xì xầm về tự do —— độc lập khỏi sự cai trị của [Root.Owner.GetName]. Nếu định tiếp tục giữ quyền kiểm soát thuộc địa, có lẽ một đợt thị uy sức mạnh là điều cần thiết."
 unrest.55.desc.gestalt_standard:0 "Những cá thể riêng lẻ trên [Root.GetName] cự tuyệt sự kiểm soát của [Owner.GetGovernmentName]. Giờ đây, sự phản kháng của chúng ngày càng công khai, những cá thể bất mãn đã bắt đầu rục rịch tổ chức một phong trào hướng tới \"độc lập\". Nếu muốn tiếp tục duy trì quyền kiểm soát thuộc địa này, một đợt thị uy sức mạnh là điều cần thiết."
 unrest.55.desc.gestalt_breakaway_gestalt:0 "Những phần tử bất thường trên [Root.GetName] đang làm cho [Owner.GetGovernmentName] khó bề kiểm soát hơn. Trừ khi dập tắt được ý định độc lập của chúng và thiết lập lại quyền kiểm soát, nếu không việc kìm kẹp thuộc địa này sẽ cực kỳ khó khăn."
 unrest.55.A:0 "Lưới trời lồng lộng, thưa mà khó lọt."

