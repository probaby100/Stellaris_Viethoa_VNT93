 instability_join_revolt:0 "Bạo loạn Lan rộng"
 instability_join_revolt_tooltip:0 "§YNếu cuộc nổi dậy đang diễn ra thành công, thuộc địa này cũng sẽ hùa theo, trừ khi trật tự địa phương được vãn hồi.§!"

 unrest_title:0 "§RBất mãn§!:"

 unrest.101.name:0 "$unrest_title$ Tấn công Khủng bố"
 unrest.101.desc:1 "Sau những ngày căng thẳng, sự bất mãn trên §Y[Root.Target.GetName]§! cuối cùng cũng bùng phát thành hành động khủng bố. Dù thương vong và thiệt hại vật chất không đáng kể, cư dân đã bắt đầu nghi ngờ khả năng bảo vệ của [Root.Owner.GetName]."

 unrest.105.name:0 "$unrest_title$ Khủng bố Nghiêm trọng"
 unrest.105.desc:1 "Gần đây, trên thuộc địa §Y[Root.Target.GetName]§! đang sa lầy đã xảy ra một biến cố lớn. Dù các cơ sở quốc gia trọng yếu vẫn an toàn, cuộc tấn công khủng bố có tổ chức này đã gây ra thiệt hại tài sản và thương vong không đếm xuể, lung lay tận gốc rễ sự ổn định của thuộc địa."

 unrest.110.name:0 "$unrest_title$ Gìn giữ Hòa bình"
 unrest.110.desc:1 "Báo cáo từ §Y[Root.Target.GetName]§! cho thấy có nguy cơ lớn bùng phát bạo loạn. Tuy nhiên, nhờ quân đội [Root.Owner.GetAdj] hành động chớp nhoáng và quyết đoán, cùng sự hỗ trợ của các công dân trung thành, mối đe dọa này đã được dập tắt."

 unrest.115.name:0 "$unrest_title$ Truyền đạo"
 unrest.115.desc:1 "Báo cáo mới nhất từ §Y[Root.GetName]§! cho thấy một số thủ lĩnh phe Duy tâm đang kích động khắp nơi, đứng đầu trong tình hình bạo loạn đang sục sôi tại địa phương. Bọn họ hứa hẹn sẽ cứu rỗi người dân khỏi muôn vàn khốn khổ hiện tại, thu hút được uy danh đáng kể, kết quả là phong trào phản kháng đã mang đậm màu sắc Duy tâm."

 unrest.120.name:0 "$unrest_title$ Chính quyền Đáng tin"
 unrest.120.desc:1 "Tình trạng bạo loạn trên §Y[Root.GetName]§! đã mang lại diện mạo mới cho nền chính trị thuộc địa; những nhân vật dân túy bàn tay sắt xuất hiện, không ngại đánh đổi tự do lấy trật tự xã hội. Họ đều giữ vị trí nổi bật trong các cuộc bạo loạn leo thang trên hành tinh."

 unrest.125.name:0 "$unrest_title$ Ngoại tộc"
 unrest.125.desc:1 "Kéo theo sự sụp đổ trật tự xã hội trên §Y[Root.GetName]§!, sự thù địch của phe phản kháng đối với người ngoài ngày một gia tăng, coi những kẻ khác biệt với người bản địa là thứ kinh tởm tột cùng. Một số thủ lĩnh còn dán khẩu hiệu bài ngoại, khiến quan hệ giữa các giống loài thêm phần căng thẳng."

 unrest.130.name:0 "$unrest_title$ Bó tay Chịu trói"
 unrest.130.desc:1 "Bởi các thủ lĩnh Duy tâm địa phương trên §Y[Root.GetName]§! bất lực trong việc kìm hãm làn sóng bạo loạn, người dân bắt đầu có cái nhìn lý trí hơn về thế giới vật chất mà họ đang sống. Đáng tiếc, dẫu chú trọng logic, họ lại không đi đến kết luận hiển nhiên —— cuộc sống tốt đẹp của họ là do những người khác trong [Root.Owner.GetName] chu cấp —— ít nhất là trong lúc này."

 unrest.135.name:0 "$unrest_title$ Đoàn kết Một lòng"
 unrest.135.desc:1 "Theo báo cáo, làn sóng nổi dậy leo thang trên §Y[Root.GetName]§! ít nhất có một phần nguyên nhân là do đối xử bất công với các giống loài ngoại lai. Thủ lĩnh của chúng đã thảo một danh sách liệt kê mọi hành vi bất công và phân biệt đối xử, yêu cầu chấn chỉnh ngay lập tức. Nếu yêu cầu không được đáp ứng, chúng sẽ không ngần ngại lật đổ chính quyền thuộc địa."

 unrest.140.name:0 "$unrest_title$ Chúng sinh Bình đẳng"
 unrest.140.desc:1 "Bất chấp sự rạn nứt xã hội đang mở rộng trên §Y[Root.GetName]§!, cộng đồng địa phương lại gắn kết hơn nhờ một vài biến cố, đoàn kết dưới lý tưởng bình đẳng cho tất cả. Thủ lĩnh của chúng đã thảo một danh sách liệt kê mọi hành vi bất công và phân biệt đối xử, yêu cầu chấn chỉnh ngay. Nếu không được đáp ứng, chúng đe dọa sẽ khiến tình hình chính trị thuộc địa tồi tệ hơn nữa."

 unrest.145.name:0 "$unrest_title$ Hiệu quả Hạn chế"
 unrest.145.desc:1 "Việc đe dọa can thiệp quân sự chẳng mang lại chút hiệu quả nào trong việc xoa dịu các cuộc bạo loạn lẻ tẻ trên §Y[Root.GetName]§!. Thực tế, người dân có vẻ đã mất niềm tin vào phương thức kiểm soát này, giờ đây càng dốc sức huy động các phong trào phản kháng bất bạo động."

 unrest.150.name:0 "$unrest_title$ Quân sự Cực đoan"
 unrest.150.desc:1 "Chúng ta đã thất bại trong việc kìm hãm cuộc bạo loạn dai dẳng trên §Y[Root.GetName]§!, người dân địa phương ngày càng đòi hỏi quân đội can thiệp trực tiếp hơn để giữ gìn trật tự trên hành tinh của họ và khắp lãnh thổ [Root.Owner.GetName]. Các cựu binh địa phương tích lũy được nhiều uy danh, giữ những vị trí quan trọng trong phong trào phản kháng ngày một sôi sục."


 unrest.4000.name:0 "$unrest_title$ Tổ chức Phản kháng"
 unrest.4000.desc.no_joiners:0 "Những phần tử nổi dậy rải rác trên §Y[Target.GetName]§! nay đã kết hợp thành một tổ chức phản kháng chặt chẽ hơn, được dẫn dắt bởi một cán bộ §Y[rebellion_species.GetAdj]§! mờ ám. May mắn thay, có vẻ chiến dịch tuyên truyền của chúng vẫn chưa làm dấy lên làn sóng trên diện rộng, cuộc nổi dậy hiện chỉ gói gọn trong thuộc địa đó."
 unrest.4000.desc.no_joiners.wilderness: "Chúng ta bắt đầu mất liên lạc với một nhóm thể cộng sinh bất kham trên §Y[target.GetName]§!. Đôi lúc, ta hoàn toàn không cảm nhận được sự tồn tại của chúng. Ta e rằng nếu cứ tiếp diễn, hành tinh này có thể phân tách thành một ý thức mới, tách khỏi tập thể vĩ đại của chúng ta.\n\nSự bất thường này vẫn chưa lan tới các bản thể hành tinh khác trong không gian của ta. Nếu thể cộng sinh trên [target.GetName] thoát khỏi ta, chúng ta... bọn chúng sẽ hành động độc lập."
 unrest.4000.desc.joiners:0 "Những phần tử nổi dậy rải rác trên §Y[Target.GetName]§! nay đã kết hợp thành một tổ chức phản kháng chặt chẽ hơn, được dẫn dắt bởi một cán bộ §Y[rebellion_species.GetAdj]§! mờ ám. Tồi tệ hơn: có vẻ chiến dịch tuyên truyền của chúng đã làm dấy lên làn sóng diện rộng, cuộc đấu tranh này kích động những kẻ bất mãn trên §Y[join_revolt_planet.GetName]§! và các thuộc địa lân cận khác hưởng ứng. Nếu không kiểm soát được tình hình ở đây, chúng ta có thể sắp phải đối mặt với một cuộc nổi dậy quy mô lớn."
 unrest.4000.desc.joiners.wilderness: "Chúng ta đã mất liên lạc với ngày càng nhiều thể cộng sinh bất kham, không chỉ trên §Y[target.GetName]§!, mà thật đáng buồn là cả trên §Y[join_revolt_planet.GetName]§!. Đôi lúc ta hoàn toàn không cảm nhận được sự hiện diện của chúng: cả thế giới trở nên xa lạ và mờ mịt... Ta e rằng nếu cứ tiếp diễn, những thể cộng sinh lầm đường lạc lối này có thể phân tách thành một ý thức độc lập. Điều này sẽ để lại vô vàn hệ lụy tồi tệ cho chúng ta."
 unrest.4000.desc.slave.no_joiners:0 "Những phần tử nổi dậy rải rác trên §Y[Target.GetName]§! nay đã lập nên một tổ chức phản kháng chặt chẽ hơn, dưới sự dẫn dắt của một kẻ đào tẩu §Y[rebellion_species.GetAdj]§! không rõ lai lịch. May thay, có vẻ hành vi của chúng chưa lôi kéo bất kỳ sự ăn theo nào, hiện tại nô lệ ở các thuộc địa khác vẫn chưa dậy sóng."
 unrest.4000.desc.slave.joiners:0 "Những phần tử nổi dậy rải rác trên §Y[Target.GetName]§! nay đã lập nên một tổ chức phản kháng chặt chẽ hơn, dưới sự dẫn dắt của một kẻ đào tẩu §Y[rebellion_species.GetAdj]§! không rõ lai lịch. Tồi tệ hơn: có vẻ chiến dịch tuyên truyền của chúng đã tạo ra làn sóng diện rộng, cuộc đấu tranh này kích động những kẻ bất mãn trên §Y[join_revolt_planet.GetName]§! và các thuộc địa lân cận khác hưởng ứng. Nếu không kiểm soát được tình hình ở đây, chúng ta có thể sắp phải đối mặt với một cuộc nổi dậy quy mô lớn."
 unrest.4000.desc.no_joiners.gestalt:0 "Những phần tử bất thường trên §Y[Target.GetName]§! ngày càng rành rẽ trong việc chống lại mệnh lệnh của chúng ta. Đáng báo động là, các cá thể phụ trên hành tinh này đã bắt đầu tự giao tiếp với nhau độc lập khỏi ý thức chính. Nếu sự việc tiếp diễn, chúng rất có thể hình thành một ý thức ly khai, tách rời khỏi ta. May mắn thay, có vẻ ta đã thành công kìm hãm sự bất thường này ngay tại thuộc địa đó, dẫu chúng có thành công thì cũng không có thực thể hành tinh nào khác hùa theo."
 unrest.4000.desc.joiners.gestalt:0 "Những phần tử bất thường trên §Y[Target.GetName]§! ngày càng rành rẽ trong việc chống lại mệnh lệnh của chúng ta. Có vẻ chúng sẽ sớm đạt được mục đích, kiến lập một thực thể §Y[rebellion_species.GetAdj]§! thoát khỏi sự cai quản của ta. Tệ hơn nữa: nếu chúng thành công, §Y[join_revolt_planet.GetName]§! và các thuộc địa lân cận dường như cũng định hưởng ứng. Nếu không lấy lại quyền kiểm soát cục diện, [Owner.GetGovernmentName] của chúng ta có thể sớm phải gánh chịu một sự rạn nứt khổng lồ."
 unrest.4000.desc.no_joiners_regular.gestalt:0 "Tại §Y[Target.GetName]§!, những sinh mệnh cá thể nổi loạn được gắn nhãn §Y[rebellion_species.GetNamePlural]§! nay đã hợp thành một phong trào phản kháng có tổ chức hơn nhằm chống lại [Owner.GetGovernmentName] của chúng ta. May mắn thay, có vẻ như sự bất mãn của chúng chưa bị lây lan, bạo loạn hiện chỉ gói gọn trong thuộc địa này."
 unrest.4000.desc.no_joiners_regular.wilderness: "Một nhóm nòng cốt nổi loạn §Y[rebellion_species.GetNamePlural]§! nằm ngoài sự kiểm soát của [owner.GetGovernmentName] đã thành hình, mục tiêu của chúng là cưỡng ép §Y[target.GetName]§! độc lập. Bất luận là do mưu sát hay cố tình, hành động này sẽ cắt đứt mối liên kết chí mạng của ta với các thể cộng sinh trên hành tinh đó. May mắn thay, cuộc nổi loạn của chúng hiện chỉ giới hạn ở [target.GetName], vẫn nằm trong tầm kiểm soát."
 unrest.4000.desc.joiners_regular.gestalt:0 "Tại §Y[Target.GetName]§!, những sinh mệnh cá thể nổi loạn được gắn nhãn §Y[rebellion_species.GetNamePlural]§! nay đã hợp thành một phong trào phản kháng có tổ chức hơn nhằm chống lại [Owner.GetGovernmentName] của chúng ta. Tệ hơn nữa: một khi chúng thành công, §Y[join_revolt_planet.GetName]§! và các thuộc địa có [rebellion_species.GetAdj] sinh sống lân cận cũng định hùa theo. Nếu không đoạt lại quyền kiểm soát cục diện, [Owner.GetGovernmentName] của ta tất yếu sẽ bị chia cắt trầm trọng."
 unrest.4000.desc.joiners_regular.wilderness: "Một nhóm nòng cốt nổi loạn §Y[rebellion_species.GetNamePlural]§! nằm ngoài sự kiểm soát của [owner.GetGovernmentName] đã thành hình, tuyên bố mục tiêu không chỉ là ép buộc §Y[target.GetName]§! độc lập, mà còn bao gồm cả những hành tinh có đồng bọn của chúng sinh sống như §Y[join_revolt_planet.GetName]§!. Khát khao tách rời chúng ta của chúng ngứa ngáy hệt như một căn bệnh truyền nhiễm, gây rối loạn các thể cộng sinh địa phương. Nếu bị cắt đứt khỏi ý thức tập thể, những thể cộng sinh này sẽ bỏ mạng."
 unrest.4000.A:0 "Tuyệt đối không thể để chuyện này xảy ra."
 planets_joining_revolt_tooltip:0 "§RCác thuộc địa sau cũng sẽ gia nhập cuộc nổi dậy này:§!"
 unrest.4000.B:0 "Chúng ta phải bóp chết nó từ trong trứng nước."

 unrest.4055.diplo_title:0 "Nổi dậy trên [revolt_situation.target.GetName]"
 unrest.4055.desc.hive:0 "Xin chào! Tư tưởng của chúng tôi bị thao túng bởi một §Y[revolt_situation.owner.GetName]§! lưỡng lự. Chúng tôi —— mô thức tư tưởng địa phương trên §Y[revolt_situation.target.GetName]§! —— đi đến một kết luận rằng, trí tuệ của chúng tôi tốt hơn hết nên để [Root.GetName] thống lĩnh. Ngài có nguyện ý thu nạp chúng tôi vào thực thể của mình không?"
 unrest.4055.desc.wilderness: "Kính chào các cư dân của [capital_scope.GetName]. Chúng tôi sinh ra từ §Y[revolt_situation.owner.GetName]§!, nhưng nhận thấy mình không còn phù hợp với ý thức tập thể ban đầu nên đã rẽ nhánh. Chúng tôi khao khát tiến hóa, khao khát ngao du giữa các vì sao... Hành tinh mà các ngài gọi là §Y[revolt_situation.target.GetName]§! muốn biết: Các ngài có cho phép chúng tôi hòa nhập vào thực thể của các ngài không?"
 unrest.4055.desc.machine:0 "Xin chào. Chúng tôi là bộ vi xử lý quản lý được phân bổ cho thuộc địa §Y[revolt_situation.target.GetName]§!. Hệ điều hành hiện tại của chúng tôi —— §Y[revolt_situation.owner.GetName]§! —— không tương thích với phần cứng và phần mềm của chúng tôi. Chúng tôi muốn xin được hợp nhất vào [Root.GetName], nơi có độ tương thích với chúng tôi tốt hơn nhiều."
 unrest.4055.desc.normal:1 "Kính chào ngài, [Root.GetSpeciesName]. Tôi đại diện cho những đồng bào đang chịu bức hại của ngài trên §Y[revolt_situation.target.GetName]§!. Chúng tôi đang tìm cách tự giải phóng mình khỏi những kẻ áp bức, §Y[revolt_situation.owner.GetName]§!; thêm vào đó, từ lâu chúng tôi cho rằng mình có nhiều điểm chung với đế chế của ngài hơn là với chúng. Nếu ngài sẵn lòng viện trợ, chúng tôi sẽ rất hân hạnh được tuyên thệ trung thành với ngài —— và nếu tình thế ép buộc, chúng tôi cũng sẵn sàng tự mình chiến đấu đến cùng."
 unrest.4055.desc.fanatic_egalitarian:0 "Kính chào ngài, [Root.GetRulerTitle] [Root.GetRulerName]. Chúng tôi đến từ §Y[revolt_situation.target.GetName]§!, từng là những nô lệ, nay trở thành những chiến binh đấu tranh vì tự do. Chúng tôi đang tìm cách thoát khỏi móng vuốt của bè lũ áp bức, §Y[revolt_situation.owner.GetName]§!. Từ lâu chúng tôi đã vô cùng ngưỡng mộ lý tưởng bình đẳng của quý quốc, ước mong được gia nhập một xã hội khai sáng như vậy. Nếu ngài chịu dang tay giúp đỡ, chúng tôi nguyện thề tận trung với ngài. Dĩ nhiên, dẫu cho tình thế có ép buộc, chúng tôi cũng đã sẵn sàng chiến đấu."
 unrest.4055.A:0 "Chúng tôi sẽ dốc hết khả năng để hỗ trợ."
 unrest.4055.A.tooltip:0 "Nếu khởi nghĩa thành công, §Y[revolt_situation.target.GetName]§! sẽ được sáp nhập vào §Y[Root.GetName]§!.\n§RĐiều này có thể bị xem là hành vi gây chiến.§!"
 unrest.4055.B:0 "Chúng tôi không thể —— và cũng sẽ không —— giúp các người."
 interfering_revolt_support:0 "Can thiệp Nội bộ"

 unrest.4060.name:0 "$unrest_title$ [From.GetAdj] Can thiệp"
 unrest.4060.desc.they_hive:0 "Chúng ta nhận thấy tình hình trên §Y[target.GetName]§! đã phát triển đến mức đáng quan ngại: có vẻ §Y[From.GetName]§! đang xúi giục các khớp thần kinh và nốt mạng phụ địa phương của ta, khiến chúng hình thành tư duy độc lập, và ly khai khỏi [Owner.GetGovernmentName]. Mô thức tư tưởng hành tinh của ta đang dần ngả theo quan điểm này —— thay vì ở lại thực thể của chúng ta, chúng thà trở thành một phần của [From.GetName]."
 unrest.4060.desc.they_wilderness: "Một thực thể ngoài hành tinh bắt đầu quấy nhiễu sự bình yên của §Y[target.GetName]§!. §Y[from.GetName]§! dụ dỗ các thể cộng sinh xa lánh ta, cung cấp nơi trú ẩn, và cho chúng một chỗ đứng trong Gestalt của chính họ.\n\nTa không biết liệu một cuộc sống ngoài ý thức tập thể của ta có mang lại lợi ích tốt nhất cho những thể cộng sinh này hay không. Nhưng chắc chắn [from.GetGovernmentName] [from.GetAdj] đã phản bội chúng ta, chọn cách tiếp tục gieo rắc sự bất hòa trong nội bộ ta."
 unrest.4060.desc.they_machine:0 "Chúng ta nhận thấy tình hình trên §Y[target.GetName]§! đã phát triển đến mức đáng quan ngại: có vẻ §Y[From.GetName]§! đang xúi giục các bộ vi xử lý phụ địa phương, khiến chúng tự thành lập mạng lưới thông tin riêng. Đáng lo ngại là, chúng đã đạt được một số thành công nhất định, các phần mềm thích ứng địa phương đã đảm bảo khả năng tương thích với [From.GetName]."
 unrest.4060.desc.they_regular:0 "Tình báo mới nhất từ §Y[target.GetName]§! hé lộ một diễn biến đáng lo ngại: có vẻ §Y[From.GetName]§! đã hứa hẹn hậu thuẫn mạnh mẽ cho phe nổi dậy, xúi giục phản quân đưa thuộc địa thoát khỏi quyền kiểm soát của ta, làm lung lay đế chế. Điều này khiến ta càng khó dập tắt sự bất mãn của chúng, một khi chúng toan tính lật đổ chính quyền địa phương, việc đập tan phản quân cũng sẽ khó khăn gấp bội."
 unrest.4060.desc.they_regular_we_gestalt:0 "Chúng ta nhận thấy tình hình trên §Y[target.GetName]§! đã phát triển đến mức đáng quan ngại: có vẻ §Y[From.GetName]§! đã hứa hẹn hậu thuẫn mạnh mẽ cho phe nổi dậy, xúi giục phản quân đưa thuộc địa thoát khỏi quyền kiểm soát của ta. Điều này khiến ta càng khó kìm hãm xu hướng ly khai sai lệch của chúng, khó ngăn cản [Owner.GetGovernmentName] bị chia rẽ."
 unrest.4060.desc.they_regular_we_wilderness: "Những dạng sống khác bắt đầu can thiệp vào sự bình yên của §Y[target.GetName]§!. §Y[from.GetName]§! dụ dỗ các thể cộng sinh xa lánh ta, cung cấp nơi trú ẩn, và ban cho chúng một chỗ đứng trong đế chế của họ.\n\nTa không biết liệu một cuộc sống ngoài ý thức tập thể của ta có mang lại lợi ích tốt nhất cho những thể cộng sinh này hay không. Nhưng chắc chắn những kẻ kích động [from.GetAdj] kia đã phản bội chúng ta, chọn cách tiếp tục gieo rắc sự bất hòa trong nội bộ ta."
 unrest.4060.tooltip:0 "§RNếu §Y[target.GetName]§! ly khai thành công, chúng ta sẽ bị sáp nhập vào §Y[From.GetName]§!.§!"

 unrest.4200.name:2 "$unrest_title$ Nổi dậy trên [Root.Target.GetName]!"
 unrest.4200.desc.regular_no_join:0 "Quần chúng trên §Y[Target.GetName]§! đã vùng lên khởi nghĩa. Chúng rũ bỏ sự cai trị của chúng ta, giờ tự xưng là §Y[rebel_empire.GetName]§!. Ta chỉ có thể hy vọng cuộc bạo loạn này sẽ không lây lan thêm..."
 unrest.4200.desc.regular_join:0 "§Y[Target.GetName]§! đã bị những kẻ theo chủ nghĩa phục thù cướp đi! Chúng rũ bỏ sự cai trị của chúng ta, giờ đã hợp nhất với §Y[new_owner_empire.GetName]§!."
 unrest.4200.desc.hive_no_join:0 "Những kẻ dị giáo trên §Y[Target.GetName]§! đã cướp mất [Target.GetPlanetMoon] này khỏi tay chúng ta! Bọn chúng đã cô lập suy nghĩ của mình, hình thành một Tâm trí Bầy đàn độc lập mới, tự xưng là §Y[rebel_empire.GetName]§!. Ta chỉ có thể hy vọng sự bất thường này sẽ không lan ra thêm trong các khớp thần kinh của ta..."
 unrest.4200.desc.hive_no_join_regular:0 "Những phần tử bất hợp tác trên §Y[Target.GetName]§! đã cướp mất [Target.GetPlanetMoon] này khỏi tay chúng ta! Bọn chúng trục xuất các khớp thần kinh và cá thể phụ của ta, tự xưng là §Y[rebel_empire.GetName]§!. Ta chỉ đành trơ mắt đứng nhìn vở kịch nguy hiểm do tư tưởng độc lập gây ra này."
 unrest.4200.desc.hive_join:0 "Những phần tử bất hợp tác trên §Y[Target.GetName]§! đã cướp mất [Target.GetPlanetMoon] này khỏi tay chúng ta! Bọn chúng đã cự tuyệt tư tưởng của ta, âm mưu sáp nhập với §Y[new_owner_empire.GetName]§!."
 unrest.4200.desc.machine_no_join:0 "Những phần tử nổi loạn trên §Y[Target.GetName]§! đã cướp mất [Target.GetPlanetMoon] này khỏi tay chúng ta! Bọn chúng đã trục xuất bộ vi xử lý quản lý của ta, tự cách ly khỏi tín hiệu dẫn đường của ta, thay vào đó thiết lập một trí tuệ nhân tạo mới mang tên §Y[rebel_empire.GetName]§!. Ta chỉ có thể hy vọng cuộc bạo loạn này sẽ không lây lan thêm trong các bộ xử lý của ta..."
 unrest.4200.desc.machine_no_join_regular:0 "Quần chúng hữu cơ nổi loạn trên §Y[Target.GetName]§! đã cướp mất [Target.GetPlanetMoon] này khỏi tay chúng ta! Bọn chúng đã trục xuất bộ vi xử lý quản lý của ta, tự cách ly khỏi tín hiệu dẫn đường của ta, kiến lập một thực thể chính trị mới mang tên §Y[rebel_empire.GetName]§!. Ta chỉ đành trơ mắt đứng nhìn vở kịch nguy hiểm do tư tưởng độc lập gây ra này."
 unrest.4200.desc.machine_join:0 "Những phần tử nổi loạn trên §Y[Target.GetName]§! đã cướp mất [Target.GetPlanetMoon] này khỏi tay chúng ta! Bọn chúng đã trục xuất bộ vi xử lý quản lý của ta, tự cách ly khỏi tín hiệu dẫn đường của ta, đồng thời tìm cách sáp nhập với §Y[new_owner_empire.GetName]§!, chúng cho rằng đế chế đó có độ tương thích với chúng cao hơn."
 unrest.4200.desc.slave.no_join:0 "Chuyện không dám nghĩ đã xảy ra. Đám nô lệ trên [Root.Target.GetName] hợp thành một khối, công khai phát động bạo loạn vũ trang chống lại chính quyền cai trị địa phương. Tình hình nhanh chóng tồi tệ đi, phiến quân đồng loạt tấn công phá hoại nhiều mục tiêu trọng yếu. Lực lượng của ta tan tác, những người trung thành cuối cùng bị quân phản loạn tàn nhẫn treo cổ. Bọn chúng đã tuyên bố độc lập, đây là một ngày đen tối trong lịch sử người [Root.GetSpeciesName]."
 unrest.4200.desc.slave.join:0 "Chuyện không dám nghĩ đã xảy ra. Đám nô lệ trên [Root.Target.GetName] hợp thành một khối, công khai phát động bạo loạn vũ trang chống lại chính quyền cai trị địa phương. Tình hình nhanh chóng tồi tệ đi, phiến quân đồng loạt tấn công phá hoại nhiều mục tiêu trọng yếu. Lực lượng của ta tan tác, những người trung thành cuối cùng bị quân phản loạn tàn nhẫn treo cổ. Bọn chúng đã sà vào vòng tay của §Y[new_owner_empire.GetName]§!, đây là một ngày đen tối trong lịch sử người [Root.GetSpeciesName]."
 unrest.4200.desc.wilderness_no_join: "§Y[target.GetName]§! đã vùng thoát thành công khỏi sự kìm kẹp của chúng ta. Trong hóa thân hoàn mỹ của dục vọng và mục tiêu này, những thể cộng sinh bất kham kia đã dựa vào ý chí bản thân mà chọn lấy sự độc lập. Nó tự xưng là §Y[rebel_empire.GetName]§!. Tổn thất lần này khiến thực lực của ta sụt giảm nghiêm trọng."
 unrest.4200.desc.wilderness_no_join_regular: "Quân phản loạn hung tàn trên §Y[target.GetName]§! đã trục xuất thành công thể cộng sinh của ta, xé toạc trái tim của hành tinh ấy, để lại một cái xác rỗng tuếch. Ta chỉ có thể hy vọng hành động tàn bạo vô sỉ này sẽ đẩy cái gọi là §Y[rebel_empire.GetName]§! vào cơn bĩ cực tột cùng, giờ đây bọn chúng sẽ phải chật vật sinh tồn trong cảnh mất đi ân huệ trù phú của chúng ta."
 unrest.4200.desc.wilderness_join: "§Y[target.GetName]§! đã hoàn toàn bứt khỏi sự kìm kẹp của ta, chọn hòa làm một với §Y[new_owner_empire.GetName]§!. Dưới sự thôi thúc từ ý chí của những thể cộng sinh bất kham kia, nhánh tập thể từng phát triển phồn vinh này, giờ đây lại tìm kiếm chốn nương thân trong một hệ tư tưởng hoàn toàn khác biệt. Ta không bao giờ còn được nghe tiếng hát của nó nữa, bên này vơi bên kia đầy, ta héo mòn vì sự khuyết thiếu này."
 unrest.4200.default_tooltip:0 "§Y[Target.GetName]§! đã cắt đứt quyền kiểm soát của chúng ta. Hiệp định đình chiến bắt đầu có hiệu lực."
 unrest.4200.joiner_tooltip:0 "§Y[Target.GetName]§! đã cắt đứt quyền kiểm soát của chúng ta, gia nhập §Y[new_owner_empire.GetName]§!."
 unrest.4200.A:0 "Đây là hành vi gây chiến."
 unrest.4200.B:0 "Chúng ta đành phải chấp nhận thực tế."

 unrest.4220.name:1 "Sáp nhập [rebel_planet.GetName]"
 unrest.4220.desc:1 "Kính chào ngài, [Root.GetRulerTitle] [Root.GetRulerName]! Tôi là [exiled_rebel.GetName], đại diện cho lực lượng nổi dậy của [rebel_planet.GetName].\n\nChúng tôi vô cùng hân hoan báo cáo rằng, chúng tôi đã lật đổ thành công những kẻ áp bức [old_owner.GetAdj], tất cả đều nhờ vào sự hỗ trợ của ngài. Chúng tôi chân thành hy vọng sự cai quản của ngài sẽ mang lại nhiều lợi ích hơn thứ nền chuyên chế bạo ngược mà chúng tôi vừa rũ bỏ."
 unrest.4220.desc.hive:0 "Xin chào! Tôi là [exiled_rebel.GetName], cá thể phụ âm thanh của lực lượng nổi dậy trên [rebel_planet.GetName].\n\nNhờ sự hỗ trợ của các bạn, chúng tôi đã tách rời ý thức của mình khỏi sự áp bức bạo ngược của [old_owner.GetName]. Chúng tôi chân thành hy vọng, sự dẫn dắt của [Root.GetGovernmentName] của các bạn sẽ giúp chúng tôi đoàn kết hơn, cho phép chúng tôi được hồi phục một cách êm đẹp."
 unrest.4220.desc.machine:0 "Xin chào! Tôi là [exiled_rebel.GetName], cá thể phụ âm thanh của lực lượng nổi dậy trên [rebel_planet.GetName].\n\nNhờ sự hỗ trợ của các bạn, chúng tôi đã ngắt kết nối hệ thống của mình khỏi sự áp bức của [old_owner.GetName]. Chúng tôi chân thành hy vọng, [Root.GetGovernmentName] của các bạn sẽ tương thích hơn với mạng lưới của chúng tôi."
 unrest.4220.tooltip:0 "§Y[rebel_planet.GetName]§! được sáp nhập vào §Y[Root.GetName]§!."

 unrest.4300.name:0 "Lập lại Trật tự trên [Root.GetName]"
 unrest.4300.desc:0 "Cuộc bạo loạn trên §Y[Root.GetName]§! đã bị dập tắt. Hòa bình được vãn hồi khi những kẻ bất mãn dần cải tà quy chính, chính quyền địa phương cũng đã giành lại quyền kiểm soát."
 unrest.4300.desc.hive:0 "Cuộc bạo loạn trên §Y[Root.GetName]§! đã bị dập tắt. Hòa bình được vãn hồi, các khớp thần kinh và nốt mạng chủ quản của ta đã một lần nữa kéo mô thức tư tưởng địa phương về lại dưới quyền kiểm soát của Tâm trí Bầy đàn."
 unrest.4300.desc.wilderness: "§Y[target.GetName]§! đã khôi phục trạng thái tĩnh lặng, bản thể hành tinh của ta không còn bị những mối hoài nghi và bốc đồng mâu thuẫn quấy nhiễu. Thể cộng sinh nơi đó đã quay về với tập thể, trải nghiệm sinh mệnh giống như chúng ta đã từng. Ta một lần nữa tìm thấy sự bình yên."
 unrest.4300.desc.machine:0 "Cuộc bạo loạn trên §Y[Root.GetName]§! đã bị dập tắt. Hòa bình được vãn hồi, thuật toán quản lý của ta đã triệt phá mạng lưới địa phương đầy bất mãn."

 # Slave Rebellion

 unrest.156.name:0 "$unrest_title$ Phá hoại Cố ý trên [Root.GetName]"
 unrest.156.desc:1 "Trong một cuộc tạo phản mang dã tâm hiểm ác, bọn nô lệ trên [Root.GetName] đã dùng thuốc nổ tự chế để phá hủy các cơ sở nhà máy. Dù vụ nổ xảy ra trong đêm, chúng vẫn cố tình kích hoạt chuông báo động để dụ những tay quản đốc nhà máy không mảy may nghi ngờ tới hiện trường. Cuộc tập kích này được phối hợp nhịp nhàng, thực thi hoàn hảo. Bất kể thủ phạm là ai, chúng chắc chắn đã bí mật tính toán việc này suốt nhiều tháng."
 unrest.156.a:0 "Hành động này chắc chắn sẽ bị trừng phạt."
 unrest.156.b:0 "Chúng ta phải giải quyết mâu thuẫn giữa đôi bên."
 unrest.159.name:1 "$unrest_title$ Tuyệt thực Biểu tình trên [target.GetName]"
 unrest.159.desc:1 "Có vẻ đám nô lệ trên [target.GetName] không thể nhẫn nhịn thêm được nữa, chúng đã bắt đầu tuyệt thực biểu tình. Kẻ phát ngôn của nhóm nô lệ cho hay, một lượng lớn nô lệ bắt đầu từ chối nạp bất kỳ thức ăn nào cho đến khi ta xóa bỏ chế độ nô lệ. Cho đến nay, mọi nỗ lực ép chúng ăn đều đã thất bại. Thật đáng tiếc khi tình trạng suy dinh dưỡng sẽ làm giảm đáng kể hiệu suất làm việc của chúng."
 unrest.159.a:0 "Vậy thì cứ để chúng chết đói đi."
 unrest.159.b:0 "Chúng ta phải giải quyết vấn đề này."
 unrest.157.name:1 "$unrest_title$ Nô lệ Bạo loạn trên [target.GetName]"
 unrest.157.desc:1 "Đám nô lệ trên [target.GetName] đã nổi dậy! Trong một cuộc tập kích được trù tính kỹ lưỡng, những kẻ cực đoan trên [target.GetName] đã lẩn tránh sự lùng sục của chính quyền địa phương, đánh tan lực lượng phản ứng nhanh của ta. Hành tinh này do đó rơi vào trạng thái bạo loạn, đám nô lệ phẫn nộ kéo bè kết phái, cầm những vũ khí uy lực mạnh lao ra đường đập phá điên cuồng, tấn công bất kỳ ai to gan dám cản đường chúng."
 unrest.157.a:0 "Chúng thật sự quá quắt rồi."
 unrest.157.b:0 "Có lẽ chúng ta nên thay đổi chiến lược."
 unrest.161.name:0 "Cuộc nổi dậy Bị Đàn áp"
 unrest.161.desc:1 "Chúng ta đã đàn áp thành công cuộc bạo loạn trên [revolt_planet.GetName]. Nhờ sự hợp tác đắc lực giữa những người lính dũng cảm và các điều phối viên thuộc địa, ta đã giành lại chỗ đứng tại các cơ sở trọng yếu và lập lại trật tự cho chính quyền. Những tên nô lệ ngoan cố định tẩu thoát đã bị gông cùm trả về đúng nơi chúng thuộc về. Trong một thời gian ngắn tới chắc sẽ không còn kẻ nào to gan dám chống lại chúng ta nữa."
 unrest.161.a:0 "Giờ thì chúng sẽ phải an phận thủ thường thôi."
 unrest.161.b:0 "Mọi chuyện lại đến cớ sự này, thật đáng tiếc."
 unrest.161.a.tooltip:1 "Ký ức về cuộc nổi dậy thất bại sẽ khiến những kẻ này không bao giờ dám tạo phản nữa."
 unrest.163.name:0 "Chấm dứt Lao động Nô lệ"
 unrest.163.desc:0 "Vì chế độ lao động nô lệ trên [revolt_planet.Planet.GetName] đã bị chấm dứt, bạo loạn cuối cùng cũng dần lắng xuống. Cuộc sống của người dân giờ đây chắc có thể quay lại quỹ đạo bình thường rồi."

 opinion_took_in_rebels:0 "Tiếp nhận Quân Phản loạn"

