l_english:

 ### Unrest

 situation_planetary_revolt:0 "Nổi dậy trên hành tinh [Target.GetName]"
 situation_planetary_revolt_type:0 "Nổi dậy trên hành tinh"
 situation_planetary_revolt_desc_standard:0 "Quần chúng nổi dậy đang chực chờ lật đổ quyền cai trị của chúng ta trên [Target.GetName]!"
 situation_planetary_revolt_desc_slave:0 "Những nô lệ vùng lên đang mưu toan lật đổ quyền cai trị của chúng ta trên [Target.GetName]!"
 situation_planetary_revolt_desc_gestalt_standard:0 "Những sinh vật hữu cơ cá biệt bất kham đang cố tách mình khỏi [Owner.GetGovernmentName] của chúng ta."
 situation_planetary_revolt_desc_gestalt_breakaway_gestalt:0 "Những cá thể bất thường vô trật tự trên [Target.GetName] đang cố kéo cả hành tinh tuột khỏi tầm kiểm soát của chúng ta."
 situation_planetary_revolt_desc_gestalt_breakaway_wilderness: "Một nhóm thể cộng sinh ngoan cố đang tìm cách tách khỏi [owner.GetGovernmentName] của chúng ta."
 situation_planetary_revolt_monthly_change_tooltip:1 "Mức độ bất mãn trên §Y[Target.GetName]§! càng cao và số dân trên [Target.GetPlanetMoon] càng đông, §YTình huống§! sẽ tiến triển càng nhanh. Ở giai đoạn sau của tình huống, các thuộc địa và đế chế khác có thể cũng sẽ hỗ trợ cuộc nổi dậy, khiến tình hình thêm mất kiểm soát.\n\nChúng ta có thể làm chậm tiến trình bằng cách nâng cao $r_stability$, giảm tỷ lệ £job_unemployment£ §YThất nghiệp§!, đóng quân một §YLục quân§! £defense_army£ trên hành tinh, và củng cố §YCăn cứ Sao§!.\n\n§YDi dời cưỡng chế§! £pop£§HDân số§! khỏi [Target.GetName] cũng sẽ đẩy nhanh tiến trình nổi dậy."
 situation_planetary_revolt_complete_tooltip:0 "§Y[Target.GetName]§! sẽ ly khai khỏi §Y[Owner.GetName]§! và tuyên bố độc lập."
 situation_planetary_revolt_complete_joiner_tooltip: "§Y[Root.Target.GetName]§! sẽ nổi dậy và sáp nhập vào đế chế này."
 situation_planetary_revolt_fail_tooltip:0 "§Y[This.GetName]§! sẽ thất bại, mọi hệ số trừng phạt do nó sinh ra sẽ bị gỡ bỏ."
