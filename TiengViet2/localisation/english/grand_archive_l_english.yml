 bombardment_frenzied_voidworm_invasion_desc: "- Hành tinh bị tàn phá hoàn toàn sẽ biến thành §Y$pc_shattered$§!"

 alert_space_fauna_bombardment_title: "Trùng Hư Không đang oanh tạc thuộc địa của chúng ta!"
 alert_space_fauna_bombardment_instant: "Thuộc địa của chúng ta đang bị các loài ký sinh thiên hà oanh tạc!\nChúng mang theo một lượng bào tử hữu hạn để phát tán lên các thuộc địa đông dân và sẽ sớm rời đi."
 ALERT_SPACE_FAUNA_BOMBARDMENT_DETAIL: "$PLANET_NAME|Y$ trong hệ sao $SYSTEM_NAME|Y$. Dân số còn lại sắp bị nuốt chửng: §Y$POPS_TO_KILL$§!."

 grand_archive.2195.name: "Ký Sinh Trùng Thiên Hà"
 grand_archive.2195.desc.common_1: "[from.GetName] đang bị tấn công.\n\nMột đàn lớn Trùng Hư Không đang ở trên quỹ đạo của thuộc địa, oanh tạc hành tinh bằng các u nang ký sinh."
 grand_archive.2195.desc.common_2: "Phân tích sinh học chỉ ra rằng mỗi ổ Trùng Hư Không chỉ có một lượng u nang hữu hạn để phát tán, và rất có thể chúng sẽ rời đi khi tất cả đã cạn kiệt. Cho đến lúc đó, chúng ta đang phải chịu tổn thất dân số nặng nề."
 grand_archive.2195.desc.default: "$grand_archive.2195.desc.common_1$\n\nMỗi u nang chứa một bào tử độc hại cực kỳ chết chóc không chỉ đối với cư dân thuộc địa mà còn đối với mọi sự sống. Một khi bị nhiễm phải, nó sẽ nhanh chóng phát triển thành một ấu trùng nhộng, sau đó xé toạc vật chủ chui ra dữ dội và hủy diệt hoàn toàn vật chủ. Những con nhộng này chứa một túi khí nén cho phép chúng bay vút lên tầng khí quyển trên, nơi chúng theo bản năng tự đẩy mình đến một điểm đến đã định sẵn.\n\n$grand_archive.2195.desc.common_2$"
 grand_archive.2195.desc.rocks: "$grand_archive.2195.desc.common_1$\n\nMỗi u nang chứa một bào tử độc hại cực kỳ chết người đối với mọi loài động vật bản địa. Một khi bị nhiễm, nó sẽ phát triển nhanh chóng thành một ấu trùng nhộng, sau đó xé toạc vật chủ chui ra và hủy diệt hoàn toàn vật chủ. Lũ nhộng này, vốn thường ăn các tiểu hành tinh để lấy kim loại quý, nay chớp thời cơ săn lùng và ăn thịt các [this.GetColonistPlural] dễ bị tổn thương của chúng ta. Mỗi con non chứa một túi khí nén cho phép chúng bay lên tầng khí quyển trên, nơi chúng theo bản năng tự phóng mình đến một điểm đến định sẵn.\n\n$grand_archive.2195.desc.common_2$"
 grand_archive.2195.a: "Đáng bất an."
 grand_archive.2195.a.homicidal: "Chúng sẽ phải diệt vong."

