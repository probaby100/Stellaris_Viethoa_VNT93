 leviathans.4100.tooltip.no_reward.xeno_geology: "$leviathans.4100.tooltip.no_reward$ $EXHIBITION_XENO_GEOLOGY$"

 leviathans.4105.desc: "Tất nhiên rồi.\n\nCác bạn muốn tìm hiểu điều gì?"
 leviathans.4105.a: "Chúng tôi quan tâm đến sự hướng dẫn của các bạn trong các lĩnh vực cụ thể."
 leviathans.4105.b.common: "Chúng tôi muốn mua bản thiết kế cho"
 leviathans.4105.b.aesthetic_wonder: "$leviathans.4105.b.common$ một bảo tàng §Y$EXHIBITION_AESTHETIC_WONDERS$§!."
 leviathans.4105.b.historical_item: "$leviathans.4105.b.common$ một bảo tàng §Y$EXHIBITION_GALACTIC_HISTORY$§!."
 leviathans.4105.b.xeno_geology: "$leviathans.4105.b.common$ một bảo tàng §Y$EXHIBITION_XENO_GEOLOGY$§!."
 leviathans.4105.c: "Chúng tôi muốn mua một §YDi Vật§!."
 leviathans.506.g: "Các bạn có thể trợ giúp điều gì khác cho §YBộ Sưu Tập§! của chúng tôi?"

 leviathans.4110.desc: "Chúng tôi chỉ có thể hỗ trợ chia sẻ chuyên môn trong một lĩnh vực. Chúng tôi rất ít người, mà thiên hà thì lại quá rộng lớn.\n\nCác bạn cần giúp đỡ về điều gì?"
