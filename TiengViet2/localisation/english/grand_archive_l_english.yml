 # First Contacts
 first_contact_critters.15.desc.primal_calling: "Đáng chú ý, có một trật tự tôn ti mẫu hệ ở trung tâm của mỗi đàn §HTiyanki§!, với một con cái duy nhất dẫn đầu đàn tại bất kỳ thời điểm nào. Con cái được ưu tiên tiếp cận mọi nguồn thức ăn, cho phép chúng sản sinh khí mẫu thể cho con non và định hướng các cuộc di cư của đàn. Do đó, con đực sẽ từ bỏ việc nạp dinh dưỡng bất cứ khi nào tài nguyên khan hiếm, thúc đẩy chúng đi trinh sát tìm kiếm thêm thức ăn trong lúc đàn nghỉ ngơi."
 first_contact_critters.25.desc.primal_calling: "Tất cả ngoại trừ những mẫu vật non nớt nhất đều đi kèm các sinh vật bán độc lập được điều khiển thông qua chất tiết pha trộn RNA. Những \"roi mao\" này tấn công theo những mô thức phức tạp, vì vậy mặc dù dường như thiếu đi trí năng, §H\"Trùng Biến Hình Không Gian\"§! vẫn là những kẻ săn mồi tự nhiên vô cùng thiện nghệ."
 first_contact_critters.35.desc.primal_calling: "Những sinh vật này dường như giao tiếp với nhau thông qua sự thay đổi màu sắc của ánh sáng khúc xạ. Mặc dù phương thức này có tiềm năng lớn cho những biểu đạt phức tạp, nó chỉ được các dạng sống bán tri giác này sử dụng một cách cơ bản. Sự thay đổi màu sắc có thể dùng để thể hiện địa vị bầy đàn, sự hung hăng, và thậm chí cả tình trạng sinh sản."
 grand_archive.2005.desc.primal_calling: "Những sinh vật ký sinh này thiếu khả năng sinh sản tự nhiên và phải dựa vào việc chiếm đoạt các vật chủ trên các hành tinh. Phải thu hoạch đủ vật chất hữu cơ từ các hành tinh có cư dân để §H\"Trùng Hư Không\"§! sản sinh ra một loại hormone tối quan trọng trong các bộ ba giao phối của chúng, được gọi là \"troika\". Là loài lưỡng tính, việc lựa chọn bạn tình được quyết định chủ yếu bởi các đặc điểm thể chất bổ trợ lẫn nhau và kích thước tương đương."
 grand_archive.2900.desc.primal_calling: "Chúng ta tin rằng những sinh vật này lựa chọn tiểu hành tinh dựa trên thành phần khoáng chất cũng như kích thước. Trong khi mẫu vật đầu tiên chúng ta chạm trán có sự ưu tiên sinh học đối với [GetCommonMineral], rất có thể mỗi cá thể sẽ phát triển khả năng thích nghi này theo thời gian dựa trên môi trường hiện tại của chúng. Các kết quả quét cho thấy dấu vết của kim loại này hiện diện khắp tiểu hành tinh vật chủ, cũng như bên trong hệ thần kinh và đường tiêu hóa của chính §H\"Cutholoid\"§!."
