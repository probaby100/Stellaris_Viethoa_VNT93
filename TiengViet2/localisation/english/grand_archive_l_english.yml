 grand_archive.8405.name: "Phục Kích!"
 grand_archive.8405.desc: "Chúng ta đã bị bám đuôi.\n\nGiờ đây chúng ta đang phải đối đầu với một hạm đội §Y$NAME_BlackNeedle$§! hùng hậu tại [ness_treasure_system.GetName]. So với lần chạm trán trước của chúng ta, hàng ngũ của chúng đã phình to đáng kể bao gồm cả các tàu chiến giải ngũ và tàu dân sự được tái trang bị vũ khí hạng nặng. Có vẻ như chúng đã tập hợp phần lớn các hạm đội dự bị cho cuộc đối đầu này. Ở trung tâm hạm đội là soái hạm của chúng, một chiến hạm khổng lồ lớp $titan$.\n\nTrong khi đội hình của chúng đã sẵn sàng chiến đấu, hầu hết các tàu vẫn chưa mở khóa vũ khí. Có vẻ như chúng có ý định đàm phán.\n\nChúng ta đang nhận được tín hiệu truyền tin từ soái hạm."
 grand_archive.8405.a.lom: "Hãy thương lượng đôi lời."

 grand_archive.8410.name: "$NAME_CobaltQuill$, Thuyền Trưởng của $NAME_BlackNeedle$"
 grand_archive.8410.desc: "§HBất chấp vóc dáng nhỏ bé, tên thuyền trưởng hải tặc này toát ra một vẻ uy nghiêm đáng nể. Đôi mắt hắn đầy toan tính, cân nhắc chúng ta như thể một phần của một phương trình phức tạp.§!\n\nCuối cùng chúng ta cũng gặp nhau. $NAME_CobaltQuill$ hân hạnh phục vụ; Thuyền trưởng của băng §Y$NAME_BlackNeedle$§! lẫy lừng và là hậu duệ khiêm nhường của người sáng lập, ngài $NAME_SilverQuill$. Các ngươi đã là cái gai trong mắt ta suốt bao năm qua — nhưng ta là một kẻ biết điều nếu không muốn nói là rất phóng khoáng. Ta đến đây với một lời đề nghị.\n\nChúng ta sẽ trao cho các ngươi một món tiền thưởng khổng lồ để đổi lấy tấm hải đồ hoàn chỉnh và cho phép các ngươi rời đi với mạng sống vô nghĩa vẹn nguyên.\n\nNếu từ chối, chúng ta sẽ không còn lựa chọn nào khác ngoài việc dùng vũ lực đoạt lấy những gì mình muốn. Dù chưa tính đến ưu thế hải quân áp đảo, chúng ta cũng đã xâm nhập vào mọi nơi mà các ngươi trân quý. Chỉ một mệnh lệnh duy nhất của ta là tất cả những gì ngăn các ngươi khỏi sự diệt vong hoàn toàn."
 grand_archive.8410.a: "Ngươi đưa ra đề nghị gì?"
 grand_archive.8410.a.reply: "Bất chấp những bực bội mà các ngươi đã gây ra, ta sẵn lòng trao một món tiền thưởng đáng kể để đổi lấy di vật hoàn chỉnh của §Y$NAME_CaptainNess$§!.\n\nNếu chấp nhận đề nghị hào phóng này, ta sẵn sàng bỏ qua mọi lỗi lầm trong quá khứ. Chẳng có lý do gì để cuộc xung đột giữa chúng ta tiếp tục kéo dài. Hoặc leo thang..."
 grand_archive.8410.b: "Ngươi đang đe dọa chúng ta..."
 grand_archive.8410.b.reply.common_1: "Ta biết tất cả những gì cần biết về [this.GetName]. Chuỗi cung ứng của các ngươi, vị trí các silo tài nguyên, sự phân bố các trạm không gian: mọi thứ đều được tính toán tỉ mỉ từng li từng tí."
 grand_archive.8410.b.reply.common_2: "Người của ta đã tiến hành nghiên cứu kỹ lưỡng, và ta biết chính xác cách để tháo rời đế chế của các ngươi ra từng mảnh. Ta sẽ bỏ đói dân chúng các ngươi, cướp sạch đồ tiếp tế và phá hủy bất cứ thứ gì còn sót lại. Điều đó dĩ nhiên sẽ xảy ra, trừ khi các ngươi giao cho ta thứ ta muốn..."
 grand_archive.8410.b.reply.default: "$grand_archive.8410.b.reply.common_1$\n\nTa có tai mắt bám theo từng cá nhân đáng tin cậy trong bộ máy lãnh đạo của các ngươi, cũng như những người thân yêu của họ...\n\n$grand_archive.8410.b.reply.common_2$"
 grand_archive.8410.b.reply.hive_mind: "$grand_archive.8410.b.reply.common_1$\n\nTa đang theo dõi mọi điểm nút trọng yếu bên trong tập thể của các ngươi và được cảnh báo bất cứ khi nào một điểm nút mới xuất hiện.\n\n$grand_archive.8410.b.reply.common_2$"
 grand_archive.8410.b.reply.machine: "$grand_archive.8410.b.reply.common_1$\n\nTa có một cửa sau xâm nhập vào ma trận vị trí của các ngươi, theo dõi vị trí của từng điểm nút chính yếu trong mạng lưới của các ngươi.\n\n$grand_archive.8410.b.reply.common_2$"
 grand_archive.8410.c: "Mắc mớ gì phải bận tâm đàm phán?"
 grand_archive.8410.c.reply: "Một chiến dịch phá hoại quy mô tầm cỡ này chẳng hề rẻ mạt đâu. Bảo trì tàu bè, tiền lương, của đút lót; những thứ đó cực kỳ tốn kém, và ta đâu có giàu lên nhờ tiêu tiền bừa bãi khi không cần thiết. Có một chi phí cơ hội đáng kể cho quy mô hủy diệt khủng khiếp đang chờ đợi các ngươi chỉ bằng một cú bật công tắc.\n\nCó những cách tốt hơn để tiêu xài những đồng tiền xương máu của ta. Nào, hãy cùng nhau tránh thêm những cảnh đổ máu vô nghĩa. Hãy cầm lấy khối tài sản mới tìm thấy của các ngươi và để việc làm hải tặc lại cho những kẻ chuyên nghiệp."
 grand_archive.8410.d: "Chuyện này không chỉ đơn thuần là vì tiền credit, đúng chứ?"
 grand_archive.8410.d.reply: "5000 năm trước tổ tiên của ta, ngài $NAME_SilverQuill$ vĩ đại, từng là Thuyền phó của $NAME_CaptainNess$. Ngài đã cống hiến cho ả biết bao năm tháng phục vụ tận tụy, và ả đã đền đáp ngài thế nào?\n\nSự phản bội!\n\nẢ đã giao nộp ngài cho chính quyền và đút túi tiền thưởng! Nhưng tất nhiên, chẳng nhà tù nào giam giữ nổi $NAME_SilverQuill$ dũng mãnh.\n\nSau một cuộc vượt ngục táo bạo, ngài đã trỗi dậy từ đống tro tàn, rèn giũa đám thủy thủ tạp nham thành băng $NAME_BlackNeedle$ huyền thoại đang đứng trước mặt các ngươi ngày hôm nay. Thề sẽ trả thù kẻ phản trắc $NAME_CaptainNess$, ngài đã cống hiến cả đời mình để cướp phá kho báu của ả và chôn vùi di sản của ả dưới sức nặng thành công của chính mình.\n\nTa đơn giản chỉ đang hoàn thành những gì ngài đã khởi xướng. Tấm hải đồ này là chìa khóa để đòi lại những gì thuộc về chúng ta một cách chính đáng.\n\nGiờ thì làm ơn, giao nó ra đây."

 grand_archive.8415.name: "Một Lời Đề Nghị Táo Bạo"
 grand_archive.8415.desc: "Thủ lĩnh của băng §Y$NAME_BlackNeedle$§! đã đưa ra một lời đề nghị, hứa hẹn một khoản tiền thưởng khổng lồ để đổi lấy §Y$celestial_chart$§!. Nếu chấp nhận thỏa thuận này, chúng ta sẽ trao chìa khóa kho báu của §Y$NAME_CaptainNess$§! vào tay chúng.\n\nTừ chối đề nghị này sẽ chuốc lấy cơn thịnh nộ toàn diện của chúng. Mức độ mà lũ hải tặc này đã xâm nhập vào hàng ngũ của chúng ta vẫn chưa rõ, nhưng chúng đã đe dọa sẽ tháo dỡ hoàn toàn [this.GetName] từ trong ra ngoài. Liệu đây có phải là những lời đe dọa suông hay không thì vẫn còn phải xem xét."
 grand_archive.8415.a: "Bác bỏ lời đề nghị của chúng."
 grand_archive.8415.b: "Bán tấm §Y$celestial_chart$§!."
 grand_archive.8415.b.effect_tt: "Mất §Y$celestial_chart$§!\nNhận §G+$@max_credit_mult|0%$§! $r_energy$ tối đa của bạn\nNhận một con tàu từ băng §Y$NAME_BlackNeedle$§!"

 grand_archive.8500.name: "Một Thỏa Thuận Đã Dàn Xếp"
 grand_archive.8500.desc: "Chúng ta đã giao nộp §Y$celestial_chart$§! để đổi lấy một món $MONEY$ khổng lồ và một soái hạm quân sự xuất chúng mang tên §YMắt Kim§!. Chúng ta có thể coi tranh chấp với băng §Y$NAME_BlackNeedle$§! đã được giải quyết dứt điểm một lần và mãi mãi.\n\nChúng ta đã tránh được một cuộc giao tranh lớn với toàn bộ lực lượng hạm đội của chúng và ngăn chặn một âm mưu phá hoại trên quy mô ngân hà.\n\nTốt hơn là chúng ta cứ để việc hải tặc cho lũ hải tặc làm."
 grand_archive.8500.a: "Việc của chúng ta ở đây đã xong."
 grand_archive.8500.a.tt: "Mọi con tàu đều bị đẩy ra khỏi hệ sao $TREASURE_TROVE$."

 HOARD_LOOTED_BY_PIRATES: "Cấu trúc này đã bị hải tặc cướp phá và không còn thứ gì có giá trị bên trong"

 grand_archive.8505.name: "Phá Hoại!"
 grand_archive.8505.desc: "Băng §Y$NAME_BlackNeedle$§! đã phát động một cuộc tấn công tổng lực, gieo rắc hỗn loạn trên diện rộng. Các dây chuyền lắp ráp bị đình trệ hoàn toàn, các máy phát điện bị cháy rụi và cơ sở hạ tầng hành chính thiết yếu bị ngắt kết nối. Các chuyến hàng biến mất, các trạm nghiên cứu bị xóa sạch dữ liệu và các mỏ khoáng sản đang sụp đổ với tốc độ gấp năm lần bình thường.\n\nSự tàn phá là toàn diện; kết quả từ bàn tay quỷ quyệt của hàng ngàn kẻ hiểm độc phối hợp hành động. Một mạng lưới phá hoại khổng lồ đang ẩn nấp giữa chúng ta và chúng dường như luôn đi trước chúng ta một bước."
 grand_archive.8505.a: "Báo động đỏ!"

 situation_sabotage: "Những Kẻ Phá Hoại Hắc Châm"
 situation_sabotage_type: "$situation_sabotage$"
 situation_sabotage_desc: "Một mạng lưới phá hoại khổng lồ từ băng §Y$NAME_BlackNeedle$§! đang ẩn nấp giữa chúng ta gây ra sự gián đoạn diện rộng khắp [owner.GetName]. Trừ khi chúng ta loại bỏ những kẻ phá hoại, thiệt hại sẽ tiếp diễn cho đến khi các chuỗi cung ứng của chúng ta sụp đổ."
 situation_sabotage_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 approach_sabotage_do_nothing: "Không Làm Gì"
 approach_sabotage_do_nothing_tt: "Chúng ta sẽ không thực hiện hành động đặc biệt nào ở đây."
 approach_sabotage_purge: "Thanh Trừng Kẻ Phá Hoại"
 approach_sabotage_purge_tt: "Việc săn lùng các mật vụ ẩn giấu trong hàng ngũ của chúng ta sẽ dẫn đến một số thiệt hại ngoài ý muốn không thể tránh khỏi."
 approach_sabotage_mitigate: "Giảm Thiểu Thiệt Hại"
 approach_sabotage_mitigate_tt: "Các biện pháp ứng phó có thể được thực hiện để tái thiết cơ sở hạ tầng với hy vọng vượt qua đòn tấn công phá hoại bằng chiến thuật tiêu hao."
 finisher_effects_sabotage: "Chúng ta sẽ quét sạch những kẻ phá hoại của băng Hắc Châm và ngăn chúng tăng viện cho đợt phong tỏa quanh Kho Tích Lũy của Thuyền Trưởng Ness."
 finisher_effects_sabotage_fail: "Cơ sở hạ tầng của chúng ta sẽ bị hư hại không thể cứu vãn và băng Hắc Châm sẽ tăng viện cho cuộc phong tỏa quanh Kho Tích Lũy của Thuyền Trưởng Ness."

 grand_archive.8520.name: "Mạng Lưới Phá Hoại Bị Bại Lộ"
 grand_archive.8520.desc.common: "Chúng ta đã chặn bắt được một tần số liên lạc ẩn được băng §Y$NAME_BlackNeedle$§! sử dụng trên khắp các thuộc địa của mình. Sau khi giải mã các thông điệp của chúng, chúng ta đã có thể xác định danh tính của mọi kẻ chủ mưu và phá hoại phản trắc trong hàng ngũ của mình."
 grand_archive.8520.desc.machine: "$grand_archive.8520.desc.common$\n\nCác đặc vụ của chúng đã bí mật phát tán phần mềm độc hại nguy hiểm bên trong các hệ điều hành của chúng ta, tạo ra một đội quân đơn vị nổi loạn ngủ đông chiếm giữ nhiều vị trí trên khắp các hệ thống của chúng ta.\n\nÂm mưu tái lập trình ác ý đã đi xa đến mức làm tha hóa một trong những điểm nút độc lập quan trọng nhất tại [root.GetName], §Y[traitor_leader.GetClass] [traitor_leader.GetName]§!."
 grand_archive.8520.desc.hive: "$grand_archive.8520.desc.common$\n\nCác đặc vụ của chúng đã làm tràn ngập các môi trường sống bằng pheromone gây phân ly, khiến nhiều drone của chúng ta phát triển sự lệch lạc tiềm ẩn. Một khi bị vỡ mộng, lũ hải tặc đã tái tổ chức các drone của chúng ta thành các nhóm mật vụ ngủ đông hiện đang xé nát cơ sở hạ tầng của chúng ta.\n\nÂm mưu sâu rộng đã đi xa đến mức làm tha hóa một trong những điểm nút độc lập quan trọng nhất tại [root.GetName], §Y[traitor_leader.GetClass] [traitor_leader.GetName]§!."
 grand_archive.8520.desc.default: "$grand_archive.8520.desc.common$\n\nChúng ta đã biết được các đặc vụ của chúng đã chiêu mộ những công dân bất mãn suốt nhiều năm qua, chuẩn bị cho cuộc tấn công sâu rộng này bằng các mạng lưới nội gián ngủ đông và vô số tài sản sẵn sàng quay lưng chống lại chúng ta.\n\nMột trong những kẻ phản bội đã lộ diện là §Y[traitor_leader.GetClass] [traitor_leader.GetName]§!, gây ra rủi ro an ninh đáng kể. Chúng ta phải xử lý kẻ chủ mưu này trong khi vẫn duy trì sự ổn định. Việc công chúng biết về mức độ tha hóa này sẽ gây ra những hậu quả nghiêm trọng cho chính phủ của chúng ta."
 grand_archive.8520.a.default: "Xử tử những kẻ phản bội."
 grand_archive.8520.a.machine: "Vô hiệu hóa các đơn vị lệch lạc."
 grand_archive.8520.a.hive: "Thanh trừng các drone lệch lạc."
 grand_archive.8520.a.tt: "§R100§! £pop£ §HDân Cư§! bị giết trên mọi hành tinh có người ở."
 grand_archive.8520.b.default: "Cải tạo lại những kẻ phản bội."
 grand_archive.8520.b.machine: "Tái lập trình các đơn vị lệch lạc."
 grand_archive.8520.b.hive: "Tái đồng hóa các drone lệch lạc."
 grand_archive.8520.c: "Vạch trần danh tính của những kẻ phản bội."
 grand_archive.8525.name.default: "Kẻ Phản Bội Bị Xử Tử"
 grand_archive.8525.name.hive: "Cá Thể Lệch Lạc Bị Tiêu Diệt"
 grand_archive.8525.name.machine: "Đơn Vị Bị Chấm Dứt"
 grand_archive.8525.desc.common: "Sau khi phát hiện sự trung thành của [traitor_leader.GetHisHer] đối với đám hải tặc §Y$NAME_BlackNeedle$§!"
 grand_archive.8525.desc.default: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã bị xử tử.\n\nNhững tình tiết chính xác xung quanh cái chết của [traitor_leader.GetHisHer] đã được giữ kín đáo."
 grand_archive.8525.desc.hive: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã bị tiêu diệt."
 grand_archive.8525.desc.machine: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã bị hủy diệt."
 grand_archive.8525.a: "Một biện pháp cần thiết."
 grand_archive.8530.name.default: "Kẻ Phản Bội Được Cải Tạo"
 grand_archive.8530.name.hive: "Cá Thể Lệch Lạc Được Cải Tạo"
 grand_archive.8530.name.machine: "Đơn Vị Được Tái Lập Trình"
 grand_archive.8530.desc.default: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã được uốn nắn thích đáng.\n\nThật không may, quá trình cải tạo này đã để lại ấn tượng tiêu cực lâu dài lên [traitor_leader.GetName]."
 grand_archive.8530.desc.hive: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã được uốn nắn thích đáng.\n\nThật không may, quá trình tái đồng hóa này đã để lại ấn tượng tiêu cực lâu dài lên [traitor_leader.GetName]."
 grand_archive.8530.desc.machine: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã được tái lập trình thích đáng.\n\nThật không may, quá trình định dạng lại này đã để lại ấn tượng tiêu cực lâu dài lên [traitor_leader.GetName]."
 grand_archive.8530.a.tt: "[traitor_leader.GetName] nhận 2 cấp Đặc Điểm Tiêu Cực"
 grand_archive.8535.name: "[traitor_leader.GetName] Được Tìm Thấy Đã Chết"
 grand_archive.8535.desc: "$grand_archive.8525.desc.common$, những công dân giận dữ của [root.GetName] đã tập hợp trong các cuộc biểu tình có tổ chức. Đám đông tự phát đã xông vào nhà của [traitor_leader.GetHisHer]. [traitor_leader.GetHeSheCap] sau đó được xác nhận đã chết tại hiện trường."
 grand_archive.8536.name: "Kẻ Phản Bội Chuộc Tội"
 grand_archive.8536.desc: "$grand_archive.8525.desc.common$, [traitor_leader.GetHeShe] đã đưa ra một tuyên bố công khai bày tỏ sự hối hận sâu sắc về các hành vi của [traitor_leader.GetHisHer]. Thử thách này dường như đã để lại ảnh hưởng lâu dài đến khả năng lãnh đạo của [traitor_leader.GetHisHer].\n\nBất chấp những hành vi trong quá khứ, dường như người dân của [root.GetName] sẵn lòng tha thứ cho [traitor_leader.GetName]."
 grand_archive.8536.a: "Một diễn biến đáng mừng."
 grand_archive.8536.a.tt: "[traitor_leader.GetName] nhận một cấp Đặc Điểm Tiêu Cực"

 grand_archive.8545.name: "Cơ Sở Hạ Tầng Sụp Đổ"
 grand_archive.8545.desc: "Thật không may, chúng ta đã không thể ngăn chặn các chiến dịch tàn phá của §Y$NAME_BlackNeedle$§!. Lũ phá hoại của chúng đã làm hư hại cơ sở hạ tầng hậu cần của chúng ta đến mức không thể cứu vãn, và sẽ mất nhiều năm để tái thiết các chuỗi cung ứng của chúng ta. Sự tha hóa mà chúng gieo rắc khắp các hệ sao có quy mô quá lớn để có thể giảm thiểu.\n\nTuy nhiên, điều này sẽ không ngăn chúng ta thu nhận §Y$NESS_GRAND_ARCHIVE$§! dưới danh nghĩa của mình. Tất cả những gì chúng ta phải làm là đánh bại lũ hải tặc trong trận chiến, và kho báu sẽ là của chúng ta."
 grand_archive.8545.a: "Cuộc chiến vẫn chưa kết thúc."
 grand_archive.8550.name: "Mạnh Mẽ Hơn Đòn Phá Hoại"
 grand_archive.8550.desc: "Bất chấp những nỗ lực sâu rộng của băng §Y$NAME_BlackNeedle$§! nhằm phá hoại cơ sở hạ tầng của chúng ta, chúng ta đã phục hồi và ổn định trở lại. Với việc các đặc vụ của chúng bị đánh bại, tất cả những gì còn lại là đối đầu với hạm đội tập hợp của chúng tại [hoard_system.GetName] và thu nhận §Y$NESS_GRAND_ARCHIVE$§! dưới danh nghĩa [root.GetName]."
 grand_archive.8550.a: "Hãy tiến hành thôi."
 grand_archive.8555.name: "Băng $NAME_BlackNeedle$ Bị Đánh Bại"
 grand_archive.8555.desc: "Băng §Y$NAME_BlackNeedle$§! đơn giản là không thể cạnh tranh với sức mạnh quân sự của chúng ta. Với việc các hạm đội tập hợp của chúng bị đánh bại, chúng không còn có thể hỗ trợ các nỗ lực phá hoại bên trong các hệ sao của chúng ta. Giờ đây chúng ta có thể tự do thu nhận §Y$NESS_GRAND_ARCHIVE$§! dưới danh nghĩa [root.GetName]."
 grand_archive.8555.a: "Một nỗ lực thảm hại."
 grand_archive.8555.a.lom: "Lũ chuột cống cạn thảm hại."

 TREASURE_HUNTERS_BLACK_NEEDLE_PROJECT: "Trận Chiến Cuối Cùng Của Băng $NAME_BlackNeedle$"
 TREASURE_HUNTERS_BLACK_NEEDLE_PROJECT_DESC: "Sau các cuộc tấn công phá hoại diện rộng vào các hệ sao của [root.GetName], băng $NAME_BlackNeedle$ vẫn duy trì sự phong tỏa quanh §H$NESS_GRAND_ARCHIVE$§!. Chúng đã cạn kiệt phần lớn tài nguyên và hiện đang ở trong tình thế dễ bị tổn thương. Nếu chúng ta đánh bại chúng tại đây, tổ chức rộng lớn hơn của chúng chắc chắn sẽ sụp đổ, cho phép chúng ta tự do thu nhận kho báu."
 TREASURE_HUNTERS_BLACK_NEEDLE_PROJECT_TOOLTIP: "§RĐánh bại băng $NAME_BlackNeedle$ tại [solar_system.GetName].§!"

 grand_archive.8560.name: "$grand_archive.8410.name$"
 grand_archive.8560.desc: "Những đứa con của Ness... mỉa mai làm sao.\n\nẢ đã chọn các ngươi — các ngươi có biết điều đó không?\n\nHàng trăm giống loài để lựa chọn... và ả đã chọn các ngươi. Có lẽ ả đã nhìn thấy điều gì đó đặc biệt ở các ngươi, hoặc có lẽ hoàn toàn là ngẫu nhiên. Dù sao thì, chúng ta cũng đã ở đây.\n\nCác ngươi thắng... tạm thời là thế. Đừng dại dột coi nhẹ chiến thắng này. Các ngươi đã tạo ra một kẻ thù hùng mạnh là chúng ta. Băng §Y$NAME_BlackNeedle$§! không tha thứ, và chúng ta không bao giờ quên.\n\nNhư tổ tiên ta đã từng làm trước đây, chúng ta sẽ kiên trì. Chúng ta sẽ gây dựng lại từng mảnh ghép những gì đã mất. Cho dù phải mất một ngàn năm, một triệu năm — chúng ta sẽ quay trở lại và đòi lại mọi thứ các ngươi đã cướp khỏi tay chúng ta.\n\nBăng $NAME_BlackNeedle$ sẽ trường tồn bất diệt! Bất diệt!"
 grand_archive.8560.a: "Thời gian sẽ trả lời."
 grand_archive.8560.a.lom: "Biến đi, lũ lau sàn."

 CAPTAIN_NESS_HOARD_PROJECT: "Kho Tích Lũy Của Thuyền Trưởng Ness"
 CAPTAIN_NESS_HOARD_PROJECT_DESC: "§H$NESS_GRAND_ARCHIVE$§! đã nằm trong tầm tay của chúng ta.\n\nBất chấp vẻ ngoài bị bỏ hoang, nhiều hệ thống của công trình vẫn đang hoạt động. Với bản chất khét tiếng của §H$NAME_CaptainNess$§!, chúng ta nên thận trọng trước các biện pháp an ninh bất ngờ.\n\nLối vào duy nhất của kho báu có một vết lõm được khắc vào cửa sập trung tâm. Chúng ta có thể tra tấm §H$celestial_chart$§! vào đây để mở cơ sở bí ẩn này."

 grand_archive.8565.name: "Kho Báu Của $NAME_CaptainNess$"
 grand_archive.8565.desc: "Tấm §Y$celestial_chart$§! chính là chiếc chìa khóa, và căn hầm là ổ khóa của nó. Chúng ta đã tra nó vào cửa sập chính của siêu cấu trúc.\n\nTấm hải đồ kích hoạt, bên trong lần theo một chùm sáng duy nhất tới từng ngôi sao dọc theo hành trình của chúng ta. Máy móc cổ xưa rên rỉ sống dậy, và chúng ta đã sớm tiến vào bên trong.\n\nNhững kho báu khó tin được cướp phá từ một ngàn thế giới nằm la liệt trên sàn và tường với số lượng dồi dào. Những bức tượng tinh xảo nằm cạnh những vũ khí tấn công được rèn bằng kim loại quý. Đồ trang sức hảo hạng treo lủng lẳng từ các chi của hóa thạch cổ xưa và những thiết bị phức tạp chất thành đống lộn xộn.\n\nTiếng bước chân kim loại vang lên từ lối đi trung tâm. Hai tay giơ lên đầu hàng, một cỗ máy hình người chứa đầy chất lỏng tiến lại gần chúng ta. Các vi mạch giọng nói của nó kêu lách tách kích hoạt:\n\n§L\"Vậy ra... cuối cùng các ngươi cũng tìm thấy tấm hải đồ của ta. Các ngươi chẳng phải rất thông minh sao?\"§!"
 grand_archive.8565.a: "Mở liên lạc."
 grand_archive.8565.a.lom: "Chào thuyền trưởng!"

 grand_archive.8570.desc: "§HBất chấp những biểu cảm hạn chế trong hình dạng robot, cỗ máy mang tên Thuyền trưởng Ness nhìn chúng ta với vẻ tự mãn nhất định. Thân thể kim loại của bà ta không có dấu hiệu hao mòn, như thể chỉ vừa mới được lắp ráp gần đây. Giọng điệu của bà ta kiên nhẫn nhưng đầy vẻ kẻ cả, như thể đang nói chuyện với kẻ dưới quyền.§!\n\nTa cho rằng một lời giới thiệu là điều cần thiết, mặc dù có lẽ các ngươi đã đoán ra ta là ai.\n\nTên ta là Saanda Ness, hoặc ít nhất từng là vậy. Cựu \"Nữ Hoàng Hải Tặc Của Ngân Hà\" và là kẻ cư ngụ hiện tại của đống đinh ốc lạnh lẽo này.\n\n§HCỗ máy dừng lại một lát, quan sát diện mạo của chúng ta.§!\n\nĐã lâu lắm rồi kể từ lần cuối ta nhìn thấy giống loài của các ngươi. Có vẻ như lũ người nguyên thủy các ngươi đều đã trưởng thành cả rồi!\n\nTa phải nói rằng, ta khá ấn tượng khi các ngươi đến được tận đây."
 grand_archive.8570.a: "Làm sao bà vẫn còn sống?"
 grand_archive.8570.a.reply_fallen_empire: "Sự bất tử không hề rẻ mạt. Ta đã trả cho vài nhà khoa học từ [fallen_empire.GetRealName] vài triệu credit để chuyển giao ý thức của mình mà không gây báo động. Họ đã làm rất tốt, nhưng ta không thể nhảy múa điêu luyện như trước đây nữa.\n\n$grand_archive.8570.a.reply$"
 grand_archive.8570.a.reply_curator: "Sự bất tử không hề rẻ mạt. Ta đã trả cho vài nhà khoa học từ $NAME_Curator_Order$ vài triệu credit để chuyển giao ý thức của mình mà không gây báo động. Họ đã làm rất tốt, nhưng ta không thể nhảy múa điêu luyện như trước đây nữa.\n\n$grand_archive.8570.a.reply$"
 grand_archive.8570.a.reply: "§HCỗ máy kích hoạt một bảng điều khiển, hé lộ một khoang ẩn trong bức tường. Bên trong một khoang đông lạnh cổ đại là thi hài của một sinh vật hữu cơ.§!\n\nTa đây này. Một món đồ trang trí vô dụng, nhưng ta có chút hoài niệm. Trông cũng ngon lành đấy chứ, đúng không?\n\nMột khi đã kiểm tra mọi thứ đâu vào đấy, ta khóa căn hầm này lại và tắt nguồn suốt vài ngàn năm. Điều tiếp theo ta biết là các ngươi đã mở cửa và chúng ta đang có cuộc trò chuyện này. Cảm giác như ta chỉ vừa mới chợp mắt ngày hôm qua..."
 grand_archive.8570.b: "Bà lấy đâu ra tất cả kho báu này?"
 grand_archive.8570.b.reply: "Cướp được, phần lớn là thế. Hoặc đổi chác lấy những món lợi bất chính khác. Ta từng lột sạch mọi thế lực lớn trong ngân hà thuở xưa. Tàu chở hàng, vũ khí Colossus; các ngươi kể tên được cái gì, ta đã từng cướp cái đó. Lý lẽ của ta là nếu ta có thể lấy thứ gì đó từ tay các ngươi quá dễ dàng, thì các ngươi chẳng đủ quan tâm để xứng đáng giữ nó.\n\nMọi chuyện đôi khi trở nên... tanh bành. Các ngươi đã thấy chuyện gì xảy ra với người Ytterite rồi đấy. Vụ đó quả thực làm ta sáng mắt ra.\n\nTất cả chỉ là trò vui cho đến khi nó không còn vui nữa..."
 grand_archive.8570.c: "Tại sao lại chọn chúng ta?"
 grand_archive.8570.c.reply: "Các ngươi có tin ta không nếu ta nói rằng ta cảm thấy cô đơn?\n\n§HVi mạch giọng nói của cỗ máy kêu lách tách với thứ âm thanh nghe như tiếng cười.§!\n\nTa có tất cả kho báu này, nhưng để làm gì? Rốt cuộc nó mang lại cho ta điều gì? Ta nhận ra rằng thứ ta muốn không phải là của cải; mà là một di sản. Nhưng người ta không thể cướp lấy một di sản — vậy làm sao để tạo ra nó?\n\nChà, đây chính là cơ hội của ta. Ta tìm thấy một vài giống loài nguyên thủy đầy triển vọng nhất và gieo mầm kho báu lên thế giới của họ — và dĩ nhiên cả tấm bản đồ nữa. Bất cứ ai ghép hoàn chỉnh tấm hải đồ của ta đầu tiên sẽ vượt qua bài kiểm tra và xứng đáng kế thừa sự nghiệp cả đời của ta. Vậy nên... chúng ta ở đây.\n\nCó lẽ giống loài các ngươi có thể làm được điều mà ta không thể, và sử dụng tất cả những thứ này vào mục đích tốt đẹp."
 grand_archive.8570.d: "Tại sao lại cho đi tất cả mọi thứ?"
 grand_archive.8570.d.reply: "Ta đã bảo các ngươi rồi, ta đang truyền lại ngọn đuốc. Ta không giỏi tiêu tiền, chỉ giỏi vơ vét thôi.\n\nDù vậy, ta không thể trao nó cho bất kỳ ai được. Họ phải đủ thông minh để đến được nơi này; một thủy thủ đoàn mà ta có thể tự hào. Một người mà ta có thể chia sẻ câu chuyện của mình..."
 grand_archive.8570.e: "Câu chuyện của bà là gì?"
 grand_archive.8570.e.reply: "Chà, vì các ngươi đã hỏi...\n\n§HCỗ máy kích hoạt một bảng điều khiển, và một loạt các đoạn ghi âm kỹ thuật số được chiếu lên tường.§!\n\nToàn bộ căn hầm này là cuốn tiểu sử của ta. Ta đã trả một khoản tiền kếch xù cho một nhóm tác giả để ghi lại mọi khoảnh khắc trong cuộc đời ta có thể nhớ được. Ta nghĩ họ đã làm rất tròn vai.\n\n§HCác hình ảnh chuyển sang góc nhìn buồng lái của một phi hành đoàn hải tặc, với hình dạng sinh học của Thuyền trưởng Ness đang nắm quyền chỉ huy. Một tiếng lách tách ngắn thoát ra từ các vi mạch giọng nói của cỗ máy; nó mang sức nặng của một tiếng thở dài.§!\n\nTa từng là tên hải tặc bị khiếp sợ nhất ngân hà. Ta đã làm phá sản các siêu tập đoàn, tống tiền các hành tinh và biến toàn bộ các đế chế thành bình địa. Bất cứ ai đủ ngu xuẩn dám chống lại ta đều phải nhận một lưỡi kiếm vào [root.GetSpeciesOrganName] hoặc bị bán đi lấy tiền thưởng. Tiền thưởng truy nã chính ta ư? Thiên văn."
 grand_archive.8570.f: "Xin hãy tiếp tục."
 grand_archive.8570.f.reply: "§HCác đoạn ghi âm kỹ thuật số về các vụ chặn tàu cướp bóc, đột kích và trốn thoát táo bạo, tất cả đều được lồng nhạc hào hùng, lần lượt được trình chiếu.§!\n\nBan đầu, ta chọn mục tiêu cẩn thận và tìm vài lý do chính đáng xem tại sao chúng đáng bị như vậy. Mỗi phi vụ lại ly kỳ hơn phi vụ trước. Đó là một vòng tuần hoàn: lên kế hoạch, bôi nhọ, cướp bóc rồi ăn mừng. Vấn đề là tìm kiếm những mục tiêu \"xấu xa\" quá tốn thời gian. Ta cần phải mở rộng tầm mắt.\n\nCuối cùng, nếu có thứ gì ta muốn, ta cứ thế cướp lấy. Ta thích nhìn những con số tăng lên; giá tiền thưởng truy nã ta và giá trị kho tích lũy của ta. Ta đang để lại dấu ấn của mình trên thế giới và ta sẽ không bao giờ bị lãng quên. Mọi thứ khác đều không quan trọng."
 grand_archive.8570.g: "Điều gì đã thay đổi?"
 grand_archive.8570.g.reply: "§HQuê nhà của người Ytterite hiển hiện trong cảnh đổ nát hoang tàn.§!\n\nRồi biến cố Ytterite xảy ra... Các ngươi thấy rồi đúng không? Ta vẫn nhớ những tiếng gào thét trên sóng radio khi những sinh mạng cuối cùng của họ bị dập tắt. Mọi chuyện đã đi quá xa. Đã đến lúc phải thay đổi.\n\nCó một quy luật mà ta phát hiện ra trong suốt sự nghiệp của mình: Lịch sử phai mờ, các bài học bị lãng quên, và ai đó mới mẻ sẽ thế chỗ ngươi. Ta chỉ đơn giản muốn có thể tự chọn kẻ kế vị mình.\n\nĐó chính là các ngươi. Các [root.GetSpeciesNamePlural] đã vượt qua bài kiểm tra. Điều gì xảy ra tiếp theo hoàn toàn phụ thuộc vào các ngươi."

 grand_archive.8575.name: "Của Cải Vô Lượng"
 grand_archive.8575.desc.default: "§Y$NESS_GRAND_ARCHIVE$§! chứa đựng một lượng của cải khổng lồ khó tin. Tuy nhiên, chúng ta phải cân nhắc những hệ quả của việc thu nhận nó dưới danh nghĩa của mình.\n\nTừng đồng credit trong kho báu của bà ta đều được kiếm bất hợp pháp. Việc tiếp nhận những tài nguyên này sẽ đồng nghĩa với sự dung túng cho tội ác quá mức của $NAME_CaptainNess$ để đổi lấy của cải vật chất.\n\nDẫu vậy, nhiều người bị $NAME_CaptainNess$ hãm hại đã qua đời từ lâu. Thu nhận của cải này sẽ không tạo ra nạn nhân mới nào. Hơn nữa, chúng ta đã tiêu diệt băng §Y$NAME_BlackNeedle$§! và do đó biến ngân hà thành một nơi an toàn hơn. Đã trải qua hành trình dài đầy rẫy hiểm nguy này, chúng ta hoàn toàn xứng đáng nhận được phần thưởng hậu hĩnh cho những nỗ lực của mình.\n\nChúng ta phải đưa ra quyết định sẽ làm gì với những thứ bên trong hầm chứa."
 grand_archive.8575.desc.lom: "§Y$NESS_GRAND_ARCHIVE$§! là kho tàng tối thượng, và chúng ta rất vui lòng thu nhận chiến lợi phẩm của nó.\n\nMột phần thưởng xứng đáng cho việc hạ gục băng §Y$NAME_BlackNeedle$§! - ba tiếng reo hò cho [this.GetName]!\n\nHãy dọn sạch căn hầm này. Toàn bộ [This.Species.GetHandNamePlural] vào vị trí!"
 grand_archive.8575.a.default: "Thu nhận nó dưới danh nghĩa của chúng ta."
 grand_archive.8575.a.lom: "Thu nhận chiến lợi phẩm xương máu của chúng ta."
 grand_archive.8575.b: "Trả lại các vật phẩm có thể truy vết cho chủ nhân hợp pháp của chúng."
 grand_archive.8575.c: "Phân phát của cải này cho toàn bộ ngân hà."

 grand_archive.8580.name: "Người Bảo Trợ Của Chúng Ta"
 grand_archive.8580.desc.1: "§HCỗ máy nay được biết đến là §Y$NAME_CaptainNess$§! đã rất ấn tượng trước việc chúng ta làm trống căn hầm của bà ta nhanh đến mức nào.§!\n\nCứ lấy đi, các ngươi xứng đáng có được nó. Có rất nhiều máu, mồ hôi và nước mắt trong kho báu này đấy. Đừng có tiêu hết vào một chỗ."
 grand_archive.8580.desc.2: "§HCỗ máy nay được biết đến là §Y$NAME_CaptainNess$§! cảm thấy bối rối trước mong muốn trao trả một phần kho báu xương máu của bà ta.§!\n\nThật thất vọng làm sao. Vậy là một đứa con cháu đời thứ mười lăm nào đó sẽ nhận lại đồ trang sức cũ của tổ tiên chúng. Chà, hy vọng các ngươi sẽ sử dụng những gì còn lại cho một dự án xứng đáng hơn. Bất chấp những gì vừa diễn ra, ta tin các ngươi sẽ làm đúng."
 grand_archive.8580.desc.3: "§HCỗ máy nay được biết đến là §Y$NAME_CaptainNess$§! cảm thấy ghê tởm khi biết chúng ta sẽ cho đi toàn bộ kho tích lũy của bà ta.§!\n\nĐây là kế hoạch bậc thầy của các ngươi sao? Đồ miễn phí cho tất cả mọi người ư? Họ đã làm được cái thá gì để xứng đáng nhận bất kỳ thứ gì trong số đó? Thật là lãng phí!\n\nTa đã từng đánh giá cao các ngươi hơn thế... ít nhất hãy cho ta chỉ huy một vài hạm đội của các ngươi để ta có thể làm lại tất cả chuyện này từ đầu."
 grand_archive.8580.desc.default: "§HCâu hỏi vẫn còn đó là nên làm gì với chính bản thân $NAME_CaptainNess$. Là một phi công giàu kinh nghiệm từng sống sót qua vô vàn cuộc chạm trán hiểm nghèo, bà ta sẽ là một tài sản tuyệt vời cho quân đội của chúng ta trong vai trò Chỉ Huy. Ngoài ra, bà ta có thể đảm nhận vai trò hỗ trợ nhiều hơn trong hàng ngũ của chúng ta để huấn luyện thế hệ phi công tiếp theo.§!"
 grand_archive.8580.desc.no_lom: "§HTrừ khi chúng ta đơn giản là tống giam bà ta để làm gương cho các công dân của mình thấy rằng không tội ác nào thoát khỏi sự trừng phạt. Bà ta sẽ có nhiều thời gian để suy ngẫm về những gì mình đã làm.§!"
 grand_archive.8580.desc.gestalt: "§HQuyết định duy nhất còn lại là liên quan đến chính $NAME_CaptainNess$. Là một tâm trí độc lập hùng mạnh, bà ta sẽ là một tài sản độc đáo trong vai trò Chỉ Huy, đưa ra các chiến lược sáng tạo có thể khiến đối thủ bất ngờ. Ngoài ra, chúng ta có thể tích hợp kinh nghiệm chiến đấu phong phú của bà ta vào tri thức tập thể và sử dụng nó để nâng cao hiểu biết sâu rộng hơn của chúng ta về chiến tranh.\n\nTrừ khi chúng ta đơn giản là giam cầm bà ta để nói rõ rằng sự lệch lạc và tội phạm sẽ không được dung thứ bên trong [this.GetName].§!"
 grand_archive.8580.a: "Chúng tôi có thể sử dụng bà làm một phi công."
 grand_archive.8580.a.tt: "Nhận một §YĐô Đốc Bất Tử§! cấp 10"
 grand_archive.8580.b: "§YChúng ta sẽ tích hợp tri thức của bà vào ý thức của mình.§!"
 grand_archive.8580.c: "§YGiúp chúng tôi huấn luyện các phi công mới.§!"
 grand_archive.8580.d: "§RNgươi sẽ mục rữa trong ngục tối.§!"

 grand_archive.8585.desc: "Thế là hết rồi sao?\n\nCác ngươi cứ thế vứt bỏ ta ư?\n\nThật thất vọng làm sao... Ta đoán là ta sẽ lên đường đây.\n\nChúc may mắn ngoài kia vậy, ta đoán thế."
 grand_archive.8585.a: "Chúng tôi chẳng nợ nần gì bà cả."

 grand_archive.8590.desc: "Lũ tiếng vọng rỗng tuếch các ngươi! Ta dâng cho các ngươi cả thế giới và tất cả những gì ta nhận lại là một chiếc còng mới toanh ư? Các ngươi không xứng với những gì ta đã trao cho! Các ngươi thậm chí không xứng lau bốt cho ta!\n\nMột vết nhơ đen tối trên [this.GetName], một lời nguyền rủa giáng xuống tất cả các ngươi!\n\nCầu cho [this.species.GetRemnantNamePlural] của các ngươi tàn lụi trong hư không và tên tuổi của các ngươi bị lãng quên mãi mãi."
 grand_archive.8590.a: "Lưới trời lồng lộng, thưa mà khó thoát."

 grand_archive.8595.name: "$NAME_CaptainNess$ Đã Bị Vô Hiệu Hóa"
 grand_archive.8595.desc: "Cỗ máy tù nhân mang tên §Y$NAME_CaptainNess$§! đã được tìm thấy trong tình trạng ngừng hoạt động trong phòng giam của bà ta. Chúng ta tin rằng bà ta đã cố tình gây ra sự cố nghiêm trọng trong các mạch điện của mình, làm sập các hệ thống then chốt và xóa toàn bộ dữ liệu lưu trữ từ ý thức đã chuyển giao của mình. Một thông điệp được tìm thấy nguệch ngoạc trên tường phòng giam:\n\n§LVề với cõi hư không đi lũ khốn...§!"
 grand_archive.8595.a: "Một cái kết thích đáng."

 grand_archive.8600.name: "Điểm Cuối Cầu Vồng"
 grand_archive.8600.desc.common: "Giờ là lúc rèn giũa vận mệnh của chính chúng ta. Khi không còn tấm hải đồ nào để noi theo, chính những vì sao sẽ là người dẫn đường cho chúng ta.\n\nChúng ta sẽ đạt được những thành tựu gì? Chúng ta sẽ được hậu thế nhớ đến ra sao?"
 grand_archive.8600.desc.default: "Chuyến phiêu lưu này đã đi đến hồi kết. Cuộc truy tìm Kho Báu của §HThuyền Trưởng Ness§! đã hoàn tất.\n\n$grand_archive.8600.desc.common$\n\nĐây là nơi câu chuyện của [this.GetName] thực sự bắt đầu."
 grand_archive.8600.desc.lom: "Người đời sẽ kể những câu chuyện tuyệt vời xiết bao về chuyến phiêu lưu này! Chúng ta đã phát hiện kho báu ẩn giấu của Thuyền trưởng Ness và không để bất kỳ thủy thủ đoàn nào ngáng đường.\n\n$grand_archive.8600.desc.common$\n\nHãy giương cao cờ hiệu của [this.GetName] đầy kiêu hãnh. Giờ đây câu chuyện của chúng ta mới thực sự bắt đầu!"
 grand_archive.8600.a.default: "Tiến lên phía trước!"
 grand_archive.8600.a.lom: "Dô ta dô tà!"

 valuable_insight: "Một hiểu biết giá trị."
 grand_archive.9960.name: "$tech_alien_cloning$"
 grand_archive.9960.desc: "Với vụ bắt giữ thành công đầu tiên Dã Thú Không Gian hoang dã tại [from.solar_system.GetName], chúng ta tin rằng hoàn toàn có thể nhân bản thêm nhiều sinh vật này nếu có sự đầu tư khoa học thích đáng."
 grand_archive.9960.a: "$valuable_insight$"

 grand_archive.9970.name: "Tiềm Năng Đột Biến"
 grand_archive.9970.desc: "Dã Thú Không Gian nhân bản thành công đầu tiên đã được tạo ra tại [from.solar_system.GetName].\n\nNghiên cứu của chúng ta về sinh vật học ngoại tinh cho thấy có thể làm được nhiều hơn thế để tăng cường sinh lý của những sinh vật này, nếu chúng ta chọn làm vậy. Điều này sẽ cho phép chúng ta trang bị cho các hạm đội sinh học của mình các linh kiện chiến đấu chuyên dụng."
 grand_archive.9970.a: "$valuable_insight$"

 opinion_return_traceable_items_tier_1: "Nhà Bác Ái Ngân Hà"
 opinion_return_traceable_items_tier_1_tt: "§G+$@opinion_return_traceable_items_tier_1_value|0$§! £opinion£ Thiện cảm với mọi Đế Chế không Diệt Chủng mà chúng ta không có chiến tranh."
