 grand_archive.10010.name: "Dự Án Đột Biến Trùng Biến Hình Không Gian Hoàn Thành"
 grand_archive.10010.desc: "Dự án đột biến thử nghiệm của chúng ta trên §YTrùng Biến Hình Không Gian§! đã hoàn tất, và mang lại một số bào quan mới thú vị: §Y$tech_unique_mutation_space_amoeba$§! có thể triển khai.\n\nNhững sinh vật cộng sinh này có thể rút cạn năng lượng từ các vật thể ở gần và truyền lại cho vật chủ, tăng cường khả năng sống sót và tái sinh."
 grand_archive.10015.name: "Dự Án Đột Biến Tiyanki Hoàn Thành"
 grand_archive.10015.desc: "Dự án đột biến thử nghiệm của chúng ta trên §YTiyanki§! đã hoàn tất, và mang lại một số cải tiến thú vị: §Y$tech_unique_mutation_tiyanki$§!\n\nChúng ta đã khuếch đại các dao động tự nhiên mà các sinh vật này sử dụng để giao tiếp trong đàn của chúng lên mức bền vững tối đa. Điều này tạo ra một trường có thể điều khiển giúp tăng cường các mô của những sinh vật khác ở gần."
 grand_archive.10020.name: "Dự Án Đột Biến Trùng Hư Không Hoàn Thành"
 grand_archive.10020.desc: "Dự án đột biến thử nghiệm của chúng ta trên §YTrùng Hư Không§! đã hoàn tất, và mang lại một số biến thể thú vị trong chu kỳ sinh sản của chúng: §Y$tech_unique_mutation_voidworm$§!\n\nChúng ta đã có thể tăng khả năng sinh sản của các u nang ký sinh mà những sinh vật này dùng để oanh tạc các hành tinh vật chủ. Kết quả là làm tăng sản lượng ấu trùng con sinh ra."
 grand_archive.10025.name: "Dự Án Đột Biến Quái Thú Cutholoid Hoàn Thành"
 grand_archive.10025.desc: "Dự án đột biến thử nghiệm của chúng ta trên §YQuái Thú Cutholoid§! đã hoàn tất, và mang lại một số kết quả thú vị: §Y$tech_unique_mutation_cutholoid$§!\n\nChúng ta đã tìm ra cách tái định hình hệ tiêu hóa khổng lồ của chúng để bắn ra các đường đạn tầm xa có vận tốc cao. Thật không may, sự biến đổi sinh học quan trọng này đồng nghĩa với việc chúng không còn có thể nuốt chửng các hạm đội địch nữa."
 grand_archive.10030.name: "Dự Án Đột Biến Thực Thể Tinh Thể Hoàn Thành"
 grand_archive.10030.desc: "Dự án đột biến thử nghiệm của chúng ta trên §YThực Thể Tinh Thể§! đã hoàn tất, và mang lại một số kết quả thú vị: §Y$tech_unique_mutation_crystalline_entity$§!\n\nVới sự biến đổi này đối với hệ gen tinh thể của chúng, mỗi sinh vật có khả năng tự phân tách thành hai sinh vật độc lập trong trường hợp gặp chấn thương nghiêm trọng. Điều này sẽ cải thiện đáng kể năng lực chiến đấu của chúng."
 grand_archive.10030.a: "$FASCINATING$"

 leviathan_unique_mutation_project_unlock_name: "Dự Án Đột Biến [FromFromFrom.GetShipSizeName]"
 leviathan_unique_mutation_project_unlock_desc: "Chúng ta đã thu hồi được vật liệu di truyền của [FromFromFrom.GetShipSizeName] mà chúng ta chạm trán tại [FromFrom.solar_system.GetName].\n\nMặc dù chúng ta thiếu hiểu biết để nhân bản một sinh vật như vậy, chúng ta vẫn có thể trích xuất những hiểu biết giá trị từ sinh học độc đáo của nó."
 grand_archive.10055.name: "$leviathan_unique_mutation_project_unlock_name$"
 grand_archive.10055.desc: "$leviathan_unique_mutation_project_unlock_desc$"
 grand_archive.10060.name: "Dự Án Đột Biến Tiyanki Mẹ Hoàn Thành"
 grand_archive.10060.desc: "Dự án đột biến thử nghiệm của chúng ta sử dụng vật liệu di truyền của $NAME_Elderly_Tiyanki$ đã hoàn tất, và mang lại một số kết quả thú vị: §H$restorative_enzymes$§!\n\nCác enzyme phục hồi hiện diện trong vật liệu di truyền của Tiyanki Mẹ có thể được tái tạo trong các tuyến tương tự trên những sinh vật khác. Điều này biến đổi mô cấu trúc của chúng thành vật liệu tái sinh, vốn sẽ tỏ ra rất hữu ích trong các đội hình dày đặc khi phát nổ."
 grand_archive.10075.name: "$leviathan_unique_mutation_project_unlock_name$"
