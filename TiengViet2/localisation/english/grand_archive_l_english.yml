 FEDERATION_VIEW_CREATURE_DESIGNER_BUTTON_CANNOT_USE_MUTATIONS: "§RChỉ có thủ lĩnh Liên Bang mới có thể thiết kế đột biến cho Dã Thú Không Gian. Một thành viên của Liên Bang phải có công nghệ §YNuôi Cấy Nhân Tạo§!.§!"
 FEDERATION_CREATURE_FLEET_DESC: "§HHạm Đội Liên Bang§! là các hạm đội đặc biệt nằm dưới quyền kiểm soát của Chủ Tịch Liên Bang. Chúng được thiết kế trong §H$CREATURE_DESIGNER$ Liên Bang§! và có thể sử dụng bất kỳ công nghệ nào sẵn có cho bất kỳ thành viên nào của Liên Bang. Hạm Đội Liên Bang không tốn chi phí bảo trì, nhưng không thể vượt quá §HSức Chứa Hải Quân Liên Bang§!, mà mỗi thành viên đóng góp ít nhất §Y$PERC|0%$§! §HSức Chứa Hải Quân§! của chính họ. Nếu các hạm đội Dã Thú Không Gian phát triển vượt quá §HSức Chứa Hải Quân Liên Bang§!, các sinh vật dôi dư sẽ được trao cho Chủ Tịch Liên Bang."

