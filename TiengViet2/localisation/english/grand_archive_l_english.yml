 ### Primal Calling
 origin_primal_calling: "Tiếng Gọi Hoang Dã"
 origin_primal_calling_desc: "Một liên kết cổ xưa ràng buộc đế chế này với các loài dã thú của họ. Những sinh vật không gian cũng chỉ đơn thuần là những loài thú hoang dã mới đang chờ đợi được hiểu rõ và thuần phục."
 origin_tooltip_primal_calling_effects: "- $HOMEWORLD$$TABBED_NEW_LINE$- $PLANETARY_MODIFIERS$ ['concept_untamed_wilds_mod']\n- $AVAILABLE_BUILDINGS$ ['concept_wildlife_ranch', £building£ $wildlife_ranch$]\n- Có thể chọn ['concept_primal_calling_stance'] đặc biệt liên quan đến §YĐộng Vật Không Gian§! khi Tiếp Xúc Đầu Tiên\n- $ADDITIONAL_TECHNOLOGIES_STRING$ ['technology:tech_genome_mapping', £society_research£$tech_genome_mapping$]\n- $GUARANTEED_RESEARCH_OPTION_STRING$ ['technology:tech_alien_life_studies', £society£$tech_alien_life_studies$]\n- Nhận hiểu biết sâu về ['technology:tech_gravity_wells', £physics_research£$tech_gravity_wells$] sau khi Tiếp Xúc Đầu Tiên với Động Vật Không Gian\n- Nhận hiểu biết sâu về ['technology:tech_alien_cloning', £society_research£$tech_alien_cloning$] sau khi bắt giữ Động Vật Không Gian\n- Nhận hiểu biết sâu về ['technology:tech_controlled_mutations', £society_research£$tech_controlled_mutations$] sau khi nhân giống Động Vật Không Gian"
 START_SCREEN_PRIMAL_CALLING: "Bất chấp những tiến bộ công nghệ vượt bậc, chúng ta vẫn gắn bó mật thiết với các loài sinh vật hoang dã trên thế giới của mình. Là những người bạn đồng hành kiên định trong suốt quá trình tiến hóa, chúng vừa là người thầy, vừa là những sinh linh mà chúng ta có trách nhiệm chở che. Chúng ta không bao giờ tước đoạt từ chúng nhiều hơn những gì chúng có thể cho đi, và sự hy sinh của chúng luôn được tôn kính.\n\nTrong khoảng không vô tận chưa được thuần hóa của vũ trụ, rất có thể chúng ta sẽ phát hiện ra những loài hoang dã khác. Nếu vậy, chúng ta sẽ đối xử với chúng bằng sự tôn trọng tương tự như với các sinh vật trên hành tinh của mình. Chúng sẽ học cách hòa nhập khi chúng ta thấu hiểu vị thế của mình, để cùng nhau trở nên hùng mạnh hơn.\n\nĐược các vì sao vẫy gọi, một khát vọng nguyên thủy đang rực cháy bên trong chúng ta. Dù ngoài kia có là bất cứ điều gì, chúng ta sẽ nghênh đón bằng niềm tin kiên định."
 START_SCREEN_PRIMAL_CALLING_NOMADS: "Chúng ta mang thế giới của mình theo cùng. Bên trong các khoang chứa khổng lồ của chiến hạm phương chu, các sinh vật từng nhào nặn nên tiến trình tiến hóa của chúng ta vẫn luôn hiện diện; họ là bạn đồng hành, là thầy dạy, là những lời nhắc nhở sống động về nguồn cội và bản sắc của chúng ta. Chúng ta không tước đoạt từ chúng nhiều hơn những gì chúng có thể trao đi, và sự hy sinh của chúng luôn được tôn kính.\n\nTrong khoảng không vô tận chưa được thuần hóa của vũ trụ, rất có thể chúng ta sẽ phát hiện ra những tạo vật hoang dã khác. Nếu đúng như vậy, chúng ta sẽ đối xử với chúng bằng sự tôn kính tương tự như các sinh linh đang cùng chia sẻ con tàu này. Chúng sẽ học cách hòa nhập khi chúng ta thấu hiểu vị thế của mình, để cùng nhau trở nên hùng mạnh hơn.\n\nĐược các vì sao vẫy gọi, một khát vọng nguyên thủy đang rực cháy bên trong chúng ta. Bất kể điều gì đang chờ đón ngoài kia, chúng ta sẽ đối mặt bằng niềm tin vững vàng."

 leader_trait_trophy_hunter: "Thợ Săn Chiến Tích"
 leader_trait_trophy_hunter_desc: "Được tôi luyện qua gian khổ và vũ trang bằng kinh nghiệm cả đời, chỉ huy này có một sự thấu hiểu kỳ lạ về Động Vật Không Gian. Chìa khóa của một chuyến đi săn thành công là suy nghĩ như con mồi, nhưng dĩ nhiên, chỉ phát bắn hoàn hảo mới có thể tạo ra chiến tích hoàn hảo."
 leader_trait_gifted_trapper: "Bẫy Thủ Thiên Bẩm"
 leader_trait_gifted_trapper_desc: "Một nhà nghiên cứu lành nghề, người luôn cẩn trọng tối đa trong việc bắt giữ và vận chuyển an toàn các mẫu vật sống. Sự tận tâm của vị lãnh đạo này đối với phúc lợi của sinh vật đã truyền cảm hứng cho những người khác nâng cao tiêu chuẩn nghiên cứu trên mọi lĩnh vực."
 leader_trait_void_hunter: "Thợ Săn Hư Không"
 leader_trait_void_hunter_desc: "Một thợ săn am tường, cực kỳ thích hợp để hạ gục những con mồi lớn. Kiên nhẫn trong cách tiếp cận, và chuẩn xác tuyệt đối khi ra đòn."
 leader_trait_void_hunter_2: "$leader_trait_void_hunter$ II"
 leader_trait_void_hunter_2_desc: "$leader_trait_void_hunter_desc$"
 leader_trait_void_tracker: "Kẻ Truy Vết Hư Không"
 leader_trait_void_tracker_desc: "Tài năng của vị lãnh đạo này trong việc bắt giữ Động Vật Không Gian hoang dã một cách hiệu quả và an toàn là vô song."
