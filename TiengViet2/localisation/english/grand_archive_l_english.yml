 ###################
 LEADER_EXECUTED: "$CLASS|H$ $LEADER|Y$ đã bị xử tử ngay lập tức."

 grand_archive.9005.name: "[fromfrom.GetName] Bị Bắt Giữ"
 grand_archive.9005.desc: "§H[fromfrom.GetClass]§! §Y[fromfrom.GetName]§! của chúng ta đã bị [from.GetName] bắt giữ trong trận chiến tại [fromfromfrom.GetName]. Chúng đòi tiền chuộc để đổi lấy mạng sống của [fromfrom.GetHisHer]."
 grand_archive.9005.desc.second: "Như đã báo cáo trước đây, Chỉ Huy [fromfrom.GetName] của chúng ta đã bị [from.GetName] bắt giữ, và họ sẵn lòng nhận tiền chuộc để đổi lấy mạng sống của [fromfrom.GetHisHer]."
 grand_archive.9005.a: "Trả tiền chuộc."
 grand_archive.9005.a.tt: "[fromfrom.GetName] sẽ được thả và quay trở lại hàng ngũ của chúng ta."
 grand_archive.9005.b: "Chúng ta nên suy nghĩ thêm về chuyện này."
 grand_archive.9005.c: "Chúng ta sẽ không trả một xu nào."

 grand_archive.9010.name: "Bước Lên Ván Gỗ"
 grand_archive.9010.desc: "Trước việc [from.GetName] không sẵn lòng trả tiền chuộc để [fromfrom.GetHisHer] được trở về, Chỉ Huy [fromfrom.GetName] của địch vẫn nằm trong sự giam giữ của chúng ta. Số phận của [fromfrom.GetHisHer] sẽ ra sao?"
 grand_archive.9010.a: "Xử tử công khai."
 grand_archive.9010.b: "Thả tù nhân trên [this.GetHomeWorldName]."
 grand_archive.9010.c: "Duy trì sự giam cầm họ."

 MESSAGE_LEADER_CAPTURED_TITLE: "Bắt Được Chỉ Huy Của Địch"
 MESSAGE_LEADER_CAPTURED_DESC: "Chúng ta đã bắt sống một Chỉ Huy của địch trong trận chiến. Chúng ta đã liên hệ với $COUNTRY$ để yêu cầu tiền chuộc đổi lấy sự trở về an toàn của họ."
 MESSAGE_LEADER_RANSOM_PAID_TITLE: "Đã Trả Tiền Chuộc"
 MESSAGE_LEADER_RANSOM_PAID_DESC: "Chúng ta đã nhận được khoản thanh toán tiền chuộc từ [this.GetName] đổi lấy sự trở về an toàn của Chỉ Huy [fromfrom.GetName] của họ."

 alert_mia_ship_stolen_title: "Tàu Địch Bị Cướp"
 alert_mia_ship_stolen_instant: "Chúng ta đã trưng dụng một tàu của địch. Nó hiện đang trên đường về thủ đô của chúng ta và sẽ sớm sẵn sàng để sử dụng."

 DEBRIS_BIO_REPURPOSING_DESC: "Mảnh xác Dã Thú Không Gian đang phân hủy sau một cuộc giao tranh tại $SYSTEM|Y$. Chúng ta có thể thu hồi một lượng vật chất sinh học quy mô $FLEET_SIZE$ từ thi hài của chúng."

