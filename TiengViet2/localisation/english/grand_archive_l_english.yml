 xeno_geology_holomuseum: "Bảo Tàng Ảnh Toàn Ký Địa Chất"
 xeno_geology_holomuseum_desc: "Một viện nghiên cứu đa năng chuyên bảo tồn và nghiên cứu các kiến trúc khoáng vật và đá quý."

 aesthetic_wonders_holomuseum: "Bảo Tàng Ảnh Toàn Ký Kỳ Quan"
 aesthetic_wonders_holomuseum_desc: "Nơi những kỳ quan của thiên hà có thể được thưởng lãm mà không bị gián đoạn."

 galactic_history_holomuseum: "Bảo Tàng Ảnh Toàn Ký Lịch Sử"
 galactic_history_holomuseum_desc: "Một kho lưu trữ giàu thông tin chứa đầy các hiện vật đại diện cho các sự kiện then chốt trong lịch sử thiên hà của chúng ta."

