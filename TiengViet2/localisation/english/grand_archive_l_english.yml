 concept_treasure_vault_desc: "$d_treasure_planet_desc$"

 job_treasure_gatherer: "Giám Tuyển Kho Báu"
 job_treasure_gatherer_plural: "Giám Tuyển Kho Báu"
 job_treasure_gatherer_desc: "Được đào tạo để giám định đủ loại hàng hóa quý hiếm và có giá trị, họ có thể trích xuất giá trị cao nhất từ các kho báu được tìm thấy trên khắp thiên hà."
 mod_job_treasure_gatherer_add: "$job_treasure_gatherer_plural$"
 mod_job_treasure_gatherer_per_pop: "§G+1§! Việc làm $job_treasure_gatherer$ mỗi $VALUE$ Dân Số"
 mod_job_treasure_gatherer_per_pop_short: "\n§G+1§! $job_treasure_gatherer$ mỗi $VALUE$ £pop£"
 job_treasure_gatherer_gestalt: "Drone Giám Định Kho Báu"
 job_treasure_gatherer_gestalt_plural: "Drone Giám Định Kho Báu"
 job_treasure_gatherer_gestalt_desc: "Có khả năng giám định mọi loại hàng hóa quý hiếm và có giá trị, chúng có thể trích xuất công năng tối đa có thể từ các kho báu được tìm thấy trên khắp thiên hà."
 mod_job_treasure_gatherer_gestalt_add: "$job_treasure_gatherer_gestalt_plural$"
