 grand_archive.2310.name: "Đại Dịch Trùng Hư Không"
 grand_archive.2310.desc.default: "Số lượng quần thể $NAME_Voidworms$ trong thiên hà đã đạt tới mức giới hạn tới hạn. Hành vi của chúng đang thay đổi rõ rệt.\n\nGiai đoạn điển hình trong vòng đời của chúng, nơi quần thể vật chủ được tha mạng để duy trì, nay đã bị phá vỡ. Dường như không còn sự quan tâm nào đến tính bền vững của các bãi sinh sản của chúng nữa.\n\nTất cả các thuộc địa của chúng ta đều trong tình trạng báo động đỏ. Sự hiện diện của $NAME_Voidworms$ trong bất kỳ hệ sao nào cũng phải được xử lý với sự thận trọng tột độ.\n\nMột cơn cuồng loạn sinh sản trên quy mô toàn thiên hà đang đổ ập xuống đầu chúng ta."
 grand_archive.2310.desc.tech: "$grand_archive.2310.desc.default$\n\nKhả năng miễn dịch mà chúng ta từng phát triển trước đây để chống lại những loài ký sinh này không còn hiệu quả như trước nữa. Chúng ta sẽ cần phải bắt đầu nghiên cứu lại từ đầu."
 grand_archive.2310.desc.nocontact: "Các báo cáo đáng lo ngại đang bị chặn bắt trên khắp thiên hà cho thấy một loài động vật không gian chưa từng được biết đến trước đây mang tên \"Trùng Hư Không\" đã bước vào giai đoạn sinh sản cuồng loạn. Những sinh vật này được báo cáo là mối đe dọa đáng kể đối với các hành tinh không có hệ thống phòng thủ hệ sao thích hợp. Tất cả các thuộc địa của chúng ta hiện đang trong tình trạng báo động đỏ."
 grand_archive.2310.a: "$DISTURBING$$DOTDOTDOT$"

 situation_voidworm_plague: "Đại Dịch Trùng Hư Không"
 situation_voidworm_plague_type: "$situation_voidworm_plague$"
 situation_voidworm_plague_desc: "Một bệnh dịch $NAME_Voidworms$ đang đổ ập xuống chúng ta.\n\nNhững sinh vật này sẽ không còn nương tay với các hành tinh vật chủ dùng làm bãi sinh sản. Chúng ta phải hành động để diệt trừ chúng, nếu không các thuộc địa của chúng ta sẽ gặp nguy hiểm khôn lường.\n\n§YMỗi con Trùng Hư Không bị tiêu diệt sẽ đẩy nhanh tiến độ Tình huống.§!"
 situation_voidworm_plague_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 finisher_effects_voidworm_plague: "Các thuộc địa của bạn sẽ không còn dễ bị tổn thương trước các đợt oanh tạc của Trùng Hư Không nữa."
 approach_voidworm_plague_do_nothing: "Không Làm Gì"
 approach_voidworm_plague_do_nothing_tt: "Chúng ta sẽ không thực hiện hành động đặc biệt nào ở đây."
 approach_voidworm_plague_support_fleets: "Chi Viện Hạm Đội Của Chúng Ta"
 approach_voidworm_plague_support_fleets_tt: "Chúng ta có thể hy sinh một phần nhỏ chất lượng cuộc sống để hỗ trợ các hạm đội quân sự chống lại hiểm họa Trùng Hư Không.\n$SITUATION_MONTHLY_CHANGE$ Tình huống: §G+0.5§!"
 approach_voidworm_plague_purge_infected_pops: "Thanh Trừng Người Bị Nhiễm"
 approach_voidworm_plague_purge_infected_pops_tt: "$NAME_Voidworms$ khi oanh tạc các thuộc địa của bạn sẽ không còn sinh ra các $NAME_Voidworms$ mới nữa.\n$SITUATION_MONTHLY_CHANGE$ Tình huống: §G+0.7§!"
 approach_voidworm_plague_search_for_cure: "Tìm Kiếm Phương Thuốc Điều Trị"
 approach_voidworm_plague_search_for_cure_tt: "Nếu có thể bẻ gãy chu trình sinh học của chúng, $NAME_Voidworms$ sẽ không còn khả năng sinh sản trong thiên hà này nữa.\n$SITUATION_MONTHLY_CHANGE$ Tình huống: §G+1.0§!"
 change_approach_will_temporarily_lock: "§SÁp dụng cách tiếp cận này sẽ khóa các cách tiếp cận khác trong §Y$@voidworm_plague_approach_cooldown_years|0$ năm§!.§!"
 too_early_to_change_approach: "§SVẫn còn quá sớm để thay đổi Phương Hướng Tình Huống thêm lần nữa.§!"

 voidworm_crisis_eradicate_chain_title: "Diệt Trừ $NAME_Voidworms$"
 voidworm_crisis_eradicate_chain_desc: "Quần thể Trùng Hư Không trong thiên hà đã đạt tới mức không thể duy trì được nữa, và chúng phải bị diệt trừ tận gốc.\n\nChúng ta đã định vị được toàn bộ các §YTổ Trùng Hư Không§! còn lại cần phải bị tiêu diệt."
 voidworm_system_poi_title: "Tiêu Diệt [prev.GetName]"
 voidworm_system_poi_desc: "Các §YTổ Trùng Hư Không§! đã được phát hiện trong hệ sao này.\n\nTiêu diệt chúng để ngăn chặn thêm các loài ký sinh mới được sinh ra."

 # Voidworms Plague Crisis Random Events #

 grand_archive.2400.name: "Linh Kiện Thặng Dư"
 grand_archive.2400.desc: "Sự hỗ trợ hạm đội được gia tăng trong các nỗ lực chống lại $NAME_Voidworms$ đã mang lại một món lợi bất ngờ gồm các linh kiện bổ sung nhờ vào các quy trình bảo trì được cải tiến. Chúng ta có cơ hội đầu tư những vật liệu này vào việc nâng cao sản lượng đóng hạm đội mới trong ngắn hạn."
 grand_archive.2400.a: "Đầu tư vào tăng viện."
 grand_archive.2400.b: "Duy trì kho dự trữ."

 grand_archive.2405.name: "Lời Kêu Gọi Tòng Quân"
 grand_archive.2405.desc.default: "Những chuẩn bị liên tục của chúng ta nhằm đối phó với hiểm họa Trùng Hư Không đã truyền cảm hứng cho một thế hệ Chỉ Huy mới. Những công dân giàu kinh nghiệm của [this.GetName] đã chọn cống hiến tài năng của mình cho công cuộc loại trừ mối đe dọa cấp thiên hà này."
 grand_archive.2405.desc.gestalt: "Những nỗ lực chuẩn bị liên tục chống lại hiểm họa Trùng Hư Không đã cho phép chúng ta sản sinh ra thêm các mắt xích lãnh đạo cấp Chỉ Huy. Bằng cách cung cấp thêm sự hỗ trợ cho các hạm đội, những mắt xích tập trung vào Chiến Đấu này đã nhận được nhiều tài nguyên hơn nhằm tạo điều kiện tích hợp nhanh chóng vào các nỗ lực quân sự của chúng ta."
 grand_archive.2405.a: "Rất truyền cảm hứng."
 grand_archive.2405.tt: "Làm mới danh sách §H$RECRUITABLE_LEADERS$§! và bổ sung 3 §HChỉ Huy§! với thêm một cấp độ thăng tiến."

 grand_archive.2410.name: "Phát Triển Nơi Tiền Tuyến"
 grand_archive.2410.desc.default: "Một kỹ sư đóng quân trên [random_shipyard.GetName] đã phát triển một bản thiết kế khái niệm mới cho hệ thống phòng thủ của tàu chiến. [random_shipyard.leader.GetHeSheCap] đang thực hiện công việc sửa chữa định kỳ trong cuộc chiến chống lại Trùng Hư Không thì [random_shipyard.leader.GetHeShe] nảy ra ý tưởng về một linh kiện mới giúp tăng cường độ cứng cáp cho các chiến hạm của chúng ta. Sau khi ý tưởng được trình lên bộ phận nghiên cứu, chúng tôi tin rằng nó có tiềm năng to lớn."
 grand_archive.2410.desc.gestalt: "Một cá thể sửa chữa của [root.GetIndividualName] đóng quân tại [random_shipyard.GetName] đã khơi dậy những hiểu biết nghiên cứu mới để cải thiện hệ thống phòng thủ tàu. Sau một sự cố hiểu nhầm trong quá trình sửa chữa thông thường, [root.GetIndividualName] đã sử dụng sự kết hợp kỳ lạ giữa các phương pháp và vật liệu để tạo ra một linh kiện bảo vệ mới. Sau khi điều tra các tiềm năng nghiên cứu, phát hiện tình cờ này cho thấy triển vọng rất lớn một khi được tinh chỉnh."

 grand_archive.2420.name: "[infected_leader.GetName] Bị Nhiễm Khuẩn"
 grand_archive.2420.desc: "Trong khi thực thi nhiệm vụ của [infected_leader.GetHisHer], [infected_leader.GetName] đã bị nhiễm phải các bào tử Trùng Hư Không đang hoạt động. Sẽ không còn bao lâu nữa trước khi những con nhộng mới chui ra và hủy diệt vật chủ của chúng.\n\nĐây có thể là một nỗ lực vô vọng, nhưng các nhân viên y tế suy đoán rằng có thể chiết xuất ấu trùng trước khi chúng tích hợp hoàn toàn vào hệ thần kinh của [infected_leader.GetHisHer]. Đó là một quy trình rủi ro, nhưng [infected_leader.GetName] có vẻ sẵn sàng để chúng ta thử sức."
 grand_archive.2420.a: "Thanh trừng đối tượng."
 grand_archive.2420.b: "Chiết xuất ấu trùng."

 grand_archive.2425.name: "Lỗ Hổng Khu Cách Ly"
 grand_archive.2425.desc.common: "Một nhóm nhỏ [infected_planet_pop.species.GetName] bị nhiễm đã trốn thoát khỏi chiến dịch thanh trừng trên [infected_planet.GetName] và phân tán khắp các hệ sao của chúng ta. Nếu không được ngăn chặn, điều này có thể khiến sự lây nhiễm Trùng Hư Không lan rộng khắp toàn bộ [this.GetName]."
 grand_archive.2425.desc.default: "$grand_archive.2425.desc.common$ Những kẻ bỏ trốn phải được xử lý trước khi chúng gây nguy hiểm cho tất cả chúng ta."
 grand_archive.2425.desc.rogue: "$grand_archive.2425.desc.common$ Những kẻ bỏ trốn phải được xử lý trước khi chúng gây nguy hiểm cho các mẫu vật chiến lợi phẩm sinh học khác của chúng ta."
 grand_archive.2425.desc.gestalt: "$grand_archive.2425.desc.common$ Những kẻ đào tẩu phải được giải quyết trước khi chúng gây nguy hại cho toàn thể ý thức tập thể."
 grand_archive.2425.desc.robot: "Các mẫu động thực vật bị nhiễm được đánh dấu để phân tích bằng cách nào đó đã bị xử lý nhầm thành lương thực thông thường. Sau sai sót này, một lượng lớn vật chất hữu cơ đã bị nhiễm ký sinh trùng Trùng Hư Không và giờ đây phải bị tiêu hủy."
 grand_archive.2425.a.default: "Truy lùng và tiêu diệt chúng."
 grand_archive.2425.a.default.tt: "-1 Dân Số Hữu Cơ trên mỗi thuộc địa sở hữu"
 grand_archive.2425.a.robot: "Thiêu hủy kho lương thực dự trữ."
 grand_archive.2425.a.robot.tt: "$@infected_devastation|0$ độ tàn phá trên tất cả các hành tinh không bị nhiễm"
 grand_archive.2425.b: "Không làm gì cả."
 grand_archive.2425.b.tt: "Các nhộng trùng hư không bổ sung có thể xuất hiện gần các thuộc địa của chúng ta!"

 grand_archive.2430.name: "Chểnh Mảng Bổn Phận"
 grand_archive.2430.desc: "Mặc dù mọi người đều đồng ý rằng thanh trừng những người bị nhiễm là hành động khôn ngoan nhất, nhưng nhiều binh lính đang gặp khó khăn trong việc chấp hành mệnh lệnh. Bất chấp sự nguy hiểm của ký sinh trùng Trùng Hư Không, nhiều người đơn giản là không thể xuống tay trừ khử đồng bào của mình vì đại cuộc.\n\nPhải làm điều gì đó để ngăn chặn sự lây nhiễm Trùng Hư Không lan tràn qua các thuộc địa của chúng ta. Chúng ta có thể tự động hóa một số phần của quy trình thanh trừng để cần ít binh lính hơn. Ngoài ra, chúng ta có thể phát động một chiến dịch truyền thông ngắn để thúc đẩy các tiêu chuẩn đạo đức trong nỗ lực thanh trừng và tái khẳng định tính cấp thiết của chúng."
 grand_archive.2430.a: "Tự động hóa các quy trình thanh trừng."
 grand_archive.2430.b: "Phát động chiến dịch truyền thông đại chúng."

 grand_archive.2440.name: "Đột Phá Bổ Trợ"
 grand_archive.2440.desc: "Công cuộc tìm kiếm phương thuốc chữa trị đại dịch Trùng Hư Không đã cho phép các nghiên cứu trong những lĩnh vực sinh học khác tiến triển song song. Mặc dù loài ký sinh vẫn là ưu tiên hàng đầu hiện tại của chúng ta, nhưng bước đột phá mới này chứa đựng tiềm năng to lớn cho các nghiên cứu trong tương lai."

 grand_archive.2445.name: "Thử Nghiệm Giai Đoạn Đầu"
 grand_archive.2445.desc.common: "Hiểu biết của chúng ta về Đại Dịch Trùng Hư Không đang dần được cải thiện và nền tảng cho một phương thuốc đã được phát triển."
 grand_archive.2445.desc.default: "$grand_archive.2445.desc.common$ Tuy nhiên, nghiên cứu của chúng ta có thể tiến triển với tốc độ nhanh hơn nhiều nếu tiến hành thử nghiệm sống giai đoạn đầu trên các đối tượng tham gia là người [Root.GetSpeciesAdj].\n\nBỏ qua các cân nhắc về đạo đức, việc đi tắt qua một số biện pháp an toàn vì đại cuộc có thể là một lựa chọn khôn ngoan hơn."
 grand_archive.2445.desc.gestalt: "$grand_archive.2445.desc.common$ Tuy nhiên, quy trình thử nghiệm rất tốn thời gian, chủ yếu là do nhu cầu liên tục về các cá thể [root.GetIndividualNamePlural] nhàn rỗi làm đối tượng nghiên cứu. Nếu các cá thể [root.GetIndividualNamePlural] có thể được tái phân bổ làm đối tượng thử nghiệm, phương thuốc sẽ được phát triển với tốc độ nhanh hơn nhiều.\n\nHậu quả sẽ được cảm nhận ở các khu vực khác trong toàn thể tập thể, khi các cá thể [root.GetIndividualNamePlural] được tái phân bổ để lại vai trò trước đây của chúng trong tình trạng hỗn loạn."
 grand_archive.2445.a.default: "Thử nghiệm trên các [Root.GetSpeciesNamePlural] không hề hay biết."
 grand_archive.2445.a.gestalt: "Ưu tiên thử nghiệm."
 grand_archive.2445.b.default: "Chỉ thử nghiệm trên các tình nguyện viên."
 grand_archive.2445.b.gestalt: "Tiếp tục nghiên cứu bình thường."
 grand_archive.2445.c: "Không thực hiện các thử nghiệm phi đạo đức."

 grand_archive.2450.name: "Tuyến Trùng Hư Không"
 grand_archive.2450.desc: "Chúng ta đã phát hiện một quy luật trong chu kỳ sinh sản của Trùng Hư Không có thể dẫn đến một bước đột phá to lớn trong việc tổng hợp phương thuốc điều trị Đại Dịch Trùng Hư Không.\n\nĐể xác nhận giả thuyết này, các tuyến sinh sản của một con $voidworms_titan$ hoang dã phải được thu hoạch để phân tích. Điều then chốt là con $voidworms_titan$ này phải bị tiêu diệt trong khi đang oanh tạc một hành tinh để bảo tồn các giao tử sinh sản đang hoạt động."
 grand_archive.2450.a: "Chúng ta không có thời gian cho việc này."
 grand_archive.2450.b: "Các bạn sẽ có được những tuyến thể đó."

 VOIDWORM_GLANDS_PROJECT: "Tuyến Sinh Sản Tam Thể"
 VOIDWORM_GLANDS_PROJECT_DESC: "Chúng ta đã tạo ra một phát hiện đột phá trong công cuộc tìm kiếm phương thuốc chữa trị Đại Dịch Trùng Hư Không. Tất cả những gì cần thiết là các tuyến sinh sản của một Tam Thể Trùng Hư Không đang trong trạng thái màu mỡ hoạt động."
 VOIDWORM_GLANDS_PROJECT_TOOLTIP: "§RThu hoạch mảnh vỡ xác của một Tam Thể đang tích cực oanh tạc một hành tinh.§!"

 VOIDWORM_TITAN_DEBRIS_PROJECT: "Xác $NAME_Voidworms_Troika$"
 VOIDWORM_TITAN_DEBRIS_PROJECT_DESC: "Tàn tích của con Tam Thể Trùng Hư Không này có thể được thu hoạch để lấy các tuyến sinh sản màu mỡ của chúng.\n\nNhững cơ quan này sẽ mở rộng đáng kể sự hiểu biết của chúng ta về sinh học của sinh vật và hỗ trợ diệt trừ Đại Dịch Trùng Hư Không một lần và mãi mãi."

 grand_archive.2455.name: "Đã Thu Hồi Tuyến Thể"
 grand_archive.2455.desc: "Các tuyến thể thu hồi được từ Tam Thể Trùng Hư Không màu mỡ đã tiết lộ những thông tin mới về chu kỳ sinh sản của chúng.\n\nBị khóa chặt trong một nghi thức giao phối cho đến chết, mỗi con trong số ba con Trùng Hư Không trong vòng ôm ấp sinh sản phân phối vật liệu di truyền của chúng đồng đều giữa các cá thể, thực sự biến thành một sinh vật hoàn toàn mới.\n\nChúng ta có thể sử dụng các quá trình biến đổi di truyền này để chống lại chính chúng."

 grand_archive.2500.name: "Đã Tìm Ra Phương Thuốc"
 grand_archive.2500.desc.default: "Chúng ta đã hoàn thành việc phát triển phương thuốc điều trị dứt điểm tình trạng nhiễm ký sinh trùng Trùng Hư Không. Các thuộc địa của chúng ta không còn dễ bị tổn thương trước các đợt oanh tạc bào tử của chúng nữa, và chúng ta không còn phải lo lắng về sự hiện diện của chúng trong thiên hà."
 grand_archive.2500.desc.tech: "$grand_archive.2500.desc.default$\n\nChúng ta chắc chắn rằng, lần này, phương thuốc mà chúng ta phát triển đã được bảo vệ an toàn trước bất kỳ đột biến sinh học nào trong tương lai của chúng."

