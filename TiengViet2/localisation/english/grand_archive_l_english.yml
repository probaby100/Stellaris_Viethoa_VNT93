 grand_archive.6025.name: "Hải Tặc Phục Kích"
 grand_archive.6025.desc: "Khi chúng ta đang tìm kiếm §Y$TREASURE_TROVE$§! trên [from.GetName], [fromfromfrom.Leader.GetName] đã bị một hạm đội hải tặc phục kích!\n\nNhững kẻ ngoài vòng pháp luật này bằng cách nào đó đã theo dõi tiến trình của chúng ta và tìm cách chiếm đoạt kho báu cho riêng mình. Nếu muốn thu thập món hời này, chúng ta phải đánh bại hạm đội của chúng trước khi chúng bảo vệ được các vật phẩm có giá trị."
 grand_archive.6025.a: "Chuẩn bị giao chiến."

 TREASURE_TROVE_PIRATES: "Đánh bại $NAME_Treasure_Trove_Pirate_Ship$"
 TREASURE_TROVE_PIRATES_DESC: "Một hạm đội hải tặc đang truy lùng §Y$TREASURE_TROVE$§! trên [this.GetName]!"
 TREASURE_TROVE_EVENT_TOOLTIP: "§RChúng ta phải đánh bại những kẻ cơ hội trước khi chúng chiếm đoạt các tài nguyên quý giá này.§!"

 grand_archive.6031.name: "Đánh Bại Hải Tặc"
 grand_archive.6031.desc: "Sau khi đánh tan đám hải tặc cơ hội, giờ đây chúng ta có thể tự do thu nhận kho báu trên [event_target:treasure_trove_planet.GetName]."
 grand_archive.6031.a: "Phần thưởng hoàn toàn xứng đáng."
 grand_archive.6035.name: "Mất Kho Báu"
 grand_archive.6035.desc: "Đám hải tặc cơ hội đã cướp phá §Y$TREASURE_TROVE$§! trên [event_target:treasure_trove_planet.GetName].\n\nKhông còn bất cứ thứ gì có giá trị cho chúng ta thu hồi."
 grand_archive.6035.a: "Đành chịu vậy."

