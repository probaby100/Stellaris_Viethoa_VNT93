 concept_space_fauna_home_systems_desc: "Động Vật Không Gian chỉ có thể bị dụ đến một hệ sao phù hợp với môi trường sống ưa thích của chúng: $TABBED_NEW_LINE$- $tiyanki$: Hệ sao có §HKhổng Lồ Khí§! $TABBED_NEW_LINE$- $space_amoeba_plural$: Hệ sao có §HTinh Vân§! $TABBED_NEW_LINE$- $crystalline_entity_plural$: Hệ sao có §HẨn Tinh§! $TABBED_NEW_LINE$- $voidworms_plural$: Hệ sao có §HLỗ Đen§! $TABBED_NEW_LINE$- $cutholoids_plural$: Hệ sao có §HTiểu Hành Tinh§!"

 wildlife_ranch: "Trang Trại Động Vật Hoang Dã"
 wildlife_ranch_desc: "Chúng ta sống hòa hợp cùng các sinh vật bản địa, hết sức chăm chút bảo vệ môi trường sống của chúng và thúc đẩy sự sinh trưởng bền vững của muôn loài."
 wildlife_ranch_2: "Trang Trại Hoang Dã Mở Rộng"
 wildlife_ranch_2_desc: "Công tác quản lý hệ sinh thái tỉ mỉ giúp cải thiện điều kiện sống cho các sinh vật bản địa và hỗ trợ các hoạt động chăn nuôi."
 wildlife_ranch_3: "Tổ Hợp Trang Trại Hoang Dã"
 wildlife_ranch_3_desc: "Một cơ sở rộng lớn nơi động vật được tự do đi lại. Chúng được cung cấp sự thoải mái và tiện nghi nhằm tối đa hóa chất lượng tài nguyên mà chúng mang lại."
 hunting_grounds: "Khu Vực Săn Bắn"
 hunting_grounds_desc: "Một khu liên hợp huấn luyện dùng để thuần thục mọi kỹ thuật săn bắt. Từ vũ khí năng lượng hiện đại đến các binh khí chiến đấu truyền thống, sự khéo léo và chuẩn xác vô song là điều bắt buộc để hạ gục những loài thú săn mồi đáng sợ và đoạt lấy chiến tích."
 hunting_grounds_2: "Vùng Săn Bắn Mở Rộng"
 hunting_grounds_2_desc: "Cơ sở giám sát và huấn luyện cung cấp điều kiện săn bắn tối ưu cho động vật địa phương. Công nghệ bản đồ nhiệt giúp nhận dạng các dấu vết mới của thú rừng và săn được những con mồi đạt chuẩn chiến tích."
 hunting_grounds_3: "Tổ Hợp Săn Bắn"
 hunting_grounds_3_desc: "Một vùng đất bao la hỗ trợ các đoàn săn bắn hành tinh trên quy mô cực lớn. Được trang bị vũ khí và thiết bị truy vết chất lượng cao nhất, các thợ săn được huấn luyện chuyên sâu để tối đa hóa số lượng và chất lượng con mồi hạ gục."
 wildlife_sanctuary: "Khu Bảo Tồn Động Vật Hoang Dã"
 wildlife_sanctuary_desc: "Một khu bảo tồn nơi động vật hoang dã được nghiên cứu ngay trong môi trường sống tự nhiên của chúng. Các biện pháp an toàn được áp dụng để ngăn ngừa sự mất ổn định quần thể hoặc dịch bệnh lây lan quá mức. Nghiên cứu những sinh vật này tự thân nó là một nỗ lực học thuật đáng giá, nhưng quan trọng hơn là nó dạy chúng ta hiểu sâu hơn về bản chất của chính mình."
 wildlife_sanctuary_2: "Khu Bảo Tồn Nâng Cao"
 wildlife_sanctuary_2_desc: "Các sinh vật tại đây được chăm sóc theo từng cá thể riêng biệt, đáp ứng các nhu cầu y tế và chế độ ăn độc đáo với sự can thiệp tối thiểu vào môi trường sống tự nhiên. Các hệ sinh thái chuyên biệt cho phép nhân giống và tái thả các loài có nguy cơ tuyệt chủng."
 wildlife_sanctuary_3: "Tổ Hợp Bảo Tồn"
 wildlife_sanctuary_3_desc: "Động vật ở đây được theo dõi và chăm sóc bằng cơ sở hạ tầng được thiết kế tinh vi đến mức dường như không tồn tại. Các nhà nghiên cứu bị cấm can thiệp vào hành vi tự nhiên của đối tượng nghiên cứu, bảo đảm thu thập được dữ liệu nghiên cứu với chất lượng cao nhất có thể."
 primal_arena: "Đấu Trường Hoang Dã"
 primal_arena_desc: "Một đấu trường nơi những chiến binh mạnh nhất của chúng ta giao chiến với các sinh vật hung dữ trong các trận chiến sinh tử nguyên thủy. Không có màn giải trí nào tuyệt đỉnh hơn việc chứng kiến những người hùng chiến thắng dã thú hung tợn - hoặc tử trận khi thử sức."
 primal_arena_2: "Sân Vận Động Hoang Dã"
 primal_arena_2_desc: "Tại sân vận động khổng lồ này, các bầy thú được những người huấn luyện lành nghề chỉ dẫn phối hợp tấn công. Các võ sĩ đấu thú không còn có thể dựa vào việc áp đảo con mồi bằng sức mạnh đơn thuần: họ phải mưu trí hơn cả người huấn luyện để có thể sống sót."
 primal_arena_3: "Đại Đấu Trường Hoang Dã"
 primal_arena_3_desc: "Một đấu trường tráng lệ được thiết kế để tổ chức các trận đại chiến diệt thú quy mô hoành tráng. Mỗi cuộc giao tranh đều mất nhiều tuần chuẩn bị và có thể đón hàng triệu khán giả đến tham dự."
 symbiosis_nexus: "Hạch Tâm Cộng Sinh"
 symbiosis_nexus_desc: "Một khu bảo tồn tự nhiên nơi các sinh mệnh hoang dã được chào đón gia nhập cộng đồng của chúng ta. Mỗi sinh vật đều có một giá trị độc đáo đóng góp vào mạng lưới tâm trí."
 symbiosis_nexus_2: "Vùng Cộng Sinh Mở Rộng"
 symbiosis_nexus_2_desc: "Khu bảo tồn trung tâm dùng để tập hợp các đối tác hoang dã của chúng ta thành những bầy tự duy trì. Việc phối hợp các năng lực tinh thần thấp hơn của chúng mang lại sự ổn định tư duy cho mạng lưới tâm trí vĩ đại."
 symbiosis_nexus_3: "Tổ Hợp Cộng Sinh"
 symbiosis_nexus_3_desc: "Một trung tâm rộng lớn dùng để hợp nhất tâm trí của mọi sinh vật nhằm tiếp thêm sức mạnh cho tư duy tập thể của chúng ta."

 edict_space_fauna_exhibition: "Triển Lãm Động Vật Không Gian"
 space_fauna_exhibition: "$edict_space_fauna_exhibition$"
 edict_space_fauna_exhibition_desc: "Các chủ trang trại từ khắp thiên hà trưng bày những đàn gia súc quý giá của họ và cạnh tranh cho danh hiệu \"Mẫu Vật Xuất Sắc Nhất\"."
 edict_beasts_burden: "Sức Kéo Dã Thú"
 beasts_burden: "$edict_beasts_burden$"
 edict_beasts_burden_desc: "Những đàn gia súc dẻo dai nhất của chúng ta nên gánh vác phần việc của mình trong một số nhiệm vụ đòi hỏi nhiều sức lao động nhất."
 edict_creature_welfare: "Phúc Lợi Sinh Vật"
 creature_welfare: "$edict_creature_welfare$"
 edict_creature_welfare_desc: "Trách nhiệm của chúng ta là bảo đảm chất lượng cuộc sống cao nhất cho các sinh vật nằm dưới sự chăm sóc của mình."
 edict_crack_the_whip: "Vung Roi Thao Luyện"
 crack_the_whip: "$edict_crack_the_whip$"
 edict_crack_the_whip_desc: "Bất kể giống loài nào, mọi sinh vật đều có phản ứng tương tự nhau trước nỗi đau. Bí quyết nằm ở chỗ học cách gây ra nó một cách chính xác."
 edict_exotic_network: "Mạng Thần Kinh Dị Chủng"
 exotic_network: "$edict_exotic_network$"
 edict_exotic_network_desc: "Tâm trí của những sinh vật cấp thấp mà chúng ta chăm sóc có đủ dung lượng để cung cấp băng thông cho các phép tính đòi hỏi nhiều năng lực hơn."
 edict_defensive_instincts: "Bản Năng Tự Vệ"
 defensive_instincts: "$edict_defensive_instincts$"
 edict_defensive_instincts_desc: "Chúng ta là một thể thống nhất. Hãy để bản năng của chúng ta hòa quyện giữa giá lạnh của không gian sâu thẳm."
 edict_biological_overdrive: "Quá Tải Sinh Học"
 biological_overdrive: "$edict_biological_overdrive$"
 edict_biological_overdrive_desc: "Những sinh vật cấp thấp của chúng ta có thể được đẩy tới giới hạn tuyệt đối của chúng nếu được cấy ghép các thụ thể thần kinh thích hợp."

 grand_archive.1060.name: "Xác Thối [from.GetSpaceFaunaName]"
 grand_archive.1060.desc: "Sau khi thiết lập liên lạc với [from.GetSpaceFaunaNamePlural], chúng ta đã phát hiện một xác chết đang phân hủy của đồng loại chúng trong [fromfrom.GetName]. Thi hài đã khô héo và đông cứng sau thời gian dài phơi nhiễm trong không gian mở.\n\nChúng ta phỏng đoán rằng cái xác này chính là thứ ban đầu đã thu hút các thành viên khác cùng loài; có lẽ chúng đã đi tìm một thành viên mất tích trong [from.GetSpaceFaunaGroup] của mình. Đây là cơ hội hiếm có để nghiên cứu sinh học của một [from.GetSpaceFaunaName] đã chết vì nguyên nhân tự nhiên trong hư không."
 TIYANKI_GROUP_NAME: "đàn"
 SPACE_AMOEBA_GROUP_NAME: "bầy"
 CRYSTAL_GROUP_NAME: "cụm"
 VOIDWORM_GROUP_NAME: "bầy"
 CUTHOLOID_GROUP_NAME: "bầy"

 voidworm_carcass_01_object: "Tàn Tích Trùng Hư Không"
 carcass_01_object: "Xác Động Vật Không Gian"
 CARRION_DEBRIS_PROJECT: "Khám Nghiệm Xác [met_critter.GetSpaceFaunaName]"
 CARRION_DEBRIS_PROJECT_DESC: "Xác của một [met_critter.GetSpaceFaunaName] đã được phát hiện tại [contact_system.GetName]. Việc nghiên cứu những tàn tích này ngoài tự nhiên sẽ mở rộng hiểu biết của chúng ta về những sinh vật không gian này."

 grand_archive.1065.name: "Khám Nghiệm Hoàn Tất"
 grand_archive.1065.desc: "Công tác khám nghiệm tử thi đối với xác [met_critter.GetSpaceFaunaName] tại [contact_system.GetName] đã hoàn tất. Chúng ta đã thu hồi được một mẫu vật sinh học được bảo quản nguyên vẹn từ bên trong thi hài, mang lại cái nhìn sâu sắc độc đáo về sinh lý học của chúng."
 grand_archive.1065.specimen_tt: "['concept_specimen', Mẫu vật] §MĐặc Biệt§! dành riêng cho loài dã thú"

 NAME_BoneShip: "Chiến Hạm Xương Khốt"
 NAME_BoneShip_desc: "Con tàu được trang hoàng bằng các tua xúc tu của Tiyanki trưởng thành, những hàng răng sắc nhọn của Trùng Hư Không, và hộp sọ của một sinh vật mà chúng ta chưa từng thấy trước đây. Nó tua tủa các loại vũ khí chuẩn xác chết người."
 grand_archive.1069.name: "$NAME_BoneShip$"
 grand_archive.1069.desc: "Chúng ta đã được liên lạc bởi một phi thuyền không gian được cải biên kỳ lạ trong [from.GetName]. $NAME_BoneShip_desc$\n\nSau khi ngây thơ chấp nhận lời mời đàm phán của chúng ta, viên phi công đã bị [GetExecuted] ngay lập tức. Chúng ta đã tịch thu con tàu dị thường của họ và bổ sung vào hàng ngũ quân sự của mình. Chúng ta cũng phát hiện một cuốn cẩm nang thực địa hữu ích của thợ săn trong số tư trang cá nhân của họ."
 grand_archive.1069.a: "Một món quà đáng hoan nghênh."
 EXECUTED: "xử tử"
 DEVOURED: "nuốt chửng"

 grand_archive.1070.name: "$NAME_BoneShip$"
 grand_archive.1070.desc: "Chúng ta đã được liên lạc bởi một phi thuyền không gian được cải biến kỳ lạ trong [from.GetName]. $NAME_BoneShip_desc$\n\nHọ đang phát tín hiệu gọi chúng ta trên mọi tần số."
 grand_archive.1070.a: "Mở kênh liên lạc."

 NAME_PrimalHunter: "Ceriz t'Xal"
 primal_hunter_desc: "Một thợ săn lão luyện lang thang khắp thiên hà để săn lùng những con mồi lớn."
 primal_hunter_catchphrase: "§L\"Ta tìm kiếm một chiến tích khác cho bộ sưu tập của mình.\"§!"
 grand_archive.1075.name: "$grand_archive.1070.name$"
 grand_archive.1075.desc: "§HGiọng nói u trầm của Ceriz khô khốc và khàn đặc, tựa như họ đã không mở miệng nói suốt nhiều tuần. Phong thái của họ rất bộc trực và duy trì ánh nhìn kiên định, vừa tạo cảm giác tôn trọng vừa đầy uy hiếp.§!\n\nLà một thợ săn chiến tích, cần rất nhiều điều mới có thể gây ấn tượng với ta. Nhưng người dân của các ngươi đã làm được.\n\nTa sẵn lòng gia nhập các đoàn săn của các ngươi với sự thấu hiểu rằng mối quan hệ đối tác của chúng ta sẽ là sự thuận tiện và học hỏi lẫn nhau."
 grand_archive.1075.a: "Ngươi là ai?"
 grand_archive.1075.a.reply: "Ta là $NAME_PrimalHunter$. Ta đã đi săn trong những hệ sao này suốt nhiều năm. Ta tìm kiếm con mồi mới, và người dân của các ngươi dường như là những kẻ lần dấu có năng lực.\n\nĐộng lực của ta rất đơn giản: sự phấn khích tột cùng của chuyến đi săn."
 grand_archive.1075.b: "Hộp sọ gắn trên tàu ngươi là thứ gì?"
 grand_archive.1075.b.reply: "Đó là cá thể cuối cùng của giống loài nó. Nó đã chiến đấu vô cùng ngoan cường."
 grand_archive.1075.c: "Ngươi đã quan sát chúng ta bao lâu rồi?"
 grand_archive.1075.c.reply: "Rõ ràng là người dân của các ngươi còn phải học hỏi rất nhiều điều.\n\nMột thợ săn giỏi có thể bám dấu con mồi bao lâu tùy thích trong sự tàng hình hoàn hảo. Để thực sự đoạt mạng, kẻ đi săn phải ẩn mình cho đến khi phát bắn được khai hỏa. Thời gian ta ẩn mình trong bóng tối không quan trọng, điều quan trọng là thời điểm ta chọn để lộ diện."
 grand_archive.1075.d: "Tại sao lại gia nhập với chúng ta?"
 grand_archive.1075.d.reply: "Ta không tìm kiếm sự cạnh tranh trên bãi săn. Dù ta không thích chia sẻ lãnh thổ, nhưng ta thà sát cánh cùng thợ săn của các ngươi còn hơn là tranh giành cùng một con mồi.\n\nBất cứ thứ gì các ngươi lần ra dấu vết, ta sẽ đoạt mạng nó."
 grand_archive.1075.hire: "Tuyển Mộ"
 grand_archive.1075.hire_tt: "§Y$NAME_PrimalHunter$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh Đạo§!."
 grand_archive.1075.dismiss: "Từ Chối"

 grand_archive.1080.name: "Nhà Dị Chủng Học Lang Bạt"
 grand_archive.1080.desc: "Một tàu nghiên cứu độc lập đã liên lạc với căn cứ sao của chúng ta tại [from.GetName]. Được trang bị một loạt các thiết bị bẫy và công cụ phân tích, con tàu này được điều chỉnh đặc biệt để bắt giữ và nghiên cứu sinh thái không gian.\n\nHọ đang phát tín hiệu chào hỏi chúng ta trên mọi tần số."
 grand_archive.1080.a: "Mở kênh liên lạc."

 NAME_PrimalRancher: "Ruuk Qabruuk"
 primal_rancher_desc: "Một nhà dị chủng học mang niềm đam mê mãnh liệt với công tác thực địa, cô đã nghiên cứu đủ loại dã thú không gian."
 primal_rancher_catchphrase: "§L\"Mỗi sinh vật đều có một câu chuyện để kể, và tôi là một người lắng nghe chăm chú!\"§!"
 grand_archive.1085.desc: "§HHiếu kỳ và sắc sảo, đôi mắt của Ruuk liên tục liếc nhìn vào một thiết bị cầm tay nhỏ. Ngay cả khi chào đón chúng ta, cô ấy dường như vẫn đang ghi chú. Bất chấp điều đó, phong thái của cô rất nhã nhặn và chuyên nghiệp, dù có phần hơi tách biệt.§!\n\nTôi thấy mình không đơn độc trong niềm đam mê với các sinh vật không gian. Tôi đã theo dõi những nghiên cứu mà [root.GetName] đang tiến hành và nó thực sự rất khai sáng. Tôi không mong muốn điều gì hơn là được cống hiến cho những nỗ lực này với tư cách là thành viên của bộ phận khoa học của quý vị. Tất nhiên, nếu quý vị sẵn lòng đón nhận tôi."
 grand_archive.1085.a: "Cô là ai?"
 grand_archive.1085.a.reply: "Xin lỗi, tôi đã hơi vội vàng rồi.\n\nTên tôi là Ruuk. Tôi là một nhà nghiên cứu chuyên về thực địa động vật không gian. Đội của tôi và tôi thu thập dữ liệu về mô thức di cư, cấu tạo cơ thể và sự đa dạng sinh học cấp độ thiên hà.\n\nVề mặt cá nhân, tôi đã yêu quý động vật từ khi còn là một chú chim non. Tôi không bao giờ đi đâu mà thiếu Fuluff."
 grand_archive.1085.b: "Fuluff là ai?"
 grand_archive.1085.b.reply: "Chính là anh bạn nhỏ tôi yêu thích nhất trong toàn bộ thiên hà này!\n\nTôi rất muốn đưa cậu nhóc lên màn hình, nhưng hiện giờ cậu ấy đang ngủ say rồi. Tại quê nhà của tôi, chúng tôi nhân giống loài này làm thú cưng và tôi đã nhận nuôi cậu ấy trong chuyến về thăm lần trước. Cậu nhóc cực kỳ đáng yêu: nghe tiếng móng guốc nhỏ xíu lách cách trên sàn kim loại, cách cậu ấy rỉa nhẹ vào lông vũ của tôi, chỏm lông xù nhô lên giữa đôi mắt bé xíu. Tôi chắc chắn cậu ấy cũng sẽ chinh phục được quý vị khi... nếu chúng ta bắt đầu làm việc cùng nhau."
 grand_archive.1085.c: "Làm thế nào cô tìm thấy chúng tôi?"
 grand_archive.1085.c.reply: "Một trong những mẫu vật chúng tôi đang lần dấu có hành vi bất thường, nên chúng tôi đã đi theo dấu vết của nó. Tại đó, chúng tôi phát hiện đội khoa học của quý vị đang tiếp cận đối tượng nghiên cứu của chúng tôi. Sự chăm chút tận tụy của quý vị đối với sinh vật cho thấy sự tôn trọng thực sự đối với sự sống không gian, và điều đó thôi thúc tôi tìm hiểu về các nghiên cứu của quý vị, điều càng làm tôi khâm phục hơn. Tôi luôn tìm kiếm những người bạn đồng hành cùng chí hướng trong lĩnh vực này."
 grand_archive.1085.d: "Tại sao lại muốn gia nhập cùng chúng tôi?"
 grand_archive.1085.d.reply: "Thành thật mà nói, nghiên cứu khoa học tự do không phải là nguồn thu nhập đáng tin cậy. Tôi tin vào công việc của mình, nhưng dành cả đời đi tìm kiếm tài trợ đơn giản là làm mất quá nhiều thời gian dành cho khoa học cốt lõi.\n\nBằng cách gia nhập [root.GetName], tôi sẽ có thể dành toàn bộ thời gian của mình để làm điều mình giỏi nhất: nghiên cứu sự sống không gian. Tôi sẽ có quyền tiếp cận các nguồn tài nguyên lớn hơn và có thể cộng tác với đội ngũ khoa học hiện tại của quý vị để thúc đẩy các mục tiêu chung của chúng ta."
 grand_archive.1085.hire: "Tuyển Mộ"
 grand_archive.1085.hire_tt: "§Y$NAME_PrimalRancher$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh Đạo§!."
 grand_archive.1085.dismiss: "Từ Chối"

 grand_archive.1100.name: "Tiếng Rít Dã Thú"
 grand_archive.1100.desc: "Chúng ta đã phát hiện một lượng lớn sóng điện từ kỳ lạ phát ra từ vùng không gian chưa được vẽ bản đồ.\n\nPhân tích ban đầu cho thấy sự tương đồng với các tín hiệu giao tiếp của §YTrùng Hư Không§!, mặc dù bất thường hơn và có biên độ tăng cao rõ rệt. Vụ việc này sẽ được điều tra sâu hơn."
 grand_archive.1100.a: "Đáng lo ngại."

 grand_archive.1105.name: "Trùng Hư Không Gào Rít"
 grand_archive.1105.desc: "Chúng ta đã phát hiện nguồn gốc của những tiếng thét rít mang tính thú tính này; một hệ sao ẩn nấp đầy rẫy §YTrùng Hư Không§! gần [frenzied_voidworms_target.solar_system.GetName].\n\nNhững con Trùng Hư Không trong hệ sao này không giống những con chúng ta từng chạm trán trước đây. Những sinh vật này đã bị đột biến; không có tam thể trùng nào được hình thành và các cá thể trưởng thành đơn lẻ đang tham gia vào một cuộc giao phối cuồng loạn đầy bạo lực.\n\nĐiều này rất đáng lo ngại: hành vi phi ký sinh này có nghĩa là bầy đàn này có thể sinh sản độc lập mà không cần đến vật chủ trên hành tinh."
 grand_archive.1105.desc_no_homicidal: "\nNếu loài biến dị này được phép lây lan không kiểm soát, nó có thể phá vỡ hoàn toàn sự cân bằng của hệ sinh thái thiên hà. Dựa trên sự hung hăng ngày càng tăng của chúng, chúng ta tin rằng những sinh vật này đang chuẩn bị cho một cuộc tấn công vào [frenzied_voidworms_target.GetName]."
 grand_archive.1105.desc_2: "\nChúng ta phải chuẩn bị lực lượng phòng thủ."
 grand_archive.1105.a: "Báo động đỏ!"

 situation_frenzied_voidworms: "Trùng Hư Không Cuồng Loạn"
 situation_frenzied_voidworms_type: "$situation_frenzied_voidworms$"
 situation_frenzied_voidworms_desc: "Chúng ta phát hiện một tổ lớn gồm những con Trùng Hư Không bị đột biến rõ rệt. Chúng tồn tại trong trạng thái cực kỳ hung hãn và dường như có khả năng sinh sản theo phương thức phi ký sinh.\n\nSự hiện diện của chúng ta dường như đang kích động tổ của chúng. Chúng ta phải hành động thận trọng.\n\n[GetVoidwormsHostility]"
 situation_frenzied_voidworms_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 finisher_effects_frenzied_voidworms: "Trùng Hư Không hung dữ có thể tấn công thủ đô của chúng ta."
 approach_frenzied_voidworms_do_nothing: "Không Hành Động"
 approach_frenzied_voidworms_do_nothing_tt: "Chúng ta sẽ không thực hiện hành động đặc biệt nào ở đây."
 approach_frenzied_voidworms_hide_presence: "Ẩn Giấu Sự Hiện Diện Của Chúng Ta"
 approach_frenzied_voidworms_hide_presence_tt: "Mọi hoạt động xây dựng trong hệ sao của chúng ta gần nhất với hệ sao quê hương của chúng đều bị đình chỉ."
 approach_frenzied_voidworms_stir_nests: "Kích Động Ổ Trùng"
 approach_frenzied_voidworms_stir_nests_tt: "Khiêu khích những sinh vật này sẽ làm gia tăng sự thù địch của chúng đối với chúng ta."
 approach_frenzied_voidworms_feed_nests: "Cho Ăn Các Ổ Trùng"
 approach_frenzied_voidworms_feed_nests_tt: "Nếu chúng ta hạ thấp sự hung hăng của chúng xuống đủ mức, chúng ta có thể chiếm được lòng tin của chúng."

 # Strings for GetVoidwormsHostility trigger loc script
 voidworms_hostility_hostile: "Trùng Hư Không Đột Biến biểu hiện §PCực Kỳ Hung Hăng§!."
 voidworms_hostility_neutral: "Trùng Hư Không Đột Biến biểu hiện §SHung Hăng§!."
 voidworms_hostility_pacified: "Trùng Hư Không Đột Biến biểu hiện §BĐiềm Tĩnh§!."

 hide_presence_modifier: "$approach_frenzied_voidworms_hide_presence$"
 hide_presence_starbase_modifier: "$approach_frenzied_voidworms_hide_presence$"

 frenzied_voidworms_killed.desc.common: "Ổ trùng lớn nhất của những sinh vật đột biến kỳ lạ đã được bảo tồn. Dưới sự kiểm soát của chúng ta, chúng ta có thể nuôi dưỡng thêm những sinh vật độc đáo này mà không sợ nguy cơ chúng phát tán bừa bãi khắp thiên hà."
 grand_archive.1165.name: "Trùng Hư Không Đột Biến Đã Bị Tiêu Diệt"
 grand_archive.1165.desc.common: "Không chịu ngồi yên chờ đợi cuộc tấn công tất yếu của chúng, chúng ta đã phát động một chiến dịch quân sự thành công chống lại loài Trùng Hư Không đột biến ngay tại hệ sao quê hương của chúng. Mối đe dọa từ những sinh vật này sẽ không còn bao trùm lên [frenzied_voidworms_target.GetName], và sự an toàn của hành tinh chúng ta"
 grand_archive.1165.desc.default: "$grand_archive.1165.desc.common$ cùng hệ sinh thái thiên hà đã được bảo đảm an toàn.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1165.desc.homicidal: "$grand_archive.1165.desc.common$ đã được bảo đảm an toàn.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1165.a: "Một chiến thắng rực rỡ."

 grand_archive.1170.name: "Trùng Hư Không Đột Biến Đã Bị Thanh Trừng"
 grand_archive.1170.desc.common: "Loài Trùng Hư Không đột biến đã bị tiêu diệt hoàn toàn. Mối đe dọa từ những sinh vật này sẽ không còn đè nặng lên [frenzied_voidworms_target.GetName], và sự an toàn của hành tinh chúng ta"
 grand_archive.1170.desc.default: "$grand_archive.1170.desc.common$ cùng hệ sinh thái thiên hà đã được bảo đảm an toàn.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1170.desc.homicidal: "$grand_archive.1170.desc.common$ đã được bảo đảm an toàn.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1170.a: "$grand_archive.1165.a$"

 grand_archive.1180.name: "Phát Hiện Trùng Hư Không Đột Biến"
 grand_archive.1180.desc: "Sau khi tiêu diệt một ổ Trùng Hư Không gần các tổ của chúng, chúng ta phát hiện những sinh vật này đã trải qua một đột biến độc nhất.\n\nCó vẻ như chúng có khả năng sinh sản theo phương thức phi ký sinh và luôn trong trạng thái hung hăng cao độ, điều này giải thích cho sức mạnh và sự dẻo dai phi tự nhiên của chúng.\n\nMay mắn thay, chúng ta đã bảo tồn một trong các tổ của chúng làm chiến tích. Dưới sự kiểm soát của chúng ta, chúng ta có thể nhân giống thêm những sinh vật độc đáo này mà không sợ nguy cơ chúng phát tán không kiểm soát khắp thiên hà."
 grand_archive.1180.a: "Bất ngờ, nhưng rất đáng hoan nghênh."

 grand_archive.1185.name: "Trùng Hư Không Bị Diệt Tận"
 grand_archive.1185.desc: "Chúng ta nhận được tin rằng những con Trùng Hư Không đột biến đe dọa thuộc địa của chúng ta đã bị tiêu diệt.\n\nMột kết cục bất ngờ nhưng rất đáng mừng. Chúng ta có thể an lòng trước thực tế rằng những sinh vật này sẽ không còn quấy nhiễu các hệ sao của chúng ta nữa."
 grand_archive.1185.a: "Thiên hà đã an toàn hơn."

 grand_archive.1200.name: "Trùng Hư Không Tấn Công"
 grand_archive.1200.desc: "Những con Trùng Hư Không cuồng loạn đang tấn công [frenzied_voidworms_target.solar_system.GetName]!\n\nSự hung hăng của chúng đã dâng cao tột độ, và quỹ đạo di chuyển hiện tại của bầy đàn chính đang hướng thẳng tới [frenzied_voidworms_target.GetName].\n\nChúng ta không tin rằng chúng có ý định để lại bất kỳ ai sống sót."
 grand_archive.1200.a: "Chuẩn bị các tuyến phòng thủ."

 grand_archive.1205.name: "Cái Giá Đắt Nhất Phải Trả"
 grand_archive.1205.desc_common: "Bất chấp những nỗ lực tối đa của chúng ta, những con Trùng Hư Không đột biến đã hoàn toàn áp đảo [this.GetName]. Đợt oanh tạc dữ dội của những sinh vật cuồng loạn mãnh liệt đến mức làm nứt vỡ lõi hành tinh, khiến nó vỡ vụn thành từng mảnh. Không một ai sống sót.\n\nKể từ đó chúng đã quay trở lại tổ của mình và không còn bị kích động bởi sự hiện diện của chúng ta. Nếu may mắn, chúng sẽ ở yên đó mãi mãi."
 grand_archive.1205.desc.default: "$grand_archive.1205.desc_common$\n\nChúng ta không có phương cách nào trước thảm kịch này ngoại trừ việc tiếp tục sinh tồn và rút ra bài học từ những sai lầm."
 grand_archive.1205.desc.gestalt: "$grand_archive.1205.desc_common$\n\nSự mất mát của tổ chính là một đòn giáng nặng nề vào [event_target:victim_country.GetName], nhưng chúng ta vẫn tiếp tục trường tồn."
 grand_archive.1205.a: "Bây giờ là lúc để tái thiết."

 grand_archive.1210.name: "Trùng Hư Không Đột Biến Đã Bị Diệt"
 grand_archive.1210.desc: "Những con Trùng Hư Không đột biến được phát hiện trong [From.GetName] đã bị tiêu diệt. Sự hủy diệt của [avenged_homeworld.GetName] đã được báo thù.\n\nỔ trùng lớn nhất của các sinh vật đột biến kỳ lạ đã được bảo tồn. Dưới sự kiểm soát của chúng ta, chúng ta có thể nuôi dưỡng thêm những sinh vật độc đáo này mà không sợ nguy cơ chúng phát tán bừa bãi khắp thiên hà.\n\nTheo cách này, di sản của thế giới đã mất của chúng ta sẽ tiếp tục sống mãi."
 grand_archive.1210.a: "$grand_archive.1165.a$"

 grand_archive.1220.name: "Trùng Hư Không Đã Được Thuần Hóa"
 grand_archive.1220.desc.common: "Sau khi gửi một lượng đáng kể khoáng sản dinh dưỡng trực tiếp đến các tổ của chúng, chúng ta đã có thể phát triển mối quan hệ hòa hảo với những con Trùng Hư Không đột biến tại [frenzied_home_system.GetName]. Mối đe dọa từ những sinh vật này sẽ không còn bao trùm lên [frenzied_voidworms_target.GetName]. Sự an toàn của hành tinh chúng ta"
 grand_archive.1220.desc.common_2: "Những người chăm sóc thú giàu kinh nghiệm nhất của chúng ta đã làm việc không ngừng nghỉ để quản lý đàn thú, và giờ đây chúng dường như đã sẵn sàng hợp tác lẫn nhau.\n\nChúng ta đã tiếp nhận một trong những tổ lớn nhất của chúng. Với điều này, chúng ta có thể nuôi dưỡng thêm những con Trùng Hư Không đột biến này, những sinh vật mà lẽ ra đã bị bỏ mặc ngoài hoang dã."
 grand_archive.1220.desc.default: "$grand_archive.1220.desc.common$ cùng hệ sinh thái thiên hà đã được bảo đảm an toàn.\n\n$grand_archive.1220.desc.common_2$"
 grand_archive.1220.desc.homicidal: "$grand_archive.1220.desc.common$ đã được bảo đảm an toàn.\n\n$grand_archive.1220.desc.common_2$"
 grand_archive.1220.a: "Một sự bổ sung đáng hoan nghênh cho các hạm đội."
 grand_archive.1220.tt: "Tất cả các hạm đội Trùng Hư Không Cuồng Loạn được chuyển sang quyền kiểm soát của đế chế của bạn"

 grand_archive.7010.name: "Đã Phát Triển Mồi Nhử Hư Không"
 grand_archive.7010.desc.common: "Khả năng làm chủ các sinh vật không gian của chúng ta đã dẫn đến sự phát triển của thiết bị mà chúng ta gọi là §YMồi Nhử Hư Không§!."
 grand_archive.7010.desc: "$grand_archive.7010.desc.common$\n\nNhững công trình căn cứ sao này phải được xây dựng trong các hệ sao bản địa của từng loại Động Vật Không Gian cụ thể. Sau khi hoàn thành, chúng sẽ định kỳ thu hút các hạm đội sinh vật đến căn cứ sao.\n\nChúng ta nên thận trọng, vì một số loài sinh vật nhất định có thể trở nên hung hăng."
 grand_archive.7010.desc.nomadic: "$grand_archive.7010.desc.common$\n\nCác mô-đun này phải được lắp đặt trên các Trạm Trung Chuyển trong các hệ sao bản địa của từng loại Động Vật Không Gian cụ thể. Sau khi hoàn thành, chúng sẽ định kỳ thu hút các hạm đội sinh vật đến Trạm Trung Chuyển. Tàu Phương Chu được trang bị Mảng Mồi Nhử Hư Không thay vào đó có thể gọi đến những loài dã thú mà chúng ta từng chạm trán, lôi kéo chúng đến bất kỳ hệ sao nào là quê hương của loài chúng.\n\nChúng ta nên thận trọng, vì một số loài sinh vật nhất định có thể trở nên hung dữ."
 grand_archive.7010.desc.primal_calling: "$grand_archive.7010.desc.common$\n\nNhững thiết bị này được thiết kế để phát tín hiệu vào các vùng hoang dã của không gian và thu hút các sinh vật tìm nơi ẩn náu trong hư không. Chúng ta không chắc mình có thể thu hút những gì, nhưng các tần số hiện tại mà chúng ta đang phát sóng đang nhận lại các phản hồi có quy luật và đối xứng.\n\nCó thứ gì đó đang tiến về phía chúng ta."

 grand_archive.7020.name: "Khúc Ca Cá Voi"
 grand_archive.7020.desc: "§YMồi Nhử Hư Không§! mà chúng ta đã phát triển trước đó đã thu hút một nhóm cá voi không gian bản địa của các hệ sao có §HKhổng Lồ Khí§! tương tự như [This.Capital.System.GetName].\n\nCó vẻ như các thiết bị của chúng ta phải được xây dựng trong những môi trường đó mới có thể hoạt động bình thường. Nếu chúng ta phát hiện ra những loài động vật hoang dã khác, chúng ta cũng có thể xây dựng Mồi Nhử Hư Không gần môi trường sống tự nhiên của chúng."

 ### Treasure Hunters
 origin_treasure_hunters: "Thợ Săn Kho Báu"
 origin_treasure_hunters_desc: "Thấm nhuần niềm khao khát phiêu lưu mạo hiểm, nền văn minh này đã sẵn sàng bước vào cuộc viễn chinh vĩ đại và đầy thử thách nhất của họ. Chỉ trang bị một tấm bản đồ bí ẩn, giờ đây họ chạy đua giữa muôn vì sao để giành lấy kho báu hải tặc huyền thoại."
 origin_tooltip_treasure_hunters_effects: "- Bắt đầu với một ['r_celestial_chart_0_desc', $celestial_chart$] chưa kích hoạt\n- Mỗi lãnh đạo được tuyển dụng có thêm một đặc tính cộng thêm ['concept_adventurous_spirit_trait']$NEW_LINE$- Đặc tính Nhà cai trị:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_buccaneer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_trailblazer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_treasure_hoarder']"
 START_SCREEN_TREASURE_HUNTERS: "Nền văn minh của chúng ta được định hình bởi khát vọng phiêu lưu mạo hiểm.\n\nKhám phá những kho báu thất truyền từ lâu, thám hiểm các di tích cổ xưa, và khai quật những cổ vật từ các thời đại vượt xa thời đại của chúng ta; những sự kiện như vậy tạo nên những câu chuyện lẫy lừng nhất và đã truyền cảm hứng cho xã hội của chúng ta qua nhiều thế hệ.\n\nVậy đó là sự trùng hợp hay định mệnh khi bước chân đầu tiên của chúng ta vào không gian đã tạo ra một lời hiệu triệu phiêu lưu? Một viên nang bí ẩn không rõ nguồn gốc đã được phát hiện quay quanh hành tinh của chúng ta. Bên trong là một hải đồ mã hóa dẫn lối tới các vì sao.\n\nSau nhiều năm nỗ lực miệt mài, giờ đây chúng ta đã có công nghệ để giải mã tấm bản đồ này và vạch ra lộ trình tới những nơi chưa từng được khám phá. Khi chúng ta dong buồm hướng tới biên giới thiên hà, chúng ta đoàn kết trong quyết tâm dấn thân vào cuộc viễn chinh vĩ đại và gian nan nhất mà chúng ta từng đối mặt."
 START_SCREEN_TREASURE_HUNTERS_NOMADS: "Nền văn minh của chúng ta được định hình bởi niềm khát khao phiêu lưu mạo hiểm.\n\nKhám phá những kho báu thất truyền, khai phá những phế tích cổ xưa và khai quật những cổ vật từ các thời đại xa xưa; những sự kiện đó làm nên những câu chuyện truyền kỳ nhất và đã truyền cảm hứng cho xã hội chúng ta qua nhiều thế hệ.\n\nVậy đó là sự trùng hợp ngẫu nhiên hay định mệnh khi những chuyến lang bạt đã dẫn lối chúng ta tới một lời hiệu triệu phiêu lưu? Khi thám hiểm một hệ sao chưa được lập bản đồ, chúng ta đã trục vớt được một viên nang bí ẩn không rõ lai lịch. Bên trong là một hải đồ mã hóa dẫn lối tới các vì sao.\n\nSau nhiều năm nghiên cứu, cuối cùng chúng ta đã giải mã được tấm bản đồ này và vạch ra hải trình tới những cõi chưa từng được đặt chân tới. Khi chúng ta tiến ra biên cương thiên hà, chúng ta đồng lòng trong quyết tâm dấn thân vào chuyến thám hiểm vĩ đại và cam go nhất mà chúng ta từng nghênh đón."
 d_treasure_planet: "Kho Báu Vật"
 d_treasure_planet_desc: "Một kho lưu trữ an toàn nơi các vật phẩm quý giá có thể được sắp xếp, phục chế và bảo tồn."
