 leviathans.4100.a.xeno_geology: "$leviathans.4100.a$ §Y$EXHIBITION_XENO_GEOLOGY$§!"
 leviathans.4100.tooltip.no_pending_reward: "Bạn phải mở rộng Bộ Sưu Tập của mình để nhận thêm sự trợ giúp từ Hội Giám Tuyển."
 leviathans.4100.tooltip.no_reward: "Bạn đã yêu cầu tất cả các hỗ trợ có thể trong"
 leviathans.4100.tooltip.no_reward.aesthetic_wonder: "$leviathans.4100.tooltip.no_reward$ $EXHIBITION_AESTHETIC_WONDERS$"
