 leviathans.4112.desc: "$leviathans.4110.desc$"

 leviathans.4115.desc: "Quả thực vậy. Chúng tôi sẽ ủy thác cho các bạn một hiện vật từ bộ sưu tập tư nhân của chúng tôi.\n\nĐây không phải là một món quà nhỏ để yêu cầu từ chúng tôi, và chúng tôi mong đợi một khoản quyên góp đáng kể để đền đáp."
