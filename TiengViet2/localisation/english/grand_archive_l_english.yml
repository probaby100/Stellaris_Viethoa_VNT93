 r_the_modularium: "Cỗ Máy Tinh Chế Module"
 r_the_modularium_desc: "Một hệ thống tinh chế dạng module có thể tự vận hành sản xuất các tài nguyên quý giá với tốc độ tăng theo cấp số nhân, nhưng đòi hỏi nguồn năng lượng khổng lồ để duy trì."
 the_modularium_active_effect_tt: "Gấp đôi lượng tài nguyên được sản xuất bởi Cỗ Máy Tinh Chế Module, và tăng gấp đôi chi phí cho Triển Lãm Vang Danh tiếp theo của nó."

 r_flowmetal_alloy: "Hợp Kim Kim Loại Lỏng"
 r_flowmetal_alloy_desc: "Vật liệu tự sao chép này củng cố các liên kết hóa học của bất kỳ kim loại nào mà nó tiếp xúc. Việc tích hợp kim loại lỏng vào quy trình lắp ráp của chúng ta có thể cải thiện đáng kể năng lực sản xuất máy móc quy mô lớn."
 flowmetal_alloy_active_effect_tt: "Tạo ra §G300§! §YDân Số Robot £pop£§! tại thủ đô của bạn."

 r_crystallinus_diffuser: "Máy Khuếch Tán Tinh Thể"
 r_crystallinus_diffuser_desc: "Một cỗ máy có khả năng chuyển hóa các tinh thể tổng hợp thành một loại thuốc tăng cường hiệu suất cực mạnh. Ở dạng tinh khiết nhất, hóa chất tạo thành có tính biến đổi sinh học cao và có thể gây suy đa cơ quan ở một tỷ lệ nhỏ người dùng."
 crystallinus_diffuser_active_effect_tt: "£mod_pop_bonus_workforce_mult£ $mod_organic_pop_bonus_workforce_mult$: §G+$@crystallinus_diffuser_workforce_mult|0%$§! trong $@triumph_duration_years|0$ năm. Khi hiệu ứng này hết hạn, §R$@crystallinus_diffuser_death_percentage|0%$§! tổng số Dân Số Hữu Cơ £pop£ sẽ thiệt mạng."
