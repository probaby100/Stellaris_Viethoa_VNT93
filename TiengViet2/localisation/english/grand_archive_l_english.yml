 crystallinus_diffuser_modifier: "Triển Lãm Vang Danh $r_crystallinus_diffuser$"

 r_everchanging_stone: "Viên Đá Thiên Biến"
 r_everchanging_stone_desc: "Một viên đá quý nhân tạo có thể biến đổi màu sắc và thành phần hóa học dựa trên môi trường xung quanh. Khi đặt cạnh bất kỳ vật thể nào, nó bắt chước các nguyên tố của vật liệu đó và cho phép chúng ta hiểu rõ hơn về thành phần phân tử của đối tượng."
 everchanging_stone_modifier: "Triển Lãm Vang Danh $r_everchanging_stone$"
 everchanging_stone_modifier_tt: "Đối với mỗi ['concept_specimen', Mẫu vật] được trưng bày trong $EXHIBITION_XENO_GEOLOGY$, tăng sản lượng của hai hạng mục còn lại thêm §G+$@everchanging_stone_modifier|0%$§!."

 r_pulsestone: "Đá Xung Mạch"
 r_pulsestone_desc: "Một viên đá có tính phóng xạ cao tạo ra những đợt sóng từ lực nguy hiểm. Nó có tiềm năng cách mạng hóa hiểu biết của chúng ta về thao túng trường lực, nhưng năng lượng mà nó phát ra gần như không thể chế ngự."
 pulsestone_modifier: "$r_pulsestone$"
 mod_scientist_lifespan_add: "Tuổi Thọ Nhà Khoa Học"

 r_gavel_of_the_tribunal: "Chiếc Búa Phán Quyết Của Tòa Án"
 r_gavel_of_the_tribunal_desc: "Khắc trên cán của chiếc búa này là tên của ba bộ óc tam đầu chế cổ đại từng cai trị một thiên hà nay đã lụi tàn. Mặc dù nó quá đồ sộ để bất kỳ ai thuộc chủng tộc của chúng ta có thể cầm nắm, nhưng sự hiện diện đơn thuần của nó cũng đủ gợi lên sự kính sợ không hề nhỏ."
