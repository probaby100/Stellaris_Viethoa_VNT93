 grand_archive.4121.name: "$leviathans.500.name$"
 grand_archive.4121.desc.common: "đã nhận được thông tin rằng các bạn đã xây dựng một §Y$grand_archive$§! có khả năng phục vụ lượng khách tham quan quy mô khổng lồ. Đây là một sáng kiến đáng khen ngợi trong việc chia sẻ lịch sử thiên hà với tất cả những ai tìm kiếm tri thức đó. Chúng ta chia sẻ những mục tiêu chung về phương diện này.\n\nChúng tôi rất mong muốn được hỗ trợ các bạn theo đuổi nỗ lực này."
 grand_archive.4121.desc.default: "Chúng tôi $grand_archive.4121.desc.common$ Hãy tiếp tục mở rộng §YBộ Sưu Tập§! của các bạn, và đổi lại chúng tôi sẽ hỗ trợ hết sức trong khả năng của mình."
 grand_archive.4121.desc.dead: "Những tàn dư cuối cùng của bang hội chúng tôi $grand_archive.4121.desc.common$ Mặc dù bang hội của chúng tôi gần đây đã bị tan vỡ, chúng tôi vẫn sẽ sử dụng các tài sản còn lại để hỗ trợ khi các bạn mở rộng §YBộ Sưu Tập§!."

 leviathans.4100.desc: "Chắc chắn rồi!\n\nNhững nỗ lực của các bạn không lọt khỏi mắt chúng tôi. Dựa trên §YBộ Sưu Tập§! hiện tại của các bạn, chúng tôi có thể cung cấp sự hỗ trợ sau đây để đổi lại một khoản đóng góp nhỏ."
 leviathans.4100.a: "Cho chúng tôi biết thêm về"
 leviathans.4100.a.aesthetic_wonder: "$leviathans.4100.a$ §Y$EXHIBITION_AESTHETIC_WONDERS$§!"
