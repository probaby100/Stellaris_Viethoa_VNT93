 fcsum_voidworms_1: "$fcsum_critters_1$"
 grand_archive.2000.name: "Vô Số Âm Thanh"
 grand_archive.2000.desc: "Cảm biến chỉ ra một sự hiện diện trong hệ sao [This.System.GetName] đang gửi các tín hiệu thô sơ qua khắp thiên hà. Những mô thức tương tự này đã được máy quét tầm xa ghi nhận bắt nguồn từ những vùng chưa xác định. Dù chưa rõ liệu các tín hiệu này có mang tính chủ đích hay không, điều này rất đáng để điều tra thêm."
 grand_archive.2000.a: "Tìm hiểu thêm."
 fcsum_voidworms_2: "§H[This.ContactCountry.GetName]§! đã được xác định là loài ký sinh thiên hà được biết đến với cái tên \"Trùng Hư Không\"."
 grand_archive.2005.name: "$NAME_Voidworms$"
 grand_archive.2005.desc: "Chúng ta đã phát hiện ra rằng các tín hiệu truyền xa bắt nguồn từ một sinh vật không gian đơn giản mà chúng ta quen gọi là §H\"$NAME_Voidworms$\"§!. Dường như thiên hà tràn ngập những sinh vật này. Từ các bước sóng khác nhau của tín hiệu, chúng ta xác định được rằng sinh vật phát triển qua nhiều giai đoạn sinh trưởng trước khi đạt độ trưởng thành hoàn toàn. Dù bề ngoài chúng có vẻ không hung hăng, nhưng mô thức giao tiếp của chúng cho thấy sự phối hợp trên quy mô toàn thiên hà."
 grand_archive.2005.a.homicidal: "Lũ dã thú vô tri cần phải bị tiêu diệt."
 grand_archive.2015.name: "Enzyme Trùng Hư Không"
 grand_archive.2015.desc: "Trùng Hư Không giao phối theo nhóm ba cá thể, một cấu trúc được gọi là \"Tam Thể\". Những sinh vật này gắn kết suốt đời trong một nghi thức giao phối không bao giờ kết thúc. Tuy nhiên, chúng đòi hỏi một vật chủ sinh học bên ngoài để sinh ra con non.\n\nChúng là loài ký sinh.\n\nKhi trưởng thành, mỗi con Trùng Hư Không phát triển một chùm nang bên trong hệ thống sinh sản của chúng. Những u nang bảo vệ này chứa các giao tử có tính ăn mòn cao, khi kết hợp với những cá thể khác trong Tam Thể, có thể được phóng tới các hành tinh có sinh khối thích hợp để sinh ra thêm các nhộng trùng. Vật chủ của chúng không thể sống sót qua quá trình này. Chúng ta đã thấy bằng chứng cho thấy Trùng Hư Không phối hợp các đợt oanh tạc của chúng để duy trì một số lượng vật chủ khả dĩ bền vững trên khắp thiên hà.\n\nDù sao đi nữa, chúng ta tin rằng chúng ta có thể khai thác sức mạnh từ các enzyme sinh sản của chúng để phục vụ lợi ích của riêng mình. Chúng ta thậm chí có thể phát triển khả năng miễn dịch trước các nỗ lực sinh sản của chúng."
 grand_archive.2015.a: "Khai thác khả năng sinh sản của chúng cho nhu cầu của chúng ta."
 grand_archive.2015.b: "Thật kinh tởm. Hãy tìm phương thuốc chữa."

