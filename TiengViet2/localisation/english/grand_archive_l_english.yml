 gavel_of_the_tribunal_no_galcom_nomads: "$r_gavel_of_the_tribunal$"

 r_celestial_resonator: "Bộ Cộng Hưởng Thiên Cung"
 r_celestial_resonator_desc: "Một thiết bị kỳ lạ tạo ra những màn trình diễn ánh sáng đồ sộ đầy mê hoặc và gia tăng hiệu lực khi được đặt gần các mẫu vật."
 celestial_resonator_tt: "Sản xuất 10 $r_unity$ cho mỗi ['concept_specimen', Mẫu vật] được trưng bày"
 celestial_resonator_triumph_tt: "Nhận §G+$@celestial_resonator_happiness|0%$§! £happiness£ §YĐộ Hạnh Phúc§! và §G+$@celestial_resonator_diplo_weight|0%$§! £diplo_weight£ §YTrọng Lượng Ngoại Giao§! cho mỗi ['concept_specimen', Mẫu vật] được trưng bày"
 celestial_resonator_modifier: "$r_celestial_resonator$"

 r_entangled_relay: "Rơ-le Vướng Lượng Tử"
 r_entangled_relay_desc: "Vật thể cổ xưa này có khả năng kết nối các mạng truyền tải thông tin xa xôi thông qua hiện tượng vướng lượng tử, cho phép liên lạc liền mạch trong toàn thiên hà."
 entangled_relay_modifier: "$r_entangled_relay$"
 entangled_relay_nomads_modifier: "$r_entangled_relay$"

 r_prototype_vir_core: "Lõi VIR Nguyên Mẫu"
 r_prototype_vir_core_desc: "Trí tuệ nhân tạo cô lập này là một người thầy và người cố vấn đặc biệt hiệu quả, có thể trợ giúp trong hầu hết mọi tình huống. Nó vượt trội trong việc diễn giải những vấn đề phức tạp bằng ngôn từ đơn giản, trình bày thông tin rõ ràng để người dùng đưa ra các quyết định sáng suốt."
 prototype_vir_core_modifier: "$r_prototype_vir_core$"

 r_propagandosphere: "Khối Cầu Tuyên Truyền"
 r_propagandosphere_desc: "Khối cầu ảnh toàn ký này chứa một kho lưu trữ các bộ phim tuyên truyền từ một nền văn minh đã qua. Vô cùng sáng tạo và cuốn hút khi thưởng thức, chúng có thể được làm lại theo hình mẫu của chúng ta để truyền cảm hứng cho quân đội và nhân dân."

 r_executus_compendium: "Đại Thư Executus"
 r_executus_compendium_desc: "Những ghi chép sâu rộng về hội đồng của một nền văn minh cổ đại được bảo quản trong một viên nang kín. Bên trong hàng nghìn tỷ trang sách là những tường thuật chi tiết về việc tối ưu hóa bộ máy quan liêu và các công cụ tổ chức đổi mới. Nhiều cải tiến trong số này có thể được áp dụng vào các quy trình chính phủ của chúng ta."
 executus_compendium_triumph_tt: "Khai mở Chương Trình Nghị Sự với 10% chi phí mở sớm thông thường. (Chi phí tối thiểu £unity£3000)"

 r_the_pattern_maker: "Cỗ Máy Kiến Tạo Mô Thức"
 r_the_pattern_maker_desc: "Cỗ máy tính toán cổ xưa này có khả năng vô song trong việc theo dõi các quỹ đạo động lực học và dự đoán hành vi của các vật thể như tàu chiến đối phương. Các mô thức dữ liệu được tạo ra từ các thuật toán dự đoán của nó có nhiều tầng lớp sâu sắc như thiết kế của một kiến trúc sư bậc thầy. Khi được cung cấp đủ năng lượng và vật liệu, nó có thể tạo ra một tàu trinh sát chuyên dụng được trang bị các cảm biến công suất cao."
 r_the_pattern_maker_effect_tt: "Tạo ra một Tàu Trinh Sát Cấp §YPatternwalker§!.\n - Tốc độ cực cao và Tầm Quét Siêu Không Gian cực rộng"
 NAME_Patternwalker: "Patternwalker"
