 resolution_galactic_focus_crisis_voidworm_plague: "Tiêu Điểm: Đại Dịch Trùng Hư Không"
 resolution_galactic_focus_crisis_voidworm_plague_desc: "Loài ký sinh Trùng Hư Không là mối nguy hại cho thiên hà. Nếu chúng ta không đoàn kết để ngăn chặn chúng, chúng sẽ nuốt chửng tất cả chúng ta. Chúng ta nên đặt việc giải quyết cuộc khủng hoảng này làm Tiêu Điểm Thiên Hà."
 resolution_galactic_focus_crisis_voidworm_plague_effect_success: "$resolution_galactic_focus_crisis_effect_success$"
 galactic_focus_crisis_voidworm_plague: "Đánh Bại Đại Dịch Trùng Hư Không"
 galactic_focus_crisis_voidworm_plague_desc: "Đại Dịch Trùng Hư Không là mối đe dọa cho toàn bộ thiên hà. Chúng ta phải đoàn kết và đánh bại mối nguy hiểm ký sinh này."
 gal_com_crisis_voidworm_pop_victims: "Trùng Hư Không đã gây ra thiệt hại đáng kể cho dân cư trong lãnh thổ của họ."

