 grand_archive.5015.name: "Thành Lập Kho Báu Vật"
 grand_archive.5015.desc: "Tấm §Y$celestial_chart$§! đã cung cấp cho chúng ta thông tin thẩm định được lưu trữ rất hữu ích cho việc trích xuất giá trị lớn hơn từ những kho báu mà chúng ta khám phá. Chúng ta nên thành lập một §YKho Báu Vật§! trên một trong các thuộc địa của mình, nơi những món cổ vật giá trị có thể được phân loại, phục chế và bảo tồn. Dựa trên hậu cần hiện tại, các thuộc địa sau đây rất thích hợp cho cơ sở mới này."
 grand_archive.5015.a: "Xây dựng $d_treasure_planet$ trên §Y[event_target:treasure_planet_candidate_1.GetName]§!."
 grand_archive.5015.b: "Xây dựng $d_treasure_planet$ trên §Y[event_target:treasure_planet_candidate_2.GetName]§!."
