 RADIOACTIVE_PLANET_DESC: "Chúng ta đã phát hiện một hành tinh chứa một lượng lớn đồng vị phóng xạ bị phân rã nặng nề. Cần tiến hành điều tra thêm."

 d_radioactive_ruins: "£blocker£ Phế Tích Nhiễm Phóng Xạ"
 d_radioactive_ruins_desc: "Một nền văn minh cổ đại đã bị xóa sổ tại đây bởi một vụ bùng phát tia gamma cực mạnh từ thuở xa xưa. Những tàn tích này là tất cả những gì còn sót lại."

