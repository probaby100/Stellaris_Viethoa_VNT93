 tech_sensors_bio_integration_effect: "§HMở khóa Tính năng:§! Nâng cấp Cảm biến cho Dã Thú Không Gian"
 tech_combat_computers_bio_integration: "Tích Hợp Sinh Học Máy Tính Chiến Đấu"
