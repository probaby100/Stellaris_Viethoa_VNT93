###################
# Treasure Troves #
###################
 TREASURE_TROVE: "Kho Báu Vật"
 TREASURE_TROVE_DESC: "Một §Y$TREASURE_TROVE$§! của hải tặc thất truyền từ lâu đã được phát hiện tại một nơi nào đó trên [this.GetName]. Ai biết nó có thể chứa đựng những của cải gì..."

 treasure_troves_chain_title: "Kho Báu Vật"
 treasure_troves_chain_desc: "Xuyên suốt lịch sử của thiên hà này, những tên cướp biển đã giấu những chiến lợi phẩm bất chính của chúng trong các Kho Báu Vật được bố trí cẩn mật. Nhiều kho bí mật trong số đó đã bị bỏ rơi và coi như thất lạc, nhưng giờ đây chúng là của chúng ta để đoạt lấy."

 mod_treasure_trove_reward_mult: "Phần Thưởng Kho Báu Vật"

 grand_archive.6010.name: "Phát Hiện $TREASURE_TROVE$"
 grand_archive.6010.desc: "Chúng ta đã phát hiện một tín hiệu yếu ớt từ một nơi nào đó trên [event_target:treasure_trove_planet.GetName]. Dựa trên phép mật mã thô sơ, chúng tôi tin rằng đây là từ một §Y$TREASURE_TROVE$§! của hải tặc thất lạc từ lâu.\n\nSẽ mất một chút công sức, nhưng chúng tôi tự tin rằng mình có thể khai quật những bí mật của nó."
 grand_archive.6010.a: "Làm lộ vị trí của nó."

 grand_archive.6015.name: "Thu Hồi Kho Báu"
 grand_archive.6015.common.1: "Sau khi cẩn thận vô hiệu hóa hệ thống phòng thủ của §Y$TREASURE_TROVE$§! hải tặc bí mật trên [event_target:treasure_trove_planet.GetName]"
 grand_archive.6015.desc: "$grand_archive.6015.common.1$, chúng ta đã phát hiện ra một kho chứa các tài nguyên quý giá.\n\nChúng ta sẽ sử dụng thật tốt món quà bất ngờ này."
 grand_archive.6015.desc.specimen: "$grand_archive.6015.common.1$, chúng ta đã phát hiện một cổ vật hải tặc cổ xưa được bảo quản trong một thùng chứa kín. Mảnh ghép lịch sử cướp biển này sẽ được bổ sung vào bộ sưu tập của chúng ta."
 grand_archive.6015.desc.specimen_extra: "Ngoài ra, chúng ta đã phát hiện một cổ vật hải tặc cổ đại ẩn giấu bên trong §Y$TREASURE_TROVE$§! rộng lớn. Với sự phục chế cẩn thận, mảnh ghép lịch sử hải tặc này sẽ là sự bổ sung tuyệt vời cho bộ sưu tập của chúng ta."
 grand_archive.6015.desc.pirate_ship: "Sau khi cẩn thận gỡ bỏ hệ thống phòng thủ của §Y$TREASURE_TROVE$§! thất lạc, chúng ta phát hiện ra những chỉ dẫn cơ học dẫn đến một điểm trên hành tinh bên dưới. Tại đó, chúng ta tìm thấy một thiết giáp hạm hải tặc đáng kinh ngạc được bảo vệ bởi một mảng chống phát hiện.\n\nCon tàu này, mang tên [treasure_trove_pirate_ship.GetName], đã được sáp nhập vào lực lượng quân sự của chúng ta."
 grand_archive.6015.desc.tech: "$grand_archive.6015.common.1$, chúng ta đã phát hiện một ngân hàng dữ liệu chứa các bài báo nghiên cứu quý hiếm và giá trị.\n\nLàm thế nào những thứ này có được thì vẫn chưa rõ, nhưng chúng ta có thể sử dụng chúng một cách hiệu quả."
 grand_archive.6015.a: "$GOOD$"
 treasure_trove_specimen_tt: "$t$Thu hồi một ['concept_specimen', Mẫu vật]."
 treasure_trove_pirate_ship_tt: "$t$Thu hồi một tàu chiến quân sự của hải tặc."

