 tech_voidworm_immunity_desc: "Chúng ta có thể phát triển một phương thuốc chữa trị sự lây nhiễm ký sinh của Trùng Hư Không. Tất cả các thuộc địa của chúng ta sẽ được miễn dịch trước chủng oanh tạc bào tử hiện tại của chúng."
 tech_voidworm_immunity_effect: "Các thuộc địa được miễn nhiễm trước oanh tạc của Trùng Hư Không.\n$mod_damage_vs_country_type_voidworms_mult$: §G+$@vaccine_damage_vs_country_type_voidworms_mult|0%$§!"
