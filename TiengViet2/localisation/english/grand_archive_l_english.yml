 concept_space_fauna_ship_component_desc: "Linh Kiện Tàu Dã Thú Không Gian là các linh kiện thu được từ việc nghiên cứu các dự án đặc biệt về các loài Dã Thú Không Gian khác nhau. Mọi phần thưởng áp dụng cho các linh kiện này cũng sẽ được áp dụng khi trang bị dưới dạng §HĐột Biến§! trên Dã Thú Không Gian. Ví dụ về các linh kiện này bao gồm nhưng không giới hạn ở:\n- §H$SPACE_WHALE_WEAPON_1$§!\n- §H$AMOEBA_STRIKE_CRAFT$§!"

