 GRAND_ARCHIVE_TITLE: "Grand Archive" # Do not translate
 DLC_GRAND_ARCHIVE_RECOMMENDATION_DESC: "Chúng tôi đề xuất §S$GRAND_ARCHIVE_TITLE$§! vì một số lựa chọn của bạn rất phù hợp với nội dung của nó."

 grand_archive: "Đại Lưu Trữ Viện"
 the_grand_archive: "Đại Lưu Trữ Viện"
 grand_archive_0: "$grand_archive$"
 grand_archive_0_DESC: "Một cấu trúc quỹ đạo chuyên dụng được thiết kế để lưu giữ và trưng bày các ['concept_specimen', Mẫu Vật] đáng chú ý mà chúng ta đã thu thập trên khắp thiên hà, bao gồm cả §YĐộng Vật Không Gian§! còn sống."
 grand_archive_0_MEGASTRUCTURE_DETAILS: "§Y$grand_archive$§! bảo tồn và trưng bày những cổ vật giá trị nhất mà chúng ta đã thu thập được trên khắp thiên hà. Bên trong còn dành riêng một viện động vật sống để giam giữ và quan sát §YĐộng Vật Không Gian§! còn sống."
 requires_grand_archive: "$dlc_requirement_string$ §IGrand Archive§!"

 GOTO_COLLECTION: "§YĐi Tới $COLLECTION$§!"

 must_have_2500_pops: "Yêu cầu một thiên thể có ít nhất §Y2500§! £pop£ §HDân Số§!."

 STARBASE_CANNOT_UPGRADE_CONSTRUCTION_TYPE: "§RHạm đội này không thể nâng cấp tại bất kỳ Căn cứ Sao nào của chúng ta§!"

 VOIDWORMS_LABEL: "$voidworms_plural$"
 VOIDWORMS_LABEL_TOOLTIP: "§H$VOIDWORMS_LABEL$§!\nTùy chọn này kiểm soát số lượng $voidworms_plural$ sẽ xuất hiện trong thiên hà.$requires_grand_archive$"
 CUTHOLOIDS_LABEL: "$cutholoids_plural$"
 CUTHOLOIDS_LABEL_TOOLTIP: "§H$CUTHOLOIDS_LABEL$§!\nTùy chọn này kiểm soát số lượng $cutholoids_plural$ sẽ xuất hiện trong thiên hà.$requires_grand_archive$"

