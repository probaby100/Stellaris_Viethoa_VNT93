 councilor_beastmasters: "Chúa Tể Dã Thú"
 councilor_beastmasters_desc: "$TITLE$ là một vị trí chuyên biệt và đầy uy quyền, chủ yếu tập trung vào việc quản lý và triển khai chiến lược các Tàu Dã Thú Không Gian."
 councilor_corporate_beastmasters: "Trang Trại Trưởng"
 councilor_corporate_beastmasters_desc: "$TITLE$ đảm bảo sức khỏe và sự bổ sung liên tục cho các Tàu Dã Thú Không Gian. Vai trò đầy năng động này đòi hỏi sự kết hợp độc đáo giữa chuyên môn về hậu cần, sinh thái học và chăn nuôi."

