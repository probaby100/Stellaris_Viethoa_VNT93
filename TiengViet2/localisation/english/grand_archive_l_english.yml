 DEAD_CURATORS_STAGE_3_DESC: "Những vật phẩm quyền năng này đã được cất giấu trong các kho bí mật quanh thiên hà, cho phép chúng sống sót sau khi trạm của chúng tôi bị phá hủy.\n\n$grand_archive.4105.desc.3.common_2$ chúng tôi không thể tái thiết chỉ dựa vào lòng tốt."
 grand_archive.4105.desc.3.xeno_geology: "$grand_archive.4105.desc.common.xeno_geology$\n\n$grand_archive.4105.desc.3.common$"
 grand_archive.4105.desc.3.aesthetic_wonder: "$grand_archive.4105.desc.common.aesthetic_wonder$\n\n$grand_archive.4105.desc.3.common$"
