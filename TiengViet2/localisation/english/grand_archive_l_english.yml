# Leader Traits #
#################
 leader_trait_buccaneer: "Hải Tặc Trục Vớt"
 leader_trait_buccaneer_desc: "Là bậc thầy trục vớt trên chiến trường, nhà lãnh đạo này có thể trích xuất từng chút giá trị ngay cả từ những mảnh xác tàu hư hại nặng nề nhất."
 leader_trait_trailblazer: "Kẻ Mở Đường"
 leader_trait_trailblazer_desc: "Bị mê hoặc bởi triển vọng đầy hứa hẹn nơi biên cương ngân hà, nhà lãnh đạo này khao khát lập hải đồ cho những vùng không gian xa xôi nhất."
 leader_trait_treasure_hoarder: "Kẻ Tích Trữ Kho Báu"
 leader_trait_treasure_hoarder_desc: "Không món tiền thưởng nào đủ lớn để thỏa mãn tham vọng của nhà lãnh đạo này. Việc tích lũy tài nguyên quý giá là động lực hàng đầu của họ."

