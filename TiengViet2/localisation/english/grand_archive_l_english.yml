 wealth_distribute_favor_tier_1_tt: "Nhận §Y1§! Ân Huệ từ mỗi Đế Chế."
 wealth_distribute_favor_tier_2_tt: "Nhận §Y2§! Ân Huệ từ mỗi Đế Chế."

 leader_trait_pirate_queen: "Nữ Hoàng Hải Tặc"
 leader_trait_pirate_queen_desc: "Nhiều năm mưu mô xảo quyệt và những chiến tích kỳ dị đã tạo nên một nhà lãnh đạo không bao giờ rời đi với số tài sản ít hơn thứ bà ta nhắm tới."
 captain_ness_leader_desc: "Ý thức của một nữ hoàng hải tặc cổ đại trong hình hài cơ khí. Bà đã gieo mầm kho báu lên nhiều thế giới."
 captain_ness_leader_catch_phrase: "Hãy cùng nhau xây dựng di sản của chúng ta."

