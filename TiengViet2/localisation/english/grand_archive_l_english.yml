 sm_arkship_voidlure: "Mảng Mồi Nhử Hư Không"
 sm_arkship_voidlure_desc: "Một tổ hợp các bộ phát mồi nhử hư không gắn trên Tàu Phương Chu. Bằng cách nhắm mục tiêu vào các hệ sao phù hợp với sở thích môi trường sống của Động Vật Không Gian, chúng có thể bị dẫn dụ đến hệ sao đó."
 sm_arkship_voidlure_tt: "$ARKSHIP_ACTION_HEADER$ $TABBED_NEW_LINE$['scripted_action:arkship_voidlure_generic']"
 voidlure_action_cooldown_desc: "Tái Nạp Mồi Nhử Hư Không"
 arkship_voidlure_generic: "Dụ Động Vật Không Gian"
 arkship_voidlure_effect: "$SYSTEM_EFFECTS_HEADER$ $TABBED_NEW_LINE$- Dụ §HĐộng Vật Không Gian§! đến một Hệ sao. $TABBED_NEW_LINE$- Chúng ta chỉ có thể Dụ các sinh vật mà chúng ta đã từng chạm trán. $TABBED_NEW_LINE$- Chỉ có thể nhắm vào ['concept_space_fauna_home_systems'] hợp lệ. $TABBED_NEW_LINE$- Sinh vật bị dụ sẽ trở nên §Htạm thời thuần phục§!. $TABBED_NEW_LINE$- Sinh vật bị dụ sẽ đến sau khi quá trình nhử hoàn tất §H30-90 ngày§!. $TABBED_NEW_LINE$- Tất cả các mồi nhử đều dùng chung một §HThời gian hồi§!."
 arkship_voidlure_cta: "§GBản Đồ Thiên Hà: Nhấp chuột phải để nhắm mục tiêu vào Hệ sao hợp lệ.§!"
 arkship_voidlure_desc: "§LMảng phát vang vọng tiếng hát vào hư không, và những sinh vật cư ngụ nơi đó bị cuốn hút trước lời hiệu triệu.§!"
