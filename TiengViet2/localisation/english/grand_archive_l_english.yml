 grand_archive.1002.name: "Sự Sống Giữa Muôn Vì Sao"
 grand_archive.1002.desc.default: "Hư không tràn ngập sự sống. Chúng ta đã phát hiện ra sự tồn tại của [from.GetSpaceFaunaNamePlural], nhưng ngoài kia còn có những gì nữa?\n\nMối liên kết mật thiết của chúng ta với động vật hoang dã trên [capital_scope.GetName] có thể không còn phù hợp ở quy mô thiên hà. Khoảng không vũ trụ đại diện cho một hệ sinh thái hoàn toàn mới, và chúng ta thấy mình đang đứng trước ngã ba đường.\n\nNhững sinh vật này là gì đối với chúng ta?\n\nBất kể chúng ta đưa ra lựa chọn nào, hệ quả của nó sẽ được cảm nhận trong nhiều năm tới."
 grand_archive.1002.desc.homicidal: "Khoảng không vũ trụ rất có thể tràn ngập sự sống - để chúng ta tận diệt, hoặc để sử dụng. Sau khi phát hiện ra sự tồn tại của [from.GetSpaceFaunaNamePlural], chúng ta khao khát tìm kiếm thêm. Con mồi tươi sống hay dã thú kéo cày, quyền lựa chọn nằm ở chúng ta."
 grand_archive.1002.a: "Mẫu vật để trưng bày."
 grand_archive.1002.b: "Gia súc để khai thác."
 grand_archive.1002.c: "Sinh vật cần được chở che."
 grand_archive.1002.d: "Con mồi mới để săn đuổi."
 grand_archive.1002.d.purifier: "Xác chết đắp thêm vào gò."
 grand_archive.1002.e: "Thêm tâm trí để đồng hóa."
 grand_archive.1002.f: "Bạn đồng hành cùng cộng sinh."
 grand_archive.1002.g: "Con mồi và thực phẩm."

 untamed_wilds: "Vùng Hoang Dã Chưa Thuần Hóa"
 untamed_wilds_desc: "Những dải lãnh thổ bảo tồn rộng lớn nơi động vật hoang dã được tự do phát triển, cung cấp nguồn sinh vật bản địa dồi dào và bền vững."
 grand_archive.1010.desc: "Thuộc địa của chúng ta trên [Root.GetName] đã học được cách tôn trọng ranh giới lãnh thổ tự nhiên của §YSinh Vật Khổng Lồ§! bản địa.\n\nNhững quái thú to lớn này sẽ tiếp tục mang lại lợi ích cho khu định cư của chúng ta khi chúng ta mở rộng biên giới và khai phá đất đai."
 grand_archive.1010.a: "Các [owner.GetWranglerJobNamePlural] của chúng ta sẽ làm rất tốt ở đây."

