##########
# Civics #
##########

 civic_galactic_curators: "Giám Tuyển Ngân Hà"
 civic_galactic_curators_desc: "Việc thu thập và bảo tồn tỉ mỉ các cổ vật lịch sử luôn mê hoặc nền văn minh này. Nhưng giờ đây, khi những bí ẩn của ngân hà hiển hiện ngay trước ngưỡng cửa, vẫn còn vô vàn điều để tìm hiểu."
 civic_galactic_curators_effects: "$civic_galactic_curators_effects_common$\n- $entertainers_are_curators_tt$"
 civic_corporate_galactic_curators: "Chuyên Gia Cổ Vật"
 civic_corporate_galactic_curators_desc: "Có thể kiếm bộn tiền từ đồ cổ và vật phẩm sưu tầm, điều mà xã hội này thấu hiểu hơn ai hết. Là những chuyên gia đầu cơ vật chất, giờ đây họ hướng ánh nhìn lên trời cao để tìm kiếm cơ hội đầu tư."
 civic_corporate_galactic_curators_effects: "$civic_galactic_curators_effects_common$\n- $entertainers_are_curators_tt$\n- Tòa nhà £building£ §Y$building_public_relations_office$§! $megacorp_civic_branch_office_building_effect$"
 civic_hive_galactic_curators: "Mạng Lưới Quản Thủ"
 civic_hive_galactic_curators_desc: "Tập thể này đã tiến hóa một thôi thúc áp đảo là chiếm lấy, gìn giữ và duy trì. Tập tính từng giúp chúng sinh tồn trong quá khứ này, nay thôi thúc chúng phô bày những tín vật thu thập được trong một bố cục vĩ đại."
 civic_hive_galactic_curators_effects: "$civic_galactic_curators_effects_common$"
 civic_machine_galactic_curators: "Mạng Lưới Quản Thủ"
 civic_machine_galactic_curators_desc: "Trí tuệ Nhân tạo này có một chỉ thị cốt lõi trong mã nguồn: Thu thập và Bảo tồn."
 civic_machine_galactic_curators_effects: "$civic_galactic_curators_effects_common$"
 civic_galactic_curators_effects_common: "- $GUARANTEED_RESEARCH_OPTION_STRING$ ['technology:tech_galactic_archivism', £society_research£$tech_galactic_archivism$]\n- ['concept_specimen', Tiêu Bản] khởi đầu: Một §0$common$§! cho mỗi Danh mục Bộ sưu tập \n- Nhận $r_unity$ mỗi khi bạn tìm thấy một §YTiêu Bản§! hoặc hoàn thành một §Y$ARCHAEOLOGICAL_SITE$§! \n- Mua từ §YHội Giám Tuyển§!: §G$@galactic_curators_curator_enclave_purchase_cost|%0$§!\n- Kích hoạt Sắc lệnh §Y$edict_decentralized_research$§!, tăng Sản lượng §YTrạm Nghiên Cứu§! nhưng giảm Sản lượng Nghề £job_researcher£ §Y[GetResearcher]§!"
 edict_decentralized_research: "Nghiên Cứu Phân Tán"
 edict_decentralized_research_desc: "Tri thức vĩ đại nhất nằm bên ngoài nền văn minh của chính chúng ta. Bằng cách tập trung vào toàn thể ngân hà rộng lớn hơn, chúng ta có thể thấu hiểu bản thân một cách trọn vẹn hơn."
 edict_decentralized_research_nomad: "$edict_decentralized_research$"
 edict_decentralized_research_nomad_desc: "$edict_decentralized_research_desc$"
 MOD_COUNTRY_SPECIMEN_ACQUIRE_CHANCE_MULT: "Tăng tỉ lệ phát hiện Tiêu Bản"

 councilor_galactic_curators: "Đại Giám Tuyển"
 councilor_galactic_curators_desc: "$TITLE$ chịu trách nhiệm giám sát chất lượng bảo tồn của tất cả Tiêu Bản."
 councilor_corporate_galactic_curators: "Chuyên Viên Giám Tuyển"
 councilor_corporate_galactic_curators_desc: "$TITLE$ chịu trách nhiệm quản lý việc triển lãm và buôn bán Tiêu Bản."

 civic_beastmasters: "Chúa Tể Dã Thú"
 civic_beastmasters_desc: "Đạt tới độ chín muồi hoàn toàn về công nghệ trong một hệ sao vốn là bãi kiếm ăn của Trùng Biến Hình Không Gian, xã hội này đã có được hiểu biết sâu sắc về vòng đời của chúng. Giờ đây họ nỗ lực nuôi dưỡng, chăm sóc và cuối cùng là nhân bản những sinh vật này vì lợi ích chung."
 civic_machine_beastmasters: "Drone Sinh Học"
 civic_machine_beastmasters_desc: "Từng kết nối trực tiếp với các sinh vật sinh học cư ngụ trong hư không tại hệ sao quê nhà, Trí tuệ Nhân tạo này đã tích hợp những sinh vật hùng mạnh đó vào chức năng cốt lõi của mình. Kết quả là một mối quan hệ đôi bên cùng có lợi."
 civic_hive_beastmasters: "Bầy Hoang Dã"
 civic_hive_beastmasters_desc: "Là một quần thể có khả năng thích nghi cao độ, Tâm Trí Bầy Đàn này đã tiến hóa thành mối quan hệ cộng sinh với các sinh vật sinh học cư ngụ trong hư không tại hệ sao quê nhà. Dù mang những tâm trí riêng biệt, chúng cùng nhau hợp tác để đạt được mục tiêu chung."
 civic_wilderness_beastmasters: "$civic_hive_beastmasters$"
 civic_wilderness_beastmasters_desc: "Vùng Hoang Dã này đã mở rộng cánh cửa cộng sinh với các loài dã thú cư ngụ trong không gian từ hệ sao quê nhà. Dù chưa được tích hợp hoàn toàn vào Trí Tuệ Tương Hỗ, các sinh vật này vẫn cùng nhau hợp tác vì mục tiêu chung."
 civic_corporate_beastmasters: "Chủ Trang Trại Không Gian"
 civic_corporate_beastmasters_desc: "Khởi đầu là một phường hội tinh hoa của những người chăn nuôi gia súc, Siêu Tập Đoàn này đã phát triển công nghệ nuôi nấng và chăm sóc các sinh vật hư không tại hệ sao quê nhà."

