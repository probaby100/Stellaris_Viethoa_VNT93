 grand_archive.4006.desc.default: "Các nhà khoa học của chúng ta tin rằng hiện vật thu thập gần đây nhất, §Y[This.GetLastAcquiredSpecimenName]§!, $grand_archive.4006.desc.common$"
 grand_archive.4006.desc.no_specimen: "Các nhà khoa học của chúng ta tin rằng mẫu vật thu thập gần đây nhất $grand_archive.4006.desc.common$"
