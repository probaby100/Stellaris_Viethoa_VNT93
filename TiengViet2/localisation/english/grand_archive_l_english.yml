##################

 feature_unlock_gravity_snares: "Bẫy Trọng Lực"
 feature_unlock_gravity_snares_desc: "Cho phép bắt giữ và vận chuyển phi sát thương §YĐộng Vật Không Gian§!. Nếu một §Y$grand_archive$§! đã được xây dựng, thiết bị này sẽ chuyển bất kỳ sinh vật nào bị bắt giữ vào Viện Động Vật Sống."
 feature_unlock_containment_vessels: "Tàu Chứa Chuyên Dụng"
 feature_unlock_containment_vessels_desc: "Bẫy Trọng Lực bắt giữ gấp đôi số lượng §YĐộng Vật Không Gian§!"

 gravity_snare: "Bẫy Trọng Lực"
 gravity_snare_plural: "Bẫy Trọng Lực"
 NAME_GravitySnare: "$gravity_snare$"

 FLEETORDER_SEND_SNARE_NAME: "Phóng $NAME$"
 FLEETORDER_SEND_SNARE_ON_COOLDOWN: "§R$TRIGGER_FAIL$ Bẫy Trọng Lực đang trong thời gian hồi chiêu thêm §Y[This.GetGravitySnareCooldownForFleet] ngày§!.§!"
 FLEETORDER_GRAVITY_SNARE_NO_COMMUNICATIONS: "§R$TRIGGER_FAIL$ Chúng ta chưa thu thập đủ thông tin về những Động Vật Không Gian này để có thể bắt giữ chúng.§!"
 FLEETORDER_MUST_BE_SPACE_CRITTER: "§R$TRIGGER_FAIL$ Chúng ta không có khả năng bắt giữ loại Động Vật Không Gian này.§!"
 GRAVITY_SNARE_CAPTURE_CHANCE_LEADER: "Cấp Độ Lãnh Đạo: $VALUE|G%0$"

 FLEETORDER_CAPTURE_SPACE_CRITTER: "Đang Bắt Giữ Động Vật Không Gian"
 FLEETORDER_CAPTURE_SPACE_CRITTER_PROGRESS: "Đang Bắt Giữ Động Vật Không Gian: $PROGRESS|Y%0$"

 FLEETORDER_WAIT_FOR_GRAVITY_SNARE_TO_RELOAD: "Đang Tái Nạp §YBẫy Trọng Lực§!: $DAYS|Y$ Ngày"

 SNARE_SPEED: "Tốc độ bắt giữ: $SPEED$"
 CAPTURE_CHANCE: "Tỷ lệ bắt giữ thành công: $VALUE|Y%0$"
 CAPTURE_AMOUNT: "Với một §Y$gravity_snare$§! duy nhất, chúng ta có thể bắt giữ tối đa $VALUE|0G$ §YĐộng Vật Không Gian§! cùng một lúc."
 CAPTURE_AMOUNT_FULL_FLEET: "Với một §Y$gravity_snare$§! duy nhất, chúng ta có thể bắt giữ toàn bộ một hạm đội §YĐộng Vật Không Gian§!."

 GRAVITY_SNARE_1: "$gravity_snare$"
 GRAVITY_SNARE_STANDARD: "$gravity_snare$"
 GRAVITY_SNARE_STANDARD_TOOLTIP: "Bẫy Trọng Lực có khả năng duy trì các đợt phát xung hấp dẫn lượng tử cục bộ, ngăn không cho bất kỳ vật thể nào không có động cơ siêu không gian trốn thoát. Các lực này có thể được duy trì đủ lâu để bắt giữ và đưa §YĐộng Vật Không Gian§! về các hệ sao của chúng ta nhằm phân tích sâu hơn."
 SHIP_STAT_CONTRIBUTION_ADDATIVE_fauna_capture_chance: "$NAME$: $VALUE|Y0%$"
 SHIP_STAT_DESC_fauna_capture_chance: ""

 GRAVITY_SNARE_CLOAKING_EMPTY: "$SCIENCE_CLOAKING_EMPTY$"
 GRAVITY_SNARE_CLOAKING_1: "$SCIENCE_CLOAKING_1$"
 GRAVITY_SNARE_CLOAKING_2: "$SCIENCE_CLOAKING_2$"
 GRAVITY_SNARE_CLOAKING_3: "$SCIENCE_CLOAKING_3$"
 GRAVITY_SNARE_CLOAKING_DARK_MATTER: "$SCIENCE_CLOAKING_DARK_MATTER$"
 GRAVITY_SNARE_CLOAKING_PSI: "$SCIENCE_CLOAKING_PSI$"

 GRAVITY_SNARE_NO_EMERGENCY_FTL: "Bẫy Trọng Lực không được thiết kế để thực hiện bước nhảy FTL khẩn cấp."
 FLEET_CANNOT_TAKE_ORDERS: "§RHạm đội này không thể tiếp nhận bất kỳ mệnh lệnh nào.§!"

 MESSAGE_SPACE_CRITTER_CAPTURE_SUCCESS_TITLE: "Đã Bắt Giữ Động Vật Không Gian"
 MESSAGE_SPACE_CRITTER_CAPTURE_SUCCESS_DESC: "Nỗ lực bắt giữ trong hệ sao $SYSTEM|Y$ đã thành công! $gravity_snare$ đã chuyển mẫu vật vào Viện Động Vật Sống.\n\nBạn đã thu được Động Vật Không Gian mới:\n$CAPTURED_LIST$$RESOURCES_LIST$"
 MESSAGE_SPACE_CRITTER_CAPTURE_SUCCESS_NO_VIVARIUM_DESC: "Nỗ lực bắt giữ trong hệ sao $SYSTEM|Y$ đã thành công! Do không còn sức chứa §HViện Động Vật Sống§!, động vật bị bắt đã được an tử và mổ xẻ để lấy tài nguyên.\n$CULLED_LIST$$RESOURCES_LIST$"
 MESSAGE_SPACE_CRITTER_CAPTURE_FAILURE_TITLE: "Bắt Giữ Thất Bại"
 MESSAGE_SPACE_CRITTER_CAPTURE_FAILURE_DESC: "Nỗ lực bắt giữ trong hệ sao $SYSTEM|Y$ đã thất bại. $gravity_snare$ phóng đi từ tàu $SHIP_NAME|Y$ đã bị mất."

 MESSAGE_CAPTURED_SPACE_CRITTER_RETURNED_TITLE: "Động Vật Không Gian Mới"
 MESSAGE_CAPTURED_SPACE_CRITTER_RETURNED_DESC: "Động Vật Không Gian mới đã được chuyển vào Viện Động Vật Sống.\n$NEWBORN_LIST$$CULLED_LIST$$RESOURCES_LIST$"
 MESSAGE_CAPTURED_SPACE_CRITTER_RETURNED_DESC_CULLED: "\n\nNhững động vật không gian bị bắt sau đây đã được mổ lấy tài nguyên:\n$CULLED_LIST$"

 CULLED_CREATURES_RESOURCE_OUTPUT_DESC: "\n\nTài nguyên thu được:\n  $RESOURCES_LIST$"

 mod_gravity_snare_cooldown_mult: "Thời Gian Hồi Bẫy Trọng Lực"
 MOD_GRAVITY_SNARE_COST_MULT: "Chi Phí Bẫy Trọng Lực"
 MOD_SPACE_FAUNA_CULLING_REWARD_MULT: "Tài Nguyên Từ Việc Mổ Mẫu Vật"

 grand_archive.7210.name: "Bẫy Trọng Lực"
 grand_archive.7210.desc.common: "Sau phát hiện gần đây về §Y$tech_gravity_wells$§!, các tàu khoa học của [root.GetAdjective] giờ đây đã có thể triển khai $gravity_snare_plural$."
 grand_archive.7210.desc.vivarium: "Những thiết bị phóng phi sát thương này có thể bắt giữ và vận chuyển an toàn Động Vật Không Gian đến §YViện Động Vật Sống§! của chúng ta, nơi chúng có thể tiếp tục sinh sản ra những mẫu vật mới cùng loài.\n\nViệc mổ thịt và giải phẫu những sinh vật này sẽ cho phép thu hoạch §Y$genetic_material$§! của chúng để phục vụ mục đích nhân giống cũng như thu các tài nguyên khác."
 grand_archive.7210.desc.no_vivarium: "Những thiết bị phóng phi sát thương này có thể bắt giữ và vận chuyển an toàn Động Vật Không Gian để nghiên cứu và giải phẫu, thu hoạch §Y$genetic_material$§! và tài nguyên của chúng.\n\nNếu muốn nuôi sống chúng để tiếp tục nhân giống, chúng ta sẽ cần thành lập một §YViện Động Vật Sống§!. Chúng ta có thể thực hiện điều này bằng cách xây dựng một §Y$grand_archive$§! hoặc xây các công trình §Y[GetHatcheryPlural]§! tại các căn cứ sao của mình."

 grand_archive.7220.name: "Dã Thú Prethoryn"
 grand_archive.7220.desc: "Các §Y$gravity_snare_plural$§! của chúng ta không thể truy vết và giam giữ sinh vật §Y$NAME_Prethoryn_Scourge$§! một cách thích hợp. Dựa trên mô thức di chuyển của chúng, chúng ta nghi ngờ những sinh vật này đang bị điều khiển bởi một dạng ý thức cấp cao hơn và không thực sự là những cá thể độc lập.\n\nCố gắng giam giữ một trong những sinh vật này bên trong Viện Động Vật Sống sẽ gây nguy hiểm cho các mẫu vật khác của chúng ta và thậm chí là toàn bộ [this.GetName].\n\nChúng ta đã đình chỉ vô thời hạn các chiến dịch bắt giữ đối với những sinh vật này."
 grand_archive.7220.a: "Một biện pháp cẩn trọng."

 ################
 # Technologies #
 ################

 tech_galactic_archivism: "Lưu Trữ Học Thiên Hà"
 tech_galactic_archivism_desc: "Lịch sử thiên hà của chúng ta xứng đáng được bảo tồn đúng cách để hậu thế học hỏi từ những người đi trước. Một kho lưu trữ quy mô vĩ đại nhất sẽ phù hợp với mục đích này."

 tech_gravity_wells: "Bẫy Trọng Lực"
 tech_gravity_wells_desc: "Sự tập trung khối lượng lượng tử cục bộ có thể được sử dụng để tạo ra các đợt phát xung trọng lực cực mạnh trong thời gian ngắn. Nếu thao túng đúng cách, một lực hấp dẫn như vậy về mặt lý thuyết có thể bắt giữ và giam giữ sinh vật ở mọi kích cỡ mà không làm tổn hại đến chúng."
 tech_containment_vessel: "Giao Thức Giam Giữ Của Giám Tuyển"
 tech_containment_vessel_desc: "Bẫy Trọng Lực bắt giữ gấp đôi số lượng §YĐộng Vật Không Gian§!."

 TECH_UNLOCK_CONTAINMENT_VESSEL_TITLE: "$TECH_UNLOCK_COMPONENT_LINE$ $tech_containment_vessel$"
 TECH_UNLOCK_CONTAINMENT_VESSEL_DESC: "$tech_containment_vessel_desc$"

 tech_asteroidal_carapace: "Giáp Vỏ Tiểu Hành Tinh"
 tech_asteroidal_carapace_desc: "Lớp vỏ ngoài của Cutholoid không chỉ gồm khoáng chất đơn thuần mà còn được gia cố bằng các sợi sinh học bền bỉ. Chúng ta có thể tổng hợp quy trình này bằng các kỹ thuật luyện kim tiên tiến."
 ASTEROIDAL_CARAPACE_ARMOR: "$tech_asteroidal_carapace$"
 ASTEROIDAL_CARAPACE_ARMOR_DESC: "$tech_asteroidal_carapace_desc$"

 tech_gravity_snare_capacity_desc: "Tăng số lượng §YĐộng Vật Không Gian§! bị bắt giữ bởi Bẫy Trọng Lực thêm §G1§!"
 tech_gravity_snare_capacity_1: "Tăng Cường Điểm Kỳ Dị Siêu Nhỏ"
 tech_gravity_snare_capacity_1_desc: "$tech_gravity_snare_capacity_desc$"
 tech_gravity_snare_capacity_2: "Tối Ưu Hóa Thao Túng Trọng Lực"
 tech_gravity_snare_capacity_2_desc: "$tech_gravity_snare_capacity_desc$"
 tech_gravity_snare_capacity_3: "Cải Tiến Hệ Thống Giam Giữ"
 tech_gravity_snare_capacity_3_desc: "$tech_gravity_snare_capacity_desc$"
 gateway_snare_capacity: "Sức Chứa Bẫy Trọng Lực"

 gateway_gravity_snare_capacity: "§HLộ Trình Dung Lượng Bẫy Trọng Lực§!\n§ECông nghệ này sẽ mở ra những tiến bộ tiếp theo về năng lực bắt giữ của Bẫy Trọng Lực.§!"

 tech_alien_cloning: "Nhân Giống Nhân Tạo"
 tech_alien_cloning_beastmasters: "$tech_alien_cloning$"
 tech_alien_cloning_desc: "Trong môi trường được kiểm soát nghiêm ngặt, chúng ta có thể ấp nở $genetic_material$ thu thập được từ các Động Vật Không Gian bị mổ thịt và tạo ra các cá thể mới thuộc từng loài dưới sự chỉ huy của chúng ta."
 feature_alien_cloning_unlocked: "Chính Sách §Y$policy_space_fauna_growth$§!"
 feature_alien_cloning_unlocked_desc: "$policy_space_fauna_growth_desc$"
 tech_alien_cloning_tt: "§HMở Khóa Tính Năng:§! Nhân Giống Động Vật Không Gian Quy Mô Tàu Hộ Vệ"
 tech_improved_incubators: "Lò Gieo Ấp Cải Tiến"
 tech_improved_incubators_beastmasters: "$tech_improved_incubators$"
 tech_improved_incubators_desc: "Chúng ta có thể cải thiện các quy trình phát triển nhân tạo được thiết lập trong các nhà ấp thú của mình, đẩy nhanh các giai đoạn phát triển ban đầu để tạo ra các bản sao trưởng thành hơn."
 tech_improved_incubators_tt: "§HMở Khóa Tính Năng:§! Nhân Giống Động Vật Không Gian Quy Mô Tàu Khu Trục"
 tech_improved_incubators_tt_desc: "Lò gieo ấp giờ đây có thể nhân giống các mẫu vật §YĐộng Vật Không Gian§! lớn hơn, sánh ngang kích thước của các Tàu Khu Trục truyền thống."
 tech_metabolic_gases: "Khí Trao Đổi Chất"
 tech_metabolic_gases_beastmasters: "$tech_metabolic_gases$"
 tech_metabolic_gases_desc: "Những cải tiến đối với các loại khí trao đổi chất trong các lò gieo ấp của chúng ta sẽ giúp từng mẫu vật trưởng thành hơn nữa trước khi chúng được đưa ra thế giới này."
 tech_metabolic_gases_tt: "§HMở Khóa Tính Năng:§! Nhân Giống Động Vật Không Gian Quy Mô Thiết Giáp Hạm"
 tech_metabolic_gases_tt_desc: "Lò gieo ấp giờ đây có thể nhân giống Tàu Động Vật Không Gian ở bất kỳ kích thước hay giai đoạn trưởng thành nào."

 BOARDING_CABLES: "Cáp Đổ Bộ Lên Tàu"
 BOARDING_CABLES_MODULES: "$BOARDING_CABLES$"
 BOARDING_CABLES_TOOLTIP: "Tạo một cơ hội nhỏ để cướp một tàu của kẻ thù hoặc bắt giữ một Chỉ Huy đối phương để đòi tiền chuộc."
 BOARDING_CABLES_DESC: "$BOARDING_CABLES_TOOLTIP$"
 tech_boarding_cables: "$BOARDING_CABLES$"
 tech_boarding_cables_desc: "Pháo cỡ nhỏ được tái sử dụng để bắn các móc xuyên gắn liền với cáp sợi carbon đàn hồi, hoàn hảo để cố định và đổ bộ lên tàu đối phương."

 tech_controlled_mutations: "Đột Biến Có Kiểm Soát"
 tech_controlled_mutations_desc: "Chúng ta có thể tăng cường hiệu quả của các Tàu Động Vật Không Gian bằng cách chỉnh sửa bộ gen của chúng, cho phép chúng ta tích hợp công nghệ nhân tạo vào sinh khối của chúng."
 tech_controlled_mutations_2: "Đột Biến Có Kiểm Soát Tiên Tiến"
 tech_controlled_mutations_2_desc: "Chúng ta có thể tiến xa hơn nữa. Thao tác nâng cao đối với di truyền học Động Vật Không Gian cho phép tích hợp nhiều loại linh kiện chuyên dụng đa dạng hơn."

 ####################
 # Technology swaps #
 ####################

 tech_refit_standards_beastmasters: "Tối Ưu Hóa Lò Gieo Ấp"
 tech_refit_standards_beastmasters_desc: "Tối ưu hóa quy trình nhân giống Động Vật Không Gian có thể mang lại hiệu suất vượt bậc."

 tech_small_space_fauna_hull_1: "Mô Động Vật Không Gian Cỡ Nhỏ Cải Tiến"
 tech_small_space_fauna_hull_1_desc: "Những tiến bộ trong kỹ thuật nhân bản sẽ cho phép tạo ra Động Vật Không Gian Cỡ Nhỏ cứng cáp và bền bỉ hơn."
 tech_small_space_fauna_hull_2: "Mô Động Vật Không Gian Cỡ Nhỏ Tiên Tiến"
 tech_small_space_fauna_hull_2_desc: "Chúng ta đã đẩy độ bền mô của Động Vật Không Gian Cỡ Nhỏ lên mức giới hạn tối đa từng được biết đến."
 tech_medium_space_fauna_hull_1: "Mô Động Vật Không Gian Cỡ Vừa Cải Tiến"
 tech_medium_space_fauna_hull_1_desc: "Những tiến bộ trong kỹ thuật nhân bản sẽ cho phép tạo ra Động Vật Không Gian Cỡ Vừa cứng cáp và bền bỉ hơn."
 tech_medium_space_fauna_hull_2: "Mô Động Vật Không Gian Cỡ Vừa Tiên Tiến"
 tech_medium_space_fauna_hull_2_desc: "Chúng ta đã đẩy độ bền mô của Động Vật Không Gian Cỡ Vừa lên mức giới hạn tối đa từng được biết đến."
 tech_large_space_fauna_hull_1: "Mô Động Vật Không Gian Cỡ Lớn Cải Tiến"
 tech_large_space_fauna_hull_1_desc: "Những tiến bộ trong kỹ thuật nhân bản sẽ cho phép tạo ra Động Vật Không Gian Cỡ Lớn cứng cáp và bền bỉ hơn."
 tech_large_space_fauna_hull_2: "Mô Động Vật Không Gian Cỡ Lớn Tiên Tiến"
