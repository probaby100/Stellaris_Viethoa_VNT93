 ###########################
 # Space Fauna Description #
 ###########################
 space_amoeba_desc: "Trùng Biến Hình Không Gian là những kẻ săn mồi đơn độc, hung hãn với bất kỳ thứ gì chúng chạm trán. Được hỗ trợ bởi các cá thể con mới hình thành một phần được gọi là \"roi sinh học\", những sinh vật này rất thành thạo trong việc truy đuổi con mồi của chúng."
 tiyanki_desc: "Tiyanki, còn được gọi là \"Cá Voi Không Gian\", thường là những sinh vật hiền lành gặm nhấm khí quyển. Những sinh vật này cực kỳ gắn kết và các đàn ngoài tự nhiên được tổ chức dưới một hệ thống cấp bậc nghiêm ngặt."
 voidworm_desc: "Trùng Hư Không là những sinh vật ký sinh phải gửi bào tử lên các thế giới có người ở với sinh khối phù hợp để sinh sản. Các cá thể trưởng thành tạo thành các bộ ba giao phối, được gọi là \"Bộ Ba Troika\", và sẽ xây tổ gần các lỗ đen để che chở và nuôi dưỡng con non của chúng."
 cutholoid_desc: "Quái Thú Cutholoid là những sinh vật khổng lồ cư trú trong các tiểu hành tinh nhằm tạo sự bảo vệ phù hợp cho thân hình vốn mềm mại của chúng. Sinh vật này nuốt chửng cả con mồi, sử dụng dịch tiêu hóa phóng xạ để tiêu hóa dần con mồi."
 crystalline_entity_desc: "Thực Thể Tinh Thể là một dạng sống silicat chuyển động độc đáo có thể tự do tự đẩy mình qua không gian. Sắc thái của mỗi thực thể thay đổi không phải do tuổi tác, mà là sự phản ánh điện tích tiềm ẩn bên trong của chúng."

 wild_tiyanki_ox_modifier: "Tiyanki Bò Đực Hoang Dã"
 fauna_disengagement_modifier: "Khả Năng Rút Lui Khỏi Giao Tranh Của Dã Thú Không Gian"
