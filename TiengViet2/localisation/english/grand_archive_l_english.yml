 grand_archive.2053.name: "Trùng Hư Không Bị Tận Diệt"
 grand_archive.2053.desc: "Hệ sao quê hương cuối cùng của Trùng Hư Không đã bị phá hủy, và giống loài của chúng đã bị tận diệt.\n\nChúng ta không còn phải lo lắng về các đợt oanh tạc ký sinh của chúng nữa."
 grand_archive.2054.name: "Hang Trùng Hư Không Bị Phá Hủy"
 grand_archive.2054.desc: "Chúng ta đã xóa sổ một hệ sao quê hương của Trùng Hư Không.\n\nChúng sẽ không còn có thể sử dụng những bãi sinh sản này để nuôi dưỡng con non nữa."

