# Homicidal considerations #
# Fanatic Purifiers
 grand_archive.4135.name: "Vật Phẩm Từ Lũ Hèn Hạ"
 grand_archive.4135.desc: "Khi chúng ta tiếp tục các nỗ lực thanh trừng cặn bã dị chủng dơ bẩn khỏi thế giới này, bộ sưu tập chiến tích [GetCollectionRewardCategory] của chúng ta ngày càng lớn mạnh.\n\nNguyện cho những triển lãm này đóng vai trò như xác chết của thiên hà ô uế này và tiếp thêm cảm hứng cho sứ mệnh thiêng liêng của chúng ta."
 grand_archive.4135.desc.geology: "$grand_archive.4135.desc$"
 grand_archive.4135.desc.aesthetic: "$grand_archive.4135.desc$"
 grand_archive.4135.a: "Vì [this.GetName]!"

 grand_archive.4140.name: "Thu Gom Đồ Linh Tinh"
 grand_archive.4140.desc.geology: "Chúng ta tiếp tục thu gom các vật phẩm, đồ trang sức và những thứ kỳ dị [GetCollectionRewardCategory] từ thiên hà bẩn thỉu này.\n\nHãy dành một chút thời gian để chiêm ngưỡng chiến tích của chúng ta, nhưng hãy biết rằng ngoài kia vẫn còn rất nhiều thứ để đoạt lấy."
 grand_archive.4140.desc.aesthetic: "Chúng ta tiếp tục tích lũy các món đồ trang sức [GetCollectionRewardCategory], tàn dư của sự ô nhiễm được gieo rắc bởi các dạng sống hạ đẳng.\n\nMột khi mọi sinh vật dị chủng kinh tởm đã bị thanh trừng khỏi các vì sao, những vật phẩm này sẽ nhắc nhở chúng ta về bản chất hạ đẳng của chúng."
 grand_archive.4140.a: "Thiên hà này phải được thanh tẩy."

 grand_archive.4145.name: "Tủ Chiến Tích Đầy Ắp"
 grand_archive.4145.desc.geology: "Chúng ta đã lấp đầy các kho chứa của mình bằng các vật thể [GetCollectionRewardCategory], máu thịt cổ xưa của thiên hà này.\n\nChúng ta coi bộ sưu tập khổng lồ này là một bản ghi chép về sự hủy diệt toàn bộ của chúng ta. Hãy để tất cả chiêm ngưỡng những chiến thắng vang dội của chúng ta."
 grand_archive.4145.desc.aesthetic: "Chúng ta đã lấp đầy các kho chứa của mình bằng các món đồ cổ vật [GetCollectionRewardCategory], một kho báu thực sự gồm các đồ trang trí dị chủng vô nghĩa.\n\nChúng ta nhìn vào bộ sưu tập đồ sộ này và cười nhạo bản chất đáng thương của lũ hạ đẳng. Thử nghĩ mà xem, một khi chúng bị tiêu diệt hoàn toàn, những chiếc tủ trưng bày này sẽ là tất cả những gì còn lại của chúng."
 grand_archive.4145.a: "Cạn ly chúc mừng cái chết!"

# Devouring Swarm
 grand_archive.4136.name: "Thức Ăn Dư Thừa"
 grand_archive.4136.desc: "Cơn đói không hề suy giảm. Bộ sưu tập cổ vật [GetCollectionRewardCategory] của chúng ta đã tăng lên trong chiến dịch tiêu thụ của bầy đàn.\n\nCầu mong những triển lãm này đóng vai trò là ký ức cuối cùng về thiên hà mà chúng ta đã nuốt chửng."
 grand_archive.4136.desc.geology: "$grand_archive.4136.desc$"
 grand_archive.4136.desc.aesthetic: "$grand_archive.4136.desc$"
 grand_archive.4136.a: "Cơn đói không ngừng nghỉ."

 grand_archive.4141.name: "$grand_archive.4136.name$"
 grand_archive.4141.desc.common: "Khi chúng ta thưởng thức bữa tiệc, những vật phẩm này sẽ nhắc nhở chúng ta về vô số thức ăn mà chúng ta đã nuốt chửng."
 grand_archive.4141.desc.geology: "Chúng ta tiếp tục tích lũy các mẫu vật [GetCollectionRewardCategory], những mảnh xác thịt cổ xưa của thiên hà này.\n\n$grand_archive.4141.desc.common$"
 grand_archive.4141.desc.aesthetic: "Chúng ta tiếp tục tích lũy những món đồ trang sức [GetCollectionRewardCategory], những món đồ kỳ lạ từng được các dạng sống hạ đẳng coi trọng.\n\n$grand_archive.4141.desc.common$"
 grand_archive.4141.a: "Bữa tiệc vẫn tiếp diễn."

 grand_archive.4146.name: "Ký Ức Về Bữa Ăn"
 grand_archive.4146.desc: "Khi chúng ta đã thưởng thức trọn vẹn thiên hà này, chúng ta đã lấp đầy các kho chứa của mình bằng những cổ vật [GetCollectionRewardCategory].\n\nBộ sưu tập khổng lồ này chỉ để nhắc nhở chúng ta về cơn đói không bao giờ có thể được thỏa mãn. Một khi thiên hà này đã bị nuốt chửng hoàn toàn, chúng ta sẽ nhìn vào những vật phẩm này và hồi tưởng lại hương vị của chúng."
 grand_archive.4146.desc.geology: "$grand_archive.4146.desc$"
 grand_archive.4146.desc.aesthetic: "$grand_archive.4146.desc$"
 grand_archive.4146.a: "Thật ngon lành."

# Determined Exterminators
 grand_archive.4137.name: "Trang Sức Có Giá Trị Nhận Thức"
 grand_archive.4137.desc: "Chúng ta đã thu thập một loạt các vật phẩm [GetCollectionRewardCategory] mà các sinh vật hữu cơ tin rằng có giá trị như những cổ vật độc nhất vô nhị.\n\nDưới sự giám sát của chúng ta, những vật phẩm này sẽ trường tồn rất lâu sau khi sự sống hữu cơ bị tiêu diệt khỏi thiên hà này."
 grand_archive.4137.desc.geology: "$grand_archive.4137.desc$"
 grand_archive.4137.desc.aesthetic: "$grand_archive.4137.desc$"
 grand_archive.4137.a: "Những điều tò mò vô hại."

 grand_archive.4142.name: "Những Vật Thể Kỳ Lạ Đã Gom"
 grand_archive.4142.desc: "Chúng ta tiếp tục thu thập các chiến tích [GetCollectionRewardCategory] khi chúng ta loại bỏ vết nhơ của sự sống hữu cơ khỏi thiên hà này.\n\nNhững vật phẩm này sẽ nhắc nhở chúng ta về sự phi lý của sự sống hữu cơ để phục vụ cho các giao thức tiêu diệt trong tương lai."
 grand_archive.4142.desc.geology: "$grand_archive.4142.desc$"
 grand_archive.4142.desc.aesthetic: "$grand_archive.4142.desc$"
 grand_archive.4142.a: "Các giao thức đã được tái căn chỉnh."

 grand_archive.4147.name: "Không Gian Ký Ức Đã Đầy"
 grand_archive.4147.desc: "Khi chúng ta thanh trừng thiên hà này, chúng ta đã lấp đầy các ngân hàng bộ nhớ được gán cho các mẫu vật [GetCollectionRewardCategory].\n\nBộ sưu tập này cung cấp dữ liệu về những gì các sinh vật hữu cơ có xu hướng trân trọng. Nó sẽ phục vụ cho việc tiêu diệt triệt để chúng và tồn tại như những điểm tham chiếu trong lịch sử của thiên hà bị nhiễm khuẩn này."
 grand_archive.4147.desc.geology: "$grand_archive.4147.desc$"
 grand_archive.4147.desc.aesthetic: "$grand_archive.4147.desc$"
 grand_archive.4147.a: "Sự ngu xuẩn của sự sống hữu cơ."

####################################
# Grand Archive Destruction Events #
####################################
 grand_archive.4510.name: "$grand_archive$ Tại [fromfrom.GetName] Bị Phá Hủy"
 grand_archive.4510.desc.common: "Chúng ta đã phá hủy $grand_archive$ tại [fromfrom.GetName] thuộc sở hữu của [from.GetName]."
 grand_archive.4510.stolen: "Chúng ta đã có thể thu hồi một số Mẫu vật có giá trị bên trong."
 grand_archive.4510.ancrel: "Chúng ta đã có thể thu hồi một lượng nhỏ $r_minor_artifacts$ từ các mảnh vỡ."
 grand_archive.4510.nothing: "Đáng tiếc thay, không có thứ gì có giá trị lớn bên trong."
 grand_archive.4510.freed: "Ngoài ra, chúng ta dường như đã giải thoát một số Động Vật Không Gian bị nuôi nhốt khỏi Viện Động Vật Sống. Rất có thể chúng sẽ hung dữ và bối rối trong trạng thái vừa mới được giải thoát."
 grand_archive.4510.desc.stolen_freed: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.stolen$\n\n$grand_archive.4510.freed$"
 grand_archive.4510.desc.stolen: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.stolen$"
 grand_archive.4510.desc.ancrel_freed: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.ancrel$\n\n$grand_archive.4510.freed$"
 grand_archive.4510.desc.ancrel: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.ancrel$"
 grand_archive.4510.desc.none_freed: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.nothing$\n\n$grand_archive.4510.freed$"
 grand_archive.4510.desc.none: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.nothing$"

 grand_archive.4515.name: "Mất $grand_archive$"
 grand_archive.4515.desc.common_1: "$grand_archive$ của chúng ta tại [fromfrom.GetName] đã bị phá hủy bởi [from.GetName]."
 grand_archive.4515.desc.common_2: "Chúng ta sẽ cần phải xây dựng lại $grand_archive$ trong một hệ sao khác để tiếp tục các cuộc triển lãm Mẫu vật của mình."
 grand_archive.4515.stolen: "Thật không may, chúng ta đã không thể thu hồi một số Mẫu vật quý giá của mình."
 grand_archive.4515.freed: "Một số Động Vật Không Gian bị nuôi nhốt của chúng ta đã được thả ra ngoài hoang dã. Nhiều con đang trong trạng thái bối rối và hung hãn."
 grand_archive.4515.desc.stolen_freed: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.stolen$\n$grand_archive.4515.freed$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4515.desc.stolen: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.stolen$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4515.desc.none_freed: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.freed$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4515.desc.none: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.desc.common_2$"

 grand_archive.4520.name: "$grand_archive.4515.name$"
 grand_archive.4520.desc.common_1: "$grand_archive$ của chúng ta tại [from.GetName] đã bị phá hủy."
 grand_archive.4520.desc.freed: "$grand_archive.4520.desc.common_1$\n\n$grand_archive.4515.freed$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4520.desc.default: "$grand_archive.4520.desc.common_1$\n\n$grand_archive.4515.desc.common_2$"

 grand_archive.4555.name: "$grand_archive$ Đã Tháo Dỡ"
 grand_archive.4555.desc: "$grand_archive$ do [from.GetName] sở hữu tại [fromfrom.GetName] đã bị tháo dỡ ngay sau khi chúng ta tiếp quản hệ sao.\n\nKhông gian mà nó chiếm giữ đã được trao trả lại cho chúng ta."

 grand_archive.4560.name: "$grand_archive.4555.name$"
 grand_archive.4560.desc.common_1: "$grand_archive$ của chúng ta tại [from.GetName] đã bị tháo dỡ sau khi chúng ta từ bỏ hệ sao."
 grand_archive.4560.desc.common_2: "Chúng ta đã có thể tận thu phần lớn hợp kim được sử dụng trong quá trình xây dựng ban đầu của nó. Chúng ta sẽ cần phải xây dựng lại cấu trúc hoàn toàn trong một hệ sao khác để tiếp tục các cuộc triển lãm."
 grand_archive.4560.desc.specimen: "Tất cả các Mẫu vật đã được thu hồi và lưu trữ đúng cách cho đến khi một $grand_archive$ mới có thể được xây dựng."
 grand_archive.4560.desc.fauna: "Tất cả Động Vật Không Gian đã được mổ thịt để lấy các tài nguyên cơ bản của chúng."
 grand_archive.4560.desc.specimen_fauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.specimen$\n$grand_archive.4560.desc.fauna$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.specimen_nofauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.specimen$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.nospecimen_fauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.fauna$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.none: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.common_2$"

 grand_archive.4580.name: "Dự Án Tái Thiết Quần Thể Viện Động Vật Sống"
 grand_archive.4580.desc: "Hiện tại khi một $grand_archive$ mới đã được thành lập tại [from.GetName], chúng ta có cơ hội khôi phục lại phần lớn những gì đã mất khỏi Viện Động Vật Sống của mình.\n\nVật Liệu Di Truyền từ mỗi loài Động Vật Không Gian mà chúng ta đã từng nuôi dưỡng trước đây đã được bảo tồn, và với đủ tài nguyên, chúng ta có thể nhân giống các con non mới."
 grand_archive.4580.a: "Không, chúng ta cần những tài nguyên này."
 grand_archive.4580.b: "Nhân giống Động Vật Không Gian mới."

