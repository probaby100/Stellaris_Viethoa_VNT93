 resolution_voidworm_eradication: "Tiêu Diệt Trùng Hư Không"
 resolution_voidworm_eradication_desc: "Loài Trùng Hư Không ký sinh là một tai ương đối với thiên hà và là mối đe dọa cho các thế giới có cư dân sinh sống. Vòng đời tự nhiên của chúng làm mất cân bằng hệ sinh thái thiên hà và tất cả chúng cần phải bị loại bỏ."
 resolution_voidworm_eradication_tooltip: "Bất kỳ đế chế nào có §Y$NAME_Voidworms$§! bên trong biên giới của mình đều bị coi là §RVi Phạm Luật Thiên Hà§! cho đến khi các sinh vật này tự rời đi hoặc bị tiêu diệt."
 resolution_repeal_voidworm_eradication: "§RBãi Bỏ $resolution_voidworm_eradication$§!"
 resolution_repeal_voidworm_eradication_desc: "[global_event_country.GetGalCommunityOrGalImperium] không nên có quyền tận diệt giống loài Trùng Hư Không."
 resolution_repeal_voidworm_eradication_effect_success: "Bãi bỏ nghị quyết §Y$resolution_voidworm_eradication$§!."

 grand_archive.2103.name: "$resolution_voidworm_eradication$"
 grand_archive.2103.desc: "[global_event_country.GetGalCommunityOrGalImperium] đã tuyên bố rằng mọi con Trùng Hư Không không còn được phép xuất hiện trong các hệ sao của các quốc gia thành viên.\n\nCho đến khi chúng bị tiêu diệt hoặc tự ý rời khỏi không phận của chúng ta, [this.GetName] sẽ bị coi là §RVi Phạm Luật Thiên Hà§!."
 grand_archive.2105.name: "$NAME_Voidworms$ Trong Không Phận [this.GetSpeciesName]"
 grand_archive.2105.desc: "Một hạm đội Trùng Hư Không đã tiến vào không phận của chúng ta tại hệ sao [from.GetName]. Với tư cách là thành viên của [global_event_country.GetGalCommunityOrGalImperium], chúng ta có nghĩa vụ pháp lý phải an tử ngay lập tức bất kỳ con Trùng Hư Không nào hiện diện trong biên giới của mình.\n\n[this.GetName] sẽ bị coi là §RVi Phạm Luật Thiên Hà§! cho đến khi Trùng Hư Không rời khỏi không phận của chúng ta hoặc bị tiêu diệt."
 grand_archive.2107.desc: "Sự hiện diện dai dẳng của Trùng Hư Không trong hệ sao [invaded_system.GetName] của chúng ta là một hành vi §RVi Phạm Luật Thiên Hà§! nghiêm trọng theo nghị quyết $resolution_voidworm_eradication$. Điều này đã dẫn đến việc [global_event_country.GetGalCommunityOrGalImperium] cho phép các thành viên bỏ phiếu áp đặt các biện pháp trừng phạt lên [this.GetName]."

 bombardment_damage_moderate: "§YVừa Phải§!"
 bombardment_damage_massive: "§RKhổng Lồ§!"
 bombardment_voidworm_invasion_desc_common: "$bombardment_voidworm_invasion$ hủy diệt dân cư và tạo ra các Nhộng Trùng Hư Không mới.\n- Gây sát thương §YVừa Phải§! lên §YQuân Đội§!\n- Gây sát thương [GetVoidwormFleetBombardmentDamageIntensity] lên §YHành Tinh§! cho đến khi đạt độ tàn phá §Y25%§!\n- Gây sát thương §YVừa Phải§! lên §YDân Số§!"
 bombardment_voidworm_invasion: "Bào Tử Trùng Hư Không"
 bombardment_voidworm_invasion_desc: "$bombardment_voidworm_invasion_desc_common$\n- Sẽ §RKHÔNG§! giết chết §Y$MIN_POPS$§! £pop£ §HDân Số§! cuối cùng"
