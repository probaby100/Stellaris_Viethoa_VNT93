 SENSOR_PATTERNWALKER: "Cảm Biến Dạng Tiên Tri"

 r_vaporous_mega_orchid: "Đại Lan Khí Hóa"
 r_vaporous_mega_orchid_desc: "Loài hoa lan khổng lồ đặc biệt này chỉ nở hoa 50 năm một lần. Hương thơm của nó đã được chứng minh là có tác dụng làm dịu, tạm thời ngăn chặn các khớp thần kinh gây ra sự hung hăng và ngờ vực."
 r_vaporous_mega_orchid_effect_tt: "§G+$@vaporous_mega_orchid_opinion|0$§! £opinion£ Ý kiến với mọi Đế Chế không cuồng sát, không sa ngã, không phải máy móc trong §Y$@vaporous_mega_orchid_opinion_duration_years|0$§! năm."
 opinion_vaporous_mega_orchid: "$r_vaporous_mega_orchid$"

 r_tiyanki_matriarch_nerve_core: "Lõi Thần Kinh Tiyanki Mẫu Hệ"
 r_tiyanki_matriarch_nerve_core_desc: "Vật chất não bộ của loài cá voi không gian cổ đại này chứa hàng thế kỷ dữ liệu tiến hóa được mã hóa bên trong các tế bào thần kinh của nó. Bằng cách giải mã mạng lưới này, chúng ta có thể tìm ra những điểm yếu ở các loài siêu săn mồi khác, cũng như mở khóa các bí mật sinh tồn của chúng."
 tiyanki_matriarch_nerve_core: "$r_tiyanki_matriarch_nerve_core$"

 celestial_chart: "Hải Đồ Tinh Tú"
 r_celestial_chart_0: "Viên Nang Quỹ Đạo Bí Ẩn"
 r_celestial_chart_0_desc: "Một viên nang kỳ lạ đã quay quanh thế giới quê hương của chúng ta suốt hàng nghìn năm. Chúng ta vẫn chưa xác định được thông tin nó chứa đựng là gì."
 r_celestial_chart_1: "$celestial_chart$"
 r_celestial_chart_1_desc: "Mảnh ghép đầu tiên của một tấm bản đồ rộng lớn được tìm thấy bên trong một viên nang cổ xưa."
 r_celestial_chart_2: "$celestial_chart$"
 r_celestial_chart_2_desc: "Một tấm bản đồ đã hoàn thành một phần được tìm thấy bên trong một viên nang cổ xưa."
 r_celestial_chart_3: "$celestial_chart$"
 r_celestial_chart_3_desc: "Một tấm bản đồ gần như hoàn chỉnh được tìm thấy bên trong một viên nang cổ xưa."
 r_celestial_chart_4: "$celestial_chart$"
 r_celestial_chart_4_desc: "Một hải đồ sao và ngân hàng dữ liệu sâu rộng do tên cướp biển huyền thoại $NAME_CaptainNess$ tạo ra."
 r_celestial_chart_4_effect_tt: "Thành lập một ['concept_treasure_vault'] trên một trong các thuộc địa của chúng ta."
 celestial_chart_upgraded_tt: "§Y$celestial_chart$§! đã được nâng cấp với thông tin mới."
 celestial_chart_no_treasure_planet: "£trigger_no£ Hiện không có thuộc địa nào có thể tiếp nhận một ['concept_treasure_vault']"

 r_mutated_voidworm_nest: "Tổ Trùng Hư Không Đột Biến"
 r_mutated_voidworm_nest_desc: "Một tổ Trùng Hư Không đột biến đã tiến hóa để sinh sản mà không cần đến sự lây nhiễm ký sinh. Một số con non trong số này có khả năng trưởng thành hoàn toàn chỉ trong vài ngày."
 r_mutated_voidworm_nest_effect_tt: "Tạo ra một hạm đội $NAME_Frenzied_Voidworms$ Trưởng Thành trong hệ sao thủ đô"

