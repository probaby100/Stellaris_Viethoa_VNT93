 grand_archive.4105.name: "$leviathans.500.name$"
 grand_archive.4105.desc.common.aesthetic_wonder: "[GetCuratorsDesignation] nhận thấy những nỗ lực cẩn trọng của các bạn trong việc thu thập và bảo tồn các mẫu vật §Y$EXHIBITION_AESTHETIC_WONDERS$§!. Vẻ đẹp hiện diện ở khắp mọi nơi trong thiên hà của chúng ta, nếu người ta chịu khó quan sát đủ gần."
 grand_archive.4105.desc.common.historical_item: "[GetCuratorsDesignation] nhận thấy những nỗ lực cẩn trọng của các bạn trong việc thu thập và bảo tồn các mẫu vật §Y$EXHIBITION_GALACTIC_HISTORY$§!. Các bạn trao tặng món quà bất tử cho những người từng sở hữu các hiện vật mà các bạn lưu giữ."
 grand_archive.4105.desc.common.xeno_geology: "[GetCuratorsDesignation] nhận thấy những nỗ lực cẩn trọng của các bạn trong việc thu thập và bảo tồn các mẫu vật §Y$EXHIBITION_XENO_GEOLOGY$§!. Câu chuyện về thiên hà của chúng ta thường ẩn giấu bên trong đất đá và khoáng chất."

 grand_archive.4105.desc.1.common: "[GetStage1Description]\n\nHãy để điều này làm nguồn động viên để các bạn tiếp tục những công trình vĩ đại của mình."
 CURATORS_STAGE_1_DESC: "Bộ sưu tập ban đầu của các bạn rất ấn tượng, và chúng tôi muốn cống hiến các dịch vụ của mình. Vì lợi ích bảo tồn của thiên hà, chúng tôi sẽ cử một chuyên gia đến hỗ trợ các bạn trong lĩnh vực mà các bạn lựa chọn."
 DEAD_CURATORS_STAGE_1_DESC: "Mặc dù bang hội của chúng tôi đã bị tan rã, chúng tôi vẫn mong muốn cống hiến các dịch vụ của mình vì lợi ích bảo tồn thiên hà. Chúng tôi có thể hỗ trợ các bạn trong lĩnh vực mà các bạn lựa chọn."
 grand_archive.4105.desc.1.xeno_geology: "$grand_archive.4105.desc.common.xeno_geology$\n\n$grand_archive.4105.desc.1.common$"
 grand_archive.4105.desc.1.aesthetic_wonder: "$grand_archive.4105.desc.common.aesthetic_wonder$\n\n$grand_archive.4105.desc.1.common$"
