 space_amoeba_UNIQUE_MUTATION_PROJECT: "Dự Án Đột Biến Trùng Biến Hình Không Gian"
 space_amoeba_UNIQUE_MUTATION_PROJECT_DESC: "Trong quá trình huấn luyện các sinh vật mới được nhân bản, một cá thể Trùng Biến Hình Không Gian bị thương đã sử dụng một kỹ thuật mới lạ để đánh bại đối thủ của nó. Các roi sinh học của Trùng Biến Hình có thể hút dưỡng chất và vật liệu từ lớp phòng thủ tự nhiên của bạn tập, sử dụng chúng để vá các lỗ hổng trên giáp của chính nó và lấy lại sức chiến đấu.\n\nNghiên cứu bổ sung về hiện tượng này có thể hé lộ một yếu tố mới trong sinh học của Trùng Biến Hình Không Gian có thể được tăng cường để phát triển một đột biến đặc hiệu theo loài mới."
 tiyanki_UNIQUE_MUTATION_PROJECT: "Dự Án Đột Biến Tiyanki"
 tiyanki_UNIQUE_MUTATION_PROJECT_DESC: "Một hạm đội Tiyanki mới được nhân bản gần đây đã được quan sát thấy đang giao tiếp cùng nhau, liên tục phát ra một chuỗi âm thanh phức tạp. Những âm thanh hầu như không thể phát hiện được này dường như mang lại sự an ủi và bình yên cho mọi sinh vật khác ở gần.\n\nNghiên cứu bổ sung về hiện tượng này có thể hé lộ một yếu tố mới trong sinh học Tiyanki có thể được tăng cường để phát triển một đột biến đặc hiệu theo loài."
 voidworm_UNIQUE_MUTATION_PROJECT: "Dự Án Đột Biến Trùng Hư Không"
 voidworm_UNIQUE_MUTATION_PROJECT_DESC: "Chúng ta nhận thấy rằng một số Trùng Hư Không của chúng ta có xu hướng phát triển các khối u nhỏ dạng u nang khi chúng đạt đến độ trưởng thành. Quan sát sâu hơn cho thấy các tiêu bản có những mụn nước xấu xí này thường có khả năng sinh sản cao hơn đồng loại của chúng.\n\nNghiên cứu bổ sung về hiện tượng này có thể hé lộ một yếu tố mới trong sinh học Trùng Hư Không có thể được tăng cường để phát triển một đột biến đặc hiệu theo loài."
 cutholoid_UNIQUE_MUTATION_PROJECT: "Dự Án Đột Biến Quái Thú Cutholoid"
 cutholoid_UNIQUE_MUTATION_PROJECT_DESC: "Do bị cho ăn quá mức, một trong những quái thú Cutholoid nhân bản của chúng ta đã được ghi nhận tống xuất dữ dội thức ăn trong dạ dày ra ngoài. Dịch tiêu hóa tạo thành đã chứng tỏ cực kỳ nguy hiểm như một đường đạn cô đặc, duy trì các đặc tính phóng xạ của chúng trong thời gian dài bên ngoài cơ thể sinh vật.\n\nNghiên cứu bổ sung về hiện tượng này có thể hé lộ một yếu tố mới trong sinh học Cutholoid có thể được tăng cường để phát triển một đột biến đặc hiệu theo loài."
 crystalline_entity_UNIQUE_MUTATION_PROJECT: "Dự Án Đột Biến Thực Thể Tinh Thể"
 crystalline_entity_UNIQUE_MUTATION_PROJECT_DESC: "Trong các cuộc thử nghiệm chiến đấu, một số Thực Thể Tinh Thể của chúng ta đã tách đôi hoàn hảo sau khi bị phá hủy. Những nửa bị phân mảnh này vẫn duy trì các dấu hiệu sinh tồn quan trọng và tiếp tục sống sót trong một thời gian ngắn."
 tiyanki_matriarch_UNIQUE_MUTATION_PROJECT: "Dự Án Đột Biến $NAME_Elderly_Tiyanki$"
 tiyanki_matriarch_UNIQUE_MUTATION_PROJECT_DESC: "Vật liệu di truyền chúng ta thu hồi được từ $NAME_Elderly_Tiyanki$ đã đem lại những hiểu biết độc đáo cho phép chúng ta tiến hành một dự án đột biến thử nghiệm có thể áp dụng cho bất kỳ loài Dã Thú Không Gian nào."
 voidspawn_UNIQUE_MUTATION_PROJECT: "Dự Án Đột Biến $NAME_Voidspawn$"
 voidspawn_UNIQUE_MUTATION_PROJECT_DESC: "Vật liệu di truyền chúng ta thu hồi được từ $NAME_Voidspawn$ đã đem lại những hiểu biết độc đáo cho phép chúng ta tiến hành một dự án đột biến thử nghiệm có thể áp dụng cho bất kỳ loài Dã Thú Không Gian nào."

 unique_mutation_project_unlock_desc: "Các nỗ lực nhân bản [From.GetShipCategoryName] của chúng ta đã tạo ra một bước đột phá di truyền. Có thể kết hợp giải phẫu độc đáo của những sinh vật này với chuyên môn thao tác gen của chúng ta để tạo ra một dạng Đột Biến độc nhất vô nhị."
