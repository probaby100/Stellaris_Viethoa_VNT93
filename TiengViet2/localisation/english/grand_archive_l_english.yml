 sm_voidlure_desc_know_fauna: "Mồi nhử hư không truyền tín hiệu vào không gian sâu có khả năng thu hút các loại Động Vật Không Gian cụ thể theo thời gian. Mỗi hệ thống phải được xây dựng trong loại hệ sao ưa thích của sinh vật. Những sinh vật bị dụ đến sẽ tạm thời trở nên thuần phục trong một năm."
