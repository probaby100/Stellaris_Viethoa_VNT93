 grand_archive.4105.desc.3.common: "Sự tận tụy của các bạn đối với công tác bảo tồn là vô song. Chúng tôi muốn ủy thác một vật phẩm rất đặc biệt cho sự chăm sóc của các bạn. [GetStage3Description]"
 grand_archive.4105.desc.3.common_2: "Tất nhiên, một vật phẩm có giá trị như vậy sẽ đòi hỏi một khoản quyên góp đáng kể để đền đáp..."
