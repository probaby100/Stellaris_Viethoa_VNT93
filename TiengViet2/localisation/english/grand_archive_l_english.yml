 pirate.1.name.treasure_hunters: "Sự Lan Rộng Của Nạn Hải Tặc Không Gian"
 pirate.1.desc.black_needle: "Nhiều khả năng là băng §Y$NAME_BlackNeedle$§! đã kích động hoạt động phi pháp này, và thậm chí có thể đang hỗ trợ cho những tên tư lược cơ hội đó."
 pirate.2.k: "Lũ khốn kiếp!"
 pirate.25.desc.black_needle: "Ngoài ra, chúng ta đã phát hiện một hòm tài sản thuộc về các cựu thành viên của §Y$NAME_BlackNeedle$§!."

# Events
 grand_archive.8000.name: "Khoang Chứa Cổ Đại"
 grand_archive.8000.desc: "Chúng ta đã tạo ra bước đột phá liên quan đến Khoang Chứa Cổ Đại được tìm thấy đang quay quanh [this.GetHomeWorldName]. Nhờ những nỗ lực không biết mệt mỏi của các [this.GetScientistPlural], giờ đây chúng ta đã có thể giải mã lớp bảo mật kỹ thuật số cuối cùng và đọc được tấm hải đồ vốn đã khơi gợi trí tò mò của chúng ta bấy lâu nay."
 grand_archive.8000.a: "Bên trong chứa đựng những gì?"

 TREASURE_HUNTERS_ANCIENT_CAPSULE_PROJECT: "Phân Tích Khoang Chứa Cổ Đại"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_PROJECT_DESC: "Phân tích ban đầu của chúng ta về tấm hải đồ bên trong khoang quỹ đạo đã tiết lộ vị trí của một số thiên thể không hiện diện trong hệ sao quê nhà của chúng ta. Sẽ cần thời gian để trích xuất tọa độ chính xác."

 grand_archive.8005.name: "Khoang Chứa Cổ Đại Đã Được Phân Tích"
 grand_archive.8005.desc: "Tấm hải đồ này mới chỉ hoàn thành một phần!\n\nDữ liệu bên trong khoang quỹ đạo bị phân mảnh, từng khoảng trống rõ rệt giống như mảnh ghép còn thiếu của một bức tranh xếp hình. Dẫu vậy, nó hé lộ tọa độ của một hệ sao chưa từng được biết đến trước đây, nhưng lại không cung cấp bất kỳ chi tiết nào về điều gì đang chờ đón chúng ta ở đó.\n\nTấm hải đồ cũng làm nổi bật một loạt điểm đột phá đã được thiết lập để hỗ trợ việc du hành qua siêu không gian tới điểm đến."
 grand_archive.8005.a.lom: "Tất cả vào vị trí chiến đấu!"

 grand_archive.8015.name: "Hải Đồ Tinh Tú"
 grand_archive.8015.desc.common: "Các con tàu của chúng ta đang trong trạng thái sẵn sàng, khao khát dấn thân vào chuyến phiêu lưu vĩ đại tiếp theo của nền văn minh."
 grand_archive.8015.desc.default: "Dân cư của [this.GetHomeWorldName] đang say mê với tấm hải đồ vừa được giải mã gần đây. Thường được gọi là \"§Y$celestial_chart$§!\", cho đến nay nó đem lại nhiều câu hỏi hơn là câu trả lời. Nó đến từ đâu? Ai đã tạo ra nó, và vì mục đích gì? Và có lẽ quan trọng nhất - liệu nó có dẫn chúng ta vào một cái bẫy hay không?\n\n$grand_archive.8015.desc.common$"
 grand_archive.8015.desc.gestalt: "Việc phát hiện tấm hải đồ bên trong khoang chứa đã thu hút sự chú ý của xã hội chúng ta. Giờ đây khi nó được hé lộ chỉ là một mảnh ghép trong số rất nhiều mảnh, chúng ta tự hỏi nó có thể dẫn tới đâu và chúng ta có thể tìm thấy gì ở đó. Chúng ta quyết tâm hoàn thành tấm \"§Y$celestial_chart$§!\" này.\n\n$grand_archive.8015.desc.common$"
 grand_archive.8015.a.default: "Tiến lên, hướng về phía trước cuộc phiêu lưu!"
 grand_archive.8015.a.lom: "Nhổ neo, xuất kích!"

 grand_archive.8020.name: "Cuộc Gặp Gỡ Bất Ngờ"
 grand_archive.8020.desc: "Chúng ta đã chạm trán một hạm đội vũ trang hạng nặng mang cờ hiệu không xác định. Tàu của chúng bay theo đội hình có tổ chức nhưng thiết kế không đồng nhất. Nhiều con tàu được trang bị máy phóng động năng gắn vào các cuộn dây cáp dày có móc thép carbon và súng phóng lao ở đầu. Ngoài ra, có một nhóm tàu vận tải bọc thép được che chở ở trung tâm hạm đội. Chúng ta chỉ có thể phỏng đoán rằng những con tàu này nằm dưới quyền kiểm soát của một băng hải tặc hoặc lính đánh thuê.\n\nChúng ta đang nhận được tín hiệu truyền tin từ soái hạm của chúng."
 grand_archive.8020.a.lom: "Vậy thì thương lượng đôi lời..."

 grand_archive.8025.name: "$NAME_CaptainHoo$ của băng $NAME_BlackNeedle$"
 grand_archive.8025.desc: "§HĐường bệ và ngạo mạn, tên thuyền trưởng ngoài vòng pháp luật này làm ra vẻ chẳng chút bận tâm. Hắn nhìn xuống bằng cái mỏ khoằm khi cất lời và từ chối nhìn thẳng vào chúng ta, như thể chúng ta không xứng đáng để hắn phải tập trung toàn bộ sự chú ý. Hắn vẫy những chiếc lông vũ của mình theo một cách buồn cười đầy vô ý.§!\n\nCác ngươi đã ngáng đường băng §Y$NAME_BlackNeedle$§!, thật là một sai lầm chết người của các ngươi!\n\nChúng ta tình cờ nghe được tin đồn rằng cái xã hội nhỏ bé mới chớm nở của các ngươi sẽ thám hiểm hệ sao này. Các ngươi đã tình cờ vớ được tấm hải đồ rõ ràng thuộc về chúng ta. Giao nó ra đây, kẻo chuyện lại trở nên đẫm máu."
 grand_archive.8025.a: "Ngươi là ai?"
 grand_archive.8025.a.reply: "Ta là Hoo chứ ai! Tên ta là Glimarhoo Zelmendrion, nhưng các ngươi có thể gọi ta là §Y$NAME_CaptainHoo$§!, Thuyền trưởng của tàu Dực Bạc kiêm Thiếu úy Lực lượng Thứ hai của toán hải tặc §Y$NAME_BlackNeedle$§! lừng lẫy. Lông cánh của chúng ta đã nhúng chàm vào đủ mọi phi vụ bất chính suốt hàng ngàn năm qua, và ta chỉ là một sợi chỉ trong tấm thảm gấm huy hoàng của di sản chúng ta.\n\nCác ngươi nên ghi nhớ lấy tên ta, vì ta kỳ vọng sẽ nhận được một món tiền thưởng khổng lồ sau khi dâng tấm hải đồ này lên thủ lĩnh vô song của chúng ta."
 grand_archive.8025.b: "Ngươi biết gì về tấm hải đồ này?"
 grand_archive.8025.b.reply: "Một tay môi giới thông tin tài ba — và cực kỳ đắt đỏ — đã báo cho chúng ta biết gần đây các ngươi tình cờ vớ được một khoang chứa kỳ lạ... Một khoang chứa được cho là chứa tọa độ chỉ đường đến một hệ sao ẩn giấu mà chúng ta hết sức quan tâm.\n\nBản thân chúng ta cũng đã nắm giữ một mảnh của tấm hải đồ, nhưng nó vô dụng nếu không có dữ liệu từ khoang chứa của các ngươi. Ta không thể hiểu nổi tại sao §Y$NAME_CaptainNess$§! lại trao chìa khóa di sản của ả cho các ngươi, nhưng việc tước bỏ nó khỏi tay các ngươi là trách nhiệm của chúng ta."
 grand_archive.8025.c: "Tại sao ngươi lại khao khát tấm hải đồ này đến vậy?"
 grand_archive.8025.c.reply: "Các ngươi thực sự ngây thơ đến thế sao? [this.GetCaptainHooSnarkyInsult] Chắc ta phải đánh vần từng chữ cho các ngươi hiểu mất thôi.\n\nHải đồ hoạt động như một dạng dẫn đường hoa tiêu hướng về một điểm đến cụ thể. Chúng ta muốn viếng thăm điểm đến đó và đoạt lấy kho báu thất lạc bấy lâu của §Y$NAME_CaptainNess$§!."
 grand_archive.8025.d: "$NAME_CaptainNess$ là ai?"
 grand_archive.8025.d.reply: "Chúng ta cứ tưởng các ngươi phải nắm rõ thông tin hơn chứ. Ả chính là kẻ đã tạo ra tấm hải đồ này. Có lẽ ả cảm thấy sự ngu muội của loài các ngươi thật đáng đồng cảm, cái con mụ khủng bố vô lo vô nghĩ đó.\n\nNói tóm lại, chuyện đó chẳng dính dáng gì đến các ngươi. Giao nộp thông tin ra đây rồi chúng ta sẽ tiếp quản từ đây."
 grand_archive.8025.e: "Chúng ta sẽ giữ lại tấm hải đồ của mình."
 grand_archive.8025.e.reply: "Ta cũng đoán trước các ngươi sẽ nói vậy. Hãy chuẩn bị đối mặt với số phận của mình đi.\n\nĐứng im và nộp mạng!"
 grand_archive.8025.f.lom: "Có giỏi thì nhào vô mà lấy, đồ ăn hại gỉ sét!"

 CAPTAIN_HOO_INSULT_MACHINE: "Ta cứ tưởng Trí tuệ Nhân tạo thì phải có trí tuệ thực sự, nhưng rõ ràng thực tế chẳng phải vậy."
 CAPTAIN_HOO_INSULT_HIVE: "Người ta thường bảo ba cây chụm lại nên hòn núi cao, nhưng trí tuệ tập thể của các ngươi gom lại cũng chẳng bõ dính răng."
 CAPTAIN_HOO_INSULT_HUM: "Lũ da nhẵn xương dày các ngươi đã phát triển được du hành liên sao mà chút lương tri cơ bản vẫn cứ nằm ngoài tầm với."
 CAPTAIN_HOO_INSULT_MAM: "Lũ thú vật như các ngươi làm sao có được trí tuệ và sự tao nhã như vị thủ lĩnh vĩ đại của chúng ta."
 CAPTAIN_HOO_INSULT_REP: "Dù vậy, ta cũng chẳng bao giờ mong lũ sa giông thô kệch các ngươi hiểu được những khái niệm căn bản như thế này."
 CAPTAIN_HOO_INSULT_AVI: "Có lẽ tổ tiên của các ngươi đã bị mổ quá nhiều nhát vào sọ não rồi."
 CAPTAIN_HOO_INSULT_ART: "Ta chẳng hề ngạc nhiên khi khả năng tư duy phản biện không thể xuyên qua lớp vỏ ngoài dày cộp của loài các ngươi."
 CAPTAIN_HOO_INSULT_MOL: "Thực tế là loài thân mềm chẳng hề có bộ não tử tế nào. Loài của các ngươi chính là bằng chứng sống cho điều đó."
 CAPTAIN_HOO_INSULT_FUN: "Các ngươi trông như đám bào tử thiếu trước hụt sau chẳng mọc nổi thành cây nấm hoàn chỉnh."
 CAPTAIN_HOO_INSULT_PLANT: "Ngày càng rõ ràng lý do tại sao thực vật không thể phát triển trí thông minh trên phần lớn các thế giới."
 CAPTAIN_HOO_INSULT_LITHOID: "Giống loài các ngươi thực sự ngu đần như những cục đá."
 CAPTAIN_HOO_INSULT_NECROID: "Các ngươi hẳn chỉ là cái xác rỗng của một giống loài từng có trí khôn trong quá khứ."
 CAPTAIN_HOO_INSULT_AQUATIC: "Ở đây các ngươi rõ ràng chỉ là lũ cá mắc cạn."
 CAPTAIN_HOO_INSULT_TOX: "Một kiếp sống đắm mình trong rác rưởi độc hại có lẽ đã làm lu mờ tâm trí của các ngươi."
 CAPTAIN_HOO_INSULT_ROBOT: "Có lẽ các mô-đun nhân cách đã ngốn sạch phần lớn năng lực xử lý của các ngươi rồi."
 CAPTAIN_HOO_INSULT_DEFAULT: "Có lẽ giống loài các ngươi vừa khiếm khuyết về trí tuệ lại vừa dị dạng đến mức ghê tởm."

 grand_archive.8045.name: "$grand_archive.8025.name$"
 grand_archive.8045.desc: "Các ngươi dám biến bản thân ta và băng §Y$NAME_BlackNeedle$§! thành trò cười! Chuyện này không thể chấp nhận được, tuyệt đối không!\n\nSự bất hợp tác của các ngươi sẽ không sớm bị lãng quên đâu. Băng $NAME_BlackNeedle$ sẽ dốc toàn lực ập đến đè bẹp các ngươi. Nền văn minh non trẻ của các ngươi sẽ không thể sống sót trước cơn thịnh nộ của chúng ta.\n\nChúng ta sẽ không dừng lại cho đến khi tấm hải đồ đó thuộc về chúng ta! Giờ thì ta xin cáo từ!"
 grand_archive.8045.a.lom: "Lần sau bớt sủa lại và đánh nhau nhiều hơn đi!"

 TREASURE_HUNTERS_CHART_PIECE_2_PROJECT: "Hành Tinh Vỡ Thành Tám Mảnh"
 TREASURE_HUNTERS_CHART_PIECE_2_PROJECT_DESC: "Tấm §H$celestial_chart$§! đã dẫn chúng ta đến một thế giới tan vỡ. Chúng ta phát hiện một đường hầm nhân tạo được khoan vào mảng vỏ hành tinh lớn nhất. Chúng ta tin rằng mảnh tiếp theo của tấm hải đồ được giấu bên trong, nhưng việc tiếp cận nó sẽ đòi hỏi một cuộc khai quật cẩn trọng.\n\nMột tàu xây dựng có thể chế tạo các thiết bị cần thiết để khai thác mảnh ghép này."

 grand_archive.8055.name: "Khai Quật Thành Công"
 grand_archive.8055.desc: "Một khoang chứa đã được trích xuất thành công từ các mảnh vụn hành tinh trôi dạt cùng với một lượng khoáng sản. Khi mở ra, chúng ta phát hiện một mảnh ghép mới của §Y$celestial_chart$§! và một bộ sưu tập các cổ vật văn hóa độc đáo. Ngoài ra, một mẩu giấy ghi chú được tìm thấy bên trong, viết bằng nhiều ngôn ngữ để dễ dịch thuật hơn.\n\n\"Đây là tất cả những gì còn sót lại của $NAME_Soropegma$, quê nhà của người Ytterite. Người Ytterite là một giống loài Tiền-FTL đã bị tuyệt chủng do một tai nạn bi thảm. Không hề hay biết về hậu quả sắp ập đến, chúng tôi đã vô tình kích hoạt sức mạnh hủy diệt của một Siêu Vũ Khí Khổng Lồ Colossus bị đánh cắp. Xin hãy bảo tồn và tôn trọng ký ức của họ.\""

 TREASURE_HUNTERS_ANCIENT_CAPSULE_2_PROJECT: "Giải Mã Mảnh Hải Đồ"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_2_PROJECT_DESC: "Sau khi khai quật khoang chứa từ tàn tích của hành tinh vỡ vụn, chúng ta cần giải mã dữ liệu dẫn đường bên trong. Quá trình này đòi hỏi phải đối chiếu chéo cơ sở dữ liệu bản đồ học của chúng ta và lập bản đồ các thiên thể được đánh dấu so với các hệ sao đã biết."

 grand_archive.8060.name: "Hải Đồ Đã Được Giải Mã"
 grand_archive.8060.desc: "Sau khi phá vỡ nhiều tầng mã hóa, dữ liệu mới đã được tích hợp liền mạch vào §Y$celestial_chart$§!. Khi các mảnh ghép được kết hợp, một hệ sao mới khác lại được hé lộ. Bước tiếp theo của hành trình đang trải ra trước mắt chúng ta. Chúng ta nên thận trọng tiếp cận vùng không gian chưa được vẽ trên bản đồ này."

 grand_archive.8075.name: "Một Đại Lưu Trữ"
 grand_archive.8075.desc: "Sau khi thu được §Y[This.GetLastAcquiredSpecimenName]§!, các nhà khoa học của chúng ta tin rằng nó xứng đáng được đưa ra trưng bày công khai trong khuôn khổ một §Y$grand_archive$§!. Cấu trúc này sẽ lưu giữ bộ sưu tập hiện vật quý hiếm đang ngày càng nở rộ của chúng ta, mang lại những lợi ích to lớn về văn hóa và khoa học. Một khoản đầu tư giai đoạn đầu sẽ khởi động việc nghiên cứu các kỹ thuật và công nghệ cần thiết để bảo tồn và trưng bày các tiêu bản đa dạng và tinh xảo của ngân hà.\n\nNgoài ra, một bản thiết kế được tìm thấy cùng với hiện vật Ytterite chứa thiết kế tiên tiến cho một tủ trưng bày với công nghệ giám sát khí quyển đột phá. Việc phát triển thêm ý tưởng này sẽ nâng cao năng lực bảo tồn của Đại Lưu Trữ nói chung."
 grand_archive.8076.name: "Tiêu Bản Ytterite"
 grand_archive.8076.desc: "Dấu vết cuối cùng của nền văn minh Ytterite đã mất xứng đáng có một buổi triển lãm riêng.\n\nMay mắn thay, một bản thiết kế được tìm thấy cùng hiện vật Ytterite chứa thiết kế tiên tiến cho một tủ trưng bày với công nghệ giám sát khí quyển đột phá. Phát triển thêm ý tưởng này sẽ nâng cao năng lực bảo tồn của Đại Lưu Trữ nói chung."
 grand_archive.8076.a: "Một cơ hội tuyệt vời."

 TREASURE_HUNTERS_EXHIBITION_PROJECT: "Bản Thiết Kế Tăng Cường Triển Lãm"
 TREASURE_HUNTERS_EXHIBITION_PROJECT_DESC: "Cùng với tiêu bản Ytterite, chúng ta đã phát hiện một thiết kế tiên tiến cho tủ trưng bày phức hợp giúp hỗ trợ bảo tồn nó.\n\nNghiên cứu các kỹ thuật được sử dụng trong bản thiết kế này nhiều khả năng sẽ hỗ trợ cho các nỗ lực bảo tồn và triển lãm trong tương lai."
 TREASURE_HUNTERS_EXHIBITION_PROJECT_TOOLTIP: "Sử dụng một §YTàu Xây Dựng§! để xây dựng một §YĐại Lưu Trữ Viện§! quay quanh một hành tinh có từ 2.5K £pop£ §HDân Cư§! trở lên.\nYêu cầu: §H£society_research£$tech_galactic_archivism$§!."

 grand_archive.8080.name: "Tăng Cường Triển Lãm"
 grand_archive.8080.desc: "Sau khi phân tích cẩn thận bản thiết kế Ytterite, chúng ta đã chế tạo một khối ngăn chứa tiên tiến với khả năng giám sát khí quyển chính xác đến từng nguyên tử. Điều này sẽ cho phép các giám tuyển theo dõi các điều kiện khí quyển của tiêu bản Ytterite mỏng manh ở mức độ cực kỳ chi tiết và phát hiện bất kỳ dấu hiệu cảnh báo nào về khả năng phân hủy. Nó sẽ mãi mãi vẹn nguyên như thuở ban đầu.\n\nChúng ta có thể áp dụng các kỹ thuật này để cải thiện hơn nữa điều kiện lưu trữ của mọi vật phẩm trong bộ sưu tập của mình."

 TREASURE_HUNTERS_BUILD_GRAND_ARCHIVE: "Xây Dựng Đại Lưu Trữ Viện"
 TREASURE_HUNTERS_BUILD_GRAND_ARCHIVE_DESC: "Xuyên suốt quá trình thám hiểm vũ trụ, chúng ta đã thu thập vô số hiện vật độc đáo và các nét kỳ thú văn hóa. Những tiêu bản này sẽ truyền cảm hứng cho công chúng và biến cuộc triển lãm của chúng ta thành nơi đầu tiên phô diễn và bảo tồn mọi lĩnh vực tri thức của ngân hà.\n\nXây dựng một §H$grand_archive$§! sẽ hoàn toàn phù hợp với mục đích này."

 grand_archive.8090.name: "Khai Trương Đại Lưu Trữ Viện"
 grand_archive.8090.desc: "Lễ khai trương §Y$grand_archive$§! tại [fromfrom.GetName] là một ngày trọng đại đối với [this.GetName]. Triển lãm kho báu từ khắp ngân hà này truyền cảm hứng cho sự thám hiểm và kêu gọi chúng ta học hỏi từ quá khứ."

 d_black_needle_base: "Căn Cứ Hắc Châm Ẩn Giấu"
 d_black_needle_base_desc: "Một căn cứ bí mật được hải tặc Hắc Châm sử dụng để tiến hành nhiều hoạt động phi pháp khác nhau và che giấu hàng hóa bị đánh cắp."
 d_abandoned_black_needle_base: "Căn Cứ Hắc Châm Bỏ Hoang"
 d_abandoned_black_needle_base_desc: "Căn cứ này từng được hải tặc Hắc Châm sử dụng làm tiền đồn và nơi trú ẩn an toàn cho những kẻ tội phạm bị truy nã cùng hàng hóa bị đánh cắp."
 d_abandoned_black_needle_base_naval_cap: "Sức Chứa Hải Quân từ Nghề Binh Lính: §G+$@abandoned_black_needle_base_naval_cap_from_soldier_job|0$§!"
 d_abandoned_black_needle_base_naval_cap_short: "£mod_country_naval_cap_add£ từ Nghề £job_soldier£: §G+$@abandoned_black_needle_base_naval_cap_from_soldier_job|0$§!"

 black_needle_base_system_poi: "Lần Theo Hải Đồ Tinh Tú"
 black_needle_base_system_poi_desc: "Tấm §H$celestial_chart$§! đã hé lộ một hệ sao ẩn giấu, [Prev.GetName]. Chúng ta phải du hành tới đó và khám phá điều gì đang chờ đón mình."

 grand_archive.8100.name: "Phát Hiện Sào Huyệt Hải Tặc"
 grand_archive.8100.desc: "Chúng ta đã phát hiện một căn cứ ngầm bí mật trên [From.GetName] mang phù hiệu của băng §YHắc Châm§!. Chúng ta tin rằng đây là một căn cứ ngoại vi của nhóm hải tặc, cách biệt với các hoạt động khác của chúng. Mảnh tiếp theo của §Y$celestial_chart$§! chắc chắn được cất giữ ở đây, nhiều khả năng cùng với các của cải và đồ trang sức quý giá khác.\n\nChúng ta có thể dễ dàng bắt đầu oanh tạc quỹ đạo căn cứ này, nhưng điều đó có thể tạo thời gian cho băng Hắc Châm gọi quân tiếp viện. Mặt khác, triển khai nhanh chóng lực lượng mặt đất sẽ giúp chiếm giữ căn cứ mau lẹ hơn, khiến kẻ địch có rất ít thời gian để phản ứng.\n\nMột cách tiếp cận lén lút hơn là xâm nhập vào hệ thống máy tính của căn cứ và bảo đảm đoạt lấy mảnh $celestial_chart$ trong một phi vụ trộm cắp táo bạo."
 grand_archive.8100.a: "Giảm thiểu tổn thất sinh mạng."
 grand_archive.8100.b: "Xóa sổ căn cứ."
 grand_archive.8100.c: "Thời gian là vàng bạc."

 COLONIZATION_IMPOSSIBLE_DEFENDED_PLANET: "$TRIGGER_FAIL$§RHành tinh này được phòng thủ nghiêm ngặt và không thể thực dân hóa.§!"
 BLACK_NEEDLE_BASE_BOMBARD: "Oanh Tạc Căn Cứ Hắc Châm"
 BLACK_NEEDLE_BASE_BOMBARD_DESC: "Căn cứ ngầm trên [This.GetName] có khả năng kháng cự cao đối với oanh tạc quỹ đạo, nhưng với đủ thời gian và hỏa lực, hạm đội của chúng ta hoàn toàn có thể phá hủy nó. Sau khi căn cứ bị vô hiệu hóa, chúng ta có thể lục soát đống đổ nát để thu hồi mảnh §H$celestial_chart$§! cùng bất kỳ vật phẩm giá trị nào khác.\n\nCác cố vấn chiến thuật cảnh báo rằng phương án này có thể cho băng Hắc Châm đủ thời gian để gọi viện binh."
 BLACK_NEEDLE_BASE_BOMBARD_REINFORCEMENTS_KILLED: "$BLACK_NEEDLE_BASE_BOMBARD$"
 BLACK_NEEDLE_BASE_BOMBARD_REINFORCEMENTS_KILLED_DESC: "$BLACK_NEEDLE_BASE_BOMBARD_DESC$"
 BLACK_NEEDLE_BASE_BOMBARD_PROJECT_REQUIREMENT: "Có $COUNT$/$REQUIRED$ hạm đội có sức mạnh hạm đội từ 2000 trở lên trên quỹ đạo."
 BLACK_NEEDLE_BASE_BOMBARD_2_PROJECT_REQUIREMENT: "Có $COUNT$/$REQUIRED$ hạm đội có sức mạnh hạm đội từ 1000 trở lên trên quỹ đạo."
 EXIT_BYPASS_GATEWAY_NESS: "Thoát Khỏi $BYPASS_TYPE$"

 grand_archive.8103.name: "Hắc Châm Phản Công"
 grand_archive.8103.desc: "Đúng như dự đoán, băng Hắc Châm đã điều một hạm đội tới bảo vệ căn cứ của chúng trên [FromFrom.GetName].\n\nChúng ta sẽ cần giải quyết những con tàu này để làm chủ [FromFrom.System.GetName]."

 grand_archive.8105.name: "Trong Tro Tàn Và Đổ Nát"
 grand_archive.8105.desc: "Sau khi giáng đòn hỏa lực quỹ đạo dồn dập xuống căn cứ hải tặc, cuối cùng nó đã bị biến thành bình địa cùng toàn bộ những kẻ trú ngụ trước đó. Khi mọi mối đe dọa đã bị vô hiệu hóa, giờ đây chúng ta có thể cử một Nhà khoa học vào thám hiểm căn cứ đổ nát và trích xuất mảnh tiếp theo của §Y$celestial_chart$§!."
 grand_archive.8105.a.custom_tooltip: "Căn cứ Hắc Châm đã bị phá hủy. §Y[FromFrom.GetName]§! có thể tự do thám hiểm."
 grand_archive.8105.a.lom: "Vơ vét chiến lợi phẩm thôi!"

 project_type_research: "$RESEARCH$"
 project_type_bombardment: "Oanh Tạc"
 project_type_contract: "$START$"

 BLACK_NEEDLE_BASE_DEPLOY_ARMIES: "Tấn Công Căn Cứ Hắc Châm"
 BLACK_NEEDLE_BASE_DEPLOY_ARMIES_DESC: "Căn cứ ngầm trên [FromFrom.GetName] được bảo vệ bởi một lượng lớn quân lính và drone an ninh. Việc triển khai các đạo quân xuống bề mặt hành tinh sẽ cho phép chúng ta nhanh chóng tiếp quản căn cứ, khiến băng §YHắc Châm§! có rất ít cơ hội phản ứng.\n\nMột khi đã làm chủ căn cứ, chúng ta có thể trích xuất khoang chứa hải đồ và bất kỳ của cải phi pháp nào khác mà lũ hải tặc đã tích lũy."

 grand_archive.8110.name: "Phòng Tuyến Sụp Đổ"
 grand_archive.8110.desc: "Lực lượng mặt đất của chúng ta đã đánh chiếm căn cứ băng §YHắc Châm§! và hiện đang kiểm soát công trình cùng các tài nguyên xung quanh. Khi mọi mối đe dọa đã bị vô hiệu hóa, chúng ta có thể cử một Nhà khoa học vào trích xuất mảnh tiếp theo của §Y$celestial_chart$§!."
 grand_archive.8110.a.custom_tooltip: "Lực lượng mặt đất của băng Hắc Châm đã bị vô hiệu hóa. Giờ đây có thể tự do thám hiểm §Y[FromFromFrom.GetName]§!."
 grand_archive.8110.a.lom: "Đến lúc chia chác chiến lợi phẩm rồi."

 BLACK_NEEDLE_BASE_HACK: "Hack Hải Tặc"
 BLACK_NEEDLE_BASE_HACK_DESC: "Việc hải tặc quá phụ thuộc vào công nghệ đánh cắp và tái chế đã khiến căn cứ của chúng dễ bị xâm nhập. Một tàu nghiên cứu đơn lẻ có thể hack mạng lưới trên [FromFrom.GetName] từ quỹ đạo, ngụy trang thành một tàu vận tải băng §YHắc Châm§! theo lệnh của Thuyền trưởng Hoo. Điều này có thể thuyết phục chúng chuyển giao quyền giữ khoang chứa bản đồ mà không cần đổ máu vô ích."

 grand_archive.8115.name: "Thao Túng Thành Công"
 grand_archive.8115.desc.1: "Sau nhiều tháng chuẩn bị, Nhà khoa học [Leader.GetName] đã xâm nhập thành công mạng lưới liên lạc và mạo danh một con tàu băng §YHắc Châm§!. Dưới các mệnh lệnh ngụy tạo từ Thuyền trưởng Hoo, [Leader.GetHeShe] đã lừa được những kẻ vận hành căn cứ chuẩn bị khoang chứa để vận chuyển khẩn cấp rời khỏi hành tinh."
 grand_archive.8115.desc.slippery: "Nhà khoa học [Leader.GetName] đã hạ cánh con tàu của họ vào vị trí hoàn hảo để nhanh chóng rút lui trong trường hợp vỏ bọc bị bại lộ."
 grand_archive.8115.desc.charismatic: "Bằng sự lôi cuốn và quyến rũ của mình, Nhà khoa học [Leader.GetName] đã có thể tránh được bất kỳ câu hỏi hóc búa nào."
 grand_archive.8115.desc.psionic_organic: "Chỉ với một cái phẩy nhẹ của [Leader.Species.GetHandName], Nhà khoa học [Leader.GetName] đã thao túng tâm trí đám lính gác để xua tan mọi sự nghi ngờ."
 grand_archive.8115.desc.psionic_machine: "Thông qua cưỡng chế tâm linh, [Leader.GetName] đã dễ dàng thao túng tâm trí hạ đẳng của đám lính gác để tránh mọi nghi ngờ."
 grand_archive.8115.desc.2: "Khoang chứa đã được thu hồi mà không có bất kỳ thương vong nào. Lũ hải tặc vẫn chưa nhận ra rằng chúng đã bị lừa."
 grand_archive.8115.a: "$EXCELLENT$"

 grand_archive.8120.name: "Bị Bắt Quả Tang"
 grand_archive.8120.desc: "Thật không may, một tên lính gác đã phát hiện ra mưu kế của chúng ta khi chúng ta đang chuyển khoang chứa lên tàu. Phát hiện này dẫn đến một cuộc đọ súng ngắn, và chúng ta buộc phải tháo chạy khỏi hiện trường cùng với món hàng quý giá kéo theo sau. Khoang chứa đã được trích xuất thành công, nhưng Nhà khoa học [Leader.GetName] đã hy sinh trong làn đạn giao tranh."
 grand_archive.8120.a: "$TERRIBLE$"

 grand_archive.8125.name: "Căn Cứ Hải Tặc Bị Bỏ Hoang"
 grand_archive.8125.common: "Với những lỗ hổng này bị phơi bày, lũ hải tặc đã quyết định bỏ rơi căn cứ trên [FromFromFromFrom.GetName], lập tức sơ tán và đem theo những vật phẩm có giá trị khác từng cất giữ ở đó. Vệ tinh có thể sinh sống này giờ đây không còn ai chiếm giữ và có thể được thực dân hóa."
 grand_archive.8125.desc.alive: "Băng §YHắc Châm§! cuối cùng đã nhận ra chúng bị lừa sau khi phát hiện các lỗ hổng trong mạng lưới an ninh khép kín của mình.\n\n$grand_archive.8125.common$"
 grand_archive.8125.desc.dead: "Sau cuộc đào thoát trong đường tơ kẽ tóc của chúng ta khỏi cứ điểm băng §YHắc Châm§!, toàn bộ quy mô các nỗ lực xâm nhập của chúng ta đã bị bại lộ.\n\n$grand_archive.8125.common$"
 grand_archive.8125.a: "Một quyết định hợp lý."
 grand_archive.8125.a.custom_tooltip: "Các đạo quân trên §Y[FromFromFromFrom.GetName]§! đã rời khỏi hành tinh. Giờ đây có thể thực dân hóa nó."

 grand_archive.8130.name: "Hôi Của Căn Cứ Hắc Châm"
 grand_archive.8130.desc.common: "Căn phòng an toàn chứa vô số vật phẩm có giá trị cũng như những món kỷ vật gắn liền với lịch sử của tổ chức hải tặc. Chúng ta tìm thấy khoang chứa hải đồ nằm lẫn giữa các tác phẩm nghệ thuật bị đánh cắp, trang sức cá nhân hóa và các ví kỹ thuật số được mã hóa.\n\nChúng ta nghi ngờ rằng nhiều món hàng phát hiện ở đây sẽ rất khó tiêu thụ. Các tác phẩm nghệ thuật quá dễ nhận biết, đồ trang sức sẽ cần phải nấu chảy làm phế liệu, và các giao dịch bằng ví kỹ thuật số thường có thể truy vết. Một số chủ nhân trước đây của những món đồ này có thể đã qua đời từ lâu, nhưng những người khác chắc chắn vẫn đang tìm kiếm tài sản bị đánh cắp của mình."
 grand_archive.8130.desc.bombarded: "Lần theo đống đổ nát của căn cứ băng §YHắc Châm§!, chúng ta tìm thấy một hầm ngầm và mở nó ra, hé lộ một kho báu nhỏ chứa những món lợi bất chính của chúng.\n\n$grand_archive.8130.desc.common$"
 grand_archive.8130.desc.landed: "Thám hiểm căn cứ băng §YHắc Châm§! tan hoang, chúng ta tìm thấy một bản vẽ cơ sở cho thấy sự tồn tại của một hầm ngầm. Đi sâu xuống lòng đất bằng thang máy bảo trì, chúng ta nhập mã truy cập để mở ra một kho báu nhỏ chứa những món lợi bất chính của chúng.\n\n$grand_archive.8130.desc.common$"
 grand_archive.8130.a: "Tìm cách trao trả các vật phẩm bị đánh cắp."
 grand_archive.8130.b: "Bán sạch mọi thứ."
 grand_archive.8130.c.default: "Giữ lại các vật phẩm bị đánh cắp."
 grand_archive.8130.c.lom: "Ai thấy người nấy hưởng."

 black_needle_base_sold_stolen_items: "Đã Bán Các Vật Phẩm Bị Đánh Cắp Từ Căn Cứ Hắc Châm"
 opinion_black_needle_base_repatriate_stolen_items: "Đã Trao Trả Vật Phẩm Bị Đánh Cắp"
 opinion_black_needle_base_repatriate_stolen_items_tt: "§G+$@opinion_black_needle_base_repatriate_stolen_items_value|0$§! £opinion£ Thiện cảm với mọi Đế Chế không Diệt Chủng mà chúng ta không có chiến tranh."

 DECODE_THIRD_MAP_PIECE: "Giải Mã Mảnh Hải Đồ"
 DECODE_THIRD_MAP_PIECE_DESC: "Với khoang chứa thu được từ căn cứ băng §YHắc Châm§!, chúng ta có nhiệm vụ giải mã dữ liệu bên trong và tích hợp thông tin mới vào §H$celestial_chart$§!."

 grand_archive.8135.name: "Hải Đồ Đã Được Giải Mã"
 grand_archive.8135.desc: "Chúng ta đã vượt qua thành công các lớp mã hóa kỹ thuật số và tích hợp thông tin mới vào §Y$celestial_chart$§!. Điều này hé lộ thêm một điểm đến nữa để khám phá và giờ đây tấm hải đồ đã gần như hoàn chỉnh. Chúng ta tin rằng chỉ còn một mảnh ghép duy nhất của bức tranh còn lại, và thận trọng lạc quan rằng cái kết của cuộc truy tìm đã ở ngay trước mắt.\n\nTrong khi dữ liệu dẫn đường đang được giải mã, lớp vỏ ngoài không tì vết của chính khoang chứa được cho là rất đáng để phân tích. Độ bền và độ dẻo dai của vật chứa này thật đáng kinh ngạc; khả năng tái tạo vật liệu này có thể đem lại nhiều cơ hội tiềm năng cho nghiên cứu trong tương lai."
 grand_archive.8135.a: "$GOOD$"

 d_hive_dwelling: "Nơi Cư Trụ Của Tâm Trí Bầy Đàn"
 d_hive_dwelling_desc: "Một khu định cư cô lập được chiếm giữ bởi tập thể Smeegibb, những cựu thuyền viên của Thuyền trưởng Ness."
 d_ruined_hive_dwelling: "Nơi Cư Trụ Của Tâm Trí Bầy Đàn Bị Tàn Phá"
 d_ruined_hive_dwelling_desc: "Khu định cư bị san phẳng của tập thể Smeegibb, những cựu thuyền viên của Thuyền trưởng Ness."

 COLONIZATION_IMPOSSIBLE_SMEEGIBB_PLANET: "§RHành tinh này thuộc về $NAME_Smeegibb$.§!"
 grand_archive.8200.name: "Khu Định Cư Ẩn Giấu"
 grand_archive.8200.desc.common_1: "Chúng ta đã tìm thấy một khu định cư nhỏ trên [FROM.GetName] với dân số chưa đầy một nghìn cá thể thân mềm có tri giác. Phân tích sinh học sơ bộ về loài này cho thấy khả năng liên lạc qua khớp nối điện á không gian, báo hiệu sự tồn tại của một tâm trí bầy đàn. Ngoại trừ khu trại cô lập này, hành tinh hoàn toàn không có sự sống có tri giác nào khác cư ngụ."
 grand_archive.8200.desc.common_2: "Lý do tại sao §Y$celestial_chart$§! lại dẫn chúng ta tới đây vẫn chưa rõ ràng và đòi hỏi phải điều tra thêm."
 grand_archive.8200.desc: "$grand_archive.8200.desc.common_1$\n\n$grand_archive.8200.desc.common_2$"
 grand_archive.8200.desc.alt: "$grand_archive.8200.desc.common_1$\n\nCó lẽ loài này nắm giữ nhiều thông tin hơn về \"§Y$NAME_CaptainNess$§!\" này mà chúng ta từng nghe nói.\n\n$grand_archive.8200.desc.common_2$"

 grand_archive.8205.desc.common_1: "§HMột điểm nút của tâm trí bầy đàn được tìm thấy trong hệ sao ẩn giấu [FROM.GetName], $NAME_Smeegibb$ ngọ nguậy vẻ không thoải mái. Họ có xu hướng hạ tầm mắt khi được bắt chuyện, như thể đã quen với sự phục tùng.§!"
 grand_archive.8205.desc.common_2: "Tên của chúng tôi là $NAME_Smeegibb$. Chúng tôi tò mò làm sao các bạn tìm thấy chúng tôi. Hệ sao này đã ẩn giấu khỏi tầm mắt ngân hà hàng ngàn năm qua.\n\nChỉ có §YThuyền Trưởng§! biết nơi này. Các bạn tìm kiếm thứ gì?"
 grand_archive.8205.desc.default: "$grand_archive.8205.desc.common_1$\n\nSmarak! Đã gấp đôi lâu lắm rồi kể từ khi chúng tôi trò chuyện với những kẻ đơn tâm trí.\n\n$grand_archive.8205.desc.common_2$"
 grand_archive.8205.desc.gestalt: "$grand_archive.8205.desc.common_1$\n\nSmarak! Đã gấp đôi lâu lắm rồi kể từ khi chúng tôi trò chuyện với một tâm trí nhóm khác.\n\n$grand_archive.8205.desc.common_2$"
 grand_archive.8205.a: "Nơi này là gì?"
 grand_archive.8205.a.reply: "Smarak! Hành tinh này là chỗ ở của chúng tôi. Chúng tôi sống an toàn gấp bội, cách xa một ngân hà bạo lực. Trước đây, chúng tôi tham gia bạo lực. Giết chóc, tội phạm, hải tặc - chúng tôi làm tuốt. Giờ không làm nữa. Chúng tôi chăm sóc vườn thủy canh của mình.\n\nTrước đó nữa, chúng tôi là dân tị nạn. Chẳng ai cưu mang chúng tôi, cho đến khi §YThuyền Trưởng§! xuất hiện. Cô ấy cứu chúng tôi khỏi số phận nghiệt ngã và cho phép chúng tôi gia nhập thủy thủ đoàn của cô ấy. Thuyền trưởng ban cho chúng tôi một cái tên mới và đổi lại chúng tôi chăm sóc con tàu.\n\nChúng tôi dọn dẹp, nấu nướng, quản lý đạn dược, thủy canh và hàng hóa. Chúng tôi làm việc cật lực. Sau đó chúng tôi gia nhập đội đổ bộ. Bảo vệ Thuyền Trưởng khi cô ấy cướp kho báu hoặc bắt cóc tống tiền. Không bao giờ phản bội Thuyền Trưởng. Chúng tôi luôn luôn trung thành."
 grand_archive.8205.b: "Các bạn biết gì về §Y$celestial_chart$§!?"
 grand_archive.8205.b.reply: "Smarak! Chúng tôi không biết hải đồ nào cả, chúng tôi chỉ ru rú trong chỗ ở của mình thôi. Nếu §YThuyền Trưởng§! tạo ra hải đồ để dẫn các bạn tới đây, hẳn phải có lý do nào đó... Cô ấy muốn giúp chúng tôi, hoặc hại chúng tôi. Chúng tôi không bao giờ dám chắc. Thuyền trưởng rất chi là ma mãnh.\n\nCó lần cô ấy gửi tin nhắn cho chúng tôi. Thuyền trưởng gửi cho chúng tôi một bức tượng khổng lồ về drone yêu thích của cô ấy, cá thể $NAME_Smeegibb$ mà cô ấy nhớ đến và đã cứu từ ngày trước. Bức tượng rất ấn tượng, nhưng chúng tôi không rõ tại sao cô ấy lại gửi. Có thể cô ấy muốn xin lỗi, nhưng cô ấy chẳng để lại mẩu thư nào cả."
 grand_archive.8205.c: "Kể cho chúng tôi nghe thêm về §YThuyền Trưởng§! đi."
 grand_archive.8205.c.reply: "Smarak! Trước đây, §YThuyền Trưởng§! đã cứu chúng tôi. Trước đây cô ấy là người thầy và người thủ lĩnh của chúng tôi. Cô ấy dạy chúng tôi chăm sóc con tàu. Cô ấy bảo \"$NAME_Smeegibb$, làm quản kho, thợ máy kiêm lao công - các ngươi thật là đáng giá tuyệt vời.\"\n\nThuyền trưởng sống theo hai tôn chỉ: \"Của cải là sự độc lập\" và \"Sự sống tồn tại vì di sản\". Chúng tôi cùng nhau săn đuổi cả kẻ nghèo lẫn người giàu. Chúng tôi đoạt lấy những gì mình muốn từ ngân hà tàn bạo.\n\nNhưng rồi Thuyền trưởng trở nên tham lam gấp bội và liều lĩnh gấp bội. Cô ấy hy sinh thuyền viên hoặc phản bội họ để lấy tiền thưởng. Thuyền trưởng đánh mất tất cả mọi người trừ $NAME_Smeegibb$. Chúng tôi luôn luôn trung thành.\n\nCô ấy cho chúng tôi thấy ngân hà tàn bạo dường nào. Giờ chúng tôi chỉ muốn lánh xa."
 grand_archive.8205.d: "Tại sao Hải Đồ của chúng tôi lại dẫn đến đây?"
 grand_archive.8205.d.reply: "Smarak! Chúng tôi không chắc tại sao §YThuyền Trưởng§! lại dẫn các bạn đến đây. Cô ấy chẳng nói gì với chúng tôi cả.\n\nCó một manh mối này. Có một nơi mà §YThuyền Trưởng§! và chúng tôi từng cùng nhau ẩn náu khỏi lũ chó săn tiền thưởng. Chỗ ở an toàn. Có lẽ các bạn sẽ tìm thấy thứ gì đó ở nơi ấy."

 grand_archive.8210.name: "Phát Hiện Nhà An Toàn"
 grand_archive.8210.desc: "Sinh thể chúng ta chạm trán trên [from.GetName], $NAME_Smeegibb$, đã tiết lộ tọa độ của một ngôi nhà an toàn bỏ hoang từng được chính họ và §Y$NAME_CaptainNess$§! sử dụng. Điều tra địa điểm này có thể dẫn chúng ta đến mảnh tiếp theo của §Y$celestial_chart$§!, hoặc ít nhất là một manh mối dẫn lối chúng ta đi đúng hướng."
 grand_archive.8210.a: "Hãy bắt đầu đào bới."

 smeegibb_digsite_poi: "Thám Hiểm Nhà An Toàn"
 smeegibb_digsite_poi_desc: "Di chỉ khảo cổ này có thể nắm giữ chìa khóa mở ra mảnh tiếp theo của §H$celestial_chart$§!. Chúng ta phải điều tra ngôi nhà an toàn bỏ hoang nếu muốn tiếp tục cuộc tìm kiếm $TREASURE_TROVE$ thất lạc của §H$NAME_CaptainNess$§!."

 NAME_Bemat_cruiser_inax_01: "Hebehr"

# Treasure Hunters Origin - Smeegibb
 smeegibb_digsite: "Nhà An Toàn Bỏ Hoang"
 smeegibb_digsite_desc: "Trên vùng hoang mạc băng giá của [fromfrom.planet.GetName], chúng ta đã phát hiện một hầm trú ẩn tiền chế nhỏ được trang bị các thiết bị duy trì sự sống đang ngủ yên và các khu sinh hoạt. Chúng bị phong hóa nặng nề và bị vùi lấp một phần sau hàng thiên niên kỷ bão tuyết."

 grand_archive.8220.name: "Nhật Ký Thuyền Trưởng"
 grand_archive.8220.desc: "Cấu trúc được khai quật cho thấy dấu hiệu của những giai đoạn sử dụng lâu dài. Nơi này từng được dự trữ đầy đủ các tiện nghi cơ bản. Những món đồ lưu niệm và kỳ vật đã được phát hiện nằm rải rác khắp tòa nhà. Bên trong một đống giấy tờ bừa bộn, chúng ta đã thu hồi được một đoạn nhật ký do chính tay §Y$NAME_CaptainNess$§! viết.\n\n§LChúng ta đã đổ bộ và cướp một chuyến tàu vận tải kho báu khác của người Perikan, nhưng lần này chúng đã chuẩn bị sẵn để đón tiếp chúng ta. Thiệt hại ngoài ý muốn nhiều hơn ta mong đợi, nhưng chúng ta đã từng xử lý những chuyện tệ hơn thế này. Khoản tiền kiếm được khá hậu hĩnh, nhưng Viên Ngọc Tapico vẫn tiếp tục lẩn tránh chúng ta. Không may là, giờ lũ Perikan lại tăng tiền thưởng truy nã và Liên bang đã nhúng tay vào. Tình hình lúc này hơi bị căng. Có lẽ cần phải nằm im thở khẽ một thời gian.§!"
 grand_archive.8220.a: "Tiếp tục tìm kiếm."

 grand_archive.8225.name: "Giết Thời Gian"
 grand_archive.8225.desc: "Đào sâu bên dưới cấu trúc đã hé lộ một nơi cất giấu nhỏ chứa các đồ vật có giá trị cùng hệ thống vệ sinh cơ bản. Thật không may, sau khi lùng sục kỹ lưỡng toàn bộ khu vực, chúng ta không tìm thấy bất kỳ dấu vết nào về một mảnh của §Y$celestial_chart$§!.\n\nChúng ta đã thu thập thêm sổ tay và giấy tờ với hy vọng phát hiện ra manh mối bên trong những đoạn nhật ký rải rác của §Y$NAME_CaptainNess$§!.\n\n§LThời gian trôi qua bớt chậm chạp hơn khi có một người đồng hành như $NAME_Smeegibb$, nhưng liệu có đáng để chia sẻ vinh quang không? Chắc chắn rồi, làm việc với một tâm trí bầy đàn mang lại giá trị khó tin. Tiếp cận hàng trăm drone mà chỉ phải chia một phần lợi nhuận duy nhất? Đúng là món hời! Nhưng liệu công việc chúng làm có làm lu mờ đi những thành tựu của chính ta không...? Ta không chắc mình có thể chấp nhận ý nghĩ phải chia sẻ di sản của mình. Ta sẽ cần phải suy nghĩ thêm về chuyện này.§!"
 grand_archive.8225.a: "$grand_archive.8220.a$"

 grand_archive.8230.name: "Điều Cần Chứng Minh"
 grand_archive.8230.desc: "Được giấu kín bên trong một ống thông gió, chúng ta đã phát hiện đoạn nhật ký cuối cùng của §Y$NAME_CaptainNess$§!.\n\n§LĐây không phải là cách ta muốn được hậu thế nhớ tới. $NAME_Smeegibb$ đã là một người bạn đồng hành trung thành, nhưng đừng bao giờ để ai nói rằng ta cần đến chúng. Ta có thể tự mình chinh phục cả ngân hà. Ta sẽ để lại dấu ấn của RIÊNG TA, và vinh quang sẽ thuộc về ta. Cả sự giàu sang phú quý cũng thế.\n\nGhi chú cho bản thân: Tốt hơn là nên gửi cho $NAME_Smeegibb$ thứ gì đó để chúng nhớ về ta.§!\n\nĐây là tất cả những gì còn lại để tìm kiếm. Không còn dấu vết nào khác của Thuyền trưởng hay bất kỳ dấu hiệu nào của §Y$celestial_chart$§!.\n\nCó lẽ món quà gửi cho $NAME_Smeegibb$ được nhắc tới nắm giữ manh mối nào đó về tung tích của mảnh ghép cuối cùng. Chúng ta phải mở lại liên lạc với họ."
 grand_archive.8230.a: "Khai quật di chỉ hoàn tất."

 grand_archive.8236.name: "$NAME_Smeegibb$ Mất Tích"
 grand_archive.8236.desc.default: "$smeegibb_shelter_system_2_poi_desc$"
 grand_archive.8236.desc.xenophile: "$smeegibb_shelter_system_2_poi_desc$\n\nChúng ta hy vọng rằng người bạn mới tìm thấy của mình vẫn bình an vô sự."
 grand_archive.8236.a: "Tới [smeegibb_system.GetName]"

 grand_archive.8241.name: "Băng $NAME_BlackNeedle$ Tái Xuất"
 grand_archive.8241.desc: "Một hạm đội quy mô mang cờ hiệu của tổ chức hải tặc mang tên §Y$NAME_BlackNeedle$§! đã được nhìn thấy đang quay quanh [smeegibb_shelter.GetName]. Chúng ta tin rằng lũ hải tặc này đã bám sát các động thái của chúng ta, và đã san phẳng khu định cư của tập thể mang tên $NAME_Smeegibb$. Chắc chắn chúng vẫn đang lùng sục mảnh tiếp theo của §Y$celestial_chart$§!.\n\nKhông còn dấu hiệu nào của sự sống có tri giác trên hành tinh.\n\nChúng ta đang nhận được tín hiệu truyền tin từ soái hạm của chúng."

 grand_archive.8245.name: "$NAME_CaptainInax$ của băng $NAME_BlackNeedle$"

 grand_archive.8245.desc.inax.1: "§HSinh vật chân khớp này đứng sừng sững, đôi mắt kép rực sáng chói lọi. Phong thái kỷ luật hoàn toàn đối lập với những chiếc càng miệng đang bồn chồn, chốc chốc lại lách cách và run rẩy vì phấn khích.§!\n\nVậy là, cuối cùng chúng ta cũng gặp nhau. Làm thế nào mà lũ thân mềm các ngươi lại đánh bại được §YK-k-k-thuyền trưởng Hoo§!? Ngay cả cái tên đ-đ-đần độn già nua đó lẽ ra cũng phải dễ dàng quét sạch hạm đội thảm hại của các ngươi. Các ngươi sẽ phải trả giá cho"
 grand_archive.8245.desc.inax.2: "C-c-cảm ơn vì đã dẫn đường cho chúng ta tới đây. §Y$NAME_SilverQuill$§! đã săn lùng lũ $NAME_Smeegibb$ thảm hại đó hơn một trăm chu kỳ. Giải quyết một trong những mối thù cổ xưa của ngài ấy có nghĩa là ta sắp vớ bở một món tiền thưởng khổng lồ... Một khi ta xử lý xong các ngươi."
 grand_archive.8245.desc.ransacked: "$grand_archive.8245.desc.inax.1$ việc c-c-cướp phá căn cứ của chúng ta trên [black_needle_base.GetName].\n\n$grand_archive.8245.desc.inax.2$"
 grand_archive.8245.desc.stolen: "$grand_archive.8245.desc.inax.1$ việc trộm cắp từ băng §YHắc-k-k Châm§!.\n\n$grand_archive.8245.desc.inax.2$"
 grand_archive.8245.a: "Ngươi là ai?"
 grand_archive.8245.a.reply: "G-g-gọi ta là Inax, Chuẩn Đô đốc của băng §YHắc-k-k Châm§!.\n\nGiờ các ngươi đã biết tên của kẻ sẽ g-g-giết các ngươi. Đây là một cái chết vinh dự. Ta khuyên các ngươi nên đón nhận nó.\n\nTheo p-p-phong tục, các ngươi thậm chí có thể nổ phát súng đầu tiên."
 grand_archive.8245.b: "Ngươi đã giết $NAME_Smeegibb$..."
 grand_archive.8245.b.reply.common: "Chúng chẳng có chút thách thức nào. Bọn ta đã quét sơn căn lều ổ chuột của chúng bằng dòng máu th-th-thân mềm màu xanh lam. Không hạm đội, không vũ khí - sớm muộn gì cũng có kẻ đ-đ-đập chết chúng thôi. Chẳng ai bị §YHắc-k-k Châm§! đâm trúng mà còn sống sót.\n\nChúng là bạn của các ngươi ư? Thật là k-k-kỳ quặc. Các ngươi sẽ sớm đoàn tụ với chúng thôi. Nhân danh §Y$NAME_SilverQuill$§!, chúng ta sẽ đoạt lấy tấm hải đồ đó"
 grand_archive.8245.b.reply.default: "$grand_archive.8245.b.reply.common$ từ những cái xác-k-k vẫn còn đang co giật của các ngươi."
 grand_archive.8245.b.reply.robot: "$grand_archive.8245.b.reply.common$ khi những ánh đèn của các ngươi chớp-p-p tắt rồi lịm hẳn."
 grand_archive.8245.c: "$NAME_SilverQuill$ là ai?"
 grand_archive.8245.c.reply: "Ai là §Y$NAME_SilverQuill$§! ư? Thật là một c-c-câu hỏi ngớ ngẩn. Vị sáng lập huyền thoại của chúng ta là một bậc thầy mưu lược. Chỉ từ một con tàu duy nhất, ngài đã xây dựng băng §YHắc-k-k Châm§! thành một đế chế trải rộng khắp thiên hà.\n\nBăng Hắc-k-k Châm tiếp tục tồn tại để k-k-kế thừa di sản của ngài. Cái chết của các ngươi sẽ là nốt nhạc tiếp theo trong khúc ca của chúng ta."
 grand_archive.8245.d: "Ngươi muốn tấm $celestial_chart$ để làm gì?"
 grand_archive.8245.d.reply: "Các ngươi không biết mình đang nắm giữ thứ gì sao? Đây là tấm hải đồ dẫn đến kho báu của §YTh-th-thuyền trưởng Ness§!! Từng đ-đ-đồng credit và châu báu được cất giấu suốt cả cuộc đời ả.\n\nSự giàu sang của nó thuộc về chúng ta. Một khi đoạt được nó, chúng ta sẽ hát vang tên mình vào lịch sử. Mọi hệ sao sẽ phải run sợ trước băng §YHắc-k-k Châm§!... Và nốt nhạc đầu tiên trong dàn đ-đ-đồng ca sẽ là của các ngươi. Bọn ta chẳng phải quá rộng lượng sao?"
 grand_archive.8245.e: "Chúng ta không dễ dàng từ bỏ như vậy đâu."
 grand_archive.8245.e.reply: "Vậy thì hãy cùng nhau ca hát nào! Ta sẽ biến [this.species.GetRemnantNamePlural] của các ngươi thành chiến lợi phẩm và dâng tặng nó như một món quà cho ch-ch-chỉ huy của ta."

 grand_archive.8265.name: "$grand_archive.8245.name$"
 grand_archive.8265.desc: "Một trận chiến đáng nhớ! Các ngươi không yếu-k-k ớt như vẻ ngoài. Chúng ta đã hai lần đánh giá thấp các ngươi, nhưng sẽ không có lần thứ ba đâu. Lần tới khi chúng ta gặp lại, băng §YHắc-k-k Châm§! sẽ không nương tay nữa.\n\nĐừng coi đây là lời cảnh báo. Đây là bản án tử hình."
 grand_archive.8265.a.scared: "Thật bất an..."
 grand_archive.8265.a.homicidal: "Nhào vô kiếm ăn."
 grand_archive.8265.a.gestalt: "Chấm dứt liên lạc."

 gateway_to_ness_treasure_system_poi: "Dấu X Trên Hải Đồ"
 gateway_to_ness_treasure_system_poi_desc: "Tấm §H$celestial_chart$§! giờ đây đã hoàn chỉnh. Nó đã hé lộ một hệ sao ẩn giấu cuối cùng, [Prev.GetName]. Cuộc tìm kiếm dài đằng đẵng của chúng ta gần như đã đến hồi kết - hãy du hành tới đó để khám phá điều gì đang chờ đón!"

 TREASURE_HUNTERS_CHART_PIECE_3_PROJECT: "Khoang Chứa Ẩn Giấu"
 TREASURE_HUNTERS_CHART_PIECE_3_PROJECT_DESC: "Dựa trên cuộc điều tra của chúng ta, chúng ta tin rằng mảnh tiếp theo của §H$celestial_chart$§! được giấu ở đâu đó bên trong khu định cư đổ nát trên [this.GetName].\n\nXét đến kết cấu vững chắc của các khoang chứa khác, chúng ta có thể giả định rằng nó đã sống sót qua trận oanh tạc gần đây."

 grand_archive.8270.name: "Bí Mật Của Bức Tượng"
 grand_archive.8270.desc: "Cuộc tìm kiếm mảnh thứ tư của §Y$celestial_chart$§! trên [from.GetName] của chúng ta đã kết thúc thắng lợi. Khoang chứa được tìm thấy nằm gắn sâu bên trong một bức tượng đá tạc một drone thuộc tập thể nay đã tuyệt chủng mang tên $NAME_Smeegibb$. Dòng chữ khắc trên bức tượng ghi như sau:\n\n§L\"Gửi người thuyền viên trung thành của ta: một tín vật ghi nhận sự cảm kích của ta. Chúc cho sự cô độc của ngươi sẽ dài lâu và thanh thản.\"§!\n\nMột khi mảnh ghép cuối cùng này của hải đồ được giải mã, chúng ta có thể tiếp tục cuộc tìm kiếm kho báu của §Y$NAME_CaptainNess$§!."

 TREASURE_HUNTERS_ANCIENT_CAPSULE_4_PROJECT: "Mảnh Hải Đồ Cuối Cùng"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_4_PROJECT_DESC: "Sau khi trích xuất khoang chứa từ tàn tích của khu định cư $NAME_Smeegibb$, tất cả những gì còn lại là giải mã dữ liệu bên trong và hoàn thành tấm §H$celestial_chart$§!. Chúng ta sẽ sớm khám phá ra điều gì đang chờ đón ở cuối con đường của §H$NAME_CaptainNess$§!."

 grand_archive.8280.name: "Hải Đồ Hoàn Thành"
 grand_archive.8280.desc: "Sau khi được giải mã, đoạn dữ liệu mới đã hoàn thiện §Y$celestial_chart$§! của chúng ta. Các điểm sáng bừng lên tại nhiều nút khác nhau báo hiệu các điểm đến trung gian mà chúng ta đã phát hiện dọc đường. Bốn điểm sáng sau đó cùng nhấp nháy đồng thanh trước khi hé lộ một hệ sao ẩn giấu khác.\n\nViệc bổ sung mảnh dữ liệu cuối cùng đã mở khóa thêm các tính năng bổ sung. Tấm §YHải Đồ§! không đơn thuần là một bản đồ giản đơn, nó chứa đựng thông tin về của cải thất lạc và các kho báu phi pháp trên khắp ngân hà do chính §Y$NAME_CaptainNess$§! thu thập. Một phần dữ liệu có thể đã hết hạn, nhưng thiết bị này hoàn toàn có thể phát hiện các kho báu quý giá ẩn giấu trên khắp mọi hệ sao của chúng ta.\n\nHơn nữa, tấm §YHải Đồ§! còn chứa thông tin giám định về mọi kho báu mà Thuyền trưởng từng phát hiện trong suốt sự nghiệp của mình. Những ghi chú chi tiết này giải thích cách nhận biết, thẩm định và giới thiệu các vật phẩm có giá trị thu được tới những người mua tiềm năng để đạt lợi nhuận tối đa. Việc kích hoạt lại thiết bị sẽ cung cấp các bản thiết kế cho một Hầm Kho Báu độc nhất vô nhị, cho phép các thuộc địa của chúng ta tận dụng hiểu biết sâu sắc vô song của Thuyền trưởng và gia tăng giá trị cho kho báu tích lũy của chúng ta."
 grand_archive.8280.a.lom: "Kho báu vô lượng vô biên."

 grand_archive.8285.name: "Dấu X Trên Hải Đồ"
 grand_archive.8285.desc: "Việc hoàn thành §Y$celestial_chart$§! là một sự kiện trọng đại đối với [this.GetName]. Với mọi bí mật đã được mở khóa, chúng ta được dẫn lối tới một điểm đến duy nhất không thể né tránh: hệ sao [gateway_to_ness_treasure_system.GetName].\n\nSau khi vượt qua muôn vàn trắc trở, chúng ta chỉ còn cách đích đúng một bước chân. Chỉ còn lại một câu hỏi duy nhất: điều gì đang ngự trị ở cuối tấm §YHải Đồ§!?\n\nKhông có gì bảo đảm cho sự thành công, nhưng chúng ta sẽ không chọn con đường nào khác. Hãy dũng mãnh tiến lên để hoàn thành trọn vẹn cuộc phiêu lưu này!"
 grand_archive.8285.a.default: "Tiến lên phía trước."
 grand_archive.8285.a.lom: "Tiến lên, hò reo nào!"

 councilor_head_treasure_hunter: "Thợ Săn Kho Báu Trưởng"
 councilor_head_treasure_hunter_female: "$councilor_head_treasure_hunter$"
 councilor_head_treasure_hunter_desc: "$TITLE$ phân tích cẩn thận §Y$celestial_chart$§! để lần theo các kho cất giấu và thẩm định các cổ vật có giá trị."
 councilor_corporate_head_treasure_hunter: "$councilor_head_treasure_hunter$"
 councilor_corporate_head_treasure_hunter_female: "$councilor_head_treasure_hunter$"
 councilor_corporate_head_treasure_hunter_desc: "$councilor_head_treasure_hunter_desc$"

 prospect_of_treasure_modifier: "Triển Vọng Kho Báu"
 prospect_of_treasure_modifier_tt: "Cho §G+$@prospect_of_treasure_treasure_trove_reward|0%$§! $mod_treasure_trove_reward_mult$, §G+$@prospect_of_treasure_treasure_gatherers_produces|0%$§! $mod_planet_treasure_gatherers_produces_mult$ và §G+$@prospect_of_treasure_energy_produces|0$§! $mod_country_base_energy_produces_add$ cho mỗi cấp của $ruler$:\n\n"

 grand_archive.8290.name: "Khẩu Vị Săn Kho Báu"
 grand_archive.8290.desc.chart: "Với việc thiết lập Hầm Kho Báu trên [from.GetName], chúng ta tin rằng §Y$celestial_chart$§! có tiềm năng đóng góp đáng kể cho nền kinh tế của chúng ta."
 grand_archive.8290.desc.trove: "Khi chúng ta phân bổ các tài nguyên từ $TREASURE_TROVE$ được phát hiện trên [from.GetName], điều hiển nhiên là §Y$celestial_chart$§! có tiềm năng đóng góp đáng kể cho nền kinh tế của chúng ta."
 grand_archive.8290.desc.default: "Để tận dụng tốt nhất các năng lực của tấm §YHải Đồ§!, chúng ta đã hình thành một vị trí Hội đồng mới cho một cá nhân phụ trách dẫn dắt các nỗ lực khám phá và thu thập kho báu của chúng ta."
 grand_archive.8290.desc.gestalt: "Để tận dụng tốt nhất các năng lực của tấm §YHải Đồ§!, chúng ta đã thực hiện các biện pháp cho phép phân bổ tăng cường tài nguyên cho việc khám phá và thu thập kho báu."
 grand_archive.8290.desc.chart.default: "$grand_archive.8290.desc.chart$\n\n$grand_archive.8290.desc.default$"
 grand_archive.8290.desc.chart.gestalt: "$grand_archive.8290.desc.chart$\n\n$grand_archive.8290.desc.gestalt$"
 grand_archive.8290.desc.trove.default: "$grand_archive.8290.desc.trove$\n\n$grand_archive.8290.desc.default$"
 grand_archive.8290.desc.trove.gestalt: "$grand_archive.8290.desc.trove$\n\n$grand_archive.8290.desc.gestalt$"
 grand_archive.8290.tt: "\n§ECho phép mở khóa Vị trí Hội đồng:§!\n§H$t$$councilor_head_treasure_hunter$§!\n$tt$$COUNCIL_POSITION_MODIFIER_BASE$\n$ttt$$mod_treasure_trove_reward_mult$: §G+$@councilor_head_treasure_hunter_treasure_trove_reward|0%$§!\n$ttt$$mod_planet_treasure_gatherers_produces_mult$: §G+$@councilor_head_treasure_hunter_treasure_gatherers_produces|0%$§!\n$ttt$$mod_country_base_energy_produces_add$: §G+$@councilor_head_treasure_hunter_energy_produces|0$§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$scientist_with_icon$ $commander_with_icon$"

 grand_archive.8300.name: "Cổng Đầy Trùng Nhung Nhúc"
 grand_archive.8300.desc.common: "Chính Cổng Sao này chắc chắn sẽ dẫn chúng ta tới kho báu tìm kiếm bấy lâu."
 grand_archive.8300.desc.did_encounter_voidworms: "Bản đồ đã dẫn chúng ta tới một lỗ đen chưa từng được ghi nhận trên hải đồ trước đây, và một hệ sao bị $NAME_Voidworms$ xâm chiếm. Đã làm tổ trong một Cổng Sao bỏ hoang gần đó, những con lớn nhất trong số chúng lượn vòng đầy tính sở hữu quanh cấu trúc bị bỏ phế.\n\n$grand_archive.8300.desc.common$ Nếu muốn đi đến cuối con đường, chúng ta phải tiêu diệt $NAME_Voidworms$ và sửa chữa Cổng Sao."
 grand_archive.8300.desc.didnt_encounter_voidworms: "Bản đồ đã dẫn chúng ta tới một lỗ đen chưa từng được ghi nhận trên hải đồ trước đây, và một hệ sao đầy dẫy những sinh vật kỳ lạ. Tụ tập xung quanh một Cổng Sao bỏ hoang gần đó, những con lớn nhất trong số chúng lượn vòng đầy tính sở hữu quanh cấu trúc bị bỏ phế.\n\nNhững thực thể khổng lồ dạng giun này không có trong cơ sở dữ liệu về dã thú không gian của chúng ta. Chúng ta hiện đang nỗ lực thiết lập liên lạc. $grand_archive.8300.desc.common$ Nếu muốn đi đến cuối con đường, chúng ta phải xử lý những sinh vật này và sửa chữa Cổng Sao."
 grand_archive.8300.a: "Không gì có thể cản đường chúng ta."
 grand_archive.8300.a.pacifist: "Nếu chúng ta bắt buộc phải làm vậy."
 grand_archive.8300.a.lom: "Bắn một loạt đạn mạn tàu cho chúng nếm mùi!"

 GATEWAY_VOIDWORMS_KILL_PROJECT: "$grand_archive.8300.name$"
 GATEWAY_VOIDWORMS_KILL_PROJECT_DESC: "Chúng ta đã lần theo §H$celestial_chart$§! tới một §HCổng Sao§! bị nhiễm trùng tại hệ sao [this.solar_system.GetName]. Những sinh vật này phải được giải quyết trước khi chúng ta có thể kích hoạt lại Cổng và xem có những gì ở phía bên kia."
 GATEWAY_VOIDWORMS_KILL_PROJECT_TT: "§RĐánh bại các sinh vật trong [this.solar_system.GetName]§!"

 GATEWAY_VOIDWORMS_DEBRIS_PROJECT: "Xác $NAME_Voidworms$"
 GATEWAY_VOIDWORMS_DEBRIS_PROJECT_DESC: "Xác của Trùng Hư Không trong hệ sao [this.solar_system.GetName] đang hiển thị các chỉ số bất thường. Máy quét của chúng ta dường như phát hiện dấu hiệu của sự sống bên trong một trong các xác Troika đang phân hủy. Chúng ta nên cử một Tàu Khoa học tới để điều tra thêm về điều này."

 grand_archive.8310.name: "Ổ Trùng Hư Không"
 grand_archive.8310.desc.did_encounter_voidworms: "Một đàn trùng non đã được tìm thấy đang nép mình bên trong một trong những xác Trùng Hư Không. Bất chấp những mất mát gây ra cho đồng loại của chúng, chúng tiến lại gần các con tàu của chúng ta và bắt đầu trôi dạt dọc theo hạm đội của chúng ta với vẻ van nài.\n\n$grand_archive.8310.desc.common$"
 grand_archive.8310.desc.didnt_encounter_voidworms: "Một đàn con non đã được tìm thấy đang nép mình bên trong một trong những xác sinh vật dạng rắn. Bất chấp những tổn thất gây ra cho đồng loại của chúng, chúng tiến lại gần các con tàu của chúng ta và bắt đầu trôi dạt dọc theo hạm đội của chúng ta với vẻ phục tùng.\n\n$grand_archive.8310.desc.common$"
 grand_archive.8310.desc.common: "Nếu chọn làm vậy, chúng ta có thể tận dụng sự gắn bó bản năng của chúng để mang lại lợi thế cho mình: một khi trưởng thành, đàn sinh vật không gian này có thể trở thành một hạm đội hữu cơ ấn tượng dưới quyền kiểm soát của chúng ta."
 grand_archive.8310.a: "Một phát hiện đáng chú ý."
 grand_archive.8310.a.tt: "Chúng ta sẽ nhận được một hạm đội gồm §Y$@gateway_voidworm_nymph_reward_count|0$ §2$epic$§! $voidworms_small_plural$§!."
 grand_archive.8310.b: "Con mồi dễ xơi."

 grand_archive.8315.name: "Điều Tra Công Nghệ Cổng Sao"
 grand_archive.8315.desc: "Cổng Sao trong [FromFromFrom.System.GetName] không hoạt động. Khi tiếp cận cấu trúc cổ đại này, tấm §Y$celestial_chart$§! đã cung cấp một loạt hiểu biết sâu sắc về công nghệ đã mất này. Hiểu được phương thức di chuyển cổ xưa này nhiều khả năng sẽ chứng tỏ hữu ích trong các chuyến phiêu lưu khác."

 RESEARCH_GATEWAY_ACTIVATION_PROJECT: "$grand_archive.8315.name$"
 RESEARCH_GATEWAY_ACTIVATION_PROJECT_DESC: "$grand_archive.8315.desc$"
 RESEARCH_GATEWAY_ACTIVATION_PROJECT_TT: "Nghiên cứu Công nghệ £physics£ §Y$tech_gateway_activation$§!"

 grand_archive.8325.name: "Kích Hoạt Cổng Sao"
 grand_archive.8325.desc.common: "Một khi chúng ta tái thiết lập mối liên kết giữa các hệ sao, tấm bản đồ sẽ không còn chỉ thêm đường nào nữa. Bất kể tấm hải đồ này nắm giữ bí mật gì, chúng sẽ sớm được hé lộ."
 grand_archive.8325.desc.tech: "Sau khi nghiên cứu công nghệ phù hợp, giờ đây chúng ta đã có thể kích hoạt lại Cổng Sao cổ đại tại [gateway_to_ness_treasure_system.GetName].\n\n$grand_archive.8325.desc.common$"
 grand_archive.8325.desc.kill.known: "Khi các sinh vật đã được xử lý xong, tất cả những gì còn lại là kích hoạt lại Cổng Sao cổ đại tại [gateway_to_ness_treasure_system.GetName].\n\n$grand_archive.8325.desc.common$"
 grand_archive.8325.desc.kill.unknown: "Khi $NAME_Voidworms$ đã được xử lý xong, tất cả những gì còn lại là kích hoạt lại Cổng Sao cổ đại tại [gateway_to_ness_treasure_system.GetName].\n\n$grand_archive.8325.desc.common$"

 ACTIVATE_GATEWAY_PROJECT: "$grand_archive.8325.name$"
 ACTIVATE_GATEWAY_PROJECT_DESC: "Là điểm đến cuối cùng trên §H$celestial_chart$§!, §HCổng Sao§! đang ngủ yên trong hệ sao [this.solar_system.GetName] nhiều khả năng sẽ dẫn tới một thứ có tầm quan trọng to lớn."
 ACTIVATE_GATEWAY_PROJECT_TT: "§HKích hoạt Cổng Sao§!"

 ACTIVATE_GATEWAY_PROJECT_NOMADS: "$ACTIVATE_GATEWAY_PROJECT$"
 ACTIVATE_GATEWAY_PROJECT_NOMADS_DESC: "$ACTIVATE_GATEWAY_PROJECT_DESC$"

 BYPASS_GATEWAY_NESS: "$BYPASS_GATEWAY$"
 ENTRY_BYPASS_GATEWAY_NESS: "Lối Vào $BYPASS_TYPE$"

 grand_archive.8400.name: "Kho Báu Đằng Kia, Hò Reo Nào!"
 grand_archive.8400.desc: "Sau khi kích hoạt Cổng Sao ở cuối tấm §Y$celestial_chart$§!, chúng ta đã phát hiện hệ sao [ness_treasure_system.GetName]. Sự phân bố của các thiên thể hoàn toàn trùng khớp với các bức phác thảo mà chúng ta tìm thấy trong nhật ký hành trình của §Y$NAME_CaptainNess$§!.\n\nHành trình dài của chúng ta gần như đã đến hồi kết."
 grand_archive.8400.a: "Tiến lên phía trước."

 ness_treasure_system_poi: "Du hành qua Cổng Sao tại [from.solar_system.GetName]"
 ness_treasure_system_poi_desc: "Chúng ta đã lần theo §H$celestial_chart$§! cho tới điểm cuối, đẩy lùi hải tặc và các quái thú gớm ghiếc. Cổng Sao hiện đã kích hoạt, tất cả những gì còn lại là khám phá xem điều gì đang ngự trị ở phía bên kia."

