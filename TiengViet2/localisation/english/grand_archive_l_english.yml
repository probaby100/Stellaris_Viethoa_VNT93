 grand_archive.10080.name: "Dự Án Đột Biến Hư Không Sinh Hoàn Thành"
 grand_archive.10080.desc: "Dự án đột biến thử nghiệm của chúng ta sử dụng vật liệu di truyền của $NAME_Voidspawn$ đã hoàn tất, và mang lại một phát hiện thú vị: §H$starborne_biology$§!\n\nMô của những sinh vật này phản ứng mạnh mẽ với ánh sao, và có thể được khuyến khích phát triển trong các sinh vật khác. Điều này đòi hỏi một lượng nhỏ năng lượng để duy trì, nhưng cải thiện đáng kể tốc độ tăng trưởng của chúng ở gần các ngôi sao sáng nhất."

