 tech_hyper_drive_bio_integration: "Tích Hợp Sinh Học Động Cơ Siêu Không Gian"
 tech_hyper_drive_bio_integration_desc: "Du hành qua các siêu không gian có thể nguy hiểm đối với sinh vật không gian, nhưng chúng ta hoàn toàn có thể tăng cường năng lực sinh tồn của chúng."
 tech_hyper_drive_bio_integration_effect: "§HMở khóa Tính năng:§! Nâng cấp Động cơ Siêu Không Gian cho Dã Thú Không Gian"
