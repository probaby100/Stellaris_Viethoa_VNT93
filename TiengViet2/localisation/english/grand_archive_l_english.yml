 pc_cutholoid_desc: "$pc_asteroid_desc$"

 resolution_cutholoid_eradication: "Diệt Trừ $cutholoids$"
 resolution_cutholoid_eradication_desc: "Không nên để loài Cutholoid chuyên nuốt chửng tàu chiến tự do tồn tại trong các hệ sao văn minh. Những sinh vật này phải bị tiêu diệt bằng mọi giá."
 resolution_cutholoid_eradication_tooltip: "Bất kỳ đế chế nào có §Y$cutholoids_plural$§! bên trong biên giới của mình đều bị coi là §RVi Phạm Luật Thiên Hà§! cho đến khi các sinh vật này bị tiêu diệt."
 resolution_repeal_cutholoid_eradication: "§RBãi Bỏ $resolution_cutholoid_eradication$§!"
 resolution_repeal_cutholoid_eradication_desc: "[global_event_country.GetGalCommunityOrGalImperium] không tồn tại để bắt buộc phải tiêu diệt bừa bãi giống loài Cutholoid."
 resolution_repeal_cutholoid_eradication_effect_success: "Bãi bỏ nghị quyết §Y$resolution_cutholoid_eradication$§!."

 fcsum_cutholoids_1: "$fcsum_critters_1$"
 further_fc_cutholoids_completed: "$further_fc_amoebas_completed$"

 grand_archive.3103.name: "$resolution_cutholoid_eradication$"
 grand_archive.3103.desc: "[global_event_country.GetGalCommunityOrGalImperium] đã tuyên bố rằng loài Cutholoid không còn được phép xuất hiện trong các hệ sao của các quốc gia thành viên.\n\nMột khi bị phát hiện, những sinh vật này phải bị tiêu diệt, bằng không [Root.GetName] sẽ bị coi là §RVi Phạm Luật Thiên Hà§!."
 grand_archive.3105.name: "$cutholoids_plural$ Trong Không Phận [this.GetSpeciesName]"
 grand_archive.3105.desc: "Một con Cutholoid đã bị phát hiện trong hệ sao [from.GetName]. Sau khi chúng bị xếp vào loại loài dịch hại nguy hiểm, tất cả thành viên của [global_event_country.GetGalCommunityOrGalImperium] có nghĩa vụ pháp lý phải an tử ngay lập tức bất kỳ con Cutholoid nào hiện diện trong biên giới của họ.\n\n[Root.GetName] sẽ bị coi là §RVi Phạm Luật Thiên Hà§! cho đến khi con Cutholoid bị tiêu diệt hoặc bị xua đuổi khỏi các hệ sao của chúng ta."
 grand_archive.3107.desc: "Sự hiện diện liên tục của Cutholoid trong hệ sao [invaded_system.GetName] của chúng ta là một hành vi §RVi Phạm Luật Thiên Hà§! nghiêm trọng theo nghị quyết $resolution_cutholoid_eradication$. Điều này đã dẫn đến việc [global_event_country.GetGalCommunityOrGalImperium] cho phép các thành viên bỏ phiếu áp đặt các biện pháp trừng phạt lên [Root.GetName]."

 grand_archive.3011.name: "Tàu Khoa Học Mất Tích"
 grand_archive.3011.desc: "Mất liên lạc với Tàu Khoa Học của chúng ta khi đang điều tra một tiểu hành tinh kỳ lạ tại [cutholoid_under_radar.solar_system.GetName].\n\nChúng ta đang phát hiện thấy các tín hiệu khẩn cấp yếu ớt từ vị trí được biết cuối cùng của họ, và nên điều tra sâu hơn nếu có ý định cứu vãn con tàu mất tích."
 grand_archive.3011.a: "Thật tồi tệ."

 grand_archive.3012.name: "Phát Hiện Thực Thể Tiểu Hành Tinh"
 grand_archive.3012.desc: "Một sinh vật dạng tiểu hành tinh kỳ lạ khác đã được phát hiện tại §H[from.solar_system.GetName]§! trong quá trình thám hiểm thông thường.\n\nChúng ta nên tránh đưa §HTàu Khoa Học§! vào hệ sao này cho đến khi hiểu rõ hơn về những vật thể nguy hiểm này."
 grand_archive.3012.a: "Tiếp tục điều tra."

 grand_archive.3016.name: "Bất Ngờ Không Mấy Dễ Chịu"
 grand_archive.3016.desc.default: "Tiểu hành tinh trong [fromfrom.GetName] chỉ đóng vai trò như lớp vỏ bọc cho một sinh vật khổng lồ sống bên trong.\n\nChúng ta đã tiêu diệt thành công nó và giải cứu được tàu [this.GetName]. Cần phải cẩn trọng hơn trong các cuộc điều tra tiểu hành tinh tiếp theo.\n\nCó thể vẫn còn nhiều sinh vật dạng này ngoài kia, đang rình rập những con mồi bất cẩn."
 grand_archive.3016.desc.leader_killed: "$grand_archive.3016.desc.default$ Đáng tiếc thay, [leader.GetName] đã phải chịu một số thương tổn không thể phục hồi."

 grand_archive.3018.name: "Thoát Khỏi Bụng Quái Thú"
 grand_archive.3018.desc: "Tàu Khoa Học của chúng ta bị mất tích trong §H[current_system.GetName]§! đã trở về!\n\nCác báo cáo gửi về từ §H[leader.GetName]§! cho biết họ đã bị một thực thể không gian ẩn nấp bên trong tiểu hành tinh nuốt trọn cả tàu, và đã chạm đến giới hạn chịu đựng của thân tàu trước khi bất ngờ bị nôn ngược ra ngoài đến nơi an toàn. Có vẻ như điều gì đó đã làm sinh vật này giật mình trước khi chúng ta kịp can thiệp.\n\nChúng ta nên thận trọng khi tiếp cận một số vành đai tiểu hành tinh nhất định cho đến khi có thể tìm hiểu thêm."
 grand_archive.3018.a: "Thật may mắn làm sao."

 grand_archive.3020.name: "Mất Tàu Khoa Học"
 grand_archive.3020.desc: "Các tín hiệu khẩn cấp từ [from.GetName] đã chấm dứt hoàn toàn. Chúng ta chỉ có thể kết luận rằng tàu khoa học [from.GetName] đã vĩnh viễn mất tích."

 alert_mia_fleet_eaten_title: "$alert_mia_title$"
 alert_mia_fleet_eaten_instant: "Mất liên lạc với Tàu Khoa Học của chúng ta khi đang điều tra một tiểu hành tinh. Chúng ta đang phát hiện thấy các tín hiệu khẩn cấp yếu ớt từ vị trí cuối cùng được biết đến của họ."

 cutholoid_discovered_chain_title: "Giải Cứu [this.GetName]"
 cutholoid_discovered_chain_desc: "Chúng ta đã mất liên lạc với tàu khoa học [this.GetName] tại [cutholoid_under_radar.solar_system.GetName].\n\nTín hiệu truyền cuối cùng của họ cho thấy họ đang bắt đầu khảo sát một tiểu hành tinh gần đó, [cutholoid_under_radar.GetName].\n\nKhuyến cáo nên thận trọng khi tái thâm nhập vào hệ sao này."

 HIDDEN_CUTHOLOID_ATTACK_PROJECT: "Tiêu Diệt Tiểu Hành Tinh"
 HIDDEN_CUTHOLOID_ATTACK_PROJECT_DESC: "Tiểu hành tinh [cutholoid_under_radar.GetName] không đơn giản như vẻ bề ngoài. Chúng ta nên tiếp cận bằng một lực lượng quân sự quy mô đáng kể và cố gắng giải cứu tàu khoa học [this.GetName] của mình trước khi nó biến mất vĩnh viễn."
 HIDDEN_CUTHOLOID_ATTACK_PROJECT_REQUIREMENT: "Có $COUNT$/$REQUIRED$ hạm đội với ít nhất 600 sức mạnh hạm đội trên quỹ đạo."
 HIDDEN_CUTHOLOID_CAPTURE_PROJECT: "Bắt Giữ Tiểu Hành Tinh"
 HIDDEN_CUTHOLOID_CAPTURE_PROJECT_DESC: "Tiểu hành tinh [cutholoid_under_radar.GetName] không đơn giản như vẻ ngoài. Với công nghệ phù hợp, chúng ta có thể bắt giữ toàn bộ nó và dễ dàng giải cứu tàu khoa học [this.GetName] của mình trước khi nó biến mất vĩnh viễn."

 grand_archive.2800.name: "Tiểu Hành Tinh Giả Mạo"
 grand_archive.2800.desc: "Tiểu hành tinh bất thường mà chúng ta chạm trán trong §H[This.System.GetName]§! dường như có tri giác bẩm sinh. Tiếp cận quỹ đạo của những vật thể như vậy là cực kỳ nguy hiểm, và các Tàu Khoa Học được khuyến cáo nên rời khỏi các hệ sao bị ảnh hưởng ngay lập tức cho đến khi chúng ta biết thêm về các thực thể này."
 grand_archive.2800.a: "Tiếp tục điều tra."

 grand_archive.2900.name: "Cutholoid"
 grand_archive.2900.desc: "Chúng ta đã phát hiện một sinh vật không gian trú ẩn bên trong các tiểu hành tinh. Được chúng ta gọi là \"§HCutholoid§!\", những sinh vật này là những kẻ săn mồi phục kích có khả năng nằm chờ suốt nhiều năm để tóm gọn con mồi. Có khả năng nuốt chửng toàn bộ con tàu, chúng ta nên hết sức cẩn thận khi tiếp cận các vành đai tiểu hành tinh chưa khảo sát vì chúng được phát hiện là cực kỳ nguy hiểm.\n\nTin tốt là chúng có vẻ khá hiếm, và các quá trình sinh sản vô tính của chúng có thể mất hàng trăm năm."
 grand_archive.2900.a: "Chúng ta nên nghiên cứu sâu hơn về những sinh vật này."
 grand_archive.2900.b: "Những kẻ săn mồi phục kích. Hãy tiêu diệt tất cả chúng."
 grand_archive.2900.b.homicidal: "Kẻ đi săn trở thành con mồi."

 grand_archive.2905.name: "Vỏ Bọc Cutholoid"
 grand_archive.2905.desc: "Lớp vỏ ngoài của một con Cutholoid không chỉ gồm khoáng chất đơn thuần mà còn được gia cố bằng các sợi sinh học bền chắc. Những sợi này không bao giờ ngừng phát triển, và thành phần của một số vỏ được ước tính chứa hơn năm mươi phần trăm là sinh khối.\n\nKhi một con Cutholoid phát triển quá lớn so với tiểu hành tinh của nó, nó sẽ tìm kiếm một ngôi nhà khác và bắt đầu lại quá trình tích hợp. Mặc dù chúng thường có tính lãnh thổ rất cao, nhưng nhiều con Cutholoid đã được quan sát thấy trên quỹ đạo của một ứng viên vỏ bọc hoàn hảo. Con lớn nhất trong số các sinh vật sẽ chiếm giữ tiểu hành tinh mới, trong khi những con khác sẽ sắp xếp theo kích cỡ và đổi vỏ trong hòa bình với con tiếp theo theo thứ tự. Bằng cách này, các tiểu hành tinh mà chúng cư ngụ thường đã từng được hàng chục sinh vật trước đó chiếm đóng.\n\nKết quả cuối cùng là các tiểu hành tinh nhỏ nhất lại có mức độ gia cố sinh học cao nhất, vì chúng được trao đổi thường xuyên nhất. Những mẫu này chứa giá trị khoa học đáng kể."
 grand_archive.2905.a: "Tăng cường cho động vật không gian của chúng ta."
 grand_archive.2905.b: "Nâng cấp các chiến hạm của chúng ta."

 cutholoids_hunting_buff: "Thợ Săn Cutholoid"
 cutholoids_hunting_buff_desc: "Lớp vỏ giàu khoáng chất của Cutholoid được trục vớt sau trận chiến, mang lại §G$@cutholoids_hunting_buff_mineral_reward|0$§! £minerals£ cho mỗi hạm đội bị tiêu diệt."
 grand_archive.2900.b.cutholoidhunt: "§G+$@cutholoids_hunting_buff_mineral_reward|0$§! £minerals£ cho mỗi hạm đội Cutholoid bị tiêu diệt"

 mod_damage_vs_country_type_cutholoids_mult: "Sát Thương Lên Cutholoid"
 RESEARCH_CUTHOLOIDS_PROJECT: "Nghiên Cứu Cutholoid"
 RESEARCH_CUTHOLOIDS_PROJECT_DESC: "Cấu trúc vỏ tiểu hành tinh của Cutholoid là một kiệt tác kỹ thuật sinh học ấn tượng. Còn rất nhiều điều để chúng ta học hỏi từ chúng."

 cutholoid_debris_01_object: "Tàn Tích Cutholoid"
 CUTHOLOID_DEBRIS_PROJECT: "$cutholoid_debris_01_object$"
 CUTHOLOID_DEBRIS_PROJECT_DESC: "Chúng ta đã tiêu diệt một sinh vật khổng lồ ẩn nấp bên trong một tiểu hành tinh. Thu hoạch tàn tích của nó có thể mang lại giá trị to lớn cho chúng ta."

 cutholoids_section: "Cutholoid"

 ENGULF_COMPONENT: "Khẩu Pháo Nuốt Tàu"
 ENGULF_COMPONENT_EFFECT_DESC: "$ENGULF_COMPONENT_EFFECT_DESC_WILD$ §YNó sẽ bị nuốt chửng hoặc bị trưng dụng bởi chủ nhân của sinh vật.§!"
 ENGULF_COMPONENT_EFFECT_DESC_WILD: "§YSinh vật này có thể nuốt chửng một mục tiêu nhỏ hơn con Cutholoid này.§!"
 CUTHOLOID_PREYING_MAW: "Khẩu Pháo Nuốt Tàu"
 CUTHOLOID_PREYING_MAW_DESC: "Định kỳ nuốt chửng các tàu chiến cỡ nhỏ của địch."
 METEOROID_SLINGER_1: "Súng Phóng Thiên Thể Cỡ Vừa"
 METEOROID_SLINGER_1_DESC: "Phóng một thiên thạch nặng về phía mục tiêu, có thể gây sát thương động năng đáng kể khi va chạm."
 METEOROID_SLINGER_2: "Súng Phóng Thiên Thể Cỡ Lớn"
 METEOROID_SLINGER_2_DESC: "$METEOROID_SLINGER_1_DESC$"
 MEDIUM_PREYING_MAW: "Khẩu Pháo Nuốt Tàu Cỡ Vừa"
 MEDIUM_PREYING_MAW_DESC: "Định kỳ nuốt chửng các tàu chiến cỡ vừa của đối phương."
 LARGE_PREYING_MAW: "Khẩu Pháo Nuốt Tàu Cỡ Lớn"
 LARGE_PREYING_MAW_DESC: "Định kỳ nuốt chửng các tàu chiến cỡ lớn của đối phương."
 HUGE_PREYING_MAW: "Khẩu Pháo Nuốt Tàu Cực Đại"
 HUGE_PREYING_MAW_DESC: "Định kỳ nuốt chửng các tàu chiến cực lớn của đối phương."

 HUNT_CUTHOLOID_ATTACK_PROJECT: "Tiêu Diệt Cutholoid Trong Hệ Sao [solar_system.GetName]"
 HUNT_CUTHOLOID_ATTACK_PROJECT_DESC: "Tiêu diệt con Cutholoid này sẽ ngăn không cho nó tiếp tục phục kích các phi thuyền qua lại của chúng ta."
 HUNT_CUTHOLOID_CAPTURE_PROJECT: "Bắt Giữ Cutholoid Trong Hệ Sao [solar_system.GetName]"
 HUNT_CUTHOLOID_CAPTURE_PROJECT_DESC: "Con Cutholoid đang nằm chờ phục kích một phi thuyền để tấn công. Đây là cơ hội hoàn hảo để bắt giữ sinh vật này nhằm phục vụ nghiên cứu sâu hơn."

 leader_trait_cutholoid_victim: "Nạn Nhân Của Cutholoid"
 leader_trait_cutholoid_victim_desc: "Vị lãnh đạo này từng bị mắc kẹt một thời gian trong hệ tiêu hóa của một con Cutholoid không gian. Dù cơ thể không còn nguyên vẹn, họ đã thu được những hiểu biết sâu sắc độc đáo về Sinh Học Phân Tử."

