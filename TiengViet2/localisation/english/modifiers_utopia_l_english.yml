 faith_in_science:0 "Niềm Tin Vào Khoa Học"
 faith_in_science_desc:0 "Sự hiện diện của một Tàu Khoa Học đang tích cực hỗ trợ nghiên cứu đã nâng cao tinh thần của các công dân trên hành tinh này."
 colonization_fever:0 "Cơn Sốt Khai Hoang Thuộc Địa"
 ms_build_speed_mult:0 "Điều Kiện Thuận Lợi"
 lower_build_speed_mult:0 "Xây Dựng Bị Trì Hoãn"
 ring_world_halted:0 "Xây Dựng Bị Đình Trệ"
 unity_reduction_diplomatic_18:0 "Bản Sắc Văn Hóa Bị Tổn Thương"
 unity_reduction_diplomatic_18_desc:0 "Bản sắc văn hóa của người dân đã bị tổn thương khi một số truyền thuyết trân quý nhất của họ bị vạch trần là sai sự thật."
 unity_reduction_akx_9541:0 "Thế Giới Chờ Đợi Bị Thanh Trừng"
 unity_reduction_akx_9541_desc:0 "Công dân đã mất niềm tin vào các nhà lãnh đạo của họ, và giờ đây sống trong nỗi sợ hãi rằng số phận tương tự có thể giáng xuống đầu họ."
 unity_reduction_observation_47:0 "Con Tin Bị Xử Tử"
 unity_reduction_observation_47_desc:0 "Việc một quốc gia xử tử công khai một vài nhà khoa học của chúng ta đã làm rúng động các công dân của chúng ta."
 unity_reduction_crisis_2204:0 "Đánh Bom Người Tổng Hợp"
 unity_reduction_crisis_2204_desc:0 "Người dân chúng ta đang dần mất niềm tin vào khả năng bảo vệ họ của chính phủ."
 opinion_dysonsphere_terms_denied:0 "Kẻ Lang Bạt Mù Lòa"
 opinion_dysonsphere_terms_denied_desc:0 "Chúng ta đã phá hỏng chòm sao của họ."
 opinion_dysonsphere_apology_rejected:0 "Lời Xin Lỗi Bị Bác Bỏ"
 opinion_dysonsphere_apology_rejected_desc:0 "Chúng ta đã bác bỏ lời xin lỗi của họ."
 unity_reduction_utopia_30:0 "Làm Ngơ Nhắm Mắt"
 unity_reduction_utopia_30_desc:0 "Các công dân thất vọng vì chúng ta đã làm ngơ khi một đế chế khác làm mù chòm sao Kẻ Lang Bạt Từng Có Một Mắt."
 unity_increase_utopia_30:0 "Làm Vừa Lòng Dân Chúng"
 unity_increase_utopia_30_desc:0 "Chúng ta đã bảo vệ quyền lợi của nhân dân và đòi bồi thường thỏa đáng cho thiệt hại gây ra đối với chòm sao Kẻ Lang Bạt Một Mắt."
 opinion_dysonsphere_insult:0 "Lời Mỉa Mai Cay Độc"
 opinion_dysonsphere_insult_desc:0 "Họ đã xúc phạm vóc dáng thể chất của chúng ta."
 energy_utopia_57:0 "Suối Nguồn Của Vàng"
 energy_utopia_57_desc:0 "Loại kem chống lão hóa kỳ diệu mới của chúng ta đang rất đắt hàng."
 research_utopia_60:0 "Ngân Hàng Thần Kinh"
 research_utopia_60_desc:0 "Phát minh ra ngân hàng thần kinh đã cho phép chúng ta tăng tốc độ nghiên cứu kỹ thuật."
 adding_unrest_slaves:0 "Nô Lệ Đang Cực Đoan Hóa"
 adding_unrest_slaves_desc:0 "Các phần tử nô lệ cực đoan đang tập hợp, gieo rắc sự bất ổn."
 withdrawal_symptoms:0 "Hội Chứng Cai Thuốc"
 withdrawal_symptoms_desc:0 "Việc thoát khỏi §YCực Lạc Hóa Học§! cùng thế giới êm ái, tách biệt của sự thỏa mãn tức thời thường rất đau đớn, nhưng nỗi đau rồi sẽ qua đi. Chính những vết sẹo sâu sắc hơn - khi nhận ra rằng những hoạt ảnh đầy màu sắc yêu thích của mình không có thật - mới là thứ có thể không bao giờ lành."
 slave_riots:0 "Bạo Động Nô Lệ"
 slave_riots_desc:0 "Các cuộc bạo động nô lệ kìm hãm sự gia tăng dân số."
 slave_hunger_strike:0 "Tuyệt Thực"
 slave_hunger_strike_desc:0 "Thật khó làm việc khi bạn đang quằn quại vì những cơn đau thắt do đói."
 revolt_suppressed:0 "Khởi Nghĩa Nô Lệ Bị Trấn Áp"
 slaves_defected:0 "Cuối Cùng Đã Tự Do"
 slaves_defected_desc:0 "Những người cựu nô lệ rất vui mừng khi được trở thành một phần của đất nước chúng ta."
 revolt_suppressed_desc:0 "Bọn nô lệ sẽ không dám sớm tập hợp lại lực lượng."
 free_at_last:0 "Cuối Cùng Đã Tự Do"
 free_at_last_desc:0 "Những người cựu nô lệ cuối cùng đã thoát khỏi những kẻ áp bức họ."
 insurgents_free:0 "$free_at_last$"
 insurgents_free_desc:0 "Cuối cùng quân nổi dậy đã thoát khỏi sự bạo ngược của thế lực chiếm đóng."
 revolt_suppressed_2:0 "Khởi Nghĩa Bị Trấn Áp"
 revolt_suppressed_2_desc:0 "Quân nổi dậy sẽ không dám sớm tập hợp lại lực lượng."
 ageless:0 "Trường Thọ Vô Biên"
 ageless_desc:0 "Lão hóa ít hơn cùng Ageless..."
 pop_disappearances:0 "Không Ai Được An Toàn"
 pop_disappearances_desc:0 "Một làn sóng mất tích bí ẩn đang gây ra tình trạng bất ổn trên toàn hành tinh."
 opinion_stole_our_glands:0 "Kẻ Trộm Tuyến Sinh Học"
 opinion_stole_our_glands_desc:0 "Chúng đã đánh cắp các tuyến sinh học của chúng ta."
