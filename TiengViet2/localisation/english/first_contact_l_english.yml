 #Events

 fircon.5000.name:0 "Quỹ đạo Khuyết thiếu"
 fircon.5000.desc.base:0 "§Y[From.GetName]§! có vẻ đã bị thiếu mất vài hành tinh.\n\nMọi tính toán đều chỉ ra rằng đáng lẽ phải có thêm vài thiên thể nữa tồn tại, nhưng chúng ta lại chẳng thể tìm thấy bất kỳ dấu vết nào của chúng trong hệ sao này. Các cảm biến đã được hiệu chuẩn lại, những con số cũng đã được kiểm tra kỹ lưỡng, thế nhưng kết luận rút ra lại bị thực tế phủ nhận hoàn toàn. Chúng ta đã đánh dấu vị trí của những tiểu hành tinh bị mất tích này trên bản đồ sao của mình."
 fircon.5000.desc:0 "$fircon.5000.desc.base$\n\nCó lẽ việc quét hệ sao này ở khoảng cách gần hơn sẽ thu thập thêm được nhiều thông tin."

 fircon.5005.desc.open:0 "$fircon.5000.desc.base$\n\nChúng ta tin rằng những [owner.GetPreFTLLowerPlural] ở hệ sao Dacha lân cận có dính líu đến tình trạng này."
 fircon.5005.desc.closed:0 "$fircon.5000.desc.base$\n\nCó vẻ như chính những [owner.GetPreFTLLowerPlural] ở hệ sao Dacha láng giềng trong quá khứ đã tạo nên hệ sao kỳ lạ này. Tuy nhiên, tuyến siêu không gian dẫn đến đó đã biến mất."

 fircon.5010.name:0 "Đại Đạo Hành tinh"
 fircon.5010.desc:0 "Những hành tinh đó đã bị dời đi!\n\nNhững tuyến siêu không gian dị thường mà chúng ta phát hiện trong hệ sao §Y[from.solar_system.GetName]§! đều kết nối với những vị trí mà chúng ta cho rằng đáng lẽ phải có hành tinh. Sau khi nghiên cứu kỹ các tuyến đường kỳ quái này, chúng ta nhận thấy tất cả chúng đều dẫn đến cùng một nơi. Một hệ sao tên là §YDacha§!, nơi vốn dĩ được cho là không thể tiếp cận, nhưng nếu chúng ta gộp những tuyến siêu không gian nhỏ hẹp này lại, chúng ta có thể đưa một tàu nghiên cứu đến đó."
 fircon.5010.a:0 "Hãy tìm xem tuyến siêu không gian này dẫn tới đâu!"
 fircon.5010.b:0 "Chúng ta thực sự muốn tìm hiểu rõ chuyện này sao?"

 fircon.5015.name:0 "Những vì sao Trù phú"
 fircon.5015.desc:0 "Mỗi hành tinh quay quanh ba ngôi sao trong hệ sao §Y[From.GetName]§! đều là một thiên đường sinh thái - tức là Hành tinh Gaia, và mỗi hành tinh đều có khả năng nuôi dưỡng sự sống hữu cơ. Do những hành tinh này hoàn toàn không có dấu hiệu ô nhiễm, ban đầu chúng ta cho rằng chúng có thể không có người ở. Tuy nhiên, sau khi tiến hành quét sâu hơn, chúng ta đã phát hiện ra những siêu đô thị khổng lồ trải dài khắp mỗi hành tinh.\n\nKỳ lạ hơn nữa, có vẻ như chỉ những hành tinh quay quanh ngôi sao trung tâm mới thực sự thuộc về hệ sao này. Những ngôi sao khác lại được bao quanh bởi các hành tinh đến từ $NAME_Helito$ và các hệ sao xa xôi hơn nữa."
 fircon.5015.a:0 "Chuyện này... sao có thể chứ?!"
 fircon.5015.b:0 "Thật là đẹp!"
 fircon.5015.c.exterminator:0 "Phát hiện mật độ sự sống hữu cơ cực cao."
 fircon.5015.c.swarm:0 "Có thể đánh chén một bữa no nê rồi!"
 fircon.5015.c.purifier:0 "Có [Owner.GetSpeciesNamePlural], những hành tinh đó sẽ trở nên tốt đẹp hơn."

 fircon.5020.name:0 "Chạm trán Quốc gia Hành tinh Thống nhất Habinte"
 fircon.5020.desc:0 "Khảo sát một Hành tinh Gaia mới thường là một sự kiện trọng đại, nhưng nó sẽ sớm trở thành công việc quen thuộc hằng ngày của phi hành đoàn [Root.GetName] trong nhiều tháng tới. Những hành tinh này là nơi sinh sống của các [Owner.GetPreFTLLowerPlural] cực kỳ kỳ lạ. Rõ ràng là họ chưa đạt đến khả năng du hành vũ trụ, nhưng năng lực sản xuất năng lượng tái tạo của họ lại có thể sánh ngang với những lò phản ứng hiệu quả nhất của chúng ta.\n\nĐiều kỳ lạ hơn nữa chính là sự phân bổ tài nguyên đồng đều. Mỗi hành tinh đều sở hữu mọi thứ cần thiết cho sự sinh tồn, một điều đáng lẽ ra là không thể. Chúng ta quan sát thấy hàng hóa chỉ được sản xuất ở một hành tinh lại cập bến tại một hành tinh khác, trong khi chẳng có bóng dáng của bất kỳ chiếc tàu vận tải nào cất cánh."
 fircon.5020.a:0 "Chúng ta phải nhanh chóng thiết lập một tiền trạm quan sát!"

 fircon.5026.name:0 "Cây cầu Nối liền các Hành tinh"
 fircon.5026.desc:0 "Xét ở một góc độ nào đó, các [GetPreFTLLowerPlural] tại §Y[From.solar_system.GetName]§! còn giỏi ứng dụng lý thuyết siêu không gian hơn cả chúng ta. Mỗi hành tinh của họ đều được kết nối với nhau thông qua một mạng lưới đường siêu không gian nhân tạo. Những tuyến đường này được sử dụng để vận chuyển các nguồn tài nguyên thiết yếu như lương thực hoặc vật liệu xây dựng đến các hành tinh khác, và chúng ta hoàn toàn không biết họ đã làm điều đó bằng cách nào.\n\nYêu cầu huy động thêm nhiều [Root.GetScientistPlural] để nghiên cứu những hành tinh này đã được phê duyệt. Dù dựa vào những hoạt động từ trạm kiểm thính hành tinh của họ, thì có vẻ như họ cũng đang theo dõi chúng ta."

 fircon.5036.name:0 "Cơn thịnh nộ của Chủng tộc Ôn hòa"
 fircon.5036.desc:0 "Chúng tôi cứ ngỡ rằng những kẻ có khả năng băng qua các vì sao sẽ không dùng đến bạo lực một cách nguyên thủy như vậy.\n\n§RXin hãy rời đi.§!"
 fircon.5036.a:0 "Ờ..."
 fircon.5036.tt:0 "§RTất cả hạm đội của chúng ta trong hệ sao §Y[From.solar_system.GetName]§! đều đã mất tích trong lúc làm nhiệm vụ.\nTất cả các tuyến đường siêu không gian dẫn đến hệ sao §Y[From.solar_system.GetName]§! đều trở nên cực kỳ bất ổn.§!"

 fircon.5040.name:0 "Ngoại giao Vô ích"
 fircon.5040.desc:0 "Chúng tôi đã thấu rõ bộ mặt thật của toàn cõi ngân hà, và đã chọn cách lùi về ở ẩn. Thế nhưng chúng tôi vẫn phải chịu đựng sự quấy nhiễu. Các người thực sự muốn nhìn ngắm kho báu của chúng tôi đến vậy sao? Vậy thì hãy để chúng tôi cho các người mở rộng tầm mắt."
 fircon.5040.a.tt:0 "§RMỗi hệ sao cạnh hệ sao §Y[From.GetName]§! đều đã được kết nối bằng những tuyến đường siêu không gian mới.§!"

 fircon.5050.name:0 "Một Lời thỉnh cầu Lịch sự"
 fircon.5050.desc:0 "Nỗ lực hợp tác với [event_target:solarpunk_country.GetSpeciesAdj] nhằm nắm bắt kiến thức về công nghệ siêu không gian đang tiến triển với một tốc độ chậm chạp đến mức nản lòng. Nếu muốn làm chủ mạng lưới đường siêu không gian cục bộ như họ, có lẽ chúng ta sẽ phải tiêu tốn hàng thiên niên kỷ chỉ để lập danh mục các đợt dao động siêu không gian. Chúng ta vừa nhận được thông điệp mới từ trưởng phái đoàn đại diện của họ.\n\n\"Nói thật là, việc các vị có mặt ở đây ngày càng khiến chúng tôi cảm thấy không thoải mái. Vì chúng tôi đã giúp các vị hoàn thành mục đích khi đến đây, chúng tôi buộc phải yêu cầu các vị rời đi. Theo đánh giá của chúng tôi, lối sống của hai bên là không thể dung hòa, và chúng tôi lo sợ rằng trong tương lai các vị sẽ thèm khát những gì chúng tôi đang có. Để tránh bị coi là quá thô lỗ, chúng tôi sẵn sàng tặng cho các vị một hành tinh. Chúng tôi sẽ chịu trách nhiệm vận chuyển, đừng lo lắng.\""
 fircon.5050.a:0 "Chúng tôi chấp nhận, chúc các vị một ngày vui vẻ."
 fircon.5050.a.tt:0 "§YMặt trời X§! sẽ được thêm vào trong quỹ đạo của §Y[capital_star.GetName]§!."
 fircon.5050.c:0 "Chúng ta sẽ tước đoạt bí mật của các người!"
 fircon.5050.c.tt:0 "§RXâm lược những người ngoài hành tinh này để nắm giữ bí mật về các đường siêu không gian.§!"
 #Anomalies

 SOLARPUNK_CAT:0 "Hành tinh Mất tích"
 SOLARPUNK_CAT_DESC:0 "Hệ sao này tồn tại một mạng lưới đường siêu không gian dày đặc. Thông thường, chúng ta sẽ nghĩ rằng chúng quá chật hẹp để phi thuyền có thể lưu thông, nhưng bản thân số lượng của chúng đã là một điều vô cùng đáng kinh ngạc."

