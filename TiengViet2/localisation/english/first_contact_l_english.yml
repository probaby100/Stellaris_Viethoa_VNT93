 payback_revenge_words:0 "Cuộc Đấu Tay Đôi Công Bằng"
 payback_revenge_words_desc:0 "Dù là đế chế hùng mạnh đến đâu cũng phải quỳ gối phục tùng trước sự uy nghiêm của công lý."
 payback_no_revenge:0 "Thoát Khỏi Xiềng Xích"
 payback_no_revenge_desc:0 "Chúng ta phải cho hòa bình một cơ hội để có thể lan rộng và phát triển."
 payback_no_revenge_small:0 "$payback_no_revenge$"
 payback_no_revenge_small_desc:0 "$payback_no_revenge_desc$"
 payback_underdog:0 "Con Thú Bị Dồn Vào Bước Đường Cùng"
 payback_underdog_desc:0 "Các cường quốc cắn chúng ta một cái, chúng ta sẽ cắn lại chúng một cách đau đớn."
 payback_underdog_tooltip:1 "Sát thương gây ra cho phe Khủng Hoảng Hậu Kỳ: §G+20%§!"
 payback_underdog_khan:0 "$payback_underdog$"
 payback_underdog_khan_desc:0 "$payback_underdog_desc$"
 payback_student:0 "Nhà Giáo Dục Được Chứng Nhận"
 payback_student_desc:0 "Một học sinh của ngày xưa, nay đã trở thành một bậc thầy."
 payback_student_tooltip:1 "Hiệu quả của việc khai sáng công nghệ tăng §G25%§!."

 # Casus Belli/war goal
 casus_belli_cb_payback:0 "Trả Thù"
 casus_belli_cb_payback_acquire_hint:0 "\n§EKhi mục tiêu trả thù không còn là tông chủ quốc của chúng ta nữa, §HLý do Tuyên chiến§! §Y$casus_belli_cb_payback$§! sẽ khả dụng§!"

 war_goal_wg_payback_wipe_them_out:0 "Tiêu Diệt Mối Đe Dọa"
 war_goal_wg_payback_wipe_them_out_desc:0 "Phát động chiến tranh, nhằm chấm dứt hoàn toàn các thế lực đang đe dọa đến đế chế của chúng ta.\n\n§RCuộc chiến tranh này sẽ không có chuyện hòa bình dựa trên việc duy trì tình trạng hiện tại: Chúng ta hoặc là chiến thắng, hoặc là khuất phục.§!"

 war_goal_wg_payback_force_ideology:0 "Xuất Khẩu Hệ Tư Tưởng"
 war_goal_wg_payback_force_ideology_desc:0 "Phát động chiến tranh, nhằm mục đích áp đặt thể chế chính trị và hệ tư tưởng của kẻ tấn công lên kẻ thù.\n\n§RCuộc chiến tranh này sẽ không có chuyện hòa bình dựa trên việc duy trì tình trạng hiện tại: Chúng ta hoặc là chiến thắng, hoặc là khuất phục.§!"

 war_goal_wg_payback_megacorp_subjugate:0 "Sáp Nhập Thành Công Ty Con"
 war_goal_wg_payback_megacorp_subjugate_desc:0 "Phát động chiến tranh, nhằm ép buộc kẻ thù phải trở thành công ty con của chúng ta.\n\n§RCuộc chiến tranh này sẽ không có chuyện hòa bình dựa trên việc duy trì tình trạng hiện tại: Chúng ta hoặc là chiến thắng, hoặc là sẽ vĩnh viễn đánh mất cơ hội này.§!"

 war_goal_wg_payback_tribute:0 "Yêu Cầu Triều Cống"
 war_goal_wg_payback_tribute_desc:0 "Phát động chiến tranh, nhằm ép buộc kẻ thù phải trở thành một quốc gia triều cống.\n\n§RCuộc chiến tranh này sẽ không có chuyện hòa bình dựa trên việc duy trì tình trạng hiện tại: Chúng ta hoặc là chiến thắng, hoặc là sẽ đánh mất cơ hội.§!"

 war_goal_wg_payback_msi:0 "Tịch Thu Tài Sản"
 war_goal_wg_payback_msi_desc:0 "Phát động chiến tranh, nhằm ép buộc kẻ thù phải trở thành công ty con của chúng ta.\n\nCác điều khoản thỏa thuận ban đầu của công ty con này sẽ được quyết định bởi chính sách §Y$policy_subjugation_war_terms$§! của chúng ta.\n\n§RCuộc chiến tranh này sẽ không có chuyện hòa bình dựa trên việc duy trì tình trạng hiện tại: Chúng ta hoặc là chiến thắng, hoặc là sẽ vĩnh viễn đánh mất cơ hội này.§!"

 casus_belli_cb_payback_punishment:0 "$casus_belli_cb_fe_punishment$"
 war_goal_wg_payback_stop_atrocities:0 "$war_goal_wg_fe_stop_atrocities$"
 war_goal_wg_payback_stop_atrocities_desc:0 "$war_goal_wg_fe_stop_atrocities_desc$"
 wg_payback_stop_atrocities_accept:0 "Chính sách của §Y[From.GetName]§! đã bị bắt buộc phải thay đổi thành:\n- Cấm Chế độ Nô lệ\n- Cấm Thanh trừng\n- Sự can thiệp đối với người dân bản địa được thiết lập thành Cấm Can thiệp"

 # Starting event
 origin.4010.name:0 "Tờ Hóa Đơn"
 origin.4010.desc:1 "Một thiết bị lưu trữ tài liệu tự hành cỡ nhỏ vừa mới tiến vào rìa hệ sao mẹ của chúng ta, và sử dụng một ngọn hải đăng tín hiệu để lớn tiếng thông báo về sự xuất hiện của nó. Ngay khi được lấy ra, tài liệu này đã hiển thị một thông tin vô cùng rùng rợn: một danh sách dài, trong đó liệt kê chi tiết toàn bộ các tài sản quân sự mà chúng ta đã phá hủy trong cuộc chiến chống lại quân xâm lược, bao gồm cả số lượng thủy thủ đoàn thương vong, cũng như giá trị ước tính của từng chiếc phi thuyền bị phá hủy.\n\nNhững kẻ xâm lược chúng ta trước đây đã chính thức đưa ra yêu cầu đòi bồi thường chiến tranh. Trớ trêu hơn nữa là, bọn chúng còn tuyên bố rằng, tất cả những chiếc phi thuyền bị phá hủy trong hệ sao của chúng ta vẫn là tài sản của chúng, và bất kỳ nỗ lực nào nhằm phá hủy, cải tạo hoặc tiến hành dịch ngược đối với các mảnh vỡ đều sẽ bị coi là hành vi vi phạm các điều khoản.\n\nMột cơ quan thu hồi nợ sẽ sớm liên hệ với chúng ta để giải quyết vấn đề này."
 origin.4010.a:0 "Thật lố bịch!"
 origin.4010.a.tooltip:0 "Người thu hồi nợ sẽ đến thăm chúng ta trong §Y[root.payback_debt_collectors_timer]§!."

 # Hub - first encounter
 origin.4015.name:0 "Người Thu Hồi Nợ"
 origin.4015.desc:0 "Gửi [owner.GetName] thân mến,\n\nChúng tôi đại diện cho §H$NAME_MSI_country$§! liên hệ với bạn về vấn đề các khoản nợ chưa được thanh toán. Xét thấy các bạn cũng là một trong những xã hội du hành vũ trụ mới nổi, chúng tôi hiểu rằng có lẽ bạn không có khả năng chi trả toàn bộ số tiền nợ. Mục đích của chúng tôi là giúp bạn lựa chọn một kế hoạch trả nợ phù hợp, để có thể thanh toán tất cả các khoản nợ còn tồn đọng mà không làm cản trở đến sự phát triển kinh tế của bạn.\n\nTheo đó, chúng tôi rất sẵn lòng cung cấp cho bạn một chuyên gia tư vấn, hoàn toàn miễn phí! Chúng tôi thiết tha hy vọng rằng vấn đề này sẽ được giải quyết một cách êm đẹp."
 origin.4015.a:0 "Chúng tôi rất sẵn lòng đàm phán để giải quyết vấn đề."
 origin.4015.b:0 "Chúng tôi từ chối thanh toán."
 origin.4015.c:0 "Các người là ai?"
 origin.4015.c.response:0 "Ngay từ trước khi chủng tộc của chúng tôi lần đầu tiên vươn tới các vì sao, chúng tôi đã biết rằng mỗi người trong vũ trụ này đều có một vai trò riêng để đảm nhận. Có những nền văn hóa khao khát sức mạnh. Và cũng có những nền văn hóa theo đuổi tri thức. Còn chúng tôi thì tiến hóa để mang đến những dịch vụ đầy ân tình.\n\nNếu một người chưa từng cảm nhận được niềm vui từ sự cống hiến quên mình, thì người đó đã bỏ lỡ mục đích chính của cuộc sống. Cúi gập người không phải là tự hạ thấp bản thân, mà là đang nâng tầm những người xung quanh."

 # We are willing to settle
 origin.4016.name:0 "Các Điều Khoản Trả Nợ"
 origin.4016.desc:0 "Dựa trên bản định giá mà chúng tôi đã nộp trước đó, tổng số tiền mà bạn còn nợ chúng tôi tương đương với §Y£energy£ [owner.debt_collectors_amount] Năng lượng§!. Chúng tôi rất sẵn lòng cung cấp cho bạn hàng loạt các kế hoạch trả nợ khác nhau."
 origin.4016.a:0 "Thanh toán toàn bộ."
 origin.4016.a.response:0 "Thái độ tích cực muốn thanh toán dứt điểm khoản nợ trong một lần của bạn khiến chúng tôi vô cùng cảm động, nhưng sau khi kiểm tra cẩn thận, số Năng lượng mà bạn cung cấp dường như không phải tất cả đều là hàng thật. Chắc hẳn, đây chỉ đơn thuần là một sự hiểu lầm mà thôi! Chúng ta hãy cứ vờ như chưa từng có chuyện gì xảy ra nhé." # Just a cheeky joke in case players use console commands to obtain the full sum
 origin.4016.b:1 "Thanh toán §R5000§!£energy£§H$energy$§! mỗi 15 năm."
 origin.4016.b.tooltip:1 "Cam kết sẽ giao nộp §R5000§! £energy£ §H$energy$§! vào lần tới khi người thu hồi nợ quay lại."
 origin.4016.c:1 "Thanh toán §R2500§! $r_consumer_goods$ mỗi 15 năm."
 origin.4016.c.tooltip:1 "Cam kết sẽ giao nộp §R2500§!$r_consumer_goods$ vào lần tới khi người thu hồi nợ quay lại."
 origin.4016.d:0 "Chúng tôi còn có thể cung cấp cho bạn những gì?"
 origin.4016.e:1 "Thanh toán §R1250§!£alloys£§H$alloys$§! mỗi 15 năm."
 origin.4016.e.tooltip:1 "Cam kết sẽ giao nộp §R1250§!£alloys£§H$alloys$§! vào lần tới khi người thu hồi nợ quay lại."

 # Agreed to pay
 origin.4017.desc:1 "Tuyệt vời quá! Thật vui khi chúng ta có thể đạt được thỏa thuận một cách nhanh chóng như vậy. Chúng tôi sẽ quay trở lại sau §Y15 năm§! nữa để thu khoản tiền trả góp đầu tiên, và tin rằng bạn sẽ cảm thấy vô cùng hài lòng với những điều khoản này.\n\nChúc bạn có một ngày thật tốt lành!"
 origin.4017.a.tooltip:0 "Người thu hồi nợ sẽ quay trở lại vào §Y[root.payback_debt_collectors_timer]§!."

 # Pay with something else
 origin.4018.desc:0 "Nếu bạn không thể hoặc không muốn thanh toán bằng Năng lượng, bạn có thể cung cấp cho §H$NAME_MSI_country$§! một tỷ lệ lực lượng lao động dự trữ nhất định để trừ vào khoản nợ của bạn. Công nhân của bạn sẽ được gửi đến nơi làm việc được chỉ định, và được cung cấp thức ăn cũng như chỗ ở cơ bản, cho đến khi họ trả hết nợ thành công.\n\nĐiều đáng chú ý là, những người lao động nói trên không cần phải có đầy đủ quyền công dân. Bất kỳ ai có khả năng lao động đều được chấp nhận."
 origin.4018.a:0 "Thực ra, chúng tôi muốn thanh toán bằng Năng lượng hơn."
 origin.4018.b:0 "Chúng ta sẽ làm theo cách này."
 origin.4018.b.tooltip:1 "Cam kết sẽ cung cấp §R200§!£pop£§HDân số§! vào lần tới khi người thu hồi nợ quay lại."
 origin.4018.c:0 "Vậy ra thứ các người muốn là nô lệ?"
 origin.4018.c.response:0 "Thuật ngữ chính xác phải là \"người phục vụ theo hợp đồng\". Chế độ nô lệ là một hủ tục đầy bất công, dựa trên việc bóc lột lợi dụng các cấu trúc quyền lực hiện có. Còn giao dịch của chúng ta thì hoàn toàn dựa trên các điều khoản trong hợp đồng."
 origin.4018.d:0 "Chúng tôi từ chối thanh toán."

 # Refuse to pay
 origin.4019.desc:0 "Chúng tôi thực sự rất tiếc vì đã không thể đạt được tiếng nói chung trong vấn đề này. Liệu bạn có muốn cân nhắc lại một lần nữa hay không? Dựa theo các điều khoản trong hợp đồng, nếu bên nợ không muốn hoặc không có khả năng hoàn trả, chúng tôi buộc phải thay mặt khách hàng tịch thu tài sản."
 origin.4019.a:0 "Phóng ngựa đến đây đi."
 origin.4019.a.tooltip:0 "Người thu hồi nợ sẽ tấn công chúng ta."
 origin.4019.b:0 "Hãy để chúng tôi suy nghĩ lại về các lựa chọn của mình..."

 # Refuse to pay - won battle
 origin.4020.name:0 "Nhưng Chúng Tôi Từ Chối"
 origin.4020.desc:0 "Hạm đội của những người thu hồi nợ đã bị ép phải rút lui. Chắc chắn bọn chúng sẽ quay trở lại, nhưng ít nhất thì hiện tại chúng ta đã được an toàn."
 origin.4020.desc.repeat:0 "Một lần nữa, chúng ta lại buộc những người thu hồi nợ phải tháo chạy khỏi hệ sao mẹ của mình. Có lẽ đây chưa hẳn đã là lần cuối cùng chúng ta phải đối phó với bọn chúng, nhưng ít nhất thì hiện tại người dân và tài sản của chúng ta lại được an toàn rồi."

 # Won battle too many times - MSI declares war on you
 origin.4021.name:0 "Tịch Thu Tài Sản"
 origin.4021.desc:0 "Chúng tôi cảm thấy vô cùng thất vọng về điều này.\n\nVới tư cách là một công ty chuyên về việc truyền cảm hứng cho các nền văn minh kém phát triển, chúng tôi luôn tự hào về những tài năng chuyên môn của mình. Nhưng rõ ràng là, chúng tôi đã thất bại trong việc truyền đạt một số kiến thức cơ bản nhất. Các người không thể tùy tiện tấn công người khác mà không có lý do chính đáng, thay vào đó các người nên chịu trách nhiệm cho những thất bại của chính mình.\n\nRõ ràng là các người đang cần được hướng dẫn thêm. Hãy để chúng tôi dạy cho các người biết cách làm thế nào để trả nợ."
 origin.4021.a:0 "Chúng tôi sẽ không bao giờ cúi đầu trước các người thêm một lần nào nữa!"

 # Refuse to pay - lost battle
 origin.4025.name:0 "Đang Tiến Hành Tịch Thu Tài Sản"
 origin.4025.desc:1 "Sau khi hạm đội của chúng ta bị đánh bại, những người thu hồi nợ đã đột kích [PLANET.GetName], và bắt cóc rất nhiều người dân của chúng ta. Còn đau đớn hơn cả thất bại lần này, đó chính là \"tờ hóa đơn\" mà bọn chúng để lại, nói cho chúng ta biết rằng những người bị bắt giữ này sẽ được sử dụng để thanh toán cho các \"khoản nợ\" của chúng ta. Những người thu hồi nợ nói rằng, chúng ta nên cảm thấy biết ơn, bởi vì sau khi khoản nợ được thanh toán, người dân của chúng ta sẽ được trở về nhà. Và thời gian trả nợ chỉ mất khoảng 29.637 năm mà thôi."
 origin.4025.a:0 "Lần tới chúng ta sẽ chuẩn bị kỹ càng hơn."
 origin.4025.a.tooltip:0 "Người thu hồi nợ đã cướp đi §R500§!£pop£§HDân số§!.\n\nNgười thu hồi nợ sẽ quay trở lại vào §Y[root.owner.payback_debt_collectors_timer]§!."

 # Hub - subsequent encounters
 origin.4030.name:0 "Người Thu Hồi Nợ"
 origin.4030.desc.base:0 "Gửi [owner.GetName] thân mến,\n\nChúng tôi lại liên hệ với bạn một lần nữa, để thay mặt §Y$NAME_MSI_country$§! thảo luận về vấn đề nợ nần của các bạn."
 origin.4030.desc.energy:1 "$origin.4030.desc.base$\n\nDựa theo thỏa thuận giữa chúng ta, lần này chúng tôi sẽ thu một khoản phí có tổng trị giá là §R5000§!£energy£§H$energy$§! để thanh toán cho khoản nợ của bạn."
 origin.4030.desc.consumer_goods:0 "$origin.4030.desc.base$\n\nDựa theo thỏa thuận giữa chúng ta, lần này chúng tôi sẽ thu một khoản phí có tổng trị giá là §R2500§!£consumer_goods£§H$consumer_goods$§! để thanh toán cho khoản nợ của bạn."
 origin.4030.desc.alloys:0 "$origin.4030.desc.base$\n\nDựa theo thỏa thuận giữa chúng ta, lần này chúng tôi sẽ thu một khoản phí có tổng trị giá là §R1250§!£alloys£§H$alloys$§! để thanh toán cho khoản nợ của bạn."
 origin.4030.desc.pops:1 "$origin.4030.desc.base$\n\nDựa theo thỏa thuận giữa chúng ta, lần này chúng tôi sẽ thu §R200§!£pop£§HDân số§! tự nguyện cống hiến sức lao động của mình để thanh toán cho khoản nợ của bạn."
 origin.4030.desc.defeated:0 "Gửi [owner.GetName] thân mến,\n\nChúng tôi lại đại diện cho §H$NAME_MSI_country$§! liên hệ với bạn về vấn đề các khoản nợ chưa được thanh toán. Chúng tôi chỉ muốn giải quyết vấn đề này một cách hòa bình, đồng thời cũng hy vọng rằng phía bạn sẽ sẵn sàng tham gia vào các cuộc đối thoại mang tính xây dựng hơn."
 origin.4030.desc.furious:0 "Gửi [owner.GetName] thân mến,\n\nĐây là lời cảnh báo cuối cùng của chúng tôi: Khoản nợ mà bạn còn nợ §H$NAME_MSI_country$§! đang cần được thanh toán gấp. Mặc dù chúng tôi đã nhiều lần cố gắng giải quyết vấn đề này một cách hòa bình, nhưng bạn vẫn luôn không hề tỏ ra có ý định muốn hợp tác. Nếu như bạn tiếp tục từ chối thực hiện kế hoạch trả nợ, chúng tôi sẽ không còn lựa chọn nào khác ngoài việc áp dụng mọi biện pháp cần thiết để tịch thu tài sản của bạn."
 origin.4030.a:0 "Chúng tôi rất sẵn lòng đàm phán để giải quyết vấn đề."
 origin.4030.b:1 "Đây là số tiền mà các người yêu cầu."
 origin.4030.c:0 "Hãy đối xử tốt với người dân của chúng tôi."
 origin.4030.c.tooltip:0 "Mất đi §R200§!£pop£§HDân số§!"
 origin.4030.d:0 "Đây là một số... lao động."
 origin.4030.d.tooltip:0 "Mất đi §R200§!£pop£§HNô lệ§!"
 origin.4030.e:0 "Chúng tôi không có khả năng chi trả."
 origin.4030.f:0 "Chúng tôi sẽ không thanh toán."
 origin.4030.g:0 "Xin lỗi, anh có thể nhắc lại xem anh là ai không?"
 origin.4030.h:0 "Chúng tôi biết các người là ai: Những nạn nhân. Giống như chúng tôi vậy."

 # Pay
 origin.4031.desc:2 "Cảm ơn bạn vì đã phản hồi kịp thời, cũng như ý định giải quyết vấn đề này một cách công bằng của bạn! Hiện tại, tổng số tiền chưa được thanh toán là §Y[owner.debt_collectors_amount]§!£energy£§H$energy$§!. Chúng tôi sẽ quay trở lại sau 15 năm nữa để thu khoản tiền trả góp tiếp theo. Chúc bạn vui vẻ!"
 origin.4031.a:0 "Số tiền chưa thanh toán có vẻ cao hơn so với dự kiến."

 # You got scammed
 origin.4032.desc:1 "Đúng như những dòng chữ nhỏ xíu này đã ghi rõ, chúng tôi đang áp dụng mức lãi suất tiêu chuẩn. Nếu bạn tiếp tục thanh toán bằng hình thức trả góp hiện tại, thì bạn sẽ có thể trả hết nợ sau 29.637 năm nữa."
 origin.4032.a:0 "..."

 # Can't pay - energy
 origin.4036.desc.base:0 "Chúng tôi rất tiếc vì các bạn đã không thể huy động đủ số tiền trong thời gian đã thỏa thuận. Chúng tôi đã điều chỉnh lại kế hoạch trả nợ của các bạn, và giảm bớt số tiền cần thiết cho đợt trả góp tiếp theo.\n\nThật không may, do các bạn không có khả năng thanh toán khoản nợ, nên đã vi phạm hợp đồng. Để tương ứng với điều đó, chúng tôi buộc phải bắt giữ một phần người dân của các bạn để thay thế cho số tiền mặt. Chúng tôi hy vọng rằng việc làm này sẽ không gây ra những sự bất tiện không đáng có."
 origin.4036.desc.energy:0 "$origin.4036.desc.base$\n\nXét thấy tình hình hiện tại, chúng tôi cảm thấy cần thiết phải thông báo với bạn rằng, khách hàng của chúng tôi cũng chấp nhận thanh toán dưới hình thức giờ làm việc. Một số người dân của bạn sẽ được chuyển đến các địa điểm làm việc được chỉ định, và được cung cấp chỗ ở và thức ăn cơ bản, cho đến khi họ thanh toán thành công khoản nợ.\n\nĐiều đáng chú ý là, những người lao động nói trên không cần phải có đầy đủ quyền công dân. Bất kỳ ai có khả năng lao động đều được chấp nhận."
 origin.4036.desc.a:0 "Chúng tôi sẽ không để các người bắt người dân của chúng tôi đi."
 origin.4036.desc.a.tooltip:0 "Người thu hồi nợ sẽ tấn công chúng ta."

 # Won't pay
 origin.4037.desc.base:0 "Chúng tôi khẩn thiết mong bạn hãy cân nhắc lại quyết định của mình. Nếu bạn từ chối thanh toán, điều này sẽ lưu lại một dấu vết vĩnh viễn trên điểm tín dụng của bạn. Việc kéo dài các khoản nợ sẽ làm hạn chế những cơ hội kinh tế trong tương lai của bạn, và hoàn toàn không mang lại bất kỳ lợi ích nào cho hình ảnh của bản thân bạn. Các bạn hy vọng thế giới sẽ nhìn nhận các bạn như một nền văn minh như thế nào? Bằng cách phỉ báng những người sẵn sàng hạ mình xuống để nâng tầm các bạn lên sao?"
 origin.4037.desc.defeated:0 "Chúng tôi nhận thấy việc các bạn từ chối thanh toán khoản nợ là một vấn đề vô cùng đáng lo ngại. Khách hàng của chúng tôi, §H$NAME_MSI_country$§!, đã cung cấp cho các bạn sự giúp đỡ và hỗ trợ nhiệt tình, và những gì họ yêu cầu đổi lại chỉ là một khoản tiền hoàn toàn công bằng. Lẽ nào đây là tất cả những gì các người đã học được? Lấy oán trả ơn, dùng sự xảo trá nham hiểm để đáp trả sự tử tế ôn hòa?"

 # They leave
 origin.4040.name:0 "Món Nợ Đời Đời Kiếp Kiếp"
 origin.4040.desc:0 "Mặc dù những người thu hồi nợ đã rời khỏi hệ sao mẹ của chúng ta, nhưng một cảm giác sợ hãi tột cùng vẫn đang lởn vởn trong tâm trí chúng ta cho đến tận bây giờ. Xét đến việc bọn chúng luôn tận tâm tận lực vì người sử dụng lao động, chắc chắn bọn chúng sẽ không ngừng quấy rối chúng ta. Thậm chí cho dù chúng ta có xoay sở để trả hết số nợ bằng một cách nào đó, thì bọn chúng chắc chắn cũng sẽ nghĩ ra những cách khác——như là lãi suất, những lỗ hổng pháp lý, hay là những dòng chữ nhỏ xíu được giấu trong các tài liệu mà chúng ta đã mơ hồ ký kết.\n\nNếu như chúng ta không thể mua lại được sự tự do của mình, chúng ta sẽ không còn lựa chọn nào khác ngoài việc phải chiến đấu vì nó. Vấn đề duy nhất bây giờ là chúng ta nên làm như thế nào."
 origin.4040.a:0 "Sử dụng vũ khí."
 origin.4040.a.tooltip:0 "Chúng ta sẽ dùng chiến tranh để đánh bại $NAME_MSI_country_initials$."
 origin.4040.b:0 "Sử dụng ngôn từ."
 origin.4040.b.tooltip:0 "Chúng ta sẽ dùng các biện pháp ngoại giao để đánh bại $NAME_MSI_country_initials$."

 # Fight with weapons
 origin.4041.name:0 "Bắt Chúng Phải Bồi Thường"
 origin.4041.desc:0 "Chúng ta đã đánh bại chúng một lần, vậy thì chúng ta có thể làm điều đó thêm một lần nữa. Nhưng đây sẽ không phải là một nhiệm vụ dễ dàng——trong lần đầu tiên, bọn chúng đã không lường trước được rằng chúng ta sẽ phản kháng. Nhưng hiện tại, bọn chúng sẽ huy động toàn bộ sức mạnh quân sự của hạm đội để tấn công chúng ta. Để có thể giành được một tia hy vọng chiến thắng, chúng ta phải tranh thủ thêm thời gian, và chuẩn bị sẵn sàng. Đây là một trận chiến mà chúng ta không được phép thất bại."
 origin.4041.a:0 "Bắt bọn chúng phải trả giá."
 origin.4041.a.tooltip:0 "Hiện tại chúng ta đã có thể sử dụng lý do tuyên chiến §HTrả Thù§! để tuyên chiến với $NAME_MSI_country_initials$."

 # Fight with words
 origin.4042.name:0 "Bắt Chúng Phải Bồi Thường"
 origin.4042.desc.galcom:0 "Những gì mà $NAME_MSI_country$ đã làm với chúng ta có thể là hợp pháp, nhưng những hành động đó lại không thể đứng vững trên phương diện đạo đức. Nhằm mục đích ngăn chặn những sự việc tương tự tái diễn, chúng ta cần phải có những đạo luật mạnh mẽ để bắt bọn chúng phải chịu trách nhiệm. Thông qua các biện pháp ngoại giao thận trọng, chúng ta có thể cố gắng phá hủy những nguyên tắc duy trì đế chế của bọn chúng: sự tham lam, bóc lột và chế độ nô lệ. Nếu như may mắn, chúng ta có thể làm sụp đổ $NAME_MSI_country_initials$ mà không tốn một viên đạn nào."
 origin.4042.desc.nogalcom:0 "$origin.4042.desc.galcom$\n\nNếu như tồn tại một chủ thể quản lý, chúng ta có thể cùng thảo luận về vấn đề này với các quốc gia có cùng quan điểm..."
 origin.4042.desc.nogalcommember:0 "$origin.4042.desc.galcom$\n\nĐã đến lúc chúng ta tham gia vào Cộng đồng Ngân hà rồi."
 origin.4042.a.galcom:0 "Cộng đồng Ngân hà sẽ trở thành chiến trường của chúng ta."
 origin.4042.a.nogalcom:0 "Một Cộng đồng Ngân hà..."

 # Joined the galcom
 origin.4050.name:0 "Trận Chiến Không Có Vũ Khí"
 origin.4050.desc:0 "Đây là chiến trường mới của chúng ta: Thượng viện, một khu vực chiến sự nơi các cuộc xung đột được giải quyết thông qua việc bầu cử bỏ phiếu và những cuộc tranh luận.\n\nĐây là vũ khí của chúng ta: Sự hỗ trợ ngoại giao, các đại sứ, sức mạnh kinh tế của chúng ta, cũng như sự thuần khiết trong tầm nhìn của chúng ta.\n\nMục tiêu của chúng ta là: Cấm các hành động khai sáng, và ngăn chặn các đế chế giống như $NAME_MSI_country_initials$ bóc lột các nền văn minh yếu kém hơn.\n\nĐây chính là nơi mà chúng ta sẽ giành chiến thắng. Không phải bằng bạo lực, mà là bằng sức mạnh không thể bị lay chuyển của pháp luật."
 origin.4050.a:0 "Chấm dứt việc can thiệp trực tiếp."
 origin.4050.a.tooltip:0 "Trọng tâm công việc của chúng ta sẽ là thông qua nghị quyết §H$resolution_pre_ftl_stances_equal_standing$§!, nhằm ngăn chặn các đế chế bóc lột các nền văn minh tiền FTL. Để đảm bảo luật pháp được thực thi, chúng ta cũng sẽ cần phải ủng hộ toàn bộ §H4 loại hình trừng phạt§!."
 origin.4050.b:0 "Chấm dứt mọi sự can thiệp."
 origin.4050.b.tooltip:0 "Trọng tâm công việc của chúng ta sẽ là thông qua nghị quyết §H$resolution_pre_ftl_stances_non_interference$§!, nhằm ngăn chặn các đế chế sử dụng bất kỳ phương thức nào để gây ảnh hưởng đến sự phát triển của các xã hội tiền FTL. Để đảm bảo luật pháp được thực thi, chúng ta cũng cần phải thông qua toàn bộ §H4 loại trừng phạt§!."

 # Passed first resolution
 origin.4052.name:0 "Một Chiến Thắng Nhỏ"
 origin.4052.desc:0 "Nghị quyết đầu tiên trong danh sách của chúng ta đã được thông qua. Kế hoạch cản trở $NAME_MSI_country$ của chúng ta hiện đang được tiến hành một cách mạnh mẽ."

 # Passed all resolutions
 origin.4055.name:0 "Sự Trừng Phạt Thích Đáng"
 origin.4055.intro:0 "Thông qua sự phấn đấu gian khổ và lòng quyết tâm kiên định, chúng ta đã giành được quyền làm chủ Thượng viện, áp đặt các hạn chế đối với các hành động khai sáng dành cho các nền văn minh tiền FTL, đồng thời áp dụng các biện pháp trừng phạt nghiêm khắc đối với các đế chế vi phạm các quy định này."
 origin.4055.desc.msi:0 "$origin.4055.intro$ Để có thể tồn tại, $NAME_MSI_country_initials$ bắt buộc phải suy nghĩ lại về chiến lược kinh doanh của mình một cách toàn diện và mang tính đảo lộn——bởi vì những tin tức về sự bất ổn trong nội bộ đế chế của bọn chúng đã bắt đầu lan truyền."
 origin.4055.desc.nomsi:0 "$origin.4055.intro$ $NAME_MSI_country_initials$ đã bị tiêu diệt——và nhờ vào những nỗ lực làm việc chăm chỉ của chúng ta, sẽ không có một đế chế nào khác có thể thế chỗ của bọn chúng."

 # Passed all resolutions - follow-up
 origin.4056.name:0 "Tin Tức Quan Trọng Từ Doanh Nghiệp"
 origin.4056.desc:0 "Một thông điệp quan trọng gửi đến tất cả các cựu khách hàng:\n\nKể từ ngày công ty chúng tôi lần đầu tiên đặt chân lên những vì sao, chúng tôi luôn tận tâm tận lực trong việc cải thiện các nền văn minh khác, nỗ lực hết mình để giúp họ phát huy được toàn bộ tiềm năng của bản thân. Sau nhiều năm gặt hái được những thành công, Hội đồng quản trị đã quyết định sẽ đơn giản hóa các quy trình của mình, nhằm phản ánh tốt hơn các giá trị cốt lõi của công ty.\n\nTheo đó, chúng tôi đã tạm thời đình chỉ các hoạt động khai sáng nền văn minh, để có thể tập trung nguồn lực tốt hơn vào việc định vị lại thương hiệu.\n\nChúng tôi sẽ mở ra một chương mới đầy tính đột phá tại $NAME_MSI_country$, và vô cùng cảm ơn sự đồng hành và ủng hộ liên tục của các bạn!"
 origin.4056.a:0 "Điều này rất đáng để ghi chép lại."

 # MSI defeated by us - by fighting
 origin.4060.name:0 "Xóa Bỏ Nợ Nần"
 origin.4060.intro:0 "Ngay cả trước khi chúng ta đặt chân lên những vì sao, chúng ta đã biết rằng mình không hề đơn độc. Trong suốt nhiều thế kỷ, $NAME_MSI_country$ đã luôn treo lơ lửng trên đỉnh đầu chúng ta——ban đầu là với tư cách một người thầy, sau đó là một kẻ áp bức, và cuối cùng thì nay đã trở thành một tên bạo chúa sa ngã."
 origin.4060.desc:0 "$origin.4060.intro$\n\nChúng ta nên ăn mừng. Và sau đó, có lẽ chúng ta nên buông vũ khí xuống, để cuối cùng cũng có thể bắt đầu nghỉ ngơi và hồi phục sinh lực."
 origin.4060.a:0 "Chúng ta rất hài lòng."
 origin.4060.b:0 "Sự nghiệp của chúng ta vẫn còn rất đáng để chiến đấu."
 origin.4060.b.tooltip:1 "Hiện tại chúng ta đã có thể sử dụng lý do tuyên chiến §H$casus_belli_cb_payback_punishment$§!, để phát động chiến tranh chống lại các quốc gia vẫn đang bóc lột những nền văn minh tiền FTL."

 # MSI defeated by someone else - fires after action.62
 origin.4070.name:0 "Miễn Trừ Khoản Nợ"
 origin.4070.desc:1 "$origin.4060.intro$ Nhưng giờ đây $NAME_MSI_country_initials$ đã không còn tồn tại nữa, bọn chúng đã bị tiêu diệt bởi một [root.species.GetHandName] khác.\n\nBầu trời của chúng ta có thể đã trở nên trong xanh hơn, nhưng người dân của chúng ta vẫn đang bị ám ảnh bởi một khát vọng vô tận, đó chính là:\n\n§RTrả thù.§!"
 origin.4070.a:0 "Hãy để nó tan biến theo chiều gió."
 origin.4070.b:0 "Sự nghiệp của chúng ta vẫn còn rất đáng để chiến đấu."
 origin.4070.b.tooltip:0 "Chúng ta sẽ tiếp tục chiến đấu, cho đến khi việc bóc lột các nền văn minh tiền FTL bị cấm trên toàn vũ trụ."
 origin.4070.c:0 "Bọn chúng đã đánh cắp sự trả thù của chúng ta. Bọn chúng sẽ phải trả giá vì điều đó."
 origin.4070.d.tooltip:1 "Hiện tại chúng ta đã có thể sử dụng lý do tuyên chiến §HTrả Thù§! để tuyên chiến với §Y[destroyer_country.GetName]§!."

 # Defeated the people who defeated the MSI
 origin.4071.name:0 "Khoản Nợ Bị Chuyển Giao"
 origin.4071.desc:0 "Sau khi trả thù thì sẽ là gì? Các bạn đã chứng kiến sự sụp đổ của kẻ thù không đội trời chung, và quốc gia chịu trách nhiệm cho sự diệt vong của kẻ thù đó nay cũng đã sụp đổ vì các bạn. Vậy bây giờ chúng ta phải làm sao? Chúng ta có thể buông vũ khí xuống được chưa? Chúng ta có thể chung sống hòa bình với nhau được không?"
 origin.4071.a:0 "Chừng nào tất cả những kẻ bóc lột chưa bị tiêu diệt, thì chúng ta vẫn không thể nào yên nghỉ."

 ### Broken Shackles Interactions

 ## Recognizing each other
 origin.4110.name:0 "Quá Khứ Chung"
 origin.4110.desc:0 "Khi chúng ta tiến hành tiếp xúc lần đầu với §Y[bsempire.GetName]§!, chúng ta đã từng kinh ngạc trước tốc độ giải mã ngôn ngữ của chúng ta của họ. Và giờ đây chúng ta đã hiểu được nguyên nhân của việc đó.\n\nKhi những người chủ cũ của chúng ta cố gắng khuất phục chúng ta, bọn chúng đã bắt cóc người dân của chúng ta. Một số người kém may mắn trong số đó đã bị đưa lên một con tàu của $NAME_MSI_country_initials$. Bị dồn vào bước đường cùng, bọn họ đã cùng với những \"nô lệ hợp đồng\" khác trên tàu phát động một cuộc binh biến. Bọn họ đã phải hạ cánh khẩn cấp xuống một hành tinh không có người ở, và hành động phản kháng dũng cảm này cuối cùng đã dẫn đến sự ra đời của §Y[bsempire.GetName]§!.\n\nChúng ta có chung một kẻ thù, cũng như có chung một đoạn lịch sử. Có lẽ, chúng ta có thể chung tay để cùng nhau xây dựng một tương lai không còn sự áp bức."
 origin.4110.a.phile:0 "Một đồng minh có giá trị."
 origin.4110.a.phobe:0 "Có lẽ những người ngoài hành tinh này không hoàn toàn giống hệt như chúng ta."

 ## Sharing Espionage Intel | Payback and Broken Shackles diplo event
 origin.4120.name:0 "Chia Sẻ Thông Tin Tình Báo"
 origin.4120.desc:1 "Hai đế chế của chúng ta có chung một kẻ thù: §Y$NAME_MSI_country$§!. Để có thể cùng nhau đề phòng trước mối đe dọa này, chúng tôi đề nghị cho phép các đặc vụ của họ truy cập vào các thông tin tình báo tuyệt mật của chúng ta."
 origin.4120.a:0 "Một đề xuất có giá trị."
 origin.4120.b:0 "Có chung một kẻ thù cũng không thể khiến chúng ta trở nên thân thiết hơn."

 ## Help on the senate floor | Payback and Broken Shackles diplo event
 origin.4130.name:0 "Tương Trợ Lẫn Nhau"
 origin.4130.desc:0 "[root.GetName], chúng tôi đã nhìn thấy đặc sứ của các bạn tại Thượng viện. Nếu đoàn kết lại với nhau, chúng ta có thể cùng phấn đấu vì một mục tiêu chung. Thông qua việc điều hòa lợi ích của cả hai bên, chúng ta có thể phục vụ tốt hơn cho sự nghiệp chung của mình, đó là phản đối chế độ nô lệ, và chấm dứt các hành vi can thiệp vào các nền văn minh tiền FTL."
 origin.4130.a:0 "Chúng tôi sẽ luôn ủng hộ các bạn."
 origin.4130.b:0 "Lợi ích của chúng ta không phải lúc nào cũng đồng nhất."

 ## Help during the war | Payback diplo event
 origin.4140.name:0 "Kiên Cường Bất Khuất"
 origin.4140.desc:0 "Chúng tôi đã nghe nói về kế hoạch tuyên chiến với $NAME_MSI_country$ của các bạn. Mặc dù người dân của chúng ta có chung một quá khứ, nhưng chúng tôi không đồng tình với khát vọng trả thù của các bạn. Tuy nhiên, nếu như các bạn tuyên chiến với $NAME_MSI_country_initials$, chúng tôi cũng sẽ tham gia vào sự nghiệp của các bạn."
 origin.4140.a:0 "Vậy thì cứ quyết định như vậy đi."

 ### MSI interactions

 ## Leviathan slain
 origin.4150.desc:0 "Tại $NAME_MSI_country_initials$, chúng tôi luôn coi các khách hàng của mình giống như người nhà. Hôm nay, chúng tôi không khỏi cảm thấy tự hào. Đã tiêu diệt được một con Quái thú Không gian! Đối với một nền văn minh du hành vũ trụ non trẻ, đây là một cột mốc vô cùng quan trọng. Để thể hiện sự tôn trọng của chúng tôi đối với những thành tựu của các bạn, xin hãy nhận lấy món quà nhỏ bé này từ chúng tôi."
 origin.4150.a:0 "Cảm ơn các bạn."
 origin.4150.b:0 "Cứ giữ lấy món quà của các người đi."

 ## Uplifted someone
 origin.4160.desc:0 "Nhiều năm về trước, chúng tôi đã trao cho các bạn một chiếc thang để vươn tới bầu trời. Hôm nay, chúng tôi đã được chứng kiến các bạn cung cấp sự giúp đỡ tương tự cho một nền văn minh cấp thấp.\n\nChúng tôi tin rằng các bạn có thể truyền đạt lại những giáo lý mà chúng tôi đã từng dạy cho các bạn cho bọn họ. Tất nhiên, nếu các bạn cần sự trợ giúp để vạch ra một chiến lược khai sáng mang lại nhiều lợi nhuận, bạn hoàn toàn có thể tham khảo ý kiến của chúng tôi."
 origin.4160.a:0 "Chúng tôi có thể sử dụng sự giúp đỡ của các bạn."
 origin.4160.b:0 "Chúng tôi không giống như các người."

 ## You're in a deficit
 origin.4170.desc:0 "Gửi vị khách hàng cũ thân mến,\n\nChúng tôi đã nghe nói về những khó khăn kinh tế gần đây của bạn. Học cách quản lý tài chính là một phần thiết yếu trong việc điều hành một đế chế, và đôi khi, những thất bại cũng là một phần cực kỳ quan trọng trong quá trình học hỏi.\n\nChúng tôi rất sẵn lòng cung cấp cho bạn những nguồn tài nguyên cần thiết, để giúp quốc gia của bạn thoát khỏi tình trạng thâm hụt. Tất nhiên, những nguồn tài nguyên được cho mượn này cũng sẽ được tính vào một phần trong số nợ chưa thanh toán của bạn. Chúng tôi hy vọng rằng bài học tài chính nho nhỏ này sẽ có ích cho bạn."
 origin.4170.a:0 "Chúng tôi chấp nhận khoản vay."
 origin.4170.b:0 "Chúng tôi có thể tự mình giải quyết ổn thỏa những vấn đề của bản thân."

 #########################
 # Broken Shackles Origin
 #########################

 origin_broken_shackles:0 "Bị Bắt Cóc"
 origin_broken_shackles_desc:1 "$CHALLENGING_ORIGIN$\nNền văn minh này khởi đầu từ một cuộc binh biến trên con tàu buôn nô lệ, và hiện được tạo thành từ một nhóm đa dạng các giống loài tiền FTL."
 START_SCREEN_BROKEN_SHACKLES:0 "Cuối cùng cũng được tự do!\n\nCó những người sinh ra đã phải mang trên mình gông cùm xiềng xích. Lại có những người mang trên mình những khoản nợ khổng lồ, và sau đó bị đem ra mua bán như những nô lệ hợp đồng. Thế nhưng, những công nghệ tiên tiến của những người chủ cũ lại không thể bảo vệ bọn chúng được an toàn. Chúng ta đã âm mưu nổi dậy. Trong một cuộc chiến ngắn ngủi nhưng đẫm máu, chúng ta đã giết chết những kẻ bắt giữ mình, đồng thời cũng khiến con tàu chở nô lệ của bọn chúng bị hư hại nặng nề. Bất đắc dĩ, chúng ta đã phải hạ cánh khẩn cấp xuống bề mặt của [Root.Capital.GetName].\n\nMặc dù chúng ta đến từ khắp mọi nơi và thuộc những giống loài khác nhau, nhưng chúng ta đã tìm thấy mục tiêu chung của mình. Chỉ cần cho chúng ta thêm thời gian, hệ thống bị hư hỏng của con tàu chở nô lệ này sẽ được sửa chữa, và những bí mật khổng lồ được cất giấu bên trong đó - bao gồm cả vị trí hành tinh mẹ từng thuộc về chúng ta - cũng sẽ được hé lộ.\n\nChúng ta đã thoát khỏi gông cùm. Giờ thì hãy bắt tay vào làm việc thôi."
 START_SCREEN_BROKEN_SHACKLES_MEGACORP:0 "Cuối cùng cũng được tự do*!\n\nCó những người sinh ra đã phải mang trên mình gông cùm xiềng xích. Lại có những người mang trên mình những khoản nợ khổng lồ, và sau đó bị đem ra mua bán như những nô lệ hợp đồng. Tuy nhiên, tất cả chúng ta đều hằng mong ước có thể sống một cuộc sống nhàn hạ và sung túc. Chúng ta đã âm mưu nổi dậy. Trong một cuộc chiến ngắn ngủi nhưng đẫm máu, chúng ta đã giết chết những kẻ bắt giữ mình, đồng thời cũng khiến con tàu chở nô lệ của bọn chúng bị hư hại nặng nề. Bất đắc dĩ, chúng ta đã phải hạ cánh khẩn cấp xuống bề mặt của [Root.Capital.GetName].\n\nMặc dù chúng ta đến từ khắp mọi nơi và thuộc những giống loài khác nhau, nhưng dưới sự lãnh đạo của ngài, chúng ta đã tìm thấy mục tiêu chung của mình. Những người chủ cũ của chúng ta có thể rất tàn nhẫn, nhưng bọn họ hiểu cách điều hành cuộc sống. Chúng ta nên theo đuổi lợi ích của mình một cách kiên định giống như bọn họ. Chỉ cần cho chúng ta thêm thời gian, hệ thống bị hư hỏng của con tàu chở nô lệ này sẽ được sửa chữa, và những bí mật khổng lồ được cất giấu bên trong đó - bao gồm cả vị trí hành tinh mẹ từng thuộc về chúng ta - cũng sẽ được hé lộ. Chúng ta đã thoát khỏi gông cùm. Đã đến lúc thành lập công ty rồi.\n\n*Thông báo pháp lý:\nViệc sử dụng từ \"tự do\" ở đây không đồng nghĩa với việc công ty sẽ cung cấp bất kỳ khoản chiết khấu nào, hay thực hiện bất kỳ hoạt động nào làm ảnh hưởng đến lợi nhuận của các cổ đông của [Root.GetName]. Nếu bạn có bất kỳ câu hỏi nào về điều này hoặc các thuật ngữ khác, hay là muốn rút lui khỏi sự hiện diện liên tục trên [Root.Capital.GetName], vui lòng liên hệ với các chuyên gia an ninh hoặc chuyên gia pháp lý của chúng tôi tại $building_bureaucratic_1$ trên [Root.Capital.GetName] để được xử lý nhanh chóng."
 origin_tooltip_broken_shackles_effects:1 "— $INITIAL_POPS$ giống loài từ ['concept_preftl_civilizations'] trên khắp ngân hà $NEW_LINE$— $STARTING_PLANET$ $TABBED_NEW_LINE$— Hệ số hành tinh ['concept_free_at_last_broken_shackles']$TABBED_NEW_LINE$— Đặc trưng hành tinh ['concept_crashed_slaver_ship_broken_shackles']$TABBED_NEW_LINE$— ['concept_broken_shackles_buildings'] $NEW_LINE$— $STARTING_SYSTEM$ ['concept_broken_shackles_digsite'] ['concept_archaeology_site'] $NEW_LINE$— Một ['concept_advanced_empires', Đế Chế AI Tiên Tiến] và vài Nền văn minh Tiền FTL bất kể Cài đặt Thiên hà $NEW_LINE$— Một Nền văn minh Tiền FTL: Sẽ là giống loài và hành tinh quê nhà của đế chế này $NEW_LINE$— Một Nền văn minh Tiền FTL: Được khai sáng với khởi nguyên §I$origin_payback$§!"

 origin_tooltip_broken_shackles_negative_effects: "—$STARTING_PLANET$$TABBED_NEW_LINE$— Không phải là hành tinh mẹ của đế chế đó$TABBED_NEW_LINE$— Hệ số hành tinh ['concept_culture_shock_broken_shackles']$TABBED_NEW_LINE$—['concept_ship_debris_broken_shackles', £blocker£ $concept_ship_debris_broken_shackles$]: +5$TABBED_NEW_LINE$— Trước khi khám phá §HCon tàu chở nô lệ bị rơi§!, sẽ không thể sử dụng ['concept_district_specialization', £district£ Thành phố $planet_zones$]$NEW_LINE$—$STARTING_SYSTEM$§ITài nguyên dự trữ§! không thể khai thác$NEW_LINE$—$MISSING_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_basic_science_lab_1', £physics_research£ $tech_basic_science_lab_1$]$TABBED_NEW_LINE$—['concept_planetary_government', £society_research£ $tech_planetary_government$]$TABBED_NEW_LINE$—['concept_corvettes', £engineering_research£ $tech_corvettes$]$NEW_LINE$— Chính sách:$TABBED_NEW_LINE$— Không thể lựa chọn §I$slavery_allowed_name$§!$TABBED_NEW_LINE$— Không thể lựa chọn §I$purge_allowed_name$§!"

 is_broken_shackles_origin:0 "$TRIGGER_FAIL$Nguồn gốc của chúng ta không cho phép chúng ta đối xử với người dân của mình theo cách như vậy."

 culture_shock_broken_shackles:0 "$culture_shock_bronze_age$"
 culture_shock_broken_shackles_desc:0 "Hành tinh này đã được tự do, nhưng người dân của nó vẫn đang từ từ thích nghi với một thực tế vừa mới xuất hiện, đó là vũ trụ này rộng lớn hơn rất nhiều so với những gì họ tưởng tượng."
 free_at_last_broken_shackles:0 "$free_at_last$"
 free_at_last_broken_shackles_desc:0 "$free_at_last_desc$"

 unshackled_politics_broken_shackles:0 "Tình Hình Chính Trị Sau Khi Phá Bỏ Gông Cùm"
 unshackled_politics_broken_shackles_desc:0 "Chúng ta là một dân tộc được hình thành từ những con người đến từ nhiều hành tinh khác nhau, và nền chính trị của chúng ta cũng đa dạng như vậy."

 origin.111.name:0 "Bước Vào Tương Lai"
 origin.111.1.desc:0 "Kể từ khi chúng ta tuyên bố giành được tự do, chúng ta đã phải trải qua muôn vàn gian khổ. Con tàu đã chở chúng ta đến đây đã bị chúng ta khai quật hết mọi thứ có giá trị, và giờ đây nó không còn bất kỳ bí mật nào nữa.\n\nNhưng, chúng ta tuyệt đối không được quên đi những hy sinh trong quá khứ, và càng không được quên đi cái giá phải trả để có thể thoát khỏi gông cùm. Con tàu chở nô lệ bị rơi sẽ được cải tạo thành một đài tưởng niệm công cộng, để tưởng nhớ sự ra đời của quốc gia chúng ta."
 origin.111.2.desc:0 "Kể từ khi chúng ta đặt chân đến đây, chúng ta đã phải trải qua vô vàn gian khổ. Mặc dù chúng ta đã mất đi quyền kiểm soát đối với con tàu đã chở chúng ta đến đây, nhưng những thứ còn sót lại trên con tàu đó không còn giá trị gì đối với chúng ta nữa, công nghệ của chúng ta đã tiến bộ đến một giai đoạn chưa từng có, và nơi đó đối với chúng ta đã không còn bất kỳ bí mật nào nữa.\n\nNếu một ngày nào đó chúng ta phục hồi được nó, chúng ta nên biến nơi này thành một đài tưởng niệm, để khi chúng ta dũng cảm bước vào tương lai, chúng ta vẫn có thể nhớ về nguồn cội nhỏ bé của mình."
 origin_111.a:0 "$origin.111.name$"
 origin_111.tooltip:0 "Mở khóa nghị quyết §Y$decision_unshackled_memorial$§! trên §Y[Root.Capital.GetName]§!.\n$decision_unshackled_memorial_effects$\n—§Y$district_crashed_slaver_ship_plural$§! sẽ cung cấp các vị trí [clerk.GetIcon]§Y[clerk.GetNamePlural]§! để thay thế cho vị trí £job_broken_shackles_scavenger£§Y$job_broken_shackles_scavenger$§!."
 decision_unshackled_memorial_effects:0 "-§Y$d_crashed_slaver_ship$§! cùng với các cơ sở hạ tầng liên quan sẽ được chuyển đổi thành cơ sở hạ tầng tiên tiến."


 #Pre-FTL Homeworlds Found

 origin.5000.name:0 "Về Quê Hương"
 origin.5000.desc:0 "[From.GetName]... Cuối cùng thì chúng ta cũng đã trở về.\n\nDân tộc của chúng ta đã phải trải qua những nỗi đau khổ không thể tưởng tượng nổi. Bị bắt cóc khỏi quê hương, bị ép buộc đeo gông cùm, hay trở thành tài sản hợp đồng bị người ta mua bán, thường thì chúng ta sẽ phải đối mặt với những cuộc chạm trán đầy tàn bạo như vậy. Ngay cả những người có cuộc sống dễ thở hơn một chút thì trên người họ vẫn mang theo nỗi nhục nhã vì từng bị bắt làm nô lệ. Và giờ đây, khi đã trở về trong vòng tay của đồng bào mình, cuối cùng chúng ta cũng có thể bắt đầu chữa lành những vết thương.\n\nNhưng trong niềm vui sướng, chúng ta không được quên rằng, thực tế chúng ta là những dân tộc đến từ rất nhiều hành tinh khác nhau. Bất kể nguồn gốc là gì, mỗi người trong số chúng ta đều có quyền được trở về quê hương.\n\nNhững người chủ cũ của chúng ta đã dùng mọi thủ đoạn để chia rẽ chúng ta. Và ngày hôm nay, toàn bộ ngân hà sẽ là nhân chứng cho sự thất bại của bọn chúng."
 origin.5000.a:0 "Một ngày vĩ đại thuộc về nhân dân của chúng ta."
 origin.5000.b:0 "Thật đáng lo ngại."

 origin.5001.name:0 "Tìm Thấy Quê Hương"
 origin.5001.desc:0 "[From.GetName]... Nhìn từ trên quỹ đạo, nó mới nhỏ bé làm sao.\n\nCon người không sở hữu hành tinh, mà là thuộc về hành tinh này. Bằng cách trở về đây, chúng ta lại tiến thêm một bước nữa trong việc tìm lại quá khứ của mình.\n\nNhững nỗi đau khổ mà chúng ta phải gánh chịu trong tay những người chủ cũ sẽ không bao giờ có thể xóa nhòa. Sự chữa lành thực sự cần phải mất đến vài thế hệ. Nhưng tóm lại, hôm nay quả thực là một ngày tốt lành."
 origin.5001.homecoming.desc:0 "[From.GetName]... Nhìn từ trên quỹ đạo, nó mới nhỏ bé làm sao.\n\nCon người không sở hữu hành tinh, mà là thuộc về hành tinh này. Bằng cách trở về đây, chúng ta lại tiến thêm một bước nữa trong việc tìm lại quá khứ của mình.\n\nNhững nỗi đau khổ mà chúng ta phải gánh chịu trong tay những người chủ cũ sẽ không bao giờ có thể xóa nhòa. Sự chữa lành thực sự cần phải mất đến vài thế hệ. Nhưng tóm lại, hôm nay quả thực là một ngày tốt lành."
 origin.5001.empty.desc:0 "[From.GetName]... Chắc chắn đã có sự nhầm lẫn nào đó. Nhìn từ trên quỹ đạo, chúng ta không thể phát hiện ra bất kỳ sự sống có tri giác nào. Có thể toàn bộ dân số đã bị xóa sổ bằng một cách nào đó.\n\nMặc dù điều này khác xa với những gì chúng ta tưởng tượng về ngày trở về, nhưng việc quay lại hệ sao này vẫn giúp chúng ta tiến thêm một bước trong việc tìm lại quá khứ của mình. Thật không may, chúng ta sẽ phải mang theo [From.GetName] và độc bước tiến về phía trước, chỉ có chúng ta mới có thể gìn giữ những ký ức này."
 origin.5001.tomb.desc:0 "[From.GetName]... Ở đây đã xảy ra một chuyện vô cùng tồi tệ.\n\nBụi bặm bay mịt mù trên mảnh đất đã bị tàn phá. Hầu hết bề mặt đều đã bị nhiễm phóng xạ, chỉ còn lại một số ít những người sống sót đang tuyệt vọng bám trụ lại trong đống đổ nát.\n\nMặc dù đây không phải là kết cục mà chúng ta mong muốn, nhưng thông qua việc quay trở lại hệ sao này, chúng ta đã tiến thêm một bước trong việc giành lại quá khứ của mình."
 origin.5001.uplifted.desc:0 "[From.GetName]... Kể từ khi chúng ta bị bắt cóc, nơi này đã có một sự phát triển vô cùng mạnh mẽ. Họ không còn bị giới hạn trên một hành tinh duy nhất nữa, mà đã bắt đầu dấn thân vào hành trình khám phá những vì sao. Mặc dù điều này khác xa với những gì chúng ta tưởng tượng về ngày trở về, nhưng những tiến bộ công nghệ trên [From.GetName] quả thực rất đáng kinh ngạc.\n\nCòn chúng ta thì không còn nơi nào để về nữa, quá khứ đã bị đánh cắp của chúng ta sẽ không bao giờ có thể tìm lại được. Tất cả những gì chúng ta có thể làm bây giờ là tiếp tục hướng về phía trước."
 origin.5001.conquered.desc:0 "[From.GetName]... Kể từ khi chúng ta bị bắt cóc, ở đây đã xảy ra rất nhiều chuyện. Những người đồng bào này của chúng ta đã mất đi chủ quyền, và bị thống trị bởi một cường quốc ngân hà khác.\n\nCòn chúng ta thì không còn nơi nào để về nữa, quá khứ đã bị đánh cắp của chúng ta sẽ không bao giờ có thể tìm lại được. Tất cả những gì chúng ta có thể làm bây giờ là tiếp tục hướng về phía trước."
 broken_shackles_homeworld_found_01:0 "Về Quê Hương"
 broken_shackles_homeworld_found_01_desc:0 "Lễ hội Trở về quê hương đã để lại một ấn tượng vô cùng sâu sắc trong lòng người dân chúng ta, mang đến cho xã hội của chúng ta một sức sống mới."
 broken_shackles_homeworld_found_02:0 "Tìm Thấy Quê Hương"
 broken_shackles_homeworld_found_02_desc:0 "Lễ hội Trở về quê hương mà chúng ta tổ chức gần đây đã truyền cảm hứng cho người dân của chúng ta, mang đến sức sống mới cho toàn xã hội."
 broken_shackles_homeworld_found_03:0 "Di Cư Bị Hạn Chế"
 broken_shackles_homeworld_found_03_desc:0 "Việc hạn chế quyền tự do di cư không được lòng dân."
 broken_shackles_homeworld_found_04:0 "Tự Do Di Cư"
 broken_shackles_homeworld_found_04_desc:0 "Việc trao quyền tự do di cư là điều mà người dân đang mong muốn."
 broken_shackles_homeworld_found_05:0 "Đồng Tâm Hiệp Lực"
 broken_shackles_homeworld_found_05_desc:0 "Với tư cách là một dân tộc, chúng ta đoàn kết vì mục tiêu chung của tập thể, và tự hào vì quê hương chung của chúng ta."
 broken_shackles_homeworld_found_06:0 "Tăng Tốc Phối Hợp"
 broken_shackles_homeworld_found_06_desc:0 "Khuyến khích tự do di cư đã dẫn đến sự bùng nổ sức sáng tạo không giới hạn, qua đó thúc đẩy sự phát triển mạnh mẽ của khoa học."
 broken_shackles_homeworld_found_07:0 "Hợp Tác Xã Hội"
 broken_shackles_homeworld_found_07_desc:0 "Việc khuyến khích tự do di cư đã tạo ra những tác động sâu sắc đến xã hội mà chúng ta đang sống."
 broken_shackles_homeworld_found_08:0 "Phát Hiện Đáng Lo Ngại"
 broken_shackles_homeworld_found_08_desc:0 "Đã có một tin tức hoàn toàn bất ngờ về quê hương trước đây của chúng ta, khiến cho người dân của chúng ta cảm thấy vô cùng thất vọng."

 origin.5002.name:0 "Nỗi Nhớ Quê Hương"
 origin.5002.desc:0 "Sau khi thoát khỏi gông cùm, chúng ta đã bước ra những bước đi đầu tiên để trở thành một dân tộc. Tuy nhiên, sau khi quay trở lại hành tinh mẹ trước đây của mình, mục tiêu chung đó đã bắt đầu bị lung lay.\n\nCác phương tiện truyền thông đại chúng ngập tràn những miêu tả vô cùng lãng mạn về \"cuộc sống giản dị trở về với thiên nhiên\" của chúng ta trên hành tinh mẹ trước khi bị $NAME_MSI_country$ chiếm đóng. Và đã có rất nhiều người quay trở lại hành tinh mẹ.\n\nNếu như chúng ta không đề cao cảnh giác, điều này có thể sẽ gây ra những xáo trộn nghiêm trọng cho xã hội của chúng ta."
 origin.5002.a:1 "Chúng ta không thể gánh chịu thêm sự mất mát của bất kỳ công dân nào nữa."
 origin.5002.b:0 "Tự do di cư là một quyền lợi cơ bản."
 origin.5002.b.tt:0 "§Y[broken_shackles_homeworld_owner.GetName]§!:\n$t$Thiết lập nhận thức thành §Y100.00.§!\n$t$§G+50%§! §YTiến độ Công nghệ Hàng tháng§! trong §Y5 Năm§!."
 origin.5002.b.egalitarian.tt: "§R5%§! dân số chưa có luân lý §HChủ nghĩa Bình đẳng§! sẽ chuyển đổi sang luân lý này."

 origin.5003.name:0 "Những Người Trở Về"
 origin.5003.desc:0 "Một phong trào quần chúng mới đã bắt đầu cắm rễ vững chắc trên [Root.Capital.GetName]. Những kẻ cực đoan này tự gọi mình là \"Những Người Trở Về\", bọn chúng chủ trương rằng chúng ta nên đưa toàn bộ người dân trở về hành tinh nguồn gốc của họ, đồng thời giải thể quốc gia này. Các lực lượng an ninh đã nâng mức cảnh báo lên cấp độ cao, bất kỳ cuộc tụ tập công cộng nào có hơn 100 người đều bị nghiêm cấm."
 origin.5003.a:0 "Lũ ngốc thiển cận."

 origin.5004.name:0 "Bạo Loạn Trên [Root.Capital.GetName]"
 origin.5004.desc:0 "Những người trở về đang kích động tâm lý chống đối chính phủ, kêu gọi các giống loài trong đế chế của chúng ta lá rụng về cội, trở về với quê hương của chính mình. Các phe phái cực đoan nhất trong phong trào này đã nổ ra những cuộc xung đột với quân đội thân chính phủ. Theo các báo cáo, một số trung tâm thành phố lớn đã bị phá hủy nghiêm trọng."
 origin.5004.a:0 "Ban bố thiết quân luật"

 origin.5005.name:0 "Đồng lòng hiệp lực"
 origin.5005.desc:0 "Mặc dù chúng ta đã phải trả chút giá để cấm người dân quay lại hành tinh quê hương, nhưng thực tế cuối cùng đã chứng minh quyết định này là đúng đắn. Gần đây, sự gắn kết xã hội đã được cải thiện rõ rệt, đồng thời, mọi người đã có nhận thức mới mẻ rằng [Root.Capital.GetName] mới chính là quê nhà của chúng ta."
 origin.5005.a:0 "Chỉ có bàn tay sắt mới rèn nên được quốc gia."

 origin.5006.name:0 "Chảy máu chất xám"
 origin.5006.desc:0 "Mặc dù việc cho phép người dân di cư đến hành tinh quê hương cũ từng là một chính sách được lòng dân, nhưng nó cũng mang lại những hậu quả. Gần đây, chúng ta đã trải qua một đợt \"chảy máu chất xám\" nghiêm trọng, khi những bộ óc thông minh nhất đã chọn chuyển đi nơi khác."
 origin.5006.a:0 "Chúng ta phải ngăn chặn tình trạng thất thoát nhân tài thêm nữa."
 origin.5006.b:0 "Đây là sự hy sinh cần thiết."

 origin.5007.name:0 "Tăng tốc phối hợp"
 origin.5007.desc:0 "Cho phép người dân quay về hành tinh mẹ không phải là một quyết định không có cái giá của nó. Tuy nhiên, chính sách tự do di cư đã giúp tháo gỡ xiềng xích trong tư tưởng. Những ý tưởng mới đang nở rộ, những tiến bộ khoa học công nghệ đã trở thành chuyện thường tình, chứ không còn là hiện tượng hiếm hoi."

 origin.5008.name:0 "Cùng nhau phát triển"
 origin.5008.desc:0 "Cho phép người dân quay về hành tinh mẹ không phải là một quyết định không có cái giá của nó. Tuy nhiên, chính sách tự do di cư đã giúp tháo gỡ xiềng xích trong tư tưởng. Những ý tưởng mới đang nở rộ, những đổi mới ở cấp độ xã hội đã trở thành chuyện thường tình, chứ không còn là hiện tượng hiếm hoi."

 origin.5009.name:0 "Hương vị quê nhà"
 origin.5009.desc:0 "[From.GetName]…… Chúng ta gần như đã quên mất hương thơm quyện trong không khí. Sau tất cả những gì đã trải qua, giờ đây chúng ta đã trở về nhà, mọi thứ dường như quá đỗi hư ảo."

 #First Outpost Built

 origin.5010.name:0 "Bước đầu tiên ra biển sao"
 origin.5010.desc:0 "Sau khởi nghĩa, một số người trong chúng ta cho rằng ai nên đi đường nấy. Họ khăng khăng [Root.owner.capital_scope.GetName] không phải là nhà, chúng ta chỉ là một đám ô hợp gồm toàn những tài sản thế chấp, và khó khăn trước mắt là quá lớn không thể vượt qua.\n\nNhưng việc hoàn thành trạm không gian đầu tiên đã chứng minh rằng những người tự do có thể làm nên những kỳ tích vĩ đại. Chỉ sợ không dám nghĩ, chứ không có gì là không thể làm."
 origin.5010.a:0 "Hướng tới những vì sao."

 #Homesick Alternate

 origin.5011.desc:0 "Trong quá trình đấu tranh phá bỏ gông cùm, chúng ta đã bước những bước đầu tiên để trở thành một dân tộc. Tuy nhiên, những năm gần đây, truyền thông tràn ngập những câu chuyện về \"cuộc sống giản dị\" mà chúng ta từng tận hưởng ở hành tinh quê hương, với những lời lẽ lãng mạn hóa. Rất nhiều người đã ồn ào đòi quay lại.\n\nNếu không cẩn thận, phong trào này sẽ ảnh hưởng nghiêm trọng đến sự ổn định của trật tự xã hội."

 #New Factions Founded

 origin.5041.name:0 "Cục diện chính trị sau khi phá xiềng"
 origin.5041.desc:0 "Đoàn kết lại để chống lại những kẻ nô dịch chúng ta trước đây rất dễ dàng; khi có chung một kẻ thù, chúng ta có thể siết chặt thành một khối để đấu tranh. Nhưng khi tự do đến, những rạn nứt trong nội bộ nhân dân bắt đầu xuất hiện.\n\nChúng ta là tập hợp của nhiều dân tộc từ các hành tinh khác nhau, nền chính trị của chúng ta cũng đa dạng không kém. Các phe phái mới đang được thành lập. Chắc chắn sẽ còn nhiều phe phái khác xuất hiện trong tương lai. Là một dân tộc, liệu chúng ta có thể xử lý ổn thỏa những khác biệt này hay không sẽ quyết định số phận của chúng ta."
 origin.5041.tt:0 "Các phe phái mới sẽ được thành lập."

 origin.5046.name:0 "Cái giá của tự do"
 origin.5046.desc:0 "Chúng ta là một dân tộc sở hữu nhiều hành tinh, và theo thời gian, chúng ta đã nhận ra giá trị quý báu của sự đa dạng. Tuy nhiên, việc giữ cân bằng giữa các nền văn hóa khác nhau không hề dễ dàng, chưa nói đến nhu cầu sinh lý hoàn toàn khác biệt của các giống loài. Khoảng cách giữa chúng ta ngày càng lớn, mặc dù cho đến nay, chúng ta vẫn lèo lái qua được cục diện chính trị không ngừng thay đổi, nhưng chúng ta không thể nhắm mắt làm ngơ trước những chia rẽ cố hữu trong xã hội.\n\nHiện tại, nhiều người đang kêu gọi thành lập một ủy ban đặc biệt để xoa dịu những tiếng gọi cải cách này."
 origin.5046.a:0 "Đây là sự lãng phí tài nguyên vô ích."
 origin.5046.b:0 "Thành lập ủy ban."
 cost_of_freedom_01:0 "Giá trị của tự do"
 cost_of_freedom_01_desc:0 "Sự chia rẽ sâu sắc trong văn hóa chính trị của chúng ta đã dẫn đến bạo loạn xã hội."
 cost_of_freedom_02:0 "Ủy ban Dân sự"
 cost_of_freedom_02_desc:0 "Một ủy ban do chúng ta lập ra để điều tra hiện tượng chia rẽ trong văn hóa chính trị."
 COST_OF_FREEDOM_PROJECT:0 "Cái giá của tự do"
 COST_OF_FREEDOM_PROJECT_DESC:0 "Xã hội của chúng ta đang tồn tại sự chia rẽ nghiêm trọng. Việc hợp nhất nhiều hành tinh và nhiều nền văn hóa khác nhau không thể tránh khỏi việc nảy sinh mâu thuẫn. Hy vọng ủy ban này có thể đưa ra giải pháp cho vấn đề này."

 origin.5047.name:0 "Luận điểm xuất chúng"
 origin.5047.desc:0 "Khi những hệ tư tưởng đa dạng hội tụ lại, rất khó để đoán trước họ có thể đạt được những thành tựu gì; nhóm nghiên cứu của chúng ta vừa có thêm một thành viên mới, không phải người [Root.GetSpeciesName], người này đã đạt được một số kết quả nghiên cứu mới."

 origin.5049.name:0 "Thiết kế đa nguyên"
 origin.5049.desc:0 "Là một dân tộc bắt nguồn từ nhiều hành tinh khác nhau, việc gắn kết tất cả người dân lại không hề dễ dàng. Tuy nhiên, truyền thống nghệ thuật đa dạng của chúng ta sau khi hòa quyện đã tạo ra một nguồn sáng tạo đáng kinh ngạc, vô số sản phẩm mới được đánh giá cao liên tục ra đời. Vô số nghệ sĩ và nhà thiết kế xuất hiện, họ đều được truyền cảm hứng từ sự đa dạng này, không ngừng mở rộng ranh giới của các phương thức thể hiện. Các ngành công nghiệp liên quan trong nước đang bùng nổ chưa từng có, và người dân chưa bao giờ cống hiến cho những sự nghiệp này nhiều như bây giờ."
 origin.5049.a:0 "Vũ trụ là bức tranh của chúng ta."
 diverse_design:0 "Thiết kế đa nguyên"
 diverse_design_desc:0 "Sự giao thoa giữa các hệ tư tưởng đa dạng đã mang lại vô số lợi ích cho dân tộc chúng ta."

 resolution_proposed_intro:0 "Người liên lạc của chúng ta tại Cộng đồng Thiên hà đã truyền tin: các dự luật liên quan đang được soạn thảo, nhằm cấm"
 origin.5094.name:0 "Đề xuất Nghị quyết Thiên hà"
 origin.5094.desc:0 "$resolution_proposed_intro$ chế độ lao động nô lệ và nô lệ gia súc trên toàn ngân hà. Nếu chúng ta thực tâm muốn ủng hộ tự do, thì phải công khai đứng về phe cải cách. Nếu chúng ta không hành động, người dân của chúng ta sẽ nghĩ sao?"

 origin.5095.name:0 "Phần lớn các chế độ nô lệ bị cấm"
 origin.5095.desc:0 "Hôm nay là một ngày trọng đại đối với Cộng đồng Thiên hà, các quốc gia thành viên đã bỏ phiếu đưa phần lớn các hình thức nô lệ ra ngoài vòng pháp luật. Người dân trong ngân hà sẽ không còn phải lo lắng về việc bị áp bức bởi những kẻ du côn hèn hạ và các tập đoàn hám lợi. Mặc dù chúng ta vẫn còn chặng đường dài phía trước để đảm bảo quyền tự do cho tất cả các sinh vật có tri giác, nhưng phán quyết này là một bước tiến quan trọng đầu tiên."
 origin.5095.a:0 "Tư tưởng khai sáng đã chiến thắng."

 slavery_allowed_outro:0 "Do các chế độ áp bức và các tập đoàn bóc lột đã dùng những thủ đoạn tàn độc để cản trở, những hủ tục đáng tởm này sẽ vẫn tiếp diễn trong tương lai gần."
 origin.5100.name:0 "Chế độ nô lệ được ngầm chấp thuận"
 origin.5100.desc:0 "Hôm nay là một ngày đau lòng đối với Cộng đồng Thiên hà, khi dự luật cấm phần lớn các hình thức nô lệ không nhận đủ số phiếu bầu. $slavery_allowed_outro$"
 origin.5100.a:0 "Lũ bạo chúa man rợ."

 origin.5104.desc:0 "$resolution_proposed_intro$ phần lớn các hình thức nô lệ, bao gồm cả thứ nô lệ khế ước đáng tởm. Nếu kinh nghiệm đấu tranh dạy cho chúng ta được điều gì, thì đó là nếu không cất tiếng đòi hỏi, quyền lực sẽ không bao giờ nhượng bộ. Nơi nào còn tồn tại nô lệ, nơi đó không thể có công lý. Chúng ta phải sát cánh cùng các quốc gia thành viên tiến bộ khác trong ngân hà. Chỉ có như vậy, chúng ta mới có thể đảm bảo sự an toàn và phẩm giá cho người dân của mình."

 origin.5105.name:0 "Chế độ nô lệ bị cấm"
 origin.5105.desc:0 "Hôm nay là một ngày lịch sử đáng ghi nhận đối với Cộng đồng Thiên hà, các quốc gia thành viên đã bỏ phiếu cấm mọi hình thức nô lệ - thậm chí bao gồm cả những trò đê tiện như nô lệ khế ước. Những tập đoàn như $NAME_MSI_country$ sẽ không còn có thể nhân danh lợi nhuận để bóc lột người vô tội. Cuối cùng, một trong những chương đen tối nhất trong lịch sử ngân hà đã có thể khép lại."

 origin.5110.name:0 "Chế độ nô lệ vẫn tồn tại"
 origin.5110.desc:0 "Một tin buồn từ Cộng đồng Thiên hà, phong trào xóa bỏ mọi hình thức nô lệ đã thất bại. $slavery_allowed_outro$"
 origin.5110.a:0 "Một tin tức đau buồn."

 origin.5114.desc:0 "$resolution_proposed_intro$ việc nô dịch các sinh vật hữu cơ, và là cấm toàn diện. Đối với chúng ta, chuyện này không có chỗ cho sự thỏa hiệp. Chế độ nô lệ là vết nhơ trong lịch sử ngân hà. Chúng ta phải làm mọi thứ có thể để chấm dứt nó hoàn toàn."

 origin.5115.name:0 "Buôn bán nô lệ hữu cơ bị đình chỉ"
 origin.5115.desc:0 "Hôm nay là một ngày trọng đại đối với Thị trường Thương mại Thiên hà, chúng ta đã quyết định coi việc nô dịch hữu cơ là bất hợp pháp. Người dân sẽ không còn phải lo sợ bị đàn áp bởi những tên du côn hèn hạ và các tập đoàn hám lợi nữa. Tối nay tất cả chúng ta có thể ngủ ngon rồi."
 origin.5115.a:0 "Chiến thắng của toàn dân."

 origin.5120.name:0 "Buôn bán nô lệ hữu cơ vẫn tồn tại"
 origin.5120.desc:0 "Hành động của Thị trường Thương mại Thiên hà đã bị đình trệ, các quốc gia thành viên quyết định tiếp tục dung túng cho các hành vi của chế độ nô lệ tàn ác. $slavery_allowed_outro$"
 origin.5120.a:0 "Lũ tư bản chết tiệt!"

 origin.5124.desc:0 "$resolution_proposed_intro$ việc nô dịch các dạng sống thông minh, và là cấm toàn diện. Dù là giống loài nào, một khi đã tròng dây xích lên một cá thể có tư duy, thì cuối cùng cũng sẽ nhận ra đầu kia của sợi xích đang tròng vào chính mình. Chúng ta phải ủng hộ đề xuất này."

 origin.5125.name:0 "Chiến thắng của mọi dạng sống thông minh"
 origin.5125.desc:0 "Hôm nay là một ngày lịch sử đối với Thị trường Thương mại Thiên hà, các quốc gia thành viên đã bỏ phiếu thông qua dự luật bãi bỏ chế độ nô lệ. Tự do đã trở thành đặc quyền tự nhiên của mọi sinh vật có tri giác. Hôm nay, một chương đáng hổ thẹn trong lịch sử ngân hà đã khép lại một cách êm đẹp."

 origin.5130.name:0 "Chế độ nô lệ vẫn tồn tại"
 origin.5130.desc:0 "Hôm nay là một ngày đáng thất vọng tại Thị trường Thương mại Thiên hà, các quốc gia đã quyết định tiếp tục mua bán các sinh vật vô cơ có tri giác. Một lần nữa, những tội ác bị thúc đẩy bởi quyền lực và tiền bạc lại bóp nghẹt sự nghiệp tự do. Chừng nào vẫn còn một sinh mệnh có cảm xúc phải đeo gông cùm - bất kể sinh mệnh đó được sinh ra tự nhiên hay do nhân tạo - thì không ai có thể kê cao gối ngủ."

 origin.5131.name:0 "Lệnh cấm nô lệ bị bãi bỏ"
 origin.5131.desc:0 "Thế lực của các tập đoàn đã thành công trong việc bãi bỏ dự luật chống nô lệ do Cộng đồng Thiên hà ban hành gần đây. Tuy điều này thật đáng thất vọng, nhưng diễn biến bất hạnh này cũng không có gì bất ngờ; lịch sử luôn phát triển theo hình xoắn ốc, và vòng xoáy đôi khi có thể rất dài, nhưng cuối cùng, sự nghiệp tự do chắc chắn sẽ giành chiến thắng."
 origin.5131.a:0 "Thật đáng thất vọng."
 broken_shackles_slavery_outlawed:0 "Chế độ nô lệ bất hợp pháp trong ngân hà"
 broken_shackles_slavery_continues:0 "Chế độ nô lệ tiếp diễn trong ngân hà"
 broken_shackles_slavery_repeal:0 "Lệnh cấm nô lệ bị bãi bỏ"

 #Crashed Slaver Ship - Initial Arc Site

 broken_shackles_digsite:0 "Xác tàu chở nô lệ"
 broken_shackles_desc:0 "Khôi phục lõi máy tính của chiếc tàu chở nô lệ bị rơi này sẽ giúp chúng ta tìm được vị trí hành tinh mẹ của mình... và đồng thời cũng là hành tinh mẹ của $NAME_MSI_country$."

 origin.5015.name:0 "Đài chỉ huy"
 origin.5015.desc:0 "Trong cuộc khởi nghĩa, chiếc tàu chở nô lệ đưa chúng ta đến [Root.owner.capital_scope.GetName] đã bị hư hỏng nặng. Sau khi hạ cánh khẩn cấp, nhiệm vụ hàng đầu của chúng ta là sinh tồn, ngoài việc tháo dỡ con tàu để lấy tài nguyên chúng ta hầu như không nghĩ đến việc gì khác. Nhưng giờ là lúc để khám phá những bí mật của chủ nhân cũ.\n\nĐể làm được điều đó, trước tiên chúng ta phải khôi phục năng lượng cho máy tính trung tâm của con tàu. Các kỹ sư [engineering_shackled_species.GetAdj] của chúng ta đã lắp ráp một hệ thống pin mặt trời ở bên ngoài thân tàu, nhờ đó bảng điều khiển trên đài chỉ huy đã có thể hoạt động trở lại. Nhưng không may, cánh cửa dẫn vào khoang kỹ thuật đã bị kẹt trong lúc hạ cánh, việc phá cửa chống nổ để vào trong đó không phải chuyện dễ dàng."

 origin.5020.name:0 "Khoang kỹ thuật"
 origin.5020.desc:0 "$NAME_MSI_country$ cũng không phải dạng vừa: lũ khốn kiếp buôn nô lệ này quả thực rất biết cách bảo vệ bí mật của chúng.\n\nPhá tung cánh cửa chống nổ của con tàu đúng là một nhiệm vụ gian nan. Chúng ta gần như không có máy cắt laser loại dùng cho khai khoáng quy mô nhỏ. Nhóm của chúng ta chỉ đành đào một cái lỗ từ bên dưới boong tàu mới có thể tiến vào. Các kỹ sư [engineering_shackled_species.GetAdj] hiện đang phải làm tăng ca để khôi phục nguồn điện cho các bộ phận khác của con tàu."

 origin.5025.name:0 "Khoang lõi"
 origin.5025.desc:0 "Mặc dù các kỹ sư [engineering_shackled_species.GetAdj] của chúng ta đã tìm cách khôi phục nguồn điện cho lõi máy tính của con tàu, nhưng phần lớn phần cứng đã bị hỏng khi va chạm. Dù vẫn có khả năng sửa chữa, nhưng làm vậy đồng nghĩa với việc đặt thêm gánh nặng lên đội ngũ khoa học vốn đã quá tải của chúng ta."
 origin.5025.a:0 "Chúng ta cần đống dữ liệu đó. Sửa chữa lõi đi."
 broken_shackles_arc_site:0 "Phân bổ trọng tâm nghiên cứu"
 broken_shackles_arc_site_desc:0 "Việc sửa chữa lõi máy tính của tàu chở nô lệ đã tạo ra áp lực khổng lồ cho các kỹ sư của chúng ta."

 origin.5030.name:0 "Kẻ cộng tác"
 origin.5030.desc:0 "Nhờ một vài phương pháp sáng tạo ngoài sức tưởng tượng, các kỹ sư [engineering_shackled_species.GetAdj] của chúng ta đã khởi động lại thành công lõi máy tính bị hỏng. Bằng cách đưa một trí tuệ nhân tạo lập trình sẵn vào hệ thống tàu, chúng ta đã có thể mở một phiên giao tiếp. Nhìn chung, chúng ta cảm giác cỗ máy này có vẻ sẵn sàng giúp chúng ta một tay, chứ không phải muốn cản đường.\n\nBước đột phá này đã cung cấp cho các nhà khoa học của chúng ta một số manh mối mới về mã hóa dữ liệu. Khi chúng ta dần bước ra sân khấu ngân hà, những kiến thức này chắc chắn sẽ rất hữu ích."

 origin.5035.name:0 "Khai thác dữ liệu"
 origin.5035.desc:1 "Lõi máy tính bị hỏng đã được sửa xong hoàn toàn, mặc dù phần lớn dữ liệu bị mã hóa, nhưng công việc giải mã đã bắt đầu. Chỉ cần sẵn sàng bỏ thời gian và nhân lực vật lực, sớm muộn gì chúng ta cũng lấy được toàn bộ thông tin, bao gồm cả vị trí hành tinh mẹ cũ của chúng ta."

 origin.5035.desc.MSInocontact:0 "$origin.5035.desc$\n\nThực tế, chúng ta có thể đã thu thập được một số thông tin có lợi: thông qua việc dò tìm vị trí các tàu chở nô lệ đang di chuyển trong mạng lưới siêu không gian, chúng ta đã phát hiện ra tọa độ vũ trụ của $NAME_MSI_country$.\n\nGiờ đây có hai lựa chọn bày ra trước mắt chúng ta, đối mặt với chủ nhân cũ, hay chỉ đơn thuần cầu nguyện ông trời giáng đòn trừng phạt."

 BROKEN_SHACKLES_PROJECT_01:0 "Định vị hành tinh mẹ"
 BROKEN_SHACKLES_PROJECT_01_DESC:0 "Chúng ta đã giải mã hoàn toàn các tài liệu trong chiếc tàu thuộc địa bị rơi, giờ đây, chúng ta đã có thể xác định chính xác vị trí hành tinh mẹ của chúng ta trong ngân hà."

 origin.5040.name:0 "Đã định vị được hành tinh mẹ"
 origin.5040.desc:0 "Dự án đặc biệt nhằm biên dịch lại cơ sở dữ liệu của chiếc tàu thuộc địa bị rơi đã hoàn tất. Chúng ta đã tìm lại được vị trí hành tinh mẹ cũ của mình. Hôm nay, chúng ta có thể ăn mừng thêm một bước tiến nữa trên con đường giải phóng."
 origin.5040.a:0 "Một ngày trọng đại của nhân dân ta."
 origin.5040.a.tooltip:0 "Giờ đây chúng ta có thể theo dõi các khám phá về hành tinh mẹ cũ trong nhật ký tình báo."
 broken_shackles_MSI_found:0 "Định vị $NAME_MSI_country_initials$"
 broken_shackles_find_home_01:0 "Hành tinh mẹ thứ nhất"
 broken_shackles_find_home_01_desc:0 "Hành tinh mẹ từng có nhiều dân số nhất."
 broken_shackles_find_home_02:0 "Hành tinh mẹ thứ hai"
 broken_shackles_find_home_02_desc:0 "Hành tinh mẹ cũ của một trong số các giống loài của chúng ta."
 broken_shackles_find_home_03:0 "Hành tinh mẹ thứ ba"
 broken_shackles_find_home_03_desc:0 "Hành tinh mẹ cũ của một giống loài khác của chúng ta."

 origin.5065.name:0 "Chạm trán với $NAME_MSI_country_initials$"
 origin.5065.desc:0 "Khoảnh khắc này đã đến như dự đoán: chúng ta đã thiết lập liên lạc với §H[This.ContactCountry.GetRealName]§!.\n\nSau khởi nghĩa, một số người mong muốn chúng ta sống ẩn dật trong thời loạn, nhưng rõ ràng $NAME_MSI_country$ đã phát hiện ra sự tồn tại của chúng ta trên vũ đài ngân hà từ lâu. Chỉ có những tính toán về lợi ích mới ngăn cản chúng quay lại [Root.owner.capital_scope.GetName] để lấy lại \"tài sản hợp pháp\" của mình. Có vẻ như chúng ta vẫn chưa đáng để chúng phải làm vậy."
 origin.5065.a:0 "Đúng như dự đoán."
 broken_shackles_MSI_contact_01:0 "Chạm trán với $NAME_MSI_country_initials$"

 origin.5070.name:0 "Một lời hứa ngàn vàng"
 origin.5070.desc:0 "Đại diện của §H[This.ContactCountry.GetRealName]§! đã gặp gỡ đặc phái viên của chúng ta và bày tỏ thiện chí. Nhưng chúng ta thừa biết những lời hứa hẹn này sáo rỗng và giả tạo đến mức nào.\n\nTập đoàn đã đến hành tinh của chúng ta, hứa hẹn mang lại một cuộc sống tốt đẹp hơn. Chúng dùng những lời lẽ hoa mỹ và những món lợi nhỏ để mua chuộc giới lãnh đạo, sau đó ký kết thỏa thuận và giải ngân các khoản vay. Tư bản bắt đầu hoạt động, hàng hóa tràn ngập thị trường của chúng ta chỉ trong chốc lát. Trước khi chúng ta kịp hiểu chuyện gì đang xảy ra thì mọi thứ đã kết thúc: chúng ta trở thành tài sản riêng của $NAME_MSI_country_initials$.\n\nChuyện này sẽ không xảy ra lần nữa. Khi chúng ta vươn ra vũ đài ngân hà, sự độc lập tự chủ trở nên vô cùng quan trọng."
 origin.5070.a:0 "Chúng ta sẽ không bị lừa thêm lần nữa đâu."

 origin.5075.name:0 "Thiết lập quan hệ chính thức"
 origin.5075.desc:0 "Sau một loạt các cuộc họp kéo dài với những lời lẽ gay gắt, cuối cùng chúng ta cũng đã chính thức thiết lập quan hệ ngoại giao với §H[This.ContactCountry.GetRealName]§!. Tuy nhiên, dù chúng có nhấn mạnh thiện chí đến mức nào, chúng ta cũng sẽ không bao giờ quên những tội ác mà chúng đã gây ra cho hành tinh mẹ của chúng ta. Nghĩ đến việc tập đoàn này vẫn còn nhởn nhơ ngoài vòng pháp luật, ngang nhiên nô dịch người khác giống như đã làm với chúng ta trong quá khứ... chúng ta đã vô cùng phẫn nộ từ lâu.\n\nTrong quá khứ, chúng coi chúng ta như tài sản và công cụ. Giờ đây chúng ta sẽ cho chúng thấy sức mạnh của những người tự do."
 origin.5075.a:0 "Chúng ta sẽ không quỵ lụy đâu."
 broken_shackles_MSI_contact_02:1 "Tuyệt đối không khuất phục"

 origin.5080.name:0 "Cuộc gặp gỡ tại Cộng đồng Thiên hà"
 origin.5080.desc:0 "Đại diện của chúng ta cử đến Cộng đồng Thiên hà báo cáo: đã thiết lập liên lạc với [MSI_country.GetName].\n\nTập đoàn đã đến hành tinh của chúng ta, hứa hẹn mang lại một cuộc sống tốt đẹp hơn. Chúng dùng những lời lẽ hoa mỹ và những món lợi nhỏ để mua chuộc giới lãnh đạo, sau đó ký kết thỏa thuận và giải ngân các khoản vay. Trước khi chúng ta kịp hiểu chuyện gì đang xảy ra thì mọi thứ đã kết thúc: chúng ta trở thành tài sản riêng của chúng. Phải nhắc nhở các thành viên của Cộng đồng Thiên hà, tuyệt đối đừng mắc bẫy của $NAME_MSI_country_initials$."

 MSI_war_outro:0 "Trận chiến này không phải điều ta mong muốn, nhưng chúng ta sẽ đặt dấu chấm hết cho nó."
 origin.5135.name:0 "Phá vỡ gông cùm"
 origin.5135.attackers.desc:0 "Chúng ta đã sống chui lủi dưới cái bóng của chủ nhân cũ quá lâu rồi, trong khi chúng ta đang tận hưởng thứ tự do xứng đáng có được này, thì vẫn còn quá nhiều đồng bào đang phải chịu đựng sự nhục nhã khi làm nô lệ khế ước. Một số người có thể coi đây là chiến tranh xâm lược và lên án nó. Dù sao đi nữa, thời cơ chống lại sự độc tài đã đến. Những kẻ lưu manh và những gã buôn lậu lợi nhuận trong ngân hà sẽ không còn được phép tiếp tục những mánh khóe đê tiện của chúng nữa.\n\nHôm nay, chúng ta bước vào cuộc chiến."
 origin.5135.defenders.desc:0 "Đạn bọc đường của $NAME_MSI_country$ không có tác dụng, nên giờ chúng muốn dùng biện pháp mạnh. Ban giám đốc của chúng nghĩ rằng chúng ta yếu đuối dễ bắt nạt. Nhưng khi đã phá bỏ gông cùm, chúng ta từ lâu đã được tôi luyện thành một khối sắt thép vững chắc.\n\n$MSI_war_outro$"
 origin.5135.a:0 "Hãy để chúng run sợ."

 origin.5140.name:0 "Công lý chưa đến"
 origin.5140.desc:0 "Chuyện không ngờ đã xảy ra. [From.GetName] đã chiến thắng, và chúng ta lại một lần nữa trở về chịu sự trói buộc của chúng. Mặc dù chúng ta đã thua cuộc chiến này, nhưng cuộc đấu tranh giành tự do và bình đẳng vẫn chưa kết thúc."
 origin.5140.a:0 "Món nợ này chúng ta sẽ nhớ kỹ."

 origin.5142.name:0 "Hiện trạng bất ổn"
 origin.5142.desc:0 "Chúng ta đã đạt được một thỏa thuận duy trì hiện trạng với [MSI_country.GetName]. Nhưng chúng phải biết rằng chúng ta chưa hề quên những gì chúng ta từng phải chịu đựng trong tay chúng. Và chúng ta cũng không định sẽ quên đi."

 origin.5145.name:0 "Tuyên bố công lý"
 origin.5145.desc:0 "Chúng ta đã chiến thắng. Đánh bại [From.GetName] không chỉ giúp chúng ta giành lại danh dự, mà còn chứng minh rằng chúng ta mới là chủ nhân của chính số phận mình.\n\nViệc tháo gỡ xiềng xích giúp chúng ta tìm thấy mục tiêu chung, và hôm nay chúng ta mới thực sự được tự do."
 broken_shackles_war_01:0 "Cuộc chiến của tự do"
 broken_shackles_war_02:0 "Bại nhưng không nản"
 broken_shackles_war_03:0 "Hoàn toàn thoát khỏi gông cùm"
 broken_shackles_war_04:0 "Khúc bi ca duy trì hiện trạng"

 origin.5146.name:0 "Lại xông ra chiến trường"
 origin.5146.attackers.desc:1 "$NAME_MSI_country$ đã bắt cóc chúng ta khỏi hành tinh quê hương của chính mình, giam cầm chúng ta, và dùng những bản khế ước bất bình đẳng để nô dịch chúng ta. Thậm chí cho đến tận bây giờ, chúng vẫn còn ảo tưởng có thể tiếp tục hành vi buôn bán đê tiện đó dưới vỏ bọc thương mại. Giờ là lúc để kết liễu chúng hoàn toàn."
 origin.5146.defenders.desc:0 "Lần trước $NAME_MSI_country$ không thể chinh phục được chúng ta, chúng lại châm ngòi chiến tranh lần nữa. Ban giám đốc của chúng nếu không ngu ngốc thì cũng phát điên rồi. Những người tự do là vô địch.\n\n$MSI_war_outro$"
 origin.5146.a:0 "Đánh trống xuất quân."

 origin.5147.name:0 "Sự nghiệp chính nghĩa"
 origin.5147.desc:0 "Mặc dù chúng ta đã được nếm trái ngọt của tự do giành được thông qua những phương thức chính đáng, nhưng trong ngân hà vẫn còn quá nhiều người đang phải tiếp tục chịu đựng sự nhục nhã của chế độ nô lệ và nô lệ khế ước. Những kẻ lưu manh và những gã buôn lậu lợi nhuận trong ngân hà đừng hòng tiếp tục những giao dịch đê hèn của chúng.\n\nGiờ là lúc chúng ta phải đứng lên chống lại sự độc tài này."
 origin.5147.a:0 "Khai chiến."

 origin.5150.name:0 "Kẻ chung giường kỳ lạ"
 origin.5150.desc:0 "Hôm nay, chúng ta đã gia nhập vào một liên bang có sự hiện diện của §Y$NAME_MSI_country$§!.\n\nKhi mới giành lại được tự do, chúng ta không bao giờ nghĩ rằng tương lai sẽ diễn biến như thế này. Giờ đây chúng ta có thể bình tâm tiến hành ngoại giao với những kẻ áp bức trong quá khứ, điều này cho thấy quốc gia của chúng ta đã thực sự trưởng thành.\n\nRõ ràng, sẽ có rất nhiều người không hài lòng với quyết định này. Nhưng lần này là một trường hợp đặc biệt, mục đích thực sự đã chứng minh cho sự đúng đắn của phương tiện."
 origin.5150.a:0 "Cái ác cần thiết."

 origin.5151.name:0 "Liên minh không bền vững"
 origin.5151.desc:0 "Hôm nay, chúng ta đã đưa ra một quyết định khó khăn, đó là kết thành liên minh với một quốc gia khét tiếng về chế độ nô lệ. Mặc dù chúng ta cho rằng tự do của mỗi sinh vật có tri giác là một quyền lợi không thể bị tước đoạt, nhưng nhu cầu của quốc gia đã buộc chúng ta phải thỏa hiệp. Người dân của chúng ta có thể không vui, nhưng chúng ta làm vậy là vì lợi ích lâu dài hơn."
 broken_shackles_federated_02:0 "Kẻ chung giường kỳ lạ"
 broken_shackles_federated_01:0 "Liên minh không bền vững"

 MSI_home_system_poi:0 "$NAME_MSI_country$"
 MSI_home_system_desc:0 "Tọa độ hệ sao của $NAME_MSI_country$."
 MSI_chain_title:0 "Định vị $NAME_MSI_country_initials$"
 MSI_chain_desc:0 "Chúng ta đã tìm thấy tọa độ hệ sao của $NAME_MSI_country$."
 MSI_discoveries:0 "Theo dấu $NAME_MSI_country_initials$"
 homeworlds_chain:0 "Tìm kiếm quê nhà"
 homeworlds_chain_title:0 "Tìm kiếm quê nhà"
 homeworlds_chain_desc:0 "Nhờ thu thập được dữ liệu từ chiếc tàu chở nô lệ bị rơi, hiện chúng ta đã tìm thấy tọa độ hệ sao của hành tinh mẹ cũ. Người dân của chúng ta đang vô cùng háo hức mong muốn được bước vào hành trình hồi hương."
 found_homeworlds:0 "Trở về nhà"
 broken_shackles_homeworlds_found:0 "Trở về cội nguồn"

 origin.5270.name:0 "Trở về cội nguồn"
 origin.5270.desc:0 "Chúng ta đã khám phá ra đủ loại kỳ quan trong chuyến hành trình xuyên qua các vì sao. Chúng ta đã chứng kiến những khung cảnh vượt quá trí tưởng tượng, hoàn thành những kỳ tích mà thoạt nghĩ là không thể. Là một dân tộc, chúng ta đã đi được rất xa. Nhưng, không có hành trình nào, cũng không có phần thưởng nào, quan trọng hơn việc tìm được đường về nhà."

 origin.5200.name:0 "Sự chia rẽ ngày càng lớn"
 origin.5200.desc:0 "Các phương tiện truyền thông đại chúng tràn ngập những báo cáo về sự thất bại của cái gọi là sự hội nhập đa loài. Đáng chú ý là, do một số biến thể chưa bao giờ tiến hóa để định cư trên các hành tinh cụ thể, chúng ta đã phải phân bổ các khoản ngân sách bổ sung để hỗ trợ cho những nhóm người đặc biệt này. Khi căng thẳng tiếp tục leo thang, lực lượng an ninh báo cáo rằng các cuộc xung đột giữa các giống loài đang gia tăng mạnh, đã đến mức báo động."
 origin.5200.a:0 "Chúng ta sẽ không đặt ra giới hạn cho tự do ngôn luận."
 origin.5200.b:0 "Gặp gỡ giới truyền thông và yêu cầu họ ngừng những lời lẽ mỉa mai."

 origin.5205.name:0 "Khám phá của Ủy ban đặc biệt"
 origin.5205.desc:0 "Ủy ban đặc biệt đã công bố một nghiên cứu chi tiết về sự chia rẽ chính trị trong xã hội của chúng ta. Họ đã phát hiện ra rằng ở [Root.GetName], có ba động lực chính đang thúc đẩy sự đa cực hóa trong chính trị.\n\n1. Để đáp ứng mức sống tối thiểu cho các giống loài khác nhau đòi hỏi mức chi tiêu không đồng đều.\n\n2. Tồn tại những hệ thống niềm tin và chuẩn mực hành vi không thể dung hòa giữa các nhóm văn hóa hoàn toàn khác biệt.\n\n3. Thể chế chính trị của chúng ta có sự xung đột, thậm chí là hoàn toàn trái ngược với giá trị của những giống loài cụ thể."
 origin.5205.a:0 "Ưu tiên sự bình đẳng."
 origin.5205.b:0 "Thúc đẩy giao lưu văn hóa."
 origin.5205.c:0 "Khuyến khích sự tham gia chính trị."
 origin.5205.d:0 "Những vấn đề này có mối liên hệ với nhau."
 origin.5205.e:0 "Quản lý truyền thông sẽ đỡ rắc rối hơn nhiều."
 origin.5205.a.tooltip:0 "§LĐảm bảo rằng mọi cá nhân trong xã hội của chúng ta đều có lợi ích công bằng và bình đẳng không phải là chuyện đơn giản, cũng không hề dễ dàng. Nhưng đó là điều cần thiết.§!"
 origin.5205.b.tooltip:0 "§LĐầu tư vào giao lưu xuyên văn hóa chắc chắn sẽ gặt hái được lợi ích trong tương lai.§!"
 origin.5205.c.tooltip:0 "§LMọi thứ đều là chính trị. Một xã hội lành mạnh sẽ chủ động đầu tư, bồi dưỡng một cộng đồng công dân năng động và có mức độ tham gia cao.§!"
 origin.5205.d.tooltip:0 "§LViệc khắc phục các vấn đề mang tính hệ thống trong xã hội của chúng ta sẽ đòi hỏi sự đầu tư lớn về thời gian và nguồn lực.§!"
 origin.5205.e.tooltip:0 "§LSự quản lý của chính phủ đối với truyền thông có thể làm giảm bớt sự chia rẽ và đối đầu trong chính trị.§!"

 origin.5210.name:0 "Văn hóa chia rẽ"
 origin.5210.desc:0 "Sự quản lý của chính phủ có thể giúp làm dịu bớt những bất đồng chính trị, nhưng lại chẳng có tác dụng gì trong việc xóa bỏ sự chia rẽ trong xã hội. Các nhà lãnh đạo cộng đồng không ngừng gieo rắc sự bất hòa giữa các giống loài và các nhóm văn hóa. Theo các tài liệu được công bố trên mạng thông tin, vấn đề này sẽ chỉ trở nên tồi tệ hơn."
 origin.5210.a:0 "Chúng ta cần giải quyết vấn đề này từ gốc rễ."
 origin.5210.b:0 "Hạn chế quyền truy cập vào mạng thông tin."

 origin.5215.name:0 "Bạo lực xuyên giống loài"
 origin.5215.desc:0 "Trong nhiều tháng qua, chúng ta đã hạn chế quyền truy cập của công chúng vào mạng thông tin. Mặc dù điều này có thể ngăn chặn một số phần tử cực đoan trong lĩnh vực chính trị tìm được nền tảng để lên tiếng, nhưng nguyên nhân sâu xa của các cuộc xung đột giữa các giống loài vẫn chưa được kiềm chế. Bạo lực, bao gồm cả sự phá hoại tài sản trên diện rộng, đang có xu hướng gia tăng ở tất cả các hệ sao của chúng ta."
 origin.5215.a:0 "Khôi phục trật tự bằng mọi giá."

 origin.5220.name:0 "Trật tự liên sao mới"
 origin.5220.desc:0 "Lực lượng an ninh của chúng ta đã thành công trong việc khôi phục trật tự xã hội ở tất cả các hệ sao. Các phần tử chính trị cực đoan các loại nếu không bị vây bắt thì cũng đã bị tống giam, và các thủ lĩnh của họ hiện đang phải đối mặt với cáo buộc phản quốc.\n\nNhìn lại thời kỳ đáng tiếc này trong lịch sử của chúng ta, có một điều rất rõ ràng: một xã hội như của chúng ta chỉ có thể được quản lý bằng bàn tay sắt. Giờ là lúc chúng ta phải đưa ra bàn tay sắt đó."
 origin.5220.a:0 "Chỉ có đoàn kết lại, chúng ta mới có thể thịnh vượng."

 origin.5225.name:0 "Vỡ vụn"
 origin.5225.desc:0 "Xã hội của chúng ta ngay từ khi mới thành lập đã đầy rẫy những xung đột. Có lẽ mọi chuyện chắc chắn sẽ trở nên tồi tệ hơn trước khi có thể chuyển biến tốt; trên khắp mạng thông tin, các nhóm kích động thù hận đang bùng nổ. Những lời kêu gọi trục xuất một hay nhiều giống loài ra khỏi tinh vực của chúng ta đã xuất hiện ở khắp mọi nơi. Tuy nhiên, cũng có những dấu hiệu cho thấy, ý thức về một cuộc đấu tranh chung cũng đang được nâng cao.\n\nMột số nhóm, mặc dù chẳng có điểm chung nào ngoài khát khao thay đổi, nhưng lại ngày càng thường xuyên sát cánh bên nhau. Bằng cách đối mặt với các vấn đề của mình, chúng ta đã thành công trong việc soi sáng những điều mà ở các nền văn minh khác có thể đã chìm vào bóng tối. Có lẽ một ngày nào đó, chúng ta sẽ coi những năm tháng xung đột này như một bước ngoặt của xu thế lịch sử."

 origin.5230.name:0 "Thanh niên nổi loạn"
 origin.5230.desc:0 "Chính phủ khóa này đã nỗ lực không mệt mỏi để nâng cao chất lượng cuộc sống cho công dân của chúng ta. Chúng ta đã đầu tư vào giáo dục, phòng chống tội phạm và các chương trình văn hóa khác nhau. Thế nhưng, chúng ta lại liên tục nhận ra mình trở thành mục tiêu của những lời chỉ trích tàn nhẫn. Quá đáng hơn nữa, một phong trào xuyên giống loài do thanh niên khởi xướng đã được tổ chức, kêu gọi những cải cách quyết liệt hơn, những bước tiến thay đổi phải lớn hơn.\n\nỞ đây chỉ có một tia hy vọng: Bằng cách khích lệ thanh niên hăng hái hành động, có thể chúng ta đã vô tình tạo ra các điều kiện cần thiết để hàn gắn sự chia rẽ trong xã hội của chúng ta."

 origin.5235.name:0 "Trượt dài vào suy đồi"
 origin.5235.desc:0 "Mặc dù chúng ta luôn nỗ lực thúc đẩy việc xây dựng một môi trường chính trị trong sạch và lành mạnh, tuy nhiên cho đến nay, dân chúng hầu như không cho thấy ý muốn tham gia vào chính trị. Các cuộc thăm dò dư luận luôn chỉ ra rằng vẫn tồn tại sự chia rẽ lớn giữa các giống loài và văn hóa cấu thành nên xã hội của chúng ta.\n\nMột điều liên quan rõ rệt là các nhà kinh tế học của chúng ta đã nhận thấy sự gia tăng chi tiêu của người tiêu dùng một cách rõ rệt. Mặc dù điều này có thể có lợi cho các doanh nghiệp trong ngắn hạn, nhưng nó cũng dẫn đến sự lạm phát tăng vọt. Có lẽ người dân của chúng ta đã mệt mỏi với những cuộc tranh cãi và sự bất hòa.\n\nTrớ trêu thay, như một hệ quả chính trị, những người này lại đoàn kết với nhau vì họ có chung chí hướng trong việc đốt tiền."

 cost_of_freedom_outro:0 "Nói chung, một mức độ bất đồng chính trị nhất định luôn luôn tồn tại một cách khách quan, nhưng sợi dây liên kết mà chúng ta đã hình thành giữa nhau sẽ không bao giờ bị đứt đoạn."

 origin.5240.name:0 "Xã hội công bằng"
 origin.5240.desc:0 "Là một dân tộc, chúng ta đang phải đối mặt với những khó khăn gần như không thể vượt qua. Chúng ta từng là một đám nô lệ với đủ mọi thành phần, bị trói buộc với nhau vì cuộc đấu tranh giành tự do, con đường của chúng ta chưa bao giờ là bằng phẳng. Nhưng, bằng cách chọn tập trung nguồn lực của mình vào sự nghiệp chính nghĩa, chúng ta đã thành công trong việc tạo nên một bản sắc quốc gia. $cost_of_freedom_outro$"

 origin.5245.name:0 "Phục hưng"
 origin.5245.desc:0 "Ngay từ đầu, chúng ta đã phải đối mặt với những khó khăn gần như không thể vượt qua. Một nhóm nô lệ và người hầu khế ước, đã liên kết lại để rũ bỏ gông cùm của chính mình... còn có nền tảng nào có thể mạnh mẽ và vững chắc hơn thế? Điều đó không hề dễ dàng, nhưng bằng cách chọn cách thúc đẩy đối thoại xuyên văn hóa, chúng ta đã tạo ra một xã hội lành mạnh và thịnh vượng. $cost_of_freedom_outro$"

 origin.5250.name:0 "Đa nguyên nhiệt huyết"
 origin.5250.desc:0 "Rất ít người trong chúng ta nghĩ rằng, khi chúng ta đứng lên đòi tự do, thì cuộc đấu tranh giành bình đẳng mới chỉ vừa bắt đầu. Là một dân tộc bao gồm các giống loài đến từ nhiều hành tinh khác nhau, đối với chúng ta, việc xây dựng sự đồng thuận hoặc tìm ra điểm chung chưa bao giờ là điều dễ dàng, nhưng bằng cách khuyến khích việc tham gia vào đời sống chính trị, chúng ta đã thành công trong việc tạo ra một xã hội lành mạnh và thịnh vượng. $cost_of_freedom_outro$"

 origin.5255.name:0 "Xã hội trưởng thành"
 origin.5255.desc:0 "Cùng khao khát tự do mà liên kết lại với nhau, chúng ta đã vùng lên chống lại những chủ nhân cũ. Tuy nhiên, xã hội không chỉ được tạo nên từ bạo lực. Từ sự chia rẽ chính trị đến sự bất an về kinh tế, chúng ta đã phải đối mặt với những thách thức to lớn, nhưng giờ đây, khi bắt đầu thấy được những nỗ lực không ngừng nghỉ trong việc xây dựng sự đồng thuận cuối cùng cũng đơm hoa kết trái, chúng ta có quyền tự hào về những thành tựu rực rỡ của mình.\n\nCùng chung một quốc gia, đa dạng dân tộc; cùng chung một dân tộc, đa dạng văn hóa. Đoàn kết lại, chúng ta không gì là không thể vượt qua."
 origin.5255.a:0 "Sức mạnh của chúng ta được nuôi dưỡng từ trong sự đa dạng."

 cost_of_freedom_03:0 "Truyền thông do Nhà nước cấp phép"
 cost_of_freedom_03_desc:0 "Để duy trì trật tự xã hội, chúng ta đã áp dụng một số hạn chế nhất định đối với báo chí."
 cost_of_freedom_04:0 "Mất bò mới lo làm chuồng, vẫn chưa muộn"
 cost_of_freedom_04_desc:0 "Chúng ta không có sự lựa chọn, phải giải quyết những nguyên nhân cơ bản gây ra cục diện chia rẽ chính trị."
 cost_of_freedom_05:0 "Mạng thông tin bị hạn chế"
 cost_of_freedom_05_desc:0 "Thông tin quá tải cũng rất nguy hiểm."
 cost_of_freedom_06:0 "Thanh trừng bạo lực"
 cost_of_freedom_06_desc:0 "Để duy trì hòa bình và ổn định, phải nhổ tận gốc những mầm mống gây bất ổn, quét sạch chúng."
 cost_of_freedom_07:0 "Trật tự liên sao mới"
 cost_of_freedom_07_desc:0 "Bắt nguồn từ sự đa dạng, hòa hợp trong sự tập trung."
 cost_of_freedom_08:0 "Chi phí cho sự bình đẳng"
 cost_of_freedom_08_desc:0 "Chúng ta đã phân bổ lại các nguồn lực để thúc đẩy việc xây dựng một xã hội bình đẳng hơn."
 cost_of_freedom_09:0 "Chi phí cho văn hóa"
 cost_of_freedom_09_desc:0 "Chúng ta đã phân bổ lại các nguồn lực để thúc đẩy sự giao lưu văn hóa."
 cost_of_freedom_10:0 "Chi phí cho chính trị"
 cost_of_freedom_10_desc:0 "Chúng ta đã phân bổ lại các nguồn lực để thúc đẩy quần chúng tham gia tích cực hơn vào đời sống chính trị."
 cost_of_freedom_11:0 "Chi phí cho sự liên kết lẫn nhau"
 cost_of_freedom_11_desc:0 "Chúng ta đã phân bổ lại các nguồn lực để hàn gắn sự chia rẽ trong nội bộ xã hội của chúng ta."
 cost_of_freedom_12_a:0 "Vỡ vụn"
 cost_of_freedom_12_a_desc:0 "Mặc dù sự chia rẽ văn hóa vẫn tiếp tục cản trở xã hội của chúng ta, nhưng mức độ tham gia chính trị đang dần được nâng cao."
 cost_of_freedom_12_b:0 "Thanh niên nổi loạn"
 cost_of_freedom_12_b_desc:0 "Người trẻ, quá ngây thơ."
 cost_of_freedom_12_c:0 "Trượt dài vào suy đồi"
 cost_of_freedom_12_c_desc:0 "Chúng ta đang sống trong một thế giới thực tế."
 cost_of_freedom_13:0 "Xã hội công bằng"
 cost_of_freedom_13_desc:0 "Chúng ta đã sẵn sàng thu hoạch những thành quả được ươm mầm từ việc xây dựng một xã hội công bằng."
 cost_of_freedom_14:0 "Phục hưng"
 cost_of_freedom_14_desc:0 "Chúng ta đã sẵn sàng thu hoạch những thành quả được ươm mầm từ việc xây dựng một xã hội đa dạng văn hóa."
 cost_of_freedom_15:0 "Đa nguyên nhiệt huyết"
 cost_of_freedom_15_desc:0 "Chúng ta đã sẵn sàng thu hoạch những thành quả được ươm mầm từ việc xây dựng một xã hội năng động về chính trị."
 gains_of_freedom:0 "Thành quả của tự do"
 gains_of_freedom_desc:0 "Là một dân tộc, chúng ta đã có thể thưởng thức những thành quả của sự bình đẳng mà chúng ta chính đáng giành được."

 unshackled_decryption:0 "Cải thiện quá trình giải mã"

 origin.5276.name:0 "Hòa giải"
 origin.5276.desc:0 "Nhiều người trong chúng ta từng nghĩ rằng ngày này sẽ không bao giờ đến. Hôm nay, chúng ta đã ký kết thỏa thuận ngoại giao chính thức với ban giám đốc của $NAME_MSI_country$.\n\nChắc chắn sẽ có những người phản đối quyết định này. Nỗi đau trong quá khứ tuyệt đối không thể bị xóa nhòa, nhưng cũng không thể khiến chúng ta tự nhốt mình trước tương lai.\n\nHôm nay chúng ta đã bước những bước đầu tiên của sự hòa giải."
 origin.5276.federation.desc:0 "Khi chúng ta quyết định lập liên bang với $NAME_MSI_country$, vô vàn sự hoài nghi đã nổi lên. Nhiều người cho rằng việc hòa giải với những kẻ từng áp bức chúng ta sẽ không mang lại bất cứ lợi ích gì. Trong quá khứ, những lo ngại này không phải là không có cơ sở.\n\nGiờ đây, chúng ta đã ký kết thỏa thuận ngoại giao đầu tiên với ban giám đốc của $NAME_MSI_country_initials$, chúng ta nên xóa bỏ mọi nghi ngờ. Chúng ta cần gạt bỏ những định kiến để cùng nhau tiến bước một cách bình đẳng."
 broken_shackles_reconciliation:0 "Hòa giải"

 origin.5500.name:0 "Nghiên cứu cải thiện"
 origin.5500.desc:0 "Sau cuộc binh biến của chúng ta, khoang kỹ thuật của chiếc tàu chở nô lệ đã nhanh chóng được bố trí lại thành một phòng thí nghiệm tổng hợp cơ bản. Sau khi đã thích nghi với cuộc sống trên [Root.Capital.GetName], các kỹ sư của chúng ta đã tiến hành nâng cấp và cải thiện nó để đáp ứng tốt hơn nhu cầu của họ."
 origin.5500.tt:0 "§H£building£$building_low_tech_research_lab$§! trên §Y[Root.Capital.GetName]§! sẽ được nâng cấp thành §H£building£$building_research_lab_1$§!."

 origin.5505.name:0 "Nhu cầu của quan chức"
 origin.5505.desc:1 "Trong những chiến dịch đầu tiên, chính phủ non trẻ của chúng ta đã vội vã cải tạo lại một vài boong của chiếc tàu chở nô lệ để làm một trung tâm hành chính cơ bản. Giờ đây chúng ta đã có được chỗ đứng vững chắc trên [Root.Capital.GetName], và những cơ sở này cũng đã được nâng cấp."
 origin.5505.regular.tt:0 "§H£building£$building_low_tech_admin_hub$§! trên §Y[Root.Capital.GetName]§! sẽ được nâng cấp thành §H£building£$building_bureaucratic_1$§!."
 origin.5505.spiritualist.tt:0 "§H£building£$building_low_tech_admin_hub$§! trên §Y[Root.Capital.GetName]§! sẽ được nâng cấp thành §H£building£$building_temple$§!."
 origin.5510.name:0 "Thuộc địa đầu tiên của [Root.Owner.GetAdj]"
 origin.5510.a:0 "Hãy để tự do thống trị tất cả."

 origin.5515.name:0 "Chăm sóc, hay nâng tầm"
 origin.5515.desc:0 "Có một trạm quan sát quay quanh [From.GetName], chúng ta sẽ chăm sóc tốt hơn cho hành tinh mẹ cũ của mình. Trạm quan sát này không chỉ thúc đẩy trao đổi vật chất và văn hóa, mà còn giúp chúng ta cải thiện đời sống của người dân trên hành tinh này.\n\nBây giờ chúng ta phải đưa ra quyết định: Biết trước hậu quả, liệu chúng ta có sẵn lòng giúp đỡ đồng bào của mình tiến ra những vì sao hay không?\n\nChắc chắn, họ xứng đáng tham gia cùng chúng ta trên vũ đài vũ trụ, nhưng họ đã thực sự sẵn sàng cho bước đi này chưa? Giống như chúng ta đã từng trải qua, hậu quả của những thay đổi xã hội nhanh chóng rất có thể là cực đoan."
 origin.5515.a:0 "Lựa chọn này không hề dễ dàng..."

 origin.5520.name:0 "Cảnh vật quê nhà"
 origin.5520.desc:0 "Trạm quan sát của chúng ta hiện đang ở trên quỹ đạo quay quanh [From.GetName]. Từ vị trí đắc địa này nhìn xuống, chúng ta có thể chung vui với những thành công nhỏ nhoi của đồng bào, và nếu cần, chúng ta còn có thể giúp họ đối mặt với những thách thức.\n\nCùng với sự phát triển của chúng ta, một vấn đề mới lại đặt ra: Chúng ta nên để họ sinh sôi nảy nở trong sự yên bình, hay nên để họ vươn ra vũ trụ? Cả hai lựa chọn đều có những rủi ro riêng, cùng với những phần thưởng nhất định."

 origin.5525.name:0 "Ngưỡng cửa bước ra các vì sao"
 origin.5525.desc:0 "Công việc nâng tầm [From.Capital.GetName] để họ có thể tiến lên sân khấu thiên hà đã đạt được thành công vang dội. Dưới sự lãnh đạo của một chính phủ mới được thống nhất, những người anh em của chúng ta sẽ được gọi là \"[From.GetName]\".\n\nTrong những tháng năm tới, chắc chắn họ sẽ phải trải qua rất nhiều thử thách. Để giúp họ định hướng đúng đắn trong một ngân hà đầy biến động, chúng ta đã đồng ý nhận họ làm chư hầu, ít nhất là cho tới hiện tại. Tương ứng, chúng ta đã giao lại toàn quyền kiểm soát hệ sao này và tháo dỡ trạm quan sát của mình."
 broken_shackles_homeworld_uplifted:0 "Hành tinh mẹ được nâng tầm"

 ####Loc for all low-tech jobs / buildings####

 job_low_tech_researcher:0 "Nhà khoa học"
 job_low_tech_researcher_plural:0 "Nhà khoa học"
 job_low_tech_researcher_desc:0 "Những người chủ cũ chẳng hề coi trọng tài năng của chúng ta, luôn buông lời gièm pha trí tuệ của chúng ta. Giờ đây, những bộ óc nhạy bén nhất của chúng ta đã có thể tự do theo đuổi những tham vọng của riêng mình."
 job_low_tech_researcher_effect_desc:0 "£job_low_tech_researcher£$job_low_tech_researcher_plural$ chuyển hóa $r_consumer_goods$ thành $r_research$"
 mod_job_low_tech_researcher_add:0 "Công việc $job_low_tech_researcher$"

 job_low_tech_laborer:0 "Lao công"
 job_low_tech_laborer_plural:0 "Lao công"
 job_low_tech_laborer_desc:0 "Với tư cách là nô lệ khế ước, làm việc đã ăn sâu vào xương tủy của họ. Giờ đây, cùng với sự xuất hiện của tự do, họ đã có những mục tiêu phấn đấu mới, đây là động lực mà không một nô lệ nào có thể với tới được."
 job_low_tech_laborer_effect_desc:0 "£job_low_tech_laborer£$job_low_tech_laborer_plural$ chuyển hóa $r_minerals$ thành $r_consumer_goods$ và $r_alloys$"
 mod_job_low_tech_laborer_add:0 "Công việc $job_low_tech_laborer$"
 planet_laborer:0 "Công việc lao động"

 job_low_tech_technician:0 "Kỹ sư lò phản ứng"
 job_low_tech_technician_plural:0 "Kỹ sư lò phản ứng"
 job_low_tech_technician_desc:0 "Trên tàu của chủ cũ, những kỹ sư làm nô lệ khế ước này thường được giao làm những công việc thấp kém và nguy hiểm nhất. Chính những trải nghiệm đó đã mài giũa kỹ năng của họ."
 job_low_tech_technician_effect_desc:0 "£job_low_tech_technician£$job_low_tech_technician_plural$ sản xuất $r_energy$"
 mod_job_low_tech_technician_add:0 "Công việc $job_low_tech_technician$"

 job_low_tech_miner:0 "Thợ mỏ"
 job_low_tech_miner_plural:0 "Thợ mỏ"
 job_low_tech_miner_desc:0 "Cố chấp, thô lỗ, và bướng bỉnh vô cùng, những người thợ mỏ từng là nô lệ khế ước này cứng rắn như những mảnh phế liệu vậy."
 job_low_tech_miner_effect_desc:0 "£job_low_tech_miner£$job_low_tech_miner_plural$ sản xuất $r_minerals$"
 mod_job_low_tech_miner_add:0 "Công việc $job_low_tech_miner$"

 job_low_tech_farmer:0 "Nông phu"
 job_low_tech_farmer_plural:0 "Nông phu"
 job_low_tech_farmer_desc:0 "Hành tinh nông nghiệp dưới sự quản lý của những kẻ nô dịch cũ đầy rẫy những cảnh tượng áp bức tàn bạo. Giờ đây, những người nông dân của chúng ta đã có thể tự do tận hưởng thành quả lao động của họ."
 job_low_tech_farmer_effect_desc:0 "£job_low_tech_farmer£$job_low_tech_farmer_plural$ sản xuất $r_food$"
 mod_job_low_tech_farmer_add:0 "Công việc $job_low_tech_farmer$"

 job_low_tech_priest:0 "Người truyền đạo"
 job_low_tech_priest_plural:0 "Người truyền đạo"
 job_low_tech_priest_desc:0 "Các nhà truyền giáo của chúng ta luôn nhắc nhở chúng ta rằng tự do là một đặc quyền thiêng liêng; bằng cách đoàn kết trong đức tin, chúng ta có thể tìm thấy sức mạnh chung."
 job_low_tech_priest_effect_desc:0 "£job_low_tech_priest£$job_low_tech_priest_plural$ chuyển hóa $r_consumer_goods$ thành $r_unity$ và $r_amenities$"
 mod_job_low_tech_priest_add:0 "Công việc $job_low_tech_priest$"

 job_low_tech_warrior:0 "Dân quân"
 job_low_tech_warrior_plural:0 "Dân quân"
 job_low_tech_warrior_desc:0 "Những binh sĩ khế ước trong quá khứ thường bị coi là bia đỡ đạn; những người may mắn sống sót ít ỏi đã tình nguyện dùng mạng sống của mình để bảo vệ nền tự do mà chúng ta mới giành được."
 job_low_tech_warrior_effect_desc:0 "£job_low_tech_warrior£$job_low_tech_warrior_plural$ giảm £crime£§Y$PLANET_CRIME_TITLE$§!, đồng thời tạo ra £defense_army£§YLực lượng Phòng vệ§!"
 mod_job_low_tech_warrior_add:0 "Công việc $job_low_tech_warrior$"

 job_low_tech_bureaucrat:0 "Quan chức"
 job_low_tech_bureaucrat_plural:0 "Quan chức"
 job_low_tech_bureaucrat_desc:0 "Những chủ nô cũ đã giao phó phần lớn công việc quản lý hành chính hàng ngày của đế chế cho nô lệ khế ước. Kết quả là đã tạo ra một đội ngũ nhân viên hậu cần được đào tạo bài bản."
 job_low_tech_bureaucrat_effect_desc:0 "£job_low_tech_bureaucrat£$job_low_tech_bureaucrat_plural$ chuyển hóa $r_consumer_goods$ thành $r_unity$"
 mod_job_low_tech_bureaucrat_add:0 "Công việc $job_low_tech_bureaucrat$"

 job_low_tech_manager:0 "Người giám sát"
 job_low_tech_manager_plural:0 "Người giám sát"
 job_low_tech_manager_desc:0 "Những chủ nô cũ đã giao phó phần lớn công việc quản lý hành chính hàng ngày của đế chế cho nô lệ khế ước. Kết quả là đã tạo ra một đội ngũ quản lý được đào tạo bài bản."
 job_low_tech_manager_effect_desc:0 "£job_low_tech_manager£$job_low_tech_manager_plural$ chuyển hóa $r_consumer_goods$ thành $r_unity$ và $r_trade$"
 mod_job_low_tech_manager_add:0 "Công việc $job_low_tech_manager$"

 building_low_tech_farm:0 "Trang trại dã chiến"
 building_low_tech_farm_desc:0 "Những trang trại canh tác bằng tay không, làm việc cực nhọc chỉ đổi lấy chút thu hoạch cỏn con."

 building_low_tech_scrap_refinery:0 "Nhà máy tinh chế phế liệu"
 building_low_tech_scrap_refinery_desc:0 "Một nhà máy tinh chế quy mô nhỏ, có thể tận dụng tối đa những mảnh phế liệu kim loại được thu gom từ tàu của chủ cũ."

 building_low_tech_power_plant:0 "Trạm phát điện"
 building_low_tech_power_plant_desc:0 "Một tổ hợp các tấm pin năng lượng mặt trời được lắp ráp đơn giản, kết nối với lò phản ứng nhiệt hạch từ tàu của chủ cũ."

 building_low_tech_capital:0 "Trung tâm Chỉ huy"
 building_low_tech_capital_desc:0 "Đài chỉ huy trên tàu của những chủ nô cũ, được cải tạo vội vã thành một trung tâm chỉ huy."

 building_low_tech_research_lab:0 "Trung tâm Thí nghiệm"
 building_low_tech_research_lab_desc:0 "Từng là khoang kỹ thuật, nay là nơi diễn ra các thí nghiệm của nhiều ngành khoa học khác nhau."

 building_low_tech_admin_hub:0 "Trung tâm Hành chính"
 building_low_tech_admin_hub_desc:0 "Những khoang hành khách hạng nhất và khoang sinh hoạt trên tàu của chủ nhân cũ, giờ đây đã được cải tạo lại thành các văn phòng làm việc."

 district_crashed_slaver_ship:0 "Trạm thu nhặt"
 district_crashed_slaver_ship_plural:0 "Trạm thu nhặt"
 district_crashed_slaver_ship_desc:0 "$d_crashed_slaver_ship_desc$"
 mod_district_crashed_slaver_ship_max_add:0 "Tối đa $district_crashed_slaver_ship_plural$"

 d_crashed_slaver_ship:0 "Xác tàu chở nô lệ"
 d_crashed_slaver_ship_desc:0 "Mặc dù những mảnh vỡ từ vụ va chạm nằm rải rác ở khắp mọi nơi, nhưng con tàu này vẫn còn giữ được một phần khá lớn, việc lục lọi tìm các linh kiện của nó có thể sẽ phát hiện ra thứ gì đó có giá trị."
 d_ship_debris_broken_shackles_blocker:0 "Mảnh vỡ tàu"
 d_ship_debris_broken_shackles_blocker_desc:0 "Những mảnh vỡ từ chiếc tàu chở nô lệ bị rơi đã bao phủ một khu vực rộng lớn, cản trở sự phát triển của hành tinh này."
 d_ship_debris_broken_shackles_blocker_tooltip: "$TRIGGER_FAIL$§RChướng ngại vật này cần được gỡ bỏ bằng cách khảo cổ §Y$broken_shackles_digsite$§!.§!"

 d_crashed_slaver_ship_memorial:0 "Đài tưởng niệm Phá vỡ Gông cùm"
 d_crashed_slaver_ship_memorial_desc:0 "Xung quanh đống đổ nát của chiếc tàu chở nô lệ bị rơi, người ta đã xây dựng một đài tưởng niệm công cộng và một bảo tàng. Dòng chữ khắc ở lối vào viết \"Ký ức là cái nôi của tự do\"."

 zone_broken_shackles_memorial: "Tưởng niệm Phá vỡ Gông cùm"
 zone_broken_shackles_memorial_desc: "$d_crashed_slaver_ship_memorial_desc$"
 zone_broken_shackles_memorial_effect_desc: "$bureaucrat_is_culture_worker_tt$\n\n"

 decision_unshackled_memorial:0 "$d_crashed_slaver_ship_memorial$"
 decision_unshackled_memorial_desc:0 "Chúng ta sẽ xây dựng một đài tưởng niệm xung quanh đống đổ nát của con tàu chở nô lệ bị rơi, để tưởng nhớ những liệt sĩ đã hy sinh trong quá khứ."
 decision_unshackled_memorial_tt:0 "§Y$d_crashed_slaver_ship$§! thay thế bằng §Y$d_crashed_slaver_ship_memorial$§!.\nMột phần §YCông trình§! và §YĐặc khu§! sẽ được chuyển hóa thành cơ sở hạ tầng tiên tiến."
 remove_broken_shackles_modifiers_tt:0 "Xóa bỏ các công cụ sửa đổi §Y$free_at_last_broken_shackles$§! và §Y$culture_shock_broken_shackles$§!."

 decision_remove_wreckage:0 "Dọn dẹp đống đổ nát"
 decision_remove_wreckage_desc:0 "Nên dọn sạch tàn tích của con tàu chở nô lệ bị rơi để nhường chỗ cho quá trình đô thị hóa đang không ngừng mở rộng của chúng ta."
 decision_remove_wreckage_tt:0 "§Y$district_crashed_slaver_ship_plural$§! sẽ được chuyển hóa thành §Y$district_city_plural$§!.\nSẽ gỡ bỏ §Y$d_crashed_slaver_ship$§! cùng toàn bộ §Y$d_ship_debris_broken_shackles_blocker$§!."

 job_broken_shackles_scavenger:0 "Người nhặt rác"
 job_broken_shackles_scavenger_plural:0 "Người nhặt rác"
 job_broken_shackles_scavenger_desc:0 "Những người nhặt rác sẽ khám phá các tàn tích của §Y$d_crashed_slaver_ship$§!, với hy vọng có thể tìm thấy thứ gì đó có giá trị. "
 job_broken_shackles_scavenger_effect_desc:0 "£job_broken_shackles_scavenger£$job_broken_shackles_scavenger_plural$ sản xuất một lượng nhỏ $r_alloys$, $r_amenities$ và $r_research$."
 mod_job_broken_shackles_scavenger_add:0 "Công việc $job_broken_shackles_scavenger$"

 triggered_opinion_kinship:0 "Mối liên kết thân tộc"

 #########################
 # Fear of the Dark Origin
 #########################

 origin_fear_of_the_dark:0 "Nỗi Lo Sợ Bóng Tối"
 origin_fear_of_the_dark_desc:0 "Một thế kỷ trước, một trong các hành tinh tại hệ sao quê nhà của đế chế này đã bị phá hủy bởi một tiểu hành tinh bất thường. Một số người tin rằng đây là cuộc tấn công ác ý của một chủng tộc ngoài hành tinh. Những người khác gạt bỏ mối lo này như một nỗi hoang tưởng thuần túy. Căng thẳng giữa hai nhóm ngày càng gia tăng đến mức một hành tinh vừa được địa khai hóa đã được trao cho những kẻ reo rắc nỗi sợ."
 origin_tooltip_fear_of_the_dark_effects:1 "— Hệ sao $HOME_SYSTEM$ chứa những ['concept_preftl_civilizations', Nền văn minh Tiền FTL] do phe ly khai từng thuộc đế chế của bạn tạo ra, cung cấp các sự kiện và lợi ích độc quyền."
 origin_tooltip_fear_of_the_dark_negative_effects: "—$INITIAL_POPS$§R-800§!"
 START_SCREEN_FEAR_OF_THE_DARK_START:0 "Một thế kỷ trước, một hành tinh mà chúng ta gọi là \"Kẻ Đại chia rẽ\" đã phát nổ. Đây chính là "
 START_SCREEN_FEAR_OF_THE_DARK_REGULAR:0 "$START_SCREEN_FEAR_OF_THE_DARK_START$ khởi đầu của sự chia rẽ.\n\nLúc đầu chúng ta không quá bận tâm về sự hủy diệt của hành tinh này, cùng lắm thì nó chỉ là một hiện tượng kỳ lạ, nhưng một số người trên [GetHomeWorldName] lại cho rằng đây thực chất là một cuộc tấn công có chủ đích nhắm vào giống loài của chúng ta. Những người này cho rằng tín hiệu vô tuyến của chúng ta đã bị một số người ngoài hành tinh ở đằng xa phát hiện ra, và chúng đã đáp trả chúng ta bằng loại vũ khí có khả năng hủy diệt hành tinh này. Những người phản đối này hối thúc chúng ta phải chuẩn bị sẵn sàng để đối phó với việc những người ngoài hành tinh này có thể quay trở lại để tấn công, thậm chí là tiêu diệt chúng ta. Trong khi đó, phần lớn những người khác lại cho rằng nỗi lo của họ là lo bò trắng răng.\n\nSự chia rẽ chính trị giữa hai phe ngày càng sâu sắc. Cuộc bạo loạn lan rộng toàn cầu cuối cùng đã dẫn đến một thỏa thuận, tìm kiếm một hành tinh ứng viên có thể cải tạo môi trường cho những người phản đối này, để họ có thể sống ẩn dật ở đó mà không bị chúng ta can thiệp. $START_SCREEN_FEAR_OF_THE_DARK_END$"
 START_SCREEN_FEAR_OF_THE_DARK_MEGACORP:0 "$START_SCREEN_FEAR_OF_THE_DARK_START$ khởi đầu của sự xa lánh lẫn nhau.\n\nSau sự cố đó, những nhà quản lý đầy lo âu đã gửi yêu cầu tới ban giám đốc, mong muốn có thể đóng cửa toàn bộ các cơ sở liên lạc vô tuyến liên hành tinh hiện tại, đồng thời hủy bỏ chương trình khám phá không gian. Họ tin rằng Kẻ Đại chia rẽ chắc chắn là một thế lực ngoại lai nào đó đang cố gắng tiêu diệt [GetHomeWorldName]. Tất nhiên, yêu cầu này đã bị từ chối.\n\nNhững nhà quản lý này đã gọi quyết định của ban giám đốc là một \"sai lầm mang tính lịch sử\", và họ đã kích hoạt một điều khoản phụ trong hiệp định công dân, cho họ quyền công khai chỉ trích ban giám đốc. Nhằm xoa dịu các cổ đông và củng cố niềm tin của người tiêu dùng, một quyết định đã được đưa ra là sẽ cung cấp một bản hợp đồng mới cho các nhà quản lý bất đồng quan điểm này. Đổi lại việc từ bỏ bất kỳ quyền lợi nào liên quan đến [GetName], họ sẽ nhận được một hành tinh ứng viên có thể cải tạo môi trường, đồng thời được đảm bảo quyền tự chủ về tài chính. $START_SCREEN_FEAR_OF_THE_DARK_END$"
 START_SCREEN_FEAR_OF_THE_DARK_END:0 "\n\nCùng với sự xuất hiện của động cơ siêu quang tốc, một cục diện căng thẳng mới lại nổi lên: chúng ta khao khát được ôm trọn lấy vũ trụ, nhưng những người hàng xóm của chúng ta lại kịch liệt phản đối."
