 WILL_TURN_TO_PURIFIER:0 "Tùy chọn này sẽ khiến chúng ta chuyển biến thành một Đế chế §YTẩy rửa Chủng tộc§!."
 fotd_cant_collossus:0 "§RChúng ta không thể tiêu diệt dân số của chính mình.§!"
