 origin_payback:0 "Trả Thù"
 origin_payback_desc:1 "§R-CẢNH BÁO: KHỞI NGUYÊN ĐẦY THỬ THÁCH§!\nNền văn minh này từng được một đế chế ngoại tinh ghé thăm, kẻ đã cưỡng ép khai sáng và nô dịch họ. Họ đã đánh đuổi được quân xâm lược, nhưng liệu chúng có quay trở lại?"
 origin_tooltip_payback_effects:2 "— $HOMEWORLD$ $TABBED_NEW_LINE$— ['concept_advanced_infrastructure']$TABBED_NEW_LINE$— $PLANETARY_MODIFIERS$ ['concept_payback_unified_purpose']$NEW_LINE$— $HOME_SYSTEM$ ['concept_payback_digsite'] ['concept_archaeology_site']$NEW_LINE$— Một ['concept_advanced_empires', Đế Chế AI Tiên Tiến] và vài ['concept_preftl_civilizations'] bất kể Cài đặt Thiên hà $NEW_LINE$— Một Nền văn minh Tiền FTL: Được khai sáng với khởi nguyên §I$origin_broken_shackles$§!"
 zone_payback_enlightenment: "Trung Tâm Thăng Tiến"
 zone_payback_enlightenment_desc: "Sự khai sáng có thể không hề miễn phí. Nhưng tại $NAME_MSI_country_initials$, nó luôn mang lại giá trị xứng đáng."

 origin_tooltip_payback_negative_effects: "—$INITIAL_POPS$§R-1K§!$NEW_LINE$—$HOMEWORLD$$TABBED_NEW_LINE$— Hệ số hành tinh ['concept_payback_debris_field']$TABBED_NEW_LINE$—['concept_payback_ship_debris']: +6$TABBED_NEW_LINE$— Độ tàn phá: §R33%§!$NEW_LINE$—$HOME_SYSTEM$§ITài nguyên dự trữ§! chưa được khai thác$NEW_LINE$—$MISSING_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_basic_science_lab_1', £physics_research£ $tech_basic_science_lab_1$]$TABBED_NEW_LINE$—['concept_planetary_government', £society_research£ $tech_planetary_government$]$TABBED_NEW_LINE$—['concept_corvettes', £engineering_research£ $tech_corvettes$]"

 START_SCREEN_PAYBACK:0 "Chúng ta từng có một bản giao kèo.\n\nKhi những vị khách từ các vì sao xa xôi xuất hiện, họ đã đề nghị với chúng ta một bản hợp đồng công bằng: khai sáng công nghệ, và chúng ta sẽ trả góp dần. Chỉ trong vòng một thế hệ, hành tinh của chúng ta đã được biến đổi thành một thứ gọi là \"nền văn minh tiên tiến\".\n\nNhưng rồi chúng ta mới phát hiện ra những điều khoản được in bằng những dòng chữ nhỏ xíu: Để trả hết \"món nợ\" của mình, họ buộc chúng ta phải làm việc cho họ, vô thời hạn. Những nhà lãnh đạo của chúng ta đã phản đối, nhưng những kẻ ngoại lai này lập tức trở mặt và sử dụng bạo lực. Chúng ta đã vùng lên phản kháng.\n\nChúng ta đã giành chiến thắng, nhưng là một chiến thắng vô cùng chật vật, và chúng ta đã phải trả một cái giá quá đắt cho điều đó. Giờ đây, các nhà khoa học của chúng ta cuối cùng cũng đã giải mã được bí mật của việc du hành siêu quang tốc thông qua công nghệ dịch ngược từ những phi thuyền mà chúng ta đã phá hủy trong quá khứ. Vũ trụ này rất rộng lớn, nhưng không sớm thì muộn, chúng ta chắc chắn sẽ lại chạm trán với những \"ân nhân\" của mình. Và trên thực tế, chúng ta cũng đang háo hức chờ đợi điều đó, sẵn sàng cho một cuộc chiến.\n\nĐã đến lúc để bắt bọn chúng nợ máu phải trả bằng máu."

 ## Modifiers and such
 d_ship_debris_payback_blocker:0 "Xác Tàu Không Gian"
 d_ship_debris_payback_blocker_desc:0 "Những mảnh vỡ rơi xuống từ các phi thuyền Minamar đậu trên quỹ đạo đã bao phủ một khu vực rộng lớn, cản trở sự phát triển của hành tinh này."
 ship_debris_payback_blocker_tt:0 "Dọn dẹp xác tàu của MSI có thể giúp tìm ra các dữ liệu công nghệ hoặc tài nguyên."

 origin.4100.name:0 "Tìm Thấy Dữ Liệu Công Nghệ"
 origin.4100.desc:0 "Trong quá trình dọn dẹp xác tàu tại [from.GetName], chúng ta đã tìm thấy một hòm chứa dữ liệu công nghệ."

 origin.4105.name:0 "Tìm Thấy Tài Nguyên"
 origin.4105.desc:0 "Những xác tàu được dọn dẹp tại [from.GetName] có thể được tái chế và sử dụng lại."

 payback_unified_purpose:0 "Chung Sức Đồng Lòng"
 payback_unified_purpose_desc:0 "Sự xuất hiện của những kẻ xâm lược đã khiến hành tinh của chúng ta đoàn kết lại thành một khối thống nhất. Giờ đây, khi đã giành lại được quyền kiểm soát vận mệnh của mình, chúng ta có rất nhiều việc phải làm."

 payback_debris_field:0 "Bãi Mảnh Vỡ"
 payback_debris_field_desc:0 "Những mảnh vỡ từ các quỹ đạo do các phi thuyền Minamar bị phá hủy tạo ra thường xuyên rơi xuống hành tinh bên dưới. Bất kỳ cơ sở hạ tầng nào trên bề mặt cũng cần phải được sửa chữa thường xuyên hơn và đầu tư nhiều hơn để có thể khôi phục lại những thiệt hại đã gây ra."

 d_payback_habitat_research:0 "Kho Tàng Công Nghệ"
 d_payback_habitat_research_desc:0 "Bên trong chiến hạm của cựu Tập đoàn MSI, chúng ta đã bắt gặp một cơ hội ngàn năm có một để có thể giải mã những bí ẩn trong công nghệ của họ."

 d_msi_air_freshener: "Máy Phun Khí Quyển"
 d_msi_air_freshener_desc: "Những thiết bị thông gió này kết hợp liệu pháp hương thơm mới nhất cùng với công nghệ hóa học tiên tiến, có khả năng xua tan mùi hôi thối của sự tuyệt vọng, thay vào đó là hàng loạt những mùi hương mang lại sự sảng khoái và vui vẻ."

 payback_curfew:0 "Nhổ Cỏ Tận Gốc"
 payback_curfew_desc:0 "Để có được sự tự do, chúng ta phải trả giá bằng sự ổn định."

 payback_freedom_of_speech:0 "Tự Do Ngôn Luận"
 payback_freedom_of_speech_desc:0 "Để có được sự ổn định, chúng ta phải trả giá bằng sự tự do."

 ## First Contact
 origin.4200.name:0 "Đại Hội Đồng Quản Trị"
 origin.4200.desc:0 "Cuộc gặp gỡ với những kẻ xâm lược cũ đã thúc đẩy các nhà lãnh đạo chính trị, các nhân vật tôn giáo, các nhà khoa học, các nghệ sĩ và các nhà ngoại giao của chúng ta tổ chức một cuộc họp khẩn cấp. Mọi người từ mọi tầng lớp xã hội đã cùng nhau thảo luận, bác bỏ, tranh luận lại, cải tiến và bỏ phiếu cho vô số các chiến lược khác nhau. Trải qua vài tháng căng thẳng thảo luận, những bộ óc thông minh nhất của đế chế chúng ta đã đạt được một thứ gần giống như là sự đồng thuận."
 origin.4200.a.auth:0 "Chúng ta sẽ cho bọn chúng thấy, ai mới là ông chủ ở đây!"
 origin.4200.a.ega:0 "Chúng ta yêu cầu được giao tiếp và trao đổi một cách bình đẳng."
 origin.4200.b.mili:0 "Chúng ta sẽ bắt bọn chúng phải bồi thường cho những gì đã làm trong quá khứ!"
 origin.4200.b.paci:0 "Chúng ta không muốn xảy ra thêm những cuộc xung đột mới với bọn họ."
 origin.4200.c.phobe:0 "Chúng ta không muốn giao tiếp với các dị chủng."
 origin.4200.c.phile:0 "Chúng ta không thể để sự sợ hãi ngăn cản bước chân khám phá biển sao của mình."
 origin.4200.d.spiri:0 "Phải giải quyết những thử thách dành cho các tín đồ."
 origin.4200.d.mate:0 "Chúng ta muốn nghiên cứu chúng. Biết địch biết ta."

 origin.4205.name:0 "Sự Đồng Thuận Của Quần Chúng"
 origin.4205.desc:0 "Mặc dù đã áp dụng một số biện pháp an ninh, nhưng tin tức về cuộc chạm trán giữa chúng ta và §H$NAME_MSI_country$§! vẫn lan truyền ra công chúng, gây ra không ít sự hoang mang cho hành tinh mới bắt đầu hồi phục sau những nỗi đau trong quá khứ này. Dư luận quần chúng... rất khó để có thể thống nhất: có vô số những luồng ý kiến trái chiều, từ sự phẫn nộ tột cùng cho đến những hoài niệm không mấy thiện chí. Bất kể chúng ta đưa ra quyết định gì, thì chắc chắn cũng sẽ gặp phải một sự kháng cự bằng bạo lực nhất định."
 origin.4205.a:0 "Họ có quyền bày tỏ quan điểm của mình."
 origin.4205.b:0 "Ban bố lệnh giới nghiêm. Nhổ cỏ tận gốc những kẻ bất đồng chính kiến."

 origin.4210.name:0 "Cuộc Đàm Phán Đầu Tiên"
 origin.4210.desc:0 "Trải qua một quá trình chuẩn bị kỹ lưỡng và lâu dài, đặc sứ của chúng ta đã gửi một thông điệp đến $NAME_MSI_country_initials$. Chúng ta đã sẵn sàng gặp gỡ những người chủ cũ theo các điều kiện của riêng mình, để lên tiếng cho ý nguyện của người dân chúng ta."

 ## Out of Warranty
 payback_out_of_warranty_chain_title:0 "Hết Hạn Bảo Hành"
 payback_out_of_warranty_chain_desc:0 "§Y$building_medical_2$§! mà những kẻ xâm lược cũ xây dựng cho chúng ta đã cũ nát và không được bảo trì. Phần lớn công nghệ trong đó đều vượt quá sự hiểu biết hiện tại của chúng ta, nhưng chúng ta vẫn có thể cố gắng §Ssửa chữa§! nó.\n\n§LViệc ký kết hiệp định nghiên cứu với các đế chế khác sẽ giúp chúng ta nâng cao tỷ lệ thành công. [GetAgreementStatus]§!"
 payback_repair_clinic_no_agreement:0 "Chúng ta vẫn chưa ký kết hiệp định nghiên cứu với bất kỳ quốc gia nào có khả năng giúp đỡ chúng ta."
 payback_repair_clinic_yes_agreement:0 "Chúng ta đã ký kết hiệp định nghiên cứu với một quốc gia có khả năng giúp đỡ chúng ta."

 payback_declining_healthcare:0 "Hệ Thống Y Tế Chăm Sóc Sức Khỏe Bị Xuống Cấp"
 payback_declining_healthcare_desc:0 "Do mất đi $building_medical_2$, chất lượng cuộc sống của chúng ta đã bị ảnh hưởng nghiêm trọng."
 payback_declining_healthcare_alt:0 "Thuốc Thay Thế"
 payback_declining_healthcare_alt_desc:0 "Đừng quên uống vitamin nhé!"
 payback_declining_healthcare_necro:0 "$payback_declining_healthcare$"
 payback_declining_healthcare_necro_desc:0 "$payback_declining_healthcare_desc$ Nhưng ở một khía cạnh khác, chất lượng của các thi thể đã được cải thiện đáng kể."
 payback_healing_scars:0 "Chữa Lành Vết Thương Cũ"
 payback_healing_scars_desc:0 "Chỉ khi phá hủy hoàn toàn các cơ sở y tế của những người ngoài hành tinh này một lần và mãi mãi, chúng ta mới có thể chữa lành những vết thương thực sự."

 # Gene Clinic is breaking down
 origin.4300.name:0 "Hết Hạn Bảo Hành"
 origin.4300.base.desc:0 "\"Chúng tôi sẽ chấm dứt mọi bệnh tật.\"\n\nĐó là cách mà những kẻ xâm lược đã chiếm được lòng tin của chúng ta. Chúng ta đã cho phép bọn chúng xây dựng §Y$building_medical_2$§! trên [Root.GetHomeWorldName], và chỉ trong vòng một thế hệ, bọn chúng đã tiêu diệt được hầu hết các căn bệnh nguy hiểm nhất. Tuy nhiên, giờ đây, những phòng khám này đang dần ngừng hoạt động, do nhiều năm sử dụng với cường độ cao đã khiến máy móc bên trong rơi vào trạng thái trì trệ. Chúng ta không thể hiểu được cách thức hoạt động của những công nghệ tiên tiến của bọn xâm lược. Liệu chúng ta có thể tiến hành dịch ngược công nghệ đối với chúng không? Hay chúng ta nên biến món quà độc hại này thành một thứ gì đó thực sự thuộc về chúng ta?\n"
 origin.4300.aliens.phobe.desc:0 "$origin.4300.base.desc$Mặc dù các quốc gia khác có thể cũng sở hữu những cơ sở hạ tầng tương tự, nhưng việc cầu xin sự giúp đỡ từ các dị chủng chắc chắn sẽ khiến chủng tộc của chúng ta phải chịu sự nhục nhã."
 origin.4300.aliens.phile.desc:0 "$origin.4300.base.desc$Các quốc gia khác có thể cũng sở hữu những cơ sở hạ tầng tương tự. Chúng ta nên mở lời nhờ họ giúp đỡ."
 origin.4300.noaliens.desc:0 "$origin.4300.base.desc$Nếu như chúng ta có thể làm quen với nhiều bạn bè hơn thì tốt biết mấy. "
 origin.4300.a:0 "Cố gắng sửa chữa $building_medical_2$."
 origin.4300.a.tooltip:0 "Chọn §Y$building_medical_2$§! trên giao diện hành tinh, nhấp vào nút §SSửa Chữa§! để tiến hành sửa chữa. Việc ký kết §SHiệp Định Nghiên Cứu Khoa Học§! với các quốc gia khác có thể làm tăng tỷ lệ sửa chữa thành công."
 origin.4300.b:0 "Cải tạo lại $building_medical_2$."
 origin.4300.b.tooltip:0 "Biến đổi §Y$building_medical_2$§! thành một §Y$building_autochthon_monument$§!, chi phí sẽ được giảm bớt."
 origin.4300.b.memorialist.tooltip:0 "Biến đổi §Y$building_medical_2$§! thành một §Y$building_galactic_memorial_1$§!, chi phí sẽ được giảm bớt."

 # Building repaired!
 origin.4301.name:0 "Sửa Chữa Khẩn Cấp"
 origin.4301.base.desc:0 "Những kẻ xâm lược trước đây có thể sẽ coi tất cả những điều này chỉ là sự may mắn từ trên trời rơi xuống, hoặc tuyên bố rằng công việc sửa chữa này do chúng chỉ đạo. Bọn chúng thậm chí có thể nói rằng, việc chúng ta thực hiện dịch ngược đối với các công nghệ đằng sau §Y$building_medical_2$§! hoàn toàn chẳng có gì to tát cả."
 origin.4301.noagreement.desc:0 "$origin.4301.base.desc$Nhưng bất kể bọn chúng có nói gì đi chăng nữa, chúng ta đã tự mình hoàn thành công việc một cách độc lập, không hề có bất kỳ sự trợ giúp nào từ chúng, và giờ đây chiến thắng này là của riêng chúng ta."
 origin.4301.agreement.desc:0 "$origin.4301.base.desc$Nhưng bất kể bọn chúng có nói gì đi chăng nữa, chúng ta đã hoàn thành công việc nhờ vào sự giúp đỡ của các chuyên gia được phái đến từ một đồng minh hào phóng."
 origin.4301.a:0 "Có lẽ... người ngoài hành tinh cũng không đến nỗi nào?"
 origin.4301.end.desc:0 "Chúng ta có khả năng tự chăm lo cho bản thân mình."

 # Building still broken
 origin.4302.name:0 "Tính Chính Đáng Của Việc Sửa Chữa"
 origin.4302.desc:0 "Thực tế đã chứng minh rằng, để có thể dịch ngược công nghệ giúp §Y$building_medical_2$§! hoạt động trở lại, công việc này khó khăn và mang nhiều tính thử thách hơn chúng ta dự tính rất nhiều. Tuy nhiên, các [root.GetEngineerPlural] của chúng ta vẫn tràn đầy hy vọng. Bọn họ nói rằng bản thân chỉ cần thêm thời gian mà thôi. Dù vậy, khi chi phí và những thất bại bắt đầu chồng chất, một số người cho rằng nên cải tạo phòng khám này để sử dụng cho một mục đích khác."
 origin.4302.a:0 "Lần này sẽ không dễ dàng thất bại như vậy nữa."
 origin.4302.a.tooltip:0 "$origin.4300.a.tooltip$"
 origin.4302.b:0 "$origin.4300.b$"
 origin.4302.b.tooltip:0 "$origin.4300.b.tooltip$"
 origin.4302.b.memorialist.tooltip:0 "$origin.4300.b.memorialist.tooltip$"

 # Building broken beyond repair
 origin.4303.name:0 "Công Việc Sửa Chữa Đầy Thiếu Sót"
 origin.4303.desc:0 "Nỗ lực cố gắng sửa chữa §Y$building_medical_2$§! của chúng ta cuối cùng đã thất bại: một vụ nổ lớn đã nuốt chửng công trình này, khiến cho hiện trường thương vong nghiêm trọng.\n\nKhông còn nghi ngờ gì nữa, những kẻ xâm lược trước đây chắc chắn đang cười nhạo sự kiêu ngạo, ngu ngốc và liều lĩnh của chúng ta. Sự thất bại này là do chúng ta tự chuốc lấy, nhưng bài học này cũng sẽ được khắc sâu trong tâm trí chúng ta."

 # Building Repurposed
 origin.4304.name:0 "Phần Cứng Đổi Mới Toàn Diện"
 origin.4304.desc:0 "§Y$building_medical_2$§! của chúng ta có thể không còn khả năng chữa bệnh nữa, nhưng bằng cách tháo rời một số bộ phận then chốt và sử dụng chúng để trưng bày trong nhà tưởng niệm, ít nhất chúng ta cũng có thể bắt đầu chữa lành những vết sẹo do quân xâm lược để lại. Chỉ khi hòa giải với quá khứ, chúng ta mới có thể dần dần vượt qua được tất cả những điều này."

 # No building - people getting sick
 origin.4305.name:0 "Cuộc Khủng Hoảng Chăm Sóc Sức Khỏe Y Tế"
 origin.4305.desc:0 "Do mất đi §Y$building_medical_2$§!, chất lượng của hệ thống y tế chăm sóc sức khỏe đã bị sụt giảm nghiêm trọng. Các ca bệnh di truyền và mãn tính từng có thể chữa khỏi một cách dễ dàng nay lại bắt đầu gia tăng, tuổi thọ trung bình của chúng ta đã quay trở lại bằng với mức trước khi bị chiếm đóng. Niềm tin của công chúng vào hệ thống y tế chăm sóc sức khỏe đã rơi xuống mức thấp kỷ lục, thậm chí một số người trong chúng ta còn bắt đầu than thở rằng, thà quân xâm lược đừng rời đi còn hơn."
 origin.4305.a:0 "Tăng gấp đôi đầu tư vào nghiên cứu y tế."
 origin.4305.a.tooltip:0 "Tăng cường khả năng khám phá ra công nghệ §Y$tech_frontier_health$§!."
 origin.4305.b:0 "Khuyến khích các phương pháp điều trị thay thế."
 origin.4305.b.tooltip:0 "Cái này chẳng có tác dụng gì cả."
 origin.4305.c:0 "Cái chết đối với chúng ta chưa bao giờ là một vấn đề."

 # Rediscovering genetic healthcare
 origin.4306.name:0 "Tự Cung Tự Cấp"
 origin.4306.desc:0 "Sau khi nắm giữ được bí ẩn của kỹ thuật di truyền, người dân của chúng ta hiện nay đã có khả năng xây dựng §Y$building_medical_2$§!, với năng lực trình độ giống y hệt như những cơ sở mà quân xâm lược đã để lại trước đây. Đối với người dân của chúng ta, đây là một ngày vô cùng vinh quang: nó chứng minh rằng chúng ta có thể vươn tới những vì sao mà không cần đến sự kiểm soát của [root.species.GetHandName]."

 ## Arc Site


 # Ambient Object
 payback_site_ship_object:1 "Chiến Hạm $NAME_MSI_country_initials$ Bị Hư Hỏng"
 payback_site_ship_tooltip:0 "Những mảnh vỡ trên quỹ đạo thuộc về một chiến hạm từng rất hùng mạnh."

 # Dig Site
 payback_digsite:0 "Vết Thương Chiến Tranh"
 payback_digsite_desc:1 "Chiến hạm từng đe dọa quê hương của chúng ta vẫn đang treo lơ lửng trên không trung, như một lời nhắc nhở phũ phàng về việc chúng ta đã may mắn thoát khỏi số phận như thế nào. Giờ đây, đã đến lúc chúng ta phải giành lại bầu trời của mình, và lấy lại những công nghệ siêu việt từ trong đống đổ nát của con tàu này."


 # Dig Site Security System
 security_system_drone:0 "Tài Sản Của Chính Phủ Doanh Nghiệp"
 security_system_drone_plural:0 "Tài Sản Của Chính Phủ Doanh Nghiệp"


 # Dig Site Starting Event
 origin.4900.name:1 "Thu Hồi Chiến Hạm" #Previously The Kessler Effect
 origin.4900.desc:1 "Cuộc chiến đấu chống lại quân xâm lược ngoài hành tinh đã khiến cho hệ sao mẹ của chúng ta chứa đầy những mảnh vỡ, những chiến hạm bị phá hủy và những lời hứa bị phản bội. Rất nhiều vật liệu phế thải nằm rải rác xung quanh, khiến cho việc phát triển vệ tinh và phóng tàu vũ trụ từ [owner.capital_scope.GetName] trở nên khó khăn hơn. Nhờ vào việc đề xuất kế hoạch dọn dẹp, những tàu công trình được thiết kế đặc biệt có thể sử dụng lưới để dọn dẹp ở quỹ đạo thấp của Trái Đất, giúp chúng ta dần dần mở ra con đường đi đến chiến hạm $NAME_MSI_country_initials$ vẫn đang trôi nổi phía trên thủ đô của chúng ta."
 origin.4900.a:1 "Bắt tay vào dọn dẹp."


 # Special project to unlock the dig site
 PAYBACK_KESSLER_EFFECT:0 "Kế Hoạch Dọn Dẹp Mảnh Vỡ Quỹ Đạo"
 PAYBACK_KESSLER_EFFECT_DESC:0 "$origin.4900.desc$"


 # 50% progress
 origin.4930.name:1 "Đang Tiến Hành Dọn Dẹp"
 origin.4930.desc:1 "Dự án dọn dẹp trong hệ sao của chúng ta đang diễn ra vô cùng suôn sẻ. Số lượng các mảnh vỡ phía trên [owner.capital_scope.GetName] đã giảm đi đáng kể. Cùng với việc bầu trời dần trở nên trong xanh, tương lai của chúng ta cũng ngày càng tươi sáng hơn. Công việc vẫn đang được tiếp tục, mọi thứ đều đang tiến triển theo chiều hướng tốt đẹp."


 # 100% progress
 origin.4931.name:1 "Bầu Trời Trong Xanh"
 origin.4931.desc:1 "Công việc dọn dẹp đã hoàn thành xuất sắc. Đi qua một vùng trời không có mảnh vỡ này, tàu nghiên cứu của chúng ta có thể tiếp cận chiến hạm và bắt đầu khám phá khu vực tàn tích một cách an toàn."


 ## Dig site


 # Stage 1
 origin.4905.name:1 "Đánh Giá Thiệt Hại"
 origin.4905.desc:1 "Các cảm biến của chúng ta không thể phát hiện ra bất kỳ dấu hiệu sự sống nào trong chiến hạm bị bỏ hoang, động cơ trong khoang thuyền trống rỗng vẫn đang phát ra những tiếng vo ve nhè nhẹ, các loại máy móc cũng vẫn đang hoạt động. Có lý do để tin rằng, con tàu này vẫn có thể hoạt động bình thường, và nếu cố gắng cưỡng ép đổ bộ lên tàu chắc chắn sẽ kích hoạt hệ thống an ninh của nó.\n\nChúng ta nhất định phải tiến hành công việc một cách vô cùng thận trọng."


 # Stage 2
 origin.4910.name:0 "Thu Hồi Tài Sản"
 origin.4910.desc:1 "Các nhân viên thi công của chúng ta đang tiến hành dọn dẹp các mảnh vỡ, sửa chữa hư hỏng và đảm bảo an toàn cho khoang thuyền, biến chiến hạm từng đe dọa hành tinh của chúng ta thành một căn cứ hoạt động mới. Trong đống đổ nát, chúng ta đã tìm thấy ngày càng nhiều thi thể hoặc các bộ phận cơ thể bị cắt rời của các thủy thủ đoàn.\n\nViệc làm thế nào để xử lý những thi thể này đã làm dấy lên những cuộc thảo luận sôi nổi trong dư luận quần chúng."
 origin.4910.a:0 "Giải phẫu thi thể."
 origin.4910.b:0 "Đưa thi thể vào viện bảo tàng."
 origin.4910.c:1 "Đem diễu phố bêu đầu thị chúng."
 origin.4910.d:0 "Kẻ ác cũng xứng đáng được an táng một cách tử tế."


 # Stage 3
 origin.4920.name:0 "Phân Tích Đối Thủ"
 origin.4920.desc:1 "Khi chúng ta tìm kiếm một cách cẩn thận trong cơ sở dữ liệu trung tâm của chiến hạm, chúng ta đã dần nắm rõ toàn bộ kế hoạch của những người chủ trước. Bọn chúng tiếp cận chúng ta dưới danh nghĩa khai sáng, nhưng thực chất chỉ là để huấn luyện chúng ta trở thành những nô lệ giỏi hơn; những kế hoạch và thỏa thuận mà chúng đưa ra với đầy thiện ý, chẳng qua cũng chỉ là những lời dối trá được thêu dệt một cách tinh vi. Rõ ràng là hành tinh của chúng ta không phải là lần đầu tiên chúng làm chuyện này, mà đây còn là một mô hình chuẩn mực cho \"chiến lược kinh doanh\" cốt lõi của chúng."
 origin.4920.a:1 "Tiếp tục phân tích."


 # Stage 4
 origin.4925.name:1 "Giành Lại Quyền Kiểm Soát" #Formerly Monopolizing The Market
 origin.4925.desc:1 "Chúng ta đã hoàn toàn kiểm soát được hệ thống của chiến hạm bị bỏ hoang này. Giờ đây, chúng ta phải quyết định xem sẽ xử lý nó như thế nào. Dựa theo nhu cầu của chúng ta, nó có thể trở thành một nguồn tài nguyên có giá trị sử dụng cực kỳ lớn cho cả việc tiến hành chiến tranh và nghiên cứu khoa học."
 origin.4925.a.tt:0 "Cho phép chúng ta phục hồi chiến hạm này thành một chiếc §HCái Thế Kỳ Hạm§! hoặc §HTrạm Cư Trú§!."


 # Special project to restore the warship
 payback_restore_warship_chain_title:0 "Phục Hồi Chiến Hạm"
 payback_restore_warship_chain_desc:0 "Chiến hạm của MSI trước đây sẽ được phục hồi và sử dụng cho mục đích của chúng ta."


 RESTORE_WARSHIP_PROJECT:0 "Phục Hồi Cái Thế Kỳ Hạm"
 RESTORE_WARSHIP_PROJECT_DESC:1 "Chiến hạm này sẽ trở thành viên ngọc quý trong hạm đội của chúng ta.\n\nChiến hạm này sẽ được phục hồi và biến thành một §HCái Thế Kỳ Hạm§! với đầy đủ chức năng, có khả năng hoạt động như một bến tàu di động."
 RESTORE_HABITAT_PROJECT:0 "Khôi Phục Trạm Cư Trú"
 RESTORE_HABITAT_PROJECT_DESC:1 "Sau khi được cải tạo, chiến hạm này hiện sẽ được sử dụng cho mục đích nghiên cứu khoa học.\n\nSau quá trình khôi phục, cỗ máy chết chóc này giờ đây đã được chuyển đổi thành một §HTrạm Cư Trú§! với đầy đủ các chức năng, chuyên dùng để giải mã những bí mật trong công nghệ của Tập đoàn MSI."


 # project to upgrade the warship
 UPGRADE_FLAGSHIP:0 "Nâng Cấp Cái Thế Kỳ Hạm"
 UPGRADE_FLAGSHIP_DESC:0 "Những tiến bộ mới nhất về mặt công nghệ đã cho phép chúng ta có thể cải tạo lại Cái Thế Kỳ Hạm, và trang bị thêm một số hệ thống mà trước đây chưa từng được sử dụng."
 UPGRADE_FLAGSHIP_EMPTY:0 " " # Empty string to stop the error log.


 # End of the project event
 origin.4934.name:0 "Cái Thế Kỳ Hạm Đã Được Khôi Phục"
 origin.4934.desc:1 "Công việc cải tạo lại chiến hạm của Tập đoàn MSI trước đây đã được hoàn tất. Hiện tại, chúng ta đã có khả năng chỉ huy một con tàu sở hữu hỏa lực mạnh mẽ cùng với ý nghĩa chiến lược to lớn.\n\nHãy chuẩn bị tinh thần đi, biển sao bao la!"
 origin.4934.tt:2 "Chiến hạm này đã được phục hồi thành một chiếc §HCái Thế Kỳ Hạm§!, có khả năng hoạt động như một bến tàu di động trên quỹ đạo của [owner.capital_scope.GetName]."


 origin.4935.name:0 "Trạm Cư Trú Đã Được Khôi Phục"
 origin.4935.desc:1 "Công việc cải tạo lại chiến hạm của Tập đoàn MSI trước đây đã được hoàn tất. Hiện tại, chúng ta đã sở hữu một cơ sở nghiên cứu khoa học tiên tiến nhất, và nó sẽ hỗ trợ chúng ta trong việc thúc đẩy sự phát triển của các kiến thức công nghệ."
 origin.4935.tt:1 "Chiến hạm này đã được phục hồi thành một §HTrạm Cư Trú§!, hoạt động trên quỹ đạo của [owner.capital_scope.GetName] với nhiệm vụ chuyên trách là giải mã những bí mật trong công nghệ của Tập đoàn MSI."


 origin.4936.name:0 "Sự Hiểu Biết Sâu Sắc Về Kỹ Thuật"
 origin.4936.desc:0 "Gần đây, chúng ta đã đạt được những tiến bộ nhất định trong việc thiết kế phi thuyền, điều này đã giúp chúng ta có những hiểu biết sâu sắc hơn về việc nâng cấp Cái Thế Kỳ Hạm, và tận dụng các hệ thống mà trước đây chưa từng được sử dụng."
 origin.4936.tt:0 "Mở ra một dự án đặc biệt nhằm nâng cấp Cái Thế Kỳ Hạm."


 origin.4937.name:0 "Cái Thế Kỳ Hạm Đã Nâng Cấp Hoàn Tất!"
 origin.4937.desc:1 "Chúng ta đã tiến hành nâng cấp Cái Thế Kỳ Hạm. Bằng cách tận dụng các công nghệ sẵn có trên tàu, chúng ta có khả năng dịch ngược công nghệ đối với các hệ thống của nó, từ đó hiểu rõ hơn về cách thức vận hành bên trong của con tàu."
 origin.4937.tt:0 "Cái Thế Kỳ Hạm của chúng ta đã được nâng cấp, có thể sử dụng các hệ thống mà trước đây chưa từng được sử dụng."


 ## Debt Collectors

 # Event chains
 payback_debt_collectors_chain_title:0 "Người Thu Hồi Nợ"
 payback_debt_collectors_chain_desc:1 "Những người chủ trước đây của chúng ta đã tuyên bố rằng chúng ta còn nợ họ một khoản bồi thường chiến tranh. Và bọn chúng đã thuê một cơ quan thu hồi nợ liên sao để giải quyết vấn đề này.\n\n[root.GetDebtCollectorsDeal]\n\n§LNgười thu hồi nợ sẽ đến thăm chúng ta trong §Y[root.payback_debt_collectors_timer]§!.§!"
 payback_debt_collectors_chain_energy:3 "Chúng ta đồng ý thanh toán §R5000§!£energy£§H$energy$§! mỗi 15 năm."
 payback_debt_collectors_chain_consumer_goods:1 "Chúng ta đồng ý thanh toán §R2500§!£consumer_goods£§H$consumer_goods$§! mỗi 15 năm."
 payback_debt_collectors_chain_alloys:1 "Chúng ta đồng ý thanh toán §R1250§!£alloys£§H$alloys$§! mỗi 15 năm."
 payback_debt_collectors_chain_pops:3 "Chúng ta đồng ý giao nộp cho người thu hồi nợ §R200§!£pop£§HDân số§! mỗi 15 năm."
 payback_debt_collectors_chain_refused_won:0 "Chúng ta đã từ chối giao dịch, tiến hành giao chiến với người thu hồi nợ, và đã giành chiến thắng. Tuy nhiên, chắc chắn sẽ có một ngày bọn chúng quay trở lại."
 payback_debt_collectors_chain_refused_lost:0 "Chúng ta đã từ chối giao dịch, tiến hành giao chiến với người thu hồi nợ, nhưng lại thua cuộc. Chắc chắn sẽ có một ngày bọn chúng lại quay trở lại."
 payback_debt_collectors_chain_empty:0 ""

 payback_make_them_pay_swords_chain_title:0 "Trang Trải Sòng Phẳng"
 payback_make_them_pay_swords_chain_desc:1 "[GetPaybackChainDescSwords]"
 payback_make_them_pay_swords_chain_desc_MSI:0 "Đã đến lúc chúng ta phải trả đũa tông chủ quốc trước đây của mình là $NAME_MSI_country$.\n\nChúng ta không còn là nền văn minh non trẻ từng bị bọn chúng bóc lột một cách tùy ý nữa, giờ đây, đã đến lúc phải bắt bọn chúng trả giá bằng máu.\n\n§LSử dụng lý do tuyên chiến §Y$casus_belli_cb_payback$§! để giành chiến thắng trong cuộc chiến chống lại §H$NAME_MSI_country$§!.§!"
 payback_make_them_pay_swords_chain_desc_no_MSI:0 "Kế hoạch phản công người chủ cũ $NAME_MSI_country$ của chúng ta đã bị [event_target:payback_stole_revenge_country.GetName] làm cho thất bại.\n\nBọn chúng sẽ phải trả giá cho việc đã cướp đi sự trả thù của chúng ta.\n\n§LTuyên chiến với §H[event_target:payback_stole_revenge_country.GetName]§! bằng lý do §Y$casus_belli_cb_payback$§! và giành chiến thắng.§!"

 payback_make_them_pay_words_chain_title:0 "Trang Trải Sòng Phẳng"
 payback_make_them_pay_words_chain_desc:1 "[root.GetPaybackChainDescWords]"
 payback_make_them_pay_words_chain_desc_MSI:0 "Đã đến lúc bắt đầu tiến hành phản công lại người chủ cũ của chúng ta là $NAME_MSI_country$.\n\nTại Thượng viện của Cộng đồng Ngân hà, chúng ta sẽ khiến bọn chúng phải quỳ gối, và phơi bày bộ mặt thật là những kẻ buôn bán nô lệ và hèn nhát của bọn chúng."
 payback_make_them_pay_words_chain_desc_no_MSI:0 "Chúng ta đã thoát khỏi gông cùm từ tông chủ quốc trước đây, nhưng cuộc chinh phạt này sẽ không dừng lại ở đó, chúng ta sẽ phát động cuộc đấu tranh tại Thượng viện của Cộng đồng Ngân hà, chống lại tất cả các quốc gia vẫn còn muốn bóc lột và lợi dụng các nền văn minh tiền FTL."

