 mod_station_observers_energy_produces_add:0 "$mod_country_energy_produces_mult$ của Tiền trạm Quan sát"
 mod_station_observers_unity_produces_add:0 "$mod_country_unity_produces_mult$ của Tiền trạm Quan sát"
 mod_station_observers_physics_research_produces_add:0 "$mod_country_physics_produces_mult$ của Tiền trạm Quan sát"
 mod_station_observers_engineering_research_produces_add:0 "$mod_country_engineering_research_produces_mult$ của Tiền trạm Quan sát"
 mod_station_observers_society_research_produces_add:0 "$mod_country_society_research_produces_mult$ của Tiền trạm Quan sát"
 mod_station_observers_influence_produces_add:0 "$mod_country_influence_produces_mult$ của Tiền trạm Quan sát"

 #Freeport
 fircon.8025.name:0 "Xây dựng Cảng Tự do"
 fircon.8025.desc:0 "Chiếu theo thỏa thuận thương mại giữa chúng ta và những [GetPreFTLUpperPlural] thuộc [freeport_country.GetName], chúng ta đã xây dựng một trạm không gian nhỏ gần khu định cư chính của họ. Các thương nhân của chúng ta không bị ràng buộc bởi các quy định, tha hồ thu về những khoản lợi nhuận khổng lồ, nhưng bị cấm rời khỏi khu vực đặc quyền đó.\n\nKết quả là, những kẻ buôn lậu và các băng đảng có tổ chức đã dựng nên một nền kinh tế chợ đen vô cùng phồn vinh. Cho đến hiện tại, [freeport_species.GetAdj] vẫn đang nhắm mắt làm ngơ, nhưng nếu cứ để mặc cho nó phát triển, bến cảng tự do này chắc chắn sẽ bị tội phạm kéo sập."
 fircon.8025.a:0 "Yêu cầu mở thêm các cảng tự do khác."
 fircon.8025.b:0 "Chúng ta chẳng làm gì sai cả."
 fircon.8025.c:0 "Ra đòn mạnh, xử lý dứt khoát với bọn buôn lậu."

 d_freeports:0 "Cảng Tự do"
 d_freeports_desc:0 "Một khu vực chuyên dành riêng cho việc giao thương xuyên hệ sao với các [GetPreFTLUpperPlural]."

 freeport_smuggling:0 "Buôn lậu Không Kiểm soát"
 freeport_smuggling_desc:0 "Bọn buôn lậu đang tung hoành ngang dọc trên hành tinh."

 #Sweet Tooth
 fircon.8030.name:0 "Hảo Ngọt"
 fircon.8030.desc:0 "Trong quá trình giao thương kinh tế với những [GetPreFTLUpperPlural] thuộc [sweet_country.GetName], chúng ta đã xuất khẩu cho họ một loại ẩm thực phổ biến vô cùng ngon miệng, ít nhất là đối với chúng ta. Tuy nhiên, đã có bằng chứng cho thấy món đồ ngọt thông thường này lại có thể gây ra những tác động về mặt tinh thần đối với [sweet_species.GetName]. Nó có khả năng gây nghiện cao và cực kỳ nguy hiểm. Những thương nhân vô lương tâm đã nhân cơ hội này để xuất khẩu một lượng lớn hàng hóa với giá cao ngất ngưởng, khiến nhiều người dân địa phương rơi vào trạng thái hôn mê, thậm chí tử vong."
 fircon.8030.desc.lith:0 "Trong quá trình giao thương kinh tế với những [GetPreFTLUpperPlural] thuộc [sweet_country.GetName], chúng ta đã xuất khẩu cho họ một loại hương liệu khoáng chất thông thường vô cùng ngon miệng, ít nhất là đối với chúng ta. Tuy nhiên, đã có bằng chứng cho thấy loại gia vị thông thường này lại có thể gây ra những tác động về mặt tinh thần đối với [sweet_species.GetName]. Nó có khả năng gây nghiện cao và cực kỳ nguy hiểm. Những thương nhân vô lương tâm đã nhân cơ hội này để xuất khẩu một lượng lớn hàng hóa với giá cao ngất ngưởng, khiến nhiều người dân địa phương rơi vào trạng thái hôn mê, thậm chí tử vong."
 fircon.8030.a:0 "Cấm buôn bán, và thiết lập một vành đai phong tỏa."
 fircon.8030.b:0 "Chúng ta phải cung cấp hỗ trợ y tế!"
 fircon.8030.c:0 "Sống chết có số. Nhưng kinh doanh thì vẫn là kinh doanh."
 fircon.8030.c.tt:0 "Hàng loạt cá thể [sweet_species.GetName] đã bị giết."

 sweet_tooth_medecine:0 "Hỗ trợ Y tế"
 sweet_tooth_medecine_desc:0 "Chúng ta đã điều động các nguồn lực y tế để điều trị những chứng nghiện ngập trên [sweet_planet.GetName]."
 sweet_tooth_blockade:0 "Phong tỏa An ninh"
 sweet_tooth_blockade_desc:0 "Chúng ta đã điều động nguồn lực để tiến hành phong tỏa toàn diện trên [sweet_planet.GetName], tạo điều kiện thuận lợi cho việc triệt phá các hoạt động buôn bán ma túy đang hoành hành."

 building_primitive_clinic:0 "$building_medical_2$"
 building_primitive_clinic_desc:0 "$building_medical_2_desc$"

 #Land Grabs
 fircon.8035.name:0 "Phong trào cướp đất"
 fircon.8035.desc:0 "Những báo cáo kinh tế đáng lo ngại đã được gửi đến từ [landgrab_planet.GetName], nơi các thương nhân của chúng ta đang tiến hành các hoạt động giao thương với những [GetPreFTLUpperPlural] tại [landgrab_country.GetName]. Khi hiệp ước được ký kết, chúng ta đã áp dụng một số biện pháp để bảo vệ chủ quyền quốc gia của người dân địa phương, thế nhưng một số cá nhân trong chúng ta đã lách luật, mua lại những vùng đất rộng lớn từ những người du mục địa phương. Nếu tình trạng này cứ tiếp diễn với tốc độ hiện tại, chỉ trong vòng chưa đầy một thế hệ, [landgrab_planet.GetName] sẽ hoàn toàn bị các thương nhân tư nhân mua sạch sành sanh."
 fircon.8035.a:0 "Hủy bỏ những giao dịch này, và phạt nặng những kẻ phạm tội."
 fircon.8035.b:0 "Chuyện này không thuộc thẩm quyền của chúng ta."
 fircon.8035.c:0 "Một cơ hội tuyệt vời để làm giàu..."

 d_landgrab_blocker:0 "Bất động sản Nước ngoài"
 d_landgrab_blocker_desc:1 "Những mảnh đất này đã được mua bởi các nhà đầu tư ngoài hành tinh, và cư dân bản địa không còn quyền tiếp cận nữa."
 d_landgrab_foreign_holdings:0 "Bất động sản Từ xa"
 d_landgrab_foreign_holdings_desc:1 "Những khu đất này được mua từ tay người dân bản địa, và giờ đang được quản lý từ trên quỹ đạo."

 #Fruitful Cooperation
 fircon.8040.name:0 "Sự Hợp tác Đầy Trái ngọt"
 fircon.8040.desc:0 "Thỏa thuận thương mại mà chúng ta đã ký kết với [fruitful_coop_country.GetName] đang đơm hoa kết trái. Cả hai bên đều tuân thủ các điều khoản của hiệp định, và hoạt động giao thương đang diễn ra suôn sẻ. Một số thương nhân đã lên tiếng kêu gọi nới lỏng thêm các quy định, nhưng nhìn chung, hiệp định này đã mang lại lợi ích thiết thực cho cả hai bên."
 fircon.8040.b:0 "Có lẽ chúng ta có thể đàm phán lại..."

 good_trade:0 "Thương mại Có lợi"
 fruitful_coop_planet_mod:0 "Sự Hợp tác Đầy Trái ngọt"
 fruitful_coop_planet_mod_desc:0 "Các hoạt động thương mại đang diễn ra chắc chắn mang lại lợi ích to lớn cho người dân địa phương."
 fruitful_coop_country_mod:0 "Thương mại Phồn vinh"
 fruitful_coop_country_mod_desc:0 "Quả thực, việc gây áp lực kinh tế lên một quốc gia [root.GetPreFTLLower] đã được chứng minh là có lợi. Cho chúng ta." # e.g. 'economic pressure on an unenlightened country'

 #Slavers - Us
 fircon.8045.name:0 "Bị Nô dịch"
 fircon.8045.desc:0 "Chúng ta đã nhận được một báo cáo chấn động từ những [GetPreFTLUpperPlural] thuộc [space_slavers_country.GetName]: Những kẻ buôn người vô lương tâm đã đội lốt thương nhân, lạm dụng thỏa thuận thương mại của chúng ta để đáp xuống hành tinh này và bắt cóc hàng loạt người dân địa phương. Chúng ta chỉ nhận thức được sự việc này khi một số lượng lớn [GetPreFTLUpperPlural] thuộc [space_slavers_species.GetName] xuất hiện tại một khu chợ nô lệ ngầm."
 fircon.8045.a:0 "Giải cứu những người bị bắt cóc."
 fircon.8045.b:0 "Chuyện này không thuộc thẩm quyền của chúng ta."
 fircon.8045.b.tt:0 "Một cá thể §Y[space_slavers_species.GetName]§! đã di cư đến §Y[event_target:space_slavers_capital.GetName]§!"
 fircon.8045.c:0 "Nếu chúng muốn nô lệ của chúng ta, chúng phải đóng thuế."

 #Slavers - Them
 fircon.8050.name:0 "Bị Nô dịch"
 fircon.8050.desc:1 "Chúng ta đã nhận được một báo cáo chấn động từ những [GetPreFTLUpperPlural] thuộc [preftl_slavers_country.GetName]: Ở những khu vực hẻo lánh của hành tinh này, đã có vài du khách không gian, chủ yếu là bọn buôn lậu, cùng với con tàu của họ đã mất tích. Thông qua quá trình điều tra cẩn thận, chúng ta phát hiện ra rằng họ đang bị ép làm việc trong hầm mỏ, tránh xa những ánh mắt dòm ngó.\n\nĐáng chú ý là, chính quyền [preftl_slavers_country.GetName] không hề chịu trách nhiệm về việc này, mà những việc này do vài tên lãnh chúa địa phương và bọn tội phạm đầu sỏ gây ra. Ngoài ra, tất cả những cá nhân bị bắt cóc đều đã vi phạm thỏa thuận mà chúng ta ký với những [GetPreFTLUpperPlural]."
 fircon.8050.a:0 "Bọn họ đã nhận được hình phạt thích đáng."
 fircon.8050.b:0 "Không thể chấp nhận được. Hãy đảm bảo sự tự do của họ."
 fircon.8050.c:0 "Phát động một đòn tấn công trừng phạt."
 fircon.8050.c.tt:0 "Vài cá thể [preftl_slavers_species.GetName] đã bị giết."

 #They are fleecing our merchants and its amazing.
 fircon.8055.name:0 "Cuộc Tranh luận Kỳ diệu"
 fircon.8055.desc:0 "Những [GetPreFTLUpperPlural] thuộc [preftl_hagglers_country.GetName] đã chứng minh bằng hành động rằng mình là những thương nhân bẩm sinh. Các thương nhân của chúng ta đã rút ra một bài học cay đắng khi nhận ra rằng người dân địa phương cực kỳ thông minh, và có khả năng ăn nói lưu loát, dĩ nhiên là họ không mấy vui vẻ với điều này.\n\nMặt khác, một số nhà kinh tế học của chúng ta cho rằng những hành vi này của các [GetPreFTLUpperPlural] hoàn toàn đáng để học hỏi."
 fircon.8055.a:0 "Tài trợ cho dự án này."
 fircon.8055.b:0 "Tuyển mộ một cá thể [preftl_hagglers_species.GetName] trong số đó."
 fircon.8055.b.tt:0 "Sở hữu một §YThống đốc§! vô cùng đặc biệt."
 fircon.8055.c:0 "Tạo áp lực lên [preftl_hagglers_country.GetName] để đạt được những giao dịch có lợi hơn."

 leader_trait_preftl_haggler:0 "Đầu óc Kinh doanh"
 leader_trait_preftl_haggler_desc:1 "Vị lãnh đạo này xuất thân từ một quốc gia [Owner.GetPreFTLUpper], và đã chứng tỏ sự nhạy bén vượt bậc trong lĩnh vực thương mại."
 preftl_hagglers_mod:0 "Thuật toán Dự đoán Giao dịch"
 preftl_hagglers_mod_desc:0 "Những nghiên cứu của chúng ta về những [GetPreFTLUpperPlural] thuộc [preftl_hagglers_country.GetName], cùng với những phương thức giao dịch mạnh mẽ của họ, đã giúp chúng ta xây dựng được nhiều mô hình kinh tế vô cùng thuyết phục."

 # Misuse of Tech
 fircon.8500.name:0 "Sự Lạm dụng Công nghệ"
 fircon.8500.desc.regular:0 "Nhằm thúc đẩy thiện ý, chúng ta đã đồng ý chia sẻ công nghệ nhân bản vật chất của mình với các cư dân của [preftl_misusers_planet.GetName]. Lẽ dĩ nhiên là chúng ta hy vọng chúng sẽ sử dụng nó để giải quyết tình trạng thiếu hụt tài nguyên, thế nhưng giờ đây những báo cáo chúng ta nhận được lại cho thấy công nghệ này đã bị vũ khí hóa.\n\nCư dân ở đây đã nảy ra một ý tưởng táo bạo: đảo ngược chức năng của máy nhân bản, khiến nó không còn được dùng để lắp ráp vật chất theo lập trình sẵn nữa, mà trở thành một thiết bị có khả năng tháo rời các sinh vật sống ở cấp độ nguyên tử."
 fircon.8500.desc.xenophobe:0 "Chúng ta đã chia sẻ công nghệ nhân bản vật chất của mình với những cư dân trên [preftl_misusers_planet.GetName]. Đáng lý ra chúng phải sử dụng công nghệ này để giải quyết vấn đề khan hiếm tài nguyên, nhưng chúng lại ngu ngốc vũ khí hóa nó. Chúng đã đảo ngược chức năng của máy nhân bản, bắt tay vào chế tạo một thiết bị có khả năng tháo rời các sinh vật sống ở cấp độ nguyên tử."
 fircon.8500.a:0 "Tịch thu lại công nghệ này, không thể tin tưởng rằng chúng sẽ sử dụng nó đúng cách."
 fircon.8500.b:0 "Việc chúng quyết định sử dụng công nghệ này như thế nào không liên quan đến chúng ta."
 fircon.8505.name:0 "Tịch thu"
 fircon.8505.desc:0 "Lúc đặc vụ của chúng ta đến nơi, cũng chính là lúc [preftl_misusers_species.GetName] đang hoàn thiện thiết bị phân rã nguyên tử cầm tay của chúng. Người của chúng ta đã nói rõ rằng việc tặng thiết bị nhân bản vật chất không phải là để chúng sử dụng vào mục đích này.\n\nĐúng như dự đoán, chúng không hề sẵn lòng từ bỏ công nghệ này. Chính quyền địa phương vô cùng tức giận, gọi hành động tịch thu của chúng ta là một hành vi xâm lược."
 fircon.8510.name:0 "Khuynh hướng Hủy diệt"
 fircon.8510.desc:0 "Thông qua việc đảo ngược thiết kế công nghệ nhân bản vật chất của chúng ta, [preftl_misusers_species.GetName] đã chế tạo thành công một thiết bị phân rã nguyên tử cầm tay, và dùng nó để tàn phá [preftl_misusers_planet.GetName] một cách tàn nhẫn.\n\nTrước khi bắt đầu các thỏa thuận thương mại tiếp theo, tốt nhất chúng ta nên ghi nhớ kỹ về khuynh hướng hủy diệt của chúng."
 tech_abusers:0 "Những kẻ Lạm dụng Công nghệ"
 tech_abusers_desc:0 "Cư dân trên hành tinh này vô cùng tai tiếng vì thói lạm dụng công nghệ."
 opinion_tech_abusers:1 "Họ không đồng tình với lựa chọn của chúng ta."
 opinion_tech_abusers_pro:1 "Họ tôn trọng chúng ta vì sự tin cậy mà chúng ta dành cho họ."

 # Invasive Species
 fircon.8565.name:0 "Sinh vật Xâm lấn"
 fircon.8565.desc:0 "Trong chuyến hành trình trở về từ chuyến viếng thăm ngoại giao gần nhất tới [preftl_invasives_species.GetName] trên hành tinh [preftl_invasives_planet.GetName], chúng ta đã tình cờ phát hiện ra vài hành khách đi lậu bất thường. Một bầy động vật chân đốt nhỏ xíu, không cánh và chuyên bò trườn đã xuất hiện trên tàu con thoi của chúng ta.\n\nChúng di chuyển rất nhanh và kích thước lại rất nhỏ, khiến cho cảm biến của chúng ta không thể nào phát hiện ra chúng. Do khả năng sinh sản vô cùng nhanh chóng, việc kiểm soát sự xâm nhập của chúng ngày càng trở nên khó khăn.\n\nThật không may, đối với người dân trên [preftl_invasives_planet.GetName], sinh vật này lại là biểu tượng của sự trù phú. Cách chúng ta xử lý vấn đề này có thể sẽ ảnh hưởng đến mối quan hệ giữa chúng ta và các [preftl_invasives_species.GetNamePlural]."
 fircon.8565.a:0 "Thông báo cho người cai trị của hành tinh đó biết rằng chúng ta sẽ tiêu diệt lũ côn trùng gây hại này."
 fircon.8565.b:0 "Lặng lẽ giải quyết tình huống này, không cần phải làm bẽ mặt chúng."
 fircon.8570.name:0 "Tiêu diệt"
 fircon.8570.desc:0 "Chúng ta đã thông báo cho các nhà ngoại giao của [preftl_invasives_planet.GetName] về sự việc xâm nhập của loài động vật chân đốt đang diễn ra. Mặc dù sự thẳng thắn của chúng ta làm chúng ngạc nhiên, nhưng cuối cùng chúng vẫn bày tỏ lòng biết ơn trước sự thành thật đó.\n\nChúng gửi lời xin lỗi vì sự sơ suất trong quá trình khử trùng, và cung cấp cho chúng ta một loại thuốc đuổi côn trùng nhân đạo đã được thử nghiệm và chứng minh hiệu quả, vốn rất phổ biến trên [preftl_invasives_planet.GetName]."
 fircon.8570.a:0 "Thành thật là chính sách tốt nhất."
 fircon.8575.name:0 "Tiêu diệt Sạch Sành Sanh"
 fircon.8575.desc:0 "Vì không muốn gây ra tranh chấp ngoại giao, chúng ta đã cố gắng giải quyết một cách êm thấm vấn đề sâu bọ đang tràn lan trên [preftl_invasives_planet.GetName] gần đây.\n\nCông việc này hoàn toàn không dễ dàng vì loài sinh vật này sinh sản quá nhanh và chúng rất thích ăn các vật chất vô cơ.\n\nKhi nhà ngoại giao của chúng ta xuất hiện tại một cuộc họp với bộ quần áo rách tươm do bị bọ cắn, các [preftl_invasives_species.GetNamePlural] ngay lập tức hiểu ra vấn đề.\n\nChúng có vẻ cảm thấy lúng túng vì loài sinh vật này, nên đã cung cấp cho chúng ta một loại thuốc xua đuổi côn trùng nhân đạo."
 fircon.8575.a:0 "Mọi sự ô nhiễm đã được loại bỏ hoàn toàn."
 straight_talkers:0 "Có sao nói vậy"
 straight_talkers_desc:0 "Chúng ta sẽ nói sự thật."
 no_worries:0 "Không cần Phải Lo lắng"
 no_worries_desc:0 "Chúng ta không phải là những kẻ thích gây rối."

 # Different Flavors of Government
 fircon.8531.name:0 "Đặc điểm của Chính phủ"
 fircon.8531.base.desc:0 "Cư dân [preftl_different_flavors_species.GetNamePlural] trên [preftl_different_flavors_planet.GetName] đã vô cùng sốc khi phát hiện ra rằng hình thức tổ chức chính phủ của chúng ta khác biệt hoàn toàn với họ. Điều khó tin là, trong suốt lịch sử của hành tinh, người dân nơi đây chưa bao giờ trải qua cấu trúc quyền lực kiểu này. Rõ ràng, mọi người đang bắt đầu lo ngại về việc liệu chúng ta có khả năng thực hiện các hoạt động ngoại giao một cách hiệu quả hay không."
 fircon.8531.democratic.desc:0 "$fircon.8531.base.desc$\n\nHọ không biết dân chủ đã mang lại cho chúng ta những lợi ích gì, và cũng chẳng biết hương vị đích thực của tự do ra sao."
 fircon.8531.a:0 "Truyền đạt lại các giá trị của chúng ta cho họ."
 fircon.8531.b:0 "Tìm kiếm điểm chung, nhưng vẫn giữ lại những điểm khác biệt."
 fircon.8535.imperialist.desc:0 "$fircon.8531.base.desc$\n\nHọ cần phải hiểu điều gì đã làm cho đế quốc vĩ đại và hùng cường của chúng ta trở nên vĩ đại và hùng cường đến vậy. Họ vẫn chưa được nếm trải hương vị của chủ nghĩa đế quốc."
 fircon.8540.dictatorship.desc:0 "$fircon.8531.base.desc$\n\nChúng ta nên giải phóng họ khỏi sự ngu muội này. Hương vị của chế độ độc tài sẽ khiến họ một lần nữa được vỗ cánh bay cao."
 fircon.8545.oligarchy.desc:0 "$fircon.8531.base.desc$\n\nTập trung quyền lực vào tay một nhóm nhỏ những người được lựa chọn kỹ càng là phương pháp cai trị duy nhất. Thật là một điều bí ẩn khi họ không thể nhận ra điều này."
 fircon.8550.name:0 "Tiến Dần Lại Gần"
 fircon.8550.desc:0 "Sau khi chúng ta truyền bá triết lý chính trị của mình cho họ, cư dân [preftl_different_flavors_species.GetNamePlural] trên [preftl_different_flavors_planet.GetName] đã làm theo cách của chúng ta và bắt đầu quá trình cải cách chính trị.\n\nNhững kế hoạch này đang được triển khai trên quy mô toàn cầu, mở ra một kỷ nguyên mới cho [preftl_different_flavors_species.GetNamePlural]. Để kỷ niệm cuộc chuyển giao vĩ đại về mặt chính trị này, chính phủ mới của [preftl_different_flavors_species.GetNamePlural] đã tổ chức một cuộc diễu hành để tôn vinh chúng ta."
 fircon.8555.name:0 "Bất đồng Ngoại giao"
 fircon.8555.desc:0 "Sau khi học hỏi cách chúng ta thực thi quyền lực, các [preftl_different_flavors_species.GetNamePlural] đã quyết định duy trì hiện trạng trên [preftl_different_flavors_planet.GetName], cho rằng đây mới là cách tiến bộ tối ưu nhất.\n\nHọ đã thề sẽ giữ vững lập trường của mình, quyết không dao động trước ảnh hưởng của các thế lực bên ngoài.\n\nCác hoạt động ngoại giao vẫn đang được tiến hành, nhưng không còn nghi ngờ gì nữa, họ không còn tin tưởng chúng ta nhiều như trước đây."
 fircon.8560.name:0 "Tình bạn Vĩnh cửu, Mãi mãi Trường tồn"
 fircon.8560.desc:0 "Thay vì gây áp lực lên đối phương, chúng ta lại muốn từ tốn giải thích cho [preftl_different_flavors_species.GetNamePlural] trên [preftl_different_flavors_planet.GetName] về các lý thuyết đằng sau chế độ quyền lực của chính phủ chúng ta.\n\nHọ vô cùng khâm phục những quan điểm của chúng ta về các mô hình chính phủ khác nhau, và bày tỏ lòng biết ơn vì chúng ta đã không cố gắng ép buộc họ phải tuân phục.\n\nCác nhà ngoại giao của cả hai bên đã thiết lập nên mối quan hệ bền chặt và lâu dài, cùng nhau tận hưởng một bữa tiệc chung. Dựa trên các điều khoản có lợi cho cả hai bên, quan hệ ngoại giao đang tiếp tục phát triển."
 fircon.8560.a:0 "Sự tôn trọng luôn là con đường siêu không gian hai chiều."

 stand_your_ground:0 "Ôm Khư Khư Đồ Cũ"
 stand_your_ground_desc:0 "Những con người này vô cùng tự hào về quá khứ của mình, và kiên định bám víu lấy cấu trúc chính phủ truyền thống."
 opinion_flavors_up:0 "Họ đánh giá rất cao phương pháp ngoại giao của chúng ta."
 opinion_flavors_down:0 "Họ không còn đặt nhiều niềm tin vào chúng ta nữa."

 fircon.8000.name:0 "Tâm lý Bài ngoại"
 fircon.8000.desc:0 "Trong một ví dụ giao lưu văn hóa thú vị, một lượng lớn thanh niên trên [pre_ftl_planet.GetName] đã hình thành một sở thích tiêu dùng mãnh liệt đối với mọi thứ thuộc về [owner.GetAdj]. Những thanh niên đầy nhiệt huyết này tranh giành nhau bất cứ thứ gì liên quan đến văn hóa của chúng ta, và giờ đây họ đã tạo nên một nhóm văn hóa phụ đầy sức sống và đang không ngừng phát triển trên hành tinh này.\n\nThậm chí, chúng ta còn nhận được tin rằng hội nghị người hâm mộ sắp tới sẽ tổ chức một cuộc thi hóa trang."
 fircon.8000.a:0 "Họ có cần giám khảo không?"
 fircon.8000.b:0 "Cứ để tụi nhỏ tự do vui đùa đi."
 fircon.8000.c:0 "Quá đủ rồi, văn hóa của chúng ta chỉ là của riêng chúng ta."
 fircon.8000.d:0 "Lũ giả mạo thật gớm ghiếc, hãy ngăn chúng lại."
 xenophiliacs_tt:0 "Việc hạn chế tình trạng này chắc chắn sẽ chọc giận người dân trên [pre_ftl_planet.GetName]."

 fircon.8001.name:0 "Văn hóa Hóa trang"
 fircon.8001.desc:0 "Hội nghị [owner.GetAdj] trên [pre_ftl_planet.GetName] đã thành công rực rỡ! Mọi người không phân biệt già trẻ đã tụ tập tại thành phố lớn nhất của hành tinh này để ăn mừng mọi thứ liên quan đến [owner.GetName]. Bên cạnh thiện ý mà hội nghị mang lại, nó còn cung cấp một cú hích đáng mong đợi cho nền kinh tế địa phương.\n\nĐiểm nhấn tuyệt vời nhất có lẽ là cuộc thi hóa trang, giải thưởng lớn nhất đã được trao cho những người hâm mộ cuồng nhiệt [owner.GetRulerTitle] [owner.GetRulerName] của chúng ta."
 fircon.8001.a:0 "Mức độ giống nhau đến kinh ngạc."
 pre_ftl_diplomacy_01:0 "Văn hóa Hóa trang"

 fircon.8002.name:0 "Trở về Cội Nguồn"
 fircon.8002.desc:0 "Sau khi chúng ta sử dụng sức ảnh hưởng của mình để kìm hãm cộng đồng người hâm mộ [owner.GetAdj] đang phát triển mạnh mẽ trên [pre_ftl_planet.GetName], người dân ở đó đã đoàn kết lại và thể hiện văn hóa của mình theo những cách truyền thống. Nhờ đó, sản lượng của các ngành văn hóa và nghệ thuật đã được cải thiện rõ rệt."
 pre_ftl_diplomacy_02:0 "Nghệ thuật Trăm hoa Đua nở."

 fircon.8003.name:0 "Không Còn Chút Sự Yêu Mến"
 fircon.8003.desc:0 "Thái độ cứng rắn của chúng ta đối với những người hâm mộ [owner.GetAdj] trên [pre_ftl_planet.GetName] đã gây ra sự phản đối mạnh mẽ. Nhiều cư dân trên hành tinh này bắt đầu tôn vinh văn hóa và truyền thống của chính họ, đồng thời phản đối kịch liệt [owner.GetAdj].\n\nĐiều này sẽ tác động thế nào đến quan hệ ngoại giao giữa hai hành tinh, vẫn còn phải chờ xem"
 fircon.8003.a:0 "Chúng ta không cần sự yêu mến của họ."
 opinion_pre_ftl_diplomacy_03:0 "Không phải là người hâm mộ của chúng ta."

 # Market Fluctuations, AKA Space Stonks

 fircon.8060.name:0 "Biến Động Thị Trường"
 fircon.8060.desc:0 "Phát hiện rằng mình không hề đơn độc giữa vũ trụ bao la đã khiến nhiều người trên [pre_ftl_country.Capital.GetName] rơi vào bàng hoàng. Không ngoài dự đoán, cú sốc này gây ra ảnh hưởng kinh tế nặng nề. Khi các cơ sở tiền tệ trên khắp hành tinh lao dốc không phanh, mức sống của người dân sụt giảm thấy rõ."
 fircon.8060.a:0 "Giúp họ vượt qua hoạn nạn."
 fircon.8060.b:0 "Hãy để thị trường tự định đoạt."

 fircon.8065.name:0 "Thị Trường Đã Vững Vàng"
 fircon.8065.desc:0 "Gói kích cầu tài chính mà chúng ta dành cho [pre_ftl_country.Capital.GetName] đã đem lại quả ngọt lớn. Đồng tiền cùng nền kinh tế của họ, nhờ có sự chống đỡ từ chúng ta, cuối cùng cũng tìm lại được sự ổn định.\n\nVà có lẽ điều đáng giá hơn cả là sự ủng hộ của người dân đối với việc chúng ta tiếp tục ở lại hệ sao này đã dâng cao hơn bao giờ hết."
 fircon.8065.a:0 "Tốn kém bộn bề, nhưng là việc cần làm."
 opinion_pre_ftl_diplomacy_02:0 "Bậc thầy tài chính."

 fircon.8070.name:0 "Thị Trường Tự Khắc Thấu Suốt"
 fircon.8070.desc:0 "Niềm tin của chúng ta vào sự tự điều tiết của thị trường đã được đền đáp xứng đáng.\n\nSau khi rũ bỏ được những luật lệ ràng buộc ngột ngạt, giới tài chính tại [pre_ftl_country.Capital.GetName] đã vững vàng trở lại. Cư dân nơi đó giờ đây có thể an lòng khi biết con đường làm ăn của mình đang vô cùng tươi sáng."

 fircon.8075.name:0 "Cú Sụp Đổ Thế Kỷ"
 fircon.8075.desc:0 "Thật khó hiểu khi niềm tin của chúng ta vào việc thị trường [pre_ftl_country.Capital.GetName] có thể tự gượng dậy lại biến thành một thảm họa khôn lường. Tình hình trên hành tinh đang tồi tệ chưa từng thấy, và người dân đang lớn tiếng đòi chính quyền phải siết chặt quản lý mảng tiền tệ."
 economic_whoopsie_tt:0 "Hỏng bét."

 pre_ftl_diplomatic_01:0 "Quỹ Cứu Trợ Tiền Tệ Khẩn Cấp"
 pre_ftl_diplomatic_01_desc:0 "Một nền kinh tế vững vàng có trách nhiệm đỡ đầu những kẻ kém may mắn trong lúc khó khăn hoạn nạn."
 pre_ftl_diplomatic_02:0 "Chi Phí Đánh Đổi"
 pre_ftl_diplomatic_02_desc:0 "Khoản bỏ ra hôm nay là mầm mống cho sự vươn lên ngày mai, số tiền này là chi phí bắt buộc phải chịu."
 pre_ftl_diplomatic_03:0 "Độ Vững Vàng Kinh Tế"
 pre_ftl_diplomatic_03_desc:0 "Lần đầu chạm trán với giống loài có trí khôn ngoài vũ trụ đã khiến thị trường của xã hội này cắm đầu lao dốc."
 pre_ftl_diplomatic_04:0 "Vực Dậy Kinh Tế"
 pre_ftl_diplomatic_04_desc:0 "Nền kinh tế của hành tinh này đã được chống đỡ thành công."
 pre_ftl_diplomatic_05:0 "Thị Trường Thấy Điềm Tệ Nhất"
 pre_ftl_diplomatic_05_desc:0 "Chẳng một ai có thể lường trước được đợt suy thoái kinh tế nặng nề đến nhường này."
 opinion_pre_ftl_diplomacy_01:0 "Quan hệ bấp bênh"

 # The Lone Drone (I, Drone)
 fircon.8515.name:0 "Cá Thể Cô Độc"
 fircon.8515.desc:0 "Trong chuyến thăm ngoại giao xuống bề mặt [preftl_lone_drone_planet.GetName], một cá thể [preftl_lone_drone_species.GetName] lẻ loi đã tìm cách tiếp cận chúng ta. Dù [preftl_lone_drone_species.GetNamePlural] vốn là một giống loài tâm trí bầy đàn, nhưng cá thể này lại xem mình là một bản thể riêng biệt và đang cầu xin chúng ta che chở.\n\nSau khi nhìn thấy chúng ta, dường như nó đã được gợi mở và khao khát được bước vào xã hội của chúng ta. Khi được gặng hỏi, nó liên tục nhắc lại rằng bản thân không thể hòa nhập cùng bầy đàn, đồng thời quả quyết rằng mình sinh ra đã mang sẵn ý thức độc lập."
 fircon.8515.a:0 "Hiện tại chúng ta không thể gánh nổi hậu quả nếu chọc giận bầy đàn."
 fircon.8515.b:0 "Chấp thuận chở che."
 fircon.8520.name:0 "Tái Hòa Nhập Bầy Đàn"
 fircon.8520.desc:0 "Chúng ta đã khước từ lời xin nương náu của cá thể [preftl_lone_drone_species.GetName] cô độc kia. Chúng ta tin đây là giải pháp tốt nhất cho cả đôi bên.\n\nKhông nhận được sự giúp đỡ từ phía chúng ta, [preftl_lone_drone_species.GetName] đành quay về với đồng loại, van nài để được sống độc lập.\n\n[preftl_lone_drone_species.GetNamePlural] đoan chắc với chúng ta rằng đó chỉ là một cá thể lạc lối bị lỗi; nó đã tìm lại sự tỉnh táo và quay về với khối tập thể. Thứ gọi là bản thể độc lập ấy sẽ không bao giờ xuất hiện trước mắt chúng ta nữa.\n\nMối bang giao với [preftl_lone_drone_planet.GetName] vẫn tiếp tục diễn ra bình thường."
 fircon.8525.name:0 "Về Cùng Một Mái Nhà"
 fircon.8525.desc:0 "Ban đầu, cá thể [preftl_lone_drone_species.GetName] cô độc đến từ [preftl_lone_drone_planet.GetName] bị choáng ngợp trước quy mô của sự biến chuyển. Thế nhưng, khi nỗi ngỡ ngàng ban đầu dần lắng xuống, nó đang dần quen với cuộc sống của một sinh thể tự do. Và trớ trêu thay, giờ đây nó đã bắt đầu giống hệt chúng ta."
 fircon.8525.a:0 "Chào mừng."
 fircon.8525.a.tt:0 "Một §HNhà khoa học§! mới sẽ được thêm vào danh sách §H$RECRUITABLE_LEADERS$§!."
 opinion_lone_drone:0 "Hài lòng khi bầy đàn thu nhận lại."

 # list effects/triggers

 effect_random_observed_pre_ftl_within_border:0 "Một quốc gia [GetPreFTLUpper] ngẫu nhiên nằm trong lãnh thổ và có trạm quan sát của chúng ta"
 effect_every_observed_pre_ftl_within_border:0 "Mọi quốc gia [GetPreFTLUpper] nằm trong lãnh thổ và có trạm quan sát của chúng ta"
 effect_random_pre_ftl_within_border:0 "Một quốc gia [GetPreFTLUpper] ngẫu nhiên nằm trong lãnh thổ của chúng ta"
