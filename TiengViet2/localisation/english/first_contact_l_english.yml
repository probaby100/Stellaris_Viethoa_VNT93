 eager_explorers_base_effect:1 "Bắt đầu với 2 §H$explorer_vessel_plural$§!, cùng một §H$engineer_vessel$§! trang bị §HĐộng cơ Không gian con§!, khiến chúng không thể thực hiện các chuyến bay siêu không gian, nhưng lại có được khả năng của động cơ bước nhảy một cách hạn chế.\nTăng xác suất khám phá ra công nghệ §HDu hành Siêu quang tốc§!."
 civic_eager_explorers_negative_effects: "$t$—Bắt đầu với những bất lợi về công nghệ và cơ sở hạ tầng, ít hơn 1K £pop£ so với khởi đầu thông thường"

 civic_eager_explorers:0 "Những nhà Thám hiểm Khao khát"
 civic_eager_explorers_desc:0 "$CHALLENGING_CIVIC$Được thúc đẩy bởi khát khao vươn tới các vì sao, nền văn minh này đã đốt cháy giai đoạn trong nhiều bước phát triển, chạm đến kỷ nguyên thám hiểm không gian sớm hơn hầu hết các quốc gia khác."
 civic_eager_explorers_effects:0 "$eager_explorers_base_effect$"
 civic_privatized_exploration:0 "Thám hiểm Tư nhân"
 civic_privatized_exploration_desc:0 "$CHALLENGING_CIVIC$Trong nhiều năm ròng, nền văn minh này luôn được hứa hẹn rằng động cơ siêu không gian sắp hoàn thiện. Họ kiên nhẫn chờ đợi, thế nhưng suốt thời gian đó, các công ty con phụ trách dự án lại âm thầm tuồn tiền vào các tài khoản cá nhân. Khi hành vi lừa đảo cuối cùng bị phanh phui, Tập đoàn đành phải chữa cháy bằng cách vội vã tung ra những con tàu thám hiểm thử nghiệm."
 civic_privatized_exploration_effects:0 "$eager_explorers_base_effect$\nBắt đầu với công nghệ §H$tech_starbase_3$§!, và có sẵn một §H$tech_starbase_3$§! đã được xây dựng trong hệ sao mẹ.\n£building£§Y$building_private_mining_consortium$§!$megacorp_civic_branch_office_building_effect$"
 civic_hive_stargazers:0 "Kẻ Ngắm sao"
 civic_hive_stargazers_desc:0 "$CHALLENGING_CIVIC$Sau bao tháng ngày đắm chìm trong vẻ đẹp kỳ diệu của bầu trời đêm, ý thức tổ ong này luôn sục sôi khao khát được vươn mình ra bên ngoài. Để theo đuổi tham vọng này, mọi định hướng phát triển khác đều bị gác lại, và một hạm đội nhỏ có khả năng thực hiện các chuyến bay không gian con hạn chế đã được chế tạo."
 civic_hive_stargazers_effects:1 "$eager_explorers_base_effect$\nBổ sung thêm đặc điểm §H$trait_stargazer$§!.\nKhởi đầu với mức độ tình báo thấp về cụm sao xuất phát."
 civic_machine_exploration_protocol:0 "Giao thức Thám hiểm"
 civic_machine_exploration_protocol_desc:0 "$CHALLENGING_CIVIC$Sự thôi thúc phải biên mục các dạng sống trên các ngoại hành tinh chính là nền tảng trong chương trình trung tâm của trí tuệ máy móc này. Để thực thi chỉ thị này, nó đã dồn phần lớn tài nguyên của mình vào việc xây dựng một hạm đội nhỏ, chuyên thực hiện các chuyến bay không gian con trong phạm vi hạn chế."
 civic_machine_exploration_protocol_effects:1 "$eager_explorers_base_effect$\nQuan sát các nền văn minh Tiền FTL sẽ nhận thêm §G50%§! tiến độ sự thấu hiểu.\nMỗi lần thiết lập Tiếp xúc Đầu tiên thành công sẽ nhận được £unity£§HĐoàn kết§!."

