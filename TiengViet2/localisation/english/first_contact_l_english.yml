l_english:

 FIRST_CONTACT_TITLE: "First Contact Story Pack" # Do not translate
 DLC_FIRST_CONTACT_RECOMMENDATION_DESC:0 "§STiếp Xúc Đầu Tiên§! là một gói cốt truyện khám phá những cuộc chạm trán ban đầu với các nền văn minh tiền FTL. Gói cốt truyện này đồng thời cũng giới thiệu công nghệ tàng hình!"
 DLC_FIRST_CONTACT_RECOMMENDATION_REC_DIPLO:0 "Chúng tôi khuyến nghị §STiếp Xúc Đầu Tiên§!, bởi vì những tính năng mới đi kèm trong gói cốt truyện này có thể giúp các tương tác của bạn với các xã hội tiền FTL trở nên năng động và lôi cuốn hơn."
 DLC_FIRST_CONTACT_RECOMMENDATION_REC:0 "Chúng tôi khuyến nghị §STiếp Xúc Đầu Tiên§! vì một số tùy chọn bạn đã chọn phù hợp với nội dung của nó. Gói cốt truyện này tập trung vào ngoại giao, gián điệp và quan sát sự phát triển của các nền văn minh tiền FTL."

