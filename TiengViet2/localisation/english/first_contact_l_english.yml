 # Evil Slavers Empire
 NAME_MSI_country:0 "Công Ty Minamar Specialized Industries"
 NAME_MSI_country_initials:0 "MSI"
 NAME_MSI_species:0 "Olinbar"
 NAME_MSI_species_plural:0 "Olinbar"
 ADJ_MSI_country:1 "Olinbari"
 personality_decadent_capitalists:0 "Doanh Nghiệp Nhân Từ"
 personality_decadent_capitalists_desc:0 "Minamar Specialized Industries tự nhận mình là một doanh nghiệp nhân từ, chuyên cung cấp công nghệ cho các nền văn minh kém phát triển để thúc đẩy sự tiến bộ của họ. Nhờ vào hoạt động cho vay nặng lãi tàn nhẫn và lực lượng lao động hợp đồng trải rộng khắp ngân hà của công ty, các cổ đông được đảm bảo sẽ nhận được những khoản cổ tức kếch xù."

 origin_slavers:0 "Nấc Thang Lên Trời"
 origin_slavers_desc:0 "Kể từ ngày hội đồng quản trị của $NAME_MSI_country$ lần đầu tiên đưa nền văn minh của chúng ta vươn tới những vì sao, chúng ta đã thấu hiểu một chân lý rằng, vũ trụ này vô cùng tráng lệ và huy hoàng, nếu không chia sẻ nó cho những người khác thì thật là một sự lãng phí khủng khiếp. Kể từ thời điểm đó, chúng ta đã không tiếc công sức giúp đỡ các nền văn minh kém phát triển hiện thực hóa khả năng du hành siêu quang tốc.\n\nMặc dù sự khai sáng này không hề miễn phí, nhưng tại $NAME_MSI_country_initials$, đây luôn là một khoản đầu tư hoàn toàn xứng đáng."
 origin_tooltip_slavers_effects:0 "— Bắt đầu trò chơi với tư cách là §HĐế chế Tiên tiến§!\n— Bắt đầu trò chơi với một số lượng £pop£§HDân số§! bị bắt làm nô lệ, bọn họ được bắt cóc từ các §HNền văn minh Tiền FTL§! khác nhau trên khắp ngân hà.\n— Được phép sử dụng trạng thái oanh tạc §H$bombardment_raiding$§!, có khả năng bắt cóc £pop£§HDân số§! từ các hành tinh và tái định cư họ đến thuộc địa của bạn."

 opinion_former_slaves:0 "Nô lệ cũ"
 opinion_slavers:0 "Chủ nô cũ"
 opinion_fellow_slaves:0 "Đồng bào cùng chịu chung cảnh ngộ"

 # First Contact
 fcsum_MSI_country_summary:0 "Chúng ta đã tiến hành liên lạc với [MSI_country.GetName] tại §H[This.System.GetName]§!."
 first_contact.4000.name:0 "Liên lạc với $NAME_MSI_country_initials$"
 first_contact.4000.desc.broken_shackles:0 "Chúng ta đã thiết lập liên lạc với [MSI_country.GetName]. Ưu tiên hàng đầu hiện nay là chúng ta phải xử lý tình hình đang không ngừng thay đổi này một cách cực kỳ thận trọng. Chúng ta nên phái một đặc sứ để đại diện cho lợi ích của mình. Bất kỳ sự tương tác nào với những người chủ cũ chắc chắn cũng sẽ gây ra những tác động tâm lý sâu sắc đối với người dân của chúng ta."
 first_contact.4000.desc.payback:0 "Những dữ liệu thu thập được từ phi thuyền ngoài hành tinh mà chúng ta chạm trán tại §H[This.System.GetName]§! khiến chúng ta lạnh sống lưng. Vẻ ngoài của nó đã quá đỗi quen thuộc với chúng ta, huy hiệu trên đó giống như một biểu tượng của nỗi sợ hãi tột cùng: con dấu có cánh của §H$NAME_MSI_country$§!.\n\nChúng ta đã tìm thấy những kẻ xâm lược từng đô hộ mình. Việc họ phát hiện ra danh tính của những phi thuyền này của chúng ta chỉ còn là vấn đề thời gian, bởi vì công nghệ mà chúng ta đang sử dụng hoàn toàn là của họ. Những cuộc chạm trán mới là điều không thể tránh khỏi, nhưng chúng ta tuyệt đối sẽ không lặp lại những sai lầm trong quá khứ."
 first_contact.4000.a.bs:0 "Thật đáng tức giận."
 first_contact.4000.a.payback:0 "Chúng ta phải chuẩn bị sẵn sàng nghênh chiến."
 first_contact.4000.a.tooltip:0 "Bắt đầu tiến trình §YLiên lạc Lần hai§! với §Y$NAME_MSI_country$§!."

