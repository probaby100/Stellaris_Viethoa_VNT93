 #Events

 origin.6005.name:0 "Yêu cầu thuyên chuyển"
 origin.6005.desc.base1:0 "Một nhà khoa học đến từ [fotd_habitants.capital_scope.GetName] đã yêu cầu được gia nhập [Owner.GetHomeWorldName] của chúng ta.\n\n[fotd_Leader.GetName] là một chuyên gia về [fotd_Leader.GetSpecialization], và muốn được hưởng các quyền lợi tương đương với bất kỳ người [Root.GetSpeciesName] nào trên [Root.GetHomeWorldName]."
 origin.6005.desc.base2:0 "Một nhà khoa học đến từ [fotd_habitants.capital_scope.GetName] đã yêu cầu được gia nhập [Owner.GetHomeWorldName] của chúng ta.\n\nTrưởng nhóm khoa học của chúng ta đã giữ liên lạc với [fotd_Leader.GetName] trong nhiều năm, và luôn dành những lời khen ngợi không ngớt cho những công trình mà [fotd_Leader.GetHerHis] đã thực hiện."
 origin.6005.desc.base3:0 "Một nhà khoa học đến từ [fotd_habitants.capital_scope.GetName] đã yêu cầu được gia nhập [Owner.GetHomeWorldName] của chúng ta.\n\nMặc dù [fotd_Leader.GetSheHe] được các đồng nghiệp của [fotd_Leader.GetHerHis] trên [owner.GetHomeWorldName] gọi là vị nhà khoa học ít hoang tưởng nhất trên [fotd_habitants.capital_scope.GetName], nhưng những lời nhận xét như vậy thực ra cũng chẳng nói lên được gì nhiều."
 origin.6005.desc.base4:0 "Một nhà khoa học đến từ [fotd_habitants.capital_scope.GetName] đã yêu cầu được gia nhập [Owner.GetHomeWorldName] của chúng ta.\n\n[fotd_Leader.GetName] coi bản thân như một vị tử đạo. [fotd_Leader.GetSheHe] đến hành tinh \"bị bao phủ bởi vận rủi\" của chúng ta, với hy vọng có thể cứu vãn nền khoa học công nghệ của chúng ta khỏi bị các thế lực bên ngoài hủy diệt."

 origin.6005.desc.end1:0 "[fotd_Leader.GetSheHeCap] đã cầu cứu chúng ta, bởi vì điều kiện cơ sở vật chất hạn chế trên [fotd_habitants.capital_scope.GetName] đã cản trở nghiên cứu của [fotd_Leader.GetHerHis]. Các nhà khoa học của chúng ta đã đứng ra bảo lãnh, cam đoan rằng mọi hành vi của vị khách tiềm năng này đều sẽ chuẩn mực."
 origin.6005.desc.end2:0 "Nghiên cứu của [fotd_Leader.GetHerHisCap] đã bị chính phủ của [fotd_Leader.GetHerHis] quy là mối nguy hiểm. Sự tổn thất của họ, chính là lợi ích của chúng ta."
 origin.6005.desc.end3:0 "Nhờ vào những thành tựu xuất sắc trong học thuật, [fotd_Leader.GetSheHeCap] sẽ nhận được một giải thưởng danh giá trên [Owner.GetHomeWorldName]. [fotd_Leader.GetSheHeCap] cũng đã đồng ý ở lại chỗ chúng ta một thời gian, để tổ chức một loạt các bài giảng về những nghiên cứu của mình."
 origin.6005.desc.end4:0 "[fotd_Leader.GetSheHeCap] sẽ nghiên cứu [GetStudyTopic] tại địa phương, và cố gắng sử dụng những điều này để cải thiện cuộc sống trên [fotd_habitants.capital_scope.GetName]."
 origin.6005.a:0 "Bạn được chào đón miễn là bạn tuân thủ các quy tắc của xã hội chúng ta."
 origin.6005.a.tt:0 "Thêm §Y[fotd_Leader.GetName]§! vào §H$RECRUITABLE_LEADERS$§! của chúng ta với tư cách là §HNhà khoa học§!."
 origin.6005.b:0 "Tự lo cho thân mình đi."

 origin.6006.desc.base1:0 "Một chỉ huy từ [fotd_habitants.Capital.GetName] đã đề nghị được gia nhập vào hải quân của chúng ta, đảm nhận vị trí chỉ huy lâm thời. Động cơ của [fotd_Leader.GetSheHeCap] vẫn chưa rõ ràng, nhưng những nguồn tin nội bộ cho biết, chuyện này có thể liên quan đến một vụ bê bối."
 origin.6006.desc.base2:0 "[fotd_Leader.GetName] đang vô cùng khẩn thiết muốn ký hợp đồng lâm thời với chúng ta. [fotd_habitants.Capital.GetName] luôn là nơi ươm mầm cho những chiến thuật xảo quyệt và phi truyền thống."
 origin.6006.desc.base3:0 "Nhờ vào màn thể hiện xuất sắc của chỉ huy [fotd_Leader.GetName] trong cuộc diễn tập hạm đội chung gần đây, chúng ta đã quyết định mở rộng quyền hạn của người này, để họ chỉ huy một hạm đội hải quân thực thụ."
 origin.6006.desc.base4:1 "Do bị tình nghi đặt những con tàu dưới quyền chỉ huy của [fotd_Leader.GetHerHis] vào tình thế quá nguy hiểm nên đã bị tạm thời chuyển công tác, vị chỉ huy bất mãn [fotd_Leader.GetName] đã yêu cầu được gia nhập hải quân của chúng ta. Dù [fotd_Leader.GetName] đã mang tiếng xấu, nhưng những người từng phục vụ cùng [fotd_Leader.GetHerHim] vẫn tôn trọng tài năng của [fotd_Leader.GetHerHis]."
 origin.6006.a:0 "Miễn là bạn không làm điều gì sai trái."
 origin.6006.a.tt:0 "Thêm §Y[fotd_Leader.GetName]§! vào §H$RECRUITABLE_LEADERS$§! của chúng ta với tư cách là §HChỉ huy§!."
 origin.6006.b:0 "Bạn là một kẻ quá tùy tiện, khó kiểm soát!"

 origin.6010.name:0 "Khát khao [fotd_seperatist_planet.GetName]"
 origin.6010.desc:0 "Sau khi sống cùng chúng ta trong nhiều năm, [fotd_Leader.GetName] đã quyết định quay trở về quê hương. Một số quan chức chính phủ phản đối sự thay đổi này, vì [fotd_Leader.GetName] đã trở thành một phần không thể thiếu trong bộ máy lãnh đạo cấp cao của chúng ta.\n\n[GetfotdCoercion]"
 origin.6010.a:0 "Chúng ta sẽ giữ đúng lời hứa."
 origin.6010.a.tt:0 "[fotd_Leader.GetName] sẽ trở về [fotd_seperatist_planet.GetName]"
 origin.6010.b:0 "Chúng ta phải giữ họ lại bằng mọi giá."
 origin.6011.desc:0 "Gần đây, tính cách của [fotd_Leader.GetName] ngày càng trở nên khép kín. [fotd_Leader.GetSheHe] lại một lần nữa cầu xin được về nhà. Đồng nghiệp của [fotd_Leader.GetHerHisCap] chỉ ra rằng, căn bệnh trầm cảm của [fotd_Leader.GetHerHis] đã liên tục ảnh hưởng tiêu cực đến công việc chung, và khuyên chúng ta nên chấp thuận cho [fotd_Leader.GetHerHis] rời đi."

 origin.6012.name:0 "Về nhà"
 origin.6012.desc:0 "Trong vài chu kỳ qua, người ta thấy [fotd_Leader.GetName] thường hay lẩm bẩm một mình, thỉnh thoảng lại đi đi lại lại trong sảnh. Hôm nay, [fotd_Leader.GetSheHe] đã không đến làm việc. Một trong những chiếc tàu thoát hiểm của chúng ta cũng đã được báo cáo mất tích. Những sự kiện này khó có thể chỉ là sự trùng hợp."
 origin.6012.a.tt:0 "[fotd_Leader.GetName] đã trở về [fotd_seperatist_planet.GetName]."
 origin.6015.name:0 "Tầm nhìn xuyên hệ sao"
 origin.6015.desc:0 "Có vẻ như các nhà khoa học trên hành tinh anh em của chúng ta đã đạt được một vài bước đột phá mới mẻ, được công nhận và vô cùng sâu sắc trong lĩnh vực [root.fotdGetTech]. Mặc dù tầm nhìn của họ có thể nói là khá hạn hẹp, nhưng phải công nhận một điều trong trường hợp này, công nghệ của họ đã vượt qua những thành tựu mà chính chúng ta đạt được.\n\nHọ sẵn lòng chia sẻ những hiểu biết của mình với chúng ta, đổi lấy việc chúng ta [root.fotdGetTechPrice] - điều chắc chắn là, cái giá này không hề rẻ."
 origin.6015.a:0 "Được, chúng ta sẽ tuân theo."
 origin.6015.a.tt:0 "Điều này sẽ khiến chúng ta không thể tiến vào §YHư cảnh§! trong §R10 năm§!."
 origin.6015.b:0 "Cử gián điệp."
 origin.6015.c:0 "Họ điên rồi sao? Chúng ta tuyệt đối không thể đồng ý chuyện này."

 origin.6020.name:0 "Yêu cầu [root.GetSeperatistAid] từ [fotd_seperatist_planet.GetName]"
 origin.6020.desc:0 "Cho dù là do sự lơ là trong công việc, sự yếu kém của nhân viên, hay chỉ đơn thuần là do xui xẻo, §Y[fotd_seperatist_planet.GetName]§! hiện đang chìm sâu trong cuộc khủng hoảng nguồn cung [root.GetSeperatistAid]. Nếu không có sự trợ giúp, rất có thể hàng triệu người sẽ phải chịu thảm họa."
 origin.6020.a:0 "Chúng ta cần giúp đỡ những người đồng bào [fotd_seperatist_planet.owner.GetSpeciesNamePlural]."
 origin.6020.a.tt:0 "[fotd_seperatist_planet.GetName] sẽ khắc cốt ghi tâm chuyện này."
 origin.6020.b:0 "Vậy chúng ta sẽ nhận lại được cái gì?"
 origin.6020.c:0 "Nếu họ cần sự trợ giúp, họ nên quay lại tái gia nhập với chúng ta."
 origin.6025.name:0 "Cung cấp [root.GetFotDAid] cho [fotd_seperatist_planet.GetName]"
 origin.6025.desc.base:0 "[fotd_seperatist_planet.GetName] có vẻ như đã nhận được sự viện trợ kinh tế từ một nơi nào đó ở xung quanh. Bây giờ họ đã sẵn sàng để đề phòng những tác động tồi tệ nhất có thể xảy ra trong cuộc khủng hoảng [root.GetFotDAid]."
 origin.6025.desc.helped:0 "$origin.6025.desc.base$\n\nNhờ vào sự hỗ trợ trước đây của chúng ta, họ đã quyết định trả lại món nợ ân tình này, bằng cách cung cấp sự giúp đỡ cho chúng ta mà không mong cầu điều kiện gì."
 origin.6025.desc.didnthelp:0 "$origin.6025.desc.base$\n\nMột sứ giả với thái độ tự mãn đã thông báo cho chúng ta rằng cái giá để họ cung cấp sự giúp đỡ là [root.fotdGetTechPrice]. Chúng ta có sự lựa chọn nào sao?"
 origin.6025.a:0 "Quả là một người hàng xóm tốt."
 origin.6025.b:0 "Hãy cho lũ [fotd_seperatist_planet.Owner.GetSpeciesNamePluralInsult] đó những gì chúng muốn."
 origin.6025.c:0 "Chúng ta nên tự lực vượt qua khó khăn."

 origin.6030.name:0 "Cuộc thanh trừng đầu tiên"
 origin.6030.desc:0 "Mặc dù tin tức xác nhận sự tồn tại của người ngoài hành tinh không phải là điều nằm ngoài dự liệu đối với [Root.GetHomeWorldName], nhưng tình hình trên [fotd_seperatist_planet.GetName] lại tồi tệ hơn nhiều. Vốn dĩ họ vẫn luôn ôm một niềm hy vọng nhỏ nhoi để sống, cầu nguyện rằng sự hủy diệt của Kẻ Đại chia rẽ chỉ là một tai nạn kỳ lạ, nhưng giờ đây họ đã tin chắc rằng, cả vũ trụ đang nhắm vào họ.\n\n\"Chúng ta cần tiêu diệt những người ngoài hành tinh này trước khi chúng đến đây để hoàn thành công việc!\" Đây chính là những tiếng gào thét điên loạn đang được phát sóng trên các phương tiện truyền thông của [fotd_seperatist_planet.GetName]."
 origin.6030.a:0 "Hệ sao mà chúng ta đang sống là như vậy đấy. Bọn họ sẽ nhanh chóng quen thôi."
 origin.6030.b:0 "Thật là vô nghĩa, hãy chặn các tín hiệu truyền phát của họ lại."

 origin.6040.name:0 "Phát hiện kẻ bám đuôi"
 origin.6040.desc:0 "Tin tức về việc phát hiện ra sự sống trí tuệ ngoài hành tinh đã lan đến [fotd_seperatist_planet.GetName]. Tuy nhiên, trái với dự đoán của chúng ta, [fotd_seperatist_planet.GetName] không hề phát ra những cảm xúc sợ hãi và tức giận, thay vào đó, nơi này lại chìm vào im lặng. Nhiều tàu liên sao đã quay trở lại xưởng đóng tàu của họ, và một số động cơ siêu quang tốc cũ kỹ đã được chuyển ra khỏi nhà kho. Có vẻ như họ đang chuẩn bị cho một chuyến đi xa."
 origin.6040.a:0 "Chúng ta cần biết chuyện gì đang xảy ra."
 origin.6040.a.tt:0 "Tiến hành tuần tra an ninh, để ứng phó với bất kỳ vụ rò rỉ thông tin tình báo nào có thể xảy ra."
 origin.6040.b:0 "Mặc kệ để họ tự chơi với nhau đi."

 origin.6045.name:0 "Lần chạm trán thảm họa"
 origin.6045.desc.base:0 "Sau khi chúng ta bước đầu triển khai việc liên lạc với [From.GetName], chúng ta đã nhận được một số tin tức đáng lo ngại: một hạm đội tấn công bao gồm các tàu [Root.GetAdj] lỗi thời đã tiến vào vùng không gian của [From.GetSpeciesAdj], hiện đang tăng tốc lao về phía căn cứ sao của họ. Những chiến hạm này di chuyển với gia tốc lớn như vậy, chắc hẳn bất kỳ [owner_species.GetBiologicalLithoidLower] nào bên trong tàu giờ đây đều đã chuyển sang trạng thái [owner_species.GetLiquidState]."
 origin.6045.desc.secured:0 "$origin.6045.desc.base$\n\nMay mắn là, chúng ta đã chuẩn bị đầy đủ. Sau khi quan sát những hành vi bất thường của [fotd_seperatist_planet.GetName], chúng ta có thể bắn hạ chúng ngay trong không gian bất cứ lúc nào, để ngăn chúng không đâm vào trạm không gian."
 origin.6045.desc.notsecured:0 "$origin.6045.desc.base$\n\nChúng ta không có cách nào để ngăn chặn thảm họa này. Những quả tên lửa siêu quy cách này sẽ tiêu diệt hoàn toàn căn cứ sao của [target_system.GetName]. Chúng ta chỉ có thể chứng kiến trong sự kinh hoàng. Trừ phi..."
 origin.6045.a:0 "Ngăn chặn chúng ngay lập tức!"
 origin.6045.starbase_destroyed.tt:0 "Căn cứ sao tại §Y[target_system.GetName]§! sẽ bị §Rtiêu diệt§!."
 origin.6045.b.secured:0 "Hãy để chúng làm suy yếu những người ngoài hành tinh này, rồi sau đó đổ lỗi cho [fotd_seperatist_planet.GetName]."
 origin.6045.b.notsecured:0 "Đưa ra lời tuyên bố xin lỗi, và đổ lỗi cho [fotd_seperatist_planet.GetName]."
 origin.6045.c:0 "Hàng xóm của chúng ta đang rất yếu ớt. Nhân cơ hội này để kết liễu họ!"
 origin.6045.c.tt:0 "$origin.6045.starbase_destroyed.tt$\n[fotd_seperatist_planet.GetName] sẽ mất đi quyền kiểm soát đối với §Y5§! chiếc tàu hộ tống đang nằm tại hệ sao §Y[target_system.GetName]§!.\nSẽ tiến vào trạng thái §Rchiến tranh tổng lực§! với §Y[From.GetName]§!."
 origin.6046.name:0 "Tổn thất căn cứ sao"
 origin.6046.desc:1 "Căn cứ sao của chúng ta tại §Y[target_system.GetName]§! đã bị tiêu diệt bởi một vụ nổ do nhóm tự xưng là \"những kẻ đào tẩu\" của [From.GetName] gây ra. Chúng ta đã nhận được lời xin lỗi, đối phương hứa hẹn rằng tình trạng này sẽ không tái diễn. Nhưng ai mà biết được? Hôm nay là [target_system.GetName], có lẽ ngày mai sẽ là [capital_star.GetName]."
 origin.6046.a:0 "Theo dõi sát sao hành động của họ."
 origin.6046.b:0 "Họ đã đe dọa đến sự tồn vong của chúng ta. Không phải họ chết thì là chúng ta mất mạng!"
 origin.6047.name:0 "Thợ săn và Con mồi"
 origin.6047.desc:0 "Không lâu sau lần tiếp xúc đầu tiên với [From.GetName], căn cứ sao của chúng ta tại §Y[target_system.GetName]§! đã bị phá hủy bởi một vụ nổ. Trước khi hệ thống bị sập, chúng ta đã nhận được hình ảnh, đó là một hạm đội đối phương sử dụng thiết kế của [From.GetAdj].\n\nGiờ đây chúng ta nhận ra mình đã bị cuốn vào một cuộc chiến sinh tử."

 origin.6055.name:0 "Không cái này thì cái kia!"
 origin.6055.desc.base:0 "Mặc dù chúng ta đã cố gắng hết sức để che giấu họ, nhưng không lâu sau, [fotd_seperatist_planet.GetName] đã nghe được việc chúng ta trở thành một quốc gia thành viên của [owner.federation.GetName]. Những bằng chứng cho thấy tinh thần thân thiện với người ngoài hành tinh này đã làm dấy lên những phản ứng vô cùng cực đoan trên hành tinh anh em của chúng ta. Chỉ trong một đêm, hàng loạt những từ ngữ và nhãn mác mang tính xúc phạm nhằm vào các quốc gia thành viên khác trong liên bang của chúng ta đã tràn ngập."
 origin.6055.desc.noprotests:0 "$origin.6055.desc.base$\n\nSự phẫn nộ của công chúng thậm chí đã ảnh hưởng đến cả giới học thuật trên hành tinh anh em của chúng ta, hiện tại họ đã chấm dứt mọi dự án hợp tác giữa hai hành tinh. Chỉ có thể hy vọng rằng các đồng minh liên bang mới của chúng ta sẽ có thể thấu hiểu được tất cả những điều này."
 origin.6055.desc.protests:0 "$origin.6055.desc.base$\n\n[fotd_seperatist_planet.GetName] vốn dĩ đã vô cùng tức giận vì các hành động ngoại giao trước đây của chúng ta, và lần này thì họ đã hoàn toàn trở mặt. Trước khi chúng ta cắt đứt liên lạc với họ, họ đã kịp gửi đi một số thông điệp sặc sỡ nhằm vào các đồng minh của chúng ta, gây tổn hại đến mối quan hệ giữa chúng ta, những ảnh hưởng này có lẽ sẽ là vĩnh viễn."
 origin.6055.a:0 "Đồng minh của chúng ta sẽ coi chuyện này như một trò hề vô nghĩa. Chắc chắn là vậy."
 origin.6055.b:0 "Cử đặc phái viên!"

 origin.6060.name:0 "Kẻ săn mồi tối thượng"
 origin.6060.desc:0 "Những tin tức truyền đến từ hệ sao [FromFrom.solar_system.GetName] đã gây chấn động mạnh mẽ đến hành tinh mẹ của chúng ta. Nếu một con quái vật như vậy có thể tồn tại, thì trong sâu thẳm vũ trụ còn có thể ẩn giấu những mối đe dọa nào nữa? Trong nhân dân, số lượng đơn xin di cư đến [fotd_seperatist_planet.GetName] đã tăng vọt. Tuy nhiên vào lúc này, chúng ta khó có thể đổ lỗi cho họ."
 origin.6060.a:0 "Lẽ nào chúng ta đã sai sao?"
 origin.6060.a.tt:1 "§R200§! £pop£§HDân số§! sẽ di cư đến [fotd_seperatist_planet.GetName]"
 origin.6060.b:0 "Không! [fotd_seperatist_planet.GetName] mới là kẻ sai! Chúng ta phải cùng nhau đối mặt với chuyện này."

 origin.6065.name:0 "Hậu quả của những việc đã làm"
 origin.6065.desc:0 "Sau khi chúng ta quy phục [overlord.GetName], [fotd_seperatist_planet.GetName] đã lập tức nhảy ra mỉa mai chúng ta.\n\n\"Bất kỳ sự sống ngoài hành tinh nào về bản chất đều mang tính thù địch. Nếu ngay từ đầu các người chịu ở lại [home_planet.GetStarName], thì chuyện này đã không xảy ra!\"\n\nKhỏi phải nói, người dân trong nước của chúng ta hiện tại vẫn chưa thực sự đoàn kết với nhau cho lắm."
 origin.6065.a:0 "Cắt đứt liên lạc."

 origin.6075.name:0 "Lốt cừu"
 origin.6075.desc:0 "Sau khi thu nhận một chư hầu, đế chế của chúng ta đã tiến thêm một bước nữa để trở thành một cường quốc vũ trụ. Tuy nhiên, [fotd_seperatist_planet.GetName] lại không cho là như vậy. Theo lời họ nói, chúng ta chỉ đang thành công trong việc kéo gần lại những mối đe dọa từ người ngoài hành tinh. Để tỏ thái độ phản đối, họ đã ngừng tất cả các hoạt động hợp tác nghiên cứu với chúng ta.\n\nSau một thời gian, chúng ta nhất định sẽ chứng minh được rằng họ đã sai."
 origin.6075.a:0 "Thần dân của chúng ta chắc chắn không hề đang âm mưu chống lại chúng ta!"

 origin.6085.name:0 "Tiên phát chế nhân"
 origin.6085.desc:0 "Vào buổi bình minh của [FromFrom.GetName], chúng ta đã có được một đồng minh ngoài dự kiến: những người đồng chí từ [fotd_seperatist_planet.GetName] cuối cùng đã đạt được sự đồng thuận với chúng ta về một vấn đề ngoại giao, họ khẩn thiết yêu cầu chúng ta phải quét sạch bọn người ngoài hành tinh. Điều đáng tiếc là, một khi chiến tranh kết thúc, sự hợp tác như vậy cũng sẽ đi đến hồi kết."
 origin.6085.a:0 "Xưởng đóng tàu của chúng ta cần được hỗ trợ!"
 origin.6085.b:0 "Phân công nhân lực lên các chiến hạm của chúng ta."
 origin.6085.c:0 "Bọn họ có quan sát được điều gì liên quan đến kẻ địch không?"
 origin.6085.d:0 "Chúng ta có thể tự mình đối phó."
 origin.6090.name:0 "Đã nói từ trước rồi"
 origin.6090.desc:0 "Ngày mà cư dân của [fotd_seperatist_planet.GetName] từng dự đoán nay đã đến: cùng với việc quốc gia địch tuyên chiến với chúng ta, ngân hà đã trở thành một nơi hoang lương và đầy rẫy sự thù địch. Tuy nhiên, câu chuyện này vẫn chưa đến hồi kết. Chúng ta sẽ vượt qua được cửa ải này."

 #Cyborg
 origin.6095.name:0 "Tư duy đa luồng"
 origin.6095.desc:0 "Người dân của chúng ta vẫn còn khá xa lạ với trải nghiệm nâng tầm trình độ tư duy thông qua các phương tiện nhân tạo này, do đó khi nghe tin những người trên [fotd_seperatist_planet.GetName] có phản ứng phản đối kịch liệt đối với bản nâng cấp mới của chúng ta, thì ai nấy đều vô cùng ngạc nhiên. Những người này cảnh báo rằng, nếu chúng ta tiếp tục \"làm ô uế\" cơ thể của chính mình, mọi nỗ lực hợp tác trước đây sẽ bị coi là vô hiệu."
 origin.6095.a:0 "Sự thấu hiểu của họ đối với việc cần phải trả giá những gì để có thể sống sót trong ngân hà này quá đỗi nông cạn và ngây thơ."

 origin.6096.name:0 "Quyền lợi được cường hóa"
 origin.6096.desc:0 "Chúng ta đã quyết định chuyển đổi hoàn toàn sang hình thức sinh mệnh tổng hợp, và kết quả là, những người trên [fotd_seperatist_planet.GetName] đã thực hiện trọn vẹn lời đe dọa ban đầu của họ: mọi kênh liên lạc, mọi trạm nghiên cứu hợp tác và tất cả các hình thức truyền thông hiện đều đã bị phong tỏa.\n\nXét thấy hiện tại chúng ta đã phát triển đến mức độ này, vấn đề cốt lõi là, liệu chúng ta có còn cần họ nữa hay không."
 origin.6096.a:0 "Hãy để cho họ run rẩy trong bóng tối đi."

 #Synths
 origin.6099.name:0 "Bản sao kim loại"
 origin.6099.desc:0 "Lô cơ thể tổng hợp đầu tiên đang liên tục lăn ra khỏi dây chuyền sản xuất của nhà máy, và đang được kiểm tra bởi những người sẽ cư ngụ trong chúng ở tương lai. Tuy nhiên, không phải mọi [Species.GetName] đều cảm thấy hào hứng với sự phát triển phi thường này. Cư dân của [fotd_seperatist_planet.GetName] đã lên tiếng cảnh báo, nếu chúng ta tiếp tục đi theo con đường sai lầm này, mọi nỗ lực hợp tác trước đây sẽ bị coi là vô hiệu."
 origin.6099.a:0 "Hãy tiến tới hình thái mới của chúng ta!"
 origin.6100.name:0 "Sự hoàn hảo không trọn vẹn"
 origin.6100.desc:0 "Mỗi thành viên của [Root.GetName] đều đã chấp nhận hình thái sinh mệnh tổng hợp máy móc, mới mẻ của mình. Tuy nhiên, những người trên [fotd_seperatist_planet.GetName] thì lại lựa chọn ở lại trong thân xác phàm tục [fotd_seperatist_planet.Owner.Species.GetFleshy] của họ. Hơn nữa, họ đã thực hiện lời đe dọa trước đó, chấm dứt toàn bộ mọi mối quan hệ hợp tác với chúng ta."
 origin.6100.a:0 "Không thể nhìn thấu được nhà tù [fotd_seperatist_planet.Owner.Species.GetFleshy] của họ."

 #Psionic
 origin.6105.name:0 "Tư tưởng lạc lối"
 origin.6105.desc:0 "Không cần phải chờ đợi phán quyết không thể tránh khỏi của [fotd_seperatist_planet.GetName]. Chúng ta đã nhận thức đầy đủ về những suy nghĩ phẫn nộ của họ. Trong tất cả những âm thanh bất hòa, tiếng gọi chấm dứt mọi mối quan hệ hợp tác đặc biệt nổi bật."
 origin.6105.a:0 "Đúng là những kẻ bảo thủ ngoan cố."
 origin.6110.name:0 "Vứt bỏ phái cựu cựu"
 origin.6110.desc: "Cuối cùng chúng ta cũng đã thiết lập liên lạc với một thực thể khổng lồ trong §HHư cảnh§!. Một lần nữa, [GetLamentations] của [fotd_seperatist_planet.GetName] lại quấy rầy chúng ta; họ đang ngắt kết nối khỏi mạng lưới của chúng ta, hủy bỏ mọi hoạt động nghiên cứu chung."
 origin.6110.desc_2.default: "Chỉ chúng ta mới hiểu hành động này thực sự vô nghĩa đến nhường nào. Một mối quan hệ đối tác khai sáng hơn sắp ra đời."
 origin.6110.desc_2.robot: "Hành động thiếu logic này vô nghĩa. Khả năng xử lý của chúng ta đã vượt xa tầm hiểu biết nguyên thủy của họ."
 origin.6110.desc_2.gestalt: "Sự bất thường mang tính cá nhân chủ nghĩa này không đáng để chúng ta chú ý, những kẻ không thể hiểu được tư tưởng khai sáng của chúng ta không có chỗ đứng giữa chúng ta."
 origin.6110.a:0 "Sự thăng thiên của chúng ta là xu hướng tất yếu."

 #Biological
 origin.6115.name:0 "Loại bỏ sự không hoàn hảo"
 origin.6115.desc:0 "Kể từ khi chúng ta cải tạo thành công nguồn cung cấp của chính mình, [Root.GetSpeciesName] đã mơ ước về những khả năng vô hạn của việc tăng cường gen. Giờ đây ngày đó đã đến. Những khiếm khuyết, điểm yếu, sự không hoàn hảo - tất cả sẽ trở thành những tàn dư lịch sử bị vứt bỏ.\n\nSự phản đối duy nhất đến từ cư dân của [fotd_seperatist_planet.GetName]. Họ gọi sự cải tạo này là một sự sa ngã, tất yếu sẽ dẫn đến một xã hội phân giai cấp do những người hoàn thiện gen thống trị."
 origin.6115.a:0 "Cho phép những tì vết này tiếp tục tồn tại là vô trách nhiệm."
 origin.6120.name:0 "Phát triển quá mức"
 origin.6120.desc:0 "[fotd_seperatist_planet.GetName] từ chối mọi hình thức liên lạc. Khi chúng ta giải mã được bí mật cách ghép gen của người ngoài hành tinh vào cấu trúc cơ thể của mình, thông điệp duy nhất họ để lại cho chúng ta là: \"Các người đã từ bỏ ý nghĩa của việc làm một [fotd_seperatist_planet.owner.GetSpecesName]\"."
 origin.6120.a:0 "Bỏ lại những kẻ thiển cận ở phía sau."

 origin.6125.name:1 "Thợ săn ngoài rừng"
 origin.6125.desc:1 "Khi cả vũ trụ đối mặt với mối đe dọa, ngay cả những người hàng xóm ẩn dật của chúng ta cũng phải đứng lên hành động. Miễn là chúng ta có thể chống lại cơn bão đang tới, chúng ta sẽ lại là một dân tộc.\n\nChúng ta đã được trao quyền chỉ huy hạm đội [fotd_seperatist_planet.GetName]."
 origin.6125.a:1 "Chúng ta từ chối bị bóp nghẹt."

 origin.6145.name:0 "Cần xác nhận"
 origin.6145.desc:0 "Hành tinh anh em của chúng ta yêu cầu chúng ta xác nhận một số phát hiện của họ. Họ lại một lần nữa tuyên bố có bằng chứng cho thấy §YKẻ Đại chia rẽ§! thực chất đã bị phá hủy bởi một thực thể ngoài hành tinh đầy ác ý nào đó. Điều này đã trở nên nhàm chán; cứ vài năm, họ lại dường như phát hiện ra một vài \"bằng chứng\" mới."
 origin.6145.a:0 "Hãy để họ mua vui cho chúng ta."
 origin.6150.name:0 "Bằng chứng kinh hoàng"
 origin.6150.desc:0 "[fotd_seperatist_planet.GetName] đã đúng!\n\nCuộc tấn công mà chúng ta phải gánh chịu nhiều năm trước thực sự là do một thực thể tà ác có khả năng bắn đạn vonfram cỡ lớn gây ra. Nhờ trường hấp dẫn độc đáo của hệ sao mẹ, chúng ta mới có thể sống sót. Bằng cách phân tích dữ liệu từ đêm định mệnh đó và đối chiếu với những phát hiện mới này, chúng ta có thể định vị được nguồn gốc của viên đạn vonfram có kích thước bằng tiểu hành tinh này.\n\nNó đến từ một hệ sao cực kỳ giàu khoáng sản (nhưng ngoài ra không có đặc điểm nào khác) mà chúng ta đã ghi nhận từ hàng thập kỷ trước."
 origin.6150.a:0 "Nạp năng lượng cho động cơ siêu quang tốc của chúng ta."

 origin.6155.name:0 "Vùng đất hoang tàn"
 origin.6155.desc:0 "Hệ sao nơi thế lực từng xâm lược chúng ta cư ngụ giờ đây là một vùng đất cằn cỗi. Mặc dù việc một vành đai tiểu hành tinh thiếu khoáng chất không phải là hiếm, nhưng vành đai tiểu hành tinh này có thể nói là đã bị vét sạch. Hơn nữa, ở những nơi đáng lẽ phải có các tiểu hành tinh giàu kim loại hiếm, chúng ta chỉ tìm thấy bụi. Bất kể giống loài cư ngụ trong hệ sao này đã lấy vonfram ở đâu để chế tạo đạn, thì hiện tại chúng không còn nguồn tài nguyên như vậy nữa. Dường như chúng thậm chí không có khả năng rời khỏi hành tinh của mình.\n\nMặc dù chúng đã cố gắng hết sức để giữ bí mật, chặn mọi tín hiệu vô tuyến, thậm chí hạn chế sử dụng ánh sáng nhân tạo, nhưng chúng ta vẫn phát hiện ra sự sống trên hành tinh có thể sinh sống được duy nhất trong hệ sao đó."
 origin.6155.a:0 "Hãy đến thăm cơn ác mộng cũ."

 origin.6160.name:0 "Thợ săn"
 origin.6160.desc:1 "Trải nghiệm quan sát người §YFevorian§! khá là khai sáng đối với chúng ta. Trên thực tế, hệ tư tưởng của họ rất giống với hệ tư tưởng đã dẫn đến sự chia rẽ của chính giống loài chúng ta. Tuy nhiên, thay vì chọn cách tự cô lập, người Fevorian đã chọn chiến lược tấn công phủ đầu vào bất kỳ dấu hiệu sống nào họ có thể phát hiện. Khi cạn kiệt kim loại nặng, những người ngoài hành tinh này chỉ có thể quay trở lại hành tinh của họ, gom góp mọi thứ từ quê hương cằn cỗi hiện tại để sống qua ngày. Mặc dù giới lãnh đạo của hành tinh đối tác của chúng ta đang thúc giục chúng ta áp dụng chiến lược giống hệt người Fevorian, nhưng làm thế nào để đối phó tốt nhất với những kẻ có khả năng tiêu diệt chúng ta lại không đơn giản như chúng ta tưởng."
 origin.6160.a:0 "Vũ trụ chỉ còn lại chúng ta mới an toàn."
 origin.6160.a.tooltip:1 "Chúng ta sẽ tham gia cùng hành tinh anh em, xóa sổ toàn bộ các dạng sống khác để đảm bảo an toàn cho ngân hà. Bắt đầu từ tảng đá này."
 origin.6160.b:0 "Chúng ta sẽ bày tỏ sự cảm thông với họ."
 origin.6160.c.tooltip:0 "Chân thành hy vọng họ có thể học được từ chúng ta, không phải tất cả người ngoài hành tinh đều phải bị giết sạch."

 origin.6165.name:0 "Ôm lấy bóng tối"
 origin.6165.desc:0 "Tiêu diệt người Fevorian lại... dễ dàng thế sao? Lại bớt đi một thợ săn đe dọa đến sự tồn vong của chúng ta. Đã rất lâu rồi chúng ta không cảm thấy đồng điệu với hành tinh đối tác của mình đến thế. Có lẽ họ đã đúng. Ở đây chỉ có hai loại sự sống: tĩnh lặng và cái chết."
 origin.6165.a:0 "Chúng ta nên làm cho tất cả bọn chúng câm lặng."
 origin.6165.b:0 "Không, chúng ta sẽ không trở thành kẻ xâm lược."

 origin.6170.name:0 "Món quà cuối cùng"
 origin.6170.desc:0 "§YVệ tinh Fevorian§! quan trọng hơn chúng ta dự kiến ban đầu. Toàn bộ kim loại nặng còn sót lại trong toàn hệ sao hóa ra đều nằm trong vệ tinh này, nghiên cứu sâu hơn phát hiện ra vệ tinh này thực chất là một máy phóng khối lượng khổng lồ. Các cơ chế phóng phức tạp đan xen bao quanh toàn bộ tiểu hành tinh. Các tính toán sơ bộ cho thấy, vũ khí này có thể phóng tải trọng ở vận tốc gần bằng vận tốc ánh sáng.\n\nDữ liệu của lần phóng cuối cùng vẫn còn trong máy tính điều khiển hỏa lực của nó, mục tiêu chính là [Root.GetHomeWorldName]."
 origin.6170.a:0 "Chúng ta phải trở về quê nhà!"

 origin.6175.name:0 "Bị săn đuổi"
 origin.6175.desc:0 "Người §YFevorian§! đã chiến thắng. Dân số của chúng ta thập tử nhất sinh, quê hương tan hoang.\n\nCho đến giây phút cuối cùng của hành tinh này, các tàu vận tải xuyên khí quyển vẫn liên tục đưa [Owner.GetSpeciesNamePlural] lên quỹ đạo. Còn những người không kịp rời đi thì đã bị thiêu rụi trong tích tắc bởi nhiệt độ cực cao ngay khoảnh khắc viên đạn cận quang tốc đánh trúng. [fotd_seperatist_planet.GetName] sẵn sàng tiếp nhận chính phủ của chúng ta và bố trí cho người tị nạn."

 origin.6180.name:0 "Dọn dẹp đường bay"
 origin.6180.desc:1 "[Target.GetName] đã an toàn trở lại. Chúng ta đã làm chệch hướng viên đạn vonfram đủ xa để đảm bảo sự sống còn của chính mình. Mặc dù sau hành trình dài đằng đẵng của mình, nó rất có thể sẽ trở thành vấn đề của một hành tinh khác."
 origin.6180.a:0 "Giờ thì, hãy xem vệ tinh nào."

 origin.6185.name:0 "Biện pháp đối phó"
 origin.6185.desc:0 "Các nhà khoa học của chúng ta đã làm việc không mệt mỏi để giải quyết \"§YVấn đề Fevorian§!\", và hiện đã đề xuất bốn giải pháp hoàn toàn khác nhau. Nếu chúng ta hành động nhanh chóng, họ tin rằng chúng ta có cơ hội đáng kể để làm chệch hướng thứ kinh hoàng này."
 origin.6185.a:0 "Nhìn nó hoàn thành!"

 origin.6205.name:0 "[home_planet.GetName] bị ô nhiễm"
 origin.6205.desc:0 "Do cuộc biểu tình do [fotd_seperatist_planet.GetName] tổ chức đã biến thành bạo loạn ngay trước cổng chính đại sứ quán [From.GetAdj], sự kiện lẽ ra là để ăn mừng sự đa dạng và tình hữu nghị, cuối cùng lại kết thúc trong sự chua chát. Những người biểu tình không ngần ngại bày tỏ quan điểm của mình, họ đã hô vang những khẩu hiệu sặc sỡ như \"[From.GetSpeciesNamePluralInsult] cút về bãi rác đi!\"\n\nKhông có gì ngạc nhiên khi vụ việc này rõ ràng đã trở thành ngòi nổ cho sự căng thẳng trong quan hệ ngoại giao giữa hai nước."
 origin.6205.a:0 "Lập tức lên án [fotd_seperatist_planet.GetName] và gửi lời xin lỗi."
 origin.6205.b:0 "Cứ để họ kêu gào."

 origin.6220.name:0 "Mặt trận thống nhất"
 origin.6220.desc:0 "Cuộc chiến [FromFrom.GetName] sẽ được ghi nhớ mãi mãi, tại thời khắc này chúng ta sát cánh cùng [fotd_seperatist_planet.GetName], chung tay chống lại mối đe dọa ngoại lai.\n\nĐối mặt với mối đe dọa mới nhất này, chúng ta cứ ngỡ sẽ nhận được những lời chế nhạo từ người dân của [fotd_seperatist_planet.GetName]. Nhưng phản hồi của họ lại là:\n\n\"Có cần giúp đỡ gì không?\""
 origin.6220.a:0 "Chúng ta cần đóng thêm nhiều tàu hơn!"
 origin.6220.b:0 "Hạm đội của chúng ta cần thêm sĩ quan!"
 origin.6220.c:0 "Cho chúng ta biết tất cả mọi thứ về kẻ thù của chúng ta."
 origin.6220.d:0 "Chúng ta có thể tự mình đối phó."

 origin.6230.name:0 "Hoạt động cải tạo môi trường của [fotd_seperatist_planet.GetName]"
 origin.6230.desc:0 "[Root.GetSpeciesNamePlural] không thích nghi với các điều kiện trên [fotd_seperatist_planet.GetName]. Nhưng nhờ vào việc cải tạo môi trường tỉ mỉ, môi trường khắc nghiệt cuối cùng sẽ lùi vào dĩ vãng.\n\nMặc dù [fotd_seperatist_planet.GetName] vẫn còn sót lại một số môi trường khó khăn hơn, nhưng cư dân của hành tinh này đã biến môi trường [From.Target.GetClassAdj] hoàn toàn trở thành lịch sử."
 origin.6230.a:0 "Hy vọng họ thích những thay đổi này."

 origin.6235.name:0 "Cải tạo môi trường của [fotd_seperatist_planet.GetName] đạt hiệu quả xuất sắc"
 origin.6235.desc:0 "Họ đã hoàn thành.\n\nMột số người trong chúng ta trước đây đã nói rằng cư dân của [fotd_seperatist_planet.GetName] quả là điên rồ mới định cư ở cái nơi quỷ quái đó. Vậy mà giờ đây, họ đã cải tạo nơi đó thành [home_planet.GetName] thứ hai, thu hút mọi [Root.GetSpeciesName]."
 origin.6235.a:0 "Có vẻ như hành tinh của chúng ta không còn là nơi duy nhất hấp dẫn ở [from.Target.GetStarName] nữa."

 origin.6240.name:0 "Cải tạo môi trường của [fotd_seperatist_planet.GetName] đạt tới mức hoàn mỹ"
 origin.6240.desc.changedhome:0 "Có lẽ lấy cảm hứng từ thành công trong việc cải tạo môi trường của chính chúng ta, cư dân của [fotd_seperatist_planet.GetName] đã biến hành tinh của họ thành một tuyệt tác thực sự. [From.Target.GetClassName] vốn đã trù phú nay đã trở thành một Hành tinh Gaia. Cư dân có thể tiếp tục ẩn náu khỏi những mối đe dọa của vũ trụ trong thiên đường."
 origin.6240.desc.notchangedhome:0 "Tin tức từ [fotd_seperatist_planet.GetName] thật đáng hổ thẹn: cư dân địa phương đã vượt qua giới hạn phát triển của [home_planet.GetName]. Họ đã rũ bỏ hình thái [From.GetClassName], kiến tạo thành công một Hành tinh Gaia. Đứng trước một ngôi nhà lý tưởng ngay gần kề, người dân của chúng ta bắt đầu đặt câu hỏi: Tại sao chúng ta lại phải tiếp tục sống ở đây?"
 origin.6240.a.changedhome:0 "Muốn cải thiện ngôi nhà của mình là một suy nghĩ rất đỗi tự nhiên."
 origin.6240.a.notchangedhome:0 "[fotd_seperatist_planet.GetName] làm cho bầu trời của chúng ta trở nên mờ nhạt."

 origin.6260.name:0 "Gác đêm"
 origin.6260.desc:0 "Các báo cáo gần đây cho biết [fotd_seperatist_planet.GetName] đã triển khai một hạm đội tuần tra để bảo vệ [capital_star.GetName]. Có vẻ như họ đã phát triển được công nghệ tàng hình. Thật tốt khi họ đã đồng ý chia sẻ tần số với chúng ta."

 origin.6275.name:0 "Thợ săn già"
 origin.6275.desc:0 "Xin chào các vị Quan sát giả. Nghe nói tổ tiên chúng ta từng có ý định tiêu diệt các vị.\n\nVì điều này, chúng tôi xin gửi lời xin lỗi. Thành thật mà nói, chúng tôi rất ngạc nhiên khi các vị không hề trả đũa.\n\nNhiều thế kỷ đã trôi qua kể từ thời điểm đó, chúng tôi muốn tin rằng giờ đây chúng tôi là một dân tộc khác, không thể phủ nhận điều đó cũng nhờ công của các vị.\n\nChúng tôi muốn trao cho vũ trụ thêm một cơ hội nữa. Liệu chúng tôi có thể cùng khám phá với các vị không?"
 origin.6275.a:0 "Có thể."
 origin.6275.b:0 "Các vị có thể hành động theo ý muốn của mình."
 origin.6275.b.tt:0 "Chúng ta sẽ trở về hệ sao mẹ Fevorian."
 origin.6275.c:0 "Tự lo cho bản thân đi." #Callback to one of the Leader events
 origin.6275.c.tt:0 "Chúng ta sẽ ngừng khai sáng cho người Fevorian."

 ## Situations ##

 situation_last_gift:0 "Món quà cuối cùng"
 situation_last_gift_type:0 "$situation_last_gift$"
 situation_last_gift_desc:0 "Người Fevorian đã để lại cho chúng ta một món quà chia tay khủng khiếp: từ xa sơ bộ cho thấy, lần phóng cuối cùng của máy phóng khối lượng khổng lồ của họ nhắm vào mục tiêu là [Target.GetName]."
 situation_last_gift_monthly_change_tooltip:0 "Tiến độ của tình huống này không thể đảo ngược, chỉ có thể làm chậm lại."
 situation_exploding_planet_outcome_approach:0 "[Target.GetName] sẽ bị trúng đạn vonfram phá sao, trở nên không thể sinh sống được."
