 ### Jaunting Traveler Event Chain
 #Intro
 first_contact.3000.name:0 "Vị Khách"
 first_contact.3000.desc:0 "Một con quái vật lớn bằng tòa nhà, mọc đầy xúc tu bỗng nhiên xuất hiện tại §Y[This.Owner.Capital.GetName]§!, khiến thủ đô rơi vào tình trạng hỗn loạn. Sinh vật này dường như cũng bối rối y như chúng ta trước sự xuất hiện đột ngột của chính mình, nó đã bị chúng ta bắt giữ và giam cầm mà không hề có bất cứ sự kháng cự nào.\n\nNhiều [owner.GetScientistPlural] tuyên bố rằng, sinh vật mang mật danh §HVị Khách§! này đến từ ngoài vũ trụ, trong khi những người khác lại cho rằng đây là một loài chưa từng được phát hiện và chỉ mới được biết đến cho tới ngày nay. Dù sao đi nữa, thực tế là không phát hiện thấy bất kỳ con tàu ngoài hành tinh nào trên quỹ đạo. Sự xuất hiện từ hư không của sinh vật này có vẻ như cũng không phải nhờ vào phương tiện công nghệ.\n\nVị khách bối rối (và bản thân nó cũng đầy hoang mang) hiện đang bị giam giữ tại một cơ sở nghiên cứu."
 first_contact.3000.desc.gestalt:0 "Một con quái vật lớn bằng tòa nhà, mọc đầy xúc tu bỗng nhiên xuất hiện tại §Y[This.Owner.Capital.GetName]§!, khiến thủ đô mất đi trật tự. Sinh vật này dường như cũng bối rối y như chúng ta trước sự xuất hiện đột ngột của chính mình, nó đã bị chúng ta bắt giữ và giam cầm mà không hề có bất cứ sự kháng cự nào.\n\nChúng ta nghi ngờ rằng sinh vật này có thể đến từ ngoài không gian, nhưng không thể loại trừ khả năng đây là một giống loài chưa biết vốn có mặt trên hành tinh của chúng ta. Dù sao đi nữa, thực tế là không phát hiện thấy bất kỳ con tàu ngoài hành tinh nào trên quỹ đạo. Sinh vật mang mật danh §HVị Khách§! này xuất hiện từ hư không, có vẻ như cũng không phải nhờ vào phương tiện công nghệ.\n\nVị khách bối rối (và bản thân nó cũng đầy hoang mang) hiện đang bị giam giữ tại một cơ sở nghiên cứu."
 first_contact.3000.a.friendly:0 "Chúng ta phải giao tiếp với sinh vật này!"
 first_contact.3000.a.unfriendly:0 "Thẩm vấn kẻ xâm nhập."
 first_contact.3000.b.execution:0 "Thanh trừng thứ xâm nhập vào thủ đô của chúng ta!"
 first_contact.3000.b.sacrifice:0 "Hiến tế."
 first_contact.3000.c.hive:0 "Đồ ăn từ trên trời rơi xuống!"
 first_contact.3000.d.assimilator:0 "Người nhà. Người nhà."
 first_contact.3000.d.assimilator.tooltip:0 "§Y$NAME_Guest$§! đã gia nhập với chúng ta như một nhà Lãnh đạo."
 start_jaunting_traveler_communications_study:0 "[This.Owner.GetEnvoyPlural] của chúng ta sẽ cố gắng giao tiếp với sinh vật này."

 ##First Contact Stage Summaries
 fcsum_jaunting_traveler_summary:0 "Một sinh vật khổng lồ không rõ nguồn gốc đã bất ngờ xuất hiện tại thủ đô của chúng ta. Hiện tại nó đang bị giam giữ tại một cơ sở nghiên cứu của chúng ta."
 NAME_Guest:0 "Mẹ của Vạn Móng vuốt"

 # First contact - random negative events
 fircon.1220.name:0 "Ngộ độc Thực phẩm"
 fircon.1220.desc:0 "Chúng ta đã không thành công trong việc cung cấp dinh dưỡng thích hợp cho vị khách bí ẩn này: sinh vật này nhanh chóng đổ bệnh, nó từ chối ăn uống và cũng từ chối mọi phản ứng.\n\nTrước khi chúng ta có thể tìm hiểu sâu hơn về cơ chế trao đổi chất của nó, các hành động liên lạc sẽ tạm thời bị đình chỉ."
 fircon.1221.name:0 "Sự cố Ngoại giao"
 fircon.1221.desc:0 "Sinh vật này đã phản ứng dữ dội với những nỗ lực liên lạc thăm dò của chúng ta, nó đã tấn công dữ dội một nhà khoa học của chúng ta và từ chối hợp tác thêm. Có lẽ chúng ta đã vô tình mạo phạm nó.\n\nMặc dù không có ai bị thương nghiêm trọng, nhưng sự cố này vẫn gây tổn hại đến lòng tin mỏng manh mà chúng ta đã thiết lập được với sinh vật này cho đến nay."

 ## First contact - progress
 fircon.1210.name:0 "Thiết lập Liên lạc"
 fircon.1210.desc:0 "Các [owner.GetScientistPlural] của chúng ta đã nghiên cứu và phát hiện ra rằng, các cử động vặn vẹo xúc tu của vị khách này thực chất là một hình thức ngôn ngữ phức tạp.\n\nKết quả là chúng ta đã nhận ra một cách đầy thất vọng rằng sinh vật này đang cảm thấy xấu hổ vì không có mảnh vải che thân, và nó đang liên tục yêu cầu trang phục phù hợp để che đậy cơ thể trần truồng của mình.\n\nSau khi đã che đậy cơ thể một cách thích đáng, các nhà nghiên cứu của chúng ta đã chế tạo một cỗ máy đa chi để giao tiếp với sinh vật này."
 fircon.1211.name:0 "Mẹ của Vạn Móng vuốt"
 fircon.1211.desc:0 "Vị khách của chúng ta rất hoạt ngôn, nhưng sự khác biệt về văn hóa khiến chúng ta khó lòng hiểu nhau. Bây giờ chúng ta đã biết sinh vật này là giống cái, cô tự xưng là §H\"Mẹ của Vạn Móng vuốt\"§!, và dường như thuộc về một giáo phái duy tâm nào đó mà cô gọi là §YNgười Đi trong Màn sương§!. Nhưng chúng ta vẫn không hiểu cái §Y\"Lóe sáng\"§! mà cô luôn thao thao bất tuyệt là gì, hoặc nó có mối quan hệ nhân quả nào với sự xuất hiện đột ngột của cô hay không.\n\nChúng ta vẫn đang tiếp tục cố gắng giao tiếp với cô ấy."
 fircon.1212.name:0 "Khách Lữ hành Lạc lối"
 fircon.1212.desc:0 "Các nhà nghiên cứu của chúng ta cuối cùng cũng đã xâu chuỗi được câu chuyện của \"Mẹ của Vạn Móng vuốt\": vị khách của chúng ta là người lãnh đạo của một giáo phái duy tâm chuyên nghiên cứu về §YLóe sáng§!: đây là một công nghệ tâm linh cho phép dịch chuyển tức thời đến bất cứ đâu trong vũ trụ. Xuyên suốt lịch sử giống loài của cô ấy, chưa từng có ai thực hiện Lóe sáng thành công... cho đến hiện tại.\n\nMẹ của Vạn Móng vuốt không chắc cô có khả năng lặp lại kỳ tích này hay không, huống hồ nguồn năng lượng dự trữ của cô hiện đã cạn kiệt, không thể thực hiện thêm bất cứ nỗ lực nào nữa.\n\nHiện tại, cô sẵn sàng tiếp tục nhận sự chăm sóc của chúng ta và sẽ đáp đền sự hiếu khách nhiệt tình của chúng ta bằng cách hỗ trợ các nhà nghiên cứu."
 fircon.1212.a:0 "Chúng ta sẽ chào đón cô ấy một cách bình đẳng."
 fircon.1212.ab:0 "Cô ấy có thể ở lại, nhưng sẽ không được tự do."
 fircon.1212.a.tooltip:0 "§HMẹ của Vạn Móng vuốt§! sẽ gia nhập với chúng ta như một nhà khoa học."
 fircon.1212.b:0 "Cô ấy có thể ở lại, đưa tới phòng thí nghiệm giải phẫu sống."
 fircon.1212.c:0 "Thứ ghê tởm này sao có thể ở lại trên hành tinh của chúng ta!"
 #unlock special project
 fircon.1230.name:0 "Lóe sáng"
 fircon.1230.desc.non_gestalt:0 "Các [owner.GetScientistPlural] của chúng ta đã bày tỏ sự quan tâm đến việc $fircon.1230.desc.outro$"
 fircon.1230.desc.gestalt:0 "Dữ liệu mới cho thấy các [owner.GetScientistPlural] của chúng ta có thể có khả năng $fircon.1230.desc.outro$"
 fircon.1230.desc.outro: "học cách §HLóe sáng§!, công nghệ dịch chuyển tức thời mà §HMẹ của Vạn Móng vuốt§! đã sử dụng để tới được hành tinh mẹ của chúng ta.\n\nSinh mệnh vũ trụ bị bao phủ bởi bức màn bí ẩn này sẵn sàng chia sẻ kiến thức của cô, mặc dù cô cũng không chắc chúng ta có thể tái tạo công nghệ này hay không. Một tòa nhà thích hợp tại thủ đô của chúng ta đã sẵn sàng để được cải tạo thành một ngôi đền phục vụ cho mục đích nghiên cứu."
 fircon.1230.a.organic:0 "Một nỗ lực ngu ngốc."
 fircon.1230.a.machine:0 "Đây chắc chắn là một sự lãng phí tiền bạc."
 fircon.1230.b.organic:0 "Đáng để thử."
 fircon.1230.b.machine:0 "Một thí nghiệm đáng làm."
 #homesick creature
 fircon.1231.name:0 "Nỗi Nhớ nhà"
 fircon.1231.desc:0 "Gần đây, Mẹ của Vạn Móng vuốt của chúng ta đã bày tỏ niềm khát khao được trở về quê hương, nhưng chúng ta rất khó để định vị hệ sao mẹ của cô: những đặc điểm thiên thể mà cô mô tả không trùng khớp với bất kỳ khu vực nào trong các hệ sao mà chúng ta đã biết.\n\nVị khách của chúng ta đăm đăm nhìn lên bầu trời đêm, ánh mắt hồi lâu không chịu rời đi."
 fircon.1231.a:0 "Hãy cố gắng thêm chút nữa. Chúng ta sẽ tìm thấy quê hương của cô ấy!"
 fircon.1231.b:0 "Nơi này của chúng ta chẳng phải là nhà cô ấy sao."
 #creature goes home
 fircon.1232.name:0 "Tái ngộ"
 fircon.1232.desc:0 "Không thấy Mẹ của Vạn Móng vuốt đâu cả. Sinh vật này đột nhiên xuất hiện, và giờ lại biến mất một cách đột ngột, chỉ để lại một thông điệp chia tay được khắc vội vàng trên sàn cơ sở nghiên cứu.\n\n\"§HTôi rất sợ, nhưng tôi phải Lóe sáng để rời đi thôi. Nỗi nhớ nhà trong trái tim tôi không có nơi nào để giải tỏa, nỗi đau khổ này thật khó chịu đựng. Cảm ơn các vị vì tất cả những gì các vị đã làm. Tôi cầu nguyện Màn sương sẽ đối xử tử tế với tôi.§!\""
 first_contact.1232.tooltip:0 "§Y$NAME_Guest$§! đã rời đi."
 #thank you gift
 fircon.1233.name:0 "Lời Cảm ơn Muộn màng"
 fircon.1233.desc:0 "Một con tàu của chúng ta đã chặn được một chiếc hộp đựng đồ đột nhiên xuất hiện từ hư không trong hệ sao mẹ của chúng ta. Ngay khoảnh khắc giống loài của chúng ta chạm vào nó, những ổ khóa phức tạp trên đó đã tự động mở ra, hé lộ một lượng lớn những món đồ thủ công tinh xảo đáng kinh ngạc... cùng một tờ giấy cảm ơn từ người lữ hành đa chi, trong đó tuyên bố rằng cô ấy đã từng đến thăm hành tinh mẹ của chúng ta vào vài thập kỷ trước."

 ## Special project - learning to Jaunt
 THE_JAUNT_PROJECT:0 "Học cách Lóe sáng"
 THE_JAUNT_PROJECT_DESC:0 "Sự xuất hiện từ hư không của §HMẹ của Vạn Móng vuốt§! tại thủ đô của chúng ta đã chứng minh rằng khái niệm \"Dịch chuyển Tâm linh\", từng chỉ tồn tại trên lý thuyết, là hoàn toàn có thể thực hiện được trong thực tế. Bằng cách để cho những [owner.GetScientistPlural] tài ba nhất của chúng ta dốc sức vào công việc nghiên cứu, có lẽ chúng ta sẽ nắm được bí mật của phương thức di chuyển tức thời này."
 #special project events
 fircon.1240.name:0 "Học cách Lóe sáng"
 fircon.1240.desc.intro: "Các [owner.GetScientistPlural] của chúng ta đã dành vô số thời gian để cố gắng nắm vững bí mật của Dịch chuyển Tâm linh, và cuối cùng, một người trong số họ đã thực hiện thành công việc §HLóe sáng§!!\n\nNhà nghiên cứu này đã dịch chuyển được một mét, nhưng vì dịch chuyển vào bên trong sàn nhà nên đã mất đi"
 fircon.1240.desc.organic:0 "$fircon.1240.desc.intro$ phần chi dưới. Kéo theo đó là rất nhiều tiếng vỗ tay và một vài tiếng la hét."
 fircon.1240.desc.machine:0 "$fircon.1240.desc.intro$ một số bộ phận then chốt."
 fircon.1240.a:0 "Rất có triển vọng, hãy tiếp tục thử nghiệm."
 fircon.1241.name:0 "Học cách Lóe sáng"
 fircon.1241.desc.intro: "Lại một lần §HLóe sáng§! thành công nữa! Theo dữ liệu cảm biến của chúng ta, một [owner.GetScientistPlural] của chúng ta đã dịch chuyển thành công đến hệ sao gần nhất, vượt qua một khoảng cách không thể đo lường chỉ trong một phần nhỏ của giây. Chỉ có điều kẻ xui xẻo này đã vật chất hóa bên trong một ngôi sao, và ngay lập tức biến thành tro bụi."
 fircon.1241.desc.outro: "Mặc dù khả năng chế tạo động cơ đẩy tâm linh là có thể, nhưng việc ứng dụng công nghệ này có thể sẽ vô cùng nguy hiểm, thậm chí sẽ mang lại sự hỗn loạn cho vũ trụ."
 fircon.1241.desc.non_gestalt: "$fircon.1241.desc.intro$\n\nViệc sử dụng công nghệ này để đẩy tàu vũ trụ đang vấp phải sự hoài nghi sâu sắc. $fircon.1241.desc.outro$"
 fircon.1241.desc.gestalt: "$fircon.1241.desc.intro$\n\nHiện tại, triển vọng sử dụng công nghệ này để đẩy tàu vũ trụ vẫn đang dừng lại ở mức độ lý thuyết. $fircon.1241.desc.outro$"
 fircon.1242.name:0 "$fircon.1241.name$"
 fircon.1242.desc.base.outro: "Nó thực sự quá thiếu chính xác, hoàn toàn không mang lại bất kỳ lợi ích khả thi nào. Càng cố gắng, chúng ta càng nhận thức rõ ràng rằng sự xuất hiện của §HMẹ của Vạn Móng vuốt§! hoàn toàn là do may rủi."
 fircon.1242.desc.base.intro.gestalt: "Sau khi nghiên cứu sâu sắc về §HLóe sáng§!, chúng ta đã đi đến kết luận rằng nó không có giá trị thực tiễn nào. Các [GetResearchers] của chúng ta có thể phải mất hàng thập kỷ để học được công nghệ này, kết quả cũng sẽ chỉ là lần lóe sáng đầu tiên dịch chuyển vào đá, ngôi sao hay thậm chí là lỗ đen"
 fircon.1242.desc.base.intro.non_gestalt: "Kết luận chúng ta rút ra được sau khi hoàn thiện §HLóe sáng§! là: vô giá trị. Các [GetResearchers] của chúng ta có thể phải mất hàng thập kỷ để nắm vững công nghệ này, kết quả cũng sẽ chỉ là lần lóe sáng đầu tiên dịch chuyển vào đá, ngôi sao hay thậm chí là lỗ đen"
 fircon.1242.desc.base.organic_non_gestalt: "$fircon.1242.desc.base.intro.non_gestalt$ và tử vong. $fircon.1242.desc.base.outro$"
 fircon.1242.desc.base.machine_non_gestalt: "$fircon.1242.desc.base.intro.non_gestalt$ và bị phá hủy. $fircon.1242.desc.base.outro$"
 fircon.1242.desc.base.organic_gestalt: "$fircon.1242.desc.base.intro.gestalt$ và tử vong. $fircon.1242.desc.base.outro$"
 fircon.1242.desc.base.machine_gestalt: "$fircon.1242.desc.base.intro.gestalt$ và bị phá hủy. $fircon.1242.desc.base.outro$"
 fircon.1242.desc.outro.non_gestalt:0 "Có lẽ một ngày nào đó, động cơ đẩy tâm linh hằng mong ước của chúng ta sẽ trở thành hiện thực. Nhưng chí ít thì không phải là hôm nay."
 fircon.1242.desc.outro.gestalt:0 "Trong giai đoạn hiện tại, động cơ đẩy tâm linh vẫn chỉ đơn thuần là lý thuyết."
 fircon.1242.desc.organic_non_gestalt: "$fircon.1242.desc.base.organic_non_gestalt$\n\n$fircon.1242.desc.outro.non_gestalt$"
 fircon.1242.desc.machine_non_gestalt: "$fircon.1242.desc.base.machine_non_gestalt$\n\n$fircon.1242.desc.outro.non_gestalt$"
 fircon.1242.desc.organic_gestalt: "$fircon.1242.desc.base.organic_gestalt$\n\n$fircon.1242.desc.outro.gestalt$"
 fircon.1242.desc.machine_gestalt: "$fircon.1242.desc.base.machine_gestalt$\n\n$fircon.1242.desc.outro.gestalt$"
 fircon.1243.name:0 "$fircon.1241.name$"
 fircon.1243.nodrive.desc:0 "Tuy nhiên, bằng cách áp dụng các nguyên lý của Lóe sáng vào chế tạo tàu vũ trụ thay vì một cơ thể đơn lẻ, các [GetResearchers] của chúng ta chỉ còn cách việc chế tạo §H$tech_psi_jump_drives$§! một bước chân, biến dịch chuyển tâm linh trở thành một phương tiện an toàn và đáng tin cậy hơn."
 fircon.1243.drive.desc:0 "Mặc dù vậy, những kiến thức chúng ta thu được cũng sẽ có một số ứng dụng kỹ thuật."

## Pre-FTL Spaceships
 pre_ftl_chemical_ship:0 "Tàu Năng lượng Hóa học Đời đầu"
