 MESSAGE_SLOWED_LAST_GIFT_TITLE:0 "Trả lại Quà"
 MESSAGE_REVERSED_THRUSTERS:0 "Thông qua việc điều khiển chuẩn xác các quả ngư lôi, chúng ta đã thành công làm chậm lại viên đạn pháo Fevorian đó."
 MESSAGE_COUNTER_SHOT:0 "Tiểu hành tinh vonfram đó đã bị ảnh hưởng bởi tiểu hành tinh của chúng ta, quỹ đạo đã chệch đi đáng kể."
 MESSAGE_CONTROLLED_SHATTERING:0 "Thông qua một vụ nổ có kiểm soát, chúng ta đã giảm bớt khoảng 34% khối lượng của viên đạn pháo này."
 MESSAGE_DEFLECTING_FIELDS:0 "Sử dụng công nghệ điều khiển trường và công nghệ lá chắn tiên tiến, chúng ta đã thành công làm giảm tốc độ của món quà chia tay này."

