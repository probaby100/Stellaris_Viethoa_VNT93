 ### I'm a (non) believer

 ## Modifiers and such

 NAME_subterranean_task_force:0 "Lực lượng Phòng vệ Chống Xâm lược Dưới lòng đất"
 NON_BELIEVERS_PROJECT:0 "Lực lượng Phòng vệ Chống Xâm lược Dưới lòng đất"
 NON_BELIEVERS_PROJECT_DESC:0 "[non_believers_country.GetSpeciesName] lo ngại rằng những người hang động có thể phát động một cuộc xâm lược. Mặc dù nỗi lo lắng này không có cơ sở, nhưng việc cung cấp thêm lực lượng quân đội có thể giúp chúng ta giành được sự tin tưởng từ họ."
 subterranean_defense_army:0 "Lực lượng Phòng vệ Chống Xâm lược Dưới lòng đất"
 subterranean_defense_army_desc: "Mặc dù vũ khí thô sơ, nhưng họ thông thạo các trận chiến dưới lòng đất, và bảo vệ quê hương mình bằng ý chí bất khuất, nhờ đó trở thành những người phòng vệ vô cùng mạnh mẽ."

 pre_ftl_distrustful:0 "Không tin tưởng"
 pre_ftl_distrustful_desc:0 "Cư dân trên hành tinh này không tin tưởng chúng ta."
 pre_ftl_distrustful_tooltip:0 "Nền văn minh này sẽ không tham gia vào các hoạt động ngoại giao."

 ## Events
 fircon.6000.name:0 "Liệu có sinh mệnh tồn tại ở đó không?"
 fircon.6000.desc:0 "Dù đã có cuộc gặp gỡ, [non_believers_country.GetSpeciesNamePlural] vẫn không chịu tin rằng người ngoài hành tinh có thật. Họ khẳng định chúng ta không phải những vị khách đến từ các vì sao, mà là lũ người hang động từ dưới lòng đất chui lên nhằm thôn tính bề mặt hành tinh. Hành tinh của họ, [non_believers_planet.GetName], vốn được cho là một khối rỗng, và họ đinh ninh rằng chúng ta đang cưỡi trên những con tàu không gian bay lượn trong khoang rỗng khổng lồ ở trung tâm.\n\nNhững tín ngưỡng khó hiểu này đang cản trở mọi nỗ lực ngoại giao của chúng ta. Bất cứ điều gì chúng ta nói hay làm đều bị soi xét bằng con mắt ngờ vực sâu sắc."
 fircon.6000.desc.subterranean:0 "$fircon.6000.desc$.\n\nMặc dù thực tế là họ đã sai, nhưng việc giải thích chỉ khiến tình hình trở nên phức tạp hơn."
 fircon.6000.a:0 "Hãy đưa những kẻ hoài nghi cực đoan nhất của họ ra ngoài không gian."
 fircon.6000.b:0 "[non_believers_planet.GetName] hoàn toàn không rỗng! Cho họ xem kết quả tính toán đi!"
 fircon.6000.c:0 "Thừa nhận rằng chúng ta chính là những kẻ xâm lược từ dưới lòng đất."

 fircon.6005.name:0 "Những kẻ Hoài nghi đã Sai"
 fircon.6005.desc:0 "Rốt cuộc thì [non_believers_country.GetSpeciesNamePlural] không tin vào sự tồn tại của vũ trụ, hay nói cách khác: họ cho rằng bầu trời là một mái vòm khảm đầy gương, và các vì sao chính là hình ảnh phản chiếu của những tia nắng mặt trời trên những tấm gương đó, và các thiên thể khác cũng tương tự.\n\nThậm chí ngay cả khi chúng ta đưa họ đến thủ đô của chúng ta, họ vẫn có thể khẳng định rằng mình chưa bao giờ rời khỏi hành tinh mẹ, hoặc đưa ra những tuyên bố vô lý khác tương tự."
 fircon.6005.a:0 "Chắc chắn phải có cách nào đó để thuyết phục họ..."

 fircon.6015.name:0 "Những kẻ Hoài nghi đã Sai"
 fircon.6015.desc:0 "Những tin tức hỗn loạn truyền đến từ [non_believers_planet.GetName]: Dù [non_believers_country.GetSpeciesNamePlural] không còn cho rằng chúng ta là những vị khách đến từ phần trung tâm rỗng của [non_believers_planet.GetPlanetMoon] của họ, nhưng giờ đây họ lại đinh ninh rằng hành tinh của họ bằng phẳng, và những người giống như chúng ta thì đang sống trong các thành phố có hình dạng như những chiếc giỏ treo, nằm dưới lớp vỏ của [non_believers_planet.GetName]."

 fircon.6020.name:0 "Những kẻ Hoài nghi đã Đúng"
 fircon.6020.desc:0 "[non_believers_country.GetSpeciesNamePlural] bày tỏ lòng biết ơn về sự thành thật của chúng ta. Dĩ nhiên là họ vẫn chưa hoàn toàn tin tưởng chúng ta, vì họ cho rằng chúng ta là những kẻ xâm lăng đến từ thế giới rỗng [non_believers_planet.GetName], nhưng chí ít họ cũng hiểu được rằng chúng ta không mang dã tâm thù địch, và mong muốn họ có thể cùng chúng ta hợp tác."

 fircon.6025.name:0 "Lực lượng Phòng vệ Chống Xâm lược Dưới lòng đất"
 fircon.6025.desc:0 "Sau khi kiên định với niềm tin rằng chúng ta là những cư dân bí mật sống trong lòng [non_believers_planet.GetName] rỗng, [non_believers_country.GetSpeciesNamePlural] bắt đầu lo ngại không biết có thứ gì khác đang ẩn náu bên dưới bề mặt của [non_believers_planet.GetPlanetMoon]. Quân đội được triển khai đóng quân gần các hang động, mạch nước ngầm và miệng núi lửa, luôn trong tư thế sẵn sàng chiến đấu chống lại bất kỳ kẻ xâm lược nào từ dưới lòng đất trồi lên."
 fircon.6025.a:0 "Cùng chơi với họ đi. Hãy cung cấp hỗ trợ quân sự cho họ."
 fircon.6025.b:0 "Cái này thì đúng là nực cười."

 fircon.6030.name:0 "Cuộc Tấn công Bất ngờ!"
 fircon.6030.desc:0 "Những tin tức chấn động được báo về từ [non_believers_planet.GetName]: Dưới mặt đất thực sự có người ẩn náu. Một đội quân dưới lòng đất thuộc về một giống loài chưa từng được biết đến đã chui lên từ các hang động, và họ đang tấn công [non_believers_country.GetSpeciesNamePlural]. Đây là một cuộc xâm lược quy mô toàn diện!"
 fircon.6030.a:0 "Cảm giác này sao quen quen..."

 fircon.6031.name:0 "Xưa Kia Là Thần Tiên, Nay Trở Thành Cát Bụi"
 fircon.6031.desc:1 "Sau khi trải qua một cuộc chiến tranh thế giới khốc liệt, [non_believers_country.GetName] đã bị giống loài hang động sống bên dưới mặt đất của [non_believers_planet.GetName] quét sạch hoàn toàn. Giống loài mới nổi lên này đã chú ý đến sự tồn tại của chúng ta, nhưng nhờ một may mắn kỳ lạ nào đó, dường như họ không coi chúng ta là những kẻ đến từ trung tâm hành tinh của họ."
 fircon.6031.a:0 "Cuối cùng thì những người hàng xóm mới cũng đã chịu lắng nghe lẽ phải."

 fircon.6032.name:0 "Sự Bùng nổ Bất ngờ!"
 fircon.6032.desc.base:0 "[non_believers_country.GetSpeciesNamePlural] có lý do để khiếp sợ: Mặc dù phần lõi của hành tinh này không phải là nơi sinh sống của bất kỳ giống loài sống dưới lòng đất nào, nhưng phần lõi nóng chảy đó hóa ra lại vô cùng nguy hiểm."
 fircon.6032.desc.troops:0 "Một ngọn núi lửa tưởng chừng như đã ngủ yên bất ngờ phun trào, phá hủy mọi cơ sở hạ tầng trong khu vực. Tuy nhiên, may mắn thay quân đội của chúng ta đã có mặt gần hiện trường và phần lớn người dân gặp nạn đều đã được sơ tán an toàn."
 fircon.6032.desc.notroops:0 "Một ngọn núi lửa tưởng chừng như đã ngủ yên bất ngờ phun trào và đang tàn phá mọi thứ, [non_believers_country.GetSpeciesNamePlural] tuyệt vọng tìm kiếm sự trợ giúp."
 fircon.6032.a:0 "Ít nhất thì bây giờ họ cũng đã tin tưởng chúng ta."

 fircon.6033.name:1 "Khí hậu Bất thường"
 fircon.6033.desc:0 "Những binh lính của Lực lượng Phòng vệ Chống Xâm lược Dưới lòng đất đóng quân quanh các hang động và miệng núi lửa lớn nhất báo cáo rằng hoàn toàn không có thứ gì nhô lên từ dưới mặt đất. Có lẽ đây là tình huống tốt nhất, nhưng một số binh sĩ trong số họ rõ ràng tỏ ra vô cùng thất vọng."

 fircon.6035.name:0 "Sự Thay đổi trong Quan điểm"
 fircon.6035.desc.start:0 "[non_believers_country.GetSpeciesNamePlural] muốn gửi lời cảm ơn cùng một lời xin lỗi chính thức đến chúng ta. Giờ đây họ đã hiểu rằng chúng ta thực tế không phải là những kẻ sống trong hang động dưới lòng đất, mà là đến từ một nơi khác, đó là:"
 fircon.6035.desc.water:0 "Đại dương."
 fircon.6035.desc.sun:0 "Ngay tại tâm điểm của những vì sao của họ."
 fircon.6035.desc.end:0 "Sự hiểu biết của họ về những bí ẩn của vũ trụ vẫn chưa đủ hoàn hảo, nhưng ít nhất họ đã sẵn sàng để tin tưởng chúng ta."
 fircon.6035.a:0 "Về mặt xã hội học thì rất thú vị; còn về mặt tinh thần, thì thực sự là một trải nghiệm vắt kiệt sức lực."

 fircon.6038.name:0 "Cút về dưới lòng đất đi!"
 fircon.6038.desc.troops:0 "Sau một trận chiến dài dằng dặc, bất phân thắng bại, lực lượng liên minh của chúng ta đã đánh bại những kẻ xâm lược từ dưới lòng đất và đuổi chúng trở lại dưới bề mặt của [non_believers_planet.GetName]!"
 fircon.6038.desc.notroops:0 "Sau một trận chiến dài dằng dặc, bất phân thắng bại, [non_believers_country.GetName] đã buộc những kẻ xâm lược từ dưới lòng đất phải rút lui về dưới bề mặt của [non_believers_planet.GetName]!"

 fircon.7500.name:0 "Thú nhồi bông [Root.GetSpeciesNamePlural]"
 fircon.7500.desc:0 "Hôm nay, một tin tức vô cùng bất ngờ đã đến từ §Y[pre_ftl_planet.GetName]§!, một khuôn mặt quen thuộc đang chào đón chúng ta: Đó chính là khuôn mặt của chúng ta.\n\nGần đây, [pre_ftl_country.GetSpeciesAdj] có vẻ như đang bị ám ảnh bởi vẻ ngoài của chúng ta. [Species.GetEarNamePlural] của chúng ta có vẻ đã gợi cho họ liên tưởng đến những đứa trẻ của họ. Quả thực, họ mô tả chúng ta vô cùng \"dễ thương\". Một loại thú nhồi bông với [Species.GetEarNamePlural] được làm lố lên đã trở thành mặt hàng cực kỳ đắt khách ở các thành phố của họ."
 fircon.7500.a:0 "Đương nhiên chúng ta là thế rồi!"
 fircon.7500.b:0 "Chúng ta không §Rdễ thương§!."
 fircon.7500.c:0 "Nhưng... ừm... chúng ta không... chưa ai từng..." # Kyaaa!
 fircon.7500.d:0 "Đúng là lãng phí thời gian."
 fircon.7500.e:0 "Chúng ta... liệu chúng ta có thể có một con không?"
 fircon.7500.f:0 "Bất kỳ thứ gì sử dụng hình ảnh của chúng ta đều phải bị tính phí bản quyền."

 fircon.7505.name:0 "Vạn Tượng Quy Nhất"
 fircon.7505.desc:0 "Trên §Y[pre_ftl_planet.GetName]§! đang diễn ra những biến đổi xã hội vô cùng thú vị.\n\nVì họ chỉ có chúng ta làm hệ quy chiếu, người dân ở đó bắt đầu tin rằng mọi dạng sống trong vũ trụ đều giống như chúng ta: Gắn kết với nhau và hòa làm một. Trong tình thế không có điểm tựa nào khác, [pre_ftl_country.GetSpeciesNamePlural] tha thiết hy vọng [root.GetIndividualNamePlural] của chúng ta có thể tham gia vào các cơ quan của họ. Sự hiểu lầm này đã mở ra cho chúng ta một cơ hội tuyệt vời để nâng tầm nền văn minh của họ. Thế nhưng, nếu như họ khám phá ra sự thật về thế giới bên ngoài (bao gồm cả sự tồn tại của các loài phi Gestalt), lòng tin của họ đối với chúng ta chắc chắn sẽ sứt mẻ."
 fircon.7505.a.hive:0 "Đúng vậy, chúng ta là một thể thống nhất."
 fircon.7505.a.machine:0 "Xác nhận. Các vị là những cá thể độc lập."
 fircon.advance_tech:0 "[pre_ftl_country.GetName] sẽ tiến lên mức công nghệ tiếp theo."
 fircon.b.tt:0 "Tốc độ mà [pre_ftl_country.GetName] vươn tới trình độ công nghệ mới sẽ nhanh hơn §G25%§!."
 fircon.7505.b:0 "Nói với họ rằng bản thân chúng ta cũng không chắc chắn."
 fircon.7505.c:0 "Sửa chữa sự hiểu lầm của họ."

 MESSAGE_PRE_FTL_DISTRUSTFUL_TITLE:0 "Ngoại giao mất lòng tin"
 MESSAGE_PRE_FTL_DISTRUSTFUL:1 "Do những hành động gần đây của chúng ta, $COUNTRY|Y$ đã tỏ thái độ bất tín nhiệm đối với chúng ta, và do đó đã phong tỏa các kênh liên lạc ngoại giao trong một thời gian."

 fircon.7510.name:0 "Dạy tổ ong cách chế tạo"
 fircon.7510.desc.base:0 "Chúng ta hy vọng có thể thúc đẩy kế hoạch giáo dục cho tổ ong, và sáng kiến này đã thành công, nên chúng ta dự định tiếp tục dạy cho chúng một số kiến thức hóa học cơ bản. Gần như ngay lập tức, chúng đã suy diễn ra được những ứng dụng mang tính hủy diệt khủng khiếp nhất dựa trên các nguyên lý này. Chân trước của chúng ta vừa mới rời khỏi bầu khí quyển của chúng, thì chân sau chúng đã bắt đầu phát động chiến tranh với những tổ ong lân cận. Hiện tại, hàng triệu cá thể phụ đang phải bỏ mạng."
 fircon.7510.desc.gestalt:0 "Các [Root.GetScientistPlural] của chúng ta đã thực hiện thành công nhiệm vụ tại §Y[pre_ftl_planet.GetName]§!. $fircon.7510.desc.base$"
 fircon.7510.desc.regular:0 "Các nhà khoa học của chúng ta đã vô cùng bàng hoàng khi rời khỏi §Y[pre_ftl_planet.GetName]§!. $fircon.7510.desc.base$"
 fircon.7510.a:0 "Ngăn chặn chuyện này lại!"
 fircon.7510.a.tt:1 "§R200§! £pop£§Hdân số§! trên [pre_ftl_planet.GetName] đã thiệt mạng."
 fircon.7510.b.regular:0 "Đây chính là bản chất của sự tiến hóa."
 fircon.7510.b.gestalt:0 "Đúng như dự đoán."
 fircon.7510.b.tt:1 "§R500§! £pop£§Hdân số§! trên [pre_ftl_planet.GetName] đã thiệt mạng."
 #Modifiers
 stuffed_toy:0 "Thú Nhồi bông"
 stuffed_toy_desc:0 "Một con thú nhồi bông mô phỏng hình dáng của chúng ta, khiến chúng ta ngập tràn lòng quyết tâm."

 plushie_tariff:0 "Thuế quan Hợp thời trang"

