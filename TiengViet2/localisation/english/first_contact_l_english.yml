##################################################
 NAME_The_Chosen:0 "Kẻ Được Chọn"
 NAME_ADJ_Chosen:0 "Kẻ Được Chọn"
 NAME_Aspharelle:0 "Aspharelle"
 NAME_Taremes:0 "Taremes"
 NAME_Ereba:0 "Ereba"
 NAME_Ithomes_Gate:0 "Cổng Ithome"
 NAME_Ophala:0 "Ophala"
 NAME_Charynoi:0 "Charynoi"

 site_the_chosen_backstory:0 "Trạm Quan sát Bị bỏ hoang"
 site_the_chosen_backstory_desc:0 "Một trạm quan sát bị bỏ hoang quay quanh quỹ đạo §Y[From.Planet.MoonOf.GetName]§!. Nơi đây có thể hé lộ đôi điều về nguồn gốc của nền văn minh Tiền FTL §Y$NAME_Charynoi$§! trên hành tinh này."

 arcsite.3000.name:0 "Bảo tàng $NAME_Charynoi$"
 arcsite.3000.desc:0 "Có vẻ như trạm quan sát bị bỏ hoang trên [From.Planet.MoonOf.GetName] đã được chuyển đổi mục đích sử dụng ngay trước khi bị loại biên. Dù vẫn còn vết tích của các thiết bị dùng để giám sát cư dân trên hành tinh, nhưng phần lớn không gian đã được cải tạo thành một bảo tàng lịch sử của người $NAME_Charynoi$. Thật kỳ lạ là, mặc dù đây là một giống loài hiếu chiến, các chủ đề liên quan đến bạo lực lại bị cố tình né tránh, thay vào đó các hiện vật chủ yếu tập trung vào các nghi lễ xoay quanh hòa bình và sinh sản.\n\nMột loạt các tinh thể dữ liệu đã được tìm thấy trong phòng điều khiển trung tâm. Đây rõ ràng là những gì chúng ta đang tìm kiếm."
 arcsite.3000.A:0 "Đào sâu vào những bí mật."

 arcsite.3005.name:0 "Bản ghi chép Dân tộc học"
 arcsite.3005.desc:0 "Tinh thể dữ liệu đầu tiên đã được dịch xong. Trang bìa của nó có dòng chữ: \"Đây là bản ghi chép về dân tộc $NAME_Charynoi$, được lưu lại bởi nữ tiên tri Iticarios, để những ai tìm thấy nó có thể tha thứ cho những tội lỗi của chúng tôi.\"\n\nTiếp sau đó là một bộ sưu tập về các tác phẩm lịch sử, triết học và nghệ thuật, có lẽ được tạo ra bởi một xã hội đang ở cuối thời kỳ Cách mạng Công nghiệp với tư tưởng khá khuôn mẫu nhưng hơi hung hăng. Các [Owner.GetLinguists] của chúng ta đã gửi nó về [Owner.Capital.GetName] để tiến hành nghiên cứu sâu hơn."
 arcsite.3005.B:0 "Chẳng có gì thú vị cả."

 arcsite.3010.name:0 "Bước ngoặt"
 arcsite.3010.desc:0 "\"Giờ đây tôi sẽ kể lại mọi thứ đã đi sai hướng như thế nào - nơi khởi nguồn cho tội lỗi kiêu ngạo của chúng tôi,\" Iticarios tuyên bố.\n\nTinh thể thứ hai ghi lại quá trình người $NAME_Charynoi$ dần khám phá ra những bí ẩn của việc du hành không gian, dường như sớm hơn [Root.Owner.GetName] khoảng một trăm năm. Họ đã tìm thấy hai hành tinh tuyệt đẹp trong hệ sao của mình và kết luận rằng những hành tinh này là cơ ngơi mà thần linh ban tặng, là đặc quyền bẩm sinh của họ, và giờ đây họ đang đi đòi lại đặc quyền đó.\n\nBằng một giọng điệu đầy kinh hoàng, Iticarios kể về góc tối của những cuộc thám hiểm sơ khai này: trong các thuộc địa mới của họ, những nền văn minh non trẻ không hề muốn nhượng lại quê hương của mình. Họ đã bị đánh bại và bị bắt làm nô lệ, để rồi dần lụi tàn và chết mòn bởi những căn bệnh mà người $NAME_Charynoi$ chẳng thèm bận tâm chữa trị.\n\nCác [Owner.GetLinguists] của chúng ta đang nỗ lực dịch tinh thể dữ liệu thứ ba và cũng là tinh thể cuối cùng."

 arcsite.3015.name:0 "Mưu kế của Kẻ phản bội"
 arcsite.3015.desc:0 "Cuối cùng, không gian sinh tồn của chúng tôi cũng cạn kiệt. Chúng tôi biết về sự tồn tại của các lỗ sâu, nhưng chúng tôi không có cách nào nghiên cứu chúng. Lãnh thổ của chúng tôi vô cùng trù phú và cảnh quan tuyệt đẹp, khiến chúng tôi dễ dàng ảo tưởng rằng mình chính là những kẻ được trời chọn. Lỗ sâu là một bài thử thách, chỉ cần vượt qua nó, chúng tôi có thể gieo rắc nòi giống của mình đi khắp ngân hà, đó là sứ mệnh thiêng liêng của chúng tôi.\n\nTôi từng là một trong những thủ lĩnh cố gắng hoàn thành sứ mệnh đó. Khi niềm cảm hứng chợt lóe lên trong tôi - khoảnh khắc tôi nhận ra mình đã nắm giữ chìa khóa để mở lỗ sâu - tôi đã cầu nguyện suốt nhiều ngày liền trong đền thờ tổ tiên. Cuối cùng tôi cũng nhận được một lời sấm truyền: chúng tôi không xứng đáng. Nếu bước qua lỗ sâu, thứ chờ đợi chúng tôi chỉ là đau khổ. $NAME_Aspharelle$ sẽ bị thanh trừng, như một sự trừng phạt cho những tội lỗi mà chúng tôi đã gây ra. Tôi quyết định phá hủy các nghiên cứu của mình và tìm kiếm một con đường khác.\n\nTìm được người đáng tin cậy quả thực vô cùng khó khăn. Nếu bị phát hiện, chắc chắn chúng tôi thà chết cho nhanh còn hơn. Dù tôi tin tưởng mãnh liệt hơn bao giờ hết rằng chúng tôi đã đúng, nhưng chúng tôi sẽ bị coi là những kẻ phản giáo. Cuối cùng, chúng tôi đã khởi động một kế hoạch đầy táo bạo: Dưới vỏ bọc của một nỗ lực ngu ngốc giả vờ bay vào lỗ sâu một cách mù quáng, chúng tôi đã đóng một con tàu viễn chinh, tiến vào cõi hư vô, nhắm hướng một hành tinh xa xôi. Trải qua bao năm tháng lênh đênh giữa vũ trụ mênh mông, cuối cùng chúng tôi cũng đến được đích. Giờ đây, chúng tôi chỉ mong được để yên để sống một cuộc đời đạo đức và đức hạnh, nhằm chứng minh rằng không phải tất cả người $NAME_Charynoi$ đều xấu xa.\n\nIticarios xin lỗi sâu sắc vì những tổn thương mà đồng loại của bà đã gây ra cho chúng ta. Bà cũng nhắc đến nỗ lực thiết lập một lá chắn bất khả xâm phạm bao quanh [From.Planet.MoonOf.GetName] để ngăn người dân của mình không còn bị cám dỗ bởi việc vươn tới các vì sao. Bà đã thất bại, nhưng các [Owner.GetResearchers] của chúng ta đã tìm ra cách giải quyết vấn đề của bà. Bây giờ, nếu muốn, chúng ta có thể dựng lên lá chắn này ngay lập tức."
 arcsite.3015.A:0 "Chúng ta sẽ làm theo tâm nguyện của họ."
 arcsite.3015.B:1 "Chúng ta có thể tùy ý định đoạt nó."
 arcsite.3015.C:0 "Đủ rồi..."

 SHIELD_PRIMITIVE_PLANET_PROJECT:0 "Dựng Lá chắn"
 SHIELD_PRIMITIVE_PLANET_PROJECT_DESC:0 "Các [Owner.GetResearchers] của chúng ta chắc hẳn sẽ hoàn thành được lá chắn mà Iticarios muốn dùng để bao bọc §Y[This.GetName]§!, chỉ cần chúng ta cung cấp đủ tài nguyên."

 arcsite.3020.name:0 "Charynoi đã bị phong tỏa"
 arcsite.3020.desc:0 "Nhờ vào nỗ lực của các [Owner.GetResearchers], lá chắn mà Iticarios định dùng để bao bọc [FromFrom.GetName] cuối cùng cũng đã hoàn thiện. Những người dân $NAME_Charynoi$ của bà ấy cuối cùng cũng có thể được an nghỉ."
 arcsite.3020.desc.A:0 "Giờ thì mọi người đều có thể thở phào nhẹ nhõm."

 bane_of_the_prophetess:0 "Ác mộng của Nữ tiên tri"
 bane_of_the_prophetess_desc:0 "Do những hành động của chúng ta, những nỗ lực tuyệt vọng của nữ tiên tri Charynoi nhằm tìm kiếm sự cứu rỗi cho dân tộc mình đã bị phá vỡ. Đồng loại của họ sẽ không bao giờ được tha thứ!"
 bane_of_the_prophetess_gestalt:0 "$bane_of_the_prophetess$"
 bane_of_the_prophetess_gestalt_desc:0 "$bane_of_the_prophetess_desc$"
 charynoi_redemption:0 "Sự Cứu rỗi của người Charynoi"
 charynoi_redemption_desc:0 "Lá chắn mà chúng ta giúp Iticarios hoàn thành đã mang lại sự cứu rỗi cho người Charynoi, hay ít nhất là một bộ phận của họ."

 paradisiacal_habitat:0 "Trạm cư trú Tựa Thiên đường"
 paradisiacal_habitat_desc:0 "Mặc dù trạm cư trú này hoàn toàn là công trình nhân tạo, nhưng bầu không khí bên trong lại tỏa ra một phong vị điền viên, đủ sức khơi gợi nỗi nhớ nhà đối với bất kỳ sinh vật có tri giác nào, dẫu cho chúng có khác biệt đến đâu chăng nữa."

 paradisiacal_habitat_science: "Trạm Nghiên cứu Tựa Thiên đường"
 paradisiacal_habitat_science_desc: "$paradisiacal_habitat_desc$"

 paradisiacal_habitat_energy: "Trạm Phát điện Tựa Thiên đường"
 paradisiacal_habitat_energy_desc: "$paradisiacal_habitat_desc$"

 paradisiacal_habitat_mining: "Trạm Khai khoáng Tựa Thiên đường"
 paradisiacal_habitat_mining_desc: "$paradisiacal_habitat_desc$"

 fircon.3510.name:0 "Kẻ Được Chọn"
 fircon.3510.desc:0 "Chúng ta đã bị mắc kẹt trong lỗ sâu này quá lâu rồi. Nhưng khoan đã! Rốt cuộc thì ân sủng của bề trên đã giúp chúng ta phá vỡ những xiềng xích gông cùm. Cuối cùng chúng ta cũng đã vượt qua bài thử thách. Những khu vực khác của ngân hà đang chờ đợi chúng ta tới chinh phục.\n\nĐừng kháng cự. Về lâu dài, như vậy sẽ tốt hơn."
 fircon.3510.A:0 "Chà, thật là ngoài sức tưởng tượng."

 fircon.3515.name:0 "Kẻ Được Chọn"
 fircon.3515.desc:0 "Cái... gì? Các người... đã xuyên qua được lỗ sâu sao? Bằng cách nào? Các nhà khoa học của chúng tôi đã nghiên cứu suốt nhiều năm mà vẫn chưa thành công. Chắc chắn có điều gì đó sai sai ở đây.\n\n...\n...\n...\n\nĐây nhất định là một bài thử thách. Tôi không tin các người! Chúng tôi phải quét sạch lũ các người khỏi ngân hà này!"


