 #Xeno Dinner Party
 fcsum_xeno_dinner_party: "Một đế quốc ngoài hành tinh đã cử một phi thuyền đến biên giới của chúng ta nhằm thiết lập liên lạc ngoại giao."
 opinion_caught_spying: "Trò lừa Đêm tiệc"
 opinion_life_of_the_party: "Ngoại giao Đêm tiệc"
 opinion_double_rejection_party: "Khước từ Đêm tiệc"
 opinion_wet_towel_party: "Kẻ phá đám Đêm tiệc"
 opinion_could_not_eat_the_food_party:0 "Tính toán Sai lầm tại Đêm tiệc"
 first_contact.1120.name: "Thư mời"
 first_contact.1120.desc: "§H[This.ContactCountry.GetName]§! đã đưa một con tàu đến biên giới của chúng ta, liên tục phát đi các tín hiệu lặp lại.\n\nViệc dịch những thông điệp này khá thử thách, nhưng [This.Owner.GetLinguists] của chúng ta tin rằng họ đang mời chúng ta cử một đại diện lên tàu của họ để tham gia một sự kiện giao lưu văn hóa kéo dài nhiều ngày."
 first_contact.1120.desc.nomadic: "§H[This.ContactCountry.GetName]§! đã neo đậu ngay cạnh hạm đội của chúng ta, liên tục phát đi các tín hiệu lặp lại.\n\nViệc dịch những thông điệp này khá thử thách, nhưng [This.Owner.GetLinguists] của chúng ta tin rằng họ đang mời chúng ta cử một đại diện lên tàu của họ để tham gia một sự kiện giao lưu văn hóa kéo dài nhiều ngày."
 first_contact.1120.a.proactive: "Thật là một động thái đầy thuyết phục."
 first_contact.1120.a.cautious: "Được thôi, nhưng nghe rất giống một cái bẫy."
 first_contact.1120.a.tooltip: "Chúng ta sẽ cử phái viên đến tham gia sự kiện."
 first_contact.1120.b: "Tuyệt đối không thể nào."
 first_contact.1120.b.tooltip: "Chúng ta sẽ từ chối lời mời này."
 first_contact.1125.name: "Chuẩn bị trước bữa tiệc"
 first_contact.1125.desc: "[This.Owner.GetEnvoy] [This.Leader.GetName] và [This.Owner.GetLinguists] của chúng ta đã cố gắng đoán ý để chấp nhận lời mời giao lưu văn hóa của người ngoài hành tinh. Phản ứng nồng nhiệt của §H[This.ContactCountry.GetName]§! có vẻ là một tín hiệu tốt. Ngay sau đó, họ gửi đến những chữ tượng hình hiển thị đếm ngược đến buổi tiệc.\n\n[This.Owner.GetEnvoyCap] [This.Leader.GetName] đang tận dụng thời gian còn lại để chuẩn bị và nghiên cứu sâu hơn về các mẫu ngôn ngữ mà chúng ta đã thu thập được."
 first_contact.1125.a: "Đây là một cơ hội học hỏi hiếm có."
 first_contact.1125.a.tooltip: "Chúng ta sẽ chuẩn bị sẵn sàng cho lời mời này."
 first_contact.1125.b: "Đây là cơ hội tuyệt vời để bí mật thu thập thông tin."
 first_contact.1125.b.tooltip: "Chúng ta đồng ý tham gia, nhưng sẽ trang bị công nghệ gián điệp cho phái viên."
 first_contact.1130.name: "Trước lúc tham gia"
 first_contact.1130.desc: "Đồng hồ đếm ngược đến sự kiện giao lưu văn hóa của §H[This.ContactCountry.GetName]§! sắp kết thúc. [This.Owner.GetEnvoyCap] [This.Leader.GetName] sẽ sớm lên tàu con thoi để đến tàu của phái viên ngoài hành tinh. Để thể hiện sự tôn trọng, việc liên lạc với [This.Owner.GetEnvoy] của chúng ta sẽ tạm ngừng trong suốt buổi tiệc."
 first_contact.1130.a: "Chúng ta nên hòa nhập vào văn hóa của họ càng nhiều càng tốt."
 first_contact.1130.a.tooltip: "Phái viên của chúng ta sẽ cố gắng cư xử cho phù hợp với văn hóa của họ."
 first_contact.1130.b: "Chỉ cần thể hiện sự nhiệt tình và chuyên nghiệp là đủ."
 first_contact.1130.b.tooltip: "Phái viên của chúng ta sẽ hành xử với thái độ chuyên nghiệp."
 first_contact.1130.c: "Bắt đầu hành động."
 first_contact.1130.c.tooltip: "Phái viên của chúng ta sẽ cố gắng thu thập càng nhiều tình báo càng tốt."
 first_contact.1135.name: "Cơ hội thứ hai"
 first_contact.1135.desc: "Việc chúng ta làm ngơ trước lời mời của §H[This.ContactCountry.GetName]§! đã xúc phạm họ. Thái độ của họ quay ngoắt một trăm tám mươi độ. Trong các liên lạc sau đó, [This.Owner.GetLinguists] của chúng ta đã dịch ra một số lời lẽ mang tính thù địch.\n\nCó vẻ như họ không muốn bị chúng ta từ chối."
 first_contact.1135.a: "Được rồi, được rồi. Chúng ta sẽ tham dự."
 first_contact.1135.a.tooltip: "Rốt cuộc thì chúng ta sẽ tham dự để giữ quan hệ ngoại giao suôn sẻ."
 first_contact.1135.b: "Đã bảo không đi là không đi."
 first_contact.1135.b.tooltip: "Chúng ta không có bất kỳ lý do gì để chấp nhận lời mời này."
 first_contact.1140.name: "Sai lầm tình báo"
 first_contact.1140.desc: "Sự kiện của §H[This.ContactCountry.GetName]§! kéo dài lâu hơn nhiều so với dự kiến.\n\nKhi tàu con thoi của [This.Owner.GetEnvoy] [This.Leader.GetName] quay về, họ đã báo cáo nhiệm vụ thất bại.\n\nTrong quá trình diễn ra sự kiện, ban tổ chức đã phát hiện ra các thiết bị gián điệp. [This.Owner.GetEnvoyCap] [This.Leader.GetName] đã bị thẩm vấn, khiển trách và trục xuất. Dù dữ liệu lấy được từ các công nghệ gián điệp dự phòng giúp chúng ta hiểu được ngôn ngữ và công nghệ của họ, nhưng triển vọng ngoại giao của chúng ta giờ đây trở nên vô cùng mờ mịt."
 first_contact.1140.A: "Thật không may."
 first_contact.1145.name: "Quét hoàn tất"
 first_contact.1145.desc: "Sự kiện của §H[This.ContactCountry.GetName]§! kéo dài lâu hơn nhiều so với dự kiến.\n\nSau khi đáp tàu con thoi trở về, [This.Owner.GetEnvoy] [This.Leader.GetName] đã báo cáo chiến dịch thành công rực rỡ. Không chỉ phần lớn ngôn ngữ của người ngoài hành tinh đã được giải mã, mà các bản quét của chúng ta còn vẽ nên một bức tranh rõ nét về năng lực công nghệ của họ.\n\nĐiều này sẽ thúc đẩy mạnh mẽ mối quan hệ trong tương lai giữa chúng ta với §H[This.ContactCountry.GetName]§!, đồng thời khiến họ hoàn toàn không biết rằng chúng ta đã nắm rõ công nghệ của họ trong lòng bàn tay."
 first_contact.1150.name: "Tâm điểm bữa tiệc"
 first_contact.1150.desc: "Mang theo một tâm trí cởi mở đến tham gia sự kiện kéo dài nhiều ngày này, [This.Owner.GetEnvoy] [This.Leader.GetName] đã thưởng thức các màn biểu diễn âm nhạc, kịch nghệ, ảo thuật và nếm thử nhiều món ăn truyền thống. Sự đón nhận nồng nhiệt của họ đối với các trải nghiệm này đã được §H[This.ContactCountry.GetName]§! đánh giá rất cao.\n\nKhi rời đi, [This.Owner.GetEnvoyCap] [This.Leader.GetName] đã có được sự hiểu biết rất sâu sắc về ngôn ngữ và cũng vô cùng tán thưởng văn hóa của họ. Trải nghiệm này sẽ tạo nền tảng vững chắc cho một mối quan hệ ngoại giao tích cực hơn với §H[This.ContactCountry.GetName]§! trong tương lai."
 first_contact.1150.a: "Lời mời từ những người bạn mới thật chân thành làm sao."
 first_contact.1155.name: "Hơi mất hứng"
 first_contact.1155.desc: "[This.Owner.GetEnvoyCap] [This.Leader.GetName] đã lịch sự tham quan các hoạt động văn nghệ và nếm thử đôi chút ẩm thực của họ trong sự kiện kéo dài nhiều ngày này. Tuy nhiên, thái độ hờ hững đó đã khiến §H[This.ContactCountry.GetName]§! khá thất vọng. Theo những gì chúng ta hiểu về ngôn ngữ của họ, họ cho rằng phái viên của chúng ta là đồ \"nhạt nhẽo\".\n\nPhái viên của chúng ta đã được hộ tống trở lại tàu con thoi và bị ra hiệu rời đi. Dù sao thì phái viên cũng đã nắm bắt được ngôn ngữ và có hiểu biết sơ bộ về văn hóa của họ, chúng ta có thể dùng điều này làm cơ sở cho các hoạt động ngoại giao sau này."
 first_contact.1155.a: "Phái viên mệt rồi."
 first_contact.1160.name: "\"Khát\" khao kết nối"
 first_contact.1160.desc: "Trong suốt sự kiện kéo dài nhiều ngày này, sự thất vọng của §H[This.ContactCountry.GetName]§! trước những khác biệt về nhu cầu dinh dưỡng là điều thấy rõ. May mắn thay, [This.Owner.GetEnvoy] [This.Leader.GetName] vẫn tích cực tham gia vào các hoạt động giải trí khác và xây dựng được sự tôn trọng lẫn nhau.\n\nKhi rời đi, [This.Owner.GetEnvoyCap] [This.Leader.GetName] đã có được hiểu biết cơ bản về ngôn ngữ và văn hóa của §H[This.ContactCountry.GetName]§!. Đáng khen thay, họ có vẻ vẫn giữ được sự bình thản trước thảm họa ẩm thực này, và còn cung cấp cho chúng ta nhiều tài liệu về các quy tắc xã giao. Tuy có hơi nhàm chán, nhưng những kiến thức này sẽ giúp các hoạt động ngoại giao sau này diễn ra suôn sẻ hơn."
 first_contact.1160.a: "Thấu hiểu là nền tảng của ngoại giao."
 first_contact.1165.name: "Đã bảo không là không"
 first_contact.1165.desc: "Việc từ chối lời mời lên tàu của §H[This.ContactCountry.GetName]§! lần thứ hai đã nhận về một phản hồi đầy kích động. Chúng ta đã nhận được một đoạn liên lạc dài hàng giờ đồng hồ từ nhiều thành viên phi hành đoàn ngoài hành tinh, mà [This.Owner.GetLinguists] của chúng ta cho rằng đó là những lời lên án việc chúng ta không chịu tham dự.\n\nNhững đoạn liên lạc này, kết hợp với các tín hiệu đánh chặn được từ tàu của họ, đã giúp chúng ta giải mã được đủ ngôn ngữ để có những hiểu biết thực sự có ý nghĩa. Bất chấp thái độ tiêu cực của họ về sự cố này, giờ đây chúng ta đã có thể thiết lập các mối quan hệ ngoại giao phù hợp hơn."
 first_contact.1165.a: "Bọn ngoài hành tinh này thật bướng bỉnh."
