 tech_subspace_drive:0 "Động cơ Không gian con"
 tech_subspace_drive_desc:0 "Động cơ Không gian con là một giải pháp ra đời từ khát khao mãnh liệt được rời khỏi quê hương, với thiết kế chuyên biệt để thực hiện các chuyến bay liên sao trong phạm vi hạn chế. Mặc dù chỉ có thể thực hiện những bước nhảy nhỏ, nhưng chúng vẫn mang đến một cơ hội ngàn năm có một để chúng ta khởi động công cuộc khám phá bầu trời đầy sao."

 TECH_UNLOCK_SUBSPACE_DRIVE_TITLE:0 "§HMở khóa linh kiện:§! $SUBSPACE_DRIVE$"
 TECH_UNLOCK_SUBSPACE_DRIVE_DESC:0 "§HĐộng cơ Bước nhảy§!\n$tech_subspace_drive_desc$"

 SUBSPACE_DRIVE:0 "Động cơ Không gian con"
 SUBSPACE_DRIVE_DESC:0 "Động cơ Không gian con có thể xé rách không thời gian để tạo ra những khe hở cực nhỏ, cho phép các con tàu thực hiện bước nhảy tới những hệ sao lân cận. Nếu khoảng cách bước nhảy quá xa, quá trình này sẽ trở nên cực kỳ bất ổn."
 fircon.machine_exploration_protocol:0 "Tuyệt vời. Hãy thêm chúng vào cơ sở dữ liệu của chúng ta."


