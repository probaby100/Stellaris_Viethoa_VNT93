 controlled_shattering_tt:0 "Phá vỡ có kiểm soát"

 situation_fotd_terraforming:0 "Tình huống cải tạo môi trường Nỗi Lo Sợ Bóng Tối"
 situation_fotd_terraforming_type:0 "$situation_fotd_terraforming$"
 situation_fotd_terraforming_desc:0 "Tiến độ bước vào giai đoạn cải tạo môi trường tiếp theo."
 situation_fotd_terraforming_monthly_change_tooltip:0 "Khi tình huống tiến triển, [Target.GetName] sẽ dần được cải tạo."

 ## Traits ##

 leader_trait_fotd_scientist:0 "Xảo quyệt"
 leader_trait_fotd_scientist_desc:0 "Kinh nghiệm của nhà khoa học này đã hình thành nên nhiều quan điểm sâu sắc trong lĩnh vực công nghệ tàng hình."
 leader_trait_fotd_scientist_tooltip:0 "Có thể tăng xác suất khám phá các manh mối về §HCông nghệ tàng hình§! liên quan đến lĩnh vực vật lý."

 leader_trait_fotd_commander:0 "Xảo quyệt"
 leader_trait_fotd_commander_desc:0 "Quá trình trưởng thành của vị chỉ huy này đã dạy người này cách linh hoạt sử dụng công nghệ tàng hình, thậm chí dưới những hình thức mà các chỉ huy của chúng ta không thể tưởng tượng nổi."

 ## Modifiers ##

 fotd_settled_differences:0 "Giải quyết bất đồng"
 fotd_settled_differences_desc:0 "Sau khi giải quyết những khác biệt về hệ tư tưởng, mọi người đã đoàn kết lại."

 fotd_alien_shock:0 "Cú sốc ngoại lai"
 fotd_alien_shock_desc:0 "Hành tinh anh em của chúng ta đã tỏ ra lúng túng và bối rối khi đối mặt với tin tức về sự sống ngoài hành tinh, và cảm xúc này của họ cũng đã lan truyền đến nhân dân chúng ta thông qua các phương tiện truyền thông và liên lạc."

 fotd_alien_terrified:0 "Phát hiện kinh hoàng"
 fotd_alien_terrified_desc:0 "Có lẽ hành tinh anh em của chúng ta đã đúng: những tin tức khủng khiếp về những con quái vật khổng lồ này đã khiến cả hai hành tinh của chúng ta trở nên mất ổn định."

 fotd_refusal_to_work:0 "Từ chối làm việc"
 fotd_refusal_to_work_desc:0 "Như một sự phản đối ngây thơ đối với các hoạt động ngoại giao gần đây của chúng ta, những người láng giềng đã đình chỉ mọi hợp tác khoa học. Tất nhiên, chuyện này chắc chắn sẽ sớm lắng xuống."

 fotd_forced_to_stay:0 "Bắt buộc lưu trú"
 fotd_forced_to_stay_desc:0 "Người dân trên hành tinh này bị tước đoạt cơ hội rời đi. Khỏi phải nói, sau khi yêu cầu di cư, kết quả như vậy chắc chắn không thể khiến họ hài lòng."

 fotd_disunity:0 "Mất đoàn kết"
 fotd_disunity_desc:0 "Hành tinh đối tác của chúng ta tin rằng tình hình chính trị hiện tại là không thể tránh khỏi. Họ không ngừng nhắc nhở chúng ta về sự thật này."

 fotd_unified_stance:0 "Lập trường thống nhất"
 fotd_unified_stance_desc:0 "Điều này tượng trưng cho một mối đe dọa mà cả hai hành tinh đều phải đối mặt. Trước khi ổn định nội bộ, phải đẩy lùi giặc ngoài."

 fotd_unified_purpose:0 "Chung sức đồng lòng"
 fotd_unified_purpose_desc:0 "Một thực thể nào đó đang đe dọa hệ sao của chúng ta. Chúng ta phải chống lại nó. Như một quốc gia duy nhất."

 slowed_science_ships:0 "Trì hoãn thám hiểm"
 slowed_science_ships_desc:0 "Do thỏa thuận nghiên cứu ký kết với hành tinh anh em, chúng ta phải tạm dừng khám phá các hành tinh mới."

 slowed_first_contact:0 "Đình trệ Tiếp xúc Đầu tiên"
 slowed_first_contact_desc:0 "Như một cái giá phải trả để trao đổi công nghệ mới với hành tinh anh em, chúng ta sẵn sàng tạm dừng dự án tiếp xúc đầu tiên hiện tại."

 supporting_haven:0 "Giao dịch công bằng"
 supporting_haven_desc:0 "Chúng ta nhận được công nghệ mới, còn họ có thêm nhiều tài nguyên hơn. Giao dịch này rất công bằng."

 promised_no_shroud:0 "Cam kết không nghiên cứu sâu hơn"
 promised_no_shroud_desc:0 "Chúng ta đã hứa với hành tinh anh em sẽ không tiếp tục khám phá sâu hơn về sức mạnh hay công nghệ tâm linh bí ẩn. Họ sợ chúng ta sẽ đánh mất chính mình. Thật là lo bò trắng răng."

 have_no_voice:0 "Tắt tiếng"
 have_no_voice_desc:0 "Sức ảnh hưởng ngoại giao của chúng ta đã bị suy giảm nghiêm trọng. Hiện tại, chúng ta phải im lặng trên vũ đài ngân hà. Suy cho cùng, công nghệ mà chúng ta đổi lấy vẫn xứng đáng hơn nhiều."

 ruined_mass_driver:0 "Pháo phóng khối lượng bị phá hủy"
 ruined_mass_driver_desc:0 "Tàn tích của khẩu pháo phóng khối lượng cấp hệ sao khổng lồ của $NAME_fotd_Hunter_species$. Dù không còn hoạt động, nhưng việc nghiên cứu nó vẫn giúp nâng cao hiểu biết của chúng ta về đạn đạo học."

 fotd_secure_contact:0 "Tiếp xúc Đầu tiên an toàn"
 fotd_secure_contact_desc:0 "Chúng ta có lý do để tin rằng công tác tiếp xúc đầu tiên của chúng ta đã chịu ảnh hưởng tiêu cực. Kể từ giờ phút này, chúng ta phải cẩn trọng hơn."

 fotd_assited_shipyards:0 "Viện trợ Xưởng đóng tàu"
 fotd_assited_shipyards_desc:0 "Nhờ sự giúp đỡ của hành tinh anh em, xưởng đóng tàu hiện đang hoạt động với hiệu suất 110%."

 fotd_assisted_fleet:0 "Hạm đội đầy đủ biên chế"
 fotd_assisted_fleet_desc:0 "Thông qua sự cộng tác với hành tinh anh em, tàu của chúng ta hoạt động với hiệu suất chưa từng có."

 fotd_unified_fleet:0 "Hạm đội liên hợp"
 fotd_unified_fleet_desc:0 "Hạm đội của chúng ta hoạt động với hiệu suất vô song, cảm ơn đoàn sĩ quan từ hành tinh anh em của chúng ta."

 fotd_terrified_outraged:0 "Sợ hãi và Phẫn nộ"
 fotd_terrified_outraged_desc:0 "Hành động của chúng ta khiến một số thành viên trong giống loài chế giễu rằng chúng ta không còn là [Root.Species.GetName] thực sự nữa, nhưng quan điểm của họ chẳng có giá trị gì. Chúng ta không quan tâm đến những lời chỉ trích."

 fotd_extorted_seperatists:0 "Những kẻ ly khai bị tống tiền"
 fotd_extorted_seperatists_desc:0 "Mặc dù chúng ta thu được những nguồn tài nguyên này bằng biện pháp mạnh, nhưng thế thì có sao đâu? Một số người chỉ cần được thuyết phục mạnh mẽ hơn những người khác thôi."

 fotd_rationed_living:0 "Cuộc sống theo chế độ phân phối"
 fotd_rationed_living_desc:0 "Sau khi trải qua một cuộc khủng hoảng thâm hụt nghiêm trọng, hành tinh anh em của chúng ta hiện đang cần cắt giảm các cơ quan không thiết yếu. Vậy nên chương trình giao lưu văn hóa của chúng ta đã đổ vỡ."

 fotd_triumviri:0 "Một trong Tam Đầu chế"
 fotd_triumviri_desc:0 "Dù hành tinh đối tác đã cung cấp cho chúng ta kiến thức về kỹ thuật và chiến thuật, nhưng góc nhìn lịch sử độc đáo của người Fevorian lại giúp chúng ta nhìn nhận xã hội của mình từ một góc độ mới."

 #Projects

 fotd_chain_title:0 "Nỗi Lo Sợ Bóng Tối"
 fotd_chain_desc:0 "Với tư cách là nạn nhân của cuộc xâm lăng vô cớ từ một kẻ địch có công nghệ vượt trội, chúng ta đã thấu hiểu cái giá phải trả cho sự lơ là. Chuyện này sẽ không xảy ra nữa."
 fotd_hunter_poi:0 "Hệ sao Thợ săn"
 fotd_hunter_desc:0 "Đây chính là hệ sao khởi nguồn cho cuộc tấn công đã nghiền nát §YKẻ Đại chia rẽ§!. Kết quả quét cho thấy hệ sao này đặc biệt dồi dào khoáng chất."

 FOTD_CONFIRM_FINDINGS:0 "Xác nhận Phát hiện"
 FOTD_CONFIRM_FINDINGS_DESC:0 "Tiểu hành tinh đã đâm vào Kẻ Đại chia rẽ chứa một lượng vonfram dồi dào bất thường, nhiều nhà khoa học tuyên bố họ đã \"chứng minh\" đây là một cuộc tấn công vào hệ sao của chúng ta. Đáng tiếc, thỏa thuận của chúng ta với họ đồng nghĩa với việc chúng ta phải hùa theo những suy nghĩ viển vông này."

 FOTD_DEFLECTING_FIELDS:0 "Trường Chệch hướng"
 FOTD_DEFLECTING_FIELDS_DESC:0 "Nếu có đủ thời gian, chỉ cần một con tàu nghiên cứu là có thể thiết lập một trường dao động để thay đổi đường bay của tên lửa vonfram. Nhưng chỉ thế thôi thì có lẽ chưa đủ."

 FOTD_REVERSED_THRUSTERS:0 "Động cơ Đẩy ngược"
 FOTD_REVERSED_THRUSTERS_DESC:0 "Những quả ngư lôi được cải tạo đặc biệt có thể được lập trình để tự gắn vào các viên đạn này, dùng động cơ đẩy ngược để hãm tốc độ của \"món quà bất ngờ\" này lại."

 FOTD_COUNTER_SHOT:0 "Bắn Chặn"
 FOTD_COUNTER_SHOT_DESC:0 "Mặc dù trong hệ sao của chúng ta không có gì đậm đặc hơn tiểu hành tinh vonfram này, nhưng đá không gian thì vẫn có rất nhiều. Kể cả khi chỉ có thể phóng với vận tốc cận sáng, việc dùng một tiểu hành tinh khác đập vào nó hẳn cũng đủ để hóa giải nguy cơ này."

 FOTD_CONTROLLED_SHATTERING:0 "Phá vỡ Có Kiểm soát"
 FOTD_CONTROLLED_SHATTERING_DESC:0 "Việc trực tiếp kích nổ viên đạn vonfram này nghe có vẻ là một ý kiến hay, nhưng những mảnh vỡ tạo ra vẫn có thể gây ra sức tàn phá khủng khiếp cho hành tinh của chúng ta. Các nhà khoa học của chúng ta đã tính toán ra một quy trình tháo dỡ có kiểm soát, có lẽ có thể biến viên đạn này thành hình thái dễ xử lý hơn."


 ## Scripted Loc ##

 fotdCoercion1:0 "Để dụ dỗ họ ở lại thêm vài năm nữa, chúng ta phải đưa ra một số biện pháp khuyến khích. Đừng coi thường sức mạnh của những món lợi nhỏ."
 fotdCoercion2:0 "Chúng ta có thể nhắc nhở họ rằng nơi đây có rất nhiều niềm vui, có lẽ có thể đưa ra một vài ví dụ cụ thể để khuyến khích họ ở lại."
 fotdCoercion3:0 "Được thôi, nếu họ một mực đòi về nhà thì chúng ta cũng không còn cách nào khác, đành phải báo cho chính phủ của họ biết việc họ tham gia vào các mối quan hệ ngoại lai bất hợp pháp."
 fotdCoercion4:0 "Chúng ta có thể trích quỹ trợ cấp của chính phủ để tài trợ cho dự án này. Điều đó hẳn sẽ khiến họ xao nhãng trong một thời gian."

