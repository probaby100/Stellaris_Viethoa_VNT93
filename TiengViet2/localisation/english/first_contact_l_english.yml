 ### Pre-FTL Awareness
 # Stages
 awareness_unaware:0 "Hoàn toàn chưa Giác ngộ"
 awareness_low:0 "Giác ngộ Sơ bộ"
 awareness_partial:0 "Giác ngộ Một phần"
 awareness_high:0 "Giác ngộ Mức độ cao"
 awareness_full:0 "Giác ngộ Hoàn toàn"
 # Stage tooltips
 awareness_unaware_tt:0 "Nền văn minh này hoàn toàn không có nhận thức về sự sống liên sao."
 awareness_low_tt:0 "Do thiếu bằng chứng chứng minh sự tồn tại của sự sống liên sao, nền văn minh này vẫn cho rằng họ có thể là sinh vật duy nhất trong vũ trụ."
 awareness_partial_tt:0 "Nền văn minh này bắt đầu nhận thức được rằng có sự sống trong ngân hà. Có thứ gì đó ở ngoài không gian. Nhưng đó có thể là gì?"
 awareness_high_tt:0 "Nền văn minh này nhận thức được rằng ngân hà tràn ngập sự sống; nhưng những sinh vật này là ai, và họ muốn gì?"
 awareness_full_tt:0 "Nhận thức đầy đủ về sự tồn tại của sự sống liên sao, nền văn minh này hiểu rất rõ rằng họ thuộc về một cộng đồng thiên hà."

 AWARENESS_STAGE_VAL_DESC:0 "Mức độ Giác ngộ hiện tại: $VAL|0Y$"
 AWARENESS_OLD_DESC:0 "Vào đầu tháng, mức độ Giác ngộ của họ là $OLDVAL|0Y$."

 PREFTL_TECH_LEVEL_VAL_DESC:0 "Tiến độ hiện tại đến thời đại tiếp theo: §Y$VAL|0%$§!"

 MESSAGE_PRE_FTL_AWARENESS_INCREASED_TITLE:0 "Nhận thức đã tăng lên"
 MESSAGE_PRE_FTL_AWARENESS_INCREASED_DESC:1 "£awareness£ §YNhận thức§! của $COUNTRY|Y$ thuộc hệ sao $SYSTEM|Y$ đã tăng lên mức §Y[root.GetAwarenessLevel]§!."

 MESSAGE_PRE_FTL_AWARENESS_DECREASED_TITLE:0 "Nhận thức đã giảm đi"
 MESSAGE_PRE_FTL_AWARENESS_DECREASED_DESC:1 "£awareness£ §YNhận thức§! của $COUNTRY|Y$ thuộc hệ sao $SYSTEM|Y$ đã giảm xuống mức §Y[root.GetAwarenessLevel]§!."

 awareness.910.name:0 "Lộ diện!"
 awareness.910.desc:0 "Chúng ta luôn trắng trợn tiến hành các hoạt động tại hệ sao §Y[contact_empire_system.GetName]§! mà không mảy may chú ý đến việc che giấu hành tung của mình. Mặc dù trình độ công nghệ của họ không cao, nhưng ngay cả §Y[contact_empire.GetName]§! cũng đã nhận ra các hoạt động của chúng ta. Giờ đây, cuộc tiếp xúc đầu tiên là điều không thể tránh khỏi."

 awareness.920.name:0 "Ai đang Nhìn chằm chằm Kẻ quan sát?"
 awareness.920.desc:0 "Chúng ta đã xây dựng một trạm quan sát xung quanh §Y[fromfrom.GetName]§! để nghiên cứu các cư dân trên đó, nhưng lại nhận ra rằng §Y[contact_empire.GetSpeciesNamePlural]§! lại đang nghiên cứu chúng ta: họ hoàn toàn rõ ràng về sự tồn tại của các giống loài ngoài hành tinh khác, và nhanh chóng chú ý đến sự xuất hiện của các [root.GetScientistPlural] của chúng ta.\n\nCác hoạt động trước đây của chúng ta trong hệ sao này chắc chắn đã khiến [fromfrom.owner.GetName] cảnh giác về sự tồn tại của chúng ta. Trong tình hình hiện tại, việc duy trì sự hiện diện tàng hình của chúng ta không còn nhiều ý nghĩa."

 AWARENESS_MONTHLY:0 "Tiến độ Mức độ Giác ngộ"
 AWARENESS_MONTHLY_VALUE:0 "Thay đổi Hàng tháng: $VALUE|=0Y$"
 AWARENESS_MONTHLY_VALUE_DELAYED:0 "§EMức độ Giác ngộ của nền văn minh này sẽ thay đổi một lượng như thế này trong tháng trước.\n\nMức độ Giác ngộ sẽ bị ảnh hưởng bởi nhiều khía cạnh, bao gồm các hoạt động không gian trong hệ sao, cũng như các tương tác của chúng ta với một nền văn minh giả định nào đó.§!"

