 alert_forced_to_decloak_by_us_title:0 "Phát hiện Hạm đội Tàng hình"
 alert_forced_to_decloak_by_us_instant:0 "Mạng lưới cảm biến của chúng ta đã phát hiện ít nhất một hạm đội tàng hình không phải của đồng minh, và chúng ta đã buộc nó phải bãi bỏ trạng thái tàng hình."

 alert_mia_forced_to_decloak_by_us_title:0 "Phát hiện Hạm đội Tàng hình"
 alert_mia_forced_to_decloak_by_us_instant:0 "Mạng lưới cảm biến của chúng ta đã phát hiện ít nhất một hạm đội tàng hình không phải của đồng minh, và chúng ta đã buộc nó phải bãi bỏ trạng thái tàng hình. Những hạm đội này hiện đang trong trạng thái mất tích lúc làm nhiệm vụ."
