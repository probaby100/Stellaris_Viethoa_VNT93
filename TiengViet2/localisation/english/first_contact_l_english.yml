 MESSAGE_PENDING_INSIGHT_TECH:0 "Chúng ta đã thu thập được đủ thông tin để tạo ra một §SCông nghệ Sự hiểu biết§! mới phục vụ cho việc khám phá sâu hơn. Lần tới, khi chúng ta có một sự kiện quan sát có khả năng thúc đẩy sự hiểu biết, chúng ta sẽ có được một tùy chọn nghiên cứu mới."
