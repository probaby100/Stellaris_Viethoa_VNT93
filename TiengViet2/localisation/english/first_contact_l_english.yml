 approach_favor_insights:0 "Hỗ trợ Sự hiểu biết"
 favor_insights_tt:0 "Chúng ta đang đổ nhiều ngân sách hơn vào việc thu nhận thông tin, gây ảnh hưởng đến các nhiệm vụ quan sát của chúng ta."
 approach_favor_mission:0 "Hỗ trợ Nhiệm vụ"
