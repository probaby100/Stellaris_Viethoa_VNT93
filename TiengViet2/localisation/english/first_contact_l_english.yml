 effect_stop_the_bullet:0 "Chúng ta đang tuyệt vọng tìm kiếm một giải pháp."
 stage_edge_of_solar_system:0 "Đạn đang tiến gần đến hệ sao của chúng ta."
 stage_entered_solar_system:0 "Đạn đã vào hệ sao của chúng ta."
 deflecting_fields_tt:0 "Trường chệch hướng"
