 alert_mia_forced_to_decloak_title:0 "Buộc phải Bãi bỏ Tàng hình"
 alert_mia_forced_to_decloak_instant:0 "Ít nhất một hạm đội của chúng ta đã bị buộc phải bãi bỏ trạng thái tàng hình, và hiện đang mất tích trong lúc làm nhiệm vụ. Sẽ cần một khoảng thời gian để họ hội quân trở lại."
