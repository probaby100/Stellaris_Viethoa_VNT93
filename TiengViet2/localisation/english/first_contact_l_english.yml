 #Buildings
 building_solarpunk_gaiaseeder:0 "Máy Gieo hạt Gaia"
 building_solarpunk_gaiaseeder_desc:0 "Hệ thống kiểm soát khí quyển hoàn thiện đã duy trì được trạng thái nguyên sơ của hành tinh này."
 building_solarpunk_ranger_lodge:0 "Nhà gỗ Khu Bảo tồn Thiên nhiên"
 building_solarpunk_ranger_lodge_desc:0 "Khu nghỉ dưỡng tuyệt vời để tận hưởng cảnh sắc hùng vĩ của hành tinh."
 building_solarpunk_sapling:0 "Cây non Vĩ đại"
 building_solarpunk_sapling_desc:0 "Một gốc cây non khổng lồ, là thành tựu kết tinh từ nhiều thế kỷ nghiên cứu và thao túng thực vật, đủ sức nuôi sống hàng triệu sinh mạng."
 building_solarpunk_organic_paradise:0 "Thành phố Treo"
 building_solarpunk_organic_paradise_desc:0 "Một đô thị ẩn mình giữa khu rừng kỳ vĩ, đưa cư dân đến gần hơn với vòng tay của mẹ thiên nhiên."

 job_solarpunk_anarchist:0 "Nhà cải tạo Môi trường Mãn nguyện"
 job_solarpunk_anarchist_plural:0 "Nhà cải tạo Môi trường Mãn nguyện"
 job_solarpunk_anarchist_desc:0 "Sau khi kiến tạo thành công chốn không tưởng của riêng mình, những điêu khắc gia hành tinh này hiện đang tận hưởng khoảng thời gian nghỉ ngơi đầy vui vẻ."
 mod_job_solarpunk_anarchist_add:0 "Nghề nghiệp $solarpunk_anarchist$"

