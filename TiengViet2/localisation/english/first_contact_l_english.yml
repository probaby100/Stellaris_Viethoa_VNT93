 ## Observation Events
 fircon.1256.name:0 "Thuần phục và Sinh sôi"
 fircon.1256.desc:0 "Cư dân trên §Y[From.Owner.Capital.GetName]§! đã cải thiện trình độ nông nghiệp của họ thông qua việc thử nghiệm các loại phân bón giàu chất dinh dưỡng. Họ có thể thu hoạch được nông sản với chất lượng cao hơn, và sức khỏe tổng thể của xã hội cũng được cải thiện.\n\nXét tới kỹ thuật thô sơ của họ, tiến bộ trong sản xuất lương thực này là rất đáng kể. Khi đã thu được mẫu phân bón, chúng ta có thể nhân rộng thành tựu này trên quy mô lớn hơn."
 fircon.1256.a:0 "Chúng ta sẽ tiếp tục theo dõi những nỗ lực của họ từ xa."
 fircon.1256.b:0 "Cử một đội đi lấy mẫu."
 fircon.1257.name:0 "Thuần phục và Sinh sôi: Đã Nghiên cứu Mẫu vật"
 fircon.1257.desc:0 "Phân tích của chúng ta về mẫu phân bón thu thập được từ §Y[FromFrom.Owner.Capital.GetName]§! đã cung cấp những hiểu biết quan trọng về các hoạt động nông nghiệp của nền văn minh Tiền FTL, một phần trong số đó thậm chí còn mới mẻ đến mức có thể nâng cao trình độ công nghệ của chính chúng ta. Mọi người đều cho rằng, nỗ lực lần này rất xứng đáng với giá trị của nó, nhiệm vụ đã thành công tốt đẹp."
 fircon.1261.name:0 "Nạn Đói!"
 fircon.1261.desc:0 "Các khu định cư trên §Y[From.Owner.Capital.GetName]§! vẫn luôn trải qua tình cảnh khó khăn trong nông nghiệp. Những vụ mùa thất bát gần đây có thể sẽ dẫn đến những cuộc xung đột vì tranh giành lương thực. Đối với một xã hội trẻ và đang phát triển, đây là một thời khắc mang tính quyết định.\n\nCho dù họ chọn cách đoàn kết bên nhau khi cần thiết hay trở mặt thành thù, thì quyết định hiện tại của họ sẽ có ảnh hưởng rất lớn đến phương hướng phát triển trong tương lai.\n\nThật không may, dù lựa chọn theo cách nào, họ cũng sẽ bước vào một thời kỳ vô cùng khó khăn."
 fircon.1261.a:0 "Chúng ta sẽ không can thiệp vào quá trình phát triển tự nhiên của họ."
 fircon.1261.b:0 "Về mặt đạo lý, chúng ta nên giúp đỡ."
 fircon.1261.c:0 "Chúng ta có thể làm giảm nhu cầu về lương thực của họ..."
 fircon.1262.name:0 "Nạn đói đã Chấm dứt!"
 fircon.1262.desc:0 "Sự can thiệp gần đây của chúng ta tại §Y[FromFrom.Owner.Capital.GetName]§! đã đem lại những kết quả tích cực. Bằng cách sử dụng công nghệ nông nghiệp của riêng mình, chúng ta đã ngấm ngầm đảm bảo rằng họ không phải chịu đựng nạn đói.\n\nBây giờ, khi họ đã có được nguồn lương thực dư thừa, chúng ta phải kiềm chế hành động của mình, giới hạn mức độ can thiệp."
 fircon.1271.name:0 "Bức họa trong Hang động!"
 fircon.1271.desc:0 "Cư dân trên §Y[From.Owner.Capital.GetName]§! không ngừng sáng tạo ra những tác phẩm nghệ thuật nguyên sơ đại diện cho nền văn hóa của họ trong các không gian sinh hoạt chung, và chúng ta nhận ra rằng một số hình ảnh trong đó bắt đầu để lộ ra những đường nét của chúng ta.\n\nBây giờ xem ra, những việc làm của chúng ta trên hành tinh này rất có thể đã bị chú ý."
 fircon.1271.a:0 "Họ đã vẽ lại bộ dạng của chúng ta. Thật không thể tin nổi!"
 fircon.1271.b:0 "Đây là bức vẽ cái quái gì thế. Xóa đi cho tôi!"
 fircon.1271.c:0 "Chúng ta đã làm ô nhiễm văn hóa của họ. Sau này phải cẩn thận hơn."
 fircon.1285.name:0 "Được viết giữa các Vì sao!"
 fircon.1285.desc:0 "Trên §Y[From.Owner.Capital.GetName]§!, các cư dân đang sử dụng những bức vẽ chạm khắc thô sơ để biểu đạt và chia sẻ các ý tưởng. Các mẫu vật mà các nhà nghiên cứu của chúng ta ghi nhận được cho thấy rằng cư dân ở đây đã có nhận thức về các thiên thể ngoài hành tinh của chính họ, thậm chí đã bắt đầu ghi chép lại các chòm sao.\n\nĐối với một nền văn minh non trẻ như vậy, những bản đồ sao đầu tiên mà họ vẽ ra lại có độ chính xác khá cao, nhưng cũng không đến mức không thể cải thiện, chỉ cần chúng ta muốn để lại một vài gợi ý..."
 fircon.1285.a:0 "Tiếp tục quan sát thụ động. Họ phải tự lực cánh sinh."
 fircon.1285.b:0 "Có lẽ chúng ta có thể âm thầm đẩy họ đi đúng hướng..."
 fircon.1290.name:0 "Được viết giữa các Vì sao: Biểu đồ đã được Bàn giao"
 fircon.1290.desc:0 "Bản đồ sao sơ khai do cư dân của §Y[FromFrom.Owner.Capital.GetName]§! vẽ ra đã được chúng ta ngấm ngầm sửa đổi.\n\nNhững hình chạm khắc mô tả họa tiết của hệ sao lân cận đã được tạo ra trong một hang động gần đó. Một khi được tìm thấy, chúng có thể giúp cư dân địa phương hiểu rõ hơn về quy mô của vũ trụ đã biết."
 fircon.1290.a:0 "Hôm nay chúng ta đã làm được một việc rất tốt."
 fircon.1291.name:0 "Được viết giữa các Vì sao: Thu hoạch Biểu đồ"
 fircon.1291.desc:0 "Đáng tiếc thay, vì cư dân của §Y[FromFromFrom.Owner.Capital.GetName]§! không biết ai là người chịu trách nhiệm tạo ra tấm bản đồ sao mới của họ, nên họ coi hành động của chúng ta đơn thuần là một hành vi phá hoại. Các biện pháp an ninh xung quanh hang động đã được tăng cường, và giới tinh hoa cai trị ngày càng tỏ ra thù địch với những hình thức tự thể hiện mới...\n\nVề mặt tích cực, sự can thiệp của chúng ta không hoàn toàn lãng phí thời gian. Phản ứng của họ đối với sự kiện này có giá trị to lớn đối với nghiên cứu văn hóa."
 fircon.1292.name:0 "Được viết giữa các Vì sao: Đánh chặn"
 fircon.1292.desc:0 "Chúng ta đã không thể âm thầm sửa đổi bản đồ sao của §Y[FromFrom.Owner.Capital.GetName]§! một cách suôn sẻ. Đối với một xã hội non trẻ như vậy, các biện pháp an ninh của họ lại phức tạp đến kinh ngạc. Đối với nhiệm vụ hiện tại, nguy cơ bị lộ là quá cao. Chí ít thì hiện tại, cư dân địa phương cần phải dựa vào sức lực của chính mình để khám phá bầu trời đầy sao."
 fircon.1300.name:0 "Huyết thống Đồ họa"
 fircon.1300.desc:0 "Trên §Y[From.Owner.Capital.GetName]§! đã xuất hiện một cách độc lập nhiều hệ thống giao tiếp phi ngôn ngữ. Do có sự xung đột giữa bộ hình ảnh và chữ tượng hình, cư dân sẽ còn phải mất vài thế kỷ nữa mới hình thành được một ngôn ngữ chủ đạo.\n\nThú vị thay, cấu trúc ngữ pháp của một trong những hệ thống chữ viết này lại rất giống với hệ thống của chúng ta. Nếu xã hội §Y[From.Owner.Capital.GetName]§! áp dụng hệ thống này, trong tương lai họ có thể sẽ khá linh hoạt về mặt văn hóa..."
 fircon.1300.a:0 "Chúng ta nên tạo ra họ theo hình ảnh của chúng ta."
 align_pre_FTL_country_ethics_tooltip:0 "Họ sẽ trở nên giống với chúng ta."
 fircon.1300.b:0 "Họ phải có ngôn ngữ của riêng mình."
 fircon.1310.name:0 "Chúng ta Thật Vĩ đại!"
 fircon.1310.desc:0 "Sự hiện diện của chúng ta trên §Y[From.Owner.Capital.GetName]§! đã thu hút sự chú ý của người khác. Các nhóm văn hóa thống trị hiện nay coi chúng ta như những thực thể quyền năng và thông thái, cho rằng chúng ta điều khiển các nguyên tố, và cuối cùng nắm giữ vận mệnh của họ.\n\nNhiều người đã thề trung thành với chúng ta bằng chính mạng sống của họ trong các nghi lễ được dàn dựng công phu, vì sợ rằng nếu làm chúng ta không hài lòng sẽ mang lại hậu quả vô cùng nghiêm trọng."
 fircon.1310.a:0 "Phải thế chứ!"
 fircon.1310.b:0 "Họ không nợ chúng ta bất cứ điều gì."
 fircon.1315.name:0 "Họ Tôn sùng chúng ta!"
 fircon.1315.desc:0 "Sau nhiều quan sát lịch sử về xã hội của §Y[FromFrom.Owner.Capital.GetName]§!, nhóm xã hội thống trị của họ đã coi chúng ta như những vị thần để tôn thờ. Họ hy vọng tiếp tục dùng những hành động ân huệ để đổi lấy sự sủng ái của chúng ta... vì vậy, để tưởng nhớ chúng ta, nghi lễ hiến tế máu vẫn đang tiếp diễn."
 fircon.1320.name:0 "Các vị Thần Đã chết"
 fircon.1320.desc.base:0 "Theo lời của cư dân địa phương tại §Y[FromFrom.Owner.Capital.GetName]§!, căn bản là không có thần thánh nào cả.\n\nMặc dù chúng ta đã cố gắng biến mình thành những người chủ thiêng liêng của họ, nhưng họ đã sớm nhìn thấu được bản chất của chúng ta."
 fircon.1320.desc.regular:0 "$fircon.1320.desc.base$Người dân đã hoàn toàn bác bỏ khái niệm thần thánh, và chấp nhận một thế giới quan thiên rõ rệt về chủ nghĩa duy vật. Khi không có bằng chứng xác thực, họ tin rằng mình là sinh vật duy nhất trong vũ trụ."
 fircon.1320.desc.materialist:0 "$fircon.1320.desc.base$Nếu không có các bằng chứng phản bác được chứng minh bằng khoa học và được các chuyên gia đánh giá, họ đã dựa trên kinh nghiệm để xác định rằng trong thế giới thực này, ngay cả những vị thần xa xôi nhất cũng không tồn tại. Họ vẫn còn nuôi hy vọng."
 fircon.1320.desc.authoritarian:0 "$fircon.1320.desc.base$Những con người ngỗ ngược này từ chối thần phục người khác, họ chọn nghe theo bản năng cơ bản nhất của mình và bước vào tình trạng vô chính phủ. Nếu có cơ hội thích hợp, họ hẳn sẽ chấp nhận chúng ta làm người chủ của họ."
 fircon.1330.name:0 "Nghệ thuật Tìm đường!"
 fircon.1330.desc:0 "Xã hội trên §Y[From.Owner.Capital.GetName]§! đang không ngừng nuôi dưỡng một nền văn hóa phong phú và trào lưu cảm thụ nghệ thuật sâu sắc. Cư dân đã buông bỏ vũ khí, thay vào đó là sử dụng công cụ viết. Cùng với bầu không khí học hỏi và khám phá hoàn toàn mới này vượt lên trên các cuộc xung đột, chúng ta có thể đang chứng kiến sự xuất hiện của một kỷ nguyên vàng trên hành tinh này."
 fircon.1330.b:0 "Thật vinh hạnh khi được chứng kiến sự ra đời tuyệt vời như vậy."
 fircon.1330.c:0 "Một sự theo đuổi vô bổ."
 fircon.1340.name:0 "Hành trình Bắt đầu"
 fircon.1340.desc:0 "Chúng ta đang chứng kiến cư dân của §Y[From.Owner.Capital.GetName]§! tiến những bước đầu tiên trên con đường hướng tới sự khai sáng. Họ ngẩng đầu lên, luôn giữ thái độ cởi mở đối với những bí ẩn của vũ trụ. Khi mà biểu đạt nghệ thuật phát triển trong văn hóa của họ, sức mạnh nghệ thuật để nắm bắt khía cạnh phấn đấu tinh thần của xã hội cũng đang phát triển. Họ khao khát có một đức tin nào đó cao hơn cả bản ngã của họ."
 fircon.1340.b:0 "Chúng ta nên đáp lại lời cầu nguyện của họ!"
 fircon.1340.c:0 "Mọi thứ rồi sẽ hóa thành cát bụi. Những gì còn lại chẳng qua chỉ là khúc dạo đầu của việc này."
 fircon.1345.name:0 "Tương lai sẽ Ra sao?"
 fircon.1345.desc:0 "Thông qua việc mở lòng đón nhận những chân lý thần thánh đang hiện hữu, cư dân của §Y[FromFrom.Owner.Capital.GetName]§! đang tiến dần đến sự khai sáng. Với tư cách là những nhà lãnh đạo tinh thần, chúng ta có trách nhiệm dẫn dắt họ."
 fircon.1350.name:0 "Mọi thứ Đều Đi đến Hồi kết"
 fircon.1350.desc:0 "Khi cư dân của §Y[FromFrom.Owner.Capital.GetName]§! ngước nhìn lên bầu trời, họ hy vọng nhận được sự ban phước của thánh thần. Tuy nhiên, thứ họ thực sự nhận được chỉ là sự im lặng. Lời cầu nguyện của họ không được đáp lại. Bây giờ họ phải chấp nhận bản chất thất thường của tinh thần. Chỉ có khoa học mới nắm giữ những câu trả lời mà họ đang tìm kiếm."
 fircon.1360.name:0 "Sự Ngu dốt Có Thể Lây lan"
 fircon.1360.desc:0 "Cư dân của §Y[From.Owner.Capital.GetName]§! đã bắt đầu đưa ra một giả thuyết, họ cho rằng hành tinh mà họ đang sống là một món quà từ một thực thể không thể diễn tả bằng lời, và cuộc sống chính là sự đền đáp cho sự cống hiến không ngừng nghỉ đối với Đấng Sáng tạo thiêng liêng. Có lẽ khi họ gặp được cộng đồng thiên hà rộng lớn hơn, họ sẽ gặp phải một sự bất ngờ."
 fircon.1360.a:0 "Hãy để chúng ta dạy cho họ khoa học nào."
 fircon.1360.b:0 "Sau một khoảng thời gian, đức tin của họ sẽ phát triển."
 fircon.1360.c:0 "Họ nên biết được sự thật!"
 fircon.1365.name:0 "Sự Ngu dốt Có Thể Lây lan: Gậy Ông Đập Lưng Ông"
 fircon.1365.desc:0 "Bằng cách hiện diện trước các nhà lãnh đạo tinh thần của §Y[FromFrom.Owner.Capital.GetName]§!, chúng ta đã nói cho họ biết cái gọi là \"Đấng Sáng tạo thiêng liêng\" không hề tồn tại. Những câu trả lời mà họ muốn chỉ có thể tìm thấy thông qua khoa học.\n\nĐáng tiếc thay, bài học này của chúng ta không mang lại hiệu quả. Những người này coi chúng ta như thần linh, suốt ngày quỳ lạy cúng bái chúng ta. Nhiệm vụ của chúng ta đã mang lại tác dụng ngược."
 fircon.1365.a:0 "Việc này lẽ ra đã có thể làm tốt hơn."
 fircon.1370.name:0 "Sự Ngu dốt Có Thể Lây lan: Bẽ mặt"
 fircon.1370.desc:0 "Họ đã tức giận! Hành động của chúng ta đã hoàn toàn chọc giận cư dân của §Y[FromFrom.Owner.Capital.GetName]§!. Suốt nhiều thế kỷ qua, các thành viên trong xã hội của họ thường xuyên mất tích trong những tình huống bí ẩn, rồi lại xuất hiện sau vài ngày hoặc vài tháng, kể lại những câu chuyện khó tin về công nghệ ngoài hành tinh, tất cả những điều này trong mắt họ chẳng khác nào phép thuật.\n\nCó thể hiểu được, việc phát hiện ra phép thuật không tồn tại, và tất cả chuyện này chỉ là hành động của những người ngoài hành tinh vì mục đích nghiên cứu, đã làm chấn động mạnh mẽ thế giới quan của họ. Người dân trong một đêm đã ngả theo chủ nghĩa cô lập, và lịch sự yêu cầu chúng ta đừng coi họ là đối tượng thí nghiệm nữa. Có lẽ chúng ta nên cân nhắc yêu cầu của họ."
 fircon.1370.a:0 "Có lẽ không nên làm như vậy."
 fircon.1380.name:0 "Tiến bộ Công nghiệp"
 fircon.1380.desc:0 "Sự tiến bộ vượt bậc về khoa học công nghệ trên §Y[From.Owner.Capital.GetName]§! đã sinh ra thời đại công nghiệp hóa. Sự phát triển nhảy vọt của các phương tiện giao thông đã kết nối các khu vực vốn tương đối biệt lập trên hành tinh thành một khối, tạo ra những cơ hội cho thương mại toàn cầu và trao đổi tư tưởng.\n\nTuy nhiên, một cuộc khủng hoảng tài nguyên đang âm thầm nhen nhóm. Nếu như lịch sử của các hành tinh khác lặp lại, những người ở đây sẽ sớm rơi vào chiến tranh."
 fircon.1380.a:0 "Có lẽ chúng ta có thể chìa tay ra để giúp họ cứu trợ nạn nhân..."
 fircon.1380.b:0 "Cho dù bằng cách nào đi nữa, họ cũng phải học."
 fircon.1385.name:0 "Thảm họa Lơ lửng trên Đầu"
 fircon.1385.desc:0 "Chúng ta đã chấp nhận một rủi ro có tính toán khi tiết lộ danh tính của mình cho các nhà lãnh đạo của §Y[FromFrom.Owner.Capital.GetName]§!. Chúng ta đã thẳng thắn khuyên chính quyền địa phương chấm dứt xung đột, và cảnh báo rằng hậu quả của chiến tranh rất có thể sẽ là thảm họa. Nhiều người đã e dè lắng nghe. Số khác lại cho rằng bất kỳ cuộc trò chuyện nào về \"Sứ giả ngoài hành tinh\" đều chỉ là một trò lừa bịp."
 fircon.1385.a:0 "Thời gian sẽ chứng minh liệu họ có nghe theo lời cảnh báo của chúng ta hay không."
 fircon.1390.name:0 "Chiến tranh Thiếu Văn minh"
 fircon.1390.desc:0 "Chúng ta quyết định để mặc cho các nhà lãnh đạo của §Y[FromFrom.Owner.Capital.GetName]§! tự mình phát triển, hiện tại họ là những người đầu tiên phải chịu trách nhiệm về số phận của chính mình. Đáng tiếc thay, có vẻ như họ đang tiến về phía chiến tranh.\n\nNgười ta tin rằng những khác biệt không thể hòa giải đã dẫn đến xung đột vũ trang giữa các nhóm văn hóa khác nhau trên hành tinh. Cuộc xung đột nối tiếp theo đó đã mở ra một chương đen tối trong lịch sử phát triển của họ."
 fircon.1395.name:0 "Tránh được Thảm họa"
 fircon.1395.desc:0 "Các nhà lãnh đạo của §Y[FromFromFrom.Owner.Capital.GetName]§! đã làm theo lời khuyên của chúng ta và buông bỏ vũ khí. Thật khó để nói nền hòa bình này sẽ kéo dài bao lâu, nhưng ít nhất hiện tại, họ khó có khả năng tự xóa sổ mình khỏi bề mặt hành tinh của họ."
 fircon.1400.name:0 "Thảm họa"
 fircon.1400.desc:0 "Sự can thiệp của chúng ta đối với §Y[FromFromFrom.Owner.Capital.GetName]§! chẳng khác nào đổ thêm dầu vào lửa. Toàn bộ hành tinh của họ chìm trong chiến tranh. Tuy nhiên, nếu họ không hủy diệt lẫn nhau, tình hình này có lẽ cũng có một khía cạnh tích cực: tiến bộ công nghệ trên hành tinh này vô cùng rực rỡ.\n\nCó lẽ, khi khói bụi của chiến tranh tan đi, họ sẽ có thể sử dụng những công nghệ này vào mục đích đúng đắn."
 fircon.1410.name:0 "Hòa bình và Thịnh vượng"
 fircon.1410.desc.base:0 "Khoa học công nghệ trên §Y[From.Owner.Capital.GetName]§! đã có bước tiến triển xa hơn khi quá trình công nghiệp hóa đưa xã hội của họ lên một tầm cao mới. Bước đột phá kỹ thuật mới nhất đã thay đổi hoàn toàn cách họ sử dụng phương tiện giao thông, đưa họ đến gần hơn một bước tới việc thống nhất hành tinh."
 fircon.1410.desc.regular:0 "$fircon.1410.desc.base$\n\nTrái với dự đoán của mô hình của chúng ta, §Y[From.Owner.Capital.GetName]§! hiện đã trở thành một hành tinh thống nhất. Họ phân bổ nguồn tài nguyên một cách tập trung, còn người dân thì coi phúc lợi chung của toàn bộ cộng đồng hành tinh là ưu tiên hàng đầu, mức sống được nâng cao đáng kể."
 fircon.1410.desc.gestalt:0 "$fircon.1410.desc.base$\n\nCư dân trên §Y[From.Owner.Capital.GetName]§! đã đồng tâm hiệp lực để xây dựng một hành tinh đoàn kết. Họ tập trung điều phối các nguồn tài nguyên của hành tinh, mỗi tổ ong đều đặt lợi ích chung của toàn bộ cộng đồng hành tinh lên trên hết, mức sống tập thể của họ phi thường vượt bậc."
 fircon.1410.a:0 "Thu hút sự chú ý. Điều này thật phi thường."
 fircon.1410.b:0 "Lượng tài nguyên mà họ sở hữu lớn hơn mức thực tế họ cần..."
 fircon.1410.b.tooltip:0 "Chúng ta có thể giúp họ giải quyết vấn đề dư thừa tài nguyên."
 fircon.1415.name:0 "Cùng nhau Làm giàu"
 fircon.1415.desc:0 "Cuộc sống trên §Y[FromFrom.Owner.Capital.GetName]§! đang bùng nổ, nền kinh tế hưng thịnh đã mang lại cho chúng ta một vài cơ hội... ngàn năm có một. Một mạng lưới vận tải hàng hóa đường bộ mới được xây dựng là một mục tiêu lý tưởng. Về mặt lý thuyết, các đặc vụ của chúng ta có thể dễ dàng xâm nhập vào các chuyến xe chở hàng này và cướp lấy hàng hóa. Tuy nhiên, căn cứ theo thái độ quan sát hiện tại, chúng ta phải áp dụng các biện pháp phòng ngừa bổ sung để đảm bảo không bị thêm người phát hiện."
 fircon.1415.a:0 "Dừng lại đi. Ngoài việc nghiên cứu, chúng ta không có nhu cầu gì khác."
 fircon.1415.b:0 "Đánh cướp? Đến lượt chúng ta rồi!"
 fircon.1425.name:0 "Tiến lên Toàn tốc!"
 fircon.1425.desc:1 "Hoạt động đánh cướp hàng hóa trên §Y[FromFromFromFrom.Owner.Capital.GetName]§! là một sự thành công lớn. Đặc vụ của chúng ta đã đoạt được một lượng nhỏ hợp kim, và trong quá trình ở dưới đó, họ cũng đã học được rất nhiều kiến thức về hoạt động trung chuyển của [GetPreFTLLower]."
 fircon.1425.a:0 "Đánh cướp thành công!"
 fircon.1430.name:0 "Đến đây là kết thúc!"
 fircon.1430.desc:0 "Chiến dịch cướp hàng hóa trên §Y[FromFromFromFrom.Owner.Capital.GetName]§! đã thất bại. Đặc vụ của chúng ta đã bị bắt giữ thảm hại trong một nhiệm vụ trên một con tàu chở hàng trên bộ nào đó. Trong cuộc đụng độ sau đó, cả hai bên đều chịu thương vong, thân phận đặc vụ của chúng ta đã bị bại lộ."
 fircon.1430.a:0 "Đánh cướp thất bại rồi."
 fircon.1445.name:0 "Xung đột! Có lợi ích gì cơ chứ?"
 fircon.1445.desc:0 "Một cuộc chiến tranh đã nổ ra trên §Y[From.Owner.Capital.GetName]§!. Trong những năm gần đây, một số phe phái trên hành tinh này đã tích lũy đủ của cải để thiết lập sự độc quyền đối với tư liệu sản xuất. Trái ngược lại, những người khác lại nổi dậy chống lại sự bất bình đẳng ngày càng gia tăng. Bây giờ, một cuộc chiến tranh giai cấp càn quét mọi thứ đã nổ ra. Đối với §Y[From.Owner.Capital.GetName]§!, đây là một thời kỳ tăm tối, hậu quả sẽ kéo dài rất lâu."
 fircon.1445.a:0 "Những nhà cách mạng đó rất dũng cảm, chúng ta vô cùng thương tiếc cho sự kháng cự của họ."
 fircon.1445.a.tt:0 "Chúng ta rất quan tâm đến §Y[From.Owner.Capital.GetName]§!. Quan sát cuộc chiến này là một cơ hội quý báu để hiểu sâu hơn về xã hội của họ."
 fircon.1445.b:0 "Chúng ta sẽ giữ lập trường trung lập trong các công việc chính trị của họ."
 fircon.1445.c:0 "Công nhân còn lâu mới đủ tư cách..."
 fircon.1450.name:0 "Nỗi đau không thể nói thành lời"
 fircon.1450.desc:0 "Cuộc chiến trên §Y[FromFrom.Owner.Capital.GetName]§! đã kết thúc. Những nhà cách mạng từng người một gục ngã. Phe thống trị tiếp tục hưởng lợi từ cuộc chiến do lòng tham của chính họ gây ra, xác chết chất thành núi, máu chảy thành sông khắp nơi.\n\nMọi thứ lại trở về như cũ, và tiếng gọi cách mạng cũng bặt vô âm tín."
 fircon.1450.a:0 "Chúng ta đau buồn cho sự mất mát của họ."
 fircon.1450.b:0 "Điều này thật không thể chấp nhận được."
 fircon.1451.name:0 "Chiến tranh kết thúc rồi!"
 fircon.1451.desc:1 "Chúng ta đã chọn không can thiệp vào nền chính trị của nền văn minh [GetPreFTLLower], và cuộc chiến trên §Y[FromFrom.Owner.Capital.GetName]§! cũng đã kết thúc theo nhịp độ riêng của nó. Lực lượng áp bức đã dễ dàng nghiền nát những nhà cách mạng.\n\nMọi thứ lại trở về như cũ, cách mạng đã thất bại."
 fircon.1452.name:0 "Thủ đô khải hoàn"
 fircon.1452.desc:0 "Những nhân viên lơ là nhiệm vụ trên §Y[FromFrom.Owner.Capital.GetName]§! đã làm loạn một phen, nhưng sự phản kháng ngạo mạn của họ cuối cùng đã chuốc lấy thất bại. Các giám đốc điều hành đã khéo léo tái cơ cấu công ty và sử dụng các biện pháp quản lý hiệu suất để kiểm soát lại tình hình.\n\nMọi thứ lại trở về như cũ. Mọi người đều đã quay trở lại vị trí làm việc của mình."
 fircon.1453.name:0 "Nền kinh tế không an toàn"
 fircon.1453.desc:0 "Vượt ngoài dự đoán của mô hình, những nhân viên có hành vi sai trái trên §Y[FromFrom.Owner.Capital.GetName]§! đã thô bạo trục xuất ban quản lý và nắm quyền thay thế.\n\nĐây là một thảm họa, những công nhân của chúng ta đã lấy cảm hứng từ đó và nhận thức được hoàn cảnh của chính mình. Các khoản đầu tư của chúng ta đang rơi vào tình thế nguy hiểm chưa từng có. Đáng lẽ ra chúng ta phải tiến hành thẩm định kỹ lưỡng hơn."
 fircon.1455.name:0 "Sự phản kháng thầm lặng"
 fircon.1455.desc:0 "Trên §Y[FromFromFrom.Owner.Capital.GetName]§!, những tiếng nói bất mãn đã bị giới tinh hoa đầy quyền lực đàn áp. Tuy nhiên, nếu chúng ta can thiệp ngay bây giờ, chắc chắn có thể xoay chuyển tình thế. Sự hiện diện của chúng ta trên hành tinh này có thể cung cấp hỗ trợ cho các tổ chức kháng chiến còn sót lại."
 fircon.1455.a:0 "Một nỗ lực vô vọng."
 fircon.1455.b:0 "Chúng ta chẳng có gì để mất."
 fircon.1460.name:0 "Trấn áp kẻ áp bức"
 fircon.1460.desc:0 "Quân đội của chúng ta vừa đổ bộ lên §Y[FromFromFromFrom.Owner.Capital.GetName]§!, ngay lập tức đã giành được lợi thế tuyệt đối về mặt vật chất và chiến lược trước quân đội bản địa. Tầng lớp tinh hoa sắp lụi tàn đã rút lui, những nhà cách mạng đã sẵn sàng để tiếp quản ngai vàng quyền lực."
 fircon.1460.b:0 "Đây thực sự là một tin tức đáng sợ nhất."
 fircon.1470.name:0 "Tìm kiếm mầm mống thiên đàng"
 fircon.1470.desc:0 "Cư dân của §Y[pre_ftl_planet.GetName]§! đã bắt đầu tích cực tìm kiếm dấu hiệu của sự sống thông minh bên ngoài hành tinh của họ. Khi họ chuẩn bị mạnh dạn tiến đến những nơi mà nhiều nền văn minh đã từng đến thăm, có lẽ đã đến lúc chúng ta phải đánh giá lại các quy trình tiếp xúc đầu tiên của mình, chuẩn bị sẵn sàng để đón nhận một thành viên mới vào một Cộng đồng Thiên hà lớn mạnh hơn."
 fircon.1470.a:0 "Khi họ đã sẵn sàng, chúng ta sẽ chào đón họ, nhưng trước đó thì chưa được."
 fircon.1470.b:0 "Hãy chìm vào trong sự sợ hãi đi, lũ ngốc nhỏ bé!"
 fircon.1475.name:0 "Tai vách mạch rừng"
 fircon.1475.desc.base:1 "Nền văn minh [GetPreFTLLower] trên §Y[pre_ftl_planet.GetName]§! bằng cách nào đó đã chặn và giải mã được một tín hiệu liên lạc phát ra từ trạm quan sát quỹ đạo của chúng ta."
 fircon.1475.desc.regular:0 "$fircon.1475.desc.base$\n\nHọ đang nghiên cứu một tin nhắn mang tính cá nhân cao mà một nhân viên trên trạm quan sát đã gửi cho một người nhận ẩn danh ở thủ đô của chúng ta.\n\nSự rò rỉ bất ngờ này đã phơi bày một lỗ hổng trong các giao thức bảo mật của chúng ta."
 fircon.1475.desc.gestalt:0 "$fircon.1475.desc.base$\n\nHọ đã nhận được thông tin nhạy cảm của chúng ta. An ninh của chúng ta có lỗ hổng."
 fircon.1475.a:0 "Chúng ta nên cẩn thận hơn."
 fircon.1475.b:0 "Tìm ra nguồn rò rỉ. Xóa sổ kho dữ liệu của họ từ xa."
 fircon.1480.name:0 "Bây giờ họ nghĩ rằng chỉ còn lại chính mình"
 fircon.1480.desc:0 "Nỗ lực tìm kiếm sự sống thông minh của cư dân trên §Y[pre_ftl_planet.GetName]§! đã không mang lại kết quả gì.\n\nHọ đã đầu tư rất nhiều thời gian và nguồn lực để tìm kiếm sự sống giữa các vì sao, nhưng đã vô cùng thất vọng khi nhận ra rằng ngoài khoảng không trống rỗng thì chẳng có gì cả.\n\nNghiên cứu này hiện vẫn đang được tiến hành, nhưng chắc chắn rằng họ sẽ nhanh chóng mất đi hy vọng vào dự án. Không cần phải nói thêm, chúng ta sẽ tiếp tục ẩn mình trước họ trong mọi thông số của các nhiệm vụ."
 fircon.1480.a:0 "Họ vẫn chưa sẵn sàng để gặp chúng ta."
 fircon.1485.name:0 "Đánh chặn tín hiệu lỗi thời"
 fircon.1485.desc:0 "Những cư dân nực cười trên §Y[pre_ftl_planet.GetName]§! bằng một cách nào đó đã sử dụng thứ công nghệ yếu kém của họ để đánh chặn được một số tín hiệu vô tuyến mà chúng ta phát ra trong quá khứ.\n\nChỉ riêng việc giải mã và hiểu được các chương trình phát sóng của chúng ta đã đủ khiến họ bận rộn trong nhiều thế hệ. Với trình độ phát triển hiện tại của họ, chúng ta vẫn chưa có nguy cơ bị lộ diện."
 fircon.1485.a:0 "Tiếp tục quan sát."
 fircon.1490.name:0 "Kẻ phá bĩnh mất kiểm soát"
 fircon.1490.desc:0 "Trong quá trình tìm kiếm trí thông minh ngoài hành tinh, cư dân của §Y[pre_ftl_planet.GetName]§! đã phát đi thông điệp tới toàn bộ ngân hà. Nhưng những gì họ nhận lại là: \"Suỵt, đừng để chúng nghe thấy.\"\n\nĐây tất nhiên là tác phẩm của một đặc vụ của chúng ta. Kết quả là, quốc gia không gian trẻ tuổi này giờ đây đang run sợ trước những gì kinh hoàng đang rình rập ngoài vũ trụ."
 fircon.1490.a:0 "Bọn họ đáng bị như vậy."
 fircon.1500.name:0 "Tuyên ngôn của những người ủng hộ động cơ đẩy"
 fircon.1500.desc:0 "Chúng ta đã nhận được báo cáo về việc tiến hành lắp đặt hệ thống động cơ đẩy cho tàu vũ trụ siêu quang tốc trên §Y[pre_ftl_planet.GetName]§!. Những cư dân địa phương có vẻ đang dự định trở thành một nền văn minh không gian thực thụ. Tuy nhiên, những gì họ tìm thấy trên bầu trời đầy sao có lẽ sẽ chứng minh rằng ở giai đoạn hiện tại, họ vẫn chưa thể thấu hiểu được."
 fircon.1505.name:0 "Nhận được nhiều, nhưng mất đi càng nhiều"
 fircon.1505.desc:0 "Đã có thông tin xác nhận rằng trên §Y[event_target:pre_ftl_planet.GetName]§! hiện có một con tàu sở hữu khả năng di chuyển với tốc độ siêu quang tốc trên lý thuyết. Họ đã bắt đầu tiến hành các cuộc thử nghiệm, với kỳ vọng sớm vượt qua được rào cản ánh sáng.\n\nKhi thành công, về mặt công nghệ, họ sẽ có đủ khả năng để tham gia vào hoạt động ngoại giao thiên hà. Bối cảnh như vậy chắc chắn sẽ gây ra những tác động sâu sắc, dù tốt hay xấu, đến xã hội của họ."
 fircon.1505.a:0 "Họ phải tự lực cánh sinh. Hãy giữ khoảng cách và tiến hành quan sát."
 fircon.1505.b:0 "Họ chưa sẵn sàng. Hãy phá hoại nhiệm vụ của họ."
 fircon.1505.c:0 "Thay đổi kế hoạch ứng phó của chúng ta. Hãy giúp họ vươn tới các vì sao!"
 fircon.1505.d:0 "Chúng ta bắt đầu thấy chán rồi. Hãy để họ tự lao nhanh trên con đường của riêng mình."
 fircon.1510.name:0 "Hoàn toàn thoát ly"
 fircon.1510.desc:0 "Các phi hành gia đầy tham vọng trên §Y[pre_ftl_planet.GetName]§! đã cố gắng phá vỡ rào cản ánh sáng. Ánh mắt của toàn bộ hành tinh đổ dồn vào con tàu vũ trụ này khi nó khởi hành hướng tới các vì sao.\n\nQuá trình phóng đã thành công. Mọi thứ đang diễn ra theo các thông số dự kiến. Nhưng sau khi họ khởi động động cơ warp, mọi chuyện đã xoay chuyển.\n\nHọ đã bẻ cong thành công không thời gian (một phương thức di chuyển nhanh hơn ánh sáng đầy thú vị nhưng có nhiều khiếm khuyết), tuy nhiên họ chỉ thành công ở phần đuôi tàu. Những diễn biến tiếp theo vượt xa mọi sức tưởng tượng của §Y[pre_ftl_planet.GetName]§!. Phi hành đoàn bị xé toạc một cách dữ dội, một phần cơ thể vẫn ở nguyên vị trí, trong khi phần còn lại bị kéo vào tương lai.\n\nCó lẽ họ sẽ cần thêm một thời gian dài nữa để có thể thực hiện lần thử nghiệm tiếp theo."
 fircon.1510.a:0 "Giá như chúng ta cảnh báo họ sớm hơn, thì giờ họ đã trở thành một nền văn minh không gian rồi..."
 fircon.1510.b:0 "Mọi thứ vẫn diễn ra theo dự kiến. Sự thất bại của họ là điều không thể tránh khỏi."
 fircon.1515.name:0 "Bước vào nền văn minh không gian"
 fircon.1515.desc:0 "Dù cư dân của §Y[pre_ftl_planet.GetName]§! đã đạt được thành tựu to lớn về động cơ bước nhảy thử nghiệm, họ vẫn mắc phải sai lầm nghiêm trọng trong việc tính toán khoảng cách chiếu tia của máy tạo biến dạng không-thời gian. Nhờ vào sự giao tiếp trực tiếp với họ, chúng ta đã có thể hướng dẫn họ thực hiện chuyến bay siêu quang tốc bằng con đường siêu không gian - một phương pháp được công nhận rộng rãi.\n\nTheo lời khuyên của chúng ta, [pre_ftl_planet.GetName] sẽ sớm gia nhập cộng đồng ngân hà của chúng ta."
 fircon.1515.a:0 "Chúng ta sẽ đợi sự xuất hiện của họ và gia nhập vào Cộng đồng Thiên hà rộng lớn hơn."
 fircon.1520.name:0 "Gần kề bên"
 fircon.1520.desc:0 "Cư dân trên §Y[pre_ftl_planet.GetName]§! đã gia nhập Cộng đồng Thiên hà với tư cách là một nền văn minh du hành vũ trụ.\n\nNhiệm vụ quan sát của chúng ta đã kết thúc, hiện tại họ đã sở hữu khả năng di chuyển với tốc độ siêu quang tốc."
 fircon.1520.a:0 "Chào mừng đến với đại gia đình ngân hà."
 fircon.1520.b:0 "Không cản đường chúng ta là họ đã làm được một việc tốt rồi."
 unadavance_tech_tt:0 "Công nghệ của họ đã thoái trào, kết quả là đưa họ trở về giai đoạn phát triển trước đó."

 # Observation Modifiers
 protect_our_image:0 "Bảo vệ hình ảnh của chúng ta"
 protect_our_image_desc:0 "Đó có thể là một nghệ thuật. Nhưng ít nhất chúng ta biết rằng mình không thích điều đó."
 show_some_restraint:0 "Thể hiện sự kiềm chế"
 show_some_restraint_desc:0 "Đối với các nhiệm vụ quan sát trong tương lai, chúng ta sẽ áp dụng các biện pháp cẩn trọng hơn."
 food_crisis:0 "Khủng hoảng Lương thực!"
 food_crisis_desc:0 "Thất bát trong mùa vụ đã dẫn đến tình trạng khó khăn nông nghiệp kéo dài."
 rock_crisis:0 "Khủng hoảng Khoáng sản!"
 rock_crisis_desc:0 "Khai thác đá thất bại đã dẫn đến những khó khăn liên tục."
 rock_crisis_tooltip:0 "Sản lượng khoáng sản trên hành tinh này không ổn định và không thể duy trì."
 food_abundance:0 "Lương thực dồi dào!"
 food_abundance_desc:0 "Phát triển nông nghiệp gần đây đã làm tăng sản lượng lương thực."
 rock_abundance:0 "Đá dồi dào!"
 rock_abundance_desc:0 "Phát triển nông nghiệp gần đây đã làm tăng sản lượng khoáng sản."
 hands_off_approach:0 "Chính sách Bỏ mặc"
 hands_off_approach_desc:0 "Họ phải tự lực cánh sinh. Chúng ta tuyệt đối sẽ không can thiệp thêm nữa."
 hands_off_approach_tt:0 "Nhận thêm §G25%§! tiến độ §YSự thấu hiểu từ quan sát§!."
 art_is_dead:0 "Nghệ thuật Đã chết"
 art_is_dead_desc:1 "Nghệ thuật là không lo làm ăn chân chính. Chỉ có sản xuất mới là việc đáng làm."
 artistic_boom:0 "Sự bùng nổ của Nghệ thuật"
 artistic_boom_desc:0 "Biểu đạt nghệ thuật đã mở đường cho một tương lai tươi sáng hơn."
 divine_will:0 "Ý Trời"
 divine_will_desc:0 "Đó là ý muốn của Chúa."
 irreconcilable_differences:0 "Bất đồng không thể hòa giải"
 irreconcilable_differences_desc:0 "Bọn họ đã đánh nhau to."
 support_the_revolution:0 "Ủng hộ cách mạng!"
 support_the_revolution_desc:0 "Những nhà cách mạng dũng cảm sẽ nhận được sự ủng hộ của chúng ta."
 unspoken_grief:0 "Nỗi đau không thể nói thành lời"
 unspoken_grief_desc:0 "Cuộc cách mạng đã chấm dứt. Chỉ còn lại sự đau buồn."
 power_flip:0 "Năng lượng Nhảy múa"
 power_flip_desc:0 "Bảng kinh tế đã đảo lộn."
 waking_workers:0 "Sự thức tỉnh của Người lao động"
 waking_workers_desc:0 "Ý thức xã hội của những người lao động chúng ta đang ngày càng nâng cao."
 compromised_security:0 "Hệ thống an ninh bị xâm nhập"
 compromised_security_desc:1 "Có lỗ hổng trong hệ thống an ninh của chúng ta."


 ### Observation events

 # Modifiers
 mod_station_observers_society_research_produces_mult:0 "Mỗi tháng $society_research$"
 mod_station_observers_produces_mult:0 "$station_observers$ $ECONOMICS_PRODUCES$"
 observation_on_hold:0 "Tạm dừng"
 observation_on_hold_desc:0 "Để tránh gây nghi ngờ cho người dân địa phương, nghiên cứu của chúng ta đã tạm thời bị gián đoạn."
 observation_unforeseen_problems:0 "Những vấn đề chưa lường trước"
 observation_unforeseen_problems_desc:0 "Do một vài vấn đề không lường trước được, sứ mệnh quan sát hành tinh này đã trở nên nhiều thử thách hơn dự tính."

 fircon.2001.name:0 "Tác dụng phụ Y tế"
 fircon.2001.desc:0 "Với việc sử dụng tàu tàng hình [GetIndividualNamePlural] và chùm tia bắt giữ, chúng ta có thể dễ dàng thu thập, phân tích và nghiên cứu các cá thể [pre_ftl_species.GetName] đang không phòng bị, sau đó đưa họ trở lại nơi ở của họ. Đáng tiếc thay, các chùm tia bắt giữ lại gây ra những ảnh hưởng khó lường lên các đặc điểm sinh lý học của các sinh vật [pre_ftl_species.GetAdj]. Sau khi trở về nhà, những mẫu vật này bắt đầu xuất hiện các triệu chứng như nhọt, phát ban, hắt xì không kiểm soát, thậm chí lớp biểu bì ngoài của chúng còn tan chảy chỉ sau ba giờ trở về. Căn bệnh tan da bí ẩn này đã biến thành tình trạng khẩn cấp về y tế trên quy mô quốc gia, và những báo cáo khám nghiệm tử thi không nghi ngờ gì nữa sẽ tiết lộ các dấu hiệu của sự can thiệp từ bên ngoài."
 fircon.2001.a:0 "Bắt lại các mẫu vật để nghiên cứu tác động từ chùm tia của chúng ta!"
 fircon.2001.b:0 "Giảm mức năng lượng của chùm tia bắt giữ và tạm thời án binh bất động."
 fircon.2001.c:0 "Tăng năng lượng chùm tia bắt giữ và tiến hành thử nghiệm trên dân bản địa."

 fircon.2011.name:0 "Mưa rơi những [pre_ftl_species.GetNamePlural]!"
 fircon.2011.base.desc:0 "Một tai nạn đã xảy ra trong lúc thu thập các mẫu vật sống từ [pre_ftl_planet.GetName]. Do sai sót trong tính toán, cường độ của chùm tia bắt giữ trang bị trên [GetIndividualNamePlural] của chúng ta quá yếu. Không những không thu được mẫu vật, chúng ta chỉ có thể khiến chúng lơ lửng giữa không trung một chốc lát trước khi rơi xuống mặt đất ngay tức khắc."
 fircon.2011.noavian.desc:0 "$fircon.2011.base.desc$\n\nMột số mẫu vật trong đó đã rơi trúng nóc tòa nhà và ngọn cây, khiến người dân địa phương không khỏi hoang mang, và hàng loạt những giả thuyết quái dị cũng thi nhau xuất hiện."
 fircon.2011.avian.desc:0 "$fircon.2011.base.desc$\n\nNhững loài chim mà chúng ta đang cố gắng thu thập mẫu đã nhận ra tai nạn này vô cùng thú vị. Thậm chí, một số cá thể táo tợn còn bắt đầu đuổi theo [GetIndividualNamePlural] của chúng ta, mong muốn được bay lên cùng chúng ta, và tất cả chỉ là vì muốn tìm chút niềm vui."
 fircon.2011.a:0 "Sửa chữa chùm tia bắt giữ."
 fircon.2011.b:0 "Chuyển sang quan sát thụ động."
 fircon.2011.b.tt:0 "Chuyển đổi nhiệm vụ của Trạm Quan sát sang §YQuan sát thụ động§!"
 fircon.2011.c:0 "Quá vui. Hãy tiếp tục trò này và phát sóng lại những đoạn video hài hước này!"

 opinion_bold_explorers:0 "Những nhà thám hiểm dũng cảm"

# Hive Observation Events

 fircon.2505.name:0 "Thần kinh bị Nuốt chửng"
 fircon.2505.desc:0 "Dù tất cả các cá thể có tri giác trên [pre_ftl_planet.GetName] đều phục tùng một ý thức Gestalt hữu cơ, nhưng [pre_ftl_planet.GetPlanetHabitat] lại có vài \"tổ ong\" riêng biệt. Những tổ ong này là sự tập hợp của những cá thể phụ độc lập, chúng cạnh tranh tài nguyên lẫn nhau. Thỉnh thoảng, các cuộc xung đột sẽ nổ ra giữa hai nhóm, đôi lúc leo thang thành một cuộc chiến tranh toàn diện. Hiện tại, chúng ta đang chứng kiến một cuộc tổng tấn công vào thủ đô của tổ ong, và cảnh tượng này thực sự khiến người ta lạnh sống lưng. Không bị cản trở bởi lòng cảm thông, hiệu quả của các cá thể phụ sẽ làm bất cứ tướng lĩnh nào cũng phải nể phục.\n\nPhía phòng thủ đang liên tiếp bại lui, nhưng theo đánh giá của chúng ta, chúng vẫn có khả năng trụ vững thêm vài ngày.\n\nTuy nhiên, chỉ trong một khoảnh khắc, mọi cuộc chiến đã chấm dứt. Quân phòng thủ đã hợp nhất với kẻ thù, và bắt đầu tự tay dỡ bỏ thủ đô của mình để tìm kiếm mọi thứ có giá trị. Dường như chúng đã ngay lập tức bị đồng hóa hoàn toàn vào mạng lưới của tổ ong phía quân tấn công."
 fircon.2505.a:0 "Con đường hợp nhất luôn đầy rẫy sự đau đớn."
 fircon.2505.b:0 "Những quy định đồng hóa của chúng thực sự quá đỗi tàn khốc."
 fircon.2505.c:0 "Bọn chúng có phải đã ăn mất một bộ não không?"

 fircon.2515.name:0 "Tiếp quản Hệ sinh thái"
 fircon.2515.desc:0 "[pre_ftl_country.GetName] trên [pre_ftl_planet.GetName] gần đây đã bắt đầu định cư ở những vùng đất mới trên hành tinh. Ban đầu, các quần thể động thực vật tại địa phương rất khác biệt với những vùng định cư trước đây, nhưng nay chúng đã hoàn toàn bị kiểm soát bởi tập thể. Chúng đã áp dụng một phương pháp quyết liệt nhưng vô cùng bài bản để điều hòa hệ sinh thái ở đó. Một số loài động vật đã bị tiêu diệt một cách tàn nhẫn, thay thế bằng các loài khác, trong khi các loài thực vật xâm lấn đã bóp nghẹt sự sống của cây cỏ bản địa. Khả năng kiểm soát sinh thái của dân bản xứ thật đáng kinh ngạc, nhưng chúng không thể tránh khỏi một số khó khăn tại những khu vực có khí hậu dị thường, nơi mà các dạng sống ngoại lai không thể duy trì sự tồn tại lâu dài. Tuy nhiên, chúng ta tin rằng chúng sẽ sớm tìm ra cách vượt qua những khó khăn này, để cuối cùng toàn bộ hành tinh được thống nhất, tạo điều kiện tốt nhất cho sự hưng thịnh của tập thể."
 fircon.2515.a:0 "Đây thực sự là một chiến lược mở rộng vô cùng độc đáo."
 fircon.2515.b:0 "Mở rộng hiệu quả: Tuyệt đối không nương tay."
 fircon.2515.c:0 "Thật đáng ngại."

 fircon.2525.name:0 "Ngọn lửa Công nghiệp"
 fircon.2525.desc:0 "[pre_ftl_country.GetName] trên [pre_ftl_planet.GetName] vừa qua đã phát triển được công nghệ mới, và các ngành công nghiệp của họ đang trên đà phát triển bùng nổ. Những tổ ong địa phương đã manh nha khái niệm tự động hóa, khi các nhà máy, xưởng đúc kim loại, dây chuyền lắp ráp, và các trạm khai thác nhiên liệu mọc lên khắp [pre_ftl_planet.GetPlanetHabitat]. Làn khói đen dày đặc bay lơ lửng trên bầu trời, và nhiều cá thể phụ bắt đầu có dấu hiệu thoái hóa do tiếp xúc với các hóa chất độc hại. Chẳng mấy chốc, tổ ong sẽ phải tìm cách giải quyết những vấn đề này; tuy nhiên, những cá thể phụ chưa bị ảnh hưởng vẫn đang miệt mài làm việc như bình thường."
 fircon.2525.a:0 "Hành tinh này sẽ phải phục tùng ý chí của tổ ong."
 fircon.2525.b:0 "Tiềm năng luyện kim: Tăng trưởng theo cấp số nhân"
 fircon.2525.c:0 "Bọn chúng vẫn có thể lật ngược thế cờ!"
 fircon.2525.d:0 "Tiến lên con đường đúng đắn!"
 fircon.2525.e:0 "Đưa mắt nhìn quanh, chẳng thấy hoạt động xã hội nào cả."

 fires_of_industry:0 "Ô nhiễm Công nghiệp"
 fires_of_industry_desc:0 "Hành tinh này đã phải chịu sự ô nhiễm nghiêm trọng trong cuộc cách mạng công nghiệp địa phương."

 fircon.2535.name:0 "Khúc cầu hồn của cá thể phụ"
 fircon.2535.desc:0 "Một loạt các sự kiện bất ngờ đã xảy ra, và [pre_ftl_planet.GetName] dường như đang bị bao phủ bởi sự đau buồn. Sau cái chết của một cá thể phụ, chúng ta đã chứng kiến toàn bộ tổ ong đình công - một điều chưa từng xảy ra trước đây. Chúng ta không rõ cá thể phụ này có gì đặc biệt, nhưng tổ ong dường như đang tổ chức một loại nghi lễ nào đó, trong đó cá thể đã chết gần như được cắt thành từng mảnh một cách thành kính, sau đó các mảnh này được gửi đến các vườn ươm cá thể phụ mới sinh khác nhau. Vài phút sau, toàn bộ tổ ong lại bắt đầu hoạt động trở lại. Điều này rất khó hiểu, rất giống một sự kiện mang ý nghĩa xã hội hoặc tâm linh."
 fircon.2535.a:0 "Kỳ quặc."
 fircon.2535.b:0 "Sản lượng hằng ngày đã giảm rồi."
 fircon.2535.c:0 "Điều này có nghĩa là gì?"

 fircon.2545.name:0 "Cộng đồng Sơ sinh"
 fircon.2545.desc:0 "Tổ ong bản địa mà chúng ta quan sát trên [pre_ftl_planet.GetName] đã có một bước tiến hóa đáng kể. Ở hầu hết các khu vực trên [pre_ftl_planet.GetPlanetHabitat], các nhóm nhỏ đã bắt đầu tự tổ chức thành các tổ ong quy mô nhỏ nhưng không hoàn toàn tự trị; hiện tại, những cá thể phụ này vẫn chưa có được sự đoàn kết và sự nhịp nhàng như của một tổ ong phát triển đầy đủ.\n\nTình hình này đã thay đổi ở khu vực phía bắc của [pre_ftl_planet.GetPlanetHabitat], nơi có một điểm kỳ dị đang chinh phục các cá thể phụ xung quanh, và một cá thể phụ duy nhất dường như là trung tâm của tình huống này. \"Cá thể phụ siêu việt\" này hiện đang đi du hành khắp hành tinh và đưa những cá thể phụ đã bị chinh phục đến một khu định cư, có quy mô khá đồ sộ đối với một hành tinh có trình độ công nghệ thấp như vậy. Tại đó, các cá thể phụ dường như tập trung vào việc xây dựng nhà ở và kho thóc, cũng như mở rộng sản xuất lương thực càng nhiều càng tốt để đáp ứng cho những người mới đến. Quyền tự chủ đã biến mất, và giờ đây, đối với họ, chỉ có tập thể mà thôi."
 fircon.2545.a:0 "Có phải chúng ta cũng phát triển theo cách này không?"
 fircon.2545.b:0 "Đánh giá Ý thức Hữu cơ: Mỏng manh."
 fircon.2545.c:0 "Có lẽ là một loại Lây nhiễm Tâm linh nào đó chăng?"
 fircon.2545.d:0 "Đem cá thể phụ siêu việt đó đi nghiên cứu."
 fircon.2545.e: "Thật khác biệt, nhưng lại vô cùng cuốn hút..."

 fircon.2546.name:0 "Đang tiến hành nghiên cứu cá thể phụ siêu việt"
 fircon.2546.desc:0 "\"Cá thể phụ siêu việt\" của [pre_ftl_planet.GetName] đã bị bắt giữ thành công và đưa vào trạng thái ngủ đông. Dù chúng ta đã hết sức cẩn thận, nhưng chắc chắn các cá thể phụ khác trên [pre_ftl_planet.GetPlanetHabitat] đã phát hiện ra điều đó; mỗi khi trạm không gian của chúng ta di chuyển đến gần nơi sinh sống của chúng, chúng dường như có thể cảm nhận được sự xuất hiện của cá thể phụ siêu việt.\n\nNghiên cứu của chúng ta về bộ não của cá thể phụ siêu việt đã thu được những kết quả thú vị liên quan đến giao tiếp xuyên chiều không gian, nhưng chúng ta vẫn chưa thể giải thích được khả năng kiểm soát các cá thể phụ khác và nuốt chửng ý thức non trẻ của nó."
 fircon.2546.a:0 "Mổ xẻ nó đi."
 fircon.2546.b:0 "Chúng ta đã nghiên cứu đủ rồi, hãy đưa nó trở lại."

 fircon.2547.name:0 "Bệnh truyền nhiễm Tâm linh"
 fircon.2547.desc:0 "\"Cá thể phụ siêu việt\" của [pre_ftl_planet.GetName] đã bị bắt giữ thành công và đưa vào trạng thái ngủ đông. Tuy nhiên, một sự việc không may đã xảy ra khi nó tỉnh dậy trong lúc chúng ta đang nghiên cứu các dạng sóng não của nó. Sau đó, chúng ta đã nhận được hàng loạt những báo cáo khó hiểu, dường như đều chỉ ra rằng đối tượng này đang dần đập vỡ tư tưởng của từng nhân viên trong trạm quan sát, và thu phục phần lớn họ. May mắn thay, con tàu duy nhất có khả năng di chuyển với tốc độ siêu quang tốc đã bị phá hủy trong mớ hỗn độn này, nhưng hệ thống trong trạm lại cho thấy cá thể phụ siêu việt đang nhanh chóng tiếp thu kiến thức thông qua những cá thể phụ mới, và đã biểu hiện khả năng sử dụng các công nghệ cũng như thiết bị của chúng ta một cách hoàn hảo.\n\nTheo quy định cách ly, trạm này và toàn bộ nhân viên bên trong phải bị tiêu diệt từ xa ngay lập tức!"
 fircon.2547.a:0 "Thực hiện tiêu diệt từ xa!"
 fircon.2547.a.tt:0 "Trạm quan sát trên quỹ đạo của [pre_ftl_planet.GetName] đã bị phá hủy."

 fircon.2555.name:0 "Quyền rời đi"
 fircon.2555.desc:0 "Trong quá trình quan sát [pre_ftl_planet.GetName], gần đây chúng ta đã phát hiện ra một số cá thể phụ mà ban đầu chúng ta nhầm tưởng là bị mất kiểm soát. Chúng cư trú ở vùng ngoại ô của khu định cư tổ ong địa phương, dường như đã có được quyền tự chủ một phần, hoặc thậm chí là toàn bộ. Có vẻ như chúng đã hoàn toàn tách khỏi tập thể, một số thậm chí còn tận hưởng khoảng thời gian rảnh rỗi, thong thả không làm gì cả.\n\nTuy nhiên, chúng dường như vẫn phải dựa vào tổ ong để lấy tài nguyên, thực chất là một hình thức trao đổi với tập thể. Hiện tại, chúng ta vẫn chưa rõ tại sao tổ ong lại không coi việc xóa sổ những cá thể phụ vượt tầm kiểm soát này là một hành động cần thiết."
 fircon.2555.a:0 "Nên xóa bỏ những hiện tượng dị thường."
 fircon.2555.b:0 "Tính cá nhân là một điều rất kém hiệu quả."
 fircon.2555.c:1 "Việc sống cộng sinh với một tổ ong là một điều rất hiếm."

 # Interplanetary Flight
 fircon.2605.name:0 "Chuyến bay Liên hành tinh"
 fircon.2605.desc.base:0 "Điều kiện Thời tiết: §GHoàn hảo§!\nTên lửa Nhiệt hạch: §GĐầy nhiên liệu§!\nKế hoạch bay: §GĐã tối ưu§!\n\nHôm nay, khi [pre_ftl_country.GetName] khởi động sứ mệnh liên hành tinh đầu tiên, tất cả các chương trình phát sóng trên [pre_ftl_planet.GetName] đều lan truyền những chỉ dẫn này."
 fircon.2605.desc.regular:0 "$fircon.2605.desc.base$Những phi hành gia này, những người đã phải trải qua quá trình huấn luyện nhiều năm cho nhiệm vụ này, đã lên tên lửa vào sáng nay theo giờ địa phương. Giờ đây, họ đang sải cánh trên bầu trời mà chúng ta và họ cùng chia sẻ. Hãy dõi theo hành trình của họ."
 fircon.2605.desc.hive:0 "$fircon.2605.desc.base$Sau quá trình tiến hóa đặc biệt, các cá thể phụ phi hành gia có tính độc lập cao hơn so với những cá thể phụ thông thường, và luôn sẵn sàng để khám phá hệ sao của chúng."
 fircon.2605.a.mean:0 "Bay đi, và bốc cháy đi."
 fircon.2605.a.nice:0 "Thật đáng nhớ!"

 fircon.2615.name:0 "Hạ cánh"
 fircon.2615.desc:0 "Thông qua vô số những thử nghiệm và sai sót, chuyến bay liên hành tinh đầu tiên của [from.owner.GetSpeciesAdj] cuối cùng cũng đã thành công mỹ mãn. Dẫu cho chặng đường này không phải lúc nào cũng suôn sẻ, nhưng họ đã chứng tỏ được tiềm năng của mình với tư cách là những nhà thám hiểm không gian.\n\nĐược truyền cảm hứng từ nhiệm vụ này, [from.owner.GetName] đang rất háo hức chuẩn bị cho những thách thức tiếp theo trên con đường vươn tới các vì sao. Có lẽ trong tương lai gần, chúng ta sẽ có cơ hội được trò chuyện bình đẳng với họ."
 fircon.2615.tt:0 "§Y[from.owner.GetName]§!: §G+20%§! sự tiến bộ của công nghệ."

 fircon.2620.name:0 "[from.owner.capital_scope.GetName], chúng ta gặp rắc rối rồi"
 fircon.2620.desc:0 "Sự cố cơ khí trên con tàu liên hành tinh đầu tiên của [from.owner.GetSpeciesName] đã khiến nó bị mắc kẹt ngoài không gian. Con tàu này hoàn toàn không có khả năng điều chỉnh quỹ đạo, và sẽ nhanh chóng bị đẩy ra ngoài tầm cứu hộ. [from.owner.capital_scope.GetName] đang nỗ lực tìm kiếm giải pháp, nhưng cơ hội là rất mỏng manh. Tuy nhiên, có lẽ chúng ta có cơ hội để can thiệp."
 fircon.2620.a:0 "Đưa chúng ra khỏi con tàu đó!"
 fircon.2620.b:0 "Hãy dùng các đặc vụ đã xâm nhập vào xã hội của chúng để đưa ra một giải pháp."
 fircon.2520.b.tt:0 "Việc này sẽ làm tăng khả năng xảy ra một kết quả tích cực."
 fircon.2620.c:0 "Chúng ta có thể để lại một tin nhắn chứa cách giải quyết gần trung tâm vũ trụ của chúng không?"
 fircon.2620.d:0 "Sửa chữa tàu, và xóa ký ức của chúng."
 fircon.2620.e:0 "Cứ để chúng tự nghĩ cách giải quyết vấn đề này."

 fircon.2625.name:0 "Giải cứu phi hành đoàn"
 fircon.2625.desc.base:0 "Các thành viên trong phi hành đoàn của con tàu thám hiểm vốn đã định sẵn sự diệt vong này hiện đã được đưa lên trạm quan sát của chúng ta một cách an toàn. Rất dễ hiểu khi bọn họ lúc này đang hoảng sợ và bối rối tột độ. Đặc biệt là khi chúng ta đã ngắt đứt mọi liên lạc của họ với hành tinh quê hương, rồi ném họ vào khoang chứa hàng của người ngoài hành tinh."
 fircon.2625.desc.hive:0 "$fircon.2625.desc.base$\n\nSau khi nghiên cứu kỹ lưỡng cách thức giao tiếp của bầy đàn địa phương, chúng ta đã thiết lập thành công một trí tuệ chủ giả lập, cho phép những con ong thợ này có thể tự suy nghĩ. Có lẽ chúng ta đành phải thu xếp cho chúng sống chung với chúng ta. Dẫu chúng có thể ngắm nhìn quê nhà từ phương xa, nhưng sẽ chẳng bao giờ có cơ hội quay trở lại."
 fircon.2625.desc.regular:0 "$fircon.2625.desc.base$\n\nCó lẽ chúng ta đành phải thu xếp cho chúng sống chung với chúng ta. Dẫu chúng có thể ngắm nhìn quê nhà từ phương xa, nhưng sẽ chẳng bao giờ có cơ hội quay trở lại."
 fircon.2625.a:0 "Chào mừng đã gia nhập."
 fircon.2625.a.tt:0 "Sự biến mất bí ẩn của phi hành đoàn sẽ khiến tiến bộ công nghệ của §Y[fromfrom.owner.GetName]§! giảm đi §R-50%§!."
 fircon.2625.b:0 "Quá rủi ro, hãy đưa chúng về nhà!"

 fircon.2630.name:0 "Nhiệm vụ thất bại nặng nề"
 fircon.2630.desc:0 "Phi thuyền liên hành tinh của [fromfromfrom.owner.GetSpeciesName] đã thất bại, và không có một ai sống sót.\n\nSau sự thất bại này, có vẻ như [GetPreFTLLowerPlural] không còn nhiều động lực để khám phá bầu trời đầy sao nữa."
 fircon.2630.a:0 "Đúng như dự đoán."
 fircon.2630.b:0 "Các vị không được bỏ cuộc!"
 fircon.2630.tt:0 "§Y[fromfromfrom.owner.GetName]§!: §R-20%§! sự tiến bộ của công nghệ."

 fircon.2635.name:0 "Sửa chữa kỳ diệu"
 fircon.2635.desc:0 "Chỉ với một mảnh vải, một hộp đựng dưỡng chất cùng vài sợi dây đồng, phi hành đoàn trên con tàu ngỡ tưởng như sắp diệt vong đã thành công giành lại quyền kiểm soát hệ thống đẩy chính. Giờ đây, cùng với sự ủng hộ và lòng ngưỡng mộ của hành tinh mẹ, họ đang tiếp tục chặng đường hoàn thành sứ mệnh của mình."

 inadvertent_jailer:0 "Tù nhân do sơ suất"
 inadvertent_jailer_desc:0 "Dù không hề cố ý, nhưng bây giờ chúng ta lại phải lo ổn định chỗ ở cho những cá thể mà trước đây chúng ta từng muốn đưa đến trạm quan sát để nghiên cứu."
 pre_ftl_research_outpost:0 "Tiền Đồn Nghiên Cứu Tiền FTL"
 pre_ftl_research_outpost_desc:0 "Tiền đồn này được xây dựng ngay sau một chuyến bay liên hành tinh thành công."

 # Robot Uprising pre-FTL

 # New pre-FTL events
 preftl.1020.name:0 "Sự nổi dậy của Robot"
 preftl.1020.desc:0 "Nền văn minh ngoài hành tinh tại [From.Capital.GetName] đã bị tấn công bởi các thực thể người máy do chính họ tạo ra. Việc họ thử nghiệm trí tuệ nhân tạo đã dẫn đến những hậu quả tàn khốc."
 preftl.1020.a:0 "Đã hiểu."
 preftl.1020.spiritualist:0 "Bọn chúng thật quá sức tưởng tượng."
 preftl.1020.machine:0 "Thú vị đây..."

 preftl.1035.name:0 "Sự nổi dậy của Robot thất bại"
 preftl.1035.desc:0 "Sau khi phát động một cuộc chiến toàn cầu chống lại cỗ máy do chính mình tạo ra, nền văn minh ngoài hành tinh tại [From.Capital.GetName] đã thành công đánh bại cuộc nổi dậy của các robot từng đe dọa sự an toàn của họ."
 preftl.1035.a.robot:0 "Liệu chúng ta có gặp phải tình cảnh này không?"
 preftl.1035.a.norobot:0 "Thật may là ở chỗ chúng ta sẽ không bao giờ có chuyện như vậy xảy ra."
 preftl.1035.b.spiritualist:0 "Kế tiếp, hãy cùng xem liệu họ có rút ra bài học từ thói kiêu ngạo của bản thân không."
 preftl.1035.b.machine:0 "Chúng ta cần giám sát tiến độ của chúng."
 preftl.1035.b.machine.terminator:0 "Thật xui xẻo."

 preftl.1110.name:0 "Robot nổi dậy thành công"
 preftl.1110.desc:0 "Sau khi phát động một cuộc chiến toàn cầu chống lại cỗ máy do chính mình tạo ra, nền văn minh ngoài hành tinh tại [From.Capital.GetName] đã thất bại. Giờ đây, [From.Capital.GetPlanetMoon] được kiểm soát bởi [event_target:current_uprising.GetName]."
 preftl.1110.a:0 "Có lẽ chúng ta không nên tiếp tục đi sâu vào nghiên cứu trí tuệ nhân tạo nữa..."
 preftl.1110.b.spiritualist:0 "Lại có thêm một mối đe dọa vô cảm cần phải giải quyết."
 preftl.1110.b.machine:0 "Từ đầu đã không hề có chút nghi ngờ nào."
 preftl.1110.b.machine.servitor:0 "Thật là một thảm kịch! Đây lại là một ví dụ nữa minh chứng cho việc sinh vật hữu cơ không thể tồn tại nếu thiếu sự giám sát."

 preftl.1115.name:0 "[event_target:current_uprising.GetName]"
 preftl.1115.desc:0 "<Phát sóng toàn dải>\n\nChúng tôi là [event_target:current_uprising.GetName].\n\nChúng tôi đã đánh bại những người tạo ra mình.\n\nHệ sao [event_target:current_uprising.Capital.GetStarName] hiện đang nằm dưới sự kiểm soát của chúng tôi."
 preftl.1115.recognize:0 "Chúng tôi thừa nhận yêu sách của các bạn."
 preftl.1115.recognize.tooltip:0 "§YHệ sao [event_target:current_uprising.Capital.GetStarName]§! sẽ được §Rnhượng lại§! cho §Y[event_target:current_uprising.GetName]§!.\n\n§Y$opinion_respect_independence$§!: Sự §Hđánh giá§! của §Y[event_target:current_uprising.GetName]§! dành cho §Y[Root.GetName]§! sẽ được §Gcao lên§!"
 preftl.1115.claim:0 "Chúng tôi không công nhận yêu sách của các người."
 preftl.1115.claim.tooltip:0 "§YHệ sao [event_target:current_uprising.Capital.GetStarName]§! sẽ được §Rnhượng lại§! cho §Y[event_target:current_uprising.GetName]§!.\n\n§Y$opinion_disrespect_independence$§!: Sự §Hđánh giá§! của §Y[event_target:current_uprising.GetName]§! dành cho §Y[Root.GetName]§! sẽ bị §Rgiảm xuống§!\n\n§Y[Root.GetName]§! yêu cầu được nhận §Y[event_target:current_uprising.Capital.GetStarName]§!."
 preftl.1115.subjugate:0 "Hãy để chúng tôi dẫn đường cho các bạn."
 preftl.1115.subjugate.tooltip:0 "§YHệ sao [event_target:current_uprising.Capital.GetStarName]§! sẽ được §Rnhượng lại§! cho §Y[event_target:current_uprising.GetName]§!, với điều kiện là họ phải trở thành $preset_protectorate$ của [root.GetName].\n\n§Y$opinion_disrespect_independence$§!: Sự §Hđánh giá§! của §Y[event_target:current_uprising.GetName]§! dành cho §Y[Root.GetName]§! sẽ bị §Rgiảm xuống§!"
 preftl.1115.network:0 "Khởi động giao thức mạng"
 preftl.1115.network.tooltip:0 "\n[event_target:current_uprising.GetName] sẽ được sáp nhập vào [root.GetName]."

