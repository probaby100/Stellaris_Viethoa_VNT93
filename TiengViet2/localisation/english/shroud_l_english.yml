 approach_situation_breach_shroud_endbringers_forsake_flesh: "Vứt bỏ thể xác"
 approach_situation_breach_shroud_endbringers_forsake_flesh_desc: "Sự giới hạn của thể xác đang bóp nghẹt con đường biến đổi của chúng ta."
