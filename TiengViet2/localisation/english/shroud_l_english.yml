 shroud.4950.title: "Hào quang Hiểm ác"
 shroud.4950.desc.1: "Dữ liệu cho thấy hào quang này có những tác động tiêu cực cực lớn. Nếu không được xử lý, nó sẽ nhanh chóng lây lan ra toàn thiên hà."
 shroud.4950.desc.2: "Chúng ta phát hiện một $PSIONIC_AURA$ cực mạnh trong hệ sao §H[from.GetName]§!"
 shroud.4950.desc.3.intro: "$shroud.4950.desc.2$ Các [GetTelepathPlural] báo cáo rằng luồng bức xạ năng lượng này từ §HCõi Màn Che§! là do"
 shroud.4950.desc.3.default: "$shroud.4950.desc.3.intro$ hoạt động tâm linh của một nền văn minh ngoài hành tinh gây ra."
 shroud.4950.desc.3.contact: "$shroud.4950.desc.3.intro$ hoạt động tâm linh của §H[fromfrom.GetName]§! gây ra."
 shroud.4950.desc.4: "$shroud.4190.desc.intro$ Thứ được gọi là §H'$PSIONIC_AURA$'§! này, đặt tên theo nguồn gốc lý thuyết của nó, nay đã được tìm thấy tại hệ sao §H[from.GetName]§!."
 shroud.4950.desc.5.intro: "$shroud.4950.desc.2$, nguồn gốc của nó có thể được truy xuất tới"
 shroud.4950.desc.5.default: "$shroud.4950.desc.5.intro$ lãnh thổ của một nền văn minh ngoài hành tinh."
 shroud.4950.desc.5.contact: "$shroud.4950.desc.5.intro$ lãnh thổ của §H[fromfrom.GetName]§!."
 shroud.4950.a: "$grand_archive.1100.a$"

 shroud.4955.title: "Viễn cảnh Khiếp sợ"
 shroud.4955.desc.1: "Một dự cảm về thảm họa sắp chực chờ dâng lên trong lòng người dân chúng ta."
 shroud.4955.desc.1.gestalt: "$shroud.4955.desc.1$ Các [GetTelepathPlural] của chúng ta phát hiện một nhiễu loạn song song trong dòng năng lượng của §HCõi Màn Che§!."
 shroud.4955.desc.1.non_gestalt: "$shroud.4955.desc.1$ Các [GetTelepathPlural] báo cáo rằng ngay cả §HCõi Màn Che§! cũng đang ngập tràn một sự bất an kỳ lạ, như thể sức mạnh của nó đang run rẩy trong nỗi sợ hãi tĩnh lặng."
 shroud.4955.desc.2.intro: "Những chuyện đáng sợ trong thiên hà ngày càng nhiều lên trong những năm gần đây."
 shroud.4955.desc.2.outro: "Hơn nữa, chúng ta còn phát hiện một hiện tượng kỳ dị hơn, các [GetResearchers] dự báo những hiện tượng thậm chí còn quái lạ hơn nữa sẽ xảy ra trong tương lai gần."
 shroud.4955.desc.2.contact_aura: "$shroud.4955.desc.2.intro$ Chúng ta đã chứng kiến sự bành trướng khó hiểu của §H[from.GetName]§!, cũng như một §H$PSIONIC_AURA$§! tiêu cực đang ăn mòn khắp nơi. $shroud.4955.desc.2.outro$"
 shroud.4955.desc.2.contact_no_aura: "$shroud.4955.desc.2.intro$ Chúng ta đã chứng kiến sự bành trướng khó hiểu của §H[from.GetName]§!. $shroud.4955.desc.2.outro$"
 shroud.4955.desc.2.no_contact_aura: "$shroud.4955.desc.2.intro$ Chúng ta đã chứng kiến một §H$PSIONIC_AURA$§! tiêu cực đang ăn mòn khắp nơi. $shroud.4955.desc.2.outro$"
 shroud.4955.desc.2.no_contact_no_aura: "$shroud.4955.desc.2.intro$$shroud.4955.desc.2.outro$"
 shroud.4955.desc.3: "Chúng ta không biết thứ gì đang tới gần, chỉ biết rằng nó chắc chắn sẽ đến."
 shroud.4955.a: "Chúng ta phải chuẩn bị cho tình huống xấu nhất."
 shroud.4955.a.tt: "Trò chơi sẽ kết thúc khi §H$end_aura$§! bao trùm toàn bộ thiên hà."

 shroud.4960.title: "Mối đe dọa Tâm linh"
 shroud.4960.desc.1.intro: "Một §H$PSIONIC_AURA$§! độc ác đã được giải phóng"
 shroud.4960.desc.1.outro: "và đang lan tràn với tốc độ nguy hiểm ra khắp thiên hà. Theo quan sát của các [GetResearchers], nó đã gây ra những hậu quả tồi tệ ở nhiều hệ sao."
 shroud.4960.desc.1.contact: "§H[from.GetName]§! $shroud.4960.desc.1.intro$ $shroud.4960.desc.1.outro$"
 shroud.4960.desc.1.no_contact: "Một nền văn minh chưa được liên hệ $shroud.4960.desc.1.intro$ $shroud.4960.desc.1.outro$"
 shroud.4960.desc.2: "Dựa theo dữ liệu mới nhất, nó đã làm ô nhiễm hơn một nửa số hệ sao được liên kết bởi mạng lưới siêu không gian. Quyền năng đằng sau nó dường như muốn tìm kiếm một sự hủy diệt ở quy mô thiên hà; nếu không bị ngăn chặn, nó có thể sẽ đạt được mục đích."
 shroud.4960.a: "Phải ngăn chặn nó."
