 shroud.10.name: "Đồng minh chống lại Nữ hoàng"
 shroud.10.desc.intro: "Cõi Màn Che đang vọng lên sự tàn bạo chưa từng có. Những vòng cung năng lượng khổng lồ không ngừng cuộn trào trong cõi dĩ thái.\n\nGiữa mớ hỗn độn chớp tắt điên cuồng, chúng ta nhìn thấy dư âm tâm linh của Nữ hoàng Tổng hợp. Ả ta vô biên vô tận, quyền năng vô hạn, đùa bỡn cả thiên hà trong lòng bàn tay."
 shroud.10.desc.outro: "Sao lại thế này? Lẽ nào thực thể này biết điểm yếu nào đó mà chúng ta không biết? Liệu thực thể này có giúp nếu chúng ta vươn tay ra?\n\nKhi tập trung sự chú ý vào Đấng Nhào nặn, chúng ta cảm nhận được sự thiếu kiên nhẫn của ngài. Rất có thể chúng ta chỉ có duy nhất một cơ hội để cầu xin sự giúp đỡ cho vấn đề này. Để làm vậy, chúng ta có thể sẽ cần một lượng khổng lồ §HNăng lượng§! và §H$sr_zro$§!."
 shroud.10.desc: "$shroud.10.desc.intro$\n\nChúng ta không phải những kẻ duy nhất đang quan sát ả. Tại một vị trí đắc địa và ẩn khuất, một thực thể mang tên $the_animator_of_clay_color_article$ cũng đang nhìn xuống, không hề e dè trước sức mạnh bất tận của Nữ hoàng.\n\n$shroud.10.desc.outro$"
 shroud.10.desc.1: "$shroud.10.desc.intro$\n\nChúng ta không phải những kẻ duy nhất đang quan sát ả. Tại một vị trí đắc địa và ẩn khuất, $the_animator_of_clay_color_article$ cũng đang lặng lẽ nhìn xuống, không hề e dè trước sức mạnh bất tận của Nữ hoàng.\n\n$shroud.10.desc.outro$"
 shroud.10.a: "$animator.shroud$"
 shroud.10.b: "Chúng ta không cần sự giúp đỡ của ngài."
 shroud.10.b.tt: "Chúng ta sẽ không bao giờ có cơ hội nhờ Đấng Nhào nặn giúp đánh bại Cetana nữa."

