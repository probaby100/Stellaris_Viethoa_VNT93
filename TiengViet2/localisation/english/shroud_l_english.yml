 councilor_executive_thrall_manager_desc: "$TITLE$ chịu trách nhiệm phân bổ hợp lý lượng năng lượng thu thập được từ các thực tập sinh tình nguyện. Nguồn năng lượng này sẽ được tận dụng tối đa trong tay các quản lý cấp cao."

