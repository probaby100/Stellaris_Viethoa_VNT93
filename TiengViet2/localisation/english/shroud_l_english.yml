 auth_shroud_oligarchic_corporeal: "Chế độ Mật viện Thần tích"
 auth_shroud_oligarchic_corporeal_desc: "Cho các nhà lãnh đạo tương lai rèn luyện tinh thần ngay từ khi còn nhỏ sẽ nhào nặn ra một bộ khung những người sử dụng tâm linh ưu tú nhất, nắm trong tay thứ sức mạnh tâm linh khủng khiếp mà hiện tại ta không dám mơ tới."
 corporeal_oligarchic_tt: "$corporeal_trait_tt$\n$MOD_LEADER_INITIAL_SKILL$: §G+2§!\n$mod_leaders_upkeep_mult$: §G-25%§!\n$mod_leader_recruitment_age$: §G-15§!\n§YLãnh đạo§! khởi đầu có sẵn một §RĐặc điểm Xấu§! bổ sung."
