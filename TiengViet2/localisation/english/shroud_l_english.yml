 gov_mindwarden_enclave_desc: "Bắt nguồn từ sự ác cảm sâu sắc đối với Cõi Màn Che, tổ chức này cung cấp các dịch vụ kỹ thuật để triệt tiêu những ảnh hưởng mạnh mẽ từ các hoạt động ngoại cảm."

 civic_mindwarden_enclave: "$ENCLAVE_MINDWARDEN$"
 civic_mindwarden_enclave_desc: ""

 enclave_mindwarden_station: "Trạm không gian $MINDWARDEN$"
 enclave_mindwarden_station_plural: "Trạm không gian $MINDWARDEN$"

 leader_trait_iron_will: "Ý Chí Sắt Đá"
 leader_trait_iron_will_desc: "Một chỉ huy lão luyện của $MINDWARDEN_plural$, nổi tiếng với tài năng trong việc xây dựng hệ thống phòng thủ kiên cố và khả năng kháng cự về mặt tinh thần."

 shroud.4190.name: "$PSIONIC_AURA$ Đang Đến Gần"
 shroud.4190.desc.intro: "Trước đây, các [GetScientistPlural] đã quan sát thấy một hiện tượng bất thường: các hệ sao xa xôi đang vận hành với những dòng năng lượng không rõ nguồn gốc, và những dòng năng lượng này còn dần lan rộng ra các hệ sao khác."
 shroud.4190.desc: "$shroud.4190.desc.intro$Dòng năng lượng được gọi là §H\"$PSIONIC_AURA_PLURAL$\"§! này hiện vẫn chưa được xác định rõ nguồn gốc về mặt lý thuyết, nên chúng ta chưa thể kết luận liệu nó có tạo ra mối đe dọa hay không.\n\nLoại hào quang này hiện cũng đã được phát hiện trong hệ sao §H[from.GetName]§!, nếu tiếp tục lan rộng, nó có khả năng xâm phạm biên giới của chúng ta."
 shroud.4190.desc_mindwarden: "Nếu giả thuyết cho rằng hiện tượng này bắt nguồn từ ngoại cảm là đúng, thì §H[event_target:mindwarden_enclave_country.GetName]§! có lẽ sẽ biết cách để khắc chế tác động của nó."
 shroud.4190.a: "Chúng ta sẽ sớm biết nó có tác dụng gì."

 shroud.4191.name: "$shroud.4190.name$"
 shroud.4191.desc_1.common: "Chúng ta đã phát hiện ra năng lượng ngoại cảm nồng độ cao trong hệ sao §H[from.GetName]§!. Thông qua việc lắng nghe những tiếng vọng từ §HCõi Màn Che§!, các [GetTelepathPlural] của chúng ta biết được hiện tượng này được tạo ra từ"
 shroud.4191.desc_1.default: "$shroud.4191.desc_1.common$ các hoạt động ngoại cảm của một nền văn minh ngoài hành tinh."
 shroud.4191.desc_1.contact: "$shroud.4191.desc_1.common$ hoạt động ngoại cảm của §H[fromfrom.GetName]§!."
 shroud.4191.desc_2.common: "vật chất và ý thức trong thực tại có thể quan sát được. Chúng ta cũng nhận thấy những hào quang này có thể lan truyền giữa các hệ sao."
 shroud.4191.desc_2.default: "Được gọi là §H\"$PSIONIC_AURA$\"§!, nó phát ra từ ý chí của một thực thể Cõi Màn Che hùng mạnh, ảnh hưởng tới $shroud.4191.desc_2.common$"
 shroud.4191.desc_2.knows_aura: "Có vẻ như đế chế này đã phát triển một phương pháp để rút xuất §H$PSIONIC_AURA$§! từ ý chí của một thực thể Cõi Màn Che hùng mạnh, nó có thể ảnh hưởng tới $shroud.4191.desc_2.common$"
 shroud.4191.desc_3.common: "Chúng ta dự kiến tác động của nó trong ranh giới nước ta sẽ mang tính [GetPositiveRivalAdj] — miễn là mối quan hệ giữa chúng ta và kẻ phát ra nó không thay đổi."
 shroud.4191.desc_3.default: "Theo các [GetTelepathPlural], nó có thể giải phóng ý chí [GetBenevolentRivalAdj], do đó $shroud.4191.desc_3.common$"
 shroud.4191.desc_3.contact: "Do mối quan hệ của chúng ta với [fromfrom.GetName] khá [GetLessThanRivalAdj], $shroud.4191.desc_3.common$"
 shroud.4191.a.rival_organic: "$WORRYING$"
 shroud.4191.a.rival_default: "Tình hình không mấy tốt đẹp."
 shroud.4191.a.organic: "Một món quà từ Cõi Màn Che."
 shroud.4191.a.default: "Một hiện tượng tự nhiên thú vị"

 shroud.mindwarden.back: "$enclave.410.a$"

 shroud.4205.name: "[event_target:mindwarden_enclave_country.GetName]"
 shroud.4205.common: "Xin chào. Tôi xin thay mặt [event_target:mindwarden_enclave_country.GetName] để nói chuyện với bạn."
 shroud.4205.desc: "$shroud.4205.common$\n\nSứ mệnh của chúng tôi là bảo vệ mọi người khỏi mối đe dọa từ §HCõi Màn Che§! cũng như tất cả những kẻ phát tán những ảnh hưởng độc hại của nó. Chúng tôi tin vào sự thiêng liêng và bất khả xâm phạm của tâm trí, củng cố thiên hà để chống lại năng lượng ngoại cảm.\n\nDựa trên chỉ số từ cảm biến ngoại cảm, chúng tôi xác định các bạn không gây ra mối đe dọa này. Thật tuyệt vời. Chúng tôi rất sẵn lòng hỗ trợ và bảo vệ các bạn khỏi mọi tổn hại.\n\n$shroud.4205.desc.end$"
 shroud.4205.desc.end: "Nếu bạn cần các dịch vụ quân sự chống ngoại cảm, hoặc có lượng §H$zro_lower$§! dư thừa cần xử lý, xin cứ thoải mái tìm đến chúng tôi."
 shroud.4205.desc.return: "Chào mừng trở lại. [event_target:mindwarden_enclave_country.GetName] rất coi trọng sự hợp tác lâu dài của chúng ta.\n\nChỉ số cảm biến ngoại cảm của chúng tôi rất rõ ràng. Các bạn không bị ô uế bởi §HCõi Màn Che§!. Tốt, rất tốt...\n\n$shroud.4205.desc.end$"
 shroud.4205.desc.eotc: "Thời khắc cam go đã đến. Dù chúng tôi có gắng sức đến đâu, $end_of_the_cycle_color_article$ vẫn xuất hiện. Nó đang gieo rắc nỗi kinh hoàng hiển hiện khắp các vì sao...\n\n$shroud.4205.desc.eotc.end$"
 shroud.4205.desc.eotc.end: "Đã đến lúc chúng ta phải đoàn kết lại để ngăn chặn thảm họa ngoại cảm này."
 shroud.4205.desc.merc_first: "Hỡi những người bạn giám sát, chúng tôi mang đến một tin tốt: §H$gov_mindwarden_enclave$§! đầu tiên đã được thành lập. $shroud.shared_combating_the_shroud$"
 shroud.4205.desc.merc_more: "Hỡi những người bạn giám sát, chúng tôi có tin tốt đây: §H$gov_mindwarden_enclave$§! của chúng tôi đã được thành lập. $shroud.shared_combating_the_shroud$"
 shroud.4205.desc.merc_back: "Chào mừng trở lại, người bạn giám sát. §H[mindwarden_enclave_country.GetName]§! rất coi trọng sự hợp tác lâu dài của chúng ta.\n\n$shroud.4205.desc.end$"
 shroud.4205.desc.return_beginning: "$shroud.4205.desc.end$"
 shroud.4205.desc.return_beginning.eotc: "$shroud.4205.desc.eotc.end$"
 shroud.4205.a: "Cõi Màn Che là gì?"
 shroud.4205.b: "Chúng tôi muốn trao đổi về §I$sr_zro$§!."
 shroud.4205.c: "Phải đối phó với §Y$PSIONIC_AURA_PLURAL$§! như thế nào?"
 shroud.4205.d: "Chúng tôi biết một mục tiêu ngoại cảm khá lý tưởng..."
 shroud.4205.e: "Chúng tôi cần giúp đỡ về £crime£§Y[GetCrimeDeviancy]§!."
 shroud.4205.ef: "Chúng tôi cần §Yhỗ trợ hậu cần§!."
 shroud.4205.f: "Chúng tôi có thể mượn binh lính của các bạn được không."
 shroud.4205.g: "Các bạn có sẵn lòng cử một §Ygiám sát viên§! đến không?"
 shroud.4205.h: "Hãy kể cho chúng tôi nghe về $end_of_the_cycle_article$."
 shroud.4205.i: "Với tư cách là §Ynhà tài trợ§! của các bạn, chúng tôi có một đề xuất."

 shroud.shared_combating_the_shroud: "Kể từ hôm nay, §H[mindwarden_enclave_country.GetName]§! sẽ gánh vác trọng trách chống lại §HCõi Màn Che§! cũng như mọi hành vi lạm dụng ngoại cảm.\n\nNếu bạn cần, chúng tôi có thể cung cấp đa dạng các dịch vụ chống ngoại cảm — từ việc xử lý §H$zro_lower$§! cho đến đánh thuê — vô cùng nhanh chóng và hiệu quả."

 shroud.4210.desc: "§HCõi Màn Che§! có thể coi là một chiều không gian thực tại tồn tại ngoài những nhận thức thông thường. Nó được cấu thành hoàn toàn từ những năng lượng §H\"ngoại cảm\"§! độc hại. Nó chạm đến mọi ngóc ngách trong thiên hà vật chất của chúng ta, thế nhưng đa số mọi người lại chẳng thể chủ động cảm nhận được nó.\n\nNăng lượng của Cõi Màn Che có thể hiển hiện trong thế giới vật chất thông qua các hoạt động nhận thức của những sinh vật có ý thức. Những sức mạnh này vô cùng nguy hiểm và không thể lường trước.\n\nĐể đảm bảo an toàn cho công chúng, cần phải có những biện pháp phòng vệ chống lại Cõi Màn Che. Về mặt này, chúng tôi có thể giúp đỡ."

 shroud.shared_text_shroud_seal: "Cỗ máy phức tạp này có thể dần dần triệt tiêu $PSIONIC_AURA$, cho đến khi áp chế hoàn toàn — phạm vi hiệu lực bao gồm cả bản thân hệ sao của nó cũng như các hệ sao kết nối trực tiếp thông qua tuyến đường siêu không gian."
 shroud.4230.desc: "Có hai phương pháp chính để áp chế §H$PSIONIC_AURA_PLURAL$§!.\n\nXây dựng §H$building_psionic_suppressor$§! trên hành tinh có thể giảm dần cường độ hào quang trong toàn bộ hệ sao, đồng thời ngăn chặn sự ô nhiễm tiến triển thêm.\n\nMột giải pháp mạnh mẽ hơn là §H$SHROUD_SEAL$§!. $shroud.shared_text_shroud_seal$"
 shroud.4230.a: "Thôi bỏ đi."
 shroud.4230.b: "Xin hãy dạy chúng tôi §Y$tech_psionic_suppression$§!."
 shroud.4231.desc: "Rất sẵn lòng phục vụ. Dữ liệu sẽ được truyền trực tiếp đến chỗ các bạn.\n\nMong rằng những công nghệ này sẽ mang lại bình yên cho các bạn giữa thảm họa hào quang."

 mindwarden_encourage_raid: "Thuê [event_target:mindwarden_enclave_country.species.GetNamePlural] tiến hành tập kích một đế chế ngoại cảm đã biết."
 shroud.4240.need_psionics: "Thiết lập liên lạc với một đế chế §Y$trait_psionic$§!."
 shroud.4240.desc: "Là vậy sao? Thôi được, chừng nào chúng còn dùng ngoại cảm để đầu độc thiên hà này, chúng ta sẽ chẳng bao giờ được tận hưởng sự bình yên thực sự...\n\nNhững cuộc tập kích có mục tiêu có thể thay cho lời phản đối của chúng tôi đối với hành vi nguy hiểm này. Và với sự hỗ trợ tài chính từ các bạn, chúng tôi sẵn sàng thực hiện chiến dịch này.\n\nNếu các bạn đồng ý, hãy cho chúng tôi biết mục tiêu là ai."
 shroud.4240.a: "Thôi bỏ đi, đừng bận tâm."
 shroud.4240.b: "§I[event_target:raid_target_1.GetName]§!"
 shroud.4240.c: "§I[event_target:raid_target_2.GetName]§!"
 shroud.4240.d: "§I[event_target:raid_target_3.GetName]§!"
 shroud.4240.e: "§I[event_target:raid_target_4.GetName]§!"
 mindwarden_raid_cooldown_tt: "§RChúng ta không thể yêu cầu Cai ngục Tâm trí phát động một cuộc tập kích khác trước thời điểm §Y[root.mindwarden_raid_timer]§!.§!"
 mindwarden_hire_raid: "Thuê [event_target:mindwarden_enclave_country.GetName] phái hạm đội tập kích đến đế chế này."
 shroud.4245.desc: "À, được thôi. Chúng tôi biết bọn chúng đang luyện tập ngoại cảm. Việc phô trương sức mạnh lúc này là hoàn toàn chính đáng.\n\nCảm ơn sự hỗ trợ của các bạn. Hành động sẽ sớm bắt đầu."
 mindwarden_raider_modifier: "Cai ngục Tâm trí Tập kích Chống Ngoại cảm"

 shroud.4246.name: "$gov_mindwarden_enclave$ Tập kích"
 shroud.4246.common_1: "Các kênh liên lạc bị chặn thu cho thấy chúng đã được một thế lực thù địch nào đó thuê để tấn công vào hệ sao của chúng ta."
 shroud.4246.common_2: "đang phát tín hiệu qua các kênh công khai, trực tiếp thông báo cho chúng ta."
 shroud.4246.desc: "Một hạm đội quân sự của bọn §H[event_target:mindwarden_enclave_country.GetSpeciesName]§! đang tiến sát biên giới nước ta! $shroud.4246.common_1$ Bọn chúng $shroud.4246.common_2$"
 shroud.4247.desc: "Một hạm đội từ một thế lực quân sự chưa từng biết đến trước đây đang tiến sát biên giới của chúng ta! $shroud.4246.common_1$ Bọn chúng tự xưng là §H[event_target:mindwarden_enclave_country.GetSpeciesNamePlural]§!, $shroud.4246.common_2$"

 NAME_Mindwarden_Corvette: "Cuồng Tín"
 NAME_Mindwarden_Frigate: "Lính Canh"
 NAME_Mindwarden_Destroyer: "Thẩm Vấn Trưởng"
 NAME_Mindwarden_Cruiser: "Thầy Trừ Tà"
 NAME_Mindwarden_Battleship: "Kẻ Thanh Tẩy"
 NAME_Mindwarden_Titan: "Phán Quan"
 mindwarden_defense_modifier: "Lực Lượng Phòng Vệ Cai Ngục Tâm Trí"

 shroud.4250.desc: "Tuyệt vời. Việc giao phó $zro_lower$ cho chúng tôi sẽ tạo điều kiện cho các nghiên cứu quan trọng về thứ vật chất hùng mạnh nhưng đang bị lạm dụng tràn lan này — một nghiên cứu sẽ mang lại lợi ích cho toàn bộ thiên hà.\n\nĐó cũng là lý do tại sao chúng tôi thu mua nó với mức giá cao hơn hẳn so với tiêu chuẩn chung của thiên hà."
 shroud.4250.a: "$shroud.mindwarden.back$"
 shroud.4250.b: "§I$sr_zro$§! là thứ gì?"
 shroud.4250.c: "Quyên góp £sr_zro£§I$sr_zro$§!"
 mindwarden_zro_explanation: "Bán tối đa 100 §Y$sr_zro$§! với mức giá gấp 5 lần tiêu chuẩn của $resolution_category_galactic_market$."
 mindwarden_zro_cooldown_tt: "§RChúng ta không thể giao nộp thêm $sr_zro$ cho Cai ngục Tâm trí trước thời điểm §Y[root.mindwarden_zro_timer]§!.§!"
 shroud.4251.desc: "§Y$sr_zro$§! là một loại vật chất quý hiếm có tính không ổn định rất cao, công dụng cụ thể của nó cực kỳ khó kiểm soát và khó đoán. Dù là vô tình hay cố ý, nó đều có thể châm ngòi cho những vụ nổ năng lượng dữ dội, gây ra sức tàn phá trên diện rộng.\n\nNhững đặc tính này được sinh ra thông qua một phản ứng với §HCõi Màn Che§!, điều này khiến nó cực kỳ được ưa chuộng bởi những kẻ luyện ngoại cảm — thậm chí có những kẻ còn dùng thứ này như một loại ma túy.\n\nChúng tôi hy vọng có thể tiến hành nghiên cứu sâu hơn về $zro_lower$, tìm ra các biện pháp xử lý an toàn; và đây cũng là lý do tại sao chúng tôi lại vô cùng phóng khoáng trong việc thu mua lại thứ này."
 shroud.4255.desc: "Cảm ơn đóng góp của các bạn."

 shroud.4260.desc: "Vậy thì hãy để chúng tôi cung cấp một vài §Y$decision_thought_police$§! hữu dụng, chúng có thể dò tìm ra ý đồ của bọn [GetCriminalDeviant] ngay từ trước khi những ý đồ này biến thành hành vi thực tế.\n\nHọ sử dụng một phương pháp thay thế ngoại cảm an toàn được phát triển đặc biệt, áp dụng công nghệ khoa học để theo dõi các hoạt động nhận thức của đám đông. Họ mang lại cái nhìn sâu sắc về trạng thái tinh thần, mà hoàn toàn không cần phải dùng tới nguồn năng lượng nguy hiểm từ §HCõi Màn Che§!."
 shroud.4260.a: "$shroud.mindwarden.back$"
 shroud.4260.b: "Chiêu mộ §I$decision_thought_police$§!."
 mindwarden_decision_cooldown_tt: "§RChúng ta không thể đưa ra yêu cầu này trước thời điểm §Y[root.mindwarden_decision_timer]§!.§!"
 mindwarden_decision_explanation: "Mở khóa một £decision£ §YQuyết nghị Hành tinh§!: §Y$decision_thought_police$§!"
 shroud.4262.desc: "Rất tốt. Tôi tin chắc các bạn sẽ thấy phương pháp này vô cùng hiệu quả."

 shroud.4265.desc: "Quả thực là vậy. Thông qua quá trình hợp tác, chúng tôi nhận thấy chiến lược dàn quân của các bạn vẫn còn một vài khía cạnh có thể cải thiện thêm.\n\nTất nhiên, chúng tôi nói ra điều này hoàn toàn không có ý xúc phạm; chỉ là chuyên môn của ai người nấy làm thôi. Nếu các bạn có thể đưa ra một mức giá thỏa đáng, chúng tôi rất vinh hạnh được hợp tác trong vấn đề này với một khách hàng sáng giá như các bạn."
 shroud.4265.a: "$shroud.mindwarden.back$"
 shroud.4265.b: "Chốt."
 mindwarden_logistics_cooldown_tt: "§RChúng ta không thể xin Cai ngục Tâm trí hỗ trợ hậu cần thêm lần nữa trước thời điểm §Y[root.mindwarden_logistics_timer]§!.§!"

 shroud.4267.desc: "Xin chào, đối tác tôn kính.\n\nThỏa thuận hỗ trợ vận hành hậu cần hạm đội của chúng ta đã hết hạn. Nếu ngài có ý định cân nhắc, chúng tôi cực kỳ sẵn lòng để tiếp tục mối quan hệ hợp tác này."
 shroud.4267.a: "Tiếp tục hợp tác."
 shroud.4267.b: "Chúng tôi tạm thời từ chối."

 shroud.4266.desc: "Rất tốt. Quá trình vận hành hỗ trợ hạm đội của chúng tôi sẽ bắt đầu ngay lập tức."

 shroud.4270.desc: "$NAME_Mindwarden_Army$ của chúng tôi là một lực lượng răn đe vô cùng hùng mạnh. Họ được trang bị đầy đủ để đối phó với đủ loại hiểm họa, nhưng sẽ đặc biệt phát huy tác dụng khi đối đầu với những kẻ sử dụng năng lượng ngoại cảm.\n\nTôi nghĩ các bạn sẽ thấy đồng tiền mình bỏ ra là hoàn toàn xứng đáng."
 shroud.4270.a: "$shroud.mindwarden.back$"
 shroud.4270.b: "Chiêu mộ §I$mindwarden_army$§!."
 mindwarden_army_cooldown_tt: "§RChúng ta không thể yêu cầu Cai ngục Tâm trí điều động thêm một đạo lục quân mới nào trước thời điểm §Y[root.mindwarden_army_timer]§!.§!"
 mindwarden_army_explanation: "Chiêu mộ một đạo lục quân §Y$mindwarden_army$§!, được vận chuyển bằng $transport$ đến thẳng hệ sao thủ đô."
 shroud.4271.desc: "Các bạn ăn may đấy; chúng tôi vừa vặn có một đại đội đang trong tư thế sẵn sàng triển khai. Hãy chờ phi thuyền vận tải của họ đến ngay đi."

 shroud.4280.desc: "Chúng tôi vô cùng sẵn lòng.\n\nKhả năng lãnh đạo hiệu quả chính là chìa khóa để đánh bại §HCõi Màn Che§!, và các giám sát viên của chúng tôi thì lại cực kỳ lão luyện trong việc áp dụng những biện pháp quản lý nghiêm ngặt nhằm triệt tiêu các hoạt động ngoại cảm."
 shroud.4280.a: "$shroud.mindwarden.back$"
 shroud.4280.b: "Chiêu mộ một vị §I$subclass_commander_governor$§!."
 mindwarden_commander_explanation: "\nChúng ta sẽ thuê một vị $subclass_commander_governor$ thuộc Cai ngục Tâm trí ở cấp độ 5."
 unlocks_mindwarden_council_position: "\n§ECó thể mở khóa chức vụ trong hội đồng:§!\n§H$t$$councilor_mindwarden$§!\n$tt$$COUNCIL_POSITION_MODIFIER_BASE$\n$ttt$$mod_country_unity_produces_mult$: §G+1%§!\n$ttt$$planet_crime$: §G-1%§!\n$ttt$$MOD_PSIONIC_AURA_RESISTANCE_MULT$: §G+5%§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$commander_with_icon$\n\n$COUNCIL_POSITION_REQUIREMENTS$$councilor_mindwarden_conditional_tooltip$"
 mindwarden_commander_already_bought: "§RChúng ta đã trả tiền để sử dụng dịch vụ của một vị $subclass_commander_governor$ thuộc lực lượng Cai ngục Tâm trí rồi.§!"
 mindwarden_commander_conflicted_leader: "§RKhông thể chứa chấp những lãnh đạo đến từ [event_target:shroudwalker_enclave_country.GetName].§!"
 mindwarden_commander_cooldown_tt: "§RChúng ta không thể xin Cai ngục Tâm trí cấp thêm lãnh đạo trước thời điểm §Y[root.mindwarden_commander_timer]§!.§!"
 mindwarden_commander_desc: "Vị lãnh đạo này được thuê từ $gov_mindwarden_enclave$, giữ vững một lập trường cứng rắn đối phó với các hoạt động ngoại cảm nhằm bảo vệ người dân khỏi những hệ lụy xấu xa của Cõi Màn Che."
 mindwarden_commander_catch_phrase: "Cõi Màn Che thâm nhập ở đâu, hãy đốt cháy vết thương ở đó."
 shroud.4281.desc: "Một quyết định sáng suốt. Cầu mong sự cai quản của họ sẽ bảo đảm cho sự an nguy của nhân dân các bạn trong những tháng năm sắp tới."

 shroud.4286.name: "Tập kích [FROM.GetName]"
 mindwarden_farewell: "§L\"Cuộc tấn công gần đây của các người nhắm vào $gov_mindwarden_enclave$ là hoàn toàn phi lý. Dù dưới bất kỳ tư cách nào, việc tiếp tục làm việc trong lãnh thổ của các người đều là một việc không thể bào chữa được cả về mặt đạo đức lẫn luân lý. Ta cực lực khuyên các người hãy chấm dứt ngay hành động thù địch vô nghĩa này lại — nhưng mà, bất kể sau này các người có chọn làm gì đi chăng nữa, ta cũng sẽ không ở lại đây khoanh tay chờ chết đâu.\"§!"
 shroud.4286.desc: "$enclave.8000.start$\n\n$mindwarden_farewell$\n\n$enclave.8000.end$"
 shroud.4286.desc.councilor: "$enclave.8000.start$\n\n$mindwarden_farewell$\n\n$enclave.8000.councilor_end$"

 shroud.4290.desc: "Thành thật mà nói, đây là một thực thể vô cùng tàn khốc. Không có tai họa nào trong thiên hà này khủng khiếp hơn $end_of_the_cycle_color_article$."
 shroud.4290.a: "$marauder.31.e$"
 shroud.4290.b: "$end_of_the_cycle_color_article$ rốt cuộc là cái gì!?"
 shroud.4290.b.response: "Theo tình báo của chúng tôi, $end_of_the_cycle_color_article$ là một thứ sức mạnh mang tính hủy diệt đến từ bên trong §HCõi Màn Che§!. Sức mạnh của nó có thể hiển hiện trong thế giới vật lý thực tại thông qua sự thông đồng của những kẻ xâm nhập tâm trí luôn khao khát quyền lực.\n\nSự Tận Cùng gieo rắc sự hủy diệt cho các hệ sao thông qua §R$NAME_Reckoning$§! — đó là một thực thể tà ác được cấu thành hoàn toàn từ sức mạnh ngoại cảm thuần túy. Mục đích tối thượng của nó là xóa sổ hoàn toàn sự tồn tại của thực tại này."
 shroud.4290.c: "Chúng ta phải đánh bại §R$NAME_Reckoning$§! như thế nào?"
 shroud.4290.d: "Xin hãy chỉ dạy chúng tôi §Y$mindwarden_tactics_modifier$§!."
 shroud.4291.desc: "Chúc các bạn khải hoàn trở về khi đối mặt với mối đe dọa khổng lồ này. Nó đang đe dọa đến sự tồn vong của tất cả những ai đang cư ngụ trong thiên hà này."
 shroud.4292.desc: "Chúng tôi đã phát triển ra một loại thuật toán có khả năng tăng cường uy lực tấn công của các bạn khi nhắm vào §R$NAME_Reckoning$§!. Điều này có thể nâng cao hiệu năng cho hệ thống vũ khí của các bạn khi đối phó với những thực thể ngoại cảm cụ thể.\n\nỞ giai đoạn hiện tại, mỗi lần cải tiến đoạn mã này đều đòi hỏi phải tái cấu trúc lại với khối lượng đồ sộ, để có thể tương thích được với từng cơ sở hạ tầng quân sự. Chính vì vậy, đây là một dịch vụ cao cấp, nhưng chúng tôi tin rằng ngài sẽ thấy nó hoàn toàn xứng đáng với giá tiền."
 mindwarden_tactics_modifier: "Chiến thuật Cai ngục Tâm trí"

 shroud.4295.desc: "$shroud.4205.common$\n\nBan đầu, chúng tôi cảm thấy khá lo ngại trước những tin tức liên quan đến \"$building_materiality_engine_plural$\" của các bạn. Tuy nhiên, sau khi phân tích kỹ lưỡng hơn, chúng tôi nhận thấy thiết bị này là một bước tiến mới đầy triển vọng trong việc khai thác các khía cạnh phi ngoại cảm của cái gọi là §H\"Cõi Màn Che\"§!.\n\nChúng tôi khuyến khích các bạn tiếp tục triển khai công nghệ này và rất mong đợi được hợp tác cùng nhau trong tương lai."
 mindwarden_opinion_materiality_engine_tt: "Đánh giá: £opinion£§G+$@mindwarden_opinion_materiality_engine|0$§!"

 shroud.4300.desc: "Tôi thay mặt [mindwarden_enclave_country.GetName] nói chuyện với các người.\n\nDựa theo các chỉ số ghi nhận từ cảm biến ngoại cảm của chúng tôi, toàn bộ [Root.GetName] đã bị ô uế bởi §HCõi Màn Che§! đến mức không thể cứu vãn được nữa.\n\nNhững gì các người đang làm chẳng khác nào tự đào mồ chôn mình — chúng tôi cũng không phiền nếu phải tiện tay xúc thêm cho các người một xẻng đất đâu."
 shroud.4300.a: "Tại sao các người lại sợ Cõi Màn Che đến vậy?"

 shroud.4310.desc: "Chúng ta không hề sợ Cõi Màn Che, và lại càng không sợ đám tay sai của nó, bởi vì chúng ta thừa biết cách đối phó với những thứ này.\n\nTa không trông mong gì việc các người — cái xã hội đã bị Cõi Màn Che làm cho mất trí này — có thể thấu hiểu được dù chỉ là một mảy may."

 shroud.4320.desc.psionic: "Lẽ nào dùng ngoại cảm để đầu độc thiên hà này vẫn còn chưa đủ sao?"
 shroud.4320.desc.default: "Chúng ta là một thế lực bảo vệ trật tự của thiên hà; tấn công chúng ta thì có lợi lộc gì? Chúng ta sẽ không khoanh tay đứng nhìn hành vi hiếu chiến của các người đâu."
 shroud.4320.desc.common: "Trước khi các người xác nhận sẽ chấm dứt mọi hành động thù địch vô điều kiện, chúng ta chẳng có gì để nói với nhau cả."

 shroud.4340.desc: "Chúng ta biết tỏng những giao dịch ngầm giữa các người với §H[shroudwalker_enclave_country.GetName]§!. Hành động của các người không chỉ đơn thuần là dung túng cho sai lầm của chúng, mà thực chất là đang tiếp tay cho sự lây lan của mầm bệnh §HCõi Màn Che§!.\n\nChừng nào các người vẫn còn hợp tác với bọn chúng, chúng tôi sẽ không cung cấp cho các người bất kỳ dịch vụ nào."

 shroud.4350.desc: "§HSau khi cơ sở vật chất của họ bị phá hủy, cho tới nay chúng ta vẫn không tài nào liên lạc lại được với [mindwarden_enclave_country.GetName].\n\nMở kênh liên lạc của họ lên, thứ duy nhất chúng ta có thể nghe thấy chỉ là sự tĩnh lặng hư vô của vũ trụ.§!"

 enclave_opinion_tt: "Đánh giá: £opinion£§G+$@positive_opinion|0$§!"
 mindwarden_rival_opinion_tt: "Đánh giá đối với [event_target:shroudwalker_enclave_country.GetName]: £opinion£§R$@negative_opinion|0$§!"
 shroudwalker_rival_opinion_tt: "Đánh giá đối với [event_target:mindwarden_enclave_country.GetName]: £opinion£§R$@negative_opinion|0$§!"

 shroud.4405.title: "$gov_mindwarden_enclave$ Bị Phá Hủy"
 shroud.4405.desc_common: "Cuộc tấn công của chúng ta vào hệ sao [mindwarden_enclave_system.GetName] đã thành công; §H[mindwarden_enclave_country.GetName]§! nay đã không còn tồn tại."
 shroud.4405.desc.default: "$shroud.4405.desc_common$ Dù cho những thứ mà họ luôn khinh miệt chẳng hề mang ý nghĩa gì với chúng ta, nhưng cuộc thập tự chinh thảo phạt §H\"Cõi Màn Che\"§! của họ lại là đại diện cho một thứ chủ nghĩa giáo điều ngụy khoa học không bao giờ nên được phép tồn tại trong thiên hà của chúng ta."
 shroud.4405.desc.psionic: "$shroud.4405.desc_common$ Bọn chúng không nên tiếp tục truyền bá cái thứ giáo lý ngu muội về cái gọi là sự nguy hiểm của §HCõi Màn Che§! nữa, cỗ máy làm suy yếu ngoại cảm trên trạm không gian của bọn chúng giờ đây cũng chỉ còn là một đống sắt vụn mà thôi."
 shroud.4405.desc_end: "Chiến thắng này của chúng ta là một thành công vang dội, thậm chí chúng ta còn có thể trục vớt được một lượng lớn tài nguyên từ những mảnh vỡ trạm không gian của họ."

 shroud.4406.title: "$gov_mindwarden_enclave$ Bị Phá Hủy"
 shroud.4406.desc_common: "Chúng ta nhận được tin tức rằng §H[mindwarden_enclave_country.GetName]§! trong hệ sao [mindwarden_enclave_system.GetName] đã không còn tồn tại. $gov_mindwarden_enclave$ này đã không thể chống cự lại đợt tấn công dữ dội của §H[mindwarden_destroyer.GetName]§!, trạm không gian của họ đã vỡ vụn thành từng mảnh, và không hề tìm thấy một người sống sót nào."
 shroud.4406.desc.psionic: "Từ nay thiên hà sẽ không còn phải chịu sự quấy nhiễu từ những hành động theo kiểu thập tự chinh chống ngoại cảm của bọn chúng nữa — miễn là không có kẻ nào khác nhảy ra đóng thế cái vai này."
 shroud.4406.desc.default: "Những tháng ngày sắp tới khi không còn họ ở đây để cung cấp các dịch vụ chống ngoại cảm, thiên hà này sẽ phải chật vật chống đỡ lắm đây."
 shroud.4406.a: "Tạ ơn trời đất."

 shroud.6855.desc: "Xin hãy lưu ý. Chúng tôi rất sẵn lòng duy trì mối quan hệ hợp tác khăng khít cùng với [root.GetName]; lịch sử và những mục tiêu của chúng ta sẽ mãi mãi gắn bó với nhau."
 shroud.6855.desc.1: "Chúng tôi sẽ luôn biết ơn những đóng góp của ngài dành cho [mindwarden_enclave_country.GetName]. Chừng nào các mối đe dọa ngoại cảm vẫn còn hoành hành, thì mối quan hệ của chúng ta sẽ không thể nào bị lay chuyển."
 shroud.6855.desc.2: "Ngài hoàn toàn có thể yên tâm, khoản chia hoa hồng lợi nhuận tiếp theo cũng sẽ được thanh toán kịp thời."
 shroud.6855.b: "Chúng tôi mong muốn giúp các bạn nâng cấp thành bang không gian."
 shroud.6855.b.timeout: "Thành bang không gian này hiện đang bận rộn với việc chiêu mộ các viên chức và phi hành đoàn mới. Không thể tiến hành nâng cấp thêm cho các hoạt động ở đây trước thời điểm §Y[mindwarden_enclave_country.upgraded_station_timer]§!."
 shroud.6855.c: "Chúng tôi hy vọng có thể cùng chia sẻ công nghệ với các bạn."
 shroud.6855.c.timeout: "Thành bang này vẫn đang trong quá trình nghiền ngẫm công nghệ mà chúng ta đã chia sẻ từ trước. Chúng ta có thể tiếp tục chia sẻ thêm các công nghệ mới cho họ sau thời điểm §Y[mindwarden_enclave_country.updating_databanks_timer]§!."
 shroud.6855.d: "Chúng tôi hy vọng có thể thuê một §Yhạm đội§! của các bạn phục vụ cho chúng tôi."
 shroud.6855.e: "$enclave.205.b$"
 shroud.6855.f: "Tôi muốn gia tăng giới hạn sức chứa cho thành bang Cai ngục Tâm trí của chúng ta."
 shroud.6855.f.timeout: "Chúng tôi vẫn đang triển khai những cải cách cơ sở hạ tầng có liên quan đến thành bang không gian này. Tính đến thời điểm §Y[mindwarden_enclave_country.mindwarden_enclave_capacity_bought_timer]§!, chúng tôi sẽ không thể nâng sức chứa của thành bang Cai ngục Tâm trí lên thêm nữa."

 shroud.6860.1.desc: "Với lượng ngân sách dồi dào hơn, chúng tôi sẽ có thể mở rộng quy mô hoạt động một cách đáng kể. Chúng tôi có thể cải thiện cả về số lượng lẫn chất lượng của hạm đội, cũng như chiêu mộ thêm nhiều nhà nghiên cứu để phát triển các công nghệ bảo vệ tâm trí. Rốt cuộc thì, toàn bộ thiên hà đều sẽ được hưởng lợi từ sự hào phóng của ngài."
 shroud.6860.2.desc: "Chúng ta phải luôn đề cao cảnh giác trước những mối đe dọa ngoại cảm đầy mưu mô. Khoản quyên góp hào phóng của ngài sẽ tạo điều kiện để chúng tôi gia tăng đáng kể quy mô hoạt động nhằm đối phó với những thách thức như vậy."
 shroud.6860.3.desc: "Chúng ta đã gặt hái được rất nhiều thành tựu, nhưng nếu bây giờ mà nghỉ ngơi thì vẫn còn quá sớm. Chỉ cần được nắm trong tay nguồn tài nguyên dồi dào hơn, các hạm đội của [mindwarden_enclave_country.GetName] sẽ có thể được triển khai tới những vùng xa xôi hơn trong thiên hà, chở che cho nhiều tâm trí đang bị thế lực ngoại cảm vây hãm hơn."
 shroud.6860.4.desc: "Chính nguồn vốn khởi đầu do ngài cung cấp đã tiếp sức cho chúng tôi trên chuyến hành trình này, thế nhưng mục tiêu của chúng tôi thì vẫn mãi vẹn nguyên: nâng cao sức khỏe tinh thần thông qua việc triệt bỏ tận gốc nguồn năng lượng ngoại cảm. Nhờ có sự giúp đỡ của ngài, chúng tôi đang ngày càng tiến gần hơn tới cái đích đó."
 shroud.6860.5.desc: "Nếu ngài cảm thấy các chiến dịch của chúng tôi xứng đáng để ngài rót vốn đầu tư thêm một lần nữa, chúng tôi sẽ vươn lên thành đội quân chống ngoại cảm quy mô nhất thiên hà — trở thành pháo đài tối cao chống lại những cuộc xâm lăng tinh thần của mọi quốc gia trên khắp các vì sao."
 shroud.6860.b: "Vậy thì chốt nhé."

 shroud.6861.desc: "Cảm ơn ngài. Thật vinh hạnh khi chúng tôi được hợp tác cùng ngài, nhằm bảo vệ tính toàn vẹn về mặt tinh thần cho tất cả những dạng sống có trí tuệ."

 shroud.6865.desc: "Một sự nghiệp vĩ đại. Số lượng $ENCLAVE_MINDWARDEN_PLURAL$ trong thiên hà càng nhiều, thì tâm hồn của tất cả mọi người lại càng khó bị xâm nhập hơn.\n\nChúng tôi có thể đưa ra những lời khuyên hữu ích trong việc cải thiện độ hiệu quả của cơ sở hạ tầng, nhằm tạo điều kiện thuận lợi cho việc kiến thiết và quản lý thêm nhiều thành bang."
 shroud.6865.b.tt: "$mindwarden_enclave_capacity$: §G+1§!"

 shroud.6870.desc: "Chúng tôi rất cảm kích trước ý định chia sẻ những thành quả nghiên cứu này của ngài. Mọi kiến thức mà ngài truyền đạt lại cho chúng tôi đều sẽ góp phần củng cố cho sự bảo vệ của thiên hà này trước những mối đe dọa ngoại cảm."

 shroud.6875.desc: "Chúng tôi lấy làm vinh dự khi được gánh vác trọng trách này. Những hạm đội của [mindwarden_enclave_country.GetName] luôn đứng ở vị trí tiên phong về cả công nghệ lẫn chiến thuật chống ngoại cảm; bất kỳ kẻ thù nào mưu đồ xâm lăng tâm trí cũng đều không thể có chỗ đứng trước mặt họ. Mỗi hạm đội đều được chỉ huy bởi một chỉ huy đã qua khóa đào tạo tác chiến chống ngoại cảm chuyên biệt."

 mindwarden_tt_hirefleet: "Nắm quyền chỉ huy §Yhạm đội Cai ngục Tâm trí§! của thành bang không gian này, trong thời hạn 10 năm."
 shroud.6876.desc: "Chúng tôi tin rằng §H[mercenary_fleet.GetName]§! sẽ là một món vũ khí vô cùng uy lực khi phải đối phó với những kẻ cứ thích đùa giỡn cùng sức mạnh hủy diệt của ngoại cảm."

 mindwarden_tt_managefleet: "Hủy bỏ hoặc gia hạn hợp đồng §Yhạm đội Cai ngục Tâm trí§! của bạn."
 shroud.6880.desc: "Quả thực là vậy. Chúng tôi mong rằng §H[mercenary_fleet.GetName]§! sẽ giúp cho sức mạnh của ngài đã tựa hổ lại được mọc thêm cánh. Ngài định chấm dứt hay là gia hạn cho thỏa thuận của chúng ta?"
 shroud.6880.a: "$marauder.31.e$"

 shroud.6881.desc: "Tuyệt lắm. Thỏa thuận này đã kết thúc, §H[mercenary_fleet.GetName]§! sẽ quay trở về ngay lập tức. Những hạm đội của chúng tôi sẽ luôn sẵn sàng chờ ngài thuê bất cứ lúc nào ngài cần."

#======================
# Mindwardens origin
#======================
 origin_mindwardens: "$MINDWARDEN_plural$"
 origin_mindwardens_desc: "$CHALLENGING_ORIGIN$§RCảnh báo: Vô hiệu hóa ['concept_psionic_ascension'].§!\n\nTổ tiên của nền văn minh này từng bị ám ảnh bởi những thế lực siêu nhiên xâm nhập tâm trí, điều này đã thôi thúc họ đầu tư lượng lớn nhân lực và tài lực để phát triển công nghệ chống tâm linh.\n\nNhững thiết bị cổ đại của họ vẫn hoạt động, nhưng chưa từng được thử nghiệm đối mặt với những mối đe dọa tâm linh từ những nơi xa xôi hơn trong thiên hà."
 origin_tooltip_mindwardens_effects: "—$ADDITIONAL_TECHNOLOGIES_STRING$£engineering£['technology:tech_starbase_3']\n—$HOME_SYSTEM$ bắt đầu với một §H$tech_starbase_3$§!.\n—$HOMEWORLD$ £building£['building:building_ancient_ward_1']\n—Có thể sử dụng §Y$casus_belli_cb_psionics_containment$§! §HCớ khai chiến§! chống lại các đế chế Thăng hoa Tâm linh.\n—§Y$FE_GUARANTEED_COLONIES$§! sẽ không xuất hiện.\n—§Y$ENCLAVE_MINDWARDEN_PLURAL$§! sẽ không xuất hiện khi bắt đầu trò chơi."
 SPECIES_CLASS_MUST_USE_ORIGIN_MINDWARDENS: "Yêu cầu nguồn gốc §Y['civic:origin_mindwardens']§!"

 START_SCREEN_MINDWARDENS: "Những ghi chép tổ tiên chúng ta để lại kể về một cơn đại dịch tâm linh từng tàn phá [GetHomeWorldName]. Những thế lực siêu nhiên đã tấn công tâm trí họ, bức xạ hủy diệt lan tỏa trong bầu khí quyển - và tất cả những điều này đều bắt nguồn từ những thử nghiệm tâm linh trong xã hội [GetSpeciesAdj].\n\nĐể ứng phó với những mối đe dọa này, tổ tiên đã xây dựng $building_ancient_ward_1$ nhằm chống lại các thế lực xâm phạm tâm trí. Chỉ cần được bảo trì thường xuyên, cấu trúc cổ đại này đã đủ mạnh để bảo vệ tất cả [GetSpeciesNamePlural] khỏi các mối đe dọa từ ảnh hưởng của tâm linh, công nghệ cốt lõi của nó cũng cung cấp thông tin cho việc phát triển các hệ thống phòng thủ tâm trí khác.\n\nKhi nền văn minh của chúng ta chuẩn bị giương buồm vượt ra ngoài quỹ đạo của [capital_scope.System.GetName], chờ đợi chúng ta chỉ là những điều chưa biết. Còn những mối đe dọa tâm linh nào khác đang chờ đợi chúng ta trong những thế giới xa lạ kia?"
 mindwarden_system_init_NAME: "$origin_mindwardens$"
 mindwarden_system_init_DESC: "Đây sẽ là hệ sao khởi đầu cố định khi chọn nguồn gốc $origin_mindwardens$.\n\n$system_initializer_DESC$"
 mindwarden_sol_system_init_NAME: "$origin_mindwardens$ (Hệ Mặt Trời)"
 mindwarden_sol_system_init_DESC: "Hệ sao khởi đầu có thể chọn cho nguồn gốc $origin_mindwardens$, dựa trên Hệ Mặt Trời.\n\n$system_initializer_DESC$"

 building_ancient_ward_1: "Pháo Lũy Cổ Xưa"
 building_ancient_ward_1_desc: "Cấu trúc cổ đại này sử dụng một loạt các bộ giảm chấn tâm linh để cô lập toàn bộ hành tinh khỏi các thế lực xâm phạm tinh thần."
 building_ancient_ward_2: "Đại Pháo Lũy Cổ Xưa"
 building_ancient_ward_2_desc: "Cấu trúc cổ đại này đã nâng cấp các bộ giảm chấn tâm linh, nay đã có thể phòng thủ $PSIONIC_AURA_PLURAL$ trên phạm vi toàn bộ hệ sao."
 psionic_auras_immunity: "Dần dần xua tan §Y$PSIONIC_AURA_PLURAL$§! bên trong hệ sao"
 mindwarden_aura_immunity: ""
 war_goal_wg_end_threat_psionics: "$war_goal_wg_end_threat$"
 war_goal_wg_end_threat_psionics_desc: "Phát động chiến tranh để ngăn chặn thiên hà khỏi mối đe dọa lây nhiễm tâm linh."
 casus_belli_cb_psionics_containment: "Ngăn chặn Tâm linh"

