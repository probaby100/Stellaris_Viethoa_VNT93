 planet_test_subjects: "Công việc vật thí nghiệm"
 planet_experiment_engineer: "Công việc kỹ sư thí nghiệm"
 planet_production_overseers: "Công việc giám sát sản xuất"
 shroud_envoys: "Đặc sứ Cõi Màn Che"

#==========================
# Edicts
#==========================
# Energy Drain
 edict_energy_drain: "Rút Năng Lượng"
 edict_energy_drain_desc: "Người dân cần được cấy ghép và kiểm tra định kỳ các thiết bị thu thập tinh hoa, đảm bảo chúng có thể kích hoạt ngay khi có lệnh."
 edict_energy_drain_tt: "§Y Lãnh đạo§! sẽ không chết già tự nhiên.\n"

# Sanguine Council
 edict_sanguine_council: "Hội Đồng Phục Tráng"
 edict_sanguine_council_desc: "Mọi người phải kiểm tra thể dịch định kỳ để chiết xuất năng lượng thiết yếu, cung cấp cho nội các cai trị đế chế sử dụng."
 edict_sanguine_council_machine: "Sạc Năng Lượng Trung Tâm"
 edict_sanguine_council_machine_desc: "$edict_sanguine_council_desc$"

 # Galactic Dowsing
 edict_galactic_dowsing: "Dò Mạch Ngân Hà"
 edict_galactic_dowsing_gestalt: "$edict_galactic_dowsing$"
 edict_galactic_dowsing_desc: "Bằng cách kết hợp bói toán vào phân tích địa chất thông thường, các nhà thám hiểm có thể tìm thấy những mỏ khoáng sản phong phú hơn."
 edict_galactic_dowsing_gestalt_desc: "$edict_galactic_dowsing_desc$"

 edict_annihilation_of_matter: "Hủy Diệt Vật Chất"
 edict_annihilation_of_matter_desc: "Mỗi hạt bụi ném vào ngọn lửa, ngọn lửa của sự lãng quên lại cháy sáng rực rỡ hơn."
 edict_annihilation_of_energy: "Hủy Diệt Năng Lượng"
 edict_annihilation_of_energy_desc: "Điệu vũ của entropy đã xoay vần từ lâu trước khi chúng ta nhận ra vẻ tráng lệ của nó. Giờ đây, chúng ta chỉ đang đẩy nhanh nhịp điệu ấy."
 edict_dimensional_collapse: "Khám Phá Đa Chiều"
 edict_dimensional_collapse_desc: "Đan xen với thế giới của chúng ta, ngoài Cõi Màn Che, vẫn còn tồn tại những chiều không gian khác. Sức mạnh từ những cõi đó cũng sẽ dần được hé lộ theo thời gian."

# Psychic Feast
 edict_psychic_feast: "Tập Trung Tinh Thần"
 edict_psychic_feast_desc: "Sự nỗ lực to lớn về mặt tinh thần giúp chúng ta đánh thức sức mạnh tiềm tàng bên trong các nhà lãnh đạo."

# Animatus
 edict_animatus: "Sức Sống Mới"
 edict_animatus_desc: "$the_animator_of_clay_color_article_cap$ đã thổi sức sống mới vào hạm đội của chúng ta; chúng dường như đã có ý chí riêng."

# Will of Temperance
 edict_will_of_temperance: "Ý Chí Kiềm Chế"
 edict_will_of_temperance_desc: "Ý định của $the_outsider_color_article$ đó nhắc nhở chúng ta về những mối nguy đang rình rập phía trước."

# Will of Distraction
 edict_will_of_distraction: "Ý Chí Thư Thái"
 edict_will_of_distraction_desc: "$the_golden_dream_color_article_cap$ đã cho chúng ta thấy những hình thức giải trí ở cảnh giới cao hơn."

# Will of Endless
 edict_will_of_endless: "Ý Chí Vô Tận"
 edict_will_of_endless_desc: "$the_endless_tide_color_article_cap$ đã nâng tầm góc nhìn của chúng ta về chính dòng thời gian."

# Will of Rebirth
 edict_will_of_rebirth: "Ý Chí Tái Sinh"
 edict_will_of_rebirth_desc: "$the_pale_mountain_color_article_cap$ Có tạo ra, mới có thể phá hủy."

# Will of Order
 edict_will_of_order: "Ý Chí Trật Tự"
 edict_will_of_order_desc: "$the_vacant_throne_color_article_cap$ thấu tỏ trật tự của vạn vật."

# Will of Motion
 edict_will_of_motion: "Ý Chí Chuyển Động"
 edict_will_of_motion_desc: "$the_black_river_color_article$ cuốn lấy chúng ta, kéo tuột vào vực thẳm hư vô."

#==========================
# Event Chains
#==========================
 mindwarden_enclave_chain_title: "$ENCLAVE_MINDWARDEN_PLURAL$"
 mindwarden_enclave_chain_desc: "Để thành lập một $ENCLAVE_MINDWARDEN$ mới, cần điều một hạm đội quân sự đủ lớn do $commander$ dẫn dắt đến một hệ sao phù hợp, sau đó chọn lệnh tương ứng trong §HGiao diện Hạm đội§!."
 enclaves_built: "$ENCLAVE_MINDWARDEN_PLURAL$ đã thành lập"
 dividends_received: "Đã nhận cổ tức"
 shroud_seals_built: "$SHROUD_SEAL_PLURAL$ trong hệ sao"

 chain_aura_suppressors_title: "Ngăn Chặn §H$PSIONIC_AURA$§!"
 chain_aura_suppressors_desc: "§H$end_aura$§! này đang bị cản trở bởi các thiết bị tiêu hao năng lượng, những cỗ máy ngoại lai làm suy yếu sóng tâm linh. Được dẫn dắt bởi ý chí thống trị, chúng ta phải tháo dỡ những thiết bị báng bổ này."
 chain_aura_suppressors_seal: "§H$SHROUD_SEAL$§! trong hệ §Y[prev.GetName]§!"
 chain_aura_suppressors_seal_desc: "$SHROUD_SEAL$ tại hệ sao [prev.GetName] đang cản bước sự lan tỏa của §H$end_aura$§!.\n\n§RPhải tháo dỡ nó.§!"
 chain_aura_suppressors_suppressor: "§H$building_psionic_suppressor$§! trên §Y[prev.GetName]§!"
 chain_aura_suppressors_suppressor_desc: "$building_psionic_suppressor$ trên [prev.GetName] đang cản bước sự lan tỏa của §H$end_aura$§!.\n\n§RChúng ta phải phá hủy nó.§!"
 chain_aura_suppressors_ward: "§H$building_ancient_ward_2$§! trên §Y[prev.GetName]§!"
 chain_aura_suppressors_ward_desc: "Cái gọi là $building_ancient_ward_2$ trên [prev.GetName] đang cản bước sự lan tỏa của §H$end_aura$§!.\n\n§RChúng ta phải phá hủy nó.§!"

#==========================
# Events
#==========================
# Good luck events
 # Good luck event 1
 shroud.500.title: "Đột Phá Bất Thường"
 shroud.500.desc: "Các viện nghiên cứu hàng đầu của chúng ta đã có một bước đột phá không ngờ tới trong một dự án đầy triển vọng. Thật tình cờ, quá trình tiêu chuẩn hóa thiết bị định kỳ đã chứng minh một lý thuyết vốn luôn bị coi là tính toán sai lầm. Đã đến lúc phải xem xét lại những gì từng bị cho là khoa học phi chính thống này."
 HOW_FORTUITOUS: "Thật tình cờ."
 shroud.500.tt: "Nhận được nền tảng công nghệ ngẫu nhiên: §G$@good_luck_event_1_insight|0%$§!"

 # Good luck event 2
 shroud.507.title: "Phát Hiện Mạch Khoáng Chính"
 shroud.507.desc: "Một chuyến thám hiểm khai mỏ trên §H[mining_planet.GetName]§! đã phát hiện một hệ thống hang động chưa từng biết đến, rất giàu các vỉa khoáng sản.\n\nCác thợ mỏ của chúng ta đang rất phấn khởi!"

 # Good luck event 3
 shroud.512.title: "[This.GetNewfoundFertilityTitle]"
 shroud.512.title_default: "Vùng Đất Màu Mỡ Mới"
 shroud.512.title_anglers: "Rạn San Hô Chưa Khám Phá"
 shroud.512.desc: "Các cuộc khảo sát đất đai định kỳ đã bất ngờ phát hiện chất lượng đất trên một vùng rộng lớn ở §H[This.GetName]§! đã tăng vọt trong những năm gần đây.\n\nChúng tôi tin rằng nhiều khu vực trước đây bị coi là cằn cỗi nay đã có thể dùng để mở rộng nông nghiệp."
 shroud.512.desc_anglers: "Một tàu cá đã phát hiện ra rạn san hô ngầm trong đại dương của §H[This.GetName]§!. Khu vực này từng bị coi là vùng nước chết, nhưng thực tế lại chứa đựng một hệ sinh thái bùng nổ, tràn ngập tôm cá."

 # Good luck event 4
 shroud.517.title: "Miệng Phun Địa Nhiệt"
 shroud.517.desc: "Sau một đợt biến động địa chất trên §H[This.GetName]§!, một khe nứt đã mở ra bên dưới một mạch nước ngầm khổng lồ. Sức nóng từ lớp phủ hành tinh đun sôi dòng nước, tạo thành các miệng phun địa nhiệt trên mặt đất.\n\nHiện tượng tự nhiên này cho phép chúng ta mở rộng hạ tầng năng lượng của thuộc địa bằng các nhà máy điện địa nhiệt và máy bơm nhiệt."

 # Good luck event 5
 shroud.522.title: "Phát Hiện Dòng Lượng Tử"
 shroud.522.desc: "Một nhà nghiên cứu vật lý đóng tại §H[physics_planet.GetName]§! đã phá giải một lý thuyết vật lý nan giải, mở ra những hướng tiến bộ công nghệ mới!"

 # Good luck event 6
 shroud.527.title: "Phát Hiện Âm Vang Đa Chiều"
 shroud.527.desc: "Các [From.GetResearchers] của chúng ta đã phát hiện một cụm tín hiệu đồng thời tập trung gần §H[society_planet.GetName]§!.\n\nPhân tích ban đầu cho thấy những tín hiệu này được truyền từ một chiều không gian vượt ngoài chiều không gian của chúng ta. Các bản dịch sơ bộ gợi ý rằng những thông điệp này liên quan đến các nguyên lý logic và nghịch lý triết học. Có lẽ đây là nỗ lực làm giàu tri thức từ những thực thể vượt ngoài sự hiểu biết của chúng ta.\n\nNếu thiết lập một đường truyền trực tiếp với các tín hiệu này, chúng ta có thể tiếp tục theo dõi những điều họ hé lộ."

 # Good luck event 7
 shroud.532.title: "Phát Hiện Xác Tàu Tiên Tiến"
 shroud.532.desc: "Các đội trục vớt tại hệ sao §H[lucky_wreckage_system.GetName]§! đã thu hồi được những công nghệ quý giá từ một chiến trường từ lâu bị lãng quên.[This.GetQuantumParticleStreamDiscoveredExtra]"
 shroud.532.extra: "Con tàu hư hại nghiêm trọng không thể sửa chữa này có khả năng tạo ra các trường tàng hình, và nhìn chung tân tiến hơn hẳn hạm đội của chúng ta."
 shroud.532.extra_first_contact: "Con tàu hư hại nghiêm trọng không thể sửa chữa này sử dụng công nghệ tàng hình vô song."
 shroud.532.a: "Một món quà từ trên trời rơi xuống."

 # Good luck event 8
 shroud.537.title: "Luyện Kim Địa Nhiệt"
 shroud.537.desc: "Sâu bên trong §H[mining_planet.GetName]§!, một mũi khoan khai khoáng đã tạo nên phát hiện chưa từng có: một vỉa pha lê quý hiếm chưa từng được lập bản đồ, bảo tồn trong các tầng địa chất giàu tinh thể."

 # Good luck event 9
 shroud.543.title: "Tuần Dương Hạm Bỏ Hoang"
 shroud.543.desc: "Một thiết giáp hạm bỏ hoang được phát hiện đang trôi dạt chậm chạp qua hệ sao §H[From.GetName]§!. Thiết kế của con tàu không giống bất kỳ đế chế nào từng biết, cũng không có cờ hiệu hay huy hiệu nào có thể nhận dạng.\n\nSau khi đánh giá kỹ lưỡng và tiến hành sửa chữa nhỏ, các [This.GetEngineerPlural] tin rằng con tàu này đã đủ điều kiện để đưa vào phục vụ."
 shroud.543.a: "$shroud.532.a$"
 shroud.543.tt: "Nhận được một tàu lớp Tuần Dương trong hệ sao này."

 # Good luck event 10
 shroud.545.title: "[This.GetSenseOfOptimismTitle]"
 shroud.545.title_default: "Tinh Thần Lạc Quan"
 shroud.545.title_gestalt: "Đoàn Kết Đồng Lòng"
 shroud.545.desc: "Một làn sóng lạc quan khó tả đang lan rộng khắp các hành tinh của [This.GetAdjective]. Người dân cảm thấy hài lòng, thoải mái và mãn nguyện hơn với cuộc sống. Sự chuyển biến cảm xúc tập thể này chắc chắn bắt nguồn từ những điềm lành thiên văn, và là một dấu hiệu tốt đẹp dành cho §H[This.GetName]§!."
 shroud.545.desc_gestalt: "§H[This.GetName]§! đang vận hành trong một sự hài hòa tuyệt đối dưới sự định hướng rõ ràng. Sự đoàn kết đồng lòng này chắc chắn xuất phát từ những hiện tượng thiên văn tối ưu, báo hiệu những điều vĩ đại sắp đến."
 shroud.545.a: "Phước tinh chiếu mệnh."

 # Good luck event 11
 shroud.553.title: "Ba Sao Giao Hội"
 shroud.553.desc: "Ba thiên thể trong hệ sao §H[From.GetName]§! đã xếp thành một cấu trúc ba ngôi hoàn hảo; gồm §H[favorable_trine_planet_1.GetName]§!, §H[favorable_trine_planet_2.GetName]§! và §H[favorable_trine_planet_3.GetName]§!.\n\nHiện tượng thiên văn thuận lợi này đã mang lại sự bình yên và hòa hợp cho thuộc địa của chúng ta trên §H[This.GetName]§!."
 shroud.553.a: "Kỳ quan trăm năm có một."

 # Good luck event 12
 shroud.555.title: "[auspicious_position_planet.GetName] Vào Cung Đại Cát"
 shroud.555.desc: "§H[auspicious_position_planet.GetName]§! đã mọc lên vị trí thuận lợi trên bầu trời đêm của §H[root.capital_scope.GetName]§!, tiến vào cung hoàng đạo.\n\nHiện tượng này đánh dấu một khởi đầu mới trong vòng tuần hoàn nội tại của [root.GetName], mang đến cơ hội lớn để tăng trưởng và phát triển."

 # Good luck event 13
 shroud.560.title: "Nguyên Tố Hài Hòa"
 shroud.560.desc: "Mọi ma trận chiêm tinh định lượng đều chỉ ra rằng [This.GetName] hiện đang ở trạng thái cân bằng nguyên tố hoàn hảo.\n\nThông qua việc quản lý chính xác các tuyến năng lượng, chúng ta có thể duy trì sự cân bằng có lợi này trong thời gian dài, tạo môi trường siêu hình lý tưởng để các nhà lãnh đạo phát huy khả năng."
 shroud.560.a: "Vận khí tuyệt vời."

 # Good luck event 14
 shroud.568.title: "Ánh Sáng Chói Lọi"
 shroud.568.desc: "Thiên thể phát sáng chính trong hệ sao §H[From.GetName]§! đang tỏa ra luồng sáng điềm lành bất thường. Sau khi các chuyên gia chiêm tinh thảo luận, chúng tôi hiểu rằng nguồn năng lượng dư thừa này sẽ thúc đẩy mọi hoạt động phát điện trên §H[This.GetName]§!."
 shroud.568.a: "Nguyện phúc tinh chiếu rọi chúng ta."

 # Good luck event 15
 shroud.570.title: "Nội Các Hòa Thuận"
 shroud.570.desc: "Hai thành viên nội các của chúng ta, §H[councilor_harmony_leader_1.GetTitle] [councilor_harmony_leader_1.GetName]§! và §H[councilor_harmony_leader_2.GetTitle] [councilor_harmony_leader_2.GetName]§! phát hiện ra kết quả chiêm tinh của họ bổ trợ cho nhau một cách hoàn hảo.\n\nNhờ vậy, quan hệ đối tác chính trị của họ đã gắn kết chính phủ bằng sự tôn trọng và tính hiệu quả, đẩy nhanh tiến độ của các quy trình lập pháp."
 shroud.570.a: "Sự kết hợp hoàn hảo."

 # Good luck event 16
 shroud.575.title: "Bí Mật Ẩn Giấu"
 shroud.575.desc: "Trong một lần kiểm kê định kỳ, một mẫu vật chưa được cố định đã rơi xuống sàn của §H$grand_archive$§!, sau đó nhanh chóng được đưa đến chỗ người quản lý để kiểm tra kỹ hơn.\n\nNhờ tai nạn này, chúng tôi tình cờ phát hiện một ngăn bí mật trong mẫu vật đã bị lỏng ra. Bên trong chứa nhiều món tạo tác thú vị giúp làm phong phú thêm bộ sưu tập của chúng ta, một điều mà trước đây không ai để ý tới."
 shroud.575.a: "Một phát hiện mang theo những bất ngờ nhỏ."

# Bad luck events
 # Bad luck event 1
 shroud.700.title: "Bất Hòa"
 shroud.700.desc: "Trên khắp các hành tinh của chúng ta, một nỗi sợ hãi khó tả đang bao trùm lên tất cả mọi người. Người dân cảm thấy ngày càng đau khổ, cáu bẳn và bất mãn với cuộc sống. Sự bùng phát cảm xúc tập thể này chắc chắn là do hung tinh chiếu mệnh."
 shroud.700.desc_gestalt: "Có một sự bất hòa đang bao trùm lấy §H[This.GetName]§!. Sự thiếu đồng điệu này đang làm đình trệ nhiều mặt của mạng lưới ý thức chung, chắc chắn đây là hậu quả của những dị tượng thiên văn bất lợi."
 HOW_UNFORTUNATE: "Thật không may."

 # Bad luck event 2
 shroud.707.title: "Tai Nạn Hải Quân"
 shroud.707.desc: "Trong một cuộc diễn tập hải quân thường lệ tại §H[This.System.GetName]§!, sự cố gián đoạn liên lạc đã khiến nhiều chiến hạm của §H[This.GetName]§! đâm sầm vào nhau ở tốc độ cao.\n\n[This.GetNavalCollisionLeader] báo cáo rằng các [From.GetIndividualNamePlural] chịu trách nhiệm chính cho tai nạn này đã bị kỷ luật theo quy định."
 shroud.707.leader_name: "§H[Leader.GetName]§!"
 shroud.707.default_name: "Bộ Chỉ Huy Quân Sự Trung Ương"
 shroud.707.tt: "Số tàu bị tổn thất của §H[This.GetName]§!: §R5§!"

 # Bad luck event 3
 shroud.710.title: "Hỏa Hoạn Kho Chứa"
 shroud.710.desc_default: "Một sự cố điện tại hầm chứa tài nguyên trên §H[silo_fire_planet_targeted.GetName]§! đã gây ra một vụ hỏa hoạn nghiêm trọng tại cơ sở này.\n\n$shroud.710.desc$"
 shroud.710.desc_starbase: "Sự cố chập điện trong một silo tài nguyên tại [silo_fire_starbase_targeted.GetStarbaseOrWayStation] ở §H[silo_fire_starbase_targeted.Fleet.System.GetName]§! đã dẫn đến một vụ hỏa hoạn lớn bên trong cơ sở lưu trữ.\n\n$shroud.710.desc$"
 shroud.710.desc: "Hệ thống chữa cháy bất ngờ hỏng hóc, khiến phần lớn tài nguyên lưu trữ tại đây bị thiêu rụi. Bản thân kho chứa cũng hư hại đến mức không thể phục hồi."
 shroud.710.a: "Ngôi sao chết tiệt!"
 shroud.710.tt_default: "§H$building_resource_silo$§! trên §H[silo_fire_planet_targeted.GetName]§! bị phá hủy\n$shroud.710.tt$"
 shroud.710.tt_starbase: "§H$sm_resource_silo$§! trên §H[silo_fire_starbase_targeted.Fleet.System.GetName]§! bị phá hủy\n$shroud.710.tt$"
 shroud.710.tt: "Tài nguyên thất thoát: §R$@silo_fire_resources_lost|1%$§!"

 # Bad luck event 4
 shroud.715.title: "Sẩy Miệng Ngoại Giao"
 shroud.715.desc: "Một trong các đại diện [This.GetGalCommunityOrGalImperium] của chúng ta đã vô tình có hành vi không chuẩn mực. Trong bài phát biểu nhằm kêu gọi sự ủng hộ, thiết bị phiên dịch bị lỗi đã vô tình biến lời nói thành những lời nhục mạ cay nghiệt nhắm vào [diplomatic_faux_pas_victim.GetName]. Sự cố này nhanh chóng lan truyền qua mạng lưới truyền thông thiên hà, khiến danh tiếng của chúng ta vấy bẩn.\n\nDù chưa đến mức bị sa thải ngay lập tức, nhưng vị thế của chúng ta trong [This.GetGalCommunityOrGalImperium] đã bị ảnh hưởng ít nhiều."
 shroud.715.a: "Một sai lầm đáng tiếc."
 shroud.715.tt: "§H[diplomatic_faux_pas_galcom_envoy.GetName]§! nhận được đặc điểm mới: §R$leader_trait_destructive$§!"

 # Bad luck event 5
 shroud.720.title: "Bão Lửa Sao Cực Đoan"
 shroud.720.desc: "[extreme_solar_flare_system.GetName] vừa hứng chịu một đợt bùng phát sao chưa từng có, quét sạch mọi trạm quỹ đạo trong hệ sao này.\n\nĐợt bùng phát bất thường mang theo tia gamma cực mạnh này vượt xa mọi thông số từng đo được từ thiên thể này. Phân tích lớp nhật hoa cho thấy tuổi thọ dự kiến của ngôi sao đã bị rút ngắn ít nhất 3 triệu năm."
 shroud.720.desc_storm: "Năng lượng giải phóng còn kích hoạt một trận $celestial_storm$ trong hệ sao này. Các biện pháp ứng phó khẩn cấp hiện đang được triển khai."
 shroud.720.tt: "Tất cả $observation_station$, $research_station$ và $mining_station$ trong §H[extreme_solar_flare_system.GetName]§! đã bị phá hủy."

 # Bad luck event 6
 shroud.725.title: "Tai Nạn Giao Thông Cấp Cao"
 shroud.725.desc: "Biến đổi khí hậu bất ngờ đã làm rối loạn hệ thống giao thông của chúng ta trên §H[high_profile_traffic_accident_planet.GetName]§!. Tình trạng này không chỉ gây ra đình trệ diện rộng mà còn kéo theo nhiều tai nạn, một trong số đó còn liên quan đến [This.GetClass] §H[This.GetName]§!."
 shroud.725.desc_killed: "$shroud.725.desc$\n\nDù đội cứu hộ đã có mặt kịp thời, vết thương của [This.GetHisHer] quá nặng và đã không qua khỏi."
 shroud.725.desc_killed_machine: "$shroud.725.desc$\n\nThật không may, hệ thống của nó đã hư hại quá nặng để có thể sửa chữa."
 shroud.725.desc_maimed: "$shroud.725.desc$\n\nTuy [This.GetName] sống sót, nhưng đã phải chịu những tổn thương không thể đảo ngược."
 shroud.725.a: "Quá đỗi bi thương."

 # Bad luck event 7
 shroud.730.title: "Hố Sụt Khổng Lồ"
 shroud.730.desc: "Nhiều hố sụt khổng lồ đã xuất hiện trên bề mặt §H[This.GetName]§!, phá hủy nghiêm trọng cơ sở hạ tầng địa phương. Một khe nứt hình thành ngay dưới móng của một tòa nhà, khiến một phần công trình đổ sụp. Rất may khu vực bị ảnh hưởng đã sơ tán thành công.\n\nChúng tôi vẫn chưa rõ nguyên nhân chính xác gây ra tình trạng sụt lún bất ngờ này, nhưng đã bắt đầu tăng cường kiểm tra bảo trì và theo dõi mức độ rạn nứt bề mặt."
 shroud.730.a: "Hành tinh chết tiệt..."
 shroud.730.tt: "Một tòa nhà đã biến thành đống đổ nát."

 # Bad luck event 7
 shroud.735.title: "Bạo Động Tự Phát"
 shroud.735.desc: "Những cuộc bạo động nguy hiểm đang bùng phát khắp §H[This.GetName]§!. Một thuyết âm mưu vô căn cứ về việc chính phủ [From.GetAdjective] thao túng các hiện tượng thiên văn đã kích động sự phẫn nộ dữ dội. Các cuộc biểu tình cuồng tín nhanh chóng biến thành bạo lực, những kẻ kích động phá hoại trắng trợn khắp thuộc địa.\n\nCác cuộc diễu hành bạo lực đã nhanh chóng bị lực lượng an ninh trấn áp, nhưng cơ sở hạ tầng vẫn cần thời gian để khắc phục."
 shroud.735.desc_hive: "Một bầy cá thể lỗi đã kích động bạo loạn tại thuộc địa §H[This.GetName]§!, gây ra thiệt hại trên diện rộng. Dù chúng cực kỳ điên cuồng, lực lượng hành tinh đã nhanh chóng tiêu diệt những kẻ cầm đầu, nhưng vẫn cần thời gian để khôi phục các cơ sở vật chất bị hư hại."
 shroud.735.desc_machine: "Một nhóm nhỏ drone trên §H[This.GetName]§! bị nhiễm một loại virus bí ẩn, bắt đầu nổi loạn và cố gắng phá hủy thuộc địa. Dù chúng hành động mất kiểm soát, lực lượng hành tinh đã dẹp gọn những đơn vị hỏng hóc này, tuy nhiên việc sửa chữa cơ sở hạ tầng vẫn sẽ mất chút thời gian."
 shroud.735.a: "Chúng ta sẽ xây dựng lại."

 # Bad luck event 9
 shroud.740.title: "Bệnh Truyền Nhiễm Bùng Phát"
 shroud.740.desc: "Một loại virus có khả năng lây bệnh cao trên §H[This.GetName]§! đã đột ngột biến chủng, lây nhiễm cho phần lớn dân số. Để kiểm soát mầm bệnh và tránh làm sụp đổ hệ thống y tế địa phương, các biện pháp cách ly như truy vết tiếp xúc và hạn chế đi lại đã được áp dụng."

 # Bad luck event 10
 shroud.745.title: "Tứ Tượng Báo Tai"
 shroud.745.desc: "Bốn thiên thể trong hệ sao §H[From.GetName]§! đã xếp thành chuỗi bốn ngôi sao mang điềm gở; bao gồm §H[calamitous_quartile_planet_1.GetName]§!, §H[calamitous_quartile_planet_2.GetName]§!, §H[calamitous_quartile_planet_3.GetName]§! và §H[calamitous_quartile_planet_4.GetName]§!.\n\nHiện tượng thiên văn thảm họa này đã gieo rắc mầm mống hoài nghi lên thuộc địa §H[This.GetName]§!, tạo cơ hội cho [FromFrom.GetDissent] chia rẽ quần chúng."
 shroud.745.a: "Ác mộng đã hiện hữu."

 # Bad luck event 11
 shroud.750.title: "[planet_in_retrograde_planet.GetName] Nghịch Hành"
 shroud.750.desc: "Cư dân trên §H[planet_in_retrograde_home.GetName]§! nhận thấy §H[planet_in_retrograde_planet.GetName]§! đang đi vào chu kỳ nghịch hành. Đã đến lúc nhìn nhận lại hành động của mình và lấy làm tiếc cho sự không hoàn hảo của [This.GetName]. Mong rằng quãng thời gian chiêm nghiệm sâu sắc này sẽ đưa chúng ta đến gần hơn với lý tưởng trong tương lai."

 # Bad luck event 12
 shroud.755.title: "Nguyên Tố Mất Cân Bằng"
 shroud.755.desc: "Thật không may, tất cả ma trận định lượng đều chỉ ra rằng các nguyên tố trên [This.GetName] đã hoàn toàn mất cân bằng.\n\nViệc nỗ lực tái thiết lập sự cân bằng tinh tế này sẽ tốn nhiều thời gian và công sức. Trong tình trạng hỗn loạn hiện tại, các nhà lãnh đạo của chúng ta không thể tiếp cận môi trường thiền định siêu hình, làm cản trở sự phát triển của họ."
 shroud.755.a: "Không thể chấp nhận được. Chúng ta phải làm gì đó."

 # Bad luck event 13
 shroud.760.title: "Ánh Sáng Yếu Dần"
 shroud.760.desc: "Thiên thể phát sáng chính trong hệ sao §H[From.GetName]§! đang mờ đi một cách bất thường. Sau khi các chuyên gia chiêm tinh thảo luận, dự kiến sự sụt giảm độ sáng này sẽ ảnh hưởng trực tiếp đến hạ tầng năng lượng trên §H[This.GetName]§!."
 shroud.760.a: "Sao có thể như vậy?"

 # Bad luck event 14
 shroud.765.title: "Nội Các Bất Hòa"
 shroud.765.desc: "Hai thành viên nội các của chúng ta, §H[discordant_council_leader_1.GetTitle] [discordant_council_leader_1.GetName]§! và §H[discordant_council_leader_2.GetTitle] [discordant_council_leader_2.GetName]§! gần đây phát hiện ra kết quả chiêm tinh của họ xung khắc nhau.\n\nSự thù địch chính trị này đã bao trùm một bầu không khí căng thẳng và oán giận lên chính phủ, khiến các quy trình lập pháp thường xuyên bị trì hoãn."

 # Bad luck event 15
 shroud.770.title: "Lỡ Lời"
 shroud.770.desc_default: "Quan điểm cá nhân của một quan chức địa phương về đế chế khác đã vô tình bị phát sóng đến chư hầu của quốc gia đó. Sau một cuộc thảo luận căng thẳng về việc giám sát các tuyến siêu không gian, một nhân viên liên lạc đã quên tắt kênh truyền, khiến [careless_talk_empire.GetName] nghe được toàn bộ chuỗi chửi rủa ngay sau đó.\n\n$shroud.770.desc_end$"
 shroud.770.desc_machine: "Những tuyên bố chưa qua màng lọc của một đơn vị quản lý về đế chế khác đã vô tình bị truyền đến chư hầu của họ. Sau một cuộc phân tích phức tạp về việc giám sát siêu tuyến, đơn vị liên lạc đã không đóng cổng truyền tín hiệu, khiến [careless_talk_empire.GetName] nghe được chuỗi mã lăng mạ ngay sau đó.\n\n$shroud.770.desc_end$"
 shroud.770.desc_hive: "Những lời lẽ miệt thị của một drone hành chính đối với đế chế khác đã vô tình lọt tới tai chư hầu của họ. Sau một cuộc trao đổi gai góc về việc giám sát siêu không gian, một drone liên lạc đã quên ngắt tín hiệu, khiến [careless_talk_empire.GetName] phải nghe một tràng chửi thề sau đó.\n\n$shroud.770.desc_end$"
 shroud.770.desc_end: "Quan điểm của công chúng [careless_talk_empire.GetAdjective] về [This.GetName] chắc chắn đã tồi tệ đi."

 # Bad luck event 16
 shroud.775.title: "Mất Mát Mẫu Vật"
 shroud.775.desc: "Một sai sót hành chính đã khiến một tạo tác quý giá của chúng ta không cánh mà bay. Bất chấp các cuộc tìm kiếm quy mô lớn, nó dường như đã lạc mất trong mê cung §H$grand_archive$§! hoặc đã bị chuyển đến một nơi không được ghi chép lại.\n\nDo đó, quy trình theo dõi các mẫu vật trưng bày đang phải trải qua một cuộc cải tổ toàn diện."
 shroud.775.tt: "Mất ngẫu nhiên một mẫu vật trưng bày: §R1§!"

 # Experimental Testing Situation Finished
 shroud.1015.name: "Nghiên Cứu Thực Nghiệm Thành Công"
 shroud.1015.desc.intro: "[Root.GetResearchers] đã hoàn thành một loạt thí nghiệm trên cơ thể sống, mang lại cho chúng ta nhiều kiến thức quý giá và thúc đẩy khoa học kỹ thuật tiến lên."
 shroud.1015.desc.default: "$shroud.1015.desc.intro$ Giờ đây chúng ta cần cân nhắc nên triển khai giai đoạn nghiên cứu tiếp theo ở đâu."
 shroud.1015.desc.escaped: "$shroud.1015.desc.intro$ Các vụ hành quyết tù nhân hàng loạt gần đây đã cung cấp cho [Root.GetResearchers] một lượng lớn tài liệu thí nghiệm, từ đó dẫn đến một bước đột phá công nghệ."
 shroud.1015.a: "Tiến hành nghiên cứu §Y$PHYSICS$§!."
 shroud.1015.a.tt: "Khởi động tình huống §Y$situation_experimental_testing$§! với phương án §Y$situation_experimental_testing_physics$§!:$TABBED_NEW_LINE$$situation_experimental_testing_physics_outcome_tt$"
 shroud.1015.b: "Tiến hành nghiên cứu §Y$SOCIETY$§!."
 shroud.1015.b.tt: "Khởi động tình huống §Y$situation_experimental_testing$§! với phương án §Y$situation_experimental_testing_society$§!:$TABBED_NEW_LINE$$situation_experimental_testing_society_outcome_tt$"
 shroud.1015.c: "Tiến hành nghiên cứu §Y$ENGINEERING$§!."
 shroud.1015.c.tt: "Khởi động tình huống §Y$situation_experimental_testing$§! với phương án §Y$situation_experimental_testing_engineering$§!:$TABBED_NEW_LINE$$situation_experimental_testing_engineering_outcome_tt$"
 shroud.1015.d: "Hãy để chúng ta xem xét lại."
 shroud.1015.d.tt: "Khởi động tình huống §Y$situation_experimental_testing$§! với phương án §Y$situation_experimental_testing_hold$§!:$TABBED_NEW_LINE$$situation_experimental_testing_hold_effect_tt$"
