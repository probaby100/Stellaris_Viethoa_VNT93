 concept_chosen_civics_desc: "Loại triết lý quốc gia $concept_chosen_civics$ bao gồm\n—['civic:civic_chosen']$NEW_LINE$—['civic:civic_hive_chosen']$NEW_LINE$—['civic:civic_machine_chosen']$NEW_LINE$—['civic:civic_corporate_chosen']"

 shroud.5105.title: "Kẻ Được Chọn"
 shroud.5105.desc: "Một mối liên kết vô hình với thực thể mà chúng ta chẳng thể định nghĩa hay thấu hiểu... chúng ta vẫn luôn cảm nhận rõ.\n\n[This.GetTheChosenP2]\n\nTừ khi chúng ta mới bắt đầu ghi chép lịch sử, sự hiện diện đầy bí ẩn này đã ở ngay đây. Rõ ràng, Ngài đã chọn chúng ta... nhưng không rõ vì lý do gì.\n\nChúng ta nên mô tả [This.GetSensation] này như thế nào?"
 shroud.5105.desc_p2: "Chúng ta có thể cảm nhận được sự hiện diện của Ngài nơi sâu thẳm nhất trong tâm trí. Ngài cứ quanh quẩn nhưng lại xa tầm với. Ngài là một sự tồn tại chắc chắn nhưng cũng lại bất khả thi ngay trong đầu chúng ta."
 shroud.5105.desc_p2_machine: "Chúng ta đã phát hiện ra sự hiện diện của Ngài trong những phép tính phức tạp nhất. Ngài cứ quanh quẩn nhưng lại xa tầm với. Ngài là một sự tồn tại chắc chắn nhưng cũng lại bất khả thi ngay trong các mạch điện của chúng ta."
 shroud.5105.a: "$the_composer_of_strands_article_cap$"
 shroud.5105.b: "$the_eater_of_worlds_article_cap$"
 shroud.5105.c: "$the_cradle_of_souls_article_cap$"
 shroud.5105.d: "$the_instrument_of_desire_article_cap$"

 shroud.5110.title: "Lời Triệu Gọi Từ [GetChosenPatron]"
 shroud.5110.desc_common: "Trong suốt chiều dài lịch sử, một sự hiện diện khó tả mang tên §H[GetChosenPatron]§! đã luôn đồng hành cùng chúng ta. Giờ đây, khi dải ngân hà bao la đang chờ đón, chúng ta càng [GetFeelLoc] rõ nét hơn sự tồn tại của Ngài trong [GetMindPhysicalLoc].\n\nNgài quanh quẩn nơi đó, vẫy gọi chúng ta. Khi khoảng cách ngày càng thu hẹp, lần đầu tiên chúng ta nhận ra hình dáng thực sự của không gian bí ẩn sâu thẳm trong [GetMindLogicLoc] này. [GetChosenPatron] đang gọi chúng ta bước vào,"
 shroud.5110.desc_common_2: "Cuối cùng, chúng ta đã hiểu cách để dùng chính ý chí của mình dấn thân vào cõi ảo ảnh này."
 shroud.5110.desc_organic: "$shroud.5110.desc_common$, cám dỗ chúng ta bằng những trải nghiệm ngoài sức tưởng tượng.\n\n$shroud.5110.desc_common_2$"
 shroud.5110.desc_robot: "$shroud.5110.desc_common$, tối ưu hóa các thông số của chúng ta bằng những nguyên lý ẩn số.\n\n$shroud.5110.desc_common_2$"
 shroud.5110.a: "Tầm nhìn của chúng ta đã mở rộng vào bên trong."
 shroud.5110.a.tt: "Nhận được §YĐộ Điều Hòa§! với thực thể này: $@chosen_patron_attunement_gift|0G$\nCó thể truy cập bảng §YCõi Màn Che§! thông qua menu §YLiên Lạc§!."

 shroud.5115.title: "[GetChosenPatron]"
 shroud.5115.desc.intro: "Cõi Màn Che. Nó rình rập ngay bên dưới thực tại mà chúng ta đã biết, tựa như bóng ma phản chiếu từ màn đêm.\n\nMặc dù chúng ta đã sớm nhúng tay vào cõi tâm linh này, nhưng những nỗ lực đầu tiên mới chỉ mang tính thăm dò. Giờ đây, sau nhiều năm dùng ý chí tập thể để làm hao mòn bức màn ngăn cách giữa các chiều không gian, chúng ta đã có thể cảm nhận nó rõ ràng và bắt đầu khám phá có mục đích.\n\nỞ phía bên kia bức màn, những cố gắng của chúng ta đã được chú ý tới. §H[GetChosenPatron]§! đang chờ đợi."
 shroud.5115.desc.outro: "Trong vòng xoáy vô vàn thực thể này, sự minh mẫn của Ngài là một lời hứa hẹn."
 shroud.5115.desc.composer: "$shroud.5115.desc.intro$\n\n§HTrải dài. Bao bọc. Mở rộng.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.desc.eater: "$shroud.5115.desc.intro$\n\n§HCảm nhận cơn đói thực sự.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.desc.cradle: "$shroud.5115.desc.intro$\n\n§HTập hợp và ôm trọn.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.desc.instrument: "$shroud.5115.desc.intro$\n\n§HĐắm chìm trong khát khao.§!\n\n$shroud.5115.desc.outro$"
 shroud.5115.a: "Chúng ta sẽ quay lại."

