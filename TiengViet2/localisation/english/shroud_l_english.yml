 shroud.first_contact_insert.composer: "Một dàn §Hđồng ca nhịp nhàng§!"
 shroud.4025.title: "$the_composer_of_strands_article_cap$ hiển linh"
 shroud.4025.desc.default: "Chúng ta đi theo mùi hương của §H[Root.Patron:the_composer_of_strands.GetPreCommunicationName]§!, bị dẫn sâu hơn vào §HCõi Màn Che§!. Ngài đã để lại những dấu hiệu cho chúng ta bám theo——đây là một hình ảnh, một đoạn giai điệu. Ngài mời chúng ta bước tới, nhưng từng bước đi lại vô cùng gian nan.\n\nCuối cùng, chúng ta đã tới nơi. Chào đón chúng ta là một khung cảnh lộng lẫy: những hệ sao xoay chuyển không ngừng, những hình tượng [Root.GetSpeciesAdj] khổng lồ vặn vẹo. Nằm trong vòng tay Ngài, chúng ta lạc lối giữa một cuộn chỉ có mùi hăng hắc.\n\nChúng ta túm lấy những sợi chỉ, thắt chặt phần đuôi. Những ký hiệu rời rạc hợp lại thành hoa văn. Còn chúng ta kiệt sức, nhưng lại đắm chìm vào những hình thể uy nghiêm và những con số. Cảnh tượng này lại chìm vào im lặng.\n\nChúng ta đã làm rõ ý đồ của thực thể này, đã biết được viễn cảnh của Ngài về sự tăng trưởng và không gò bó. Chỉ cần các [GetTelepathPlural] của chúng ta hồi phục, là có thể tiếp xúc và giao tiếp với thực thể này, $the_composer_of_strands_color_article$."
 shroud.4025.desc.hive: "$shroud.4025.desc.default$"
 shroud.4025.desc.gestalt_machine: "Chúng ta đi theo dấu vết phân tử của §H[Root.Patron:the_composer_of_strands.GetPreCommunicationName]§!, bị dẫn sâu hơn vào §HCõi Màn Che§!. Ngài đã để lại những dấu hiệu cho chúng ta bám theo——đây là một hình ảnh, một đoạn giai điệu. Ngài mời chúng ta bước tới, nhưng từng bước đi lại vô cùng gian nan.\n\nCuối cùng, chúng ta đã tới nơi. Chào đón chúng ta là một ảo ảnh lộng lẫy: những hệ sao xoay chuyển không ngừng, những hình tượng [Root.GetSpeciesAdj] khổng lồ vặn vẹo. Nằm trong vòng tay Ngài, chúng ta lạc lối giữa một cuộn chỉ có mùi hăng hắc.\n\nChúng ta túm lấy những sợi chỉ, thắt chặt phần đuôi. Những ký hiệu rời rạc bắt đầu hợp lại thành hoa văn. Còn chúng ta kiệt sức, nhưng vẫn đang xử lý tập dữ liệu phi thường này. Sau đó cảnh tượng lại chìm vào im lặng.\n\nChúng ta đã làm rõ ý đồ của thực thể này, đã biết được viễn cảnh của Ngài về sự tăng trưởng và không gò bó. Chỉ cần các [GetTelepathPlural] của chúng ta hồi phục, là có thể tiếp xúc và giao tiếp với thực thể này, $the_composer_of_strands_color_article$."
 shroud.4025.desc.individual_machine: "$shroud.4025.desc.gestalt_machine$"
 shroud.4025.a.default: "Sức mạnh của Ngài thật huy hoàng rực rỡ."
 shroud.4025.a.robot: "Sức mạnh của Ngài không thể đong đếm."
 shroud.4025.b.default: "$shroud.first_contact.end.b$"
