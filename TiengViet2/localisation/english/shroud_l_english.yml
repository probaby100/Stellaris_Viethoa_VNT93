 councilor_secret_societies: "Người Liên Lạc Ngầm"
 councilor_secret_societies_female: "$councilor_secret_societies$"
 councilor_secret_societies_desc: "$TITLE$ âm thầm quản lý nhiều vấn đề chính trị của đế chế, nhưng chức vụ công khai chỉ là phó quan điều phối."

# Manipulator Liaison
 councilor_secret_societies_corporate: "Người Liên Lạc Thao Túng"
 councilor_secret_societies_corporate_female: "$councilor_secret_societies_corporate$"
 councilor_secret_societies_corporate_desc: "$TITLE$ âm thầm quản lý nhiều vấn đề chính trị của đế chế, nhưng chức vụ công khai chỉ là trợ lý quan điều phối."

 # Chief Medium
 councilor_chief_medium: "Nhà Ngoại Cảm Tối Cao"
 councilor_chief_medium_female: "$councilor_chief_medium$"
 councilor_chief_medium_desc: "$TITLE$ là cơ quan tinh thần tối cao của đế chế, đại diện cho nhu cầu của quốc gia đối với các nhà huyền bí học và thúc đẩy việc áp dụng bói toán vào mọi mặt của đời sống."
 councilor_chief_medium_effect_tooltip: "$t$—$mod_planet_bureaucrats_upkeep_mult$: $@sb_councilors_priest_upkeep_mult|=-%$\n$t$—$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: $@sb_councilors_agenda_speed_mult|1=+%$\n$t$—$mod_cycle_negative_effects_bonus_mult$: $@sb_negative_effects_bonus|0=-%$"

 # Executive Astrologist
 councilor_executive_astrologist: "Giám Đốc Chiêm Tinh"
 councilor_executive_astrologist_female: "$councilor_executive_astrologist$"
 councilor_executive_astrologist_desc: "$TITLE$ tận tụy với việc thống nhất niềm tin tâm linh trên toàn đế chế, nâng cao hiệu quả bói toán và đẩy nhanh sự xuất hiện của các điềm lành theo như lời hứa của những vì sao."
 councilor_executive_astrologist_effect_tooltip: "$t$—$mod_planet_bureaucrats_upkeep_mult$: $@sb_councilors_priest_upkeep_mult|=-%$\n$t$—$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: $@sb_councilors_agenda_speed_mult|1=+%$\n$t$—$mod_cycle_positive_effects_bonus_mult$: $@sb_positive_effects_bonus|0=+%$"

 # Experimentation Overseer
 councilor_experimentation_overseer: "Quản Đốc Thí Nghiệm"
 councilor_experimentation_overseer_female: "$councilor_experimentation_overseer$"
 councilor_experimentation_overseer_desc: "$TITLE$ chịu trách nhiệm đảm bảo các cơ sở nghiên cứu tuân thủ đúng quy định, nhằm kéo dài thời gian sử dụng hiệu quả của các đối tượng thí nghiệm sống."

 # Test Marketer
 councilor_test_marketer: "Giám Đốc Tiếp Thị Thí Nghiệm"
 councilor_test_marketer_female: "$councilor_test_marketer$"
 councilor_test_marketer_desc: "$TITLE$ chịu trách nhiệm đảm bảo các cơ sở nghiên cứu tuân thủ đúng quy định, nhằm gia tăng sản lượng từ các đối tượng thử nghiệm sống."

 # Thought Warden (Mindwarden)
 councilor_mindwarden: "Cai Ngục Tâm Trí"
 councilor_mindwarden_female: "$councilor_mindwarden$"
 councilor_mindwarden_desc: "$TITLE$ là cơ quan thẩm quyền tối cao trong việc kìm hãm sự thù địch ngoại cảm và các ý nghĩ phạm tội."
 councilor_mindwarden_unlock_title: "§HChức vị hội đồng được mở khóa bởi [mindwarden_enclave_country.GetName]§!"
 councilor_mindwarden_conditional_tooltip: "Lãnh đạo không phải người ngoại cảm"

# Shroudspeaker
 councilor_chosen: "Người Giao Tiếp Cõi Màn Che"
 councilor_chosen_female: "$councilor_chosen$"
 councilor_chosen_desc: "$TITLE$ chịu trách nhiệm dẫn dắt công việc của các tu sĩ bằng cách điều hòa chặt chẽ với Chúa Tể trong Cõi Màn Che."

# Grand Preacher
 councilor_chosen_corporate: "Đại Giáo Sĩ"
 councilor_chosen_corporate_female: "$councilor_chosen_corporate$"
 councilor_chosen_corporate_desc: "$TITLE$ chịu trách nhiệm đảm bảo công việc truyền giáo của các tu sĩ chúng ta phục vụ cho lợi ích kinh tế tốt nhất."

# Grand Vessel
 councilor_grand_vessel: "Cỗ Bể Tối Cao"
 councilor_grand_vessel_female: "$councilor_grand_vessel$"
 councilor_grand_vessel_desc: "$TITLE$ chịu trách nhiệm tối đa hóa hiệu suất của các cơ sở tự động, và sở hữu đặc quyền sử dụng cỗ bể lớn nhất trong xã hội của chúng ta."

# Executive Vessel
 councilor_executive_vessel: "Cỗ Bể Điều Hành"
 councilor_executive_vessel_female: "$councilor_executive_vessel$"
 councilor_executive_vessel_desc: "$TITLE$ chịu trách nhiệm tối đa hóa hiệu quả của các cơ sở tự động, và sở hữu đặc quyền sử dụng cỗ bể lớn nhất trong tập đoàn của chúng ta."

