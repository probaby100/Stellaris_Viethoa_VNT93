 shroud.4971.desc.1: "Kết thúc rồi."
 shroud.4971.desc.2.1: "§H$PSIONIC_AURA$§! được phát ra"
 shroud.4971.desc.2.2: "tràn ngập khắp hệ sao. Khi hệ sao cuối cùng bị vầng hào quang làm cho mục nát, một luồng năng lượng khổng lồ bùng nổ."
 shroud.4971.desc.2.3: "Giống như đến từ một chiều không gian khác ngoài thực tại, sức mạnh thảm họa to lớn này đã phá hủy tất cả."
