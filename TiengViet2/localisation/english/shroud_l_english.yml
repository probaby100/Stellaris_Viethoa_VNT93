 casus_belli_cb_proxy_war: "Chiến tranh Ủy nhiệm"
 war_goal_wg_proxy_war: "Chiến tranh Ủy nhiệm"
 war_goal_wg_proxy_war_desc: "Khơi mào một cuộc chiến bằng những lời bịa đặt ác ý. Nếu chiến thắng, phe tấn công sẽ giành được các hệ sao đã tuyên bố chủ quyền, và §YMối đe dọa§! phát sinh từ việc chinh phạt các hệ sao này sẽ được giảm đi §Y33%§!."

 shroud.5055.title: "$proxy_war_busted_modifier$"
 shroud.5055.desc.common: "Chúng ta đã bị lừa.\n\nNhân viên tình báo của ta vừa đánh chặn được một thông điệp bí mật từ §H[from.GetName]§!, vạch trần âm mưu lôi kéo chúng ta vào một cuộc chiến tranh ủy nhiệm của chúng.\n\nChúng một mực phủ nhận mọi liên can, nhưng mối quan hệ giữa đôi bên chắc chắn đã rạn nứt."
 shroud.5055.desc.galactic: "$shroud.5055.desc.common$ Sự tráo trở của chúng đã nhanh chóng lan truyền khắp thiên hà, giáng một đòn mạnh vào danh tiếng của [from.GetName]."

 shroud.5060.title: "$proxy_war_busted_modifier$"
 shroud.5060.desc.common: "Dù ta đã kích động xung đột thành công, nhưng mọi chuyện lại không diễn ra suôn sẻ như kế hoạch. Thông điệp của một đặc vụ đã bị chặn đứng, làm lộ tẩy toàn bộ hành tung mờ ám của ta cho tất cả các bên liên quan.\n\nTa có cố ngụy biện cũng chỉ là uổng công."
 shroud.5060.desc.galactic: "$shroud.5060.desc.common$ Vụ việc này không chỉ làm đổ vỡ quan hệ giữa ta và các phe tham chiến, mà còn bôi tro trát trấu vào danh tiếng của chúng ta trên toàn thiên hà."
 shroud.5060.desc.default: "$shroud.5060.desc.common$ Vụ việc này đã làm rạn nứt nghiêm trọng mối quan hệ giữa ta và các phe tham chiến."
 shroud.5060.a.tt: "Thái độ của các đế chế bị kéo vào §YChiến tranh Ủy nhiệm§! đối với chúng ta thay đổi: §R-200§!"

 proxy_war_busted_modifier: "Âm mưu Ủy nhiệm Bị Bại lộ"
 proxy_war_busted_modifier_desc: "Kế hoạch châm ngòi chiến tranh ủy nhiệm đã bị các phe tham chiến bóc trần. Việc này làm suy giảm uy tín của ta trên một phạm vi rất rộng."
 opinion_proxy_war_busted: "$proxy_war_busted_modifier$"

 PROXY_WAR_BUSTED_MESSAGE_TYPE_TITLE: "$proxy_war_busted_modifier$"
 PROXY_WAR_BUSTED_MESSAGE_TYPE_DESC: "Các đối thủ tham chiến đã phát hiện ra chúng ta chính là kẻ giật dây cuộc chiến tranh ủy nhiệm này.\n$shroud.5060.a.tt$"

 PROXY_WAR_REVEALED_MESSAGE_TYPE_TITLE: "$proxy_war_busted_modifier$"
 PROXY_WAR_REVEALED_MESSAGE_TYPE_DESC: "Chúng ta đã phát hiện §H$INSTIGATOR$§! đang ấp ủ mưu đồ kéo ta vào một cuộc chiến tranh ủy nhiệm.\nThái độ của ta đối với §H$INSTIGATOR$§! thay đổi: §R-200§!"

