 auth_shroud_democratic_corporeal: "Liên hiệp Duy tâm"
 auth_shroud_democratic_corporeal_desc: "Năng lượng Cõi Màn Che lan tỏa bình đẳng khắp đế chế, giảm bớt gánh nặng cho thể xác, gắn kết mọi công dân trong một cảm thức đoàn kết hiện thực lớn lao hơn."
