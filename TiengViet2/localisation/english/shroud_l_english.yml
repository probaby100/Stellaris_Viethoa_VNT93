 psi_fighting_conscription: "Lính Nghĩa Vụ Tâm Linh"
 psi_fighting_conscription_desc: "Các giác đấu sĩ tâm linh trong thế giới ngầm như hổ mọc thêm cánh cho lục quân của chúng ta, nhưng không phải tân binh nào cũng sẵn lòng kề vai sát cánh cùng họ."

 psi_fighting_conscription_gestalt: "$psi_fighting_conscription$"
 psi_fighting_conscription_gestalt_desc: "Các giác đấu sĩ tâm linh trong thế giới ngầm như hổ mọc thêm cánh cho lục quân, nhưng việc đưa những phần tử lỗi này vào khuôn khổ quân đội là một thử thách lâu dài."

 psi_fighting_research: "Nghiên Cứu Giác Đấu Tâm Linh"
 psi_fighting_research_desc: "Các giác đấu sĩ tâm linh trong thế giới ngầm quả là những đối tượng nghiên cứu tuyệt vời."

 psi_fighting_prohibition: "Lệnh Cấm Giác Đấu Tâm Linh"
 psi_fighting_prohibition_desc: "Từ khi phong trào giác đấu tâm linh bất hợp pháp bị triệt phá, thuộc địa của chúng ta đã an toàn hơn hẳn."

 psi_fighting_competitions: "Giải Đấu Giác Đấu Tâm Linh"
