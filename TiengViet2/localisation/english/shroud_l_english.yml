 civic_entropy_drinkers: "Kẻ Hút Cạn Entropy"
 civic_entropy_drinkers_desc: "$civic_ap_blockade_tt$\n\nXã hội này dùng mối liên kết tâm linh ký sinh để bòn rút năng lượng sống quý giá từ những cư dân nhàn rỗi. Lượng năng lượng thu gom được sẽ phân phát lại cho các tầng lớp quan trọng hơn."
 civic_entropy_drinkers_effects: "—Cho phép các §H$EDICTS$§! sau:$TABBED_NEW_LINE$—['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$—['edict:sanguine_council',$edict_sanguine_council$]$TABBED_NEW_LINE$—['edict:psychic_feast',$edict_psychic_feast$]\n—Có thể xây dựng: £building£['building:building_lifecrypt_1'].\n—Lãnh tụ bẩm sinh có đặc điểm ['concept_leader_trait_psionic']."
 civic_entropy_drinkers_psionic_modifier: "—$energy_with_icon$ tạo ra từ mỗi $pop_group_unit$ £pop£ dân tâm linh: §G+0.5§!"

 civic_entropy_drinkers_machine: "Cỗ Máy Hút Năng Lượng"
 civic_entropy_drinkers_machine_desc: "$civic_ap_blockade_tt$\n\nPhân bổ năng lượng hợp lý là yếu tố sống còn để duy trì hiệu năng tối đa cho các cỗ máy cấp cao. Mọi đơn vị đều được thiết kế xoay quanh mục tiêu này, cho phép ép xung định kỳ các nút cốt lõi khi cần thiết."
 civic_entropy_drinkers_machine_effects: "—Mở khóa các §H$EDICTS$§! sau:$TABBED_NEW_LINE$—['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$—['edict:sanguine_council_machine',$edict_sanguine_council_machine$]$TABBED_NEW_LINE$—['edict:psychic_feast',$edict_psychic_feast$]\n—Có thể xây dựng: £building£['building:building_lifecrypt_machine_1'].\n—Lãnh tụ khởi đầu có đặc điểm ['concept_leader_trait_psionic']."

 civic_entropy_drinkers_hive_mind: "Trật Tự Ký Sinh"
 civic_entropy_drinkers_hive_mind_desc: "$civic_ap_blockade_tt$\n\nCộng đồng này tận dụng mối liên kết tâm linh ký sinh để bòn rút năng lượng sống quý giá từ các đơn vị cấp thấp. Nguồn năng lượng thu gom được sẽ phân bổ lại cho các nhánh quan trọng hơn."
 civic_entropy_drinkers_hive_mind_effects: "—Mở khóa các §H$EDICTS$§! sau:$TABBED_NEW_LINE$—['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$—['edict:sanguine_council',$edict_sanguine_council$]$TABBED_NEW_LINE$—['edict:psychic_feast',$edict_psychic_feast$]\n—Có thể xây dựng: £building£['building:building_lifecrypt_hive_mind_1'].\n—Lãnh tụ khởi đầu có đặc điểm ['concept_leader_trait_psionic']."

 civic_entropy_drinkers_corporate: "Tập Đoàn Hút Máu"
 civic_entropy_drinkers_corporate_desc: "$civic_ap_blockade_tt$\n\n$gov_megacorporation$ này dùng mối liên kết tâm linh ký sinh để bòn rút năng lượng sống quý giá từ dân nhàn rỗi. Lượng năng lượng gom được sẽ phân phát lại cho các cấp quản lý cao hơn."
 civic_entropy_drinkers_corporate_effects: "—Mở khóa các §H$EDICTS$§! sau:$TABBED_NEW_LINE$—['edict:energy_drain',$edict_energy_drain$]$TABBED_NEW_LINE$—['edict:sanguine_council',$edict_sanguine_council$]$TABBED_NEW_LINE$—['edict:psychic_feast',$edict_psychic_feast$]\nCó thể xây dựng: £building£['building:building_lifecrypt_corporate_1'].\n—Lãnh tụ khởi đầu có đặc điểm ['concept_leader_trait_psionic'].\n—£building£§Y$building_executive_retreat$§!$megacorp_civic_branch_office_building_effect$"
 has_not_begun_non_psionic_ascension: "Chưa chọn con đường tiến hóa nào khác ngoài §YThăng Hoa Tâm Linh§!"
 has_not_begun_non_psionic_ascension_success: "$TRIGGER_PASS$$has_not_begun_non_psionic_ascension$"
 has_not_begun_non_psionic_ascension_fail: "$TRIGGER_FAIL$$has_not_begun_non_psionic_ascension$"

# Superstitious Beliefs
 civic_tooltip_not_superstitious_beliefs: "Không có loại triết lý quốc gia ['concept_superstitious_beliefs_civics']"

 civic_superstitious_beliefs_desc_common: "Trước mỗi quyết định quan trọng, phải tổ chức các nghi thức phù hợp để xoa dịu những thế lực vô hình có thể định đoạt số phận."
 civic_superstitious_beliefs_common_effects: "Mở khóa ['edict:galactic_dowsing',$edict_galactic_dowsing$]\nThay đổi ['concept_sb_cycle'] mỗi 13 năm.\nCác sự kiện số mệnh sẽ theo chu kỳ mang lại lợi ích hoặc gây tổn thất cho đế chế của bạn."

 civic_superstitious_beliefs: "Kẻ Mê Tín"
 civic_superstitious_beliefs_desc: "Xã hội này tuyên bố đã tìm ra cơ chế nghi thức có thể dự đoán tương lai thông qua việc nhận diện các khuôn mẫu bí ẩn và phân tích những điểm bất thường theo chu kỳ. $civic_superstitious_beliefs_desc_common$"
 civic_superstitious_beliefs_effects: "Thay thế:\n$t$—£job_priest£$job_priest_plural$ thành £job_superstitious_beliefs_priest£$job_superstitious_beliefs_priest_plural$\n$t$—£job_high_priest£$job_high_priest_plural$ thành £job_superstitious_beliefs_high_priest£$job_superstitious_beliefs_high_priest_plural$\n$civic_superstitious_beliefs_common_effects$"

 civic_machine_superstitious_beliefs: "Máy Nhận Diện Khuôn Mẫu"
 civic_machine_superstitious_beliefs_desc: "Đế chế máy móc này tuyên bố sử dụng hệ thống nhận diện khuôn mẫu phức tạp và phân tích bất thường theo chu kỳ để đưa ra các đáp án chưa từng có. Trước mọi quyết định quan trọng, việc phân tích sự sắp xếp của các thiên thể là bắt buộc để đảm bảo kết quả đầu ra là tối ưu nhất."
 civic_machine_superstitious_beliefs_effects: "$civic_superstitious_beliefs_common_effects$"

 civic_hive_superstitious_beliefs: "Trung Tâm Tinh Tượng"
 civic_hive_superstitious_beliefs_desc: "Tập thể này tuyên bố đã tìm ra cơ chế nghi thức có thể dự đoán tương lai thông qua việc nhận diện các khuôn mẫu phức tạp và phân tích bất thường theo chu kỳ. $civic_superstitious_beliefs_desc_common$"
 civic_hive_superstitious_beliefs_effects: "$civic_superstitious_beliefs_common_effects$"

 civic_corporate_superstitious_beliefs: "Tập Đoàn Bói Toán"
 civic_corporate_superstitious_beliefs_desc: "Tập đoàn này tuyên bố đã tìm ra cơ chế nghi thức dự đoán tương lai bằng cách nhận diện các khuôn mẫu phức tạp và phân tích những bất thường theo chu kỳ. Để tối đa hóa lợi nhuận, lợi ích tương lai, rủi ro thua lỗ và chỉ số KPI về sự sắp xếp thiên thể lý tưởng sẽ được đưa lên bàn cân cùng nhau."
 civic_corporate_superstitious_beliefs_effects: "Thay thế:\n$t$—£job_priest£$job_priest_plural$ thành £job_superstitious_beliefs_priest_corporate£$job_superstitious_beliefs_priest_corporate_plural$\n$t$—£job_high_priest£$job_high_priest_plural$ thành £job_superstitious_beliefs_high_priest_corporate£$job_superstitious_beliefs_high_priest_corporate_plural$\n$civic_superstitious_beliefs_common_effects$"

# Twisted Experimenters
 civic_twisted_experimenters: "Phán Quyết Thí Nghiệm"
 civic_twisted_experimenters_desc: "Quy trình tư pháp và khao khát tri thức đã hòa làm một trong xã hội này. Các nhà khoa học thuộc tổ chức tối mật tiến hành những cuộc thí nghiệm tàn nhẫn trên những đối tượng được chọn lọc từ thế giới ngầm. Một vài cái chết thỉnh thoảng xảy ra chỉ là cái giá phải trả cho sự tiến bộ."
 civic_twisted_experimenters_effects: "Khởi đầu với tình huống ['concept_experimental_testing'], khi hoàn thành sẽ nhận được bước tiến công nghệ.\nKhởi đầu với và có thể xây dựng: £building£['building:building_experimentation_chambers_1']\nTất cả nô lệ không phải máy móc đều có thể đảm nhận công việc nô lệ ['concept_slave_orderly'].\nCó thể chiêu mộ ['concept_slave_army']: §Y$abomination_army$§!"

 civic_twisted_experimenters_hive_mind: "Ý Thức Uốn Nắn"
 civic_twisted_experimenters_hive_mind_desc: "Những cá thể bất thường của tập thể này bị biến thành đối tượng cho các thí nghiệm khoa học mang tính đột phá và không bị giới hạn. Điều này giúp tận dụng tối đa những con ong thợ lỗi với vai trò là vật tư tiêu hao."
 civic_twisted_experimenters_hive_mind_effects: "Khởi đầu với tình huống ['concept_experimental_testing_hive_mind'], khi hoàn thành sẽ nhận được bước tiến công nghệ.\nKhởi đầu với và có thể xây dựng: £building£['building:building_experimentation_chambers_1']."

 civic_twisted_experimenters_corporate: "Nghiên Cứu Tư Pháp"
 civic_twisted_experimenters_corporate_desc: "$gov_megacorporation$ này đã thực hiện một nước đi táo bạo, vừa tối đa hóa đổi mới khoa học vừa nâng cao hiệu quả tư pháp. Những công dân có vấn đề được phân bổ lại vào các dự án nghiên cứu, trải qua các thí nghiệm khắc nghiệt để đạt được đột phá công nghệ. Chỉ số tử vong vẫn được duy trì trong mức dự kiến."
 civic_twisted_experimenters_corporate_effects: "Khởi đầu với tình huống ['concept_experimental_testing_corporate'], khi hoàn thành sẽ nhận được bước tiến công nghệ.\nKhởi đầu với và có thể xây dựng: £building£['building:building_experimentation_chambers_1']\nCó thể xây dựng £building£['concept_building_carceral_test_facility']$BRANCH_OFFICE_BUILDING$.\nTất cả nô lệ không phải máy móc đều có thể đảm nhận công việc nô lệ ['concept_slave_orderly'].\nCó thể chiêu mộ ['concept_slave_army']: §Y$abomination_army$§!"

 experimenters_we_will_learn_1: "Chúng ta có thể hưởng lợi rất nhiều."
 experimenters_we_will_learn_2: "Một phương pháp thí nghiệm hoàn toàn mới."
 experimenters_we_will_learn_3: "Các thông số thử nghiệm mới, thật thú vị."
 experimenters_tragic_lesson_1: "Chúng ta sẽ rút ra bài học từ những thảm kịch này."
 experimenters_tragic_lesson_2: "Quá thê thảm... nhưng cũng là cơ hội cho các thí nghiệm mới."
 experimenters_tragic_lesson_3: "Một bài học bi thảm, nhưng dữ liệu vẫn rất hữu ích."
 experimenters_ermerging_crime_1: "Môi trường thế này có thể mang đến cho các [GetExperimentalEngineerPlural] vô số cơ hội thí nghiệm."
 experimenters_ermerging_crime_2: "Ít nhất thì, loại tội phạm này cũng cho chúng ta đủ cơ hội để khám phá những hướng đi mới đầy kích thích trong nghiên cứu khoa học."
 experimenters_ermerging_crime_3: "Những tình huống khẩn cấp này sẽ cung cấp cho chúng ta vô vàn cơ hội thí nghiệm mới."
 experimenters_ermerging_crime_4: "Những đợt thí nghiệm như thế này quả là nguồn đối tượng thử nghiệm dồi dào cho các [GetExperimentalEngineerPlural] của chúng ta."

# Secret Societies
 civic_tooltip_not_secret_societies: "Không có loại triết lý quốc gia ['concept_secret_societies_civics']"

 civic_secret_societies: "Hội Kín"
 civic_secret_societies_desc: "Một nhóm nhỏ gồm giới tinh hoa và những kẻ bí ẩn giật dây mạng lưới chính trị phức tạp từ trong bóng tối của xã hội này, đan xen cả chính sách ngoại giao và nội bộ của các hành tinh khác."
 civic_secret_societies_effects: "Các ['concept_ss_factions'] bí ẩn sẽ xuất hiện khi tiếp xúc với các đế chế khác.\nKhởi đầu với khả năng tiến hành ['concept_proxy_wars'].\n$job_bureaucrat_plural_with_icon$ sẽ tạo ra $i_unity$ dựa trên các §Ycuộc chiến ủy nhiệm§! đang diễn ra và thành công.\nKhi bắt đầu trò chơi, thiết lập ['concept_first_contact'] với hai đế chế lân cận.\nSau §Y$first_contact$§!, nhận được $INFILTRATION_LEVEL$ đối với các đế chế khác: §G+$@secret_society_infiltration_gain|0$§!"

 civic_secret_societies_corporate: "Tập Đoàn Gây Ảnh Hưởng"
 civic_secret_societies_corporate_desc: "Các phòng ban quyền lực nhất của $gov_megacorporation$ này tiến hành các chiến dịch ngoài hành tinh trên cơ sở bảo mật tuyệt đối. Nếu bạn không biết, tức là bạn không cần phải biết."
 civic_secret_societies_corporate_effects: "Các ['concept_ss_factions'] bí ẩn sẽ xuất hiện khi tiếp xúc với các đế chế khác.\nKhởi đầu với khả năng tiến hành ['concept_proxy_wars'].\n$job_bureaucrat_plural_with_icon$ sẽ tạo ra $i_unity$ dựa trên các §Ycuộc chiến ủy nhiệm§! đang diễn ra và thành công.\nKhi bắt đầu trò chơi, thiết lập ['concept_first_contact'] với hai đế chế lân cận.\nSau §Y$first_contact$§!, nhận được $INFILTRATION_LEVEL$ đối với các đế chế khác: §G+$@secret_society_infiltration_gain|0$§!\n£building£§Y$building_corporate_embassy$§!$megacorp_civic_branch_office_building_effect$"

 shroud.5012.title: "Hội Kín Xuất Hiện"
 shroud.5012.desc: "Sự nghi ngờ của chúng ta đã được xác nhận. Nền văn minh của [first_neighbor.GetAdjective] và [second_neighbor.GetAdjective] xác thực rằng họ từng liên lạc qua các kênh không chính thức trước khi thiết lập quan hệ ngoại giao chính quy.\n\nGiờ đây, những §Hphe phái§! này đã bước ra khỏi bóng tối và thừa nhận sự tồn tại của mình. Họ được biết đến với các tên gọi §H$pft_the_curtain$§!, §H$pft_the_masquerade$§! và §H$pft_the_grand_dance$§!. Những tổ chức từng một thời hoạt động bí mật này hiện đang công khai yêu cầu đối thoại chính thức với chúng ta.\n\nVề việc họ muốn gì và làm thế nào họ biết được những thông tin đó, có lẽ chúng ta sẽ không bao giờ thực sự rõ. Nhưng vì lợi ích tốt nhất của mình, có lẽ chúng ta nên làm theo yêu cầu của họ."
 shroud.5012.a: "Vũ hội đã bắt đầu..."
 shroud.5012.tt: "§YCác phe phái thuộc Hội Kín§! sẽ sớm xuất hiện:\n$t$§H$pft_the_curtain$§!\n$t$§H$pft_the_masquerade$§!\n$t$§H$pft_the_grand_dance$§!"

 shroud.5013.title: "Mối Liên Hệ Kỳ Lạ"
 shroud.5013.desc: "Trong số chúng ta, có những người đang ngấm ngầm thao túng các vấn đề ngoại giao. Giờ đây, chúng ta nghi ngờ rằng vòi bạch tuộc của họ không chỉ dừng lại ở hành tinh mẹ.\n\nMặc dù chỉ mới bắt đầu khám phá các vì sao, chúng ta đã thiết lập liên lạc với các dạng sống khác ở một tốc độ đáng kinh ngạc. Việc này có vẻ không chỉ là sự trùng hợp. Chúng ta nghi ngờ rằng những mối quan hệ liên sao này bắt nguồn từ sự điều hành trong bóng tối của một vài §Hphe phái§! bí mật, và các phe phái này đã cắm rễ sâu vào xã hội của chúng ta.\n\nCó lẽ khi chúng ta hiểu biết nhiều hơn về những sinh vật này, thế lực ẩn nấp trong bóng tối sẽ tự khắc lộ diện."
 shroud.5013.a: "Họ ủng hộ chúng ta? Hay chống lại chúng ta?"

# Chosen
 civic_ap_blockade_tt: "§RCảnh báo: Vô hiệu hóa tất cả các đặc quyền thăng thiên ngoại trừ ['concept_psionic_ascension'].§!"
 civic_chosen: "Kẻ Được Chọn"
 civic_chosen_desc: "$civic_ap_blockade_tt$\n\nChịu ảnh hưởng của Cõi Màn Che từ thuở sơ khai trong lịch sử, xã hội này đã lập một khế ước với một thực thể hùng mạnh."
 civic_chosen_effects: "—Bắt đầu trò chơi với việc tiếp xúc cùng một §IChúa Tể Cõi Màn Che§!.\n—$ADDITIONAL_TECHNOLOGIES_STRING$£society£['technology:tech_psionic_aura']"
 civic_chosen_effects_additional: "—Nhận $i_unity$ dựa trên mức độ ['concept_attunement'] với Cõi Màn Che"

 civic_hive_chosen: "Bầy Đàn Được Chọn"
 civic_hive_chosen_desc: "$civic_ap_blockade_tt$\n\nChịu ảnh hưởng của Cõi Màn Che từ thuở sơ khai trong lịch sử, tập thể này đã lập một khế ước với một thực thể hùng mạnh."

 civic_machine_chosen: "Mạng Lưới Tiên Tri"
 civic_machine_chosen_desc: "$civic_ap_blockade_tt$\n\nChịu ảnh hưởng của Cõi Màn Che từ thuở sơ khai trong lịch sử, những cỗ máy này đã lập một khế ước với một thực thể hùng mạnh."

 civic_corporate_chosen: "Ban Quản Trị Được Chọn"
 civic_corporate_chosen_desc: "$civic_ap_blockade_tt$\n\nChịu ảnh hưởng của Cõi Màn Che từ thuở sơ khai trong lịch sử, tập đoàn này đã lập một khế ước với một thực thể hùng mạnh."
