 ACTION_START_PROXY_WAR_TITLE: "Phát động Chiến tranh Ủy nhiệm"
 ACTION_START_PROXY_WAR_DESC: "Kích động các đế chế khác gây chiến với §H[Recipient.GetName]§!."
 ACTION_START_PROXY_WAR_OFFER_DESC: "§H[Actor.GetName]§! đã phát động một cuộc chiến tranh ủy nhiệm nhắm vào §H[Recipient.GetName]§!."
 ACTION_START_PROXY_WAR_NO_ATTACKERS: "§R$TRIGGER_FAIL$Phải chọn một phe tấn công hợp lệ§!"
 NO_RELATION_CAN_DECLARE_WAR: "§R$TRIGGER_FAIL$Không có bất kỳ đế chế nào trong hệ thống liên lạc của ta có thể tuyên chiến với đế chế này§!"
 PROXY_WAR_ON_COOLDOWN: "§R$TRIGGER_FAIL$Ta phải đợi tới §Y[this.proxy_war_cooldown_timer]§! thì mới có thể khơi mào một cuộc chiến tranh ủy nhiệm mới.§!"
 SEND_TO_PROXY_WAR_NO_WAR_GOALS: "§R$COUNTRY|H$ không có mục tiêu chiến tranh khả dụng nào đối với $WHO|H$.§!"
 SEND_TO_PROXY_WAR_MISSING_REQUIREMENTS: "§RTa cần ít nhất $@proxy_war_min_trust|Y0$ $opinion_trust$ hoặc $@proxy_war_min_infiltration|Y0$ $spy_network$ với $COUNTRY|H$ mới có thể thuyết phục họ tham chiến.§!"

 PROXY_WAR_VIEW_DESC: "Hãy công bố mục tiêu chiến tranh cho phe tấn công để châm ngòi cuộc xung đột này."
 PROXY_WAR_VIEW_ATTACKERS_DESC: "§GThêm hoặc loại bỏ các phe tấn công bằng cách nhấn vào các mục trong danh sách bên trái§!"
 START_PROXY_WAR_COST: "$ACTION_START_PROXY_WAR_TITLE$$CLAIMS_COST$"
