#==========================
# Tutorials
#==========================

 TUTORIAL_SHROUD_TAB_TITLE: "Hướng dẫn: $THE_SHROUD_TITLE$"
 TUTORIAL_SHROUD_TAB_DESC: "Đây là thẻ §SCõi Màn Che§!. Bảng điều khiển bên trái hiển thị vị trí của đế chế bên trong Cõi Màn Che, được đại diện bởi các §SLãnh Địa Tâm Linh§! thuộc quyền quản lý của bốn thực thể tâm linh mạnh mẽ, hay còn gọi là các §SĐấng Bảo Trợ§!.\n\nVị trí hiện tại của ta được quyết định bởi §S$concept_attunement$§!, ta có thể nhận được nó bằng cách gây ấn tượng với một Đấng Bảo Trợ nào đó thông qua các hoạt động trong thế giới vật chất. Tích lũy đủ $concept_attunement$ sẽ giúp ta vạch trần được danh tính của vị Đấng Bảo Trợ đó. Một khi danh tính đã được hé lộ, bạn có thể nhấn vào lãnh địa của Đấng Bảo Trợ để mở bảng điều khiển riêng của họ.\n\nNhấn vào nút §S$DELVE$§! hoặc vị trí trung tâm của bảng điều khiển bên trái để thâm nhập vào Cõi Màn Che và khám phá cõi tâm linh. Trong suốt quá trình khám phá, vị trí $concept_attunement$ của chúng ta trong lãnh địa này có thể sẽ tác động đến các kết quả thu được."

 TUTORIAL_SHROUD_PATRON_TITLE: "Hướng dẫn: Đấng Bảo Trợ Cõi Màn Che"
 TUTORIAL_SHROUD_PATRON_DESC: "Bảng điều khiển §SĐấng Bảo Trợ§! sẽ hiển thị các thông tin và tùy chọn liên quan tới các Đấng Bảo Trợ trong Cõi Màn Che. Hoàn thành các §S$concept_callings$§! và §S$concept_deeds$§! sẽ giúp gia tăng §S$concept_attunement$§! của Đấng Bảo Trợ tương ứng.\n\nViệc gia tăng $concept_attunement$ sẽ giúp mở khóa các §S$PASSIVE_ACCORDS$§!, mang lại nhiều lợi ích cho đế chế. Khi $concept_attunement$ đạt đến một mức độ nhất định, ta có thể khởi động quá trình ký kết §SKhế Ước§! để nhận thêm vô vàn các hiệu ứng sức mạnh khác."

 TUTORIAL_SHROUD_COVENANT_TITLE: "Hướng dẫn: Khế Ước"
 TUTORIAL_SHROUD_COVENANT_DESC: "Chính thức ký kết một §SKhế Ước§! với một vị Đấng Bảo Trợ Cõi Màn Che sẽ giúp mở khóa các §S$ACTIVE_ACCORDS$§!. $tutorial.shroud_covenant.shared$"
 tutorial.shroud_covenant.shared: "Bạn có thể nhấn nút $ACTIVE_ACCORD$ để chi trả một khoản £sr_zro£ §S$sr_zro$§! và kích hoạt các hiệu ứng điều chỉnh tương ứng. Việc này có thể được thực hiện ngay tại bảng điều khiển Cõi Màn Che hoặc bảng điều khiển của Đấng Bảo Trợ.\n\nSau khi kích hoạt hiệu ứng, $ACTIVE_ACCORD$ sẽ cần một khoảng thời gian hồi chiêu trước khi có thể được tái sử dụng."

 TUTORIAL_SHROUD_SHAPING_TITLE: "Hướng dẫn: Điêu khắc Cõi Màn Che"
 TUTORIAL_SHROUD_SHAPING_DESC: "Giờ đây ta đã nắm được cách để giành lấy một vài dạng sức mạnh, và thường là phải đánh đổi bằng cách ký §SKhế Ước§! với một §SĐấng Bảo Trợ§!.\n\nNgay khi mở khóa thành công hai §S$PASSIVE_ACCORDS$§! của một Đấng Bảo Trợ, ta sẽ nhận được một §S$ACTIVE_ACCORD$§!. $tutorial.shroud_covenant.shared$"

 tutorial.2600.name: "Hướng dẫn: $PSIONIC_AURA_PLURAL$"
 tutorial.2600.desc: "Các thuộc địa có Dân số Tâm linh sinh sống sẽ có khả năng phát ra §S$PSIONIC_AURA$§!. Vầng hào quang này bắt nguồn từ §SĐấng Bảo Trợ Cõi Màn Che§! mà ta đang có chỉ số §S$concept_attunement$§! cao nhất.\n\nBên cạnh việc cung cấp đủ loại hiệu ứng đa dạng cho đế chế, các $PSIONIC_AURA_PLURAL$ còn có thể tác động tới cả các quốc gia thân thiện lẫn thù địch. Nếu muốn mở rộng phạm vi của hào quang, ta cần phải hòa hợp với Đấng Bảo Trợ sâu sắc hơn để mở khóa công nghệ £research£ §S$tech_aura_intensification$§!.\n\nBạn có thể kiểm tra sức mạnh của $PSIONIC_AURA$ bằng cách mở thẻ §SCõi Màn Che§! hoặc di chuột vào biểu tượng hào quang nằm ở bảng điều khiển £interface£ §SXem trước Hệ Sao§! ngay bên dưới."

 tutorial.2610.name: "Hướng dẫn: $tech_aura_intensification$"
 tutorial.2610.desc: "§S$PSIONIC_AURA$§! có thể cường hóa §SCường độ§! và phát tán ra những hệ sao xung quanh.\n\nCó tổng cộng ba cấp độ cường độ dành cho $PSIONIC_AURA_PLURAL$, mỗi cấp sẽ mang lại một hiệu ứng khác nhau. Mỗi khi nâng cấp cường độ hoặc khi đã đạt tới cường độ tối đa, $PSIONIC_AURA$ sẽ cố gắng lan rộng ra các hệ sao lân cận. Hầu hết các $PSIONIC_AURA_PLURAL$ đều có một giới hạn phát tán nhất định.\n\nCó rất nhiều cách để khuếch đại hào quang, chẳng hạn như nhân giống thêm Dân số mang đặc điểm $trait_psionic$, gia tăng £happiness£ §SHạnh phúc§!, mở rộng số lượng vị trí công việc £job_telepath£ [GetTelepathCap], và cuối cùng là bổ nhiệm các Thống đốc hoặc £leader£ Lãnh đạo sở hữu năng lực tâm linh vào các £sector£ Tinh khu."

 tutorial.2620.name: "Hướng dẫn: Xung đột Hào quang"
 tutorial.2620.desc: "§S$PSIONIC_AURA$§! có khả năng sẽ va chạm với một hào quang khác đang lây lan từ hệ sao lân cận. Trong trường hợp này, cả hai vầng hào quang sẽ phải tranh giành với nhau xem ai mới là kẻ thực sự làm chủ hệ sao đó.\n\nKết quả của trận chiến này sẽ phụ thuộc vào mức tăng §SCường độ§! mỗi tháng của cả hai bên, bạn có thể theo dõi quá trình này bằng cách di chuột vào biểu tượng hào quang nằm ở bảng điều khiển £interface£ §SXem trước Hệ Sao§! ngay bên dưới."

#==========================
# Technologies
#==========================
 tech_psionic_aura: "$PSIONIC_AURA$"
 tech_psionic_aura_desc: "Năng lượng tâm linh tỏa ra từ Cõi Màn Che có thể mang theo khát vọng của các thực thể thâm nhập vào thế giới thực. Bất kỳ đế chế nào thiết lập được sự cộng hưởng với một Đấng Bảo Trợ Cõi Màn Che đều có thể phát ra $PSIONIC_AURA$ từ những khu vực tập trung đông đảo Dân số Tâm linh."
 feature_unlock_psionic_aura: "$PSIONIC_AURA_PLURAL$"
 feature_unlock_psionic_aura_desc: "Cho phép các đế chế đã cộng hưởng với Đấng Bảo Trợ Cõi Màn Che phát ra $PSIONIC_AURA$ từ những khu vực dày đặc Dân số Tâm linh."
 psionic_aura_delve_success_tt: "Tỷ lệ thành công khi Lặn Tâm linh: §G+$@delve_success_tier_1|0$%§!"

 tech_aura_intensification: "Cường hóa $PSIONIC_AURA$"
 tech_aura_intensification_desc: "Năng lượng tâm linh rò rỉ từ Cõi Màn Che luôn khao khát được khuếch trương. Nhờ thấu hiểu nguyên lý này, các $PSIONIC_AURA_PLURAL$ của đế chế giờ đây đã có thể gia tăng cường độ và vươn mình dọc theo các hệ sao, qua đó tiếp thêm sức mạnh cho đồng minh và làm suy yếu kẻ địch."
 feature_allow_psionic_aura_intensity_spread: "Lan truyền $PSIONIC_AURA$"
 feature_allow_psionic_aura_intensity_spread_desc: "Cho phép các $PSIONIC_AURA_PLURAL$ lan truyền sang những hệ sao lân cận, với khoảng cách tối đa lên tới §Y[Owner.GetAuraHyperlaneRange]§! tuyến siêu không gian."
 feature_allow_psionic_aura_intensity_growth: "Tăng trưởng $PSIONIC_AURA$"
 feature_allow_psionic_aura_intensity_growth_desc: "Cho phép cường độ của các $PSIONIC_AURA_PLURAL$ được tiếp tục tăng trưởng."
 aura_intensification_delve_success_tt: "Tỷ lệ thành công khi Lặn Tâm linh: §G+$@delve_success_tier_2|0$%§!"

 tech_psionic_suppression: "Đàn áp Tâm linh"
 tech_psionic_suppression_desc: "Loại thiết bị có khả năng làm suy yếu năng lượng tâm linh này khó chế tạo đến mức ngang ngửa với việc cố gắng hiểu thấu nó. Can thiệp vào những thế lực liên chiều không gian vốn phức tạp như vậy đấy."
 tech_psionic_suppression_feature_tt: "$i_unlocks_feature$Mở khóa khả năng xây dựng §YPhong ấn Cõi Màn Che§! và §YMáy ức chế Tâm linh§!."

 tech_aura_resonation: "Cộng hưởng Hào quang"
 tech_aura_resonation_desc: "Có một phương pháp giúp phóng $PSIONIC_AURA_PLURAL$ vượt xa khỏi những hành tinh đông đúc dân cư. Chỉ cần sở hữu $sm_aura_emitter$, thì ngay cả một Căn cứ sao cũng có thể biến thành kênh dẫn cho năng lượng tâm linh tuôn trào từ Cõi Màn Che."

 tech_materiality_engine: "$building_materiality_engine$"
 tech_materiality_engine_desc: "$building_materiality_engine_desc$"

 tech_psionic_bombers: "Máy bay Ném bom Tâm linh"
 tech_psionic_bombers_desc: "Những chiếc phi cơ hạm tàu nhỏ gọn và linh hoạt này được thiết kế chuyên biệt để rải thảm lượng đạn dược chứa năng lượng tâm linh đậm đặc. Mục tiêu càng lớn, sức cộng hưởng của vụ nổ sẽ càng mạnh."
 tech_bio_psionic_bombers: "$tech_psionic_bombers$"

 tech_psionic_lightning: "Sét Tâm linh"
 tech_psionic_lightning_desc: "Thông qua việc thiết lập một liên kết tâm linh tạm thời giữa các phi thuyền, ta có thể trực tiếp phóng ra một luồng năng lượng ý thức gây nên sức tàn phá khủng khiếp. Dạng năng lượng nguyên thủy này thừa sức làm tê liệt hệ thống của phi thuyền và nhiễu loạn tâm trí của phi hành đoàn bên trong."
 tech_bio_psionic_lightning: "$tech_psionic_lightning$"

 ship_terrify_tt: "Có khả năng khiến tàu quân sự rơi vào trạng thái ['concept_terrify'] trong £time£ §Y5-10§! ngày, tùy thuộc vào kích cỡ của tàu mục tiêu."
 concept_terrify: "Khiếp sợ"
 concept_terrify_desc: "Những tàu bị khiếp sợ sẽ ngay lập tức ngừng tấn công và tháo chạy khỏi hướng của kẻ địch."

 tech_psionic_disruptor: "Pháo Phân rã Tâm linh"
 tech_psionic_disruptor_desc: "Loại pháo phân rã tối tân này có khả năng phóng ra những luồng thương quang năng lượng tâm linh mạnh mẽ xuyên thủng vỏ tàu, qua đó vô hiệu hóa hệ thống vũ khí của địch một cách chuẩn xác."
 tech_bio_psionic_disruptor: "$tech_psionic_disruptor$"

 tech_zro_launcher: "Bệ phóng Zro"
 tech_zro_launcher_desc: "Loại đạn chứa lượng lớn $zro_lower$ siêu đậm đặc này có khả năng dịch chuyển pha giữa các thực tại đan xen, giúp nó dễ dàng xuyên qua mọi lớp lá chắn của đối phương mà không gặp bất cứ trở ngại nào. Ngay khi va chạm với vật chất thật, sức tàn phá của nó sẽ được nhân lên theo cấp số nhân."
 tech_bio_zro_launcher: "$tech_zro_launcher$"

