 # End of the Cycle
 shroud.4715.desc.intro: "Hoàn thành. Chúng ta đã ký giao ước với $end_of_the_cycle_color_article$. Ngay khi thỏa thuận được thực hiện, các [GetTelepathPlural] đồng thanh nói: §R“Thời điểm đã tới.”§!"
 shroud.4715.desc.default: "$shroud.4715.desc.intro$\n\nSau đó là sự tĩnh lặng. Sự tĩnh lặng sâu thẳm khó lường, lấp đầy tâm trí của mọi [root.GetSpeciesAdj]. Nguồn năng lượng của §HCõi Màn Che§! từng cuộn trào trong mỗi ý thức của chúng ta, nhưng giới tâm linh giờ đây tĩnh lặng như thể đã chết.\n\nChúng ta bắt đầu phải suy nghĩ về những quả đắng mà chính mình đã gieo rắc."
 shroud.4715.desc.hive: "$shroud.4715.desc.intro$\n\nSau đó là sự tĩnh lặng. Sự tĩnh lặng sâu thẳm khó lường, lấp đầy tâm trí của mọi [root.GetSpeciesAdj]. Nguồn năng lượng của §HCõi Màn Che§! từng cuộn trào bên trong [GetBrainName], nhưng giới tâm linh giờ đây tĩnh lặng giống như thể không còn tồn tại nữa.\n\nChúng ta buộc phải bắt đầu tính toán hậu quả mà mình tự mang lại."
 shroud.4715.desc.gestalt_machine: "$shroud.4715.desc.default$"
 shroud.4715.desc.individual_machine: "$shroud.4715.desc.default$"
 shroud.4715.a.default: "Cầu mong ý muốn của Ngài nhân từ."
 shroud.4715.a.gestalt: "$shroud.4715.a.default$"

 shroud_whisperers_covenant_chain_title: "$whisperers_covenant_chain_title$"
 shroud_whisperers_covenant_chain_desc: "Chúng ta đã thiết lập một sợi dây liên kết với một thực thể Cõi Màn Che có tên là $whisperers_in_the_void_color_article$. Đi kèm với cảm giác khó hiểu, nó đòi một cái giá nhất định để hứa ban cho chúng ta chút sức mạnh nhỏ nhoi.\n\nCác [GetTelepathPlural] của chúng ta kết luận rằng, nếu giữ sự nhất quán với Đấng bảo trợ, sợi dây liên kết này sẽ dễ dàng được củng cố.\n\nTiếng thì thầm yêu thích tri thức mới, những bí mật tĩnh lặng và các âm mưu. Họ say mê một niềm vui đơn giản, một niềm vui tràn đầy tâm trí, vỡ nứt ra tại các đường nối."
 shroud_whisperers_covenant_chain_begin: "$whisperers_covenant_chain_begin$"
 shroud_whisperers_covenant_chain_end: "$whisperers_covenant_chain_end$"

