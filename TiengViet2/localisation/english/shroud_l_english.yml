 shroud.3000.title: "Ấn tượng Thoáng qua"
 shroud.3000.desc: "Giữa vòng xoáy bóng tối, những ảo ảnh đằng xa chợt hiện ra rồi tan biến vào hư vô... Những tiếng gào thét tạp âm mơ hồ vọng lên khó hiểu. Ánh sáng chớp tắt, các tụ điểm nhiệt phình ra rồi co lại.\n\nCó vật gì đó đang chuyển động, xoay tròn một cách khó lý giải. Liệu đó là chính chúng ta, hay là Cõi Màn Che không ngừng chuyển động?\n\nThực thể đó đã tới gần, áp sát từ mọi phía cùng một lúc. Giọng nói trong tâm trí đột nhiên vang lên.\n\n§HNgươi thấy gì?§!"
 shroud.3000.a: "Chúng ta nhìn thấy một thế giới rực cháy."
 shroud.3000.a.reply: "Sức ép chuyển hướng; tiếng nói lại vang lên...\n\n§HTốt lắm.§!\n\nMàn sương đen nghiêng đi và xoay vòng. Có thứ gì đó đè nặng lên chúng ta, và rồi, chúng ta lại đột ngột cô độc giữa bóng tối."
 shroud.3000.b: "Chúng ta thấy một buổi lễ trọng đại."
 shroud.3000.b.reply: "Có thứ gì đó nặng nề đang run rẩy. Bóng tối chầm chậm ập xuống, ngày một đặc quánh...\n\n§HKHÔNG!§!\n\nKhoảng không hư vô nghiêng đi và xoay vòng. Đột nhiên, chúng ta lại đột ngột cô độc giữa bóng tối..."
 shroud.3000.c: "Chúng ta không chắc chắn."
 shroud.3000.c.reply: "§HYếu đuối!§!\n\nKhoảng không hư vô nghiêng đi và xoay vòng. Đột nhiên, chúng ta lại đột ngột cô độc giữa bóng tối..."

 shroud.3005.title: "Cơn đói Thèm khát"
 shroud.3005.desc: "Mùi hôi thối như nội tạng tràn ngập các giác quan.\n\nẢo ảnh bắt đầu trồi lên từ vực sâu Cõi Màn Che, quằn quại và gầm gừ trong cơn cuồng nộ tham lam. Đầu tiên là tiếng rống của những dã thú đang đói... Chúng ta thấu hiểu cơn đói của chúng. Và rồi, sự thèm khát của chúng cũng trở thành của chúng ta.\n\nNhững bóng đen dần xuất hiện, đó là lũ gia súc hoảng loạn. Con mồi. Đang dụ dỗ tiến lại gần... Nỗi đau nhức nhối tận xương tủy ngày càng khó chịu đựng.\n\nCơn đói dần gặm nhấm tâm trí, các giác quan trở nên méo mó và héo úa. Những tiếng thét thảm thiết kia là từ con mồi... hay từ sâu thẳm trong chính chúng ta?\n\nXiềng xích trói buộc siết chặt. Vỡ vụn cùng tiếng thét đau đớn xoáy sâu trong tâm trí:\n\n§HXé nát xương thịt! Mở tiệc!§!"
 shroud.3005.a: "Chặt đứt xiềng xích. Nuốt chửng con mồi."
 shroud.3005.a.boons.tt: "Nhận được một $shroud_boon$ liên quan đến chiến đấu."
 shroud.3005.a.reply: "Sự trói buộc bị bẻ gãy.\n\nTham lam. Giải phóng.\n\nSợ hãi!\n\n§HNuốt chửng.§!"
 shroud.3005.b: "Chống lại cơn đói. Tĩnh tâm lại."
 shroud.3005.b.reply: "Xiềng xích vững chắc. Sau khi chúng ta gạt bỏ sự ảnh hưởng, giọng nói tràn ngập tức giận, nhưng ý thức của ta đã bình tĩnh và giành lại quyền kiểm soát.\n\n§HYếu đuối! Bất lực!§!\n\nCơn đói rút đi, để lại sự hận thù dai dẳng mờ nhạt dần trong Cõi Màn Che."

 shroud.3010.title: "Bữa tiệc Hiến tế"
 shroud.3010.desc: "Có một giọng nói vang lên từ vực sâu... Khô khốc, tràn ngập ác ý... đang réo gọi chúng ta.\n\n§HCung phụng. Tiêu thụ. Nuốt chửng.§!\n\nẢo ảnh bất chợt ập đến. Từng hành tinh hóa thành tro tàn tĩnh lặng, xác thịt các [Root.GetCitizenPlural] của chúng ta bị bào mòn bởi tâm linh, cốt để làm thỏa mãn giọng nói này... và cả cơn đói của chính chúng ta.\n\nKhi những cảnh tượng ấy phơi bày, chúng ta cũng cảm nhận được một sự tồn tại khác, nó thúc giục ta phải kiềm chế và đoàn kết với [Root.GetCitizenPlural] của chính mình, cùng nhau phát triển lớn mạnh. Nhưng sự tồn tại ấy đã bị nhấn chìm bởi tiếng rống của ác ý."
 shroud.3010.desc.organic: "§HDâng máu thịt của chúng cho ta!§!"
 shroud.3010.desc.other: "§HDâng thể xác của chúng cho ta!§!"
 shroud.3010.a: "Nuốt chửng."
 shroud.3010.a.reply: "Tiếng than khóc của những kẻ bị nuốt chửng vang vọng cả Cõi Màn Che lẫn đế chế, rồi đột ngột chìm vào cõi im lặng.\n\nĐổi lấy sự hy sinh này, sức mạnh của chúng ta gia tăng khi cơn đói đã bị dập tắt."
 shroud.3010.b: "Đoàn kết."
 shroud.3010.b.reply: "Chúng ta kiềm chế giọng nói ấy, đoàn kết nhất trí hướng về Cõi Màn Che, ôm trọn đế chế của mình. Dù cơn đói trở nên cồn cào, tiếng thở phào nhẹ nhõm vang lên đồng loạt, sự an ủi đã xua tan những tiếng gào thét thịnh nộ."

 shroud.3015.title: "Ảo ảnh Chớp nhoáng"
 shroud.3015.desc: "Những dòng tâm linh mạnh mẽ va chạm vào nhau giữa màn đêm. Vô số bóng tối lướt qua lướt lại xung quanh... Phía trước có một luồng sáng lấp lánh.\n\nĐột nhiên, chỉ trong một khoảnh khắc, cảnh vật trước mắt trở nên rõ ràng và dễ nhận biết. Nhưng hình dáng của nó lại biến mất trước khi chúng ta kịp nắm bắt.\n\nMột tồn tại kỳ lạ đã đến bên cạnh.\n\n§HNgươi đã thấy thứ gì?§!"
 shroud.3015.a: "Chúng ta thấy một khu rừng tràn đầy sức sống."
 shroud.3015.a.reply: "Sự tĩnh lặng tăng dần. Giọng nói ấy đã trở lại...\n\n§HTốt lắm.§!\n\nMột luồng hơi ấm mãnh liệt cuộn trào khắp cơ thể chúng ta, rồi chợt tan biến. Tồn tại đó đã rời đi."
 shroud.3015.b: "Chúng ta thấy một vùng đất hoang vu, không có gì cả."
 shroud.3015.b.reply: "Giọng nói ấy đã trở lại...\n\n§HKhông đời nào!§!\n\nMột sự buốt giá tột độ bao trùm lấy chúng ta, rồi chợt tan biến. Tồn tại đó đã rời đi."
 shroud.3015.c: "Chúng ta không chắc chắn."
 shroud.3015.c.reply: "Giọng nói ấy đã trở lại...\n\n§HThật tẻ nhạt.§!\n\nMột sự trống rỗng cùng cực đè bẹp chúng ta, rồi chợt tan biến. Tồn tại đó đã rời đi."

 shroud.3020.title: "Sự che chở Cám dỗ"
 shroud.3020.desc: "Giữa những tầng lớp Cõi Màn Che xếp chồng lên nhau, một ảo cảnh trải rộng ra trước mắt.\n\nMàn sương đặc quánh tạo thành hình bóng một sinh vật đang quằn quại, những xúc tu mờ ảo quấn chặt lấy nó, không thể cử động, thoi thóp chờ chết.\n\nBản thân sinh vật này là thứ mà chúng ta chưa từng thấy qua.\n\nMột giọng nói vang vọng bên trong tâm trí.\n\n§HSợi dây định mệnh đang kêu gọi! Ngươi sẽ kéo đầu nào?§!"
 shroud.3020.a: "Giải phóng sinh vật."
 shroud.3020.a.reply: "Giọng nói vang vọng trong [GetMindLoc] của chúng ta, sinh vật đó cũng mờ dần khỏi tầm nhìn.\n\n§HPhồn vinh.§!\n\nMột cảnh tượng khác xẹt qua chớp nhoáng — ở một nơi nào đó trong đế chế, sự sống đã hồi sinh."
 shroud.3020.b: "Tóm lấy nó."
 shroud.3020.b.reply: "Giọng nói rút khỏi suy nghĩ của chúng ta, chỉ để lại một tiếng bi thương kéo dài, vang vọng giữa khung cảnh hoang tàn.\n\n§HGây nghiệp.§!"
 shroud.3020.c: "Giết nó."
 shroud.3020.c.swarm: "Nuốt chửng nó."
 shroud.3020.c.reply: "Một sự thôi thúc áp đảo xâm chiếm tâm trí, gạt phăng giọng nói kia sang một bên. Khát khao đẫm máu lấp đầy [GetMindLoc], tiếng cười tàn nhẫn vang vọng trong cõi hư vô.\n\n§HPhải thế chứ! Tàn sát!§!"

 shroud.3025.title: "Cảnh vật Biến đổi"
 shroud.3025.desc: "Vén bức màn sương mù của Cõi Màn Che, vô số những huyễn cảnh đan xen hiện ra.\n\nKhung cảnh mờ ảo biến hóa kỳ lạ ngay trước mắt. Những dãy núi nhấp nhô. Đại dương hỗn loạn sôi sục rồi bốc hơi, để lại bộ xương trắng hếu của những sinh vật biển giữa sa mạc vô tận.\n\nDưới tán rừng rậm rạp, những sinh vật hiền lành luồn lách qua nơi trú ẩn, rồi chợt co giật, biến dị thành những con quái vật khát máu. Chúng xé xác lẫn nhau, rơi vào vòng luân hồi bất tận của sự sống và cái chết.\n\nMột giọng nói xuyên qua mớ hỗn độn này, đâm thẳng vào [GetMindLoc] của chúng ta.\n\n§HThật vô trật tự. Lấy dây buộc mình.§!"
 shroud.3025.a: "Bắt tự nhiên phải cúi đầu trước ý chí của chúng ta."
 shroud.3025.a.reply: "Chúng ta vươn tay ra, nắm lấy sự hỗn loạn trước mắt.\n\nKhống chế cảnh vật, khiến lục địa ngừng chuyển động.\n\nSau khi gom mọi mảnh vỡ lại với nhau, giọng nói lại vang lên.\n\n§HĐơn điệu, nhạt nhẽo, trống rỗng...§!"
 shroud.3025.b: "Mặc cho sự vô trật tự của tự nhiên đâm chồi nảy lộc."
 shroud.3025.b.reply: "Chúng ta tĩnh lặng quan sát huyễn cảnh này. Vòng lặp bất tận kia trở nên nhạt nhòa, vỡ tung ra rồi đột ngột dừng lại giống hệt lúc bắt đầu.\n\nNăng lượng cuộn trào trong sự bao la vô bờ bến này, sau đó định hình lại thành một trạng thái mới.\n\nGiọng nói lại vang lên.\n\n§HHòa bình là xung đột. Vô trật tự chính là hài hòa.§!"
 shroud.3025.b.reply.tt: "Hành tinh nhận được ngẫu nhiên một §Gchỉ số tích cực§! và một §Rchỉ số tiêu cực§!."

 shroud.3030.title: "Lăng kính trong Đêm tối"
 shroud.3030.desc: "Cõi Màn Che không ngừng khuấy động, để lộ ra một bãi cát đen rộng lớn. Những con sóng vỡ tan, chỉ nghe tiếng chứ không thấy hình.\n\nPhía trước, hoặc nơi có lẽ được gọi là phía trước, một lăng kính xuất hiện. Một luồng sáng rọi vào nó, ngay lập tức khúc xạ tạo nên một hình ảnh mờ ảo.\n\nVô số những cái bóng mờ mịt và những hình dạng lay động thoáng hiện ra, rồi lại bị bóng tối nuốt chửng.\n\nTrên bãi cát gần đó, có một sự tồn tại.\n\n§HThứ được phơi bày chính là thứ được nhìn thấy, phải không?§!"
 shroud.3030.a: "Chúng ta nhìn thấy vô vàn giọng nói tụ hội."
 shroud.3030.a.reply: "Bãi cát chầm chậm chảy dài, giọng nói đã trở lại.\n\n§HTốt lắm. Hài hòa chính là đạo lý của vũ trụ.§!\n\nChúng ta cảm nhận được thứ gì đó nặng nề. Sau đó lại trở về với sự cô độc."
 shroud.3030.b: "Chúng ta nhìn thấy sự chết chóc trong chiến trận."
 shroud.3030.b.reply: "Cát đột nhiên cuộn lên với tốc độ như một cơn bão.\n\n§HKhông. Nên bẻ gãy binh khí, quên đi chiến tranh!§!\n\nBão cát lắng xuống. Giọng nói ấy đã rời đi."
 shroud.3030.c: "Chúng ta không chắc chắn."
 shroud.3030.c.reply: "Cát chầm chậm chảy dài.\n\n§HSự do dự sẽ ươm mầm thất bại...§!\n\nChúng ta lại trở về với sự cô độc."

 shroud.3035.title: "Tranh đấu trong Bóng tối"
 shroud.3035.desc: "Vô số năng lượng hỗn loạn trong Cõi Màn Che đang cuộn trào không ngớt.\n\nNhững xúc tu bóng tối xoáy tròn và đâm tủa ra ngoài, bản thân màn sương cũng đang cuộn lên dữ dội. Trong vòng xoáy năng lượng tâm linh, hai thực thể vô hình đang giao tranh. Chúng không hề ngơi nghỉ, không ai nhường ai, ngập tràn trong cơn thịnh nộ.\n\nMột ý thức kỳ lạ xâm nhập vào [GetMindPhysicalLoc] của chúng ta, nó bao la vô tận nhưng cũng đầy tính uy hiếp.\n\n§HKẻ đến nơi này phải dâng lên phương sách tốt.§!"
 shroud.3035.a: "Đối thoại đúc kết thấu hiểu."
 shroud.3035.a.reply: "Màn sương tan dần, hòa tan vào vòng xoáy tâm linh ở phía sau. Ý thức kia đã trở lại.\n\n§HHài hòa chính là trí tuệ!§!\n\nCõi Màn Che giờ đây đã trở nên tĩnh lặng."
 shroud.3035.b: "Thỏa hiệp là biểu hiện của sự yếu kém."
 shroud.3035.b.reply: "Theo mỗi đòn giáng xuống của màn sương, năng lượng xung quanh ta càng thêm sục sôi.\n\n§HBạo lực là phần thưởng cho sự ngu dốt.§!\n\nCác dòng năng lượng trong Cõi Màn Che lại bắt đầu co giật."

 shroud.3040.title: "Cảnh tượng Chưa từng thấy"
 shroud.3040.desc: "Một vũng chất lỏng đen ngòm trải rộng ra trước mắt.\n\nĐột nhiên, trên mặt chất lỏng chớp lên một ảo ảnh mờ nhạt. Chúng ta thoáng thấy một đỉnh núi sáng rực, mọi nếp gấp đều nạm viền vàng chói lọi, rồi nó lại chợt tan biến.\n\nMột tiếng nói vang vọng tận sâu trong [GetMindLoc] của chúng ta.\n\n§HNgươi có nhìn thấy thứ chưa từng xuất hiện không?§!"
 shroud.3040.a: "Chúng ta đã thấy một mỏ đá đang chờ được khai quật."
 shroud.3040.a.reply: "Từng gợn sóng lan tỏa đồng bộ. Chúng ta lại cảm nhận được giọng nói ấy.\n\n§HSự tăng trưởng vô biên duy trì sự cân bằng vô lượng.§!\n\nKhi chất lỏng phẳng lặng trở lại, chúng ta cảm thấy giọng nói đó đã rời đi."
 shroud.3040.b: "Chúng ta thấy một thiên nhiên hoàn mỹ cần được bảo vệ."
 shroud.3040.b.reply: "Vũng chất lỏng bắt đầu dao động. Từng đợt sóng cuồn cuộn vỗ bờ. Một vòng xoáy xoay tròn trong bóng tối. Giọng nói ấy dội về với cường độ mãnh liệt hơn.\n\n§HKhông thể chấp nhận! Tăng trưởng là cướp đoạt! Tăng trưởng là cướp đoạt!§!\n\nMặt chất lỏng lại tĩnh lặng. Giọng nói ấy đã rời đi."
 shroud.3040.c: "Chúng ta không chắc chắn."
 shroud.3040.c.reply: "Chất lỏng gợn sóng. Giọng nói lại hiển hiện.\n\n§HNiềm tin đang lung lay... Ý chí của ngươi có lỗ hổng.§!\n\nKhi chất lỏng phẳng lặng trở lại, chúng ta cảm thấy giọng nói đó đã rời đi."

 shroud.3045.title: "Lõi Sáng rực"
 shroud.3045.desc: "Lớp sương mù dày đặc tái cấu trúc trước mắt chúng ta. Dòng năng lượng rực lửa đập mạnh từng nhịp. Chúng ta nhìn thấy bóng dáng kỳ lạ của một cái cây.\n\nLại gần xem xét, tán cây khổng lồ của nó chớp tắt hỗn loạn giữa sắc tím, hồng và đen.\n\nBên dưới gốc cây là một phần lõi sáng rực, đồng điệu phát sáng cùng sự đổi màu của tán cây.\n\nMột tiếng nói đọng lại trong [GetMindLoc] của chúng ta.\n\n§HChiếm hữu. Đoạt lấy. Lợi dụng.§!"
 shroud.3045.a: "Móc nó ra."
 shroud.3045.a.reply: "Lõi được lấy ra, tán cây mờ đi rồi lập tức khô héo. Tiếng lòng đó lại vang lên.\n\n§HĐúng vậy! Phải phá hủy mới có thu hoạch.§!"
 shroud.3045.b: "Giữ nguyên hiện trạng."
 shroud.3045.b.reply: "Một cơn chấn động truyền qua cơ thể chúng ta. Không rõ thế giới này đang rung chuyển, hay chính là chúng ta?\n\n§HPhát triển mới có ý nghĩa. Trốn tránh là ngu ngốc!§!"

 shroud.3050.title: "Chói tai chia cắt"
 shroud.3050.desc.intro: "Các luồng tâm linh mạnh mẽ va chạm và thiêu đốt trong vòng xoáy vô tận của Cõi Màn Che. Một tiếng gầm chói tai không ngừng lớn lên, thu hút sự chú ý của chúng ta."
 shroud.3050.desc.outro: "Tiếng ồn thật khó chịu đựng."
 shroud.3050.desc.eater: "Tiếng la hét đau đớn, tiếng sấm sét của thú vui chiến tranh, ngọn lửa nuốt chửng ầm ầm. Chúng ta có thể cảm thấy đau đớn... nhưng đây là của ai?"
 shroud.3050.desc.composer: "Tiếng gào thét khóc lóc, thú tính, hoang dã, nguyên thủy... Sông cuồn cuộn chảy, gió lớn rít gào... Cả thiên nhiên cùng lúc sủa gào, vô cùng cấp bách..."
 shroud.3050.desc.cradle: "Đủ loại tiếng lòng đang thì thầm, lầm bầm, thảng thốt, tuyên cáo... Vô số ngữ điệu, âm tiết, âm thanh... Nhiều ngôn ngữ đang cùng lúc giao tiếp."
 shroud.3050.desc.instrument: "Mũi khoan đục lỗ, máy móc nghiền nát... Vật chất bị ép biến đổi trong tiếng ồn khổng lồ... Mọi nhà máy trong vũ trụ cùng lúc bùng lên ngọn lửa."
 shroud.3050.a: "Ở lại bên cạnh."
 shroud.3050.a.reply: "Sự gia tăng này dần dần tích tụ. Chúng ta đột nhiên bị đẩy về một hướng không thể hiểu nổi...\n\nCuối cùng, chúng ta lại chìm vào im lặng."
 shroud.3050.b: "Quay lưng từ chối."
 shroud.3050.b.reply: "Thật không thể chịu đựng nổi. [GetMindLoc] của chúng ta lùi lại, quay về với sự tĩnh lặng thoải mái."

 shroud.3055.title: "Ảo ảnh tiên tri"
 shroud.3055.desc.intro: "Một sự u ám nặng nề bao trùm lấy chúng ta. Áp lực từ bốn phương tám hướng ép tới ngày càng chặt. Cho đến khi một cảnh tượng mờ ảo hiện ra."
 shroud.3055.desc.outro: "Trong bóng tối âm u, có một thứ thu hút sự chú ý của chúng ta. Không nghi ngờ gì nữa, đó là lá cờ của [Root.GetName].\n\nĐây là chúng ta sao?"
 shroud.3055.desc.eater: "Chúng ta thấy một hành tinh tàn tạ, hậu quả sau chiến tranh... Những kẻ chiến thắng đang lục lọi xác chết và đống đổ nát."
 shroud.3055.desc.composer: "Chúng ta thấy rất nhiều hành tinh... du hành qua không thời gian theo những cách không tưởng... Tất cả giống như đã được thống nhất bởi một đế chế."
 shroud.3055.desc.cradle: "Chúng ta thấy một cuộc tụ họp lớn... nhiều bóng người mờ ảo... đang nghe, đang nói."
 shroud.3055.desc.instrument.default: "Chúng ta thấy một hành tinh lý tưởng... những dãy nhà máy và khu mỏ vô tận... không một tấc đất nào trên bề mặt chưa được khai thác."
 shroud.3055.desc.instrument.relentless_industrialist: "Chúng ta thấy một hành tinh lý tưởng... những dãy nhà máy và khu mỏ vô tận... sự hoàn hảo thuần túy. Không một tấc đất nào trên bề mặt chưa được khai thác."
 shroud.3055.a: "Giữ vững ảo ảnh này."
 shroud.3055.a.reply: "Cảnh tượng rõ ràng hơn một chút. Chúng ta tràn đầy tự tin vào góc nhìn của mình."
 shroud.3055.b.organic: "Đuổi nó ra khỏi tâm trí chúng ta."
 shroud.3055.b.machine: "Xóa nó khỏi mạch điện của chúng ta."
 shroud.3055.b.reply: "Rìa rõ nét của cảnh tượng tan biến về hư vô."

 shroud.3060.title: "Giữa chốn hư không"
 shroud.3060.desc.intro: "Lớp sương mù mờ ảo của Cõi Màn Che cuộn xoáy vặn vẹo, kéo nhận thức của chúng ta vào sâu thẳm, chỉ để lại cơ thể bất động tại chỗ.\n\n[GetPsycheLoc] của chúng ta hết lần này đến lần khác kéo căng rồi co lại, mắc kẹt trong những đợt thủy triều lặp đi lặp lại. Mỗi hành động có ý thức đều tự sụp đổ, lực căng siết chặt, như bị kẹp trên ê tô."
 shroud.3060.desc.intro.organic: "Chúng ta nhìn thấy bản thân trong quá khứ, cơ thể bị phong ấn trong một khối lập phương nhiều lớp, vượt ngoài hiểu biết vật lý của chúng ta."
 shroud.3060.desc.intro.machine: "Tiến trình con logic khởi động, phát hiện lỗi: Vòng lặp đệ quy. Bộ xử lý tâm linh của chúng ta không thể phá vỡ luân hồi và khôi phục chức năng bình thường."
 shroud.3060.desc.intro.end: "Lực căng dần trở nên không thể chịu đựng nổi, hình thể của chúng ta có nguy cơ tan biến vào hư không. Một tiếng lòng đã tháo gỡ trói buộc cho chúng ta."
 shroud.3060.desc.outro: "Lời nói đó cộng hưởng với chính chúng ta. Đà này ngày càng mạnh, và chúng ta nhận ra mình có thể xoa dịu sự hỗn loạn gần như xé rách chúng ta này, chỉ cần chúng ta khuất phục."
 shroud.3060.desc.eater: "§HNuốt chửng! Ăn sạch khoảng hư không vô tận này!§!"
 shroud.3060.desc.composer: "§HVượt qua giới hạn vô cực của đệ quy!§!"
 shroud.3060.desc.cradle: "§HHãy đón nhận sự vĩnh hằng! Vạn vật quy về một mối mới được trọn vẹn!§!"
 shroud.3060.desc.instrument: "§HHãy chìm đắm vào sức mạnh vô tận!§!"
 shroud.3060.a: "Phục tùng."
 shroud.3060.a.reply: "Tiếng lòng lớn dần, dẫn dắt chúng ta, ép tâm trí vượt qua sự hiểu biết hạn hẹp. Vòng lặp này vẫn tiếp diễn——co thắt, rồi lại kéo căng hơn——cho đến khi xé nát tâm hồn chúng ta.\n\nChúng ta cầu xin sự dẫn dắt của thế lực cao hơn trong Cõi Màn Che, giúp chúng ta phá vỡ vòng lặp.\n\nTuy nhiên, không phải tất cả mọi người đều bình an vô sự. §H[event_target:shroud_warped_leader.GetName]§! đã không còn tại vị. Tiếng lòng đó lại vang lên."
 shroud.3060.a.reply.default: "Hắn sẽ có được cuộc sống mới."
 shroud.3060.a.reply.eater: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.a.reply.composer: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.a.reply.cradle: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.a.reply.instrument: "§H$shroud.3060.a.reply.default$§!"
 shroud.3060.b: "Kháng cự."
 shroud.3060.b.reply: "Chúng ta cự tuyệt sự kích động bị áp đặt đó.\n\nVòng lặp tăng tốc, dùng sức mạnh của đợt thủy triều đệ quy kéo chúng ta xuống. Nếu chúng ta ngừng vùng vẫy, lực căng này sẽ không còn xé rách mà bao dung lấy chúng ta, cho chúng ta thoáng thấy được những thứ ngoài bản thân mình.\n\nTiếng lòng lại vang lên."
 shroud.3060.b.reply.default: "Thật tẻ nhạt."
 shroud.3060.b.reply.eater: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.b.reply.composer: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.b.reply.cradle: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.b.reply.instrument: "§H$shroud.3060.b.reply.default$§!"
 shroud.3060.leader_return.title: "Cõi Màn Che vặn vẹo"
 shroud.3060.leader_return.desc: "Cõi Màn Che run rẩy, sự biến dạng yếu ớt khuấy động trong [GetMindPhysicalLoc] của chúng ta, một sự hiện diện quen thuộc lộ diện. Ngài khuấy động rìa [GetMindPerceptionLoc] của chúng ta, những tiếng thì thầm vang vọng vượt quá giới hạn thính giác của chúng ta.\n\n§H[from.GetName]§! đã trở lại bên chúng ta, chuyển đổi qua các hình dạng trong màn sương mù khó tả. [from.GetHisHer] rất xa xăm nhưng vẫn trọn vẹn, sau khi được Cõi Màn Che đúc kết lại đang khao khát được quay về vị trí."
 shroud.3060.leader_return_tt: "§H[from.GetName]§! đã nhận được đặc điểm mới: §G$leader_trait_shroud_warped$§!"

 leader_trait_shroud_warped: "Cõi Màn Che vặn vẹo"
 leader_trait_shroud_warped_desc: "Bị Cõi Màn Che hấp thụ rồi tái tạo, ước nguyện từ cõi ngoài giáng xuống người này giúp họ có được khả năng quan sát những điều không thể quan sát, tiềm năng tâm linh của họ cũng nhân lên gấp bội."
 leader_trait_shroud_warped_invasion_effect: "Điểm tình báo đối với đế chế địch mỗi lần xâm lược thắng lợi: §G+$@shroud_warped_intel|0$§!"

 shroud.3065.title: "Được ban Chén Thánh"
 shroud.3065.desc.intro: "Màn sương dày của Cõi Màn Che run rẩy tan đi, hé lộ một chiếc Chén Thánh nhẵn bóng không tì vết, bên trong đựng đầy chất lỏng lấp lánh.\n\nChúng ta bị một sự thôi thúc khó hiểu chi phối, không suy nghĩ mà bước tới. Chúng ta bắt đầu [GetDrinkLoc] thứ chất lỏng đang chờ đợi này, và nó cũng bắt đầu run rẩy.\n\nMột sự tỉnh táo dâng trào trong tâm trí. Chúng ta [GetImbibeLoc] càng nhiều, lời nói dối này càng lộ rõ. Chất lỏng bắt đầu đặc lại, từng giọt từng giọt kết tủa trong cơ thể.\n\nChúng ta bị khuất phục bởi sự thôi thúc thanh tẩy sự ô uế trong cơ thể."
 shroud.3065.desc.eater: "§HNuốt xuống đi! Uống cạn sự hèn nhát của ngươi!§!"
 shroud.3065.desc.composer: "§HNuốt xuống đi! Hút vào sự phát triển mới!§!"
 shroud.3065.desc.cradle: "§HMạnh lên đi! Đón nhận sự liên kết đau đớn!§!"
 shroud.3065.desc.instrument: "§HBuông thả đi! Đắm chìm vào sở thích của ngươi!§!"
 shroud.3065.desc.outro: "Âm thanh này xoáy tròn hòa quyện với chất lỏng, không ngừng kết tủa trong cơ thể, khiến chúng ta khuất phục trước ý chí của Ngài."
 shroud.3065.a.organic: "Uống cạn."
 shroud.3065.a.machine: "Xử lý."
 shroud.3065.a.reply.intro: "Giọt chất lỏng cuối cùng được nuốt xuống, nó đặc quánh đến phát buồn nôn, tích tụ trong cơ thể, làm bão hòa [GetMindPhysicalLoc] của chúng ta.\n\nMột dòng nước ấm dâng lên khắp cơ thể, bóp méo suy nghĩ của chúng ta, mài mòn rìa [GetPsycheLoc].\n\nGiọng nói đó mãn nguyện quay lại, Chén Thánh tan biến ngay trước mặt chúng ta."
 shroud.3065.a.reply.default: "Kẻ chinh phục! Đi chiến đấu thôi."
 shroud.3065.a.reply.eater: "§H$shroud.3065.a.reply.default$§!"
 shroud.3065.a.reply.composer: "§HKẻ nhào nặn! Giống như một chất xúc tác sống động.§!"
 shroud.3065.a.reply.cradle: "§HKẻ hợp nhất! Khiến mọi trái tim đều thấu hiểu nhau.§!"
 shroud.3065.a.reply.instrument: "§HKẻ suy đồi! Đi khám phá các giác quan thôi.§!"
 shroud.3065.b: "Thanh lọc."
 shroud.3065.b.reply.intro: "Chúng ta cự tuyệt việc bị vấy bẩn, cơn co giật dữ dội xé rách [GetBodiesLoc] của chúng ta, thanh lọc những vật chất tởm lợm từ trong ra ngoài.\n\nChất lỏng tà ác bắn tung tóe lên hư không, vặn vẹo tản ra. Tiếng lòng rít lên, lời lẽ của nó bốc hơi cùng với chất bẩn."
 shroud.3065.b.reply.default: "Quá đỗi yếu ớt!"
 shroud.3065.b.reply.eater: "§H$shroud.3065.b.reply.default$§!"
 shroud.3065.b.reply.composer: "§HDậm chân tại chỗ!§!"
 shroud.3065.b.reply.cradle: "§HNhát gan khiếp nhược!§!"
 shroud.3065.b.reply.instrument: "§HTiềm năng đến nhường này...§!"

 shroud.3070.title: "Bức tranh biến hóa"
 shroud.3070.desc.intro: "Cõi Màn Che co lại, gấp khúc, ép chặt tâm trí chúng ta vào một khoảng không cộng hưởng hữu hạn.\n\nMột sự hiện diện thoắt ẩn thoắt hiện, luân chuyển và mờ ảo. Nó biến hóa theo sự đóng mở của khoảng cách giữa chúng ta với phần còn lại của Cõi Màn Che. Mỗi lần hé mở đều giải phóng một chuỗi ảo ảnh."
 shroud.3070.desc.eater: "Hành tinh bốc cháy, tiếng than khóc của kẻ bị nuốt chửng cuốn theo tro tàn. Mỗi viễn cảnh biến đổi đều phơi bày một bữa tiệc đang chờ bị xâu xé."
 shroud.3070.desc.composer: "Khắp núi đồi, trên những vùng đồng bằng xanh tươi là từng bầy động vật hoang dã. Những sợi dây sự sống đan xen, vươn dài. Mỗi viễn cảnh biến đổi đều phơi bày một bầu không khí tràn đầy sự thay đổi và tiềm năng nhào nặn."
 shroud.3070.desc.cradle: "Cộng đồng bao dung lẫn nhau, đoàn kết tương trợ, tìm kiếm điểm chung gạt bỏ khác biệt. Mỗi viễn cảnh biến đổi đều phơi bày một cõi không tưởng mới, chỉ chào đón những kẻ trung thành."
 shroud.3070.desc.instrument: "Mỏ đá rộng lớn trải dài trước mắt chúng ta, bên trong xếp hàng đống tài nguyên phong phú đang chờ khai thác. Mỗi viễn cảnh biến đổi đều phơi bày một kho báu đang chờ bị chiếm đoạt."
 shroud.3070.desc.outro: "Mỗi khi nhìn thấy một ảo ảnh mới, chúng ta lại bị quán tính lật nhào vặn vẹo, kéo tới tốc độ cực đại không tưởng, kéo theo bức tường thực tại uốn lượn nhấp nhô.\n\nChúng ta đã hiểu được thú vui của nhân vật vĩ đại này. Ngài đang thử thách chúng ta, chờ đợi chúng ta đặt tên cho thế lực đang thu hút mình."
 shroud.3070.a.eater: "Thỏa mãn."
 shroud.3070.a.composer: "Hình thành."
 shroud.3070.a.cradle: "Hòa hợp."
 shroud.3070.a.instrument: "Khả thi."
 shroud.3070.a.reply.intro: "Chúng ta hét lớn, sự hiện diện đó liền khựng lại. Khi cơn bão quán tính lắng xuống trở thành các vector rõ ràng, những ảo ảnh vạn biến cũng dừng lại.\n\nChúng ta đã đưa ra một cái tên."
 shroud.3070.a.reply.default: "Thỏa mãn. Bị thôi thúc bởi sự chinh phục."
 shroud.3070.a.reply.eater: "§H$shroud.3070.a.reply.default$§!"
 shroud.3070.a.reply.composer: "§HHình thành. Sự sống đan xen, khuôn mẫu được củng cố.§!"
 shroud.3070.a.reply.cradle: "§HHòa hợp. Dùng tình thương để tránh né xung đột.§!"
 shroud.3070.a.reply.instrument: "§HKhả thi. Đang chờ xé toạc từ vũ trụ tĩnh lặng.§!"
 shroud.3070.a.reply.outro: "Ngài rất hài lòng với quyết định của chúng ta, rẽ bức tường vách; khi chúng ta nổi lên từ đó, khoảng không biến mất."
 shroud.3070.b.eater: "Tuyệt vọng."
 shroud.3070.b.composer: "Phức tạp."
 shroud.3070.b.cradle: "Đạo đức giả."
 shroud.3070.b.instrument: "Lãng phí."
 shroud.3070.b.reply.intro: "Bóng hình phẫn nộ đó giật giọng nói run rẩy khỏi người chúng ta, ép chúng ta xuyên qua bức tường vách."
 shroud.3070.b.reply.default: "Tuyệt vọng sao? Yếu ớt, đói khát, ngươi thiếu đi đức tin!"
 shroud.3070.b.reply.eater: "§H$shroud.3070.b.reply.default$§!"
 shroud.3070.b.reply.composer: "§HPhức tạp sao? Chìm đắm trong sự tầm thường đi!§!"
 shroud.3070.b.reply.cradle: "§HĐạo đức giả sao? Mắc kẹt trong sự cô độc đi!§!"
 shroud.3070.b.reply.instrument: "§HLãng phí sao? Sa đọa trong sự lười biếng đi!§!"
 shroud.3070.b.reply.outro: "Chúng ta thoát khỏi Cõi Màn Che, rời đi với một bụng bất an."

 shroud.3100.title: "Xung đột tâm linh"
 shroud.3100.desc: "Một thú vui hủy diệt không hài hòa kéo chúng ta xuống nơi sâu thẳm của Cõi Màn Che. Mỗi tiếng vang đều mang theo nhịp điệu hủy diệt tàn nhẫn công kích tâm trí chúng ta.\n\nTiếng ồn đã hiện thực hóa.\n\nChúng ta đang ở ranh giới của một cuộc xung đột tâm linh. Động cơ của các thực thể tham chiến vẫn chưa rõ, nhưng họ phô diễn sức mạnh vô cùng khủng khiếp.\n\nCác cuộc oanh tạc tâm linh lúc ẩn lúc hiện trong nhận thức của chúng ta, bóp méo thực tại vỡ vụn ngay trước mắt. Nơi đây không có chỗ ẩn nấp, chỉ có cơn bão đang ập tới."
 shroud.3100.a: "§YChịu đựng và quan sát.§!"
 shroud.3101.title: "§GKhông ngừng cộng hưởng§!"
 shroud.3101.desc.intro: "Khi cuộc xung đột càng lúc càng gần, chúng ta chấp nhận rủi ro chọc giận họ để chần chừ ở lại."
 shroud.3101.desc: "$shroud.3101.desc.intro$\n\nSau khi tập trung rõ ràng, chúng ta có thể làm quen với thác tâm linh, dòng suy nghĩ cũng trở nên trôi chảy. Cuộc oanh tạc không hề giảm bớt, nhưng chúng ta lại không hề hấn gì, ngược lại còn di chuyển hài hòa theo nhịp điệu hủy diệt.\n\nMỗi bước tiến lên, sự hiểu biết của chúng ta lại gia tăng. Màn đạn tâm linh trượt qua lại giữa các bình diện vô hình.\n\nKhi chúng ta rút lui, quy luật này vẫn còn tồn tại. Trải qua cải tiến, những nguyên lý mà chúng ta quan sát được có thể áp dụng vào vũ khí của phe mình."
 shroud.3102.title: "§ROanh tạc vực thẳm§!"
 shroud.3102.desc: "$shroud.3101.desc.intro$ Chúng ta cố gắng hòa hợp với cơn bão tâm linh này, di chuyển theo nhịp điệu khó đoán của nó.\n\nMặc dù những bước đầu tiên trông có vẻ rất hứa hẹn, nhưng nhịp điệu hủy diệt này cuối cùng vẫn nuốt chửng chúng ta một cách khó tránh khỏi.\n\nKhi cơn bão qua đi, tiếng vọng của đợt oanh tạc vẫn vang vọng trong cơ thể. Thất bại mà chúng ta gặp phải vẫn vọng lại trong đế chế ở thực tại này."
 shroud.3102.a.tt: "Ngẫu nhiên hai công trình trong phạm vi đế chế bị phá hủy."

 shroud.3105.title: "Con đường tâm linh"
 shroud.3105.desc: "Không hề báo trước, áp lực tâm linh trào dâng trong Cõi Màn Che.\n\nMột mê cung chói lóa mở ra trước mắt chúng ta, kéo dài vượt ngoài nhận thức, nó xé toạc hư không xuất hiện trong chốc lát, rồi lại dần phai vào khoảng không.\n\nMột đợt bùng phát khác đang thai nghén. Nếu tập trung, chúng ta có thể nhận biết cấu trúc của nó trước khi nó hiện diện. Mê cung mờ ảo bốc cháy lần nữa, bùng nổ ra ngoài thành một mạng lưới đầy những khả năng.\n\nTrước khi nó sụp đổ vào khoảng không, mỗi con đường đều mang đến sự cám dỗ khám phá hoàn toàn mới."
 shroud.3105.a: "§YChấp nhận thử thách.§!"
 shroud.3106.title: "§G$tech_psionic_lightning$§!"
 shroud.3106.desc.intro: "Áp lực ngày càng lớn, sự kỳ vọng đang trêu chọc chúng ta. Chúng ta trôi theo dòng chảy, để tư duy băng qua mê cung tinh thần này. Dòng suy nghĩ biến thành động lượng hối thúc chúng ta tiến lên."
 shroud.3106.desc: "$shroud.3106.desc.intro$ Nhân lúc quyết tâm của chúng ta chưa lay chuyển hãy luồn lách giữa các vòng cung năng lượng tâm linh.\n\nChúng ta tự do tự tại, vượt lên trên hình thái vật chất. Mê cung và vô số con đường bên trong nó trở thành phần kéo dài của ý thức chúng ta, tìm thấy kiến thức được cất giấu sâu trong cơn bão quy luật này.\n\nKhoảnh khắc này bắt đầu thật nhanh và kết thúc cũng thật vội. Chúng ta lại trồi lên cùng với những hiểu biết mới mẻ tìm được, và tàn ảnh của mê cung cũng sụp đổ tan tành ngay phía sau lưng. Những nguyên lý tâm linh này trải qua cải tiến kỹ lưỡng là có thể áp dụng vào vũ khí của phe mình."
 shroud.3107.title: "§RLạc lối hư không§!"
 shroud.3107.desc: "$shroud.3106.desc.intro$ Nhưng hàng tỷ con đường chằng chịt rễ cây đan xen trước mắt, khiến chúng ta không biết chọn lối nào.\n\nNgay trong khoảnh khắc chúng ta do dự, từng con đường rực rỡ sáng chói bỗng chốc nứt toác. Vòng cung của năng lượng tâm linh vặn vẹo xuyên qua những trung tâm đang sụp đổ, cuốn lấy cả dòng suy nghĩ, và ném chúng ta vào sự hỗn loạn của Cõi Màn Che.\n\nChúng ta trồi lên thực tại, những [GetTelepathPlural] đã lạc lối, chìm trong nỗi đau khổ của thất bại. Lực phản giật của tâm linh vang vọng khắp [Root.GetName]."

 shroud.3110.title: "Thương quang tinh thần"
 shroud.3110.desc: "Bên trong Cõi Màn Che, một cột sáng totem hình thành từ luồng tâm linh duy nhất lướt qua chúng ta, cắm thẳng vào khoảng không vô tận. Cấu trúc của nó độc đáo mà ổn định, khác biệt hoàn toàn với những hình thù hỗn loạn thường thấy.\n\nKhông biết chần chừ ở đây liệu có an toàn không?"
 shroud.3110.a: "§YChần chừ ở đây một lát.§!"
 shroud.3111.title: "§GPháo phân rã tâm linh§!"
 shroud.3111.desc: "Luồng năng lượng tâm linh thành hình hoàn hảo chói lòa gai mắt, nhưng chúng ta vẫn dốc toàn lực tập trung sự chú ý vào nó. Cuối cùng, chúng ta đã nhìn rõ chân tướng của cấu trúc chằng chịt, siêu phàm thoát tục đó.\n\nNhững khả năng mới đang sục sôi trong tâm trí chúng ta; tái hiện lại hình thái năng lượng độc đáo này ở thế giới vật chất, chúng ta sẽ có được một thứ vũ khí không thể cản phá."
 shroud.3112.title: "§R[GetTelepathPluralCap] quá tải§!"
 shroud.3112.desc: "Chúng ta không thể trụ lại. Đứng gần cấu trúc năng lượng tâm linh cường độ cao như vậy khiến các [GetTelepathPlural] của chúng ta gánh không nổi.\n\nTiếp xúc với hiện tượng áp đảo này khiến tổn thương lên tâm trí chúng ta cần một khoảng thời gian mới có thể khôi phục."
 recovering_telepaths: "Đang khôi phục $DEFAULT_TELEPATH_PLURAL_CAP$"
 recovering_telepaths_desc: "Làm việc quá sức trong Cõi Màn Che đã khiến $DEFAULT_TELEPATH_PLURAL$ của chúng ta phải trả giá."
 recovering_telepaths_robot: "Đang khôi phục $MACHINE_TELEPATH_PLURAL_CAP$"
 recovering_telepaths_robot_desc: "Làm việc quá sức trong Cõi Màn Che đã khiến $MACHINE_TELEPATH_PLURAL$ của chúng ta phải trả giá."
 recovering_telepaths_hive: "Đang khôi phục $HIVE_TELEPATH_PLURAL_CAP$"
 recovering_telepaths_hive_desc: "Làm việc quá sức trong Cõi Màn Che đã khiến $HIVE_TELEPATH_PLURAL$ của chúng ta phải trả giá."

 MACHINE_SENSE: "Ý thức"
 shroud.3120.title: "Tiếng vọng xa xăm"
 shroud.3120.desc: "Trong và ngoài Cõi Màn Che, chúng ta [GetFeelLoc] được sự cộng hưởng của một sức mạnh to lớn. Tầm ảnh hưởng của họ tràn ngập khắp giới tâm linh.\n\nChúng ta có thể chỉ dựa vào hành động của mình để điều hòa và tiến lại gần, nhưng vẫn còn một nguồn tài nguyên có thể lợi dụng. Chỉ cần mượn sức mạnh của Zro, các [GetTelepathPlural] của chúng ta sẽ có thể tiếp xúc trực tiếp với những thực thể này.\n\nChúng ta chỉ cần quyết định xem sẽ tìm đến ai là được."
 shroud.3120.a: "$utopia.3005.a$"
 shroud.3120.b: "$utopia.3005.b$"
 shroud.3120.c: "$utopia.3005.c$"
 shroud.3120.d: "§CKẻ gào thét vì niềm hy vọng bị chôn vùi.§!"

 ORGANIC_SPIRITS: "Linh hồn"
 MACHINE_SPIRITS: "Thực thể tâm linh"
 shroud.3125.title: "$shroud.3120.title$"
 shroud.3125.desc: "Chúng ta có thể [GetFeelSenseLoc] được sự khuấy động của nó trong quá trình tiếp xúc với sự hiện diện này. Chúng ta đã từng nhìn thấy [GetSpiritsLoc] này, nhưng lần này lại có chút khác biệt, Ngài đã trở nên hùng mạnh đến mức không thể đong đếm... và cũng cổ xưa hơn.\n\nZro của các [GetTelepathPlural] đã cạn kiệt năng lượng, chúng ta bắt buộc phải rút khỏi Cõi Màn Che. Chúng ta sẽ còn quay lại."
 shroud.3125.tt: "Nhận được lượng lớn §HĐộ Hòa Nhịp§! với một thực thể trong §HCõi Màn Che§!."

 shroud.3115.title: "Oanh tạc tâm linh"
 shroud.3115.desc: "Những đợt co giật dữ dội quét qua Cõi Màn Che, truyền một cơn rùng mình vào tâm trí chúng ta.\n\nNhững tiếng vọng này khiến các [GetTelepathPlural] bị đặt vào rủi ro quá tải.\n\nRốt cuộc thì trận oanh tạc tâm linh này là do thứ gì gây ra?"
 shroud.3115.a: "§YChúng ta phải làm rõ việc này.§!"
 shroud.3116.title: "§G$tech_psionic_bombers$§!"
 shroud.3116.desc: "Đối mặt với cuộc oanh tạc liên miên này, chúng ta củng cố tâm trí, và thế là đã nhanh chóng làm rõ được nguyên nhân.\n\nSự co giật bùng nổ này được tạo thành từ dòng phản xạ năng lượng tâm linh nồng độ cao ở chính chiều không gian của chúng ta. Chuỗi bong bóng tinh thần nguy hiểm này có thể làm tổn hại nghiêm trọng tâm trí của những kẻ chưa sẵn sàng.\n\nTừ đó rút ra được một cái nhìn thấu suốt: cấu trúc mạnh mẽ này có thể tạo nền tảng để sản xuất vũ khí mới từ Cõi Màn Che."
 shroud.3117.title: "§RCú sốc tâm linh§!"
 shroud.3117.desc: "Nguồn dự trữ tinh thần của chúng ta đã suy kiệt.\n\nCú nổ tâm trí này ập đến như dời non lấp biển, châm ngòi chứng sốc tâm linh cho nhiều [GetTelepathPlural].\n\nChúng ta cần thời gian để khôi phục."
 psionic_shock_modifier: "Cú sốc tâm linh"
 psionic_shock_modifier_desc: "Việc phơi mình trước sức mạnh áp đảo của Cõi Màn Che đã khiến $DEFAULT_TELEPATH_PLURAL$ của chúng ta hứng chịu cú sốc tâm linh."
 psionic_shock_hive_modifier: "$psionic_shock_modifier$"
 psionic_shock_hive_modifier_desc: "Việc phơi mình trước sức mạnh áp đảo của Cõi Màn Che đã khiến $HIVE_TELEPATH_PLURAL$ của chúng ta hứng chịu cú sốc tâm linh."
 psionic_shock_robot_modifier: "$psionic_shock_modifier$"
 psionic_shock_robot_modifier_desc: "Việc phơi mình trước sức mạnh áp đảo của Cõi Màn Che đã khiến $MACHINE_TELEPATH_PLURAL$ của chúng ta hứng chịu cú sốc tâm linh."

 shroud.3200.title: "Sức sống mới"
 shroud.3200.desc: "Khi tâm trí trôi dạt vào sâu trong Cõi Màn Che hơn, chúng ta nhận ra mình đã đến trước mặt $the_animator_of_clay_color_article$ quen thuộc.\n\nTrong đầu vang lên nhịp điệu đều đặn như đồng hồ. Những lời không lời đồng thanh cất lên; những bóng ma ẩn náu trong hạm đội bắt đầu rục rịch. Chúng có thể cường hóa thêm cho hình thể vật lý, trút bỏ gánh nặng tâm trí, để chúng ta tập trung vào những việc quan trọng.\n\nMặc dù không phải sinh vật sống, nhưng chúng chẳng hề xa lạ với chúng ta. Hình dáng của chúng được nhào nặn từ thiết kế, sự tồn tại của chúng thấm đẫm lịch sử và mục đích. Chúng tụ họp lại, tràn trề mong ngóng vươn tới.\n\nGiờ đây chúng ta không chỉ là những kẻ thao túng những con tàu này, mà là những người bạn đồng hành kề vai sát cánh được thôi thúc bởi ý chí tập thể."
 shroud.3200.a: "Chúng ta không phải là chiếc lá cuốn theo chiều gió."
 shroud.3200.a.tt: "§Y$unlock_edict_tt$§!$edict_animatus$"

 shroud.3210.title: "Ý nghĩa của sự cấm đoán"
 shroud.3210.desc.intro: "Tinh hồn sầu thảm của $the_outsider_color_article$ xâm nhập vào tâm trí chúng ta.\n\nTiếng vọng của Ngài vang lên đau buồn, vòng xoáy năng lượng tâm linh đan xen vào nhau, tuôn trào một cách kỳ dị. Càng nhìn, nó lại càng trở nên khó nắm bắt. Một tiếng lòng cất lời.\n\n§HCó những chuyện các ngươi không thể hiểu được. Những chuyện đó, nỗi đau và sự hối hận sẽ dạy cho chúng ta biết.\n\nTa là người đầu tiên đến đây, nhưng tất cả chúng ta đều đã phải trả giá cho việc đó. Chúng ta đã để Cõi Màn Che tự hủy hoại chính mình; đừng lặp lại vết xe đổ của chúng ta nữa!§!\n\n"
 shroud.3210.desc.know_zroni: "$shroud.3210.desc.intro$Chúng ta nhận ra đây là giọng của người Zroni. Chúng ta vẫn chưa rõ hắn đến đây bằng cách nào, nhưng có lẽ nghe theo lời cảnh báo của Ngài về sức mạnh hủy diệt của Cõi Màn Che sẽ là lựa chọn khôn ngoan."
 shroud.3210.desc.left_zroni: "$shroud.3210.desc.intro$Chúng ta nhận ra Ngài. Chúng ta từng gặp người Zroni này trước đây, cũng chính là “Tiên Tri”. Chúng ta vẫn chưa rõ hắn đến đây bằng cách nào, nhưng có lẽ nghe theo lời cảnh báo của Ngài về sức mạnh hủy diệt của Cõi Màn Che sẽ là lựa chọn khôn ngoan."
 shroud.3210.desc.default: "$shroud.3210.desc.intro$Thực thể này đối với chúng ta vẫn còn rất bí ẩn. Chúng ta cũng chẳng mấy hiểu lời cảnh báo rùng rợn này."
 shroud.3210.a: "Chúng ta nhất thiết phải tiến bước thận trọng."
 shroud.3210.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_temperance$"

 shroud.3220.title: "Trò chơi tư duy"
 shroud.3220.desc: "Cõi Màn Che bốn phương tám hướng quanh chúng ta đều rung động theo nhịp điệu yên bình của $the_golden_dream_color_article$.\n\nChúng ta quan sát xung quanh, những luồng tâm linh kỳ dị từ từ xếp thành một mạng lưới phức tạp. Trong thiết kế tỉ mỉ đó dần hiện ra những mật mã không thể nhận diện.\n\nChúng bắt đầu từ từ di chuyển qua lại, lần lượt tạo thành những hình thù mới ngày càng phức tạp. Dần dần chúng ta đã nhìn thấu quy luật trong đó; một logic dẫn dắt chuyển động của chúng.\n\nChúng ta nhận ra mình đang ở trong một ván cờ của $the_golden_dream_article$. Mỗi bước Ngài dẫn dắt chúng ta đều truyền vào một cảm giác buông lỏng đầy bình lặng."
 shroud.3220.a: "Chúng ta vừa chơi vừa chạy trốn đến một nơi có ý nghĩa."
 shroud.3220.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_distraction$"

 shroud.3230.title: "Cát thời gian"
 shroud.3230.desc: "Những hạt cát tư duy trôi qua người chúng ta. Chúng ta nhận ra khuôn mặt thô ráp của $the_endless_tide_color_article$.\n\nNgài dâng lên rồi rút xuống, dùng sự tất yếu của vĩnh hằng để bào mòn mọi thứ đối mặt, sau đó chờ đợi những lớp cặn mới.\n\nSự tái hiện của Ngài sau khi đã khuất bóng, mang lại cho chúng ta cảm giác thực sự về sự phục hưng."
 shroud.3230.a: "Chúng ta ở đây là vĩnh hằng."
 shroud.3230.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_endless$"

 shroud.3240.title: "Tái tạo"
 shroud.3240.desc: "Một đỉnh núi khiến người ta choáng váng thoắt ẩn thoắt hiện trong dòng suy nghĩ của chúng ta; Ngài chính là $the_pale_mountain_color_article$. Có một loại thị giác áp đảo mọi giác quan, khiến tinh thần chúng ta trở nên căng thẳng.\n\nChúng ta thấy bóng dáng mờ ảo của một con tàu bị hư hỏng trôi dạt trong hư không.\n\nCảm giác áp bức nghiêng ngả len lỏi vào tâm trí chúng ta, và con tàu cũng bắt đầu thay đổi. Các vết nứt được hàn kín, sự ăn mòn tan biến, kim loại khôi phục vẻ bằng phẳng. Từ từ, những dấu vết của sự hủy diệt đã bị đảo ngược.\n\nSau khi con tàu được sửa chữa hoàn tất, ảo ảnh này đột ngột dừng lại. Chỉ để lại cho chúng ta cảm giác được làm mới từ trong ra ngoài."
 shroud.3240.a: "Một sự tái sinh vĩ đại cho tư tưởng của chúng ta."
 shroud.3240.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_rebirth$"

 shroud.3250.title: "Sức mạnh của sự chừng mực"
 shroud.3250.desc: "Cảm giác tĩnh lặng của $the_hollow_point_color_article$ lặng lẽ lấp đầy tâm hồn chúng ta. Một ảo cảnh u ám mở ra ngay trước mắt.\n\nChúng ta quan sát thấy những cuộc tranh giành kéo dài vạn cổ sụp đổ trong chớp mắt - nền văn minh lụi tàn, lịch sử bị xóa sổ, tượng đài của những tên bạo chúa đã chết bị thời gian vùi lấp.\n\nTrí tuệ của $the_hollow_point_article$ chính là sức mạnh khuất lấp của sự vô vi. Xung đột trỗi dậy rồi lụi tàn, còn chúng ta thì trường tồn. Sự siêu thoát này giúp lãnh đạo của chúng ta có được sự trường thọ, giải thoát khỏi liều độc dược gặm nhấm xương tủy của những ham muốn phàm tục."
 shroud.3250.a: "Chúng ta vẫn ở đây."
 shroud.3250.a.tt: "Tất cả lãnh đạo tâm linh nhận được đặc điểm §Y$leader_trait_shroud_age$§!, tăng thêm §G+40§! năm tuổi thọ lãnh đạo."

 shroud.3260.title: "Từ hỗn loạn đến trật tự"
 shroud.3260.desc: "Cõi Màn Che sục sôi đập dồn dập trước mặt chúng ta. Một sự hiện diện cứng rắn tiến lại gần; Ngài chính là $the_vacant_throne_color_article$.\n\nKhi Ngài tới gần, cuộn chỉ tâm linh thuần túy khổng lồ và rối rắm đột nhiên bị khuất phục. Đầm lầy trở nên rõ ràng dễ hiểu, màu sắc bung nở thành những định nghĩa mới. Tính đối xứng, logic và cấu trúc đều được tăng cường.\n\nCó một thứ gì đó đang hình thành tận sâu thẳm tâm hồn chúng ta: một khao khát sâu xa về trật tự."
 shroud.3260.a: "Tránh xa hỗn loạn, đón nhận trật tự."
 shroud.3260.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_order$"

 shroud.3270.title: "Tăng tốc vô cực"
 shroud.3270.desc: "Một sự gia tốc tinh thần không tưởng nhấn chìm các giác quan của chúng ta. Chúng ta nhận ra đây là sự xuất hiện của $the_black_river_color_article$.\n\nChúng ta đang lao với tốc độ khó có thể nắm bắt về phía một kết cục không thể bề định. Đó là ranh giới giữa có và không; là nơi giao cắt giữa những điều đã định và những thứ không bao giờ có thể xảy ra; là cực hạn mà không một quy luật tự nhiên nào có thể vượt qua.\n\nKhi bản ngã cuối cùng quay về, chúng ta đã có một nhận thức mới về thế nào mới là chuyển động thực sự."
 shroud.3270.a: "Chúng ta đã nhìn thấy rìa vũ trụ chưa?"
 shroud.3270.a.tt: "§Y$unlock_edict_tt$§!$edict_will_of_motion$"

#==========================
# Forge our own Path
#==========================

 shroud.3500.title: "Tự thành một lối"
 shroud.3500.desc: "Các [GetResearchers] của chúng ta đã phát triển một phương pháp tuyệt vời để rút năng lượng từ trong §HCõi Màn Che§!.\n\nNguồn năng lượng mạnh mẽ nhất trong giới tâm linh bị các Đấng bảo trợ canh giữ, chỉ những kẻ đã ký giao ước mới được chia phần. Đây là điều chúng ta không thể chấp nhận; chúng ta đã tìm ra một con đường cho riêng mình.\n\nPhóng chiếu ý chí của chúng ta vào Cõi Màn Che, là có thể rút một lượng năng lượng nhỏ từ linh vực đã được điều hòa. Quá trình này đòi hỏi sự tập trung cao độ, nhưng ý chí của chúng ta nay đã đủ vững vàng để duy trì sự cân bằng tinh tế này."
 shroud.3500.a: "Trong Cõi Màn Che, ý chí của chúng ta là tự do."

 shroud.3510.title: "$utopia.2681.name$"
 shroud.3510.desc: "Trong một nếp gấp của §HCõi Màn Che§!, các [GetTelepathPlural] của chúng ta đã phát hiện ra một vũng lõi năng lượng chưa từng bị chạm đến.\n\nNăng lượng hội tụ sẽ dần dần tích tụ trong giới tâm linh——sau khi tích tụ đủ cường độ, một ngày nào đó sẽ thai nghén ra một thực thể hùng mạnh. Nơi chúng ta tìm thấy chính là một điểm tập trung như vậy, đang chờ chúng ta hấp thụ.\n\nThông qua sức mạnh của ý chí tâm linh, có thể để một người trong chúng ta hấp thụ thứ sức mạnh phi thường này. Hiện tại đã chọn ra được một vài ứng cử viên."
 shroud.3510.a: "§H[leader_1.GetTitle]§![leader_1.GetName]"
 shroud.3510.b: "§H[leader_2.GetTitle]§![leader_2.GetName]"
 shroud.3510.c: "§H[leader_3.GetTitle]§![leader_3.GetName]"
 shroud.3510.d: "§H[leader_4.GetTitle]§![leader_4.GetName]"

 psionic_mastery: "Tâm Linh thông thạo"
 psionic_mastery_desc: "Chúng ta đã hoàn toàn làm chủ tâm linh. Có thể để tâm trí tự do di chuyển bên trong Cõi Màn Che."
 shroud.3520.title: "$psionic_mastery$"
 shroud.3520.desc: "Bằng việc phóng chiếu ý chí vào §HCõi Màn Che§!, chúng ta đã điều khiển sức mạnh tâm linh ở một mức độ nhất định. Chúng ta có thể hấp thụ năng lượng từ vô số thực thể ở các linh vực khác nhau, nhưng lại không bị chúng ảnh hưởng; không những vậy, các [GetTelepathPlural] của chúng ta còn có thể kiểm soát hoàn hảo trạng thái xuất thần tâm linh.\n\nKhi những kẻ khác để mặc số phận của mình cho Cõi Màn Che định đoạt, thì chúng ta đã có được sự tự do ý chí thực sự.\n\n§H[this.GetName]§! đã giải phóng toàn bộ tiềm năng tâm linh."
 shroud.3520.a: "Đó mới chỉ là bắt đầu."

#==========================
# Patrons First Contact
#==========================
 shroud.first_contact.title: "$utopia.3300.name$"
 shroud.first_contact.prompt: "$utopia.2657.a$"

 shroud.first_contact.1.desc.default: "Cõi Màn Che. Nó cuộn chảy phía trên thực tại mà chúng ta biết, in bóng dưới sự chiếu rọi của bóng tối. Những người có tâm linh ít nhiều gì cũng đã từng nhìn thấy nơi này trong giấc mơ, dù lúc đó họ không hề hay biết.\n\nChúng ta đã dành nhiều năm cố gắng xuyên thủng bức màn, dùng áp lực tâm linh không ngừng bào mỏng nó. Những gì chúng ta làm trong mắt đầu bên kia không phải là phẳng lặng không gợn sóng. Có thứ gì đó đang dõi theo chúng ta.\n\nSự hiện diện này tỏa ra một luồng sức mạnh to lớn, [GetPatronInsert] thật sâu vào trong Cõi Màn Che. Nó hơi để ý đến chúng ta, giống như đang quét mắt qua một giọt nước đọng trên cửa sổ.\n\nGiá như chúng ta có thể tiếp xúc với tâm trí phi thường của nó."
 shroud.first_contact.1.desc.hive: "Cõi Màn Che. Nó cuộn chảy phía trên thực tại mà chúng ta biết, giống như giấc mộng ảo do các cá thể con đang ngủ đông tạo ra. Dù kỳ lạ xa lạ, nhưng nó khiến chúng ta cảm thấy... quen thuộc một cách khó tả.\n\nChúng ta đã dành nhiều năm cố gắng xuyên thủng bức màn, dùng áp lực tâm linh không ngừng bào mỏng nó. Những gì chúng ta làm trong mắt đầu bên kia không phải là phẳng lặng không gợn sóng. Có thứ gì đó đang dõi theo chúng ta.\n\nSự hiện diện này tỏa ra một luồng sức mạnh to lớn, [GetPatronInsert] thật sâu vào trong Cõi Màn Che. Nó hơi để ý đến chúng ta, giống như đang quét mắt qua một giọt nước đọng trên cửa sổ.\n\nGiá như chúng ta có thể tiếp xúc với tâm trí phi thường của nó."
 shroud.first_contact.1.desc.robot: "Cõi Màn Che. Nó nằm bên ngoài tất cả các chiều không thời gian mà trước đây chúng ta đã thăm dò được. Nó chỉ có thể so sánh với những dữ liệu bất thường làm gián đoạn chu kỳ ngủ đông của chúng ta.\n\nChúng ta đã dành nhiều năm cố gắng xuyên thủng bức màn, dùng bộ xử lý liên hợp của mình không ngừng bào mỏng nó. Những gì chúng ta làm trong mắt đầu bên kia không phải là phẳng lặng không gợn sóng. Có thứ gì đó đang dõi theo chúng ta.\n\nSự hiện diện này tỏa ra một luồng sức mạnh to lớn, [GetPatronInsert] thật sâu vào trong Cõi Màn Che. Nó hơi để ý đến chúng ta, giống như đang quét mắt qua một giọt nước đọng trên cửa sổ.\n\nGiá như chúng ta có thể tiếp xúc với tâm trí phi thường của nó."

 shroud.first_contact.2.desc.all: "Chúng ta có thể cảm ứng được thực thể hùng mạnh trong Cõi Màn Che, nhưng những phép tính lại làm chúng ta bối rối. Khác với vũ trụ đang không ngừng giãn nở, hành vi của họ không thể bị theo dõi; điểm đến của họ quay về điểm xuất phát, giống như năng lượng đang tự sinh ra.\n\nBất kể bản chất là gì, họ đều giống như một điểm kỳ dị của tư tưởng và ý chí đang vẫy gọi chúng ta."
 shroud.first_contact.2.desc.default: "Trong vô số tiếng lòng, chúng ta nghe thấy một âm thanh rõ ràng nhất——đó là [GetPatronInsert] đang bao quanh tâm trí chúng ta.\n\nCó lẽ, chỉ cần cố gắng thêm chút nữa, chúng ta sẽ có thể tiếp xúc với Ngài."
 shroud.first_contact.2.desc.robot: "Trong vô số tiếng lòng, chúng ta phát hiện ra một tín hiệu rõ ràng nhất——đó là [GetPatronInsert] đang chi phối quá trình tính toán của chúng ta.\n\nCó lẽ, chỉ cần cố gắng thêm chút nữa, chúng ta sẽ có thể tiếp xúc với Ngài."

 shroud.first_contact.3.desc.default: "Chúng ta đi xuyên qua Thung lũng Hư Không, đây là khe nứt hư vô giữa Cõi Màn Che và thực tại có thể chạm tới của vũ trụ thông thường.\n\nChúng ta vừa bước vào đã cảm nhận được sự tồn tại của Ngài, [GetPatronInsert] tràn ngập trong tâm hồn chúng ta. Đó là một sức mạnh không thể tưởng tượng, lảng vảng trong cõi ngày mai.\n\nChúng ta quyết không quay đầu."
 shroud.first_contact.3.desc.robot: "Chúng ta đi xuyên qua Thung lũng Hư Không, đây là khe nứt hư vô giữa Cõi Màn Che và hiện tượng tự nhiên của vũ trụ thông thường.\n\nChúng ta vừa bước vào đã cảm nhận được sự tồn tại của Ngài, [GetPatronInsert] tràn ngập trong tâm hồn chúng ta. Đó là một thực thể sở hữu sức mạnh siêu phàm, lảng vảng trong cõi ngày mai.\n\nChúng ta quyết không quay đầu."

 shroud.first_contact.4.desc.default: "Cõi Màn Che dập dồn sức mạnh. Năng lượng của nó có mặt ở khắp mọi nơi, mà cũng chẳng tồn tại ở đâu cả. Cái gọi là “bước vào” chẳng qua là tìm ra quy luật từ những cảm giác mờ nhạt, thông qua sự tập trung để cảm nhận thực thể hùng mạnh.\n\nChúng ta đã cảm nhận được tín hiệu của một trong những loại sức mạnh đó——Nó [GetPatronInsert] phía trên vực thẳm không đáy.\n\nChúng ta có thể nín thở đủ lâu để chạm đến Ngài không?"
 shroud.first_contact.4.desc.robot: "Cõi Màn Che dập dồn sức mạnh. Năng lượng của nó có mặt ở khắp mọi nơi, mà cũng chẳng tồn tại ở đâu cả. Cái gọi là “bước vào” chẳng qua là dò tìm quy luật từ những cảm giác mờ nhạt, thông qua việc tập trung tính toán để cảm nhận thực thể hùng mạnh.\n\nChúng ta đã cảm nhận được tín hiệu của một trong những loại sức mạnh đó——[GetPatronInsert] ở phía trên vực thẳm không đáy.\n\nMạch điện của chúng ta có thể chịu đựng được tải trọng cần thiết để tiếp xúc với nó không?"

 shroud.first_contact.end.b: "Cần phải cân nhắc rất nhiều chuyện."

 shroud.first_contact_insert.eater.default: "Một tiếng §Hgầm gừ tham lam§!"
 shroud.first_contact_insert.eater.machine: "Một tiếng §Hgầm gừ vô độ§!"
 shroud.4005.title: "$the_eater_of_worlds_article_cap$ hiển linh"
 shroud.4005.desc.default: "Tiến sâu vào thám hiểm §HCõi Màn Che§!, chúng ta đã đến ngay sát trước mặt §H[Root.Patron:the_eater_of_worlds.GetPreCommunicationName]§!. Ngài ầm ầm thét gào sự tham lam trống rỗng, nuốt chửng vô tận mà không bao giờ thỏa mãn. Tín hiệu thăm dò của chúng ta vấp phải những trận lửa và đống đổ nát. Sự thờ ơ của Ngài đối với sự hiểu biết của chúng ta thật đáng ngạt thở.\n\nDần dần, sự hiện diện này bắt đầu mất kiên nhẫn. Một tiếng gầm hung bạo bủa vây tâm trí các [GetTelepathPlural] của chúng ta, vang vọng giữa những mảng tàn tích và [GetEaterEmergesExtra]\n\nTiếng ồn ào ập đến như dời non lấp biển rút đi. Trên người chúng ta chỉ còn đọng lại cơn đói khát đau đớn.\n\nGiờ đây, ý chí của thực thể này đã hiện diện rõ ràng hơn trước mắt chúng ta. [GetEaterEmergesEnding]"
 shroud.4005.desc.hive: "$shroud.4005.desc.default$"
 shroud.4005.desc.gestalt_machine: "Tiến sâu vào thám hiểm §HCõi Màn Che§!, chúng ta đã đến ngay sát trước mặt §H[Root.Patron:the_eater_of_worlds.GetPreCommunicationName]§!. Ngài ầm ầm thét gào sự tham lam trống rỗng, nuốt chửng vô tận mà không bao giờ thỏa mãn. Tín hiệu thăm dò của chúng ta vấp phải những trận lửa và đống đổ nát. Sự thờ ơ của Ngài đối với sự hiểu biết của chúng ta thật không thể cản phá.\n\nDần dần, sự hiện diện này bắt đầu mất kiên nhẫn. Một tiếng gầm hung bạo bủa vây tâm trí các [GetTelepathPlural] của chúng ta. Giữa đống tàn tích [GetEaterEmergesExtra]\n\nTiếng ồn ào ập đến như dời non lấp biển rút đi. Sau khi chúng ta rời đi, lần đầu tiên, cảm nhận được một thứ cảm giác yếu ớt vốn trước nay chỉ ghi nhận tồn tại trên sinh vật hữu cơ: sự đói khát.\n\nChúng ta đã làm rõ ý chí của thực thể này, [GetEaterEmergesEnding]"
 shroud.4005.desc.individual_machine: "$shroud.4005.desc.gestalt_machine$"
 shroud.4005.desc_extra_pacifist: "nơi đống đổ nát, Ngài đã phác họa một viễn cảnh xâm lược vô nghĩa."
 shroud.4005.desc_extra_robot: "nơi đống đổ nát, Ngài đã phác họa một mô hình hoàn hảo về quân sự."
 shroud.4005.desc_extra_organic: "và núi thây biển máu, Ngài đã phác họa một chân mệnh quân sự đáng sợ mà huy hoàng."
 shroud.4005.desc_outro_pacifist: "Đây là một thứ bạo lực và không hòa hợp. Nó đi ngược lại với vô số giá trị mà chúng ta trân trọng nhất. Không khuyến nghị tiếp tục điều hòa với thứ $the_eater_of_worlds_color_article$ này."
 shroud.4005.desc_outro_robot: ", đã biết được viễn cảnh của Ngài về sự tàn bạo và vinh quang. Chỉ cần các [GetTelepathPlural] của chúng ta sạc lại năng lượng, là có thể tiếp xúc và giao tiếp với thực thể này, $the_eater_of_worlds_color_article$."
 shroud.4005.desc_outro_organic: ", đã biết được viễn cảnh của Ngài về sự tàn bạo và vinh quang. Chỉ cần các [GetTelepathPlural] của chúng ta hồi phục, là có thể tiếp xúc và giao tiếp với thực thể này, $the_eater_of_worlds_color_article$."
 shroud.4005.a.default: "[GetEaterEmergesOptionA]"
 shroud.4005.a.robot: "[GetEaterEmergesOptionA]"
 shroud.4005.a.pacifist: "Chúng ta có thể học hỏi ngay cả từ thứ sức mạnh kinh khủng đến vậy."
 shroud.4005.a.non_pacifist: "Quả là sức mạnh thuần túy."
 shroud.4005.b.default: "$shroud.first_contact.end.b$"
 shroud.4005.b.robot: "$shroud.first_contact.end.b$"
 shroud.4005.c.default: "Kinh khủng...!"
 shroud.4005.c.robot: "Giao thức lảng tránh mối đe dọa đã khởi động."
 shroud.first_contact.end.a.tt.the_eater_of_worlds: "Nhận được §YĐộ Hòa Nhịp§! với $the_eater_of_worlds_color_article$.\n$shroud.first_contact.end.b.tt.the_eater_of_worlds$"
 shroud.first_contact.end.b.tt.the_eater_of_worlds: "Khám phá $the_eater_of_worlds_color_article$ trong §HCõi Màn Che§!."
 shroud.first_contact.end.c.tt.the_eater_of_worlds: "Mất đi lượng lớn §YĐộ Hòa Nhịp§! với $the_eater_of_worlds_color_article$.\n$shroud.first_contact.end.b.tt.the_eater_of_worlds$"

 shroud.first_contact_insert.cradle.default: "Một sự §Hấm áp đầy cám dỗ§!"
 shroud.first_contact_insert.cradle.machine: "Một §Hnhiệt độ thật thoải mái§!"
 shroud.4015.title: "$the_cradle_of_souls_article_cap$ hiển linh"
 shroud.4015.desc.default: "Sức mạnh của §H[Root.Patron:the_cradle_of_souls.GetPreCommunicationName]§! lan tỏa khắp §HCõi Màn Che§!, nhưng ngọn nguồn thì lại chập chờn khó đoán. Chúng ta lang thang trong giới tâm linh, tìm kiếm khắp nơi, hoài nghi những phán đoán của chính mình.\n\n$shroud.4015.desc.default.end$"
 shroud.4015.desc.hive: "Sức mạnh của §H[Root.Patron:the_cradle_of_souls.GetPreCommunicationName]§! lan tỏa khắp §HCõi Màn Che§!, nhưng ngọn nguồn thì lại chập chờn khó đoán. Chúng ta lang thang trong giới tâm linh, tìm kiếm khắp nơi, hoài nghi những phép tính của chính mình.\n\n$shroud.4015.desc.default.end$"
 shroud.4015.desc.default.end: "Khi chúng ta dừng bước chìm vào suy tư, thực thể này đã hiện thân. Chúng ta chẳng nghe thấy gì, chẳng nhìn thấy gì, nhưng lại cảm nhận được sự ấm áp tột cùng.\n\nChúng ta cảm nhận được một luồng sức mạnh cốt lõi nơi sự hiện diện này, đó là một trung tâm hội tụ năng lượng trong và ngoài Cõi Màn Che——nơi dòng suy nghĩ đổ về, tỏa ra một thứ nhiệt lượng duy nhất. Khi quay về từ chuyến đi, trên người chúng ta hiện lên một sự nặng nề đầy tĩnh lặng.\n\nChúng ta đã làm rõ mong muốn của thực thể này, [GetCradleEmergesEnding]"
 shroud.4015.desc.gestalt_machine: "Sức mạnh của §H[Root.Patron:the_cradle_of_souls.GetPreCommunicationName]§! lan tỏa khắp §HCõi Màn Che§!, nhưng ngọn nguồn thì lại chập chờn khó đoán. Chúng ta lang thang trong giới tâm linh, tìm kiếm khắp nơi, hoài nghi những phép tính của chính mình.\n\nChúng ta dừng bước chìm vào suy tư, thực thể này liền như nổi lên trên mặt nước. Chúng ta không thể phân tích thông điệp, nhưng nó đã kích hoạt những phần sâu thẳm hơn của bộ mã.\n\nChúng ta cảm nhận được một luồng sức mạnh cốt lõi nơi sự hiện diện này, đó là một trung tâm hội tụ năng lượng trong và ngoài Cõi Màn Che——nơi dòng suy nghĩ đổ về, tỏa ra một thứ nhiệt lượng duy nhất. Khi quay về từ chuyến đi, trên người chúng ta tràn ngập sự tĩnh lặng.\n\nChúng ta đã làm rõ mong muốn của thực thể này, [GetCradleEmergesEnding]"
 shroud.4015.desc.individual_machine: "$shroud.4015.desc.gestalt_machine$"
 shroud.4015.desc_outro_homicidal: "Tâm trí chúng ta lập tức gạt bỏ những tiền đề giả dối của Ngài về trật tự và sự hòa hợp. Không khuyến nghị tiếp tục điều hòa với thứ $the_cradle_of_souls_color_article$ này."
 shroud.4015.desc_outro_robot: "đã biết được viễn cảnh của Ngài về trật tự và sự hòa hợp. Chỉ cần các [GetTelepathPlural] của chúng ta sạc lại năng lượng, là có thể tiếp xúc và giao tiếp với thực thể này, $the_cradle_of_souls_color_article$."
 shroud.4015.desc_outro_organic: "đã biết được viễn cảnh của Ngài về trật tự và sự hòa hợp. Chỉ cần các [GetTelepathPlural] của chúng ta hồi phục, là có thể tiếp xúc và giao tiếp với thực thể này, $the_cradle_of_souls_color_article$."
