 gov_shroud_corporeal_oligarchy_desc: "$auth_shroud_oligarchic_corporeal_desc$"

 auth_shroud_dictatorial_corporeal: "Chế độ Độc tài Định mệnh"
 auth_shroud_dictatorial_corporeal_desc: "Vị quân vương vĩ đại dùng chính thể xác của mình làm đại diện cho sức mạnh Cõi Màn Che, chuyển hóa năng lượng tâm linh thành uy quyền cai trị. Sẽ chẳng có thứ gì có thể cản bước tầm nhìn tối thượng của ngài."
 auth_shroud_dictatorial_corporeal_tt: "$corporeal_trait_tt$\nMỗi người sử dụng Tâm linh mang lại +1 §H$EDICT_FUND$§!\n$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+25%§!\n$MOD_COUNCIL_AGENDA_COOLDOWN_MULT$: §G-25%§!\n$mod_planet_bureaucrats_upkeep_mult$: §G-25%§!"
