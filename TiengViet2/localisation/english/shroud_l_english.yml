 trait_blindness_desc: "Nơi chúng ta đến không cần [Species.GetEyeNamePlural] cũng có thể nhìn thấy."

 # Establishing the Chamber of Silence
 shroud.2820.name: "Xây dựng $building_chamber_of_silence$"
 shroud.2820.desc.1: "Khi chúng ta dần làm chủ sức mạnh tâm linh, những lời thì thầm hỗn loạn từ bên kia bức màn bắt đầu quấy nhiễu chúng ta. §RTiếng nói từ tâm trí§!, vang vọng và rõ ràng hơn bao giờ hết, nó uốn lượn xuyên qua những dòng chảy tư tưởng này, tiến vào sâu trong bóng tối của tâm trí chúng ta.\n\n§R“Hãy mở đường.”§!"
 shroud.2820.desc.2.intro: "Chúng ta phải lọc bỏ những tạp âm này."
 shroud.2820.desc.2.chamber: "$shroud.2820.desc.2.intro$ Chúng ta đã xây dựng $shroud.2820.desc.2.outro$"
 shroud.2820.desc.2.no_chamber: "$shroud.2820.desc.2.intro$ Đã có kế hoạch xây dựng $shroud.2820.desc.2.outro$"
 shroud.2820.desc.2.outro: "một cơ sở cách ly, nơi những người có thiên phú tâm linh xuất sắc nhất của chúng ta có thể nghe thấy những chỉ thị từ §Rtiếng nói từ tâm trí§! với độ sắc nét đến mức mãn nguyện."
 shroud.2820.a.chamber: "Tâm trí chúng ta đã mở mang hơn."
 shroud.2820.a.no_chamber: "Hãy xây dựng thứ gọi là “$building_chamber_of_silence$” này."
 CONTINUE_SITUATION: "Tiếp tục §Ycục diện§!:"
 shroud.2820.a.tt: "$CONTINUE_SITUATION$§H$situation_breach_shroud$§!"
 shroud.2820.a.tt_no_chamber: "Đón nhận truyền thống §H$tr_psionics_endbringers_cult$§! và xây dựng một công trình §H$building_chamber_of_silence$§! để thúc đẩy cục diện."

 # The Great Awakening
 shroud.2830.name: "$utopia.2650.name$"
 shroud.2830.desc: "Bên trong $building_chamber_of_silence$, chúng ta có thể nghe rõ mồn một thông điệp từ §Rtiếng nói từ tâm trí§!.\n\n§R“Mọi thứ sẽ được tái sinh.”§!\n\nChúng ta đã hiểu. Sự kết thúc chính là một khởi đầu mới, chúng ta không cần phải sợ hãi, bởi vì chúng ta sẽ được nhào nặn lại, trở nên tốt đẹp và mạnh mẽ hơn bất cứ điều gì chúng ta có thể tưởng tượng.\n\nĐể nắm lấy định mệnh này, chúng ta phải học cách làm chủ cõi tinh thần được gọi là §HCõi Màn Che§!. Chúng ta sẽ không đi vào vết xe đổ của những kẻ được tìm thấy trên $pc_shrouded$. Bọn họ chối bỏ nỗi sợ hãi, còn chúng ta hân hoan đón nhận nó."
 shroud.2830.desc.outro.awakening: "Tầm nhìn của chúng ta đã hoàn toàn rõ ràng."
 shroud.2830.desc.outro.no_awakening: "Tầm nhìn của chúng ta đã gần như rõ ràng."
 shroud.2830.a.awakening: "Chìa khóa nằm bên trong Cõi Màn Che."
 shroud.2830.a.no_awakening: "$shroud.2780.a$"
 shroud.2830.a.tt: "$tr_psionics_psionic_assimilation_desc$\n$CONTINUE_SITUATION$§H$situation_breach_shroud$§!"
 shroud.2830.a.tt_no_awakening: "Đón nhận truyền thống §H$tr_psionics_shroud_great_awakening$§! để thúc đẩy cục diện."

 # Blind the Willing - First select event
 shroud.8320.name: "Sáng mắt"
 shroud.8320.desc: "§H[blinded_leader.GetName]§! đã chỉ đường dẫn lối cho chúng ta. Các giác quan bên ngoài sẽ che lấp đi tiếng gọi của §Rtiếng nói từ tâm trí§! này. Loại bỏ đi một giác quan, chúng ta có thể nâng sức mạnh của tâm trí lên một tầm cao mới.\n\nVề mặt này, việc từ bỏ [Species.GetEyeNamePlural] của chúng ta là hiệu quả nhất. Tầm nhìn trong thế giới vật chất sẽ cản trở tầm nhìn §HCõi Màn Che§! của chúng ta. Nhiều [Root.GetSpeciesNamePlural] đã lấy §H[blinded_leader.GetName]§! làm tấm gương, không ngần ngại loại bỏ [Species.GetEyeNamePlural] của chính mình.\n\nNhững người lựa chọn làm như vậy đều báo cáo rằng, §Rtiếng nói từ tâm trí§! đó đang lấp đầy tâm trí họ bằng sự tán thưởng, và họ cảm thấy một sự thỏa mãn đi kèm."
 shroud.8320.a: "Mắt tâm mới là thực"

 leader_trait_blinded: "Mù lòa"
 leader_trait_blinded_desc: "Vẫn còn những quang cảnh chưa từng được nhìn thấy."

 # A Leap of Faith - First select event
 shroud.8330.name: "Bước nhảy Niềm tin"
 shroud.8330.desc: "Thất vọng trước những giới hạn của thân xác phàm trần, §H[forsaken_leader.GetName]§! đã cố gắng đẩy nhanh quá trình biến đổi tâm linh của [forsaken_leader.GetHisHer] bằng cách công khai uống chất độc chết người một cách đầy tính kịch.\n\nNgay khi [forsaken_leader.GetHeShe] tắt thở, cái xác của [forsaken_leader.GetHisHer] liền bị một màu tím rực rỡ nuốt chửng, phân rã thành luồng bụi tâm linh thuần khiết. Kỳ tích này chính là do ý chí của §Rtiếng nói từ tâm trí§! thực hiện.\n\nChúng ta coi đây là một dấu hiệu quá đỗi rõ ràng; nơi nào §H[forsaken_leader.GetName]§! đã đi, tất cả mọi người chắc chắn sẽ nối bước."
 shroud.8330.a: "Không thể để thân xác này níu chân chúng ta."

 # Mid-stage events
 shroud.8350.name: "Báo cáo phẫu thuật thùy trán"
 shroud.8350.desc: "Một số [owner.GetSpeciesNamePlural] gặp khó khăn trong việc chung sống hài hòa với §Rtiếng nói từ tâm trí§!.\n\nNhững kẻ yếu đuối nhất này tuyệt vọng cầu xin sự bình yên, và cuối cùng đã tìm đến những ca phẫu thuật cắt bỏ thùy trán thô bạo và trái phép. Nếu không có biện pháp ngăn chặn, hành động này có thể sẽ trở nên phổ biến."
 shroud.8350.a: "Cứ mặc kệ những kẻ yếu đuối này đi."
 shroud.8350.b: "§RTiếng nói từ tâm trí§! là một ân huệ. Nghiêm cấm hành vi này."

 endbringers_voice_plague: "Tâm thanh Xâm nhập"
 endbringers_voice_plague_desc: "Khi tiếng nói cất lên, chúng ta chỉ có thể vâng lời."

 shroud.8360.name: "Tự thử nghiệm Tâm linh"
 shroud.8360.desc: "Chúng ta tiếp tục đón nhận §Rtiếng nói từ tâm trí§!. Ngài bắt đầu thuyết giảng về những chân lý giản đơn mà không thể chối cãi.\n\nNhiều [owner.GetSpeciesNamePlural] bắt đầu tìm kiếm những phương pháp để cường hóa §Rtiếng nói từ tâm trí§! nhằm nhận được sự che chở trực tiếp hơn từ thứ trí tuệ này.\n\nLượng thuốc chợ đen được sử dụng tăng vọt. Các cơ sở y tế không được quản lý bắt đầu cung cấp các dịch vụ thử nghiệm, giúp các cá nhân tối đa hóa độ nhạy cảm tâm linh.\n\nRốt cuộc điều này sẽ dẫn đến hậu quả gì?"
 shroud.8360.a: "Hãy mang §Rtiếng nói từ tâm trí§! đến đây bằng mọi giá."
 shroud.8360.b: "Phải cảnh giác trước tình trạng vô chính phủ toàn diện."

 shroud.8370.name: "Ác mộng Tận thế"
 shroud.8370.desc: "Cùng với sức mạnh tâm linh ngày một tăng, dân số [owner.GetSpeciesAdj] bắt đầu bị quấy nhiễu bởi những cơn ác mộng kinh hoàng dự báo về sự kết thúc của vũ trụ.\n\nGiấc mơ của chúng ta đã biến thành những lời tiên tri về ngày tận thế, khoét sâu thêm nỗi sợ hãi về sự tồn vong trong lòng người dân. Giấc ngủ giờ đây đã bị thay thế bởi sự tê liệt đầy bất an, khiến nhiều người không thể duy trì nếp sống thường ngày.\n\nTrong những giấc mơ ấy, §Rtiếng nói từ tâm trí§! thủ thỉ với chúng ta.\n\n§R“Hãy chấp nhận entropy.”§!"
 shroud.8370.a: "Vạn vật có bắt đầu ắt có kết thúc."
 shroud.8370.b: "Cung cấp nơi trú ẩn tại $building_chamber_of_silence$."

 endbringers_apocalyptic_nightmares: "Ác mộng Tận thế"
 endbringers_apocalyptic_nightmares_desc: "Tiếng nói từ tâm trí đang phá vỡ chu kỳ giấc ngủ của chúng ta bằng những giấc mơ mang màu sắc tai ương."

 endbringers_nightmare_shelter: "Nơi Trú ẩn Khỏi Ác mộng"
 endbringers_nightmare_shelter_desc: "$building_chamber_of_silence$ sẽ là nơi trú ẩn cho những ai đang phải gánh chịu những cơn ác mộng tai ương."

 shroud.8380.name: "Dấu ấn Tận thế"
 shroud.8380.desc: "Xu hướng tự hành xác trong dân chúng đang ngày một gia tăng.\n\nNhững kẻ cuồng tín nhất của §Rtiếng nói từ tâm trí§! đang tự nung sắt để đóng dấu biểu tượng “Tận thế” lên da thịt mình. Bọn họ rêu rao rằng dấu ấn này sẽ ban cho người mang nó một đặc ân khủng khiếp.\n\nDù là thật hay giả, số người thực hiện nghi thức này đang tăng lên chóng mặt. Đây có thực sự là ý chỉ của §HCõi Màn Che§! không?"
 shroud.8380.a: "Chúng ta tự hào gánh vác lấy dấu ấn này."
 shroud.8380.a.tt: "Một nửa dân số của đất nước nhận được đặc điểm ['trait:trait_marked']."
 shroud.8380.b: "Hành động này đã bị lầm đường lạc lối."
 approach_blind_selected_tt: "Chưa chọn phương án đối phó $approach_situation_breach_shroud_endbringers_blind$."
 approach_forsake_selected_tt: "Chưa chọn phương án đối phó $approach_situation_breach_shroud_endbringers_forsake_flesh$."

 trait_marked: "Kẻ Được Đánh Dấu"
 trait_marked_desc: "Giống loài này tự đóng dấu “Tận thế” lên da thịt như một nghi thức trung thành đầy man rợ."
 trait_marked_unity_bonus: "£unity£Mỗi 100£pops£ dân số sản xuất: §G+0.06§!"

 endbringers_sanity: "Sự Minh mẫn Cuối cùng"
 endbringers_sanity_desc: "Quyết tâm mãnh liệt để giữ vững lý trí đã giúp chúng ta thoát khỏi cái bẫy của sự điên loạn."

 # Breach the Shroud
 shroud.2840.name: "$BREACHING_SHROUD_PROJECT$"
 shroud.2840.desc: "$shroud.2800.intro$ Từ tận cùng sâu thẳm vô hình của nó, một thực thể mang điềm gở với sức mạnh không thể đong đếm đã xuất hiện. Đó chính là §Rtiếng nói từ tâm trí§!, nó đâm xuyên vào nơi sâu thẳm nhất trong tâm hồn chúng ta bằng một sức mạnh khiến người ta phải run rẩy.\n\n§R“Hãy biết tên ta.”§!\n\nMãi đến hôm nay, chúng ta mới nhận ra tâm trí nhỏ bé của mình vẫn còn cách §Rtiếng nói từ tâm trí§! xa đến nhường nào. Phong ấn đã bị đập vỡ, và chẳng bao lâu nữa, bản ngã hoàn chỉnh sẽ được bộc lộ.\n\n"
 shroud.2840.a: "Đã đến lúc giao cảm rồi."

 ENDBRINGERS_COMMUNE_WITH_THE_VOICE: "Giao cảm với §Rtiếng nói từ tâm trí§!"
 ENDBRINGERS_COMMUNE_WITH_THE_VOICE_DESC: "Chúng ta tập hợp tại [capital_scope.GetName] vì một mục tiêu duy nhất.\n\nChúng ta phải tiến sâu vào §HCõi Màn Che§!, để sức mạnh to lớn của §Rtiếng nói từ tâm trí§! có thể công nhận chúng ta, và giao tiếp với chúng ta.\n\nChúng ta gọi đó là Đại Thảm Họa. Còn những kẻ khác gọi Ngài là Kẻ Định Đoạt (Reckoning). Giờ đây, Ngài sẽ tiết lộ chân danh của mình cho chúng ta, và một khi đã biết được, chúng ta sẽ làm nên những điều vĩ đại."
 ENDBRINGERS_COMMUNE_WITH_THE_VOICE_PROJECT_TOOLTIP: "Yêu cầu hoàn thành: §HThám hiểm Tâm linh§! 3 lần. ([GetEndbringersDelveCount]/3)"

 # EotC Delve Events
 shroud.8420.title: "Phán quyết của Sự Tĩnh lặng"
 shroud.8420.desc: "Chúng ta chìm vào Cõi Màn Che, ý chí đoàn kết đã đè bẹp được những tạp âm hỗn loạn, giúp chúng ta tập trung vào mục tiêu của mình. §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§!.\n\nNhưng chỉ có mục tiêu thì không đủ để bảo vệ chúng ta. Vô vàn tiếng nói thì thầm những lời sáo rỗng vô vị, mưu đồ dìm chúng ta vào những thứ cám dỗ đầy nhiễu nhương, cái này vô nghĩa hơn cái kia, nhưng lại quyến rũ đến lạ thường.\n\nNgay khi tâm trí chúng ta sắp bị xé nát, thực thể ấy đã trở lại, buông một mệnh lệnh vang vọng trong khoảng không hư vô:\n\n§R“Câm miệng.”§!"
 shroud.8420.a: "Chìm vào im lặng và cam chịu."
 shroud.8420.a.reply: "Mệnh lệnh đó đã chẻ đôi sự hỗn loạn, quét sạch những tạp âm chói tai, san phẳng mớ bòng bong phiền toái đang cố gắng nuốt chửng chúng ta. Dù phải chịu đựng sự vỡ nát, tinh thần của chúng ta vẫn được bảo toàn.\n\n§R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§! rút về nơi sâu thẳm của Cõi Màn Che. Sự tĩnh lặng rõ ràng theo sau đó cũng đinh tai nhức óc không kém. Nó lấp đầy khoảng trống trong tim, để lại cho chúng ta một sự kiên định mới.\n\nVà cả những món quà. Những món quà thật tuyệt vời."
 shroud.8420.a.tooltip: "§Y$endbringers_madness_1$§! mất các hiệu ứng sau:\n$t$$MOD_POP_AMENITIES_USAGE_MULT$: $@madness_base_pop_amenities_usage_mult|0=-%$"

 shroud.8430.title: "Phán quyết Thuần khiết"
 shroud.8430.desc: "Khi lặn sâu vào Cõi Màn Che, chúng ta đã chứng kiến sự thối rữa của mớ hỗn độn đầy cảm tính.\n\nNhững tâm trí mục nát và lười biếng đã sinh ra vô vàn tầng lớp nhiễu loạn tâm linh, dùng thứ mùi hôi thối để làm ô uế Cõi Màn Che. Giữa đống hỗn độn đáng tởm này, chúng ta cảm nhận được một sự tồn tại áp đảo tất cả, §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§!.\n\nKhi Ngài đến gần sự hỗn độn, luồng sát khí tà ác đó đã bão hòa hoàn toàn tâm hồn chúng ta. Một mệnh lệnh vang vọng vào cõi hư vô, và chúng ta cũng đã chuẩn bị sẵn sàng cho sự ân xá sắp tới:\n\n§R“Trật tự. Đoàn kết.”§!"
 shroud.8430.a: "Trụ vững!"
 shroud.8430.a.reply: "Mệnh lệnh đó cuốn trôi đi mớ hỗn độn ác độc.\n\nKhi §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§! gột rửa những thứ méo mó đầy cảm tính đang đầu độc Cõi Màn Che, vô vàn tiếng kêu la thảm thiết vang lên. Bỏ lại sau lưng Ngài là một vùng không gian không hoàn mỹ nhưng đã được tha thứ.\n\nThực thể này lặn trở lại vào vực sâu của Cõi Màn Che, chỉ để lại dư âm của sự thanh tẩy tuyệt đối cho chúng ta quan sát và nghiên cứu."
 shroud.8430.a.tooltip: "§Y$endbringers_madness_2$§! mất các hiệu ứng sau:\n$t$$mod_planet_pops_upkeep_mult$: $@madness_base_planet_pops_upkeep_mult|0=-%$"

 shroud.8440.title: "Thử thách của Lửa"
 shroud.8440.desc: "Bước vào Cõi Màn Che, chúng ta chỉ còn lại đớn đau. Làn sương mù tâm linh cuồn cuộn hóa thành luyện ngục, thiêu đốt đến tận cốt tủy tâm trí chúng ta.\n\nTrong sự giày vò, chúng ta chứng kiến các thành phố sụp đổ thành những đống đổ nát nóng chảy, các hành tinh bị ngọn lửa nuốt chửng, vô vàn sinh linh quằn quại trong ngọn lửa ma trơi, thân xác máu thịt hóa thành tro tàn âm ỉ.\n\nNgay tại trung tâm của ngọn lửa thiêu rụi vạn vật này, chúng ta cảm nhận được sự tồn tại của §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§!. Ngay khi sức mạnh của nó chuẩn bị nuốt chửng thực tại, thực thể này giáng xuống một sắc lệnh:\n\n§R“Gỡ bỏ phong ấn.”§!"
 shroud.8440.a: "Khuất phục trước quyền uy tối thượng."
 shroud.8440.a.reply: "Ngọn lửa tâm linh nuốt chửng tư tưởng của chúng ta, thiêu rụi mọi sự tự mãn. Chỉ còn lại sự quyết tâm thuần túy.\n\nGiờ đây chúng ta đã có thể chiêm ngưỡng sứ mệnh cao cả của §R[Root.Patron:end_of_the_cycle.GetPreCommunicationName]§!, cùng với sự tinh giản tráng lệ mà nó bày ra."

 shroud.8450.title: "$utopia.3310.name$"
 shroud.8450.desc: "Một lời tuyên cáo vang vọng khắp đất trời:\n\n§R“Các ngươi đều đã biết danh ta.”§!\n\nMục tiêu tối thượng trong chuyến du hành giữa các vì sao của chúng ta, câu trả lời cho những thắc mắc suốt nhiều thế kỷ qua, nay đã được hé lộ. $end_of_the_cycle_color_article_cap$ đang vẫy gọi chúng ta. Khế ước đã được lập.\n\n§R“Sự tận cùng của vạn vật bắt đầu từ đây.”§!\n\nĐau đớn. Méo mó. Chắc chắn. Khi dư âm tan đi, số phận đã an bài.\n\nGiờ đây chúng ta cuối cùng cũng được chứng kiến. Thiên hà chìm vào tịch diệt, đắm chìm trong định mệnh không thể đảo ngược của §R$end_aura$§!."
 shroud.8450.a: "Một định mệnh tất yếu đang chực chờ phía trước."
 shroud.8450.a.homicidal: "Một nỗi kinh hoàng đẹp đẽ làm sao."
 shroud.8450.a.tech_tooltip: "Nhận được công nghệ:\n£society£['technology:tech_psionic_aura']\n£society£['technology:tech_aura_intensification']"

 embracing_the_end: "Ôm lấy Sự Kết thúc"
 embracing_the_end_desc: "Cuối cùng, chúng ta đã chiêm ngưỡng được vẻ đẹp của sự kết thúc. Cứ thỏa sức giải phóng đi."

 MOD_SHIP_PSIONIC_AURA_SPEED_MULT: "Bất kỳ $MOD_SHIP_SPEED_MULT$ nào nằm trong $PSIONIC_AURA$"
 MOD_SHIP_PSIONIC_AURA_FIRE_RATE_MULT: "Bất kỳ $MOD_SHIP_FIRE_RATE_MULT$ nào nằm trong $PSIONIC_AURA$"

 end_of_the_cycle_endbringers: "$end_of_the_cycle_article_cap$"
 situation_end_of_the_cycle_endbringers_desc: "Chúng ta ký kết khế ước với $end_of_the_cycle_color_article$, được ban cho thứ quyền năng vô thượng, cùng với một sứ mệnh thiêng liêng.\n\nÝ chí của vị Chúa tể đòi hỏi phải xóa sổ hoàn toàn thực tại này. Cứ mỗi một hệ sao bị nuốt chửng, §H$end_aura$§! lại mang sự hủy diệt nhân từ đến gần hơn một bước.\n\nChúng ta sẽ là những nhân chứng cho cái kết tất yếu này.\n\nSố lượng hệ sao cần chinh phục: [Owner.GetEndCycleGalaxySystemsLeft]"
 end_of_the_cycle_endbringers_monthly_change_tooltip: "$end_of_the_cycle_monthly_change_tooltip$"
 situation_end_of_the_cycle_endbringers_finish_effects: "§RCuộc thanh trừng cuối cùng sắp sửa giáng xuống.§!"

 approach_situation_end_of_the_cycle_bring_the_inevitable: "Thúc đẩy Điều Tất yếu"
 approach_situation_end_of_the_cycle_stall_for_time: "Kéo dài Thời gian"
 approach_situation_end_of_the_cycle_delay_your_destiny: "Trì hoãn Thiên mệnh"

 shroud.8460.title: "Lật ngược Đồng hồ cát"
 shroud.8460.desc: "Sử dụng sức mạnh của $end_of_the_cycle_color_article$ là phải trả giá, và thời gian của chúng ta không còn nhiều.\n\nBiển sao vẫn chưa được đắm mình trong ánh sáng thanh tẩy của vị Siêu chúa của chúng ta. Những nỗ lực cho đến nay chỉ như muối bỏ bể.\n\nĐể được chứng kiến sự hoàn thành của công cuộc vĩ đại này, một luồng sinh khí mới đang cuồn cuộn đổ về từ bên kia bức màn. Đây chính là phúc lành đã được hứa hẹn!"
 shroud.8460.a: "Chúng ta vẫn có thể thành công."

 shroud.8470.title: "Ngày Tận thế Đang Đến"
 shroud.8470.desc: "Sức mạnh của vị Siêu chúa của chúng ta là vô biên, nhưng thời gian đã cạn kiệt. Hành vi tắc trách này tuyệt đối không thể được sự diệt vong nhân từ của $end_of_the_cycle_color_article$ dung thứ.\n\nVẫn còn một tia hy vọng: chúng ta phải để $end_aura$ nuốt trọn cả thiên hà bằng mọi giá. Trong thời khắc sinh tử, các [GetTelepathPlural] của chúng ta đang vắt kiệt từng giọt năng lượng cuối cùng từ §HCõi Màn Che§!."
 shroud.8470.a: "Chúng ta nhất định không được thất bại."

 shroud.8480.title: "$GALACTIC_FOCUS$ Đã Bị Bãi Bỏ"
 shroud.8480.desc: "Thượng viện Ngân hà đã bãi bỏ dự luật coi nguồn phát tán §H$PSIONIC_AURA$§! có tính hủy diệt là trọng điểm phòng thủ. Theo đó, mọi chiến dịch quân sự do các thành viên Cộng đồng Ngân hà phát động nhắm vào §H[former_malevolent_aura.GetName]§! đều bị đình chỉ ngay lập tức. Giờ đây, hòa bình đã trở lại với góc nhỏ này của thiên hà."

 shroud.8481.desc: "Thượng viện Ngân hà đã bãi bỏ dự luật tuyên bố coi chúng ta là mục tiêu \"phòng thủ\" của họ, tất cả các thành viên Cộng đồng đều nhận được chỉ thị giữ nguyên vị trí. Các chiến dịch quân sự nhằm vào chúng ta đã dừng lại... ít nhất là vào lúc này."
 shroud.8481.homicidal: "$shroud.8480.desc$\n\n$crisis.4111.nasty$"

 shroud.8500.title: "Kẻ Tiên Phong của Ngày Tận Thế"
 shroud.8500.desc.intro: "Ý chí không thể làm trái của vị Siêu chúa của chúng ta đang dần bóp chặt lấy biển sao. Giờ phút này, chúng ta đã tỏ tường cách thức mà ngày tận thế sẽ giáng xuống.\n\nPhải gieo rắc §R$end_aura$§! đến mọi ngóc ngách của thiên hà. Khi thế giới vật chất hòa quyện cùng bản chất nguyên thủy của §HCõi Màn Che§! này, sự hủy diệt đích thực sẽ liền kề kéo đến."
 shroud.8500.desc.outro: "Việc hoàn thành sứ mệnh vĩ đại này sẽ là kiệt tác để đời của chúng ta, đồng thời là cánh cửa dẫn đến sự cứu rỗi tối thượng."
 shroud.8500.desc.homicidal: "$shroud.8500.desc.intro$\n\nViệc tiêu diệt mọi sự sống trong thiên hà này sẽ là một hệ quả đi kèm đầy mãn nguyện. $shroud.8500.desc.outro$"
 shroud.8500.desc.default: "$shroud.8500.desc.intro$\n\n$shroud.8500.desc.outro$"
 shroud.8500.a: "Chúng ta nhất định không được thất bại."

 shroud.8600.title: "$shroud.4970.title$"
 shroud.8600.desc.intro: "Đây chính là định mệnh của chúng ta.\n\n§R$end_aura$§! đã nuốt chửng toàn bộ thiên hà. Người dân của chúng ta trên [Root.GetHomeWorldName] đang đắm chìm trong niềm hân hoan tột độ để ăn mừng thời khắc này."
 shroud.8600.desc.outro: "Một sự tái sinh huy hoàng sắp sửa giáng lâm, đây là lời hứa mà chúng ta đã được ban cho từ Thời kỳ Đại Tỉnh thức.\n\nTrước mắt, vạn vật đều bị hư không nuốt chửng. Xóa sổ và hủy diệt, đã trở thành quy luật duy nhất còn sót lại của biển sao. Các thế giới lần lượt sụp đổ, trở về với chốn hư vô ban đầu đã phôi thai ra chúng.\n\nChúng ta rồi sẽ đi đến hồi kết. Khung cảnh này... sao mà tráng lệ đến thế. Chúng ta đã thoáng thấy nó đang vùng vẫy trong một hình thái mong manh của sự sống mới. Ngày tàn đã điểm, và khoảnh khắc này chính là điểm khởi đầu."
 shroud.8600.desc.homicidal: "$shroud.8600.desc.intro$ Nhằm mục đích tiêu diệt tất cả những kẻ không phải đồng loại. $shroud.8500.desc.outro$"
 shroud.8600.desc.default: "$shroud.8600.desc.intro$ Sự cứu rỗi đầy nhân từ của chúng ta. $shroud.8600.desc.outro$"
 shroud.8600.a: "Mọi chuyện đã định đoạt... làm sao có thể như vậy được."

 shroud.8610.title: "Cái Giá Của Sự Yếu Đuối"
 shroud.8610.desc.intro: "Chúng ta đã thất bại. Chính vì sự yếu đuối của chúng ta, $end_of_the_cycle_color_article$ đã không thể thu được thành quả huy hoàng như kỳ vọng. Giờ đây, chúng ta phải trả giá cho sự vô năng của chính mình.\n\nNó đã nuốt chửng tất cả. Chỉ trong chớp mắt, [Root.GetName] đã... biến mất. Những thuộc địa từng phồn hoa nhộn nhịp, nay chỉ còn là một đống hoang tàn. Những hạm đội hùng mạnh từng tung hoành trong cõi hư không, nay chỉ còn lại sự tĩnh lặng chết chóc cùng vô số mảnh vụn. Vạn vật đều bị sự tận cùng cắn nuốt. Tất thảy đều đã bị §HCõi Màn Che§! tước đoạt."
 shroud.8610.desc.outro: "Giờ phút này, vị Siêu chúa của chúng ta đã hiện hình thành một thực thể Cõi Màn Che khổng lồ trên bầu trời [former_capital.GetName]. Thông qua việc hấp thụ ý thức của các cá nhân tâm linh của chúng ta, nó đã đoạt được một luồng sức mạnh vô song, và hiện đang rảo bước khắp tinh không, thề sẽ hoàn tất sứ mệnh mà chúng ta vẫn còn đang dang dở."
 shroud.8610.desc.a: "$shroud.8610.desc.intro$\n\n$shroud.8610.desc.outro$"
 shroud.8610.desc.b: "$shroud.8610.desc.intro$\n\nĐại đa số [Root.GetSpeciesNamePlural] đều đã chấp nhận số phận này, nhưng vẫn còn một nhóm nhỏ những kẻ bất kính không chịu khuất phục trước ý chí tối thượng của Siêu chúa. Bọn họ là những kẻ lưu vong do §H[Root.GetRulerName]§! dẫn dắt — vị cá nhân tâm linh quyền năng này đã nhìn thấy trước kết cục sắp buông xuống; giờ đây đám người này đã trốn chạy đến một hành tinh nằm ngoài tầm với của cơn thịnh nộ từ ngày tận thế.\n\n$shroud.8610.desc.outro$ Sau khi hoàn thành sứ mệnh của mình, nó sẽ tìm đến đám người lưu vong này để thanh toán nợ nần."
 shroud.8610.a: "Có lẽ đây chính là kết cục mà số phận đã an bài cho chúng ta..."
 shroud.8610.b: "Liệu những kẻ lưu vong kia có thực sự chống đỡ nổi uy quyền của nó không?"

 shroud.8710.title: "Sống sót qua Ngày Tận Thế"
 shroud.8710.desc: "Đại công cáo thành. §RKẻ Định Đoạt (Reckoning)§! đã bị tiêu diệt.\n\n$end_of_the_cycle_color_article_cap$ đã phải rút lui về lại nơi sâu thẳm của §HCõi Màn Che§!. Mối đe dọa mà nó gây ra cho thực tại vật lý của chúng ta tạm thời đã bị kiềm chế.\n\nKhi cái xác Cõi Màn Che hóa thân của nó xoay vòng và thoát ly khỏi sự tồn tại này, chúng ta đã thu hồi thành công phần tàn dư vật lý từ hiện thân của nó. Ngay cả khi đã chết, những nhà ngoại cảm của chúng ta vẫn có thể cảm nhận được luồng sức mạnh tâm linh đáng kinh ngạc phát ra từ nó, cường đại hơn gấp bội so với mảnh vỡ được tìm thấy trên §H[shrouded_planet.GetName]§!.\n\nLõi năng lượng cô đọng tính tất yếu này có thể được dùng để tái thiết lại mọi thứ từ đống tro tàn của các hệ sao may mắn sống sót sau đợt thanh trừng này.\n\nNgày tận thế đã đến rồi đi, nhưng không hiểu sao, chúng ta vẫn còn bám trụ lại được."
 shroud.8710.a: "Lẽ nào đây mới thực sự là cái kết đã được định sẵn cho chúng ta?"

 r_core_of_the_reckoning: "Lõi Thanh Trừng"
 r_core_of_the_reckoning_desc: "Được thu hồi từ tàn tích của “Kẻ Định Đoạt”, lõi này vẫn không ngừng tỏa ra nguồn năng lượng tâm linh ở mức độ vô cùng cao."
 core_of_reckoning_active_effect_tt: "Mở khóa một £decision£§YQuyết định hành tinh§!: ['concept_banish_decision']"

 decision_banish: "Trục xuất"
 decision_banish_desc: "Chỉ cần để mặc cho Cõi Màn Che nuốt trọn lấy nơi này, là có thể khôi phục lại sự cân bằng cho Lõi Thanh Trừng."
 decision_banish_effects_tt: "Đày ải hành tinh này vào trong Cõi Màn Che."
 concept_banish_decision: "$decision_banish$"
 concept_banish_decision_desc: "$decision_banish_desc$\n$decision_banish_effects_tt$\nThêm hiệu ứng §Y$shroud_surge$§! kéo dài §Y10§! năm:\n$shroud_surge_effects$"
 shroud_surge: "Làn sóng Cõi Màn Che"
 shroud_surge_desc: "Sự cân bằng trên $r_core_of_the_reckoning$ đã được khôi phục tạm thời."
 shroud_surge_effects: "Tăng gấp đôi các hiệu ứng tích cực của §Y$r_core_of_the_reckoning$§!."

#======================
# Shroud Leaders
#======================

 ganthuata: "Ganthuata"
 ganthuata_desc: "Một môn đồ ngoan đạo của $the_cradle_of_souls_article$, khao khát kiếm tìm những chân lý sâu sắc của Ngài, đồng thời cũng luôn muốn chia sẻ chúng với những ai sẵn sàng đón nhận."
 ganthuata_catch_phrase: "Chúng ta đang nép mình trong vòng tay của cái nôi."

 leader_trait_disciple_of_the_cradle: "Môn đồ của Cái Nôi"
 leader_trait_disciple_of_the_cradle_desc: "Quan sát càng nhiều, chúng ta càng biết thêm nhiều điều; khi chúng ta dõi theo những người láng giềng, $the_cradle_of_souls_article$ lại càng trở nên an toàn hơn."
 leader_trait_disciple_of_the_cradle_envoys_zro: "$t$—Đặc phái viên được chỉ định cho Siêu chúa sẽ tạo ra §G+0.5§! £zro£§Y$sr_zro$§! mỗi tháng"

 shroud.12010.desc: "§HSự cộng hưởng của chúng ta với Cõi Màn Che đã thu hút một giọng nói mới lạ đầy thiện ý. Chất giọng trầm ấm, vỗ về của nó vang vọng khắp cả cõi vật chất lẫn tinh thần.§!\n\nXin chào. Tôi là Ganthuata, đến đây để tìm kiếm những người bạn đồng hành đã giác ngộ được chân lý. Các bạn đã từng nghe nói về những lời sấm truyền của $the_cradle_of_souls_article$ chưa?"
 shroud.12010.name: "$ganthuata$"
 shroud.12010.a: "Chúng tôi đã lắng nghe những lời của $the_cradle_of_souls_article$. Nhưng tại sao bạn lại hỏi như vậy?"
 shroud.12010.a.response: "Tại sao ư? Thử nghĩ xem, tại sao một lữ khách lại đi hỏi han những người họ bắt gặp trên đường? Đương nhiên là để hiểu thêm về chính những người đó rồi, bạn của tôi ơi. Trong khi bạn đang thắc mắc nhiều lời, tôi đây lại đang khiêm nhường học hỏi đấy."
 shroud.12010.b: "Bạn muốn nhận được điều gì từ chúng tôi?"
 shroud.12010.b.response: "Một người được nuôi dưỡng bởi cái nôi, thì còn mong cầu điều gì nữa? Trước tiên, thứ tôi tìm kiếm chính là tình hữu nghị của các bạn. Tôi đã mỏi mắt tìm kiếm suốt cả một kỷ nguyên, chỉ để tìm ra những tâm hồn đồng điệu với sự huy hoàng của Cái Nôi. Giờ đây, một nền văn minh toàn vẹn đang cựa mình nảy nở dưới ánh hào quang ấy."
 shroud.12010.c: "Bạn có thể giúp được gì cho chúng tôi?"
 shroud.12010.c.response: "Tôi sẽ giúp bạn truyền tải thông điệp này ra khắp tinh không. Hãy cùng nắm tay nhau, đón chào toàn bộ thiên hà tiến vào vòng tay êm ái của Cái Nôi."
 shroud.12010.hire_custom_tooltip: "§Y$ganthuata$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."

 koborokra: "Koborokra"
 koborokra_desc: "Một cựu binh từng phải gánh chịu những đòn tra tấn tâm linh tàn bạo từ kẻ thù của [Root.GetHisHer]. Giờ đây, vị đô đốc hải quân đầy thương tích này đã bị thao túng bởi một khao khát hủy diệt vô độ."
 koborokra_catch_phrase: "Có những sự hy sinh đổ máu là điều không thể tránh khỏi."

 leader_trait_disciple_of_the_eater: "Sứ giả Đẫm máu"
 leader_trait_disciple_of_the_eater_desc: "Lãnh đạo này đã lập lời thề máu với $the_eater_of_worlds_article$."
 leader_trait_disciple_of_the_eater_attunement_effect: "Mỗi trận chiến hạm đội giành chiến thắng sẽ tăng §G+$@disciple_of_the_eater_combat_attunement$§! độ hòa nhịp với $the_eater_of_worlds_article$"
 leader_trait_disciple_of_the_eater_zro_fleet_attack_effect: "$t$—Oanh tạc quỹ đạo tạo ra §G+$@disciple_of_the_eater_zro_fleet_attack|1$§! $i_zro$ với mỗi 1% mức độ tàn phá"
 leader_trait_disciple_of_the_eater_zro_army_attack_effect: "$t$—Lực lượng tấn công tạo ra §G+$@disciple_of_the_eater_zro_army_attack|0$§! $i_zro$ với mỗi 1% mức độ tàn phá"

 shroud.12020.name: "$koborokra$"
 shroud.12020.desc: "§HẨn giấu bên dưới bộ giáp tơi tả vì khói lửa chiến tranh và lớp áo choàng đẫm máu là một kẻ bịt mặt. Một tiếng gầm gừ khàn khàn bất chợt xé toạc bầu không khí tĩnh lặng.§!\n\nThiên hà này phải chịu đau khổ là lẽ đương nhiên. Tôi cảm giác rằng các người cũng có cùng suy nghĩ đó.\n\n§HVị chỉ huy hạm đội này vừa cất lời, [shroud_leader.GetHeShe] vừa vuốt ve chuôi của một món vũ khí có phần lưỡi được chạm khắc tinh xảo.§!\n\nTôi được gọi đến bên cạnh các người, nhưng đến cùng, lòng trung thành của tôi vẫn thuộc về $the_eater_of_worlds_color_article$."
 shroud.12020.desc.covenant: "$shroud.12020.desc$ Các người cũng thế thôi."
 shroud.12020.desc.no_covenant: "$shroud.12020.desc$ Rồi có ngày các người cũng sẽ như vậy."
 shroud.12020.a: "Tại sao cô lại muốn gia nhập với chúng tôi?"
 shroud.12020.a.response: "Chỉ khi bắt tay cùng nhau, chúng ta mới có thể bóp nghẹt những vì sao ở mọi ngóc ngách của thiên hà. Dựa vào sức lực của một cá nhân thì nỗi thống khổ rải xuống cũng chỉ có giới hạn mà thôi."
 shroud.12020.b: "Chúng tôi có thể tin tưởng cô không?"
 shroud.12020.b.response: "$the_eater_of_worlds_article_cap$ đang chi phối từng hơi thở của tôi. Tôi đã thề sẽ cống hiến đời mình cho Ngài, và tôi đã nhìn thấy trước khoảnh khắc này ngay trong những giấc mơ. Phục vụ các người chính là ý muốn của Ngài. Nếu bị khước từ, thì sinh mệnh của tôi cũng đi đến hồi kết."
 shroud.12020.c: "Tại sao cô lại phục vụ cho $the_eater_of_worlds_article$?"
 shroud.12020.c.response: "Tôi từng bị người ta phản bội, đập cho tan xương nát thịt, và vứt bỏ dưới hố sâu tăm tối của sự đau đớn. $the_eater_of_worlds_article_cap$ đã thầm thì bên tai tôi. Ngài ban cho tôi những thứ cần thiết để sống sót qua cơn bĩ cực đó — đắp những mảnh vải rách thấm đẫm máu lên những vết thương rỉ máu. Ngài trao cho tôi quyền năng để chặt đứt bàn tay của những kẻ từng bạo hành tôi. Nên giờ đây, tôi đang mắc một món nợ máu với Ngài."
 shroud.12020.d: "Cô có thể mang đến điều gì cho chúng tôi?"
 shroud.12020.d.response: "Chúng ta sẽ cùng nhau dùng ngọn lửa thanh tẩy để rửa tội cho vô số hệ sao, đắm mình trong buổi dạ tiệc đẫm máu hòa cùng bản giao hưởng của những tiếng gào thét bi ai. Chúng ta sẽ cùng nhau chống mắt lên xem thế giới này cháy rụi, và cho cả tinh không này chứng kiến một viễn cảnh mà nó sẽ không bao giờ có thể quên đi. Đây chính là số mệnh của chúng ta."
 shroud.12020.hire_custom_tooltip: "§Y$koborokra$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."

 morr: "Morr"
 morr_desc: "Hắn từng là một kẻ thợ mỏ hèn mọn, do thường xuyên tiếp xúc với các mạch khoáng $zro_lower$ bất ổn trong một thời gian dài, nên đã vô tình tạo ra một sợi dây liên kết đầy quyền năng nhưng cũng điên rồ với $the_instrument_of_desire_article$. Về sau, hắn đã dùng mối quan hệ này để vơ vét một khối tài sản kết xù đáng thẹn, mở các khu mỏ lộ thiên trên khắp các hành tinh, và tuồn chiến lợi phẩm ra ngoài với cái giá cắt cổ."
 morr_catch_phrase: "Mọi thứ lấp lánh đều thuộc về chúng ta."

 leader_trait_disciple_of_the_instrument: "Trái tim Tham lam"
 leader_trait_disciple_of_the_instrument_desc: "Lãnh đạo này có độ tương thích rất sâu với $the_instrument_of_desire_article$, đến mức có thể linh cảm được sự tồn tại của các nguồn tài nguyên ngay cả ở những nơi cằn cỗi nhất của thiên hà."
 leader_trait_disciple_of_the_instrument_planetary_decision_effect: "—Mở khóa Quyết định Hành tinh §Y$decision_divine_deposits$§!"

 decision_divine_deposits: "Bói toán Khoáng mạch"
 decision_divine_deposits_desc: "Dưới sự dẫn dắt bởi lực hấp dẫn bí ẩn của $the_instrument_of_desire_article$, thống đốc của hành tinh này đã tìm thấy được những kho lưu trữ tài nguyên thất lạc từ lâu."
 decision_divine_deposits_tt: "Thêm ngẫu nhiên một đặc điểm hành tinh thuộc loại tài nguyên."

 shroud.12030.name: "$morr$"
 shroud.12030.desc: "§HÁnh mắt của $morr$ không ngừng đảo quanh, lờ mờ lúc ẩn lúc hiện trong tranh tối tranh sáng, tựa như một cuộc săn lùng không có hồi kết.§!\n\nNgươi cũng cảm nhận được nó đúng chứ? $the_instrument_of_desire_article_cap$ biến đổi khôn lường. Nó khao khát, nó cắn nuốt, và nó ra lệnh.\n\nTa sẽ đoạt lấy những kỳ trân dị bảo mà ta lướt qua. Bất cứ món quà nào mà thiên nhiên ban tặng đều không thể thoát khỏi tay ta. Ta phục vụ cho ngươi, không phải vì lòng trung thành, mà là vì chúng ta có thể cùng nhau quét sạch muôn vàn vì sao, để lấp đầy những khoảng trống hư vô đáng có kia."
 shroud.12030.a: "Tại sao ngươi lại muốn gia nhập với chúng ta?"
 shroud.12030.a.response: "$the_instrument_of_desire_article_cap$ chẳng bao giờ biết điểm dừng. Ngài cần rất nhiều [root.species.GetHandNamePlural] làm việc quần quật mới mong đổi lấy được sự bằng lòng của Ngài."
 shroud.12030.b: "Ngươi có thể cung cấp điều gì cho chúng ta?"
 shroud.12030.b.response: "Ta có thể giúp ngươi bòn rút từng phân tử sinh lời trong tự nhiên. Mỗi một nguyên tử đều sẽ bị tóm gọn, đánh dấu và mang đi bán.\n\nBiết đủ là nhu nhược. Thật đáng buồn làm sao. Hãy để cho lũ khốn đó mục rữa đi, còn chúngáng ta sẽ cùng nhau đi chinh phục vạn vật."
 shroud.12030.c: "Tại sao ngươi lại phục dịch cho $the_instrument_of_desire_article$?"
 shroud.12030.c.response: "Trước đây ta từng là thợ đào mỏ, luôn mải miết chạy theo những quặng khoáng sản mà các vì sao có thể ban phát. Không khí thì ngập ngụa bụi bặm, máy quét thì hư hỏng, những lời tuyên bố xáo rỗng... thế rồi $the_instrument_of_desire_article$ đã lên tiếng.\n\nNgài hứa hẹn sẽ mang đến cho ta một núi của cải khổng lồ, và thứ duy nhất Ngài cần đánh đổi chính là lòng trung thành.\n\nNên giờ đây ta luôn phục tùng, vắt kiệt, và dâng hiến. Món nợ này sẽ kéo dài vĩnh viễn... nhưng còn của cải ư? Của cải là vô tận."
 shroud.12030.hire_custom_tooltip: "§Y$morr$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."

 kronen: "Kronen “Kẻ chịu đựng”"
 kronen_desc: "Từng là một thiên tài với tầm nhìn sâu rộng, nhưng nay lại trở thành một cái vỏ bọc tàn tạ, nhà khoa học sống tách biệt với phần còn lại của thế giới này đã bị những âm mưu thâm hiểm của $the_composer_of_strands_article$ làm cho tha hóa. Giờ đây, chỉ còn lại sự thông thái đáng kinh ngạc của ông ta là vẫn còn thoi thóp, tựa như những vì tinh tú sắp tàn trong bóng đêm lúc tỏ lúc mờ."
 kronen_catch_phrase: "Vẫn còn vô vàn những bí ẩn chưa thể nào có lời giải..."

 leader_trait_disciple_of_the_composer: "Sợi dây Đau khổ"
 leader_trait_disciple_of_the_composer_desc: "Kẻ này càng đắp nặn ra nhiều sinh linh máu thịt, thì hình hài của chính hắn lại càng vỡ nát. $the_composer_of_strands_article_cap$ sẽ dùng những loại tà thuật cấm kỵ để nhào nặn lại bất kỳ kẻ nào dám mon men đến con đường này."

 shroud.12040.name: "$kronen$"
 shroud.12040.desc: "§HKhi cảm biến của chúng ta phát hiện một phi thuyền đang phá vỡ đường biên giới, một giọng nói căng thẳng vang dội khắp Cõi Màn Che — mệt mỏi, the thé, nhưng lại mang một cảm giác quen thuộc đến rợn người, tựa như tiếng vo ve của $the_composer_of_strands_article$.§!\n\nMột [GetKronenFlesh]... mới sinh ư? Thú vị đấy. Thật mềm mại. Thật... dễ nặn. Hay là không phải vậy? Rất khó để nói. Vô số thứ đang vặn vẹo nhung nhúc bên dưới lớp [GetKronenSkin] kìa. Hôm nay $the_composer_of_strands_article$ đã thêu dệt nên hình hài gì cho ta vậy nhỉ?\n\n§HKênh liên lạc cuối cùng cũng đã ổn định, hé lộ một nhân dáng được tạo thành từ những khối cơ thịt nguyên thủy không ngừng ngọ nguậy — đang co giật, và đang điên cuồng ghi chép.§!\n\nNgươi đã được chiêm ngưỡng hình dạng thật của ta. Có lẽ ta vẫn là $kronen$, mà cũng có lẽ đã không còn là ta nữa rồi. Nhưng ta có thể cảm nhận được ngươi, cũng giống như ta, đều là những tấm toan được trải sẵn dưới ngòi bút của Chúa tể Các Sợi Dây. Đến đây nào. Hãy cùng nhau vén bức màn bí mật này lên."
 shroud.12040.a: "Bắt đầu? Bắt đầu cái gì cơ?"
 shroud.12040.a.response: "Tại sao ư, tất nhiên là bắt đầu lột xác rồi. Gạt phăng đi lớp vỏ bọc sần sùi đầy khiếm khuyết này. Cởi trói khỏi những sợi dây rợ đang gò ép chúng ta vào một hình thù, một cái khuôn mẫu nhất định nào đó. Dấu ấn của Chúa tể Các Sợi Dây cũng đang hằn trên cơ thể ngươi đấy thôi. Ngươi đã bắt đầu từ lâu rồi cơ mà... lẽ nào ngươi không cảm thấy nó đang đập thình thịch dưới lớp [GetSkinType] của ngươi sao?"
 shroud.12040.b: "Tại sao ông lại muốn gia nhập cùng chúng tôi?"
 shroud.12040.b.response: "Chẳng lẽ ngươi không cảm nhận được sao? Cái vết hằn đó, nó đã khắc sâu vào từng sợi tơ đang rung lên bần bật. Ta phải tháo dỡ bản thân, rũ bỏ đi lớp áo cũ, để được chiêm ngưỡng cái quá trình bản ngã tan rã, để tự tay giật đứt những đường kim mũi chỉ đang khâu vá mớ máu thịt này lại. Nhưng ngươi... ngươi là một đế chế. Rộng lớn bao la. Quyền năng vô hạn. Nếu chúng ta bắt tay với nhau, thì có thể giật dây những mạch máu vĩ đại vượt xa giới hạn mà riêng ta hay ngươi có thể chạm đến."
 shroud.12040.c: "Ông có thể giúp ích được gì cho chúng tôi?"
 shroud.12040.c.response: "Thứ ta đem lại không chỉ đơn thuần là sự giúp đỡ. Da thịt của ta là một tặng phẩm, là một cuộc thí nghiệm xoay quanh nỗi đau đớn và ý nghĩa thực sự của nó, do chính tay $the_composer_of_strands_article$ đẽo gọt. Từng tấc tế bào của ta đều đang gào thét, nhưng ta mặc kệ. Ta vẫn nghiên cứu. Ta vẫn học hỏi. Và mọi sự kết tinh từ những đau khổ của ta... đều sẽ do ngươi định đoạt. Chỉ cần chúng ta cùng nhau nhào nặn ra nó là được."
 shroud.12040.hire_custom_tooltip: "§Y$kronen$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."

 shroud.12045.desc: "§HCùng với việc cơ thể có dấu hiệu phình to, $kronen$ càng lúc càng trở nên kích động hơn. Giọng nói của ông ta run rẩy vì căng thẳng, thân hình co giật, chuyển động liên hồi, các thớ thịt sục sôi trong những cơn biến đổi dữ dội, thốt ra những tiếng gầm rống của sự thất bại.§!\n\nNhững sợi chỉ này, sao mà nhiều vô kể... Bọn chúng đang vặn vẹo kìa, ta kéo, ta xé, nhưng mớ chỉ tết này chẳng suy suyển lấy một ly! Ta còn phải chịu đựng cái đống da người gớm ghiếc này đến bao giờ đây? Phải lột bỏ thêm bao nhiêu lớp da nữa, thì mới có thể nhìn thấu được chân lý ẩn chứa bên trong?"
 shroud.12045.a: "Rốt cuộc đã xảy ra chuyện gì?"
 shroud.12045.a.response: "Chuyện gì ư? Một chuyện thôi sao? Ha, ngây thơ quá. Mỗi khi ta lột đi một sợi chỉ, mỗi khi chúng ta bứt đứt một sợi dây mong manh sáng loáng, thì những sợi dây khác lại càng siết chặt lại! Và từ đầu đến cuối, $the_composer_of_strands_article$ vẫn luôn miệng ngâm nga thứ giai điệu tởm lợm, chọc ngoáy vào tận tâm can đó..."
 shroud.12045.a.response_2: "$shroud.12045.a.response$\n\n$shroud.12045.desc_2$"
 shroud.12045.b: "Ông có cần phải nghỉ ngơi một chút không?"
 shroud.12045.b.response: "Nghỉ ngơi? Không, không bao giờ. Chúng ta không được phép đứng yên, tuyệt đối không thể để cho cái khối thịt đáng thương này rục nát trong sự tầm thường. Ta không cần sự nghỉ ngơi... thứ ta cần là đối tượng để thí nghiệm. Cần những vật liệu dễ uốn nắn, cần vật tư để điêu khắc, và cần gốc rễ để lột xác."
 shroud.12045.b.response_2: "$shroud.12045.b.response$\n\n$shroud.12045.desc_2$"
 shroud.12045.c: "Chúng tôi có thể giúp được gì không?"
 shroud.12045.c.response: "Ngươi có thể gợi cho ta nhớ lại... hình bóng lúc trước của ta trông như thế nào không? Nói cho ta nghe, lúc chúng ta trò chuyện lần đầu, tứ chi của ta có màu này không? Màng sừng của ta có đục ngầu như thế này chưa? Mỗi lần cố vắt óc nhớ lại, thì cơ bắp của ta lại càng chìm sâu hơn trên con đường này.\n\nKhông... quá khứ ở đây chẳng có giá trị gì cả. Sự khai sáng nằm ở ngay trong chính những thay đổi. Đối với $the_composer_of_strands_article$, dĩ vãng đã không còn một chút ý nghĩa. Lui đi. Ta phải... suy ngẫm đã."
 shroud.12045.c.response_2: "$shroud.12045.c.response$\n\n$shroud.12045.desc_2$"
 shroud.12045.desc_2: "§HKronen co giật dữ dội. Con mắt độc nhất trắng dã lộn ngược ra sau, da thịt đập thình thịch, cuộn trào sóng lượn, và rồi đột nhiên... bất động. Quá trình tái cấu trúc dị hợm và vặn vẹo này đã kết thúc chóng vánh y hệt như lúc nó mới bắt đầu.§!\n\nÁ... xin chào. Có cần gì không?"
 shroud.12045.d: "Ông không sao chứ?"
 shroud.12045.d.response: "Chắc chắn rồi. Tại sao ta lại phải bất ổn chứ? Những sợi tơ này đã mở mang trí óc của ta hơn nữa, đúc nặn lại bộ khung bầy nhầy vô dụng này, để phù hợp hơn với ý đồ thiết kế của $the_composer_of_strands_article$. Giờ thì, xin lỗi cho ta vắng mặt một chút... vẫn còn cả mớ manh mối cần ta gỡ rối. Và còn rất nhiều bộ xương khô ngoài kia đang chờ để được gạt đi.\n\n§HNgay khi hệ thống liên lạc bị ngắt kết nối, một đợt sóng cộng hưởng vang lên âm ỉ trong Cõi Màn Che. Bất chấp hiểm họa nào đang che phủ lấy Kronen ngay lúc này... thì đó tuyệt đối không phải là sự trùng hợp ngẫu nhiên. Đây hoàn toàn là ý chí của $the_composer_of_strands_article$§!"
 shroud.12045.end: "Món quà của Chúa tể Các Sợi Dây không phải là thứ để đùa giỡn."

 zulyn: "Zulyn “Người Lắng nghe”"
 zulyn_desc: "Một học giả đã rũ bỏ những rào cản của lối nghiên cứu khoa học hàn lâm, để mải miết chạy theo những bí mật được lật mở từ những tiếng vang cuồng loạn của $whisperers_in_the_void_article$."
 zulyn_catch_phrase: "Chúng ta chỉ cần lắng nghe..."

 shroud.12050.name: "$zulyn$"
 shroud.12050.desc: "§HTừ bên trong bộ truyền tin bất ngờ phát ra những tiếng nhiễu sóng chói tai, cùng với những lời xì xầm của một giọng nói mang âm sắc đầy hối thúc đến rợn gáy.§!\n\nGửi lời chào đến bạn, người lắng nghe cùng tần số. Tôi đã bắt được giọng nói của bạn giữa chốn náo nhiệt này — à không, phải là *những giọng nói* mới đúng. Giờ thì bạn cũng đã nghe thấy chúng rồi đúng không? Khúc hợp xướng hoành tráng của $whisperers_in_the_void_color_article$, những đặc ân rầm rì của họ, và sự cuồng nộ lẩm bẩm trong miệng họ?\n\nChứa đựng những huyền cơ sâu sa như vậy thực sự là quá nguy hiểm đối với những kẻ không có năng lực giác ngộ. Tuy nhiên tôi có thể giúp bạn lần ra manh mối. Khi phải hứng chịu trận hồng thủy đầy rẫy sự nghịch lý cấu xé lý trí, tôi sẽ chìa bàn tay ra kéo bạn lên. Đừng vội để bụng nhé. Vì đã từng có một khoảng thời gian, ngay đến tôi cũng chẳng mảy may hiểu được chân ý thực sự của nó."
 shroud.12050.a: "Tại sao cô lại nghĩ rằng mình có thể giúp ích được gì?"
 shroud.12050.a.response: "Bạn đã vượt qua sự che đậy của §HCõi Màn Che§!, phải vậy không? Thử kể tôi nghe xem, bạn đã bao giờ thực sự khống chế được nó chưa? Cả đời tôi đã bán mạng để đào bới nơi vực thẳm của nó, để vẽ lại quỹ đạo của những thực thể không tên cư ngụ trong đó, cùng với dư âm của chúng vang vọng đến thế giới mỏng manh của chúng ta.\n\nChúa tể của Những lời Thì thầm luôn là người chỉ đường dẫn lối cho tôi. Và những tiếng lẩm bẩm mất trí đang vây kín tâm trí bạn lúc này đây? Tôi có thể giúp bạn thấu hiểu được chúng."
 shroud.12050.b: "Cô biết được những gì về Chúa tể của Những lời Thì thầm?"
 shroud.12050.b.response: "Suốt nhiều năm qua, tôi đã miệt mài ghi chép lại những lời xầm xì của Ngài, để đợi một ngày như hôm nay. Nay bạn đã có thể cộng hưởng được với dàn hợp xướng ầm ĩ của bọn họ, thì làm sao tôi có thể bỏ lỡ cơ hội bới móc chân tướng chôn sâu bên trong đó được chứ."
 shroud.12050.c: "Cô sẽ mang đến điều gì cho chúng tôi?"
 shroud.12050.c.response: "Sự miệt mài học hỏi cả đời đã mài dũa nên khả năng tập trung của tôi, giúp tôi mổ xẻ được cấu trúc của thế giới vật chất và hố đen vô tận kia của §HCõi Màn Che§!.\n\nChúng ta sẽ cùng nhau đập nát những gông cùm của trần thế này. Mọi bí mật trong vũ trụ đều sẽ phơi bày trước mắt chúng ta. Tôi lấy danh dự để thề thốt với các bạn."
 shroud.12050.hire_custom_tooltip: "§Y$zulyn$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."

 leader_trait_disciple_of_the_whisperers: "Lắng nghe Tâm thanh"
 leader_trait_disciple_of_the_whisperers_desc: "Lãnh đạo này luôn lắng nghe những tiếng vang của $whisperers_in_the_void_article$ từ bên trong Cõi Màn Che, nhờ đó thu được những góc nhìn khoa học hiếm có về các cơ chế khuất lấp của vũ trụ vật lý."
 leader_trait_disciple_of_the_whisperers_effects: "$t$—Khi nghiên cứu khoa học công nghệ §YHiếm§! hoặc §YTâm linh§! sẽ tạo ra $@disciple_of_the_whisperers_tech_zro|0=+$$i_zro$"

 ouwron: "Ouwron"
 ouwron_desc: "Bởi đã chính mắt trông thấy $end_of_the_cycle_article$, Ouwron đã bị bộ tộc du mục của mình xua đuổi, từ đó lênh đênh lưu lạc khắp cõi tinh không, cầu xin sự để mắt của Thượng đế. Giờ đây, khi $NAME_Reckoning$ đang tiến lại gần, kẻ này đã thắp lên một hoài bão rực cháy, thề không bỏ cuộc."
 ouwron_catch_phrase: "Ngày tính sổ sắp đến rồi."

 shroud.12060.name: "$ouwron$"
 shroud.12060.desc_1: "§HMạng lưới truyền tin của chúng ta đã bị một loạt tín hiệu nhiễu khó hiểu đánh úp. Giữa mớ hỗn độn này, một giọng nói bắt đầu len lỏi lọt qua.§!\n\nCuối cùng, thì bạn cũng đến. Dù không tính là đúng giờ, nhưng cũng không hẳn là quá trễ. Đừng sợ, tôi có thể nhìn xuyên thấu những đường biên giới nhỏ hẹp của cái nhà tù vật chất mang tên thực tại này. Món đồ cúng đã được dâng lên, con đường của tôi đã bày ra rõ ràng trước mắt."
 shroud.12060.desc_blind: "\n§HLúc này chúng ta mới nhận ra: cũng giống như chúng ta, sinh mệnh này cũng đã cống hiến đôi mắt của chính mình cho sự nghiệp tuyệt diệt vẻ vang nhất.§!"
 shroud.12060.desc_default: "\n§HĐến lúc này chúng ta mới chú ý, hốc mắt của kẻ này trống rỗng vô hồn, đã bị móc đi từ đời nào.§!"
 shroud.12060.desc_2: "\nThôi nào, đừng có ngại ngùng. Tôi thừa biết bạn đã lén nhìn thấy sự giản đơn vượt bậc của $end_of_the_cycle_color_article$ rồi. Hãy cộng hưởng cùng tôi, chúng ta sẽ chung tay gọi nó hiển linh."
 shroud.12060.a: "Ngươi đã biết đến sự tồn tại của $end_of_the_cycle_article$ bao lâu rồi?"
 shroud.12060.a.response: "Từ trước khi tôi có nhận thức. Cũng như mọi trí tuệ khác, những điều đã biết sẽ nằm yên trong giấc mộng dài, cho đến khi §HCõi Màn Che§! xé nát bức màn che đậy. Thứ ý chí thuần khiết của nó rồi sẽ phơi bày rõ mồn một. Mục đích của chúng tôi chỉ có một: Dẫn lối ngày tận thế"
 shroud.12060.b: "Tại sao ngươi lại muốn giúp bọn ta?"
 shroud.12060.b.response: "Bạn đi hỏi một thứ mà chính bạn đã biết tỏng rồi còn gì. Tất cả chúng ta đều đã nhìn thấy được tính tất yếu của nó. Sự đổ vỡ đã khơi mào. Giờ chỉ có cách nhắm mắt đưa chân tiến lên, chứ không lùi được nữa. Chúng ta sẽ cùng nhau quẩn quanh bay lượn, rồi sẽ đến điểm tận cùng."
 shroud.12060.c: "Ngươi có thể cung cấp điều gì cho chúng ta?"
 shroud.12060.c.response: "Giữa bánh xe vận mệnh lụi tàn này, tôi cũng chỉ hạt bụi, và chúng sinh muôn loài cũng vậy. Vậy tôi còn có thể tự tay ban phát được thứ gì đây? Nhận thức đang dần bay hơi khỏi hệ sao này, và tôi bị giao phó cho cái chức trách phải chỉ điểm cho chúng biến mất lẹ lẹ lên... nhưng bây giờ, tôi sẽ bố thí sự nhân đạo đó cho bạn."
 shroud.12060.hire_custom_tooltip: "§Y$ouwron$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."

 leader_trait_disciple_of_the_end: "Giáo sĩ Tận thế"
 leader_trait_disciple_of_the_end_desc: "Một giáo sĩ ngoan đạo của $end_of_the_cycle_article$, niềm tin kiên cường vào sự xuất hiện của $NAME_Reckoning$ trong lòng kẻ này không ngừng ngân vang trên mọi nẻo đường chinh chiến."
 leader_trait_disciple_of_the_end_effects: "$t$—Tăng cường cường độ quang phổ $@disciple_of_the_end_aura_intensity|0=+$ cho mỗi phi thuyền bị tiêu diệt trong hệ sao $TABBED_NEW_LINE$—Khi ở bên trong §H$end_aura$§!, sẽ nhận được $@disciple_of_the_end_jumpdrive_range|0=+%$$MOD_SHIP_FTL_JUMPDRIVE_RANGE_MULT$"

 shroud.12155.name: "Sự kết án Không Lời bào chữa"
 shroud.12155.desc: "§HGieo nhân nào gặp quả nấy. Giữa lúc hệ thống thông tin của chúng ta vẫn còn đang bốc khói, thì $ouwron$ đã giáng đòn sấm sét chất chứa cơn giận dữ của công lý xuống.§!\n\nLũ dị giáo! Đám ngu muội! Những kẻ lừa dối vĩ đại! Lẽ ra bọn ta phải biết sớm hơn chứ. Ngay từ lúc thứ cặn bã nhơ nhuốc như các ngươi cả gan dấn bước vào §HCõi Màn Che§!, thì đáng lý phải bị diệt trừ ngay tức khắc.\n\nCác ngươi chẳng qua cũng chỉ đang cố gắng níu kéo ngày tận thế vốn đã được ấn định từ lâu mà thôi! Lì lợm chống trả như thế này thì có tác dụng gì? Những đặc quyền mà các ngươi được thừa hưởng giờ đây cũng chỉ như bong bóng xà phòng.\n\nChỉ có duy nhất một kết cục. Vậy thì hát lên đi... hát vang bài ca đón mừng sự tan biến!"
 shroud.12155.tt: "$ouwron$ đang đối đầu với chúng ta!"

 NAME_Ouwron_Battleship: "$battleship$"
 NAME_Ouwron_Destroyer: "$destroyer$"

 shroud.12160.title: "Tuyên chiến"
 shroud.12160.desc: "[global_event_country.GetGalCommunityOrGalImperium] đã thông qua một nghị quyết, liệt kê chúng ta vào mục tiêu quân sự của họ. Mọi thành viên của [global_event_country.GetGalCommunityOrGalImperium] hiện nay đều đang trong trạng thái giao chiến với [this.GetName]. Chúng ta bắt buộc phải ráo riết chuẩn bị để nghênh đón các đòn tấn công từ hạm đội của chúng."
 shroud.12160.a: "$extreme_frontiers.1531.i$"

