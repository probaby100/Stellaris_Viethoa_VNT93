 resolution_galactic_focus_repeal_crisis_malevolent_aura: "Hủy bỏ $resolution_galactic_focus_crisis_malevolent_aura$"
 resolution_galactic_focus_repeal_crisis_malevolent_aura_desc: "Tới nước này là quá đủ rồi. Giờ đây chúng ta không nên tiếp tục chỉ định đế chế đó làm trọng tâm phòng thủ chung nữa. Tình trạng đối địch của toàn bộ các quốc gia thành viên trong Cộng đồng Ngân hà với quốc gia đó phải được bãi bỏ ngay lập tức."
 resolution_galactic_focus_crisis_malevolent_aura: "Trọng điểm: Hào quang Quỷ quyệt"
 resolution_galactic_focus_crisis_malevolent_aura_desc: "Một vầng hào quang tâm linh đầy ác ý đang lan tỏa khắp thiên hà, đe dọa đến sự sinh tồn của mọi nền văn minh. Chúng ta phải đoàn kết lại thành một khối thống nhất để giáng trả mối hiểm họa này, và triệt tiêu cái đế chế đang phát tán vầng hào quang này. Đây là việc bắt buộc phải trở thành trọng điểm của chúng ta."
 resolution_galactic_focus_crisis_malevolent_aura_effect_success: "$resolution_galactic_focus_crisis_effect_success$\nMọi đế chế nằm trong [global_event_country.GetGalCommunityOrGalImperium] đều nhận được tiến độ công nghệ §H$tech_psionic_suppression$§!: §G+25%§!"
