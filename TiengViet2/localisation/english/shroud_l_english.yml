 shroud.1510.title: "$PSIONIC_AURA$ Xung Đột"
 shroud.1510.desc: "§H$PSIONIC_AURA$§! của chúng ta trong hệ sao [from.GetName] đang xảy ra xung đột với Hào quang đối địch từ hệ sao [fromfrom.GetName] lân cận. Các [GetResearchers] ngoại cảm của chúng ta đã lập mô hình cho hành vi này, nhưng đây là lần đầu tiên chúng ta ghi nhận được hiện tượng này trực tiếp.\n\nVề mặt lý thuyết, một Hào quang mạnh hơn - hay cụ thể là được cường hóa cao hơn - sẽ dần dần áp đảo một Hào quang yếu hơn. Nếu cuộc chiến này dẫn đến thất bại hoàn toàn của một bên, Hào quang chiến thắng có thể sẽ lan tràn vào hệ sao vừa bị bỏ trống.\n\nĐây thực sự là một \"sự va chạm của các linh hồn\"."
 shroud.1510.a: "Ý chí của chúng ta sẽ chiến thắng."

 shroud.1550.title: "Sức Mạnh Của Ý Chí"
 shroud.1550.desc.common_1: "Những cuộc thăm dò đầu tiên của chúng ta vào §HCõi Màn Che§! đã khiến năng lượng của nó rò rỉ vào vũ trụ có thể quan sát được. Mặc dù đáng kể, nhưng những ảnh hưởng này khá nhỏ lẻ."
 shroud.1550.desc.common_2: "Khi các hành động của chúng ta tạo ra tiếng vang trong Cõi Màn Che, khoảng cách giữa chúng ta và các thực thể hùng mạnh được rút ngắn lại. Nếu chúng ta nhận được sự ưu ái từ chúng, chúng ta có thể truyền năng lượng ngoại cảm của chúng vào không gian thực tại. Các [GetTelepathPlural] của chúng ta tin rằng \"Hào quang\" sinh ra có thể cường hóa đế chế của chúng ta"
 shroud.1550.desc_1.knows: "$shroud.1550.desc.common_1$ §H\"$PSIONIC_AURA_PLURAL$\"§! là một phương pháp để biến ảnh hưởng này thành một dòng chảy liên tục."
 shroud.1550.desc_1.default: "$shroud.1550.desc.common_1$ Lý thuyết §H\"$PSIONIC_AURA_PLURAL$\"§! đại diện cho một phương pháp để biến ảnh hưởng này thành một dòng chảy liên tục."
 shroud.1550.desc.knows: "$shroud.1550.desc_1.knows$\n\n$shroud.1550.desc.common_2$ cũng như các đồng minh của chúng ta, đồng thời làm suy yếu kẻ thù - tương tự như những gì chúng ta đã quan sát trước đây."
 shroud.1550.desc.knows.homicidal: "$shroud.1550.desc_1.knows$\n\n$shroud.1550.desc.common_2$, cũng như làm suy yếu kẻ thù - tương tự như những gì chúng ta đã quan sát trước đây."
 shroud.1550.desc.default: "$shroud.1550.desc_1.default$\n\n$shroud.1550.desc.common_2$ cũng như các đồng minh của chúng ta, đồng thời làm suy yếu kẻ thù."
 shroud.1550.desc.default.homicidal: "$shroud.1550.desc_1.default$\n\n$shroud.1550.desc.common_2$, cũng như làm suy yếu kẻ thù."
 shroud.1550.a: "Có rất nhiều tiềm năng."

