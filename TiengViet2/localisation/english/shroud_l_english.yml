 trait_tankbound: "Gắn liền bình ấp"
 trait_tankbound_desc: "Loài này sinh sống trong những chiếc bình chứa đầy dịch sinh học đặc biệt. Chúng phụ thuộc nặng nề vào các thiết bị hỗ trợ và không thể trực tiếp làm công việc chân tay."
 trait_tankbound_effects: "Phí bảo trì thức ăn của dân số (hoặc tài nguyên tương đương): §G-50%§!$TABBED_NEW_LINE$—§RKhông thể đảm nhận công việc lao động§!$TABBED_NEW_LINE$—§RKhông thể chiêu mộ làm lục quân§!"
 trait_tankbound_portrait_override_tt: "Yêu cầu các loài phải được đặt trong các thùng chứa hình trụ."

 trait_robot_latent_psionic: "$trait_latent_psionic$"
 trait_robot_latent_psionic_desc: "§LLoài này được lắp đặt bộ xử lý tiềm năng tâm linh, nhưng nó ở trạng thái ngủ đông trong phần lớn các đơn vị. Mặc dù rất hiếm, sức mạnh này đôi khi sẽ được kích hoạt ở một vài lãnh đạo.§!\n"

 trait_robot_psionic: "$trait_psionic$"
 trait_robot_psionic_desc: "§LTất cả đơn vị của loài này đều được trang bị phần cứng tâm linh uy lực. Chúng có thể thao túng thế giới vật chất và phi vật chất chỉ bằng các xử lý nhận thức.§!\n"

 trait_default_psionic_desc: "§LToàn bộ giống loài này đều nắm giữ sức mạnh tâm linh to lớn. Điều đó có nghĩa là họ có thể giao tiếp với nhau bằng thần giao cách cảm.§!\n"
 trait_hive_psionic_desc: "§LToàn bộ giống loài này đều nắm giữ sức mạnh tâm linh to lớn. Chúng có thể thao túng thế giới vật chất và phi vật chất chỉ bằng sức mạnh của tâm trí.§!\n"

