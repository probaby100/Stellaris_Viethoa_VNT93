 shroud.11225.title: "Đột ngột biến mất"
 shroud.11225.desc.common_1: "Mọi thứ trôi qua trong phút chốc.\n\n§R$end_aura$§! ác độc trong lãnh thổ của chúng ta đột ngột biến mất, kéo theo mọi thứ đi cùng. Các ngôi sao sụp đổ thành lỗ đen, các hành tinh bốc hơi tại chỗ, chỉ để lại sự tĩnh mịch đinh tai nhức óc."
 shroud.11225.desc.common_2: "Rốt cuộc là tên điên nào đã kích động sức mạnh hủy diệt này, có lẽ chúng ta sẽ không bao giờ biết được nữa."
 shroud.11225.desc.default: "$shroud.11225.desc.common_1$\n\n$shroud.11225.desc.common_2$"
 shroud.11225.desc.mitigated: "$shroud.11225.desc.common_1$ Có vẻ như nỗ lực chống lại hào quang của chúng ta đã có chút tác dụng làm dịu bớt, bảo lưu lại được một chút ít có thể.\n\n$shroud.11225.desc.common_2$"
 shroud.11225.a: "Sao điều này có thể xảy ra chứ?"

 SPECIAL_PROJECT_CALLING: "Lời kêu gọi của tri thức"
 SPECIAL_PROJECT_CALLING_DESC: "$whisperers_in_the_void_color_article_cap$ khao khát tri thức vượt ra khỏi những giới hạn tư duy bình thường. Trao quyền rộng rãi cho các [Owner.GetResearchers] của chúng ta, tập trung vào những lĩnh vực nghiên cứu chuyên sâu, ta có thể đáp ứng được lòng mong mỏi của tiếng thì thầm."
