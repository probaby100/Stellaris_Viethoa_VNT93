 shroud.first_contact.end.b.tt.the_instrument_of_desire: "Khám phá $the_instrument_of_desire_color_article$ trong §HCõi Màn Che§!."
 shroud.first_contact.end.c.tt.the_instrument_of_desire: "Mất đi lượng lớn §YĐộ Hòa Nhịp§! với $the_instrument_of_desire_color_article$.\n$shroud.first_contact.end.b.tt.the_instrument_of_desire$"

 shroud.4040.title: "$utopia.3300.name$"
 shroud.4040.desc: "Chúng ta biết rất nhiều giọng nói trong §HCõi Màn Che§!; tiếng vọng của họ đông đảo và có mặt ở khắp mọi nơi. Các [GetTelepathPlural] của chúng ta trong đợt xuất thần gần đây đã báo cáo về một thực thể vô cùng đặc biệt——§Hsự ồn ào phức tạp§! thẩm thấu vào tận trung tâm của Cõi Màn Che.\n\nSử dụng đủ năng lượng tâm linh, chúng ta có thể dựa theo dấu vết lần theo thực thể hùng mạnh này, các [GetTelepathPlural] của chúng ta gọi Ngài là §H[Root.Patron:whisperers_in_the_void.GetPreCommunicationName]§!."
 shroud.4040.a: "$utopia.2657.a$"
 shroud.4045.title: "$whisperers_in_the_void_article_cap$"
 shroud.4045.desc.intro: "Khi cố gắng trò chuyện với §H[Root.Patron:whisperers_in_the_void.GetPreCommunicationName]§!, chúng ta đã bị kéo vào tầng sâu nhất của Cõi Màn Che. Linh vực tầng trong này của Cõi Màn Che sóng yên biển lặng. Tiếng vọng của mọi tư tưởng đến từ mỗi lần luân hồi đều hội tụ lại thành một loại sức mạnh hồng hoang. Chúng ta nghe thấy sự luân chuyển vĩnh cửu mang đến âm thanh của sự tĩnh lặng: $whisperers_in_the_void_color_article$.\n\nÂm thanh chói tai và không hài hòa bao bọc lấy chúng ta. Và khi chúng ta đang cố gắng lắng nghe vô số thông điệp, cuối cùng cũng có một giọng nói duy nhất truyền đến [GetTelepathPlural] của chúng ta.\n\n§HLắng nghe là một sự cống hiến.§!\n\nNếu muốn rút thứ sức mạnh hùng mạnh này, chúng ta phải giúp thực thể này"
 shroud.4045.desc.covenant: "$shroud.4045.desc.intro$chiếm lấy linh vực của [GetCovenantPatronColor]. Làm như vậy sẽ thay thế hoàn toàn sự hiện diện đã biết của Đấng bảo trợ của chúng ta, phá vỡ giao ước đã ký kết. $shroud.4045.desc.outro$"
 shroud.4045.desc.no_covenant: "$shroud.4045.desc.intro$chiếm lấy linh vực của Đấng bảo trợ khác, thay thế hoàn toàn sự hiện diện đã biết của họ. $shroud.4045.desc.outro$"
 shroud.4045.desc.outro: "\n\nViệc này có thể sẽ mang lại hậu quả rất nghiêm trọng."
 shroud.4045.a: "Hãy để tiếng thì thầm cất vào."
 shroud.4045.a.covenant.tt: "§RKết thúc giao ước của chúng ta với [GetCovenantPatronColor].§!\nThay thế hoàn toàn linh vực của [GetCovenantPatronColor] bằng $whisperers_in_the_void_color_article$.\n§RSẽ có những hậu quả nhất định.§!"
 shroud.4045.a.no_covenant.tt: "Chúng ta sẽ chọn một linh vực của $major_patron$ để thay thế bằng $whisperers_in_the_void_color_article$.\n§RSẽ có những hậu quả nhất định.§!"
 shroud.4045.b: "Tốt nhất là đừng nên phá vỡ sự cân bằng của Cõi Màn Che."

 shroud.4046.title: "Cõi Màn Che biến thiên"
 shroud.4046.desc.1: "Ngay khi chúng ta vừa đưa ra lựa chọn, các [GetTelepathPlural] đã mãnh liệt nổi lên từ trong §HCõi Màn Che§!"
 shroud.4046.desc.2: "Trong đầu họ vang vọng vô vàn tiếng lòng khác nhau.\n\nLựa chọn của chúng ta đã định hình lại nhận thức về giới tâm linh một cách không thể đảo ngược. Cùng với ý thức của $whisperers_in_the_void_color_article$ rò rỉ vào, chúng ta nay đã không còn có thể cảm nhận được [GetCovenantPatronColor] nữa; linh vực của Ngài đối với chúng ta đã vĩnh viễn mất đi.\n\nChúng ta đang dần thấu hiểu ý chí của tiếng thì thầm. Chúng ta đã nhận thức được viễn cảnh của họ về kiến thức vô tận. Chỉ cần các [GetTelepathPlural] của chúng ta"
 shroud.4046.desc.3: "chúng ta có thể một lần nữa chủ động hành động, giao tiếp với sự hiện diện vô số này."
 shroud.4046.desc.robot: "$shroud.4046.desc.1$tỉnh lại. $shroud.4046.desc.2$khôi phục xong, $shroud.4046.desc.3$"
 shroud.4046.desc.organic: "$shroud.4046.desc.1$kích hoạt lên. $shroud.4046.desc.2$sạc đầy năng lượng, $shroud.4046.desc.3$"

 shroud.whispers_in_the_shroud.title: "Tiếng thì thầm trong Cõi Màn Che"
 shroud.whispers_in_the_shroud.a: "$utopia.2657.a$"

 minor_patron_instrument_cradle_intro: "Chúng ta nhận thấy mình đang ở giữa khu vực của $the_instrument_of_desire_article$ và $the_cradle_of_souls_article$."
 minor_patron_cradle_composer_intro: "Chúng ta nhận thấy mình đang ở giữa khu vực của $the_cradle_of_souls_article$ và $the_composer_of_strands_article$."
 minor_patron_composer_eater_intro: "Chúng ta nhận thấy mình đang ở giữa khu vực của $the_composer_of_strands_article$ và $the_eater_of_worlds_article$."
 minor_patron_eater_instrument_intro: "Chúng ta nhận thấy mình đang ở giữa khu vực của $the_eater_of_worlds_article$ và $the_instrument_of_desire_article$."
 minor_patron_default_intro: "Chúng ta nhận thấy mình đang ở giữa khu vực của những thực thể chính trong Cõi Màn Che."

 shroud.4050.desc: "[This.GetMinorPatronCradleComposerIntro]\n\nGiữa một đống những cấu trúc vô tri vô giác, chúng ta thăm dò được một §H$code_name_animator$§!, ý chí của nó đang nhào nặn luồng năng lượng nồng độ cao thành những hình thù kỳ dị mới.\n\nHành động của Ngài bị ngắt quãng bèn tiến lại gần, xua tan lớp sương mù dày đặc của Cõi Màn Che. Ngài đưa cho chúng ta một thứ.\n\nNếu chúng ta nhận lấy thì sẽ xảy ra chuyện gì?"
 shroud.4055.title: "$the_animator_of_clay_article_cap$ hiển linh"
 shroud.4055.desc: "Cùng với việc nhúng tâm trí vào trong dòng năng lượng đang sục sôi của Cõi Màn Che, [GetSpeciesBodyPlural] run rẩy một cách kỳ lạ. Chúng ta cảm nhận được §H$code_name_animator$§! bắt lấy chúng ta trong thoáng chốc. Ngài bảo chúng ta hãy nhìn cho kỹ.\n\nNhìn theo hướng được chỉ, sự u tối đầy ý vị dần lui đi, một hình bóng hiện ra. Tứ chi của nó bị từng sợi dây hư vô giật mạnh, sau đó những sợi dây đột ngột biến mất, hình nhân đó sụp đổ.\n\nNó co giật rồi sống lại, từng chi một từ từ đứng dậy, sau khi thoát khỏi sự trói buộc, lại bắt đầu một điệu nhảy như đang thôi miên."
 shroud.4055.desc.know_animator: "Chúng ta nhận ra thực thể này không hề xa lạ. $the_animator_of_clay_color_article_cap$ đang chơi rất vui vẻ. Nơi nào những thứ vô tri vô giác được đánh thức, hoặc những thứ nhàm chán được bơm đầy linh hồn, thì đều có thể tìm thấy Ngài ở đó."
 shroud.4055.a: "Hình nhân thoát khỏi dây tơ tự do khiêu vũ."

 shroud.4060.desc: "[This.GetMinorPatronCradleComposerIntro]\n\nChúng ta cảm nhận được vẫn còn những sự hiện diện khác. Một §H$code_name_outsider$§! đang ăn mòn ý thức của chúng ta, dấy lên một trận bão tâm linh ở xung quanh.\n\nMột sự tiếc nuối và khao khát sâu thẳm bị đẩy vào trong tâm trí tập thể của chúng ta. Thứ chúng ta nhìn thấy là hình ảnh của hệ sao quen thuộc từ hàng ngàn năm trước.\n\nBất kể thực thể này là gì, nó dường như rất am hiểu về hệ sao của chúng ta. Chẳng lẽ nó từng thuộc về nơi này?"
 shroud.4065.title: "$the_outsider_article_cap$ hiển linh"
 shroud.4065.desc.intro: "Thứ sức mạnh xa xôi được gọi là §H$code_name_outsider$§! này từ sâu trong §HCõi Màn Che§! dùng nỗi đau giày vò suy nghĩ của chúng ta. Nó im lặng không một tiếng động, cho chúng ta một lời cảnh báo không lời:\n\n§HTrong những linh vực này phải đi lại cẩn thận. Ngươi vốn không hề biết thế lực mình đang can thiệp vào rốt cuộc là thứ gì. Sự hủy diệt chỉ cách một bước chân...§!"
 shroud.4065.desc.outro_default: "Bất kể điều này có nghĩa là gì, $the_outsider_color_article$ đã được chúng ta biết đến. Số phận của chúng ta sẽ đan xen vào nhau ra sao vẫn còn chờ thời gian chứng minh."
 shroud.4065.desc.outro_know_zroni: "Thực thể này không hề xa lạ với hệ sao của chúng ta. Nó có dấu ấn tinh thần độc đáo của nền văn minh Zroni mà chúng ta đã từng gặp trước đây. Nhưng chuyện này sao có thể chứ?\n\nBất kể điều này có nghĩa là gì, $the_outsider_color_article$ đã được chúng ta biết đến. Số phận của chúng ta sẽ đan xen vào nhau ra sao vẫn còn chờ thời gian chứng minh."
 shroud.4065.desc.outro_left_zroni: "Chúng ta nhận ra thực thể này. Ngài là Tiên Tri mà chúng ta đã gặp gỡ ở phía bên kia §HKhe nứt tinh giới§!. Đây chính là số phận của cô ấy sao? Cô ấy chính là $the_outsider_color_article$ hiện tại sao?"
 shroud.4065.a.default: "Ngài đã biết đến nỗi sợ nào?"
 shroud.4065.a.know_zroni: "Người Zroni này vẫn còn sống sao?"
 shroud.4065.a.left_zroni: "Chúng ta tuyệt đối không được khuất phục trước số phận tương tự."

 shroud.4070.desc: "[This.GetMinorPatronComposerEaterIntro]\n\nMột luồng suy nghĩ biến đổi rơi xuống quanh ý thức của chúng ta. Cảm giác nặng nề thô ráp lướt qua người chúng ta, bóp méo cảm nhận về thời gian. Mỗi hạt tư duy đều đang mài giũa kết cấu của linh vực mới hình thành này.\n\nKhi các giác quan phai nhạt đi, §H$code_name_tide$§! cũng theo đó rút lui, để lại những dấu vết lảng vảng mãi không tiêu tan.\n\nNhững dấu vết này nán lại trước mắt chúng ta, thu hút chúng ta đi theo."
 shroud.4075.title: "$the_endless_tide_article_cap$ hiển linh"
 shroud.4075.desc: "§H$code_name_tide$§! trồi lên từ trong §HCõi Màn Che§!. Sự hiện diện của Ngài vô hình và rộng lớn, lan tràn vô tận trong tầm nhìn của chúng ta.\n\nMột tiếng thì thầm đầy hạt sạn trút xuống người chúng ta, xối tung lịch sử đã bị chôn vùi từ lâu. Chúng ta nhìn thấy những đế chế bị lãng quên hóa thành tro bụi trong dòng thời gian không thể cản bước. Mỗi hạt cát cọ rửa qua người chúng ta đều là một đoạn ký ức.\n\nTrong kho lưu trữ rộng lớn này, quy luật đã xuất hiện——đó là vòng tuần hoàn của tham vọng và hủy diệt, thắng lợi và suy tàn. Trí tuệ liền ẩn náu ở ngay đây.\n\n$the_endless_tide_color_article_cap$ vươn mình vượt qua chiều kích không thời gian, mài nhẵn đi sự ngu muội, chỉ để lại những thứ tình nguyện nhẫn nhịn."
 shroud.4075.a: "Loại trí tuệ này nay đã thuộc về chúng ta."

 shroud.4080.desc: "[This.GetMinorPatronComposerEaterIntro]\n\nLực hấp dẫn tạo ra từ chính hành vi của chúng ta kéo chúng ta ngày càng sâu, sức nặng này kéo chúng ta vào tận sâu thẳm của bóng tối ngột ngạt tựa như núi non trùng điệp.\n\nTừ những đỉnh núi xám xịt của Ngài phóng ra một ánh mắt kiên định, chọc thẳng vào đầu chúng ta. Chúng ta phải tốn bao nhiêu công sức mới hiểu được §H$code_name_mountain$§! trước mặt mình rốt cuộc đồ sộ đến nhường nào.\n\nĐỉnh núi cao nhất đang vẫy gọi chúng ta đến, thử thách xem chúng ta có thể lên tới đỉnh hay không."
 shroud.4085.title: "$the_pale_mountain_article_cap$ hiển linh"
 shroud.4085.desc: "Khi chúng ta bay lên độ cao chói lòa trong §HCõi Màn Che§!, đỉnh núi vô hình ngỡ như ngay trong tầm tay. §H$code_name_mountain$§! đích thân thử thách chúng ta, cũng như tất cả những vị khách đã từng đến đây trong quá khứ.\n\nLăng mộ cao vút tận mây xanh của Vương quốc Lãng quên hát cho chúng ta nghe bài thánh ca về lịch sử đã lụi tàn. Mỗi một tầng thất bại và tham vọng sai lầm đều được mài giũa thành hòn đá lót đường cho người đi sau.\n\nTuy nhiên, đây không phải là một nấm mồ chết chóc, mà là một chiếc nồi nấu kim loại. Vòng tuần hoàn của sự hủy diệt và phục hưng sẽ rèn đúc lại những thất bại trong quá khứ thành viên đá nền tảng cho chiến thắng trong tương lai. Hủy diệt không phải là kết thúc, mà là một khởi đầu mới.\n\n$the_pale_mountain_color_article_cap$ sừng sững mọc lên trong ý thức của chúng ta."
 shroud.4085.a: "Dãy núi vẫn sẽ còn cao thêm."

 shroud.4090.desc: "[This.GetMinorPatronInstrumentCradleIntro]\n\nMột sức nặng đầy dễ chịu khiến cho luồng suy nghĩ của chúng ta chậm lại, rơi vào một làn sương mù cực lạc. Sự căng thẳng chưa từng biết đến trước kia đã tan biến, thay vào đó là sự bình yên nhẹ nhàng và xa xỉ.\n\nKhi ngày càng chìm sâu vào cái ôm mạ vàng này, chúng ta nhìn thấy một §H$code_name_dream$§! ngày càng đến gần. Ngài thầm thì hứa hẹn về sự thỏa mãn xa hoa, bản chất siêu phàm của Ngài quét qua toàn thân chúng ta.\n\nSự buông thả lười nhác này khiến người ta thật tò mò."
 shroud.4095.title: "$the_golden_dream_article_cap$ hiển linh"
 shroud.4095.desc: "Chúng ta ngả mình vào một sự tĩnh lặng thong thả trong §HCõi Màn Che§!, nhận ra mình đã bị kéo vào đại sảnh mạ vàng của §H$code_name_dream$§!.\n\nSự cám dỗ mượt mà như lụa vắt ngang qua ý thức chúng ta, tựa như một bức thảm hoa lệ rực rỡ sắc màu mở ra ngay trước mắt. Sự lơ là phóng túng rất có thể sẽ làm cho tâm trí chúng ta trở nên mụ mẫm dưới sức nặng của gánh nặng trù phú.\n\n$the_golden_dream_color_article_cap$ ban cho chúng ta sự xa hoa vượt ngoài sức tưởng tượng."
 shroud.4095.a: "Giấc mơ đã tỉnh lại rồi."

 shroud.4100.desc: "[This.GetMinorPatronInstrumentCradleIntro]\n\nSự quấy nhiễu hỗn loạn của Cõi Màn Che vặn vẹo thành luồng xoáy năng lượng tâm linh. Bất chợt, vô số dòng chảy xiết tản ra rồi tụ hội lại với nhau, bị một sức mạnh vô hình nào đó trấn an. Nó bình tĩnh lại, chuyển hóa thành một hình thái mới đầy hòa bình.\n\nTrong quá trình quan sát, chúng ta phát hiện ra là một §H$code_name_point$§! đang chỉ huy tất cả những sự biến đổi này, kìm hãm sự hỗn loạn vào trong trật tự.\n\nSự bình yên của Ngài đang vẫy gọi chúng ta."
 shroud.4105.title: "$the_hollow_point_article_cap$ hiển linh"
 shroud.4105.desc: "Các [GetTelepathPlural] của chúng ta quyết liệt xâm nhập vào vòng xoáy hỗn loạn của Cõi Màn Che, nhưng chẳng ích gì. Chỉ khi ngừng vùng vẫy mới cảm nhận được cái ôm thực sự của §H$code_name_point$§!.\n\nCảnh tượng xuất hiện trong tâm trí chúng ta là những cuộc xung đột không thể cản phá, mỗi trận chiến đều tràn ngập sự nhiễu loạn của hỗn mang và phẫn nộ.\n\nTrong tất cả những điều này, chúng ta cảm nhận được sự cảnh giác và hiện diện vĩnh cửu của $the_hollow_point_color_article$. Ngài bình tĩnh và kiên nhẫn chờ đợi sự yên nghỉ của những cuộc xung đột không hồi kết trong hệ sao."
 shroud.4105.desc.outro_homicidal: "Mặc dù chúng ta có những bản năng nguyên thủy nhất, nhưng tâm trí chúng ta đã bị phơi bày trước một phương thức tư duy thật kỳ lạ."
 shroud.4105.a.default: "Kiên nhẫn sẽ lâu bền hơn xung đột."
 shroud.4105.a.homicidal: "Quả là một giấc mộng đau thương... Chúng ta biết mình cần phải làm gì."

 shroud.4110.desc: "[This.GetMinorPatronEaterInstrumentIntro]\n\nTiếng ồn hỗn loạn tụ lại thành màn đêm ngột ngạt. Chúng ta cảm thấy ý đồ của mình đang bị xem xét, nghiên cứu, phán xét một cách cẩn thận.\n\nKỳ vọng nặng nề về trật tự, không cho phép khiêu chiến, không thể thay đổi, đang chằm chằm nhìn từ sâu bên trong chúng ta. §H$code_name_throne$§! đang phán quyết ý đồ của chúng ta.\n\nÁnh mắt của nó xuyên qua chúng ta, màn đêm rút đi. Sự soi xét có tính lây lan mạnh mẽ này buộc chúng ta phải quy phục."
 shroud.4115.title: "$the_vacant_throne_article_cap$ hiển linh"
 shroud.4115.desc: "Chúng ta quỳ rạp trước §H$code_name_throne$§!.\n\nTâm trí chúng ta bị uy quyền không thể thỏa hiệp xem xét với thái độ thờ ơ lạnh nhạt, vừa phán xét chúng ta, vừa cố định chúng ta tại chỗ.\n\nKhoảng không áp bức của $the_vacant_throne_color_article$ không có lấy một tia nhân từ——nhưng cũng chẳng có đau đớn. Ngài chỉ tìm kiếm trật tự và sự chắc chắn, và áp đặt nó lên tất cả những nơi thiếu hụt.\n\nChúng ta nay sẽ gánh vác trách nhiệm này lên vai."
 shroud.4115.a: "Phán quyết sẽ luôn tồn tại."

 shroud.4120.desc: "[This.GetMinorPatronEaterInstrumentIntro]\n\nChúng ta đột nhiên sinh ra một cảm giác gia tốc, nhận thức bị nhấn chìm bởi dòng thông tin lũ lụt không thể lý giải. Chúng ta lao về phía chân trời vô tận mà không thể kiểm soát.\n\nCó một thực thể đang đồng hành cùng chúng ta. Đường §H$code_name_river$§! này dừng lại ngắn ngủi bên cạnh chúng ta, sau đó tăng tốc cho đến khi vượt qua những gì chúng ta vẫn luôn cho là giới hạn.\n\nChúng ta phải bám theo."
 shroud.4125.title: "$the_black_river_article_cap$ hiển linh"
 shroud.4125.desc: "Chỉ khi chúng ta cưỡng ép vượt qua giới hạn dễ chịu của §HCõi Màn Che§! thì mới cuối cùng tiếp xúc được với §H$code_name_river$§!.\n\nMột cảm giác chuyển động đa hướng với cảm giác tốc độ phi logic, không thể dùng bất kỳ hệ mét nào để nắm bắt đã đánh gục chúng ta. Chúng ta nảy sinh ảo giác đã đi qua một quãng đường rất xa chỉ trong chớp mắt.\n\nCuối cùng chúng ta cũng thấu hiểu $the_black_river_color_article$ và chuyến hành trình vô tận của nó. Sự bao la của hệ sao đang mở ra một con đường cho chúng ta."
 shroud.4125.a: "Tốc độ thuần túy."

 shroud.4135.title: "$end_of_the_cycle_article_cap$"
 shroud.4135.desc: "Không hề báo trước, chúng ta bị kéo xé vào trong Cõi Màn Che. Một sự hiện diện thoắt ẩn thoắt hiện tấn công ý thức của chúng ta.\n\nNgài là $end_of_the_cycle_color_article$, Ngài vẫn luôn đợi chúng ta. Các [GetTelepathPlural] của chúng ta bỗng nhiên đồng thanh xướng lên trong lúc xuất thần, miệng cùng nói: §R“Vẫn chưa đến lúc.”§! Ngập ngừng một chút. §R“Nhưng không phải là không thể.”§!\n\nNgài không nói gì thêm, nhưng đưa ra cho chúng ta một cái giá——sức mạnh, kiến thức cũng như sự giàu có vô tận mặc chúng ta sử dụng.\n\n§RChỉ cần chúng ta có thể mang đến sự kết thúc.§!"
 shroud.4135.a: "$utopia.3308.a$"
 shroud.4135.a.tt: "Thay thế lĩnh vực của mọi Đấng bảo trợ đã biết bằng $end_of_the_cycle_color_article$.\nChúng ta có 50 năm để nuốt chửng hệ sao vào trong §H$end_aura$§! của Ngài. Nếu thành công, trò chơi sẽ kết thúc.\n$covenant.cycle.tooltip$$shroud.8450.a.tech_tooltip$\n$shroud.4135.psionic_components_insight$\n\nViệc này sẽ giải trừ giao ước với mọi Đấng bảo trợ khác\n$eotc_opinion_modifier_tooltip$"
 shroud.4135.b: "Thoát khỏi Cõi Màn Che, cố gắng lãng quên."
 shroud.4135.b.forging_our_own_path: "Tiến bước trên con đường đã định, đơn độc một mình."
 shroud.4135.psionic_components_insight: "Nhận được tiến độ của mọi công nghệ ['concept_psionic_components']: §G+10%§!"
 concept_psionic_components: "Bộ phận tâm linh"
 concept_psionic_components_desc: "$tech_psionic_bombers$\n$tech_psionic_lightning$\n$tech_psionic_disruptor$\n$tech_zro_launcher$\n$tech_psionic_shield$\n$tech_precognition_interface$\n$tech_psi_jump_drives$"
 triggered_opinion_eotc_situation_stage1: "Triệu hồi sự kết thúc"

 shroud.4140.title: "Sướng khổ có nhau"
 shroud.4140.desc: "Số phận của chúng ta gắn liền với $end_of_the_cycle_color_article$; vầng hào quang của Ngài chiếu đến đâu, cư dân của chúng ta sẽ phồn thịnh sinh sôi đến đó. Chúng ta rút ra được một kết luận đơn giản: cản trở hào quang chính là cản trở [This.GetName], đáng bị nhổ cỏ tận gốc.\n\nChỉ cần muốn, chúng ta có thể gạt bỏ mọi rào cản nhắm vào mục tiêu quân sự, tàn nhẫn đi chinh phục kẻ thù. Không có thứ gì có thể cản trở đại thiện đạo của sự kết thúc."
 shroud.4140.a: "Nguyện ý trời được thực thi."
 shroud.4140.a.tooltip: "Mở khóa lý do tuyên chiến §H['concept_total_war']§!\n$eotc_opinion_modifier_2_tooltip$"
 triggered_opinion_eotc_situation_stage2: "Kẻ tiên phong cho sự kết thúc"

 shroud.4145.title: "Nhổ cỏ tận gốc"
 shroud.4145.desc_1.common_1: "Cùng với việc §R$end_aura$§! dần lấp đầy hệ sao, chúng ta cảm thấy sự kháng cự càng lúc càng mãnh liệt."
 shroud.4145.desc_1.common_2: "Nhưng tất cả đều chẳng đáng kể, bởi vì chúng ta sẽ không ngồi chờ các đế chế khác tiếp nhận $end_of_the_cycle_color_article$."
 shroud.4145.desc_1.default: "$shroud.4145.desc_1.common_1$ Những láng giềng phương xa của chúng ta sẽ nhanh chóng làm khó chúng ta. $shroud.4145.desc_1.common_2$"
 shroud.4145.desc_1.homicidal: "$shroud.4145.desc_1.common_1$ Sự phản cảm của kẻ thù đối với chúng ta đang càng lúc càng thâm căn cố đế. $shroud.4145.desc_1.common_2$"
 shroud.4145.desc_2: "Lấy cảm hứng từ mong muốn của Đấng bảo trợ, chúng ta đã phát minh ra một phương pháp sạc năng lượng mới cho vầng hào quang tiêu thụ năng lượng và vật chất. Có thể hiến tế vật chất của vũ trụ này để đẩy nhanh sự kết thúc."
 shroud.4145.a: "Phải làm hết sức mình."
 shroud.4145.a.tooltip: "$eotc_opinion_modifier_3_tooltip$\nMở khóa đạo luật:\n$t$—['edict:annihilation_of_matter', $edict_annihilation_of_matter$]\n$t$—['edict:annihilation_of_energy', $edict_annihilation_of_energy$][GetDimensionalCollapseEdictGain]"
 shroud.4145.dimensional_collapse: "\n$t$—['edict:dimensional_collapse', $edict_dimensional_collapse$]"
 triggered_opinion_eotc_situation_stage3: "$triggered_opinion_eotc_situation_stage2$"

 shroud.4150.title: "Khởi đầu của sự kết thúc"
 shroud.4150.desc: "Đấng bảo trợ của chúng ta vô ngôn mà nói. Chúng ta cảm nhận được sự kết thúc của luân hồi đang đến gần, năng lượng mới cũng theo đó dâng trào bên trong [This.GetName]. Cảm giác cấp bách này đang cổ vũ chúng ta.\n\nNếu chúng ta muốn thỏa mãn ý định kết thúc, mọi [This.GetSpeciesNamePlural] cần phải tập trung toàn bộ sức mạnh vào cùng một hướng. Chúng ta phải hiển thị sức mạnh của Đấng bảo trợ, mở rộng vầng hào quang của Ngài đến tận cùng hệ sao."
 shroud.4150.a: "Thời cơ đã đến."

