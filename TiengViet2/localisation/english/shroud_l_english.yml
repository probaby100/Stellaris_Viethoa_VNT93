 shroud.4935.desc: "$shroud.4862.shared$$end_of_the_cycle_color_article_cap$ đã hiển hiện một $pc_gaia$ ngay trong hệ sao §H[capital_scope.solar_system.GetName]§! của ta, mang đến mảnh đất lành cho loài [Root.GetSpeciesAdj]; một chốn địa đàng phù du để đón nhận sự kết thúc của vạn vật."
