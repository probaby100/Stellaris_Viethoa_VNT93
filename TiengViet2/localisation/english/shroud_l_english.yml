 civic_tankbound: "Cơ Thể Trong Bể"
 civic_tankbound_desc: "Các thành viên của xã hội này dành cả cuộc đời bên trong những bể dung dịch sinh học chuyên dụng. Do đó, họ phụ thuộc nghiêm trọng vào các thiết bị hỗ trợ và không thể trực tiếp làm công việc chân tay."
