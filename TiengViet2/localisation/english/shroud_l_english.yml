 # Carceral Test Facility
 building_carceral_test_facility: "Cơ sở Thử nghiệm Giam giữ"
 building_carceral_test_facility_desc: "Văn phòng chi nhánh quảng bá cơ hội nhượng quyền cho các bên liên quan, chịu trách nhiệm cấp phép thiết lập các chương trình thí nghiệm độc lập. Chống lại tội phạm, tăng cường phòng thủ!"

 building_psionic_offices: "Văn phòng Tâm linh"
 building_psionic_offices_desc: "Khi tiếp xúc trực tiếp với người nước ngoài trên thực địa, cơ sở này giúp thấu hiểu tư duy của họ hiệu quả hơn, từ đó đạt được các thỏa thuận thương mại có lợi nhất cho cả hai bên."
 building_psionic_offices_tt: "\nHiệu ứng hệ sao:\n$t$—$TRIGGER_BRANCH_OFFICE_OWNER$ nhận được một §Y$PSIONIC_AURA$§! với cường độ hàng tháng là $@psionic_offices_intensity|0+$\n$t$—§RHào quang Tâm linh từ chủ sở hữu hành tinh sẽ được ưu tiên hơn công trình này.§!"

 job_shroud_trader: "Chuyên viên Tiếp thị Ngoại cảm"
 job_shroud_trader_plural: "Chuyên viên Tiếp thị Ngoại cảm"
 job_shroud_trader_plural_with_icon: "£job_telepath£$job_shroud_trader_plural$"
 job_shroud_trader_desc: "Những chuyên gia này thấu cảm được xu hướng cảm xúc của thị trường địa phương, thông qua việc nắm bắt các luồng tư tưởng hiện hành để thúc đẩy giao dịch và tổ chức các hội thảo lãnh đạo tiên phong."
