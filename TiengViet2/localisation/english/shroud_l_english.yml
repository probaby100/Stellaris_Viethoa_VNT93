 DELVING_RITUAL: "Nghi thức Thâm nhập"
 DELVING_RITUAL_DESC: "§Y[shroudwalker_enclave_country.GetName]§! đã hoàn tất mọi chuẩn bị cần thiết cho nghi thức thâm nhập, có thể thay mặt chúng ta tiến vào §HCõi Màn Che§! bất cứ lúc nào. Vẫn chưa rõ họ có thể tìm ra những kiến thức gì cho chúng ta."

 MINDWARDENS_THE_FIRST_ENCLAVE: "Lãnh địa Đầu tiên"
 MINDWARDENS_THE_FIRST_ENCLAVE_DESC: "Chúng ta đã sẵn sàng thiết lập một §H'$gov_mindwarden_enclave$'§! độc lập để hỗ trợ chấm dứt sự lây nhiễm tâm linh trong thiên hà.\n\nMột khi được thành lập, tổ chức này có thể cung cấp các dịch vụ kháng tâm linh cho những ai cần, đồng thời thu về nguồn lợi và tài nguyên cho chúng ta."
 MINDWARDENS_THE_FIRST_ENCLAVE_NOTE: "Biến đổi một §Y$FLEET$§! có quy mô trên 30 và được chỉ huy bởi một §Y$commander$§! trong hệ sao do chúng ta kiểm soát thành một §Y$gov_mindwarden_enclave$§!."

 SHROUD_SHAPING_PROJECT: "Định hình Cõi Màn Che"
 SHROUD_SHAPING_PROJECT_DESC: "Vô số thực thể trong §HCõi Màn Che§! đều mang trong mình sức mạnh to lớn. Để nhận được sự che chở tối đa từ chúng, ta phải hình thành một sợi dây liên kết không thể vãn hồi.\n\nTuy nhiên, chúng ta đã tìm ra phương pháp riêng của mình. Thay vì trói buộc tâm trí vào một Chủ thể duy nhất, các [GetResearchers] có thể tìm cách rút tỉa từng luồng năng lượng nhỏ từ mọi thực thể, thậm chí định hình lại Cõi Màn Che theo ý chí của chính chúng ta."

 EXPLORE_BORDER_SYSTEM: "Khám phá hệ sao [exiled_system_border.GetName]"
 EXPLORE_BORDER_SYSTEM_DESC: "Ảnh viễn thám tầm xa cho thấy gần đây có một luồng năng lượng kỳ lạ bùng phát trong hệ sao §H[exiled_system_border.GetName]§!, trùng khớp với các chỉ số đo được khi $building_ancient_ward_1$ trên [owner.GetHomeWorldName] của chúng ta xảy ra dị thường.\n\nNếu muốn hiểu rõ hiện tượng này, chúng ta buộc phải khám phá hệ sao [exiled_system_border.GetName]."
 EXPLORE_BORDER_SYSTEM_TOOLTIP: "Phái §Ytàu thuyền§! hoặc §Yhạm đội§! đi khám phá hệ sao §Y[exiled_system_border.GetName]§!."

