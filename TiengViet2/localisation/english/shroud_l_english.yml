# Experimentation Chambers
 building_experimentation_chambers_1: "Viện Nghiên cứu Thí nghiệm"
 building_experimentation_chambers_1_desc: "Cơ sở tối mật dùng để thí nghiệm trên những kẻ vi phạm pháp luật không thể cải tà quy chính, bên trong chủ yếu là các buồng giam và phòng thí nghiệm nghiên cứu."

 building_experimentation_chambers_2: "Phức hợp Thí nghiệm"
 building_experimentation_chambers_2_desc: "Một khuôn viên gồm các cơ sở nghiên cứu và giam giữ tối mật, lấy những [Owner.GetIndividualNamePlural] vi phạm làm đối tượng để các [Owner.GetResearchers] hàng đầu đế quốc tiến hành nghiên cứu thí nghiệm."

 building_experimentation_chambers_3: "Trung tâm Thí nghiệm"
 building_experimentation_chambers_3_desc: "Hệ thống trung tâm thí nghiệm và giam giữ có cấp độ an ninh cao nhất. Đội ngũ [Owner.GetResearchers] tinh nhuệ chịu trách nhiệm thực hiện các thí nghiệm đột phá bằng cách sử dụng các [Owner.GetIndividualNamePlural] được tuyển chọn từ tầng lớp dưới của đế quốc."

# Lifecrypt
 # Lifecrypt (Normal)
 building_lifecrypt_1: "Tháp Chiết xuất"
 building_lifecrypt_1_desc: "Những thiết bị khổng lồ này có thể chiết xuất năng lượng dư thừa từ các nhóm đối tượng cụ thể gần đó. Những cá nhân được chỉ định sẽ mặc thiết bị chuyên dụng để truyền sức sống vào đường ống trung tâm, sau đó phân phối cho những người có địa vị cao hơn."

 building_lifecrypt_2: "Máy Hút Linh hồn"
 building_lifecrypt_2_desc: "Cái tên này có thể gây hiểu lầm, nhưng thiết bị hút linh hồn thực chất dựa trên khoa học thực tiễn. Chúng được hiệu chuẩn đặc biệt để chiết xuất năng lượng từ cơ thể qua dây dẫn, cho phép rút một lượng lớn năng lượng trao đổi chất mà không gây nguy hiểm đến tính mạng."

 building_lifecrypt_3: "Đường ống Tinh hoa"
 building_lifecrypt_3_desc: "Ranh giới của đường ống tinh hoa phải được đánh dấu rõ ràng, vì việc đi lạc vào phạm vi ảnh hưởng của nó mà không có thiết bị bảo hộ sẽ dẫn đến tử vong. Những cá nhân được chỉ định cần được huấn luyện để điều tiết quá trình trao đổi chất nhằm tránh tiêu hao quá nhiều năng lượng cùng lúc."

 # Lifecrypt (Machine)
 building_lifecrypt_machine_1: "Pin Hút Năng lượng"
 building_lifecrypt_machine_1_desc: "Những thiết bị khổng lồ này có thể chiết xuất năng lượng tính toán dư thừa từ các máy bay không người lái chuyên dụng ở cự ly gần. Các nhân công được chỉ định sẽ lắp đặt thiết bị đặc biệt để truyền tải năng lượng vào đường ống trung tâm, rồi phân phối đến các bộ phận quan trọng hơn."

 building_lifecrypt_machine_2: "Phức hợp Pin"
 building_lifecrypt_machine_2_desc: "Các thiết bị này được hiệu chuẩn đặc biệt để chiết xuất năng lượng từ máy bay không người lái thông qua dây dẫn vật lý, cho phép rút một lượng lớn sức mạnh tính toán dư thừa mà không gây ra lỗi hệ thống nghiêm trọng."

 building_lifecrypt_machine_3: "Nút Năng lượng"
 building_lifecrypt_machine_3_desc: "Ranh giới của nút năng lượng phải được đánh dấu rõ ràng, vì việc đi vào phạm vi ảnh hưởng của nó mà không có thiết bị cách điện phù hợp sẽ gây hỏng hóc vĩnh viễn cho các đơn vị máy."

 # Lifecrypt (Hive Mind)
 building_lifecrypt_hive_mind_1: "Tháp Chiết xuất"
 building_lifecrypt_hive_mind_1_desc: "Những thiết bị khổng lồ này có thể chiết xuất năng lượng dư thừa từ các thợ săn/thợ thuyền được chỉ định gần đó. Các cá thể này mang thiết bị chuyên dụng để truyền sức sống vào đường ống trung tâm, phân phối lại cho các cá thể cấp cao."

 building_lifecrypt_hive_mind_2: "Máy Hút Linh hồn"
 building_lifecrypt_hive_mind_2_desc: "Dù tên gọi nghe có vẻ huyền bí, máy hút linh hồn thực chất dựa trên khoa học thực nghiệm. Chúng được hiệu chuẩn để chiết xuất năng lượng từ các cá thể thông qua kết nối cơ thể, rút trích năng lượng sinh học mà không làm chết vật chủ."

 building_lifecrypt_hive_mind_3: "Đường ống Tinh hoa"
 building_lifecrypt_hive_mind_3_desc: "Ranh giới của đường ống tinh hoa phải được đánh dấu rõ ràng, vì việc lảng vảng trong tầm ảnh hưởng của nó mà không có sự chuẩn bị sẽ gây tử vong cho các cá thể. Các cá thể được chọn phải học cách kiểm soát trao đổi chất để không bị vắt kiệt quá nhanh."

 # Lifecrypt (Corporate)
 building_lifecrypt_corporate_1: "Trụ sở Hiệp lực"
 building_lifecrypt_corporate_1_desc: "Các thiết bị khổng lồ này chiết xuất năng lượng dư thừa từ các thực tập sinh được chỉ định. Họ phải mặc thiết bị chuyên dụng để dẫn truyền sinh lực vào hệ thống trung tâm, phục vụ cho những người ở cấp quản lý cao hơn."

 building_lifecrypt_corporate_2: "Cơ quan Quản lý Hiệp lực"
 building_lifecrypt_corporate_2_desc: "Công trình quản lý hiệp lực được hiệu chuẩn để hút năng lượng từ thực tập sinh qua dây dẫn, cho phép rút trích lượng lớn năng lượng sinh học mà vẫn duy trì được sự sống cho họ."

 building_lifecrypt_corporate_3: "Trung tâm Hiệp lực"
 building_lifecrypt_corporate_3_desc: "Ranh giới của trung tâm hiệp lực cần được cảnh báo rõ ràng; bất kỳ ai không có trang bị phù hợp khi vào đây đều sẽ mất mạng. Những người được chỉ định phải rèn luyện kỹ thuật hiệp lực nâng cao để đảm bảo sống sót trong quá trình này."

# Psionic Suppressor
 building_psionic_suppressor: "Máy Ức chế Tâm linh"
 building_psionic_suppressor_desc: "Phức hợp này vận hành một bộ giảm chấn tâm linh tầm xa, có khả năng làm tan biến các $PSIONIC_AURA_PLURAL$ trong toàn bộ hệ sao và ngăn chặn chúng lan rộng thêm."
 building_psionic_suppressor_tt: "§HCường độ§! của §Y$PSIONIC_AURA$§! trong hệ sao này giảm đi mỗi ngày: $@building_psionic_suppressor_decrease|0$"

# Materiality Engine
 building_materiality_engine: "Động cơ Vật chất hóa"
 building_materiality_engine_plural: "Động cơ Vật chất hóa"
 building_materiality_engine_desc: "Năng lượng tâm linh của Cõi Hư Không hiện hữu tại mọi điểm trong vũ trụ vật lý. $building_materiality_engine$ tận dụng điểm giao thoa này để chạm tới các chiều không gian khác, hiện thực hóa các linh kiện và tài nguyên hữu ích vào thế giới thực."
 building_materiality_engine_tt: "Bắt đầu §Ydự án đặc biệt§! để chiết xuất công nghệ ['concept_component'] tâm linh từ §HCõi Hư Không§!. Khi hoàn thành, dự án sẽ nâng cấp công nghệ của công trình này và tăng số lượng §H$building_materiality_engine_plural$§! có thể xây dựng."

