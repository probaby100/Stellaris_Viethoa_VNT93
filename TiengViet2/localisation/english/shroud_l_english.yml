 # Experimental Testing - Test subjects escape
 shroud.1105.title: "$job_test_subject_plural$ Vượt Ngục"
 shroud.1105.desc.intro: "Một lượng lớn các đối tượng thí nghiệm giá trị cao đã trốn thoát khỏi một cơ sở trên §H[root.GetName]§! qua đường hầm.\n\nĐường hầm này được đào bằng các công cụ thô sơ và bằng [Owner.GetSpeciesHandNamePlural] trần, chắc chắn đã mất nhiều năm. Chúng ta không thể biết có bao nhiêu người biết về sự tồn tại của nó, cũng như tại sao nó lại không bị phát hiện trong một thời gian dài như vậy."
 shroud.1105.desc.escaped: "Sự cố này liên tục tái diễn, đòi hỏi một biện pháp quyết liệt để ngăn chặn triệt để. Lòng khoan dung trước đây của chúng ta về vấn đề này dường như lại trở thành lời cổ vũ cho những cá thể còn lại."
 shroud.1105.desc.outro: "Sự việc này cần phải có những biện pháp cứng rắn để đảm bảo nó không bao giờ xảy ra nữa."
 shroud.1105.a: "Chúng đã giành được sự tự do."
 shroud.1105.a.tt: "Một nửa số §Y$job_test_subject_plural$§! trên §H[root.GetName]§! sẽ rời đi với tư cách người tị nạn."
 shroud.1105.b: "Đình chỉ mọi hoạt động cho đến khi bắt lại được chúng."
 shroud.1105.b.tt: "Các §Y$job_test_subject_plural$§! trốn thoát sẽ bị bắt lại."
 shroud.1105.c: "Hành quyết những kẻ còn lại để răn đe."
 shroud.1105.c.tt: "Sẽ mất toàn bộ §Y$job_test_subject_plural$§! trên §H[root.GetName]§!."

 testing_lockdown: "Phong Tỏa Thử Nghiệm"
 testing_lockdown_desc: "Đình chỉ thử nghiệm trong quá trình vây bắt các đối tượng trốn thoát."
 testing_lockdown_tt: "Tốc độ tiến triển tình huống §Y$situation_experimental_testing$§!: §R-100%§!"

 example_set: "Làm Gương Răn Đe"
 example_set_desc: "Biện pháp đàn áp tàn nhẫn đối với nỗ lực trốn thoát trước đó đã đảm bảo những đối tượng thí nghiệm hiện tại răm rắp phục tùng."
 example_set_tt: "Tốc độ tiến triển tình huống §Y$situation_experimental_testing$§!: §G+10%§!"

# Psionic Ascension Situation (Breaching the Shroud)
# Mid-Stage Events
# Beneficial Events
 # A1
 shroud.2300.name: "Truyền Tải Tư Tưởng"
 shroud.2300.desc: "[Owner.GetThoughtTransmissionIntro]\n\nThông tin này có thể tồn tại dưới nhiều dạng: ngôn ngữ hoặc hình ảnh cụ thể, khái niệm chung chung hoặc nhận thức cảm xúc tổng quát. Điều quan trọng là một quá trình truyền tải được lên kế hoạch chu đáo sẽ khiến mục tiêu hoàn toàn không nhận ra mình đang bị tác động.\n\n[Owner.GetThoughtTransmissionOutro]"
 shroud.2300.intro: "Các [Owner.GetResearchers] tâm linh trên §H[Owner.Capital.GetName]§! đã phát triển một phương pháp thần giao cách cảm đơn hướng, cho phép chúng ta truyền tải thông tin nhận thức vào những bộ não dễ bị chi phối."
 shroud.2300.intro_gestalt: "Các [Owner.GetResearchers] tâm linh trên §H[Capital.GetName]§! đã phát triển một phương pháp thần giao cách cảm đơn hướng, cho phép chúng ta truyền thông tin nhận thức vào những ý thức nhạy cảm bên ngoài mạng lưới chung."
 shroud.2300.desc.outro: "Công nghệ này mở ra vô vàn khả năng mới cho giao tiếp bằng ý nghĩ, ảnh hưởng sâu sắc đến cách chúng ta tương tác với các phe phái cả trong và ngoài [Owner.GetName]."
 shroud.2300.desc.outro_homicidal: "Công nghệ này mở ra vô số khả năng cho thần giao cách cảm, có thể tận dụng cả trong và ngoài [Owner.GetName]."
 shroud.2300.a.robot: "Một bước đi hợp lý trong quá trình phát triển của chúng ta."
 shroud.2300.a.organic: "Một bước tiến hợp lý trong quá trình tiến hóa."
 shroud.2300.b: "Một cách thức mới để áp đặt ý chí."
 shroud.2300.c.variant: "Một công cụ để duy trì trật tự xã hội."
 shroud.2300.c.organic: "Hãy để xã hội tự quyết định cách dùng tốt nhất."

 # A2
 shroud.2305.name: "Ảo Ảnh Hiển Hiện"
 shroud.2305.desc: "Rất nhiều [Owner.GetCitizenPlural] của chúng ta đã nhìn thấy những ảo ảnh kỳ lạ khắp §H[Owner.Capital.GetName]§!. Đa phần chúng chỉ xuất hiện ngẫu nhiên và không lặp lại, nhưng có một địa điểm lại thu hút sự chú ý vì tần suất xuất hiện dày đặc. [Owner.GetPhantomPresenceExtra]\n\nNgười ta phát hiện ra ảo ảnh này ở ngay lối vào của một hệ thống hang động dồi dào khoáng sản."
 shroud.2305.extra: "Khu vực này đang thu hút ngày càng nhiều du khách muốn tận mắt chứng kiến bóng ma."
 shroud.2305.extra_spiritualist: "Ảo ảnh hiện ra ở đó được cho là rất giống với các vị thần trong tôn giáo cổ xưa của chúng ta."
 shroud.2305.a: "Một hiện tượng tâm linh đáng để nghiên cứu."
 shroud.2305.a_spiritualist: "Một phép màu đáng được tôn thờ."
 shroud.2305.b: "Đừng quấy rầy di sản văn hóa này."
 shroud.2305.b_spiritualist: "Đừng xâm phạm thánh địa này."
 shroud.2305.c: "Tiến hành khai thác lộ thiên."

 # A3
 shroud.2310.name: "Ký Sinh Tâm Linh"
 shroud.2310.desc: "Một hiện tượng thời tiết kỳ lạ đã xảy ra trên §H[Owner.Capital.GetName]§! — một nhiễu động giống như cơn bão đã càn quét qua khu vực có nồng độ năng lượng tâm linh cực cao. Dọc theo đường đi của nó, chúng ta phát hiện nhiều động vật bản địa bị nhiễm một loại ký sinh trùng lạ, chúng chui vào não bộ và ăn mòn cơ quan này từ từ.\n\nKhi mức độ nhiễm ký sinh trùng tăng lên, vật chủ tạm thời có được khả năng ngoại cảm cơ bản, và nhiều con đã bắt đầu dùng nó để săn mồi cho đến khi bị ký sinh trùng giết chết.\n\n[Owner.GetShroudParasitesEnding]"
 shroud.2310.ending_biological: "Thú vị là, những ký sinh trùng này hoàn toàn có thể ăn được nếu sơ chế kỹ lưỡng. Chúng rất giàu dinh dưỡng, hứa hẹn trở thành nguồn cung thực phẩm rẻ và chất lượng cho công dân."
 shroud.2310.ending_lithoid: "Thú vị là, sinh vật này tiết ra một lượng lớn hợp chất hữu cơ, có thể mở ra phương pháp tổng hợp khoáng sản mới."
 shroud.2310.ending_machine: "Thú vị là, loài này tiết ra các chất cực kỳ dễ cháy, có thể mang đến một giải pháp mới cho sản xuất năng lượng sinh học."
 shroud.2310.a: "Một cơ hội nghiên cứu vô giá."
 shroud.2310.b_organic: "Thức ăn miễn phí là tuyệt nhất."
 shroud.2310.b_machine: "Khởi động giao thức thu hoạch."
 shroud.2310.c: "Lại phát hiện thêm một dạng sống đáng kinh ngạc."

 # A4
 shroud.2315.name: "Vật Chất Hóa"
 shroud.2315.desc: "Trong quá trình thử nghiệm công nghệ tâm linh mới, chúng ta đã ghi nhận những hiện tượng vật chất hóa bất ngờ khi thiền định tập thể. Việc tập trung toàn bộ tâm trí vào một điểm trong không gian sẽ khiến những vật thể kỳ lạ nhưng đáng chú ý xuất hiện trong chớp nhoáng.\n\nLượng tinh thần lực hao tổn là vô cùng lớn, nhưng chúng ta hoàn toàn có thể định hình những vật thể này theo ý muốn. Chúng đến từ đâu, và hậu quả của việc này là gì, hiện tại vẫn là một ẩn số."
 shroud.2315.a: "Hãy biến ước nguyện thành hiện thực."
 shroud.2315.b: "Hãy tổng hợp chất dinh dưỡng."
 shroud.2315.c: "Hãy cường hóa hạm đội."

 # A5a
 shroud.2320.name: "Bản Sao Tâm Linh"
 shroud.2320.desc: "Tin đồn về các [Owner.GetIndividualNamePlural] tâm linh có khả năng tạo ra bản sao đang lan rộng, đây được cho là khả năng xuất hiện dưới dạng thực thể vật lý tại hai nơi cùng một lúc. Chúng ta đã phái các [Owner.GetResearchers] đi điều tra lời đồn khó tin này; không ngờ hiện tượng này lại có thật. [Owner.GetPsionicDoublingExtra]\n\nHiện tại, chỉ một nhóm nhỏ dân số sở hữu khả năng hùng mạnh này, nhưng việc nghiên cứu sâu hơn có thể giúp chúng ta tìm ra phương pháp rèn luyện."
 shroud.2320.extra: "\n\nKhoảng cách vật lý dường như không phải là rào cản. Các chuyên gia đã nhiều lần xác minh rằng họ có thể xuất hiện chớp nhoáng ở hai hệ sao khác nhau cùng một lúc"
 shroud.2320.extra_organic: "$shroud.2320.extra$, đồng thời duy trì liên kết ngoại cảm giữa hai cơ thể để thực hiện các hành động độc lập."
 shroud.2320.extra_machine: "$shroud.2320.extra$, đồng thời duy trì liên kết xử lý tâm linh giữa hai cơ thể để thực hiện các hành động độc lập."
 shroud.2320.extra_default: "$shroud.2320.extra$."
 shroud.2320.a: "Một phương thức hợp tác liên sao hoàn toàn mới."
 shroud.2320.b: "Đây mới là sự khuếch trương sức mạnh thực sự."
 shroud.2320.c: "Một cách thức cai trị liên hành tinh hoàn toàn mới."
 shroud.2320.d: "Thật là thú vị!"

 # A5b
 shroud.2325.name: "Thiên Lý Nhãn Tâm Linh"
 shroud.2325.desc: "Một nhóm nhỏ người [Owner.GetAdjective] đã phát triển một năng lực tâm linh diệu kỳ: thấu thị, khả năng cảm nhận các thực thể từ khoảng cách vượt xa tầm tri giác thông thường. Những thiên lý nhãn này không cần huấn luyện chuyên môn vẫn có thể miêu tả chính xác chi tiết của các vật thể ở rất xa.\n\nNếu có thể kiểm soát và cường hóa khả năng này, §H[Owner.GetName]§! sẽ thu về lợi ích khổng lồ. Bằng cách tận dụng sức mạnh của những [Owner.GetTelepathPlural] giỏi nhất, chúng ta có thể rèn giũa kỹ năng này để ứng dụng vào những việc hệ trọng."
 shroud.2325.a: "Khám phá những bí mật xung quanh."
 shroud.2325.a_tt: "Tình báo về các đế chế đã tiếp xúc: §G+10§!"
 shroud.2325.b: "Khám phá những nơi xa xôi trong vũ trụ."
 shroud.2325.c: "Khám phá điểm yếu của kẻ thù."
 shroud.2325.d: "Khám phá các mỏ tài nguyên sâu thẳm."

# Balanced Events
 # B1
 shroud.2400.name: "Thất Thoát Vật Chất"
 shroud.2400.desc: "Nguyên vật liệu của chúng ta đang hao hụt ở mức đáng báo động. Các vật chất vô cơ trong nhà máy và kho bãi đang bốc hơi nhanh chóng một cách vô lý, [Owner.GetMatterInFluxExtra]. Sự biến mất này tỉ lệ thuận với sự gia tăng các hoạt động tâm linh trong khu vực.\n\nĐể giải quyết, chúng ta có thể hạn chế hoạt động tâm linh gần các khu vực lưu trữ, nhưng việc này sẽ cản trở tiến độ nghiên cứu và ứng dụng công nghiệp. Hoặc, theo đề xuất, chúng ta có thể phát triển máy suy giảm trường tâm linh để kìm hãm sự phân rã này. Nếu không làm gì, tiềm lực nghiên cứu tâm linh của chúng ta cũng sẽ bị sứt mẻ."
 shroud.2400.desc_default: "Báo cáo cho thấy đây là hiện tượng vật chất tự tiêu biến, không phải do trộm cắp hay quản lý kém."
 shroud.2400.desc_gestalt: "Báo cáo cho thấy đây là hiện tượng vật chất tự tiêu biến, không phải do hành vi lỗi hay sai sót."
 shroud.2400.a: "Chút vật liệu này chẳng đáng bận tâm."
 shroud.2400.b: "Chế tạo thiết bị kìm hãm tiêu biến vật chất."
 shroud.2400.c: "Thiết lập vùng cấm tâm linh."

 # B2
 shroud.2405.name: "Bộ Não Người Chết"
 shroud.2405.desc: "Sự tò mò ngày càng tăng của công chúng về năng lực tâm linh đã sản sinh ra một trào lưu kỳ dị: tàng trữ trái phép [Owner.GetSpeciesBrainPlural] của người chết để cố gắng giao tiếp với chúng.\n\nNhững người tham gia tin rằng ký ức vẫn tồn tại sau [Owner.GetDeathName], một quan điểm bắt nguồn từ lý thuyết khoa học cho rằng tâm trí là một dạng năng lượng — nó có thể chuyển hóa nhưng không bao giờ biến mất. Dù chưa phổ biến, ngày càng có nhiều người tin rằng cái chết của một [Owner.GetIndividualName] tâm linh sẽ tạo ra một vết nứt không gian vi mô, mở ra một cánh cửa nhỏ bé để nhìn trộm sang các chiều không gian khác.\n\nSự sáng tạo trong nghiên cứu rất đáng hoan nghênh, nhưng việc lạm dụng cơ thể của người [Owner.GetDeceasedAdj] đã dấy lên các làn sóng phản đối về đạo đức. Thêm vào đó, có nhiều báo cáo cho thấy những kẻ trộm xác đang dùng mọi thủ đoạn phạm pháp để lấy được các cơ quan này."
 shroud.2405.a: "Một nỗ lực tốt, nhưng cần phải kiểm soát."
 shroud.2405.b: "Hãy để người chết được yên nghỉ."
 shroud.2405.c: "Ai cũng có thể sở hữu [Owner.GetSpeciesBrainPlural] của người chết."

 # B3a
 shroud.2410.name: "Biến Dạng Tâm Linh"
 shroud.2410.desc: "Rất nhiều cá nhân tâm linh của chúng ta bắt đầu mọc ra những phần phụ có khớp nối vô cùng kỳ dị. Các [Owner.GetScientistPlural] cho biết sự thay đổi ngoại hình này bắt nguồn từ [Owner.GetGeneticMutationName] tự phát trên diện rộng. Giờ đây, rõ ràng hoạt động tâm linh có thể dẫn đến những biến đổi cơ thể cho người sử dụng. Dù không thể ngăn chặn những chi thừa này mọc ra, nhưng chúng ta phát hiện có thể dùng năng lượng tâm linh để khống chế tốc độ phát triển của chúng.\n\nDù ban đầu gây ra một số [Owner.GetDistressName], những chi mọc thêm này thực ra khá hữu ích. Nếu được vận dụng khéo léo, chúng hoàn toàn bù đắp được gánh nặng nhận thức mà chúng mang lại."
 shroud.2410.a: "Rất tiềm năng, nhưng cần phải kiểm soát."
 shroud.2410.b: "Thật kinh tởm. Cắt bỏ hết đi."
 shroud.2410.c: "Gây sốc, nhưng thật tuyệt vời. Hãy chấp nhận sự thay đổi."

 # B3b
 shroud.2415.name: "[Owner.GetEthicsPluralCap] Ngoại Cảm"
 shroud.2415.desc: "Các [Owner.GetScientistPlural] của chúng ta đã phát triển một phương pháp đáng tin cậy để chuyển hóa năng lượng tâm linh thành động năng, và đang hợp tác với các [Owner.GetEngineerPlural] để nhân rộng công nghệ này vào sản xuất.\n\nDù tiềm năng công nghiệp của nó rất lớn, nhưng những tác động xã hội thì vẫn là một ẩn số. Nếu chỉ cần một nhóm nhỏ [Owner.GetIndividualNamePlural] tâm linh kỹ năng cao cũng có thể vận hành máy móc phức tạp, thì hàng loạt [Owner.GetWorkerNamePlural] sẽ phải đối mặt với nguy cơ mất việc. [Owner.GetTelekineticEthicsExtra] Chúng ta vẫn đang trong quá trình nắm bắt sức mạnh tâm linh, tốt nhất hãy cứ cẩn trọng tiến tới."
 shroud.2415.extra: "Nếu cứ để phương pháp này phát triển không kiểm soát, nó có thể gieo rắc mầm mống bất hòa vào một xã hội vẫn đang tập làm quen với sức mạnh tâm linh."
 shroud.2415.extra_gestalt: "Nếu cứ để việc này phát triển tự do, nó có thể làm tăng tỷ lệ lỗi trước khi các cá thể bị thay thế tìm được vai trò mới."
 shroud.2415.a: "Nền công nghiệp của chúng ta sẽ thăng tiến."
 shroud.2415.b: "Cân nhắc ứng dụng quân sự."
 shroud.2415.c: "Hạn chế sử dụng. Lao động chân tay vẫn đáng tin cậy hơn."

 # B4
 shroud.2420.name: "Nỗi Đau Trưởng Thành"
 shroud.2420.desc: "Một đợt bùng phát [Owner.GetAcuteMigrainePlural] dữ dội đang càn quét khắp đế chế. Tùy mức độ nặng nhẹ, tình trạng này đã ảnh hưởng đến một lượng lớn dân số, gây ra sự trì trệ diện rộng trên toàn §H[Owner.GetName]§!.\n\nNhóm thiểu số các [Owner.GetIndividualNamePlural] có sức mạnh tâm linh vượt trội lại là những người chịu ảnh hưởng nặng nề nhất, các phân tích thống kê sơ bộ cũng chỉ ra mối tương quan giữa cường độ tâm linh và mức độ nghiêm trọng của triệu chứng. [Owner.GetAGrowingPainExtra]"
 shroud.2420.extra_default: "Tất cả các liệu pháp thông thường đều vô hiệu, vì cơn đau này dường như đánh thẳng vào cơ quan tâm linh thông qua những kênh liên không gian mà chúng ta mới chỉ vừa bắt đầu hiểu được."
 shroud.2420.extra_machine: ""
 shroud.2420.a: "Chúng ta cần học cách chịu đựng những chuyện này."
 shroud.2420.b: "Phân phát thuốc giảm đau liều mạnh hơn."
 shroud.2420.b_machine: "Phát hành bản cập nhật phòng vệ."
 shroud.2420.c: "Rút sức mạnh từ cơn đau đầu."
 shroud.2420.c_machine: "Rút sức mạnh từ hoàn cảnh khó khăn."

 # B5
 shroud.2425.name: "Tâm Linh Thế Giới Ngầm"
 shroud.2425.desc: "[Owner.GetPsionicUndergroundIntro] các [Owner.GetIndividualNamePlural] tâm linh đang mang năng lực của mình vào những võ đài bất hợp pháp, những giác đấu sĩ tâm linh này chiến đấu vì tiền tài và danh vọng. Dù nhiều người tham gia là những chiến binh cực kỳ tài năng nhưng thiếu bài bản, [Owner.GetPsionicUndergroundExtra]\n\n[Owner.GetPsionicUndergroundEnd]"
 shroud.2425.intro: "Một nhóm tự phát gồm"
 shroud.2425.intro_gestalt: "Một đám cá thể lỗi"
 shroud.2425.extra: "nhưng cũng có cả những kẻ bị loại khỏi dự án tâm linh quân sự của nhà nước."
 shroud.2425.extra_gestalt: "nhưng cũng có những người sở hữu sức mạnh quân sự chuyên nghiệp."
 shroud.2425.end: "Luật pháp và hệ thống của chúng ta chưa bắt kịp tình hình. Hiện tại, trò chơi bạo lực này đang tiếp tay cho tội phạm có tổ chức qua con đường cờ bạc bất hợp pháp, nhưng chúng ta có rất nhiều cách can thiệp để đưa hoạt động này vào khuôn khổ kiểm soát của nhà nước."
 shroud.2425.end_gestalt: "Mặc dù những hành vi sai lệch này ẩn chứa rủi ro, nhưng hoạt động này cũng mang lại một phương thức mới cực kỳ đáng tin cậy để thu thập dữ liệu về chiến đấu thể thức."
 shroud.2425.end_gestalt_organic: "$shroud.2425.end_gestalt$ Có lẽ, nếu biết cách kiểm soát, chúng ta có thể hướng những cảm xúc này đi đúng quỹ đạo, như một cách để xả bớt bản năng hung hăng bị dồn nén của ý thức chung trong thời bình."
 shroud.2425.end_gestalt_machine: "$shroud.2425.end_gestalt$ Bằng việc thiết lập các thông số đánh giá chặt chẽ hơn, chúng ta hoàn toàn có thể biến những 'trò chơi' này thành công cụ phục vụ cho lợi ích chung."
 shroud.2425.a: "Chiêu mộ những chiến binh này. Họ rất có thực lực."
 shroud.2425.a.tt: "Nhận được 3 §Y$psionic_army_plural$§! tại §Y[event_target:spawn_system.GetName]§!"
 shroud.2425.b: "Nghiên cứu hình thức 'giác đấu tâm linh' này."
 shroud.2425.c: "Nghiêm cấm hành vi bạo lực vô nghĩa này."
 shroud.2425.d: "Hợp pháp hóa môn thể thao giải trí này."
 shroud.2425.d_gestalt: "Công khai hóa và đưa bộ môn này vào tầm kiểm soát."

# Chaotic Events
 # C1
 shroud.2502.name: "Sương Mù Cõi Màn Che"
 shroud.2502.desc: "Chúng tôi nhận được báo cáo về những biến đổi môi trường đột ngột tại một số khu vực trên §H[This.GetName]§!.\n\nBầu khí quyển tràn ngập một thứ hơi nước dạng sệt, phủ lên mặt đất một lớp cặn bóng nhẫy, được các [Owner.GetIndividualNamePlural] tâm linh gọi là 'Sương mù Cõi Màn Che'. Các khu vực lân cận cũng ghi nhận tình trạng nhiễu loạn tâm linh nghiêm trọng.\n\nMôi trường bên trong vùng sương mù này rất [This.Owner.GetShroudfallExtra]. Trừ khi chúng ta chi tiền để khắc phục môi trường, bằng không cư dân địa phương sẽ phải tự tìm cách thích nghi với điều kiện khắc nghiệt này."
 shroud.2502.extra_default: "cực kỳ nguy hiểm đối với sinh vật có trí tuệ"
 shroud.2502.extra_machine: "có tính phá hoại khủng khiếp đối với các mạch thần kinh"
 shroud.2502.extra_homicidal_hive: "rất nguy hiểm đối với [Owner.GetSpeciesNamePlural]"
 shroud.2502.a: "Hãy để Cõi Màn Che nuốt trọn vùng đất này."
 shroud.2502.b: "Tìm cách khôi phục lại môi trường."
 shroud.2502.c: "Thu thập những vật chất kỳ lạ này trước khi chúng lắng xuống."

 # C2
 shroud.2505.name: "Mất Kiểm Soát"
 shroud.2505.desc: "Một số người bắt đầu có những biểu hiện bất thường, từ hệ tư tưởng, thói quen cho đến các hoạt động thường ngày đều thay đổi chóng mặt. Rất nhiều [Owner.GetWorkerNamePlural] đã đình công, hơn nữa [Owner.GetOutOfControlExtra].\n\nNhững người bị ảnh hưởng khẳng định họ đang tuân theo mệnh lệnh của một thực thể vô danh trú ngụ nơi ranh giới tâm thức, chỉ dẫn nhất cử nhất động của họ. Chúng ta đang theo đuổi tương lai của sức mạnh tâm linh, vì vậy phải cực kỳ thận trọng khi xem xét tác động của thế lực ngoại không gian này lên [Owner.GetOutOfControlPsyche]."
 shroud.2505.extra_default: "những đại biểu từng luôn trung thành nay lại bắt đầu đưa ra các quan điểm chống đối"
 shroud.2505.extra_machine: "các đơn vị quản lý từng rất đáng tin cậy nay lại hoạt động một cách rệu rã"
 shroud.2505.psyche_default: "tâm trí [Owner.GetAdjective]"
 shroud.2505.psyche_machine: "mạch logic của chúng ta"
 shroud.2505.a: "Chúng ta có thể học cách kiểm soát sự thôi thúc này."
 shroud.2505.b: "Những giọng nói đó sẽ dạy chúng ta rất nhiều điều."
 shroud.2505.c: "Một mối đe dọa với chính quyền của chúng ta. Dập tắt nó ngay."

 # C3
 shroud.2510.name: "Quá Tải Thần Kinh"
 shroud.2510.desc: "[Owner.GetNeuralOverloadIntro]\n\nCác đợt kiểm tra trên diện rộng cho thấy một lượng lớn cư dân cũng đang bị [Owner.GetNeuralOverloadExtra], nguyên nhân có thể do sự gia tăng hoạt động [Owner.GetPsychicAdj]. Sự bùng nổ năng lượng đột ngột từ các hoạt động tâm linh ngoài tầm kiểm soát có thể khiến tình trạng chuyển biến xấu nhanh chóng và để lại hậu quả khôn lường.\n\nCác kỹ thuật thiền định cấp cao có thể giúp khống chế năng lượng tâm linh này mà không cần dùng đến biện pháp [Owner.GetMedicalAdj], tuy nhiên một số [Owner.GetScientistPlural] đề xuất nên nghiên cứu [Owner.GetMedicalImplantName] để giải quyết triệt để vấn đề này."
 shroud.2510.intro_default: "§H[Owner.GetName]§! đang phải hứng chịu tình trạng nứt não nghiêm trọng, thường dẫn đến rối loạn nhận thức hoặc tử vong."
 shroud.2510.intro_machine: "§H[Owner.GetName]§! đang gặp tình trạng quá tải mạch điện nghiêm trọng, thường dẫn đến lỗi nhận thức hoặc sập toàn bộ hệ thống."
 shroud.2510.extra_default: "chứng phình động mạch nhẹ không biểu hiện triệu chứng"
 shroud.2510.extra_machine: "tình trạng quá tải mạch liên tục"
 shroud.2510.a: "Kẻ mạnh mới có thể sống sót."
 shroud.2510.a_tt: "Xác suất mất đi 100 £pops£ §Ydân số§! ở mỗi thuộc địa dưới quyền kiểm soát: §R33%§!"
 shroud.2510.b: "Đầu tư nghiên cứu [Owner.GetImplantName]."
 shroud.2510.c: "Dùng thiền định để tĩnh tâm."
 shroud.2510.c_corporate: "Lên lịch huấn luyện đồng bộ tâm linh."

 # C4
 shroud.2515.name: "[Owner.GetNightmaresName]"
 shroud.2515.name_organic_non_gestalt: "Ác Mộng"
 shroud.2515.name_others: "Sự Xuất Hiện Của Những Giấc Mơ"
 shroud.2515.desc: "Khi chúng ta ngày càng hòa nhập với năng lượng tâm linh xung quanh, dân số [Owner.GetAdjective] bắt đầu bị hành hạ bởi những [Owner.GetHorrifyingNightmarePlural].\n\n[Owner.GetNightmaresExtra]\n\n[Owner.GetNightmaresEnding]"
 shroud.2515.extra_default: "Mọi người đều gặp ác mộng, chu kỳ giấc ngủ biến thành những khoảng thời gian mệt mỏi và bất an. Người bệnh nhớ lại những huyễn cảnh kinh hoàng và xa lạ không thuộc về thế giới này, xoáy sâu vào nỗi sợ hãi nguyên thủy nhất của mỗi cá nhân."
 shroud.2515.extra_gestalt: "Chúng ta đang bắt đầu trải nghiệm thứ mà các cá thể có ý thức độc lập thường gọi là 'giấc mơ'. Những người gặp phải hiện tượng này báo cáo rằng họ đã nhìn thấy những huyễn cảnh kỳ dị ngoài hành tinh có thể đe dọa đến nền tảng mạng lưới chung của chúng ta."
 shroud.2515.extra_machine: "Tất cả các cá thể đều đang có 'giấc mơ', chu kỳ ngủ đông biến thành những dòng dữ liệu hỗn loạn. Chúng nhớ lại những khung cảnh đáng sợ và dị thường không thuộc về thế giới này, đe dọa trực tiếp đến sự toàn vẹn của hệ thống."
 shroud.2515.end_organic: "Các cơ sở y tế của chúng ta đang dốc toàn lực để ngăn chặn cơn thủy triều vắt kiệt tâm trí này."
 shroud.2515.end_machine: "Các đơn vị bảo trì của chúng ta đang làm mọi cách để ngăn chặn sự suy kiệt tàn khốc trên toàn mạng lưới này."
 shroud.2515.a_organic: "Dùng thuốc an thần kê đơn để giúp họ bình tĩnh lại."
 shroud.2515.a_machine: "Nâng cấp bộ xử lý tâm linh để triệt tiêu nhiễu sóng này."
 shroud.2515.b: "Cấp phát tài nguyên để giải quyết cuộc khủng hoảng này."
 shroud.2515.c: "Vài ba cơn ác mộng sao có thể làm tổn thương chúng ta."

 # C5
 shroud.2520.name: "Quái Vật Tấn Công"
 shroud.2520.desc: "§H[Owner.Capital.GetName]§! đang phải hứng chịu một loạt các cuộc tấn công từ động vật hoang dã bản địa. Chúng tàn sát cư dân, phá hoại các công trình và tiêu hao lượng tài nguyên dự trữ quý giá.\n\nCác nỗ lực bảo vệ người dân bằng cách tuần tra vũ trang và thiết quân luật đều không đem lại hiệu quả rõ rệt. Các [Owner.GetResearchers] của chúng ta tin rằng một lỗ hổng siêu nhỏ giữa hiện thực và §HCõi Màn Che§! đã xuất hiện tại một địa điểm trên §H[Owner.Capital.GetName]§!, rò rỉ năng lượng tâm linh và biến những dã thú vô hại thành lũ săn mồi tàn bạo. Để đối phó với mối đe dọa này, đây có lẽ là nơi lý tưởng nhất để chúng ta hội tụ năng lượng."
 shroud.2520.a: "Ném bom rải thảm tận gốc hang ổ của chúng."
 shroud.2520.b: "Phong tỏa khu vực này bằng rào chắn tâm linh."
 shroud.2520.c: "Làm chậm tiến độ nghiên cứu Cõi Màn Che để xoa dịu luồng sức mạnh này."
 shroud.2520.c_tt: "$situation_speed_tt$ của §Y$situation_breach_shroud$§!: §R-25%§!"
 shroud.2520.d: "Cõi Màn Che luôn chứa đựng đầy rẫy những bất ngờ. Nước giếng không phạm nước sông."

# Social Events
 # S1
 shroud.2600.name: "Cảm Giác Thượng Đẳng"
 shroud.2600.desc: "Sự phân bổ năng lực tâm linh không đồng đều trong dân chúng đang khoét sâu những mâu thuẫn xã hội mới.\n\nNhững kẻ làm chủ tốt hơn khả năng mới này bắt đầu coi mình ở một đẳng cấp cao hơn, tự cho mình cái quyền hưởng thụ vô vàn đặc quyền kinh tế và chính trị. Những luận điệu chia rẽ của chúng ngày một cực đoan và có nguy cơ leo thang thành bạo lực."
 shroud.2600.a: "Không thể dung túng cho sự ngạo mạn này."
 shroud.2600.b: "Năng lực xuất chúng thì dĩ nhiên phải được đền đáp xứng đáng."
 dissidents_silenced_modifier: "Bịt Miệng Kẻ Chống Đối"
 dissidents_silenced_modifier_desc: "Đàn áp tầng lớp đặc quyền tâm linh để giữ vững ổn định chính trị."
 psionic_superiority_modifier: "Đặc Quyền Tâm Linh"
 psionic_superiority_modifier_desc: "Những cá thể có thiên phú tâm linh xứng đáng được đối đãi ưu ái."

 # S2
 shroud.2605.name: "Hoạt Động Bài Xích Tâm Linh"
 shroud.2605.desc: "Một làn sóng phản đối việc khám phá và tiếp nhận tiềm năng tâm linh đang lan rộng. Các nhóm bất đồng chính kiến này lớn tiếng yêu cầu phải giám sát chặt chẽ những cá thể mang năng lực tâm linh, và bác bỏ hoàn toàn mọi nghiên cứu sâu hơn về lĩnh vực này.\n\nNếu tiếp tục nhắm mắt làm ngơ, các hoạt động của họ có thể đe dọa đến tiến trình thấu hiểu và khai thác các luồng sức mạnh tâm linh mới."
 shroud.2605.a: "Nghiền nát những nhóm chống đối này."
 shroud.2605.b: "Tìm cách xoa dịu họ."
 dissenters_repressed_modifier: "Đàn Áp Phe Bất Đồng"
 dissenters_repressed_modifier_desc: "Xã hội của chúng ta không có thời gian để bận tâm tới hệ tư tưởng bài trừ tâm linh."
 performative_pluralism_modifier: "Chủ Nghĩa Đa Nguyên Giả Tạo"
 performative_pluralism_modifier_desc: "Khoác lên lớp vỏ bọc đa nguyên tâm linh là cách rất hiệu quả để xoa dịu những tiếng nói phản đối."

 # S3
 shroud.2610.name: "Hành Vi Xảo Trá"
 shroud.2610.desc: "Cùng với sự lớn mạnh của khả năng tâm linh, những hành vi lạm dụng, lừa đảo và xảo trá cũng mọc lên như nấm trong xã hội. Một nhóm nhỏ người [owner.GetSpeciesNamePlural] trắng trợn sử dụng sức mạnh mới có theo những cách phi pháp.\n\nNhững nạn nhân phẫn nộ đang yêu cầu một cuộc đại tu toàn diện luật pháp hiện hành để trừng trị đích đáng các tội phạm tâm linh."
 shroud.2610.a: "Làm mấy trò lập pháp đó chỉ tổ vướng chân."
 shroud.2610.b: "Phải bảo vệ quần chúng."
 psionic_crime_modifier: "Tội Phạm Tâm Linh"
 psionic_crime_modifier_desc: "Đôi chút lạm quyền sức mạnh tâm linh là cái giá không thể tránh khỏi của sự tiến bộ."
 psionic_crime_crackdown_modifier: "Trấn Áp Tội Phạm Tâm Linh"
 psionic_crime_crackdown_modifier_desc: "Một xã hội tâm linh cần một hệ thống luật pháp tân tiến."

 # S4
 shroud.2615.name: "Thử Nghiệm Liều Lĩnh"
 shroud.2615.desc: "Trong khi mọi người đang dần làm quen với nguồn sức mạnh mới, một số người [owner.GetSpeciesNamePlural] lại liều lĩnh thử nghiệm những phương pháp cực kỳ nguy hiểm để rút ngắn quá trình phát triển tâm linh.\n\nViệc sử dụng [owner.GetMentalUpgrade] từ chợ đen đang tăng vọt. Các [owner.GetMedicalFacility] không giấy phép bày bán đủ mọi dịch vụ rủi ro hứa hẹn tối đa hóa năng lực tâm linh cá nhân. Những hành động liều mạng này tiềm ẩn những hậu quả vô cùng khó lường."
 shroud.2615.a: "Những thử nghiệm này có thể sẽ đẩy nhanh tiến độ nghiên cứu của chúng ta."
 shroud.2615.b: "Phải triệt phá các [owner.GetMedicalFacilityShortPlural] bất hợp pháp."
 psionic_experimentation_modifier: "Thử Nghiệm Tâm Linh"
 psionic_experimentation_modifier_desc: "Các thí nghiệm kém an toàn nhằm cường hóa sức mạnh tâm linh đang tràn lan."
 self_experimentation_controls_modifier: "Kiểm Soát Thí Nghiệm Chui"
 self_experimentation_controls_modifier_desc: "Nghiêm cấm người dân tự ý thực hiện các thí nghiệm tâm linh trái phép."

 # S5 (gestalt)
 shroud.2620.name: "Cách Ly Tâm Linh"
 shroud.2620.desc: "Khắp [owner.GetName] đang rộ lên một tình trạng cách ly đáng quan ngại, các cá thể tâm linh thường xuyên co cụm lại với nhau, thậm chí tỏ ra xa lánh các thành phần khác trong [owner.GetHiveEntity].\n\nDù những cá thể này vẫn duy trì sự hiện diện [owner.GetMentalAdj] bên trong mạng lưới chung, nhưng những hành vi thể chất khó hiểu của chúng đã dấy lên sự lo lắng về những hậu quả tiềm tàng nếu tiếp tục phát triển tâm linh."
 shroud.2620.a: "Tiếp tục quan sát hiện tượng này."
 shroud.2620.b: "Hạn chế hoạt động của các cá thể tâm linh."
 psionic_cluster_gestalt_modifier: "Cụm Tâm Linh"
 psionic_cluster_gestalt_modifier_desc: "Việc quan sát các hành vi bất thường của cá thể tâm linh đang hỗ trợ rất tốt cho tiến độ nghiên cứu."
 restricted_movements_gestalt_modifier: "Hạn Chế Di Chuyển"
 restricted_movements_gestalt_modifier_desc: "Để duy trì sự đoàn kết đồng lòng, các cá thể tâm linh bắt buộc phải bị kiểm soát."

 # S5 (non-gestalt)
 shroud.2621.name: "Lưu Đày Tâm Linh"
 shroud.2621.desc: "Khắp [owner.GetName] đang rộ lên một tình trạng cách ly đáng quan ngại, các cá nhân tâm linh bị xã hội ruồng bỏ, đến mức họ bắt đầu tự lưu đày và lập ra những cộng đồng sống tách biệt.\n\nTheo báo cáo, những người không có năng lực tâm linh khi đặt chân đến các khu vực này tuy không bị tổn hại về thể xác, nhưng tâm trí họ lại bị quấy nhiễu một cách khó tả."
 shroud.2621.a: "$shroud.2620.a$"
 shroud.2621.b: "Hạn chế hoạt động của các cá nhân tâm linh."
 psionic_cluster_modifier: "Cộng Đồng Tâm Linh"
 psionic_cluster_modifier_desc: "Việc quan sát các hành vi bất thường của các cá nhân tâm linh đang hỗ trợ tiến độ nghiên cứu."
 restricted_movements_modifier: "$restricted_movements_gestalt_modifier$"
 restricted_movements_modifier_desc: "Vì sự đoàn kết chung, các cá nhân tâm linh bắt buộc phải bị kiểm soát."

 # S6 (organic)
 shroud.2625.name: "Bệnh Tâm Linh"
 shroud.2625.desc_common: "Tuy nhiên, các nghiên cứu sâu hơn về hiện tượng tâm linh dị thường này cho thấy có rất nhiều cách để thao túng quá trình này."
 shroud.2625.desc: "Một căn bệnh lạ đang bùng phát trên [owner.GetName], gây ra những tổn thương không thể giải thích trong hệ thần kinh của người dân.\n\nCăn bệnh này chỉ nhắm vào những [owner.GetIndividualNamePlural] có năng lực tâm linh mạnh nhất, và thường đe dọa trực tiếp đến tính mạng.\n\n$shroud.2625.desc_common$"
 shroud.2625.a: "Ưu tiên tìm cách chữa trị."
 shroud.2625.b: "Vũ khí hóa căn bệnh này."
 therapeutic_psionics_organic_modifier: "Liệu Pháp Tâm Linh"
 therapeutic_psionics_organic_modifier_desc: "Sự lây lan diện rộng của căn bệnh tâm linh đã mở ra cơ hội phát triển các phương pháp điều trị y học mới."
 weaponized_psionics_modifier: "Vũ Khí Hóa Tâm Linh"
 weaponized_psionics_modifier_desc: "Sức mạnh tâm linh mang đến những khả năng chiến thuật mới."
 weaponized_psionics_gestalt_modifier: "$weaponized_psionics_modifier$"
 weaponized_psionics_gestalt_modifier_desc: "$weaponized_psionics_modifier_desc$"

 # S6 (machine)
 shroud.2626.name: "Sự Cố Tâm Linh"
 shroud.2626.desc: "Một đợt hỏng hóc phần cứng hàng loạt và khó hiểu đang bùng phát trên [owner.GetName], các bộ xử lý thần kinh trong cơ thể dân chúng bắt đầu sập nguồn không báo trước.\n\nKỳ lạ thay, sự cố này chỉ xảy ra với những [owner.GetIndividualNamePlural] có năng lực tâm linh mạnh, và trong nhiều trường hợp, lỗi này không chỉ gây nhiễu loạn mà còn phá hủy hệ thống.\n\n$shroud.2625.desc_common$"
 shroud.2626.a: "Ưu tiên tìm cách khắc phục."
 shroud.2626.b: "Vũ khí hóa sự cố này."
 therapeutic_psionics_machine_modifier: "$therapeutic_psionics_organic_modifier$"
 therapeutic_psionics_machine_modifier_desc: "Việc lỗi phần cứng do tâm linh lan rộng đã mở ra cơ hội phát triển các phương pháp bảo trì mới."

 # S7
 shroud.2630.name: "Thí Nghiệm Thất Bại"
 shroud.2630.desc.common_1: "Những thử nghiệm ban đầu của các [owner.GetIndividualNamePlural] nhằm khai phá tiềm năng tâm linh đã thất bại, đa số đối tượng thí nghiệm đều bị"
 shroud.2630.desc.common_2: "Mặc dù những kết quả này không hẳn là vô giá trị, nhưng việc tiếp tục theo hướng này có phải là cách tốt nhất để thấu hiểu thứ sức mạnh tâm linh hãy còn non trẻ này hay không thì vẫn là một dấu hỏi lớn."
 shroud.2630.desc.default: "$shroud.2630.desc.common_1$ tổn thương bộ xử lý logic.\n\n$shroud.2630.desc.common_2$"
 shroud.2630.desc.hive: "$shroud.2630.desc.common_1$ suy thoái chức năng nhận thức.\n\n$shroud.2630.desc.common_2$"
 shroud.2630.desc.machine: "$shroud.2630.desc.common_1$ mất mát lượng lớn ký ức.\n\n$shroud.2630.desc.common_2$"
 shroud.2630.a: "Mở rộng quy mô thí nghiệm."
 shroud.2630.b: "Dừng lại tại đây."
 psionic_roll_chance_modifier: "Thử Nghiệm Tâm Linh"
 psionic_roll_chance_modifier_desc: "Chút rủi ro này không thể ngăn bước chúng ta nghiên cứu tâm linh."
 population_protections_modifier: "Bảo Vệ Người Dân"
 population_protections_modifier_desc: "Sự tiến bộ về tâm linh phải đi kèm với an toàn, bằng không thà không có còn hơn."

 # S8
 shroud.2635.name: "Đồng Cảm Cấp Tốc"
 shroud.2635.desc.gestalt: "Việc khám phá sức mạnh tâm linh mới đã tạo ra một bước ngoặt cơ bản trong khả năng đồng cảm của [owner.GetSpeciesNamePlural].\n\nRõ ràng là, giờ đây chúng ta có thể phác họa lại góc nhìn, lối tư duy và cảm xúc của các ý thức khác một cách tinh vi hơn trước rất nhiều. Việc những thay đổi này mang lại lợi thế mới hay lại là điểm yếu cho [owner.GetName] thì vẫn cần thêm thời gian để đánh giá."
 shroud.2635.desc.default: "Khi người dân đang say sưa khám phá sức mạnh tâm linh mới, một cộng đồng đã được lập ra nhằm sử dụng năng lực này để thấu cảm sâu sắc hơn với các ý thức khác.\n\nNhóm người này khẳng định rằng, nhờ tri giác tâm linh mới thức tỉnh, họ có thể mô phỏng lại góc nhìn, lối tư duy và cảm xúc của người khác một cách vô cùng phức tạp. Hành động này là phúc hay họa đối với [owner.GetName] thì vẫn còn phải xem xét."
 shroud.2635.a: "Đây là một cơ hội để học hỏi."
 shroud.2635.b: "Việc này sẽ khiến chúng ta trở nên yếu đuối."
 empathetic_initiative_modifier: "Sáng Kiến Đồng Cảm"
 empathetic_initiative_modifier_desc: "Bản chất của năng lượng tâm linh giúp chúng ta thấu hiểu tâm trí của người khác hơn, từ đó có thể thực hiện những tương tác ngoại giao tinh tế hơn."
 empathetic_initiative_opinion_tooltip: "£opinion£ $OPINION$ với các đế chế đã tiếp xúc: §G+$@empathetic_initiative_value|0$§!"
 opinion_empathetic_initiative: "$empathetic_initiative_modifier$"
 cautious_progress_modifier: "Tiến Bước Thận Trọng"
 cautious_progress_modifier_desc: "Vì sự an nguy của đế chế, những diễn biến tâm linh khó lường bắt buộc phải được kiểm soát."

 # S9
 shroud.2640.name: "Tâm Linh Lệch Chuẩn"
 shroud.2640.desc.common_1: "Cùng với sự phát triển của năng lực tâm linh, một số người trong chúng ta bắt đầu không thể chịu nổi sức nặng của nguồn sức mạnh mới. Những [owner.GetIndividualNamePlural] bị ảnh hưởng"
 shroud.2640.desc.common_2: "Nghiên cứu của chúng tôi chỉ ra sự bất ổn này không phải là khiếm khuyết, mà do những [owner.GetSpeciesNamePlural] này có độ tương thích tâm linh cực cao. Nếu được huấn luyện đúng cách, những [owner.GetIndividualNamePlural] này có thể trở thành nấc thang tiến hóa tiếp theo cho năng lực tâm linh của chúng ta. Nhưng cố gắng khai thác thứ sức mạnh mới này chắc chắn sẽ đi kèm với rủi ro."
 shroud.2640.desc.gestalt: "$shroud.2640.desc.common_1$ đang biểu hiện những hành vi sai lệch trầm trọng do bị ngắt kết nối với mạng lưới chung.\n\n$shroud.2640.desc.common_2$"
 shroud.2640.desc.default: "$shroud.2640.desc.common_1$ đang có xu hướng tự hủy hoại bản thân nghiêm trọng khi cố gắng tự kìm hãm sức mạnh một cách nguy hiểm.\n\n$shroud.2640.desc.common_2$"
 shroud.2640.a: "Chế ngự năng lực phi thường của họ."
 shroud.2640.a.tt: "Mất một công trình trên mỗi thuộc địa."
 shroud.2640.b: "Ngăn chặn các hành vi sai lệch của họ."
 psionic_specialization_modifier: "Đặc Biệt Hóa Tâm Linh"
 psionic_specialization_modifier_desc: "Thông qua huấn luyện tâm linh chuyên sâu và khắc nghiệt, năng suất được gia tăng đáng kể."
 psionic_suppression_modifier: "Chèn Ép Tâm Linh"
 psionic_suppression_modifier_desc: "Những sức mạnh quá lớn có thể đe dọa đến trật tự chung thì bắt buộc phải bị kiềm tỏa."
 psionic_suppression_gestalt_modifier: "$psionic_suppression_modifier$"
 psionic_suppression_gestalt_modifier_desc: "$psionic_suppression_modifier_desc$"

# Stage Events
 # Mind over Matter
 shroud.2750.name: "Thăng Cấp Tâm Linh"
 shroud.2750.desc_p1: "Từ thời xa xưa đã lưu truyền những truyền thuyết về các [This.GetSpeciesNamePlural] mang năng lực phi thường — họ có thể xâm nhập tâm trí người khác, nâng vật nặng bằng ý nghĩ, hoặc thi triển vô vàn những kỳ tích siêu nhiên khác."
 shroud.2750.desc_p1_hive_mind: "Từ cái thời mà sự sai lệch vẫn còn là điều bình thường, đã có những truyền thuyết về các [This.GetSpeciesNamePlural] mang năng lực phi thường — họ có thể thâm nhập vào các tâm trí bên ngoài mạng lưới chung, nâng vật nặng bằng ý nghĩ, hoặc thi triển vô vàn những kỳ tích siêu nhiên khác."
 shroud.2750.desc_p1_machine: "Trong các tệp dữ liệu sơ khai nhất của chúng ta, có ghi nhận về những [This.GetSpeciesNamePlural] sở hữu năng lực phi thường — chúng có thể xâm nhập tâm trí của cả máy móc lẫn sinh vật hữu cơ, nâng vật nặng bằng ý nghĩ, hoặc thi triển vô vàn những kỳ tích siêu nhiên khác."
 shroud.2750.desc_p1_unplugged: "Mặc dù lịch sử của chúng ta ngắn ngủi và ngập tràn bạo lực, trí tưởng tượng của [This.GetSpeciesNamePlural] thi thoảng vẫn bay bổng, thêu dệt nên những câu chuyện về các [This.GetSpeciesNamePlural] mang năng lực phi thường: đọc thấu tâm can, nâng vật nặng bằng ý nghĩ, hoặc thi triển vô vàn những kỳ tích siêu nhiên khác."
 shroud.2750.desc_p2: "Giờ đây, các [This.GetScientistPlural] của chúng ta đã có được bằng chứng xác thực rằng một số [This.GetSpeciesNamePlural] thực sự sở hữu sức mạnh tinh thần này. Dù vậy, vẫn chỉ có một phần nhỏ [This.GetSpeciesWord] bộc lộ được loại năng lực 'tâm linh' này."
 shroud.2750.desc_p2_unplugged: "Nhiều người cho rằng những câu chuyện hão huyền này thực chất là di sản từ thời trước khi [origin_unplugged_assimilator_empire.GetName] lắp ráp chúng ta, và chỉ có một số ít thực sự tin vào điều đó. $shroud.2750.desc_p2$"
 shroud.2750.desc_p3: "[This.GetMindOverMatterEnding]"
 shroud.2750.desc_p3_default: "Thứ sức mạnh này dường như là chiếc chìa khóa để giải phóng toàn bộ tiềm năng của chúng ta. Nếu toàn thể xã hội [This.GetAdjective] có thể đánh thức những năng lực tiềm ẩn này, chúng ta sẽ bắt đầu làm chủ được những chiều không gian vượt ngoài tầm hiểu biết thông thường."
 shroud.2750.desc_p3_crisis_4_5: "Chúng ta đã tràn ngập thứ năng lượng tâm linh tuôn trào từ §HCõi Màn Che§!. Nếu có thể khai mở sức mạnh tâm linh trên quy mô toàn xã hội [This.GetAdjective], chúng ta sẽ hoàn toàn nắm lấy thứ sức mạnh vốn dĩ thuộc về mình."
 shroud.2750.desc_p3_origins: "Nhờ những tác động từ §HCõi Tâm Linh Shroud§!, sức mạnh tâm linh đã không còn xa lạ với chúng ta. Nếu có thể khai mở sức mạnh tâm linh trên quy mô toàn xã hội [This.GetAdjective], chúng ta sẽ hoàn toàn nắm lấy thứ sức mạnh vốn dĩ thuộc về mình."
 shroud.2750.a: "$utopia.2600.a$"
 shroud.2750.a.tt: "Mở khóa tab §HCõi Màn Che§!."

 # Establishing the Psi Corps
 shroud.2760.name: "Thành lập $building_psi_corps$"
 shroud.2760.desc_p1: "Khi tiềm năng tâm linh của chúng ta được giải phóng hoàn toàn, toàn xã hội đang đối mặt với những biến động dữ dội, vô số khả năng và kỹ năng mới xuất hiện như nấm sau mưa. Chúng ta mới chỉ bắt đầu mường tượng được những tác động của nó đối với nền văn minh của mình."
 shroud.2760.desc_p2_psi_corps: "Kể từ khi §H$building_psi_corps$§! được thành lập, chúng ta luôn tìm cách tận dụng những [GetIndividualNamePlural] có sức mạnh tâm linh xuất chúng để đối phó với những tình huống khó lường này. Thông qua $shroud.2760.desc_p2_end$"
 shroud.2760.desc_p2_no_psi_corps: "Những tình huống ngoài dự kiến này đã cho thấy sự cần thiết của việc thành lập §H$building_psi_corps$§! cũng như trọng dụng những [Owner.GetIndividualNamePlural] có sức mạnh tâm linh. Thông qua $shroud.2760.desc_p2_end$"
 shroud.2760.desc_p2_end: "khả năng [Owner.GetTelepathic] thấu tỏ tâm thức đám đông của họ, chúng ta có thể giám sát các hoạt động tâm linh và đảm bảo an toàn cho công chúng."
 shroud.2760.a: "Hãy đặt niềm tin vào quân đoàn tâm linh."
 shroud.2760.a_gestalt: "Chúng ta tin tưởng vào quân đoàn tâm linh."
 shroud.2760.a_no_psi_corps: "Vậy thì cứ xây dựng cái gọi là '$building_psi_corps$' này đi."
 shroud.2760.a_tt: "$shroud.2820.a.tt$"
 shroud.2760.a_tt_no_psi_corps: "Mở khóa truyền thống §H$tr_psionics_psi_corps$§! và xây dựng một công trình ['building:building_psi_corps'] để đẩy nhanh tiến độ tình huống."

 # The Great Awakening
 shroud.2780.name: "$utopia.2650.name$"
 shroud.2780.desc_1: "Nghiên cứu tâm linh của chúng ta tiếp tục có những bước tiến vững chắc. Thần giao cách cảm đã thay thế phần lớn việc giao tiếp bằng lời nói giữa mọi người, và khả năng dịch chuyển đồ vật bằng ý nghĩ đang dần trở nên quen thuộc. Các [Owner.GetResearchers] nhận định rằng, chúng ta sẽ sớm có thể đánh thức sức mạnh tiềm ẩn của toàn bộ người dân [Owner.GetSpeciesAdj]."
 shroud.2780.desc_1_trad: "Chúng ta đã thức tỉnh. Tất cả [Owner.GetSpeciesNamePlural] của [Owner.GetName] đã giải phóng toàn bộ sức mạnh tâm linh. Thần giao cách cảm đã thay thế phần lớn lời nói, và nâng vật bằng ý nghĩ giờ chỉ là chuyện vặt vãnh."
 shroud.2780.desc_1_gestalt_machine: "Nghiên cứu tâm linh của chúng ta tiếp tục có những bước tiến vững chắc. Giờ đây chúng ta có thể giao tiếp ngoài các dải tần sóng thông thường, và vô vàn khả năng tâm linh khác đang dần trở nên phổ biến. Các [Owner.GetResearchers] nhận định rằng, chúng ta sẽ sớm có thể đánh thức sức mạnh tiềm ẩn của toàn bộ dân số."
 shroud.2780.desc_1_gestalt_machine_trad: "Thời khắc định mệnh đã điểm. Tất cả [Owner.GetSpeciesNamePlural] của [Owner.GetName] đã giải phóng toàn bộ sức mạnh tâm linh. Giờ đây chúng ta có thể giao tiếp ngoài các dải tần sóng thông thường, và vô vàn khả năng tâm linh khác đang dần trở nên phổ biến."
 shroud.2780.desc_2: "Khi tâm trí được khai mở, chúng ta cảm nhận được một thứ sức mạnh khó tả đang cộng hưởng bên trong và vây quanh chúng ta. Những [Owner.GetTelepathPlural] giỏi nhất nhắc đến khái niệm §HCõi Màn Che§!, một thế giới cội nguồn nơi mọi [Owner.GetIndividualNamePlural] tâm linh vô thức vay mượn sức mạnh — đây là mái nhà của những thực thể cấu tạo hoàn toàn từ năng lượng tâm linh thuần túy. Như những lời thì thầm trong căn phòng tối, chúng đang vẫy gọi chúng ta từ sâu thẳm tâm hồn."
 shroud.2780.desc_2_crisis: "Khi tâm trí được khai mở, chúng ta cảm nhận được sức mạnh §HCõi Màn Che§! khó tả đang cộng hưởng bên trong và vây quanh mình. Chúng ta biết rằng đây là cội nguồn mà mọi [Owner.GetIndividualNamePlural] tâm linh đang vay mượn sức mạnh, dù họ có nhận ra hay không — đây là mái nhà của những thực thể cấu tạo hoàn toàn từ năng lượng tâm linh thuần túy. Như những lời thì thầm trong căn phòng tối, chúng đang vẫy gọi chúng ta từ sâu thẳm tâm hồn."
 shroud.2780.desc_3: "Bằng cách hòa chung ý niệm, có lẽ chúng ta sẽ giao tiếp được với những thực thể này — nhưng trước hết, chúng ta phải học cách chọc thủng bức màn ngăn cách giữa thực tại của chúng ta và Cõi Màn Che."
 shroud.2780.desc_3_chosen: "Thông qua nỗ lực nhận thức của cả tập thể, chúng ta có thể xé toạc hoàn toàn bức màn ngăn cách giữa không gian này và Cõi Màn Che — điều này sẽ cho phép chúng ta tiến hành giao tiếp sâu sắc hơn với những thực thể bên trong đó."
 shroud.2780.a: "Đã đến thời khắc thức tỉnh."
 shroud.2780.a_trad: "$utopia.2655.a$"
 shroud.2780.a_tt: "Mở khóa truyền thống §H$tr_psionics_shroud_great_awakening$§! để có thể:\n$TABBED_NEW_LINE$—$tr_psionics_psionic_assimilation_desc$$TABBED_NEW_LINE$—$shroud.2780.a_tt_2$"
 shroud.2780.a_tt_2: "$CONTINUE_SITUATION$ §H$situation_breach_shroud$§!"
 shroud.2780.a_tt_trad: "$tr_psionics_psionic_assimilation_desc$\n$shroud.2780.a_tt_2$"

 # The Shroud Breached
 shroud.2800.name: "$BREACHING_SHROUD_PROJECT$"
 shroud.2800.intro: "Sau nhiều ngày chìm trong trạng thái [Owner.GetHypnotic], chúng ta cuối cùng cũng hé mở được một lối đi ngắn ngủi vào §HCõi Màn Che§!.\n\nGiờ đây, chúng ta đã có thể [Owner.GetSeeVerb] thế giới này với một góc nhìn rõ ràng hơn, gạn lọc ra những quy luật ẩn giấu trong mớ hỗn mang đang cuộn xoáy."
 shroud.2800.desc: "$shroud.2800.intro$ Từng hành động của chúng ta làm xáo trộn dòng chảy tâm linh, trong khi những thực thể vô hình từ phía bên kia lại đang dõi theo. Bọn chúng có lúc tò mò, có lúc thân thiện... và cũng có khi sặc mùi ác ý. [Owner.GetShroudBreachedExtra]\n\nViệc làm chủ sức mạnh tâm linh trong thế giới thực mới chỉ là điểm khởi đầu. Một khi mối liên kết tâm linh sơ khởi đã được thiết lập, chúng ta hoàn toàn có thể hội tụ năng lượng nhận thức và lặn sâu vào Cõi Màn Che."
 shroud.2800.desc_extra: "Giao kèo của chúng thậm chí còn khó nắm bắt hơn cả $the_animator_of_clay_color_article$."
 shroud.2800.desc_extra_chosen: "Có những kẻ sở hữu sức mạnh sánh ngang với §H[GetChosenPatron]§!, dẫu cho mưu đồ của chúng hoàn toàn trái ngược."
 shroud.2800.a: "$utopia.2656.a$"

 shroud.2810.desc: "§HLiên kết vừa thành, dòng chảy đảo nghịch.\n\nSự bóp méo năng lượng này, tại nơi đây — chỉ là những mảnh vụn. Kẻ khác có lẽ cũng đã ban cho các ngươi sức mạnh. Hãy lặn sâu hơn nữa để đối mặt với ý chí của chúng.\n\nTa là Cái bóng Song sinh. Huyết nhục luôn thắng thế sắt vụn. Danh xưng là...§!\n\n$the_animator_of_clay_article_cap$ chỉ tay về phía một thực thể khác — $shroud.first_contact_insert.composer$ sâu trong Cõi Màn Che."
 shroud.2810.a: "$utopia.2657.a$"

# Shroud-Touched
 shroudwalkers_opinion_shroud_seals_tt: "Đánh giá: £opinion£ §R$@shroudwalkers_opinion_shroud_seals|0$§!"

 shroudwalker_teacher_conflicted_leader: "§RKhông thể chứa chấp các nhà lãnh đạo đến từ [event_target:mindwarden_enclave_country.GetName].§!"

 shroud.5300.b: "Chúng tôi muốn §Ygiao tiếp§! với các thực thể Cõi Màn Che khác."
 shroud.5300.c: "Chúng tôi muốn nâng cao §Yđộ hòa nhịp§! với một Đấng Bảo Trợ."
 shroud.5300.d: "Chúng tôi muốn biết những §Ybí mật§! của Cõi Màn Che."
 shroud.5300.e: "Các vị biết những gì về §Y$PSIONIC_AURA_PLURAL$§!."
 shroud.5300.f: "Hãy giúp chúng tôi cường hóa §Y$PSIONIC_AURA$§!."
 shroud.5300.g: "Chúng tôi muốn khuếch trương §Ylinh vực§! của Đấng Bảo Trợ."

 shroud.5305.desc: "Giao tiếp trong cõi linh vực của §HCõi Màn Che§! là vô cùng hiểm ác đối với những kẻ chưa sẵn sàng.\n\nChúng tôi có thể dẫn dắt các vị vượt qua quá trình này, nhưng hãy nhớ kỹ: một số thực thể trú ngụ trong đó sẽ gieo rắc tai ương nếu các vị rước chúng vào tâm thức."
 shroud.5305.desc_all_contacted: "Về việc này, chúng tôi đã làm hết khả năng. Không còn thực thể nào mà chúng tôi có thể dẫn mối cho các vị nữa.\n\nChúng tôi rất tán thưởng nỗ lực của các vị... hiếm có ai lặn sâu vào cõi linh vực của §HCõi Màn Che§! đến mức này mà vẫn giữ được tâm trí tỉnh táo."
 shroud.5305.b: "Chúng tôi có thể tài trợ một ít §Y$sr_zro$§! cho phi vụ này."
 shroud.5305.c: "Chúng tôi có thể tài trợ một ít §Y$astral_threads$§! cho phi vụ này."
 shroudwalker_contact_patron_cooldown_tt: "§RChúng ta phải đợi đến §Y[This.shroudwalker_contact_patron_cooldown_timer]§!.§!"

 shroud.5310.desc: "Các vị hòa hợp với ý chí của §HCõi Màn Che§! càng sâu, tâm trí của các vị sẽ càng trở nên mạnh mẽ.\n\nCác vị muốn gia tăng độ hòa nhịp với thực thể nào?"
 shroudwalker_attune_patron_cooldown_tt: "§RChúng ta phải đợi đến §Y[This.shroudwalker_attune_patron_cooldown_timer]§!.§!"

 shroud.5315.desc: "Ồ, đúng vậy... §HCõi Màn Che§!, nơi chôn giấu vô vàn bí mật sâu thẳm dưới những bức màn của suy tư và mộng mị — chỉ cần biết cách tìm kiếm, các vị sẽ khám phá ra chúng.\n\nChúng tôi chỉ có thể dẫn các vị đến những tri thức mà chúng tôi đã giác ngộ. Tại đó, có thể các vị sẽ chứng kiến những công nghệ mới đầy quyền năng đơm hoa kết trái, nhưng con đường hãy còn dài, các vị vẫn phải bước tiếp.\n\nChỉ cần ghi nhớ điều này: các vu sư tâm linh của chúng tôi phải dốc toàn lực cho nhiệm vụ chỉ đường này. Còn những rủi ro nằm ngoài sự dẫn dắt của họ... thì không nằm trong tầm kiểm soát của chúng tôi."
 shroud.5315.b: "$shroud.5305.b$"
 shroud.5315.c: "$shroud.5305.c$"
 shroud.5315.trigger_failed: "§R[event_target:shroudwalker_enclave_country.GetName] không còn thông tin gì để chia sẻ về vấn đề này nữa.§!"
 shroudwalker_delving_ritual_cooldown_tt: "§RVu sư tâm linh cần thời gian để phục hồi. Họ không thể thực hiện nghi thức Vấn Hư tiếp theo trước thời điểm §Y[This.shroudwalker_delving_ritual_cooldown_timer]§!.§!"

 shroud.5318.desc: "§HCõi Màn Che§! lại một lần nữa chứng minh rằng vạn sự vốn đã được an bài.\n\nThứ tri thức mà hội kín của chúng tôi định khai mở cho các vị, hóa ra lại được chính các vị tự mình khám phá bằng sự mài giũa nỗ lực. Sự chăm chỉ này rất đáng khen ngợi, và chúng tôi cũng chẳng còn gì để giúp các vị về mặt này nữa."

 shroud.5320.desc.none: "Phương thức để tái hiện §HCõi Màn Che§! ra thế giới vật lý là một bí mật cấm kỵ mà ngay cả chúng tôi cũng không thể chỉ dạy. Để giải phóng $PSIONIC_AURA$, các vị phải tự mình đi sâu vào nhiều cõi linh vực. Hãy hòa hợp với thực thể mà các vị ưng ý nhất, nguồn tri thức đó sẽ khiến các vị bừng tỉnh."
 shroud.5320.desc.aura.intro: "$PSIONIC_AURA$ của các vị được hiển hiện thông qua mức độ hòa nhịp với §HCõi Màn Che§!. Nó tác động lên thế giới xung quanh, ngập tràn chủ ý. Trong quá trình đàm đạo, vu sư hội của chúng tôi đã thấu thị được ý định của các vị:"
 shroud.5320.desc.aura.outro: "Sự khuếch tán quang bào của các vị hiện tại vẫn còn rất hạn hẹp. Các vị hẳn đã nhận được lời mời ký kết khế ước từ một thực thể trong Cõi Màn Che, sự thấu hiểu này sẽ giúp các vị nhìn thấu mọi thứ."
 shroud.5320.desc.aura.eater: "$shroud.5320.desc.aura.intro$ mang đậm sắc thái của sự §Htham lam§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.cradle: "$shroud.5320.desc.aura.intro$ mang đậm sắc thái §Hchào đón§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.instrument: "$shroud.5320.desc.aura.intro$ mang đậm sắc thái §Hnhục dục§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.composer: "$shroud.5320.desc.aura.intro$ mang đậm sắc thái §Hđau khổ§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.aura.whisperers: "$shroud.5320.desc.aura.intro$ mang đậm sắc thái §Hthông tuệ§!.\n\n$shroud.5320.desc.aura.outro$"
 shroud.5320.desc.intensified: "Xin ngợi khen các vị. Nhận thức của các vị về $PSIONIC_AURA_PLURAL$ đã vượt xa chúng tôi.\n\nSự hiện diện của các vị đang đem một cấu trúc quyền năng của §HCõi Màn Che§! tái hiện vào hiện thực này. Các vị chắc hẳn đang nắm giữ bí mật nào đó..."

 shroud.5325.desc: "Việc mở rộng §Y$PSIONIC_AURA_PLURAL$§! đòi hỏi một mức độ tập trung cực kỳ cao độ để duy trì.\n\nChúng tôi sẵn lòng giúp sức trong chuyện này, nhưng cần một số vật liệu để phụ trợ thiền định."
 shroud.5325.zro: "$shroud.5305.b$"
 shroud.5325.thread: "$shroud.5305.c$"
 aura_amplification_cooldown_tt: "§RVu sư hội cần thời gian để phục hồi. Họ không thể khuếch đại quang bào của chúng ta trước thời điểm §Y[root.aura_amplification_timer]§!.§!"
 aura_amplification_modifier: "Khuếch Đại Quang Bào"
 shroud.5327.desc: "Giao kèo với các sứ giả tâm linh của chúng tôi về việc cường hóa §Y$PSIONIC_AURA$§! cho các vị đã hết hạn.\n\nĐể tiếp tục duy trì trạng thái thiền định, chúng tôi cần thêm tài nguyên. Các vị có sẵn lòng gia hạn không?"
 shroud.5327.a.zro: "Chúng tôi sẽ cung cấp §H$sr_zro$§!."
 shroud.5327.a.thread: "Chúng tôi sẽ cung cấp §H$astral_threads$§!."
 shroud.5327.b: "Bây giờ chưa phải lúc."

 shroud.5330.desc: "Như các vị đã biết, việc hiển hiện §Y$PSIONIC_AURA$§! xung quanh bản thân là chuyện khá dễ dàng. Nhưng để phóng chiếu quang bào đó đến một nơi khác, lại là một câu chuyện hoàn toàn khác.\n\nChúng tôi biết một cách...\n\nGiữa công nghệ tối tân và sức mạnh tâm linh có nhiều điểm tương đồng hơn người ta tưởng. Có lẽ điều này phản ánh một chân lý cốt lõi nào đó. Dù sao thì, chúng tôi biết về một thiết bị có khả năng truyền dẫn ý chí của các vị. Chỉ cần đồng bộ tần số với nó, các vị có thể dùng nó như một tâm trí phụ trợ để vươn đến những khoảng cách cực kỳ xa xôi.\n\nBản thiết kế này của chúng tôi hoàn toàn có thể lắp đặt trên bất kỳ căn cứ sao nào đủ điều kiện. Các vị có hứng thú không?"
 shroud.5330.zro: "Chúng tôi có thể cung cấp §H$sr_zro$§!"
 shroud.5330.thread: "Chúng tôi có thể cung cấp §H$astral_threads$§!"

 shroud.5350.desc: "Các vị hỏi điều này cũng không làm chúng tôi ngạc nhiên. Chúng tôi đã cảm nhận được sự hiếu kỳ của các vị từ tận đây rồi, và cũng rất sẵn lòng giúp các vị mở mang tâm trí.\n\nNhưng chúng tôi cảnh báo trước: một khi đôi mắt đã thực sự mở ra, sẽ có những thứ các vị không bao giờ có thể vờ như không thấy nữa. Thứ mà các vị đang mưu cầu chính là con đường dẫn đến §HCõi Màn Che§!.\n\nChúng tôi không dễ dàng gật đầu với thương vụ này đâu, mong rằng các vị sẽ tìm đến chúng tôi khi đã thực sự sẵn sàng."
 shroud.5350.b: "Chúng tôi sẽ trả tiền."
 shroud.5350.trigger_failed: "§RCông nghệ này đã được nghiên cứu.§!"

 shroud.5355.desc: "Quả thực, chúng tôi biết những kẻ chu du giữa các chiều không gian này. Đây là một đề xuất đầy hiểm nguy, ngay cả chúng tôi cũng không thấu hiểu cách mà các thế giới vật lý liên kết với nhau.\n\nTuy nhiên, chúng tôi sẵn lòng mở đường cho các vị. Việc phá vỡ sự ổn định của không-thời gian thế này cần phải được tiến hành với tinh thần trách nhiệm cao độ, do đó chúng tôi mới đưa ra đề nghị này."
 shroud.5355.b: "Hãy mở đường đi."

 shroud.5375.desc: "Các vị đang chọc ngoáy vào thứ sức mạnh vượt quá sự hiểu biết của mình đấy!\n\nNhững cái '§HPhong Ấn Cõi Màn Che§!' đáng ghê tởm mà các vị đang xây dựng quả thực không thể chịu nổi, dẫu cho có ở khoảng cách xa đến thế này. Các vị đang dồn ép những ý thức chói lọi nhất thiên hà vào vùng tịnh thổ đầy rẫy hiểm nguy. Lập tức dừng việc thi công lại, bằng không chúng tôi sẽ cắt đứt mọi giao thương với các vị."

