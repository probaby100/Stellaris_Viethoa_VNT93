# End of the Cycle
 situation_end_of_the_cycle: "$name_eotc$"
 situation_end_of_the_cycle_desc: "Chúng ta đã lập khế ước với $end_of_the_cycle_color_article$ để đổi lấy sức mạnh tối thượng. Các [Owner.GetTelepathPlural] của chúng ta tin rằng cái giá của thỏa thuận này có thể bị trì hoãn thông qua trạng thái xuất thần tâm linh tập thể — nhưng cũng chỉ kéo dài được một thời gian.\n\nÝ chí của Chủ thể sẽ giáng xuống dưới dạng một $PSIONIC_AURA$ mạnh mẽ. Nếu muốn đạt đến điểm kết, mục tiêu tối thượng của chúng ta là rải rắc hào quang này. Khi dân số và sức mạnh tâm trí của chúng ta tăng lên, sức mạnh và phạm vi của hào quang cũng sẽ mở rộng.\n\nHệ sao cần chinh phục: §Y[Owner.GetEndCycleGalaxySystemsLeft]§!"
 situation_end_of_the_cycle_effects_1: "Sau khi giai đoạn này kết thúc, chúng ta sẽ được ban sức mạnh §H$ACCORD_CREATION$§!.\n$eotc_opinion_modifier_tooltip$"
 situation_end_of_the_cycle_effects_2: "Sau khi giai đoạn này kết thúc, chúng ta sẽ được ban sức mạnh §H$ACCORD_DISTORTION$§!.\n$eotc_opinion_modifier_tooltip$\n$eotc_opinion_modifier_2_tooltip$"
 situation_end_of_the_cycle_effects_3: "Sau khi giai đoạn này kết thúc, chúng ta sẽ được ban sức mạnh §H$ACCORD_INTENSIFICATION$§!.\n$eotc_opinion_modifier_tooltip$\n$eotc_opinion_modifier_3_tooltip$"
 situation_end_of_the_cycle_effects_4: "Sau khi giai đoạn này kết thúc, cái giá cho sức mạnh chúng ta nhận được cuối cùng cũng sẽ hiển lộ."
