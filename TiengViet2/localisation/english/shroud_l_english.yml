 shroud.4890.title: "Quyền năng của $ACCORD_HINDSIGHT$"
 shroud.4890.desc: "Các [GetTelepathPlural] của chúng ta đã cầu xin sức mạnh từ Đấng bảo hộ, và Ngài thầm thì đưa ra một lời đề nghị. $whisperers_in_the_void_color_article_cap$ định biến một khu định cư của ta thành $pc_relic$; chúng ta chỉ cần đưa ra quyết định."
 shroud.4890.desc.nomad: "Các [GetTelepathPlural] của chúng ta đã cầu xin sức mạnh từ Đấng bảo hộ, và Ngài thầm thì đưa ra một lời đề nghị. $whisperers_in_the_void_color_article_cap$ sẽ thiết lập liên kết giữa Bản ghi Akasha và một con tàu cứu thế của ta, thì thầm kể lại ký ức về mọi thứ từng tồn tại hoặc sẽ xuất hiện; chúng ta chỉ cần đưa ra quyết định."
