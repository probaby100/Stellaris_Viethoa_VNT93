 RECKONING_ARRIVAL_PROJECT: "Đối mặt với sự phán quyết cuối cùng"
 RECKONING_ARRIVAL_PROJECT_DESC: "Toàn bộ hệ sao đang bị đe dọa bởi một thực thể có sức mạnh vô song, nó có tên là §R$NAME_Reckoning$§!. Nó được cấu thành từ năng lượng thuần túy, kể từ khi đột ngột xuất hiện nó đã bắt đầu một chuyến hành trình tàn phá.\n\nMọi dữ liệu đều cho thấy thực thể này khác biệt hoàn toàn với mọi thứ ta từng gặp trước đây. Nếu muốn đối phó với mối đe dọa này, chúng ta buộc phải tiến hành nghiên cứu khẩn cấp để làm rõ cách thức đối đầu với nó."

 shroud.11235.title: "$RECKONING_ARRIVAL_PROJECT$"
 shroud.11235.desc: "Các [GetScientistPlural] của chúng ta đã hoàn thành nghiên cứu toàn diện về thực thể hùng mạnh được gọi là §R$NAME_Reckoning$§!.\n\nDựa trên những phát hiện hiện tại, chúng ta đã xác định được phương pháp đối đầu với đối thủ này bằng công nghệ đang có; các loại vũ khí dùng để xuyên thủng lá chắn năng lượng chỉ cần cải tiến nhẹ là có thể dùng để làm suy yếu năng lượng cấu thành $NAME_Reckoning$.\n\nDù nó rất mạnh mẽ, nhưng khi đối diện với mối đe dọa này, chúng ta không còn hoàn toàn tuyệt vọng nữa."
 shroud.11235.a: "$extreme_frontiers.1531.i$"

 RECKONING_VULNERABILITY_PROJECT: "Chắc chắn nó sẽ có điểm yếu"
 RECKONING_VULNERABILITY_PROJECT_DESC: "Dù chúng ta chưa thành công, nhưng việc đối mặt trực tiếp với §R$NAME_Reckoning$§! cũng mang lại dữ liệu vô giá cho nghiên cứu.\n\nĐặt tâm sức nghiên cứu vào sinh vật năng lượng bí ẩn này, chúng ta có thể tìm ra điểm yếu của nó, từ đó phát triển ra những phương pháp tấn công hiệu quả hơn."

 shroud.11240.title: "Học hỏi từ thất bại"
 shroud.11240.desc: "§R$NAME_Reckoning$§! sở hữu sức mạnh mà hạm đội của chúng ta khó lòng sánh kịp. Mặc dù đã thất bại, nhưng việc giao tranh với sinh vật năng lượng bí ẩn này cũng mang lại dữ liệu quý giá——những thông tin thực tế này chỉ có thể thu được qua việc tiếp xúc trực tiếp.\n\nPhân tích ban đầu cho thấy chúng ta đã thu thập đủ điểm dữ liệu để xây dựng mô hình cấu trúc của thực thể này. Thông qua nghiên cứu thêm, chúng ta có thể cố gắng tìm ra điểm yếu của nó để cải tiến cách thức tấn công của phe mình."
 shroud.11240.a: "Chắc chắn nó sẽ có điểm yếu."
 shroud.11245.title: "Điểm yếu của $NAME_Reckoning$"
 shroud.11245.desc.1: "Trong quá trình nghiên cứu thực thể có tên §R$NAME_Reckoning$§!, các [GetScientistPlural] của chúng ta đã đạt được đột phá."
 shroud.11245.desc.2.intro: "Thực thể này không chỉ là"
 shroud.11245.desc.2.outro: "Sử dụng một loại tia laser có tính chất “triệt tiêu tâm linh”, hạm đội của chúng ta sẽ phá vỡ được sự liên kết, qua đó trực tiếp tấn công hình thái vật chất của nó."
 shroud.11245.desc.2.psionic: "$shroud.11245.desc.2.intro$ hiển linh từ trong §HCõi Màn Che§!, nó còn duy trì khả năng phòng thủ nhờ giữ vững liên kết xuyên không gian với giới tâm linh. $shroud.11245.desc.2.outro$"
 shroud.11245.desc.2.non_psionic: "$shroud.11245.desc.2.intro$ đến từ một chiều không gian khác, nó còn duy trì khả năng phòng thủ nhờ giữ vững liên kết xuyên không gian đầy bí ẩn. $shroud.11245.desc.2.outro$"

 reckoning_insight_modifier: "Sự thấu suốt về sự phán quyết cuối cùng"
 reckoning_insight_modifier_desc: "Thông qua quá trình nghiên cứu chuyên sâu, chúng ta đã tìm ra phương pháp cải tiến vũ khí hiện tại để gây sát thương lên $NAME_Reckoning$."
 reckoning_vulnerability_modifier: "Điểm yếu của sự phán quyết cuối cùng"
 reckoning_vulnerability_modifier_desc: "Sử dụng dữ liệu thu được từ lần chạm trán trước với Phán Quyết Cuối Cùng, chúng ta đã tìm ra cách sử dụng tia laser “triệt tiêu tâm linh” để gây sát thương hiệu quả hơn."

