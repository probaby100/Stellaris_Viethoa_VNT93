 trait_uncanny_intuition: "Trực giác Bí ẩn"
 trait_uncanny_intuition_desc: "Giống loài này thể hiện một khả năng khó hiểu, khi có thể giải quyết được những vấn đề cực kỳ phức tạp ngay trong lần thử đầu tiên."
 trait_uncanny_intuition_portrait_override_tt: "Yêu cầu Giống loài có tiềm năng Tâm linh"

 trait_cranial_hypertrophy: "Tăng sinh Não bộ"
 trait_cranial_hypertrophy_desc: "Phần vỏ bảo vệ hệ thần kinh của giống loài này đã phình to tới mức làm hạn chế đi các chức năng thể chất của họ."
 trait_cranial_hypertrophy_portrait_override_tt: "$trait_uncanny_intuition_portrait_override_tt$"

 trait_cranial_megatrophy: "Đại Tăng sinh Não bộ"
 trait_cranial_megatrophy_desc: "Phần vỏ bảo vệ hệ thần kinh của giống loài này đã phình to đến giới hạn sinh học tối đa."
 trait_cranial_megatrophy_portrait_override_tt: "$trait_uncanny_intuition_portrait_override_tt$"

 trait_haunting_visions: "Ảo ảnh Ám ảnh"
 trait_haunting_visions_desc: "Các thực thể từ chiều không gian khác không ngừng gửi những ảo ảnh điên rồ vào ý thức của giống loài này, làm suy giảm khả năng thực hiện các nhiệm vụ phức tạp của họ."
 trait_haunting_visions_portrait_override_tt: "$trait_uncanny_intuition_portrait_override_tt$"

 concept_leader_trait_psionic: "$leader_trait_psionic$"
 concept_leader_trait_psionic_desc: "§CĐặc điểm Lãnh đạo§!\n\nNhà lãnh đạo này có khả năng thao túng năng lượng bản thân để tạo ra các hiệu ứng tăng cường tùy thuộc vào vai trò của họ."

