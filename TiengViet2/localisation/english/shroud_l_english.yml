#==========================
# Policies
#==========================
 policy_psionic_choir: "Hợp xướng Tâm linh"
 policy_psionic_choir_desc: "Tập thể những người sử dụng Tâm linh cùng hòa điệu với năng lượng của Cõi Màn Che. Từng giai điệu của họ vang vọng trong tâm trí toàn bộ Dân số Tâm linh của đế chế, góp phần tập trung và nâng tầm những nỗ lực của họ."
 song_of_calming: "Bài ca Bình lặng"
 song_of_calming_desc: "Một bản dân ca tâm linh có khả năng xoa dịu tâm trí.\n\n"
 song_of_plenty: "Bài ca Trù phú"
 song_of_plenty_desc: "Một vần thơ tâm linh ca ngợi sự hào phóng của thiên nhiên.\n\n"
 song_of_steel: "Bài ca Sắt thép"
 song_of_steel_desc: "Một khúc hoan ca tâm linh tán dương nền sản xuất công nghiệp.\n\n"
 song_of_luxury: "Bài ca Xa hoa"
 song_of_luxury_desc: "Một bản dân ca tâm linh ngập tràn sự phóng túng và hạnh phúc.\n\n"
 song_of_luxury_gestalt: "$song_of_luxury$"
 song_of_luxury_gestalt_desc: "$song_of_luxury_desc$"
 song_of_knowing: "Bài ca Toàn tri"
 song_of_knowing_desc: "Một tiếng vang tâm linh mang âm hưởng và nhịp điệu vô cùng phức tạp.\n\n"

 policy_psionic_suppression_policy: "Đàn áp Tâm linh"
 policy_psionic_suppression_policy_desc: "Chính sách này quyết định xem liệu ta có nên tháo dỡ các thiết bị đàn áp $PSIONIC_AURA_PLURAL$ khi tiếp quản một hệ sao hay không."
 psionic_suppression_dismantle: "Tháo dỡ"
 psionic_suppression_dismantle_name: "$psionic_suppression_dismantle$"
 psionic_suppression_dismantle_desc: "Các thiết bị đàn áp $PSIONIC_AURA_PLURAL$ sẽ tự động bị tháo dỡ."
 psionic_suppression_allow: "Cho phép"
 psionic_suppression_allow_name: "$psionic_suppression_allow$"
 psionic_suppression_allow_desc: "Các thiết bị đàn áp $PSIONIC_AURA_PLURAL$ sẽ được giữ nguyên vị trí."

 shroud.80.title: "Đàn áp Tâm linh đã bị Tháo dỡ"
 shroud.80.desc: "Khi tiếp quản hệ sao §H[from.GetName]§!, chúng ta đã phát hiện và tháo dỡ một thiết bị máy móc có khả năng đàn áp $PSIONIC_AURA$ của chúng ta."
 shroud.80.a: "Tâm trí của chúng ta đã được giải phóng."

