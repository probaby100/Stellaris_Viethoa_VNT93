 erratic_dematerialization_desc: "Việc đánh mất nguyên liệu thô một cách khó hiểu là cái giá mà chúng ta phải trả cho sự thăng tiến tâm linh. Chúng ta đã nắm được nguyên lý của hiện tượng tiêu biến này."

 teleportation_research: "Nghiên Cứu Dịch Chuyển"
 teleportation_research_desc: "Các hoạt động tâm linh đang vắt kiệt nguồn nguyên liệu thô của chúng ta. Việc phát triển thiết bị ức chế tiêu biến lúc này mang ý nghĩa sống còn."

 psionic_caution: "Thận Trọng Tâm Linh"
 psionic_caution_desc: "Để tránh việc nguyên liệu thô liên tục biến mất, chúng ta bắt buộc phải cấm sử dụng năng lực tâm linh xung quanh một số khu công nghiệp."

 necrocognition_research: "Nghiên Cứu Tâm Thức Người Chết"
 necrocognition_research_desc: "Thú tiêu khiển cá nhân nhằm giao tiếp với [Owner.GetSpeciesBrainPlural] của người chết giờ đã trở thành một hình thức nghiên cứu công cộng được kiểm soát."

 resurrectionism: "Đào Mộ"
 resurrectionism_desc: "Việc tích trữ [Owner.GetSpeciesBrainPlural] của người chết để thử nghiệm giao tiếp đang trở thành một thú vui đại chúng, dù điều này có thể kéo theo sự gia tăng tội phạm."

 regulated_transformation: "Đột Biến Có Kiểm Soát"
 regulated_transformation_desc: "Một số người dân tâm linh của chúng ta đang mọc ra những phần cơ thể kỳ dị. Chỉ cần kiểm soát chặt chẽ quá trình phát triển này, chúng ta hoàn toàn có thể dùng chúng để tăng năng suất."

 forced_amputation: "Cắt Bỏ Bắt Buộc"
 forced_amputation_desc: "Một số người dân tâm linh của chúng ta đang mọc ra những chi thừa kỳ dị. Chúng ta quyết định tiến hành cắt bỏ diện rộng."

