 robot_shroud_whisperers_covenant_chain_desc: "$shroud_whisperers_covenant_chain_desc$"

 shroud.11110.title: "Luân hồi không ngừng"
 shroud.11110.desc: "§HTiếng thì thầm§! biến đổi nhọn hoắt, giọng của họ bao trùm mọi thứ trong tâm trí. Họ khao khát giao tiếp với chúng ta, truyền thụ kiến thức.\n\nChúng ta phải đưa ra lựa chọn không thể thay đổi."
 shroud.11110.a: "Hấp thụ $the_eater_of_worlds_article$"
 shroud.11110.b: "Hấp thụ $the_cradle_of_souls_article$"
 shroud.11110.c: "Hấp thụ $the_instrument_of_desire_article$"
 shroud.11110.d: "Hấp thụ $the_composer_of_strands_article$"

 shroud.11120.title: "Sự trả thù của [GetBetrayedPatronColour]"
 shroud.11120.title.eater: "Sự trả thù của $the_eater_of_worlds_color_article$"
 shroud.11120.title.cradle: "Sự trả thù của $the_cradle_of_souls_color_article$"
 shroud.11120.title.instrument: "Sự trả thù của $the_instrument_of_desire_color_article$"
 shroud.11120.title.composer: "Sự trả thù của $the_composer_of_strands_color_article$"
 shroud.11120.desc: "Khi các [GetTelepathPlural] trồi lên từ trong §HCõi Màn Che§!, chúng ta nhận ra sự phản bội của mình đã kéo theo sự phản pháo mạnh mẽ từ [GetBetrayedPatronColour].\n\nMột $SHROUD_TUNNEL_GALACTIC$ xuất hiện gần §H[event_target:selected_planet_for_revenge.GetName]§!, và nó nay cũng biến thành một vùng hoang tàn đổ nát vô tận. Ở đầu kia của đường hầm, chúng ta [GetFeltLoc] thấy một sự phẫn nộ rõ rệt; Đấng bảo trợ cũ chắc chắn đang chuẩn bị trả thù."
 shroud.11120.a: "Chúng ta phải chuẩn bị sẵn sàng để tự vệ."
 shroud.11120.a.tt: "§H[event_target:selected_planet_for_revenge.GetName]§! biến đổi thành một hành tinh §Y$pc_shrouded$§!.\nMột $SHROUD_TUNNEL_GALACTIC$ xuất hiện gần hành tinh này."

 shroud_tunnel_object: "$SHROUD_TUNNEL_GALACTIC$"

 shroud.11130.title: "Sự phẫn nộ kích động"
 shroud.11130.desc_common: "Một §Y$NAME_Psionic_Avatar$§! xuất hiện từ $SHROUD_TUNNEL_GALACTIC$ trong hệ sao [event_target:spawn_system.GetName]. Đây là sự hiện thân của cơn giận dữ từ [GetBetrayedPatronColour], và hiện đang nhắm tới [capital_scope.GetName]."
 shroud.11130.desc_success: "Chúng ta đã thành công tập hợp sức mạnh để phản đòn mối đe dọa. Hạm đội của chúng ta phóng làn sóng năng lượng tâm linh vào trong $SHROUD_TUNNEL_GALACTIC$, làm suy yếu thực thể thù địch ngay khi chúng xâm nhập vào thực tại này."
 shroud.11130.success_tt: "$NAME_Psionic_Avatar$ xuất hiện với một nửa sức mạnh."

 shroud.11250.title: "Sự kết thúc"
 shroud.11250.desc: "Khi chìm vào trạng thái xuất thần, ý thức của chúng ta kẹt trong sự tĩnh lặng. Chúng ta chưa từng thấy Cõi Màn Che nào chết chóc đến thế.\n\nKhoảng không im lặng.\n\nVạn vật đều tiêu vong."
 shroud.11250.a: "Chắc chắn đây chính là Sự kết thúc."

 shroud.11255.title: "Tái sinh của [owner.GetName]"
 shroud.11255.desc: "Kể từ sau khi $end_of_the_cycle_color_article$ mang đến sự hủy diệt, chúng ta đã nỗ lực rất nhiều để tái thiết. Vì vậy, chúng ta đã xây dựng lại một §H$starbase_outpost$§! tại hệ §H[solar_system.Star.GetStarName]§!, đánh dấu một khởi đầu mới cho [owner.GetName]."
 shroud.11260.title: "Sự hồi sinh của [Root.GetName]"
 shroud.11260.desc: "Kể từ khi $end_of_the_cycle_color_article$ giáng xuống sự diệt vong, chúng ta đã dốc biết bao tâm sức để tái thiết. Sau khi tập hợp những người còn sống sót lên một con tàu cứu thế được đóng vội vã, chúng ta liền lên đường để mở ra một khởi đầu mới cho [Root.GetName]."

