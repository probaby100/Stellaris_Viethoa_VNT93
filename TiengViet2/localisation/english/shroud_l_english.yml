 shroud.6020.name: "$UNKNOWN_LONG$"
 shroud.6020.desc: "§HNgay khi chúng ta cố gắng liên lạc với họ, phi hành đoàn trên đài chỉ huy đột nhiên cảm thấy đau đầu từng cơn...§!"

 shroud.6030.name: "[exiled_country.GetName]"
 shroud.6030.desc: "§HMặc dù đã cố gắng nhiều lần, [exiled_country.GetName] vẫn không phản hồi các nỗ lực liên lạc của chúng ta.§!"

 shroud.6050.name: "Sự tương quan kỳ lạ"
 shroud.6050.desc: "§H$building_ancient_ward_1$§! dùng để trấn áp tâm linh của chúng ta đang phát ra những chỉ số bất thường. Điều này thường là kết quả của sự gia tăng hoạt động tâm linh từ [Root.GetHomeWorldName], nhưng chúng ta không tìm thấy bất kỳ dấu hiệu nào của hành vi suy đồi này.\n\nVậy thì câu trả lời có lẽ nằm trong biên giới của chúng ta. Hình ảnh viễn thám tầm xa cho thấy một đợt bùng phát luồng năng lượng kỳ lạ gần đây trong hệ §H[exiled_system_border.GetName]§!, tương quan với những chỉ số được tạo ra khi $building_ancient_ward_1$ gặp bất thường."
 shroud.6050.a: "Chúng ta phải khám phá hệ [exiled_system_border.GetName]."

 shroud.shared_text_psy_symptoms: "tâm trạng thất thường; suy sụp tinh thần; liên tục xuất hiện những ảo ảnh kinh hoàng không thể diễn tả"
 shroud.shared_text_psi_radiation: "Những hiện tượng này rất giống với những trải nghiệm được tổ tiên chúng ta ghi lại; rất có thể đó chính là thứ mà họ gọi là \"bức xạ tâm linh\", một dạng phát xạ năng lượng có sức tàn phá khủng khiếp."
 shroud.shared_text_ship_malfunction: "Các hệ thống của hạm đội cũng bị ảnh hưởng bởi những sự cố nghiêm trọng, cản trở hầu hết các chức năng bình thường."

 shroud.6100.name: "Năng lượng nguy hiểm"
 shroud.6100.desc.no_border_aura: "Một tình hình đáng báo động đang nhen nhóm trong hệ sao §H[from.GetName]§! mới được khám phá. Phi hành đoàn của [root.GetName] đã phải gánh chịu một loạt các triệu chứng tâm thần: $shroud.shared_text_psy_symptoms$. Hệ thống hạm đội của họ cũng gặp phải những trục trặc kỳ lạ.\n\n$shroud.shared_text_psi_radiation$ Những người không được §H$building_ancient_ward_1$§! bảo vệ trên §H[owner.GetHomeWorldName]§! lần đầu tiên trải nghiệm căn bệnh tâm trí mà tổ tiên đã cảnh báo.\n\nSau khi hiệu chỉnh máy quét tầm xa để phát hiện dạng năng lượng độc đáo này, chúng tôi phát hiện ra rằng nguồn gốc của những phát xạ nguy hiểm này là hệ sao §H[exiled_center_system.GetName]§! gần đó. $shroud.6100.desc.end$"
 shroud.6100.desc.border_aura: "Phi hành đoàn của [root.GetName] đang gặp nguy hiểm.\n\nSau khi tiếp xúc với mức độ bức xạ tâm linh cực cao trong hệ sao §H[from.GetName]§!, họ bắt đầu trải qua áp lực tinh thần tồi tệ hơn những gì đã được báo cáo trước đây. $shroud.shared_text_ship_malfunction$\n\nQuét tầm xa cho thấy bức xạ cường độ cao hơn đang được giải phóng từ hệ sao §H[exiled_center_system.GetName]§!. $shroud.6100.desc.end$"
 shroud.6100.desc.end: "Trước khi đánh giá kỹ lưỡng hơn về tác động của nó, chúng tôi đặc biệt khuyên không nên cử bất kỳ tàu thuyền nào tiến sâu hơn vào."
 shroud.6100.tt: "Chuẩn bị bắt đầu quy trình §Y$first_contact$§!."

 shroud.6110.name: "Thứ trong [This.System.GetName]"
 shroud.6110.desc: "Bất ngờ thay, có rất nhiều vật thể khổng lồ dường như được tạo ra bởi các sinh vật có trí tuệ trong hệ sao §H[This.System.GetName]§!. Để tìm hiểu về những kẻ tạo ra chúng, chúng tôi tạm gọi chúng là §H[This.ContactCountry.GetName]§! và cố gắng thiết lập liên lạc trực tiếp trong khi vẫn giữ khoảng cách an toàn.\n\nTất cả các dạng sống trong hệ sao đó chắc chắn đều đang phải đối mặt với mối đe dọa từ mức độ bức xạ tâm linh cao mà chúng ta đã phát hiện."
 fcsum_exiled_1: "Chúng ta đã phát hiện ra bằng chứng về khả năng có trí tuệ ngoài hành tinh trong hệ §H[This.System.GetName]§!."

 shroud.6115.name: "Tiến triển hạn chế"
 shroud.6115.desc: "Nghiên cứu sâu hơn đã xác nhận rằng vật thể trong hệ sao §H[This.System.GetName]§! là một con tàu vũ trụ ngoài hành tinh, nhưng chúng ta vẫn chưa thiết lập được bất kỳ kênh liên lạc nào với bất kỳ ai trên đó.\n\nĐặc phái viên [exiled_envoy.GetName] báo cáo rằng đội của [exiled_envoy.GetHisHer] bắt đầu mắc phải các triệu chứng cận tâm lý học, bao gồm ảo giác không thể giải thích về những sinh vật kỳ lạ trên [This.System.GetName]. Bất chấp những vấn đề này, đặc phái viên của chúng ta vẫn kiên trì với nhiệm vụ [exiled_envoy.GetHisHer]."
 shroud.6115.a: "Tiếp tục điều tra."
 fcsum_exiled_2: "Chúng ta vẫn chưa thiết lập liên lạc với §H[This.ContactCountry.GetName]§!. Đặc phái viên đã báo cáo những lo ngại về đội của họ."

 shroud.6120.name: "Từ bỏ nhiệm vụ"
 shroud.6120.desc: "Sau nhiều tháng im lặng, chúng tôi nhận được một thông điệp từ [exiled_envoy.GetName]. Vị đặc phái viên thường ngày bình tĩnh và thẳng thắn này đã gửi một báo cáo kỳ lạ và khó hiểu. [exiled_envoy.GetSheHeCap] mô tả một cách lộn xộn những hình ảnh kỳ dị - rõ ràng là những giấc mơ và ảo giác đan xen. Tất cả mọi người trong đội [exiled_envoy.GetHisHer] đều rơi vào trạng thái mê sảng tương tự.\n\nHiện tại họ đã được miễn nhiệm, và nhiệm vụ cũng bị đình chỉ vô thời hạn. Dù thứ gì đang ở trong §H[This.System.GetName]§!, hiện tại chúng ta vẫn chưa có cách nào để điều tra nó một cách an toàn."
 fcsum_exiled_3: "Sau nhiệm vụ đau đớn này, đội của chúng ta đã lên đường trở về nhà mà không thiết lập được liên lạc với §H[This.ContactCountry.GetName]§!."

 shroud.6125.desc: "Trôi nổi trên dòng nước cuộn trào. Là §H[Root.Capital.GetName]§!, hay là...?\n\n§H...Đang gọi...§!\n\nMặt nước xoắn lại rồi tách ra. Chướng khí hôi thối phun trào từ một độ sâu không đáy.\n\n§H...Trả lời...Không có...§!\n\nKhông ngừng nghỉ. Ngột ngạt.\n\nThật tồi tệ."

 MESSAGE_FIRST_CONTACT_ABORTED_EXILED_DESC: "Quy trình $first_contact$ của chúng ta với $COUNTRY|H$ đã bị chấm dứt theo lệnh hành chính."

 shroud.shared_text_aura_spread: "Sự \"lây nhiễm\" tâm linh gần đó đã lan vào hệ sao §H[exiled_system_border.GetName]§!.\n\nMặc dù có sự bảo vệ của §H$building_ancient_ward_1$§!, sự xói mòn này đã khiến dân số của chúng ta trên §H[Root.GetHomeWorldName]§! bắt đầu biểu hiện một số triệu chứng có thể liên quan đến ngộ độc bức xạ tâm linh. Các dự đoán cho thấy, bệnh dịch tâm trí này có thể sớm lan đến §H[Root.home_planet.System.GetName]§!, đe dọa thêm đến hành tinh quê hương của chúng ta."
 shroud.shared_text_aura_study: "Bất chấp những rủi ro, chúng ta muốn học cách tự bảo vệ mình một cách triệt để, và cách tốt nhất là tiếp cận nguồn gốc của hiện tượng để nghiên cứu."

 shroud.6200.name: "Bức xạ Tâm linh trên §H[Root.GetHomeWorldName]§!"
 shroud.6200.desc.no_visit: "Một tình hình đáng báo động đang nhen nhóm trên §H[Root.GetHomeWorldName]§!. Dân chúng đang gánh chịu một loạt các triệu chứng tâm thần: $shroud.shared_text_psy_symptoms$.\n\n$shroud.shared_text_psi_radiation$ Những người không được §H$building_ancient_ward_1$§! bảo vệ lần đầu tiên trải nghiệm căn bệnh tâm trí mà tổ tiên đã cảnh báo.\n\nSau khi hiệu chỉnh máy quét tầm xa để phát hiện dạng năng lượng độc đáo này, chúng tôi phát hiện ra rằng nguồn gốc của những phát xạ nguy hiểm này là hệ sao §H[exiled_system_border.GetName]§! gần đó. $shroud.shared_text_aura_study$"
 shroud.6200.desc.visit_no_ship: "$shroud.shared_text_aura_spread$\n\n$shroud.shared_text_aura_study$"
 shroud.6200.desc.visit_and_ship: "$shroud.shared_text_aura_spread$\n\nKể từ khi tiếp xúc với mức độ bức xạ tâm linh cực cao, phi hành đoàn của §H[event_target:ship_in_border.GetName]§! trong hệ [exiled_system_border.GetName] đã bắt đầu chịu đựng áp lực tâm lý nghiêm trọng hơn bất kỳ báo cáo nào trước đây. $shroud.shared_text_ship_malfunction$\n\n$shroud.shared_text_aura_study$"
 shroud.6200.a: "Hãy học cách ngăn chặn sự lây nhiễm này."

 PSI_RADIATION_PROJECT: "Bức xạ Tâm linh"
 PSI_RADIATION_PROJECT_DESC: "Mức độ bức xạ tâm linh trong hệ sao §H[exiled_system_border.GetName]§! đột ngột tăng lên, thậm chí trên §H[Owner.GetHomeWorldName]§! cũng có thể cảm nhận được hiệu ứng này. Chúng ta phải nghiên cứu cận cảnh hiện tượng đang ngày càng tồi tệ này, không thể để nó đe dọa đến dân số của chúng ta nữa."

 shroud.6205.name: "$PSIONIC_AURA_PLURAL$"
 shroud.6205.desc.start: "Các nhà nghiên cứu của chúng ta đã phải chịu đựng rất nhiều trong môi trường bức xạ tâm linh độc hại ở hệ sao §H[exiled_system_border.GetName]§!, nhưng nhiệm vụ của họ đã mang lại những khám phá quan trọng.\n\nChúng tôi phân loại hiện tượng nguy hiểm này là §H\"$PSIONIC_AURA$\"§!, một sự tích tụ khổng lồ năng lượng hủy diệt không chỉ làm rối loạn tâm trí mà còn gây nhiễu loạn thiết bị công nghệ của chúng ta. Nó lan truyền từ hệ sao §H[exiled_center_system.GetName]§!, nơi năng lượng tâm linh đã tăng đến mức đủ mạnh để lan truyền khắp các hệ sao."
 shroud.6205.desc.aura_home: "$shroud.6205.desc.start$\n\nNó đã làm ô nhiễm hệ sao §H[Root.home_planet.System.GetName]§!, gây ra những hậu quả tàn khốc. $shroud.6205.desc.end$"
 shroud.6205.desc.no_aura_home: "$shroud.6205.desc.start$\n\nNếu nó làm ô nhiễm hệ sao §H[Root.home_planet.System.GetName]§!, hậu quả sẽ rất tàn khốc. $shroud.6205.desc.end$"
 shroud.6205.desc.end: "§H$building_ancient_ward_1$§! trên §H[Root.GetHomeWorldName]§! chỉ có thể cung cấp sự bảo vệ hạn chế."
 shroud.6205.a: "Chúng ta phải tăng cường $building_ancient_ward_1$."

 PSIONIC_AURA_RESISTANCE_PROJECT: "Kháng $PSIONIC_AURA$"
 PSIONIC_AURA_RESISTANCE_PROJECT_DESC: "§H$building_ancient_ward_1$§! mà tổ tiên chúng ta xây dựng trên §H[Owner.GetHomeWorldName]§! được dùng để bảo vệ chúng ta khỏi tác hại của bức xạ tâm linh. Sự xâm nhập của §H$PSIONIC_AURA_PLURAL$§! đã vượt xa khả năng phòng thủ của nó. Nếu áp dụng những kiến thức đã học được cho đến nay, chúng ta sẽ có khả năng nâng cấp khả năng phòng thủ của nó."

 shroud.6210.name: "Suy giảm Tâm linh"
 shroud.6210.desc: "Các nhà nghiên cứu không mệt mỏi của chúng ta đã phát triển một phương pháp để nâng cấp §H$building_ancient_ward_1$§! trên §H[Root.GetHomeWorldName]§!. Bằng cách cải tiến các bộ giảm chấn tâm linh, hiệu ứng bảo vệ của nó không chỉ bao phủ toàn bộ hành tinh mà còn bảo vệ cả hệ §H[Root.home_planet.System.GetName]§!.\n\nNghiên cứu này đã khơi mào cho những nghiên cứu sâu rộng hơn trong lĩnh vực công nghệ đã thất truyền này. Bây giờ chúng ta biết rằng có một mối liên hệ giữa bức xạ tâm linh và ý thức của [Root.GetSpeciesAdj]: không chỉ là sự phát xạ năng lượng này có thể ảnh hưởng đến trạng thái tinh thần của chúng ta, mà trạng thái tinh thần của chúng ta cũng có thể ảnh hưởng đến mức độ bức xạ tâm linh. Có vẻ như lệnh cấm cổ xưa của chúng ta đối với việc thực hành \"tâm linh\" là có cơ sở khoa học."
 shroud.6210.a: "Thật hấp dẫn - và cũng thật đau đầu."
 shroud.6210.a.tt: "$BEGINS_EVENT_CHAIN$§Y$ancient_ward_upgrade_chain_title$§!"

 ancient_ward_upgrade_chain_title: "$building_ancient_ward_2$"
 ancient_ward_upgrade_chain_desc: "§H$building_ancient_ward_1$§! trên §H[Owner.GetHomeWorldName]§! đã đạt đến giới hạn chức năng của nó. Để đối phó với mối đe dọa tâm linh ở gần, cần phải nâng cấp hiệu suất của nó hơn nữa. §H$building_ancient_ward_2$§! mới này sẽ có thể bảo vệ người dân của chúng ta khỏi sự xâm nhập của §H$PSIONIC_AURA_PLURAL$§!."
 ancient_ward_upgraded: "Công trình đã nâng cấp"

 shroud.6215.name: "$building_ancient_ward_2$ đã hoàn thành"
 shroud.6215.desc.aura_home: "Sau khi §H$building_ancient_ward_2$§! của chúng ta được xây dựng, mức độ bức xạ tâm linh trong hệ sao §H[Root.home_planet.System.GetName]§! đã giảm xuống mức có thể kiểm soát. Trên §H[Root.GetHomeWorldName]§!, các triệu chứng khác nhau của dân chúng dần dần thuyên giảm."
 shroud.6215.desc.no_aura_home: "Với việc hoàn thành §H$building_ancient_ward_2$§! của chúng ta, mức độ bức xạ tâm linh trong hệ sao §H[Root.GetHomeWorldName]§! đã giảm xuống mức có thể kiểm soát. Các triệu chứng khác nhau của dân chúng dần dần thuyên giảm."
 shroud.6215.desc.end: "Dù sao đi nữa, §H$PSIONIC_AURA$§! này và những thứ tương tự có thể tồn tại vẫn đang tiếp tục đầu độc hệ sao này. Các nhà khoa học của chúng ta tin rằng công nghệ của $building_ancient_ward_2$ có thể được sử dụng để phát triển §H\"$SHROUD_SEAL$\"§! mạnh mẽ hơn. Những thiết bị khổng lồ này có thể trấn áp Aura của toàn bộ một cụm sao. Xây dựng một $SHROUD_SEAL$ trong hệ sao §H[exiled_system_border.GetName]§! sẽ tăng cường đáng kể khả năng kiểm soát mối đe dọa tâm linh."
 shroud.6215.a: "Một nghiên cứu rất đáng để thực hiện."

 build_shroud_seal_poi_desc: "Sau khi hoàn thành nghiên cứu công nghệ §H$tech_psionic_suppression$§!, chúng ta có thể sử dụng $constructor$ để xây dựng §H$SHROUD_SEAL$§! bên trong giếng trọng lực của ngôi sao. Thiết bị này có thể trấn áp §H$PSIONIC_AURA_PLURAL$§! trong toàn bộ hệ sao cũng như các hệ sao liền kề qua mạng lưới siêu không gian."
 shroud_seal_construction_chain_title: "Xây dựng $SHROUD_SEAL$"
 shroud_seal_construction_chain_desc: "Các nhà khoa học tin rằng công nghệ §H$tech_psionic_suppression$§! tiên tiến hơn có thể được phát triển thêm để trấn áp §H$PSIONIC_AURA_PLURAL$§! của toàn bộ cụm sao.\n\nCông nghệ này sẽ cho phép chúng ta xây dựng §H\"$SHROUD_SEAL$\"§!. Xây dựng một thiết bị mạnh mẽ như vậy trong hệ sao §H[exiled_system_border.GetName]§! sẽ nâng cao đáng kể khả năng kiểm soát mối đe dọa tâm linh."
 tech_psionic_suppression_researched: "$tech_psionic_suppression$ đã nghiên cứu"
 shroud_seal_built: "$SHROUD_SEAL$ đã xây dựng"
 shroud_6216_poi: "[exiled_system_border.GetName]"
 shroud_6216_poi_desc: "$build_shroud_seal_poi_desc$"

 shroud.6220.name: "Bức xạ cực đoan"
 shroud.6220.desc: "Kể từ khi tiếp xúc với mức độ bức xạ tâm linh cực cao, phi hành đoàn của §H[Root.GetName]§! trong hệ §H[exiled_system_border.GetName]§! đã bắt đầu chịu đựng áp lực tâm lý nghiêm trọng hơn bất kỳ báo cáo nào trước đây. $shroud.shared_text_ship_malfunction$"

 shroud.6225.name: "Bức xạ trong §H[Root.home_planet.System.GetName]§!"
 shroud.6225.desc.shared: "Tác động tiêu cực của ngộ độc bức xạ tâm linh đã biểu hiện rõ rệt trong toàn bộ dân số của §H[Root.GetHomeWorldName]§!, và chức năng của các tàu thuyền của chúng ta cũng bị ảnh hưởng nghiêm trọng."
 shroud.6225.desc.know_aura: "§H$PSIONIC_AURA$§! đã lan vào hệ §H[Root.home_planet.System.GetName]§!. $shroud.6225.desc.shared$\n\nViệc nâng cấp §H$building_ancient_ward_1$§! đã trở nên cấp bách hơn bao giờ hết."
 shroud.6225.desc.no_know_aura: "Bệnh dịch tâm linh đã lan đến hệ §H[Root.home_planet.System.GetName]§!. $shroud.6225.desc.shared$\n\nViệc tìm hiểu về sự ô nhiễm này đã trở nên cấp bách hơn bao giờ hết."
 shroud.6225.a: "Chúng ta phải nhanh chóng."
 shroud.6225.a.know_aura.tt: "§H$PSIONIC_AURA$§! của §H[exiled_country.GetName]§! có các hiệu ứng sau:\n$effect_exiled_aura$"
 shroud.6225.a.no_know_aura.tt: "Hiện tượng tâm linh này có các hiệu ứng sau:\n$effect_exiled_aura$"
 effect_exiled_aura: "—$MOD_SHIP_FIRE_RATE_MULT$: §R-125%§!\n—$MOD_SHIP_SHIELD_MULT$: §R-200%§!\n—$MOD_SHIP_EVASION_MULT$: §R-100%§!\n—$mod_planet_jobs_produces_mult$: §R-30%§!\n—$mod_planet_pops_upkeep_mult$: §R+100%§!\n—$MOD_PLANET_BUILDING_TIME_MULT$: §R+100%§!"

 shroud.6231.name: "Sự sụp đổ của §H[root.GetHomeWorldName]§!"
 shroud.6231.desc: "Chúng ta đã mất quyền kiểm soát hành tinh quê hương §H[root.GetHomeWorldName]§!. Là kho tàng tri thức chính và trung tâm của mọi hoạt động xã hội, nếu không chiếm lại nó, chúng ta sẽ không thể tiếp tục thúc đẩy sự nghiệp chống tâm linh của mình."
 shroud.6231.a: "Chúng ta phải giành lại quyền kiểm soát, không được chậm trễ."
 shroud_6231_poi: "[root.GetHomeWorldName]"
 shroud_6231_poi_desc: "Chúng ta phải giành lại quyền kiểm soát §H[root.GetHomeWorldName]§!, không được chậm trễ."

 shroud_reclaim_homeworld_chain_title: "Thu hồi §H[root.GetHomeWorldName]§!"
 shroud_reclaim_homeworld_chain_desc: "Chúng ta đã mất quyền kiểm soát hành tinh quê hương §H[root.GetHomeWorldName]§!. Là kho tàng tri thức chính và trung tâm của mọi hoạt động xã hội, nếu không chiếm lại nó, chúng ta sẽ không thể tiếp tục thúc đẩy sự nghiệp chống tâm linh của mình."

 homeworld_reclaimed: "Hành tinh quê hương đã được quang phục"

 shroud.6241.name: "§H[root.GetHomeWorldName]§! đã được quang phục"
 shroud.6241.desc: "Chúng ta đã giành lại được quyền kiểm soát hành tinh quê hương §H[root.GetHomeWorldName]§!. [root.GetName] có thể tiếp tục dốc toàn lực thúc đẩy sự nghiệp chống tâm linh."
 shroud.6241.a: "$EXCELLENT$"

 shroud.6300.name: "Cái bóng của Cõi Màn Che"
 shroud.6300.desc: "Các nhà khoa học của chúng ta đã hoàn thành việc nghiên cứu công nghệ §H$tech_psionic_suppression$§! tiên tiến. Bây giờ chúng ta có thể xây dựng $building_psionic_suppressor$ tại bất kỳ thuộc địa nào do chúng ta kiểm soát để tái tạo lại hiệu ứng của $building_ancient_ward_2$.\n\nTuy nhiên, để kiểm soát sự lây lan của §H$PSIONIC_AURA_PLURAL$§! trong các hệ sao khác, chúng ta vẫn cần xây dựng một thiết bị mạnh mẽ hơn được gọi là §H$SHROUD_SEAL$§!. $shroud.shared_text_shroud_seal$\n\nNghiên cứu này cũng xác nhận một lý thuyết đáng lo ngại: tồn tại một cõi vô hình được gọi là §H\"Cõi Màn Che\"§!! Chiều không gian tâm linh được mô tả trong các văn bản huyền bí cổ đại rất có thể là có thật. Lý thuyết này cho rằng hoạt động nhận thức của những sinh vật có tri giác có thể khiến năng lượng từ Cõi Màn Che truyền vào thực tại có thể quan sát được - quá trình này chính là nguồn gốc chung của $PSIONIC_AURA_PLURAL$.\n\nĐiều này có nghĩa là chúng ta không chỉ chiến đấu với sức mạnh khách quan của vũ trụ, mà còn chống lại hành vi đáng ngờ của một số ý đồ chưa biết tiềm ẩn."
 shroud.6300.a: "Vậy §H\"Cõi Màn Che\"§! lại là có thật...?"

 shroud.6500.name: "Liên lạc bất ngờ"
 shroud.6500.desc: "Chúng tôi nhận được một cuộc gọi bất ngờ từ bên ngoài hệ §H[exiled_system_border.GetName]§!. Bằng một cách kỳ lạ nào đó, §H[exiled_country.GetName]§! đã hoàn toàn nắm vững ngôn ngữ và hệ thống liên lạc của chúng ta."

 shroud.shared_screen_figure: "§HNhân vật trên màn hình giao tiếp với nhịp điệu ổn định, thôi miên, thỉnh thoảng dừng lại rất lâu.§!\n\nNhững người hàng xóm phương xa, vì các người không phản hồi liên lạc trực tiếp, chúng tôi đành phải viện đến loại giao tiếp công nghệ thô sơ này.\n\nTa là §HUkhhograth Skarath§!, Tôn chủ Tâm linh của §H[exiled_country.GetName]§!. Tình hình rất khẩn cấp; hãy tha thứ cho sự vội vàng của ta."
 shroud.shared_auric_flow_inhibition: "đang ảnh hưởng đến dòng chảy Aura của chúng tôi. Chúng tôi tạm cho rằng tình hình không thể chấp nhận được này chỉ là sự vô ý của các người.\n\nAura này có lợi cho tất cả, nên tỏa sáng khắp thiên hà. Để chứng minh cam kết của các người đối với The Greater Good, chúng tôi yêu cầu các người lập tức tháo dỡ cái gọi là"

 shroud.6505.name: "$shroud.6500.name$"
 shroud.6505.desc: "$shroud.6500.desc$"

 shroud.6510.name: "Tôn chủ Tâm linh Ukhhograth Skarath"
 shroud.6510.desc: "$shroud.shared_screen_figure$ Thiết bị của các ngươi ở hệ sao §H[exiled_system_border.GetName]§! $shroud.shared_auric_flow_inhibition$ '$SHROUD_SEAL$'."
 shroud.6510.a: "Trước đây chúng tôi chưa từng nhận được thông tin liên lạc nào."
 shroud.6515.desc: "Chúng tôi đã giao tiếp với các người bằng Âm thanh Chân thực. Các người đã nghe thấy, các người chắc chắn có thể nghe thấy âm thanh truyền trong tâm trí. Các người có năng khiếu này, nhưng các người đã chọn cách kìm nén nó."
 shroud.6515.a: "Aura này có tính hủy diệt, là một thứ bệnh dịch."
 shroud.6520.desc: "Nhận thức của các người có vấn đề. Aura là món quà thiêng liêng từ vị thần hộ mệnh của chúng tôi ban tặng. Nó có thể đánh bại mọi thứ mang lại sự hủy diệt."
 shroud.6520.a: "Nếu chúng tôi từ chối yêu cầu của các người thì sao?"
 shroud.6525.desc: "Bất kẻ nào làm tổn hại Aura đều phải bị trấn áp. Nếu các người từ chối, chúng tôi sẽ buộc phải dùng đến hành động quân sự."
 shroud.6525.a: "Chúng tôi sẽ giữ lại Phong ấn."
 shroud.6525_heritage.a: "Chúng tôi sẽ không bao giờ phá hủy di sản của chính mình."
 shroud.6525.b: "Chúng tôi đồng ý tháo dỡ Phong ấn."
 shroud.6530.desc: "Lũ ngốc nghếch ngu muội."
 shroud.6535.desc: "Một quyết định sáng suốt."

 shroud.6550.name: "Hành động thù địch bị hoãn lại"
 shroud.6550.desc: "Để tránh xung đột trực tiếp với §H[exiled_country.GetName]§!, chúng tôi đã miễn cưỡng chấp nhận yêu cầu tháo dỡ $SHROUD_SEAL$ trong hệ §H[exiled_system_border.GetName]§!.\n\nCuộc tiếp xúc với những kẻ gieo rắc bệnh dịch tâm linh đã gây ra sự quan ngại sâu sắc tại §H[this.GetName]§!. Việc gỡ bỏ $SHROUD_SEAL$ dường như chỉ là một chính sách xoa dịu tạm thời. Chúng chắc chắn cũng sẽ muốn làm điều tương tự với §H$building_ancient_ward_2$§! của chúng ta - đó là điều chúng ta tuyệt đối không thể chấp nhận.\n\nDù sao đi nữa, một cuộc chiến là không thể tránh khỏi."
 shroud.6550.a: "Chúng ta phải chuẩn bị sẵn sàng."

 shroud.6560.name: "$shroud.6510.name$"
 shroud.6560.desc: "$shroud.shared_screen_figure$ Một công trình trên §H[capital_scope.GetName]§! $shroud.shared_auric_flow_inhibition$ '$building_ancient_ward_2$'."
 shroud.6560.a: "$shroud.6510.a$"

 shroud.shared_psiarch_transmission: "§HNgay khi hình ảnh của Tôn chủ Tâm linh xuất hiện, hắn bắt đầu lên tiếng chỉ trích một cách lạnh lùng, không ra tiếng.§!\n\n[This.GetSpeciesNamePlural], ta rất thất vọng khi còn phải gọi cuộc gọi này."
 shroud.shared_auric_flow_disdain: "Hành động của các người đã chứng minh các người vô minh đến mức nào. Sự cản trở trắng trợn của các người đối với dòng chảy Aura của chúng tôi, sự khinh miệt vô cớ đối với toàn bộ sự nghiệp tâm linh, đều không thể dung hòa với hòa bình trên toàn thiên hà. Chúng tôi không còn sự lựa chọn nào khác.\n\nHãy đợi gặp hạm đội của chúng tôi đi."

 shroud.6570.name: "$shroud.6510.name$"
 shroud.6570.desc: "$shroud.shared_psiarch_transmission$ Dù các người đã đồng ý dỡ bỏ $SHROUD_SEAL$, chúng tôi biết các người vẫn duy trì một công trình có chức năng tương tự ở §H[capital_scope.GetName]§!. Ý đồ của các người ai cũng rõ. $shroud.shared_auric_flow_disdain$"
 shroud.6570.a: "Nói cho bản thân nghe đi. Im miệng."

 shroud.6575.name: "$shroud.6570.name$"
 shroud.6575.desc: "$shroud.shared_psiarch_transmission$ Việc các người xây dựng lại $SHROUD_SEAL$ đã hoàn toàn dập tắt mọi kỳ vọng về việc cứu rỗi các người. $shroud.shared_auric_flow_disdain$"
 shroud.6575.a: "$shroud.6570.a$"

 shroud.6580.name: "Phong ấn §H[exiled_center_system.GetName]§!"
 shroud.6580.desc: "Với bộ giảm chấn tâm linh khổng lồ lóe sáng khởi động, §H$SHROUD_SEAL$§! của chúng ta bắt đầu dần đẩy lùi §H$PSIONIC_AURA$§! ra khỏi hệ sao §H[exiled_center_system.GetName]§!.\n\nCác máy quét liên sao đã xác nhận rằng các phần khác của lãnh thổ đế chế đó đều kết nối trực tiếp với [exiled_center_system.GetName] qua mạng lưới siêu không gian. Chỉ cần một $SHROUD_SEAL$ là đủ để xóa tan $PSIONIC_AURA_PLURAL$ trên toàn cõi §H[exiled_country.GetName]§!.\n\nChìa khóa chiến thắng của chúng ta nằm ở việc bảo vệ phong ấn này."
 shroud.6580.a: "Bảo vệ nó là vô cùng quan trọng."

 shroud.6600.name: "Chorus of the Dreamers"
 shroud.6600.desc: "Chúng ta đã chinh phục được thuộc địa trên §H[current_planet.GetName]§!, nơi gây ra mối đe dọa tâm linh.\n\nChúng tôi biết được rằng §H$PSIONIC_AURA$§! xuất hiện trong hệ sao này đã được cường hóa bởi sự tương tác tâm trí giữa người dân và §HCõi Màn Che§!. Những hành động này do một nhóm tinh anh sử dụng tâm linh lãnh đạo, tự xưng là §HChorus of the Dreamers§!. Giáo phái tâm linh này truyền bá lòng trung thành của họ với cái gọi là \"Superlord\", được cho là một thực thể quyền năng trong Cõi Màn Che, mà chúng ta chỉ biết với cái tên §H$r_the_lost_patron$§!.\n\nKinh sách của họ liên tục nhắc đến một thánh tích liên quan đến sự tồn tại này - dường như vẫn còn hiện diện trên hành tinh §H[other_planet.GetName]§!. Tìm thấy thứ này có thể giúp chúng ta ngăn chặn chúng tiếp tục lan rộng sức ảnh hưởng."
 shroud.6600.a: "Thiết lập đường bay đến [other_planet.GetName]."

 shroud.6601.name: "Tàn tích trên [current_planet.GetName]"
 shroud.6601.desc: "Chúng ta đã hoàn tất việc thuộc địa hóa §H[current_planet.GetName]§!, vốn từng là một hành tinh của [exiled_country.GetName].\n\nTừ những ghi chép còn sót lại của họ, tôi biết rằng $PSIONIC_AURA$ tồn tại ở hệ sao này trước đây là do sự tương tác tâm trí giữa dân số và §HCõi Màn Che§!. Giáo phái tâm linh dẫn đầu hành vi này tôn thờ một thứ kỳ dị được gọi là \"Superlord\", được cho là một thực thể quyền năng trong Cõi Màn Che có tên là §H$r_the_lost_patron$§!.\n\nNhững mảnh vỡ kinh văn của họ liên tục nhắc đến một thánh tích nào đó liên quan đến sự tồn tại này - dường như vẫn còn trên hành tinh §H[other_planet.GetName]§!. Để đạt được mục tiêu này, cần phải chinh phục [other_planet.GetName] một cách cẩn trọng hơn, để lại một phần dân số."
 shroud.6601.a: "$shroud.6600.a$"

 shroud.6700.name: "$SANCTUM_OF_THE_LOST$"
 shroud.6700.desc.common: "Chúng tôi đã ngay lập tức tiến hành trấn áp nghiêm ngặt mọi hoạt động tâm linh trên những hành tinh này, loại bỏ hoàn toàn §H$PSIONIC_AURA$§! ghê tởm của nó.\n\nTại các thành phố chính của hành tinh, sừng sững một tòa tháp bỏ hoang mang tên §H$SANCTUM_OF_THE_LOST$§!, từng là ngôi đền tối cao của giáo phái tâm linh khét tiếng của đế chế cũ. Binh lính của chúng ta miêu tả nó tỏa ra một luồng khí vừa thần thánh vừa gây bất an.\n\nTrong căn mật thất sâu nhất của công trình, có một \"cái kén\" được phong kín cẩn mật, phát ra bức xạ tâm linh cục bộ mạnh mẽ. Thực tế cho thấy, đạn dược tiêu chuẩn không thể xuyên thủng lớp vỏ ngoài của nó. Cần phải điều tra thêm để loại bỏ mối đe dọa tiềm tàng mà vật thể này gây ra đối với sự an toàn lâu dài của chúng ta."
 shroud.6700.desc.contact: "Việc chinh phục §H[current_planet.GetName]§! đánh dấu chiến thắng cuối cùng của chúng ta trước §H[exiled_country.GetName]§!. $shroud.6700.desc.common$"
 shroud.6700.desc.no_contact: "Sau khi chinh phục §H[current_planet.GetName]§!, chúng ta đã chiếm được lãnh thổ từng bị cai trị bởi một đế chế mang tên §H[exiled_country.GetName]§!. $shroud.6700.desc.common$"
 shroud.6700.desc.no_exiled: "Khi chinh phục §H[current_planet.GetName]§!, chúng ta đã chiếm được vùng lãnh thổ từng do những kẻ cuồng tín kiểm soát tâm trí cai trị. $shroud.6700.desc.common$"
 shroud.6700.a: "Tin tức đáng lo ngại... tiếp tục điều tra."

 shroud.6705.name: "$psionic_threat_eliminated$"
 shroud.6705.desc.common: "Điều tra ban đầu cho thấy hành tinh này có một mạng lưới các công trình rộng lớn, rất có thể là trung tâm quyền lực của thảm họa tâm linh. Giờ đây, chỉ còn lại những tàn tích đổ nát.\n\nCó lẽ chúng ta sẽ không bao giờ biết được những bí mật sa đọa nào từng ẩn giấu trong những công trình này, cũng như bản chất thực sự của những hành vi đê hèn của cư dân ở đây. Mặc dù vậy, hệ sao này hiện đã được dọn sạch $PSIONIC_AURA$ tàn dư, giúp chúng ta thoát khỏi những tổn hại mà nó từng gây ra."
 shroud.6705.desc.contact: "Việc thanh trừng triệt để dân số trên §H[current_planet.GetName]§! đánh dấu sự sụp đổ của đế chế §H[exiled_country.GetName]§!.\n\n$shroud.6705.desc.common$"
 shroud.6705.desc.no_contact: "Việc thanh trừng triệt để dân số trên §H[current_planet.GetName]§! đánh dấu sự chấm dứt của một mối đe dọa tâm linh tàn khốc.\n\n$shroud.6705.desc.common$"
 shroud.6705.a: "Cầu mong mọi mối đe dọa như vậy đều bị loại bỏ."
 psionic_threat_eliminated: "Mối đe dọa tâm linh đã bị loại bỏ"
 psionic_threat_eliminated_desc: "Sự sụp đổ của một đế chế tâm linh khiến $PSIONIC_AURA$ của họ biến mất khỏi hệ sao, mang lại sự bình yên trong tâm trí cho nhân dân ta."

 SANCTUM_OF_THE_LOST: "Thánh Sở Kẻ Mộng Mơ"
 SANCTUM_OF_THE_LOST_DESC: "Tại di tích $SANCTUM_OF_THE_LOST$ trên §H[sanctum_of_the_lost_planet.GetName]§!, chúng ta tìm thấy một \"cái kén\" được bao bọc chặt chẽ, đang phát ra mức độ bức xạ tâm linh cực cao. Chúng ta phải tiến hành điều tra tại chỗ để loại trừ mối đe dọa có thể có từ vật thể này."

 shroud.6710.name: "Sức mạnh nội tại"
 shroud.6710.desc: "Các nhà nghiên cứu của chúng ta đã tiến hành phân tích toàn diện \"cái kén\" trên §H[sanctum_of_the_lost_planet.GetName]§!.\n\nViệc quét bên ngoài công trình vĩ đại này cho thấy nó là một vật chứa an ninh cấp cao, được thiết kế chuyên biệt để giam giữ một thực thể tâm linh mạnh mẽ. Mặc dù vật chứa này có lớp cách điện bằng hợp kim nặng, nhưng mức độ bức xạ tâm linh cao vẫn rò rỉ qua lớp vỏ.\n\nXung quanh cái kén được lắp đặt một nhóm các bộ giảm chấn tâm linh; khi được kích hoạt, tất cả mọi người ở khu vực xung quanh đều bị tổn thương thần kinh nghiêm trọng.\n\nBề mặt của cái kén sau đó biến dạng, từ hình quả trứng thành một hình xoắn ốc liên tục thay đổi. Từ các lỗ hổng và hang động trên đó, chúng tôi nhận được liên lạc trực tiếp từ bên trong..."

 cannot_found_mindwarden_enclave: "Phải đảm bảo được sự an toàn về mặt tinh thần của đế chế."

 shroud.6800.name: "$MINDWARDENS_THE_FIRST_ENCLAVE$"
 shroud.6800.desc: "Chúng ta đã tích lũy được lượng kiến thức khổng lồ về §HCõi Màn Che§! và phát triển công nghệ tiên tiến để kiềm chế những ảnh hưởng xấu xa của nó. Trong quá trình thảo luận về cách áp dụng công nghệ này trên quy mô lớn khắp thiên hà, chỉ huy hạm đội của chúng ta đã đưa ra một đề xuất thú vị.\n\nHọ đề nghị thành lập một trong các hạm đội của chúng ta thành một §H\"$gov_mindwarden_enclave$\"§! độc lập, từ đó có thể cung cấp dịch vụ chống tâm linh cho khách hàng trên toàn thiên hà. $shroud.shared_enclave_investement$"
 shroud.6800.a: "Đáng để thử đấy."
 shroud.6800.a.tt: "Bây giờ có thể chuyển đổi một hạm đội có quy mô từ §Y30§! trở lên thành §H$gov_mindwarden_enclave$§!."

 shroud.6825.name: "$gov_mindwarden_enclave$ được thành lập"
 shroud.6825.desc_first: "§H[This.GetName]§! đã tìm được ứng cử viên phù hợp để thành lập §H$gov_mindwarden_enclave$§! độc lập đầu tiên của chúng ta. Nếu được thông qua, hạm đội này sẽ xây dựng một cơ sở mới tại §H[This.Solar_System.GetName]§! và lập tức bắt đầu cung cấp các dịch vụ chống tâm linh."
 shroud.6825.desc_default: "Chúng ta đang cân nhắc việc thiết lập §H[This.GetName]§! thành một §H\"$gov_mindwarden_enclave$\"§! độc lập để cung cấp dịch vụ chống tâm linh cho toàn thiên hà. $shroud.shared_enclave_investement$"
 shroud.6825.a: "Tiếp tục xây dựng"
 shroud.6825.a.tt: "Đã thành lập một §H$gov_mindwarden_enclave$§!."
 shroud.6825.b: "Hãy suy nghĩ thêm."

 shroud.6830.name: "$MINDWARDEN_plural$"
 shroud.6830.desc: "Cuộc chiến với §HCõi Màn Che§! và sự lạm dụng tâm linh đã khiến dân tộc ta trở nên mạnh mẽ hơn, mục tiêu của chúng ta cũng rõ ràng hơn. Sự ra đời của §H$gov_mindwarden_enclave$§! đầu tiên đánh dấu một kỷ nguyên mới của sự phục hồi và kháng cự.\n\nTrên toàn cõi thiên hà, tâm trí sẽ không còn bị tâm linh xâm phạm, mọi hành tinh sẽ không còn phải chịu đựng sự đày đọa của sức mạnh Cõi Màn Che.\n\nĐây chính là thời đại của $MINDWARDEN_plural$."
 shroud.6830.a: "Hành trình của chúng ta mới chỉ bắt đầu."

 shroud.shared_enclave_investement: "Khoản đầu tư ban đầu của chúng ta sẽ được dùng để xây dựng một trạm không gian; bù lại, chúng ta sẽ nhận được cổ tức từ lợi nhuận trong tương lai của nó. Sự tự do hành động của họ sẽ tạo điều kiện thuận lợi cho việc sử dụng rộng rãi các cơ sở như vậy.\n\nTất nhiên, chúng ta cũng có thể sử dụng dịch vụ của họ - với mức giá ưu đãi."

 shroud.6841.name: "Khu Quản Hạt [mindwarden_enclave_country.GetName] Trả Cổ Tức"

 BEGINS_EVENT_CHAIN: "Bắt đầu chuỗi sự kiện:"
 ENDS_EVENT_CHAIN: "Kết thúc chuỗi sự kiện:"
 the_exiled_become_hostile: "§H[exiled_country.GetName]§! chuyển sang thái độ thù địch với chúng ta."
 start_psionic_war_chain: "$BEGINS_EVENT_CHAIN$§Y$the_psionic_war_chain_title$§!"
 shroud_seal_dismantled: "§HPhong ấn Cõi Màn Che§! trong §H[exiled_system_border.GetName]§! đã bị tháo dỡ."

 the_psionic_war_chain_title: "$NAME_Psionic_War$"
 the_psionic_war_chain_desc: "Cuộc chiến với §H[exiled_country.GetName]§! đang đến gần.\n\nThảm họa tâm linh này phải được giải quyết tận gốc. Chúng ta phải xây dựng một $SHROUD_SEAL$ trong hệ sao §H[exiled_center_system.GetName]§! để trung hòa $PSIONIC_AURA$; chỉ khi đó chúng ta mới có thể đặt chân đến và thanh tẩy nó khỏi hệ sao này."
 the_psionic_war_chain_poi_1: "Xây dựng một $SHROUD_SEAL$"
 the_psionic_war_chain_poi_1_desc: "Việc xây dựng một §H$SHROUD_SEAL$§! tại §H[exiled_center_system.GetName]§! có thể trấn áp §H$PSIONIC_AURA_PLURAL$§! trong hệ sao này cũng như các hệ sao lân cận nối liền qua mạng lưới siêu không gian."
 the_psionic_war_chain_poi_2: "Kiểm soát §H[exiled_planet_1.GetName]§!"
 the_psionic_war_chain_poi_2_desc: "§H[exiled_country.GetName]§! đã bị buộc phải chấm dứt cuộc tấn công tâm linh. Việc chinh phục các hành tinh của họ là cách duy nhất để đảm bảo rằng họ sẽ không còn tạo ra §H$PSIONIC_AURA_PLURAL$§! trong tương lai."
 the_psionic_war_chain_poi_3: "Kiểm soát §H[exiled_planet_2.GetName]§!"
 the_psionic_war_chain_poi_3_desc: "§H[exiled_country.GetName]§! đã bị buộc phải chấm dứt cuộc tấn công tâm linh. Việc chinh phục các hành tinh của họ là cách duy nhất để đảm bảo rằng họ sẽ không còn tạo ra §H$PSIONIC_AURA_PLURAL$§! trong tương lai."

 shroud_seal_reconstruction_chain_title: "Tái thiết Phong ấn Cõi Màn Che"
 shroud_seal_reconstruction_chain_desc: "Việc tháo dỡ §H$SHROUD_SEAL$§! là một sự hy sinh cần thiết để xoa dịu §H[exiled_country.GetName]§!, nhưng đây cũng chỉ là biện pháp hoãn binh. Nếu chúng ta muốn một lần nữa đặt chân lên lãnh thổ của chúng và thanh tẩy §H$PSIONIC_AURA_PLURAL$§!, chúng ta phải xây dựng lại công trình này.\n\n§PViệc tái thiết sẽ bị coi là một hành động khiêu khích. Chúng ta phải chuẩn bị sẵn sàng cho mọi sự phản kháng.§!"
 shroud_seal_reconstruction_chain_poi_1: "[event_target:exiled_system_border.GetName]"
 shroud_seal_reconstruction_chain_poi_1_desc: "$build_shroud_seal_poi_desc$"

 SHROUD_WORLDS_IN_SYSTEM: "Hành tinh Cõi Màn Che: §G$QUANTITY|0$§!"

 NAME_Psionic_War: "Cuộc chiến Tâm linh"
 wg_psionic_war: "$NAME_Psionic_War$"
 war_goal_wg_psionic_war: "$NAME_Psionic_War$"
 war_goal_wg_psionic_war_desc: "Phát động chiến tranh để tiêu diệt những kẻ xâm lược tâm linh trong thiên hà."

 shroud.6720.name: "$UNKNOWN_LONG$"
 shroud.6720.desc: "§HNgươi có thể nghe, nhưng không thấy âm thanh. Tại sao?§!"
 shroud.6720.a: "Bọn ta sẽ không để ngươi đầu độc tâm trí mình!"
 shroud.6720.b: "Ngươi là thứ gì?"
 shroud.6720.c: "Tại sao ngươi lại ở đây?"
 shroud.6720.d: "Ngươi muốn gì?"
 shroud.6720.e: "Ngươi đến từ Cõi Màn Che sao?"
 shroud.6720.f: "Bọn ta nghe đủ rồi."

 shroud.6723.desc: "§HĐầu độc? Không phải là độc...\n\nĐó là một bài hát. Hát thì trước tiên phải nghe thấy. Hãy mở rộng tâm hồn và chia sẻ vẻ đẹp này đi.§!"

 shroud.6725.desc: "§HVòng luân hồi xoay chuyển... chúng ta lắng nghe.\n\nTinh tú vần vũ... chúng ta cất tiếng hát.§!"
 shroud.6725.a: "\"Bánh xe\" là gì?"
 shroud.6725.b: "Dừng lại ở đây thôi."

 shroud.6730.desc: "§HXoay tròn không ngừng. Ở trên, cũng như ở dưới. Chính là sự hòa âm được gọi là \"Cõi Màn Che\".§!"

 shroud.6735.desc: "§HTa đang... mơ. Mơ về một bài hát. Nhưng bài hát đã im bặt. Dàn hợp xướng đã đi đâu rồi?§!"
 shroud.6735.a: "Kẻ nhốt ngươi ở đây đã đi rồi."
 shroud.6735.b: "Những \"bài hát\" này là gì?"
 shroud.6735.c: "Dừng lại ở đây thôi."

 shroud.6740.desc: "§HNgươi ở đây. Ngươi sẽ hát...§!"

 shroud.6745.desc: "§HLà dòng chảy nhỏ nhoi giữa ranh giới thức và mơ... là con đường kết nối giữa nơi này và nơi kia.\n\nNgươi không nghe thấy... tâm trí các ngươi không thể hiểu được...§!"

 shroud.6750.desc: "§HTa muốn nghe tiếng hát... nhưng vạn vật im lìm... tại sao?§!"
 shroud.6750.a: "Ngươi có thể đền đáp cho chúng ta điều gì?"
 shroud.6750.b: "Dừng lại ở đây thôi."

 shroud.6755.desc: "§HTa có thể cho ngươi thấy... giấc mơ của ta. Sự ra đời của một hành tinh.§!"
 shroud.6755.a: "Lấy gì để chúng ta tin ngươi?"

 shroud.6760.desc: "§HNgươi chỉ cần lắng nghe. Bài hát này là chân lý, chỉ vì vẻ đẹp của nó. Đó là một chân lý đẹp đẽ.\n\nNhưng trái tim ngươi đã đóng kín. Có thể mở ra mà.§!"

 shroud.6763.desc: "§HTa vẫn ở đây... lắng nghe bài ca của hai thế giới. Nhưng một bài ca ở đây đã tắt tiếng.§!"
 shroud.6763.a: "Ngươi không thuộc về nơi này."

 shroud.6765.desc: "§HNgươi nói đúng.§!"

 shroud.6770.name: "$r_the_lost_patron$"
 shroud.6770.desc: "Bên trong cái kén mà chúng ta tìm thấy trên §H[sanctum_of_the_lost_planet.GetName]§! có chứa một thực thể ngoại không gian vô cùng hùng mạnh. Ở một khía cạnh nào đó, nó dường như chính là nguồn gốc của $PSIONIC_AURA$, thứ đang đe dọa đến sự tỉnh táo của chúng ta.\n\nCác thiết bị làm suy yếu ngoại cảm của chúng ta đã tạm thời xoa dịu được sự nguy hiểm của nó, nhưng hiện tại vẫn chưa rõ chúng ta có thể kìm hãm nó được bao lâu nữa. Nếu có thể kiểm soát đúng cách, chúng ta thậm chí còn có cơ hội mượn thứ sức mạnh đáng sợ này để phục vụ cho mục đích của chính mình.\n\nTuy nhiên, đa số người dân trong xã hội lại đang kêu gọi phải tiêu diệt nó ngay lập tức. Chỉ riêng sự tồn tại của cái thứ này thôi cũng đã đi ngược lại hoàn toàn với những giá trị cốt lõi mà chúng ta gìn giữ bấy lâu nay."
 shroud.6770.a: "Tiêu diệt nguồn cơn của mọi tội ác này."
 shroud.6770.b: "Tìm cách tận dụng... cái thứ này."
 destroyers_of_the_lost_modifier: "Kẻ Hủy Diệt Kẻ Thất Lạc"
 destroyers_of_the_lost_modifier_tt: "Nhận được quyền áp dụng mức sống §Y$living_standard_shroud_inoculation$§!, dưới tiêu chuẩn này các khả năng §Yngoại cảm§! sẽ bị gỡ bỏ."
 destroyers_of_the_lost_modifier_desc: "Đánh bại được một kẻ thù ngoại cảm và phá hủy nguồn gốc phát ra $PSIONIC_AURA$ của chúng, sau nhiều năm chịu đựng gian khổ, giờ đây tinh thần của toàn quốc đang dâng cao."

 living_standard_shroud_inoculation: "Tiêm Chủng Cõi Màn Che"
 living_standard_shroud_inoculation_tooltip: "Giống loài này đang được tiêm chủng để chống lại những tác động độc hại từ bức xạ ngoại cảm.\n\n§RĐể ngăn ngừa những tổn thương sâu hơn, tất cả các đặc điểm ngoại cảm sẽ bị gỡ bỏ.§!"
 living_standard_shroud_inoculation_tooltip_delayed: "§LChúng ta nên đảm bảo sự an toàn về mặt ngoại cảm cho giống loài này.§!"

 psionic_heresy: "Dị Giáo Ngoại Cảm"

 shroud.6780.name: "$r_the_lost_patron$"
 shroud.6780.desc: "Tư tưởng đã xuyên thủng rào cản tâm linh.\n\nChúng tôi nghe thấy một giai điệu, rực rỡ nhưng chói tai.\n\nChúng tôi thấu hiểu nỗi đau này, mãnh liệt và quen thuộc.\n\n§HNgươi nghe thấy rồi. Giấc mơ này là của ngươi... hát đi, hát lên đi...§!"
 shroud.6780.a: "Ngươi đã làm gì?"

 shroud.6785.desc: "§HTa đã thực hiện lời hứa. Ta đã dệt một giấc mơ cho các ngươi.§!"
 shroud.6785.a: "Ngươi đã \"mơ\" thấy cái gì?"

 shroud.6790.desc: "§HHành tinh. Những hành tinh mới, nằm giữa ta và ngươi.§!"
 shroud.6790.a: "Những hành tinh này có ích gì cho chúng ta?"

 shroud.6795.desc: "§HHãy để ta hát cho chúng nghe. Hát bài ca rực rỡ nhất.§!"
 shroud.6795.a: "Hy vọng chúng ta không phải hối hận."
 shroud.6795.a.tt: "Có thể thêm tối đa ba §HHành tinh Cõi Màn Che§! trong lãnh thổ của chúng ta, mỗi hệ sao tối đa một hành tinh."

 r_the_lost_patron: "The Lost Patron"
 r_the_lost_patron_desc: "Thực thể này là hình dạng vật lý của một tồn tại trong Cõi Màn Che - từng là \"Superlord\" của một đế chế tâm linh đã suy vong. Vẫn chưa biết chính xác nó hiện ra ở thế giới thực bằng cách nào, nhưng mối liên kết độc nhất vô nhị với cõi tâm linh đã ban cho nó sức mạnh khôn lường."
 the_lost_patron_passive_effect: "Tầm hoạt động của §H$SHROUD_SEAL_PLURAL$§!: §G+1§!\n§H$SHROUD_SEAL_PLURAL$§! sản xuất £unity£§Y$unity$§!: §G+25§!\n§H$SHROUD_SEAL_PLURAL$§! cung cấp £navy_size£§Y$NAVY_SIZE_TITLE$§!: §G+10§!"
 the_lost_patron_before_activation_tt: "Chúng ta không biết điều gì sẽ xảy ra."
 the_lost_patron_after_activation_effect_tt: "Mở khóa một £decision£§YQuyết định hành tinh§!: ['concept_dreamscaping_decision']"
 decision_dreamscaping: "Kiến Tạo Cảnh Mộng"
 decision_dreamscaping_desc: "Cải tạo một §Y$pc_shrouded$§! thành một §Y$pc_gaia$§!"
 concept_dreamscaping_decision: "$decision_dreamscaping$"
 concept_dreamscaping_decision_desc: "$decision_dreamscaping_desc$"

 HAS_NOT_NUM_NEIGHBOR_SYSTEMS: "Số lượng hệ sao lân cận $VAL0|2Y$ không $COMPARE$$VAL1|2Y$"
 HAS_NEIGHBOR_SYSTEMS: "Số lượng hệ sao lân cận $VAL0|2Y$$COMPARE$$VAL1|2Y$"

#======================
# Endbringers origin
#======================
 origin_endbringers: "Sứ Giả Tận Thế"
 origin_endbringers_desc: "$CHALLENGING_ORIGIN$§RCảnh báo: Vô hiệu hóa tất cả các con đường Thăng hoa ngoại trừ ['concept_psionic_ascension'].§!\n\nNền văn minh này từ lâu đã đắm chìm trong một thảm họa bí ẩn biến các hành tinh lân cận thành những Hành tinh Cõi Màn Che hoang vu. Giờ đây, khi lần đầu đặt chân vào biển sao, cuối cùng họ cũng có thể khám phá sự thật và xác định liệu số phận tương tự có giáng xuống đầu họ hay không."
 origin_tooltip_endbringers_negative_effects: "—Đế chế bắt đầu với chỉ số ['concept_paranoia_modifier']\n—Không thể thành lập hoặc tham gia ['concept_federation']"

 concept_paranoia_modifier: "$endbringers_paranoia$"
 concept_paranoia_modifier_desc: "Sau khi chứng kiến một thiên tai thời viễn cổ, nỗi sợ hãi về thảm họa của hết thế hệ này đến thế hệ khác ngày càng lớn mạnh.\n\nChỉ số hạnh phúc giảm dần theo thời gian: từ §R-5%§! đến §R-50%§!"

 endbringers_paranoia: "Hoang tưởng"
 endbringers_paranoia_desc: "Sau khi chứng kiến một thảm họa thời viễn cổ, hết thế hệ này đến thế hệ khác luôn sống trong nỗi sợ hãi về thảm họa. Liệu chúng ta có đi vào vết xe đổ đó không?"
 endbringers_paranoia_tt: "$chamber_of_silence_negative_effects_reduction$"

 START_SCREEN_ENDBRINGERS: "Chúng ta là những người tiên phong của ngày tận thế.\n\nNgay từ thuở sơ khai của nền văn minh [GetSpeciesAdj], một thảm họa bí ẩn đã giáng xuống các thiên thể lân cận. Sự biến đổi đột ngột và dữ dội của nó khiến bầu trời đêm bị bao phủ bởi thứ ánh sáng tím tà ác, gieo rắc nỗi kinh hoàng trong lòng người dân, lo sợ một ngày nào đó số phận này sẽ giáng xuống đầu mình. Hết thế hệ này đến thế hệ khác, nỗi sợ hãi ngột ngạt về sự tuyệt diệt bóp nghẹt lấy chúng ta.\n\nGiờ đây, [GetSpeciesNamePlural] đã bước vào kỷ nguyên du hành giữa các vì sao, \"$pc_shrouded$\" cũng đang vẫy gọi chúng ta đến khám phá. Những câu trả lời mà chúng ta khao khát suốt nhiều thế kỷ nay đã ở trong tầm tay. Dù vậy, nhiều người cảnh báo rằng sự ám ảnh của chúng ta đối với nguồn gốc của sức mạnh hủy diệt này cuối cùng có thể dẫn đến sự diệt vong của chính chúng ta.\n\nSắp tới đây, chúng ta sẽ kéo lên bức màn cuối cùng."

 shroud.8010.title: "Nhiệm vụ [shrouded_planet.GetName]"
 shroud.8010.desc: "Vệ tinh thăm dò quay quanh §H[shrouded_planet.GetName]§! đã xác định được một điểm đến khả thi cho nhiệm vụ đổ bộ có người lái lên \"$pc_shrouded$\" này. Khu vực hạ cánh phát ra một loại bức xạ kỳ lạ, mang theo những cơn bão tia cực tím quét qua toàn bộ hành tinh.\n\nCó rất nhiều [Root.GetSpeciesNamePlural] phản đối nhiệm vụ này, lo sợ rằng lời nguyền tương tự sẽ được giải phóng lên hành tinh quê hương của chúng ta. Nỗi lo lắng của họ không phải là không có cơ sở, nhưng sự cần thiết to lớn của việc thấu hiểu hiện tượng xa xôi này lấn át mọi nhu cầu khác.\n\nNếu một ngày nào đó chúng ta định sẵn phải chịu chung một kiếp nạn, ít nhất cũng phải chết một cách rõ ràng."
 shroud.8010.a: "Hãy đi tìm câu trả lời ngay bây giờ."

 the_shrouded_world_site: "$pc_shrouded$"
 the_shrouded_world_site_desc: "Cuối cùng, chúng ta đã có thể tiếp cận và chạm vào \"$pc_shrouded$\" có tên là §H[planet.GetName]§!. Có một giọng nói đang vẫy gọi chúng ta ở đó, và giọng nói ấy giờ đây vang dội hơn bao giờ hết.\n\nNhững bí mật ẩn chứa trong thảm họa càn quét hành tinh này sẽ phơi bày nhiều sự thật về lịch sử của chính hệ sao chúng ta, đồng thời được kỳ vọng sẽ làm vơi đi sự ám ảnh của xã hội chúng ta về những lời tiên tri diệt vong. Quét quỹ đạo cho thấy, tại một điểm ở Nam bán cầu đang tụ tập một nguồn năng lượng mạnh mẽ xoáy trôn ốc - đó là một con mắt lạnh lẽo, đang chằm chằm nhìn vào chúng ta."

 shroud.8100.name: "Sự kiện Tận thế đang đến gần"
 shroud.8100.desc: "Địa hình của §H[shrouded_planet.GetName]§! hiểm trở đúng như dự đoán. Những luồng hạt hoàng hôn cuộn xoáy trên không trung, làm chậm tiến độ khám phá ban đầu của §H[Leader.GetName]§! cùng phi hành đoàn [Leader.GetHisHer].\n\nĐáng báo động là, nhóm nghiên cứu của chúng tôi bắt đầu báo cáo các hiện tượng bất thường về giác quan - họ mô tả nghe thấy tiếng hú văng vẳng trong gió và nhìn thấy những hình bóng mờ ảo lén lút trong sương mù. Liệu việc chọn hạ cánh ở đây có thực sự là một sai lầm?\n\nViệc công bố những hình ảnh hạ cánh đầu tiên đã gây ra một sự hoảng loạn lớn trên §H[Owner.GetHomeWorldName]§!. Nhiều người lo sợ rằng chúng ta có thể sẽ rước về thứ thế lực hủy diệt bí ẩn từng tàn phá [shrouded_planet.GetName]. Lực lượng biểu tình mang tên \"Tận thế cận kề\" đang tập hợp lại, các cuộc biểu tình càn quét hành tinh mẹ, khiến vô số cơ sở hạ tầng bị tê liệt.\n\nQuét từ xa cho thấy, ẩn sâu trong dãy núi gần đó là một khoang rỗng đang phát ra mức độ bức xạ cực cao. Chúng tôi quyết tâm tiếp tục tiến lên bằng mọi giá."
 shroud.8100.a: "Phá vỡ lớp bề mặt. Chúng ta phải tìm ra thứ đang chờ đợi chúng ta."

 the_end_is_nigh: "Sự kiện Tận thế đang đến gần"
 the_end_is_nigh_desc: "Một linh cảm về ngày tận thế đang bao trùm xã hội chúng ta."

 shroud.8105.name: "Cấu trúc ngoài hành tinh"
 shroud.8105.desc: "Chúng ta không phải là những vị khách đầu tiên.\n\nSau khi phá vỡ khoang rỗng trong núi trên §H[shrouded_planet.GetName]§!, một công trình kiến trúc ngoài hành tinh bị bỏ hoang trong thảm họa hiện ra sừng sững. Chúng tôi cho rằng tốt nhất nên liệt thông tin này vào danh sách tối mật để tránh gây thêm hoảng loạn.\n\nPhân tích ban đầu xác nhận rằng vật liệu dùng để xây dựng cơ sở này không khớp với cấu trúc phân tử của các khoáng chất hiện có trên hành tinh, điều này cho thấy một nền văn minh liên sao đã sử dụng những vật liệu kỳ lạ để xây dựng cơ sở này. Mục đích chính xác của nơi này vẫn chưa rõ, nhưng chức năng của nó dường như đã được tự động hóa phần lớn.\n\nĐồng thời, các triệu chứng tâm lý của các thành viên trong đội đang trở nên tồi tệ hơn. Có người báo cáo rằng họ nghe thấy những tiếng thì thầm truyền qua các tần số được mã hóa, trong khi những người khác thì mô tả nhận thức của họ về môi trường vật lý xung quanh bị bóp méo. Những tràng cười phát ra thỉnh thoảng càng làm tăng thêm cảm giác bất an.\n\nChúng ta đã đi quá xa, giờ không thể quay đầu lại được nữa."

 shroud.8110.name: "Kẻ giám sát"
 shroud.8110.desc: "Tất cả chúng đều đã chết.\n\nTrên mỗi chiếc ghế tại các trạm làm việc ở lõi cơ sở này, đều có xác chết khô quắt của một loài ngoại lai vô danh nào đó cuộn tròn lại, đôi mắt kép nhợt nhạt của chúng đồng loạt nhìn chằm chằm lên trần nhà. Dù cho hình thù đáng sợ, §H[Leader.GetName]§! có thể khẳng định cơ bản những sinh vật này không phải là sản phẩm của ảo giác. Hiện tại, dữ liệu hình ảnh về những sinh mệnh này được xếp vào loại tối mật.\n\nHiện trường không phát hiện dấu vết sử dụng vũ khí, cho thấy sự tồn tại trên §H[shrouded_planet.GetName]§! không mang tính thù địch. Cơ sở này rất có thể là một trạm quan sát, với các thiết bị giám sát tinh vi từng nhắm thẳng vào §H[Owner.GetHomeWorldName]§!. Đo lường đồng vị carbon cho thấy nó đã hoạt động từ rất lâu trước khi thảm họa ập đến.\n\nChúng ta đã giải mã được một lượng lớn hồ sơ: ngoài các nhật ký liên lạc thông thường, nội dung chính đều liên quan đến lịch sử sơ khai của nền văn minh giống loài ta."
 shroud.8110.a: "Chúng đang giám sát chúng ta sao?"

 shroud.8115.name: "Sự tồn tại vượt ngoài nhận thức"
 shroud.8115.desc: "Cơ sở dữ liệu trên §H[shrouded_planet.GetName]§! đã được giải mã, những truyền thuyết mà chúng ta từng coi là vô lý nay lại được chứng minh là có thật. Chúng ta đã từng là đối tượng của một cuộc thử nghiệm khoa học tâm linh mang tên \"$tech_psionic_theory$\".\n\nGiống loài chúng ta được xác định là có tiềm năng cho tài năng này. Nhiều tổ tiên có lẽ đã từng cảm nhận được hình thức kết nối này trong giấc mơ, hoặc nhầm tưởng đó là những tiếng nói từ xa xăm - những hiện tượng này thường bị quy cho là bệnh tâm thần hay hoang tưởng. Nhưng thí nghiệm của chúng đã đột ngột dừng lại; trong những ngày cuối cùng, nơi này không còn là trạm quan sát, mà là một nơi trú ẩn.\n\nBáo cáo của chúng về xã hội chúng ta đột ngột dừng lại sau một thí nghiệm thảm khốc - một thí nghiệm táo bạo được tiến hành tại hành tinh mẹ của chúng nhằm thao túng rào cản chiều không gian được gọi là §H\"Cõi Màn Che\"§!. Các nhà khoa học của chúng gọi sự kiện này là \"The Great Reckoning\", chúng tôi nghi ngờ đây chính là nguồn gốc thực sự của thảm họa.\n\nBất kể bản chất của sự kiện này là gì, ảnh hưởng của nó đã nhanh chóng lan đến §H[shrouded_planet.GetName]§!. Những khoảnh khắc cuối cùng của chúng được ghi lại trong một đoạn nhật ký ngắn gọn: \n\n§LNgày tận thế đã đến.§!"
 shroud.8115.a: "Liệu nó có đến săn lùng chúng ta không?"

 shroud.8120.name: "$fragment_of_reckoning$"
 shroud.8120.desc: "Chúng ta đã tìm thấy bằng chứng xác thực gây ra thảm họa này. Dấu vết của nó không khó để tìm thấy; §H[Leader.GetName]§! khẳng định có thể cảm nhận được tiếng gọi của nó đang vẫy gọi [Leader.GetHimHer].\n\nSâu bên trong cơ sở này, tồn tại một thực thể vô hình vượt khỏi nhận thức thông thường. Sinh vật vừa phi vật chất vừa phi năng lượng này được §H[Leader.GetName]§! miêu tả là tàn dư oán hận được tạo ra từ những ý chí bị nuốt chửng, và gọi nó là §H\"$fragment_of_reckoning$\"§!.\n\nVật thể này ban đầu được thiết kế để thu thập và dẫn truyền năng lượng tâm linh từ §HCõi Màn Che§!, như một biện pháp phòng thủ chống lại \"The Great Reckoning\". Tuy nhiên, kế hoạch này chỉ thành công một phần. Trong những khoảnh khắc cuối cùng khi hành tinh này đón nhận ngày tận thế, thực thể đầy ác ý này đã bị ép văng ra khỏi chiều không gian của nó, đồng thời cuốn theo cả ý chí bất cam của các nhà nghiên cứu. Giờ đây chỉ còn lại mảnh vỡ này.\n\nVật thể này sẽ khuếch đại ảo giác và linh thị của các nhà nghiên cứu, ban cho họ con mắt thứ hai vượt xa những giới hạn của thực tại. Đây vừa là một cám dỗ nguy hiểm, nhưng cũng ẩn chứa những khả năng vô hạn."
 shroud.8120.a: "Chúng ta vẫn còn nhiều điều phải học..."

 ENDBRINGERS_RESEARCH_PSIONIC_THEORY: "$tech_psionic_theory$"
 ENDBRINGERS_RESEARCH_PSIONIC_THEORY_DESC: "Mảnh vỡ tâm linh chúng ta tìm thấy trên §H[shrouded_planet.GetName]§! ẩn chứa nhiều bí ẩn cần được giải mã.\n\nChướng ngại vật ngáng đường chúng ta chính là những giới hạn trong tư duy của chính mình."
 ENDBRINGERS_PSIONIC_THEORY_PROJECT_TOOLTIP: "Cần hoàn thành: Nghiên cứu §H£society_research£$tech_psionic_theory$§!."

 ENDBRINGERS_ADOPT_PSIONICS_TRADITION: "$ENDBRINGERS_RESEARCH_PSIONIC_THEORY$"
 ENDBRINGERS_ADOPT_PSIONICS_TRADITION_DESC: "$ENDBRINGERS_RESEARCH_PSIONIC_THEORY_DESC$"
 ENDBRINGERS_PSIONICS_TRADITION_PROJECT_TOOLTIP: "Cần hoàn thành: Chấp nhận truyền thống §H$tradition_psionics_shroud$§!."

 shroud.8200.title: "Cõi Điên Loạn"
 shroud.8200.desc: "Những tiến bộ gần đây trong nghiên cứu về lĩnh vực tâm linh đã xác nhận thực tại tồn tại những chiều không gian vô hình, và ý thức của chúng ta chính là cánh cổng dẫn đến những chiều không gian đó. Bên ngoài bức màn này, là một cõi hỗn mang mà chúng ta khó lòng hiểu được.\n\nTừ tận cùng sâu thẳm của cõi giới này, một §Rtiếng nói từ tâm trí§! đang vẫy gọi. Nó không hứa hẹn sự cứu rỗi, mà là một khởi đầu mới. Để có thể kiểm soát được thứ sức mạnh vô danh của nó, ta phải vứt bỏ mọi sự tồn tại vốn có, rèn giũa lại định mệnh của mình từ trong những lý lẽ được dệt nên bởi chính sự điên rồ.\n\n§R\"Thời khắc đã điểm.\"§!"
 shroud.8200.a: "Chúng ta đã làm cái quái gì thế này?"
 shroud.8200.a.tt: "Mở khóa cây truyền thống §H$tradition_psionics_shroud$§!."

 chamber_of_silence_negative_effects_reduction: "Mỗi ['building:building_chamber_of_silence'] có thể làm giảm §G$@chamber_of_silence_effect_mult|0%$§! tác động tiêu cực"
 endbringers_madness_1: "Điên loạn"
 endbringers_madness_1_desc: "Đế chế của chúng ta được dẫn dắt bởi một mục tiêu duy nhất: truy cầu §Rtiếng nói từ tâm trí§!. Cho đến khi tìm thấy nó, nội tâm chúng ta sẽ không bao giờ được yên nghỉ."
 endbringers_madness_1_tt: "$chamber_of_silence_negative_effects_reduction$"
 endbringers_madness_2: "$endbringers_madness_1$"
 endbringers_madness_2_desc: "Đế chế của chúng ta đang ngày càng tiến gần hơn tới §Rtiếng nói từ tâm trí§!. Sự thôi thúc thúc đẩy chúng ta đã giảm bớt."
 endbringers_madness_2_tt: "$endbringers_madness_1_tt$"
 endbringers_madness_3: "$endbringers_madness_1$"
 endbringers_madness_3_desc: "Đế chế của chúng ta gần như có thể nghe thấy §Rtiếng nói từ tâm trí§!. Sẽ sớm thôi tôi sẽ có thể thấu hiểu."
 endbringers_madness_3_tt: "$endbringers_madness_1_tt$"

 ALLOW_CHAMBER_OF_SILENCE: "Mở khóa công trình: ['building:building_chamber_of_silence']."

 tr_psionics_endbringers_cult: "Tôn sùng Tâm thanh"
 tr_psionics_endbringers_cult_desc: "$ALLOW_CHAMBER_OF_SILENCE$"
 tr_psionics_endbringers_cult_delayed: "Một khi đã nghe thấy tiếng nói từ tâm trí, ta không thể làm ngơ. Chúng ta đành phải khuất phục trước ý chí của nó."

 building_chamber_of_silence: "Căn phòng Tĩnh lặng"
 building_chamber_of_silence_desc: "Những cá nhân tâm linh từ khắp nơi trong đế chế được đưa đến đây, để trò chuyện với Cõi Màn Che trong một căn mật thất tĩnh lặng, cách ly khỏi mọi nhiễu loạn."
 building_chamber_of_silence_madness_1_tt: "Hiệu ứng tiêu cực của ['modifier:endbringers_madness_1'] giảm §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_madness_2_tt: "Hiệu ứng tiêu cực của ['modifier:endbringers_madness_2'] giảm §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_madness_3_tt: "Hiệu ứng tiêu cực của ['modifier:endbringers_madness_3'] giảm §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_paranoia_tt: "Hiệu ứng tiêu cực của ['modifier:endbringers_paranoia'] giảm §G$@chamber_of_silence_effect_mult|0%$§!."
 building_chamber_of_silence_destroyed_tt: "§RNếu mất đi thuộc địa này, công trình này sẽ bị phá hủy.§!"

 shroud.8310.name: "$shroud.2750.name$"
 shroud.8310.desc: "Chúng ta đang được vẫy gọi lên một tầng bậc tồn tại cao hơn. Để bảo vệ sự thiêng liêng của quá trình thăng hoa, những kẻ ngoan cố chống đối vô ích đang dần bị thanh trừng. Số mệnh của chúng ta đã được định đoạt; và con đường phía sau chúng ta đã sụp đổ vào cái bóng của $pc_shrouded$.\n\n§RTiếng nói từ tâm trí§! vang lên với một sự rõ ràng đầy sức thuyết phục.\n\n§R“Đại đạo đã định.”§!\n\nNgài đang khao khát những vật hiến tế tự nguyện."
 shroud.8310.a: "Mọi thứ đều là tất yếu."
 shroud.8310.a.tt: "Mỗi thuộc địa mất đi 100-300 £pop£§Hdân số§!."

