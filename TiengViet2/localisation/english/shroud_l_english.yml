 # Eater of Worlds
 shroud.4500.title: "$utopia.3304.name$"
 shroud.4500.desc.default: "[GetEaterCovenantProposedEvent]"
 shroud.4500.desc.hive: "$shroud.4500.desc.default$"
 shroud.4500.desc.gestalt_machine: "$shroud.4500.desc.default$"
 shroud.4500.desc.individual_machine: "$shroud.4500.desc.default$"
 shroud.4500.desc.1: "Ngay khi tiếp xúc với Cõi Màn Che, chúng ta cảm nhận được một thực thể đang sục sôi bộc lộ cơn đói khát không bao giờ thỏa mãn."
 shroud.4500.desc.pacifist: "$shroud.4500.desc.1$$utopia.3306.desc.2$\n\nSự sốt sắng của Ngài thật quá mạnh mẽ. Tâm trí chúng ta liệu có thể chấp nhận một con quái vật như vậy không?"
 shroud.4500.desc.non_pacifist: "$shroud.4500.desc.1$$utopia.3306.desc.2$\n\nLời lẽ của Ngài lộ rõ vẻ sốt sắng."
 shroud.4500.a: "Ký giao ước với $the_eater_of_worlds_color_article$."

 shroud.4505.desc.intro: "Hoàn thành. Chúng ta đã ký giao ước với $the_eater_of_worlds_color_article$. Ý chí của Ngài sẽ được quán triệt đến toàn bộ §H[Root.GetName]§!."
 shroud.4505.desc.outro: "Khi sợi dây liên kết được thiết lập, thực thể đó đã lấy đi vật tế: toàn bộ dân số của một thành phố trong chúng ta đột nhiên biến mất. Cái giá này không lớn——trừ khi thực thể này vẫn còn đói."
 shroud.4505.desc.default: "$shroud.4505.desc.intro$\n\n[GetEaterCovenantFormedDesc]\n\n$shroud.4505.desc.outro$"
 shroud.4505.desc.hive: "$shroud.4505.desc.intro$\n\n[GetEaterCovenantFormedDesc]\n\n$shroud.4505.desc.outro$"
 shroud.4505.desc.gestalt_machine: "$shroud.4505.desc.hive$"
 shroud.4505.desc.individual_machine: "$shroud.4505.desc.intro$\n\nNhững thay đổi trong xã hội của chúng ta đã có thể quan sát. Đơn vị quân sự của chúng ta cực kỳ tập trung vào chiến đấu; ngay cả trong thời bình, họ cũng bắt buộc phải tiếp tục thực hiện mô phỏng chiến đấu khắc nghiệt, nếu không sẽ xảy ra các cuộc tấn công không cần thiết.\n\n$shroud.4505.desc.outro$"
 shroud.4505.desc_2_pacifist: "Xã hội của chúng ta đã bắt đầu biến chuyển. Tư duy của chúng ta mâu thuẫn với ham muốn chiến tranh. Sự bất đồng nhận thức này gây ra sự khó chịu tột cùng trong những con người vốn ưa chuộng hòa bình. Liệu chúng ta đã chọn đúng chưa?"
 shroud.4505.desc_2_organic_non_gestalt: "Những thay đổi trong xã hội của chúng ta đã có thể quan sát. Đơn vị quân sự của chúng ta cực kỳ tập trung vào chiến đấu; ngay cả trong thời bình, họ cũng bắt buộc phải tiếp tục thực hiện mô phỏng chiến đấu khắc nghiệt, nếu không sẽ xảy ra các cuộc tấn công không cần thiết."
 shroud.4505.desc_2_machine_non_gestalt: "Những thay đổi trong xã hội của chúng ta đã có thể quan sát. Đơn vị quân sự của chúng ta cực kỳ tập trung vào chiến đấu; ngay cả trong thời bình, họ cũng bắt buộc phải tiếp tục thực hiện mô phỏng chiến đấu khắc nghiệt, nếu không sẽ xảy ra các cuộc tấn công không cần thiết."
 shroud.4505.desc_2_gestalt: "Những thay đổi trong xã hội của chúng ta đã có thể quan sát. Các [GetIndividualNamePlural] của chúng ta cực kỳ tập trung vào chiến đấu; ngay cả trong thời bình, họ cũng bắt buộc phải tiếp tục thực hiện mô phỏng chiến đấu khắc nghiệt, nếu không sẽ xảy ra các cuộc tấn công không cần thiết."
 shroud.4505.a.default: "Hy vọng là không."
 shroud.4505.a.gestalt: "Cái giá này thật đáng."

 shroud.4510.desc.intro: "Kể từ khi"
 shroud.4510.desc.outro: "ký kết giao ước, đã một thời gian trôi qua. Sợi dây liên kết giữa chúng ta vẫn còn mong manh, vì vậy vẫn còn cơ hội để phá vỡ hoặc củng cố nó.\n\nCác [GetTelepathPlural] của chúng ta khẳng định, có được cam kết chính thức này sẽ có thể chủ động sử dụng sức mạnh do Đấng bảo trợ cung cấp, tăng cường cho hạm đội và $PSIONIC_AURA$ của chúng ta."
 shroud.4510.desc: "$shroud.4510.desc.intro$ $the_eater_of_worlds_color_article$ $shroud.4510.desc.outro$"
 shroud.4510.b: "Quay lưng với $the_eater_of_worlds_color_article$."

 shroud_eater_covenant_chain_title: "$eater_covenant_chain_title$"
 shroud_eater_covenant_chain_desc.intro: "Chúng ta đã thiết lập một sợi dây liên kết với một thực thể Cõi Màn Che có tên là $the_eater_of_worlds_color_article$. Kèm theo đó là cảm giác tham lam, nó đòi một cái giá nhất định để ban cho chúng ta chút sức mạnh nhỏ nhoi.\n\nCác [GetTelepathPlural] của chúng ta kết luận rằng, nếu giữ sự nhất quán với Đấng bảo trợ, sợi dây liên kết này có thể được củng cố."
 shroud_eater_covenant_chain_desc: "$shroud_eater_covenant_chain_desc.intro$\n\nThực thể đó vô độ và đói khát. Ngài khao khát chiến tranh, cũng như xung đột và sự ngọt ngào của tiếng khóc than."
 shroud_eater_covenant_chain_begin: "$eater_covenant_chain_begin$"
 shroud_eater_covenant_chain_end: "$eater_covenant_chain_end$"

 robot_shroud_eater_covenant_chain_title: "$shroud_eater_covenant_chain_title$"
 robot_shroud_eater_covenant_chain_desc: "$shroud_eater_covenant_chain_desc.intro$\n\nThực thể đó vô độ và đói khát. Ngài khao khát chiến tranh, cũng như xung đột và sự ngọt ngào của biển lửa cùng tàn tích."

 # Instrument of Desire
 shroud.4550.title: "$utopia.3304.name$"
 shroud.4550.desc.default: "Ngay khi chúng ta lao vào Cõi Màn Che, một sự hiện diện đã chủ động tìm đến. Tư tưởng của Ngài đan xen trong nhận thức của các [GetTelepathPlural] chúng ta, lải nhải, ngã giá. Đó chính là $the_instrument_of_desire_color_article$, Ngài sẽ ban cho chúng ta sự giàu có, sức mạnh, danh vọng… mọi thứ chúng ta khao khát. Mọi thứ chúng ta sẽ khao khát.\n\nCái giá phải trả ư? Chẳng đáng là bao, chỉ là một chút phí dịch vụ. Ngài muốn tốt cho chúng ta, Ngài sẽ giúp đỡ chúng ta, hướng dẫn chúng ta, chỉ lối cho tham vọng và ước mơ của chúng ta.\n\n§HMột khi chúng ta đưa Ngài vào tâm trí.§!\n\nNó rất chắc chắn là chúng ta sẽ đồng ý, sao chúng ta lại không thể đồng ý chứ?"
 shroud.4550.desc.hive: "$shroud.4550.desc.default$"
 shroud.4550.desc.gestalt_machine: "Ngay khi chúng ta lao vào Cõi Màn Che, một sự hiện diện đã chủ động tìm đến. Tư tưởng của Ngài đan xen trong mạch điện của các [GetTelepathPlural] chúng ta, lải nhải, ngã giá. Đó chính là $the_instrument_of_desire_color_article$, Ngài sẽ ban cho chúng ta sự giàu có, sức mạnh, danh vọng… mọi thứ chúng ta khao khát. Mọi thứ chúng ta sẽ khao khát.\n\nCái giá phải trả ư? Chẳng đáng là bao, chỉ là một chút phí dịch vụ. Ngài muốn tốt cho chúng ta, Ngài sẽ giúp đỡ chúng ta, hướng dẫn chúng ta, chỉ lối cho tham vọng và ước mơ của chúng ta.\n\n§HMột khi chúng ta đưa Ngài vào tâm trí.§!\n\nNó rất chắc chắn là chúng ta sẽ đồng ý, sao chúng ta lại không thể đồng ý chứ?"
 shroud.4550.desc.individual_machine: "$shroud.4550.desc.gestalt_machine$"
 shroud.4550.a: "Ký giao ước với $the_instrument_of_desire_color_article$."

 shroud.4555.desc.intro: "Hoàn thành. Chúng ta đã ký giao ước với $the_instrument_of_desire_color_article$. Ý chí của Ngài sẽ được quán triệt đến toàn bộ §H[Root.GetName]§!."
 shroud.4555.desc.outro: "Đây là cái giá của sợi dây liên kết của chúng ta. Theo các [GetTelepathPlural] cho biết, sự bảo hộ mạnh nhất của thực thể đó vẫn chưa tới."
 shroud.4555.desc.default: "$shroud.4555.desc.intro$\n\nCái giá của cuộc mua bán này đã hiển hiện rõ. Chúng ta chờ đợi thời đại hoàng kim của sự phồn thịnh giàu có, quần chúng không còn chỉ thỏa mãn với những nhu cầu sinh tồn cơ bản nữa. Các [Root.GetSpeciesNamePlural] giờ đây thèm khát đủ mọi của cải vật chất——đó là gánh nặng kinh tế mới của chúng ta.\n\n$shroud.4555.desc.outro$"
 shroud.4555.desc.hive: "$shroud.4555.desc.intro$\n\nCái giá của cuộc mua bán này đã có thể thấy được. Chúng ta chờ đợi thời đại hoàng kim của sản lượng vô địch, nhu cầu cơ bản của các cá thể con cũng đã tăng lên. Các [Root.GetSpeciesNamePlural] ở khắp nơi bắt đầu cần nhiều loại vật tư không cần thiết——đó là gánh nặng kinh tế mới của chúng ta.\n\n$shroud.4555.desc.outro$"
 shroud.4555.desc.gestalt_machine: "$shroud.4555.desc.hive$"
 shroud.4555.desc.individual_machine: "$shroud.4555.desc.default$"
 shroud.4555.a.default: "Hy vọng là Ngài ấy đúng."
 shroud.4555.a.gestalt: "Chúng ta tin Ngài ấy đúng."

 shroud.4560.desc: "$shroud.4510.desc.intro$ $the_instrument_of_desire_color_article$ $shroud.4510.desc.outro$"
 shroud.4560.b: "Quay lưng với $the_instrument_of_desire_color_article$."

 shroud_instrument_covenant_chain_title: "$instrument_covenant_chain_title$"
 shroud_instrument_covenant_chain_desc.intro: "Chúng ta đã thiết lập một sợi dây liên kết với một thực thể Cõi Màn Che mang tên §HVật dụng của sự khao khát§!. Ngài đòi một cái giá nhất định để ban cho chúng ta chút sức mạnh nhỏ nhoi. Việc trao đổi như thế này sẽ còn xảy ra nhiều hơn nữa.\n\nCác [GetTelepathPlural] của chúng ta suy luận rằng, chỉ cần hành động của chúng ta hài hòa với ý chí của Đấng bảo trợ, sợi dây liên kết này sẽ càng thêm bền chặt."
 shroud_instrument_covenant_chain_desc: "$shroud_instrument_covenant_chain_desc.intro$\n\nDụng cụ khao khát chính sự khao khát. Trầm mê trong hưởng lạc, sự tha hóa và việc nô dịch chính là biệt danh của dụng cụ."
 shroud_instrument_covenant_chain_begin: "$instrument_covenant_chain_begin$"
 shroud_instrument_covenant_chain_end: "$instrument_covenant_chain_end$"

 robot_shroud_instrument_covenant_chain_title: "$shroud_instrument_covenant_chain_title$"
 robot_shroud_instrument_covenant_chain_desc: "$shroud_instrument_covenant_chain_desc.intro$\n\nDụng cụ khao khát chính sự khao khát. Tiêu thụ và lợi dụng không kiềm chế chính là biệt danh của dụng cụ."

 # Cradle of Souls
 shroud.4600.title: "$utopia.3304.name$"
 shroud.4600.desc.default: "[GetCradleCovenantProposedDesc]"
 shroud.4600.desc.hive: "$shroud.4600.desc.default$"
 shroud.4600.desc.gestalt_machine: "$shroud.4600.desc.default$"
 shroud.4600.desc.individual_machine: "$shroud.4600.desc.default$"
 shroud.4600.desc_homicidal: "Khi chúng ta chìm vào Cõi Tâm Linh Shroud, một sự hiện diện bắt đầu thiêu đốt những ảo cảnh bên trong tâm trí chúng ta. Ánh sáng tràn ngập bao trùm lấy tất cả. Đây chính là $the_cradle_of_souls_color_article$ đang thiêu đốt tâm trí chúng ta.\n\nNó yêu cầu không chỉ là sự thỏa hiệp trên quy mô hệ sao hay nền hòa bình hèn hạ giữa các dị chủng yếu kém. Ngài hứa hẹn với chúng ta một sức mạnh to lớn, chỉ cần chúng ta chấp nhận viễn cảnh gớm ghiếc này.\n\n§HMột khi chúng ta để mặc cho nó nhào nặn tầm nhìn mới.§!\n\nÁnh sáng của Nguyệt Oa không khoan nhượng, sức mạnh của Ngài không thể cưỡng lại."
 shroud.4600.desc_non_homicidal: "Khi tâm trí chúng ta chìm vào Cõi Màn Che, một sự hiện diện bắt đầu bừng nở bên trong. Chúng ta cảm nhận được ánh sáng của nó thắp sáng mọi thứ, giải phóng sự trật tự và cân bằng. Đây chính là $the_cradle_of_souls_color_article$, đang chạm đến tầng sâu thẳm nhất trong ta.\n\nNgài mong muốn không chỉ là một nền hòa bình lâu dài——mà là mang đến sự chấm dứt hỗn loạn cho hệ sao. Nếu chúng ta chia sẻ tầm nhìn của Ngài, chúng ta có thể trở thành sứ giả của sự hòa hợp. Ngài hứa hẹn một sự tin tưởng không thể phá vỡ.\n\n§HMột khi chúng ta để mặc cho nó nhào nặn tầm nhìn mới.§!\n\nKỳ vọng của Chiếc Nôi đè nặng lên vai chúng ta."
 shroud.4600.a: "Ký giao ước với $the_cradle_of_souls_color_article$."

 shroud.4605.intro: "Hoàn thành. Chúng ta đã ký giao ước với $the_cradle_of_souls_color_article$. Ý chí của Ngài sẽ được quán triệt đến toàn bộ §H[Root.GetName]§!."
 shroud.4605.desc.default: "$shroud.4605.desc.non_gestalt$"
 shroud.4605.desc.gestalt: "$shroud.4605.intro$\n\n[GetCradleCovenantFormedDesc]"
 shroud.4605.desc.non_gestalt: "$shroud.4605.intro$\n\n[GetCradleCovenantFormedDesc]"
 shroud.4605.desc.hive: "$shroud.4605.desc.gestalt$"
 shroud.4605.desc.gestalt_machine: "$shroud.4605.desc.gestalt$"
 shroud.4605.desc.individual_machine: "$shroud.4605.desc.non_gestalt$"
 shroud.4605.desc_outro_homicidal: "Tác động đến tâm trí [Root.GetSpeciesAdj] là điều không thể phủ nhận. Tư tưởng của rất nhiều [Root.GetIndividualPlural] bị đầu độc bởi cái gọi là hòa bình hệ sao, tạo ra một sự bất đồng nhận thức sâu sắc trong xã hội của chúng ta.\n\nTheo các [GetTelepathPlural] cho biết, sự bảo hộ của giao dịch vẫn chưa tới. Và chúng ta phải chịu đựng sự đau đớn từ cuộc xung đột tư tưởng tồi tệ này cho đến khi nó tới. Rốt cuộc chúng ta đã làm gì với chính mình vậy?"
 shroud.4605.desc_outro_gestalt: "Tác động đến tâm trí [Root.GetSpeciesAdj] đã có thể cảm nhận được. Bởi vì chúng ta hướng tới mục tiêu hòa bình cho toàn bộ hệ sao, nên bất kỳ sự không thân thiện nào với các nước láng giềng đều sẽ tạo ra sự nhiễu loạn cho ý thức tập thể.\n\nSự nhiễu loạn nhỏ này là cái giá phải trả để thiết lập sợi dây liên kết. Theo các [GetTelepathPlural] cho biết, sự bảo hộ mạnh nhất của Chiếc Nôi vẫn chưa tới."
 shroud.4605.desc_outro_non_gestalt: "Tác động đến tâm trí [Root.GetSpeciesAdj] đã hiển hiện rõ. Bởi vì chúng ta hướng tới mục tiêu hòa bình cho toàn bộ hệ sao, nên bất kỳ sự không thân thiện nào với các nước láng giềng đều sẽ gây ra sự đau đớn cho đại đa số quần chúng.\n\nSự nhiễu loạn nhỏ này là cái giá phải trả để thiết lập sợi dây liên kết. Theo các [GetTelepathPlural] cho biết, sự bảo hộ mạnh nhất của Chiếc Nôi vẫn chưa tới."
 shroud.4605.a.default: "[GetCradleCovenantFormedOption]"
 shroud.4605.a.gestalt: "[GetCradleCovenantFormedOption]"
 shroud.4605.opt.a.default: "Hy vọng họ đúng."
 shroud.4605.opt.a.gestalt: "Chúng ta tin họ đúng."
 shroud.4605.opt.a.homicidal: "Hiện tại chỉ có thể cố gắng nhẫn nhịn một chút."

 shroud.4610.desc: "$shroud.4510.desc.intro$ $the_cradle_of_souls_color_article$ $shroud.4510.desc.outro$"
 shroud.4610.b: "Quay lưng với $the_cradle_of_souls_color_article$."

 shroud_cradle_covenant_chain_title: "$the_cradle_of_souls$"
 shroud_cradle_covenant_chain_desc: "Chúng ta đã thiết lập một sợi dây liên kết với một thực thể Cõi Màn Che có tên là $the_cradle_of_souls_color_article$. Kèm theo cảm giác hòa hợp, nó đòi một cái giá nhất định để ban cho chúng ta chút sức mạnh nhỏ nhoi.\n\nCác [GetTelepathPlural] của chúng ta kết luận rằng, nếu giữ sự nhất quán với Đấng bảo trợ, sợi dây liên kết này có thể được củng cố.\n\nChiếc Nôi khao khát hệ sao được thoát khỏi hỗn loạn và xung đột, và tất cả mọi người đều tận tâm thực hiện một nền hòa bình chung. Chỉ sự cân bằng hoàn hảo mới là đủ."
 shroud_cradle_covenant_chain_begin: "$BEGINS_EVENT_CHAIN$§Y$shroud_cradle_covenant_chain_title$§!"
 shroud_cradle_covenant_chain_end: "$ENDS_EVENT_CHAIN$§Y$shroud_cradle_covenant_chain_title$§!"

 robot_shroud_cradle_covenant_chain_title: "$shroud_cradle_covenant_chain_title$"
 robot_shroud_cradle_covenant_chain_desc: "$shroud_cradle_covenant_chain_desc$"

 # Composer of Strands
 shroud.4650.title: "$utopia.3304.name$"
 shroud.4650.desc.default: "Một sự hiện diện đang chờ đợi trong Cõi Màn Che, chào đón chúng ta một cách đầy thân thiện. Ngài không tốn lời, mà bày tỏ bằng những ảo cảnh, khái niệm và suy nghĩ. Ngài trượt vào tư duy của các [GetTelepathPlural] chúng ta một cách êm ái và nhẹ nhàng, tựa như nó vốn ở đó ngay từ đầu. Một chuỗi hình ảnh lướt qua trước mắt họ.\n\nSự hiện diện đó chính là $the_composer_of_strands_color_article$, Ngài cho rằng hình thái hữu cơ của chúng ta mang những đặc tính thú vị. Ngài chỉ ra nhiều hướng mà cơ thể của chúng ta có thể lớn lên, biến đổi, cải tiến và tiến hóa.\n\n§HChỉ cần chúng ta sẵn sàng đưa nó vào thể xác.§!\n\nNgài kiên nhẫn và ân cần chờ đợi câu trả lời, như một người mẹ dịu dàng chờ đợi đứa con yêu dấu nhất của mình vậy."
 shroud.4650.desc.hive: "$shroud.4650.desc.default$"
 shroud.4650.desc.gestalt_machine: "Một sự hiện diện đang chờ đợi trong Cõi Màn Che, chào đón chúng ta một cách đầy thân thiện. Ngài không tốn lời, mà bày tỏ bằng những ảo cảnh, khái niệm và suy nghĩ. Ngài trượt vào mạch điện của các [GetTelepathPlural] chúng ta một cách êm ái và nhẹ nhàng, tựa như nó vốn ở đó ngay từ đầu. Một chuỗi hình ảnh lướt qua trước mắt họ.\n\nSự hiện diện đó chính là $the_composer_of_strands_color_article$, Ngài cho rằng hình thái hữu cơ của chúng ta mang những đặc tính thú vị. Ngài chỉ ra nhiều hướng mà cơ thể của chúng ta có thể thích nghi, biến đổi, cải tiến và tiến hóa.\n\n§HChỉ cần chúng ta sẵn sàng đưa nó vào cấu trúc.§!\n\nNgài kiên nhẫn và ân cần chờ đợi câu trả lời, như một người mẹ dịu dàng chờ đợi đứa con yêu dấu nhất của mình vậy."
 shroud.4650.desc.individual_machine: "$shroud.4650.desc.gestalt_machine$"
 shroud.4650.a: "Ký giao ước với $the_composer_of_strands_color_article$."

 shroud.4655.desc.intro: "Hoàn thành. Chúng ta đã ký giao ước với $the_composer_of_strands_color_article$. Ý chí của Ngài sẽ được quán triệt đến toàn bộ §H[Root.GetName]§!."
 shroud.4655.desc.outro: "Rõ ràng là chúng ta đã từ bỏ một phần quyền kiểm soát hình thể [Root.GetSpeciesAdj], Đấng bảo trợ của chúng ta nay có thể tự do thay đổi nó.\n\nSự hy sinh nhỏ nhoi này là cái giá phải trả cho sợi dây liên kết mới. Theo các [GetTelepathPlural] cho biết, sự bảo hộ mạnh nhất của người dệt sợi vẫn chưa tới."
 shroud.4655.desc.default: "$shroud.4655.desc.intro$\n\nCác [GetScientistPlural] của chúng ta đã phát hiện ra các mô hình bất thường trong cấu trúc gen của các mẫu thử nghiệm [Root.GetSpeciesAdj], cứ như thể nhiều thế hệ tiến hóa diễn ra chỉ sau một đêm. $shroud.4655.desc.outro$"
 shroud.4655.desc.hive: "$shroud.4655.desc.default$"
 shroud.4655.desc.individual_machine: "$shroud.4655.desc.intro$\n\nCác [GetScientistPlural] của chúng ta đã phát hiện ra các mô hình bất thường trong cấu trúc phân tử của các mẫu thử nghiệm [Root.GetSpeciesAdj], cứ như thể nhiều thế hệ nâng cấp hệ thống diễn ra chỉ sau một đêm. $shroud.4655.desc.outro$"
 shroud.4655.desc.gestalt_machine: "$shroud.4655.desc.individual_machine$"
 shroud.4655.a.default: "$covenant.composer.option$"
 shroud.4655.a.gestalt: "Đây là cái giá của sức mạnh."

 shroud.4660.desc: "$shroud.4510.desc.intro$ $the_composer_of_strands_color_article$ $shroud.4510.desc.outro$"
 shroud.4660.b: "Quay lưng với $the_composer_of_strands_color_article$."

 shroud_composer_covenant_chain_title: "$composer_covenant_chain_title$"
 shroud_composer_covenant_chain_desc.intro: "Chúng ta đã thiết lập một sợi dây liên kết với một thực thể Cõi Màn Che mang tên $the_composer_of_strands_color_article$. Kèm theo đó là cảm giác che chở, Ngài đòi một cái giá nhất định để ban cho chúng ta chút sức mạnh nhỏ nhoi. Việc trao đổi như thế này sẽ còn xảy ra nhiều hơn nữa.\n\nCác [GetTelepathPlural] của chúng ta suy luận rằng, chỉ cần hành động của chúng ta hài hòa với ý chí của Đấng bảo trợ, sợi dây liên kết này sẽ càng thêm bền chặt."
 shroud_composer_covenant_chain_desc: "$shroud_composer_covenant_chain_desc.intro$\n\nThực thể đó khao khát thao túng gen và giải thoát máu thịt khỏi những gông cùm của tiến hóa. Ngài dạy chúng ta phải tôn trọng sự sống và tự nhiên, cũng như sự thiêng liêng của máu thịt."
 shroud_composer_covenant_chain_begin: "$composer_covenant_chain_begin$"
 shroud_composer_covenant_chain_end: "$composer_covenant_chain_end$"

 robot_shroud_composer_covenant_chain_title: "$shroud_composer_covenant_chain_title$"
 robot_shroud_composer_covenant_chain_desc: "$shroud_composer_covenant_chain_desc.intro$\n\nThực thể đó khao khát thao túng hình thái vật chất và để sự phát triển thoát khỏi những gông cùm thông thường. Ngài dạy chúng ta phải tôn trọng sự sống và tự nhiên, cũng như sự thiêng liêng của máu thịt."

 # Whisperers in the Void
 shroud.4700.title: "$utopia.3304.name$"
 shroud.4700.desc: "$utopia.3304.desc.shroud$"
 shroud.4700.a: "Ký giao ước với $whisperers_in_the_void_color_article$."
 shroud.4700.b: "$shroud.reject_covenant$"
 shroud_whisperers_in_the_void_covenant_formed_effect: "$t$£unity£ $mod_country_base_unity_produces_add$：§R-15%§!"

 shroud.4705.desc.intro: "Hoàn thành. Chúng ta đã ký giao ước với $whisperers_in_the_void_color_article$. Ý chí của Ngài sẽ được quán triệt đến toàn bộ §H[root.GetName]§!.\n\nẢnh hưởng của vị tân Đấng bảo trợ xuất hiện rất nhanh chóng."
 shroud.4705.desc.outro: "Đây là cái giá của sợi dây liên kết mạnh mẽ. Theo các [GetTelepathPlural] cho biết, sự bảo hộ mạnh nhất của tiếng thì thầm vẫn chưa tới. Việc chúng ta giao tiếp trực tiếp với những thực thể tâm linh hùng mạnh này không còn nghi ngờ gì nữa là hoàn toàn xứng đáng."
 shroud.4705.desc.gestalt: "$shroud.4705.desc.intro$ Khi tập thể của chúng ta chờ đợi sự truyền vào của những tri thức bí mật, chúng ta cảm nhận được ý thức của mình chia nhánh ra thành những hình mẫu khác nhau. Sự hòa hợp ổn định của [GetNetworkName] bị che lấp bởi những tiếng nói nội tâm ngày càng bất nhất.\n\n$shroud.4705.desc.outro$"
 shroud.4705.desc.non_gestalt: "$shroud.4705.desc.intro$ Khi khao khát sự truyền vào của những tri thức bí mật, các tư tưởng và quan điểm trong xã hội của chúng ta đã phân cực sâu sắc. Những tiếng nói không hài hòa tàn phá tâm trí, làm hại đến sức khỏe tinh thần của mọi [root.GetSpeciesNamePlural].\n\n$shroud.4705.desc.outro$"
 shroud.4705.desc.default: "$shroud.4705.desc.non_gestalt$"
 shroud.4705.desc.hive: "$shroud.4705.desc.gestalt$"
 shroud.4705.desc.gestalt_machine: "$shroud.4705.desc.gestalt$"
 shroud.4705.desc.individual_machine: "$shroud.4705.desc.non_gestalt$"
 shroud.4705.a.default: "Chúng ta có thể xử lý được."
 shroud.4705.a.gestalt: "$shroud.4705.a.default$"

 shroud.4710.title: "$utopia.2658.name$"
 shroud.4710.desc: "$shroud.4510.desc.intro$ $whisperers_in_the_void_color_article$ $shroud.4510.desc.outro$"
 shroud.4710.a: "$utopia.2658.a$"
 shroud.4710.b: "Quay lưng với $whisperers_in_the_void_color_article$."
