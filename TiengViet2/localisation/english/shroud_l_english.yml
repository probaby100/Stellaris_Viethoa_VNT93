 psi_fighting_competitions_gestalt: "$psi_fighting_competitions$"
 psi_fighting_competitions_gestalt_desc: "Đối với ý thức chung, giác đấu tâm linh là một hình thức giải trí có thể chấp nhận được."

 shroudfall: "Vực Sâu Cõi Màn Che"
 shroudfall_desc: "Cõi Màn Che đã nuốt chửng một phần vùng đất này. Chúng ta đang nghiên cứu cách để khôi phục nó lại như cũ."
 add_shroudfall_concept: "Thêm ['concept_shroudfall'] vào [This.GetName]"

 impulse_mitigation: "Xoa Dịu Xung Động"
 impulse_mitigation_desc: "Có một thực thể tâm linh đang ảnh hưởng đến hành vi của chúng ta. Chúng ta đang phân bổ các nguồn lực khoa học để ức chế xung động này."

 shroud_influence: "Lắng Nghe"
 shroud_influence_desc: "Tâm trí của chúng ta đang bị ảnh hưởng bởi một thực thể giao tiếp tâm linh."

 shroud_suppression: "Đè Nén Xung Động"
 shroud_suppression_desc: "Có một thực thể tâm linh đang cố gắng chi phối hành vi của chúng ta. Chúng ta phải dồn nén loại xung động từ bên ngoài này."

 psionic_inhibitors: "Cỗ Máy Ức Chế Tâm Linh"
 psionic_inhibitors_desc: "Chúng ta đang đổ tài nguyên vào việc phát triển các thiết bị cấy ghép nhằm cản trở sự quấy nhiễu từ hoạt động tâm linh."

 psionic_inhibitors_machine: "$psionic_inhibitors$"
 psionic_inhibitors_machine_desc: "Chúng ta đang đổ tài nguyên vào việc phát triển các bản nâng cấp nhằm cản trở sự quấy nhiễu từ hoạt động tâm linh."

 psionic_meditation: "Thiền Định Tâm Linh"
 psionic_meditation_desc: "Để giảm bớt sự xáo trộn tâm trí do các hoạt động tâm linh gây ra, chúng ta đang nghiên cứu các phương pháp thiền định cải tiến cho người dân."

 psionic_meditation_machine: "$psionic_meditation$"
 psionic_meditation_machine_desc: "Để giảm bớt sự xáo trộn thần kinh do các hoạt động tâm linh gây ra, chúng ta đang nghiên cứu các phương pháp thiền định cải tiến cho dân chúng."

 psionic_training: "Huấn Luyện Tâm Linh"
 psionic_training_desc: "Sự quấy nhiễu tâm linh lên tư duy là cơ hội tuyệt vời để cùng nhau phát triển sức mạnh tâm linh. Chúng ta sẽ chủ động vạch ra các chiến lược lấy tâm linh làm trọng tâm để tối ưu hóa kết quả đầu ra."

 sleep_disturbance_research: "Nghiên Cứu Rối Loạn Giấc Ngủ"
 sleep_disturbance_research_desc: "Năng lượng tâm linh đang làm đảo lộn chu kỳ giấc ngủ của chúng ta. Chúng ta đã dồn nguồn lực để tìm ra giải pháp ngăn chặn những cơn ác mộng này."

 night_terrors: "Ác Mộng"
 night_terrors_desc: "Những cơn ác mộng khủng khiếp sinh ra từ năng lượng tâm linh đang làm đảo lộn chu kỳ giấc ngủ của chúng ta."

