 shroud.first_contact_insert.instrument: "Một §Hluồng xung kích điên cuồng§!"
 shroud.4035.title: "$the_instrument_of_desire_article_cap$ hiển linh"
 shroud.4035.desc.all.start: "Sau nhiều tháng kêu gọi vô ích, §H[Root.Patron:the_instrument_of_desire.GetPreCommunicationName]§! cuối cùng cũng lộ diện từ sâu thẳm của §HCõi Màn Che§!."
 shroud.4035.desc.default: "$shroud.4035.desc.all.start$\n\nThông điệp của Ngài ùa đến như thác lũ. Dòng suy nghĩ với sức mạnh cường đại xông vào đầu óc chúng ta, ngỏ lời với những dục vọng hoang dã nhất. Những lời lẽ nhẹ nhàng mà phong phú tuôn trào không ngớt, nhấn chìm tâm trí chúng ta. Thông điệp Ngài truyền đạt thật sự vô cùng quyến rũ: đó là một viễn cảnh về sức mạnh và sự buông thả.\n\n$shroud.4035.desc.default.end$"
 shroud.4035.desc.default.end: "Cơn sóng ùa đến nay dần lắng xuống thành dòng suối nhỏ. Sự hiện diện này tạm thời không mong đợi câu trả lời. Ngài đã ban cho chúng ta một sự khao khát không thể dập tắt.\n\nChúng ta đã làm rõ nhu cầu của thực thể này, đã biết được viễn cảnh của Ngài về sự giàu có vô tận. Chỉ cần các [GetTelepathPlural] của chúng ta hồi phục, là có thể tiếp xúc và giao tiếp với thực thể này, $the_instrument_of_desire_color_article$."
 shroud.4035.desc.hive: "$shroud.4035.desc.all.start$\n\nThông điệp của Ngài ùa đến như thác lũ. Dòng suy nghĩ với sức mạnh cường đại xông vào đầu óc chúng ta, ngỏ lời với những dục vọng hoang dã nhất. Những lời lẽ nhẹ nhàng mà phong phú tuôn trào không ngớt, nhấn chìm tâm trí chúng ta. Thông điệp Ngài truyền đạt tràn trề năng lượng: đó là một viễn cảnh về sản lượng vô kể.\n\n$shroud.4035.desc.default.end$"
 shroud.4035.desc.gestalt_machine: "$shroud.4035.desc.all.start$\n\nThông điệp của Ngài ùa đến như thác lũ. Dòng suy nghĩ với sức mạnh cường đại xông vào mạch điện của chúng ta, vượt quá mọi dữ liệu đầu vào trong quá khứ. Những lời lẽ nhẹ nhàng mà phong phú tuôn trào không ngớt, nhấn chìm tâm trí chúng ta. Thông điệp Ngài truyền đạt tràn trề năng lượng: đó là một viễn cảnh về sản lượng vô kể.\n\n$shroud.4035.desc.machine.end$"
 shroud.4035.desc.machine.end: "Cơn sóng ùa đến nay dần lắng xuống thành dòng suối nhỏ. Sự hiện diện này tạm thời không mong đợi câu trả lời. Ngài đã để lại cho chúng ta một khoảng không vỡ vụn, khao khát những dữ liệu đầu vào thanh lịch.\n\nChúng ta đã làm rõ nhu cầu của thực thể này, đã biết được viễn cảnh của Ngài về sự giàu có vô tận. Chỉ cần các [GetTelepathPlural] của chúng ta hồi phục, là có thể tiếp xúc và giao tiếp với thực thể này, $the_instrument_of_desire_color_article$."
 shroud.4035.desc.individual_machine: "$shroud.4035.desc.all.start$\n\nThông điệp của Ngài ùa đến như thác lũ. Dòng suy nghĩ với sức mạnh cường đại xông vào đầu óc chúng ta, ngỏ lời với những dục vọng hoang dã nhất. Những lời lẽ nhẹ nhàng mà phong phú tuôn trào không ngớt, nhấn chìm tâm trí chúng ta. Thông điệp Ngài truyền đạt tràn trề năng lượng: đó là một viễn cảnh về sản lượng vô kể.\n\n$shroud.4035.desc.machine.end$"
 shroud.4035.a.default: "Tuyệt vời."
 shroud.4035.a.robot: "Quá tốt rồi."
 shroud.4035.b.default: "$shroud.first_contact.end.b$"
 shroud.4035.b.robot: "$shroud.first_contact.end.b$"
 shroud.4035.c.default: "Toàn lời sáo rỗng."
