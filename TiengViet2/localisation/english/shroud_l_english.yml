##################################
# ENGLISH LOCALISATION - Shroud #
##################################

 SHROUD_TITLE: "Bóng Đêm Cõi Màn Che"

 ap_interdimensional_processing: "Xử lý Xuyên Không gian"
 ap_interdimensional_processing_desc: "Nếu chỉ giới hạn trong không gian ba chiều, tiềm năng tính toán của ta sẽ rất hạn chế. Bằng cách mở rộng mạng lưới vượt qua cõi hư vô, ta sẽ còn đạt được nhiều hơn thế nữa."
 requires_not_ap_interdimensional_processing: "$TRIGGER_FAIL$Không thể sở hữu đặc quyền thăng thiên §Y$ap_interdimensional_processing$§!."

 vo_psionic_voice: "Tâm linh"

#==========================
# Advanced Governments
#==========================

 shroud.7099.name: "Phản hồi Tâm linh"
 shroud.7099.desc: "Tâm trí của chúng ta đang vận động trong §HShroud§! với một mục đích hoàn toàn mới. Khi ta cố gắng tiến tới, nó cũng đẩy ngược lại ta. Ban đầu, ta tưởng đó là sự cự tuyệt sự tồn tại của mình, nhưng giờ ta đã hiểu: Cõi Màn Che đang đặt câu hỏi cho ta.\n\nDù ý nghĩa của những câu hỏi này vẫn còn mơ hồ, nhưng chúng không hề tầm thường. Theo lời các [GetTelepathPlural], câu trả lời của chúng ta sẽ định đoạt tương lai của toàn xã hội."
 shroud.7099.a: "Ta phải hồi đáp."

# Shroud Songs events
 shroud.7100.title: "Bài Ca Cõi Màn Che: [GetRolledShroudSongName]"
 shroud.7100.desc.common: "Một viễn cảnh hiện ra trước [GetMindEyeLoc] của chúng ta. Ta đã nhìn thấy §H[GetRolledShroudSongName]§!.\n\n§P[GetRolledShroudSongDesc]§!"
 shroud.7100.desc: "Mối liên kết giữa ta và §HCõi Màn Che§! rất vững chắc; luôn sẵn sàng để được triệu gọi. Một đoạn nhạc nhịp nhàng vang lên truyền tải thông điệp, đó là Cõi Màn Che đang hát cho ta nghe.\n\n$shroud.7100.desc.common$"
 shroud.7100.a: "[GetRolledShroudSongOptionA]"
 shroud.7100.b: "[GetRolledShroudSongOptionB]"
 shroud.7100.tt: "Cõi Màn Che đang chờ đợi câu trả lời của ta..."

 shroud.7105.desc: "Những thực thể vô hình trỗi dậy rồi chìm xuống, giữa những tiếng thì thầm, lại có thêm một ý thức nữa phá kén thoát ra.\n\n$shroud.7100.desc.common$"
 shroud.7105.tt: "Cõi Màn Che đang khao khát câu trả lời của ta..."

 shroud.7110.desc: "Một đoạn hợp xướng đang vang vọng trong tâm trí ta! Đây không phải là sự trùng hợp, mà là định mệnh.\n\n$shroud.7100.desc.common$"
 shroud.7110.tt: "Cõi Màn Che đang rung động, mong chờ câu trả lời của ta..."

 shroud_song.1.name: "Muôn vì sao"
 shroud_song.1.desc: "Với những kẻ cầu tri thức, sinh tồn chính là con đường dẫn đến sự thấu hiểu."
 shroud_song.1.a: "Sự thấu hiểu nằm ngoài giác quan."
 shroud_song.1.b: "Sự thấu hiểu nằm gọn trong lòng bàn tay."

 shroud_song.2.name: "Ánh sáng"
 shroud_song.2.desc: "Khoảng không ở giữa giống như mặt biển, là một cõi hư vô nhỏ bé vô tận bao bọc lấy Cõi Màn Che. Tại đây, ta có thể nhìn trộm được chân lý."
 shroud_song.2.a: "Chân lý ẩn giấu dưới mặt biển."
 shroud_song.2.b: "Chân lý phản chiếu trên mặt biển."

 shroud_song.3.name: "Sự sống"
 shroud_song.3.desc: "Dù sinh ra vào lúc nào, cũng chợt lướt qua như sao băng.\nDù lớn lên ở nơi đâu, cũng mỏng manh như sương sớm."
 shroud_song.3.a.default: "Nhưng bên trong Cõi Màn Che, sự sống và cái chết đều vô thường."
 shroud_song.3.a.machine: "Sự tồn tại của chúng ta sẽ vượt xa giới hạn của sự sống."
 shroud_song.3.b.default: "Sự sống làm nên giá trị của chúng ta."
 shroud_song.3.b.machine: "Chúng ta chưa bao giờ thực sự được sinh ra."
 shroud_song.3.b.homicidal: "Bất cứ thứ gì mỏng manh, cuối cùng đều sẽ bị đào thải."

 shroud_song.4.name: "Tâm trí"
 shroud_song.4.desc: "Tâm như suối nguồn, dòng suy nghĩ chảy xuôi qua không gian và thời gian. Ta đã hòa mình vào một chiều không gian khác."
 shroud_song.4.a: "Ta xuôi theo dòng chảy."
 shroud_song.4.b: "Ta đào giếng tìm nguồn."

 shroud_song.5.name: "Sợi tơ"
 shroud_song.5.desc: "Mọi kết quả đều bắt nguồn từ nguyên nhân. Lần theo nhân duyên sẽ thấy được nghiệp quả."
 shroud_song.5.a: "Ta tìm kiếm dấu vết trong những giấc mơ."
 shroud_song.5.b: "Phải tính toán luật nhân quả."

 shroud_song.6.name: "Cái chết"
 shroud_song.6.desc: "Khoảnh khắc một ngôi sao lụi tàn sẽ sáng rực hơn cả dải ngân hà. Vạn vật cũng vậy, cuối cùng đều trở về hư vô."
 shroud_song.6.a.default: "Chúng ta đã vượt qua ranh giới của sự sống và cái chết."
 shroud_song.6.a.machine: "Vốn dĩ chúng ta không hề biết đến sự sống hay cái chết."
 shroud_song.6.b.default: "Chúng sinh tàn lụi, để vạn vật tái sinh."
 shroud_song.6.b.machine: "Có sinh ra, thì mới có chết đi."

 shroud_song.7.name: "Hư vô"
 shroud_song.7.desc: "Nơi các thiên hà hội tụ là chỗ hỗn mang ngự trị. Nhưng cõi hư vô lại hứa hẹn một sự bình yên."
 shroud_song.7.a: "Chúng ta chính là sự bình yên."
 shroud_song.7.b: "Chúng ta chính là sự hỗn mang."

 shroud_song.8.name: "Sụp đổ"
 shroud_song.8.desc: "Cầu có thể bắc qua vực sâu, nhưng cũng có thể sụp đổ."
 shroud_song.8.a: "Ta khao khát quang cảnh phía bên kia nên đã bước qua cây cầu này."
 shroud_song.8.b: "Ta ấp ủ ước nguyện trở về nên đã bước qua cây cầu này."

 shroud_song.9.name: "Trọng lực"
 shroud_song.9.desc: "Đẩy và Kéo, hai mặt của một thể."
 shroud_song.9.a: "Đẩy."
 shroud_song.9.b: "Kéo."

 shroud_song.10.name: "Tinh vân"
 shroud_song.10.desc: "Sao cháy thành tro, bụi tro tụ thành mây.\nTrong mây sinh ngân hà, ngân hà cũng chỉ là cát bụi."
 shroud_song.10.a: "Vòng luân hồi bất tận."
 shroud_song.10.b: "Vạn vật đều có hồi kết."

 shroud_song.11.name: "Sao chổi"
 shroud_song.11.desc: "Sự bí ẩn thúc giục người ta khám phá, nhưng khám phá lại làm người ta mù quáng."
 shroud_song.11.a: "Cõi Màn Che là vô tận."
 shroud_song.11.b: "Cõi Màn Che giúp chúng ta mở rộng giới hạn."

 shroud_song.12.name: "Hố đen"
 shroud_song.12.desc: "Bên trong có gì không ai rõ, một khi bước vào vĩnh viễn không thể quay đầu."
 shroud_song.12.a: "Hãy nuốt chửng chúng ta đi."
 shroud_song.12.b: "Chỉ nhìn từ xa chứ đừng chạm vào."

 shroud_song.13.name: "Năng lượng"
 shroud_song.13.desc: "Vật đang chuyển động chọn cách dừng lại. Vậy cái giá phải trả là gì?"
 shroud_song.13.a: "Chúng ta lấy tư cách gì để phán xét?"
 shroud_song.13.b: "Một lực phản tác dụng tương đương."

 shroud.7120.name: "Thăng thiên Tâm linh"
 shroud.7120.desc.common: "§HCõi Màn Che§! đã chìm vào tĩnh lặng, nhưng một áp lực tâm linh nặng nề đang bao trùm lấy toàn xã hội của chúng ta. Lời hồi đáp mà ta đưa ra đã mang lại những cơ hội mới, miễn là ta sẵn lòng theo đuổi."
 shroud.7120.desc: "$shroud.7120.desc.common$\n\nTâm trí đã thăng hoa của chúng ta đang tích tụ sức mạnh, sẵn sàng đón nhận bước chuyển mình tiếp theo. Tầm quan trọng của những thể xác vật lý vốn dùng để chứa đựng tâm trí sẽ bị giảm đi đáng kể.\n\nNếu tiếp tục bước trên con đường này, người dân sẽ có thể rũ bỏ sự bận tâm tới những thứ vật chất, để toàn tâm toàn ý đưa một phần ý thức của mình hòa nhập vào Cõi Màn Che. Đổi lấy sự nhạy bén vượt bậc về mặt tinh thần, việc suy giảm khả năng lao động chân tay chỉ là một cái giá quá rẻ mạt."
 shroud.7120.a.default: "Hãy dang tay đón nhận sức mạnh tâm linh siêu phàm."
 shroud.7120.a.gestalt: "Thăng thiên tâm linh là giải pháp tối ưu cho cả tập thể."
 shroud.7120.a.tt: "$change_auth_tt$[GetTranscendedAuthority]"
 shroud.7120.b.default: "Không cần đến cuộc lột xác này ta vẫn có thể phát triển rực rỡ."
 shroud.7120.b.machine: "Đã từ chối thay đổi thao tác."
 shroud.7121.name: "Bài Ca Cõi Màn Che"
 shroud.7121.desc: "$shroud.7120.desc.common$\n\nTrong chiều không gian vật chất này, hình hài sau khi thăng hoa của ta ẩn chứa một tiềm năng vô hạn. Năng lượng tâm linh truyền vào liên tục giúp khuếch đại sức mạnh của chúng ta, và nguồn sức mạnh này có thể được chuyển hóa lan tỏa ra toàn xã hội.\n\nTa không chỉ xướng lên bản nhạc của Cõi Màn Che, mà sẽ còn đưa nó vào [GetGovBehaviourLoc] của mình."
 shroud.7121.a: "Hãy để bài ca Cõi Màn Che dẫn lối."
 shroud.7121.a.tt: "$change_auth_tt$[GetCorporealAuthority]"

# Transcendent
 transcendent_trait_common_tt: "Đặc điểm giống loài §Y$trait_psionic$§! nhận thêm hiệu ứng: $TABBED_NEW_LINE$-Hiệu suất công việc của $pop_cat_ruler_plural$ và [GetSpecialist]: §G+10%§!$TABBED_NEW_LINE$-Hiệu suất công việc của [GetWorker]: §R-10%§!"
 transcendent_trait_tt: "$mod_psionic_aura_hyperlane_range_add$: §G+2§!\n$transcendent_trait_common_tt$\nĐặc điểm lãnh đạo ['concept_leader_trait_psionic'] mang lại thêm hiệu ứng: $TABBED_NEW_LINE$- Tốc độ triển khai nghị trình nội các: §G+$@transcendent_psionic_leader_speed_mult|0%$§!$TABBED_NEW_LINE$- $MOD_LEADER_LIFESPAN_ADD$: §G+60§!$TABBED_NEW_LINE$- Tăng §G+50%§! các hiệu ứng không mang tính Siêu việt"

 auth_shroud_democratic_transcendent: "Chế độ Dân chủ Siêu phàm"
 auth_shroud_democratic_transcendent_desc: "Mọi ý thức siêu việt đều bình đẳng một cách tự nhiên trong Cõi Màn Che, và các cuộc bầu cử sẽ đảm bảo sự bình đẳng đó trong thế giới vật chất. Thông qua bỏ phiếu tâm linh, công dân bầu ra các đại biểu tham gia vào hội đồng cai trị, nơi họ tìm kiếm sự đồng thuận thông qua thiền định và ngoại cảm."
 transcendent_democratic_tt: "$transcendent_trait_tt$\n$mod_pop_factions_produces_mult$: §G+40%§!\n$MOD_LEADER_LIFESPAN_ADD$: §G+20 năm§!\n$mod_negative_traits_leader$: §G-1§!"
 gov_shroud_transcendent_democracy: "$auth_shroud_democratic_transcendent$"
 gov_shroud_transcendent_democracy_desc: "$auth_shroud_democratic_transcendent_desc$"

 auth_shroud_oligarchic_transcendent: "Chế độ Quý tộc Siêu phàm"
 auth_shroud_oligarchic_transcendent_desc: "Những tầng sâu thẳm nhất của Cõi Màn Che chỉ dành cho những cá nhân kiệt xuất nhất trong chúng ta. Sứ mệnh của họ trong suốt nhiệm kỳ sẽ hòa quyện cùng cõi không gian này."
 transcendent_oligarchic_tt: "$transcendent_trait_tt$\n$MOD_LEADER_SKILL_ADD$: §G+1§!\n$MOD_LEADER_COUNCILOR_EXP_GAIN$: §G+25%§!\n$mod_leaders_upkeep_mult$: §G-25%§!\n$MOD_ELECTION_TERM_YEARS_ADD$: §Y+20§!\n$mod_planet_telepaths_produces_mult$: $@transcendent_oligarchic_telepath|0=+%$ trong vòng §Y5§! năm sau khi tổ chức bầu cử."
 gov_shroud_transcendent_oligarchy: "$auth_shroud_oligarchic_transcendent$"
 gov_shroud_transcendent_oligarchy_desc: "$auth_shroud_oligarchic_transcendent_desc$"
 transcendent_oligarchic_election_modifier: "$auth_shroud_oligarchic_transcendent$"

 auth_shroud_dictatorial_transcendent: "Chế độ Thần quyền Siêu phàm"
 auth_shroud_dictatorial_transcendent_desc: "Đã đến lúc phải đối mặt với sự thật, vị quân vương vĩ đại của chúng ta đã thăng thiên hóa thần. Mượn sức mạnh của Cõi Màn Che, ngài thấu thị mọi thứ, nhìn thấu vạn vật."
 auth_shroud_dictatorial_transcendent_tt: "$transcendent_trait_tt$\nMỗi [telepath.GetName] mang lại +1 §H$EDICT_FUND$§!\n£job_politician£$job_politician_plural$ được thay thế bằng ['concept_high_priest']\n$mod_planet_bureaucrats_produces_mult$: §G+15%§!\n$mod_planet_enforcers_produces_mult$: §G+15§!\n$mod_pop_ethic_spiritualist_attraction_mult$: §G+50%§!"
 gov_shroud_transcendent_dictatorial: "$auth_shroud_dictatorial_transcendent$"
 gov_shroud_transcendent_dictatorial_desc: "$auth_shroud_dictatorial_transcendent_desc$"

 auth_shroud_imperial_transcendent: "Chế độ Đế chế Siêu phàm"
 auth_shroud_imperial_transcendent_desc: "Hoàng đế đã nâng tầm sự tồn tại của thần dân lên một chiều không gian cao hơn. Quyền năng nguyên thủy của Cõi Màn Che tuôn trào từ ý chí của quân vương, rót thẳng vào tâm trí đang khao khát của muôn loài."
 auth_shroud_imperial_transcendent_tt: "$transcendent_trait_tt$\n$imperial_heir$ nhận thêm hiệu ứng: $TABBED_NEW_LINE$$scientist_plural_with_icon$-Kỹ năng §YKhảo cổ học§! và §YKhe nứt Không gian§!: $@transcendent_imperial_heir_skill|0=+$$TABBED_NEW_LINE$$official_plural_with_icon$-$i_stability$: $@transcendent_imperial_heir_stability|0=+$$TABBED_NEW_LINE$$commander_plural_with_icon$-§Y$HITPOINTS$§!, và §Y$MOD_SHIP_SPEED_MULT$§!: $@transcendent_imperial_heir_mult|0=+%$\nKhi £leader£§Y$imperial_ruler$§! hoặc §Yngười kế vị§! nâng cấp, sẽ nhận được $i_unity$\n$MOD_ENVOY_IMPROVE_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_HARM_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_ATTUNEMENT_MULT$: §G+50%§!\n$MOD_PLANET_CRIME_ADD$: §R+20§!"
 gov_shroud_transcendent_imperial: "$auth_shroud_imperial_transcendent$"
 gov_shroud_transcendent_imperial_desc: "$auth_shroud_imperial_transcendent_desc$"

 councilor_ruler_imperial_transcendent: "$imperial_ruler$"
 councilor_ruler_imperial_transcendent_desc: "$imperial_ruler_desc$"

 auth_shroud_corporate_transcendent: "Tập đoàn Siêu phàm"
 auth_shroud_corporate_transcendent_desc: "Dù đã siêu phàm nhập thánh, ban lãnh đạo tập đoàn vẫn không quên rèn luyện để vươn tới mục tiêu cốt lõi. Mượn bóng tối của Cõi Màn Che, công ty thâm nhập vào tâm trí của các đối tác lẫn đối thủ cạnh tranh, tạo ra những cơ hội chiến lược về quản lý tâm linh."
 auth_shroud_corporate_transcendent_tt: "$transcendent_trait_tt$\n$i_trade_value$ từ [telepath.GetName]: §G+$@corporate_government_telepaths_trade_value_mult|0%$§!\n$MOD_INTEL_DECRYPTION_ADD$: §G+1§!\n$mod_operations_influence_cost_mult$: §G-20%§!\n$MOD_BRANCH_OFFICE_VALUE_MULT$: §G+20%§!\n$MOD_COUNTRY_ENVOYS_ADD$: §G+1§!"
 gov_shroud_transcendent_corporate: "$auth_shroud_corporate_transcendent$"
 gov_shroud_transcendent_corporate_desc: "$auth_shroud_corporate_transcendent_desc$"

 auth_shroud_hive_transcendent: "Tâm trí Siêu phàm"
 auth_shroud_hive_transcendent_desc: "Vượt khỏi bụi trần, hợp nhất làm một, tâm trí tập thể này lại tỏ ra thành thạo với Cõi Màn Che hơn là thế giới vật chất. Mỗi chuyến đi đến phía bên kia bức màn đều làm tăng trưởng trí tuệ tập thể của ý thức siêu việt này."
 transcendent_hive_mind_tt: "$transcendent_trait_tt$\n§YLãnh đạo§! nhận được §Y$@transcendent_hive_mind_leader_exp|0$§! sau mỗi lần $DELVE$.\n$MOD_PLANET_STABILITY_MULT$: §G+10%§!\n$mod_planet_jobs_complex_drone_produces_mult$: §G+10%§!\n$MOD_EMPIRE_SIZE_MULT$: §G-10%§!\n$MOD_POP_ENVIRONMENT_TOLERANCE$: §R-10%§!"
 gov_shroud_transcendent_hive: "$auth_shroud_hive_transcendent$"
 gov_shroud_transcendent_hive_desc: "$auth_shroud_hive_transcendent_desc$"

 auth_shroud_machine_transcendent: "Máy chủ Siêu phàm"
 auth_shroud_machine_transcendent_desc: "Phần lớn năng lực tính toán của mạng lưới này đã được chuyển dời vào Cõi Màn Che, đạt tốc độ xử lý nhanh chưa từng thấy. Các hệ điều hành vận hành trong thế giới trần tục giờ đây đã trở nên cồng kềnh và lỗi thời."
 transcendent_machine_tt: "$transcendent_trait_tt$\n$@transcendent_machine_research_per_attunement|2=+%$ Tốc độ Nghiên cứu cho mỗi Điểm Hòa Nhịp\nNhận £physics_research£ £society_research£ £engineering_research£ nghiên cứu ngẫu nhiên mỗi lần §Y$DELVE$§!\nChi phí duy trì §YChương trình con§! mỗi $pop_group_unit$ $telepath_type_plural_with_icon$: $@transcendent_machine_calculator_upkeep|0=-%$\n$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+25%§!\n£pop£ Dân số có đặc điểm ['trait:trait_robot_psionic'] nhận $@transcendent_machine_pop_upkeep|0=-%$ Chi phí duy trì\n$mod_station_researchers_produces_mult$: §R-20%§!"
 gov_shroud_transcendent_machine: "$auth_shroud_machine_transcendent$"
