 abomination_army: "Quái vật Biến dị"
 abomination_army_desc: "Một đội quân nô lệ từng phải trải qua những liệu pháp thử nghiệm khốc liệt nhằm nâng cao tính hung hãn và năng lực chiến đấu, gần như đã bị cải tạo thành các vũ khí sống. Mặc dù ngoan ngoãn phục tùng chủ nhân, chúng lại là những cỗ máy chém giết không gớm tay trên chiến trường."
 seq_abomination_army: "Quân đoàn $abomination_army$ thứ $ORD$"

 mindwarden_army: "Biệt kích Hộ Tâm"
 mindwarden_army_desc: "Các đơn vị đặc nhiệm này đã được huấn luyện bài bản về các chiến thuật và kỹ thuật chống tâm linh, biến chúng thành những đối thủ đáng gờm chuyên đối phó với những kẻ xâm nhập tâm trí."
