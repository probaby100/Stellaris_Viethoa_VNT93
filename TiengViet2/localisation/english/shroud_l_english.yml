 shroud.4970.title: "Hồi kết đã điểm"
 shroud.4970.desc.1: "Bức màn ngăn cách giữa các chiều không gian thoáng chốc tan biến, toàn bộ năng lượng tâm linh của Cõi Màn Che bất ngờ bị tống tràn vào hiện thực hữu hình."
 shroud.4970.desc.2: "Mọi sinh linh có nhận thức, từ thực thể sinh học cho đến các cỗ máy, đều bị xóa sổ không còn vết tích. Tất cả hành tinh đều hóa thành những vỏ bọc hoang tàn, trơ trọi. Ngay cả các vì sao cũng lụi tắt tia sáng cuối cùng.\n\nDẫu vậy, vào giây phút sau chót, tất cả những gì chúng ta có thể cảm nhận được chỉ là một tiếng vọng bên trong tâm trí...\n\n§R“Đây là điểm tận cùng của muôn vật.”§!"
 shroud.4970.desc: "$end_of_the_cycle_color_article_cap$ đã giáng lâm.\n\n$end_aura$ nuốt chửng cả dải ngân hà. Cùng với sự sụp đổ của hệ sao cuối cùng, một làn sóng năng lượng khổng lồ không thể đo đếm bùng nổ dữ dội. $shroud.4970.desc.1$\n\n$shroud.4970.desc.2$"
 shroud.4970.a: "Hoàn hảo."
 shroud.4970.a.tooltip.destroyed: "§YNgân hà đã bị hủy diệt.§!"
 shroud.4970.a.tooltip: "Chúng ta đã chấm dứt luân hồi.\n\n$shroud.4970.a.tooltip.destroyed$"

