 night_terrors_gestalt_desc: "$night_terrors_desc$"

 shroud_portal: "Cánh Cổng Cõi Màn Che"
 shroud_portal_desc: "Những nỗ lực chọc thủng Cõi Màn Che đã dẫn đến các cuộc tấn công của động vật hoang dã địa phương. Đây cũng chỉ là cái giá phải trả trên con đường thúc đẩy sức mạnh tâm linh."

 shroud_portal_gestalt: "$shroud_portal$"
 shroud_portal_gestalt_desc: "$shroud_portal_desc$"

 mindwarden_enclave_capacity: "Sức chứa $gov_mindwarden_enclave$"
 mindwarden_enclave_capacity_desc: "Bằng cách nâng cao khả năng thiết lập thêm các $ENCLAVE_MINDWARDEN_PLURAL$ tự do, chúng ta có thể đẩy nhanh tiến trình thanh trừng tận gốc mầm mống tâm linh trên toàn thiên hà."

 mindwarden_logistics: "Hậu Cần Tâm Linh"
 mindwarden_logistics_desc: "Nhờ có sự chi viện hậu cần của Vệ Binh Tâm Linh, hạm đội của chúng ta đã tác chiến trơn tru hơn hẳn."

 survivors_of_the_end_modifier: "Người Sống Sót Thời Khắc Tận Cùng"
 survivors_of_the_end_modifier_desc: "Dù chịu tổn thất bi thảm, chúng ta vẫn sống sót vượt qua một $PSIONIC_AURA$ mang tính hủy diệt."

