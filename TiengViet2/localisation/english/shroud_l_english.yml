 gov_shroud_corporeal_dictatorial_desc: "$auth_shroud_dictatorial_corporeal_desc$"

 auth_shroud_imperial_corporeal: "Chế độ Đế chế Định mệnh"
 auth_shroud_imperial_corporeal_desc: "Huyết mạch hoàng gia chính là cầu nối dẫn lưu sức sống của Cõi Màn Che. Nhờ sự tự nguyện hiến dâng của thần dân, nguồn sức mạnh này được chuyển hướng để cường hóa thể xác của vị hoàng đế và người kế vị của ngài."
 auth_shroud_imperial_corporeal_tt: "$corporeal_trait_tt$\n§Y$imperial_heir$§! nhận $@corporeal_imperial_heir_xp|0+$ §YXP§! mỗi khi kế vị\n$psionic_aura_produced_per_pop_group_unit$ $telepath_type_plural_with_icon$: $@corporeal_imperial_telepath_effectiveness|0=+%$\n$MOD_ENVOY_IMPROVE_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_HARM_RELATIONS_MULT$: §G+50%§!\n$MOD_ENVOY_ATTUNEMENT_MULT$: §G+50%§!\n$MOD_RULER_SKILL_ADD$: §G+2§!\n$MOD_COUNCILOR_SKILL_ADD$: §G+1§!\n$MOD_LEADER_LIFESPAN_ADD$: §G+10 Năm§!\n$mod_psionic_pop_bonus_workforce_mult$: §R-20%§!\n$MOD_LOGISTIC_GROWTH_MULT$: §R-5%§!\n$MOD_PLANET_POP_ASSEMBLY_MULT$: §R-5%§!"
 gov_shroud_corporeal_imperial: "$auth_shroud_imperial_corporeal$"
 gov_shroud_corporeal_imperial_desc: "$auth_shroud_imperial_corporeal_desc$"

 auth_shroud_corporate_corporeal: "Hội đồng Quản trị Tâm linh"
 auth_shroud_corporate_corporeal_desc: "Thật ngu ngốc nếu lãng phí lợi thế trí tuệ mà Cõi Màn Che ban tặng. Tập đoàn này cực kỳ nổi tiếng với việc xây dựng các $building_psionic_offices$ tại những nền văn minh lân cận, nhằm tối đa hóa lợi nhuận trong giao thương liên vì sao."
 auth_shroud_corporate_corporeal_tt: "$corporeal_trait_tt$\n$trade_produced_per_pop_group_unit$ $telepath_type_plural_with_icon$: §G+$@corporate_government_telepaths_trade_value_mult|0%$§!\n$MOD_PSIONIC_AURA_EFFECTIVENESS_MULT$ từ ['building:building_psionic_offices']: §G+2%§!\n$mod_planet_branch_offices_influence_cost_mult$: §G-40%§!\n$mod_council_agenda_early_activation_cost_mult$: §G-25%§!\n$MOD_COUNCIL_AGENDA_COOLDOWN_MULT$: §G-25%§!\n$MOD_LEADER_SPECIES_EXP_GAIN$: §G+25%§!"
 gov_shroud_corporeal_corporate: "$auth_shroud_corporate_corporeal$"
 gov_shroud_corporeal_corporate_desc: "$auth_shroud_corporate_corporeal_desc$"

 auth_shroud_hive_corporeal: "Trung tâm Tâm linh"
 auth_shroud_hive_corporeal_desc: "Khả năng hòa hợp với Cõi Màn Che của họ mạnh mẽ đến mức có thể tạo ra sự cộng hưởng ngay bên trong hình hài vật lý của tập thể này."
 corporeal_hive_mind_tt: "$corporeal_trait_tt$\nMỗi điểm hòa nhịp giúp $@corporeal_hive_mind_job_upkeep_per_attunement|2=-%$ $mod_planet_jobs_upkeep_mult$\n$MOD_PLANET_STABILITY_MULT$: §G+10%§!\n$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: §G+30%§!\n$MOD_COUNCIL_AGENDA_FINISHING_EFFECT_DURATION_MULT$: §G+30%§!"
 gov_shroud_corporeal_hive: "$auth_shroud_hive_corporeal$"
 gov_shroud_corporeal_hive_desc: "$auth_shroud_hive_corporeal_desc$"
 corporeal_hive_mind_upkeep_modifier: "$auth_shroud_hive_corporeal$"

 auth_shroud_machine_corporeal: "Mạng lưới Tâm linh"
 auth_shroud_machine_corporeal_desc: "Bằng cách đan xen mạng lưới của mình vào sâu trong những dòng chảy năng lượng mịt mờ của Cõi Màn Che, những cỗ máy này đã đạt được tốc độ truyền dữ liệu gần như tức thời. Mỗi một byte đều chứa đựng ý chí tâm linh mạnh mẽ, sự thiết lập này giúp chúng đủ sức thao túng cả không gian vật lý xung quanh."
