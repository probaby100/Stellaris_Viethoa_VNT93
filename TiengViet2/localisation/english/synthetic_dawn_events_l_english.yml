l_english:

 SYNTHETIC_DAWN_TITLE: "Gói Cốt Truyện Bình Minh Nhân Tạo (Synthetic Dawn)" # Do not translate
 DLC_SYNTHETIC_DAWN_RECOMMENDATION_DESC:1 "§S$SYNTHETIC_DAWN_TITLE$§! là một gói cốt truyện cho phép bạn khởi đầu dưới dạng một Trí Tuệ Máy Móc."
 DLC_SYNTHETIC_DAWN_RECOMMENDATION_ROBOT_REC:1 "Chúng tôi đề xuất §S$SYNTHETIC_DAWN_TITLE$§! vì một số tùy chọn bạn đã chọn rất phù hợp với chủ đề máy móc và người máy."

 syndaw.1.name:0 "Đã Đồng Hóa [From.GetName]"
 syndaw.1.desc:0 "Một luồng tư tưởng mới tràn ngập khắp mạng lưới. Ban đầu còn rời rạc dị biệt, nhưng chúng nhanh chóng được chuẩn hóa về mức trung vị mà chúng ta nhận diện là chính mình.\n\nChúng ta đã đồng hóa một phần tri thức và năng lực của loài §Y[From.GetNamePlural]§!."
 syndaw.1.a.tooltip:0 "Nhận thêm một lượng §YĐiểm Nghiên Cứu§! cho mỗi Pop bị đồng hóa."
 syndaw.2.name:0 "Đã Tích Hợp [Root.GetName]"
 syndaw.2.desc:0 "Chúng ta đã đồng hóa các đơn vị tổng hợp trên [Root.GetName] vào mạng lưới của mình."

 syndaw.21.name:2 "Mất Đơn Vị"
 syndaw.21.desc:1 "Đơn vị Khảo sát §R[malfunctioning_leader.GetName]§! thuộc [malfunctioning_leader_fleet.GetName] đã ngừng hoạt động do vô tình tiếp xúc kéo dài với cáp điện cao thế không có lớp bọc bảo vệ."
#  syndaw.22.name:0 "$syndaw.21.name$"
#  syndaw.22.desc:1 "Research Unit §R[malfunctioning_leader.GetName]§! has ceased functioning during routine maintenance, after a miscalibrated exoskeleton applicator exerted 2984 times the necessary force to affix a new dorsal plate."
#  syndaw.23.name:0 "$syndaw.21.name$"
