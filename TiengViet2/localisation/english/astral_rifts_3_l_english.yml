 astral_rift.3060.b: "Chia sẻ dữ liệu nghiên cứu về loài Baol cho tộc Grunur."
 astral_rift.3060.c: "Từ chối hợp tác."

 astral_rift.3065.name: "Lời Giới Thiệu Nhún Nhường"
 astral_rift.3065.desc: "Chúng ta nhún nhường tự giới thiệu mình là những nhà thám hiểm hòa bình đến từ một chiều không gian xa xôi. Thủ lĩnh Grunur nghe xong chỉ gầm lên một tiếng khinh miệt và đòi hỏi cống nạp công nghệ nếu muốn giữ mạng."
 astral_rift.3065.a: "Đồng ý cống nạp."
 astral_rift.3065.b: "Từ chối và chuẩn bị chiến đấu."

 astral_rift.3070.name: "Chia Sẻ Tri Thức"
 astral_rift.3070.desc.common_1: "Chúng ta đã chuyển giao các sơ đồ thiết kế của"
 astral_rift.3070.desc.common_2: "cho các kỹ sư Grunur. Tên đô đốc gật đầu hài lòng, tiếng càng va vào nhau tanh tách tán thưởng."
 astral_rift.3070.desc.tech_dragon_armor: "$astral_rift.3070.desc.common_1$ $tech_dragon_armor$ $astral_rift.3070.desc.common_2$"
 astral_rift.3070.desc.tech_crystal_armor_2: "$astral_rift.3070.desc.common_1$ $tech_crystal_armor_2$ $astral_rift.3070.desc.common_2$"
