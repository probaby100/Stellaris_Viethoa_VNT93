 astral_rift.3070.desc.tech_swarm_strike_craft_1: "$astral_rift.3070.desc.common_1$ $tech_swarm_strike_craft_1$ $astral_rift.3070.desc.common_2$"
 astral_rift.3070.desc.tech_precognition_interface: "$astral_rift.3070.desc.common_1$ $tech_precognition_interface$ $astral_rift.3070.desc.common_2$"
 astral_rift.3070.desc.tech_psi_jump_drive_1: "$astral_rift.3070.desc.common_1$ $tech_psi_jump_drive_1$ $astral_rift.3070.desc.common_2$"
 astral_rift.3070.desc.tech_psionic_barrier: "$astral_rift.3070.desc.common_1$ $tech_psionic_barrier$ $astral_rift.3070.desc.common_2$"
 astral_rift.3070.desc.tech_psionic_shield: "$astral_rift.3070.desc.common_1$ $tech_psionic_shield$ $astral_rift.3070.desc.common_2$"
 astral_rift.3070.a: "Một cuộc trao đổi xứng đáng."

 astral_rift.3075.name: "Chứng Kiến Diệt Tuyệt"
 astral_rift.3075.desc: "Tộc Grunur đánh giá cao những gì chúng ta có thể chia sẻ về loài Baol. Do giống loài của họ không quan tâm đến gián điệp và các phương thức chiến tranh gián tiếp khác, thông tin của chúng ta chắc chắn sẽ giúp họ hoàn thiện chiến lược trong cuộc diệt chủng sắp tới.\n\nMặc dù vậy, viên đô đốc của họ vẫn giữ sự cảnh giác:\n\n§E\"BIẾT LÀ TỐT, NHƯNG TẬN MẮT THẤY THÌ TỐT HƠN. HÃY CHỨNG KIẾN CUỘC DIỆT CHỦNG, RỒI HỌC HỎI THÊM.\"§!"
 astral_rift.3075.a: "Theo dõi cuộc diệt chủng."
 astral_rift.3075.b: "Từ chối."

 astral_rift.3076.name: "Giữ Vững Lập Trường"
 astral_rift.3076.desc: "Đó là một nước cờ mạo hiểm, nhưng sự dũng cảm của chúng ta đã được đền đáp. Viên tướng Grunur đặc biệt ấn tượng trước những câu chuyện của chúng ta về việc luồn lách giữa các vũ trụ thông qua Khối Cầu Khe Nứt. Có vẻ như những màn phô diễn lòng dũng cảm và năng lực như vậy là điều điển hình đối với tộc Grunur. Đối với họ, một cuộc trò chuyện luôn có kẻ thắng và người thua - và cuộc đối thoại này rõ ràng đã ghi điểm cho chúng ta. Chúng ta thậm chí còn chứng kiến một vài chiếc càng va vào nhau tanh tách tán thành.\n\nCuối cùng, viên thủ lĩnh đứng dậy khỏi bàn điều khiển với một loạt tiếng kêu trầm đục.\n\n§E\"DŨNG CẢM LÀ TỐT, NHƯNG HÀNH ĐỘNG MỚI LÀ NHẤT. HÃY GIÀNH LẤY SỰ TÔN TRỌNG.\"§!\n\nMột trục tinh thể trồi lên trước mặt chúng ta, tương tự như những trục dựng quanh bảng điều khiển chỉ huy.\n\n§E\"LỆNH PHÓNG BẮT ĐẦU. ĐANG CHỜ MỆNH LỆNH.\"§!"
 astral_rift.3076.a: "Nhấn vào tinh thể. Ra lệnh khai hỏa."
 astral_rift.3076.b: "$astral_rift.3075.b$"

 astral_rift.3080.name: "Hình Phạt"
 astral_rift.3080.desc.default: "Tộc Grunur đơn giản là không hứng thú với việc lắng nghe lý lẽ.\n\nViên đô đốc đứng dậy khỏi thiết bị đầu cuối với một loạt tiếng kêu khàn đặc, được nhấn nhá bằng những cú búng càng sắc nhọn.\n\n§E\"BẢN ÁN ĐÃ ĐỊNH. HÌNH PHẠT ĐANG CHỜ.\"§!\n\nChúng ta bị giải vào một phòng giam. Dựa trên 'tiếng cười' của những tên lính canh, số phận của chúng ta khó lòng tốt đẹp. Thiết bị của chúng ta đang bị tịch thu. Đây sẽ là bản truyền tin cuối cùng của chúng ta."
 astral_rift.3080.desc.organic: "$astral_rift.3080.desc.default$\n\nXin gửi những lời chúc tốt đẹp nhất đến gia đình chúng tôi."
 astral_rift.3080.a: "Hãy kiên cường. Chúng tôi sẽ tìm cách cứu các bạn."

 astral_rift.3085.name: "Giao Diện Vũ Khí Grunur"
 astral_rift.3085.desc.common_1: "Kho lưu trữ của tộc Grunur đã được phân tích đầy đủ.\n\nĐó là một tài liệu đầy ám ảnh khi đọc. Những chiến công quân sự của họ hoàn toàn mang tính tàn bạo bạo ngược."
 astral_rift.3085.desc.common_homicidal: "Chúng ta đánh giá cao sự thích thú của tộc Grunur trong việc tiêu diệt các giống loài hạ đẳng."
 astral_rift.3085.desc.common_2: "Tuy nhiên, chúng ta đã phát hiện ra một khía cạnh tiên tiến độc đáo trong thiết kế tàu vũ trụ của họ có thể cách mạng hóa các hệ thống vũ khí hiện tại của chúng ta. Dù được thiết kế cho đặc điểm sinh học của loài Grunur, chúng ta có thể điều chỉnh giao diện này để cải thiện độ chính xác ngắm bắn của mình."
 astral_rift.3085.desc.common_militarist: "Giao diện mới này sẽ mang lại cho chúng ta lợi thế quyết định trong chiến đấu và cho phép chúng ta áp đảo kẻ thù một cách triệt để hơn."
 astral_rift.3085.desc.pacifist: "$astral_rift.3085.desc.common_1$\n\n$astral_rift.3085.desc.common_2$\n\nDù chúng ta hy vọng nó sẽ không bao giờ cần phải dùng đến, nó sẽ hỗ trợ cho công cuộc tự vệ của chúng ta."
 astral_rift.3085.desc.homicidal: "$astral_rift.3085.desc.common_1$ $astral_rift.3085.desc.common_homicidal$\n\n$astral_rift.3085.desc.common_2$"
 astral_rift.3085.desc.militarist: "$astral_rift.3085.desc.common_1$\n\n$astral_rift.3085.desc.common_2$\n\n$astral_rift.3085.desc.common_militarist$"
 astral_rift.3085.desc.homicidal_militarist: "$astral_rift.3085.desc.common_1$ $astral_rift.3085.desc.common_homicidal$\n\n$astral_rift.3085.desc.common_2$\n\n$astral_rift.3085.desc.common_militarist$"
 astral_rift.3085.desc.default: "$astral_rift.3085.desc.common_1$\n\n$astral_rift.3085.desc.common_2$"

 astral_rift.3090.name: "Nhìn Thế Giới Bốc Cháy"
 astral_rift.3090.desc.common_1: "Chúng ta theo dõi khi quân Grunur bắt đầu cuộc bắn phá nhắm vào"
 astral_rift.3090.desc.common_2: "thuộc địa. Sự áp đảo vượt trội của hạm đội của họ đã nhanh chóng phá hủy các phòng tuyến yếu ớt của người Baol.\n\nKhi các lữ đoàn Grunur tràn xuống bề mặt hành tinh, tất cả đều chìm trong biển lửa. Các toán quân trang bị súng phun lửa thiêu rụi các sinh vật thực vật bản địa với hiệu suất tàn khốc.\n\nChiến thắng tất yếu làm dịu đi những tiếng kêu khàn đặc của viên đô đốc Grunur.\n\n§E\"THẤY RỒI. ĐỐT RỒI. ĐÃ HIỂU CHƯA?\"§!\n\nMột mẫu vũ khí lửa được sử dụng trong cuộc tấn công đã được mang ra cho chúng ta kiểm tra.\n\n§E\"THIÊU RỤI LÀ SẠCH SẼ. CẦM LẤY. HÃY TẠO RA NỖI SỢ HÃI.\"§!"
 astral_rift.3090.desc.baol: "$astral_rift.3090.desc.common_1$ Baol $astral_rift.3090.desc.common_2$"
 astral_rift.3090.desc.default: "$astral_rift.3090.desc.common_1$ $astral_rift.3090.desc.common_2$"
 astral_rift.3090.tt: "Hiện có thể huấn luyện Quân Đội Đột Kích mới: §H$flamestorm_troopers_army$§!"

 astral_rift.3095.name: "Kết Thúc Chuyến Thám Hiểm"
 astral_rift.3095.desc.gestalt: "Các nhà khoa học của chúng ta bên kia khe nứt trong hệ sao [solar_system.GetName] đang bị tộc Grunur giam giữ.\n\nCáp neo đã được thu hồi, và §Y$tech_rift_sphere$§! đã được đưa về. Việc tải xuống các nhật ký dữ liệu cuối cùng đang được tiến hành."
 astral_rift.3095.desc.default: "$astral_rift.3095.desc.gestalt$\n\nChúng ta chỉ có thể hy vọng rằng tộc Grunur sẽ rủ lòng thương xót với phi hành đoàn của Khối Cầu. Và ai mà biết được? Các khe nứt giữa các thế giới vẫn còn ít được hiểu rõ... Có lẽ, nếu may mắn, họ thậm chí có thể tìm được đường trở về."

 astral_rift.3099.name: "[Leader.GetName] Trở Về"
 astral_rift.3099.desc: "§Y[Leader.GetName]§! đã bất ngờ trở về sau thời gian bị giam giữ của [Leader.GetHisHer] bên trong hạm đội Grunur ở phía bên kia Khe Nứt Tinh Giới tại §Y[From.solar_system.GetName]§!. Bị mắc kẹt ở một khoảng thời gian giữa thời điểm này và thời điểm khác, tuổi tác của [Leader.GetHisHer] dường như không thể xác định được. Bị giam cầm làm nô lệ bởi tộc Grunur, [Leader.GetHeShe] đã trở nên rất am hiểu trong việc thiết kế các loại vũ khí mới phục vụ tác chiến liên sao."

####################
# Tropical Habitat #
####################
 formula_pink_armies: "Binh Đoàn Công Thức Hồng"
 opinion_formula_pink: "$formula_pink_armies$"
 formula_pink_opinion_modifier_tt: "Thêm bổ trợ ý kiến §Y$opinion_formula_pink$§! đối với mọi đế chế Không phải Máy móc, Không phải Sinh thể Đá và Không phải Sinh thể Độc hại."

 astral_rift_tropical_habitat: "Sinh Cảnh Nhiệt Đới"

 astral_rift.3100.name: "$astral_rift_tropical_habitat$"
 astral_rift.3100.desc: "Khối Cầu đã đưa chúng ta vào khí quyển của một thế giới nhiệt đới rực rỡ, được bao phủ bởi một lớp sương mù màu hồng nhạt. Cảm biến cho thấy thảm thực vật phát triển với mật độ dày đặc phi thường, nhưng kỳ lạ thay, không có bất kỳ tín hiệu công nghệ nào được phát hiện."
 astral_rift.3100.a: "Hạ cánh xuống bề mặt hành tinh."

 astral_rift.3105.name: "Hạ Cánh Gồ Ghề"
 astral_rift.3105.desc: "Cú hạ cánh diễn ra khá gập ghềnh khi lớp đất bên dưới dường như mềm xốp và ẩm ướt bất thường. Khi bước ra ngoài, bầu không khí ấm áp và tràn ngập hương thơm ngọt ngào của hoa cỏ nhiệt đới."
 astral_rift.3105.a: "Tiến hành khảo sát thực địa."
 astral_rift.3105.b: "Lấy mẫu khí hồng."

 astral_rift.3110.name: "Hệ Sinh Thái Động Vật Ăn Cỏ"
 astral_rift.3110.desc: "Các cuộc thám hiểm ban đầu cho thấy hành tinh này là nơi sinh sống của vô số loài động vật ăn cỏ to béo và cực kỳ thuần tính. Chúng lang thang gặm cỏ trong trạng thái thỏa mãn ngây ngô, dường như hoàn toàn không có bản năng sợ hãi hay phòng vệ trước kẻ săn mồi."
 astral_rift.3110.a: "Thu thập mẫu sinh vật."

 astral_rift.3111.name: "Khí Độc Gây Ảo Giác"
 astral_rift.3111.desc: "Loại khí màu hồng bao phủ hành tinh này đã chứng minh là có đặc tính gây ảo giác và làm tê liệt ý chí cực kỳ nguy hiểm. Ký ức về khoảng thời gian bên ngoài Khối Cầu của chúng ta trở nên mờ mịt. May mắn thay, các camera gắn trên bộ đồ bảo hộ đã giúp chúng ta chắp vá lại hành trình thám hiểm.\n\nChúng ta đã đi lang thang không mục đích qua những bình nguyên mờ ảo, cảm thấy mỗi bước chân đều là một phát hiện vĩ đại, ngấu nghiến những trái cây thơm ngon trong sự thỏa mãn tột cùng. Chất gây say trong không khí đã mang lại cảm giác thành công giả tạo, dù kết quả thu được chẳng có là bao.\n\nBộ lọc trên đồ bảo hộ không đủ để ngăn chặn chất khí này. Rất may, một số người trong chúng ta đã lảo đảo quay trở lại được nơi trú ẩn của §Y$tech_rift_sphere$§! và dần hồi phục nhận thức. Dù cảm giác như mới rời đi chốc lát, chúng ta đã lang thang ngoài kia suốt nhiều ngày ròng.\n\nKhông cần phải nói, chúng ta sẽ tăng cường thiết bị hô hấp cho phần còn lại của cuộc điều tra."
 astral_rift.3111.a: "Tìm kiếm nguồn gốc của loại khí này."

 astral_rift.3115.name: "Phân Tích Khí Quyển"
 astral_rift.3115.desc.common: "Chúng ta đã lấy mẫu lớp sương mù màu hồng lơ lửng trên bề mặt hành tinh và phân tích ở cấp độ phân tử.\n\nLoại khí này có tác dụng làm tê liệt tâm trí mạnh mẽ, khiến mọi dạng sống sinh học trở nên ngoan ngoãn và tự mãn. Dưới tác động của nó, một thực thể thông minh dễ bị tổn thương sẽ chỉ tìm cách thỏa mãn những nhu cầu cơ bản nhất, trong khi vẫn cảm thấy một cảm giác thành tựu to lớn.\n\nNgoài ra, các hợp chất trong không khí kích thích sự phát triển mỡ bằng cách tác động đến việc sản sinh hormone tự nhiên của những kẻ hít phải. Điều này làm tăng sự thèm ăn của sinh vật do khả năng kiểm soát phân phối dinh dưỡng và phản ứng tự miễn dịch bị suy yếu. Theo thời gian, kết quả sẽ là một vòng lặp củng cố vô tận của việc tiêu thụ quá mức. Chúng ta có thể xác nhận rằng loại khí này có nguồn gốc sinh học dựa trên các dấu vết enzym, nhưng chúng ta chưa thể định vị được sinh vật tạo ra nó."
 astral_rift.3115.desc.toxoid_or_lithoid: "$astral_rift.3115.desc.common$\n\nChất làm dịu này không gây ra bất kỳ rủi ro nào cho đặc điểm sinh học của chúng ta. Ngay cả một nồng độ cực kỳ đậm đặc cũng chỉ ảnh hưởng nhẹ đến chúng ta."
 astral_rift.3115.desc.mechanical: "$astral_rift.3115.desc.common$\n\nChất làm dịu này hoàn toàn không có tác dụng đối với các drone của chúng ta. Chúng ta có thể tự do khám phá sâu hơn trong sự an toàn."
 astral_rift.3115.desc.default: "$astral_rift.3115.desc.common$\n\nĐể tiếp tục thám hiểm sâu hơn, chúng ta sẽ cần trang bị đầy đủ thiết bị trợ thở độc lập để bảo vệ bản thân khỏi tình trạng nhiễm độc gây say."
 astral_rift.3115.a: "$astral_rift.3111.a$"
 astral_rift.3115.b: "Đeo thiết bị trợ thở và tiến lên."

 astral_rift.3120.name: "Vực Sâu Há Hốc"
 astral_rift.3120.desc: "Sử dụng cảm biến chất lượng không khí, chúng ta tìm kiếm những nơi có nồng độ khí độc tập trung cao nhất trên vùng đất trù phú. Vượt qua một bụi cây rậm rạp trĩu quả mọng, chúng ta được dẫn đến miệng của một khe nứt khổng lồ ở giữa bãi đất trống. Những đợt chướng khí màu hồng dày đặc phun ra từ đó theo những khoảng thời gian bất thường.\n\nChúng ta tin rằng loại khí này đang được tạo ra bởi một sinh vật dưới lòng đất ở đâu đó dưới đáy khe nứt này. Việc tìm thấy nó, tốt nhất là khi còn sống, có thể mang lại những cơ hội nghiên cứu độc nhất vô nhị."
 astral_rift.3120.a: "Thận trọng. Đào bới xung quanh miệng vực."
 astral_rift.3120.b: "Trực tiếp thám hiểm sâu vào miệng vực."

 astral_rift.3125.name: "Khai Quật Miệng Vực"
 astral_rift.3125.desc: "Chúng ta đã cải tiến thiết bị thu thập mẫu của §Y$tech_rift_sphere$§! thành một công cụ khai quật, và dùng nó để đào bới miệng vực. Sau khi cắt qua một lớp mùn vàng ẩm ướt dày đặc, chúng ta phát hiện một lớp đất mới. Có màu đất son, nó vỡ vụn thành các mảnh dạng vảy xếp lớp khi chúng ta đào, giải phóng những luồng khí hồng bị mắc kẹt khi có kích động cơ học nhỏ nhất.\n\nDù lớp đất này chứa nồng độ hợp chất hữu cơ cao, nó vẫn chưa đủ để trở thành nguồn phát chính.\n\nĐào sâu hơn nữa, công cụ thu hoạch đã đâm xuyên qua một lớp đất tối màu, đỏ thẫm hơn. Ngay lúc đó, mặt đất rung chuyển dữ dội. Những đám mây khí hồng dày đặc tuôn trào từ vết rạch chúng ta vừa tạo ra. Vùng đất tối tăm này sau đó chuyển động như thể nó là một sinh vật sống.\n\nCông cụ thu hoạch của chúng ta nhanh chóng bị lớp đất đỏ tươi nuốt chửng và nghiền nát thành sắt vụn. Bề mặt xung quanh rung chuyển với những cơn địa chấn ngày càng dữ dội, và chúng ta buộc phải rút lui lên thượng tầng khí quyển.\n\nChúng ta không còn được chào đón ở nơi này nữa."
 astral_rift.3125.a: "Nghiên cứu các mẫu đất thu được."

 astral_rift.3130.name: "Khám Phá Vực Sâu"
 astral_rift.3130.desc: "Chúng ta tiến vào khe vực với các thiết bị leo núi sơ khai để tìm kiếm sinh vật bên dưới. Khi tụt xuống sâu hơn, các bức tường khoáng hóa chuyển dần từ đất vàng ẩm sang lớp vảy màu hồng sẫm. Xuống sâu hơn nữa, tất cả biến thành màu đỏ thẫm đập thình thịch như mạch máu.\n\nNhững đợt phun trào khí hồng dày đặc bao phủ chúng ta trong suốt quá trình hạ độ cao. Xuống đến đáy, chúng ta phát hiện ra nguồn gốc của nó: một bức màn dạng màng căng ngang đường kính khe vực, treo lơ lửng một lỗ mở với chiếc miệng bằng chất sừng giống như mỏ chim ở trung tâm. Từ sinh vật này, một ống gân guốc dày ngoằn ngoèo đâm sâu hơn vào lòng đá.\n\nChúng ta đã tìm thấy sinh vật ăn thịt, và rất có thể nó chính là bản thân hành tinh này."
 astral_rift.3130.a: "Cắt lấy phần miệng sinh vật."
 astral_rift.3130.b: "Rút lui và nghiên cứu từ xa."

 astral_rift.3135.name: "Trích Xuất Mẫu Vật"
 astral_rift.3135-3140.desc.common: "Chúng ta đã cắt rời chiếc miệng khỏi ống trung tâm nhô ra từ khối đá đỏ thẫm và bắt đầu trèo lên."
 astral_rift.3135.desc.common.1: "$astral_rift.3135-3140.desc.common$\n\nCác bức tường của khe vực rung chuyển dữ dội để phản ứng và một luồng khí sinh học đậm đặc tràn ngập đường hầm. Chúng ta cảm thấy toàn bộ khoang hang rung chuyển, và lối thoát ngày càng thu hẹp lại khi chúng ta đến gần bề mặt. Nó - bất kể \"nó\" có thể là gì - đang cố gắng nuốt chửng chúng ta."
 astral_rift.3135.desc.common.2: "Chúng ta không còn được chào đón ở nơi này nữa."
 astral_rift.3135.desc.toxoid: "$astral_rift.3135.desc.common.1$\n\nTrong một bước ngoặt may mắn, các bức tường màu đỏ thẫm giống như da thịt đã co giật lùi xa theo phản xạ khi chạm vào cơ thể độc hại tự nhiên của chúng ta. Chúng ta đã thoát ra mà không hề hấn gì. Khi lên đến bề mặt, khe vực đã đóng kín lại, để lại một vết sẹo nhỏ trên khoảng đất trống. Mặt đất xung quanh chúng ta rung chuyển với những cơn địa chấn ngày càng dữ dội, thôi thúc chúng ta nhanh chóng quay trở lại thượng tầng khí quyển.\n\n$astral_rift.3135.desc.common.2$"
 astral_rift.3135.desc.default: "$astral_rift.3135.desc.common.1$\n\nChúng ta đã thoát khỏi khe vực ngay khi nó khép lại sau lưng, để lại một vết sẹo lõm ở vị trí cũ. Bề mặt xung quanh chúng ta rung chuyển với những cơn địa chấn ngày càng dữ dội, và chúng ta đã rút lui lên thượng tầng khí quyển.\n\n$astral_rift.3135.desc.common.2$"
 astral_rift.3135.a: "Bảo quản mẫu vật cẩn thận."

 astral_rift.3140.name: "Trích Xuất Gây Chấn Thương"
 astral_rift.3140.desc.common: "$astral_rift.3135-3140.desc.common$\n\nCác bức tường của khe vực rung chuyển dữ dội để phản ứng và một luồng khí sinh học đậm đặc tràn ngập đường hầm, che khuất mọi tầm nhìn. Chúng ta tranh nhau leo lên bề mặt, nhưng lối thoát cứ ngày càng thu hẹp lại xung quanh chúng ta.\n\nThật không may, [Leader.GetName] đã không kịp thoát ra hoàn toàn khỏi đường hầm trước khi nó khép lại. Phần thân dưới của họ đã bị các bức tường khe vực kẹp chặt và nghiền nát với lực địa chấn kinh hoàng."
 astral_rift.3140.desc.robot: "$astral_rift.3140.desc.common$\n\nMay mắn thay, tất cả các bộ phận đều có thể thay thế được."
 astral_rift.3140.desc.default: "$astral_rift.3140.desc.common$\n\nChúng ta đã thu hồi cơ thể bị tổn thương nặng nề của [Leader.GetName] và thoát trở lại thượng tầng khí quyển. [Leader.GetHeShe] đã phải chịu những vết thương không thể phục hồi, nhưng vẫn ổn định nhờ hệ thống duy trì sự sống."
 astral_rift.3140.a: "$astral_rift.3135.a$"

 astral_rift.3145.name: "Kỳ Quan Địa Chất"
 astral_rift.3145.desc: "Những phân tích về lớp đất thu được đã hé lộ một sự thật kinh ngạc: toàn bộ hành tinh là một siêu sinh thể cộng sinh khổng lồ. Lớp đất mặt màu vàng đóng vai trò cung cấp dinh dưỡng nuôi thảm thực vật tốt tươi, lớp vảy hồng tạo ra khí gây say để thuần hóa muông thú, và các khe vực chính là hệ tiêu hóa khổng lồ liên tục hấp thu những sinh vật bị thôi miên."

 astral_rift.3150.name: "$astral_rift.3145.name$"
 astral_rift.3150.desc: "Cẩn trọng để không làm kinh động sinh thể, chúng ta nhanh chóng thu thập mẫu của ba loại đất từ các bức tường rung động của khe vực và rời khỏi hành tinh mà không gặp thêm sự cố nào.\n\nChúng ta đã phân tích các mẫu thu thập được và xác nhận mối nghi ngờ của mình - bản thân hành tinh này là một thực thể sống.\n\nLớp đất mặt màu vàng chứa mật độ dinh dưỡng cực cao và được dùng để bón cho sự phát triển thực vật nhanh chóng. Lớp khoáng chất vảy hồng là phương tiện phân phối khí gây say hiệu quả trên toàn bộ bề mặt hành tinh. Cuối cùng, vật liệu màu đỏ thẫm đóng vai trò hiệu quả như hệ tuần hoàn của hành tinh, có khả năng tái phân phối khoáng chất và tài nguyên hữu cơ đến nơi cần thiết nhất.\n\nKhe vực chúng ta gặp phải chắc chắn là một đường tiêu hóa, và chúng ta thật may mắn khi không bị nuốt chửng.\n\nDẫu sao, chúng ta đã có thể áp dụng các đặc tính màu mỡ vượt trội của lớp đất mặt vào các phương pháp canh tác của riêng mình. Dạng sống độc đáo mà chúng ta gặp phải bên trong các bình diện tinh giới này sẽ còn được nghiên cứu trong nhiều năm tới."

 astral_rift.3155.name: "Phẫu Thuật Hành Tinh"
 astral_rift.3155.desc.common: "Sau các thí nghiệm sâu rộng với cơ quan tiêu hóa bị cắt rời, chúng ta đã hiểu sâu hơn về hệ sinh thái của hành tinh này. Trước hết, toàn bộ hành tinh đều là một thực thể sống - bao gồm cả đất đá và mọi thứ.\n\nBên trong đường tiêu hóa của chiếc miệng là các túi chứa đầy vật liệu sinh học cô đặc có thể bay hơi lên tầng khí quyển dưới. Khí này được thiết kế để vỗ béo các loài động vật sống trên bề mặt và ngăn chặn các loài săn mồi khác tiến hóa. Những con mồi say sưa sau đó sẽ bị hành tinh tiêu thụ qua các lỗ mở khổng lồ tương tự như chiếc miệng chúng ta đã gặp. Chiếc miệng mà chúng ta thu hồi được chỉ là một trong số hàng nghìn chiếc miệng rải rác khắp toàn cầu."
 astral_rift.3155.desc.robotic_or_pacifist: "$astral_rift.3155.desc.common$\n\nChúng ta đã học được cách tái tạo tổng hợp và biến đổi các đặc tính của khí hồng thành một ứng dụng thực tiễn để sử dụng như một pheromone cho các nhà ngoại giao của chúng ta. Dù ở nồng độ giảm đi rất nhiều, nó vẫn duy trì tác dụng xoa dịu mạnh mẽ đối với hầu hết các dạng sinh học tự nhiên."
 astral_rift.3155.desc.default: "$astral_rift.3155.desc.common$\n\nChúng ta đã học được cách tái tạo tổng hợp và biến đổi các đặc tính của khí hồng thành một ứng dụng thực tiễn như một loại thuốc giảm đau trên chiến trường. Chúng ta đã khuếch đại tác dụng gây mê của khí và loại bỏ chất ức chế tính hung hăng, nhờ đó những người lính bị thương sẽ có thể phớt lờ nỗi đau của vết thương và tiếp tục chiến đấu."
  astral_rift.3155.a: "Một sinh vật thật đáng kinh ngạc."

####################
# Psionic Stranger #
####################
 zroni_insight_modifier: "Tuệ Giác Zroni"
 zroni_insight_space_storm_reduction_modifier: "Biện Pháp Bảo Vệ Bão Từ Tuệ Giác Zroni"
 zroni_insight_space_storm_reduction_modifier_tt: "Biện pháp bảo vệ khỏi tác động tiêu cực của §IBão Không Gian§!: §G-50%§!"
 astral_rift_psionic_stranger: "Người Lạ Tâm Linh"

 astral_rift.3200.name: "Người Lạ Tâm Linh"
 astral_rift.3200.desc.common: "Chúng ta đã tiến vào bầu khí quyển của một thế giới đồi núi băng giá."
 astral_rift.3200.desc.common.non_robot: "Gần như ngay lập tức, chúng ta bị chấn động bởi một đợt thần giao cách cảm cực mạnh:\n\n§E\"Chào mừng những kẻ đã du hành từ phương xa tới. Từ chiều sâu của thiền định, ta đã cảm nhận được cuộc hành trình của các bạn qua các Bình Diện Tinh Giới. Hãy đến đây, chúng ta hãy gặp nhau. Có lẽ sự xuất hiện của các bạn chính là bước đột phá mà ta hằng chờ đợi.\"\n\n§!Một viễn cảnh về một hang động núi hẻo lánh đã hiện ra trước mắt chúng ta."
 astral_rift.3200.desc.common.psionic: "Dù kẻ này là ai, sức mạnh tâm linh của họ vượt xa bất kỳ điều gì chúng ta có thể làm được."
 astral_rift.3200.desc.common.robot: "Không lâu sau đó, các mạch điện của chúng ta bị rung chuyển bởi một tín hiệu truyền phát ngoại lai:\n\n§E\"Chào mừng những kẻ đã du hành từ phương xa tới. Từ chiều sâu của thiền định, ta đã cảm nhận được cuộc hành trình của các bạn qua các Bình Diện Tinh Giới. Hãy đến đây, chúng ta hãy gặp nhau. Có lẽ sự xuất hiện của các bạn chính là bước đột phá mà ta hằng chờ đợi.\"\n\n§!Một tập hợp tọa độ dẫn đến bờ bên kia của hành tinh đã được cung cấp."
 astral_rift.3200.desc.common.non_psionic: "Việc phát hiện ra sự hiện diện của chúng ta nhanh đến vậy và phát đi thông điệp từ khoảng cách xa như vậy ngụ ý rằng người lạ mặt bí ẩn này sở hữu năng lực tâm linh phi thường."
 astral_rift.3200.desc.robot_psionic: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.robot$\n\n$astral_rift.3200.desc.common.psionic$"
 astral_rift.3200.desc.robot: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.robot$\n\n$astral_rift.3200.desc.common.non_psionic$"
 astral_rift.3200.desc.psionic: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.non_robot$\n\n$astral_rift.3200.desc.common.psionic$"
 astral_rift.3200.desc.default: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.non_robot$\n\n$astral_rift.3200.desc.common.non_psionic$"
 astral_rift.3200.a: "Tìm kiếm sinh thể này."

 astral_rift.3205.name: "Kẻ Nhìn Xa"
 astral_rift.3205.desc.intro: "Chúng ta lần theo viễn cảnh đến một vị trí trên một trong những ngọn núi cao nhất của hành tinh.\n\nMột nhân vật đeo mặt nạ ngồi thiền trong một hang động cô lập. Mang làn da xám và vóc dáng dạng người, nàng được bao bọc trong một vầng hào quang màu tím phát ra năng lượng dao động nhẹ nhàng."
 astral_rift.3205.desc.outro: "§E\"Cảm ơn các bạn đã nhận lời mời của ta, chúng ta có rất nhiều điều để đàm đạo.\"\n\n\"Ta được gọi là Kẻ Nhìn Xa. Ta đã thiền định trên vùng đất hoang băng giá này suốt nhiều năm, chờ đợi một sự mặc khải. Không phải ngẫu nhiên mà các bạn lại xuất hiện ở đây.\"§!"
 astral_rift.3205.desc.common.completed_zroni: "Chúng ta nhận ra người ngoài hành tinh này là một cá thể Zroni. Hàng triệu năm trước, giống loài có thiên phú tâm linh này từng sống trong chính vũ trụ của chúng ta, trước khi một cuộc nội chiến dẫn đến sự tuyệt chủng hoàn toàn của loài họ. Có lẽ khe nứt này là cánh cửa dẫn đến một dòng thời gian song song nơi người Zroni vẫn chưa thăng hoa vào Cõi Tâm Linh."
 astral_rift.3205.desc.common.started_zroni: "Chúng ta nhận ra người ngoài hành tinh này là một cá thể Zroni, một thành viên của giống loài có thiên phú tâm linh từng sống trong vũ trụ của chúng ta hàng triệu năm trước. Có lẽ khe nứt này là cánh cửa dẫn đến một dòng thời gian song song nơi người Zroni vẫn còn tồn tại."
 astral_rift.3205.desc.common.not_started_zroni: "Những chiếc sừng phát sáng mọc ra từ đầu của người ngoài hành tinh, cùng các nhánh tương tự nhưng còi cọc hơn vươn ra từ lưng nàng. Chúng ta không quen thuộc với giống loài này, nhưng họ hẳn phải hòa hợp sâu sắc với các bước sóng tâm linh."
 astral_rift.3205.desc.common.gestalt: "Chúng ta nhận được một thông điệp khác:"
 astral_rift.3205.desc.common.default: "Người ngoài hành tinh lại cất tiếng nói bên trong tâm trí chúng ta:"
 astral_rift.3205.desc.gestalt_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.started_zroni$\n\n$astral_rift.3205.desc.common.gestalt$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.gestalt_completed_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.completed_zroni$\n\n$astral_rift.3205.desc.common.gestalt$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.gestalt_not_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.not_started_zroni$\n\n$astral_rift.3205.desc.common.gestalt$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.default_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.started_zroni$\n\n$astral_rift.3205.desc.common.default$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.default_completed_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.completed_zroni$\n\n$astral_rift.3205.desc.common.default$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.default_not_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.not_started_zroni$\n\n$astral_rift.3205.desc.common.default$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.a: "Hỏi về danh tính của nàng."

 astral_rift.3210.name: "Gánh Nặng Của Kẻ Nhìn Xa"
 astral_rift.3210.desc: "Kẻ Nhìn Xa giải thích rằng nàng thuộc về giống loài §YZroni§!, một nền văn minh cổ đại sở hữu tiềm năng tâm linh vô song. Đồng bào của nàng đang đứng trước ngưỡng cửa của cuộc Đại Thăng Hoa - bước vào Cõi Tâm Linh (The Shroud) để rũ bỏ thể xác phàm trần.\n\nTuy nhiên, trong những viễn cảnh thiền định của mình, nàng đã nhìn thấy trước những tai ương khủng khiếp mà việc bước vào Cõi Tâm Linh có thể gây ra cho toàn thể thiên hà: sự tha hóa của tâm trí, các thực thể tà ác thức tỉnh và sự diệt vong của chính dân tộc nàng.\n\nNàng cầu xin lời khuyên từ chúng ta - những lữ khách đến từ một chiều không gian khác."
 astral_rift.3210.a: "Kể cho nàng nghe về số phận của tộc Zroni trong vũ trụ của chúng ta."
 astral_rift.3210.b: "Đưa ra lời khuyên dựa trên triết lý của đế chế chúng ta."
 astral_rift.3210.c: "Chúng tôi chỉ có thể đưa ra góc nhìn của mình."
 astral_rift.3210.d: "Chúng tôi không có quyền can thiệp."
 astral_rift.3210.e: "Những mưu cầu tâm linh như vậy thật tầm thường."

 astral_rift.3215.name: "Điềm Báo Tận Diệt"
 astral_rift.3215.desc: "Chúng ta kể cho Kẻ Nhìn Xa nghe về thảm kịch lịch sử của tộc Zroni trong vũ trụ của chúng ta: cuộc nội chiến tàn khốc giữa phe Thần Tinh và phe Cứu Thế, sự sụp đổ của nền văn minh của họ và cách mà tro cốt tâm linh Zro của họ trở thành một thứ tài nguyên trôi nổi trong không gian.\n\nKẻ Nhìn Xa run rẩy trong nỗi kinh hoàng, những lời tiên tri đen tối nhất của nàng đã được xác nhận bởi một nhân chứng đến từ một thực tại khác."
 astral_rift.3215.a: "Khuyên nàng ngăn chặn việc xâm nhập Cõi Tâm Linh."
 astral_rift.3215.b: "Khuyên nàng chấp nhận số phận và tiếp tục thăng hoa."

 astral_rift.3220.name: "Định Mệnh Bất Biến"
 astral_rift.3220.desc: "Chúng ta giải thích cách thức người Zroni đã sử dụng Cõi Tâm Linh để thăng hoa lên một bình diện tồn tại cao hơn, vượt qua các nhu cầu vật chất và đắm mình trong một xã hội không tưởng gần như toàn năng. Cuộc thăng hoa này mang lại những thách thức lớn, nhưng theo quan điểm xã hội học và vật chất, đó là một thành tựu vĩ đại. Chúng ta lưu ý rằng các học giả của chúng ta vẫn chưa hoàn toàn hiểu được số phận cuối cùng của loài Zroni.\n\nKẻ Nhìn Xa đáp lời:\n\n§E\"Cứ như thể ở bất kỳ chiều không gian nào, loài Zroni cũng được định sẵn sẽ bước vào Cõi Tâm Linh; số phận này vượt qua các giới hạn của một dòng thời gian đơn lẻ. Có lẽ sự lựa chọn chưa bao giờ thuộc về chúng ta.\"§!"
 astral_rift.3220.a: "Khuyên can không nên can thiệp vào Cõi Tâm Linh."
 astral_rift.3220.b: "Khuyến khích Kẻ Nhìn Xa đột phá vào Cõi Tâm Linh."

 astral_rift.3225.name: "Quan Điểm Của Chúng Ta"
 astral_rift.3225.desc.gestalt: "Chúng ta giải thích rằng [Explorer.GetName] tồn tại như một ý thức tập thể thống nhất, và một quyết định có ý nghĩa trọng đại như vậy không nên để cho các lựa chọn cá nhân quyết định. Bất cứ điều gì mang lại lợi ích cho toàn bộ xã hội Zroni đều phải là quyết định đúng đắn, và sự khó chịu cá nhân không nên là một yếu tố can dự.\n\nKẻ Nhìn Xa đáp lời:\n\n§E\"Có lẽ thật khôn ngoan khi nhìn nhận tình thế tiến thoái lưỡng nan này từ góc độ tập thể hơn, giống như cách các bạn làm. Các bạn đề xuất chúng ta nên tiến hành như thế nào?\"§!"
 astral_rift.3225.desc.non_gestalt_spiritualist: "Chúng ta đã chia sẻ chi tiết về mối quan hệ của chính mình với thần thánh. Việc tìm kiếm sự giác ngộ là lý do tại sao chúng ta khám phá, để tìm ra ý nghĩa vượt ra ngoài bản thân và làm sâu sắc thêm mối liên kết của chúng ta với vũ trụ.\n\nKẻ Nhìn Xa đáp lời:\n\n§E\"Các bạn rất giống chúng ta ở khía cạnh đó. Người Zroni từ lâu đã khao khát vượt qua thế giới vật chất, vậy ta có quyền gì để từ chối sự thăng hoa của dân tộc mình? Là những người cùng tìm kiếm con đường, các bạn đề xuất chúng ta nên tiến hành như thế nào?\"§!"
 astral_rift.3225.desc.non_gestalt_materialist: "Chúng ta giải thích rằng chân lý khoa học khách quan là cách chúng ta định nghĩa vị trí của mình trong vũ trụ. Việc tìm kiếm tri thức đã đưa chúng ta đến những biên giới mới và xa hơn nữa. Nó thậm chí còn cho phép hai giống loài chúng ta gặp nhau từ khắp các chiều không gian.\n\nKẻ Nhìn Xa đáp lời:\n\n§E\"Chúng ta rất khác nhau, hỡi những người bạn. Tuy nhiên các bạn rất mực tôn trọng và thông tuệ, ngay cả khi niềm tin của các bạn đi ngược lại với chúng ta. Có lẽ trong trường hợp này có sự khôn ngoan trong quan điểm của các bạn. Là những sinh thể thế tục, các bạn đề xuất chúng ta nên tiến hành như thế nào?\"§!"
 astral_rift.3225.desc.default: "Chúng ta giải thích rằng chúng ta tin mục tiêu của một xã hội là phát triển và thịnh vượng theo các nguyên tắc của nó. Việc thể hiện các giá trị của một nền văn minh trên vũ đài thiên hà là bài kiểm tra thực sự. Nếu bước vào Cõi Tâm Linh thực sự là ý nguyện của nhân dân các bạn, các bạn có bổn phận phải tiến bước.\n\nKẻ Nhìn Xa đáp lời:\n\n§E\"Ta hiểu, nhưng ý chí của nhân dân ta đang bị chia rẽ. Những người lữ khách phương xa, các bạn có thể đưa ra chỉ dẫn nào? Gánh nặng của quyết định này quá lớn để một mình ta gánh vác.\"§!"
 astral_rift.3225.a: "Khuyên can không nên can thiệp vào Cõi Tâm Linh."
 astral_rift.3225.b: "Khuyến khích Kẻ Nhìn Xa đột phá vào Cõi Tâm Linh."

 astral_rift.3230.name: "Để Cho Số Phận Định Đoạt"
 astral_rift.3230.desc.intro: "Chúng ta giải thích rằng mình không có hứng thú đưa ra góc nhìn sâu xa và đây không phải là một chuyến viếng thăm tiền định. Chúng ta chỉ là những nhà thám hiểm, và đã đến nơi này hoàn toàn do tình cờ.\n\n§E\"Rất tốt. Có lẽ quyết định không can thiệp của các bạn chỉ đơn giản là một dấu hiệu khác để ta chiêm nghiệm. Vậy hãy đi đi, với đôi mắt rộng mở.\"§!"
 astral_rift.3230.desc.outro: "Để Kẻ Nhìn Xa ở lại với những suy tư thiền định của nàng, chúng ta khám phá địa hình lân cận với hy vọng rằng chuyến hành trình đến đây sẽ mang lại một số lợi ích thiết thực. Không lâu sau đó, chúng ta phát hiện một kho khoáng sản quý giá nằm giữa hai đỉnh núi."
 astral_rift.3230.desc.completed_zroni: "$astral_rift.3230.desc.intro$\n\nRất có thể lịch sử của người Zroni cũng sẽ lặp lại ở chiều không gian này, nhưng số phận của họ không phải là thứ để chúng ta thao túng.\n\n$astral_rift.3230.desc.outro$"
 astral_rift.3230.desc.started_zroni: "$astral_rift.3230.desc.intro$\n\nNgười Zroni có con đường riêng phải đi, và thật không khôn ngoan khi can thiệp vào các dòng thời gian khác.\n\n$astral_rift.3230.desc.outro$"
 astral_rift.3230.desc.default: "$astral_rift.3230.desc.intro$\n\n$astral_rift.3230.desc.outro$"
 astral_rift.3230.a: "Khai thác kho khoáng sản."

 astral_rift.3235.name: "Lời Khuyên Tiên Tri"
 astral_rift.3235.desc.intro: "Chúng ta đã can ngăn Kẻ Nhìn Xa không bước vào Cõi Tâm Linh vào thời điểm này, và nàng đã đón nhận lời khuyên của chúng ta như một lời sấm truyền. Để cảm tạ, nàng trao tặng chúng ta một khối tinh thể dữ liệu nhỏ nhưng nặng một cách kỳ lạ. Chúng ta cáo từ rời đi.\n\nPhân tích tinh thể dữ liệu đã hé lộ một ma trận biến đổi tinh vi; một kho lưu trữ khổng lồ được lưu trữ dưới dạng năng lượng tâm linh."
 astral_rift.3235.desc.gestalt: "$astral_rift.3235.desc.intro$\n\nDù tinh thể là một mẫu vật kỹ thuật kỳ lạ, chúng ta đã chuyển đổi ngân hàng dữ liệu của nó thành một dạng năng lượng hữu ích hơn."
 astral_rift.3235.desc.materialist: "$astral_rift.3235.desc.gestalt$"
 astral_rift.3235.desc.default: "$astral_rift.3235.desc.intro$\n\nThông tin bên trong mang lại những hiểu biết sâu sắc về các lý thuyết tâm linh."
 astral_rift.3235.a: "Có lẽ chúng ta sẽ gặp lại nhau."

 astral_rift.3240.name: "$astral_rift.3235.name$"
 astral_rift.3240.desc.intro: "Chúng ta khuyến khích Kẻ Nhìn Xa dấn thân vào Cõi Tâm Linh để thăng hoa lên một cảnh giới tồn tại cao hơn, và nàng đã tiếp nhận lời khuyên của chúng ta như một lời tiên tri. Để cảm tạ, nàng trao tặng chúng ta một tinh thể dữ liệu nhỏ nhưng nặng bất thường. Chúng ta cáo từ.\n\nPhân tích tinh thể dữ liệu hé lộ một ma trận biến đổi tinh tế; một kho lưu trữ khổng lồ được bảo tồn dưới dạng năng lượng tâm linh."
 astral_rift.3240.desc.completed_zroni: "Có lẽ lần này, sẽ có một kết cục tốt đẹp hơn cho giống loài của nàng."
 astral_rift.3240.desc.gestalt: "$astral_rift.3240.desc.intro$\n\nDù tinh thể là một ví dụ tò mò về kỹ thuật, chúng ta đã chuyển đổi ngân hàng dữ liệu của nó thành một dạng năng lượng hữu ích hơn."
 astral_rift.3240.desc.gestalt_completed_zroni: "$astral_rift.3240.desc.gestalt$\n\n$astral_rift.3240.desc.completed_zroni$"
 astral_rift.3240.desc.materialist: "$astral_rift.3240.desc.gestalt$"
 astral_rift.3240.desc.materialist_completed_zroni: "$astral_rift.3240.desc.gestalt_completed_zroni$"
 astral_rift.3240.desc.default: "$astral_rift.3240.desc.intro$\n\nThông tin bên trong mang lại những hiểu biết sâu sắc về các lý thuyết tâm linh."
 astral_rift.3240.desc.default_completed_zroni: "$astral_rift.3240.desc.default$\n\n$astral_rift.3240.desc.completed_zroni$"
 astral_rift.3240.a: "$astral_rift.3235.a$"

 astral_rift.3245.name: "Cơ Hội Đến"
 astral_rift.3245.desc: "Chúng ta đã phát hiện một mỏ khoáng sản khổng lồ trong thung lũng giữa hai ngọn núi, bị chôn vùi dưới những tảng đá tinh thể rơi rụng. Mặt đất quá bất ổn để tiến hành các hoạt động khai mỏ toàn diện, nhưng chúng ta đã sử dụng thiết bị hạn chế để khai thác những gì có thể từ bề mặt của mỏ quặng.\n\nVới một khối lượng tài nguyên quý giá mang theo, chuyến thám hiểm này đã thành công tốt đẹp."
 astral_rift.3245.a: "$FASCINATING$"

 astral_rift.3280.name: "Thông Điệp Từ Cõi Xa"
 astral_rift.3280.a: "Một nghĩa cử đầy chu đáo."
 astral_rift.3280.desc.intro: "Chúng ta đã phát hiện một khoang hình con nhộng hoàn toàn nhẵn bóng xuất hiện từ khe nứt mà chúng ta từng thám hiểm tại §Y[From.System.GetName]§!"
 astral_rift.3280.desc.encountered_priestess: "Nữ tư tế Zroni mà chúng ta từng gặp gỡ nơi đó đã gửi cho chúng ta một thông điệp."
 astral_rift.3280.desc.common: "§E\"Cảm ơn [From.Leader.GetName] của [From.Explorer.GetName] vì lời sấm truyền mà các bạn đã ban cho. Kể từ đó ta đã xua tan mọi cám dỗ từ Cõi Tâm Linh. Noi gương các bạn, chính chúng ta cũng đã học được cách du hành qua các bình diện tinh giới để tìm kiếm thêm những lời giải đáp. Chúng ta xin chia sẻ một số phát hiện của mình như một biểu hiện của lòng biết ơn.\"§!\n\nKhoang con nhộng chứa một lượng lớn dữ liệu nghiên cứu từ các chiều không gian song song khác."
 astral_rift.3280.desc.started_zroni: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.encountered_priestess$\n\n$astral_rift.3280.desc.common$"
 astral_rift.3280.desc.completed_zroni.common: "Dường như giờ đây có ít nhất một chiều không gian nơi giống loài này có thể sinh tồn tiếp tục."
 astral_rift.3280.desc.completed_zroni: "$astral_rift.3280.desc.started_zroni$\n\n$astral_rift.3280.desc.completed_zroni.common$"
 astral_rift.3280.desc.default.common: "Nó chứa một thông điệp giản dị:"
 astral_rift.3280.desc.default: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.default.common$\n\n$astral_rift.3280.desc.common$"

 astral_rift.3285.name: "Lời Hứa Của Cõi Tâm Linh"
 astral_rift.3285.a: "$astral_rift.3280.a$"
 astral_rift.3285.desc.common: "§E\"Cảm ơn [From.Leader.GetName] của [From.Explorer.GetName] vì chuyến viếng thăm tiền định của các bạn. Chúng ta không chỉ đột phá thành công vào Cõi Tâm Linh, mà toàn bộ dân số Zroni đã bắt đầu di cư vĩnh viễn vào nơi đây. Nó đã ban cho chúng ta sức mạnh và sự hài hòa phi thường đến mức chúng ta đang trải nghiệm một xã hội không tưởng mà chúng ta chưa từng dám tưởng tượng!\n\nChúng ta muốn chia sẻ một phần của cải vật chất với các bạn trước khi chúng ta hoàn toàn rời bỏ thế giới vật chất này.\"§!"
 astral_rift.3285.desc.started_zroni: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.encountered_priestess$\n\n$astral_rift.3285.desc.common$"
 astral_rift.3285.desc.completed_zroni: "$astral_rift.3285.desc.started_zroni$\n\n$astral_rift.3280.desc.completed_zroni.common$"
 astral_rift.3285.desc.default: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.default.common$\n\n$astral_rift.3285.desc.common$"

