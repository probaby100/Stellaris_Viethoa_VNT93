 astral_rift.3060.a.tech_swarm_strike_craft_1: "Chia sẻ $tech_swarm_strike_craft_1$ cho tộc Grunur."
 astral_rift.3060.a.tech_precognition_interface: "Chia sẻ $tech_precognition_interface$ cho tộc Grunur."
