l_english:

#####################
# Siege on Paradise #
#####################
 astral_rift_siege_on_paradise: "Vây Hãm Thiên Đường"

 astral_rift.3000.name: "$astral_rift_siege_on_paradise$"
 astral_rift.3000.desc: "Chúng ta đã đến một hành tinh trù phú tốt tươi. Từ những cánh rừng rậm rạp đến những đồng bằng xanh ngát, cảnh quan nơi đây vừa đa dạng vừa được chăm sóc hoàn mỹ - một khu vườn rực rỡ sống động trải rộng khắp toàn cầu.\n\nMột giống loài dạng thực vật chưa xác định đã dựng lên các công sự phòng thủ kiên cố bao quanh những thành phố bán hữu cơ. Các bản quét hệ sao địa phương đã phát hiện một hạm đội phong tỏa gồm các chiến hạm vũ trang hạng nặng. Hiện chưa có xung đột vũ trang nổ ra, nhưng rõ ràng một cuộc chiến đang âm ỉ bùng nổ."
 astral_rift.3000.a: "Liên lạc với cư dân hành tinh."
 astral_rift.3000.b: "Liên lạc với hạm đội trên quỹ đạo."

######################
# Baol Events Branch #
######################

 NAME_Baol: "Baol"
 NAME_Baol_leader: "Oakenstalk"
 baol_leader_desc: "§Y[Root.GetName]§! đã được bắt gặp trong một Khe Nứt Tinh Giới. Từng là một vị tướng đáng kính trong cuộc chiến chống lại tộc Grunur."
 baol_leader_catch_phrase: "Tôi sẽ hỗ trợ khi cần thiết."

 edict_astral_cloaking: "Tàng Hình Tinh Giới"
 edict_astral_cloaking_desc: "Sợi Tinh Giới được sử dụng trong các máy phát trường tàng hình sẽ 'phản chiếu' một phần tàu chiến của chúng ta sang các chiều không gian khác, khiến chúng càng khó bị phát hiện hơn ở chiều không gian này."
 astral_cloaking_available_tt: "Sắc lệnh §Y$edict_astral_cloaking$§! hiện đã sẵn sàng."

 astral_shield_experimentation: "Thử Nghiệm Khiên Chắn Tinh Giới"

 astral_rift.3005.desc.intro: "Trên bề mặt hành tinh, chúng ta đã bắt gặp một sinh vật khổng lồ có cơ thể được tạo thành từ một mạng lưới rễ cây chằng chịt phức tạp."
 astral_rift.3005.desc.common.1: "Chúng ta nhận ra đây là một cá thể thuộc loài Baol, một giống loài từng sinh sống trong vũ trụ của chúng ta hàng trăm nghìn năm trước."
 astral_rift.3005.desc.baol_started: "Chúng ta đưa ra giả thuyết rằng khe nứt là cánh cửa dẫn vào một vũ trụ song song, nơi loài Baol đang kiên cường bảo vệ các thuộc địa của họ."
 astral_rift.3005.desc.baol_completed: "Chúng ta đưa ra giả thuyết rằng khe nứt là cánh cửa dẫn vào một vũ trụ song song, nơi loài Baol vẫn chưa bị tiêu diệt."
 astral_rift.3005.desc.common.2: "Nhờ có dữ liệu khảo cổ học sâu rộng mà chúng ta đã thu thập được về giống loài này, chúng ta đã sẵn sàng cho cuộc giao tiếp trực tiếp."
 astral_rift.3005_3006.desc.common.plantoid: "§E\"Kính chào, những người anh em cùng hạt giống. Hãy giải thích làm thế nào các bạn vượt qua được vòng phong tỏa, và vì mục đích gì các bạn đã đến đây.\"§!"
 astral_rift.3005_3006.desc.common.default: "§E\"Dừng lại, sinh thể có tri giác chưa xác định. Hãy giải thích làm thế nào các bạn vượt qua được vòng phong tỏa. Các bạn đến đây để đàm phán sao?\"§!"
 astral_rift.3005.name: "Gặp Gỡ Người Baol"
 astral_rift.3005.desc.baol_started_plantoid: "$astral_rift.3005.desc.intro$ $astral_rift.3005.desc.know_baol.1$ $astral_rift.3005.desc.baol_started$ $astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.plantoid$"
 astral_rift.3005.desc.baol_completed_plantoid: "$astral_rift.3005.desc.intro$ $astral_rift.3005.desc.know_baol.1$ $astral_rift.3005.desc.baol_completed$ $astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.plantoid$"
 astral_rift.3005.desc.baol_started_default: "$astral_rift.3005.desc.intro$ $astral_rift.3005.desc.know_baol.1$ $astral_rift.3005.desc.baol_started$ $astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.default$"
 astral_rift.3005.desc.baol_completed_default: "$astral_rift.3005.desc.intro$ $astral_rift.3005.desc.know_baol.1$ $astral_rift.3005.desc.baol_completed$ $astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.default$"
 astral_rift.3005.a: "Tiết lộ những gì chúng ta biết về loài Baol."

 astral_rift.3006.name: "Chạm Trán Dạng Thực Vật"
 astral_rift.3006.desc.common: "$astral_rift.3005.desc.intro$ Nó cất tiếng nói với một âm hưởng trầm ấm, mộc mạc bằng một ngôn ngữ mà chúng ta không thể hiểu được. Sau đó, nó trao cho chúng ta một chồi non, nhẹ nhàng bám chặt vào [Explorer.GetSpeciesHandName] của [Leader.GetName]. Những chiếc rễ bám của nó được cấu thành từ một loại vật liệu kỳ lạ. Vươn ra chạm vào [Explorer.GetNetworkName], một khoảnh khắc nhận biết tức thì đã diễn ra; thông qua sự giao hòa giữa tư tưởng và rễ cây, một kênh liên lạc trực tiếp đã được thiết lập."
 astral_rift.3006.desc.plantoid: "$astral_rift.3006.desc.common$\n\n$astral_rift.3005_3006.desc.common.plantoid$"
 astral_rift.3006.desc.default: "$astral_rift.3006.desc.common$\n\n$astral_rift.3005_3006.desc.common.default$"
 astral_rift.3006.a: "Chúng tôi là những nhà thám hiểm."

 astral_rift.3010.name: "Họa Diệt Vong Cận Kề"
 astral_rift.3010.desc.common.1: "Chúng ta giải thích rằng giống loài của họ đã được chúng ta biết đến: loài Baol trong vũ trụ của chúng ta từng là một ý thức tập thể chuộng hòa bình. Những người làm vườn với kỹ năng vô song, họ đã bị tấn công và cuối cùng bị tiêu diệt bởi"
 astral_rift.3010.desc.common.2: "Loài Baol vô cùng kinh hãi. Họ giải thích rằng quân Grunur chỉ mới xuất hiện gần đây, thiết lập một cuộc phong tỏa quân sự quanh thuộc địa này. Mọi chi tiết trong báo cáo của chúng ta đều trùng khớp với những gì họ đã trải qua với tộc Grunur cho đến nay.\n\nHọ đã đưa ra lời thỉnh cầu chính thức đề nghị chúng ta hỗ trợ đẩy lùi mối đe dọa ngoài hành tinh trước khi quá muộn."
 astral_rift.3010.desc.baol_started: "$astral_rift.3010.desc.common.1$ một giống loài quân phiệt tàn bạo mang tên Grunur.\n\nVới tình hình hiện tại, thuộc địa này đang đối mặt với nguy cơ bị thiêu rụi hoàn toàn.\n\n$astral_rift.3010.desc.common.2$"
 astral_rift.3010.desc.baol_completed: "$astral_rift.3010.desc.common.1$ một đế chế quân phiệt tàn độc, tộc Grunur.\n\nMọi hành tinh và thuộc địa của người Baol đều bị hủy diệt. Cuối cùng, chỉ còn lại một cá thể Baol duy nhất, bị mắc kẹt hàng thiên niên kỷ bên trong một trạm nghiên cứu bỏ hoang.\n\n$astral_rift.3010.desc.common.2$"
 astral_rift.3010.a: "Chúng tôi sẽ giúp đỡ bằng mọi cách có thể."
 astral_rift.3010.b: "Chúng tôi không có quyền can thiệp vào chuyện này."

 astral_rift.3015.name: "Lời Thỉnh Cầu Hỗ Trợ"
 astral_rift.3015.desc: "§E\"Chúng tôi đang chuẩn bị cho trận chiến sắp tới. Đáng tiếc thay, chuyến thám hiểm của các bạn có thể nguy hiểm hơn nhiều so với dự tính ban đầu.\"§!\n\nSinh vật dạng thực vật tiếp tục, §E\"Chúng tôi là người §YBaol§!, và các bạn đã hạ cánh xuống một trong những thuộc địa ngoài rìa của chúng tôi. Chúng tôi đang bị vây hãm, và tài nguyên đang cạn kiệt từng ngày. Ngoại giao hoàn toàn vô hiệu. Kẻ xâm lược công khai chế nhạo chúng tôi, và cười nhạo những nỗ lực liên lạc của chúng tôi. Chúng tự xưng là tộc §YGrunur§!.\"§!\n\n§E\"Chúng tôi tin rằng mục tiêu của chúng không phải là chinh phục thế giới này, mà là tiêu diệt nó hoàn toàn. Dường như chúng chẳng hề biết đến lòng trắc ẩn. Chúng tôi sẽ vô cùng biết ơn bất kỳ sự trợ giúp nào mà các bạn có thể đem lại.\"§!"
 astral_rift.3015.a: "$astral_rift.3010.a$"
 astral_rift.3015.b: "$astral_rift.3010.b$"

 astral_rift.3020.name: "Cứu Giúp Loài Baol"
 astral_rift.3020.desc.baol_started: "Chúng ta biết rằng tộc Grunur sẽ thiêu rụi thuộc địa này thành tro bụi. $astral_rift.3020.desc.common.baol$"
 astral_rift.3020.desc.baol_completed: "Chúng ta biết rằng tộc Grunur sẽ không từ bất kỳ thủ đoạn nào để tiêu diệt loài Baol. $astral_rift.3020.desc.common.baol$"
 astral_rift.3020.desc.common.baol: "Hoàn toàn không có cơ hội cho một giải pháp ngoại giao."
 astral_rift.3020.desc.common.1: "Chúng ta đã tiến hành thảo luận với người Baol để xác định phương thức thiết thực nhất nhằm giúp đỡ họ.\n\nChúng ta có thể chia sẻ những hiểu biết về công nghệ biến đổi gen để củng cố khả năng phòng thủ sinh học của họ, hoặc cung cấp cho họ công nghệ tàng hình để che giấu các thuộc địa còn lại trước hạm đội Grunur."
 astral_rift.3020.desc.option_gene_tailoring: "Người Baol có thể nỗ lực tự vệ, nhưng năng lực quân sự của họ rất hạn chế. Họ sẽ hưởng lợi từ sự tăng cường cơ khí hoặc biến đổi gen để cải thiện tốc độ, sức mạnh và khả năng chống chịu vũ khí gây cháy của quân đội.\n\n"
 astral_rift.3020.desc.option_cloaking: "Chúng ta có thể giúp người Baol lẩn tránh tộc Grunur bằng cách che giấu hành tinh quê nhà của họ bằng một thiết bị tàng hình tạm thời. Thuộc địa này vẫn sẽ bị mất, nhưng ít nhất trung tâm của nền văn minh của họ sẽ tồn tại.\n\n"
 astral_rift.3020.desc.option_astral_shield: "Chúng ta có thể nỗ lực nâng cao công nghệ hữu cơ tiên tiến của người Baol bằng Sợi Tinh Giới. Có thể thiết lập một lá chắn mạnh mẽ xung quanh thuộc địa này. Dĩ nhiên, điều này sẽ ngăn họ rời khỏi hành tinh, nhưng ít nhất họ sẽ an toàn trước những kẻ xâm lược.\n\n"
 astral_rift.3020.desc.common.2: "Như một biện pháp cứu cánh cuối cùng, chúng ta có thể mang các mầm cây Baol quay trở lại qua Khe Nứt, cho phép giống loài này tiếp tục tồn tại bất kể điều gì xảy ra ở chiều không gian này."
 astral_rift.3020.a: "Tăng cường phòng thủ sinh học cho họ."
 astral_rift.3020.b: "Chia sẻ công nghệ tàng hình."
 astral_rift.3020.c: "Chúng ta không thể can thiệp vào cuộc chiến này."
 astral_rift.3020.d: "Tạo ra một lá chắn tinh giới."

 astral_rift.3021.name: "Cân Nhắc Các Lựa Chọn"
 astral_rift.3021.desc.common: "Khi ngoại giao đã hoàn toàn ngoài tầm tay, chúng ta sẽ cần phải sáng tạo trong sự hỗ trợ của mình.\n\n$astral_rift.3020.desc.common.1$"

 astral_rift.3025.name: "Không Phải Trận Chiến Của Chúng Ta"
 astral_rift.3025.desc: "Vấn đề của người Baol, dù là quân sự hay bất kỳ điều gì khác, không thuộc mối bận tâm của chúng ta. Chúng ta đã du hành từ một chiều không gian khác để quan sát và thám hiểm; chúng ta không muốn tạo thêm những kẻ thù mới và hùng mạnh.\n\nÝ thức tập thể Baol chấp nhận quyết định của chúng ta với sự thất vọng lộ rõ, nhưng vẫn để chúng ta tiếp tục các nghiên cứu của mình."
 astral_rift.3025.a: "Chuẩn bị các vệ tinh quan sát."

 astral_rift.3030.name: "Gia Cố Di Truyền"
 astral_rift.3030.desc: "Chúng ta đã vận dụng hiểu biết về công nghệ chỉnh sửa gen để tăng cường cho giống loài Baol trong chiến dịch phòng thủ sắp tới. Không còn nhiều lựa chọn, họ miễn cưỡng chấp nhận những thay đổi sinh học này. Đế chế Baol yêu chuộng hòa bình, được xây dựng trên nền tảng nông nghiệp và quản lý hệ sinh thái, giờ đây đã sở hữu một lực lượng dân quân thường trực gồm các cá thể có khả năng phục hồi cao cùng thể lực phi thường.\n\nGiờ đây đã chuẩn bị tốt hơn cho chiến tranh mặt đất, người Baol đã trao tặng chúng ta một cá thể phòng thủ chuyên biệt để tỏ lòng biết ơn. Sinh vật bán tự trị đặc biệt này giờ đây sẽ phục vụ chúng ta."

 astral_rift.3031.name: "$NAME_Baol_leader$"
 astral_rift.3031.desc: "§HCá thể dạng thực vật di chuyển chậm rãi có tính toán, nhưng sẽ là sai lầm nếu coi sự chậm chạp của nó là thiếu trí thông minh. Được chuyên môn hóa để bảo vệ tập thể, sinh vật này đại diện cho đỉnh cao của nhiều thế hệ thích nghi cẩn trọng. Nó chào đón chúng ta một cách nghiêm nghị nhưng lịch thiệp, với ý định đền đáp ơn huệ mà chúng ta đã ban cho tập thể của nó.§!\n\nLà một phần của giống loài Baol, chúng tôi vốn không có tên. Các bạn có thể gọi chúng tôi là $NAME_Baol_leader$."
 astral_rift.3031.a: "Bạn từng là chuyên gia phòng thủ của loài Baol sao?"
 astral_rift.3031.a.response: "Cá thể này từng được giao nhiệm vụ chuẩn bị cho thuộc địa của chúng tôi bước vào một cuộc chiến tranh phòng thủ. Điều này bao gồm việc quản lý tài nguyên hạn chế trong khi bị vây hãm, cũng như thiết kế và duy trì các công sự quân sự. Cá thể này đã duy trì mức dân số ổn định bất chấp sự phong tỏa. Công việc của cá thể này được đánh giá là hữu ích."
 astral_rift.3031.b: "Bạn cảm thấy thế nào khi gia nhập cùng chúng tôi?"
 astral_rift.3031.b.response: "Cá thể này đã làm tất cả những gì có thể cho loài Baol. Ở vai trò đó, không còn không gian để phát triển thêm nữa; khi một hệ thống sống ngừng phát triển, nó bắt đầu lụi tàn. Ở chiều không gian này, có thêm cơ hội để phụng sự. Có niềm hy vọng vào sự đổi mới."
 astral_rift.3031.c: "Cảm giác bị tách rời khỏi tập thể như thế nào?"
 astral_rift.3031.c.response: "Bị hạn chế. Bực bội... nhưng đầy phấn khích. Cảm giác này không giống bất kỳ điều gì cá thể này từng trải qua. Tuy nhiên, cá thể này càng sớm hòa nhập vào guồng quay của [Explorer.GetName] thì càng tốt. Phụng sự cho một thực thể vĩ đại hơn luôn là điều dễ chịu hơn nhiều."
 astral_rift.3031.d: "Làm thế nào bạn chọn được tên của mình?"
 astral_rift.3031.d.response: "Một trong những nhà nghiên cứu của các bạn đến qua Khe Nứt Tinh Giới đã cung cấp cho cá thể này một chương trình tạo văn bản trí tuệ nhân tạo. Một truy vấn đã được thực hiện dựa trên các phẩm chất của cá thể này, và kết quả trả về là: §Y$NAME_Baol_leader$§!. Cảm giác thật... phù hợp."

 astral_rift.3035.name: "Ẩn Mình Dưới Mắt Thần"
 astral_rift.3035.desc: "Sau khi chia sẻ những bí mật về trường tàng hình với người Baol, họ đã có thể sản xuất một mạng lưới vệ tinh tàng hình hữu cơ. Những chồi thử nghiệm này có bản chất tạm thời và cần một lượng nhỏ Sợi Tinh Giới để duy trì, nhưng chúng sẽ tồn tại đủ lâu để che giấu hành tinh quê nhà Baol khỏi tầm mắt của tộc Grunur. Thật không may, thuộc địa này đã bị tộc Grunur phát hiện và nhiều khả năng sẽ bị hủy diệt.\n\nMột khi đã tàng hình, người Baol sẽ phải tạm thời hy sinh tham vọng du hành vũ trụ của mình, vì bất kỳ con tàu nào bị phát hiện rời khỏi hành tinh mẹ đều có thể làm lộ vị trí của nó. Dĩ nhiên, sự bất tiện này vẫn tốt hơn gấp ngàn lần so với sự hủy diệt hoàn toàn."
 astral_rift.3035.a: "Một sự thỏa hiệp thỏa đáng."

 astral_rift.3040.name: "Sự Sống Tự Tìm Ra Lối"
 astral_rift.3040.desc.common: "Rời thuộc địa Baol, chúng ta được trao gửi một bó mầm quý giá của họ."
 astral_rift.3040.desc.baol_started: "$astral_rift.3040.desc.common$\n\nNếu cuộc xung đột giữa Baol và Grunur leo thang hơn nữa, ít nhất chúng ta cũng đã cứu được một phần giống loài của họ khỏi sự tàn phá của chiến tranh."
 astral_rift.3040.desc.baol_completed: "$astral_rift.3040.desc.common$\n\nKhi người Baol không thể tránh khỏi bị hủy diệt, có lẽ họ sẽ được an ủi khi biết rằng giống loài của họ sẽ tiếp tục sinh sôi ở một chiều không gian khác."
 astral_rift.3040.desc.default: "$astral_rift.3040.desc.common$\n\nChúng ta hy vọng rằng cuộc xung đột của họ sẽ sớm kết thúc và người Baol sẽ tiếp tục phát triển thịnh vượng ở cả hai bờ khe nứt."

 astral_rift.3045.name: "Tro Về Với Tro"
 astral_rift.3045_3046.desc.common: "Chúng ta đã chuẩn bị các vệ tinh quan sát và phóng chúng vào quỹ đạo địa tĩnh, điều này sẽ cho phép chúng ta truyền một lượng dữ liệu nhất định qua khe nứt."
 astral_rift.3045.desc: "$astral_rift.3045_3046.desc.common$\n\nHiện tại, chúng ta sẽ nghiên cứu các kỹ thuật quản lý hệ sinh thái và nông nghiệp tiên tiến của người Baol. Khi thời khắc đến, chúng ta cũng sẽ ghi lại những thước phim quan trọng về sự hủy diệt hành tinh bởi bàn tay tộc Grunur."
 astral_rift.3045.a: "Đây là một cơ hội nghiên cứu độc nhất vô nhị."

 astral_rift.3046.name: "Cơ Hội Nghiên Cứu"
 astral_rift.3046.desc: "$astral_rift.3045_3046.desc.common$\n\nChúng ta sẽ nghiên cứu hành tinh Baol và cách họ quản lý hệ sinh thái cho đến khi xung đột bùng nổ. Cuộc chiến này cũng sẽ cung cấp những điểm dữ liệu thú vị cho các nghiên cứu trong tương lai."
 astral_rift.3046.a: "$astral_rift.3045.a$"

 astral_rift.3047.name: "Bụi Về Với Bụi"
 astral_rift.3047.desc: "Thuộc địa Baol ở bờ bên kia khe nứt trong hệ sao [From.solar_system.GetName] đã bị tộc Grunur tiêu diệt. Chúng ta đã thu thập được dữ liệu nghiên cứu chi tiết từ trận chiến, nhưng mục tiêu của dự án quan sát này đã bị xóa sổ."

 astral_rift.3049.name: "Khiên Chắn Tinh Giới"
 astral_rift.3049.desc: "Chúng ta đã thử nghiệm truyền nạp Sợi Tinh Giới vào máy phát lá chắn của thuộc địa Baol. Năng lượng tinh giới đã tạo ra một trường bảo vệ vững chắc ngoài sức tưởng tượng, đẩy lùi các đợt bắn phá ban đầu từ quỹ đạo của quân Grunur."
 astral_rift.3049.a: "Một thử nghiệm thành công mỹ mãn."

########################
# Grunur Events Branch #
########################

 grunur_weapon_interface_modifier: "Giao Diện Vũ Khí Grunur"

 astral_rift.3050.name: "Hộ Tống Soái Hạm"
 astral_rift.3050.desc.default: "Chúng ta tiến vào quỹ đạo quanh hành tinh Gaia và ngay lập tức đối mặt với các chiến hạm tuần tra. Mọi nỗ lực liên lạc của chúng ta chỉ nhận lại sự im lặng.\n\nMột đội tuần tra đã hộ tống chúng ta đến soái hạm của họ, một cỗ Juggernaut vũ trang hạng nặng được bao quanh bởi hàng chục tàu hỗ trợ. Hạ cánh §Y$tech_rift_sphere$§! của chúng ta vào một khoang chứa máy bay lớn, chúng ta lập tức bị một toán lính bắt giữ. Lớp mai bọc giáp và những chiếc càng lởm chởm của chúng gợi nhớ đến một số loài giáp xác đã biết. Hành quân về phía trước theo bước chân đồng bộ hoàn hảo, chúng tạo nên một hình ảnh đáng sợ, nhưng đôi mắt hạt cườm nhô ra từ chiếc đầu bọc giáp của chúng lại vô cùng cảnh giác và thông minh."
 astral_rift.3050.desc.baol: "$astral_rift.3050.desc.default$\n\nChúng ta nhận ra giống loài này chính là tộc §YGrunur§!, một chủng tộc hiếu chiến tột độ từng sống trong vũ trụ của chúng ta hàng trăm nghìn năm trước. Khét tiếng trong lịch sử, giống loài này phải chịu trách nhiệm cho cuộc diệt chủng nhắm vào ý thức tập thể dạng thực vật §YBaol§!. Chúng ta đưa ra giả thuyết rằng khe nứt này đã đưa chúng ta vào một vũ trụ song song nơi tộc Grunur vẫn đang hoạt động quân sự mạnh mẽ."
 astral_rift.3050.a: "Tộc Grunur rất nguy hiểm. Hãy cẩn trọng."
 astral_rift.3050.b: "Hãy xem điều này sẽ dẫn tới đâu..."

 astral_rift.3055.name: "Cuộc Trò Chuyện Độc Nhất"
 astral_rift.3055.desc.common_1: "Chúng ta được dẫn vào một khoang trung tâm. Một bảng điều khiển phức tạp là nơi cư ngụ của nhiều sinh vật giáp xác khổng lồ, những chiếc càng của chúng được gắn với độ chính xác đáng kinh ngạc vào một giao diện chuyên dụng. Mỗi thiết bị đầu cuối chứa một cụm tinh thể, dường như được thao túng bởi những âm thanh phát ra từ sâu bên trong lồng ngực của các thành viên phi hành đoàn. Ở trung tâm căn phòng là một vị đô đốc trong bộ quân phục rách rưới. Nó gầm lên một mệnh lệnh, và cấp dưới lập tức hành động."
 astral_rift.3055.desc.organic_common_1: "Một trong những trợ lý nghiên cứu của chúng ta bị khống chế và quét sinh học ngay lập tức. Trong nỗi kinh hoàng của chúng ta, một đầu dò đâm chí mạng"
 astral_rift.3055.desc.organic_common_2: "xuyên qua lớp [leader.species.GetSkinType] của họ, trích xuất nguyên vẹn bộ não. Cơ quan này nhanh chóng được chuyển cho thủ lĩnh giáp xác, kẻ đã cắm phập nó vào một trong những tinh thể trên bảng điều khiển chỉ huy."
 astral_rift.3055.desc.common_2: "Một giọng nói vang rền phát ra từ các tinh thể bằng chính ngôn ngữ mẹ đẻ của chúng ta: §E\"ĐẾN LÚC NÓI CHUYỆN. CÁC NGƯỜI LÀ AI?\"§!"
 astral_rift.3055.desc.organic: "$astral_rift.3055.desc.common_1$\n\n$astral_rift.3055.desc.organic_common_1$ đâm xuyên $astral_rift.3055.desc.organic_common_2$\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.desc.lithoid: "$astral_rift.3055.desc.common_1$\n\n$astral_rift.3055.desc.organic_common_1$ khoan xuyên $astral_rift.3055.desc.organic_common_2$\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.desc.mechanical: "$astral_rift.3055.desc.common_1$\n\nMột trong những drone nghiên cứu của chúng ta bị khống chế và quét ngay lập tức. Một công cụ sắc nhọn cắm thẳng vào CPU của nó, khiến nó tê liệt hoàn toàn. Bộ xử lý nhanh chóng được chuyển cho thủ lĩnh giáp xác, kẻ đã cắm nó vào một trong những tinh thể trên bảng điều khiển chỉ huy.\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.desc.default: "$astral_rift.3055.desc.common_1$\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.a: "Chúng tôi là những nhà thám hiểm, và chúng tôi đã thấy trước tương lai của các vị."
 astral_rift.3055.b: "Chúng tôi là những nhà thám hiểm."

 astral_rift.3060.name: "Tộc Grunur Khét Tiếng"
 astral_rift.3060.desc: "Chúng ta tự giới thiệu mình là những nhà khoa học đến từ một vũ trụ song song.\n\nTrong thế giới của chúng ta, tộc Grunur đã biến mất từ lâu. Dựa trên các ghi chép khảo cổ học, họ là một chủng tộc chinh phục, sở hữu một kho vũ khí tiên tiến khổng lồ... cùng với bản tính tàn bạo khét tiếng. Cuộc diệt chủng loài Baol của họ mang tính huyền thoại cả về hiệu quả lẫn mức độ phô trương tàn khốc. Họ được định sẵn sẽ tiêu diệt thuộc địa Baol trong hệ sao này.\n\nKhi những lời của chúng ta được dịch ra, những người lính Grunur phát ra một chuỗi tiếng thở gấp lách tách. Chúng ta hiểu rằng đó là tiếng cười của họ. Tuy nhiên, sự im lặng nghiêm nghị của viên chỉ huy hạm đội đã nhanh chóng lập lại trật tự. Thông qua tinh thể dịch thuật, nó cất tiếng:\n\n§E\"BIẾT RỒI SAO? NẾU ĐÃ BIẾT, THÌ PHẢI CỐNG NẠP.\"§!"
 astral_rift.3060.a.tech_dragon_armor: "Chia sẻ $tech_dragon_armor$ cho tộc Grunur."
 astral_rift.3060.a.tech_crystal_armor_2: "Chia sẻ $tech_crystal_armor_2$ cho tộc Grunur."
