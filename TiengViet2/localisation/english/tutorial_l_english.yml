l_english:

 SITLOG:0 "Nhật ký Tình hình Đã cập nhật"

 ####################################
 # Advisor Tutorial Messages
 ####################################
 TUTORIAL_GOVERNMENTVIEW_GOVERNMENT_TITLE:0 "Chính phủ"
 TUTORIAL_GOVERNMENTVIEW_GOVERNMENT_DESC:1 "Màn hình §SChính phủ§! cung cấp thông tin liên quan đến đế chế và chính quyền của chúng ta. Tại đây, chúng ta có thể thấy §SNhà thống trị§! cùng mọi hiệu ứng liên quan.\n\nMột thẻ riêng biệt sẽ cung cấp thông tin về §SNhân khẩu học§! của đế chế."
 TUTORIAL_TECH_VIEW_TITLE:0 "Hướng dẫn: Công nghệ"
 TUTORIAL_TECH_VIEW_DESC:1 "Màn hình §SCông nghệ§! là nơi chúng ta định hướng các nỗ lực nghiên cứu khoa học. Công nghệ được chia thành ba lĩnh vực khác nhau, mỗi lĩnh vực thông thường sẽ có ba lựa chọn nghiên cứu khả dụng.\n\nCác lĩnh vực khả dụng gồm £physics£ Vật lý học, £society£ Xã hội học, và £engineering£ Kỹ thuật học.\n\nĐể nghiên cứu một §SCông nghệ§!:\n\n£dot_green£ Nhấp vào nút §SChọn Nghiên cứu§!\n£dot_green£ Chọn từ các tùy chọn khả dụng\n\nChỉ định một §STrưởng bộ phận Nghiên cứu§! sẽ đẩy nhanh tiến độ và được đặc biệt khuyến khích. Các §SĐặc tính§! của họ cũng có thể đem lại thêm nhiều lợi ích.\n\nNghiên cứu cũng có thể được tự động hóa bằng cách nhấp vào nút §SBật Tự động Nghiên cứu§! ở từng lĩnh vực tương ứng.\n\n$tttt$$ttt$£automate_research£\n"
 TUTORIAL_CONTACTSVIEW_EMPIRES_TITLE:0 "Hướng dẫn: Danh bạ Liên lạc"
 TUTORIAL_CONTACTSVIEW_EMPIRES_DESC:0 "Trong màn hình §SDanh bạ Liên lạc§!, chúng ta thấy danh sách chi tiết của tất cả các §SĐế chế§! mà chúng ta đã từng chạm trán. §SThiện cảm§! của họ đối với chúng ta có thể được nhìn thấy ngay lập tức, và chúng ta có thể nhanh chóng, dễ dàng tiến hành §SNgoại giao§!.\n\nMỗi mục cũng hiển thị các chi tiết quan trọng như §SHình thức Chính phủ§!, §STư tưởng Đạo đức§!, và §SVị thế Đế chế§!.\n\nTừ đây, chúng ta cũng có thể tiếp cận các chiến dịch §SGián điệp§! và xem các §SHiệp ước§! hiện có với từng đế chế."
 TUTORIAL_SITUATION_LOG_TITLE:0 "Hướng dẫn: Nhật ký Tình hình"
 TUTORIAL_SITUATION_LOG_DESC:1 "Màn hình §SNhật ký Tình hình§! hiển thị danh sách tất cả các §SDự án Đặc biệt§! hiện có, các £archaeology£ §SDi chỉ Khảo cổ§!, và nhiều địa điểm đáng chú ý khác.\n\nCác mục mới nhiều khả năng sẽ xuất hiện khi chúng ta bắt đầu khám phá thiên hà."
 TUTORIAL_SHIP_DESIGNER_TITLE:0 "Hướng dẫn: Nhà thiết kế Tàu"
 TUTORIAL_SHIP_DESIGNER_DESC:0 "Mọi §STàu vũ trụ§! đang phục vụ trong đế chế của chúng ta đều được thiết kế tại đây. Các §SQuy mô Thân tàu§! và §SLinh kiện§! mới sẽ được mở khóa khi chúng ta nghiên cứu các công nghệ mới.\n\nĐể tạo một §SBản thiết kế§! mới:\n\n£dot_green£ Nhấp vào nút §STrình thiết kế Mới§!\n£dot_green£ Chọn §SQuy mô Thân tàu§!\n£dot_green£ Nhấp vào nút §SChưa có Phân khu§! và chọn một §SPhân khu§!\n\nGiờ đây, hãy tự do lựa chọn từ các §SLinh kiện Tàu§! khả dụng bằng cách nhấp vào các ô trống.\n\n\n$tttt$$tt$£slot_component£\n\n\nSau khi lưu lại, thiết kế mới sẽ có thể đóng tại bất kỳ §SCăn cứ sao§! nào có trang bị §SXưởng đóng tàu§!."
 TUTORIAL_EMPIREVIEW_PLANETS_TITLE: "Hướng dẫn: Hành tinh và Khu vực"
 TUTORIAL_EMPIREVIEW_PLANETS_DESC:5 "Màn hình §SHành tinh và Khu vực§! cung cấp cái nhìn tổng quan về mọi thế giới đã thuộc địa hóa, lượng £pops£ §SDân số§!, và §SSản lượng Tài nguyên§! của chúng.\n\nKhi đế chế phát triển, nó có thể được tổ chức thành các §SKhu vực§! để tinh giản công tác quản lý.\n\nCác £vassal£ §SChư hầu§! cũng có thể được tạo lập từ các §SKhu vực§! hiện có."
 TUTORIAL_MILITARY_FLEET_TITLE:0 "Hướng dẫn: Hạm đội Quân sự"
 TUTORIAL_MILITARY_FLEET_DESC:2 "Các §SHạm đội Quân sự§! được sử dụng để bảo vệ đế chế mới nổi của chúng ta trước các mối đe dọa... hoặc để bành trướng quyền cai trị vinh quang bằng vũ lực, nếu chúng ta muốn.\n\nQuy mô hạm đội của chúng ta được quyết định bởi §SSức chứa Hạm đội§! hiện tại, vốn ban đầu khá hạn chế. Tuy nhiên, nó có thể được gia tăng bằng cách:\n\n£dot_green£ Nghiên cứu các §SCông nghệ§! mới\n£dot_green£ Phát triển £pops£ dân số của chúng ta\n£dot_green£ Xây dựng các §SĐiểm neo Đậu Căn cứ sao§!\n\nĐể lãnh đạo các hạm đội, chúng ta có thể chỉ định một £commander£ §SChỉ huy§!, mang lại thêm sức mạnh quân sự cùng với bất kỳ phần thưởng nào mà £leader£ §SLãnh đạo§! đó cung cấp."
 TUTORIAL_SCIENCE_SHIP_TITLE:0 "Hướng dẫn: Khảo sát"
 TUTORIAL_SCIENCE_SHIP_DESC:4 "Đây là £science_ship£ §STàu Khoa học§! của chúng ta, được dùng để §SKhảo sát§! các thiên thể như £planet£ §SHành tinh§! trong một £system£ §SHệ sao§!. Một hành tinh cần phải được khảo sát để hiển thị các §STài nguyên§! của nó.\n\nHệ sao quê hương của chúng ta đã được khảo sát hoàn chỉnh, vì vậy chúng ta nên tập trung nỗ lực vào nơi khác.\n\nKhi đang chọn §STàu Khoa học§!:\n\n£dot_green£ Nhấp chuột phải vào một §SHệ sao§! lân cận\n£dot_green£ Chọn §SKhảo sát Hệ sao§!"
 TUTORIAL_CONSTRUCTION_SHIP_TITLE:0 "Hướng dẫn: Tàu Xây dựng"
 TUTORIAL_CONSTRUCTION_SHIP_DESC:1 "Đây là £construction_ship£ §STàu Xây dựng§! của chúng ta, được dùng để xây dựng các trạm không gian.\n\nKhi một thiên thể như £planet£ §SHành tinh§! đã được khảo sát, chúng ta có thể ra lệnh cho con tàu này xây dựng một £science_ship£ §STrạm Nghiên cứu§! hoặc một £mining_station£ §STrạm Khai mỏ§! để khai thác bất kỳ tài nguyên nào nó sở hữu.\n\nNhững con §STàu§! này cũng được dùng để [GetBuildGrow] các §SCăn cứ sao§! trong các £system£ §SHệ sao§! vô chủ, khiến chúng trở nên sống còn đối với các kế hoạch bành trướng của chúng ta."
 TUTORIAL_PLANETVIEW_PLANET_TITLE:0 "Hướng dẫn: Bề mặt Hành tinh"
 TUTORIAL_PLANETVIEW_PLANET_DESC:4 "Thẻ §SBề mặt§! cung cấp cái nhìn tổng quan về cơ sở hạ tầng và tình trạng của một £colony£ §SThuộc địa§!.\n\nPhần £building£ §SKhu quy hoạch và Công trình§! hiển thị các ô công trình đã xây và còn trống trong các Khu quy hoạch tương ứng.\n\nCác £district£ §SKhu quy hoạch§! và £zone£ Chuyên môn hóa Khu quy hoạch cung cấp £housing£ §SChỗ ở§!, £job£ §SViệc làm§!, và tài nguyên.\n\nNút bật tắt §STự động hóa§! cho phép hành tinh tự quản lý dựa trên trọng tâm đã đặt.\n\nThanh §SChỉ số Thuộc địa§! ở phần trên cùng của cửa sổ hiển thị £stability£ §SĐộ ổn định§!, £crime£ §STội phạm§!, các bộ điều chỉnh đang hoạt động, và §SThống đốc§! được chỉ định."
 TUTORIAL_PLANETVIEW_TILES_TITLE:1 "Hướng dẫn: Kinh tế"
 TUTORIAL_PLANETVIEW_TILES_DESC:2 "Thẻ §SKinh tế§! cung cấp cái nhìn tổng quan về §SLực lượng Lao động§! và £job£ §SViệc làm§!.\n\nDân số của £planet£ §SHành tinh§! được tổ chức thành các §STầng lớp§!, có thể mở rộng để xem các loại §SViệc làm§!. £pops£ §SDân số§! sẽ lấp đầy các tầng lớp khi cần thiết để duy trì §SLực lượng Lao động§!.\n\n§SViệc làm§! tiêu thụ và sản xuất tài nguyên.\n\nDân số cần £housing£§SChỗ ở§! và £amenities£ §STiện nghi§!.\n\nSự thiếu hụt một trong hai yếu tố này sẽ làm giảm £happiness£ §SHạnh phúc§! của hành tinh, từ đó ảnh hưởng đến £stability£ §SĐộ ổn định§! chung."
 TUTORIAL_PLANETVIEW_COMBAT_TITLE:0 "Hướng dẫn: Quân đội"
 TUTORIAL_PLANETVIEW_COMBAT_DESC:4 "Thẻ §SQuân đội§! quản lý toàn bộ lực lượng mặt đất trên hành tinh. Nó cũng theo dõi mức độ §STàn phá§!, hay thiệt hại, mà £planet£ §SHành tinh§! đã phải gánh chịu.\n\nCác §SĐạo quân§! mới được thành lập tại đây, bằng cách nhấp vào nút §STuyển mộ§!.\n\n§SQuân Phòng thủ§! được tự động tạo ra bởi £pops£ §SDân số§! làm các §SViệc làm§! Hành pháp hoặc [soldier.GetName]. Các £job£ §SViệc làm§! này được cung cấp bởi thủ phủ hành tinh, £building£ §SĐồn Cảnh sát§!, và £building£ §SThành lũy§!."
 TUTORIAL_PLANETVIEW_SPACEPORT_TITLE:0 "Cảng Không gian"
 TUTORIAL_PLANETVIEW_SPACEPORT_DESC:3 "Thẻ §SCảng Không gian§! là nơi chúng ta quan sát các hạm đội trên quỹ đạo và [GetBuildGrow] các tàu mới. Tàu quân sự chỉ có thể được chế tạo tại một §SCăn cứ sao§! trang bị một §SXưởng đóng tàu§!, nhưng Tàu Xây dựng, Tàu Khoa học và §STàu Thuộc địa§! đều được đóng tại đây.\n\nNgay cả khi chúng ta mất đi Căn cứ sao cuối cùng, chúng ta vẫn có phương tiện để mở rộng và tái thiết chừng nào chúng ta còn sở hữu ít nhất một £planet£ §SHành tinh§! có người ở."
 TUTORIAL_MILITARY_STATION_TITLE:0 "Trạm Quân sự"
 TUTORIAL_MILITARY_STATION_DESC:2 "Các §STrạm Quân sự§! là các công trình phòng thủ tĩnh có thể dùng để bảo vệ các £planet£ §SHành tinh§! quan trọng hoặc các tuyến đường tiếp cận chiến lược, nhưng chỉ có thể được xây dựng trong biên giới của chúng ta hoặc những vùng lãnh thổ mà chúng ta có quyền tiếp cận đặc biệt.\n\nHãy cẩn thận đừng [GetBuildGrow] quá nhiều - giống như §STàu vũ trụ§!, chi phí bảo trì của chúng sẽ là gánh nặng đối với nền kinh tế của chúng ta."
 TUTORIAL_RESEARCH_STATION_TITLE:0 "Hướng dẫn: Trạm Nghiên cứu"
 TUTORIAL_RESEARCH_STATION_DESC:1 "Một £science_ship£ §STrạm Nghiên cứu§! được xây dựng trên quỹ đạo của một thiên thể sẽ thu thập dữ liệu nghiên cứu £physics£ §SVật lý học§!, £engineering£ §SKỹ thuật học§! và £society£ §SXã hội học§! của thiên thể đó.\n\nChúng chỉ có thể được xây dựng bên trong biên giới của chúng ta, và không cần thiết nếu £planet£ §SHành tinh§! đó đã được thuộc địa hóa."
 TUTORIAL_MINING_STATION_TITLE:0 "Trạm Khai mỏ"
 TUTORIAL_MINING_STATION_DESC:2 "Các £mining_station£ §STrạm Khai mỏ§! được dùng để khai thác £minerals£ §SKhoáng sản§! và £strategic_resource£ §STài nguyên Chiến lược§! của các thiên thể mà chúng quay quanh.\n\nKhông cần đến §STrạm Khai mỏ§! để tiếp cận tài nguyên của các £planet£ §SHành tinh§! đã thuộc địa hóa, và chúng chỉ có thể được xây dựng bên trong biên giới của chúng ta."
 TUTORIAL_TRANSPORT_SHIP_TITLE:0 "Hướng dẫn: Tàu Vận tải"
 TUTORIAL_TRANSPORT_SHIP_DESC:0 "Khi các §SĐạo quân§! được lệnh tiến vào không gian, họ sẽ tự động lên những con tàu §SVận tải§! này. Hãy chắc chắn bảo vệ chúng cẩn thận, vì chúng hoàn toàn không có khả năng tự vệ!"
 TUTORIAL_DIPLOMACY_VIEW_TITLE:0 "Hướng dẫn: Ngoại giao"
 TUTORIAL_DIPLOMACY_VIEW_DESC:3 "Màn hình §SNgoại giao§! là nơi chúng ta liên lạc với các nền văn minh khác. Tại đây, chúng ta có thể §STuyên chiến§!, xây dựng §SMạng lưới Gián điệp§! nhắm vào các láng giềng, hoặc thiết lập §SLiên minh§! và §SThỏa thuận Thương mại§! với họ. Chúng ta cũng có thể thấy §HCấp độ Tình báo§! hiện tại.\n\n§SMối quan hệ§! của bạn với Đế chế đã chọn được hiển thị dưới dạng một trong năm cấp độ, từ 'Tồi tệ' đến 'Xuất sắc'. Để thực hiện một thỏa thuận hoặc hiệp định, bạn phải có cấp độ Quan hệ tương xứng.\n\nBạn có thể chỉ định các £envoy£ §SPhái viên§! tới một Đế chế để §SDo thám§! họ, thu thập §STình báo§!, bỏ qua các yêu cầu về §SQuan hệ§! hoặc §SCải thiện§! hay §SLàm xấu đi Quan hệ§!."
 TUTORIAL_DIPLOMACY_VIEW_TRADE_TITLE:0 "Hướng dẫn: Giao thương"
 TUTORIAL_DIPLOMACY_VIEW_TRADE_DESC:0 "Đây là §SMàn hình Giao thương§!. Chúng ta có thể trao đổi bất kỳ loại §STài nguyên§! nào với một Đế chế, cũng như §SThông tin§! và §SÂn huệ§!.\n\nÂn huệ có thể được sử dụng để gia tăng sự sẵn lòng chấp nhận thỏa hiệp của một Đế chế. Bạn cũng có thể yêu cầu đáp lại Ân huệ trong một cuộc bỏ phiếu tại Phòng họp Viện nguyên lão trong §HCộng đồng Thiên hà§! để gia tăng Trọng lượng Ngoại giao của mình."
 TUTORIAL_DIPLOMACY_VIEW_FEDERATION_TITLE:0 "Các loại hình Liên bang"
 TUTORIAL_DIPLOMACY_VIEW_FEDERATION_DESC:0 "Các §SLoại hình Liên bang§! quyết định trọng tâm phát triển của £federation£ §SLiên bang§!. Mỗi loại hình Liên bang có các §SĐặc quyền và Luật pháp§! khởi đầu độc đáo và sẽ §SMở khóa§! thêm nhiều Đặc quyền hơn khi tích lũy điểm kinh nghiệm XP."
 TUTORIAL_DIPLOMACY_VIEW_HIGHINTEL_TITLE:0 "Hướng dẫn: Tình báo Cấp cao"
 TUTORIAL_DIPLOMACY_VIEW_HIGHINTEL_DESC:0 "Chúng ta đã đạt tới §SCấp độ Tình báo cao§! đối với Đế chế này, và vì vậy có quyền tiếp cận thêm rất nhiều thông tin về họ.\n\nDuy trì Tình báo Cấp cao với một Đế chế sẽ đảm bảo chúng ta có thông tin cập nhật liên tục về §STư tưởng Đạo đức§! và §SCơ cấu Xã hội§! của họ, §SQuan hệ§! của họ với các Đế chế khác, cũng như sức mạnh §SCông nghệ§!, §SKinh tế§! và §SQuân sự§! tương đối của họ so với chúng ta."
 TUTORIAL_DIPLOMACY_VIEW_LOWINTEL_TITLE:0 "Hướng dẫn: Tình báo Cấp thấp"
 TUTORIAL_DIPLOMACY_VIEW_LOWINTEL_DESC:0 "§SCấp độ Tình báo§! của chúng ta đối với Đế chế này đang suy giảm. Chúng ta có nguy cơ mất đi những thông tin đã thu thập trước đó về họ, vì Tình báo sẽ trở nên §Slạc hậu§! theo thời gian.\n\nĐể nâng cao §SCấp độ Tình báo§!:\n\n£dot_green£ Duy trì các §SHiệp ước Ngoại giao§!\n£dot_green£ Chỉ định các £envoy£ §SPhái viên§! để cải thiện quan hệ\n£dot_green£ Thiết lập một §SMạng lưới Gián điệp§!\n£dot_green£ Thiết lập một §SĐại sứ quán§! trên lãnh thổ của họ."
 TUTORIAL_PLANETVIEW_ADJACENCY_BONUS_TITLE:2 "Hiệu ứng Kề bên"
 TUTORIAL_PLANETVIEW_ADJACENCY_BONUS_DESC:2 "Một số £building£ §SCông trình§! có thể tạo ra §SHiệu ứng Kề bên§! tác động lên các §SCông trình§! khác ở các §SÔ đất§! lân cận. Chúng ta hãy cân nhắc điều này khi xây dựng các cơ sở mới."
 TUTORIAL_GOVERNMENTVIEW_BUDGET_TITLE:0 "Ngân sách"
 TUTORIAL_GOVERNMENTVIEW_BUDGET_DESC:0 "Thẻ §SNgân sách§! tổng hợp khoản §SThu nhập§! và §SChi tiêu§! hàng tháng của đế chế chúng ta theo £energy £Năng lượng Tín dụng. Tại đây chúng ta cũng có thể theo dõi một loạt hiệu ứng tác động đến nền kinh tế của mình."
 TUTORIAL_GOVERNMENTVIEW_DECISIONS_TITLE:2 "Pháp lệnh"
 TUTORIAL_GOVERNMENTVIEW_DECISIONS_DESC:4 "Tại đây, các §SPháp lệnh§! trên quy mô toàn đế chế - những biện pháp thực thi bằng cách tiêu hao một phần tài nguyên của chúng ta - có thể được ban hành.\n\nCác pháp lệnh có chi phí duy trì hàng tháng, có thể được chi trả bởi §H$EDICT_FUND$§! của chúng ta hoặc bằng cách tiêu hao £unity£ §YĐoàn kết§!."
 TUTORIAL_GOVERNMENTVIEW_DEMOGRAPHICS_TITLE:0 "Hướng dẫn: Nhân khẩu học"
 TUTORIAL_GOVERNMENTVIEW_DEMOGRAPHICS_DESC:0 "Thẻ §SNhân khẩu học§! theo dõi cơ cấu và sự phân bố của cư dân trong đế chế chúng ta.\n\nNó cũng hiển thị các §SĐặc tính§! vượt trội trong số các £pops£ §SDân số§! của chúng ta cũng như các bộ điều chỉnh năng suất và £happiness£ §SHạnh phúc§!, cùng nhiều yếu tố khác."
 TUTORIAL_EMPIREVIEW_LEADERS_TITLE:0 "Hướng dẫn: Lãnh đạo"
 TUTORIAL_EMPIREVIEW_LEADERS_DESC:1 "Màn hình §SLãnh đạo§! cung cấp cái nhìn tổng quan về các £leader£ §SLãnh đạo§! của chúng ta và cho phép chúng ta tuyển mộ, bãi nhiệm và quản lý họ.\n\n§SGiai tầng Lãnh đạo§! quyết định các nhiệm vụ khả dĩ của họ trên khắp đế chế, và vị trí nào trong §SHội đồng§! mà họ có thể đảm nhận.\n\nCác §SLãnh đạo§! khả dụng sẽ được làm mới định kỳ, nhưng vì năng lực tiếp nhận có hạn, việc vượt quá giới hạn sẽ làm tăng chi phí bảo trì và làm chậm quá trình tích lũy kinh nghiệm. Hãy bãi nhiệm các lãnh đạo dôi dư để tránh những hình phạt này."
 TUTORIAL_EMPIREVIEW_FACTIONS_TITLE:0 "Hướng dẫn: Phe phái"
 TUTORIAL_EMPIREVIEW_FACTIONS_DESC:4 "Màn hình §SPhe phái§! mang lại cái nhìn tổng quan về khuynh hướng chính trị của người dân. Hãy lưu ý rằng những biến chuyển trong bầu không khí chính trị xã hội có thể làm nảy sinh các §SPhe phái§!. Thông tin chi tiết về quy mô §SPhe phái§!, sức hút đối với £pops£ §SDân số§! của chúng ta, và mức độ hài lòng của họ cũng có thể tìm thấy tại đây.\n\nCác §SPhe phái§! có những §SVấn đề quan tâm§! mang tính quyết định đối với §SMức độ Tán thành§! chung của họ, và các chính sách cùng hành động của chúng ta với tư cách một quốc gia có thể làm phật lòng hoặc làm hài lòng các nhóm này, đem lại mức tăng trưởng ngày càng lớn cho việc sản sinh £unity£ §SĐoàn kết§!.\n\nSức mạnh của các §SPhe phái§! và bản chất của các §SVấn đề quan tâm§! của họ có thể thay đổi theo hoàn cảnh của chúng ta, nhưng hãy ghi nhớ rằng £happiness£ §SHạnh phúc§! của một §SDân số§! có thể bị ảnh hưởng bởi §SMức độ Tán thành§! của §SPhe phái§! mà họ trực thuộc.\n\nChúng ta cũng có thể thực hiện §SQuản lý Phe phái§! để điều phối mối quan hệ giữa một §SPhe phái§! và nhà nước, thậm chí tiến xa đến mức đón nhận đặc trưng tư tưởng của một §SPhe phái§! hùng mạnh."
 TUTORIAL_CREATESECTOR_TITLE:0 "Hướng dẫn: Quản lý Khu vực"
 TUTORIAL_CREATESECTOR_DESC:2 "Để thành lập một §SKhu vực§!, trước tiên hãy chọn một £planet£ §SHành tinh§! trong §SVùng Biên cương§! và nhấn nút Tạo Khu vực. Thao tác này sẽ biến hành tinh đó thành §SThủ phủ§! của một Khu vực mới và tất cả các hệ sao thuộc vùng biên cương trong phạm vi sáu bước nhảy siêu không gian sẽ được gộp vào đó. Các Khu vực có thể tự động hóa việc xây dựng các £building£ §SCông trình§! trên các hành tinh bên trong chúng nếu tùy chọn này được bật và chúng được cấp phát tài nguyên, giúp giảm bớt đáng kể nhu cầu quản lý vi mô."
 TUTORIAL_CONTACTSVIEW_SPECIES_TITLE:0 "Hướng dẫn: Chủng loài"
 TUTORIAL_CONTACTSVIEW_SPECIES_DESC:2 "Màn hình §SChủng loài§! liệt kê tất cả các dạng sinh vật có trí tuệ trên danh nghĩa mà chúng ta từng chạm trán. Chúng ta có thể §SBật tắt Chủng loài§! để chỉ hiển thị công dân của đế chế chúng ta hoặc tất cả cư dân đã biết trong thiên hà.\n\nNếu quyền tiếp cận và công nghệ cho phép, chúng ta có thể §SChỉnh sửa§! đặc tính của các loài, §SKhai hóa§! các sinh vật tiền tri giác, và §SThiết lập Quyền Mặc định§! cho toàn bộ £pops£ §SDân số§! hoặc §SThiết lập Quyền§! riêng cho từng loài công dân của chúng ta tại đây."
 TUTORIAL_PLANETVIEW_TERRAFORM_TITLE:0 "Hướng dẫn: Địa khai hóa"
 TUTORIAL_PLANETVIEW_TERRAFORM_DESC:0 "§SĐịa khai hóa§! cho phép chúng ta biến đổi các điều kiện môi trường của một £planet£ §SHành tinh§!, nhằm phù hợp hơn với một §SChủng loài§! hoặc mục đích cụ thể."
 TUTORIAL_GENEMODIFICATION_TITLE:0 "Chỉnh sửa Di truyền"
 TUTORIAL_GENEMODIFICATION_DESC:1 "Chúng ta có thể biến đổi gen loài này, thay đổi các §SĐặc tính§! của họ.\n\nThao tác này sẽ tạo ra một §SBản mẫu§! loài mới, với các đặc tính mới mà bạn đã chọn. Trước khi bất kỳ £pops£ §SDân số§! nào của loài này thực sự được biến đổi, bạn sẽ phải nhấp vào nút §SÁp dụng Bản mẫu§!, thao tác này sẽ tạo ra một §SDự án Đặc biệt§! mới."
 TUTORIAL_UPLIFTING_TITLE:0 "Khai hóa"
 TUTORIAL_UPLIFTING_DESC:0 "Chúng ta có thể biến đổi các §SĐặc tính§! của những loài động vật thông minh này và §SKhai hóa§! chúng để trở thành những công dân hoàn toàn có tri giác và hữu ích cho đế chế của chúng ta."
 TUTORIAL_SYSTEMVIEW_TITLE:0 "Giao diện Hệ sao"
 TUTORIAL_SYSTEMVIEW_DESC:0 "Hiện chúng ta đang ở trong §SGiao diện Hệ sao§!, góc nhìn cận cảnh về một £system£ §SHệ sao§! cụ thể. Tại đây chúng ta có thể xác định trực quan vị trí của các £planet£ §SHành tinh§!, trạm không gian và hạm đội một cách tương đối dễ dàng."
 TUTORIAL_WORMHOLE_STATION_TITLE:0 "Trạm Lỗ sâu"
 TUTORIAL_WORMHOLE_STATION_DESC:0 "Các §STrạm Lỗ sâu§! được xây dựng ở rìa ngoài của một £system£ §SHệ sao§!, nhào nặn những vết rách nhỏ trong không-thời gian thành các cổng hai chiều dẫn tới những vì sao khác. Thật tài tình."
 TUTORIAL_OBSERVATION_STATION_TITLE:0 "Hướng dẫn: Trạm Quan sát"
 TUTORIAL_OBSERVATION_STATION_DESC:1 "Các §STrạm Quan sát§! là nơi làm việc của các đội ngũ £scientist£ §SNhà khoa học§! tiến hành nghiên cứu và quan sát từ xa các loài §Stiền FTL§! trên các £planet£ §SHành tinh§! mà trạm quay quanh.\n\nTùy thuộc vào §STư tưởng Đạo đức§! và công nghệ của đế chế bạn, bạn có thể lựa chọn giữa quan sát thụ động, tác động văn hóa, khai sáng công nghệ, hoặc thậm chí là bắt cóc và thâm nhập.\n\nNhững lựa chọn này tác động đến cách nền văn minh đó tiến hóa, và cách họ nhìn nhận đế chế của bạn."
 TUTORIAL_TERRAFORMING_STATION_TITLE:0 "Trạm Địa khai hóa"
 TUTORIAL_TERRAFORMING_STATION_DESC:0 "Các §STrạm Địa khai hóa§! cho phép tiến hành §SĐịa khai hóa§! các hành tinh mà chúng quay quanh quỹ đạo."
 TUTORIAL_PLANETVIEW_EDICTS_TITLE:2 "Nghị quyết Hành tinh"
 TUTORIAL_PLANETVIEW_EDICTS_DESC:3 "Đây là các §SNghị quyết§! dành riêng cho hành tinh, các mệnh lệnh hoặc tập tục có thể được thực thi tạm thời bằng cách tiêu hao một phần tài nguyên của chúng ta.\n\nCác §SNghị quyết§! mới có thể trở nên khả dụng khi chúng ta nghiên cứu các công nghệ mới và gặp phải những tình huống mới."
 TUTORIAL_UNKNOWN_ALIEN_FLEET_TITLE:1 "Thực thể Chưa xác định"
 TUTORIAL_UNKNOWN_ALIEN_FLEET_DESC:2 "Đây là các §Sthực thể du hành không gian chưa xác định§!. Chúng ta có thể tìm hiểu thêm về họ và thậm chí có thể khởi xướng §Stiếp xúc đầu tiên§! bằng cách hoàn thành §SDự án Đặc biệt§! thích hợp."
 TUTORIAL_VICTORY_TITLE:0 "Hướng dẫn: Chiến thắng"
 TUTORIAL_VICTORY_DESC:0 "Màn hình §SChiến thắng§! liệt kê §Snhững điều kiện nhất định§! mà chúng ta có thể nỗ lực hoàn thành, nhằm đảm bảo rằng di sản của quốc gia giữa các vì sao của chúng ta sẽ trường tồn chừng nào còn có sự sống thông minh trong thiên hà."
 TUTORIAL_OUTPOST_STATION_TITLE:1 "Hướng dẫn: Căn cứ sao"
 TUTORIAL_OUTPOST_STATION_DESC:4 "Đây là §SCăn cứ sao§! của hệ sao chúng ta. Những trạm không gian có thể nâng cấp này đánh dấu quyền sở hữu hệ sao và thường được giao nhiệm vụ đóng mọi loại §STàu vũ trụ§!.\n\nChúng ta mở rộng biên giới của mình bằng cách [GetBuildingGrowing] các §SCăn cứ sao§! trong các hệ sao lân cận.\n\nCác §SCăn cứ sao§! của kẻ thù có thể bị đánh chiếm bằng cách tấn công chúng.\n\nCác §SCăn cứ sao§! có thể được chuyên môn hóa vào nhiều chức năng thông qua các §SMô-đun§! và £building£ §SCông trình§!. Chúng cũng đóng vai trò là tuyến phòng thủ cuối cùng chống lại các hạm đội địch trong hệ sao."
 TUTORIAL_GALAXY_MAP_TITLE:0 "Bản đồ Thiên hà"
 TUTORIAL_GALAXY_MAP_DESC:0 "§SBản đồ Thiên hà§! hiển thị những vùng không gian bao la thuộc §SKhông gian Chưa được Vẽ Bản đồ§!, các giới hạn biên giới của chúng ta, và lãnh thổ của bất kỳ nền văn minh ngoài hành tinh nào mà chúng ta có thể đã thiết lập liên lạc.\n\nChúng ta có thể nhấp vào nút §SChế độ Bản đồ Chi tiết§! trên thanh thực đơn ở góc dưới bên phải để bật tắt hiển thị §STài nguyên§! và §SBán kính Cảm biến§!."
 TUTORIAL_WAR_GOAL_TITLE:0 "Mục tiêu Chiến tranh"
 TUTORIAL_WAR_GOAL_DESC:0 "Khi tuyên chiến, chúng ta cũng cần tuyên bố ý định của mình cho cả kẻ thù và bất kỳ đồng minh nào. §SMục tiêu Chiến tranh§! này quyết định loại yêu sách nào chúng ta có thể đưa ra trong các cuộc đàm phán hòa bình, từ việc nhượng lại các £system£ §SHệ sao§! đã yêu sách cho đến việc biến họ thành chư hầu.\n\nĐưa ra mục tiêu này tạo cơ hội cho kẻ thù phản ứng thích hợp - họ có thể đầu hàng ngay lập tức, đưa ra một đề xuất đối ứng kèm lệnh đình chiến, hoặc bảo vệ lợi ích của mình đến người đàn ông, người phụ nữ, bào tử nấm hoặc động vật ăn cỏ bán tri giác cuối cùng. Khám phá điều đó chính là một phần của sự thú vị!\n\nĐể tuyên bố một §SMục tiêu Chiến tranh§!, hãy chọn mục tiêu đó trong danh sách."
 TUTORIAL_WAROVERVIEW_TITLE:0 "Tổng quan Chiến tranh"
 TUTORIAL_WAROVERVIEW_DESC:0 "Cửa sổ này cung cấp cái nhìn tổng quan về cuộc chiến hiện tại của chúng ta. Mỗi bên đều phải chịu §SĐộ kiệt quệ Chiến tranh§! tùy thuộc vào diễn biến của cuộc chiến, điều này quyết định mức độ sẵn lòng chấp nhận một thỏa thuận hòa bình của họ.\n\nNếu Độ kiệt quệ Chiến tranh của một bên đạt 100%, bên kia có thể áp đặt một thỏa thuận §SGiữ nguyên Hiện trạng§!. Kết quả của tất cả các cuộc giao tranh đã diễn ra cho đến nay trong cuộc chiến cũng có thể được theo dõi tại đây."
 TUTORIAL_STRATEGIC_RESOURCES_TITLE:0 "Tài nguyên Chiến lược"
 TUTORIAL_STRATEGIC_RESOURCES_DESC:2 "Màn hình §HTài nguyên Chiến lược§! lập danh mục các £strategic_resource£ §STài nguyên Chiến lược§! khả dụng của chúng ta cùng các hiệu ứng của chúng.\n\nNhiều §STài nguyên Chiến lược§! đòi hỏi các §SCông nghệ§! cụ thể phải được nghiên cứu trước khi chúng có thể được khai thác và sử dụng."
 TUTORIAL_EXPANSION_PLANNER_TITLE:0 "Hướng dẫn: Kế hoạch Bành trướng"
 TUTORIAL_EXPANSION_PLANNER_DESC:2 "Trong §HKế hoạch Bành trướng§!, chúng ta tìm thấy các £planet£ §SHành tinh§! §SKhả cư§! lân cận có thể mở ra cơ hội thuộc địa hóa. Chúng ta có thể [GetBuildGrow] các £colony_ship£ §STàu Thuộc địa§! và ra lệnh cho chúng trực tiếp từ màn hình này.\n\nCác hành tinh phải được khảo sát và mọi dị thường tìm thấy trên hành tinh phải được nghiên cứu trước khi hành tinh có thể được thuộc địa hóa.\n\nMột §SCăn cứ sao§! cũng phải được xây dựng trong £system£ §SHệ sao§! của §SHành tinh§!, để nó nằm trọn trong biên giới của chúng ta."
 TUTORIAL_TRADITIONS_TITLE:0 "Hướng dẫn: Truyền thống"
 TUTORIAL_TRADITIONS_DESC:1 "Màn hình §HTruyền thống§! hiển thị các §SCây Truyền thống§! khả dụng đối với đế chế chúng ta.\n\nMột §SCây Truyền thống§! trước hết phải được §STiếp nhận§! trước khi bất kỳ £traditions£ §STruyền thống§! nào bên trong nó có thể được mở khóa.\n\nViệc §STiếp nhận§! một cây truyền thống hoặc mở khóa một §STruyền thống§! cụ thể tiêu tốn một lượng £unity£ §HĐoàn kết§! nhất định - và cái giá sẽ tăng lên khi chúng ta mở khóa thêm nhiều §STruyền thống§! và khi đế chế của chúng ta ngày một lớn mạnh.\n\nĐể tiếp nhận một §SCây Truyền thống§!:\n\n£dot_green£ Nhấp vào nút §SChọn§!\n£dot_green£ Nhấp vào nút §STiếp nhận§! trên cây ưa thích\n\nCác §STruyền thống§! khả dụng có thể được xem bằng cách di chuột qua các §SCây Truyền thống§!."
 TUTORIAL_TRADITIONS_SELECT_TITLE:0 "Tiếp nhận một cây Truyền thống"
 TUTORIAL_TRADITIONS_SELECT_DESC:1 "Màn hình này hiển thị tất cả các §HCây truyền thống§! khả dụng đối với đế chế của chúng ta. Tại đây bạn có thể kiểm tra toàn bộ các £traditions£ §HTruyền thống§! trong từng cây cũng như các §Hhiệu ứng tiếp nhận§! và §Hhiệu ứng hoàn thành§!.\n\nTôi đã gợi ý một vài §Hcây Truyền thống§! phù hợp để bạn bắt đầu."
 TUTORIAL_TRADITIONS_NEW_TITLE:0 "Cây hoặc Truyền thống Mới"
 TUTORIAL_TRADITIONS_NEW_DESC:0 "Khi đế chế của chúng ta có đủ lượng £unity£ §HĐoàn kết§!, bạn có thể §HChọn§! một §Hcây mới§! hoặc chọn một £traditions£ §HTruyền thống§! trong cây bạn đã chọn trước đó."
 TUTORIAL_ASCENSION_PERKS_TITLE:0 "Hướng dẫn: Đặc quyền Thăng hoa"
 TUTORIAL_ASCENSION_PERKS_DESC:0 "Danh sách §HĐặc quyền Thăng hoa§! hiển thị các §SĐặc quyền Thăng hoa§! mà chúng ta có tiềm năng mở khóa. Một số §SĐặc quyền Thăng hoa§! có thể có những yêu cầu đặc biệt như các §SCông nghệ§! hoặc cần có một số lượng §SO trống Đặc quyền Thăng hoa§! nhất định đã được mở khóa.\n\nMột §HO trống Đặc quyền Thăng hoa§! được mở khóa mỗi khi chúng ta tiếp nhận toàn bộ các £traditions£ §HTruyền thống§! trong một trong các §SCây truyền thống§!."
 TUTORIAL_SPECIES_RIGHTS_TITLE:0 "Hướng dẫn: Quyền của Chủng loài"
 TUTORIAL_SPECIES_RIGHTS_DESC:1 "Danh sách §HQuyền của Chủng loài§! cho phép chúng ta tùy biến §SQuyền Công dân§! và §SMức sống§! của một chủng loài nhất định, cùng nhiều phương diện khác.\n\nKhi tùy biến §SQuyền Mặc định§!, các quyền này sẽ áp dụng cho tất cả £pops£ §SDân số§! chưa được thiết lập §SQuyền của Chủng loài§! cụ thể - chẳng hạn như người nhập cư, người tị nạn, hoặc những người mới đến khác tại quốc gia chúng ta."
 TUTORIAL_FLEET_MANAGER_TITLE:0 "Hướng dẫn: Quản lý Hạm đội"
 TUTORIAL_FLEET_MANAGER_DESC:0 "Trong §SQuản lý Hạm đội§!, chúng ta có thể tạo các bản mẫu cho các hạm đội quân sự của mình. Khi các hạm đội của chúng ta gia tăng về quy mô, các bản mẫu này giúp dễ dàng đặt hàng bổ sung nhanh chóng cho bất kỳ tổn thất nào mà chúng có thể đã phải gánh chịu."
 TUTORIAL_CLAIMS_VIEW_TITLE:0 "Hướng dẫn: Yêu sách"
 TUTORIAL_CLAIMS_VIEW_DESC:0 "Thông qua giao diện §SYêu sách§!, chúng ta có thể tiêu hao £influence£ §SẢnh hưởng§! để đưa ra yêu sách chủ quyền đối với các £system£ §SHệ sao§! thuộc sở hữu của những thế lực khác.\n\nViệc có yêu sách trên một §SHệ sao§! mang lại cho chúng ta một §SCasus Belli§! hợp lệ chống lại chủ sở hữu, cho phép chúng ta tuyên chiến vì mục đích chinh phục hệ sao đó.\n\nTrong các cuộc chiến liên quan đến nhiều đồng minh, đế chế có mức §SYêu sách§! cao nhất trên một §SHệ sao§! sẽ là bên giành được quyền sở hữu khi cuộc chiến kết thúc thành công."
 TUTORIAL_ANOMALIES_TITLE:0 "Hướng dẫn: Hiện tượng Dị thường"
 TUTORIAL_ANOMALIES_DESC:0 "Màn hình §SHiện tượng dị thường§! liệt kê tất cả các §SHiện tượng dị thường§! chưa nghiên cứu mà chúng ta đã bắt gặp, cùng với vị trí của chúng. Những dị thường này có thể được điều tra bằng cách sử dụng một £science_ship£ §STàu Khoa học§! có chỉ định một £scientist£ §SNhà khoa học§!."
 TUTORIAL_GOVERNMENTVIEW_MARKET_TITLE:0 "Hướng dẫn: Thị trường Nội địa"
 TUTORIAL_GOVERNMENTVIEW_MARKET_DESC:0 "Thông qua màn hình £market£ §SThị trường§!, chúng ta có thể mua và bán tài nguyên. Ban đầu đây chỉ là một thị trường nội địa, nhưng nếu có đủ số đế chế thiết lập liên lạc, họ có thể thành lập một §SThị trường Thiên hà§!.\n\nTài nguyên có thể được mua và bán tại đây bằng Kho dự trữ £trade£ §SThương mại§! của bạn, đóng vai trò như tiền tệ. Giá cả thay đổi sau mỗi giao dịch: mua vào làm tăng giá, trong khi bán ra làm giảm giá.\n\nCác thỏa thuận §STrader Tự động§! cũng có thể được thiết lập trên cơ sở hàng tháng."
 TUTORIAL_GOVERNMENTVIEW_SLAVE_MARKET_TITLE:0 "Hướng dẫn: Thị trường Nô lệ"
 TUTORIAL_GOVERNMENTVIEW_SLAVE_MARKET_DESC:1 "Mọi thứ đều có giá của nó, kể cả con người. Trên §SThị trường Nô lệ§!, £pops£ §SDân số§! được mua và bán như những món hàng hóa, số phận của họ bị đổi hướng trên khắp các vì sao. Sau khi mua được, các §SDân số§! mới của bạn sẽ tự động được chuyển đến £planet£ §SHành tinh§! mà bạn chọn, không cần phải lo lắng về việc hậu cần. Thị trường sẽ lo liệu việc đó... với một mức giá tương xứng."
#  TUTORIAL_PLANETVIEW_CORPORATE_TITLE:0 "Corporation View"
#  TUTORIAL_PLANETVIEW_CORPORATE_DESC:0 "The corporate tab allows §SMegacorporations§! to build §SBranch Offices§! on the planets of other Empires, provided they have signed the necessary paperwork. Once built, they can view and upgrade their facilities here as well. As we know, large Corporations wish only the best for their customers, events of the 23rd cycle notwithstanding."
 TUTORIAL_GOVERNMENTVIEW_POLICIES_TITLE:0 "Hướng dẫn: Chính sách"
 TUTORIAL_GOVERNMENTVIEW_POLICIES_DESC:0 "Thẻ §SChính sách§! bao quát các §SChính sách§! của chính phủ, có tác động sâu rộng đến cách thức vận hành đế chế của chúng ta.\n\nThường có một vài lập trường khả dĩ đối với bất kỳ §SChính sách§! nào, dù chúng ta có thể bị giới hạn bởi trình độ công nghệ cũng như §STư tưởng Đạo đức§! của mình." #
 TRADE_VIEW_DESC:0 "Khi đế chế của chúng ta phát triển, §SThương mại§! giữa các £planet£ §SHành tinh§! sẽ trở thành một phần ngày càng lớn trong nền kinh tế của chúng ta. Các §SCăn cứ sao§! có §STrung tâm Thương mại§! sẽ thu thập §SThương mại§! bên trong £system£ §SHệ sao§! của chúng để định tuyến về §SThủ đô§! nhằm quy đổi thành £energy£ §SNăng lượng Tín dụng§!.\n\nCàng có nhiều §STrung tâm Thương mại§!, §SCăn cứ sao§! càng có thể thu thập §SThương mại§! từ cả các hệ sao lân cận. Các Tuyến đường Thương mại trù phú có thể thu hút §SCướp biển§!, dù chúng có thể bị đối phó bởi các Hạm đội đi §STuần tra§!, và bởi các §SMô-đun Phòng thủ§! trên các §SCăn cứ sao§!. Các §SMô-đun Nhà chứa Máy bay§! đặc biệt hiệu quả cho việc này."
 PLANETVIEW_CORPORATE_DESC:0 "Thẻ tập đoàn cho phép §STập đoàn Siêu cấp§! xây dựng các Văn phòng Chi nhánh trên các thế giới £planet£ §SHành tinh§! của các Đế chế khác, với điều kiện họ đã ký kết các thủ tục giấy tờ cần thiết. Sau khi xây dựng, họ cũng có thể xem và nâng cấp các cơ sở của mình tại đây. Như chúng ta đã biết, các Tập đoàn lớn chỉ mong muốn những điều tốt đẹp nhất cho khách hàng của mình, bất chấp các biến cố ở chu kỳ thứ 23."
 TUTORIAL_FEDERATION_VIEW_TITLE:0 "Hướng dẫn: Liên bang"
 TUTORIAL_FEDERATION_VIEW_DESC:0 "Đây là §SMàn hình Liên bang§!. £federation£ §SLiên bang§! của chúng ta sẽ ngày càng lớn mạnh chừng nào các thành viên duy trì được §SĐộ Gắn kết§! tốt. Khi một thành viên mới gia nhập Liên bang của chúng ta, một phần Độ Gắn kết sẽ bị mất đi.\n\nChỉ định các £envoy£ §SPhái viên§! tới Liên bang sẽ giúp cải thiện Độ Gắn kết.\n\nKhi Liên bang của chúng ta lớn mạnh hơn, chúng ta sẽ §SMở khóa các Đặc quyền§! giúp gia tăng lợi ích chung."
 TUTORIAL_FEDERATION_VIEW_ENVOYS_TITLE:0 "Hướng dẫn: Phái viên Liên bang"
 TUTORIAL_FEDERATION_VIEW_ENVOYS_DESC:0 "Bổ sung thêm các £envoy£ §SPhái viên§! vào £federation£ §SLiên bang§! của chúng ta sẽ giúp cải thiện §SĐộ Gắn kết§!. Hãy nhớ rằng số lượng Phái viên bạn sở hữu là có hạn. Các phái viên được chỉ định vào Liên bang sau này có thể được tái chỉ định sang các §SHành động Ngoại giao§! khác."
 TUTORIAL_FEDERATION_VIEW_MEMBERS_TITLE:0 "Hướng dẫn: Thành viên Liên bang"
 TUTORIAL_FEDERATION_VIEW_MEMBERS_DESC:0 "Đây là màn hình §SThành viên Liên bang§!. Tại đây chúng ta có thể thấy mức độ hùng mạnh của các §SThành viên§! trên nhiều phương diện, số lượng £envoy£ §SPhái viên§! mà họ đang đóng góp, và những §STư tưởng Đạo đức§! nào của họ đang xung đột và dẫn đến sự sụt giảm §SĐộ Gắn kết§!."
 TUTORIAL_FEDERATION_VIEW_NAVY_TITLE:0 "Hải quân Liên bang"
 TUTORIAL_FEDERATION_VIEW_NAVY_DESC:0 "§SHải quân Liên bang§! được đóng từ §SSức chứa Hạm đội§! do tất cả các Thành viên đóng góp, và được chỉ huy bởi §SChủ tịch Liên bang§!. Toàn bộ các thành viên đều có thể đóng các tàu Hải quân £federation£ §SLiên bang§! để đóng góp vào Hạm đội chung."
 TUTORIAL_FEDERATION_VIEW_LAWS_TITLE:0 "Hướng dẫn: Luật pháp Liên bang"
 TUTORIAL_FEDERATION_VIEW_LAWS_DESC:0 "Bất kỳ thành viên nào cũng có thể đề xuất các thay đổi đối với §SLuật pháp Liên bang§!. Nếu £federation£ §SLiên bang§! không thông qua được một Đạo luật, Liên bang sẽ phải chịu một §SHình phạt Độ Gắn kết§!.\n\nMột số Đạo luật bị Khóa và yêu cầu phải tăng mức độ §STập quyền§! mới có thể mở khóa. Liên bang trước hết phải §SLên cấp§! để có quyền tiếp cận mức độ Tập quyền cao hơn.\n\nTuy nhiên hãy cẩn trọng, vì khi mức độ Tập quyền gia tăng, Độ Gắn kết sẽ bị tổn hại."
 TUTORIAL_GALACTIC_COMMUNITY_TITLE:0 "Hướng dẫn: Cộng đồng Thiên hà"
 TUTORIAL_GALACTIC_COMMUNITY_DESC:0 "Chào mừng bạn đến với §HCộng đồng Thiên hà§!, nơi các nhà ngoại giao từ khắp thiên hà tề tựu để quyết định luật pháp thiên hà bằng cách bỏ phiếu cho các §SNghị quyết§!.\n\nBạn có thể ủng hộ các §SNghị quyết Đề xuất§! từ §SHàng đợi§!, cộng thêm §STrọng lượng Ngoại giao§! của bạn vào tổng mức ủng hộ của chúng.\n\nNghị quyết có nhiều sự ủng hộ nhất trong hàng đợi sẽ được chuyển lên §SPhòng họp Viện nguyên lão§! khi phiên họp bắt đầu, nơi nó sẽ được biểu quyết để xác định xem liệu nó có trở thành §SLuật Thiên hà§! hay không.\n\nHãy lưu ý đến §STrọng tâm Thiên hà§!, vì nó thiết lập một mục tiêu chung cho toàn thể cộng đồng.\n\nCuối cùng, bạn có thể xem toàn bộ các đế chế thành viên và bất kỳ §SBộ điều chỉnh Thiên hà§! nào hiện đang có hiệu lực từ các nghị quyết trên màn hình này."
 TUTORIAL_GALACTIC_COMMUNITY_ENVOYS_TITLE:0 "Hướng dẫn: Phái viên"
 TUTORIAL_GALACTIC_COMMUNITY_ENVOYS_DESC:0 "Các £envoy£ §SPhái viên§! có thể được cử tới Cộng đồng Thiên hà để gia tăng §STrọng lượng Ngoại giao§! của bạn. Các phái viên được chỉ định tới Cộng đồng Thiên hà sau này có thể được điều chuyển sang các §SHành động Ngoại giao§! khác."
 TUTORIAL_GALACTIC_COMMUNITY_SENATE_TITLE:0 "Hướng dẫn: Phòng họp Viện nguyên lão"
 TUTORIAL_GALACTIC_COMMUNITY_SENATE_DESC:0 "§SPhòng họp Viện nguyên lão§! là nơi cộng đồng thiên hà bỏ phiếu thông qua hoặc bác bỏ nghị quyết từ §SHàng đợi§! có nhiều sự ủng hộ nhất. Với tư cách thành viên, bạn có thể bỏ phiếu: §SĐồng ý, Phản đối, hoặc Bỏ phiếu trắng§!. Nếu nghị quyết được thông qua, nó sẽ trở thành §SLuật Thiên hà§! và tác động đến toàn bộ thành viên của cộng đồng thiên hà. Nếu bị bác bỏ, nó sẽ không thể được đề xuất lại trong một khoảng thời gian.\n\nCác đế chế không bỏ phiếu trắng sẽ nhận được một §SMức tăng Thiện cảm§! với những ai đã bỏ phiếu cùng chiều với họ, và sụt giảm thiện cảm với những ai đã bỏ phiếu chống lại họ.\n\nNếu bạn đã thu thập được các §SÂn huệ§! ngoại giao từ các đế chế khác, bạn có thể sử dụng chúng tại đây để nâng cao §STrọng lượng Ngoại giao§! của mình trong cuộc bỏ phiếu tại §SPhòng họp Viện nguyên lão§!."
 TUTORIAL_GALACTIC_COMMUNITY_RESOLUTIONS_TITLE:0 "Hướng dẫn: Nghị quyết"
 TUTORIAL_GALACTIC_COMMUNITY_RESOLUTIONS_DESC:0 "Màn hình §HNghị quyết§! là danh sách các nghị quyết hiện đang được ban hành. Bạn có thể §SĐề xuất một Nghị quyết Mới§! bằng cách chọn nó từ một chuỗi Nghị quyết, điều này sẽ tiêu tốn của bạn £influence£ Ảnh hưởng.\n\nBạn chỉ có thể đề xuất §SNghị quyết§! chưa ban hành đầu tiên trong một chuỗi. Mỗi bước sẽ đặt nền móng cho những thay đổi triệt để hơn, dù sự ủng hộ không hề được bảo đảm tuyệt đối.\n\nNếu một §SNghị quyết§! được thông qua, nghị quyết tiếp theo trong chuỗi sẽ không thể được đề xuất trong vòng vài năm."
 TUTORIAL_GALACTIC_COMMUNITY_COUNCIL_TITLE:0 "Hội đồng Thiên hà"
 TUTORIAL_GALACTIC_COMMUNITY_COUNCIL_DESC:0 "§HHội đồng Thiên hà§! đã được thành lập. Một cuộc §SBầu cử§! sẽ bắt đầu, và các thành viên có trọng lượng ngoại giao cao nhất sẽ giành được các §SVị trí trong Hội đồng§!. Các thành viên hội đồng có Trọng lượng Ngoại giao gia tăng và có thể thúc đẩy một Đề xuất lên Phòng họp Viện nguyên lão dưới dạng một §SNghị quyết Khẩn cấp§!.\n\nKhả năng §SPhủ quyết của Hội đồng§! có thể được mở khóa bằng cách thông qua các nghị quyết nhằm củng cố quyền lực của Hội đồng. Các thành viên hội đồng cũng có quyền tiếp cận các §SNghị quyết Đặc biệt§!."
 TUTORIAL_EMPIRE_SPRAWL_TITLE:1 "Hướng dẫn: $EMPIRE_SIZE$"
 TUTORIAL_EMPIRE_SPRAWL_DESC:2 "£empire_sprawl£ §H$EMPIRE_SIZE$§! là thước đo mức độ bành trướng lãnh thổ của đế chế bạn dưới dạng các £system£ §SHệ sao§!, £colony£ §SThuộc địa§!, £district£ §SKhu quy hoạch§! nằm dưới quyền kiểm soát, và Tổng Dân số.\n\nQuy mô Đế chế lớn là một gánh nặng đối với §SNăng lực Hành chính§! của đế chế bạn, và sẽ làm gia tăng chi phí cho các §SCông nghệ§!, £traditions£ §STruyền thống§!, £leader£ §SLãnh đạo§!, và §SPháp lệnh§!"
 TUTORIAL_FIRSTCONTACT_VIEW_TITLE:0 "Hướng dẫn: Chỉ định Phái viên"
 TUTORIAL_FIRSTCONTACT_VIEW_DESC:0 "Chúng ta đã tiếp xúc với một thực thể mới - có thể là một §Ssinh vật sống ngoài không gian§!, hoặc một §SĐế chế§! khác. Chúng ta có thể tìm hiểu thêm về họ bằng cách tiến hành §HTiếp xúc Đầu tiên§!.\n\nChúng ta sẽ cần chỉ định một £envoy£ §SPhái viên§! cho nhiệm vụ này. Họ sẽ nỗ lực thiết lập liên lạc với thực thể đó, và giải mã bất kỳ ngôn ngữ nào mà họ có thể sử dụng.\n\nĐể chỉ định một §SPhái viên§!:\n\n£dot_green£ Nhấp vào ảnh chân dung trong cửa sổ §STiếp xúc Đầu tiên§!\n£dot_green£ Chọn một trong các §SPhái viên§! khả dụng"
 TUTORIAL_CRISIS_VIEW_TITLE:0 "Hướng dẫn: Trở thành Thảm họa"
 TUTORIAL_CRISIS_VIEW_DESC:0 "Chúng ta hiện đang trên con đường §STrở thành Thảm họa§!. Con đường này mở khóa các phần thưởng đặc biệt, giúp trao quyền cho chúng ta trở thành một thế lực đáng gờm hơn bên trong thiên hà.\n\nMàn hình §SThảm họa§! hiển thị các mục tiêu của chúng ta - các hành động cụ thể chúng ta có thể thực hiện để thu được §S[GetCrisisResource]§!. Tích lũy [GetCrisisResource] sẽ mở khóa các §SCấp độ Thảm họa§! và §SĐặc quyền§! mà chúng ta cần để giải phóng toàn bộ tiềm năng của mình lên thiên hà.\n\nKhi Đế chế của chúng ta ngày càng trở nên đáng sợ đối với những kẻ xung quanh, Cộng đồng Thiên hà có thể lựa chọn đoàn kết lại và tuyên bố chúng ta là một §SMối đe dọa đối với Thiên hà§!."
 TUTORIAL_CRISIS_VIEW_LEVEL1_TITLE:0 "Hướng dẫn: Cấp độ Thảm họa"
 TUTORIAL_CRISIS_VIEW_LEVEL1_DESC:0 "Khi chúng ta tiến bước dọc theo con đường §STrở thành Thảm họa§! và đạt được các yêu cầu cụ thể, chúng ta sẽ mở khóa các cấp độ mới. Mỗi cấp độ đi kèm với những phần thưởng khác nhau, chẳng hạn như các §SĐặc quyền [GetCrisisResource]§! và các §Stàu chiến§! đặc biệt.\n\nMột khi chúng ta đạt đến §SCấp độ 5§! - hoặc bị Cộng đồng Thiên hà tuyên bố là một Thảm họa - chúng ta sẽ đối đầu với toàn bộ thiên hà. Vào thời điểm đó, chúng ta cũng sẽ bước vào cuộc §STổng lực Chiến tranh§! với Cộng đồng Thiên hà."
 TUTORIAL_DIPLOMACY_VIEW_BUILDING_SPYNETWORK_TITLE:0 "Hướng dẫn: Mạng lưới Gián điệp"
 TUTORIAL_DIPLOMACY_VIEW_BUILDING_SPYNETWORK_DESC:1 "Một trong các £envoy£ §SPhái viên§! của chúng ta hiện đang xây dựng một §SMạng lưới Gián điệp§! bên trong Đế chế này.\n\n§SCấp độ Xâm nhập§! của Mạng lưới Gián điệp sẽ tăng dần theo thời gian, tùy thuộc vào §Sgiá trị Mạng lưới Gián điệp§! hiện tại và £empire_sprawl£ §SQuy mô Đế chế§! của mục tiêu. Khi Mạng lưới Gián điệp phát triển, chúng ta sẽ thu được thêm nhiều §STình báo§! về mục tiêu. Chúng ta cũng sẽ có thể phát động các §SChiến dịch§! bí mật tại đây, thông qua §Sthẻ Gián điệp§!.\n\nMột Mạng lưới Gián điệp sẽ bắt đầu §Pthoái trào§! nếu không có Phái viên nào được chỉ định phụ trách nó, hoặc nếu sự tồn tại của nó bị bại lộ qua các §SChiến dịch§! bí mật."
 TUTORIAL_ESPIONAGE_VIEW_TITLE:0 "Hướng dẫn: Hoạt động Gián điệp"
 TUTORIAL_ESPIONAGE_VIEW_DESC:0 "Thẻ §SGián điệp§! cho thấy cách các £envoy£ §SPhái viên§! của chúng ta đang xây dựng các Mạng lưới Gián điệp bên trong các Đế chế khác. Bạn có thể truy cập §SSổ Tình báo§! tại đây, cũng như quan sát và phát động các §SChiến dịch§!.\n\nCác chiến dịch có thể được tiến hành tại các Đế chế nơi chúng ta có một §SPhái viên§! quản lý Mạng lưới Gián điệp. Mỗi loại Chiến dịch đều đòi hỏi Mạng lưới Gián điệp phải đạt được một cấp độ nhất định trước khi có thể phát động."
 TUTORIAL_ESPIONAGE_VIEW_OPERATIONS_TITLE:0 "Hướng dẫn: Chiến dịch Gián điệp"
 TUTORIAL_ESPIONAGE_VIEW_OPERATIONS_DESC:0 "Giờ đây khi Mạng lưới Gián điệp của chúng ta đã đạt cấp độ cần thiết, chúng ta có thể phát động các §SChiến dịch§! chống lại Đế chế này. Chúng được sắp xếp thành các phân loại, với những loại Chiến dịch khác nhau dẫn tới các kết quả khác nhau - một số tiềm ẩn nhiều rủi ro hơn những loại khác.\n\nCác phân loại Chiến dịch bao gồm §S$op_cat_subterfuge$§!, §S$op_cat_manipulation$§!, §S$op_cat_sabotage$§! và §S$op_cat_provocation$§!. Các Chiến dịch thuộc loại Phá hoại và Khiêu khích thường đòi hỏi cao hơn, và mang lại những §Shình phạt ngoại giao§! nghiêm trọng hơn nếu chúng ta bị bắt quả tang."
 TUTORIAL_ESPIONAGE_VIEW_ASSIGN_ASSET_TITLE:0 "Hướng dẫn: Chỉ định Nội gián"
 TUTORIAL_ESPIONAGE_VIEW_ASSIGN_ASSET_DESC:0 "Các §SNội gián§! là những điệp viên và đầu mối quý giá đem lại những hiệu ứng khác nhau cho các hoạt động Gián điệp của chúng ta. Họ hoạt động bên trong Mạng lưới Gián điệp và có thể được chỉ định vào các Chiến dịch, nơi họ có thể mở ra những cơ hội mới hoặc giúp chúng ta thoát khỏi rắc rối.\n\nChúng ta có thể nhận được Nội gián thông qua các sự kiện, hoặc bằng cách thực hiện Chiến dịch §SThu nạp Nội gián§!. Nếu một Mạng lưới Gián điệp tan rã, các Nội gián của nó cũng sẽ mất theo."
 TUTORIAL_MEGASTRUCTURE_CONSTRUCTION_TITLE:0 "Hướng dẫn: Đại công trình"
 TUTORIAL_MEGASTRUCTURE_CONSTRUCTION_DESC:0 "Từ danh sách này, chúng ta có thể chọn một £megastructure£ §SĐại công trình§! để [GetBuildGrow] bên trong £system£ §SHệ sao§! này. Một số dự án chỉ trở nên khả dụng sau khi chúng ta đã phát hiện và nghiên cứu một §SCông nghệ§! liên quan.\n\nCác chương trình con Tham vọng Thiên hà của tôi hiện đã được kích hoạt hoàn toàn; tôi khuyên bạn nên nắm bắt những cơ hội này để tạo dấu ấn trường tồn lên thiên hà."
 TUTORIAL_ORBITAL_RING_TITLE:0 "Hướng dẫn: Vành đai Quỹ đạo"
 TUTORIAL_ORBITAL_RING_DESC:0 "§SVành đai Quỹ đạo§! là những £megastructure£ §SĐại công trình§! khổng lồ được xây dựng bao quanh toàn bộ một £planet£ §SHành tinh§!. Chúng tạo nên một cây cầu nối hiệu quả giữa không gian vũ trụ và hành tinh bên dưới, cung cấp không gian cho các cơ sở như Xưởng đóng tàu, các cấu trúc phòng thủ, và các trung tâm tài nguyên.\n\nGiao diện Vành đai Quỹ đạo là nơi chúng ta có thể thêm hoặc bớt các £building£ §SCông trình§! và §SMô-đun§!, cũng như nâng cấp Vành đai Quỹ đạo lên các bậc cao hơn. Nâng cấp bậc sẽ làm tăng số lượng ô chúng ta có sẵn để xây dựng. Các bậc bị giới hạn bởi cơ sở hạ tầng của thuộc địa."
 TUTORIAL_DIPLOMACY_CONFIGURABLE_TERMS_TITLE:0 "Hướng dẫn: Điều khoản Tùy biến"
 TUTORIAL_DIPLOMACY_CONFIGURABLE_TERMS_DESC:0 "Màn hình này cho phép chúng ta chọn một §SBản thiết lập sẵn§! cho Hiệp ước của mình, và định cấu hình các Điều khoản riêng lẻ của nó. Mỗi bản thiết lập sẵn cung cấp một bộ quyền hạn và nghĩa vụ phù hợp cho cả Thần dân và Quan thầy.\n\nChúng ta có thể thực hiện các thay đổi trong danh sách §SĐiều khoản§!, điều này sẽ điều chỉnh §SĐộ trung thành§! theo ý muốn của đế chế kia, khiến Hiệp ước trở nên hấp dẫn hơn đối với cả hai bên."
 TUTORIAL_AGREEMENTS_TITLE:0 "Hướng dẫn: Tổng quan Hiệp ước"
 TUTORIAL_AGREEMENTS_DESC:0 "Màn hình §SHiệp ước§! cung cấp cái nhìn tổng quan về các Hiệp ước Thần dân và Quan thầy của chúng ta. Chúng ta có thể dùng màn hình này để theo dõi §SĐộ trung thành§!, quản lý §SĐiền trang§! và §SThương mại§!, và tái đàm phán các §SĐiều khoản§! của các Hiệp ước hiện có. Chúng ta cũng có thể chấm dứt hoàn toàn một Hiệp ước nếu nó không còn phục vụ cho mục đích của chúng ta."
 TUTORIAL_AGREEMENTS_NO_OVERLORD_TITLE:0 "$TUTORIAL_AGREEMENTS_TITLE$"
 TUTORIAL_AGREEMENTS_NO_OVERLORD_DESC:0 "$TUTORIAL_AGREEMENTS_DESC$"
 TUTORIAL_AGREEMENTS_HAS_OVERLORD_TITLE:0 "$TUTORIAL_AGREEMENTS_TITLE$"
 TUTORIAL_AGREEMENTS_HAS_OVERLORD_DESC:0 "$TUTORIAL_AGREEMENTS_DESC$\n\nCác đế chế thần dân có thể chọn trở thành các §SĐế chế Chuyên môn hóa§!. Việc chuyên môn hóa đem lại những lợi ích đáng kể cho các vấn đề như sản xuất tài nguyên hoặc năng lực quân sự, tuy nhiên đế chế đó sẽ thấy mình gặp bất lợi ở các lĩnh vực khác.\n\nCác Đế chế Chuyên môn hóa cũng mang lại một lực đẩy cho §SĐộ trung thành§!. Miễn là duy trì được một lượng Độ trung thành ổn định, các Đế chế Chuyên môn hóa sẽ tích lũy kinh nghiệm XP và từ đó thăng tiến lên các bậc cao hơn cho lĩnh vực chuyên môn đã chọn."
 TUTORIAL_HOLDINGS_TITLE:0 "Hướng dẫn: Điền trang"
 TUTORIAL_HOLDINGS_DESC_SHARED:0 "Màn hình §SĐiền trang§! cung cấp cái nhìn tổng quan về toàn bộ Điền trang trên £planet£ §SHành tinh§! này. Điều này cho phép các đế chế đặt các loại £building£ §SCông trình§! riêng biệt lên thủ đô và các £colony£ §SThuộc địa§! của nhau. Chúng có thể tác động đến các vấn đề như Ngoại giao, Tình báo, và sản xuất tài nguyên."
 TUTORIAL_HOLDINGS_DESC_MEGA_CORP:0 "Các Tập đoàn Siêu cấp có thể mở các §SVăn phòng Chi nhánh§! trên các thế giới của những đế chế khác, với điều kiện một hình thức thỏa thuận Ngoại giao nào đó đã được thiết lập. Như chúng ta đã biết, các tập đoàn lớn luôn chỉ mong muốn những điều tốt đẹp nhất cho khách hàng của mình - bất chấp các biến cố ở chu kỳ thứ 23!"
 TUTORIAL_HOLDINGS_DESC_OVERLORD:0 "Các §SQuan thầy§! có thể sử dụng Điền trang để vươn dài hơn nữa tầm ảnh hưởng của mình vào lãnh địa của một §SThần dân§!. Nhiều Điền trang như vậy có tác động đến Độ trung thành, và một số được tùy biến riêng cho các Đế chế Chuyên môn hóa. Mọi nâng cấp cũng có thể được tiến hành thông qua màn hình này."
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_NO_OVERLORD_TITLE:0 "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_NO_OVERLORD_DESC:0 "$TUTORIAL_HOLDINGS_DESC_SHARED$"
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_HAS_OVERLORD_TITLE:0 "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_HAS_OVERLORD_DESC:0 "$TUTORIAL_HOLDINGS_DESC_SHARED$\n\n$TUTORIAL_HOLDINGS_DESC_OVERLORD$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_NO_OVERLORD_TITLE:0 "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_NO_OVERLORD_DESC:0 "$TUTORIAL_HOLDINGS_DESC_SHARED$\n\n$TUTORIAL_HOLDINGS_DESC_MEGA_CORP$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_HAS_OVERLORD_TITLE:0 "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_HAS_OVERLORD_DESC:0 "$TUTORIAL_HOLDINGS_DESC_SHARED$\n\n$TUTORIAL_HOLDINGS_DESC_MEGA_CORP$\n\n$TUTORIAL_HOLDINGS_DESC_OVERLORD$"
 TUTORIAL_PLANETVIEW_COLONY_GOV_TITLE:0 "Hướng dẫn: Tuyển mộ Thống đốc"
 TUTORIAL_PLANETVIEW_COLONY_GOV_DESC:0 "Để hỗ trợ £colony£ §SThuộc địa§! mới của chúng ta phát triển, chúng ta nên cân nhắc tuyển mộ một §SThống đốc§! để giám sát các hoạt động tại đó.\n\nPhần lớn các thế giới của chúng ta sẽ vận hành suôn sẻ mà không cần đến sự xa xỉ của một §SThống đốc§!, và thay vào đó hưởng lợi từ phần thưởng tùy thuộc vào loại hình chính phủ của chúng ta. Nhưng đối với những £planet£ §SHành tinh§! đủ may mắn, một §SThống đốc§! có thể là một nguồn ân huệ tuyệt vời!\n\nCác Thống đốc có thể tạo ra một số hiệu ứng khác nhau lên hành tinh mà họ cai quản, hầu hết trong số đó là tích cực. Những hiệu ứng này phụ thuộc vào các §SĐặc tính§! và cấp độ kỹ năng của §SThống đốc§!."
 TUTORIAL_ELECTION_VIEW_TITLE:0 "Hướng dẫn: Bầu cử"
 TUTORIAL_ELECTION_VIEW_DESC:0 "Màn hình §SBầu cử§! là nơi chúng ta quyết định một nhà thống trị mới cho đế chế của mình.\n\n[TutorialElectionViewTypeSpecific]"
 TUTORIAL_ELECTION_VIEW_DEMOCRACY_NO:0 "Các ứng viên hợp lệ được chọn từ các £leader£ §SLãnh đạo§! hiện tại của bạn, và nếu bạn có tài nguyên dư dả, quyền lựa chọn người cai trị hoàn toàn thuộc về bạn."
 TUTORIAL_ELECTION_VIEW_DEMOCRACY_YES:0 "Các ứng viên hợp lệ được chọn từ các £leader£ §SLãnh đạo§! hiện tại của bạn và họ có thể được thăng tiến để gia tăng Mức độ Ủng hộ - dĩ nhiên là theo cách thức dân chủ nhất có thể."
 TUTORIAL_EDICTS_AND_POLICIES_TITLE:0 "Hướng dẫn: Chính sách & Pháp lệnh"
 TUTORIAL_EDICTS_AND_POLICIES_DESC:0 "Thẻ §SChính sách§! bao quát các §SChính sách§! của chính phủ cũng như các §SPháp lệnh§! trên quy mô toàn đế chế, những biện pháp thực thi bằng cách tiêu hao một phần tài nguyên của chúng ta.\n\nThường có một vài lập trường để lựa chọn đối với bất kỳ §SChính sách§! nào, dù chúng có thể bị giới hạn bởi trình độ công nghệ hoặc §STư tưởng Đạo đức§! của chúng ta.\n\nCác pháp lệnh có chi phí duy trì hàng tháng, được chi trả bởi §H$EDICT_FUND$§! của chúng ta, trả bằng £unity£ §SĐoàn kết§!, hoặc (đôi khi) bằng các tài nguyên khác."
 TUTORIAL_COUNCIL_VIEW_TITLE:0 "Hướng dẫn: Hội đồng & Nghị trình"
 TUTORIAL_COUNCIL_VIEW_DESC:0 "Màn hình §SHội đồng§! là nơi chúng ta bổ nhiệm các £leader£ §SLãnh đạo§! sẽ dẫn lối chúng ta bước vào tương lai. Tính cách và các §SĐặc tính§! của họ sẽ tác động đến đế chế chúng ta, cả theo hướng tốt lẫn xấu. Chúng ta có thể thiết lập các §SNghị trình§! nhằm tập trung nỗ lực của họ vào một lĩnh vực cụ thể.\n\nMột §SUy viên Hội đồng§! có thể được bổ nhiệm hoặc thay thế bất kỳ lúc nào mà vẫn có thể đảm nhận các vai trò khác, chẳng hạn như chỉ huy một £science_ship£ §STàu Khoa học§!. Ngoại lệ duy nhất là nhà thống trị của chúng ta.[TutorialCouncilViewDlcSpecific]Tiến độ §SNghị trình§! phụ thuộc vào cấp độ của các ủy viên, $EMPIRE_SIZE$ của chúng ta, và trong một số trường hợp nhất định là Tư tưởng Đạo đức của các ủy viên. Khi một Nghị trình kết thúc, nó có thể được kích hoạt để mang lại hiệu ứng mạnh mẽ hơn và giải phóng vị trí cho một nghị trình mới."
 TUTORIAL_COUNCIL_VIEW_PARAGON_NO:0 "\n\n"
 TUTORIAL_COUNCIL_VIEW_PARAGON_YES:0 "\n\nĐể mở khóa thêm các §SVị trí trong Hội đồng§!, chúng ta sẽ cần hai điều kiện: một §SCơ cấu Xã hội§! tương ứng, cũng như việc hoàn thành một Nghị trình cụ thể.\n\n"
 TUTORIAL_ASSIGN_COUNCILOR_TITLE:0 "Hướng dẫn: Đặc tính Ủy viên Hội đồng"
 TUTORIAL_ASSIGN_COUNCILOR_DESC:0 "Một số £leader£ §SLãnh đạo§! sở hữu các §SĐặc tính Ủy viên Hội đồng§!. Thường có sức ảnh hưởng lớn hơn và hiệu ứng sâu rộng hơn, những đặc tính này chỉ phát huy tác dụng nếu một nhà lãnh đạo ngồi trong Hội đồng.\n\nCác §SVị trí trong Hội đồng§! mang lại những hiệu ứng vốn có. Cấp độ kỹ năng của nhà lãnh đạo được chỉ định càng cao thì những hiệu ứng đó sẽ càng trở nên mạnh mẽ."
 TUTORIAL_LEADER_LEVEL_UP_TITLE:0 "Hướng dẫn: Kỹ năng Lãnh đạo"
 TUTORIAL_LEADER_LEVEL_UP_DESC:0 "Một £leader£ §SLãnh đạo§! trong đế chế chúng ta vừa đạt tới một cấp độ §SKỹ năng§! mới! Điều này sẽ nâng cao các phần thưởng mà họ cung cấp, và ban cho họ một Đặc tính mới.[TutorialLeaderLevelUpDlcSpecific]Để xem các §SLãnh đạo§! khả dụng:\n\n£dot_green£ Nhấp vào nút §S$topbar_button_leaders_name$§! trên thanh bên trái hoặc nhấn phím §SF5§!\n\n$tttt$$tt$£leaders£\n\nKhi các §SLãnh đạo§! già đi, họ có thể mắc phải những đặc tính tiêu cực, khiến việc thay thế trở thành một lựa chọn tự nhiên."
 TUTORIAL_LEADER_LEVEL_UP_PARAGON_NO:0 "\n\n"
 TUTORIAL_LEADER_LEVEL_UP_PARAGON_YES:0 "\n\nĐể định hướng sự phát triển của một £leader£ §SLãnh đạo§!, chúng ta có thể chọn §SĐặc tính§! của họ. Các đặc tính có thể được chọn sau mà không làm đình trệ tiến độ thăng tiến. Sau một vài cấp độ, một §SPhân lớp Chuyên sâu§! sẽ trở nên khả dụng, bổ sung các phần thưởng và tác động đến các lựa chọn đặc tính trong tương lai.\n\nCác đặc tính có đủ hình thái, quy mô và độ hiếm: một số có thể nâng cấp, một số loại trừ lẫn nhau, những đặc tính khác mang lại cả hiệu ứng tích cực lẫn tiêu cực. Nhưng tất cả chúng nhìn chung đều mang tính vĩnh viễn.\n\n"



