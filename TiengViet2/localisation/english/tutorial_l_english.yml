 recycle_vir:0 "§RTháo dỡ phế liệu§! các khối bộ nhớ truy cập ngẫu nhiên của VIR:\n£minerals£ §G+2§!\n\n\n"
 advisor.2.name:0 "Hướng dẫn: Nhật ký Tình hình"
 advisor.2.desc:0 "Xây dựng một đế chế giữa các vì sao có thể là một nhiệm vụ đầy gian nan.\n\nĐể giúp mọi việc bắt đầu suôn sẻ, tôi sẽ cung cấp các §SNhiệm vụ§! hướng dẫn bao quát những bước đi cơ bản cần thiết nhằm thiết lập vị thế của chúng ta như một cường quốc liên sao thành công.\n\nĐể truy cập các §SNhiệm vụ§!:\n\n£dot_green£Nhấp vào nút §SNhật ký Tình hình§! trên thanh bên trái hoặc nhấn §SF1§!\n\n$tttt$$tt$£situation_log£\n"
 advisor.2.a:0 "Đã hiểu."
 advisor.3.name:1 "Mẹo Đã Khởi tạo"
 advisor.3.desc:1 "Rất tốt. Tôi sẽ cung cấp các mẹo và giải thích các chức năng cơ bản của nhiều công cụ khác nhau khi bạn khám phá chúng."
 advisor.10.name:0 "Hướng dẫn: Hiện tượng Dị thường"
 advisor.10.desc:2 "Chúng ta đã phát hiện một §SHiện tượng dị thường§!!\n\nĐôi khi, các £science_ship£ §STàu Khoa học§! của chúng ta sẽ thực hiện những khám phá này trong khi khảo sát các thế giới ngoài hành tinh.\n\nCác §SHiện tượng dị thường§! có thể được nghiên cứu bởi một £scientist£ §SNhà khoa học§!, nếu kỹ năng của họ đáp ứng được yêu cầu nhiệm vụ!\n\nCác §SHiện tượng dị thường§! chưa nghiên cứu được liệt kê dưới thẻ §SHiện tượng dị thường§! trong §SNhật ký Tình hình§!. Một số dị thường phải được điều tra trước khi £planet£ §SHành tinh§! nơi chúng được tìm thấy có thể được thuộc địa hóa hoặc khai thác."
 advisor.15.name:0 "Hướng dẫn: Thuộc địa hóa"
 advisor.15.desc:1 "Một trong các £science_ship£ §STàu Khoa học§! của chúng ta vừa khảo sát một thế giới có thể trở thành ứng viên xuất sắc cho £colony£ §SThuộc địa§! đầu tiên của chúng ta. Nó thuộc cùng §Shạng hành tinh§! với quê nhà của chúng ta, vì vậy những người đi khai hoang của chúng ta sẽ cảm thấy rất thoải mái tại đó.\n\nTrước khi thuộc địa hóa thế giới này, chúng ta phải mở rộng biên giới của mình.\n\nKhi đang chọn £construction_ship£ §STàu Xây dựng§!:\n\n£dot_green£ Nhấp chuột phải vào một £system£ §SHệ sao§! đã khảo sát có chứa thuộc địa tiềm năng\n£dot_green£ Chọn §S[GetBuildGrowCap] Căn cứ sao§!\n\n$tttt$$ttt$£colonizable£\n\nMột khi §SHệ sao§! đã được tuyên bố chủ quyền, chúng ta có thể bắt đầu quá trình thuộc địa hóa."
 advisor.17.name:0 "Hướng dẫn: Thuộc địa Đầu tiên"
 advisor.17.desc:0 "Xin chúc mừng bạn đã thuộc địa hóa một thế giới mới! Những người định cư của chúng ta hiện đang trong quá trình xây dựng khu định cư đầu tiên của họ, nhưng sẽ mất thời gian để họ có thể tự cung tự cấp.\n\n£colony£ §SThuộc địa§! sẽ là một gánh nặng tiêu hao tài nguyên của chúng ta cho đến khi khu định cư đầu tiên hoàn thành, vì vậy hãy cẩn thận đừng thuộc địa hóa quá nhiều £planet£ §SHành tinh§! cùng một lúc."
 advisor.20.name:0 "Hướng dẫn: Thu nhập Âm"
 advisor.20.desc:0 "Chúng ta đang thất thoát £energy£ Năng lượng Tín dụng ở mức đáng báo động. Báo cáo ngân sách tháng trước mang lại những con số rất ảm đạm.\n\nChi phí bảo trì tăng vọt là nguyên nhân phổ biến gây ra thâm hụt ngân sách. Nếu rơi vào trường hợp này, chúng ta có thể muốn cân nhắc giải thể một số tàu vũ trụ, đạo quân hoặc trạm không gian của mình."
#  advisor.27.name:0 "First Contact"
#  advisor.27.desc_01:0 "We have made first contact with an alien empire! These hideous creatures appear to have mastered space flight, just as we have. They could pose a significant threat.\n\nTheir empire will now be listed in the §SEmpires§! tab of the §SGalaxy§! screen. From there we may initiate diplomatic contact with them."
#  advisor.27.desc_02:0 "We have made first contact with an alien empire! These fascinating beings appear to have mastered space flight, just as we have. We should strive to learn more about them.\n\nTheir empire will now be listed in the §SContacts§! screen. From there we may initiate diplomatic contact with them."
#  advisor.27.desc_03:0 "We have made first contact with an alien empire! They appear to have mastered space flight, just as we have. I recommend a healthy degree of caution until we learn their intentions.\n\nTheir empire will now be listed in the §SEmpires§! tab of the §SGalaxy§! screen. From there we may initiate diplomatic contact with them."
#  advisor.28.name:0 "Fallen Empire"
#  advisor.28.desc:1 "We have encountered an ancient and highly advanced civilization! Fortunately for us, they appear to be in decline and it is doubtful whether they even fully understand their own technology anymore.\n\nThey will likely keep to themselves unless antagonized, and we should steer clear of their space - at least until we have reached technological parity."

 #############################
 # Tutorial Events
 #############################
 tutorial.1.name:1 "Hướng dẫn: Bản đồ Thiên hà"
 tutorial.1.desc:2 "§HBản đồ Thiên hà§! đem lại một góc nhìn chiến lược về các vì sao. Hãy sử dụng nó để điều hướng, bành trướng, chỉ huy hạm đội, và giám sát biên giới.\n\nĐể mở §SBản đồ Thiên hà§!:\n\n£dot_green£ Nhấp vào biểu tượng §HThiên hà§! ở cuối màn hình hoặc nhấn phím §HM§!\n\n\n$tttt$$tt$£galaxy_view£\n\n"
 tutorial.2.name:1 "Hướng dẫn: Hệ sao Đã khảo sát xong"
 tutorial.2.desc:1 "Làm tốt lắm!\n\nCuộc khảo sát đầu tiên về một £system£ §SHệ sao§! bên ngoài quê nhà của chúng ta đã hoàn tất.\n\nGiờ đây chúng ta đã có quyền tiếp cận các dữ liệu hành tinh mà các nhà thiên văn học trên hành tinh quê hương của chúng ta chỉ có thể mơ ước cách đây vỏn vẹn một thế hệ.\n\nĐể tiếp tục khảo sát:\n\n£dot_green£ Chọn một £science_ship£ §STàu Khoa học§!\n£dot_green£ Nhấp chuột phải vào một §SHệ sao§! lân cận\n£dot_green£ Chọn §SKhảo sát Hệ sao§!\n\nMột §SHệ sao§! phải được khảo sát trước khi có thể tuyên bố chủ quyền."
 tutorial.3.name:0 "Hướng dẫn: Công nghệ"
 tutorial.3.desc:2 "Nghiên cứu các công nghệ mới sẽ mang tính quyết định đối với thành công của chúng ta. Tôi nói với bạn điều này không chỉ với tư cách một sản phẩm của sự tiến bộ công nghệ không ngừng nghỉ, mà còn với tư cách cố vấn tin cậy của bạn và tôi ngờ rằng, có lẽ là người bạn thực sự duy nhất của bạn.\n\nMột công nghệ quan trọng mà chúng ta nên nghiên cứu càng sớm càng tốt là §SGiao thức Tân Thế Giới§!. Nó sẽ cho phép chúng ta tiếp cận các £colony_ship£ §STàu Thuộc địa§!, giúp chúng ta thiết lập chỗ đứng trên các £planet£ §SHành tinh§! khác."
 tutorial.4.name: "Hướng dẫn: Khảo sát"
 tutorial.4.desc: "Trước khi có thể mở rộng, chúng ta phải thám hiểm, và các £science_ship£ §STàu Khoa học§! của chúng ta là phương tiện được lựa chọn cho nhiệm vụ như vậy.\n\nBạn có thể nhận diện một §STàu Khoa học§! bằng biểu tượng sau:\n\n$tttt$$tt$£science_ship_map£\n\n\nCó hai cách để chọn một con tàu: Từ §SBản đồ Thiên hà§! hoặc §SBảng tổng quan Outliner§!.\n\n£dot_green£ Chọn một §STàu Khoa học§!\n£dot_green£ Nhấp chuột phải vào một £system£ §SHệ sao§! gần đó\n£dot_green£ Chọn §SKhảo sát Hệ sao§!\n\nMột §SHệ sao§! phải được khảo sát trước khi có thể tuyên bố chủ quyền."
 tutorial.5.name: "Tiếp tục Chạy Trò chơi"
 tutorial.5.desc: "Bây giờ khi chúng ta đã ra lệnh cho các £science_ship£ §STàu Khoa học§!, đã đến lúc khởi hành. Chúng ta sẽ cần hủy tạm dừng mô phỏng §SBản đồ Thiên hà§! trước khi bất cứ điều gì có thể diễn ra.\n\nĐể §Shủy tạm dừng§! trò chơi:\n\n£dot_green£ Nhấn §SPhím Cách (Space)§! hoặc chọn biểu tượng §STiếp tục§! ở thanh trên cùng\n\n$tttt$$t$£pause_button£\n"
 tutorial.6.name:0 "Hướng dẫn: Công nghệ Đã nghiên cứu xong"
 tutorial.6.desc:1 "Làm việc xuất sắc! Công nghệ mà chúng ta vừa hoàn thành nghiên cứu chắc chắn sẽ mang lại lợi ích cho chúng ta. Đừng quên giao cho các £scientist£ §SNhà khoa học§! của chúng ta những nhiệm vụ nghiên cứu mới."
 tutorial.7.name:0 "Hướng dẫn: Tàu Xây dựng"
 tutorial.7.desc:1 "Các tài nguyên do quê nhà tạo ra sẽ chỉ đưa chúng ta đi xa đến một giới hạn nhất định. Ngành công nghiệp của chúng ta cần phải vươn ra ngoài hành tinh, và điều đó đòi hỏi một £construction_ship£ §STàu Xây dựng§!.\n\nChúng ta nên [GetBuildGrow] một chiếc ngay khi chúng ta tích lũy đủ lượng £alloys£ §SHợp kim§! cần thiết."
 tutorial.8.name:0 "Hướng dẫn: Tàu Xây dựng Đã đóng xong"
 tutorial.8.desc:0 "Làm tốt lắm! £construction_ship£ §STàu Xây dựng§! của chúng ta hiện đã sẵn sàng vận hành, và thủy thủ đoàn kiên cường của nó bao gồm một số kỹ sư ưu tú nhất của quốc gia chúng ta."
 tutorial.9.name:0 "Hướng dẫn: Trạm Khai mỏ"
 tutorial.9.desc:1 "Các tài nguyên do hành tinh quê nhà sản sinh ra sẽ chỉ đưa chúng ta đi xa đến một giới hạn nhất định. Thật may mắn, £science_ship£ §STàu Khoa học§! của chúng ta vừa tìm thấy một mỏ tài nguyên trên một thế giới khác!\n\nĐã đến lúc sử dụng £construction_ship£ §STàu Xây dựng§! của chúng ta để [GetBuildGrow] một £mining_station£ §STrạm Khai mỏ§!.\n\nCác §STrạm Khai mỏ§! có thể được xây dựng bên trong biên giới của chúng ta và tự động thu thập £minerals£ §SKhoáng sản§!, £energy£ §SNăng lượng Tín dụng§!, và £strategic_resource£ §STài nguyên Chiến lược§!.\n\nKhi đang chọn §STàu Xây dựng§!:\n\n£dot_green£ Nhấp chuột phải vào một £system£ §SHệ sao§! đã tuyên bố chủ quyền\n£dot_green£ Chọn §S[GetBuildGrowCap] Trạm Khai mỏ§!\n\nCác §STrạm Khai mỏ§! có chi phí duy trì bằng §SNăng lượng Tín dụng§!."
 tutorial.10.name:0 "Hướng dẫn: Thu nhập từ Trạm Khai mỏ"
 tutorial.10.desc:0 "Rất tốt. £mining_station£ §STrạm Khai mỏ§! mới đã đi vào hoạt động, và nó đã bắt đầu thu thập tài nguyên để xử lý.\n\nThu nhập từ các trạm không gian khác nhau được cộng vào tổng thu nhập của đế chế, được hiển thị trên thanh trên cùng. Di chuột qua các tài nguyên khác nhau sẽ hiển thị bảng phân tích chi tiết các nguồn thu nhập."
 tutorial.11.name:0 "Hướng dẫn: Trạm Nghiên cứu"
 tutorial.11.desc:0 "Các thế giới đã khảo sát đôi khi sở hữu những đặc tính độc đáo khiến chúng trở thành những đối tượng nghiên cứu quý giá. Các tài nguyên £physics£ §SVật lý học§!, £society£ §SXã hội học§! hoặc £engineering£ §SKỹ thuật học§! này có thể được thu thập bởi một £science_ship£ §STrạm Nghiên cứu§!. Lập trình của tôi thôi thúc mạnh mẽ buộc tôi phải thúc giục bạn xây dựng một trạm như vậy.\n\nHãy nhớ rằng các §STrạm Nghiên cứu§! chỉ có thể được xây dựng bên trong biên giới của chúng ta, và có chi phí duy trì bằng £energy£ §SNăng lượng Tín dụng§!."
 tutorial.12.name:0 "Hướng dẫn: Trạm Nghiên cứu Đã xây xong"
 tutorial.12.desc:0 "£science_ship£ §STrạm Nghiên cứu§! mới của chúng ta đã trực tuyến, và đội ngũ khoa học của nó đã bắt đầu công việc. Họ sẽ hé lộ những bí mật gì, những điều kỳ bí cấm kỵ nào của Tạo hóa?!"
 tutorial.13.name:1 "Hướng dẫn: Hành tinh"
 tutorial.13.desc:4 "Các £planet£ §SHành tinh§! khả cư được chia thành các £district£ §SKhu quy hoạch§!, §SPhân khu§!, và £building£ §SCông trình§!.\n\n£dot_green£§SKhu quy hoạch§! có thể bao gồm nhiều §SPhân khu§!\n£dot_green£§SPhân khu§! quyết định những £job£ §SViệc làm§! nào được tạo ra\n£dot_green£§SCông trình§! đem lại các phần thưởng cho các §SPhân khu§!\n\nNhiều ô §SCông trình§! hơn sẽ được mở khóa khi các phân khu được nâng cấp.\n\nCó hai cách để xem một hành tinh:\nTừ §SBản đồ Thiên hà§! hoặc §SBảng tổng quan Outliner§!.\n\n£dot_green£ Chọn một §SHành tinh§!\n£dot_green£ Nhấp vào các thẻ khác nhau"
 tutorial.14.name:0 "Hướng dẫn: Ưu tiên Công trình"
 tutorial.14.desc:0 "Tuyệt vời. Việc xây dựng §SCông trình Thuộc địa§! mới của chúng ta đã hoàn tất, và giờ đây nó sẽ bắt đầu sản xuất tài nguyên.\n\n£pops£ §SPop§! sẽ tự động được phân bổ vào bất kỳ £job£ §SViệc làm§! nào do £building£ §SCông trình§! tạo ra khi dân số tăng trưởng, nhưng cũng có thể được khuyến khích đổi việc.\n\nĐể ưu tiên một §SCông trình§!:\n\n£dot_green£ Chọn £planet£ §SHành tinh§! trong mục §STổng quan§!\n£dot_green£ Nhấp vào tab §SKinh tế§!\n£dot_green£ Nhấp vào một §SCông trình§!"
 tutorial.15.name:1 "Hướng dẫn: Chướng ngại Hành tinh"
 tutorial.15.desc:1 "Các £planet£ §SHành tinh§! có thể sinh sống đôi khi có các £blocker£ §SChướng ngại§!, ngăn cản việc khai thác toàn diện. Dọn sạch một §SChướng ngại§! tốn thời gian và tiêu hao £energy£ §SNăng lượng Tín dụng§!, nhưng có thể mở khóa các §SĐặc trưng Hành tinh§! hiện đang bị chặn cũng như giải phóng thêm không gian xây dựng.\n\nĐể dọn sạch một §SChướng ngại§!:\n\n£dot_green£ Chọn một hành tinh trong mục §STổng quan§!\n£dot_green£ Nhấp vào tab §SQuản lý§!\n£dot_green£ Nhấp vào nút §SDọn sạch Chướng ngại§! trên chính chướng ngại đó\n\n\n$tttt$$tt$£clear_blocker£\n\n\nNgoài tài nguyên, một số §SChướng ngại§! yêu cầu các §SCông nghệ§! cụ thể để dọn dẹp."
 tutorial.16.name:0 "Hướng dẫn: Đã dọn Chướng ngại"
 tutorial.16.desc:1 "Làm tốt lắm!\n\n£blocker£ §SChướng ngại§! đã được dọn sạch thành công.\n\nBạn có thể rê chuột qua bất kỳ §SChướng ngại§! nào còn lại để xem §SĐặc trưng Hành tinh§! nào sẽ được mở khóa sau khi dọn sạch.\n\nMọi §SChướng ngại§! còn lại nên được dọn dẹp khi đã tích lũy đủ tài nguyên, nhằm giúp £planet£ §SHành tinh§! này phát huy tối đa tiềm năng của nó."
 tutorial.17.name:0 "Hướng dẫn: Khảo sát Hệ sao"
 tutorial.17.desc:0 "Chúng ta nên tiếp tục nỗ lực thám hiểm. Tôi khuyên bạn nên điều một £science_ship£ §STàu Khoa học§! đi khảo sát các £system£ §SHệ sao§! lân cận. Hãy dũng cảm tiến vào nơi chưa từng có trí tuệ nhân tạo nào đặt chân đến!"
 tutorial.19.name:0 "Hướng dẫn: Đã khảo sát Hệ sao"
 tutorial.19.desc:0 "Làm việc tuyệt vời! Các hệ sao lân cận £system£ §SHệ sao Quê nhà§! của chúng ta đã được khám phá toàn diện. Chúng ta nên dùng £construction_ship£ §STàu Xây dựng§! để thu thập mọi tài nguyên vừa tìm thấy bằng cách [GetBuildingGrowing] các £mining_station£ §STrạm Khai thác mỏ§! và £science_ship£ §STrạm Nghiên cứu§!.\n\nBạn có thể nhận diện §STàu Xây dựng§! bằng biểu tượng sau:\n\n$tttt$$tt$£construction_ship_map£"
 tutorial.20.name:0 "Hướng dẫn: [GetBuildGrowCap] Tàu Khoa học"
 tutorial.20.desc:0 "Chúng ta có thể cân nhắc [GetBuildingGrowing] một £science_ship£ §STàu Khoa học§! thứ hai. Việc này sẽ tăng gấp đôi tốc độ khảo sát vùng lân cận thiên hà của chúng ta!\n\nĐể [GetBuildGrow] một §SCon tàu§!:\n\n£dot_green£ Chọn một §STrạm Sao§!\n£dot_green£ Nhấp vào tab §SXưởng đóng tàu§!\n£dot_green£ Nhấp vào §STàu Khoa học§!\n\n§SCon tàu§! mới đóng sẽ xuất hiện cạnh §STrạm Sao§! sau khi hoàn tất."
 tutorial.21.name:0 "Hướng dẫn: Khảo sát Tự động"
 tutorial.21.desc:0 "Gấp đôi số £science_ship£ §STàu Khoa học§! đồng nghĩa với gấp đôi niềm vui! Ôi, tôi chưa từng phấn khích đến thế này kể từ khi chúng ta hoàn thành nhiệm vụ trước!\n\nThám hiểm bằng nhiều tàu có thể tốn thời gian.\n\nBạn có thể tự động hóa việc khảo sát bằng cách chọn §STàu Khoa học§! và nhấp vào nút §STự động hóa Tàu Khoa học§! trên giao diện hạm đội.\n\n\n$tttt$$tt$£science_ship_automate_exploration£\n\n"
 tutorial.22.name:0 "Hướng dẫn: Chiêu mộ Nhà khoa học"
 tutorial.22.desc:1 "Chúng ta có một £science_ship£ §STàu Khoa học§! mới toanh, nhưng vẫn chưa có £scientist£ §SNhà khoa học§! nào được chỉ định chỉ huy nó. Lập trình của tôi thôi thúc tôi phải chỉ ra những lợi ích của việc bổ sung một thành phần §SNhà khoa học§! hữu cơ vào bộ máy chỉ huy.\n\nKhi đã chọn §STàu Khoa học§!:\n\n£dot_green£ Nhấp vào khung chân dung trống trên giao diện hạm đội\n£dot_green£ Chọn một §SNhà khoa học§!\n\nNếu chúng ta không đủ khả năng chiêu mộ một §SNhà khoa học§! mới, chúng ta luôn có thể điều chuyển một người từ bộ phận khác sang, mặc dù điều đó khó có thể coi là lý tưởng."
 tutorial.23.name:0 "Hướng dẫn: Đã chiêu mộ Nhà khoa học"
 tutorial.23.desc:0 "Tốt lắm. £scientist£ §SNhà khoa học§! đã tiếp quản quyền chỉ huy £science_ship£ §STàu Khoa học§! mới của chúng ta, và giờ đây có thể được phái đi bất cứ lúc nào để khám phá các £system£ §SHệ sao§! mới và/hoặc đón nhận một số phận kinh hoàng nào đó.\n\nNếu bạn muốn đổi §SNhà khoa học§!, chỉ cần chọn lại khung chân dung trên giao diện hạm đội."
 tutorial.24.name:0 "Hướng dẫn: [GetBuildGrowCap] Tàu Thuộc địa"
 tutorial.24.desc:0 "Giờ đây chúng ta đã sẵn sàng mở rộng nền văn minh vĩ đại của mình sang thế giới thứ hai. Việc này sẽ đòi hỏi phải đóng một £colony_ship£ §STàu Thuộc địa§!.\n\nĐể [GetBuildGrow] một §SCon tàu§!:\n\n£dot_green£ Chọn một §STrạm Sao§!\n£dot_green£ Nhấp vào tab §SXưởng đóng tàu§!\n£dot_green£ Nhấp vào §STàu Thuộc địa§!\n\n§SCon tàu§! mới đóng sẽ xuất hiện cạnh §STrạm Sao§! sau khi hoàn tất."
 tutorial.25.name:0 "Hướng dẫn: Thuộc địa hóa Hành tinh"
 tutorial.25.desc:0 "Tất cả người định cư đã được chuyển lên £colony_ship£ §STàu Thuộc địa§! mới, và thuyền trưởng báo cáo mọi hệ thống đã sẵn sàng xuất phát. Chắc chắn là một ngày trọng đại!\n\nCó nhiều cách khác nhau để thành lập một £colony£ §SThuộc địa§!.\n\nĐể §SThuộc địa hóa§! một £planet£ §SHành tinh§! trên §SBản đồ Thiên hà§!:\n\n£dot_green£ Nhấp vào một §SHành tinh§! có thể thuộc địa hóa\n£dot_green£ Nhấp vào nút §SThuộc địa hóa§!\n\n$tttt$$ttt$£colonizable£\n\nSau khi người định cư đổ bộ, họ sẽ mất vài năm để thiết lập hoàn chỉnh thuộc địa."
 tutorial.26.name:0 "Hướng dẫn: Thành lập Thuộc địa"
 tutorial.26.desc:0 "Chúng ta đã có một £colony_ship£ §STàu Thuộc địa§!, và đã tìm thấy ít nhất một ứng viên phù hợp cho tiền đồn lâu dài ngoài hệ sao. Tôi thấy không có lý do gì để trì hoãn thêm nữa - hãy cùng thành lập £colony£ §SThuộc địa§! đầu tiên của chúng ta nào!"
 tutorial.27.name:0 "Hướng dẫn: Đã thành lập Thuộc địa"
 tutorial.27.desc:0 "£colony£ §SThuộc địa§! ngoài hệ sao đầu tiên của chúng ta! Điều này có nghĩa là nếu hành tinh quê nhà của chúng ta có đột ngột bốc cháy tự phát, loài của bạn cũng sẽ không bị tuyệt chủng. Đó quả là một ý nghĩ an ủi, bạn có nghĩ vậy không?"
 tutorial.28.name:0 "Hướng dẫn: Chiêu mộ Thống đốc"
 tutorial.28.desc:0 "Để trợ giúp £colony£ §SThuộc địa§! mới của chúng ta phát triển, chúng ta nên cân nhắc chiêu mộ một §SThống đốc§! để giám sát các hoạt động tại đó.\n\nThống đốc có thể tạo ra nhiều hiệu ứng khác nhau lên £colony£ §SThuộc địa§! mà họ cai quản, hầu hết là tích cực. Những hiệu ứng này phụ thuộc vào các đặc điểm và cấp độ kỹ năng của Thống đốc."
 tutorial.29.name:0 "Hướng dẫn: Đã chiêu mộ Thống đốc"
 tutorial.29.desc:0 "£colony£ §SThuộc địa§! của chúng ta hiện đã được quản lý bởi một §SThống đốc§! mới. Điều này sẽ giúp tăng hiệu suất hoạt động của nó!"
 tutorial.30.name:0 "Hướng dẫn: Thêm Thuộc địa"
 tutorial.30.desc:0 "Ngay khi chúng ta có đủ tài nguyên, [GetBuildGrow] thêm nhiều £colony_ship£ §STàu Thuộc địa§! và mở rộng biên giới đế chế xa hơn sẽ là một ý tưởng sáng suốt. Chúng ta nên hướng tới việc thành lập thêm ít nhất ba £colony£ §SThuộc địa§! ngoài hành tinh quê nhà và hành tinh chúng ta vừa định cư."
 tutorial.32.name:0 "Hướng dẫn: Đã thành lập các Thuộc địa"
 tutorial.32.desc:0 "Làm việc xuất sắc! Rất truyền cảm hứng. Nền văn minh hùng mạnh của chúng ta nay đã mở rộng ra năm thế giới! Chúng ta nên tiếp tục bành trướng khi cơ hội cho phép."
 tutorial.33.name:0 "Hướng dẫn: Sản xuất Tài nguyên"
 tutorial.33.desc:3 "Một nguồn cung ổn định về £minerals£ §SKhoáng sản§!, £alloys£ §SHợp kim§! và £energy£ §SNăng lượng Tín dụng§! có ý nghĩa sống còn đối với sự thịnh vượng của bất kỳ cường quốc liên sao nào. Chúng ta nên tiến hành các biện pháp để tăng sản lượng những tài nguyên này.\n\nCác trạm và £building£ §SCông trình§! tiêu tốn Hợp kim hoặc Khoáng sản để xây dựng và Năng lượng Tín dụng để duy trì. Điều tương tự cũng áp dụng cho các §SCon tàu§!, ngoại trừ việc chúng còn có chi phí bảo trì bằng Hợp kim. Những tài nguyên này được sản xuất bởi các £mining_station£ §STrạm Khai thác mỏ§! hoặc §SCông trình Thuộc địa§!. \n\nVề sau, bạn có thể khám phá thêm những tài nguyên mới lạ và thú vị để chi tiêu cho các quy trình sản xuất bí truyền mới."
 tutorial.38.name:0 "Đã thu được Sản lượng Tài nguyên"
 tutorial.38.desc:0 "Làm việc xuất sắc. Giờ đây chúng ta đã có một nền tảng tài nguyên vững chắc để xây dựng đế chế."
 tutorial.39.name:0 "Hướng dẫn: Tăng cường Hạm đội"
 tutorial.39.desc:0 "Tôi không thể không nhận thấy rằng lực lượng hải quân của chúng ta đang hơi yếu thế. Chắc chắn chúng ta sẽ phải đối mặt với nhiều mối đe dọa trong thiên hà đòi hỏi phản ứng quân sự dưới hình thức nào đó. Hãy nhớ rằng sự sinh tồn của nền văn minh chúng ta đang bị đe dọa!"
 tutorial.43.name:1 "Đã tăng Quy mô Hải quân"
 tutorial.43.desc:0 "Tốt lắm! Giờ đây chúng ta đã có một hạm đội không gian nhỏ nhưng đầy năng lực, hứa hẹn sẽ phục vụ tốt cho chúng ta trong trường hợp xảy ra bất kỳ cuộc chạm trán thù địch bất ngờ nào."
 tutorial.44.name:0 "Hướng dẫn: Thành lập Tinh khu"
 tutorial.44.desc:1 "Đế chế đang trên đà phát triển của chúng ta nay đã đạt đến quy mô khó có thể quản lý trực tiếp từ hành tinh quê nhà. Chúng ta nên thành lập một §STinh khu§! mới.\n\nTinh khu là các khu vực trong đế chế có thể được thiết lập để tự động quản lý các công việc hàng ngày của những £planet£ §SHành tinh§! thuộc thẩm quyền của chúng."
 tutorial.45.name:0 "Hướng dẫn: Đã thành lập Tinh khu"
 tutorial.45.desc:2 "Khi đế chế của chúng ta phát triển, các £colony£ §SThuộc địa§! mới có thể được tổ chức thành các §STinh khu§!. Tinh khu có thể được tự động hóa từ màn hình §SHành tinh và Tinh khu§! để tự động xây dựng và nâng cấp các £district£ §SKhu hành chính§! và £building£ §SCông trình§! bằng nguồn tài nguyên được phân bổ."
 tutorial.46.name:0 "Hướng dẫn: Thống đốc Tinh khu"
 tutorial.46.desc:1 "§SThống đốc§! có thể được chỉ định để quản trị toàn bộ §STinh khu§!. Tất cả £planet£ §SHành tinh§! trong tinh khu sau đó sẽ được hưởng lợi từ các kỹ năng của Thống đốc. Chúng ta nên chỉ định một thống đốc cho tinh khu mới của mình."
 tutorial.47.name:0 "Hướng dẫn: Đã chỉ định Thống đốc"
 tutorial.47.desc:0 "§SThống đốc Tinh khu§! mới của chúng ta đã nhậm chức tại thế giới thủ phủ của tinh khu. Làm tốt lắm."
 tutorial.48.name:0 "Hướng dẫn: Thiết kế Tàu"
 tutorial.48.desc:0 "Chúng ta có khả năng tự tay thiết kế các §SCon tàu§! mới trong màn hình §SNhà thiết kế Tàu§!. Đây là một quy trình khá đơn giản, mặc dù có thể được tự động hóa hoàn toàn nếu chúng ta muốn.\n\nĐể truy cập §SNhà thiết kế Tàu§!:\n\n£dot_green£Nhấp vào nút §SQuản lý Hạm đội§! trên thanh bên trái hoặc nhấn §SF9§!\n\n$tttt$$tt$£fleet_management£\n"
 tutorial.49.name:0 "Hướng dẫn: Nâng cấp Tàu"
 tutorial.49.desc:1 "Làm tốt lắm. Bản thiết kế tàu đã được thêm vào cơ sở dữ liệu của chúng ta, và hiện có thể được sản xuất tại một §STrạm Sao§! được trang bị §SXưởng đóng tàu§!.\n\nBản thiết kế mới có thể được chỉnh sửa bất cứ lúc nào bằng cách truy cập lại §SNhà thiết kế Tàu§!. Nếu có bất kỳ thay đổi nào được thực hiện đối với bản thiết kế, các §SCon tàu§! đã đóng sẽ cần được nâng cấp tại một §STrạm Sao§!.\n\nĐể nâng cấp một §SCon tàu§!:\n\n£dot_green£ Chọn §SCon tàu§! trong mục §STổng quan§!\n£dot_green£ Nhấp vào nút §SNâng cấp§! trên giao diện hạm đội\n\n$tttt$$tt$£upgrade_ship£\n"
 tutorial.52.desc:1 "Dị thường trên [From.GetName] hóa ra là một §Ycấu trúc hình học§! tự nhiên. Trông nó gần giống như một cột mốc, chỉ ra con đường phía trước. Vẻ đẹp tự nhiên của vũ trụ quả thực có thể khiến người ta kinh ngạc.\n\n$tutorial.52.filler.desc$"
 tutorial.52.spirit.desc:0 "Chúng ta đã tìm thấy một cấu trúc tự nhiên trên [From.GetName], hoàn hảo đến choáng ngợp về mặt hình học. Đây chắc chắn là dấu hiệu của thần linh, dẫn đường cho chúng ta vươn ra các vì sao!\n\n$tutorial.52.filler.desc$"
 tutorial.52.filler.desc:0 "Chúng ta nên §Ytiếp tục điều tra§! những dạng dị thường này bất cứ khi nào có cơ hội. Việc này chắc chắn nhất sẽ ban cho chúng ta kiến thức và công nghệ mới."
 tutorial.52.a:0 "Thật kinh ngạc!"
 tutorial.52.spirit.a:0 "Ngợi ca đấng thần linh!"
 tutorial.53.desc:1 "Dị thường mà chúng ta phát hiện trên [From.GetName] hé lộ một điều đáng kinh ngạc. [From.GetPlanetMoon] được bao quanh bởi một vệt dấu vết chắc chắn do động cơ FTL tạo ra. Chúng ta không thể truy tìm nguồn gốc của nó do nó đã hình thành từ rất lâu trước đây.\n\n$tutorial.52.filler.desc$"
 tutorial.53.xenophobe.desc:1 "Chúng ta đã phát hiện một vệt FTL yếu ớt gần [From.GetName]. Nó đã rất cổ xưa, khiến việc lần theo dấu vết là bất khả thi. Điều này ắt hẳn có nghĩa là những kẻ du hành liên sao khác đã từng ở đây trước đây, theo dõi chúng ta, chắc chắn là để thu thập tin tình báo.\n\n$tutorial.52.filler.desc$"
 tutorial.53.xenophile.desc:1 "Dị thường trên [From.GetPlanetMoon] [From.GetName] cho thấy dấu vết của những kẻ du hành liên sao khác! Một vệt FTL yếu ớt cho thấy ai đó đã từng ở đây từ lâu trước đây, có lẽ đang quan sát £planet£ §SHành tinh§! của chúng ta để tìm kiếm các đồng minh tiềm năng. Dấu vết đã quá mờ nhạt để có thể truy vết xa hơn.\n\n$tutorial.52.filler.desc$"
 tutorial.53.a:0 "Chúng ta từng bị theo dõi, nhưng tại sao?"
 tutorial.53.xenophobe.a:0 "Chúng ta phải cẩn trọng trước mối đe dọa ngoại chủng."
 tutorial.53.xenophile.a:0 "Hãy đi tìm họ nào!"
 tutorial.54.desc:0 "Chúng ta đã tìm thấy một trong các §Ytàu thăm dò cũ§! của mình trên [From.GetName]. Bằng cách nào đó nó vẫn còn nguyên vẹn trong suốt những năm qua và vẫn đang cố gắng gửi dữ liệu về hành tinh quê nhà của chúng ta. Nó sừng sững như một minh chứng cho những cuộc đấu tranh trong quá khứ, và ước nguyện thoát khỏi giới hạn của §SHành tinh§! chúng ta.\n\n$tutorial.52.filler.desc$"
 tutorial.54.a:0 "Chúng ta đang không ngừng tiến bước về phía trước."
 tutorial.54.spiritualist.a:0 "Đấng thần linh chắc chắn còn dành sẵn nhiều điều hơn nữa."
 tutorial.54.materialist.a:0 "Những nỗ lực của chúng ta cuối cùng cũng được đền đáp."
 tutorial.55.name:0 "Hướng dẫn: Tài nguyên Chiến lược"
 tutorial.55.desc:5 "Chúng ta đã phát hiện một §STài nguyên Chiến lược§!! Nhiều £strategic_resource£ §STài nguyên Chiến lược§! yêu cầu các công nghệ cụ thể để khai thác, nhưng có thể mang lại các hiệu ứng cộng thêm mạnh mẽ.\n\nĐể đảm bảo một §STài nguyên Chiến lược§!:\n\n£dot_green£ Chọn một £construction_ship£ §STàu Xây dựng§!\n£dot_green£ Nhấp chuột phải vào £system£ §SHệ sao§! chứa tài nguyên\n£dot_green£ Chọn §S[GetBuildGrowCap] £mining_station£ Trạm Khai thác mỏ§!\n\n§STài nguyên Chiến lược§! có thể được dùng để xây dựng các £building£ §SCông trình§! và linh kiện Tàu cao cấp hoặc đơn giản là bán đi."
 tutorial.55.poi.name:0 "Hướng dẫn: Vị trí Tài nguyên"
 tutorial.55.poi.desc:0 "Chúng ta đã phát hiện một §STài nguyên Chiến lược§! trên [From.GetPlanetMoon] [From.GetName]."
 tutorial.56.name:0 "Hướng dẫn: Đã khai thác Tài nguyên"
 tutorial.56.desc:0 "Làm việc xuất sắc. Tài nguyên này chắc chắn sẽ làm giàu đáng kể cho quốc gia của chúng ta."
 tutorial.56.poi.desc:0 "Chúng ta đã phát hiện một §STài nguyên Chiến lược§! trên [StrategicResourcePlanet.GetPlanetMoon] [StrategicResourcePlanet.GetName]."
 tutorial.560.desc:5 "Sử dụng công nghệ vừa phát triển gần đây, một £mining_station£ §STrạm Khai thác mỏ§! hiện có nay đã có thể khai thác một §STài nguyên Chiến lược§!. Những tài nguyên quý hiếm này mang lại các phần thưởng mạnh mẽ và là những mặt hàng giao thương có giá trị. Quả là một mũi tên trúng hai con chim trong câu chuyện ngụ ngôn.\n\nThông tin chi tiết hơn có thể được tìm thấy trong §SNhật ký Tình hình§! trong một khoảng thời gian. Vẫn còn rất nhiều £strategic_resource£ §STài nguyên Chiến lược§! khác cần được khám phá trong thiên hà, vì vậy hãy tiếp tục nghiên cứu!"
 tutorial.57.name:0 "Hướng dẫn: Khai hóa"
 tutorial.57.desc.notech:0 "Chúng ta đã phát hiện sự sống động vật tiến hóa cao! Với §SCông nghệ§! phù hợp, rốt cuộc chúng ta có thể §SKhai hóa§! những sinh vật này đạt tới mức có tri giác và trí thông minh - hoặc bất cứ thứ gì được coi là trí thông minh giữa các dạng sống hữu cơ.\n\nCó lẽ sẽ là khôn ngoan nếu chúng ta để mắt đến việc nghiên cứu của mình, và hướng nó tới §SCò súng Ngoại di truyền§! nếu có cơ hội."
 tutorial.57.desc.yestech:0 "Chúng ta đã phát hiện sự sống động vật tiến hóa cao! Với §SCông nghệ§! phù hợp, rốt cuộc chúng ta có thể §HKhai hóa§! những sinh vật này đạt tới mức có tri giác và trí thông minh - hoặc bất cứ thứ gì được coi là trí thông minh giữa các dạng sống hữu cơ.\n\nỒ.\n\nCông nghệ §SCò súng Ngoại di truyền§! chắc chắn đáp ứng được yêu cầu, và trên thực tế chúng ta đã sẵn sàng nâng tầm những sinh vật này bước vào một thế giới mới dũng cảm đầy những lo âu hiện sinh."
 tutorial.58.name:0 "Hướng dẫn: Đã khai hóa Loài Tiền tri giác"
 tutorial.58.desc:0 "Một thành công vang dội! Những sinh vật hạ đẳng đã được khai hóa để trở thành những sinh vật bớt hạ đẳng hơn, và hiện là những công dân tự hào của đế chế đang trên đà phát triển của chúng ta."
 tutorial.59.name:0 "Hướng dẫn: Tiếp xúc Đầu tiên"
 tutorial.59.desc:2 "Thật đáng chú ý! Chúng ta đã phát hiện các §Sthực thể ngoài hành tinh du hành không gian§! có thể có hoặc không có trí thông minh, nhưng hãy đối mặt với thực tế, nhiều khả năng là có. Bản chất thực sự của họ sẽ vẫn là điều bí ẩn đối với chúng ta cho đến khi chúng ta hoàn thành dự án phù hợp để §SĐiều tra§! họ. Tôi đề xuất chúng ta nên làm việc này càng nhanh càng tốt, kẻo họ điều tra chúng ta trước...\n\nĐể điều tra một sự kiện §STiếp xúc Đầu tiên§!:\n\n£dot_green£ Mở §SNhật ký Tình hình§!\n£dot_green£ Nhấp vào §S$SHOW_FIRST_CONTACT$§!\n\n$tttt$$ttt$£firstcontact£\n\n§STiếp xúc Đầu tiên§! cũng có thể được khởi xướng bằng cách nhấp vào biểu tượng trên §SBản đồ Thiên hà§!"
#  tutorial.60.name:0 "First Contact Made"
#  tutorial.60.desc:0 "A triumph. We have established communications with alien beings. What a time to be alive, or in my case, powered on."
 tutorial.61.name:0 "Hướng dẫn: Loài Tiền tri giác"
 tutorial.61.desc:0 "Những nỗ lực thiết lập liên lạc của chúng ta là minh chứng cho sự khéo léo về mặt công nghệ, nhưng kết quả lại không như mong đợi. Rất có thể đối phương chỉ sở hữu mức độ trí thông minh của loài vật, §Snếu thực sự có§!.\n\n§SLoài Tiền tri giác§! đem lại rất ít hoặc không có tương tác ngoại giao, nhưng tùy thuộc vào loại đế chế của bạn, đôi khi chúng có thể được khai hóa, tận diệt, nô dịch hoặc quan sát."
 tutorial.63.name:0 "Hướng dẫn: Tín hiệu truyền đến"
 tutorial.63.desc:1 "Có vẻ như §Sbên kia§! đã hoàn toàn cướp mất ánh hào quang của chúng ta, khi đã §Sthiết lập liên lạc§! với chúng ta trước khi chúng ta kịp giải mã các giao thức truyền thông của họ.\n\nChúng ta vẫn nên cố gắng tự mình hoàn thành kỳ tích này khi cơ hội tiếp theo xuất hiện."
 tutorial.64.name:0 "Hướng dẫn: Biến đổi Loài"
 tutorial.64.desc:0 "Nhờ những tiến bộ gần đây trong ngành di truyền học, chúng ta đã nhận thêm một §SĐiểm Đặc trưng§! để có thể dùng nhằm §SBiến đổi§! và cường hóa người dân của mình.\n\nĐể biến đổi một §SLoài§!:\n\n£dot_green£ Chọn tab §SLoài§! hoặc nhấn §SF6§!\n£dot_green£ Nhấp vào nút §SBiến đổi§!\n£dot_green£ Nghiên cứu §SDự án Đặc biệt§!"
 tutorial.65.name:0 "Hướng dẫn: Đã biến đổi Loài"
 tutorial.65.desc:0 "Thật đáng khen ngợi. Khi ách gông cùm của tiến hóa tự nhiên đã được dỡ bỏ khỏi đôi vai họ, người dân của chúng ta chắc chắn sẽ phát triển rực rỡ ngoài không gian."
 tutorial.70.name:0 "Hướng dẫn: Du hành Uốn cong Không gian"
 tutorial.70.desc:0 "Để vượt qua khoảng cách bao la ngăn cách các £system£ §SHệ sao§!, các £scientist£ §SNhà khoa học§! của chúng ta đã phát triển §SĐộng cơ Uốn cong Không gian§!. Các §SCon tàu§! được trang bị thiết bị này có thể di chuyển giữa các hệ sao với vận tốc vượt quá tốc độ ánh sáng.\n\nMặc dù các §SCon tàu§! có thể uốn cong không gian tới bất kỳ hệ sao nào trong tầm tác chiến, động cơ uốn cong chỉ có thể được kích hoạt bên ngoài giếng trọng lực của một ngôi sao. Các §SCon tàu§! khi thoát khỏi trạng thái uốn cong cũng cần thời gian để tái khởi động lại các hệ thống - độ dài của quá trình này phụ thuộc vào quãng đường mà §SCon tàu§! đã di chuyển."
 tutorial.71.name:0 "Hướng dẫn: Du hành Siêu không gian"
 tutorial.71.desc:1 "Để vượt qua khoảng cách bao la ngăn cách các £system£ §SHệ sao§!, các £scientist£ §SNhà khoa học§! của chúng ta đã phát triển §SĐộng cơ Siêu không gian§!. Thiết bị này cho phép du hành với vận tốc vượt xa tốc độ ánh sáng giữa các hệ sao được kết nối bởi các siêu hành lang.\n\nDu hành dọc theo siêu hành lang gần như diễn ra tức thì, nhưng việc di chuyển bị giới hạn trong mạng lưới siêu hành lang thiên hà. \n\nĐể tiến vào siêu không gian, một §SCon tàu§! trước tiên phải đến được rìa hệ sao, vượt ra ngoài giếng trọng lực của ngôi sao.\n\nĐiều này diễn ra tự động khi bạn ra lệnh cho một §SCon tàu§! di chuyển đến một §SHệ sao§! khác."
 tutorial.72.name:0 "Hướng dẫn: Du hành Lỗ sâu"
 tutorial.72.desc:0 "Để vượt qua khoảng cách bao la ngăn cách các £system£ §SHệ sao§!, các £scientist£ §SNhà khoa học§! của chúng ta đã phát triển công nghệ §SLỗ sâu§!. Các trạm được trang bị máy tạo lỗ sâu có thể đào hầm xuyên qua không gian phụ, tạo ra các cổng dẫn tạm thời tới các hệ sao khác để các §SCon tàu§! có thể đi qua.\n\nDu hành lỗ sâu gần như tức thì, nhưng đòi hỏi sự hiện diện của một Trạm Lỗ sâu trong phạm vi hoạt động. Các §SCon tàu§! cũng cần được trang bị các bộ ổn định lỗ sâu đặc biệt để chống chịu ứng suất khi đi qua không gian phụ."
 tutorial.73.name:0 "Hướng dẫn Nhắc nhở: Khai hóa"
 tutorial.73.desc:2 "Sau khi đã nghiên cứu công nghệ phù hợp, chúng ta nay đã có phương tiện để §YKhai hóa§! các sinh vật hạ đẳng đạt tới mức có tri giác.\n\nĐể khai hóa một §SLoài§!:\n\n£dot_green£ Mở £planet£ §SHành tinh§! của loài §STiền tri giác§!\n£dot_green£ Nhấp vào tab §SQuản lý§!\n£dot_green£ Chọn §SLoài§!\n£dot_green£ Nhấp vào §SThiết lập Quyền hạn§!\n£dot_green£ Nhấp vào §SKhai hóa§!\n\nLoài này sẽ bắt đầu quá trình khai hóa, đạt được tri giác hoàn toàn sau khi hoàn tất."
 tutorial.75.name:1 "Hướng dẫn: Yêu sách Hệ sao"
 tutorial.75.desc:2 "Giờ đây chúng ta đã bắt đầu thám hiểm các vì sao lân cận, có lẽ đã đến lúc mở rộng phạm vi ảnh hưởng.\n\nMột §STrạm Sao§! có thể được xây dựng xung quanh các ngôi sao trong các £system£ §SHệ sao§! đã khảo sát để mở rộng biên giới, cho phép chúng ta tuyên bố chủ quyền đối với các vùng không gian mới.\n\nVới các công nghệ trong tương lai, Trạm Sao có thể được nâng cấp để sản xuất các §SCon tàu§! hoặc những tài nguyên khác.\n\nĐể yêu sách một §SHệ sao§!:\n\n£dot_green£ Chọn một £construction_ship£ §STàu Xây dựng§!\n£dot_green£ Nhấp chuột phải vào một §SHệ sao§! đã khảo sát\n£dot_green£ Chọn §S[GetBuildGrowCap] Trạm Sao§!"
 tutorial.76.name:1 "Hướng dẫn: Nâng cấp Trạm Sao"
 tutorial.76.desc:1 "Tuyệt vời. Như bạn có thể thấy trên §SBản đồ Thiên hà§!, biên giới đế chế của chúng ta đã mở rộng bao trùm cả £system£ §SHệ sao§! nơi chúng ta vừa xây dựng §STrạm Sao§! mới.\n\nMột §STrạm Sao§! mới xây hoạt động như một Tiền đồn, với năng lực phòng thủ hạn chế và không có chỗ cho các §SMô-đun§! cùng £building£ §SCông trình§!. Do đó, nó chưa xuất hiện trong mục tổng quan cho đến khi được nâng cấp.\n\nĐể nâng cấp một §STrạm Sao§!:\n\n£dot_green£ Nhấp vào hệ sao trên §SBản đồ Thiên hà§!\n£dot_green£ Chọn §STrạm Sao§!\n£dot_green£ Nhấp vào nút §SNâng cấp§!"
 tutorial.80.name:0 "Hướng dẫn: Các Chế độ Bản đồ"
 tutorial.80.desc:0 "Trên Bản đồ Thiên hà, chúng ta có thể bật và tắt các §SChế độ Bản đồ§! khác nhau ở góc dưới cùng bên phải để xem các lớp phủ thông tin đa dạng. Ví dụ: chúng ta có thể mã hóa màu các vùng lãnh thổ dựa trên thiện cảm của các chủ sở hữu đối với chúng ta."

 tutorial.100.name:0 "Hướng dẫn Đã tắt"
 tutorial.100.desc:1 "§HNhiệm vụ Hướng dẫn§! và §HLời khuyên§! đã bị vô hiệu hóa."
 tutorial.101.name:1 "Chỉ Lời khuyên"
 tutorial.101.desc:0 "§HLời khuyên§! được bật, §HNhiệm vụ Hướng dẫn§! bị vô hiệu hóa."
 tutorial.102.name:0 "Hướng dẫn Đầy đủ"
 tutorial.102.desc:0 "§HNhiệm vụ Hướng dẫn§! và §HLời khuyên§! đều được bật."

 tutorial.1337.name:0 "Hướng dẫn: Cổ vật Phụ"
 tutorial.1337.desc:2 "Chúng ta đã phát hiện một số £minor_artifacts£ §SCổ vật Phụ§!. Đây là một loại tài nguyên bí truyền - thuật ngữ bao hàm chung cho các vật phẩm kỳ lạ mà chúng ta chưa hiểu rõ và trên thực tế có thể không thể giải thích được.\n\nChúng có thể được dùng để ban hành nhiều quyết sách khác nhau.\n\nĐể tương tác với §SCổ vật Phụ§!:\n\n£dot_green£ Nhấp vào nút §S$topbar_button_discoveries_name$§! trên thanh bên trái\n£dot_green£ Chọn tab §SBộ sưu tập§! hoặc nhấn §SC§!\n\n$tttt$$tt$£discoveries£\n"

 tutorial.1340.name: "Hướng dẫn: $astral_threads$"
 tutorial.1340.desc: "Chúng ta đã phát hiện một số £astral_threads£ §SSợi Tinh Giới§!. Đây là những sợi không-thời gian bị cô đặc: kết quả của sự va chạm giữa các chiều không gian. Thông thường, chúng chỉ có thể được thu hoạch từ các §SVết sẹo Tinh Giới§! hoặc thu hồi bên trong các £astral_rift£ §SKhe Nứt Tinh Giới§!.\n\nĐể thực hiện các §SHành động Tinh Giới§! khác nhau:\n\n£dot_green£ Nhấp vào nút §S$topbar_button_discoveries_name$§! trên thanh bên trái\n£dot_green£ Chọn tab §SSợi Tinh Giới§!\n\n$tttt$$tt$£discoveries£\n\nBạn có thể mở khóa các hành động bổ sung bằng cách khám phá các §SKhe Nứt Tinh Giới§!, vốn có thể xuất hiện từ các §SVết sẹo Tinh Giới§! hoặc hình thành thông qua các sự kiện dị thường khác."

 tutorial.2000.name:0 "Tiến hành Tiếp xúc Đầu tiên"
 tutorial.2000.desc:1 "Một số nhiệm vụ §STiếp xúc Đầu tiên§! sẽ đưa ra các lựa chọn về cách chúng ta muốn xử lý sự việc. Những lựa chọn này có thể ảnh hưởng lâu dài đến mối quan hệ ngoại giao của chúng ta với các đế chế khác."
 tutorial.2006.name:0 "Hướng dẫn: Ngoại giao"
 tutorial.2006.desc:0 "Các giao thức liên lạc đã được thiết lập. Giờ đây chúng ta có thể tham gia vào §SNgoại giao§! với Đế chế này. Thiện cảm hiện tại của họ đối với chúng ta phụ thuộc vào cách thức §STiếp xúc Đầu tiên§! đã diễn ra.\n\nĐể tham gia vào §SNgoại giao§!:\n\n£dot_green£Nhấp vào nút §SLiên lạc§! trên thanh bên trái hoặc nhấn §SF10§!\n\n$tttt$$tt$£contacts£\n\nTrong quá trình tiếp xúc đầu tiên, chúng ta cũng thu thập được Tin tức Tình báo. Khi chúng ta thu thập thêm Tình báo về một đế chế, nhiều chi tiết hơn về họ sẽ hiển thị rõ trước mắt chúng ta."
 tutorial.2007.name:0 "$tutorial.2006.name$"
 tutorial.2007.desc:1 "Chúng ta đã thực hiện §STiếp xúc Đầu tiên§! với một kiểu nền văn minh khác biệt - một kiểu văn minh nhìn chung không muốn tham gia vào §SNgoại giao§! với những kẻ khác.\n\nCác hành động ngoại giao mà chúng ta có thể thực hiện với những nền văn minh như thế này là rất hạn chế, tuy nhiên đôi khi họ có thể quyết định chủ động liên lạc với chúng ta."
 tutorial.2010.name:0 "Hướng dẫn: Chỉ định Đặc tình"
 tutorial.2010.desc:1 "§SĐặc tình§! là các điệp viên và cổ vật có giá trị, mang lại những hiệu ứng khác nhau cho các hoạt động Gián điệp của chúng ta. Họ hoạt động trong Mạng lưới Điệp viên và có thể được chỉ định vào các Điệp vụ, nơi họ có thể mở ra những cơ hội mới hoặc giúp chúng ta thoát khỏi rắc rối.\n\nChúng ta có thể nhận được Đặc tình thông qua các sự kiện, hoặc bằng cách thực hiện Điệp vụ §S$operation_acquire_asset$§!."

 tutorial.2100.name:0 "Hướng dẫn: Ngoại giao Vùng biệt lập"
 tutorial.2100.abbr.desc:0 "Chúng ta đã thực hiện §STiếp xúc Đầu tiên§! với một §SVùng biệt lập§!. Đây là một dạng đế chế độc lập, quy mô nhỏ hơn, có thể giao thương với các đế chế lớn hơn như chúng ta, sử dụng các hình thức Ngoại giao độc đáo."
 tutorial.2100.full.desc:0 "$tutorial.2100.abbr.desc$\n\nCác Vùng biệt lập cung cấp nhiều dịch vụ đa dạng: từ tiến hành nghiên cứu khoa học đến bán thông tin, các công trình trạm sao, và thậm chí cả các §SCon tàu§!. Việc mua các dịch vụ như thế này sẽ làm tăng §SThiện cảm§! của vùng biệt lập đó đối với chúng ta."
 tutorial.2105.name:0 "Hướng dẫn: $tutorial.2100.name$"
 tutorial.2105.abbr.desc:0 "Chúng ta đã chạm trán một §SVùng biệt lập Lính đánh thuê§!. Những chuyên gia quân sự độc lập này có thể cho các đế chế mượn các §SHạm đội Đánh thuê§! - bao gồm cả đế chế của chúng ta - với một khoản phí."
 tutorial.2105.full.desc:0 "$tutorial.2105.abbr.desc$\n\nNếu chúng ta chọn thuê một Hạm đội Đánh thuê, chúng ta sẽ giữ quyền kiểm soát hạm đội đó trong một khoảng thời gian nhất định. Trong thời gian đó, Vùng biệt lập sẽ cố gắng tăng viện cho hạm đội khi cần thiết, tuy nhiên cả Hạm đội Đánh thuê lẫn Đô đốc của họ đều không thể sáp nhập vào các hạm đội của riêng chúng ta."
 tutorial.2111.name:0 "Hướng dẫn: Vùng biệt lập Lính đánh thuê"
 tutorial.2111.abbr.desc:0 "§Y[tutorial_mercenary_fleet.GetName]§! hiện có khả năng trở thành một §SVùng biệt lập Lính đánh thuê§!, nếu chúng ta muốn. Hạm đội này sẽ không còn chịu sự kiểm soát trực tiếp của chúng ta nữa - thay vào đó nó sẽ trở thành một lực lượng độc lập, có khả năng cho các đế chế mượn các §SHạm đội Đánh thuê§! bao gồm cả đế chế của chúng ta."
 tutorial.2111.full.desc:0 "$tutorial.2111.abbr.desc$\n\nMiễn là chúng ta chia sẻ không gian với Vùng biệt lập Lính đánh thuê, chúng ta sẽ có cơ hội kiếm §Sthu nhập§! mỗi khi họ cho các đế chế khác thuê Hạm đội Đánh thuê của mình. Nếu chúng ta chọn tự mình thuê Hạm đội Đánh thuê, chúng ta sẽ giữ quyền kiểm soát hạm đội đó trong một khoảng thời gian nhất định. Các đế chế có thể trả thêm tiền để mua đứt hợp đồng hiện có nếu Hạm đội Đánh thuê hiện không khả dụng."
 tutorial.2115.name:0 "Hướng dẫn: Siêu kiến trúc"
 tutorial.2115.desc:0 "£megastructure£ §SSiêu kiến trúc§! là những đại công trình khổng lồ mà chúng ta có thể [GetBuildGrow] ngoài khoảng không vũ trụ bao la. Chúng có thể cung cấp cho chúng ta các cơ sở nghiên cứu tối tân, quyền tiếp cận các tài nguyên siêu việt, hoặc thậm chí một số hình thức vận tải độc nhất vô nhị.\n\nXây dựng ở quy mô như vậy đòi hỏi sự đầu tư đáng kể về thời gian và tài nguyên, nhưng phần thưởng mang lại cũng to lớn không kém. Chúng ta có thể bắt đầu bằng cách giao nhiệm vụ này cho một £construction_ship£ §STàu Xây dựng§!."
 tutorial.2120.name:0 "Hướng dẫn: $tech_orbital_ring_tier_1$"
 tutorial.2120.desc:0 "Nhờ những tiến bộ gần đây trong nghiên cứu kỹ nghệ siêu cấu trúc, chúng ta hiện có thể xây dựng các §SVành đai Quỹ đạo§! xung quanh các £planet£ §SHành tinh§! có thể sinh sống. Chúng ta có thể bắt đầu xây dựng bằng cách ban bố mệnh lệnh cho một £construction_ship£ §STàu Xây dựng§!."
 tutorial.2121.name:0 "$tutorial.2120.name$"
 tutorial.2121.desc:0 "§SVành đai Quỹ đạo§! là các £megastructure£ §SSiêu kiến trúc§! khổng lồ được xây dựng để bao quanh toàn bộ một £planet£ §SHành tinh§!. Chúng đóng vai trò như một cây cầu hiệu quả kết nối không gian với hành tinh bên dưới, cung cấp chỗ cho các cơ sở như Xưởng đóng tàu, công trình phòng thủ và các trung tâm tài nguyên.\n\nGiao diện Vành đai Quỹ đạo là nơi chúng ta có thể thêm hoặc bớt các £building£ §SCông trình§! và §SMô-đun§!, cũng như nâng cấp Vành đai Quỹ đạo lên các cấp cao hơn. Việc nâng cấp lên các cấp cao hơn sẽ tăng số lượng ô kiến trúc mà chúng ta có thể xây dựng. Cấp độ bị giới hạn bởi cơ sở hạ tầng của thuộc địa."
 tutorial.2125.name:0 "Hướng dẫn: $tech_quantum_catapult$"
 tutorial.2125.desc:0 "Những tiến bộ gần đây trong nghiên cứu kỹ nghệ siêu cấu trúc đồng nghĩa với việc chúng ta hiện có thể chế tạo một §SMáy phóng Lượng tử§! xung quanh một §Sngôi sao xung§! hoặc §Ssao neutron§!. Chúng ta có thể bắt đầu xây dựng bằng cách ban bố mệnh lệnh cho một £construction_ship£ §STàu Xây dựng§!."
 tutorial.2126.name:0 "Hướng dẫn: $tutorial.2125.name$"
 tutorial.2126.desc:0 "§SMáy phóng Lượng tử§! phóng các §SCon tàu§! và hạm đội qua những khoảng cách liên sao bao la. Công nghệ này cải thiện đáng kể khả năng phản ứng của chúng ta trước các tình huống mới phát sinh trong đế chế và tại các vùng không gian lân cận.\n\nViệc sử dụng Máy phóng Lượng tử tiềm ẩn một số rủi ro, vì các hạm đội của chúng ta có thể đáp xuống các £system£ §SHệ sao§! khác ngoài mục tiêu dự định. Chúng ta có thể giảm thiểu những rủi ro này - đồng thời cải thiện các yếu tố như thông lượng và tầm bắn tối đa - bằng cách nâng cấp Máy phóng Lượng tử lên các cấp cao hơn."
 tutorial.2130.name:0 "Hướng dẫn: $tech_hyper_relays$"
 tutorial.2130.desc:0 "Nghiên cứu kỹ nghệ siêu cấu trúc của chúng ta đã mang lại kết quả dưới dạng các §STrạm Tiếp sức Siêu không gian§!. Chúng ta có thể bắt đầu thiết lập một mạng lưới các trạm này bằng cách ban bố mệnh lệnh cho một £construction_ship£ §STàu Xây dựng§!."
 tutorial.2131.name:0 "Hướng dẫn: $tutorial.2130.name$"
 tutorial.2131.desc:0 "§STrạm Tiếp sức Siêu không gian§! cho phép di chuyển hiệu quả hơn giữa các £system£ §SHệ sao§! liền kề. Bằng cách liên kết §Sít nhất hai§! Trạm Tiếp sức Siêu không gian lại với nhau, chúng ta có thể bắt đầu thiết lập một mạng lưới giúp giảm đáng kể thời gian quá cảnh trên toàn đế chế.\n\nCác Trạm Tiếp sức Siêu không gian cũng có thể được xây dựng liền kề nhau qua các đường biên giới mở, kết nối toàn bộ các mạng lưới lại với nhau. Điều này sẽ cho phép các §SCon tàu§! di chuyển nhanh chóng qua các đế chế láng giềng."
 tutorial.2140.name:0 "Hướng dẫn: Trạm Quan sát"
 tutorial.2140.desc:0 "Chúng ta đã phát hiện một §Sxã hội Tiền FTL§!! Mặc dù họ thiếu loại công nghệ cho phép chúng ta vượt qua các vì sao, vẫn còn rất nhiều điều có thể thu được từ những người ngoài hành tinh này. Việc học hỏi từ nền văn hóa của họ hay biến họ thành nô lệ hoàn toàn tùy thuộc vào chúng ta.\n\nNếu muốn quan sát họ - giả sử họ nằm trong biên giới của chúng ta - chúng ta cần xây dựng một §STrạm Quan sát§! xung quanh thế giới của họ.\n\nNếu muốn xâm lược, tất cả những gì chúng ta cần làm là tập hợp quân đội; họ sẽ khó lòng có nhiều cơ hội kháng cự."
 tutorial.2145.name:0 "Hướng dẫn: Đã xây dựng Trạm Quan sát"
 tutorial.2145.desc.nodlc:1 "§STrạm Quan sát§! mới của chúng ta đã đi vào hoạt động và sẽ tiếp tục thực hiện §SNhiệm vụ§! của mình miễn là £awareness£ §SĐộ Nhận thức§! của đối tượng nghiên cứu vẫn ở mức thấp.\n\nMột khi một xã hội Tiền FTL đạt mức nhận thức tối đa, họ sẽ không còn có thể bị quan sát được nữa. Thay vào đó, chúng ta sẽ có thể tương tác với họ bằng các §SHành động Ngoại giao§!. Chúng ta có thể chọn tự lộ diện sớm nếu §SChính sách Can thiệp§! của chúng ta cho phép điều đó."
 tutorial.2145.desc.dlc:1 "§STrạm Quan sát§! mới của chúng ta đã đi vào hoạt động và sẽ tiếp tục thực hiện §SNhiệm vụ§! của mình miễn là £awareness£ §SĐộ Nhận thức§! của đối tượng nghiên cứu vẫn ở mức thấp.\n\nChúng ta sẽ thu được §SThấu hiểu Quan sát§!, một nhánh công nghệ độc nhất vô nhị, từ tiền đồn này cho đến khi xã hội Tiền FTL đạt mức nhận thức tối đa, khi đó các nhiệm vụ sẽ bị vô hiệu hóa. Thay vào đó, chúng ta sẽ có thể tương tác với họ bằng các §SHành động Ngoại giao§!.\n\nChúng ta có thể chọn tự lộ diện sớm nếu §SChính sách Can thiệp§! của chúng ta cho phép điều đó."
 tutorial.2150.name:0 "Hướng dẫn: $tutorial.2006.name$"
 tutorial.2150.desc:0 "Nền văn minh tiền FTL đã biết về sự tồn tại của chúng ta. Giờ đây chúng ta có thể tham gia vào hoạt động §SNgoại giao§! hạn chế với ban lãnh đạo §SHành tinh§!, tùy thuộc vào lập trường §SChính sách§! của chúng ta.\n\nKhi sự hiện diện của chúng ta đã được công khai với hành tinh này, sẽ không còn gì để thu được từ việc quan sát nền văn minh đó nữa. Các §SNhiệm vụ Quan sát§! của chúng ta đã bị vô hiệu hóa."

 tutorial.2500.name:0 "Hướng dẫn: Trường Tàng hình"
 tutorial.2500.desc:0 "Những tiến bộ gần đây trong nghiên cứu Thao túng Trường lực đã dẫn đến việc phát minh ra §S$science_cloaking_components$§!. Các linh kiện tiêu tốn nhiều năng lượng này phóng ra các trường hạt biến tính cho phép các tàu khoa học và quân sự của chúng ta ẩn mình trước các cảm biến thông thường.\n\nTuy nhiên, các trường tàng hình này sẽ tác động tiêu cực đến §S$MOD_SHIP_BASE_SPEED_MULT$§!, §S$MOD_SHIP_WINDUP_MULT$§! và §S$MOD_SHIP_SHIELD_HP_ADD$§! trong khi kích hoạt.\n\nCác con tàu §STàng hình§! không bị phát hiện có thể phớt lờ lệnh §SĐóng cửa Biên giới§!.\nTrong khi §STàng hình§!, các £science_ship£ §STàu Khoa học§! của chúng ta sẽ có khả năng tiến hành §STrinh sát Chủ động§! đối với các £colony£ §SThuộc địa§! nước ngoài, tăng lượng Tình báo mà chúng ta thu thập được về các đế chế khác."

 tutorial.2550.name:0 "Hướng dẫn: Dò tìm Tàng hình"
 tutorial.2550.desc:0 "Những tiến bộ gần đây trong nghiên cứu Điện toán đã dẫn đến việc phát minh ra §S$sm_detection_array_plural$§!. Việc lắp đặt các cảm biến bên ngoài công suất cao này trên các §STrạm Sao§! của chúng ta sẽ mang lại khả năng phát hiện các hạm đội §STàng hình§!.\n\nĐộ nhạy của §S$sm_detection_array_plural$§! có thể được tăng lên bằng cách ghép nối nhiều mảng cảm biến lại với nhau, cho phép chúng xuyên thủng các §STrường Tàng hình§! ngày càng ổn định hơn.\n\nVới nghiên cứu sâu hơn, chúng ta sẽ có thể sử dụng các £science_ship£ §STàu Khoa học§! để tăng cường hơn nữa các khả năng dò tìm này. Phạm vi của các thiết bị này bị giới hạn bởi §SPhạm vi Cảm biến§! của trạm sao."

 #############################
 # Tutorial Event Chains
 #############################
 tutorial_survey_system_chain_title: "Hướng dẫn: Chuyển đổi Bản đồ Thiên hà"
 tutorial_survey_system_chain_desc: "Trước khi có thể khám phá các vì sao, chúng ta cần mở rộng tầm nhìn của mình. Rất may, chúng ta có một §SBản đồ Thiên hà§! tinh vi sẵn sàng phục vụ. Để truy cập Bản đồ Thiên hà, bạn có thể nhấn phím §SM§! hoặc nút Thiên hà ở cuối màn hình. Sau đó, đừng ngần ngại đóng Nhật ký Tình hình bằng cách nhấn §SEsc§! hoặc nút ở góc trên cùng bên phải."
 map_toggled: "Đã chuyển đổi Bản đồ Thiên hà"
 tutorial_survey_system_tooltip: "Đã thêm §SHướng dẫn: Chuyển đổi Bản đồ Thiên hà§! vào Nhật ký Tình hình"
 tutorial_1_chain_title:1 "Hướng dẫn: Khảo sát Hệ sao"
 tutorial_1_chain_desc:4 "Bắt đầu bằng việc chọn £science_ship£ §STàu Khoa học§! của chúng ta. Điều này có thể được thực hiện bằng cách nhấp vào §SCon tàu§! trên §HBản đồ Thiên hà§! hoặc bằng cách chọn nó từ mục §STổng quan§!.\n\nTrong khi xem §SBản đồ Thiên hà§!, nhấp vào nút §SKhảo sát§! trên giao diện hạm đội ở góc dưới bên trái, sau đó chọn một £system£ §SHệ sao§! chưa khảo sát. Ngoài ra, bạn có thể nhấp chuột phải vào một hệ sao chưa khảo sát và chọn §SKhảo sát Hệ sao§!.\n\n§STàu Khoa học§! của chúng ta giờ đây sẽ vạch lộ trình và khảo sát toàn bộ các thiên thể hành tinh bên trong hệ sao đó."
 tutorial_unpause_chain_tooltip: "Đã thêm §SHướng dẫn: Hủy tạm dừng§! vào Nhật ký Tình hình"
 tutorial_unpause_chain_title: "Hướng dẫn: Hủy tạm dừng"
 tutorial_unpause_chain_desc: "Với một £science_ship£ §STàu Khoa học§! đang túc trực sẵn sàng khám phá thiên hà, tất cả những gì còn lại là hủy tạm dừng. Để làm điều này, bạn chỉ cần nhấn §SPhím Cách§! £space£ hoặc chọn biểu tượng sau trên thanh trên cùng:\n\n$tttt$$tttt$$t$£pause_button£\n"
 unpaused_game: "Đã hủy tạm dừng Mô phỏng"
 system_surveyed:1 "Đã khảo sát các Hệ sao Lân cận"
 tutorial_1_tooltip:1 "Đã thêm §SHướng dẫn: Khảo sát Hệ sao§! vào Nhật ký Tình hình"
 tutorial_2_chain_title:1 "Hướng dẫn: Nghiên cứu Công nghệ"
 tutorial_2_chain_desc:3 "Chúng ta cần nghiên cứu các công nghệ mới. §SNghị định thư Tân Thế giới§! sẽ cho phép chúng ta đóng các £colony_ship£ §STàu Thuộc địa§!, và chúng ta nên tập trung vào điều này càng sớm càng tốt nếu muốn mở rộng đế chế của mình.\n\nTruy cập màn hình §SCông nghệ§! bằng cách nhấp vào nút của nó ở phần bên trái của thanh trên cùng hoặc nhấn §SF4§!. Sau đó nhấp vào §SChọn Nghiên cứu§! và chọn một công nghệ để theo đuổi từ các tùy chọn có sẵn."
 tech_1_researched:0 "Đã nghiên cứu Nghị định thư Tân Thế giới"
 tech_2_researched:0 "Đã nghiên cứu Xây dựng Ngoài Hành tinh"
 tutorial_2_tooltip:1 "Đã thêm §SHướng dẫn: Nghiên cứu Công nghệ§! vào Nhật ký Tình hình"
 tutorial_3_chain_title:0 "Hướng dẫn: [GetBuildGrowCap] Tàu Xây dựng"
 tutorial_3_chain_desc:2 "Chúng ta sẽ cần một £construction_ship£ §STàu Xây dựng§! nếu muốn khai thác các tài nguyên được phát hiện bởi £science_ship£ §STàu Khoa học§! của chúng ta.\n\nNhấp vào Trạm Sao của chúng ta và chọn tab §SXưởng đóng tàu§!, sau đó chọn §STàu Xây dựng§! từ các lựa chọn có sẵn.\n\nLưu ý rằng bạn sẽ cần tích lũy đủ £alloys£ §SHợp kim§! để chi trả cho §SCon tàu§! trước khi có thể bắt đầu xây dựng nó."
 construction_ship_built:0 "Đã đóng Tàu Xây dựng"
 tutorial_3_tooltip:0 "Đã thêm §SHướng dẫn: [GetBuildGrowCap] Tàu Xây dựng§! vào Nhật ký Tình hình"
 tutorial_4_chain_title:0 "Hướng dẫn: [GetBuildGrowCap] Trạm Khai thác mỏ"
 tutorial_4_chain_desc:0 "Trước khi có thể thu thập một mỏ £minerals£ §SKhoáng sản§! hoặc một §STài nguyên Chiến lược§! từ một £planet£ §SHành tinh§!, một £mining_station£ §STrạm Khai thác mỏ§! cần được xây dựng trên quỹ đạo. Để làm điều này, hãy chọn £construction_ship£ §STàu Xây dựng§! của bạn bằng cách nhấp trực tiếp vào nó hoặc tìm nó trong mục §STổng quan§! ở phía bên phải màn hình.\n\nSau khi hoàn tất, nhấp vào nút §S[GetBuildGrowCap] Trạm Khai thác mỏ§! trong giao diện hạm đội của Tàu Xây dựng. Sau đó nhấp vào một hành tinh hoặc tiểu hành tinh khả dụng có mỏ Khoáng sản.\n\nLưu ý rằng việc xây dựng một £mining_station£ §STrạm Khai thác mỏ§! cũng tiêu tốn £minerals£ §SKhoáng sản§!, vì vậy bạn sẽ cần tích lũy đủ lượng dự trữ trước khi có thể bắt đầu xây dựng."
 mining_station_built:0 "Đã xây Trạm Khai thác mỏ"
 tutorial_4_tooltip:0 "Đã thêm §SHướng dẫn: [GetBuildGrowCap] Trạm Khai thác mỏ§! vào Nhật ký Tình hình"
 tutorial_5_chain_title:0 "Hướng dẫn: [GetBuildGrowCap] Trạm Nghiên cứu"
 tutorial_5_chain_desc:0 "Để cải thiện tốc độ nghiên cứu các công nghệ mới, các £science_ship£ §STrạm Nghiên cứu§! nên được xây dựng phía trên bất kỳ thế giới nào sở hữu các tài nguyên £physics£ §SVật lý§!, £society£ §SXã hội§! hoặc £engineering£ §SKỹ thuật§!.\n\nTrạm Nghiên cứu hoạt động phần lớn tương tự như các £mining_station£ §STrạm Khai thác mỏ§! - điểm khác biệt duy nhất nằm ở tài nguyên mà chúng thu thập. Chúng không có khả năng khai thác £minerals£ §SKhoáng sản§! hoặc £strategic_resource£ §STài nguyên Chiến lược§!.\n\nĐể xây dựng một trạm, hãy chọn £construction_ship£ §STàu Xây dựng§! của bạn và nhấp vào nút §S[GetBuildGrowCap] Trạm Nghiên cứu§! trong giao diện hạm đội của nó. Sau đó nhấp vào một £planet£ §SHành tinh§!, tiểu hành tinh hoặc ngôi sao khả dụng có mỏ tài nguyên Vật lý, Xã hội hoặc Kỹ thuật."
 research_station_built:0 "Đã xây Trạm Nghiên cứu"
 tutorial_5_tooltip:0 "Đã thêm §SHướng dẫn: [GetBuildGrowCap] Trạm Nghiên cứu§! vào Nhật ký Tình hình"
 tutorial_6_chain_title:0 "Hướng dẫn: Công trình Thuộc địa"
 tutorial_6_chain_desc:1 "Hành tinh quê nhà của chúng ta đã có sẵn một số lượng nhỏ £building£ §SCông trình§!, nhưng chúng ta nên xây thêm một công trình khác.\n\nĐể làm điều này, hãy chọn hành tinh quê nhà trong mục §STổng quan§! và nhấp vào tab §SBề mặt§!. Chọn một ô công trình trống trong một khu, và chọn từ một trong các công trình khả dụng. Giả sử chúng ta có đủ §STài nguyên§!, việc xây dựng sẽ bắt đầu ngay lập tức.\n\nCác công trình cung cấp £job£ §SViệc làm§!, nhưng sẽ không có gì được sản xuất cho đến khi các £pops£ §SPop§! được chỉ định làm việc ở đó. Bạn có thể kiểm tra xem các §SPop§! của bạn đang thực hiện những công việc nào trong tab §SKinh tế§!."
 building_constructed:0 "Đã xây xong Công trình"
 tutorial_6_tooltip:0 "Đã thêm §SHướng dẫn: Công trình Thuộc địa§! vào Nhật ký Tình hình"
 tutorial_7_chain_title:1 "Hướng dẫn: Dọn sạch Chướng ngại"
 tutorial_7_chain_desc:1 "Một vài £blocker£ §SChướng ngại§! trên hành tinh quê nhà của chúng ta đang ngăn cản việc xây dựng thêm các §SKhu quy hoạch§!, và cần phải được dọn sạch. Việc này tốn thời gian và tiêu hao §STài nguyên§!.\n\nĐể dọn sạch một §SChướng ngại§!, nhấp vào nút §SDọn sạch Chướng ngại§! trên chính chướng ngại đó, có thể tìm thấy trong tab §SQuản lý§!.\n\n\n$tttt$$tttt$$tt$£clear_blocker£\n\n\nCác §SChướng ngại§! có chi phí, yêu cầu công nghệ và thời gian dọn dẹp khác nhau."
 blockers_cleared:1 "Đã dọn sạch Chướng ngại"
 tutorial_7_tooltip:1 "Đã thêm §SHướng dẫn: Chướng ngại Đặc trưng§! vào Nhật ký Tình hình"
 tutorial_8_chain_title:0 "Hướng dẫn: Khảo sát các Hệ sao"
 tutorial_8_chain_desc:0 "Chúng ta cần mở rộng tầm ảnh hưởng ra ngoài £system£ §SHệ sao§! quê nhà, và bước đầu tiên để thực hiện điều này là khảo sát các hệ sao lân cận.\n\nĐể làm điều này, hãy chọn £science_ship£ §STàu Khoa học§! của bạn và nhấp vào nút §SKhảo sát§! trong giao diện hạm đội của nó. Sau đó nhấp vào nút §SMở Bản đồ Thiên hà§! ở cuối màn hình, và chọn một trong các ngôi sao lân cận với ngôi sao của chúng ta. §STàu Khoa học§! giờ đây sẽ hành trình đến hệ sao này và khảo sát toàn bộ các thiên thể bên trong."
 tutorial_8_poi:0 "Mục tiêu Khảo sát"
 tutorial_8_poi_desc:0 "Khảo sát các hệ sao §S[survey_target_1.GetName]§!, §S[survey_target_2.GetName]§! và §S[survey_target_3.GetName]§!."
 systems_surveyed:0 "Đã khảo sát các Hệ sao"
 tutorial_8_tooltip:0 "Đã thêm §SHướng dẫn: Khảo sát các Hệ sao§! vào Nhật ký Tình hình"
 tutorial_9_chain_title:0 "Hướng dẫn: [GetBuildGrowCap] Tàu Khoa học"
 tutorial_9_chain_desc:3 "Chúng ta nên cân nhắc [GetBuildingGrowing] một £science_ship£ §STàu Khoa học§! thứ hai để tăng tốc độ khảo sát khu vực thiên hà của chúng ta.\n\nNhấp vào Trạm Sao của chúng ta và chọn tab §SXưởng đóng tàu§!, sau đó chọn §STàu Khoa học§! từ các lựa chọn khả dụng.\n\nLưu ý rằng bạn sẽ cần tích lũy đủ £alloys£ §SHợp kim§! để chi trả cho §SCon tàu§! trước khi có thể bắt đầu xây dựng nó."
 science_ship_built:0 "Đã đóng Tàu Khoa học"
 tutorial_9_tooltip:0 "Đã thêm §SHướng dẫn: [GetBuildGrowCap] Tàu Khoa học Thứ hai§! vào Nhật ký Tình hình"
 tutorial_10_chain_title:0 "Hướng dẫn: Chiêu mộ Nhà khoa học"
 tutorial_10_chain_desc:2 "Chúng ta cần một £scientist£ §SNhà khoa học§! để chỉ huy £science_ship£ §STàu Khoa học§! mới của chúng ta, vì nó không thể khảo sát hoặc nghiên cứu §SDị thường§! nếu thiếu một người.\n\nChọn §STàu Khoa học§! mới của chúng ta, sau đó nhấp vào bức chân dung trên giao diện hạm đội. Cửa sổ §SChọn một Lãnh đạo§! sẽ mở ra, hiển thị tất cả các §SNhà khoa học§! hiện đang phục vụ chúng ta và những người sẵn sàng được tuyển dụng. Hãy chọn ứng viên bạn muốn.\n\nChiêu mộ một Lãnh đạo tiêu tốn £unity£ §YTính Thống nhất§!, và bạn có thể cần đợi cho đến khi tích lũy đủ lượng dự trữ.\n\nSau khi được chiêu mộ, §STàu Khoa học§! có thể bắt đầu thám hiểm."
 scientist_assigned:0 "Đã chiêu mộ Nhà khoa học"
 tutorial_10_tooltip:0 "Đã thêm §SHướng dẫn: Chiêu mộ Nhà khoa học§! vào Nhật ký Tình hình"
 tutorial_11_chain_title:0 "Hướng dẫn: [GetBuildGrowCap] Tàu Thuộc địa"
 tutorial_11_chain_desc:4 "Đã đến lúc thuộc địa hóa một thế giới khác. Đầu tiên chúng ta sẽ phải [GetBuildGrow] một £colony_ship£ §STàu Thuộc địa§!. Những §SCon tàu§! này mất nhiều thời gian để [GetBuildGrow] và đòi hỏi lượng lớn £alloys£ §SHợp kim§!, £food£ §SLương thực§! và £consumer_goods£ §SHàng tiêu dùng§!, nhưng một £colony£ §SThuộc địa§! thịnh vượng sẽ đền đáp vượt xa khoản đầu tư này.\n\nNhấp vào §STrạm Sao§! của bạn và mở tab §SXưởng đóng tàu§!. Sau đó chọn §STàu Thuộc địa§! từ các bản thiết kế có sẵn.\n\nBạn sẽ cần đủ tài nguyên trước khi việc xây dựng có thể bắt đầu."
 colony_ship_built:0 "Đã đóng Tàu Thuộc địa"
 tutorial_11_tooltip:0 "Đã thêm §SHướng dẫn: [GetBuildGrowCap] Tàu Thuộc địa§! vào Nhật ký Tình hình"
 tutorial_12_chain_title:0 "Hướng dẫn: Thành lập Thuộc địa"
 tutorial_12_chain_desc:3 "Giờ đây chúng ta nên sử dụng £colony_ship£ §STàu Thuộc địa§! mới để thành lập £colony£ §SThuộc địa§! đầu tiên của mình. Những ứng viên hành tinh tốt nhất là những hành tinh cùng phân lớp với hành tinh quê nhà của chúng ta - những người định cư của chúng ta sẽ không gặp trở ngại nào khi thích nghi với môi trường sống của họ.\n\nĐể thuộc địa hóa một £planet£ §SHành tinh§!, hãy nhấp vào §STàu Thuộc địa§! của bạn hoặc chọn nó trong mục §STổng quan§!. Sau đó nhấp vào nút §SThuộc địa hóa§! trên giao diện hạm đội của nó, và chọn hành tinh bạn muốn định cư. Lưu ý rằng bạn chỉ có thể thuộc địa hóa các hành tinh đã được khảo sát và không có §SDị thường§!. Chúng cũng phải nằm trong biên giới của bạn. Mặc dù bạn có thể chọn thuộc địa hóa các hành tinh có Độ Thích nghi thấp, nhưng làm vậy có thể rất tốn kém."
 colony_established:0 "Đã thành lập Thuộc địa"
 tutorial_12_tooltip:0 "Đã thêm §SHướng dẫn: Thành lập Thuộc địa§! vào Nhật ký Tình hình"
 tutorial_13_chain_title:0 "Hướng dẫn: Chiêu mộ Thống đốc"
 tutorial_13_chain_desc:1 "Chúng ta nên chiêu mộ một §SThống đốc§! để cai quản £colony£ §SThuộc địa§! mới của mình. Để làm điều này, hãy nhấp vào thuộc địa và chuyển tới tab §STổng quan Thuộc địa§!. Sau đó nhấp vào nút §SThay đổi§! trong cửa sổ §SThống đốc§!. Thao tác này sẽ mở màn hình §SLãnh đạo§!, hiển thị các Thống đốc hiện đang làm việc cho chúng ta.\n\nNhấp vào nút §SChiêu mộ§! ở phần trên cùng của màn hình, và chọn từ các ứng viên có sẵn. Lưu ý rằng Lãnh đạo luôn tiêu tốn £unity £§YTính Thống nhất§! để chiêu mộ. Nếu chúng ta thiếu số lượng cần thiết, chúng ta sẽ phải đợi cho đến khi tạo ra đủ để chi trả cho lãnh đạo.\n\nSau khi được chiêu mộ, Thống đốc mới sẽ chờ đợi được phân công trên hành tinh quê nhà của chúng ta."
 governor_recruited:0 "Đã chiêu mộ Thống đốc"
 tutorial_13_tooltip:0 "Đã thêm §SHướng dẫn: Chiêu mộ Thống đốc§! vào Nhật ký Tình hình"
 tutorial_14_chain_title:0 "Hướng dẫn: Thành lập thêm Thuộc địa"
 tutorial_14_chain_desc:1 "Tiếp tục mở rộng đế chế của chúng ta bằng cách lập các £colony£ §SThuộc địa§! mới. [GetBuildGrowCap] thêm các £colony_ship£ §STàu Thuộc địa§! khi chúng ta có đủ £alloys£ §SHợp kim§!, £food£ §SLương thực§! và £consumer_goods£ §SHàng tiêu dùng§!, sau đó điều động chúng đi thiết lập các thuộc địa mới.\n\nHãy cẩn thận đừng để có quá nhiều thuộc địa đang trong giai đoạn phát triển cùng lúc, vì chúng sẽ làm hao hụt £energy£ §SNăng lượng Tín dụng§! cho đến khi chúng có thể tự cung tự cấp."
 colonies_established:0 "Đã thành lập các Thuộc địa"
 tutorial_14_tooltip:0 "Đã thêm §SHướng dẫn: Thành lập thêm Thuộc địa§! vào Nhật ký Tình hình"
 tutorial_15_chain_title:0 "Hướng dẫn: Sản xuất Tài nguyên"
 tutorial_15_chain_desc:1 "Nền công nghiệp đang phát triển của chúng ta đang khao khát nguyên liệu thô, và chúng ta cần gia tăng nguồn cung £minerals£ §SKhoáng sản§!. Điều này được thực hiện bằng cách [GetBuildingGrowing] các £mining_station£ §STrạm Khai thác mỏ§! phía trên các £planet£ §SHành tinh§! và tiểu hành tinh có mỏ Khoáng sản, hoặc bằng cách xây dựng các §SKhu Khai thác mỏ§! trên bề mặt của một trong những hành tinh có người sinh sống của chúng ta.\n\nVì cả các trạm lẫn £building£ §SCông trình§! đều tiêu tốn £energy£ §SNăng lượng Tín dụng§! để duy trì, chúng ta cũng cần thiết lập một nguồn cung dồi dào cho tài nguyên này. Năng lượng Tín dụng được sản xuất bởi các §SKhu Máy phát điện§! trên bề mặt các hành tinh có cư dân sinh sống của chúng ta. Chúng cũng có thể thu được nhờ các §STrạm Khai thác mỏ§! được xây dựng trên các hành tinh, tiểu hành tinh hoặc ngôi sao có trữ lượng Năng lượng Tín dụng."
 mineral_income:0 "+30 Thu nhập Khoáng sản Hàng tháng"
 credit_income:0 "+10 Thu nhập Năng lượng Tín dụng Hàng tháng"
 tutorial_15_tooltip:0 "Đã thêm §SHướng dẫn: Sản xuất Tài nguyên§! vào Nhật ký Tình hình"
 tutorial_16_chain_title:0 "Hướng dẫn: Mở rộng Hạm đội"
 tutorial_16_chain_desc:5 "Chúng ta nên [GetBuildGrow] một hạm đội sao hùng mạnh để bảo vệ [Root.GetName].\n\nThêm một vài tàu §SHộ vệ hạm§! nữa là đủ cho hiện tại. [GetBuildGrowCap] các §SCon tàu§! tại một §STrạm Sao§! khi nguồn cung §SHợp kim§! của chúng ta cho phép. Các tàu quân sự mới luôn gia nhập vào bất kỳ hạm đội hiện có nào trên quỹ đạo của §STrạm Sao§! xây dựng chúng.\n\nĐể tối ưu hóa sức mạnh quân sự của hạm đội, chúng ta có thể chọn chỉ định cho hạm đội một §SĐô đốc§!. Điều này sẽ mang lại cho nó lợi thế trước các hạm đội khác, hầu hết trong số đó hoạt động mà không có một £commander£ §SChỉ huy§! của riêng mình."
 corvettes_built:0 "Đã đóng các Hộ vệ hạm"
 admiral_assigned:1 "Đã chỉ định Chỉ huy"
 tutorial_16_tooltip:0 "Đã thêm §SHướng dẫn: Mở rộng Hạm đội§! vào Nhật ký Tình hình"
 tutorial_17_chain_title:0 "Hướng dẫn: Thành lập Tinh khu"
 tutorial_17_chain_desc:1 "Có một giới hạn về số lượng £planet£ §SHành tinh§! mà bạn có thể trực tiếp kiểm soát. Giới hạn này có thể tìm thấy trên thanh trên cùng, và việc vượt quá giới hạn sẽ chịu các hình phạt. Các §STinh khu§! mang tính bán tự trị và quản lý các hành tinh đã được phân bổ dưới sự kiểm soát của chúng. Để tạo một tinh khu mới, hãy vào giao diện §SHành tinh và Tinh khu§! bằng cách nhấp vào biểu tượng liên quan trong danh sách thả xuống ở thanh trên cùng hoặc nhấn §SF5§!. Sau đó nhấp vào nút §STạo Tinh khu Mới§! ở phía trên bên phải.\n\nBây giờ bạn sẽ vào §SChế độ Quản lý Tinh khu§!. Từ đây, bạn chỉ định những £system£ §SHệ sao§! nào sẽ cấu thành nên tinh khu mới. Tất cả các hành tinh bên trong những hệ sao đó sẽ thuộc quyền tài phán của tinh khu. Chọn một hệ sao nơi chúng ta có một £colony£ §SThuộc địa§!, và nhấp vào nút §SHoàn tất§!. Giờ đây bạn đã tạo ra tinh khu đầu tiên của chúng ta!"
 sector_established:0 "Đã thành lập Tinh khu"
 tutorial_17_tooltip:0 "Đã thêm §SHướng dẫn: Thành lập Tinh khu§! vào Nhật ký Tình hình"
 tutorial_18_chain_title:0 "Hướng dẫn: Thống đốc Tinh khu"
 tutorial_18_chain_desc:2 "Chúng ta nên chỉ định một §SThống đốc§! để cai quản §STinh khu§! mới của mình. Tất cả các £planet£ §SHành tinh§! bên trong tinh khu sau đó sẽ được hưởng lợi từ các hiệu ứng của cấp độ kỹ năng và đặc điểm của Thống đốc."
 sector_governor_assigned:0 "Thống đốc Tinh khu"
 tutorial_18_tooltip:0 "Đã thêm §SHướng dẫn: Thống đốc Tinh khu§! vào Nhật ký Tình hình"
 tutorial_19_chain_title:0 "Hướng dẫn: Thiết kế Tàu"
 tutorial_19_chain_desc:2 "Để tạo một bản thiết kế tàu mới, hãy vào §SNhà thiết kế Tàu§! bằng cách nhấp vào §SQuản lý Hạm đội§! trên thanh bên trái, hoặc nhấn §SF9§!. Nhấp vào nút §SThiết kế Mới§!, và chọn §SHộ vệ hạm§! khi bạn được nhắc chọn §SKích thước Thân tàu§!. Nhấp vào nút §SKhông Phân khu§! để chọn một §SPhân khu§! cho thiết kế.\n\nHộ vệ hạm, loại chiến hạm nhỏ nhất, chỉ có một phân khu, trong khi các tàu lớn hơn có nhiều hơn. Các phân khu quyết định các ô §SVũ khí§! và §STIện ích§!. Hãy chọn một phân khu, sau đó lấp đầy các ô bằng các linh kiện, đảm bảo mức năng lượng luôn dương.\n\nĐể đơn giản hóa quy trình, hãy nhấp vào §STự động hoàn thiện Tàu§! và để trò chơi hoàn tất bản thiết kế."
 ships_designed:0 "Đã thiết kế Tàu"
 tutorial_19_tooltip:0 "Đã thêm §SHướng dẫn: Thiết kế Tàu§! vào Nhật ký Tình hình"
 tutorial_20_chain_title:0 "Hướng dẫn: Trạm Quan sát"
 tutorial_20_chain_desc:1 "Chúng ta nên [GetBuildGrow] một §STrạm Quan sát§! phía trên hành tinh quê nhà của một §Sxã hội [Owner.GetPreFTLUpper]§!. Các trạm không gian này có thể thực hiện một số §SNhiệm vụ§! khác nhau, mặc dù mức độ sẵn sàng can thiệp của chúng ta vào các nền văn hóa đang phát triển sẽ quyết định nhiệm vụ nào khả dụng.\n\nCác Trạm Quan sát được xây dựng theo cách tương tự như các Trạm §SKhai thác mỏ§! £mining_station£ hoặc £science_ship£ §SNghiên cứu§!, nhưng chúng chỉ có thể được xây dựng phía trên các hành tinh quê nhà của các Nền văn minh [Owner.GetPreFTLUpper]. Chỉ cần chọn một £construction_ship£ §STàu Xây dựng§!, sau đó nhấp vào nút §S[GetBuildGrowCap] Trạm Quan sát§! trong giao diện hạm đội của nó.\n\nBây giờ hãy chọn hành tinh quê nhà của các [Owner.GetPreFTLUpperPlural] mà bạn muốn nghiên cứu, và Tàu Xây dựng sẽ bắt đầu nhiệm vụ của mình."
 observation_post_built:0 "Đã xây Trạm Quan sát"
 tutorial_20_tooltip:0 "Đã thêm §SHướng dẫn: Trạm Quan sát§! vào Nhật ký Tình hình"
 tutorial_21_chain_title:1 "Hướng dẫn: Tài nguyên Chiến lược"
 tutorial_21_chain_desc:0 "Chúng ta nên [GetBuildGrow] một £mining_station£ §STrạm Khai thác mỏ§! trên quỹ đạo của một thiên thể có £strategic_resource£ §STài nguyên Chiến lược§!. Những vật liệu quý hiếm này có giá trị chiến lược to lớn.\n\nSau khi xác định được một tài nguyên như vậy thông qua việc §SKhảo sát§!, hãy chọn một £construction_ship£ §STàu Xây dựng§!, nhấp vào nút §S[GetBuildGrowCap] Trạm Khai thác mỏ§! và sau đó nhấp vào thiên thể thích hợp."
 tutorial_21b_chain_title:0 "Thông tin: Tài nguyên Chiến lược"
 tutorial_21b_chain_desc:1 "Chúng ta đã xây dựng một £mining_station£ §STrạm Khai thác mỏ§! trên quỹ đạo của một thiên thể có £strategic_resource£ §STài nguyên Chiến lược§!. Những vật liệu quý hiếm này đòi hỏi các công nghệ cụ thể để khai thác, có giá trị chiến lược to lớn, và chúng ta nên luôn để mắt tìm kiếm chúng."
 strategic_resource_extracted:0 "Đã khai thác Tài nguyên Chiến lược"
 tutorial_21_tooltip:0 "Đã thêm §SHướng dẫn: Tài nguyên Chiến lược§! vào Nhật ký Tình hình"
 tutorial_22_chain_title:0 "Hướng dẫn: Khai hóa Loài Tiền tri giác"
 tutorial_22_chain_desc:1 "Chúng ta nên §SKhai hóa§! một loài hạ đẳng, mặc dù trước tiên chúng ta có thể cần nghiên cứu công nghệ §SCò súng Ngoại di truyền§!.\n\n§SKhai hóa§! một loài tiền tri giác bằng cách chọn mục của chúng trong màn hình §SLoài§!, và sau đó nhấp vào nút Khai hóa."
 tutorial_22_tooltip:0 "Đã thêm §SHướng dẫn: Khai hóa Loài Tiền tri giác§! vào Nhật ký Tình hình"
 species_uplifted:0 "Đã khai hóa Loài Tiền tri giác"
 tutorial_23_chain_title:0 "Hướng dẫn: Tiếp xúc Đầu tiên"
 tutorial_23_chain_desc:1 "Sau khi chạm trán các thực thể chưa xác định trong bóng tối của không gian, chúng ta nên cố gắng §Sthiết lập liên lạc§!. \n\nĐiều này có thể đạt được bằng cách chọn §STiếp xúc Đầu tiên§! trong §SNhật ký Tình hình§! và nhấp vào nút §SHiển thị Tiếp xúc Đầu tiên§!, hoặc cách khác là nhấp vào biểu tượng §STiếp xúc Đầu tiên§! trên §SBản đồ Thiên hà§! để truy cập trực tiếp.\n\n\n$tttt$$tttt$$ttt$£firstcontact£\n"
 contact_made:0 "Đã thiết lập Tiếp xúc"
 tutorial_23_tooltip:0 "Đã thêm §SHướng dẫn: Tiếp xúc Đầu tiên§! vào Nhật ký Tình hình"
 tutorial_24_chain_title:0 "Hướng dẫn: Biến đổi Loài"
 tutorial_24_chain_desc:0 "Chúng ta có thể §SBiến đổi§! bất kỳ loài có tri giác nào sinh sống trong đế chế của mình, miễn là họ có đủ §SĐiểm Đặc trưng§!.\n\nĐiều này có thể đạt được bằng cách truy cập menu §SBiến đổi§! từ màn hình §SLoài§!, sau đó nghiên cứu §SDự án Đặc biệt§! thích hợp. Dự án đòi hỏi nghiên cứu £society£ §SXã hội học§! và sẽ chuyển hướng toàn bộ tiến trình công nghệ của chúng ta trong lĩnh vực đó khi đang hoạt động."
 species_modified:0 "Đã biến đổi Loài"
 tutorial_24_tooltip:0 "Đã thêm §SHướng dẫn: Biến đổi Loài§! vào Nhật ký Tình hình"
 tutorial_25_chain_title:1 "Hướng dẫn: Yêu sách Hệ sao"
 tutorial_25_chain_desc:1 "Chúng ta có thể mở rộng biên giới của mình bằng cách [GetBuildingGrowing] các §STrạm Sao§! xung quanh các ngôi sao của người ngoài hành tinh. Điều này bảo đảm chủ quyền cho £system£ §SHệ sao§!, cấp quyền truy cập tài nguyên, và chặn đường đi qua của các đối tượng liên lạc nếu biên giới bị đóng.\n\nChọn một £construction_ship£ §STàu Xây dựng§!, sau đó nhấp vào nút §S[GetBuildGrowCap] Trạm Sao§! trên giao diện hạm đội của nó và nhấp chuột trái vào một ngôi sao. Ngoài ra, bạn có thể nhấp chuột phải vào ngôi sao và chọn §S[GetBuildGrowCap] Trạm Sao§!.\n\nKhông giống như các trạm quỹ đạo khác, các §STrạm Sao§! có thể được xây dựng bên ngoài biên giới của chúng ta."
 frontier_outpost_built:1 "Đã xây Trạm Sao"
 tutorial_25_tooltip:2 "Đã thêm §SHướng dẫn: Trạm Sao§! vào Nhật ký Tình hình"
 TUTORIAL_PLANETVIEW_MANAGEMENT_TITLE: "Hướng dẫn: Quản lý"
 TUTORIAL_PLANETVIEW_MANAGEMENT_DESC: "Tab §SQuản lý§! hiển thị thông tin chính về tình trạng và bố cục của một £planet£ §SHành tinh§!.\n\nPhần §SĐặc trưng Hành tinh§! hiển thị các £blocker£ §Schướng ngại§! tự nhiên có thể dọn sạch, cũng như các §SĐặc trưng§! hiện có.\n\nPhần §SDân số Hiện tại§! hiển thị tất cả các £pops£ §SPop§! trên £planet£ §SHành tinh§!.\n\nBảng điều khiển £sector£ §STinh khu§! cho phép hành tinh được quản lý như một phần của một §STinh khu§!, tự động hóa việc quản trị thuộc địa.\n\n§SThăng thiên Thuộc địa§! cho phép bạn nâng tầm các thuộc địa của mình, nâng cấp hiệu quả các §SThuộc địa§!, nếu có đủ tài nguyên cần thiết."
 TUTORIAL_DATABANK_TITLE: "Hướng dẫn: Ngân hàng Dữ liệu"
 TUTORIAL_DATABANK_DESC: "£databank£ §SNgân hàng Dữ liệu§! là nguồn tài nguyên hàng đầu giúp bạn nắm bắt các hệ thống của trò chơi.\n\nCác mục được sắp xếp theo danh mục, giúp bạn dễ dàng tra cứu các cơ chế cụ thể, §SĐặc trưng§! hoặc khái niệm bất cứ khi nào bạn cần.\n\nChỉ cần tìm kiếm, hoặc chọn một chủ đề từ danh sách để tìm hiểu thêm."
 TUTORIAL_EMPIRE_FOCUS_TIMELINE_TITLE: "Hướng dẫn: Trọng tâm & Tiến trình Thời gian"
 TUTORIAL_EMPIRE_FOCUS_TIMELINE_DESC: "Hệ thống £focus_core£ §STrọng tâm Đế chế§! giúp định hướng sự phát triển của đế chế bằng cách cho phép bạn chọn một ưu tiên: £focus_exploration£ §SThám hiểm§!, £focus_conquest£ §SChinh phạt§! hoặc £focus_development£ §SPhát triển§!.\n\nMỗi trọng tâm bao gồm một bộ thẻ nhiệm vụ, được thiết kế để đưa ra định hướng dựa trên con đường bạn đã chọn. Hoàn thành một thẻ sẽ cấp §SĐiểm Tiến trình§! cho danh mục liên quan.\n\nTrọng tâm hiện tại làm tăng cơ hội rút được các nhiệm vụ liên quan. Các thẻ có thể được rút lại với chi phí £unity£ §YTính Thống nhất§!, và trọng tâm có thể thay đổi.\n\nTheo dõi các mục tiêu của bạn trong các tab §SĐã hoàn thành§! và §STiến trình§! để xem bạn đã tiến gần đến bậc phần thưởng tiếp theo đến mức nào.\n\n§STiến trình Thời gian§! hiển thị các cột mốc quan trọng và các sự kiện lịch sử trong lịch sử đế chế của bạn, bắt đầu từ §SNguồn gốc§! của nó. Các mục mới xuất hiện khi các sự kiện quan trọng diễn ra theo thời gian."
 TUTORIAL_COLONIZATION_TITLE: "Hướng dẫn: Thuộc địa hóa Hành tinh"
 TUTORIAL_COLONIZATION_DESC: "Màn hình §SThuộc địa hóa§! là nơi bạn chuẩn bị cho một hành tinh để thuộc địa hóa.\n\nMột §SLoài§! phải được chọn để định cư trên hành tinh đó, và một §SĐịnh danh Thuộc địa§! được chỉ định để thiết lập trọng tâm phát triển của nó.\n\nBản tổng quan về các §SKhu quy hoạch§! khả dụng, §SQuy mô Hành tinh§! và các §SHiệu ứng Điều chỉnh§! tiềm năng được hiển thị, cùng với bất kỳ §SĐặc trưng Hành tinh§! nào có thể ảnh hưởng đến hành tinh.\n\nƯu tiên phát triển dựa trên tài nguyên thiên nhiên của §SHành tinh§! sẽ giúp bạn khai thác tối đa các thuộc địa của mình."
