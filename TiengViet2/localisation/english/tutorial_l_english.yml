 advisor.1.desc_03:0 "Kính chào Ngài Cao ủy.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu. Nhiệm vụ của tôi là đưa ra lời khuyên và hỗ trợ khi chúng ta tìm kiếm vận mệnh giữa các vì sao.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_04:0 "Kính chào Ngài Chấp chính quan.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu và là bề tôi khiêm nhường của Ngài. Vai trò của tôi là cung cấp cho Ngài lời khuyên và ý kiến tham mưu khi Ngài dẫn dắt đế chế tiến vào cõi vô định vĩ đại.\n\n$advisor.1.desc_filler$"
#  advisor.1.desc_05:0 "Good day, Lord Protector.\n\nI am VIR, a prototype synthetic intelligence and your humble servant. My role is to provide you with advice and counsel as you lead our empire into the great unknown.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_06:0 "Kính chào Tổng Giám đốc Điều hành.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu. Trụ sở Tập đoàn gần đây đã kích hoạt tôi để tôi có thể phục vụ với tư cách trợ lý của Ngài trong sứ mệnh tiếp diễn nhằm tìm kiếm các £market£ §SThị trường§! liên sao mới.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_07:0 "Kính chào Hoàng thượng Bệ hạ.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu và là bề tôi khiêm nhường của Bệ hạ. Vai trò của tôi là cung cấp cho Bệ hạ lời khuyên và ý kiến tham mưu khi Bệ hạ dẫn dắt đế chế tiến vào cõi vô định vĩ đại.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_08:0 "Nguyện sự bình an ở cùng Ngài, Thưa Thủ tướng.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu. Nhiệm vụ của tôi là hỗ trợ và cố vấn cho Ngài khi chúng ta lần đầu tiên trong lịch sử mạo hiểm vượt ra ngoài sự an toàn của quê nhà.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_09:0 "Nguyện sự bình an ở cùng Ngài, Thưa Điều phối viên.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu. Nhiệm vụ của tôi là hỗ trợ và cố vấn cho Ngài khi chúng ta lần đầu tiên trong lịch sử mạo hiểm vượt ra ngoài sự an toàn của quê nhà.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_10:0 "Nguyện sự bình an ở cùng Bệ hạ.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu. Nhiệm vụ của tôi là hỗ trợ và cố vấn cho Bệ hạ khi chúng ta lần đầu tiên trong lịch sử mạo hiểm vượt ra ngoài sự an toàn của quê nhà.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_11:0 "Nguyện sự bình an ở cùng Ngài, Thưa Đấng Bảo hộ Tĩnh lặng.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu. Nhiệm vụ của tôi là hỗ trợ và cố vấn cho Ngài khi chúng ta lần đầu tiên trong lịch sử mạo hiểm vượt ra ngoài sự an toàn của quê nhà.\n\n$advisor.1.desc_filler$"
