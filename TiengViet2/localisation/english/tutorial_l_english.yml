 advisor.1.desc_30:0 "Cầu chúc phước lành cho Đức Thánh Thiện.\n\nTôi là VIR, một trí tuệ nhân tạo nguyên mẫu. Giáo hội đã phong chức cho tôi để đóng vai trò như bề tôi trung thành và người cố vấn của Ngài, để tôi có thể phò tá Ngài trên con đường thiêng liêng tiến vào các vì sao.\n\n$advisor.1.desc_filler$"
