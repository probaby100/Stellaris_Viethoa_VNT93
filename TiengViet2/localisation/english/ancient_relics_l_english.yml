 bombardment_pox:0 "Bệnh Đậu mùa Javorian"
 bombardment_pox_desc:0 "Trận oanh tạc $bombardment_pox$ sẽ gieo rắc một mầm bệnh chết người xuống hành tinh.\n— Gây sát thương §YVừa§! cho §YLục quân§!\n— Gây sát thương §ENhẹ§! cho §YHành tinh§!\n— §EKHÔNG§! gây sát thương cho §YDân số Người máy§!\n— Gây sát thương §RTàn phá§! cho §YDân số Hữu cơ§!\n— Sẽ oanh tạc các hành tinh không được phòng thủ\n— Có thể biến hành tinh thành một hành tinh chết chóc không còn sự sống"

 pc_relic:0 "Thế Giới Di Tích"
 pc_relic_plural: "Thế Giới Di Tích"
 pc_relic_desc:0 "Một đô thị từng trải rộng trên toàn bộ bề mặt thế giới này. Giờ đây nơi này chỉ còn lại những tàn tích cổ xưa hoang phế, cư dân nguyên bản từ lâu đã rời đi."
 trait_pc_relic_preference:0 "Ưa thích Thế Giới Di Tích"
 trait_pc_relic_preference_short:0 "Thế Giới Di Tích"
 trait_pc_relic_preference_desc:0 "$trait_pc_arctic_preference_desc$"
 mod_pc_relic_habitability:0 "Độ Thích Nghi Thế Giới Di Tích"
 d_collapsed_spire:1 "£blocker£ Tháp chóp Sụp đổ"
 d_collapsed_spire_desc:0 "Một tháp chóp dân cư khổng lồ trong khu vực này đã sụp đổ dưới sức nặng của chính nó, chặn đứng lối vào. Vào thời điểm nó còn sừng sững trên mặt đất, tòa tháp này hẳn phải là một trong những công trình kiến trúc cao chót vót nhất trên hành tinh."
 add_zone_central_spire_tt: "Đã thêm chuyên môn Khu vực Thành phố: §Y£zone£$zone_central_spire$§!"
 d_collapsed_spire_blocks_zone: "Dọn dẹp $d_collapsed_spire$"
 d_massive_crevice:1 "£blocker£ Khe nứt Khổng lồ"
 d_massive_crevice_desc:0 "Khu vực này từng là một khu đô thị đông đúc dân cư, nhưng giờ đây đã bị xẻ làm đôi bởi một khe nứt khổng lồ. Cấu trúc địa chất ở đây cực kỳ bất ổn, thường xuyên xảy ra động đất và lở đất."
 d_shattered_solar_array:1 "£blocker£ Mảng Năng lượng Mặt trời Vỡ nát"
 d_shattered_solar_array_desc:0 "Những mảnh vỡ nát này vốn là phần còn sót lại của một mảng năng lượng mặt trời khổng lồ nào đó. Vào thời kỳ hoàng kim, nó hẳn đã cung cấp năng lượng cho một khu vực đáng kể trên hành tinh."
 d_flooded_reactor_pits:1 "£blocker£ Hố Lò phản ứng Ngập lụt"
 d_flooded_reactor_pits_desc:0 "Những cái hố sâu hoắm này từng là nơi đặt các cơ sở sản xuất năng lượng chủ chốt của hành tinh. Hàng triệu năm trôi qua, những trận mưa rào và lũ lụt đã biến những cái hố thành những vũng bùn lầy lội."
 d_crumbling_mining_tunnels:1 "£blocker£ Đường hầm Khai thác Sụp đổ"
 d_crumbling_mining_tunnels_desc:0 "Mạng lưới đường hầm khai thác đan chéo phức tạp bên dưới bề mặt hành tinh dường như từng là nguồn cung cấp khoáng sản chính cho hành tinh này. Hàng ngàn năm qua, những trận lở đá và sụp lở đã khiến phần lớn các đường hầm bị vùi lấp, chỉ còn lại một phần nhỏ có thể đi lại."
 d_ancient_reactor_pits:0 "Hố Lò phản ứng Cổ đại"
 d_ancient_reactor_pits_desc:0 "Những cái hố sâu hoắm nằm gần đường xích đạo của hành tinh này từng là nơi đặt các máy phát điện chính của hành tinh. Điều đáng kinh ngạc là cơ sở hạ tầng của nó vô cùng kiên cố, cho đến nay vẫn có thể sử dụng được, chúng ta có thể đặt các lò phản ứng mới vào trong đó."
 d_immense_solar_array:0 "Mảng Năng lượng Mặt trời Khổng lồ"
 d_immense_solar_array_desc:0 "Kích thước của mảng năng lượng mặt trời này gần bằng một lục địa nhỏ. Phần lớn mảng này đã vỡ nát, không thể sửa chữa, nhưng cơ sở hạ tầng năng lượng ở tầng dưới của nó vẫn có thể sử dụng, biến nó thành địa điểm lý tưởng để sản xuất năng lượng."
 d_abandoned_mining_tunnels:0 "Đường hầm Khai thác Bỏ hoang"
 d_abandoned_mining_tunnels_desc:0 "Khoáng sản được vận chuyển từ những đường hầm này đã góp phần xây dựng nên nhiều tàn tích trên bề mặt hành tinh. Mặc dù phần lớn đã bị khai thác cạn kiệt, nhưng vẫn còn một số đường hầm có thể mang lại sản lượng phong phú."
 d_central_spire:0 "Tháp chóp Trung tâm"
 d_central_spire_desc:0 "Cấu trúc hình tháp này từng là trung tâm quản lý của hành tinh. Vị trí trung tâm và cấu trúc bên trong gần như nguyên vẹn của nó mang đến cơ hội tuyệt vời để nghiên cứu các tàn tích trên hành tinh."
 zone_central_spire: "$d_central_spire$"
 zone_central_spire_desc: "$d_central_spire_desc$"
 d_industrial_sector:0 "Khu Công nghiệp"
 d_industrial_sector_desc:0 "Khu vực này từng là trung tâm sản xuất công nghiệp cốt lõi của hành tinh. Các nhà máy chế tạo và nhà máy lọc dầu ở đây đã ngừng hoạt động từ lâu, nhưng vẫn có thể tìm thấy một lượng lớn tài nguyên nằm rải rác trong khu vực."
 d_relic_dense_ruins:0 "Tàn tích Dày đặc"
 d_relic_dense_ruins_desc:0 "Việc nghiên cứu một lượng lớn tàn tích bao phủ trên bề mặt thế giới di tích có thể hỗ trợ nghiên cứu khoa học, nhưng sự tồn tại của chúng cũng sẽ hạn chế không gian sống."
 d_relic_metal_boneyard:0 "$d_metal_boneyard$"
 d_relic_metal_boneyard_desc:0 "$d_metal_boneyard_desc$"
 decision_arcology_project_relic:1 "Xây dựng lại Hành tinh Đô thị"
 decision_arcology_project_relic_effects:0 "$decision_arcology_project_effects$"
 decision_arcology_project_relic_effects_short:0 "$decision_arcology_project_effects_short$"
 decision_arcology_project_relic_desc:0 "Hành tinh này từng là một hành tinh đô thị tràn đầy sức sống. Nhiệm vụ xây dựng lại hành tinh vô cùng gian nan, nhưng chúng ta có thể khôi phục lại vinh quang huy hoàng năm xưa của nó."

 mega.201.desc:0 "Từ thế hệ này sang thế hệ khác, những tàn tích lạnh lẽo và tĩnh lặng trên [Root.GetName] vẫn luôn ngủ yên tại đây, âm thầm kể về kỷ nguyên hoàng kim đã kết thúc đột ngột từ hàng triệu năm trước.\n\nMọi thứ bắt đầu thay đổi. Đô thị bao phủ toàn bộ hành tinh này đã được tái sinh, những tàn tích mục nát vì nhiều năm không được tu sửa nay lại tràn đầy sức sống. Ở những nơi có thể sửa chữa, các tòa nhà và cơ sở hạ tầng hiện có đã được tân trang và quy hoạch lại mục đích sử dụng. Còn đối với những khu vực hư hại quá nặng nề, gạch vụn và tàn tích trên đó cũng đã được dọn sạch, dọn đường cho việc xây dựng những công trình mới."
 d_former_relic_world:0 "Hành tinh Từng là Tàn tích"
 d_former_relic_world_desc:0 "Hành tinh đô thị này vốn là một thế giới di tích bị bỏ hoang. Hầu hết các tàn tích cũ đã được quy hoạch lại hoặc dọn sạch trong quá trình xây dựng lại thành đô thị bao trùm toàn bộ thế giới, nhưng nơi đây vẫn còn lưu giữ nhiều địa điểm có giá trị khoa học."

