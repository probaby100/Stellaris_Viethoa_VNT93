 cybrex_war_forge:0 "$r_war_forge$"
 yuht_cryo_core:0 "$r_cryo_core$"
 javorian_pox:0 "$r_pox_sample$"
 javorian_pox_desc:0 "Hạm đội hiện có thể sử dụng §YGieo rắc Bệnh dịch§! làm trạng thái oanh tạc quỹ đạo đối với các hành tinh."
 reality_perforator_1:0 "$r_reality_perforator$"
 reality_perforator_1_desc:1 "Bạn đã bao giờ trải qua một ảo giác chân thực đến mức không thể phân biệt được với đời thực chưa?"
 reality_perforator_2:0 "$r_reality_perforator$"
