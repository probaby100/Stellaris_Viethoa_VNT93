 lithoids_arc_site_minerals:0 "Di Chỉ Khảo Cổ"
 lithoids_arc_site_minerals_desc:0 "Việc khai quật Di Chỉ Khảo Cổ sâu vào các tầng đá đã buộc toàn bộ hoạt động khai thác khoáng sản trên hành tinh phải tạm dừng."
 evermore_science:0 "Khoa học Vĩnh hằng"
 evermore_science_desc:0 "Những cư dân được số hóa đang sống trong thiên đường \"Cõi Vĩnh Hằng\" nay được chỉ định hỗ trợ nghiên cứu khoa học cho chúng ta."
 evermore_joy:0 "Niềm vui Vĩnh hằng"
 evermore_joy_desc:0 "Cư dân trên hành tinh này giờ đây có thể cùng chia sẻ ảo mộng với các cư dân số hóa của thiên đường \"Cõi Vĩnh Hằng\"."
