 # Technologies

 archaeostudies:0 "Cổ đại học"
 archaeostudies_desc:0 "Những viên ngọc công nghệ ẩn giấu trong quá khứ đang chờ được khai quật."
 tech_archaeostudies:0 "Cổ đại học"
 tech_archaeostudies_desc:0 "Nghiên cứu trong lĩnh vực này tập trung vào việc phát triển những ứng dụng thiết thực từ Cổ vật cổ đại. Chúng ta không phải là nền văn minh đầu tiên trong thiên hà vươn tới các vì sao. Chỉ cần nỗ lực khai thác, di sản của họ hoàn toàn có thể thắp sáng con đường tương lai của chúng ta."

 tech_secrets_cybrex:0 "Lõi Khai thác Cybrex"
 tech_secrets_cybrex_desc: "Trong quá trình xây dựng Thế Giới Vành Đai, Cybrex đã phụ thuộc vào một loại máy bay khai thác không người lái có hiệu suất cao, với khả năng khảo sát và thu hoạch các nguồn tài nguyên trên quỹ đạo. Các chip nhớ và cảm biến do Cybrex chế tạo có thể tăng cường các hoạt động khai thác của chính chúng ta, nhờ đó chúng ta có thể tận dụng một cách hiệu quả các thuật toán cổ xưa của họ."
 tech_secrets_league:0 "Văn phòng Lưu trữ Liên minh Đệ nhất"
 tech_secrets_league_desc:0 "Vào thời kỳ hoàng kim, quy mô khổng lồ của đế chế Liên minh Đệ nhất đã làm lu mờ chúng ta, và chỉ có một hệ thống quan liêu vô song mới đủ sức giúp cỗ máy khổng lồ này vận hành trơn tru. Hệ thống lưu trữ song song mà họ sử dụng đã mang lại hiệu quả chưa từng thấy trong việc phân loại và bảo quản tài liệu."
 tech_secrets_irassian:0 "Xưởng Đóng tàu Hải quân Irassian"
 tech_secrets_irassian_desc:0 "Truyền thống hải quân không gian của người Irassian là vô song trong thời đại của họ. Các chiến hạm hải quân và tàu buôn ồ ạt xuất xưởng như nước chảy, điều này có lẽ cũng đã gieo mầm cho sự suy tàn của chính họ. Bởi lẽ người Irassian đã chế tạo ra một số lượng khổng lồ tàu thuyền và phụ thuộc cực kỳ nặng nề vào chúng, khiến họ hoàn toàn bất lực trong việc kiểm soát dịch bệnh đã xóa sổ toàn bộ đế chế."
 tech_secrets_vultaum:0 "Máy tính Thực tại Vultaum"
 tech_secrets_vultaum_desc:0 "Máy tính Thực tại của người Vultaum là một bộ xử lý chuyên dụng độc đáo dành riêng cho việc phân tích bản thân \"sự tồn tại\", nó không hoạt động thông qua các quy luật vật lý, mà giống như đang đảo ngược mã nguồn của thực tại và tìm kiếm những lỗ hổng bên trong đó để người Vultaum có thể phá vỡ \"quá trình giả lập\" mà họ tin rằng mình đang sống trong đó."
 tech_secrets_yuht:0 "Giao thoa kế Thiên văn Yuht"
 tech_secrets_yuht_desc:0 "Nền văn minh Yuht là một xã hội đầy rẫy mâu thuẫn, một mặt họ bị ám ảnh bởi ý tưởng tìm kiếm các chủng loài có tri giác khác, mặt khác họ lại từ chối chấp nhận sự thật rằng mình không hề đơn độc. Họ đã dùng mọi cách để bác bỏ mọi sự sống ngoài hành tinh, và định kiến của họ cũng thấm nhuần vào chính công nghệ của họ. Tuy nhiên, bằng những điều chỉnh thích hợp, chúng ta hoàn toàn có thể sửa chữa được mạng lưới cảm biến mạnh mẽ của họ."
 tech_secrets_baol:0 "Nhà máy Hữu cơ Baol"
 tech_secrets_baol_desc:0 "Cách thức sinh vật Baol tạo ra các công cụ vô cùng độc đáo. Do loài này di chuyển khá chậm chạp, họ sẽ trực tiếp sử dụng các sinh vật hữu cơ để \"trồng\" ra những công cụ thiết yếu bên trong một cơ sở giống như sự pha trộn giữa vườn cây ăn trái và nhà máy. Thông qua các điều chỉnh di truyền thích hợp, chúng ta cũng có thể trực tiếp \"trồng\" ra nhiều vật phẩm và công cụ ngay trên các trang trại thông thường."
 tech_secrets_zroni:0 "Máy chiếu Bão Zro"
 tech_secrets_zroni_desc:0 "Zro là một loại vật chất đáng kinh ngạc, có xu hướng giải phóng năng lượng một cách vô cùng bạo liệt. Chúng tôi tin rằng, chỉ cần sử dụng Cổ vật đúng cách, chúng ta có thể tạo ra một cơn bão vũ trụ bao trùm toàn bộ một hệ sao."

 tech_archaeoshield:0 "Trường lực Trì hoãn Cổ đại"
 tech_archaeoshield_desc:0 "Trường lực Trì hoãn có cự ly phát xạ vượt xa các loại khiên thông thường, nó có thể mượn sức mạnh của các Cổ vật để làm chậm dòng chảy thời gian ngay tại khoảnh khắc va chạm, cung cấp một khoảng thời gian dài hơn để khiên tiêu hao năng lượng của đòn tấn công."
 tech_archaeoarmor:0 "Giáp Xung Cổ đại"
 tech_archaeoarmor_desc:0 "Tận dụng nguyên lý phát xạ trường và xung từ tính, lớp giáp ion hóa này có thể nạp các điện tích phản ứng, qua đó làm suy giảm đáng kể năng lượng từ các vụ va chạm."
 tech_archaeo_detection_scrambler:0 "Máy gây nhiễu Nhận dạng Cổ đại"
 tech_archaeo_detection_scrambler_desc:0 "Các trạm lặp tín hiệu phản xạ và bộ khuếch tán ánh sáng mang bước sóng chuẩn xác có thể tạo ra sự giao thoa triệt tiêu, gây nhiễu loạn hiệu quả hệ thống khóa mục tiêu của quân địch."
 TECH_UNLOCK_SCRAMBLER_TITLE:0 "$TECH_UNLOCK_COMPONENT_LINE$$tech_archaeo_detection_scrambler$"
 TECH_UNLOCK_SCRAMBLER_DESC:0 "$tech_archaeo_detection_scrambler_desc$"
 tech_archaeo_rampart:0 "Thành lũy Cổ đại"
 tech_archaeo_rampart_desc:0 "Trong công tác phòng thủ, mặc dù các Nền tảng Phòng thủ có tỷ lệ lợi ích trên chi phí cực cao, nhưng chúng vẫn cần được vận hành bởi trung tâm điều khiển. Tăng cường cho Căn cứ Không gian, nâng cao khả năng sinh tồn của nó khi bị tấn công, đồng thời tối đa hóa năng lực kết nối mạng các cơ sở phòng thủ quỹ đạo độc lập sẽ mang lại cho chúng ta nhiều thời gian hơn để triển khai quân tiếp viện."
 tech_archaeo_titan_beam:0 "Tia Hủy diệt Cổ đại"
 tech_archaeo_titan_beam_desc:0 "Hỏa lực tầm trung với cường độ cao sẽ giúp các con tàu lớp Titan của chúng ta chọc thủng phòng tuyến kẻ thù dễ dàng hơn. Những khẩu pháo cổ đại này từng là nền tảng để xây dựng nên một đế quốc toàn tinh hải."
 tech_archaeo_overcharger:0 "Bộ Ép xung Khiên Cổ đại"
 tech_archaeo_overcharger_desc:0 "Nhờ có các cuộn dây ổn định và bộ giảm xóc cổ đại, khiên chắn có thể thực hiện quá trình ép xung một cách an toàn. Bên cạnh việc tạo ra trường lực mạnh hơn, tính năng này còn có thể bốc hơi trực tiếp một phần các viên đạn bay tới."
 tech_archaeo_refinery:0 "Nhà máy Tinh chế Cổ đại"
 tech_archaeo_refinery_desc:0 "Cơ sở xử lý có tuổi đời hàng triệu năm này sở hữu hiệu suất hoạt động vượt mức 100%. Cách thức hoạt động của nó vẫn là một ẩn số, nhưng mức độ gia tăng sản lượng khổng lồ mà nó mang lại là không thể đong đếm được."
 tech_archaeo_pk_devolving_beam:0 "Tia Thoái hóa"
 tech_archaeo_pk_devolving_beam_desc:0 "Đây là một loại vũ khí xóa sổ tâm trí đẳng cấp Colossus, có thể phóng ra một làn sóng năng lượng bao trùm toàn bộ hành tinh, ép hầu hết các dạng sống có tri giác thoái hóa trở lại tình trạng chưa khai hóa. Chúng tôi ước tính rằng, sau những điều chỉnh chuyên sâu hơn, nó thậm chí có thể dùng để xóa sổ bộ nhớ của các đơn vị máy móc và khiến chúng tê liệt."
 is_ai_world_no_archaeoengineers: "§R$TRIGGER_FAIL$ Thế giới Trí tuệ Nhân tạo cần phải có Điểm Thăng thiên $ap_archaeoengineers$ thì mới có thể trở thành mục tiêu của $tech_archaeo_pk_devolving_beam$§!"
 tech_archaeo_mass_drivers:0 "Khẩu đội Pháo Khổng lồ Cổ đại"
 tech_archaeo_mass_drivers_desc:0 "Những khẩu đội pháo đồ sộ này bắn ra các viên đạn có tốc độ tương đối chậm nhưng sức công phá lại vô cùng khủng khiếp. Dễ hiểu hơn, chúng có thể bắn bất cứ thứ gì, bao gồm cả phế liệu kim loại, mảnh vỡ tiểu hành tinh, v.v."
 tech_archaeo_lasers:0 "Máy Sụp đổ Xâm thực Cổ đại"
 tech_archaeo_lasers_desc:0 "Thứ vũ khí năng lượng cao này khi đánh trúng mục tiêu sẽ tạo ra những sự kiện vi sụp đổ dữ dội, giải phóng một lượng lớn nhiệt lượng và ứng suất vào hệ thống lá chắn của đối phương."
 tech_archaeo_point_defence:0 "Máy ném Lưới Phòng thủ Cổ đại"
 tech_archaeo_point_defence_desc:0 "Nếu nói đến việc khóa và đánh chặn tên lửa, thì những dàn pháo kỳ lạ này là tuyệt đỉnh. Thuật toán dự đoán được viết bằng những dòng mã cổ đại có thể dệt nên một mạng lưới hỏa lực phòng thủ không kẽ hở."
 tech_archaeo_missiles:0 "Bệ phóng Đám mây Tên lửa Nano Cổ đại"
 tech_archaeo_missiles_desc:0 "Một khi được ổn định bằng công nghệ cổ đại, chúng ta có thể sử dụng các hạt điện tích để tạo ra những cụm tên lửa siêu nhỏ mang theo lượng lớn thuốc nổ với sức công phá đáng gờm, dùng để áp đảo các hệ thống phòng thủ điểm của đối phương."
 tech_archaeo_mass_accelerator:0 "Pháo phóng Chất bão hòa Cổ đại"
 tech_archaeo_mass_accelerator_desc:0 "Khẩu pháo này khai hỏa một tràng đạn lưới gồm những quả cầu bị ion hóa siêu nhỏ để vô hiệu hóa phần lớn các trường lực, giúp nó có được khả năng xuyên thấu khiên chắn cực mạnh. Mặc dù từng có giả thuyết cho rằng những quả cầu tuyệt đẹp này có thể dùng làm đồ trang sức, nhưng sau một vụ tai nạn nghiêm trọng làm tan chảy cả một phòng thí nghiệm, mọi đề xuất liên quan đã bị bác bỏ hoàn toàn."
 tech_archaeo_strike_crafts:0 "Máy bay Khoan không người lái Cổ đại"
 tech_archaeo_strike_crafts_desc:0 "Những máy bay không người lái tốc độ cao này được trang bị loại laser khai khoáng đặc biệt, chúng gần như có thể phớt lờ mọi lớp giáp bảo vệ của mục tiêu. Quả là phí phạm khi một công nghệ tốt như vậy lại chỉ được dùng để khai thác khoáng sản."


