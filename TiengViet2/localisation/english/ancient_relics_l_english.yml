 artifact_action_locked_desc:0 "Những £minor_artifacts£cổ vật nhỏ của chúng ta chắc chắn có thể dùng vào nhiều việc hơn nữa."
 artifact_action_locked_failtext:0 "Mở khóa một hành động cổ vật nhỏ mới.\n\n$TRIGGER_FAIL$§RYêu cầu công nghệ £society£ §!§Y$tech_arcane_deciphering$§!§R.§!"
