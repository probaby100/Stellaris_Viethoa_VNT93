 ##################
 leader_trait_traumatized:0 "Chấn thương Tâm lý"
 leader_trait_traumatized_desc:0 "Những chấn thương tâm lý phải gánh chịu gần đây đã ảnh hưởng đến màn thể hiện của vị thủ lĩnh này."
 leader_trait_maimed:0 "Tàn tật"
 leader_trait_maimed_desc:0 "Vị thủ lĩnh này đã phải chịu một tổn thương thể chất không thể đảo ngược, tuổi thọ dự kiến đã bị sụt giảm nghiêm trọng."
 leader_trait_inspired_archaeologist:0 "Nhà khảo cổ được Truyền Cảm hứng"
 leader_trait_inspired_archaeologist_desc:0 "Vị thủ lĩnh này bỗng nhiên tìm được nguồn cảm hứng."
 leader_trait_inspired_researcher:0 "Nhà nghiên cứu được Truyền Cảm hứng"
