 district_rw_farming:0 "Phân khu Nông nghiệp"
 district_rw_farming_plural:0 "Phân khu Nông nghiệp"
 district_rw_farming_desc:0 "Một biển trang trại vô tận lấp đầy phân khu Thế Giới Vành Đai này, ngập tràn một lượng lớn lương thực thực phẩm."
