 sm_zroni_storm_caster:0 "$tech_secrets_zroni$"
 sm_zroni_storm_caster_desc:0 "Máy chiếu Bão không hoàn toàn là công nghệ của người Zroni. Chúng tôi chỉ phát hiện ra rằng, việc đặt Zro vào môi trường khắc nghiệt sẽ kích thích năng lượng tiềm ẩn bên trong nó bung tỏa dưới một hình thái cực kỳ hỗn loạn, gây ra hàng loạt nhiễu loạn nguy hiểm và các hiện tượng tự nhiên cực đoan. Sau vô số tai nạn dẫn đến những suy tư sâu sắc, chúng tôi đã tìm ra cách kiểm soát sức mạnh này: chế tạo một loại tinh thể từ người Zroni để kích hoạt một cơn bão tâm linh khốc liệt, có sức mạnh càn quét qua toàn bộ một hệ sao.\n"
 sm_zroni_storm_caster_desc_modifier:0 "[Root.GetZroniStormCasterEffect]"
 zroni_storm_caster_desc:0 "Tạo ra một §YBão Nhân tạo§! trong một hệ sao:\nCản trở §YTàu Thăm dò§!\nGiảm §YTốc độ Tàu§! và §YTốc độ Bắn§!\nVô hiệu hóa §Ylá chắn§!\nTăng cường §YKhiên chắn§!"
 improved_zroni_storm_caster_desc:0 "Tạo ra một §YBão Nhân tạo§! trong một hệ sao:\nCản trở §YTàu Thăm dò§!\nGiảm §YTốc độ Tàu§! và §YTốc độ Bắn§!\nVô hiệu hóa §Ylá chắn§!\nTăng cường §YKhiên chắn§!\nGây sát thương liên tục cho §Ytàu địch§! trong hệ sao này."

