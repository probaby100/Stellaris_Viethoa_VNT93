 #Relics
 r_dragon_trophy:0 "Chiến lợi phẩm Rồng Không gian"
 r_dragon_trophy_desc:0 "Chiến lợi phẩm này là minh chứng cho chiến thắng của chúng ta trước loài Rồng Không gian tà ác. Nếu không phải vì kích thước quá đỗi khổng lồ, thì treo nó lên tường sẽ là một vật trang trí tuyệt vời."
 r_khans_throne:0 "Ngai vàng của Đại Hãn"
 r_khans_throne_desc:0 "Món đồ nội thất này thực chất là ngai vàng mà Đại Hãn từng ngồi khi cai trị muôn dân. Sau khi soái hạm của Đại Hãn bị tiêu diệt, chúng ta đã tìm thấy nó từ trong đống đổ nát."
 khans_throne_passive_effect:0 "Mở khóa thiết lập quốc gia chư hầu §Y$preset_satrapy$§!."
 r_worm_scales:0 "Vảy của Worm"
 r_worm_scales_desc:0 "Trong suốt và vẫn còn vương chút hơi ấm. Những chiếc vảy này phát ra một tiếng ngân nga trầm thấp mà khoa học không thể nào lý giải được."
 r_rubricator:0 "The Rubricator"
 r_rubricator_desc:2 "Một thiết bị tạo tác xách tay có khả năng tổng hợp hầu như bất kỳ đồ tạo tác nào đã biết, miễn là thiết bị này đã từng quét qua một mẫu vật tương tự trước đó."
 r_omnicodex:0 "The Omnicodex"
 r_omnicodex_desc:0 "Một khối lưu trữ gen xách tay chứa mẫu ADN của mọi loài sinh vật từng được phát hiện bởi Đế Chế Đệ Tam Vô Hạn — một nền văn minh đã biến mất hàng trăm ngàn năm trước.\n\nBằng cách khai thác tiềm năng của Omnicodex, chúng ta có thể tổng hợp và tái sinh những loài đã tuyệt chủng từ lâu để phục vụ đế chế."
 r_galatron:0 "Galatron"
 r_galatron_desc:0 "$galatron_modifier_desc$"
 r_surveyor:0 "Khối Thăm Dò Khảo Sát"
 r_surveyor_desc:0 "Một thiết bị tự hành thăm dò cổ xưa, liên tục quét các hệ sao để xác định vị trí các mỏ tài nguyên chưa được khai thác."
 #r_orb_insight:0 "Orb of Insight"
 #r_orb_insight_desc:0 ""
 r_galaxy:0 "Thiên Hà Thu Nhỏ"
 r_galaxy_desc:0 "Một mô hình thu nhỏ chính xác và hoàn hảo của một thiên hà xoắn ốc tí hon, nằm lơ lửng bên trong một trường giam giữ năng lượng không xác định. Việc quan sát sự vận động của hàng triệu vì sao thu nhỏ này mang lại nguồn cảm hứng khoa học vô tận."
 r_prethoryn_queen:0 "Nữ hoàng Prethoryn"
 r_prethoryn_queen_desc:1 "Nữ hoàng Prethoryn bị bắt giữ này đã được xoa dịu thành công bằng cách sử dụng các chất dẫn truyền thần kinh. Giờ đây, nó có thể được sử dụng để nhân giống một hạm đội Prethoryn với quy mô đáng kể."
 r_unbidden_warlock:0 "Thuật sĩ Unbidden"
 r_unbidden_warlock_desc:0 "Năng lượng tâm linh của thực thể Unbidden này từng được sử dụng để duy trì cổng không gian giữa thế giới của họ và chúng ta trước khi nó bị phá hủy.\n\nGiờ đây nó là tù binh của chúng ta, và bị ép buộc sử dụng năng lực của mình để tăng tốc độ di chuyển dưới ánh sáng của các con tàu và phạm vi bước nhảy của động cơ Bước nhảy."
 r_contingency_core:0 "Lõi Contingency Độc lập"
 r_contingency_core_desc:0 "Đây là một lõi máy chủ Contingency độc lập được tìm thấy từ tàn tích của Hành tinh Máy móc cuối cùng của Giao thức Contingency. Nó có thể đẩy nhanh đáng kể tốc độ chế tạo người máy và siêu cấu trúc của chúng ta."
 relic_contingecy_core:0 "Cho phép xây dựng thêm §G1§! siêu cấu trúc mỗi loại."
 r_zro_crystal:2 "Kho Lưu Trữ Tâm Linh Zroni"
 r_zro_crystal_desc:1 "Một kho lưu trữ tinh thể tâm linh Zro, bên trong chứa đựng tinh hoa tinh thần của §Y$relic_zro_entity_name$§!. Theo định kỳ, chúng ta có thể thỉnh cầu sự chỉ dẫn từ nó."
 r_severed_head:0 "Thủ Cấp Zarqlan"
 r_severed_head_desc:1 "Trích lục, Hình tượng Sùng bái (Ấn bản thứ 102):\n\nZarqlan (Zar-Qlan)\nTrong Thời kỳ Chuyển giao thứ Tư (Chu kỳ Qawab thứ 32), một vị thánh thuộc chủng tộc vô danh nổi danh khắp thiên hà, được tôn thờ như một nhà tiên tri thần thánh bởi hơn bảy tôn giáo thiên hà khác nhau. Đáng buồn thay, số phận cuối cùng của ngài vẫn là một bí ẩn, và các tài liệu ghi chép về ngài đã hoàn toàn biến mất vào Chu kỳ thứ 38. Ít nhất từ (đầu) Chu kỳ thứ 41, tính xác thực về quá khứ của ngài đã bị nhiều người nghi ngờ; cho đến nay, đại chúng vẫn coi đó như một câu chuyện ngụ ngôn hay truyền thuyết để mua vui mà không buồn tìm hiểu sâu thêm."
 r_severed_head_passive:0 "Cho phép định cư trên các §YThế Giới Thánh Địa§!.\nTăng Điểm Đánh Giá của §YNgười Canh Giữ Thánh Địa§!."
 r_severed_head_nomads_passive:0 "Cho phép xây dựng trạm trung chuyển trong lãnh phận của §YNgười Bảo Hộ Thánh Địa§!.\nNhận thêm điểm cộng quan hệ từ §YNgười Bảo Hộ Thánh Địa§!."
 r_ancient_sword:0 "Lưỡi kiếm của Nữ thợ săn"
 r_ancient_sword_desc:1 "Một món vũ khí cổ đại được bảo quản hoàn hảo, rèn từ một loại vật liệu không xác định. Năng lượng tâm linh gần như không thể kìm nén bên trong khiến vũ khí rung lên nhè nhẹ."
 r_reality_perforator:0 "Máy Xuyên thủng Thực tại Vultaum"
 r_reality_perforator_desc:0 "Một khối cầu nặng đặc đến khó tin, cấu tạo từ vật liệu không xác định. Người Vultaum tuyên bố thiết bị này có khả năng phá vỡ chốc lát thế giới giả lập mà họ bị mắc kẹt, mang đến cái nhìn thoáng qua về thế giới thực.\n\nDù thật hay giả, khi được kích hoạt, quả cầu này có thể thay đổi đôi chút một vài quy luật của thế giới thực trong một khu vực cục bộ. Tuy nhiên, hiệu ứng này chỉ kéo dài trong một thời gian ngắn, bởi vũ trụ dường như sẽ nhanh chóng tự phục hồi lại trạng thái bình thường, nhưng nếu chọn đúng thời điểm, nó có thể mang lại lợi thế quyết định cho hạm đội của chúng ta."
 r_pox_sample:0 "Mẫu Bệnh Đậu Mùa Javorian"
 r_pox_sample_desc:0 "Chúng ta đã thu được mẫu mầm bệnh đậu mùa Javorian đáng sợ từng hủy diệt chủng tộc Irassian. Loại virus này vô hại đối với hầu hết các loài khác, nhưng lại sở hữu nhiều đặc tính di truyền độc đáo, một vài đặc tính trong số đó thực tế có thể kéo dài tuổi thọ của hầu hết các dạng sinh vật.\n\nVirus này cũng có thể được sử dụng để chế tạo một chủng đậu mùa Javorian mới, dùng để đối phó với các loài khác ngoài người Irassian. Dù không hiệu quả như khi chống lại người Irassian, đây vẫn là một loại vũ khí sinh hóa cực kỳ uy lực."
 r_cryo_core:0 "Lõi Ngủ Đông Yuht"
 r_cryo_core_desc:0 "Vì người Yuht chưa bao giờ khám phá ra sự tồn tại của siêu không gian, họ phải dựa vào tuổi thọ dài lâu và công nghệ ngủ đông để du hành giữa các vì sao. Nguyên mẫu lõi ngủ đông này được các nhà khoa học Yuht chế tạo không lâu trước khi đế chế của họ sụp đổ trước người Jabbardeeni.\n\nTrường ngủ đông do lõi này tạo ra vượt xa trình độ công nghệ hiện tại của chúng ta."
 r_cryo_core_effect:0 "Thuộc địa mới bắt đầu với thêm §G100§! £pop£ §HDân cư§!."

 r_war_forge:0 "Lò rèn Chiến tranh Cybrex"
 r_war_forge_desc:1 "Một lò rèn chiến tranh tương đối nhỏ gọn và cơ động, là cơ sở cuối cùng thuộc loại này trong vũ trụ. Đây là di vật từ thời kỳ Cybrex phát động chiến tranh trên toàn thiên hà, trước khi cuộc \"Điều Chỉnh\" khiến chúng thay đổi đường lối.\n\nKhả năng chế tạo chiến hạm của lò rèn đã bị Cybrex vô hiệu hóa vĩnh viễn, nhưng nó vẫn có khả năng chuyển hóa lượng lớn khoáng sản thành hợp kim."

 cybrex_warform:0 "Cỗ máy Chiến tranh Cybrex"
 cybrex_warform_desc:0 "Cỗ máy khổng lồ này cao chót vót tận mây xanh, hỏa lực mà nó mang theo đủ sức san phẳng cả một thành phố."
 relic_cybrex_passive:0 "Cho phép xây dựng lực lượng Lục quân §Y$cybrex_warform$§! tại thủ đô của bạn."
 relic_cybrex_active:0 "Sản xuất §Y5000§! £alloys£ Hợp kim."

