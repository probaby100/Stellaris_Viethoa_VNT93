 artifact_precursor_clue_locked: "$artifact_precursor_clue$"
 artifact_precursor_clue_locked_desc: "Biết được vị trí di chỉ của Kẻ Đi Trước."
 artifact_precursor_clue_locked_failtext: "§RCần tiếp cận một di chỉ tàn tích của Kẻ Đi Trước. Hãy khảo sát một hệ sao có tàn tích Kẻ Đi Trước nằm trong bờ cõi của bạn. Các đế chế du mục cần dựng một trạm tiếp vận bên trong hoặc kề cận hệ sao như vậy.§!"

 artifact_precursor_clue:0 "Tìm kiếm manh mối Kẻ Đi Trước"
 artifact_precursor_clue_desc:0 "Chúng ta có thể dùng những món cổ vật này để lần ra vị trí một di chỉ của Kẻ Đi Trước."
 artifact_precursor_clue_effect:0 "Biết được vị trí một di chỉ của Kẻ Đi Trước.\n\nThời gian hồi: £time£§Y1800 ngày§!"
