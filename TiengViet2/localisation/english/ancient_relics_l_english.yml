 decision_machine_oracle:0 "Kích hoạt Trung tâm Oracle"
 decision_machine_oracle_desc:0 "Kích hoạt phần mềm tuân thủ và mô hình dự đoán của Trung tâm Oracle để loại bỏ các xu hướng dị thường của máy bay không người lái."

