 district_rw_generator_plural:0 "Phân khu Máy phát"
 district_rw_generator_desc:0 "Các lò phản ứng lấp đầy phân khu Thế Giới Vành Đai này, chuyên tâm vào việc sản xuất năng lượng."
 district_rw_science:0 "Phân khu Nghiên cứu"
 district_rw_science_plural:0 "Phân khu Nghiên cứu"
 district_rw_science_desc:0 "Phân khu Thế Giới Vành Đai này chứa đầy các loại cơ sở nghiên cứu."
 district_rw_commercial:0 "Phân khu Thương mại"
 district_rw_commercial_plural:0 "Phân khu Thương mại"
 district_rw_commercial_desc:0 "Phân khu Thế Giới Vành Đai này tràn ngập các nhà máy dân dụng và cơ sở chuyên dụng cho thương mại."

 district_rw_city:0 "Phân khu Thành phố"
 district_rw_city_plural:0 "Phân khu Thành phố"
 district_rw_city_desc:0 "Phân khu Thế Giới Vành Đai này có đầy các trung tâm thành phố, cung cấp một lượng lớn nhà ở và không gian làm việc cho đội ngũ nhân viên."
 district_rw_hive:0 "Phân khu Tổ đội"
 district_rw_hive_plural:0 "Phân khu Tổ đội"
 district_rw_hive_desc:0 "Những ngọn tháp cao chót vót trải khắp phân khu Thế Giới Vành Đai này, khi không làm việc, các cá thể con sẽ tập trung tại đây để nạp chất dinh dưỡng."
 district_rw_nexus:0 "Phân khu Điểm nối"
 district_rw_nexus_plural:0 "Phân khu Điểm nối"
 district_rw_nexus_desc:0 "Các khu vực có hiệu suất cao lấp đầy phân khu Thế Giới Vành Đai này. Trước khi triển khai công việc, máy bay không người lái sẽ được bảo trì trong các khu vực tập trung này."

 district_rw_industrial:0 "Phân khu Công nghiệp"
 district_rw_industrial_plural:0 "Phân khu Công nghiệp"
 district_rw_industrial_desc:0 "Phân khu Thế Giới Vành Đai này tràn ngập những nhà máy vang lên tiếng búa đập và các máy móc uy lực, cung cấp một nền tảng công nghiệp vững chắc cho đế chế."

 district_srw_commercial:0 "$district_hab_commercial$"
 district_srw_commercial_plural:0 "$district_hab_commercial_plural$"
 district_srw_commercial_desc:0 "Một khu vực ngập tràn văn phòng và nhà máy, nơi đủ loại hàng hóa được sản xuất và mua bán."

 district_srw_mining_desc:0 "Những đường hầm này ăn sâu vào khung của Thế Giới Vành Đai vỡ nát, giúp chúng ta có thể khai thác vật liệu ngay từ chính cấu trúc vòng."

