 oracle_software_integration:0 "Trung tâm Oracle"
 oracle_software_integration_desc:0 "Oracle thông tỏ mọi điều."
 oracle_administration:0 "Oracle"
 oracle_administration_desc:0 "Oracle giúp đế chế vận hành trơn tru như một cỗ máy được bôi dầu kỹ lưỡng... miễn là bạn đã tra dầu cho nó."
 chosen_of_zarqlan:0 "Tuyển dân của Zarqlan"
 chosen_of_zarqlan_desc:0 "Với tư cách là Tuyển dân của Zarqlan, chúng ta có thể thực dân hóa các Thánh địa một cách an toàn."
 the_memorex:0 "Memorex"
 the_memorex_desc:1 "Dự án học tập tăng cường của Memorex có thể đào tạo người dân trong lúc họ ngủ đông để đáp ứng nhu cầu của đế chế, giúp gia tăng đáng kể sản lượng của dân số."
 opinion_destroyed_caravaneer_home:1 "Phá hủy Quê hương Thương nhân"
 opinion_upset_destroyed_caravaneer_home:0 "$opinion_destroyed_caravaneer_home$"
