 #Tutorial
 TUTORIAL_RELICS_VIEW_TITLE:0 "Hướng dẫn: Di vật"
 TUTORIAL_RELICS_VIEW_DESC:2 "Chúng ta có thể duyệt và kích hoạt §HDi vật§! trong giao diện Di vật, cũng như thực thi các quyết định để tận dụng §HCổ Vật Nhỏ§! của mình.\n\nCác hạng mục được đánh dấu §YQuyết định Hành tinh§! ở đây chỉ mang tính chất tham khảo, cần được thực thi trong giao diện Quyết định Hành tinh."

 TUTORIAL_ARCHAEOLOGY_VIEW_TITLE:0 "Hướng dẫn: Khảo cổ học"
 TUTORIAL_ARCHAEOLOGY_VIEW_DESC:0 "Cửa sổ khảo cổ học sẽ hiển thị thông tin chi tiết về §YDi Chỉ Khảo Cổ§! hiện đang được chọn. Sau khi đạt được tiến độ, bạn vẫn có thể quay lại và đọc các giai đoạn trước đó bằng cách nhấp vào biểu tượng cổ tự.\n\nĐể hé lộ bí mật của tàn tích, Sĩ quan Khoa học phải đạt được §YĐột phá§! mới có thể thúc đẩy từng giai đoạn của tàn tích. Các nhà khoa học sở hữu §YĐặc điểm§! liên quan và §Ykỹ năng cao§! sẽ đẩy nhanh tiến trình bước sang giai đoạn tiếp theo, ngược lại, mức độ khó cao của một tàn tích sẽ làm chậm tiến trình này. Bất kỳ nhà khoa học nào nghiên cứu cùng một tàn tích trong thời gian đủ dài đều sẽ tích lũy được §YManh mối§!, từ đó tăng khả năng đạt được đột phá."

