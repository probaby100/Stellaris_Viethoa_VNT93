 relic_galaxy_active:0 "Nhận §Y50%§! tiến độ nghiên cứu của một công nghệ ngẫu nhiên."
 relic_zro_crystal_passive:5 "Thời gian Hồi chiêu §YĐột nhập Cõi Màn Sương§! được rút ngắn §G50%§!.\nMở khóa chỉ lệnh §Y$edict_zro_crystal$§!, gia tăng kinh nghiệm thu được cho Thủ lĩnh và kéo dài tuổi thọ của họ."
 edict_zro_crystal:0 "Chất phụ gia Zro"
 edict_zro_crystal_desc:0 "Bản chất của Zro vô cùng kỳ bí. Nếu được cung cấp cho các thủ lĩnh của chúng ta, dường như họ có thể đạt được một năng lực thấu thị nhất định, qua đó thúc đẩy quá trình học hỏi của họ và né tránh một số nguy hiểm tiềm ẩn có thể dẫn đến cái chết bất đắc kỳ tử."
 edict_zro_crystal_machine:0 "$edict_zro_crystal$"
 edict_zro_crystal_machine_desc:0 "Bản chất của Zro vô cùng kỳ bí. Nếu được phun lên bo mạch chủ của các thủ lĩnh của chúng ta, dường như có thể giúp họ đạt được một năng lực thấu thị nhất định, qua đó thúc đẩy quá trình học hỏi của họ và né tránh một số nguy hiểm tiềm ẩn có thể dẫn đến hỏng hóc ngoài ý muốn."
 edict_zro_crystal_machine_effect:0 "Tỷ lệ gặp sự cố hỏng hóc ngoài ý muốn của thủ lĩnh máy móc giảm §Y50%§!."
 relic_zro_crystal_active:0 "Liên lạc với thực thể tâm linh §Y$relic_zro_entity_name$§! để thỉnh cầu sự chỉ dẫn cho các sự vụ khác."
