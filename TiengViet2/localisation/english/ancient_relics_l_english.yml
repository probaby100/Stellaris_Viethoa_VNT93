 artifact_find_peaceful_applications:0 "Nghiên cứu ứng dụng dân sự"
 artifact_find_peaceful_applications_desc:0 "Sử dụng Cổ Vật Nhỏ vào việc nghiên cứu lĩnh vực dân sự."
 artifact_find_peaceful_applications_effect:1 "Tiêu tốn £minor_artifacts£ Cổ Vật Nhỏ để nhận được phần thưởng ngẫu nhiên về mặt dân sự.\n\nViệc triển khai dự án này sẽ cấm nghiên cứu các ứng dụng quân sự trong một khoảng thời gian.\n\nThời gian Hồi chiêu: £time£§Y900§!"
 artifact_find_peaceful_applications_no_cooldown:0 "$artifact_find_military_applications_no_cooldown$"
 artifact_find_peaceful_application_happy_bios:0 "Phong cách Cổ điển"
 artifact_find_peaceful_application_happy_bios_desc:0 "Nghiên cứu về Cổ Vật Nhỏ đã vô tình tạo ra một trào lưu bùng nổ mạnh mẽ trong phạm vi đế chế. Mọi công dân của đế chế đều tham gia vào trào lưu này."
 artifact_find_peaceful_application_consumer_goods:0 "Sản xuất Hiệu quả"
 artifact_find_peaceful_application_consumer_goods_desc:0 "Nghiên cứu về Cổ Vật Nhỏ đã giúp chúng ta nâng cao hiệu quả sản xuất một cách hữu hiệu."
 artifact_find_peaceful_application_amenities:0 "Thu nhỏ Kích thước Pin"
 artifact_find_peaceful_application_amenities_desc:0 "Nghiên cứu về Cổ Vật Nhỏ đã cho phép chúng ta thu nhỏ kích thước pin của các linh kiện điện tử cá nhân đi 3%, giờ đây chúng trở nên mỏng nhẹ hơn trước và chi phí sản xuất cũng thấp hơn."
 artifact_find_peaceful_application_leader_improvement:0 "Tuệ nhãn Quản lý"
 artifact_find_peaceful_application_leader_improvement_desc:0 "Việc tiếp thu tri thức cổ đại cùng các hoạt động xây dựng đội ngũ đã giúp cho các thủ lĩnh của bạn có tầm nhìn sâu sắc hơn."
 artifact_find_peaceful_application_amenities_hivemind:0 "Bảo trì Hiệu quả"
 artifact_find_peaceful_application_amenities_hivemind_desc:0 "Những kỹ thuật được hé mở từ quá trình nghiên cứu Cổ Vật Nhỏ đã được các cá thể con bảo trì của chúng ta áp dụng."
 artifact_find_peaceful_application_leader_improvement_hivemind:0 "Tăng cường Pheromone"
 artifact_find_peaceful_application_leader_improvement_hivemind_desc:0 "Nghiên cứu về di vật quý hiếm đã cho phép chúng ta tăng cường pheromone của chính mình, điều này giúp công việc của các thủ lĩnh trở nên dễ dàng hơn."
 artifact_find_peaceful_application_amenities_machine:0 "$artifact_find_peaceful_application_amenities$"
 artifact_find_peaceful_application_amenities_machine_desc:0 "Nghiên cứu về Cổ Vật Nhỏ đã cho phép chúng ta thu nhỏ kích thước pin của các linh kiện điện tử cỡ nhỏ đi 3%, qua đó nâng cao hiệu suất làm việc của chúng ta."
 artifact_find_peaceful_application_leader_improvement_machine:0 "Cải tiến Thuật toán"
 artifact_find_peaceful_application_leader_improvement_machine_desc:0 "Thông qua việc nghiên cứu Cổ Vật Nhỏ, thành tựu thu được có thể giúp chúng ta nâng cấp đôi chút cho thuật toán của các thủ lĩnh."

 artifact_lgate_clue:0 "Tìm kiếm manh mối Cổng L"
 artifact_lgate_clue_desc:0 "Chúng ta có thể tận dụng những món cổ vật này để chắp vá thêm nhiều bí mật về Cổng L."
 artifact_lgate_clue_effect:0 "Thời gian hồi: £time£§Y3600§!"
