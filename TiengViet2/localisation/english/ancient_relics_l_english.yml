 #decision_museum_exhibits_effect: ""
 decision_museum_exhibits:0 "Chuyển Cổ vật đến bảo tàng để trưng bày"
 decision_museum_exhibits_desc:0 "Trưng bày công khai một số £minor_artifacts£ Cổ Vật Nhỏ, mượn những kỳ quan của quá khứ để khích lệ người dân của chúng ta."
 planet_museum_exhibits:0 "Triển lãm Cổ vật"
 planet_museum_exhibits_desc:0 "Việc trưng bày các Cổ vật của người ngoài hành tinh có thể mang đến sức sống mới cho bảo tàng của chúng ta."

 artifact_manager_awards:1 "Cạnh tranh Hiệu suất §E(Quyết định Hành tinh)§!"
 artifact_manager_awards_desc: "Quyết định $decision_manager_awards$ gia tăng sản lượng của các Ủy viên điều hành và Quản lý trên hành tinh của chúng ta."
 artifact_manager_awards_effect:1 "$decision_manager_awards_desc$\n\n$artifact_action_planetary_decision$"

 decision_manager_awards:0 "Phát động Cạnh tranh Hiệu suất"
 decision_manager_awards_desc:0 "Các Ủy viên điều hành và Quản lý sẽ cạnh tranh xem ai có thể tạo ra giá trị lớn nhất cho doanh nghiệp. Những người đạt thành tích xuất sắc nhất sẽ có cơ hội mang theo Cổ vật làm phần thưởng và chuyển đến một văn phòng mới rộng rãi hơn."
 planet_manager_awards:0 "Cạnh tranh Hiệu suất"
 planet_manager_awards_desc:0 "Các Ủy viên điều hành và Quản lý trên hành tinh này đang ganh đua quyết liệt nhằm tối đa hóa 시너지 kinh doanh để đạt được các mục tiêu hiệu suất then chốt."

 artifact_sanctuary_exhibits:1 "Triển lãm tại Khu bảo tồn §E(Quyết định Hành tinh)§!"
 artifact_sanctuary_exhibits_desc: "Quyết định $decision_sanctuary_exhibits$ có khả năng làm hài lòng các Cư dân Được bảo bọc trên hành tinh của chúng ta."
 artifact_sanctuary_exhibits_effect:1 "$decision_sanctuary_exhibits_desc$\n\n$artifact_action_planetary_decision$"

 decision_sanctuary_exhibits:0 "Gửi Cổ vật đến Khu bảo tồn Hữu cơ"
 decision_sanctuary_exhibits_desc:0 "Trưng bày công khai £minor_artifacts£ Cổ Vật Nhỏ, lấy những kỳ quan của quá khứ để làm hài lòng $job_bio_trophy_plural$ của chúng ta."
 planet_sanctuary_exhibits:0 "Triển lãm Cổ vật"
 planet_sanctuary_exhibits_desc:0 "Tất cả $job_bio_trophy_plural$ của chúng ta đều đang bàn tán xôn xao về việc trưng bày các Cổ vật của người ngoài hành tinh."

