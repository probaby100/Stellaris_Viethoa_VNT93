 ##################
 # ARCHAEOLOGY SITES
 ##################
 site_hidden_lab_a:0 "Cơ sở Đóng băng"
 site_hidden_lab_b:0 "$site_hidden_lab_a$"
 site_hidden_lab_intro:0 "Tàu thăm dò đã phát hiện ra một cơ sở ẩn giấu bên dưới lớp băng tuyết của [From.Planet.GetName]. Những đường hầm bị sập một phần và tắc nghẽn dường như tạo thành một mạng lưới khổng lồ kết nối các cấu trúc dưới lòng đất với nhau."
 ancrel.7001.name:0 "Khám phá Tàn tích"
 ancrel.7001.desc:0 "Khí hậu lạnh giá của [From.Planet.GetName] đã che giấu khu tàn tích này dưới lớp băng tuyết. Vị trí hẻo lánh và hoang vắng của tàn tích này có lẽ ám chỉ rằng chúng ta cần phải cẩn trọng với những gì tồn tại bên trong. Bất kể chuyện gì đã xảy ra ở đó, có kẻ đã muốn che đậy nó đến cùng."
 ancrel.7002.name:0 "Dọn dẹp Đường hầm"
 ancrel.7002.desc:0 "Khu phức hợp này bao gồm một vài cấu trúc dưới lòng đất lớn hơn được kết nối bằng một mạng lưới đường hầm, nhiều trong số đó đã sụp đổ hoặc bị băng phong tỏa. Mặc dù những đường hầm này vô cùng cổ kính, một số vẫn có dấu vết hỏa hoạn rõ rệt. Thiệt hại do trận hỏa hoạn này gây ra là vô cùng khổng lồ, đủ để khiến người ta tin rằng một sự kiện thảm khốc đã xảy ra ở đây, hoặc nó đã bị phá hủy hoàn toàn một cách có chủ đích. Có một điều chắc chắn là, mục đích cốt lõi của tàn tích này gắn liền với các hoạt động khoa học."
 ancrel.7004.name:0 "Phòng Thí nghiệm Sinh học Cổ đại"
 ancrel.7004.desc:0 "Các cuộc điều tra sâu hơn tiết lộ rằng, mục đích chính của cơ sở này là nghiên cứu và phát triển các tác nhân sinh học. Rất có thể do sự cố rò rỉ của một tác nhân sinh học được phát triển tại đây, toàn bộ khu phức hợp đã bị thiêu rụi để thanh lọc. Nghiên cứu chi tiết các cổ vật còn sót lại có thể sẽ cung cấp thêm một vài manh mối."
 ancrel.7005.name:0 "Phòng Thí nghiệm Vũ khí Cổ đại"
 ancrel.7005.desc:0 "Các cuộc điều tra sâu hơn tiết lộ rằng, mục đích chính của cơ sở này là nghiên cứu và phát triển vũ khí năng lượng tiên tiến. Một vụ tai nạn dường như đã châm ngòi cho một vụ nổ thảm khốc và phá hủy phần lớn khu vực. Một trung tâm dữ liệu trong cơ sở có vẻ vẫn còn trong tình trạng tương đối tốt, có lẽ dữ liệu của nó sẽ mang lại vài phát hiện hữu ích."
 ancrel.7006.name:0 "Chỉ dẫn Tâm linh"
 ancrel.7006.1.desc:1 "Khi chúng ta chạm vào Linh hồn thạch, chúng ta đã bị phóng chiếu vào một bình diện thu nhỏ của Cõi Màn Sương. Chúng ta sớm nhận ra mình không phải là thực thể duy nhất trong cõi bí cảnh kỳ diệu và hoa mắt này. Có một thực thể đang chờ đợi chúng ta ở đây, sự cổ xưa của nó vượt xa khỏi những gì chúng ta có thể đong đếm. Đó là một người gác đền của những bí mật thượng cổ. $relic_zro_entity_name$, bản năng đã mách bảo chúng ta điều đó.\n\nSau khi vượt qua thử thách để thiết lập liên kết, thực thể này đang chờ đợi chúng ta đặt câu hỏi."
 ancrel.7006.2.desc:1 "Ánh sáng lấp lánh tỏa ra từ bên trong Linh hồn thạch, tựa như đang vẫy gọi chúng ta trong câm lặng. Chúng ta chạm vào nó, và rồi tâm trí bị cuốn vào một bình diện thu nhỏ trong Cõi Màn Sương, nơi một thực thể được gọi là $relic_zro_entity_name$ đang chờ đợi chúng ta.\n\nNó biết những điều mà người phàm không thể biết, và vì chúng ta đã đặt chân đến thánh sở của nó, có vẻ như nó sẵn sàng chia sẻ bí mật với chúng ta."
 ancrel.7006.3.desc:1 "Có thứ gì đó đang chờ đợi chúng ta bên trong Linh hồn thạch. Đó là $relic_zro_entity_name$. Nó đã chờ đợi chúng ta từ rất lâu trước cả khi chúng ta được sinh ra.\n\nSau khi chạm vào Linh hồn thạch, chúng ta bị kéo vào cõi vô hình nơi nó cư ngụ. Đắm chìm trong sự cô đơn năm tháng, nó chỉ có những suy nghĩ của riêng mình để làm bầu bạn. Thực thể này dường như rất sốt sắng vận dụng trí tuệ huyền bí của mình để giải đáp những thắc mắc của chúng ta. Liệu nó làm vậy là để giúp đỡ chúng ta, hay chỉ đơn thuần thấy việc đó thú vị, chúng ta không thể nào biết được."
 ancrel.7006.a:0 "Yêu cầu $relic_zro_entity_name$ chia sẻ một tuệ nhãn"
 ancrel.7006.b:0 "Thỉnh cầu $relic_zro_entity_name$ ban cho lời khuyên quân sự"
 ancrel.7006.c:0 "Thỉnh cầu $relic_zro_entity_name$ ban cho phương lược trị quốc"
 ancrel.7007.name:0 "$r_galaxy$"
 ancrel.7007.desc:1 "Thời gian trôi qua bên trong dải ngân hà thu nhỏ nhanh hơn, thông qua việc quan sát tỉ mỉ cư dân bên trong đó, chúng ta có thể học hỏi được nhiều kiến thức liên quan đến công nghệ tiên tiến."

