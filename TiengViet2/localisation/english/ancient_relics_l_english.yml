 ancrel.10040.name:0 "Mở khóa Dự án Đặc biệt"
 ancrel.10040.desc:0 "Các nhà khoa học của chúng ta đã khởi động một dự án đặc biệt mới nhằm khám phá những bí mật ẩn giấu sâu hơn của Người Tiên phong."

 artifact_irassian_research:0 "Bí mật của người Irassian"
 artifact_irassian_research_desc:0 "Khám phá sâu hơn vào bí mật của người Irassian."
 artifact_irassian_research_completed:0 "$artifact_irassian_research$"
 artifact_irassian_research_completed_desc:0 "Tri thức cổ đại của người Irassian đã được chúng ta áp dụng."
 IRASSIAN_SECRETS:0 "Khám phá Bí mật của người Irassian"
 IRASSIAN_SECRETS_DESC:0 "Các Sĩ quan Khoa học của chúng ta sẽ cẩn thận sàng lọc các dữ liệu thu thập được, nhằm tìm hiểu và áp dụng tri thức của người Irassian cho mục đích của chúng ta."
 ancrel.9001:0 "$artifact_irassian_research$"
 ancrel.9001.name:0 "$artifact_irassian_research$"
 ancrel.9001.desc:0 "Chúng ta đã thành công trong việc tích hợp các Cổ vật của người Irassian vào quy trình nghiên cứu khoa học. Những góc nhìn sâu sắc của họ về khoa học sự sống sẽ hỗ trợ chúng ta một cách đắc lực."
 ancrel.9001.desc.phobe:0 "Mặc dù những kiến thức tích lũy được trong lĩnh vực sinh học không thể cứu vãn người Irassian khỏi thảm kịch, nhưng không thể phủ nhận họ là những chuyên gia trong lĩnh vực này. Các nhà khoa học của chúng ta đã đúc rút được những kinh nghiệm vô cùng quý giá từ những khám phá của họ."
 irassian_artifact_research_unlocked:0 "Mở khóa hành động Cổ Vật Nhỏ: §Y$artifact_irassian_research$§!"

 artifact_yuht_research:0 "Bí mật của người Yuht"
 artifact_yuht_research_desc:0 "Khám phá sâu hơn vào bí mật của người Yuht."
 artifact_yuht_research_completed:0 "$artifact_yuht_research$"
 artifact_yuht_research_completed_desc:0 "Tri thức cổ đại của người Yuht đã được chúng ta áp dụng."
 YUHT_SECRETS:0 "Khám phá Bí mật của người Yuht"
 YUHT_SECRETS_DESC:0 "Các nhà khoa học của chúng ta sẽ cẩn thận sàng lọc các dữ liệu thu thập được, nhằm tìm hiểu và áp dụng tri thức của người Yuht cho mục đích của chúng ta."
 ancrel.10050:0 "$artifact_yuht_research$"
 ancrel.10050.name:0 "$artifact_yuht_research$"
 ancrel.10050.desc.1:0 "Chúng ta đã thành công trong việc tái tạo lại quy trình thanh lọc mà người Yuht từng sử dụng để xử lý trước các hành tinh ươm mầm của họ.\n\n$ancrel.10050.desc.2$"
 ancrel.10050.desc.1.phobe:0 "Người Yuht sở hữu một quy trình có khả năng quét sạch hiệu quả các sinh vật ngoại lai thù địch trên các hành tinh ươm mầm của họ. Chúng ta đã thành công trong việc khôi phục lại quy trình thanh lọc này.\n\n$ancrel.10050.desc.2$"
 ancrel.10050.desc.2:0 "Việc này thực sự sẽ gây ra những tác động ngắn hạn lên sinh quyển có thể gây ra nhiều tranh cãi, nhưng một khi nó được phục hồi hoàn toàn, hành tinh này sẽ trở nên phù hợp hơn với nhu cầu của chúng ta."
 ancrel.10050.unlock:0 "Mở khóa Quyết định Hành tinh: §Y$decision_yuht_cleanseplanet$§!"
 yuht_artifact_research_unlocked:0 "Mở khóa hành động Cổ Vật Nhỏ: §Y$artifact_yuht_research$§!\n"
 decision_yuht_cleanseplanet:0 "Khởi động Quy trình Thanh lọc Yuht"
 decision_yuht_cleanseplanet_desc:0 "Sử dụng vũ lực để tiêu diệt phần lớn động vật hoang dã thù địch trên hành tinh, và —— khi hành tinh đã được phục hồi hoàn toàn —— tiến hành cải tạo sinh quyển sao cho phù hợp hơn với nhu cầu của chúng ta."
 pm_yuht_cleansing:0 "Thanh lọc Yuht"
 pm_yuht_cleansing_desc:0 "Phần lớn động vật hoang dã thù địch trên hành tinh này đã bị tiêu diệt bằng vũ lực."

 artifact_vultaum_research:0 "Bí mật của người Vultaum"
 artifact_vultaum_research_desc:0 "Khám phá sâu hơn vào bí mật của người Vultaum."
 VULTAUM_SECRETS:0 "Khám phá Bí mật của người Vultaum."
 VULTAUM_SECRETS_DESC:0 "Các nhà khoa học của chúng ta sẽ cẩn thận sàng lọc các dữ liệu thu thập được, nhằm tìm hiểu và áp dụng tri thức của người Vultaum cho mục đích của chúng ta."
 ancrel.10100:0 "$artifact_vultaum_research$"
 ancrel.10100.name:0 "$artifact_vultaum_research$"
 vultaum_artifact_research_unlocked:0 "Mở khóa hành động Cổ Vật Nhỏ: §Y$artifact_vultaum_research$§!"
 ancrel.10100.desc:0 "Bất chấp những sai sót căn bản trong các kết luận của họ, người Vultaum lại sở hữu những tiến bộ vượt bậc trong lĩnh vực máy tính và thế giới ảo, điều này có khả năng hỗ trợ đắc lực cho các nghiên cứu liên quan của chúng ta."
 ancrel.10100.desc_machine:0 "Có vẻ như người Vultaum đã tiếp thu một số quan niệm phi logic trong quá trình nghiên cứu. Một số thành tựu tiên tiến của họ trong lĩnh vực máy tính và thế giới ảo cần được tích hợp vào tiến trình nghiên cứu của chúng ta."
 ancrel.10100.desc_hive:0 "Người Vultaum có sự ám ảnh đối với các khái niệm về thực tại và thế giới ảo. Mặc dù hầu hết những khám phá của họ đều vô nghĩa đối với chúng ta, nhưng ít nhất thì những nghiên cứu về máy tính của họ có thể giúp ích cho chúng ta."
 ancrel.10100.desc_fm:0 "Không thể phủ nhận người Vultaum là những bậc thầy trong lĩnh vực máy tính và thế giới ảo. Chúng ta có thể vận dụng những khám phá của họ để hỗ trợ đáng kể cho các nghiên cứu của chúng ta trong lĩnh vực này.\n\nTuy nhiên, những kết luận mà họ đưa ra lại làm dấy lên những mối lo ngại. Mới thoạt nhìn, những kết luận này không chỉ đầy rẫy khuyết điểm mà còn vô nghĩa, nhưng khi tiến sâu hơn vào nghiên cứu, chúng tôi cho rằng dường như họ đã khám phá ra được phần nổi của tảng băng chìm mang tên sự thật.\n\nNếu muốn tiếp tục đào sâu nghiên cứu, chúng ta sẽ cần thêm nhiều thời gian và nguồn lực hơn nữa."

 artifact_vultaum_research_completed_suppressed:0 "Bí mật của người Vultaum"
 artifact_vultaum_research_completed_suppressed_desc:0 "Các tài liệu của người Vultaum đã mở rộng đáng kể tầm hiểu biết của chúng ta về lĩnh vực máy tính. Chúng ta đã học hỏi và áp dụng những kiến thức đó để tạo ra các thế giới ảo nhân tạo mang lại lợi ích cho công chúng."
 artifact_vultaum_research_completed_public:0 "Bí mật sâu xa hơn của người Vultaum"
 artifact_vultaum_research_completed_public_desc:0 "Các tài liệu của người Vultaum đã chỉ ra rằng chúng ta đang sống trong một thế giới ảo. Một khi đã thấu hiểu được thực tại của mình, chúng ta có thể lợi dụng những lỗ hổng nhất định để thông qua đó tìm hiểu cách thức thế giới ảo mang lại lợi thế cho chúng ta."
 artifact_vultaum_research_completed_machine:0 "$artifact_vultaum_research_completed_suppressed$"
 artifact_vultaum_research_completed_machine_desc:0 "$ancrel.10100.desc_machine$"
 artifact_vultaum_research_completed_hive:0 "$artifact_vultaum_research_completed_suppressed$"
 artifact_vultaum_research_completed_hive_desc:0 "$ancrel.10100.desc_hive$"

 ancrel.10100.option.fm_enough:0 "Chúng ta sẽ tận dụng tốt những kiến thức đã lĩnh hội được."
 ancrel.10100.option.fm_delve_deeper:0 "Tiếp tục đào sâu, chúng ta nhất định phải học hỏi bằng được mọi thứ mà họ biết."

 VULTAUM_SECRETS_2:0 "Tiến xa hơn trong việc nghiên cứu Bí mật của người Vultaum"
 VULTAUM_SECRETS_2_DESC:0 "Chúng ta không thể nào từ bỏ việc tìm kiếm sự thật chỉ vì sợ hãi trước những hậu quả có thể xảy ra. Những thứ mà người Vultaum khám phá ra đã xé toạc thực tại của họ.\n\nChúng ta không hề sợ hãi."

 ancrel.10110.name:0 "$artifact_vultaum_research$"
 ancrel.10110.desc:0 "Có vẻ như, người Vultaum đã đúng.\n\nChúng ta đã lặp lại các thí nghiệm của họ và thu được những kết luận tương tự. Rất có khả năng chúng ta thực sự tồn tại trong một thế giới ảo.\n\nChúng ta không có đủ thông tin để biết ai đã tạo ra một thế giới như vậy và vì lý do gì. Nhưng điều chắc chắn là, không ai lại tàn nhẫn đến mức tạo ra cả một vũ trụ chỉ để cho vui.\n\nSự việc này mang ý nghĩa vô cùng to lớn, giờ đây chúng tôi trân trọng thỉnh cầu ngài đưa ra chỉ thị cho bước tiếp theo."

 ancrel.10110.option.fm_suppress:0 "Thật đáng lo ngại, hãy phong tỏa mọi thông tin liên quan đến cuộc điều tra này."
 ancrel.10110.option.fm_public:0 "Người dân có quyền được biết."
 artifact_vultaum_research_completed_public_tooltip:0 "Công chúng cảm thấy §Rbối rối§! sau khi biết được sự thật.\n§Y$artifact_vultaum_research$§! đã được thay thế bằng:"

 ancrel.10111.name:0 "Tin buồn"
 ancrel.10111.desc:0 "Chúng tôi rất lấy làm tiếc phải thông báo về cái chết của nhà khoa học dẫn đầu dự án nghiên cứu Vultaum, [leading_vultaum_research_scientist.GetName], người đã quyết định không chấm dứt việc nghiên cứu về Vultaum.\n\nCác ghi chép mà họ để lại ngày càng trở nên hỗn loạn, biến thành những nét vẽ nguệch ngoạc khó hiểu trước khi họ quyết định \"dõi theo nghiên cứu\" và sau đó tự sát."

 ancrel.10112.name:0 "Giải tỏa Áp lực"
 ancrel.10112.desc:0 "Báo cáo cho thấy [leading_vultaum_research_scientist.GetName] đã bị ảnh hưởng nặng nề bởi áp lực từ việc dẫn dắt dự án nghiên cứu người Vultaum.\n\nHọ đã bắt đầu có khả năng thực hiện những bước nhảy vọt về logic đến khó tin, mang lại lợi ích to lớn cho nghiên cứu của chúng ta, nhưng đồng thời họ cũng phải tự ý dùng thuốc điều trị như một cơ chế đối phó với áp lực cao."

 ancrel.10113.name:0 "Đột phá"
 ancrel.10113.desc:0 "Báo cáo cho biết [leading_vultaum_research_scientist.GetName] đã bắt đầu có khả năng thực hiện những bước nhảy vọt về logic đến không tưởng, mang lại lợi ích vô cùng to lớn cho dự án nghiên cứu của chúng ta."

 artifact_league_research:0 "Bí mật của Liên minh Đệ nhất"
 artifact_league_research_desc:0 "Khám phá sâu hơn vào bí mật của Liên minh Đệ nhất."
 artifact_league_research_completed:0 "$artifact_league_research$"
 artifact_league_research_completed_desc:0 "Tri thức cổ đại của Liên minh Đệ nhất đã được chúng ta áp dụng."
 LEAGUE_SECRETS:0 "Khám phá Bí mật của Liên minh Đệ nhất"
 LEAGUE_SECRETS_DESC:0 "Các nhà khoa học của chúng ta sẽ cẩn thận sàng lọc các dữ liệu thu thập được, nhằm tìm hiểu và áp dụng tri thức của Liên minh Đệ nhất cho mục đích của chúng ta."
 ancrel.10200:0 "$artifact_league_research$"
 ancrel.10200.name:0 "$artifact_league_research$"
 ancrel.10200.desc:0 "Chúng ta đã thành công trong việc tích hợp các Cổ vật của Liên minh Đệ nhất vào quy trình nghiên cứu khoa học. Những góc nhìn sâu sắc của họ về công nghệ công nghiệp sẽ hỗ trợ chúng ta một cách đắc lực."
 ancrel.10200.desc.phobe:0 "Liên minh Đệ nhất đã chứng minh rằng việc tin tưởng vào các chủng tộc khác là một sự ngu ngốc, điều đó chỉ rước lấy sự yếu kém và tự hủy diệt. Tuy nhiên, một số phương pháp xây dựng tiên tiến của họ có thể sẽ phần nào hữu ích cho chúng ta."
 league_artifact_research_unlocked:0 "Mở khóa hành động Cổ Vật Nhỏ: §Y$artifact_league_research$§!"

 artifact_cybrex_research:0 "Bí mật của Cybrex"
 artifact_cybrex_research_desc:0 "Khám phá sâu hơn vào bí mật của Cybrex"
 artifact_cybrex_research_completed:0 "$artifact_cybrex_research$"
 artifact_cybrex_research_completed_desc:0 "Tri thức cổ đại của Cybrex đã được chúng ta áp dụng."
 CYBREX_SECRETS:0 "Khám phá Bí mật của Cybrex"
 CYBREX_SECRETS_DESC:0 "Các nhà khoa học của chúng ta sẽ cẩn thận sàng lọc các dữ liệu thu thập được, nhằm tìm hiểu và áp dụng tri thức của Cybrex cho mục đích của chúng ta."
 ancrel.10250:0 "$artifact_cybrex_research$"
 ancrel.10250.name:0 "$artifact_cybrex_research$"
 ancrel.10250.desc:0 "Chúng ta đã thành công trong việc tích hợp các Cổ vật của Cybrex vào quy trình nghiên cứu khoa học. Những góc nhìn sâu sắc của họ về kỹ thuật siêu cấu trúc sẽ hỗ trợ chúng ta một cách đắc lực."
 ancrel.10250.desc.antimachine:0 "Truyền thuyết về Cybrex đã chứng minh rằng quyết định cấm trí tuệ nhân tạo của chúng ta là vô cùng sáng suốt. May mắn là một số khám phá của họ liên quan đến kỹ thuật siêu cấu trúc có thể mang lại lợi ích cho sự nghiệp của chúng ta."
 cybrex_artifact_research_unlocked:0 "Mở khóa hành động Cổ Vật Nhỏ: §Y$artifact_cybrex_research$§!"

 artifact_baol_research:0 "Bí mật của Baol"
 artifact_baol_research_desc:0 "Khám phá sâu hơn vào bí mật của Baol."
 artifact_baol_research_completed:0 "$artifact_baol_research$"
 artifact_baol_research_completed_desc:0 "Tri thức cổ đại của Baol đã được chúng ta áp dụng."
 BAOL_SECRETS:0 "Khám phá Bí mật của Baol"
 BAOL_SECRETS_DESC:0 "Các nhà khoa học của chúng ta sẽ cẩn thận sàng lọc các dữ liệu thu thập được, nhằm tìm hiểu và áp dụng tri thức của Baol cho mục đích của chúng ta."
 ancrel.10300:0 "$artifact_baol_research$"
 ancrel.10300.name:0 "$artifact_baol_research$"
 ancrel.10300.desc.terraform:0 "Thông qua việc nghiên cứu dữ liệu của Baol, chúng ta đã có những nhận thức mới về quá trình ươm mầm sự sống và cải tạo môi trường trên hành tinh.$ancrel.10300.desc.terraform.end$"
 ancrel.10300.desc.uplift:0 "Sau khi nghiên cứu kỹ lưỡng quá trình biến đổi dẫn đến việc mất đi khả năng cảm nhận của Baol, chúng ta đã thu thập đủ kiến thức để đảo ngược lại quá trình này.\n\nChúng ta cũng có những nhận thức mới về công nghệ ươm mầm sự sống và cải tạo môi trường trên hành tinh."
 ancrel.10300.desc.terraform.nomad: "Việc nghiên cứu Baol đã mang lại cho chúng ta những nhận thức mới về quá trình lan tỏa của sự sống thực vật trên các thế giới sống.$ancrel.10300.desc.terraform.end$"
 ancrel.10300.desc.uplift.nomad: "Nhờ theo dõi kỹ lưỡng những biến đổi mà Baol trải qua trong quá trình mất đi trí tuệ, chúng ta đã thu được nhiều kiến thức về cách đảo ngược quá trình đó.\n\nChúng ta cũng có thêm những nhận thức mới về quá trình lan tỏa của sự sống thực vật trên các thế giới sống."
 ancrel.10300.desc.terraform.end: "\n\nNhờ theo dõi kỹ lưỡng những biến đổi mà Baol trải qua trong quá trình mất đi trí tuệ, chúng ta cũng học hỏi được nhiều điều về quá trình khai sáng, nhưng chúng ta đã làm chủ công nghệ đó từ trước."
 baol_artifact_research_unlocked:0 "Mở khóa hành động Cổ Vật Nhỏ: §Y$artifact_baol_research$§!"

