 DLC_ANCIENT_RELICS_RECOMMENDATION_DESC:1 "Gói cốt truyện §SAncient Relics§! bổ sung thêm những câu chuyện về các nền văn minh trong quá khứ và các Di Vật Cổ Đại hùng mạnh."
 DLC_ANCIENT_RELICS_RECOMMENDATION_SCIENCE_REC:1 "Chúng tôi đề xuất gói §SAncient Relics§! vì các cơ chế Khảo cổ học của nó rất phù hợp với định hướng khoa học của đế chế này."
 DLC_ANCIENT_RELICS_RECOMMENDATION_TRADITION_REC:1 "Chúng tôi đề xuất gói §SAncient Relics§! vì đặc điểm của đế chế này đồng điệu với chủ đề về các nền văn hóa cổ đại và dòng chảy thời gian."

 minor_artifacts:0 "Cổ Vật Nhỏ"
 minor_artifacts_desc:1 "Cổ Vật Nhỏ (£minor_artifacts£) đại diện cho những công nghệ tối nghĩa và tri thức gần như bị lãng quên được thu thập từ các nền văn minh cổ xưa, mà nền khoa học của chúng ta mới chỉ hiểu được một phần. Chúng phổ biến hơn Di Vật Cổ Đại và có thể được sử dụng để kích hoạt nhiều hiệu ứng trên quy mô toàn đế chế."
