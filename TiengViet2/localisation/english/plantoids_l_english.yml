 building_gaiaseeders:0 "Máy Gieo Hạt Gaia"
 building_gaiaseeders_1:0 "$building_gaiaseeders$ - Giai Đoạn 1"
 building_gaiaseeders_2:0 "$building_gaiaseeders$ - Giai Đoạn 2"
 building_gaiaseeders_3:0 "$building_gaiaseeders$ - Giai Đoạn 3"
 building_gaiaseeders_4:0 "$building_gaiaseeders$ - Giai Đoạn Cuối"
 building_gaiaseeders_all_desc:0 "Các cơ sở trải khắp hành tinh sẽ từng bước đưa thế giới này tiến gần hơn tới việc trở thành một §YThế Giới Gaia§!, thông qua 4 giai đoạn nâng cấp."
 building_gaiaseeders_1_desc:0 "$building_gaiaseeders_all_desc$\n\nĐây là giai đoạn thúc đẩy tăng trưởng ban đầu."
 building_gaiaseeders_2_desc:0 "$building_gaiaseeders_all_desc$\n\nGiai đoạn này chuyển hướng sang cải thiện khả năng sinh sống."
 building_gaiaseeders_3_desc:0 "$building_gaiaseeders_all_desc$\n\nGiai đoạn này chú trọng đặc biệt vào khả năng sinh sống."
 building_gaiaseeders_4_desc:0 "$building_gaiaseeders_all_desc$"
 building_gaiaseeders_4_effect_desc:0 "Địa khai hóa hành tinh thành một §YThế Giới Gaia§! khi hoàn tất."

 building_gaiaseeders_pc_gaia: "$building_gaiaseeders_4$"
 building_gaiaseeders_pc_gaia_desc: "$building_gaiaseeders_4_desc$"

 plant.100.name:0 "Sự Hoàn Mỹ Điền Viên"
 plant.100.desc:1 "Thông qua công nghệ sinh học vượt trội, những khoản đầu tư đáng kể và nhiều năm lao động miệt mài, dự án Gieo Hạt Gaia trên §Y[Root.GetName]§! đã đơm hoa kết trái.\n\nKể từ ngày này, §Y[Root.GetName]§! phải được coi là một viên ngọc quý thực sự giữa muôn vì tinh tú, để chiêm ngưỡng, hoặc có lẽ là để ghen tị."
 plant.100.a:0 "Hãy để lễ hội ăn mừng bắt đầu!"
 plant.100.b:0 "Chúng ta đã làm rất tốt, giờ là lúc tập trung vào nơi khác."

 plant.105.desc:0 "Thông qua công nghệ sinh học vượt trội, những khoản đầu tư đáng kể và nhiều năm lao động miệt mài, dự án Gieo Hạt Gaia trên §Y[From.Planet.GetName]§! đã đơm hoa kết trái.\n\nKể từ ngày này, §Y[From.Planet.GetName]§! phải được coi là một viên ngọc quý thực sự giữa muôn vì tinh tú, để chiêm ngưỡng, hoặc có lẽ là để ghen tị. Chúng ta tin chắc rằng các chư hầu sẽ đánh giá cao nỗ lực của chúng ta."

 plant.110.desc:0 "Tông Chủ của chúng ta đã hoàn thành dự án kỳ lạ trên §Y[from.from.planet.GetName]§!, biến nó thành một thế giới Gaia. Nhờ có họ, giờ đây chúng ta có thể tận dụng khí hậu điền viên và những không gian rộng lớn của thiên đường này cho mục đích hữu ích."
 plant.110.desc.hydrocentric:0 "Tông Chủ của chúng ta đã hoàn thành dự án kỳ lạ trên §Y[from.from.planet.GetName]§!. Hành tinh này đã bị hủy hoại! Họ đã phủ lấp các đại dương bằng những đồng bằng và đồi trập trùng. Bầu khí quyển từng ẩm ướt nay trở nên cằn cỗi và khô khốc. Tệ hơn nữa, khi chúng ta bày tỏ mối lo ngại, họ đã gạt phắt đi! Những kẻ Tông Chủ nói rằng họ đã làm cho thế giới của chúng ta \"xinh đẹp hơn\"."

 plant.110.a:0 "Sao họ dám làm thế chứ!"
 plant.110.b:0 "Thật chu đáo làm sao!"
 plant.110.c:0 "Thật là một quyết định kỳ quặc."

 celebrate_idyllic_bloom:0 "Ăn Mừng Biến Đổi Điền Viên"
 celebrate_idyllic_bloom_desc:0 "Một lễ ăn mừng quy mô toàn hành tinh đang diễn ra sau sự kiện biến đổi thành công thế giới này thành một thiên đường điền viên."
 terraformed_our_ocean_world:0 "Đã Địa Khai Thế Giới Đại Dương Của Chúng Ta"
 terraformed_our_ocean_world_desc:0 "Tông Chủ của chúng ta đã địa khai hóa một thế giới đại dương tuyệt đẹp thành một thế giới Gaia tồi tệ. Quả là một gu thẩm mỹ kinh khủng."

 thankful_for_gaia:0 "Biết Ơn Vì Thế Giới Gaia"
 thankful_for_gaia_desc:0 "Tông Chủ của chúng ta gần đây đã địa khai hóa một trong những hành tinh của chúng ta thành thế giới Gaia. Họ thật tốt bụng làm sao!"

### Traits by Byron Aytoun

 trait_plantoid_phototrophic:0 "Quang Hợp"
 trait_plantoid_phototrophic_desc:0 "§LChủng tộc này được duy trì sự sống bằng sự kết hợp giữa thức ăn và ánh sáng mặt trời.§!\n"
 TRAIT_PLANTOID_PHOTOTROPHIC_EFFECT:0 "Thay thế §Y50%§! Chi Phí Duy Trì $food_with_icon$ (hoặc tương đương) bằng Chi Phí Duy Trì $energy_with_icon$"

 trait_plantoid_radiotrophic:0 "Phóng Xạ Hướng"
 trait_plantoid_radiotrophic_desc:0 "§LChủng tộc này được duy trì sự sống bằng sự kết hợp giữa thức ăn và bức xạ năng lượng thấp, nhờ đó có thể sinh sôi nảy nở trên những thế giới khắc nghiệt nhất.§!"
 TRAIT_PLANTOID_RADIOTROPHIC_EFFECT:1 "$TRAIT_PLANTOID_PHOTOTROPHIC_EFFECT$\n$t$- Chi Phí Duy Trì £energy£ §YNăng Lượng§! này được xóa bỏ đối với Dân Số sinh sống trên §YThế Giới Tận Thế (Tomb World)§!.\n$t$- Tốc Độ Tăng Trưởng Dân Số trên §YThế Giới Tận Thế§! §G+10%§!\n$t$- Khả Năng Thích Nghi Thế Giới Tận Thế: §G+10%§!"
