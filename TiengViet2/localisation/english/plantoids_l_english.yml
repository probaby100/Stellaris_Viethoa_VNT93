 trait_plantoid_budding:0 "Đâm Chồi"
 trait_plantoid_budding_desc:0 "§LChủng tộc này có khả năng sinh sản bằng cách đâm chồi, bên cạnh phương thức thụ phấn hạt hoặc bào tử thông thường.§!"
