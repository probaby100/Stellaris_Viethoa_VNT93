l_english:
 DERELICT_SHIP_PROJECT:0 "Tàu Vô Chủ"
 DERELICT_SHIP_PROJECT_DESC:0 "Một con tàu trôi dạt trong không gian, không có bất kỳ tín hiệu nào phát ra hay truyền vào. Việc kiểm tra kỹ lưỡng hơn có thể làm sáng tỏ những gì đã xảy ra với thủy thủ đoàn."
 ODD_STAR_PROJECT:0 "Ngọn Lửa Lò Luyện"
 ODD_STAR_PROJECT_DESC:0 "Ngôi sao này dường như có khả năng nhiệt hạch tạo ra berili, điều đáng lẽ không thể xảy ra."
 IMPROBABLE_TEAPOT_PROJECT:0 "Đồ Gốm Bất Khả Thi"
 IMPROBABLE_TEAPOT_PROJECT_DESC:0 "Một chiếc bình gốm đang quay quanh một ngôi sao... điều này thật phi lý đến khó tin. Tìm hiểu xem nó làm gì ở đó sẽ tiêu tốn khá nhiều thời gian. Ai biết được câu trả lời sẽ là gì, hoặc liệu có tồn tại câu trả lời hay không?"
 AI_ADMIRAL_PROJECT:0 "Chiến Binh Cát Bụi"
 AI_ADMIRAL_PROJECT_DESC:0 "Một hạm đội cổ đại vừa được phát hiện rơi trên một hành tinh sa mạc, với một AI trên tàu vẫn còn hoạt động. Nếu chúng ta không hành động để chế ngự nó, mọi chuyện có thể chuyển biến theo chiều hướng tồi tệ hơn."
 MINING_GEAR_PROJECT:0 "Mũi Khoan Cuồng Nộ"
 MINING_GEAR_PROJECT_DESC:0 "Một máy xúc cổ đại đang đào sâu vào một tiểu hành tinh khổng lồ. Nếu chúng ta có thể ngăn nó lại trước khi nó bị các mảnh vỡ nghiền nát, chúng ta có thể học hỏi được điều gì đó giá trị về cấu trúc chế tạo này."
 ABANDONED_ARRAY_PROJECT:0 "Dàn Cảm Biến Bỏ Hoang"
 ABANDONED_ARRAY_PROJECT_DESC:0 "Một chảo cảm biến bị bỏ hoang dường như vẫn còn trong điều kiện hoạt động. Nếu tiến hành sửa chữa và tìm hiểu nguyên lý hoạt động của nó, chúng ta có thể thu được nhiều thông tin sâu sắc hơn về các hệ sao lân cận."
 ALIEN_RACER_PROJECT:0 "Trôi Dạt"
 ALIEN_RACER_PROJECT_DESC:0 "Một con tàu ngoài hành tinh đang trôi dạt bên trong một vành đai tiểu hành tinh. Nó không phản hồi các tín hiệu gọi. Chúng ta nên tiến hành điều tra để xem chuyện gì đang diễn ra."
 PSIONIC_HORSES_PROJECT:0 "Chúa Tể Đồng Bằng"
 PSIONIC_HORSES_PROJECT_DESC:0 "Một loài động vật có vú uy nghi đang lang thang trên những cánh đồng cỏ nước. Chúng có vẻ nhút nhát và linh cảm được sự tiếp cận của chúng ta. Việc nghiên cứu chúng ở cự ly gần có thể cung cấp thêm thông tin cho chúng ta."
 ROBOT_CLEANERS_PROJECT:0 "Những Cỗ Máy Bị Bỏ Lại"
 ROBOT_CLEANERS_PROJECT_DESC:0 "Một cơ sở đầy robot vừa được phát hiện trên một hành tinh xa xôi. Nếu chúng ta kích hoạt lại chúng, chúng có thể tiết lộ những bí mật về quê hương của mình."
 ALIEN_MONSTER_ON_SHIP:0 "Quái Thú Ngoài Hành Tinh Trên Tàu"
 ALIEN_MONSTER_ON_SHIP_DESC:0 "[Root.Owner.GetMonsterOnShipDesc]"
 TREE_OF_LIFE:0 "Cổ Thụ"
 TREE_OF_LIFE_DESC:0 "Một cái cây trôi dạt đầy kiêu hãnh giữa khoảng không vô tận của vũ trụ. Nhựa của nó dường như thu hút những sinh vật hữu cơ không gian hung tợn. Chúng ta nên điều tra để tìm hiểu mục đích của nó."
 MASTERS_WRITINGS_POLITICS:0 "Dịch Văn Bản Khai Hoang"
 MASTERS_WRITINGS_POLITICS_DESC:0 "Chúng ta đã phát hiện một tập tài liệu có vẻ rất quan trọng đối với xã hội nay đã diệt vong này. Việc dịch thuật chúng chắc chắn sẽ mang lại cho chúng ta cái nhìn sâu sắc hơn về lịch sử và văn hóa của họ."
 MASTERS_WRITINGS_PHILOSOPHY:0 "Dịch Văn Bản Thám Hiểm"
 MASTERS_WRITINGS_PHILOSOPHY_DESC:0 "Chúng ta tìm thấy một số văn bản do một đoàn thám hiểm ngoài hành tinh mang theo. Nếu dịch chúng, chúng ta có thể mở khóa thêm thông tin và tìm hiểu về những chủ nhân trước đây của nó."
 MASTERS_WRITINGS_DIPLOMACY:0 "Dịch Văn Bản Thương Gia"
 MASTERS_WRITINGS_DIPLOMACY_DESC:0 "Chúng ta tìm thấy một số văn bản trong đống tàn tích của một nơi có thể từng là trung tâm thương mại liên sao. Nếu dịch các tài liệu này, chúng ta có thể tìm hiểu thêm về những người đã sáng lập nên nó."
 MASTERS_WRITINGS_WAR:0 "Dịch Văn Bản Chiến Binh"
 MASTERS_WRITINGS_WAR_DESC:0 "Chúng ta đã tìm thấy hài cốt của một tộc người chiến binh trên một chiến trường bị bỏ hoang từ lâu, và họ mang theo những văn bản ắt hẳn rất quan trọng đối với họ. Nếu dịch các tài liệu này, chúng ta có thể hiểu thêm về dân tộc này và những cuộc chiến họ từng tham gia."
 CRYOPOD_FOUND_PROJECT:0 "Căn Hầm Dưới Lòng Đất"
 CRYOPOD_FOUND_PROJECT_DESC:0 "Chúng ta tìm thấy một cấu trúc dưới chân núi có thể chứa các thông tin hoặc trang bị giá trị. Nó bị bao vây bởi động vật hoang dã nguy hiểm và chúng ta cần chế ngự những quái thú này để có thể tiếp cận nó."
 CRYOPOD_OPENING_PROJECT:0 "Cạy Mở Hầm Chứa"
 CRYOPOD_OPENING_PROJECT_DESC:0 "Hầm ngầm dưới lòng đất mà chúng ta tìm thấy chỉ chứa một loại khoang chứa đặc biệt. Chúng ta cần tìm ra cách tốt nhất để cạy mở nó nếu muốn biết thứ gì ở bên trong."
 ANCIENT_OCEAN_SHIP:0 "Tàu Tuần Dương Dưới Đáy Biển"
 ANCIENT_OCEAN_SHIP_DESC:0 "Một tuần dương chiến hạm của người ngoài hành tinh nằm sâu dưới những con sóng của [Root.GetName]. Việc trục vớt con tàu có thể mang lại công nghệ hoặc tài nguyên quý giá."