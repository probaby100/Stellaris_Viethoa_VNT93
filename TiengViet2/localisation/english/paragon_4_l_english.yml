l_english:

 # Gestalt trait names and desc
 leader_trait_fallible_hive: "Thường Mắc Lỗi"
 leader_trait_fallible_hive_desc:0 "[GetIndividualName] này có hành vi thất thường, có thể dẫn đến rắc rối trong tương lai."
 leader_trait_fallible_machine: "Lỗi Kỹ Thuật"
 leader_trait_fallible_machine_desc:0 "Đơn vị này gặp phải các trục trặc nhỏ, có thể dẫn đến rắc rối trong tương lai."

 leader_trait_stubborn_machine:0 "Lập Trình Cứng Nhắc"
 leader_trait_stubborn_machine_desc:1 "Đơn vị này có chương trình lập trình đặc biệt cứng nhắc, hiếm khi cho phép cải thiện hành vi."
 leader_trait_stubborn_hive:0 "Giao Diện Cố Hóa"
 leader_trait_stubborn_hive_desc:1 "[owner.GetIndividualName] này có tư duy đặc biệt cứng nhắc và không thể chấp nhận các sửa đổi hành vi."

 leader_trait_destructive_hive_desc:1 "[owner.GetIndividualName] này phớt lờ việc bảo trì định kỳ cần thiết cho thiết bị, dẫn đến những hỏng hóc nghiêm trọng hơn."
 leader_trait_destructive_machine_desc:1 "Đơn vị này không thực hiện việc bảo trì định kỳ cần thiết cho thiết bị, dẫn đến những hỏng hóc nghiêm trọng hơn."

 leader_trait_lavish_lifestyle_hive:0 "Chi Phí Duy Trì Cao"
 leader_trait_lavish_lifestyle_hive_desc:0 "Hành vi thất thường của [owner.GetIndividualName] này khiến hiệu suất hoạt động giảm sút nghiêm trọng."
 leader_trait_lavish_lifestyle_machine:0 "Chi Phí Bảo Trì Cao"
 leader_trait_lavish_lifestyle_machine_desc:0 "Đơn vị này bị lỗi lập trình khiến hiệu suất hoạt động giảm sút nghiêm trọng."

 leader_trait_tyrannical_hive:0 "Phân Bổ Định Mức"
 leader_trait_tyrannical_hive_desc:1 "Nút ý thức này ưu tiên quá mức việc phân bổ định mức tài nguyên."
 leader_trait_tyrannical_machine:0 "Phân Bổ Định Mức"
 leader_trait_tyrannical_machine_desc:1 "Đơn vị này ưu tiên quá mức việc phân bổ định mức tài nguyên."

 leader_trait_righteous_hive:0 "Bất Hoại"
 leader_trait_righteous_hive_desc:0 "[owner.GetIndividualName] này có khả năng kháng cự sự tha hóa, hạn chế các hành vi lệch lạc trong [owner.GetGestaltEntityName]."
 leader_trait_righteous_machine:0 "Quy Trình Vá Lỗi"
 leader_trait_righteous_machine_desc:0 "Đơn vị này thường xuyên tiến hành vá lỗi cập nhật cho các đơn vị khác."

 leader_trait_embezzler_hive:0 "Hao Tổn Năng Lượng"
 leader_trait_embezzler_hive_desc:1 "[owner.GetIndividualName] này có bất thường về mặt sinh lý khiến nó tiêu hao một lượng năng lượng lãng phí."
 leader_trait_embezzler_machine:0 "Hao Hụt Năng Lượng"
 leader_trait_embezzler_machine_desc:0 "Đơn vị này có lỗi hệ thống khiến nó tiêu thụ lượng năng lượng cao bất thường."

 leader_trait_gullible_hive:0 "Rò Rỉ Thông Tin"
 leader_trait_gullible_hive_desc:1 "Bản tính cả tin của nút ý thức này gây ra những lỗ hổng bảo mật nghiêm trọng."
 leader_trait_gullible_machine:0 "Rò Rỉ Dữ Liệu"
 leader_trait_gullible_machine_desc:0 "Nút ý thức này có lỗ hổng bảo mật nghiêm trọng trong hệ điều hành."

 leader_trait_bureaucratic_hive:0 "Gián Đoạn Truyền Tin"
 leader_trait_bureaucratic_hive_desc:1 "Nút ý thức này gặp tình trạng gián đoạn truyền tin khi hợp nhất ý thức chung với các [owner.GetIndividualNamePlural] cá thể hóa."
 leader_trait_bureaucratic_machine:0 "Lỗi Truyền Dữ Liệu"
 leader_trait_bureaucratic_machine_desc:1 "Nút ý thức này gặp lỗi truyền tải khi liên kết với các drone cá thể hóa."

 leader_trait_micromanager_hive: "Thiếu Đồng Bộ"
 leader_trait_micromanager_hive_desc:0 "[owner.GetIndividualName] này hoạt động kém hiệu quả khi đồng bộ các cuộc cơ động phức tạp của hạm đội."
 leader_trait_micromanager_machine:1 "Thiếu Đồng Bộ"
 leader_trait_micromanager_machine_desc:0 "Đơn vị này hoạt động kém hiệu quả khi đồng bộ các cuộc cơ động phức tạp của hạm đội."

 leader_trait_reckless_hive:0 "Tính Toán Sai Lầm"
 leader_trait_reckless_hive_desc:1 "[owner.GetIndividualName] này tính toán sai rủi ro, tiếp tục chiến đấu khi điều hợp lý lẽ ra là phải rút lui, sửa chữa và tái tập hợp."
 leader_trait_reckless_machine:0 "Lỗi Tính Toán Rủi Ro"
 leader_trait_reckless_machine_desc:1 "Đơn vị này tính toán sai rủi ro, tiếp tục chiến đấu khi điều hợp lý lẽ ra là phải rút lui, sửa chữa và tái tập hợp."

 leader_trait_slipshod_hive:0 "Phòng Thủ Suy Giảm"
 leader_trait_slipshod_hive_desc:0 "[owner.GetIndividualName] này đã phát triển ý thức chiến đấu thất thường và kém hiệu quả, làm suy yếu năng lực phòng thủ của hạm đội."
 leader_trait_slipshod_machine:0 "Phòng Thủ Suy Giảm"
 leader_trait_slipshod_machine_desc:0 "Đơn vị này đã phát triển chương trình chiến đấu thất thường và kém hiệu quả, làm suy yếu năng lực phòng thủ của hạm đội."

 leader_trait_slothful_hive:0 "Chiến Thuật Thiếu Phản Ứng"
 leader_trait_slothful_hive_desc:1 "Hành vi chậm chạp và bất quy tắc của [owner.GetIndividualName] này khiến các đội quân của chúng ta rơi vào nguy hiểm không đáng có."
 leader_trait_slothful_machine:0 "Thuật Toán Chiến Đấu Lỗi"
 leader_trait_slothful_machine_desc:1 "Các thuật toán lỗi và bất quy tắc của đơn vị này khiến các đội quân cơ giới của chúng ta rơi vào nguy hiểm không đáng có."

 leader_trait_victory_or_death_hive:0 "Chiến Thắng Hoặc Diệt Vong"
 leader_trait_victory_or_death_hive_desc:1 "[owner.GetIndividualName] này không hề bận tâm đến việc tự bảo tồn, quyết tâm chiến đấu đến hơi thở cuối cùng."
 leader_trait_victory_or_death_machine:0 "Giao Thức Bất Ly Khai"
 leader_trait_victory_or_death_machine_desc:1 "Đơn vị này có giao thức thoát ly lỗi và sẽ chiến đấu đến cùng."

 leader_trait_disorganized_hive:0 "Mệnh Lệnh Không Rõ"
 leader_trait_disorganized_hive_desc:1 "Hành vi lập dị của [owner.GetIndividualName] này có thể dẫn đến các mệnh lệnh chiến thuật thiếu rõ ràng."
 leader_trait_disorganized_machine:0 "Lỗi Hậu Cần"
 leader_trait_disorganized_machine_desc:1 "Đơn vị này hành động dựa trên các tính toán hậu cần sai sót, làm gia tăng chi phí của các đội quân chúng ta."

 leader_trait_paranoid_hive:0 "Mệnh Lệnh Mã Hóa"
 leader_trait_paranoid_hive_desc:1 "Nút ý thức này thiết lập các mô thức phức tạp để giữ an toàn cho thông tin, làm giảm sản lượng nghiên cứu."
 leader_trait_paranoid_machine:0 "Giao Thức Bảo Mật Quá Mức"
 leader_trait_paranoid_machine_desc:1 "Đơn vị này thiết lập các mô thức phức tạp để giữ an toàn cho thông tin, làm giảm sản lượng nghiên cứu."

 leader_trait_narrow_minded_hive:1 "Tầm Nhìn Hẹp"
 leader_trait_narrow_minded_hive_desc:1 "[owner.GetIndividualName] này tập trung quá hẹp vào các nhiệm vụ nghiên cứu được giao, gạt bỏ một số lựa chọn vì cho là không cần thiết."
 leader_trait_narrow_minded_machine:0 "Lỗi Máy Chủ Trung Tâm"
 leader_trait_narrow_minded_machine_desc:1 "Các chức năng của bộ xử lý lõi bị cô lập, gây ra sự cứng nhắc trong việc đưa ra quyết sách."

 leader_trait_neurotic_hive:0 "Thám Hiểm Thất Thường"
 leader_trait_neurotic_hive_desc:0 "[owner.GetIndividualName] này có tâm tính xao nhãng và thất thường."
 leader_trait_neurotic_machine:0 "Giao Thức Khảo Sát Khiếm Khuyết"
 leader_trait_neurotic_machine_desc:1 "Đơn vị này có giao thức khảo sát hỗn loạn."

 leader_trait_opinionated_hive:0 "Xung Đột Khớp Thần Kinh"
 leader_trait_opinionated_hive_desc:1 "[owner.GetIndividualName] này có các khớp thần kinh bị đột biến, gây khó khăn cho việc biên soạn và tổng hợp tri thức."
 leader_trait_opinionated_machine:0 "Xung Đột Dữ Liệu"
 leader_trait_opinionated_machine_desc:1 "Đơn vị này tổng hợp dữ liệu kém hiệu quả."

 leader_trait_profligate_hive:0 "Gia Tăng Chi Phí Duy Trì"
 leader_trait_profligate_hive_desc:1 "[owner.GetIndividualName] này có khiếm khuyết làm tăng chi phí duy trì của tất cả các [owner.GetIndividualNamePlural] khác trên hành tinh."
 leader_trait_profligate_machine:0 "Tăng Chi Phí Bảo Trì Drone"
 leader_trait_profligate_machine_desc:1 "Đơn vị này có lỗi cố hữu trong lập trình làm tăng chi phí duy trì của tất cả các đơn vị khác trên hành tinh."

 leader_trait_procrastinator_hive:0 "Xây Dựng Trì Trệ"
 leader_trait_procrastinator_hive_desc:1 "[owner.GetIndividualName] này quản lý kém hiệu quả các dự án xây dựng trên hành tinh."
 leader_trait_procrastinator_machine:0 "Xây Dựng Trì Trệ"
 leader_trait_procrastinator_machine_desc:1 "Đơn vị này quản lý kém hiệu quả các dự án xây dựng trên hành tinh."

 leader_trait_insider_trading_hive:0 "Sản Lượng Kém Hiệu Quả"
 leader_trait_insider_trading_hive_desc:1 "[owner.GetIndividualName] này quản lý kém hiệu quả các [owner.GetIndividualNamePlural] trên bề mặt hành tinh."
 leader_trait_insider_trading_machine:0 "Sản Lượng Drone Thấp"
 leader_trait_insider_trading_machine_desc:1 "Đơn vị này quản lý kém hiệu quả các drone trên hành tinh."

 leader_trait_eager_machine:0 "Cơ Thể Tối Ưu"
 leader_trait_eager_machine_desc:1 "Đơn vị này có trạng thái đặc biệt tốt, cần ít bảo trì hơn nhiều để duy trì hoạt động."
 leader_trait_eager_hive:0 "Mẫu Vật Ưu Tú"
 leader_trait_eager_hive_desc:0 "[owner.GetIndividualName] này đặc biệt khỏe mạnh, cần ít chi phí duy trì hơn nhiều để đạt hiệu suất đỉnh cao."

 leader_trait_martinet_hive:0 "Trung Khu Giám Sát"
 leader_trait_martinet_hive_desc:0 "Là một cá thể quan sát nhạy bén luôn đòi hỏi sự tuân thủ nghiêm ngặt, [owner.GetIndividualName] này có thành tích hoàn hảo trong việc hạn chế hành vi lệch lạc."
 leader_trait_martinet_machine:0 "Mô-đun Giám Sát"
 leader_trait_martinet_machine_desc:0 "Với năng lực quan sát xuất sắc, drone này yêu cầu sự tuân thủ nghiêm ngặt. Thành tích của nó hoàn hảo trong việc hạn chế hành vi lệch lạc."

 trait_ruler_charismatic_hive:0 "Khuếch Đại Tiến Trình Phụ"
 trait_ruler_charismatic_hive_desc:1 "Các tiến trình phụ được khuếch đại của nút ý thức này tạo thêm không gian để linh hoạt triển khai và mở rộng các sắc lệnh."
 trait_ruler_charismatic_machine:0 "Mô-đun Khuếch Đại Xung"
 trait_ruler_charismatic_machine_desc:1 "Đơn vị này sở hữu các tiến trình phụ được khuếch đại giúp tạo thêm không gian linh hoạt triển khai và mở rộng các sắc lệnh."

 trait_ruler_warlike_hive:0 "Chiến Trí Bầy Đàn"
