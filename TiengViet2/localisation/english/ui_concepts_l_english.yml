 concept_discovery_view_base_ancrel_archive: "$concept_discovery_view_base$\n- $discoveries_view_tab_collection$: trưng bày ['concept_specimens'] và ['concept_minor_artifacts']\n- $discoveries_view_tab_vivarium$: nhân giống ['concept_space_fauna']"
 concept_discovery_view_base_astral: "$concept_discovery_view_base$\n$concept_discovery_view_astral$"
