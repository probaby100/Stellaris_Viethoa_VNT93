 concept_sidebar_special_project: "và ['concept_special_projects']"
 concept_sidebar_special_project_and_contract: "['concept_special_projects'], và ['concept_contracts']"

 # View: £interface£ ['concept_government_view'] or £interface£ §H$concept_government_view$§!
