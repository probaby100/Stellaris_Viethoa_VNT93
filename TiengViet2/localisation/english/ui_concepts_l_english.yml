 concept_society_management_view_no_crisis: "- $society_management_view_tab_traditions$: lựa chọn ['concept_traditions'] và ['concept_ascension_perks']"

 # View: £interface£ ['concept_technology_view'] or £interface£ §H$concept_technology_view$§!
 concept_technology_view: "Giao diện $TECHNOLOGY$"
 concept_technology_view_desc: "£interface£ §H$concept_technology_view$§! hiển thị tiến bộ khoa học của đế chế trên các lĩnh vực £physics£ ['concept_physics_research'], £society£ ['concept_society_research'], và £engineering£ ['concept_engineering_research']. Từ giao diện này, bạn có thể chọn các hướng nghiên cứu và quản lý độ ưu tiên công nghệ.\n\nCác ['concept_technologies'] mới được đưa ra bán ngẫu nhiên từ những lựa chọn khả dụng, phản ánh tính chất khó lường của công cuộc nghiên cứu khoa học."

 # View: £interface£ ['concept_leaders_view'] or £interface£ §H$concept_leaders_view$§!
 concept_leaders_view: "Giao diện $topbar_button_leaders_name$"
 concept_leaders_view_desc: "£interface£ §H$concept_leaders_view$§! cung cấp cái nhìn tổng quan về tất cả ['concept_leaders'] đang hoạt động trong đế chế, bao gồm vai trò, ['concept_leader_traits'], cấp độ kinh nghiệm và nhiệm vụ hiện tại của họ. Từ giao diện này, bạn có thể chiêu mộ các nhà lãnh đạo mới, tái bổ nhiệm hoặc cho họ nghỉ hưu."

 # View: £interface£ ['concept_species_view'] or £interface£ §H$concept_species_view$§!
 concept_species_view: "Giao diện $topbar_button_species_name$"
 concept_species_view_desc: "£interface£ §H$concept_species_view$§! mang tới danh sách toàn diện về tất cả ['concept_species'] đã biết trong đế chế. Từ giao diện này, bạn có thể xem xét và chỉnh sửa ['concept_species_traits'], đồng thời quản lý quyền của các nhóm dân số như quyền công dân, nghĩa vụ quân sự và ['concept_living_standards'].\n\nGiao diện này đóng vai trò thiết yếu để điều hành sự phức tạp của một đế chế đa chủng loài, nơi chính sách, sinh học và tư tưởng đan xen lẫn nhau trong quá trình định hình xã hội thiên hà."

 # View: £interface£ ['concept_planets_and_sector_view'] or £interface£ §H$concept_planets_and_sector_view$§!
 concept_planets_and_sector_view: "Giao diện $PLANET_LIST$" # Use this alias when referring to the concept
 concept_planets_and_sector: "$PLANET_LIST$" # Left out 'View' to fit in the Databank UI
 concept_planets_and_sector_desc: "Giao diện £interface£ §H$concept_planets_and_sector$§! cung cấp cái nhìn tổng quan tập trung về mọi £colony£ ['concept_colonies'] và £sector£ ['concept_sector'] trong đế chế.\n\nTại giao diện này, bạn cũng có thể bổ nhiệm các ['concept_governors']."

 # View: £interface£ ['concept_expansion_planner'] or
 concept_expansion_planner: "$MENU_PANEL__EXPANSION_PLANNER_TITLE$"
 concept_expansion_planner_desc: "£interface£ §H$concept_expansion_planner$§! liệt kê các £planet£ ['concept_planets'] mở ra cơ hội thuộc địa hóa. Quá trình thuộc địa hóa có thể được bắt đầu trực tiếp từ màn hình này, hệ thống sẽ tự động đóng một £colony_ship£ ['concept_colony_ship'].\n\nCác £planet£ §H$concept_planets$§! phải được khảo sát bởi một £science_ship£ ['concept_science_ship'] và bất kỳ £anomaly£ ['concept_anomalies'] nào tìm thấy trên hành tinh cũng phải được điều tra trước khi có thể tiến hành thuộc địa hóa.\n\nMột ['concept_starbase'] cũng cần phải được xây dựng tại hệ sao của hành tinh để đảm bảo nó nằm trọn trong biên giới đế chế."

 # View: £interface£ ['concept_fleet_management_view'] or £interface£ §H$concept_fleet_management_view$§!
 concept_fleet_management_view: "Giao diện $topbar_button_fleet_manager_name$" # Use this alias when referring to the concept
 concept_fleet_management: "$topbar_button_fleet_manager_name$" # Left out 'View' to fit in the Databank UI
 concept_fleet_management_desc: "Thiết kế tàu và tạo lập hạm đội. Các §HQuy mô Tàu vũ trụ§! mới và ['concept_components'] được mở khóa bằng cách nghiên cứu các ['concept_technologies'] theo yêu cầu.$ui_available_tabs$[GetConceptFleetManagement]"
 fleet_management_view_tab_fleet_manager: "§H$FLEET_MANAGER_VIEW$§!"
 fleet_management_view_tab_ship_designer: "§H$SHIP_DESIGNER$§!"
 concept_fleet_management_view_space_fauna: "$concept_fleet_management_view_no_space_fauna$\n- §H$CREATURE_DESIGNER$§!: lai tạo ['concept_space_fauna']"
 concept_fleet_management_view_no_space_fauna: "- $fleet_management_view_tab_fleet_manager$: tổ chức ['concept_fleets']\n- $fleet_management_view_tab_ship_designer$: thiết kế ['concept_military_ships']"

 # View: £interface£ ['concept_contacts_view'] or £interface£ §H$concept_contacts_view$§!
 concept_contacts_view: "Giao diện Liên lạc"
 concept_contacts_view_desc: "£interface£ §H$concept_contacts_view$§! liệt kê mọi đế chế, vùng đất độc lập và thực thể ngoài hành tinh đã biết. Từ giao diện này, bạn có thể khởi xướng ['concept_diplomacy'] và đánh giá mối quan hệ. Nơi đây đóng vai trò là trung tâm liên lạc liên sao và thông tin tình báo đối ngoại."
 contacts_view_tab_contacts: "§H$topbar_button_contacts_name$§!"
 contacts_view_tab_agreements: "§H$AGREEMENTS_LIST_TITLE$§!"
 contacts_view_tab_shroud: "§H$THE_SHROUD_TITLE$§!"
 concept_contacts_view_tabs: "- $contacts_view_tab_contacts$: tham gia ['concept_diplomacy']\n- $contacts_view_tab_agreements$: tìm hiểu ['concept_subject_agreements']\n- $contacts_view_tab_shroud$: tiến hành ['concept_psionic_ascension']"

 # View: £interface£ ['concept_discoveries_view'] or £interface£ §H$concept_discoveries_view$§!
 concept_discoveries_view: "Giao diện $topbar_button_discoveries_name$"
 concept_discoveries_view_desc: "£interface£ §H$concept_discoveries_view$§! phân loại các vật thể và hiện tượng quan trọng được phát hiện trên khắp thiên hà, bao gồm ['concept_relics'], cổ vật cổ xưa cùng những phát hiện kỳ thú mang ý nghĩa trường tồn khác.$ui_available_tabs$[GetConceptDiscovery]"
 discoveries_view_tab_relics: "§H$relics$§!"
 discoveries_view_tab_collection: "§H$COLLECTION$§!"
