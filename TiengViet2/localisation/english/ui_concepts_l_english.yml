 # View: £interface£ ['concept_claims_view'] or £interface£ §H$concept_claims_view$§!
 concept_claims_view: "Giao diện $CLAIMS_VIEW$"
 concept_claims_view_desc: "£interface£ §H$concept_claims_view$§! hiển thị mọi ['concept_claims'] lãnh thổ mà đế chế đang nắm giữ. Chế độ Ngoại giao của ['concept_galaxy_map'] cung cấp cái nhìn rõ ràng về các hệ sao đang tranh chấp và những điểm nóng tiềm tàng cho các cuộc xung đột tương lai."

 # View: £interface£ ['concept_market_view'] or £interface£ §H$concept_market_view$§!
 concept_market_view: "Giao diện $MARKET_VIEW$"
 concept_market_view_desc: "£interface£ §H$concept_market_view$§! cung cấp nền tảng cho thương mại liên sao, mua bán tài nguyên hoặc thiết lập các giao dịch hàng tháng định kỳ."

 # View: £interface£ ['concept_colony_view'] or £interface£ §H$concept_colony_view$§!
 concept_colony_view: "Giao diện Thuộc địa"
 concept_colony_view_desc: "£interface£ §H$concept_colony_view$§! cho phép quản lý một £colony£ ['concept_colony']. Trên các £planet£ ['concept_planets'] hoặc ['concept_habitats'] chưa có người ở nhưng phù hợp, giao diện này có thể được dùng để bắt đầu quá trình §HThuộc địa hóa§!.$ui_available_tabs$$concept_colony_view_tabs$"
 colony_view_tab_planet_summary: "§H$PLANET_TAB$§!"
 colony_view_tab_management: "§H$MANAGEMENT_TAB$§!"
 colony_view_tab_population: "§H$POPULATION_TAB$§!"
 colony_view_tab_armies: "§H$GROUND_COMBAT_TAB$§!"
 colony_view_tab_holdings: "§H$CORPORATE_TAB$§!"
 concept_colony_view_tabs: "- $colony_view_tab_planet_summary$: hiển thị tổng quan về các £district£ ['concept_districts'], £building£ ['concept_buildings'] của thuộc địa, cùng ['concept_governor'] được chỉ định. Tại đây bạn có thể đặt ['concept_designation'], hoặc bật ['concept_planet_automation'].\n- $colony_view_tab_management$: hiển thị các đặc trưng hành tinh và sự thay đổi dân số. Tại đây bạn có thể ban hành ['concept_decisions'], ['concept_planetary_ascension'], hoặc bắt đầu ['concept_terraforming'].\n- $colony_view_tab_population$: hiển thị dân số của thuộc địa được phân chia theo các tầng lớp £job£ ['concept_job'].\n- $colony_view_tab_armies$: hiển thị các lực lượng mặt đất tại thuộc địa, cùng mức độ ['concept_devastation'] mà thuộc địa đã phải gánh chịu.\n- $colony_view_tab_holdings$: cung cấp cái nhìn tổng quan về toàn bộ ['concept_overlord_holdings'] tại thuộc địa."

 # View: £interface£ ['concept_starbase_view'] or £interface£ §H$concept_starbase_view$§!
 concept_starbase_view: "Giao diện Căn cứ sao"
 concept_starbase_view_desc: "£interface£ §H$concept_starbase_view$§! cho phép quản trị một ['concept_starbase'].$ui_available_tabs$$concept_starbase_view_tabs$"
 starbase_view_tab_command: "§H$STARBASE_STARBASE_TAB$§!"
 starbase_view_tab_defenses: "§H$STARBASE_DEFENSES_TAB$§!"
 starbase_view_tab_armies: "§H$MACRO_BUILDER_TAB$§!"
 starbase_view_tab_shipyard: "§H$STARBASE_SHIPYARD_TAB$§!"
 concept_starbase_view_tabs: "- $starbase_view_tab_command$: hiển thị tổng quan về các §HMô-đun§! và §HCông trình§! của căn cứ sao. Nó cũng cho phép nâng cấp căn cứ sao lên bậc tiếp theo khi đã nghiên cứu xong ['concept_technology'] cần thiết\n- $starbase_view_tab_defenses$: hiển thị các ['concept_defense_platforms'] và bấm vào một thiết kế sẽ đóng thêm nền tảng đó\n- $starbase_view_tab_armies$: cung cấp phương thức tập hợp số lượng lớn §H$assault_army_plural$§!. Các đạo quân được tập hợp trên các £colony£ ['concept_colonies'] khả dụng trong £sector£ ['concept_sector'], và được tập kết tại căn cứ sao hoặc đi theo một §HĐạo quân§! đã bật tính năng §HTập Hợp Quân Đội§!\n- $starbase_view_tab_shipyard$: cho phép đóng cả ['concept_civilian_ships'] lẫn ['concept_military_ships']"

 # View: £interface£ ['concept_waystation_view'] or £interface£ §H$concept_waystation_view$§!
 concept_waystation_view: "Giao diện Trạm trung chuyển"
 concept_waystation_view_desc: "£interface£ §H$concept_waystation_view$§! cho phép quản lý một £waystation£ ['concept_waystation'].$ui_available_tabs$$concept_waystation_view_tabs$"
 waystation_view_tab_waystation: "§H$waystation_starbase_tab$§!"
 concept_waystation_view_tabs: "- $waystation_view_tab_waystation$: hiển thị tổng quan về các §HMô-đun§! và §HKho dự trữ§! của trạm trung chuyển. Nó cũng cho phép nâng cấp trạm trung chuyển lên bậc tiếp theo khi đã nghiên cứu xong ['concept_technology'] cần thiết."

 # View: £interface£ ['concept_system_map'] or £interface£ §H$concept_system_map$§!
 concept_system_map: "Bản đồ Hệ sao"
 concept_system_map_desc: "£interface£ §H$concept_system_map$§! thể hiện góc nhìn chi tiết về một hệ sao riêng biệt, bao gồm ['concept_celestial_objects'], ['concept_civilian_space_stations'], ['concept_fleets'], và cơ sở hạ tầng quỹ đạo. Bản đồ cho phép quản lý chuẩn xác các hoạt động xây dựng, thuộc địa hóa, tác chiến và nghiên cứu khoa học bên trong hệ sao."

 # View: £interface£ ['concept_galaxy_map'] or £interface£ §H$concept_galaxy_map$§!
 concept_galaxy_map: "Bản đồ Thiên hà"
 concept_galaxy_map_desc: "£interface£ §H$concept_galaxy_map$§! cung cấp cái nhìn chiến lược tổng quan về thiên hà đã biết, hiển thị các £system£ ['concept_systems'], biên giới ['concept_empire'], và các tuyến ['concept_hyperlanes']. Đây là giao diện chính phục vụ công cuộc thám hiểm, bành trướng và điều phối liên sao."

 # View: £interface£ ['concept_navigation_bar'] or £interface£ §H$concept_navigation_bar$§!
 concept_navigation_bar: "Thanh Điều hướng"
 concept_navigation_bar_desc: "Thanh £interface£ §H$concept_navigation_bar$§! nằm ở phía bên trái màn hình.\n\nNó có thể mở rộng khi tương tác hoặc được khóa ở trạng thái thu gọn tối giản.\n\nChế độ mở rộng cho phép truy cập cài đặt để sắp xếp lại thứ tự các mục trình đơn. Thao tác này cũng đồng thời thay đổi phím tắt mở nhanh từng trình đơn tương ứng."

 # View: £interface£ ['concept_resource_bar'] or £interface£ §H$concept_resource_bar$§!
 concept_resource_bar: "Thanh Tài nguyên"
 concept_resource_bar_desc: "Thanh £interface£ §H$concept_resource_bar$§! nằm ở phía trên cùng màn hình.\n\nNơi đây hiển thị nhiều §HTài nguyên§! khác nhau như £energy£ ['concept_energy'], và các chỉ số đo lường như £trade_value£ ['concept_trade'], ['concept_research'], ['concept_starbase_capacity'], và ['concept_naval_capacity'].\n\nPhía bên phải là các §HPhím điều khiển Thời gian§! dùng để tăng tốc hoặc làm chậm tốc độ trò chơi, cũng như tạm dừng và tiếp tục.\n\nBên dưới các §HPhím điều khiển Thời gian§! là §HTrình phát Nhạc§!."

 # View: £interface£ ['concept_outliner'] or £interface£ §H$concept_outliner$§!
 concept_outliner: "Thanh Tổng quan Bảng phụ"
 concept_outliner_desc: "£interface£ §H$concept_outliner$§! giúp truy cập nhanh vào các tài sản trọng yếu trên khắp đế chế, bao gồm £colony£ ['concept_colonies'], ['concept_fleets'], và ['concept_civilian_space_stations']. Là một giao diện có thể tùy biến, nó cho phép điều hướng và giám sát nhanh chóng, cung cấp thông tin cập nhật trạng thái theo thời gian thực và quyền kiểm soát trực tiếp các hoạt động sống còn."

