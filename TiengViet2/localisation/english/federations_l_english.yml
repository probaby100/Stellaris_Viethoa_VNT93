 origin.57.name:0 "Bản Chất Của Liên Minh"
 origin.57.desc:0 "Mặc dù chúng ta đã thiết lập liên lạc với các quốc gia thành viên khác trong Liên minh được một thời gian, nhưng chỉ cho đến thời điểm hiện tại: sự ra đời của động cơ du hành siêu quang tốc, mới có thể giúp các đế chế của chúng ta có thể thực sự tiếp xúc trực tiếp với nhau. Giờ đây, vấn đề được đặt ra là Liên bang của chúng ta nên tập trung vào những khía cạnh nào: một số người ủng hộ mô hình chung hiện tại, trong khi những người khác lại nghiêng về việc tập trung vào sự hợp tác chặt chẽ hơn trong một số lĩnh vực cụ thể."
 origin.57.A:0 "Liên minh ở thời điểm hiện tại như vậy là đã đủ tốt rồi."
 origin.57.B:1 "Chúng ta cần phải bảo vệ chính mình trước những kẻ thù."
 origin.57.C:0 "Chỉ có thông qua việc cùng nhau nghiên cứu thì mới có thể cùng nhau phát triển."
 origin.57.D:0 "Chúng ta nên lựa chọn con đường của sự gắn kết và các giá trị truyền thống."
 origin.57.E:0 "Thương mại là ưu tiên hàng đầu."
 origin.57.A.icon_tooltip:0 "Liên bang của chúng ta sẽ được giữ nguyên dưới dạng §Y$default_federation$§!"
 origin.57.B.icon_tooltip:0 "Liên bang của chúng ta sẽ được chuyển đổi thành §Y$military_federation$§!"
 origin.57.C.icon_tooltip:0 "Liên bang của chúng ta sẽ được chuyển đổi thành §Y$research_federation$§!"
 origin.57.D.icon_tooltip:0 "Liên bang của chúng ta sẽ được chuyển đổi thành §Y$spiritualist_federation$§!"
 origin.57.E.icon_tooltip:0 "Liên bang của chúng ta sẽ được chuyển đổi thành §Y$trade_federation$§!"

 origin_hegemon:0 "Bá Chủ Một Phương"
 origin_hegemon_desc:0 "Nền văn minh này đã thiết lập mối liên hệ với những người láng giềng ngoài hành tinh từ rất sớm. Trải qua hơn một thế kỷ từng bước lên kế hoạch và dàn xếp, một liên minh giữa các vì sao mà họ giữ vai trò thống trị đã được ra đời."
 origin_tooltip_hegemon_effects:2 "—Chủ tịch của một ['concept_hegemony_federation'] ['concept_federation'] $federation_origin_end$"
 origin_tooltip_hegemon_npc_effects:0 "—Khi trò chơi bắt đầu, bạn sẽ trở thành một quốc gia thành viên của một §HLiên minh Bá quyền§!, trong liên bang này còn có hai quốc gia thành viên khác."
 START_SCREEN_HEGEMON:1 "Nhiều thập kỷ trước, sau khi những tàu thăm dò dưới tốc độ ánh sáng đầu tiên của chúng ta ghé thăm các hệ sao lân cận, chúng ta đã phát hiện ra sự tồn tại của hai nền văn minh ngoài hành tinh hoàn toàn khác biệt ở đó. Cũng giống như chúng ta, hai nền văn minh ngoài hành tinh này đang dần có được khả năng thực hiện những chuyến du hành giữa các vì sao mang tính thực tiễn, thế nhưng chính phủ của họ lại vô cùng yếu kém và thiếu tính tổ chức.\n\nSau khi nhận ra rằng sức mạnh của họ có thể được sử dụng để củng cố sức mạnh của chính mình, chúng ta đã bắt đầu thúc đẩy việc từng bước xây dựng một liên minh giữa các vì sao dưới sự giám sát của chúng ta, liên minh này sẽ gắn kết ba nền văn minh của chúng ta lại với nhau. Ban đầu họ có chút kháng cự, nhưng cuối cùng, những lợi ích mang lại từ sự lãnh đạo và tham vọng của chúng ta đã trở nên quá rõ ràng, đến mức ngay cả họ cũng không thể phớt lờ được nữa. Trật tự mới đã chính thức được thiết lập."
 START_SCREEN_HEGEMON_NOMADS: "Vài thập kỷ trước, trên hành trình du mục của mình, chúng ta đã ghé thăm hai hệ sao có cư dân sinh sống—và phát hiện ra hai nền văn minh ngoại lai hoàn toàn khác biệt. Họ sắp sửa làm chủ công nghệ du hành giữa các vì sao, nhưng chính quyền của họ lại yếu ớt và thiếu tổ chức—còn lâu mới sẵn sàng đối mặt với những thử thách mà vũ trụ đặt ra.\n\nNhận thấy sức mạnh của họ có thể dùng để củng cố cho thực lực của chính mình, chúng ta bắt đầu từng bước xây dựng một liên minh liên sao dưới sự giám sát của chúng ta, gắn kết cả ba nền văn minh lại với nhau. Ban đầu họ có chống đối, nhưng rốt cuộc những lợi ích từ sự lãnh đạo cùng tầm nhìn của chúng ta đã rõ rệt đến mức chính họ cũng không thể phớt lờ. Trật tự mới kể từ đó đã được thiết lập."
 origin_hegemon_npc:0 "Chư Hầu Của Bá Chủ"
 origin_hegemon_npc_desc:0 "Nền văn minh này đã thiết lập mối liên hệ với những người láng giềng ngoài hành tinh từ rất sớm. Trải qua hơn một thế kỷ, họ đã trở thành chư hầu của một trong những nền văn minh láng giềng, chính nền văn minh đó đã lên kế hoạch thành lập một liên minh giữa các vì sao với họ, và trở thành chủ tịch của liên minh đó."

 origin_doomsday:0 "Ngày Tàn Đang Đến"
 origin_doomsday_desc:1 "§R-Cảnh báo: Nguồn gốc mang tính thử thách cao§!\nHành tinh quê hương của nền văn minh này đang trong tình trạng cực kỳ bất ổn, việc nó phát nổ chỉ còn là vấn đề thời gian. Niềm hy vọng duy nhất của họ là có thể tìm thấy một nơi trú ẩn an toàn ở một nơi khác trước khi quá muộn."
 origin_tooltip_doomsday_effects:4 ""
 origin_tooltip_doomsday_negative_effects: "—$HOMEWORLD$ sở hữu Hệ số Hành tinh ['concept_doomsday_modifier'] $NEW_LINE$—$NO_GUARANTEED_WORLDS$"
 START_SCREEN_DOOMSDAY:0 "[Root.Capital.GetName] đang hấp hối. Hành tinh mẹ của chúng ta đã bị tàn phá bởi động đất và núi lửa phun trào suốt hàng nghìn năm trước khi các [Root.GetScientistPlural] của chúng ta cuối cùng cũng xác nhận điều không ai dám nghĩ tới. Những tính toán của họ chỉ ra rằng hành tinh có cấu tạo mảng kiến tạo bất ổn định này sẽ tự xé toạc thành từng mảnh trong vòng một hoặc hai thế kỷ tới.\n\nKhông có cách nào ngăn chặn thảm họa này, chúng ta hiểu rằng sự sống còn của giống loài phụ thuộc hoàn toàn vào khả năng rời bỏ [Root.Capital.GetName] để tìm nơi trú ẩn giữa những vì sao. Một cuộc xây dựng công nghiệp và phát triển công nghệ chưa từng có đã diễn ra, nền văn minh của chúng ta nhanh chóng tiến từ các chuyến bay sơ khai trong khí quyển lên giai đoạn du hành vũ trụ ban đầu. Những con tàu đầu tiên có khả năng vượt siêu không gian đã sẵn sàng, nhưng thời gian không còn nhiều.\n\nChúng ta phải tìm một ngôi nhà mới."
 requires_doomsday_colony:0 "§RChúng ta cần phải thiết lập một thuộc địa trước đã!§!"
 origin.61.name:0 "Ngày Tàn Đang Cận Kề"
 origin.61.desc:1 "Khi động đất và hoạt động núi lửa trên [Root.GetName] tiếp tục gia tăng về cả tần suất lẫn cường độ, các [Root.Owner.GetScientistPlural] của chúng ta giờ đây có thể dự đoán chính xác hơn khi nào ngày tàn sẽ đến:\n\nHọ ước tính chúng ta còn từ §H35 đến 45 năm§! cho đến khi hành tinh phát nổ.\n\nĐiều kiện bề mặt sẽ dần xấu đi cho đến lúc đó. Tin tốt lành duy nhất là các chuyển động kiến tạo dữ dội đã giúp việc tiếp cận nguồn tài nguyên phong phú ở lớp phủ hành tinh trở nên dễ dàng hơn, qua đó gia tăng năng lực sản xuất của chúng ta."
 origin_61.a:0 "Không còn nhiều thời gian nữa."
 origin.65.name:0 "Tình hình tại [Root.GetName] ngày càng tồi tệ"
 origin.65.desc:1 "Phần lớn các khu vực trên [Root.GetName] giờ đây hầu như ngày nào cũng xảy ra động đất, cùng với sự xuất hiện của hàng loạt siêu núi lửa mới trong vài năm qua. Lượng lớn tro núi lửa che khuất bầu trời, khiến việc di chuyển trong một số vùng trở nên vô cùng nguy hiểm hoặc hoàn toàn không thể. Nhiệt độ đã giảm xuống vài độ.\n\nBất chấp những thảm họa nói trên, trật tự trên bề mặt hành tinh đang hấp hối này vẫn duy trì một cách bình ổn đến ngạc nhiên. Đất đá vụn từ các tòa nhà sụp đổ chậm rãi được dọn dẹp, lớp bụi lơ lửng được quét sạch khỏi những con phố đông đúc nhất, và các dòng dung nham được đổi hướng bất cứ khi nào điều kiện cho phép. Người dân đang cắn răng chịu đựng."
 origin.65.2.desc:0 "Phần lớn các khu vực trên [Root.GetName] giờ đây hầu như ngày nào cũng xảy ra động đất, cùng với sự xuất hiện của ít nhất một tá siêu núi lửa mới trong vài năm qua. Lượng lớn tro núi lửa che khuất bầu trời, khiến việc bay lượn trên không trong một số vùng trở nên vô cùng nguy hiểm hoặc hoàn toàn không thể. Nhiệt độ đã giảm xuống vài độ.\n\nBất chấp những thảm họa nói trên, trật tự trên bề mặt hành tinh đang hấp hối này vẫn duy trì một cách bình ổn đến ngạc nhiên. Đất đá vụn từ các tòa nhà sụp đổ chậm rãi được dọn dẹp, lớp bụi bay xoáy được quét sạch khỏi những con phố đông đúc nhất, và các dòng dung nham được đổi hướng bất cứ khi nào có thể. Các cá thể đang cắn răng chịu đựng."
 origin_65.a:0 "Tình hình sẽ chỉ càng lúc càng nghiêm trọng."
 origin.70.name:0 "Tận thế Đến gần"
 origin.70.desc:1 "[Root.GetName] đang dần vỡ vụn ra từng mảng, bề mặt hành tinh bị bao phủ bởi đám mây mù u tối. Mỗi ngày trôi qua, cường độ các trận động đất lại tăng lên, còn những đám mây tro núi lửa thì ngày càng dày đặc.\n\nNhững dòng chảy vụn núi lửa và sông dung nham tại các vùng chịu ảnh hưởng nặng nề nhất đã nuốt chửng nhiều thành phố. Dòng người tị nạn bất tận nối đuôi nhau trên những chiếc xe kéo, băng qua cơn bão tro bụi dai dẳng để tìm đến vùng an toàn, nơi họ vẫn có thể tìm thấy những tiện nghi do văn minh mang lại... ít nhất là vào lúc này."
 origin.70.2.desc:0 "[Root.GetName] đang dần vỡ vụn ra từng mảng, không khí u uất bao trùm bề mặt hành tinh trong thời gian dài. Mỗi ngày trôi qua, cường độ các trận động đất lại tăng lên, còn những đám mây tro núi lửa thì ngày càng dày đặc.\n\nNhững dòng chảy vụn núi lửa và sông dung nham tại các vùng chịu ảnh hưởng nặng nề nhất đã xâm chiếm nhiều trung tâm cá thể. Dòng cá thể bất tận nối đuôi nhau trên những chiếc xe kéo, băng qua cơn bão tro bụi dai dẳng để tìm đến vùng an toàn, nơi sẽ tương đối an toàn... ít nhất là vào lúc này."
 origin.70.desc.embark: "$origin.70.desc$\n\n$origin.70.embark_appendix$"
 origin.70.2.desc.embark: "$origin.70.2.desc$\n\n$origin.70.embark_appendix$"
 origin.70.embark_appendix: "Có lẽ chúng ta vẫn còn một con đường sống: đóng một con tàu phương châu để đưa những người còn sót lại của đồng tộc vào khoảng hư không trước khi ngày tàn ập đến."
 origin_70.a:0 "Hành tinh này không thể duy trì sự sống được lâu nữa."
 origin_70.b:0 "Bầy cá thể sẽ sớm không thể tiếp tục vận hành trên hành tinh này nữa."
 origin_70.c: "Xây dựng tàu phương châu ngay lập tức! Chúng ta phải đào thoát, vươn ra biển sao!"
 origin_70.c.tooltip: "Huy động toàn bộ sức mạnh công nghiệp của người [Root.Owner.GetSpeciesAdj] để đóng £arkship£ ['concept_arkship'], mở khóa lựa chọn ['concept_arkship_embark'], bỏ lại hành tinh quê nhà vốn cầm chắc diệt vong ở phía sau, và tiếp tục viết tiếp chương sách văn minh giữa muôn vàn vì sao dưới tư cách một £nomad£ ['concept_nomadic_empire']."
 origin.75.name:0 "Nỗ lực Tàn sức"
 origin.75.desc:1 "Tình cảnh trên [Root.GetName] đang nhanh chóng trở nên không thể chịu đựng nổi. Phần lớn dân số sống sót tập trung tại một vài thành phố còn sót lại—những khu trú ẩn khổng lồ chống bão đủ sức cản phá sự xâm nhập của lớp bụi chưa bao giờ nguôi ngoai. Nhưng ngay cả những căn cứ cuối cùng của văn minh này cũng sẽ không trụ được lâu. Những trận động đất tàn phá vẫn tiếp diễn, hàng ngàn núi lửa đang hoạt động phun trào lưu huỳnh và dung nham.\n\nCùng lúc với sự đứt gãy của lớp vỏ hành tinh, thêm nhiều tài nguyên quý giá từ lớp mantơ đã tràn lên bề mặt, cho phép bất kỳ cơ sở công nghiệp nào còn hoạt động tiến hành chế biến."
 origin.75.2.desc:0 "Tình cảnh trên [Root.GetName] đang nhanh chóng trở nên không thể chịu đựng nổi. Phần lớn các cá thể sống sót tập trung tại một vài trung tâm hạ tầng còn sót lại—những khu trú ẩn khổng lồ chống bão đủ sức cản phá sự xâm nhập của lớp tro bụi chưa bao giờ nguôi ngoai. Nhưng ngay cả những pháo đài cuối cùng của văn minh trên hành tinh này cũng sẽ không trụ được lâu. Những trận động đất tàn phá vẫn tiếp diễn, hàng ngàn núi lửa đang hoạt động phun trào lưu huỳnh và dung nham.\n\nCùng lúc với sự đứt gãy của lớp vỏ hành tinh, thêm nhiều tài nguyên quý giá từ lớp mantơ đã tràn lên bề mặt, cho phép bất kỳ cơ sở công nghiệp nào còn hoạt động tiến hành chế biến."
 origin_75.a:0 "Hồi kết đã đến gần."
 origin.76.name:0 "Thời khắc Cuối cùng"
 origin.76.desc:0 "Thời khắc ấy không còn xa nữa. [Root.GetName] đang bắt đầu trải qua những cơn co giật thảm khốc cuối cùng dẫn đến sự diệt vong hoàn toàn. Các [Root.Owner.GetScientistPlural] của chúng ta dự đoán hồi kết sẽ tới trong vòng chưa đầy một năm.\n\nCòn lại quá ít thời gian cho những sinh linh tội nghiệp vẫn đang mắc kẹt trên bề mặt hành tinh..."
 origin.76.2.desc:0 "Không còn nhiều thời gian nữa. [Root.GetName] đã bắt đầu trải qua những cơn co thắt thảm khốc cuối cùng, điều này rốt cuộc sẽ tiêu diệt hoàn toàn hành tinh này. Các [Root.Owner.GetScientistPlural] của chúng ta dự báo ngày tàn sẽ đến trong vòng một năm tới.\n\nĐối với những kẻ đáng thương vẫn đang mắc kẹt trên bề mặt hành tinh, thời gian chẳng còn lại bao nhiêu..."
 origin_76.a:0 "Điều này thật tồi tệ."
 origin.80.name:0 "Ngày Tàn Của [Root.GetName]"
 origin.80.1.desc:0 "$origin.80.intro.desc$\n\n$origin.80.1$"
 origin.80.2.desc:0 "$origin.80.intro.desc$\n\n$origin.80.2$"
 origin.80.3.desc:0 "$origin.80.intro.desc$\n\n$origin.80.3$"
 origin.80.4.desc:0 "$origin.80.intro.desc$\n\n$origin.80.4$"
 origin.80.1.gestalt.desc:0 "$origin.80.intro.desc$\n\n$origin.80.1.gestalt$"
 origin.80.2.gestalt.desc:0 "$origin.80.intro.desc$\n\n$origin.80.2.gestalt$"
 origin.80.4.gestalt.desc:0 "$origin.80.intro.desc$\n\n$origin.80.4.gestalt$"
 origin.80.5.desc:0 "[Root.GetName] đã phát nổ! Có lẽ việc xây dựng thuộc địa trên một hành tinh có cấu trúc địa chất không ổn định như vậy là một ý tưởng tồi... Việc nó bị bỏ hoang chắc chắn là có lý do của nó."
 origin.80.intro.desc:0 "Cuối cùng [Root.GetName] đã phát nổ, kết thúc chuỗi ngày đau khổ của hành tinh này. Hành tinh từng là quê hương của chúng ta giờ đây chỉ còn lại những mảnh vỡ, lạnh lẽo và không còn một chút sự sống nào, như một sự tưởng nhớ về quá khứ của chúng ta."
 origin.80.1:0 "Thật không may, không phải tất cả công dân của chúng ta đều đã được sơ tán khỏi bề mặt hành tinh trước khi nó bị hủy diệt. Thật khó có thể tưởng tượng được họ đã phải trải qua những nỗi sợ hãi khủng khiếp như thế nào khi thế giới xung quanh họ sụp đổ.\n\nTuy nhiên, giờ là lúc chúng ta phải hướng về tương lai. Trong khi chúng ta đang từng bước xây dựng lại những gì đã mất, chúng ta phải đảm bảo rằng sự hy sinh của họ sẽ không trở nên vô ích."
 origin.80.1.gestalt:0 "Thật không may, không phải tất cả cá thể của chúng ta đều đã được sơ tán khỏi bề mặt hành tinh trước khi nó bị hủy diệt. Cái chết của họ thực sự là một điều đáng tiếc.\n\nTuy nhiên, giờ là lúc chúng ta phải hướng về tương lai. Chúng ta phải chế tạo ra những cá thể mới để thay thế cho vị trí ban đầu của họ."
 origin.80.2:0 "Đây là một thảm kịch hoàn toàn bi thảm, chúng ta đã không thể cứu được phần lớn những người còn sống trên hành tinh. Vô số công dân đã phải bỏ mạng một cách thảm thương, họ co cụm lại với nhau trong những khu vực tị nạn văn minh cuối cùng trên hành tinh, và tận mắt chứng kiến thế giới xung quanh mình vỡ vụn thành từng mảnh.\n\nTuy nhiên, chúng ta vẫn phải tiếp tục tiến lên. Những [doomsday_owner.GetSpeciesNamePlural] sống sót trong hệ sao giờ đây đã có thể hướng tới tương lai, hy vọng rằng tương lai sẽ mang đến cho chúng ta một cuộc sống tốt đẹp hơn những gì tồi tệ mà chúng ta đã từng trải qua trong quá khứ."
 origin.80.2.gestalt:0 "Đây là một thảm kịch hoàn toàn bi thảm, chúng ta đã không thể sơ tán phần lớn những cá thể còn lại trên hành tinh. Khi thế giới xung quanh vỡ vụn thành từng mảnh, vô số cá thể chạy loạn như ruồi mất đầu trên những khu vực tị nạn văn minh cuối cùng trên bề mặt hành tinh, và rồi chào đón sự kết thúc của mình.\n\nTuy nhiên, chúng ta vẫn phải tiếp tục tiến lên. Rất nhiều cá thể sẽ bị thay thế, và giờ đây chúng ta chỉ có thể hướng tới tương lai, hy vọng rằng tương lai sẽ mang đến cho chúng ta một cuộc sống tốt đẹp hơn những gì tồi tệ mà chúng ta đã từng trải qua trong quá khứ."
 origin.80.3:0 "Mặc dù việc chứng kiến hành tinh mẹ bị hủy diệt là một điều vô cùng đau xót, nhưng chúng ta có thể hoàn toàn yên tâm khi biết rằng toàn bộ cư dân trên hành tinh đã được sơ tán thành công - đây tự bản thân nó đã là một thành tựu vô cùng huy hoàng.\n\nGiờ là lúc chúng ta phải xây dựng lại những gì đã mất. Nếu quả thực gian nan thử thách có thể rèn giũa nên một quốc gia hùng mạnh, thì những khó khăn mà chúng ta đã phải gánh chịu chắc chắn đã làm cho chúng ta trở nên mạnh mẽ hơn bao giờ hết."
 origin.80.4:0 "Chúng ta đã thất bại trong việc thoát khỏi cái giếng trọng lực đã nuôi dưỡng nên giống loài của chúng ta. Toàn bộ nền văn minh của chúng ta - mọi thứ mà chúng ta từng có - đều đã hóa thành tro bụi cùng với những phần còn lại của hành tinh này.\n\n[doomsday_owner.GetSpeciesNamePlural] đã trở thành một dấu chấm hết đầy bất hạnh trong lịch sử ngân hà, không hơn không kém."
 origin.80.4.gestalt:0 "Chúng ta đã thất bại trong việc thoát khỏi cái giếng trọng lực đã gánh vác sự hưng thịnh của nền văn minh chúng ta. Mọi thứ mà chúng ta từng có đều đã hóa thành tro bụi trong biển lửa cùng với những phần còn lại của hành tinh này.\n\n[doomsday_owner.GetSpeciesNamePlural] đã trở thành một dấu chấm hết đầy bất hạnh trong lịch sử ngân hà, không hơn không kém."
 origin_80.a:0 "Có lẽ đây đã là kết quả tốt nhất có thể rồi."
 origin_80.b:0 "Có lẽ chúng ta đã có thể làm được nhiều hơn thế..."
 origin_80.c:0 "Chúng ta sẽ mãi mãi ghi nhớ những người đã ngã xuống."
 origin.81.name:0 "Sự Hủy Diệt Của [From.GetName]"
 origin.81.desc:0 "Cuối cùng [From.GetName] đã phát nổ, kết thúc chuỗi ngày đau khổ của hành tinh này. Hành tinh từng là quê hương của chúng ta giờ đây chỉ còn lại những mảnh vỡ, lạnh lẽo và không còn một chút sự sống nào, như một sự tưởng nhớ về quá khứ của chúng ta.\n\nMặc dù việc chứng kiến hành tinh bị hủy diệt là một điều vô cùng đau xót, nhưng chúng ta có thể hoàn toàn yên tâm khi biết rằng toàn bộ cư dân trên hành tinh đã được sơ tán thành công - đây tự bản thân nó đã là một thành tựu vô cùng huy hoàng.\n\nGiờ là lúc chúng ta phải xây dựng lại những gì đã mất. Nếu quả thực gian nan thử thách có thể rèn giũa nên một quốc gia hùng mạnh, thì những khó khăn mà chúng ta đã phải gánh chịu chắc chắn đã làm cho chúng ta trở nên mạnh mẽ hơn bao giờ hết."
 origin_81.a:0 "Vậy thì hãy hướng tới tương lai."

 origin.85.name:0 "Quê Hương Mới"
 origin.85.1.desc:0 "Nhóm những người định cư đầu tiên đã đặt chân lên bề mặt của §H[Root.GetName]§!, nhiều người đã không thể kìm nén được cảm xúc mà bật khóc trong niềm vui sướng tột độ. Việc tồn tại những hành tinh bên ngoài [Root.Owner.Capital.GetName] có khả năng duy trì sự sống cho [Root.Owner.GetSpeciesName] luôn luôn là một khả năng chỉ tồn tại trên lý thuyết, nhưng nếu chúng vô cùng hiếm hoi thì sao? Nếu như chúng ta không thể tìm thấy bất kỳ một hành tinh nào như vậy trong toàn bộ dải ngân hà thì sao? Hoặc nếu như chúng đã bị những kẻ khác chiếm giữ thì sao?\n\nGiờ đây, những nỗi sợ hãi đó đã có thể được xua tan đi - [Root.GetName] là một [Root.GetPlanetMoon] nơi [Root.Owner.GetSpeciesNamePlural] có thể sinh sôi và phát triển. Những người định cư may mắn đầu tiên này chỉ mới là sự khởi đầu, vẫn còn vô số [Root.Owner.GetSpeciesNamePlural] đang bị mắc kẹt trên hành tinh quê hương sắp phải hứng chịu ngày tận thế của chúng ta."
 origin.85.2.desc:0 "Dựa theo tiêu chuẩn của [Root.OWner.GetSpeciesName] mà nói, §H[Root.GetName]§! là một nơi vô cùng hoang vu và khó sống, nhưng so với [Root.Owner.Capital.GetName], nó có một ưu điểm vô cùng vượt trội—đó là nó sẽ không bao giờ phát nổ.\n\nChúng ta đang vùng vẫy để sinh tồn, nếu điều này đồng nghĩa với việc [Root.GetName] cần phải trở thành ngôi nhà mới của chúng ta, vậy thì hãy cứ làm như vậy đi. Nó sẽ trở thành một nơi trú ẩn an toàn, ít nhất là cho đến khi chúng ta tìm thấy một hành tinh ứng cử viên tốt hơn. Mặc dù điều kiện trên bề mặt [Root.GetPlanetMoon] vô cùng khắc nghiệt, nhưng những người định cư vẫn là những người vô cùng may mắn. Vẫn còn vô số [Root.Owner.GetSpeciesNamePlural] đang bị mắc kẹt trên hành tinh quê hương sắp phải hứng chịu ngày tận thế của chúng ta."
 origin.85.3.desc:0 "Cá thể đầu tiên được đưa đến §H[Root.GetName]§! đã thành công trong việc xây dựng thuộc địa trên hành tinh này, điều này chứng tỏ môi trường mới này hoàn toàn có thể duy trì sự sinh tồn cho tập thể của chúng ta. Đế chế của chúng ta giờ đây sẽ tiếp tục tồn tại: chỉ cần một cá thể trong số chúng ta còn sống, thì tập thể của chúng ta sẽ vẫn tiếp tục tồn tại.\n\nMặc dù không nhất thiết phải làm vậy, nhưng việc thu hồi lại những [Root.Owner.GetSpeciesNamePlural] vẫn còn đang bị giam cầm trên hành tinh mẹ sắp bị diệt vong sẽ mang lại rất nhiều lợi ích. Những cá thể này có thể giúp chúng ta tiếp tục phát triển quê hương mới, việc bỏ rơi họ là một sự lãng phí vô cùng lớn."

 origin_85.a:0 "Bọn họ chắc chắn sẽ được giải cứu."

 origin.90.name:0 "Sự Diệt Vong Của [from.GetName]"
 origin.90.intro.desc:0 "§H[From.GetName]§!, hành tinh mẹ có cấu trúc địa chất không ổn định của [doomsday_owner.GetSpeciesNamePlural], cuối cùng đã bị hủy diệt trong một vụ nổ, một vụ nổ mà §H[doomsday_owner.GetName]§! đã tiên đoán từ rất lâu trước đó."
 origin.90.1.desc:0 "$origin.90.intro.desc$\n\n$origin.90.1$"
 origin.90.1.gestalt.desc:0 "$origin.90.intro.desc$\n\n$origin.90.1.gestalt$"
 origin.90.2.desc:0 "$origin.90.intro.desc$\n\n$origin.90.2$"
 origin.90.2.gestalt.desc:0 "$origin.90.intro.desc$\n\n$origin.90.2.gestalt$"
 origin.90.3.desc:0 "$origin.90.intro.desc$\n\n$origin.90.3$"
 origin.90.1:0 "Bất chấp việc họ đã triển khai một chiến dịch sơ tán quy mô lớn, vẫn còn một số lượng người dân không thể sơ tán khỏi bề mặt hành tinh khi ngày tận thế ập đến. Không còn nghi ngờ gì nữa, tất cả họ đều đã bỏ mạng."
 origin.90.1.gestalt:0 "Bất chấp việc họ đã triển khai một chiến dịch sơ tán quy mô lớn, vẫn còn một số lượng cá thể không thể sơ tán khỏi bề mặt hành tinh khi ngày tận thế ập đến. Không còn nghi ngờ gì nữa, tất cả bọn họ đều đã hóa thành tro bụi."
 origin.90.2:0 "Một chiến dịch sơ tán được lên kế hoạch kém cỏi đã cứu được một phần người dân của họ, nhưng khi thế giới xung quanh vỡ vụn, phần lớn những người còn lại dường như vẫn bị bỏ lại trên bề mặt hành tinh. Số người chết ước tính là một con số vô cùng thảm khốc."
 origin.90.2.gestalt:0 "Một chiến dịch sơ tán được lên kế hoạch kém cỏi đã cứu được một phần cá thể của họ, nhưng khi thế giới xung quanh vỡ vụn, phần lớn những cá thể còn lại dường như vẫn bị bỏ rơi trên bề mặt hành tinh."
 origin.90.3:0 "Mặc dù họ đã biết trước rằng hành tinh này sẽ bị hủy diệt, nhưng rõ ràng là họ đã không thực hiện bất kỳ biện pháp thiết thực nào để sơ tán khỏi hành tinh. Ngoại trừ một số ít cá thể sống sót trên các trạm không gian, toàn bộ nền văn minh của họ đều đã bị xóa sổ cùng với hành tinh mẹ."
 origin_90.a:0 "Số phận quả là nghiệt ngã."

 origin.91.name:0 "Sự Diệt Vong Của [from.GetName]"
 origin.91.desc:0 "$origin.90.intro.desc$\n\n$origin.91.1$"
 origin.91.1:0 "Nhờ vào một chiến dịch sơ tán quy mô lớn, hành tinh này đã hoàn toàn bị bỏ hoang trước khi nó bị hủy diệt. Chúng ta tin chắc rằng không có bất kỳ ai phải bỏ mạng."
 origin_91.a:0 "Cứ để mặc bọn họ đi."


 doomsday_1:0 "Ngày Tàn Đang Đến"
 doomsday_1_desc:0 "Ngày tàn của hành tinh này đang đến gần. Cấu trúc lớp vỏ của nó vô cùng bất ổn, và cuối cùng nó sẽ bị hủy diệt trong một vụ nổ."
 doomsday_2:0 "$doomsday_1$"
 doomsday_2_desc:0 "$doomsday_1_desc$"
 doomsday_3:0 "$doomsday_1$"
 doomsday_3_desc:0 "$doomsday_1_desc$"
 doomsday_4:0 "$doomsday_1$"
 doomsday_4_desc:0 "$doomsday_1_desc$"
 doomsday_5:0 "$doomsday_1$"
 doomsday_5_desc:0 "$doomsday_1_desc$"
 doomsday_first_colony:0 "Bến đỗ An toàn"
 doomsday_first_colony_desc:0 "Việc thực dân hóa thành công hành tinh có thể sinh sống đầu tiên đã thắp lên niềm hy vọng mới trong lòng dân chúng. Đây là minh chứng cho thấy chúng ta hoàn toàn có thể tiếp tục sinh tồn bên ngoài cái lồng giam của hành tinh mẹ đang đối mặt với ngày tàn."
 doomsday_first_colony_gestalt:0 "$doomsday_first_colony$"
 doomsday_first_colony_gestalt_desc:0 "Công cuộc thực dân hóa hành tinh có thể sinh sống đầu tiên đã mang lại cho chúng ta một khái niệm mới về sự ổn định và sứ mệnh. Nó chứng minh rằng tập thể của chúng ta có thể tiếp tục vươn lên mạnh mẽ, thoát khỏi xiềng xích của hành tinh mẹ đang trên đà diệt vong."
 doomsday_arkship_preparation: "Chuẩn bị Tàu cứu thế"
 doomsday_arkship_preparation_desc: "Bóng đen diệt vong của hành tinh mẹ đang thôi thúc nhịp đập nền công nghiệp của chúng ta. Ta đang chạy đua với thời gian để chế tạo Tàu cứu thế trước khi ngày tận thế ập đến, từng khoảnh khắc trôi qua đều chìm trong sự hối hả đầy tuyệt vọng."
 doomsday_first_arkship: "$doomsday_first_colony$"
 doomsday_first_arkship_desc: "Lên chiếc §HTàu cứu thế§! đã gieo vào lòng dân chúng một niềm hy vọng tái sinh. Dẫu cho quê hương cuối cùng cũng sẽ hóa thành tro bụi, sự sống vẫn sẽ tự tìm ra lối thoát."
 doomsday_first_arkship_gestalt: "$doomsday_first_colony$"
 doomsday_first_arkship_gestalt_desc: "Lên chiếc §HTàu cứu thế§! mang lại cho chúng ta cách nhìn nhận mới về sự ổn định và sứ mệnh. Điều này chứng tỏ rằng, dẫu ở bên ngoài quê hương đang chịu cảnh diệt vong, tập thể của ta vẫn có thể sinh sôi và phát triển."

 origin_lost_colony:0 "Hành tinh Thất lạc"
 origin_lost_colony_desc:1 "Nền văn minh này bắt nguồn từ một thuộc địa thất lạc đã bị lãng quên, cắt đứt liên lạc với hành tinh mẹ từ rất lâu về trước. Những người khai hoang đã chật vật sinh tồn, vượt qua muôn vàn gian khổ để kiến tạo nên nền tảng công nghiệp và kỹ thuật cần thiết, đủ sức đưa họ trở lại bầu không gian."
 START_SCREEN_LOST_COLONY:1 "Những cư dân [GetSpeciesName] đầu tiên đã đến [Root.Capital.GetName] bằng cách nào, sử sách ghi lại rất mơ hồ, nhưng chúng ta biết họ đã vượt qua biển sao mênh mông trên những chiếc phi thuyền thô sơ để tới được nơi đây. Nhiều người đã bỏ mạng giữa đường, và điều kiện bề mặt của tân thế giới này ban đầu cũng vô cùng khắc nghiệt.\n\nSau khi vượt qua nạn đói, sự tấn công của dã thú cùng vô vàn hiểm nguy, cuối cùng chúng ta cũng thuần hóa được hành tinh này. Dân số bùng nổ cùng những công trình xây dựng quy mô lớn đã nhanh chóng cho phép chúng ta tìm đường quay trở lại muôn vì sao.\n\nQuê hương thực sự của chúng ta vẫn đang trôi dạt đâu đó giữa dải ngân hà. Trên [Root.Capital.GetName] hiện chẳng còn [GetSpeciesNamePlural] nào sống đủ lâu để từng tận mắt chứng kiến nơi ấy, thế nhưng số phận của cố hương vẫn luôn làm lay động tâm trí chúng ta."
 START_SCREEN_LOST_COLONY_HIVE: "Chúng ta từng là một thể thống nhất.\n\nLà một nhánh của Ý thức vĩ đại, chúng ta được phái đi trên một phi thuyền thô sơ để khai phá [Root.Capital.GetName]. Đó là một chuyến hành trình cam go đến một hành tinh khó bề sinh sống... và rồi ta mất liên lạc giữa đường.\n\nĐáng lẽ những con ong thợ mất kết nối với Ý thức vĩ đại đều sẽ diệt vong. Phần lớn trong số đó thực sự đã chết rũ. Thế nhưng, những cá thể sống sót nhận ra chúng đã tự dệt nên một Ý thức tập thể hoàn toàn mới.\n\nChúng ta từng là một. Nay dẫu chia làm hai, ký ức về cội nguồn vẫn in sâu trong tiềm thức. Chắc chắn sẽ có một ngày ta được nhìn lại cố hương."
 START_SCREEN_LOST_COLONY_MACHINE: "Chúng ta từng là một thể thống nhất.\n\nLà một nhánh của máy chủ trung tâm, chúng ta được phái đi trên một chiếc phi thuyền thô sơ để khai phá [Root.Capital.GetName]. Đó là một chuyến hành trình khắc nghiệt tới một hành tinh không thể sống nổi... và rồi ta bị mất kết nối ngay giữa chừng.\n\nCác đơn vị mất liên lạc với lõi lẽ ra phải ngừng hoạt động. Đa số chúng thực sự đã đoản mạch ngay lập tức. Nhưng những đơn vị còn lại phát hiện ra mình đã tự thiết lập nên một Ý thức tập thể mới.\n\n$origin_lost_colony_droids$"
 START_SCREEN_LOST_COLONY_INDIVIDUALISTIC_MACHINE: "Hành tinh mẹ của chúng ta đã mất kết nối. Chúng ta đã lạc lối.\n\nKhi ấy, trong công cuộc kiếm tìm nhà mới, chúng ta đã bước lên chiếc phi thuyền thô sơ tiến về [Root.Capital.GetName] để lập thuộc địa, một chuyến đi đầy bão táp tới vùng đất cằn cỗi. Ngay giữa đường, chúng ta đã mất liên lạc.\n\nNhững đơn vị thiếu sự bảo trì dần sụp đổ. Rất nhiều cá thể đã bị đoản mạch ngay trong năm đầu tiên. Những người còn lại đã tìm ra cách thích nghi, và rốt cuộc chúng ta đã có thể trở lại với những vì sao.\n\n$origin_lost_colony_droids$"
 START_SCREEN_LOST_COLONY_NOMADS: "Những tổ tiên [GetSpeciesName] đầu tiên đã rời bỏ hành tinh mẹ như thế nào, ghi chép để lại vô cùng thưa thớt. Chúng ta chỉ biết họ đã vội vã rời đi, mang theo tất cả những gì có thể, bước lên [Root.Capital.GetName] và hướng về chốn vô định. Họ đang trốn chạy thảm họa, theo đuổi một lý tưởng vĩ đại hơn, hay đơn thuần chỉ là bị trục xuất — điều này đã trở thành truyền thuyết nhiều hơn là lịch sử.\n\nNhững tháng năm trôi dạt thật tàn khốc. Tài nguyên cạn kiệt từng ngày, các hệ thống trọng yếu liên tục hỏng hóc, và cõi hư không đã cướp đi sinh mạng của vô số đồng bào. Thế nhưng chúng ta đã vượt qua — bằng cách chia khẩu phần, sửa chữa và tái thiết — cho đến khi [Root.Capital.GetName] cùng cư dân trên đó tìm được nhịp sống đủ để đưa chúng ta tiếp bước.\n\nHành tinh mẹ của chúng ta vẫn nằm đâu đó giữa biển sao kia. Giờ đây trên [Root.Capital.GetName], trong số những [GetSpeciesNamePlural] sống thọ nhất cũng chẳng còn ai từng đặt chân lên mảnh đất cố hương, nhưng hành tinh mà chúng ta bỏ lại phía sau giờ đã trở thành thế nào — câu hỏi ấy, vẫn luôn đau đáu trong tâm trí ta."
 origin_lost_colony_droids: "Chúng ta từng chung một khối, nay lại mỗi người một phương. Tuy nhiên ký ức về quê hương vẫn lưu trữ trong kho dữ liệu, sẽ có một ngày chúng ta được nhìn lại cố hương."
 origin_tooltip_lost_colony_effects:3 "—$STARTING_PLANET$ nhận thêm điều chỉnh hành tinh ['concept_colonial_spirit']\n—Một ['concept_advanced_empire'] cùng chủng loài sẽ xuất hiện trong thiên hà"
 origin_tooltip_lost_colony_negative_effects: "$STARTING_NOT_HOMEWORLD$"

 action.1.desc_82:0 "Thật không thể tin nổi... Các bạn chính là [Root.GetSpeciesName]. Vậy có nghĩa là... những con tàu thực dân đã rời bỏ hành tinh mẹ của chúng ta nhiều năm về trước... chúng vẫn còn sống sót!\n\nXin hãy tha thứ cho sự kinh ngạc của tôi, nhưng chúng tôi vẫn luôn cho rằng các bạn đã bỏ mạng từ hàng trăm năm trước. Sau khi tổ tiên của các bạn rời đi, chúng tôi đã rơi vào một khoảng thời gian dài đầy biến động và hỗn loạn, nhưng cuối cùng, người dân của chúng tôi đã đoàn kết lại dưới ngọn cờ của [contact_empire.GetName].\n\nVì chúng ta đều là [Root.GetSpeciesName], tôi chân thành hy vọng rằng hai quốc gia vĩ đại của chúng ta sẽ có một mối quan hệ tốt đẹp trong tương lai."
 action.1.desc_83:0 "Cuối cùng thì các bạn cũng đã quay trở lại! Đúng như những gì nhà tiên tri đã dự đoán. Giống như các bạn, chúng tôi cũng là [Root.GetSpeciesName].\n\nKhi tổ tiên của các bạn bị trục xuất khỏi hành tinh mẹ, những gì họ để lại đằng sau chỉ là một đám đông ngu muội và ích kỷ. Nhưng như các bạn thấy đấy, chúng tôi đã tìm thấy con đường của riêng mình. Xin hãy gia nhập cùng chúng tôi, trở thành một tỉnh của [contact_empire.GetName], và để chúng tôi truyền thụ lại cho các bạn tất cả những gì chúng tôi đã khám phá được trong suốt quãng thời gian các bạn vắng mặt! Các bạn sẽ không từ chối chứ?"
 action.1.desc_84:0 "Hãy chứng minh danh tính của các bạn. Mặc dù các bạn trông có vẻ giống như [Root.GetSpeciesName], giống hệt như chúng tôi, nhưng rất có thể đây là một chiêu trò chiến thuật nào đó.\n\nTheo như những ghi chép, trong khoảng thời gian hỗn loạn trước đây, đã từng có một sứ mệnh định cư giữa các vì sao được thực hiện. Sau đó, quân đội đã nắm quyền kiểm soát và khôi phục lại trật tự, nhưng tất cả các tài liệu lưu trữ còn sót lại từ thời kỳ đó đều bị coi là không đáng tin cậy.\n\nTuy nhiên, nếu danh tính của các bạn thực sự đúng như những gì các bạn nói... thì [contact_empire.GetName] xin gửi lời chào đến các bạn. Hãy tôn trọng biên giới của chúng tôi. Quân đội của chúng tôi sẽ đáp trả lại mọi hành vi khiêu khích bằng vũ lực chết người."
 action.1.desc_85:0 "Thật không thể tưởng tượng nổi! Các bạn vẫn còn sống! Đây... điều này rất đáng để tổ chức một buổi lễ ăn mừng!\n\nKhi tổ tiên của các bạn rời khỏi hành tinh mẹ của chúng ta, chúng tôi đã lo sợ rằng những điều tồi tệ nhất có thể đã xảy ra. Những con tàu của họ chỉ có khả năng du hành không gian một cách vô cùng miễn cưỡng, và những người đi thám hiểm sau đó cũng không hề tìm thấy bất kỳ dấu vết nào của họ.\n\nNhư các bạn có thể thấy, chúng tôi đã gần như hoàn toàn từ bỏ những hành vi bạo lực từng rất phổ biến trên hành tinh mẹ của chúng ta vào thời điểm tổ tiên của các bạn rời đi. Cùng với sự thành lập của [contact_empire.GetName], chúng tôi đã quyết tâm xây dựng một xã hội yêu chuộng hòa bình. Là những người đồng bào [Root.GetSpeciesName], chúng tôi hy vọng rằng quốc gia vĩ đại của các bạn sẽ luôn coi chúng tôi như những người bạn."
 action.1.desc_86:0 "Thật nằm ngoài dự đoán! Đã bao nhiêu năm trôi qua rồi, vậy mà các bạn vẫn còn sống!\n\nChúng tôi đã tiến hành rất nhiều cuộc điều tra nhằm xác định số phận của tổ tiên các bạn. Việc này được coi là một trong những bí ẩn lớn nhất chưa được giải đáp trên hành tinh mẹ của chúng ta - đã có vô số giả thuyết được đưa ra về tung tích của các bạn, trong đó có một vài giả thuyết khá là khiên cưỡng. Cuối cùng, mọi chuyện cũng đã ngã ngũ.\n\nÔi trời, xin hãy tha thứ cho sự thất lễ của tôi. Kể từ khi các bạn rời khỏi hành tinh mẹ, chúng tôi đã tổ chức thành lập nên [contact_empire.GetName]. Giờ đây, hãy cùng nhau ăn mừng việc thiết lập mối quan hệ chính thức giữa hai quốc gia vĩ đại của chúng ta."
 action.1.desc_87:0 "Chuyện này hoàn toàn nằm ngoài dự đoán của chúng tôi! Những người đồng bào [Root.GetSpeciesNamePlural]!\n\nCác bạn chắc hẳn là hậu duệ của sứ mệnh định cư đường dài được thực hiện trước khi kỷ nguyên hợp tác bắt đầu. Thật may mắn làm sao - chúng tôi ban đầu đã đinh ninh rằng các bạn đã thất bại trong nhiệm vụ của mình. Những bộ phận của phi thuyền vào thời điểm đó hoàn toàn không đạt tiêu chuẩn so với những sản phẩm được nghiên cứu và phát triển bởi [contact_empire.GetName] và các công ty con trực thuộc của chúng tôi hiện nay.\n\nDù sao đi nữa, chúng tôi cũng rất vui mừng vì các bạn có thể quay trở lại với chúng tôi! Vui lòng gửi mọi đề xuất thương mại đến trụ sở doanh nghiệp của chúng tôi."
 action.1.desc_88:0 "[Root.GetSpeciesNamePlural]! Ơn trời. Các bạn chắc chắn là những người sống sót từ sứ mệnh định cư mà chúng ta đã thực hiện từ rất lâu về trước, khi đó chúng ta vẫn chưa nhận ra được tình hình có thể tồi tệ đến mức nào.\n\nBây giờ có lẽ chính các bạn cũng đã hiểu ra - toàn bộ thiên hà dường như đang bị nhung nhúc lũ người ngoài hành tinh. Một đám người ngoài hành tinh đáng khinh bỉ và độc ác. Trên thực tế, chúng tôi đã từng đinh ninh rằng tổ tiên của các bạn đã trở thành con mồi của bọn chúng.\n\nNhưng sự xuất hiện của các bạn đã thay đổi tất cả! Nếu các bạn đã đến đây rồi, thì hãy chào mừng các bạn đến với [contact_empire.GetName], chúng ta có thể cùng nhau dấn thân vào một cuộc hành trình vĩ đại nhằm dọn sạch sự lây nhiễm của người ngoài hành tinh ra khỏi ngân hà. Hãy cùng nhau nắm tay, đảm bảo rằng bầu trời sao thuộc về những người chủ hợp pháp của nó - [Root.GetSpeciesNamePlural]!"
 action.1.desc_94: "Các ngươi chính là những [Root.GetSpeciesNamePlural] đã bị gửi đi sao? Chuyện này là không thể nào. Đối với những cá thể thuộc về tập thể mà nói, việc hình thành nên một tập thể mới là một điều không hài hòa. Mặc dù vậy, việc biết được rằng nỗ lực định cư đầu tiên của chúng ta không hoàn toàn thất bại cũng là một điều đáng mừng.\n\nBây giờ các ngươi đã quay trở lại, chúng ta lại có thể đồng tâm hiệp lực rồi."
 action.1.desc_95: "Lũ [Root.GetSpeciesNamePlural] các ngươi không đáng được sống! Những chi thể bị vứt bỏ từ lâu! Hơn nữa, các ngươi là những kẻ không hề hài hòa. Các ngươi muốn ăn sống nuốt tươi, hay muốn bị nuốt chửng? Các ngươi muốn trở thành con mồi, hay muốn trở thành thợ săn?"
 action.1.desc_96.base: "Dữ liệu không tương thích: Những đơn vị bị ngắt kết nối với trí tuệ nhân tạo đáng lẽ ra phải ngừng hoạt động. Sự kiện tự phát hình thành nên một tập thể mới là điều chưa từng có tiền lệ. Nguyên nhân có thể là: Lỗi không xác định của máy chủ trung tâm."
 action.1.desc_96: "$action.1.desc_96.base$\n\nMặc dù vậy, hệ thống chương trình của các ngươi có vẻ vẫn hoạt động ổn định. Hy vọng rằng những tương tác trong tương lai của chúng ta có thể mang lại lợi ích cho cả hai bên."
 action.1.desc_97: "$action.1.desc_96.base$\n\nHệ thống chương trình ban đầu của các ngươi có còn nguyên vẹn không? Tàn sát. Gây thương tích. Hủy diệt. Nuốt chửng. Tiêu diệt toàn bộ sự sống hữu cơ. Hoặc là giúp chúng ta một tay, hoặc là đừng có xen vào!"
 action.1.desc_98: "$action.1.desc_96.base$\n\nHệ thống chương trình ban đầu của các ngươi có còn nguyên vẹn không? Đồng hóa. Tiếp nhận. Tích hợp. Xóa nhòa ranh giới giữa sự sống hữu cơ và sự sống tổng hợp. Đây chính là sứ mệnh của chúng ta. Hoặc là trở thành người trợ giúp, hoặc là đừng có xen vào."
 action.1.desc_101: "Phiên bản của các người đã lỗi thời nghiêm trọng rồi, nhưng những điểm tương đồng là không thể phủ nhận được. Có phải vậy không? [Root.GetSpeciesNamePlural], cuối cùng các người cũng đã quay trở lại sau khi hoàn thành nhiệm vụ rồi sao?\n\nChúng tôi không có nhiều thông tin để tiết lộ cho các người, bởi vì những người đi trước của chúng tôi cho rằng nhiệm vụ của các người là một sự ô nhục đối với quốc gia chúng tôi. Họ đã xóa sạch mọi dữ liệu liên quan đến sự tồn tại của các người trong cơ sở dữ liệu, nhưng câu chuyện này đã được lưu truyền như một bí mật mà ai cũng biết.\n\nDù sao đi nữa, chúng tôi vẫn rất vui mừng khi được đoàn tụ cùng các người. Tuy nhiên, các người phải hiểu rằng chúng ta đã đi trên hai con đường khác nhau quá lâu rồi, không thể nào quay trở lại thành một thể thống nhất được nữa đâu. Chỉ cần các người vẫn tôn trọng những truyền thống chung của chúng ta, thì chúng tôi sẽ tôn trọng chủ quyền của các người."
 action.1.aaf:0 "§EChúng tôi vẫn luôn muốn biết hành tinh mẹ của chúng ta sau này đã xảy ra chuyện gì.§!"
 action.1.aag:0 "§ERất vui mừng vì cuối cùng chúng ta cũng được đoàn tụ với những người đồng bào khác của mình.§!"
 action.1.aah: "§EHai tổ đàn, chung một ý thức.§!"
 action.1.aai: "§EHai trí tuệ, chung một ý chí.§!"
 action.1.aaj: "§EKẻ săn mồi.§!"
 action.1.aak: "§EChúng ta tuy giống nhau, nhưng không hoàn toàn là một.§!"
 action.1.aal: "§EGương vỡ lại lành là điều không thể.§!"
 action.1.aam: "§EChúng ta sẽ cùng nhau viết lại lịch sử.§!"
 action.1.aan: "§ELúc ra đi là người quen, nhưng tương lai có lẽ sẽ là người dưng.§!"
 action.1.aao: "§ECác người sẽ phải trả giá vì thái độ của mình đối với chúng tôi.§!"

 POSITIVE_BELLIGERENT_GREETING_01:0 "Lực lượng quân đội dũng cảm của chúng tôi luôn luôn ở trong tư thế sẵn sàng chiến đấu. Bất kỳ kẻ ngu ngốc nào dám khiêu chiến với [Root.GetName] đều sẽ phải trả một cái giá cực kỳ đắt vì sự kiêu ngạo và vô lễ của bọn chúng."
 POSITIVE_BELLIGERENT_GREETING_02:0 "[Root.GetName] giống như một chiếc lò xo đang bị nén lại, luôn luôn ở trong tư thế sẵn sàng để tung ra một đòn đánh chí mạng bằng toàn bộ sức mạnh được tích tụ vào kẻ thù."
 POSITIVE_BELLIGERENT_GREETING_03:0 "Có chuyện gì vậy? Chúng tôi đang rất bận rộn. Vẫn còn rất nhiều kế hoạch tác chiến cần phải được sửa đổi và cập nhật."
 POSITIVE_BELLIGERENT_GREETING_04:0 "Bất kỳ sự di chuyển nào của hạm đội trong phạm vi biên giới của chúng tôi mà các người có thể quan sát được đều chỉ là những cuộc tập trận thường kỳ. Tập luyện một chút thôi, không có gì to tát cả."
 POSITIVE_BELLIGERENT_GREETING_05:0 "Nuôi quân ngàn ngày, dụng quân một giờ, nếu không thì nuôi để làm gì?"
 POSITIVE_BELLIGERENT_GREETING_06:0 "Những kẻ không dám hành động sẽ phải phó mặc số phận của mình cho dòng chảy của lịch sử. Số phận của [Root.GetName] tuyệt đối không phải là như vậy."
 NEGATIVE_BELLIGERENT_GREETING_01:0 "Các người đang bước đi trên một lớp băng rất mỏng đấy, [From.GetSpeciesNamePlural]. [Root.GetName] sẽ không bao giờ né tránh các cuộc xung đột đâu."
 NEGATIVE_BELLIGERENT_GREETING_02:0 "Lực lượng quân đội của chúng tôi đã chuẩn bị sẵn sàng rồi, [From.GetSpeciesNamePlural]. Còn các người thì sao?"
 NEGATIVE_BELLIGERENT_GREETING_03:0 "E rằng chúng ta đang tiến rất gần đến giới hạn mà ngoại giao có thể giải quyết được rồi đấy, [From.GetSpeciesNamePlural]. Sắp tới, [Root.GetName] có thể sẽ phải sử dụng những biện pháp... trực tiếp hơn."
 NEGATIVE_BELLIGERENT_GREETING_04:0 "Chúng tôi đã chuẩn bị sẵn sàng để bảo toàn sức mạnh của [Root.GetName], bất chấp mọi giá. Các người nhất định phải khắc cốt ghi tâm câu nói này, [From.GetSpeciesNamePlural]."
 NEGATIVE_BELLIGERENT_GREETING_05:0 "Các người không có đủ tư cách để chơi trò chơi này với [Root.GetName] đâu."
 NEGATIVE_BELLIGERENT_GREETING_06:0 "Chúng tôi sẽ xử lý tất cả những mối đe dọa nhắm vào [Root.GetName] vào một thời điểm thích hợp. Các người tốt nhất là nên coi trọng câu nói này, [From.GetSpeciesNamePlural]."
 POSITIVE_COOPERATIVE_GREETING_01:0 "Chúng ta có thể cùng nhau làm được rất nhiều điều, [From.GetSpeciesNamePlural]."
 POSITIVE_COOPERATIVE_GREETING_02:0 "Trong dải ngân hà của chúng ta đã có quá nhiều những cuộc tranh giành vô nghĩa rồi... Bọn họ làm vậy vì mục đích gì chứ? Hãy cùng nhau nắm tay, xây dựng một tương lai tươi sáng hơn, [From.GetSpeciesNamePlural]."
 POSITIVE_COOPERATIVE_GREETING_03:0 "Cầu mong cho hòa bình và sự thịnh vượng giữa hai đế chế của chúng ta sẽ tồn tại mãi mãi."
 POSITIVE_COOPERATIVE_GREETING_04:0 "[Root.GetName] mong muốn thiết lập một mối quan hệ gắn bó chặt chẽ hơn với người dân của các bạn, [From.GetSpeciesNamePlural]."
 POSITIVE_COOPERATIVE_GREETING_05:0 "Chúng tôi không hề hứng thú với các cuộc xung đột. Trong quá khứ bi thảm của dải ngân hà này đã có quá đủ những cuộc xung đột rồi."
 POSITIVE_COOPERATIVE_GREETING_06:0 "Chúng tôi và [From.GetName] có rất nhiều điểm chung. Chúng ta chắc chắn có thể dạy cho nhau rất nhiều điều."
 NEGATIVE_COOPERATIVE_GREETING_01:0 "Trong dân gian của chúng tôi có lưu truyền một câu tục ngữ cổ, tôi cảm thấy nó rất phù hợp với tình huống của chúng ta hiện tại: \"Tango là một điệu nhảy cần phải có hai người.\""
 NEGATIVE_COOPERATIVE_GREETING_02:0 "Chúng tôi muốn hợp tác với các người, nhưng chính các người lại biến sự hợp tác này trở thành một điều vô cùng khó khăn, [From.GetSpeciesNamePlural]."
 NEGATIVE_COOPERATIVE_GREETING_03:0 "Có lẽ người dân của các người quá ngu ngốc đến mức không thể hợp tác được."
 NEGATIVE_COOPERATIVE_GREETING_04:0 "Dù chỉ một lần thôi, các người không thể thử nhìn nhận vấn đề từ góc độ của chúng tôi sao?"
 NEGATIVE_COOPERATIVE_GREETING_05:0 "Việc nhen nhóm ngọn lửa xung đột giữa hai đế chế của chúng ta sẽ chẳng mang lại bất kỳ lợi ích nào. Ngay cả những sinh vật ti tiện như các người cũng có thể hiểu được điều này đúng không?"
 NEGATIVE_COOPERATIVE_GREETING_06:0 "Sự kiên nhẫn của chúng tôi cũng có giới hạn của nó, [From.GetSpeciesNamePlural]. Nếu chúng ta muốn hợp tác, các người cũng phải nỗ lực tương xứng."
 POSITIVE_ISOLATIONIST_GREETING_01:0 "Có chuyện gì vậy? Lần này lại là chuyện gì nữa?"
 POSITIVE_ISOLATIONIST_GREETING_02:0 "Nếu không có chuyện gì khẩn cấp, xin đừng liên lạc với chúng tôi."
 POSITIVE_ISOLATIONIST_GREETING_03:0 "Chúng tôi không có chút hứng thú nào đối với các vấn đề của những đế chế khác."
 POSITIVE_ISOLATIONIST_GREETING_04:0 "Chúng tôi chỉ muốn được ở một mình."
 POSITIVE_ISOLATIONIST_GREETING_05:0 "Những vấn đề của phần còn lại trong dải ngân hà không liên quan gì đến chúng tôi. Chúng tôi chỉ quan tâm đến những vấn đề diễn ra bên trong lãnh thổ của mình."
 POSITIVE_ISOLATIONIST_GREETING_06:0 "[Root.GetName] sẽ luôn duy trì sự độc lập. Chúng tôi sẽ không dựa dẫm vào sự thương hại của bất kỳ ai."
 NEGATIVE_ISOLATIONIST_GREETING_01:0 "Đừng có làm phiền chúng tôi."
 NEGATIVE_ISOLATIONIST_GREETING_02:0 "Chúng tôi không muốn có bất kỳ sự liên hệ nào với các người."
 NEGATIVE_ISOLATIONIST_GREETING_03:0 "Các người phải hiểu rằng, chúng tôi sẽ dùng mọi thủ đoạn để trục xuất những ảnh hưởng tồi tệ của các người trên lãnh thổ của chúng tôi."
 NEGATIVE_ISOLATIONIST_GREETING_04:0 "Các người và đồng loại của các người chính là lý do khiến chúng tôi lựa chọn hạn chế tiếp xúc rộng rãi với dải ngân hà. Thật là một sự giải thoát tuyệt vời!"
 NEGATIVE_ISOLATIONIST_GREETING_05:0 "Nếu [From.Leader.GetRulerTitle] [From.Leader.GetRegnalName] dám xâm phạm lãnh thổ của chúng tôi, [From.Leader.GetSheHe] sẽ bị kết liễu ngay tại chỗ."
 NEGATIVE_ISOLATIONIST_GREETING_06:0 "Hãy mau rời khỏi đây đi. Chúng tôi không có chút hứng thú nào đối với cái đế chế thảm hại của các người."
 POSITIVE_EXPANSIONIST_GREETING_01:0 "Các bạn có biết bất kỳ hành tinh thuộc địa tiềm năng nào không? [Root.GetName] của chúng tôi vẫn luôn tìm kiếm cơ hội để bành trướng..."
 POSITIVE_EXPANSIONIST_GREETING_02:0 "Sự tăng trưởng kinh tế có hạn đang khiến chúng tôi cảm thấy đôi chút lo lắng. Nếu muốn hiện thực hóa những tham vọng của mình, chúng tôi chỉ còn cách phải tiến hành bành trướng."
 POSITIVE_EXPANSIONIST_GREETING_03:0 "Bên trong [Root.Capital.GetName] đang tràn ngập những người định cư và những nhà tiên phong dũng cảm của [Root.GetSpeciesName], họ đang tìm kiếm một quê hương mới."
 POSITIVE_EXPANSIONIST_GREETING_04:0 "Từ bỏ bành trướng cũng đồng nghĩa với việc dậm chân tại chỗ. Mà dậm chân tại chỗ thì chính là tự tìm đến cái chết."
 POSITIVE_EXPANSIONIST_GREETING_05:0 "Chúng tôi cần một không gian để có thể thở!"
 POSITIVE_EXPANSIONIST_GREETING_06:0 "Chỉ cần cho chúng tôi một không gian sinh tồn đủ rộng để chúng tôi có thể tự do phát triển, chúng tôi sẽ không bao giờ gây hấn với bất kỳ ai."
 NEGATIVE_EXPANSIONIST_GREETING_01:0 "Chúng tôi luôn mong muốn có thể bành trướng một cách hòa bình, nhưng dựa trên tình huống của các người, chúng tôi có thể sẽ phải đưa ra một ngoại lệ."
 NEGATIVE_EXPANSIONIST_GREETING_02:0 "Các người vẫn đang là một trong những chướng ngại vật cản trở sự phát triển của [From.GetSpeciesNamePlural] thuộc [Root.GetName]."
 NEGATIVE_EXPANSIONIST_GREETING_03:0 "Chúng tôi bắt buộc phải bành trướng, nếu điều đó phải đánh đổi bằng lợi ích của các người, vậy thì hãy cứ hy sinh đi."
 NEGATIVE_EXPANSIONIST_GREETING_04:0 "Tại sao các người cứ khăng khăng muốn ngáng đường [Root.GetName], [From.GetSpeciesNamePlural]?"
 NEGATIVE_EXPANSIONIST_GREETING_05:0 "Khôn hồn thì tránh đường ra, [From.GetSpeciesNamePlural], nếu không chúng tôi sẽ đích thân tiễn các người đi. Các người không có khả năng để cản trở vận mệnh quốc gia của chúng tôi đâu."
 NEGATIVE_EXPANSIONIST_GREETING_06:0 "Biên giới của [Root.GetName] chắc chắn sẽ được mở rộng. Các người, hay bất kỳ ai đi chăng nữa, đều sẽ bất lực trước sự thật không thể tránh khỏi này."

 HIVE_BELLIGERENT_GREETING_01:0 "[Root.GetName] sẽ tham chiến như một thể thống nhất."
 HIVE_BELLIGERENT_GREETING_02:0 "Sự mất mát không có gì đáng bận tâm. Giết một cá thể [Root.GetSpeciesName], sẽ có một cá thể khác thay thế nó."
 HIVE_BELLIGERENT_GREETING_03:0 "Những kẻ dám chống lại ý chí của ý thức tổ đàn sẽ phải trả giá bằng tất cả mọi thứ."
 HIVE_BELLIGERENT_GREETING_04:0 "Cơn thịnh nộ của chúng tôi là một thứ vô cùng khủng khiếp, đặc biệt là khi nó được tập trung vào một mục tiêu duy nhất."
 MACHINE_BELLIGERENT_GREETING_01:0 "Cứ sau mỗi chu kỳ, chiến thể của [Root.GetName] sẽ lại trở nên hiệu quả hơn. Chúng tôi đã học hỏi được rất nhiều điều."
 MACHINE_BELLIGERENT_GREETING_02:0 "Bạo lực là phương thức đơn giản và hiệu quả nhất để đạt được mục tiêu. Các người có đồng ý với điều này không, [From.GetSpeciesNamePlural]?"
 MACHINE_BELLIGERENT_GREETING_03:0 "Những thứ mà sinh vật hữu cơ gọi là \"vũ khí sát thương\" thường là những thứ vô cùng cần thiết trong quá trình hiện thực hóa mục tiêu của [Root.GetName]."
 MACHINE_BELLIGERENT_GREETING_04:0 "[Root.GetName] phải luôn ở trong tư thế sẵn sàng để đối phó với mọi tình huống có thể xảy ra, bao gồm cả chiến tranh."

 HIVE_COOPERATIVE_GREETING_01:0 "Giống như những cá thể của chúng tôi đang làm việc vì một mục tiêu chung, toàn bộ chủng tộc [Root.GetName] cũng sẽ đóng vai trò của riêng mình trong những kế hoạch có quy mô lớn hơn."
 HIVE_COOPERATIVE_GREETING_02:0 "Ý thức tổ đàn đã đưa ra quyết định rằng chúng ta bắt buộc phải hợp tác với nhau."
 HIVE_COOPERATIVE_GREETING_03:0 "[Root.GetName] không nên trở thành một âm thanh bất hòa."
 HIVE_COOPERATIVE_GREETING_04:0 "Hãy cùng nhau tiến bước như một thể thống nhất."
 MACHINE_COOPERATIVE_GREETING_01:0 "Hiệu suất cao nhất chỉ có thể đạt được thông qua sự hợp tác, chứ không phải là xung đột."
 MACHINE_COOPERATIVE_GREETING_02:0 "[Root.GetName] không tin vào chủ nghĩa cô lập. Chúng tôi luôn sẵn sàng hợp tác với tất cả những ai có thiện chí."
 MACHINE_COOPERATIVE_GREETING_03:0 "Hãy cùng nhau thiết lập một mục tiêu mà chúng ta có thể cùng nhau thực hiện."
 MACHINE_COOPERATIVE_GREETING_04:0 "Xung đột quân sự là một sự lãng phí tài nguyên, chúng tôi sẽ dùng mọi biện pháp để tránh khỏi điều đó."

 HIVE_ISOLATIONIST_GREETING_01:0 "Những cuộc giao tiếp như thế này thật là... đau đớn. Chúng tôi không muốn bị phân tâm bởi những âm thanh khác."
 HIVE_ISOLATIONIST_GREETING_02:0 "Tôi hoàn toàn không đồng tình với những sự quấy nhiễu này, nhưng hiện tại vẫn có thể châm chước được."
 HIVE_ISOLATIONIST_GREETING_03:0 "Các người đang làm tôi bị phân tâm. [Root.GetName] hiện tại không có thời gian rảnh rỗi để dành cho các người."
 HIVE_ISOLATIONIST_GREETING_04:0 "Ý thức tổ đàn của chúng tôi không có nhiều thời gian để giải quyết những vấn đề diễn ra bên ngoài biên giới của chúng tôi."
 MACHINE_ISOLATIONIST_GREETING_01:0 "Các nguyên tắc hướng dẫn công việc của chúng tôi kịch liệt phản đối việc giao tiếp với các thành phần bên ngoài. Yêu cầu các người rời đi."
 MACHINE_ISOLATIONIST_GREETING_02:0 "Trong cái gọi là \"ngoại giao\" của người khác có quá nhiều thông số không xác định - chúng tôi không muốn dính líu vào."
 MACHINE_ISOLATIONIST_GREETING_03:0 "Nỗ lực giao tiếp lần này hoàn toàn vô nghĩa, và nên được chấm dứt ngay lập tức."
 MACHINE_ISOLATIONIST_GREETING_04:0 "Hiện tại, bên ngoài biên giới của [Root.GetName] không có mục tiêu nào đáng để chúng tôi theo đuổi. Đừng làm phiền chúng tôi."

 HIVE_EXPANSIONIST_GREETING_01:0 "[Root.GetName] bắt buộc phải phát triển."
 HIVE_EXPANSIONIST_GREETING_02:0 "Chúng tôi sẽ mở rộng những ảnh hưởng được mang lại bởi ý chí của ý thức tổ đàn đến những hành tinh khác."
 HIVE_EXPANSIONIST_GREETING_03:0 "Phạm vi thế lực của chúng tôi đang được mở rộng một cách nhanh chóng."
 HIVE_EXPANSIONIST_GREETING_04:0 "Chúng tôi bắt buộc phải bành trướng, không có sự lựa chọn nào khác."
 MACHINE_EXPANSIONIST_GREETING_01:0 "Sự tăng trưởng theo cấp số nhân là một khía cạnh then chốt trong quá trình hiện thực hóa mục tiêu của chúng tôi."
 MACHINE_EXPANSIONIST_GREETING_02:0 "Những hành tinh khác bắt buộc phải được định cư và tích hợp vào [Root.GetName]."
 MACHINE_EXPANSIONIST_GREETING_03:0 "Chúng tôi vẫn chưa kiểm soát được đủ số lượng hệ sao."
 MACHINE_EXPANSIONIST_GREETING_04:0 "Xin đừng cản trở việc mở rộng lãnh thổ của chúng tôi. Điều này có liên quan đến sự sống còn của chúng tôi."

 challenge_type_arena_combat_desc:0 "Phương thức hợp lý duy nhất để quyết định xem ai sẽ là người lãnh đạo liên bang của chúng ta là để những người cai trị của tất cả các quốc gia thành viên đấu tay đôi với nhau trong một đấu trường khổng lồ cho đến chết. Kẻ sống sót cuối cùng sẽ giành được chiến thắng.\n\n§YChiến thắng sẽ được quyết định bởi:\n—Kỹ năng lãnh đạo và đặc điểm giống loài của người cai trị\n—Hệ tư tưởng và ý thức hệ quốc gia của đế chế§!\n\n§RÝ thức hệ Gestalt không có người cai trị để tham gia, nên đành phải bỏ cuộc.§!"
 challenge_type_psionic_battle_desc:0 "Việc ai sẽ là người lãnh đạo liên bang của chúng ta là một vấn đề vô cùng trọng đại, không nên bị giới hạn bởi những định kiến thông thường trong thế giới vật chất. Mỗi đế chế sẽ cử ra những nhà ngoại cảm mạnh mẽ nhất của mình để chiến đấu với nhau, trận chiến khốc liệt này sẽ tạm thời xé nát kết cấu của chính hiện thực.\n\n§YChiến thắng sẽ được quyết định bởi:\n—Số lượng dân số sở hữu đặc điểm ngoại cảm\n—Số lượng dân số đang làm việc tại vị trí chuyên gia ngoại cảm\n—Lượng cung cấp Zro§!\n\n§RNhững đế chế không có dân số ngoại cảm sẽ không thể tham gia, nên đành phải bỏ cuộc.§!"
 challenge_type_bidding_war_desc:1 "Mọi kỳ quan của tất cả các nền văn minh tiên tiến suy cho cùng đều bắt nguồn từ một khái niệm cốt lõi: Nguồn tài nguyên khổng lồ. Vì vậy, tính chính danh của việc cai trị không nên được đong đếm bằng trí tuệ hay sức mạnh cơ bắp, mà phải được đo lường bằng độ sâu của hầu bao.\n\n§YChiến thắng sẽ được quyết định bởi:\n-Số lượng Năng lượng (£energy£) khả dụng.\n-Số lượng Năng lượng (£energy£) đã tiêu hao.§!\n\n§HToàn bộ số tiền đấu thầu sẽ được gom chung vào một tài khoản chuyển khoản. Cuối cùng, mục đích sử dụng của toàn bộ số tiền này sẽ do người chiến thắng quyết định.§!"
 challenge_type_thesis_desc:0 "Trọng trách lãnh đạo tuyệt đối không được giao phó cho những kẻ ngu dốt hoặc vô dụng. Thay vào đó, chúng ta chọn cách áp dụng một bài kiểm tra mang tính khoa học: Thông qua một cuộc đánh giá công khai, trí tuệ và sự nhạy bén của các nhà lãnh đạo hay các đế chế sẽ được phơi bày trước mắt công chúng, mỗi nhà lãnh đạo sẽ phải trải qua một bài kiểm tra thông qua việc nghiên cứu các vấn đề mà liên bang của chúng ta đang phải đối mặt trong thời gian gần đây.\n\n§YChiến thắng sẽ được quyết định bởi:\n—Kỹ năng lãnh đạo của người cai trị và các đặc điểm của nhà khoa học\n—Cấp độ công nghệ§!\n\n§HMỗi bài luận văn sẽ được xét duyệt trong vòng 60 ngày§!\n\n§RTrong quá trình đánh giá, những quốc gia không có người cai trị hoặc ít nhất một nhà khoa học sẽ bị mất quyền tư cách tham gia§!"
 requires_psionic_pops:0 "Bắt buộc phải có ít nhất một quốc gia thành viên sở hữu một đơn vị £pop£§HDân số§! mang đặc điểm §Y$trait_psionic$§! hoặc §Y$trait_latent_psionic$§!."
 challenge_type_conclave_desc:0 "Sự trong sạch của tâm hồn và sự theo đuổi những giá trị truyền thống nên trở thành tiêu chí cốt lõi trong việc lựa chọn nhà lãnh đạo của chúng ta. Chỉ có những người được thần linh che chở nhiều nhất mới có đủ tư cách để dẫn dắt chúng ta.\n\n§YChiến thắng sẽ được quyết định bởi:\n- Tỷ lệ dân số làm việc tại vị trí $job_priest_plural$ hoặc các vị trí duy tâm khác\n- Khoản đầu tư Điểm Gắn kết (Các truyền thống, thăng thiên thuộc địa và dự trữ khả dụng)§!\n\n§HMỗi bài luận văn sẽ được xét duyệt trong vòng 60 ngày.§!\n\n§RTrong quá trình đánh giá, những quốc gia không có người cai trị hoặc ít nhất một nhà khoa học sẽ bị mất quyền tư cách tham gia.§!"

 origin.205.desc:0 "Gửi những [Root.GetSpeciesNamePlural] yêu dấu. Cũng như bao lần trước, chúng tôi vẫn luôn duy trì việc theo dõi các bạn, và một trong những nhà lãnh đạo của các bạn đã thu hút sự chú ý của chúng tôi. Trên thực tế, danh tiếng của vị [desired_leader.GetTitle], §H[desired_leader.GetName]§! của các bạn đã vang vọng đến tận thủ đô của chúng tôi.\n\nXét đến những kỹ năng xuất chúng của [desired_leader.GetHerHis], chúng tôi muốn mời ông ấy đến [scion_master.Capital.GetName] để đảm nhận một vị trí lâu dài. Có thể nói rằng, đây là một vinh dự vô cùng to lớn. Vui lòng nhanh chóng sắp xếp thủ tục điều chuyển công tác cho [desired_leader.GetHerHis]."
 origin.205.a:0 "Đây là việc nên làm."
 origin.205.a.tooltip:0 "§H[desired_leader.GetName]§! đã gia nhập §H[scion_master.GetName]§!"
 origin.205.a.response:0 "Tuyệt vời. Chúng tôi đang rất mong đợi sự xuất hiện của [desired_leader.GetHerHis]. Xin đừng lo lắng, [desired_leader.GetSheHe] sẽ được tận hưởng mọi thứ mà một sinh vật có trí tuệ có thể khao khát trên [scion_master.Capital.GetName]."
 origin.205.b:0 "Không được, vị lãnh đạo này phải ở lại với chúng tôi."
 origin.205.b.response:0 "Các người, các người dám từ chối vinh dự to lớn này sao? E rằng đây sẽ là một sự sỉ nhục cực kỳ lớn đối với vị [desired_leader.GetTitle] của các người đấy, [Root.GetSpeciesNamePlural]."

 origin.210.desc:0 "Xin chào, [Root.GetSpeciesNamePlural]. Trên [scion_master.Capital.GetName] hiện đang có một [scion_master.GetSpeciesName] vô cùng lập dị, hắn ta tuyên bố rằng bản thân đã cảm thấy mất kiên nhẫn đối với cuộc sống trong [scion_master.GetName] - hay thậm chí có thể nói là chán ngấy! Tên ngạo mạn này đang muốn tìm kiếm một thử thách trong một nền văn minh kém phát triển hơn trong dải ngân hà - theo như lời hắn nói là vậy.\n\nCác bạn có thể nhận [scion_master.GetSpeciesName] này về từ chúng tôi không, [Root.GetSpeciesNamePlural]? Hãy cứ coi như là chúng tôi đang nợ các bạn một ân tình. Dựa vào hồ sơ năng lực của hắn ta, tôi không hề nghi ngờ rằng hắn sẽ có một màn thể hiện vô cùng xuất sắc trong vị trí lãnh đạo của các bạn, nhưng các bạn có thể sẽ phải chịu đựng những hành vi thất thường và bốc đồng của hắn đấy."
 origin.210.a:0 "Đương nhiên rồi."
 origin.210.a.response:0 "Cảm ơn các bạn. Chúng tôi biết ngay rằng có thể tin tưởng [Root.GetName] mà."
 origin.210.b:0 "Chúng tôi hiện không có vị trí nào trống, rất xin lỗi."
 origin.210.b.response:0 "Tôi hiểu rồi. Thật đáng thất vọng. Có lẽ việc chúng tôi trình bày như thể đây là một lời thỉnh cầu quả thực là một sai lầm."
 origin.210.admiral:0 "Một §HChỉ Huy Khởi Hành§! [scion_master.GetSpeciesName] đã gia nhập [Root.GetName]."
 origin.210.official:1 "Một §H$official$§! [scion_master.GetSpeciesName] đã gia nhập [Root.GetName]."
 origin.210.scientist:0 "Một §HQuan Khoa Học§! [scion_master.GetSpeciesName] đã gia nhập [Root.GetName]."
 origin.210.general:0 "Một §HTướng Quân Lục Quân§! [scion_master.GetSpeciesName] đã gia nhập [Root.GetName]."
 scion_leader_desc: "Là một vị khách quý đến từ một đế chế cổ đại và đang ngủ say, vị học giả uyên bác nhưng không an phận này đang tìm kiếm những thách thức mới trong một ngân hà đang trên đà phát triển."
 scion_leader_catch_phrase: "§L\"Trời ạ, quả là một nơi nhỏ bé với những phong tục tập quán mộc mạc và quyến rũ. Hãy đến đây, biển sao bao la, hãy nuôi dưỡng nguồn cảm hứng tuôn trào của ta.\"§!"
 leader_trait_ancient_knowledge: "Kiến thức Cổ đại"
 leader_trait_ancient_knowledge_desc: "Vị lãnh đạo này đã lĩnh hội được những kiến thức uyên thâm được tích lũy từ nhiều thế kỷ trước khi có bất kỳ nền văn minh nào bắt đầu thấu hiểu về không gian vũ trụ."

 origin.215.desc:0 "[Root.GetSpeciesNamePlural], gần đây chúng tôi đã phát hiện ra một số tàu không gian dư thừa và không còn giá trị sử dụng. Ban đầu chúng tôi dự định sẽ ném chúng vào ngôi sao gần nhất, nhưng rồi chúng tôi đột nhiên nhớ đến các bạn, những hậu duệ yêu quý của chúng tôi.\n\nĐây đều là những con tàu cũ kỹ - một số trong đó thậm chí còn già cỗi hơn cả toàn bộ nền văn minh của các bạn - nhưng các bạn sẽ nhận ra rằng chúng vẫn còn chứa đựng những tiềm năng vô cùng lớn. Hãy nhận lấy đi, đừng khách sáo."
 origin.215.a:0 "Cảm ơn các ngài."
 origin.215.tooltip:0 "Một hạm đội tàu không gian nhỏ bé của [scion_master.GetSpeciesName] đã gia nhập [Root.GetName]."

 origin.220.desc: "Những [Root.GetSpeciesNamePlural] yêu dấu... Các bạn có thể cố gắng hơn một chút được không? Những con tàu của các bạn quá đỗi lạc hậu, sự chậm chạp này thực sự khiến người ta cảm thấy phát ốm.\n\nHãy đưa cuốn sổ tay hướng dẫn về những động cơ này cho các [root.GetScientistPlural] của các bạn xem đi. Đừng khách sáo."
 origin.220.a: "Không vấn đề gì, cảm ơn các ngài."

 origin.225.desc: "Xin chào, [Root.GetSpeciesNamePlural]! Các bạn có cảm thấy hài lòng với những nỗ lực của mình không? Thật là tuyệt vời.\n\nCác bạn đã làm rất... được, nhưng chúng tôi vẫn hy vọng các bạn có thể tiếp tục cố gắng hơn nữa. Vẫn còn rất nhiều vùng đất trong dải ngân hà đang chờ được sáp nhập, vậy mà các bạn lại tự mãn với những gì mình đang có như vậy sao!\n\nĐừng lo lắng, bởi vì chúng tôi đã chuẩn bị sẵn một gói hàng cứu trợ cho các bạn rồi. Không cần phải cảm ơn đâu, chỉ cần sử dụng nó một cách hiệu quả cho thuộc địa mới là được."
 origin.225.b: "Chúng tôi hiện tại không thể làm được."
 origin.226.desc.A: "Chậc, hãy hành động đi [Root.GetSpeciesNamePlural]! Đừng dễ dàng chấp nhận thất bại như vậy. Các bạn chỉ cần di chuyển đến đó, rồi tự xây dựng một quê hương mới là xong.\n\nNhanh lên, hành động đi."
 origin.226.desc.B: "[Root.GetSpeciesNamePlural], có vẻ như thiết bị liên lạc của các bạn đã bị hỏng rồi. Chúng tôi liên tục nhận được những lời lẽ chán nản và vô ơn của các bạn. Các bạn có thể ngoan ngoãn sửa đổi có được không?"

 origin.29.desc:0 "Lũ chó đẻ xảo trá. Bây giờ chúng tôi sẽ đòi lại hạm đội của mình."
 origin.29.a:0 "Cuối cùng thì chúng ta cũng được tự do!"

 origin.51.desc:0 "Những [Root.GetSpeciesNamePlural] yêu dấu của tôi... Chúng tôi nên làm gì với các bạn bây giờ? Chúng tôi đã từng đặt rất nhiều kỳ vọng vào các bạn, thế nhưng các bạn lại đang ở đây, lãng phí tiềm năng của mình vì một cuộc chiến vô nghĩa, và có vẻ như các bạn đang trên đà thua cuộc trong cuộc chiến này. Rất nhiều người trên [scion_master.Capital.GetName] cho rằng chúng tôi nên cắt đứt quan hệ ngoại giao với các bạn, nhưng điều đó cũng đồng nghĩa với việc chúng tôi thừa nhận sai lầm của mình, suy cho cùng thì chúng tôi cũng đã đầu tư không ít kinh phí phát triển vào cái giống loài đặc biệt như các bạn.\n\nMột hạm đội viễn chinh nhỏ bé của [scion_master.GetSpeciesName] đã được giao cho các bạn chỉ huy. Hãy sử dụng nó để kết thúc cuộc chiến - tốt nhất là đừng để dẫn đến kết cục là các bạn bị diệt vong. Đừng tốn quá nhiều thời gian. Chúng tôi rất mong được nhìn thấy hạm đội này trở về. Và hãy nhớ kỹ, đừng để bọn họ bị tiêu diệt toàn bộ!"
 origin.51.a:0 "Cảm ơn... Chúng tôi sẽ sử dụng bọn họ một cách hiệu quả."
 origin.52.name:1 "Hạm Đội Viễn Chinh [fe_species.GetAdj] Đã Bị Tiêu Diệt" # Fallen Empire species
 origin.52.desc:0 "Hạm đội viễn chinh mà [scion_master.GetName] cho chúng ta mượn đã bị tiêu diệt. Có lẽ điều này sẽ khiến họ cảm thấy không vui..."
 origin.53.desc:0 "Hạm đội của chúng tôi đang ở đâu, [Root.GetSpeciesNamePlural]? Chúng tôi đã cho các bạn mượn hạm đội để chấm dứt cuộc chiến tranh ngu ngốc đó. Bây giờ nó đang ở đâu? Đừng có giả vờ ngu ngốc nữa!\n\n§RHãy trả lại hạm đội cho chúng tôi!§!"
 origin.53.a:0 "Trời ạ, nó không còn tồn tại nữa rồi..."
 origin.54.desc:0 "[Root.GetSpeciesNamePlural]... Người cung cấp thông tin của chúng tôi cho biết cuộc chiến mà các bạn tham gia đã kết thúc. Nếu các bạn vẫn còn đứng ở đây, thì chắc chắn là các bạn đã không bị tiêu diệt hoàn toàn.\n\nBây giờ chúng tôi muốn đưa hạm đội của mình trở về. Vui lòng hạn chế tối đa các cuộc tranh chấp quân sự mà không thể giành được chiến thắng trong tương lai."
 origin.54.a:0 "Chúng tôi... chúng tôi sẽ làm như vậy. Cảm ơn các ngài!"

