 origin_demonic_incursion:0 "Ác quỷ Xâm lược"
 origin_demonic_incursion_desc:0 "Dưới sự dẫn dắt của một kẻ tiên phong tha hóa, đế chế này trào ra từ một cổng không gian, quyết tâm tiêu diệt chiều không gian này."
 origin_khan_successor:0 "Kẻ Kế thừa của Khả Hãn"
 origin_khan_successor_desc:0 "Nền văn minh này trỗi dậy từ tàn tro đế chế vĩ đại của Đại Khả Hãn."
 has_claimed_all_systems:0 "£trigger_no£ Khi chúng ta đã tuyên bố chủ quyền đối với toàn bộ các hệ sao có người định cư của họ, chúng ta không thể sử dụng mục tiêu chiến tranh này, bởi vì chiến thắng trong cuộc chiến sẽ dẫn đến việc thôn tính họ hoàn toàn."
 fedev.500.name:0 "Một Liên Bang Hoàn Toàn Mới"
 fedev.500.intro:0 "Hãy để lịch sử khắc ghi ngày hôm nay, chính phủ của §H[fed_founder_1.GetName]§! và §H[fed_founder_2.GetName]§! đã ký kết một hiệp ước liên bang, với tư cách là những người đồng sáng lập của §H[Root.GetAllianceName]§!, họ sẽ sát cánh bên nhau để đối mặt với tương lai."
 fedev.500.a.desc:0 "$fedev.500.intro$\n\nHiệp Hội Thiên Hà mới này sẽ là tấm gương sáng ngời cho phần còn lại của thiên hà thấy được những gì có thể đạt được khi kề vai hợp tác.\n\nMột kỷ nguyên mới của ngoại giao liên sao đã chính thức mở ra!"
 fedev.500.b.desc:0 "$fedev.500.intro$\n\nLiên Bang Thương Mại mới này chắc chắn sẽ mang lại phồn vinh kinh tế cho tất cả các quốc gia thành viên.\n\nMột kỷ nguyên mới của thương mại liên sao đã chính thức mở ra!"
 fedev.500.c.desc:0 "$fedev.500.intro$\n\nLiên Bang Nghiên Cứu này sẽ mang đến cho các nhà khoa học của toàn thể quốc gia thành viên cơ hội mới để quy tụ và cộng hưởng tri thức.\n\nMột kỷ nguyên mới của tiến bộ công nghệ đã chính thức mở ra!"
 fedev.500.d.desc:0 "$fedev.500.intro$\n\nSức mạnh kết hợp của Liên Bang Quân Sự này chắc chắn sẽ khiến bất kỳ kẻ nào dòm ngó lãnh thổ của các quốc gia thành viên phải chùn bước.\n\nMột kỷ nguyên mới của uy quyền quân sự đã chính thức mở ra!"
 fedev.500.e.desc:0 "$fedev.500.intro$\n\nLiên Bang Bá Quyền vĩ đại này sẽ đảm bảo an nguy cho các thành viên phụ thuộc dưới sự dẫn dắt sáng suốt của Bá Chủ cai trị.\n\nMột kỷ nguyên thống trị mới của [fed_founder_1.GetSpeciesName] đã chính thức mở ra!"
 fedev.500.a:0 "Một ngày vĩ đại."

