 ################
 ### Events
 ################

 origin.3003.name:0 "Cây Sự sống đã bị Phá hủy!"
 origin.3003.desc:0 "Các cuộc ném bom liên tục trên [planet.GetName] đã phá hủy kết nối của chúng ta với mạng lưới Cây Sự sống."
 origin.3100.name:1 "Phát hiện Kho Tàng trữ"
 origin.3100.desc:2 "Trong quá trình dọn dẹp các mảnh vỡ trên [from.GetName], chúng ta đã phát hiện ra một kho tàng trữ công nghệ có từ thời kỳ tiền đế chế của chúng ta. Chỉ cần tiến hành một vài nghiên cứu nhỏ là có thể tích hợp lại khối kiến thức này vào hệ thống công nghệ hiện tại của chúng ta."
 origin.3101.name:0 "Tàn tích Thuộc địa"
 origin.3101.desc:0 "[planet.GetName] đã từng là một thuộc địa quan trọng của [owner.GetName], và một vài cơ sở hạ tầng còn sót lại của nó vẫn có thể được sử dụng làm nền tảng để tái định cư hành tinh này."

 progress.3.desc_lith:0 "Sự xuất hiện của chúng ta đối với [planet.GetName] chẳng khác nào một thảm họa tàn khốc. Một đợt sóng xung kích khổng lồ đã quét qua lục địa không có sự sống này, và do hàng triệu tấn mảnh vỡ bị hất tung lên bầu khí quyển, khả năng sinh sống của [planet.GetName] đã sụt giảm đáng kể. Những người định cư của chúng ta - hiện đang được bao bọc an toàn bên trong lõi đá của các thiên thạch - sẽ sớm bước ra khỏi nơi trú ẩn và bắt đầu lắp đặt các cơ sở hạ tầng thuộc địa đúc sẵn."

 ################
 ### Decisions
 ################

 decision_transplant_tree:0 "Cấy ghép Cây Sự sống"
 decision_transplant_tree_desc:0 "Để đảm bảo tổ đàn của chúng ta có thể sinh sôi nảy nở ở đây, một mạng lưới Cây Sự sống phải được thiết lập."
 decision_shattered_ring_project:0 "Sửa chữa Thế giới Vành đai Vỡ nát"
 decision_shattered_ring_project_desc:0 "Đoạn vành đai này đã bị vỡ nát từ vô số năm về trước, và giờ chính là thời điểm thích hợp để sửa chữa nó. Chúng ta sẽ khôi phục lại các cơ sở vật chất tiên tiến của đoạn vành đai này."
 decision_shattered_ring_project_effects:0 "Biến $pc_shattered_ring_habitable$ thành §Y$pc_ringworld_habitable$§!, mở khóa £district£§YQuy hoạch Phân khu§! đặc biệt"
 decision_shattered_ring_project_interloper: "Loại bỏ Kẻ Đột nhập"
 decision_shattered_ring_project_interloper_desc: "Những vị khách không mời từng phá hủy thế giới vành đai hoàn mỹ của chúng ta, giờ đây đã có thể được chúng ta sử dụng để sửa chữa các cấu trúc khổng lồ."
 decision_shattered_ring_project_interloper_effects: "Việc loại bỏ §YKẻ Đột nhập§! sẽ biến §Y$NAME_Irreparable_Damage$§! thành một đoạn §Y$pc_ringworld_habitable$§!"

