 resolution_community_champions:0 "Tiên phong Cộng đồng"
 resolution_community_champions_desc:0 "Những nhà lãnh đạo Cộng đồng mà chúng ta tin tưởng cũng chính là những ứng cử viên sáng giá nhất cho vai trò người bảo vệ kiên định nhất của Cộng đồng. Bằng cách trao cho họ nhiều quyền lực và nguồn lực hơn, họ sẽ có thể bảo vệ tất cả chúng ta."
 resolution_community_champions_tooltip:0 "Thành viên Hội đồng nhận được §G+10%§! Sức chứa Hải quân.\nNgười giám hộ Ngân hà nhận được §G20%§! Sức chứa Hải quân.\nHoàng đế Ngân hà nhận được §G25%§! Sức chứa Hải quân.\nCác thành viên khác trong Cộng đồng bị giảm §R5%§! Sức chứa Hải quân."
 resolution_constitutional_immunity:0 "Miễn trừ Hiến pháp"
 resolution_constitutional_immunity_desc:0 "Đôi khi bạn cần một bàn tay nhuốm bẩn để làm những việc tốt đẹp. Chúng ta nên dành sự tôn trọng cho những người đã hy sinh đạo đức của bản thân để giúp chúng ta có được một cuộc sống thoải mái hơn, và hãy bảo vệ họ khỏi sự chỉ trích."
 resolution_constitutional_immunity_tooltip:0 "Đế chế được chỉ định sẽ không bị coi là vi phạm Luật Thiên Hà trong bất kỳ trường hợp nào."
 immunity_already_active:0 "$TRIGGER_FAIL$Một đế chế khác đã có được quyền miễn trừ hiến pháp."
 resolution_development_aides:0 "Viện trợ Phát triển"
 resolution_development_aides_desc:0 "Những người có nhiều đặc quyền nhất trong số chúng ta nên có trách nhiệm đạo đức trong việc giúp đỡ người khác. Họ sẽ chia sẻ gánh nặng với chúng ta, và dẫn dắt chúng ta xây dựng một Cộng đồng hài hòa hơn."
 resolution_development_aides_tooltip:0 "Hội đồng nhận được §G+20%§! £diplo_weight£Trọng lượng Ngoại giao nhưng bị giảm §R15%§! sản lượng £energy£Năng lượng, £minerals£Khoáng sản và £food£Thức ăn. Các thành viên khác trong Cộng đồng sẽ bị giảm §R20%§! £diplo_weight£Trọng lượng Ngoại giao nhưng nhận được thêm §G5%§! thu nhập £energy£Năng lượng, £minerals£Khoáng sản và £food£Thức ăn."
 unstable_economy:0 "Đế chế này hiện đang phải đối mặt với tình trạng thâm hụt."
 development_aides_counselor:0 "$resolution_development_aides$"
 development_aides_regular:0 "$resolution_development_aides$"
 resolution_galactic_threats_committee:0 "Ủy ban Mối đe dọa Ngân hà"
 resolution_galactic_threats_committee_desc:0 "Ai dám khẳng định rằng bên ngoài phạm vi của các máy dò của chúng ta không có những mối đe dọa đang rục rịch hành động? Việc thành lập một ủy ban chuyên nghiên cứu các mối đe dọa cấp ngân hà sẽ giúp chúng ta chuẩn bị sẵn sàng để đối mặt với mọi thứ."
 resolution_galactic_threats_committee_modifier_desc:0 "Sát thương gây ra cho phe Khủng hoảng Cuối Cùng: §G+20%§!\n§R+10%§! Phí duy trì cho Nhà nghiên cứu.\n§RNhững thử nghiệm nguy hiểm có thể sẽ mang lại những hậu quả nguy hiểm.§!"
