 resolution_industry_repeal_5:0 "§RBãi bỏ $resolution_industry_project_cornucopia$§!"
 resolution_industry_repeal_5_desc:0 "$resolution_industry_repeal_1_desc$"
 resolution_industry_repeal_5_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_industry_project_cornucopia$§!, biến §Y$resolution_industry_environmental_ordinance_waivers$§! trở thành Luật Thiên Hà."

 resolution_industry_regulatory_facilitation:0 "Tạo điều kiện Quy định"
 resolution_industry_regulatory_facilitation_desc:0 "Chúng ta nên giao các vấn đề về quy định cho các chuyên gia quyết định. Những nhà lãnh đạo công nghiệp là những người có đủ năng lực và trình độ nhất để xác định được những quy định kém hiệu quả đang cản trở năng suất."

 resolution_industry_collective_waste_management:0 "Quản lý Chất thải Tập trung"
 resolution_industry_collective_waste_management_desc:0 "Thay vì ép buộc mỗi nhà máy phải tự chịu trách nhiệm xử lý chất thải do mình tạo ra, tốt hơn hết là chỉ định các khu vực cụ thể để lưu trữ chất thải phát sinh trong quá trình phát triển của chúng ta."

 resolution_industry_building_a_better_tomorrow:0 "Xây dựng Ngày mai Tốt đẹp hơn"
 resolution_industry_building_a_better_tomorrow_desc:0 "Sự phát triển là ưu tiên hàng đầu và tuyệt đối không thể bị bất kỳ trở ngại nào cản bước. Hãy cùng nhau chia sẻ công nghệ để khai thác và chi phối thế giới tự nhiên một cách tốt hơn."

 resolution_industry_environmental_ordinance_waivers:0 "Miễn trừ Pháp lệnh Môi trường"
 resolution_industry_environmental_ordinance_waivers_desc:1 "[global_event_country.GetGalCommunityOrGalImperium] nên ủy quyền cho các hội đồng địa phương ngừng thi hành những quy định lỗi thời không còn mang lại lợi ích cho công chúng và đang cản trở sự phát triển."
 resolution_industry_environmental_ordinance_waivers_tooltip:0 "Các loại quy hoạch hành tinh liên quan đến Lò đúc, Công nghiệp và Tinh luyện sẽ nhận được các phần thưởng bổ sung."

 resolution_industry_project_cornucopia:0 "Dự án Dồi dào"
 resolution_industry_project_cornucopia_desc:0 "Chỉ cần chúng ta dám dấn thân, những kho báu vô tận sẽ nằm trong tầm tay. Chỉ cần chinh phục được nỗi sợ hãi trong lòng, chúng ta có thể tạo ra những phép màu to lớn."
 resolution_industry_project_cornucopia_tooltip:0 "Mở khóa một §HQuyết định Hành tinh§!, cho phép khai thác lộ thiên trên hành tinh để tìm kiếm các nguồn tài nguyên khoáng sản phong phú."

 decision_project_cornucopia:0 "$resolution_industry_project_cornucopia$"
 decision_project_cornucopia_desc:0 "$resolution_industry_project_cornucopia_desc$"
 decision_project_cornucopia_effects_short:0 "Khai thác lộ thiên hành tinh này, nhận được §G+4§! §Y$district_mining_plural$§!, §G+5%§! §Y$mod_planet_jobs_minerals_produces_mult$§!, nhưng §R-20%§! §Y$pop_habitability$§!."
 d_project_cornucopia:0 "$resolution_industry_project_cornucopia$"
 d_project_cornucopia_desc:0 "Hoạt động khai thác lộ thiên cường độ cao khiến cho hành tinh này khó có thể sinh sống... nhưng lại dễ dàng khai thác hơn."

 federations.10000.name:0 "$resolution_industry_project_cornucopia$"
 federations.10000.desc:1 "Các kỹ sư trên toàn [global_event_country.GetGalCommunityOrGalImperium] đã tề tựu lại, thoải mái thảo luận về cách sử dụng hiệu quả hơn các nguồn tài nguyên trên hành tinh của chúng ta.\n\nQuyết định Hành tinh §HDự án Dồi dào§! hiện đã khả dụng."

 # Commerce
 resolution_category_commerce:0 "Thương mại Ngân hà"

 resolution_commerce_repeal_1:0 "§RBãi bỏ $resolution_commerce_buzzword_standardization$§!"
 resolution_commerce_repeal_1_desc:1 "Thị trường tự do nên giữ được mức độ tự do tối đa, không nên bị can thiệp bởi [global_event_country.GetGalCommunityOrGalImperium]."
 resolution_commerce_repeal_1_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_commerce_buzzword_standardization$§!."

 resolution_commerce_repeal_2:0 "§RBãi bỏ $resolution_commerce_leveraged_privateering$§!"
