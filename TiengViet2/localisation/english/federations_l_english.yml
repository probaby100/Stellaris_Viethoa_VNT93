 CURRENT_TERM_ENDS:0 "Nhiệm kỳ hiện tại kết thúc vào: $DATE|Y$"

 #Thesis Defense
 fedel.1501.name:0 "Ủy Ban Liên Bang Đã Được Thành Lập"
 fedel.1501.desc:0 "Một ủy ban công bằng gồm các nhà khoa học và nhà tư tưởng đang tập trung tại tòa án nội bộ liên bang của chúng ta. Họ muốn cung cấp trọng tài học thuật cho [root.GetAllianceName] trong bài kiểm tra năng lực lãnh đạo sắp tới của chúng ta.\n\nMỗi đế chế hiện có thể tập hợp một nhóm để nghiên cứu vấn đề này, và kết quả của nghiên cứu này sẽ mang lại tác động tích cực cho liên bang của chúng ta. Đội ngũ này sẽ công bố kết quả của họ trên một diễn đàn thảo luận công khai. Bất kể luận án nào đạt điểm cao nhất về tính đổi mới, sự chặt chẽ về mặt khoa học và tính mạch lạc, đế chế tác giả của nó sẽ giành được quyền lãnh đạo trong nhiệm kỳ tiếp theo."
 fedel.1501.desc.subject:0 "$fedel.1501.desc$\n\nThật không may, bởi vì chúng ta không phải là một quốc gia độc lập, chúng ta đã bị cấm tham gia, vì chúng ta không đủ tư cách để lãnh đạo liên bang."
 fedel.1501.a:0 "Vì khoa học!"
 tooltip_thesis_begin:0 "Thử thách luận án sắp sửa bắt đầu."
 fedel.1506.name:0 "Luận Án Đã Được Chọn"
 fedel.1506.win.desc:0 "Ủy ban Liên bang đã công nhận giá trị cốt lõi từ nghiên cứu của chúng ta về §H[winning_thesis.GetThesisTopic]§!, và trao cho §Y[ruler.GetTitle] [ruler.GetRegnalName]§! quyền lãnh đạo trong nhiệm kỳ tới. Mọi người đang gửi lời chúc mừng đến [ruler.GetTitle] cùng nhóm nghiên cứu của [ruler.GetHerHis]."
 fedel.1506.win.autocracy.desc:0 "Ủy ban Liên bang đã công nhận nghiên cứu do §Y[ruler.GetTitle] [ruler.GetRegnalName]§! lãnh đạo và những lập luận đáng tin cậy của nó về §H[winning_thesis.GetThesisTopic]§!. Sự dẫn dắt của [ruler.GetSheHeCap] trong nhiệm kỳ tới chắc chắn sẽ vô cùng thành công."
 fedel.1506.win.gestalt.desc:0 "Ủy ban Liên bang đã công nhận giá trị của nghiên cứu tổng hợp của chúng ta về §H[winning_thesis.GetThesisTopic]§!. Bọn họ đã trao cho chúng ta quyền lãnh đạo [root.GetAllianceName] trong nhiệm kỳ tiếp theo."
 fedel.1506.fail.desc:0 "Ủy ban Liên bang đã phớt lờ bài luận văn mà chúng ta đã nộp, và lại ưu ái một nghiên cứu sáo rỗng về §H[winning_thesis.GetThesisTopic]§! đến từ [winning_thesis.GetName]. Bản thân nền khoa học hẳn sẽ phải than khóc cho sự đánh mất lý trí này. Trong khi đó, §Y[winning_thesis.GetName]§! đã chắc chắn giành được quyền lãnh đạo trong [root.GetAllianceName]."
 fedel.1506.fail.gestalt.desc:0 "Ủy ban Liên bang đã phạm phải hàng loạt sai lầm khi hấp tấp lựa chọn luận án của §Y[winning_thesis.GetName]§! thay vì của chúng ta. Nghiên cứu về §H[winning_thesis.GetThesisTopic]§! bằng một cách nào đó đã mang về cho [winning_thesis.ruler.GetTitle] [winning_thesis.ruler.GetRegnalName] quyền lãnh đạo trong nhiệm kỳ tới."
 fedel.1506.insufficient.desc:0 "Trong lúc chúng ta vắng mặt tại cuộc thi này, Ủy ban Liên bang đã chọn ra đề tài chiến thắng. §Y[winning_thesis.GetName]§! đã được trao quyền lãnh đạo trong nhiệm kỳ tiếp theo nhờ vào nghiên cứu của họ về §H[winning_thesis.GetThesisTopic]§!. Chất lượng của cuộc thi lần này khá thấp, nếu đội nghiên cứu của chúng ta tham gia thì rất có thể đã bước lên bục vinh quang."
 tooltip_thesis_won:0 "Chúng ta sẽ lãnh đạo [Root.GetAllianceName] trong nhiệm kỳ tới."
 tooltip_thesis_lost:0 "Chúng ta không thể duy trì vị thế lãnh đạo trong [Root.GetAllianceName]. §Y[winning_thesis.GetName]§! sẽ thay thế chúng ta."
 fedel.1506.a:0 "Ta nhất định sẽ quay trở lại..."

 # Conclave
 fedel.1805.name:0 "Triệu Tập Mật Viện"
 fedel.1805.desc.base:0 "Đã đến lúc bầu ra một nhà lãnh đạo mới cho [Root.GetAllianceName]. Mật viện gồm những cá nhân thiêng liêng nhất trong liên bang đã tụ họp lại để quyết định xem đế chế nào sẽ trở thành đại diện và nhà lãnh đạo của họ. Bọn họ sẽ tập trung trong một căn phòng bí mật, nơi chứa đựng mọi thông tin cần thiết để đưa ra quyết định.\n\nMặc dù những cuộc thảo luận diễn ra bên trong mật viện được bảo mật ở mức độ cao nhất, nhưng theo như những gì được biết, bọn họ chủ yếu đánh giá những đóng góp của mỗi thành viên trong việc bảo vệ và nâng tầm các giá trị tâm linh và truyền thống, cũng như liệu họ có đạt được những tiến bộ cụ thể nào trong quá trình thăng thiên và siêu việt hay không."
 fedel.1805.desc:0 "$fedel.1805.desc.base$\n\nVà theo thông lệ, vẫn chưa quá muộn để chứng minh sự chân thành trong đức tin của một người."
 fedel.1805.desc.subject:0 "$fedel.1805.desc.base$\n\nThật không may, chúng ta không phải là một quốc gia độc lập, nên không thể tham gia vào cuộc bầu cử chủ tịch liên bang."
 fedel.1805.A:0 "Chúng ta có thể đóng góp một phần nhỏ bé."
 fedel.1805.A.tooltip:0 "Chiến dịch tranh cử của chúng ta sẽ nhận được một phần thưởng nhỏ."
 fedel.1805.B:0 "Hào phóng một chút cũng không sao."
 fedel.1805.B.tooltip:0 "Chiến dịch tranh cử của chúng ta sẽ nhận được một phần thưởng vừa phải."
 fedel.1805.C:0 "Chúng ta sẽ đóng góp một cách hào phóng nhất."
 fedel.1805.C.tooltip:0 "Chiến dịch tranh cử của chúng ta sẽ nhận được một phần thưởng đáng kể."
 fedel.1805.D:0 "Đức hạnh của chúng ta tự nó đã nói lên tất cả."
 fedel.1815.name:0 "Mật Viện: Đang Thẩm Định"
 fedel.1815.desc:0 "Mặc dù chỉ có một vài thông tin vụn vặt bị rò rỉ ra từ quá trình thẩm định riêng tư của mật viện, nhưng theo như những gì được biết, §Y[conclave_frontrunner.GetName]§! hiện đang là ứng cử viên sáng giá nhất. Tuy nhiên, vẫn còn thời gian để nộp thêm đóng góp vào phút chót nhằm nâng cao vị thế ứng cử viên của chúng ta."
 fedel.1815.desc.frontrunner:0 "Mặc dù chỉ có một vài thông tin vụn vặt bị rò rỉ ra từ quá trình thẩm định riêng tư của mật viện, nhưng theo như những gì được biết, chúng ta hiện đang là ứng cử viên sáng giá nhất. Tuy nhiên, những người khác vẫn còn cơ hội để nộp thêm đóng góp vào phút chót nhằm nâng cao vị thế ứng cử viên của họ, chúng ta bắt buộc phải chuẩn bị sẵn sàng cho việc chứng minh sự thành kính của mình vào những thời khắc cuối cùng."
 fedel.1815.E:0 "Có lẽ việc đóng góp bằng một loại tiền tệ khác có thể là một mánh khóe hữu ích."
 fedel.1815.E.tooltip:0 "Khoản hối lộ này có thể sẽ mang lại lợi thế cho chúng ta... nhưng nếu không may, nó cũng có thể mang đến những rắc rối lớn."
 fedel.1825.name:0 "Người Cao Thượng Nhất"
 fedel.1825.desc:0 "Sau một tràng trống dồn dập, một làn sương mỏng từ từ bay ra từ căn phòng kín của mật viện đang dần được mở ra. Một vị đại diện bước lên sân khấu. Toàn bộ hội trường chìm trong im lặng, tĩnh lặng đến mức tất cả mọi người trong [Root.GetAllianceName] đều có thể nghe thấy tiếng một cây kim rơi xuống đất.\n\nHọ tuyên bố, §Y[conclave_winner.GetName]§! đã được chọn làm chủ tịch trong nhiệm kỳ tiếp theo!"
 fedel.1825.A:0 "Chúng ta nhất định sẽ chăn dắt tốt con dân của mình."
 fedel.1825.B:0 "Cầu mong cho họ sẽ lãnh đạo chúng ta một cách xứng đáng."

 ####################################
 # Event Chains
 ####################################

 wenkwort_chain_title:0 "Thế Giới Bảo Tồn"
 wenkwort_chain_desc:0 "Chúng ta đã phát hiện ra một hành tinh xinh đẹp đến khác thường trong hệ sao [from.System.GetName]. Hành tinh này rất thích hợp để thiết lập thuộc địa, nhưng có một vấn đề đáng để suy ngẫm: Ai đã thiết kế ra nó, và tại sao họ lại làm như vậy?"

 federations3.121.name:0 "Xin Đừng Giẫm Đạp"
 federations3.121.desc:0 "Hỡi những vị khách: §YChào mừng đến với $NAME_Wenkwort$§!. Bất kể các bạn đã ngưỡng mộ nơi này từ lâu hay chỉ là khách cũ ghé thăm lại, chúng tôi đều vô cùng sẵn lòng hỗ trợ các bạn trong chuyến đi dạo quanh khu vườn này.\n\nThay mặt cho $NAME_Gardeners$ và căn cứ theo chỉ thị số WAPP-715, xin vui lòng không tự ý xâm nhập vào khu vực sinh học $NAME_wenkwort_prime$ đã được chỉ định. Việc không tuân thủ các hướng dẫn của chúng tôi sẽ làm giảm tỷ lệ sống sót của tất cả những người có liên quan."
 federations3.121.a:0 "Chỉ thị... gì cơ? Ngươi là ai?"
 federations3.121.a.response:0 "Tôi là cỗ máy giám hộ tự động của hệ sao được gọi là [root.System.GetName] này. Tôi đại diện cho lợi ích của $NAME_Gardeners$ tại hệ sao này và tất cả các hệ sao khác trong Đế chế Auron. Nhiệm vụ của tôi về cơ bản là bảo vệ và dẫn dắt mọi thứ xung quanh các bạn.\n\n§YChỉ thị WAPP-715§! giới hạn mức độ công nghiệp hóa trên các hành tinh cấp Akamor như [root.Planet.GetName]. Chỉ có các bạn mới có thể ngăn chặn sự tuyệt chủng sinh học quy mô lớn!"
 federations3.121.b:0 "Đúng là nói nhảm. Chúng ta sẽ phát triển thuộc địa của mình theo cách mà chúng ta cho là phù hợp nhất."
 federations3.121.c:0 "Chúng tôi có thể giúp gì cho bạn?"
 federations3.125.desc:0 "Tuyệt vời! Các nguyên tắc chỉ đạo sẽ ngay lập tức được gửi cho các bạn.\n\nTóm lại: Chỉ thị WAPP-715 cho phép sử dụng các khu vườn của $NAME_Wenkwort$ một cách có trách nhiệm và không gây tính phá hoại. Chúng tôi cực kỳ coi trọng việc bảo tồn các đặc điểm hiện có của những thế giới này, nhưng chúng tôi cũng không muốn bóp nghẹt sự phát triển bên trong <Lỗi: Đèn hiệu của đế chế nằm ngoài phạm vi>.\n\n<Yêu cầu phòng giám sát khẩn cấp cử nhân viên đến tọa độ 19c14a05... thất bại. Thử lại... thất bại. Thử lại... >"
 federations3.130.desc:0 "Thật là đáng thất vọng. Vậy thì cứ thế đi.\n\n<Yêu cầu cơ quan thực thi pháp luật cử nhân viên đến tọa độ—\n<Lỗi: Không thể tìm thấy đèn hiệu của đế chế. Khôi phục lại hệ thống định vị dự phòng... thành công.>\n<Lực lượng thực thi pháp luật đang trên đường đến; dự kiến sẽ đến nơi sau 2 chu kỳ lớn nữa. Tạm ngưng giao thức lịch sự.>"
 federations3.131.name:0 "Nhấn Mạnh Lần Hai"
 federations3.131.desc:0 "Những kẻ xâm nhập: Các ngươi hiện vẫn đang vi phạm rõ ràng §Ychỉ thị WAPP-715§!, chỉ thị yêu cầu các khu vườn của $NAME_Wenkwort$ nằm trên [root.Planet.GetName] phải được sử dụng theo cách không gây tính phá hoại.\n\nĐây là cơ hội cuối cùng của các ngươi, hoặc là đồng ý tuân thủ các nguyên tắc chỉ đạo của chúng tôi, hoặc là ngay lập tức phải đối mặt với sự trừng phạt."
 federations3.131.a:0 "Chúng ta chấp nhận các điều khoản trong chỉ thị của ngươi."
 federations3.131.tooltip:0 "Thêm hệ số §Y$pm_wenkwort_custodian$§! vào [root.GetName]."

 ####################################
 # Anomalies
 ####################################

 SEA_CRYSTAL_CAT:0 "Bảo Vật Trôi Nổi"
 SEA_CRYSTAL_CAT_DESC:0 "Bên dưới đại dương bao la trên bề mặt của [Root.GetName], có một vật thể khổng lồ khác thường đang phát ra những điểm sáng lấp lánh."

 WENKWORT_CAT:0 "Hành Tinh Vườn Tược"
 WENKWORT_CAT_DESC:0 "Hành tinh này sở hữu những cảnh quan đẹp một cách kỳ lạ đến khó tin. Rốt cuộc thì thế lực nào đã nhào nặn ra nó?"
 federations3.115.name:0 "Giải Mã Tín Hiệu"
 federations3.115.desc:0 "Phần lớn cảnh quan trên bề mặt của [From.GetName] quả thực đã được thiết kế thẩm mỹ theo một hình thức nào đó. Các nhà khoa học của chúng ta suy đoán rằng, ngay cả những \"vùng đất hoang sơ\" còn lại trên hành tinh này cũng chỉ được cố tình chạm trắc như vậy nhằm thỏa mãn một mục tiêu làm vườn có quy mô lớn hơn.\n\nTrong quá trình điều tra sâu hơn, chúng ta tình cờ phát hiện ra một đèn hiệu, đây là minh chứng duy nhất cho sự tồn tại của công nghệ trên toàn bộ hành tinh này. Khi được kích hoạt, đèn hiệu này đã tải lên một danh mục bao gồm toàn bộ các giống loài động thực vật trên [From.GetName], cùng với một con trỏ tham chiếu chỉ đến [event_target:wenkwort_rellrait.GetName] nằm ở gần đó. Thế nhưng vẫn không có bất kỳ manh mối nào có thể giúp chúng ta tìm ra những người đã thiết kế nên hành tinh này."

 ####################################
 # Country Events
 ####################################
 federations3.100.name:0 "Bảo Vật Trôi Nổi"
 federations3.100.desc:0 "Thoạt nhìn, mọi thứ trên [From.GetName] đều có vẻ rất bình thường. Mãi cho đến khi một nhà khoa học trên [Root.GetName] tình cờ phát hiện ra một lăng kính khổng lồ đang phản chiếu ánh sáng của các vì sao bên dưới bề mặt thông qua một cuộc quan sát vô tình. Máy quét đã nhanh chóng nhận diện được vật thể này, chiều rộng của nó gần bằng một hòn đảo cỡ trung bình.\n\nDữ liệu đo đạc từ xa của tàu thăm dò cho thấy, các chất hóa học cấu tạo nên lăng kính này có giá trị cực kỳ cao; cấu trúc vật lý của nó có lẽ cũng là độc nhất vô nhị trong toàn bộ dải ngân hà của chúng ta."
 federations3.100.a:0 "Một nguồn tài nguyên hữu ích, giờ nó đã thuộc về chúng ta."
 federations3.100.b:0 "Vẻ đẹp hiếm có của nó sẽ được tất cả mọi người cùng nhau chiêm ngưỡng."

 ####################################
 # Colony Events
 ####################################
 colony_fed.100.name:0 "Vùng Trũng Phi Thực Tế"
 colony_fed.100.desc:1 "Một hiện tượng địa lý bất thường trên [Root.GetName] đã thu hút sự chú ý của chúng ta. Một vùng trũng hình cái bát đột nhiên xuất hiện xung quanh một cơ sở khai thác khoáng sản, và ngay sau đó chúng ta đã tiến hành điều tra về vấn đề này. Đặc điểm của vùng trũng này hầu như chưa từng được tìm thấy ở bất kỳ nơi nào khác ngoài các khu vực sông băng, nhưng điều kỳ lạ là: khi tiếp xúc với một số dải sóng điện từ nhất định, các vách bên của \"vùng trũng tròn\" này sẽ tạo ra sự cộng hưởng, và phát ra những tia sáng tán xạ có hình dạng giống như những cánh hoa có thể nhìn thấy được. Công việc điều tra vẫn đang được tiếp tục."

 colony_fed.105.name:0 "Dự Án Hoa Sen Xanh"
 colony_fed.105.desc:1 "Các nhà khoa học của chúng ta báo cáo rằng, những vật chất kết tinh màu xanh lam mới được phát hiện trên [Root.GetName] này có phản ứng cực kỳ mạnh mẽ đối với việc trì hoãn phản ứng năng lượng photon. Những khoáng chất này đã lọc các bước sóng của photon, và phản xạ lại một chùm tia sáng có khả năng chuyển hóa các hợp chất silicat thông thường thành một loại hợp kim siêu dẫn mới - mặc dù điều này chỉ có thể được thực hiện dưới ánh sáng mặt trời.\n\nBởi vì quá trình này liên quan đến việc phản xạ bức xạ năng lượng cao trong một không gian chật hẹp, một số nhà khoa học đã lên tiếng phản đối. Trong khi đó, một nhóm các nhà nghiên cứu nhiệt huyết khác lại đưa ra những ý kiến trái chiều, họ nhấn mạnh rằng hiện tượng này có thể tạo ra một cuộc cách mạng trong cách chúng ta tinh luyện các kim loại quý. Nhưng dù thế nào đi chăng nữa: Việc tiếp tục phát triển công nghệ này đều sẽ đòi hỏi một sự đầu tư vô cùng lớn."
 colony_fed.105.gestalt.desc:0 "Một máy bay không người lái bị tách đàn đang chạy một chương trình độc lập đã được tìm thấy trong lưu vực trên [Root.GetName]. Được thúc đẩy bởi những chỉ thị ban đầu về việc cải thiện các phương thức luyện kim của chúng ta, nó đã tìm ra một phương pháp có thể chuyển hóa các hợp chất silicat thành một loại hợp kim mới.\n\nQuá trình này dường như liên quan đến việc phản xạ các chùm tia năng lượng cao từ các khoáng chất trên bức tường đặc trưng. Công việc không ngừng nghỉ của máy bay không người lái này dường như đã khiến cho khu vực này bị lấp đầy bởi các bức xạ năng lượng cao. Kết quả là máy bay không người lái này đã bị bắt giữ, và việc liệu nên tích hợp lại nó vào hệ thống hay phá hủy cá thể này để thu thập các kiến thức liên quan vẫn còn chưa được quyết định."
 colony_fed.105.a:0 "Hãy để nó trở lại hệ thống."
 colony_fed.105.b:0 "Hãy xem thử nghiên cứu này sẽ mang lại điều gì."
 colony_fed.105.c:0 "Dừng ngay cuộc thử nghiệm này lại."
 colony_fed.105.d:0 "Phá hủy máy bay không người lái này."

 colony_fed.106.name:0 "Những Người Ủng Hộ Quá Khích"
 colony_fed.106.desc:0 "Trên [Root.GetName] đang hiện lên một khung cảnh đáng tiếc, một nhóm các nhà khoa học quá cuồng tín đã ngang nhiên can thiệp vào giai đoạn cuối cùng của kế hoạch. Bị mê hoặc bởi chính những nghiên cứu của mình, bọn họ đã lấy danh nghĩa \"vì nền khoa học mới\" để cố gắng giành lấy quyền kiểm soát cuộc thử nghiệm chuyển hóa. Vụ ẩu đả diễn ra sau đó đã dẫn đến việc các thiết bị bị hư hỏng, từ đó gây ra một chuỗi phản ứng dây chuyền không thể kiểm soát được.\n\nCuối cùng, thứ còn sót lại trong lưu vực là một cấu trúc gần giống như một tinh hốc: lớp vỏ bằng đá bao bọc lấy những tinh thể được chuyển hóa từ những vật chất vốn dĩ cấu tạo nên các thiết bị máy móc và những người phản đối."

 colony_fed.107.name:0 "Nhà Giả Kim Lạc Lối"
 colony_fed.107.desc:0 "Cỗ máy bay không người lái lạc lối đó cùng với những khám phá của nó đã bị xóa sổ hoàn toàn. Giờ đây, thành quả bất ngờ từ cuộc thử nghiệm của nó chỉ còn là một mớ hỗn độn, một lượng nhỏ các vật chất hữu ích đã được thu thập."

 colony_fed.110.name:0 "Thuật Giả Kim Đang Hoạt Động"
 colony_fed.110.desc:0 "Phòng thí nghiệm trên [From.GetName] đã thu được những kết quả đáng tin cậy. Mặc dù ở thời điểm hiện tại, quá trình này chỉ có thể chuyển hóa một lượng nhỏ đất đá thành hợp kim, nhưng các nhà nghiên cứu đang rất tự tin vào việc có thể mở rộng quy mô hoạt động. Bọn họ yêu cầu được cấp thêm tài nguyên."
 colony_fed.110.gestalt.desc:0 "Cuộc thử nghiệm đầy hiểm nguy trên [Root.GetName] đã mang lại kết quả. Mặc dù quá trình này hiện tại vẫn chỉ có thể chuyển hóa một lượng nhỏ vật chất thành loại kim loại mới này, nhưng cuộc thử nghiệm này vô cùng đáng tin cậy. Có thể sẽ cần phải giao phó thêm nhiều công việc nghiên cứu chuyên môn hơn nữa."

 colony_fed.111.name:0 "Hoa Sen Xanh Sụp Đổ"
 colony_fed.111.desc:0 "Cuộc thử nghiệm chuyển hóa trên [From.GetName] đã thất bại, tuy nhiên sự thất bại này cũng đã giúp chúng ta tránh được một thảm họa lớn hơn có thể xảy ra trong tương lai. Khi loại thiết bị mới này vừa mới được đưa vào hoạt động, nó đã thể hiện rất tốt trong giới hạn sức chịu đựng đã được thiết lập. Tuy nhiên, khi nhận được lệnh tắt, quá trình này sẽ đột ngột tăng tốc và chạm đến giới hạn bảo vệ an toàn. Ngay sau đó, lớp vỏ của cơ sở này đã bị biến đổi, toàn bộ vật chất xung quanh đều bị chuyển hóa thành một loại hợp kim siêu dẫn giống hệt nhau.\n\nVụ nổ trên mặt đất xảy ra sau đó đã cướp đi sinh mạng của rất nhiều người, và phá hủy hoàn toàn khu vực xung quanh. Những gì mà chúng ta thu được từ đó chỉ là một lớp vật chất hữu ích, và một bài học xương máu không thể lý giải được."
 colony_fed.111.a:0 "Đừng tiến hành bất kỳ cuộc thử nghiệm nào nữa."

 colony_fed.115.name:0 "Thuật Giả Kim Phổ Quát"
 colony_fed.115.desc:0 "Cơ sở sản xuất thử nghiệm trong giai đoạn tiếp theo của chúng ta đã được đưa vào hoạt động. Cơ sở chuyển hóa tinh thể được đặt tên là \"Hoa Sen Xanh\" này hiện đang hoạt động ngày đêm để chuyển hóa các vật liệu cơ bản thành những hợp kim hữu ích với một quy mô chưa từng có."
 colony_fed.115.a:0 "Sự đột phá vinh quang."
 colony_fed.115.b:0 "Cần phải theo dõi chặt chẽ..."

 colony_fed.120.name:0 "Hoa Sen Xanh Tự Thực"
 colony_fed.120.desc:0 "Cơ sở thử nghiệm trên [Root.GetName] đã gặp phải một sự cố thảm khốc. Người điều hành cho biết, có lẽ chúng ta sẽ không bao giờ có thể tìm ra được nguyên nhân thực sự dẫn đến sự thất bại của lớp vỏ bảo vệ an toàn, kết quả là toàn bộ cơ sở này, bao gồm cả các tòa nhà và một vùng rộng lớn xung quanh, đều đã bị chuyển hóa thành cùng một loại hợp kim siêu dẫn bởi phản ứng chuyển hóa mất kiểm soát. Chúng ta có thể khai quật được một lượng lớn vật liệu hữu ích từ nơi này."

 ####################################
 # Special Research Projects
 ####################################
 BLUELOTUS_SCALE_PROJECT:0 "Cơ Sở Hoa Sen Xanh"
 BLUELOTUS_SCALE_PROJECT_DESC:0 "Người ta tin rằng, việc vận dụng hợp lý hiện tượng phản xạ địa chất độc đáo này có thể giúp chuyển hóa các loại đất đá thông thường thành những hợp kim chất lượng cao."

 WENKWORT_PROJECT:0 "Cảnh Quan Khô Cằn Thuần Túy"
 WENKWORT_PROJECT_DESC:0 "Trên bề mặt của [event_target:wenkwort_rellrait.GetName] có lưu lại những sườn núi hình tròn, bao quanh vô số các miệng núi lửa và dãy núi một cách vô cùng tao nhã. Việc thiết kế này liệu có ẩn chứa mục đích gì không? Có mối liên hệ nào giữa nơi này và các $wenkwort_drone_plural$ bên trong hệ sao này không?"
 federations3.135.name:0 "Cảnh Sắc Trên [event_target:wenkwort_rellrait.GetName]"
 federations3.135.human.desc:0 "Nếu không vì quy mô khổng lồ và khoảng cách quá xa so với [Owner.Capital.GetName], §Y[event_target:wenkwort_rellrait.GetName]§! rất có thể sẽ bị nhầm lẫn thành một cảnh quan thiền định do chúng ta xây dựng. Bề mặt của nó là một cảnh quan hùng vĩ và mang phong cách độc đáo, được điểm xuyết bằng vô số những tảng đá từ nhỏ như viên sỏi cho đến lớn như một thiên thạch. Các học giả của chúng ta đã nhận ra rằng, sự phân bố của các vùng nước và đất liền mang đến một cảm giác chính xác đến mức như được tính toán bằng các phép toán. Mặc dù không làm mất đi vẻ đẹp của nó, nhưng nó quả thực đã đi chệch khỏi các hình thái tự nhiên, và giống như một sự mô phỏng có chủ đích hơn.\n\nBất kể nguồn gốc của nó là từ đâu, hành tinh được chạm trắc tỉ mỉ này rõ ràng là có mối liên hệ mật thiết với các §Y$wenkwort_drone_plural$§! đang liên tục xuất hiện trên bề mặt của nó trong thời gian gần đây. Cho đến nay, những nỗ lực truy tìm nguồn gốc của chúng vẫn chưa mang lại bất kỳ kết quả nào.\n\nCó lẽ việc chúng ta bị dẫn dắt đến hành tinh thiền định này là một sự ám chỉ nào đó, điều này đồng nghĩa với việc những câu hỏi đang ngày càng lớn dần trong chúng ta sẽ được giải đáp vào một thời điểm thích hợp."
 federations3.135.nonhuman.desc:0 "Những hình khối hình học khổng lồ trên [event_target:wenkwort_rellrait.GetName] rõ ràng là không phải do tự nhiên tạo ra. Cảnh quan độc đáo trên hành tinh này là một biển cát vô tận, được điểm xuyết bằng vô số những tảng đá từ nhỏ như viên sỏi cho đến lớn như một thiên thạch.\n\nCác nhà nghiên cứu của chúng ta cho rằng, cảnh quan này có lẽ là một tác phẩm nghệ thuật, hoặc là sản phẩm của một nghi lễ nào đó. Tuy nhiên, thứ duy nhất có thể tạo ra những thứ này chỉ có thể là các §Y$wenkwort_drone_plural$§! mà chúng ta đã phát hiện trước đó. Cho đến nay, những nỗ lực truy tìm nguồn gốc của chúng vẫn chưa mang lại bất kỳ kết quả nào. Có lẽ chúng ta chỉ có thể chờ đợi thời gian sẽ mang đến câu trả lời cho chúng ta..."

 ####################################
 # Archaeology Sites
 ####################################
 relicrails_digsite:0 "Di Tích Đường Ray"
 relicrails_digsite_desc:0 "Gần đây, một vụ sụt lún trên [From.Planet.GetName] đã làm lộ ra một mạng lưới đường hầm giao thông dưới lòng đất. Những con đường sắt được chế tác tinh xảo cùng với các cơ sở tín hiệu phức tạp này đã bị chôn vùi dưới lòng đất hàng trăm năm; thiết kế của chúng hoàn toàn khác biệt so với tất cả những gì mà chúng ta đã từng phát hiện trong khu vực không gian này trước đây. Rốt cuộc thì ai đã xây dựng nên chúng, và vì mục đích gì?"
 federations3.1005.name:0 "Sự Dịch Chuyển Của Tầng Hầm"
 federations3.1005.desc:0 "Kế hoạch xây dựng mới nhất của chúng ta trên [From.Planet.GetName] đã bị gián đoạn bởi một vụ sụt lún sâu dưới lòng đất. Thương vong không đáng kể, và cơ sở hạ tầng của chúng ta cũng không bị ảnh hưởng quá nhiều. Tuy nhiên, hoạt động địa chất này đã làm lộ ra một góc của mạng lưới giao thông dưới lòng đất. Những nhân viên khảo sát đang vô cùng bối rối đã bắt đầu tiến hành thăm dò những đường hầm xuất hiện một cách vô cùng đột ngột này. Có vẻ như điều này có liên quan đến những lịch sử trong quá khứ của [From.Planet.GetName]..."
 federations3.1010.name:0 "Kho Lưu Trữ Của Nhà Ga"
 federations3.1010.desc:0 "Không lâu sau khi quá trình khai quật được bắt đầu, những đường hầm và thiết bị có thiết kế phức tạp hơn và được xây dựng kiên cố hơn đã dần được hé lộ. Những đường ray khổ rộng và những toa tàu giường nằm vẫn còn ở tình trạng bảo quản rất tốt, xung quanh đó còn vương vãi đủ loại di vật cùng với những đống rác rưởi đã bị vứt bỏ từ vài thế kỷ trước.\n\nTrong những đống đổ nát này vẫn còn lưu lại nhiều bộ phận của động cơ và các cơ sở tín hiệu đã được xử lý anốt hóa một cách cẩn thận, giống hệt như những thứ thường xuất hiện trong một §Yxưởng bảo trì§!. Tất cả các bộ phận đều được khắc những hoa văn hình học phức tạp và tinh xảo, có lẽ điều này đòi hỏi một kỹ thuật nghệ thuật vô cùng cao siêu, thậm chí đã từng là niềm tự hào của bọn họ."
 federations3.1015.name:0 "Những Vị Khách Vũ Trang Đầy Đủ"
 federations3.1015.desc:0 "Trong lúc tiến hành khai quật một cách thận trọng tại một đường hầm phụ chật hẹp, chúng ta đã tìm thấy xác của một loài bò sát đã chết từ rất lâu, nguyên nhân cái chết là do trần hầm bị sập vào khoảng §Y800 năm§! trước. Ban đầu, lý do vì sao thi thể này lại xuất hiện trong đường hầm vẫn còn là một bí ẩn, nhưng sau khi nghiên cứu vô số những loại vũ khí mà nó mang theo bên mình, chúng ta đã tìm ra được câu trả lời.\n\nRất nhiều trong số những công cụ có lưỡi sắc bén được tìm thấy đều được treo ở mặt trong của một chiếc khiên trang trí, công nghệ để chế tạo ra những công cụ này nếu đem so sánh với chúng ta thì chỉ có thể được coi là thô sơ, nhưng rõ ràng là nó hoàn toàn khác biệt so với công nghệ được sử dụng trên đường ray trong đường hầm. Vị khách mang theo khiên này cũng giống như chúng ta, không thuộc về hành tinh này, và có vẻ như nó cũng đang tiến hành các nghiên cứu khảo cổ tương tự như chúng ta, cho đến khi nó phải bỏ mạng trong đường hầm."
 federations3.1015.a:0 "Hãy dịch lại những kết quả nghiên cứu của nó."
 federations3.1020.name:0 "Kẻ Mang Khiên"
 federations3.1020.desc:0 "Những ghi chép của Kẻ Mang Khiên đã dẫn chúng ta đến một §Ytrạm biến áp§!, trạm biến áp này đã từng được sử dụng để duy trì hoạt động cho xưởng bảo trì này. Có vẻ như chuyến thám hiểm của bọn họ đã phá vỡ lớp bịt kín chân không của cơ sở này; ở đây có rất ít dấu hiệu của sự phân hủy. Những đường ống dẫn cáp phủ đầy bụi bặm đã tạo thành một hàng cột xung quanh hàng tá màn hình giám sát. Chính trên một lối đi như vậy, chúng ta đã phát hiện ra những tàn tích còn sót lại của §Ymột giống loài có tri giác khác§!.\n\nĐội thám hiểm của Kẻ Mang Khiên gọi đây là một nhóm kỹ thuật viên thuộc loài nhuyễn thể - những thi thể vẫn còn được bảo quản khá nguyên vẹn của họ đang rúc vào nhau, dường như để bảo vệ lẫn nhau hoặc để sưởi ấm. Trong ghi chép còn nhắc đến hai nỗ lực nhằm khởi động lại trạm biến áp đã có lịch sử hàng ngàn năm tuổi này, nhưng những công cụ mà họ sử dụng đều không thể sánh bằng chúng ta. Chúng ta có cơ hội để hoàn thành công việc này, làm như vậy sẽ giúp cho các công việc khai quật tiếp theo trở nên dễ dàng hơn."
 federations3.1021.name:0 "Cuộn Dây Điện Xui Xẻo"
 federations3.1021.desc:0 "Chỉ vài phút sau khi chúng ta sử dụng một máy phát pha cầm tay để khởi động trạm biến áp trên [From.Planet.GetName], cơ sở này đột nhiên vang lên những tiếng chuông báo động chói tai. Vài giây sau đó, ngay tại nơi đội khai quật của chúng ta đang làm việc, một phần trần nhà và một đoạn tường bên cạnh đường ray đã bị sụp đổ.\n\nNguyên nhân của sự cố đã được xác định là do một §Rcuộn điện trở bị ăn mòn§! mà chúng ta tưởng rằng nó đã bị ngắt kết nối. Sự sơ suất này đã khiến cho một vài người bị thương, và định đoạt số phận của hơn mười thành viên trong đội khai quật của chúng ta; bọn họ hiện đang bước vào vết xe đổ bi thảm của Kẻ Mang Khiên."
 federations3.1022.name:0 "Tiến Vào Những Tuyến Đường Ray Khác Nhau"
 federations3.1022.desc:0 "Mức độ phức tạp của tàn tích trạm biến áp này đã khiến chúng ta phải kinh ngạc. Chúng ta đã khởi động nó bằng một máy phát pha cầm tay, nhưng những vụ nổ xảy ra sau đó đã khiến cho một số phần của công trình kiến trúc có lịch sử hàng ngàn năm tuổi xung quanh chúng ta bị sụp đổ.\n\nMay mắn thay, đội ngũ của chúng ta đã nhận được đủ cảnh báo trước để có thể tìm nơi trú ẩn an toàn. Họ phát hiện ra rằng một số khu vực hiện tại đã bị phong tỏa hoàn toàn, nhưng đổi lại, một số khu vực mới đã được mở ra."
 federations3.1026.name:0 "Hoạt Động Trở Lại"
 federations3.1026.desc:0 "Sự \"cải tạo\" ngoài ý muốn của chúng ta đối với địa điểm khai quật này đã làm lộ ra một đường hầm đường sắt trải dài, dựa theo những thông tin mà chúng ta giải mã được từ bảng điều khiển, một đoàn tàu đang nằm ở đó, được giấu kín ở phía bên cạnh. Đồng thời, hệ thống này cũng áp dụng các thẻ ưu tiên khác nhau cho các đoàn tàu, bao gồm cả một từ mà chúng ta tạm dịch là \"§YKho Lưu Trữ§!\".\n\nBởi vì hiếm khi có một hiện vật mang tính then chốt nào lại xuất hiện trước mắt chúng ta với một hình thái khổng lồ như vậy, nên chúng ta đã cử một đội đến để giúp cho đoàn tàu hoạt động trở lại. Bản thân đầu máy xe lửa cổ điển này đã là một công trình kỹ thuật vô cùng thanh lịch, nhưng mỗi toa xe được trang trí tỉ mỉ phía sau nó lại được chứng minh là một viện bảo tàng.\n\nĐoàn tàu này có thể được hiểu là một viên nang thời gian di động, luôn sẵn sàng để được di chuyển đến một nơi an toàn. Trong suốt ba ngàn năm qua, nó đã lưu giữ toàn bộ lịch sử, văn hóa và các ghi chép khoa học của một nền văn hóa mà hiện tại chúng ta biết đến với cái tên §YPeeyep§!."
 federations3.1026.a:0 "Hãy mang những ghi chép này về hành tinh mẹ của chúng ta để tiến hành nghiên cứu sâu hơn."
 federations3.1027.name:0 "Chỉ Còn Lại Những Nhà Kho Trống Rỗng"
 federations3.1027.desc:0 "Sự cải tạo ngoài ý muốn của chúng ta đối với địa điểm khai quật này đã làm lộ ra một nhà kho chở hàng, nó được đục ra từ bên dưới một mái vòm hình cung khổng lồ của hang động. Bên trong vô số những nhà kho khổng lồ và vắng lặng của nó, chỉ còn lại duy nhất một con dấu an toàn vẫn chưa bị bóc mở; khi mở nó ra, chúng ta đã phát hiện ra thêm nhiều thi thể của Kẻ Mang Khiên. Bọn họ đến đây để tìm kiếm đồ tiếp tế, nhưng lại xảy ra xung đột với một hệ thống báo động có lịch sử hàng ngàn năm tuổi.\n\nDựa theo những cuốn nhật ký mà họ để lại, §Yđoàn thám hiểm Fenrunir§! lưu động này đang tiến hành khảo sát xem [From.Planet.GetName] có phải là một thế giới có thể định cư được hay không. Bọn họ hoàn toàn không ngờ tới việc sẽ phát hiện ra những tàn tích ở đây. Bởi vì không được đào tạo bài bản, cũng như không hề có hứng thú với khảo cổ học, nên bọn họ đã tiến hành lục soát khu di chỉ này một cách vô cùng triệt để, thay vì tiến hành điều tra.\n\nNhững người đang phải chịu cảnh chết đói trong nhà kho đã sử dụng những ngôn từ cực kỳ sống động để chỉ ra rằng, những người đồng chí của họ đã chuyển một lượng lớn vật tư lên tàu chở hàng, và gần như không để lại bất cứ thứ gì. Cuộc điều tra của chính chúng ta cũng đã xác nhận rằng, mặc dù có một lượng lớn máy móc cổ đại, nhưng hầu như chẳng có thứ gì có thể cho chúng ta biết những người xây dựng tuyến đường sắt bí ẩn này rốt cuộc là ai."
 federations3.1030.name:0 "Đường Sắt Và Nơi Trú Ẩn"
 federations3.1030.desc:0 "Những ghi chép do những người xây dựng đường sắt đến từ [From.From.Planet.GetName] để lại đã nói cho chúng ta biết cách mà nhóm sinh vật nhuyễn thể cuồng tín này đã chạy trốn khỏi quê hương với nỗi khiếp sợ đối với công nghệ, và thông qua những nỗ lực cơ giới hóa để tìm kiếm một bản ngã tốt đẹp hơn. Họ đã rút lui vào một §Ymạng lưới hang động dưới lòng đất§! bí ẩn và xa xôi, sau đó đã thông qua các đường hầm đường sắt để kết nối và mở rộng môi trường sống của mình.\n\nVì lo sợ rằng nền văn hóa của mình một ngày nào đó sẽ bị săn lùng và xóa sổ, nên người Peeyep đã xây dựng các công trình dưới lòng đất để đảm bảo an toàn. Trong suốt 200 năm tiếp theo, xã hội của họ phát triển vô cùng chậm chạp, trong khoảng thời gian đó, chính phủ trên hành tinh quê hương của họ ngày càng trở nên cô lập và hoang tưởng. Một sự thay đổi mang tính cực đoan đã thúc đẩy họ tiến hành quân sự hóa với một quy mô chưa từng có; và ngay tại thời điểm này, cuốn biên niên sử đột ngột kết thúc.\n\nNgay cả khi kết hợp với những khám phá không trọn vẹn của những Kẻ Mang Khiên sau này, chúng ta cũng chỉ có thể đưa ra những suy đoán về số phận bi thảm của hai dân tộc. Những bằng chứng khảo cổ học sau này hoặc là đã bị thất lạc, hoặc là không được ghi chép lại; những gì còn sót lại ở hiện tại chỉ là những đường hầm, những ghi chép và những đoàn tàu của họ."

 ####################################
 # Deposits
 ####################################
 d_impossiblecorrie:0 "Vùng Trũng Hoa Sen"
 d_impossiblecorrie_desc:0 "Một đặc điểm địa chất phi thực tế đã được hé lộ. Những bức tường cong được bao phủ bởi những trầm tích pha lê kỳ lạ và có khả năng phản chiếu ánh sáng."
 d_bluelotus:0 "Nguyên Mẫu Hoa Sen Xanh"
 d_bluelotus_desc:0 "Một cơ sở mang tính thử nghiệm cao, được sử dụng để tìm kiếm các phương pháp sản xuất những hợp kim hữu ích bằng cách sử dụng các hợp chất silicat thông thường."
 d_bluelotus2:0 "Cơ Sở Hoa Sen Xanh"
 d_bluelotus2_desc:0 "Một cơ sở mang quy mô công nghiệp, sử dụng các hợp chất silicat thông thường để sản xuất những hợp kim hữu ích."
 d_ruin_bluelotus:0 "Phế Tích Hoa Sen Xanh"
 d_ruin_bluelotus_desc:0 "Một cơ sở thử nghiệm từng mang đến rất nhiều hy vọng, có khả năng chuyển hóa đất đá và các vật chất khác thành hợp kim. Giờ đây, ngoài một tầng quặng nhỏ hẹp, nơi này chẳng còn lại thứ gì."
 d_crater_bluelotus:0 "Hố Hoa Sen Xanh"
 d_crater_bluelotus_desc:0 "Địa điểm mà đất đá và các vật chất khác đã bị biến đổi một cách vô tình và mất kiểm soát thành một loại hợp kim quý giá."

