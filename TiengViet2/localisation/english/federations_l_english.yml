 OPINION_TERRIBLE_DESC:0 "Hai đế chế của chúng ta coi nhau như kẻ thù. Việc kỳ vọng có thể đạt được thỏa thuận về bất kỳ vấn đề gì là điều không tưởng."
 OPINION_POOR_DESC:0 "Các nỗ lực ngoại giao đang đi đến bờ vực đổ vỡ. Rất khó có khả năng chúng ta sẽ tìm được tiếng nói chung trong hầu hết các vấn đề."
 OPINION_NEUTRAL_DESC:0 "Nền tảng ngoại giao của chúng ta vẫn còn rất sơ khai. Chúng ta chỉ có thể kỳ vọng đạt được những thỏa thuận mang lại lợi ích to lớn cho cả hai bên."
 OPINION_GOOD_DESC:0 "Các nỗ lực ngoại giao đang mang lại quả ngọt. Chúng ta đã bắt đầu có tiếng nói chung trong rất nhiều vấn đề ngoại giao."
 OPINION_EXCELLENT_DESC:0 "Các sứ giả của chúng ta đã xây dựng được một mối liên kết vô cùng bền chặt với đế chế này. Cả hai đế chế đều vô cùng khao khát được chung tay sát cánh trên con đường ngoại giao."

