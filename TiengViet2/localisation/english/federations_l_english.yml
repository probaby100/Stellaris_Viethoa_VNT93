 ### The Hauer System text
 attack_ship_01_object:0 "Tàu Tấn công bị Tiêu diệt"
 attack_ship_01_object_desc:0 "Một chiếc tàu tấn công cũ kỹ đã bị phá hủy, nó đã biến thành tro bụi sau một trận hỏa hoạn dữ dội."
 attack_ship_01_object_tooltip:0 "Chiếc tàu tấn công đã bị hư hỏng và thiêu rụi."

 tannhauser_gate_object:0 "Cổng Tannhäuser"
 tannhauser_gate_object_desc:0 "Một cánh cổng không gian đã ngưng hoạt động. Đích đến mà nó kết nối tới đã bị lãng quên từ lâu."
 tannhauser_gate_object_tooltip:0 "Một cánh cổng không gian đã ngưng hoạt động."

 site_lost_moments:0 "Mãi Không Lãng quên"
 site_lost_moments_intro:0 "Tàu Khoa học đã phát hiện một thông số kỳ lạ được phát ra từ [From.Planet.GetName]."
 fedev.9430.name:0 "Ngọn Hải đăng Nơi Vực sâu"
 fedev.9430.desc:0 "Giờ đây, chúng ta chỉ có thể thông qua các lập luận khảo cổ học và trí tưởng tượng để tái hiện lại nền văn minh từng phồn vinh một thời trên bề mặt hoang tàn của [From.Planet.GetName]. Sự trôi đi của thời gian thật tàn nhẫn vô tình, ngay cả những công trình kiên cố nhất từng được xây dựng, nay cũng chỉ còn là đống tro tàn.\n\nNhưng sâu thẳm dưới lòng đất sâu không lường được kia, có một tín hiệu kỳ lạ đang nhịp đập. Một ngọn hải đăng bí ẩn dường như đang vẫy gọi chúng ta đến điều tra và khai quật."
 fedev.9435.name:0 "Thời gian Không Còn Nhiều"
 fedev.9435.desc:0 "Khi đội khai quật càng tiến gần đến ngọn hải đăng nằm sâu bên dưới, một cảm giác về cái chết không thể chối cãi bỗng chốc len lỏi trong họ một cách đầy bí ẩn. Cùng với lượng đất đá ngày càng được dọn sạch nhiều hơn, một ý nghĩ kiên định đang lởn vởn trong tâm trí mỗi người:\n\nSự sống chỉ là thoáng qua. Mọi thứ rồi sẽ kết thúc vào một ngày nào đó..."
 fedev.9440.name:0 "Sáng chói Vô cùng"
 fedev.9440.desc:0 "Nguồn gốc của tín hiệu là một bia mộ của người ngoài hành tinh, trên đó khắc những ký hiệu kỳ lạ. Bản dịch nhiều nhất cũng chỉ có thể cung cấp cho chúng ta một chút manh mối. Những ký hiệu này nhắc đến một nhân vật có tầm ảnh hưởng to lớn, sự nghiệp vĩ đại của người này đáng được ghi nhớ và tôn sùng, và cả nền văn minh đều đang chìm trong sự xót thương. Phần cuối của bản dịch trở nên vô cùng quái dị, kể về việc chất lỏng trong cơ thể chảy ra do quá đau buồn, rồi sau đó lại bốc hơi do điều kiện thời tiết.\n\nChỉ có đoạn cuối cùng của toàn bộ văn bản là được dịch thành công:\n\n§H'Đã đến lúc để chết.'§!"

 lost_moment_memento:0 "Được Sống Thật Tuyệt"
 lost_moment_memento_desc:0 "Sau khi phát hiện ra bia mộ của người ngoài hành tinh trong quá trình khảo cổ, người dân trong đế chế đã trở nên yêu đời hơn."

 ### The Lesser Messenger text
 site_lesser_messenger:0 "Bức thư Trong Bụi"
 site_lesser_messenger_intro:0 "Cuộc khảo sát chi tiết đối với [From.Planet.GetName] đã hé lộ một vài tín hiệu yếu ớt từ một nền văn minh từng phủ sóng toàn bộ hành tinh này."
 fedev.9445.name:0 "Ngàn Năm Đã Qua"
 fedev.9445.desc:0 "Những cuộc thám hiểm ban đầu trên bề mặt [From.Planet.GetName] đã hé lộ rằng hành tinh này quả thực từng là quê hương của một nền văn minh.\n\nTuy nhiên, mức độ hoang tàn cho thấy sự tồn tại của nền văn minh này đã là chuyện từ rất, rất lâu về trước, và có nhiều khả năng nó từng phải hứng chịu một cuộc tấn công bất ngờ và kinh khủng từ một thế lực nào đó. Những đống đổ nát còn sót lại không đủ để cung cấp thông tin về đặc điểm sinh học của người ngoài hành tinh này."
 fedev.9450.name:0 "Quái thú Không gian Sâu thẳm"
 fedev.9450.desc:0 "Đội thám hiểm bề mặt đã tách được một tín hiệu vô tuyến từ hành tinh. Mặc dù nguồn phát sóng vẫn chưa được xác định, nhưng một phần thông điệp đã được giải mã đã bắt đầu kể cho chúng ta nghe câu chuyện về nền văn minh đã chìm vào quên lãng từ lâu này.\n\nMột mối đe dọa không rõ danh tính đang từng bước áp sát nền văn minh này; họ đã cùng nhau đắm chìm vào sự phát triển của công nghệ; có tin đồn cho rằng một con tàu vũ trụ với kích thước khổng lồ vô song đang được chế tạo ở một nơi nào đó trong hệ sao. Những chủ đề này liên tục xuất hiện trong những đoạn thông tin lộn xộn này."
 fedev.9455.name:0 "Khu vườn Nguyên mẫu"
 fedev.9455.desc:1 "Các nhà khảo cổ học đã tìm cách tiếp cận nguồn phát ra tín hiệu bí ẩn này - nằm ẩn sâu dưới lòng đất.\n\nCông tác khai quật tại di chỉ chỉ mới bắt đầu không lâu, nhưng nó đã cho thấy nơi này có vẻ như là một cơ sở nghiên cứu và phát triển. Nơi này chứa đầy những bản nguyên mẫu thu nhỏ của các thiết bị khoa học đa dạng.\n\nKết quả quét cho thấy bên dưới cơ sở này còn có một hốc rỗng, và quá trình khai quật vẫn đang được tiến hành."
 fedev.9460.name:0 "Rốt cuộc Họ đang Chế tạo Thứ gì..."
 fedev.9460.desc:0 "Đội khai quật của chúng ta đã có một khám phá thú vị. Đó là một nhóm ổ cứng, bên trong chứa đựng thông tin về một dự án đang được tiến hành, được xem là trọng tâm cốt lõi của cơ sở này, hay thậm chí là của toàn bộ nền văn minh của họ.\n\nTheo như mô tả, đây là một §Hcon tàu khổng lồ có khả năng sánh ngang với con tàu vũ trụ lớn nhất trong dải ngân hà§!.\n\nRốt cuộc họ đang chế tạo một con quái vật khổng lồ như thế nào ở đây?"
 fedev.9465.name:0 "Người Chiến thắng là..."
 fedev.9465.desc:0 "Đây là một con tàu vũ trụ \"khổng lồ\"!\n\nChà, ít nhất đối với những cư dân từng sinh sống trên [From.Planet.GetName], con tàu này quả thực khá là to lớn. Những bản nguyên mẫu thu nhỏ mà chúng ta tìm thấy ở đây thực chất chính là những cỗ máy của con tàu, trong khi thứ mà chúng ta từng lầm tưởng là thiết bị nào đó, lại chính là thủ đô của họ. Về phần \"mối đe dọa\" được nhắc đến trong tín hiệu mã hóa, trên thực tế lại là một đối thủ trong cuộc đua công nghệ không gian. Toàn bộ nền văn minh thu nhỏ này đã tập trung tại đây để dốc toàn lực nhằm giành lấy chức vô địch.\n\nNhưng có vẻ như chúng ta mới là người chiến thắng của cuộc thi này."
 fedev.9470.name:0 "Tiến Lên, Chinh Phục"
 fedev.9470.desc:0 "Chúng ta đã phát hiện ra một con tàu vũ trụ khổng lồ!\n\nNhưng thực tế, kích thước khổng lồ của con tàu này chỉ đúng đối với những cư dân trước đây của [From.Planet.GetName], bởi vì giống loài của họ có kích thước cực kỳ nhỏ bé.\n\nVì lo sợ một mối đe dọa bí ẩn nào đó sẽ ập xuống hành tinh quê hương của mình, toàn bộ chủng tộc của họ đã tập trung tại đây để chế tạo một con tàu vũ trụ nhằm ứng phó với mối đe dọa cận kề này.\n\nCó vẻ như họ đã chậm một bước; bởi vì dù cho tàu tấn công của họ vẫn nằm yên tại chỗ, nhưng bản thân họ lại hoàn toàn biến mất không dấu vết."
 fedev.9475.name:0 "Đừng Phá Hỏng Người Đưa Tin"
 fedev.9475.desc:0 "Quả là một con tàu vũ trụ hoành tráng!\n\nMột con tàu vũ trụ hoành tráng, nhưng lại cực kỳ nhỏ nhắn. Điều này chứng tỏ những cư dân bản địa của [From.Planet.GetName] thực ra là một giống loài siêu nhỏ. Những vật thể thu nhỏ mà chúng ta bắt gặp chính là những cỗ máy của họ, trong khi đó, thiết bị đã bị hư hỏng kia lại từng là một thành phố sầm uất.\n\nSau khi nghe tin có ai đó ở đầu bên kia dải ngân hà đã chế tạo ra một con tàu vũ trụ khổng lồ, những sinh vật này cũng quyết định chế tạo một con tàu để có thể sánh vai cùng với thứ khổng lồ đó.\n\nQuả là một quyết tâm và lòng dũng cảm đáng nể, tất nhiên, cũng xen lẫn một chút đáng yêu."

 get_messenger:0 "§YNguời Đưa Tin Nhỏ bé§! đã gia nhập hạm đội của chúng ta"

 LESSENGER_REMODEL:0 "Nâng cấp Người Đưa Tin"
 LESSENGER_REMODEL_TITLE:0 "Nâng cấp Người Đưa Tin"
 LESSENGER_REMODEL_DESC:0 "Điều duy nhất có thể đem ra so sánh với trình độ công nghệ cũng như sức chứa lập dị của §YNguời Đưa Tin Nhỏ bé§! chính là kích thước nực cười của nó. Hàng ngàn sinh vật tí hon đã chế tạo ra nó mới có thể lấp đầy không gian trong con tàu, nhưng nếu chúng ta muốn nhét vừa những thuyền viên có kích thước nhỏ nhất, chúng ta bắt buộc phải tiến hành nâng cấp nó với quy mô lớn."
 lessenger_75:1 "Người Đưa Tin Nhỏ bé vẫn còn quá nhỏ so với các thuyền viên của chúng ta!"
