 ### JUGGERNAUT BUILT EVENT - BUILDER TEXT
 fedev.9500.name:0 "Đấng Quân Vương của Vùng Không Gian Bao La"
 fedev.9500.desc:0 "Kẻ Thống trị với sức mạnh chấn động hoàn vũ đã được xây dựng hoàn tất.\n\nCon tàu khổng lồ có khả năng tự do di chuyển này sẽ thay đổi hoàn toàn cục diện của các cuộc tấn công. Nó có thể xây dựng và sửa chữa các con tàu ngay trên tiền tuyến, và được trang bị hỏa lực đủ để san phẳng mọi thứ, cho phép chúng ta liên tục tấn công những kẻ dám chống lại chúng ta.\n\nGiờ đây, chỉ có những kẻ ngu ngốc mới dám đối đầu với [Owner.GetName]."
 fedev.9500.a:0 "Tiến Lên, Chinh Phục!"

 # JUGGERNAUT BUILT EVENT - OTHER EMPIRES TEXT
 fedev.9505.name:0 "Vũ Khí Sát Thủ Của Đế Vương"
 fedev.9505.desc:0 "Đã xác nhận, §H[From.Owner.GetName]§! đã hoàn tất việc chế tạo siêu hạm Kẻ Thống Trị khổng lồ. Căn cứ không gian có khả năng tự do di chuyển này được trang bị hỏa lực khủng khiếp, và có khả năng xây dựng cũng như bảo trì các con tàu ngay trên chiến tuyến, khiến nó trở thành một mối đe dọa cực kỳ nghiêm trọng trong bất kỳ tình huống tác chiến nào.\n\nĐây thực sự là đỉnh cao vũ khí trong các cuộc chiến tranh không gian."
 fedev.9505.a:0 "Có vẻ như nó sẽ thay đổi luật chơi của chiến tranh."

 galcom.2.name:0 "Cộng Đồng Thiên Hà"
 galcom.2a.desc:0 "Khi ngày càng có nhiều nền văn minh không gian thiết lập mối quan hệ chính thức với nhau, dải ngân hà ngày càng trở nên nhộn nhịp hơn bao giờ hết. Nhằm tránh những hiểu lầm đáng tiếc giữa các quốc gia, ngày càng có nhiều nhà ngoại giao kêu gọi thành lập một tổ chức liên ngân hà mới - hay có thể gọi là Cộng đồng nếu muốn, nơi các đế chế trong thiên hà có thể tổ chức các cuộc họp để cùng nhau thảo luận về các vấn đề trọng đại của thiên hà.\n\nLiệu [Root.GetName] có nên cam kết ủng hộ việc thành lập §HCộng Đồng Thiên Hà§! không?"
 galcom.2b.desc:0 "Hãy thử thêm một lần nữa. Liệu chúng ta có nên thành lập Cộng Đồng Thiên Hà không?"
 galcom.2.a:0 "Có, đây là một nỗ lực đáng để thử."
 galcom.2.b:0 "Không, chúng ta không rảnh rỗi để làm những việc vô bổ như vậy."
 galcom.5.name:0 "Sự Ra Đời Của Cộng Đồng Thiên Hà"
 galcom.5.desc:0 "Đây là một ngày mang tính lịch sử. Một số đế chế không gian quan trọng trong thiên hà, bao gồm cả [Root.GetName], đã tuyên bố thành lập §HCộng Đồng Thiên Hà§!. Tổ chức liên quốc gia này sẽ đóng vai trò như một diễn đàn, nơi mọi vấn đề của toàn bộ thiên hà đều có thể được thảo luận và quyết định.\n\nLà một trong những quốc gia sáng lập, chúng ta có thể tự hào về cột mốc quan trọng này trong lịch sử ngân hà."
 galcom.5.a:0 "Một ngày tuyệt vời cho toàn bộ thiên hà!"
 galcom.6.desc:0 "Mặc dù chúng ta đã quyết định không tham gia hỗ trợ cho việc thành lập một tổ chức ngân hà mang tính liên quốc gia nào đó, nhưng một vài đế chế khác đã hợp lực để tạo ra một tổ chức như vậy. Trong một tuyên bố chung \"mang tính lịch sử\", họ đã thông báo với toàn bộ thiên hà về việc thành lập §HCộng Đồng Thiên Hà§!. Tổ chức này được thành lập với mục đích tạo ra một diễn đàn, nơi các vấn đề quan trọng ảnh hưởng đến toàn bộ dải ngân hà có thể được đưa ra bàn thảo.\n\nVì chúng ta đã từ chối tham gia vào việc thành lập Cộng Đồng Thiên Hà này, nên [Root.GetName] sẽ không được coi là một quốc gia thành viên."
 galcom.6.a:0 "Lũ ngốc kiêu ngạo."
 galcom.10.name:0 "Cộng Đồng Thiên Hà Chết Từ Trong Trứng Nước"
 galcom.10.desc:0 "Đề xuất thành lập một \"§HCộng Đồng Thiên Hà§!\" siêu quốc gia đã thất bại. Không có đủ số lượng các đế chế cam kết sẽ ủng hộ việc thành lập một tổ chức như vậy."
 galcom.10.a:0 "Những kẻ ngốc đó vẫn chưa chuẩn bị sẵn sàng."
 galcom.10.b:0 "Cuối cùng cũng tống khứ được rắc rối!"
 galcom.16.desc:0 "Một nhóm các đế chế không gian, trong đó có một vài đế chế mà chúng ta vẫn chưa biết rõ, đã cùng nhau thành lập một \"§HCộng Đồng Thiên Hà§!\". Tổ chức liên quốc gia này được lập ra nhằm mục đích đóng vai trò như một diễn đàn, nơi có thể cùng nhau bàn bạc về các vấn đề trọng đại.\n\nMặc dù chúng ta không tham gia vào quá trình thành lập của họ, nhưng các quốc gia thành viên đó đã gửi lời mời đến [Root.GetName], đề nghị chúng ta trở thành một quốc gia thành viên chính thức. Liệu chúng ta có nên nhận lời mời này không?"
 galcom.16.a:0 "Được thôi, hãy tham gia tổ chức này."
 galcom.16.b:0 "Không, chúng ta sẽ không dây dưa vào mấy chuyện này."
 galcom.16.c: "Chúng ta chẳng thèm bận tâm đến cái \"Cộng đồng\" nào cả"
 galcom.16.d: "Chẳng bao lâu nữa, chúng cũng sẽ phải thuần phục Đại Khả Hãn của chúng ta."

 galcom.51.name:0 "Thành lập Hội Đồng Thiên Hà"
 galcom.51.desc:0 "Các quốc gia thành viên của Cộng Đồng Thiên Hà đã bỏ phiếu quyết định thành lập Hội Đồng Thiên Hà. Thực thể được nhiều người tôn kính này chỉ cho phép ba đế chế hùng mạnh và có sức ảnh hưởng lớn nhất trong cộng đồng trở thành thành viên. Cho đến khi vòng bỏ phiếu tiếp theo được tiến hành, ba quốc gia này sẽ là §H[council_member_1.GetName]§!, §H[council_member_2.GetName]§! và §H[council_member_3.GetName]§!.\n\nCộng đồng mong đợi các quốc gia thành viên của Hội đồng có thể lãnh đạo và bảo vệ toàn bộ Cộng Đồng Thiên Hà. Họ đã được trao thêm quyền hạn, có thể bỏ qua những thủ tục hành chính rườm rà thường gây cản trở quá trình ra quyết định trong các cơ quan chính trị lớn."
 galcom.51.a:0 "Hy vọng họ có đủ năng lực để hoàn thành nhiệm vụ..."
 galcom.51.b:0 "Giờ đây chúng ta cuối cùng cũng có thể làm nên chuyện lớn!"
 galcom.51.c:0 "À, xem ra những kẻ thao túng đứng sau màn cuối cùng cũng lộ diện!"

 galcom.62.name:0 "Trụ sở Thị Trường Thương Mại Liên Ngân Hà Tại [galactic_market_station_system.GetName] Đã Bị Tháo Dỡ"
 galcom.62.desc:2 "Căn cứ theo Điều 19 Mục C của Hiến chương [global_event_country.GetGalCommunityOrGalImperium], chỉ có duy nhất một quốc gia thành viên mới có quyền đăng cai Thị trường Thương mại Liên Ngân hà. $galcom.62.base$Ban Giám đốc Thương mại của [global_event_country.GetCommunityOrImperium] đã trình bày các phát biểu nhằm bày tỏ sự tiếc nuối đối với tình hình này. Họ cam kết rằng, cuộc bầu cử quốc gia đăng cai mới trong nội bộ [global_event_country.GetCommunityOrImperium] sẽ sớm được tiến hành."
 galcom.62.base: "Vì vậy, trụ sở chính của thị trường đặt tại hệ sao [galactic_market_station_system.GetName] đã bị tháo dỡ. Vị thương nhân cuối cùng ngày hôm nay đã phải miễn cưỡng rời bỏ vị trí của mình, than vãn về quyết định đầy kịch tính này - theo góc nhìn của họ - là không cần thiết và đã gây ra thiệt hại to lớn đối với nền thương mại của thiên hà."
 galcom.62.A:0 "Cái giá này hoàn toàn xứng đáng."
 galcom.63.name:0 "Lựa chọn Trụ sở Mới Cho Thị Trường Thương Mại Liên Ngân Hà"
 galcom.63.desc:2 "Do [From.GetName] đã quyết định rời khỏi [global_event_country.GetGalCommunityOrGalImperium], chúng ta đành phải thi hành một điều khoản khó hiểu trong Hiến chương [global_event_country.GetCommunityOrImperium], nội dung đại khái là chỉ có các quốc gia thành viên mới được quyền dẫn dắt Thị trường Thương mại Liên Ngân hà. $galcom.62.base$Quá trình đề cử địa điểm mới cho trụ sở đã bắt đầu, Ban Giám đốc Thương mại của [global_event_country.GetCommunityOrImperium] đã đưa ra thông báo bày tỏ sự nuối tiếc đối với tình hình hiện tại. Họ bảo đảm sẽ nhanh chóng tìm ra một quốc gia đăng cai mới."
 galcom.63.A:0 "Có lẽ đây lại là một cơ hội tốt cho chúng ta..."
 galcom.63.B:0 "Vậy thì chúng ta chỉ đành cười nhạo sự ngu muội của bọn họ."
 galcom.64.name:0 "$galcom.63.name$"
 galcom.64.desc:2 "[global_event_country.GetGalCommunityOrGalImperium] đã bày tỏ quan điểm, cuộc cạnh tranh mới nhằm di dời Thị trường Thương mại Liên Ngân hà đã chính thức bắt đầu. Trụ sở thị trường nằm ở hệ sao [market_founder_planet.solar_system.GetName] đã bắt đầu tiến hành các công việc thu dọn, sự chú ý của các thương nhân đều đang đổ dồn vào những dự báo trong vài năm tới. Họ than thở về quyết định đầy kịch tính - và theo góc nhìn của họ là hoàn toàn không cần thiết này đã gây ra thiệt hại to lớn đối với nền thương mại của thiên hà.\n\nQuá trình đề cử địa điểm mới cho trụ sở đã bắt đầu, Ủy ban Thương mại của [global_event_country.GetCommunityOrImperium] đã đưa ra một tuyên bố, bày tỏ sự tiếc nuối đối với tình trạng này. Họ cam kết sẽ nhanh chóng tìm ra một hệ sao mới."
 galcom.69.name:0 "Thị Trường Thương Mại Liên Ngân Hà Giữ Nguyên Vị Trí Cũ"
 galcom.69.desc:0 "Đề xuất di dời Thị trường Thương mại Liên Ngân hà của chúng ta không may đã bị thất bại. Mặc dù những nỗ lực của chúng ta đã giành được rất nhiều sự ủng hộ bằng lời nói, nhưng lại không thể chuyển hóa thành đủ số lượng đề cử cho một địa điểm mới.\n\nVề nguyên tắc, ý kiến này vẫn hoàn toàn hợp lý: [global_event_country.GetGalCommunityOrGalImperium] sau này vẫn có thể tiếp tục đề xuất di dời thị trường. Tuy nhiên, ở thời điểm hiện tại, cơ quan thương mại này vẫn sẽ tiếp tục được quản lý bởi [market_founder.GetName], những người đang thu được lợi nhuận khổng lồ."
 galcom.70.desc:0 "Hoạt động thương mại liên ngân hà gần đây đã trải qua một sự phục hồi ngắn ngủi và đầy hỗn loạn, có thông tin cho biết những nỗ lực nhằm di dời thị trường liên ngân hà đã bị thất bại. Mặc dù [global_event_country.GetGalCommunityOrGalImperium] đã tuyên bố mong muốn di dời cơ sở này, nhưng họ không nhận được bất kỳ sự đề cử đáng tin cậy nào cho một nước chủ nhà thay thế. Vì vậy, [market_founder.GetName] sẽ tiếp tục đảm nhiệm vai trò nước chủ nhà, cho đến khi gió đổi chiều chính trị một lần nữa, thông qua việc bỏ phiếu để tìm ra người thay thế."
 galcom.70.desc.founder:0 "Ý chí chính trị của liên ngân hà rõ ràng là không đồng nhất với ý chí của thị trường. Sau khi gây ra sự xáo trộn tài chính trên diện rộng, nỗ lực của [global_event_country.GetGalCommunityOrGalImperium] nhằm tước bỏ vai trò nước chủ nhà của trung tâm giao dịch độc quyền của chúng ta đã thất bại, bởi vì không có bất kỳ đế chế nào khác đưa ra đề cử hợp lệ cho một nước chủ nhà.\n\nNhững người ủng hộ động thái này không hề nao núng, họ khẳng định rằng thị trường liên ngân hà có thể được di dời đến nơi khác bất cứ lúc nào tùy theo nhu cầu thương mại. Tuy nhiên ở thời điểm hiện tại, sau khi trải qua bao nhiêu bộn bề lo toan, những thương nhân quan trọng nhất của liên ngân hà vẫn cảm thấy an tâm khi đặt niềm tin vào chúng ta hơn."

 origin_fallen_empire:0 "Hậu duệ của Bậc Lão thành"
 origin_fallen_empire_desc:0 "Nền văn minh này đã ra đời từ rất lâu trước khi các cường quốc hiện tại trong thiên hà xuất hiện. Sự trì trệ kéo dài qua hàng ức năm đã khiến đế chế của họ dần suy tàn, chỉ còn lại một cái bóng nhạt nhòa của thời kỳ huy hoàng trước đây."
 origin_enlightened:0 "Được Khai sáng"
 origin_enlightened_desc:0 "Sự phát triển tự nhiên của nền văn minh này đã được đẩy nhanh đáng kể nhờ sự can thiệp từ một thế lực khác, điều này đã giúp họ trở thành một quốc gia liên sao."
 origin_fallen_empire_hive: "$origin_fallen_empire$"
 origin_fallen_empire_hive_desc: "$origin_fallen_empire_desc$"

 origin_default_pre_ftl:0 "Nền Văn Minh Đang Phát Triển"
 origin_default_pre_ftl_desc:0 "Nền văn minh này vẫn chưa có khả năng du hành vũ trụ, tuy nhiên chỉ cần một chút khích lệ hoặc chờ đợi đủ lâu, họ có thể sẽ bước lên vũ đài của thiên hà."

 origin_void_dwellers:0 "Cư dân Không gian"
 origin_void_dwellers_desc:1 "Nền văn minh này kể từ khi có ghi chép đã xem không gian như nhà của mình - họ vô cùng căm ghét cuộc sống trong môi trường hành tinh điển hình. Họ đã sống trên một vài trạm cư trú trên quỹ đạo, và chỉ mới liên kết lại thành một khối thống nhất gần đây."
 origin_tooltip_void_dwellers_effects:9 "—$HOMEWORLD$['concept_pc_habitat']$NEW_LINE$—$SPECIES_TRAITS$$TABBED_NEW_LINE$—['concept_void_dweller', $trait_void_dweller_1$]$TABBED_NEW_LINE$—['concept_habitat_preference', $trait_pc_habitat_preference$]$NEW_LINE$—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_habitat_1', £engineering_research£$tech_habitat_1$]$NEW_LINE$—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_habitat_2', £engineering_research£$tech_habitat_2$]$NEW_LINE$—['concept_guaranteed_colonies']: Các hệ sao có nguồn tài nguyên phong phú sẽ thay thế cho các hành tinh có thể định cư$NEW_LINE$—$ap_voidborn_habitat_effect$"
 trait_void_dweller_1:0 "Cư dân Không gian"
 trait_void_dweller_1_desc:2 "§LGiống loài này sinh sôi nảy nở trên các trạm cư trú trên quỹ đạo, họ sở hữu một bản năng có thể nhanh chóng xác định được phương hướng trong những hành lang mê cung và các cấu trúc kiến trúc phức tạp. Họ sống như cá gặp nước trong môi trường không trọng lực, nhưng lại không thể thích nghi tốt với môi trường hành tinh.§!"
 void_dweller_trait_tooltip:0 "Độ Hạnh phúc của dân số trên các hành tinh phi nhân tạo: §R-30%§!\n$void_dweller_bonus_workforce_tt$"
 void_dweller_bonus_workforce_tt: "$t$—$MOD_POP_BONUS_WORKFORCE_MULT$ trên trạm cư trú: §G+15%§!\n$t$—$MOD_POP_BONUS_WORKFORCE_MULT$ trên các hành tinh phi nhân tạo: §R-15%§!"
 origin_void_machines: "Máy móc Không gian"
 origin_void_machines_desc: "Ban đầu, những người sáng tạo ra nền văn minh máy móc này đã thiết kế chúng để phục vụ cho các chuyến du hành ngoài không gian, được tối ưu hóa hoàn toàn để có thể hoạt động trơn tru trong môi trường không trọng lực. Sau khi trải qua nhiều kỷ nguyên bị cô lập, những cỗ máy này gần đây đã đoàn kết lại với nhau trên một vài trạm cư trú trên quỹ đạo nằm rải rác trong hệ sao quê hương của chúng."
 origin_tooltip_void_machines_effects: "—$HOMEWORLD$['concept_pc_habitat']$NEW_LINE$—$SPECIES_TRAITS$$TABBED_NEW_LINE$—['concept_void_dweller_2',$trait_void_dweller_2$]$TABBED_NEW_LINE$—['concept_habitat_preference',$trait_pc_habitat_preference$]$NEW_LINE$—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_habitat_1',£engineering_research£$tech_habitat_1$]$NEW_LINE$—$GUARANTEED_RESEARCH_OPTION_STRING$['concept_habitat_2',£engineering_research£$tech_habitat_2$]$NEW_LINE$—['concept_guaranteed_colonies']: Các hệ sao có nguồn tài nguyên phong phú sẽ thay thế cho các hành tinh có thể định cư$NEW_LINE$—$ap_voidborn_habitat_effect$"
 trait_void_dweller_2:1 "Tối ưu hóa Không trọng lực"
 trait_void_dweller_2_desc:1 "§LNhững cỗ máy này phát triển mạnh mẽ trên các trạm cư trú trên quỹ đạo, các thuật toán lập trình của chúng có thể điều hướng một cách hiệu quả trong những hành lang mê cung và các công trình kiến trúc phức tạp. Tuy nhiên, cấu trúc được tối ưu hóa của chúng lại không phù hợp với môi trường hành tinh.§!"
 void_dweller_2_trait_tooltip: "Phí duy trì người máy trên các hành tinh phi nhân tạo: §R+15%§!\n$void_dweller_bonus_workforce_tt$"
