 thesis_souls2:0 "Tinh hoa được chắt lọc qua năm tháng của quặng sắt"
 thesis_souls3:0 "Đặc tính vật lý của sự phát triển"
 thesis_souls4:0 "Góc nhìn tối giản về khái niệm lao động cực nhọc"
 thesis_souls5:0 "Truyền bá thánh ngôn giữa các dạng sống vi sinh vật"
 thesis_souls6:0 "Tính hai mặt của tri giác và vệ sinh"
 thesis_souls7:0 "Giá trị của nghĩa trang trong xã hội hậu thăng hoa"
 thesis_souls8:0 "Tôn thờ chòm sao trong kỷ nguyên giữa các vì sao"
 thesis_war1:0 "Chiến tranh và hòa bình trong mối liên hệ với sự lây lan của vi khuẩn"
 thesis_war2:0 "Vật thể phóng ra như những dấu câu"
 thesis_war3:0 "Ca ngợi vệ sinh cộng đồng"
 thesis_war4:0 "Thiền định dưới chế độ quân sự"
 thesis_war5:0 "Phòng thủ quyết liệt như một chiến lược kỹ thuật dân dụng"
 thesis_war6:0 "Phô diễn sức mạnh trong nông nghiệp"
 thesis_war7:0 "Chiến lược phòng thủ vì mục đích tuyên truyền nội bộ"
 thesis_war8:0 "Thương lượng hòa bình quyết liệt của điểm kỳ dị"
 thesis_xenos1:0 "Sự kỳ lạ bên ngoài màng bọc điện từ"
 thesis_xenos2:0 "Sự hy sinh tính đồng nhất văn hóa trong bữa ăn hàng ngày"
 thesis_xenos3:0 "Những khoảng lặng khó xử như một sự đánh giá về vị thế xã hội"
 thesis_xenos4:0 "Giá trị văn hóa của các đồng vị hiếm"
 thesis_xenos5:0 "Dân tộc sống trong các cấu trúc hang động dưới lòng đất"
 thesis_xenos6:0 "Sự vô nghĩa của các ranh giới chính trị trong dải ngân hà"
 thesis_xenos7:0 "Mô hình nhập khẩu hàng hóa trong tương lai từ nhiều hệ sao"
 thesis_xenos8:0 "Giao tiếp xuyên qua lỗ sâu"
 thesis_machine1:0 "Siêu tổ hợp của các nguyên tố phi tinh thể trong mạng cục bộ cá nhân"
 thesis_machine2:0 "Sự lan truyền sóng điện từ bên trong thiết bị kết dính"
 thesis_machine3:0 "Hiệu ứng Doppler như một nguồn giải trí"
 thesis_machine4:0 "Học cách bơi trong biển chữ của thông tin"
 thesis_machine5:0 "Ứng dụng của pin điện áp cao đối với đời sống thực vật chưa có trí tuệ"
 thesis_hive1:0 "Phân hủy sinh học như một phương pháp kiểm soát giao thông không gian"
 thesis_hive2:0 "Tội lỗi được nhìn thấu như một động lực để khẳng định sức khỏe thể chất"
 thesis_hive3:0 "Những lập luận ủng hộ và phản đối về hợp chất flavonoid trong cơ thể"
 thesis_hive4:0 "Mối nguy hiểm vốn có của suy nghĩ cá nhân, và tóm tắt của những lý thuyết tương tự"
 thesis_hive5:0 "Hôn ước giao thông không gian ở góc độ cá nhân"
 thesis_megacorp1:0 "Định hướng uy tín thông qua mô hình nhận thức"
 thesis_megacorp2:0 "Sự phối hợp trục đa dạng của các tỷ lệ lý thuyết"
 thesis_megacorp3:0 "Các cấp độ tiến bộ hiệp đồng trong quá trình tinh chỉnh tài sản"
 thesis_megacorp4:0 "Dự phóng dòng chảy động lực dưới chủ nghĩa hoài nghi quyết liệt"
 thesis_megacorp5:0 "Hồ thủy triều và những bài học chúng có thể mang lại về việc tiếp cận người dùng hàng ngày"

