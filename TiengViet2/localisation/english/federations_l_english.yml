 ### Feral Overload Colony Event Chain text
 feral_overload_00:0 "Số Ít Gào Rú"
 feral_overload_00_desc:0 "Một phần nhỏ dân cư dạo này có vẻ hơi... nguyên thủy."

 feral_overload_01:0 "Phần Lớn Gầm Rú"
 feral_overload_01_desc:0 "Một lượng lớn cư dân bắt đầu hành xử như thú dữ giữa chốn đông người."

 feral_overload_02:0 "Khủng Hoảng Nhỏ"
 feral_overload_02_desc:0 "Nhờ vào khoa học kỹ thuật, người dân đã được hưởng những tác động tích cực từ mạch nấm hang động mang lại."

 colony.8001.name:0 "Bản Năng Trỗi Dậy"
 colony.8001.desc:0 "Báo cáo từ thuộc địa [Planet.GetName] cho thấy: 'hiện tượng thoái biến sơ khai' trên hành tinh đang ngày một gia tăng. Rõ ràng là một bộ phận lớn cư dân bỗng bộc lộ dục vọng cùng sự hung hãn dữ dội chưa từng thấy, mà không ai hiểu nguyên nhân vì sao."
 colony.8001.a:0 "Tiếp tục điều tra."
 colony.8002.name:0 "Bạo Lực Lan Rộng"
 colony.8002.desc:0 "Hiện tượng thoái biến sơ khai trên [Planet.GetName] vẫn chưa có dấu hiệu dừng lại. Thực tế kể từ bản báo cáo trước, tình hình càng lúc càng tồi tệ hơn. Các hành vi bừa bãi và bạo lực diễn ra từng giờ từng phút, cuốn theo phần lớn cư dân chìm trong hỗn loạn."
 colony.8002.a:0 "Tình hình đang dần mất kiểm soát."
 colony.8003.name:0 "Điên Hết Cả Rồi!"
 colony.8003.desc:0 "Tình hình trên [Planet.GetName] đang tuột khỏi tầm kiểm soát với tốc độ chóng mặt. Bất kể thứ gì đứng sau cơn cuồng loạn nguyên thủy này, nó cũng đã lây lan sang một lượng lớn cư dân và khiến thuộc địa bắt đầu tan rã. Vì thế, hoặc là chúng ta hành động ngay, hoặc là sẽ mất trắng [Planet.GetName]."
 colony.8003.a:0 "Được rồi, bắt tay vào làm thôi!"
 colony.8004.name:0 "Bào Tử Cuồng Bạo"
 colony.8004.desc:0 "Cuộc điều tra về hiện tượng thoái biến sơ khai kỳ lạ quấy nhiễu [Planet.GetName] đã hoàn tất. Chúng ta phát hiện một loài nấm bí ẩn trong mạng lưới hang ngầm chằng chịt khắp vỏ hành tinh. Chúng mọc ken đặc khắp các hang động — từ mặt đất, vách đá cho tới trần hang, trải dài hàng nghìn dặm.\n\nLoài nấm này liên tục phun các đám bào tử thoát ra ngoài hang mà chưa rõ mục đích. Nhưng có thể chắc chắn rằng chính những bào tử này đã khơi dậy dục vọng nguyên thủy và khiến giống loài chúng ta thoái hóa dã tính.\n\nChúng ta có thể tìm cách tận dụng loài nấm này, hoặc thẳng tay quét sạch toàn bộ."
 colony.8004.a:0 "Để chúng tồn tại..."
 colony.8004.b:0 "...hoặc tận diệt chúng."
 colony.8005.name:0 "Làn Mây Dục Vọng"
 colony.8005.desc:0 "Hàng loạt công trình sản xuất đã được dựng lên ngay tại các cửa hang có nấm sinh sôi. Bên cạnh việc lọc và kiểm soát sự phát tán bào tử, các nhà máy này còn chuyển hóa lượng mây bào tử dư thừa thành nguồn §HKhí hiếm ngoài hành tinh§! hữu ích.\n\nNhờ việc những cư dân đầy khát khao trên [Planet.GetName] được thỏa mãn dục vọng thường xuyên hơn, tốc độ tăng dân số đã được đẩy mạnh. Dẫu vậy, mặt trái đáng tiếc là các hành vi bạo lực trên [Planet.GetName] cũng sẽ xảy ra dày đặc hơn."
 colony.8005.a:0 "Đó là cái giá của sự phát triển."
 colony.8006.name:0 "Ngọn Lửa Thanh Tẩy"
 colony.8006.desc:0 "Kế hoạch thiêu rụi toàn bộ nấm hang động đã hoàn tất, loài nấm kích động bản năng hoang dã này nay đã bị quét sạch hoàn toàn.\n\nTình cờ thay, sau khi dọn sạch các hang động, chúng ta phát hiện nơi đây ẩn giấu những vỉa quặng thượng hạng, nay đã có thể được khai thác triệt để hơn."
 colony.8006.a:0 "Tuyệt vời!"

 INVESTIGATE_CAVE_SHROOM_PROJECT:0 "Truy Tìm Nguồn Căn"
 INVESTIGATE_CAVE_SHROOM_PROJECT_DESC:0 "Đã đến lúc tìm hiểu xem điều gì đang khiến cư dân trên thuộc địa [Root.GetName] có những hành vi kỳ quặc và hung hãn đến vậy."

 UTILIZE_CAVE_SHROOM_PROJECT:0 "Tận Dụng Nấm Hang Động"
 UTILIZE_CAVE_SHROOM_PROJECT_DESC:0 "Các nhà khoa học của chúng ta sẽ nghiên cứu tác động nguyên thủy từ loài nấm hang động này để tìm ra cách tận dụng có lợi nhất."

 EXTERMINATE_CAVE_SHROOM_PROJECT:0 "Tiêu Diệt Nấm Hang Động"
 EXTERMINATE_CAVE_SHROOM_PROJECT_DESC:0 "Một kế hoạch sẽ được khởi động nhằm thiêu đốt toàn bộ nấm trong các hang ngầm cho tới khi sạch bóng hoàn toàn."

 feral_overload_chain_title:0 "Bùng Phát Dã Tính"
 feral_overload_chain_desc:0 "Những hành vi cuồng bạo và hoang dã xuất hiện ở cư dân [Root.GetName] chắc chắn có nguyên do đằng sau. Nếu không sớm ngăn chặn, nó sẽ biến cả vùng thuộc địa thành một đống đổ nát."

 d_spore_vents:0 "Miệng Xả Bào Tử"
 d_spore_vents_desc:0 "Bào tử nấm sẽ được tinh chế để phục vụ cho các hoạt động sản xuất."
 d_cave_shroom_veins:0 "Mạch Quặng Hang Nấm"
 d_cave_shroom_veins_desc:0 "Dọn sạch nấm trong hang động để khai mở những mạch quặng chất lượng cao ẩn giấu bên dưới."

 job_gas_plant_engineer:0 "Kỹ Sư Nhà Máy Khí"
 job_gas_plant_engineer_plural:0 "Kỹ Sư Nhà Máy Khí"
 job_gas_plant_engineer_desc:0 "Những công nhân này vận hành các tổ hợp lọc khổng lồ được xây ngay trên miệng xả bào tử của nấm hang động."
