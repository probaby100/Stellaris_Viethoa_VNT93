 origin_tree_of_life:0 "Cây Sự sống"
 origin_tree_of_life_desc:0 "Tâm trí tổ đàn này đã tiến hóa thành một mối quan hệ cộng sinh với một loài cây khổng lồ. Cây cổ thụ này mang lại cho họ rất nhiều lợi ích, nhưng nếu mất đi nó, họ sẽ bị suy sụp hoàn toàn."
 origin_tooltip_tree_effects:4 "—$HOMEWORLD$['concept_tree_of_life']$NEW_LINE$—Hành tinh đã thuộc địa hóa: Đặc trưng hành tinh ['concept_tree_of_life_sapling']$NEW_LINE$—Thuộc địa thiếu §YMầm cây Sự sống§!: Quyết định hành tinh ['concept_transplant_tree_of_life']$NEW_LINE$—Trên các thuộc địa chư hầu $AVAILABLE_HOLDINGS$['concept_tree_of_life_holding', £building£$holding_tree_of_life_sapling$]"
 origin_tooltip_tree_negative_effects: "—Thuộc địa thiếu §YMầm Cây Sự sống§!: Hệ số hành tinh ['concept_no_lifetree']"

 origin_lithoid:0 "Tai ương Giáng trần"
 origin_lithoid_desc:2 "Không phải là những cư dân bản địa của \"thế giới mẹ\", những sinh vật đá này đã du hành đến hành tinh này cùng với một quả thiên thạch, đồng thời quét sạch phần lớn các sinh vật sống bản địa."
 origin_tooltip_lithoid_effects:4 "—$HOMEWORLD$$TABBED_NEW_LINE$—['concept_massive_crater']$TABBED_NEW_LINE$—['concept_buried_lithoids']: +4$NEW_LINE$—Mở khóa Tàu thực dân: §YTiểu hành tinh Sinh vật đá§!$NEW_LINE$—Các hành tinh được thuộc địa hóa bằng §YTiểu hành tinh Sinh vật đá§!:$TABBED_NEW_LINE$—§Y$concept_buried_lithoids$§!: +2$TABBED_NEW_LINE$—$PLANETARY_MODIFIERS$['concept_lithoid_crater']$NEW_LINE$—Trên các thuộc địa (chư hầu) $AVAILABLE_HOLDINGS$['concept_experimental_crater', £building£$holding_experimental_crater$]"

 origin_machine:0 "Hợp nhất Tài nguyên"
 origin_machine_desc:1 "Trí tuệ máy móc này từ lâu đã hợp nhất toàn bộ tài nguyên trong hệ sao mẹ của chúng vào hành tinh thủ đô, bao phủ nơi đây hoàn toàn bằng máy móc."
 origin_tooltip_machine_effects:3 "—$HOMEWORLD$$TABBED_NEW_LINE$—['concept_prototype_pc_machine']$TABBED_NEW_LINE$—$PLANETARY_FEATURES$['concept_consolidated_resources']$TABBED_NEW_LINE$—Nếu kết hợp với ý thức hệ §I$civic_machine_assimilator$§!:$TABBED_NEW_LINE$$t$—$PLANETARY_FEATURES$['concept_organic_slurry']\n—Miễn trừ yêu cầu §YCông nghệ§! của thiên phú thăng thiên §Y$ap_machine_worlds$§!"
 origin_tooltip_machine_negative_effects: "—Các hành tinh ['concept_pc_molten', Hành tinh Nóng chảy] hoặc ['concept_pc_barren', Hành tinh Cằn cỗi] trong $HOME_SYSTEM$ sẽ không có bất kỳ tài nguyên nào."

 d_machine_prototype_pc_machine: "Máy móc Nguyên mẫu"
 d_machine_prototype_pc_machine_desc: "$pc_machine$ vẫn chưa được hoàn thành."

 d_machine_ongoing_construction: "Công trình chưa Hoàn thiện"
 d_machine_ongoing_construction_desc: "Các máy móc cấu thành nên khu vực này của thế giới vẫn chưa được hoàn thiện."

 d_arcane_generator:0 "Máy phát điện Bí ẩn"
 d_arcane_generator_desc:0 "Cỗ máy cổ đại này dường như đáp ứng các nhu cầu của chúng ta bằng cách sản xuất ra những tài nguyên cần thiết để duy trì các phân đoạn của chúng ta."
 d_decrepit_tunnels_1:1 "£blocker£ Đường hầm Tồi tàn"
 d_decrepit_tunnels_1_desc:0 "Những đường hầm cổ xưa và tồi tàn này chưa từng được khám phá hay dọn dẹp hoàn toàn."
 d_decrepit_tunnels_2:0 "$d_decrepit_tunnels_1$"
 d_decrepit_tunnels_2_desc:1 "Những đường hầm cổ xưa và tồi tàn này cần được khám phá kỹ lưỡng và dọn dẹp sạch sẽ."
 d_decrepit_tunnels_3:0 "$d_decrepit_tunnels_1$"
 d_decrepit_tunnels_3_desc:0 "$d_decrepit_tunnels_1_desc$"
 d_segment_rubble_1:0 "£blocker£ Phế tích Cổ đại"
 d_segment_rubble_1_desc:0 "Máy móc hỏng hóc và nhiều mảnh vỡ khác đang cản trở công nhân sử dụng toàn bộ phân đoạn."
 d_segment_rubble_1_small:0 "$d_segment_rubble_1$"
 d_segment_rubble_1_small_desc:0 "$d_segment_rubble_1_desc$"
 d_segment_rubble_2:0 "$d_segment_rubble_1$"
 d_segment_rubble_2_desc:0 "$d_segment_rubble_1_desc$"
 d_segment_rubble_3:0 "$d_segment_rubble_1$"
 d_segment_rubble_3_desc:0 "$d_segment_rubble_1_desc$"
 d_segment_rubble_4:0 "$d_segment_rubble_1$"
 d_segment_rubble_4_desc:0 "$d_segment_rubble_1_desc$"
 arcane_generator_upkeep_desc:0 "Chiếc §Y$d_arcane_generator$§! này sẽ được điều chỉnh để có thể cung cấp chi phí bảo trì cho phân đoạn này."
 d_tree_of_life_home:0 "Cây Sự sống"
 d_tree_of_life_home_desc:0 "Cây cổ thụ này đã che chở và hỗ trợ tổ đàn qua vô số thế hệ."
 d_tree_of_life_colony:2 "$d_tree_of_life_home$"
 d_tree_of_life_colony_desc:1 "Một nhánh của cây cổ thụ, được tổ đàn cấy ghép đến nơi này."
 d_lithoid_crater:0 "Hố Thiên thạch Khổng lồ"
 d_lithoid_crater_desc:0 "Điểm va chạm của khối thiên thạch đã mang các sinh vật đá đến hành tinh này."
 d_lithoid_crater_custom_tooltip: "$t$Tăng cường hiệu ứng tích cực của §YĐặc điểm Sinh vật đá§! thêm §G+50%§!"
 d_buried_lithoids:2 "£blocker£ Sinh vật đá Bị chôn vùi"
 d_buried_lithoids_desc:0 "Những sinh vật đá này đã bị chôn sâu dưới lòng đất sau khi rơi xuống từ quỹ đạo."
 lithoid_crater:0 "Hố Thiên thạch Sinh vật đá"
 lithoid_crater_desc:0 "Hố thiên thạch khổng lồ này là dấu tích để lại của một khối thiên thạch mang theo các sinh vật đá lao xuống hành tinh này với tốc độ cao."
 lithoid_colonizer:0 "Thiên thạch Sinh vật đá"
 lithoid_colonizer_plural:0 "Thiên thạch Sinh vật đá"
 d_machine_minerals:1 "Tài nguyên Hợp nhất"
 d_machine_minerals_desc:0 "Tất cả sự giàu có về khoáng sản tinh chế trong toàn bộ hệ sao đều hội tụ tại đây, chất cao thành đống với kích thước bằng cả một lục địa."
 d_organic_slurry:1 "Bùn Hữu cơ"
 d_organic_slurry_desc:0 "Một đại dương bùn hữu cơ, là sản phẩm phụ từ quá trình xử lý toàn bộ xác chết của các sinh vật từng tồn tại trên hành tinh này."
 d_resource_consolidation_1:2 "£blocker£ Khoang Sao chép Lỗi"
 d_resource_consolidation_1_desc:0 "Khoang sao chép được xây dựng trên hành tinh máy móc này hiện đang trong tình trạng hỏng hóc, không ngừng sản xuất ra hàng đống $MACHINE_hand_plural$."
 d_malfunctioning_reactor:0 "Lò phản ứng Gặp trục trặc"
 d_malfunctioning_reactor_desc:0 "Lò phản ứng cung cấp năng lượng cho hệ thống kiểm soát khí hậu và trọng lực phức tạp của phân đoạn này hiện không thể hoạt động bình thường. Điều kiện thời tiết khắc nghiệt cùng với trọng lực trồi sụt thất thường đã khiến những người định cư gặp vô vàn khó khăn khi muốn bám trụ tại nơi đây."
 d_malfunctioning_reactor_tooltip:0 "§R$MISSING_TECHNOLOGY$: $tech_zero_point_power$§!"
 d_sr_diurnal_regulator:0 "Máy điều hòa Ngày đêm Hỏng hóc"
 d_sr_diurnal_regulator_desc:0 "Tấm chắn khổng lồ quản lý chu kỳ ngày đêm của phân đoạn này đã trôi dạt khỏi quỹ đạo. Một phần của phân đoạn này luôn phải phơi mình dưới ánh sáng, và đã bị thiêu rụi do tiếp xúc với ánh mặt trời suốt nhiều thế kỷ qua."
 d_sr_diurnal_regulator_tooltip:0 "§R$MISSING_TECHNOLOGY$: $tech_thrusters_2$§!"
 d_sr_vacuum_fields:0 "Trường Chân không Bất ổn"
 d_sr_vacuum_fields_desc:0 "Khu vực này thường xuyên phải hứng chịu hiện tượng giảm áp, do trường lực phức tạp vốn có nhiệm vụ bảo vệ nơi đây khỏi môi trường chân không của vũ trụ hiện đang vô cùng bất ổn."
 d_sr_vacuum_fields_tooltip:0 "§R$MISSING_TECHNOLOGY$: $tech_shields_2$§!"
 d_sr_ring_gyros:0 "Con quay Hồi chuyển Vành đai Lệch chuẩn"
 d_sr_ring_gyros_desc:0 "Con quay hồi chuyển trục trặc đã làm thay đổi vị trí của phân đoạn này trong thế giới vành đai, gây ra sự uốn cong và sụp đổ ở nhiều khu vực có thể cư trú được."
 d_sr_ring_gyros_tooltip:0 "§R$MISSING_TECHNOLOGY$: $tech_starbase_3$§!"
 d_sr_power_grid:0 "Thiếu hụt Lưới điện"
 d_sr_power_grid_desc:0 "Lưới điện cung cấp năng lượng cho phân đoạn này đã bị hư hại, dẫn đến tình trạng thiếu điện và mất điện thường xuyên."
 d_sr_power_grid_tooltip:0 "§R$MISSING_TECHNOLOGY$: $tech_power_hub_1$§!"

 juggernaut_cap: "$juggernaut$"
 juggernaut:0 "Juggernaut"
 juggernaut_plural:0 "Juggernaut"
 juggernaut_logistics: "Hậu cần Juggernaut"
 mega_shipyard_0:0 "Nền móng $mega_shipyard_3$"
 mega_shipyard_0_DESC:0 "Nền móng xây dựng này sẽ được sử dụng làm cơ sở cho quá trình xây dựng $mega_shipyard_3$ trong tương lai."
 mega_shipyard_0_MEGASTRUCTURE_DETAILS:1 "Một căn cứ sao khổng lồ, chuyên dành cho việc đóng tàu, §Y$mega_shipyard_3$§! này sở hữu tới 20 ụ nổi dùng để chế tạo và nâng cấp phi thuyền."
 mega_shipyard_1:0 "Khung sườn $mega_shipyard_3$"
 mega_shipyard_1_DESC:0 "Khung sườn sơ bộ của $mega_shipyard_3$ này đã đặt nền móng vững chắc cho nhà máy đóng tàu có năng suất cao nhất toàn ngân hà trong tương lai."
 mega_shipyard_2:0 "Lõi $mega_shipyard_3$"
 mega_shipyard_2_DESC:0 "Phần lõi của $mega_shipyard_3$ chứa một lượng lớn các cơ sở hạ tầng thiết yếu để di chuyển và xử lý nguồn nguyên liệu khổng lồ phục vụ cho các ụ nổi sản xuất."
 mega_shipyard_3:0 "Siêu Xưởng Đóng Tàu"
 mega_shipyard_3_DESC:0 "Với vô số ụ nổi sản xuất phi thuyền lấy nguyên liệu từ lõi xử lý siêu hiệu quả, sản lượng của siêu xưởng đóng tàu này sẽ làm lu mờ tất cả các căn cứ sao khác."
 mega_shipyard_ruined:0 "$mega_shipyard_3$ Bị tàn phá"
 mega_shipyard_ruined_DESC:0 "Trừ phi được sửa chữa toàn diện, nếu không $mega_shipyard_3$ này sẽ không thể chế tạo thêm bất kỳ phi thuyền nào."
 mega_shipyard_ruined_MEGASTRUCTURE_DETAILS:0 "$mega_shipyard_3$ này đã qua rồi thời kỳ hoàng kim. Trừ phi được sửa chữa toàn diện, nếu không nó sẽ không thể sản xuất thêm bất kỳ phi thuyền nào."
 mega_shipyard_restored:0 "$mega_shipyard_3$"
 mega_shipyard_restored_DESC:0 ""
 requires_no_existing_mega_shipyard:0 "$TRIGGER_FAIL$Chỉ có thể xây dựng tối đa một siêu xưởng đóng tàu."
 feda.1.name:0 "$mega_shipyard_1$"
 feda.1.desc:0 "Giai đoạn đầu tiên của $mega_shipyard_3$ đã hoàn tất. Sau khi các khoang chế tạo được lắp ráp vào bộ khung khổng lồ này, cơ sở này một ngày nào đó sẽ trở thành trung tâm sản xuất phi thuyền của toàn bộ thiên hà."
 feda.2.name:0 "$mega_shipyard_2$"
 feda.2.desc:0 "Phần lõi của $mega_shipyard_3$ đã vào vị trí, phần việc còn lại chỉ là lắp đặt thêm một lượng lớn các ụ nổi chế tạo phi thuyền."
 feda.3.name:0 "$mega_shipyard_3$ Đã đi vào Hoạt động"
 feda.3.desc:0 "$mega_shipyard_3$ hiện đã đi vào hoạt động toàn diện, nó có khả năng chế tạo ra một lượng phi thuyền với số lượng chưa từng có."

 # Encountering Ruined Mega Shipyard
 feda.5.name:0 "$mega_shipyard_ruined$"
 feda.5.a.desc:2 "Đã phát hiện một công trình khổng lồ với thiết kế ngoài hành tinh tại [mega_shipyard_system.GetName]. Bất chấp việc nó đã xuống cấp, các nhà khoa học của chúng ta vẫn khẳng định rằng siêu cấu trúc này thực chất là một tổ hợp bao gồm nhiều nhà máy đóng tàu - một §Y$mega_shipyard_3$§!.\n\nNếu chúng ta có được kiến thức và năng lực công nghiệp để sửa chữa siêu cấu trúc này, năng lực sản xuất của chúng ta sẽ được nâng lên một tầm cao mới."
 feda.5.b.desc:3 "Đã phát hiện một cấu trúc §Y$mega_shipyard_3$§! khổng lồ tại [mega_shipyard_system.GetName] - với thiết kế tương tự như những gì chúng ta đang xây dựng. Dù nó đã cũ nát và không thể sử dụng được nữa, nhưng chỉ cần cung cấp đủ tài nguyên, chúng ta hoàn toàn có thể khôi phục nó trở lại trạng thái hoạt động!"
 feda.5.c.desc:0 "Việc quét nhanh không gian xung quanh cho thấy, siêu cấu trúc này đã phải chịu một đợt quá tải năng lượng nghiêm trọng từ hàng triệu năm trước, rất có thể là do một cơn bão năng lượng quy mô lớn càn quét qua hệ sao gây ra."
 feda.5.a:0 "Hãy tưởng tượng viễn cảnh chúng ta sở hữu tới hai siêu xưởng đóng tàu mà xem!"

