 SENATE_IN_RECESS:0 "Còn £time£$DAYS|Y$ ngày nữa là kết thúc thời gian Thượng viện tạm nghỉ"
 SENATE_IN_RECESS_DESC:0 "§HThượng viện Đang Tạm nghỉ§!\nSau £time£$DAYS|Y$ ngày nữa, nghị quyết có §YTrọng lượng Ngoại giao§! cao nhất trong hàng đợi nghị quyết sẽ được đưa vào Thượng viện để biểu quyết."
