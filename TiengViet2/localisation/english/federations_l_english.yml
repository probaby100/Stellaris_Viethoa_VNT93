 CLICK_TO_LEAVE:0 "§RNhấp để rút khỏi $GALACTIC_COMMUNITY$§!"
 CLICK_TO_LEAVE_DESC:1 "§LNếu bạn rút khỏi $GALACTIC_COMMUNITY$, bạn sẽ không còn nhận được bất kỳ lợi ích nào từ các hệ số đang có hiệu lực, và sẽ không thể gia nhập lại trong vòng §R20 năm§!, đồng thời trọng lượng ngoại giao £diplo_weight£ cũng sẽ phải chịu hình phạt.\n\nNhưng bù lại, bạn sẽ không còn phải chịu bất kỳ tác động tiêu cực nào do vi phạm Luật Thiên Hà.§!\n"
