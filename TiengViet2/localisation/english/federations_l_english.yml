 cave_cleaner: "$job_cave_cleaner$"
 job_cave_cleaner:0 "Người Dọn dẹp Hang động"
 job_cave_cleaner_plural:0 "Công nhân Dọn dẹp Hang động"
 job_cave_cleaner_desc:0 "Những công nhân này có nhiệm vụ dọn dẹp các lối đi hình thành sau khi đốt cháy nấm hang động để tiến hành khai quật các mạch khoáng sản."
