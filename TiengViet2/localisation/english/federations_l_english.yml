 mod_habitat_districts_housing_add: "Nhà ở tạo ra bởi Quy hoạch Trạm Cư trú"
 hab_mining_deposits: "Tài nguyên Khoáng sản trên Trạm Cư trú"
 hab_research_deposits: "Tài nguyên Nghiên cứu trên Trạm Cư trú"
