 resolution_sanctions_tech_1:0 "Chế Tài Nghiên Cứu Mức Nhẹ"
 resolution_sanctions_tech_1_desc:0 "Các đế chế §Rvi phạm Luật Thiên Hà§! cần phải cho phép tiến hành thanh tra định kỳ đối với các cơ sở nghiên cứu của họ, nhằm đảm bảo rằng họ không làm trái với những yêu cầu mà ngân hà đã đặt ra cho họ."

 resolution_sanctions_tech_2:0 "Chế Tài Nghiên Cứu Mức độ Trung bình"
