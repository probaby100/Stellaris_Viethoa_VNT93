 tech_mega_shipyard:0 "Siêu Xưởng Đóng Tàu"
 tech_mega_shipyard_desc:0 "Một siêu xưởng đóng tàu với trường vô trọng lực, có khả năng thực hiện nhiều dự án chế tạo phi thuyền cùng lúc."
 tech_juggernaut:0 "Juggernaut"
 tech_juggernaut_desc:0 "Là một căn cứ không gian di động với kích thước khổng lồ chưa từng có, phi thuyền lớp Juggernaut có thể nâng các chiến dịch tấn công lên một tầm cao hoàn toàn mới."

 tech_advanced_metallurgy_1:0 "Hợp kim Gốm"
 tech_advanced_metallurgy_1_desc:0 "Việc sử dụng rộng rãi gốm cải tiến trong công nghiệp có thể giúp tăng sản lượng luyện kim."
 tech_advanced_metallurgy_2:0 "Hợp kim Thép Chịu lực"
 tech_advanced_metallurgy_2_desc:0 "Sau khi sử dụng công nghệ tối tân để thay thế các thiết bị gốm kim loại lỗi thời, lò nung của chúng ta sẽ hoạt động ở nhiệt độ cao hơn, bền bỉ hơn, từ đó nâng cao năng suất của chúng."
 tech_consumer_good_refinement_1:0 "Thuật toán Phân tích Thị trường"
 tech_consumer_good_refinement_1_desc:0 "Trí tuệ nhân tạo quản lý cơ bản có thể được sử dụng để tinh giản đường cung và cầu, giảm thiểu lãng phí."
 tech_consumer_good_refinement_2:0 "Dự đoán Tiêu dùng"
 tech_consumer_good_refinement_2_desc:0 "Thông qua trí tuệ nhân tạo cao cấp, chúng ta có thể đưa ra những dự đoán đáng tin cậy ngay cả khi nhu cầu tiêu dùng chưa xuất hiện."

