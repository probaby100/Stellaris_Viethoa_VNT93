 resolution_rulesofwar_repeal_5_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_rulesofwar_demobilization_initiative$§!, biến §Y$resolution_rulesofwar_last_resort_doctrine$§! trở thành Luật Thiên Hà."

 resolution_rulesofwar_guardian_angels:0 "Đạo luật Thiên thần Hộ mệnh"
 resolution_rulesofwar_guardian_angels_desc: "Những binh sĩ đã cống hiến sinh mạng của mình để bảo vệ hòa bình cho hành tinh của chúng ta phải được mọi người ghi nhớ và tôn vinh."

 resolution_rulesofwar_reverence_for_life:0 "Trân trọng Sự sống"
 resolution_rulesofwar_reverence_for_life_desc:0 "Chiến tranh giữa các đế chế tầm cỡ liên sao là một thứ gì đó vô cùng khủng khiếp. Chúng ta nên làm mọi cách có thể để tránh bị lôi kéo vào những cuộc xung đột trực diện như vậy."
 resolution_rulesofwar_reverence_for_life_tooltip:0 "Việc sử dụng §YThanh trừng§! (ngoại trừ trục xuất) và §YVũ khí Tàn phá Hành tinh§! sẽ bị §Rcấm§!."

 resolution_rulesofwar_independent_tribunals:0 "Tòa án Quân sự Độc lập"
 resolution_rulesofwar_independent_tribunals_desc:0 "Tội ác do binh lính gây ra phải được đền tội bằng công lý, những thương vong của dân thường phải được tính đến. Chúng ta nên thành lập các tòa án độc lập để điều tra, xét xử và trừng trị các tội ác chiến tranh."
 resolution_rulesofwar_independent_tribunals_tooltip: "Các tư thế oanh tạc §YPhán Quyết Cuối Cùng§! và §YKhông Phân Biệt§!, sử dụng bất kỳ vũ khí Colossus nào ngoài §YBình Định Toàn Cầu§!, khai hỏa §Y$dyson_gun_0$§!, và sử dụng §Y$arkship_exodus_jump$§! đều bị §Rcấm§!."

 resolution_rulesofwar_last_resort_doctrine:0 "Học thuyết Giải pháp Cuối cùng"
 resolution_rulesofwar_last_resort_doctrine_desc:0 "Chiến tranh là giải pháp cuối cùng chỉ được cân nhắc sử dụng khi tất cả các phương thức ngoại giao khác đều đã thất bại. Tuyệt đối không bao giờ được phép sử dụng giải pháp này cho những mục đích bất chính."
 resolution_rulesofwar_last_resort_doctrine_tooltip:0 "Học thuyết chiến tranh §YChiến tranh Không giới hạn§! bị §Rcấm§!."

 resolution_rulesofwar_demobilization_initiative:0 "Sáng kiến Giải ngũ"
 resolution_rulesofwar_demobilization_initiative_desc:0 "Những nguồn lực hiện đang bị lãng phí cho chiến tranh sẽ có thể được sử dụng tốt hơn vào vô số các dự án khác nhằm cải thiện chất lượng cuộc sống của người dân. Chúng ta nên thắt chặt các hạn chế đối với sự phát triển quân sự, và tập trung vào việc cải thiện vạn vật thay vì phá hủy chúng."
 resolution_rulesofwar_demobilization_initiative_tooltip:0 "Chính sách kinh tế §YKinh tế Quân sự§! bị cấm."

 # Galactic Reforms

 resolution_category_galacticreforms:0 "Cải cách Ngân hà"

 resolution_category_denouncements:0 "Lên án"

 resolution_council_denouncement:0 "Hội đồng Lên án"
 resolution_council_denouncement_desc:1 "[global_event_country.GetGalCouncilOrImpCouncil] có thể đưa ra một nghị quyết nhằm lên án các thành viên không thân thiện trong [global_event_country.GetGalCommunityOrGalImperium], nếu nghị quyết được thông qua, họ sẽ dễ dàng phải hứng chịu những lệnh trừng phạt đã được ban hành.\n\nDĩ nhiên, quyền lực này sẽ không bị lạm dụng."

 resolution_galacticreforms_abolish_council:0 "§RBãi bỏ Hội Đồng Thiên Hà§!"
 resolution_galacticreforms_abolish_council_desc:0 "Hội Đồng Thiên Hà là một thực thể phi dân chủ, nó cần phải bị bãi bỏ."
 resolution_galacticreforms_abolish_council_tooltip:0 "Hội Đồng Thiên Hà sẽ không còn tồn tại."
 resolution_galacticreforms_form_council:0 "Thành lập Hội Đồng Thiên Hà"
 resolution_galacticreforms_form_council_desc:0 "Cộng Đồng Thiên Hà bắt buộc phải có một hội đồng gồm những nhà lãnh đạo để duy trì trật tự."
 resolution_galacticreforms_form_council_tooltip:0 "Thành lập một §YHội Đồng Thiên Hà§! bao gồm ba đại biểu.\n\nBan đầu, Hội đồng sẽ nắm giữ quyền lực để thực thi các §YBiện pháp Khẩn cấp§!, §YNghị Quyết Trừng phạt§! và §YCông khai Lên án§!."

 resolution_galacticreforms_disable_council_veto:0 "§RThu hồi Quyền Phủ quyết của Hội đồng§!"
 resolution_galacticreforms_disable_council_veto_desc:0 "Bản thân quyền phủ quyết của Hội đồng đã là một điều vô cùng lố bịch. Tại sao ý chí của các thành viên khác trong Cộng đồng lại có thể bị bịt miệng một cách tùy tiện như vậy? Phải thu hồi nó ngay lập tức!"
 resolution_galacticreforms_disable_council_veto_tooltip:0 "Các thành viên của Hội Đồng Thiên Hà không còn đặc quyền phủ quyết các nghị quyết đã được đề xuất nữa."
 resolution_galacticreforms_enable_council_veto:0 "Kích hoạt Quyền Phủ quyết của Hội đồng"
 resolution_galacticreforms_enable_council_veto_desc:0 "Hội Đồng Thiên Hà nên nắm giữ quyền lực loại bỏ những nghị quyết vô nghĩa khỏi hàng đợi nghị quyết."

 resolution_galacticreforms_disable_council_denouncement:0 "§RThu hồi Quyền Lên án của Hội đồng§!"
 resolution_galacticreforms_disable_council_denouncement_desc:0 "Các thành viên Hội Đồng Thiên Hà cần phải có lý do chính đáng thì mới có thể đưa ra lời lên án. Chúng ta nên loại bỏ quyền lực bất bình đẳng và độc tài này."
 resolution_galacticreforms_disable_council_denouncement_tooltip:0 "Các thành viên của Hội Đồng Thiên Hà hiện không còn quyền lên án những thành viên Cộng đồng không thân thiện."
 resolution_galacticreforms_enable_council_denouncement:0 "Kích hoạt Quyền Lên án của Hội đồng"
 resolution_galacticreforms_enable_council_denouncement_desc:0 "Chúng ta nên trao cho Hội Đồng Thiên Hà quyền lực để trừng phạt các đế chế côn đồ. Họ nên có quyền đưa ra những lời lên án trong Cộng đồng."
 resolution_galacticreforms_enable_council_denouncement_tooltip:0 "Các thành viên của Hội Đồng Thiên Hà sẽ có quyền lên án những thành viên Cộng đồng không thân thiện."

 resolution_galacticreforms_council_size_1:0 "Thay đổi Quy mô Hội đồng: 1"
 resolution_galacticreforms_council_size_1_desc:0 "Ta chính là thượng viện."
 resolution_galacticreforms_council_size_2:0 "Thay đổi Quy mô Hội đồng: 2"
 resolution_galacticreforms_council_size_2_desc:0 "Nền dân chủ được giới hạn ở quy mô nhỏ mới là một nền dân chủ tốt."
 resolution_galacticreforms_council_size_3:0 "Thay đổi Quy mô Hội đồng: 3"
 resolution_galacticreforms_council_size_3_desc:0 "Hội Đồng Thiên Hà bao gồm ba thành viên là trạng thái lý tưởng nhất."
 resolution_galacticreforms_council_size_4:0 "Thay đổi Quy mô Hội đồng: 4"
 resolution_galacticreforms_council_size_4_desc:0 "Việc chúng ta điều chỉnh số ghế của Hội Đồng Thiên Hà là một điều cần thiết. Bốn thành viên sẽ là một con số thích hợp nhất."
 resolution_galacticreforms_council_size_5:0 "Thay đổi Quy mô Hội đồng: 5"
 resolution_galacticreforms_council_size_5_desc:0 "Hội Đồng Thiên Hà càng có nhiều tiếng nói thì càng tốt."

 resolution_galacticreforms_permanent_seat:0 "Ghế Thường trực Hội đồng"
 resolution_galacticreforms_permanent_seat_desc:0 "Cộng Đồng Thiên Hà đang ngày càng phát triển phồn vinh dưới sự lãnh đạo và che chở của đế chế này. Chúng ta nên trao cho họ một chiếc ghế thường trực trong hội đồng."
 resolution_galacticreforms_revoke_permanent_seat:0 "Thu hồi Ghế Thường trực Hội đồng"
 resolution_galacticreforms_revoke_permanent_seat_desc:0 "Trong thời gian diễn ra cuộc bầu cử nhiệm kỳ mới, các thành viên Hội Đồng Thiên Hà phải chịu trách nhiệm về mọi hành vi của họ. Đế chế này không xứng đáng sở hữu một chiếc ghế thường trực."

