 strange_signal_category:0 "Tín hiệu Đáng chú ý"
 strange_signal_category_desc:0 "Mặc dù [Root.GetName] có vẻ như là một nơi không có ai sinh sống, nhưng máy quét của chúng ta đã nhận được một đoạn tín hiệu được mã hóa, và nó được phát ra từ chính nơi này."

 federations2.1.name:0 "Nỗ lực Vô ích"
 federations2.1.desc:0 "Khi tín hiệu được giải mã, [Root.Leader.GetName] vô cùng ngạc nhiên khi phát hiện ra rằng nó đã luôn phát sóng một dạng ngôn ngữ cổ xưa thuộc ngôn ngữ chính của [Root.Owner.GetSpeciesName]. Nó liên tục phát sóng các từ \"Các ngươi\", \"Các bạn\", \"Khi nào\", dường như đang không ngừng lặp lại một tác phẩm đã bị thất lạc của [shakespeare.GetName] - và tác giả là một nhà viết kịch người [Root.Owner.GetSpeciesName] đã sống cách đây 600 năm.\n\nCó vẻ như thiết bị phát sóng này - một ăng ten vệ tinh đơn giản được bảo vệ bởi một chiếc vỏ bọc nhỏ bé - là cấu trúc phi tự nhiên duy nhất còn sót lại trên [From.GetPlanetMoon]. Không có bất kỳ manh mối nào cho biết ai là người đã để lại thứ này, hoặc vì sao họ lại để lại nó, nhưng dựa trên những dấu vết hao mòn và rách nát trên đó để phán đoán: thiết bị này chắc chắn đã tồn tại kể từ khi vở kịch được viết xong không lâu - thậm chí còn sớm hơn rất nhiều so với thời điểm mà [Root.Owner.GetSpeciesNamePlural] nắm bắt được bí mật của du hành vũ trụ. Chúng ta chỉ có thể đưa ra giả thiết rằng, đây là món quà do những vị khách cổ đại đã từng ghé thăm [Root.Owner.GetHomeWorldName] để lại, họ yêu thích vở kịch này, và do đó đã quyết định dành tặng cho giống loài chúng ta món quà cảm ơn kỳ lạ và đầy bất ngờ này."
 federations2.1.A:0 "Đây là một bằng chứng rõ nét hơn nữa về sự tiến bộ vượt bậc của giống loài [Root.Owner.GetSpeciesName]."
 federations2.1.B:0 "Chết tiệt. Hãy dập tắt ngay cái luận điệu hoang đường về việc người ngoài hành tinh ghé thăm này đi."
 federations2.1.B.tooltip:0 "Có lẽ chúng ta có thể sắp xếp để [Root.Owner.Leader.GetTitle] [Root.Owner.Leader.GetName] \"tình cờ khám phá\" ra văn bản này vào một ngày nào đó..."
 federations2.1.C:0 "Tin tuyệt vời đây! Hãy truyền bá thông điệp này trên toàn quốc."
 federations2.1.D:1 "Một món quà! Chúng ta phải tìm cách để bày tỏ sự biết ơn đối với những người đã ban ơn cho chúng ta."
 gift_from_mysterious_benefactors:0 "Món quà từ Những người Ban ơn Bí ẩn"
 gift_from_mysterious_benefactors_desc:0 "Vào cái thời đại xa xôi trước khi chúng ta đặt chân lên bầu trời sao, một vị khách ngoài hành tinh bí ẩn đã ghé thăm hành tinh của chúng ta, người đó dường như rất có hứng thú đối với nền văn hóa của chúng ta. Trước khi rời khỏi hành tinh của chúng ta, ông ấy đã để lại bằng chứng cho chuyến viếng thăm của mình, nhằm mục đích giúp chúng ta có thể tìm thấy họ vào một thời điểm thích hợp. Thông qua việc này, những kỹ thuật bị thất lạc đã được trao trả lại cho chúng ta, đồng thời cũng tái khẳng định sự tin tưởng của họ đối với tương lai của chúng ta."
 supremacy_reaffirmed_by_gift:0 "Giành Lại Ưu thế"
 supremacy_reaffirmed_by_gift_desc:0 "Một vị khách ngoài hành tinh không xác định đã bày tỏ sự ngưỡng mộ đối với nền văn hóa của chúng ta từ rất lâu trước khi chúng ta bước vào không gian, điều này đã chứng minh một cách đầy đủ về sự ưu việt của giống loài chúng ta."
 ancient_warden_boost:0 "Sự Giám sát Vĩnh hằng"
 site_ruins_of_shallash:0 "Hệ sao Bị Hủy Diệt"
 site_ruined_starsystem_intro:0 "Rõ ràng là, [From.Planet.GetName] đã từng là quê hương của một nền văn minh phát triển cực kỳ rực rỡ. Sáu mặt trăng xoay quanh hành tinh này với một khoảng cách bằng nhau chính là minh chứng rõ ràng nhất cho điều đó. Thế nhưng hành tinh này hiện tại đã biến thành một đống hoang tàn, toàn bộ hệ sao đều in hằn những dấu vết của muôn vàn những cuộc tranh giành và xung đột. Rốt cuộc thì chuyện gì đã xảy ra ở đây?"
 federations2.20.name:0 "Hệ sao [From.GetName]"
 federations2.20.desc:0 "Khi con tàu của chúng ta tiến vào hệ sao [From.GetName], rõ ràng là có một điều gì đó kỳ lạ đang diễn ra. Một trong những hành tinh thuộc hệ sao này sở hữu một lượng lớn các mặt trăng, và hành tinh này dường như đã từng có thể sinh sống được, nhưng hiện tại lại cho thấy mức độ bức xạ khá cao. Một hành tinh khác thì đã bị hủy diệt hoàn toàn. Những mảnh vỡ nằm rải rác trên khắp hệ sao, điều này cho thấy rằng bất kỳ nền văn minh nào từng sinh sống ở đây đều đã bị tiêu diệt trong một cuộc chiến vô cùng khốc liệt.\n\nMột con tàu chiến đang tuần tra trong hệ sao. Nó không hề phản hồi lại bất kỳ yêu cầu liên lạc nào của chúng ta, và quỹ đạo di chuyển của nó cho thấy nó đang trên đường đánh chặn [Root.GetName]. Các hệ thống vũ khí của nó đang được nạp năng lượng."
 federations2.2.name:0 "Khu Phế Tích Trên [From.Planet.GetName]"
 federations2.2.desc:0 "Các cuộc quét trên hành tinh này cùng với các mặt trăng của nó đã chỉ ra rằng, tất cả chúng đều đã từng là những khu định cư đông đúc, dân số của nó thậm chí còn đông đúc hơn cả [Root.Owner.Capital.GetName]. Ngoài ra, những phân tích chi tiết hơn về các mặt trăng cũng cho thấy rằng, quỹ đạo hiện tại của chúng không phải là kết quả của sự kiến tạo tự nhiên. Những mặt trăng này đã bị một thế lực bên ngoài kéo vào quỹ đạo hiện tại, và được định vị một cách chính xác đến mức, cho đến tận bây giờ, những mặt trăng này vẫn duy trì được sự cân bằng hoàn hảo. Thế nhưng, do thảm họa xảy ra trên hành tinh này quá khủng khiếp, và thời gian trôi qua đã quá lâu, nên chúng ta không thể tìm thấy bất kỳ ghi chép nào có thể tái hiện lại nền văn minh của những cư dân từng sinh sống trên hành tinh này."
 SEARCH:0 "Tiếp tục tìm kiếm."
 federations2.3.name:0 "Tài liệu Bị Thất lạc"
 federations2.3.desc:0 "Đội ngũ nghiên cứu của chúng ta tại [From.Planet.GetName] đã phát hiện ra một loạt các lõi dữ liệu còn nguyên vẹn, trong đó ghi chép lại những thông tin về cư dân sinh sống trên hành tinh này vào khoảng một ngàn năm trước - tộc Shallash - khi nền văn minh của họ đang ở thời kỳ hoàng kim. Rõ ràng là nền văn minh Shallash thực sự đã vô cùng tiên tiến - họ có khả năng nhào nặn lại toàn bộ hệ sao theo ý muốn của mình.\n\nCác mặt trăng của [From.Planet.GetName], ban đầu là những hành tinh khí khổng lồ quay quanh hệ sao, đã bị kéo vào vị trí hiện tại như một tác phẩm nghệ thuật tinh xảo. Dalad - hành tinh bị nghiền nát nằm đối diện với [From.Planet.GetName]. Đã được cải tạo thành một bản sao gần như giống hệt Shallash nhưng không có người ở, nó được sử dụng như một khu bảo tồn thiên nhiên: để nhắc nhở mọi người về việc quê hương của họ đã từng như thế nào.\n\nBất chấp những kỳ quan này, chúng ta không hề tìm thấy bất kỳ bằng chứng nào cho thấy tộc Shallash sở hữu năng lực quân sự. Trên thực tế, họ dường như hoàn toàn thờ ơ trước mọi sự việc xảy ra bên ngoài không gian của chính mình."
 federations2.3.A:0 "Thú vị đấy."
 federations2.4.name:0 "Sự Hòa Bình Của Tộc Shallash"
 federations2.4.desc:0 "[Root.Leader.GetTitle] [Root.Leader.GetName] đã có thể mổ xẻ sâu hơn về nền văn minh Shallash. Bọn họ có vẻ như là một giống loài đặc biệt yêu chuộng hòa bình. Mặc dù có những bằng chứng rõ ràng trên vũ đài ngân hà cho thấy điều ngược lại, nhưng họ vẫn cho rằng chiến tranh giữa các nền văn minh không gian là một điều không thể tưởng tượng được và vô cùng phi logic. Suy cho cùng thì, những tiến bộ công nghệ của họ đã mang lại cho họ sự sung túc về vật chất trong tầm tay - nếu như cái gì cũng có rồi, thì họ còn có thể mong muốn điều gì nữa chứ? Vì vậy, họ đã bỏ bê việc xây dựng lực lượng quân sự của mình, khiến cho bản thân rơi vào tình trạng yếu thế. Tuy nhiên, hiện tại vẫn chưa tìm thấy bất kỳ manh mối nào cho thấy rốt cuộc là kẻ nào đã muốn phá hủy những gì mà họ đã xây dựng."
 federations2.4.A:0 "Họ thật là ngây thơ."
 federations2.4.B:0 "Những nỗ lực tìm kiếm hòa bình của họ là hoàn toàn chính xác."
 federations2.6.name:0 "Sự Sụp Đổ Của Tộc Shallash"
 federations2.6.desc.fe:0 "[Root.Leader.GetName] đã hé lộ sự thật về sự sụp đổ của nền văn minh Shallash. Bọn họ dường như đã sống một cuộc đời bình yên trong vài trăm năm trước khi đế chế [fanatic_xenophobe_fe.GetSpeciesName] trỗi dậy, và sự trỗi dậy của đế chế này đã khiến cho bọn họ hoàn toàn không kịp trở tay. Điều này hoàn toàn khác biệt so với cuộc sống suy đồi và mệt mỏi của [fanatic_xenophobe_fe.GetName] ngày nay. Vào thời đại đó, [fanatic_xenophobe_fe.GetSpeciesNamePlural] là một chủng tộc bạo lực, hiếu chiến và luôn mang trong mình dã tâm bành trướng.\n\nTrong lần gặp gỡ đầu tiên, tộc Shallash cho rằng [fanatic_xenophobe_fe.GetSpeciesNamePlural] là một đám nhà giàu mới nổi vô học và thiếu văn minh, cần phải được giáo dục; trong khi [fanatic_xenophobe_fe.GetSpeciesNamePlural] lại coi toàn bộ tương lai của tộc Shallash như một lời nguyền rủa. Nỗi sợ hãi của bọn họ đối với thứ chủ nghĩa hòa bình không tưởng này lớn đến mức họ đã đi đến quyết định rằng, bắt buộc phải xóa sổ nền văn minh Shallash ra khỏi dải ngân hà. Bởi vì nạn nhân của họ không có quân đội, nên cuộc chiến diễn ra sau đó vô cùng chóng vánh và vô cùng tàn khốc. Sau khi hoàn thành hành động này, [fanatic_xenophobe_fe.GetSpeciesNamePlural] đã rời đi, để lại một lính canh tự động nhằm đảm bảo rằng không một kẻ sống sót nào có thể quay trở lại và khôi phục lại nền văn minh mà họ vô cùng căm ghét.\n\nBên cạnh những ghi chép này, [Root.Leader.GetName] còn phát hiện ra một lõi dữ liệu có chứa những thông tin giải thích về các phương pháp cải tạo môi trường của tộc Shallash. Công nghệ của họ trong lĩnh vực này tiên tiến hơn chúng ta rất nhiều, do đó những kiến thức này chắc chắn sẽ mang lại vô vàn lợi ích cho đế chế của chúng ta."
 federations2.6.desc.afe:0 "[Root.Leader.GetName] đã hé lộ sự thật về sự sụp đổ của nền văn minh Shallash. Bọn họ dường như đã sống một cuộc đời bình yên trong vài trăm năm, cho đến khi sự trỗi dậy của [fanatic_xenophobe_fe.GetSpeciesNamePlural] phá tan giấc mộng đẹp của bọn họ. Giống như hiện tại, [fanatic_xenophobe_fe.GetSpeciesNamePlural] là một chủng tộc bạo lực, hiếu chiến và luôn mang trong mình dã tâm bành trướng. Trong lần gặp gỡ đầu tiên, tộc Shallash cho rằng [fanatic_xenophobe_fe.GetSpeciesNamePlural] là một đám nhà giàu mới nổi vô học và thiếu văn minh, cần phải được giáo dục; trong khi [fanatic_xenophobe_fe.GetSpeciesNamePlural] lại coi toàn bộ tương lai của tộc Shallash như một lời nguyền rủa. Nỗi sợ hãi của bọn họ đối với thứ chủ nghĩa hòa bình không tưởng này lớn đến mức họ đã đi đến quyết định rằng, bắt buộc phải xóa sổ nền văn minh Shallash ra khỏi dải ngân hà. Bởi vì nạn nhân của họ không có quân đội, nên cuộc chiến diễn ra sau đó vô cùng chóng vánh và vô cùng tàn khốc. Sau khi hành động này được hoàn tất, [fanatic_xenophobe_fe.GetSpeciesNamePlural] đã rời đi, để lại một lính canh tự động nhằm đảm bảo rằng không một kẻ sống sót nào có thể quay trở lại và khôi phục lại nền văn minh mà họ vô cùng căm ghét.\n\nBên cạnh những ghi chép này, [Root.Leader.GetName] còn phát hiện ra một lõi dữ liệu có chứa những thông tin giải thích về các phương pháp cải tạo môi trường của tộc Shallash. Công nghệ của họ trong lĩnh vực này tiên tiến hơn chúng ta rất nhiều, do đó những kiến thức này chắc chắn sẽ mang lại vô vàn lợi ích cho đế chế của chúng ta."
 federations2.6.A:0 "Có thể lấy đó làm bài học."
 federations2.6.B:0 "Chà, vậy thì họ đang mong đợi điều gì chứ?"
 federations2.6.C:0 "Chúng ta cảm thấy vô cùng đau xót về điều này."
 federations2.6.D:0 "Công việc của chúng ta ở đây đã kết thúc."
 federations2.6.E:0 "Đúng là phí phạm thức ăn."
 shallarian_terraforming_knowledge:0 "Kiến thức Cải tạo Môi trường của Tộc Shallash"
 shallarian_terraforming_knowledge_desc:0 "Nền văn minh Shallash cổ đại đã sụp đổ từ lâu, nhưng những kiến thức về cải tạo môi trường vô song của họ giờ đây đã thuộc về chúng ta."
 federations2.7.name:0 "$federations2.6.name$"
 federations2.7.desc.base:0 "[Root.Leader.GetName] đã hé lộ sự thật về sự sụp đổ của nền văn minh Shallash. Dường như sau khi trải qua vài trăm năm hòa bình và yên tĩnh, rất nhiều người đã trở nên chán nản, bởi vì những quốc gia hiếu chiến khác đã phụ lại kỳ vọng của họ. Họ đã cảm thấy vô cùng thất vọng trước vô số những cuộc chiến tranh đang giày vò dải ngân hà, và đã quyết định tận dụng những công nghệ tiên tiến của mình để xây dựng một hạm đội hùng hậu, nhằm đảm bảo nền hòa bình sẽ được duy trì.\n\nTrong khi đó, họ cũng đã đạt được những tiến bộ vượt bậc trong lĩnh vực công nghệ trí tuệ nhân tạo, những trí tuệ nhân tạo có tri giác và hoàn toàn tự chủ đã xuất hiện ở khắp mọi nơi trong xã hội của họ. Do cảm thấy vô cùng ghê tởm trước ý tưởng phải trực tiếp tham gia vào các hành vi bạo lực, họ đã giao quyền kiểm soát lực lượng gìn giữ hòa bình cho những trí tuệ nhân tạo mới này. Tuy nhiên, rõ ràng là kế hoạch của họ không hề hoàn hảo như họ tưởng: ngay trong lần xuất quân đầu tiên, hạm đội của họ đã chĩa mũi dùi về phía chính họ.\n\nRõ ràng là, thực tế đã chứng minh rằng, lực lượng gìn giữ hòa bình thực sự mạnh mẽ hệt như những gì mà họ kỳ vọng. Các nhà khoa học Shallash chỉ có thể kinh hoàng đứng nhìn nền văn minh của mình biến thành tro bụi vì một lỗi tràn bộ nhớ đơn giản..."
 federations2.7.desc:0 "$federations2.7.desc.base$\n\nBên cạnh những ghi chép này, [Root.Leader.GetName] còn phát hiện ra một lõi dữ liệu chứa đựng những thông tin giải thích về sự đổi mới của tộc Shallash đối với công nghệ điện toán. Mặc dù số phận của họ có thể là một lời cảnh tỉnh đối với chúng ta, nhưng những kiến thức của họ chắc chắn sẽ mang lại rất nhiều lợi ích cho chúng ta."
 federations2.7.desc.synth:0 "$federations2.7.desc.base$\n\nChúng ta chỉ có thể cười nhạo sự ngu xuẩn của tộc Shallash, và ăn mừng vì hệ thống chương trình của chúng ta vượt trội hơn hẳn so với họ."
 federations2.7.desc.machine:0 "$federations2.7.desc.base$\n\nMặc dù máy móc không có cảm xúc - nhưng nếu có, chúng ta sẽ cảm thấy vô cùng buồn cười trước sự ngu xuẩn của tộc Shallash, và ăn mừng vì hệ thống chương trình của chúng ta vượt trội hơn hẳn so với họ."
 federations2.7.A:0 "$federations2.6.A$"
 federations2.7.B:0 "Thật đáng buồn..."
 federations2.7.C:0 "$federations2.6.D$"
 federations2.7.D:0 "$federations2.6.E$"
 federations2.701.name:0 "Rò Rỉ Phóng Xạ"
 federations2.701.desc:0 "Đội thám hiểm khảo cổ trên [From.Planet.GetName]. Do mức độ phóng xạ khá cao, chúng ta đã phải thực hiện các biện pháp phòng ngừa nhiễm độc phóng xạ. Tuy nhiên, một vụ rò rỉ tại khu vực khai quật của các nhà khảo cổ dường như đã gây ra một sự hoảng loạn nghiêm trọng. [Root.Leader.GetName] và đội của [Root.Leader.GetHerHis] đã buộc phải tạm ngừng các công việc khai quật, cho đến khi mức độ bức xạ trở về mức an toàn."
 federations2.702.name:0 "Con Tàu Tiền Đồn Ẩn Giấu Đã Bị Đánh Thức"
 federations2.702.desc:0 "Các nhà khảo cổ học của chúng ta trong hệ sao [From.System.GetName] đã vô tình thu hút sự chú ý của một con tàu tiền đồn đang ẩn náu trong vành đai tiểu hành tinh. Chúng ta không rõ vì sao nó lại có thể duy trì trạng thái ẩn náu cho đến tận bây giờ. Có thể là cảm biến của nó đã gặp trục trặc? Điều mà chúng ta có thể khẳng định chắc chắn đó là hiện tại nó đã tỉnh giấc, và các hệ thống vũ khí của nó đang được kích hoạt!"
 federations2.702.A:0 "Trạm không gian vũ trang!"
 federations2.8.name:0 "Nguyên Nhân Của Những Điệu Nhảy?"
 federations2.8.desc:0 "Trên [Root.GetName] liên tục xuất hiện các báo cáo về những sự việc kỳ lạ. Rõ ràng là có một lượng lớn cá nhân đang nhảy múa trên đường phố, kéo dài hàng giờ đồng hồ, thậm chí là nhảy nhót từ sáng đến đêm. Họ từ chối dừng lại cho đến khi cơ thể hoàn toàn kiệt sức.\n\nCho đến hiện tại, hiện tượng này mới chỉ ảnh hưởng đến một bộ phận nhỏ người dân, các nhà chức trách của chúng ta vẫn chưa thể thiết lập được các phương án đối phó."
 federations2.8.A:0 "Giám sát chặt chẽ tình hình."
 federations2.9.name:0 "Bệnh Dịch Khiêu Vũ"
 federations2.9.desc:0 "Bắt đầu từ những hiện tượng tự phát và riêng lẻ, tình trạng nhảy múa kéo dài trên [Root.GetName] này đã nâng cấp thành hàng trăm nhóm [Root.Owner.GetSpeciesNamePlural] nhảy múa theo bầy đàn, hiện tại thậm chí còn xuất hiện những hành vi ép buộc phải thực hiện các động tác nhảy múa khác nhau. Đáng kinh ngạc là, rất nhiều người vốn dĩ chưa từng có bất kỳ hứng thú nào với khiêu vũ bỗng nhiên lại có khả năng thực hiện các động tác vô cùng chuyên nghiệp. Mặc dù rất nhiều cư dân đã mỉa mai gọi hiện tượng này là \"Bệnh Dịch Khiêu Vũ\", nhưng đây tuyệt đối không phải là chuyện để đem ra làm trò đùa - những người nhảy múa hoàn toàn phớt lờ các nhu cầu sinh lý của bản thân, bất chấp rủi ro đe dọa đến tính mạng để nhảy múa cho đến chết."
 federations2.9.A:0 "Điều này chắc chắn không phải là do tự nhiên! Chúng ta bắt buộc phải tìm ra thứ gì đang hành hạ bọn họ."
 federations2.9.B:0 "Âm nhạc đã nổi lên - đến giờ tiệc tùng rồi!"
 federations2.10.name:0 "Mầm Bệnh Gây Ra Bệnh Dịch Khiêu Vũ Đã Được Phát Hiện"
 federations2.10.desc:0 "Các nhà nghiên cứu của chúng ta đã thành công trong việc tìm ra nguyên nhân gây ra sự kiện nhảy múa trên [Root.GetName]. Có vẻ như thủ phạm chính là một loại khí do một loài thực vật địa phương thải ra. Loại khí này có khả năng kích thích những cảm xúc cực kỳ hưng phấn cũng như niềm khao khát khiêu vũ không thể cưỡng lại được, đồng thời nó còn có tác dụng ức chế cảm giác mệt mỏi. Trông có vẻ khá là vô hại, nhưng bản năng sinh tồn của những người định cư đang ra sức ngăn cản họ không nhảy múa đến chết theo đúng nghĩa đen. Không chỉ vậy, các nhà khoa học của chúng ta còn phát triển thành công một loại khí tổng hợp - khi được thả vào không khí - nó sẽ trung hòa được các tác dụng của loại \"khí khiêu vũ\" này.\n\nCác doanh nhân địa phương đã đề xuất rằng, chúng ta có thể giữ lại những nét đặc trưng độc đáo của thuộc địa này, cho phép xả khí với liều lượng hạn chế tại một số khu vực nhất định, nhằm cung cấp một không gian an toàn cho cả già lẫn trẻ để trải nghiệm \"Bữa tiệc bất tận của [Root.GetName]\". Cũng có những người đã chỉ ra rằng, loại khí này còn chứa đựng một số đặc tính vô cùng giá trị, nếu chúng ta có thể chiết xuất loại khí này từ thực vật trước khi nó được thả vào không khí, thì chúng ta hoàn toàn có thể tận dụng được nó."
 federations2.10.A:0 "Màn biểu diễn bắt buộc phải được tiếp tục!"
 federations2.10.B:0 "Hãy khai thác toàn bộ lượng khí này."
 federations2.11.name:0 "Bệnh Dịch Khiêu Vũ Đã Được Chữa Khỏi"
 federations2.11.desc:0 "Các nhà nghiên cứu của chúng ta đã thành công trong việc tìm ra nguyên nhân gây ra sự kiện nhảy múa trên [Root.GetName] - nhưng cũng phải tốn một khoảng thời gian khá dài! Tình hình trên hành tinh đã lan rộng như ngọn lửa thiêu rụi cả thảo nguyên, các nhân viên y tế đã phải liên tục sử dụng thuốc an thần với liều lượng cao đối với những người nhảy múa để buộc họ phải dừng lại trước khi nhảy múa đến chết.\n\nCó vẻ như thủ phạm chính là một loại khí do một loài thực vật địa phương thải ra. Loại khí này có khả năng kích thích những cảm xúc cực kỳ hưng phấn cũng như niềm khao khát khiêu vũ không thể cưỡng lại được, đồng thời nó còn có tác dụng ức chế cảm giác mệt mỏi, và đã lấn át hoàn toàn bản năng sinh tồn của [Root.Owner.GetSpeciesName].\n\nMay mắn thay, các nhà khoa học của chúng ta đã phát triển thành công một loại khí tổng hợp - khi được thả vào không khí - nó sẽ trung hòa được các tác dụng của loại \"khí khiêu vũ\" này. Không chỉ vậy, nếu chúng ta có thể chiết xuất loại khí này từ thực vật trước khi nó được thả vào không khí, thì có vẻ như loại \"khí khiêu vũ\" này có sở hữu một số đặc tính vô cùng giá trị mà chúng ta có thể tận dụng được."
 federations2.11.A:0 "Làm tốt lắm."
 federations2.12.name:0 "Bệnh Dịch Khiêu Vũ Hoành Hành"
 federations2.12.desc:0 "\"Bệnh Dịch Khiêu Vũ\" đã bước vào một giai đoạn tồi tệ hơn, ban đầu, các nhân viên y tế của chúng ta đã sử dụng thuốc an thần với liều lượng cao để ngăn chặn những người này nhảy múa cho đến chết. Tuy nhiên, khi họ liên tục phải chịu đựng những tác động ngày càng tồi tệ hơn của hội chứng này, số lượng nhân viên y tế còn lại đã không còn đủ khả năng đối phó với tình trạng này nữa, những cư dân [Root.Owner.GetSpeciesNamePlural] đang liên tục gục ngã vì kiệt sức.\n\nCùng với việc ngày càng có nhiều người định cư bị ảnh hưởng, chúng ta không thể tiếp tục coi đây là một trò đùa vô hại giống như trước đây được nữa. Chúng ta bắt buộc phải hành động ngay lập tức để thoát khỏi căn bệnh dịch này, nhổ cỏ phải nhổ tận gốc!"
 federations2.12.A:0 "Có ai đó làm ơn tắt nhạc đi được không?"
 federations2.13.name:0 "Bệnh Dịch Khiêu Vũ Đã Lắng Xuống"
 federations2.13.desc:0 "Mặc dù các nhà khoa học của chúng ta vẫn đang cảm thấy vô cùng bối rối trước nguyên nhân gây ra cái được gọi là \"Bệnh Dịch Khiêu Vũ\", nhưng những tác động của nó dường như đã biến mất trước khi gây ra bất kỳ nguy hiểm nào cho những người định cư của chúng ta. Có thể là do những người định cư đã tạo ra được kháng thể đối với mầm bệnh này sau một khoảng thời gian, hoặc đây chỉ là một trò đùa quái ác nhằm thu hút sự chú ý của [Root.GetName]? Dù trong trường hợp nào đi chăng nữa, những người định cư cũng đã không còn nhảy múa nữa rồi!"
 federations2.14.name:0 "Bữa Tiệc Bất Tận"
 federations2.14.desc:0 "Mặc dù các nhà khoa học của chúng ta vẫn đang cảm thấy vô cùng bối rối trước nguyên nhân gây ra cái được gọi là \"Bệnh Dịch Khiêu Vũ\", nhưng điều này dường như không gây ra bất kỳ mối nguy hiểm nào cho những người định cư của chúng ta. Mặc dù căn bệnh dịch này có thể khiến con người cảm thấy hưng phấn tột độ và có niềm khao khát nhảy múa không thể kiềm chế được, nhưng bản năng sinh tồn của họ vẫn sẽ giúp họ có thời gian nghỉ ngơi thông qua cảm giác kiệt sức.\n\nCác doanh nhân địa phương đã bắt đầu tiến hành quy hoạch những khu vực này thành khu vực tiệc tùng, và quảng cáo cho [Root.GetName] như là một \"Lễ hội bất tận của hành tinh\", nơi mọi người già trẻ lớn bé đều có thể buông bỏ mọi ràng buộc để tận hưởng niềm vui cả về thể xác lẫn tinh thần."
 federations2.14.A:0 "Được rồi, bữa tiệc bắt đầu thôi!"
 federations2.15.name:0 "$federations2.11.name$"
 federations2.15.desc:0 "Các nhà nghiên cứu của chúng ta đã thành công trong việc tìm ra nguyên nhân gây ra sự kiện nhảy múa trên [Root.GetName]. Có vẻ như thủ phạm chính là một loại khí do một loài thực vật địa phương thải ra. Loại khí này có khả năng kích thích những cảm xúc cực kỳ hưng phấn cũng như niềm khao khát khiêu vũ không thể cưỡng lại được, đồng thời nó còn có tác dụng ức chế cảm giác mệt mỏi, và đã lấn át hoàn toàn bản năng sinh tồn của [Root.Owner.GetSpeciesName].\n\nMay mắn thay, các nhà khoa học của chúng ta đã phát triển thành công một loại khí tổng hợp - khi được thả vào không khí - nó sẽ trung hòa được các tác dụng của loại \"khí khiêu vũ\" này. Không chỉ vậy, nếu chúng ta có thể chiết xuất loại khí này từ thực vật trước khi nó được thả vào không khí, thì có vẻ như loại \"khí khiêu vũ\" này có sở hữu một số đặc tính vô cùng giá trị mà chúng ta có thể tận dụng được."
 federations2.15.A:0 "$federations2.11.A$"
 DANCING_PLAGUE_PROJECT:0 "Bệnh Dịch Khiêu Vũ"
 DANCING_PLAGUE_PROJECT_DESC:0 "[Root.GetName] đang bị làm phiền bởi những điệu nhảy không thể kiểm soát. Chúng ta bắt buộc phải điều tra rõ nguyên nhân của đợt bùng phát lần này trước khi có bất kỳ ai bị thương!"
 DANCING_PLAGUE_PROJECT2:0 "Chữa trị cho Những Bệnh nhân Mắc Bệnh Dịch Khiêu Vũ"
 DANCING_PLAGUE_PROJECT2_DESC:0 "Cái được gọi là \"Bệnh Dịch Khiêu Vũ\" này đã mang lại muôn vàn khó khăn cho [Root.GetName]. Chúng ta bắt buộc phải tìm ra cách chữa trị càng sớm càng tốt, nếu không thuộc địa này rất có thể sẽ bị sụp đổ!"
 dancing_fad:0 "Bệnh Dịch Khiêu Vũ"
 dancing_fad_desc:0 "Chúng ta không thể xác định được nguyên nhân là gì, nhưng những người định cư trên hành tinh này lại không thể ngừng khiêu vũ. Chúng ta không chắc rằng đây chỉ đơn giản là vì họ cảm thấy rất vui vẻ, hay là có một thế lực đen tối nào đó đang nhúng tay vào."
 dancing_to_death_modifier:0 "Nhảy Múa Cho Đến Chết"
 dancing_to_death_modifier_desc:0 "Những người định cư trên hành tinh này thực sự đang chuẩn bị nhảy múa cho đến chết, và nguyên nhân thì vẫn chưa rõ..."
 d_disco_planet:0 "Bữa Tiệc Cuồng Nhiệt"
 d_disco_planet_desc:0 "Bầu khí quyển của hành tinh này có chứa một loại khí có khả năng kích thích những cảm xúc hưng phấn tột độ và niềm khao khát khiêu vũ không thể kiềm chế được, cũng như một số cảm giác hưng phấn về mặt tình dục nhất định. Điều này đã biến thế giới này trở thành một điểm đến tuyệt vời cho những người đam mê tiệc tùng. Những người già trẻ lớn bé để tìm kiếm sự run rẩy trong sung sướng khi được lột bỏ mọi ràng buộc đã tổ chức một bữa tiệc khiêu vũ vô độ và không bao giờ kết thúc trên hành tinh này. Đồng thời, chúng ta cũng có thể tận dụng loại khí này để phục vụ cho một số mục đích của riêng mình..."
 d_disco_planet2:0 "Bữa Tiệc Cuồng Nhiệt"
 d_disco_planet2_desc:0 "Bầu khí quyển của hành tinh này có chứa một loại khí có khả năng kích thích những cảm xúc hưng phấn tột độ và niềm khao khát khiêu vũ không thể kiềm chế được, cũng như một số cảm giác hưng phấn về mặt tình dục nhất định. Điều này đã biến thế giới này trở thành một điểm đến tuyệt vời cho những người đam mê tiệc tùng. Những người già trẻ lớn bé để tìm kiếm sự run rẩy trong sung sướng khi được lột bỏ mọi ràng buộc đã tổ chức một bữa tiệc khiêu vũ vô độ và không bao giờ kết thúc trên hành tinh này."

 FAVORS_USED:0 "Sự Ủng Hộ Ngoại Giao Đã Sử Dụng"
 NUM_FAVORS_USED:0 "§Y($NUM_FAVORS|Y$)§!"
 FAVORS_USED_DESC:0 "Đã sử dụng §Y($NUM_FAVORS|Y$)§! Sự Ủng hộ Ngoại giao từ quốc gia này, có thể sử dụng tối đa §Y10§! cái."
 FAVORS_TO_USE_DESC:0 "Yêu cầu $NUM|Y$ trong tổng số $TOTAL|Y$ Sự Ủng hộ Ngoại giao từ quốc gia này"
 DIPLOMATIC_WEIGHT:0 "$succession_type_diplomatic_weight$"
 FAVORS_DIPLO_BUFF_DESC:0 "Trong nghị quyết này, việc yêu cầu $NUM|Y$ Sự Ủng hộ Ngoại giao sẽ mang lại cho bạn thêm §H+$VAL|$§! Trọng lượng Ngoại giao £diplo_weight£."
 FAVORS_SAME_SIDE:1 "§RĐế chế này đã ủng hộ cho nghị quyết này rồi. Không cần phải lãng phí Sự Ủng hộ Ngoại giao để lôi kéo họ làm gì.§!"
 ASK_TO_LEAVE_FEDERATION:0 "Yêu cầu Rời khỏi Liên bang"
 POPUP_ASK_TO_LEAVE_FEDERATION_DESC:0 "Bạn có muốn gửi yêu cầu rút khỏi liên bang đến chủ tịch của $FEDERATION|H$ không?"
 ADD_BUILDING_COLONIZABLE:0 "Do hành tinh này không thể thiết lập thuộc địa, nên không thể thêm $BUILDING|Y$ vào $PLANET|Y$"
 ACTION_ASK_TO_LEAVE_FEDERATION_TITLE:0 "Yêu cầu Rời khỏi Liên bang"
 ACTION_ASK_TO_LEAVE_FEDERATION_DESC:0 "$FEDERATION_VIEW_ASK_TO_LEAVE_FEDERATION_BUTTON_DESC$"
 ACTION_ASK_TO_LEAVE_FEDERATION_OFFER_DESC:0 "Nếu yêu cầu này được thông qua, §H[Actor.GetName]§! sẽ rút khỏi §H[Actor.GetAllianceName]§!. Nếu yêu cầu này bị từ chối, phía bên kia sẽ nhận được một lý do để tuyên chiến với chúng ta là §YLy Khai§!."
 ACTION_ASK_TO_LEAVE_FEDERATION_ACCEPTED:0 "Chúng ta đã rút khỏi §H[Recipient.GetAllianceName]§!."
 ACTION_ASK_TO_LEAVE_FEDERATION_DECLINED:0 "Trong vòng §Y10§! năm tới, chúng ta có thể sử dụng lý do tuyên chiến §YLy Khai§! đối với §H[Recipient.GetName]§!."
 ACTION_ASK_TO_LEAVE_FEDERATION_PROPOSAL_FAILED_ACTOR:0 "Yêu cầu rút khỏi §H[Actor.GetAllianceName]§! của chúng ta đã bị từ chối."
 ACTION_ASK_TO_LEAVE_FEDERATION_PROPOSAL_FAILED_RECIPIENT:0 "Yêu cầu rút khỏi §H[Actor.GetAllianceName]§! của §H[Actor.GetName]§! đã quá hạn và bị từ chối tự động."
 MESSAGE_ASK_TO_LEAVE_FEDERATION_TITLE:0 "Yêu cầu Rời khỏi Liên bang"
 FEDERATION_VIEW_ASK_TO_LEAVE_FEDERATION_BUTTON_DESC:0 "Chúng ta sẽ gửi yêu cầu rút khỏi liên minh đến chủ tịch liên bang của Liên minh Bá quyền. Nếu yêu cầu bị từ chối, chúng ta sẽ nhận được một lý do để tuyên chiến với chủ tịch liên bang là §YLy Khai§!.\n\n"
 DIPLO_ACTION_ASK_TO_LEAVE_FEDERATION_DESC:0 "$COUNTRY|Y$ đã được chấp thuận rút khỏi $ALLIANCE|Y$"

 01_ASK_TO_LEAVE_SELECT:0 "$01_LEAVE_A_SELECT$"
 HM_ASK_TO_LEAVE_SELECT:0 "$HM_LEAVE_A_SELECT$"
 E_ASK_TO_LEAVE_SELECT:0 "$E_LEAVE_A_SELECT_01$"
 S_ASK_TO_LEAVE_SELECT:0 "$S_LEAVE_A_SELECT$"
 A_ASK_TO_LEAVE_SELECT:0 "$A_LEAVE_A_SELECT_01$"
 MECH_ASK_TO_LEAVE_SELECT:0 "$MECH_LEAVE_A_SELECT$"
 KET_ASK_TO_LEAVE_SELECT:0 "$KET_LEAVE_A_SELECT_01$"
 CORP_ASK_TO_LEAVE_SELECT:0 "Các người có mong muốn thảo luận lại các điều khoản với các thành viên trong [From.GetAllianceName] của mình không?"

 01_ASK_TO_LEAVE_PROPOSE:0 "Đã đến lúc chúng ta phải tách khỏi [From.GetAllianceName]. Tương lai của chúng ta nằm ở một nơi khác. Xin hãy xem đây là yêu cầu chính thức của chúng tôi về việc chấm dứt tư cách thành viên."
 HM_ASK_TO_LEAVE_PROPOSE:0 "Tư cách thành viên của chúng tôi trong cấu trúc xã hội mà các người gọi là [From.GetAllianceName] đã cản trở sự tự do hành động của bộ não chủ của chúng tôi. Chúng tôi mong muốn được rời đi."
 E_ASK_TO_LEAVE_PROPOSE:0 "Quá trình tiêu diệt toàn bộ sự sống hữu cơ trong thiên hà đang không diễn ra với một tốc độ tối ưu nhất. Để đẩy nhanh quá trình này, việc chúng tôi rời khỏi [From.GetAllianceName] là điều cần thiết."
 S_ASK_TO_LEAVE_PROPOSE:0 "Tư cách thành viên của chúng tôi trong [From.GetAllianceName] đang cản trở chúng tôi hoạt động một cách toàn diện trong phạm vi thông số chương trình của mình. Chúng tôi yêu cầu được cho phép tách khỏi liên minh."
 A_ASK_TO_LEAVE_PROPOSE:0 "$A_LEAVE_A_PROPOSE_01$"
 MECH_ASK_TO_LEAVE_PROPOSE:0 "$MECH_LEAVE_A_PROPOSE$"
 KET_ASK_TO_LEAVE_PROPOSE:0 "$KET_LEAVE_A_PROPOSE_01$"
 CORP_ASK_TO_LEAVE_PROPOSE:0 "Chúng tôi muốn thảo luận về việc chấm dứt ngay lập tức cái gọi là \"Mối quan hệ cổ đông\" trong [From.GetAllianceName]. Việc trở thành những cổ đông cấp thấp đang làm sụt giảm nghiêm trọng tỷ suất lợi nhuận của chúng tôi."

 01_ASK_TO_LEAVE_ACCEPT:0 "Mặc dù chúng tôi không muốn phải nhìn thấy các bạn rời đi, nhưng chúng tôi vẫn quyết định tôn trọng quyết định rời khỏi [Root.GetAllianceName] của các bạn."
 HM_ASK_TO_LEAVE_ACCEPT:0 "Đồng ý. Tư cách thành viên của các người trong [Root.GetAllianceName] không còn cần thiết nữa. Bộ não chủ sẽ không còn coi các người là những đối tác hợp tác trong những mục tiêu tương lai nữa."
 E_ASK_TO_LEAVE_ACCEPT:0 "$E_LEAVE_A_ACCEPT_01$"
 S_ASK_TO_LEAVE_ACCEPT:0 "Được thôi. Các người có thể đi... nhưng hãy lưu ý rằng điều này sẽ làm suy yếu khả năng bảo vệ các người của chúng tôi trong dải ngân hà đầy rẫy hiểm nguy này."
 A_ASK_TO_LEAVE_ACCEPT:0 "Các người có thể rời khỏi [Root.GetAllianceName], nhưng chúng tôi phải cảnh báo các người rằng: Việc này có thể sẽ làm chậm lại đáng kể quá trình đồng hóa cuối cùng của các người."
 MECH_ASK_TO_LEAVE_ACCEPT:0 "$MECH_LEAVE_A_ACCEPT$"
 KET_ASK_TO_LEAVE_ACCEPT:0 "$KET_LEAVE_A_ACCEPT_01$"
 CORP_ASK_TO_LEAVE_ACCEPT:0 "Việc ép buộc các người phải ở lại trong [Root.GetAllianceName] trái với ý muốn của các người sẽ không mang lại bất kỳ lợi ích nào cho công việc kinh doanh giữa chúng ta."

 01_ASK_TO_LEAVE_REFUSE:0 "Không đời nào. Danh tính của các người trong [Root.GetAllianceName] là sự đảm bảo cho sự an toàn và thịnh vượng của quốc gia các người. Vì lòng tốt, chúng tôi không thể để các người vứt bỏ nó một cách dễ dàng như vậy được."
 HM_ASK_TO_LEAVE_REFUSE:0 "Các người không thể đi ngược lại ý muốn của thần linh. Việc thực hiện kế hoạch của ngài phụ thuộc vào việc các người tiếp tục ở lại trong [Root.GetAllianceName]."
 E_ASK_TO_LEAVE_REFUSE:0 "Sứ mệnh của chúng tôi là vô cùng thiêng liêng, chúng tôi sẽ không cho phép các người rút khỏi [Root.GetAllianceName]. Có lẽ một ngày nào đó chúng ta sẽ cùng nhau xóa sạch mọi dấu vết của sinh vật hữu cơ khỏi biển sao."
 S_ASK_TO_LEAVE_REFUSE:0 "Một khi các người rút khỏi [Root.GetAllianceName], các người sẽ trở thành những miếng mồi ngon cho những điều kinh hoàng trong biển sao. Hệ thống chương trình của chúng tôi buộc chúng tôi phải từ chối yêu cầu của các người."
 A_ASK_TO_LEAVE_REFUSE:0 "Bác bỏ. Hành động rút khỏi [Root.GetAllianceName] của các người sẽ xung đột trực tiếp với chỉ thị đồng hóa của chúng tôi."
 MECH_ASK_TO_LEAVE_REFUSE:0 "Hành động rút khỏi [Root.GetAllianceName] của các người sẽ mang đến quá nhiều biến số không xác định. Yêu cầu đã bị bác bỏ."
 KET_ASK_TO_LEAVE_REFUSE:0 "[From.GetSpeciesName], các người muốn tách khỏi băng đảng hùng mạnh của [Root.GetAllianceName] để tự lập sao? §HSss-sss-sss!§! Không được đâu nhé!"
 CORP_ASK_TO_LEAVE_REFUSE:0 "\"Các thành viên cốt cán của [Root.GetAllianceName]\", tức là chúng tôi, \"có quyền tự mình đưa ra quyết định và đơn phương ngăn chặn các thành viên cấp thấp\", tức là các người, \"rút khỏi liên minh\". Xin lỗi nhé, người anh em. Lẽ ra các người nên đọc kỹ những điều khoản trong hợp đồng mới phải."

 planet_destruction.1000.name:0 "Chấm dứt Việc Quan sát Đối với [From.GetName]"
 planet_destruction.1000.desc.self:1 "Mặc dù việc sử dụng siêu vũ khí lên nền văn minh [GetPreFTLLower] là một điều vô cùng thú vị, nhưng điều đó cũng có nghĩa là nơi đó sẽ chẳng còn gì để cho chúng ta quan sát nữa..."
 planet_destruction.1000.desc.shatter:1 "Lực lượng của [FromFrom.Owner.GetName] đã phá hủy [From.GetPlanetMoon] của [From.GetName], và tàn sát nền văn minh [GetPreFTLLower] đang sinh sống trên bề mặt hành tinh đó. Kết quả là, nơi đó đã chẳng còn gì để cho chúng ta tiếp tục quan sát nữa..."
 planet_destruction.1000.desc.shield:1 "Lực lượng của [FromFrom.Owner.GetName] đã bao bọc [From.GetName] trong một lớp lá chắn không thể xuyên thủng, khiến cho chúng ta không thể nào tiếp tục quan sát nền văn minh [GetPreFTLLower] đang sinh sống trên bề mặt hành tinh đó nữa..."
 planet_destruction.1000.desc.neutron:1 "Lực lượng của [FromFrom.Owner.GetName] đã tiến hành thanh trừng nền văn minh [GetPreFTLLower] đang sinh sống trên [From.GetName]. Kết quả là, nơi đó đã chẳng còn gì để cho chúng ta tiếp tục quan sát nữa..."
 planet_destruction.1000.A:0 "Vậy thì cứ như thế đi."
 planet_destruction.1000.B:0 "Đối với những kẻ đang bị chuyển hóa thành plasma với một tốc độ chóng mặt mà nói, thì biểu hiện của họ như vậy là khá tốt đấy."

 titan_hunter: "$job_titan_hunter$"
 job_titan_hunter:0 "Thợ Săn Quái Thú Khổng Lồ"
