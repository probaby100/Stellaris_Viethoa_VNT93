 resolution_sanctions_administrative_3_desc:1 "Nhằm cô lập và bài xích những quốc gia không tuân theo ý chí của [global_event_country.GetGalCommunityOrGalImperium], chúng ta bắt buộc phải áp dụng những biện pháp cực đoan."



