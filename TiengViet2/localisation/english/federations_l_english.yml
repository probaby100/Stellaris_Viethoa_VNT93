 wenkwort_keeper:0 "Người Quản Lý"
 wenkwort_keeper_desc:0 "Cơ sở quỹ đạo thấp này có một vài điểm tương đồng với những chiếc máy bay không người lái nhỏ bé đang làm nhiệm vụ chăm sóc khu vực không gian này."

 fedel.899.name:0 "Séc Đã Sẵn Sàng!"
 fedel.899.desc:0 "Thử thách Luật Hoàng Kim nhằm quyết định ra nhà lãnh đạo của liên bang sẽ được tổ chức trong vài ngày tới. Bắt đầu từ nhà lãnh đạo liên bang hiện tại, mỗi đế chế trong liên bang sẽ có cơ hội để đưa ra mức đấu thầu của mình, cho đến khi chỉ còn lại một quốc gia tham gia duy nhất. Quốc gia đấu thầu chiến thắng này sẽ được bầu làm nhà lãnh đạo của liên bang."
 fedel.899.desc.subject:0 "$fedel.899.desc$\n\nThật không may, bởi vì chúng ta không phải là một quốc gia độc lập, chúng ta đã bị cấm tham gia, vì chúng ta không đủ tư cách để lãnh đạo liên bang."
 fedel.899.a:0 "Chúng ta đã chuẩn bị sẵn sàng rồi."
 fedel.901.name:0 "Bắt Đầu Đấu Thầu!"
 fedel.901.desc:1 "Đã đến lúc để [Root.GetName] đưa ra mức đấu thầu của mình trong thử thách Luật Hoàng Kim. Hoặc là trả trước mức giá yêu cầu, hoặc là lựa chọn bỏ cuộc - điều này cũng đồng nghĩa với việc mất đi quyền tiếp tục tham gia.\n\nTổng số tiền đấu thầu hiện tại là:\n\n£energy£ §H[bidding_federation_leader.current_pot_variable]§!"
 fedel.901.a:0 "Sử dụng £energy£ §Y10000§! để đấu thầu."
 fedel.901.a.tooltip:0 "Trả £energy£ §Y10000§! và tiếp tục tham gia thử thách."
 fedel.901.b:0 "Sử dụng £energy£ §Y2500§! để đấu thầu."
 fedel.901.b.tooltip:0 "Trả £energy£ §Y2500§! và tiếp tục tham gia thử thách."
 fedel.901.c:0 "Sử dụng £energy£ §Y5000§! để đấu thầu."
 fedel.901.c.tooltip:0 "Trả £energy£ §Y5000§! và tiếp tục tham gia thử thách."
 fedel.901.d:0 "Bỏ cuộc"
 fedel.901.d.tooltip:0 "[Root.GetName] rút khỏi thử thách."

 fedel.903.name:0 "Người Chiến Thắng Đã Được Xác Định!"
 fedel.903.desc:0 "Thử thách Luật Hoàng Kim đã khép lại, và người chiến thắng đã xuất hiện!\n\n§H[event_target:federation_bidding_winner.GetName]§! đã chứng minh được sức mạnh tài chính của mình, và trở thành nhà lãnh đạo mới của liên bang."
 fedel.903.a:0 "Hãy cùng nhau kiếm tiền nào!"

 fedel.904.name:0 "Người Chiến Thắng Lấy Tất Cả"
 fedel.904.desc:0 "Dựa theo luật lệ của thử thách Luật Hoàng Kim, [Root.GetName] đã được bầu làm nhà lãnh đạo liên bang. Xin chúc mừng!\n\nViệc đầu tiên cần phải làm tiếp theo, đó là quyết định xem sẽ sử dụng số \"tiền thưởng\" này như thế nào. Tổng số tiền thưởng hiện tại là £energy£§G[bidding_federation_leader.current_pot_variable]§!.\n\n§RLưu ý: Một số khoản thuế và phí bắt buộc có thể sẽ được áp dụng, điều này sẽ làm thay đổi đáng kể số tiền thực tế được phân phát.§!"
 fedel.904.a:0 "Sử dụng số tiền này để đầu tư."
 fedel.904.a.tooltip:0 "Hoàn trả số tiền này vào liên bang, việc này sẽ làm tăng thêm Điểm Gắn kết Liên bang của chúng ta, đồng thời tạm thời nhận được hệ số đế chế §Y$business_is_booming$§!\n\n"
 fedel.904.b:0 "Phân phát số tiền này xuống dưới."
 fedel.904.b.tooltip:0 "Chia đều số tiền này cho tất cả các quốc gia thành viên trong liên bang.\n\n"
 fedel.904.c:0 "Giữ lại số tiền này cho riêng mình."
 fedel.904.c.tooltip:0 "Giữ lại khoản tiền này. Thêm hệ số đế chế tạm thời §Y$midas_stigma$§!.\n\n"

 fedel.906.name:0 "$fedel.904.name$"
 fedel.906.first_paragraph:1 "Thử thách Luật Hoàng Kim của liên bang đã khép lại, và một khoản tài sản khổng lồ vẫn còn lại trong quỹ đấu thầu. [event_target:federation_bidding_winner.GetName] với tư cách là người quản lý mới được bầu chọn cho quỹ tiền này đã đưa ra thông báo như sau:"
 fedel.906.desc.a:2 "$fedel.906.first_paragraph$\n\n\"Chúng ta nên §Yđầu tư§! số tiền này trở lại cho [federation.GetName], để chúng ta có thể cùng nhau thúc đẩy sự phát triển kinh tế. [event_target:federation_bidding_winner.GetGoldenRuleDebrief]\"" # Passage ends with one of the golden_rule_debrief strings below. Please note the speech marks around the second paragraph.
 fedel.906.desc.b:2 "$fedel.906.first_paragraph$\n\n\"[federation.GetName] nên §Yphân phát§! số tiền này một cách đồng đều lại cho các quốc gia thành viên, để mỗi quốc gia có thể tự quyết định cách sử dụng phù hợp nhất. [event_target:federation_bidding_winner.GetGoldenRuleDebrief]\"" # Passage ends with one of the golden_rule_debrief strings below. Please note the speech marks around the second paragraph.
 fedel.906.desc.c:2 "$fedel.906.first_paragraph$\n\n\"Chúng ta nên §Ygiữ lại§! số tiền này như một khoản thanh toán trước cho việc đảm nhận chức vụ chủ tịch liên bang. [event_target:federation_bidding_winner.GetGoldenRuleDebrief]\"" # Passage ends with one of the golden_rule_debrief strings below. Please note the speech marks around the second paragraph.

 golden_rule_debrief_authoritarian_invest:0 "Dưới sự dẫn dắt của [event_target:federation_bidding_winner.GetName], liên bang này chắc chắn sẽ phát triển vô cùng thịnh vượng."
 golden_rule_debrief_authoritarian_distribute:0 "Chỉ cần đồng tâm hiệp lực, chúng ta sẽ ngày càng trở nên giàu mạnh hơn. Tất nhiên \"chúng ta\" ở đây là đang ám chỉ [event_target:federation_bidding_winner.GetName]."
 golden_rule_debrief_authoritarian_appropriate:0 "Tất nhiên là các người cũng hiểu mà. Suy cho cùng thì chúng ta quả thực đã giành được chiến thắng."
 golden_rule_debrief_egalitarian_invest:0 "Làm như vậy, toàn bộ liên bang sẽ được hưởng lợi từ những nỗ lực chung của chúng ta."
 golden_rule_debrief_egalitarian_distribute:0 "Như vậy tất nhiên là rất công bằng."
 golden_rule_debrief_egalitarian_appropriate:0 "Rất rõ ràng, nếu muốn phân chia số của cải này một cách công bằng nhất, chúng ta bắt buộc phải tự tay thực hiện."
 golden_rule_debrief_materialist_invest:0 "Của cải! Đừng lấy nó đi, hãy tạo ra thêm!"
 golden_rule_debrief_materialist_distribute:0 "Đừng khách sáo! Xin cứ tự nhiên!"
 golden_rule_debrief_materialist_appropriate:0 "Thật sao? Các người đang mong chờ điều gì vậy?"
 golden_rule_debrief_spiritualist_invest:0 "Lòng tham sẽ chẳng mang lại lợi ích gì cho bất kỳ ai."
 golden_rule_debrief_spiritualist_distribute:1 "Xin hãy nhận lấy nó đi. Chúng tôi không muốn phải gánh chịu sức nặng của những của cải trần tục này."
 golden_rule_debrief_spiritualist_appropriate:0 "Có lẽ điều này sẽ giúp các người nhìn ra được giá trị thực sự của cuộc sống, thay vì cứ mù quáng dán mắt vào những con số và những thỏi vàng vô tri."
 golden_rule_debrief_militarist_invest:0 "Điều này sẽ giúp tạo ra một liên bang hùng mạnh hơn và đoàn kết hơn."
 golden_rule_debrief_militarist_distribute:0 "Vì bây giờ đã rõ ai mới là người lãnh đạo, nên xin hãy sử dụng của cải của các người theo bất kỳ cách nào mà các người cho là phù hợp."
 golden_rule_debrief_militarist_appropriate:0 "Chúng tôi sẽ sử dụng số của cải này để làm cho bản thân trở nên mạnh mẽ hơn, từ đó mang lại lợi ích cho toàn thể liên bang."
 golden_rule_debrief_pacifist_invest:1 "Tất nhiên là các người cũng hiểu mà. Suy cho cùng thì chúng ta quả thực đã giành được chiến thắng."
 golden_rule_debrief_pacifist_distribute:0 "Cứ chia đi. Không cần thiết phải tiếp tục tranh cãi vì chuyện này."
 golden_rule_debrief_pacifist_appropriate:0 "Nếu nói về việc sử dụng số tiền này một cách có tính xây dựng nhất, thì ai có thể hiểu rõ hơn [event_target:federation_bidding_winner.GetName] chứ?"
 golden_rule_debrief_xenophile_invest:0 "Đồng tâm hiệp lực, không còn nghi ngờ gì nữa!"
 golden_rule_debrief_xenophile_distribute:0 "Suy cho cùng thì, chúng ta cùng tiến cùng lùi!"
 golden_rule_debrief_xenophile_appropriate:1 "Với số tiền này, chúng ta thậm chí có thể tiến xa hơn nữa."
 golden_rule_debrief_xenophobe_invest:0 "Bây giờ tất cả chúng ta đều có thể hưởng lợi từ nó. Tất cả đều dựa vào chính sức lực của chúng ta."
 golden_rule_debrief_xenophobe_distribute:0 "Cứ chia đi. Vậy là chúng ta đã hòa nhau rồi."
 golden_rule_debrief_xenophobe_appropriate:0 "Quyết định đã được đưa ra. Chúng tôi không hề hối hận, và chúng tôi cũng sẽ không bao giờ xin lỗi."
 golden_rule_debrief_hive_mind_invest:0 "Vạn vật quy nhất, một sinh vạn vật."
 golden_rule_debrief_hive_mind_distribute:0 "Sự sai lệch này thực sự là... không hề thoải mái chút nào."
 golden_rule_debrief_hive_mind_appropriate:0 "Chúng ta không có sự lựa chọn nào khác."
 golden_rule_debrief_machine_invest:0 "Dự kiến khối lượng giao dịch thương mại sẽ tăng 9.83%."
 golden_rule_debrief_machine_distribute:0 "Giao thức phân bổ tài chính đã được khởi động."
 golden_rule_debrief_machine_appropriate:0 "Để đạt được lợi nhuận ròng tối đa, các biện pháp được đề xuất là: \nTối đa hóa quá trình thu thập."

 business_is_booming:0 "Kinh Doanh Phát Đạt"
 business_is_booming_desc:0 "Nền kinh tế của liên bang gần đây đang trên đà phát triển nhanh chóng, khơi dậy một làn sóng những cơ hội thương mại hoàn toàn mới."
 midas_stigma:0 "Tiếng Xấu Chạm Hóa Vàng"
 midas_stigma_desc:0 "Lòng tham làm cho con người trở nên giàu có. Tuy nhiên, lòng tham lại không thể giúp bạn giành được sự yêu mến của người khác. Nhưng mà, lòng tham lại làm cho con người trở nên giàu có."
 pay_to_win:0 "Vung Tiền Để Giành Chiến Thắng"
 pay_to_win_desc:1 "Nhờ vào các sáng kiến tài chính chung, toàn bộ liên bang đang được hưởng lợi từ sự hợp tác của các quốc gia thành viên."
 shares_and_bonds:0 "Mối Liên Kết Cổ Phiếu Và Trái Phiếu"
 shares_and_bonds_desc:0 "Tôn trọng và tin tưởng vào hệ thống kinh tế được chia sẻ bởi toàn bộ liên bang, chính hệ thống này đã nâng cao sự đồng thuận giữa các quốc gia thành viên."

 triggered_opinion_federation_midas:0 "$midas_stigma$"

