 JOIN_IN_BREACH:0 "£trigger_no£ §RChú ý, nếu bạn gia nhập $GALACTIC_COMMUNITY$ vào lúc này, dựa trên các chính sách đã thiết lập, bạn sẽ bị coi là vi phạm Luật Thiên Hà, bạn phải thay đổi các chính sách liên quan sau khi gia nhập, hoặc sẽ có nguy cơ bị lên án.§!"
