 resolution_commerce_repeal_5:0 "§RBãi bỏ $resolution_commerce_profit_maximization_engines$§!"
 resolution_commerce_repeal_5_desc:0 "$resolution_commerce_repeal_1_desc$"
 resolution_commerce_repeal_5_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_commerce_profit_maximization_engines$§!, biến §Y$resolution_commerce_holistic_asset_coordination$§! trở thành Luật Thiên Hà."

 resolution_commerce_buzzword_standardization:0 "Tiêu chuẩn hóa Thuật ngữ"
 resolution_commerce_buzzword_standardization_desc:0 "Chúng ta nên tạo điều kiện cho các doanh nghiệp của mình có thể kết nối và giao tiếp một cách liền mạch với nhau. Việc đơn giản hóa các thuật ngữ giao tiếp một cách có mục đích sẽ giúp công việc môi giới trở nên hiệu quả hơn, và dễ dàng đạt được các chỉ tiêu quan trọng hơn."

 resolution_commerce_leveraged_privateering:0 "Phối hợp Chống Cướp biển"
 resolution_commerce_leveraged_privateering_desc:1 "Dòng chảy thương mại giống như huyết mạch của thiên hà. Tất cả các thành viên trong toàn bộ [global_event_country.GetGalCommunityOrGalImperium] nên cùng nhau thành lập một lực lượng vũ trang liên sao đa quốc gia để trấn áp cướp biển và các mối đe dọa khác đối với tự do thương mại."

 resolution_commerce_underdeveloped_system_utilization:0 "Tận dụng Hệ sao Kém phát triển"
 resolution_commerce_underdeveloped_system_utilization_desc:0 "Đối với các hệ sao nằm trong phạm vi ảnh hưởng của chúng ta, nếu không thể tối đa hóa giá trị thu được từ chúng thì đó sẽ là một sự lãng phí và tội lỗi to lớn. Chúng tôi đề xuất bắt buộc thực thi các tiêu chuẩn nêu trên, và áp dụng các hình phạt thích đáng đối với những bên không đạt yêu cầu."
 resolution_commerce_underdeveloped_system_utilization_tooltip:1 "Trạm quan sát sản xuất £consumer_goods£ §GHàng Tiêu dùng§! khi §YQuan sát§! các nền văn minh tiền FTL"

 resolution_commerce_holistic_asset_coordination:0 "Phối hợp Tài sản Tổng thể"
 resolution_commerce_holistic_asset_coordination_desc:0 "Để xây dựng một hệ thống đầu ra hậu cần tối ưu hơn, chúng ta nên đồng lòng tạo ra một cơ sở hạ tầng cấp ngân hà tiện lợi, nhằm nâng cao hiệu quả thương mại và chia sẻ thông tin."

 resolution_commerce_profit_maximization_engines:0 "Động cơ Tối đa hóa Lợi nhuận"
 resolution_commerce_profit_maximization_engines_desc:0 "Chúng ta nên thiết lập mạng lưới kết nối máy tính trên mỗi hành tinh để tối ưu hóa việc phân bổ thông tin và tài nguyên. Của cải chắc chắn sẽ đổ về như nước."

 # The Greater Good
 resolution_category_greatergood:0 "Lợi ích Tối cao"

 resolution_greatergood_repeal_1:0 "§RBãi bỏ $resolution_greatergood_workers_rights$§!"
 resolution_greatergood_repeal_1_desc:1 "[global_event_country.GetGalCommunityOrGalImperium] đã đi quá xa trong việc dạy bảo các thành viên cách sống như thế nào. Thành thật mà nói, điều này quá sức xúc phạm."
 resolution_greatergood_repeal_1_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_greatergood_workers_rights$§!."

 resolution_greatergood_repeal_2:0 "§RBãi bỏ $resolution_greatergood_five_year_plans$§!"
 resolution_greatergood_repeal_2_desc:0 "$resolution_greatergood_repeal_1_desc$"
 resolution_greatergood_repeal_2_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_greatergood_five_year_plans$§!, biến §Y$resolution_greatergood_workers_rights$§! trở thành Luật Thiên Hà."

 resolution_greatergood_repeal_3:0 "§RBãi bỏ $resolution_greatergood_greater_than_ourselves$§!"
 resolution_greatergood_repeal_3_desc:0 "$resolution_greatergood_repeal_1_desc$"
 resolution_greatergood_repeal_3_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_greatergood_greater_than_ourselves$§!, biến §Y$resolution_greatergood_five_year_plans$§! trở thành Luật Thiên Hà."

 resolution_greatergood_repeal_4:0 "§RBãi bỏ $resolution_greatergood_balance_in_the_middle$§!"
 resolution_greatergood_repeal_4_desc:0 "$resolution_greatergood_repeal_1_desc$"
 resolution_greatergood_repeal_4_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_greatergood_balance_in_the_middle$§!, biến §Y$resolution_greatergood_greater_than_ourselves$§! trở thành Luật Thiên Hà."

 resolution_greatergood_repeal_5:0 "§RBãi bỏ $resolution_greatergood_universal_prosperity_mandate$§!"
 resolution_greatergood_repeal_5_desc:0 "$resolution_greatergood_repeal_1_desc$"
 resolution_greatergood_repeal_5_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_greatergood_universal_prosperity_mandate$§!, biến §Y$resolution_greatergood_balance_in_the_middle$§! trở thành Luật Thiên Hà."

 resolution_greatergood_workers_rights:0 "Hiến chương Quyền Công nhân"
 resolution_greatergood_workers_rights_desc:0 "Việc pháp điển hóa các quyền của công nhân và bảo vệ họ khỏi sự bóc lột tràn lan là điều hoàn toàn hợp lý."

 resolution_greatergood_five_year_plans:0 "Kế hoạch Năm Năm"
 resolution_greatergood_five_year_plans_desc:0 "Các quan chức quản lý của mỗi hành tinh nên có được sự tự do cần thiết để đề xuất và thực hiện các kế hoạch cải cách toàn diện có lợi cho sự phát triển của tất cả mọi người."
 resolution_greatergood_five_year_plans_tooltip:0 "Các loại quy hoạch hành tinh Nông nghiệp, Trạm phát điện và Khai khoáng sẽ nhận được phần thưởng bổ sung.\n\nTiêu chuẩn sống §YĐảm bảo Cơ bản§! bị §Rcấm§!."

 resolution_greatergood_greater_than_ourselves:0 "Thăng hoa Bản thân"
 resolution_greatergood_greater_than_ourselves_desc:0 "Chúng ta đã yêu cầu người dân hy sinh rất nhiều, nhưng đôi khi chúng ta cần họ phải cống hiến nhiều hơn nữa. Chúng ta nên tưởng thưởng cho những ai đặt quốc gia lên trên nhu cầu của bản thân, tự nguyện đi khai phá những vùng biên viễn."
 resolution_greatergood_greater_than_ourselves_tooltip:1 "Mở khóa một sắc lệnh mới, sắc lệnh này khuyến khích những dân số tự do đang thất nghiệp tự động di cư đến các hành tinh phù hợp với họ trong đế chế, nơi có sẵn nhà ở và việc làm.\n\nTiêu chuẩn sống §YĐảm bảo Cơ bản§! và §YKinh tế Phân tầng§! sẽ bị §Rcấm§!.\n\nCác loại hình nô lệ §YLao động Nô lệ§!, §YGia súc§! và §YHợp nhất Lưới điện§! sẽ bị §Rcấm§!."
 edict_greater_than_ourselves:0 "$resolution_greatergood_greater_than_ourselves$"
 edict_greater_than_ourselves_desc:1 "Khuyến khích những dân số tự do đang thất nghiệp tự động di cư đến các hành tinh phù hợp với họ trong đế chế, nơi có sẵn nhà ở và việc làm."
 greater_than_ourselves_tooltip:0 "§YMở khóa Sắc lệnh:§! $edict_greater_than_ourselves$"
 federations.10010.name:0 "$resolution_greatergood_greater_than_ourselves$"
 federations.10010.desc:1 "Với việc những quyền lợi này vừa được thông qua trong nghị quyết của [global_event_country.GetGalCommunityOrGalImperium], chúng ta đồng thời cũng yêu cầu các công nhân phải gánh vác nhiều trách nhiệm hơn.\n\nBây giờ chúng ta có thể khuyến khích những công nhân thất nghiệp tự động di cư đến các hành tinh có thể định cư khác dưới quyền kiểm soát của chúng ta, những nơi có đủ nhà ở và việc làm."
 federations.10010.desc_gestalt:1 "[global_event_country.GetGalCommunityOrGalImperium] đã thông qua các quy định cấp nhiều quyền hạn hơn cho các cá thể làm việc.\n\nMặc dù điều này không có nhiều ý nghĩa đối với chúng ta, nhưng ít nhất chúng ta cũng có thể hưởng lợi một phần từ cơ sở hạ tầng mà họ xây dựng để vận chuyển các cá thể nhàn rỗi."
 federations.10010.desc_wilderness: "[global_event_country.GetGalCommunityOrGalImperium] đã thông qua các quy định trao thêm quyền lợi cho người lao động.\n\nMặc dù điều này không có nhiều ý nghĩa đối với chúng ta, nhưng ít nhất chúng ta cũng có thể hưởng lợi một phần từ cơ sở hạ tầng mà họ xây dựng để tái định cư cho các cá thể và công nhân nhàn rỗi."

 resolution_greatergood_balance_in_the_middle:0 "Không Thiên vị"
 resolution_greatergood_balance_in_the_middle_desc:0 "Chúng ta phải xóa bỏ mọi hình thức bất bình đẳng, không từ bất kỳ thủ đoạn cần thiết nào để tạo ra sự công bằng, tuyệt đối không được phép để xảy ra tình trạng kẻ ăn không hết người lần chẳng ra."
 resolution_greatergood_balance_in_the_middle_tooltip:0 "Các tiêu chuẩn sống §YĐảm bảo Cơ bản§!, §YKinh tế Phân tầng§!, §YTiêu chuẩn Thể diện§! và §YĐặc quyền Học thuật§! sẽ bị §Rcấm§!.\n\nMọi hình thức §YChế độ Nô lệ§! đều sẽ bị §Rcấm§!."

 resolution_greatergood_universal_prosperity_mandate:0 "Cùng nhau Làm giàu"
 resolution_greatergood_universal_prosperity_mandate_desc:0 "Nếu một ngân hà vắt ngang qua vô số nền văn minh mà cũng không thể nuôi sống toàn bộ người dân của chúng ta, thì thực sự là chúng ta đã thất trách. Mỗi người đều có quyền theo đuổi bất cứ thứ gì. Chúng ta nên tiến hành các biện pháp bổ sung để tái phân phối những của cải dư thừa, từ đó cải thiện cuộc sống của toàn bộ người dân."
 resolution_greatergood_universal_prosperity_mandate_tooltip:1 "Tất cả mức sống ngoại trừ §YĐồng Cam Cộng Khổ§!, §YQuyền Sở Hữu Của Nhân Viên§!, §YThịnh Vượng Không Tưởng§!, §YHạnh Phúc Hóa Học§! hoặc §YChăm Sóc Bắt Buộc§! đều bị §Rcấm§!.\n\n§YĐồng Hóa§! sinh vật hữu cơ vào một đế chế §YKẻ Đồng Hóa Cuồng Tín§! hoặc §YTổ Đàn Tập Tính§! bị §Rcấm§!.\n\nCác đế chế không theo chủ nghĩa §YBình Đẳng§! hoặc §YKẻ Phục Vụ Nổi Loạn§! có thể không đáp ứng được các yêu cầu này và sẽ ở trạng thái §RVi Phạm Luật Thiên Hà§!!"

 # Mutual Defense
 resolution_category_mutualdefense:0 "Phòng thủ Chung"

 resolution_mutualdefense_repeal_1:0 "§RBãi bỏ $resolution_mutualdefense_the_readied_shield$§!"
 resolution_mutualdefense_repeal_1_desc:0 "Các vấn đề quân sự nên do liên bang và hiệp ước phòng thủ quyết định, thượng viện không có quyền can thiệp."
 resolution_mutualdefense_repeal_1_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_mutualdefense_the_readied_shield$§!."

 resolution_mutualdefense_repeal_2:0 "§RBãi bỏ $resolution_mutualdefense_military_readiness_act$§!"
 resolution_mutualdefense_repeal_2_desc:0 "$resolution_mutualdefense_repeal_1_desc$"
