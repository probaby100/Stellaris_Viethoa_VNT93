 colonial_spirit_mod:0 "Tinh thần Thuộc địa"
 colonial_spirit_mod_desc:0 "Những người đi tiên phong trên thuộc địa này đã quyết tâm tạo dựng cuộc sống mới nơi biên ải. Họ có một tinh thần làm việc phi thường, thứ nay đã trở thành một truyền thống lâu đời."

