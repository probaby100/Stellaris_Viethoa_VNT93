 resolution_mutualdefense_repeal_3_desc:0 "$resolution_mutualdefense_repeal_1_desc$"
 resolution_mutualdefense_repeal_3_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_mutualdefense_enemy_of_my_enemy$§!, biến §Y$resolution_mutualdefense_military_readiness_act$§! trở thành Luật Thiên Hà."

 resolution_mutualdefense_repeal_4:1 "§RBãi bỏ $resolution_mutualdefense_castigation_proclamation$§!"
 resolution_mutualdefense_repeal_4_desc:0 "$resolution_mutualdefense_repeal_1_desc$"
