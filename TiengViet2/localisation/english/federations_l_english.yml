 START_SCREEN_SRW:0 "Trong dòng chảy dài của lịch sử, chúng ta từ lâu đã lãng quên việc người dân của mình đã đến [GetHomeWorldName] như thế nào. Chúng ta chỉ biết rằng vào khoảng 2000 năm trước, một thảm họa tàn khốc đến mức khó tin đã phá hủy phần lớn Thế giới Vành đai, cướp đi sinh mạng của vô số người, và chúng ta đã gượng dậy từ đống đổ nát đó.\n\nNền văn minh của chúng ta đã phát triển mạnh mẽ, và nay đã sẵn sàng khám phá biển sao bao la - dù đây là lần đầu tiên, hay là thêm một lần nữa. Mặc dù đã đạt được những bước tiến dài, nhưng để có thể thấu hiểu và tu sửa lại quê hương vành đai của mình, chúng ta vẫn còn cả một chặng đường dài phía trước."

 START_SCREEN_REMNANTS:1 "Đã từng có thời, đế chế của chúng ta trải dài khắp hư không. Đã từng có thời, hạm đội của chúng ta tự do rong ruổi khắp dải ngân hà. Thế rồi chúng ta suy tàn, chúng ta sụp đổ. Cuối cùng, sau một thiên niên kỷ thanh tẩy, chúng ta sẽ quay trở lại giữa những vì sao! Cuối cùng, nền văn minh của chúng ta đã được xây dựng lại đến mức đủ để bắt đầu các chuyến du hành liên sao, và biển sao mênh mông này sẽ một lần nữa trở thành vật trong túi của chúng ta!\n\nRất nhiều khu vực trên [GetHomeWorldName] của chúng ta hiện vẫn còn là những đống đổ nát, việc dọn dẹp những khu vực này sẽ giúp chúng ta khai quật được các nguồn tài nguyên bị thất lạc hoặc những công nghệ bị lãng quên."

 START_SCREEN_TREE:0 "Kể từ giây phút tâm trí tập thể của chúng ta thức tỉnh, chúng ta đã thề trung thành với Cây Sự sống. Và Cây Sự sống cũng đáp lại chúng ta. Chúng ta chăm sóc nó, nuôi dưỡng nó, bảo vệ nó, và Cây Sự sống cũng nuôi dưỡng chúng ta. Nhân danh Cây Sự sống, chúng ta đã lan tỏa khắp [GetHomeWorldName], đi đến đâu, chúng ta đều gieo mầm và bảo vệ những nhánh con của Cây Sự sống.\n\nGiờ đây, hành tinh của chúng ta đã phục vụ Cây Sự sống suốt nhiều thế kỷ, và sẽ tiếp tục phục vụ nó. Khi nhận ra rằng có những mối đe dọa tiềm ẩn đủ sức hủy diệt cả hành tinh, chúng ta e sợ rằng Cây Sự sống đang không được an toàn tuyệt đối. Chúng ta đã sớm biết rằng đây không phải là hành tinh duy nhất, trong thiên hà vẫn còn vô số các hành tinh không có Cây Sự sống, và chúng ta khao khát thay đổi điều đó. Cây Sự sống cần phải được duy trì, nhân rộng, và sinh sôi nảy nở không ngừng."

 START_SCREEN_LITHOID:0 "Dù không có bất kỳ ghi chép nào về nguồn gốc (khởi nguyên) của chúng ta, nhưng có một điều chắc chắn là những tổ tiên chưa được khai trí của chúng ta đã đến [GetHomeWorldName] cùng với một khối thiên thạch khổng lồ, vụ va chạm đã mang theo ngọn lửa và thảm họa, quét sạch phần lớn cư dân bản địa trên hành tinh.\n\nHàng triệu năm đã trôi qua, những [GetSpeciesName] đầu tiên đã dần lan tỏa khắp bề mặt [GetHomeWorldName], không ngừng tiến hóa và sinh sôi nảy nở. Nền văn minh của chúng ta không ngừng vươn xa và trở nên thịnh vượng, với việc phát minh ra [GetStartingDrive], chúng ta đã sẵn sàng để khám phá biển sao bao la này."

 rediscover_tech:0 "\nTrong đống tàn tích rất có thể chứa đựng một vài kiến thức đã thất truyền của chúng ta."

