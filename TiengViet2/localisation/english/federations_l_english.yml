 START_SCREEN_SCION:1 "Vào những năm tháng đầu tiên trong lịch sử của chúng ta, khi công nghệ vẫn chưa có nhiều bước tiến phát triển, những vị ân nhân ngoại lai của chúng ta đã cho chúng ta biết về sự tồn tại của họ. Họ đã sử dụng một cách thức mà những bậc tiền bối đang trong tình trạng bối rối của chúng ta có thể hiểu được để giải thích cho chúng ta nghe, nói rằng tương lai của giống loài chúng ta là không có giới hạn. Với một sự kiên nhẫn to lớn, họ đã dẫn dắt chúng ta bước lên con đường đúng đắn, giúp cho nền văn minh của chúng ta có thể phát huy tối đa mọi tiềm năng của mình.\n\nĐã có một vài lần, chúng ta đi chệch khỏi con đường đúng đắn này, và họ đã sửa chữa lại hướng đi cho chúng ta - với một thái độ kiên quyết như những người giám hộ - rất nhanh sau đó, các nhà khoa học của chúng ta đã làm chủ được năng lượng điện, năng lượng nguyên tử, và tiếp theo là những chuyến du hành không gian sơ khai. Dưới sự dạy bảo ân cần của những người giám sát, giờ đây chúng ta đã chế tạo ra được chiếc [GetStartingDrive] đầu tiên của mình."
 START_SCREEN_SCION_NOMADS: "Từ rất lâu trước khi chúng ta biết đọc hiểu các vì sao, những ân chủ ngoại lai đã tìm thấy chúng ta—một tộc người du mục non trẻ, dũng khí có thừa nhưng tri thức lại hạn hẹp, đang lênh đênh trên những con tàu phương châu giữa màn đêm vô tận. Họ đã giải thích bằng cách mà những tổ tiên bối rối của chúng ta có thể thấu hiểu, rằng tương lai của giống loài chúng ta là vô hạn. Bằng sự kiên nhẫn vô bờ, họ dẫn dắt chúng ta đi đúng con đường, giúp nền văn minh của chúng ta khai phá trọn vẹn tiềm năng của mình.\n\nDù từng có vài lần chúng ta chệch khỏi con đường ấy—nhưng bằng sự kiên quyết của một người bảo hộ—chẳng mấy chốc, các kỹ sư của chúng ta đã học được cách trích xuất từ tàu phương châu nguồn năng lượng lớn hơn rất nhiều so với những gì tổ tiên từng tưởng tượng. Dưới sự ân cần chỉ bảo của những người giám sát, giờ đây chúng ta đã chế tạo thành công [GetStartingDrive] đầu tiên."
 origin_scion:0 "Hậu duệ Cổ đại"
 origin_scion_desc:0 "Một Đế chế Cổ đại đã can thiệp vào quá trình phát triển của nền văn minh này suốt hàng nghìn năm, dẫn dắt họ đi theo con طريق mà Đế chế Cổ đại đã chọn."
 origin_tooltip_scion_effects:3 "— Lập quốc làm ['concept_scion', £scion£Hậu duệ Cổ đại] dưới quyền Tông chủ ['concept_fallen_empire']\n— $HOME_SYSTEM$ kết nối trực tiếp với thủ đô Tông chủ qua một ['concept_wormhole']\n— §YĐế chế Cổ đại§! chắc chắn xuất hiện trong thiên hà, bỏ qua cài đặt bản đồ\n— Có cơ hội nhận được những món quà hùng mạnh từ Tông chủ"
 opinion_scion:0 "Hậu duệ Cổ đại"

 origin.10.a.desc:0 "Xin chào, những [Root.GetSpeciesNamePlural] trung thành. Các ngươi làm tốt lắm. Dưới sự dẫn dắt của chúng ta, các ngươi đã làm chủ công nghệ du hành siêu không gian, lần đầu tiên sẵn sàng vươn mình ra khám phá vô vàn vì sao... hệt như những gì chúng ta từng làm từ vô số kỷ nguyên trước.\n\nĐừng sợ hãi—nếu không tin rằng các ngươi đã sẵn sàng, chúng ta đã chẳng để các sự kiện diễn ra đưa các ngươi đến tận bước đường này. Giờ hãy lên đường và trở thành niềm tự hào của chúng ta."
 origin.10.a:0 "Chắc chắn rồi."
 origin.10.b.desc:0 "Hỡi các [Root.GetSpeciesNamePlural]. Giai đoạn đầu của cuộc thử nghiệm đã hoàn thành mỹ mãn—chúng ta đã chỉ dẫn cho các ngươi chế tạo thành công [GetStartingDrivePlural] đầu tiên của nền văn minh, và giờ đây các ngươi đã sẵn sàng khám phá các vì sao.\n\nHãy yên tâm, giai đoạn hai đã chính thức bắt đầu và chúng ta sẽ tiếp tục giám sát bước tiến của các ngươi. Cho đến nay, các ngươi đã chứng tỏ mình vượt trội và tinh anh hơn hẳn so với những sinh vật khác.\n\nSẽ rất thú vị khi quan sát xem các ngươi có thể làm được những gì với cơ hội này."
 origin.10.b:0 "Chúng tôi sẽ không làm ngài thất vọng."

 casus_belli_cb_scion:0 "Hậu duệ Cổ đại"
 war_goal_wg_scion:0 "Thu về dưới trướng"
 war_goal_wg_scion_desc:0 "Phát động chiến tranh nhằm ép buộc kẻ thù trở thành chư hầu cho Tông chủ Đế chế Cổ đại của chúng ta.\n\n\n\nNếu chiến tranh kết thúc bằng \"Giữ nguyên trạng\", các hệ sao mà chúng ta chiếm đóng có chứa ít nhất một hành tinh sẽ được giải phóng để trở thành chư hầu mới của Tông chủ."
 casus_belli_cb_hegemon:0 "Bá chủ Một phương"
 war_goal_wg_hegemon:0 "Thành lập Liên Bang Bá Quyền"
 war_goal_wg_hegemon_desc:0 "Phát động chiến tranh nhằm ép buộc kẻ thù trở thành một thành viên trong Liên bang Bá quyền của chúng ta.\n\n\n\nNếu chiến tranh kết thúc bằng \"Giữ nguyên trạng\", các hệ sao mà chúng ta chiếm đóng có chứa ít nhất một hành tinh sẽ được giải phóng để trở thành thành viên mới trong Liên bang Bá quyền."
 casus_belli_cb_secession:0 "Bứt khỏi Khối"
 war_goal_wg_leave_hegemony:0 "Rời khỏi Liên bang Bá quyền"
 war_goal_wg_leave_hegemony_desc:0 "Phát động chiến tranh để bứt khỏi sự kiểm soát của Liên Bang Bá Quyền. Các quốc gia thành viên khác có cùng mục tiêu chiến tranh này có thể được mời làm đồng minh."
 war_goal_wg_assert_hegemony:0 "Củng cố Liên Bang Bá Quyền"
 war_goal_wg_assert_hegemony_desc:0 "Phát động chiến tranh nhằm ngăn chặn các quốc gia thành viên bứt khỏi sự kiểm soát của Liên Bang Bá Quyền."
 wg_leave_hegemony_accept:0 "§Y[Root.GetName]§! bứt khỏi sự kiểm soát của §Y[From.GetAllianceName]§!\n§Y[From.GetName]§! thu hồi toàn bộ yêu sách tại các hệ sao thuộc §Y[Root.GetAdj]§!."
 wg_leave_hegemony_status_quo:0 "§Y[Root.GetName]§! bứt khỏi sự kiểm soát của §Y[From.GetAllianceName]§!"
 wg_assert_hegemony_accept:0 "§Y[From.GetName]§! tiếp tục là thành viên dưới sự kiểm soát của §Y[Root.GetAllianceName]§!"


 origin.21.a.desc:0 "Điềm báo cho thấy các ngươi xứng đáng nhận món quà này vì đã tận tụy phục vụ chúng ta. Đừng phung phí nó."
 origin.21.b.desc:0 "Sau khi cân nhắc kỹ lưỡng, chúng ta quyết định đưa thêm một biến số mới vào cuộc thử nghiệm. Hãy nhận lấy món quà này và toàn quyền định đoạt nó theo ý các ngươi."
 origin.21.a:0 "Xin cảm ơn."

 FE_TO_SCION_GREETING_01:0 "Xin chào, [From.GetSpeciesNamePlural]. Chúng tôi đã biết từ lâu rằng các bạn rất đặc biệt."
 FE_TO_SCION_GREETING_02:0 "Các bạn đến đây để tìm kiếm thêm những chỉ dẫn khác sao, [From.GetSpeciesNamePlural]? Chúng tôi không có chỉ dẫn nào khác để cung cấp cho các bạn."
 FE_TO_SCION_GREETING_03:0 "Có lẽ một ngày nào đó các bạn sẽ đạt được những thành tựu vĩ đại giống như chúng tôi. Điều này hoàn toàn nằm trong phạm vi có thể xảy ra."
 FE_TO_SCION_GREETING_04:0 "Các bạn thật may mắn, chúng tôi có đôi chút hứng thú với giống loài của các bạn, [From.GetSpeciesNamePlural]."
 FE_TO_SCION_GREETING_05:0 "Về mặt cá nhân mà nói, tôi chưa bao giờ ngờ rằng nền văn minh của các bạn có thể đạt được những điều như ngày hôm nay."
 FE_TO_SCION_GREETING_06:0 "Nhìn thấy các bạn ở đây vào ngày hôm nay, tôi lại nhớ đến lý do tại sao ban đầu chúng tôi lại chọn giống loài của các bạn."
 FE_TO_SCION_GREETING_07:0 "Hỡi những đứa trẻ, cái thời mà chúng tôi còn giống như các bạn đã trôi qua từ rất lâu rồi. Đó là một khoảng thời gian giản đơn hơn - và trong nhiều khía cạnh cũng vui vẻ hơn. Hãy trân trọng khoảng thời gian này khi các bạn vẫn còn có cơ hội."
 FE_TO_SCION_GREETING_08: "Này, xin chào! Tất nhiên rồi, ý tôi là, [From.GetSpeciesNamePlural]. Thật không may là bây giờ chúng tôi đang hơi bận."
 SCION_TO_SCION_GREETING_01:0 "Các vị chủ nhân thích chúng ta nhất. Chúng ta biết rằng điều này là sự thật."
 SCION_TO_SCION_GREETING_02:0 "Có lẽ một ngày nào đó chúng ta sẽ thừa kế lại thủ đô của các vị chủ nhân, nếu họ quyết định rút lui khỏi các vấn đề của thiên hà,"
 SCION_TO_SCION_GREETING_03:0 "Đừng vội tuyệt vọng khi phải đối mặt với sự thật rằng các vị chủ nhân thích chúng ta hơn các bạn. Chúng ta đều có vị trí riêng của mình trong những kế hoạch của họ."
 SCION_TO_SCION_GREETING_04:0 "Các bạn gần đây có nói chuyện với các vị chủ nhân không? Họ có nhắc đến chúng ta không?"
 SCION_TO_SCION_GREETING_05:0 "Chúng ta đã chấp nhận vai trò mà các vị chủ nhân chỉ định cho chúng ta. Còn các bạn thì sao?"
 SCION_TO_SCION_GREETING_06:0 "Xin chào các bạn, những hậu duệ đồng đội. Rất vui được gặp các bạn."

 SCION_TO_EMPIRE_GREETING_01:0 "Hãy phục tùng các vị chủ nhân của chúng ta. Họ biết điều gì là tốt nhất đối với những nền văn minh trẻ tuổi giống như các bạn và chúng tôi."
 SCION_TO_EMPIRE_GREETING_02:0 "Các vị chủ nhân của chúng ta đã lên kế hoạch cho tất cả chúng ta. Không giống như các bạn, chúng ta đã chấp nhận vai trò của mình trong bản kế hoạch đó,"
 SCION_TO_EMPIRE_GREETING_03:0 "Được phục vụ cho một nhánh của chủng tộc tiền bối là một vinh dự to lớn."
 SCION_TO_EMPIRE_GREETING_04:0 "Có lẽ một ngày nào đó các bạn cũng sẽ có được vinh dự như chúng tôi, trở thành những người hầu được lựa chọn bởi các vị chủ nhân cổ đại của chúng tôi."
 SCION_TO_EMPIRE_GREETING_05:0 "Thiếu vắng sự dẫn dắt của chủng tộc tiền bối, các bạn không cảm thấy lạc lõng sao?"
 SCION_TO_EMPIRE_GREETING_06:0 "Các vị chủ nhân của chúng ta đã dạy cho chúng ta rất nhiều điều. Có lẽ rồi sẽ có một ngày, họ cũng sẽ truyền thụ lại trí tuệ của mình cho các bạn."

 fedel.2.name:0 "Trận chiến Đấu trường"
 fedel.2.desc:0 "Đã đến lúc quyết định ai sẽ lãnh đạo [Root.GetAllianceName] trong nhiệm kỳ tiếp theo. Đúng như đã thỏa thuận từ trước, chúng ta sẽ phân định ngôi vị bằng hình thức giáp lá lá tay không.\n\nLãnh đạo của mỗi quốc gia thành viên sẽ được đưa đến một đấu trường lớn tại [fed_leader.Capital.GetName], thủ phủ của [fed_leader.GetName]—quốc gia Chủ tịch hiện tại. Tại đó, một cuộc đọ sức được phát sóng trên toàn [Root.GetAllianceName] sắp sửa diễn ra, nơi họ phải chiến đấu tới chết cho đến khi chỉ còn một người duy nhất trụ lại."
 fedel.2.noleader.desc:0 "Đã đến lúc quyết định ai sẽ lãnh đạo [Root.GetAllianceName] trong nhiệm kỳ tiếp theo. Theo đúng thỏa thuận trước đó, ngôi vị sẽ được phân định bằng hình thức giáp lá lá tay không.\n\nThật không may, do vị trí [Root.GetRulerTitle] tại [Root.GetName] hiện đang bỏ trống, chúng ta đành phải đứng ngoài cuộc quyết đấu này."
 fedel.2.vassal.desc:0 "Đã đến lúc xác định ai sẽ lãnh đạo [Root.GetAllianceName] trong nhiệm kỳ tiếp theo. Theo đúng thỏa thuận trước đó, cuộc quyết đấu giáp lá lá tay không sẽ phân định tất cả.\n\nVì [Root.GetName] không phải là một quốc gia độc lập, chúng ta không thể tham gia do không đủ tư cách lãnh đạo Liên minh. Chúng ta cần dốc sức thay đổi tình cảnh đáng buồn này."
 fedel.2.gestalt.desc:0 "Đã đến lúc quyết định ai sẽ lãnh đạo [Root.GetAllianceName] trong nhiệm kỳ tiếp theo. Theo đúng thỏa thuận trước đó, người đứng đầu sẽ được phân định qua một cuộc giáp lá lá tay không.\n\nDo lãnh đạo của [Root.GetName] không tồn tại dưới dạng một cá thể đơn lẻ, chúng ta không thể tham dự. Chúng ta phải dốc sức thay đổi phương thức bầu Chủ tịch Liên bang vô lý và phi lý này."
 fedel.2.a:0 "Mong người giỏi nhất sẽ bước lên ngôi Chủ tịch."
 fedel.2.b:0 "Hãy xem cỗ máy mô phỏng lãnh đạo của ai sẽ trụ lại sau cùng."
 arena_combat_begin:0 "Trận chiến trong đấu trường sắp sửa bắt đầu."

 fedel.10.name:0 "Chiến thắng tại Đấu trường"
 fedel.10.intro:0 "[ruler.GetRulerTitle] [ruler.GetRegnalName] cùng với lãnh đạo từ các quốc gia thành viên khác thuộc [Root.GetAllianceName] được đưa tới đấu trường ở [fed_leader.Capital.GetName]. Không ai trong số họ được mang theo vũ khí hay áo giáp. Mọi lãnh đạo chỉ có thể cậy vào thể lực của chính mình và dùng sự ranh mãnh để nhìn thấu tâm cơ đối thủ."
 fedel.10.1.desc:0 "$fedel.10.intro$\n\n$fedel.10.1$"
 fedel.10.1:0 "Ngay khi trận chiến bắt đầu, [ruler.GetRegnalName] đã quay đầu bỏ chạy, dành phần lớn thời gian trong cuộc hỗn chiến sau đó chỉ để hoảng hốt né tránh các đối thủ. Thật khó tin là [ruler.GetSheHe] lại giành chiến thắng với tư cách người sống sót cuối cùng, bởi lẽ kẻ cuối cùng truy đuổi [ruler.GetHerHis] đã tự gục ngã và bỏ mạng vì những vết thương mắc phải từ trước."
 fedel.10.2.desc:0 "$fedel.10.intro$\n\n$fedel.10.2$"
 fedel.10.2:0 "Sau khi trận chiến bắt đầu, [ruler.GetRegnalName] đã nhanh chóng chứng minh rằng bản thân hoàn toàn không có chút năng khiếu nào trong việc đánh lộn. May mắn thay, các nhà lãnh đạo khác thậm chí còn tệ hại hơn. Trong một trận chiến mệt mỏi dường như sẽ kéo dài vô tận, [ruler.GetSheHe] cuối cùng cũng đã trở thành người sống sót duy nhất tham gia vào cuộc chiến. Khi chiến thắng được tuyên bố, phần lớn khán giả đã rời khỏi đấu trường."
 fedel.10.3.desc:0 "$fedel.10.intro$\n\n$fedel.10.3$"
 fedel.10.3:0 "Quá trình diễn ra trận chiến vô cùng tàn bạo, nhưng [ruler.GetRegnalName] đã chứng tỏ được sức mạnh của [ruler.GetHerHis] bằng cách tự tay tiêu diệt nhiều nhà lãnh đạo đối đầu với mình trong một trận hỗn chiến. Khi mọi chuyện đã ngã ngũ, [ruler.GetSheHe] là người duy nhất tham gia cuộc chiến vẫn còn đứng vững trên sân."
 fedel.10.4.desc:0 "$fedel.10.intro$\n\n$fedel.10.4$"
 fedel.10.4:0 "Trận chiến diễn ra rất dài và đẫm máu, [ruler.GetRegnalName] đã phải hứng chịu vô số vết thương. Mặc dù vậy, [ruler.GetSheHe] đã chứng minh được sức bền của [ruler.GetHerHis] bằng cách trụ lại lâu hơn tất cả các đối thủ khác. Khi trận chiến kết thúc, [ruler.GetSheHe] là nhà lãnh đạo duy nhất vẫn còn sống sót... mặc dù đã thoi thóp hơi tàn."
 fedel.10.5.desc:0 "$fedel.10.intro$\n\n$fedel.10.5$"
 fedel.10.5:0 "Khi tiếng súng báo hiệu trận chiến bắt đầu vang lên, tình hình đã nhanh chóng trở nên rõ ràng, trong đấu trường này không có bất kỳ nhà lãnh đạo nào có thể sánh ngang với kỹ năng và năng lực thuần túy của vị [ruler.GetRulerTitle] của chúng ta. Họ lần lượt bị hạ gục dễ như trở bàn tay, cho đến khi chỉ còn lại [ruler.GetRegnalName] là người sống sót."
 fedel.10.6.desc:0 "$fedel.10.intro$\n\n$fedel.10.6$"
 fedel.10.6:0 "[ruler.GetRegnalName] nhanh chóng hạ gục những kẻ khờ dại đáng thương dám bước vào đấu trường cùng [ruler.GetHerHim]. Chỉ một ánh nhìn thoáng qua, thi thể vô hồn của các nhà lãnh đạo khác đã đổ gục xuống sàn đấu. Toàn bộ đấu trường chìm vào sự im lặng tuyệt đối khi [ruler.GetRulerTitle] bước chân rời khỏi nơi này trong dáng vẻ kiêu hãnh của [ruler.GetHerHis]."
 fedel.10.7.desc:0 "$fedel.10.intro$\n\n$fedel.10.7$"
 fedel.10.7:0 "Các vị lãnh đạo khác trong đấu trường đã ngay lập tức bị thiêu rụi thành tro bụi như một quy trình thông thường - trận chiến thực sự ở đây ngày hôm nay sẽ diễn ra giữa sức mạnh tâm linh khổng lồ của [ruler.GetRegnalName] và [rival_chosen_leader.GetRulerTitle] [rival_chosen_leader.GetRegnalName] của [rival_chosen_country.GetName]. Sau một cuộc đọ sức dài hơi và có quy mô hoành tráng, [ruler.GetRegnalName] cuối cùng đã giành chiến thắng, [rival_chosen_leader.GetRegnalName] đã bị đánh bại hoàn toàn. Phần lớn đấu trường đã biến thành một đống đổ nát, nhưng mọi chuyện cũng đã đi đến hồi kết."
 fedel.10.8.desc:0 "$fedel.10.intro$\n\n$fedel.10.8$"
 fedel.10.8:0 "Đây là một trận chiến thực sự giữa những kẻ mạnh. Khó có thể nhìn thấy được sức mạnh tâm linh được thi triển trong đấu trường này ở bên ngoài gông cùm của Hư Cảnh. Khi trận chiến kết thúc, đấu trường đã trở thành một đống hoang tàn, [ruler.GetRegnalName] là á thần duy nhất vẫn còn sống sót."
 fedel.10.9.desc:0 "$fedel.10.intro$\n\n$fedel.10.9$"
 fedel.10.9:0 "Khả năng tâm linh mạnh mẽ của [ruler.GetRegnalName] đã mang lại cho [ruler.GetHerHim] một lợi thế mang tính quyết định trong đấu trường, và [ruler.GetSheHe] đã nhanh chóng tận dụng triệt để lợi thế này. Ngài đã dùng năng lực tâm linh để nướng chín não của đối thủ, và dùng niệm lực để ném các nhà lãnh đạo khác vào nhau với tốc độ chết người, trận chiến đã kết thúc một cách nhanh chóng."
 fedel.10.10.desc:0 "$fedel.10.intro$\n\n$fedel.10.10$"
 fedel.10.10:0 "Bộ nâng cấp cơ thể bán tự động quy mô lớn mà [ruler.GetRegnalName] đã lắp đặt quả nhiên đã mang tính quyết định trong đấu trường. [ruler.GetSheHe] đã di chuyển với hiệu suất của một cỗ máy, có khả năng chống đỡ và bật ngược lại những đòn tấn công có thể lấy mạng một sinh vật hữu cơ thuần túy, và nhanh chóng tiêu diệt các nhà lãnh đạo khác."
 fedel.10.11.desc:0 "$fedel.10.intro$\n\n$fedel.10.11$"
 fedel.10.11:0 "So với phần lớn các sinh vật hữu cơ khác, [ruler.GetRegnalName] sở hữu sức mạnh và tốc độ phản xạ vượt trội hơn hẳn, và đã có một màn thể hiện xuất sắc trong đấu trường. Các nhà lãnh đạo khác lần lượt bị tiêu diệt một cách hiệu quả và tương đối ít đau đớn."
 fedel.10.a:0 "Chiến thắng thuộc về chúng ta!"

 fedel.15.name:0 "Thất Bại Tại Đấu Trường"
 fedel.15.1.desc:0 "$fedel.10.intro$\n\n$fedel.15.1$"
 fedel.15.1:0 "Đáng buồn thay, [ruler.GetRegnalName] đã không đủ năng lực gánh vác sứ mệnh. Không lâu sau khi trận hỗn chiến bắt đầu, [ruler.GetSheHe] mất đi dũng khí của [ruler.GetHerHis] và hoảng loạn tìm cách tháo chạy khỏi đấu trường, trước sự chế giễu của đám đông khán giả trên khán đài. Khi [ruler.GetSheHe] rốt cuộc bị dồn vào góc bởi một trong những lãnh đạo đối phương, kết cục của [ruler.GetHerHis] diễn ra nhanh chóng và không chút khoan nhượng."
 fedel.15.2.desc:0 "$fedel.10.intro$\n\n$fedel.15.2$\n\n$fedel.15.victor.desc$"
 fedel.15.2:0 "[ruler.GetRegnalName] đã cất lên một tiếng thét xung trận đầy kiên định, sau đó [ruler.GetHerselfHimself] đã lao thẳng về phía trận hỗn chiến tàn bạo đang dần mở màn trong đấu trường. Tuy nhiên, sự dũng cảm của [ruler.GetHerHis] lại vượt xa so với khả năng chiến đấu thực sự của [ruler.GetHerHis], [ruler.GetSheHe] đã bị hạ gục bởi một trong những vị lãnh đạo khác mà không cần phải suy nghĩ nhiều."
 fedel.15.3.desc:0 "$fedel.10.intro$\n\n$fedel.15.3$\n\n$fedel.15.victor.desc$"
 fedel.15.3:0 "Sau một chút do dự, [ruler.GetRegnalName] đã tham gia vào cuộc đối đầu không lâu sau khi trận chiến bắt đầu. [ruler.GetSheHe] đã xông xáo tiến lùi giữa một trận hỗn chiến tàn bạo, và đã giành được tiếng tăm cho [ruler.GetHerselfHimself]. Tuy nhiên, cuối cùng [ruler.GetSheHe] đã gục ngã vì những vết thương trên người [ruler.GetSheHe] trước khi trận chiến kết thúc."
 fedel.15.4.desc:0 "$fedel.10.intro$\n\n$fedel.15.4$\n\n$fedel.15.victor.desc$"
 fedel.15.4:0 "[ruler.GetRegnalName] lập tức lao vào chiến trận và nhanh chóng khẳng định vị thế bản thân [ruler.GetHerselfHimself] như một trong những đối thủ đáng gờm nhất. Có lẽ chính vì điều đó, một số nhà lãnh đạo khác đã tạm thời liên minh chống lại [ruler.GetHerHim]. Sức mạnh kết hợp của họ vượt quá sức chịu đựng, và dù cho [ruler.GetHerHis] đã chiến đấu dũng cảm, [ruler.GetRegnalName] sớm gục ngã vì những vết thương chí mạng của [ruler.GetHerHis]."
 fedel.15.5.desc:0 "$fedel.10.intro$\n\n$fedel.15.5$\n\n$fedel.15.victor.desc$"
 fedel.15.5:0 "Chỉ sau một ánh nhìn lướt qua đơn giản của [winning_leader.GetRegnalName], vị [winning_leader.GetRulerTitle] của [winning_country.GetName], tất cả các nhà lãnh đạo khác trong đấu trường, bao gồm cả [ruler.GetRegnalName], đã gục ngã xuống mặt đất và bỏ mạng. Có lẽ việc tham gia vào đấu trường là một ý tưởng tồi tệ."
 fedel.15.6.desc:0 "$fedel.10.intro$\n\n$fedel.15.6$\n\n$fedel.15.victor.desc$"
 fedel.15.6:0 "Sau khi những năng lượng tâm linh đáng kinh ngạc của một số người tham gia va chạm vào nhau, tất cả các nhà lãnh đạo khác, bao gồm cả [ruler.GetRegnalName], đều đã bị thiêu rụi thành tro bụi. Họ chẳng qua chỉ là những nạn nhân phải chịu vạ lây khi các người khổng lồ đọ sức với nhau."
 fedel.15.7.desc:0 "$fedel.10.intro$\n\n$fedel.15.7$\n\n$fedel.15.victor.desc$"
 fedel.15.7:0 "Trong dải ngân hà, hiếm có tồn tại nào có thể sánh ngang với sức mạnh tâm linh của [ruler.GetRegnalName], thế nhưng, [winning_leader.GetRulerTitle] [winning_leader.GetRegnalName] của [winning_country.GetName] lại chính là một trong số đó. Sau khi các nhà lãnh đạo khác trong đấu trường bị tiêu diệt như những loài côn trùng vô giá trị, trận chiến thực sự mới bắt đầu. Trong đấu trường nhanh chóng dấy lên một cơn bão tâm linh, và khi cơn bão lắng xuống. [ruler.GetRegnalName] đã không còn lại một dấu vết nào..."
 fedel.15.8.desc:0 "$fedel.10.intro$\n\n$fedel.15.8$\n\n$fedel.15.victor.desc$"
 fedel.15.8:0 "Đây là một trận chiến thực sự giữa những kẻ mạnh. Khó có thể nhìn thấy được sức mạnh tâm linh được thi triển trong đấu trường này ở bên ngoài gông cùm của Hư Cảnh. Khi trận chiến kết thúc, đấu trường đã trở thành một đống hoang tàn. Chỉ có một á thần vẫn còn sống sót, nhưng đó không phải là [ruler.GetRegnalName]..."
 fedel.15.9.desc:0 "$fedel.10.intro$\n\n$fedel.15.9$\n\n$fedel.15.victor.desc$"
 fedel.15.9:0 "Điều đáng buồn là, sức mạnh và tốc độ phản xạ vượt trội của [ruler.GetRegnalName] không đủ để bảo đảm một chiến thắng trong đấu trường. Những người tham gia khác chẳng bao lâu sau đã bắt đầu sử dụng chính những chi tay phụ bị cắt đứt của [ruler.GetHerHis] làm vũ khí, để đối phó với lõi bộ nhớ của chính [ruler.GetHerHis]. Khi trận chiến kết thúc, chỉ còn lại những mảnh vỡ vụn vặt."
 fedel.15.10.desc.organic: "$fedel.10.intro$\n\n$fedel.15.10.organic$\n\n$fedel.15.victor.desc$"
 fedel.15.10.desc.machine: "$fedel.10.intro$\n\n$fedel.15.10.machine$\n\n$fedel.15.victor.desc$"
 fedel.15.10.intro: "Sức mạnh tâm linh mà [ruler.GetRegnalName] sở hữu đã mang lại cho [ruler.GetHerHim] một lợi thế vô cùng lớn, nhưng cuộc chiến hỗn loạn trong đấu trường đã khiến cho việc duy trì sự tập trung trở nên vô cùng khó khăn. Thật không may, điều này cuối cùng đã trở thành nguyên nhân dẫn đến sự thất bại của [ruler.GetHerHis], khi một vị lãnh đạo khác đã tấn công [ruler.GetHerHim] từ phía sau."
 fedel.15.10.organic: "$fedel.15.10.intro$ Cái chết đã ập đến rất nhanh, nhưng tuyệt đối không phải là không có chút đau đớn nào."
 fedel.15.10.machine: "$fedel.15.10.intro$ Sự hủy diệt của ông ấy ập đến quá nhanh, đến mức còn không kịp để tính toán."
 fedel.15.a.organic: "Một ngày buồn đau."
 fedel.15.a.machine: "Một kết quả không may."

