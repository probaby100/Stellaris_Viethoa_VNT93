 cannot_change_succession_term_during_war:0 "Không thể thay đổi nhiệm kỳ của chủ tịch liên bang trong thời chiến."

 FED_WE_MUST_COMPLY:1 "Chúng ta nên tuân thủ."
 FED_THE_BAREST_MINIMUM:1 "Hãy tuân thủ họ, nhưng chỉ đáp ứng ở mức tối thiểu."
 FED_WE_WILL_RETAIN:1 "Chúng ta sẽ duy trì các chính sách hiện tại không thay đổi."
 FED_WE_WILL_NOT_SUBMIT:0 "Chúng ta tuyệt đối không khuất phục!"
 FED_WE_WILL_BE_IN_BREACH:0 "Đế chế của chúng ta sẽ §Rvi phạm luật lệ ngân hà§!."

 federations.10100.desc:2 "[global_event_country.GetGalCommunityOrGalImperium] đã thông qua nghị quyết §Y$resolution_galacticstudies_advanced_xenostudies$§!, ban lệnh cấm đối với việc §YCấm Trí tuệ Nhân tạo§!, đồng thời cấm áp dụng chính sách §YKhông Can thiệp§! đối với các quần thể [GetPreFTLLowerPlural].\n\nQuốc gia của chúng ta hiện đang làm trái với nội dung của nghị quyết này, liệu có nên điều chỉnh các chính sách tương ứng để tuân thủ nghị quyết hay không?"
 federations.10100.change_ai:0 "Đế chế của chúng ta sẽ điều chỉnh chính sách §Y$policy_artificial_intelligence_policy$§! của mình thành §Y$ai_servitude$§!."
 federations.10100.change_interference:0 "Đế chế của chúng ta sẽ điều chỉnh chính sách §Y$policy_interference$§! của mình thành §Y$interference_active$§!."

 federations.10110.desc:1 "[global_event_country.GetGalCommunityOrGalImperium] đã thông qua nghị quyết §Y$resolution_galacticstudies_ethical_guideline_refactoring$§!, yêu cầu các quốc gia phải áp dụng chính sách §YTăng cường Lãnh đạo§! mạnh mẽ nhất trong phạm vi có thể.\n\nQuốc gia của chúng ta hiện đang làm trái với nội dung của nghị quyết này, liệu có nên điều chỉnh các chính sách tương ứng để tuân thủ nghị quyết hay không?"
 federations.10110.selected_lineages:0 "Đế chế của chúng ta sẽ điều chỉnh chính sách §Y$policy_leader_enhancement$§! của mình thành §Y$leader_enhancement_selected_lineages$§!."
 federations.10110.capacity_boosters:0 "Đế chế của chúng ta sẽ điều chỉnh chính sách §Y$policy_leader_enhancement$§! của mình thành §Y$leader_enhancement_capacity_boosters$§!."
 federations.10110.research_restriction: "Đế chế của chúng ta sẽ điều chỉnh chính sách §Y$policy_research_restriction_policy$§! của mình thành §Y$research_restriction_no_restriction$§!."

 federations.10200.desc:1 "[global_event_country.GetGalCommunityOrGalImperium] đã thông qua nghị quyết §Y$resolution_greatergood_five_year_plans$§!, ban lệnh cấm sử dụng tiêu chuẩn sống §Y$living_standard_subsistence$§!.\n\nQuốc gia của chúng ta hiện đang làm trái với nội dung của nghị quyết này, liệu có nên điều chỉnh các chính sách tương ứng để tuân thủ nghị quyết hay không."
 federations.10200.living_standard_stratified:0 "Đối với tất cả các giống loài đang ở tiêu chuẩn sống §Y$living_standard_subsistence$§! và có đủ điều kiện tương ứng, quốc gia của chúng ta sẽ điều chỉnh tiêu chuẩn sống của họ thành §Y$living_standard_stratified$§!, nếu thực sự cần thiết, thì sẽ điều chỉnh thành §Y$living_standard_normal$§!."
 federations.10200.living_standard_normal:0 "Quốc gia của chúng ta sẽ điều chỉnh tất cả các giống loài đang ở tiêu chuẩn sống §Y$living_standard_subsistence$§! thành §Y$living_standard_normal$§!."

 federations.10210.desc:1 "[global_event_country.GetGalCommunityOrGalImperium] đã thông qua nghị quyết §Y$resolution_greatergood_greater_than_ourselves$§!, ban lệnh cấm đối với tiêu chuẩn sống §Y$living_standard_stratified$§!, đồng thời cấm sử dụng các loại hình nô lệ §Y$slavery_normal$§!, §Y$slavery_livestock$§! và §Y$slavery_matrix$§!.\n\nQuốc gia của chúng ta hiện đang làm trái với nội dung của nghị quyết này, liệu có nên điều chỉnh các chính sách tương ứng để tuân thủ nghị quyết hay không?"
 federations.10210.living_standard_normal:0 "Quốc gia của chúng ta sẽ nâng tất cả các giống loài đang ở mức dưới tiêu chuẩn sống §Y$living_standard_normal$§! lên mức tiêu chuẩn sống này."
 federations.10210.displace_gestalt:1 "Những dân số thuộc về §Y$LIVESTOCK$§! hoặc §Y$MATRIX_LIVESTOCK$§! sẽ được chuyển sang trạng thái §YTrục xuất§!."
 federations.10210.thralls:0 "Những dân số thuộc về §Y$slavery_normal$§! hoặc §Y$slavery_livestock$§! sẽ được chuyển đổi thành §Y$slavery_military$§!."
 federations.10210.servants:0 "Những dân số thuộc về §Y$slavery_normal$§! hoặc §Y$slavery_livestock$§! sẽ được chuyển đổi thành §Y$slavery_domestic$§!."
 federations.10210.complythralls:1 "Chúng ta làm vậy cũng chỉ vì bất đắc dĩ, hãy đưa những nô lệ đó ra chiến trường."
 federations.10210.complyservants:1 "Chúng ta làm vậy cũng chỉ vì bất đắc dĩ, hãy để những nô lệ đó cung cấp các dịch vụ."
