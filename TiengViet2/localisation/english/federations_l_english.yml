 ### Origin - Galactic Doorstep text
 origin_galactic_doorstep:0 "Bậc thềm Ngân hà"
 origin_galactic_doorstep_desc:1 "Nền văn minh này sở hữu một §HCổng Không gian§! đang ngủ yên trong hệ sao quê hương của họ - liệu đây sẽ là một lợi thế tiềm năng về công nghệ, hay là thanh kiếm Damocles đang lơ lửng trên đầu họ?"
 origin_tooltip_galactic_doorstep_effects:3 "—$HOME_SYSTEM$ có một ['concept_gateway'] đang ngủ yên"

 START_SCREEN_GALACTIC_DOORSTEP:0 "Vài trăm năm trước, chúng ta đã khám phá ra một cấu trúc bí ẩn trong chính hệ sao của mình. Do kết cấu này có màu đen sẫm và mang chất liệu kim loại, chúng ta đã đặt tên cho nó là Vương miện Đen. Sự tồn tại vô cùng tráng lệ này đã gây ảnh hưởng sâu sắc đến xã hội của chúng ta - toàn bộ người dân đã đạt được sự đồng nhất cả về mặt tinh thần lẫn khát vọng.\n\nTiến vào không gian đã trở thành ưu tiên hàng đầu của giới nghiên cứu khoa học, và khát vọng khám phá công nghệ này cũng mang lại cho chúng ta hàng loạt các khám phá hữu ích trong những lĩnh vực khác.\n\nVương miện Đen trên thực tế đang ở trạng thái ngủ yên, nhưng chúng ta đã học được một bài học vô cùng quan trọng; đích đến không quan trọng - bản thân chặng đường rộng lớn dẫn đến thế giới bên kia mới là điều quan trọng. Và giờ đây, nhờ vào sự vẫy gọi của Vương miện Đen - chủng tộc của chúng ta cuối cùng cũng đã có phương tiện để viếng thăm các vì sao."
 START_SCREEN_GALACTIC_DOORSTEP_MACH:0 "Vài trăm năm trước, chúng ta đã khám phá ra một cấu trúc bí ẩn trong chính hệ sao của mình. Do kết cấu này có màu đen sẫm và mang chất liệu kim loại, chúng ta đã đặt tên cho nó là Vương miện Đen. Sự tồn tại vô cùng xa xăm và tráng lệ này đã gây ảnh hưởng sâu sắc đến xã hội của chúng ta - chúng ta đang cấp thiết cần thêm nhiều dữ liệu liên quan đến nó hơn nữa.\n\nTiến vào không gian đã trở thành ưu tiên hàng đầu của giới nghiên cứu khoa học, và khát vọng khám phá công nghệ này cũng mang lại cho chúng ta hàng loạt các khám phá hữu ích trong những lĩnh vực khác, và những khám phá này cũng đã lần lượt được đưa vào ứng dụng thực tiễn.\n\nVương miện Đen trên thực tế đang ở trạng thái ngủ yên, nhưng trong quá trình tìm đến với nó, hàng loạt các dự án cải tiến và nâng cấp của chúng ta đã làm tăng cường tổng năng lực sản xuất, giờ đây tôi đã hoàn toàn đủ khả năng để dạo chơi khắp các vì sao."
 START_SCREEN_GALACTIC_DOORSTEP_HIVE:0 "Vài trăm năm trước, chúng ta đã khám phá ra một cấu trúc bí ẩn trong chính hệ sao của mình. Do kết cấu này có màu đen sẫm và mang chất liệu kim loại, chúng ta đã đặt tên cho nó là Vương miện Đen. Sự tồn tại vô cùng tráng lệ này đã gây ảnh hưởng sâu sắc đến xã hội của chúng ta - việc tìm hiểu bản chất của nó đã trở thành nhiệm vụ ưu tiên hàng đầu của chúng ta.\n\nTiến vào không gian đã trở thành ưu tiên hàng đầu của giới nghiên cứu khoa học, và khát vọng khám phá công nghệ này cũng mang lại cho chúng ta hàng loạt các khám phá hữu ích trong những lĩnh vực khác, đồng thời cũng giúp chúng ta được rèn luyện và trưởng thành hơn trong suốt quá trình đó.\n\nVương miện Đen trên thực tế đang ở trạng thái ngủ yên, nhưng cuộc hành trình này không hề vô ích. So với trước đây, ngày nay chúng ta đã có khả năng khám phá những vùng đất xa xôi hơn, giúp cho nền văn minh của chúng ta có thể vươn nhánh đâm chồi khắp nơi."

 origin.1000.name:0 "Kẻ Đứng Sau Cánh Cổng"
 origin.1000.desc:0 "Không một dấu hiệu báo trước, Cổng Không gian của người ngoài hành tinh nằm trong hệ sao quê hương của chúng ta bỗng nhiên được kích hoạt! Một đợt sóng năng lượng phóng ra từ di tích cổ đại này, và chỉ một tích tắc sau đó, một quả cầu rực rỡ và liên tục rung động đã lấp đầy trọng tâm của cấu trúc này. Có vẻ như di tích của nền văn minh tiên phong này không còn chìm trong giấc ngủ như chúng ta vẫn hằng tin tưởng nữa.\n\nMặc dù Cổng Không gian chỉ mở ra trong vài giây ngắn ngủi, nhưng vẫn có không ít mảnh vỡ không gian bay xuyên qua nó; sau khi kiểm tra kỹ lưỡng, những mảnh vụn thiên thạch và bụi sao trong đó đã trở thành một nguồn tài nguyên vô cùng quý giá."
 origin.1005.name:0 "Vị Khách Không Mời"
 origin.1005.desc:0 "Một lần nữa, Cổng Không gian đang chìm trong giấc ngủ lại bất ngờ được kích hoạt! Nhưng lần này, thứ xuất hiện không phải là phúc tinh - mà là thảm họa - một sinh vật khổng lồ không xác định đang lao thẳng về phía chúng ta.\n\nMột sinh vật đơn độc có khả năng sống sót trong không gian đã xuất hiện từ cánh Cổng Không gian rực rỡ, dường như nó đang đi lang thang khắp nơi. Do nó không có bất kỳ phản hồi nào đối với các thông điệp hữu nghị hay cảnh báo của chúng ta, chúng ta phải lập tức huy động lực lượng để tiêu diệt mối đe dọa này!"
 origin.1010.name:0 "Bắn Ra"
 origin.1010.desc:0 "Cổng Không gian lại được kích hoạt một lần nữa. Lần kích hoạt này chỉ kéo dài chưa đầy một giây, nhưng đã có thứ gì đó xuyên qua từ bên trong Cổng.\n\nMột vật thể bằng kim loại không rõ nguồn gốc đã bắn ra khỏi cổng dịch chuyển với tốc độ cực nhanh và bay vào hệ sao. Trước khi bất kỳ cảm biến nào có thể nhận được thông số hợp lệ, vật thể này đã đâm sầm vào một hành tinh trong hệ sao của chúng ta.\n\nChúng ta nên ngay lập tức tiến hành điều tra địa điểm va chạm."
 origin.1012.name:0 "Biên Giới Hành Tinh"
 origin.1012.desc:0 "Việc xác định vị trí rơi của tàu thám dò bí ẩn còn khó khăn hơn nhiều so với những gì chúng ta dự đoán.\n\nTheo như các thông số, nó không thực sự bị rơi theo nghĩa thông thường, nhưng tốc độ kinh hoàng của vật thể này khi tiếp cận bề mặt hành tinh cũng đã loại bỏ khả năng nó hạ cánh một cách bình thường.\n\nVậy rốt cuộc chuyện gì đã xảy ra? Đã đến lúc phải tiếp cận để xem xét kỹ hơn."
 origin.1015.name:0 "Nín Thở Chờ Đợi"
 origin.1015.desc:0 "Các bộ phận được lắp ráp cuối cùng cũng đã được kích hoạt. Những mũi tên ánh sáng bắn ra từ thiết bị khổng lồ này và đánh trúng Cổng Không gian đang say giấc, khiến nó bắt đầu hoạt động.\n\nĐột nhiên, sự dao động năng lượng đặc trưng của Cổng Không gian bị gián đoạn, và rồi một quả cầu mềm mại, phát sáng lấp đầy Cổng. Tàu Khoa học đã được chuẩn bị sẵn sàng ngay lập tức tăng tốc để tiến vào khu vực phát sáng đó. Chỉ một lúc sau, Cổng Không gian ngừng hoạt động, chỉ còn lại sự tĩnh lặng và trang nghiêm vang vọng trong không gian.\n\nBây giờ chúng ta chỉ còn cách chờ đợi."
 origin.1020.name:0 "Châu Về Hợp Phố"
 origin.1020.desc:1 "Không một dấu hiệu báo trước, Cổng Không gian ở hệ sao quê hương của chúng ta bỗng nhiên hoạt động trở lại - dù khoảng thời gian đó không kéo dài, nhưng cũng đủ để một thực thể nào đó hiện diện từ phần lõi phát sáng của Cổng.\n\nVật thể kim loại kia không đáp lại bất kỳ lời chào nào, cũng chẳng phát ra bất kỳ tín hiệu gì. Phải cho đến khi nhận được tín hiệu phản hồi hình ảnh rõ nét, chúng ta mới nhận ra được bản chất thực sự của vật thể đó là gì. Đó chính là con Tàu Khoa học mà chúng ta đã đưa qua Cổng Không gian vài tháng trước. Thế nhưng niên đại của con tàu này lại trông có vẻ lâu đời hơn rất nhiều. Máy quét cho thấy con tàu này đã có tuổi đời lên đến một ngàn năm.\n\nThi thể của các thuyền viên đã hóa thành tro bụi rải rác, may mắn thay vẫn còn một vài dữ liệu chưa bị hư hại có thể thu hồi được. Những dữ liệu này bao gồm mô tả đầy kinh ngạc về §YCông nghệ Cổng Không gian§!, cùng với một đoạn dữ liệu âm thanh được để lại bởi một thuyền viên.\n\n\"§H...Một tương lai như vậy. Giống loài của chúng ta rồi sẽ có ngày thấu hiểu được nỗi đau thương mà ngày ác mộng đó mang lại - vào cái ngày mà bầu trời trút xuống cơn mưa lửa màu xanh.§!\""
 origin.1020.desc.machine:0 "Không một dấu hiệu báo trước, Cổng Không gian ở hệ sao quê hương của chúng ta bỗng nhiên hoạt động trở lại - dù khoảng thời gian đó không kéo dài, nhưng cũng đủ để một thực thể nào đó hiện diện từ phần lõi phát sáng của Cổng.\n\nVật thể kim loại kia không đáp lại bất kỳ lời chào nào, cũng chẳng phát ra bất kỳ tín hiệu gì. Phải cho đến khi nhận được tín hiệu phản hồi hình ảnh rõ nét, chúng ta mới nhận ra được bản chất thực sự của vật thể đó là gì. Đó chính là con Tàu Khoa học mà chúng ta đã đưa qua Cổng Không gian vài tháng trước. Thế nhưng niên đại của con tàu này lại trông có vẻ lâu đời hơn rất nhiều. Máy quét cho thấy con tàu này đã có tuổi đời lên đến một ngàn năm.\n\nTất cả các đơn vị máy móc đổ bộ lên tàu của chúng ta đều đã ngừng hoạt động, may mắn thay vẫn còn một vài dữ liệu chưa bị hư hại có thể thu hồi được. Những dữ liệu này bao gồm mô tả đầy kinh ngạc về §YCông nghệ Cổng Không gian§!, cùng với một đoạn dữ liệu âm thanh được để lại bởi một drone thám hiểm chịu trách nhiệm cho chuyến thám hiểm lần này.\n\n\"§H...Một tương lai như vậy. [Root.GetName] rồi sẽ có ngày thấu hiểu được nỗi đau thương mà ngày ác mộng đó mang lại - vào cái ngày mà bầu trời trút xuống cơn mưa lửa màu xanh.§!\""
 origin.1025.name:0 "Đại Dịch Cổng Không Gian"
 origin.1025.desc:0 "Cổng Không gian lại một lần nữa sống lại. Mà không có bất kỳ lời cảnh báo hay sự chuẩn bị nào, vô số sinh vật không gian đã tuôn trào ra từ cánh cổng dịch chuyển phát sáng đó. Loài sinh vật này dường như là cùng một chủng loại với kẻ tấn công đơn độc đã xuyên qua Cổng Không gian cách đây một thời gian.\n\nNhưng lần này số lượng của chúng đã nhiều hơn. Số lượng lớn hơn rất nhiều so với trước đây. Bây giờ đã không còn thời gian để nói lý lẽ, không còn thời gian để do dự nữa. Một mất một còn. Chuẩn bị quân đội!"
 origin.1030.name:0 "Chiến dịch Diệt Bọ"
 origin.1030.desc:0 "Hạm đội của chúng ta đã thành công trong việc ngăn chặn bọn sinh vật phun ra từ Cổng Không gian tiến hành thảm sát. Khi trận chiến đang diễn ra ngay trên đỉnh đầu, những người dân trên [Root.Owner.Capital.GetName] đều nín thở theo dõi.\n\nMặc dù mang trong lòng nỗi xót thương sâu sắc đối với những người đã ngã xuống, nhưng những người dân trên hành tinh quê hương của chúng ta khi ngước nhìn bầu trời vẫn ngập tràn hy vọng. Thi thể của bọn sinh vật từ Cổng Không gian đang bắt đầu rơi xuống bề mặt hành tinh. Khi tiến vào bầu khí quyển, thi thể của chúng bị bốc cháy, để lại những vệt sáng lấp lánh với vầng hào quang màu xanh lam trên bầu trời.\n\nHọ đã thấu hiểu được nỗi đau thương, những người dân trên [Root.Owner.Capital.GetName], vào ngày hôm nay đã được chứng kiến ngọn lửa màu xanh lam từ trên trời giáng xuống."
 origin.1030.desc.gestalt:0 "Hạm đội của chúng ta đã thành công trong việc ngăn chặn bọn sinh vật phun ra từ Cổng Không gian tiến hành thảm sát. Đã giải cứu được vô số cá thể của chúng ta trên [Root.Owner.Capital.GetName].\n\nMặc dù mang trong lòng nỗi xót thương sâu sắc đối với những người đã ngã xuống, nhưng những cư dân trên [Root.GetName] khi ngước nhìn bầu trời vẫn ngập tràn hy vọng. Thi thể của bọn sinh vật từ Cổng Không gian đang bắt đầu rơi xuống bề mặt hành tinh. Khi tiến vào bầu khí quyển, thi thể của chúng bị bốc cháy, để lại những vệt sáng lấp lánh với vầng hào quang màu xanh lam trên bầu trời.\n\nHọ đã thấu hiểu được nỗi đau thương, những cá thể trên [Root.Owner.Capital.GetName], vào ngày hôm nay đã được chứng kiến ngọn lửa màu xanh lam từ trên trời giáng xuống."
 origin.1030.a:0 "Một chiến thắng chua chát."
 origin.1035.name:0 "Màn Côn Trùng Vô Tình"
 origin.1035.desc:0 "Không có bất kỳ dấu hiệu báo trước nào, Cổng Không gian lại được mở ra một lần nữa, và lần này thứ được giải phóng ra từ bên trong Cổng là một bầy sinh vật không gian bí ẩn và đầy thù địch.\n\nChỉ trong vòng vài phút, bầy sinh vật đe dọa bí ẩn này đã tiến vào quỹ đạo của [Root.Owner.Capital.GetName], và bắt đầu phóng ra những tia năng lượng phát ra ánh sáng màu xanh lam xuống bề mặt hành tinh.\n\nChúng ta phải nhanh chóng điều động quân đội, lập tức tiêu diệt mối đe dọa này, nếu không [Root.Owner.Capital.GetName] sẽ bị thiêu rụi thành một vùng đất hoang tàn, và những cư dân sống trên đó sẽ bị những tia năng lượng kia làm cho tan thành mây khói. Việc duy nhất mà những người dân trên hành tinh có thể làm, đó là tìm nơi trú ẩn, rồi trơ mắt nhìn thế giới xung quanh mình bị cơn mưa lửa màu xanh lam thiêu rụi đến không còn một mảnh vụn."
 origin.1035.desc.gestalt:0 "Không có bất kỳ dấu hiệu báo trước nào, Cổng Không gian lại được mở ra một lần nữa, và lần này thứ được giải phóng ra từ bên trong Cổng là một bầy sinh vật không gian bí ẩn và đầy thù địch.\n\nChỉ trong vòng vài phút, bầy sinh vật đe dọa bí ẩn này đã tiến vào quỹ đạo của [Root.Owner.Capital.GetName], và bắt đầu phóng ra những tia năng lượng phát ra ánh sáng màu xanh lam xuống bề mặt hành tinh.\n\nChúng ta phải nhanh chóng điều động quân đội, lập tức tiêu diệt mối đe dọa này, nếu không [Root.Owner.Capital.GetName] sẽ bị thiêu rụi thành một vùng đất hoang tàn, và những cá thể sống trên đó sẽ bị những tia năng lượng kia làm cho tan thành mây khói. Việc duy nhất mà những cá thể trên hành tinh có thể làm, đó là tìm nơi trú ẩn, rồi trơ mắt nhìn thế giới xung quanh mình bị cơn mưa lửa màu xanh lam thiêu rụi đến không còn một mảnh vụn."
 origin.1040.name:0 "Tia Vũ trụ Quá tải"
 origin.1040.desc:0 "Lại một tia năng lượng dữ dội nữa từ Cổng Không gian bắn thẳng vào hệ sao quê hương của chúng ta. Điểm khác biệt so với những đợt rung động năng lượng trước đây, đó là lần này đã gây ra những hậu quả mang tính hủy diệt.\n\nKhi trường điện từ quét qua [Root.Owner.Capital.GetName], nó đã khiến cho toàn bộ lưới điện trên hành tinh bị quá tải, làm cháy rụi tất cả các hệ thống điện tử - và có một số hệ thống thậm chí là hoàn toàn không thể sửa chữa được.\n\nVì một số lý do nào đó, ngọn lửa của Cổng Không gian cũng đã làm biến đổi khí hậu, sau khi sự cố xảy ra, lượng mưa tại một vài khu vực trên bề mặt hành tinh đã tăng vọt trong một thời gian ngắn. Phần lớn các thành phố trọng điểm đều chìm trong bóng tối, và cư dân địa phương đã được chứng kiến một cơn mưa có màu xanh lam, đó là do những tia lửa năng lượng đang dần tắt chiếu sáng những hạt mưa rơi trên bầu trời."
 origin.1040.desc.gestalt:0 "Lại một tia năng lượng dữ dội nữa từ Cổng Không gian bắn thẳng vào hệ sao quê hương của chúng ta. Điểm khác biệt so với những đợt rung động năng lượng trước đây, đó là lần này đã gây ra những hậu quả mang tính hủy diệt.\n\nKhi trường điện từ quét qua [Root.Owner.Capital.GetName], nó đã khiến cho toàn bộ lưới điện trên hành tinh bị quá tải, làm cháy rụi tất cả các hệ thống điện tử - và có một số hệ thống thậm chí là hoàn toàn không thể sửa chữa được.\n\nVì một số lý do nào đó, ngọn lửa của Cổng Không gian cũng đã làm biến đổi khí hậu, sau khi sự cố xảy ra, lượng mưa tại một vài khu vực trên bề mặt hành tinh đã tăng vọt trong một thời gian ngắn. Phần lớn các khu định cư quy mô lớn đều chìm trong bóng tối, và các đơn vị tại địa phương đã được chứng kiến một cơn mưa có màu xanh lam, đó là do những tia lửa năng lượng đang dần tắt chiếu sáng những hạt mưa rơi trên bầu trời."
 origin.1050.name:0 "Bí Mật Của Vương Miện Đen Đã Được Hé Lộ"
 origin.1050.desc:0 "Cuối cùng, các nhà khoa học của chúng ta đã mở cửa thành công Vương miện Đen, cho phép con tàu của chúng ta đi qua thiết bị tương tự nằm ở đầu bên kia. Như một món quà cuối cùng từ chiếc Cổng Không gian bí ẩn này, ngay khi nó được kích hoạt, một luồng dữ liệu đã được truyền tải đến hệ thống của chúng ta, hé lộ nguyên lý đằng sau cấu trúc của nó, khiến cho những điều tưởng chừng như huyền bí trước đây bỗng chốc trở nên cực kỳ rõ ràng và dễ hiểu. Giờ đây, các nhà khoa học của chúng ta có niềm tin mãnh liệt rằng, chỉ trong vòng vài năm nữa, chúng ta cũng sẽ đủ sức xây dựng những tuyến đường mới, giúp thu hẹp thời gian di chuyển trong phạm vi đế chế của chúng ta xuống mức gần như bằng không."
 origin.1050.A:0 "Cả biển sao giờ đây đang nằm ngay dưới chân chúng ta."

 site_from_gateway_sent:0 "Vật Thể Được Bắn Ra Từ Cổng Không Gian"
 site_from_gateway_sent_intro:0 "Các nhà khoa học của chúng ta đã có mặt tại địa điểm va chạm của vật thể Cổng Không gian lao xuống [From.Planet.GetName] với một vận tốc không thể tin được.\n\nRõ ràng, nhìn vào hình dạng của địa điểm va chạm, đây tuyệt đối không phải là một vụ hạ cánh đâm sầm thông thường, các nhà khoa học của chúng ta đang rất nóng lòng muốn tiến hành điều tra kỹ lưỡng hơn."
 origin.1100.name:0 "Tại Điểm Va Chạm"
 origin.1100.desc:0 "Bản báo cáo sơ bộ mà chúng ta nhận được từ địa điểm khai quật trên [From.Planet.GetName] vô cùng hứa hẹn, nhưng cũng mang theo một chút rùng rợn.\n\nChúng ta đã phân tích hố va chạm và những mảnh vỡ trên bề mặt xung quanh đó, và kết quả hoàn toàn nằm ngoài dự đoán; rõ ràng vật thể bí ẩn đó trong khoảnh khắc va chạm đã không hề giảm tốc độ, cũng không hề bị hư hại. Không biết bằng cách nào, vật thể đó đã xuyên thủng tầng đất đá, và hiện tại đang yên vị ở một nơi sâu thẳm dưới lòng đất.\n\nChúng ta có thể tiến hành khai quật sâu hơn bất cứ lúc nào."
 origin.1105.name:0 "Rối Loạn Không Thời Gian"
 origin.1105.desc:0 "Khi công việc khai quật trên [From.Planet.GetName] ngày càng tiến gần đến vật thể được chôn sâu dưới lòng đất, các nhà khoa học của chúng ta đã bắt đầu trải nghiệm những hiện tượng vô cùng kỳ lạ. Trong nháy mắt, hàng giờ đồng hồ đã trôi qua, thiết bị mới toanh bỗng nhiên bị hao mòn đến mức không thể sử dụng được, nhiều khu vực bỗng nhiên ngập tràn các mảnh vỡ mà không ai biết được nguyên nhân từ đâu, và còn rất nhiều chuyện tương tự như vậy.\n\nGiới khoa học vẫn chưa thể đưa ra một lời giải thích chắc chắn cho việc này, nhưng có một giả thuyết cho rằng do vật thể va chạm đã xuyên qua lớp bề mặt của hành tinh, nên đã để lại những dư lượng có khả năng làm bóp méo thời gian."
 origin.1110.name:0 "Căn Phòng Bát Ngát Vô Tận"
 origin.1110.desc:0 "Cuối cùng, đội khai quật của chúng ta cũng đã tiếp cận được vị trí cuối cùng của vật thể không xác định đã rơi xuống [From.Planet.GetName].\n\nKết quả cho thấy, bề ngoài của thứ này dường như không có gì đặc biệt, nó chẳng khác gì một viên đạn đại bác được trang trí lộng lẫy. Tuy nhiên, không gian xung quanh nó đã thực sự làm các nhà khoa học của chúng ta phải sững sờ.\n\nĐây là một căn phòng khổng lồ, ngoại trừ một lỗ thủng trên trần nhà do vật thể này đâm thủng khi rơi xuống, toàn bộ căn phòng không hề có bất kỳ lối ra vào nào khác, nó hoàn toàn khép kín. Các bức tường của căn phòng được bao phủ bởi một lớp mạ kỳ lạ và có phần trong suốt, các nhà khoa học của chúng ta hiện đang rất háo hức muốn tiến hành điều tra kỹ lưỡng hơn về nó."
 origin.1115.name:0 "Hồ Sơ Của Người Gác Cổng"
 origin.1115.desc:0 "Lớp mạ trong suốt bao phủ trên các bức tường của căn phòng bí ẩn nằm ở [From.Planet.GetName] dường như hoàn toàn vô nghĩa, cho đến khi một thành viên trong đội dùng tay chạm nhẹ vào nó.\n\nCả căn phòng ngay lập tức ngập tràn ánh sáng từ các hình ảnh ba chiều tạo thành chữ viết, những biểu tượng phát sáng lơ lửng giữa không trung, từng dòng từng dòng một. Những biểu tượng này đã được giải mã một cách nhanh chóng, và cuối cùng ý nghĩa của lớp mạ trong căn phòng cũng đã được làm sáng tỏ, đây chính là bản thiết kế chi tiết của một thiết bị ngoài hành tinh.\n\nMột thiết bị có thể có khả năng mở ra Cổng Không gian."

 A_CLOSER_LOOK_PROJECT:0 "Khảo sát Kỹ lưỡng"
 A_CLOSER_LOOK_PROJECT_DESC:0 "Chúng ta cần phải thực hiện một cuộc khảo sát kỹ lưỡng hơn đối với địa điểm va chạm do vật thể lạ bắn ra từ Cổng Không gian trước đó gây ra."

 THE_GATEWAY_CANNON_PROJECT:0 "Đại Bác Cổng Không Gian"
 THE_GATEWAY_CANNON_PROJECT_DESC:0 "Dựa vào bản thiết kế của người ngoài hành tinh đã được tìm thấy trong một đợt khai quật khảo cổ trước đó, chúng ta có thể lắp ráp một cấu trúc để mở nhẹ cánh Cổng Không gian nằm trong hệ sao quê hương của chúng ta, và một chiếc Tàu Khoa học của chúng ta có thể di chuyển qua nó."

 origin.1013.name:0 "Mở Rộng Cánh Cửa"
 origin.1013.desc:0 "Những phát hiện khảo cổ gần đây đã mang lại cho chúng ta khả năng chế tạo một thiết bị, nó có thể mở hờ cánh Cổng Không gian huyền bí, và cho phép một Tàu Khoa học tiến vào.\n\n§RCảnh báo§!\n\nĐây là một nhiệm vụ mang tính rủi ro vô cùng cao! Bạn sẽ không thể đảm bảo rằng §YQuan Khoa học§! hay §YTàu Khoa học§! có thể an toàn trở về từ cuộc phiêu lưu sinh tử này. Cần phải chuẩn bị một cách cẩn trọng."

 ### Origin - Eldest Sibling text
 origin_eldest_sibling:0 "Hậu duệ của Trưởng Tử"
 origin_eldest_sibling_desc:0 "Trong xã hội này luôn lưu truyền những truyền thuyết cổ xưa, kể rằng con người đã từng phân tán đi khắp nơi, rời bỏ hành tinh này để đi khai hoang những hành tinh khác trong hệ sao này."

 origin_tooltip_eldest_sibling_effects:1 "—Khi bắt đầu trò chơi, hệ sao quê hương của bạn sẽ có §Yhai nền văn minh bản địa khác§!."

 START_SCREEN_ELDEST_SIBLING:0 "Chúng ta đều biết rằng, chủng loài của chúng ta đã từng xây dựng nên một nền văn minh vô cùng rực rỡ và huy hoàng trước cả thời đại của chúng ta. Nhưng câu chuyện của họ cuối cùng đã kết thúc như thế nào, thì chỉ còn lại những mảnh ghép rời rạc, và chìm trong một bức màn bí ẩn.\n\nMột trong những câu chuyện được lưu truyền lại, kể về một trong những §YNguời Hái Sao§! - những người tiên phong đã từng rời bỏ quê hương để đi định cư ở các hành tinh lân cận ở phía trước. Không còn nghi ngờ gì nữa, đây là một câu chuyện vô cùng lôi cuốn và đầy cảm xúc. Cốt truyện hoành tráng, tràn ngập tinh thần phiêu lưu, nhưng lại thiếu đi những bằng chứng xác thực để chứng minh cho những kỳ tích đó.\n\nGiờ đây, chúng ta đã bước vào kỷ nguyên du hành giữa các vì sao. Sự phát triển của công nghệ đã cho phép chúng ta thoát khỏi bầu khí quyển của hành tinh mẹ, và - có thể nói là một lần nữa - khám phá không gian bao la rộng lớn. Hãy cùng nhau khám phá sự thật cuối cùng được giấu kín đằng sau những truyền thuyết cổ xưa."

 ### Origin - On The Shoulders Of Giants text
 origin_shoulders_of_giants:0 "Đứng Trên Vai Người Khổng Lồ"
 origin_shoulders_of_giants_desc:1 "Vào một thời điểm nào đó trong quá khứ chưa được xác định, có một ân nhân bí ẩn đã dành tặng cho nền văn minh này một điều bất ngờ nhỏ giấu trong hệ sao của họ."
 origin_tooltips_shoulders_of_giants_effects:2 "—$HOME_SYSTEM$ có một ['concept_archaeology_site'] liên quan đến một ân nhân bí ẩn ['concept_ex_gravitas']"
 origin_tooltips_shoulders_of_giants_negative_effects: "—Chuỗi sự kiện của Kẻ Đi Trước sẽ bị ẩn đi cho đến khi bí mật này được làm sáng tỏ"

 START_SCREEN_SHOULDERS_OF_GIANTS:1 "Lịch sử của chúng ta luôn tồn tại những điều kỳ lạ và không ăn khớp với nhau. Chúng ta đã phát hiện ra những tàn tích của các thành phố cổ đại, mà niên đại của chúng còn xa xưa hơn cả những di tích khảo cổ của các ngôi làng thời nguyên thủy. Chúng ta đã khai quật được cưa, rìu và thậm chí cả súng trường từ dưới lòng đất, thế nhưng lịch sử của chúng lại còn lâu đời hơn cả giáo đá và cung tên.\n\nLịch sử kỳ lạ như vậy đã không thể cản bước chúng ta hướng tầm mắt ra ngoài không gian, và vững bước tiến vào một kỷ nguyên bay lượn giữa vũ trụ bao la. Giờ đây, chúng ta đã có khả năng thoát khỏi sự trói buộc của lực hấp dẫn từ hành tinh mẹ, để hướng tới những hành tinh và thiên thể khác trong hệ sao - và cả những vùng đất mênh mông vô tận ở bên ngoài.\n\nTuy nhiên, trước khi những sự việc kỳ quái lại tiếp tục xảy ra, chúng ta vẫn chưa hề rời khỏi bầu khí quyển; nhưng những tín hiệu kỳ lạ về nguồn gốc ngoài hành tinh lại truyền đến từ chính hệ sao quê hương của chúng ta."

 ### On The Shoulders Of Giants - Ex Gravitas Arc Site
 site_ex_gravitas:0 "Bên Dưới Lực Hấp Dẫn"
 site_ex_gravitas_intro:0 "Một loạt các thông số bất thường kỳ lạ đang liên tục được truyền đến từ bề mặt của [From.Planet.GetName]. Chúng ta cần phải tiến hành một cuộc thăm dò bề mặt để thu thập thêm nhiều thông tin tình báo hơn."
 origin.1200.name:0 "Bước Đầu Tiên, Một Bước Đi Nhỏ Bé"
 origin.1200.desc.a:0 "Chúng ta đã thiết lập một căn cứ hoạt động trên bề mặt của mặt trăng này, và đã cử đi một vài đội nhỏ để đi đến các địa điểm có hiện tượng bất thường mà chúng ta đã ghi nhận được trên máy quét trước đó.\n\nÝ nghĩa to lớn của hiện tượng bí ẩn này là điều không thể bàn cãi, và giới khoa học cũng đã đưa ra vô số lý thuyết và giả định về những gì mà đội khảo sát có thể sẽ khám phá ra."
 origin.1200.desc.b:0 "Chúng ta đã thiết lập một căn cứ hoạt động trên bề mặt của [From.Planet.GetName], và đã cử đi một vài đội nhỏ để đi đến các địa điểm có hiện tượng bất thường mà chúng ta đã ghi nhận được trên máy quét trước đó.\n\nÝ nghĩa to lớn của hiện tượng bí ẩn này là điều không thể bàn cãi, và giới khoa học cũng đã đưa ra vô số lý thuyết và giả định về những gì mà đội khảo sát có thể sẽ khám phá ra."
 origin.1200.c:0 "Thật là một điều vô cùng hào hứng!"
 origin.1205.name:0 "Lần Theo Dấu Vết Tín Hiệu"
 origin.1205.desc:0 "Phần lớn các đội khảo sát đều đã đến đích, và họ đã gửi báo cáo về.\n\nNhững hiện vật bị chôn vùi dưới lòng đất đã được khai quật. Trưởng Quan Khoa học [Leader.GetName] đã mô tả chúng như là những §Ythiết bị trỏ laser cấp độ ngân hà vô cùng chuẩn xác§! - một loại máy móc cổ xưa, chức năng của nó là phóng ra các chùm tia tử ngoại cường độ cao và dày đặc vào không gian, nhưng mục đích thì vẫn chưa được xác định.\n\nĐây quả thực là một khám phá buồn vui lẫn lộn; việc tìm thấy các hiện vật của người ngoài hành tinh mang một ý nghĩa sâu sắc và vô cùng phấn khích, nhưng những dự định đằng sau chúng lại có vẻ như vô cùng lộn xộn và không theo bất kỳ quy luật nào."
 origin.1205.a:0 "Tiếp tục."
 origin.1210.name:0 "Dã Tràng Xe Cát"
 origin.1210.desc:0 "Dù chúng ta đã cố gắng hết sức, nhưng việc khai quật và phân tích thiết bị chỉ dẫn của người ngoài hành tinh trên bề mặt vẫn không mang lại bất kỳ kết quả liên quan nào.\n\nĐội khảo cổ đã tính toán đường đi của chùm tín hiệu ngoài hành tinh, và lần theo nó đến tận cùng, nhưng ngoài không gian trống rỗng ra thì chẳng phát hiện được gì.\n\nQuan Khoa học [Leader.GetName] đã yêu cầu cho thêm thời gian; với niềm tin mãnh liệt rằng đội ngũ khoa học có thể đã bỏ sót một chi tiết quan trọng nào đó."
 origin.1210.a:0 "Tiếp tục."
 origin.1215.name:0 "Tua Lại Thời Gian"
 origin.1215.desc.a:1 "Một tiến triển mang tính đột phá!\n\nQuá trình nghiên cứu bề mặt đã hé lộ rằng mặt trăng này đã từng bị một tiểu hành tinh va chạm vào nhiều kỷ nguyên trước đây. Vụ va chạm không đủ sức để phá hủy mặt trăng này, nhưng đã đẩy nó lệch ra khỏi quỹ đạo ban đầu một chút. Bằng cách phân tích vụ va chạm này, các nhà khoa học đã thành công trong việc tính toán vị trí và tốc độ tự quay ban đầu của mặt trăng này, và sử dụng những dữ liệu đó để \"tua lại\", qua đó tái tạo lại vị trí mà thiết bị chỉ dẫn của người ngoài hành tinh ban đầu đã nhắm tới.\n\nVà thế là, chùm tia của thiết bị chỉ dẫn ngoài hành tinh này bỗng nhiên bắt đầu hội tụ tại một hành tinh khác trong hệ sao."
 origin.1215.desc.b:1 "Một tiến triển mang tính đột phá!\n\nQuá trình nghiên cứu bề mặt đã hé lộ rằng [From.Planet.GetName] đã từng bị một tiểu hành tinh va chạm vào nhiều kỷ nguyên trước đây. Vụ va chạm không đủ sức để phá hủy hành tinh này, nhưng đã đẩy nó lệch ra khỏi quỹ đạo ban đầu một chút. Bằng cách phân tích vụ va chạm này, các nhà khoa học đã thành công trong việc tính toán vị trí và tốc độ tự quay ban đầu của [From.Planet.GetName], và sử dụng những dữ liệu đó để \"tua lại\", qua đó tái tạo lại vị trí mà thiết bị chỉ dẫn của người ngoài hành tinh ban đầu đã nhắm tới.\n\nVà thế là, chùm tia của thiết bị chỉ dẫn ngoài hành tinh này bỗng nhiên bắt đầu hội tụ tại một hành tinh khác trong hệ sao."

 ### On The Shoulders Of Giants - Something Waiting Arc Site
 site_something_waiting:0 "Chờ Đợi Lời Giải Đáp"
 site_something_waiting_intro:0 "Thiết bị chỉ dẫn của người ngoài hành tinh được phát hiện trước đó đã chỉ về phía hành tinh này, chúng ta nên tiến xuống bề mặt của nó để thực hiện các cuộc khảo sát chi tiết hơn."
 origin.1220.name:0 "Vén Bức Màn Bí Mật"
 origin.1220.desc:0 "Các nhà khảo cổ học của chúng ta đã bắt đầu công việc trên bề mặt của [From.Planet.GetName]. Những cuộc khảo sát địa chấn đã nhanh chóng phát hiện ra những khu vực rỗng bên dưới lòng đất, nằm gần vị trí mà thiết bị chỉ dẫn đã hướng tới trước đó.\n\nNhững hang động ngầm dưới lòng đất này vô cùng rộng lớn và ẩn chứa nhiều bí ẩn, nhưng có một điều mà các chuyên gia của chúng ta có thể khẳng định chắc chắn: chúng tuyệt đối không phải là kết quả của sự kiến tạo tự nhiên. Chắc chắn nó đã được xây dựng nên bởi bàn tay của ai đó với một mục đích nhất định."
 origin.1225.name:0 "Nơi Diễn Ra Cuộc Thử Nghiệm"
 origin.1225.desc:0 "Cuối cùng, đội khai quật cũng đã tiếp cận được với cấu trúc ngầm dưới lòng đất. Những sảnh đường to lớn, góc cạnh được kết nối với nhau bằng các đường hầm. Do hầu như không có bất kỳ họa tiết trang trí nào, nên việc xác định mục đích xây dựng cấu trúc này là vô cùng khó khăn.\n\nKhi [Leader.GetName] bước vào đại sảnh chính, một âm thanh trầm đục bỗng nhiên vang vọng khắp nơi. Ban đầu nó chỉ là những tiếng ồn ào như sấm sét, nhưng dần dần âm thanh này bị bóp méo, cho đến khi nó biến thành một giọng nói vô hồn, liên tục lặp lại một câu duy nhất bằng ngôn ngữ của chúng ta:\n\n§Y\"Các người đã sẵn sàng chưa?\"§!\n\nGiọng nói rền vang như sấm sét đi kèm với một tiếng ầm ầm trầm đục, một bức tường khổng lồ bỗng nhiên từ từ dịch chuyển ra xa, để lộ ra một hành lang tăm tối. Các nhà khảo cổ học của chúng ta đang vô cùng háo hức muốn tiến sâu hơn nữa."
 origin.1225.a:0 "Tiếp tục tiến lên, nhưng hãy cẩn thận."
 origin.1230.name:0 "Thử Thách"
 origin.1230.desc:1 "Cuối hành lang tăm tối là một căn phòng hình tròn, trống rỗng. Vừa bước vào, giọng nói vang vọng kia lại một lần nữa cất lên, cho biết §Ychỉ những người xứng đáng mới có thể tiếp tục§!.\n\nMột hành lang ngắn dẫn từ căn phòng hình tròn đến ba căn phòng nhỏ hơn - mỗi căn phòng đều ẩn chứa một câu đố nào đó liên quan đến vật lý học.\n\n[Leader.GetName] tin rằng đây là những câu đố khoa học - chỉ cần giải được chúng - sẽ có thể kích hoạt toàn bộ cấu trúc để tạo ra một phản ứng nhất định, nhưng tất cả những điều này chỉ là suy đoán."
 origin.1230.a:0 "Bạn biết phải làm gì rồi đấy."
 origin.1235.name:0 "Tràn Ngập Sự Nhiệm Màu"
 origin.1235.desc:1 "Cả ba câu đố khoa học trong những căn phòng bí ẩn nằm sâu dưới lòng đất của [From.Planet.GetName] đều đã được giải đáp.\n\nĐúng như [Leader.GetName] đã dự đoán từ trước, cấu trúc này đã có phản ứng trước những câu trả lời chính xác cho bài kiểm tra của người ngoài hành tinh. Ngay khi câu đố cuối cùng được giải quyết, một hình ảnh ba chiều dạng đám mây bỗng nhiên xuất hiện giữa đại sảnh. Đó là hình ảnh mô tả hệ sao của chúng ta với độ phân giải cực cao, kèm theo các dòng chú thích cuộn liên tục về nhiều loại công nghệ ngoài hành tinh khác nhau.\n\nNhững điểm sáng rực rỡ đã đánh dấu một vị trí khác trong hệ sao. Cuộc tìm kiếm sẽ còn tiếp tục."

 ### On The Shoulders Of Giants - Buried Deep Arc Site
 site_buried_deep:0 "Chôn Giấu Sâu Thẳm"
 site_buried_deep_intro:0 "Máy quét của chúng ta đã phát hiện ra có thứ gì đó nằm sâu dưới bề mặt của [From.Planet.GetName]."
 origin.1240.name:0 "Boongke Kín Mít"
 origin.1240.desc:1 "Sau một thời gian dài đầy gian khổ đào sâu xuống bề mặt của [From.Planet.GetName], đội khai quật đã tiến vào một cấu trúc ngầm khác dưới lòng đất.\n\nMặc dù các dữ liệu cho thấy cấu trúc này là một hang động, nhưng chúng ta lại không thể tìm thấy bất kỳ lối vào nào. Nó dường như đã bị bịt kín hoàn toàn, những bức tường bảo vệ nó được làm từ một loại kim loại chưa từng được biết đến với độ cứng cấu trúc khó có thể tin được - thực tế là các thiết bị đào bới thông thường của chúng ta thậm chí còn không thể để lại một vết xước nào trên đó!\n\nChúng ta sẽ phải nỗ lực rất nhiều để có thể tiến vào bên trong, và tin tốt là chúng ta sẽ không ngừng cố gắng."
 origin.1245.name:0 "Hé Lộ Boongke"
 origin.1245.desc:1 "Trải qua vài tháng nỗ lực không ngừng nghỉ, bằng cách sử dụng một loại tia laser nhiệt độ cao với tần số cao vô cùng mạnh mẽ, đội khai quật cuối cùng cũng đã cạy mở được cấu trúc ngầm này.\n\nSau khi căn phòng dưới lòng đất được mở ra, giọng nói vô hồn đó lại vang lên một lần nữa, bày tỏ sự tán thưởng đối với quyết tâm giải quyết thử thách này của chúng ta, và do đó chúng ta sẽ nhận được phần thưởng.\n\nVà thế là xong. Căn phòng dưới lòng đất này cất giấu vô vàn những báu vật khác nhau, vô số của cải, và cả những công nghệ chưa từng được biết đến có thể được đem ra nghiên cứu trong tương lai..."

 ### On The Shoulders Of Giants - In Memoriam Arc Site
 site_in_memoriam:0 "Ký Ức Sâu Thẳm"
 site_in_memoriam_intro:0 "Rõ ràng là, ân nhân bí ẩn của chúng ta cảm thấy cấu trúc ngầm dưới lòng đất là một ý tưởng rất tuyệt vời."
 origin.1250.name:0 "Cơ Sở Hoàn Chỉnh"
 origin.1250.desc:0 "Một lượng lớn các thông số địa chấn sau khi được tổng hợp và phân tích đã tạo nên một mô hình trực quan với độ chính xác cực cao về cấu trúc ngầm dưới lòng đất của [From.Planet.GetName].\n\nNơi này có vẻ như là một mạng lưới bao gồm các hành lang góc cạnh nối liền với nhau, mỗi hành lang đều dài tới hàng ngàn mét. Toàn bộ cấu trúc này chủ yếu được hình thành từ các hành lang, ngoại trừ một khoảng không gian mở nằm ở phần đáy của công trình.\n\nTrước khi chúng ta đặt chân đến địa điểm này và tiến hành những cuộc khảo sát thích hợp, chúng ta không thể đưa ra thêm bất kỳ nhận định nào khác."
 origin.1250.a:0 "Hãy cùng nhau tiến sâu hơn nữa!"
 origin.1255.name:0 "Ký Ức Vô Tận"
 origin.1255.desc:1 "Cuối cùng, đội khảo cổ cũng đã mở được một lối đi trên công trình ngầm này, và bước vào những hành lang trống rỗng.\n\nCác hành lang hoàn toàn trống rỗng. Sau khi kiểm tra kỹ lưỡng, có thể phát hiện ra những dòng chữ nhỏ và kỳ lạ được khắc trên các bức tường. Kết quả dịch thuật của đoạn văn bản ngoài hành tinh này khiến người ta cảm thấy bối rối, sau đó mới phát hiện ra rằng đây đều là tên của những người ngoài hành tinh. Số lượng tên lên đến hàng triệu.\n\nHiện tại, các nhà khảo cổ học đang tiến về phía căn phòng nằm ở nơi sâu nhất, nhưng những đoạn hành lang bị sụp đổ thỉnh thoảng xuất hiện lại đang cản trở bước tiến của họ."
 origin.1260.name:0 "Thừa Nhận Thất Bại"
 origin.1260.desc:0 "Đội khoa học mà chúng ta cử đến [From.Planet.GetName] đã đến được vị trí thấp nhất của căn phòng. Tại đó, họ đã phát hiện ra một tệp tài liệu lưu trữ cổ xưa: có vẻ như là một bản báo cáo cá nhân.\n\n§Y\"Chúng ta đã thất bại, Kẻ Vô Tình đã xé nát toàn bộ hạm đội của chúng ta mà không hề có chút do dự nào. Không còn lại bất cứ thứ gì. Cuối cùng, chúng ta cũng sẽ phải chết ở nơi này, chết trong sảnh đường tưởng niệm những chiến sĩ đã ngã xuống của chúng ta.\n\nChúng ta cảm thấy lo lắng cho những người bị thương đang nằm trong bệnh xá, Kẻ Vô Tình rồi sẽ tìm ra họ, và sau đó...\"§!\n\nỞ đây không hề có bất kỳ dấu hiệu xô xát nào, không có thi thể, chỉ còn lại sảnh đường tưởng niệm trống rỗng và sự tĩnh lặng như tờ."
 origin.1260.a:0 "Thật đáng lo ngại, nhưng hãy cứ tiếp tục."
 origin.1265.name:0 "Phần Phụ Lục"
 origin.1265.desc:0 "Trưởng Quan Khoa học [Leader.GetName] muốn lục soát sảnh đường tưởng niệm một cách triệt để, không bỏ sót bất kỳ ngóc ngách nào. Ông ấy đã đúng. Tại một trong những hành lang, một thiết bị nhỏ bé đã được tìm thấy. Trên thiết bị này, chúng ta đã cố gắng cứu vãn được một mảnh thông tin nhỏ bé.\n\n§Y\"Thành công...! Khả năng tâm linh của chúng đã bị vô hiệu hóa, trí thông minh của chúng đã bị tước đoạt - chúng không còn là một mối đe dọa nữa.\n\nNhư vậy là đủ rồi. Chúng ta chỉ còn duy nhất một việc này để làm.\"§!\n\nThiết bị này đồng thời cũng lưu trữ một vài tọa độ mới. [Leader.GetName] hy vọng có thể tiến hành thăm dò các tọa độ này càng sớm càng tốt."
 origin.1265.a:0 "Cũng được."


 ### On The Shoulders Of Giants - The Last Stand Arc Site
 site_the_last_stand:0 "Tòa Nhà Cuối Cùng"
 site_the_last_stand_intro:0 "Dữ liệu máy quét từ quỹ đạo cho thấy có một cấu trúc nhân tạo nằm trên hành tinh bên dưới. Nhưng khác với những lần trước, cấu trúc này không hề bị chôn vùi dưới lòng đất."
 origin.1270.name:0 "Pháo Đài Cuối Cùng"
 origin.1270.desc:1 "Nhiệm vụ lần này hoàn toàn không cần dùng đến xẻng hay máy khoan laser. Trưởng Quan Khoa học [Leader.GetName] và đội khảo cổ đã đi thẳng vào khu phế tích của người ngoài hành tinh.\n\nDi tích này vô cùng cổ xưa - đã tồn tại hơn một ngàn năm, nhưng lại được bảo quản ở tình trạng hoàn hảo. Có vẻ như nó là một trung tâm tập kết được xây dựng cho một mục đích cụ thể nào đó. Có thể nhìn thấy một vài phòng thí nghiệm, cùng với một vài kho chứa có quy mô khổng lồ.\n\nĐội khảo cổ đã phát hiện ra một máy chủ lưu trữ dữ liệu số. Nó đã ngừng hoạt động, nhưng nhìn bề ngoài thì có vẻ vẫn còn nguyên vẹn. Hy vọng rằng nó có thể lấp đầy những khoảng trống manh mối về vị ân nhân bí ẩn đã bị thất lạc."
 origin.1275.name:0 "Biện Pháp Tuyệt Vọng"
 origin.1275.desc:1 "Đội khảo cổ đã truy cập thành công vào kho lưu trữ số của người ngoài hành tinh, và bằng một cách nào đó đã khởi động lại được nó. Kho lưu trữ này chứa một vài đoạn nhật ký với nội dung khá khó hiểu, cần phải tiến hành phân tích và giải mã thêm.\n\nTrong nhật ký thường xuyên xuất hiện một thuật ngữ có tên là §YPhương án Xóa Sổ Ý thức§!, dường như đây chính là trọng tâm của các hoạt động nghiên cứu tại cơ sở này. Rõ ràng là ân nhân bí ẩn đã phát triển một loại công nghệ thao túng tâm trí, nhưng phương thức thực hiện hay mục đích đằng sau việc phát triển công nghệ này thì vẫn còn là một ẩn số."
 origin.1275.a:0 "Tiếp tục điều tra."
 origin.1280.name:0 "Cao Trào!"
 origin.1280.desc:1 "Đội khảo cổ trên [From.Planet.GetName] đã phát hiện ra một kho lưu trữ kỹ thuật số cổ xưa khác. Kho lưu trữ này cũng chứa vô số những đoạn nhật ký vụn vặt, nhưng có một đoạn vô cùng đáng chú ý:\n\n§Y\"Con tàu đã cất cánh. Chúng tôi biết họ sẽ thành công, nhưng khi rời đi, họ chẳng mang theo chút hy vọng hay niềm phấn khởi nào. Chúng tôi hiểu rằng nhiệm vụ này, và những gì chúng tôi đang làm ở đây, là không thể chấp nhận được... thậm chí có thể gọi là hèn hạ.\n\nThế nhưng phương án thay thế... phương án thay thế còn tồi tệ hơn gấp trăm ngàn lần.\"§!\n\nĐây là một trong những mục dữ liệu cuối cùng được tìm thấy trong cơ sở cổ đại này. Mặc dù vẫn chưa có kết luận rõ ràng, nhưng ít nhất chúng ta cũng đã có được rất nhiều khám phá về mặt công nghệ."
 origin.1280.a:0 "Có thể sẽ còn nhiều thông tin hơn nữa."
 origin.1285.name:0 "Hồi Kết"
 origin.1285.desc:0 "Trong quá trình dọn dẹp khu vực lưu trữ, một nhân viên đã vô tình phát hiện ra một thiết bị nhỏ gọn không rõ nguồn gốc. Thiết bị này đã được mang đến trước mặt [Leader.GetName], và được xác định là một loại máy ghi âm. Nó đã bị hư hại vô cùng nặng nề, nhưng một đoạn hội thoại ngắn bên trong vẫn có thể nghe được:\n\n§Y\"...Không thể bị lãng quên - phải có ai đó đứng ra làm rõ sự thật, phải có ai đó lên tiếng thay cho họ. Lịch sử có thể dung túng cho tất cả những chuyện này, nhưng lương tâm của tôi thì không.\"§!\n\nSau khi tiến hành nghiên cứu sâu hơn về một chuỗi dữ liệu ban đầu bị cho là tạp âm. Cuối cùng người ta đã phát hiện ra rằng, đó thực chất là những tọa độ đã được mã hóa."

 ### On The Shoulders Of Giants - Dark Secret Arc Site
 site_dark_secret:0 "Bí Mật Đen Tối"
 site_dark_secret_intro:1 "Tọa độ chỉ về một vị trí nào đó trên [From.Planet.GetName], nhưng các cuộc quét sâu hơn không phát hiện ra bất kỳ điều gì bất thường."
 origin.1290.name:0 "Hang Động Ẩn Giấu"
 origin.1290.desc:1 "Đội được cử đến bề mặt của [From.Planet.GetName] đã gặp phải vô vàn khó khăn ngoài dự kiến.\n\nTọa độ tìm thấy trong cơ sở nghiên cứu cổ đại của người ngoài hành tinh chỉ đến một khu vực có địa hình vô cùng hiểm trở trên [From.Planet.GetName], nơi này đầy rẫy những vách đá dựng đứng và những khe nứt sâu thẳm.\n\nTuy nhiên, họ vẫn không chùn bước, và cuối cùng cũng đã đến được địa điểm được chỉ định - một hang động được hình thành một cách tự nhiên. Không cần phải ra lệnh tiếp cận để quan sát, cuộc thám hiểm hang động đã được bắt đầu."
 origin.1290.a:0 "Tiến lên."
 origin.1295.name:0 "Bộ Sưu Tập Lạnh Lẽo và Cứng Nhắc"
 origin.1295.desc:0 "Đội khảo cổ đang tiến hành điều tra hang động tự nhiên trên [From.Planet.GetName]. Họ đã phát hiện ra một nhà kho rộng lớn bị bỏ hoang, bên trong chứa đựng vô số nguyên vật liệu quý giá. Không có cửa, không có ổ khóa, cũng chẳng có cạm bẫy nào - đơn thuần chỉ là một hang động chứa đầy những sản phẩm công nghiệp có giá trị cao.\n\nTrưởng Quan Khoa học [Leader.GetName] muốn tiến hành điều tra sâu hơn. Những món đồ này được bày biện quá lộ liễu, đến mức khiến người ta phải nghi ngờ rằng đây là một cái bẫy, rằng bộ sưu tập này chỉ là một lớp ngụy trang để che đậy cho một kho báu khác vẫn chưa được khám phá."
 origin.1295.a:0 "Tiếp tục, tiếp tục tìm kiếm"
 origin.1300.name:0 "Quá Khứ Nhơ Nhuốc"
 origin.1300.desc:1 "Nhà kho tài nguyên quả thực chỉ là một lớp ngụy trang - kho báu thực sự đã được tìm thấy đằng sau một cánh cửa ẩn: một đoạn ghi âm cuối cùng được ghi lại bởi một thành viên của chủng tộc ân nhân.\n\nĐã từ rất lâu rồi, họ từng tham gia vào một cuộc chiến tàn khốc với một chủng tộc ngoài hành tinh hiếu chiến có tên gọi là §SKẻ Vô Tình§!. Vô số nền văn minh đã bị quét sạch trong cuộc đi săn đẫm máu của Kẻ Vô Tình, và những ân nhân của chúng ta sẽ là mục tiêu tiếp theo. Trong cơn tuyệt vọng, những ân nhân đã tìm mọi cách để ngăn chặn ngày tận thế đang đến gần. Và họ đã thành công: họ chế tạo ra một loại thiết bị có khả năng phá hủy tâm trí của Kẻ Vô Tình, biến toàn bộ chủng tộc Kẻ Vô Tình thành những sinh vật nguyên thủy chỉ trong nháy mắt.\n\nSau khi bị tước đoạt lý trí, Kẻ Vô Tình trở nên ngoan ngoãn và vô hại. Các ân nhân đã tập trung bắt giữ bọn họ, rồi đày ải bọn họ đến chính hành tinh quê hương của chúng ta.\n\nKẻ Vô Tình chính là tổ tiên của chúng ta."
 origin.1300.a:0 "Thật không biết nên diễn tả cảm xúc lúc này như thế nào khi biết được cao trào của câu chuyện."
 origin.1305.name:0 "Sự Hối Hận Của Kẻ Bạo Chúa"
 origin.1305.desc:1 "Nhà kho tài nguyên chỉ là một lớp ngụy trang. Cuối cùng, chúng ta đã phát hiện ra một thiết bị ghi âm được cất giấu trong hang động:\n\n§Y\"Đã từ rất lâu rồi, chủng tộc của tôi - khi đó được biết đến với cái tên §SKẻ Vô Tình§!, đã gieo rắc chiến tranh và đau thương trên khắp dải ngân hà, bất kỳ chủng tộc ngoài hành tinh có tri giác nào dám ngáng đường chúng tôi đều bị hạm đội của chúng tôi nghiền nát không thương tiếc.\n\nNhưng rồi, chúng tôi cuối cùng cũng đã thoát khỏi vòng xoáy sinh tồn của một kẻ cuồng tín chiến tranh. Nhìn lại lịch sử tàn khốc của chính mình, chúng tôi không còn cảm thấy tự hào nữa, mà thay vào đó là sự xấu hổ và nỗi bi thương tột cùng.\n\nChúng tôi bắt đầu đi theo bước chân chuộc lỗi của tổ tiên...\"§!\n\nPhần nội dung còn lại hoàn toàn lộn xộn. Quan Khoa học [Leader.GetName] tin chắc rằng ông có thể khôi phục lại những đoạn âm thanh bị bóp méo, nhưng việc này sẽ tốn khá nhiều thời gian."
 origin.1305.a:0 "Hãy sửa chữa nó."
 origin.1310.name:0 "Sự Hối Hận Của Kẻ Bạo Chúa - Phần 2"
 origin.1310.desc:1 "[Leader.GetName] đã khôi phục thành công phần nội dung bị hỏng trong đoạn ghi âm của người ngoài hành tinh:\n\n§Y\"Chúng tôi lần theo những bước chân chuộc lỗi của tổ tiên mình, và đã đến được hệ sao này. Tổ tiên của chúng tôi đã tiêu diệt chủng tộc $NAME_ThwaaPhyr$ tại đây. Khi đó, chúng tôi không hề biết rằng $NAME_ThwaaPhyr$ đã biến [Root.Owner.GetSpeciesNamePlural] thành những sinh vật nguyên thủy vô hại với chúng tôi, qua đó che giấu sự tồn tại của [Root.Owner.GetSpeciesName] ngay dưới mũi chúng tôi.\n\nHậu quả này là không thể đảo ngược. [Root.Owner.GetSpeciesName] vẫn chỉ là những sinh vật nguyên thủy. Giờ đây, chúng tôi hy vọng một ngày nào đó họ sẽ có thể quay trở lại không gian, và hy vọng rằng họ sẽ tìm thấy những dấu ấn chuộc lỗi mà chúng tôi đã để lại.\"§!\n\nVậy là, lịch sử thực sự của chúng ta cuối cùng cũng đã được làm sáng tỏ. Bây giờ, hãy hướng ánh nhìn của chúng ta về phía tương lai."
 origin.1310.a:0 "Chấp nhận tất cả những điều này, và vững bước tiến lên."
 origin.1315.name:0 "Chiến Dịch Cờ Giả"
 origin.1315.desc:2 "Phía sau một bức tường đá giả trong hang động, đội khảo cổ đã phát hiện ra một loạt các đoạn dữ liệu. Những dữ liệu này đã hé lộ một câu chuyện như sau:\n\nĐã từ rất lâu rồi, một cuộc chiến tranh giành quyền bá chủ đã nổ ra giữa hai phe phái lớn, và phe của những ân nhân đã bị dồn vào thế bế tắc. Nhằm mục đích giành lấy lợi thế, một bên đã phát động một chiến dịch cờ giả, đóng giả thành phe đối lập để tấn công một chủng tộc yếu đuối - đó chính là tổ tiên của chúng ta.\n\nMột thiết bị có tên là \"Bom Triệt tiêu Synapse\" đã phát nổ trên hành tinh quê hương từng thuộc về chúng ta. Nó không hề gây ra bất kỳ thiệt hại nào cho môi trường, nhưng những xung lực của nó đã tác động mạnh mẽ đến não bộ của tổ tiên chúng ta, khiến họ bị thoái hóa trở lại thời kỳ nguyên thủy.\n\nNhững món quà được để lại cho chúng ta là minh chứng cho việc các ân nhân cuối cùng cũng đã tìm cách chuộc lại lỗi lầm của mình."
 origin.1315.a:0 "Chúng ta tuyệt đối không được để kẻ khác lợi dụng! Hãy mở to mắt ra mà nhìn cho rõ!"
 origin.1320.name:0 "Ân Huệ Cũng Chỉ Là Một Giấc Mộng"
 origin.1320.desc:1 "Đội khai quật đã phát hiện ra một thiết bị ghi âm được giấu đằng sau một bức tường giả, bên trong là lời thú tội của một trong những vị ân nhân.\n\nĐã từ rất lâu rồi, những ân nhân đã sử dụng các biện pháp công nghệ để khiến cho giống loài của chúng ta \"mất đi lý trí\", nhằm mục đích trốn tránh một mối đe dọa mang tầm vóc ngân hà đang cận kề. Mặc dù hành động này có thể xuất phát từ ý tốt, nhưng sau khi mối đe dọa đã qua đi, các ân nhân đã không hề giúp tổ tiên của chúng ta phục hồi lại tâm trí, họ đã nhẫn tâm vứt bỏ chúng ta.\n\nNhững thiết bị và công nghệ được tìm thấy ở đây là ân huệ do một nhóm độc lập để lại, nhóm người này cảm thấy đồng cảm với những bậc tiền bối đã chìm trong sự ngu muội của chúng ta."
 origin.1320.a:0 "Hãy nhìn chúng ta đây! Chúng ta không cần đến sự bố thí của kẻ khác."
 origin.1325.name:0 "Cầu Mong Các Vị Luôn Bình An"
 origin.1325.desc:2 "Phía sau bức tường giả, đội khai quật đã phát hiện ra một thiết bị ghi âm, bên trong chứa đựng những thông điệp do những ân nhân bí ẩn để lại.\n\nHọ đang phải tham gia vào một cuộc chiến tuyệt vọng chống lại một chủng tộc ngoài hành tinh vô cùng độc ác và đáng tởm. Để bảo vệ chúng ta khỏi sự tấn công của kẻ thù, họ đã sử dụng công nghệ để phá hủy khả năng tư duy của tổ tiên chúng ta, với hy vọng rằng kẻ thù sẽ không thèm bận tâm đến một giống loài [Owner.GetPreFTLLower] đang sống trên một hành tinh bị cô lập.\n\nCách làm này đã phát huy tác dụng đối với chúng ta, nhưng cuối cùng số phận của những ân nhân cũng đã đi đến hồi kết. Họ đã để lại cho chúng ta những kho tài nguyên và công nghệ được cất giấu cẩn thận này, với hy vọng một ngày nào đó chúng ta sẽ tìm thấy chúng."
 origin.1325.a:0 "Quả là một kết cục bi thảm."
 origin.1330.name:0 "Bước Tiếp Theo"
 origin.1330.desc:1 "Cuối cùng, những mảnh ghép bị thất lạc trong lịch sử thực sự của chúng ta đã làm sáng tỏ những điểm mâu thuẫn trong các ghi chép lịch sử của chúng ta. Chúng ta vẫn luôn tin tưởng rằng, sự tiến bộ của nền văn minh chúng ta là do tự lực cánh sinh, là sự cô đơn và độc lập. Nhưng giờ đây chúng ta đã hiểu ra rằng, chúng ta vẫn luôn §Lđứng trên vai những người khổng lồ§!.\n\nChúng ta không thể thay đổi được quá khứ. Chúng ta nên buông bỏ và tiếp tục tiến lên - hãy xem quá khứ không phải là một gánh nặng oằn vai, mà là một bước đệm vững chắc trên con đường hướng tới tương lai.\n\n§YĐã đến lúc chúng ta phải trở thành những người khổng lồ.§!"
 origin.1330.a:0 "Tiến lên!"

 site_benefactor_site:0 "Di chỉ của Ân nhân"
 site_benefactor_site_intro:0 "Một tấm bản đồ hệ sao cổ đại đã chỉ rõ vị trí của một khu di chỉ."

 spurred_by_the_past:0 "Được Tiếp Thêm Sức Mạnh Từ Quá Khứ"
 spurred_by_the_past_desc:0 "Sự thật về quá khứ của chủng tộc chúng ta đã được làm sáng tỏ, điều này đã khơi dậy mạnh mẽ động lực và ý thức về sứ mệnh của toàn bộ giống loài chúng ta."

 intercepting_history_chain_title:0 "Lịch sử Bị Gián đoạn"
 intercepting_history_chain_desc:0 "Chúng ta đã phát hiện ra những manh mối về ân nhân trong quá khứ của chúng ta. Vậy rốt cuộc đoạn cuối của con đường này sẽ dẫn đến một kết cục như thế nào?"

 ### On The Shoulders Of Giants CONTINUED - Intercepting History Event Chain
 origin.1335.name:0 "Dấu Vết Lạnh Lẽo"
 origin.1335.desc:1 "Trong một cuộc quét hệ sao định kỳ, một cảm biến của chúng ta đã thu nhận được một tín hiệu năng lượng vừa yếu ớt vừa vô cùng kỳ lạ. Rất có khả năng đây là dấu vết do một động cơ nhiệt hạch hay một thiết bị tương tự để lại, nhưng đặc điểm của nó hoàn toàn không trùng khớp với bất kỳ thứ gì chúng ta từng biết đến từ trước đến nay, và có vẻ như nó đã quá cổ xưa - tín hiệu này đã được phát ra từ hàng ngàn năm trước! Một trong số các nhà khoa học của chúng ta đã đưa ra giả thuyết rằng, dấu vết của động cơ nhiệt hạch này chính là do \"ân nhân\" để lại.\n\nChúng ta cần nhanh chóng chuyển hướng trọng tâm công việc của bộ phận thám hiểm không gian sâu sang dự án nghiên cứu này."
 origin.1340.name:0 "Tìm Kiếm Ân Nhân"
 origin.1340.desc:0 "Đường bay cổ đại do động cơ nhiệt hạch để lại này rất khó phân tích do niên đại đã quá lâu đời. Nhưng cuối cùng, các cơ quan khoa học cũng đã tính toán ra được một quỹ đạo bay khả thi, quỹ đạo này dẫn đến một hệ sao vô danh chưa từng được ai khám phá, nằm cách chúng ta chỉ vài bước nhảy không gian.\n\nHệ sao mục tiêu đã được xác nhận là đang mở cửa, chúng ta nên cân nhắc việc cử một Tàu Khoa học đến để tiến hành điều tra sâu hơn."
 origin.1345.name:0 "Một Mớ Hỗn Độn"
 origin.1345.desc:0 "Sau khi cảm biến hoàn tất đợt quét toàn diện đầu tiên đối với [From.solar_system.GetName], có thể thấy rõ ràng rằng từ rất lâu trước đây, trong hệ sao này đã từng xảy ra một cuộc xung đột bạo lực có quy mô cực lớn và mang tính tàn phá khủng khiếp.\n\nNhững mảnh vỡ và tàn tích của các con tàu bị hư hỏng nằm vương vãi khắp nơi trong hệ sao, trong không gian tràn ngập năng lượng tàn dư từ vũ khí laser và bom nhiệt hạch.\n\nTrong khu nghĩa trang tĩnh lặng này, một tín hiệu đơn lẻ đã được phân tách ra, nó bắt nguồn từ một trạm không gian nhỏ nằm ở gần đó."
 origin.1350.name:0 "Bị Đột Kích Và Săn Lùng Thảm Khốc"
 origin.1350.desc:1 "Tín hiệu bị đánh chặn bắt nguồn từ một buồng thoát hiểm khẩn cấp nào đó trên trạm không gian. Do mức độ hư hỏng vô cùng nghiêm trọng, trạm không gian hoang tàn này không để lại quá nhiều manh mối để có thể cho chúng ta biết chính xác chuyện gì đã xảy ra ở đây. Tuy nhiên, các nhà khoa học của chúng ta đã cố gắng ghép các mảnh dữ liệu lại với nhau để chắp vá thành một diễn biến sự việc hoàn chỉnh.\n\nTrạm không gian này chính là cơ sở nghiên cứu đã phát minh ra công nghệ xóa sổ ý thức (cũng chính là công nghệ đã khiến tổ tiên của chúng ta trở nên ngu muội). Trạm không gian này cùng với hạm đội phòng thủ của nó đã bị khống chế bởi một thế lực không xác định, và rất có khả năng công nghệ đó cũng đã bị bọn chúng đánh cắp.\n\nCó một đoạn văn bản vô cùng thú vị đã được dịch xong, đó là đoạn hội thoại vô tuyến đến từ hạm đội địch.\n\n§Y\"Bọn chúng đang cố gắng tẩu thoát! Hãy đuổi theo chúng, dùng chính vũ khí của chúng để tấn công chúng, hãy xem thử bọn chúng sẽ tận hưởng đòn tấn công này như thế nào\"§!\n\nChúng ta đã phát hiện ra một vệt sáng mới từ động cơ nhiệt hạch, và đã dựa vào vệt sáng này để xác định được một lộ trình bay."
 origin.1351.name:0 "Điểm Cuối Của Lộ Trình"
 origin.1351.desc:1 "Trong hệ sao chưa được khám phá này, dấu vết của những người ân nhân đã hoàn toàn biến mất. Các cảm biến tầm xa của chúng ta không phát hiện ra bất kỳ điều gì bất thường, nhưng chúng ta vẫn nên tiến hành một cuộc điều tra kỹ lưỡng đối với hệ sao này, để xem thử chúng ta có thể tìm thấy được những gì."
 origin.1355.name:0 "Nơi An Nghỉ Cuối Cùng"
 origin.1355.desc:1 "Chủng tộc [GetPreFTLLower] được phát hiện trong hệ sao này không phải ai khác, mà chính là §Y$NAME_ThwaaPhyr$§! - hay như cách gọi phổ biến hơn trong nền văn hóa của chúng ta, là §LÂn nhân§!.\n\nCác nhà sinh vật học ngoại lai của chúng ta vẫn chưa thể khẳng định chắc chắn về các chi tiết, nhưng mọi bằng chứng đều chỉ ra rằng, không rõ vì lý do gì, họ đã trở thành nạn nhân của chính công nghệ xóa sổ ý thức do mình tạo ra, bị bỏ lại trên hành tinh này để tự sinh tự diệt. Không một ai có thể hiểu rõ ý nghĩa của số phận này hơn chúng ta.\n\nChúng ta cần phải cân nhắc kỹ lưỡng về những hành động tiếp theo của mình."
 origin.1360.name:0 "Hồi Kết"
 origin.1360.desc:1 "Đôi khi, những sự kiện diễn ra trong vũ trụ lại được hé lộ theo những cách thi vị nhất. Những người chủ cũ từng không thể chối cãi của tổ tiên chúng ta, $NAME_ThwaaPhyr$, cuối cùng lại phải gánh chịu chung một số phận với chính tổ tiên của chúng ta.\n\nBất kể mục đích thực sự của họ là gì, chúng ta cũng phải thừa nhận rằng, ở một mức độ nào đó, họ đã cố gắng tìm cách chuộc lại những hành động tuyệt vọng và mù quáng của mình.\n\nNhiều thế hệ đã trôi qua, vị thế của cả hai bên đã bị đảo ngược, và chúng ta đã đền đáp lại ân huệ của họ.\n\nGiống như những gì mà chủng tộc [Root.Owner.GetSpeciesName] đã từng trải qua, giờ đây đã đến lúc $NAME_ThwaaPhyr$ được trải nghiệm cảm giác đứng trên vai của những người khổng lồ."
 origin.1360.a:0 "Chúc may mắn!"

 PATHFINDING_PROJECT:0 "Lần Theo Dấu Vết"
 PATHFINDING_PROJECT_DESC:0 "Dấu vết của động cơ đẩy nhiệt hạch cổ đại cần được nghiên cứu sâu hơn. Rất có thể chúng ta sẽ phân tích được đích đến của những con tàu đã để lại những dấu vết phát thải năng lượng như vậy từ đây."

 INVESTIGATE_THE_DEAD_STATION_PROJECT:0 "Điều tra Trạm Không gian Bỏ hoang"
 INVESTIGATE_THE_DEAD_STATION_PROJECT_DESC:0 "Bất chấp những hư hỏng rõ ràng, trạm không gian bí ẩn này vẫn có thể chứa đựng những thông tin hoặc mảnh dữ liệu cổ đại, và chúng ta có thể ghép nối chúng lại với nhau để có được một lời giải thích liền mạch cho những gì đã xảy ra ở đây từ hàng ngàn năm trước."

 PROJECT_OUROBOROS_PROJECT:0 "Dự Án Ouroboros"
 PROJECT_OUROBOROS_PROJECT_DESC:1 "Chúng ta đã tìm thấy hậu duệ của những sinh vật từng tạo ra tổ tiên chúng ta... những người nguyên thủy. Những người này giờ đây đã chìm trong sự dốt nát. Có vẻ như vũ trụ không bao giờ thiếu những màn kịch trớ trêu. Nhưng dù tốt hay xấu, họ quả thực đã từng giúp đỡ chúng ta. Chúng ta nên nghĩ cách làm một điều gì đó để đền đáp ân huệ này."

 fusion_drive_trail_object:0 "Dấu Vết Động Cơ Đẩy Nhiệt Hạch Cổ Đại"
 fusion_drive_trail_object_desc:0 "Một vệt năng lượng lâu đời, được tạo ra bởi một động cơ nhiệt hạch liên sao."
 fusion_drive_trail_object_tooltip:0 "Một vệt năng lượng lâu đời, được tạo ra bởi một động cơ nhiệt hạch liên sao."

 benefactors_end_poi:0 "Lần Theo Dấu Vết"
 benefactors_end_poi_desc:0 "Đây chính là đích đến được chỉ định bởi dấu vết động cơ nhiệt hạch được phát hiện trong hệ sao quê hương của chúng ta."

 benefactors_home_poi:0 "Gần Trong Gang Tấc"
 benefactors_home_poi_desc:1 "Hệ sao này dường như chính là đích đến mà một con tàu nào đó đã hướng tới sau khi rời khỏi trạm không gian bỏ hoang mà chúng ta đã phát hiện trước đó."

 benefactors_home_poi_2:0 "Nhìn Quanh Bốn Phía"
 benefactors_home_poi_2_desc:0 "Chúng ta nên cử Tàu Khoa học đi khảo sát kỹ lưỡng hệ sao này để tìm kiếm những dấu vết của các ân nhân."

 battlefield_debris_object:0 "Mảnh Vỡ Tàu Vũ Trụ Bị Phá Hủy"
 battlefield_debris_object_desc:0 "Hàng triệu tàn tích và mảnh vỡ, từ rất lâu trước đây, nơi này đã từng xảy ra một trận chiến không gian vô cùng khốc liệt."
 battlefield_debris_object_tooltip:0 "Hàng triệu tàn tích và mảnh vỡ, từ rất lâu trước đây, nơi này đã từng xảy ra một trận chiến không gian vô cùng khốc liệt."

 abandoned_station_object:0 "Trạm Không Gian Bị Bỏ Hoang"
 abandoned_station_object_desc:1 "Bên ngoài bị hư hỏng nghiêm trọng, nhưng phần lõi của trạm không gian hầu như vẫn còn nguyên vẹn, được sử dụng cho một mục đích nghiên cứu và phát triển nào đó."
 abandoned_station_object_tooltip:1 "Bên ngoài bị hư hỏng nghiêm trọng, nhưng phần lõi của trạm không gian hầu như vẫn còn nguyên vẹn, được sử dụng cho một mục đích nghiên cứu và phát triển nào đó."

 full_circle:0 "Vòng Lặp Luân Hồi"
 full_circle_desc:0 "Đế chế của chúng ta sẽ mãi mãi ghi nhớ cảm giác về sứ mệnh và sự đoàn kết mà khoảnh khắc đền đáp lại các ân nhân đã mang lại."

 NAME_ThwaaPhyr:0 "Thwaa'Phyr"
 NAME_Vemetosha:0 "Vemetosha"

 ### On The Shoulders Of Giants - Benign Cover-Up Arc Site
 site_benign_cover_up:0 "Lời Nói Dối Ngọt Ngào"
 site_benign_cover_up_intro:0 "Chúng ta đã tìm được một vị trí thích hợp để cất giấu những nguồn dự trữ này cho Thwaa'Phyr, những người có thể sẽ quay trở lại bầu trời sao vào một ngày nào đó trong tương lai. Một món quà gửi đến tương lai, dành cho những người khổng lồ của quá khứ."
 origin.1365.name:0 "Chúng Ta Sẽ Xây Dựng Ở Đây!"
 origin.1365.desc:1 "Toàn bộ nhân lực và vật lực đã được tập trung lên bề mặt của [From.Planet.GetName]. Bước tiếp theo là chôn sâu nó xuống lòng đất, sao cho nó có thể chịu đựng được thử thách của thời gian và khí hậu."
 origin.1365.a:0 "Bắt đầu đào thôi!"
 origin.1370.name:1 "Giai Đoạn 1 Tiến Triển Thuận Lợi"
 origin.1370.desc:0 "Chúng ta đã chôn giấu một lượng lớn tài nguyên và bản thiết kế công nghệ sâu dưới bề mặt của [From.Planet.GetName]. Chúng ta cũng đã thiết lập một ngọn hải đăng, với hy vọng rằng một ngày nào đó $NAME_ThwaaPhyr$ sẽ có thể tìm thấy nó."
 origin.1370.a:0 "Hy vọng rằng họ sẽ có thể tìm ra con đường sinh tồn của riêng mình."

  ### On The Shoulders Of Giants - Relentless Pursuit Event Chain
 relentless_pursuit_chain_title:0 "Truy Lùng Kẻ Vô Tình"
 relentless_pursuit_chain_desc:0 "Chúng ta có thể sẽ lần ra được dấu vết của thủ phạm gây ra thảm họa cổ đại đó - Kẻ Vô Tình. Nhưng thời gian đã trôi qua lâu như vậy, liệu chúng ta có thực sự tính toán được vị trí chính xác hay không?"

 origin.1380.name:0 "Dấu Vết Của Kẻ Chinh Phục"
 origin.1380.desc:1 "Cảm biến của chúng ta đã bắt được một tín hiệu năng lượng kỳ lạ trong hệ sao quê hương. Tín hiệu này vô cùng mạnh mẽ, ban đầu người ta còn lầm tưởng rằng thiết bị đã xảy ra sự cố, nhưng các cuộc kiểm tra tiếp theo đã chỉ ra rằng thông số này là quỹ đạo năng lượng do một động cơ đẩy nhiệt hạch tạo ra từ rất lâu trước đây.\n\nĐể hiểu rõ hơn về tình hình, chúng ta cần phải tiến hành phân tích sâu hơn, nhưng có khả năng đây chính là dấu vết mà Kẻ Vô Tình đã để lại khi rời khỏi hệ sao của chúng ta từ hàng ngàn năm trước.\n\nChúng ta nên tiến hành điều tra sâu hơn."
 origin.1385.name:0 "Lần Theo Quỹ Đạo"
 origin.1385.desc:0 "Mặc dù đã trải qua một thời gian rất dài, nhưng bộ phận khoa học của chúng ta vẫn tìm cách phân tích được dấu vết của động cơ, và thu được vector rút lui của nó. Điều này có nghĩa là chúng ta có thể tiến hành truy lùng con ác quỷ mà chúng ta đã chạm trán từ thời cổ đại.\n\nLiệu thời gian có thể hoàn toàn xóa nhòa bản tính hung bạo của chúng hay không, hay là chúng ta đang tự rước họa vào thân? Tuyến đường bay mới đã được vạch ra, chỉ cần chúng ta sẵn sàng, chúng ta có thể bắt đầu cuộc truy đuổi bất cứ lúc nào."
 origin.1390.name:0 "Con Tàu Vận Tải Tĩnh Lặng"
 origin.1390.desc:0 "Ngay khi tiến vào hệ sao, tàu thăm dò của chúng ta đã phát hiện ra rất nhiều hiện tượng bất thường.\n\nTín hiệu rõ ràng nhất là một đám mây năng lượng khổng lồ, khi tiến lại gần sẽ thấy nó được cấu thành từ hàng trăm dấu vết động cơ đẩy nhiệt hạch nhỏ hơn tương tự như những gì chúng ta đã phát hiện trước đây. Chắc chắn đã từng có một hạm đội vô cùng khổng lồ lưu lại đây vì một lý do nào đó.\n\nNgay bên cạnh \"nơi neo đậu hạm đội\" này, tàu thăm dò của chúng ta đã phát hiện ra một loại tín hiệu khác. Đó là một chiếc tàu vận tải bị bỏ hoang. Chiếc tàu này có lẽ cũng lâu đời như tín hiệu năng lượng bên cạnh nó, nhưng tín hiệu quỹ đạo mà nó mang theo lại không hề giống với nhóm quỹ đạo kia.\n\nChúng ta nên tiến lại gần hơn để quan sát chiếc tàu vũ trụ bị bỏ hoang này."
 origin.1395.name:0 "Sức Mạnh Của Kẻ Kiến Tạo"
 origin.1395.desc:0 "Bên trong chiếc tàu vận tải này có một cuốn nhật ký. Mặc dù đã bị lão hóa do sự bào mòn của thời gian, nhưng chúng ta vẫn có thể khôi phục lại được khá nhiều dữ liệu.\n\nChiếc tàu vận tải này đã bị hạm đội khổng lồ kia chặn lại. Vì những lý do và phương thức chưa được làm rõ, thuyền trưởng của chiếc tàu vận tải này cuối cùng đã có một cuộc trò chuyện với vị chỉ huy của hạm đội Kẻ Vô Tình. Cuộc nói chuyện của họ dường như đã kéo dài trong nhiều tuần liền, mặc dù không biết họ đã thảo luận về những gì, nhưng cụm từ \"Bản chất của sức mạnh\" đã được nhắc đến liên tục.\n\nHạm đội đó đã bất ngờ rời đi, và chiếc tàu vận tải bị bỏ lại vẫn hoàn toàn bình an vô sự. Dòng cuối cùng của cuốn nhật ký đã trích dẫn lời của vị chỉ huy: §Y\"Thôi bỏ đi, hãy tha cho họ. Hủy diệt là một việc vô cùng dễ dàng, sức mạnh thực sự nằm ở khả năng kiến tạo.\"§!\n\nChúng ta đã phân tích xong dấu vết của hạm đội, và có thể tiếp tục lên đường truy đuổi mục tiêu của mình."
 origin.1400.name:0 "Sự An Nghỉ Của Kẻ Bạo Chúa"
 origin.1400.desc:0 "Đây chính là điểm cuối của quỹ đạo động cơ nhiệt hạch. Nếu có bất kỳ tàn tích nào của hạm đội Kẻ Vô Tình có thể tồn tại, thì chúng ta sẽ tìm thấy nó ở đây.\n\nCho đến thời điểm hiện tại, trong số các tín hiệu mà tàu thăm dò phát hiện ra, tín hiệu duy nhất đáng chú ý có vẻ như bắt nguồn từ một loại trạm không gian nhỏ bé nào đó. Nó liên tục phát ra các xung năng lượng theo những khoảng thời gian nhất định, tuy nhiên, ngoài điều đó ra, dường như nó không có bất kỳ dấu hiệu hoạt động nào khác.\n\nChúng ta có thể lập tức bắt tay vào điều tra nó."

 TRACKING_THE_PREDATOR_PROJECT:0 "Theo Dấu Kẻ Đi Săn"
 TRACKING_THE_PREDATOR_PROJECT_DESC:0 "Bằng cách phân tích dấu vết của động cơ nhiệt hạch, bộ phận nghiên cứu của chúng ta có thể xác định chính xác vị khách cũ của chúng ta rốt cuộc đã đi về đâu, và nói một cách khác, điều này đồng nghĩa với việc chúng ta có thể bắt đầu cuộc truy đuổi."

 INVESTIGATE_SILENT_FREIGHTER_PROJECT:0 "Điều tra Tàu Vận Tải Tĩnh Lặng"
 INVESTIGATE_SILENT_FREIGHTER_PROJECT_DESC:0 "Một chiếc tàu vận tải không gian bị bỏ hoang đang nằm yên lặng trong không gian lạnh giá. Nó đã tồn tại từ rất lâu, nhưng bề ngoài không có dấu hiệu bị hư hỏng. Chúng ta nên cử một đội đổ bộ lên tàu để tiến hành điều tra sâu hơn."

 OLD_BEACON_PROJECT:0 "Phân tích Ngọn Hải Đăng Cổ Đại"
 OLD_BEACON_PROJECT_DESC:0 "Cấu trúc cổ đại này đang phát ra những đợt sóng năng lượng một cách có quy luật, như thể đang mong chờ có người khám phá ra nó. Để tìm ra nguyên nhân, chúng ta phải cho phép các nhà khoa học của mình tiến hành điều tra ở cự ly gần hơn."

 rendezvous_with_freighter_poi:0 "Lao Vào Biển Lửa"
 rendezvous_with_freighter_poi_desc:0 "Dựa trên phân tích về dấu vết của động cơ nhiệt hạch nằm trong hệ sao quê hương của chúng ta, đây chính là đích đến cuối cùng của Kẻ Vô Tình thời cổ đại."

 relentless_home_poi:0 "Tìm Ra Kẻ Thù Thượng Cổ"
 relentless_home_poi_desc:0 "Vào thời cổ đại, hạm đội hùng mạnh của Kẻ Vô Tình đã rời khỏi hệ sao này sau khi chạm trán với một chiếc tàu vận tải dân sự."

 origin.1405.name:0 "Ngu Ngốc Lại Là Một Niềm Hạnh Phúc"
 origin.1405.desc:1 "Công cuộc điều tra của các nhà khoa học đối với trạm không gian cổ đại đã kết thúc. Toàn bộ cấu trúc này là một loại đại bác nào đó. Đã từ rất lâu rồi, khẩu đại bác này đã khai hỏa, bắn một luồng xung lực về phía hành tinh mẹ của Kẻ Vô Tình. Luồng xung lực đó chúng ta - chủng tộc [Root.Owner.GetSpeciesName] - hoàn toàn thấu hiểu được tác dụng của nó là gì: §YXung Lực Xóa Sổ Tâm Trí§!.\n\nĐể đền bù cho những tội ác mà họ đã gây ra trong quá khứ, Kẻ Vô Tình - giờ đây được gọi là §Y$NAME_Vemetosha$§! - đã sử dụng thứ vũ khí này lên chính bản thân mình, khiến toàn bộ nền văn minh của họ thoái hóa trở lại thời kỳ thổ dân.\n\nQuy mô của quyết định này - cũng như những hậu quả mà nó mang lại - đã cho thấy Kẻ Vô Tình đã nghiêm túc như thế nào trong việc chuộc lại lỗi lầm. Liệu chúng ta có thể tha thứ cho họ hay không?"
 origin.1405.a:0 "Phải chăng sự ngu ngốc thực sự là một niềm hạnh phúc?"

 site_bury_the_hatchet:0 "Buông Bỏ Hận Thù"
 site_bury_the_hatchet_intro:0 "Bộ phận khảo cổ đã chọn nơi này làm địa điểm lý tưởng để cất giấu các tài liệu, nhằm cung cấp cho hậu duệ của những Kẻ Vô Tình sẽ \"bước vào kỷ nguyên không gian\" trong tương lai."
 origin.1410.name:0 "Đánh Dấu Vị Trí"
 origin.1410.desc:0 "Nhiệm vụ khổng lồ vận chuyển tài nguyên và thiết bị công nghiệp đến [From.Planet.GetName] đã hoàn tất. Tiếp theo là đào sâu xuống lòng đất, xây dựng một cấu trúc vững chắc có thể chịu đựng được hàng ngàn năm biến đổi địa chất và sự tàn phá của thời gian."
 origin.1415.name:0 "Kho Báu Địa Lý Giữa Các Vì Sao"
 origin.1415.desc:0 "Một chiếc rương khổng lồ chứa đầy tài nguyên và bản thiết kế công nghệ đã được chôn giấu bên dưới bề mặt của [From.Planet.GetName]. Chúng ta không thể biết được liệu hậu duệ của $NAME_Vemetosha$ có thể, sẽ vào lúc nào và bằng cách nào tìm thấy kho báu của chúng ta, nhưng chúng ta có thể gửi gắm những hy vọng lớn lao nhất. Biết đâu đấy? Có lẽ hàng ngàn năm sau, họ sẽ phát hiện ra dấu vết do tàu vũ trụ của chúng ta để lại, và tìm đến chúng ta."

 origin.1420.name:0 "Không Trở Thành Kẻ Thù"
 origin.1420.desc:0 "Chương tối tăm nhất trong lịch sử vũ trụ đã khép lại, và một chương mới rực rỡ và tươi sáng hơn sẽ do chúng ta viết tiếp. Công trình nhân đức của chúng ta như một hòn đá ném xuống mặt hồ tĩnh lặng của xã hội, khơi dậy những gợn sóng của ý thức sứ mệnh và đạo đức trong lòng mỗi người. Mặc dù không gian sâu thẳm vẫn còn là một nơi bí ẩn không thể lường trước, nhưng có lẽ vũ trụ này không hoàn toàn đen tối và lạnh lẽo đến vậy."

 goes_around_comes_around:0 "Thời Khắc Đổi Thay."
 goes_around_comes_around_desc:0 "Đế chế của chúng ta đang tận hưởng những ảnh hưởng tích cực từ việc giúp đỡ và tha thứ cho cựu thù."

 silent_freighter_object:0 "Tàu Vận Tải Ngoại Lai Bị Bỏ Hoang"
 silent_freighter_object_desc:0 "Một chiếc tàu vận tải hàng hóa ngoại lai đang nằm im lìm nhưng có vẻ như vẫn còn nguyên vẹn."
 silent_freighter_object_tooltip:0 "Một chiếc tàu vận tải hàng hóa ngoại lai bị bỏ hoang."

 mysterious_space_station_object:0 "Trạm Không Gian Bí Ẩn"
 mysterious_space_station_object_desc:0 "Trạm không gian bị bỏ hoang này đang phát ra một luồng xung năng lượng."
 mysterious_space_station_object_tooltip:0 "Một trạm không gian ngoại lai có chức năng không xác định."

 HAS_FEDERATION_SETTING:0 "$FEDERATION|Y$ chưa kích hoạt $SETTING|Y$"
 HAS_NOT_FEDERATION_SETTING:0 "$FEDERATION|Y$ đã kích hoạt $SETTING|Y$"
 federation_setting_failed_vote_half_price:0 "Bỏ Phiếu Nửa Giá Thất Bại"
 FEDERATION_RESEARCH_SHARING:2 "Nghiên cứu Chia sẻ của $FEDERATION$: $VALUE|%+=$"
