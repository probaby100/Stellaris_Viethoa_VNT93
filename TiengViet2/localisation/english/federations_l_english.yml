 resolution_sanctions_military_1_desc:0 "Chúng ta nên thiết lập những giới hạn hợp lý đối với lực lượng hải quân của các đế chế §Rvi phạm Luật Thiên Hà§!."

 resolution_sanctions_military_2:0 "Chế Tài Quân Sự Mức độ Trung bình"
