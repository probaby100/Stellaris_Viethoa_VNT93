 VOTE_DETAILS_DESC:1 "Nếu nghị quyết này được thông qua, hiệu lực của nó sẽ được áp dụng cho toàn bộ [global_event_country.GetGalCommunityOrGalImperium]. Các hệ số liên quan sẽ liên tục ảnh hưởng đến tất cả các quốc gia thành viên, bao gồm cả những quốc gia đã bỏ phiếu chống lại nghị quyết này trong Thượng viện."
