 resolution_category_industry:0 "Phát triển Công nghiệp"

 resolution_industry_repeal_1:0 "§RBãi bỏ $resolution_industry_regulatory_facilitation$§!"
 resolution_industry_repeal_1_desc:1 "[global_event_country.GetGalCommunityOrGalImperium] không có quyền can thiệp vào các vấn đề công nghiệp. Chúng ta không nên bị ép buộc phải theo quan điểm của các quốc gia khác."
