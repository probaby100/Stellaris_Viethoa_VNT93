 # Limits of diplomatic actions
 federation_internal_migration:0 "§Y$law_category_free_migration$§! §Rbị Luật Liên bang §Y$free_migration_yes$§!, nên chúng ta đã mặc định ký kết Hiệp ước Di dân.§!"
 federation_actor_no_separate_treaties:0 "§Y$law_category_separate_treaties$§! §Rđang là §Y$treaties_separate_no$§! theo Luật Liên Bang, nên chúng ta không thể ký hiệp ước riêng với các đế chế ngoài liên bang.§!"
 federation_recipient_no_separate_treaties:0 "§RTheo Luật Liên Bang của họ, §Y$law_category_separate_treaties$§! đang là §Y$treaties_separate_no$§!, nên họ không thể tham gia một thỏa thuận như vậy.§!"
 federation_automatic_research: "§RDo đang nằm trong $research_federation$, chúng ta đã tự động ký kết §YHiệp ước Nghiên cứu§! miễn phí.§!"
 federation_automatic_commercial: "§RChúng ta đã có §YHiệp ước Thương mại§! miễn phí và tự động có hiệu lực trong nội bộ liên bang.§!"
 federation_automatic_waystation: "§RChúng ta đã có §YHiệp ước Tuyến trạm§! miễn phí và tự động ký kết trong nội bộ liên bang.§!"

 # Types
 default_federation:0 "Hiệp Hội Thiên Hà"
 default_federation_desc:1 "Các thành viên trong Liên bang này gắn kết chặt chẽ với nhau. Họ đồng lòng hợp tác để sẵn sàng ứng phó với bất kỳ hiểm họa nào có thể phát sinh."
 trade_federation:0 "Liên Bang Thương Mại"
 trade_federation_desc:0 "Liên bang này tập trung rõ rệt vào việc xây dựng thị trường tự do và thúc đẩy tăng trưởng kinh tế."
 research_federation:0 "Liên Bang Nghiên Cứu"
 research_federation_desc:1 "Liên bang này có thiên hướng Kỹ trị, đặc biệt chú trọng vào việc giải mã các chân lý của vũ trụ."
 military_federation:0 "Liên Bang Quân Sự"
 military_federation_desc:1 "Các thành viên trong Liên bang này sẽ kề vai sát cánh, đẩy mạnh hợp tác quân sự để gia tăng sức mạnh quốc phòng."
 hegemony_federation:0 "Liên Bang Bá Quyền"
 hegemony_federation_desc:0 "Kiểu Liên bang này thường do một Đế chế hùng mạnh đứng đầu, cùng với nhiều quốc gia chư hầu vệ tinh bao quanh."
 spiritualist_federation:0 "Giao ước Thần thánh"
 spiritualist_federation_desc:1 "Liên bang này khuyến khích học thuật Duy tâm và tôn kính mọi sự tồn tại linh thiêng."

 # Perks
 federation_fleet_size_1:0 "Giao lưu Sĩ quan"
 federation_fleet_size_1_desc:1 "Thông qua các cuộc diễn tập quân sự thường xuyên và luân chuyển vị trí chỉ huy giữa các thuyền trưởng, năng lực chiến đấu của Hạm Đội Liên Bang đã được nâng cao rõ rệt."
 federation_fleet_size_2:0 "Chuẩn hóa Hậu cần"
 federation_fleet_size_2_desc:0 "Việc thống nhất tiêu chuẩn đạn dược, nhiên liệu và các nhu yếu phẩm quan trọng giúp tàu chiến của các bên dễ dàng tiếp tế, từ đó gia tăng sức mạnh hạm đội."
 federation_fleet_size_3:0 "Mạng Tín hiệu Liên sao"
 federation_fleet_size_3_desc:0 "Sáp nhập hải quân của mọi thành viên làm một. Mạng chỉ huy FTL thống nhất cho phép chúng ta điều phối những chiến dịch hạm đội quy mô chưa từng có."
 federation_fleet_size_effect:0 "§YSức chứa Hải quân Liên bang§! mà các quốc gia thành viên đóng góp tăng thêm §G+25%§!"
 federation_fleet_speed_1:0 "Tuyến Hải hành Đồng minh"
 federation_fleet_speed_1_desc:1 "Các tuyến siêu không gian được quy hoạch tỉ mỉ và tuần tra gắt gao trong lãnh thổ Liên bang mang lại sự thuận tiện hàng hải vượt trội, giúp hạm đội nhanh chóng tập hợp tại bất kỳ điểm nóng nào."
 federation_fleet_speed_effect:0 "§YTốc độ Tàu§! trong lãnh thổ Liên minh tăng §G+10%§!"
 federation_fire_rate_1:0 "Tư duy Tấn công"
 federation_fire_rate_1_desc:0 "Phòng thủ mang lại lợi thế chiến thuật, nhưng các nhà quân sự đều biết rằng: chỉ có tấn công mới đạt được mục tiêu tối thượng của chiến tranh—ép kẻ thù phải khuất phục."
 admiral_level_cap_1:0 "Truyền thống Hạm đội"
 admiral_level_cap_1_desc:0 "Học viện Hải quân hiện đại và toàn diện của chúng ta, với bề dày hàng trăm năm truyền thống du hành vũ trụ, sẽ đào tạo ra những sĩ quan hàng đầu thiên hà."
 claim_cost_1:0 "Phạm vi Ảnh hưởng"
 claim_cost_1_desc:0 "Chúng ta khao khát tình hữu nghị với mọi quốc gia láng giềng. Nếu cầu nối hữu nghị bị cản trở bởi chính quyền ngoan cố của họ, chúng ta hoàn toàn có thể và nên lật đổ chính quyền đó để dựng lên một chính thể mới."
 job_output_1:0 "Đoàn kết là Sức mạnh"
 job_output_1_desc:1 "Sau khi Liên bang thành lập, các thành viên đã thoát khỏi những tranh chấp vô bổ trước đây để dồn toàn bộ nguồn lực vào mục tiêu chung."
 job_output_2:0 "Lý tưởng Cao đẹp"
 job_output_2_desc:0 "Lý tưởng cao đẹp chung của chúng ta đứng trên lợi ích và nguyện vọng của từng cá nhân, và trên con đường tiến bước chắc chắn phải có sự hi sinh."
 job_output_3:0 "Nghiệp vụ Toàn vũ trụ"
 job_output_3_desc:0 "Chúng ta không còn phải lo âu hay hoài nghi về vị thế của mình trong Liên bang. Khi được hỏi 'Chúng tôi nên chuẩn bị bao nhiêu để cung cấp cho các người?', câu trả lời sẽ luôn là 'Lấy tất cả'."
 research_share_1:0 "Trao đổi Học thuật"
 research_share_1_desc:1 "Tri thức 'độc quyền' sẽ không còn tồn tại. Tại đây, chúng ta quyết định chia sẻ những phát hiện khoa học trân quý nhất để xóa bỏ rào cản ngăn trở sự lan tỏa của chân lý."
 research_share_1_effect:0 "§YHiệp ước Nghiên cứu Liên bang§! giúp tốc độ nghiên cứu của họ tăng §Y5%§!."
 research_share_2:0 "Ngôn ngữ Khoa học"
 research_share_2_desc:0 "Mỗi chủng tộc thành viên đều có chuẩn phân loại, bảng tuần hoàn và công cụ giao tiếp tri thức riêng. Việc thiết lập một bộ thuật ngữ chung sẽ giảm thiểu tối đa sai lệch khi truyền tải ý tưởng."
 research_share_3:0 "Cấp phép Sản xuất"
 research_share_3_desc:0 "Một phát minh vĩ đại nếu không rời khỏi quê nhà sẽ bị giới hạn về giá trị học thuật lẫn xã hội. Chúng ta khuyến khích việc cấp phép sản xuất đổi mới này để thúc đẩy sự lan rộng của các phát minh."
 research_share_4:0 "Kho Dữ liệu Toàn dân"
 research_share_4_desc:0 "Kho dữ liệu phổ cập đến từng người dân đã trở thành thánh điển công nghệ, chứa đựng toàn bộ tri thức tích lũy của các loài thành viên. Dù có bị lãng quên hay đế chế sụp đổ, kho dữ liệu vẫn sẽ tiếp tục lưu giữ tri thức của họ."
 research_boost_1:0 "Thẩm định Độc lập Thời gian thực"
 research_boost_1_desc:0 "Khi các mẫu thử và lý thuyết mới được gửi qua mạng siêu quang tới mọi viện nghiên cứu trong Liên bang, chúng sẽ trở thành đối tượng phản biện độc lập từ nhiều nguồn và được hoàn thiện với tốc độ ánh sáng."
 rare_tech_boost:0 "Cảm hứng Nghiên cứu"
 rare_tech_boost_desc:0 "Việc quy tụ nhiều chủng tộc trong Liên bang giúp các nhà khoa học tiếp cận những góc nhìn hoàn toàn mới lạ, kích thích các tư duy sáng tạo bùng nổ."
 rare_tech_boost_effect:0 "§MCông nghệ Hiếm§! đã được thành viên khác trong Liên bang mở khóa sẽ có tỉ lệ xuất hiện gấp §Y2§! lần bình thường (tăng xác suất từ §Y1%§! lên §Y2%§!)."
 crisis_research_1:0 "Huy động Nghiên cứu"
 crisis_research_1_desc:0 "Khi tai họa đe dọa toàn thiên hà ập đến, giới khoa học không thể đứng ngoài cuộc mà phải gác lại các lý thuyết suông để dồn sức chế tạo vũ khí phòng thủ."
 crisis_research_1_effect:1 "$FEDERATION_PERK_MEMBER_MOD$\nTốc độ nghiên cứu nhận thêm §Y10%§! trong thời gian diễn ra Tai ương Tận thế."
 crisis_research_2:0 "Giao ước Ác hại Cần thiết"
 crisis_research_2_desc:0 "Không sợ cấm kỵ, không gò bó bởi đạo đức, miễn là phải nhổ tận gốc rễ mối họa."
 tech_diplo_weight_1:0 "Kỹ trị Trị quốc"
 tech_diplo_weight_1_desc:0 "Chúng ta tái thiết xã hội dựa trên một quan điểm táo bạo: những ai có chuyên môn sâu trong một lĩnh vực phải là người nắm quyền ra quyết định trong lĩnh vực đó."
 president_option_1:0 "Nha Quản lý Nghiên cứu"
 president_option_1_desc:0 "Nghiên cứu lý thuyết thuần túy rất quan trọng, nhưng trong một số trường hợp, việc tập trung ưu tiên cho các lĩnh vực cấp thiết nhất sẽ mang lại hiệu quả tức thì hơn."
 president_megastructure_1:0 "Kế hoạch Kiến tạo Chiến lược"
 president_megastructure_1_desc:0 "Bộ phận quản lý này có thể tập trung năng lực vận tải của Liên bang vào các dự án chiến lược trọng điểm, giúp hậu cần đi vào nếp và không làm xáo trộn đời sống thường nhật."
 unity_boost_1:0 "Uy tín Ngoại giao"
 unity_boost_1_desc:0 "Sự giao thiệp công bằng, minh bạch với mọi chủng tộc—dù có thuộc Liên bang hay không—khiến công dân của chúng ta tự hào về vai trò của mình trong các đại sự thiên hà."
 unity_boost_2:0 "Hiến Chương Quyền Lợi"
 unity_boost_2_desc:0 "Việc đảm bảo quyền con người và quyền được thông tin cho mọi công dân Liên bang đã trở thành lá cờ đầu rực rỡ nhất, giúp chúng ta xây dựng một thiên hà tốt đẹp hơn."
 president_unity_1:0 "Trung thành với Liên minh"
 president_unity_1_desc:0 "Chỉ cần một trong số chúng ta nắm quyền Chủ tịch, tất cả đều cảm nhận được sự đoàn kết và mục tiêu rõ ràng từ dự án chung vĩ đại này. Chúng ta sẽ cùng nhau tiến bước."
 trade_value_1:0 "Hiệp ước Thương mại Tự do"
 trade_value_1_desc:0 "Xây dựng môi trường thương mại cạnh tranh lành mạnh và thịnh vượng bắt đầu từ việc xóa bỏ rào cản lưu thông hàng hóa, dịch vụ giữa các hệ sao. Hiệu quả tổng thể quan trọng hơn tranh chấp kinh tế cục bộ."
 trade_value_2:0 "Chuẩn hóa Đo lường"
 trade_value_2_desc:0 "Giống như những gì từng làm trên quê nhà ở thời kỳ tiền siêu quang, giờ đây chúng ta phải thống nhất một bộ tiêu chuẩn thiên hà để đo lường thời gian, khoảng cách và giá trị."
 trade_value_3:0 "Tự cung Tự cấp Liên minh"
 trade_value_3_desc:0 "Sự hợp tác hòa bình, đôi bên cùng có lợi giữa các quốc gia thành viên dần tạo nên 'lòng trung thành thương hiệu' trong hành vi tiêu dùng. Công dân tự nguyện ưu tiên mua hàng từ các nước thành viên vì biết phần lớn lợi nhuận sẽ gián tiếp quay về phục vụ chính mình."
 trade_value_4:0 "Ưu đãi Hiệp ước Thương mại"
 trade_value_4_desc:0 "Chúng ta cần chính thức hóa các mối liên kết thương mại nội bộ để bất cứ khi nào có giao dịch phát sinh gần lãnh thổ, chúng ta đều thu được lợi ích. Cần gì phải thu mua ở nơi khác?"
 trade_protection_1:0 "An toàn Tuyến hàng hải"
 trade_protection_1_desc:0 "Nếu hàng hóa làm ra không thể đến đích vì nạn tham nhũng và cướp bóc, thì sản xuất bao nhiêu nguyên liệu cũng vô ích. Các quy định chống cướp biển vũ trụ được thực thi nghiêm ngặt sẽ bảo đảm sức khỏe kinh tế cho Liên minh."
 president_trade_value_1:0 "Trung tâm Thương mại"
 president_trade_value_1_desc:1 "Tương tự các tuyến hàng hải xuyên đại dương thời cổ đại, các tuyến thương mại huyết mạch của thiên hà sẽ mang lại lợi ích tài chính khổng lồ."
 extra_envoy_1:0 "Đặc sứ Liên bang"
 extra_envoy_1_desc:1 "Tương lai tươi đẹp mà chúng ta hướng tới chỉ thành hiện thực khi mọi sinh linh đều hiểu rõ mục tiêu của chúng ta. Chúng ta nguyện trở thành một lực lượng hiện diện khắp nơi, thu phục lòng người bằng lẽ phải để giữ gìn hòa bình thiên hà."
 extra_influence_1:0 "Trọng trách Thần thánh"
 extra_influence_1_desc:0 "Thăng tiến lên vị trí cao nhất trong Liên bang không phải là đăng quang làm vua, mà là dấn thân phụng sự vô tận cho mọi chúng sinh. Dù vậy, vị thế nước Chủ tịch vẫn mang lại uy vọng tối cao."
 diplomacy_upkeep_1:0 "Giám sát Chính trị"
 diplomacy_upkeep_1_desc:0 "Nếu các đại lý giám sát do nước Chủ tịch chỉ định được cài trực tiếp vào bộ máy trị quốc của các thành viên, việc điều phối các hiệp ước tương trợ giữa các bên sẽ dễ dàng hơn nhiều."
 diplomacy_upkeep_1_effect:0 "Hiệp ước Nghiên cứu và Hiệp ước Di dân giữa các nước thành viên Liên bang không tốn £influence£ Ảnh hưởng để duy trì."
 diplo_weight_1:0 "Đồng minh Truyền thống"
 diplo_weight_1_desc:0 "Trong suốt chiều dài lịch sử được ghi chép, các đồng minh trong Liên bang đã duy trì sự hợp tác cực kỳ hiệu quả. Dù mỗi thành viên được tự do bỏ phiếu, họ vẫn luôn giữ sự đồng thuận cao trong các đại sự."
 damage_crisis_1:0 "Đồng tâm Hiệp lực"
 damage_crisis_1_desc:0 "Nhu cầu phòng thủ chống lại kẻ xâm lược hùng mạnh giữ cho toàn thiên hà một cục diện hòa bình mong manh. Chúng ta phải cùng nhau duy trì cục diện này, chống lại những kẻ phá bĩnh từ bên trong lẫn bên ngoài."
 damage_crisis_2:0 "Gìn giữ Hòa bình Thiên hà"
 damage_crisis_2_desc:0 "Nếu muốn có đủ quyền uy đạo đức để lãnh đạo, chúng ta phải chứng minh cho toàn thiên hà thấy rằng chúng ta không chỉ có ý chí bảo vệ vũ trụ khỏi hiểm họa bên ngoài, mà còn có thừa năng lực để làm điều đó."
 envoy_unity_1:0 "Cầu nối Liên bang"
 envoy_unity_1_desc:0 "Những người quyết định chương trình nghị sự—các đặc sứ của chúng ta—đã dùng bản lĩnh chính trị để thắt chặt cảm giác thuộc về Liên bang và thúc đẩy lợi ích tương hỗ giữa các bên."
 envoy_unity_1_effect:2 "Mỗi Quan chức được phái đến Liên bang sẽ giúp quốc gia thành viên đó nhận §Y2§! Tinh thần Đoàn kết và tăng §Y5%§! Tốc độ tăng trưởng Độ tin cậy."
 envoy_unity_2:0 "Thống nhất Liên bang"
 envoy_unity_2_desc:1 "Các đặc sứ làm việc không biết mệt mỏi để quảng bá và thúc đẩy các mục tiêu của Liên bang, khơi gợi tình hữu nghị và niềm tin trên khắp thiên hà."
 envoy_unity_2_effect:1 "Mỗi Quan chức được phái đến Liên bang sẽ giúp quốc gia thành viên đó nhận §Y2§! Tinh thần Đoàn kết và tăng §Y5§! điểm Giới hạn Độ tin cậy."
 cohesion_join_1:0 "Thiện chí Từ tâm"
 cohesion_join_1_desc:0 "Bất kể sự khác biệt về văn hóa hay sinh học, sự phát triển của Liên bang chúng ta là để thúc đẩy lợi ích của tất cả mọi người."
 cohesion_join_1_effect:0 "Giảm §Y50%§! hình phạt Gắn kết mà thành viên mới gây ra cho Liên bang."
 cohesion_failed_vote_1:0 "Cầu đồng Tồn dị"
 cohesion_failed_vote_1_desc:0 "Lời ra tiếng vào chính là lò luyện tốt nhất để thử thách các ý tưởng, miễn là hướng tới sự ổn định trong tương lai, tranh luận chính là một phương thức vĩ đại."
 cohesion_failed_vote_1_effect:0 "Giảm §Y50%§! hình phạt Gắn kết khi bỏ phiếu thất bại trong Liên bang."
 federation_fleet_unity_1:0 "Một lòng Đoàn kết"
 federation_fleet_unity_1_desc:0 "Biết rằng hạm đội liên hợp của chúng ta đang tuần tra giữa khoảng hư không sẽ khiến các quốc gia thành viên cảm thấy tự hào, an tâm và kiên định."
 federation_fleet_unity_1_effect:1 "£unity£ §YTinh thần Đoàn kết hàng tháng§! thu về bằng §Y10%§! quy mô Hạm Đội Liên Bang."
 president_keep_navy_1:0 "Miễn trừ Định ngạch"
 president_keep_navy_1_desc:0 "Một nhà lãnh đạo nêu gương có ý nghĩa vô cùng to lớn và truyền cảm hứng mạnh mẽ, do đó nhà lãnh đạo có thể được miễn trừ khỏi bất kỳ giới hạn nào cản trở họ trở thành tấm gương."
 president_keep_navy_1_effect:1 "Nước Chủ tịch Liên bang không cần cắt giảm sức chứa hải quân bản thân mà vẫn đóng góp vào Sức chứa Hạm Đội Liên Bang."
 president_hegemony_cb_1:0 "Thần phục hay Diệt vong"
 president_hegemony_cb_1_desc:0 "Không là bạn thì hẳn là thù. Mọi thế lực chống đối chúng ta đều sẽ bị tiêu diệt vì bị coi là mối đe dọa."
 president_hegemony_cb_1_effect:1 "Nước Chủ tịch nhận được §YMục tiêu Chiến tranh§! ép buộc các đế chế ngoài Liên bang phải gia nhập Liên bang."
 president_diplo_weight_steal_1:0 "Đặc quyền Bá chủ"
 president_diplo_weight_steal_1_desc:0 "Sức mạnh của nước Chủ tịch không cho phép bị suy giảm trong bất kỳ thời điểm nào. Vì vậy, chúng ta cần sự hỗ trợ mạnh mẽ và chủ động từ các nước chư hầu trong Liên bang."
 president_diplo_weight_steal_1_effect:1 "Mỗi thành viên đóng góp §Y10%§! §Y$MOD_DIPLO_WEIGHT_MULT$§! cho Chủ tịch Liên bang."

 spiritualist_federation_passive:0 "$spiritualist_federation$"
 spiritualist_federation_passive_desc:0 "$spiritualist_federation_desc$"
 spiritualist_federation_passive_tooltip:0 "$mod_country_unity_produces_mult$: §G+10%§!"
 spiritualist_envoys_1:0 "Đại biểu Thuyết phục"
 spiritualist_envoys_1_desc:0 "Đại biểu của chúng ta sẽ ngăn chặn những hành vi báng bổ thần thánh."
 spiritualist_envoys_1_effect:0 "§Y$official_plural_with_icon$§! được cử đến liên bang sẽ sản xuất thêm §G50%§! §YGắn Kết§! và làm tăng sức hấp dẫn của tư tưởng §YDuy tâm§! trên toàn đế chế thêm §Y20%§!."
 culture_workers_1:0 "Thúc đẩy Văn hóa"
 culture_workers_1_desc:0 "Bản sắc văn hóa đa dạng chính là sức mạnh của chúng ta. Thúc đẩy văn hóa cũng chính là cách tuyệt vời nhất để nâng tầm sức mạnh của chính mình."
 culture_workers_1_effect:0 "$mod_planet_civilians_unity_produces_add$:§G+1§!\n[civilian.GetIcon][civilian.GetNamePlural] nhận được hiệu ứng bổ sung từ hệ tư tưởng của đế chế."
 president_spiritualist_1:0 "Truyền bá Thánh địa"
 president_spiritualist_1_desc:0 "Chỉ khi đưa nó vào Luật Thiên Hà, chúng ta mới có thể chắc chắn rằng lợi ích của những người theo chủ nghĩa Duy tâm sẽ được bảo vệ."
 unity_trade_1:0 "Ngân sách Giáo hội"
 unity_trade_1_desc:0 "Không có của cải, giáo đoàn không thể phát triển thịnh vượng. Chúng ta nên tận dụng sức mạnh của thương mại để giúp họ trở nên sung túc hơn, từ đó đưa chúng ta tiến gần hơn tới mục tiêu của linh hồn."
 unity_trade_1_effect:0 "Cho phép áp dụng chính sách thương mại §YKhế ước Thần thánh§!, chính sách này sẽ chuyển đổi §Y50%§! $r_trade$ thành $r_unity$."
 ascension_shared_1:0 "Hiệp ước Trời ban"
 ascension_shared_1_desc:0 "Sự gắn kết ngày càng bền chặt của liên minh chúng ta sẽ đơm hoa kết trái thông qua sự thịnh vượng và hạnh phúc về mặt tinh thần của người dân chúng ta."
 president_spiritualist_2:0 "Theo đuổi Thăng thiên"
 president_spiritualist_2_desc:0 "Việc dẫn dắt Thánh ước này là một bước tiến dài hướng tới sự thăng hoa tâm linh."
 all_the_priests_1:0 "Trao quyền cho Tu sĩ"
 all_the_priests_1_desc:0 "Càng có nhiều tu sĩ, chúng ta càng ít phải chịu đựng những sự ô uế trong tâm hồn."
 all_the_priests_1_effect:0 "§YQuy hoạch Thuộc địa§! chuyên về Củng cố £unity£ khiến cho mỗi 25 £pop£ §YDân số§! sản xuất thêm §G+1 £job_priest£ §Y$job_priest_plural$§!§! (Hiệu ứng này có thể được tăng cường thêm thông qua Thăng thiên Thuộc địa)."
 all_the_priests_2:0 "Giai cấp Thần thánh"
 all_the_priests_2_desc:0 "Khi chúng ta ngày càng chú trọng vào các vấn đề tâm linh, đội ngũ tu sĩ cũng dần trở nên đông đúc. Những người có tài năng xuất chúng nhất trong số đó nên được thăng tiến vào tầng lớp lãnh đạo giáo hội mở rộng."
 all_the_priests_2_effect:0 "§YTrung tâm Thần thánh§! và các công trình tương đương sản xuất §G+$pop_group_unit$§! £job_high_priest£ §Y$job_high_priest_plural$§!."
 president_spiritualist_3:0 "Lặn Sâu vào Hư Không"
 president_spiritualist_3_desc:0 "§MHư Không§! chính là tương lai. Chúng ta nhất định phải làm chủ được nó."
 make_spiritualist_1:0 "Đức tin Đồng nhất"
 make_spiritualist_1_desc:0 "Đức tin của chúng ta là cốt lõi của Khế ước Thần thánh. Sẽ không còn bất kỳ sự dung thứ nào cho những kẻ dị giáo: nếu muốn tiếp tục ở lại trong liên minh, mọi thành viên đều phải hoàn thành tốt bổn phận của mình."
 make_spiritualist_1_effect:0 "Công trình §YQuan liêu§! của các đế chế Không theo chủ nghĩa Duy tâm và phi Gestalt sẽ được thay thế bằng §YĐền thờ§!.\nĐế chế Duy tâm nhận được §G+1§! $r_unity$ $produced_per_pop_group_unit$ £job_priest£ §Y$job_priest_plural$§!.\nTốc độ lắp ráp dân số máy móc của tất cả các đế chế giảm §R30%§!, nhưng tốc độ tăng trưởng dân số hữu cơ tăng §G+15%§!."
 zro_catalysis_1:0 "Xúc tác Zro"
 zro_catalysis_1_desc:0 "Zro là một nguồn tài nguyên vẫn chưa được khai thác triệt để. Những bộ óc lỗi lạc nhất của chúng ta đã tìm ra phương pháp tuyệt vời hơn để tận dụng nó."
 zro_catalysis_1_effect:0 "Mở khóa sắc lệnh §YXúc tác Zro§!, cho phép ta chuyển đổi £sr_zro£ §YZro§! thành phần thưởng gia tăng sản lượng tài nguyên."
 president_spiritualist_4:0 "Sắc lệnh Sùng đạo"
 president_spiritualist_4_desc:0 "Nhờ vào ân điển của Khế ước Thần thánh, vị tổng thống có thể thi triển quyền lực thực tế to lớn hơn trên lãnh thổ của mình."

