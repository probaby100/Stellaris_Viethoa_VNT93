 resolution_galactic_market_form:0 "Thành lập Thị Trường Thiên Hà Chung"
 resolution_galactic_market_form_desc:0 "Kể từ khi hai chủng loài liên sao gặp nhau, hoạt động giao thương ngân hà thực chất không bị ảnh hưởng bởi các mối quan hệ ngoại giao vẫn luôn tồn tại.\n\nLà những nhà lãnh đạo ngân hà, chúng ta nên đồng ý rằng đã đến lúc §Yhợp pháp hóa thị trường thương mại này§!, để tất cả mọi người đều có thể được hưởng lợi."
 resolution_galactic_market_form_effect_success:0 "Bắt đầu chuỗi sự kiện $action.96.name$."
 resolution_galactic_market_form_effect_failure:0 "$action.106.name$ sẽ tạm thời không được thành lập."

 galactic_market_founded:0 "$resolution_galactic_market_form$"

 # Ecology
 resolution_category_ecology:0 "Bảo vệ Sinh thái"

 resolution_ecology_repeal_1:0 "§RBãi bỏ $resolution_ecology_recycling_initiatives$§!"
 resolution_ecology_repeal_1_desc:1 "Mặc dù tầm quan trọng của việc bảo vệ môi trường là vô cùng rõ ràng, nhưng các đế chế trong [global_event_country.GetGalCommunityOrGalImperium] nên nhận được đủ sự tin tưởng để tự đưa ra quyết định của riêng mình."
 resolution_ecology_repeal_1_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_ecology_recycling_initiatives$§!."

 resolution_ecology_repeal_2:0 "§RBãi bỏ $resolution_ecology_natural_sanctuaries$§!"
 resolution_ecology_repeal_2_desc:0 "$resolution_ecology_repeal_1_desc$"
 resolution_ecology_repeal_2_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_ecology_natural_sanctuaries$§!, biến §Y$resolution_ecology_recycling_initiatives$§! trở thành Luật Thiên Hà."

 resolution_ecology_repeal_3:0 "§RBãi bỏ $resolution_ecology_integrated_gardens$§!"
 resolution_ecology_repeal_3_desc:0 "$resolution_ecology_repeal_1_desc$"
 resolution_ecology_repeal_3_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_ecology_integrated_gardens$§!, biến §Y$resolution_ecology_natural_sanctuaries$§! trở thành Luật Thiên Hà."

 resolution_ecology_repeal_4:0 "§RBãi bỏ $resolution_ecology_environmental_control_board$§!"
 resolution_ecology_repeal_4_desc:0 "$resolution_ecology_repeal_1_desc$"
 resolution_ecology_repeal_4_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_ecology_environmental_control_board$§!, biến §Y$resolution_ecology_integrated_gardens$§! trở thành Luật Thiên Hà."

 resolution_ecology_repeal_5:0 "§RBãi bỏ $resolution_ecology_paradise_initiative$§!"
 resolution_ecology_repeal_5_desc:0 "$resolution_ecology_repeal_1_desc$"
 resolution_ecology_repeal_5_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_ecology_paradise_initiative$§!, biến §Y$resolution_ecology_environmental_control_board$§! trở thành Luật Thiên Hà.\n\n"

 resolution_ecology_recycling_initiatives:0 "Sáng kiến Tái chế Toàn Ngân hà"
 resolution_ecology_recycling_initiatives_desc:1 "Tất cả chúng ta đều sẽ được hưởng lợi nếu có thể giảm thiểu lãng phí và đẩy mạnh tái chế. Việc cùng nhau xây dựng các quy định tái sử dụng giữa các quốc gia trong [global_event_country.GetGalCommunityOrGalImperium] sẽ mang lại lợi ích cho tất cả chúng ta."

 resolution_ecology_natural_sanctuaries:0 "Khu Bảo tồn Thiên nhiên"
 resolution_ecology_natural_sanctuaries_desc:0 "Chúng ta nên bảo vệ các khu vực tự nhiên như những khu vườn, để công dân của chúng ta có thể đến đó thư giãn, trút bỏ mọi muộn phiền. Ngành công nghiệp nặng sẽ bị hạn chế một chút, nhưng điều đó sẽ không ảnh hưởng quá lớn."

 resolution_ecology_integrated_gardens:0 "Khu vườn Tích hợp"
 resolution_ecology_integrated_gardens_desc:0 "Bằng cách khuyến khích công dân tự trồng trọt tự cung tự cấp, và bắt buộc áp dụng rộng rãi các thiết bị thủy canh dễ sử dụng, chúng ta có thể giảm thiểu tác động đến môi trường và gia tăng tỷ lệ phủ xanh."
 resolution_ecology_integrated_gardens_tooltip:0 "£unity£ $unity$ tạo ra từ các Chướng ngại vật tự nhiên trong §YĐế chế Bảo vệ Môi trường§!: §G+1§! £unity£"
 resolution_ecology_environmental_control_board:0 "Ủy ban Kiểm soát Môi trường"
 in_breach_of_resolution_ecology_environmental_control_board:0 "Vi phạm Ủy ban Kiểm soát Môi trường"
 resolution_ecology_environmental_control_board_desc:0 "Ngành công nghiệp sẽ không tự giác giám sát chính mình. Do đó, chúng ta cần một Ủy ban Kiểm soát Môi trường xuyên quốc gia, được trao quyền giám sát công nghiệp và xây dựng, nhằm ngăn chặn việc tàn phá môi trường."
 resolution_ecology_environmental_control_board_tooltip: "Biến đổi các hành tinh thành §YĐô Thị Toàn Cầu§! hoặc §YCải Tạo Địa Cầu§! thành bất kỳ dạng nào khác ngoài §YHành Tinh Gaia§!, sử dụng §Y$arkship_stellar_ignition$§!, và khai hỏa §Y$dyson_gun_0$§! làm biến đổi nhiệt độ hành tinh, đều bị §Rcấm§!.\n£unity£ $unity$ từ các Chướng Ngại Vật Tự Nhiên cho §YĐế Chế Bảo Vệ Môi Trường§!: §G+2§! £unity£"
 resolution_ecology_paradise_initiative_tooltip:0 "£unity£ $unity$ tạo ra từ các Chướng ngại vật tự nhiên trong §YĐế chế Bảo vệ Môi trường§!: §G+3§! £unity£\n\nCung cấp vị trí việc làm £job_ranger£ $job_ranger$ từ các Chướng ngại vật tự nhiên trong §YĐế chế Bảo vệ Môi trường§!: §G+1§! £job_ranger£"

 resolution_ecology_paradise_initiative:0 "Dự án Thiên đường"
 resolution_ecology_paradise_initiative_desc:0 "Bằng cách nâng niu và chăm sóc thế giới mà chúng ta đang sinh sống, chúng ta có thể chung sống hài hòa với môi trường. Mục tiêu của chúng ta nên là: ở những nơi chúng ta đã từng đi qua, ngoài những kỷ niệm, tuyệt đối không để lại bất kỳ dấu vết nào."

 # Galactic Studies

 resolution_category_galacticstudies:0 "Giải phóng Tri thức"

 resolution_galacticstudies_repeal_1:0 "§RBãi bỏ $resolution_galacticstudies_cooperative_research_channels$§!"
 resolution_galacticstudies_repeal_1_desc:0 "Luật Thiên Hà đang đặt nhiều vấn đề về sở hữu trí tuệ và an ninh quốc gia vào vòng nguy hiểm. Chúng ta phải bãi bỏ những đạo luật sai lầm này để bảo vệ người dân của mình."
 resolution_galacticstudies_repeal_1_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_galacticstudies_cooperative_research_channels$§!."

 resolution_galacticstudies_repeal_2:0 "§RBãi bỏ $resolution_galacticstudies_astral_studies_network$§!"
 resolution_galacticstudies_repeal_2_desc:0 "$resolution_galacticstudies_repeal_1_desc$"
 resolution_galacticstudies_repeal_2_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_galacticstudies_astral_studies_network$§!, biến §Y$resolution_galacticstudies_cooperative_research_channels$§! trở thành Luật Thiên Hà."

 resolution_galacticstudies_repeal_3:0 "§RBãi bỏ $resolution_galacticstudies_advanced_xenostudies$§!"
 resolution_galacticstudies_repeal_3_desc:0 "$resolution_galacticstudies_repeal_1_desc$"
 resolution_galacticstudies_repeal_3_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_galacticstudies_advanced_xenostudies$§!, biến §Y$resolution_galacticstudies_astral_studies_network$§! trở thành Luật Thiên Hà."

 resolution_galacticstudies_repeal_4:0 "§RBãi bỏ $resolution_galacticstudies_ethical_guideline_refactoring$§!"
 resolution_galacticstudies_repeal_4_desc:0 "$resolution_galacticstudies_repeal_1_desc$"
 resolution_galacticstudies_repeal_4_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_galacticstudies_ethical_guideline_refactoring$§!, biến §Y$resolution_galacticstudies_advanced_xenostudies$§! trở thành Luật Thiên Hà."

 resolution_galacticstudies_repeal_5:0 "§RBãi bỏ $resolution_galacticstudies_extradimensional_experimentation$§!"
 resolution_galacticstudies_repeal_5_desc:0 "$resolution_galacticstudies_repeal_1_desc$"
 resolution_galacticstudies_repeal_5_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_galacticstudies_extradimensional_experimentation$§!, biến §Y$resolution_galacticstudies_ethical_guideline_refactoring$§! trở thành Luật Thiên Hà."

 resolution_galacticstudies_cooperative_research_channels:0 "Kênh Hợp tác Nghiên cứu"
 resolution_galacticstudies_cooperative_research_channels_desc:1 "Chúng ta nên thiết lập các thỏa thuận, cho phép cộng đồng nhà khoa học của [global_event_country.GetGalCommunityOrGalImperium] chia sẻ và đánh giá các khám phá của họ một cách thuận tiện hơn."

 resolution_galacticstudies_astral_studies_network:0 "Mạng lưới Nghiên cứu Không gian"
 resolution_galacticstudies_astral_studies_network_desc:0 "Bằng cách kết nối các căn cứ sao thành một mạng lưới cảm biến khổng lồ, chúng ta có thể cải thiện đáng kể chất lượng dữ liệu thu thập được."
 resolution_galacticstudies_astral_studies_network_tooltip:0 "Tăng cường hiệu quả của các mô-đun và công trình căn cứ sao §Y$sm_solar_panel_network$§!, §Y$sm_black_hole_observatory$§! và §Y$sm_listening_post$§!."

 resolution_galacticstudies_advanced_xenostudies:0 "Nghiên cứu Ngoại hành tinh Bậc cao"
 resolution_galacticstudies_advanced_xenostudies_desc:1 "Có rất nhiều điều đáng để học hỏi từ các nền văn minh khác nhau trong vũ trụ. Chúng ta nên bổ sung thêm các thiết bị thu thập thông tin trên tất cả căn cứ sao để giao tiếp và hợp tác chặt chẽ hơn với các thành bang không gian."
 resolution_galacticstudies_advanced_xenostudies_tooltip:3 "Trạm quan sát có thể sản xuất nhiều £society£§HĐiểm nghiên cứu Xã hội học§! hơn khi §YQuan sát§! các nền văn minh tiền FTL.\n\nTăng cường hiệu quả của các công trình căn cứ sao như §Y$sm_art_college$§!, §Y$sm_curator_think_tank$§!, §Y$sm_salvager_workshop$§! và §Y$sm_mercenary_garrison$§!.\n\nChính sách §YCấm Trí tuệ Nhân tạo§! và §Y$interference_not_allowed$§! sẽ bị §Rcấm§!."

 resolution_galacticstudies_ethical_guideline_refactoring:0 "Tái cấu trúc Tiêu chuẩn Đạo đức"
 resolution_galacticstudies_ethical_guideline_refactoring_desc:0 "Việc theo đuổi các nguyên lý khoa học sâu sắc hơn, giải phóng bản thân khỏi những xiềng xích của quan niệm đạo đức cũ kỹ, là trách nhiệm cao cả của chúng ta."
 resolution_galacticstudies_ethical_guideline_refactoring_tooltip:0 "Chính sách §Y$research_restriction_dangerous_forbidden$§! bị §Rcấm§!.\nKích hoạt chính sách §Y$research_restriction_dangerous_encouraged$§!.\nTất cả các đế chế phải sử dụng chính sách §YCường hóa Lãnh đạo§! ở mức cao nhất mà họ được phép, nếu không sẽ bị coi là §Rvi phạm Luật Thiên Hà§!!\n\nCác đế chế §YBình đẳng§! có thể không đáp ứng được yêu cầu này, và do đó cũng sẽ bị coi là §Rvi phạm Luật Thiên Hà§!/"

 resolution_galacticstudies_extradimensional_experimentation:0 "Phương pháp Thử nghiệm Đa chiều"
 resolution_galacticstudies_extradimensional_experimentation_desc:0 "Nghiên cứu sơ bộ cho thấy, việc sử dụng lượng lớn vật chất thay đổi thực tại có thể mang lại cho các nhà nghiên cứu những hiểu biết bất ngờ.\n\n§RDù sao thì, hậu quả có thể tồi tệ đến mức nào chứ?§!"
 resolution_galacticstudies_extradimensional_experimentation_tooltip:0 "Tiêu hao £sr_zro£Zro để mở khóa một quyết định hành tinh, nhằm tài trợ cho các nghiên cứu đa chiều tiến hành trong $building_research_efficiency_1$."
 pm_extradimensional_experimentation:0 "$resolution_galacticstudies_extradimensional_experimentation$"
 pm_extradimensional_experimentation_tooltip:0 "§Y$building_research_efficiency_1$§!:\n$mod_planet_physicists_sr_zro_upkeep_add$: §R+1§!\n$mod_planet_physicists_physics_research_produces_add$: §G+2§!"
 pm_extradimensional_experimentation_desc:0 "$building_research_efficiency_1$ của hành tinh này đang tiến hành các thử nghiệm đa chiều.\n\n§RLiệu có chuyện gì tồi tệ sẽ xảy ra không?§!"
 extradimensional_experimentation_tooltip:0 "§YMở khóa Quyết định Hành tinh:§! $pm_extradimensional_experimentation$"
 decision_extradimensional_experimentation:0 "$resolution_galacticstudies_extradimensional_experimentation$"
 decision_extradimensional_experimentation_desc:0 "$pm_extradimensional_experimentation_desc$"
 decision_end_extradimensional_experimentation:0 "Kết thúc $resolution_galacticstudies_extradimensional_experimentation$"
 decision_end_extradimensional_experimentation_desc:0 "Phương pháp nghiên cứu này rất nguy hiểm và phải chấm dứt. Trước đây chúng ta đã quá thiếu suy nghĩ."
 federations.10020.name:0 "$resolution_galacticstudies_extradimensional_experimentation$"
 federations.10020.desc:1 "Bí ẩn của vũ trụ không phải lúc nào cũng hiển nhiên.\n\n[global_event_country.GetGalCommunityOrGalImperium] đã phê chuẩn việc sử dụng vật chất thay đổi thực tại để thúc đẩy nghiên cứu, giúp cho các nhà khoa học của chúng ta trong $building_research_efficiency_1$ có thể khám phá sự thật của những điều chưa biết."
 federations.10020.desc_gestalt:1 "Bí ẩn của vũ trụ không phải lúc nào cũng hiển nhiên.\n\n[global_event_country.GetGalCommunityOrGalImperium] đã phê chuẩn việc sử dụng vật chất thay đổi thực tại để thúc đẩy nghiên cứu, giúp cho [root.GetResearcherPlural] của chúng ta trong $building_research_efficiency_1$ có thể khám phá sự thật của những điều chưa biết."


