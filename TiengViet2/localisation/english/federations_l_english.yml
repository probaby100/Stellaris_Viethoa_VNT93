 origin_default:0 "Thống nhất Phồn vinh"
 origin_default_desc: "Trải qua bao đấu tranh và thắng lợi, xã hội này đã hiện thực hóa được khát vọng của mọi nền văn minh non trẻ: một quê hương với mục tiêu thống nhất, một con đường vươn tới những vì sao rực rỡ."
 origin_default_nomadic: "$origin_default$"
 origin_default_nomadic_desc: "Trải qua bao phen xung đột cùng chiến thắng, xã hội này rốt cuộc đã chạm tới ước nguyện bao đời của mọi nền văn minh non trẻ: người dân đồng lòng một dạ, con đường vươn tới muôn vì sao đã rộng mở, và sứ mệnh chung của họ nay được gánh vác bởi một con tàu Ark hùng mạnh, lan tỏa khắp dải ngân hà."
 origin_tooltip_default_effects_start: "—$INITIAL_POPS$§G+400§!$NEW_LINE$—$HOMEWORLD$$TABBED_NEW_LINE$—['concept_generator_district', £district£ $district_generator_plural$]: §G+1§!"
