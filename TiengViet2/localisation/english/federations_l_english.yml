 job_gas_plant_engineer_gestalt:0 "Cá Thể Nhà Máy Khí"
 job_gas_plant_engineer_gestalt_plural:0 "Cá Thể Nhà Máy Khí"
 job_gas_plant_engineer_gestalt_desc:0 "Những cá thể này phụ trách bảo dưỡng và vận hành các tổ hợp lọc khổng lồ được xây ngay trên miệng xả bào tử của nấm hang động."
