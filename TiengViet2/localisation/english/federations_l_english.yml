 resolution_category_galactic_focus:0 "Thay đổi Trọng tâm Ngân hà"
 resolution_galactic_focus_effect_failure:0 "Trọng tâm ngân hà không thay đổi."
 resolution_galactic_focus_crisis_effect_success:1 "Tất cả các quốc gia đã gia nhập [global_event_country.GetGalCommunityOrGalImperium] sẽ mở cửa biên giới với nhau và tiến hành tổng động viên để chuẩn bị cho chiến tranh."

 resolution_galactic_focus_crisis_prethoryn:0 "Trọng tâm: Thảm họa Prethoryn Scourge"
 resolution_galactic_focus_crisis_prethoryn_desc:0 "Prethoryn Scourge là một mối đe dọa đối với mọi sinh vật sống trong toàn cõi thiên hà. Nếu chúng ta không đoàn kết lại để ngăn chặn chúng, chúng sẽ cắn nuốt tất cả chúng ta không chừa một ai. Chúng ta nên giải quyết cuộc khủng hoảng này thông qua trọng tâm ngân hà."
 resolution_galactic_focus_crisis_prethoryn_effect_success:0 "$resolution_galactic_focus_crisis_effect_success$"

 resolution_galactic_focus_crisis_unbidden:0 "Trọng tâm: Kẻ Xâm lược Ngoại vi"
 resolution_galactic_focus_crisis_unbidden_desc:0 "Những Kẻ xâm lược Ngoại vi là một mối đe dọa đối với mọi sinh vật sống trong toàn cõi thiên hà. Nếu chúng ta không đoàn kết lại để ngăn chặn chúng, chúng sẽ tiêu diệt tất cả chúng ta. Chúng ta nên giải quyết cuộc khủng hoảng này thông qua trọng tâm ngân hà."
 resolution_galactic_focus_crisis_unbidden_effect_success:0 "$resolution_galactic_focus_crisis_effect_success$"

 resolution_galactic_focus_crisis_contingency:0 "Trọng tâm: Giao thức Thanh trừng"
 resolution_galactic_focus_crisis_contingency_desc:0 "Hệ thống trí tuệ nhân tạo mang tên Giao thức Thanh trừng là một mối đe dọa đối với mọi sinh vật sống trong toàn cõi thiên hà. Nếu chúng ta không đoàn kết lại để ngăn chặn chúng, chúng sẽ hủy diệt tất cả chúng ta. Chúng ta nên giải quyết cuộc khủng hoảng này thông qua trọng tâm ngân hà."
 resolution_galactic_focus_crisis_contingency_effect_success:0 "$resolution_galactic_focus_crisis_effect_success$"

 resolution_galactic_focus_crisis_greatkhan:0 "Trọng tâm: Đại Hãn"
 resolution_galactic_focus_crisis_greatkhan_desc:0 "Sự tàn phá của Đại Hãn là một mối đe dọa đối với mọi quốc gia tự do trong toàn cõi thiên hà. Nếu chúng ta không đoàn kết lại để ngăn chặn họ, hạm đội của họ sẽ nghiền nát chúng ta. Chúng ta nên giải quyết cuộc khủng hoảng này thông qua trọng tâm ngân hà."
 resolution_galactic_focus_crisis_greatkhan_effect_success:0 "$resolution_galactic_focus_crisis_effect_success$"

 resolution_galactic_focus_crisis_nanites:0 "Trọng tâm: Cơn bão Xám"
 resolution_galactic_focus_crisis_nanites_desc:0 "Bầy nanobot trào ra từ Cụm sao L là một mối đe dọa đối với mọi sinh vật sống trong toàn cõi thiên hà. Nếu chúng ta không đoàn kết lại để ngăn chặn chúng, chúng sẽ hủy diệt tất cả chúng ta. Chúng ta nên giải quyết cuộc khủng hoảng này thông qua trọng tâm ngân hà."
 resolution_galactic_focus_crisis_nanites_effect_success:0 "$resolution_galactic_focus_crisis_effect_success$"

 resolution_galactic_focus_war_in_heaven_support_side_1:1 "Trọng tâm: Lên án [SecondSleeper.GetName]"
 resolution_galactic_focus_war_in_heaven_support_side_1_desc:2 "[SecondSleeper.GetName] là kẻ phi nghĩa trong cuộc chiến này, chúng ta nên đoàn kết lại và công khai ủng hộ [FirstSleeper.GetName]."
 resolution_galactic_focus_war_in_heaven_support_side_1_success:2 "Việc không tham gia cùng §Y[FirstSleeper.GetName]§! trong §YChiến tranh trên Thiên đàng§! sẽ bị coi là §Rvi phạm Luật Thiên Hà§!."

 resolution_galactic_focus_war_in_heaven_support_side_2:1 "Trọng tâm: Lên án [FirstSleeper.GetName]"
 resolution_galactic_focus_war_in_heaven_support_side_2_desc:2 "[FirstSleeper.GetName] là kẻ phi nghĩa trong cuộc chiến này, chúng ta nên đoàn kết lại và công khai ủng hộ [SecondSleeper.GetName]."
 resolution_galactic_focus_war_in_heaven_support_side_2_success:2 "Việc không tham gia cùng §Y[SecondSleeper.GetName]§! trong §YChiến tranh trên Thiên đàng§! sẽ bị coi là §Rvi phạm Luật Thiên Hà§!."

 resolution_galactic_focus_war_in_heaven_denounce_both:0 "Trọng tâm: Lên án Cả hai Đế chế Thức tỉnh"
 resolution_galactic_focus_war_in_heaven_denounce_both_desc:1 "Cả [FirstSleeper.GetName] và [SecondSleeper.GetName] đều cho thấy sự thiếu chín chắn trầm trọng. Hãy soạn thảo một văn bản ngoại giao với những lời lẽ đanh thép để gửi cho cả hai bên."
 resolution_galactic_focus_war_in_heaven_denounce_both_success:0 "Việc tham gia cùng bất kỳ Đế chế Thức tỉnh nào trong §YChiến tranh trên Thiên đàng§! sẽ bị coi là §Rvi phạm Luật Thiên Hà§!.\n\nCác đế chế không phải là chư hầu của Đế chế Thức tỉnh sẽ nhận được những phần thưởng sau."

 galactic_focus_crisis_prethoryn:3 "Đánh bại Thảm họa Prethoryn Scourge"
 galactic_focus_crisis_prethoryn_desc:0 "Prethoryn Scourge là một cuộc khủng hoảng thực sự mà toàn bộ thiên hà đang phải đối mặt, chúng ta phải đoàn kết lại để đánh bại mối đe dọa này."

 galactic_focus_crisis_unbidden:3 "Đánh bại Kẻ Xâm lược Ngoại vi"
 galactic_focus_crisis_unbidden_desc:0 "Kẻ Xâm lược Ngoại vi là một cuộc khủng hoảng thực sự mà toàn bộ thiên hà đang phải đối mặt, chúng ta phải đoàn kết lại để đánh bại mối đe dọa này."

 galactic_focus_crisis_contingency:3 "Đánh bại Giao thức Thanh trừng"
 galactic_focus_crisis_contingency_desc:0 "Giao thức Thanh trừng là một cuộc khủng hoảng thực sự mà toàn bộ thiên hà đang phải đối mặt, chúng ta phải đoàn kết lại để đánh bại mối đe dọa này."

 galactic_focus_crisis_greatkhan:3 "Đánh bại Đại Hãn"
