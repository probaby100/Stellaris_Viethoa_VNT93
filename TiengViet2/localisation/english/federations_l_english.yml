 resolution_mutualdefense_repeal_5:0 "§RBãi bỏ $resolution_mutualdefense_renegade_containment$§!"
 resolution_mutualdefense_repeal_5_desc:0 "$resolution_mutualdefense_repeal_1_desc$"
 resolution_mutualdefense_repeal_5_effect_success:3 "Bãi bỏ nghị quyết §Y$resolution_mutualdefense_renegade_containment$§!, biến §Y$resolution_mutualdefense_castigation_proclamation$§! trở thành Luật Thiên Hà."

 resolution_mutualdefense_naval_weight:0 "$MOD_DIPLO_WEIGHT_NAVAL_MULT$"
 resolution_mutualdefense_the_readied_shield:0 "Tấm khiên Thường trực"
 resolution_mutualdefense_the_readied_shield_desc:1 "Vũ trụ vô cùng nguy hiểm, toàn thể các thành viên của [global_event_country.GetGalCommunityOrGalImperium] nên luôn trong trạng thái sẵn sàng bảo vệ hành tinh của mình khỏi các cuộc tấn công của cướp biển, sinh vật không gian hoặc bất kỳ thực thể vô danh nào khác."

 resolution_mutualdefense_military_readiness_act:0 "Đạo luật Chuẩn bị Quân sự"
 resolution_mutualdefense_military_readiness_act_desc:1 "Mỗi thành viên của [global_event_country.GetGalCommunityOrGalImperium] dù vì lợi ích của chính mình hay của người khác đều có nghĩa vụ đóng góp một phần công sức vào công cuộc phòng vệ ngân hà."
 resolution_mutualdefense_military_readiness_act_tooltip:1 "Trong [global_event_country.GetGalCommunityOrGalImperium], những thành viên không phải là chư hầu mà có số lượng hạm đội không đạt được một nửa sức chứa hải quân sẽ rơi vào trạng thái §Rvi phạm Luật Thiên Hà§!."

 resolution_mutualdefense_enemy_of_my_enemy:0 "Kẻ Thù Của Kẻ Thù"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "Trở thành kẻ thù của bất kỳ ai trong số chúng ta cũng đồng nghĩa với việc đối đầu với toàn thể chúng ta. Nếu một thành viên bị tấn công, lẽ nào chúng ta lại không dốc toàn lực để trừng phạt kẻ xâm lược sao?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:1 "Nhận được lý do chiến tranh §YPhản công§! đối với các quốc gia không nằm trong [global_event_country.GetGalCommunityOrGalImperium] đã phát động chiến tranh xâm lược nhắm vào các thành viên của [global_event_country.GetGalCommunityOrGalImperium] chúng ta."

 resolution_mutualdefense_castigation_proclamation:0 "Hịch Chinh phạt"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Kẻ không đứng cùng phe với chúng ta chính là kẻ thù, và tất cả những quốc gia to gan dám chống lại Luật Thiên Hà đều phải chịu sự trừng phạt đích đáng."
 resolution_mutualdefense_castigation_proclamation_tooltip:1 "Tất cả các thành viên [global_event_country.GetGalCommunityOrGalImperium] đều có thể đưa ra nghị quyết nhằm §YLên án§! các thành viên đang trong trạng thái §Rvi phạm Luật Thiên Hà§! hoặc các quốc gia không nằm trong [global_event_country.GetGalCommunityOrGalImperium].\n\nCác đế chế đã kích hoạt §YChiến tranh Không giới hạn§! sẽ có thể sử dụng lý do chiến tranh §YThù địch§! và mục tiêu chiến tranh §YNhục mạ§! nhắm vào các quốc gia bị [global_event_country.GetGalCommunityOrGalImperium] §RLên án§! hoặc các thành viên đang trong trạng thái §Rvi phạm Luật Thiên Hà§!."
 resolution_mutualdefense_castigation_denouncement:0 "Chinh phạt"
 resolution_mutualdefense_castigation_denouncement_desc:1 "Phát đi một tuyên bố lên án chính thức nhắm vào đế chế mục tiêu. Hành động này có thể được nhắm vào các quốc gia không thuộc [global_event_country.GetGalCommunityOrGalImperium] hoặc các đế chế đang vi phạm Luật Thiên Hà."

 resolution_mutualdefense_renegade_containment:0 "Thuyết Ngăn chặn Sự quay lưng"
 resolution_mutualdefense_renegade_containment_desc:1 "Những lợi ích khi có tư cách thành viên [global_event_country.GetGalCommunityOrGalImperium] là điều không cần phải bàn cãi, bản thân hành động từ chối trở thành thành viên đã bộc lộ dã tâm rõ rệt. Các quốc gia thành viên nên được trao quyền để sử dụng vũ lực ngăn chặn đòn phủ đầu bất kỳ âm mưu đen tối nào trước khi những quốc gia không phải là thành viên kịp thực hiện chúng."
 resolution_mutualdefense_renegade_containment_tooltip:1 "Các đế chế đã kích hoạt §YChiến tranh Không giới hạn§! sẽ nhận được lý do chiến tranh tổng lực §YPhủ đầu§!, có thể sử dụng nhắm vào các quốc gia không phải là thành viên của [global_event_country.GetGalCommunityOrGalImperium]."

 # Rules of War

 resolution_category_rulesofwar:0 "Quy tắc Chiến tranh"

 resolution_rulesofwar_repeal_1:0 "§RBãi bỏ $resolution_rulesofwar_guardian_angels$§!"
 resolution_rulesofwar_repeal_1_desc:0 "Chân lý thuộc về kẻ mạnh. Việc lấp liếm sự tàn khốc của chiến tranh bằng cách đưa ra những hạn chế đối với nó chỉ là hành động tự lừa dối bản thân. Khi một mối đe dọa thực sự xuất hiện, chúng ta nên bãi bỏ những đạo luật này và dỡ bỏ các hạn chế."
 resolution_rulesofwar_repeal_1_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_rulesofwar_guardian_angels$§!."

