 galcom_2_nay:0 "Chúng ta sẽ không ủng hộ việc thành lập Cộng Đồng Thiên Hà."
 action.1.desc_89:0 "Các bạn... các bạn là [From.GetSpeciesNamePlural] sao? Thật là không thể tin nổi... Các bạn chắc hẳn là những người sống sót từ Dự án Ulysses. Mọi người trên Trái đất đều cho rằng tất cả các con tàu viễn chinh đều đã mất tích, nhưng rõ ràng là có ít nhất một chiếc đã thành công! Có phải ý của các bạn là tổ tiên của các bạn đã ở trên tàu \"Chrysanthemum\" không?\n\nChắc chắn mọi chuyện không hề dễ dàng chút nào, nhưng có vẻ như các bạn đã làm rất tốt. Thay mặt cho người dân Trái đất và các thành viên của Đại Hội đồng Liên Hợp Quốc, tôi xin được gửi đến những người anh chị em của chúng tôi trên [Root.GetName] một bàn tay hữu nghị.\n\nHãy cùng nhau hợp tác, để xây dựng một tương lai tươi sáng hơn cho toàn thể nhân loại."
 action.1.desc_90:0 "[From.GetName]... Đã bao nhiêu năm trôi qua rồi, vậy mà Liên Hợp Quốc vẫn có thể duy trì được quyền lực của mình sao? Các bạn phải tha thứ cho chúng tôi - khi tổ tiên của chúng tôi rời khỏi Trái đất trên chiếc tàu viễn chinh Ulysses, Trái đất đã trải qua một số cuộc bạo loạn. Rất nhiều người cho rằng các bạn đã tự hủy diệt chính mình trong một cuộc chiến tranh thế giới khác, hoặc có thể đã trở thành nạn nhân của một cuộc xâm lược từ người ngoài hành tinh.\n\nTất nhiên, trông các bạn có vẻ mạnh mẽ và có năng lực hơn rất nhiều so với những nhà chức trách tham nhũng trên Trái đất của chúng tôi vào thời điểm đó. Tổ tiên của chúng tôi đã xây dựng nên [contact_empire.GetName] từ con số không. Chúng tôi sẽ bảo vệ nó cho đến hơi thở cuối cùng. Hãy xem thử liệu các bạn có xứng đáng để chúng tôi dành cho sự tôn trọng hay không."
 action.1.desc_91:0 "A, sự tạo hóa của vũ trụ thật kỳ diệu làm sao... Sau bao nhiêu chuyện đã xảy ra, cuối cùng chúng ta cũng lại gặp nhau. Nhưng xin đừng lo lắng, $NAME_MSI_country$ sẽ đại diện cho hội đồng quản trị, luôn sẵn sàng hỗ trợ các bạn một lần nữa.\n\nTất nhiên, chúng ta không thể cứ thế mà phớt lờ những tổn thất mà tài sản của công ty đã phải gánh chịu. Nếu các đại diện thu nợ của chúng tôi vẫn chưa liên lạc với các bạn, thì chắc chắn họ sẽ sớm làm như vậy thôi. Hy vọng rằng chúng ta có thể đạt được một giải pháp hòa bình.\n\nChúng ta đang sống trong một thời đại vô cùng thú vị, phải không nào? Xin cho phép tôi được là người đầu tiên chúc mừng người dân của các bạn đã đạt được những tiến bộ không thể tin nổi. Chúng tôi đang rất mong đợi được kiểm chứng sự trưởng thành của các bạn."
 action.1.desc_92:0 "A, những tài sản cũ của chúng tôi... Thật là một niềm vui khôn tả khi được gặp lại các người. Xin cho phép tôi được thay mặt cho hội đồng quản trị của $NAME_MSI_country$, là người đầu tiên gửi lời chúc mừng đến các người và... người dân của các người về những tiến bộ mà các người đã đạt được. Với một xuất thân thấp hèn như vậy mà có thể đạt được những thành tựu như ngày hôm nay, quả thực là một điều không hề dễ dàng gì.\n\nNếu các người có bất kỳ nhu cầu nào, xin đừng ngần ngại, hãy cứ liên hệ với chúng tôi. Chúng tôi không phải là những kẻ thù dai đâu. Suy cho cùng thì, những xã hội kém phát triển không thể thực sự chịu trách nhiệm cho những hành động của mình. Về phương diện này, các người chỉ giống như những đứa trẻ mà thôi."
 action.1.desc_93:0 "Thay mặt cho hội đồng quản trị của $NAME_MSI_country$, xin hãy nhận lấy những lời chào hỏi chân thành nhất của chúng tôi. Tại $NAME_MSI_country_initials$, chúng tôi tin tưởng rằng việc tăng cường năng lực cho các nền văn minh khác thông qua công nghệ và thương mại là một điều hoàn toàn có thể làm được. Suy cho cùng thì, mọi dạng sống có tình cảm đều có quyền thực hiện những ước mơ của riêng mình.\n\nCho đến nay, chúng tôi đã cung cấp tri thức cho hàng chục hành tinh ở giai đoạn trước thời đại du hành siêu quang tốc, và chúng tôi đang có kế hoạch sẽ tăng con số này lên 40% trong vòng mười năm tới. Chúng tôi cũng cung cấp các khoản hỗ trợ tài chính và các dịch vụ cung cấp lao động theo hợp đồng vô cùng chuyên nghiệp, nhằm hỗ trợ cho vô số các đế chế không gian trong dải ngân hà.\n\nNếu các bạn có bất kỳ nhu cầu nào, xin đừng ngần ngại, hãy cứ liên hệ với chúng tôi. Chúng tôi đang rất mong đợi được hợp tác kinh doanh cùng với các bạn!"
 action.1.desc_99: "A, xin chào...\n\nÔi trời ơi! Các bạn đến từ Hệ Mặt Trời! Chúng tôi đã suy đoán về sự tồn tại của giống loài các bạn từ rất lâu rồi. Xin hãy tha thứ cho sự thất lễ của tôi - Tôi ở đây là để đại diện cho [contact_empire.GetName]; dựa trên những dấu hiệu DNA còn lưu lại trong cơ thể của chúng ta, chúng ta chính là những người anh em họ đã bị thất lạc từ hàng trăm triệu năm trước. Tổ tiên của chúng ta đã từng cùng nhau tắm mình dưới một ánh nắng mặt trời, nhưng một thảm họa thời cổ đại đã ném chúng ta vào không gian giữa các vì sao. Giờ đây, khi chúng ta đã được đoàn tụ, đây chính là lúc để chúng ta cùng nhau ôn lại những chuyện cũ trong hàng trăm triệu năm qua."
 action.1.desc_100: "Gặp gỡ các bạn giống như đang nhìn vào một chiếc gương xa lạ... Các bạn đang muốn nói rằng, từ rất lâu trước khi Trái đất và Mặt trăng được hình thành, chúng ta đã từng có chung một tổ tiên? Quả thực là đã có rất nhiều nhà khoa học xây dựng các lý thuyết về sự tồn tại của Theia, nhưng dù sao đi nữa, chúng tôi rất vui mừng được gặp các bạn. Là những người anh em họ, chúng tôi mong muốn có thể thiết lập một mối quan hệ đối tác thịnh vượng. Trong lúc chờ đợi, xin hãy nhận lấy món quà là tảng đá mặt trăng này: Có lẽ nó đang ẩn chứa những dấu vết về tổ tiên của các bạn."
