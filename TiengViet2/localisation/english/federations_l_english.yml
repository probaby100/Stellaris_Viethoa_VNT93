 origin_mechanists:0 "$civic_mechanists$"
 origin_mechanists_desc:0 "Nền văn minh này đã say mê ý tưởng về những người máy tự động bằng kim loại từ thuở sơ khai của thời đại hơi nước. Mặc dù nhiều người từng cho rằng điều đó là bất khả thi, nhưng những người máy thực sự đầu tiên đã rời khỏi dây chuyền lắp ráp từ rất lâu trước khi các chuyến bay vào vũ trụ đầu tiên diễn ra."
 origin_tooltip_mechanists_effects:3 "- ['concept_robots', £mod_planet_jobs_robotic_produces_mult£ Robot] £pop£ §HDân Số§!: 800$TABBED_NEW_LINE$- Đặc tính Cơ khí: ['concept_adaptive_frames']$NEW_LINE$- Thế giới mẹ: ['concept_robot_assembly_plant',£building£ Nhà Máy Lắp Ráp Robot]$NEW_LINE$- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['concept_powered_exoskeletons', £engineering_research£ $tech_powered_exoskeletons$]$TABBED_NEW_LINE$- ['concept_robotic_workers', £engineering_research£ $tech_robotic_workers$]$NEW_LINE$- $GUARANTEED_RESEARCH_OPTION_STRING$ ['concept_robomodding', £engineering_research£ $tech_robomodding$]"
 origin_syncretic_evolution:0 "$civic_syncretic_evolution$"
 origin_syncretic_evolution_desc:0 "Một chủng loài thứ hai đã hình thành nên một phần không thể tách rời của nền văn minh này. Chúng to lớn, cường tráng, và hầu hết chỉ có trí tuệ tương đương với những đứa trẻ cực kỳ khờ khạo. Những cuộc chiến tranh cổ đại đã loại bỏ đi những xu hướng hung hăng nhất của chúng, khiến chúng ngày nay trở nên khá ngoan ngoãn."
 origin_tooltip_syncretic_evolution_effects: "—£pop£§IDân số hữu cơ§! có đặc điểm ['concept_syncretic_proles']: 2.4K"
 origin_life_seeded:0 "$civic_life_seeded$"
 origin_life_seeded_desc:1 "Quê hương của nền văn minh này giống như một thiên đường, có lẽ được tạo ra dành riêng cho họ."
 origin_tooltip_life_seeded_effects: "—$HOMEWORLD$ ['concept_pc_gaia'] có §IĐặc trưng hành tinh hiếm§! (Quy mô: £planetsize£30)$NEW_LINE$—$SPECIES_TRAITS$['concept_gaia_preference']"
 origin_tooltip_life_seeded_negative_effects: "—$NO_GUARANTEED_WORLDS$"
 origin_post_apocalyptic:0 "$civic_post_apocalyptic$"
 origin_life_seeded_ai_only: "$origin_life_seeded$"
 origin_life_seeded_ai_only_desc: "$origin_life_seeded_desc$"
 origin_post_apocalyptic_desc:1 "Trải qua thử thách của ngọn lửa hạt nhân, nền văn minh này từng đối mặt với thảm họa diệt vong toàn diện - để rồi cuối cùng vẫn sống sót trở về từ cõi chết. Mặc dù bị tàn phá nhưng vẫn đoàn kết một lòng, họ đã tái thiết lại nền văn minh trên đống tro tàn của thế giới cũ."
 origin_tooltip_post_apocalyptic_effects: "—$HOMEWORLD$['concept_pc_nuked']$NEW_LINE$—$SPECIES_TRAITS$['concept_survivor']"
 origin_post_apocalyptic_machines: "Máy lang thang nhiễm xạ"
 origin_post_apocalyptic_machines_desc: "Sau một thảm họa hạt nhân tàn khốc, những cỗ máy này trở thành những kẻ sống sót duy nhất của một nền văn minh từng vô cùng thịnh vượng. Thông qua việc tiếp tục thực hiện các mục tiêu ban đầu của mình, chúng đã dần dần xây dựng lại một xã hội mới từ đống tro tàn khắc nghiệt của thế giới cũ."
 origin_tooltip_post_apocalyptic_machines_effects: "—$HOMEWORLD$['concept_pc_nuked']$NEW_LINE$—$SPECIES_TRAITS$['concept_robot_survivor']"

 origin_shattered_ring:0 "Vành đai Vỡ nát"
 origin_shattered_ring_desc:1 "Nền văn minh này sinh sống trên một §HThế giới Vành đai§! do những bậc tiền bối vô danh xây dựng. Một khi được thấu hiểu và sửa chữa hoàn thiện, họ sẽ có được một sức mạnh to lớn."
 origin_tooltip_shattered_ring_effects:3 "—$HOMEWORLD$['concept_pc_shattered_ring']$NEW_LINE$—['concept_guaranteed_colonies']: Thay thế bằng các phân đoạn thế giới vành đai có thể thuộc địa hóa, các phân đoạn này chứa £blocker£§RChướng ngại vật§!, làm giảm £mod_pop_environment_tolerance£Độ thích nghi$NEW_LINE$—$SPECIES_TRAITS$['concept_ring_preference']."
 origin_tooltip_shattered_ring_effects_lithoid:0 "§R-Cảnh báo: Nguồn gốc này sẽ rất khó nhằn đối với loài sinh vật đá do sự khan hiếm khoáng sản.§!$NEW_LINE$$origin_tooltip_shattered_ring_effects$"

 origin_remnants:0 "Tàn dư Phục quốc"
 origin_remnants_desc:1 "Nền văn minh này đã từng xưng hùng xưng bá trong hư không, nắm quyền kiểm soát một vùng sao rộng lớn. Dù cuối cùng phải chịu cảnh lụi tàn và gần như bị hủy diệt hoàn toàn, nhưng sau một khoảng thời gian dài đằng đẵng chìm trong túng quẫn, họ đang trên đà trỗi dậy một lần nữa giữa những vì sao."
 origin_tooltip_remnants_effects:5 "—$HOMEWORLD$$TABBED_NEW_LINE$—['concept_pc_relic'] (Quy mô: £planetsize£22)$TABBED_NEW_LINE$—['concept_ruined_arcology', $concept_ruined_arcology$]: +6[GetRemnantAncientRelicEffect]"
