 origins_traditions_tech_key: "Nguồn gốc, Công nghệ và Truyền thống"
 major_celestial_objects_key: "Thiên thể chính"
 minor_celestial_objects_key: "Thiên thể phụ"
 mod_district_jobs_mult: "Việc làm tạo ra bởi Quy hoạch"
 d_arcane_replicator:0 "Máy Nhân bản Bí ẩn"
 d_arcane_replicator_desc:0 "Cỗ máy cổ đại này nằm ẩn sâu bên trong trạm cư trú, được cấy vào bên trong lõi phản ứng chính và hấp thụ năng lượng từ đó. Đây là một di vật do những người thợ xây dựng ban đầu của trạm cư trú này để lại, công nghệ nhân bản vật chất của nó đối với chúng ta mà nói là hoàn toàn không thể thấu hiểu được."
 START_SCREEN_VOID_DWELLERS:3 "Đối với hầu hết các sinh vật, môi trường chân không trong không gian là một điều kiện khắc nghiệt đòi hỏi phải được chinh phục hoặc khắc phục một cách chuyên biệt. Nhưng đối với chúng ta, đó chính là quê hương.\n\nTrong hàng ngàn năm, giống loài của chúng ta đã cư ngụ trên một số trạm không gian xoay quanh các vì sao trong hệ thống ba ngôi sao của chúng ta. Không ai biết được rốt cuộc là tổ tiên của chúng ta hay một thế lực nào khác đã xây dựng nên những trạm không gian này.\n\nMột số người phỏng đoán rằng những tàn tích hành tinh vỡ vụn xoay quanh ngôi sao cùng với chúng ta chính là quê hương đã mất của giống loài chúng ta, nhưng sự thật vẫn còn là một màn sương mù mờ ảo.\n\nKể từ khi chúng ta phát minh ra, hay có thể nói là khám phá ra khả năng du hành không gian có thể vượt qua khoảng không trống rỗng giữa các trạm không gian thì mới chỉ vài thế kỷ trôi qua. Sự hoài nghi và ngờ vực dần dần nhường chỗ cho thương mại và sự hợp tác lẫn nhau. Cùng với việc con tàu đầu tiên được trang bị [GetStartingDrivePlural] được hoàn thành, những trạm cư trú của chúng ta đã được đoàn kết lại dưới cùng một ngọn cờ."
 START_SCREEN_VOID_DWELLERS_SOL:3 "Đối với hầu hết các sinh vật, môi trường chân không trong không gian không thích hợp cho sự sống, và cần phải được chinh phục hoặc khắc phục một cách chuyên biệt. Nhưng đối với chúng ta, không gian trống rỗng chính là quê hương.\n\nTrong hàng ngàn năm, giống loài của chúng ta đã lần lượt cư ngụ trên một vài trạm không gian xoay quanh ngôi sao của chúng ta. Không ai biết được rốt cuộc là những người tiên phong của chúng ta hay một thế lực nào khác đã xây dựng nên những trạm không gian này.\n\nMặc dù cấu trúc cơ thể của chúng ta gợi ý rằng giống loài của chúng ta bắt nguồn từ một hành tinh, nhưng những ghi chép lịch sử lại hoàn toàn không hề đề cập đến điều này. Một số người suy đoán rằng hành tinh hoang mạc độc hại được tìm thấy bên dưới một trong những trạm không gian của chúng ta chính là quê hương đã mất của giống loài chúng ta, nhưng sự thật có lẽ sẽ mãi mãi không ai biết được.\n\nChỉ mới vài thế kỷ trước, chúng ta mới phát minh ra phương thức du hành không gian đủ để di chuyển qua lại giữa các trạm không gian của mình - hoặc cũng có thể gọi là tái phát minh, tùy thuộc vào việc bạn hỏi ai. Sự hoài nghi và ngờ vực dần dần nhường chỗ cho thương mại và sự hợp tác lẫn nhau. Vào thời điểm [GetStartingDrive] đầu tiên của chúng ta được phát minh ra, những trạm cư trú này đã được đoàn kết lại dưới cùng một ngọn cờ."
 START_SCREEN_VOID_DWELLERS_HIVE: "Đối với hầu hết các sinh vật, môi trường chân không trong không gian không thích hợp cho sự sống, và cần phải được chinh phục hoặc khắc phục một cách chuyên biệt. Nhưng đối với chúng ta, không gian trống rỗng chính là quê hương.\n\nTrong hàng ngàn năm, ý thức thống nhất của chúng ta đã cư trú trên một vài trạm không gian, mỗi trạm đều xoay quanh một ngôi sao trong hệ thống ba ngôi sao. Không ai biết được rốt cuộc là tổ tiên của chúng ta hay một thế lực nào khác đã xây dựng nên những trạm không gian này.\n\nMặc dù cấu trúc sinh học của chúng ta gợi ý rằng giống loài của chúng ta bắt nguồn từ một hành tinh, nhưng những ký ức chung lại không thể cung cấp bất kỳ câu trả lời nào. Chúng ta suy đoán rằng những tàn tích hành tinh vỡ vụn được tìm thấy bên dưới một trong những trạm không gian của chúng ta chính là quê hương đã mất của giống loài chúng ta, nhưng sự thật có lẽ sẽ mãi mãi không ai biết được.\n\nSau khi khám phá lại được công nghệ du hành không gian, những tổ đàn bị chia cắt này cuối cùng cũng đã có thể tái hợp lại với nhau. Cho đến khi [GetStartingDrive] đầu tiên của chúng ta được hoàn thành, cuối cùng chúng ta cũng đã có thể dung hợp thành một thể thống nhất."
 START_SCREEN_VOID_DWELLERS_HIVE_SOL: "Đối với hầu hết các sinh vật, môi trường chân không trong không gian không thích hợp cho sự sống, và cần phải được chinh phục hoặc khắc phục một cách chuyên biệt. Nhưng đối với chúng ta, không gian trống rỗng chính là quê hương.\n\nTrong hàng ngàn năm, ý thức thống nhất của chúng ta đã bị chia cắt trong một vài trạm không gian, mỗi trạm đều xoay quanh một hành tinh khác nhau. Không ai biết được rốt cuộc là tổ tiên của chúng ta hay một thế lực nào khác đã xây dựng nên những trạm không gian này.\n\nMặc dù cấu trúc sinh học của chúng ta gợi ý rằng giống loài của chúng ta bắt nguồn từ một hành tinh, nhưng những ký ức chung lại không thể cung cấp bất kỳ câu trả lời nào. Chúng ta suy đoán rằng hành tinh hoang mạc độc hại được tìm thấy bên dưới một trong những trạm không gian của chúng ta chính là quê hương đã mất của giống loài chúng ta, nhưng sự thật có lẽ sẽ mãi mãi không ai biết được.\n\nSau khi khám phá lại được công nghệ du hành không gian, những tổ đàn bị chia cắt này cuối cùng cũng đã có thể tái hợp lại với nhau. Cho đến khi [GetStartingDrive] đầu tiên của chúng ta được hoàn thành, cuối cùng chúng ta cũng đã có thể dung hợp thành một thể thống nhất."
 START_SCREEN_VOID_DWELLERS_MACHINE: "Đối với hầu hết các sinh vật, môi trường chân không trong không gian không thích hợp cho sự sống, và cần phải được chinh phục hoặc khắc phục một cách chuyên biệt. Nhưng đối với chúng ta, không gian trống rỗng chính là quê hương.\n\nTrong hàng ngàn năm, chúng ta vẫn luôn cư trú trên một vài trạm không gian trong hệ thống ba ngôi sao của chúng ta. Không ai biết được rốt cuộc là do chúng ta đã xây dựng nên chúng, hay chúng ta chính là những tạo vật bị những người thợ xây dựng chúng vứt bỏ. $START_SCREEN_VOID_DWELLERS_MACHINE_END$"
 START_SCREEN_VOID_DWELLERS_MACHINE_SOL: "Đối với hầu hết các sinh vật, môi trường chân không trong không gian không thích hợp cho sự sống, và cần phải được chinh phục hoặc khắc phục một cách chuyên biệt. Nhưng đối với chúng ta, không gian trống rỗng chính là quê hương.\n\nTrong hàng ngàn năm, chúng ta vẫn luôn cư trú trên một vài trạm không gian trong hệ sao quê hương của chúng ta. Không ai biết được rốt cuộc là do chúng ta đã xây dựng nên chúng, hay chúng ta chính là những tạo vật bị những người thợ xây dựng chúng vứt bỏ. $START_SCREEN_VOID_DWELLERS_MACHINE_END$"
 START_SCREEN_VOID_DWELLERS_MACHINE_END: "\n\nThành phần cấu tạo vật chất của chúng ta cho thấy thiết kế của chúng ta bắt nguồn từ một hành tinh, nhưng trong kho dữ liệu của chúng ta không hề có bất kỳ câu trả lời nào. Chỉ có thể đưa ra giả định rằng vật thể hành tinh bị vỡ nát nằm bên dưới trạm không gian của chúng ta chính là quê hương đã mất của nền văn minh chúng ta.\n\nBất kể sự tồn tại của nền văn minh không gian của chúng ta mang ý nghĩa gì, việc phát minh ra [GetStartingDrive] đã làm thay đổi tất cả. Giờ đây, chúng ta đã sẵn sàng để chinh phục chính bản thân không gian trống rỗng này."
