 #Relic Rails
 peeyeps_legacy:0 "Di Sản Của Peeyep"
 peeyeps_legacy_desc:0 "Hệ thống đường sắt cổ đại khổng lồ mới được tái khám phá này đã thổi bùng lên ngọn lửa trí tưởng tượng của các nhà nghiên cứu của chúng ta."

 #Kept Grounds
 pm_wenkwort_gardens:0 "Khu Vườn Wenkwort"
 pm_wenkwort_gardens_desc:0 "Có những dấu hiệu cho thấy hệ sinh thái của hành tinh này đã được thiết kế một cách có chủ đích, được cấy ghép vào đó những lý tưởng sâu sắc và lãng mạn."
 pm_wenkwort_zen:0 "Hành Tinh Thiền Định"
 pm_wenkwort_zen_desc:0 "Những gợn sóng khổng lồ xuất hiện trên tầng đất phong hóa ở đây. Bất kể chúng có nguồn gốc từ đâu, chúng đều đang tỏa ra một nguồn sức mạnh khiến cho con người cảm thấy tĩnh tâm."
 pm_wenkwort_custodian:0 "Người Giám Hộ Wenkwort"
 pm_wenkwort_custodian_desc:0 "Căn cứ theo chỉ thị đến từ $NAME_Gardeners$, mức độ công nghiệp hóa của hành tinh thực vật này đã bị hạn chế một cách nghiêm ngặt."

