 building_embassy:0 "Tòa Đại sứ quán"
 building_embassy_desc:0 "Tòa nhà này là trái tim trong các hoạt động ngoại giao của đế chế.\n\nDo cần trao đổi sát sao với chính quyền, công trình này chỉ có thể được xây dựng ở thủ đô của chúng ta."
 building_grand_embassy:0 "Tòa Đại sứ quán Đồ sộ"
 building_grand_embassy_desc:0 "Khu phức hợp này được thiết kế để khiến người xem phải choáng ngợp, từ đó dễ dàng nhượng bộ hơn trên bàn đàm phán.\n\nDo cần trao đổi sát sao với chính quyền, công trình này chỉ có thể được xây dựng ở thủ đô của chúng ta."

 building_corporate_embassy:0 "Đại sứ quán Doanh nghiệp"
 building_corporate_embassy_desc:0 "Ngoại giao, thực chất chỉ là một kiểu quảng cáo coi các chính quyền khác như khách hàng. Cơ quan này phân tích phong tục tập quán địa phương để định hướng hiệu quả hơn cho các nỗ lực của chúng ta."
 building_disinformation_center:0 "Trung tâm Tung Tin giả"
 building_disinformation_center_desc:0 "Bằng cách uốn nắn câu chữ trong các chiến dịch tuyên truyền, chúng ta có thể thao túng dư luận, áp đặt góc nhìn về sự thật của mình lên đám đông."

