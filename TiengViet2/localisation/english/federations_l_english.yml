 fedel.16.intro:0 "Cuộc chiến đẫm máu trên đấu trường đã đi đến hồi kết, [winning_leader.GetRulerTitle] §H[winning_leader.GetRegnalName]§! là người duy nhất vượt qua được toàn bộ trận đấu trường sinh tử này. §H[winning_country.GetName]§! sẽ lãnh đạo [Root.GetAllianceName] trong nhiệm kỳ tiếp theo. Khi rời khỏi đấu trường, người chiến thắng đã phát biểu như sau:"
 fedel.16.1:1 "Nơi này... nơi này [Root.GetBloodType] chảy thành sông. Tôi đã làm những chuyện gì thế này?"
 fedel.16.2:0 "Kết thúc rồi sao? Vậy... vậy có nghĩa là tôi đã chiến thắng rồi phải không?"
 fedel.16.3:0 "Những tiếng la hét thảm thiết của họ... Tôi, tôi vẫn còn nghe thấy văng vẳng bên tai."
 fedel.16.4:0 "Cuối cùng cũng kết thúc rồi... Cuối cùng cũng kết thúc rồi... Cuối cùng cũng kết thúc rồi..."
 fedel.16.5:0 "Tôi cảm thấy buồn nôn quá."
 fedel.16.6:0 "Nói thật nhé, trước đây tôi không hề nghĩ rằng mình lại có bản lĩnh này."
 fedel.16.7:0 "Chúng ta đừng bao giờ nhắc lại chuyện này nữa."
 fedel.16.8:0 "Chắc chắn phải có một cách nào đó tốt hơn để quyết định xem ai mới là người có đủ tư cách lãnh đạo..."
 fedel.16.9:0 "Thật là một sự lãng phí vô ích."
 fedel.16.10:0 "Tuyệt đối không bao giờ được lãng quên những người đã bỏ mạng tại đây ngày hôm nay."
 fedel.16.11:0 "Hãy để mọi chuyện lại phía sau, và cùng nhau hướng tới tương lai."
 fedel.16.12:0 "Quả là một thể chế dã man, nhưng tôi cũng chỉ làm những gì cần phải làm,"
 fedel.16.13:0 "Cuộc thảm sát này chẳng có gì vẻ vang cả."
 fedel.16.14:0 "Đây chẳng qua chỉ là một vấn đề về mặt chiến thuật."
 fedel.16.15:0 "Đó là một trận quyết đấu rất hay. Không ai có thể phủ nhận điều này."
 fedel.16.16:0 "Họ đã chiến đấu một cách vinh quang. Tôi chẳng nhận được bất kỳ niềm vui nào từ cái chết của họ."
 fedel.16.17:0 "Bây giờ ai mới là tên hề đây? Hả?"
 fedel.16.18:0 "Cầu mong cho những người đã bị tôi hạ sát sẽ tìm được sự bình yên ở thế giới bên kia."
 fedel.16.19:0 "Tất cả những người đã bị tôi hạ sát đều dũng cảm đối mặt với cái chết. Ngoại trừ một người."
 fedel.16.20:0 "Tôi không hề hối hận một chút nào."
 fedel.16.21:0 "Quả thực, chuyện này chỉ có thể được giải quyết bằng một cách duy nhất."
 fedel.16.22:0 "Đã kết thúc rồi sao?"
 fedel.16.23:0 "Kết quả đã được định sẵn từ trước rồi."
 fedel.16.24:0 "Mọi thứ trong cuộc đời tôi đều đang dẫn dắt tôi làm chuyện này."
 fedel.16.25:0 "Thật là một vinh quang. Tôi sẽ trân trọng ký ức này."
 fedel.16.26:0 "Những người khác quá yếu đuối. Còn tôi mới là kẻ mạnh."
 fedel.16.27:0 "Chỉ khi đánh bại được Shaggoth mới có cơ hội giành chiến thắng."
 fedel.16.28:0 "Những người khác chắc chắn là một đám ngốc nghếch thì mới bước vào đấu trường này cùng với tôi."
 fedel.16.29:0 "Mọi chuyện đều diễn ra đúng như những gì tôi đã dự liệu."
 fedel.16.30:0 "Đúng như dự đoán của tôi, không một ai có thể sánh ngang với sức mạnh tâm linh của tôi."
 fedel.16.31.organic: "Tôi chỉ cần dùng suy nghĩ là đã nướng chín người khác rồi."
 fedel.16.31.machine: "Tôi chỉ cần dùng bộ xử lý thần kinh tâm linh là đã nướng chín được các đối thủ rồi."
 fedel.16.32.organic: "Trận chiến này chẳng có gì đáng để bận tâm. Những nỗi kinh hoàng mà tôi phải đối mặt trong Hư Cảnh còn khủng khiếp hơn thế này nhiều."
 fedel.16.32.machine: "Trận chiến này nếu đem so với sự phức tạp của Hư Cảnh thì chỉ như muối bỏ bể."
 fedel.16.33:0 "Đó là một trận chiến vô cùng khó khăn. Tôi phải thay thế một vài bộ phận cơ thể bằng các thiết bị bán tự động được cường hóa."
 fedel.16.34:0 "Các bộ phận bán tự động được cấy ghép của tôi không hề vi phạm luật lệ của đấu trường."
 fedel.16.35:0 "Nếu không phải vì họ ép buộc tôi phải tháo gỡ đạn của súng máy tên lửa tích hợp, thì trận chiến này đã có thể kết thúc nhanh hơn."
 fedel.16.36:0 "Tất cả mục tiêu đã bị tiêu diệt. Giao thức tác chiến đã ngừng hoạt động."
 fedel.16.37:0 "Bị tổn hại nhẹ. Đang tiến hành chạy chương trình tự kiểm tra bên trong."
 fedel.16.38:0 "Nhiệm vụ thành công. Đã bảo đảm quyền lãnh đạo Liên bang."
 fedel.16.39:0 "Tôi là nhà vô địch được lựa chọn bởi Hư Cảnh. Tôi được sinh ra để trở thành một nhà lãnh đạo."
 fedel.16.40:0 "Tôi đã chán ngấy với việc chém giết rồi. Chúng ta hãy mau chóng làm cho xong các thủ tục đi."
 fedel.16.41:0 "Việc hạ sát những kẻ không hề có khả năng phản kháng chẳng mang lại niềm vui nào cả, nhưng tôi buộc phải làm như vậy."
 fedel.16.a:0 "Thắng bại đã phân định rõ ràng."

 fedel.501.name:0 "Trận Chiến Tâm Linh"
 fedel.501.1.desc:0 "$fedel.501.1$\n\n$fedel.501.2$"
 fedel.501.2.desc:0 "$fedel.501.1$\n\n$fedel.501.3$"
 fedel.501.3.desc:0 "$fedel.501.1$"
 fedel.501.4.desc:0 "$fedel.501.1$\n\n$fedel.501.4$"
 fedel.501.1:0 "Khi thời điểm để quyết định người lãnh đạo tiếp theo của [Root.GetAllianceName] đang ngày càng đến gần, các linh thể trong §HHư Cảnh§! cũng đang ngày càng trở nên bồn chồn và kích động. Đã đến lúc các tuyển thủ [GetPsychicNounPlural] tiềm năng nhất của các quốc gia thành viên lên đường đến [fed_leader.Capital.GetName], cũng chính là thủ đô của chủ tịch liên bang hiện tại. Tại đó, các tuyển thủ tâm linh sẽ triển khai một trận chiến, cho đến khi người mạnh nhất giành được chiến thắng."
 fedel.501.2:0 "Để gia tăng thêm sức mạnh cho các tuyển thủ tâm linh của chính mình, chúng ta có thể tận dụng nguồn cung cấp Zro của chúng ta. Việc này sẽ mang lại cho chúng ta thêm lợi thế trong trận chiến tâm linh."
 fedel.501.3:0 "Thật không may, chúng ta không thể tìm đủ số lượng [GetPsychicNounPlural] để tham gia, nên đành phải bỏ cuộc."
 fedel.501.4:0 "Chúng ta không phải là một quốc gia độc lập, vì vậy rất tiếc là chúng ta đã bị cấm tham gia."
 fedel.501.a:0 "Chúng ta có thể cung cấp một lượng nhỏ Zro."
 fedel.501.b:0 "Cung cấp một lượng Zro vừa đủ cho các tuyển thủ [GetPsychicNounPlural] của chúng ta."
 fedel.501.c:0 "Bọn họ muốn bao nhiêu thì cứ cung cấp bấy nhiêu cho các tuyển thủ [GetPsychicNounPlural]."
 fedel.501.d:0 "Không cung cấp Zro. Dù không có sự trợ giúp của Zro, chúng ta vẫn sẽ giành được chiến thắng."
 fedel.501.e:0 "Có lẽ đành hẹn lại lần sau vậy."
 psionic_battle_begin:0 "Trận chiến tâm linh sắp sửa bắt đầu."

 fedel.510.name:0 "Giành Chiến Thắng Trong Trận Chiến Tâm Linh"
 fedel.510.1.desc.organic: "$fedel.510.1.organic$\n\n$fedel.510.2$"
 fedel.510.1.desc.machine: "$fedel.510.1.machine$\n\n$fedel.510.2$"
 fedel.510.2.desc.organic: "$fedel.510.1.organic$\n\n$fedel.510.3$"
 fedel.510.2.desc.machine: "$fedel.510.1.machine$\n\n$fedel.510.3$"
 fedel.510.3.desc:0 "Vào ngày mà các [GetPsychicNounPlural] từ khắp mọi nơi trong [Root.GetAllianceName] lẽ ra phải tập trung tại [fed_leader.Capital.GetName], một tình huống nằm ngoài dự liệu đã xảy ra. Rốt cuộc thì chúng ta lại là quốc gia thành viên duy nhất có thể tập hợp đủ số lượng [GetPsychicNounPlural] để tham gia trận chiến.\n\nVì không có bất kỳ ai khác có thể tham chiến, nên chiến thắng nghiễm nhiên thuộc về chúng ta."
 fedel.510.1.organic: "Khi các [GetPsychicNounPlural] tập hợp lại để chuẩn bị cho trận chiến, một bầu không khí kinh hoàng rõ rệt đã bao trùm khắp [fed_leader.Capital.GetName]. Có những báo cáo cho biết những cơn bão sấm sét đã xuất hiện một cách bất ngờ và vô cùng dữ dội, những cái bóng được sinh ra từ hư không, và những nhiễu loạn sóng âm không rõ nguyên nhân đã hiện diện một cách kỳ lạ."
 fedel.510.1.machine: "Khi các [GetPsychicNounPlural] tập hợp lại để chuẩn bị cho trận chiến, một sự bất ổn đã bao trùm lấy [fed_leader.Capital.GetName]. Có những báo cáo cho biết những cơn bão sấm sét đã xuất hiện một cách bất ngờ và vô cùng dữ dội, những cái bóng được sinh ra từ hư không, và những âm thanh không rõ nguyên nhân đã hiện diện một cách kỳ lạ."
 fedel.510.2:0 "Trận chiến đã bắt đầu. Cuộc đọ sức diễn ra vô cùng khốc liệt, các đội không hề nhượng bộ nhau dù chỉ một bước. Trận chiến cuối cùng đã trở thành một bài kiểm tra sức bền, chỉ cần một khoảnh khắc mất tập trung là đã đủ để bị trục xuất vĩnh viễn khỏi §HHư Cảnh§!. Các [GetPsychicNounPlural] của chúng ta đã chứng minh được rằng họ là những người được rèn luyện bài bản nhất, đúng như những gì chúng ta đã biết. Chiến thắng đã thuộc về chúng ta."
 fedel.510.3:0 "Trận chiến đã bắt đầu. Không một đội nào khác có thể trở thành đối thủ của chúng ta. Chúng ta đã truy lùng gắt gao từng người một, và ném bản thể tâm linh của những người có khả năng ngoại cảm của các quốc gia khác cho §HHư Cảnh§! đang đói khát. Chỉ còn lại những cái xác lạnh lẽo và bất tỉnh. Chiến thắng đã thuộc về chúng ta."
 fedel.510.a:0 "Hư Cảnh đã ban phước lành cho chúng ta ngày hôm nay."

 fedel.515.name:0 "Thất Bại Trong Trận Chiến Tâm Linh"
 fedel.515.1.desc.organic: "$fedel.510.1.organic$\n\n$fedel.515.2$\n\n$fedel.515.4$"
 fedel.515.1.desc.machine: "$fedel.510.1.machine$\n\n$fedel.515.2$\n\n$fedel.515.4$"
