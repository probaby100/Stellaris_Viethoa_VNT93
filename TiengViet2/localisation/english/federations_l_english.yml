 galactic_focus_crisis_nanites:4 "Đánh bại Cơn bão Xám"
 galactic_focus_crisis_nanites_desc:0 "Cơn bão Xám là một cuộc khủng hoảng thực sự mà toàn bộ thiên hà đang phải đối mặt, chúng ta phải đoàn kết lại để đánh bại mối đe dọa này."

 galactic_focus_crisis_war_in_heaven:2 "Chấm dứt Chiến tranh trên Thiên đàng"
