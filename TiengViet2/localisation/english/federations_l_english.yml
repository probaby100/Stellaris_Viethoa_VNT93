 fedel.515.4.desc:0 "Khi thời điểm các [GetPsychicNounPlural] từ khắp mọi nơi trong [Root.GetAllianceName] lẽ ra phải tập trung tại [fed_leader.Capital.GetName] đã đến, một tình huống nằm ngoài dự liệu đã xảy ra. §H[winning_country.GetName]§! lại là quốc gia thành viên duy nhất có thể tập hợp đủ số lượng [GetPsychicNounPlural] để tham gia trận chiến.\n\nVì không có bất kỳ ai khác có thể tham chiến, nên chiến thắng đã thuộc về họ."
 fedel.515.2:0 "Trận chiến đã bắt đầu. Các đội lần lượt xếp thành đội hình để giao chiến với nhau, và rồi lần lượt gục ngã. Các [GetPsychicNounPlural] của chúng ta chính là một trong những nhóm đầu tiên bị đánh bại, họ đã hoàn toàn bất lực trước những đợt tấn công dữ dội của đối thủ."
 fedel.515.3.organic: "Trận chiến đã bắt đầu. Khi các đội giao chiến với nhau, các [GetPsychicNounPlural] của chúng ta ban đầu đã có màn thể hiện khá tốt, nhưng cuối cùng vẫn không thể vượt qua được những thử thách to lớn. Trong những tiếng gào thét đau đớn, họ đã vĩnh viễn bị đày đọa xuống những nơi cuồng bạo nhất của §HHư Cảnh§!."
 fedel.515.3.machine: "Trận chiến đã bắt đầu. Khi các đội giao chiến với nhau, các [GetPsychicNounPlural] của chúng ta ban đầu đã có màn thể hiện khá tốt, nhưng cuối cùng vẫn không thể vượt qua được những thử thách to lớn. Cùng với những sự cố hỏng hóc hiếm gặp, họ đã vĩnh viễn bị đày đọa xuống những nơi cuồng bạo nhất của §HHư Cảnh§!."
 fedel.515.4:0 "Sau khi vòng xoáy năng lượng cuối cùng cũng đã lắng xuống, chỉ còn lại những [GetPsychicNounPlural] của §H[winning_country.GetName]§! vẫn đang bám trụ."
 fedel.515.a:0 "Cầu mong cho Hư Cảnh sẽ nuốt chửng bọn họ!"
 psionic_battle_outcome:0 "§H[winning_country.GetName]§! sẽ trở thành chủ tịch liên bang của §H[Root.GetAllianceName]§!."

 origin_no_effect:0 "—Không có hiệu lực"

 origin_common_ground:0 "Vận mệnh Chung"
 origin_common_ground_desc:0 "Nền văn minh này đã thiết lập mối liên hệ với những người láng giềng ngoài hành tinh từ rất sớm. Họ đã cùng nhau chắt lọc sức mạnh từ những khác biệt của nhau, và không lâu sau đó đã đưa ra quyết định sẽ cùng nhau sát cánh để đối mặt với mọi thử thách có thể xảy ra trong tương lai."
 origin_tooltip_common_ground_effects:2 "—Chủ tịch của một ['concept_common_ground_federation'] §Iphi bá quyền§! $federation_origin_end$"
 START_SCREEN_COMMON_GROUND:1 "Nhiều thập kỷ trước, sau khi những tàu thăm dò dưới tốc độ ánh sáng đầu tiên của chúng ta ghé thăm các hệ sao lân cận, chúng ta đã phát hiện ra sự tồn tại của hai nền văn minh ngoài hành tinh hoàn toàn khác biệt ở đó. Bất chấp những khác biệt to lớn về cấu trúc sinh lý của chúng ta, sự thật chẳng mấy chốc đã chứng minh rằng, điểm chung giữa chúng ta còn lớn hơn những bất đồng. Giống hệt như chúng ta, hai nền văn minh ngoài hành tinh này cũng đang dần có được khả năng thực hiện những chuyến du hành giữa các vì sao mang tính thực tiễn.\n\nSự gắn kết đã được hình thành giữa ba nền văn minh của chúng ta, và cuối cùng đã dẫn đến sự ra đời của Liên bang - chúng ta sẽ hợp tác cùng nhau, và khi chúng ta đã sẵn sàng bước ra thế giới rộng lớn bên ngoài, chúng ta sẽ cùng nhau đối mặt với mọi thứ mà chúng ta gặp phải."
 START_SCREEN_COMMON_GROUND_NOMADS: "Vài thập kỷ trước, trên hành trình du mục của mình, chúng ta đã ghé thăm hai hệ sao có cư dân sinh sống—theo sau đó là cuộc tiếp xúc đầu tiên với hai nền văn minh ngoại lai hoàn toàn khác biệt. Dù cấu trúc sinh học giữa các bên có sự khác biệt rất lớn, nhưng chẳng mấy chốc thực tế đã cho thấy điểm chung giữa chúng ta nhiều hơn là bất đồng. Giống như chúng ta, họ cảm nhận được tiếng gọi của vũ trụ và đang đứng trước ngưỡng cửa vươn mình ra các vì sao.\n\nSợi dây liên kết đã hình thành giữa ba nền văn minh chúng ta, và cuối cùng đã khai sinh ra Liên bang—chúng ta sẽ đồng lòng hợp tác, bất kể điều gì đang chờ đợi giữa biển sao, tất cả sẽ luôn kề vai sát cánh đối mặt."
 origin_tooltip_common_ground_npc_effects:1 "-Khi trò chơi bắt đầu, bạn sẽ trở thành một quốc gia thành viên của một §HLiên minh Bá quyền§!, trong liên bang này còn có hai quốc gia thành viên khác"
 federation_origin_end: "\n—['concept_guaranteed_colonies']: Sẽ bị thay thế bởi các quốc gia thành viên trong Liên bang\n—$ADDITIONAL_TECHNOLOGIES_STRING$['technology:tech_federation_code']"
 opinion_common_ground:0 "Vận mệnh Chung"
