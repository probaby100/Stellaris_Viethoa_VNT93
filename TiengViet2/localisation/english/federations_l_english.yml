 resolution_sanctions_military_repeal_1:0 "§RBãi bỏ $resolution_sanctions_military_1$§!"
 resolution_sanctions_military_repeal_1_desc:0 "Việc giới hạn quy mô hải quân đối với hành vi vi phạm Luật Thiên Hà là một đề xuất đầy rủi ro. Chúng ta nên sử dụng các biện pháp khác để đảm bảo sự tuân thủ."
