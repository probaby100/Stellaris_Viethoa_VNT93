 SHIPSET_LABEL: "Bộ tàu"
 SHIPSETS_LABEL: "Các bộ tàu"
 SHIP_GRAPHICS_PREVIEW:0 "Xem trước Phân lớp Tàu"
 SHIP_GRAPHICS_REQUIRED_DLC:0 "Yêu cầu DLC"
 SHIP_GRAPHICS_MISSING_DLC_TOOLTIP:0 "§GNhấp để xem trước các tàu $CULTURE_NAME$§!"
 SHIP_GRAPHICS_CAMERA_TRANSFORM_TOOLTIP:0 "£camera_zoom_in£ Dùng §GCuộn chuột về phía trước§! để phóng to.\n£camera_zoom_out£ Dùng §GCuộn chuột về phía sau§! để thu nhỏ.\n£camera_rotate£ Giữ và kéo §GChuột phải§! trên mô hình tàu để xoay."
 SHIP_GRAPHICS_CORVETTE_DESC:0 "Tàu Hộ Tống là phân lớp tàu chiến quân sự đầu tiên mà các đế chế có thể chế tạo. Chúng nhanh nhẹn, linh hoạt và chi phí thấp."
 SHIP_GRAPHICS_FRIGATE_DESC:0 "Tàu Khu Trục Nhỏ là biến thể tiên tiến của Tàu Hộ Tống, chuyên về phóng ngư lôi. Chúng có thể chậm hơn và dễ bị tổn thương hơn, nhưng có thể tạo ra sức tàn phá khủng khiếp lên các mục tiêu lớn."
 SHIP_GRAPHICS_DESTROYER_DESC:1 "Tàu Khu Trục đánh đổi sự linh hoạt và tốc độ của Tàu Hộ Tống để lấy thêm hỏa lực cùng thân tàu kiên cố hơn."
 SHIP_GRAPHICS_CRUISER_DESC:0 "Tàu Tuần Dương là loại tàu đa năng và bền bỉ, có khả năng vừa chống chịu sát thương vừa giáng đòn hủy diệt."
 SHIP_GRAPHICS_BATTLESHIP_DESC:0 "Thiết Giáp Hạm đắt đỏ nhưng vô cùng uy lực. Với tầm bắn vượt trội, chúng vượt trội trong việc gây tổn hại nặng nề cho đối phương trước khi chúng kịp phản công."
 SHIP_GRAPHICS_TITAN_DESC:1 "Dù bản thân đã sở hữu sức mạnh vô cùng khủng khiếp, Tàu Titan còn có thể sử dụng các năng lực Hào quang để tăng cường sức mạnh cho tàu chiến đồng minh."
 SHIP_GRAPHICS_BIO_TITAN_DESC: "$SHIP_GRAPHICS_TITAN_DESC$"
 SHIP_GRAPHICS_JUGGERNAUT_DESC:1 "Chế tạo một Soái Hạm Công Xưởng là đại công trình đối với bất kỳ đế chế nào. Những con tàu khổng lồ này hoạt động như các xưởng đóng tàu di động kiêm tàu hỗ trợ hạm đội."
 SHIP_GRAPHICS_COLOSSUS_DESC:1 "Những con tàu khổng lồ này không được trang bị để giao chiến với các hạm đội địch, mà sứ mệnh của chúng là xóa sổ toàn bộ các thế giới."
 SHIP_GRAPHICS_OUTPOST_DESC:0 "Tiền đồn là cấp thấp nhất của trạm không gian, hầu như không có chức năng nào ngoài việc đánh dấu quyền sở hữu một hệ sao."
 SHIP_GRAPHICS_STARBASE_CITADEL_DESC:0 "Pháo đài là cấp nâng cấp cao nhất của trạm không gian. Được trang bị hệ thống phòng thủ đồ sộ, Pháo đài là một hạt dẻ cực kỳ khó cắn đối với bất kỳ kẻ thù nào."
 SHIP_GRAPHICS_TRANSPORT_DESC:0 "Tàu Vận tải chở các đội quân để đổ bộ đánh chiếm các hành tinh thù địch trong chiến tranh. Do không có giáp và vũ khí, chúng cần một hạm đội yểm trợ khi di chuyển trong lãnh thổ đối phương."
 SHIP_GRAPHICS_SCIENCE_DESC:0 "Tàu Khoa học chủ yếu được sử dụng để khám phá các hệ sao mới và nghiên cứu dị thường. Là tàu dân sự, chúng không có giáp và rất dễ bị tổn thương."
 SHIP_GRAPHICS_CONSTRUCTOR_DESC:0 "Tàu Xây dựng là thiết yếu để xây dựng bất kỳ trạm không gian nào. Là tàu dân sự, chúng không có giáp, không có vũ khí và rất dễ bị tổn thương."
 SHIP_GRAPHICS_COLONIZER_DESC:0 "Tàu Thuộc địa chở cư dân từ các hành tinh đã định cư đến những nơi mới để khai hoang thuộc địa. Là tàu dân sự, chúng không có giáp, không có vũ khí và rất dễ bị tổn thương."
 SHIP_GRAPHICS_SHIP_SIZE_LOCKED_DESC:0 "§RPhân lớp tàu này yêu cầu DLC $SHIP_SIZE_NAME$.§!"
 SHIP_GRAPHICS_ION_CANNON_DESC: "Vũ khí phòng thủ đồ sộ bắn ra các luồng năng lượng tàn khốc, làm tê liệt tàu địch. Chậm chạp nhưng uy lực, nó đóng vai trò như đòn răn đe đáng gờm trước những vị khách không mời."
 SHIP_GRAPHICS_MILITARY_STATION_SMALL_DESC: "Nền tảng Phòng thủ là các công trình kiên cố quỹ đạo cố định được thiết kế để bảo vệ các trạm không gian khỏi sự xâm nhập thù địch."
 SHIP_GRAPHICS_STARBASE_DEEP_SPACE_CITADEL_1_DESC: "Một trạm quỹ đạo đóng vai trò là tuyến phòng thủ đầu tiên của hệ sao. Được thiết kế để phô diễn sức mạnh và bảo đảm an ninh cho các vị trí chiến lược."
 SHIP_GRAPHICS_STARBASE_DEEP_SPACE_CITADEL_2_DESC: "Một thành trì kiên cố tiên tiến trang bị dày đặc các trận địa vũ khí và hệ thống phòng thủ. Được gia cố cho các cuộc giao tranh kéo dài, nó làm chỗ dựa cho các hoạt động của hạm đội trong không gian tranh chấp."
 SHIP_GRAPHICS_STARBASE_DEEP_SPACE_CITADEL_3_DESC: "Đỉnh cao của công sự vũ trụ sâu, trạm khổng lồ này là bức tường thành gần như bất khả xâm phạm, có khả năng chống đỡ các cuộc tổng tấn công quy mô lớn đồng thời kiểm soát hoàn toàn hậu cần hệ sao."
 SHIP_SIZE_SELECTOR_LOC: "SHIP_GRAPHICS_$SIZE$_DESC"
 SHIPSETS_DESCRIPTION_LABEL: "Mô tả"
 SHIP_GRAPHICS_NANITE_SWARMER_DESC: "Một phi cơ tấn công nhanh nhẹn và khó lường bao gồm các nanite tự sao chép. Thiếu vắng các phi công truyền thống, những bầy đàn tự hành này áp đảo kẻ thù bằng số lượng áp đảo, phân rã các tuyến phòng thủ của kẻ địch với độ chính xác không ngừng nghỉ."
 SHIP_GRAPHICS_NANITE_INTERDICTOR_DESC: "Một phi cơ tấn công thích ứng được tạo thành từ các nanite tự sao chép, Kẻ Chặn đánh ưu tiên sự kiểm soát hơn là hỗn loạn. Hoạt động như một khối thống nhất, những cấu trúc tự hành này đánh chặn và vô hiệu hóa các mối đe dọa với hiệu quả đáng kinh ngạc, phá vỡ đội hình đối phương thông qua sự gián đoạn có phối hợp và sự truy kích không ngừng nghỉ."
 SHIP_GRAPHICS_CRISIS_CORVETTE_DESC: "Tàu Hộ Tống Tai Ương được thiết kế để triển khai chớp nhoáng và áp đảo bằng số lượng áp đảo. Chúng vượt trội so với các tàu hộ tống tiêu chuẩn, gieo rắc nỗi sợ hãi vào những kẻ dám chống lại cơn bão sắp đến."
 SHIP_GRAPHICS_CRISIS_DESTROYER_DESC: "Một chiến hạm vũ trang hạng nặng được thiết kế cho hiệu quả tàn nhẫn. Lớn hơn và bền bỉ hơn tàu hộ tống, nó cung cấp hỏa lực áp đảo trong khi vẫn duy trì tốc độ để săn lùng những kẻ thù đang tháo chạy."
 SHIP_GRAPHICS_CRISIS_CRUISER_DESC: "Một chiến hạm đáng gờm cân bằng giữa hỏa lực, độ bền và sự thống trị chiến lược. Được vũ trang hạng nặng và kiên cường, nó đóng vai trò là xương sống của cuộc tấn công tổng lực sắp tới, phá vỡ các phòng tuyến của đối phương bằng sức mạnh không ngừng nghỉ."
 SHIP_GRAPHICS_STAR_EATER_DESC: "Con tàu khổng lồ này có khả năng nuốt chửng toàn bộ các ngôi sao, kích hoạt siêu tân tinh hủy diệt toàn bộ hệ sao. Không chỉ là một chiến hạm, Kẻ Nuốt Sao còn là kẻ báo trước sự kết thúc của thiên hà, biến các thế giới thành những khoảng hư không vô hồn trên đường nó đi qua."
 SHIP_GRAPHICS_COSMO_CRISIS_DESTROYER_DESC: "Một chiến hạm bóng bẩy thấm đẫm năng lượng vũ trụ, tấn công với độ chính xác và sức mạnh không ngừng nghỉ. Không chỉ là một con tàu, nó là kẻ báo trước của một thực tại mới."
 SHIP_GRAPHICS_COSMO_CRISIS_BATTLECRUISER_DESC: "Một sự dung hợp cao chót vót giữa khoa học và định mệnh, nắm giữ hỏa lực tàn khốc. Chiến hạm này định hình lại các chiến trường giống như những bậc thầy của nó định hình lại muôn vì sao."
 SHIP_GRAPHICS_COSMO_CRISIS_TITAN_DESC: "Một động cơ chiến tranh thiên thể, tỏa ra sức mạnh của sự biến đổi sắp đến. Chính sự hiện diện của nó bẻ cong thực tại, báo trước bình minh của một vũ trụ tái sinh."
