 default_leader_greeting: "Chặng đường của chúng ta là biển sao bao la."
 hive_greeting: "“Một tâm trí, vạn thân xác, bao trùm lấy sự tĩnh lặng của vũ trụ.”"
 machine_greeting: "“Phân tích ban đầu - Hoàn tất, hệ thống - Đang chạy. Đơn vị đã sẵn sàng nhận lệnh.”"
 wilderness_greeting: "“Mầm non vươn mình, ý chí dẫn lối. Cùng nhau tiến bước, sinh sôi nảy nở.”"
 default_greeting: "“Tôi đã sẵn sàng cống hiến cho đất nước. Xin hãy giao việc cho tôi.”"
 authoritarian_admiral: "“Tôi sẽ thực thi ý chí của ngài và mang về chiến thắng!”"
 authoritarian_scientist: "“Tiến bộ khoa học phải phục vụ cho quốc gia.”"
 authoritarian_general: "“Kẻ thù của chúng ta chắc chắn sẽ phải khuất phục.”"
 authoritarian_official: "“Nhân dân cần phải học cách tuân lệnh.”"
 egalitarian_admiral: "“Tôn trọng thủy thủ đoàn chắc chắn sẽ mang lại chiến thắng.”"
 egalitarian_scientist: "“Ước mơ của một nhà khoa học là mang lại lợi ích cho xã hội.”"
 egalitarian_general: "“Chúng ta sẽ sát cánh chiến đấu vì hạnh phúc của tất cả mọi người.”"
 egalitarian_official: "“Mỗi công dân đều có quyền lên tiếng, và tôi nguyện làm người lắng nghe.”"
 militarist_admiral: "“Hoàn thành nghĩa vụ, hướng tới vinh quang!”"
 militarist_scientist: "“Ranh giới giữa thiên tài và kẻ điên chỉ là sự thành công.”"
 militarist_general: "“Đoạt lấy chiến thắng bằng mọi giá!”"
 militarist_official: "“Hạm đội của chúng ta phải vĩ đại đến mức che khuất cả bầu trời.”"
 pacifist_admiral: "“Cách tấn công tốt nhất là một hàng phòng ngự bất khả xâm phạm.”"
 pacifist_scientist: "“Sự tiến bộ sẽ thúc đẩy hòa bình và thịnh vượng.”"
 pacifist_general: "“Dưới sự chỉ huy của tôi, chiến tranh không phải là cái cớ cho những hành vi man rợ.”"
 pacifist_official: "“Chỉ những hành tinh hòa bình mới có thể sản sinh ra của cải dồi dào.”"
 spiritualist_admiral: "“Chiến thắng bắt nguồn từ đức tin.”"
 spiritualist_scientist: "“Khoa học có thể phản chiếu những điều thiêng liêng.”"
 spiritualist_general: "“Dù kẻ thù có hùng mạnh đến đâu, tinh thần của chúng ta sẽ không bao giờ gục ngã.”"
 spiritualist_official: "“Người thấu hiểu được sức mạnh tâm linh mới là nhà lãnh đạo xuất sắc nhất.”"
 materialist_admiral: "“Hạm đội của chúng ta sẽ hùng mạnh như những vì sao!”"
 materialist_scientist: "“Tôi đã sẵn sàng đưa các lý thuyết của mình vào thực tiễn.”"
 materialist_general: "“Một đội quân được trang bị tối tân sẽ giành chiến thắng!”"
 materialist_official: "“Ba mục tiêu hàng đầu của tôi: Lên kế hoạch, Sản xuất, và Phồn vinh.”"
 xenophile_admiral: "“Nghênh đón thử thách!”"
 xenophile_scientist: "“Hãy đi khám phá những hành tinh mới, mở rộng ranh giới của những điều chưa biết!”"
 xenophile_general: "“Biết người biết ta, trăm trận trăm thắng.”"
 xenophile_official: "“Sự đa dạng sẽ bảo vệ sự phát triển vững mạnh của cộng đồng.”"
 xenophobe_admiral: "“Nghiền nát mọi sinh vật ngoại lai cản đường.”"
 xenophobe_scientist: "“Chúng ta phải bắt kịp nhịp độ của thế giới bên ngoài để bảo vệ sự phồn vinh.”"
 xenophobe_general: "“Tôi sẽ không nương tay với kẻ thù cũng như lãnh đạo của chúng.”"
 xenophobe_official: "“Tôi sẽ đảm bảo hành tinh của chúng ta luôn năng suất và thuần khiết.”"

