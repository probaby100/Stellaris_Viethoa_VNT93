 # Buildings
 building_paragon_memory_vaults:0 "Kho Lưu Trữ Ký ức"
 building_paragon_memory_vaults_machine:0 "$building_paragon_memory_vaults$"
 building_paragon_memory_vaults_hive:0 "$building_paragon_memory_vaults$"
 building_paragon_memory_vaults_desc:1 "Xã hội chúng ta luôn nâng niu những giai thoại về các vị anh hùng và vĩ nhân thuở trước. Tri thức và kinh nghiệm của họ được số hóa rồi cất giữ trong Kho Lưu Trữ Ký ức. Một khi tòa nhà này sụp đổ, toàn bộ dữ liệu bên trong cũng tan thành mây khói.                                     "
 building_paragon_memory_vaults_machine_desc:1 "Mọi cảm giác và dữ liệu mà các đơn vị của chúng ta trải qua đều được nạp vào những Kho Lưu Trữ này. Mỗi khi một đơn vị tự trị mới ra đời, ngân hàng dữ liệu khổng lồ này sẽ giúp nó bứt tốc học hỏi. Hủy diệt kiến trúc này đồng nghĩa với việc xóa sổ vĩnh viễn dữ liệu bên trong."
 building_paragon_memory_vaults_hive_desc:1 "Ký ức và cảm quan của toàn bộ các cá thể tự trị đều được tích cóp trong Kho Lưu Trữ, chờ ngày được cấy vào những cá thể non trẻ mới. Một khi tòa nhà này sụp đổ, mọi dữ liệu bên trong cũng tan thành mây khói."
 memory_vault_tooltip: "Tăng §Y$MOD_LEADER_SPECIES_EXP_GAIN$§! và §Y$mod_country_unity_produces_mult$§! thêm §G1%§! cho mỗi §YĐặc Tính Định Mệnh§! mà các nhà lãnh đạo nhận được.\nPhí duy trì tăng theo mỗi §YĐặc Tính Định Mệnh§! mà các nhà lãnh đạo nhận được."
 building_corporate_clinics:0 "Phòng khám Doanh nghiệp"
 building_corporate_clinics_desc:1 "Một tập đoàn y dược tư nhân đã vung tiền chiêu mộ các chuyên gia y tế cả trong và ngoài hành tinh để cung cấp dịch vụ với mức phí phải chăng."
 building_corporate_clinics_effect:1 ""

 # Civics
 civic_tooltip_memory_vault_effects:1 "Cho phép xây dựng £building£ §Y$building_paragon_memory_vaults$§! độc quyền\n£building£ §Y$building_paragon_memory_vaults$§! sẽ sản xuất $r_unity$ và tăng §Y$MOD_LEADER_SPECIES_EXP_GAIN$§! dựa trên số lượng §YĐặc điểm Định mệnh§! mà lãnh đạo đã đạt được."
 civic_memory_vault:0 "Kho Lưu Trữ Ký ức"
 civic_memory_vault_desc:1 "Tri thức, tư tưởng và kinh nghiệm của các bậc kỳ tài được số hóa và lưu trữ cẩn mật trong Kho Lưu Trữ. Dân chúng có thể đắm mình vào suối nguồn trí tuệ này để noi gương những vĩ nhân đời trước."

 civic_tooltip_memory_vault_corporate_effects:1 "Cho phép xây dựng £building£ §Y$building_paragon_memory_vaults$§! độc quyền\n£building£ §Y$building_paragon_memory_vaults$§! sản xuất $r_unity$ và $r_trade$ dựa trên số lượng §YĐặc điểm Định mệnh§! đã đạt được.\n£building£ §Y$building_commercial_forum$§!$megacorp_civic_branch_office_building_effect$"
 civic_memory_vault_corporate:1 "Hệ thống Cố vấn Ký ức"
 civic_memory_vault_corporate_desc:1 "Tri thức, tư tưởng và kinh nghiệm của các bậc kỳ tài được số hóa và lưu trữ cẩn mật trong Kho Lưu Trữ. Dân chúng có thể đắm mình vào suối nguồn trí tuệ này để noi gương những vĩ nhân đời trước. Chắc chắn rồi, phải trả phí."

 civic_tooltip_memory_vault_machine_effects:1 "Cho phép xây dựng £building£ §Y$building_paragon_memory_vaults$§! độc quyền\n£building£ §Y$building_paragon_memory_vaults$§! sản xuất $r_unity$ và tăng §Y$MOD_LEADER_SPECIES_EXP_GAIN$§! dựa trên số lượng §YLãnh đạo§! đạt §YCấp độ 8§!."
 civic_memory_vault_machine:1 "Bộ Nhớ đệm Kinh nghiệm"
 civic_memory_vault_machine_desc:0 "Trí tuệ nhân tạo này được phát triển với mục đích số hóa và lưu trữ dữ liệu cùng kinh nghiệm, từ đó có thể tự phân tích, tự học hỏi, tự ứng dụng và tự nâng cấp."

 civic_tooltip_memory_vault_hive_effects:3 "Cho phép xây dựng £building£ §Y$building_paragon_memory_vaults$§! độc quyền\n£building£ §Y$building_paragon_memory_vaults$§! sản xuất $r_unity$ và tăng §Y$MOD_LEADER_SPECIES_EXP_GAIN$§! dựa trên số lượng §YLãnh đạo§! đạt §YCấp độ 8§!."
 civic_memory_vault_hive:1 "Kho Tàng Dây Thần kinh"
 civic_memory_vault_hive_desc:0 "Tổ Đàn này tập trung vào sự nội quan, chắt lọc bài học từ những cá thể đang rải rác khắp hệ sao. Bằng cách bảo quản và phân rã các mô não, nó có thể trích xuất ký ức để rồi cấy ghép một phần chúng vào thế hệ cá thể sơ sinh."
 civic_memory_vault_wilderness: "$civic_memory_vault_hive$"
 civic_memory_vault_wilderness_desc: "Vùng hoang dã nội quan này hấp thụ nguồn sống và bài học từ các dạng sinh mệnh tự trị, rồi hòa tan toàn bộ những ký ức ấy vào bản năng chung của mọi sinh vật cộng sinh với nó."

 civic_tooltip_crusader_spirit_effects:1 "§Y$commander_plural_with_icon$§! ban đầu sở hữu đặc điểm §Y$leader_trait_crusader$§!\nChỉ được sử dụng chính sách §YChiến tranh Giải phóng§!"
 civic_crusader_spirit:0 "Tinh thần Thập tự quân"
 civic_crusader_spirit_desc:0 "Những linh hồn mù đường rất dễ đổ vỡ, dễ gục ngã trước cám dỗ và trượt dài xuống vực thẳm suy đồi. Xã hội này đã chủ động truyền bá \"khai sáng\" đến công chúng, dựng lên một tấm khiên giáp tinh thần vững chãi cho mọi người."

 civic_tooltip_crusader_spirit_corporate_effects:3 "§Y$commander_plural_with_icon$§! ban đầu sở hữu đặc điểm §Y$leader_trait_corsair$§!\nSở hữu lý do tuyên chiến \"§Y$casus_belli_cb_pirate_raid$§!\" với các Đế chế khác\n£building£ §Y$building_military_contractors$§!$megacorp_civic_branch_office_building_effect$"
 civic_crusader_spirit_corporate:0 "Đặc quyền Đánh cướp"
 civic_crusader_spirit_corporate_desc:0 "Nhằm tiễu trừ hải tặc không gian và bảo vệ biên ải, tập đoàn bành trướng này không ngần ngại chiêu mộ chính những tên cướp biển khét tiếng nhất về làm cố vấn quân sự và chỉ huy hạm đội."
 casus_belli_cb_pirate_raid:0 "Hải tặc Kích bạo"
 gov_pirate_haven:0 "Sào huyệt Hải tặc"
 gov_pirate_haven_desc:0 "$gov_criminal_syndicate_desc$"
 war_goal_wg_plunder_raid:0 "$war_goal_wg_plunder$"
 war_goal_wg_plunder_raid_desc:0 "Phát động chiến tranh để đột kích và cướp bóc kẻ thù. Mục tiêu chiến tranh này cho phép vơ vét $r_energy$ và $r_minerals$ của mục tiêu."

 civic_task_delegation_corporate:1 "Bánh răng Chuẩn xác"
 civic_task_delegation_corporate_desc:1 "Tập đoàn bành trướng này vận hành dựa trên một hệ thống ủy thác cực kỳ tối ưu và hùng mạnh. Cơ chế này đảm bảo mọi nhiệm vụ đều được giao phó cho những nhân công thạo việc nhất."
 civic_tooltip_task_delegation_corporate_effects: "—£building£ §Y$building_executive_retreat$§!$megacorp_civic_branch_office_building_effect$"

 civic_private_healthcare_corporate:1 "Đế chế Dược phẩm"
 civic_private_healthcare_corporate_desc:1 "Quốc gia cường thịnh phải là một quốc gia khỏe mạnh. Tập đoàn bành trướng này luôn duy trì nền kinh tế cường tráng nhờ vào các loại thuốc thử nghiệm, hệ thống y tế tư nhân hóa cao độ cùng chiến lược tiếp thị rầm rộ."
 civic_tooltip_civic_private_healthcare_corporate_effects:3 "—£building£ §YCông trình Thủ phủ§! cung cấp §G+100§! vị trí [healthcare.GetIcon]§Y[healthcare.GetName]§!\n—$r_amenities$ do [healthcare.GetIcon]§Y[healthcare.GetNamePlural]§! tạo ra: §G+2§!\n—$r_trade$ do [healthcare.GetIcon]§Y[healthcare.GetNamePlural]§! tạo ra: §G+4§!\n—Cho phép xây dựng £building£ §Y$building_corporate_clinics$§! $BRANCH_OFFICE_BUILDING$\n—£building£ §Y$building_corporate_clinics$§!$megacorp_civic_branch_office_building_effect$"

 civic_machine_upkeep_twister:1 "Mạch vòng Độc lập"
 civic_machine_upkeep_twister_desc:1 "Các đơn vị do Trí tuệ Máy móc này chế tạo đều được cài cắm phần mềm tự ra quyết định. So với các đời máy cũ, chúng có hiệu năng và kết quả làm việc vượt trội, nhưng bù lại ngốn nhiều năng lượng đầu vào hơn."
 civic_tooltip_machine_upkeep_twister_effects:2 "Thay thế §Y1§! phí duy trì Lãnh đạo bằng $r_unity$ cơ bản thành §Y2§! $r_energy$"


 civic_hive_upkeep_twister:0 "Ong thợ Tự trị"
 civic_hive_upkeep_twister_desc:1 "Những ong thợ chuyển hóa cao tiến hóa trong Tổ Đàn này sở hữu nhiều quyền tự quyết hơn. Dù cực kỳ nhạy bén trong việc ra quyết định và đánh giá tình hình, chúng lại đòi hỏi được nạp nhiều dưỡng chất dễ tiêu hóa hơn."
 civic_tooltip_hive_upkeep_twister_effects:2 "Thay thế §Y1§! phí duy trì Lãnh đạo bằng $r_unity$ cơ bản thành §Y2§! $r_food$, $r_minerals$ hoặc §Y1§! $r_alloys$"
 civic_wilderness_upkeep_twister: "Cộng sinh thể Tự trị"
 civic_wilderness_upkeep_twister_desc: "Nơi vùng hoang dã này, một nhánh tiến hóa cộng sinh độc đáo và siêu việt đã hình thành. Chúng thăng tiến thành các thủ lĩnh với tốc độ chóng mặt, nhưng đổi lại cũng ngốn mức chuyển hóa duy trì cao hơn."

 civic_heroic_tales:0 "Giai thoại Anh hùng"
 civic_heroic_tales_desc:1 "Những vị anh hùng huyền thoại của quá khứ chính là nguồn cảm hứng thôi thúc lớp trẻ của nền văn minh này vươn tới những thành tựu phi thường. Các quan chức chính phủ cũng lấy đó làm gương để rèn giũa những lý tưởng này."
 civic_heroic_tales_effects:0 "$tr_aptitude_adopt_desc$"

 civic_dystopian_society:1 "Độc tài Áp bức"
 civic_dystopian_society_desc:1 "Chỉ những tinh hoa xuất chúng nhất mới xứng đáng với những thứ tốt đẹp nhất. Những kẻ còn lại sinh ra chỉ để phục dịch tầng lớp thống trị cùng lũ tay sai của chúng."
 civic_tooltip_dystopian_society_effects:1 "- £job_enforcer£ $job_enforcer_plural$ là £pop_cat_ruler£ §Y$pop_cat_ruler_plural$§! thay vì £pop_cat_specialist£ §Y$pop_cat_specialist_plural$§!\n- Chỉ £pop_cat_ruler£ §Y$pop_cat_ruler_plural$§! mới tạo ra $r_amenities$ và có Phí duy trì $r_amenities$\n- Bắt buộc áp dụng Mức sống §Y$living_standard_dystopian_society$§!, theo đó Pop §Ykhông thuộc $pop_cat_ruler$§! sẽ giảm Phí duy trì $r_consumer_goods$\n- Pop §Ykhông thuộc $pop_cat_ruler$§! tạo thêm £crime£ §Y$PLANET_CRIME_TITLE$§!\n- Không thể xây dựng £building£ §Y['building_holo_theatres']§!"
 district_hab_cultural_dystopian_desc:0 "Những khu vực này chuyên cung cấp các thú vui giải trí xả hơi xứng tầm cho lực lượng thực thi pháp luật."

 # Systems
 NAME_legendary_crash_site:0 "Dugar"
 NAME_Vapob:0 "Vapob"
 NAME_Ivusheh:0 "Ivusheh"
 NAME_Taprib:0 "Taprib"
 NAME_Sursect:0 "Sursect"
 unique_planet_no_terraform:0 "Hành tinh này quá thiếu ổn định để có thể tiến hành cải tạo môi trường."
 NAME_Overlord_Empire:0 "Hạm đội Tự động"
 NAME_Overlord_Enforcers:0 "Kẻ Chấp pháp"
 d_volcanic_active_planet:0 "Hoạt động Núi lửa"
 d_volcanic_active_planet_desc:1 "Những núi lửa đang hoạt động đã làm nung chảy các vỉa quặng ngầm, khiến cho việc khai thác tài nguyên trở nên dễ thở hơn bao giờ hết."
 d_hostile_fauna:0 "Động vật Hoang dã Hung dữ"
 d_hostile_fauna_desc:1 "Các loài dã thú hung tợn đang lùng sục con mồi khắp vùng đất này, buộc các khu định cư phải thắt chặt an ninh để ngăn chặn hiểm họa."
 d_hostile_flora:0 "Thực vật Hung dữ"
 d_hostile_flora_desc:0 "Các thảm thực vật hung tợn đang sinh sôi nảy nở lan tràn khắp lục địa để săn mồi. Cần phải cắt cử lực lượng an ninh để kiểm soát đám cây cối mọc hoang dại này."
 d_space_ship_graveyard:0 "Nghĩa địa Tàu Vũ trụ"
 d_space_ship_graveyard_desc:0 "Vô số xác tàu cũ rích nằm la liệt trên bề mặt hành tinh, gây cản trở cho các hoạt động khai mỏ tiềm năng. Mặc dù vậy, chúng lại là một nguồn cung cấp Hợp kim cực kỳ béo bở và dễ xơi."
 d_fallen_orbital_shipyard:0 "Xưởng Đóng tàu Rơi rụng"
 d_fallen_orbital_shipyard_desc:0 "Tàn tích của một xưởng đóng tàu quỹ đạo cổ đại nằm vương vãi khắp bề mặt hành tinh. Bộ khung oằn vặn và máy móc im lìm của nó vẫn chứa đầy những vật liệu quý giá để nghiên cứu và khai thác."
 d_pulsar_scarred:0 "Vùng đất Đầy Sẹo"
 d_pulsar_scarred_desc:0 "Vùng đất đầy sẹo và mặt đất cháy đen phủ kín tàn tích này gần như chẳng có chút giá trị gì, trừ phi ta tìm được cách thuần hóa nguồn năng lượng khổng lồ phát ra từ Sao xung quanh nó."
 d_ancient_facilities:0 "Cơ sở Cổ đại"
 d_ancient_facilities_desc:0 "Những cơ sở cổ đại này ẩn chứa hàng đống dữ liệu nghiên cứu về Sao xung, công nghệ Lá chắn, cũng như cách bòn rút năng lượng từ những ngôi sao chết chóc nhất. "
 molten_mineral_rivers:0 "Dòng sông Dung nham Khoáng"
 molten_mineral_rivers_desc:0 "Hành tinh này hứng chịu những đợt phun trào núi lửa thường xuyên, với hàng tấn dung nham cuồn cuộn chảy lấp đầy lớp vỏ trong, giúp tăng hiệu suất guồng quay của các nhà máy xử lý khoáng sản trên hành tinh."
 hostile_planet:0 "Hành tinh Chết chóc"
 hostile_planet_desc:0 "Toàn bộ hệ động thực vật trên hành tinh này đều tiến hóa theo tôn chỉ “ăn hoặc bị ăn”. Chúng là nguồn cung cấp dinh dưỡng dồi dào, nhưng cũng không ngừng đi săn các sinh vật khác để đắp bụng."
 ship_junkyard:0 "Bãi rác Tàu Vũ trụ"
 ship_junkyard_desc:0 "Hành tinh này là một bãi rác khổng lồ chứa toàn tàu thuyền cũ nát và một xưởng đóng tàu quỹ đạo rơi rụng. Đây quả là mỏ vàng lý tưởng để mò mẫm những kim loại quý hiếm và công nghệ thời xa vắng."
 pulsar_frying_pan:0 "Chảo lửa Sao xung"
 pulsar_frying_pan_desc:0 "Một nửa bán cầu của hành tinh này đang bị bào mòn bởi bức xạ từ ngôi Sao xung lân cận, biến nó thành một vùng đất chết chóc không thể ở nổi. Dù vậy, điều kiện khắc nghiệt này lại chính là lò luyện tuyệt vời, giúp các cơ sở nghiên cứu công nghệ năng lượng của chúng ta hoạt động với hiệu suất chạm trần."

