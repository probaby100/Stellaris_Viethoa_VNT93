 death_reason_civic_slaver_guilds_2:0 "Thoái vị sau khi xảy ra xung đột mâu thuẫn với một thủ lĩnh của hiệp hội buôn bán nô lệ."
 death_reason_civic_technocracy_1:0 "Thoái vị để đi theo đuổi giấc mộng học thuật của cá nhân."
 death_reason_civic_technocracy_2:0 "Bị một tia laser làm bốc hơi không còn một dấu vết trong một buổi trình diễn công nghệ."
 death_reason_civic_warrior_culture_1:0 "Nghỉ hưu để tập trung sưu tập những loại vũ khí quý hiếm."
 death_reason_civic_warrior_culture_2:0 "Vinh quang tử trận trong một cuộc đấu tay đôi."
 death_reason_civic_catalytic_processing_1:0 "Nghỉ hưu để nghiên cứu sâu về bộ môn hóa học hữu cơ."
 death_reason_civic_catalytic_processing_2:0 "Nghỉ hưu để chuyển sang điều hành một dự án liên quan đến kim loại sống."
 death_reason_civic_ascensionists_1:0 "Nghỉ hưu để đi hòa làm một với vũ trụ bao la."
 death_reason_civic_ascensionists_2:0 "Qua đời dưới tác dụng của một loại thuốc có khả năng thao túng tâm trí."
 death_reason_civic_fanatic_purifiers_1:0 "Nghỉ hưu nhằm mục đích gia nhập vào một tổ chức cực đoan chuyên thanh trừng các sinh vật ngoại lai."
 death_reason_civic_fanatic_purifiers_2:0 "Bị tước bỏ chức vụ do bị bắt quả tang đang lén lút qua lại với sinh vật ngoại lai."
 death_reason_civic_crafters_1:0 "Thoái vị để tập trung hoàn thiện tuyệt tác để đời mang đậm dấu ấn cá nhân của [Root.GetHisHer]."
 death_reason_civic_crafters_2:0 "Suốt ngày đắm chìm trong xưởng làm việc của [Root.GetHisHer] mà bỏ ngoài tai mọi sự đời."
 death_reason_civic_pleasure_seekers_1:0 "Nghỉ hưu để dọn đến sống tại một thánh địa ăn chơi."
 death_reason_civic_pleasure_seekers_2:0 "Nghỉ hưu để đi theo tiếng gọi của một cuộc sống khoái lạc tột đỉnh."
 death_reason_civic_pompous_purists_1:0 "Nghỉ hưu để chuyên tâm vào việc ghi chép lại hồ sơ về các giống loài hạ đẳng."
 death_reason_civic_pompous_purists_2:0 "Chết để bảo vệ niềm danh dự của [Root.GetHisHer]."
 death_reason_civic_barbaric_despoilers_1:0 "Mất mạng trong một trận đấu vật."
 death_reason_civic_barbaric_despoilers_2:0 "Bỏ lại cả đế chế ở sau lưng để chạy đi cướp bóc rồi!"
 death_reason_civic_byzantine_bureaucracy_1:0 "Từ chức để ghi chép các thỏa thuận vận chuyển của chính phủ."
 death_reason_civic_byzantine_bureaucracy_2:0 "Biến mất khỏi mọi hồ sơ lưu trữ, cứ như chưa từng tồn tại."
 death_reason_civic_merchant_guilds_1:0 "Nghỉ hưu sau khi nhận được một lời mời làm việc mà [Root.GetHeShe] không thể chối từ."
 death_reason_civic_merchant_guilds_2:0 "Nghỉ hưu và bắt đầu sự nghiệp thương nhân liên sao."
 death_reason_civic_merchant_guilds_3:0 "Nghỉ việc để tìm kiếm những cơ hội làm ăn thú vị mới."
 death_reason_civic_shared_burden_1:0 "Thôi việc để đi phân phối lại tư liệu sản xuất."
 death_reason_civic_shared_burden_2:0 "Nghỉ hưu và chuyển đến sống ở một công xã nhân dân."
 death_reason_civic_diplomatic_corps_1:0 "Từ chức sau khi thất bại trong một cuộc tranh luận nảy lửa."
 death_reason_civic_diplomatic_corps_2:0 "Rời ghế để tập trung vào ngoại giao tuyến đầu."
 death_reason_civic_death_cult_1:0 "Lần cuối được nhìn thấy là đi cùng một kẻ đội mũ nhọn."
 death_reason_civic_death_cult_2:0 "Bị đem tế thần giữa chốn đông người."
 death_reason_civic_memorialist_1:0 "Nghỉ hưu để đi ghi chép về các đài tưởng niệm trên hành tinh."
 death_reason_civic_memorialist_2:0 "Chết trong một tai nạn ướp xác kỳ dị."
 death_reason_civic_reanimated_armies_1:0 "Bị pháp sư gọi hồn hồi sinh để tòng quân."
 death_reason_civic_reanimated_armies_2:0 "Chết hẳn trong một lần hồi sinh lỗi."
 death_reason_civic_anglers_1:0 "Nghỉ hưu sớm để về quê mò ngọc trai."
 death_reason_civic_anglers_2:0 "Bị sinh vật săn mồi dưới biển sâu nuốt chửng."
 death_reason_civic_toxic_baths_1:0 "Nghỉ hưu để giám sát các nghi thức tắm bùn gây đột biến truyền thống."
 death_reason_civic_toxic_baths_2:0 "Chết đuối trong buồng nuôi cấy."
 death_reason_civic_relentless_industrialists_1:0 "Mất trong một tai nạn lao động."
 death_reason_civic_relentless_industrialists_2:0 "Nghỉ việc do tiếp xúc lâu ngày với hóa chất độc hại."
 death_reason_civic_scavengers_1:0 "Nghỉ hưu để phát triển các phương pháp thu gom rác vũ trụ mới."
 death_reason_civic_scavengers_2:0 "Nghỉ hưu để mở một cửa hàng đồ cũ ở nơi hẻo lánh."
 death_reason_civic_memory_vault_1:0 "Bị số hóa và cất vào Kho Lưu Trữ."
 death_reason_civic_memory_vault_2:0 "Bỏ mạng khi đang biên soạn danh mục cho Kho Lưu Trữ."
 death_reason_civic_memory_vault_3:0 "Biến mất bên trong Kho Lưu Trữ."
 death_reason_civic_memory_vault_4:0 "Bị sa thải vì tự ý thêm dữ liệu trái phép vào Kho Lưu Trữ."
 death_reason_civic_dystopian_society_1:0 "Nghỉ hưu, lái chiếc du thuyền không gian xa hoa của [Root.GetHisHer] đi chu du khắp bãi sao."
 death_reason_civic_dystopian_society_2:0 "Bị ép từ chức vì tội lén lút chỉ trích chính quyền."
 death_reason_civic_dystopian_society_3:0 "Bị những người nông dân chết đói sát hại."
 death_reason_civic_dystopian_society_4:0 "Chết trong một vụ cướp nhà ngớ ngẩn."
 death_reason_civic_heroic_tales_1:0 "Trở thành một huyền thoại của thời xa vắng."
 death_reason_civic_heroic_tales_2:0 "Chết như một vị anh hùng."
 death_reason_civic_heroic_tales_3:0 "Giải ngũ như một vị anh hùng."
 death_reason_civic_heroic_tales_4:0 "Hình tượng sụp đổ nên bị cách chức."
 death_reason_civic_crusader_spirit_1:0 "Lùi về tuyến sau để truyền bá lý tưởng của chúng ta."
 death_reason_civic_crusader_spirit_2:0 "Bị lưu đày vì tội dị giáo."
 death_reason_civic_crusader_spirit_3:0 "Từ bỏ quan lộ để đi nghiên cứu kinh thánh."
 death_reason_civic_crusader_spirit_4:0 "Tử trận khi chiến đấu với bè lũ dị giáo."
 death_reason_civic_crusader_spirit_corporate_1:0 "Mất tích trong một bữa tiệc do hải tặc tổ chức."
 death_reason_civic_crusader_spirit_corporate_2:0 "Bị giết vì một sự hiểu lầm."
 death_reason_civic_crusader_spirit_corporate_3:0 "Từ chức vì cờ bạc thua lỗ."
 death_reason_civic_crusader_spirit_corporate_4:0 "Từ chức để làm hải tặc toàn thời gian."
 death_reason_civic_private_healthcare_corporate_1:0 "Bị sa thải vì lạm dụng thuốc kê đơn có hệ thống."
 death_reason_civic_private_healthcare_corporate_2:0 "Không kham nổi chi phí phẫu thuật của [Root.GetHisHer]."
 death_reason_civic_private_healthcare_corporate_3:0 "Nghỉ hưu để làm mẫu vật thử nghiệm cho các loại thuốc mới nhất."
 death_reason_civic_private_healthcare_corporate_4:0 "Chết do dùng quá liều thuốc thử nghiệm."
 death_reason_civic_task_delegation_corporate_1:0 "Bị đánh giá là thiếu tối ưu."
 death_reason_civic_task_delegation_corporate_2:0 "Chết vì làm việc quá sức."
 death_reason_civic_task_delegation_corporate_3:0 "Trở thành cái giá phải trả để tối ưu hóa chi phí - lợi nhuận."
 death_reason_civic_task_delegation_corporate_4:0 "Bị loại bỏ như một thứ thừa thãi trong quá trình tối ưu hệ thống."
 death_reason_civic_machine_upkeep_twister_1:0 "Đơn giản là hỏng hóc và ngừng hoạt động."
 death_reason_civic_machine_upkeep_twister_2:0 "Gặp lỗi chí mạng trong phần mềm ra quyết định."
 death_reason_civic_machine_upkeep_twister_3:0 "Bị tháo dỡ sau một lỗi tràn viền dữ liệu."
 death_reason_civic_machine_upkeep_twister_4:0 "Lõi trung tâm bị kẹt trong một vòng lặp vô tận."
 death_reason_civic_hive_upkeep_twister_1:0 "Bị tách khỏi Tổ Đàn."
 death_reason_civic_hive_upkeep_twister_2:0 "Bị loại trừ vì dám nghi ngờ các mệnh lệnh được truyền vào."
 death_reason_civic_hive_upkeep_twister_3:0 "Bị xử lý như hàng thứ phẩm trong chu kỳ tái bản trước."
 death_reason_civic_hive_upkeep_twister_4:0 "Đổ bệnh; bị Ý Thức Tập Thể đem đi cách ly."

 xenophile1_catch_phrase:0 "§L\"Chuẩn bị đi cướp của người giàu chia cho người nghèo từ bọn bạo chúa ngân hà chưa? Phi hành đoàn của tôi đang ngứa ngáy muốn đi đánh cướp lắm rồi!\"§!"
 xenophile2_catch_phrase:1 "§L\"Sinh vật ngoài hành tinh quả là đối tượng nghiên cứu tuyệt vời nhất. Mấy sinh vật biết nói lại càng tuyệt hơn!\"§!"
 militarist1_catch_phrase:0 "§L\"Ngài có muốn xem cảnh kẻ thù của mình bị chìm nghỉm trong một đạo quân đông chưa từng thấy không? Cơ hội ngàn năm có một đấy.\"§!"
 militarist2_catch_phrase:0 "§L\"Hãy thả tôi đi xử lý những kẻ chống đối ngài, tôi sẽ cho chúng biết thế nào là tắm máu!\"§!"
 xenophobe1_catch_phrase:0 "§L\"Làm ơn đừng có cản trở công việc của tôi nữa, nếu không thì tất cả chúng ta đều sẽ không vui với hậu quả đâu.\"§!"
 xenophobe2_catch_phrase:0 "§L\"Đang tiến hành phân tích xã hội toàn diện, báo cáo sẽ được công bố trong 31234 ngày chuẩn thiên hà nữa.\"§!"
 egalitarian1_catch_phrase:0 "§L\"Trong mọi kết cục có thể xảy ra trên dải ngân hà, chế độ độc tài là thứ tồi tệ nhất, nhưng cũng lại phổ biến nhất.\"§!"
 egalitarian2_catch_phrase:0 "§L\"Những kỳ tích công nghệ mà chúng ta tạo ra sao? Phải chia sẻ nó cho tất cả mọi người chứ!\"§!"
 materialist1_catch_phrase:0 "§L\"Giống như cách tôi tự nâng cấp bản thân lên trạng thái hoàn hảo hiện tại, tôi cũng sẽ nâng tầm hạm đội của ngài lên mức xuất chúng.\"§!"
 materialist2_catch_phrase:0 "§L\"Vạn vật đều bắt đầu bằng việc được chế tạo ra, phải không? Vạn vật rồi sẽ có ngày cần được sửa chữa, phải không? Thật tình cờ là tôi lại hứng thú với cả hai việc đó!\"§!"
 pacifist1_catch_phrase:0 "§L\"Ngài không thể để quân đội cứ thế xông pha bừa bãi được. Tôi sẽ duy trì trật tự và đảm bảo lũ cuồng phá hoại kia phải chịu trừng phạt thích đáng.\"§!"
 pacifist2_catch_phrase:0 "§L\"Bí ẩn tối thượng của vũ trụ không nằm ở đâu xa xôi, mà ở ngay đây, trong lòng bàn tay chúng ta.\"§!"
 authoritarian1_catch_phrase:0 "§L\"Cứ chỉ cho tôi thấy vấn đề của ngài, rồi chúng sẽ bốc hơi thôi, bất kể đó là rắc rối chính trị hay ngoài đời thực.\"§!"
 authoritarian2_catch_phrase:0 "§L\"Tôi chỉ là một kẻ bầy tôi thấp hèn có thể đáp ứng mọi mong muốn của ngài thôi, ôi, Đế Chế chí cao vô thượng!\"§!"
 spiritualist1_catch_phrase:0 "§L\"Tôi sẽ dạy bảo những kẻ biết lắng nghe, và cũng sẽ vâng lời người chỉ dạy.\"§!"
 spiritualist2_catch_phrase:0 "§L\"Biển sao này chứa đựng tri thức vô tận, có cái bị che giấu, có cái bị chôn vùi, có cái đã rơi vào quên lãng. Chúng ta phải bảo vệ những chân lý của thời đại cũ này.\"§!"
 skrand_catch_phrase:0 "§L\"Kẻ thù của ngài sẽ phải nếm mùi cơn thịnh nộ của Skravid. Đệ Nhất Móng Vuốt sẽ lại vút bay trên bầu trời!\"§!"
 beholder_catch_phrase:1 "§L\"Chúng ta di chuyển, chúng ta biết ơn. Cứ như vậy suốt hàng tỷ năm rồi.\"§!"
 sadtoid_catch_phrase:0 "§L\"Sự sống là thứ cần được nâng niu. Là một tai nạn hiếm có, một kho báu vô giá. Hãy để chúng tôi gieo mầm sự sống, để vạn vật lại được sinh sôi nảy nở.\"§!"
 keides_catch_phrase:1 "§L\"Đúng vậy! Không có thời gian để lãng phí đâu, hãy để tôi đi khám phá những bí ẩn trong biển sao này. Tàu của tôi đâu rồi?\"§!"

