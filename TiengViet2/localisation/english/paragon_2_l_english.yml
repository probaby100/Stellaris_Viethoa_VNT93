 leader_trait_inspiring: "Người Truyền cảm hứng"
 leader_trait_inspiring_desc:1 "Nhà lãnh đạo này tin chắc rằng sĩ khí ngút trời chính là chìa khóa để giành thắng lợi trên bộ."
 leader_trait_inspiring_2:0 "$leader_trait_inspiring$ II"
 leader_trait_inspiring_2_desc:0 "$leader_trait_inspiring_desc$"
 leader_trait_glory_seeker_2:0 "$leader_trait_glory_seeker$ II"
 leader_trait_glory_seeker_2_desc:0 "$leader_trait_glory_seeker_desc$"
 leader_trait_dreaded: "Gieo rắc Nỗi sợ"
 leader_trait_dreaded_desc:1 "Nhà lãnh đạo này rót sự kinh hoàng vào tận sâu trong linh hồn quân địch."
 leader_trait_dreaded_2:0 "$leader_trait_dreaded$ II"
 leader_trait_dreaded_2_desc:0 "$leader_trait_dreaded_desc$"
 leader_trait_hardy: "Cứng cỏi"
 leader_trait_hardy_desc:1 "Bằng những buổi huấn luyện chất lượng cao, nhà lãnh đạo này luôn đảm bảo binh lính duy trì thể trạng ở mức sung mãn nhất."
 leader_trait_hardy_2:0 "$leader_trait_hardy$ II"
 leader_trait_hardy_2_desc:0 "$leader_trait_hardy_desc$"
 leader_trait_martinet:0 "Kỷ luật Thép"
 leader_trait_martinet_desc:0 "Với việc hành tinh được đặt trong tình trạng quản giáo quân sự, tội phạm coi như hết đường sống. Nhà lãnh đạo này khiến mọi băng đảng và những kẻ chống đối phải run sợ."
 trait_ruler_recruiter_2:0 "$trait_ruler_recruiter$ II"
 trait_ruler_recruiter_2_desc:0 "$trait_ruler_recruiter_desc$"
 leader_trait_heavy_hitter:0 "Quả đấm Thép"
 leader_trait_heavy_hitter_desc:1 "Nhà lãnh đạo này sở trường dùng chiến thuật dồn ép để mau chóng đoạt lấy lợi thế trên bộ."
 leader_trait_heavy_hitter_2:0 "$leader_trait_heavy_hitter$ II"
 leader_trait_heavy_hitter_2_desc:0 "$leader_trait_heavy_hitter_desc$"
 leader_trait_warden:0 "Kẻ Gác Hành tinh"
 leader_trait_warden_desc:1 "Nhà lãnh đạo này rất chuộng việc lấy lính tình nguyện và lính đánh thuê để củng cố sức mạnh quân sự."
 leader_trait_warden_2:0 "$leader_trait_warden$ II"
 leader_trait_warden_2_desc:0 "$leader_trait_warden_desc$"
 leader_trait_kidnapper:0 "Kẻ Bắt cóc"
 leader_trait_kidnapper_effect:1 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$§Y$pop_cat_slave_plural$§! bị đưa tới một thuộc địa ngẫu nhiên: §G10%§!"
 leader_trait_kidnapper_desc:1 "Nhà lãnh đạo này luôn cố gắng nẫng lấy dân cư từ mọi hành tinh bị chinh phạt, coi họ như những chiến lợi phẩm sau mỗi cuộc xâm lăng."
 leader_trait_kidnapper_2_effect:0 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$Bắt cóc §Ydân cư§! làm §Ynô lệ§! và gửi tới thuộc địa ngẫu nhiên: §G20%§!"
 leader_trait_kidnapper_3_effect:0 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$Bắt cóc §Ydân cư§! làm §Ynô lệ§! và gửi tới thuộc địa ngẫu nhiên: §G30%§!"
 leader_trait_overseer:0 "Quan Giám sát"
 leader_trait_overseer_desc:0 "Nhà lãnh đạo này là bậc thầy trong việc duy trì trật tự và sự trung thành ở các chư hầu."
 leader_trait_overseer_2:0 "$leader_trait_overseer$ II"
 leader_trait_overseer_2_desc:0 "$leader_trait_overseer_desc$"
 leader_trait_consul_general:0 "Tổng Lãnh sự"
 leader_trait_consul_general_desc:0 "Nhà lãnh đạo này gánh vác trách nhiệm gìn giữ các phép tắc ngoại giao."
 leader_trait_consul_general_2:0 "$leader_trait_consul_general$ II"
 leader_trait_consul_general_2_desc:0 "$leader_trait_consul_general_desc$"
 leader_trait_spycraft:0 "Chuyên gia Mật vụ"
 leader_trait_spycraft_desc:0 "Thay vì động binh đao, vị chỉ huy này thích dùng những thủ đoạn mềm mỏng hơn, chẳng hạn như gài cắm đặc vụ và nhân viên tình báo."
 leader_trait_spycraft_2:0 "$leader_trait_spycraft$ II"
 leader_trait_spycraft_2_desc:0 "$leader_trait_spycraft_desc$"
 leader_trait_reinforcer:0 "Gia cố Tường đồng"
 leader_trait_reinforcer_desc:1 "Nhà lãnh đạo này thành thạo trong việc xây dựng thần tốc các hầm trú ẩn và lô cốt vững chắc để chống chọi những trận oanh tạc từ quỹ đạo."
 leader_trait_reinforcer_2:0 "Gia cố Tường đồng II"
 leader_trait_reinforcer_desc_2:0 "$leader_trait_reinforcer_desc$"
 leader_trait_ftl_inhibitor:0 "$t$Lắp đặt thêm §YThiết bị Ức chế FTL§! trên hành tinh!"
 leader_trait_guardian:0 "Người Hộ vệ"
 leader_trait_guardian_desc:1 "Nhà lãnh đạo này chuyên lo liệu việc vận hành hệ thống phòng thủ của Căn cứ sao, thắt chặt an ninh cho cả hệ sao."
 leader_trait_guardian_2:0 "Người Hộ vệ II"
 leader_trait_guardian_2_desc:0 "$leader_trait_guardian_desc$"
 leader_trait_conscripter:1 "Sĩ quan Quân dịch"
 leader_trait_conscripter_desc:1 "Nhà lãnh đạo này rất rành cách đối phó với tân binh, giúp đẩy nhanh tiến độ nạp dòng máu mới vào lực lượng."
 leader_trait_interrogator:0 "Chuyên gia Thẩm vấn"
 leader_trait_interrogator_effect:1 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$$INTEL$ đối với Đế chế thù địch: §G+15§!"
 leader_trait_interrogator_desc:1 "Nhà lãnh đạo này sẽ cạy miệng tù binh địch bằng mọi giá để moi ra những thông tin tình báo đắt giá."
 leader_trait_interrogator_2_effect:1 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$$INTEL$ đối với Đế chế thù địch: §G+30§!"
 leader_trait_interrogator_3_effect:1 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$$INTEL$ đối với Đế chế thù địch: §G+30§!"
 leader_trait_industrial_espionage:1 "Gián điệp Công nghệ"
 leader_trait_industrial_espionage_effect:0 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$Tỉ lệ đánh cắp được các tùy chọn nghiên cứu: §Y5%§!\n$ttt$Với mỗi $job_researcher$ £job_researcher£ trên hành tinh:\n$tttt$Tỉ lệ: §G+5%§!"
 leader_trait_industrial_espionage_desc:1 "Nhà lãnh đạo này sẽ bòn rút mọi dữ liệu có giá trị từ những hành tinh vừa bị chinh phục."
 leader_trait_industrial_espionage_2:0 "$leader_trait_industrial_espionage$ II"
 leader_trait_industrial_espionage_2_effect:0 "$ARMY_EFFECTS_TXT$:\n$t$Khi tấn công thắng lợi trên bộ:\n$tt$Đánh cắp §YCông nghệ§! £research£: §Y5%§!\n$ttt$Với mỗi $job_researcher$ £job_researcher£ trên hành tinh:\n$tttt$Tỉ lệ: §G+5%§!\n$tttt$Tiến độ nghiên cứu ban đầu: §G+5%§!"
 leader_trait_industrial_espionage_2_desc:0 "$leader_trait_industrial_espionage_desc$"
 leader_trait_crusader:0 "Chiến binh Vệ đạo"
 leader_trait_crusader_effect: "$FLEET_EFFECTS_TXT$:\n$t$$EVERY_ENEMY_SHIP_DESTROYED_TXT$:\n$tt$$r_unity$: §G+$@trait_crusader_fleet_amt|1$§!$PER_5_NAVAL_CAP_TXT$\n\n$ARMY_EFFECTS_TXT$:\n$t$$EVERY_ARMY_KILLED_TXT$:\n$tt$$r_unity$: §G+25§!"
 leader_trait_crusader_desc:2 "Nhà lãnh đạo này chuyên tâm tiêu diệt kẻ thù của chúng ta. Sự cống hiến cho đại nghiệp của [Root.GetHisHerCap] là không gì lay chuyển được."
 leader_trait_crusader_2:0 "$leader_trait_crusader$ II"
 leader_trait_crusader_2_effect: "$FLEET_EFFECTS_TXT$:\n$t$$EVERY_ENEMY_SHIP_DESTROYED_TXT$:\n$tt$$r_unity$: §G+$@trait_crusader_2_fleet_amt|1$§!$PER_5_NAVAL_CAP_TXT$\n\n$ARMY_EFFECTS_TXT$:\n$t$$EVERY_ARMY_KILLED_TXT$:\n$tt$$r_unity$: §G+40§!"
 leader_trait_crusader_2_desc:0 "$leader_trait_crusader_desc$"
 leader_trait_crusader_3_effect: "$FLEET_EFFECTS_TXT$:\n$t$$MOD_DAMAGE_VS_RIVAL_MULT$: §G+15%§!\n$t$$EVERY_ENEMY_SHIP_DESTROYED_TXT$:\n$tt$$r_unity$: §G+$@trait_crusader_2_fleet_amt|0$§!\n\n$ARMY_EFFECTS_TXT$:\n$t$$MOD_ARMY_DAMAGE_MULT$: §G+10%§!\n$t$$MOD_ARMY_MORALE$: §G+25%§!\n$t$$EVERY_ARMY_KILLED_TXT$:\n$tt$$r_unity$: §G+40§!"
 leader_trait_uninspiring: "Thiếu Sức hút"
 leader_trait_uninspiring_desc:1 "Nhà lãnh đạo này quá nhạt nhẽo và chẳng biết cách ban thưởng hay trừng phạt, khiến binh lính mất sạch nhuệ khí chiến đấu."
 leader_trait_slothful: "Lười biếng Ỷ lại"
 leader_trait_slothful_desc:1 "Nhà lãnh đạo này chẳng buồn tổ chức diễn tập quân sự, làm bào mòn sức chiến đấu của quân đội do [Root.GetHisHer] chỉ huy."
 leader_trait_victory_or_death:2 "Coi Mạng người như Cỏ rác"
 leader_trait_victory_or_death_desc:1 "Nhà lãnh đạo này chả mảy may xót thương tính mạng binh sĩ của mình, sẵn sàng lùa họ vào chỗ chết chỉ để đổi lấy công danh phù phiếm."
 leader_trait_disorganized: "Kỷ luật Lỏng lẻo"
 leader_trait_disorganized_desc:1 "Thiếu năng lực điều binh khiển tướng, đạo quân dưới trướng nhà lãnh đạo này trông giống một lũ thảo khấu vô tổ chức hơn là quân chính quy."
 leader_trait_lawless:1 "Kẻ Ngoài vòng Pháp luật"
 leader_trait_lawless_desc:1 "Thực chất nhà lãnh đạo này chỉ là một con rối bị thao túng bởi các băng đảng và hải tặc."
 leader_trait_defence_engineer:0 "Kỹ sư Phòng thủ"
 leader_trait_defence_engineer_desc:0 "Nhà lãnh đạo này chuyên gia cố các ụ phòng thủ quỹ đạo thành một bức tường than thở mà không kẻ tấn công nào có thể vượt qua và sống sót."
 leader_trait_defence_engineer_2:0 "$leader_trait_defence_engineer$ II"
 leader_trait_defence_engineer_desc_2:0 "$leader_trait_defence_engineer_desc$"
 leader_trait_shadow_broker:0 "Người Môi giới trong Bóng tối"
 leader_trait_shadow_broker_desc:1 "Nhà lãnh đạo này nuôi dưỡng một mạng lưới điệp vụ ngầm, sẵn sàng tuân lệnh bất cứ lúc nào."

 # Destiny Traits
 # Generic
 leader_trait_educator:0 "Người Thầy Sắc sảo"
 leader_trait_educator_desc:1 "Kiến thức và kinh nghiệm là nền móng để xây đắp nên mọi xã hội vĩ đại. Nhận thức rõ giá trị đó, nhà lãnh đạo này luôn dốc sức truyền bá và khơi dậy những giá trị này ở người khác."
 leader_trait_master_bureaucrat:0 "Cáo già Chốn Quan trường"
 leader_trait_master_bureaucrat_desc:1 "Lăn lộn nhiều năm nơi quan lộ, nhà lãnh đạo này dư sức xử lý êm đẹp đống giấy tờ ngập đầu. Việc gì qua tay cũng được giải quyết ổn thỏa, giúp cấp dưới bớt được gánh nặng."
 # Governor
 leader_trait_shroud_preacher:0 "Kẻ Truyền đạo Cõi Hư vô"
 leader_trait_shroud_preacher_effect:1 "$t$Mỗi §Y10 năm§! sẽ ban cho §Y100§! §Hdân cư§! £pop£ đặc điểm §Y$trait_latent_psionic$§!."
 leader_trait_shroud_preacher_desc:1 "Cõi Hư vô bao trùm vạn vật mang sinh mệnh. Nhờ khả năng hòa nhịp cùng thứ năng lượng đó, nhà lãnh đạo này có thể che chở tận tình cho những người theo gót mình."
 leader_trait_master_diplomat:0 "Bậc thầy Ngoại giao"
 leader_trait_master_diplomat_desc:1 "Từng có nhiều năm chung mâm với các sứ thần tại tòa đại sứ, nhà lãnh đạo này rành rẽ từng sắc thái nhỏ trong nghi lễ của các nền văn hóa, khéo léo duy trì mạng lưới quan hệ với các viên chức cấp cao của những Đế chế láng giềng."
 leader_trait_supreme_organizer:0 "Kẻ Giật dây"
 leader_trait_supreme_organizer_desc:1 "Với việc thiết quân luật lên các sự vụ quốc gia, nhà lãnh đạo này chễm chệ ngồi giữa mê cung chằng chịt các điều luật và quy trình hành chính, tất cả đều được tính toán hòng củng cố quyền lực cá nhân."
 leader_trait_aturion_organizer:0 "Hiệu năng của Aturion"
 leader_trait_aturion_organizer_desc:0 "$leader_trait_supreme_organizer_desc$"
 leader_trait_arbiter:0 "Nhà Phát triển Tàn khốc"
 leader_trait_arbiter_desc:1 "Nhà lãnh đạo này sẵn sàng dùng bàn tay sắt và phớt lờ mọi quy tắc an toàn để đẩy sản lượng lên mức kỷ lục, cái giá phải trả là tuổi thọ sụt giảm và những cuộc đình công thỉnh thoảng nổ ra. Có điều, chỉ cần đàn áp thẳng tay thì chút rắc rối cỏn con ấy chẳng bõ bèn gì."
 trait_ruler_fertility_preacher_2:0 "$trait_ruler_fertility_preacher$ II"
 trait_ruler_fertility_preacher_2_desc:0 "$trait_ruler_fertility_preacher_desc$"
 leader_trait_automation_champion:0 "Tiên phong Tự động hóa"
 leader_trait_automation_champion_desc:1 "Với nhà lãnh đạo này, tối ưu hóa là sinh mệnh. Và tự động hóa chính là chìa khóa. Mọi thứ đều có thể tự động. Từ những dàn robot tân tiến cho đến các cỗ máy thô sơ, miễn tự động được là làm."
 leader_trait_expert_survivalist:0 "Chuyên gia Sinh tồn"
 leader_trait_expert_survivalist_desc:1 "Rất ít người thấu hiểu nghệ thuật sinh tồn như nhà lãnh đạo này, kẻ biết cách bám trụ ở những môi trường khắc nghiệt và độc hại nhất, dọn đường cho dân di cư mới đến định cư vững vàng."
 leader_trait_utopian_idealist:0 "Người Mơ mộng Không tưởng"
 leader_trait_utopian_idealist_desc:1 "Khát vọng xây dựng một xã hội địa đàng lý tưởng là thứ nhiều người mơ ước. Còn nhà lãnh đạo này thì biến nó thành hiện thực."
 leader_trait_mediator:0 "Người Hòa giải Đa chủng tộc"
 leader_trait_mediator_desc:1 "Một chuyên gia hòa giải lão luyện là mảnh ghép tối quan trọng tại các trung tâm đa dạng sắc tộc. Nhà lãnh đạo này biết cách xoa dịu những cái đầu nóng, điều hành mượt mà một hành tinh ngập tràn đủ loại giống loài."
 leader_trait_mediator_effect:1 "$PLANET_EFFECTS_TXT$:\nVới mỗi giống loài trên hành tinh, $t$$BONUS_WORKFORCE_FOR$['concept_planet_influential'] §G+2%§!\n$t$Với mỗi giống loài trên hành tinh, §Y$MOD_POP_HAPPINESS$§! §G+2%§!\n\n$SECTOR_EFFECTS_TXT$:\nVới mỗi giống loài trên hành tinh, $t$$BONUS_WORKFORCE_FOR$['concept_planet_influential'] §G+1%§!\nVới mỗi giống loài trên hành tinh, $t$§Y$MOD_POP_HAPPINESS$§! §G+1%§!"
 leader_trait_efficient:0 "Nhà Ban ơn Tinh hoa"
 leader_trait_efficient_desc:1 "Xuất thân từ tầng lớp thượng lưu, nhà lãnh đạo này cực kỳ tin tưởng vào giá trị bản thân, quyết một lòng bảo vệ quyền lợi cho giai cấp quyền quý."
 leader_trait_galvanizer:0 "Người Thắp lửa"
 leader_trait_galvanizer_effect_non_gestalt:1 "$PLANET_EFFECTS_TXT$:\n$t$£unity£ $unity$ từ §HNhân công§! £pop£ đang làm việc: §G+0.50§!\n$t$£society£ $society_research$ từ §HNhân công§! £pop£ đang làm việc: §G+0.50§!\n$t$$r_trade$ từ mỗi $pop_group_unit$ §HNhân công§! £pop£ đang làm việc: §G+0.25§!"
 leader_trait_galvanizer_desc:1 "Sống có lý tưởng mang lại rất nhiều lợi ích. Nhà lãnh đạo này biết cách dẫn dắt công chúng, gieo vào lòng họ một lý tưởng chung để họ sôi sục xả thân theo đuổi."
 # Scientist
 leader_trait_great_researcher:0 "Nhà Nghiên cứu Vĩ đại"
 leader_trait_great_researcher_desc:1 "Trong một vài trường hợp hiếm hoi, thành quả của một cá nhân có thể vượt xa cả một đội ngũ nghiên cứu. Về khoản thiết kế thí nghiệm, tìm tòi giải pháp hay phát triển công nghệ mới, nhà lãnh đạo này đúng là một bậc thiên tài."
 leader_trait_deep_space_explorer:0 "Nhà Thám hiểm Không gian Sâu"
 leader_trait_deep_space_explorer_desc:1 "Trọng trách của các sĩ quan thám hiểm không gian sâu là khảo sát tới tận những hóc bò trang của thiên hà. Nhà lãnh đạo này chính là một nhà thám hiểm như thế, người được những trang bị tối tân nhất hậu thuẫn để sải bước vào cõi hư vô."
 leader_trait_xeno_cataloger:0 "Chuyên gia Phân loại Ngoại lai"
 leader_trait_xeno_cataloger_desc:1 "Nhà lãnh đạo này chuyên lo việc dò tìm, nhận diện và phân loại các sinh vật ngoại lai. Mọi dữ liệu thu về đều được đem lên bàn mổ xẻ để lường trước những hiểm họa hoặc các mối lây nhiễm có thể rình rập sau này."
 leader_trait_xeno_cataloger_effect:1 "$t$Khi hoàn tất khảo sát:\n$tt$Nhận được lượng £unity£ §Y$unity$§! tương đương 3 tháng sản lượng!"
 leader_trait_frontier_adventurer:0 "Kẻ Mạo hiểm Nơi Biên viễn"
 leader_trait_frontier_adventurer_desc:1 "Sục sạo những hệ sao mới, săn lùng những hành tinh lạ, và bới móc các nền văn minh bị lãng quên – đó mới là lẽ sống của một nhà thám hiểm thực thụ. Nhà lãnh đạo này chính là biểu tượng cho tinh thần ấy, luôn xê dịch để săn lùng những nguồn tri thức thất truyền hay tàn tích ngủ yên."
 leader_trait_frontier_adventurer_effect:1 "$t$Khi hoàn tất khảo sát:\n$tt$Nhận được lượng £society£ §Y$society_research$§! tương đương 3 tháng sản lượng!"
 leader_trait_brilliant_shipwright:0 "Kỹ sư Đóng tàu Kiệt xuất"
 leader_trait_brilliant_shipwright_desc:1 "Nhà lãnh đạo này sành sỏi nghề đóng tàu tận chân tơ kẽ tóc, không chỉ gánh vác việc nghiên cứu công nghệ mới mà còn một tay cai quản toàn bộ xưởng đóng tàu của chúng ta."
 leader_trait_truth_seeker:0 "Kẻ Mưu cầu Chân lý"
 leader_trait_truth_seeker_desc:1 "Mưu cầu chân lý là phải dỡ bỏ mọi rào cản trong tâm trí, để dang tay đón nhận những luồng khả năng xa vời tầm mắt, thậm chí là vượt ngoài thực tại. Nhà lãnh đạo này mang một khao khát cuồng nhiệt, sẵn sàng bất chấp mọi rủi ro để lột trần từng bí ẩn của vũ trụ."
 leader_trait_surveyor:0 "Chuyên viên Phân tích Hành tinh"
 leader_trait_surveyor_desc:1 "Sau chuỗi ngày dài ăn nằm tại thực địa, kết hợp cùng công nghệ khảo sát và tự động hóa, nhà lãnh đạo này đã nâng tầm việc đo đạc hành tinh lên thành một môn nghệ thuật."
 leader_trait_surveyor_tt:0 "$ASSIST_RESEARCH_EFFECTS_TXT$:\n$t$$mod_planet_districts_generator_physics_research_produces_add$: §G+3§!\n$t$$mod_planet_districts_farming_society_research_produces_add$: §G+3§!\n$t$$mod_planet_districts_mining_engineering_research_produces_add$: §G+3§!"
 leader_trait_repair_crew:1 "Kỹ sư Bẩm sinh"
 leader_trait_repair_crew_effect:0 "$SYSTEM_EFFECTS_TXT$:\n$t$Tàu đồng minh trong hệ sao:\n$tt$Phục hồi Điểm Thân tàu mỗi tháng: §G+10%§!"
 leader_trait_repair_crew_desc:1 "Được sinh ra như để vọc vạch sửa chữa và lớn lên ngay tại khoang kỹ thuật, nhà lãnh đạo này dường như hô biến mọi món đồ sứt mẻ trở lại như mới. Chính thứ thiên phú ấy biến [Root.GetHeShe] thành tay thợ lành nghề, có thể chăm bẵm hạm đội ngon ơ mà chẳng cần đụng đến xưởng đóng tàu."
 leader_trait_robotist:1 "Ông hoàng Robot"
 leader_trait_robotist_desc:1 "Nhà lãnh đạo này là cây đại thụ trong làng thiết kế và chế tạo robot, luôn phá vỡ mọi giới hạn. Hầu hết các bước tiến vĩ đại trong giới người máy đều in đậm dấu ấn của cá nhân này."
 leader_trait_knowledge_for_the_masses:0 "Nhà Giáo dục Tận tụy"
 leader_trait_knowledge_for_the_masses_effect:0 "$t$Điểm nghiên cứu do dân cư tạo ra: §G+$@trait_knowledge_masses_research_amt$§!"
 leader_trait_knowledge_for_the_masses_desc:1 "Không có gì quan trọng hơn một nền giáo dục đàng hoàng. Nhà lãnh đạo này chẳng nề hà khó nhọc đi gọt giũa những bộ não trẻ, và đổi lại được hưởng trọn vẹn sự hỗ trợ từ tầng lớp tinh hoa ấy."
 # Admiral
 leader_trait_fanatic:0 "Kẻ Cuồng Chiến"
 leader_trait_fanatic_desc:1 "Đô đốc này cuồng dại trong việc tàn sát quân thù đến mức gần như mất trí. Dù rất mát tay trong khâu gieo rắc cái chết, nhưng sự cuồng loạn ấy thường châm ngòi cho thương vong thảm khốc ở cả hai phe."
 leader_trait_reverse_engineer:0 "Kẻ Mót Công nghệ"
 leader_trait_reverse_engineer_effect:1 "$NAVAL_BATTLE_WON_TXT$:\n$t$Tỉ lệ đánh cắp công nghệ: §Y33%§!\n$t$Tiến độ nghiên cứu ban đầu: §G+50%§!\n$t$Các nhánh khả dụng:\n$tt$£engineering_research£ §YĐộng lực Đẩy§!\n$tt$£physics_research£ §YVật lý Hạt§!"
 leader_trait_reverse_engineer_desc:0 "Đô đốc này có thói quen tọc mạch các loại công nghệ lạ lẫm, sở hữu nền tảng kiến thức sâu rộng cùng cái đầu cực nảy số, thường xuyên tận dụng những lúc giáp mặt với kẻ địch tân tiến hơn để học mót tại trận."
 leader_trait_supreme_admiral:0 "Chỉ huy Hạm đội Vô song"
 leader_trait_supreme_admiral_desc:1 "Đô đốc này là con quái vật trong mảng hậu cần và vạch định chiến lược, thừa sức lèo lái một hạm đội với quy mô bóp nghẹt mọi đồng cấp khác."
 leader_trait_armorer:0 "Thợ rèn Vũ khí Thiên tài"
 leader_trait_armorer_desc:1 "Nhà lãnh đạo này đã nặn ra phương thức gia cố vỏ giáp mới, hiếm có thứ vũ khí nào chọc thủng nổi những thân tàu được đúc từ bản vẽ của [Root.GetHisHer]."
 leader_trait_military_overseer:0 "Người Giám sát Quân sự"
 leader_trait_military_overseer_desc:1 "Xây dựng hải quân là một cửa ải đầy chông gai, đòi hỏi sự trù tính chu toàn và chuẩn mực gắt gao. Bề dày sương gió của nhà lãnh đạo này chính là một báu vật vô giá để nhào nặn nên một hạm đội bách chiến bách thắng."
 leader_trait_master_gunner:0 "Bậc thầy Súng ống"
 leader_trait_master_gunner_desc:1 "Đô đốc này dồn toàn lực vào việc nâng cấp vũ khí, luôn thúc ép cấp dưới phải giữ gìn súng đạn trong trạng thái hoàn hảo nhất."
 leader_trait_demolisher_destiny:1 "Chiếc Búa của Đế chế"
 leader_trait_demolisher_destiny_desc:1 "Nhà lãnh đạo này luôn rình đúng tử huyệt của kẻ địch mà đấm, khiến chúng phải toát mồ hôi hột nếu nhỡ đụng độ. Hạm đội hùng hậu dưới trướng [Root.GetHeShe] vung đòn với sức hủy diệt vô tiền khoáng hậu và độ sát thương chuẩn xác tới rợn người, hiếm kẻ nào chịu thấu."
 leader_trait_destiny_engineer:0 "Chỉ huy Bảo trì"
 leader_trait_destiny_engineer_desc:0 "Trong thủy chiến không gian, một vết xước cũng có thể đoạt mạng. Nhà lãnh đạo này bắt tuân thủ răm rắp các điều lệ bảo dưỡng khắt khe để đảm bảo hạm đội luôn ngự trị ở phong độ đỉnh cao."
 leader_trait_guerilla_tactics:0 "Bậc thầy Du kích"
 leader_trait_guerilla_tactics_desc:1 "Hạm đội to xác chưa chắc đã ngon ăn. Đô đốc này biệt tài dẫn dắt các cụm tàu nhỏ lẻ, lấy sự lanh lẹ uyển chuyển lấn lướt bầy thú khổng lồ cục mịch của đối phương."
 leader_trait_survivalist:0 "Tấm Khiên của Đế chế"
 leader_trait_survivalist_desc:1 "Đúng chất một kẻ hộ giá, Đô đốc này sừng sững tựa một rào chắn bất hoại nơi tiền tuyến, đè bẹp bất cứ kẻ nào dám ló mặt dòm ngó bờ cõi."
 leader_trait_maven_of_war:0 "Kiến trúc sư Chiến tranh"
 leader_trait_maven_of_war_desc:1 "Được đội chiếc vương miện này là một vinh dự tột bậc. Những vị Đô đốc cỡ này không chỉ uyên thâm mưu lược, mà còn là mắt xích xương sống trong việc gắn kết cỗ máy quân sự với các đầu não khoa học."
 leader_trait_peacekeeper:0 "Người Gìn giữ Hòa bình"
 leader_trait_peacekeeper_desc:1 "Nhà lãnh đạo này nhận thức rõ, muốn yên bình thì lưới phải giăng cho rộng. Một vị Đô đốc cự phách luôn để mắt truy lùng đám bất mãn, lũ hải tặc, hay cả mấy tay cò con chực chờ ăn bám trên các tuyến thông thương."
 # General
 leader_trait_supreme_warrior:0 "Chiến binh Tối thượng"
 leader_trait_supreme_warrior_effect:0 "$t$Cứ sau mỗi §Y10§! ngày giao tranh trên bộ:\n$tt$Tỉ lệ xử tử ngay tắp lự một đơn vị Lục quân địch: §Y15%§!"
 leader_trait_supreme_warrior_desc:1 "Nhà lãnh đạo này thuộc về nhóm tinh anh hiếm hoi ẵm được danh xưng này. Bằng việc xông pha trận mạc, họ truyền lửa cho binh sĩ, dìm chết quân thù hung bạo nhất."
 leader_trait_fortress_cracker:0 "Gọng kìm Phá Cốt"
 leader_trait_fortress_cracker_desc:1 "Nhai nát một lô cốt sừng sững là bài toán đòi hỏi cả cơ bắp, mưu mẹo lẫn kinh nghiệm. Viên tướng này đặc biệt khoái lao đầu vào chỗ chết, tận hưởng khoái cảm đắc thắng ở nơi những kẻ tầm thường đành bó tay."
 leader_trait_chainbreaker:0 "Kẻ Đập tan Gông cùm"
 leader_trait_chainbreaker_desc:1 "Mọi sinh linh có tư duy đều không đáng bị cầm tù hay bị vắt kiệt như loài súc vật. Oai danh của nhà lãnh đạo này bay xa, hễ cất lời triệu gọi là tầng lớp nô lệ cần lao lại vùng lên cầm vũ khí mà chiến đấu."
 leader_trait_chainbreaker_effect:0 "$t$Mỗi §Y$pop_cat_slave$§! trên hành tinh bị tấn công có 70% tỉ lệ sinh ra §G1§! Lục quân"
 leader_trait_honored_warmaster:0 "Lão tướng Vinh quang"
 leader_trait_honored_warmaster_desc:1 "Lão tướng Vinh quang là danh hiệu dành cho bậc tướng quân lẫy lừng. Nhà lãnh đạo này gieo rắc lòng kiêu hãnh và nhuệ khí cho dân chúng, nung nấu trong họ khao khát ra trận tòng quân."
 leader_trait_honored_warmaster_effect:0 "$PLANET_EFFECTS_WHILE_DEFENDING_TXT$\n$t$Mỗi §Y100§! §HDân cư không phải nô lệ§! £pop£ sinh ra §G1§! Lực lượng Phòng thủ"
 leader_trait_pilferer:0 "Lãnh chúa Khấu tặc"
 leader_trait_pilferer_effect:1 "$ARMY_EFFECTS_TXT$: §EThắng lợi§! trong §YTrận đánh trên bộ§!:\n$t$Mỗi §YKhu vực§! £district£ đem lại số lượng tài nguyên tương ứng:\n$tt$§G+100§! §YTài nguyên cơ bản§! £energy£ £minerals£ £food£\n$tt$§G+50§! §YTài nguyên bậc cao§! £alloys£ £consumer_goods£\n$tt$§G+25§! §YĐiểm nghiên cứu§! £physics£ £society£ £engineering£"
 leader_trait_tzrynn_tithe: "Khoản Thu Tzrynn"
 leader_trait_tzrynn_tithe_desc: "Theo tập tục của Tzrynnia, kẻ chiến thắng trong bất kỳ cuộc xô xát nào sẽ cuỗm đi một phần ba những món đồ quý giá nhất của phe thua cuộc. Kiya Zumon đã giữ gìn nề nếp đó đến tận ngày nay."
 leader_trait_pilferer_desc:1 "Hành tinh càng trù phú, chiến lợi phẩm càng kếch xù, và nhà lãnh đạo này nhạy bén đánh hơi được cách để tước đoạt chúng với cái giá bèo bọt nhất."
 leader_trait_taskmaster:0 "Đại Đốc công"
 leader_trait_taskmaster_desc:1 "Đốc công không chỉ lo tính bề binh cơ, mà còn chăm chút từ bữa ăn giấc ngủ của binh sĩ dưới trướng."
 leader_trait_spymaster:0 "Kẻ Ngự trong Bóng tối"
 leader_trait_spymaster_desc:1 "Chỉ gắn mác điệp viên cho nhà lãnh đạo này là một sự sỉ nhục. Kì thực [Root.GetHeShe] đang thao túng một đường dây dằng dịt từ chân rết, dân buôn lậu đến đám đao phủ. Lúc nào cần ngấm ngầm bóp nghẹt mục tiêu, đây sẽ là quân cờ sát thủ."
 leader_trait_totalitarian:0 "Quan Chưởng lễ Đế quốc"
 leader_trait_totalitarian_desc:2 "Quan Chưởng lễ Đế quốc là tấm bài vị của quyền lực và danh vọng, gánh vác trọng trách xương máu cho quốc gia. Vị sứ thần này sắm vai chiếc cầu nối gắn kết niềm tin giữa Tông chủ và Chư hầu."
 leader_trait_bellicose:0 "Quan Quân nhu Khả kính"
 leader_trait_bellicose_effect: "$EMPIRE_EFFECTS_TXT$:\n$t$Mỗi 100 [Leader.GetLeaderSoldierJobType]:\n$tt$$MOD_COUNTRY_NAVAL_CAP_ADD$: §G+$@bellicose_naval_cap_add|1$§!\n$tt$$MOD_DEFENSE_ARMIES_ADD$: §G+$@bellicose_defense_armies_add|1$§!"
 leader_trait_bellicose_desc:1 "Vị chỉ huy này như được thần linh phù hộ về khoản hậu cần, có thể dùng những mẹo vặt nhẹ nhàng để bơm phồng hiệu suất cho các hoạt động quân sự."

 # Special Traits
 leader_trait_erudite: "Uyên bác"
 leader_trait_erudite_desc:1 "Nhà lãnh đạo này sở hữu IQ ngất ngưởng và một kho tàng trí tuệ khổng lồ."
 leader_trait_cyborg: "Người Cơ khí"
 leader_trait_cyborg_desc:0 "Nhà lãnh đạo này đã được cường hóa toàn diện thông qua các mô cấy ghép thần kinh điện tử."
 leader_trait_synthetic: "Người Tổng hợp"
 leader_trait_synthetic_desc:0 "Nhà lãnh đạo Người Tổng hợp này vừa được lắp đặt một gói đại tu linh kiện."
 leader_trait_psionic:0 "Thể Tâm linh"
 leader_trait_psionic_desc:1 "Nhà lãnh đạo này mang quyền năng ngoại cảm kinh hồn."
 leader_trait_chosen: "[GetChosenName]"
 leader_trait_chosen_desc: "[GetChosenDesc]"
 leader_trait_chosen_default: "Kẻ Được Chọn"
 leader_trait_chosen_default_desc: "Nhà lãnh đạo này là $leader_trait_chosen$, một thực thể bất tử mang quyền năng tâm linh cái thế."
 leader_trait_chosen_gestalt: "Vỏ Bọc Được Chọn"
 leader_trait_chosen_gestalt_desc: "Nhà lãnh đạo này là $leader_trait_chosen_gestalt$, một thực thể bất tử mang quyền năng tâm linh cái thế."
 leader_trait_whisperers_chosen:0 "Sứ giả Lời Thì thầm"
 leader_trait_whisperers_chosen_desc:1 "Nhà lãnh đạo này đã được thần linh điểm mặt gọi tên, được trao quyền trượng từ một thế lực bí ẩn nơi Cõi Hư vô. Khoác trên mình lớp chiến giáp tâm linh bất hoại, cửa tử đã vĩnh viễn đóng sập với kẻ này."
 leader_trait_eater_chosen:0 "Sứ giả Thực thể Nuốt chửng"
 leader_trait_eater_chosen_desc:0 "$leader_trait_whisperers_chosen_desc$"
 leader_trait_composer_chosen:0 "Sứ giả Thực thể Đan dệt"
 leader_trait_composer_chosen_desc:0 "$leader_trait_whisperers_chosen_desc$"
 leader_trait_instrument_chosen:0 "Sứ giả Kẻ Chi phối"
 leader_trait_instrument_chosen_desc:0 "$leader_trait_whisperers_chosen_desc$"

