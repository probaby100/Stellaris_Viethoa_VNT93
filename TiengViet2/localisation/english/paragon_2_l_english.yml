 RECRUIT_LEADER_AT_CAP_DESC:1 "Tuyển dụng lãnh đạo này sẽ vượt quá giới hạn, làm tăng phí bảo trì và giảm lượng kinh nghiệm nhận được của mọi lãnh đạo.\n\nChi phí: $COST|Y$\nPhí bảo trì hàng tháng: §Y[Root.GetUpkeep]§!."
 RECRUIT_LEADER_AT_CAP_DESC_NO_UPKEEP: "Tuyển dụng lãnh đạo này sẽ khiến bạn vượt giới hạn, gây phạt lên phí bảo trì và lượng kinh nghiệm nhận được của mọi lãnh đạo.\n\nLãnh đạo này sẽ tiêu tốn $COST|Y$."
 RECRUIT_LEADER_ALREADY_OVER_CAP_TITLE:0 "Vượt giới hạn lãnh đạo"
 RECRUIT_LEADER_ALREADY_OVER_CAP_DESC:1 "Bạn đã vượt giới hạn lãnh đạo. Tuyển thêm người này sẽ tiếp tục làm tăng phí bảo trì và giảm lượng kinh nghiệm nhận được.\n\nChi phí: $COST|Y$.\nPhí bảo trì hàng tháng: §Y[Root.GetUpkeep]§!."
 RECRUIT_LEADER_ALREADY_OVER_CAP_DESC_NO_UPKEEP: "Bạn đã vượt giới hạn lãnh đạo. Tuyển thêm người này sẽ tiếp tục làm tăng phí bảo trì và giảm lượng kinh nghiệm nhận được.\n\nChi phí: $COST|Y$."
