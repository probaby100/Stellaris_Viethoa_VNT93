 LEADER_STATUS_DESC:0 "[Root.LeaderAssignDesc]"
 leader_desc_commander: "§E§HChỉ huy§! có thể được giao quản lý một §Hhạm đội§! hoặc §Hquân đội§!, hoặc giám sát một §Hhành tinh§!, đồng thời có thể nắm giữ một §Hghế nội các§! đang có hiệu lực.§!"
 leader_desc_admiral:0 "§E§HĐô đốc§! có thể được giao quản lý một §Hhạm đội§!, đồng thời có thể nắm giữ một §Hghế nội các§! đang có hiệu lực.§!"
 leader_desc_scientist: "§E§HNhà khoa học§! có thể được giao điều khiển một §Htàu khoa học§! hoặc giám sát một §Hhành tinh§!, đồng thời có thể nắm giữ một §Hghế nội các§! đang có hiệu lực.§!"
 leader_desc_general:0 "§E§HTướng lĩnh§! có thể được giao chỉ huy một §Hlực lượng tấn công§!, đồng thời có thể nắm giữ một §Hghế nội các§! đang có hiệu lực.§!"
 leader_desc_governor:0 "§E§HThống đốc§! có thể được giao cai quản một §Hhành tinh§!, đồng thời có thể nắm giữ một §Hghế nội các§! đang có hiệu lực.§!"
 leader_desc_official: "§E§H$official_plural$§! có thể được cử đại diện tại §HLiên bang§! hoặc §H[GetCommunityOrImperium]§!, hoặc giám sát một §Hhành tinh§!, đồng thời có thể nắm giữ một §Hghế nội các§! đang có hiệu lực.§!"

