 marauder.15.1.desc:0 "Lũ ngoại bang. Chúng ta là [encountered_marauder.GetSpeciesNamePlural]. Không giống như các quốc gia tinh cầu \"văn minh\" của thiên hà, chúng ta không có một chủ nhân duy nhất thống trị, nhưng ta đã được chọn để chuyển thông điệp này đến các ngươi thay mặt cho toàn bộ các Gia Tộc:\n\nĐừng cố áp đặt những cách thức yếu đuối và nhu nhược của các ngươi lên chúng ta. Các ngươi có thể tự do gửi chiến hạm vào lãnh thổ của [encountered_marauder.GetSpeciesName], nhưng đừng mong chúng quay trở về. Tuy nhiên, các chiến binh của chúng ta sẽ rất hoan nghênh trò giải trí này.\n\nChỉ truyền tin trên tần số này nếu các ngươi muốn cống nạp... hoặc nếu các ngươi cần lính đánh thuê và có đủ của cải để chi trả."
 marauder.15.2.desc:0 "HYEEEIIIIEEEE!!!! Lại thêm dwamak!\n\nNgươi muốn gì hả tên dwamak ngu xuẩn? Có chuyện gì khiến mặt ngươi biến dạng thế kia? Tai nạn lò phản ứng? Phơi nhiễm chân không? HYEEIIIEE!! Nhìn ngươi kìa!\n\nChúng ta là [encountered_marauder.GetSpeciesNamePlural]. Chúng ta săn lùng dwamak. Nếu ngươi dám bén mảng vào địa bàn của [encountered_marauder.GetSpeciesName], chúng ta sẽ nấu món hầm dwamak. Không tốt cho ngươi đâu, hiểu chứ? HYEEIIIIIEEEEE!!\n\nCó lẽ ngươi biết các dwamak khác. Có lẽ ngươi muốn chúng biến thành món hầm dwamak. Điều này có thể thu xếp được. [encountered_marauder.GetSpeciesNamePlural] không ngại chiến đấu vì lũ dwamak chống lại lũ dwamak khác, nếu giá cả phải chăng."
 marauder.15.3.desc:0 "Chúng ta là [encountered_marauder.GetSpeciesNamePlural], và chúng ta là những bầy tôi được ưu ái của §HBà Chúa Hư Không§!; Đấng Toàn Năng, Toàn Tri và trên hết là Đấng Báo Thù tối cao thống trị Không Gian.\n\nChính Người đã ra lệnh cho chúng ta từ bỏ mái nhà hành tinh tổ tiên từ thuở xa xưa, để đến định cư nơi lãnh địa vĩnh hằng của Người - khoảng không sâu thẳm lạnh giá - để chúng ta có thể săn lùng những kẻ ngoại đạo và xoa dịu Người qua sự hiến tế.\n\nThan ôi, những Cuộc Chiến Giáo Lý đã làm hao mòn sức mạnh của chúng ta và giờ đây chúng ta là một dân tộc bị chia rẽ, đang chật vật tìm kiếm con đường chân chính mà Người muốn chúng ta bước đi. Dù vậy, sự ưu ái của Người có thể giành được thông qua việc tiêu diệt những kẻ dị giáo ngoại tộc - ngay cả khi theo lệnh của những kẻ dị giáo khác. Do đó, nhiều chiến binh của chúng ta sẵn sàng chiến đấu cho các ngươi, với một cái giá xứng đáng..."
 marauder.15.a:0 "Chấm dứt đường truyền."

