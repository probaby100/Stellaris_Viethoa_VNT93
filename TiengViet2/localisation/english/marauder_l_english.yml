 gov_marauder_khanate:0 "Hãn Quốc Marauder"
 gov_marauder_khanate_desc:0 "Một đế chế thống nhất bao gồm các bộ tộc marauder khác nhau, tất cả đều đã tuyên thệ trung thành với một Đại Hãn duy nhất."
 gov_successor_khanate:0 "Hãn Quốc Kế Thừa"
 gov_successor_khanate_desc:0 "Một quốc gia kế thừa đang cố gắng tái hiện lại vinh quang của đế chế Đại Hãn."
 RT_GREAT_KHAN:0 "Đại Hãn"
