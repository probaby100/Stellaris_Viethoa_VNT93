 civic_great_khans_vision_desc:0 "Đại Hãn phóng tầm mắt khắp thiên hà. Và cả thiên hà phải quỳ gối."
 gov_diadochi:0 "Quốc Gia Kế Nghiệp"
 gov_diadochi_desc:0 "Một quốc gia kế thừa được thành lập bởi một trong các Diadochi, những tướng lĩnh quân phiệt chủ chốt của cố Đại Hãn."
