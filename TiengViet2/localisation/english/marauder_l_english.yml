l_english:

 marauder.1.name:1 "Chạm Trán [encountered_marauder.GetRealName]"
 marauder.1.desc:1 "Sau khi giải mã thứ được coi là ngôn ngữ giữa bọn họ, [This.Owner.GetEnvoy] [This.Leader.GetName] đã xác định §H[encountered_marauder.GetName]§! là một nền văn minh du mục mang tên §H[encountered_marauder.GetRealName]§!. Họ chiếm cứ một số trạm vũ trụ lớn trong và xung quanh hệ sao §H[marauder_system.GetName]§!, nơi cư trú phần lớn dân số đông đúc trong điều kiện chật chội và bẩn thỉu. Dù vậy, hoặc có lẽ nhờ vậy, họ dường như đã phát triển một nền văn hóa thượng võ mạnh mẽ. Cuộc sống nơi khoảng không lạnh giá đã trở thành bản tính thứ hai của họ, và họ cực kỳ thiện chiến trong tác chiến không gian.\n\nKhông có một chính phủ trung ương [encountered_marauder.GetSpeciesName] nào đáng kể. Thay vào đó, họ chia thành nhiều phe phái khác nhau tranh giành tài nguyên và danh dự không ngừng nghỉ. Với dân số đông đảo và năng lực đóng tàu của các trạm không gian, chính những cuộc nội chiến liên miên này là điều duy nhất ngăn cản họ trở thành mối đe dọa lớn đối với nền hòa bình thiên hà."
 marauder.1.a:0 "Cố gắng liên lạc với họ."
 marauder.3.name:0 "Phát Hiện Chiến Binh [From.GetSpeciesName]"
 marauder.3.desc:0 "Nhiều tháng qua, chúng ta liên tục nhận được những báo cáo rải rác về một số lượng nhỏ lính đánh thuê và tàu cướp biển ngoại tộc hoạt động tại biên giới không gian của chúng ta. Họ tự xưng là §H[From.GetSpeciesNamePlural]§!, dường như là những kẻ lưu đày từ một nền văn hóa chiến binh du mục cư ngụ trên các trạm không gian quá tải trong và quanh hệ sao §H[marauder_system.GetName]§!.\n\nViệc họ đi qua gần lãnh thổ của chúng ta diễn ra không có sự cố nào, nhưng họ đã cảnh báo chúng ta không được xâm phạm [marauder_system.GetName]. Không có một chính phủ trung ương [From.GetSpeciesName] nào để thương lượng, nhưng các phe phái của họ thường xuyên xâu xé lẫn nhau và hay phát động các cuộc đột kích vào những hệ sao láng giềng. Quả thực, với dân số khổng lồ cùng năng lực sản xuất trên không gian, [From.GetSpeciesNamePlural] hẳn đã trở thành một thế lực lớn trong thiên hà nếu họ chịu ngừng chém giết lẫn nhau."
 marauder.5.name:0 "Hồi Kết Của [From.GetName]"
 marauder.5.desc:0 "Nền văn hóa chiến binh du mục từng một thời kiêu hãnh của §H[From.GetSpeciesNamePlural]§! đã không còn nữa. Các lực lượng từ §H[marauder_killer.GetName]§! đã phá hủy trạm không gian khổng lồ cuối cùng chứa phần lớn dân cư của họ. Những người tị nạn từ thường dân còn sống sót đã phân tán khắp thiên hà.\n\nDù một số hạm đội hải tặc và lính đánh thuê [From.GetSpeciesName] có thể vẫn chưa bị tiêu diệt, việc mất đi các nơi cư trú không gian là một đòn giáng chí tử mà họ không thể gượng dậy nổi. Điều này đặt dấu chấm hết vĩnh viễn cho những cuộc đột kích của họ."
 marauder.5.a:0 "Đúng vậy."
 marauder.6.name:0 "Sự Báo Thù Của [marauder_species.GetNamePlural]"
 marauder.6.desc:0 "Một hạm đội lính đánh thuê §H[marauder_species.GetName]§! khổng lồ vừa thoát khỏi siêu không gian tại hệ sao §H[attacked_system.GetName]§!! Có vẻ như toàn bộ các toán lính đánh thuê [marauder_species.GetName] còn sống sót từng triển khai ở nơi khác khi chúng ta đập tan trạm không gian cuối cùng của họ đã gạt bỏ bất đồng để hợp lực lại.\n\nChúng ta không rõ bằng cách nào họ lẩn tránh được tầm quét cảm biến của ta để tiến tới [attacked_system.GetName], nhưng họ đang truyền đi một thông điệp trên kênh mở."
 marauder.7.1.desc:0 "Gửi lũ hèn nhát khốn nạn của [Root.GetName]:\n\nVì các ngươi đã phá hủy quê hương của chúng ta, giờ đây chúng ta sẽ thiêu rụi nhà các ngươi. Chúng ta chẳng còn gì để mất - chính các ngươi đã khiến điều đó xảy ra. Tất cả những gì chúng ta khao khát lúc này là được ngã xuống nơi chiến trường, và kéo theo càng nhiều kẻ tự xưng là chiến binh của các ngươi đi cùng càng tốt trên chuyến hành trình vào Cõi Vĩnh Hằng.\n\nHãy chuẩn bị phòng thủ đi!"
 marauder.7.2.desc:0 "Lũ Dwamak của [Root.GetName]! Các ngươi đập nát nhà chúng ta, giờ chúng ta đập nát nhà các ngươi! Chúng ta biết mình có thể không sống nổi, nhưng sẽ kéo theo càng nhiều dwamak càng tốt!\n\nCái chết cho tất cả dwamak! HYEEEEEIIIIIIIIEEEEEEEEE!!!!!!!!!!"
 marauder.7.3.desc:0 "Gửi những kẻ bội giáo của [Root.GetName]:\n\nCác ngươi đã làm ô uế thánh địa thiêng liêng nhất của chúng ta và sát hại vô số thần dân của Người. Các ngươi nghĩ rằng Bà Chúa Hư Không sẽ bỏ qua những tội ác man rợ này mà không trừng phạt sao?\n\nNgười đòi hỏi sự hiến tế, và chúng ta sẽ dâng nộp. Đây sẽ là hành động cuối cùng của chúng ta nơi cõi đời khốn khổ này."
#  marauder.7.a:0 "Battle stations!"
 marauder.8.desc:0 "Một hạm đội lính đánh thuê §H[marauder_species.GetName]§! lớn đã tràn vào lãnh thổ của §H[From.GetName]§!. Có vẻ như tất cả các toán lính đánh thuê [marauder_species.GetName] được triển khai ở nơi khác khi [From.GetName] đập tan trạm không gian cuối cùng của họ đã gạt bỏ bất đồng và hợp nhất lực lượng.\n\nHọ quyết tâm báo thù cho sự hủy diệt quê hương, và các liên lạc bị chặn bắt cho thấy rõ các chiến binh của họ không hề có ý định sống sót sau chiến dịch này."
 marauder.10.name:0 "Người Tị Nạn [marauder_species.GetName] Đã Tới"
 marauder.10.desc.start: "Một đoàn tàu vận tải chắp vá mang theo những người tị nạn §H[marauder_species.GetName]§! tháo chạy khỏi sự tàn phá gần đây tại hệ sao quê nhà đã đến không phận của chúng ta. Họ đã được phép định cư trên §H[Root.GetName]§!."
 marauder.10.desc:0 "$marauder.10.desc.start$\n\nDù những người tị nạn này quen sống trên các trạm không gian chật chội trong điều kiện bẩn thỉu, họ dường như đang thích nghi tốt với ngôi nhà hành tinh mới. $marauder.10.desc.end$"
 marauder.10.desc.artificial: "$marauder.10.desc.start$\n\nĐã quá quen với cuộc sống trên các trạm không gian đông đúc, họ nhanh chóng làm quen với các khu định cư nhân tạo của chúng ta. $marauder.10.desc.end$"
 marauder.10.desc.end: "Hy vọng rằng họ đã sẵn sàng bỏ lại quá khứ cướp bóc và hải tặc phía sau lưng."
 marauder.10.a:0 "Chúng ta sẽ cho họ mái nhà mới."
 gov_marauder_clans:0 "Bộ Tộc Marauder"
 gov_marauder_clans_desc:0 "Tập hợp các thị tộc và bộ lạc liên tục chém giết lẫn nhau khi không bận đi cướp phá các láng giềng."
 RT_RELUCTANT_EMISSARY:0 "Sứ Giả Bất Đắc Dĩ"
 civic_anarcho_tribalism:0 "Chủ Nghĩa Bộ Tộc Vô Chính Phủ"
