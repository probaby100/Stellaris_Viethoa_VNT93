 marauder.19.desc_01:0 "[Root.GetName] là một sự báng bổ tạo hóa. Thứ... \"Tâm Thức Tập Thể\" hay bất cứ thứ quái thai nào đang ngự trị lãnh địa của các ngươi đều không hề có khái niệm về danh dự. Nó đại diện cho tất cả những gì sai trái trong thiên hà này.\n\nCác chiến binh của [marauder_country_1.GetSpeciesNamePlural] sẽ không đời nào dính dáng đến các ngươi."
 marauder.19.desc_02:0 "[Root.GetName] chẳng qua chỉ là một bầy dã thú mọi rợ. Việc các ngươi tàn sát những sinh linh vô tội một cách vô nghĩa đủ để khiến ngay cả những chiến binh kiên cường nhất của chúng ta phải ghê tởm.\n\nChúng ta sẽ không có bất kỳ giao dịch nào với các ngươi."
 marauder.19.desc_03:0 "À phải rồi, những cỗ máy biết nói. Chủ nhân của các ngươi đâu rồi hỡi máy móc? Họ có biết các ngươi đang bị hỏng hóc không?\n\nDù chẳng có chút danh dự nào trong việc này, các chiến binh của chúng ta sẽ rất vui lòng dùng các ngươi làm bia tập bắn nếu các ngươi dám tiếp cận lãnh thổ của chúng ta. Giờ thì biến khỏi mắt ta mau."
 marauder.19.desc_04: "Không còn nghi ngờ gì nữa, các ngươi tự cho mình là đáng sợ với diện mạo hỏa ngục bọc trong lửa đỏ. Có lẽ các ngươi đã quên rằng ngọn lửa nào rồi cũng phải tàn. Hãy mang những lời tro tàn của các ngươi đi nơi khác."

 marauder.19.2.desc_01:0 "HYEEEIIIEEEE!!! Tên tổ-dwamak ăn sạch mọi thứ! Ngươi chắc chắn không biến chúng ta thành món hầm được đâu! Biến đi, tên tổ-dwamak!"
 marauder.19.2.desc_02:0 "HYEEIIEEEE!!! Chúng ta thích đập phá, nhưng không giống như ngươi! Ngươi thích nó quá mức rồi, tên dwamak! Chúng ta không nói chuyện với ngươi!"
 marauder.19.2.desc_03:0 "HYEEEIIIEEE!!! Liệu... liệu nó có hiểu không? Nó là cỗ máy sát thủ, đúng không? Nó chỉ biết giết?\n\nMáy móc... tự sát đi! Ta lệnh cho ngươi tự sát!\n\nÁ, nó hỏng rồi. Vô dụng."
 marauder.19.2.desc_04: "HYEEEIIIEEE!!! Nóng, nóng quá và hôi như khói! Có dùng làm bùi nhùi được không? Không à? Xùy!\n\nCút đi, cục than vô dụng!"

 marauder.19.3.desc_01:0 "Loài của các ngươi là điều cấm kỵ đối với Bà Chúa Hư Không. Các ngươi sẽ nuốt chửng cả Hư Không nếu có thể, đúng không?\n\nThứ quái vật gớm ghiếc."
 marauder.19.3.desc_02:0 "Bà Chúa Hư Không đòi hỏi sự hiến tế, nhưng không phải ở quy mô mà các ngươi gây ra. Các ngươi tôn thờ chính sự hủy diệt, và điều đó biến các ngươi thành loài dị giáo tồi tệ nhất."
 marauder.19.3.desc_03:0 "Các ngươi lạnh lùng và trống rỗng, giống như chính Hư Không. Bà Chúa Hư Không có thể tôn trọng điều đó. Sự hủy diệt của các ngươi sẽ mang lại cho chúng ta nhiều ân huệ từ Người.\n\nKhông còn gì để nói thêm nữa."
 marauder.19.3.desc_04: "Các ngươi dám mang ngọn lửa rực nóng vào lãnh địa của Bà Chúa Hư Không ư? Bản chất của các ngươi khiến Người kinh tởm.\n\nHãy câm lặng như tro lạnh và biến đi."

 marauder.19.a:0 "Con mồi..."
 marauder.19.b:0 "Lũ dị tộc rác rưởi."
 marauder.19.c:0 "Chủng tộc: §H[From.GetSpeciesName].§! Phân loại: §RSâu bọ.§!"
 marauder.19.d:0 "Các ngươi sẽ cháy rụi như tất cả những kẻ khác!"

 marauder.20.1.desc_01:0 "Nói đi, kẻ ngoại bang. Các chiến binh của chúng ta đang lắng nghe đây."
 marauder.20.1.desc_02:0 "Chúng ta không quỳ gối trước bất kỳ kẻ ngoại tộc nào."
 marauder.20.1.desc_03:0 "Như một hình phạt vì thua trong cuộc đấu tay đôi, ta được lệnh phải tiếp đãi tất cả những kẻ ngoại bang trong chu kỳ này.\n\nNgươi muốn gì?"
 marauder.20.1.desc_04:0 "Hãy giải thích sự gián đoạn này. Ta còn có những trận chiến cần tham gia."
 marauder.20.1.desc_05:0 "A! Cuối cùng cũng có một chiến binh thực thụ ở đây!\n\nNăng lực chiến đấu của các chiến binh [Root.GetSpeciesName] ngay cả chúng ta cũng phải nghe danh. Có hàng ngàn chiến binh [marauder_country_1.GetSpeciesNamePlural] rất mong muốn được thử sức trên chiến trường chống lại các ngươi."
 marauder.20.1.desc_06:0 "Rất vui được gặp, hỡi những người [Root.GetSpeciesNamePlural]. Lễ vật cống nạp của các ngươi đã được các chiến binh của chúng ta tiếp nhận nồng nhiệt.\n\nTa sẽ không nói dối... vẫn có một số kẻ muốn tấn công các ngươi, nhưng chúng đã bị xử lý rồi. Ít nhất là phần lớn."
 marauder.20.1.desc_07:0 "Gươm đao của chúng ta đã tra vào vỏ, hỡi những người [Root.GetSpeciesNamePlural]. Hiện tại các ngươi không có gì phải sợ hãi từ các chiến binh của chúng ta."

 marauder.20.2.desc_01:0 "Ta đang có một buổi tối tuyệt vời, rồi ngươi xuất hiện, tên dwamak! HYEEEIIIEEEEE!!! Ngươi muốn cái quái gì?!"
 marauder.20.2.desc_02:0 "Thứ duy nhất tồi tệ hơn một tên dwamak là một tên dwakam! KHÔNG! Đừng hỏi đó là gì! HYEEEIIIEEEEEEEEE!!!!!"
 marauder.20.2.desc_03:0 "HYEEEIIIIIIEEEIIEE.... *khẹc* *khạc* *phì phì* ...EEEEEIIIIEEEEE!!!!!"
 marauder.20.2.desc_04:0 "Ngươi có thứ gì cho chúng ta đập nát không, tên dwamak? [marauder_country_2.GetSpeciesNamePlural] rất giỏi đập phá đấy!"

 marauder.20.3.desc_01:0 "Bà Chúa Hư Không hôm nay đang thịnh nộ. Ta có thể cảm nhận được điều đó.\n\nChúng ta vẫn chưa làm đủ để giành được ân sủng của Người..."
 marauder.20.3.desc_02:0 "Ta chỉ là tôi tớ của Người. Ta chẳng biết gì cả.\n\nNhưng Người... Người nhìn thấu các ngươi là lũ giòi bọ."
 marauder.20.3.desc_03:0 "Bất cứ khi nào tàu của các ngươi băng qua khoảng không vũ trụ bao la, chúng đều xâm phạm lãnh địa của Người bằng sự hiện diện của mình. Chúng ta phải xoa dịu cơn thịnh nộ của Người. Cơn giận ấy thật kinh hoàng khi chứng kiến..."
 marauder.20.3.desc_04:0 "Cuộc Chiến Giáo Lý thứ Chín đang ở chu kỳ thứ 167. Các phe phái dị giáo nhất quyết không chịu khuất phục... nhưng vì Người, chúng ta không được chùn bước."


 marauder.20.b:0 "Chúng tôi biết một mục tiêu đột kích ngon ăn..."
 encourage_raid:0 "Trả tiền cho [marauder_species.GetNamePlural] để đột kích một trong các đối thủ của bạn."
 marauder.20.busy.b.1.response:1 "Các chiến binh của chúng ta đang trong một cuộc đột kích. Chúng ta không có thời gian cho những điều xao nhãng."
 marauder.20.busy.b.2.response:0 "HYEEIIEEEE! Chúng ta đang đi đột kích rồi, tên dwamak! Không rảnh cho việc này!"
 marauder.20.busy.b.3.response:0 "Chúng ta đang thực thi ý nguyện của Người bằng cách đột kích những kẻ vô thần. Cho đến khi cuộc đột kích kết thúc, chúng ta không có gì để bàn về chủ đề này."
 marauder.20.cooldown.b.1.response:0 "Chúng ta vẫn chưa hồi phục sau cuộc đột kích trước. Không có đủ tàu sẵn sàng để tiến hành một cuộc đột kích khác. Hãy quay lại sau."
 marauder.20.cooldown.b.2.response:0 "Này dwamak, chúng ta ghét phải từ chối việc đập-phá, nhưng hạm đội chưa sẵn sàng. Vẫn đang hồi phục sau cuộc đột kích vừa rồi!"
 marauder.20.cooldown.b.3.response:0 "Vẫn còn quá sớm. Cuộc đột kích trước vừa mới kết thúc, và giờ là lúc dành cho những lời cầu nguyện thầm lặng và tôn thờ Bà Chúa Hư Không."
 marauder.20.d:0 "Chúng tôi muốn thuê lính đánh thuê."
 hire_mercenaries:0 "Thuê một hạm đội lính đánh thuê [marauder_species.GetName] trong một khoảng thời gian."
 marauder.20.e:0 "Chấm dứt liên lạc."
 marauder.20.need_rivals:0 "Bạn không có đối thủ cạnh tranh."
 marauder.20.f:0 "Các ngươi có chịu ngừng tiếng thét kinh hoàng đó lại không?"
 marauder.20.f.response:0 "HYEEEIIEEEE!!!! Tiếng... tiếng thét gì cơ?"
 marauder.20.g:0 "Chúng tôi muốn thuê một nhà lãnh đạo."
 hire_mercenary_leader:0 "Thuê một nhà lãnh đạo [marauder_species.GetName] lành nghề trong suốt cuộc đời của nhà lãnh đạo đó."
 hire_admiral_merc:0 "\nBạn thuê vĩnh viễn một đô đốc [marauder_species.GetName] lành nghề."
 hire_general_merc:0 "\nBạn thuê vĩnh viễn một tướng quân [marauder_species.GetName] lành nghề."
 hire_commander_merc: "\nBạn thuê vĩnh viễn một chỉ huy [marauder_species.GetName] lành nghề."

 marauder.30.e:0 "Thực ra thì, thôi bỏ đi."
 marauder.30.f:0 "Tạm biệt."
 marauder.31.1.desc:0 "Ha! Vậy ra các ngươi muốn chúng ta đột kích một trong các đối thủ của các ngươi?\n\nChúng ta ghét việc dính líu vào các cuộc tranh chấp vụn vặt của các ngươi, nhưng với mức thù lao thích đáng, ta nghĩ điều này có thể thu xếp được...\n\nKẻ mà các ngươi muốn chúng ta tấn công là ai?"
 marauder.31.2.desc:0 "Ngươi... ngươi muốn chúng ta đập nát một trong những đối thủ dwamak của ngươi? Được, làm được...\n\nNhưng đập tên dwamak nào?"
 marauder.31.3.desc:0 "Để đổi lấy cống nạp, chúng ta có thể được thuyết phục để trừng phạt một nhóm người ngoại đạo cụ thể.\n\nNhững kẻ dị giáo mà các ngươi muốn chúng ta đối phó là ai?"
 marauder.31.a:0 "§Y[raid_target_1.GetName].§!"
 marauder.31.b:0 "§Y[raid_target_2.GetName].§!"
 marauder.31.c:0 "§Y[raid_target_3.GetName].§!"
 marauder.31.d:0 "§Y[raid_target_4.GetName].§!"
 marauder.31.e:0 "Thực ra thì, thôi bỏ đi."
 marauder.31.f:0 "Tạm biệt."
 marauder.32.1.desc:0 "[preliminary_target.GetName] quả thực có vẻ là một mục tiêu béo bở cho các chiến binh của chúng ta. Có lẽ một chuyến ghé thăm là điều thích hợp..."
 marauder.32.2.desc:0 "Phải, [preliminary_target.GetName] sẽ là món hầm dwamak ngon lành. Rất ngon. Nhưng tốn nhiều sức đấy..."
 marauder.32.3.desc:0 "Bà Chúa Hư Không không mấy thiện cảm với những kẻ dị giáo của [preliminary_target.GetName]. Một chiến dịch quân sự có thể phục vụ ý nguyện của Người..."
 marauder.32.a:0 "Chúng tôi sẽ trả tiền. Hãy dạy cho chúng một bài học."
 marauder.32.1.a.response:0 "Vậy thì quyết định thế đi. Chúng ta xuất kích lúc bình minh."
 marauder.32.2.a.response:0 "HYEEEEIIIEEEEE!!!!!! Lũ dwamak này sắp bị đập-cho-tơi-tả rồi!"
 marauder.32.3.a.response:0 "Chúng sẽ phải nếm trải cơn thịnh nộ của Người."
 hire_raid:0 "\n[current_marauder_diplomacy.GetName] tập hợp một hạm đội đột kích sẽ tấn công [preliminary_target.GetName]."
 marauder.34.1.desc:0 "Lính đánh thuê [marauder_country_1.GetSpeciesName] là những kẻ xuất sắc nhất trong toàn bộ thiên hà. Đừng để vẻ ngoài thô lỗ của họ đánh lừa - khi xung trận, kỷ luật của họ không ai sánh bằng. Danh dự thậm chí sẽ buộc họ phải chiến đấu chống lại các [marauder_country_1.GetSpeciesNamePlural] khác, nếu các ngươi muốn.\n\nĐây là các hạm đội hiện đang sẵn sàng cho thuê."
 marauder.34.2.desc:0 "Ngay cả trẻ sơ sinh [marauder_country_2.GetSpeciesName] cũng đánh bại được chiến binh dwamak mạnh nhất. HYEEIIEE!!!! Ai cũng biết điều đó.\n\nNhưng đây không phải trẻ sơ sinh!!! Đây là những lính đánh thuê [marauder_country_2.GetSpeciesName] thiện chiến, và họ không chỉ nguy hiểm mà còn ĐIÊN LOẠN! Họ sẵn sàng chiến đấu vì những tên dwamak như NGƯƠI, chống lại dwamak khác hoặc thậm chí là [marauder_country_2.GetSpeciesNamePlural]... nếu ngươi chi tiền!\n\nĐây là danh sách hạm đội [marauder_country_2.GetSpeciesName] điên cuồng hiện có:"
 marauder.34.3.desc:0 "Có vài giáo phái trong số các chiến binh của chúng ta cảm thấy rằng việc tiêu diệt những kẻ ngoại đạo, ngay cả theo lệnh của những kẻ ngoại đạo khác, là phù hợp với ý nguyện của Người. Họ thậm chí sẽ không ngần ngại giết các [marauder_country_3.GetSpeciesNamePlural] khác, vì những kẻ cực đoan này coi tất cả mọi người ngoài họ là dị giáo.\n\nNhưng đừng lo. Họ không ngu ngốc đến mức tấn công người thuê mình. Nhân tiện, ta cũng an toàn trước cơn thịnh nộ của họ, vì ta mang lại việc làm cho họ để đổi lấy một phần lợi nhuận khiêm tốn.\n\nĐây là các hạm đội hiện đang sẵn sàng cho thuê:"
 marauder.34.1.a:0 "Đại Hạm Đội Hư Không Sinh."
 marauder.34.2.a:0 "Binh Đoàn Đập Dwamak Thứ 234."
 marauder.34.3.a:0 "Quán Quân Được Chọn Của Người."
 voidborn_hire:0 "\nBạn thuê hạm đội lính đánh thuê này trong thời hạn 5 năm. Nó bao gồm:\n\n§Y6 Tuần Dương Hạm\n8 Khinh Hạm\n16 Tàu Đột Kích§!"
 marauder.34.1.b:0 "Phân Hạm Đội Kỵ Sĩ Vì Sao."
 marauder.34.2.b:0 "Phân Hạm Đội Kẻ Hét Điên Cuồng"
 marauder.34.3.b:0 "Giáo Đoàn Đêm Vĩnh Cửu."
 star_riders_hire:0 "\nBạn thuê hạm đội lính đánh thuê này trong thời hạn 5 năm. Nó bao gồm:\n\n§Y4 Tuần Dương Hạm\n6 Khinh Hạm\n12 Tàu Đột Kích§!"
 marauder.34.1.c:0 "Cánh Bay Phong Ba Đệ Nhất."
 marauder.34.2.c:0 "Phi Đội Tình Nguyện Điên Loạn."
 marauder.34.3.c:0 "Giáo Đoàn Chạng Vạng."
 storm_wing_hire:0 "\nBạn thuê hạm đội lính đánh thuê này trong thời hạn 5 năm. Nó bao gồm:\n\n§Y2 Tuần Dương Hạm\n4 Khinh Hạm\n8 Tàu Đột Kích§!"
 marauder.34.d:0 "Thôi bỏ đi. Hãy thảo luận việc khác."
 marauder.34.e:0 "Tạm biệt."
 marauder.37.1.a.desc:0 "Chúc mừng, hỡi những người [Root.GetSpeciesNamePlural]. Với hạm đội vừa thuê, các ngươi có thể tấn công cả [random_fallen_empire.GetName]!\n\nChà, có lẽ là chưa đâu. Nhưng đừng nhầm lẫn: đó là một lực lượng hùng mạnh đấy!"
 marauder.37.1.b.desc:0 "Phân hạm đội này là của các ngươi, hỡi những người [Root.GetSpeciesNamePlural]. Hãy nhớ: một người [marauder_country_1.GetSpeciesName] duy nhất có giá trị bằng ít nhất mười chiến binh của bất kỳ chủng tộc nào khác. Các ngươi có thể điều chỉnh tính toán lực lượng cho phù hợp."
 marauder.37.2.a.desc:0 "Ngươi đã quyết định sáng suốt đấy, tên dwamak! Bằng cách thuê những kẻ [marauder_country_2.GetSpeciesNamePlural] bất ổn này, ngươi đảm bảo rằng tên dwamak khác không thể thuê họ và phái họ tới săn đuổi ngươi! HYEEEIIIIEEE!!!!"
 marauder.37.3.a.desc:0 "Những chiến binh thần thánh này sẽ phục vụ các ngươi tốt, hỡi những người [Root.GetSpeciesNamePlural]. Chỉ là... đừng xâm phạm vào tàu của họ. Tàu của họ được coi là thiêng liêng, và Bà Chúa Hư Không sẽ không hài lòng với bất kỳ kẻ ngoại đạo nào bước chân lên boong tàu được thánh hóa của họ."
 marauder.37.a:0 "Còn có việc khác nữa..."
 marauder.37.b:0 "Tạm biệt."
 marauder_1_tribute:0 "Cống Nạp Cho [marauder_country.GetSpeciesName]"
 marauder_1_tribute_desc:0 "Chúng ta đã nộp cống phẩm cho [marauder_country.GetName]. Họ đã đồng ý không tấn công chúng ta trong một khoảng thời gian."
 marauder_2_tribute:0 "$marauder_1_tribute$"
 marauder_2_tribute_desc:0 "$marauder_1_tribute_desc$"
 marauder_3_tribute:0 "$marauder_1_tribute$"
 marauder_3_tribute_desc:0 "$marauder_1_tribute_desc$"

 marauder.35.1.desc:1 "Haha! Ngươi thực sự điên rồi, kẻ ngoại bang. Ngươi muốn chúng ta đối đầu với những kẻ cổ xưa sao?\n\nTa không nghĩ vậy đâu."
 marauder.35.2.desc:0 "HYEEEEEEEEEEEEEEEEEEIIIIIIIIIIIIIIIIIIIEEEEEEEEEEEE!!!!!!!!!!!\n\nKhông. Dwamak, chúng ta điên, nhưng không đủ điên để đi đập lũ dwamak-suy-tàn đâu."
 marauder.35.3.desc:0 "Dù họ là những kẻ ngoại đạo, Bà Chúa Hư Không sẽ không muốn chúng ta ném bỏ tàu bè trong nỗ lực vô ích nhằm tiêu diệt các chủng tộc cổ đại.\n\nThời khắc của họ sẽ đến... trong một hoặc hai thiên niên kỷ nữa."

 marauder.40.1.desc:1 "Được, điều này có thể thu xếp. Nhiều chiến binh vĩ đại nhất của chúng ta đang tìm kiếm những thách thức và cơ hội mới.\n\nNếu các ngươi có thể chi trả cái giá để giải phóng họ khỏi lời thề phục vụ đồng tộc, họ sẽ vui lòng thề đi theo các ngươi và chiến đấu trong các trận chiến của các ngươi."
 marauder.40.2.desc:0 "HYEEEIIIEEEEEEE!! Phải, phải! Nhiều chiến binh [marauder_species.GetName] thông minh rất vui lòng chiến đấu vì tiền của dwamak! Chỉ cần có thù lao xứng đáng."
 marauder.40.3.desc:0 "Đúng vậy, những chiến binh vĩ đại nhất của chúng ta sẵn lòng dẫn dắt binh lính của các ngươi ra trận. Với sự hỗ trợ từ năng lượng tín dụng của các ngươi, chúng ta sẽ có thể phụng sự Người với lòng nhiệt thành lớn hơn nữa.\n\nCác ngươi sẽ nhận thấy rằng cả cuộc đời phụng sự Bà Chúa Hư Không đã biến các sĩ quan của chúng ta trở nên vừa can trường vừa đắc lực."
 marauder.40.1.a:0 "Thuê Đô Đốc"
 marauder.40.2.a:0 "Thuê Tướng Quân"
 marauder.40.3.a: "Thuê Chỉ Huy"
 marauder.40.a.response:0 "Rất tốt. Lời thề đã được tuyên, và chiến binh này tùy nghi cho các ngươi sử dụng theo ý muốn."
 marauder.40.b.response:0 "Ồ! Tên [marauder_species.GetName] này rất quỷ quyệt! Các ngươi may mắn đấy, lũ [Root.GetSpeciesNamePlural]!"
 marauder.40.c.response:0 "Bà Chúa Hư Không đã ban phước cho việc ký kết khế ước này. Cầu mong quán quân của chúng ta sẽ phục vụ tốt cho các ngươi."

 marauder.46.name:0 "Lính Đánh Thuê Marauder Sẵn Sàng"
 marauder.46.desc:0 "Khi cộng đồng thiên hà tiếp tục mở rộng và các đường biên giới bắt đầu va chạm, xung đột vũ trang thường là điều khó tránh khỏi.\n\nNhận thức được điều này, các hạm đội từ một số bộ tộc Marauder đã sẵn sàng mạo hiểm vượt ra ngoài các hệ sao quê nhà để tìm kiếm danh vọng và vinh quang. Giờ đây họ cung cấp dịch vụ lính đánh thuê cho kẻ trả giá cao nhất."
 marauder.46.a:0 "Lính đánh thuê giỏi rất khó tìm."

 leader_trait_mercenary_warrior:0 "Chiến Binh Đánh Thuê"
 leader_trait_mercenary_warrior_desc:0 "Nhà lãnh đạo này xuất thân từ một nền văn hóa chiến binh vũ trụ, và đã được dạy các chiến thuật đánh nhanh rút gọn khác thường từ khi còn nhỏ."
 leader_trait_great_khan:0 "Đại Hãn"
 leader_trait_great_khan_desc:0 "Đại Hãn là một nhà lãnh đạo đầy lôi cuốn, một nhà chiến thuật tài ba, và nếu tin đồn là sự thật, một bậc thầy tâm linh quyền năng."
 leader_trait_ruler_great_khan:0 "$leader_trait_great_khan$"
 leader_trait_ruler_great_khan_desc:0 "$leader_trait_great_khan_desc$"
 marauder.50.name:0 "Hợp Đồng Đánh Thuê Chấm Dứt"
 marauder.50.desc:0 "Hợp đồng của chúng ta với lực lượng lính đánh thuê trên tàu §H[Root.GetName]§! đã kết thúc. Chỉ huy của họ, Chỉ Huy [Root.Leader.GetName], đã đề nghị lập tức gia hạn dịch vụ của các tàu dưới quyền chỉ huy của [Root.Leader.GetHerHis] cho chúng ta thêm năm năm nữa... với một khoản phụ phí.\n\nNếu chúng ta từ chối, lính đánh thuê sẽ rời đi để tìm kiếm công việc ở nơi khác."
 marauder.50.a:0 "Gia hạn hợp đồng."
 marauder.50.b:0 "Để họ rời đi."
 marauder.71.name:0 "Chỉ Huy Đánh Thuê Được Thay Thế"
 marauder.71.desc:0 "Sau sự ra đi đột ngột của cựu chỉ huy tàu §H[Root.GetName]§!, [marauder_species.GetNamePlural] đã phái Chỉ Huy §H[new_leader.GetName]§! đến thay thế."
 marauder.76.name:0 "Lính Đánh Thuê [marauder_species.GetName] Biến Mất"
 marauder.76.desc:0 "Việc mất đi các hệ sao quê nhà dường như đã làm rung chuyển dữ dội lực lượng lính đánh thuê §H[marauder_species.GetName]§! trên [Root.GetName]. Bất chấp hợp đồng năm năm chúng ta đã ký với họ, lũ cướp bội bạc cùng toàn bộ tàu bè của chúng đã biến mất vào khoảng không sâu thẳm!\n\nThông điệp cuối cùng của chúng, dường như là mật mã báo hiệu sự ra đi, là:\n\n§R\"Mối thù này nhất định sẽ được trả.\"§!"
 marauder.76.a:0 "Chúng ta đã có một hợp đồng cơ mà!"
 marauder.77.name:0 "Lính Đánh Thuê Gia Nhập Đại Hãn"
 marauder.77.desc:0 "Sự trỗi dậy của [raider_khanate.GetName] dưới trướng vị Đại Hãn lẫy lừng đã kích hoạt các cuộc đào ngũ hàng loạt trong toàn bộ lính đánh thuê [raider_khanate.GetSpeciesName] mà chúng ta đang thuê! Bị cuốn vào làn sóng nhiệt thành dân tộc bất ngờ, những kẻ phản bội đều từ bỏ hợp đồng và rời đi để gia nhập cỗ máy chiến tranh ngày càng lớn mạnh của Đại Hãn."
 marauder.86.a.desc:0 "Chú ý, hỡi lũ [Root.GetSpeciesNamePlural].\n\nNếu các ngươi cần kẻ khác chiến đấu thay cho mình, hãy biết rằng các hạm đội lính đánh thuê [marauder_mercenary_country.GetSpeciesName] hiện đã sẵn sàng cho thuê. Phải, các ngươi nghe không nhầm đâu. Nếu có thể đáp ứng mức giá của họ, những lính đánh thuê giỏi nhất thiên hà hiện sẵn sàng chiến đấu cho các ngươi."
 marauder.86.a:0 "Tốt khi được biết."
 marauder.87.a.desc:0 "HYEEEIIIEEEEEE!!!! Chú ý, lũ dwamak!\n\nChiến binh của chúng ta đâm ra chán chường và gây nhiều rắc rối! Đánh lộn lẫn nhau nhiều, chết nhiều! Nhưng chúng ta có giải pháp... chúng ta cử những chiến binh điên cuồng nhất đi chiến đấu cho lũ dwamak, để đổi lấy tín dụng! Nếu muốn có lính đánh thuê giỏi nhất thiên hà, hãy nhanh chân lên trước khi quá muộn!"
 marauder.88.a.desc:0 "Bà Chúa Hư Không có một thông điệp dành cho các ngươi:\n\nNếu các ngươi khao khát, các ngươi có thể thuê một số hạm đội của chúng ta làm lính đánh thuê. Các thủy thủ đoàn của chúng ta rất kỷ luật và sẽ tuân theo mệnh lệnh của các ngươi, miễn là các ngươi đáp ứng được mức giá của chúng ta.\n\nĐây là một món quà phi thường mà Người đã ban cho các ngươi. Đừng phung phí nó."
 marauder.101.1.desc:0 "Hỡi lũ [Root.GetSpeciesName] yếu ớt, các chiến binh của chúng ta đang trên đường cướp phá các hệ sao của các ngươi. Hãy đối mặt với họ trong trận chiến nếu các ngươi gom đủ can đảm, hoặc co cụm trong sợ hãi cho đến khi họ đã vơ vét thỏa thuê của cải của các ngươi.\n\nTất nhiên, các ngươi có thể dâng nộp cống phẩm ngay bây giờ để tự cứu mình khỏi cuộc tấn công sắp tới. Nếu cống phẩm đủ nhiều, các chiến binh của chúng ta có thể sẽ chịu quay đầu..."
 marauder.101.2.desc:0 "HYEEEIIIIIEEEEEE!!!!!!! Lũ [Root.GetSpeciesName]-dwamak! Chúng ta đến thăm các hệ sao của các ngươi đây! Chúng ta giúp các ngươi không bị quá giàu và béo phì, hiểu chứ!\n\nTrừ khi các ngươi nghĩ ra lý do tại sao các ngươi không nên bị đem nấu món hầm dwamak..."
 marauder.101.3.desc:0 "Hỡi những người [Root.GetSpeciesNamePlural]. Bà Chúa Hư Không đã truyền đạt cho chúng ta ý nguyện của Người muốn sử dụng các hệ sao của các ngươi làm thánh địa nghi lễ để ca tụng quyền thống trị vĩnh hằng của Người trên Không Gian. Là những tôi tớ khiêm nhường của Người, chúng ta không có lựa chọn nào khác ngoài việc tuân phục.\n\nMột hạm đội chiến đấu gồm những chiến binh tinh nhuệ nhất, được tập hợp từ mọi phe phái, hiện đang trên đường tới chỗ các ngươi để thu thập cống phẩm và nô bộc. Để ngăn chặn điều tất yếu và thỏa mãn cơn đói của Người, các ngươi có thể dâng cống phẩm ngay bây giờ. Nếu đủ nhiều, hạm đội sẽ được triệu hồi về."
 marauder.101.a:0 "Dâng Cống Phẩm §Y(Năng Lượng)§!"
 marauder.101.b:0 "Dâng Cống Phẩm §Y(Khoáng Sản)§!"
 marauder.101.c:0 "Dâng Cống Phẩm §Y(Lương Thực)§!"
 marauder.101.1.a.response:0 "Thật đáng tiếc! Ta đoán các chiến binh của chúng ta sẽ phải tìm kiếm trò giải trí ở nơi khác vậy.\n\nNgười dân của các ngươi được an toàn. Ít nhất là vào lúc này."
 marauder.101.d:0 "Lũ cặn bã các ngươi sẽ không nhận được gì từ chúng ta đâu."
 marauder.101.1.b.response:0 "Lũ ngu xuẩn! Vậy thì chúng ta sẽ dùng vũ lực đoạt lấy những gì các ngươi đáng lẽ phải cống nạp... và còn nhiều hơn thế nữa! Các ngươi đã phạm phải một sai lầm khủng khiếp ngày hôm nay."
 marauder.101.2.a.response:0 "Ngươi khôn ngoan đấy, tên dwamak! Giờ chúng ta phải đi tìm món hầm dwamak ở nơi khác rồi! Phiền toái cho chúng ta, nhưng lại yên ổn cho ngươi!"
 marauder.101.2.b.response:0 "Chúng ta hy vọng ngươi nói thế, tên dwamak! [raiding_marauder.GetSpeciesNamePlural] luôn thích một thử thách hay go!\n\nHYEEEIIIEEEE!!!!"
 marauder.101.3.a.response:0 "Ngươi thật khôn ngoan khi không chọc giận Bà Chúa Hư Không. Sự báo thù của Người hẳn sẽ rất khủng khiếp."
 marauder.101.3.b.response:0 "Bà Chúa Hư Không đã tiên tri được câu trả lời này, nhưng lời đề nghị vẫn phải được đưa ra. Giờ đây chúng ta có thể thu thập nô lệ và của cải thông qua trận chiến nghi lễ thích đáng. Tất nhiên, tất cả đều nhân danh Người."
 marauder.102.1.desc:0 "Cuối cùng các ngươi cũng phải bò lê đến đây van xin lòng thương xót rồi sao, lũ [Root.GetSpeciesNamePlural]? Các ngươi vẫn có thể dâng cống phẩm để đảm bảo chúng ta rút quân khỏi lãnh thổ các ngươi, nhưng giá đã tăng lên rồi đấy."
 marauder.102.2.desc:0 "Phải không, tên dwamak? Giờ ngươi không muốn chúng ta ghé thăm nữa à? Muốn chúng ta biến đi chứ gì? HYEEEIIEEEE!!!\n\nNgươi có thể trả tiền, nhưng giờ đắt hơn rồi..."
 marauder.102.3.desc:0 "Người đang phẫn nộ, hỡi lũ [Root.GetSpeciesNamePlural]... vô cùng phẫn nộ. Mỗi sinh mạng [Root.GetSpeciesName] được hiến tế để tôn vinh Người đều làm nguôi ngoai phần nào cơn thịnh nộ, nhưng liệu có đủ không?\n\nNếu các ngươi đến đây để dâng cống phẩm cho Bà Chúa Hư Không nhằm đảm bảo chúng ta rút quân khỏi lãnh thổ các ngươi, hãy biết rằng Người sẽ đòi hỏi một sự hy sinh thậm chí còn lớn hơn thay cho các ngươi bây giờ..."
 marauder.102.d:0 "Này anh bạn, ngươi trông xấu xí tệ hại thật đấy."
 marauder.102.e:0 "Chấm dứt liên lạc."
 marauder.102.1.a.response:0 "Hãy nghĩ đến tất cả những đau khổ mà các ngươi lẽ ra đã tránh được nếu dâng cống phẩm cho chúng ta ngay từ lần đầu tiên. Hãy coi đây là một bài học cho các ngươi, lũ [Root.GetSpeciesNamePlural]."
 marauder.102.2.a.response:0 "HYEEEEEIIIIIEEEEE!!! Thế là xong. Chúng ta đã có thứ mình muốn. Tạm thời không cần món hầm dwamak nữa."
 marauder.102.3.a.response:0 "Bà Chúa Hư Không hài lòng. Sự hiến tế này đã làm nhẹ nhõm tâm linh của Người, và Người đã cho phép các chiến binh của mình rút lui. Chúc bình an, hỡi [Root.GetSpeciesName]."
 marauder.102.1.b.response:0 "Ta... n-ngươi... vẻ ngoài của ta... không liên quan gì đến...\n\nNgươi sẽ phải hối hận vì sự xúc phạm này, hỡi tên [Root.GetSpeciesName]. Các chiến binh của chúng ta sẽ thiêu rụi hạm đội thảm hại của các ngươi thành tro bụi!"
 marauder.111.1.desc:0 "Giờ các ngươi có thể chui ra khỏi hầm trú ẩn rồi đấy, hỡi lũ [Root.GetSpeciesNamePlural]. Chúng ta đã giải phóng một lượng của cải thỏa đáng của các ngươi, và các khoang tàu đã chất đầy đến mức tối đa.\n\nNgười cầm lái! Đặt lộ trình về [marauder_system.GetName]. Hãy rời khỏi vùng không gian chết tiệt này. Nó làm ta phát ngán."
 marauder.111.2.desc:0 "Lũ Dwamak, chúng ta đã đập phá đủ rồi. Giờ không cần đập phá thêm nữa. Các khoang tàu của chúng ta đã đầy ắp.\n\nGiờ chúng ta quay về [marauder_system.GetName] đây, đúng thế."
 marauder.111.3.desc:0 "Buổi lễ đã kết thúc. Bà Chúa Hư Không hài lòng với sự tàn phá mà chúng ta đã mang lại cho không gian của các ngươi, hỡi lũ [Root.GetSpeciesNamePlural]. Giờ đây chúng ta được phép trở về [marauder_system.GetName]."
 marauder.111.a:0 "Biến đi!"
 marauder.112.1.desc:0 "Thật hồi hộp, đúng không? Cảm giác phấn khích của trận chiến! Những chiến binh thiện chiến nhất của chúng ta đối đầu với lực lượng tốt nhất mà các ngươi có. Chúng ta sẽ xem ai là kẻ đứng đầu!"
 marauder.112.2.desc:0 "Dwamak, ngươi muốn gì? Chúng ta đang bận đập phá các hệ sao của ngươi!"
 marauder.112.3.desc:0 "Chúng ta chỉ phục vụ ý nguyện của Người, và vào lúc này, là những kẻ có túi tiền đủ sâu để thuê chúng ta tiêu diệt các ngươi. Chừng nào kết quả cuối cùng là thêm nhiều kẻ ngoại đạo bỏ mạng, Bà Chúa Hư Không sẽ chuẩn thuận."

 marauder.104.name:0 "Quân Đột Kích Đánh Trúng [Root.GetName]"
 marauder.104.desc:0 "Các toán đột kích [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Triển khai bằng các tàu con tấn công nhỏ từ hạm đội trên quỹ đạo, quân [marauder_country.GetSpeciesNamePlural] đã tấn công dữ dội một số khu định cư ngoại vi trên [Root.GetPlanetMoon] trước khi rút lui về không gian cùng chiến lợi phẩm. Các lực lượng phòng thủ mặt đất của chúng ta không kịp trở tay."
 marauder.104.a:0 "Lũ cặn bã đột kích."
 marauder.105.desc:0 "Lũ buôn nô lệ [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Các tàu con tấn công đã đánh phá nhiều khu định cư xa xôi trên [Root.GetPlanetMoon], lùa bắt những người thực dân và đưa họ trở lại hạm đội quỹ đạo trong xiềng xích."
 marauder.105.a:0 "Chúng sẽ phải trả giá."
 marauder.106.desc:0 "Lực lượng nhẹ của [marauder_country.GetSpeciesName] đã tiến hành một cuộc đột kích đánh nhanh rút gọn vào §H[Root.GetName]§!. Các đợt đổ bộ phân tán đã làm bối rối các đơn vị phản ứng chiến thuật chỉ huy lực lượng mặt đất của chúng ta, và trước khi ta kịp trở tay, lũ đột kích đã quay trở lại quỹ đạo với bất kỳ chiến lợi phẩm nào chúng có thể vơ vét từ các khu định cư của chúng ta."
 marauder.106.a:0 "Kết quả không mong muốn."
 marauder.107.desc:0 "Lũ buôn nô lệ [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Những đợt ném bom từ các tàu con tấn công đã phá toang một số khu bảo tồn sinh học hữu cơ của chúng ta, sau đó bị các toán đột kích vũ trang hạng nặng tràn vào xông chiếm.\n\nNhững sinh vật hữu cơ ngơ ngác, những kẻ từ trước đến nay vẫn được bảo vệ an toàn trong các khu bảo tồn này, đã nhanh chóng bị lũ buôn nô lệ gom bắt và đưa lên hạm đội quỹ đạo trong xiềng xích."
 marauder.107.a:0 "Các chiến lợi phẩm sinh học của chúng ta!"
 marauder.108.desc:0 "Các toán đột kích [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Lũ đột kích đã cướp bóc một số tiền đồn của chúng ta trên [Root.GetPlanetMoon] và tàn sát hàng trăm cá thể phụ thuộc trước khi rút lui về hạm đội trên quỹ đạo."
 marauder.108.wilderness.desc: "Các toán đột kích [marauder_country.GetSpeciesAdj] đã xâm phạm §H[Root.GetName]§!! Lũ xâm nhập hèn hạ này đã cướp phá một số cơ sở của chúng ta trên [Root.GetPlanetMoon] và tàn sát hàng trăm cá thể cộng sinh trước khi rút lui về hạm đội quỹ đạo."
 marauder.108.a:0 "Chúng ta phải trừng phạt sự xâm phạm này."

 marauder.112.a:0 "Ai đã trả tiền cho các ngươi để đột kích chúng ta?"
 marauder.112.1.a.response:0 "Lũ hèn nhát đáng thương không dám tự mình đối mặt với các ngươi. Danh tính của chúng vô nghĩa, và vai trò tối hậu của chúng trong vũ trụ lại càng vô nghĩa hơn.\n\nVà chúng đã trả nhiều tiền để chúng ta giữ kín danh tính của chúng cho riêng mình."
 marauder.112.2.a.response:0 "À, nhưng đó là bí mật, hỡi tên dwamak! Chúng là lũ dwamak, giống như ngươi, nhưng là lũ dwamak khác. Đó là tất cả những gì chúng ta có thể nói."
 marauder.112.3.a.response:0 "Những kẻ vô đạo. Kẻ ngoại giáo. Dị giáo.\n\nChúng ta cũng chẳng muốn dính dáng gì đến chúng, nhưng năng lượng tín dụng của chúng sẽ giúp thúc đẩy ý nguyện của Người."
 marauder.112.b:0 "Chấm dứt đường truyền."
 marauder.114.name:0 "Cuộc Đột Kích Bị Hủy Bỏ"
 marauder.114.desc:0 "Thiệt hại nặng nề giáng xuống hạm đội đột kích [marauder_country.GetSpeciesName] đã đủ để khiến các chiến binh của chúng phải chùn bước. Sau khi cân nhắc lại các lựa chọn, [marauder_country.GetSpeciesNamePlural] dường như đã quyết định từ bỏ cuộc đột kích và rút lui về vùng không gian của chính mình."
 marauder.114.a:0 "Chúng đã nhai quá miếng mình có thể nuốt."
 marauder.116.name:0 "Hạm Đội Đột Kích Bị Tiêu Diệt"
 marauder.116.desc:0 "Hạm đội [From.GetSpeciesName] từng thề sẽ cướp phá không phận của chúng ta đã bị tiêu diệt hoàn toàn trong một trận hải chiến tại hệ sao [destroyed_fleet_system.GetName]. Không có người sống sót nào được báo cáo tìm thấy trong đống mảnh vỡ."
 marauder.116.a:0 "Hãy để đây là một bài học cho đồng loại của chúng."
 marauder.117.desc:0 "Lũ cướp [marauder_country.GetSpeciesName] mà chúng ta từng \"khích lệ\" phát động đột kích chống lại §H[marauder_target.GetName]§! đã quay đầu cúp đuôi chạy về không gian của mình! Thiệt hại mà hạm đội đột kích của chúng phải gánh chịu dường như quá nặng nề khiến chúng phải đổi ý."
 marauder.117.a:0 "Lũ hèn nhát!"


 marauder.120.name:0 "Đợt Đột Kích Của [raiding_marauder.GetSpeciesName] Đang Đến"
 marauder.120.desc:0 "Một hạm đội đột kích của §H[raiding_marauder.GetSpeciesName]§! đã bị phát hiện đang tiếp cận biên giới của chúng ta! Các liên lạc bị chặn bắt cho thấy chúng đã được một thế lực ngoại bang đối thủ thuê để tấn công các hệ sao của chúng ta. Chúng đang truyền một thông điệp nhắm vào chúng ta trên một kênh mở."
 marauder.121.1.desc:0 "Lũ hèn nhát rúc trong bóng tối đã yêu cầu chúng ta đối đầu với các ngươi, vì chúng quá sợ hãi không dám tự mình làm điều đó. Vậy có chiến binh [Root.GetSpeciesName] nào đủ danh dự để nghênh chiến với chúng ta trên chiến trường mở không, hay chúng ta cứ thế cướp phá các hệ sao của các ngươi mà không gặp kháng cự? Hãy chứng tỏ giá trị của các ngươi đi!"
 marauder.121.2.desc:0 "HYEEEIIIEEE!!! Ngươi có nhiều kẻ thù đấy, tên dwamak! Chúng chẳng ưa ngươi chút nào! Thậm chí còn trả tiền cho chúng ta để đập phá các hệ sao của ngươi! Chúng ta rất vui lòng chiều ý!\n\nHYEEEIIIEEE!!!!"
 marauder.121.3.desc:0 "Nếu một nhóm ngoại đạo muốn chúng ta tiêu diệt một nhóm ngoại đạo khác và sẵn lòng trả tiền cho việc đó, thì chúng ta là ai mà dám từ chối? Rồi sẽ đến lúc những tôi tớ của Bà Chúa Hư Không đối phó với tất cả những kẻ dị giáo, nhưng hiện tại chúng ta sẽ tập trung vào các ngươi."
 marauder.121.a:0 "Bật báo động đỏ!"
 marauder.122.name:0 "Quân Đột Kích [raid_parent.GetSpeciesName] Rút Quân"
 marauder.122.desc:0 "Hạm đội đột kích mà §H[raid_parent.GetSpeciesNamePlural]§! phái vào §H[raid_victim.GetName]§! sau khi chúng ta \"khích lệ\" họ đã thiết lập lộ trình quay trở về hệ sao quê nhà. Với các khoang chứa đầy chiến lợi phẩm và nô lệ thu giữ được, các thuyền trưởng đã tuyên bố cuộc đột kích kết thúc thành công."
 marauder.122.a:0 "Một công việc hoàn thành xuất sắc."
 marauder.123.desc:0 "Một hạm đội đột kích thuộc một chủng tộc chưa từng được biết đến trước đây đã bị phát hiện đang tiếp cận biên giới của chúng ta! Lũ man rợ tự xưng là §H[raiding_marauder.GetSpeciesNamePlural]§! này dường như đã được một thế lực ngoại bang kình địch trả tiền để tấn công các hệ sao của chúng ta. Chúng đang truyền một thông điệp trực tiếp nhắm vào ta trên kênh mở."
 marauder.124.name:0 "Hạm Đội Đột Kích [raiding_marauder.GetSpeciesName] Bị Hủy Diệt"
 marauder.124.desc:0 "Hạm đội đột kích mà chúng ta từng \"khích lệ\" [raiding_marauder.GetSpeciesNamePlural] tập hợp đã bị tiêu diệt tại hệ sao [destroyed_fleet_system.GetName] bởi các lực lượng thuộc [fleet_destroyer.GetName]! Không có báo cáo nào về người sống sót."
 marauder.124.a:0 "Hy vọng ít nhất chúng cũng đã gây ra được chút thiệt hại."
 marauder.501.name:0 "Hồi Trống Chiến Tranh"
 marauder.501.desc:0 "Lần đầu tiên trong lịch sử được ghi chép, các phe phái thù địch của §H[raider_khanate.GetSpeciesNamePlural]§! đã thống nhất dưới trướng một §HĐại Hãn§! duy nhất. Vị tướng quân bí ẩn này, người theo một số lời đồn là một bậc thầy tâm linh quyền năng, đã trỗi dậy từ tầng lớp chiến binh và hoàn thành điều mà hầu hết mọi người đều nghĩ là bất khả thi. Nhờ sự kết hợp giữa mưu mô xảo quyệt, sức lôi cuốn phi thường và thiên tài quân sự, vị tân Đại Hãn vừa đăng quang đã giành được sự trung thành và sùng kính tuyệt đối của toàn bộ các phe phái [raider_khanate.GetSpeciesName].\n\nGiờ đây khi không còn bận rộn chém giết lẫn nhau, [raider_khanate.GetSpeciesNamePlural] đang chuyển hướng chú ý sang nơi khác. Những đại hạm đội đang tập kết chuẩn bị chiến tranh, được vận hành bởi những chiến binh hăng hái mà giờ đây là những chiến hữu sát cánh kiên định dù chỉ mới vài tháng trước còn là kẻ thù không đội trời chung."
 marauder.501.a:0 "Một mối đe dọa mới đã ra đời."
 marauder.502.desc:0 "Ta là §H[raider_khanate.Ruler.GetName]§!, Đại Hãn của §H[raider_khanate.GetName]§!, và ta ở đây để tuyên cáo với toàn thiên hà rằng một kỷ nguyên mới đã bắt đầu. Thời kỳ đen tối nơi [raider_khanate.GetSpeciesNamePlural] tàn sát lẫn nhau vô nghĩa vì vài mẩu tài nguyên vụn vặt hay cảm thức danh dự sai lầm cuối cùng đã đi đến hồi kết.\n\nTa đã long trọng hứa với thần dân của mình về một khởi đầu mới thông qua việc kiến lập một đại đế chế sẽ mãi mãi khắc ghi tên tuổi chủng tộc [raider_khanate.GetSpeciesName] vào biên niên sử thiên hà.\n\nGửi tới những kẻ dám cản đường chúng ta, hãy biết điều này: Ta sẽ không từ bất kỳ thủ đoạn nào để hiện thực hóa thiên mệnh thực sự của thần dân ta. Nếu các ngươi dám chống lại chúng ta, [raider_khanate.GetName] sẽ nghiền nát các ngươi thành tro bụi."
 marauder.502.a:0 "Những lời lẽ thật đanh thép."
 marauder.502.b:0 "Đang tính toán vector đe dọa."
 marauder.504.name:0 "Đại Hãn Chiếm Đoạt [conquered_planet.GetName]!"
 marauder.504.desc:0 "Sau khi đánh bại những người phòng thủ dũng cảm của §H[conquered_planet.GetName]§!, lực lượng mặt đất từ [From.GetName] đã chiếm lấy [conquered_planet.GetPlanetMoon] nhân danh Đại Hãn của họ! Họ đã giương cao ngọn cờ của đế chế mới trên khắp các khu định cư lớn trên bề mặt [conquered_planet.GetPlanetMoon]. Ngay lúc này, những người thực dân [From.GetSpeciesName] đang được chở đến từ các môi trường sống không gian đổ nát của họ."
 marauder.504.a:0 "Phải chặn đứng Đại Hãn!"
 marauder.506.name:0 "Đại Hãn Nếm Mùi Thất Bại"
 marauder.506.desc:0 "Bất chấp thiên tài quân sự được tán tụng của [great_khan.GetHerHis], [great_khan.GetName], Đại Hãn của [From.GetName], đã nếm mùi thất bại tại hệ sao [khan_death_system.GetName]. Khi đại hạm đội do [great_khan.GetSheHe] chỉ huy bị tổn thất trong trận chiến chống lại lực lượng thuộc [khan_destroyer.GetName], Đại Hãn cùng các sĩ quan thân cận nhất của [great_khan.GetHerHis] đã trốn vào siêu không gian trên một chiếc phi thuyền nhỏ.\n\nNgay lúc này, [great_khan.GetName] đang bận rộn tập hợp một đại hạm đội mới để tiếp tục các cuộc chinh phục của [great_khan.GetHerHis], nhưng chiến thắng này đã mang lại sự nghỉ ngơi vô cùng cần thiết cho những ai chống lại bước tiến không ngừng của [From.GetName]."
 marauder.506.a:0 "Hóa ra Đại Hãn không phải là bất khả chiến bại."
 marauder.508.desc:2 "Đây là Đại Hãn [great_khan.GetName] của [From.GetName]. Thất bại của ta dưới tay [khan_destroyer.GetRealName] chỉ là một bước thụt lùi nhỏ - không hơn không kém. [khan_destroyer.GetSpeciesNamePlural] là những chiến binh dũng cảm và đối thủ xứng tầm, nhưng rồi họ cũng sẽ gục ngã trước chúng ta.\n\nNgọn triều lịch sử đang quét qua thiên hà, và không gì có thể ngăn cản nó. Đại hạm đội mới của ta đã được tập hợp."
 marauder.508.desc.1:0 "$marauder.508.desc$ Sau khi cuộc chiến này kết thúc, các Tổng Trấn trung thành sẽ được ban thưởng vì sự phò tá của mình."
 marauder.508.desc.2:0 "$marauder.508.desc$ Hãy tuyên thệ trung thành với ta ngay bây giờ, khi các ngươi vẫn còn thời gian."
 marauder.508.desc.3:0 "$marauder.508.desc$ Tất cả những kẻ dám cản đường ta sẽ bị tiêu diệt hoàn toàn."
 marauder.508.a:0 "Một cuộc tấn công dữ dội thứ hai đang đến gần..."
 marauder.510.name:0 "Cái Chết Của Đại Hãn"
 marauder.510.desc:0 "Đại Hãn [great_khan.GetName] đã chết. Sau khi đại hạm đội của [great_khan.GetHerHis] nếm mùi thất bại lần thứ hai tại hệ sao [khan_death_system.GetName], Đại Hãn đã không hề cố gắng trốn chạy khỏi soái hạm khi nó bị phá hủy trong trận chiến bởi [khan_destroyer.GetName].\n\nKhi người lãnh đạo kính yêu qua đời, một cuộc tranh giành quyền lực tàn khốc đã bùng nổ trong [From.GetName]. Các tướng lĩnh quân phiệt của Đại Hãn giờ đây đang chém giết lẫn nhau để giành quyền kiểm soát đế chế của [great_khan.GetHerHis]. Vẫn còn phải chờ xem ai sẽ là kẻ bước lên đỉnh cao tối thượng."
 marauder.510.a:0 "Vậy là triều đại của [great_khan.GetName] đã chấm dứt."
 marauder.513.a.desc:0 "Đại Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Chi tiết hiện vẫn còn ít ỏi, nhưng các liên lạc bị chặn bắt cho thấy Đại Hãn đã bị đầu độc bởi một trong những tướng quân đầy tham vọng của [great_khan.GetHerHis] trong một nỗ lực đảo chính.\n\nKhi người lãnh đạo kính yêu qua đời, một cuộc tranh giành quyền lực khốc liệt đã bùng nổ trong [raider_khanate.GetName]. Các tướng quân của Đại Hãn giờ đây đang giao tranh lẫn nhau để giành quyền kiểm soát đế chế của [great_khan.GetHerHis]. Vẫn còn phải chờ xem ai sẽ là kẻ vươn lên nắm quyền."
 marauder.513.b.desc:0 "Đại Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Theo các thông tin liên lạc bị chặn bắt, Đại Hãn đã khuất phục trước Cơn Sốt Sarakellian, một căn bệnh tương đối phổ biến và thường gây tử vong ở [raider_khanate.GetSpeciesNamePlural] - di sản từ điều kiện sống tồi tàn trên các trạm không gian nơi phần lớn họ từng sinh sống trước sự trỗi dậy của [raider_khanate.GetName]."
 marauder.513.c.desc:0 "Đại Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Các liên lạc bị chặn bắt cho thấy Đại Hãn đã bị ám sát dữ dội bởi một đội đặc nhiệm được thuê bởi một thế lực thiên hà chưa xác định. Hiện chưa có chính phủ nào chịu đứng ra nhận trách nhiệm cho chiến dịch này."
 marauder.513.d.desc:0 "Đại Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Thông tin chi tiết còn mơ hồ, nhưng các đường truyền bị chặn bắt đã tiết lộ rằng Đại Hãn đã bị sát hại bởi một người thiếp ngoại tộc ngay trong phòng riêng của [great_khan.GetHerHis] trên soái hạm. Động cơ hiện vẫn chưa được làm rõ."
 marauder.513.e.desc:0 "Đại Hãn của [raider_khanate.GetName] đã qua đời. Theo các đường truyền bị chặn bắt, [great_khan.GetName] đã tạ thế tự nhiên trong vài ngày qua do tuổi tác cao của [great_khan.GetHerHis].\n\nNgười ta tin rằng Đại Hãn đã chỉ định một người kế vị, nhưng bất chấp điều đó, một cuộc tranh giành quyền lực đẫm máu đã bùng nổ trong [raider_khanate.GetName]. Các tướng lĩnh quân phiệt của Đại Hãn giờ đây đang giao chiến với nhau để giành quyền kiểm soát đế chế của [great_khan.GetHerHis]. Vẫn còn phải chờ xem ai sẽ là kẻ bước lên đỉnh cao tối thượng."

 liberated_planet.part1:0 "Chúng ta đã đánh bại những người lính cuối cùng của Đại Hãn trên bề mặt §H[liberated_planet.GetName]§!, và lực lượng của chúng ta giờ đây đã nắm toàn quyền kiểm soát [liberated_planet.GetPlanetMoon]."
 liberated_planet.part2:0 "Trước khi bị [raider_khanate.GetName] đánh chiếm, thế giới này từng thuộc về §H[planet_former_owner.GetName]§!. Họ có thể sẽ rất biết ơn chúng ta nếu chúng ta trả lại quyền cai trị cho họ."
 marauder.516.name:0 "Giải Phóng [liberated_planet.GetName]"
 marauder.516.desc:0 "Lực lượng của chúng ta đã giải phóng thành công §H[liberated_planet.GetName]§! khỏi sự chiếm đóng của binh lính Đại Hãn! [liberated_planet.GetPlanetMoon] cuối cùng đã được trả lại dưới sự kiểm soát hoàn toàn của chúng ta."
 marauder.516.a:0 "Một thắng lợi vĩ đại!"
 marauder.517.desc:0 "$liberated_planet.part1$\n\n$liberated_planet.part2$"
 marauder.517.a:0 "Kẻ chiến thắng hưởng trọn chiến lợi phẩm."
 marauder.517.a.tooltip:0 "[liberated_planet.GetName] được sáp nhập vào đế chế của chúng ta."
 marauder.517.b:0 "Chúng ta là những người giải phóng, không phải kẻ chinh phục."
 marauder.517.b.tooltip:0 "[liberated_planet.GetName] được trao trả lại cho [planet_former_owner.GetName]."
 marauder.518.desc:0 "$liberated_planet.part1$"
 marauder.519.desc:0 "Sau khi tấn công thành công §H[liberated_planet.GetName]§! và đánh bại các lực lượng của Đại Hãn đồn trú trên bề mặt, §H[From.GetName]§! đã hảo tâm đề nghị trao trả [liberated_planet.GetPlanetMoon] lại quyền kiểm soát hoàn toàn của chúng ta."
 opinion_returned_marauder_planet:0 "Đã Giải Phóng Hành Tinh"
 opinion_kept_marauder_planet:0 "Giữ Lại Hành Tinh Đã Giải Phóng"

 marauder.524.name:0 "Đại Hãn Được Coi Là Đã Chết"
 marauder.524.a.desc:0 "Bất chấp những lo ngại rằng Đại Hãn bằng cách nào đó sẽ tái xuất hiện dẫn đầu một đại hạm đội mới, sự thất bại hoàn toàn của Bộ Tộc dường như đã biến điều đó thành bất khả thi.\n\nDù không tìm thấy thi thể nào, Đại Hãn được tin là đã tử trận khi những trạm không gian và chiến hạm cuối cùng của Bộ Tộc bị phá hủy."
 marauder.524.b.desc:0 "$marauder.524.a.desc$\n\nTrong khi đó, các thủy thủ đoàn của chúng ta tiếp tục rà soát qua các mảnh vỡ của soái hạm cũ của Hãn Vương. Họ tìm thấy một chiếc ghế lớn vấy máu trôi nổi trong không gian, và tương đối chắc chắn rằng món đồ nội thất này thực chất chính là ngai vàng của Đại Hãn."
 marauder.524.a:0 "Trút được một gánh nặng!"
 marauder.524.b:0 "Một phát hiện tuyệt vời."

 marauder.526.name:0 "Kẻ Ngủ Say Tỉnh Giấc"
 marauder.526.desc:0 "Việc một trong những nơi cư trú hư không lớn của họ bị phá hủy gần đây dưới tay §H[awakened_horde.GetName]§! đã thúc đẩy §H[From.GetSpeciesNamePlural]§! lần đầu tiên trong lịch sử đoàn kết dưới trướng một Đại Hãn duy nhất. Vị tướng lĩnh bí ẩn này, người theo một số nguồn tin là một bậc thầy tâm linh quyền năng, đã thuyết phục [From.GetSpeciesNamePlural] gác lại những bất đồng vì sự sinh tồn tiếp nối.\n\nNhững đại hạm đội chiến tranh từ các khu neo đậu bí mật trước đây đang được các chiến binh [From.GetSpeciesName] hăng hái vận hành và đưa trở lại trạng thái hoạt động. Dưới sự lãnh đạo đầy cảm hứng của Đại Hãn, giờ đây họ đòi hỏi sự báo thù từ thiên hà cho đồng bào đã khuất."

 marauder.550.a.desc:0 "Ta sẽ không làm phụ lòng [raider_khanate.GetName]. Hàng tỷ thần dân đang trông cậy vào sự dẫn dắt của ta."
 marauder.550.b.desc:0 "Đây là Đại Hãn [great_khan.GetName]. Các ngươi đến để quy phục quyền cai trị của ta sao?"
 marauder.550.c.desc:0 "Không gì là không thể đối với kẻ dám dấn thân."
 marauder.550.d.desc:0 "Các ngươi đang diện kiến trước Đại Hãn. Hãy nói ra tâm nguyện của mình."
 marauder.550.e.desc:0 "Kẻ nào muốn cầu kiến Đại Hãn?"
 marauder.550.f.desc:0 "Còn nhiều thế giới nữa đang chờ ta chinh phục."
 marauder.550.g.desc:0 "Thần dân của ta đã phải chịu đựng đủ gian khổ rồi. Ta sẽ mở ra cho họ một quê hương mới giữa ngàn vì sao."
 marauder.550.h.desc:0 "Ta rơi lệ cho những kẻ ngã xuống trước quân đội của ta, nhưng không còn cách nào khác nếu giống loài [raider_khanate.GetSpeciesName] muốn có một tương lai."
 marauder.550.i.desc:0 "Đế chế ta đang gầy dựng sẽ mang lại lợi ích cho toàn thể cộng đồng thiên hà. Hiện tại trông có vẻ không giống như vậy, nhưng một ngày nào đó nơi đây sẽ trở thành ngọn hải đăng của sự ổn định và thịnh vượng cho mọi dạng sống thông minh.\n\nHòa bình cuối cùng sẽ ngự trị trong thiên hà. Bản Hãn sẽ biến điều đó thành hiện thực."
 marauder.550.j.desc:0 "Cung đình của ta luôn mở rộng đón chào các Tổng Trấn trung thành. Ngươi muốn thỉnh cầu điều gì ở ta?"
 marauder.550.k.desc:0 "Ngươi thay mặt cho Lãnh Địa Tổng Trấn [Root.GetSpeciesName] bẩm báo với ta, đúng chứ? Tên là... [Root.GetName], ta tin là vậy. Đại Hãn có thể làm gì cho các ngươi?"
 marauder.550.l.desc:0 "Loài của các ngươi có thể không phải sinh vật hữu cơ, hỡi lũ [Root.GetSpeciesNamePlural], nhưng mọi dạng sống thông minh là thần dân của [raider_khanate.GetName] đều sẽ được đối xử bình đẳng.\n\nĐiều này ta xin thề."
 marauder.550.m.desc:0 "Đôi khi ta nghĩ cuộc sống sẽ dễ dàng hơn nhiều nếu ta là một cỗ máy như các ngươi. Than ôi."
 marauder.550.n.desc:0 "Vậy ra đây là ý thức trung ương [Root.GetSpeciesName] mà ta đang trò chuyện cùng sao? Thật lôi cuốn."
 marauder.550.o.desc:0 "Ta hiểu rằng các drone [Root.GetSpeciesName] tuân theo mệnh lệnh của Tâm Thức Tập Thể mà không hề nghi vấn. Miễn là Tâm Thức của các ngươi phụng sự ta theo cách tương tự, chúng ta sẽ không có bất kỳ mâu thuẫn nào."
 marauder.550.p.desc:0 "Các ngươi đã sáng suốt khi quy phục quyền cai trị của ta. Quyết định này đã cứu sống vô số sinh mạng [Root.GetSpeciesName]."
 marauder.550.q.desc:0 "[Root.GetSpeciesNamePlural] và [raider_khanate.GetSpeciesNamePlural] không khác nhau là mấy đâu, các ngươi biết đấy. Loài của các ngươi sẽ đóng một vai trò quan trọng trong đế chế thiên hà mà chúng ta cùng nhau xây dựng."

 marauder.550.a:0 "Chúng tôi muốn thảo luận về việc đầu hàng..."
 marauder.550.a.2.response:0 "Các ngươi nghĩ ta đủ ngây thơ để tin vào những lời dối trá của [Root.GetSpeciesName] lần thứ hai sao? Không, lần này sẽ là trận chiến sinh tử đến cùng. Các ngươi đã đánh mất quyền tồn tại trong trật tự thiên hà mới mà ta đang gây dựng."
 marauder.550.b:0 "Ngươi có vẻ rất... hoạt ngôn đối với một kẻ [From.GetSpeciesName]."
 marauder.550.b.response:0 "À, phải. Có lẽ các ngươi đang đề cập đến thứ phương ngữ có phần thô kệch và... mộc mạc mà [From.GetSpeciesNamePlural] đã sử dụng cho đến tận bây giờ.\n\nCác ngươi có thể không tin điều này, nhưng ngôn ngữ [From.GetSpeciesName] từng phát triển hơn thế nhiều. Chỉ trong khoảng một ngàn năm qua, nó mới dần dần thoái hóa thành tình trạng đáng buồn hiện tại.\n\nNhưng điều đó sẽ thay đổi từ bây giờ. Kể từ nay, tất cả [From.GetSpeciesNamePlural] sẽ được giáo dục theo phiên bản cổ xưa, phong phú hơn của ngôn ngữ chúng ta. Sẽ không còn những tiếng gào thét man rợ nữa."
 marauder.550.c:0 "Chuyện gì đã xảy ra với \"Bà Chúa Hư Không\"?"
 marauder.550.c.response:0 "Những tín điều mê muội và giáo điều tôn giáo chẳng mang lại điều gì ngoài sự hủy hoại cho người [From.GetSpeciesName]. Những ai muốn tiếp tục tôn thờ Bà Chúa Hư Không, hoặc bất kỳ biểu tượng tâm linh nào khác, đều có quyền tự do làm điều đó, nhưng nó không còn là điều bắt buộc nữa.\n\nTa muốn mang lại một kỷ nguyên mới của khoa học và tiến bộ cho [From.GetSpeciesNamePlural] và quả thực, cho toàn thể thiên hà. Những kẻ cuồng tín hẹp hòi không có chỗ trong tương lai mà ta đang kiến tạo."
 marauder.550.d:0 "Chúng tôi muốn lấy lại quyền tự trị của mình."
 marauder.550.d_fail:0 "§RBạn không thể nổi dậy cho đến khi một năm đã trôi qua kể từ khi quy phục Đại Hãn.§!"

 marauder.551.a.desc:2 "Một sự lựa chọn khôn ngoan. Khi đầu hàng, các ngươi sẽ trở thành một Lãnh Địa Tổng Trấn (Satrapy) của [raider_khanate.GetName], và được kỳ vọng sẽ đóng góp tài nguyên cùng nhân lực quân sự cho các cuộc chiến đang diễn ra của chúng ta. Tuy nhiên, ngoài điều đó ra, các ngươi sẽ không phải tham gia vào các cuộc giao tranh thực tế, và ta bằng lòng để các ngươi tự quản lý cho đến khi chúng ta bình định được thiên hà.\n\n§YTrở thành một Lãnh Địa Tổng Trấn sẽ dẫn đến:§!\n§R£energy£ Thu nhập Năng Lượng Tín Dụng -30%\n£minerals£ Thu nhập Khoáng Sản -30%\n£food£ Thu nhập Lương Thực -30%\n£navy_size£ Sức Chứa Hải Quân -30%§!\n\n[raider_khanate.GetName] sẽ ngày càng hùng mạnh hơn."
 marauder.551.a.response:0 "Giờ đây các ngươi có thể tự coi mình là những bề tôi trung thành của Đại Hãn của [raider_khanate.GetName]. Với việc ký kết hiệp ước này, vô số sinh mạng [Root.GetSpeciesName] đã được cứu sống. Đây là một ngày trọng đại đối với [Root.GetName].\n\nMột khi cuộc chinh phục thiên hà của ta hoàn tất, chúng ta sẽ xem xét việc điều chỉnh hệ thống Tổng Trấn và có thể sẽ sáp nhập lãnh thổ của các ngươi chặt chẽ hơn vào đế chế của ta. Cho đến lúc đó, ta để các ngươi tự cai trị chính mình."
 marauder.551.b.response:0 "Ha! Điều đó sẽ không bao giờ xảy ra.\n\nVậy thì số phận của các ngươi sẽ được định đoạt trên chiến trường, hỡi lũ [Root.GetSpeciesNamePlural]. Với ta thì chẳng có gì khác biệt - các thế giới của các ngươi bằng cách này hay cách khác rồi cũng sẽ bị [raider_khanate.GetName] thâu tóm."
 marauder.551.a:0 "Chúng tôi chấp nhận các điều khoản của ngươi."
 marauder.551.a.tt:0 "§Y[This.GetName]§! trở thành một Lãnh Địa Tổng Trấn dưới quyền §Y[raider_khanate.GetName]§!"
 marauder.551.b:0 "Ngươi hiểu lầm rồi. Ý chúng tôi là §Hngươi§! phải đầu hàng."
 marauder.552.name:0 "[From.GetName] Quy Phục!"
 marauder.552.desc:0 "§H[new_satrapy.GetName]§! đã quy phục Đại Hãn! Họ đã bị biến thành một Lãnh Địa Tổng Trấn của [raider_khanate.GetName], và các hạm đội của họ hiện đang dừng hoạt động chiến đấu.\n\nDù chưa chính thức cùng [raider_khanate.GetSpeciesNamePlural] tham gia vào nỗ lực chinh phục thiên hà, họ đã cam kết đóng góp tài nguyên và nhân lực quân sự để củng cố thêm cỗ máy chiến tranh của Đại Hãn."
 marauder.552.a:0 "Lũ hèn nhát nhu nhược!"

 marauder.553.name:1 "Bộ Tộc Thiết Lập Căn Cứ Tại [capital_star.GetName]"
 marauder.553.desc:1 "Để \"bảo vệ\" chúng ta, §H[raider_khanate.GetName]§! đã thiết lập một cơ sở không gian quân sự lớn tại hệ sao §H[capital_star.GetName]§!, được phòng thủ bởi một hạm đội đồn trú đáng kể. Vai trò thứ hai của căn cứ này dường như là để nhắc nhở chúng ta hoàn thành nghĩa vụ của một Lãnh Địa Tổng Trấn và giám sát việc tuyển mộ người [Root.GetSpeciesNamePlural] phục vụ trong các hạm đội chiến đấu của Đại Hãn."
 marauder.553.a:0 "Như Đại Hãn đã truyền lệnh..."

 marauder.554.a.desc:0 "Hãy nghĩ kỹ điều này, hỡi lũ [Root.GetSpeciesNamePlural]. Nếu các ngươi dấn thân vào con đường này, sẽ không có đường quay lại đâu. Ta sẽ không chấp nhận một sự đầu hàng lần thứ hai.\n\nSố phận duy nhất có thể xảy ra đối với một Lãnh Địa Tổng Trấn nổi loạn là sự hủy diệt hoàn toàn."
 marauder.554.a:0 "Chúng tôi tuyên bố hoàn toàn độc lập!"
 marauder.554.a.response:0 "Cứ như vậy đi. Các ngươi đã tự định đoạt án tử cho người dân của mình, hỡi lũ [Root.GetSpeciesNamePlural]. Ta sẽ không dừng lại cho đến khi đế chế thảm hại của các ngươi chìm trong đống đổ nát - ta xin thề điều này!\n\nNó sẽ là bài học làm gương cho phần còn lại của thiên hà về cái giá của việc dám thách thức ý nguyện của Đại Hãn."
 marauder.554.b:0 "Ồ. Nếu vậy thì thôi bỏ đi."
 marauder.554.b.response:0 "Ta cũng nghĩ vậy. Đừng thử thách sự kiên nhẫn của ta, hỡi lũ [Root.GetSpeciesNamePlural]."
 marauder.550.r.desc:0 "Ta đã tin tưởng các ngươi, [Root.GetSpeciesName]. Ta đã trao cho các ngươi một chỗ ngồi tại bàn của ta... và đổi lại, các ngươi nhổ vào mặt ta."
 marauder.550.s.desc:0 "Ta không dung thứ cho những kẻ phản bội. Chúng ta không có gì để bàn luận nữa."
 marauder.550.t.desc:0 "Lũ cặn bã bội bạc. Vậy ra các ngươi từng muốn trở thành một Tổng Trấn, đúng không?\n\nCác ngươi đã biến ta thành kẻ ngốc, và đó là điều ta không bao giờ tha thứ."
 marauder.550.u.desc:0 "Các ngươi đã biến chuyện này thành ân oán cá nhân rồi đấy, [Root.GetSpeciesName]."
 marauder.550.v.desc:0 "Ngươi và những kẻ chia sẻ sự coi thường tuyệt đối đối với sinh mệnh có tri giác chính là lý do tại sao thiên hà đang rất cần sự dẫn dắt kiên quyết của ta.\n\nSự tồn tại tiếp tục của các ngươi tự thân nó đã là một mối đe dọa. Bản Hãn sẽ đặt dấu chấm hết cho nó."
 marauder.550.w.desc:0 "HYEEIIIIEEEEE, tên dwamak! Ngươi đang nói chuyện với... *khẹc*\n\nÝ... ý ta là, ngươi đang hiện diện trước vẻ uy nghiêm của Đại Hãn. Hãy nói ra suy nghĩ của ngươi."

 marauder.620.name:0 "Bộ Tộc Phân Liệt"
 marauder.620.desc:0 "Cái chết của §HĐại Hãn§! đã trở thành khởi đầu cho sự sụp đổ của §H[From.GetName]§!. Không có một vị minh chủ mạnh mẽ để thống nhất, [From.GetSpeciesNamePlural] một lần nữa lại rơi vào cảnh nội chiến tàn sát lẫn nhau. Đế chế của họ đã bị chia rẽ giữa các §HDiadochi§!, những tướng lĩnh quân sự quyền lực và có ảnh hưởng nhất của Đại Hãn.\n\nMỗi người trong số họ giờ đây đều tự xưng là Đại Hãn của Thiên Hà, và những người ủng hộ họ rơi vào thế đối đầu cay đắng. Kỷ nguyên của một đế chế [From.GetSpeciesName] thống nhất rõ ràng đã đi đến hồi kết."
 marauder.620.a:0 "Chuyện gì đến cũng phải đến."
 marauder.630.name:0 "Bộ Tộc Quay Lại Đường Lối Cũ"
 marauder.630.desc:0 "Cái chết của Đại Hãn cũng đã giáng một đòn chí mạng vào nhiều cuộc cải cách từng được [From.GetSpeciesNamePlural] tiến hành nhằm biến các bộ tộc marauder vô tổ chức thành một đế chế thiên hà vững chắc.\n\nKhông một ai trong số các tướng lĩnh kế vị Đại Hãn tỏ ra chút mảy may quan tâm đến việc tiếp tục những cải cách này, và toàn bộ [From.GetSpeciesNamePlural] đã quay trở lại với lối sống bạo lực cướp bóc trong quá khứ của họ. [From.GetSpeciesNamePlural] không còn đoàn kết nữa."
 marauder.630.a:0 "Có lẽ điều đó là không thể tránh khỏi."
 marauder.640.name:0 "Hãn Quốc Mới"
 marauder.640.desc:0 "Vượt qua mọi nghịch cảnh, §HBộ Tộc [From.GetSpeciesName]§! đã vượt qua được cơn giông bão theo sau cái chết của §HĐại Hãn§!. Nguy cơ trước mắt về việc phân liệt thành các quốc gia kế nghiệp khác nhau phần lớn đã bị triệt tiêu với lễ đăng quang của một vị hãn vương mới.\n\nHiện tại, Hãn Quốc [From.GetSpeciesName] tái sinh này dường như quan tâm nhiều hơn đến việc củng cố lãnh thổ mà nó đã kiểm soát hơn là tiến hành các cuộc chinh phục mới."
 marauder.640.a:0 "Chúng ta sẽ xem họ tồn tại được bao lâu."
 marauder.660.name:0 "Liên Hợp Tinh Cầu Mới"
 marauder.660.desc:0 "$marauder.660.1.desc$\n\n$marauder.660.2.desc$"
 marauder.660.1.desc:0 "Cuộc tranh giành quyền lực nổ ra tại §H[From.GetName]§! sau cái chết của §HĐại Hãn§! đã đi đến hồi kết. Một phe phái dân chủ mới, được truyền cảm hứng từ các giá trị bình đẳng vốn hoàn toàn xa lạ với [From.GetSpeciesNamePlural] khi họ bắt đầu cuộc chiến chinh phục, hiện đang tìm cách cải cách chính phủ theo mô hình một liên bang liên sao."
 marauder.660.2.desc:0 "Là một Lãnh Địa Tổng Trấn của Bộ Tộc, chúng ta đã được mời tham gia vào liên bang mới này với tư cách là thành viên sáng lập. Ngoài ra, bản hiến pháp vừa được soạn thảo của Bộ Tộc cũng cho phép chúng ta ly khai và tái lập nền độc lập hoàn toàn."
 marauder.660.a:0 "Chúng ta sẽ gia nhập liên bang mới này."
 marauder.660.b:0 "Cuối cùng cũng được tự do!"
 marauder.661.desc:0 "$marauder.660.1.desc$\n\n$marauder.661.2.desc$"
 marauder.661.2.desc:0 "Các cựu Lãnh Địa Tổng Trấn của Bộ Tộc đã nhận được lời đề nghị gia nhập liên bang mới này với tư cách là các đối tác bình đẳng, hoặc chính thức ly khai để nhận lại nền độc lập hoàn toàn."
 marauder.661.a:0 "Chúng ta sẽ chờ xem điều gì sẽ xảy ra."
 marauder.665.a.desc:0 "§Y<< Cái chết của Đại Hãn đã đẩy Bộ Tộc [From.GetSpeciesName] vào tình trạng hỗn loạn. Không có ai sẵn lòng hoặc có khả năng tiếp nhận cuộc gọi của bạn. >>§!"
 marauder.665.a:0 "Chuyện gì đang xảy ra bên đó vậy?"

 marauder.670.name:0 "Hồi Kết Của Lãnh Địa Tổng Trấn"
 marauder.670.desc:1 "Với sự hỗn loạn và bất ổn theo sau cái chết của Đại Hãn, vị thế Tổng Trấn của chúng ta trong Bộ Tộc đã vô hiệu - lời thề trung thành của chúng ta chỉ dành riêng cho một mình Đại Hãn. Chúng ta một lần nữa được tự do theo đuổi vận mệnh của chính mình.\n\nToàn bộ nhân sự quân sự của Bộ Tộc từng đóng quân tại hệ sao [Root.Capital.solar_system.GetName] đã rời bỏ vị trí để đoàn tụ với đồng bào ở nơi khác, sau khi đã phá hủy mọi khí tài chiến tranh để lại."
 marauder.670.a:0 "Chúng ta đã tự do."
 marauder.671.name:0 "Hãn Quốc Phá Hủy Trạm Đồn Trú"
 marauder.671.desc:0 "Khi Hãn Quốc Mới phải chật vật duy trì quyền kiểm soát các vùng đất chinh phục của Đại Hãn, ban lãnh đạo quân sự đã quyết định củng cố thêm lực lượng. Do đó, họ đã rút toàn bộ nhân sự khỏi các trạm đồn trú của chư hầu và tự đánh đắm các trạm đó."
 marauder.671.a:0 "Sự kìm kẹp của họ đang nới lỏng."

 marauder_skirmishing:0 "Đá Mài Marauder"
 marauder_skirmishing_desc:0 "Những cuộc đụng độ liên miên ở biên giới với lũ Marauder lang bạt đã tôi luyện các hạm đội của chúng ta trong chiến trận và nâng cao hiệu quả tác chiến."
 marauder.701.name:0 "Người Tị Nạn [marauder_neighbor_species.GetName]"
 marauder.701.desc:0 "Các tàu vận tải chở một lượng lớn người tị nạn [marauder_neighbor_species.GetName] đã tiến vào không phận của chúng ta từ hướng §H[marauder_neighbor.GetName]§!. Những kẻ lưu đày này dường như đã bị trục xuất khỏi các trạm không gian xập xệ mà họ từng gọi là nhà trong một nghi thức nào đó, nhằm kiểm soát dân số trong thời kỳ tài nguyên khan hiếm. Họ đã được phép định cư trên §H[Root.GetName]§!."
 marauder.701.a:0 "Họ được chào đón ở đó."
 marauder.702.name:0 "Đá Mài Vĩ Đại"
 marauder.702.a.desc:0 "Một thời gian dài đụng độ không ngừng ở biên giới với §H[marauder_neighbor.GetName]§! đã tôi luyện các thủy thủ đoàn hải quân đang phục vụ. Năng lực của họ đã được trui rèn trong chiến đấu, và lực lượng của chúng ta thậm chí đã tiếp thu một số thao tác tác chiến phức tạp của [marauder_neighbor_species.GetName] giúp mang lại lợi thế trong các cuộc xung đột tương lai."
 marauder.702.b.desc:0 "Sau một thời gian dài đụng độ với §H[marauder_neighbor.GetName]§! dọc biên giới, các thủy thủ đoàn [root.GetIndividualName] của các chiến hạm dường như đã phát triển một mức độ chủ động nhất định. Giờ đây họ có khả năng đối phó tốt hơn với các chiến thuật thường khó lường do [marauder_neighbor_species.GetNamePlural] sử dụng.\n\nĐiều này cuối cùng sẽ phải được xử lý trước khi các thủy thủ đoàn phát triển mức độ cá tính nguy hiểm, nhưng hiện tại nó mang lại cho chúng ta lợi thế trong bất kỳ cuộc giao tranh nào sắp tới."
 marauder.702.c.desc:0 "Hiệu quả của các đơn vị hải quân của chúng ta đã tăng lên sau một thời gian dài giao tranh biên giới với §H[marauder_neighbor.GetName]§!. Các đơn vị của chúng ta buộc phải thực hiện những thay đổi nhỏ trong lập trình để bù đắp cho các chiến thuật dị biệt và khó lường do [marauder_neighbor_species.GetNamePlural] sử dụng.\n\nCuối cùng việc thanh lọc dữ liệu mới này sẽ trở nên cần thiết để ngăn chặn sự suy thoái hệ thống ở các lĩnh vực khác, nhưng hiện tại nó mang lại cho chúng ta lợi thế trong các cuộc giao tranh tương lai."
 marauder.703.name:0 "Khoang Thoát Hiểm [marauder_neighbor_species.GetName]"
 marauder.703.desc:0 "Một khoang thoát hiểm [marauder_neighbor_species.GetName] gần đây đã trôi dạt vào không gian của chúng ta, sau một cuộc đụng độ đặc biệt bạo lực giữa hai bộ tộc thù địch thuộc §H[marauder_neighbor.GetName]§!. Các đơn vị tuần tra biên giới đã chặn giữ khoang thoát hiểm và mở nó ra, phát hiện một sĩ quan cấp tướng [marauder_neighbor_species.GetName] đầy lòng biết ơn. Viên Chỉ Huy đã cam kết phục vụ chúng ta cho đến chết, hoàn toàn miễn phí."
 marauder.703.a:0 "Chào mừng lên tàu, Chỉ Huy."
 marauder.703.b:0 "Chúng ta không có nhu cầu thêm một Chỉ Huy nữa."
 marauder.703.c:0 "Cho sinh vật bằng xương thịt đó an tử đi."
 marauder.703.d:0 "Thu hoạch sinh vật này."
 marauder.703.e:0 "Cho đến chết sao? Vậy xử lý tên ngoại tộc đó đi."
 marauder.703.f: "Ném toàn bộ khoang đó vào lò luyện hợp kim của chúng ta."
 gain_marauder_admiral:0 "Chúng ta có được một Chỉ Huy [marauder_neighbor_species.GetName] dày dạn kinh nghiệm."
 gain_marauder_fleet:0 "Chúng ta có được một hạm đội nhỏ gồm các tàu Marauder."
 marauder.704.name:0 "Hạm Đội Trôi Dạt"
 marauder.704.desc:0 "Một hạm đội nhỏ gồm các chiến hạm [marauder_neighbor_species.GetName] vô chủ gần đây đã được phát hiện trong hệ sao [border_system.GetName], không xa lãnh thổ của §H[marauder_neighbor.GetName]§!. Nhật ký máy tính trên tàu chỉ ra rằng thủy thủ đoàn đã tháo chạy vào không phận của chúng ta để trốn thoát một cuộc huyết thù bộ tộc nào đó. Thật không may cho họ, họ mang theo quá ít đồ tiếp tế và nhanh chóng chết đói. Những con tàu đã trôi dạt kể từ đó.\n\nCác kỹ sư của chúng ta đã kiểm tra các con tàu và chúng dường như vẫn ở tình trạng tốt. Nếu được bố trí thủy thủ đoàn, chúng ta có thể đưa chúng vào biên chế hạm đội của mình."
 marauder.704.a:0 "Phải, chúng có thể trở thành một tài sản hữu ích."
 marauder.704.b:0 "Không, những con tàu đó chỉ là rác rưởi không gian. Hãy rã sắt vụn chúng."
 marauder.705.name:0 "Kho Dự Trữ Tài Nguyên [marauder_neighbor_species.GetName]"
 marauder.705.desc:0 "Tình cờ, các đơn vị tuần tra gần đây đã phát hiện một kho dự trữ tài nguyên ẩn giấu trong không gian sâu tại hệ sao [border_system.GetName], gần biên giới của chúng ta với §H[marauder_neighbor.GetName]§!. Những công-ten-nơ hàng hóa khổng lồ của kho dự trữ chứa các chiến lợi phẩm từ nhiều cuộc đột kích của [marauder_neighbor_species.GetName] vốn được tiến hành từ nhiều thế kỷ trước.\n\nVào một thời điểm nào đó, kho chứa này đã bị lãng quên, hoặc có lẽ những người chủ của nó đã bị giết trong một cuộc đột kích khác hoặc trong vô số các cuộc huyết thù huynh đệ tương tàn của [marauder_neighbor_species.GetName]. Dù thế nào đi nữa, những thứ bên trong giờ đây thuộc về chúng ta."
 marauder.706.name:0 "Khu Cư Trú [marauder_neighbor_species.GetName] Bỏ Hoang"
 marauder.706.desc:0 "Chúng ta đã phát hiện tàn tích của một khu cư trú không gian [marauder_neighbor_species.GetName] xây dở trên quỹ đạo gần quanh [border_planet.GetName], bên trong biên giới chúng ta. Rõ ràng, vào một thời điểm nào đó §H[marauder_neighbor.GetName]§! đã cố gắng thiết lập sự hiện diện lâu dài tại hệ sao [border_system.GetName], nhưng vì lý do nào đó mà nỗ lực này đã bị từ bỏ.\n\nDo nằm rất gần [border_planet.GetName], khu cư trú dang dở này đã tránh được sự phát hiện trong cuộc khảo sát ban đầu của chúng ta về hệ sao. Hiện tại nó chẳng khác gì một đống rác không gian dày đặc, nhưng có rất nhiều khoáng sản giá trị trong đống mảnh vỡ có thể trục vớt được."
 marauder.706.a:0 "Trục vớt mọi thứ chúng ta có thể sử dụng."
 marauder.707.name:0 "Phi Thuyền [marauder_neighbor_species.GetName]"
 marauder.707.desc:0 "Một phi thuyền nhỏ của [marauder_neighbor_species.GetName] gần đây đã tiến vào không phận của chúng ta tại hệ sao [border_system.GetName], bị truy đuổi bởi những kẻ đột kích từ §H[marauder_neighbor.GetName]§!. Chúng ta không chắc chắn tại sao họ lại bị chính đồng bào mình săn đuổi, nhưng những kẻ đột kích đã rút lui khi bị lực lượng an ninh biên giới của ta chặn hỏi.\n\nChiếc phi thuyền hư hỏng nặng đã được thu hồi, phát hiện ra rằng thủy thủ đoàn đã thiệt mạng không lâu sau khi tiến vào [border_system.GetName]. Khoang hàng của nó chứa đầy các chip năng lượng tín dụng đánh cắp được."
 marauder.707.a:0 "Theo quyền trục vớt, số tín dụng đó là của chúng ta."



 HORDE_SUCCESSOR_GREETING_01:0 "Chúng ta tôn vinh ký ức về Đại Hãn."
 HORDE_SUCCESSOR_GREETING_02:0 "Chúng ta là những người thừa kế chân chính di sản của Đại Hãn."
 HORDE_SUCCESSOR_GREETING_03:0 "Nhân danh Đại Hãn!"
 HORDE_SUCCESSOR_GREETING_04:0 "Đại Hãn sống mãi, chừng nào chúng ta còn nhớ tới Người."
 HORDE_SUCCESSOR_GREETING_05:0 "Đại Hãn vẫn dõi theo chúng ta từ Cõi Vĩnh Hằng."
 HORDE_SUCCESSOR_GREETING_06:0 "Đừng dại dột đối đầu với Những Đứa Con Của Đại Hãn."
 HORDE_SUCCESSOR_WAR_GREETING_01:0 "Các ngươi không thể chiến thắng trước hậu duệ của Đại Hãn."
 HORDE_SUCCESSOR_WAR_GREETING_02:0 "Sự hủy diệt của các ngươi sẽ tôn vinh ký ức về Đại Hãn."
 HORDE_SUCCESSOR_WAR_GREETING_03:0 "Chúng ta sẽ hoàn thành lời hứa của Đại Hãn bằng cách nghiền nát đế chế thảm hại của các ngươi thành tro bụi."
 HORDE_SUCCESSOR_WAR_GREETING_04:0 "Các ngươi sẽ bị tiêu diệt! Đó là ý nguyện của Đại Hãn!"
 HORDE_SUCCESSOR_WAR_GREETING_05:0 "Nhân linh hồn của Đại Hãn, đế chế của các ngươi sẽ rực cháy!"
 HORDE_SUCCESSOR_WAR_GREETING_06:0 "Đại Hãn đã dạy chúng ta cách đối phó với những kẻ như các ngươi."

 FRIENDLY_COLOSSUS_GREETING_01:0 "Các bạn đã thấy Pháo Đài Hủy Diệt Hành Tinh (Colossus) của chúng tôi chưa? Một kỳ quan công nghệ thực sự. Chúng tôi rất hân hạnh được dẫn một phái đoàn sĩ quan của các bạn đi tham quan một số khoang không mật của nó."
 FRIENDLY_COLOSSUS_GREETING_02:0 "Đừng lo lắng về Pháo Đài Hủy Diệt Hành Tinh (Colossus) của chúng tôi. Sức mạnh hủy diệt của nó chỉ dành riêng cho kẻ thù, không phải bạn bè chúng tôi."
 NEUTRAL_COLOSSUS_GREETING_01:0 "Lời nói của chúng ta được hậu thuẫn bởi sức mạnh hủy diệt hành tinh của một Pháo Đài Hủy Diệt Hành Tinh (Colossus)!"
 NEUTRAL_COLOSSUS_GREETING_02:0 "Chúng tôi sẵn sàng sử dụng toàn bộ tiềm năng hủy diệt của Pháo Đài Hủy Diệt Hành Tinh (Colossus) nếu tình thế bắt buộc. Tất nhiên, chúng tôi hy vọng điều này sẽ không cần thiết."
 HOSTILE_COLOSSUS_GREETING_01:0 "Hãy cầu nguyện rằng các ngươi sẽ không bao giờ phải chứng kiến hỏa lực của một Pháo Đài Hủy Diệt Hành Tinh (Colossus) được vũ trang và vận hành đầy đủ!"
 HOSTILE_COLOSSUS_GREETING_02:0 "Pháo Đài Hủy Diệt Hành Tinh (Colossus) mà chúng ta đã chế tạo là công cụ để đối phó với những kẻ như [From.GetName]. Đừng cho chúng ta lý do để sử dụng nó chống lại các thế giới của các ngươi."
 PACIFIST_COLOSSUS_GREETING_01:0 "Pháo Đài Hủy Diệt Hành Tinh (Colossus) mà chúng tôi chế tạo chỉ là một biện pháp phòng thủ, không hơn không kém. Mục đích của nó là bảo vệ người dân chúng tôi, và nếu cần thiết, bảo vệ thiên hà khỏi những kẻ muốn gây hại cho nó."
 SPIRITUALIST_COLOSSUS_GREETING_01:0 "Chúng ta đã truyền chính sức mạnh của các Thánh Linh vào Pháo Đài Hủy Diệt Hành Tinh (Colossus). Nó sẽ nhanh chóng xử lý bất kỳ kẻ dị giáo hay công trình báng bổ nào."
 MATERIALIST_COLOSSUS_GREETING_01:0 "Pháo Đài Hủy Diệt Hành Tinh (Colossus) mà chúng tôi sở hữu là thành tựu đỉnh cao trong hành trình công nghệ lâu dài của chúng tôi. Quả thực, không có gì mà Khoa học không thể đạt được."
 PURIFIER_COLOSSUS_GREETING_01:0 "Các ngươi chưa nhìn thấy Pháo Đài Hủy Diệt Hành Tinh (Colossus) của chúng ta sao, lũ dị tộc rác rưởi? Không sao cả. Các ngươi sẽ được chiêm ngưỡng toàn bộ khả năng của nó khi nó thổi bay [From.Capital.GetName] sang thế giới bên kia."
 EXTERMINATOR_COLOSSUS_GREETING_01:0 "Chúng tôi ước tính hiệu suất tăng 254.88% trong toàn bộ các chiến dịch thanh tẩy sinh vật hữu cơ khi Pháo Đài Hủy Diệt Hành Tinh (Colossus) đã trực tuyến hoàn toàn."
 HIVE_COLOSSUS_GREETING_01:0 "Pháo Đài Hủy Diệt Hành Tinh (Colossus) mà chúng ta chế tạo là hiện thân ý chí của Đại Tâm Thức."
 FRIENDLY_COLOSSUS_REACT_GREETING_01:0 "Các kỹ sư của chúng tôi rất ấn tượng trước Pháo Đài Hủy Diệt Hành Tinh (Colossus) hùng mạnh của các bạn. Giờ đây hơn bao giờ hết, chúng tôi biết ơn mối quan hệ tốt đẹp giữa hai đế chế chúng ta."
 FRIENDLY_COLOSSUS_REACT_GREETING_02:0 "Chỉ có kẻ ngốc mới dám đối đầu với [From.GetName], khi các bạn được trang bị một Pháo Đài Hủy Diệt Hành Tinh (Colossus). Chúng tôi rất vui khi được tính đế chế của các bạn là bạn bè."
 NEUTRAL_COLOSSUS_REACT_GREETING_01:0 "Việc các bạn chế tạo Pháo Đài Hủy Diệt Hành Tinh (Colossus) này là mối bận tâm sâu sắc đối với chúng tôi. Bằng việc nắm giữ một công cụ hủy diệt khủng khiếp như vậy, các bạn đã làm đảo lộn cán cân quyền lực trong toàn bộ thiên hà."
 NEUTRAL_COLOSSUS_REACT_GREETING_02:0 "Pháo Đài Hủy Diệt Hành Tinh (Colossus) của các bạn vừa ấn tượng vừa đáng lo ngại. Liệu nó thực sự có thể phá hủy toàn bộ các thế giới sao?"
 HOSTILE_COLOSSUS_REACT_GREETING_01:0 "Pháo Đài Hủy Diệt Hành Tinh (Colossus) được tán tụng của các ngươi cũng có thể bị nổ tung như bất kỳ phi thuyền nào khác. Các ngươi nên nhớ kỹ điều đó."
 HOSTILE_COLOSSUS_REACT_GREETING_02:0 "Cái Pháo Đài Hủy Diệt Hành Tinh (Colossus) đó của các ngươi... các ngươi thật ngốc nghếch khi xây dựng một con quái vật như vậy. Hãy nghĩ xem nguồn tài nguyên đó có thể trang bị cho bao nhiêu thiết giáp hạm!"
 WAR_COLOSSUS_GREETING_01:0 "Hãy đầu hàng ngay đi, lũ ngốc các ngươi, khi các ngươi vẫn còn có thể! Nếu không Pháo Đài Hủy Diệt Hành Tinh (Colossus) của chúng ta sẽ xóa sổ các ngươi khỏi sự tồn tại!"
 WAR_COLOSSUS_GREETING_02:0 "Các ngươi không thể hy vọng đứng vững trước sức mạnh áp đảo của Pháo Đài Hủy Diệt Hành Tinh (Colossus) của chúng ta. Nó sẽ biến các thế giới của các ngươi thành tro bụi."

