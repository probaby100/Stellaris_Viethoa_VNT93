 action.82.name:0 "[From.GetName] Bị Oanh Tạc"
 action.82.desc:0 "Một hạm đội thuộc về §H[From.From.GetName]§! đã tàn sát cư dân của §H[From.GetName]§!! Sau một chiến dịch oanh tạc quỹ đạo tập trung và không ngừng nghỉ, tất cả các trung tâm dân cư trên bề mặt đã bị xóa sổ một cách có hệ thống, biến [From.GetPlanetMoon] thành một vùng đất hoang nhiễm xạ, hầu như không còn khả năng duy trì sự sống."
 action.82.a:0 "Tội ác tày trời này phải được rửa hận!"
 action.83.desc:0 "Lực lượng của chúng ta báo cáo rằng họ đã kết thúc cuộc oanh tạc quỹ đạo đối với §H[From.GetName]§!. Tất cả các trung tâm dân cư đã bị xóa sổ có hệ thống, và [From.GetPlanetMoon] bị nhiễm xạ giờ đây chỉ có thể duy trì sự sống tối thiểu."
 bombed_to_tomb_world:0 "§Y[From.GetName] giờ đây là một Thế Giới Điêu Tàn không một bóng người.§!"

 god_rayed:0 "Ánh Sáng Thần Thánh"
 god_rayed_desc:0 "Tác động của Tia Phán Quyết Thần Thánh vẫn còn vương vấn trong bầu khí quyển, thổ nhưỡng, và hệ động thực vật địa phương."
 uneasy_faith:0 "Đức Tin Bất An"
 uneasy_faith_desc:0 "Dân chúng ở mức độ nào đó nhận thức được rằng lòng nhiệt thành đức tin của họ không hoàn toàn xuất phát từ chính bản thân họ."
 neutron_bombarded:0 "Oanh Tạc Neutron"
