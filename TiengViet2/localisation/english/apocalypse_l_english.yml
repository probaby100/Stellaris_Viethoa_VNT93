 pc_ringworld_shielded_desc:0 "Phân đoạn Thế Giới Vành Đai này được bao bọc trong một loại rào chắn năng lượng bất khả xâm phạm. Nó ngăn chặn mọi cuộc quét bề mặt."
 pc_habitat_shielded:0 "Môi Trường Sống Bị Phong Tỏa"
 pc_habitat_shielded_desc:0 "Trạm môi trường sống này được bao bọc trong một loại rào chắn năng lượng bất khả xâm phạm. Nó ngăn chặn mọi cuộc quét bên trong."
