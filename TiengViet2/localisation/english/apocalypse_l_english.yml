 end_trade_3:0 "Điều này sẽ chấm dứt thỏa thuận thương mại tài nguyên hiện tại của chúng ta với người Muutagan."
 leviathans.105.e:1 "Chúng tôi muốn chấm dứt thỏa thuận thương mại tài nguyên."
 leviathans.105.e.response:0 "Rất tốt. Chúng tôi sẽ ngay lập tức gửi chỉ thị đến các tàu chở hàng, lệnh cho họ dừng hoạt động và quay về căn cứ.\n\nHãy cho chúng tôi biết nếu bạn đổi ý!"
 leviathans.171.name:1 "Thương Mại Năng Lượng Bị Hủy"
 leviathans.171.desc:1 "Khi trữ lượng năng lượng của chúng ta cạn kiệt, chúng ta không thể tiếp tục duy trì các thỏa thuận thương mại phụ thuộc vào tài nguyên này nữa. Tất cả các thỏa thuận như vậy với các Phái Bộ Thương Nhân đã bị hủy bỏ."
 leviathans.171.a:0 "Thật không hay chút nào."
 enclave_mineral_trade_ended:0 "Không đủ £energy£ §HNăng Lượng Tín Dụng§! để duy trì các thỏa thuận tài nguyên với các Phái Bộ Thương Nhân."
 leviathans.173.name:1 "Thương Mại Khoáng Sản Bị Hủy"
 leviathans.173.desc:1 "Khi kho dự trữ khoáng sản của chúng ta cạn kiệt, chúng ta không thể tiếp tục duy trì các thỏa thuận thương mại phụ thuộc vào tài nguyên này nữa. Tất cả các thỏa thuận như vậy với các Phái Bộ Thương Nhân đã bị hủy bỏ."
 enclave_energy_trade_ended:1 "Không đủ £energy£ §HNăng Lượng Tín Dụng§! để duy trì các thỏa thuận tài nguyên với các Phái Bộ Thương Nhân."
 leviathans.175.name:0 "Thương Mại Lương Thực Bị Hủy"
 leviathans.175.desc:0 "Khi nguồn lương thực dự trữ của chúng ta cạn kiệt, chúng ta không thể tiếp tục duy trì các thỏa thuận thương mại phụ thuộc vào tài nguyên này nữa. Tất cả các thỏa thuận như vậy với các Phái Bộ Thương Nhân đã bị hủy bỏ."
 enclave_food_trade_ended:0 "Không đủ £food£ §HLương Thực§! để duy trì các thỏa thuận tài nguyên với các Phái Bộ Thương Nhân."

 leviathans.111.e:0 "Đó là tất cả."

 colossus_victim:0 "Khủng Hoảng Dân Sự Tận Thế"
 colossus_victim_desc:0 "Chấn thương tâm lý toàn quốc từ cuộc tấn công của Pháo Đài Hủy Diệt Hành Tinh (Colossus) biểu hiện qua sự biến chuyển hệ tư tưởng trên diện rộng cư dân."

 decision_make_holy_world:0 "Thánh Hóa Hành Tinh"
 decision_make_holy_world_desc:1 "Chúng ta tìm kiếm trong lãnh thổ một §Y$pc_gaia$§! chưa bị thuộc địa hóa để định danh thành Thánh Địa. Chừng nào nơi đây còn chưa bị phàm nhân làm ô uế và vẫn nằm trong biên giới của chúng ta, hành tinh bất khả xâm phạm này sẽ đem lại cho chúng ta: £unity£ §Y$country_base_unity_produces_mult$§! §G+10%§!."

 apoc.200.name:0 "Ứng Viên Thánh Địa"
 apoc.200.desc:0 "Hợp tác với các chuyên gia thần học, nhiều nhà chiêm bái đã độc lập xác nhận rằng §Y[holy_target.GetName]§! trong hệ sao [holy_target.GetStarName] xứng đáng được đặc biệt tôn kính.\n\nSự công nhận chính thức chắc chắn sẽ thúc đẩy lòng sùng kính của công chúng đối với thế giới huyền bí này."
 apoc.200.a:0 "Cầu mong [holy_target.GetName] được thánh hóa."
 apoc.200.a.tooltip:0 "Đã thêm hiệu ứng điều chỉnh §Y$holy_player_planet$§!"

 apoc.201.name:0 "Không Tìm Thấy Ứng Viên Thánh Địa"
 apoc.201.desc:0 "Các nhà chiêm bái hàng đầu của chúng ta đã ban hành một báo cáo nêu rõ rằng không tìm thấy bất kỳ điểm hội tụ tâm linh nào trong các hành tinh thuộc Đế Chế của chúng ta."
 apoc.201.a.tooltip:0 "Chi phí Ban bố Sắc lệnh £influence£ Ảnh hưởng được hoàn trả."

 holy_player_planet:1 "Thế Giới Thánh Hóa"
 holy_player_planet_desc:0 "Hành tinh này chưa từng bị sự sống có tri giác làm vấy bẩn và được coi là linh thiêng."
 has_holy_player_planet:0 "Tôn Thờ Hành Tinh"
 has_holy_player_planet_desc:0 "Chúng ta đã định danh một thế giới không người ở bên trong biên giới làm thánh địa."

 has_world_worship:0 "$TRIGGER_FAIL$§RChúng ta đã định danh một§! §Y$holy_player_planet$§!"
 has_holy_world_candidate:0 "$TRIGGER_FAIL$§RKhông có §YHành Tinh Gaia§! chưa thuộc địa hóa nào bên trong biên giới chúng ta§!"
 make_holy_world_effect:0 "Chúng ta bắt đầu tìm kiếm một hành tinh thích hợp để Thánh Hóa."

 opinion_cracked_my_uninhabited_world:0 "Đã nghiền nát Hành Tinh Không Người Ở của chúng ta"
 opinion_cracked_an_uninhabited_world:0 "Đã nghiền nát một Hành Tinh Không Người Ở"
 opinion_worships_our_holy_world:0 "Tôn kính Thánh Địa"

 action.91.name:0 "Tiền Đồn Đã Tái Thiết!"
 action.91.desc:0 "Chúng ta một lần nữa giành lại quyền kiểm soát hệ sao §Y[Root.GetStarName]§! và tái thiết §Y$starbase_outpost$§! trên quỹ đạo quanh ngôi sao."

