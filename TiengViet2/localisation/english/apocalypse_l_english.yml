 apoc.100.name:0 "Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus)"
 apoc.100.desc:0 "$COLOSSUS_PROJECT_DESC$"
 apoc.100.desc.pacif:0 "Khi thuyết răn đe một lần nữa thịnh hành trong giới khoa học chính trị hàng đầu trên [Root.Capital.GetName], Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus) được đưa ra như một biện pháp răn đe tối thượng; một thứ vũ khí vượt trội hơn cả cấp hạm Siêu Thiết Giáp Hạm (Titan). Dù các tàu Colossus được đề xuất có thể mang tải trọng có khả năng hủy diệt hoàn toàn hành tinh, chúng ta sẽ triển khai chúng bằng một phương thức giải quyết xung đột ít bạo lực hơn - nhưng không kém phần đáng sợ và vĩnh viễn.\n\nNếu một kẻ thù giả định không chịu chấm dứt hành vi xâm lược chống lại chúng ta hoặc các đồng minh của chúng ta, chúng ta chỉ đơn giản là §Rbắt buộc họ phải làm vậy§!."
 apoc.100.desc.milit:0 "Từng chỉ được nhắc đến bằng những giọng nói thì thầm, và trước đó chỉ là những lời xì xào trong những hành lang mê cung sâu kín nhất của các cơ sở nghiên cứu quân sự tuyệt mật, Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus) giờ đây đã nhận được sự chấp thuận chính thức. Có thể nói đây là phát minh quân sự vĩ đại nhất mà thiên hà từng chứng kiến, Dự Án Colossus bao gồm việc phát triển một nền tảng vũ khí §RHủy Diệt Hành Tinh§! cũng như một cấu hình thân tàu Colossus để mang nó. Các tàu Colossus có thể sẽ cần tàu hộ tống vì những đòi hỏi khắt khe của vũ khí Hủy Diệt Hành Tinh sẽ loại trừ mọi vũ khí khác.\n\nDẫu vậy, Colossus một khi được chế tạo hứa hẹn sẽ là lực lượng hủy diệt đơn lẻ khủng khiếp nhất thiên hà."
 apoc.100.desc.phobe:0 "Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus) đang được ca ngợi là bước tiến quan trọng bậc nhất trong cuộc đấu tranh không ngừng nghỉ chống lại lũ người ngoài hành tinh khốn khiếp đang gây tai họa cho thiên hà. Theo thiết kế, tàu Colossus là một khung thân khổng lồ, bọc giáp dày đặc được gắn một vũ khí cấp §RHủy Diệt Hành Tinh§! duy nhất. Khả năng quét sạch các hành tinh không chịu khuất phục chúng ta khỏi thiên hà chắc chắn sẽ chứng minh giá trị vô giá, khi mối đe dọa ngoại chủng vẫn còn lâu mới kết thúc."
 apoc.100.desc.purif:0 "Bằng gươm giáo và ngọn lửa, các thế giới dị giáo sẽ bị thiêu rụi, và bằng tro tàn của chúng, thiên hà sẽ bị xát muối."
 apoc.100.desc.termi:0 "Khí quyển, sinh cảnh, trọng lực - dù thường mang lại tiện lợi - chỉ thực sự cần thiết đối với lũ túi thịt đáng ghê tởm.\n\nTiêu diệt hành tinh, tiêu diệt sinh vật hữu cơ."
 apoc.100.a:0 "Đã ghi nhận."
 apoc.110.name:0 "Khẩu Súng Chĩa Vào Đầu Vũ Trụ"
 apoc.110.desc:0 "Các nhà khoa học hàng đầu trên mọi lĩnh vực cuối cùng đã hoàn tất các đề xuất về vũ khí cấp §RHủy Diệt Hành Tinh§! sẽ trang bị cho các tàu loại Colossus đầu tiên của chúng ta. Chúng ta có thể chọn một đề xuất để phát triển cùng với các giai đoạn cuối cùng của Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus)."
 apoc.110.desc.machine:1 "Các chu kỳ xử lý dự phòng đã được ước tính và cho là đủ để phát triển một (1) vũ khí cấp §RHủy Diệt Hành Tinh§! trùng với thời điểm hoàn thành §GDự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus)§!.\n\nCần ưu tiên hóa."
 apoc.110.desc.hive:0 "Chúng ta đã khám phá vô vàn khả năng, và giờ đây chúng ta hiểu rõ rằng mình có thể phát triển một vũ khí cấp §RHủy Diệt Hành Tinh§! phù hợp cho chính những chiến hạm loại Colossus đầu tiên của mình. Trong khi các hướng đi khác có thể được theo đuổi sau, chúng ta chỉ có thể dành sự chú ý để phát triển một vũ khí như vậy cùng với các giai đoạn cuối cùng của Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus)."
 apoc.110.cracker.tooltip:0 "§RVũ Khí Hủy Diệt Hành Tinh§!:\n§L$PLANET_KILLER_CRACKER_DESC$§!"
 apoc.110.shielder.tooltip:0 "§RVũ Khí Hủy Diệt Hành Tinh§!:\n§L$PLANET_KILLER_SHIELDER_DESC$§!"
 apoc.110.neutron.tooltip:0 "§RVũ Khí Hủy Diệt Hành Tinh§!:\n§L$PLANET_KILLER_NEUTRON_DESC$§!"
 apoc.110.godray.tooltip:0 "§RVũ Khí Hủy Diệt Hành Tinh§!:\n§L$PLANET_KILLER_GODRAY_DESC$§!"
 apoc.110.nanobots.tooltip:0 "§RVũ Khí Hủy Diệt Hành Tinh§!:\n§L$PLANET_KILLER_NANOBOTS_DESC$§!"
 apoc.110.devolution.tooltip:0 "§RVũ Khí Hủy Diệt Hành Tinh§!:\n§L$PLANET_KILLER_DEVOLUTION_DESC$§!"
