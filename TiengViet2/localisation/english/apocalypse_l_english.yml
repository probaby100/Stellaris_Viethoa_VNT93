 opinion_dead_captives:0 "Sát Hại Tù Binh"

 vultaum_homeworld:0 "Thế Giới Quê Nhà Vultaum"
 vultaum_homeworld_desc:0 "Thế giới quê nhà cổ xưa của người Vultaum. Dù hành tinh đã vỡ vụn và không còn nuôi dưỡng sự sống, tàn tích của các đô thị rộng lớn vẫn có thể được tìm thấy trên bề mặt."
 vultaum_minerals:0 "Mảnh Vỡ Trạm Quỹ Đạo"
 vultaum_minerals_desc:0 "Một cơ sở quỹ đạo khổng lồ nào đó của người Vultaum đã rơi xuống hành tinh này từ thời xa xưa. Bề mặt vương vãi đầy mảnh vỡ."
 vultaum_energy:0 "Mạng Lưới Khai Khoáng Khí Cầu"
 vultaum_energy_desc:0 "Hành tinh khí khổng lồ này từng duy trì một mạng lưới các cơ sở khai khoáng bằng khí cầu rộng lớn được người Vultaum sử dụng để chiết xuất helium-3."
 yuht_homeworld:0 "Thế Giới Quê Nhà Yuht"
 yuht_homeworld_desc:0 "Chủng tộc Yuht cổ xưa khởi nguồn từ hành tinh này. Các trận oanh tạc quỹ đạo đã nghiền nát hầu hết các công trình trên bề mặt, nhưng vẫn còn những túi môi trường sống dưới lòng đất bị bỏ hoang có thể nghiên cứu được."
 yuht_minerals:0 "Vành Đai Tiểu Hành Tinh Trù Phú"
 yuht_minerals_desc:0 "Vành đai tiểu hành tinh trù phú này từng được người Yuht khai thác rộng rãi, và khoáng sản tìm thấy ở đây đã chống đỡ sự bành trướng chậm rãi nhưng vững chắc cho đế chế liên sao của họ."
 yuht_energy:0 "Dàn Thu Gom Năng Lượng Mặt Trời"
 yuht_energy_desc:0 "Một số dàn thu gom năng lượng mặt trời cổ xưa đã được người Yuht triển khai trên quỹ đạo quanh hành tinh khí khổng lồ này. Thật khó tin là một vài trong số chúng vẫn còn hoạt động được."
 first_league_homeworld:0 "Thủ Đô Liên Minh Đệ Nhất"
 first_league_homeworld_desc:0 "Lăng mộ cấp hành tinh này từng là trung tâm hành chính rực rỡ của Liên Minh Đệ Nhất. Nơi này không còn nuôi dưỡng sự sống, nhưng tàn tích từ siêu đô thị từng trải dài khắp toàn bộ bề mặt vẫn có thể được tìm thấy ở khắp nơi."
 first_league_minerals:0 "Cơ Sở Khai Khoáng Bỏ Hoang"
 first_league_minerals_desc:0 "Vành đai tiểu hành tinh này từng có mật độ dân cư dày đặc vào thời hoàng kim của Liên Minh Đệ Nhất. Các cơ sở khai khoáng bỏ hoang có thể được tìm thấy trên hàng nghìn tiểu hành tinh."
 first_league_energy:0 "Sàn Bảo Trì"
 first_league_energy_desc:0 "Hành tinh khí khổng lồ này từng là nơi đặt một số sàn bảo trì khổng lồ phục vụ cho hàng trăm nghìn tàu chở hàng thuộc hạm đội thương thuyền của Liên Minh Đệ Nhất. Một số thiết bị truyền tải năng lượng vẫn còn hoạt động."
 irassian_homeworld:0 "Thế Giới Quê Nhà Irassian"
 irassian_homeworld_desc:0 "Bất chấp những nỗ lực sau này nhằm thanh tẩy bề mặt thông qua oanh tạc quỹ đạo, quê nhà cổ xưa của người Irassian vẫn chứa đựng một lượng khổng lồ các cổ vật từ nền văn minh tiên tiến của họ."
 irassian_minerals:0 "Cựu Vũng Neo Đậu"
 irassian_minerals_desc:0 "Từng là một khu neo đậu chủ lực của Hạm Đội Tinh Cầu Irassian, các xưởng đóng tàu đổ nát nằm rải rác trên quỹ đạo của hành tinh này đã lắng đọng một lượng tài nguyên khoáng sản trù phú xuống bề mặt."
 irassian_energy:0 "Địa Điểm Sản Xuất Năng Lượng"
 irassian_energy_desc:0 "Hành tinh khí khổng lồ này từng là địa điểm sản xuất năng lượng chủ chốt của Công Ước Hợp Bang Irassian trong giai đoạn đầu bành trướng liên sao. Một vành đai dày đặc gồm các trạm năng lượng quỹ đạo cổ xưa vẫn bao quanh hành tinh."

