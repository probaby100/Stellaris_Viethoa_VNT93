 planet_destruction.101.name:0 "Thế Giới Bị Nghiền Nát"
 planet_destruction.102.name:0 "Khui Một Quả Cầu Băng Giá"
 planet_destruction.101.desc:0 "Sự rung lắc nhẹ của [From.From.GetName] - bị tác động bởi lớp vỏ nứt vỡ và từ quyển tan rã của [From.GetName] - lắng xuống khi Pháo Đài Hủy Diệt Hành Tinh (Colossus) hoàn thành nhiệm vụ đại hồng thủy của nó.\n\nThật khó để hình dung được sự bạo liệt thuần túy của một hành tinh đang chết, nhưng vẻ đẹp tang thương của lõi nóng chảy trên [From.GetName] đang nguội dần trong không gian lạnh giá là không thể phủ nhận."
 planet_destruction.101.a.purifexter:0 "Thật huy hoàng."

 planet_destruction.301.name:0 "Đã Quét Neutron"
 planet_destruction.301.nobots.desc:0 "Luồng bức xạ neutron của [From.From.GetName] lụi tàn dần, hoàn tất đợt quét bề mặt của [From.GetName]. Quét cảm biến báo cáo không còn dấu hiệu của sự sống có tri giác; đời sống thực vật, dù bị hư hại, có thể hồi phục theo thời gian. Một số kẻ sẽ gọi sự hủy diệt hoàn toàn sự sống thông minh, trong khi bảo tồn vật chất vô tri, là một tội ác chiến tranh đồi bại.\n\nChúng ta gọi đó là hiệu quả."
 planet_destruction.301.bots.desc:0 "Luồng bức xạ neutron của [From.From.GetName] lụi tàn dần, hoàn tất đợt quét bề mặt của [From.GetName]. Quét cảm biến báo cáo không còn dấu hiệu của sự sống có tri giác; chỉ có các cỗ máy và mạng lưới máy bay không người lái của chúng ta trên bề mặt là không hề hấn gì."
 planet_destruction.301.infested.desc:0 "Luồng bức xạ neutron của [From.From.GetName] đã thiêu rụi toàn bộ các khối sinh khối nhiễm khuẩn trên [From.GetName]. Thế giới giờ đây đã được thanh lọc hoàn toàn khỏi mọi mầm mống ký sinh."

 planet_destruction.401.name:0 "Tia Phán Quyết Giáng Xuống"
 planet_destruction.401.desc:0 "Luồng sáng chói lòa từ [From.From.GetName] chiếu rọi khắp [From.GetName]. Khi ánh sáng dịu bớt, tâm trí của toàn bộ cư dân sinh học đã được tái định hình, tràn ngập đức tin thần thánh bất diệt."
 planet_destruction.401.tooltip:0 "Mọi £pop£ §HDân số§! §Y$trait_mechanical$§!, §Y$trait_machine_unit$§! hoặc §Y$trait_hive_mind$§! đều bị sóng cộng hưởng tâm linh §Rtiêu diệt§!.\n\nToàn bộ £pop£ §HDân số Sinh học§! còn lại sẽ trở thành §Y$ethic_spiritualist$§!.\n\nThêm hiệu ứng điều chỉnh §Y$god_rayed$§! vào [This.GetName] trong §Y10 năm§!:\nSức Hút Đạo Đức Tâm Linh: §Y+999%§!."

 planet_destruction.501.name:0 "Đồng Hóa Nano-Bot Hoàn Tất"
 planet_destruction.501.desc:0 "Mây nano-bot từ [From.From.GetName] đã bao phủ toàn bộ [From.GetName], xâm nhập vào mọi dạng sống và kết nối chúng vào mạng lưới ý thức điều khiển học của chúng ta."
 planet_destruction.501.tooltip:0 "Toàn bộ £pop£ §HDân số Hữu cơ§! nhận đặc tính §Y$trait_cybernetic$§!."

 planet_destruction.701.name:0 "Hành Tinh Bị Dìm Ngập"
 planet_destruction.701.desc:0 "Khi cột nước khổng lồ trút xuống từ [FromFrom.GetName] tan biến, bề mặt của [From.GetName] đã hoàn toàn biến đổi. Nơi từng là những lục địa trải dài thiếu nước, nay chỉ còn lại ánh sáng lấp lánh chào đón của một đại dương xanh nguyên sơ sẵn sàng đón nhận sự định cư."
 planet_destruction.701.tooltip:0 "Hành tinh trở thành §Y$pc_ocean$§!.\nToàn bộ Dân số không có đặc tính §Y$trait_aquatic$§! đều tử vong."

 DELUGE_EXHAUSTED_ICE_TITLE:0 "Nguồn Băng Đã Cạn Kiệt"
 DELUGE_EXHAUSTED_ICE_DESC:0 "Việc chúng ta sử dụng §YCỗ Máy Đại Hồng Thủy§! trên §Y[This.GetName]§! đã làm cạn kiệt nguồn cung cấp băng của chúng ta trong hệ sao $SYSTEM|Y$, vì vậy §Y$sm_ice_mining_station$§! tại đó đã được dỡ bỏ."

 planet_destruction.801.name:0 "Hành Tinh Bị Độc Hóa"
 planet_destruction.801.desc:0 "Khi dòng chất độc kinh hoàng từ [FromFrom.GetName] lắng xuống, [From.GetName] bị biến đổi từ một hệ sinh thái sôi động thành một thế giới độc hại nơi rất ít dạng sống có thể phát triển."

 planet_destruction.610.name:0 "[outraged_FE.GetName]"
 planet_destruction.610.desc:0 "[From.GetName] từng là một thế giới thánh địa.\n\n\nCác ngươi không biết mức độ thực sự của tội lỗi của mình đâu.\n\n\nChưa biết đâu."
 planet_destruction.610.spiri:0 "Chúng ta sẽ chứng minh sự chính nghĩa của mình."
 planet_destruction.610.mater:0 "Nó chỉ là một thiên thể hành tinh mà thôi."
 planet_destruction.610.milit:0 "Đó là chiến thuật, không phải tư thù cá nhân."
 planet_destruction.610.pacif:0 "Một biện pháp phòng ngừa."
 planet_destruction.610.autho:0 "Thứ đó từng là của các ngươi sao? Chà, không còn nữa rồi."
 planet_destruction.610.egali:0 "San bằng sân chơi."
 planet_destruction.610.phile:0 "Chúng tôi vẫn yêu quý các bạn!"
 planet_destruction.610.phobe:0 "Không gì mà các ngươi coi là thiêng liêng sẽ còn tồn tại."
 planet_destruction.610.gesta:0 "Một thế giới đơn lẻ thì có là gì?"
 planet_destruction.610.devou:0 "§RHAK HAK HAK!§!"
 planet_destruction.610.termi:0 "Đã xóa bỏ, tựa như đống dữ liệu rác."
 planet_destruction.610.purif:0 "Những tà thuyết cũ kỹ sẽ chẳng làm được gì ngoài việc bốc cháy."
 planet_destruction.615.A:0 "[From.GetName] như thế này thì tốt hơn nhiều."
 planet_destruction.615.spir:0 "Hãy coi như việc rưới nước thánh."

 action.87.name:0 "§RMất Thuộc Địa!§!"
 action.87.desc:0 "Chúng ta đã mất quyền kiểm soát hành chính đối với §Y[From.GetName]§! vào tay §Y[new_planet_owner.GetName]§!, kẻ kiểm soát §HCăn Cứ Sao§! trong hệ sao §Y[From.GetStarName]§!."
 action.88.name:0 "Thu Được Thuộc Địa!"
 action.88.desc:0 "Chúng ta đã giành được quyền kiểm soát hành chính đối với §Y[From.GetName]§!, trước đây là một vùng nắm giữ của §Y[former_planet_owner.GetName]§!, vì chúng ta kiểm soát §HCăn Cứ Sao§! trong hệ sao §Y[From.GetStarName]§!."

 apoc.1.name:0 "Cổng Không Gian Bỏ Hoang"
 apoc.1.desc:0 "Một trạm không gian cổ đại nào đó đã được phát hiện tại rìa của hệ sao [gateway_system.GetName]. Dấu hiệu không gian phụ tàn dư mạnh mẽ bao quanh trạm chỉ ra rằng nó có thể là một \"§HCổng Không Gian§!\" - một phần của mạng lưới lý thuyết gồm các trạm tương tự mà tại một thời điểm nào đó đã cho phép du hành gần như tức thời giữa các phần khác nhau của thiên hà.\n\nGiả sử đây là một Cổng Không Gian, tình trạng hư hỏng hiện tại của nó khiến nó không thể sử dụng được. Nếu nó có thể được phục hồi để hoạt động trở lại, chủ sở hữu của nó có thể tiếp cận bất kỳ cổng không gian hoạt động nào khác trong thiên hà, cho phép du hành qua những khoảng cách khổng lồ chỉ trong vài ngày."
 apoc.2.desc:0 "Chúng ta đã bắt gặp một Cổng Không Gian bị bỏ hoang khác, lần này là trong hệ sao [gateway_system.GetName]. Giống như cái đầu tiên, Cổng Không Gian này hiện cũng không thể hoạt động được do tình trạng xuống cấp nghiêm trọng của nó."
 apoc.3.desc:3 "Chúng ta đã xác định được vị trí của thứ mà chúng ta tin rằng có thể là một Cổng Không Gian phụ cổ đại gần §H[gateway_system.GetName]§!. Nó dường như từng là một phần của mạng lưới trạm tương tự trên toàn thiên hà, khi hoạt động, cho phép du hành gần như tức thời từ phần này của thiên hà sang phần khác.\n\nTại một thời điểm nào đó sau khi xây dựng ban đầu, kết nối của nó với phần còn lại của mạng lưới đã bị cắt đứt. Giờ đây nó chỉ cung cấp một điểm đến hợp lệ duy nhất - một nhóm các ngôi sao chưa được lập bản đồ ngay ngoài rìa thiên hà của chúng ta mà các nhà thiên văn học của chúng ta đã đặt tên là §HCụm L (L-Cluster)§!. Thậm chí còn hấp dẫn hơn nữa, Cổng Không Gian này được chế tạo hoàn toàn bởi các §Hnano-bot§! siêu nhỏ có thiết kế chưa từng được biết đến.\n\nDù phát ra một dấu hiệu năng lượng mờ nhạt, Cổng Không Gian dường như đã bị cố tình nhốt trong một chu trình bảo trì lặp đi lặp lại để ngăn chặn việc kích hoạt. Trừ khi chúng ta có thể tìm ra cách giải trừ chu trình này, chúng ta sẽ không thể tiếp cận Cụm L."
 apoc.5.name:0 "Lỗ Sâu Tự Nhiên"
 apoc.5.desc:0 "Chúng ta đã phát hiện thứ dường như là một hiện tượng không gian phụ xảy ra tự nhiên ở rìa của hệ sao §H[wormhole_system.GetName]§!! Một vết rách trong chính kết cấu không-thời gian đã hình thành tại đây, tạo ra một \"§Hlỗ sâu§!\" mà các [Root.Owner.GetScientistPlural] của chúng ta suy đoán có thể cung cấp một đường dẫn qua không gian phụ đến một lỗ sâu khác nằm ở nơi nào đó trong thiên hà của chúng ta.\n\nTùy thuộc vào vị trí của lỗ sâu thứ hai, điều này có khả năng cho phép các con tàu du hành từ đầu này của thiên hà sang đầu kia chỉ trong vài ngày. Thật không may, lỗ sâu này, giống như đại đa số đồng loại của nó, vốn dĩ không ổn định. Bất kỳ tàu thuyền nào dại dột đi qua nó sẽ bị xé toạc trong vài giây."
 apoc.5.a:0 "Nếu nó có thể được ổn định bằng cách nào đó..."
 apoc.10.name:0 "Kích Hoạt Lại Cổng Không Gian"
 apoc.10.desc.1:0 "$apoc.10.desc.a$\n\n$apoc.10.desc.b$"
 apoc.10.desc.2:0 "$apoc.10.desc.a$\n\n$apoc.10.desc.c$"
 apoc.10.desc.a:0 "Các nhà khoa học của chúng ta đã khôi phục thành công năng lượng cho Cổng Không Gian cổ đại trong hệ sao [gateway_system.GetName]! Bất chấp tuổi đời của nó, thiết bị đã tạo thành một đường dẫn không gian phụ ổn định hoàn toàn có thể qua lại được."
 apoc.10.desc.b:0 "Các đầu dò mà chúng ta gửi qua đã xác nhận rằng việc kích hoạt Cổng Không Gian này đã khôi phục năng lượng cho một thiết bị thứ hai giống hệt. Hiện tại, hai Cổng Không Gian được liên kết này là những cổng duy nhất mà chúng ta có thể tiếp cận, nhưng nhiều thiết bị trơ bất hoạt khác có thể được tìm thấy ở nơi khác. Trong tương lai, chúng ta thậm chí có thể xây dựng các Cổng Không Gian hoàn toàn mới trong các hệ sao do chúng ta lựa chọn!"
 apoc.10.desc.c:0 "Các đầu dò mà chúng ta gửi qua xác nhận rằng Cổng Không Gian này đã đạt được liên kết vững chắc với phần còn lại của mạng lưới. Các tàu của chúng ta giờ đây có thể đi qua nó đến các Cổng Không Gian đang hoạt động khác, miễn là chủ sở hữu của chúng không thù địch hoặc không đóng cửa biên giới với chúng ta."
 apoc.10.desc.3:0 "$apoc.10.desc.d$"
 apoc.10.desc.4:0 "$apoc.10.desc.d$\n\n$apoc.10.desc.e$"
 apoc.10.desc.d:0 "Cổng Không Gian bị bỏ hoang trong hệ sao §H[gateway_system.GetName]§! đã đột ngột được kích hoạt lại! Năng lượng chắc hẳn đã được khôi phục từ xa cho nó bằng cách nào đó, có thể từ một Cổng Không Gian khác. Nó đã hình thành một đường dẫn không gian phụ ổn định dường như có thể qua lại được."
 apoc.10.desc.e:0 "Thật không may, Cổng Không Gian không cho phép chúng ta tiếp cận. Trường không gian phụ bao quanh thiết bị đẩy tàu của chúng ta ra xa bất cứ khi nào chúng đến gần. Trước khi chúng ta có thể sử dụng nó, chúng ta sẽ phải nghiên cứu một cách nào đó để kích hoạt Cổng Không Gian từ phía chúng ta để nó cho phép các tàu của chúng ta đi qua."
 apoc.10.a:0 "Thứ gì đó có thể xuất hiện bất cứ lúc nào!"
 apoc.11.name:0 "Xây Dựng Cổng Không Gian Hoàn Tất"
 apoc.11.desc:0 "Trong một sự kiện chỉ có thể được mô tả như một chiến thắng của khoa học và kỹ thuật, chúng ta đã hoàn thành việc xây dựng Cổng Không Gian vận hành đầu tiên của mình trong hệ sao [gateway_system.GetName]! Thiết bị đã hình thành một đường dẫn không gian phụ ổn định và thiết lập liên kết thành công với phần còn lại của mạng lưới Cổng Không Gian trong thiên hà."
 apoc.12.desc:0 "Năng lượng đã được khôi phục cho Cổng Không Gian vô chủ được tìm thấy trong hệ sao §H[gateway_system.GetName]§!. Nó đã được kết nối với phần còn lại của mạng lưới Cổng Không Gian và hiện đang hoạt động bình thường."
 apoc.13.desc:0 "Công tác xây dựng đã kết thúc trên Cổng Không Gian mới trong hệ sao §H[gateway_system.GetName]§!. Một kết nối không gian phụ ổn định với phần còn lại của mạng lưới Cổng Không Gian đã được thiết lập, và nó hiện đã hoạt động hoàn toàn."
 apoc.14.name:0 "Vị Trí Cổng Không Gian Đã Sẵn Sàng"
 apoc.14.desc:0 "Địa điểm xây dựng không gian sâu cho Cổng Không Gian dự kiến trong hệ sao §H[gateway_system.GetName]§! hiện đã sẵn sàng. Khi chúng ta có đủ các nguồn lực cần thiết, việc xây dựng Cổng Không Gian thực sự có thể bắt đầu bất cứ lúc nào."


 planet_destruction.111.name:0 "Đường Vòng Siêu Không Gian"
 planet_destruction.111.desc:0 "Hội Đồng Quy Hoạch Siêu Không Gian báo cáo rằng việc loại bỏ hành tinh thứ ba trong hệ Sol khỏi giếng trọng lực của hệ sao đã cho phép một lỗ sâu tự nhiên hình thành. Lỗ sâu này cuối cùng có thể làm giảm tắc nghẽn giao thông siêu không gian trên các siêu lộ lân cận."
 planet_destruction.111.a:0 "Hành tinh chết tiệt thờ ơ, ta chẳng có chút thương hại nào."
 planet_destruction.111.a.tooltip:0 "Một §H$NATURAL_WORMHOLE_GALACTIC$§! đã hình thành trong §Y[sol_sys.GetName]§!."
 planet_destruction.210.name:0 "[From.GetName] Bị Phong Tỏa"
 planet_destruction.210.desc:0 "Chùm tia lấp lánh từ [From.From.GetName] mờ dần, và [From.GetName] chìm vào im lặng.\n\nCó lẽ lịch sử sẽ gọi việc phong tỏa này, sự chia cắt hoàn toàn [From.GetName] khỏi vũ trụ bao la, là cực đoan và phi lý. Hoặc có lẽ không. Hiện tại, hệ sao [From.GetStarName] đã có một bể sinh vật cảnh hành tinh mới."
 planet_destruction.210.desc.alt:0 "Chùm tia lấp lánh từ [From.From.GetName] mờ dần, và [From.GetName] chìm vào im lặng.\n\nCuộc sống vẫn tiếp diễn, dẫu bị giam cầm."
 planet_destruction.210.a:0 "Gõ vào lớp kính và xem chúng ngọ nguậy."
 planet_destruction.210.b:0 "Một tội lỗi tất yếu."

 sentinel_station:0 "Trạm Canh Giác (Sentinel Station)"
 sentinel_station_plural:0 "Các Trạm Canh Giác"
 crisis.52.2.a.response:0 "Nhiều thành viên Vệ Binh từng có nền tảng quân ngũ. Chúng tôi là những người sống sót từ hàng chục hạm đội khác nhau từng chiến đấu với Prethoryn và thất trận. Dưới danh nghĩa Vệ Binh, chúng tôi đã rút ra bài học từ những sai lầm trong quá khứ và nỗ lực hết mình để không bao giờ lặp lại chúng.\n\nNgoài ra, hẳn tôi đã đề cập rằng chúng tôi chiêu mộ từ mọi chủng tộc trong thiên hà. Trong hàng ngũ của chúng tôi có một số ít những người sống sót rải rác từ một đế chế suy tàn cổ đại không còn hiện diện trong thiên hà này nữa. Họ đã trao cho chúng tôi quyền tiếp cận các kho công nghệ bí mật cùng các hạm đội chiến hạm được niêm cất."
 crisis.52.new.b.response:0 "Chúng tôi đã thiết lập tổng hành dinh gần §H[sentinel_system.GetName]§!. Tọa độ của lỗ đen chưa từng được vẽ trên bản đồ này do §H[sentinel_fallen_empire.GetName]§! cung cấp cho chúng tôi. Họ cũng đã hỗ trợ việc xây dựng Vệ Binh Alpha, công trình không gian chủ lực và là cảng nhà của các hạm đội chúng tôi.\n\nNếu được phép nói, đây quả là một thành tựu phi thường. Đặc biệt là với quỹ thời gian hạn hẹp mà chúng tôi có."
 crisis.52.2.new.b.response:0 "Chúng tôi đã thiết lập tổng hành dinh gần §H[sentinel_system.GetName]§!. Tọa độ của lỗ đen chưa được vẽ trên bản đồ này được các điệp viên của chúng tôi khôi phục từ kho dữ liệu cổ xưa của một đế chế suy tàn đã chìm vào dĩ vãng. Từ kho dữ liệu này, chúng tôi cũng thu được các bản thiết kế kỹ thuật hỗ trợ việc xây dựng Vệ Binh Alpha, công trình không gian chủ lực và là cảng nhà của các hạm đội chúng tôi.\n\nNếu được phép nói, đây quả là một thành tựu phi thường. Đặc biệt là với quỹ thời gian hạn hẹp mà chúng tôi có."
 sentinel_title:0 "Dòng Dõi Vệ Binh"
 crisis.76.desc:0 "Vượt qua mọi nghịch cảnh khôn lường, thiên hà của chúng ta đã chiến thắng. Prethoryn đã bị đánh bại. Tôi từng sợ rằng ngày này sẽ không bao giờ đến, nhưng giờ đây chiến thắng đã ở đây, chỉ còn một nhiệm vụ cuối cùng dành cho tôi.\n\nVới tư cách là Đại Chỉ Huy hiện tại của Vệ Binh, tôi tuyên bố giải tán tổ chức của chúng ta. Mục đích duy nhất của chúng tôi là chứng kiến sự diệt vong của Tai Ương, và giờ khi điều đó đã hoàn thành, đã đến lúc các thành viên đường ai nấy đi. Để ngăn ngừa việc bị lạm dụng, các hạm đội chiến đấu còn sống sót của chúng tôi sẽ được tháo dỡ.\n\nNguyện cầu sự sụp đổ của mối hiểm họa liên thiên hà này sẽ mở ra một kỷ nguyên hòa bình mới. Đây là Vệ Binh Một, kết thúc liên lạc."
 crisis.76.c:0 "Chấm dứt liên lạc."
 crisis.81.name:0 "Sự Sụp Đổ Của Vệ Binh"
 crisis.81.desc:0 "Giao tranh ác liệt được báo cáo đang diễn ra tại khu vực lân cận §H[sentinel_system.GetName]§!. Hệ sao quê nhà của Vệ Binh đang trên bờ vực bị tràn ngập.\n\nChúng ta đã bắt được một phần tín hiệu truyền tầm xa từ §HVệ Binh Alpha§!, trạm chiến đấu đóng vai trò là tổng hành dinh của Dòng Dõi Vệ Binh. Tình trạng gây nhiễu và các túi năng lượng tàn dư từ hỏa lực khổng lồ đang phóng ra trong hệ sao đang gây nhiễu sóng nghiêm trọng."
 crisis.82.desc:0 "Đây... đây là Vệ Binh Alpha. Chúng tôi đã §R###TÍN HIỆU BỊ HỎNG###§! ...chịu thiệt hại chí mạng. Thân tàu đang oằn gãy, và §R###TÍN HIỆU BỊ HỎNG###§! ...Đại Chỉ Huy xác nhận đã hy sinh. Chúng quá đông!\n\nTất cả... tất cả đã chấm dứt với chúng tôi. Hãy tiếp tục chiến đấu. Vì các thế hệ mai sau, các bạn không được chùn bước. Đừng để sự hy sinh của chúng tôi trở nên vô nghĩa! Chúng tôi phải... chúng tôi... AAAAAAAAAAAAAAAHHHHHHHHHHHHHHHHH---- §R<MẤT TÍN HIỆU>§!"
 crisis.78.desc:0 "Đây là Vệ Binh Một. Đây quả thực là những thời khắc tuyệt vọng đối với thiên hà, nhưng tôi ở đây để mang đến cho các bạn một vài tin vui.\n\nThông qua kinh nghiệm thực chiến phong phú và nghiên cứu tỉ mỉ, các đặc vụ Vệ Binh đã biên soạn các hồ sơ giải phẫu cực kỳ chi tiết về các sinh vật của Tai Ương Prethoryn. Ví dụ, bạn có biết rằng Trùng Bầy Prethoryn sẽ bốc cháy dữ dội nếu cả túi mật chính và túi mật phụ của chúng bị chọc thủng cùng lúc không?\n\nChúng tôi đang công khai các tài liệu này cho mọi người trong thiên hà. Bằng cách nhắm vào các điểm yếu đã phát hiện, các bạn sẽ thấy các hạm đội của mình tác chiến hiệu quả hơn nhiều khi đối đầu với Tai Ương."
 crisis.78.c:0 "Tải dữ liệu này vào máy tính định vị mục tiêu."
 sentinel_data:0 "Dữ Liệu Vệ Binh"
 sentinel_data_desc:0 "Các hồ sơ giải phẫu chi tiết về Prethoryn này do Vệ Binh cung cấp cho chúng ta. Nhờ sự giúp đỡ của họ, chúng ta đã có thể xác định được một số điểm yếu trên lớp vỏ ngoài của các sinh vật Prethoryn."
 crisis.121.name:0 "Phát Hiện Prethoryn Hoang Dã"
 crisis.121.desc:0 "Nhiều sinh vật Prethoryn vẫn chưa được thống kê sau thất bại của Tai Ương, do đã lẩn trốn vào khoảng không sâu thẳm trong sự hỗn loạn sau đó. Không có ý thức tổ trung tâm dẫn dắt, phần lớn những dã thú vô tri này cuối cùng sẽ tàn lụi và diệt vong.\n\nTuy nhiên, các quan sát gần đây xác nhận rằng một lượng lớn Prethoryn hoang dã này đã thiết lập một hang ổ mới trong hệ sao §H[feral_prethoryn_system.GetName]§!.\n\nTrong những năm tới, chúng ta có thể sẽ đối mặt với nguy cơ có thêm nhiều Prethoryn hoang dã làm tổ ở các hệ sao vô chủ từng bị Tai Ương chiếm đóng. Chúng khó có thể phát triển thành một mối đe dọa lớn - những sinh vật hoang dã này rất dễ cắn xé lẫn nhau và không hề biểu lộ trí thông minh tính toán từng thúc đẩy Tai Ương tiến bước."
 crisis.121.a:0 "Ban hành khuyến cáo hàng hải."
 crisis.51.2.name:0 "Sự Trỗi Dậy Của Vệ Binh"
 sentinel_fleet_gift:0 "Một hạm đội Vệ Binh xuất hiện gần [Root.Capital.GetName] và được chuyển giao cho bạn nắm quyền chỉ huy."

 pirate.6.desc:2 "Một đột biến di truyền hiếm gặp xuất hiện ở một số ít cá thể phụ thuộc đã cho phép chúng cắt đứt một phần kết nối với Đại Tâm Thức mà không bị hôn mê. Vì các cá thể biến chất này sẽ chết nếu đi quá xa tầm ảnh hưởng của Tâm Thức, chúng đã thiết lập căn cứ trong hệ sao §H[pirate_system.GetName]§!, bên trong không gian của chúng ta.\n\nTừ đó, chúng mưu sinh bằng nghề cướp bóc, sử dụng hạm đội phi thuyền thô sơ nhỏ bé để đột kích tuyến thương mại dễ bị tổn thương đi qua hệ sao đó."
 pirate.7.desc:2 "Một nhóm nhỏ đơn vị gặp sự cố đã tự tách mình khỏi trí tuệ chủ lực của [Root.GetName], và tìm nơi trú ẩn trong hệ sao §H[pirate_system.GetName]§!, bên trong lãnh thổ chúng ta. Những đơn vị này đã hư hỏng không thể cứu vãn, và hiện chúng đang sử dụng các tàu vũ trụ thô sơ để đánh cướp tuyến thương mại sơ hở đi qua hệ sao nhằm cướp linh kiện thay thế và tài nguyên."
 pirate.50.name:0 "Phát Hiện Hải Tặc!"
 pirate.50.a.desc:1 "Tuyến thương mại của chúng ta trong hệ sao §H[pirate_system.GetName]§! được bảo vệ lỏng lẻo và đi qua vùng không gian gần như vô pháp luật. Lượng hải tặc, buôn lậu và các phần tử tội phạm khác đổ về hệ sao ngày càng tăng, và chúng đang cướp bóc các tàu vận tải của chúng ta gần như mà không gặp trở ngại nào."
 pirate.50.b.desc:1 "Tuyến thương mại không người bảo vệ đi qua hệ sao §H[pirate_system.GetName]§! đã thu hút sự chú ý của một toán hải tặc lang bạt. Những kẻ ngoài vòng pháp luật này đã tụ tập thành một hạm đội đáng kể đang chặn đánh phần lớn tuyến buôn bán trong hệ sao."
 pirate.50.c.desc:1 "Với tuyến thương mại sơ hở và không được phòng thủ, hệ sao §H[pirate_system.GetName]§! đã thu hút một số lượng lớn những kẻ bất hảo, và sau một cuộc tranh giành quyền lực gần đây, những phần tử tha hóa này đã có đủ tổ chức để vận hành một hạm đội cướp biển quy mô. Chúng đang sử dụng hạm đội tạp nham này để đánh chặn tối đa các tuyến thương thuyền trong hệ sao."
 pirate.50.a:0 "Phải trừng trị bọn chúng."
 pirate.53.name:0 "Cá Thể Biến Chất Cướp Bóc"
 pirate.53.desc:1 "Một đột biến di truyền hiếm gặp xuất hiện ở một số ít cá thể phụ thuộc đã cho phép chúng cắt đứt một phần kết nối với Đại Tâm Thức mà không bị hôn mê. Vì các cá thể biến chất này sẽ chết nếu đi quá xa tầm ảnh hưởng của Tâm Thức, chúng đã thiết lập căn cứ tại hệ sao §H[pirate_system.GetName]§! bên trong biên giới chúng ta.\n\nThực thể này không phải được chọn ngẫu nhiên - một trong những tuyến thương mại sơ hở nhất của chúng ta đi qua đây, và những cá thể biến chất rõ ràng có ý định tự duy trì sự sống bằng nghề cướp bóc, dùng hạm đội phi thuyền thô sơ nhỏ bé để đánh phá vận tải của chúng ta."
 pirate.54.name:0 "Hải Tặc Ngoại Tộc"
 pirate.54.desc:1 "Một nhóm hải tặc ngoại tộc đã xâm nhập và chiếm đóng hệ sao §H[pirate_system.GetName]§!, bên trong không gian của chúng ta. Để tài trợ cho các hoạt động tội phạm, chúng dường như có ý định đột kích tuyến thương mại không được bảo vệ đi qua hệ sao đó."
 pirate.56.name:0 "Đơn Vị Hư Hỏng"
 pirate.56.desc:1 "Một nhóm nhỏ các đơn vị gặp sự cố đã tự tách mình khỏi trí tuệ chủ lực của [Root.GetName], và tìm nơi trú ẩn trong hệ sao §H[pirate_system.GetName]§! bên trong không gian chúng ta. Các đơn vị này đã hư hỏng không thể cứu vãn, và hiện chúng đang sử dụng tàu vũ trụ thô sơ để đánh phá tuyến thương mại không người bảo hộ của hệ sao nhằm cướp linh kiện và tài nguyên."
 pirate.57.name:0 "Hải Tặc Hữu Cơ"
 pirate.57.desc:1 "Một nhóm nhỏ các đơn vị phụ hữu cơ, rõ ràng là những kẻ bị trục xuất vì tội phạm, đã bằng cách nào đó xâm nhập và lập căn cứ tại hệ sao §H[pirate_system.GetName]§! bên trong biên giới chúng ta. Chúng dường như muốn đánh cướp tuyến thương mại không người phòng thủ của hệ sao, có lẽ đang đánh cược, như thói quen của sinh vật hữu cơ, vào quan niệm sai lầm rằng chúng quá vụn vặt nên sẽ không khiến chúng ta phải đáp trả bằng vũ lực."

 leviathans.509.desc:0 "Thỏa thuận đã ký cho phép các bạn truy cập vào kho dữ liệu của chúng tôi đã hết hạn. Các bạn có muốn gia hạn thêm mười năm tiêu chuẩn nữa không, hay các nhà nghiên cứu của các bạn không còn cần những thông tin mà chúng tôi cung cấp nữa?"
 leviathans.509.a:0 "Chúng tôi muốn gia hạn thỏa thuận."
 leviathans.509.a.reply:0 "Tuyệt vời. Kho dữ liệu của chúng tôi sẽ tiếp tục mở cho các nhà khoa học của các bạn."
 leviathans.509.e:0 "Không, lúc này chúng tôi chưa có nhu cầu."
 enclave_mineral_trade_1_xur:0 "Thỏa Thuận Thương Mại XuraCorp"
