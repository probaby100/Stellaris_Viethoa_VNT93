 TECH_UNLOCK_COLOSSUS_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$:§! Pháo Đài Hủy Diệt Hành Tinh (Colossus)"
 TECH_UNLOCK_COLOSSUS_CONSTRUCTION_DESC:0 "§HPháo Đài Hủy Diệt Hành Tinh (Colossus)§!\nThậm chí còn lớn hơn cả một Siêu Thiết Giáp Hạm (Titan), cấu hình thân tàu Pháo Đài Hủy Diệt Hành Tinh (Colossus) không có khả năng không chiến hạm đối hạm. Nó giống như một trạm quỹ đạo di động hơn, chỉ có khả năng tàn phá hoàn toàn cả một hành tinh."

 COLOSSUS_PROJECT:0 "Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus)"
 COLOSSUS_PROJECT_DESC:0 "Các [Root.GetScientistPlural] của chúng ta sẽ thiết kế một trong những cấu hình thân tàu lớn nhất mà thiên hà từng biết đến, và phát triển cho nó một vũ khí có khả năng tàn phá toàn bộ các thế giới."

