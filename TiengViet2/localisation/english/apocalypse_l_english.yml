 apoc.120.name:0 "Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus) Hoàn Tất"
 apoc.120.desc:0 "$apoc.120.part.p1$"
 apoc.120.desc.milit:0 "$apoc.120.part.p1$ $apoc.120.part.milit$"
 apoc.120.desc.pacif:0 "$apoc.120.part.p1$ $apoc.120.part.pacif$"
 apoc.120.desc.phobe:0 "$apoc.120.part.p1$ $apoc.120.part.phobe$"
 apoc.120.desc.mater:0 "$apoc.120.part.p1$ $apoc.120.part.mater$"
 apoc.120.part.p1:0 "Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus), nhiệm vụ trọng đại nhằm thiết kế nền tảng vũ khí lớn nhất trong lịch sử [Root.GetAdj] và một vũ khí §R[Root.Get1stPlanetKiller]§! để trang bị cho nó, đã đơm hoa kết trái và đi đến hồi kết."
 apoc.120.part.milit:0 "Dù con tàu Colossus đầu tiên có thể chưa được đóng, khoảnh khắc này chính là điểm tựa mà lịch sử của [Root.GetName] xoay chuyển quanh nó."
 apoc.120.part.pacif:0 "Hãy hy vọng chúng ta sẽ không bao giờ phải dùng đến nó."
 apoc.120.part.phobe:0 "Hãy để lũ ngoại chủng phải run rẩy trước sức mạnh và sự tài tình của chúng ta."
 apoc.120.part.mater:0 "Nó sẽ mãi mãi là minh chứng cho sự đổi mới sáng tạo của [Root.GetAdj]."
 apoc.120.desc.machine:0 "Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus) đã hoàn tất.\n\nCấu hình thân tàu mới khả dụng:\n<<§GPháo Đài Hủy Diệt Hành Tinh (Colossus)§!>>\n\nThành phần vũ khí mới khả dụng:\n<<§R[Root.Get1stPlanetKiller]§!>>"
 apoc.120.desc.hive:0 "Cấu hình Colossus đã hình thành trọn vẹn trong tâm trí chúng ta, sẵn sàng để lắp ráp. Và, với một chút bất an, chúng ta nhận ra rằng cơn ác mộng mang tên §R[Root.Get1stPlanetKiller]§! cũng có thể được hiện thực hóa."
 apoc.120.a:0 "Bùm."
 apoc.120.a.pacif:0 "Phương kế cuối cùng."
 apoc.120.a.gesta:0 "Đã ghi nhận."
 apoc.130.name:0 "[From.GetName] Hoàn Tất Dự Án Pháo Đài Hủy Diệt Hành Tinh (Colossus)"
 apoc.130.desc:0 "Tin tức đã truyền đến chúng ta rằng [From.GetName] đã phát triển các thông số kỹ thuật cho cấu hình thân tàu loại Colossus, một nền tảng vũ khí có tiềm năng hủy diệt hoàn toàn cả một hành tinh."
 apoc.130.a.weaker:0 "Thật đáng báo động."
 apoc.130.a.stronger:0 "Một sự tiến bộ công nghệ đáng ngưỡng mộ."
 apoc.130.a.pacif:0 "Cầu cho vũ khí kinh hoàng này không bao giờ được sử dụng."

