 edict_forge_subsidies:0 "Trợ Cấp Luyện Kim"
 edict_forge_subsidies_desc:0 "Đế chế của chúng ta khao khát có thêm các hợp kim chuyên dụng và kim loại quý. Sắc Lệnh này cung cấp thêm tài nguyên cho các xưởng đúc của chúng ta để gia tăng sản xuất."
 edict_forge_subsidies_tooltip:0 "Tăng chi phí duy trì của [foundry.GetIcon] [foundry.GetNamePlural] thêm £energy£§Y1§!"

 edict_research_subsidies:0 "Trợ Cấp Nghiên Cứu"
 edict_research_subsidies_desc:0 "Tri thức là sức mạnh. Sắc Lệnh này tập trung nỗ lực của chúng ta vào việc thúc đẩy công nghệ."
 edict_research_subsidies_tooltip:0 "Tăng chi phí duy trì của £job_researcher£ $job_researcher_plural$ thêm £energy£§Y1§!"

 edict_veneration_of_saints:0 "Tôn Kính Các Thánh"
 edict_veneration_of_saints_desc:0 "Thay vì chỉ tập trung vào thế giới phàm trần này, chúng ta nên cung cấp cho những người dẫn đường tâm linh bất cứ thứ gì họ cần để chuẩn bị cho chúng ta bước sang cõi kế tiếp."

