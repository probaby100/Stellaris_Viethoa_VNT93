 ##############################
 # FEDERATION JOINT OPERATIONS
 ##############################

 ### THE DISMEMBERED CLOUD (Joint Operation - Research Co-operative) by Gemma Thomson ###

 federations3.2001.name:0 "Dự Án Nghiên Cứu Chung Của Liên Minh"
 federations3.2001.desc:0 "Nhiều trạm nghiên cứu khác nhau trên khắp đế chế của chúng ta đã phát hiện những biến dạng tinh vi trong siêu không gian, tập trung vào căn cứ sao tại [root.Capital.GetName]. Hiệu ứng này biểu hiện trong 'không gian thực' như một vùng cực quang cục bộ, mà các cư dân trên căn cứ sao mô tả là những xúc tu khí có màu sắc rực rỡ bao bọc lấy trạm.\n\nHơn nữa: các đồng minh của chúng ta trong [root.GetAllianceName] báo cáo các hiện tượng tương tự tại các hệ sao thủ đô của họ. Chủ tịch [discloud_coordinator.ruler.GetRegnalName] đã kêu gọi một cuộc điều tra ngay lập tức và có sự phối hợp về vấn đề này."

 dismembered_cloud_chain_title:0 "Đám Mây Rời Rạc"
 dismembered_cloud_chain_desc:0 "Một đám mây kỳ lạ đã xuất hiện xung quanh căn cứ sao của chúng ta tại [root.Capital.GetName]. Chúng ta cần phối hợp với các đồng minh trong [root.GetAllianceName] để tìm hiểu bản chất của nó."

 DISMEMBERED_CLOUD_PROJECT:0 "Đám Mây Bị Vướng Lại"
 DISMEMBERED_CLOUD_PROJECT_DESC:0 "Những xúc tu mây có màu sắc rực rỡ đã bám chặt vào căn cứ sao của chúng ta tại [root.Capital.GetName], ẩn hiện vào và ra khỏi siêu không gian theo cách thức thất thường - hoặc thậm chí có thể là hữu cơ. Điều gì đang gây ra chuyện này?\n\nDự án này là một phần của nỗ lực khoa học rộng lớn hơn do các thành viên của [root.GetAllianceName] tiến hành."
 tooltip_dismemberedcloud_begin:0 "Mỗi thành viên của [root.GetAllianceName] sẽ được giao một §HDự Án Đặc Biệt§! - một nỗ lực chung nhằm tìm ra mối liên hệ giữa các hiện tượng này."

 federations3.2010.intro:0 "Cuộc điều tra của chúng ta về đám mây giống cực quang tại [root.Capital.GetName] đã đặt ra nhiều câu hỏi hơn là câu trả lời. Những xúc tu mây riêng biệt hình thành mỗi khi chúng ta phát tín hiệu liên lạc đến các đội nghiên cứu của đồng minh - nhưng chỉ khi đó mà thôi."
 federations3.2010.red.desc:0 "$federations3.2010.intro$ Mỗi xúc tu đều nhuốm sắc đỏ, rìa ngoài lởm chởm - và chúng di chuyển theo cách kích động.\n\n$federations3.2010.close$"
 federations3.2010.yellow.desc:0 "$federations3.2010.intro$ Mỗi xúc tu xuất hiện màu vàng, với các rìa mờ ảo. Những làn sương di chuyển uể oải, như thể bị cuốn vào một làn gió nhẹ.\n\n$federations3.2010.close$"
 federations3.2010.green.desc:0 "$federations3.2010.intro$ Hiện lên với màu xanh lục rực rỡ, chuyển động của những làn hơi này được mô tả là dường như đang vẫy gọi và có chủ đích.\n\n$federations3.2010.close$"
 federations3.2010.blue.desc:0 "$federations3.2010.intro$ Những chỗ nhô ra màu xanh lam này dường như lảng tránh hoặc nhút nhát, biến trở lại vào siêu không gian mỗi khi bị quan sát trực tiếp.\n\n$federations3.2010.close$"
 federations3.2010.indigo.desc:0 "$federations3.2010.intro$ Mỗi 'phần phụ' màu tím sống động của đám mây di chuyển chậm rãi và có mục đích để chỉ vào các đặc điểm khác nhau ở bên ngoài căn cứ sao, như thể đang thẩm định nó.\n\n$federations3.2010.close$"
 federations3.2010.pink.desc:0 "$federations3.2010.intro$ Những làn hơi màu hồng mờ ảo này được mô tả là 'tinh nghịch', lướt nhanh tránh xa bất kỳ con tàu nào tình cờ tiếp cận.\n\n$federations3.2010.close$"
 federations3.2010.gray.desc:0 "$federations3.2010.intro$ Chúng tồn tại trong thời gian dài, để lại những vệt trông như khói xám.\n\n$federations3.2010.close$"
 federations3.2010.orange.desc:0 "$federations3.2010.intro$ Những đường cong màu cam uốn lượn này có xu hướng cuộn quanh mặt dưới căn cứ sao của chúng ta, khiến nó trông như đang bốc cháy.\n\n$federations3.2010.close$"
 federations3.2010.brown.desc:0 "$federations3.2010.intro$ Sắc nâu trầm của chúng dường như đục mờ bất thường; chúng che khuất phần lớn khung cảnh các vì sao mà người ta thường thấy từ bên trong căn cứ sao.\n\n$federations3.2010.close$"
 federations3.2010.cyan.desc:0 "$federations3.2010.intro$ Sắc xanh lơ sống động bên trong luồng khí khiến nó có hình dạng như cực quang của hành tinh - chỉ có điều các dải màu của nó tự phát chuyển từ các đường cong uốn lượn sang các góc vuông, như thể đang tạo thành một làn sóng kỹ thuật số.\n\n$federations3.2010.close$"
 federations3.2010.close:1 "Tự bản thân chúng ta không thể nhận ra thêm bất kỳ ý nghĩa nào từ những hành vi này - nhưng [root.GetAllianceName] kỳ vọng sẽ có nhiều câu trả lời hơn một khi §Ykết quả của mọi thành viên được đối chiếu§!.\n\nCác giả thuyết ban đầu cho rằng những thực thể bao trùm chiều không gian này bằng cách nào đó đã hòa âm với các dải tần truyền thông siêu không gian của chúng ta. Sự thu hút tình cờ này có thể được duy trì để khai thác thực thể sâu hơn cho việc nghiên cứu, hoặc chúng ta có thể chuyển đổi tần số với hy vọng giải tán nó."
 federations3.2010.a:0 "Trả tự do cho nó."
 federations3.2010.b:0 "Giữ nó ở lại đây."
 federations3.2015.name:0 "Đám Mây Bị Phân Mảnh"
 federations3.2015.intro:0 "Kết quả phát hiện của chúng ta đã được đối chiếu: có vẻ như mọi trường hợp xuất hiện của đám mây cực quang bán hữu tri tại thủ đô của liên bang chúng ta trên thực tế đều là một phần của một thực thể sống duy nhất."
 federations3.2015.desc:0 "$federations3.2015.intro$\n\nTheo những gì các nhà nghiên cứu có thể nhận định: thực thể cư ngụ trong siêu không gian này đã vô tình trôi dạt vào không phận liên bang của chúng ta, sau đó nó bị 'vướng' vào các trạm tiếp sóng liên lạc không gian bận rộn nhất của chúng ta - những trạm phục vụ cho các căn cứ sao thủ đô. Các nhà nghiên cứu đồng ý rằng thực thể dạng khí này đang §Hcố gắng tự tái tạo lại bản thân§! - một nhiệm vụ mà bình thường nó không thể đạt được trong trạng thái phân mảnh như vậy.\n\nSau khi tái tạo thành công, đám mây đã biến mất trở lại vào siêu không gian - nhưng không quên ghé thăm một số trạm nghiên cứu của liên minh chúng ta. Tại mỗi trạm, nó thực hiện một số chuyển động chính xác ra vào siêu không gian - một màn trình diễn mà một số nhân chứng mô tả là giống như một điệu nhảy. Những màn phô diễn khả năng bẩm sinh của đám mây trong việc vượt qua rào cản siêu không gian đã cung cấp cho tất cả chúng ta những dữ liệu vô giá."
 federations3.2016.desc:0 "$federations3.2015.intro$\n\nDữ liệu chúng ta có chưa đầy đủ, nhưng đủ để gợi ý rằng chúng ta đã chạm trán một thực thể dạng ý thức tập hợp: ở thể khí và thích nghi với việc cư ngụ trong siêu không gian. Các điều phối viên dự án đưa ra giả thuyết rằng nhiều phần khác nhau của đám mây đã bị 'vướng' vào các căn cứ sao thủ đô của chúng ta khi nó trôi dạt qua ngân hà. Nó dường như muốn §Htự tái tạo lại chính mình§! - nhưng nếu không có nỗ lực đoàn kết từ phía chúng ta, một số đám mây đó đã bắt đầu mất đi độ gắn kết và có thể không còn khả năng tái hợp lại được nữa.\n\nNhững phần đám mây tái hợp được đã sớm biến mất vào siêu không gian; phần còn lại tiếp tục cung cấp cho các nhà nghiên cứu dữ liệu đo đạc từ xa thú vị về các vấn đề liên quan đến siêu không gian."
 federations3.2016.a:0 "Được chăng hay chớ."
 federations3.2017.desc:0 "Do không có nỗ lực hợp tác nào được áp dụng cho dự án này, khó có thể khẳng định điều gì một cách chắc chắn về đám mây đa chiều không gian đang ghé thăm các thủ đô của chúng ta. Các giả thuyết thì nhiều, nhưng tất cả chúng ta giờ đây đều đang chứng kiến sự kích động dữ dội của những đám mây này.\n\nKhi cấu trúc vật lý của chúng tan rã, chúng ta nhận thấy rằng các đám mây trở nên ít phản hồi hơn trước các kích thích. Chúng đã bắt đầu ẩn hiện ra vào siêu không gian nhanh hơn nhiều. Điều này đang tạo ra một lượng đáng kể tạp âm trên nhiều dải tần truyền thông của chúng ta, nhưng nó cũng cung cấp dữ liệu quý giá cho các nhà nghiên cứu lý thuyết của chúng ta tại [root.Capital.GetName]."
 federations3.2017.a.tooltip:0 "§H[Root.GetAllianceName]§! nhận được sự gia tăng tạm thời về độ gắn kết.\n\n"

 joint_cloud_boon:0 "Ân Huệ Của Đám Mây"
 joint_cloud_boon_desc:0 "Bằng cách hỗ trợ một thực thể dạng khí cư ngụ trong siêu không gian từng ghé thăm các thủ đô liên bang, chúng ta đã có được những hiểu biết độc đáo về sinh học siêu quang tốc và vật lý lý thuyết."
 temp_cloud_boon:0 "Đám Mây Bị Phân Mảnh"
 temp_cloud_boon_desc:0 "Một cuộc chạm trán tình cờ với một vị khách thể khí cư ngụ trong siêu không gian tại các thủ đô liên bang đã mang lại cho chúng ta nhiều hiểu biết sâu sắc về vật lý siêu quang tốc."
 pm_joint_cloud_snag:0 "Đám Mây Bị Bẫy"
 pm_joint_cloud_snag_desc:0 "Chúng ta đã hy sinh một chút độ trung thực của tín hiệu trong khu vực này để đổi lấy những hiểu biết sâu sắc về vật lý siêu quang tốc từ một sinh vật siêu không gian bị thu hút bởi các tín hiệu phát thanh từ căn cứ sao của chúng ta."


 ### GENIUS CAELI (Joint Operation - Research Co-operative) by Gemma Thomson ###

 #Arc site begins
 federations3.2103.name:0 "Một Âm Thanh Lạ Thường"
 federations3.2103.desc.body:1 "Các tàu tầm ngắn có lộ trình đi vào bầu khí quyển của [event_target:leylines_world.GetName] báo cáo về một âm thanh kỳ lạ tấn công thân tàu của họ. Nguồn phát dường như nằm ngay bên dưới bề mặt hành tinh, trong một khu vực giàu khoáng sản bất thường.\n\nNhững sự việc tương tự cũng đã được báo cáo trên các thế giới do các đồng nghiệp của chúng ta trong [from.Federation.GetName] giám sát."
 federations3.2103.desc.generic:0 "$federations3.2103.desc.body$Để ứng phó, một ủy ban nghiên cứu đã được thành lập để hỗ trợ bất kỳ nỗ lực khai quật nào được thực hiện."
 federations3.2103.desc.coordinator:0 "$federations3.2103.desc.body$Để ứng phó, họ đã yêu cầu chúng ta lãnh đạo ủy ban điều phối các nỗ lực khai quật mà tất cả chúng ta đều muốn tham gia."
 leylines_digsite:0 "Tiếng Hú Âm Ty"
 leylines_digsite_desc:1 "Những gì từng được cho là chỉ là một vỉa khoáng sản tương đối thú vị trên [From.Planet.GetName] đã bắt đầu phát ra một tiếng vo ve kỳ lạ và inh tai nhức óc - và nó không đơn độc. Các thế giới trên khắp không phận liên bang đang bị tấn công dồn dập bởi một âm thanh tương tự. Điều gì có thể đứng sau những hiện tượng kỳ dị này?"
 #Special project begins
 federations3.2104.name:0 "Tín Hiệu Cộng Hưởng Gần Đó"
 federations3.2104.desc:1 "Các đồng nghiệp của chúng ta trong [root.Federation.GetName] báo cáo về một tiếng vo ve đinh tai nhức óc từ các nguồn được cho là nằm chôn sâu trên ít nhất một trong những thế giới của họ. Một ủy ban nghiên cứu đã được thành lập để hỗ trợ bất kỳ nỗ lực khai quật nào mà họ thực hiện.\n\nChúng ta đã được yêu cầu cung cấp thêm các nguồn lực của riêng mình, để tất cả chúng ta có thể hiểu rõ hơn về sự việc kỳ lạ và phiền toái này."
 federations3.2104.a:0 "Chúng ta sẽ hỗ trợ những gì có thể."
 leylines_chain_title:0 "Tiếng Ồn Từ Dưới Lòng Đất"
 leylines_chain_desc:0 "Một tiếng vo ve đinh tai nhức óc vang lên trên ít nhất một hành tinh trong không phận liên bang của chúng ta. Khi các đồng nghiệp của chúng ta nỗ lực khai quật các địa điểm này, chúng ta đã được yêu cầu đóng góp các nguồn lực khoa học của mình cho nỗ lực chung."
 LEYLINES_ACOUSTIC_PROJECT:0 "Đối Phó Với Hài Âm Cộng Hưởng"
 LEYLINES_ACOUSTIC_PROJECT_DESC:0 "Để hỗ trợ các đồng nghiệp liên bang của chúng ta giữa những điều kiện cực kỳ ồn ào, chúng ta đã được giao nhiệm vụ cải tiến các tấm khiên cách âm cho nhân sự của họ. Các nhà khảo cổ học hiện chỉ có thể làm việc theo các ca ngắn ngắt quãng trước khi có dấu hiệu kiệt sức về thể chất."
 federations3.2124.desc:0 "Chúng ta đã không cung cấp được cho các đồng nghiệp tấm khiên cách âm bổ sung mà họ yêu cầu. Sự thiếu thốn trang thiết bị này sẽ cản trở những nỗ lực của họ, mặc dù không làm đình trệ hoàn toàn. Tuy nhiên, nó đã khiến các nhà nghiên cứu tiền tuyến của họ thêm phần bối rối, ngay cả sau khi có những báo cáo cho thấy tiếng ồn hiện đang tự lắng xuống.\n\nỦy ban dự án của [root.Federation.GetName] hiện mời chúng ta bù đắp bằng cách đóng góp vào một nghiên cứu về chính âm thanh đó, để xem liệu điều đó có thể làm sáng tỏ điều gì hay không."
 federations3.2124.a:0 "Chúng ta sẽ cố gắng hết sức."
 federations3.2125.name:0 "Cải Tiến Khử Tiếng Ồn"
 federations3.2125.desc:0 "Chúng ta đã thành công trong việc nâng cao phạm vi và độ bền của các tấm khiên cách âm có thể triển khai. Những nâng cấp này đã được chia sẻ với các đồng nghiệp của chúng ta trong [root.Federation.GetName]; các nhà nghiên cứu trên thực địa của họ đã báo cáo về sự sụt giảm đáng kể tình trạng căng thẳng nhận thức và đau nhức toàn thân. Ủy ban điều phối hiện yêu cầu chúng ta hỗ trợ về vấn đề phân tích dữ liệu."
 LEYLINES_ANALYSIS_PROJECT:0 "Phân Tích Tiếng Vo Ve Cộng Hưởng"
 LEYLINES_ANALYSIS_PROJECT_DESC:0 "Giờ đây khi các đồng nghiệp của chúng ta trong [root.Federation.GetName] đã bắt đầu giai đoạn khai quật tiếp theo, ủy ban giám sát dự án đã giao phó cho chúng ta nghiên cứu tiếng ồn đang suy giảm nhưng vẫn phát ra từ mỗi thế giới bị ảnh hưởng."
 federations3.2129.desc:0 "Ủy ban dự án [root.Federation.GetName] bày tỏ sự thất vọng về sự thiếu hụt kết quả từ phía chúng ta. Khi tiếng ồn hành hạ một số thế giới liên bang của chúng ta cuối cùng cũng lắng xuống, thì cánh cửa cơ hội nghiên cứu cũng khép lại. Các nhà nghiên cứu đã thu thập những hiểu biết sâu sắc nhất có thể, nhưng mọi hy vọng về những câu trả lời chi tiết giờ đây hoàn toàn phụ thuộc vào các nhà khảo cổ học trên thực địa."
 federations3.2130.name:0 "Tiếng Vo Ve Cộng Hưởng Đã Được Phân Tích"
 federations3.2130.desc:0 "Tiếng vo ve tại các địa điểm khảo cổ trên khắp không gian liên bang của chúng ta đã bắt đầu lắng xuống. Bằng cách nghiên cứu các bản ghi âm của từng âm thanh - và đối chiếu chéo dữ liệu của chúng ta với dữ liệu của các đồng nghiệp - chúng ta đã phát hiện ra một sự hòa âm đáng kinh ngạc khi mỗi luồng âm thanh đinh tai nhức óc chồng lên nhau để tạo thành một giai điệu môi trường dễ chịu hơn. Có khả năng là sự sắp đặt này mang ý nghĩa văn hóa đối với bất kỳ ai đã xây dựng nên các địa điểm này; chúng ta có thể không bao giờ biết được. Cuộc nghiên cứu vẫn tiếp tục..."
 #Arc site
 federations3.2105.name:0 "Những Chiếc Vỏ Vang Vọng"
 federations3.2105.desc:0 "Công việc khai mở địa điểm này về mặt kỹ thuật tương đối đơn giản - bất chấp việc chúng ta phải làm việc theo các ca ngắt quãng. Chúng ta đã dỡ bỏ hai địa tầng vô thưởng vô phạt trước khi chạm trán một lớp vỏ hoặc mái vòm lớn. Những mái vòm khác giống hệt đã được phát lộ một phần gần đó; cho đến nay chúng dường như được sắp xếp theo hình vòng cung hoặc hình tròn.\n\nMỗi mái vòm được đúc từ một chiếc khuôn và được xử lý đến mức chúng đã chống chọi được qua các thời kỳ địa chất. Việc đi vào bên trong các cấu trúc này - mỗi cấu trúc có kích thước bằng một hội trường tập hợp - là hoàn toàn khả thi."
 federations3.2111.name:0 "Nơi Trú Ẩn Thanh Tịnh"
 federations3.2111.desc:0 "Trong khi chúng ta vẫn chưa xác định được nguồn gốc của tiếng vo ve lan tỏa khắp nơi, sự hiện diện áp đảo của nó đã bắt đầu suy giảm. Các nhà nghiên cứu của chúng ta từ đó đã có thể tập trung vào việc xuyên thủng cấu trúc gần như bán cầu này.\n\nKhông gian bên trong hoàn toàn không có vật chất hữu hình; kết luận ban đầu của chúng ta là nơi này được thiết kế như một phòng cách ly giác quan. Hơn nữa, bề mặt bên trong của mái vòm được minh họa bằng những hình vẽ trông như bản đồ chòm sao, bổ sung bởi các nhân vật thần thoại và một số hình thức kinh thánh. Chúng ta đang nỗ lực giải mã những thiết kế này."
 federations3.2112.name:0 "Bên Trong Lớp Vỏ"
 federations3.2112.desc:0 "Chúng ta đã phát hiện ra rất nhiều thiết bị phức tạp bên trong mái vòm, không thiết bị nào trong số đó dường như có khả năng tạo ra tiếng ồn khổng lồ mà chúng ta vẫn có thể nghe thấy bên ngoài. Một nhóm đặc nhiệm nhỏ đã tách ra để tiếp tục khía cạnh đó trong cuộc điều tra của chúng ta.\n\nPhần lớn các nhà nghiên cứu của chúng ta đã chuyển sự chú ý sang các bản vẽ phức tạp trang trí trên bề mặt bên trong của mái vòm: chúng xuất hiện dưới dạng các biểu đồ chòm sao được bổ sung bởi các nhân vật thần thoại và một số dạng kinh thánh. Chúng ta đang nỗ lực giải mã những thiết kế này."
 federations3.2116.name:0 "Đền Thờ Tĩnh Lặng"
 federations3.2116.desc:0 "Các báo cáo từ khắp [From.Owner.Federation.GetName] xác nhận: những tiếng hú u u giờ đã tan biến. Chúng ngừng lại gần như đồng thời, bất chấp khoảng cách mênh mông giữa các địa điểm giữa các vì sao.\n\nKể từ thời điểm đó, nhóm nghiên cứu của chúng ta đã suy luận ra các mô hình từ nhiều chòm sao được miêu tả ở mặt trong của mái vòm, nơi dường như từng được sử dụng để đưa ra các dự đoán chiêm tinh. Dữ liệu họ thu thập được cho thấy cơ sở này cổ xưa hơn nhiều so với các địa tầng xung quanh, cách biệt tới hàng kỷ nguyên - với một ngoại lệ đáng chú ý: việc tình cờ phát hiện ra một bục lớn ngay bên ngoài mái vòm gợi ý rằng ít nhất một nền văn minh đã sử dụng không gian này tương đối gần đây.\n\nChiếc bục được đẽo từ đá địa phương, và được trang trí bằng các nét chạm khắc mà chúng ta tin rằng đã được sử dụng để chuyển dịch các hải đồ sao lỗi thời của mái vòm cho một ngân hà được sắp xếp gần giống như với chúng ta hiện nay."
 federations3.2117.name:0 "Dàn Giao Hưởng Của Lòng Đất"
 federations3.2117.desc:1 "Mặc dù tiếng hú đã tan biến trên khắp [From.Owner.Federation.GetName], các nhà khảo cổ học của chúng ta vẫn bối rối trước mục đích của những mái vòm này. Các bản đồ sao và kinh thánh trang trí bên trong mái vòm dường như hướng tới một cấu trúc tập trung nào đó trong hệ sao [From.Planet.System.GetName], điều này giải thích tại sao tiếng ồn lại bắt nguồn từ nơi đây."
 federations3.2120.name:0 "Bản Nhạc Của Vũ Trụ"
 federations3.2120.desc:1 "Bằng cách đối chiếu dữ liệu khảo cổ học trên [From.Planet.GetName] với các di tích tương tự trên khắp [from.owner.Federation.GetName], chúng ta đã xác nhận rằng những mái vòm này là một phần của một thiết bị chiêm tinh quy mô lớn được thiết kế để hài hòa năng lượng tâm linh và vật lý của hành tinh."
 #Finalé
 federations3.2135.name:0 "Thấu Hiểu Bản Hòa Âm"
 federations3.2135.desc:0 "Nhờ sự hợp tác chặt chẽ trong [from.Federation.GetName], chúng ta đã giải mã được bí mật của thiết bị chiêm tinh cổ đại. Tại [root.Capital.GetName], các nhà khoa học của chúng ta đã có thể tiếp cận nguồn tri thức sâu rộng này."
 leylines_mod_knowing:0 "Genius Caeli: Tri Thức Vô Tận"
 leylines_mod_knowing_desc:0 "Nghiên cứu hợp tác của chúng ta về thiết bị chiêm tinh kỳ lạ đã mang lại những hiểu biết khoa học sâu sắc từ một nền văn minh cổ đại."
 federations3.2136.desc:0 "Mặc dù [from.Federation.GetName] đã nỗ lực, những bí ẩn của các mái vòm cổ đại chỉ được giải mã một phần. Tại [root.Capital.GetName], chúng ta chỉ thu thập được một lượng tri thức khiêm tốn."
 leylines_mod_lagom:0 "Genius Caeli: Thịnh Vượng Cân Bằng"
 leylines_mod_lagom_desc:0 "Nghiên cứu hợp tác của chúng ta về một thiết bị chiêm tinh kỳ lạ đã mang lại cho chúng ta hiểu biết sâu sắc: những bài học về tính bền vững từ một xã hội tâm linh cổ đại."
 federations3.2137.name:0 "Ảo Ảnh Huyền Bí"
 federations3.2137.desc:0 "Các sinh vật hữu tri trên khắp [from.Federation.GetName] đã giật mình bởi một sự chiếm quyền điều khiển nguồn cấp dữ liệu hình ảnh đột ngột, trùng hợp với một đợt bùng nổ hoạt động từ các địa điểm có mái vòm cổ xưa được phát hiện vài năm trước. Những dải ánh sáng được báo cáo là tràn ra từ các nguồn sâu dưới lòng đất, các chùm tia của chúng chiếu thẳng - một cách khó tin - vào các thủ đô của chúng ta.\n\nCác nhà nghiên cứu của chúng ta trên [root.Capital.GetName] bối rối trước việc phát sóng những ảo ảnh giống như trong mơ này. Không rõ nó nhằm mục đích gì, và không có hiện tượng tiếp theo nào được báo cáo có thể cung cấp thêm manh mối cho chúng ta. Có vẻ như chúng ta đã đơn giản bỏ lỡ cơ hội nghiên cứu hiện tượng này."

 ### BARELY CONTAINED EFFICIENCY (Joint Operation - Trade Leagues) by Douglas Furen ###

# EVENT TEXT
 # - Intro -
 fedev.605.name:0 "Thử Nghiệm Tái Cấu Trúc Hậu Cần"
 fedev.605.desc:0 "Các tuyến đường vận chuyển đủ loại hàng hóa là huyết mạch cho sự thịnh vượng của liên minh thương mại chúng ta. Tuy nhiên, cho đến nay, các đế chế thành viên vẫn tiếp tục sử dụng các tiêu chuẩn hậu cần riêng biệt về thiết kế container, quy trình xếp dỡ và đường ống vận chuyển.\n\nĐể tối đa hóa hiệu quả, một dự án thử nghiệm mới sẽ bắt đầu sau vài năm nữa - một dự án nhằm mục đích điều tra và thử nghiệm một tiêu chuẩn vận chuyển cụ thể mới sẽ được áp dụng cho tất cả các thành viên của liên bang.\n\nViệc tham gia đòi hỏi một hệ sao có ít nhất §H50 Thương Mại§! chảy qua nó. Hơn nữa, sự tồn tại của một §HCông Ty Thương Mại Ngoại Vi§! sẽ mang lại lượng dữ liệu thống kê gia tăng, và do đó rất được khuyến khích.\n\nDo quy mô rộng lớn của dự án này, một số chi phí sẽ được áp dụng. Nhưng đó là vì lợi ích lớn hơn. Có nghĩa là: nhiều lợi nhuận hơn trong tương lai.\n\nMỗi thành viên của liên bang đều được khuyến khích nhiệt tình tham gia."
 fedev.605.a:0 "Một sáng kiến xuất sắc!"
 # - Trial starts - Participants only -
 fedev.615.name:0 "Tham Gia Thử Nghiệm - Đã Chấp Thuận"
 fedev.615.desc.a:0 "Thử nghiệm tái cấu trúc hậu cần đã bắt đầu! Nhờ vào các tuyến thương mại sôi động của đế chế chúng ta, §Y[From.GetName]§! đã được cấp quyền tham gia vào dự án thử nghiệm! Một căn cứ sao đã được chọn làm địa điểm thử nghiệm, và giờ đây một §HTàu Xây Dựng§! phải được chỉ định để thực hiện dự án tái cấu trúc thực tế. Thời gian là một yếu tố quan trọng, vì vậy đừng chần chừ trong nỗ lực này.\n\nMột cơ sở §HCông Ty Thương Mại Ngoại Vi§! cũng sẵn có, và nhờ điều này, dự án sẽ được đẩy nhanh tiến độ. Đế chế sẽ được hưởng một số ưu đãi tài chính như một cử chỉ tri ân."
 fedev.615.desc.b:0 "Thử nghiệm tái cấu trúc hậu cần đã bắt đầu! Nhờ vào các tuyến thương mại sôi động của đế chế chúng ta, §Y[From.GetName]§! đã được cấp quyền tham gia vào dự án thử nghiệm! Một căn cứ sao đã được chọn làm địa điểm thử nghiệm, và giờ đây một §HTàu Xây Dựng§! phải được chỉ định để thực hiện dự án tái cấu trúc thực tế. Thời gian là một yếu tố quan trọng, vì vậy đừng chần chừ trong nỗ lực này.\n\nCơ sở §HCông Ty Thương Mại Ngoại Vi§! không sẵn có. Điều này không ngăn cản sự tham gia của chúng ta, nhưng sẽ cản trở tiến độ phần nào vì chúng ta không thể tận dụng tối đa việc chia sẻ thông tin có lợi giữa các bên liên quan."
 fedev.615.a:0 "Chúng ta đang làm phần việc của mình!"
 # - Trial starts - Not participating -
 fedev.620.name:0 "Tham Gia Thử Nghiệm - Bị Từ Chối"
 fedev.620.desc:0 "Thử nghiệm tái cấu trúc hậu cần đã bắt đầu! Tuy nhiên, §Y[From.GetName]§! đã bị phát hiện là thiếu các cơ sở cần thiết để tham gia thử nghiệm. Việc thiếu một §HTrung Tâm Thương Mại§! trong một hệ sao có đủ Thương Mại chảy qua là điều không khỏi khó hiểu.\n\nBỏ lỡ một dự án có tiềm năng sinh lời là một sai lầm, nhưng bỏ lỡ một cơ hội kinh doanh tối thượng như Thương Mại? Điều đó gần như là một tội ác!\n\nThật đáng xấu hổ, hỡi các [From.GetSpeciesNamePlural]! Thật đáng xấu hổ!"
 fedev.620.a:0 "Đành chịu vậy."
 # - Special Project completed -
 fedev.625.name:0 "Tái Cấu Trúc Hoàn Tất"
 fedev.625.desc:0 "Xin chúc mừng! Hoạt động tái cấu trúc đã kết thúc và Trung Tâm Thương Mại chuyên dụng hiện đang hoạt động theo một tiêu chuẩn hậu cần mới. Không còn gì để làm bây giờ ngoài việc đánh giá hệ thống mới.\n\nVào cuối giai đoạn thử nghiệm, sẽ có một tuyên bố chính thức về kết quả của dự án thử nghiệm."
 # - Perfect Trial result -
 fedev.635.name:0 "Chuyến Đi Suôn Sẻ Nhất"
 fedev.635.desc:0 "Đây là một ngày trọng đại cho lợi nhuận và thương mại! Không chỉ thử nghiệm hậu cần đã hoàn thành, mà kết quả còn cho thấy sự gia tăng rõ rệt về hiệu quả và sự suôn sẻ trong kinh doanh giữa các vì sao!\n\nKết quả là, tất cả các hoạt động thương mại không gian trong liên bang giờ đây sẽ dần dần - và hoàn toàn êm thấm - chuyển sang tiêu chuẩn mới; liên bang sẽ được hưởng lợi to lớn.\n\nHoan hô lợi nhuận!"
 fedev.635.a:0 "Một chiến thắng cho thương mại!"
 # - Good Trial result -
 fedev.640.name:0 "Thử Nghiệm Thành Công"
 fedev.640.desc:0 "Đó là một ngày tuyệt vời cho thương mại và mậu dịch. Thời gian thử nghiệm đã kết thúc và dự án đã được đánh giá đầy đủ. Đã thu thập đủ dữ liệu để chứng kiến sự gia tăng hiệu quả đảm bảo cho việc triển khai đầy đủ tiêu chuẩn hậu cần mới.\n\nBây giờ bắt đầu một quá trình trong đó tất cả các hoạt động vận chuyển sẽ chuyển sang tiêu chuẩn mới - nhưng quá trình này hoàn toàn tự động. Lương thực sẽ được giao, hàng tiêu dùng sẽ đến đích, hương liệu sẽ luân chuyển, và cứ như thế.\n\nLàm tốt lắm!"
 fedev.640.a:0 "Chào đón nguồn doanh thu mới."
 # - No Trial result -
 fedev.645.name:0 "Sự Tham Gia Đáng Thất Vọng"
 fedev.645.desc:0 "Thời kỳ ảm đạm thực sự đang cận kề nếu đây là động lực dưới mức tiêu chuẩn mà các thành viên liên bang theo đuổi lợi nhuận.\n\nSự thiếu hụt đáng ngạc nhiên về sự tham gia và quyết tâm đã biến thử nghiệm hậu cần đầy hứa hẹn này thành một trò hề! Giờ đây điều duy nhất còn lại là một vũ điệu tẻ nhạt của sự đổ lỗi, các vụ kiện tụng và tranh chấp pháp lý.\n\nHãy thuê luật sư đi, các [From.GetSpeciesNamePlural] - sẽ có những hậu quả đấy."
 fedev.645.a:0 "Chuyện này có phần hơi ngượng ngùng..."
# EVENT MODIFIERS
 encumbrance_tax:0 "Thuế Trì Trệ"
 encumbrance_tax_desc:0 "Việc thiếu tham gia tích cực vào thử nghiệm hậu cần đang diễn ra đã dẫn đến việc áp dụng một 'khoản thuế phạt' lên đế chế."
 cost_of_progress:0 "Chi Phí Tiến Bộ"
 cost_of_progress_desc:0 "Dự án tái cấu trúc hậu cần có thể mang lại quả ngọt trong tương lai, nhưng việc triển khai nó vẫn kéo theo chi phí."
 process_sharing:0 "Chia Sẻ Quy Trình"
 process_sharing_desc:0 "Nhờ sự hợp tác giữa các công ty liên quan, chi phí của dự án tái cấu trúc hậu cần đã được hạ thấp."
 streamlined_logistics:0 "Hậu Cần Hợp Lý Hóa"
 streamlined_logistics_desc:0 "Liên bang đang gặt hái những thành quả từ việc triển khai một tiêu chuẩn hậu cần hợp nhất."
 fully_streamlined_logistics:0 "Hậu Cần Được Hợp Lý Hóa Hoàn Toàn"
 fully_streamlined_logistics_desc:0 "Việc áp dụng hoàn hảo tiêu chuẩn hậu cần mới đã đem lại sự gia tăng hiệu quả tối đa cho toàn bộ liên bang."
# EVENT SPECIAL PROJECTS
 LOGISTIC_REMODEL:0 "Tái Cấu Trúc Hậu Cần"
 LOGISTIC_REMODEL_DESC:0 "Để thử nghiệm các tiêu chuẩn hậu cần mới, các cơ sở liên quan trên căn cứ sao này cần trải qua một số thay đổi lớn về cấu trúc.\n\nChỉ định một §YTàu Xây Dựng§! cho dự án, và đảm bảo hoàn thành đúng thời hạn!"
 LOGISTIC_REMODEL_OFFWORLD:0 "Tái Cấu Trúc Hậu Cần Tối Ưu Hóa"
 LOGISTIC_REMODEL_OFFWORLD_DESC:0 "Để thử nghiệm các tiêu chuẩn hậu cần mới, các cơ sở liên quan trên căn cứ sao này cần trải qua một số thay đổi lớn về cấu trúc. Nhờ có §HCông Ty Thương Mại Ngoại Vi§! tại địa phương, dự án này sẽ hiệu quả hơn.\n\nChỉ định một §YTàu Xây Dựng§! cho dự án, và đảm bảo hoàn thành đúng hạn!"

 ### Hegemony Joint Operation by Pierre du Plessis ###

 federations2.50.name:0 "Lễ Kỷ Niệm Thống Nhất"
 federations2.50.desc:0 "Dưới sự lãnh đạo sáng suốt của chúng ta, [Root.Federation.GetName] đã phát triển rực rỡ. Giờ đây, nhiều [Root.GetSpeciesNamePlural] cảm thấy đã đến lúc nhận được sự đền đáp cho những đóng góp của chúng ta đối với các đồng minh thông qua một lễ kỷ niệm thống nhất - hay chính xác hơn, một sự tán dương dành cho những người lãnh đạo [Root.GetAdj] vĩ đại đã cống hiến hết mình cho liên bang. Họ đề xuất rằng các thành viên liên bang nên hợp tác để xây dựng một đài tưởng niệm tráng lệ trên bầu trời phía trên [Root.Capital.GetName], trong khi đó chúng ta cử các phái đoàn đến thủ đô của hai quốc gia thành viên để hỗ trợ họ trong nỗ lực mang lại sự đoàn kết lớn hơn cho [Root.Federation.GetName]."
 federations2.50.A.tooltip:0 "Tất cả các quốc gia thành viên có quyền tiếp cận hệ sao §H[Root.Capital.System.GetName]§! sẽ được tiếp cận để tham gia vào chiến dịch chung.\n\nNếu họ chấp nhận, họ sẽ phải dành tài nguyên cho một đài tưởng niệm giúp tăng §HKinh Nghiệm§! Liên Bang và §HTầm Ảnh Hưởng§! của [Root.GetName].\n\n[Root.GetName] cũng sẽ có thể chọn tăng sức hút của tư tưởng §H[Root.GetHegemonyEthos]§! tại hai quốc gia thành viên.\n\nNếu đề xuất bị từ chối rộng rãi, §HĐộ Gắn Kết§! Liên Bang sẽ giảm và [Root.GetName] sẽ mất §HTầm Ảnh Hưởng§!."
 federations2.50.A:0 "Nghe có vẻ là một ý tưởng tuyệt vời!"
 federations2.50.B:0 "Chúng ta không cần những thứ phù phiếm như vậy."
 federations2.51.name:0 "$federations2.50.name$"
 federations2.51.desc:0 "Kính chào các [Root.GetSpeciesNamePluralCompliment] cao quý! Dưới sự lãnh đạo sáng suốt và bao dung của chúng tôi, [Root.Federation.GetName] đã ngày càng lớn mạnh, thể hiện sự thống nhất về mục đích của chúng ta trên khắp ngân hà. Đã đến lúc kỷ niệm những thành công chung của chúng ta với tư cách là một khối thống nhất. Còn cách nào tốt hơn để làm điều này ngoài việc xây dựng một đài tưởng niệm vĩ đại trên bầu trời thủ đô của chúng tôi, được dựng nên nhờ nỗ lực của các quốc gia thành viên? Trong khi đó, chúng tôi sẽ cử một phái đoàn đến thủ đô của các bạn, hỗ trợ các bạn nỗ lực phấn đấu vì lợi ích lớn hơn của [Root.Federation.GetName].\n\nCác bạn sẽ tham gia vào dự án này chứ?"
 federations2.51.A:0 "Tất nhiên rồi!"
 federations2.51.A.tooltip:0 "Tất cả các quốc gia thành viên có quyền tiếp cận hệ sao §H[From.Capital.System.GetName]§! sẽ được tiếp cận để tham gia vào chiến dịch chung.\n\nNếu họ chấp nhận, họ sẽ phải dành tài nguyên cho một đài tưởng niệm giúp tăng §HKinh Nghiệm§! Liên Bang và §HTầm Ảnh Hưởng§! của [From.GetName].\n\n[From.GetName] cũng sẽ có thể chọn tăng sức hút của tư tưởng §H[From.GetHegemonyEthos]§! tại hai quốc gia thành viên."
 federations2.51.A.tooltip2:0 "\nViệc hoàn thành đài tưởng niệm sẽ tiêu tốn 10% sản lượng khoáng sản £minerals£ của [Root.GetName] trong 1 năm."
 opinion_hegemony_joint_action_agreed:0 "Đồng Ý Với Lễ Kỷ Niệm Thống Nhất"
 federations2.51.B:0 "Một đài tưởng niệm trên thủ đô của các người? Tuyệt đối không!"
 federations2.51.B.tooltip:0 "Nếu đề xuất bị từ chối rộng rãi, §HĐộ Gắn Kết§! Liên Bang sẽ giảm."
 opinion_hegemony_joint_action_refused:0 "Từ Chối Lễ Kỷ Niệm Thống Nhất"
 federations2.53.name:0 "Chiến Dịch Chung Đổ Bể"
 federations2.53.desc:0 "Các đại sứ của chúng ta đã tiếp cận các thành viên của [Root.Federation.GetName] với các kế hoạch tổ chức lễ kỷ niệm thống nhất. Thật không may, dường như họ không có cùng quan điểm về vấn đề này như chúng ta, và chúng ta đã không thể tập hợp đủ sự ủng hộ để kế hoạch được tiếp tục."
 federations2.53.A:0 "Một sự thiếu vắng niềm tin đáng lo ngại."
 the_following_nations_will_participate:0 "\nCác quốc gia sau đây sẽ tham gia:"
 the_following_nations_said_yes:0 "\nCác quốc gia sau đây đã đồng ý với kế hoạch:"
 no_following_nations_said_yes:0 "\nKhông có quốc gia nào đồng ý với kế hoạch."
 the_following_nations_said_no:0 "\nCác quốc gia sau đây đã bác bỏ kế hoạch:"
 no_following_nations_said_no:0 "\nKhông có quốc gia nào bác bỏ kế hoạch."
 the_following_nations_failed2:0 "\nCác quốc gia sau đây đã không đóng góp:"
 prev_GetName:0 "[Prev.GetName]"
 federations2.54.name:0 "Chiến Dịch Chung Đổ Bể"
 federations2.54.desc.said_yes:0 "Bất chấp sự ủng hộ của chúng ta đối với sáng kiến của phía [From.GetAdj] nhằm tổ chức lễ kỷ niệm sự thống nhất của [Root.Federation.GetName], có vẻ như kế hoạch đã đổ bể. Đơn giản là không có đủ sự ủng hộ dành cho nó giữa các quốc gia thành viên khác."
 federations2.54.desc.said_no:0 "Sự phản đối của chúng ta đối với các kế hoạch trịch thượng của [From.GetAdj] về một chiến dịch chung trong [Root.Federation.GetName] đã mang lại kết quả. Bàng hoàng trước các kế hoạch về các phái bộ nhằm truyền bá tuyên truyền của [From.GetAdj] giữa các quốc gia thành viên, các đề xuất đã bị tất cả các bên thẳng thừng bác bỏ."
 federations2.54.A.yes:0 "Thật là một điều đáng tiếc."
 federations2.54.A.no:0 "Có lẽ đã đến lúc phải thay đổi mọi thứ trong liên minh này."
 federations2.55.name:0 "Chiến Dịch Chung Được Phê Chuẩn"
 federations2.55.desc:0 "Sáng kiến của chúng ta nhằm tổ chức một lễ kỷ niệm chung về sức mạnh và sự thống nhất của [Root.Federation.GetName] đã nhận được sự chấp thuận của đa số thành viên. Chúng ta sẽ bắt đầu làm việc để triển khai các kế hoạch lan tỏa sự hòa hợp trong liên minh ngay lập tức!"
 federations2.55.A:0 "Vì sức mạnh và sự thống nhất!"
 hegemon_join_operation_happens_tooltip:0 "Tất cả các thành viên tham gia nhận được một dự án đặc biệt để xây dựng một đài tưởng niệm trên §H[federation_leader.Capital.GetName]§!.\nPhía §H[federation_leader.GetName]§! nhận được các dự án đặc biệt để truyền bá tư tưởng §H[federation_leader.GetHegemonyEthos]§! tới tối đa hai quốc gia thành viên."
 federations2.56.name:0 "$federations2.55.name$"
 federations2.56.desc.said_yes:0 "Sáng kiến của [From.GetAdj] nhằm tổ chức lễ kỷ niệm chung về sức mạnh và sự thống nhất của [Root.Federation.GetName] đã nhận được sự chấp thuận của đa số thành viên. Chúng ta sẽ bắt đầu làm việc để biến các kế hoạch thành hiện thực ngay lập tức!"
 federations2.56.desc.said_no:0 "Bất chấp sự phản đối của chúng ta, các kế hoạch trịch thượng của [From.GetAdj] về một chiến dịch chung trong [Root.Federation.GetName] đã nhận được sự chấp thuận của đa số thành viên. May mắn thay, [From.GetName] không thể làm gì để ép buộc chúng ta tham gia vào kế hoạch này."
 federations2.56.desc.invalid:0 "Nhằm vinh danh sự lãnh đạo mạnh mẽ của [From.GetName] trong [Root.Federation.GetName], [From.GetSpeciesNamePlural] đã nhận được sự chấp thuận của các thành viên về việc tổ chức một lễ kỷ niệm chung cho sự thống nhất của liên minh chúng ta. Các quốc gia thành viên đã đồng ý dành tài nguyên cho một đài tưởng niệm tráng lệ trên bầu trời phía trên [From.Capital.GetName], trong khi các phái đoàn [From.GetAdj] sẽ đến thăm các thủ đô khác nhau để hỗ trợ sự hòa nhập của các quốc gia thành viên vào liên minh.\n\nDo vị trí xa xôi của chúng ta, không có lối tiếp cận dễ dàng đến [From.Capital.GetName], chúng ta không thể tham gia vào kế hoạch này."
 federations2.56.A:0 "$federations2.55.A$"
 federations2.56.B.no:0 "$federations2.54.A.no$"
 hegemony_joint_project_chain_title:0 "Lễ Kỷ Niệm Thống Nhất Và Sự Lãnh Đạo Vĩ Đại"
 hegemony_joint_project_chain_desc:0 "Một chiến dịch chung đã được phát động giữa các thành viên của [Root.Federation.GetName] để tôn vinh sự lãnh đạo mạnh mẽ của nó và thúc đẩy sự thống nhất tư tưởng lớn hơn."
 hegemony_joint_project_leader:0 "Điều Chỉnh Văn Hóa Trên [This.GetName]"
 hegemony_joint_project_leader_DESC:0 "Là một phần của chiến dịch chung hiện tại nhằm tôn vinh sự lãnh đạo mạnh mẽ và sự thống nhất về tư tưởng của [Root.Owner.Federation.GetName], một phái đoàn sẽ được cử đến thủ đô của hai thành viên để giám sát sự hòa nhập chặt chẽ hơn của họ vào liên minh.\n\nMột khi hai quốc gia thành viên đã được chọn, chương trình điều chỉnh văn hóa sẽ được coi là hoàn tất."
 hegemony_joint_project_member:0 "Đài Tưởng Niệm Lãnh Đạo Vững Vàng"
 hegemony_joint_project_member_DESC:1 "Là một phần của chiến dịch chung hiện tại nhằm tôn vinh sự thống nhất và sức mạnh của [Root.Owner.Federation.GetName], chúng ta đã đồng ý gửi tài nguyên đến [This.GetName] để xây dựng một đài tưởng niệm vĩ đại cho các nhà lãnh đạo [This.Owner.GetAdj] của chúng ta.\n\nChúng ta sẽ phải đóng góp 10% sản lượng khoáng sản £minerals£ của mình trong một năm cho dự án này."
 federations2.57.name:0 "Phái Đoàn Được Thiết Lập Trên [FromFrom.GetName]"
 federations2.57.desc:0 "Phái đoàn của chúng ta nhằm truyền bá các lý tưởng [Root.GetHegemonyEthos] tại [FromFrom.Owner.GetName] đã tự thiết lập trên [FromFrom.GetName]. Nếu may mắn, những nỗ lực của họ sẽ đơm hoa kết trái và tăng cường sự hòa hợp trong [Root.Federation.GetName]."
 federations2.58.name:0 "Phái Đoàn [From.Owner.GetAdj] Được Thiết Lập Trên [FromFrom.GetName]"
 federations2.58.desc:0 "Là một phần của các chiến dịch chung liên bang hiện tại, chính phủ [From.Owner.GetAdj] [From.Owner.GetGovernmentName] đã cử đại biểu đến [FromFrom.GetName] để truyền bá các lý tưởng [From.Owner.GetHegemonyEthos] tại [Root.GetName]. Mặc dù họ tuyên bố là đang thúc đẩy sự hòa hợp và thiện chí trong [Root.Federation.GetName], nhiều người lo ngại rằng các giá trị của chính chúng ta đang bị xâm phạm do tư cách thành viên trong liên minh."
 federations2.58.desc.good:0 "Là một phần của các chiến dịch chung liên bang hiện tại, chính phủ [From.Owner.GetAdj] [From.Owner.GetGovernmentName] đã cử đại biểu đến [FromFrom.GetName] để truyền bá các lý tưởng [From.Owner.GetHegemonyEthos] tại [Root.GetName]. May mắn thay, các giá trị của họ rất phù hợp với giá trị của chúng ta, tạo niềm tin cho tuyên bố của họ về việc thúc đẩy sự hòa hợp và thiện chí trong [Root.Federation.GetName]."
 federations2.58.A.good:0 "Chắc chắn điều này chỉ mang lại điều tốt lành."
 federations2.58.A.neutral:0 "Chúng ta hãy xem điều gì sẽ xảy ra từ việc này..."
 federations2.59.name:0 "Công Tác Xây Đài Tưởng Niệm Hoàn Tất"
 federations2.59.desc:0 "Chúng ta đã hoàn thành công việc xây dựng đài tưởng niệm trên [FromFrom.GetName], tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo khai sáng được cung cấp bởi [FromFrom.Owner.GetName]. Họ cảm ơn chúng ta vì sự đóng góp, mặc dù họ đang chờ đợi sự đóng góp của các đồng minh liên bang trước khi đài tưởng niệm chính thức được khánh thành."
 federations2.59.A.tooltip:0 "Một khi tất cả các thành viên đã hoàn thành phần đóng góp của mình, Liên Bang sẽ nhận được sự gia tăng kinh nghiệm."
 opinion_hegemony_joint_action_completed:0 "Đóng Góp Xây Dựng Đài Tưởng Niệm Liên Bang"
 federations2.60.name:0 "Đài Tưởng Niệm Trên [FromFrom.GetName] Hoàn Tất"
 hegemony_federation_monument_complete_success:0 "Nó đã được khánh thành trong sự chào đón nồng nhiệt, khơi dậy những màn ăn mừng rực rỡ trên khắp thế giới của mọi thành viên khi vẻ tráng lệ của công trình hiện rõ. Mỗi thành viên đã thi đua với nhau để vượt trội hơn trong phần đóng góp của mình, không ai lơ là trốn tránh. Công trình - ban đầu được dành riêng để tri ân [FromFrom.Owner.GetRulerTitle] của [FromFrom.Owner.GetAdj] - giờ đây sừng sững cho toàn thiên hà chiêm ngưỡng, như một bằng chứng rõ ràng về sức mạnh và sự đồng lòng gắn bó của liên bang chúng ta."
 hegemony_federation_monument_partial_success:0 "Nó đã được khánh thành trong sự chào đón nồng nhiệt, khơi dậy những màn ăn mừng trên khắp các thế giới thành viên khi vẻ tráng lệ của công trình hiện rõ. Gần như tất cả các quốc gia thành viên đều có những đóng góp đáng kể, biến công trình trở thành một tấm gương sáng ngời về sức mạnh và sự gắn kết của liên minh chúng ta."
 federations2.60.desc.complete_success:0 "Chúng ta đã hoàn thành công việc xây dựng đài tưởng niệm trên [FromFrom.GetName] để tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo uy nghiêm, khai sáng được mang lại bởi [FromFrom.Owner.GetName]. $hegemony_federation_monument_complete_success$"
 federations2.60.desc.partial_success:0 "Chúng ta đã hoàn thành công việc xây dựng đài tưởng niệm trên [FromFrom.GetName] để tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo khai sáng được mang lại bởi [FromFrom.Owner.GetName]. $hegemony_federation_monument_partial_success$"
 federations2.60.desc.partial_failure:0 "Chúng ta đã hoàn thành công việc xây dựng đài tưởng niệm trên [FromFrom.GetName] để tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo khai sáng được mang lại bởi [FromFrom.Owner.GetName]. Tuy nhiên, có vẻ như các đồng minh của chúng ta đã không ủng hộ sáng kiến này mạnh mẽ như chúng ta, và phần lớn các thành viên liên bang đã không đóng góp gì nhiều ngoài những lời nói suông. Do đó, đài tưởng niệm hoàn thành khá ảm đạm - một sự bẽ bàng mang tính biểu tượng cho sự chia rẽ của liên minh chúng ta hơn là bất kỳ cảm xúc hay sức mạnh chung nào."
 federations2.60.A.oh_well:0 "Ít nhất chúng ta cũng đã làm tròn phần việc của mình."
 federations2.61.name:0 "$federations2.60.name$"
 federations2.61.desc.complete_success:0 "Công tác xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo uy nghiêm, khai sáng do [FromFrom.Owner.GetName] mang lại đã hoàn tất. $hegemony_federation_monument_complete_success$"
 federations2.61.desc.partial_success:0 "Công tác xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo khai sáng do [FromFrom.Owner.GetName] mang lại đã hoàn tất. $hegemony_federation_monument_partial_success$"
 federations2.61.desc.partial_failure.but_I_did_it:0 "Công tác xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo của [FromFrom.Owner.GetName] đã hoàn tất. Thật không may, dường như chỉ có chúng ta và một số ít đồng minh khác là thực sự cống hiến hết mình cho nỗ lực này, trong khi phần lớn các thành viên liên bang không đóng góp gì ngoài những lời lẽ sáo rỗng. Kết quả là đài tưởng niệm khá tẻ nhạt - một sự bẽ bàng mang tính biểu tượng cho sự chia rẽ của liên minh hơn là tinh thần đoàn kết."
 federations2.61.desc.partial_failure.haha_no:0 "Các đồng minh của chúng ta đã hoàn thành công việc xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh \"sự thống nhất\" của [Root.Federation.GetName] và \"sự lãnh đạo khai sáng\" do [FromFrom.Owner.GetName] mang lại. Tuy nhiên, có vẻ như sự tận tâm đối với sáng kiến này không mạnh mẽ như người [FromFrom.Owner.GetSpeciesNamePlural] đã kỳ vọng, và phần lớn các thành viên liên bang đã không đóng góp gì nhiều ngoài những lời lẽ sáo rỗng. Đài tưởng niệm kết quả vì thế khá tẻ nhạt - một sự bẽ bàng tượng trưng cho sự chia rẽ của liên minh chúng ta hơn là bất kỳ cảm xúc hay sức mạnh chung nào."
 federations2.61.desc.complete_failure:0 "Kế hoạch xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh sự thống nhất của [Root.Federation.GetName] và sự lãnh đạo của [FromFrom.Owner.GetName] hôm nay đã chính thức bị hủy bỏ. $hegemony_federation_monument_complete_failure$"
 hegemony_federation_monument_complete_failure:0 "Không một thành viên nào trong liên minh sẵn lòng đóng góp cho kế hoạch ngoài những lời lẽ sáo rỗng, nghĩa là đài tưởng niệm chỉ dừng lại ở một ý tưởng viển vông - một kế hoạch thất bại phản ánh sự chia rẽ sâu sắc giữa chúng ta hơn là bất kỳ sức mạnh chung nào."
 federations2.61.A.good:0 "Cùng nhau chúng ta sẽ mạnh mẽ hơn."
 federations2.61.A.but_I_did_it:0 "$federations2.60.A.oh_well$"
 federations2.61.A.neutral:0 "Chà, đành vậy."
 federations2.61.A.oh_dear:0 "Có lẽ đã đến lúc cần một cuộc cải tổ triệt để."
 federations2.62.name:0 "$federations2.60.name$"
 federations2.62.desc.complete_success:0 "Công tác xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh sự thống nhất của [Root.Federation.GetName] cùng sự lãnh đạo uy nghiêm và khai sáng của chúng ta đã hoàn tất. $hegemony_federation_monument_complete_success$"
 federations2.62.desc.partial_success:0 "Công tác xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh sự thống nhất của [Root.Federation.GetName] cùng sự lãnh đạo uy nghiêm và khai sáng của chúng ta đã hoàn tất. $hegemony_federation_monument_partial_success$"
 federations2.62.desc.partial_failure:0 "Các đồng minh của chúng ta đã hoàn thành công việc xây dựng đài tưởng niệm trên [FromFrom.GetName] nhằm tôn vinh \"sự thống nhất\" của [Root.Federation.GetName] và \"sự lãnh đạo khai sáng\" của chúng ta. Tuy nhiên, có vẻ như sự tận tâm đối với sáng kiến không mạnh mẽ như chúng ta đã kỳ vọng, và đa số thành viên liên bang không đóng góp gì nhiều ngoài những lời sáo rỗng. Đài tưởng niệm thu được vì thế khá ảm đạm - một sự ngượng ngùng tượng trưng cho sự chia rẽ của liên minh hơn là tinh thần đoàn kết."
 federations2.62.desc.complete_failure:0 "Các kế hoạch xây dựng đài tưởng niệm trên [FromFrom.GetName] để tôn vinh \"sự thống nhất\" của [Root.Federation.GetName] và \"sự lãnh đạo khai sáng\" của chúng ta hôm nay đã chính thức bị hủy bỏ. $hegemony_federation_monument_complete_failure$"
 federations2.62.A.good:0 "Dưới sự lãnh đạo của chúng ta, tất cả đều trở nên mạnh mẽ hơn."
 federations2.62.A.neutral:0 "Chúng ta phải tạo dựng sự đoàn kết lớn hơn nữa."
 federations2.62.A.oh_dear:0 "Có lẽ chúng ta đã sai lầm khi trông cậy vào các đồng minh."
 federations2.70.name:0 "Đài Tưởng Niệm Trên [FromFrom.GetName] Bị Hủy Bỏ"
 federations2.70.desc:0 "Với sự thay đổi trong vị trí lãnh đạo liên bang, các kế hoạch cũ nhằm ca tụng những người cai trị [FromFrom.Owner.GetName] đã chính thức bị xếp xó."
 federations2.70.A:0 "Vị vua cũ đã băng hà; vạn tuế tân vương."
 federations2.71.name:0 "Chấm Dứt Tham Gia Xây Dựng Đài Tưởng Niệm"
 federations2.71.desc:0 "Vì chúng ta đã rời khỏi liên bang cũ, kế hoạch xây dựng đài tưởng niệm trên [FromFrom.GetName] để tôn vinh sự \"thống nhất\" của liên minh không còn liên quan đến chúng ta nữa."
 federations2.72.name:0 "$federations2.70.name$"
 federations2.72.desc:0 "Vì [FromFrom.GetName] không còn là trung tâm của liên bang chúng ta nữa, các kế hoạch cũ nhằm ca tụng các nhà lãnh đạo hành tinh đã chính thức bị xếp xó."
 federations2.72.A:0 "Tống khứ được là tốt rồi."

 federation_hegemony_monument:0 "Đài Tưởng Niệm Liên Bang"
 federation_hegemony_monument_desc:0 "Đài tưởng niệm ngoài không gian này sừng sững minh chứng cho sự thống nhất, sức mạnh và vẻ rực rỡ của liên bang giữa các vì sao đã xây dựng nên nó."
