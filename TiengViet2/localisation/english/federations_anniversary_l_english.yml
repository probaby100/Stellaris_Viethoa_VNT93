 hegemony_propaganda_xenophobe:0 "$hegemony_propaganda_militarist$"
 hegemony_propaganda_xenophobe_desc:0 "Kẻ Thống Trị của Liên Bang chúng ta đang truyền bá sự bài ngoại vào quốc gia chúng ta."
 hegemony_propaganda_xenophile:0 "$hegemony_propaganda_militarist$"
 hegemony_propaganda_xenophile_desc:0 "Kẻ Thống Trị của Liên Bang chúng ta đang truyền bá tư tưởng thân thiện ngoại chủng vào quốc gia chúng ta."
 hegemony_propaganda_materialist:0 "$hegemony_propaganda_militarist$"
 hegemony_propaganda_materialist_desc:0 "Kẻ Thống Trị của Liên Bang chúng ta đang truyền bá các giá trị duy vật vào quốc gia chúng ta."
 hegemony_propaganda_spiritualist:0 "$hegemony_propaganda_militarist$"
 hegemony_propaganda_spiritualist_desc:0 "Kẻ Thống Trị của Liên Bang chúng ta đang truyền bá các giá trị tâm linh vào quốc gia chúng ta."
 hegemony_propaganda_egalitarian:0 "$hegemony_propaganda_militarist$"
