 federation_materialist_ideology:0 "$federation_militarist_ideology$"
 federation_materialist_ideology_desc:0 "Tư cách thành viên liên bang đang khiến các giá trị duy vật ngày càng lan rộng trong quốc gia chúng ta."
 federation_spiritualist_ideology:0 "$federation_militarist_ideology$"
 federation_spiritualist_ideology_desc:0 "Tư cách thành viên liên bang đang khiến các giá trị tâm linh ngày càng lan rộng trong quốc gia chúng ta."
 federation_xenophobe_ideology:0 "$federation_militarist_ideology$"
 federation_xenophobe_ideology_desc:0 "Tư cách thành viên liên bang đang khiến các giá trị bài ngoại ngày càng lan rộng trong quốc gia chúng ta."
 federation_xenophile_ideology:0 "$federation_militarist_ideology$"
