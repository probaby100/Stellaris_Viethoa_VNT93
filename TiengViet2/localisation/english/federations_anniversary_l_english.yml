 edict_drone_overdrive_desc:0 "Các drone của chúng ta sẽ phải làm việc cật lực hơn khi cần nhiều tài nguyên hơn."

 edict_expanded_breeding_program:0 "Mở Rộng Chương Trình Sinh Sản"
