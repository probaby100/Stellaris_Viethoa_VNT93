 edict_extended_shifts:0 "Tăng Ca Kéo Dài"
 edict_extended_shifts_desc:1 "Chúng ta phải yêu cầu công nhân làm việc chăm chỉ hơn. Một vài thể xác suy kiệt chẳng đáng là bao so với Đại Nghĩa Chung."

