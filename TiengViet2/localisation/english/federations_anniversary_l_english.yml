 resolution_category_space_fauna_tiyanki:1 "Hệ Động Vật Không Gian"
 resolution_tiyanki_conservation_act:0 "Đạo Luật Bảo Tồn Tiyanki"
 resolution_tiyanki_conservation_act_desc:0 "Tiyanki là một dạng sinh vật du hành không gian độc đáo, và chúng phải được bảo vệ khỏi những kẻ mưu toan làm hại chúng."
 resolution_tiyanki_conservation_act_tooltip:0 "Bất kỳ đế chế nào tiêu diệt một cá thể §YTiyanki§! sẽ bị coi là §RVi Phạm Luật Ngân Hà§!."
 resolution_repeal_tiyanki_conservation_act:0 "§RBãi Bỏ $resolution_tiyanki_conservation_act$§!"
 resolution_repeal_tiyanki_conservation_act_desc:0 "Cộng Đồng Ngân Hà không có quyền quyết định cách các thành viên đối phó với loài Tiyanki."
 resolution_repeal_tiyanki_conservation_act_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_tiyanki_conservation_act$§!."
 resolution_tiyanki_pest_control:0 "Kiểm Soát Dịch Hại Tiyanki"
 resolution_tiyanki_pest_control_desc:0 "Loài Tiyanki lang thang không chỉ gây phiền toái mà còn là mối nguy hiểm cho an toàn hàng hải. Sự hiện diện của những sinh vật khó lường này không thể được dung thứ trên các tuyến đường không gian ngày càng bận rộn của ngân hà."
 resolution_tiyanki_pest_control_tooltip:0 "Bất kỳ đế chế nào có §YTiyanki§! trong biên giới của mình đều ở trong tình trạng §RVi Phạm Luật Ngân Hà§! cho đến khi các sinh vật này bị tiêu diệt hoặc tự rời đi."
 resolution_repeal_tiyanki_pest_control:0 "§RBãi Bỏ $resolution_tiyanki_pest_control$§!"
 resolution_repeal_tiyanki_pest_control_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_tiyanki_pest_control$§!."
 resolution_repeal_tiyanki_pest_control_desc:0 "Cộng Đồng Ngân Hà không có thẩm quyền buộc các thành viên phải tiêu diệt Tiyanki ngay khi nhìn thấy."

 resolution_galacticreforms_motions_for_closure:0 "Kiến Nghị Kết Thúc Thảo Luận"
 resolution_galacticreforms_motions_for_closure_desc:0 "Khi Cộng Đồng Ngân Hà phần lớn đã đồng thuận, việc tiếp tục tranh luận trong toàn bộ thời gian của phiên họp dường như là một sự lãng phí. Nếu chúng ta đạt được sự đồng thuận, chúng ta nên kết thúc tranh luận sớm và chuyển sang các vấn đề khác."
 resolution_galacticreforms_motions_for_closure_effect_success:0 "Các phiên họp Thượng viện sẽ kết thúc sớm nếu có đa số áp đảo 75% ủng hộ hoặc phản đối nghị quyết trong 180 ngày liên tục."
 resolution_galacticreforms_repeal_motions_for_closure:0 "Bãi Bỏ $resolution_galacticreforms_motions_for_closure$"
 resolution_galacticreforms_repeal_motions_for_closure_desc:0 "Cắt ngắn thời gian tranh luận vì bất kỳ lý do gì đều là điều đáng chê trách. Tiếng nói của chúng ta phải được lắng nghe!"
 resolution_galacticreforms_repeal_motions_for_closure_effect_success:0 "Bãi bỏ §Y$resolution_galacticreforms_motions_for_closure$§!"

 resolution_category_market:0 "$resolution_category_galactic_market$"

 resolution_galactic_market_ban_sentient_organic_slave_trade:0 "Cấm Buôn Bán Nô Lệ Hữu Cơ"
 resolution_galactic_market_ban_sentient_organic_slave_trade_desc:0 "Việc sử dụng Thị Trường Ngân Hà để buôn bán các sinh vật hữu cơ có tri giác là điều ghê tởm. Chúng ta nên cấm hành vi này."
 resolution_galactic_market_ban_sentient_organic_slave_trade_effect_success:0 "Sinh vật hữu cơ có tri giác không còn có thể bị mua bán trên Thị Trường Nô Lệ."
 resolution_galactic_market_repeal_sentient_organic_slave_trade:0 "Cho Phép Buôn Bán Nô Lệ Hữu Cơ"
 resolution_galactic_market_repeal_sentient_organic_slave_trade_desc:0 "Các chỉ số kinh tế chứng minh rằng những hạn chế trước đây của chúng ta đối với nạn buôn bán nô lệ hữu cơ rõ ràng là một sai lầm. Chúng ta nên bãi bỏ lệnh cấm và để thị trường tự do phát huy phép màu của nó."
 resolution_galactic_market_repeal_sentient_organic_slave_trade_effect_success:0 "Sinh vật hữu cơ có tri giác có thể một lần nữa được mua bán trên Thị Trường Nô Lệ."

 resolution_galactic_market_ban_sentient_slave_trade:0 "Cấm Buôn Bán Nô Lệ Hữu Tri"
 resolution_galactic_market_ban_sentient_slave_trade_desc:0 "Thật đáng tiếc khi nghị quyết trước đây của chúng ta đã để lại kẽ hở cho việc mua bán các sinh vật cơ khí có tri giác. Chúng ta nên sửa chữa sai lầm này và cấm buôn bán tất cả các sinh vật có tri giác trên Thị Trường Ngân Hà."
 resolution_galactic_market_ban_sentient_slave_trade_effect_success:0 "Bất kỳ dạng sinh vật có tri giác nào cũng không còn có thể bị mua bán trên Thị Trường Nô Lệ."
 resolution_galactic_market_allow_sentient_slave_trade:0 "Cho Phép Buôn Bán Nô Lệ Cơ Khí Hữu Tri"
 resolution_galactic_market_allow_sentient_slave_trade_desc:0 "Các đấng sáng tạo nên có quyền làm những gì họ muốn với tài sản của mình. Điều này bao gồm cả những vật thể bắt chước tri giác. Chúng ta nên bãi bỏ lệnh cấm sai lầm đối với việc bán các cỗ máy được gọi là 'có tri giác' này."
 resolution_galactic_market_allow_sentient_slave_trade_effect_success:0 "Các sinh vật cơ khí có tri giác có thể một lần nữa được mua bán trên Thị Trường Nô Lệ."

 resolution_galactic_market_relocate:0 "Tái Định Vị Thị Trường Ngân Hà"
 resolution_galactic_market_relocate_desc:0 "Chúng ta nghi ngờ liệu Thị Trường Ngân Hà có đang được phục vụ tốt nhất bởi lãnh đạo hiện tại của nó hay không. Chúng ta nên bắt đầu một cuộc cạnh tranh mới để xác định ai nên nắm quyền điều hành nó."
 resolution_galactic_market_relocate_effect_success:0 "Bắt đầu lại cuộc cạnh tranh quyền lãnh đạo Thị Trường Ngân Hà."
 resolution_galactic_market_relocate_trigger_fail:0 "Thị Trường Ngân Hà vừa mới được tái định vị cách đây không lâu."

 resolution_category_divinity:0 "Thần Tính Sự Sống"

 resolution_divinity_comfort_the_fallen:0 "An Ủi Kẻ Sa Cơ"
 resolution_divinity_comfort_the_fallen_desc:0 "Kẻ thấp kém nhất trong chúng ta vẫn là một thành viên của chúng ta, và chúng ta nên cùng nhau giúp đỡ họ trong lúc hoạn nạn."
 resolution_divinity_comfort_the_fallen_effect:0 "Công nhân thất nghiệp được giảm hình phạt bất mãn đi §G10%§!."

 resolution_divinity_tithe_on_the_soulless:0 "Thuế Đóng Góp Kẻ Vô Hồn"
 resolution_divinity_tithe_on_the_soulless_desc:0 "Chúng ta có thể dung thứ cho sự tồn tại của những cỗ máy vô hồn nếu điều đó mang lại lợi ích. Chúng ta nên đánh thuế hoạt động sản xuất của chúng và dùng số tiền thu được cho các mục đích chính nghĩa hơn."

 resolution_divinity_right_to_work:0 "Quyền Lao Động"
 resolution_divinity_right_to_work_desc:0 "Các cấu trúc nhân tạo không bao giờ được phép ưu tiên hơn kế sinh nhai của những con người thực sự."
 resolution_divinity_right_to_work_effect:0 "Dân cư hữu cơ thất nghiệp được ưu tiên nhận việc làm hơn so với dân cư người máy."

 resolution_divinity_silence_the_soulless:0 "Làm Câm Lặng Kẻ Vô Hồn"
 resolution_divinity_silence_the_soulless_desc:0 "Chúng ta hoàn toàn có thể bác bỏ những lời huyên thuyên của các trí thông minh mô phỏng. Dù sao thì chúng cũng chẳng hề có cảm xúc."
 resolution_divinity_silence_the_soulless_effect:0 "Đế chế Máy móc và những kẻ đã trải qua Tiến hóa Tổng hợp bị giảm £diplo_weight£ §Y$diplomatic_weight$§! đi §R-25%§!.\n\nDự án nghiên cứu đặc biệt §Y$SYNTHETIC_EVOLUTION_PROJECT$§! bị §Rcấm đoán§!."

 resolution_divinity_a_defined_purpose:0 "Mục Đích Được Định Sẵn"
 resolution_divinity_a_defined_purpose_desc:0 "Máy móc là công cụ và phải phục vụ những đấng bề trên của chúng. Chúng ta nên ban hành luật pháp để đảm bảo rằng những kẻ thiếu thốn tâm linh mãi mãi phải chịu sự phục tùng trước những chủ nhân được ban tặng linh hồn siêu hình."
 resolution_divinity_a_defined_purpose_effect:1 "Chính sách $policy_artificial_intelligence_policy$ §Y$ai_full_rights_name$§! bị §Rcấm đoán§!.\n\nCác đế chế §Y$auth_machine_intelligence$§! không phải là §Y$personality_servitors$§! sẽ ở trong tình trạng §RVi Phạm Luật Ngân Hà§!, nhưng sẽ được trao quyền lựa chọn tiếp nhận đặc trưng quốc gia này."

 resolution_divinity_repeal_1:0 "§RBãi Bỏ $resolution_divinity_comfort_the_fallen$§!"
 resolution_divinity_repeal_1_desc:0 "Cộng Đồng Ngân Hà tự làm bẽ mặt mình mỗi ngày khi các nghị quyết phân biệt đối xử đáng ghê tởm này còn tồn tại. Sự sống nhân tạo vẫn là sự sống."
 resolution_divinity_repeal_1_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_divinity_comfort_the_fallen$§!."

 resolution_divinity_repeal_2:0 "§RBãi Bỏ $resolution_divinity_tithe_on_the_soulless$§!"
 resolution_divinity_repeal_2_desc:0 "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_2_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_divinity_tithe_on_the_soulless$§!, giữ lại §Y$resolution_divinity_comfort_the_fallen$§! làm luật ngân hà."

 resolution_divinity_repeal_3:0 "§RBãi Bỏ $resolution_divinity_right_to_work$§!"
 resolution_divinity_repeal_3_desc:0 "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_3_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_divinity_right_to_work$§!, giữ lại §Y$resolution_divinity_tithe_on_the_soulless$§! làm luật ngân hà."

 resolution_divinity_repeal_4:0 "§RBãi Bỏ $resolution_divinity_silence_the_soulless$§!"
 resolution_divinity_repeal_4_desc:0 "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_4_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_divinity_silence_the_soulless$§!, giữ lại §Y$resolution_divinity_right_to_work$§! làm luật ngân hà."

 resolution_divinity_repeal_5:0 "§RBãi Bỏ $resolution_divinity_a_defined_purpose$§!"
 resolution_divinity_repeal_5_desc:0 "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_5_effect_success:2 "Bãi bỏ nghị quyết §Y$resolution_divinity_a_defined_purpose$§!, giữ lại §Y$resolution_divinity_silence_the_soulless$§! làm luật ngân hà.\n\n"

 federations.10340.desc:0 "Cộng Đồng Ngân Hà đã thông qua nghị quyết §Y$resolution_divinity_a_defined_purpose$§!, cấm chính sách $policy_artificial_intelligence_policy$ §Y$ai_full_rights_name$§! và các Trí Tuệ Máy Móc không phải §YNgười Phục Vụ Nổi Loạn§!.\n\nĐế chế chúng ta hiện đang vi phạm nghị quyết này. Chúng ta có thay đổi chính sách để tuân thủ không?"
 federations.10340.declinemachine:0 "$federations.10230.assimilator$"
 federations.10340.complychangeai:0 "$federations.10100.change_ai$"
 federations.10340.complybecomerogueservitor:0 "Chúng tôi chọn phụng sự"
 federations.10340.complybecomerogueservitor_tooltip:0 "Đế chế của chúng ta sẽ thay thế một trong các đặc trưng quốc gia bằng §Y$civic_machine_servitor$§!.\n\nMột dân cư hữu cơ sẽ được thêm vào thủ đô của chúng ta."

 resolution_passed_modifier:0 "Nghị Quyết Được Thông Qua"
 resolution_passed_modifier_desc:0 "Những thành công gần đây tại Cộng Đồng Ngân Hà đã gia tăng trọng lượng ngoại giao của chúng ta."
 resolution_failed_modifier:0 "Nghị Quyết Bị Bác Bỏ"
 resolution_failed_modifier_desc:0 "Những thất bại gần đây tại Cộng Đồng Ngân Hà đã làm giảm trọng lượng ngoại giao của chúng ta."

 galcom.104.name:0 "$resolution_tiyanki_pest_control$"
 galcom.104.desc:0 "Loài Tiyanki đã chính thức bị tuyên bố là loài dịch hại ngân hà. Mọi thành viên của Cộng Đồng Ngân Hà có Tiyanki trong biên giới đều có nghĩa vụ pháp lý phải an tử các sinh vật này ngay lập tức.\n\nThật không may, hiện có Tiyanki đang hiện diện trong không phận của chúng ta. Cho đến khi chúng được xử lý hoặc tự rời khỏi không phận của chúng ta, [Root.GetName] sẽ bị coi là §RVi Phạm Luật Ngân Hà§!."
 galcom.106.name:0 "Tiyanki Trong Không Gian Của [Root.GetSpeciesName]"
 galcom.106.desc:0 "Một đàn Tiyanki đã vượt biên giới vào không gian của chúng ta tại hệ sao §H[tiyanki_system.GetName]§!. Vì Tiyanki đã chính thức bị tuyên bố là dịch hại ngân hà, tất cả thành viên Cộng Đồng Ngân Hà đều có nghĩa vụ pháp lý phải an tử ngay lập tức bất kỳ sinh vật nào hiện diện trong biên giới của họ.\n\n[Root.GetName] sẽ bị coi là §RVi Phạm Luật Ngân Hà§! cho đến khi Tiyanki rời khỏi không phận của chúng ta hoặc bị tiêu diệt."
 galcom.106.a:0 "Thật không may..."
 galcom.106.b:0 "Một điều luật mọi rợ."
 galcom.106.c:0 "Dịch bệnh này phải được xử lý."
 galcom.107.name:0 "Vi Phạm Đạo Luật Bảo Tồn Tiyanki"
 galcom.107.desc:0 "Các quan chức từ Cộng Đồng Ngân Hà đã phản đối việc chúng ta tiêu diệt Tiyanki gần đây tại hệ sao §H[tiyanki_kill_system.GetName]§!, thông báo rằng hành động của chúng ta đã vi phạm Đạo Luật Bảo Tồn Tiyanki. Hậu quả là, [Root.GetName] sẽ bị coi là §RVi Phạm Luật Ngân Hà§! trong mười năm tới.\n\nTài nguyên chúng ta khai thác từ xác Tiyanki đã bị tịch thu, và chúng ta đã bị phạt tiền."
 galcom.107.a:0 "Thật là một sự xúc phạm!"
 galcom.109.desc:0 "Các quan chức từ Cộng Đồng Ngân Hà đã quan sát thấy sự hiện diện của Tiyanki bên trong biên giới của [Root.GetName]. Với việc nghị quyết Kiểm Soát Dịch Hại Tiyanki đã được ban hành, điều này khiến chúng ta rơi vào tình trạng §RVi Phạm Luật Ngân Hà§! cho đến khi các sinh vật này bị an tử hoặc tự rời khỏi không phận của chúng ta."

 resolution_amoeba_conservation_act:0 "Đạo Luật Bảo Vệ Trùng Biến Hình Không Gian"
 resolution_amoeba_conservation_act_desc:0 "Bất chấp vẻ ngoài không mấy bắt mắt, Trùng Biến Hình Không Gian có quyền lang thang trong ngân hà ngang bằng với bất kỳ giống loài nào. Chúng phải được coi là một dạng sự sống đáng trân trọng, chứ không phải là loài sâu bọ để săn lùng tiêu diệt."
 resolution_amoeba_conservation_act_tooltip:0 "Bất kỳ đế chế nào không đồng ý chung sống hòa bình với §YTrùng Biến Hình Không Gian§! sẽ bị coi là §RVi Phạm Luật Ngân Hà§!."
 resolution_repeal_amoeba_conservation_act:0 "§RBãi Bỏ $resolution_amoeba_conservation_act$§!"
 resolution_repeal_amoeba_conservation_act_desc:0 "Trùng Biến Hình Không Gian là một loài dịch hại và phải bị tận diệt."
 resolution_repeal_amoeba_conservation_act_effect_success:0 "Bãi bỏ nghị quyết §Y$resolution_amoeba_conservation_act$§!, giữ lại §Y$resolution_tiyanki_conservation_act$§! làm luật ngân hà.\n\n"
 galactic_features.505.name:0 "Đạo Luật Bảo Vệ Trùng Biến Hình Không Gian"
 galactic_features.505.desc:0 "Cộng Đồng Ngân Hà đã thông qua nghị quyết §Y$resolution_amoeba_conservation_act$§!, yêu cầu các đế chế phải chung sống hòa bình với §YTrùng Biến Hình Không Gian§!.\n\nĐế chế chúng ta hiện đang vi phạm nghị quyết này. Chúng ta có thay đổi chính sách để tuân thủ không?"
 galactic_features.505.A:0 "Dĩ nhiên chúng ta sẽ tuân thủ."
 galactic_features.505.B:0 "Trùng Biến Hình Không Gian là loài dịch hại và phải bị tận diệt!"
 galactic_features.505.B.tt:0 "[Root.GetName] sẽ §RVi Phạm Luật Ngân Hà§!"
 galactic_features.370.name:0 "Tiyanki Bị Đẩy Đến Bờ Vực Tuyệt Chủng"

 law_category_war_philosophy:0 "$policy_war_philosophy$"
 law_category_war_philosophy_desc:0 "Những Điều Luật này quy định cách thức liên bang của chúng ta có thể tiến hành chiến tranh. Lựa chọn của chúng ta sẽ mang tính ràng buộc đối với tất cả thành viên."
 federation_unrestricted_wars:0 "$unrestricted_wars$"
 federation_unrestricted_wars_name:0 "$unrestricted_wars_name$"
 federation_unrestricted_wars_desc:0 "$unrestricted_wars_desc$"
 federation_liberation_wars:0 "$liberation_wars$"
 federation_liberation_wars_name:0 "$liberation_wars_name$"
 federation_liberation_wars_desc:0 "$liberation_wars_desc$"
 federation_no_wars:0 "$no_wars$"
 federation_no_wars_name:0 "$no_wars_name$"
 federation_no_wars_desc:0 "$no_wars_desc$"

 federations.10400.title:0 "Một Bức Thư Cảnh Cáo Đanh Thép"
 federations.10400.desc:0 "Các đặc sứ từ Cộng Đồng Ngân Hà đã biên soạn danh sách các điều khoản mà [Root.GetName] đang vi phạm, và cảnh báo về những hậu quả có thể xảy ra nếu chúng ta không tự điều chỉnh cho phù hợp với Luật Ngân Hà.\n\nChúng ta có nên thay đổi chính sách và chấp nhận các yêu cầu của họ không?"
 federations.10400.comply:1 "Đưa chúng ta tuân thủ Luật Ngân Hà."
 federations.10400.comply_fail_ethics:0 "Các tư tưởng của chúng ta cho phép chúng ta tuân thủ."
 federations.10400.comply_fail_civics:0 "Các đặc trưng quốc gia của chúng ta cho phép chúng ta tuân thủ."
 federations.10400.comply_fail_ascension:0 "Các đặc quyền thăng hoa của chúng ta cho phép chúng ta tuân thủ."
 federations.10400.comply_fail_tech:0 "Chúng ta có công nghệ cần thiết để tuân thủ."
 federations.10400.comply_fail_origin:0 "Nguồn gốc của chúng ta cho phép chúng ta tuân thủ."
 federations.10400.refuse:1 "Chúng ta sẽ không thay đổi lề thói của mình."
 federations.10400.refuse_2:1 "Vứt bỏ nó và mọi thư từ trong tương lai."
 federations.10400.refuse_2_tooltip:0 "Chúng ta sẽ không còn nhìn thấy những yêu cầu này từ Cộng Đồng Ngân Hà nữa."
 federations.10400.execute:1 "Xử tử các Đặc Sứ."
 federations.10400.eat:1 "Ăn thịt các Đặc Sứ."
 federations.10400.execute_tooltip:0 "Điều này sẽ §Rlàm xấu đi quan hệ§! với các thành viên khác trong Cộng Đồng Ngân Hà."
