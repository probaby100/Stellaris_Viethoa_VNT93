 ####################
 # GALACTIC FEATURES
 ####################

 ### Tiyanki by Henrik Thyrwall ###

 galactic_features.367.name:0 "Hệ Sao Mẹ Của Tiyanki Bị Thanh Tẩy"
 galactic_features.367.a.desc:0 "$galactic_features.367.1$\n\n$galactic_features.367.2$"
 galactic_features.367.b.desc:0 "$galactic_features.367.1$\n\n$galactic_features.367.3$"
 galactic_features.367.c.desc:0 "$galactic_features.367.1$\n\n$galactic_features.367.4$"
 galactic_features.367.1:0 "Những cá thể Tiyanki cuối cùng trong hệ sao §H[tiyanki_system.GetName]§! đã bị tiêu diệt bởi §H[tiyanki_killer.GetName]§!. Với vùng sinh sản cổ xưa bị thanh tẩy, loài Tiyanki sẽ không còn có thể sinh sản được nữa lần đầu tiên trong lịch sử ngân hà."
 galactic_features.367.2:0 "Con đường dẫn đến sự tuyệt chủng cuối cùng của chúng dường như là không thể tránh khỏi bây giờ."
 galactic_features.367.3:0 "Với việc tất cả Tiyanki đã biết bên ngoài [tiyanki_system.GetName] đều đã bị săn đuổi, ngày hôm nay đánh dấu sự kết thúc của giống loài này. Sau khi lang thang khắp ngân hà hàng trăm triệu năm, Tiyanki giờ đây đã tuyệt chủng."
 galactic_features.367.4:0 "Có tin đồn rằng một Tiyanki Đầu Đàn cổ đại vẫn còn đang lẩn trốn. Dù thật hay không, sau ngày hôm nay loài Tiyanki - với tư cách là một giống loài - chỉ có thể coi là đã tuyệt chủng."
 galactic_features.368.name:0 "Nôi Của Sự Sống"
 galactic_features.368.desc:0 "$galactic_features.368.1.desc$\n\n$galactic_features.368.2.desc$"
 galactic_features.368.alt.desc:0 "$galactic_features.368.1.desc$\n\n$galactic_features.368.3.desc$"
 galactic_features.368.1.desc:0 "Bốn hành tinh khí khổng lồ được bao bọc bởi một trường plasma rộng lớn cùng chia sẻ một quỹ đạo gần quanh ngôi sao chủ của hệ sao §H[tiyanki_system.GetName]§!. Trường plasma tích điện này mở rộng sâu vào bầu khí quyển của các hành tinh khí, và môi trường độc nhất vô nhị này đóng vai trò như một bãi sinh sản cho một số lượng lớn các sinh vật du hành không gian."
 galactic_features.368.2.desc:0 "Những sinh vật này đều cực kỳ nhỏ bé, ngoại trừ một ngoại lệ nổi bật - loài §HTiyanki§! khổng lồ. Hệ sao này hẳn là nơi chúng tiến hóa ban đầu hàng trăm triệu năm trước, trước khi chúng tiến sâu hơn vào ngân hà. Với những đặc tính cực kỳ hiếm có của trường plasma trong hệ sao, đây có lẽ là nơi duy nhất trong ngân hà mà Tiyanki có thể sinh sản."
 galactic_features.368.3.desc:1 "Những sinh vật này đều cực kỳ nhỏ bé, ngoại trừ một ngoại lệ đáng chú ý - những sinh vật khổng lồ không giống bất cứ thứ gì chúng ta từng thấy. Mặc dù chúng ta sở hữu rất ít dữ liệu về chúng, chúng dường như thường xuyên di chuyển sâu vào ngân hà. Nếu chúng ta tìm hiểu thêm về chúng, chúng ta có thể khám phá ra điều gì thu hút chúng đến hệ sao này, và liệu nó có thể mang lại lợi ích cho chúng ta theo bất kỳ cách nào hay không."
 galactic_features.370.a.desc:0 "$galactic_features.370.1.desc$"
 galactic_features.370.b.desc:0 "$galactic_features.370.1.desc$\n\n$galactic_features.367.4$"
 galactic_features.370.1.desc:0 "Cá thể Tiyanki cuối cùng đã được biết đến gần đây đã bị săn đuổi và tiêu diệt bởi §H[tiyanki_killer.GetName]§! tại hệ sao §H[tiyanki_system.GetName]§!. Những dạng sống du hành không gian này, vốn có tuổi đời xa xưa hơn bất kỳ đế chế nào hiện còn tồn tại, được cho là đã lang thang khắp ngân hà hàng trăm triệu năm. Ngày hôm nay đánh dấu hồi kết cho lịch sử huyền thoại của chúng."
 galactic_features.371.desc:0 "Ngay cả khi đế chế của chúng ta đang ở đỉnh cao quyền lực, từ thuở xa xưa, Tiyanki đã được coi là cổ đại, và giờ đây... giờ đây ta được thông báo rằng một lũ OANH CON [Root.GetSpeciesName] gần đây đã tàn sát những sinh vật không có khả năng tự vệ cuối cùng, đẩy chúng vào chỗ tuyệt chủng.\n\nBộ não [Root.GetSpeciesName] còi cọc của các ngươi có hiểu nổi các ngươi đã làm gì không? Các ngươi có một chút ý niệm nào về những gì mà hành động nhẫn tâm của các ngươi đã cướp đi khỏi ngân hà này không?"
 galactic_features.371.a:0 "Chúng tôi... chúng tôi không cố ý để điều này xảy ra."
 galactic_features.371.b:0 "Cũng như các ngươi, thời đại của chúng đã qua rồi."
 galactic_features.371.c:0 "Chuyện đã xong rồi."
 galactic_features.367.a:0 "Ngân hà phải cảm ơn chúng ta mới đúng."
 galactic_features.367.b:0 "Một tội ác không thể tha thứ."
 galactic_features.367.c:0 "Tống khứ được là tốt rồi."
 galactic_features.385:0 "Tiyanki Bị Săn Đuổi Tại [tiyanki_kill_system.GetName]"
 galactic_features.385.desc:0 "Chúng ta đã săn lùng và tiêu diệt thành công một số Tiyanki hoang dã tại hệ sao §H[tiyanki_kill_system.GetName]§!. Hạm đội của chúng ta đã sử dụng máy cắt laser để chiết xuất vật liệu và tài nguyên từ xác Tiyanki khổng lồ."
 #tiyanki_kills:1 "Harvested Tiyanki:\n§Y[Root.tiyanki_cow_kills]§! §HTiyanki Cows:§! £energy£§Y[Root.tiyanki_cow_credits]§!, £exotic_gases£§Y[Root.tiyanki_cow_gas]§!\n§Y[Root.tiyanki_bull_kills]§! §HTiyanki Bulls:§! £energy£§Y[Root.tiyanki_bull_credits]§!, £exotic_gases£§Y[Root.tiyanki_bull_gas]§!\n§Y[Root.tiyanki_calf_kills]§! §HTiyanki Calves:§! £energy£§Y[Root.tiyanki_calf_credits]§!, £exotic_gases£§Y[Root.tiyanki_calf_gas]§!\n§Y[Root.tiyanki_hatchling_kills]§! §HTiyanki Hatchlings:§! £energy£§Y[Root.tiyanki_hatchling_credits]§!, £exotic_gases£§Y[Root.tiyanki_hatchling_gas]§!\n§Y[Root.tiyanki_ox_kills]§! §HTiyanki Oxen:§! £energy£§Y[Root.tiyanki_ox_credits]§!, £exotic_gases£§Y[Root.tiyanki_ox_gas]§!"
 galactic_features.385.a:0 "Những chiến tích tuyệt vời."
 harvested_tiyanki:0 "Tiyanki Đã Thu Hoạch:"
 harvested_cows:2 "§Y[Root.tiyanki_cow_kills]§! §HTiyanki Cái:§!\n"
 harvested_bulls:2 "§Y[Root.tiyanki_bull_kills]§! §HTiyanki Đực:§!\n"
 harvested_calves:2 "§Y[Root.tiyanki_calf_kills]§! §HTiyanki Con:§!\n"
 harvested_hatchlings:2 "§Y[Root.tiyanki_hatchling_kills]§! §HTiyanki Sơ Sinh:§!\n"
 harvested_oxes:0 "§Y[Root.tiyanki_ox_kills]§! §HTiyanki Trưởng Thành:§!\n"
 galcom.110.desc:1 "Các quan chức từ Cộng Đồng Ngân Hà đã nhận được tin tức về chiến thắng gần đây của chúng ta trước Tiyanki Đầu Đàn. Họ đã thông báo rằng việc chúng ta tiêu diệt quái thú này là một sự vi phạm rõ ràng Đạo Luật Bảo Tồn Tiyanki, bất kể bản tính thù địch của Tiyanki Đầu Đàn.\n\n[Root.GetName] sẽ bị coi là §RVi Phạm Luật Ngân Hà§! trong mười năm tới. Ngoài ra, chúng ta đã bị phạt một khoản tiền nặng vì đã giết hại \"một dạng sống Tiyanki độc nhất vô nhị mà ngân hà sẽ không bao giờ được chứng kiến lần thứ hai.\""
 galcom.110.a:0 "Nó buộc phải bị tiêu diệt."
 galcom.110.b:0 "Nhưng... nhưng nó đã tấn công chúng tôi trước!"
 galcom.110.c:0 "Con quái thú đó đáng phải chết."
 opinion_killed_tiyanki_fleet_1:0 "Đồ Tể Tiyanki"
 opinion_killed_tiyanki_fleet_2:0 "$opinion_killed_tiyanki_fleet_1$"
 opinion_killed_all_tiyanki_1:0 "Đẩy Tiyanki Tới Chỗ Tuyệt Chủng"
 opinion_killed_all_tiyanki_2:0 "$opinion_killed_all_tiyanki_1$"
 opinion_killed_all_tiyanki_3:0 "$opinion_killed_all_tiyanki_1$"
 27_HOSTILE_GREETING:0 "Những cuộc tấn công dã man của các ngươi nhằm vào loài Tiyanki là những tội ác không thể tha thứ. Một ngày nào đó, sẽ có sự trừng phạt thích đáng."
 25_NEUTRAL_GREETING:0 "Hành vi giết hại bừa bãi những sinh vật Tiyanki không có khả năng tự vệ của các ngươi đã không qua được mắt thiên hạ."
 25_FRIENDLY_GREETING:0 "Loài Tiyanki chưa bao giờ là một mối đe dọa... điều gì có thể thúc đẩy các bạn tấn công chúng chứ?"


 ### Tiyanki Space Graveyard System by Giada Zavarise ###

 ## Event chain
 tiyanki_graveyard_chain_title:0 "Nghĩa Địa Tiyanki"
 tiyanki_graveyard_chain_desc:0 "Một hành tinh được bao phủ hoàn toàn bởi xác chết của loài Tiyanki đã được tìm thấy tại hệ sao §H[tiyanki_graveyard_system.GetName]§!. Để nghiên cứu bãi chôn cất bất thường này, trước tiên chúng ta phải đối phó với những kẻ gác mộ của nó."

 ## Special project
 TIYANKI_LURE:0 "Mồi Nhử Tiyanki"
 TIYANKI_LURE_DESC:0 "Tiyanki ăn khí gas. Bằng cách xây dựng một trạm khuếch tán khí, chúng ta có thể nhử những con Tiyanki đang đóng quân tại hệ sao §H[tiyanki_graveyard_system.GetName]§! ra ngoài và tiếp cận bãi chôn cất của chúng."
 gas_diffuser:0 "Mồi Nhử Tiyanki"
 gas_diffuser_desc:0 "Trạm này giải phóng các đám mây khí giàu dinh dưỡng, đánh lạc hướng những con Tiyanki gác mộ khỏi nhiệm vụ của chúng."

 ## Point of Interest
 tiyanki_graveyard_poi_title:0 "Tiêu Diệt Những Kẻ Gác Mộ Tiyanki"
 tiyanki_graveyard_poi_desc:0 "Tiêu diệt những con Tiyanki đóng quân tại hệ sao §H[tiyanki_graveyard_system.GetName]§! để tiếp cận bãi chôn cất của chúng."

 ## Events

 # Surveyed Tiyanki Graveyard System - What to do now?
 galactic_features.387.name:0 "Những Kẻ Gác Mộ"
 galactic_features.387.desc:0 "Hành vi của những con Tiyanki cư trú tại hệ sao §H[tiyanki_graveyard_system.GetName]§! không khớp với các quy luật tập tính đã biết của giống loài này. Trong khi Tiyanki thường sống du mục, những đàn này lại đóng chốt xung quanh một hành tinh được bao phủ hoàn toàn bởi xác đồng loại của chúng.\n\nCác nỗ lực nghiên cứu bãi chôn cất đã bị cản trở bởi mạng lưới xúc tu mà Tiyanki quấn quanh hành tinh, khiến việc nghiên cứu sâu hơn là bất khả thi - trừ khi chúng ta sẵn sàng xua đuổi hoặc tiêu diệt những kẻ gác mộ."
 galactic_features.387.a:0 "Tiyanki chỉ là con mồi dễ dãi. Hãy tiêu diệt chúng."
 galactic_features.387.b:0 "Xua đuổi những kẻ gác mộ mà không làm hại chúng."

 # Tiyanki Graveyard - Destroyed Gravekeepers
 galactic_features.388.name:0 "Ngôi Mộ Bị Xúc Phạm"
 galactic_features.388.desc:1 "Sau khi tiêu diệt những con Tiyanki đóng quân tại [FromFrom.System.GetName], các [Root.Owner.GetScientistPlural] của chúng ta giờ đây có thể tiếp cận bãi chôn cất một cách an toàn để tiến hành nghiên cứu."

 # Tiyanki Graveyard - Lured Gravekeepers
 galactic_features.389.name:0 "Mồi Ngon Miệng"
 galactic_features.389.desc:0 "Việc chế tạo mồi nhử Tiyanki tại hệ sao §H[tiyanki_graveyard_system.GetName]§! đã hoàn tất. Bị mê hoặc bởi những luồng khí dinh dưỡng tỏa ra từ trạm khuếch tán, những kẻ gác mộ đã bị nhử ra khỏi vị trí của chúng, cho phép các [Owner.GetScientistPlural] của chúng ta lách qua các xúc tu của chúng và tiếp cận bãi chôn cất mà không bị phát hiện."

 # Survey - no communication with the Tiyanki
 galactic_features.384.name:0 "Những Người Bảo Vệ Bí Ẩn"
 galactic_features.384.desc:0 "Một số lượng lớn §H[tiyanki_no_contact.GetName]§! đang tụ tập xung quanh một hành tinh được bao phủ bởi xác chết của một dạng sinh vật ngoài hành tinh nào đó.\n\nDo không có thông tin về những thực thể ngoài hành tinh đó, chúng ta chỉ có thể suy đoán về hành vi của chúng."
 galactic_features.384.tooltip:0 "Thiết lập liên lạc ngoại giao đầu tiên với §H[tiyanki_no_contact.GetName]§! để tìm hiểu thêm."

 ## Anomaly
 TIYANKI_ASTEROID_CAT:0 "Tiểu Hành Tinh Sống"
 TIYANKI_ASTEROID_CAT_DESC:0 "Các mẫu đá thu thập từ vành đai tiểu hành tinh bất ngờ chứa một lượng lớn mô sinh học."

 # Anomaly result
 anomaly.7100.name:0 "Nghĩa Địa Lơ Lửng"
 anomaly.7100.desc:0 "Những gì các [Owner.GetScientistPlural] của chúng ta thoạt đầu nhầm tưởng là các tiểu hành tinh thực chất là những xác chết đông lạnh, bầm dập của loài Tiyanki. Toàn bộ vành đai tiểu hành tinh này thực chất là một bãi chôn cất lộ thiên. Một số xác chết mới xuất hiện gần đây và vừa bắt đầu phân hủy, trong khi những xác khác đã có niên đại hàng nghìn năm, thậm chí còn lâu đời hơn cả đế chế của chúng ta."
 anomaly.7100.alt.desc:0 "Những gì các [Owner.GetScientistPlural] của chúng ta thoạt đầu nhầm tưởng là các tiểu hành tinh thực chất là những xác chết đông lạnh, bầm dập của quần thể sinh vật ngoại lai, có hình dáng tương đối trùng khớp với những sinh vật lạ lang thang trong hệ sao. Toàn bộ vành đai tiểu hành tinh này thực chất chỉ là một bãi chôn cất lộ thiên. Một số xác chết chúng ta thu thập được vừa mới tử vong, trong khi những xác khác có niên đại trước cả đế chế của chúng ta hàng nghìn năm."

 ## Archeological site
 site_tiyanki_graveyard:0 "Gò Mộ Tiyanki"
 site_tiyanki_graveyard_intro:0 "Bề mặt của [From.Planet.GetName] được bao phủ hoàn toàn bởi xác chết của loài Tiyanki. Cảm biến của chúng ta không phát hiện dấu hiệu sự sống, vậy mà những cái xác vẫn quằn quại và ngọ nguậy, như thể được tiếp sinh lực bởi một lực lượng khôn lường nào đó."

 ancrel.14100.name:0 "Quả Cầu Thịt"
 ancrel.14100.desc:0 "Thật khó để xác định liệu [From.Planet.GetName] có thực sự là một hành tinh hay không: các mũi khoan thăm dò ban đầu chỉ phát hiện hết lớp mô sinh học này đến lớp mô sinh học khác. Theo ước tính, sẽ cần tới 2.435.463 xác Tiyanki để tạo ra khối lượng hành tinh cỡ này (với biên độ sai số là 5,3%). Ngay cả khi giả định có một lõi đá làm nền cho các lớp xác chồng chất lên nhau, số lượng mẫu vật liên quan vẫn là một con số khổng lồ.\n\nLiệu có ai đó hoặc thứ gì đó đã mang Tiyanki đến đây để chết, hay chúng tự nhiên bị thu hút đến nơi này khi giờ khắc cuối cùng cận kề?"
 ancrel.14100.necro.desc:0 "$ancrel.14100.desc$ Điều quan trọng nhất là: tại sao các Pháp Sư Chiêu Hồn của chúng ta không thể hồi sinh chúng? Tại sao đống thịt chết này lại từ chối chúng ta, như thể đã bị một thực thể khác điều khiển?"

 ancrel.14200.name:0 "Ba Phần Đã Chết"
 ancrel.14200.desc:0 "Sự... sống động bất thường của những xác chết Tiyanki bao phủ bề mặt [From.Planet.GetName] dường như là tác dụng phụ của khả năng tái tạo của chúng: ngay cả khi về mặt kỹ thuật đã chết, các thi thể vẫn đang tự tái tổ chức lại. Hệ sao này giàu có bất thường những chất dinh dưỡng thường thấy ở các hành tinh khí khổng lồ nơi Tiyanki kiếm ăn. Có lẽ điều đó giải thích tại sao hành vi này chưa từng được quan sát thấy trước đây.\n\nPhát hiện này không giải thích được tại sao những xác chết dường như di chuyển như thể bị điều khiển bởi một tâm trí duy nhất, vươn xúc tu ra để ôm lấy những xác chết mới rơi xuống hành tinh.\n\nCác cuộc khai quật tiếp theo hy vọng sẽ mang lại những hiểu biết mới về cơ chế bên trong của... nơi này. Hoặc sinh vật này. Các [Owner.GetScientistPlural] của chúng ta vẫn còn bất đồng về danh pháp chính xác."

 ancrel.14300.name:0 "Mê Cung Bằng Thịt"
 ancrel.14300.desc:0 "Các cuộc khai quật của chúng ta đã phát hiện ra một mạng lưới đường hầm phức tạp trải dài dưới bề mặt của [From.Planet.GetName]. Phân tích hóa học xác nhận các bức tường được cấu tạo hoàn toàn từ các mô Tiyanki bị nén chặt, thịt vẫn còn ấm và hầu như không phân hủy mặc dù có niên đại ngang ngửa với tuổi đời đế chế của chúng ta. Cứ như thể những cái xác đã hòa vào nhau, được định hình lại và sửa đổi để tạo thành nơi này... Nhưng tại sao?"

 ancrel.14400.name:0 "Những Đường Hầm Bị Ám"
 ancrel.14400.desc:0 "Sau khi lập bản đồ mạng lưới ngầm rộng lớn của [From.Planet.GetName], các [Owner.GetScientistPlural] của chúng ta nhận ra các đường hầm rất khớp với cấu trúc hệ mạch máu của loài Tiyanki - nhưng ở quy mô cấp hành tinh.\n\nNhững bức tường rung động phát ra hơi ấm nhẹ, nhiệt độ tăng dần khi đoàn thám hiểm tiến gần đến lõi hành tinh - nơi máy quét của chúng ta đã thu được một tín hiệu sự sống mờ nhạt."
 ancrel.14400.matriarch.desc:0 "Sau khi lập bản đồ mạng lưới ngầm rộng lớn của [From.Planet.GetName], các [Owner.GetScientistPlural] của chúng ta nhận ra các đường hầm rất khớp với cấu trúc hệ mạch máu của loài Tiyanki - nhưng ở quy mô tương đương với Tiyanki Đầu Đàn mà chúng ta từng chạm trán khi du hành giữa các vì sao.\n\nNhững bức tường rung động phát ra hơi ấm nhẹ, nhiệt độ tăng dần khi đoàn thám hiểm tiến gần đến lõi hành tinh - nơi máy quét của chúng ta đã thu được một tín hiệu sự sống mờ nhạt."

 ancrel.14510.name:0 "Bộ Não Mẹ"
 ancrel.14510.desc:0 "Trong một khoang ngầm rộng lớn, một con Tiyanki đứng thẳng, cái đầu hình chuông lắc lư nhẹ, những xúc tu mỏng như sợi thép trải dài trên sàn để kết nối với các bức tường ngoài của khoang. Nó dường như là một bộ phận chỉ huy, điều khiển và định hướng sự phát triển của nghĩa địa quy mô cấp hành tinh này.\n\nCác [Owner.GetScientistPlural] của chúng ta không thể xác định loại sinh vật nào sẽ trỗi dậy từ quá trình nghiệt ngã này, và khi nào nó sẽ thức tỉnh, nhưng có một điều chắc chắn: nó sẽ là một thứ gì đó to lớn và khủng khiếp hơn nhiều so với một con Tiyanki thông thường."
 ancrel.14510.matriarch.desc:0 "Trong một khoang ngầm rộng lớn, một con Tiyanki đứng thẳng, cái đầu hình chuông lắc lư nhẹ, những xúc tu mỏng như sợi thép trải dài trên sàn để kết nối với các bức tường ngoài của khoang. Nó dường như là một bộ phận chỉ huy, điều khiển và định hướng sự phát triển của nghĩa địa quy mô cấp hành tinh này.\n\nCác [Owner.GetScientistPlural] của chúng ta không biết khi nào quá trình này sẽ kết thúc, nhưng tin rằng một khi sinh vật thức tỉnh, nó sẽ là một thứ gì đó to lớn và khủng khiếp hơn nhiều so với một con Tiyanki bình thường: một thứ xứng đáng được gọi là một §HTiyanki Đầu Đàn§! mới."

 ancrel.14510.a:0 "Thật đáng kinh ngạc."
 ancrel.14510.b:0 "Tiêu diệt nó trước khi nó kịp thức giấc."
 ancrel.14510.c:0 "Hãy để nó phát triển. Ta sẽ đợi."
 ancrel.14510.d:0 "Một sinh vật như thế phải bị ngăn chặn bằng mọi giá."
 ancrel.14510.e: "Kỳ quan của thiên nhiên không bao giờ ngừng làm ta kinh ngạc."

 ancrel.14520.name:0 "Lưu Lượng Khí Mở Rộng"
 ancrel.14520.desc:0 "Mặc dù những nỗ lực phân tích các chất tiết của bộ não chỉ huy đã thất bại trong việc giải mã bản chất chính xác của quá trình ấp trứng của nó, các mẫu khí thu được từ buồng ngầm đã cung cấp thông tin vô giá cho các nhà nghiên cứu của chúng ta. Sự hiểu biết ngày càng tăng của chúng ta về các dòng khí trong hệ sao này đã cho phép chúng ta tăng sản lượng khai thác các chất khí hữu ích từ các hành tinh khí khổng lồ."

 ancrel.14910.name:0 "Mô Tái Tạo Của Tiyanki"
 ancrel.14910.desc:1 "Một thành viên của đội thám hiểm chúng ta đã mất tích trong khi khám phá đường hầm. Đội tìm kiếm đã mất nhiều ngày để định vị [Owner.GetScientist], chỉ để phát hiện họ bị bọc một phần trong bức tường, cơ thể bị các xúc tu quấn chặt.\n\nViệc giải cứu [Owner.GetScientist] đã tốn rất nhiều thời gian và công sức. [Owner.GetScientist] không đơn thuần bị trói: bức tường đang cố dung hợp với [Owner.GetScientist] ở cấp độ phân tử, biến họ thành một phần của bề mặt.\n\n[Owner.GetScientist] hiện ở tình trạng ổn định, nhưng từ chối rời khỏi tàu khoa học của chúng ta - và ngay cả ở đó, họ vẫn liên tục nhìn chằm chằm vào các bức tường với vẻ cực kỳ nghi ngờ như thể sợ hãi một cuộc tấn công khác."
 ancrel.14910.b.evopred: "Nghiên cứu về các mẫu mô sống thu thập được từ nghĩa địa Tiyanki đã tạo ra một bước đột phá lớn trong nghiên cứu về quá trình tái tạo tế bào: các [Owner.GetScientistPlural] của chúng ta đã có thể điều chỉnh các cơ chế tái sinh của sinh vật này để sửa chữa cấu trúc di truyền của công dân chúng ta một cách hiệu quả hơn."

 ### Amoebas by Pierre du Plessis ###

 galactic_features.500.name:0 "Bãi Sinh Sản"
 galactic_features.500.desc.base:0 "Hệ sao [From.GetName] thoạt nhìn mang lại ấn tượng thù địch sâu sắc: không có hành tinh nào có thể sinh sống được, hoặc bị thiêu rụi bởi sức nóng chói chang của ba mặt trời trong hệ hoặc bị tước đoạt sự sống bởi những cơn bão mặt trời dữ dội. Tuy nhiên, có một dạng sống dường như phát triển mạnh mẽ trong môi trường này - trùng biến hình không gian. Từ bỏ lối sống khá đơn độc thường ngày, chúng tụ tập với số lượng lớn, bay lượn qua lại giữa khu vực bên trong hệ sao nóng rát và hành tinh khí khổng lồ ở xa hơn trong những gì dường như là một nghi thức sinh sản tinh vi."
 galactic_features.500.desc:0 "$galactic_features.500.desc.base$\n\nKhông rõ điều gì có thể khiến các trùng biến hình ưa chuộng hệ sao khắc nghiệt này đến vậy. Dù sao đi nữa, chúng dường như quyết tâm bảo vệ nó, và đã chĩa các roi roi về phía [Root.GetName] một cách đầy đe dọa."
 galactic_features.500.desc.peaceful:0 "$galactic_features.500.desc.base$\n\nKhông rõ điều gì có thể khiến các trùng biến hình ưa chuộng hệ sao khắc nghiệt này đến vậy. Tuy nhiên, may mắn thay, chúng dường như bằng lòng chia sẻ nó với chúng ta, và không có động thái thù địch nào đối với [Root.GetName]."
 galactic_features.500.alt.desc:0 "Hệ sao [From.GetName] thoạt nhìn mang lại ấn tượng thù địch sâu sắc: không có hành tinh nào có thể sinh sống được, hoặc bị thiêu rụi bởi sức nóng của ba mặt trời trong hệ hoặc bị tước đoạt sự sống bởi các cơn bão mặt trời dữ dội. Tuy nhiên, bất chấp tất cả những điều này, nó dường như là nơi sinh sống của một số lượng lớn các sinh vật không gian khổng lồ chưa từng được biết đến trước đây, từng đàn trong số đó bay lượn giữa khu vực bên trong thiêu đốt và hành tinh khí lớn xa hơn trong những gì trông như một nghi lễ sinh sản phức tạp.\n\nKhông rõ sức hút nào mà hệ sao này có thể mang lại cho những sinh vật này. Dù sao thì chúng dường như có ý định bảo vệ nó, và đã quay về phía chúng ta, tiến tới gần [Root.GetName] theo cách thức đe dọa rõ rệt."

 galactic_features.502.name:0 "Những Kẻ Mới Đến Tại [FromFrom.GetName]"
 galactic_features.502.desc:0 "Một bầy Trùng Biến Hình Không Gian lớn đã tách khỏi bầy trong hệ sao [amoeba_home_system.GetName] và tự mình lang thang trong ngân hà, tiến vào lãnh thổ của chúng ta tại hệ sao [FromFrom.GetName]. Đúng như tập tính thông thường của những sinh vật này, chúng dường như không thể chịu đựng sự hiện diện của chúng ta và đã bắt đầu tấn công các tiền đồn của chúng ta."
 galactic_features.502.desc.peaceful:0 "Một bầy Trùng Biến Hình Không Gian lớn đã tách khỏi bầy trong hệ sao [amoeba_home_system.GetName] và tự mình lang thang trong ngân hà, và giờ đây có thể được nhìn thấy đang băng qua hệ sao [FromFrom.GetName] với số lượng ấn tượng. May mắn thay, chúng ta đã khám phá ra bí mật để chung sống hòa bình với những sinh vật hùng vĩ này, vì vậy chúng ta không cần phải quá lo lắng về các hoạt động của chúng."
 galactic_features.502.alt.desc:0 "Một đàn lớn các sinh vật không gian đã tách khỏi đàn trong hệ sao [amoeba_home_system.GetName] và tự mình lang thang trong ngân hà, đưa chúng vào lãnh thổ của chúng ta. Chúng dường như không thể dung thứ cho sự hiện diện của chúng ta và đã bắt đầu tấn công các tiền đồn của chúng ta tại hệ sao [FromFrom.GetName]."

 ### Space Storm by Henrik Thyrwall ###

 galactic_features.402.name:0 "Bão Không Gian Đã Đổ Bộ"
 galactic_features.402.desc:0 "Một cơn bão hạ không gian dữ dội đã hình thành trên một phần rộng lớn của ngân hà! Di chuyển qua siêu không gian đã trở nên vô cùng nguy hiểm và các nhà khí tượng học của chúng ta tin tưởng rằng cơn bão sẽ tự tan trong vòng 5 đến 10 năm tới. Cho đến lúc đó, cơn bão sẽ gây suy giảm nghiêm trọng động cơ dưới tốc độ ánh sáng, máy tạo khiên và các hệ thống cảm biến trên tất cả các hệ sao bị ảnh hưởng."
 galactic_features.402.a:0 "Chuyện này rồi cũng sẽ qua."
 galactic_features.404.name:0 "Bão Không Gian Tan Biến"
 galactic_features.404.desc:0 "Nhanh chóng như khi nó xuất hiện, cơn bão không gian ảnh hưởng đến phần lớn ngân hà đã hoàn toàn tan biến. Các hệ thống tàu thuyền sẽ không còn bị suy giảm ở những hệ sao nơi các nhiễu loạn hạ không gian từng biểu hiện.\n\nMặc dù một số người suy đoán rằng những cơn bão như thế này có thể dẫn đến sự sụp đổ cuối cùng của mạng lưới siêu không gian hàng nghìn năm trong tương lai, nhưng hiện tại việc du hành vũ trụ dường như đã trở lại bình thường."
 galactic_features.405.name:0 "Bão Không Gian [storm_name.GetFirstName] Đổ Bộ"
 galactic_features.405.desc:0 "$galactic_features.402.desc$\n\nCộng Đồng Ngân Hà đã chính thức đặt tên cho cơn bão này là §H\"[storm_name.GetFirstName]\"§! và đưa ra cảnh báo du hành chung."
 galactic_features.406.name:0 "Bão Không Gian [storm_name.GetFirstName] Tan Biến"
 galactic_features.406.desc:0 "Nhanh chóng như khi xuất hiện, §HBão Không Gian [storm_name.GetFirstName]§! đã hoàn toàn tan biến. Các hệ thống tàu thuyền sẽ không còn bị suy giảm ở những hệ sao nơi các nhiễu loạn hạ không gian từng biểu hiện.\n\nMặc dù một số người suy đoán rằng những cơn bão như [storm_name.GetFirstName] có thể dẫn đến sự sụp đổ cuối cùng của mạng lưới siêu không gian hàng nghìn năm trong tương lai, hiện tại việc du hành không gian dường như đã trở lại bình thường."
 galactic_features.421.name:0 "VLUUR"
 galactic_features.421.desc:0 "Một thực thể hạ không gian cực kỳ mạnh mẽ đã được chạm trán tại hệ sao §H[From.From.From.GetName]§!. Nó không có vẻ thù địch và thậm chí có thể không nhận thức đầy đủ về tàu vũ trụ thông thường, nhưng sự hiện diện đơn thuần của nó tại [From.From.From.GetName] đang gây ra những nhiễu loạn hạ không gian khổng lồ trong toàn bộ hệ sao.\n\nNhững nhiễu loạn này mang tính cục bộ xung quanh chính thực thể và sẽ biến mất khi nó rời khỏi hệ sao. Mặc dù nó không phản hồi các tín hiệu liên lạc, thực thể liên tục phát ra một chuỗi xung tachyon phức tạp dường như là một dạng ngôn ngữ. Nếu phần mềm dịch thuật của chúng ta chính xác, nó đang lặp đi lặp lại rằng:\n\n§H\"VLUUR tìm kiếm. VLUUR tìm thấy.\"§!"
 galactic_features.421.a:0 "Điều này sẽ gây nhiễu các hệ thống tàu."
 galactic_features.423.name:0 "Sự Kết Thúc Của VLUUR"
 galactic_features.423.desc:0 "Trong suốt trận chiến với lực lượng của chúng ta tại hệ sao §H[vluur_system.GetName]§!, thực thể hạ không gian §H\"VLUUR\"§! đã tăng tần số phát ra các xung tachyon, nhưng thông điệp lặp đi lặp lại bất tận vẫn không đổi:\n\n§H\"VLUUR tìm kiếm. VLUUR tìm thấy.\"§!\n\nKhi đòn kết liễu cuối cùng được tung ra, thực thể đã phát nổ trong một vụ nổ khổng lồ rải rác vật chất tối khắp hệ sao."
 galactic_features.423.a:0 "Chúng ta sẽ thu thập những gì có thể."
 galactic_features.423.tooltip:0 "Các trữ lượng Vật Chất Tối được rải rác trên một số thế giới trong hệ sao [vluur_system.GetName]."

 ### Pirates: The Bemat Thalassocracy by Gemma Thomson ###

 pirate.155.name:0 "Cuộc Phong Tỏa Của Toán Cướp Tại [thalassocracy_target_system.GetName]"
 name_thalassocracy_agency:0 "Cục Hải Quan và Tiếp Nhận Ngoại Vi"
 name_thalassocracy_agency_abbreviated:0 "ECA"
 pirate.155.desc.regular:1 "Gửi các đại diện của [root.GetName]: $pirate.155.proclamation$\n\nĐôi khi các đợt kiểm tra hải quan này có thể gây căng thẳng. Chúng tôi hiểu. Hãy hợp tác, và không ai phải chịu tổn thương. Và xin hãy yên tâm rằng từng hạt lương thực và quặng mỏ mà chúng tôi chính thức thu giữ sẽ được sử dụng hiệu quả trong kế hoạch phát triển cư trú sinh thái của [thalassocracy_species.GetName]. Chúng tôi rất biết ơn sự chu đáo của các bạn.\n\n$pirate.155.thalassocracy_signoff$"
 pirate.155.desc.machine:0 "Gửi cấu trúc đại diện của [root.GetName]: một lệnh phong tỏa hiện đang có hiệu lực tại [thalassocracy_target_system.GetName]. Bất kỳ và tất cả các đơn vị máy móc trong khu vực này từ nay trở đi là thần dân của [thalassocracy_country.GetName]; chúng sẽ được sử dụng để phục vụ chúng tôi. Các hạm đội kháng cự sẽ bị khai hỏa.\n\nChúng tôi ghi nhận rằng hoạt động này có thể gây ra sự bất tiện về vật chất cho các bạn. Chúng tôi đảm bảo rằng nó sẽ kết thúc một khi các sĩ quan $name_thalassocracy_agency$ của chúng tôi hoàn thành chỉ tiêu được giao. Chắc chắn các bạn có thể thấu hiểu áp lực từ một chỉ thị như của chúng tôi.\n\nMột ý thức sứ mệnh xứng đáng đang chờ đón các drone được tái lập trình của các bạn trong kế hoạch phát triển cư trú sinh thái của [thalassocracy_species.GetName]. $pirate.155.thalassocracy_signoff$"
 pirate.155.desc.hive:0 "Gửi thực thể đại diện của [root.GetName]: $pirate.155.proclamation$\n\nĐôi khi các đợt kiểm tra hải quan này có thể gây căng thẳng. Chúng tôi hiểu. Hãy hợp tác, và không một [root.GetIndividualNamePlural] nào phải chịu tổn thương hay bất tiện. Và xin hãy yên tâm rằng từng hạt lương thực và quặng mỏ mà chúng tôi thu giữ sẽ tìm được ngôi nhà tốt đẹp trong kế hoạch phát triển cư trú sinh thái của [thalassocracy_species.GetName]. Chúng tôi rất biết ơn sự cân nhắc thấu đáo mang tính tập thể của các bạn.\n\n$pirate.155.thalassocracy_signoff$"
 pirate.155.proclamation:0 "một lệnh phong tỏa tạm thời hiện đang có hiệu lực tại [thalassocracy_target_system.GetName]. Việc xử lý và vận chuyển lương thực và khoáng sản qua hệ sao này hiện phải chịu sự tịch thu của các sĩ quan $name_thalassocracy_agency$ thuộc [thalassocracy_country.GetName]. Mọi tàu phi thương mại sẽ bị yêu cầu quay đầu, nếu không sẽ bị khai hỏa. Các điều kiện này sẽ duy trì hiệu lực cho đến khi các chỉ tiêu $name_thalassocracy_agency_abbreviated$ của chúng tôi được đáp ứng."
 pirate.155.thalassocracy_signoff:0 "Vì một tương lai tự lực tươi sáng hơn!"
 pirate.155.a:0 "Trơ tráo thật. Đuổi chúng đi!"
 pirate.155.b:0 "Các ngươi sẽ phải hối hận vì điều này, lũ cặn bã [thalassocracy_species.GetAdj]."
 pirate.155.pacifist:0 "Chúng tôi sẵn sàng đáp ứng yêu cầu của các bạn. Chỉ cần đừng làm hại ai."
 pirate.155.machine:0 "Yêu cầu tài nguyên đã được phê duyệt. Xin vui lòng không can thiệp vào các đơn vị của chúng tôi."
 pirate.155.corp:0 "Một nước đi táo bạo đấy, lũ [thalassocracy_species.GetAdj]. Dại dột, nhưng táo bạo."
