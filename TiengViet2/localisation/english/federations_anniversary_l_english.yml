 edict_expanded_breeding_program_tooltip:0 "Các hành tinh có §Y$building_spawning_pool$§! nhận §G+10%§! §YTăng Trưởng Dân Cư§!."

 edict_expanded_breeding_program_servitor:0 "$edict_expanded_breeding_program$"
 edict_expanded_breeding_program_servitor_desc:0 "Sử dụng trò chơi hóa và các cơ chế khen thưởng dựa trên điểm số, chúng ta sẽ khéo léo khuyến khích các Vật Phẩm Sinh Học lấp đầy các Khu Bảo Tồn Hữu Cơ của chúng ta."
