 edict_industrial_subsidies:0 "Trợ Cấp Công Nghiệp"
 edict_industrial_subsidies_desc:0 "Thành công có thể được đo lường bằng việc thu được của cải vật chất. Sắc Lệnh này cung cấp cho các nhà máy của chúng ta thêm tài nguyên để tăng sản lượng."
