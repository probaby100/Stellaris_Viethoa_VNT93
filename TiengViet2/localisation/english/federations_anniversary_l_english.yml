 hegemony_propaganda_authoritarian:0 "$hegemony_propaganda_militarist$"
 hegemony_propaganda_authoritarian_desc:0 "Kẻ Thống Trị của Liên Bang chúng ta đang truyền bá các giá trị độc tài chuyên chế vào quốc gia chúng ta."
 hegemony_joint_operation_project_in_progress:0 "Đóng Góp Xây Đài Tưởng Niệm Liên Bang"

 ### Militarist Joint Operation by Pierre du Plessis ###

 federations2.100.name:0 "Hạm Đội Liên Bang"
 federations2.100.desc:0 "[Root.Federation.GetName] đại diện cho một lực lượng hùng mạnh trên vũ đài ngân hà; tuy nhiên, các hạm đội của nó đang bị phân tán và vận hành dưới các cấu trúc tổ chức khác biệt nhau. Gần đây, một số chuyên gia quân sự có tầm ảnh hưởng từ khắp liên bang đã nêu lên mối quan ngại về năng lực của chúng ta trước một kẻ thù được phối hợp bài bản và hùng mạnh.\n\nĐể khắc phục điều này, họ đã vạch ra các kế hoạch cho một loạt các cuộc tập trận quân sự trên toàn liên bang nhằm xây dựng sự gắn kết trong quân đội và rèn giũa kỹ năng cho các thủy thủ đoàn. Theo kế hoạch của họ, các phân đội từ mỗi hạm đội của chúng ta sẽ di chuyển đến các địa điểm cụ thể trên lãnh thổ của các đồng minh và thực hiện một loạt các thao diễn phức tạp, phối hợp với các hạm đội tham gia khác để đảm bảo các hoạt động được tiến hành đồng thời. Việc tổ chức thành công các cuộc diễn tập này sẽ là một cam kết đáng kể cho các lực lượng vũ trang nhưng sẽ nâng cao rõ rệt khả năng sẵn sàng chiến đấu của liên bang chúng ta."
 federations2.100.A.tooltip:0 "Tất cả các quốc gia thành viên sẽ được tiếp cận và yêu cầu tham gia vào các cuộc tập trận.\n\nNếu đề xuất bị từ chối rộng rãi, §HĐộ Gắn Kết§! Liên Bang sẽ giảm và [Root.GetName] sẽ mất §HTầm Ảnh Hưởng§!."
 federations2.100.A:0 "$federations2.50.A$"
 federations2.100.B:0 "Hạm đội của chúng ta đã sẵn sàng cho mọi tình huống bất trắc."
 federations2.101.name:0 "$federations2.100.name$"
 federations2.101.desc:0 "Kính chào các [Root.GetSpeciesNamePluralCompliment] cao quý! Cùng nhau, chúng ta đã xây dựng một lực lượng hùng mạnh đáng gờm trên vũ đài ngân hà. Tuy nhiên, chúng tôi lo ngại rằng điều này có thể là chưa đủ nếu một mối đe dọa hùng mạnh và có sự phối hợp chặt chẽ xuất hiện. Các chuyên gia của chúng tôi đã vạch ra các kế hoạch cho một loạt các cuộc tập trận chung liên bang nhằm xây dựng sự gắn kết trong quân đội và rèn luyện kỹ năng của các thủy thủ đoàn: chúng tôi dự định các phân đội từ mỗi hạm đội sẽ di chuyển đến các địa điểm cụ thể trong lãnh thổ liên bang và thực hiện một loạt các thao diễn phức tạp, phối hợp với các hạm đội tham gia khác để đảm bảo các hoạt động được thực hiện đồng thời.\n\nChúng tôi tự tin rằng các cuộc tập trận này sẽ nâng cao đáng kể mức độ sẵn sàng chiến đấu của liên bang. Các bạn sẽ tham gia vào dự án này chứ?"
 federations2.101.A:0 "$federations2.51.A$"
 military_joint_exercise_potential_tooltip:0 "Hoàn thành các cuộc tập trận chung này sẽ tăng hiệu quả của hạm đội chúng ta và thúc đẩy kinh nghiệm liên bang."
 opinion_military_joint_action_agreed:0 "Đồng Ý Tham Gia Tập Trận Quân Sự Chung"
 federations2.101.B:0 "Chúng tôi không thể trích bất kỳ hạm đội nào cho những trò chơi của các người!"
 federations2.101.B.tooltip:0 "$federations2.51.B.tooltip$"
 opinion_military_joint_action_refused:0 "Bác Bỏ Tập Trận Quân Sự Chung"
 federations2.103.name:0 "Tập Trận Quân Sự Chung Đổ Bể"
 federations2.103.desc:0 "Các đại sứ của chúng ta đã nỗ lực thuyết phục các thành viên của [Root.Federation.GetName] tham gia vào kế hoạch tập trận quân sự chung. Tuy nhiên, thật không may, họ đã vấp phải sự thờ ơ trên diện rộng, các đồng minh của chúng ta thích tin vào sức mạnh của chính họ hơn là tìm cách cải thiện năng lực chung."
 federations2.103.A:0 "Một sự thiếu nhìn xa trông rộng đáng lo ngại."
 federations2.104.name:0 "$federations2.103.name$"
 federations2.104.desc.said_yes:0 "Bất chấp sự ủng hộ của chúng ta đối với sáng kiến của phía [From.GetAdj] nhằm tổ chức các cuộc tập trận quân sự chung liên bang, có vẻ như kế hoạch đã đổ bể. Đơn giản là không có đủ sự ủng hộ dành cho nó giữa các quốc gia thành viên khác."
 federations2.104.desc.said_no:0 "Sự phản đối của chúng ta đối với các kế hoạch của [From.GetAdj] về các cuộc tập trận quân sự chung trong [Root.Federation.GetName] đã mang lại kết quả. Đa số các thành viên thấy không cần thiết phải lãng phí sự chú ý của quân đội vào những việc nhỏ nhặt như vậy."
 federations2.104.A.yes:0 "$federations2.54.A.yes$"
 federations2.104.A.no:0 "Đó chưa bao giờ là một đường hướng hành động hợp lý."
 federations2.105.name:0 "Tập Trận Quân Sự Chung Được Phê Chuẩn"
 federations2.105.desc:0 "Kế hoạch tập trận quân sự chung của chúng ta giữa các thành viên của [Root.Federation.GetName] đã nhận được sự chấp thuận của đa số các đồng minh. Tất cả các thành viên tham gia sẽ bắt đầu chuẩn bị ngay lập tức!"
 federations2.105.A:0 "Cùng nhau, các hạm đội của chúng ta sẽ gieo rắc nỗi sợ hãi vào quân thù!"
 military_join_operation_happens_tooltip:0 "Tất cả các thành viên tham gia khác nhận được một dự án đặc biệt tương tự tại một địa điểm ngẫu nhiên trong lãnh thổ của [Root.Federation.GetName]."
 federations2.106.name:0 "$federations2.105.name$"
 federations2.106.desc.said_yes:0 "Sáng kiến của [From.GetAdj] nhằm tổ chức các cuộc tập trận quân sự chung giữa các hạm đội của các quốc gia thành viên liên bang đã nhận được sự chấp thuận của đa số thành viên. Chúng ta sẽ bắt đầu công tác chuẩn bị ngay lập tức!"
 federations2.106.desc.said_no:0 "Bất chấp sự phản đối của chúng ta, các kế hoạch của [From.GetAdj] nhằm tổ chức các cuộc tập trận quân sự chung giữa các hạm đội của các quốc gia thành viên liên bang đã nhận được sự chấp thuận của đa số thành viên. May mắn thay, [From.GetName] không thể làm gì để ép buộc chúng ta tham gia vào kế hoạch."
 federations2.106.A:0 "$federations2.105.A$"
 federations2.106.B.no:0 "Một sự lãng phí thời gian và năng lượng đáng tiếc."
 military_joint_project:0 "Diễn Tập Hạm Đội Liên Bang"
 military_joint_project_DESC:0 "[Root.Owner.Federation.GetName] đang tổ chức các cuộc diễn tập quân sự chung để tăng cường sự gắn kết trong các lực lượng vũ trang đa dạng của liên minh, cũng như rèn giũa kỹ năng của các thủy thủ đoàn.\n\nCác cuộc diễn tập sẽ bắt đầu ngay khi tất cả các hạm đội liên bang đã vào vị trí."
 federations2.108.name:0 "Chuẩn Bị Diễn Tập Chung Đã Hoàn Tất"
 federations2.108.desc:0 "Chúng ta đã sẵn sàng cho các cuộc tập trận quân sự chung của liên bang. Chúng ta chỉ cần đợi hạm đội của các đồng minh di chuyển vào vị trí trước khi các chiến dịch bắt đầu!"
 federations2.108.tt:0 "Các cuộc tập trận sẽ bắt đầu ngay khi tất cả các hạm đội liên bang đã vào vị trí."
 federations2.108.A:0 "Chúc thượng lộ bình an!"
 federations2.109.name:0 "Tập Trận Quân Sự Chung Bắt Đầu"
 federations2.109.desc:0 "Tất cả các hạm đội liên bang hiện đã vào vị trí, vì vậy các cuộc tập trận huấn luyện có thể bắt đầu! Một nhóm các mục tiêu được trang bị vũ khí nhẹ nhưng có độ cơ động rất cao đã xuất hiện từ một địa điểm ẩn giấu trước đó và đang tìm cách tránh bị các tàu của chúng ta tiêu diệt trước khi hết thời hạn 30 ngày."
 federations2.109.A:0 "Vũ khí đã khóa mục tiêu và sẵn sàng khai hỏa!"
 federations2.112.name:0 "Mục Tiêu Đã Bị Tiêu Diệt Thành Công"
 federations2.112.desc:0 "Chúng ta đã tiêu diệt thành công mục tiêu của mình trong cuộc tập trận quân sự chung. Chúng ta chỉ có thể hy vọng rằng các đồng minh của chúng ta cũng siêng năng như vậy!"
 federations2.113.name:0 "Bắn Trượt Mục Tiêu Huấn Luyện"
 federations2.113.desc:0 "Trước sự hổ thẹn vô bờ bến của các sĩ quan hải quân chúng ta, chúng ta đã không thể tiêu diệt mục tiêu trong cuộc tập trận quân sự chung. Chúng ta chỉ có thể hy vọng rằng các đồng minh của chúng ta đã thành công hơn!"
 federations2.115.name:0 "Tập Trận Quân Sự Chung Hoàn Tất"
 federations2.115.desc.complete_success:0 "Các cuộc tập trận quân sự chung của [Root.Federation.GetName] hiện đã kết thúc. Chúng ngay lập tức được tuyên bố là một thành công vang dội, mỗi hạm đội tham gia đều đã hạ gục mục tiêu của mình mà không gặp khó khăn trở ngại nào, chứng minh dứt khoát kỹ năng xuất sắc và khả năng phối hợp vượt trội của hạm đội liên bang chúng ta! Kẻ thù chắc chắn sẽ phải suy nghĩ kỹ trước khi gây chiến với chúng ta lúc này."
 federations2.115.desc.partial_success:0 "Các cuộc tập trận quân sự chung của [Root.Federation.GetName] hiện đã kết thúc. Chúng được tuyên bố là một thành công một phần: mặc dù không phải bên nào cũng có thể tiêu diệt mục tiêu của họ, hầu hết các hạm đội tham gia đều làm được điều đó, chứng minh rằng hạm đội liên bang có khả năng phối hợp để thực hiện các nhiệm vụ phức tạp. Ngoài ra, các thủy thủ đoàn của chúng ta đã được hưởng lợi rất nhiều từ kinh nghiệm này và hiện đã sẵn sàng chiến đấu hơn bao giờ hết. Kẻ thù chắc chắn sẽ phải đắn đo kỹ trước khi gây hấn với chúng ta."
 federations2.115.desc.partial_failure:0 "Các cuộc tập trận quân sự chung của [Root.Federation.GetName] đã kết thúc theo một cách thức hơi có phần nực cười: mặc dù một số bên tham gia đã bắn trúng mục tiêu, nhưng đa số đã thất bại, làm dấy lên nghi ngờ về khả năng phối hợp hành động của [Root.Federation.GetName] như một lực lượng thống nhất trong các vấn đề quân sự. Chúng ta chỉ có thể hy vọng rằng kẻ thù đã không theo dõi diễn biến quá sát sao..."
 federations2.115.desc.complete_failure:0 "Với việc không một thành viên tham gia nào tiêu diệt được mục tiêu trước khi hết thời gian, các cuộc tập trận quân sự chung của [Root.Federation.GetName] đã kết thúc trong trò hề. Chúng ta chỉ có thể hy vọng rằng kẻ thù đã không quan sát diễn biến quá kỹ lưỡng khi chúng ta tìm cách nhặt nhạnh lại niềm tự hào đã mất và khôi phục phẩm giá cho hạm đội của mình."
 federations2.115.A:0 "Hạm đội của chúng ta sẽ thống trị tối cao!"
 federations2.115.A.haha:0 "Chúng ta có những đồng minh tuyệt vời nhất!"
 federations2.115.B.oh_well:0 "Ít nhất chúng ta cũng đã hoàn thành phần việc của mình."
 federations2.115.B.oh_dear:0 "Chúng ta phải cúi đầu hổ thẹn."
 military_federation_success_modifier:0 "Quân Đội Được Huấn Luyện Bài Bản"
 military_federation_success_modifier_desc:0 "Các cuộc tập trận huấn luyện gần đây do liên bang tổ chức đã thể hiện trình độ kỹ năng cao và khả năng phối hợp tác chiến xuất sắc của các hạm đội chúng ta."
 military_federation_failure_modifier:0 "Quân Đội Bị Bẽ Mặt"
 military_federation_failure_modifier_desc:0 "Quân đội của chúng ta cảm thấy xấu hổ trước màn trình diễn kém cỏi của hạm đội liên bang trong các cuộc tập trận huấn luyện gần đây."
 federations2.120.name:0 "Chấm Dứt Tham Gia Tập Trận Quân Sự Chung"
 federations2.120.desc:0 "Vì chúng ta đã rời khỏi liên bang cũ, sự tham gia của chúng ta vào các cuộc tập trận quân sự chung theo kế hoạch của họ đã bị chấm dứt."
 federations2.121.name:0 "Tập Trận Quân Sự Chung Bị Hủy Bỏ"
 federations2.121.desc:0 "Sự bùng nổ của chiến tranh đã dẫn đến việc hủy bỏ các cuộc tập trận quân sự liên bang đã được lên kế hoạch."
 training_target:0 "Mục Tiêu Huấn Luyện"
 training_target_plural:0 "Các Mục Tiêu Huấn Luyện"
 the_following_nations_failed:0 "\nCác bên tham gia sau đây đã không hoàn thành các bài tập:"

### Spiritualist Joint Operation by Hadrien Buytaers ###

 GetEcumenicalCouncilDebateText1:0 "Liệu Cõi Xuất Thần có phải là một chiều không gian thần thánh?"
 GetEcumenicalCouncilDebateText2:0 "Chỉ có một vị thần độc nhất đa diện hay có nhiều vị thần?"
 GetEcumenicalCouncilDebateText3:0 "Liệu Tinh Thần có tách biệt khỏi Linh Hồn không?"
 GetEcumenicalCouncilDebateText4:0 "Zarqlan thực sự là ai?"
 GetEcumenicalCouncilDebateText5:0 "Cần những điều kiện gì để trở thành một Thế Giới Thánh Địa?"
 GetEcumenicalCouncilDebateText6:0 "Liệu có nên có một người đứng đầu toàn cầu cho một Giáo hội thống nhất?"
 GetEcumenicalCouncilDebateText7:0 "Liệu những người có Năng Lực Tâm Linh có được thần linh chạm đến?"
 GetEcumenicalCouncilDebateText8:0 "Liệu thuế thập phân chỉ nên được dùng cho mục đích từ thiện?"
 GetEcumenicalCouncilDebateText9:0 "Niềm tin cá nhân có phải là cội nguồn của dị giáo?"
 GetEcumenicalCouncilDebateText10:0 "Những hành vi phi thường nào được coi là phép màu?"
 GetEcumenicalCouncilDebateText11:0 "Xét lại Đấng Cứu Thế. Liệu những đấng cứu rỗi của chúng ta chỉ đơn thuần là các nhà tiên tri?"
 GetEcumenicalCouncilDebateText12:0 "Vũ trụ được tạo ra khi nào?"
 GetEcumenicalCouncilDebateText13:0 "Liệu người Zroni có phải là những sứ giả của thần linh?"
 GetEcumenicalCouncilDebateText14:0 "Thần tính ẩn chứa bên trong chúng ta hay nằm ngoài chúng ta?"
 GetEcumenicalCouncilDebateText15:0 "Những phẩm hạnh nào là nền tảng của một tâm hồn thanh khiết?"
 GetEcumenicalCouncilDebateText16:0 "Liệu máy móc có bao giờ được cứu rỗi?"

 federations3.2205.name:0 "Đại Hội Đồng Tôn Giáo Liên Bang"
 federations3.2205.desc:0 "Các thành viên của [Root.Federation.GetName] cùng đoàn kết xung quanh đời sống tâm linh của họ. Chúng ta tìm thấy điểm chung trong thực tế rằng tất cả chúng ta đều là những tín đồ, nhưng liên bang cũng là ngôi nhà của nhiều giáo điều, đức tin và giáo hội khác nhau và việc cùng chung sống đôi khi không hề dễ dàng.\n\nGần đây, các thành viên giáo hội đã thúc đẩy [Root.Federation.GetName] tổ chức một Đại Hội Đồng Tôn Giáo, nơi chúng ta có thể tập hợp lại để cố gắng phác thảo một giáo lý thống nhất, và định nghĩa các tín điều cốt lõi cho niềm tin của chúng ta. Ý tưởng này đã được chấp thuận, và mỗi thành viên của [Root.Federation.GetName] đã được yêu cầu cử đại diện."
 federations3.2205.a:0 "Đặc sứ của chúng ta trong Liên Bang có thể xử lý việc này"
 federations3.2205.b:0 "Thật vô lý. Chỉ cử một phái đoàn tượng trưng thôi."
 federations3.2205.c:0 "Hãy cử một đặc sứ đi!"
 federations3.2205.d:0 "Những thủ tục kỳ quặc này không can hệ gì tới chúng ta."
 federations3.2215.name:0 "Đại Hội Đồng Tôn Giáo: Thần Học Hoàn Hảo"
 federations3.2215.desc:0 "Trong các cuộc tranh luận hôm nay về \"[GetEcumenicalCouncilDebate]\", phái đoàn của chúng ta đã thể hiện tài hùng biện xuất sắc và tính logic không thể lay chuyển, gần như đè bẹp những kẻ tranh luận chống lại quan điểm của chúng ta. Với việc phe đối lập bị dập tắt, một kết luận đã nhanh chóng đạt được nhờ có chúng ta. Các phái đoàn khác mong muốn tôn vinh sự khôn ngoan của chúng ta."
 federations3.2215.a:0 "Chúng ta không tham gia vì danh vọng. Lịch sự từ chối."
 federations3.2215.b:0 "Những kẻ ngốc này sẽ chẳng làm nên trò trống gì nếu không có chúng ta!"
 federations3.2215.c:0 "Cứ như thể mọi chuyện có thể diễn ra theo cách khác vậy!"
 federations3.2220.name:0 "Đại Hội Đồng Tôn Giáo: Tranh Luận Nảy Lửa"
 federations3.2220.desc:0 "Câu hỏi về \"[GetEcumenicalCouncilDebate]\" là một vấn đề tế nhị và nhiều cảm xúc nhạy cảm đã bị tổn thương trong các cuộc thảo luận xung quanh nó. Đặc biệt, phái đoàn của chúng ta tỏ ra cực kỳ cứng đầu và đã bị ghi nhận là lăng mạ một số vị giám mục cấp cao khác từ các đế chế bạn. Họ đã yêu cầu một lời xin lỗi chính thức từ chúng ta."
 federations3.2220.a:0 "Những hành vi như thế này là không thể chấp nhận được. Hãy xin lỗi."
 federations3.2220.b:0 "Toàn một lũ ngu xuẩn! Chúng ta giữ nguyên những gì đã nói."
 federations3.2220.c:0 "Chắc chắn một vài món quà sẽ giúp họ hiểu ra lẽ phải."
 federations3.2225.name:0 "Đại Hội Đồng Tôn Giáo: Vấn Đề Quyền Ưu Tiên"
 federations3.2225.desc:0 "Trước khi thảo luận về chủ đề \"[GetEcumenicalCouncilDebate]\", các phái đoàn lẽ ra phải được một vị giám mục cấp cao hướng dẫn thiền định trong thanh tịnh. Do lịch trình thiếu chính xác, ba vị giáo sĩ xuất chúng đều nghĩ rằng chính họ sẽ là người chủ trì buổi lễ. Tình hình leo thang và những lời cãi vã của họ đã khiến hội đồng bị đình trệ."
 federations3.2225.a:0 "Ai là người tổ chức cái này vậy?! Hội đồng này đúng là một trò hề."
 federations3.2225.b:0 "Hành vi này là không thể chấp nhận được. Đưa ra lời khiển trách chính thức."
 federations3.2225.c:0 "Sắp xếp lại lịch trình để dành cho họ sự chú ý mà họ tìm kiếm."
 federations3.2235.name:0 "Đại Hội Đồng Tôn Giáo: Trao Tặng Quà Cáp"
 federations3.2235.desc:0 "Những cuộc tranh luận gay gắt xoay quanh \"[GetEcumenicalCouncilDebate]\" khiến mọi người kích động và nóng giận. Để xoa dịu tình hình, hội đồng đã quyết định mỗi đế chế sẽ trao tặng những món quà và biểu tượng tình bạn cho các bên khác. Chúng ta nên gửi thứ gì?"
 federations3.2235.a:0 "Gửi những món quà xa hoa lộng lẫy!"
 federations3.2235.b:0 "Một cử chỉ tượng trưng là đủ."
 federations3.2235.c:0 "Tặng họ [GetSpeciesShavings] Hoàng Gia thiêng liêng."
 federations3.2235.d:0 "Không gửi gì cả."
 shavings_hum:0 "Móng Chân"
 shavings_mam:0 "Râu Ria"
 shavings_rep:0 "Vảy Lột"
 shavings_avi:0 "Lông Vũ"
 shavings_art:0 "Vỏ Kitin"
 shavings_mol:0 "Chất Nhầy"
 shavings_fun:0 "Bào Tử"
 shavings_lithoid:0 "Bụi Khoáng"
 shavings_necroid:0 "Mảnh Xương"
 shavings_aquatic:0 "Hàu Biển"
 shavings_plant:0 "Rễ Cây"
 shavings_tox:0 "Chất Keo Dính"
 federations3.2240.name:0 "Đại Hội Đồng Tôn Giáo: Mối Quan Hệ Nguy Hiểm"
 federations3.2240.desc:0 "Cuộc tranh luận quan trọng trong ngày về \"[GetEcumenicalCouncilDebate]\" đột nhiên bị gián đoạn khi một giám mục bước vào, lôi theo hai thành viên của các phái đoàn khác nhau. Họ bị bắt quả tang đang thổ lộ tình yêu bất diệt dành cho nhau, bất chấp những khác biệt của họ. Các đặc sứ bảo thủ coi hành vi của họ là thiếu tôn trọng và gần như dị giáo, vi phạm tính tôn nghiêm của đại hội thánh thiện này."
 federations3.2240.a:0 "Họ là biểu tượng của sự đoàn kết!"
 federations3.2240.b:0 "Họ là nỗi ô nhục!"
 federations3.2240.c:0 "Cho họ một con đường nhanh chóng để hiến tế."
 federations3.2245.name:0 "Đại Hội Đồng Tôn Giáo: Bữa Tiệc Bê Bối"
 federations3.2245.desc:0 "Sau một ngày dài thảo luận về \"[GetEcumenicalCouncilDebate]\", một bữa tiệc đã được tổ chức theo phong tục của một trong các phái đoàn. Như một phần của nghi thức, một loại đồ uống nghi lễ đã được phục vụ cho mọi người. Đối với họ, đó chỉ là chất gây say nhẹ, nhưng phái đoàn của chúng ta lại có phản ứng cực kỳ dữ dội với nó, và ngay sau đó, căn phòng bùng nổ thành một cuộc ẩu đả tập thể. Mọi chuyện đã lắng xuống và không có thương tích lớn nào được báo cáo, nhưng chúng ta bị coi là bên khơi mào cuộc ẩu đả và dự kiến phải đưa ra lời xin lỗi."
 federations3.2245.a:0 "Xin lỗi."
 federations3.2245.b:0 "Đổ lỗi cho đồ uống!"
 federations3.2245.c:0 "Đưa tất cả mọi người đi tĩnh tâm thiền định trên một thế giới lăng mộ."
 federations3.2255.name:0 "Đại Hội Đồng Tôn Giáo: Bất Hòa Thống Trị"
 federations3.2255.desc:0 "Khi quyết định tổ chức hội đồng, chúng ta biết con đường đi đến một giáo điều thống nhất sẽ dài và gian nan, nhưng chúng ta đã đánh giá thấp mức độ dài và gian nan của nó. Nhiều tháng tranh luận vô bổ chẳng mang lại kết quả gì ngoài việc làm nổi bật mọi thứ chia rẽ chúng ta khỏi nhau. Chúng ta đã quyết định đợi một thời gian trước khi thử lại."
 federations3.2260.name:0 "Đại Hội Đồng Tôn Giáo: Hòa Thuận Ngự Trị"
 federations3.2260.desc:0 "Thật sự, chúng ta đã được ban phước. Mọi nỗi lo sợ trước đây của chúng ta đều đã được chứng minh là sai lầm và mọi thứ diễn ra vô cùng suôn sẻ. Nền thần học chuẩn xác và các cuộc đàm đạo đầy cảm hứng đã cho phép chúng ta tạo ra một hệ thống giáo điều mới hài hòa. Chắc chắn chúng ta sẽ xem xét lại sau, nhưng hiện tại, nó sẽ đóng vai trò là nền tảng của một đức tin thống nhất đưa chúng ta đến gần nhau hơn!"
 federations3.2260.tt:1 "Trong 20 năm, §G+20%§! £unity£ Thống Nhất từ công việc và §G+3§! EXP Liên Bang Hàng Tháng"
 federations3.2265.name:0 "Đại Hội Đồng Tôn Giáo: Thành Công Bước Đầu"
 federations3.2265.desc:0 "Nhìn chung, hội đồng đã mang lại hiệu quả. Không phải mọi thứ đều suôn sẻ, nhưng những khó khăn là điều đã được dự đoán trước. Đây mới chỉ là bước đầu tiên hướng tới việc thống nhất người dân và đức tin của chúng ta. Con đường phía trước sẽ còn dài, nhưng những gì đang đón đợi chúng ta ở đích đến sẽ khiến nó trở nên hoàn toàn xứng đáng."
 federations3.2265.tt:0 "Trong 10 năm, §G+10%§! £unity£ Thống Nhất từ công việc và §G+3§! EXP Liên Bang Hàng Tháng"

