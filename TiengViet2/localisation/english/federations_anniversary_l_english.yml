 envoy_events.3.name:0 "Một Đóng Góp Cho Hài Kịch Ngân Hà"
 envoy_events.3.desc.base:0 "[event_envoy.GetName], sứ giả đại diện cho lợi ích của chúng ta tại Cộng Đồng Ngân Hà, đã phạm phải một sai lầm ngoại giao nghiêm trọng khi nhầm lẫn đại biểu [council_country.GetAdj] với một người [pathetic_country.GetSpeciesName]. Thật không may, những lời phát biểu sơ hở đó đã bị nhiều người chứng kiến, và họ liên tục chế giễu [event_envoy.GetName]."
 envoy_events.3.desc:0 "$envoy_events.3.desc.base$ Nhiều người giờ đây đang gièm pha năng lực của đoàn ngoại giao chúng ta, mặc dù sự đóng góp của chúng ta cho khiếu hài hước của ngân hà là không thể bàn cãi."
 envoy_events.3.desc.hive:0 "$envoy_events.3.desc.base$ Nhiều người giờ đây đang gièm pha năng lực của các chu trình tư duy ngoại giao của chúng ta, mặc dù sự đóng góp của chúng ta cho khiếu hài hước của ngân hà là không thể bàn cãi."
 envoy_events.3.desc.machine:0 "$envoy_events.3.desc.base$ Nhiều người giờ đây đang gièm pha năng lực của các hệ thống ngoại giao của chúng ta, mặc dù sự đóng góp của chúng ta cho khiếu hài hước của ngân hà là không thể bàn cãi."
 envoy_events.3.A:0 "Cứ để chúng cười khi còn có thể."
 envoy_events.3.B:0 "Cứ để như vậy đi."
 envoy_events.3.C1:1 "Triệu hồi [event_envoy.GetHerHim] về [Root.Capital.GetName] để tái huấn luyện."
 envoy_events.3.C2:1 "Triệu hồi [event_envoy.GetHerHim] về [Root.Capital.GetName] để tái lập trình."
 envoy_events.3.C3:1 "Triệu hồi [event_envoy.GetHerHim] về [Root.Capital.GetName] để tái điều chỉnh."
 galactic_community_diplo_corps_is_a_joke:0 "Đoàn Ngoại Giao Bị Chế Giễu"
 galactic_community_diplo_corps_is_a_joke_desc:0 "Một trong những đặc sứ của chúng ta đã phạm phải một sai lầm ngoại giao lớn, biến đoàn ngoại giao của chúng ta thành trò cười cho toàn ngân hà."
 envoy_events.4.name:0 "Ngoại Giao Ngân Hà Khôn Khéo"
 envoy_events.4.desc.base:0 "Mặc dù chúng ta chưa thể tự coi mình là một trong những siêu cường thực sự của ngân hà này, chúng ta vẫn thường thể hiện được sức ảnh hưởng vượt xa tầm vóc của mình trong các vấn đề ngân hà. Điều này phần lớn nhờ vào những nỗ lực của sứ giả [event_envoy.GetName], người đã khéo léo đại diện cho lợi ích của chúng ta tại Cộng Đồng Ngân Hà và nhận được sự tôn trọng sâu sắc ngay cả từ những kẻ phản đối kịch liệt mọi điều mà [Root.GetName] đại diện."
 envoy_events.4.desc:0 "$envoy_events.4.desc.base$ Do đó, mặc dù không phải ai cũng khiếp sợ sức mạnh hạm đội hay khao khát kho tàng của chúng ta, họ vẫn ngưỡng mộ sự tài tình của đoàn ngoại giao chúng ta."
 envoy_events.4.desc.hive:0 "$envoy_events.4.desc.base$ Do đó, mặc dù không phải ai cũng khiếp sợ sức mạnh hạm đội hay khao khát tài nguyên vật chất của chúng ta, họ vẫn ngưỡng mộ sự tài tình của các chu trình tư duy ngoại giao của chúng ta."
 envoy_events.4.desc.machine:0 "$envoy_events.4.desc.base$ Do đó, mặc dù không phải ai cũng khiếp sợ sức mạnh hạm đội hay khao khát tài nguyên vật chất của chúng ta, họ vẫn ngưỡng mộ sự tài tình của các hệ thống ngoại giao của chúng ta."
 galactic_community_diplo_corps_respected:0 "Đoàn Ngoại Giao Được Tôn Trọng"
 galactic_community_diplo_corps_respected_desc:0 "Đoàn ngoại giao của chúng ta được các loài hữu tri trong ngân hà tôn trọng rộng rãi."

 envoy_events.5.name:0 "Âm Mưu Ám Sát [event_envoy.GetName]"
 envoy_events.5.desc:0 "Cách thức mà đặc sứ [envoy_source.GetAdj], [event_envoy.GetName], đại diện cho lợi ích của phía [envoy_source.GetAdj] tại [Root.Capital.GetName] vừa gây khó chịu vừa mệt mỏi. Kể từ khi đến đây, [event_envoy.GetSheHe] luôn thể hiện thái độ thù địch với [Root.GetGovernmentName], gần như liên tục phản đối các chính sách và hành động của chúng ta. [event_envoy.GetSheHeCap] phiền toái đến mức hiếm ai buồn phiền nếu chúng ta tống khứ được [event_envoy.GetHerHim], và chúng ta đã nhận được tin đồn rằng một nhóm người trung thành [Root.GetAdj] đang mưu tính đẩy nhanh cái chết của [event_envoy.GetHerHis].\n\nĐể âm mưu này thành công chắc chắn sẽ rất tiện lợi, nhưng để cho các yếu nhân nước ngoài bị ám sát ngay trong lãnh thổ của chúng ta thì e rằng sẽ không hay ho cho lắm."
 envoy_events.5.A:0 "Chúng ta sẽ không hạ mình dùng thủ đoạn đó. Hãy dập tắt âm mưu!"
 envoy_events.5.B:0 "Hãy để chúng ta rảnh tay với tên đặc sứ phiền toái này."
 envoy_events.6.name:0 "Án Mạng Trên [From.Capital.GetName]!"
 envoy_events.6.desc:0 "[event_envoy.GetName] - đặc sứ mà chúng ta cử đi để hòa giải những bất đồng với [From.GetName] - đã bị ám sát! [event_envoy.GetSheHeCap] đã biến mất không dấu vết vài ngày trước, bỏ lỡ buổi liên lạc định kỳ theo lịch trình với hội đồng của [Root.GetRulerTitle]. Sau nhiều ngày tìm kiếm, thi hài của [event_envoy.GetHerHis] đã được tìm thấy trong một công-ten-nơ chứa đồ chuẩn bị đem đi hỏa thiêu.\n\nChính quyền [From.GetAdj] đã lảng tránh một cách kỳ lạ khi được yêu cầu điều tra, dấy lên nghi ngờ rằng chính họ đứng sau vụ giết người - đặc biệt là khi [event_envoy.GetName] gần đây đã chỉ trích gay gắt [From.GetGovernmentName]."
 envoy_events.6.A:0 "Chúng sẽ phải trả giá cho việc này."
 kills_envoys:0 "Vụ Mất Tích Của Đặc Sứ"
 kills_envoys_desc:0 "Vì một lý do nào đó, xu hướng các đặc sứ ngoại quốc gặp phải kết cục bi thảm tại thủ đô của chúng ta đã ảnh hưởng tiêu cực đến vị thế của chúng ta giữa các đồng nhiệm ngân hà."
 faction_modifier_protected_interests:0 "Bảo Vệ Lợi Ích Của Chúng Ta"
 opinion_kills_envoys:0 "Ám Sát Đặc Sứ"

 envoy_events.7.name:0 "Đôi Uyên Ương Trắc Trở"
 envoy_events.7.desc:1 "Có vẻ như thay vì thực hiện nhiệm vụ của [event_envoy.GetHerHis] và đại diện cho lợi ích của [Root.GetAdj], đặc sứ [event_envoy.GetName] của chúng ta lại phải lòng sức quyến rũ của một nhà ngoại giao [other_species_nation.GetAdj]. Lo sợ những hậu quả từ sự sai trái này, cặp đôi đã cùng nhau bỏ trốn đến [third_party.GetName]: một quốc gia có bản hiến pháp tự do đến mức nguy hiểm cho phép những mối quan hệ như vậy.\n\nBằng hành động này, [event_envoy.GetName] đã đánh mất vị trí đặc sứ của [event_envoy.GetHerHis] trong chính quyền chúng ta. Tuy nhiên, việc mất quyền kiểm soát chính quan chức của mình đã làm tổn hại đến vị thế ngân hà của chúng ta. Chúng ta phải khôi phục danh tiếng bằng cách bắt giữ kẻ phản trắc!"
 envoy_events.7.A:0 "Phía [third_party.GetSpeciesNamePlural] nợ chúng ta sự giúp đỡ."
 envoy_events.7.B:0 "Tiếp cận họ và khuyên nhủ bằng lý lẽ."
 envoy_events.7.B.tooltip:0 "Nếu [third_party.GetName] chấp thuận, chúng ta sẽ nợ họ 2 Ân Huệ."
 envoy_events.7.D:0 "Hãy để mặc kệ; chuyện này sẽ sớm bị lãng quên thôi."
 envoy_events.8.desc:0 "Hỡi các [Root.GetSpeciesNamePlural] đáng kính! Chúng tôi nhận thấy một tội phạm [From.GetAdj] đang tị nạn tại quốc gia của các ngài. Kẻ phản trắc đó, nguyên là đặc sứ [event_envoy.GetName] của chúng tôi, đã phá vỡ mọi giao ước trung thành - cùng với những luật lệ cơ bản nhất của quốc gia chúng tôi - để bỏ trốn cùng một người [other_species_nation.GetAdj].\n\nChúng tôi tha thiết yêu cầu trao trả tên tội phạm cho chúng tôi, để [event_envoy.GetSheHe] có thể đối mặt với phiên tòa xét xử tội lỗi của [event_envoy.GetHerHis]."
 envoy_events.8.A:0 "Tất nhiên rồi."
 envoy_events.8.B:0 "Không đời nào! [event_envoy.GetSheHeCap] đang dưới sự bảo hộ của chúng tôi."
 envoy_events.9.desc:0 "Tất nhiên rồi! Chúng tôi sẽ trao trả [event_envoy.GetName] cho các ngài ngay lập tức."
 envoy_events.9.A:0 "Các ngài nhận được lời cảm tạ của chúng tôi."
 envoy_events.10.desc:0 "Quyền tị nạn chính trị là thiêng liêng đối với chúng tôi. Chúng tôi không thể dung thứ cho việc trao nộp những người vô tội cho những kẻ như các ngài!"
 envoy_events.10.A:0 "Chúng tôi rất lấy làm tiếc khi nghe điều này."
 envoy_events.10.B:0 "(Nói dối) Tất nhiên, chúng tôi hiểu mà."
 envoy_events.10.B.tooltip1:0 "Cử một đội tác chiến đặc biệt để bắt giữ cặp đôi.\n[third_party.GetName] sẽ không hài lòng."
 envoy_events.10.B.success_tooltip:0 "Nhiệm vụ thành công."
 envoy_events.10.B.fail_tooltip:0 "Nhiệm vụ kết thúc trong thất bại."
 envoy_events.11.name:0 "Chiến Dịch Tác Chiến Đặc Biệt Của [From.GetAdj]"
 envoy_events.11.desc:0 "Dường như [From.GetName] quá bất bình trước việc chúng ta từ chối dẫn độ kẻ đào tẩu [event_envoy.GetName] cho họ, nên họ đã tự mình hành động. Tên đào tẩu đã bị bắt cóc ngay dưới mũi chúng ta trong đêm khuya bởi một toán đặc vụ dường như được huấn luyện vô cùng bài bản.\n\nSự bất lực của chúng ta trong việc bảo vệ những người tìm kiếm sự giúp đỡ đã gây ra mối quan ngại sâu sắc trong các đồng minh, và các nhà ngoại giao của chúng ta đang phải chật vật kiểm soát tình hình."
 envoy_events.11.A:0 "Sao chúng dám!"
 envoy_events.12.name:0 "Chiến Dịch Tác Chiến Đặc Biệt Thành Công"
 envoy_events.12.desc:0 "Đội ngũ chúng ta cử đi để thu hồi đặc sứ đào tẩu, [event_envoy.GetName], đã hoàn thành xuất sắc nhiệm vụ. Kẻ phạm tội hiện đang bị giam giữ an toàn và chuẩn bị đối mặt với hình phạt thích đáng cho tội lỗi của [event_envoy.GetHerHis]."
 envoy_events.13.name:0 "Chiến Dịch Tác Chiến Đặc Biệt Của [From.GetAdj] Bị Ngăn Chặn"
 envoy_events.13.desc:0 "Dường như [From.GetName] quá bất bình trước việc chúng ta từ chối dẫn độ đặc sứ đào tẩu [event_envoy.GetName] cho họ, nên họ đã tự mình hành động và phát động một chiến dịch bắt giữ. Tuy nhiên, nhiệm vụ này đã đổ bể khi chúng ta chặn đứng con tàu [From.GetAdj] chở toán đặc vụ khi nó đang cố vượt biên giới. Các biện pháp đã được triển khai để đảm bảo mọi mưu toan tương tự trong tương lai đều sẽ thất bại."
 envoy_events.13.A:0 "Thật trơ trẽn!"
 envoy_events.14.name:0 "Chiến Dịch Tác Chiến Đặc Biệt Thất Bại"
 envoy_events.14.desc:0 "Toán đặc vụ chúng ta cử đi để thu hồi đặc sứ đào tẩu, [event_envoy.GetName], đã không thành công trong nhiệm vụ của mình; con tàu của họ đã bị lực lượng [From.GetAdj] bắt giữ khi đang cố vượt biên giới. Đúng như dự đoán, người [From.GetSpeciesNamePlural] vô cùng phẫn nộ và kịch liệt lên án sự can thiệp của người [Root.GetAdj] vào công việc nội bộ của họ. Về phần mình, các công dân của chúng ta thất vọng trước cách xử lý sự vụ và sự bất lực trong việc thu hồi tên tội phạm."

 opinion_extradited_envoy:0 "Đã Dẫn Độ Đặc Sứ Đào Tẩu"
 opinion_refused_extradited_envoy:0 "Từ Chối Dẫn Độ Đặc Sứ Đào Tẩu"
 opinion_special_ops_vs_us:0 "Chiến Dịch Tác Chiến Đặc Biệt"
 cannot_protect_asylum:0 "Người Bảo Vệ Công Lý Bất Lực"
 cannot_protect_asylum_desc:0 "Vị thế của chúng ta giữa các đồng nhiệm bị hoen ố vì thất bại trong việc bảo vệ những người mà chúng ta đã cho tị nạn chính trị."
 failed_special_ops_mission:0 "Chiến Dịch Tác Chiến Đặc Biệt Thất Bại"
 failed_special_ops_mission_desc:0 "Nỗ lực thu hồi đặc sứ đào tẩu thất bại vừa gióng lên hồi chuông cảnh báo cho các đồng nhiệm ngân hà, vừa làm lung lay lòng tin của công dân đối với chính phủ."
 diplo_corps_lost_control:0 "Đoàn Ngoại Giao Bị Chế Giễu"
 diplo_corps_lost_control_desc:0 "Sự bất lực trong việc kiểm soát các nhà ngoại giao của mình không thể truyền cảm hứng tin tưởng cho các đồng nhiệm xung quanh."

 envoy_events.15.name:0 "Một Sinh Vật Kỳ Lạ"
 envoy_events.15.desc:0 "[event_envoy.GetName], sứ giả của chúng ta tại Cộng Đồng Ngân Hà, đã dành một khoảng thời gian nhiều đến đáng lo ngại để chăm sóc một sinh vật có vú nhỏ kỳ lạ cứ lẽo đẽo đi theo [event_envoy.GetHerHim]. Có lẽ đây là một thú cưng nuôi trong nhà trốn thoát khỏi một phái đoàn nào đó; nó dễ thương không thể phủ nhận nhưng không hề có dấu hiệu của tư duy bậc cao. Mặc dù là loài ăn thịt dữ tợn với nanh vuốt sắc nhọn, nó lại nhìn chung rất quấn quýt và thích được vuốt ve âu yếm - tuy nhiên tính khí của nó có thể thay đổi đột ngột và hung bạo!\n\nDù sinh vật này phần nào gây xao nhãng khỏi những trọng trách nghiêm túc của [event_envoy.GetName], các đại biểu khác lại khen ngợi bản tính mềm mỏng, giàu tình cảm đầy đáng yêu vừa được bộc lộ trong tâm thức của người [Root.GetSpeciesName]."
 envoy_events.15.A:0 "Tuyệt hảo."
 opinion_feline_affection:0 "Tình Cảm Mèo Cưng"

 envoy_events.17.name:0 "Bất Đồng Giữa Các Đồng Minh"
 envoy_events.17.desc.base:0 "Những thay đổi luật lệ gần đây trong [Root.Federation.GetName] đã gây ra sự xôn xao đáng kể, khi các cuộc tranh luận ý thức hệ cũ giữa chúng ta và [dispute_winner.GetName] một lần nữa bùng phát trở lại. Đại diện của chúng ta, [dispute_loser_envoy.GetName], đã dũng cảm bảo vệ lập trường của chúng ta trước quan chức [dispute_winner.GetAdj], [dispute_winner_envoy.GetName]."
 envoy_events.17.desc.end:0 "Công dân trên toàn [Root.GetGovernmentName] đã theo dõi cuộc tranh luận với sự quan tâm sâu sắc, và ngày càng lo ngại về cách hòa giải lý tưởng của họ với tư cách thành viên trong [Root.Federation.GetName]."
 envoy_events.17.desc.militarist:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan mang tính quân phiệt hơn, và khi cuộc tranh luận quay sang bất lợi cho [dispute_loser_envoy.GetHerHim], [dispute_loser_envoy.GetSheHe] tỏ ra ngày càng bối rối trước những cáo buộc \"[Root.GetAdj] hiếu chiến\" bủa vây từ mọi phía.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.pacifist:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan mang tính hòa bình hơn, và phải đối mặt với những lời phản bác kịch liệt từ mọi phía rằng \"sự ngây thơ của người [Root.GetAdj]\" đang đe dọa an nguy của toàn liên bang.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.spiritualist:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan tâm linh hơn, và những người chứng kiến chỉ biết lắc đầu trước \"sự lạc hậu\" của những điều \"mê tín\" [Root.GetAdj].\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.materialist:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan duy vật hơn, và càng thêm bối rối khi các đồng nhiệm của [dispute_loser_envoy.GetHerHis] liên tục lên án \"chủ nghĩa khoái lạc\" của người [Root.GetAdj], khăng khăng bảo vệ sự ưu việt của những lề thói mê tín của họ.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.xenophile:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan thân thiện ngoại chủng hơn, khi quan điểm của [dispute_loser_envoy.GetHerHis] bị thẳng thừng lên án là \"tự do đến mức nguy hiểm\".\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.xenophobe:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan bài ngoại hơn, khi những lời phản đối của [dispute_loser_envoy.GetHerHis] rằng chúng ta nên cảnh giác trước các ảnh hưởng ngoại bang bị xem là định kiến rỗng tuếch và lạc hậu.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.egalitarian:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan bình đẳng hơn, khi những kẻ sống trong các xã hội kém tự do không thể nhìn thấy những lợi ích mà quyền tự do lớn hơn mang lại, thay vào đó lại cáo buộc chúng ta là \"tự do đến mức nguy hiểm\".\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.authoritarian:0 "$envoy_events.17.desc.base$ Tuy nhiên, [dispute_loser_envoy.GetSheHe] không thể thuyết phục những người có mặt về lợi ích của một thế giới quan độc tài chuyên chế hơn, khi các nhân chứng ngày càng tin chắc vào cái xấu xa của việc xâm phạm các quyền tự do cá nhân.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.A:0 "Chúng ta không thể thỏa hiệp về các giá trị của mình."
 envoy_events.17.B:0 "Chúng ta nên giữ im lặng vì lợi ích đoàn kết."
 envoy_events.17.C1:0 "Triệu hồi [dispute_loser_envoy.GetHerHim] về [Root.GetName] để tái huấn luyện."
 envoy_events.17.C2:0 "Triệu hồi [dispute_loser_envoy.GetHerHim] về [Root.GetName] để tái lập trình."
 envoy_events.17.C3:0 "Triệu hồi [dispute_loser_envoy.GetHerHim] về [Root.GetName] để tái điều chỉnh."
 envoy_events.18.name:0 "$envoy_events.17.name$"
 envoy_events.18.desc.base:0 "Những thay đổi luật lệ gần đây trong [Root.Federation.GetName] đã gây ra sự xôn xao đáng kể, với những cuộc tranh luận ý thức hệ cũ giữa chúng ta và [dispute_loser.GetName] một lần nữa nổi lên. Đại diện của chúng ta, [dispute_winner_envoy.GetName],"
 envoy_events.18.desc.end:0 "Tuy nhiên, người [dispute_loser.GetSpeciesNamePlural] đón nhận diễn biến này một cách cay đắng, phàn nàn về sự xâm phạm các giá trị của họ và bày tỏ lo ngại về hướng đi mà liên bang hiện đang đi theo."
 envoy_events.18.desc.militarist.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan quân phiệt hơn, làm nổi bật sự hèn nhát và ngây thơ vốn có trong niềm tin của đặc sứ [dispute_loser.GetAdj], [dispute_loser_envoy.GetName]."
 envoy_events.18.desc.pacifist.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan hòa bình hơn, bảo vệ mạng sống của công dân chúng ta thay vì ném họ vào những cuộc chiến tranh vô nghĩa do thói [dispute_loser.GetAdj] hiếu chiến gây ra."
 envoy_events.18.desc.spiritualist.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan tâm linh hơn, nuôi dưỡng linh hồn của nhân dân chúng ta trước sự lạnh lùng và tàn nhẫn của chủ nghĩa duy vật [dispute_loser.GetAdj]."
 envoy_events.18.desc.materialist.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan duy vật hơn, giải phóng tư tưởng khỏi những điều mê tín dị đoan [dispute_loser.GetAdj] và đón nhận sự tiến bộ của khoa học lý tính."
 envoy_events.18.desc.xenophile.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan thân thiện ngoại chủng, nơi mọi loài trong liên bang đều tìm cách hòa thuận với nhau, thay vì liên tục nghi ngờ lẫn nhau như mong muốn của đặc sứ [dispute_loser.GetAdj] [dispute_loser_envoy.GetName]."
 envoy_events.18.desc.xenophobe.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan bài ngoại, nơi các thành viên liên bang trước hết phải chăm lo cho chính mình, thay vì theo đuổi chủ nghĩa lý tưởng không tưởng của người [dispute_loser.GetSpeciesNamePlural]."
 envoy_events.18.desc.egalitarian.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan bình đẳng hơn, nơi mọi cá nhân đều có quyền tự do và phẩm giá, đối lập với sự áp bức độc tài mà nhiều [dispute_loser.GetSpeciesNamePlural] đang phải gánh chịu."
 envoy_events.18.desc.authoritarian.base:0 "đã thuyết phục được nhiều người về lợi ích của một thế giới quan độc tài chuyên chế hơn, tập trung vào luật pháp và trật tự kỷ cương giúp chúng ta thoát khỏi những nguy cơ từ chủ nghĩa lý tưởng bình đẳng [dispute_loser.GetAdj]."
 envoy_events.18.desc.militarist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.militarist.base$ $envoy_events.18.desc.end$"
 envoy_events.18.desc.pacifist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.pacifist.base$ $envoy_events.19.desc.end$"
 envoy_events.18.desc.spiritualist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.spiritualist.base$ $envoy_events.19.desc.end$"
 envoy_events.18.desc.materialist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.materialist.base$ $envoy_events.19.desc.end$"
 envoy_events.18.desc.xenophile:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.xenophile.base$ $envoy_events.19.desc.end$"
 envoy_events.18.desc.xenophobe:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.xenophobe.base$ $envoy_events.19.desc.end$"
 envoy_events.18.desc.egalitarian:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.egalitarian.base$ $envoy_events.19.desc.end$"
 envoy_events.18.desc.authoritarian:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.authoritarian.base$ $envoy_events.19.desc.end$"
 envoy_events.18.A:0 "Họ đơn giản là không thể phủ nhận sự ưu việt của con đường chúng ta đi."
 envoy_events.19.name:0 "$envoy_events.17.name$"
 envoy_events.19.desc.end:0 "May mắn thay, [dispute_loser.GetSpeciesNamePlural] đã đón nhận điều này một cách hòa nhã, nhận thức được sự cần thiết phải thỏa hiệp vì lợi ích của một mối quan hệ hòa hợp hơn với các đối tác liên minh của họ."
 envoy_events.19.desc.militarist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.militarist.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.pacifist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.pacifist.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.spiritualist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.spiritualist.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.materialist:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.materialist.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.xenophile:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.xenophile.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.xenophobe:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.xenophobe.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.egalitarian:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.egalitarian.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.authoritarian:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.authoritarian.base$ $envoy_events.19.desc.end$"
 envoy_events.19.A:0 "Thông qua lời nói chúng ta sẽ thuyết phục được họ."
