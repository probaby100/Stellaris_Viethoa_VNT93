 # ENVOY EVENTS
 #################

 envoy_events.1.name:0 "Đặc Sứ [envoy_source.GetAdj] Khiếm Nhã"
 envoy_events.1.desc:0 "Có vẻ như một bên thứ ba tinh quái đã xâm nhập vào phần mềm dịch thuật của đặc sứ [envoy_source.GetAdj] tại [Root.Capital.GetName], [event_envoy.GetName], khiến cho thay vì thốt ra những lời ngoại giao hòa nhã, [event_envoy.GetSheHe] lại tuôn ra những lời lăng mạ cay độc khiến không ai thoát khỏi. Trục trặc trên thiết bị của [event_envoy.GetHerHis] đã được kịp thời phát hiện, nhưng trước đó [Root.GetRulerTitle] [Root.GetRulerName] đã bị tuyên bố là một \"[ruler_species.GetNameInsult] đê tiện\" - một sự sỉ nhục nghiêm trọng chắc chắn cần phải có lời đáp trả."
 envoy_events.1.A:0 "Thật thô lỗ."
 envoy_events.1.B:0 "Chà, chuyện đó cũng buồn cười đấy chứ!"

 envoy_events.2.name:0 "Trục Trặc Phần Mềm Dịch Thuật"
 envoy_events.2.desc.base:0 "Có vẻ như một bên thứ ba tinh quái đã xâm nhập vào phần mềm dịch thuật của đặc sứ chúng ta tại [From.GetName], [event_envoy.GetName], khiến cho những lời ngoại giao hòa nhã của [event_envoy.GetHerHis] lại biến thành những lời lăng mạ cay độc khiến không ai thoát khỏi - đặc biệt là [From.GetRulerTitle] của họ, người đã bị tuyên bố là một \"[ruler_species.GetNameInsult] đê tiện\"."
 envoy_events.2.desc.pos:0 "$envoy_events.2.desc.base$\n\nMay mắn thay, trục trặc đã nhanh chóng được phát hiện và phía [From.GetSpeciesNamePlural] đón nhận sự việc bằng thái độ hài hước. Thậm chí, các đoạn ghi âm về \"đặc sứ [Root.GetAdj] khiếm nhã\" đang được lan truyền rộng rãi, mang lại nhiều tràng cười sảng khoái cho người dân của họ."
 envoy_events.2.desc.neg:0 "$envoy_events.2.desc.base$\n\nDù trục trặc đã nhanh chóng được phát hiện, phía [From.GetSpeciesNamePlural] không hề thấy buồn cười trước sự việc và đã gửi khiếu nại chính thức về hành vi khiếm nhã của đặc sứ chúng ta."
 envoy_events.2.B:0 "Một đóng góp cao quý cho xã hội [From.GetAdj]."

 xeno_comedy_envoy:0 "Hài Kịch Ngoại Chủng"
 xeno_comedy_envoy_desc:0 "Hành vi lố bịch của một đặc sứ ngoại quốc đã mang lại nhiều tiếng cười trong xã hội chúng ta."
 opinion_envoy_insult_taken:0 "Đặc Sứ Khiếm Nhã"
 opinion_envoy_insult_laughed_at:0 "Đặc Sứ Buồn Cười"

