 edict_fortify_the_border:0 "Gia Cố Biên Giới"
 edict_fortify_the_border_desc:0 "Phòng thủ các hệ sao của chúng ta là tối quan trọng. Sắc Lệnh này sẽ chuyển hướng các nguồn lực bổ sung cho các mục đích này."

 edict_fleet_supremacy:0 "Bá Quyền Hạm Đội"
 edict_fleet_supremacy_desc:0 "Hải quân là phương tiện tốt nhất để chúng ta phô diễn sức mạnh. Sắc Lệnh này sẽ ưu tiên họ trên các nhu cầu thứ yếu."

