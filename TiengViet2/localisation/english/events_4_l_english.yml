l_english:

 ####################################
 # Anomaly Categories
 ####################################
 rogue_moon_category:0 "Mặt Trăng Lang Thang"
 rogue_moon_category_desc:1 "Quét ban đầu của [Root.GetName] chỉ ra những khác biệt bất ngờ so với hành tinh mẹ của nó."
 hollow_planet_category:0 "Hành Tinh Rỗng Ruột"
 hollow_planet_category_desc:1 "Quét sơ bộ cho thấy [Root.GetName] dường như chỉ là một lớp vỏ rỗng. Chúng ta suy đoán rằng nó có thể là một công trình hoàn toàn nhân tạo, hoặc từng là một hành tinh bình thường nhưng bị khoét rỗng bằng cách nào đó."
 strong_magnetic_category:0 "Từ Trường Mạnh"
 strong_magnetic_category_desc:0 "Quét ban đầu hé lộ rất ít thông tin ngoài việc [Root.GetName] có một từ trường mạnh bất thường bao quanh."
 undiscovered_planetary_modifier_category:0 "Điều Kiện Bất Thường"
 undiscovered_planetary_modifier_category_desc:0 "Điều tra môi trường kỳ lạ của [From.GetName]."

 ####################################
 # Anomaly Events
 ####################################
 anomaly.6000.name:0 "Mặt Trăng Lang Thang"
 # "parent planet\" and \"its primary", pending PARENTPLANET loc key implementation
 anomaly.6000.desc:0 "[From.GetName] dường như không được cấu tạo từ vật chất tương tự như hành tinh mẹ của nó, cho thấy nó từng là một hành tinh lùn lang thang bị kẹt trong giếng trọng lực của hành tinh chính. Nghiên cứu sâu hơn có thể hé lộ nơi nó ban đầu xuất phát."
 anomaly.6001.desc:0 "[From.GetName] chứa một căn cứ!"
 anomaly.6002.name:0 "Hành Tinh Rỗng Ruột"
 anomaly.6002.desc:1 "Sau khi nghiên cứu sâu rộng, chúng ta kết luận rằng [From.GetName] là một công trình nhân tạo. Giả thuyết nghiên cứu là [From.GetName] ban đầu là một vành đai tiểu hành tinh khá bình thường, bằng cách nào đó đã bị nghiền ép lại với nhau để gom các vật liệu cần thiết rồi tạo hình thành một hình cầu rỗng ruột."
 anomaly.6003.desc:1 "Trước sự ngạc nhiên lớn của chúng ta, [From.GetName] dường như đã bắt đầu vòng đời như một hành tinh bình thường, nhưng tại một thời điểm nào đó đã bị khoét rỗng hoàn toàn bằng một kỹ thuật khai khoáng chưa từng biết, biến [From.GetName] thành một lớp vỏ rỗng không."
 anomaly.6004.name:0 "Từ Trường Mạnh"
 anomaly.6004.desc:0 "Quét ban đầu hé lộ rất ít điều ngoại trừ việc [From.GetName] có một từ trường mạnh bất thường bao quanh. Điều này đã cản trở việc quét chi tiết cho đến khi tàu [Root.GetName] tiến vào gần hơn để quan sát. Từ trường dường như bắt nguồn từ mật độ quặng kim loại cao trong lớp vỏ hành tinh, điều này chắc chắn sẽ là một lợi thế lớn cho các hoạt động khai thác mỏ tại địa phương."
 anomaly.6005.name:0 "Điều Kiện Bất Thường"
 anomaly.6005.desc:0 "Các lần quét của chúng ta cho thấy [From.GetName] khá khác thường, cần phải quan sát kỹ hơn."
 anomaly.6006.name:0 "Điều Kiện Bất Thường"
 anomaly.6006.desc:0 "Quá trình quét [From.GetName] đã hoàn tất, Sĩ quan Khoa học [Root.GetLeaderName] đã chuẩn bị một báo cáo về những điều kiện bất thường được tìm thấy tại đây."
 anomaly.6006.a:0 "Báo cáo đi, [Root.GetLeaderName]."
 anomaly.6007.name:0 "Giàu Khoáng Sản"
 anomaly.6007.desc:0 "[From.From.GetName] sở hữu lượng khoáng sản dồi dào dễ tiếp cận trong lớp vỏ hành tinh, điều này sẽ biến hoạt động khai khoáng tại đây thành một ngành kinh doanh sinh lời cao."
 anomaly.6008.desc:0 "[From.From.GetName] chịu ảnh hưởng của các mô thức thời tiết bất ổn, với những cơn bão dữ dội thường xuyên xuất hiện bất thình lình tàn phá bề mặt. Các trang trại điện gió tại đây nhiều khả năng sẽ cung cấp nguồn năng lượng dồi dào."
 anomaly.6009.desc:0 "[From.From.GetName] đã tiến hóa hệ động vật cực kỳ hung dữ, và bề mặt đầy rẫy những kẻ săn mồi chết chóc đang rình rập con mồi tiếp theo. Cấu trúc sinh học của chúng mang lại cơ hội nghiên cứu tuyệt vời."
 anomaly.6010.desc:0 "Dù có thể sinh sống được, [From.From.GetName] có một từ trường gần như không tồn tại, mang lại rất ít sự bảo vệ trước bức xạ vũ trụ."
 anomaly.6011.desc:0 "[From.From.GetName] có từ trường cao bất thường, do các mỏ quặng kim loại phong phú tạo ra. Điều này sẽ gây nhiễu nhiều thiết bị và máy tính của chúng ta, nhưng sản lượng khai khoáng dồi dào sẽ bù đắp thừa sức cho điều đó."
 anomaly.6012.desc:0 "[From.From.GetName] có các mảng kiến tạo rất bất ổn và dễ xảy ra những trận động đất lớn cùng hoạt động núi lửa. Các mỏ khoáng sản giá trị thường xuyên lộ ra trên bề mặt."
 anomaly.6013.desc:0 "[From.From.GetName] bị khóa thủy triều quanh ngôi sao của nó, nghĩa là một mặt luôn là ban ngày trong khi mặt kia chìm trong bóng tối vĩnh hằng. Nếu sự sống tồn tại ở đây, nó nhiều khả năng chỉ giới hạn ở các vùng tranh tối tranh sáng nơi hai mặt giao nhau."
 anomaly.6014.desc:0 "Có vẻ như [From.From.GetName] từng là một hành tinh khí khổng lồ, nhưng khoảng cách quá gần với ngôi sao chủ đã thiêu rụi bầu khí quyển dày đặc. Tất cả những gì còn lại hiện nay là một lõi kim loại siêu đậm đặc và giàu khoáng sản."
 anomaly.6015.desc:0 "Quỹ đạo mà [From.From.GetName] di chuyển quanh ngôi sao của nó rải rác các tiểu hành tinh nhỏ, thiên thạch và các bầy sao chổi. Những vụ va chạm lớn trên bề mặt xảy ra với tần suất đáng báo động, thường để lại những mỏ khoáng sản giá trị."
 anomaly.6016.desc:0 "[From.From.GetName] có số lượng vệ tinh tự nhiên lớn bất thường. Hàng trăm mặt trăng nhỏ và tiểu vệ tinh quay quanh hành tinh, nhiều trong số đó chứa các mỏ khoáng sản giá trị."
 anomaly.6017.desc:0 "Dường như [From.From.GetName] được hình thành chủ yếu từ carbon và chứa rất ít oxy. Không chỉ giàu khoáng sản, các vụ phun trào núi lửa thường xuyên đưa kim cương từ sâu trong lòng đất lên bề mặt."
 anomaly.6018.desc:0 "Những cơn bão điện từ ngoạn mục tàn phá bầu khí quyển của [From.From.GetName] theo định kỳ. Dù điều này có thể không mấy dễ chịu cho cư dân sinh sống, nhưng nó mang lại cơ hội nghiên cứu phong phú."
 anomaly.6019.desc:0 "[From.From.GetName] có mật độ vật chất thấp bất thường, và do đó trọng lực thấp hơn nhiều so với hầu hết các hành tinh có kích thước tương đương."
 anomaly.6020.desc:0 "[From.From.GetName] đậm đặc bất thường, và vì vậy có trọng lực cao gây khó chịu. Tuy nhiên, lượng kim loại nặng hiện diện sẽ hỗ trợ rất lớn cho nghiên cứu Vật lý."
 anomaly.6021.desc:0 "[From.From.GetName] hoặc đã được tạo ra nhân tạo hoặc bằng cách nào đó đã bị khoét rỗng. Làm thế nào và tại sao thì chúng ta không biết, nhưng việc điều tra nó hứa hẹn sẽ vô cùng hấp dẫn."
 anomaly.6022.desc:0 "Sự dồi dào khoáng sản dễ tiếp cận trong lớp vỏ của [From.From.GetName] mang lại cơ hội khai thác thực sự đáng kinh ngạc."
 anomaly.6023.desc:0 "Chưa rõ [From.From.GetName] đơn thuần được hình thành theo cách này, hay liệu một chủng tộc vô danh nào đó đã từng cướp bóc cạn kiệt tài nguyên của nó. Tuy nhiên, chúng ta biết rằng có rất ít khoáng sản được tìm thấy tại đây."
 anomaly.6024.desc:0 "Các dạng sống trên [From.From.GetName] có quy mô khổng lồ và có thể cực kỳ nguy hiểm ngay cả khi không có ý định gây hại. Càng ít nhắc đến những kẻ săn mồi khổng lồ của thế giới này thì càng tốt, nhưng chúng thực sự là một kho tàng dữ liệu nghiên cứu nếu có nhà khoa học nào đủ dũng cảm thử nghiệm."
 anomaly.6025.desc:0 "Có lẽ [From.From.GetName] từng có một mặt trăng bị phá hủy trong một thảm họa nào đó, hoặc có lẽ các mảnh vỡ quỹ đạo của nó chưa từng hợp nhất hoàn toàn ngay từ đầu. Dù nguyên nhân là gì, hành tinh này được bao quanh bởi một vành đai các tiểu hành tinh nhỏ."
 anomaly.6026.desc:0 "Cảnh quan của [From.From.GetName] tuyệt đẹp một cách thuần khiết, bất kỳ ai sống trên hành tinh này sẽ liên tục tìm thấy những kỳ quan mới để chiêm ngưỡng."
 anomaly.6027.desc:0 "Thứ gì đó trong không khí của [From.From.GetName] dường như khiến mọi người có tâm trạng muốn... sinh sản. Không cần phải nói, điều này đã khiến phần khảo sát trên mặt đất trở nên khá ngượng ngùng."
 anomaly.6028.desc:0 "Không khí của [From.From.GetName] chứa một chất gây ảo giác tự nhiên. Mặc dù điều này giữ cho mọi người vui vẻ, và thực sự dường như hỗ trợ việc hình dung một số vấn đề Vật lý bí truyền, nó cũng sẽ khiến người dân xao nhãng khỏi công việc khác."
 anomaly.6029.desc:0 "Sự sống sinh sôi nảy nở trên [From.From.GetName], hệ động vật dồi dào và hệ thực vật phát triển nhanh chóng."
 anomaly.6030.desc:0 "Sự sống chật vật để tồn tại trên [From.From.GetName], và dẫu một số loài bám víu lấy sự tồn tại kiên cường, chúng đều còi cọc và ốm yếu."
 anomaly.6031.desc:0 "Một thảm họa xa xưa nào đó đã khiến [From.From.GetName] bị nhiễm xạ khá nặng nề. Cùng với dòng chảy thời gian, nó đã phần nào có thể sinh sống được trở lại, nhưng cho đến nay rất ít sinh vật có thể phát triển tại đây."
 anomaly.6660.desc.start:1 "Khi Tàu Khoa Học của chúng ta quét bề mặt [From.GetName], rõ ràng là chúng ta đã tìm thấy điều gì đó khác thường."
 anomaly.6660.desc.default:1 "$anomaly.6660.desc.start$ [From.GetName] có những điều kiện không giống bất cứ thứ gì chúng ta từng thấy trước đây.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.weather:1 "$anomaly.6660.desc.start$ Những cơn bão dữ dội liên tục tàn phá [From.GetPlanetMoon], điều này có thể hỗ trợ tài nguyên và nghiên cứu nhưng sẽ là trở ngại cho dân số của chúng ta.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.magnetic:2 "$anomaly.6660.desc.start$ Từ trường của [From.GetPlanetMoon] lệch pha rất xa so với những gì được kỳ vọng ở loại thiên thể này.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tectonic:0 "$anomaly.6660.desc.start$ Bản chất bất ổn của [From.GetPlanetMoon] khiến các trận động đất và phun trào núi lửa trở thành chuyện thường nhật.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tidal:0 "$anomaly.6660.desc.start$ [From.GetPlanetMoon] bị khóa trong chuyển động tự quay quanh mặt trời, nghĩa là ngày và đêm liên tục ở mỗi mặt. Tình trạng có thể sinh sống là không hề lý tưởng.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tidal_mach:0 "$anomaly.6660.desc.start$ [From.GetPlanetMoon] bị khóa trong chuyển động tự quay quanh mặt trời, nghĩa là ngày và đêm liên tục ở mỗi mặt. Tình trạng có thể sinh sống là không hề lý tưởng đối với các dạng sống hữu cơ.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.impacts:1 "$anomaly.6660.desc.start$ [From.GetPlanetMoon] bị giày xéo bởi các trận mưa thiên thạch liên miên, dội bom bề mặt bằng những khối đạn đạo khổng lồ.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity:0 "$anomaly.6660.desc.start$ Trọng lực trên hành tinh còn lâu mới đạt mức lý tưởng để tiếp nhận các cư dân định cư tiềm năng của chúng ta.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity_mach:0 "$anomaly.6660.desc.start$ Dù trọng lực của hành tinh không hề lý tưởng cho việc tiếp nhận cư dân hữu cơ, các thuật toán hiệu chuẩn trọng lực vượt trội của chúng ta sẽ vô hiệu hóa tác động của nó.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity_desc_mach:0 "$anomaly.6660.desc.start$ Dù trọng lực của hành tinh không hề lý tưởng cho việc tiếp nhận cư dân hữu cơ, các thuật toán hiệu chuẩn trọng lực vượt trội của chúng ta sẽ vô hiệu hóa tác động của nó.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.wildlife:0 "$anomaly.6660.desc.start$ Các loài động vật tìm thấy trên hành tinh này có vẻ hung dữ, và sẽ khiến việc thuộc địa hóa trở nên khó khăn hơn.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.titan:0 "$anomaly.6660.desc.start$ Hành tinh này là ngôi nhà của những dạng sống khổng lồ mà việc tiếp xúc có thể rất nguy hiểm.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.resources:0 "$anomaly.6660.desc.start$ Thành phần cấu tạo và lịch sử của nó mang lại nguồn vật liệu dồi dào mà chúng ta nên tận dụng cơ hội để thu thập.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.beauty:3 "$anomaly.6660.desc.start$ Vẻ đẹp tự nhiên của [From.GetPlanetMoon] có thể khiến bất kỳ ai cũng phải kinh ngạc sững sờ. Cuộc sống ở đây sẽ thật dễ chịu, đối với các dạng sống tương thích về mặt sinh lý.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.atmosphere:0 "$anomaly.6660.desc.start$ Bầu khí quyển chứa các loại khí đặc biệt có thể ảnh hưởng đến dân số của chúng ta, vì vậy chúng ta cần phải cảnh giác.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.atmosphere_mach:0 "$anomaly.6660.desc.start$ Bầu khí quyển chứa các loại khí có thể làm rối loạn chức năng của hệ thần kinh hữu cơ.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.lush:0 "$anomaly.6660.desc.start$ Hệ động vật sinh sôi nảy nở dễ dàng, và có thể mang lại cơ hội phong phú để thu hoạch những tài nguyên vô cùng cần thiết.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.lush_mach:0 "$anomaly.6660.desc.start$ Hệ động vật sinh sôi nảy nở dễ dàng, và sẽ mang lại cho các dạng sống hữu cơ cơ hội dồi dào để thu hoạch những tài nguyên thiết yếu.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.terrible:0 "$anomaly.6660.desc.start$ Môi trường khắc nghiệt và ảm đạm, và sẽ không phải là một địa điểm định cư tối ưu.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.terrible_mach:0 "$anomaly.6660.desc.start$ Môi trường khắc nghiệt và ảm đạm, hoàn toàn không phù hợp với các dạng sống hữu cơ.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.end:0 "Chúng ta chắc chắn sẽ bắt gặp nhiều điều bất thường như thế này hơn khi khảo sát các hành tinh mới, và không nên đánh giá thấp tác động của chúng đối với quá trình bành trướng của chúng ta."
 anomaly.6660.a.tooltip:0 "Một Bổ trợ Hành tinh xuất hiện trên [From.GetName]."

 ####################################
 # Anomaly Failure Events
 ####################################
 anomaly_failure.6000.desc:1 "Không có gì thú vị để báo cáo."
 anomaly_failure.6000.a:1 "Đành vậy thôi."

 ####################################
 # Colony Events
 ####################################
 colony_mod.1.name:0 "Chuyện Gì Đã Xảy Ra Ở Đây?"
 colony_mod.1.desc:0 "Dù rõ ràng là một thảm họa trong quá khứ đã giải phóng một lượng bức xạ khổng lồ trên [Root.GetName], nguyên nhân gây ra nó lại không hề rõ ràng. Bí ẩn này hiện đang làm bận tâm ngày càng nhiều cư dân thuộc địa đã chọn [Root.GetName] làm nhà. Rốt cuộc, nếu chúng ta không biết điều này đã xảy ra như thế nào, lấy gì đảm bảo nó sẽ không lặp lại lần nữa?"
 colony_mod.1.desc_mach:0 "Dù rõ ràng là một thảm họa trong quá khứ đã giải phóng lượng bức xạ khổng lồ trên [Root.GetName], chúng ta vẫn chưa xác định được nguyên nhân hoặc liệu nó có khả năng tái diễn hay không."
 colony_mod.1.a:0 "Hãy làm sáng tỏ tận cùng chuyện này!"
 colony_mod.2.name:0 "Sự Sống Titan"
 colony_mod.2.desc:0 "Sự sống bản địa trên [Root.GetName] được xây dựng ở quy mô sử thi, lớn hơn nhiều so với những gì trước đây từng được cho là khả thi đối với sự sống sinh học. Câu hỏi hiện đang đặt ra trong tâm trí các nhà nghiên cứu là \"Bí mật của chúng là gì, và chúng ta có thể hưởng lợi từ nó không?\" Các đề xuất nghiên cứu chi tiết hơn về sự sống bản địa đang tới tấp gửi về."
 colony_mod.2.a:0 "Tiến hành nghiên cứu."
 colony_mod.2.b:0 "Không, hãy để những gã khổng lồ yên."
 colony_mod.2.c:0 "Đảm bảo rằng nghiên cứu không gây hại cho chúng."
 colony_mod.2.d:0 "Nghiên cứu chúng ư? Hãy săn bắt chúng và xem có thứ gì hữu ích không!"
 colony_mod.3.name:0 "Động Đất!"
 colony_mod.3.desc:0 "Các mảng kiến tạo bất ổn của [Root.GetName] vừa có một đợt dịch chuyển dữ dội lần nữa. Các báo cáo về thiệt hại đối với thuộc địa vừa mới bắt đầu gửi về."
 colony_mod.3.a:0 "Hãy báo cáo đi."
 colony_mod.4.name:0 "Phát Hiện Sao Chổi Qua Vành Đai"
 colony_mod.4.desc:1 "Dân cư của [Root.GetName] hiện đang chứng kiến một cảnh tượng ngoạn mục. Một ngôi sao chổi đang đi qua vành đai tiểu hành tinh của [Root.GetName] và hiệu ứng được mô tả là \"tuyệt mỹ\"."
 colony_mod.4.a:0 "Hãy tiếp tục ngắm nhìn bầu trời!"
 colony_mod.5.name:0 "Trấn Áp"
 colony_mod.5.desc:1 "Dù không thể phủ nhận rằng tác động say sưa của bầu khí quyển [Root.GetName] là rất thú vị, và thậm chí hữu ích trong một số trường hợp, nhưng đang có áp lực từ các bộ phận bảo thủ hơn của [Root.Owner.GetName] đòi hỏi phải trấn áp các loại khí có thể gây nghiện này."
 colony_mod.5.a:1 "Đóng cửa nó ngay!"
 colony_mod.5.b:0 "Không, hãy để [Root.GetName] nguyên như hiện tại."
 colony_mod.6.name:0 "Trận Oanh Kích"
 colony_mod.6.desc:1 "Sau một cuộc điều tra kỹ lưỡng, chúng ta đi đến kết luận rằng [Root.GetName] từng là địa điểm của một cuộc diệt chủng thời cổ đại. Theo những gì chúng ta có thể xác định, dân bản địa của [Root.GetName] từng đứng trước ngưỡng cửa trở thành một chủng tộc du hành không gian thì một chủng tộc tiên tiến hơn nhiều bất ngờ tiến vào hệ sao, oanh kích [Root.GetName] từ quỹ đạo, rồi rời đi, bỏ mặc vài người sống sót ít ỏi cầm chắc cái chết diệt vong."
 colony_mod.6.a:0 "Nghiên cứu các hố va chạm để tìm hiểu chi tiết về vũ khí đã sử dụng."
 colony_mod.7.name:0 "Chiến Tranh Liên Sao"
 colony_mod.7.desc:1 "Sau một cuộc điều tra kỹ lưỡng, chúng ta đi đến kết luận rằng [Root.GetName] là nạn nhân trong một cuộc chiến bị lãng quên. Ai từng sống ở đây và họ đã chiến đấu với ai vẫn là ẩn số, nhưng rõ ràng là họ đã bị xóa sổ sau khi một lực lượng xâm lược ngoài hệ sao tiến vào hệ và trận chiến giành hành tinh sau đó nổ ra. Dù đây là một phát hiện đáng sợ, ít nhất chúng ta có thể khá chắc chắn rằng nó khó có khả năng tái diễn."
 colony_mod.7.a:0 "Nghiên cứu những gì còn sót lại trên các chiến trường."
 colony_mod.8.name:0 "Chủng Tộc Tự Sát"
 colony_mod.8.desc:0 "Lịch sử bi thảm của [Root.GetName] đã được phơi bày. Cách đây rất lâu, có vẻ như [Root.GetName] từng bị chi phối bởi hai siêu cường cạnh tranh. Tại một thời điểm nào đó, chiến tranh nổ ra giữa họ và cuộc xung đột leo thang cho đến khi toàn bộ sự sống tiên tiến trên [Root.GetName] bị xóa sổ do việc lạm dụng quá mức vũ khí hạt nhân."
 colony_mod.8.desc_mach:0 "Cách đây rất lâu, có vẻ như [Root.GetName] từng bị chi phối bởi hai siêu cường cạnh tranh. Tại một thời điểm nào đó, chiến tranh nổ ra giữa họ và xung đột leo thang cho đến khi toàn bộ sự sống tiên tiến trên [Root.GetName] bị tiêu diệt do việc lạm dụng quá mức vũ khí hạt nhân."
 colony_mod.8.a:0 "Điều gì có thể đẩy muôn dân đến số phận nghiệt ngã như vậy?"
 colony_mod.9.name:0 "Chúng ta đơn giản là không biết."
 colony_mod.9.desc:0 "Bất chấp nghiên cứu sâu rộng về lịch sử của [Root.GetName], chúng ta đơn giản là không biết điều gì đã xảy ra ở đây. Quá khứ vẫn là một ẩn số."
 colony_mod.9.a:0 "Thật đáng bận tâm."
 colony_mod.10.name:1 "Trấn Áp"
 colony_mod.10.desc:1 "Bầu khí quyển của [Root.GetName] đã được làm sạch các thành phần gây say sưa!"
 colony_mod.11.name:1 "Trấn Áp: Đột Phá"
 colony_mod.11.desc:1 "Bầu khí quyển của [Root.GetName] đã được lọc để giảm đáng kể tác động của chất gây ảo giác."
 hallucinogen_update_tooltip:0 "A, không khí trong lành!"
 colony_mod.12.name:1 "Va Chạm Tiểu Hành Tinh"
 colony_mod.12.desc:1 "Một lần nữa, [Root.GetName] đã bị tàn phá bởi các tiểu hành tinh rơi xuống, và lần này một phần thuộc địa của chúng ta đã bị phá hủy. Không cần phải nói, người dân địa phương vô cùng bất bình."
 colony_mod.12.desc_gestalt:0 "Một lần nữa, [Root.GetName] đã bị tàn phá bởi các tiểu hành tinh rơi xuống, lần này phá hủy một phần thuộc địa của chúng ta. Hệ thống giám sát va chạm tự động của chúng ta vẫn cho thấy nguy cơ cao tiếp tục xảy ra những vụ va chạm tương tự trong tương lai."
 colony_mod.12.a:2 "Chúng ta có những ưu tiên khác."
 colony_mod.12.b:0 "Phải làm điều gì đó!"
 colony_mod.13.name:1 "Hệ Thống Phòng Thủ Tiểu Hành Tinh"
 colony_mod.13.desc:1 "Sự kết hợp giữa các kỹ thuật xây dựng siêu kiên cố và hệ thống phòng thủ tự động sẽ giữ cho thuộc địa trên [Root.GetName] an toàn trước các vụ va chạm tiểu hành tinh tiếp theo."
 irradiated_planet_tooltip:0 "Cuộc điều tra bắt đầu..."
 colony_mod.14.name:1 "Món Quà Từ Không Gian"
 colony_mod.14.desc:1 "Dù một tiểu hành tinh rơi xuống hành tinh có thể khiến thần kinh căng thẳng, [Root.GetName] lại khá may mắn. Không có tổn hại nào xảy đến với thuộc địa."
 colony_mod.14.a:0 "Nhân dân chúng ta sẽ chịu đựng được môi trường khắc nghiệt này."
 colony_mod.14.b:0 "Chúng ta phải tìm cách ngăn chặn điều này."
 colony_mod.16.name:1 "Phép Màu Từ Tính"
 colony_mod.16.desc:1 "Từ Trường Mạnh quanh [Root.GetName] gần đây đã ảnh hưởng đến các máy tính trên bề mặt. Kỳ lạ thay, tác động này không đơn thuần là nhiễu loạn ngẫu nhiên, mà thay vào đó các máy tính thực sự hoạt động hiệu quả hơn mức thông thường. Gần như thể có một thế lực bên ngoài đang chìa tay giúp đỡ..."
 colony_mod.17.name:1 "Nhiễu Loạn Từ Tính"
 colony_mod.17.desc:2 "Từ Trường Mạnh quanh [Root.GetName] luôn gây ra một số vấn đề với các thiết bị điện tử trên bề mặt, nhưng gần đây tác động lên máy tính của chúng ta đặc biệt đáng chú ý. Cho đến nay, vẫn chưa rõ nguyên nhân gây ra đợt bùng phát này, dẫu chúng ta nghi ngờ nó chỉ là tạm thời."
 colony_mod.21.name:0 "Động Đất: Báo Cáo Thiệt Hại"
 colony_mod.21.desc:0 "Trận động đất gần đây làm rung chuyển thuộc địa của chúng ta trên [Root.GetName] đã khiến một hố sụt lớn mở ra. Bất cứ thứ gì từng chiếm vị trí đó nay đã chìm sâu dưới lòng đất."
 colony_mod.22.desc:0 "Trận động đất gần đây làm rung chuyển thuộc địa của chúng ta trên [Root.GetName] không gây ra thiệt hại nào và tình cờ đã làm lộ ra một mẻ khoáng sản hữu ích."
 colony_mod.23.desc:0 "Trận động đất gần đây làm chao đảo thuộc địa của chúng ta trên [Root.GetName] không gây ra bất kỳ thiệt hại nào!"
 quake_report_tooltip:0 "Các báo cáo sẽ được gửi đi trong chốc lát."
 quake_sinkhole_tooltip:0 "Một £blocker£ §RHố Sụt§! xuất hiện."
 titanic_troop_limit_tooltip:0 "Những đột phá nghiên cứu đã cho phép chúng ta huấn luyện các Dạng Sống Titan thành các đơn vị quân sự, nhưng do độ hiếm của các đối tượng thích hợp, chúng ta sẽ chỉ có thể triển khai một số lượng hạn chế các Đội quân này vào một thời điểm."
 titantic_blocker_tooltip:0 "Chúng ta sẽ phải tránh những khu vực đó nếu từng đặt chân xuống đó."
 good_impact_tooltip:0 "May mắn thay, tiểu hành tinh không gây thiệt hại gì và đã để lại một số khoáng sản hữu ích trên bề mặt."
 colony_mod.100.name:0 "Hành Tinh Của Những Gã Titan"
 colony_mod.100.desc:0 "[From.GetName] là ngôi nhà của Sự Sống Titan, một số loài đông đúc và nguy hiểm đến mức khiến một số khu vực trên hành tinh không thể sinh sống được đối với bất kỳ giống loài nào."
 colony_mod.101.name:0 "Nghiên Cứu Sự Sống Titan: Thành Công"
 colony_mod.101.desc:0 "Sau một thời gian nghiên cứu và tìm hiểu, các nhà khoa học trên [Root.GetName] đã tạo ra bước đột phá và đạt được khả năng giao tiếp hạn chế với một số Titan. Dù to lớn, chậm chạp và khó trò chuyện, các Titan lại cực kỳ dẻo dai và mạnh mẽ. Một số ít đã bày tỏ mong muốn gia nhập lực lượng quân đội của chúng ta, nơi chúng chắc chắn sẽ là một tài sản vô giá."
 titanic_recruit_tooltip:0 "Các Dã Thú Titan nay có thể được chiêu mộ tại đây."
 titanic_recruit_phile_tooltip:0 "Các Dã Thú Titan có thể được chiêu mộ tại đây, và ngay cả những khu vực có số lượng lớn Sinh Vật Titan nay cũng đã an toàn cho cư dân thuộc địa."
 colony_mod.102.name:0 "Nghiên Cứu Sự Sống Titan: Thất Bại"
 colony_mod.102.desc:0 "Trong một chuỗi sự kiện thảm khốc, các nhà khoa học trên [Root.GetName] đã chọc giận các Sinh Vật Titan bản địa. Những sinh vật khổng lồ đang tàn phá khắp thuộc địa, đập tan mọi thứ trên đường đi của chúng."
 titanic_uprising_tooltip:0 "Dã Thú Titan đang tàn sát tất cả mọi người!"
 colony_mod.18.name:0 "Bí Ẩn Từ Tính Được Phơi Bày"
 colony_mod.18.desc:0 "[Root.GetName] là địa điểm của một máy tính lượng tử tự tổ chức với độ phức tạp và tinh vi đáng kinh ngạc. Các mô thức thời tiết, sự sống bản địa, thậm chí cả thuộc địa của chúng ta đều được tích hợp vào nó và bằng cách nào đó được sử dụng như các nơ-ron trong một mạng lưới quy mô hành tinh. Chúng ta không hiểu làm thế nào điều này khả thi, và chúng ta không có cách nào kiểm soát nó, nhưng chúng ta biết rằng nếu sắp xếp máy tính của mình theo một cách nhất định, [Root.GetName] sẽ tăng cường hiệu năng của chúng."
 colony_mod.18.a:0 "[Root.GetName] vừa trở nên hấp dẫn hơn!"
 colony.3001.name:0 "Mặt Trăng Bí Ẩn Của [Root.GetName]"
 colony.3001.desc:0 "Giờ đây khi [Root.GetName] đã được định cư một thời gian, một số bất thường về dữ liệu đã được chú ý. Cụ thể, mặt trăng [event_target:roguemoon.Planet.GetName] dường như không được cấu tạo từ vật chất tương tự như [Root.GetName]. Điều này cho thấy nó không được hình thành cùng một thời điểm, mà ban đầu hình thành ở nơi khác và bằng cách nào đó đã bị trọng lực của [Root.GetName] bắt giữ vào thời điểm sau này. Việc [event_target:roguemoon.Planet.GetName] thực sự đến từ đâu hiện vẫn là một bí ẩn."
 colony.3002.name:0 "Căn Cứ Mặt Trăng Lang Thang"
 colony.3002.desc:1 "Những bí ẩn của [event_target:roguemoon.Planet.GetName] đã được hé lộ! Một cuộc khảo sát chi tiết cho thấy mặt trăng hơi lệch, với mặt xa của mặt trăng chiếm tỷ trọng lớn bất thường trong tổng khối lượng. Lý do cho điều này, chúng ta tin rằng, là vì [event_target:roguemoon.Planet.GetName] từng quay quanh một hành tinh khác vốn đã bị phá hủy trong một vụ nổ thảm khốc.\n\nĐộ dày tăng thêm ở mặt xa của [event_target:roguemoon.Planet.GetName] là vì đó là mặt hướng về hành tinh ban đầu của nó, lượng vật chất dư thừa là một phần khối lượng của hành tinh đó bị thổi bay vào [event_target:roguemoon.Planet.GetName], đánh bật nó ra khỏi quỹ đạo và cuối cùng đưa nó vào quỹ đạo của [Root.GetName].\n\nChúng ta suy đoán rằng hành tinh đó đã bị phá hủy bởi một loại vũ khí, hoặc có lẽ chỉ là một nỗ lực tạo ra nguồn năng lượng dựa trên Vật Chất Tối, vì có nồng độ cao của nó trong lớp vật chất hành tinh phủ trên mặt xa của mặt trăng."
 colony.3003.name:0 "Những Kẻ Du Hành Dị Chiều"
 colony.3003.desc:0 "Việc làm sáng tỏ một bí ẩn đã dẫn đến một bí ẩn khác. Chúng ta nay biết rằng [event_target:roguemoon.Planet.GetName] đã bị kéo, hoặc được gửi, vào quỹ đạo của [Root.GetName] từ một chiều không gian khác. Thật không may, chúng ta không biết tại sao, vì ngoài mức bức xạ nền hơi khác biệt, [event_target:roguemoon.Planet.GetName] dường như hoàn toàn bình thường. Điều khó hiểu hơn nữa là cỗ máy được tìm thấy ở trung tâm [event_target:roguemoon.Planet.GetName], vốn được cho là đã kích hoạt sự chuyển dịch chiều không gian, hoạt động như thế nào. Hiện tại, nó chẳng khác gì phép thuật."
 colony.3005.name:0 "Cánh Cổng"
 colony.3005.desc:0 "Thứ chỉ có thể mô tả như một cổng chiều không gian đã được phát hiện tại một địa điểm xa xôi trên [Root.GetName]. Các thuật toán dự báo thời tiết nhận thấy một luồng không khí kỳ lạ, cuối cùng được xác định là do sự rò rỉ nhẹ của bầu khí quyển vào cánh cổng. Tốc độ mất mát quá nhỏ để có thể tạo ra bất kỳ sự khác biệt nào đối với sự sống trên [Root.GetName], nhưng chính sự tồn tại của cánh cổng này đặt ra một số câu hỏi đáng lo ngại, chẳng hạn như nó dẫn đến đâu, và liệu thứ gì đó có thể đi qua cánh cổng từ phía bên kia hay không?"
 portal_zone_tooltip:0 "Cổng Chiều Không Gian có thể được nghiên cứu liên tục."
 colony.3006.name:0 "Chiều Không Gian Đau Đớn"
 colony.3006.spir.desc:1 "Cổng Chiều Không Gian trên [Root.GetName] dường như dẫn đến một cõi tà ác và bất an. Bất kỳ và mọi sự tiếp xúc với vật chất từ chiều không gian này đều gây ra nỗi thống khổ tột cùng cho đối tượng, nếu kéo dài hơn vài phút sẽ dẫn đến thôi thúc tự sát dữ dội cùng với nỗ lực tự hủy hoại các cơ quan cảm giác. Ngay cả việc đơn thuần nghiên cứu dữ liệu được ghi lại trong chiều không gian kỳ lạ cũng gây ra các lỗi dây chuyền trong hệ thống máy tính, hoặc sự khó chịu tột cùng ở các sinh mệnh có tri giác do nhận thức kinh hoàng rằng chính linh hồn của một người đang bị tha hóa."
 colony.3006.desc:1 "Cổng Chiều Không Gian trên [Root.GetName] dường như dẫn đến một cõi đối nghịch với tâm trí có tri giác ở mức độ cơ bản. Bất kỳ và mọi sự tiếp xúc với vật chất từ chiều không gian này đều gây ra nỗi thống khổ tột cùng cho đối tượng, nếu kéo dài hơn vài phút sẽ dẫn đến thôi thúc tự sát dữ dội cùng với nỗ lực tự hủy hoại các cơ quan cảm giác. Ngay cả việc đơn thuần nghiên cứu dữ liệu được ghi lại trong chiều không gian kỳ lạ cũng gây ra sự khó chịu tột cùng ở người quan sát sinh học, và các lỗi dây chuyền trong hệ thống máy tính."
 colony.3006.knight.desc:0 "Cổng Chiều Không Gian trên [Root.GetName] dường như dẫn đến một cõi tà ác và bất an. Bất kỳ sự tiếp xúc trực tiếp nào với vật chất từ chiều không gian này đều gây ra nỗi thống khổ tột cùng cho đối tượng, nếu kéo dài hơn vài phút sẽ dẫn đến những thôi thúc bạo lực dữ dội. Ngay cả việc đơn thuần nghiên cứu dữ liệu ghi lại trong chiều không gian kỳ lạ cũng gây ra các lỗi dây chuyền trong hệ thống máy tính, hoặc sự khó chịu tột cùng ở các sinh mệnh có tri giác. Tuy nhiên, chúng ta đã phát hiện ra rằng một trong những thánh tích của Quân Đoàn có thể bảo vệ người đeo một cách hiệu quả, và sẽ cho phép chúng ta cử một hiệp sĩ duy nhất đi qua."
 colony.3006.science:0 "Tìm cách đóng Cánh Cổng!"
 colony.3006.prayer:0 "Cầu nguyện để tìm ra giải pháp"
 colony.3006.psi.prayer:0 "Có lẽ Tâm Linh Lực là giải pháp?"
 colony.3006.rocks:0 "Thử lấp đầy Cánh Cổng bằng đất đá!"
 colony.3006.knights:0 "Cử hiệp sĩ giỏi nhất của chúng ta vào!"
 colony.3006.keep:0 "Nghiên cứu Cánh Cổng"
 colony.3010.name:0 "Cánh Cổng Đã Đóng"
 colony.3010.desc:0 "Cánh Cổng được xác định là có thể xử lý lượng năng lượng đầu vào gần như vô hạn, nhưng từ khóa ở đây là \"gần như\". Bằng cách tạo ra năng lượng ở quy mô chưa từng có và liên tục bắn phá Cánh Cổng, cuối cùng đã có thể khiến nó quá tải và tự sụp đổ. Không cần phải nói, việc tạo ra lượng năng lượng khổng lồ có tiềm năng hữu ích trong các lĩnh vực khác."
 colony.3011.desc:0 "Cánh Cổng dường như phản ứng theo một cách nào đó với suy nghĩ của những người quan sát gần đó, một số người nhiều hơn những người khác. Thông qua quá trình sàng lọc, chúng ta đã tìm thấy một số lượng lớn những người có khả năng đặc biệt trong việc tác động lên Cánh Cổng, và cùng nhau họ đã có thể dùng ý chí để đóng Cánh Cổng lại một cách hiệu quả. Trải nghiệm này đã khai sáng và cung cấp bằng chứng mạnh mẽ rằng hoàn toàn có thể khai thác và định hướng niềm tin theo những cách hữu hình."
 colony.3011.psi.desc: "Cánh Cổng đã được chứng minh là nhạy cảm với lực tâm linh. Với một đội ngũ tập hợp gồm những cá nhân có thiên phú, chúng ta đã tạo ra một rào chắn tâm linh xung quanh cánh cổng, ngăn chặn mọi sự tiếp cận. Trải nghiệm này đã khai sáng và cung cấp bằng chứng mạnh mẽ rằng hoàn toàn có thể tạo thành các rào chắn kiên cố từ năng lượng tâm linh."
 colony.3011.psi_robot.desc: "Cánh Cổng đã được chứng minh là nhạy cảm với năng lượng tâm linh đầu vào. Thông qua việc sử dụng các đơn vị tâm linh của chúng ta, một rào chắn đã được xây dựng xung quanh cánh cổng, ngăn chặn sự tiếp cận trái phép. Dữ liệu từ sự kiện này sẽ tỏ ra hữu ích trong các nghiên cứu tương lai của chúng ta."
 colony.3012.desc:0 "Đôi khi câu trả lời đơn giản nhất lại là câu trả lời tốt nhất. Sau khi nổ tung vài ngọn núi thành sỏi đá và đổ toàn bộ vào cánh cổng, nó dường như đã bị quá tải. Hoặc, có lẽ, đã bị cố tình đóng lại. Bất kể thế nào, lượng vật liệu còn lại đã được đổ trùm lên địa điểm để phòng trường hợp nó mở lại. Kinh nghiệm từ một dự án kỹ thuật và khai khoáng quy mô lớn như vậy cũng sẽ tỏ ra hữu ích trong các lĩnh vực khác."
 portal_closed_tooltip:0 "Địa điểm Cổng vẫn có thể được nghiên cứu, nhưng nó sẽ cung cấp ít dữ liệu hữu ích hơn."
 colony.3007.name:0 "Chiều Không Gian Năng Lượng Cao"
 colony.3007.desc:1 "Cổng Chiều Không Gian trên [Root.GetName] dẫn đến một chiều không gian năng lượng thuần khiết, một lượng nhỏ trong số đó có thể được trích xuất qua cổng để chúng ta sử dụng. Các quy trình được sử dụng để xử lý các \"gói\" năng lượng riêng biệt cũng có tiềm năng sử dụng như một hệ thống vũ khí."
 portal_energy_tooltip:0 "$job_dimensional_portal_researcher_plural$ cũng sẽ sản xuất £energy£ Năng lượng"
 portal_void_tooltip:0 "$job_dimensional_portal_researcher_plural$ cũng sẽ sản xuất £sr_dark_matter£ Vật Chất Tối"
 colony.3008.name:0 "Thái Hư (The Null Void)"
 colony.3008.desc:0 "Cổng Chiều Không Gian trên [Root.GetName] dẫn đến một chiều không gian của entropy thuần khiết. Thậm chí rất khó để có được các chỉ số cảm biến vì chính năng lượng từ các tín hiệu quét của chúng ta nhanh chóng bị tiêu tán. Giả thuyết tốt nhất của chúng ta là \"Thái Hư\" này là một chiều không gian nơi phần lớn năng lượng điểm không là số âm và do đó bất kỳ năng lượng dương nào từng hiện diện đều đã cạn kiệt từ lâu. Biết được điều này, có thể chế tạo một loại vũ khí có thể sử dụng sự hủy diệt năng lượng của Thái Hư cho mục đích tấn công."
 colony.3009.name:0 "Thế Giới Gương (Mirror Mirror)"
 colony.3009.desc:0 "Kỳ lạ thay, Cổng Chiều Không Gian trên [Root.GetName] dường như kết nối với một hành tinh trông rất giống [Root.GetName]. Lạ lùng hơn nữa, có một tín hiệu đang được phát tới chúng ta qua đó..."
 colony.3009.a:0 "Đưa lên màn hình liên lạc!"
 colony.3020.name:0 "Liên Lạc Với Người Ngoài Hành Tinh Qua Cổng"
 colony.3020.desc:0 "Đây là [Root.Owner.Leader.GetName] của [Root.Owner.GetName]. Các người là ai, những người ngoài hành tinh qua cổng?"
 colony.3020.a:0 "Không, *TA* mới là [Root.Owner.Leader.GetName]! Ngươi là ai?!"
 colony.3021.desc:0 "Thật hấp dẫn. Nếu những gì ngươi nói là sự thật, ta nghĩ cánh cổng này là cầu nối khoảng cách giữa các chiều không gian song song. Chúng ta đều là [Root.Owner.Leader.GetName], nhưng tại một thời điểm nào đó, một sự kiện ắt hẳn đã khiến các chiều không gian tương ứng của chúng ta rẽ nhánh."
 colony.3021.a:1 "Thật kinh ngạc. Hãy cho chúng ta biết người [Root.Owner.Species.GetNamePlural] bên phía bạn ra sao!"
 colony.3021.b:0 "Chúng ta nên giao thương qua cánh cổng này."
 mirror_trade_reply:0 "Chính tôi cũng đang định đề xuất điều đó, vì lợi ích của toàn thể người [Root.Owner.Species.GetNamePlural]!"
 colony.3022.desc:0 "Phần lớn cũng giống như tình hình ở chiều không gian của bạn, tôi đồ là vậy. Chúng tôi đã tỏa ra khắp không gian từ [Root.Owner.Capital.GetName] kể từ khi phát hiện ra Động Cơ Uốn Cong (Warp Drive)—"
 colony.3022.a:0 "Động Cơ Uốn Cong ư? Chúng tôi du hành bằng các Siêu Lộ Vũ Trụ (Hyperlanes)!"
 colony.3023.desc:0 "Siêu Lộ Vũ Trụ ư? Có lẽ việc khám phá ra các phương thức du hành FTL khác nhau chính là điểm rẽ nhánh giữa hai vũ trụ của chúng ta? Điều này có nghĩa là bạn không bị quấy rầy bởi Quái Thú Uốn Cong (Warp beasts)?"
 colony.3023.a:0 "Không có Quái Thú Uốn Cong nào ở đây cả. Chúng có phải là mối đe dọa nghiêm trọng không?"
 colony.3024.desc:0 "Lũ Quái Thú Uốn Cong tấn công mọi nền văn minh đã biết, chúng là mối đe dọa đối với mọi sự sống. Theo những gì chúng tôi xác định được, một khi việc du hành Uốn Cong đạt đến một mức tới hạn nhất định trong thiên hà, Quái Thú Uốn Cong đã thức tỉnh và tấn công. Một số giống loài chúng tôi biết đã diệt vong, nhưng cho đến nay chúng tôi vẫn đang cầm cự được."
 colony.3024.a:0 "Nghe thật khủng khiếp. Chúng tôi có thể giúp được gì không?"
 mirror_trade_reply2:0 "Vâng, chúng ta nên thiết lập một hiệp ước thương mại liên chiều không gian để củng cố sức mạnh cho cả hai quốc gia. Vì lợi ích của toàn thể người [Root.Owner.Species.GetNamePlural]!"
 colony.3031.name:2 "Thương Mại Liên Chiều Không Gian Gia Tăng"
 colony.3031.desc:1 "[Root.Owner.GetName] ở Chiều Không Gian Gương báo cáo rằng nền kinh tế của họ đang bùng nổ. Các yếu tố đóng góp được đề cập là Thương Mại Qua Cổng của chúng ta, cũng như những chiến thắng gần đây trước Quái Thú Uốn Cong."
 colony.3032.name:2 "Thương Mại Liên Chiều Không Gian Suy Giảm"
 colony.3032.desc:1 "[Root.Owner.GetName] ở Chiều Không Gian Gương báo cáo rằng nền kinh tế của họ đang suy thoái do một loạt thất bại dưới nanh vuốt của Quái Thú Uốn Cong."
 colony.3032.a:0 "Hy vọng họ sẽ hồi phục!"
 colony.3033.name:1 "PHÁT SÓNG KHẨN CẤP QUA CỔNG"
 colony.3033.desc:1 "[Root.Owner.Capital.GetName] đã bị nuốt chửng. [Root.Owner.GetName] đã sụp đổ. Theo những gì chúng tôi biết, [Root.GetName] là thuộc địa duy nhất còn sót lại. Lũ Quái Thú Uốn Cong ở khắp mọi nơi! Chúng đã đến đây!\n\n**§YTín hiệu đột ngột chấm dứt§!**"
 colony.3033.a:0 "Alo?"
 colony.3033.b:0 "Bạn còn ở đó không?"
 colony.3033.c:0 "Trả lời đi!"
 colony.3033.d:0 "Họ đã đi rồi..."
 colony.3033.reply:0 "**§YChỉ còn tiếng rít của tạp âm tĩnh điện§!**"
 dportal_trade_normal:1 "Thương Mại Liên Chiều Không Gian"
 dportal_trade_normal_desc:0 "Giao thương với bản thể trong Chiều Gương sẽ mang lại lợi ích cho cả hai cõi của chúng ta."
 dportal_trade_normal_tooltip:0 "$mod_planet_physicists_amenities_produces_add$: §G+600§!"
 dportal_trade_low:1 "Thương Mại Liên Chiều Không Gian Bị Giảm"
 dportal_trade_low_desc:0 "Các sự kiện gần đây trong Vũ Trụ Gương đã làm giảm khối lượng giao thương qua Cổng."
 dportal_trade_low_tooltip:0 "$mod_planet_physicists_amenities_produces_add$: §G+300§!"
 dportal_trade_high:1 "Thương Mại Liên Chiều Không Gian Bùng Nổ"
 dportal_trade_high_desc:0 "Bản thể Chiều Gương của chúng ta đang phồn vinh và thương mại đang bùng nổ qua Cổng!"
 dportal_trade_high_tooltip:0 "$mod_planet_physicists_amenities_produces_add$: §G+1200§!"
 dportal_trade_crisis:1 "Khủng Hoảng Liên Chiều Không Gian"
 dportal_trade_crisis_desc:0 "Bản thể Chiều Gương của chúng ta đang trải qua một cuộc khủng hoảng. Bị bủa vây bởi Quái Thú Uốn Cong, thương mại của họ ở mức thấp nhất mọi thời đại, và người tị nạn tràn qua cổng hàng ngày. Mỗi làn sóng trông ngày càng tuyệt vọng."
 dportal_trade_crisis_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+200§!"

 colony.3050.name:0 "Hiệp Sĩ Hắc Ám"
 colony.3050.desc:0 "Hiệp sĩ [doomslayer_knight.GetName], người mà chúng ta đã cử qua cánh cổng trên [root.GetName] nhiều năm trước, đã trở lại. Bị tha hóa và nhuốm màu tăm tối, [doomslayer_knight.GetHeShe] đã dẫn đầu một đạo quân kinh hoàng đi qua cánh cổng và lập tức tấn công thuộc địa của chúng ta. Những người sống sót kể lại rằng đã nghe thấy [doomslayer_knight.GetHimHer] bật ra tiếng cười như ác quỷ, tuyên bố rằng [doomslayer_knight.GetHeShe] sẽ sớm chinh phục chiều không gian này."
 colony.3050.a:0 "Gióng chuông báo động!"
 demonic_armies_tooltip:0 "Nhiều §RĐạo Quân Ác Quỷ§! sẽ tấn công thuộc địa!"
 colony.3051.name:1 "Cuộc Xâm Lăng Của Ác Quỷ"
 colony.3051.desc:0 "Những nỗi kinh hoàng mà Hiệp sĩ [doomslayer_knight.GetName] dẫn đầu đi qua cổng đã chọc thủng phòng tuyến của chúng ta và chinh phục [fromfrom.GetName]!\n\nBị chiếm đoạt bởi một thực thể chiều không gian hùng mạnh và nay tự xưng [doomslayer_knight.GetHimselfHerself] danh hiệu §Y[doomslayer_knight.GetTitle] [doomslayer_knight.GetName]§!, [doomslayer_knight.GetHeShe] đã hiệu triệu lực lượng quỷ dữ của [doomslayer_knight.GetHimHer] để bắt đầu cuộc chinh phục thiên hà của chúng ta!\n\nCác cổng bổ sung đã mở ra chốc lát khắp hệ sao, nhưng áp lực lên thực tại là gánh nặng quá lớn. Tất cả các điểm kỳ dị đã sớm sụp đổ, cắt đứt đạo quân quỷ dữ khỏi chiều không gian quê nhà của chúng. Không hề nản lòng, [doomslayer_knight.GetFirstName] hiện đang củng cố căn cứ quyền lực của [doomslayer_knight.GetHisHer] trước khi tiếp tục các kế hoạch chinh phục thiên hà của [doomslayer_knight.GetHisHer]."
 colony.3051.a:0 "Chúng ta sẽ đánh bại những kẻ xâm lược này!"
 colony.3051.b:0 "Vì vinh quang của [doomslayer_knight.GetName]!"
 demonic_incursion_tooltip:0 "Cổng Chiều Không Gian trên [fromfrom.GetName] sẽ đóng lại.\nHệ sao [fromfrom.solar_system.GetName] đã bị §Rchinh phục§! bởi [demonic_incursion_country.GetName]."
 demonic_takeover_tooltip:0 "$demonic_incursion_tooltip$\n\nChơi với tư cách là §R[demonic_incursion_country.GetName]§!."
 colony.3055.name:0 "Người Tị Nạn Dị Chiều"
 colony.3055.desc:0 "Cánh cổng trên [Root.GetName], nơi chúng ta đã cử Hiệp sĩ [doomslayer_knight.GetName] đi qua nhiều năm trước, đang có dấu hiệu hoạt động dữ dội khi những người dân rách rưới dường như đang cố gắng vượt biên vào chiều không gian của chúng ta. Họ báo cáo rằng Hiệp sĩ [doomslayer_knight.GetFirstName] đã tàn phá trong chiều không gian của họ suốt một thập kỷ qua, tàn sát không thương tiếc bất kỳ ai cản đường [doomslayer_knight.GetHisHer]. [doomslayer_knight.GetHeSheCap] đã hạ sát quá nhiều cư dân của chiều không gian đó đến mức sự diệt vong đã ập xuống xã hội của họ. Những người sống sót đang cố gắng chạy trốn đến bất cứ nơi nào họ có thể. Liệu nỗi đau sinh tồn do chiều không gian này gây ra có khiến [doomslayer_knight.GetName] phát điên?"
 colony.3055.a:0 "Hạ sát những kẻ xâm lược!"
 colony.3055.b:0 "Họ được chào đón ở lại."
 demon_refugees_tooltip:0 " §Y4 dân số $NAME_Demon_Refugees$§! sẽ được tạo ra trên [Root.GetName]."
 colony.3060.name:0 "Trở Về Từ Địa Ngục"
 colony.3060.desc:0 "Hiệp sĩ [doomslayer_knight.GetName], người mà chúng ta đã cử qua cánh cổng trên [root.GetName] nhiều năm trước, đã trở lại. [doomslayer_knight.GetHeSheCap] đã vượt qua muôn vàn thử thách, đốn ngã vô số quái vật và suýt soát giữ được mạng sống của [doomslayer_knight.GetHisHer], nhưng cuối cùng, không gì có thể cản bước [doomslayer_knight.GetHimHer]. [doomslayer_knight.GetHeSheCap] đã mang về rất nhiều chiến lợi phẩm và đã trở thành một huyền thoại trong giới tùy tùng, những người đã bắt đầu gọi [doomslayer_knight.GetHimHer] là \"Kẻ Diệt Vong\" (Doomslayer)."
 colony.3060.a:0 "[doomslayer_knight.GetFirstName] thực sự dũng cảm, dữ dội và hào hiệp!"
 doomslayer_quest_complete:0 "Chiến Lợi Phẩm Của Doomslayer"
 doomslayer_quest_complete_desc:0 "Chiến lợi phẩm và những câu chuyện về hành trình của một hiệp sĩ qua một chiều không gian địa ngục. Nguồn cảm hứng cho nhiều hiệp sĩ và tùy tùng, những người khao khát một ngày nào đó được thực hiện một nhiệm vụ như vậy."
