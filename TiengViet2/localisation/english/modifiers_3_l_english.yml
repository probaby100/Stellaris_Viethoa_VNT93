 dark_immortal_control: "Sự Hiện Diện Của Kẻ Bất Tử Bóng Đêm"
 dark_immortal_control_desc: "Thế giới này chịu đau khổ trước sự hiện diện của một thế lực hắc ám. Sự sản xuất nở rộ trong u buồn."
 remnants_of_court_of_blossoms: "Tàn Tích Của Triều Đình Hoa Nở"
 remnants_of_court_of_blossoms_desc: "Thế giới này phát triển thịnh vượng trên những tàn tích của nơi từng là Triều Đình Hoa Nở."
 happy_anathari: "Tương Lai Thống Nhất"
 happy_anathari_desc: "Kể từ ngày này trở đi, số phận của chúng ta gắn liền với người Anathari. Cùng nhau, chúng ta sẽ vun đắp một tương lai chung, và thế giới đã bừng lên sự sống mới, bầu trời rực sáng niềm hy vọng."
 black_crystal_no_grand_archive: "Sự Hiện Diện Của Tinh Thể Đen"
 black_crystal_no_grand_archive_desc: "Tinh thể đen mang lại hạnh phúc cho mọi người ở khu vực lân cận nó."
 black_crystal_engine_speed: "Nhiên Liệu Tinh Thể Đen"
 black_crystal_engine_speed_desc: "Tinh Thể Đen được cấu thành từ một loại vật chất giúp tăng cường khả năng đẩy của thuyền phương chu."
 mysterious_doll: "Câu Đố Bí Ẩn"
 mysterious_doll_desc: "Các nhà khoa học của chúng ta liên tục quay trở lại với cổ vật, luôn bị mê hoặc bởi tiềm năng vô tận về những hiểu biết mới mà nó tiếp tục mang lại."
 happy_giants: "Sân Chơi Của Những Người Khổng Lồ"
 happy_giants_desc: "Mọi người trên Thuyền Phương Chu §Y[Root.GetName]§! đều bị mê hoặc bởi những chú Tiyanki con đang nô đùa và cảm thấy vui vẻ, thư thái hơn nhiều so với trước đây."
 steris_core_conspiracy_modifier: "Tiến Bộ Hệ Thống"
 steris_core_conspiracy_modifier_desc: "Các hệ thống trên Thuyền Phương Chu §Y[Root.GetName]§! hoạt động nhanh hơn và hiệu quả hơn."
 caeli_core_conspiracy_modifier: "Tiến Bộ Cảm Xúc"
 caeli_core_conspiracy_modifier_desc: "Cư dân trên Thuyền Phương Chu §Y[Root.GetName]§! cảm thấy nhẹ nhõm và vui vẻ hơn."
 statue_modifier: "Bức Tượng Bất Thường"
 statue_modifier_desc: "Việc di dời vật phẩm nghi lễ này đã gây ra bất ổn trên Thuyền Phương Chu §Y[Root.GetName]§!. Dù vậy, tính đối xứng phi tự nhiên của nó vẫn tạo ra một sức hút kỳ lạ."
 etherdrake_scales_modifier: "Tri Thức Từ Vảy Rồng"
 etherdrake_scales_modifier_desc: "Kiến thức chúng ta thu được từ việc thu hoạch vảy Rồng Ê-te giúp cải thiện các cơ chế phòng thủ của Thuyền Phương Chu."
 farms_in_flames_modifier: "Nông Trại Trong Biển Lửa"
 farms_in_flames_modifier_desc: "Các khu nông nghiệp đã bị cố ý phóng hỏa nhằm chặn đứng đợt bùng phát nấm, làm giảm mạnh sản lượng lương thực trong khi thanh trừng sự lây nhiễm."
 mycelial_intelligence_modifier: "$arkship.1225.name$"
 mycelial_intelligence_modifier_desc: "Mạng lưới khuẩn ty xâm lấn trên §YThuyền Phương Chu [Root.GetName]§! đã được cải biến để tăng cường tái phân phối chất dinh dưỡng, cải thiện đáng kể hiệu quả nông nghiệp và sản lượng lương thực tổng thể."
 funghi_friends_modifier: "Nấm Là Bạn Tốt"
 funghi_friends_modifier_desc: "Mạng lưới nấm trên §YThuyền Phương Chu [Root.GetName]§! hiện đang phối hợp nhịp nhàng với các hệ thống nông nghiệp của chúng ta, tăng cường khả năng chống chịu của cây trồng và phân phối dinh dưỡng qua mối liên kết cộng sinh độc đáo."
 unknown_resource_demolished: "Không Gian Tái Sử Dụng"
 unknown_resource_demolished_desc: "Một phân khu trái phép trên Thuyền Phương Chu đã bị phá dỡ và không gian được tái sử dụng, giải phóng chỗ ở và cải thiện điều kiện sống."
 wellness_retreat_permitted: "Khu Nghỉ Dưỡng Được Phê Duyệt"
 wellness_retreat_permitted_desc: "Một khu nghỉ dưỡng bí mật đã được chính thức cấp phép, mang lại nơi nghỉ ngơi và hồi phục giúp cải thiện phúc lợi của phi hành đoàn."
 arkship_order_restored: "Trật Tự Được Tái Lập"
 arkship_order_restored_desc: "Những cư dân trái phép đã bị đưa ra khỏi Thuyền Phương Chu, tái lập cảm giác trật tự và ổn định trên tàu."
 arkship_purge_enacted: "Thi Hành Thanh Trừng"
 arkship_purge_enacted_desc: "Những kẻ bất đồng chính kiến đã bị cưỡng bức đưa ra khỏi Thuyền Phương Chu. Trật tự đã được tái lập vững chắc, dẫu sự khắc nghiệt của hành động này đã để lại dấu ấn trong lòng phi hành đoàn."

