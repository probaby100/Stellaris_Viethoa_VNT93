 harmonious_tune:0 "Giai Điệu Hài Hòa"
 harmonious_tune_desc:0 "Mọi thứ nên phục vụ tập thể. Giai điệu này được dùng để ổn định kết nối giữa các drone của chúng ta và tổ ong rộng lớn hơn."

 ####################################
 # Edicts
 ####################################
 edict_masters_writings_politics:0 "Lời Dạy Của Bậc Thầy: Đại Nghĩa Tối Cao"
 edict_masters_writings_politics_desc:0 "Bản dịch lời dạy của một nhà triết học ngoại tộc. Chúng ta có thể đạt được những bước tiến lớn về cơ sở hạ tầng bằng cách làm theo lời khuyên của bà về cách đoàn kết người dân thông qua sự hy sinh vì tập thể.\n\n\"Một quốc gia hùng mạnh được xây dựng dựa trên sự hy sinh tiện nghi, miễn là tất cả mọi người cùng nhau gánh vác gánh nặng ấy.\" - Telisa, Người Kể Chuyện\n\n"
 edict_masters_writings_philosophy:0 "Lời Dạy Của Bậc Thầy: Tư Duy Triết Học"
 edict_masters_writings_philosophy_desc:0 "Bản dịch lời dạy của một nhà triết học ngoại tộc. Văn bản chứa đựng nhiều phân tích và suy ngẫm về ý nghĩa cuộc sống cùng mục đích của vũ trụ. Bằng cách để các nhà lãnh đạo làm theo lời khuyên này, chúng ta có thể đưa ra những quyết định sáng suốt hơn.\n\n\"Câu trả lời cho mục đích của vũ trụ nằm bên ngoài chúng ta, nhưng điều đó không làm giảm đi khát khao kiếm tìm của chúng ta. Chúng ta phải nỗ lực vì sự thống nhất để chạm tới câu trả lời tại cội nguồn của vạn vật.\" - Telisa, Người Kể Chuyện\n\n"
 edict_masters_writings_diplomacy:0 "Lời Dạy Của Bậc Thầy: Niềm Tin Ngoại Giao"
 edict_masters_writings_diplomacy_desc:0 "Bản dịch lời dạy của một nhà triết học ngoại tộc. Những giai thoại của bà từ các cuộc đàm phán ngoại giao có thể đóng vai trò là nền tảng tốt cho các mối quan hệ bang giao.\n\n\"Gặp gỡ những đứa con của vũ trụ có thể đem lại cảm giác hoang mang, nhưng suy cho cùng đó là một cơ hội cho niềm hy vọng. Hãy là người hiếu khách với láng giềng và hân hoan trước sự hiện diện của họ, bởi phước lành họ mang lại là sự chấm dứt nỗi cô độc giữa khoảng không vô tận.\" - Telisa, Người Kể Chuyện\n\n"
 edict_masters_writings_war:0 "Lời Dạy Của Bậc Thầy: Các Quốc Gia Chiến Tranh"
 edict_masters_writings_war_desc:0 "Bản dịch lời dạy của một nhà triết học ngoại tộc. Những mô tả của bà về chiến tranh và các ý tưởng về chiến lược tác chiến có thể trở thành tài liệu huấn luyện tuyệt vời cho quân đội chúng ta.\n\n\"Tạo dựng sự thống nhất là thách thức lớn nhất, đặc biệt vì tính bền vững thường sinh ra các ranh giới. Những ranh giới này cần phải bị phá bỏ - một cảm giác khiến nhiều người khiếp sợ. Đôi khi người ta phải sẵn sàng đập bỏ để xây dựng một thứ gì đó vững chắc hơn từ đống tro tàn.\" - Telisa, Người Kể Chuyện\n\n"
 edict_improved_work_environment:0 "Cải Thiện Môi Trường Làm Việc"
 edict_improved_work_environment_desc:0 "Dành thời gian và tài nguyên để cải thiện điều kiện làm việc của người dân chắc chắn sẽ mang lại kết quả tốt hơn và những công nhân hạnh phúc hơn.\n\n"
 edict_renewable_energy:0 "Sáng Kiến Năng Lượng Cải Tiến"
 edict_renewable_energy_desc:0 "Chúng ta có thể hạn chế hơn nữa việc sử dụng nhiên liệu độc hại và các nguồn tài nguyên không tái tạo nhằm thúc đẩy nghiên cứu các phương pháp sản xuất năng lượng mới. Điều này có thể giúp chúng ta tiến gần hơn tới một chu trình năng lượng hoàn hảo và cải thiện môi trường cho người dân hưởng thụ.\n\n"
 edict_super_sensors:0 "Tìm Kiếm Cảm Biến Diện Rộng"
 edict_super_sensors_desc:0 "Sau khi nghiên cứu công nghệ cảm biến tiên tiến, chúng ta có đủ thông tin để dồn thêm tài nguyên nâng cao các lượt quét tìm kiếm. Các kỹ thuật viên của chúng ta sẽ dễ dàng hơn trong việc tìm kiếm các mục tiêu đáng chú ý ở rìa các hệ sao nhờ sáng kiến này.\n\n"

 ####################################
 # Planet Modifiers
 ####################################
 acid_jungles:0 "Rừng Nhiệt Đới Axít"
 acid_jungles_desc:0 "Sự tiến hóa đã tạo ra những loài cây và tán lá tiết ra axít, khiến địa hình trở nên nguy hiểm khi di chuyển qua hoặc định cư."
 ex_planet:0 "Hành Tinh Cũ"
 ex_planet_desc:0 "Vành đai tiểu hành tinh này từng là một hành tinh đầy hứa hẹn về sự sống."
 ship_graveyard:0 "Nghĩa Địa Chiến Hạm Sao"
 ship_graveyard_desc:0 "Vô số chiến hạm liên sao đã đâm xuống nơi đây, tạo thành một nghĩa địa thực sự chứa đầy vật liệu có thể thu hồi."
 ai_fleet:0 "Hạm Đội AI Rơi Vỡ"
 ai_fleet_desc:0 "Một hạm đội do AI điều khiển nằm tan nát trên hành tinh, mang lại cho chúng ta dữ liệu kỹ thuật giá trị để nghiên cứu."
 irradiated_wasteland:0 "Vùng Đất Hoang Nhiễm Xạ"
 irradiated_wasteland_desc:0 "Hành tinh đã bị oanh kích bởi bức xạ, khiến phần lớn diện tích trở nên nguy hiểm đối với hầu hết sinh vật sống."
 ancient_one:0 "Thực Thể Cổ Xưa"
 ancient_one_desc:0 "Một thực thể cổ xưa sống sâu dưới đáy sóng biển là nguồn sống thống trị hành tinh này."
 food_rich_planet:0 "Lương Thực Bổ Dưỡng"
 food_rich_planet_desc:0 "Hệ thực vật của hành tinh cung cấp các loại trái cây và dưỡng chất bổ dưỡng giúp cải thiện điều kiện sống."
 super_sensor_array:0 "Dàn Cảm Biến Vượt Trội"
 super_sensor_array_desc:0 "Một dàn cảm biến mạnh mẽ cung cấp cái nhìn tổng quan rộng lớn hơn về khu vực xung quanh."
 horse_powered_factories_low:0 "Cưỡng Bức Lao Động Động Vật"
 horse_powered_factories_medium:0 "Lao Động Động Vật Miễn Cưỡng"
 horse_powered_factories_high:0 "Lao Động Động Vật Tự Nguyện"
 horse_powered_factories_low_desc:0 "Động vật bốn chân được thuần hóa giúp giảm bớt gánh nặng điều kiện làm việc, dù không tự nguyện."
 horse_powered_factories_medium_desc:0 "Động vật bốn chân được thuần hóa giúp giảm bớt gánh nặng điều kiện làm việc, dù một cách miễn cưỡng."
 horse_powered_factories_high_desc:0 "Các loài bốn chân đồng minh giúp giảm bớt gánh nặng điều kiện làm việc."
 fallen_robots:0 "Tàn Tích Robot"
 fallen_robots_desc:0 "Hành tinh chứa các robot cũ do một xã hội suy tàn chế tạo, cung cấp cho chúng ta vật liệu kỹ thuật để nghiên cứu."
 society_animal_life:0 "Đời Sống Động Vật Kỳ Lạ"
 society_animal_life_desc:0 "Những loài động vật đặc biệt kỳ lạ cư trú trên hành tinh này. Chúng mang lại những cơ hội nghiên cứu xã hội thú vị."
 hostile_animal_life:0 "Đời Sống Động Vật Nguy Hiểm"
 hostile_animal_life_desc:0 "Hành tinh này là ngôi nhà của những sinh vật hung hãn, không hề vui vẻ khi nhìn thấy chúng ta."
 shifting_sands:0 "Cát Lún Dịch Chuyển"
 shifting_sands_desc:0 "Hành tinh sa mạc bao gồm cát hạt mịn gần như chất lỏng, khiến việc xây dựng trở nên vô cùng khó khăn."
 liquid_sands:0 "Cát Dạng Lỏng"
 liquid_sands_desc:0 "Cát bao phủ hành tinh này mịn đến mức trông như chất lỏng. Thành phần khoáng chất kỳ lạ mang lại nhiều cơ hội nghiên cứu."
 abandoned_mining:0 "Cơ Sở Khai Khoáng Bỏ Hoang"
 abandoned_mining_desc:0 "Một trạm khai khoáng cũ từng quay quanh hành tinh, cho thấy có nguồn tài nguyên tiềm năng ở nơi đây."
 gas_rich_planet:0 "Trữ Lượng Khí Phong Phú"
 gas_rich_planet_desc:0 "Xây dựng một thuộc địa trên hành tinh này để bắt đầu khai thác tài nguyên.\n£energy£ §G+50%§!"
 gas_rich_planet_fo_realz:0 "Khai Thác Khí Quy Mô Lớn"
 gas_rich_planet_fo_realz_desc:0 "Các nguồn tài nguyên thiên nhiên thưa thớt trên hành tinh này hiện đang được khai thác ồ ạt để tăng cường sản lượng năng lượng tổng thể."
 gas_responsible_mining:0 "Khai Thác Khí Có Trách Nhiệm"
 gas_responsible_mining_desc:0 "Việc tiết kiệm nguồn tài nguyên khí hiếm nhưng quý giá trên hành tinh này giúp sản xuất năng lượng đạt hiệu quả cao hơn về lâu dài."
 suppressed_opposition:0 "Phe Đối Lập Bị Trấn Áp"
 suppressed_opposition_desc:0 "Một bộ phận dân số của hành tinh này đã bị đàn áp dữ dội vì phản đối chính phủ."
 scared_population:0 "Dân Chúng Sợ Hãi"
 scared_population_desc:0 "Dân chúng làm việc trong nỗi sợ hãi rằng một nhà máy của người ngoài hành tinh sẽ cướp đi thêm nhiều mạng sống."
 secured_factory:0 "Nhà Máy Ngoại Tộc Được Kiểm Tra An Toàn"
 secured_factory_desc:0 "Chi phí và công sức được bỏ ra để đảm bảo một nhà máy ngoại tộc an toàn khi làm việc bên trong."
 fear_as_control:0 "Thiết Cổ Thống Trị"
 fear_as_control_desc:0 "Những kẻ vi phạm đã bị trừng phạt nhằm thúc đẩy người dân hành động."
 fear_as_control_militarist:0 "$fear_as_control$"
 fear_as_control_militarist_desc:0 "$fear_as_control_desc$"
 infectious_disease:0 "Bệnh Truyền Nhiễm"
 infectious_disease_desc:0 "Một căn bệnh có khả năng lây nhiễm cao đã bùng phát, tạo ra các biến chủng mới và đe dọa người dân."
 pyramid_wars:0 "Cuộc Chiến Của Người Trời"
 pyramid_wars_desc:1 "Người dân đã nổ ra một cuộc chiến toàn diện do xung đột tôn giáo liên quan đến bản chất thực sự của 'Vị Thần Người Trời'."
 syndaw_automated_work:0 "Quy Trình Làm Việc Tự Động Hóa"
 syndaw_automated_work_desc:0 "Dù có cơ sở hay không, nỗi sợ thất nghiệp do tự động hóa đang ảnh hưởng đến hành tinh này."
 syndaw_unfriendly_robots:0 "Căng Thẳng Hòa Nhập Robot"
 syndaw_unfriendly_robots_desc:0 "Căng thẳng giữa các cộng đồng dân cư robot và hữu cơ trên hành tinh đã làm giảm sản lượng £unity£ Thống Nhất của chúng ta."
 syndaw_research_malus:0 "Sự Cố AI"
 syndaw_research_malus_desc:1 "Một AI trong phòng thí nghiệm nghiên cứu xã hội đã bị hư hỏng phần cứng nghiêm trọng và đang được thay thế."
 snake_infestation:0 "Xứ Sở Rắn Hoành Hành"
 snake_infestation_desc:0 "Rắn! Rắn ở khắp mọi nơi! Chúng ta quá bận rộn đối phó với chúng nên không thể làm... những việc khác."
 energy_poor:0 "Cạn Kiệt Năng Lượng"
 energy_poor_desc:0 "Không muốn làm bạn hoảng sợ, nhưng rắn đang cuộn tròn quanh các máy phát điện và hút cạn năng lượng."
 mining_equipment_offline:0 "$d_abandoned_mining_tunnels$"
 mining_equipment_offline_desc:0 "$snake_infestation_desc$"
 locust_planet_cracked:0 "Hành Tinh Tan Vỡ"
 locust_planet_cracked_desc:0 "Hành tinh này đã bị tước đoạt gần như mọi sự sống và vỡ tan bởi một đợt bùng nổ năng lượng khổng lồ. Dấu hiệu duy nhất của sự sống thông minh trước đây là một trạm không gian quỹ đạo đổ nát và các dấu vết rải rác dưới bề mặt nứt nẻ."
 nascent_locust:0 "Châu Chấu Mới Nở"
 nascent_locust_desc:0 "Hành tinh này tự hào có một lượng lớn sinh vật dễ tiêu diệt nhưng sinh sản nhanh chóng. Bất kỳ ai cố gắng sống sót trên bề mặt sẽ phải điều chỉnh cơ sở hạ tầng để ứng phó với các cuộc tấn công không thường xuyên của côn trùng khổng lồ."
 stratovents: "Miệng Phun Khí Bình Lưu"
 stratovents_desc: "Những cấu trúc khoáng chất sừng sững phun các luồng khí cuồn cuộn vào tầng nhiệt."
 stratovent_world_modifier_tourism: "Miệng Phun Khí Bình Lưu Nguyên Sơ"
 stratovent_world_modifier_tourism_desc: "Những miệng phun khí bình lưu tráng lệ này được giữ nguyên vẹn để cho phép loài Tiyanki gặm nhấm khí quyển."
 stratovent_world_modifier_tourism_tt: "$biologist_is_vent_researcher_tt$\n$mod_planet_biologists_amenities_produces_add$: §G+300§!"
 stratovent_world_modifier_refining: "Nhà Máy Tinh Chế Miệng Phun Bình Lưu"
 stratovent_world_modifier_refining_desc: "Khí thải từ những miệng phun bình lưu khổng lồ này đã được thu hồi và tinh chế thành Khí Ngoại Tộc quý giá."
 stratovent_world_modifier_tourism_boost: "Đài Quan Sát Miệng Phun Bình Lưu"
 stratovent_world_modifier_tourism_boost_desc: "Du lịch miệng phun bình lưu ở tầm cao hơn với các đài quan sát chuyên dụng để theo dõi hành vi ăn uống của loài Tiyanki hùng vĩ."
 stratovent_world_modifier_tourism_boost_tt: "$stratovent_world_modifier_tourism_tt$"
 stratovent_world_modifier_refining_upg: "Mở Rộng Miệng Phun Bình Lưu"
 stratovent_world_modifier_refining_upg_desc: "Việc kích nổ thành công các đường thoát mới cho khí ngầm đã dẫn đến sản lượng tăng lên."
 stratovent_world_modifier_refining_minerals: "Miệng Phun Khí Bình Lưu Sập Đổ"
 stratovent_world_modifier_refining_minerals_desc: "Mặc dù sự thất bại một phần trong việc mở rộng miệng phun đã làm giảm sản lượng, nhưng nó cũng tạo ra các mỏ khoáng sản phong phú."
 planet_new_colony_spiritualist_attraction: "$promoted_spiritualist$"
 planet_new_colony_spiritualist_attraction_desc: "$promoted_spiritualist_desc$"
 planet_new_colony_materialist_attraction: "$promoted_materialist$"
 planet_new_colony_materialist_attraction_desc: "$promoted_materialist_desc$"
