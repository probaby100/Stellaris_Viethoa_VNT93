 ####################################
 # Planet Modifiers
 ####################################
 capital:0 "Hành tinh thủ đô"
 capital_desc:0 "Hành tinh thủ đô của đế chế giữa các vì sao tràn ngập các tòa nhà chính phủ, văn phòng và cơ quan hành chính cao chọc trời."
 distance_from_capital:0 "Cách xa thủ đô"
 managed_by_sector:0 "Thuộc quyền quản lý của khu vực"
 hazardous_weather:0 "Thời tiết khó lường"
 hazardous_weather_desc:0 "Hành tinh này có sự biến đổi thời tiết rất khó lường, thường xuyên xuất hiện những cơn bão dữ dội bất ngờ tàn phá bề mặt."
 dangerous_wildlife:1 "Động vật hoang dã nguy hiểm"
 dangerous_wildlife_desc:2 "Hành tinh này đã tiến hóa một hệ động vật cực kỳ hung dữ, bề mặt đầy rẫy những loài săn mồi chết chóc luôn chực chờ phục kích con mồi. Cấu tạo sinh lý của những sinh vật này cũng mang đến cơ hội nghiên cứu tuyệt vời."
 weak_magnetic_field:0 "Từ trường yếu"
 weak_magnetic_field_desc:1 "Mặc dù có thể sinh sống, nhưng từ trường cực yếu của hành tinh này gần như không thể cản được bức xạ vũ trụ."
 unstable_tectonics:0 "Kiến tạo bất ổn"
 unstable_tectonics_desc:0 "Hành tinh này có cấu trúc kiến tạo mảng rất thiếu ổn định, dễ xảy ra những trận động đất và núi lửa phun trào quy mô lớn."
 tidal_locked:0 "Khóa thủy triều"
 tidal_locked_desc:0 "Hành tinh này bị khóa chặt bởi ngôi sao mà nó quay quanh, nghĩa là nó không tự quay quanh trục. Hai nửa hành tinh bị chia cắt thành ánh sáng vĩnh cửu và bóng tối vĩnh hằng. Nếu thế giới này thực sự có sự sống, nó sẽ chỉ xuất hiện ở ranh giới giữa hai bên."
 chthonian_planet:0 "Hành tinh lõi đá"
 chthonian_planet_desc:0 "Hành tinh này từng là một hành tinh khí khổng lồ, nhưng vì quá gần ngôi sao chủ nên toàn bộ khí quyển đã bị thiêu rụi, chỉ để lại một lõi hành tinh đặc và cực kỳ giàu khoáng sản."
 brown_dwarf:0 "Sao lùn nâu"
 brown_dwarf_desc:0 "Hành tinh khí khổng lồ này thực chất là một ngôi sao lùn nâu - một ngôi sao thất bại, không đủ khối lượng cần thiết để duy trì phản ứng nhiệt hạch hydro. Đặc tính này khiến nó có giá trị nghiên cứu rất lớn."
 asteroid_impacts:0 "Tiểu hành tinh va chạm"
 asteroid_impacts_desc:0 "Quỹ đạo của hành tinh này rải rác vô số tiểu hành tinh, sao băng và sao chổi, chúng thường xuyên đâm xuống bề mặt."
 extensive_moon_system:0 "Hệ thống vệ tinh đồ sộ"
 extensive_moon_system_desc:0 "Hành tinh khí khổng lồ này sở hữu số lượng vệ tinh tự nhiên nhiều một cách bất thường, quỹ đạo tràn ngập hàng trăm vệ tinh nhỏ."
 carbon_world:0 "Thế giới carbon"
 carbon_world_desc:0 "Hành tinh này có cấu tạo chủ yếu từ carbon, với hàm lượng oxy cực thấp."
 asteroid_coprolite:0 "Tiểu hành tinh phân hóa thạch"
 asteroid_coprolite_desc:1 "Tiểu hành tinh này thực chất là một viên phân hóa thạch khổng lồ - chất thải đã hóa thạch từ thời cổ đại của một dạng sống khổng lồ nào đó."
 asteroid_life:0 "Sự sống trên tiểu hành tinh"
 asteroid_life_desc:1 "Tiểu hành tinh này là hang ổ của một loài giun hóa thạch khổng lồ. Chúng ta có thể thu thập được nhiều thông tin quý giá qua việc nghiên cứu hình thái sự sống độc đáo này."
 derelict_shipyard:0 "Xưởng đóng tàu bỏ hoang"
 derelict_shipyard_desc:1 "Từng có một xưởng đóng tàu quy mô lớn nằm sâu trong tiểu hành tinh này. Tuy các cổ vật quý giá đã không còn, nhưng tàn tích kiến trúc để lại vẫn là một kỳ quan kỹ thuật."
 junkyard:0 "Bãi phế liệu"
 junkyard_desc:1 "Tiểu hành tinh này từng là một bãi phế liệu, bề mặt vương vãi những mảnh vỡ kim loại. Trong số đó vẫn còn vài món đồ cũ có giá trị trục vớt."
 target_range:0 "Trường bắn mục tiêu"
 target_range_desc:1 "Tiểu hành tinh đáng thương này từng bị dùng làm bia đỡ đạn để thử nghiệm vũ khí không gian con, bề mặt của nó vẫn còn lưu lại những tín hiệu năng lượng bất thường."
 ore_freighter:0 "Tàu chở quặng đâm sầm"
 ore_freighter_desc:1 "Hàng nghìn năm trước, một con tàu chở quặng khổng lồ đã đâm sầm vào tiểu hành tinh này. Hiện tại, hàng hóa từ khoang chứa vẫn nằm rải rác trên bề mặt."
 atmospheric_ecosystem:0 "Hệ sinh thái khí quyển"
 atmospheric_ecosystem_desc:1 "Tầng khí quyển trên cao của hành tinh khí khổng lồ này là một hệ sinh thái quan trọng, nơi cư trú của nhiều loài sinh vật ngoài hành tinh. Hệ thống sinh học thú vị này rất đáng để chúng ta nghiên cứu."
 aerostat_colonies:0 "Thuộc địa nổi"
 aerostat_colonies_desc:1 "Chúng ta vẫn có thể tìm thấy tàn tích của các thuộc địa nổi cổ đại trên quỹ đạo thấp của hành tinh khí khổng lồ này. Thiết kế đặc biệt kiên cố của chúng là một sản phẩm kỹ thuật tiên tiến."
 debris_field:0 "Bãi mảnh vỡ"
 debris_field_desc:1 "Một đống mảnh vỡ không gian đã bị giếng trọng lực mạnh mẽ của hành tinh khí khổng lồ này hút vào. Dù phần lớn là phế liệu, nhưng lượng kim loại trong đó vẫn có thể tái chế để sử dụng."
 extreme_storms:0 "Siêu bão"
 extreme_storms_desc:1 "Vô số những cơn bão khổng lồ đang hoành hành trên hành tinh khí này. Các mô hình khí hậu hiện tại không thể lý giải được hiện tượng này, biến nó thành một đối tượng nghiên cứu cực kỳ giá trị."
 precious_moon:0 "Vệ tinh trân bảo"
 precious_moon_desc:1 "Trong hệ thống vệ tinh tự nhiên đồ sộ xoay quanh hành tinh khí khổng lồ này, có một mặt trăng nhỏ chứa đầy kim loại và khoáng sản quý giá."
 asteroid_collision:0 "Tiểu hành tinh va chạm"
 asteroid_collision_desc:1 "Chưa tới một ngàn năm trước, một tiểu hành tinh khổng lồ đã đâm vào đây, để lại một lượng lớn trầm tích khoáng sản."
 microsingularity:0 "Điểm kỳ dị vi mô"
 microsingularity_desc:1 "Từng có một điểm kỳ dị vi mô xuyên gọn qua lõi hành tinh này, để lại những phần năng lượng tàn dư đầy thú vị."
 alien_writing:0 "Văn tự ngoại lai"
 alien_writing_desc:1 "Ai đó từng dùng tia laser khai thác để khắc những dòng chữ lên bề mặt hành tinh, lớn tới mức có thể nhìn thấy từ quỹ đạo."
 towed_asteroid:0 "Tiểu hành tinh được kéo tới"
 towed_asteroid_desc:1 "Có ai đó đã kéo tiểu hành tinh khổng lồ này vào một quỹ đạo ổn định quanh hành tinh, có lẽ là để khai thác tài nguyên."
 nuclear_devastation:0 "Sự hủy diệt hạt nhân"
 nuclear_devastation_desc:1 "Hành tinh này từng trải qua một cuộc chiến tranh thế giới tàn khốc do chính cư dân bản địa gây ra, dẫn đến bầu khí quyển nhiễm độc. Việc nghiên cứu những tàn tích chết chóc này sẽ mang lại nhiều dữ liệu quý giá."
 nuclear_wasteland:0 "Bãi rác hạt nhân"
 nuclear_wasteland_desc:0 "Vào một thời điểm nào đó trong quá khứ, hành tinh này đã hứng chịu một cuộc chiến tranh hạt nhân do người bản địa phát động. Sinh quyển bị tàn phá cho tới nay vẫn chưa thể hồi phục, và bóng đen bức xạ vẫn bao trùm lấy thế giới này."
 gamma_ray:0 "Bùng phát tia Gamma"
 gamma_ray_desc:0 "Rất lâu trước đây, hành tinh này đã bị phơi nhiễm dưới vụ bùng phát tia gamma từ sự co sụp của một ngôi sao. Tầng ozone của nó đến nay vẫn chưa hồi phục hoàn toàn, đồng nghĩa với việc mọi thực dân phải trang bị thêm đồ bảo hộ chống tia cực tím."
 greenhouse_effect:0 "Hiệu ứng nhà kính mất kiểm soát"
 greenhouse_effect_desc:1 "Hành tinh này bị ô nhiễm nghiêm trọng do lượng khí nhà kính vô tội vạ mà cư dân bản địa thời đại công nghiệp thải ra, dẫn đến hiệu ứng nhà kính mất kiểm soát. Vài tàn tích nhà máy và khu dân cư cổ đại vắng bóng người vẫn hiện rõ mồn một dưới bầu khí quyển độc hại."
 ammonia_biosphere:0 "Sinh quyển amoniac"
 ammonia_biosphere_desc:1 "Hành tinh độc hại này tồn tại một dạng sinh quyển dùng amoniac làm dung môi thay cho nước. Nghiên cứu sinh vật nền amoniac này sẽ tạo ra bước tiến lớn cho ngành sinh học của chúng ta."
 silicon_lifeforms:0 "Dạng sống nền silicon"
 silicon_lifeforms_desc:1 "Những dạng sống nền silicon bán thông minh đang cư ngụ trong mạng lưới hang động khổng lồ dưới lòng đất. Chúng thường xuyên mang theo những kim loại và khoáng thạch quý giá đào được lên bề mặt."
 colony_ruins:0 "Tàn tích thuộc địa"
 colony_ruins_desc:0 "Hành tinh này có một tàn tích thuộc địa cổ đại thuộc về một đế chế liên sao vô danh."
 alien_mural:0 "Bức bích họa ngoại lai"
 alien_mural_desc:1 "Một bức bích họa cổ đại trên bề mặt hành tinh đã ghi chép lại những tri thức công nghệ của một nền văn minh ngoài hành tinh nay đã tuyệt diệt."
 migrating_forests:0 "Khu rừng di cư"
 migrating_forests_desc:0 "Những khu rừng di cư trên thế giới này thường xuyên kéo nhau chuyển tới các khu vực mới, phá nát cầu đường, đường dây tải điện cùng nhiều cơ sở hạ tầng khác."
 migrating_forests_2:0 "Khu rừng di cư ngoan ngoãn"
 migrating_forests_2_desc:2 "§WThêm hệ số điều chỉnh §YKhu bảo tồn rừng di cư§!, tăng điểm £society£ §YNghiên cứu Xã hội học§! trên hành tinh.§!\n\nGiờ đây, khu rừng di cư đã bị cách ly khỏi khu dân cư, không còn khả năng phá hoại thuộc địa nữa. Nhưng sự hiện diện của chúng vẫn hạn chế đi diện tích đất có thể sử dụng của thực dân."
 damaged_ecology:0 "Hệ sinh thái tổn thương"
 damaged_ecology_desc:0 "Việc phá hoại rừng di cư một cách nhân tạo trên hành tinh này sẽ để lại tác động rõ rệt tới hệ sinh thái."
 friendly_trees:0 "Thích nghi chung sống"
 friendly_trees_desc:0 "Những khu rừng trên hành tinh này và thực dân đã chấp nhận lẫn nhau, khiến tinh thần của họ được khích lệ một thời gian dài."
 subterranean_civilization:0 "Nền văn minh dưới lòng đất"
 subterranean_civilization_desc:0 "Nền văn minh ngoài hành tinh dưới lòng đất này có mối quan hệ rất tốt đẹp với thực dân trên bề mặt. Hai bên thường xuyên tiến hành trao đổi thương mại và giao lưu văn hóa."
 subterranean_expansion:0 "Thành phố ngầm"
 subterranean_expansion_desc:0 "Nền văn minh bản địa sống dưới lòng đất đã bị diệt vong, cư dân giờ có thể tự do mở rộng lãnh thổ vào các thành phố ngầm bị bỏ hoang đó."
 gas_giant_civ:0 "Thủ đô Dathnak"
 gas_giant_civ_desc:1 "Hành tinh này là thủ đô và thế giới quê hương của người Dathnak. Những sinh vật dạng khí này có trình độ kỹ thuật và nghiên cứu rất lạc hậu, nhưng chúng ta lại học hỏi được nhiều thứ về khoa học xã hội từ họ."
 gas_giant_colony:0 "Thuộc địa Dathnak"
 gas_giant_colony_desc:1 "Dạng sống thông minh tên gọi Dathnak đã thiết lập một thuộc địa nhỏ bé trên hành tinh khí khổng lồ này."
 abandoned_terraforming:0 "Dự án cải tạo môi trường bị bỏ hoang"
 abandoned_terraforming_desc:0 "Vài ngàn năm trước, hành tinh này từng là mục tiêu của một dự án cải tạo bề mặt. Do nguyên nhân không rõ, quá trình này bị gián đoạn, khiến hệ thống khí hậu và sinh quyển bên trong rơi vào tình trạng cực kỳ bất ổn."
 gaia_world:1 "Công nghệ cải tạo môi trường cổ đại"
 gaia_world_desc:0 "Công nghệ cải tạo môi trường cổ đại đã biến hành tinh này thành một chốn thiên đường xanh tốt."
 mutant_stalker:0 "Quái vật săn mồi"
 mutant_stalker_desc:0 "Một dạng sống đột biến đang săn lùng thực dân trên hành tinh này, khiến cho vùng lân cận nơm nớp lo sợ. Sự phát triển của thuộc địa bị đình trệ do công nhân không muốn mạo hiểm tiến vào vùng hoang dã."
 wasteland_radiation:0 "Bức xạ vùng đất chết"
 wasteland_radiation_desc:0 "Lượng bức xạ khổng lồ quanh các khu định cư đang gây ra nhiều tác động tiêu cực đến sức khỏe của cư dân địa phương."
 wasteland_orbital_debris:0 "Mảnh vỡ quỹ đạo"
 wasteland_orbital_debris_desc:0 "Quỹ đạo của hành tinh này đặc nghẹt những mảnh vỡ. Điều này không chỉ vô hiệu hóa việc phóng vệ tinh từ mặt đất, mà các khu vực tập trung rác không gian còn cản trở định vị, gây ảnh hưởng nghiêm trọng tới tiến độ xây dựng hạ tầng cho thuộc địa."
 wasteland_infrastructure:0 "Cơ sở hạ tầng còn sót lại"
 wasteland_infrastructure_desc:0 "Cư dân nguyên thủy của hành tinh này đã tự hủy diệt trong một cuộc chiến tranh hạt nhân, nhưng vẫn còn nhiều cơ sở hạ tầng được giữ lại. Chúng sẽ hỗ trợ chúng ta rất nhiều trong việc xây dựng các công trình mới."
 forest_fire:0 "Cháy rừng"
 forest_fire_desc:0 "Cháy rừng dẫn tới việc rừng di cư chạy loạn giẫm đạp quy mô lớn, gây thiệt hại tạm thời cho một số khu vực nông nghiệp."


 upliftable_species:0 "Giống loài có thể khai hóa"
 upliftable_species_desc:0 "Nơi đây có giống loài có thể khai hóa. Nếu lập thuộc địa trên hành tinh này, ta sẽ không thể khai hóa chúng nữa."
 production_targets:0 "Chỉ tiêu sản xuất"
 production_targets_desc:1 ""
 biochemical_suppression:0 "Ức chế sinh hóa"
 biochemical_suppression_desc:0 ""
 slave_production_output_increase:0 "Sản lượng nô lệ"
 slave_production_output_increase_desc:0 ""
 allow_slavery_all:0 "Cho phép nô dịch"
 allow_slavery_desc:0 ""
 ftl_credit_trading:0 "Cho phép giao dịch năng lượng siêu quang tốc"
 ftl_credit_trading_desc:0 ""
 utopian_abundance:0 "Sự dư dả hoàn mỹ"
 utopian_abundance_desc:0 ""
 bio_asset_optimization:0 "Tối ưu hóa tài sản sinh thể"
 bio_asset_optimization_desc:0 ""
 noninterference_directive:0 "Chỉ thị không can thiệp"
 noninterference_directive_desc:0 ""
 abundant_geothermal_activity: "Hoạt động địa nhiệt dồi dào"
 abundant_geothermal_activity_desc: "Hành tinh này có nhiều khu vực địa nhiệt để tận dụng. Dù mang lại thách thức về mặt kỹ thuật, nó đồng thời mang đến cơ hội kiếm thêm sản lượng năng lượng."
 subterranean_wildlife: "Động vật hoang dã dưới lòng đất"
 subterranean_wildlife_desc: "Hành tinh này sở hữu hệ sinh thái thạch học ngầm cực kỳ phồn vinh. Bầy sinh vật ngầm hiền lành chuyên ăn quặng đã tạo ra những hang động khổng lồ, rất thích hợp để khai thác mỏ và lập thuộc địa. Lũ động vật này cũng là đối tượng nghiên cứu độc nhất vô nhị cho những thợ mỏ đang tìm kiếm các vỉa quặng lớn."
 rich_mircoflora: "Hệ vi thực vật phong phú"
 rich_mircoflora_desc: "Lớp đất của hành tinh này là ngôi nhà của một hệ sinh thái vi sinh vật vô cùng năng động. Nó không chỉ cung cấp sản lượng nông nghiệp dồi dào mà còn là một đối tượng đáng để nghiên cứu."
 strong_magnetic_field:0 "Từ trường cực mạnh"
 strong_magnetic_field_desc:2 "Hành tinh này có từ trường mạnh một cách dị thường, gây nhiễu loạn cho nhiều loại thiết bị và máy tính của chúng ta. Quá trình khắc phục tình trạng này sẽ mang lại nhiều bước tiến cho công cuộc nghiên cứu thao túng trường lực."
 wild_storms:0 "Cơn bão cuồng nộ"
 wild_storms_desc:0 "Những cơn bão dòng điện từ mãnh liệt liên tục càn quét bầu khí quyển của hành tinh này với tần suất khó lường."
 low_gravity:0 "Trọng lực thấp"
 low_gravity_desc:0 "Hành tinh này có mật độ thấp bất thường, nên lực hấp dẫn của nó cũng yếu hơn hẳn so với những hành tinh cùng kích cỡ."
 high_gravity:0 "Trọng lực cao"
 high_gravity_desc:1 "Mật độ của hành tinh này đặc một cách bất thường, tạo ra lực hấp dẫn mạnh mẽ tới mức khó chịu."
 hollow_planet:0 "Hành tinh rỗng"
 hollow_planet_desc:0 "Hành tinh này đã bị làm rỗng ruột vì một nguyên nhân hay thủ pháp bí ẩn nào đó. Điều tra ngọn ngành sự việc chắc chắn sẽ là một trải nghiệm lý thú."
 mineral_rich:1 "Khoáng sản cao cấp"
 mineral_rich_desc:1 "Lớp vỏ hành tinh chứa đựng vô vàn các mỏ khoáng sản chất lượng cao, khiến ngành công nghiệp khai thác nơi đây phất lên như diều gặp gió."
 titanic_life:0 "Quái thú khổng lồ"
 titanic_life_desc:0 "Các sinh vật trên hành tinh này có kích thước siêu to khổng lồ. Dù bản tính không hiểm độc, nhưng sự hiện diện của chúng vốn dĩ đã là một mối nguy hiểm."
 eat_the_titans:0 "Món ngon khổng lồ"
 eat_the_titans_desc:0 "Nằm ngoài dự đoán, trong quá trình thu thập lũ quái thú này để nghiên cứu, chúng ta phát hiện ra thịt của chúng nếm cũng ngon ra phết!"
 eat_the_titans_hive: "$eat_the_titans$"
 eat_the_titans_hive_desc: "$eat_the_titans_desc$"
 eat_the_titan_evopred: "$eat_the_titan$"
 eat_the_titan_evopred_desc: "$eat_the_titan_desc$"
 asteroid_belt:0 "Vành đai tiểu hành tinh"
 asteroid_belt_desc:1 "Hành tinh này có một vành đai tiểu hành tinh, rất có khả năng là tàn tích sau khi các mặt trăng cỡ nhỏ của nó va chạm với thiên thể khác. Bãi mảnh vỡ đã biến thành một mỏ tài nguyên tiềm năng, trù phú nhưng lại đòi hỏi trình độ kỹ thuật phức tạp."
 natural_beauty:0 "Kỳ quan tự nhiên"
 natural_beauty_desc:0 "Phong cảnh trên hành tinh này chỗ nào cũng tuyệt mỹ, cư dân luôn không ngừng tìm thấy những kỳ quan thiên nhiên mới lạ."
 atmospheric_aphrodisiac:0 "Khí quyển kích dục"
 atmospheric_aphrodisiac_desc:0 "Các hợp chất có trong tầng khí quyển của hành tinh này khiến cho cư dân ở đây, ừm, lúc nào cũng sung mãn."
 atmospheric_hallucinogen:0 "Khí quyển gây ảo giác"
 atmospheric_hallucinogen_desc:0 "Không khí trên hành tinh này dường như chứa một loại chất gây ảo giác tự nhiên. Nó đúng là có khả năng cải thiện tâm trạng và khiến một vài bài toán vật lý trở nên dễ nhằn hơn; nhưng cũng làm người ta khó lòng giữ được sự tập trung."
 atmospheric_hallucinogen_good:0 "Khí quyển gây ảo giác đã lọc"
 atmospheric_hallucinogen_good_desc:0 "Không khí trên hành tinh này từng chứa một loại chất gây ảo giác tự nhiên. Giờ đây sau khi qua màng lọc, chất gây ảo giác đã bị pha loãng. Dù bớt đi một chút lợi ích vốn có, nhưng mọi tác dụng phụ cũng biến mất hoàn toàn."
 lush_planet:0 "Xanh tươi mơn mởn"
 lush_planet_desc:0 "Sự sống trên hành tinh này phát triển vô cùng mạnh mẽ, hệ động thực vật vô cùng đa dạng, hơn nữa còn sinh trưởng nhanh chóng và rậm rạp."
 bleak_planet:0 "Vùng đất hoang tàn"
 bleak_planet_desc:1 "Sinh vật rất khó tồn tại ở đây, dù có một số loài ngoan cường bám trụ lại, chúng cũng trở nên còi cọc và yếu ớt. Những vấn đề này sẽ ảnh hưởng tới sản lượng lương thực."
 irradiated_planet:0 "Thế giới nhiễm phóng xạ"
 irradiated_planet_desc:0 "Một thảm họa từ rất lâu trước đây đã nhấn chìm hành tinh này trong lớp bức xạ dày đặc."
 ancient_automation:0 "Công nghệ tự động hóa cổ đại"
 ancient_automation_desc:0 "Bất chấp tuổi đời đã lâu, các cỗ máy trên hành tinh này vẫn là cánh tay đắc lực cho công cuộc sản xuất của chúng ta."
 ancient_factory:0 "Nhà máy cổ đại"
 ancient_factory_desc:0 "Một nhà máy cổ đại trên hành tinh này vẫn còn hoạt động được."
 robot_workers:0 "Công nhân người máy"
 robot_workers_desc:0 "Những công nhân người máy do một nền văn minh thất lạc chế tạo vẫn còn tồn tại trên hành tinh này. Miễn là thực hiện các biện pháp phòng ngừa thích hợp, đám người máy này sẽ cống hiến hết mình cho chúng ta."
 ancient_forgeworld:0 "Thế giới đúc cổ đại"
 ancient_forgeworld_desc:0 "Hành tinh này vốn là trung tâm sản xuất công nghiệp của một nền văn minh đã thất lạc. Dù chỉ còn một số ít máy móc hoạt động được, nhưng nó cũng là một hình mẫu tuyệt vời cho nền công nghiệp của chúng ta."
 holy_planet:0 "Thánh địa"
 holy_planet_desc:0 "Hành tinh này được Đế chế Tàn lụi lân cận coi là vùng đất thánh, nếu chúng ta định cư tại đây, chắc chắn sẽ chọc giận bọn họ."
 ancient_weapon:0 "Vũ khí quỹ đạo cổ đại"
 ancient_weapon_desc:0 "Có vẻ một giống loài thất lạc nào đó đã chế tạo món vũ khí quỹ đạo khổng lồ này, tuy nhiên nó vẫn chưa được hoàn thiện, có lẽ chúng ta có thể học hỏi được những điều mới mẻ từ nó."
 terraforming_candidate:0 "Ứng cử viên cải tạo môi trường"
 terraforming_candidate_desc:0 "Mặc dù bề mặt cằn cỗi và không có sự sống, hành tinh này vẫn chứa lượng nước đóng băng. Nơi đây có lẽ từng là một hệ sinh thái trù phú. Nếu sử dụng công nghệ cải tạo phù hợp, nó có thể trở thành một thế giới có thể sinh sống được."
 terraforming_candidate_tooltip:0 "Chỉ cần nghiên cứu công nghệ £society£ §Y$tech_climate_restoration$§!, chúng ta có thể cải tạo môi trường hành tinh này thành một nơi có thể sinh sống được."
 frozen_terraforming_candidate:0 "Ứng cử viên cải tạo môi trường băng giá"
 frozen_terraforming_candidate_desc:0 "Mặc dù lạnh lẽo tới mức không thể duy trì sự sống, nhưng nếu tìm ra phương pháp thích hợp, ta có thể tận dụng lượng nước đóng băng trên bề mặt để biến hành tinh này thành một nơi sinh sống được."
 frozen_terraforming_candidate_tooltip:0 "Nếu chúng ta chọn Đặc quyền Thăng thiên §Y$ap_hydrocentric$§! và nghiên cứu công nghệ £society£§Y$tech_climate_restoration$§!, ta có thể biến hành tinh này thành một nơi sinh sống được."
 toxic_terraforming_candidate:0 "Ứng cử viên cải tạo môi trường độc hại"
 toxic_terraforming_candidate_desc:0 "Bầu khí quyển độc hại khiến sự sống không thể tồn tại, nhưng bằng phương pháp thích hợp, ta có thể phân giải lượng khí đó thành những vật chất ít độc hơn, dần dần biến nơi này thành khu vực có thể sinh sống được."
 toxic_terraforming_candidate_tooltip:0 "Nếu chúng ta chọn Đặc quyền Thăng thiên §Y$ap_detox$§!, ta có thể biến hành tinh này thành một nơi sinh sống được."
 ultra_rich:1 "Khoáng sản cực phẩm"
 ultra_rich_desc:1 "Hành tinh này đích thực là một kho báu! Nguồn khoáng sản chất lượng siêu việt chắc chắn sẽ mang lại lợi nhuận khổng lồ."
 mineral_poor:1 "Khoáng sản phẩm cấp thấp"
 mineral_poor_desc:1 "Người ta vẫn chưa rõ hành tinh này vốn dĩ đã như vậy, hay do một giống loài vô danh nào đó đã từng đến và bòn rút sạch sẽ tài nguyên quý giá của nó. Dù sao đi nữa, chất lượng khoáng sản hiện tại của hành tinh này đặc biệt tồi tệ."
 planet_uncertain_past:0 "Quá khứ mơ hồ"
 planet_uncertain_past_desc:0 "Cư dân trên hành tinh này luôn bị ám ảnh bởi một thảm họa xảy ra từ rất lâu trước đây, và hiện đang cố gắng tìm ra nguyên nhân thực sự."
 recent_quake:0 "Chấn động địa chất gần đây"
 recent_quake_desc:0 "Hành tinh này dạo gần đây liên tục phải chịu ảnh hưởng từ các hoạt động địa chất dữ dội."
 recent_comet:0 "Phát hiện sao chổi"
 recent_comet_desc:0 "Một ngôi sao chổi vừa bay xuyên qua vành đai tiểu hành tinh của hành tinh này, người dân trên mặt đất có thể quan sát cảnh tượng ngoạn mục này bằng mắt thường!"
 recent_impact:0 "Thiên thạch va chạm gần đây"
 recent_impact_desc:0 "Khu định cư địa phương gần đây đã bị phá hủy hoàn toàn bởi một vụ va chạm tiểu hành tinh quy mô lớn."
 magnetic_research_boost:0 "Kỳ tích từ trường"
 magnetic_research_boost_desc:0 "Bằng một cách thần kỳ nào đó, từ trường của hành tinh này lại gây nhiễu máy tính của chúng ta, nhưng thay vì phá hỏng theo cách thông thường, nó lại làm máy tính hoạt động hiệu quả hơn!"
 magnetic_disruption:0 "Nhiễu loạn từ trường"
 magnetic_disruption_desc:0 "Từ trường của hành tinh này gây nhiễu loạn thiết bị máy tính, ảnh hưởng nghiêm trọng tới công tác nghiên cứu, khiến cho dân chúng vô cùng phiền não."
