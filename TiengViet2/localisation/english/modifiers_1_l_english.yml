 stone_age_civilization:1 "Người bản địa thời đồ đá tiền siêu quang tốc"
 stone_age_civilization_desc:3 "Hành tinh này đang nuôi dưỡng một nguyên mẫu văn minh vẫn còn trong thời kỳ đồ đá."
 dead_creatures:0 "Nghĩa địa không gian"
 dead_creatures_desc:0 "Hành tinh khí khổng lồ này là nghĩa địa của những sinh vật không gian cổ đại, chúng ta có thể thu thập nhiều thông tin giá trị khi nghiên cứu xác của chúng."
 starship_graveyard:0 "Mộ thuyền sao"
 starship_graveyard_desc:1 "Từng có một cuộc chiến tranh quy mô lớn nổ ra trên quỹ đạo hành tinh này, để lại rất nhiều xác tàu cổ đại rơi vãi trên bề mặt, nghiên cứu chúng sẽ mang lại nhiều kiến thức hữu ích."
 organic_starship:0 "Phi thuyền hữu cơ"
 organic_starship_desc:1 "Một con tàu hữu cơ nào đó đã đâm xuống hành tinh này ba tỷ năm trước. Dù chỉ còn sót lại bộ xương cổ xưa, chúng vẫn mang lại cơ hội nghiên cứu vô cùng phong phú."
 abandoned_cities:0 "Thành phố bị bỏ hoang"
 abandoned_cities_desc:0 "Cư dân nguyên thủy của hành tinh này đã biến mất một cách bí ẩn, để lại cơ sở hạ tầng và những thành phố gần như nguyên vẹn. Điều này sẽ giúp ta dễ dàng phát triển nó thành một thuộc địa mới."
 subterranean_ocean:0 "Đại dương ngầm"
 subterranean_ocean_desc:1 "Bên dưới lớp manti băng giá của hành tinh này là một đại dương rộng lớn, được sưởi ấm bằng các suối nước nóng dưới đáy biển. Có một lượng lớn sinh vật sinh sống ở dưới vực sâu, chắc chắn chúng ta sẽ thu hoạch được nhiều thứ nếu tiến hành nghiên cứu chúng."
 colony_enclaves:0 "Vùng lãnh thổ gia cố"
 colony_enclaves_desc:0 "Phạm vi hoạt động của thực dân trên hành tinh này sẽ bị giới hạn trong một vùng lãnh thổ được gia cố, phần đất còn lại sẽ là nơi cư ngụ hòa bình cho những người bản địa thời đồ đá."
 primitive_reservation:0 "Khu bảo tồn người ngoài hành tinh"
 primitive_reservation_desc:0 "Thực dân ngoại lai đã chia cắt một phần đất đai của hành tinh này để dành riêng cho nền văn minh đồ đá bản địa. Điều này cũng phần nào hạn chế diện tích đất đai và tài nguyên mà thực dân có thể sử dụng."
 starvation:0 "Nạn đói"

 subterranean_tech_transaction:0 "Cung cấp công nghệ cho văn minh lòng đất"
 subterranean_tech_transation_desc:0 "Một phần tài nguyên nghiên cứu và ngân sách của chúng ta sẽ được dùng để hỗ trợ nền văn minh dưới lòng đất trên một trong số các hành tinh thuộc địa."
 stellarite_high_temp:0 "Tăng nhiệt độ"
 stellarite_high_temp_desc:0 "Một con thú khổng lồ phát sáng đã xuất hiện trong hệ sao này, nó khiến nhiệt độ bề mặt hành tinh tăng lên."
 stellarite_low_temp:0 "Giảm nhiệt độ"
 stellarite_low_temp_desc:0 "Một con thú khổng lồ phát sáng đã nuốt chửng một phần ngôi sao trong hệ sao này, khiến nhiệt độ bề mặt hành tinh giảm xuống mức thấp hơn bình thường."

