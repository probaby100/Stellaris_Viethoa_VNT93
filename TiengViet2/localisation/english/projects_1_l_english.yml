l_english:
 MIGRATING_FORESTS_1_PROJECT:0 "Nghiên Cứu Rừng Di Cư"
 MIGRATING_FORESTS_1_PROJECT_DESC:0 "Một số nhà khoa học của chúng ta hy vọng rằng có thể tìm ra một giải pháp không đòi hỏi phải hủy diệt các cánh rừng thông qua việc tiếp tục nghiên cứu hệ thực vật ngoài hành tinh này."
 MIGRATING_FORESTS_2_PROJECT:0 "Thiêu Rụi Rừng Di Cư"
 MIGRATING_FORESTS_2_PROJECT_DESC:0 "Sự hiện diện của những cánh rừng này là không thể dung thứ. Chúng ta phải nỗ lực quét sạch chúng khỏi bề mặt [Root.GetPlanetMoon]."
 SEISMIC_DISTURBANCE_1_PROJECT:0 "Thiết Lập Liên Lạc"
 SEISMIC_DISTURBANCE_1_PROJECT_DESC:2 "Chúng ta cần tìm cách giao tiếp với các sinh vật ngoài hành tinh [Root.Owner.GetSubMantleLower]. Có lẽ chúng ta có thể tìm ra phương thức cùng chung sống hòa bình với nền văn minh của họ."
 SEISMIC_DISTURBANCE_2_PROJECT:0 "Đòn Đánh Phủ Đầu"
 SEISMIC_DISTURBANCE_2_PROJECT_DESC:0 "Những kẻ ngoài hành tinh đang đào đường lên bề mặt là một mối hiểm họa cần phải được xử lý ngay lập tức. Chúng ta sẽ phát động một cuộc tấn công phủ đầu vào các đô thị dưới lòng đất của chúng."
 SEISMIC_DISTURBANCE_3_PROJECT:0 "Tiêu Diệt Nền Văn Minh Lòng Đất"
 SEISMIC_DISTURBANCE_3_PROJECT_DESC:0 "Nền văn minh ngoài hành tinh dưới lòng đất trên [From.From.GetName] là một mối đe dọa rõ ràng đối với thuộc địa của chúng ta và phải bị tiêu diệt. Chúng ta cần tìm cách tấn công vào các thành phố sâu dưới lòng đất của họ."
 UNDERGROUND_VAULT_PROJECT:0 "Mở Hầm Ngầm Dưới Lòng Đất"
 UNDERGROUND_VAULT_PROJECT_DESC:0 "Chúng ta đã phát hiện một hầm ngầm khổng lồ dưới lòng đất trên [From.GetName]. Các nhà khoa học của chúng ta đang tìm cách mở cánh cửa kiên cố của căn hầm để khám phá những bí mật bên trong."
 NUCLEAR_BOMB_PROJECT:0 "Vô Hiệu Hóa Bom Hạt Nhân"
 NUCLEAR_BOMB_PROJECT_DESC:0 "Một quả bom khinh khí bị bỏ hoang đã vô tình bị kích hoạt bởi những người thuộc địa của chúng ta trên [From.GetName]. Chúng ta cần phải tháo ngòi nổ trước khi đồng hồ đếm ngược điểm số không!"
 GAS_GIANT_BODIES_PROJECT:0 "Phân Tích Sinh Vật Không Gian Đã Chết"
 GAS_GIANT_BODIES_PROJECT_DESC:0 "Chúng ta đã phát hiện xác chết của một số sinh vật khổng lồ trên quỹ đạo quanh hành tinh khổng lồ khí [From.GetName]. Các nhà khoa học của chúng ta muốn nghiên cứu kỹ lưỡng hơn để xác định nguồn gốc của chúng."
 SEA_EXPEDITION_PROJECT:0 "Tổ Chức Thám Hiểm Biển Sâu"
 SEA_EXPEDITION_PROJECT_DESC:0 "Có một đại dương rộng lớn ẩn giấu bên dưới lớp phủ băng giá của [From.GetName]. Các nhà khoa học của chúng ta muốn tổ chức một chuyến thám hiểm nhằm nghiên cứu các dạng sống độc nhất vô nhị trong môi trường này."
 GIGANTIC_SKELETON_PROJECT:0 "Điều Tra Bộ Xương Khổng Lồ"
 GIGANTIC_SKELETON_PROJECT_DESC:1 "Một bộ xương khổng lồ có niên đại hơn ba tỷ năm đã được tìm thấy trên bề mặt không sự sống của [From.GetName]. Các [Root.Owner.GetScientistPlural] của chúng ta đang nóng lòng muốn tìm hiểu tận cùng bí ẩn này."
 GIGANTIC_SKELETON_RESURRECTION_PROJECT:0 "Hồi Sinh Bộ Xương Khổng Lồ"
 GIGANTIC_SKELETON_RESURRECTION_PROJECT_DESC:0 "Một bộ xương khổng lồ có niên đại hơn ba tỷ năm đã được tìm thấy trên bề mặt không sự sống của [From.GetName]. Các pháp sư chiêu hồn của chúng ta đã sẵn sàng vận dụng bí thuật của mình."
 BATTLE_WRECKAGE_PROJECT:0 "Thám Hiểm Nghĩa Địa Chiến Hạm"
 BATTLE_WRECKAGE_PROJECT_DESC:0 "Chúng ta tình cờ bắt gặp một nghĩa địa phi thuyền trên bề mặt [From.GetName], tàn tích của một trận đại chiến diễn ra ở quỹ đạo thấp hàng ngàn năm trước. Một chuyến thám hiểm khoa học để nghiên cứu những xác tàu cổ xưa này và xem liệu có thể trục vớt được gì không đã được đề xuất."
 ROCK_FACE_PROJECT:0 "Phân Tích Khuôn Mặt Khắc Đá"
 ROCK_FACE_PROJECT_DESC:0 "Trên bề mặt của [From.GetName], chúng ta bắt gặp một kiến tạo đá trông giống hệt khuôn mặt của một [Root.Owner.GetSpeciesName]. Chúng ta phải xác định xem đây chỉ là sự trùng hợp ngẫu nhiên hay còn có ẩn tình nào khác."
 TRANSLATE_MURAL_PROJECT:0 "Dịch Bức Bích Họa Cổ Đại"
 TRANSLATE_MURAL_PROJECT_DESC:0 "Một bức bích họa cổ đại phủ đầy những ký tự ngoài hành tinh đã được tìm thấy trên [From.GetName]. Nếu dành riêng nguồn lực, chúng ta sẽ có thể giải mã được những dòng chữ này."
 MUTANT_SURVIVORS_PROJECT:0 "Điều Tra Sinh Vật Biến Dị"
 MUTANT_SURVIVORS_PROJECT_DESC:0 "Những hình bóng biến dị đã được nhìn thấy trên [From.GetName] — rất có thể là hậu duệ của những cư dân nguyên bản trên [From.GetPlanetMoon]. Chúng ta cần tìm hiểu thêm về họ để biết mình đang phải đối mặt với điều gì."
 UNDERGROUND_FACILITY_PROJECT:0 "Điều Tra Cơ Sở Dưới Lòng Đất"
 UNDERGROUND_FACILITY_PROJECT_DESC:0 "Một cơ sở ngầm rộng lớn bên dưới một trong những thành phố ngoài hành tinh bị bỏ hoang trên [From.GetName] đang phát ra một tiếng vọng năng lượng kỳ lạ. Chúng ta cần tìm hiểu điều gì đang gây ra hiện tượng này."
 GHOSTLY_SIGHTINGS_PROJECT:0 "Điều Tra Hiện Tượng Ma Quái"
 GHOSTLY_SIGHTINGS_PROJECT_DESC:0 "Các cư dân thuộc địa trên [From.GetName] đã nhìn thấy những bóng ma quang phổ lượn lờ xung quanh các đô thị ngoài hành tinh bị bỏ hoang của [From.GetPlanetMoon] với tần suất đáng báo động. Các nhà khoa học của chúng ta rất háo hức điều tra bản chất của hiện tượng này."
 AUTOMATED_SHIPYARD_PROJECT:0 "Sửa Chữa Xưởng Đóng Tàu Tự Động"
 AUTOMATED_SHIPYARD_PROJECT_DESC:0 "Xác tàn của một xưởng đóng tàu tự động cũ kỹ đã được tìm thấy trên quỹ đạo của [From.GetName]. Các kỹ sư của chúng ta tin rằng họ có thể khôi phục nguồn năng lượng cho khoang chế tạo duy nhất còn sống sót của xưởng tàu."
 GAS_GIANT_SHIP_PROJECT:0 "Trục Vớt Tàu Trong Hành Tinh Khí"
 GAS_GIANT_SHIP_PROJECT_DESC:0 "Một con tàu vô chủ đã được phát hiện nằm sâu trong tầng khí quyển của hành tinh khổng lồ khí [From.GetName]. Một số nhà khoa học và kỹ sư của chúng ta đã đề xuất một dự án đưa con tàu lên tầng khí quyển trên để trục vớt nó."
 GAS_GIANT_SIGNAL:0 "Tách Tín Hiệu"
 GAS_GIANT_SIGNAL_DESC:0 "Chúng ta đã bắt được một tín hiệu yếu ớt phát ra từ bên trong hành tinh khổng lồ khí [From.GetName]. Đó có thể là một dạng đường truyền liên lạc, nhưng chúng ta vẫn chưa thể cô lập và tách biệt tín hiệu này."
 GAS_GIANT_RELOCATION:0 "Di Dời Người Dathnak"
 GAS_GIANT_RELOCATION_DESC:0 "Chúng ta đã đồng ý vận chuyển người Dathnak từ hành tinh quê hương sắp diệt vong của họ tới hành tinh khổng lồ khí [baldarak_planet.GetName], nơi họ sẽ xây dựng một tổ ấm mới. Thời gian không còn nhiều."
 GAS_GIANT_COLONY:0 "Thành Lập Thuộc Địa Dathnak"
 GAS_GIANT_COLONY_DESC:0 "Người Dathnak muốn thành lập một thuộc địa mới trên [NewBaldarak.GetName], một hành tinh khổng lồ khí có bầu khí quyển phù hợp với sinh lý của họ. Chúng ta đã đồng ý hỗ trợ họ trong nỗ lực này."
 GAS_GIANT_LOST_CONTACT:0 "Điều Tra New Baldarak"
 GAS_GIANT_LOST_CONTACT_DESC:0 "Chính quyền Dathnak trên Baldarak đã mất liên lạc với thuộc địa của họ trên New Baldarak, và họ lo ngại điều tồi tệ nhất đã xảy ra. Chúng ta đã đồng ý điều tra hành tinh này."
 GAS_GIANT_REVOLT:0 "Xâm Nhập Đơn Vị Biệt Kích"
 GAS_GIANT_REVOLT_DESC:0 "Những người cách mạng Dathnak trên New Baldarak đã yêu cầu chúng ta vận chuyển một đơn vị biệt kích của họ tới Baldarak, nơi họ sẽ cố gắng kích động một cuộc nổi dậy."
 GAS_GIANT_OCCUPATION:0 "Đổ Bộ Lực Lượng Viễn Chinh"
 GAS_GIANT_OCCUPATION_DESC:0 "Chính quyền Dathnak trên Baldarak quyết tâm khôi phục quyền kiểm soát đối với thuộc địa nổi loạn của họ trên New Baldarak. Chúng ta đã đồng ý vận chuyển một lực lượng viễn chinh tới hành tinh này."
 GAS_GIANT_LOST_CHABKY:0 "Đưa Chabky Trở Về Nhà"
 GAS_GIANT_LOST_CHABKY_DESC:0 "Cư dân thuộc địa Dathnak Chabky Raddh dường như đang nhớ nhà tha thiết và mong muốn được trở về Baldarak. Chúng ta đã miễn cưỡng đồng ý thu xếp việc này."
 ABANDONED_TERRAFORMING_1_PROJECT:0 "Tiếp Tục Quá Trình"
 ABANDONED_TERRAFORMING_1_PROJECT_DESC:0 "[From.GetName] đã được cải tạo địa cầu dang dở hàng ngàn năm trước bởi một thế lực chưa xác định. Thiết bị cải tạo địa cầu vẫn còn trên [From.GetPlanetMoon], và các nhà khoa học của chúng ta đang tìm cách khởi động lại quá trình này."
 ABANDONED_TERRAFORMING_2_PROJECT:0 "Tháo Dỡ Thiết Bị"
 ABANDONED_TERRAFORMING_2_PROJECT_DESC:0 "Bất chấp tuổi đời cổ xưa, các thiết bị cải tạo địa cầu bị bỏ hoang trên [From.GetName] dường như khá tiên tiến. Một số kỹ sư của chúng ta đã xin phép được tháo dỡ và phân tích thiết bị để xem có thể học hỏi được gì từ công nghệ chế tạo này."
 MUTANT_STALKER_PROJECT:0 "Tiêu Diệt Quái Vật Rình Rập"
 MUTANT_STALKER_PROJECT_DESC:0 "Một sinh vật biến dị đang gieo rắc nỗi kinh hoàng cho dân cư thuộc địa của chúng ta trên [From.GetName]. Nhiều người đã thiệt mạng và những người định cư đang cầu cứu sự giúp đỡ để truy lùng và tiêu diệt quái thú."
 ORBITAL_DEBRIS_PROJECT:0 "Dọn Dẹp Mảnh Vỡ Quỹ Đạo"
 ORBITAL_DEBRIS_PROJECT_DESC:0 "Không gian quỹ đạo quanh [Root.GetName] tràn ngập các mảnh vỡ đang cản trở sự phát triển của thuộc địa trên [Root.GetPlanetMoon]. Lập bản đồ vùng mảnh vỡ rộng lớn này sẽ đòi hỏi các cảm biến cực mạnh của một Tàu Khoa Học."
 TERMINAL_ORBIT_PROJECT:0 "Quan Sát Vụ Va Chạm Mặt Trăng"
 TERMINAL_ORBIT_PROJECT_DESC:0 "Một trong những mặt trăng quay quanh [From.GetName] sẽ sớm đâm vào bề mặt của hành tinh khổng lồ khí. Sự kiện cực kỳ hiếm có này nên được ghi lại cho hậu thế."
 VULTAUM_ARCHEOLOGY_1:0 "Căn Cứ Khai Khoáng"
 VULTAUM_ARCHEOLOGY_1_DESC:0 "Một miệng hố trên [From.GetName] từng là địa điểm của một căn cứ khai khoáng Vultaum cổ đại. Một khu khai quật khảo cổ sẽ được thiết lập gần đó để tìm kiếm bất kỳ thứ gì hữu ích trong đống đổ nát."
 VULTAUM_ARCHEOLOGY_2:0 "Đài Quan Sát"
 VULTAUM_ARCHEOLOGY_2_DESC:0 "Từng có một đài quan sát Vultaum trên [From.GetName], một [From.GetPlanetMoon] nằm cách khá xa đế chế cổ đại của họ. Các nhà khảo cổ đang háo hức nghiên cứu tàn tích bị bỏ hoang này."
 VULTAUM_ARCHEOLOGY_3:0 "Thang Máy Không Gian"
 VULTAUM_ARCHEOLOGY_3_DESC:0 "Một thang máy không gian Vultaum bị sụp đổ có thể được tìm thấy gần đường xích đạo trên [From.GetName]. Chắc chắn có rất nhiều cổ vật có thể tìm thấy nếu một khu khai quật khảo cổ được thiết lập trên bề mặt [From.GetPlanetMoon]."
 VULTAUM_ARCHEOLOGY_4:0 "Đại Đô Thị"
 VULTAUM_ARCHEOLOGY_4_DESC:0 "Tập hợp các miệng hố lớn trên [From.GetName] từng là một đại đô thị lớn của người Vultaum. Cần có một địa điểm khai quật khảo cổ để khai quật các cổ vật tiềm năng."
 VULTAUM_ARCHEOLOGY_5:0 "Mạng Lưới Đường Hầm"
 VULTAUM_ARCHEOLOGY_5_DESC:0 "Từng có một mạng lưới đường hầm rộng lớn trên [From.GetName] là nơi đặt thuộc địa lớn của Vultaum trước khi sụp đổ. Cần có một địa điểm khai quật khảo cổ để khai quật các tàn tích."
 VULTAUM_ARCHEOLOGY_6:0 "Cơ Sở Khai Thác Khí"
 VULTAUM_ARCHEOLOGY_6_DESC:0 "Tàn tích một phần của trạm khai thác khí Vultaum vẫn đang quay quanh [From.GetName]. Cơ sở vô chủ này từng bị cướp bóc trước đây, nhưng các nhà khảo cổ của chúng ta tin tưởng rằng vẫn còn những phát hiện có thể tìm thấy."
 VULTAUM_ARCHEOLOGY_7:0 "Trạm Thương Mại"
 VULTAUM_ARCHEOLOGY_7_DESC:0 "Một trạm thương mại Vultaum từng có mặt trên [From.GetName]. Tàn tích bị bỏ hoang cần được khai quật cẩn thận, nhưng các nhà khảo cổ cam đoan với chúng ta rằng nỗ lực này sẽ rất xứng đáng."
 VULTAUM_ARCHEOLOGY_8:0 "Vệ Tinh Nhân Tạo"
 VULTAUM_ARCHEOLOGY_8_DESC:0 "Một vệ tinh Vultaum cổ đại tình cờ được phát hiện trên quỹ đạo của [From.GetName]. Dàn máy phát tín hiệu của nó đã được trục vớt, và các kỹ sư dữ liệu của chúng ta đang nóng lòng muốn phân tích thiết bị này."
 VULTAUM_ARCHEOLOGY_9:0 "Thuộc Địa Ly Khai"
 VULTAUM_ARCHEOLOGY_9_DESC:0 "Chúng ta đã phát hiện ra thứ dường như là tàn tích của một thuộc địa ly khai Vultaum trên [From.GetName]. Khi địa điểm khai quật được thiết lập, các nhà khảo cổ có thể bắt đầu khai quật những cổ vật giá trị."
 VULTAUM_ARCHEOLOGY_10:0 "Tổ Hợp Quỹ Đạo"
 VULTAUM_ARCHEOLOGY_10_DESC:0 "Khung xương kim loại của một tổ hợp quỹ đạo Vultaum đồ sộ đã được tìm thấy bên trên [From.GetName]. Mục đích của nó dường như là nghiên cứu thực tế ảo, nhưng cần tiến hành khảo sát khảo cổ thích hợp nếu chúng ta muốn tìm hiểu thêm."
 VULTAUM_ARCHEOLOGY_11:0 "Căn Cứ Tiểu Hành Tinh"
 VULTAUM_ARCHEOLOGY_11_DESC:0 "Một miệng hố khổng lồ là tất cả những gì còn lại của căn cứ khai khoáng Vultaum cổ đại trên tiểu hành tinh [From.GetName]. Tuy nhiên, các bản quét sơ bộ cho thấy một số đường hầm khai thác mỏ có thể vẫn còn nguyên vẹn."
 VULTAUM_HOMEWORLD_PROJECT:0 "$vultaum_1_poi$"
 VULTAUM_HOMEWORLD_PROJECT_DESC:0 "$vultaum_1_poi_desc$"
 YUHT_ARCHEOLOGY_1:0 "Thế Giới Ấp Nở"
 YUHT_ARCHEOLOGY_1_DESC:0 "[From.GetName] được xác định là một thế giới ấp nở trước đây của loài Yuht, nơi các ấu trùng của họ được để mặc tự trưởng thành chậm rãi. Một cuộc khai quật khảo cổ trên thế giới này chắc chắn sẽ mang lại các hóa thạch có giá trị."
 YUHT_ARCHEOLOGY_2:0 "Dàn Trạm Lắng Nghe"
 YUHT_ARCHEOLOGY_2_DESC:0 "Nhiều dàn lắng nghe khổng lồ đã được người Yuht xây dựng trên thế giới này hàng triệu năm trước. Dù chúng đã ngừng hoạt động từ lâu, việc khai quật khảo cổ khu vực xung quanh có thể mang lại những phát hiện quan trọng."
 YUHT_ARCHEOLOGY_3:0 "Tàn Tích Bảo Tàng"
 YUHT_ARCHEOLOGY_3_DESC:0 "Một bảo tàng Yuht cổ đại dành riêng cho \"những trò lừa đảo ngoài hành tinh\" đã được phát hiện trên [From.GetName]. Nơi đây từng trưng bày hàng chục cổ vật được cho là của người ngoài hành tinh, và các nhà khảo cổ của chúng ta muốn nghiên cứu số ít còn sót lại."
 YUHT_ARCHEOLOGY_4:0 "Nghĩa Địa Cổ Đại"
 YUHT_ARCHEOLOGY_4_DESC:0 "[From.GetName] từng là quê hương của một thuộc địa Yuht thịnh vượng, và chúng ta đã xác định được một nghĩa địa khổng lồ tại một khu vực hẻo lánh của [From.GetPlanetMoon]. Nỗ lực thiết lập một địa điểm khai quật khảo cổ ở đó là rất xứng đáng."
 YUHT_ARCHEOLOGY_5:0 "Chiến Trường Xưa Cũ"
 YUHT_ARCHEOLOGY_5_DESC:0 "Hàng triệu năm trước, [From.GetName] là chiến trường của một chiến dịch mặt đất tàn khốc giữa người Yuht và một giống loài khác. Các nhà khảo cổ của chúng ta muốn lùng sục chiến trường cổ đại này để tìm kiếm các cổ vật giá trị."
 YUHT_ARCHEOLOGY_6:0 "Vệ Tinh Cổ Đại"
 YUHT_ARCHEOLOGY_6_DESC:0 "Người Yuht đã đặt một vệ tinh trên quỹ đạo của [From.GetName] để kỷ niệm lần đầu tiên họ chạm trán một giống loài ngoài hành tinh có tri giác khác. Một nhóm khảo cổ học đã yêu cầu cấp nguồn lực để tiến hành phân tích toàn diện vệ tinh này."
 YUHT_ARCHEOLOGY_7:0 "Tuần Dương Hạm Bỏ Hoang"
 YUHT_ARCHEOLOGY_7_DESC:0 "Một tàu tuần dương Yuht vô chủ dường như đã bị bỏ lại trên quỹ đạo [From.GetName] sau một trận chiến. Các nhà khảo cổ của chúng ta muốn đổ bộ lên tàu và phân tích những gì còn sót lại của con tàu cổ xưa này."
 YUHT_ARCHEOLOGY_8:0 "Tàu Thuộc Địa Vô Chủ"
 YUHT_ARCHEOLOGY_8_DESC:0 "Xác tàn của thứ dường như là tàu thực dân Yuht đã được phát hiện trên quỹ đạo của [From.GetName]. Việc phân tích con tàu bởi một nhóm nhà khảo cổ có thể mang lại những phát hiện thú vị."
 YUHT_ARCHEOLOGY_9:0 "Nơi Cư Trú Trên Tiểu Hành Tinh"
 YUHT_ARCHEOLOGY_9_DESC:0 "Tiểu hành tinh [From.GetName] dường như lưu giữ tàn tích của một nơi cư trú Yuht cổ đại. Một đội viễn chinh phải được tổ chức và phái đi điều tra các hang động của tiểu hành tinh để tìm hiểu thêm."
 YUHT_HOMEWORLD_PROJECT:0 "$yuht_1_poi$"
 YUHT_HOMEWORLD_PROJECT_DESC:0 "$yuht_1_poi_desc$"
 FIRST_LEAGUE_ARCHEOLOGY_1:0 "Căn Cứ Hạm Đội"
 FIRST_LEAGUE_ARCHEOLOGY_1_DESC:0 "Tàn tích của một căn cứ hạm đội Đệ Nhất Liên Minh đã được định vị bên trên [From.GetName]. Một số mảnh vỡ có vẻ đủ ổn định để hỗ trợ cho một nhiệm vụ khảo cổ học."
 FIRST_LEAGUE_ARCHEOLOGY_2:0 "Tuần Dương Hạm Bỏ Hoang"
 FIRST_LEAGUE_ARCHEOLOGY_2_DESC:0 "Chúng ta đã phát hiện thứ dường như là phần mũi của một tàu tuần dương Đệ Nhất Liên Minh cũ kỹ đang quay quanh [From.GetName]. Một đội đổ bộ sẽ cần nghiên cứu xác tàu nếu muốn tìm hiểu thêm."
 FIRST_LEAGUE_ARCHEOLOGY_3:0 "Thế Giới Quê Hương Khamtar"
 FIRST_LEAGUE_ARCHEOLOGY_3_DESC:0 "Nhiều dấu hiệu khảo cổ cho thấy [From.GetName] từng là hành tinh quê hương của loài Khamtar, một trong những giống loài sáng lập Đệ Nhất Liên Minh cổ đại. Chúng ta cần thiết lập một địa điểm khai quật trên bề mặt [From.GetPlanetMoon] nếu muốn tìm hiểu thêm về nền văn minh đã biến mất này."
 FIRST_LEAGUE_ARCHEOLOGY_4:0 "Thế Giới Quê Hương Chassahn"
 FIRST_LEAGUE_ARCHEOLOGY_4_DESC:0 "Chúng ta đã phát hiện ra rằng [From.GetName] từng là quê hương của loài Chassahn đã tuyệt chủng, một trong những thành viên sáng lập Đệ Nhất Liên Minh cổ đại. Tàn tích của các thành phố dưới lòng đất vẫn có thể được nhìn thấy trên bề mặt [From.GetPlanetMoon]."
 FIRST_LEAGUE_ARCHEOLOGY_5:0 "Thế Giới Quê Hương Migir-Yan"
 FIRST_LEAGUE_ARCHEOLOGY_5_DESC:1 "Hai triệu năm trước, loài Migir-Yan nằm trong số các thành viên sáng lập Đệ Nhất Liên Minh, và chúng ta tin rằng [From.GetName] từng là hành tinh quê hương của họ. Ngay cả sau ngần ấy năm tháng, một vài kiến trúc siêu đô thị cao chọc trời của họ vẫn còn đứng vững."
 FIRST_LEAGUE_ARCHEOLOGY_6:0 "Thế Giới Quê Hương V'ropak"
 FIRST_LEAGUE_ARCHEOLOGY_6_DESC:0 "Loài V'ropak cổ đại là thành viên sáng lập Đệ Nhất Liên Minh, và bằng chứng cho thấy [From.GetName] từng là quê hương của họ. Giống chim này đã xây dựng những đô thị vĩ đại bên trong các ngọn núi phẳng khoét rỗng, và các nhà khảo cổ của chúng ta xin phép được khảo sát tàn tích của họ."
 FIRST_LEAGUE_ARCHEOLOGY_7:0 "Căn Cứ Nghiên Cứu"
 FIRST_LEAGUE_ARCHEOLOGY_7_DESC:0 "Tàn tích của một cơ sở mặt đất lớn có thể được tìm thấy trên bề mặt [From.GetName]. Chúng ta tin rằng các công trình này từng là một phần của căn cứ nghiên cứu quy mô lớn do Đệ Nhất Liên Minh xây dựng, nhưng cần nghiên cứu kỹ hơn để chắc chắn."
 FIRST_LEAGUE_ARCHEOLOGY_8:0 "Tàn Tích Thuộc Địa"
 FIRST_LEAGUE_ARCHEOLOGY_8_DESC:0 "Đệ Nhất Liên Minh đã thiết lập một thuộc địa trên [From.GetName] vào một thời điểm nào đó, định cư tại đây với cư dân từ tất cả các giống loài thành viên. Dường như thuộc địa này đã lụi tàn, nhưng chúng ta sẽ phải khai quật các tàn tích để xác định lý do."
 FIRST_LEAGUE_ARCHEOLOGY_9:0 "Trung Tâm Thương Mại"
 FIRST_LEAGUE_ARCHEOLOGY_9_DESC:0 "[From.GetName] từng là một trung tâm thương mại lớn trong Đệ Nhất Liên Minh cổ đại. [From.GetPlanetMoon] từng được đô thị hóa dày đặc, và vẫn còn rất nhiều tàn tích để các nhà khảo cổ của chúng ta nghiên cứu."
 FIRST_LEAGUE_ARCHEOLOGY_10:0 "Mảnh Vỡ Chiến Trận"
 FIRST_LEAGUE_ARCHEOLOGY_10_DESC:0 "Một trận chiến hạm đội khổng lồ liên quan đến Đệ Nhất Liên Minh đã xảy ra hai triệu năm trước gần [From.GetName]. Một số mảnh vỡ đã rơi xuống bề mặt [From.GetPlanetMoon], và các nhà khảo cổ của chúng ta đề xuất thiết lập một trại căn cứ gần đó."
 FIRST_LEAGUE_ARCHEOLOGY_11:0 "Thuộc Địa Lưu Đày"
 FIRST_LEAGUE_ARCHEOLOGY_11_DESC:0 "[From.GetPlanetMoon] khắc nghiệt của [From.GetName] từng đóng vai trò là một thuộc địa lưu đày trong Đệ Nhất Liên Minh cổ đại, và một số cơ sở nhà tù có thể được khai quật nếu chúng ta thiết lập một khu khai quật khảo cổ."
 FIRST_LEAGUE_ARCHEOLOGY_12:0 "Trạm Quan Sát"
 FIRST_LEAGUE_ARCHEOLOGY_12_DESC:0 "[From.GetName] từng là quê hương của một nền văn minh Thời Kỳ Đồ Đồng sơ khai dường như đã nằm dưới sự quan sát của Đệ Nhất Liên Minh. Một số địa điểm khai quật đầy hứa hẹn đã được xác định."
 FIRST_LEAGUE_ARCHEOLOGY_13:0 "Phong Tỏa Quỹ Đạo"
 FIRST_LEAGUE_ARCHEOLOGY_13_DESC:0 "[From.GetName] từng là quê hương của một giống loài chưa xác định dường như đã phải chịu sự phong tỏa quỹ đạo bởi các chiến hạm từ Đệ Nhất Liên Minh. Một nhiệm vụ khảo cổ hy vọng sẽ tiết lộ nhiều điều hơn."
 FIRST_LEAGUE_ARCHEOLOGY_14:0 "Tiểu Hành Tinh Buôn Lậu"
 FIRST_LEAGUE_ARCHEOLOGY_14_DESC:0 "Tiểu hành tinh [From.GetName] dường như từng được sử dụng làm bến cảng bí mật bởi những kẻ buôn lậu, cướp biển và các phần tử tội phạm khác trong Đệ Nhất Liên Minh. Chúng ta nên lùng sục bên trong tiểu hành tinh này để tìm các cổ vật của Đệ Nhất Liên Minh."
 FIRST_LEAGUE_HOMEWORLD_PROJECT:0 "$first_league_1_poi$"
 FIRST_LEAGUE_HOMEWORLD_PROJECT_DESC:0 "$first_league_1_poi_desc$"
 IRASSIAN_ARCHEOLOGY_1:0 "Phong Tỏa Quỹ Đạo"
 IRASSIAN_ARCHEOLOGY_1_DESC:0 "Thuộc địa Irassian trên [From.GetName] đã bị tiêu diệt bởi Bệnh Đậu Mùa Javorian, nhưng có bằng chứng cho thấy [From.GetPlanetMoon] đã phải hứng chịu một cuộc phong tỏa ngay trước khi thảm họa này xảy ra. Để tìm hiểu thêm, chúng ta sẽ phải kiểm tra kỹ lưỡng hơn các mảnh vỡ trên quỹ đạo."
 IRASSIAN_ARCHEOLOGY_2:0 "Thuộc Địa Bị Oanh Tạc"
 IRASSIAN_ARCHEOLOGY_2_DESC:0 "[From.GetName] đã phải hứng chịu một đợt oanh tạc quỹ đạo dữ dội 1,2 triệu năm trước, nhưng trước đó [From.GetPlanetMoon] từng là một thuộc địa Irassian phồn vinh. Có lẽ một chuyến thám hiểm khảo cổ có thể tìm hiểu thêm về sự việc này."
 IRASSIAN_ARCHEOLOGY_3:0 "Thế Giới Quê Hương Joggra"
 IRASSIAN_ARCHEOLOGY_3_DESC:0 "Giống loài thân mềm Joggra có nguồn gốc từ [From.GetName], một loài chư hầu bị khuất phục của Hiệp Ước Irassian. Chúng ta biết rất ít về họ, nhưng có lẽ một đoàn thám hiểm khảo cổ có thể khắc phục điều này."
 IRASSIAN_ARCHEOLOGY_4:0 "Thế Giới Quê Hương Ti'Derg"
 IRASSIAN_ARCHEOLOGY_4_DESC:0 "[From.GetName] là quê hương cổ xưa của loài Ti'Derg, nhưng nơi đây đã hứng chịu một trận oanh tạc quỹ đạo toàn diện 1,2 triệu năm trước. Được biết Ti'Derg là một trong số các loài chư hầu của Irassian, nhưng chính xác điều gì đã châm ngòi cho trận oanh tạc này vẫn là một bí ẩn."
 IRASSIAN_ARCHEOLOGY_5:0 "Tàn Tích Thuộc Địa"
 IRASSIAN_ARCHEOLOGY_5_DESC:0 "Chỉ còn tàn tích và hóa thạch sót lại từ thuộc địa Irassian trên [From.GetName]. Nơi này dường như là một nạn nhân khác của Bệnh Đậu Mùa Javorian, nhưng có lẽ một nhiệm vụ khảo cổ có thể làm sáng tỏ thêm số phận của thuộc địa này."
 IRASSIAN_ARCHEOLOGY_6:0 "Căn Cứ Khai Khoáng"
 IRASSIAN_ARCHEOLOGY_6_DESC:0 "Các hố khoan sâu trên [From.GetName] cho thấy sự hiện diện trước đây của một căn cứ khai mỏ Irassian. Các nhà khảo cổ của chúng ta muốn tiến hành điều tra sâu hơn."
 IRASSIAN_ARCHEOLOGY_7:0 "Tàn Tích Ô Nhiễm"
 IRASSIAN_ARCHEOLOGY_7_DESC:0 "Cổ vật và hóa thạch thu thập được từ tàn tích của thuộc địa Irassian trên [From.GetName] có thể cho phép chúng ta phân lập các mẫu của vi-rút Bệnh Đậu Mùa Javorian. Điều này sẽ giúp chúng ta truy tìm nguồn gốc của bệnh dịch."
 IRASSIAN_ARCHEOLOGY_8:0 "Tuần Dương Hạm Bỏ Hoang"
 IRASSIAN_ARCHEOLOGY_8_DESC:0 "Chúng ta đã chạm trán một tuần dương hạm Irassian vô chủ đang quay quanh [From.GetName]. Một nhóm khảo cổ học đã sẵn sàng đổ bộ lên tàu."
 IRASSIAN_ARCHEOLOGY_9:0 "Trạm Không Gian Quỹ Đạo"
 IRASSIAN_ARCHEOLOGY_9_DESC:0 "Tàn tích vỡ vụn của một trạm không gian quỹ đạo Irassian đã được tìm thấy bên trên [From.GetName]. Nơi này dường như từng là trụ sở của cơ quan Kiểm Soát Bệnh Dịch của họ, nhưng để tìm hiểu thêm, chúng ta sẽ cần tiến hành tìm kiếm sâu rộng trong vùng mảnh vỡ."
 IRASSIAN_ARCHEOLOGY_10:0 "Trạm Lắng Nghe Tiểu Hành Tinh"
 IRASSIAN_ARCHEOLOGY_10_DESC:0 "Một tiền đồn lắng nghe quân sự bị bỏ hoang đã được tìm thấy trên tiểu hành tinh [From.GetName]. Chúng ta tin rằng nó có thể đã được xây dựng bởi Hiệp Ước Irassian cổ đại."
 IRASSIAN_ARCHEOLOGY_11:0 "Trạm Nghiên Cứu Hành Tinh Khí"
 IRASSIAN_ARCHEOLOGY_11_DESC:0 "Mảnh vỡ quỹ đạo từ một trạm nghiên cứu Irassian cổ đại đã được tìm thấy bên trên [From.GetName]. Người Irassian dường như đã nghiên cứu hành tinh khổng lồ khí này vì một lý do nào đó."
 IRASSIAN_HOMEWORLD_PROJECT:0 "$irassian_1_poi$"
 IRASSIAN_HOMEWORLD_PROJECT_DESC:0 "$irassian_1_poi_desc$"
 CYBREX_ARCHEOLOGY_1:0 "Thế Giới Quê Hương Kuur"
 CYBREX_ARCHEOLOGY_1_DESC:0 "[From.GetName], hành tinh quê hương trước đây của loài Kuur, là một nạn nhân khác dưới tay cỗ máy Cybrex cuồng sát. Vài phế tích đổ nát là tất cả những gì còn lại của nền văn minh Kuur, nhưng chúng rất đáng để khảo sát."
 CYBREX_ARCHEOLOGY_2:0 "Thế Giới Quê Hương Indimak"
 CYBREX_ARCHEOLOGY_2_DESC:0 "[From.GetName] từng là quê hương của nền văn minh Indimak cổ đại, trước khi các thể chiến tranh của ý thức máy móc Cybrex giáng xuống và chỉ để lại sự hủy diệt sau lưng. Có thể có những phát hiện khảo cổ quan trọng tại đây."
 CYBREX_ARCHEOLOGY_3:0 "Thể Chiến Tranh Cybrex Vỡ Nát"
 CYBREX_ARCHEOLOGY_3_DESC:0 "Hai thể chiến tranh Cybrex đổ nát đã được tìm thấy trên quỹ đạo quanh [From.GetName]. Chúng cần được điều tra kỹ lưỡng hơn."
 CYBREX_ARCHEOLOGY_4:0 "Cuộc Xâm Lược Của Cybrex"
 CYBREX_ARCHEOLOGY_4_DESC:0 "Một cuộc chiến tranh trên bộ với quy mô khổng lồ đã diễn ra trên [From.GetName] từ rất lâu về trước, khi Cybrex xâm chiếm những chủ nhân ban đầu của [From.GetPlanetMoon]. Chiến trường cổ đại này nên được tìm kiếm để thu thập các cổ vật."
 CYBREX_ARCHEOLOGY_5:0 "Phế Tích Cybrex"
 CYBREX_ARCHEOLOGY_5_DESC:0 "[From.GetName] đã được Cybrex phát triển mạnh mẽ, nhưng vì những lý do chưa rõ, chúng đã để lại một khu vực hình chữ nhật lớn gần xích đạo gần như nguyên vẹn. Các nhà khảo cổ của chúng ta nên điều tra lý do tại sao."
 CYBREX_ARCHEOLOGY_6:0 "Trạm Lắng Nghe Cybrex"
 CYBREX_ARCHEOLOGY_6_DESC:0 "Tiểu hành tinh [From.GetName] thực chất không phải là tiểu hành tinh, mà là một cấu trúc nhân tạo do Cybrex chế tạo. Nó đóng vai trò là một trạm lắng nghe bí mật của chúng vào khoảng 600.000 năm trước."
 CYBREX_ARCHEOLOGY_7:0 "Nhà Máy Tinh Luyện Cybrex"
 CYBREX_ARCHEOLOGY_7_DESC:0 "Mảnh vỡ từ một tổ hợp nhà máy tinh luyện lớn của Cybrex đang trôi nổi trên quỹ đạo bên trên [From.GetName]. Có vẻ như những cỗ máy từng tham gia vào một hoạt động khai mỏ nào đó ở đây."
 CYBREX_ARCHEOLOGY_8:0 "Mảnh Vỡ Chiến Trận"
 CYBREX_ARCHEOLOGY_8_DESC:0 "Một trận chiến không gian với quy mô thực sự khổng lồ đã diễn ra gần [From.GetName] vào 600.000 năm trước với các chiến hạm từ ít nhất năm hạm đội khác nhau tham chiến. Một trong các hạm đội này thuộc về Cybrex."
 CYBREX_ARCHEOLOGY_9:0 "Căn Cứ Cybrex Cổ Đại"
 CYBREX_ARCHEOLOGY_9_DESC:0 "Từng có một căn cứ Cybrex lớn trên bề mặt [From.GetName], cho đến khi nó bị san phẳng thành một miệng hố. Chúng ta nên điều tra xem chuyện gì đã xảy ra."
 CYBREX_ARCHEOLOGY_10:0 "Hài Cốt Hữu Cơ"
 CYBREX_ARCHEOLOGY_10_DESC:0 "Thi thể của gần một ngàn người ngoài hành tinh đã được tìm thấy trên quỹ đạo bên trên [From.GetName]. Họ dường như đã chết cùng thời điểm Cybrex kiểm soát khu vực thiên hà này."
 CYBREX_ARCHEOLOGY_11:0 "Trạm Nghiên Cứu Cybrex"
 CYBREX_ARCHEOLOGY_11_DESC:0 "Một mô-đun từ một trạm nghiên cứu Cybrex đã được tìm thấy trên quỹ đạo [From.GetName] chứa tàn tích của một số loài sinh vật điều khiển cơ khí học."
 CYBREX_HOMEWORLD_PROJECT:0 "$cybrex_1_poi$"
 CYBREX_HOMEWORLD_PROJECT_DESC:0 "$cybrex_1_poi_desc$"
 TARBLAC_PROCUREMENT:0 "Loài Tarblac Thoắt Ẩn Thoắt Hiện"
 TARBLAC_PROCUREMENT_DESC:0 "Loài Tarblac được tìm thấy sâu dưới những con sóng trên thế giới đại dương [This.GetName]."
 TASSARGOID_PROCUREMENT:0 "Loài Tassargoid Dũng Mãnh"
 TASSARGOID_PROCUREMENT_DESC:0 "Loài Tassargoid đã được nhìn thấy trong các khu rừng rậm ẩm ướt của [This.GetName]."
 ORINTHI_PROCUREMENT:0 "Loài Orinthi Đê Tiện"
 ORINTHI_PROCUREMENT_DESC:0 "Loài Orinthi đã được báo cáo xuất hiện với số lượng lớn trên hầu khắp [This.GetName]."
 SNIRAN_PROCUREMENT:0 "Loài Sniran Nham Hiểm"
 SNIRAN_PROCUREMENT_DESC:0 "Loài Sniran là loài đặc hữu độc nhất của những biển cồn cát vĩ đại trên [This.GetName]."
 GOOLANTHA_PROCUREMENT:0 "Loài Goolantha Dẻo Dai"
 GOOLANTHA_PROCUREMENT_DESC:0 "Các đàn Goolantha chỉ có thể được tìm thấy trên những thảo nguyên rộng mở của [This.GetName]."
 UDDLORAN_PROCUREMENT:0 "Loài Uddloran Mưu Mẹo"
 UDDLORAN_PROCUREMENT_DESC:0 "Có thể bắt gặp loài Uddloran đang phi như bay qua những vùng hoang nguyên tuyết trắng của [This.GetName]."
 ZULCOR_PROCUREMENT:0 "Loài Zulcor Phàm Ăn"
 ZULCOR_PROCUREMENT_DESC:0 "Các bầy Zulcor là loài bản địa của những hẻm núi khô cằn trên [This.GetName]."
 SUBLIGHT_PROBE_PROJECT:0 "Thu Hồi Đầu Dò"
 SUBLIGHT_PROBE_PROJECT_DESC:0 "Chúng ta đã phát hiện một trong những đầu dò không gian dưới ánh sáng cũ kỹ của mình trong hệ sao [space_probe.GetStarName]. Nó phải được thu hồi càng sớm càng tốt."
 BOARD_CULT_SHIP_1:0 "Đổ Bộ Tàu Tà Giáo"
 BOARD_CULT_SHIP_1_DESC:0 "Một trong những con tàu của tà giáo đã bị lực lượng của chúng ta vô hiệu hóa. Chúng ta nên tiến hành chiến dịch đổ bộ để bắt giữ tù binh và bất kỳ tài sản tình báo nào tìm thấy."
 BOARD_CULT_SHIP_2:0 "Đổ Bộ Soái Hạm Tà Giáo"
 BOARD_CULT_SHIP_2_DESC:0 "Chúng ta đã vô hiệu hóa soái hạm của tà giáo! Sẽ cần một lượng quân lính đáng kể để đổ bộ và chiếm giữ thành công con tàu."
 CULTIST_DEBRIS:0 "Mảnh Vỡ Chiến Hạm Tà Giáo"
 CULTIST_DEBRIS_DESC:0 "Tà giáo đang phát triển một loại vũ khí mới, và dấu vết dẫn tới căn cứ hoạt động của chúng đã chấm dứt tại đây. Nếu điều tra công nghệ của chúng, chúng ta có thể tìm ra manh mối về nơi ẩn náu của kẻ cầm đầu."
 SMUGGLER_RAID_PROJECT:0 "Đột Kích Căn Cứ Buôn Lậu"
 SMUGGLER_RAID_PROJECT_DESC:0 "Những kẻ buôn lậu đã thiết lập một tiền đồn bất hợp pháp trên bề mặt [From.GetName], một thế giới khu bảo tồn nguyên thủy dưới sự bảo hộ của chúng ta. Chúng phải bị trục xuất trước khi gây ra tổn hại lâu dài cho nền văn minh bản địa của [From.GetPlanetMoon]."
 ROGUE_BOMBARDMENT_PROJECT:0 "Tiêu Diệt Điệp Viên Phản Bội"
 ROGUE_BOMBARDMENT_PROJECT_DESC:0 "Đặc vụ thâm nhập ngầm phản bội của chúng ta trên [From.GetName] cuối cùng đã bị lần ra dấu vết tại một nơi ẩn náu ở ngoại ô của một thành phố lớn. Chúng ta cần hạm đội trên quỹ đạo để oanh tạc vị trí của hắn từ không gian."
 AVERT_PRIMITIVE_WAR_PROJECT:1 "Ngăn Ngừa Chiến Tranh Trên [prelude_to_war_planet.GetName]"
 AVERT_PRIMITIVE_WAR_PROJECT_DESC:1 "Do một sự cố liên quan đến chương trình thâm nhập ngầm của chúng ta trên [prelude_to_war_planet.GetName], loài [prelude_to_war_country.GetSpeciesNamePlural] đã bị đẩy đến bờ vực chiến tranh hạt nhân. Các phân đội thâm nhập của chúng ta trên [prelude_to_war_planet.GetPlanetMoon] yêu cầu một Tàu Khoa Học trên quỹ đạo để xoa dịu tình hình."
 FALLEN_SHIELD_PROJECT:0 "Hạ Khiên Phòng Thủ Trên [shielded_planet.GetName]"
 FALLEN_SHIELD_PROJECT_DESC:1 "Vì những lý do chưa rõ, ai đó hoặc thứ gì đó đã bao bọc [shielded_planet.GetName] trong một lá chắn năng lượng bất khả xâm phạm. Mức năng lượng của nó đang dao động, cho thấy tấm khiên đã hoạt động trong nhiều thiên niên kỷ. Chúng ta phải tìm cách vô hiệu hóa rào chắn và khám phá những gì ẩn giấu bên dưới!"
 BOARD_HYACINTH:0 "Đổ Bộ Tàu Hyacinth"
 BOARD_HYACINTH_DESC:0 "Tàu Hyacinth đã được định vị bên trên [hyacinth_planet.GetName] và dường như cấu trúc vẫn còn nguyên vẹn. Chúng ta sẽ phải tập hợp một đội đổ bộ để tìm hiểu điều gì đã xảy ra với con tàu phương chu này."
 SYNTH_INFILTRATION_PROJECT:0 "Phương Pháp Nhận Diện Người Máy Tổng Hợp"
 SYNTH_INFILTRATION_PROJECT_DESC:0 "Những kẻ thâm nhập dạng người máy tổng hợp cải trang thành [Root.GetSpeciesNamePlural] đang hoạt động bên trong [Root.GetName]. Chúng ta cần đưa ra một phương pháp đáng tin cậy và hiệu quả để nhận diện chúng."
 CAPTURE_QUEEN:0 "Bắt Sống Ong Chúa"
 CAPTURE_QUEEN_DESC:0 "Sau một trận hải chiến không gian gần đây tại hệ sao [queen_system.GetName], một Ong Chúa Prethoryn đã bị thương nặng và bị bầy đàn Tai Họa bỏ mặc cho đến chết. Tuy nhiên, sinh vật này vẫn còn sống. Bắt sống nó sẽ là một thắng lợi tình báo to lớn."
 ESTABLISH_COMMUNICATIONS:0 "Điều Tra [Prev.From.GetName]"
 ESTABLISH_COMMUNICATIONS_DESC:1 "Chúng ta cần tìm hiểu thêm về những người ngoài hành tinh bí ẩn mà chúng ta đã đặt mật danh là §Y[Prev.From.GetName]§!. Nếu họ có ngôn ngữ, chúng ta phải giải mã và thiết lập liên lạc.\n\nPhần thưởng: £influence£ §GẢnh Hưởng§! hoặc §SDự Án Đặc Biệt§!"
