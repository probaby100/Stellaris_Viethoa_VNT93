 gateway_tech_ship_hull_storm_weapons: "§HCon Đường Bảo Vệ Vũ Khí Khỏi Bão Vũ Trụ§!\n§ECông nghệ này sẽ mở ra những bước tiến xa hơn trong lĩnh vực Bảo Vệ Vũ Khí Khỏi Bão Vũ Trụ.§!"

