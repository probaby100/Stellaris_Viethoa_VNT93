 origin_storm_chasers: "Kẻ Săn Bão"
 origin_storm_chasers_nomadic: "Kẻ Săn Bão"
 origin_tooltip_storm_chasers_nomadic_effects: "- $LEADERS_TRAITS$ ['concept_storm_rider']\n- §YGiông Bão Giáng Lâm§! neo vào hệ sao khởi đầu của Thuyền Hòm.\n- Các Tòa Nhà Thủ Đô tự động cung cấp hiệu ứng của §YTrạm Chắn Bão§! khi đã nghiên cứu các công nghệ cần thiết.\n- Cơ hội nhận phương án nghiên cứu §YCông Nghệ Bão Vũ Trụ§!: §G+175%§!\n- Mở khóa ['concept_weather_forecasting_mode']\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- £physics£ ['technology:tech_storm_prediction_1']"
 origin_storm_chasers_desc: "Nền văn minh này trỗi dậy từ một thế giới bị bão tố càn quét dữ dội, thúc đẩy cư dân của họ khai mở tiềm năng ẩn giấu để hòa mình và cưỡi trên những dòng năng lượng giông bão ngân hà."
 origin_tooltip_storm_chasers_effects: "- $LEADERS_TRAITS$ ['concept_storm_rider']\n- $mod_planet_jobs_unity_produces_mult$ mỗi §YTòa Nhà Bão Tố§! trên hành tinh: §G+$@storm_chasers_storm_building_unity_produces_mult|%0$§!\n- Các Tòa Nhà Thủ Đô tự động cung cấp hiệu ứng của §YTrạm Chắn Bão§! khi đã nghiên cứu các công nghệ cần thiết.\n- Cơ hội xuất hiện §Y$default_storm$§! trong biên giới: §G+100%§!\n- Cơ hội nhận phương án nghiên cứu §YCông Nghệ Bão Vũ Trụ§!: §G+175%§!\n- Chi phí tài nguyên hiếm và duy trì của §YTòa Nhà Thu Hút Bão§!: §G-100%§!\n- Mở khóa ['concept_weather_forecasting_mode']\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- £physics£ ['technology:tech_storm_prediction_1']"

 START_SCREEN_STORM_CHASERS: "Sống mà không có những đợt xung kích thì còn ý nghĩa gì? Bùng cháy mãnh liệt và chết đi đầy nhiệt huyết - đó luôn là lẽ sống của chúng ta. Nhưng khi mọi lối mòn đều đã được khai phá và ngay cả đỉnh núi cao nhất cũng đã bị chinh phục, điều gì tiếp theo?\n\nHành tinh của chúng ta luôn là một thế giới ngập tràn bão tố, dễ bị tổn thương trước đủ mọi loại cuồng phong và lũ lụt. Nếu chúng ta tìm ra cách tận dụng những điều kiện độc nhất vô nhị này, chúng ta sẽ có cơ hội triệu hồi một cơn bão vũ trụ thịnh nộ.\n\nNhững bậc tiền nhân huyền thoại từ lâu đã chinh phục mọi thử thách của quê nhà. Đã đến lúc phóng vút lên và gầm thét lao vào hư không. Sẽ chẳng dễ dàng gì, nhưng như câu tục ngữ cổ xưa đã dạy: \"Chỉ kẻ táo bạo mới chạm tới chân trời.\""

# Storm Rider Trait
 leader_trait_storm_rider_desc: "Kỵ Sĩ Cưỡi Bão say sưa trong cơn trào dâng adrenaline, khai mở tiềm năng thực sự giữa dòng chảy cuộn trào của một cơn bão vũ trụ. Vị trí trong Hội Đồng sẽ thay thế các hiệu ứng thực địa bằng các hiệu ứng hội đồng."
 mod_trait_storm_rider: "§YHiệu ứng đặc tính được gia tăng khi Nhà Lãnh Đạo này cư trú bên trong một cơn bão vũ trụ.§!"
