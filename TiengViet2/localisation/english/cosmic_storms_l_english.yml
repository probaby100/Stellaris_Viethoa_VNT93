 artifact_adakkaria_research: "Bí Mật Của adAkkaria"
 artifact_adakkaria_research_desc: "Đi sâu hơn vào những bí mật của adAkkaria."
 artifact_adakkaria_research_completed: "$artifact_adakkaria_research$"
 artifact_adakkaria_research_completed_desc: "Chúng ta đã vận dụng tri thức cổ xưa của adAkkaria vào mục đích của riêng mình."

# Secrets of the adAkkaria Convention
 project_adakkaria_secrets_of: "Bí Mật Của Công Ước adAkkaria"
 project_adakkaria_secrets_of_DESC: "Vẫn còn rất nhiều điều chúng ta có thể học hỏi từ Viện Lễ Kỷ Niệm. Liệu chúng ta có dám dấn thân sâu hơn vào những thí nghiệm này của người adAkkaria?"
 cstorms.2365.name: "Tiềm Năng Khai Mở"
 cstorms.2365.desc.start: "Nghiên cứu sâu vào các thành tựu của Công Ước adAkkaria, dường như các nhà khoa học của họ không tuân theo bất kỳ quy chuẩn nào được công nhận; phương pháp luận thì cẩu thả, kết luận thì gần như sáo rỗng. Nghiên cứu cẩn trọng và siêng năng đã bị từ bỏ; sự sa đọa được đón nhận. Ấy thế mà các đối tượng thử nghiệm càng phải chịu nhiều tàn ác, lời tán dương từ Bộ Chỉ Huy Tối Cao lại càng bay cao.\n\nTuy nhiên, các nghiên cứu ban đầu lại kể một câu chuyện hoàn toàn khác: các đối tượng được đối xử tử tế và tôn trọng trên hành trình đánh thức \"Cơn Bão Nội Tâm\". Trên thực tế, so sánh tỷ lệ thành công giữa nghiên cứu ban đầu và giai đoạn sau, không thể né tránh một kết luận kinh hoàng: chưa từng có bất kỳ mối tương quan nào giữa mức độ tra tấn và số lượng sinh thể thức tỉnh. Vô số đối tượng đã phải chịu đựng thống khổ và chết đi trong vô nghĩa."
 cstorms.2365.desc.end.default: "Chúng ta giờ đây đã thấu hiểu các nguyên lý vận hành. Học hỏi từ những sai lầm của Công Ước adAkkaria, chúng ta có thể khuyến khích người dân của chính mình tôi luyện Cơn Bão Nội Tâm và tràn ngập sinh lực bão tố dũng mãnh. Mối nguy hiểm là một số cá nhân §G$Name_Storm_Fused$§! này có thể hưởng ứng tiếng gọi của bão tố, cuối cùng tự mình làm bùng phát một cơn cuồng phong."
 cstorms.2365.desc.end.gestalt: "Tập thể của chúng ta giờ đây đã hiểu các nguyên lý vận hành. Học hỏi từ những sai lầm của Công Ước adAkkaria, một số bộ phận của chúng ta có thể tôi luyện Cơn Bão Nội Tâm và tràn ngập sinh lực bão tố dũng mãnh. Mối nguy hiểm là các nút §G$Name_Storm_Fused$§! này có thể cảm nhận tiếng gọi của bão tố quá mãnh liệt, cuối cùng tự mình kết tủa một cơn cuồng phong."
 cstorms.2365.desc.default: "$cstorms.2365.desc.start$\n\n$cstorms.2365.desc.end.default$"
 cstorms.2365.desc.gestalt: "$cstorms.2365.desc.start$\n\n$cstorms.2365.desc.end.gestalt$"
 cstorms.2365.a: "Tiếp thu tri thức mới này. Thật nhẹ nhàng!"
 cstorms.2365.b: "Không, hãy để những bí mật này yên nghỉ."
 cstorms.2365.a.tt: "- Cơ hội §Y100§! £pop£ §HDân Cư§! nhận được đặc tính $Name_Storm_Fused$ khi trải qua một cơn bão tăng gấp 4 lần.\n - Cứ mỗi 20 năm có một cơ hội nhỏ rằng §Y100§! £pop£ §HDân Cư§! tử nạn và biến thành một cơn bão."

