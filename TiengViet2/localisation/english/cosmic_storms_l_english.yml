 cultivated_worldscaping_modifier: "$decision_cultivated_worldscaping$"
 cultivated_worldscaping_modifier_desc: "Cảnh quan đã được biến đổi để tạo ra một trải nghiệm hình học siêu phàm, ưu tiên hình thức hơn sự sống. Bất kỳ thảm thực vật còn sót lại nào đều bị thu hẹp thành độc canh để loại bỏ các yếu tố bất hòa."
