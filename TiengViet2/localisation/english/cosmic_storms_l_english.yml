 technophant: "$job_technophant$"
 warden: "$job_warden$"

 noble_researcher: "$job_noble_researcher$"
 job_noble_researcher: "Nhà Khoa Học Quý Tộc"
 job_noble_researcher_plural: "Các Nhà Khoa Học Quý Tộc"
 job_noble_researcher_desc: "Những hậu duệ sáng giá và cao quý nhất được giáo dục cả về phép tắc lễ nghi lẫn phương pháp khoa học, để giải thích rõ hơn về vị thế tối cao của họ."

 sacred_noble: "$job_sacred_noble$"
 job_sacred_noble: "Quý Tộc Thần Thánh"
 job_sacred_noble_plural: "Các Quý Tộc Thần Thánh"
 job_sacred_noble_desc: "Thần tính bằng Thừa Kế là con đường. Thừa Kế bằng Thần Tính là phương tiện. Vì vậy chúng ta được ban phước với phẩm cách quý tộc."

 augmentation_merchant: "$job_augmentation_merchant$"
 job_augmentation_merchant: "Thương Nhân Cải Tạo Thể Xác"
 job_augmentation_merchant_plural: "Các Thương Nhân Cải Tạo Thể Xác"
 job_augmentation_merchant_desc: "Ai có thể dẫn dắt đế chế của chúng ta ngoại trừ những kẻ cung cấp sự tự hoàn thiện bản thân với mức giá phải chăng cùng thời hạn bảo hành kéo dài."

 visionary: "$job_visionary$"
 job_visionary: "Nhà Kỹ Thuật Tầm Nhìn"
 job_visionary_plural: "Các Nhà Kỹ Thuật Tầm Nhìn"
 job_visionary_desc: "Không bị ràng buộc bởi tiền lệ và không bị đè nặng bởi sự khiêm nhường, những kẻ mộng mơ của ngày mai này biến những suy đoán táo bạo thành hiện thực thương mại. Đối với một người có tầm nhìn thực thụ, tiến bộ không đơn thuần là một nguyên tắc; nó là một sản phẩm."

 noble_merchant: "$job_noble_merchant$"
 job_noble_merchant: "Đại Quý Tộc"
 job_noble_merchant_plural: "Các Đại Quý Tộc"
 job_noble_merchant_desc: "Quyền lực cai trị không được quyết định bởi quyền thừa kế, mà bởi thước đo giá trị của một người; và còn cách nào tốt hơn để đo lường giá trị của bạn ngoài con số tổng kết trên bảng cân đối kế toán?"
