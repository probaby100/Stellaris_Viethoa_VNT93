# Storm Technology
 tech_storm_manipulation: "Thao Túng Bão Tố"
 tech_storm_manipulation_desc: "Bằng cách khai thác các nguyên lý đằng sau công nghệ triệt tiêu bão, chúng ta có thể bắt đầu thao túng bản chất khí tượng thiên văn của thiên hà để phục vụ nhu cầu của mình."
 tech_advanced_storm_manipulation: "Thao Túng Bão Nâng Cao"
 tech_advanced_storm_manipulation_desc: "Việc tiếp tục nghiên cứu khí tượng học vũ trụ mang lại cho chúng ta sức mạnh để uốn nắn và thao túng §YBão Vũ Trụ§! một cách chính xác hơn nhằm phục vụ nhu cầu của mình."
 tech_industrial_storm_protection: "Chống Bão Hành Tinh"
 tech_industrial_storm_protection_desc: "Đầu mối liên lạc thời tiết này giúp giảm thiểu tác hại do thiên tai thời tiết vũ trụ gây ra. Sản xuất sẽ ít chịu thiệt hại hơn khi một cơn bão thiên hà quét qua."
 tech_advanced_industrial_storm_protection: "Triệt Tiêu Bão Hành Tinh"
 tech_advanced_industrial_storm_protection_desc: "Bằng cách hợp nhất các hệ thống kiểm soát thời tiết cục bộ, các mô hình thời tiết hành tinh có thể được điều khiển để giảm đáng kể hầu hết tác động có hại của bão vũ trụ lên sản xuất."

 tech_storm_prediction_1: "Mô Hình Thời Tiết Vũ Trụ"
 tech_storm_prediction_1_desc: "Thông qua việc sử dụng các mô hình thời tiết khoa học, chúng ta có thể theo dõi sự chuyển động và hình thành của các cơn §YBão Vũ Trụ§! sắp tới."
 tech_storm_prediction_1_title: "§HMở Khóa Tính Năng§!: Dự Báo Thời Tiết Vũ Trụ"
 tech_storm_prediction_1_tooltip: "Mở khóa khả năng xem §YDự Báo Hình Thành Bão Vũ Trụ§! và §YDự Báo Di Chuyển Bão Vũ Trụ§! trong §YChế Độ Bản Đồ Dự Báo Thời Tiết§!"
 tech_storm_prediction_2: "Dòng Xác Suất"
 tech_storm_prediction_2_desc: "Bằng cách áp dụng dòng xác suất vào các mô hình thời tiết khoa học của chúng ta, khả năng theo dõi chuyển động và hình thành của các cơn §YBão Vũ Trụ§! sắp tới sẽ tăng lên đáng kể."
 tech_storm_prediction_2_title: "§HNâng Cấp Tính Năng§!: Dự Báo Thời Tiết Vũ Trụ"
 tech_storm_prediction_2_tooltip: "Tối đa hóa phạm vi của §YDự Báo Hình Thành Bão Vũ Trụ§! và §YDự Báo Di Chuyển Bão Vũ Trụ§! trong §YChế Độ Bản Đồ Dự Báo Thời Tiết§!"
 tech_ship_hull_storm_breaker_1: "Máy Giảm Lực Bão"
 tech_ship_hull_storm_breaker_1_desc: "Những máy phát trường giảm lực này cung cấp sự bảo vệ rất cần thiết cho các tàu du hành qua các cơn bão vũ trụ."
 tech_ship_hull_storm_breaker_2: "Lớp Phủ Xuyên Bão"
 tech_ship_hull_storm_breaker_2_desc: "Lớp phủ đặc biệt này tích điện cho vỏ ngoài của tàu bằng một trường giảm lực bão, mang lại sự bảo vệ hiệu quả hơn trước các cơn bão."
 tech_ship_storm_weapons_1: "Đệm Lót Trọng Tải"
 tech_ship_storm_weapons_1_desc: "Một phương pháp mới trong việc sử dụng hợp kim cho các ứng dụng quân sự giúp giảm đáng kể khả năng bão vũ trụ gây nhiễu vũ khí năng lượng và đầu đạn nổ."
 tech_ship_storm_weapons_2: "Cấu Trúc Lồng Giam Bão"
 tech_ship_storm_weapons_2_desc: "Phương pháp cấu trúc tàu mới lạ này sẽ giảm đáng kể các tác động tiêu cực mà bão vũ trụ gây ra cho các hệ thống vũ khí của chúng ta."

 feature_sustain_cosmic_storm_unlocked: "Duy Trì Bão Vũ Trụ"
 feature_sustain_cosmic_storm_unlocked_desc: "Cho phép Tàu Nghiên Cứu của bạn dừng lại và duy trì §Y$default_storm$§! vô thời hạn."
 FLEETORDER_SUSTAIN_COSMIC_STORM: "Đang duy trì Bão Vũ Trụ $STORM|Y$ tại $SYSTEM|Y$"
 FLEETORDER_SUSTAIN_COSMIC_STORM_BUTTON: "Duy trì §YBão Vũ Trụ§!"
 FLEETORDER_SUSTAIN_COSMIC_STORM_CANCELLED: "§RBão Vũ Trụ được theo dõi đã tan biến.§!"

# Map Mode
 storm_map_mode: "Chế Độ Bản Đồ Dự Báo Thời Tiết"
 storm_map_mode_desc: "Chế độ Bản đồ Dự báo Thời tiết hiển thị tất cả các cơn bão, dự báo và trường can thiệp trên bản đồ thiên hà."

