 cstorms.2295.a: "Hãy để [Root.GetLeaderName] say mê trong đó."
 cstorms.2295.b: "Cấm [Root.GetLeaderName] hành động tùy tiện."
 cstorms.2295.a.psionic: "Những nạn nhân của họ vẫn đang khóc than."
 cstorms.2295.a.psionic_gestalt: "Những tiếng nói đồng thanh của họ vẫn đang rên xiết trong thống khổ."
 cstorms.2295.a.gestalt: "Bất hòa gieo mầm hỗn loạn."
 cstorms.2300.name: "Và Mọi Chuyện Đã Tỏ Tường"
 cstorms.2300.desc: "Chúng ta đã nỗ lực làm việc để mở khóa phân khu cuối cùng của $building_adakkaria_patriotic_institute$. Trong khi đó, một báo cáo khó hiểu đã gửi tới chúng ta từ các phòng thí nghiệm tầng dưới. Các nhà khoa học adAkkaria tuyên bố rằng trong mỗi một sinh thể, thậm chí có lẽ trong cả những cỗ máy có tri giác, luôn tồn tại một tia lửa. Được truyền cảm hứng từ sự xuất hiện của bão vũ trụ, họ gọi quyền năng này là 'Cơn Bão Nội Tâm': một vòng xoáy của khát vọng và tiềm lực thúc đẩy mọi sự sống có tri giác. Bằng cách đặt Cơn Bão Nội Tâm dưới những trải nghiệm cực độ, sức mạnh to lớn có thể được giải phóng.\n\nTrong thời gian làm tù binh chiến tranh, §SalAtta Landeer§! là người đầu tiên phát hiện ra hiệu ứng này. Với tư cách một nhà khoa học, ông ta đã thuyết phục Bộ Chỉ Huy Tối Cao tài trợ cho các cuộc thử nghiệm sâu hơn tại Lễ Kỷ Niệm. Dù các nhật ký không nói rõ điều gì đã xảy ra với §SLandeer§!, chúng ta biết từ các sự kiện tại nghĩa địa hạm đội rằng số phận cuối cùng của ông ta là một bi kịch.\n\nCác báo cáo tiếp theo đề cập đến một cách 'hiệu quả hơn' để giải phóng Cơn Bão Nội Tâm. Một phương thức không đòi hỏi sự tàn bạo cực đoan về thể xác, mà thay vào đó dựa vào sự khơi gợi nỗi khiếp đảm chết người và không thể trốn chạy bên trong nạn nhân. Để kích hoạt hiệu ứng này trên quy mô rộng lớn, Công Ước đã lên kế hoạch phát ra một tín hiệu thông qua mạng lưới trạm tuyên truyền dày đặc của họ."
 cstorms.2300.desc.psionic: "Chúng ta đã thành công trong việc ghi lại những lời thì thầm tâm linh tại các đài quan sát:\n\n§LLàm ơn đưa tôi ra khỏi đây, tôi từng là một công dân gương mẫu!\nGiấc mơ của tôi giờ chẳng còn gì ngoài một cơn bão bất tận. Nó đang gọi tôi.\nTôi không hiểu. Chúng tôi đã hoàn thành xuất sắc nhiệm vụ - tại sao họ lại làm điều này với chúng tôi?\nBên trong tất cả chúng ta đều có một sức mạnh. Họ muốn bóc lột sức mạnh đó. Chúng ta không được trao nó cho họ.\nNhảm nhí, họ làm điều này để cứu vớt Công Ước Nhân Từ. Chúng ta phải tuân lệnh.\nCác vệ tinh đang thì thầm với tôi. Tâm trí tôi giờ đây có thể vươn khắp ngân hà.\nTôi thấy họ đã thiết kế một thứ gì đó. Một thứ có thể làm điều này với bất kỳ ai, ở bất cứ nơi đâu.\nChúng ta sẽ được cứu, chỉ cần trao cho họ những gì họ muốn!\nBạn không hiểu đâu, nếu họ làm điều này với chúng ta, họ sẽ làm điều đó với tất cả mọi người.\nChúng ta có thể tự giải phóng bản thân.\nNhưng điều đó có nghĩa là chúng ta sẽ...\nDù sao họ cũng sẽ giết chúng ta. Một khi Thứ Đó vận hành được. Họ sẽ giết sạch chúng ta.\nTôi sợ lắm, tôi không muốn chết. Tôi muốn sống. Làm ơn.\nGiai Đoạn Cuối Cùng đang nói chuyện với tôi. Họ muốn biết liệu chúng ta có đồng ý hay không.§!"
 cstorms.2300.b: "Sức mạnh này phải thuộc về chúng ta."
 cstorms.2300.a.psionic: "Thật là một kết cục ảm đạm."
 cstorms.2300.a.psionic_hive_robot: "Một kết quả đáng tiếc."
 cstorms.2300.b.psionic: "Chẳng có gì cao quý hơn một sự hy sinh phục vụ mục đích lớn lao hơn."
 cstorms.2300.b.psionic_hive_robot: "Cái chết của số ít phục vụ cho sự sinh tồn của số đông."
 cstorms.2305.name: "Giai Đoạn Cuối Cùng"
 cstorms.2305.desc.start: "Chúng ta đã phát hiện ra một nhà chứa tàu khổng lồ. Một tổ hợp dây dẫn, đường ống và thiết bị điện tử cực kỳ phức tạp chiếm trọn không gian - tất cả đều dẫn tới một hầm phóng tên lửa đồ sộ nhưng trống rỗng. Mọi dấu vết cho thấy mạng lưới này từng được kết nối với một vật thể có kích thước xấp xỉ một tàu hộ tống.\n\nNhật ký ghi nhận nơi đây từng được dùng để lắp ráp một cỗ máy gọi là §lVật Triệu Hồi Bão Táp§!, và nó đã được triển khai thành công tại hệ sao adSul. Dù liên lạc với Vật Triệu Hồi đã bị gián đoạn, §Gnguồn năng lượng của vật triệu hồi§! vẫn còn tại vị trí."
 cstorms.2305.desc.end.default: "Khi đọc cái tên này, phi hành đoàn bỗng bị xâm chiếm bởi một cơn thịnh nộ phi lý và bắt đầu giật đứt dây cáp cùng các tấm ốp tường. Phải mất nhiều hơn một mệnh lệnh đơn giản mới có thể trấn an họ. Chúng ta đang tiến ngày càng gần hơn tới sự thật."
 cstorms.2305.desc.end.psionic: "Khi [Root.GetLeaderName] tiến lại gần cấu trúc trống rỗng, những lời thì thầm tâm linh lại bắt đầu vang lên.\n§LBạn thấy rồi, phải không? Ban đầu, chúng tôi không hề biết họ đang chế tạo thứ gì. Chúng tôi không biết họ sẽ vứt bỏ chúng tôi. Vài người muốn trả thù. Một số người muốn được tự do. Số khác cảm nhận được tiếng gọi của các cơn bão. Mọi chuyện buộc phải kết thúc, bạn hiểu mà. Chúng tôi buộc phải làm vậy. Chúng tôi không thể chịu đựng thêm được nữa.§!"
 cstorms.2305.desc.end.gestalt: "Khi đọc tên của thiết bị này, các [controller.GetIndividualNamePlural] thám hiểm của chúng ta đã xác định được cách mà §lVật Triệu Hồi§! được kích hoạt, và phương thức mà tín hiệu của nó truyền dội qua nhiều trạm tuyên truyền trước khi tới được mục tiêu cuối cùng.\n\nVà chúng ta cũng không hề miễn nhiễm trước số phận đó."
