 cs_storm_chasers_storm_fruition_desc: "Sự thức tỉnh cơn bão vũ trụ riêng biệt của chúng ta đã tiếp thêm nguồn sinh lực mạnh mẽ cho nhân dân trong nhiều năm tới."
 cs_storm_chasers_storm_fruition_gestalt: "$cs_storm_chasers_storm_fruition$"
 cs_storm_chasers_storm_fruition_gestalt_desc: "Sự thức tỉnh cơn bão vũ trụ riêng biệt của chúng ta đã tiếp thêm sinh lực cho ý thức tập thể trong nhiều năm tới."
 cs_storm_chasers_homeworld_storm_attraction: "Thời Tiết Khắc Nghiệt"
 cs_storm_chasers_homeworld_storm_attraction_desc: "Những cơn bão không ngừng nghỉ trên hành tinh này đã đẩy sự sống thành hai ngả rẽ rõ rệt: những kẻ tìm kiếm nơi trú ẩn khỏi cảnh hỗn loạn, và những người đắm chìm trong cảm giác hưng phấn tột độ của cuồng phong."
