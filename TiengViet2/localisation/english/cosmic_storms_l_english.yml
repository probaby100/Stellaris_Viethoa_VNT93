# Storm Chasers specific Progress Events

 progress.2.desc.storm.normal: "Theo lời của một [Root.Owner.GetScientist], \"Hãy nhìn sinh vật nhỏ bé này xem!\"\n\n$progress.2.desc.storm.outro$"
 progress.2.desc.storm.gestalt: "Chúng ta run lên vì phấn khích.\n\n$progress.2.desc.storm.outro$"
 progress.2.desc.storm.outro: "Sự sống ngoài hành tinh, ngay tại [From.GetName] này! Những sinh vật hoang dã này sẽ không thể trò chuyện với chúng ta sớm, nhưng ít nhất chúng ta biết rằng mình không hề đơn độc trên hành trình vũ trụ.\n\nSau tất cả, thiên hà này có lẽ tràn ngập các dạng sống."
 progress.3.desc.storm.normal: "\"Thật khó tin,\" [ruler.GetRegnalName] thốt lên. \"Một thế giới mới chín muồi với cơ hội!\"\n\nKhi chúng ta chuyển đổi tàu thuộc địa thành một khu trại căn cứ, những nhà thám hiểm đầu tiên đã sẵn sàng trải nghiệm bất cứ điều gì mà thế giới này mang lại."
 progress.3.desc.storm.gestalt: "Một khám phá đầy ly kỳ! Một thế giới mới chín muồi với cơ hội!!\n\nKhi chúng ta chuyển đổi tàu thuộc địa thành một khu trại căn cứ, các nút thám hiểm đã sẵn sàng trải nghiệm bất cứ điều gì mà thế giới này mang lại."
 progress.3.a.storm: "Tiến lên."
 progress.4.desc.storm: "Giữa sự tĩnh lặng của không gian, những lời hiệu triệu của chúng ta đã được hồi đáp! Một nền văn minh ngoài hành tinh với trình độ công nghệ tương đương. Họ hẳn đã bước vào đấu trường thiên hà gần như cùng thời điểm với chúng ta.\n\nSự xuất hiện của họ báo hiệu một ranh giới trải nghiệm hoàn toàn mới. Liệu họ đến như những đồng minh chung chí hướng, hay những đối thủ để thử thách khí phách của chúng ta? Dù thế nào đi nữa, cảm giác phấn khích trước những điều chưa biết đang vẫy gọi chúng ta tiến lên phía trước."
 progress.4.h.storm: "Thật thú vị."
 progress.5.desc.storm.normal: "Chúng ta đã phát hiện các dạng sống tiền tri giác trên [From.Planet.GetName]. Như một trong các [Root.Owner.GetScientistPlural] của chúng ta đã nói: \"Những sinh vật này thoạt nhìn chưa có gì nổi bật, nhưng tiềm năng của chúng là vô cùng to lớn!\"\n\nTuy nhiên, hiện tại chúng vẫn là sinh vật tiền tri giác. Chắc chắn sẽ vô cùng thú vị khi được quan sát những sinh vật này phát triển và sinh sôi."
 progress.5.desc.storm.gestalt: "Chúng ta đã phát hiện các dạng sống tiền tri giác trên [From.Planet.GetName].\n\nChúng ta hồi hộp chứng kiến tiềm năng của chúng sẽ dẫn tới đâu, nhưng hiện tại chúng vẫn là sinh vật tiền tri giác. Sẽ vô cùng thú vị khi quan sát những sinh vật này phát triển và sinh sôi."
 progress.5.h.storm: "Hoang dã."
 progress.6.desc.storm: "Giữa sự tĩnh lặng của không gian, lời hiệu triệu của chúng ta đã được đáp lại! Nhưng cảm nhận ban đầu hoàn toàn lệch nhịp; những người này không chia sẻ phong cách sống với chúng ta, và thích thu mình lại. Tốt nhất là chúng ta nên giữ khoảng cách vào lúc này."
 progress.6.h.storm: "Họ rồi sẽ phải bắt kịp thời đại thôi."
 pirate.1.desc.storm: "Hải tặc không gian! Chỉ nghĩ đến thôi cũng thấy rạo rực, và một nhóm tự xưng là §S[pirate_band.GetName]§! đã nhắm tầm ngắm vào chúng ta.\n\nDù chúng ta tôn trọng phong cách sống mà họ chọn, tác động của nó lên mạng lưới thương mại của chúng ta thì chẳng lấy gì làm lý tưởng."
 pirate.2.j.storm: "Thật không may."

