 civic_environmental_architects_hive: "Drone Canh Tác"
 civic_environmental_architects_hive_desc: "Là một phần của một sinh vật vĩ đại, những drone này nhận ra các cơ hội bên trong sinh vật vĩ đại nhất: thiên nhiên. Chúng tìm cách kiểm soát và định hình các hệ sinh thái tự nhiên theo mong muốn của tập thể."
