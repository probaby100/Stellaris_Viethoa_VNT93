# Storm Visible Events

 MESSAGE_COSMIC_STORM_SPOTTED_DESC: "Máy quét của chúng ta đã phát hiện một cơn bão vũ trụ thuộc hệ $TYPE|Y$. Chúng ta đã đặt tên cho nó là $NAME|Y$.\n\n"
 MESSAGE_COSMIC_STORM_SPOTTED_EVENT_CONFIRM: "Thú vị đấy."

 MESSAGE_STORM_INTRO: "Cơn bão này sẽ gây ra những tác động tàn khốc đối với các thuộc địa và cản trở khả năng tiếp cận FTL khẩn cấp của các hạm đội chúng ta. Chúng tôi đặc biệt khuyến nghị nên thực hiện các biện pháp phòng ngừa từ sớm.\n\n"

 MESSAGE_ELECTRIC_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Điện tích cực cao do cơn bão mang lại sẽ gây nguy hiểm cho hệ thống lá chắn của các hạm đội chúng ta. Tuy nhiên, chúng ta kỳ vọng sản lượng của thuộc địa và tốc độ tàu sẽ tăng lên đáng kể nhờ nguồn năng lượng dồi dào có trong cơn bão."

 MESSAGE_SOLAR_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Bức xạ từ cơn bão này sẽ khiến các hạm đội bị kẹt bên trong lộ diện trước bất kỳ ai có cơn bão trên máy quét của họ. Dù điều này đặt ra một số rủi ro an ninh, các trạm không gian của chúng ta sẽ hoạt động hiệu quả hơn nhiều trong những điều kiện này."

 MESSAGE_CELESTIAL_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Loại bão này sẽ làm nghẽn các cảm biến của chúng ta, khiến chúng ta không thể phát hiện các hạm đội khác bên trong các hệ sao này và làm chậm tốc độ du hành không gian. Bất chấp những rủi ro đó, chúng ta có thể tận dụng những điều kiện này để tăng sản lượng của một số công việc nhất định trong suốt thời gian diễn ra bão."

 MESSAGE_NEXUS_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Loại bão này gây ra nguy cơ cực kỳ nghiêm trọng đối với các thuộc địa, hạm đội và trạm không gian của chúng ta. Chúng sẽ phải hứng chịu thiệt hại nặng nề cho đến khi bão đi qua."

 MESSAGE_SHROUD_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Nồng độ năng lượng tâm linh đậm đặc trong cơn bão này sẽ làm giảm đáng kể độ ổn định tại các thuộc địa của chúng ta, nhưng lại hỗ trợ hiệu quả né tránh của hạm đội."

 MESSAGE_SHROUD_STORM_COSMIC_STORM_SPOTTED_SHROUD_BREACHED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Nồng độ năng lượng tâm linh đậm đặc trong cơn bão này sẽ làm giảm đáng kể độ ổn định tại các thuộc địa của chúng ta, nhưng tri thức của chúng ta trong việc định hướng Màn Che sẽ hỗ trợ hiệu quả của các hạm đội và Nhà Thấu Thị của chúng ta.\n\nMàn Che đang khuấy động... Chúng ta phải chuẩn bị sẵn sàng cho mọi tình huống."

 MESSAGE_GRAVITY_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Ảnh hưởng trọng lực nặng nề của cơn bão này sẽ gây khó khăn ngày càng tăng cho các hoạt động của hạm đội, trong đó các tàu lớn hơn của chúng ta gặp rủi ro cao nhất.\n\nBất chấp những vấn đề này, các thuộc địa của chúng ta sẽ có thể sử dụng môi trường khắc nghiệt này để tạo lợi thế, nâng cao hiệu quả của một số nhiệm vụ nhất định."

 MESSAGE_MAGNETIC_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Lực từ cực mạnh của cơn bão này sẽ khiến các hệ thống bảo trì hạm đội và công trình của chúng ta rơi vào tình trạng hỗn loạn.\n\nLực từ của bão đã tạo ra sự cộng hưởng bất ngờ với các kỹ thuật luyện kim tiên tiến của chúng ta. Sự tương tác này sẽ làm giảm các chi phí liên quan đến Luyện Kim Sư của chúng ta trong suốt thời gian diễn ra sự kiện thiên hà này."

 MESSAGE_PARTICLE_STORM_COSMIC_STORM_SPOTTED_DESC: "$MESSAGE_COSMIC_STORM_SPOTTED_DESC$$MESSAGE_STORM_INTRO$Mật độ mảnh vỡ hạt trong cơn bão này sẽ gây ra những tác động tàn khốc lên tàu bè và trạm không gian, vô hiệu hóa hoàn toàn khả năng hồi phục lá chắn của chúng. Những hạm đội đủ can đảm ở lại bên trong nên chuẩn bị cho một môi trường cực kỳ nguy hiểm."

