# Digsites #
###########################################

### Green Skies
 site_green_skies: "Bầu Trời Xanh Lục"
 site_green_skies_intro: "Các cảm biến của chúng ta đã thu nhận được một loạt tín hiệu hấp dẫn phát ra từ khu vực này của hành tinh. Dựa trên thành phần của chúng, rất có khả năng có tàn tích của một nền văn minh cổ đại đang chờ được khai quật tại đó."
 cstorms.1400.name: "Bầu Trời Xanh Lục"
 cstorms.1400.desc: "Sau khi điều tra thêm, chúng ta xác định tín hiệu bắt nguồn từ một hang động ngầm rộng lớn trên [From.Planet.GetName].\n\nThực hiện một cuộc thám hiểm xuống vùng sâu chưa được khám phá này tiềm ẩn những rủi ro đáng kể. Địa hình gồ ghề và sự biến động nhiệt độ dữ dội sẽ thử thách trang bị của chúng ta đến giới hạn. Tuy nhiên, sự kỳ lạ của tín hiệu thôi thúc chúng ta tiếp tục."
 cstorms.1405.name: "Đi Sâu Vào Bóng Tối"
 cstorms.1405.desc: "Đội thám hiểm của chúng ta đã hạ mình xuống mạng lưới hang động phức tạp bên dưới bề mặt của [Fromfrom.getName]. Đi qua những vách đá nguy hiểm và các khoang ngầm rực rỡ ánh lân tinh, chúng ta đã tiếp cận gần hơn với nguồn phát tín hiệu.\n\nTrên mặt đất, [Root.GetLeaderName] thông báo cho chúng ta rằng bầu trời bên ngoài đang chuyển sang màu xanh lục, báo hiệu một cơn bão vũ trụ sắp sửa hình thành trên [Fromfrom.getName]. Dù vậy, chúng ta vẫn quyết tâm tiến về phía nguồn tín hiệu."
 cstorms.1410.name: "Sự Điên Rồ"
 cstorms.1410.desc: "Bước tiến của chúng ta bị chặn lại trong chốc lát bởi một cánh cửa kim loại hư hỏng nặng. Không tốn nhiều sức, chúng ta đã vượt qua chướng ngại này và một cơ sở lưu trữ thô sơ hiện ra.\n\nCác kệ hàng của nó chất đầy vô số công nghệ vô chủ. Các hộp hàng của những tập đoàn nổi tiếng đã được xếp gọn gàng sát tường. Và cuối cùng, nguồn gốc của tín hiệu mà chúng ta đuổi theo bấy lâu nay: một máy tính máy phát đáp không khác mấy so với thiết bị của chúng ta.\n\nKhi đăng nhập vào thiết bị và tìm kiếm trong cơ sở dữ liệu của nó, các [Root.Owner.GetEngineerPlural] của chúng ta bắt đầu đưa ra một kết luận táo bạo: tín hiệu này đã được cố tình dàn dựng để có vẻ bí ẩn và hấp dẫn nhất có thể — bắt chước và kết hợp các đặc tính từ nhiều nền văn minh khác nhau.\n\nHơn thế nữa, bên trong các hộp hàng, chúng ta tìm thấy các bộ dụng cụ xây dựng của chính những tàn tích mà chúng ta bắt gặp trên mặt đất.\n\nChúng ta liên lạc với trại căn cứ để báo cáo phát hiện, nhưng cơn bão vũ trụ đã bắt đầu làm gián đoạn các đường truyền liên lạc. Điều cuối cùng chúng ta nghe được từ [Root.GetLeaderName] là một chuỗi mệnh lệnh đầy lo lắng; dường như trại căn cứ của chúng ta đang bị tấn công!"
 cstorms.1410.a: "Chuẩn bị ứng phó ngay!"
 cstorms.1415.name: "Hải Tặc!"
 cstorms.1415.desc: "Cơn bão vũ trụ bên trong [Fromfrom.getName] hóa ra đã che giấu một hạm đội hải tặc! Chính phi hành đoàn của chúng đã tấn công trại căn cứ của chúng ta. Lũ hải tặc yêu cầu chúng ta chuyển tiếp thông điệp này đến bạn:\n\n§LGửi những kẻ ngốc nghếch tuyệt đối,\n\nCảm ơn vì đã ghé thăm nơi ẩn náu bí mật nhất của chúng ta.\n\nThật đáng kinh ngạc khi thấy những sinh vật có vẻ thông minh lại từ bỏ mọi lý trí nhanh chóng đến thế mỗi khi đánh hơi thấy chút mùi vị nhỏ nhoi của các cổ vật cổ đại và di vật huyền bí? Có lẽ các người đã hy vọng tìm ra phương tiện để tiêu diệt một kẻ thù hùng mạnh? Để đóng các hạm đội vươn xa tới tận chân trời sự kiện? Hay các người chỉ đang cố tỏ ra tốt bụng với đồng loại của mình? Thật kỳ quặc làm sao.\n\nXin đừng buồn — nhiều kẻ khác đã đến trước các người, và mô hình kinh doanh của chúng ta phụ thuộc vào việc sẽ có thêm nhiều kẻ nữa tiếp bước các người.\n\nBây giờ, với một khoản tiền khiêm tốn 2000 năng lượng tín dụng, chúng ta sẽ trả lại thứ các người vừa đánh mất.\n\nTừ chối lời đề nghị của chúng ta, và ai biết được điều khủng khiếp gì có thể xảy ra với [Leader.getHerHim] cùng phi hành đoàn trang bị nghèo nàn của [Leader.getHisHer] vẫn đang mắc kẹt trên hành tinh.\n\nHãy lựa chọn khôn ngoan.§!\n\nChúng ta hiện đang an toàn trong các hang động này, nhưng không biết được bao lâu. Chúng ta có định chiều lòng lũ cướp này không?"
 cstorms.1415.a: "Chúng ta sẽ trả tiền chuộc."
 cstorms.1415.b: "Bảo chúng cút xuống Vực Thẳm mà mục rữa!"
 cstorms.1415.b.tt: "[Root.GetLeaderName] bị bắt làm con tin."
 cstorms.1416.name: "Phản Kháng"
 cstorms.1416.desc: "Chúng ta đã nhận được một thông điệp mới:\n\n§LThật đáng tiếc. Có rất nhiều điều thú vị mà chúng ta có thể làm với số tài nguyên đó.\n\nChúng ta sẽ thông báo cho viên chỉ huy và phi hành đoàn của [Leader.getHisHer] rằng mạng sống của họ không đáng giá công sức hay tín dụng. Có lẽ một tay buôn nô lệ gần đây hoặc một kẻ đồng hóa đầy nhiệt huyết sẽ thấy hứng thú. Chúng ta nghe nói xỏ dây thần kinh đang là xu hướng thời thượng mới đấy.\n\nChào thân ái từ những doanh nhân.§!\n\nChúng ta đã dùng mọi thứ tìm được để lập rào chắn cố thủ, và có đủ quân nhu để giữ chúng ta an toàn trong một thời gian. Nhưng hạm đội hải tặc cuối cùng chắc chắn sẽ chọc thủng phòng tuyến của chúng ta!"
 cstorms.1420.name: "Không Thể Bị Lừa Lần Nữa"
 cstorms.1420.desc: "Lũ hải tặc này không thể dùng thực lực để chứng minh cho những bài diễn thuyết xấc xược của chúng. Chẳng bao lâu sau, bất cứ thứ gì còn sót lại từ hạm đội của chúng đã biến thành một phần của hệ sinh thái thiên hà.\n\nChúng ta đã tái lập liên lạc với phi hành đoàn trên bề mặt ngay sau đó. Họ khá bàng hoàng trước trải nghiệm này, nhưng không chịu thương tổn nào.\n\nMặc dù chúng ta không khám phá ra hiểu biết sâu sắc nào về các nền văn minh cổ đại ở đây, nhưng trải nghiệm này đã tôi luyện nhu cầu cảnh giác cao độ. Chỉ huy đoàn thám hiểm đã không nhận ra mối nguy hiểm đang đến gần — chúng ta sẽ không mắc lại sai lầm tương tự."
 cstorms.1420.a: "Hãy để đó là một bài học cho tất cả chúng ta."
 cstorms.1420.b: "Nhà lãnh đạo đó sẽ không bao giờ làm chúng ta thất vọng nữa."
 cstorms.1425.name: "Niềm Vui Khi Làm Ăn"
 cstorms.1425.desc: "Chúng ta đã nhận được một thông điệp phản hồi:\n\n§LLựa chọn tuyệt vời, nếu chúng tôi có thể nhận xét như vậy!\n\nXin thông báo rằng khoản đóng góp của bạn cho 'Quỹ Doanh Nhân Khó Khăn Cần Hành Tinh Nghỉ Dưỡng' của chúng tôi đã được tiếp nhận và xử lý.\n\nBạn sẽ sớm thấy viên chỉ huy và phi hành đoàn đi kèm trở về trong sự sở hữu của mình.\n\nVà hãy nhớ giới thiệu chúng tôi cho tất cả các đối tác thương mại của bạn nhé.§!\n\nNgay sau đó chúng ta đã có thể tái lập liên lạc với phi hành đoàn trên bề mặt. Họ báo cáo khá bàng hoàng trước trải nghiệm này, nhưng không hề hấn gì.\n\nMặc dù không phát hiện ra hiểu biết sâu sắc nào về các nền văn minh cổ đại ở đây, trải nghiệm này đã tôi luyện nhu cầu cảnh giác. Chỉ huy đoàn thám hiểm đã không nhìn thấy mối nguy hiểm đang đến — chúng ta sẽ không phạm sai lầm tương tự."
 cstorms.1425.a: "$cstorms.1420.a$"
 cstorms.1425.b: "$cstorms.1420.b$"

 NAME_green_skies_pirate_country: "Khu Nghỉ Dưỡng"
 NAME_green_skies_pirate_fleet: "Những Doanh Nhân Kỳ Dị"
 KILL_EXILED_LEADER_EFFECT: "$LEADER$ đã bị xử tử vì sự bất tài."
 FREE_HOSTAGED_LEADER_EFFECT: "$LEADER$ đã trở về."
