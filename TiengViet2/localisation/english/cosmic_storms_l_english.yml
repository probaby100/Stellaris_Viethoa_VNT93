 particle_storm_aftermath_modifier: "Ngọn Gió Ăn Mòn"
 particle_storm_aftermath_modifier_tooltip: "$STORM_AFTERMATH_DESC$\n$t$- §H$particle_storm_aftermath_modifier$§!:\n$tt$- §R-40%§! đến §R-60%§! $MOD_PLANET_POP_ASSEMBLY_MULT$\n$tt$- §R-10%§! đến §R-30%§! $mod_planet_jobs_minerals_produces_mult$\n$tt$- §G+0.02§! đến §G+0.06§! $r_volatile_motes$ từ Dân Cư"
 particle_storm_aftermath_modifier_severity_desc: "Cơn $particle_storm$ nghiền nát mọi thứ từ kim loại đến sinh vật hữu cơ, gây thiệt hại lớn cho sản lượng khoáng sản của chúng ta. Tuy nhiên, phần cặn lắng lại chứa các chất có giá trị."
 particle_storm_aftermath_modifier_severity_1: "Dư Chấn: $particle_storm_aftermath_modifier$"
