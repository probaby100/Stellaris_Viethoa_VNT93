# Storm Tech Insight events
 cstorms.505.name: "Trực Diện Cơn Bão"
 cstorms.505.desc: "Sau hậu quả tàn phá từ §H[this.GetAffectedStormType]§!, chúng ta đã thu được một số hiểu biết độc đáo về các hiện tượng thiên hà này.\n\nBằng cách nghiên cứu khí tượng học vũ trụ, chúng ta có thể bảo vệ bản thân tốt hơn trong tương lai. Lĩnh vực nghiên cứu mới này cuối cùng có thể mang lại các phương tiện để làm chủ những cơn bão này."

# Storm Buildings
 building_storm_attraction_center: "Trung Tâm Thu Hút Bão"
 building_storm_attraction_center_desc: "Thông qua việc thao túng cẩn thận các lực hấp dẫn, các cơ sở này thu hút các cơn bão vũ trụ ở gần."

 building_advanced_storm_attraction_center: "Trung Tâm Thu Hút Bão Nâng Cao"
 building_advanced_storm_attraction_center_desc: "Những hiểu biết sâu sắc tiên tiến về năng lượng tối cho phép chúng ta tăng áp cho mỗi $building_storm_attraction_center$ và hút các cơn bão vũ trụ vào thậm chí còn hiệu quả hơn."

 building_storm_repellent_center: "Trung Tâm Đẩy Lùi Bão"
 building_storm_repellent_center_desc: "Cơn bão càng xa, người dân của chúng ta càng an toàn — và tâm trí họ càng an tâm hơn. Thiết bị đo đạc khí tượng vũ trụ phức tạp của các trung tâm này sẽ đẩy lùi các cơn bão đang tiến đến gần."
 building_advanced_storm_repellent_center: "Trung Tâm Đẩy Lùi Bão Nâng Cao"
 building_advanced_storm_repellent_center_desc: "Bất kỳ sự thao túng không-thời gian nào cũng đều chính đáng nếu nó giữ cho thế giới của chúng ta thoát khỏi những cơn bão vũ trụ. Trung tâm này thực hiện chính xác điều đó."

 building_storm_resistant_production: "Trung Tâm Cứu Trợ Bão"
 building_storm_resistant_production_desc: "Trung tâm viện trợ này hỗ trợ các nỗ lực tại địa phương nhằm triệt tiêu tác động của bão vũ trụ lên sản xuất của thuộc địa. Thông qua sự điều phối và liên lạc hiệu quả, $building_storm_resistant_production$ cho phép triển khai nhanh chóng các đội cứu hộ, cũng như cải thiện các điều kiện cho hoạt động thương mại trên toàn hành tinh."
 building_storm_resistant_production_tt: "Các tác động tiêu cực từ §Y$default_storm$§! ảnh hưởng đến sản xuất của thuộc địa giảm §G30%§!.\n\nKhi có §Y$default_storm$§! hiện diện:$TABBED_NEW_LINE$$mod_planet_miners_minerals_produces_add$: §G+0.5§! $TABBED_NEW_LINE$$mod_planet_farmers_food_produces_add$: §G+0.5§! $TABBED_NEW_LINE$$mod_planet_technician_energy_produces_add$: §G+0.5§! \n\nCho phép Quyết Định Thuộc Địa §Y$decision_hunker_down$§!"

 building_advanced_storm_resistant_production: "Máy Triệt Tiêu Bão"
 building_advanced_storm_resistant_production_desc: "Bằng cách bổ sung các hệ thống kiểm soát thời tiết vào mỗi $building_storm_resistant_production$, tác động tiêu cực của bão vũ trụ sẽ giảm đi đáng kể. Ngoài ra, các đội cứu hộ có thể được triển khai hiệu quả hơn nữa và thương mại hành tinh gần như không bị ảnh hưởng bởi điều kiện thời tiết địa phương."
 building_advanced_storm_resistant_production_tt: "Các tác động tiêu cực từ §Y$default_storm$§! ảnh hưởng đến sản xuất của thuộc địa giảm §G45%§!.\n\nKhi có §Y$default_storm$§! hiện diện:$TABBED_NEW_LINE$$mod_planet_miners_minerals_produces_add$: §G+1§! $TABBED_NEW_LINE$$mod_planet_farmers_food_produces_add$: §G+1§! $TABBED_NEW_LINE$$mod_planet_technician_energy_produces_add$: §G+1§! \n\nCho phép Quyết Định Thuộc Địa §Y$decision_hunker_down$§!"

 building_adakkaria_patriotic_institute: "Học Viện Lễ Hội Ái Quốc"
 building_adakkaria_patriotic_institute_desc: "$building_adakkaria_patriotic_institute$ là một kho tàng hiểu biết sâu sắc tiên tiến về tình trạng của các sinh vật có tri giác. Tại đây, chúng ta trao quyền cho người dân nuôi dưỡng cơn bão nội tâm trong khi tránh đi bài ca quyến rũ đầy tàn nhẫn của Công Ước."
 building_adakkaria_patriotic_institute_effect_desc: "Nếu một cơn bão vũ trụ đi qua hệ sao này, có 10% cơ hội £pop£ §HDân Cư§! nhận được đặc tính $Name_Storm_Fused$."
 building_adakkaria_patriotic_institute_effect_upgrade_desc: "Nếu một cơn bão vũ trụ đi qua hệ sao này, có 40% cơ hội £pop£ §HDân Cư§! nhận được đặc tính $Name_Storm_Fused$. Ngoài ra, có 20% cơ hội mỗi 10 năm rằng §Y100§! £pop£ §HDân Cư§! sẽ biến thành một cơn bão vũ trụ."

 building_astrometeorology_observation_center: "Đài Quan Sát Khí Tượng Vũ Trụ"
 building_astrometeorology_observation_center_desc: "Với các cảm biến tinh vi, trung tâm quan sát này nghiên cứu các điều kiện môi trường đa dạng để nâng cao hiểu biết của chúng ta về vũ trụ tự nhiên."
 concept_building_astrometeorology_observation_center: "$building_astrometeorology_observation_center$"

 building_storm_summoning_theater: "Nhà Hát Triệu Hồi Bão"
 building_storm_summoning_theater_desc: "Một sự kết hợp vui tươi giữa nghệ thuật và công nghệ, những vũ điệu xoay tròn cuồng nhiệt của các $job_storm_dancer_plural$ giúp lôi cuốn các cơn bão vũ trụ."

 building_storm_holo_theater: "Sảnh Toàn Ảnh Bão Tố"
 building_storm_holo_theater_desc: "Được phát sóng trên toàn bộ hành tinh và xa hơn nữa, $building_storm_holo_theater$ mở rộng tầm ảnh hưởng của các $job_storm_dancer_plural$ đầy mê hoặc của chúng ta."

 building_storm_grand_theater: "Đại Nhà Hát Bão Tố"
 building_storm_grand_theater_desc: "Hiện thân của đỉnh cao thành tựu nghệ thuật và kỹ thuật, những nhà hát lớn này cung cấp vũ đài hoàn hảo cho vũ điệu tối thượng."

 sm_storm_attraction_computer: "Dàn Máy Thu Hút Bão"
 sm_storm_attraction_computer_desc: "Bộ phận này cho phép chúng ta thao túng các điều kiện hấp dẫn cục bộ để thu hút các cơn bão từ độ sâu của không gian."
 system_has_storm_attraction_tech_tt: "§RHệ sao có §YTrường Thu Hút Bão Vũ Trụ§!.§!"

 sm_storm_repelling_computer: "Dàn Máy Đẩy Lùi Bão"
 sm_storm_repelling_computer_desc: "Mảng laser mạnh mẽ này có thể tạo ra các túi hạt từ tính mang điện tích cao, tạo ra một lực đẩy tự nhiên chống lại các cơn bão vũ trụ."
 system_has_storm_repelling_tech_tt: "§RHệ sao có §YTrường Đẩy Lùi Bão Vũ Trụ§!.§!"

