 solar_storm_aftermath_custom_desc: "Cơn §Y$solar_storm$§! đã để lại mức độ nhiễm phóng xạ nguy hiểm trên khắp hành tinh."
 celestial_storm_aftermath_custom_desc: "Cơn §Y$celestial_storm$§! đã để lại một lớp sương mù bụi vũ trụ dày đặc bao phủ hành tinh."
 shroud_storm_aftermath_custom_desc: "Một §Y$shroud_storm$§! đã gây ra sự gia tăng hoạt động siêu nhiên trên khắp hành tinh."

