 PROJECT_TEMPEST_BREWING_DESC: "Hệ thống bão nghìn năm có một này sở hữu những đặc tính khác thường rất thích hợp cho việc điều chế. Nhưng trước hết, chúng ta cần hiểu rõ hơn về thành phần cấu tạo cơ bản của nó. Ai biết được chúng ta có thể làm sống dậy điều kỳ diệu tuyệt vời nào?"

# Events
 cstorms.3100.name: "Giông Bão Giáng Lâm"
 cstorms.3100.desc: "Những cơn bão tự nhiên trên §Y[owner.capital_scope.GetName]§! đã cho chúng ta thấy sức mạnh đáng kinh ngạc của thiên nhiên - cả sự dữ dội đầy kích thích của giông bão lẫn sự hồi sinh nối gót con đường hủy diệt của nó.\n\nGần đây, các trạm khí tượng trên khắp hành tinh đã phát hiện một hiện tượng phi thường: một mạng lưới siêu bão đang sẵn sàng càn quét khắp thế giới.\n\nCác [Root.Owner.GetScientistPlural] của chúng ta gọi đó là 'cơ duyên kỳ diệu'. Những cơn giông hiếm thấy này tạo điều kiện hoàn hảo để chúng ta chứng kiến một điều gì đó thực sự mang tính cách mạng."
 cstorms.3100.desc.nomad: "Những cơn bão xuất hiện tự nhiên đã cho chúng ta thấy sức mạnh đáng kinh ngạc của thiên nhiên - cả cường độ dữ dội đầy kích thích lẫn sự tái sinh nối bước sau đó.\n\nGần đây, cảm biến của thuyền hòm đã phát hiện ra một hiện tượng phi thường trong hư không xung quanh: một mạng lưới siêu bão sẵn sàng bùng phát ngay trong hệ sao này.\n\nCác [Root.Owner.GetScientistPlural] của chúng ta gọi đó là 'cơ duyên kỳ diệu'. Những cơn giông hiếm thấy này tạo ra điều kiện hoàn hảo để chứng kiến một điều gì đó thực sự mang tính cách mạng."
 cstorms.3100.a: "Mang theo thiết bị thực địa!"

 cstorms.3105.name: "Giông Tố Chực Chờ"
 cstorms.3105.desc: "Các [Root.Owner.GetScientistPlural] của chúng ta đã khám phá ra những bí mật về thao túng bão. Dự báo năng lượng bão vượt ngoài mọi biểu đồ và tất cả chúng ta đều háo hức chờ đón điều đó. Chúng ta sẽ được thử thách và chứng minh mình hoàn toàn xứng đáng.\n\nCác công trình đặc biệt có thể đóng vai trò như các trung tâm điều phối để nuôi dưỡng bão. Một công trình trên §Y[owner.capital_scope.GetName]§! làm tăng khả năng thu hút bão sẽ đẩy nhanh tiến độ của chúng ta hướng tới cơn bão tối thượng."
 cstorms.3105.desc.nomad: "Các [Root.Owner.GetScientistPlural] của chúng ta đã khám phá ra những bí mật về thao túng bão. Dự báo năng lượng bão vượt ngoài mọi biểu đồ và tất cả chúng ta đều háo hức chờ đón điều đó. Chúng ta sẽ được thử thách và chứng minh mình hoàn toàn xứng đáng.\n\nCác mô-đun trạm vũ trụ đặc biệt có thể đóng vai trò như trung tâm điều phối nuôi dưỡng bão. Một mô-đun tăng cường khả năng thu hút bão sẽ đẩy nhanh tiến độ hướng tới cơn bão tối thượng."
 cstorms.3105.a: "Đúng là âm nhạc rót vào tai!"
 cstorms.3105.a.tt: "Một §YTòa Nhà Thu Hút Bão§! trên hành tinh thủ đô:\n$situation_speed_tt$: §G+10%§!\n\nMột §Y$sm_storm_attraction_computer$§! tại trạm không gian hệ sao thủ đô:\n$situation_speed_tt$: §G+10%§!\n\n"
 cstorms.3105.a.tt.nomad: "Giữ thuyền hòm trong hệ sao §Y[stormfall_system.GetName]§! để nuôi dưỡng cơn bão đang tụ hội:\n$situation_speed_tt$: §G+10%§!\n\n"

 cstorms.3110.name: "Hội Tụ Bão Tố"
 cstorms.3110.desc.outro: "Bằng cách bơm năng lượng vào các cơn bão tự nhiên, chúng ta có thể tạo ra điều kiện cho bão điện từ.\n\nViệc thao túng lõi hành tinh có thể định hướng lại từ trường của [owner.capital_scope.GetName] để làm bùng phát bão từ vũ trụ.\n\nCuối cùng, bằng cách đảo ngược cực tính của hạt tachyon tại các địa điểm hành tinh cụ thể, các biến đổi trường lực có thể tạo ra bão trọng lực."
 cstorms.3110.desc.regular: "Chúng ta đã học được cách kích hoạt các dao động giông bão của [owner.capital_scope.GetName], định hình chúng thành trải nghiệm tối thượng. Nhưng chúng ta phải quyết định xem loại bão nào là tráng lệ nhất.\n\n$cstorms.3110.desc.outro$"
 cstorms.3110.desc.hive: "Chúng ta đã học được cách kích hoạt các dao động giông bão của [owner.capital_scope.GetName], định hình chúng thành trải nghiệm tối thượng. Nhưng chúng ta vẫn chưa quyết định loại bão nào là tráng lệ nhất.\n\n$cstorms.3110.desc.outro$"
 cstorms.3110.desc.machine: "Chúng ta đã học được cách kích hoạt các dao động giông bão của [owner.capital_scope.GetName], định hình chúng thành trải nghiệm tối thượng. Nhưng các tiến trình phán đoán giá trị của chúng ta đang bị mắc kẹt trong các vòng lặp đệ quy khi cố gắng xác định loại bão nào là tráng lệ nhất.\n\n$cstorms.3110.desc.outro$"
 cstorms.3110.desc.nomad: "Các trường lực rít gào xung quanh thuyền hòm, làm chao đảo lớp vỏ giáp và khuấy động bầu không khí bên trong. Các siêu bão đang hội tụ lại gần nhau, tạo nên một cơn cuồng nộ vô tiền khoáng hậu.\n\nĐể thúc đẩy cơn bão này hơn nữa, chúng ta có thể phóng các hợp chất phản ứng vào tâm bão. Bằng cách lựa chọn chất xúc tác phù hợp, chúng ta có thể định hình bản chất cơ bản của cơn bão."
 cstorms.3110.a: "Phóng dòng hạt điện tích."
 cstorms.3110.a.tt: "Gieo mầm một §Y$electric_storm$§! hành tinh."
 cstorms.3110.b: "Tiêm vật chất từ tính."
 cstorms.3110.b.tt: "Gieo mầm một §Y$magnetic_storm$§! hành tinh."
 cstorms.3110.c: "Gieo mầm tachyon trọng lực."
 cstorms.3110.c.tt: "Gieo mầm một §Y$gravity_storm$§! hành tinh."

 cstorms.3130.name: "Khai Mở Năng Lực"
 cstorms.3130.desc.electric: "Những tia chớp khổng lồ xé toạc bầu trời của [owner.capital_scope.GetName]!\n\nHiện tượng phóng điện dữ dội này không chỉ nạp điện cho bề mặt hành tinh mà còn khiến chúng ta tràn đầy phấn khích tột độ! Dù ngành nông nghiệp sẽ chịu tổn thất trước cơn bão điện từ, tiềm năng phát điện là không thể phủ nhận."
 cstorms.3130.desc.magnetic: "Kim la bàn quay tít mù mịt khi từ trường của [owner.capital_scope.GetName] tự uốn éo vặn vẹo.\n\nBằng cách khoan sâu qua lớp vỏ hành tinh quê nhà, chúng ta đã tiêm trực tiếp vật chất từ hóa vào lõi, và những cơn bão tự nhiên đã khuếch đại các dao động từ trường sinh ra. Điều này sẽ cản trở việc tạo năng lượng, nhưng lại cải thiện việc phát hiện các mỏ khoáng sản mới."
 cstorms.3130.desc.gravity: "Chưa từng có lúc nào mà những bước di chuyển đơn giản lại mang đến cảm giác hồi hộp đến thế! Trọng lực tăng giảm mà chẳng hề báo trước một giây.\n\nCác địa điểm điều khiển hạt rải rác trên khắp [owner.capital_scope.GetName] đã đảo ngược cực tính của các tachyon, tập trung chúng thành những quả cầu năng lượng nổ tanh tách. Khi các quả cầu biến mất nhanh chóng - các [Root.Owner.GetScientistPlural] tin rằng chúng đã bị đưa ngược về quá khứ - các sóng hấp dẫn gợn sóng lan tỏa về mọi hướng.\n\nNhững dao động sinh ra sẽ khiến công việc trên bề mặt hành tinh trở nên khó khăn hơn, nhưng có thể cải thiện các vị trí việc làm trên các trạm vũ trụ trên quỹ đạo."
 cstorms.3130.desc.electric.nomad: "Hư không nổ lách tách. Sét rít gầm xẹt qua lớp vỏ ngoài của thuyền hòm!\n\nNhững đợt phóng điện mạnh mẽ này đã khiến phi hành đoàn của chúng ta thực sự rạo rực. Trong khi hệ thống thủy canh sẽ chịu ảnh hưởng từ cơn bão điện từ, tiềm năng sản xuất năng lượng là không thể phủ nhận."
 cstorms.3130.desc.magnetic.nomad: "Mọi la bàn trên tàu đều quay tít mù khi từ trường xung quanh thuyền hòm bị bẻ cong dữ dội.\n\nBằng cách xả vật chất từ hóa vào những cơn bão xung quanh, chúng ta đã khuếch đại dao động từ trường của chúng. Điều này sẽ gây cản trở việc sản xuất năng lượng, nhưng lại nâng cao khả năng phát hiện các mỏ khoáng sản mới."
 cstorms.3130.desc.gravity.nomad: "Chưa từng có lúc nào việc di chuyển qua các tầng boong lại phấn khích đến thế! Trọng lực dâng lên rồi biến mất chỉ trong tích tắc.\n\nCác máy phát trường lực trên khắp thuyền hòm đã đảo ngược cực tính của hạt tachyon, gom chúng thành những khối cầu năng lượng nổ tanh tách. Khi những khối cầu tan biến nhanh chóng - các [Root.Owner.GetScientistPlural] tin rằng chúng đã bị đẩy lùi về quá khứ - sóng hấp dẫn gợn sóng lan tỏa khắp bốn phương.\n\nNhững dao động sinh ra sẽ khiến công việc trên tàu vất vả hơn, nhưng có thể nâng cao hiệu suất công việc trên các trạm quỹ đạo."
 cstorms.3130.a: "Một chuyến đi ngoạn mục."
 cstorms.3130.a.tt.regular: "Trong thời gian bão hành tinh diễn ra:\n$MOD_POP_HAPPINESS$: §G+20%§!"
 cstorms.3130.a.tt.gestalt: "Trong thời gian bão hành tinh diễn ra:\n$mod_country_unity_produces_mult$: §G+5%§!"

 cstorms.3140.name: "Rung Động Tuyệt Vời"
 cstorms.3140.desc.intro: "Các [Root.Owner.GetScientistPlural] của chúng ta tin chắc rằng cùng một ý tưởng mà chúng ta đã dùng để kích thích các cơn bão hành tinh có thể áp dụng trên quy mô lớn hơn nhiều, giờ đây khi toàn bộ hệ sao đang cuộn xoáy nguồn năng lượng giông bão mãnh liệt."
 cstorms.3140.desc.electric: "$cstorms.3140.desc.intro$\n\nChúng ta có thể sử dụng tri thức và cơ sở hạ tầng hiện có để biến nó thành một $electric_storm$, hoặc chúng ta tạo ra một điều gì đó mới mẻ và đầy phấn khích.\n\nĐưa vào một số loại khoáng sản nhất định sẽ khuếch đại sự cộng hưởng từ của cơn bão, trong khi việc sử dụng hợp kim sẽ biến cơn bão thành một giếng trọng lực."
 cstorms.3140.desc.magnetic: "$cstorms.3140.desc.intro$\n\nChúng ta có thể sử dụng tri thức và cơ sở hạ tầng hiện có để biến nó thành một $magnetic_storm$, hoặc chúng ta tạo ra một điều gì đó mới mẻ và đầy phấn khích.\n\nNạp năng lượng cho ngôi sao của chúng ta sẽ khuếch đại điện thế của cơn bão, trong khi việc sử dụng hợp kim sẽ biến cơn bão thành một giếng trọng lực."
 cstorms.3140.desc.gravity: "$cstorms.3140.desc.intro$\n\nChúng ta có thể sử dụng tri thức và cơ sở hạ tầng hiện có để biến nó thành một $gravity_storm$, hoặc chúng ta tạo ra một điều gì đó mới mẻ và đầy phấn khích.\n\nĐưa vào một số loại khoáng sản nhất định sẽ khuếch đại sự cộng hưởng từ của cơn bão, trong khi nạp điện cho ngôi sao của chúng ta sẽ khuếch đại điện thế của bão."
 cstorms.3140.a: "Nạp điện cho ngôi sao."
 cstorms.3140.a.tt: "Gieo mầm một §Y$electric_storm$§! vũ trụ.\nTrong §Y2§! năm:$TABBED_NEW_LINE$$mod_country_energy_produces_mult$: §R-50%§!$TABBED_NEW_LINE$$mod_country_unity_produces_mult$: §G+20%§!"
 cstorms.3140.a.infra: "Sử dụng cơ sở hạ tầng hiện có."
 cstorms.3140.a.tt.electric: "Gieo mầm một §Y$electric_storm$§! vũ trụ.\nTrong §Y2§! năm:$TABBED_NEW_LINE$$mod_country_unity_produces_mult$: §G+5%§!"
 cstorms.3140.b: "Triển khai khoáng sản từ tính."
 cstorms.3140.b.tt: "Gieo mầm một §Y$magnetic_storm$§! vũ trụ.\nTrong §Y2§! năm:$TABBED_NEW_LINE$$mod_country_minerals_produces_mult$: §R-50%§!$TABBED_NEW_LINE$$mod_country_unity_produces_mult$: §G+20%§!"
 cstorms.3140.b.tt.magnetic: "Gieo mầm một §Y$magnetic_storm$§! vũ trụ.\nTrong §Y2§! năm:$TABBED_NEW_LINE$$mod_country_unity_produces_mult$: §G+5%§!"
 cstorms.3140.c: "Sử dụng các hợp kim đặc biệt."
 cstorms.3140.c.tt: "Gieo mầm một §Y$gravity_storm$§! vũ trụ.\nTrong §Y2§! năm:$TABBED_NEW_LINE$$mod_country_alloys_produces_mult$: §R-25%§!$TABBED_NEW_LINE$$mod_country_unity_produces_mult$: §G+20%§!"
 cstorms.3140.c.tt.gravity: "Gieo mầm một §Y$gravity_storm$§! vũ trụ.\nTrong §Y2§! năm:$TABBED_NEW_LINE$$mod_country_unity_produces_mult$: §G+5%§!"

 cstorms.3160.name: "Sau Cơn Bão"
 cstorms.3160.desc: "Khi cơn bão hành tinh tan biến, một đặc điểm lâu dài mới đã xuất hiện trên [owner.capital_scope.GetName]. Một lần nữa, một cơn bão lại mang đến sự thay đổi và tái sinh.\n\nDù cơn bão cục bộ này vô cùng phấn khích, chúng ta chỉ có thể tưởng tượng về những tiềm năng của một cơn bão vũ trụ thực sự. Tại sao lại mất nhiều thời gian đến vậy?"
 cstorms.3160.desc.nomad: "Khi cơn bão tan đi, nó đã để lại một dấu ấn lâu dài ngay trên chính thuyền hòm. Một lần nữa cơn bão lại mang đến sự đổi thay và tái sinh.\n\nDù điều này vô cùng phấn khích, chúng ta chỉ có thể tưởng tượng những tiềm năng của một cơn bão vũ trụ đích thực. Tại sao nó lại mất nhiều thời gian đến vậy?"
 cstorms.3160.a: "Một kỷ niệm tuyệt vời!"
 cstorms.3160.a.tt.electric: "Cơn bão đã để lại §Y$d_buzzing_plains$§! nhiễm điện trên [owner.capital_scope.GetName]."
 cstorms.3160.a.tt.magnetic: "Cơn bão đã để lại §Y$d_geothermal_vent$§! mới trên [owner.capital_scope.GetName]."
 cstorms.3160.a.tt.gravity: "Cơn bão đã để lộ một §Y$d_rich_mountain$§! trên [owner.capital_scope.GetName]."
 cstorms.3160.a.tt.electric.nomad: "Chúng ta đã trang bị cho thuyền hòm một §Y$d_stormfall_electric$§!."
 cstorms.3160.a.tt.magnetic.nomad: "Chúng ta đã trang bị cho thuyền hòm một §Y$d_stormfall_magnetic$§!."
 cstorms.3160.a.tt.gravity.nomad: "Chúng ta đã trang bị cho thuyền hòm một §Y$d_stormfall_gravity$§!."

 cstorms.3170.name: "Tạo Hình Vũ Trụ"
 cstorms.3170.desc.intro: "Chúng ta có thể thúc đẩy sự xuất hiện của cơn bão vũ trụ bao la đang dần thành hình, nhưng phải tự hỏi chính mình - liệu chúng ta đã thực sự sẵn sàng cho chuyến đi để đời của mình chưa?\n\n"
 cstorms.3170.desc.scientist.snippet: "Một nhóm [Root.Owner.GetScientistPlural] do §Y[event_target:storm_scientist.GetName]§! dẫn đầu có thể nghiên cứu các mô thức bão vũ trụ sơ khai này để tìm ra phương cách tối ưu thao túng sự hình thành của chúng.\n\n"
 cstorms.3170.desc.commander.snippet: "Nếu phái quân đội do §Y[event_target:storm_commander.GetName]§! chỉ huy, họ có thể bắn phá vào cơn giông bão đang trỗi dậy và để năng lượng tuôn trào cuồn cuộn.\n\n"
 cstorms.3170.desc.outro: "Đội ngũ do nhà lãnh đạo dẫn đầu này phải đối mặt với nguy cơ không thể trở về. Nhưng bù lại, họ có thể đạt được một thành tựu vô cùng phi thường!"
 cstorms.3170.desc.both: "$cstorms.3170.desc.intro$$cstorms.3170.desc.scientist.snippet$$cstorms.3170.desc.commander.snippet$$cstorms.3170.desc.outro$"
 cstorms.3170.desc.scientist: "$cstorms.3170.desc.intro$$cstorms.3170.desc.scientist.snippet$$cstorms.3170.desc.outro$"
 cstorms.3170.desc.commander: "$cstorms.3170.desc.intro$$cstorms.3170.desc.commander.snippet$$cstorms.3170.desc.outro$"
 cstorms.3170.desc.none: "Tất cả những gì chúng ta có thể làm lúc này là chờ đợi cơn bão vũ trụ thành hình.\n\nSự mong mỏi gần như không thể kìm nén, nhưng sẽ khiến cho phần thưởng gặt hái được càng thêm ngọt ngào."

 cstorms.3170.a: "Phái các [Root.Owner.GetScientistPlural]."
 cstorms.3170.a.tt: "Nhà Khoa Học §Y[event_target:storm_scientist.GetName]§! tạm thời mất tích và có nguy cơ tử vong."
 cstorms.3170.b: "Hạ lệnh cho quân đội tiến lên."
 cstorms.3170.b.tt: "Chỉ Huy §Y[event_target:storm_commander.GetName]§! tạm thời mất tích và có nguy cơ tử vong."
 cstorms.3170.c: "Chọn cách an toàn và chờ đợi."

 cstorms.3190.name: "Khởi Đầu Của Muôn Vàn Bão Tố"
 cstorms.3190.desc.intro: "Nó bắt đầu bằng một nếp gấp trên cấu trúc vũ trụ. Năng lượng nhảy múa, hợp nhất và va chạm. Một chút hạt kỳ dị, một chút khối lượng, và cuối cùng, cơn bão non trẻ quay quanh ngôi sao đã kết tủa con quái thú sừng sững trước mắt chúng ta.\n\nĐược nhào nặn theo ý muốn của chúng ta, ân huệ này của tự nhiên và trí tuệ thống trị cả bầu trời."
 cstorms.3190.desc.success: "$cstorms.3190.desc.intro$ Nhà lãnh đạo của chúng ta cưỡi xuyên qua cơn bão đã thổi bùng lên một cơn cuồng nhiệt phấn khích.\n\nChúng ta đã làm được điều này. Một mình chúng ta làm nên điều này. Hãy cưỡi trên cơn bão này và đón nhận cảm giác phấn khích của một đời người!"
 cstorms.3190.desc.failure: "$cstorms.3190.desc.intro$ Nhà lãnh đạo của chúng ta đã hy sinh trong cơn bão, nhưng quả là một cách ra đi lẫm liệt!\n\nChúng ta đã làm được điều này. Một mình chúng ta làm nên điều này. Hãy cưỡi trên cơn bão này và đón nhận cảm giác phấn khích của một đời người!"
 cstorms.3190.desc.wait: "$cstorms.3190.desc.intro$ Chúng ta đã chờ đợi rất lâu, nhưng ngày đó cuối cùng đã tới.\n\nChúng ta đã làm được điều này. Một mình chúng ta làm nên điều này. Hãy cưỡi trên cơn bão này và đón nhận cảm giác phấn khích của một đời người!"
 cstorms.3190.a.success: "Tiếp tục cưỡi sóng!"
 cstorms.3190.a.failure: "Hãy chứng kiến!"
 cstorms.3190.a.failure.tt: "\nNhà lãnh đạo của chúng ta đã ra đi trong ánh hào quang rực rỡ."
 cstorms.3190.a.wait: "Hoàn hảo!"

### Storm Fever ###

# Modifiers for Storm Fever event chain
 cs_storm_chasers_bad_vibes: "Cảm Giác Bất An"
 cs_storm_chasers_bad_vibes_desc: "Chúng ta cảm thấy một sự buồn chán đột ngột ập tới."


 cstorms.3205.name: "Vì Niềm Đam Mê Cuồng Nộ"
 cstorms.3205.normal: "Những rung cảm vũ trụ đã biến mất, và những chiến tích như thường lệ không còn gợi lên cảm giác phấn khích như trước đây. Không còn nghi ngờ gì việc chúng ta đã đạt được những điều khó tin, nhưng luôn có một cảm giác mơ hồ rằng điều gì đó đang bị thiếu vắng. Thành tựu của tổ tiên chúng ta, huyền thoại cả về quy mô lẫn tham vọng, đã phủ một bóng râm dài.\n\n\"Những trăn trở này thật mang tính hiện sinh tột bậc!\" một trong những khối óc hàng đầu của chúng ta gần đây đã viết. \"Bằng cách vượt qua hư không, liệu chúng ta có đang mở ra một khoảng trống vô định bên trong chính mình?\"\n\nNỗi âu lo là có thật, và thời khắc để hành động là ngay lúc này. Để khởi đầu mới mẻ, chúng ta quay về vạch xuất phát: một chuỗi thử thách được thiết kế riêng nhằm khơi dậy lượng adrenaline tối đa!"
 cstorms.3205.gestalt: "Những rung cảm vũ trụ đã biến mất, và những chiến tích như thường lệ không còn gợi lên cảm giác phấn khích như trước đây. Không còn nghi ngờ gì việc chúng ta đã đạt được những điều khó tin, nhưng luôn có một cảm giác mơ hồ rằng điều gì đó đang bị thiếu vắng.\n\nChúng ta bị quấy rầy bởi những câu hỏi: liệu chúng ta có thực sự biết mình là ai? Những ngày tháng vinh quang đã lùi lại phía sau rồi sao? Là một tập thể, chúng ta có trách nhiệm trở thành phiên bản tốt nhất của chính mình.\n\nNỗi âu lo là có thật, và thời khắc để hành động là ngay lúc này. Để bắt đầu lại, chúng ta quay về vạch xuất phát: một chuỗi thử thách được thiết kế riêng nhằm khơi dậy sự hưng phấn tối đa!"
 cstorms.3205.a: "Cảm giác hồi hộp chỉ vừa mới bắt đầu."
 cstorms.3205.tooltip: "Khám phá các thử thách của quá khứ trong Nhật Ký Tình Huống."
 cstorms.3215.name: "Cơn Sốt Đã Hạ"
 cstorms.3215.intro: "Chúng ta đã làm được!\n\nĐặt tầm mắt vào việc theo đuổi sự phấn khích thuần khiết, chúng ta đã vượt qua mọi thử thách. Hãy chứng kiến những gì chúng ta đã hoàn thành trong những năm qua!"
 cstorms.3215.desc: "$cstorms.3215.intro$\n\nNhư những người tiên phong kiệt xuất nhất thời xa xưa, chúng ta đã đẩy bản thân vượt qua mọi giới hạn.\n\nTuyệt vời hơn nữa, nhờ đối đầu trực diện với cơn cuồng nộ của thiên nhiên, chúng ta đã thu được cái nhìn sâu sắc khó tin về ý nghĩa của sự tồn tại của chính mình."
 cstorms.3215.a: "Chúng ta đã hoàn toàn trở lại!"

### Storm Frenzy ###
 cs_storm_chasers_storm_frenzy_1: "Cơn Cuồng Loạn Bão Tố"
 cs_storm_chasers_storm_frenzy_1_desc: "Sự xuất hiện của Cơn Đại Bão khiến chúng ta rơi vào trạng thái cuồng loạn phấn khích."
 cs_storm_chasers_storm_frenzy_2: "$cs_storm_chasers_storm_frenzy_1$"
 cs_storm_chasers_storm_frenzy_2_desc: "$cs_storm_chasers_storm_frenzy_1_desc$"
 cs_storm_chasers_storm_frenzy_3: "$cs_storm_chasers_storm_frenzy_1$"
 cs_storm_chasers_storm_frenzy_3_desc: "$cs_storm_chasers_storm_frenzy_1_desc$"
 cs_storm_chasers_storm_frenzy_1_gestalt: "$cs_storm_chasers_storm_frenzy_1$"
 cs_storm_chasers_storm_frenzy_1_gestalt_desc: "Sự xuất hiện của Cơn Đại Bão làm ý thức của chúng ta bừng cháy như lửa đỏ."
 cs_storm_chasers_storm_frenzy_2_gestalt: "$cs_storm_chasers_storm_frenzy_1$"
 cs_storm_chasers_storm_frenzy_2_gestalt_desc: "$cs_storm_chasers_storm_frenzy_1_gestalt_desc$"
 cs_storm_chasers_storm_frenzy_3_gestalt: "$cs_storm_chasers_storm_frenzy_1$"
 cs_storm_chasers_storm_frenzy_3_gestalt_desc: "$cs_storm_chasers_storm_frenzy_1_gestalt_desc$"
 cs_storm_chasers_the_code: "Quy Chuẩn"
 cs_storm_chasers_the_code_desc: "Thứ thúc đẩy chúng ta không phải là quyền bá chủ, cũng chẳng phải lợi ích vật chất. Chúng ta sống để thử thách mọi giới hạn của bản thân, những tín đồ nơi lằn ranh khốc liệt nhất của sự tồn tại."
 cs_storm_chasers_the_code_gestalt: "Quy Chuẩn"
 cs_storm_chasers_the_code_gestalt_desc: "$cs_storm_chasers_the_code_desc$"

 every_empire_opinion_hit: "Thái độ của §Y[global_event_country.GetGalCommunityOrGalImperium]§! đối với chúng ta thay đổi theo:"

 nexus_opinion_first_hit: "Lo Ngại Hạch Tâm"
 nexus_opinion_first_hit_tt: "$every_empire_opinion_hit$ §R$@first_hit_opinion_change$§!"
 nexus_opinion_second_hit: "Hoang Mang Hạch Tâm"
 nexus_opinion_second_hit_tt: "$every_empire_opinion_hit$ §R$@second_hit_opinion_change$§!"
 nexus_opinion_third_hit: "Khiếp Sợ Hạch Tâm"
 nexus_opinion_third_hit_tt: "$every_empire_opinion_hit$ §R$@third_hit_opinion_change$§!"
 nexus_opinion_summon_hit: "Phẫn Nộ Hạch Tâm"
 nexus_opinion_summon_hit_tt: "$every_empire_opinion_hit$ §R$@nexus_hit_opinion_change$§!"
 nexus_opinion_the_code: "Hòa Giải Hạch Tâm"
 cs_stormfrenzy_chain_title: "Cơn Cuồng Loạn Bão Tố"
 cs_stormfrenzy_chain_desc: "Chúng ta luôn thách thức mọi giới hạn. Được truyền cảm hứng từ những chiến tích của tiền nhân, chúng ta giờ đây có cơ hội định hình nên cơn bão hằng mơ ước."

 cstorms.3220.name: "Tín Điều Của Kẻ Săn Bão"
 cstorms.3220.desc: "Người dân của chúng ta sẽ không bao giờ ngừng tìm kiếm cảm giác mạnh. Mỗi ngày trôi qua chúng ta khám phá những tình cảnh kỳ thú và đối mặt với những thử thách lớn hơn, nhưng [ruler.GetRegnalName] cho rằng chúng ta thậm chí có thể tiến xa hơn nữa:\n\n\"Lõi của một cơn bão vũ trụ là tiềm năng thuần khiết; một lằn ranh thực thụ, gay cấn tột độ. Một lằn ranh đủ sắc bén để chặt đứt hiện trạng và giải phóng cảm giác phấn khích của cả một đời người.\"\n\nThời cơ đã chín muồi để khơi mào một cơn bão với quy mô thực sự sử thi, một tâm điểm của sự náo loạn hân hoan: Cơn Đại Bão. Chỉ còn lại hai chi tiết nhỏ: một nghiên cứu cuối cùng để xác định chính xác cách thức triệu hồi cơn bão hoàn hảo, và phản ứng từ phần còn lại của ngân hà nếu chúng ta chọn làm như vậy.\n\nKhai sinh ra một thứ như thế này chắc chắn sẽ dấy lên không ít sự bất bình."

 PROJECT_SOW_THE_BIG_ONE: "Dụ Kéo Cơn Đại Bão"
 PROJECT_SOW_THE_BIG_ONE_DESC: "Chúng ta có công nghệ, nhưng nếu không có một cơn bão non trẻ ở vùng lân cận, chúng ta sẽ cần điều tra cách gieo mầm một cơn bão mà chúng ta có thể nhào nặn."

 cstorms.3222.name: "Nuôi Dưỡng Bằng Vật Chất Tối"
 cstorms.3222.desc: "Những đặc tính độc nhất vô nhị của Vật Chất Tối biến nó thành thứ hoàn hảo để khuấy động Cơn Đại Bão. Chúng ta sẽ tiêm thứ vật chất khó nắm bắt này vào cấu trúc không gian bao quanh tâm bão và chờ đợi những gợn sóng đầu tiên của cơn bão xuất hiện.\n\nTuy nhiên, điều này đã sớm thu hút sự chú ý không mong muốn: các nước láng giềng đã bắt đầu phản đối. \"Không phải ai cũng hào hứng như chúng ta để cưỡi trên ngọn sóng đặc thù này,\" một trong các [Root.Owner.GetScientistPlural] của chúng ta phàn nàn."
 cstorms.3222.a: "Đã đến lúc bắt đầu."
 cstorms.3222.b: "Chúng ta cần tích lũy thêm một số tài nguyên."

 PROJECT_DARK_SEEDING: "Sự Hấp Dẫn Kỳ Dị"
 PROJECT_DARK_SEEDING_DESC: "Bằng cách tiêm cẩn trọng Vật Chất Tối vào cấu trúc không gian, một cơn bão dễ uốn nắn sẽ được kích hoạt bên trong hệ sao này."

 cstorms.3224.name: "Khởi Đầu Của Cơn Đại Bão"
 cstorms.3224.desc: "Thật khó tin! Những rung động ban đầu của cơn bão sắp tới đã có thể cảm nhận được. Công việc của các [Root.Owner.GetScientistPlural] vẫn đang tiếp diễn, nhưng chúng ta giờ đây đã tiến gần hơn một bước tới việc triệu hồi Cơn Đại Bão.\n\nTuy nhiên, các nước láng giềng lại chẳng mấy vui vẻ. Họ tuyên bố chúng ta đang can thiệp vào những quyền năng mà bản thân không thể nào hiểu thấu, và điều này đã bắt đầu gây ảnh hưởng tới quan hệ ngoại giao của chúng ta."
 cstorms.3224.a: "Chuyện đâu còn có đó."

 cstorms.3225.name: "Nuôi Dưỡng Cơn Đại Bão"
 cstorms.3225.desc: "Dữ liệu rất rõ ràng: bất cứ thứ gì chúng ta đưa vào cơn bão này, một thứ tương tự sẽ nảy sinh từ nó. Nói cách khác, nếu chúng ta tiếp tế cho nó đúng loại tài nguyên, nó sẽ mang các đặc tính - cùng quy mô sử thi - của mọi chủng loại bão.\n\nCư dân ngân hà tiếp tục bày tỏ mối lo ngại, nhưng chuyến phiêu lưu của thế kỷ chỉ đang chờ đợi để được khai sinh. Hãy nuôi dưỡng nó bằng tất cả những gì chúng ta có!"
 cstorms.3225.a: "Nuôi dưỡng cơn bão!"
 cstorms.3225.b: "Chúng ta sẽ cần thêm tài nguyên."

 cstorms.3226.name: "Bữa Tiệc Tối Thượng"
 cstorms.3226.desc: "Chúng ta phải cung cấp cho cơn bão non trẻ đủ mọi nguồn dinh dưỡng phong phú nếu muốn tạo ra một cơn bão mang tầm vóc sử thi. Chiến tích đáng kinh ngạc này đòi hỏi một danh mục tài nguyên cụ thể theo ý muốn của chúng ta."

 PROJECT_EVERY_ITEM_ON_THE_MENU: "Món Độc Lạ Trong Thực Đơn"
 PROJECT_EVERY_ITEM_ON_THE_MENU_DESC: "Chúng ta giờ đây đã biết một cơn bão vũ trụ có thể bị thao túng bằng cách nuôi dưỡng nó với một chế độ dinh dưỡng chuẩn xác. Để nuôi nấng cơn bão này, chúng ta cần một số mẫu vật phẩm nhất định."

 PROJECT_EVERY_ITEM_ON_THE_MENU_REPEAT: "Lặp lại: $cstorms.3225.name$"
 PROJECT_EVERY_ITEM_ON_THE_MENU_REPEAT_DESC: "Việc tạo ra cơn bão hoàn hảo đòi hỏi một lượng mẫu tài nguyên được cân đo đong đếm cẩn thận."

 cstorms.3227.name: "Cú Hích Cuối Cùng"
 cstorms.3227.desc: "Sự phấn khích hiện rõ mồn một. Con đường phía trước ngày càng tỏ tường: tiến xa hơn, nỗ lực hơn, đột phá qua mọi rào cản. Hãy hòa làm một với chính cơn cuồng loạn vũ trụ! Mọi thứ giờ đã sẵn sàng cho Cơn Đại Bão. Chúng ta chỉ cần thêm một cú hích nhỏ.\n\nCác nước láng giềng đã phẫn nộ vượt mức kiềm chế, tuyên bố rằng cái gọi là '$nexus_storm$' của chúng ta sẽ gieo rắc sự tàn phá khắp thiên hà. Nhưng liệu chúng ta có thực sự để những kẻ phá đám này làm chệch hướng một dự án mang quy mô sử thi nhường này? Giờ là lúc đưa ra lựa chọn."
 cstorms.3227.a: "Cơn Đại Bão là định mệnh tối thượng của chúng ta!"
 cstorms.3227.a.tt: "$nexus_storm$ sẽ ập đến trong 40 ngày.\n$nexus_opinion_third_hit_tt$"
 cstorms.3227.b: "Không, chúng ta có phẩm giá hơn thế này!"
 cstorms.3227.b.tt: "$nexus_storm$ bị hủy bỏ.\nThái độ của §Y[global_event_country.GetGalCommunityOrGalImperium]§! sẽ cải thiện sau 40 ngày."

 cstorms.3230.name: "Sự Ra Đời Của Cơn Đại Bão"
 cstorms.3230.desc: "Chúng ta đã ở đây - bên bờ vực của một trải nghiệm hoàn toàn mới mẻ. Thời khắc của đại thảm họa tối thượng đã điểm. Chẳng có gì mà các Kỵ Sĩ Cưỡi Bão của chúng ta chùn bước. Không thử thách nào mà chúng ta từ chối.\n\nHãy để ngân hà chứng kiến!"
 cstorms.3230.a: "Hành động ngay bây giờ."
 has_spawned_nexus_storm_tt: "$TRIGGER_FAIL$Đã xuất hiện một §Y$nexus_storm$§!"

 cstorms.3235.name: "Vĩ Thanh Bão Tố"
 cstorms.3235.desc: "Chúng ta đã học hỏi được rất nhiều. Giờ đây chúng ta hiểu rằng thiên hà không phải là món đồ chơi để nghịch ngợm, mà là một chuyến phiêu lưu cần được trải nghiệm.\n\n[ruler.GetRegnalName] đã đúc kết rất đúng: \"Trong cuộc đời này, cảm giác mạnh chẳng bao giờ thiếu. Chúng ta sẽ không bao giờ ngừng tìm kiếm thử thách tiếp theo, nhưng chúng ta phải làm điều đó với sự tôn trọng. Đây là con đường chúng ta đã chọn. Đây mới chính là bản ngã thực sự của chúng ta.\""
 cstorms.3235.a: "Thư giãn nào!"
 cstorms.3235.a.tt: "$every_empire_opinion_hit$ §G+$@the_code_total_change$§!"

# Storm Fever Challenges

 cs_stormfever_chain_title: "Cơn Sốt Bão"
 cs_stormfever_chain_desc: "Để vươn tới những đỉnh cao mới, để thấu hiểu niềm hân hoan và thử thách mọi giới hạn của bản thân, chúng ta giờ đây dấn thân vào một chuỗi các thử nghiệm. Hãy để niềm vui bắt đầu!"
 challenges_completed: "Thử Thách Đã Hoàn Thành"

 MISSION_CS_STORM_FEVER_CHALLENGE_1: "Đánh Bại Một Hạm Đội Trong Bão"
 MISSION_CS_STORM_FEVER_CHALLENGE_1_DESC: "Sức nóng của trận chiến luôn là nơi thử lửa tôi rèn. Giờ hãy tưởng tượng trải nghiệm điều đó ngay từ bên trong tâm bão cuồng nộ của một cơn bão vũ trụ! Hãy cho ngân hà thấy chúng ta thực sự hoang dã đến nhường nào.\n\nThử thách hiện tại là đánh bại một hạm đội kẻ thù bên trong bão."
 fleets_defeated_in_storm: "Hạm Đội Bị Đánh Bại Trong Bão"

 MISSION_CS_STORM_FEVER_CHALLENGE_2: "Thám Hiểm Rìa Ngân Hà"
 MISSION_CS_STORM_FEVER_CHALLENGE_2_DESC: "Vượt ra ngoài biên cương của chính mình, giữ thăng bằng nơi mép rìa của các vì sao, tìm kiếm những vùng xa xôi nhất của không gian - còn điều gì tiếp thêm sinh lực mãnh liệt hơn thế?\n\nChúng ta cần phái một Tàu Khoa Học tới hệ sao chỉ định - bằng bất cứ giá nào."
 far_edge_explored: "Vùng Rìa Đã Khám Phá"

 MISSION_CS_STORM_FEVER_CHALLENGE_3: "Cưỡi Lên Những Cơn Bão"
 MISSION_CS_STORM_FEVER_CHALLENGE_3_DESC: "Những cá nhân ưu tú nhất luôn khao khát cảm giác phấn khích của bão tố. Hãy để họ lướt sóng và thăng hoa!\n\nThử thách tiếp theo là giúp một Kỵ Sĩ Cưỡi Bão chống chọi qua một cơn bão vũ trụ trong hơn 180 ngày."
 days_storm_rider_spend_in_storm: "Số Ngày Kỵ Sĩ Ở Trong Bão"

 MISSION_CS_STORM_FEVER_CHALLENGE_4: "Điều Tra Thứ Vừa Khai Quật"
 MISSION_CS_STORM_FEVER_CHALLENGE_4_DESC: "Một thiên hà tràn ngập kho báu bị chôn giấu và bí mật cổ xưa - cùng một ngọn gió dữ dội khuấy đảo chúng lên! Hãy lên đường và xem chúng ta có thể tìm thấy điều gì.\n\nHãy thử thách bản thân điều tra một dị thường hoặc di chỉ khảo cổ do bão phơi bày."
 storm_unraveled_event_investigated: "Dị Thường hoặc Di Chỉ Khảo Cổ Đã Điều Tra"

 MISSION_CS_STORM_FEVER_CHALLENGE_5: "Lan Tỏa Niềm Vui"
 MISSION_CS_STORM_FEVER_CHALLENGE_5_DESC: "Tại sao chúng ta phải giữ hết mọi niềm vui cho riêng mình? Khi nói đến phiêu lưu mạo hiểm, sẻ chia bao giờ cũng tốt hơn.\n\nĐể giúp các nước láng giềng cảm thấy được chung vui, thử thách lúc này là khiến một cơn bão vũ trụ chuyển hướng đi vào không phận của họ."
 send_storm_to_other_empire: "Cơn Bão Đã Chuyển Tới Đế Chế Khác"

 MISSION_CS_STORM_FEVER_CHALLENGE_6: "Khuất Phục Trước Giông Tố"
 MISSION_CS_STORM_FEVER_CHALLENGE_6_DESC: "Già nua và tàn lụi không phải phong cách của chúng ta. Cháy hết mình trong ánh hào quang rực rỡ tuyệt vời hơn nhiều!\n\nThử thách tiếp theo là giúp một Kỵ Sĩ Cưỡi Bão trải nghiệm những giây phút cuối đời bên trong một cơn bão vũ trụ."
 rider_died_in_storm: "Kỵ Sĩ Cưỡi Bão Tử Nạn hoặc Mất Tích Trong Bão"

# Challenge completed intro
 challenge_completed_intro: "Những đỉnh cao mới đã đạt được và các giới hạn đã bị phá vỡ! Đúng là thứ kích hoạt cảm xúc bùng nổ. Chúng ta đã hoàn thành thử nghiệm!"

# Challenge 1 completed
 challenge_completed: "Thử Thách Đã Hoàn Thành:"
 cstorms.305.name: "$challenge_completed$ $MISSION_CS_STORM_FEVER_CHALLENGE_1$"
 cstorms.305.desc: "$challenge_completed_intro$\n\nHạm đội đó chưa bao giờ có lấy một cơ hội phản kháng. Kẻ nào dám thách thức chúng ta tiếp theo?"
 cstorms.305.a: "Cảm giác tuyệt vời làm sao!"
# Challenge 2 completed
 cstorms.310.name: "$challenge_completed$ $MISSION_CS_STORM_FEVER_CHALLENGE_2$"
 cstorms.310.desc: "$challenge_completed_intro$\n\nThiên hà mang lại biết bao điều kỳ diệu! Không bao giờ có một giây phút buồn chán, và chẳng có lý do gì để dừng lại bây giờ. Tiến lên thử thách tiếp theo!"
 cstorms.310.a: "Chuẩn xác!"
# Challenge 3 completed
 cstorms.315.name: "$challenge_completed$ $MISSION_CS_STORM_FEVER_CHALLENGE_3$"
 cstorms.315.desc.normal: "$challenge_completed_intro$\n\nKỵ Sĩ Cưỡi Bão của chúng ta báo cáo về bằng những tiếng hò reo hoan hỷ tột cùng. Bão vũ trụ quả thực là một đẳng cấp phấn khích hoàn toàn mới!"
 cstorms.315.desc.gestalt: "$challenge_completed_intro$\n\nChúng ta cảm thấy ngập tràn sự hoan hỷ. Bão vũ trụ mang lại sự phấn khích ở một tầm cao hoàn toàn mới."
 cstorms.315.a: "Không bao giờ tẻ nhạt!"
# Challenge 4 completed
 cstorms.320.name: "$challenge_completed$ $MISSION_CS_STORM_FEVER_CHALLENGE_4$"
 cstorms.320.desc: "$challenge_completed_intro$\n\nĐi sâu vào những bí mật cổ xưa và khai quật kho báu chôn vùi luôn mang lại cảm giác hồi hộp khôn tả. Ai biết được ngoài kia vẫn còn những gì đang chờ được tìm thấy?"
 cstorms.320.a: "Tiềm năng vô tận!"
# Challenge 5 completed
 cstorms.325.name: "$challenge_completed$ $MISSION_CS_STORM_FEVER_CHALLENGE_5$"
 cstorms.325.desc: "$challenge_completed_intro$\n\nCơn bão đó đã quét thẳng qua không phận của họ, gieo rắc cảm giác phấn khích lẫn hỗn loạn ngang nhau! Chúng ta có thể yên tâm khi biết mình đã mang đến cho các nước láng giềng một trải nghiệm khó tin nhường ấy.\n\nCó thể bây giờ họ chưa biết ơn, nhưng rốt cuộc họ cũng sẽ cảm ơn chúng ta thôi."
 cstorms.325.a: "Chúng ta là những người ban tặng!"
# Challenge 6 completed
 cstorms.330.name: "$challenge_completed$ $MISSION_CS_STORM_FEVER_CHALLENGE_6$"
 cstorms.330.desc.normal: "$challenge_completed_intro$\n\nCơn đại bão đã gọi tên họ và họ hân hoan đáp lời. Vinh danh Kỵ Sĩ Cưỡi Bão, bạn đích thực là một huyền thoại! Chúc cho hành trình tới cõi vô định của bạn cũng sẽ sử thi như chính cách bạn ra đi."
 cstorms.330.desc.gestalt: "$challenge_completed_intro$\n\nCơn đại bão đã hiệu triệu một phần của chính chúng ta tham gia vào cuộc tàn sát hoan lạc. Việc mất đi một nút mạng chưa bao giờ mang lại cảm giác ý nghĩa và tràn đầy sinh lực đến thế! Trải nghiệm sử thi này sẽ định hình giống loài chúng ta trong nhiều năm tới."
 cstorms.330.a: "Tiếp tục cưỡi sóng!"
 cstorms.331.desc.normal: "$challenge_completed_intro$\n\nCơn đại bão đã gọi tên họ và họ hân hoan đáp lời. Vinh danh Kỵ Sĩ Cưỡi Bão, bạn đích thực là một huyền thoại!"
 cstorms.331.desc.gestalt: "$challenge_completed_intro$\n\nCơn đại bão đã hiệu triệu một phần của chính chúng ta tham gia vào cuộc tàn sát hoan lạc. Việc suýt mất đi một nút mạng chưa bao giờ mang lại cảm giác ý nghĩa và tràn đầy sinh lực đến thế! Trải nghiệm sử thi này sẽ định hình giống loài chúng ta trong những năm tháng tới."

 electric_storm_desc: "Sự va chạm của các trường điện từ truyền cho cơn bão vũ trụ này một mức điện tích nguy hiểm. Có hại cho lá chắn, nhưng lại có lợi cho năng suất sản xuất trên hành tinh."
 particle_storm_desc: "Những cơn bão này dường như sống động, chuyển động xuyên qua và bên trong cấu trúc ngân hà, chẳng săn lùng cũng chẳng tránh né các phi thuyền không gian. Nguy hiểm và bất ổn, chỉ riêng sự hiện diện của chúng cũng đủ gắn kết một nền văn minh bất chấp các yếu tố cuồng nộ."
 gravity_storm_desc: "Khi các thiên thể khổng lồ va chạm, chấn động sinh ra phát đi những gợn sóng trọng lực khắp thiên hà. Khi các gợn sóng này sụp đổ, một cơn bão trọng lực ra đời. Gây tác động tiêu cực đến hệ thống nhắm bắn của tàu bè, và trọng lực dao động buộc hầu hết mọi người phải ở yên trong nhà."
 magnetic_storm_desc: "Khi các vành đai tiểu hành tinh kim loại di động tương tác với lực hấp dẫn mạnh mẽ, các từ trường được hình thành bên trong. Bão loại này xé toạc vỏ tàu và gây gián đoạn cho hoạt động xây dựng công nghiệp - song chúng cũng hỗ trợ đưa các khoáng sản quý giá từ sâu trong vỏ hành tinh lên bề mặt."
 solar_storm_desc: "Một $solar_storm$ tạo ra sự biến động lấp lánh bên trong cấu trúc không gian. Sự hiện diện của nó khiến các ngôi sao bùng phát những tia lóa chưa từng có. Bức xạ sinh ra có sức tàn phá cực lớn, nhưng lại tăng cường sản lượng của trạm vũ trụ và khiến tàu bè khó lòng ẩn nấp."
 celestial_storm_desc: "Vào bất kỳ khoảnh khắc nào, bụi từ hàng triệu hành tinh cũng đang trôi dạt vô định khắp ngân hà. Đôi khi những hạt bụi này tụ lại với số lượng lớn đến mức tạo thành một cơn bão bụi. Làm nhiễu loạn liên lạc trên toàn hành tinh, nhưng các nguyên tố hóa học mang lại rất hữu ích cho sản xuất tài nguyên. Các vật thể bên trong những cơn bão này coi như không tồn tại đối với các máy quét của chúng ta."
 shroud_storm_desc: "Trong những dịp hiếm hoi, Màn Che có thể thì thầm xuyên qua thế giới vật chất. Những cơn bão hiếm thấy này phơi bày trước các sinh vật có tri giác những ảo ảnh vừa tráng lệ vừa quái dị. Những ai đã từng giao cảm với Màn Che thậm chí có thể tận hưởng một sự cộng hưởng đầy biến ảo."
 nexus_storm_desc: "Khi các vì sao thẳng hàng, ngay cả một cơn bão vũ trụ nhỏ cũng có thể phình to vượt qua mọi giới hạn thông thường. Hiện tượng hiếm gặp này sẽ giải phóng nỗi kinh hoàng mang tầm vóc ngày tận thế. Không thể phát triển thịnh vượng bên trong sự ghê tởm này; lựa chọn duy nhất là sống sót."

 FROM_STORM: "Từ Bão Tố"

# Planetary modifiers
 hyper_ecosystem: "Siêu Hệ Sinh Thái"
 hyper_ecosystem_desc: "Đất của hành tinh này chứa nồng độ nitơ và phốt pho cao bất thường, được tái hấp thụ từ các khoáng chất hình thành tự nhiên trong lớp vỏ. Điều này dẫn đến sự phát triển thực vật cực kỳ nhanh chóng; rất tuyệt cho nông nghiệp, nhưng lại cản trở mọi dự án xây dựng."
 docile_fauna: "Quần Xã Động Vật Ôn Hòa"
 docile_fauna_desc: "Động vật hoang dã và thực vật trên hành tinh này thiếu vắng nhiều loài săn mồi tự nhiên, khiến chúng trở nên ngoan ngoãn khác thường, và do đó rất dễ chịu khi chung sống. Dân số sinh vật bị kiểm soát bởi thiệt hại do bão hơn là quy luật chọn lọc tự nhiên."
 obsidian_lakes: "Hồ Hắc Diện Thạch"
 obsidian_lakes_desc: "Hoạt động kiến tạo đã khiến các hồ magma nguội đi thành những mảng hắc diện thạch khổng lồ, đưa các tài nguyên quý giá đến gần bề mặt hơn nhiều."
 obsidian_lakes_volcanic: "$obsidian_lakes$"
 obsidian_lakes_volcanic_desc: "$obsidian_lakes_desc$"
 crimson_crawlers: "Bọ Bò Đỏ Thẫm"
 crimson_crawlers_tt: "§R$COLONIZATION_IMPOSSIBLE_CRIMSON_CRAWLERS$§!"
 crimson_crawlers_desc: "Bề mặt hành tinh là một tấm thảm đỏ thẫm do sự hiện diện của hàng nghìn tỷ côn trùng nhỏ màu đỏ. Bất chấp số lượng đáng kinh ngạc, chúng dường như vô hại và đã thiết lập được sự cân bằng mong manh trong hệ sinh thái của hành tinh."
 metal_planet: "Hành Tinh Kim Loại"
 metal_planet_desc: "Hành tinh này hoàn toàn được bao phủ bởi các kim loại thô tự nhiên. Nó thiếu các nhu yếu phẩm cơ bản cho sự sống như nước hay bầu khí quyển có thể thở được, nhưng lại chứa rất nhiều tài nguyên có thể sử dụng!"
 terraform_fail_is_metal_planet: "Hành tinh này không thể cải tạo địa khai hóa do lớp vỏ kim loại của nó."
 previously_terraformed_planet: "Hành Tinh Từng Được Địa Khai Hóa"
 previously_terraformed_planet_desc: "Một thế giới đất đá với bầu khí quyển nitơ-oxy và nhiều đại dương. Có bằng chứng cho thấy các đế chế cổ xưa hơn từng đặt chân tới và thuộc địa hóa hành tinh này trước đây, nhưng họ đã biến mất. Điều này có nghĩa là có rất nhiều điều để khám phá, đồng thời biến hành tinh này thành một ứng cử viên thuộc địa được chuẩn bị sẵn!"
 previously_terraformed_planet_tt: "Các nỗ lực địa khai hóa trước đây giúp việc biến hành tinh này thành Thế Giới Gaia dễ dàng hơn nhiều."
 has_patriotic_institute: "$building_adakkaria_patriotic_institute$"
 has_patriotic_institut_desc: "Hành tinh này từng là nền móng của Công Ước adAkkaria. $building_adakkaria_patriotic_institute$ là tất cả những gì còn sót lại của nền văn minh hùng mạnh một thời này."
 has_patriotic_institute_tt: "Có công trình: $building_adakkaria_patriotic_institute$. Thuộc địa hóa hành tinh này để giành quyền sở hữu."
 adakkaria_patriotic_institute_desc.supercharged: "Cơ hội mỗi năm một Cơn Bão được kích hoạt trong hệ sao với cái giá là §Y100§! £pop£ §HDân Cư§!."

#Planet Modifiers
 crimson_crawlers_sashimi_style: "Bọ Bò Đỏ Thẫm: Ăn Sống"
 crimson_crawlers_sashimi_style_desc: "Bề mặt hành tinh nhuộm một sắc đỏ thẫm do hàng nghìn tỷ côn trùng nhỏ màu đỏ tạo nên. Ngay cả khi ăn sống, chúng cũng là một nguồn thực phẩm vô cùng thơm ngon."
 crimson_crawlers_bbq_them: "Bọ Bò Đỏ Thẫm: Nấu Chín"
 crimson_crawlers_bbq_them_desc: "Bề mặt hành tinh nhuộm một sắc đỏ thẫm do hàng nghìn tỷ côn trùng nhỏ màu đỏ tạo nên. Việc nướng và thưởng thức chúng đã trở thành niềm vui của người dân."

 COLONIZATION_IMPOSSIBLE_CRIMSON_CRAWLERS: "§RHành tinh này không thể bị thuộc địa hóa bởi các đế chế Máy Móc hoặc Kẻ Nuốt Đất.§!"

# New planet types modifiers
 collided_planet: "Hành Tinh Va Chạm"
 collided_planet_desc: "Hai hành tinh đã đâm sầm vào nhau, và thay vì hủy diệt lẫn nhau, chúng lại xoắn xuýt hòa nhập làm một. Trong khi sở hữu diện tích bề mặt sử dụng tăng lên, thế giới này cũng đặt ra những thách thức độc nhất vô nhị về cư trú và xây dựng."
 wooden_planet: "Thế Giới Cổ Mộc"
 wooden_planet_desc: "Trải qua hàng ngàn năm, lớp vỏ hành tinh này đã trở thành một tầng rễ cây rậm rạp dày nhiều kilomet, biến nó thành một sinh thể sống khổng lồ."
 wooden_planet_tt: "Nhà ở tốn $w_food$ để xây dựng và duy trì.\nNông trại tốn $w_food$ để xây dựng."

# Eruption Event
 recent_eruption: "Vụ Phun Trào Núi Lửa Gần Đây"
 eruption_report_tooltip: "\nCác báo cáo sẽ được gửi tới trong vòng 30 ngày."
 colony_mod.31.name: "Phun Trào!"
 colony_mod.31.desc: "Các biến cố kiến tạo trên [Root.GetName] đã khiến các mảng Hắc Diện Thạch trên một trong những mảng lục địa khổng lồ bị vỡ vụn. Dung nham tràn ngập bề mặt gây ra hậu quả tàn khốc. Các báo cáo gửi về từ thuộc địa vô cùng nghiêm trọng."
 colony_mod.31.a: "Hãy để chúng ta lắng nghe báo cáo."
 colony_mod.32.name: "Báo Cáo Thiệt Hại Do Phun Trào"
 colony_mod.32.desc: "Đợt phun trào gần đây trên Cánh Đồng Hắc Diện Thạch làm rung chuyển thuộc địa của chúng ta trên [Root.GetName] đã biến thành một ngọn núi lửa đang hoạt động! Bất cứ thứ gì từng tồn tại ở đó giờ đã bị chôn vùi dưới lớp đá nóng chảy."
 colony_mod.33.desc: "Đợt phun trào gần đây trên Cánh Đồng Hắc Diện Thạch làm rung chuyển thuộc địa của chúng ta trên [Root.GetName] kỳ diệu thay lại không gây ra bất kỳ thiệt hại nào. Một bước ngoặt may mắn là nó còn làm vỡ vụn Hắc Diện Thạch giúp việc thu gom trở nên dễ dàng!"
 colony_mod.34.desc: "Đợt phun trào gần đây trên Cánh Đồng Hắc Diện Thạch làm rung chuyển thuộc địa của chúng ta trên [Root.GetName] kỳ diệu thay lại không gây ra bất kỳ thiệt hại nào!"

