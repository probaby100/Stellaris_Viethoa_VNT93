# Magnetized Planetary Core
 pm_magnetized_planetary_core: "Lõi Hành Tinh Siêu Từ Hóa"
 pm_magnetized_planetary_core_desc: "Hoạt động điện từ sâu trong lớp manti giúp việc khai thác từ tính trở nên khả thi, song cũng làm gián đoạn cơ sở hạ tầng kỹ thuật."
 cstorms.1705.name: "$pm_magnetized_planetary_core$"
 cstorms.1705.desc: "Những dư chấn bất thường đang được báo cáo trên [this.GetName] sau cơn §Y$magnetic_storm$§! gần đây. Các trường năng lượng mạnh mẽ của bão đã gia tăng tính biến động từ trường trong lõi nóng chảy của hành tinh, dẫn đến sự cố diện rộng của cơ sở hạ tầng công nghệ.\n\nTuy nhiên, tình thế này cũng mở ra cơ hội khai thác tài nguyên độc nhất vô nhị. Dòng dung nham giàu kim loại bên dưới lớp manti hành tinh giờ đây đã được tích điện từ và có thể thu hoạch nhờ sự hỗ trợ của nam châm khai khoáng."

# Electrified Oceans
 d_electrified_oceans: "Đại Dương Nhiễm Điện"
 d_electrified_oceans_desc: "Một dòng điện vĩnh cửu cuộn trào khắp đại dương bao la của hành tinh."
 GLACIAL_OCEANS: "đại dương dưới băng"
 DEFAULT_OCEANS: "đại dương"
 cstorms.1715.name: "$d_electrified_oceans$"
 cstorms.1715.desc.common: "Một hiện tượng bất thường đã được quan sát thấy trên [this.GetName] sau cơn §Y$electric_storm$§! gần đây. Các [GetOceansState] của hành tinh đã bị tích điện bởi một dòng điện vĩnh cửu hiện đang lưu thông trong khối nước bao la này, gây ra rủi ro chết người cho các sinh vật thủy sinh."
 cstorms.1715.desc.aquatic: "Điều này đe dọa nghiêm trọng đến triển vọng sinh tồn của thuộc địa chúng ta và phải được giải quyết ngay lập tức."
 cstorms.1715.desc.non_aquatic: "Hiện tượng này không gây hại trực tiếp cho chúng ta nhưng đặt ra nhiều thách thức cho sự phát triển trong tương lai của thuộc địa."
 cstorms.1715.a: "Phóng thích dòng điện."
 cstorms.1715.b: "Học cách sống chung với nó."

# Ghostly Apparitions
 d_ghostly_canyon: "Hẻm Núi Ma Quái"
 d_ghostly_canyon_desc: "Những bóng ma thanh thoát được chứng kiến bởi những ai ghé thăm hẻm núi này."
 cstorms.1725.name: "Bóng Ma Xuất Hiện"
 cstorms.1725.desc.common: "Sau cơn §Y$shroud_storm$§! gần đây tại [this.solar_system.GetName], các [owner.GetColonistPlural] báo cáo về việc nhìn thấy những bóng ma thanh thoát không thể giải thích được trong một hẻm núi biệt lập. Những hình bóng màu xanh lam mờ ảo này xuất hiện thoáng qua, không thể hoặc không muốn tương tác với [owner.GetColonistPlural] của chúng ta, lang thang vô định trước khi tan biến."
 cstorms.1725.desc.psionic: "Dù các bóng ma có bản chất tâm linh, chúng ta vẫn chưa thể thiết lập bất kỳ giao tiếp tinh thần nào với các thực thể này. Tuy nhiên, chúng ta nhận thấy sự hiện diện của chúng mang lại sự củng cố thụ động cho năng lực thần giao cách cảm của chính chúng ta."
 cstorms.1725.desc.psionic_robot: "Dù các bóng ma có bản chất tâm linh, chúng ta vẫn chưa thể thiết lập bất kỳ giao tiếp tâm linh nào với các thực thể này. Tuy nhiên, kiểm tra hệ thống đã xác nhận rằng sự hiện diện của chúng mang lại sự củng cố thụ động cho năng lực thấu thị của chúng ta."
 cstorms.1725.desc.spiritualist: "Hiện tượng đáng chú ý này mang lại lời nhắc nhở đáng hoan nghênh về những kỳ quan vô hình của sự tồn tại của chúng ta."
 cstorms.1725.desc.gestalt: "Cho đến nay chưa có báo cáo nào về tổn hại thể xác hay hành vi hung hăng."
 cstorms.1725.desc.default: "Cho đến nay chưa có báo cáo nào về thương tích thể xác hay thiệt hại. Dẫu vậy, hiện tượng kỳ lạ này đang tỏ ra là một sự xao lãng đáng bất an."
 cstorms.1725.a: "Lấp đất đầy hẻm núi. Người chết phải được chôn cất."

# Volcanic Inactivity
 cstorms.1735.name: "Núi Lửa Tắt Lịm"
 cstorms.1735.desc: "Bức xạ tàn dư từ cơn §Y[this.GetAffectedStormType]§! gần đây đã dẫn đến hoạt động địa chất thất thường trên khắp §H[this.GetName]§!.\n\nĐáng chú ý nhất, tác động của cơn bão đã khiến một ngọn núi lửa đang hoạt động tắt lịm hoàn toàn, cô lập nó khỏi điểm nóng địa chất và cắt đứt nguồn cung cấp magma.\n\nNhững biến đổi này mang lại cho chúng ta cơ hội mới để phát triển hành tinh xa hơn nữa, khi magma nguội đi khai mở những vùng đất mới."

# Mountain in the Sky
 d_sky_mountain: "Núi Trên Bầu Trời"
 d_sky_mountain_desc: "Một rặng núi khổng lồ treo lơ lửng giữa không trung loãng của tầng trên khí quyển hành tinh, phơi bày những mỏ quặng mới."
 unlocks_zone_minerals_physics: "$t$Mở Khóa Chuyên Môn Hóa Khu Vực: §Y$zone_minerals_physics$§!"
 cstorms.1745.name: "$d_sky_mountain$"
 cstorms.1745.desc: "Một cơn §Y$gravity_storm$§! dữ dội đã gây ra sự biến đổi phi thường đối với cảnh quan của §H[this.GetName]§!. Những dao động trọng lực mạnh mẽ của cơn bão đã bứt rặng núi lớn nhất hành tinh khỏi thềm kiến tạo, nhấc bổng nó lên lơ lửng trên không trung.\n\nNó vẫn tiếp tục lơ lửng ở tầng khí quyển trên, được giữ trên cao bởi hiệu ứng trọng lực tàn dư của cơn bão. Biến động đáng kinh ngạc này đã làm lộ ra những mỏ quặng trước đây không thể tiếp cận bên trong tầng đá gốc, đồng thời cung cấp cho các [owner.GetResearchers] nhiều điều để phân tích."

# Melting Glaciers
 cstorms.1755.name: "Băng Tan"
 cstorms.1755.desc.common: "Cơn §Y[this.GetAffectedStormType]§! gần đây đã gây ra tác động bất ngờ lên khí hậu của [this.GetName]."
 cstorms.1755.desc.electric: "Điện tích gia tăng trong khí quyển đã dẫn đến sự thay đổi nhiệt độ mạnh mẽ ở vùng cực, $cstorms.1755.desc.common_2$"
 cstorms.1755.desc.particle: "Hiệu ứng ăn mòn từ các hạt của cơn bão đã tác động nặng nề đến các vùng cực, $cstorms.1755.desc.common_2$"
 cstorms.1755.desc.gravity: "Những chuyển dịch trọng lực do cơn bão mang lại đã làm vỡ nhiều tầng băng dưới nước, $cstorms.1755.desc.common_2$"
 cstorms.1755.desc.magnetic: "Các nhiễu động phát sinh trong từ trường hành tinh đã dẫn đến những đợt dịch chuyển địa chấn dữ dội, $cstorms.1755.desc.common_2$"
 cstorms.1755.desc.solar: "Nhiệt lượng cực độ của cơn bão đã làm tăng nhiệt độ khắp hành tinh trong suốt thời gian nó diễn ra, $cstorms.1755.desc.common_2$"
 cstorms.1755.desc.celestial: "Nồng độ bụi thiên thể siêu nóng tập trung dày đặc đã tác động nặng nề lên các vùng cực, $cstorms.1755.desc.common_2$"
 cstorms.1755.desc.common_2: "khiến vùng lãnh nguyên băng giá trước đây không thể tiếp cận nay tan băng.\n\nGiờ đây chúng ta có thể phát triển vùng đất mới lộ ra này."

# Dusty Drink
 cstorms.1761.name: "Tắc Nghẽn Vũ Trụ"
 cstorms.1761.desc.common: "Các [Owner.GetEngineerPlural] của chúng ta trên §H[this.GetName]§! báo cáo rằng cơn §Y$celestial_storm$§! đang gây ra những tác động bất lợi cho hệ thống lọc nước. Khi các hạt lắng đọng vào mạch nước ngầm của hành tinh, hỗn hợp bùn khoáng sinh ra đang làm tắc nghẽn các điểm cơ sở hạ tầng trọng yếu."
 cstorms.1761.desc.default: "Các sự cố thủy canh phát sinh đang ảnh hưởng nặng nề đến nông nghiệp của hành tinh, cũng như dẫn đến tình trạng khan hiếm nước uống an toàn.\n\nVấn đề này có thể để lại hậu quả lâu dài cho nguồn cung cấp nước nếu không được xử lý. May mắn thay, các [owner.GetEngineerPlural] của chúng ta tự tin có thể chế tạo các hệ thống lọc kiên cố hơn để giải quyết khúc mắc."
 cstorms.1761.desc.lithoid: "Trong khi điều tra các tắc nghẽn thủy canh, các [Owner.GetColonistPlural] của chúng ta phát hiện ra rằng hỗn hợp bùn khoáng hóa thực ra vừa thơm ngon vừa giàu dinh dưỡng đối với những sinh thể có sinh lý thạch tộc. Sau khi thực hiện một vài điều chỉnh nhỏ cho hệ thống lọc của thuộc địa, họ đã sản xuất hàng loạt một loại thức uống mới theo mùa để thưởng thức qua mùa bão."
 cstorms.1761.a: "Tiến hành."
 cstorms.1761.b: "Một món quà bất ngờ."

 pm_satured_filtration: "Bộ Lọc Bão Hòa"
 pm_satured_filtration_desc: "Nguồn nước địa phương bị bão hòa bởi bụi vũ trụ thiên thể, gây tắc nghẽn trong mạng lưới thủy canh."
 filtration_insight_modifier: "Hiểu Biết Về Lọc Thủy Canh"

 CLEAR_DUSTY_PIPES_PROJECT: "Thông Ống Nước Bụi"
 CLEAR_DUSTY_PIPES_PROJECT_DESC: "Tác động của một §Y$celestial_storm$§! trên §H[this.GetName]§! đã khiến các hệ thống lọc nước bị tắc nghẽn bởi bùn khoáng không hòa tan. Chúng ta phải tái thiết kế một hệ thống lọc kiên cố hơn để xử lý vấn đề."

 cstorms.1765.name: "Nâng Cấp Bộ Lọc"
 cstorms.1765.desc: "Các [Owner.GetEngineerPlural] đã xử lý triệt để tình trạng tắc nghẽn thủy canh và khan hiếm nước trên §H[this.GetName]§!. Mạng lưới cấp nước của thuộc địa đã được cải tiến và giờ đây có thể lọc bỏ các tạp chất phức tạp như những chất do $celestial_storm$ mang tới.\n\nNhững cải tiến này đối với cơ sở hạ tầng nước có thể được tái sử dụng để đẩy mạnh nỗ lực tưới tiêu trên toàn cõi [Owner.GetName]."

# Flightless Fauna
 cstorms.1771.name: "Chim Muông Không Thể Bay"
 cstorms.1771.desc.common: "Các [Owner.GetScientistPlural] trên [this.GetName] đã quan sát thấy những tác động khắc nghiệt của cơn §Y$gravity_storm$§! lên hệ động vật chim muông địa phương.\n\nNhững dao động trọng lực do bão mang lại đang dẫn đến các điều kiện khí quyển bất thường, khiến nhiều loài chim muông mất đi khả năng bay lượn."
 cstorms.1771.desc.default: "Điều này không chỉ ngăn cản các sinh vật săn mồi như bình thường, mà còn khiến chúng dễ bị các loài săn mồi khác tấn công.\n\nCó mối lo ngại rằng các loài bị ảnh hưởng có thể bị săn bắt đến mức tuyệt chủng nếu chúng ta không can thiệp."
 cstorms.1771.desc.swarm: "Một bữa đại tiệc thực sự đang chờ đón chúng ta."
 cstorms.1771.a: "Con mồi dễ dàng."
 cstorms.1771.b: "Hãy để tự nhiên thuận theo quy luật."
 cstorms.1771.c: "Đưa các sinh vật vào khu bảo tồn."
 cstorms.1771.evopred: "Lưu giữ ADN của chúng trước khi quá muộn."

 d_avian_reserve: "Khu Bảo Tồn Chim"
 d_avian_reserve_desc: "Một khu bảo tồn thiên nhiên hẻo lánh được xây dựng để che chở cho các loài chim dễ bị tổn thương."
 cstorms.1776.name: "Tung Cánh Trở Lại"
 cstorms.1776.desc: "Sau khi cơn §Y$gravity_storm$§! đi qua, các loài động vật tạm thời mất khả năng bay của [this.GetName] đã tung cánh trở lại bầu trời sau khi trú ẩn bên trong khu bảo tồn chim của chúng ta.\n\nTrong khi nhiều sinh vật hiện đã trở lại môi trường sống trước đây, một số lượng đáng kể vẫn ở lại khu bảo tồn, dường như tận hưởng sự thoải mái và che chở mà nơi này mang lại.\n\nĐiều này mở ra cơ hội độc nhất vô nhị để nghiên cứu cận cảnh đời sống hoang dã của loài chim trên hành tinh."
 cstorms.1776.a: "Tin tức tuyệt vời."

################
# Storm Events #
################

# Eye of the Storm
 cstorms.1801.name: "Mắt Bão"
 cstorms.1801.desc: "Máy quét phát hiện những bất thường trong mắt bão [fromfrom.GetName] đang hoành hành tại [from.GetName], cho thấy cấu trúc này đang mang theo một khối vật chất kỳ lạ ở trung tâm. Những chỉ số khác thường này rất đáng để điều tra kỹ hơn, trước khi cơn bão tan đi hoặc rời khỏi hệ sao."
 EYE_OF_THE_STORM_PROJECT: "$cstorms.1801.name$"
 EYE_OF_THE_STORM_PROJECT_DESC: "Các bản quét [fromfrom.GetName] tại [this.GetName] cho thấy nó đang mang một khối vật chất lớn bên trong tâm xoáy. Cảm biến tầm xa chưa thể cung cấp câu trả lời xác thực về hiện tượng bất thường này. Cần một chuyến thám hiểm thực địa tiến vào mắt bão để nâng cao hiểu biết của chúng ta."
 cstorms.1805.name: "Tiến Vào Tâm Xoáy"
 cstorms.1805.desc: "Bằng cách điều hướng tiến vào mắt bão vũ trụ tại [from.GetName], [leader.GetName] đã phát hiện ra nguyên nhân gây ra sự bất thường trong các bản quét. Cơn bão kỳ lạ này đang được tiếp năng lượng bởi một khối lượng lớn [from.star.GetEarnedResources] tập trung tại trung tâm.\n\nTàu khoa học của chúng ta đã thu hoạch những tài nguyên có thể gom góp trước khi bị văng ra ngoài một cách thô bạo. Dữ liệu cảm biến từ cuộc rút lui trong gang tấc này sẽ giúp các kỹ sư của chúng ta cải thiện hiệu suất tàu trong các điều kiện bão khắc nghiệt."
 cstorms.1805.desc.traumatized: "Đáng tiếc thay, thử thách đầy hiểm nguy này đã để lại chấn thương tâm lý kéo dài đối với [leader.GetName]."

