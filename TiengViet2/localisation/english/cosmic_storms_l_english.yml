 storm_hunkered_down_modifier_tt: "Nhân đôi chi phí §Rduy trì§!, nhưng cũng nhân đôi §Ghiệu quả§! của §Y$building_storm_resistant_production$§! và §Y$building_advanced_storm_resistant_production$§!."
