 cstorms.2310.name: "Tiếng Hát Thiên Nga Của Kẻ Bị Nguyền Rủa"
 cstorms.2310.desc.start: "Cuối cùng, Lễ Kỷ Niệm đã hé lộ bí mật cuối cùng trước mắt chúng ta: Giai Đoạn Cuối Cùng.\n\nTrong những hành lang này, những cái xác khô teo của nhân sự adAkkaria nằm rải rác trên sàn nhà, bị xé toạc thành từng mảnh vụn bởi đá vụn, kim loại, nhựa và đủ loại rác rưởi. Một thứ gì đó đã cuồng nộ hoành hành trong các hành lang này, tàn sát bất cứ thứ gì và bất kỳ ai cản đường.\n\nNhưng điều thực sự"
 cstorms.2310.desc.piece.default: "kinh hoàng"
 cstorms.2310.desc.piece.authgen: "thú vị"
 cstorms.2310.desc.end: "vẫn còn đang đợi ở phía trước.\nCác buồng giam chật hẹp giam giữ nửa tá cá thể. Màn hình quan sát mô tả họ là §Gnguồn cung cấp năng lượng cho Vật Triệu Hồi§!, nhưng đây rõ ràng là những công dân vị thành niên của Công Ước, thân hình nhỏ bé của họ bị treo lơ lửng bởi hàng tá ống dẫn và dây cáp. Dung dịch bên trong các buồng giam giữ họ trong trạng thái nửa sống nửa chết, cơ thể được bao bọc bởi một nguồn năng lượng tương đồng với năng lượng bên trong cơn bão dai dẳng của hệ sao adSul.\n\nVài màn hình còn sót lại bỗng sáng lên, mỗi màn hình hiển thị một yêu cầu duy nhất:\n§LHÃY NHỚ VỀ CHÚNG TÔI | HÃY GỌI TÊN CHÚNG TÔI | HÃY GỌI TÊN CHÚNG TÔI.§!\n\nChúng ta đã ghi lại tên của những người trẻ tuổi này. Tuy nhiên, cái tên cuối cùng khiến chúng ta phải sững lại: §SenRida Direen§!, cá nhân từ Hội Nhân Từ Tối Cao từng dùng tâm trí để dập tắt lửa.\n\nGiờ đây, khi đã nắm giữ những cái tên này, chúng ta có thể liên lạc lại với cơn bão vũ trụ một lần nữa."
 cstorms.2310.desc.default: "$cstorms.2310.desc.start$ $cstorms.2310.desc.piece.default$ $cstorms.2310.desc.end$"
 cstorms.2310.desc.authgen: "$cstorms.2310.desc.start$ $cstorms.2310.desc.piece.authgen$ $cstorms.2310.desc.end$"
 cstorms.2310.a: "Chúng ta có tên của các bạn."

# The Storm's Swansong
 cstorms.2320.name: "Danh Sách Khắc Cốt"
 cstorms.2320.desc: "Chúng ta đã sao chép hoàn chỉnh toàn bộ danh sách danh tính của mọi cá nhân từng bị giam cầm và thử nghiệm tại khu phức hợp Lễ Kỷ Niệm. Hàng ngàn cái tên, cùng với cuộc đời và ký ức của họ, giờ đây đã nằm trong tay chúng ta.\n\nCơn bão trên quỹ đạo dường như cảm nhận được điều này. Những luồng bức xạ vũ trụ uốn lượn xung quanh con tàu của chúng ta, như đang nín thở chờ đợi một câu trả lời."
 cstorms.2320.a: "Chúng ta sẽ mang danh sách này tới cho Cơn Bão."
 cstorms.2320.b: "Chuyện gì đã xảy ra với Công Ước adAkkaria?"
 cstorms.2320.c: "Vật Triệu Hồi Bão Táp đang ở đâu?"
 cstorms.2320.d: "Chúng ta có tên của các bạn."
 cstorms.2320.a.resp: "HỌ SẼ KHÔNG NGỪNG ÁP ĐẶT\n\nĐAU ĐỚN VÀ THỊNH NỘ VÀ ĐAU THƯƠNG VÀ SỢ HÃI\n\nCHÚNG LÀ RĂNG CHÚNG LÀ HÀM CHÚNG\nNUỐT CHỬNG NHỔ CHÚNG TA RA MANG THEO\n\nĐAU ĐỚN VÀ THỊNH NỘ VÀ ĐAU THƯƠNG VÀ SỢ HÃI\n\nCHÚNG TA TAN RÃ CHÚNG TA TIÊU BIẾN CHÚNG TA TRỞ THÀNH\n\nĐAU ĐỚN VÀ THỊNH NỘ VÀ ĐAU THƯƠNG VÀ SỢ HÃI"
 cstorms.2320.b.resp: "BUÔNG THẢ VÀ TỰ PHỤ VÀ TÀN NHẪN\nKIÊU NGẠO | ĐỘC ÁC | CỐ CHẤP\nMANG LẠI CÁI CHẾT MANG LẠI ĐAU KHỔ\n\nCHÚNG TA PHẢI PHẢI PHẢI PHẢI PHẢI PHẢI PHẢI PHẢI\nTỒN TẠI | KHÔNG TỒN TẠI | PHI TỒN TẠI\n\nCHÚNG TA\nDU HÀNH TRÊN CÁC BẢN PHÁT SÓNG | LÀM Ô NHIỄM TÍN HIỆU | Ô NHIỄM TÂM TRÍ\nTRẮNG XÓA | XÁM XỊT | TỐI ĐEN | KHUẤT PHỤC TRƯỚC BÓNG TỐI\nPHÂN TÁN KHẮP CÁC VÌ SAO VÀ KHÔNG BAO GIỜ ĐƯỢC NGHE THẤY NỮA"
 cstorms.2320.c.resp: "CHÚNG TA\nLÀ LÁ CHẮN | CHE CHỞ BẠN\n\nCHÚNG TA\nTẠO THÀNH MỘT CHIẾC NÔI | NÂNG NIU NÓ\n\nVÀ ĐUNG ĐƯA NÓ VÀO QUÊN LÃNG | NGỦ ĐI NGỦ ĐI NGỦ ĐI DIỆT VONG\n\n§lBÃO TỐ§! §RKẺ ĐÁNG GHÊ TỞM§!\nVÀ KHÔNG BAO GIỜ TỈNH LẠI NỮA"
 cstorms.2325.desc: "Tàu khoa học của chúng ta quay trở lại rìa của cơn bão vũ trụ khổng lồ đang bao bọc adSul. Tín hiệu liên lạc tâm linh lập tức mở ra, và những tiếng gầm thét quen thuộc lại vang vọng trong các thiết bị thu nhận:\n\nHÃY GỌI TÊN CHÚNG TA\n\nHÃY GỌI TÊN CHÚNG TA"
 cstorms.2325.d: "Được rồi, tên của các bạn là..."
 cstorms.2330.desc: "HÃY GỌI TÊN CHÚNG TA\n\nGIẢI THOÁT CHÚNG TA KHỎI NỖI ĐAU\n\nHÃY | GỌI | TÊN | CHÚNG TA"
 cstorms.2330.a: "Xướng tên các nạn nhân."
 cstorms.2335.desc: "CHÚNG TA NHỚ LẠI RỒI\n\nCHÚNG TA CÓ THỂ SUY NGHĨ! §g(suy nghĩ, suy nghĩ, suy nghĩ)§!\nCó biết bao nhiêu tiếng nói quanh chúng ta! §g(suy nghĩ, nói, ước mong, mơ mộng)§!\nCó biết bao nhiêu cá thể độc nhất §g(bạn, tôi, hắn, họ)§!\n\nCác bạn đã trả lại lý trí cho chúng ta §g(phiêu lưu, giải mã, khám phá)§!\nNhưng việc nắm giữ những cái tên cho phép các bạn kiểm soát chúng ta... §g(không, đừng lại như thế nữa!)§!\nCác bạn muốn chúng ta làm gì? §g(thả chúng ta đi, thả chúng ta đi, thả chúng ta đi)§!"
 cstorms.2335.a: "Đã đến lúc các bạn được tự do."
 cstorms.2335.b: "Hãy quy phục, và giao nộp Vật Triệu Hồi Bão Táp cho chúng ta."
 cstorms.2340.desc: "Tự do.\n\nCác bạn muốn thả chúng ta đi ư? §g(Tự do?)§!\n\nKhông thể nào. §g(Điều đó là bất khả thi.)§!\nCác bạn không thể có ý đó được. §g(Thế còn Vật Triệu Hồi Bão Táp thì sao?)§!"
 cstorms.2340.a: "Chúng ta sẽ phá hủy nó."
 cstorms.2345.desc: "Đau đớn và thịnh nộ và đau thương và sợ hãi. §g( ĐAU ĐỚN | THỊNH NỘ | ĐAU THƯƠNG | SỢ HÃI )§!\n\nĐó là tất cả những gì chúng ta từng có ích.\n\nĐÓ LÀ TẤT CẢ NHỮNG GÌ CHÚNG TA TỪNG CÓ ÍCH ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI\n§gĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG SỢ HÃI ĐAU ĐỚN THỊNH NỘ ĐAU THƯƠNG§!"
 cstorms.2345.a: "Cứ việc gào thét thỏa thích, kẻ tôi tớ vĩnh viễn của chúng ta."
 cstorms.2350.name: "Bão Tố Chẳng Còn"
 cstorms.2350.desc: "Cơn Bão mở ra một khoảng trống bên trong chính nó, phơi bày trước mắt chúng ta §lVật Triệu Hồi Bão Táp§!. Thật kỳ lạ khi một cỗ máy nhỏ bé như vậy lại từng là đối tượng của biết bao dục vọng, xung đột và hy sinh. Sự tồn tại của nó đã khơi mào cho sự sụp đổ của một đế chế từng một thời hùng vĩ.\n\nBằng một chuỗi mệnh lệnh đơn giản, chúng ta đã kích hoạt quy trình tự hủy của Vật Triệu Hồi Bão Táp. Khi vụ nổ tan dần và các mảnh vỡ bay tán loạn khắp hệ sao, Cơn Bão bắt đầu lắng xuống. Cùng với sự an nghỉ của nó, bức màn che kỳ lạ bao phủ thế giới quê hương của Công Ước adAkkaria cũng tan biến hoàn toàn.\n\nCơn ác mộng dài đằng đẵng của họ cuối cùng đã đi đến hồi kết."
 cstorms.2350.a: "Mong rằng tên tuổi của các bạn sẽ mãi mãi được khắc ghi."
 cstorms.2355.name: "Đau Đớn Thịnh Nộ Đau Thương Sợ Hãi"
 cstorms.2355.desc: "Cơn Bão quằn quại và sôi sục trong cơn cuồng nộ bất lực, song nó không thể làm tổn hại đến chúng ta hay §lVật Triệu Hồi Bão Táp§!.\n\nChúng ta ra lệnh cho những tiếng nói bị giam cầm bên trong dọn một lối đi xuyên qua tâm bão xoáy và chiếm đoạt thành tựu vĩ đại nhất của Công Ước làm của riêng mình.\n\nTuy nhiên, quê hương của adAkkaria vẫn mãi mãi không thể tiếp cận; mọi con đường dẫn tới $building_adakkaria_patriotic_institute$ giờ đây đã vĩnh viễn khép lại. Nhưng những lời gầm rú của Cơn Bão vẫn còn đọng mãi trong tâm trí chúng ta.\n\nĐau đớn, thịnh nộ, đau thương và sợ hãi.\nNgân hà rồi đây cũng sẽ nếm trải những điều đó."
 cstorms.2355.a: "Sự hy sinh là điều tất yếu."

