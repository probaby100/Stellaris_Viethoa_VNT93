 cstorms.2000.name: "Chuẩn Bị Bão"
 cstorms.2000.desc_common_1: "Chúng ta hiện đã vào vị trí trong hệ sao §H[target.solar_system.GetName]§! và sẵn sàng bắt đầu các khâu chuẩn bị cần thiết để tạo ra một §Y$default_storm$§!.\n\nBằng cách tạm thời nạp siêu năng lượng cho [target.GetName], chúng ta có thể tạo ra các điều kiện lý tưởng để gieo mầm phản ứng khí tượng thiên văn mong muốn."
 cstorms.2000.desc_tech: "\nBằng cách áp dụng các phương pháp thao túng năng lượng tiên tiến, chúng ta có thể làm quá bão hòa [target.GetName] bằng nguyên liệu thô để tạo thành một cơn bão có cấu trúc phức tạp hơn."
 cstorms.2000.desc_common_2: "\nĐây sẽ là một nỗ lực tốn nhiều thời gian, nhưng kết quả cuối cùng sẽ là một thành tựu vĩ đại của [owner.GetName]. Bản thân ngôi sao sẽ hoàn toàn nguyên vẹn sau khi chiến dịch hoàn tất."
 cstorms.2000.a: "Nạp Siêu Năng Lượng Cho Ngôi Sao."
 cstorms.2000.a.tt: "$approach_situation_initiate_storm_supercharge_tt$"
 cstorms.2000.b: "Làm Quá Bão Hòa Ngôi Sao."
