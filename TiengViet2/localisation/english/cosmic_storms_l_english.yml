 gov_storm_chasers: "Hội Đồng Trưởng Lão"
 gov_storm_chasers_desc: "Các thành viên của hội đồng thống trị xuất chúng này luôn vượt trội trong các kỳ tích thể chất thách thức tử thần. Bằng cách chinh phục đỉnh núi cao nhất hay cưỡi ngọn sóng lớn nhất, họ cống hiến cuộc đời cho việc không ngừng theo đuổi những trải nghiệm nguyên bản. Điều này đã mang lại cho họ sự tin tưởng của cộng đồng và quyền dẫn dắt con đường tiến về phía trước.\n\nCác thành viên hội đồng được gọi là Trưởng Lão bất kể tuổi tác, bởi vì các chiến tích của họ được coi là huyền thoại. Tên tuổi của họ sẽ được ghi nhớ mãi mãi."
 RT_ELDER_SPEAKER: "Phát Ngôn Viên Trưởng Lão"
 RT_ELDER_SPEAKER_FEMALE: "$RT_ELDER_SPEAKER$"

# Ascension Perk
 ap_weather_control: "Kiểm Soát Thời Tiết Thiên Hà"
 ap_weather_control_desc: "Những tiến bộ mới nhất của chúng ta trong ngành khí tượng học vũ trụ cho phép chúng ta tạo ra Bão Vũ Trụ theo ý muốn. Với công nghệ phù hợp, chúng ta thậm chí có thể chọn loại bão muốn tạo ra."
 requires_technology_tech_advanced_storm_manipulation: "$TRIGGER_FAIL$Yêu cầu công nghệ £physics£ §Y$tech_advanced_storm_manipulation$§!."

