 resolution_cosmic_storms_preservation_initiative: "Sắc Lệnh Bảo Tồn Bão"
 resolution_cosmic_storms_preservation_initiative_desc: "Kiểm soát các cơn bão bằng bất kỳ hình thức nào đều là một sự xúc phạm đối với tự nhiên."
 resolution_cosmic_storms_preservation_initiative_tooltip: "$emergency_fund_contribution$ §R15%§! \n\n$storm_tech_cost$ §R+80%§!\n\n$breach_galactic_law_intro$$TABBED_NEW_LINE$- §YCông Nghệ Đẩy Lùi Bão§!$TABBED_NEW_LINE$- §YCông Nghệ Thu Hút Bão§!$TABBED_NEW_LINE$- §YSắc Lệnh $edict_storm_repel_field$§!$TABBED_NEW_LINE$- §YSắc Lệnh $edict_storm_attraction_field$§!"

