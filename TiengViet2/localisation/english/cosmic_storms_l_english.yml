# Colony Decisions
 decision_hunker_down: "Ẩn Náu"
 decision_hunker_down_desc: "Lo ngại điều tồi tệ nhất, cư dân trên hành tinh này sẽ thực hiện bất kỳ và mọi biện pháp phòng ngừa trước tác động của bão vũ trụ."
 decision_stop_hunker_down: "Chấm Dứt $decision_hunker_down$"
 decision_stop_hunker_down_desc: "Một khi mối nguy hiểm từ cơn bão vũ trụ đã qua đi, chúng ta có thể nới lỏng các biện pháp phòng ngừa. Nhưng liệu mọi thứ có thực sự trở lại 'bình thường'?"
 decision_cultivated_worldscaping: "Kiến Tạo Cảnh Quan Canh Tác"
 decision_cultivated_worldscaping_desc: "Hãy điêu khắc thế giới này thành một bản tụng ca của sự đối xứng hoàn hảo. Việc quan sát hình học thuần khiết của cảnh quan sẽ mang lại sự thanh thản."
 decision_cultivated_worldscaping_natural_blockers_fail_tt: "§RCần phải dọn sạch toàn bộ Chướng Ngại Vật £blocker£§!"

# Civics
 civic_astrometeorology: "Khí Tượng Học Vũ Trụ"
 civic_astrometeorology_desc: "Với lòng tôn kính sâu sắc đối với các thế lực tự nhiên, giống loài này nỗ lực hết mình để khám phá hoạt động bên trong của các hiện tượng môi trường. Khi tiến vào các vì sao, họ mang theo niềm đam mê đặc biệt với khí tượng học vũ trụ. Trọng tâm trong tham vọng của họ là những sự kiện thiên văn kỳ thú và tiềm ẩn sức hủy diệt khủng khiếp nhất, chính là các cơn bão vũ trụ.\n"
 civic_astrometeorology_effect_tooltip: "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_astrometeorology_observation_center']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_astrometeorology_observation_center$§! $TABBED_NEW_LINE$- Sản Lượng §Y$sm_black_hole_observatory$§!: §G+50%§!"

 civic_astrometeorology_hive: "Mô Phỏng Khí Hậu"
 civic_astrometeorology_hive_desc: "Khi tập thể vươn tới các vì sao, ý thức của họ bị mê hoặc bởi cảnh tượng của các hiện tượng khí tượng vũ trụ. Những drone này mở rộng ngôi nhà của mình vì một mục đích cao cả: nghiên cứu các tác động môi trường và tìm thấy sự kỳ diệu ngay trong chính những cơn bão vũ trụ."
 civic_astrometeorology_hive_effect_tooltip: "$civic_astrometeorology_effect_tooltip$"

 civic_astrometeorology_machine: "Mô Phỏng Khí Hậu"
 civic_astrometeorology_machine_desc: "Hiểu được cách các lực lượng tự nhiên có thể gây ra những tác động sâu sắc lên một đế chế máy móc, tập thể này nỗ lực hết mình để nghiên cứu chúng. Các mô hình của họ ghi chép tỉ mỉ từng sự kiện thiên văn kỳ thú đến mức gần như thiêng liêng. Trọng tâm của họ là sự kiện thiên văn kỳ ảo và tiềm ẩn sự tàn phá khủng khiếp nhất, chính là các cơn bão vũ trụ."
