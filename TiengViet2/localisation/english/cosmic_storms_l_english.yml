###########################################
# Anomalies #
###########################################

 STORMS_ANOM_ANTS: "Sao Chổi Hữu Cơ"
 STORMS_ANOM_ANTS_DESC: "Một cơn bão vũ trụ đã để lại một sao chổi có cấu tạo bất thường. Nó dường như được tạo thành từ vật chất hữu cơ. Các [solar_system.Owner.GetScientistPlural] của chúng ta rất muốn điều tra."
 cstorms.5020.name: "Tiểu Hành Tinh Kiến"
 cstorms.5020.desc: "Sao chổi được hé lộ là một chiếc tổ khổng lồ chứa đầy những loài côn trùng nhỏ bé. Đuôi của sao chổi không phải là băng bốc hơi, mà là khí thải từ các quá trình hóa học diễn ra sâu bên trong tổ.\n\nLớp ngoài của tổ được cấu tạo từ xác các cá thể đã chết, bảo vệ những cá thể sống bên trong khỏi điều kiện khắc nghiệt của không gian. Chúng ta cũng đã phát hiện một số loại nấm sống trong và xung quanh tổ. Có một mối quan hệ cộng sinh phức tạp ở đây, với nấm sống dựa vào khí thải và côn trùng ăn nấm."
 cstorms.5020.a: "Thu hoạch chiếc tổ."
 cstorms.5020.b: "Chỉ quan sát, không chạm vào."

 STORMS_ANOM_STAT: "Thành Phần Khó Hiểu"
 STORMS_ANOM_STAT_DESC: "Vật thể đang quay trên quỹ đạo này bị bỏ lại sau khi một cơn bão vũ trụ quét qua. Nó trông giống như một trạm không gian nhưng các bản quét về thành phần cấu trúc của nó lại cho ra kết quả cực kỳ khó hiểu. Chúng tôi khuyến nghị nên điều tra."
 cstorms.5030.name: "Khải Huyền Tĩnh Tại"
 cstorms.5030.desc: "[Root.Owner.GetScientistPluralCapital] báo cáo rằng phần lớn trạm không gian này được dựng lên từ những vật dụng văn phòng phẩm thông thường, hầu như không thể giữ nó liền lạc. Càng đi sâu vào cấu trúc, vật liệu chuyển đổi từ hợp kim kim loại sang nhựa và các chất khác.\n\nBên trong trái tim của công trình, chúng ta tìm thấy một cỗ máy, vẫn đang trong quá trình phân rã vật chất hữu cơ một cách hiệu quả và tạo hình nó thành chính những món đồ bắt gặp từ đầu đến giờ.\n\nSau khi chạy một mô hình mô phỏng DNA, các [Root.Owner.GetScientistPlural] của chúng ta buộc phải kết luận rằng vật liệu hữu cơ này nhiều khả năng đến từ những cư dân trước đây của tiền đồn này."
 cstorms.5030.evopred: "Xem thử chúng ta có thể thu được điều gì ở đây."

 STORMS_ANOM_BRAIN: "Tiêu Tán Hiện Sinh"
 STORMS_ANOM_BRAIN_DESC: "Kể từ khi một cơn $shroud_storm$ hoành hành qua hệ sao này, chúng ta đã nhận được những tín hiệu kỳ lạ. Tuy nhiên, ngay khi các [Root.Owner.GetScientistPlural] của chúng ta cố gắng trả lời chuỗi cuộc gọi hỗn loạn này, nó lại tiêu tán biến mất. Họ khuyên nên gửi một tàu nghiên cứu đến."
 cstorms.5025.name: "Cơn Bão Não Bộ"
 cstorms.5025.desc: "Chúng ta không bao giờ có thể lường trước được khám phá của mình: những bộ não. Những cơ quan xử lý trung tâm hữu cơ, mềm nhũn từ đủ loại giống loài. Hàng trăm bộ não, tất cả đều được liên kết với nhau và lơ lửng bên trong một khoang chứa giống như quả bóng bay lớn. Nó dường như bị bỏ hoang, trôi dạt trong độ sâu không gian sau khi cơn $shroud_storm$ gần đây tan biến.\n\nKhoang chứa có một mảng cảm biến đáng kinh ngạc gắn liền với các bộ não và quả bóng, đồng thời cũng có một mô-đun liên lạc, có khả năng gọi tàu và truyền thông tin, giống như những gì nó đã làm với chúng ta.\n\nDường như chính những bộ não đã chủ động liên lạc với chúng ta, giải thích cho chuỗi thông điệp hỗn loạn trước đó. Các [Root.Owner.GetScientistPlural] của chúng ta cho rằng công trình này được thiết kế để đo lường phản ứng hữu cơ trước một $shroud_storm$. Trước những tàn dư tâm linh bất ổn bên trong những tâm trí trôi nổi này, việc cố gắng kết nối giao diện với chúng sẽ chỉ dẫn đến thảm họa."

#Terrestrial Telescopes
 terrestial_telescope_category: "Kính Thiên Văn Mặt Đất"
 terrestial_telescope_category_desc: "Bản quét do tàu [fleet.GetName] thực hiện cho thấy sự hiện diện của một trạm không gian vô chủ trong Hệ sao [From.GetStarName].\n\nCó vẻ như nó đã bị một cơn bão vũ trụ đi qua lắng đọng tại đây. Dấu hiệu sự sống trả về âm tính, và không có tín hiệu năng lượng nào thuộc bất kỳ loại nào. Hai kính thiên văn đồ sộ nhô ra từ hai phía đối diện của trạm. Các thiết bị quang học này có vẻ tiên tiến và quá lớn so với kích thước của trạm. Công nghệ và kiến trúc này vẫn chưa quen thuộc với chúng ta.\n\nChúng ta có thể thử tái kích hoạt các kính thiên văn, vì điều này có thể mang lại một số hiểu biết sâu sắc thú vị."
 cstorms.1605.name: "Kính Thiên Văn Địa Cầu"
 cstorms.1605.desc: "Việc đổ bộ lên trạm và kích hoạt các kính viễn vọng đòi hỏi một chút khéo léo từ các [Root.Owner.GetScientistPlural] của chúng ta, nhưng không có gì là họ không thể xử lý. Tuy nhiên, góc thiên hà mà các công cụ hướng vào lại chẳng hiển thị điều gì đáng chú ý.\n\nMột số cổ vật thú vị đã được tìm thấy rải rác xung quanh trạm: những hình ảnh chi tiết được ghi lại từ kính viễn vọng, được bày biện ngay ngắn trong các khung trang trí. Từng bức ảnh chụp duy nhất đều tập trung vào các cơn bão vũ trụ, với nhiều bản in của mỗi cơn bão từng quét qua hệ sao này. Người vận hành kính viễn vọng đã sử dụng các góc khác nhau, mức thu phóng và thậm chí cả các góc nghiêng nghệ thuật để thể hiện các cơn bão dưới ánh sáng rực rỡ nhất.\n\nSau khi điều tra sâu hơn, tác phẩm nghệ thuật là phát hiện thú vị duy nhất trên trạm bị bỏ hoang này. Chúng ta sẽ lưu trữ chúng để nhiều thế hệ tương lai có thể chiêm ngưỡng những hình ảnh về sức mạnh và vẻ đẹp hiếm có này."

 STORMS_ANOM_POLYCHROMATIC: "Ngôi Sao Đa Sắc"
 STORMS_ANOM_POLYCHROMATIC_DESC: "Sự quét qua của một cơn bão vũ trụ qua hệ sao [from.solar_system.GetName] đã làm thay đổi diện mạo thị giác của ngôi sao trong hệ. Trong dư âm của cơn bão, lớp vành nhật hoa của ngôi sao hiện ra như một vòng xoáy của những màu sắc biến ảo không ngừng, phóng ra những tai lửa đa sắc về mọi hướng. Hiện tượng này cần được phân tích thêm."
 cstorms.5035.name: "$STORMS_ANOM_POLYCHROMATIC$"
 cstorms.5035.desc: "[root.leader.GetName] báo cáo những thay đổi đầy mê hoặc trong phản ứng nhiệt hạch của [From.GetStarName] kể từ khi [from.GetAffectedStormType] quét qua.\n\nDường như cơn bão đã gây ra những phản ứng hạt nhân bất ngờ bên trong lõi ngôi sao, dẫn đến việc giải phóng đều đặn [from.GetEarnedResources] từ các vùng đối lưu của nó.\n\nNhững phản ứng phức tạp và đặc thù này đang tạo ra hiện tượng lóa đa sắc bất thường mà chúng ta quan sát được. Dù sao đi nữa, nó sẽ tiếp tục là nguồn tài nguyên xứng đáng để nghiên cứu kỹ lưỡng trong một thời gian."
 cstorms.5035.a: "Nghiên cứu các quy trình mới này."
 cstorms.5035.b: "Thu hoạch các tài nguyên mới này."

 STORMS_ANOM_TRIPLETS: "Bộ Ba Tiểu Hành Tinh"
 STORMS_ANOM_TRIPLETS_DESC: "Một cơn bão vũ trụ đi qua đã để lại ba tiểu hành tinh mới trong hệ sao [from.solar_system.GetName]. Những thiên thể này dễ bị thay đổi hướng đi không thể giải thích được, khiến việc dự đoán quỹ đạo của chúng là bất khả thi. Cần nghiên cứu thêm."
 cstorms.5040.name: "$STORMS_ANOM_TRIPLETS$"
 cstorms.5040.desc: "[root.leader.GetName] phát hiện ra rằng các tiểu hành tinh lắng đọng trong hệ sao [from.solar_system.GetName] sở hữu từ trường cực kỳ bất ổn, khiến chúng va chạm nảy bật loạn xạ vào từ quyển hiện có của hệ sao.\n\n[root.leader.GetName] đã ổn định chúng bằng cách lắp thêm bộ bù từ tính cho mỗi tiểu hành tinh, điều hòa quỹ đạo của chúng và do đó giúp chúng có thể phục vụ cho các nỗ lực khai thác tài nguyên."

 STORMS_ANOM_TRAVELLERS: "Tín Hiệu Cứu Nạn Hậu Bão"
 STORMS_ANOM_TRAVELLERS_DESC: "Trong dư âm của §H[from.GetAffectedStormType]§!, một tín hiệu cứu nạn chưa xác định đã được phát hiện trong hệ sao §H[from.solar_system.GetName]§!."
 cstorms.5050.name: "Những Kẻ Lữ Hành Lạc Lối"
 cstorms.5050.desc: "Chúng ta đã xác định được nguồn gốc tín hiệu cứu nạn trong hệ sao §H[from.solar_system.GetName]§! là một tàu thương mại bị hư hỏng nặng nhưng vẫn đang hoạt động.\n\nNhững người trên tàu tuyên bố họ đã bị §H[from.GetAffectedStormType]§! hất văng một khoảng cách rất xa khỏi lộ trình. Cơn bão cũng đã làm cháy động cơ của họ, khiến con tàu và hàng hóa bị mắc kẹt trong không gian của chúng ta.\n\nHọ sẵn sàng chia sẻ một phần hàng hóa nếu chúng ta có thể giúp đỡ."
 cstorms.5050.a: "Đồng ý giúp đỡ họ."
 cstorms.5050.evopred: "Chúng ta sẽ giúp đỡ để đổi lấy một số mẫu DNA."
 cstorms.5050.b: "Chúc họ may mắn."
 cstorms.5050.c.genocide: "Đoạt lấy mạng sống và hàng hóa của họ."
 cstorms.5050.d.devouring_swarm: "Một bữa ăn miễn phí."

 STORMS_COSMIC_SLUDGE: "Bùn Nhão Vũ Trụ"
 STORMS_COSMIC_SLUDGE_DESC: "Các cảm biến khối lượng theo dõi §H[from.solar_system.GetName]§! đang hiển thị các chỉ số thất thường trong dư âm của §H[from.GetAffectedStormType]§!.\n\nChẩn đoán hệ thống cho thấy không có dấu hiệu lỗi kỹ thuật nào với thiết bị. Những chỉ số này cần được điều tra thêm."
 cstorms.5060.name: "$STORMS_COSMIC_SLUDGE$"
 cstorms.5060.desc: "Các chỉ số cảm biến thất thường trong hệ sao §H[from.solar_system.GetName]§! bắt nguồn từ một khối mảnh vỡ đặc biệt bị bỏ lại sau §H[from.GetAffectedStormType]§!.\n\nThực thể trôi dạt này là một khối bùn vũ trụ vô định hình, được rèn luyện dưới áp suất cực lớn của cơn bão. Vô số nguyên tố cấu thành của nó đã tạo thành một hợp chất phản ứng độc nhất vô nhị.\n\nNghiên cứu tập trung vào thành phần hóa học của nó có thể mang lại những hiểu biết quý giá về khí tượng học vũ trụ đối với các điều kiện đã sản sinh ra nó."
 cstorms.5060.a: "Nghiên cứu thành phần của nó."
 cstorms.5060.b: "Phân rã nó ra."

 STORMS_SHATTERED_SATTELITE: "Vệ Tinh Vỡ Vụn"
 STORMS_SHATTERED_SATTELITE_DESC: "Trong dư âm của §H[from.GetAffectedStormType]§!, một vật thể không xác định đã được phát hiện trong hệ sao §H[from.solar_system.GetName]§!. Phân tích sâu hơn về mảnh vỡ này có thể cung cấp những hiểu biết quý giá."
 cstorms.5070.name: "$STORMS_SHATTERED_SATTELITE$"
 cstorms.5070.desc: "Vật thể trong hệ sao §H[from.solar_system.GetName]§! là xác của một vệ tinh cổ đại được trang bị các dàn cảm biến khí tượng học vũ trụ phức tạp. Chúng ta tin rằng nó đã bị cuốn đi một khoảng cách rất xa qua thiên hà sau cơn §H[from.GetAffectedStormType]§!.\n\nHiện đã hư hỏng không thể sửa chữa, cơ sở dữ liệu trung tâm của nó chứa đựng một kho thông tin rộng lớn mà chúng ta có thể tái sử dụng cho nhu cầu của mình.\n\nPhần còn lại của vệ tinh chỉ có thể thu hồi làm phế liệu."

 STORMS_EVISCERATED_FAUNA: "Dị Vật Không Gian"
 STORMS_EVISCERATED_FAUNA_DESC: "Cảm biến trong hệ sao §H[from.solar_system.GetName]§! đã phát hiện một vật thể lạ được đưa vào hệ sao bởi cơn §H[from.GetAffectedStormType]§! gần đây.\n\nCần kiểm tra kỹ hơn để xác minh bản chất của dị thường này."
 cstorms.5080.name: "Mảnh Vỡ Hữu Cơ"
 cstorms.5080.desc.common: "Vật thể lạ trong hệ sao §H[from.solar_system.GetName]§! được phát hiện là một khối tàn dư hữu cơ lớn bắt nguồn từ một số loại động vật không gian. Với bất kỳ đặc điểm nhận dạng nào bị bão vũ trụ xé nát, không thể phân loại chính xác mảnh vụn sinh học này."
 cstorms.5080.desc.swarm: "May mắn thay, hầu hết nó vẫn còn ăn được."
 cstorms.5080.desc.default: "[leader.GetName] tự tin rằng một phân tích pháp y chi tiết hơn về tàn dư của sinh vật này sẽ tiết lộ thêm thông tin về bản chất nguồn gốc của nó và tác động của một cơn §Y[from.GetAffectedStormType]§! lên các sinh vật du hành không gian tương tự."
 cstorms.5080.a: "Chúng ta đang đói."
 cstorms.5080.b: "Tiến hành giải phẫu tại chỗ."
 cstorms.5080.c: "Tiêu hủy tàn tích."

 FORENSIC_DISSECTION_PROJECT: "Giải Phẫu Pháp Y"
 FORENSIC_DISSECTION_PROJECT_DESC: "Chúng ta đã chạm trán tàn tích của một sinh vật chưa xác định trong hệ sao §H[solar_system.GetName]§! bị một cơn bão vũ trụ kéo lê qua thiên hà. Việc mổ khám nghiệm tử thi sẽ tiết lộ thêm thông tin."
 cstorms.5085.name: "$FORENSIC_DISSECTION_PROJECT$"
 cstorms.5085.desc: "Sau khi mổ xẻ cẩn thận, loài gốc của khối nội tạng này vẫn còn là một bí ẩn. Thiệt hại khủng khiếp ở tâm bão đã tước đi mọi đặc điểm nhận dạng hoặc dấu hiệu di truyền của nó.\n\nTuy nhiên, trong quá trình nghiên cứu này, chúng ta đã có được cái nhìn sâu sắc về thành phần của §YBão Vũ Trụ§! và tác động tàn khốc của chúng đối với vật chất sinh học ngoài hành tinh."
 cstorms.5085.evopred: "Một bữa ăn hấp dẫn."

 STORMS_DISPLACED_TIYANKI: "Tiyanki Lạc Bầy"
 STORMS_DISPLACED_TIYANKI_DESC: "Trong dư âm của $default_storm$, cảm biến của chúng ta đã phát hiện ba tín hiệu Tiyanki trong hệ sao §H[solar_system.GetName]§!."
 cstorms.5090.name: "$STORMS_DISPLACED_TIYANKI$"
 cstorms.5090.desc.common: "Ba tín hiệu Tiyanki trong hệ sao §H[solar_system.GetName]§! đã được xác định là một nhóm con non bị lưu lạc và suy dinh dưỡng.\n\nCơn §Y$default_storm$§! đã chia cắt những con non này khỏi đàn lớn của chúng, khiến chúng phải tự sinh tự diệt.\n\nChúng khó có thể sống sót lâu ngoài không gian mở. Cảm biến của chúng ta cho thấy chúng đang cố gắng kêu gọi đàn của mình nhưng không thành công."
 cstorms.5090.desc.swarm: "Chúng ta có thể khuếch đại tiếng kêu cứu của chúng và dùng chúng làm mồi nhử để dụ một bữa tiệc lớn hơn."
 cstorms.5090.desc.default: "Hệ thống liên lạc của chúng ta có thể được sử dụng để khuếch đại tiếng kêu cứu của chúng và thu hút đàn của chúng vào hệ sao."
 cstorms.5090.a.default: "Khuếch đại tín hiệu của chúng."
 cstorms.5090.a.swarm: "Gài mồi vào bẫy."
 cstorms.5090.b.default: "Tự nhiên thật tàn nhẫn."
 cstorms.5090.b.machine: "Bắt đầu giao thức tiêu diệt."
 cstorms.5090.b.swarm: "Một bữa ăn miễn phí."
 cstorms.5090.c: "Cho chúng một ngôi nhà mới."
 cstorms.5090.c.tt: "Thêm 3 §Y$NAME_Tiyanki_Hatchling$§! có độ hiếm ngẫu nhiên vào ['concept_vivarium'] của bạn"

 REUNITE_POD_PROJECT: "Đoàn Tụ Đàn Cá"
 REUNITE_POD_PROJECT_DESC: "Ba con non Tiyanki đang bị lạc và lang thang trong hệ sao [this.solar_system.GetName], bị tách khỏi bầy bởi một cơn bão vũ trụ. Chúng ta có thể giúp chúng đoàn tụ với bầy bằng cách khuếch đại tiếng kêu của chúng để thu hút những cá thể còn lại của bầy đến hệ sao."

 cstorms.5095.name: "Tiyanki Đoàn Tụ"
 cstorms.5095.desc.common: "Một con Tiyanki cái và một con đực đều đã xuất hiện trong hệ sao §H[solar_system.GetName]§! sau khi nghe thấy tiếng kêu được khuếch đại của ba con non bị lạc.\n\nCác Tiyanki non đã tái hòa nhập vào đàn của chúng, và trông đã vui vẻ và khỏe mạnh hơn nhiều.\n\nCon Tiyanki cái đã để lại một khối mảnh vụn lớn gần tàu nghiên cứu của chúng ta, dường như là một sự cảm kích nào đó đối với sự trợ giúp của chúng ta. Chúng ta rất ngạc nhiên khi thấy món quà kỳ lạ này chứa một số vật liệu có thể sử dụng được."
 cstorms.5095.desc.swarm: "Dĩ nhiên, những con thú lớn hơn này mới là phần thưởng thực sự; đã sẵn sàng cho cuộc tàn sát."

###########################################
# Event Chains #
###########################################

### Collided Planet Event Chain
 collided_planets_category: "Hành Tinh Va Chạm"
 collided_planets_category_desc: "Hàng kỷ trước, hai hành tinh đã va chạm vào nhau. Sau sự diệt vong của chúng, một thế giới độc nhất vô nhị đã ra đời."

 cs_collided_planet_chain_title: "Hành Tinh Va Chạm"
 cs_collided_planet_chain_desc: "Thảm họa đang đe dọa phá vỡ sự cân bằng mong manh của hành tinh độc đáo này."

 cstorms.1200.name: "Chuyện Kể Hai Hành Tinh"
 cstorms.1200.desc: "Kể từ thời điểm chúng ta phát hiện ra [From.Planet.GetName], sự tồn tại đơn thuần của nó đã là một nguồn cảm hứng đầy mê hoặc.\n\nKhông phải sự va chạm giữa hai thiên thể là điều bất thường, vì thiên hà là một nơi rộng lớn và hỗn loạn. Tuy nhiên, trong tất cả các trường hợp được biết đến về một vụ va chạm như vậy, một hoặc cả hai thiên thể liên quan đều bị phá hủy.\n\nVụ va chạm hình thành nên [From.Planet.GetName] đã diễn ra hàng triệu năm trước, vậy mà hai thế giới này vẫn duy trì một trạng thái cân bằng kỳ lạ, và thậm chí đã hình thành một bầu khí quyển duy trì sự sống trong quá trình đó."
 cstorms.1205.name: "Thế Cân Bằng Bấp Bênh"
 cstorms.1205.desc: "Tình hình trên cái gọi là \"hành tinh va chạm\" hóa ra bấp bênh hơn nhiều so với dự tính. Một loạt các trận động đất gần đây đã mở lại những vết sẹo cũ xung quanh khu vực va chạm, khiến một lượng lớn magma phun trào từ lòng đất. Các quần xã sinh vật hành tinh khác nhau đã bắt đầu phải hứng chịu nhiệt độ toàn cầu tăng cao và tro bụi núi lửa che phủ bầu trời.\n\nTệ hơn nữa, nếu hai hành tinh liên kết này không được ổn định trong vòng 50 năm tới, các số liệu của chúng ta dự đoán hoạt động kiến tạo sẽ tiếp tục leo thang, cuối cùng gây ra sự tan rã hoàn toàn của [From.Planet.GetName]!"
 cstorms.1210.name: "Biến Hình Khai Phóng"
 cstorms.1210.desc: "Các nhà địa chất hàng đầu của chúng ta đã cùng nhau đưa ra hai kế hoạch khả thi để cứu [From.Planet.GetName] khỏi bị khuất phục trước thảm họa kiến tạo.\n\nKế hoạch đầu tiên là ổn định vụ va chạm. Mặc dù sẽ mất nhiều thế kỷ để chữa lành vết thương núi lửa xung quanh vùng va chạm, nhưng thông qua việc khoan mở lớp vỏ hành tinh một cách cẩn trọng, chúng ta có thể giảm bớt áp lực lên lớp vỏ hành tinh, ngăn chặn tình trạng bất ổn kiến tạo tiếp theo. Các phụ phẩm núi lửa còn lại sẽ được sử dụng để địa khai hóa hành tinh thành một quần xã sinh vật ổn định.\n\nKế hoạch thứ hai tham vọng hơn nhiều. Thay vì giải tỏa áp lực trên lớp vỏ hành tinh, năng lượng và vật chất do núi lửa phun trào có thể được điều chỉnh vào một quy trình địa khai hóa tùy biến.\n\nCách tiếp cận này cho phép chúng ta điêu khắc vô số quần xã sinh vật có khả năng duy trì mọi loại hình sự sống, biến thế giới này thành một thiên đường. Tuy nhiên, có một nguy cơ đáng kể rằng quy trình này sẽ thất bại - và thậm chí có thể dẫn đến sự hủy diệt hoàn toàn và triệt để của thiên thể độc đáo này."
 cstorms.1210.a: "Chúng ta sẽ ổn định vụ va chạm."
 cstorms.1210.b: "Chúng ta sẽ tận dụng lượng phát thải."
 cstorms.1210.c: "Không làm gì ngoài việc quan sát."

 collided_planet_collapsing: "Hành Tinh Tan Rã"
 collided_planet_collapsing_desc: "Hoạt động kiến tạo mang tính hủy diệt sẽ xé toạc Hành Tinh Va Chạm - phá hủy cả hai thế giới trong quá trình đó."
 collided_planet_collapsing_tt: "Thế giới này sẽ sụp đổ sau khi 50 năm trôi qua."

 project_cosmic_storms_collidedplanet_stabilize: "Ổn Định Vụ Va Chạm"
 project_cosmic_storms_collidedplanet_stabilize_DESC: "Việc ổn định hành tinh va chạm là cần thiết nếu chúng ta muốn ngăn thế giới này sụp đổ."
 project_cosmic_storms_collidedplanet_harmonize: "Hài Hòa Hóa Vụ Va Chạm"
 project_cosmic_storms_collidedplanet_harmonize_DESC: "Thực hiện kế hoạch đầy tham vọng của chúng ta nhằm hài hòa các quần xã sinh vật của hành tinh va chạm. Chúng ta sẽ tạo ra một thế giới cho tất cả, hoặc hủy diệt nó trong quá trình này."

 cstorms.1220.name: "Duy Trì Va Chạm Thành Công"
 cstorms.1220.desc: "Những nỗ lực của chúng ta nhằm ổn định thế giới va chạm đã được đền đáp! Những cơn chấn động từng đe dọa sự tồn tại của [From.Planet.GetName] đã bị dập tắt và các phụ phẩm núi lửa đang giảm nhanh chóng khi chúng ta nói chuyện, đưa thế giới trở lại trạng thái cân bằng mong manh vốn có.\n\nMột câu hỏi còn lại cho bước đẩy địa khai hóa cuối cùng: [From.Planet.GetName] sẽ trở thành loại hành tinh nào?"
 cstorms.1220.a: "Duy trì hành tinh dạng lục địa."
 cstorms.1220.b: "Địa khai hóa thành thế giới thảo nguyên hoang mạc."
 cstorms.1220.c: "Tạo ra một thế giới núi cao."
 cstorms.1225.name: "Một Thế Giới Cho Mọi Người"
 cstorms.1225.desc.stabalize: "Phi thường! Chúng ta từng nghĩ nỗ lực của mình chỉ dừng lại ở việc ổn định [collided_planets.GetName], nhưng nó đã biến thành một điều gì đó vĩ đại hơn nhiều!\n\n$cstorms.1225.desc.def$"
 cstorms.1225.desc.def: "Hãy chiêm ngưỡng, một thiên đường, một hành tinh có khả năng duy trì gần như mọi dạng sống có thể tưởng tượng được.\n\nCó thể cứu một thế giới diệt vong và biến nó thành một nơi đầy cảm hứng như thế này - liệu đã từng có thành tựu nào vĩ đại hơn thế? May mắn chắc chắn đang mỉm cười với chúng ta."
 cstorms.1230.name: "Tái Thiết Tu Bổ"
 cstorms.1230.desc: "Mặc dù may mắn bản thân thế giới đã được cứu, nhưng nỗ lực của chúng ta nhằm địa khai hóa hành tinh va chạm thành một thiên đường đã thất bại.\n\nCác nỗ lực tùy biến quần xã sinh vật của chúng ta đã bị cản trở bởi hoạt động kiến tạo dữ dội của hành tinh, dù cho giai đoạn bất ổn tồi tệ nhất dường như đã qua. Hoạt động núi lửa đã trở lại mức được chứng kiến lần đầu trước đợt biến động gần đây, và mặc dù vị trí va chạm vẫn còn hoạt động, nhưng nó khó có thể leo thang trong tương lai gần.\n\nĐiều tồi tệ nhất dường như đã qua. Thách thức của chúng ta bây giờ là tái thiết thế giới này."
 cstorms.1235.name: "Mái Nhà Tan Nát"
 cstorms.1235.desc: "Nỗ lực cứu vãn hành tinh va chạm khỏi cảnh diệt vong sắp xảy ra đã thất bại thảm hại. Mặc dù các nhà khoa học của chúng ta đã thực hiện mọi biện pháp phòng ngừa có thể, các mô hình của họ chưa bao giờ có thể tính đến mọi tình huống bất ngờ.\n\nKhi những mảnh tàn tích của các thế giới này trôi dạt ngày càng xa vào hư không, thiên hà thương tiếc sự mất mát của hiện tượng độc nhất vô nhị này."
 cstorms.1240.name: "Va Chạm Và Sụp Đổ"
 cstorms.1240.desc: "Sự sụp đổ của hành tinh va chạm tuân theo các dự đoán mốc thời gian của chúng ta đến từng số thập phân. Nơi từng làm phong phú thiên hà bằng một hiện tượng độc đáo, giờ đây chẳng còn lại gì ngoài những tảng đá."
 collided_planets_destroyed_tt: "Hành tinh [collided_planets.GetName] bị phá hủy."

### Crimson crawlers Event Chain
 cs_crimson_crawlers_chain_desc: "Bọ Bò Đỏ Thẫm"
 cs_crimson_crawlers_chain_title: "Chúng ta đã tìm thấy một hành tinh bị bao phủ bởi hàng nghìn tỷ côn trùng màu đỏ. Một bệnh dịch, hay một cơ hội?"
 crimson_crawlers_category: "Thảm Đỏ Bao Phủ"
 crimson_crawlers_category_desc: "Một hành tinh đỏ tươi đã được khảo sát trong hệ sao [From.GetStarName]. Độ rực rỡ của màu sắc thật đáng chú ý. Chúng ta nên điều tra."
 cstorms.1255.name: "Bọ Bò Đỏ Thẫm"
 cstorms.1255.desc: "Từ đằng xa, [From.GetName] tỏa sáng như một viên ngọc đỏ quý giá. Đất sét hoặc các loại đất khác ngậm kim loại cứng thường là lời giải thích thông thường cho một dị thường địa lý như vậy, nhưng sự thật kỳ dị hơn nhiều.\n\nBọ. Hàng nghìn tỷ, trên hàng nghìn tỷ con bọ. Chúng tràn ngập trên bề mặt của [From.GetName] thành một tấm thảm gần như không đứt đoạn của sự sống nhiều chân.\n\nNhanh chóng được gọi là 'bọ bò đỏ thẫm', những sinh vật không xương sống này sở hữu một chu kỳ sinh sản hiếu động đáng kể. Mặc dù không gây hại cho môi trường bản địa của chúng, [From.GetName] không phù hợp cho việc thuộc địa hóa khi những sinh vật này chạy lăng xăng khắp nơi.\n\nMột phương pháp xử lý lũ côn trùng khá khác lạ đã được đề xuất. Các bản quét ban đầu cho thấy chúng có thể ăn được, vì vậy có lẽ chúng ta đã tìm thấy một nguồn thực phẩm mới? Chúng tôi khuyên ít nhất nên điều tra cơ hội này."
 project_cosmic_storms_crimson_crawlers: "Món Ăn Để Suy Ngẫm"
 project_cosmic_storms_crimson_crawlers_DESC: "[From.Planet.GetName] bị bao phủ hoàn toàn bởi những loài côn trùng màu đỏ hiền hòa. Hành tinh này có thể sinh sống được nếu lũ bọ được giải quyết. Đồng thời, chúng dường như là một nguồn thực phẩm tốt. Có thể có một hướng đi phía trước ở đây."
 cstorms.1260.name: "Ẩm Thực Độc Lạ"
 cstorms.1260.desc: "Ý tưởng tiêu thụ lũ bọ bò đỏ thẫm lúc đầu có vẻ vô lý, nhưng khi một mẫu vật được mang lên tàu, nó đã trở nên ngon miệng hơn nhiều.\n\nLũ côn trùng là một sinh vật kỳ diệu, sở hữu một hệ thần kinh cực kỳ tiên tiến mà không cần đến cơ quan xử lý trung tâm. Quan trọng hơn, phần thịt nhợt nhạt của chúng mềm và ẩm một cách đáng ngạc nhiên, và ngay cả khi ăn sống, lớp xương ngoài màu đỏ tươi vẫn được đánh giá là vừa giòn vừa thú vị.\n\nCâu hỏi vẫn là liệu lũ bọ sẽ phục vụ tốt hơn làm tài liệu nghiên cứu hay làm nguồn thực phẩm ngon lành. Nấu chín chúng có thể mang lại nhiều hương vị và niềm vui hơn, nhưng ăn sống ngay khi bắt được sẽ nhanh hơn và dễ dàng hơn, đặc biệt nếu kết hợp với loại gia vị thích hợp."
 cstorms.1260.a: "Nghiên cứu lũ bọ bò."
 cstorms.1260.b: "Ăn sống chúng!"
 cstorms.1260.c: "Nấu chín chúng lên!"

### Stormbound Event Chain
 cs_stormbound_chain_title: "Bị Giữ Trong Bão"
 cs_stormbound_chain_desc: "Một con tàu đáng ngại đã xuất hiện trên cảm biến - nhưng chỉ bên trong các cơn bão vũ trụ. Điều gì có thể đang diễn ra ở đây?"
 letters_of_the_manifold: "Những Lá Thư Từ Khoảng Giữa Đa Tạp"
 stormbound_event_ship_object: "$cs_stormbound_chain_title$"
 cstorms.1310.name: "Tàu Mắc Kẹt Xuất Hiện"
 cstorms.1310.desc: "Chúng ta đang nhận được những báo cáo kỳ lạ từ hệ sao [This.GetName]. Rõ ràng, cơn bão vũ trụ gần đây nhất hoành hành trong khu vực đó đã để lộ ra một con tàu không rõ nguồn gốc. Không mang theo tín hiệu gọi, nó bằng cách nào đó đã lướt qua cơn bão như thể hoàn toàn không bị ảnh hưởng bởi sự hung bạo xung quanh.\n\nNó không phản hồi các cuộc gọi, và ngay khi cơn bão tan biến, con tàu cũng biến mất theo. Điều này có thể bị gạt đi như một lỗi giả tạo của thiết bị, nhưng bằng chứng trực quan đã tự nói lên tất cả.\n\nĐây có thể là màn phô diễn của công nghệ tiên tiến đến khó tin, hay có điều gì đáng ngại hơn đang diễn ra? Chúng tôi chắc chắn sẽ báo cáo lại bất kỳ sự xuất hiện nào của con tàu bí ẩn này."
 cstorms.1313.name: "Tàu Mắc Kẹt Trở Lại"
 cstorms.1313.desc: "Một trong các trạm nghiên cứu tại [This.GetName] đã gửi cho chúng ta một báo cáo giật mình: Trong cơn bão vũ trụ vừa qua, một con tàu kỳ lạ gần như đã va chạm với tiền đồn. Báo cáo trực quan cho thấy đó chính là con tàu đáng ngại từng được báo cáo trước đây.\n\nTheo trạm không gian, thân tàu được chế tạo từ một hỗn hợp kỳ lạ gồm các hợp chất hữu cơ, khoáng chất canxi và hợp kim kim loại.\n\nKhông có sự sống hữu cơ nào được phát hiện, khiến chúng ta suy đoán rằng con tàu này hoặc là tự động hóa, hoặc bằng cách nào đó đã mất kiểm soát trở nên bất hảo.\n\nTuy nhiên, điều khó hiểu nhất vẫn còn ở phía trước: các phần lớn của hệ thống đẩy của nó rõ ràng đã bị mảnh vỡ không gian làm vỡ vụn. Con tàu này đáng lẽ phải bất động trong không gian.\n\nNếu chúng ta chỉ định một tàu khoa học để theo dõi cơn bão vũ trụ tiếp theo, họ có thể tìm hiểu thêm về con tàu bí ẩn này."
 cstorms.1313.a: "Chúng ta không có thời gian cho những điều vô nghĩa như vậy."
 cstorms.1316.name: "Lời Thì Thầm Trong Bão Táp"
 cstorms.1316.desc: "Từ đằng xa, tàu [stormbound_science.GetName] đã chứng kiến con tàu đáng ngại xuất hiện giữa các tầng bão. Khi nó trôi qua, chúng ta phát hiện những chỉ số cuồng loạn phát ra từ tấm thảm vũ trụ.\n\nĐiều này cuối cùng đã cung cấp câu trả lời cho lý do tại sao con tàu này không thể được quan sát bởi các cảm biến của chúng ta: biểu hiện vật lý của nó đã bị kéo dài vượt ra ngoài đa tạp không gian, như thể nó vừa bước vào lại vừa chưa bước vào một lỗ sâu. Nhiều khả năng là do nguồn gốc siêu chiều của các cơn bão vũ trụ mà con tàu đã tìm cách quay trở lại không gian của chúng ta.\n\nBiết được điều này, chúng ta sẽ có thể phát hiện lần xuất hiện tiếp theo, và có lẽ kéo con tàu này trở lại thực tại của chúng ta."
 cstorms.1317.name: "Phát Hiện Tàu Mắc Kẹt"
 cstorms.1317.desc: "Con tàu đáng ngại đã được nhìn thấy trong §Y[this.GetName]§!."
 cstorms.1320.name: "Đường Về Quê Hương"
 cstorms.1320.desc: "Nó kìa! Tự định vị trước mũi tàu [Root.Fleet.GetName], con tàu đáng ngại đã gọi chúng ta. Một thực thể cơ khí đeo mặt nạ lộng lẫy xuất hiện trên màn hình. Tự giới thiệu mình là B'Tiin, câu chuyện của cô ấy thật hấp dẫn.\n\nCô từng là một sĩ quan nổi tiếng, một hình mẫu thực sự của một tổ chức được gọi là Công Ước của Những Kẻ Ban Ơn. Khi đang đi tuần tra, cô và phi hành đoàn của mình bị cuốn vào một cơn bão vũ trụ, và trong một nỗ lực liều mạng để sinh tồn, cô đã đưa ra quyết định nạp quá tải 'Động Cơ Đột Phá' của tàu. Công nghệ thử nghiệm này chưa từng được thử nghiệm trước đây, và con tàu cùng phi hành đoàn đã bị mắc kẹt bên trong trường siêu chiều của cơn bão.\n\nCâu chuyện kết thúc, một chiếc thùng nhỏ được phóng ra từ con tàu đổ nát. Bên trong là một tập hợp các tài liệu. \"Hãy mang những thứ này về nhà,\" B'Tiin yêu cầu, sau đó buổi truyền tin kết thúc, và con tàu biến mất vào đa tạp không gian.\n\nCác tài liệu được viết bằng chữ viết xa lạ, và sẽ mất một thời gian để giải mã."
 cstorms.1320.a: "Bắt đầu việc dịch thuật."
 cstorms.1321.name: "Những Lá Thư Từ Đa Tạp"
 cstorms.1321.desc: "Nội dung của chiếc thùng kỳ lạ đã được giải mã. Một tài liệu chứa sơ đồ thiết kế của cái gọi là Động Cơ Đột Phá của con tàu. Dù vẫn vượt xa công nghệ của chúng ta, nhưng việc nghiên cứu kỹ lưỡng các nguyên lý đằng sau cấu tạo của nó đã cải thiện sự hiểu biết của chúng ta về du hành siêu không gian.\n\nCó lẽ ít mang lại lợi ích thực tế hơn, nhưng xúc động hơn nhiều, là bản dịch của những lá thư cá nhân. Mỗi lá thư đều gửi gắm đến một người thân yêu, kể về sự trìu mến, hy vọng và niềm hối tiếc.\n\nDường như ý định của B'Tiin là cho phi hành đoàn của cô ấy một cơ hội cuối cùng để liên lạc với thế giới bên ngoài. Thật không may, chúng ta không có cách nào biết được nơi cần gửi những lá thư này. Phổ biến chúng cho chính người dân của chúng ta ít nhất có thể bảo tồn di sản kỳ lạ của họ. Ngoài ra, việc tiêu hủy chúng có thể là một quyết định khôn ngoan. Kiến thức về những con tàu kỳ lạ và những lá thư ma quái có thể gây bất an."
 cstorms.1321.a: "Lưu trữ các bức thư cho hậu thế."
 cstorms.1321.b: "Vứt bỏ những bức thư."

 project_cosmic_storms_stormbound: "Linh Hồn Của Cơn Bão"
 project_cosmic_storms_stormbound_DESC: "Chúng ta đã phát hiện ra con tàu đáng ngại sẽ xuất hiện bên trong cơn bão này.\n\nHãy gửi một tàu khoa học đến để dụ nó ra và đánh chặn ngay lập tức!"

### But They're Cute Event Chain
 cs_but_they_are_cute_chain_title: "Nhưng Chúng Đáng Yêu Lắm!"
 cs_but_they_are_cute_chain_desc: "Sau cuộc khảo sát [From.Planet.GetName], một sinh vật kỳ lạ đã được phát hiện. Chúng ta sẽ làm gì với nó?"
 but_they_are_cute_category: "Nhưng Chúng Đáng Yêu Lắm!"
 but_they_are_cute_category_desc: "Sau cuộc khảo sát [From.Planet.GetName], một sinh vật kỳ lạ đã được phát hiện. Dù mới chỉ ở giữa chúng ta trong một thời gian ngắn, nó đã khơi dậy một mong muốn sâu sắc là được nuôi nấng và bảo vệ nó. Khuyến nghị nên nghiên cứu thêm."
 cstorms.1500.name: "Nhưng Chúng Đáng Yêu Lắm!"
 cstorms.1500.desc: "Kể từ thời điểm sinh vật này được phát hiện, tác động của nó là không thể phủ nhận, khơi dậy tình yêu thương và sự tận tụy trong chúng ta gần như ngay tức khắc. Bốn con mắt lồi của nó thể hiện sự ngây thơ và mời gọi bất cứ ai vuốt ve bộ lông mềm mại như mây. Nó dường như đặc biệt gắn bó với [Root.GetLeaderName], dành phần lớn thời gian trên đùi của [Leader.GetHisHer] tận hưởng tình cảm của [Leader.GetHisHer], không hề biểu hiện bất kỳ dấu hiệu hung hăng hay nguy hiểm nào. Cứ như thể nó được thiết kế hoàn hảo để trở nên vô hại nhất có thể.\n\nTuy nhiên, một số người hoài nghi đã chỉ ra rằng sẽ thật vô trách nhiệm nếu giữ một dạng sống chưa từng được khám phá trước đây trên tàu mà không có sự chấp thuận trước. [Root.GetLeaderName] cam đoan rằng nó chắc chắn có lẽ an toàn, nhưng đã đồng ý yêu cầu một cuộc điều tra chính thức."
 cstorms.1500.a: "Tìm hiểu xem nó là cái gì."
 cstorms.1500.b: "Từ chối yêu cầu. Hãy xử lý nó."
 cstorms.1500.evopred: "Từ chối yêu cầu. Hãy ăn nó."
 project_cosmic_storms_but_they_are_cute: "Kỳ Quan Sinh Học"
 project_cosmic_storms_but_they_are_cute_DESC: "Một loài động vật vô cùng hấp dẫn và cực kỳ đáng yêu đã được tìm thấy trên một trong các tàu nghiên cứu của chúng ta. Cần phải điều tra các đặc tính sinh học của sinh vật này trước khi chúng ta quyết định giữ lại hay không."
 cstorms.1505.name: "Kỳ Quan Sinh Học"
 cstorms.1505.desc: "Con vật sáu chân ngoan ngoãn không cần phải dùng thuốc an thần hay thậm chí bị ép buộc để được chọc thăm dò và quét phân tích. Nó có vẻ kỳ lạ là rất nghe lời. Phi hành đoàn đặt biệt danh cho nó là Gurr, theo tiếng gừ gừ nhẹ nhàng mà nó phát ra khi được vuốt ve.\n\nChúng ta kết luận rằng Gurr là một loài ăn tạp, và bộ lông của nó bao gồm các sợi gốc keratin quen thuộc và rất mềm mại. Nhưng điều kỳ diệu và bí ẩn thực sự lại diễn ra bên trong sinh vật đáng yêu này: nó đạt được sự tái tạo toàn bộ tế bào trong vòng một tháng. Điều này bao gồm cả hệ thần kinh của nó, nghĩa là nó có thể mọc lại các bộ phận cơ thể đầy đủ chức năng chỉ trong vài ngày.\n\nDường như một cấu trúc sinh học tinh vi như vậy khó có thể là sản phẩm của quá trình tiến hóa tự nhiên. Chúng ta chưa từng thấy điều gì tương tự trước đây, và không thể chắc chắn về tính khí của nó. Dù bề ngoài có vẻ ngoan ngoãn, nó có thể quay sang tấn công chúng ta bất cứ lúc nào. Dẫu vậy, kể từ khi nó xuất hiện, [Root.GetLeaderName] dường như có nhiều động lực làm việc hơn bao giờ hết.\n\nChúng ta sẽ làm gì với Gurr? Chúng ta có thể giữ nó lại không?"
 cstorms.1505.a: "Miễn là bạn dọn dẹp sau khi nó đi vệ sinh."
 cstorms.1505.b: "Loại bỏ nó đi."
 cstorms.1510.name: "Gurr Hỗ Trợ Tinh Thần"
 cstorms.1510.desc: "Sinh vật đáng yêu này đã được phép ở lại trên tàu khoa học và từ đó đã thích nghi rất tốt. Nó làm dịu [Root.GetLeaderName], thắp sáng tâm trạng bất cứ nơi nào nó rảo bước, và tinh thần của phi hành đoàn đang ở mức cao nhất mọi thời đại!\n\nHy vọng rằng kỳ quan đáng kinh ngạc này của \"tự nhiên\" sẽ tiếp tục là một người bạn dễ thương, ngoan ngoãn của tất cả chúng ta. Từ bây giờ cho đến mãi mãi, nó sẽ là của chúng ta, và nó sẽ mang tên Gurr."
 cstorms.1510.a: "Tuyệt vời!"
 cstorms.1515.name: "Sự Ra Đi Của Gurr"
 cstorms.1515.desc: "Với cơ thể khác thường và rõ ràng là đã qua kỹ thuật biến đổi gen, sinh vật này không thể ở lại trên tàu khoa học. Rủi ro nó ảnh hưởng xấu đến phi hành đoàn, hoặc một chủ nhân uất ức xuất hiện để đòi lại nó là quá lớn. Việc đó đã được thực hiện nhanh chóng và nhân đạo. Trong chốc lát, tiếng \"gừ gừ\" êm dịu của nó đã im bặt mãi mãi.\n\nDù có thể hiểu được, quyết định này đã gây ra phản ứng dữ dội về mặt cảm xúc từ [Root.GetLeaderName] và phi hành đoàn. Sẽ mất một thời gian để vượt qua nỗi mất mát của sinh vật kỳ dị đáng yêu này của tạo hóa."
 cstorms.1515.a: "Không có lựa chọn nào khác."
 cstorms.1515.evopred: "Hãy lưu lại mẫu DNA."
 cstorms.1520.name: "Sự Ra Đi Của Gurr?"
 cstorms.1520.desc: "Việc vô hiệu hóa sinh vật đáng yêu này được cho là đã kết thúc mọi chuyện, nhưng những đặc tính tái sinh phi thường của nó dường như còn đi xa hơn những gì chúng ta có thể đoán.\n\nKhông lâu sau cái chết của nó, hai bản sao giống hệt của sinh vật này đã được sinh ra từ mô dường như vô hồn của nó. Ngay cả sau quyết định chấm dứt sự sống của cá thể mẹ, các dạng sống mới sinh ra không hề có biểu hiện hung hăng nào.\n\nChúng ta sẽ dừng lại ở đây, thay vì mạo hiểm tạo ra một đội quân Gurr. [Root.GetLeaderName] và phi hành đoàn đã bày tỏ sự vui mừng khi được phép giữ lại cặp đôi này."
 cstorms.1520.a: "Rút ra được một bài học."

### The Imitator Event Chain
 cstorms.1550.name: "Kẻ Bắt Chước"
 cstorms.1550.desc: "Khoang thoát hiểm được phát hiện tại [From.Planet.GetName] đã bị phó mặc cho cơn bão. Mặc dù chữ ký dữ liệu mà nó sử dụng trông giống như của chúng ta, nhưng khoang này chắc chắn là của người ngoài hành tinh. Chúng ta đã thận trọng phản hồi yêu cầu liên lạc, và được đáp lại bằng sự hân hoan tột cùng từ cư dân bên trong khoang.\n\n[event_target:the_imitator.GetHeSheCap] giải thích rằng [event_target:the_imitator.GetHeShe] đã bị cơn bão kéo lê đi một thời gian và đang tìm kiếm sự cứu hộ, khi hệ thống duy trì sự sống trên tàu của [event_target:the_imitator.GetHerHis] sắp sửa hỏng hóc hoàn toàn.\n\nKhi được yêu cầu xác định danh tính, người lạ mặt này lại tuyên bố một cách kỳ quặc rằng mình là một thành viên trong phi hành đoàn của chúng ta. Lời nói dối này hiển nhiên một cách vụng về, bởi vì tất cả mọi người trên tàu của chúng ta đều đã được điểm danh đầy đủ."
 cstorms.1550.a: "Đủ trò rồi. Hãy phá hủy chiếc khoang."
 cstorms.1550.b: "Đưa chiếc khoang lên tàu."
 cstorms.1555.name: "Kẻ Bắt Chước"
 cstorms.1555.desc: "Chúng ta đã đưa khoang thoát hiểm lên tàu. Màn kịch kết thúc ngay khi niêm phong của khoang mở ra, sau đó sinh vật ngoài hành tinh bên trong lập tức đưa ra lời cầu xin tuyệt vọng.\n\nTrong một đợt kiểm tra định kỳ các khoang thoát hiểm trên tàu mẹ của [event_target:the_imitator.GetHerHis], [event_target:the_imitator.GetHeShe] đã bị mắc kẹt bên trong và bị phóng ra ngoài không gian. Đáng buồn thay, không ai trên tàu nhận ra [event_target:the_imitator.GetHeShe] đã mất tích.\n\nBị mắc kẹt trong nhiều tháng, [event_target:the_imitator.GetHeShe] đã sử dụng chút ít công nghệ mà [event_target:the_imitator.GetHeShe] có thể tìm thấy trên khoang của [event_target:the_imitator.GetHerHis] để bắt chước tín hiệu năng lượng của các con tàu đi ngang qua như một loại mồi nhử. Tuy nhiên, ngay cả điều này cũng không thu hút được sự giúp đỡ. Tệ nhất là một cơn bão vũ trụ đã cuốn lấy chiếc khoang, kéo nó đi xa nhiều năm ánh sáng khỏi hệ sao quê hương. Bị đẩy đến bờ vực cùng quẫn bởi nỗi cô đơn và sợ hãi, [event_target:the_imitator.GetHeShe] đã lập mưu giả làm một thành viên phi hành đoàn mất tích của bất kỳ con tàu nào tình cờ đi ngang qua. Người cư trú trong khoang đã xin lỗi vì sự lừa dối, nhưng vô cùng vui mừng vì còn sống."
 cstorms.1555.a: "Sự tháo vát khôn ngoan như vậy có thể sẽ hữu ích."
 cstorms.1555.b: "Cung cấp phương tiện di chuyển đến hành tinh có cư dân gần nhất."
 cstorms.1555.c: "Bỏ mặc họ lại. Lấy chiếc khoang."
 the_imitator_category_desc: "Một khoang thoát hiểm đơn độc đã được phát hiện trong cuộc khảo sát gần đây. Kỳ lạ thay, chiếc khoang đã gọi chúng ta bằng cách sử dụng chữ ký dữ liệu khớp với chữ ký của chính chúng ta. Chiếc khoang dường như đã bị dịch chuyển bởi một cơn bão vũ trụ gần đây đi qua hệ sao. Khuyến nghị nên điều tra."

# The Imitator Leader
 the_imitator_category: "Kẻ Bắt Chước"
 the_imitator_catch_phrase: "Tôi rất vui khi được ở đây!"
 the_imitator_leader_desc: "Bị thất lạc trong không gian sâu sau một cuộc tháo chạy khỏi bão vũ trụ, [Root.GetName] đã sống sót nhờ sự tháo vát kỳ lạ và một lời nói dối nhỏ vô hại."

