 cstorms.2000.c: "Hủy bỏ dự án."

 cstorms.2010.name: "Hiệu Chỉnh Bão"
 cstorms.2010.desc_irradiate_only: "Các công tác chuẩn bị cho $default_storm$ trong hệ sao §H[target.solar_system.GetName]§! đã bước vào giai đoạn then chốt. Những hành động tiếp theo đòi hỏi sự tập trung cao độ và những cam kết nguồn lực mới để tôi rèn một §Y$solar_storm$§! bằng cách thao túng gió sao của §H[target.GetName]§!"
 cstorms.2010.desc_others: "Các công tác chuẩn bị cho $default_storm$ trong hệ sao §H[target.solar_system.GetName]§! đã bước vào thời khắc quan trọng. Những hành động tiếp theo mang tính quyết định và đòi hỏi nguồn lực tập trung hơn cho sự nghiệp này."
 cstorms.2010.a: "Tăng cường gió sao."
 cstorms.2010.a.tt: "$approach_situation_initiate_storm_irradiate_tt$\nChi phí $@irradiate_alloy_upkeep|0$ $r_alloys$ Hàng Tháng, $@default_monthly_progress$ Tiến Độ/Tháng"
 cstorms.2010.b: "Cắt đứt trường electron."
 cstorms.2010.b.tt: "$approach_situation_initiate_storm_sever_tt$\nChi phí $@sever_energy_upkeep|0$ $r_energy$ Hàng Tháng, $@default_monthly_progress$ Tiến Độ/Tháng"
 cstorms.2010.c: "Từ hóa ion."
 cstorms.2010.c.tt: "$approach_situation_initiate_storm_magnetize_tt$\nChi phí $@magnetize_mineral_upkeep|0$ $r_minerals$ Hàng Tháng, $@default_monthly_progress$ Tiến Độ/Tháng"
 cstorms.2010.d: "Từ bỏ dự án."

 cstorms.2015.name: "$cstorms.2010.name$"
 cstorms.2015.desc_one_tech_only: "Các công tác chuẩn bị cho $default_storm$ trong hệ sao §H[target.solar_system.GetName]§! đã bước vào giai đoạn then chốt. Những hành động tiếp theo của [storm_researcher.GetName] đòi hỏi sự tập trung cao độ và nguồn lực mới để tận dụng trạng thái phồng to của [target.GetName]."
 cstorms.2015.desc_others: "Các công tác chuẩn bị cho $default_storm$ trong hệ sao §H[target.solar_system.GetName]§! đã bước vào thời khắc quyết định. Những hành động tiếp theo của [storm_researcher.GetName] mang tính sống còn, và đòi hỏi các cam kết tài nguyên tập trung hơn cho đại cuộc, nếu chúng ta muốn tận dụng triệt để trạng thái phồng to của [target.GetName]."
 cstorms.2015.a: "Khuấy động hạt."
 cstorms.2015.a.tt: "$approach_situation_initiate_storm_agitate_tt$\nChi phí $@rare_resource_upkeep|0$ $r_volatile_motes$ Hàng Tháng, $@default_monthly_progress$ Tiến Độ/Tháng"
 cstorms.2015.b: "Làm mất ổn định trường trọng lực."
 cstorms.2015.b.tt: "$approach_situation_initiate_storm_destabilize_tt$\nChi phí $@rare_resource_upkeep|0$ $r_dark_matter$ Hàng Tháng, $@default_monthly_progress$ Tiến Độ/Tháng"
 cstorms.2015.c: "Khuấy bụi sao."
 cstorms.2015.c.tt: "$approach_situation_initiate_storm_scramble_tt$\nChi phí $@rare_resource_upkeep|0$ $r_rare_crystals$ Hàng Tháng, $@default_monthly_progress$ Tiến Độ/Tháng"
 cstorms.2015.d: "$cstorms.2010.d$"

 cstorms.storm_gathered.final_word: "Làm chủ quyền năng của $default_storm$ không phải là một kỳ tích nhỏ bé. Cuối cùng chúng ta cũng có thể gặt hái những phần thưởng hằng mong đợi sau bao nỗ lực."
 cstorms.storm_gathered.a: "Làm tốt lắm."
 cstorms.2020.name: "Giải Phóng Bão Tố"
 cstorms.2020.desc: "Gió sao được tăng cường của §H[target.GetName]§! đã đạt tới khối lượng tới hạn.\n\nChúng ta đang bên bờ vực giải phóng một §Y$solar_storm$§!.\n\n$cstorms.storm_gathered.final_word$"
 cstorms.2025.name: "$cstorms.2020.name$"
 cstorms.2025.desc: "Các trường electron của §H[target.GetName]§! đã bị cắt đứt hoàn toàn.\n\nChúng ta đang bên bờ vực giải phóng một §Y$electric_storm$§!.\n\n$cstorms.storm_gathered.final_word$"
 cstorms.2030.name: "$cstorms.2020.name$"
 cstorms.2030.desc: "Các ion của §H[target.GetName]§! đã được từ hóa thành công.\n\nChúng ta đang bên bờ vực giải phóng một §Y$magnetic_storm$§!.\n\n$cstorms.storm_gathered.final_word$"
 cstorms.2035.name: "$cstorms.2020.name$"
 cstorms.2035.desc: "Các hạt bão hòa của §H[target.GetName]§! đã đạt đến điểm giới hạn.\n\nChúng ta đang bên bờ vực giải phóng một §Y$particle_storm$§!.\n\n$cstorms.storm_gathered.final_word$"
 cstorms.2040.name: "$cstorms.2020.name$"
 cstorms.2040.desc: "Trường trọng lực của §H[target.GetName]§! đã bị làm mất ổn định hoàn toàn.\n\nChúng ta đang bên bờ vực giải phóng một §Y$gravity_storm$§!.\n\n$cstorms.storm_gathered.final_word$"
 cstorms.2045.name: "$cstorms.2020.name$"
 cstorms.2045.desc: "Bụi sao của §H[target.GetName]§! đã bị xáo trộn hoàn toàn.\n\nChúng ta đang bên bờ vực giải phóng một §Y$celestial_storm$§!.\n\n$cstorms.storm_gathered.final_word$"


### Aftermath Deposits ###

 d_magnetic_storm_1_minerals: "Quặng Từ Hóa"
 d_magnetic_storm_1_minerals_desc: "Một cơn bão vũ trụ đi qua đã từ hóa một lượng khổng lồ các mỏ khoáng sản chưa từng được khai thác trước đây, giúp hoạt động khai thác mỏ của chúng ta tiếp cận những nguồn tài nguyên mới này cực kỳ dễ dàng."
 d_magnetic_storm_2_alloys: "Xưởng Rèn Bão Tố"
 d_magnetic_storm_2_alloys_desc: "Một cơn bão vũ trụ đi qua tàn phá hành tinh này đã khiến một lượng lớn thiết bị đúc kim loại bị tích điện một cách kỳ lạ. Ngay cả khi chưa hiểu hết cơ chế, sản lượng hợp kim của chúng ta đã tăng lên đáng kể."
 d_magnetic_storm_3_mix: "Cao Nguyên Bay"
 d_magnetic_storm_3_mix_desc: "Được từ hóa bởi hiệu ứng trọng lực của cơn bão vũ trụ quét qua, những khối lục địa bay lơ lửng hùng vĩ có thể được điều hướng trực tiếp bên trên các khu phức hợp công nghiệp hiện có."

 cstorms.8000.title: "Biến Đổi Vũ Trụ"
 cstorms.8000.desc: "Một cơn bão vũ trụ đi qua đã để lại nhiều điều hơn là chỉ sự tàn phá. Trên [Planet.GetName], nó đã tạo ra một đặc điểm địa lý hoàn toàn mới."
 cstorms.8000.a: "Thật cuốn hút"

 d_electric_storm_1_engineering: "Tàn Tích Bị Sét Đánh"
 d_electric_storm_1_engineering_desc: "Một cơn bão vũ trụ cuồng nộ dữ dội quét qua đã biến một khu định cư từng hưng thịnh thành tàn tích bị sét đánh, biến đổi các vật liệu xây dựng thông thường thành các hợp chất quý hiếm và bất thường."
 d_electric_storm_2_unity: "Vết Sẹo Hành Tinh"
 d_electric_storm_2_unity_desc: "Một cơn bão vũ trụ đi qua đã trút xuống sự tàn phá tập trung đến mức khắc sâu một vết sẹo có thể nhìn thấy từ không gian."
 d_electric_storm_3_physics: "Hạm Đội Tĩnh Lặng"
 d_electric_storm_3_physics_desc: "Một cơn bão vũ trụ quét qua đã tàn phá hệ thống định vị của vô số tàu dân sự, biến những khu vực bị ảnh hưởng nặng nề nhất thành nghĩa địa ma quái của những xác tàu vỡ vụn và máy móc bị hủy hoại."

 d_particle_storm_1_society: "Ngoại Ô Bị Bão Tàn Phá"
 d_particle_storm_1_society_desc: "Cơn Bão Vũ Trụ đã biến một số khu ngoại ô của chúng ta thành đống đổ nát, chỉ còn thích hợp để nghiên cứu các tàn tích."
 d_particle_storm_2_unity: "Cơn Đại Bão"
 d_particle_storm_2_unity_desc: "Cơn Bão Vũ Trụ đã để lại một miệng hố va chạm khổng lồ trên thế giới này, một lời nhắc nhở tàn khốc về sự thờ ơ của vũ trụ đối với sự tồn tại của chúng ta."
 d_particle_storm_3_motes: "Các Chiều Không Gian Bất Ổn"
 d_particle_storm_3_motes_desc: "Cơn Bão Vũ Trụ đã biến nhiều vùng đồng bằng rộng lớn thành các khu vực có hoạt động kiến tạo cao, thật trùng hợp khi sự nguy hiểm gia tăng cũng đi kèm với sự gia tăng của bụi phóng xạ."

 particle_storm_aftermath_1_tt: "Tốc Độ Lắp Ráp Robot: §R-40%§!\n£minerals£ §YKhoáng Sản§! từ Việc Làm: §R-10%§!\n£volatile_motes£ §YBụi Phóng Xạ§! từ Dân Cư: §G+0.02§!"
 particle_storm_aftermath_2_tt: "Tốc Độ Lắp Ráp Robot: §R-50%§!\n£minerals£ §YKhoáng Sản§! từ Việc Làm: §R-20%§!\n£volatile_motes£ §YBụi Phóng Xạ§! từ Dân Cư: §G+0.04§!"
 particle_storm_aftermath_3_tt: "Tốc Độ Lắp Ráp Robot: §R-60%§!\n£minerals£ §YKhoáng Sản§! từ Việc Làm: §R-30%§!\n£volatile_motes£ §YBụi Phóng Xạ§! từ Dân Cư: §G+0.06§!"

 d_solar_storm_1_energy: "Tầng Ozone Bị Suy Thoái"
 d_solar_storm_1_energy_desc: "Cơn Bão Vũ Trụ đã xé toạc một lỗ thủng trên tầng ozone của khí quyển hành tinh này. Mặc dù ảnh hưởng nghiêm trọng đến chất lượng cuộc sống, chất lượng sản xuất lại tăng lên."
 d_solar_storm_2_districts: "Cao Nguyên Nhiễm Xạ"
 d_solar_storm_2_districts_desc: "Cơn Bão Vũ Trụ đã tắm cao nguyên của thế giới này trong bức xạ, tạo ra một mảnh đất tuyệt vời cho việc sản xuất năng lượng của chúng ta."
 d_solar_storm_3_output: "Sa Mạc Phát Sáng"
 d_solar_storm_3_output_desc: "Cơn Bão Vũ Trụ đã khiến cả một vùng sa mạc rực sáng, một cảnh tượng chết chóc nhưng với các biện pháp an toàn thích hợp, nó có thể biến thành một địa điểm du lịch khả thi về mặt tài chính."

 d_celestial_storm_1_mines: "Lông Vũ Tinh Thể"
 d_celestial_storm_1_mines_desc: "Những vụ nổ tàn phá của một cơn bão vũ trụ đi qua đã để lại một cảnh quan tinh thể lởm chởm và gai nhọn, tạo nên một địa hình hiểm trở nhưng đầy tiềm năng sinh lời."
 d_celestial_storm_2_society: "Trầm Tích Lịch Sử"
 d_celestial_storm_2_society_desc: "Một cơn bão vũ trụ đi qua đã thổi bay toàn bộ các lớp trầm tích, hé lộ những dấu vết của muôn vàn kỷ nguyên mà chúng ta chưa từng được nghiên cứu trước đây."
 d_celestial_storm_3_crystal: "Cồn Cát Bụi Sao"
 d_celestial_storm_3_crystal_desc: "Một cơn bão vũ trụ đi qua quét qua thế giới này như một đợt sóng thần vĩ đại. Nối bước nó, nó để lại một cảnh quan thanh thoát của những cồn cát bụi sao lấp lánh."

 celestial_storm_aftermath_1_tt: "Tội Phạm Hành Tinh: §R+10%§!\n£food£ §YThực Phẩm§! từ Việc Làm: §R-10%§!\n£rare_crystals£ §YTinh Thể Hiếm§! từ Dân Cư: §G+0.02§!"
 celestial_storm_aftermath_2_tt: "Tội Phạm Hành Tinh: §R+20%§!\n£food£ §YThực Phẩm§! từ Việc Làm: §R-20%§!\n£rare_crystals£ §YTinh Thể Hiếm§! từ Dân Cư: §G+0.04§!"
 celestial_storm_aftermath_3_tt: "Tội Phạm Hành Tinh: §R+30%§!\n£food£ §YThực Phẩm§! từ Việc Làm: §R-30%§!\n£rare_crystals£ §YTinh Thể Hiếm§! từ Dân Cư: §G+0.06§!"

 d_gravity_storm_1_districts: "Đồng Bằng Nén Chặt"
 d_gravity_storm_1_districts_desc: "Tác động nghiền nát của trọng lực từ một cơn bão vũ trụ quét qua đã nén chặt một số khu vực trước đây bị coi là quá bất ổn để xây dựng, thực tế mang lại cho chúng ta thêm đất đai miễn phí."
 d_gravity_storm_2_unity: "Đài Tưởng Niệm Vỡ Vụn"
 d_gravity_storm_2_unity_desc: "Một cơn bão vũ trụ đi qua đã giáng áp lực kinh hoàng lên một số đài tưởng niệm mỏng manh hơn của chúng ta, nghiền nát chúng thành bụi và mảnh vụn - một lời nhắc nhở khiêm nhường về những thế lực đáng sợ đang chờ đợi chúng ta ngoài kia."
 d_gravity_storm_3_engineering: "Hang Động Trọng Lực"
 d_gravity_storm_3_engineering_desc: "Một cơn bão vũ trụ đi qua đã biến một số khu phức hợp khai khoáng của chúng ta thành các hầm trục vỡ nát bằng vật liệu siêu nén. Mặc dù các nỗ lực mở lại chúng đã khơi dậy những lý thuyết mới trong ngành kỹ thuật và khoan cắt, chúng lại đạt được rất ít tiến triển trong việc khôi phục các mỏ."

 d_shroud_storm_1_society: "Ký Sinh Trùng Màn Che"
 d_shroud_storm_1_society_desc: "Một cơn bão vũ trụ đi qua đã phát tán ký sinh trùng trong đàn gia súc của chúng ta. Chuyển pha giữa thực tại của chúng ta và Màn Che, chúng đã được chứng minh là có thể ăn được, lành mạnh và thơm ngon đến bất ngờ."
 d_shroud_storm_2_zro: "Cánh Đồng Zro"
 d_shroud_storm_2_zro_desc: "Được biến đổi bởi một cơn bão vũ trụ quét qua, các quần xã sinh vật xanh tươi nhất của hành tinh này đã trở thành những cánh đồng Zro lay động. Đây là một trong những mỏ tinh khiết nhất mà chúng ta từng bắt gặp."
 d_shroud_storm_3_happy: "Thực Thể Dưới Hồ"
 d_shroud_storm_3_happy_desc: "Một cơn bão vũ trụ đi qua đã để lại cho chúng ta một món quà kỳ lạ và tuyệt vời. Khối nước lớn nhất trên hành tinh này tạo ra những gợn sóng hình thành các hoa văn và biểu tượng có tầm quan trọng rõ rệt, có khả năng trả lời các câu hỏi bằng trí tuệ đáng kinh ngạc."

### Shroud Storm Events
 shroud_switched: "Che Khuất Bởi Màn Che"
 shroud_switched_tt: "Những bức màn che của Màn Che vương vấn trên thiên thể này, sự hiện diện phi tự nhiên của chúng cho thấy hoặc là một vết rách sâu sắc hoặc là dư chấn của một Cơn Bão Màn Che thảm khốc."

 cstorms.8510.title: "Hoán Đổi Tâm Linh"
 cstorms.8510.desc: "Trong một đợt biến động tâm linh dồn dập, [from.GetName] đã bị hoán đổi với một [from.GetClassName] từ những vùng chưa xác định."
 cstorms.8510.a: "Một số phận kỳ lạ."
 cstorms.8515.title: "Đại Biến Hình"
 cstorms.8515.desc: "Một làn sóng năng lượng tâm linh đã quét qua [from.GetName], khiến một bộ phận dân cư bị biến đổi theo những cách thách thức quy luật tự nhiên. Toàn bộ các nhóm dân đã bị định hình lại, hình dạng của họ giờ đây trở nên kỳ dị và xa lạ, như thể có thứ gì đó vượt ngoài hiểu biết của chúng ta đã viết lại chính bản chất của họ."
 cstorms.8515.a: "Các thế lực bí ẩn đang khuấy động..."
 cstorms.8520.title: "Biến Đổi Sao"
 cstorms.8520.desc: "Một làn sóng năng lượng tâm linh dâng trào đã tái tạo [from.GetName], biến nó thành một ngôi sao mang bản chất hoàn toàn mới. Giờ đây, một [from.GetClassName] tỏa ánh sáng kỳ dị xuống Hệ Sao [from.solar_system.GetName], như thể chính thực tại đã bị thay đổi."
 cstorms.8520.a: "Ngay cả các vì sao cũng không thể miễn nhiễm..."

