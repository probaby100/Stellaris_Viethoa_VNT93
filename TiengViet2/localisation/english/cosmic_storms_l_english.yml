 resolution_cosmic_storms_storm_encouragement_mandate_desc: "Bằng cách phân tán các hạt và năng lượng quan trọng, bão vũ trụ thổi sức sống vào thiên hà, đổi mới các hành tinh và hệ sao mà chúng đi qua. Dòng chảy tự nhiên của chúng không được phép bị cản trở."
 resolution_cosmic_storms_storm_encouragement_mandate_tooltip: "$emergency_fund_contribution$ §R10%§! \n\n$storm_tech_cost$ §R+50%§!\n\n$breach_galactic_law_intro$$TABBED_NEW_LINE$- §YCông Nghệ Đẩy Lùi Bão§!"

