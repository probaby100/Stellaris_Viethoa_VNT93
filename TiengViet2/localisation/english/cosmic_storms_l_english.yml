 resolution_cosmic_storms_storm_encouragement_mandate_repeal_effect_success: "Bãi bỏ nghị quyết §Y$resolution_cosmic_storms_storm_encouragement_mandate$§!, giữ lại §Y$resolution_cosmic_storms_galactic_emergency_relief$§! làm luật thiên hà."

 resolution_cosmic_storms_control_restrictions: "Kiểm Soát Thao Túng Bão"
 resolution_cosmic_storms_control_restrictions_desc: "Thiên hà là một hệ sinh thái rộng lớn, liên kết chặt chẽ mà trong đó các cơn bão vũ trụ đóng một phần quan trọng. Việc tác động vào hành vi của chúng phải bị coi là phi pháp."
 resolution_cosmic_storms_control_restrictions_tooltip: "$storm_tech_cost$ §R+65%§!\n\n$breach_galactic_law_intro$$TABBED_NEW_LINE$- §YCông Nghệ Đẩy Lùi Bão§!$TABBED_NEW_LINE$- §YCông Nghệ Thu Hút Bão§!"

