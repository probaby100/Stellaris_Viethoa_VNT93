#Weather Manipulator
 r_weather_manipulator: "Bộ Áp Chế Nhiễu Loạn"
 r_weather_manipulator_desc: "Một phiên bản tiên tiến hơn của cỗ máy mà Thương Đoàn Inetian từng dùng để thao túng bão vũ trụ; theo mặc định thiết bị này sẽ gia tăng hiệu lực của tất cả công nghệ liên quan đến bão của chúng ta, nhưng khi được tận dụng đúng cách nó thậm chí có thể xua đuổi toàn bộ bão ra khỏi biên giới."
 storm_relic_repelling_field_modifier: "Kích Hoạt Bộ Áp Chế Nhiễu Loạn"
 storm_relic_repelling_field_modifier_tt: "Tạo ra một trường đẩy lùi §Y$default_storm$§! kích thước §Msiêu lớn§! xung quanh thủ đô đế chế trong 36 tháng."

# Temporary effect used by the Inetian Precursor Digsite C
 storm_timed_repelling_field_modifier: "Kích Hoạt Bộ Giảm Nhiễu Loạn Khu Vực"
 storm_timed_repelling_field_modifier_tt: "Tạo ra một trường đẩy lùi §Y$default_storm$§! kích thước §Htrung bình§! xung quanh thủ đô đế chế trong 18 tháng."

#The Tempest Invocator
 r_the_tempest_invocator: "Vật Triệu Hồi Bão Táp"
 r_the_tempest_invocator_desc: "Tiềm năng đang ngủ yên của thiết bị này có thể cảm nhận rõ ràng ngay cả khi đang tắt nguồn. Liệu chúng ta có dám triệu hồi cơn cuồng nộ bão tố vào bên trong một trong những bộ óc kiệt xuất và tài ba nhất của mình? Vì vinh quang của đế chế, sự hy sinh là điều tất yếu."
 r_the_tempest_invocator_active_effect_tt: "Tạo ra một ['concept_nexus_storm'] trong hệ sao mà bạn chọn.\n$t$Khi đã chọn hệ sao, một $scientist_with_icon$ sẽ bị §PHiến Tế§!."
 r_the_tempest_invocator_requirement_fail_tt: "$TRIGGER_FAIL$§RKhông có $scientist_with_icon$ nào để hiến tế.§!"
 r_the_tempest_invocator_started_placing_fail_tt: "$TRIGGER_FAIL$§RHệ thống đặt bão đã được kích hoạt.§!"
 tempest_invocator_active_modifier: "Đẩy Lùi Bão Táp"

