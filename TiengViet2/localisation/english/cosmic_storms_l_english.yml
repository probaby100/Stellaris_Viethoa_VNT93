 cstorms_tutorial.a: "Đã hiểu"

 cstorms_tutorial.1.name: "Hướng Dẫn: Thao Túng Bão"
 cstorms_tutorial.1.desc: "Chúng ta có thể §Sthao túng§! §Slộ trình§! của một §Y$default_storm$§! vì lợi ích của chính mình. Hoặc là §Slàm chệch hướng§! chúng khỏi các hệ sao của chúng ta, hoặc §Sthu hút§! chúng để tận dụng các hiệu ứng tích cực."

 TUTORIAL_STORM_FORECAST_MAP_MODE_TITLE: "Hướng Dẫn: Dự Báo Thời Tiết"
 TUTORIAL_STORM_FORECAST_MAP_MODE_DESC: "Chế độ bản đồ này trực quan hóa mọi §SBão Vũ Trụ§! trong ngân hà, kèm theo thông tin về các tác động của chúng.\n\n£storm_forecast_map£\n\nĐể truy cập chế độ bản đồ dự báo thời tiết, hãy nhấp vào biểu tượng bản đồ ở góc dưới bên phải.\n\nVới công nghệ tiên tiến, chế độ này có thể được nâng cấp để đưa ra các dự đoán ngày càng chính xác không chỉ về vị trí và hướng di chuyển của một §S$default_storm$§!, mà còn về loại bão dự kiến."
 concept_weather_forecasting_mode: "Chế Độ Dự Báo Thời Tiết"
 concept_weather_forecasting_mode_desc: "$TUTORIAL_STORM_FORECAST_MAP_MODE_DESC$"

 TUTORIAL_STORM_PROTECTION_TITLE: "Hướng Dẫn: Bão Vũ Trụ"
 TUTORIAL_STORM_PROTECTION_DESC: "§SBão Vũ Trụ§! là một thế lực đáng gờm của tự nhiên. Chúng có thể gây ra những tác động tàn khốc lên các hạm đội, nền kinh tế và thậm chí cả dân số của chúng ta. Tuy nhiên, chúng cũng có thể mang lại những cơ hội tuyệt vời.\n\nNghiên cứu §SCông Nghệ Bão§! cung cấp cho chúng ta các công trình và công nghệ để §Sgiảm thiểu đáng kể§! các §Stác động tiêu cực§! của bão. Với §Snghiên cứu bổ sung§!, thậm chí có thể tận dụng các lợi thế của bão."

