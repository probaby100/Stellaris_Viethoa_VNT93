# Storm in a Box
 cstorms.1816.name: "Khoang Nhộng Trôi Dạt"
 cstorms.1816.desc: "Một khoang nhộng bí ẩn đang trôi dạt trong hệ sao §H[from.GetName]§!. Nó không có năng lực tấn công rõ rệt và không phản hồi tín hiệu của chúng ta.\n\nCác bản quét ban đầu cho thấy lớp vỏ ngoài bị hư hại của nó được chế tạo bằng các vật liệu tiên tiến và kỹ thuật kỹ thuật lạ lẫm. Cần phải phân tích sâu hơn."
 cstorms.1816.a: "Điều tra."

 STORM_IN_A_BOX_INVESTIGATE_PROJECT: "Nghiên Cứu Khoang Nhộng"
 STORM_IN_A_BOX_INVESTIGATE_PROJECT_DESC: "Một khoang nhộng bí ẩn và bị hư hại rõ rệt đang trôi dạt qua hệ sao §H[this.GetName]§!. Chúng ta không biết nguồn gốc hay chức năng của nó. Nó không sở hữu vũ khí rõ ràng nào và chúng ta tin rằng việc phân tích sâu hơn cấu trúc tiên tiến của nó sẽ là một nỗ lực an toàn và đáng giá."

 cstorms.1820.name: "Bẫy Bão"
 cstorms.1820.desc: "[this.leader.GetName] tin rằng khoang nhộng bí ẩn trôi dạt qua hệ sao [solar_system.GetName] là một \"bẫy bão\" cổ xưa, từng có thể là một phần của mạng lưới phòng thủ lớn hơn.\n\nCổng nạp của thiết bị được niêm phong chặt chẽ, nhưng các chỉ số đo đạc của chúng ta cho thấy nó đang chứa năng lượng và vật chất bị nén của một cơn bão vũ trụ bị giam cầm bên trong.\n\nTìm cách mở vật chứa đáng chú ý này có thể dạy cho chúng ta rất nhiều điều về giảm thiểu thiệt hại do bão, dẫu phải đối mặt với nguy cơ giải phóng bất kỳ thế lực nào hiện đang bị giam hãm bên trong."
 cstorms.1820.a: "Có nhiều điều để học hỏi tại đây."
 cstorms.1820.b: "Quá nguy hiểm. Hãy để yên nó."

 STORM_IN_A_BOX_TRAP_PROJECT: "Mở Khóa Bẫy Bão"
 STORM_IN_A_BOX_TRAP_PROJECT_DESC: "Một \"bẫy bão\" cổ xưa đang trôi dạt tự do trong không gian, mang theo một cơn bão vũ trụ bị nén bên trong. Việc mở nó sẽ mang lại những hiểu biết quý giá về quản lý và giảm thiểu bão, dẫu có nguy cơ giải phóng bất kỳ nguồn năng lượng nào đang bị mắc kẹt bên trong."

 cstorms.1826.name: "Bão Tố Được Giải Phóng"
 cstorms.1826.desc: "[leader.GetName] đã hoàn thành phân tích về cơ chế hoạt động của bẫy bão cổ xưa và có thể mở khóa cơ cấu nạp của nó. Khi các cổng mở ra, cơn bão §H[from.GetStormType]§! bị giam cầm bên trong đã được phóng thích vào khoảng không của hệ sao [solar_system.GetName].\n\nNghiên cứu về kỹ thuật phức tạp của chiếc bẫy đã mang lại những hiểu biết sâu sắc đáng kinh ngạc về các vật liệu và cấu trúc chống bão, dẫu chúng ta vẫn chưa hiểu làm thế nào thiết bị có khả năng chứa trọn cả một cơn bão. Tri thức này sẽ hỗ trợ chúng ta rất nhiều trong việc chống chọi các nhiễu động vũ trụ trong tương lai."
 cstorms.1826.storm_tt: "Một cơn §Y$default_storm$§! nhỏ, cấp thấp xuất hiện trong hệ sao [solar_system.GetName]"
 storm_trap_insight_modifier: "Hiểu Biết Về Bẫy Bão"
 storm_trap_insight_modifier_tt: "Giảm §G10%§! tác động tiêu cực của §YBão Vũ Trụ§!."

 cstorms.1835.desc: "Xin gửi lời chia buồn sâu sắc, các [this.GetSpeciesNamePlural]! Chúng tôi tình cờ chứng kiến một cơn bão lớn đang tàn phá dữ dội tại [this.GetName].\n\nTất nhiên, chúng tôi vô cùng đau lòng khi nghe về những thiệt hại ở đó. Chúng tôi đã khóc, thật sự đã khóc! Vì vậy, xin hãy để chúng tôi giúp đỡ... với một thỏa thuận siêu đặc biệt chỉ một lần duy nhất!\n\nChúng tôi có thể cung cấp các thiết bị, thiết bị hạng nhất. Chỉ những thứ tốt nhất từ chúng tôi! Với những thứ này, khi cơn bão tiếp theo ập tới, bạn sẽ hoàn toàn sẵn sàng. Vậy chúng ta có thể chốt giao dịch chứ?"
 cstorms.1835.a: "Chúng tôi đồng ý."
 cstorms.1835.b: "Không quan tâm."

