 STORM_AFTERMATH: "§HTàn Dư Bão Tố§!"
 STORM_AFTERMATH_DESC: "- Tùy thuộc vào cường độ bão, các thuộc địa sẽ được áp dụng hiệu ứng sau trong 3 Năm:"

 electric_storm_aftermath_modifier: "Khí Quyển Nhiễm Điện"
 electric_storm_aftermath_modifier_tooltip: "$STORM_AFTERMATH_DESC$\n$t$- §H$electric_storm_aftermath_modifier$§!:\n$tt$- §R-25%§! đến §R-65%§! $MOD_PLANET_BUILDING_BUILD_SPEED_MULT$\n$tt$- §G+10%§! đến §G+30%§! $mod_planet_jobs_energy_produces_mult$"
 electric_storm_aftermath_modifier_severity_desc: "Cơn $electric_storm$ đã để lại dòng điện cuồn cuộn trong khí quyển, khiến sản lượng máy móc trở nên thất thường. Tuy nhiên, sản lượng năng lượng lại tăng vọt ngoài biểu đồ!"
 electric_storm_aftermath_modifier_severity_1: "Dư Chấn: $electric_storm_aftermath_modifier$"
 electric_storm_aftermath_modifier_severity_1_desc: "$electric_storm_aftermath_modifier_severity_desc$"
