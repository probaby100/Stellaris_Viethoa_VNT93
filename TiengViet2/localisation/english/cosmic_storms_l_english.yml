 civic_storm_callers: "Sùng Bái Bão Tố"
 civic_storm_callers_desc: "Từ thời cổ đại, xã hội này đã có thể thu hút các cơn bão thông qua các nghi lễ của họ. Qua nhiều năm tháng, họ kết hợp các cải tiến kỹ thuật để nâng cao hiệu quả. Với bình minh của kỷ nguyên không gian, giờ đây họ tìm cách đưa kiến thức này lên các vì sao."
 civic_storm_callers_effect_tooltip: "- $AVAILABLE_BUILDINGS$ £building£ ['building:building_storm_summoning_theater']\n- Thay thế việc làm £job_entertainer£ §H$job_entertainer$§! bằng việc làm £job_storm_dancer£ §H$job_storm_dancer$§!\n- $SPECIES_TRAITS$ ['trait:trait_storm_touched']"

 civic_storm_callers_megacorp: "Nghệ Sĩ Bão Tố"
 civic_storm_callers_megacorp_desc: "Khởi đầu chỉ là một chương trình phát sóng đơn giản các nghi lễ thiêng liêng, kể từ đó đã phát triển rực rỡ thành một tập đoàn truyền thông khổng lồ. Các nhà tiên tri và tư tế đã được thay thế bởi những nghệ sĩ giải trí đầy sức hút, tất cả đều cạnh tranh để giành lấy sự chú ý khi họ kêu gọi chính các cơn bão vũ trụ."
