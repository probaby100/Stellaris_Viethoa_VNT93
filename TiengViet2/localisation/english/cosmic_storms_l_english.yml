### Hold the Line
 site_hold_the_line: "Giữ Vững Phòng Tuyến"
 site_hold_the_line_intro: "Cơn bão vũ trụ đi qua đã để lại một vết sẹo kỳ lạ trên bề mặt của [From.Planet.GetName]. Những gì dường như là tàn tích ngầm đã bị lộ ra bởi các cơn chấn động dữ dội của cơn bão. Một cuộc khai quật khảo cổ có thể khám phá thêm về những công trình bí ẩn này."
 cstorms.1275.name: "Nỗi Hoang Mang Mới Mẻ"
 cstorms.1275.desc: "Mặc dù bị bão vũ trụ kéo lê qua thiên hà, tổ hợp trên quỹ đạo này chịu rất ít tổn hại. Chúng ta thấy các không gian sinh sống và thương mại của môi trường sống trong tình trạng gần như hoàn hảo. Không một chút bụi bẩn nào trên bề mặt phản ánh sự cư ngụ trước đó, như thể nó chưa từng được sử dụng.\n\nBên trong trung tâm điều khiển chính, chúng ta được chào đón bởi một hệ thống nhập liệu gây hoang mang: các mặt số không có lời giải thích, các cần gạt với các thiết lập không nhất quán và một lượng lớn các nút bấm nhấp nháy toàn bộ quang phổ màu sắc ở các khoảng thời gian dường như ngẫu nhiên. May mắn thay, cuối cùng chúng ta đã bắt gặp một cuốn sổ tay. Khi cuốn sổ này được dịch thành công, chúng ta tự tin có thể tái kích hoạt môi trường sống này."
 cstorms.1280.name: "Ghi Đè Thủ Công"
 cstorms.1280.desc: "Thật không may, ước tính trước đây của chúng ta có vẻ quá lạc quan: cuốn sổ tay hóa ra cũng khó hiểu y như hệ thống điều khiển. Một nửa số trang dường như bị mất và các hướng dẫn bằng hình ảnh đưa ra các giả định ký hiệu học rất lớn. Nửa còn lại của sổ tay được viết bằng chữ tượng hình khó diễn giải.\n\nTuy nhiên, trang cuối cùng hiển thị một tần số liên lạc đi kèm với một tập hợp ký tự được dịch là 'bàn trợ giúp'. Chúng ta đang thử liên lạc theo tần số này."
 cstorms.1285.name: "Cuộc Gọi Của Bạn Rất Quan Trọng Với Chúng Tôi"
 cstorms.1285.desc: "Tần số liên lạc trong sổ tay đã kết nối chúng ta với máy chủ bàn trợ giúp của một thực thể thương mại có tên là Skygarden.\n\nVới giọng điệu thân thiện nhưng trung tính, AI bàn trợ giúp thông báo rằng nó đánh giá cao việc chúng ta liên hệ, và hỏi xem có điều gì nó có thể hỗ trợ chúng ta không. Trong số các lựa chọn được liệt kê có 'trả lời câu hỏi về gói đăng ký', 'tìm hiểu về dòng hệ thống phòng thủ thông minh mới' và liệu chúng ta có muốn biết thêm về các 'sáng kiến trách nhiệm xã hội' của tập đoàn hay không.\n\nTuy nhiên, các lựa chọn tiếp theo tiếp tục hướng chúng ta đến các chủ đề hoàn toàn không liên quan. Tệ nhất là nó thường giữ các [Root.Owner.GetEngineerPlural] của chúng ta ở chế độ chờ chỉ để rồi ngắt cuộc gọi. Rõ ràng, AI dịch vụ đã không vượt qua được sự tàn phá của thời gian tốt như phần còn lại của môi trường sống.\n\nDù vậy, chúng ta sẽ tiếp tục cố gắng tìm đường qua hệ thống bí ẩn này."
 cstorms.1290.name: "Mê Cung Tùy Chọn"
 cstorms.1290.desc: "Các [Root.Owner.GetEngineerPlural] của chúng ta báo cáo rằng bất kể họ nói gì với AI, sau khi trải qua vô số câu hỏi và khảo sát, cuộc gọi luôn dẫn đến câu hỏi liệu chúng ta có muốn hủy gói đăng ký của mình hay không.\n\nCuối cùng, sau khi đưa ra câu trả lời phủ định, họ được yêu cầu xác thực các thông tin tài chính bằng cách đọc to số tài khoản cá nhân. Sau khi từ chối, AI bắt đầu vòng lặp lại từ đầu.\n\nChúng ta có thể thử đột nhập vào mã nguồn của AI để ép nó bỏ qua các biện pháp bảo mật này, hoặc kiên nhẫn chịu đựng quy trình hỗ trợ khách hàng của nó."
 cstorms.1290.a: "Đột nhập vào hệ thống AI."
 cstorms.1290.b: "Làm theo quy trình của nó."
 cstorms.1290.c: "Cứ bấm loạn hết các nút lên."
 cstorms.1295.name: "Tái Kích Hoạt Hoàn Tất"
 cstorms.1295.desc.a: "Cuối cùng cũng có một bước đột phá! AI đã khiển trách chúng ta vì sử dụng ngôn từ không phù hợp và tuyên bố chúng ta nên đợi cho đến khi được đại diện dịch vụ khách hàng liên hệ.\n\n$cstorms.1295.desc.followup$"
 cstorms.1295.desc.b: "Cuối cùng cũng có một bước đột phá! AI rõ ràng đã bối rối trước sự im lặng kéo dài của chúng ta và sẽ chuyển tiếp chúng ta đến một đại diện dịch vụ khách hàng.\n\n$cstorms.1295.desc.followup$"
 cstorms.1295.desc.c: "Cuối cùng cũng có một bước đột phá! AI đã khiển trách chúng ta vì lạm dụng bảng điều khiển và tuyên bố chúng ta nên đợi cho đến khi được đại diện dịch vụ khách hàng liên hệ.\n\n$cstorms.1295.desc.followup$"
 cstorms.1295.desc.followup: "Trong một khoảng thời gian chúng ta phải chờ đợi, rồi đường truyền liên lạc được mở lại. Thực thể ở đầu dây bên kia tự giới thiệu mình là người lưu giữ hồ sơ của Tập đoàn Skygarden. Bản thân bàn trợ giúp là một chương trình AI mà cô được thừa hưởng từ người lưu giữ hồ sơ trước đó. Theo những gì cô biết, trạm liên lạc đã không được sử dụng kể từ khi Skygarden phá sản nhiều thập kỷ trước. Khi chúng ta thắc mắc tại sao cô vẫn tiếp tục làm việc cho một tổ chức đã phá sản, cô chỉ đơn giản nói rằng điều đó nằm trong hợp đồng của mình.\n\nSau khi giải thích tình hình của chúng ta, người lưu giữ hồ sơ đã lục tìm thấy một cuốn hướng dẫn bắt đầu nhanh cũ cho môi trường sống. Cô ấy sẽ sớm chuyển bản in kỹ thuật số của các trang sách cho chúng ta."
 cstorms.1300.name: "Hợp Đồng Đã Hủy"
 cstorms.1300.desc: "AI bàn trợ giúp đột ngột thông báo rằng gói đăng ký của chúng ta đã bị hủy do không thể xác minh thông tin tài khoản, và bắt đầu quy trình tự hủy của môi trường sống!\n\nCác kỹ sư của chúng ta đã cố gắng vô hiệu hóa quy trình này nhưng thất bại. Cấu trúc đã sụp đổ và chỉ để lại các mảnh vỡ kim loại."

### Repowered Complex
 site_repowered_complex: "Tổ Hợp Tái Cấp Điện"
 site_repowered_complex_intro: "Sau khi một cơn §Y$electric_storm$§! gần đây quét qua, một đợt tăng vọt năng lượng không rõ nguyên nhân đã được phát hiện bên dưới bề mặt của §H[From.Planet.GetName]§!. Các bản quét sâu hơn đã hé lộ một tổ hợp ngầm cổ xưa có các máy phát điện được tái kích hoạt bởi cơn bão, đưa cơ sở hoạt động trở lại."
 cstorms.1845.name: "Lối Vào Kiên Cố"
 cstorms.1845.desc: "Lối vào của tổ hợp biệt lập trên §H[From.Planet.GetName]§! có kết cấu đặc biệt vững chắc. Được xây dựng rõ ràng để trường tồn, ngoại thất của nó có lớp giáp dày, khiên bức xạ và một dãy cảm biến khí quyển. §H[Leader.GetName]§! tin rằng nó được xây dựng để chống chịu các điều kiện khắc nghiệt.\n\nCác bản quét cho thấy một khoang ngầm lớn có thể được tiếp cận thông qua một loạt các cánh cửa an ninh được niêm phong."
 cstorms.1850.name: "Hầm Trú Ẩn Sinh Tồn"
 cstorms.1850.desc: "Sau khi tiếp cận được bên trong khu vực chính, §H[Leader.GetName]§! kết luận rằng chúng ta đã phát hiện ra một hầm trú ẩn sinh tồn chưa từng được sử dụng, được xây dựng từ lâu cho một loài sinh vật hữu cơ chưa rõ danh tính.\n\nNó được trang bị các khu sinh hoạt dự trữ đầy đủ gồm các khoang ngủ, khu vực giải trí và một trạm y tế. Các tủ khóa lưu trữ trên mỗi tầng chứa lượng lớn các gói dinh dưỡng, pin và công cụ chưa mở nắp. Mọi thứ chứa trong căn hầm bí mật này đều ở trong tình trạng nguyên sơ.\n\nMột bộ cửa an ninh cuối cùng vẫn còn bị khóa kín. Chúng ta tin rằng chúng sẽ dẫn chúng ta đến đài chỉ huy của cơ sở."
 cstorms.1850.a: "Tiếp tục."
 cstorms.1855.name: "Gói Hầm Trú Ẩn Xa Hoa"
 cstorms.1855.desc: "Đài chỉ huy của hầm trú ẩn được trang bị một loạt các màn hình theo dõi §Y$default_storm$§! ấn tượng, tất cả đều được cung cấp dữ liệu bởi các cảm biến khí quyển trên bề mặt. Sau khi vận hành ở chế độ chờ, các bảng điều khiển này chứa dữ liệu bão lịch sử trị giá hàng thế kỷ, điều này sẽ thúc đẩy đáng kể sự hiểu biết của chúng ta về khí tượng học vũ trụ.\n\n§H[Leader.GetName]§! cũng tìm thấy một máy chiếu hình ảnh nổi nhỏ và được sử dụng nhiều. Khi được kích hoạt, nó chiếu ra một hình ảnh 3D loài thân mềm đang chào hàng, giới thiệu qua các tính năng chính của hầm trú ẩn dưới biểu trưng của công ty.\n\nLiệu sản phẩm sinh tồn này đã từng tìm được người mua hay chưa là điều bất khả tri, nhưng nó rõ ràng đã không được sử dụng ở đây trong nhiều năm."
 cstorms.1855.desc.megacorp: "Các bộ phận tiếp thị của chúng ta đã và đang phân tích xem họ đã sai ở đâu."

###############################
#### The Weather Manipulators #
###############################

 STORMS_PREC_WM_ONE: "Hầm Trú Ẩn Cổ Đại"
 STORMS_PREC_WM_ONE_DESC: "Chúng ta đã xác định được một số cấu trúc ngầm bị che khuất trên §Y[From.Planet.GetName]§! dường như có niên đại đáng kể. Chúng ta nên nhân cơ hội này để điều tra."

 cstorms.105.name: "Những Hầm Trú Ẩn Cổ Đại"
 cstorms.105.desc: "Hành tinh §Y[From.Planet.GetName]§! trong hệ sao [From.GetStarName] là một thế giới đổ nát, dường như là tàn tích của một đế chế đã biến mất vào thời cổ xưa. Các cấu trúc ngầm mà chúng ta quan tâm cũng cổ xưa không kém và tương đối nguyên vẹn.\n\nHình ảnh cộng hưởng sóng âm đã hé lộ một cấu trúc ngầm phức tạp gồm các phòng lưu trữ cũng như các hầm trú ẩn được thiết kế để chống lại các lực lượng của tự nhiên. Sự tàn phá trên bề mặt hành tinh chắc chắn là kết quả của các cơn bão vũ trụ, điều này hoàn toàn trùng khớp với sự tồn tại của nơi trú ẩn.\n\nTuy nhiên, lượng mảnh vỡ quá lớn đang khiến việc điều tra thêm trở nên khó khăn. Một địa điểm khai quật khảo cổ có thể cho chúng ta biết nhiều điều hơn."

# arcsite The Ancient Storm Shelters
 site_weathermanipulators_the_ancient_storm_shelters: "Những Hầm Trú Ẩn Cổ Đại"
 site_weathermanipulators_the_ancient_storm_shelters_intro: "Một hầm trú ẩn bị chôn vùi dưới đống đổ nát của một thế giới bị bão tàn phá; sự hoang tàn khiến việc điều tra gặp khó khăn, nhưng nội thất bên trong dường như còn nguyên vẹn."
 cstorms.110.name: "Từ Bụi Tro Đến Tàn Phá"
 cstorms.110.desc: "Tiếp cận hầm trú ẩn từ mặt đất đã để lộ ra một khe hở nhỏ bên dưới hai tòa tháp bị sụp đổ, qua đó có thể nhìn thấy ánh sáng mờ nhạt của máy móc đang hoạt động.\n\nKhe hở này cung cấp một điểm neo để các [Root.Owner.GetScientistPlural] của chúng ta vạch ra quy mô của khu phức hợp, và có thể tìm cách mở nó ra mà không làm hỏng tính toàn vẹn mong manh của cấu trúc.\n\nTàn tích chôn vùi địa điểm này mang tất cả các dấu hiệu của sự hủy hoại do bão vũ trụ gây ra. Kỳ lạ thay, không có dấu hiệu nào cho thấy cư dân của thành phố đã cố gắng tự bảo vệ mình.\n\nCứ như thể họ đã chịu đựng sự hung bạo này càng lâu càng tốt, chỉ để sơ tán trong sự vội vã tột độ. Có lẽ câu trả lời nằm bên dưới mặt đất đổ nát của §Y[From.Planet.GetName]§!."
 cstorms.110.a: "Đã hiểu."
 cstorms.115.name: "Bên Dưới Các Tòa Tháp"
 cstorms.115.desc: "Sau khi dọn sạch nhiều lớp mảnh vỡ và bụi bặm, khe hở bên dưới các tòa tháp đã đủ lớn để các [Root.Owner.GetScientistPlural] của chúng ta tiến vào hầm trú ẩn.\n\nNơi trú ẩn này đơn giản và mang tính thực dụng, với nhiều căn phòng nhánh, hầu hết đều trống rỗng. Trên thực tế, nó có vẻ quá mức đơn sơ. Nó chắc chắn trông giống như một dạng hầm trú ẩn nào đó, nhưng nó sẽ không thể chống chọi lại các cơn bão vũ trụ. Các bức tường quá mỏng, cung cấp rất ít sự chống đỡ, còn trần và sàn nhà thì không được gia cố. Nó được cứu vãn hoàn toàn chỉ nhờ vào sự may mắn thuần túy. Nếu không nhờ hai tòa tháp bên trên và vụ lở đất di chuyển toàn bộ khu phức hợp trong một cú quét sập, thì nơi trú ẩn 'bão' này đã bị xóa sổ từ lâu.\n\nÁnh sáng nhìn thấy từ bên ngoài bắt nguồn từ một vài hệ thống cảnh báo bị trục trặc, và một số thiết bị đầu cuối đang hoạt động có thể được phát hiện sâu hơn trong hầm trú ẩn. Đây có thể là cơ hội đắt giá để tìm hiểu thêm về những chủ nhân trước đây của cơ sở này, cũng như những hoàn cảnh kỳ lạ đang diễn ra."
 cstorms.120.name: "Lưu Trữ Đồ Cổ"
 cstorms.120.desc: "Các thiết bị đầu cuối đang hoạt động bên trong nơi trú ẩn trên §Y[From.Planet.GetName]§! đang dần tiết lộ bí mật của chúng. Nhiều thiết bị đầu cuối trong số này được dành riêng cho các quy trình kiểm kê, ghi lại các mặt hàng mà chúng ta chưa thể dịch chính xác tên gọi. Những mô tả đi kèm gợi ý về các loại vải lụa, kim loại quý và gia vị hiếm.\n\nMặt khác, một số thiết bị đầu cuối dường như chứa các tài liệu lịch sử hoặc hành chính. Tuy nhiên, ngôn ngữ này rất phức tạp và sẽ mất thời gian để giải mã đầy đủ.\n\nCác [Root.Owner.GetScientistPlural] của chúng ta đã thiết lập một trạm dịch thuật tạm thời bên trong hầm trú ẩn để tiếp tục công việc của họ. Tuy nhiên, sự ổn định của cấu trúc đang xấu đi nhanh chóng. Chúng ta phải hành động thận trọng nếu muốn lấy lại bất kỳ dữ liệu có ý nghĩa nào trước khi toàn bộ nơi này sụp đổ."
 cstorms.120.a: "Tiếp tục giải mã."
 cstorms.120.b: "Chúng ta có thể đẩy nhanh tiến độ công việc."
 cstorms.120.c: "Hãy dồn lực thúc đẩy nhanh chóng. Bỏ qua mọi thứ khác."
 cstorms.125.name: "Chạy Đua Với Thời Gian"
 cstorms.125.desc: "Trần của nơi trú ẩn trên §Y[From.Planet.GetName]§! đã bắt đầu rung chuyển và nứt toác dữ dội hơn, bụi và những mảnh vụn nhỏ rơi xuống như mưa lên các [Root.Owner.GetScientistPlural] của chúng ta. Dù vậy, họ vẫn tiếp tục công việc dịch thuật một cách ngoan cường.\n\nHọ đã xoay xở để hiểu được một số tài liệu hành chính, vốn nói về một nền văn minh thương mại thịnh vượng được gọi là 'Thương Đoàn Inetian'. Dường như nơi trú ẩn này không phải là một công trình phòng thủ bão chuyên dụng, mà thực chất là một kho chứa hàng hóa có giá trị cao.\n\nCác tài liệu cũng đề cập đến một loại máy móc bí ẩn có khả năng 'xoa dịu bầu trời', được lắp đặt tại một địa điểm khác trong hệ sao này. Trước khi họ có thể tìm hiểu thêm, một tiếng rắc lớn vang lên từ sâu bên trong cơ sở."
 cstorms.125.a: "Hãy cẩn thận ở dưới đó."
 cstorms.125.b: "Ưu tiên việc thu hồi dữ liệu."
 cstorms.125.c: "Chúng ta có thể hỗ trợ cuộc điều tra."
 cstorms.130.name: "Mưu Tính Chốn Thương Trường"
 cstorms.130.desc: "Âm thanh xé toạc và nứt vỡ ngày càng dữ dội. Dẫu vậy, nỗ lực dịch thuật vẫn tiếp tục bên trong hầm trú ẩn trên §Y[From.Planet.GetName]§!. Trong khi số hàng hóa tích trữ tỏ ra vô ích đối với việc tìm kiếm thông tin, thì các thiết bị đầu cuối đang hoạt động lại hé lộ rất nhiều điều.\n\nMột tập hợp các tọa độ bị xáo trộn chỉ đến vị trí của một thiết bị 'đầy quyền năng' nằm trên một hành tinh gần đó. Theo những gì chúng ta có thể hiểu, thiết bị này sở hữu khả năng \"thao túng\" một cơn bão vũ trụ, một tuyên bố thật khó tin nếu đó là sự thật.\n\nTuy nhiên, trước sự suy giảm độ ổn định của nơi trú ẩn và một bản sao tọa độ đã được truyền về tàu của chúng ta trên quỹ đạo, chúng ta đã sơ tán khỏi địa điểm. Nhiều câu hỏi vẫn chưa có lời đáp, nhưng cuộc săn lùng giờ đây đã bắt đầu."
 cstorms.130.a: "Một cơ hội quá tốt để bỏ qua."

# Special Project Descramble the Coordinates
 INETIAN_PROJECTS_01: "Giải Mã Tọa Độ"
 INETIAN_PROJECTS_01_DESC: "Một tập hợp các tọa độ bị xáo trộn đã được thu hồi từ §Y[wm_storm_shelter_planet.GetName]§! trước khi hầm trú ẩn sụp đổ. Chúng ta có lý do để tin rằng một trong số này có thể dẫn đến một cỗ máy mà Thương Đoàn Inetian từng dùng để thao túng bão vũ trụ. Đây có thể là công nghệ rất đáng để bỏ công tìm kiếm."

# Special project completed
 cstorms.135.name: "Hệ Sao Trù Phú"
 cstorms.135.desc: "May mắn thay, các [Root.GetScientistPlural] của chúng ta đã thoát khỏi hầm trú ẩn đang sụp đổ trên §Y[wm_storm_shelter_planet.GetName]§! cùng một tập hợp tọa độ bị xáo trộn. Dữ liệu này kể từ đó đã được phục hồi, và mang lại ba địa điểm để chúng ta khám phá:\n\n§Y[wm_digsite_A.GetName]§!, §Y[wm_digsite_B.GetName]§!, và §Y[wm_digsite_C.GetName]§!. Phân tích sâu hơn chỉ ra rằng mỗi hành tinh đóng một vai trò trọng yếu trong mạng lưới của Thương Đoàn Inetian, một vai trò đủ quan trọng để được ghi chép lại trong hầm trú ẩn trên §Y[wm_storm_shelter_planet.GetName]§!."

 wm_home_system_poi_name: "Tọa Độ Inetian"
 wm_home_system_poi_desc: "Các tọa độ thu hồi được dẫn đến ba địa điểm khai quật trong cùng một hệ sao, mỗi địa điểm từng có vai trò sống còn đối với mạng lưới Thương Đoàn Inetian. Hãy gửi các tàu khoa học đến để khai quật chúng."

# Precursors Event Chain
 cs_inetian_chain_title: "Tiền Nhân - Thương Đoàn Inetian"
 cs_inetian_chain_desc: "Chúng ta đã tìm thấy tàn tích của một hầm trú ẩn cổ đại, thuộc về một nền văn minh từng hưng thịnh hàng triệu năm trước — một nền văn minh không xuất hiện ở bất kỳ nơi nào khác trong hồ sơ của chúng ta, như thể nó đã bị xóa sạch khỏi lịch sử một cách tỉ mỉ. Nếu chúng ta điều tra, có lẽ chúng ta sẽ tìm ra lý do tại sao."

# Arcsite Coordinates A
 site_weathermanipulators_CoordinatesA_Residential_Planet: "Tọa Độ A: Hành Tinh Thuộc Địa"
 site_weathermanipulators_CoordinatesA_Residential_Planet_intro: "Một trong ba tọa độ được tìm thấy trong hầm trú ẩn cổ đại đã dẫn chúng ta đến §Y[From.Planet.GetName]§!, một thế giới thuộc địa từng tràn ngập sự sống. Những tàn tích của các thành phố tráng lệ trải dài ngút tầm mắt, nhưng dường như nó đã bị bỏ hoang từ lâu trước khi bị phá hủy."
 cstorms.140.name: "Thành Phố Hoang Tàn"
 cstorms.140.desc: "Không còn lại gì nhiều từ các thành phố trên §Y[From.Planet.GetName]§!. Bên cạnh sự bào mòn của thời gian, hầu hết các công trình ấn tượng điểm xuyết trên cảnh quan đều đã bị bão tàn phá. Những đặc điểm kiến trúc còn sót lại hoàn toàn nhất quán với những gì nhìn thấy trên §Y[wm_storm_shelter_planet.GetName]§!, cụ thể là sự thiếu hụt rõ rệt trong công tác chuẩn bị ứng phó thảm họa dù có đầy đủ bằng chứng về sự hung bạo của bão. Sự phá hủy triệt để sẽ khiến việc tìm kiếm bất cứ thứ gì hữu ích trở nên khó khăn, nhưng hy vọng là không bất khả thi.\n\nCác [Root.Owner.GetScientistPlural] của chúng ta đã xác định ba điểm đáng chú ý gần bãi đáp: một cấu trúc dịch vụ công cộng tương đối nguyên vẹn, một loại đền thờ nào đó và một quảng trường trung tâm khổng lồ. Những nơi này sẽ cung cấp địa điểm thuận lợi để tiếp tục đào sâu vào bí mật của Thương Đoàn Inetian."
 cstorms.145.name: "Lưu Trữ Thành Phố"
 cstorms.145.desc: "Bên trong tòa nhà hành chính, các ngân hàng dữ liệu vẫn còn nguyên vẹn một phần. Các ghi chép cho thấy một lệnh sơ tán hàng loạt đã được ban bố trên toàn hành tinh khi những cơn bão vũ trụ đầu tiên bắt đầu xuất hiện với tần suất ngày càng tăng.\n\nMột bản hướng dẫn kỹ thuật chi tiết đã được tìm thấy, mô tả cách vận hành của các cỗ máy điều khiển thời tiết cổ xưa."
 cstorms.145.a: "Lật tung nơi này lên để tìm kiếm."
 cstorms.150.name: "Sổ Tay Vận Hành"
 cstorms.150.intro: "Sau cuộc điều tra kỹ lưỡng hơn, rõ ràng là trung tâm thương mại trên §Y[From.Planet.GetName]§! đã bị dọn sạch trơn. Các thiết bị đầu cuối không thể hoạt động, và ngoài hình ảnh bị cháy ăn sâu vào giao diện của mô hình, không còn thông tin giao dịch nào được tìm thấy.\n\nTuy nhiên, một kho lưu trữ nằm khuất trong một góc của đại sảnh chứa những thứ có vẻ là sổ tay hướng dẫn sử dụng. Với các khóa dịch thuật thô sơ được phát triển trong quá trình khai quật của chúng ta trên §Y[wm_storm_shelter_planet.GetName]§!, một bản diễn giải sơ bộ về các hướng dẫn này đã được thực hiện.\n\nCó các hướng dẫn vận hành thiết bị đầu cuối, điều chỉnh mô hình hệ thống và kêu gọi sự trợ giúp từ một cỗ máy có tên là Bộ Giảm Nhiễu Loạn Khu Vực. Các chi tiết về cách vận hành, ngắm bắn và kích hoạt cỗ máy này được nêu rất rõ ràng.\n\nĐây hẳn là thiết bị được nhắc đến trong hầm trú ẩn bão cổ đại, và có thể chính xác là thứ chúng ta đang tìm kiếm."
 cstorms.150.outro: "Giờ đây chúng ta đã hiểu rõ hơn về các nguyên lý hoạt động của những cỗ máy này."
 cstorms.150.desc.a: "$cstorms.150.intro$ Điều này có nghĩa là $cstorms.150.outro$"
 cstorms.150.desc.b: "$cstorms.150.intro$ Sổ tay hướng dẫn đề cập đến một trong những linh kiện mà chúng ta tìm thấy trên §Y[wm_digsite_B.GetName]§!, và cách lắp đặt nó. Điều này có nghĩa là $cstorms.150.outro$"
 cstorms.150.desc.c: "$cstorms.150.intro$ Sổ tay hướng dẫn đề cập đến cỗ máy chúng ta tìm thấy trên §Y[wm_digsite_C.GetName]§!, nhưng chúng ta vẫn còn thiếu một linh kiện then chốt. Dẫu vậy, $cstorms.150.outro$"
 cstorms.150.desc.d: "$cstorms.150.intro$ Sổ tay hướng dẫn đề cập đến cỗ máy chúng ta tìm thấy trên §Y[wm_digsite_C.GetName]§!, và cách lắp đặt bộ phận từ §Y[wm_digsite_B.GetName]§!. Bước cuối cùng chỉ đơn giản là kích hoạt Bộ Giảm Nhiễu Loạn Khu Vực. Khi đó chúng ta cuối cùng có thể khai thác sức mạnh của nó cho riêng mình!"
 cstorms.150.a: "Tiếp tục."

# Arcsite Coordinates B
 site_weathermanipulators_CoordinatesB_Industrial_Planet: "Tọa Độ B: Hành Tinh Công Nghiệp"
 site_weathermanipulators_CoordinatesB_Industrial_Planet_intro: "Một trong ba tọa độ được tìm thấy trong hầm trú ẩn cổ đại đã dẫn chúng ta đến §Y[From.Planet.GetName]§!, một thế giới công nghiệp thuộc đế chế của Thương Đoàn Inetian. Dựa trên kiến trúc hiện có, đây rõ ràng không phải là một hành tinh dân cư. Tuy nhiên, vẫn chưa rõ chính xác sức mạnh công nghiệp của nó nhằm mục đích sản xuất ra thứ gì."
 cstorms.155.name: "Hiệu Suất Công Nghiệp"
 cstorms.155.desc: "Thật khó để nhìn thấy bề mặt của §Y[From.Planet.GetName]§! qua lớp sương khói dày đặc vẫn đang lượn lờ phía trên các nhà máy của nó. Phần lớn bề mặt hành tinh đã bị tàn phá bởi thiệt hại từ bão vũ trụ, để lại những kẽ nứt lớn trên cảnh quan công nghiệp đồng nhất. Một trong số này mang đến cơ hội hạ cánh hoàn hảo cho con tàu của chúng ta.\n\nKhông có dấu hiệu nào cho thấy bất kỳ nỗ lực nào nhằm tháo dỡ các cơ sở sản xuất này. Chúng đơn giản bị bỏ lại phía sau, và nhiều cơ sở vẫn còn chứa vật liệu sản xuất. Việc phân tích điều này có thể cho phép chúng ta hiểu hành tinh này phục vụ mục đích gì trong cơ sở hạ tầng thương mại của nền văn minh cổ đại. Nó cũng có thể cho chúng ta biết nhiều hơn về cỗ máy lừng danh được nhắc đến trên §Y[wm_storm_shelter_planet.GetName]§!."
 cstorms.160.name: "Vận Chuyển Then Chốt"
 cstorms.160.desc: "Phân tích ban đầu về các vật liệu công nghiệp được sử dụng trên §Y[From.Planet.GetName]§! chỉ ra một cấu tạo có tính biến động rất cao. Những sản phẩm này là một phần của một quy trình lớn hơn, và không được sử dụng riêng lẻ. Các chất này cuối cùng được vận chuyển qua một hệ thống băng chuyền hướng tới một kho tập kết trung tâm.\n\nTừ các vết cháy sém xung quanh, rõ ràng kho tập kết này đã được sử dụng liên tục bởi phương tiện vận tải liên hành tinh. Câu hỏi đặt ra là sản phẩm này đã được chuyển đi đâu? Với tính chất dễ nổ của hàng hóa, nó không thể đi quá xa.\n\nGần đó chúng ta phát hiện một vài thùng hàng vận chuyển. Người ta rõ ràng đã rất vất vả để đóng gói an toàn các đồ vật bên trong, vì tàn tích của các nhãn cảnh báo vẫn còn in trên các cạnh. Chỉ có một từ vẫn còn đọc được: \"Then chốt.\""
 cstorms.165.name: "Linh Kiện Bị Mất"
 cstorms.165.intro: "Các [Root.Owner.GetScientistPlural] của chúng ta đã nhanh chóng tháo dỡ các thùng hàng được đóng gói bấp bênh.\n\nKhi mở chiếc thùng đầu tiên, một tiếng xì mạnh báo hiệu sự hiện diện của một buồng bên trong được kiểm soát khí hậu, gây ra sự hoảng loạn nhất thời rằng các vật phẩm bên trong có thể bị mất ổn định. May mắn thay, chúng vẫn không hề hấn gì.\n\nKiểm tra kỹ hơn đã hé lộ một linh kiện máy móc được chế tạo tuyệt mỹ và đặt cẩn thận, bên trong chứa một lượng vật liệu dễ bay hơi do nhà máy sản xuất."
 cstorms.165.outro: "\n\nVì vậy, chúng ta sẽ mang bộ phận này lên tàu để nghiên cứu thêm. Các [Root.Owner.GetScientistPlural] của chúng ta không nên nán lại trên bề mặt khắc nghiệt của §Y[From.Planet.GetName]§! lâu hơn mức cần thiết."
 cstorms.165.desc.a: "$cstorms.165.intro$\n\nNhãn vận chuyển ở mặt trong của thùng hàng đề cập đến một thứ gọi là 'Bộ Giảm Nhiễu Loạn Khu Vực.' Các [Root.Owner.GetScientistPlural] của chúng ta không chắc điều này có nghĩa là gì, nhưng xét đến thùng chứa hạng nặng và các cảnh báo dán dày đặc bên ngoài thùng, nó hẳn là một thứ rất quan trọng.$cstorms.165.outro$" # A & C sites not yet visited
 cstorms.165.desc.b: "$cstorms.165.intro$\n\nBộ phận này trông quen thuộc ngay lập tức, và phi hành đoàn đã lấy cuốn sổ tay tìm thấy trên §Y[wm_digsite_A.GetName]§! ra so sánh. Vật thể được chế tạo phức tạp bên trong thùng hàng là một linh kiện sống còn của Bộ Giảm Nhiễu Loạn Khu Vực.$cstorms.165.outro$" # A site visited & C site not visited
 cstorms.165.desc.c: "$cstorms.165.intro$\n\nHình dạng độc đáo và phần lõi chứa đầy chất lỏng cho thấy đây có thể chính là bộ phận cần thiết để hoàn tất việc lắp đặt trên §Y[wm_digsite_C.GetName]§!. Chất lỏng bên trong hẳn được dùng để cấp năng lượng cho Bộ Giảm Nhiễu Loạn Khu Vực. Tuy nhiên, có vẻ như việc lắp đặt an toàn sẽ đòi hỏi kiến thức chuyên môn đặc thù.$cstorms.165.outro$" # A site not visited & C site visited
 cstorms.165.desc.d: "$cstorms.165.intro$\n\nBộ phận này dường như là mảnh ghép còn thiếu từ Bộ Giảm Nhiễu Loạn Khu Vực trên §Y[wm_digsite_C.GetName]§!. Với cuốn sổ tay tìm thấy trên §Y[wm_digsite_A.GetName]§!, chúng ta sẽ có thể lắp đặt nó đúng cách và có lẽ cuối cùng sẽ kích hoạt được nó.$cstorms.165.outro$" # A & C sites visited
 cstorms.165.a: "Một công việc hoàn thành xuất sắc."

# Arcsite Coordinates C
 site_weathermanipulators_CoordinatesC_Barren_Planet: "Tọa Độ C: Hành Tinh Cằn Cỗi"
 site_weathermanipulators_CoordinatesC_Barren_Planet_intro: "Một trong ba tọa độ được tìm thấy trong hầm trú ẩn cổ đại đã dẫn chúng ta đến §Y[From.Planet.GetName]§!. Bề mặt của nó không có gì ngoài tuyết và bụi, nhưng các bản quét ban đầu cho thấy hành tinh này từng có thể sinh sống được. Liệu nó có quan trọng đối với Thương Đoàn Inetian trước hay sau khi bị hủy hoại?"
 cstorms.170.name: "Bất Tận Và Hung Bạo"
 cstorms.170.desc: "Những trận bão tuyết bất tận càn quét bề mặt của §Y[From.Planet.GetName]§!. Cứ như thể thử thách đó là chưa đủ, cảnh quan phủ đầy tuyết còn che giấu một sự ngạc nhiên kỳ lạ.\n\nTừng lớp từng lớp bụi bặm đang chờ đợi chúng ta bên dưới. Bằng chứng về các dạng sống từng cư ngụ trên thế giới này đã được tìm thấy bên trong. Tất cả đều bị chôn vùi cùng một lúc, gợi ý về một sự kiện đại tuyệt chủng đơn lẻ. Sự sụp đổ của các hệ sinh thái trên §Y[From.Planet.GetName]§! hẳn đã làm loãng bầu khí quyển sau đó, mang đến một kỷ băng hà biến hành tinh thành vùng đất hoang tàn.\n\nNơi này hẳn phải có nhiều điều hơn là sỏi đá và các tảng băng, nhưng rõ ràng là bề mặt sẽ không mang lại thêm câu trả lời nào. Các [Root.Owner.GetScientistPlural] của chúng ta khuyên nên tìm kiếm sâu hơn."
 cstorms.170.a: "Bắt đầu sàng lọc."
 cstorms.171.name: "Cội Nguồn Sự Sống"
 cstorms.171.desc: "Được trang bị đồ bảo hộ và máy móc hạng nặng chống sương giá, các [Root.Owner.GetScientistPlural] của chúng ta đã nhanh chóng hoàn thành quy trình tẻ nhạt nhưng đơn giản là dọn sạch các lớp tuyết và bụi mịn. Chẳng bao lâu, các hoa văn kỳ lạ đã được phát hiện, một loạt các chiến hào lan rộng theo hình dạng giống như rễ cây bao phủ một vùng lãnh thổ rộng lớn.\n\nBên trong những kẽ nứt đó, chúng ta tìm thấy tàn tích khô khốc của đủ loại sinh vật; mọi thứ nó có thể kéo được từ bề mặt hành tinh, từ thảm thực vật đến động vật hoang dã và tất cả những gì tồn tại ở giữa. Bằng cách nào đó, các rãnh này đã nghiền nát các chất hữu cơ bằng cách nghiền vụn chúng giữa các bức tường đá, chiết xuất bất kỳ chất dinh dưỡng hữu ích nào và vận chuyển chúng đến một điểm hội tụ trong một quá trình giống như tiêu hóa. Lớp bụi mà chúng phun ngược trở lại giờ đây bao phủ phần lớn cảnh quan của §Y[From.Planet.GetName]§!.\n\nĐiều này đặt ra câu hỏi về việc những kẽ nứt này đang nuôi dưỡng ai, hoặc cái gì."
 cstorms.171.a: "Tìm ra nguồn gốc."
 cstorms.172.name: "Cỗ Máy Thời Xưa"
 cstorms.172.intro: "Mạng lưới các rãnh ngầm dưới lòng đất thật rộng lớn. Các [Root.Owner.GetScientistPlural] của chúng ta càng đi xa, những máng dẫn này càng tập trung dày đặc. Tất cả chúng đều hội tụ tại một trong những ngọn núi cuối cùng còn sót lại trên §Y[From.Planet.GetName]§!. Ngự trên đỉnh núi là một cao nguyên nhân tạo rõ rệt, với ba cỗ máy lớn đặt cách đều nhau. Những cỗ máy này dường như có nguồn gốc từ Inetian, được đánh dấu bằng ngôn ngữ của họ và nhất quán trong thiết kế với những gì chúng ta biết về xã hội của họ. Bất chấp tuổi đời phi thường và những cơn gió dữ dội quất vào cao nguyên, chúng vẫn ở trong tình trạng tuyệt vời."
 cstorms.172.outro: "\n\nDù sao đi nữa, chúng ta đã tìm thấy thứ mình tìm kiếm. Chúng ta đang đứng trước thềm của một khám phá phi thường."
 cstorms.172.desc.a: "$cstorms.172.intro$ Chúng hẳn là những cỗ máy được nhắc đến trên §Y[wm_storm_shelter_planet.GetName]§!. Thật không may, chúng ta thiếu kiến thức cần thiết để hiểu được hoạt động phức tạp bên trong của các thiết bị này. Không chỉ vậy, bảng điều khiển được phát hiện ở chân một trong những cỗ máy rõ ràng đang thiếu các linh kiện quan trọng. Khắc trên một tấm bảng nhỏ là dòng chữ \"Bộ Giảm Nhiễu Loạn Khu Vực.\"\n\nNếu có thể kích hoạt các cỗ máy, chúng ta cuối cùng có thể khám phá ra mục đích của chúng. Để làm như vậy, chúng ta sẽ cần khám phá các tọa độ còn lại. $cstorms.172.outro$" # A&B not visited
 cstorms.172.desc.b: "$cstorms.172.intro$ \n\nCác sơ đồ mà chúng ta quan sát thấy trong sổ tay hướng dẫn tìm thấy trên §Y[wm_digsite_A.GetName]§! dường như khớp với các thiết bị trước mắt chúng ta, điều đó có nghĩa là đây chính là Bộ Giảm Nhiễu Loạn Khu Vực, và đây là tổ hợp máy móc được nhắc đến trong hầm trú ẩn bão tìm thấy trên §Y[wm_storm_shelter_planet.GetName]§!.\n\nSổ tay hướng dẫn chỉ ra rằng những cỗ máy này cần có một bảng điều khiển để vận hành. Các [Root.Owner.GetScientistPlural] của chúng ta đã phát hiện ra nó ở chân một trong những cỗ máy, nhưng nó dường như thiếu một bộ phận quan trọng. Tuy nhiên, chúng ta còn một tập hợp tọa độ chưa được khám phá, nơi có thể nắm giữ phương tiện để giải quyết tình thế khó khăn này. $cstorms.172.outro$" # A visited & B not visited
 cstorms.172.desc.c: "$cstorms.172.intro$ \n\nĐây hẳn là những cỗ máy được nhắc đến trên §Y[wm_storm_shelter_planet.GetName]§!, được mệnh danh là Bộ Giảm Nhiễu Loạn Khu Vực! Hơn thế nữa, bộ phận máy móc mà chúng ta tìm thấy trên §Y[wm_digsite_B.GetName]§! đã dễ dàng được lắp vào bảng điều khiển ở chân một trong những cỗ máy.\n\nTuy nhiên, bất kỳ nỗ lực sửa chữa sâu hơn nào cũng đều tiềm ẩn rủi ro do tính phức tạp và tuổi đời của các bộ phận cấu thành. Các [Root.Owner.GetScientistPlural] của chúng ta khuyên nên tìm kiếm thêm thông tin trước khi tiến hành. $cstorms.172.outro$" # A not visited & B visited
 cstorms.172.desc.d: "$cstorms.172.intro$ \n\nĐây chắc chắn là những cỗ máy được nhắc đến trên §Y[wm_storm_shelter_planet.GetName]§!, cũng như là chủ đề của cuốn sổ tay từ §Y[wm_digsite_A.GetName]§!, hiện được gọi là Bộ Giảm Nhiễu Loạn Khu Vực. Tất cả những gì còn lại cần làm là lắp đặt bộ phận chúng ta tìm thấy trên §Y[wm_digsite_B.GetName]§! và hy vọng những cỗ máy này vẫn còn hoạt động được. Chỉ khi đó chúng ta mới có thể khám phá ra mục đích thực sự của chúng. $cstorms.172.outro$" # A&B visited
 cstorms.172.a: "Đã đến lúc xem những cỗ máy này có thể làm được gì." # Finished sites A and B
 cstorms.172.b: "Tiếp tục." # Did not finish sites A and B

# Special Project 2
 INETIAN_PROJECTS_02: "Ý Nghĩa Của Cỗ Máy"
 INETIAN_PROJECTS_02_DESC: "Ba tọa độ từ §Y[wm_storm_shelter_planet.GetName]§! đã hoàn thành một câu đố cổ xưa. Tất cả những gì còn lại là kích hoạt Bộ Giảm Nhiễu Loạn Khu Vực. Đã đến lúc khám phá mục đích của chúng."
 cstorms.176.name: "Ý Nghĩa Của Cỗ Máy"
 cstorms.176.desc: "Mảnh ghép cuối cùng của câu đố đã được tìm thấy, các [Root.Owner.GetScientistPlural] của chúng ta bắt tay vào việc. Linh kiện từ §Y[wm_digsite_B.GetName]§! được lắp khớp hoàn hảo vào bảng điều khiển. Cuốn sổ tay từ §Y[wm_digsite_A.GetName]§! được sử dụng để lắp đặt chính xác. Khi việc này hoàn tất, cả ba cỗ máy bùng nổ sức sống.\n\nNhững rung chấn vang dội như sấm sét rũ sạch bụi và tuyết khỏi cao nguyên. Cùng một tiếng nổ lách tách như tia chớp, một [Root.Owner.GetScientist] lập tức bốc hơi, luồng lốc bụi từng là một cơ thể nhanh chóng bị hút vào các rãnh dẫn về phía Bộ Giảm Nhiễu Loạn Khu Vực.\n\nĐây chính là chìa khóa giải thích những gì đã xảy ra trên §Y[wm_digsite_C.GetName]§!: các rãnh dẫn đến đáy máy móc chính là các đường ống nhiên liệu, hút vật chất sinh học từ môi trường xung quanh. Kết quả là một vệt tàn phá quét qua hành tinh.\n\nBộ Giảm Nhiễu Loạn Khu Vực hiện đã hoạt động đầy đủ. Lượng nhiên liệu còn lại vừa đủ cho một lần sử dụng duy nhất. Tất cả những gì còn lại là nhấn một nút bấm."
 cstorms.176.a: "Kích hoạt cỗ máy."
 cstorms.176.b: "Đừng bấm nút đó."

#Delayed Event 1
 cstorms.180.name: "Tàn Tích Tái Khám Phá"
 cstorms.180.desc: "Sau khi hé lộ bí mật của Bộ Giảm Nhiễu Loạn Khu Vực, manh mối về số phận của Thương Đoàn Inetian đã nguội lạnh. Tuy nhiên, việc đánh giá lại toàn diện dữ liệu đã mang lại một số hiểu biết mới.\n\nHồ sơ thương mại từ §Y[wm_digsite_A.GetName]§! chứng minh rằng những người này giữ niềm tin bình đẳng sâu sắc. Kết luận này được củng cố bởi mức sống cao và nhiều cơ sở xa xỉ phong phú vẫn còn lại trên hành tinh; với một mức độ sai biệt nhỏ, mọi công dân đều được hưởng phần tiện nghi và cơ hội ngang nhau, bất kể nghề nghiệp, địa vị xã hội hay dòng dõi.\n\nTrên §Y[wm_digsite_B.GetName]§!, chúng ta tìm thấy các chỉ mục chi tiết hóa trường hợp sử dụng của từng nhà máy. Tất cả chúng đều là một phần của chuỗi sản xuất lớn hơn nhiều, được thiết lập để cung cấp cho đế chế rộng lớn các phương tiện cần thiết nhằm duy trì lối sống xa hoa. Việc phân phối bình đẳng những lợi ích này đòi hỏi lượng tiêu thụ vật liệu và thực phẩm thực sự đáng kinh ngạc, được sản xuất với tốc độ chóng mặt.\n\nBộ Giảm Nhiễu Loạn Khu Vực đã sửa chữa trên §Y[wm_digsite_C.GetName]§! đã cung cấp thêm một số hiểu biết sâu sắc trước khi ngừng hoạt động hoàn toàn. Mặc dù mục đích chính xác của chức năng vẫn là một bí ẩn, một tín hiệu dữ liệu có thể truy vết đã được phục hồi; các cỗ máy không nhắm vào một thực thể chuyển động tự do.\n\nCác [Root.Owner.GetScientistPlural] của chúng ta khuyên nên tìm kiếm các khu vực lân cận để tìm phản hồi phù hợp với tín hiệu này."
 cstorms.180.a: "Bắt đầu cuộc tìm kiếm."

 wm_storm_formation_poi_name: "Nguồn Phát Tín Hiệu"
 wm_storm_formation_poi_desc: "Phân tích của chúng ta đã truy vết nhiễu động tới một thế giới xa xôi. Một tàu khoa học được phái đi khai quật di chỉ có thể sẽ làm sáng tỏ mục tiêu mà Thương Đoàn Inetian đang nhắm tới."

# Digsite 5
 site_weathermanipulators_storm_formation: "Cội Nguồn Sự Lan Tỏa"
 site_weathermanipulators_storm_formation_intro: "Lưu trong bảng điều khiển của Trạm Ép Nhiễu Động Phân Khu là một tín hiệu dữ liệu. Dù đầy thử thách, chúng ta đã nhân bản được mô thức của nó và rà soát khắp ngân hà để tìm đối tượng trùng khớp. Dấu vết dẫn tới một hành tinh không có người sinh sống. Đã đến lúc khám phá xem Thương Đoàn Inetian đang nhắm vào điều gì, và tại sao."
 cstorms.181.name: "Đồng Bằng Mộc Mạc"
 cstorms.181.desc: "Thoạt nhìn, chẳng có gì trên §Y[From.Planet.GetName]§! có vẻ khác thường. Một hành tinh như hàng trăm hành tinh khác rải rác khắp thiên hà. Cũng không có bất kỳ dấu hiệu nào cho thấy tín hiệu chính xác phát ra từ đâu. Không hề thấy máy phát hay mảnh vỡ công nghệ nào đủ mạnh để truyền tín hiệu đi xa hàng hệ sao.\n\nChúng ta vẫn tiếp tục tìm kiếm."
 cstorms.182.name: "Đỉnh Núi Hoang Tàn"
 cstorms.182.desc: "Sau khi đến bề mặt, chúng ta sớm phát hiện ra rằng tín hiệu trở nên mạnh hơn hoặc yếu hơn tùy thuộc vào vị trí của chúng ta. Men theo quy luật đơn giản này, cuối cùng chúng ta được dẫn đến một dãy núi cao chót vót ở phía bên kia của hành tinh.\n\nKhi chúng ta tiếp cận những ngọn núi sừng sững, cảnh quan ngày càng trở nên hoang tàn, cằn cỗi, đổ nát, như thể một thế lực tàn khốc đã xé toạc phần thế giới này. Dựa trên mô thức hủy hoại, chúng ta tin rằng nơi này vào một thời điểm nào đó đã bị tàn phá bởi một cơn bão bụi vũ trụ. Tuy nhiên, nếu điều đó là đúng, thì theo logic toàn bộ hành tinh phải bị ảnh hưởng. Chưa bao giờ chúng ta chứng kiến sự hủy diệt tập trung như vậy từ một cơn bão tố. Để tìm hiểu thêm, cần phải leo lên những đỉnh núi đồ sộ này."
 cstorms.183.name: "Năng Lượng Thoáng Qua"
 cstorms.183.desc: "Dãy núi hoang tàn bao gồm nhiều đỉnh núi và thung lũng, nhưng một miệng hố có hình thù kỳ dị đã sớm thu hút sự chú ý của chúng ta. Vách hố nhẵn thín, và tại trung tâm có một loạt vòng tròn đồng tâm được khắc vào lòng đất.\n\nKhi chúng ta hạ độ cao xuống lòng chảo, một lực hút đầy uy lực bắt đầu kéo chúng ta lại gần, không thể cưỡng lại và rõ ràng phát ra từ tâm điểm của vòng tròn. Những dải năng lượng chập chờn bốc lên từ các vòng tròn, vài dải bay xa đến mức thoát khỏi bầu khí quyển hành tinh. Đây chính là nguồn phát của tín hiệu.\n\nCác [Root.Owner.GetScientistPlural] của chúng ta đề xuất phân tích miệng hố cùng những biến động năng lượng của nó để hiểu rõ hơn những gì đã xảy ra tại đây."
 cstorms.184.name: "Cơn Bão Nhỏ Bé"
 cstorms.184.desc: "Dựa trên dữ liệu môi trường và các mô phỏng chi tiết, chúng ta có thể kết luận chắc chắn rằng thực sự có một cơn bão bụi thiên hà đã di chuyển qua những đỉnh núi này. Trên thực tế, nó đã hình thành ngay tại vị trí này! Còn về lý do tại sao nó không nuốt chửng toàn bộ hành tinh trong quá trình đó, dự đoán tốt nhất của chúng ta là nó quá nhỏ — phân tích mô tả một cơn bão chỉ bằng một phần nhỏ kích thước của một cơn giông bão trung bình.\n\nDựa trên thực tế là Thương Đoàn Inetian gọi Bộ Giảm Nhiễu Loạn Khu Vực là 'một thiết bị thao túng', và tín hiệu năng lượng của cơn bão cụ thể này được lưu trữ trong ngân hàng dữ liệu của họ, có vẻ như họ đã cố gắng kiểm soát cơn bão vũ trụ. Bằng cách tính toán lộ trình mà nó đã đi sau khi rời khỏi nơi này, chúng ta có thể học hỏi được nhiều điều có lợi."
 cstorms.184.a: "Tính toán lộ trình."

# Special Project 3
 INETIAN_PROJECTS_03: "Lần Theo Lộ Trình Của Bão"
 INETIAN_PROJECTS_03_DESC: "Chúng ta đã tìm thấy điểm hình thành của một cơn bão bụi thiên hà cổ đại, nhưng bằng chứng cho thấy nó hẳn phải nhỏ hơn nhiều so với một nhiễu loạn điển hình. Xét đến quy mô của nó, thật kỳ lạ khi Thương Đoàn Inetian cảm thấy cần phải kiểm soát cơn bão bằng Bộ Giảm Nhiễu Loạn Khu Vực của họ.\n\nNếu chúng ta lần theo lộ trình của cơn bão, chúng ta có thể khám phá ra lý do tại sao họ đầu tư nhiều thời gian vào dự án này."
 cstorms.186.name: "Gia Tăng Cường Độ"
 cstorms.186.desc: "Việc lần theo lộ trình của cơn bão bụi thiên hà hóa ra ít đơn giản hơn dự tính. Chỉ cách điểm khởi nguồn vài hệ sao, một điều gì đó dữ dội đã xảy ra với cường độ, quy mô và đường đi của nó. Các [Root.Owner.GetScientistPlural] của chúng ta nghi ngờ rằng chính tại thời điểm này, cơn bão đã bị tấn công bởi Bộ Giảm Nhiễu Loạn Khu Vực. Nó làm cơn bão mất thăng bằng, và làm ô nhiễm vòng xoáy bên trong của nó bằng tàn tích nghiền vụn của động vật hoang dã bị cuốn lên từ bề mặt của §Y[wm_digsite_C.GetName]§!.\n\nKhi cơn bão tiếp tục trôi dạt khắp thiên hà, nó đã nhấn chìm nhiều hệ sao, mang lại những hậu quả tàn khốc.\n\nTất cả những nỗ lực làm chệch hướng cơn nhiễu loạn nhỏ bé này dường như là để giữ nó tránh xa một hệ sao cụ thể... nơi cảm biến phát hiện một trạm không gian bị bỏ hoang. Thương Đoàn Inetian đã sẵn sàng gây ra nhiều cuộc đại tuyệt chủng chỉ để bảo vệ địa điểm này.\n\nTrạm không gian có thể không phải là hệ sao thủ đô mà chúng ta mong đợi, nhưng chắc chắn nó phải quan trọng không kém mới xứng đáng với các biện pháp bảo vệ tốn kém đến vậy."
 cstorms.186.a: "Một kết cục đầy bí ẩn."

 wm_last_shelter_poi_name: "Trạm Không Gian Bị Bỏ Rơi"
 wm_last_shelter_poi_desc: "Dấu vết của tín hiệu kết thúc tại một trạm bị bỏ hoang mà Thương Đoàn Inetian đã chấp nhận hủy hoại nhiều thứ để bảo vệ. Một tàu nghiên cứu được cử đi khai quật địa điểm có thể tiết lộ lý do."

# Digsite 6
 site_weathermanipulators_last_shelter: "Trước Khi Sụp Đổ"
 site_weathermanipulators_last_shelter_intro: "Thương Đoàn Inetian đã cố gắng bảo vệ một trạm không gian bên trong hệ sao này khỏi một cơn bão bụi thiên hà nhỏ. Như một hậu quả khôn lường, cơn bão đã phát triển quá lớn khiến nhiều hệ sao khác của họ bị phá hủy. Tại sao họ lại tuyệt vọng bảo vệ cơ sở này đến vậy?"
 cstorms.190.name: "Lối Vào Nguyên Vẹn"
 cstorms.190.desc: "Trạm không gian quay quanh [From.Planet.GetName] lớn hơn nhiều so với dự tính ban đầu. Nơi này dường như không chỉ là một trạm thông thường, mà còn sở hữu các thiết bị nghiên cứu cùng hệ thống duy trì sự sống tinh vi và các cảm biến không gian sâu tầm xa. Điều này có thể cho thấy cơ sở từng được sử dụng như một thuộc địa định cư lâu dài hơn là một trạm trung chuyển nhỏ.\n\nTuy nhiên, hiện trạng của nó vô cùng ảm đạm. Thân tàu đã bị thủng, sự giảm áp thảm khốc đã thổi bay toàn bộ các phân khu. Vẫn chưa rõ thiệt hại là do tác động từ bên ngoài hay phát sinh từ bên trong. May mắn thay, hệ thống kiểm soát quỹ đạo và ổn định trục vẫn còn hoạt động, giải thích vì sao cấu trúc này không bị trôi dạt vào ngôi sao hoặc rơi vào vòng xoay không thể kiểm soát.\n\nViệc tiếp cận bên trong mà không làm mất đi sự cân bằng mong manh được duy trì tỉ mỉ này sẽ rất khó khăn."
 cstorms.191.name: "Nơi Trú Ẩn Cuối Cùng"
 cstorms.191.desc: "Để xâm nhập vào trạm trong hệ sao [This.System.GetName], cần phải cạy mở một cửa khoang kín khí còn nguyên vẹn mà không gây ra thêm các vụ nổ sập nào. Bên trong trạm vẫn duy trì áp suất, mô phỏng thành công bầu khí quyển hành tinh điển hình dù đã trải qua tuổi đời đáng kinh ngạc.\n\nPhải mất nhiều ngày để tạo ra một mối nối kín hoàn hảo giữa tàu của chúng ta và trạm, cân bằng tỉ mỉ áp suất khí quyển. Cuối cùng, chúng ta cũng mở được cánh cửa một cách an toàn. Đáng tiếc thay, chúng ta lập tức vấp phải một chướng ngại vật khác: một hành lang bị tắc nghẽn, kẹt cứng bởi các dầm đỡ bị vặn xoắn và gạch đá vụn từ vụ giảm áp gần đó. Sẽ mất một thời gian trước khi chúng ta có thể tiến sâu hơn."
 cstorms.192.name: "Lời Thú Tội Muộn Màng"
 cstorms.192.desc: "Khoang điều khiển trung tâm là một đài tưởng niệm bi tráng. Hàng nghìn cư dân Inetian đã an nghỉ cùng nhau tại đây trong sự thanh thản, được hỗ trợ bởi các hệ thống y tế tự động đưa họ vào giấc ngủ vĩnh hằng khi nguồn lực cạn kiệt.\n\nTại trung tâm căn phòng, một thiết bị kỳ lạ đang tỏa ra ánh sáng ấm áp, được bảo vệ cẩn thận."
 cstorms.193.name: "Món Quà Tạm Biệt"
 cstorms.193.desc: "Vật phẩm mà các công dân này gọi là tải trọng nằm ở chính giữa căn phòng. Ngoại quan nguyên sơ của thiết bị độc đáo này khiến nó trông như thể chưa từng được kích hoạt. Nó hoàn toàn thuộc về người Inetian, nhưng tiên tiến hơn bất cứ thứ gì chúng ta từng thấy trước đây.\n\nCác thiết bị đầu cuối ở hai bên thiết bị hiển thị cùng một đoạn văn bản lặp đi lặp lại. Bản dịch nhanh chóng được hoàn thành:\n\n§LGửi Người Khách Quý, nếu bạn đang đọc văn bản này, thì bạn là nhân chứng cho sự kiêu ngạo của chúng tôi. Trong sự theo đuổi bình đẳng cao cả của mình, chúng tôi đã quên đi thế cân bằng thực sự: sáng tạo và hủy diệt.\n\nĐể bảo vệ các tuyến thương mại khỏi sự tàn phá của bão vũ trụ, chúng tôi đã can thiệp vào tự nhiên. Những nhiễu loạn nhỏ bé từng có đã vượt khỏi tầm kiểm soát. Bão vũ trụ đã quét qua nhiều hành tinh của chúng tôi. Đây không phải là sự trùng hợp ngẫu nhiên, mà là một sự trả thù. Giờ đây chúng tôi tự giam mình trong trạm không gian này, đây là phòng tuyến cuối cùng, bởi vì làm bất cứ điều gì cũng đã quá muộn. Dù chúng tôi không bao giờ sử dụng bộ giảm nhiễu loạn nữa, những cơn bão mới vẫn tiếp tục hình thành, mạnh hơn và hung dữ hơn trước. Nhiệm vụ cuối cùng của chúng tôi rất rõ ràng.\n\nChúng tôi đã không mệt mỏi chế tạo cỗ máy này, và nó được chế tạo cho bạn, hỡi Người Khách Quý. Nó sẽ cứu bạn khỏi các cơn bão vũ trụ mà không làm chúng tức giận thêm. Sự diệt vong của chúng tôi là sự xá tội cho chúng tôi, nó không nhất thiết phải là của bạn.§!\n\nBên trong căn phòng này, Thương Đoàn Inetian đã tự định đoạt số phận của mình. Sự hào phóng của họ cũng vĩ đại như sự bất cẩn của họ vậy. Rời khỏi trạm, chúng ta trở về cùng món quà chia tay của họ."
 cstorms.193.a: "Hãy để họ an nghỉ."
 cstorms.193.b: "Một kết cục thích đáng cho những kẻ dại dột."

# Artifact action
 artifact_inetian_research: "Bí Mật Của Thương Đoàn Inetian"
 artifact_inetian_research_desc: "Đào sâu hơn vào các bí mật của Thương Đoàn Inetian."
 artifact_inetian_research_completed: "$artifact_inetian_research$"
 artifact_inetian_research_completed_desc: "Chúng ta đã đưa tri thức cổ xưa của Thương Đoàn Inetian vào sử dụng cho mục đích của riêng mình."

 INETIAN_PROJECTS_04: "Đào Sâu Vào Bí Mật Của Thương Đoàn Inetian"
 INETIAN_PROJECTS_04_DESC: "Sau khi phát hiện nơi an nghỉ cuối cùng của Thương Đoàn Inetian, vẫn còn nhiều điều để tìm hiểu về đế chế rộng lớn của họ. Chúng ta muốn điều tra họ thêm một lần nữa."
 cstorms.195.name: "Đào Sâu Vào Bí Mật Của Thương Đoàn Inetian"
 cstorms.195.desc: "Nơi an nghỉ cuối cùng của Thương Đoàn Inetian hóa ra là một trạm không gian công nghệ rất cao. Họ đã xây dựng nó như một nơi trú ẩn chống lại những cơn bão vũ trụ khủng khiếp mà chính họ đã tạo ra. Môi trường sống độc đáo này là đỉnh cao thực sự của công nghệ Inetian, tự hào với hệ thống bảo vệ và kiểm soát khả năng sinh sống đáng kinh ngạc. Nhưng ngay cả điều đó cũng không thể cứu họ vô thời hạn.\n\nDo đó, mặc dù trạm không còn an toàn để sinh sống sau hàng niên kỷ suy tàn, các [Root.Owner.GetScientistPlural] của chúng ta đã có thể trích xuất một kho tàng kiến thức từ hệ thống của nó. Không chỉ vậy, họ còn tìm thấy các tuyến thương mại quan trọng nhất của Thương Đoàn Inetian được lưu trữ trên một ngân hàng dữ liệu, cùng những nguyên mẫu tinh xảo của các cỗ máy kiểm soát khí hậu hiệu quả hơn, ít tàn phá hành tinh hơn nằm trên bàn làm việc.\n\nDường như ít nhất một phần sự kiên trì của Thương Đoàn Inetian đã chiến thắng, và nó sẽ tiếp tục giúp chúng ta vượt qua những cơn bão này."

 secrets_of_the_inetian_traders: "Bí Mật Của Thương Đoàn Inetian"
 secrets_of_the_inetian_traders_hive_mach: "Bí Mật Của Thương Đoàn Inetian"
 secrets_of_the_inetian_traders_desc: "Một lần nữa kiến thức cổ xưa của Thương Đoàn Inetian đã giúp ích cho mục đích của chúng ta. Giờ đây chúng ta được giảm phí thị trường nhờ tầm ảnh hưởng của họ."
 secrets_of_the_inetian_traders_hive_mach_desc: "Một lần nữa dữ liệu được lưu giữ từ Thương Đoàn Inetian đã giúp ích cho tập thể. Việc giảm phí thị trường hiện đã có hiệu lực."

#Hyperlane Detailer - Secrets Of Inetian Traders Reward
 sm_hyperlane_detailer: "Bộ Chi Tiết Siêu Không Gian"
 sm_hyperlane_detailer_desc: "Các làn siêu không gian khác xa với những dòng chảy êm đềm hoàn hảo, mà đúng hơn là một mớ hỗn độn các dòng chảy siêu pha mà những người hoa tiêu lành nghề có thể tận dụng.\n"

 NAME_inetian: "Thương Đoàn Inetian"
###########################################
# The adAkkaria Convention of Benevolence #
###########################################

 cs_adAkkaria_chain_title: "Tiền Nhân - adAkkaria"
 cs_adAkkaria_chain_desc: "Để hiểu được số phận của nền văn minh kỳ lạ và cổ xưa này, chúng ta phải lần theo một chuỗi các manh mối. Bất kể chúng có thể dẫn đến đâu."

# Anomaly: Ancient Signals
 STORMS_PREC_ONE: "Tín Hiệu Cổ Đại"
 STORMS_PREC_ONE_DESC: "Chúng ta đã thu được một loạt tín hiệu điện tử kỳ lạ bên trong hệ sao này. Dữ liệu sơ bộ cho thấy những buổi phát sóng này có thể đã hàng nghìn năm tuổi. Phi hành đoàn của chúng ta rất muốn tìm ra nguồn gốc của chúng."
 cstorms.205.name: "Tín Hiệu Của Lòng Nhân Từ"
 cstorms.205.desc: "Các tín hiệu kỳ lạ chúng ta phát hiện trong hệ sao này bắt nguồn từ một trạm liên lạc cổ đại quay quanh [FromFrom.GetName]. Các thông điệp dường như là những chương trình phát sóng cũ từ một nền văn minh bị lãng quên.\n\nDo đó, các [Root.Owner.GetScientistPlural] của chúng ta gặp một số khó khăn trong việc giải mã chúng. Họ đề xuất lên trạm để giao tiếp trực tiếp với máy chủ truyền phát."

# Digsite: The Propaganda Station
 site_adakkaria_the_propaganda_station: "Trạm Tuyên Truyền"
 site_adakkaria_the_propaganda_station_intro: "Trạm liên lạc cổ đại này vẫn còn hoạt động. Bằng cách đổ bộ lên địa điểm và kết nối trực tiếp với hệ thống của nó, chúng ta có thể giải mã các chương trình phát sóng trước đây của nó."
 cstorms.215.name: "Giao Diện Đến Quá Khứ"
 cstorms.215.desc: "Việc đổ bộ lên trạm hầu như không gặp trở ngại nào, mặc dù việc di chuyển bên trong cấu trúc khá khó khăn. Mặc dù nó được bảo tồn tốt đến kinh ngạc, một phần nhờ vào thành phần tiên tiến của lớp khiên ngoài, nhưng các hành lang hẹp và trần nhà thấp là một thử thách đối với đội ngũ của chúng ta.\n\nNội thất của tiền đồn cung cấp rất ít manh mối về bản chất của những chủ nhân trước đây, ngoại trừ những tấm hỗn hợp giấy-nhựa lớn trang trí trên tường. Những tấm áp phích này mô tả hình ảnh cách điệu của các cá thể thuộc một loài hữu cơ chưa xác định. Diện mạo của họ rất đáng chú ý, đứng cao lớn và kiên định trước bối cảnh chinh phục và ăn mừng. Hình ảnh trực quan rõ ràng được thiết kế để khơi gợi một cảm giác tự hào và gắn kết gia tộc nhất định.\n\nBản thân máy chủ truyền phát cũng là một bí ẩn không kém. Ban đầu các [Root.Owner.GetEngineerPlural] của chúng ta tin rằng nó mang bản chất tương tự (analogue), giống như những gì chúng ta từng thấy ở [Root.Owner.GetPreFTLLowerPlural]. Tuy nhiên, bên dưới các nút bấm và mặt số là sự sắp xếp phức tạp của các mạch điện tử, được làm từ những hợp kim mà chúng ta chưa từng biết đến. Các [Root.Owner.GetScientistPlural] của chúng ta nghi ngờ nền văn minh này có thể đã bỏ qua vài bước phát triển trong khoa học máy tính, điều này giải thích cho sự pha trộn công nghệ lệch niên đại này.\n\nDẫu vậy, sau một loạt các lần thử nghiệm và sửa lỗi, các [Root.Owner.GetLinguists] của chúng ta đã xoay xở giải mã được bản phát sóng đầu tiên trong số rất nhiều bản phát sóng được ghi lại."
 cstorms.220.name: "Bản Tin Đầu Tiên"
 cstorms.220.desc: "Sau khi kết nối thành công với máy chủ truyền tin cổ đại, các [Root.Owner.GetLinguists] của chúng ta đã cung cấp bản ghi chép của buổi phát sóng đầu tiên:\n\n§LNgười dân của Công Ước adAkkaria!\n\nTa nói với các bạn không phải với tư cách của một nhà lãnh đạo, mà như một người bạn và một người dẫn đường.\n\nChắc hẳn mọi người đều nhận thấy những ngày tháng đang dần tăm tối và bầu trời trở nên cay nghiệt. Ngay cả các vì sao cũng lộ rõ vẻ thù địch.\n\nNhưng ta có niềm tin. Như các Ân Chủ đã đặt niềm tin vào chúng ta, ta tin vào mục đích của chúng ta. Ta tin vào các bạn.\n\nSuốt nhiều thế kỷ, nhân dân ta đã che chở các vì sao khỏi những đám tàn quân man di tồi tệ nhất. Định mệnh của chúng ta là cứu rỗi ngân hà khỏi các thế lực hiểm ác này. Và định mệnh không bao giờ bị hủy hoại chỉ vì một lần vấp ngã. Chúng ta sẽ không bị khuất phục bởi những quân đoàn tà ác đang mưu đồ chống lại chúng ta.\n\nTa tin vào sứ mệnh của chúng ta. Công Ước Nhân Từ adAkkaria mang lại chân lý và tự do cho mọi nền văn minh. Chính sứ mệnh gìn giữ chúng ta. Chính định mệnh cho phép chúng ta khải hoàn và thịnh vượng!\n\nVà vì vậy, những người bạn của ta, đừng đầu hàng trước nỗi hoài nghi. Hãy tiếc thương những mất mát, phải. Hãy vinh danh những người ngã xuống. Rồi sau đó hãy cùng nhau sát cánh như chúng ta vẫn hằng làm. Vì các Ân Chủ của chúng ta. Vì Công Ước adAkkaria. Vì Sự Nhân Từ!§!"
 cstorms.225.name: "Tiếng Nói Của Sự Bất Đồng"
 cstorms.225.desc: "Việc rà soát khối dữ liệu phát hiện trên trạm cổ xưa hóa ra là một nhiệm vụ nan giải đối với các [Root.Owner.GetLinguists] của chúng ta. Tuy nhiên, một số bản phát sóng đã được đánh dấu là chứa nhiều thông tin đặc biệt, mang đến cái nhìn thoáng qua về các cuộc đối thoại được ghi âm:\n\n§SilSapne Tuerthi - Phát Ngôn Viên§!\n§L - - và để thảo luận về sự can thiệp gần đây từ Cộng Đồng Toàn Vũ Trụ (UniCom), xin giới thiệu Giáo Sư Tối Cao akMani Sando và Tiến Sĩ Mọi Tồn Tại Hữu Hình emEk Inna. Thưa Giáo Sư Tối Cao, Ngài kiến giải thế nào về các yêu sách của UniCom?§!\n\n§SakMani Sando - Giáo Sư Tối Cao§!\n§LNhững yêu sách đó thật quá quắt! Cộng Đồng Toàn Vũ Trụ tiếp tục đối xử với các thế giới kém văn minh bằng thái độ khinh miệt tột cùng. Nhưng hãy để tôi hỏi những kẻ tự xưng là người giám hộ đạo đức thiên hà này: chẳng phải việc giữ lại các công nghệ cứu sinh mới là phi đạo đức hơn sao? Giữ lại những lý tưởng làm nền tảng cho xã hội khải hoàn của chúng ta? Chúng ta sẽ đê hèn đến mức nào nếu để mặc một thế giới lao nhanh đến bờ vực diệt vong mà không dang tay cứu vớt?§!\n\n§SilSapne Tuerthi - Phát Ngôn Viên§!\n§LToàn những luận điểm xuất sắc! Thưa Tiến Sĩ Mọi Tồn Tại Hữu Hình, tôi đoán Ngài hẳn cũng phẫn nộ không kém trước việc UniCom can thiệp vào định mệnh của chúng ta.§!\n\n§SemEkku Inna - Tiến Sĩ Mọi Tồn Tại Hữu Hình§!\n§LNhững gì tôi sắp nói có thể làm bạn sốc. Bất chấp sự ngoan cố của tổ chức đó, tôi nghĩ chúng ta nên nỗ lực tìm hiểu những quan ngại của UniC-§!\n\n§TCó vẻ như buổi phát sóng đã bị cắt ngang tại điểm này.§!"
 cstorms.225.a: "Lần theo tọa độ này."
 cstorms.225.a.hive: "Quá nhiều tiếng nói chỉ dẫn đến hỗn loạn."
 cstorms.225.a.machine: "Các sinh thể hữu cơ ưa tranh cãi sâu sắc."
 cstorms.230.name: "Tàn Dư Của Cuộc Chinh Phục"
 cstorms.230.desc: "Bản phát sóng cuối cùng ghi lại thời khắc trạm bị bỏ hoang. Giọng nói của phát thanh viên run rẩy trong sự kinh hoàng khi âm thanh của còi báo động vang vọng ở phía sau:\n\n§LHọ đang đến... Không phải hạm đội của quân nổi dậy, mà là chính cơn bão! Nó đang nuốt chửng các vì sao! Cầu xin Lòng Nhân Từ tha thứ cho chúng ta...§!\n\nSau đó chỉ còn lại tiếng rè nhiễu sóng tĩnh điện kéo dài. Chúng ta đã thu thập được tọa độ của thế giới thuộc địa được đề cập, mở ra bước tiếp theo trong hành trình tìm kiếm sự thật về adAkkaria."
 cstorms.230.a: "Chuẩn bị thám hiểm hành tinh đó."
 cstorms.230.b: "Toàn chuyện nhảm nhí vô ích!"
 cstorms.230.b.hive: "Một hình thức giải trí mang tính cá nhân kỳ lạ."
 cstorms.230.b.machine: "Sinh thể hữu cơ và những tấn kịch của chúng."
 dramatic_enthusiasm: "Tín Đồ Kịch Nghệ Ngoại Tộc"
 melodramatic_much: "Kẻ Bài Trừ Kịch Ngoại Tộc"
 cstorms.235.name: "Bản Tin Cũ"
 cstorms.235.desc: "Các [Root.Owner.GetLinguists] của chúng ta cũng đã dịch được một vài mẩu tin tức. Họ tin rằng buổi phát sóng cụ thể này rất đáng chú ý:\n\n§LCác báo cáo gửi về từ hệ sao Haliios vẽ nên một viễn cảnh ngày càng tồi tệ. Chính quyền Solphani hèn hạ đã phục kích Lực Lượng Khai Sáng dũng cảm của chúng ta tại Địa Điểm enYpsal! Dẫu vậy, Ban Lãnh Đạo Tối Cao tuyên bố rằng Tiến Trình sẽ không bị gián đoạn. Trích nguyên văn: 'Các Ân Chủ đã không từ bỏ chúng ta. Và chúng ta cũng sẽ không bỏ lại bất kỳ nền văn minh kém phát triển nào phía sau'.\n\nCác tin đồn cũng rộ lên về sự hợp tác có thể có giữa chính quyền man tộc tà ác và các đại diện của UniCom. Tuy nhiên, đại sứ của UniCom phủ nhận việc cộng đồng liên sao từng liên lạc với bất kỳ kẻ áp bức man rợ nào, và tuyên bố đây chỉ là một trường hợp khác của 'chứng hoang tưởng vụ lợi' từ Ban Lãnh Đạo Tối Cao của chúng ta.\n\nNhưng dù có hay không có những đồng minh hùng mạnh, Tiến Trình Khai Sáng Solphani đang trong tình trạng nguy cấp. Sẽ không dễ để xoay chuyển cục diện này, nhưng-§!\n\n§TĐáng tiếc thay, phần còn lại của bản phát sóng đã bị hư hỏng quá nặng để có thể giải mã. Các [Root.Owner.GetEngineerPlural] của chúng ta đã tạo một bản sao lưu cơ sở dữ liệu. Theo thời gian, chúng ta hy vọng sẽ phục hồi được thêm nhiều thông tin từ nền văn minh đã bị quên lãng từ lâu này.§!"
 cstorms.235.a: "Chúng ta sẽ chờ đợi những phát hiện tiếp theo của các bạn."

# Event: A Site Barren and Bare
 cstorms.245.name: "Di Chỉ Trơ Trọi Hoang Vu"
 cstorms.245.desc: "Sự càn quét của một cơn bão vũ trụ trong hệ sao [planet_windswept_fates.System.GetName] đã làm lộ ra một di chỉ khảo cổ đầy tiềm năng trên [planet_windswept_fates.GetName].\n\nCác bản quét sơ bộ đối với §Y[planet_windswept_fates.GetName]§! cho thấy một bầu khí quyển bất ổn khốc liệt, nơi những cơn bão hành tinh khổng lồ thống trị cảnh quan. Các [Root.Owner.GetScientistPlural] của chúng ta chưa từng nghĩ tới tàn tích của một nền văn minh lại có thể tồn tại trên một thế giới như thế này, và tin rằng chúng ta có thể học hỏi được rất nhiều từ cuộc điều tra."
 cstorms.245.a: "Chuẩn bị một đội đổ bộ!"

# Digsite: Windswept Fates
 site_adakarria_windswept_fates: "Số Phận Theo Gió Cuốn"
 site_adakarria_windswept_fates_intro: "Dù bão vũ trụ tàn khốc đến nhường nào, cơn bão này lại phơi bày bằng chứng về một nền văn minh ngoài hành tinh. Mặc cho bầu khí quyển của hành tinh cực kỳ bất ổn, một đội đổ bộ có thể sẽ vén màn số phận kinh hoàng đã giáng xuống nền văn hóa cổ xưa này."
 cstorms.2105.name: "Lớp Cát Lắng Đọng"
 cstorms.2105.desc: "Đội ngũ của chúng ta đã đáp xuống an toàn trên [From.Planet.GetName] và nhanh chóng bắt tay vào việc khảo sát khu vực xung quanh.\n\nTheo quan sát, cơn bão vũ trụ dữ dội gần đây tràn qua hệ sao này đã làm xáo trộn nghiêm trọng sự cân bằng khí quyển, tạo ra những trận cuồng phong xé toạc các vùng đất hoang vu.\n\nTuy nhiên, chính lực lượng hủy diệt này đã thổi bay lớp bụi phủ khỏi địa điểm này, làm lộ ra một số công trình sụp đổ bên dưới. Các bản quét sơ bộ cho thấy chúng có nguồn gốc từ adAkkaria và đã bị chôn vùi hàng ngàn năm trước.\n\nCác [Root.Owner.GetScientistPlural] của chúng ta yêu cầu thiết bị khai quật hạng nặng để khai mở di chỉ."
 cstorms.2105.a: "Tiếp tục."
 cstorms.2110.name: "Những Gì Đã Mất"
 cstorms.2110.desc: "Bất chấp điều kiện thời tiết kỳ lạ gây khó khăn cho hành tinh này, các [Root.Owner.GetScientistPlural] của chúng ta đã đạt được những bước tiến lớn. Nhưng mỗi ngày trôi qua, những khám phá của họ lại càng trở nên khó hiểu và đáng lo ngại hơn.\n\nMọi chuyện bắt đầu với tàn tích của các tác phẩm điêu khắc bằng đá và vật liệu hữu cơ bị than hóa. Sau đó là vải rách, đồ da, áo giáp phủ polymer, và cuối cùng là hài cốt hữu cơ của những cư dân trước đây của hành tinh.\n\nHết thi thể này đến thi thể khác được phát hiện, các cơ quan nội tạng khô quắt của họ chứa đầy cát và móng tay bị mòn vẹt do cào cấu đấu tranh. Mỗi tử thi đều được trang bị quân trang hạng nặng của [Root.Owner.GetPreFTLLowerPlural] và vũ trang bằng vũ khí phóng đạn. Thứ mà chúng ta từng nghĩ là một thành phố bị bỏ hoang thực chất là một ngôi mộ tập thể khổng lồ.\n\nCó khả năng những mẫu vật này đã tồn tại qua hàng kỷ, nhưng do hoàn toàn cách ly với bức xạ cực tím và các hóa chất phản ứng, cả hài cốt hữu cơ và trang bị đều được bảo quản tỉ mỉ. Điều gì đã xảy ra với họ ở đây vẫn chưa được biết."
 cstorms.2110.a: "Thật là một cách chết tàn nhẫn."
 cstorms.2115.name: "Bạo Lực Từ Trên Cao"
 cstorms.2115.desc: "Những phát hiện trên [From.Planet.GetName] tiếp tục gây bất an. [Root.GetLeaderName] tin rằng địa điểm này khó có thể là một nghĩa trang, vì những người ngoài hành tinh này dường như ở trong tình trạng thể chất tốt cho đến khi họ bị cát làm ngạt thở.\n\nHơn thế nữa, chúng ta cũng đã phát hiện một số bệ lắp đặt vũ khí có khả năng bắn đạn pháo hạng nặng. Đáng ngạc nhiên là chúng không nhắm vào bề mặt, mà thay vào đó lại nhắm vào độ sâu của chính không gian.\n\nBất kể kẻ thù mà những người này phải đối mặt là gì, rất có thể chúng đến từ các vì sao."
 cstorms.2120.name: "Cơn Bão Vĩnh Cửu"
 cstorms.2120.desc: "Các giả thuyết của chúng ta liên quan đến ngôi mộ tập thể kỳ lạ tìm thấy trên [From.Planet.GetName] đã không dẫn đến kết luận hữu ích nào. Manh mối duy nhất còn lại liên quan đến nguồn gốc của bãi cát đã nuốt chửng toàn bộ đội quân này.\n\nSau khi thực hiện một loạt các tính toán và mô phỏng vô cùng phức tạp, chúng ta đã xác định rằng chính cơn bão mang cát đến đây vẫn tiếp tục hoành hành ở những nơi khác trên hành tinh. Một lực lượng thám hiểm nhỏ đã được cử đi khám phá.\n\nMột cơn giông bão bạo liệt đã chào đón họ, những cơn gió tàn bạo của nó đã khoét sâu một hốc lớn dưới lòng đất. Nếu có bất kỳ câu trả lời nào được tìm thấy ở đây, chắc chắn chúng nằm trong vực thẳm này, ngay nơi mắt bão tìm thấy ngôi nhà của nó."
 cstorms.2120.a: "Thực hiện mọi biện pháp phòng ngừa cần thiết!"
 cstorms.2125.name: "Hài Cốt"
 cstorms.2125.desc: "Việc điều hướng đến địa điểm rất khó khăn, và đòi hỏi kỹ năng cùng sự chú ý tột bậc. Tuy nhiên, ở trung tâm của miệng hố và giữa cơn bão cuồng nộ, chúng ta đã phát hiện ra một bộ xương vô cùng bất thường. Hài cốt này cũng cổ xưa như những hài cốt trong ngôi mộ tập thể, mặc dù cả kiểu hình và kiểu gen của cơ thể hoàn toàn khác biệt so với những xác chết chúng ta tìm thấy ở đó.\n\nBộ đồng phục của bộ xương được bảo quản tốt đến kinh ngạc, và nó cũng cho thấy những khác biệt đáng kể trong thiết kế. Ngoài ra còn có những dấu hiệu cho thấy một số phần chi đã bị cố tình cắt bỏ...\n\nNhưng tò mò nhất là các chỉ số từ cảm biến của chúng ta: chúng ta phát hiện sự biến động năng lượng xung quanh cơ thể và từ bên trong. Những chữ ký năng lượng này mang một sự tương đồng đáng kinh ngạc với những chữ ký bên trong cơn bão khổng lồ này, cũng như với cơn bão vũ trụ ban đầu đã làm lộ ra ngôi mộ tập thể.\n\nMột giả thuyết bắt đầu hình thành: Liệu cá nhân này có mối liên hệ với những cơn bão mà chúng ta bắt gặp từ trước đến nay? Liệu họ thậm chí có thể phải chịu trách nhiệm cho việc chôn vùi cả đội quân? Thật kỳ quặc khi nghĩ đến điều đó, nhưng sự thật đang dẫn chúng ta theo hướng này."
 cstorms.2130.name: "Và Trở Về Với Bụi Cát"
 cstorms.2130.desc: "Việc đối chiếu các biểu tượng trên bộ đồng phục với cơ sở dữ liệu của chúng ta đã tạo ra một kết quả đáng kinh ngạc: thi thể thuộc về một công dân của Công Ước adAkkaria! Chính là nền văn minh có trạm phát sóng mà chúng ta đã khám phá cách đây không lâu. Để làm chúng ta ngạc nhiên hơn nữa, bộ đồng phục, tuổi của thi thể và thông tin từ các buổi phát sóng đã vẽ nên một bức tranh gắn kết đáng ngạc nhiên. Giờ đây chúng ta tin rằng đây chính là thế giới được nhắc đến trong các chương trình phát sóng đó.\n\nVới kiến thức ngôn ngữ từ Trạm Tuyên Truyền trong tay, [Root.GetLeaderName] đã giải mã được tên của nạn nhân: §ShaToor Gailon§!.\n\nChỉ khoảnh khắc sau đó, cơn bão xung quanh nhanh chóng gia tăng quy mô và cường độ. Do tính chất cực kỳ khó đoán của thời tiết, việc ở lại đã trở nên quá nguy hiểm, và chúng ta buộc phải từ bỏ thế giới này cho cơn lốc xoáy ma trận. Manh mối về Công Ước adAkkaria lại một lần nữa nguội lạnh."

#Storm to Signal
 cstorms.2140.name: "Từ Bão Đến Tín Hiệu"
 cstorms.2140.desc: "Chữ ký năng lượng của thi thể người ngoài hành tinh và cơn lốc xoáy hủy diệt hành tinh trên §Y[planet_windswept_fates.GetName]§! khớp với chữ ký của cơn bão vũ trụ chịu trách nhiệm khai quật đội quân bị chôn vùi. Nhật ký quét đã tiết lộ một hệ sao từng được khám phá trước đây có chứa những dao động tương ứng. Những điều này giống hệt với các buổi phát sóng của Công Ước adAkkaria!\n\nMột tàu thám hiểm nên được cử đi để điều tra."

# Fleets of the Trice Damned
 site_adakkaria_fleets_of_the_thrice_damned: "Hạm Đội Bị Nguyền Rủa Ba Lần"
 site_adakkaria_fleets_of_the_thrice_damned_intro: "Những biến động năng lượng kỳ lạ trong khu vực này đã che khuất một nghĩa địa hải quân khổng lồ. Nghĩa địa bằng polymer và kim loại này có thể chứa đựng một manh mối sống còn để hiểu được số phận của Công Ước adAkkaria."
 cstorms.2150.name: "Nghĩa Địa Tàu Chiến"
 cstorms.2150.desc: "Hàng trăm xác tàu chiến trôi dạt trong sự im lặng chết chóc, tạo thành một vành đai phế liệu khổng lồ xung quanh ngôi sao. Các con tàu thuộc về nhiều thiết kế và niên đại khác nhau, nhưng tất cả đều mang dấu vết của sự tàn phá khủng khiếp.\n\nThân tàu bị vặn xoắn và xé toạc không phải bởi hỏa lực năng lượng hay đạn động năng, mà bởi những lực thủy triều hấp dẫn cực hạn — như thể chúng đã bị vướng vào một cơn bão trọng lực tàn bạo."
 cstorms.2155.name: "Nhật Ký Chiến Hạm"
 cstorms.2155.desc: "Các [Root.Owner.GetEngineerPlural] của chúng ta đã cẩn thận phục hồi các ngân hàng dữ liệu từ những con tàu trong nghĩa địa. Dẫu phần lớn đã bị thời gian tàn phá, một cơ sở dữ liệu của adAkkaria vẫn còn nguyên vẹn:\n\n§L- Chúng tôi bị phục kích. Xin nhắc lại, chúng tôi bị phục kích. UniCom yêu cầu chúng tôi ngừng khai sáng người Nguyên Thủy Rokukora nếu không sẽ bị tiêu diệt. Làm ơn, hãy phản hồi! Nếu không rút lui, chúng tôi sẽ bị xóa sổ! Làm ơn, ít nhất hãy gửi viện binh!\n\n- Từ chối. Sự hy sinh của các người sẽ được ghi nhận.§!"
 cstorms.2155.a: "Quả là \"không bỏ lại bất kỳ ai phía sau\" thật đấy."
 cstorms.2160.name: "Hài Cốt Của Thuyền Trưởng"
 cstorms.2160.desc: "Khi các [Root.Owner.GetLinguists] của chúng ta dịch âm những bản phát sóng mới, chúng ta đã có thêm một phát hiện kinh ngạc khác: một thi thể đóng băng đang trôi nổi giữa trung tâm bãi tha ma!\n\nDù phần lớn thi hài đã khô teo, trang phục vẫn cho thấy người này từng là một sĩ quan của Công Ước.\n\nKỳ lạ thay, một vành đai mảnh vỡ nhỏ đang quay quanh thi thể, như thể nó tác động một lực hấp dẫn nào đó lên những vật thể này. Hài cốt đã được đưa lên tàu để tiến hành phân tích sâu hơn."
 cstorms.2165.name: "Bí Ẩn Sâu Thêm"
 cstorms.2165.desc.intro: "Bản dịch thẻ tên của thi thể đóng băng cho thấy người này là một thành viên adAkkaria mang tên §SalAtta Landeer§!. Tương tự như thi thể tìm thấy tại [planet_windswept_fates.GetName], một vài chi của người này đã bị cắt bỏ bằng phẫu thuật trước khi chết. Tuy nhiên, trong trường hợp này, cơ thể cũng bị bỏng nặng. Đặc biệt là phần thân trên có dấu hiệu tổn thương do nhiệt độ cực cao, cùng dấu vết của một quá trình hồi phục chậm chạp và chắc chắn đầy đau đớn.\n\n[Root.Owner.GetScientist] của chúng ta đi đến kết luận đáng tiếc rằng những vết thương này có điểm tương đồng đáng lo ngại với các phương pháp tra khảo thông tin của [Root.Owner.GetPreFTLLowerPlural]. Phải chăng đây là một cựu chiến binh, hay điều gì đó tàn độc hơn đã giáng xuống ông ta?"
 cstorms.2165.desc.def: "$cstorms.2165.desc.intro$\n\nNgay khi chúng ta vừa xác định được bản chất của những vết thương này, các thiết bị đo trên tàu bỗng trải qua một đợt tăng áp đột ngột, dữ dội và [Root.GetLeaderName] bắt đầu thét lên.\n\nRất lâu sau đó, [Leader.GetHeShe] mới miêu tả lại trải nghiệm đó như một luồng ánh sáng thiêu đốt chói lòa, kéo theo một làn sóng đau đớn tột cùng. Cảm giác như có thứ gì đó đang cố xé toạc tâm trí của [Leader.GetHerHis]... từ trong ra ngoài."
 cstorms.2165.desc.psio: "$cstorms.2165.desc.intro$\n\nNgay khi chúng ta vừa xác định được bản chất của những vết thương này, các thiết bị trên tàu bỗng trải qua một đợt tăng áp đột ngột, dữ dội và các phi hành đoàn có năng khiếu tâm linh của chúng ta bắt đầu la hét.\n\nRất lâu sau đó, họ báo cáo về một khoảnh khắc thấu suốt tột độ, theo sau là từng đợt giận dữ sôi trào, xé rách tâm can. [Root.GetLeaderName] khẳng định rằng ẩn sâu dưới cơn thịnh nộ là nỗi kinh hoàng tột cùng và cảm giác bị phản bội sâu sắc. Một ý niệm duy nhất lóe lên: §LHọ đã triệu hồi ta!§!"
 cstorms.2165.desc.psio_robot: "$cstorms.2165.desc.intro$\n\nNgay khi chúng ta vừa xác định được bản chất của những vết thương này, các thiết bị trên tàu bỗng trải qua một đợt tăng áp đột ngột, dữ dội và đơn vị được trang bị của chúng ta gặp phải hiện tượng xung năng lượng nội bộ.\n\nRất lâu sau đó, họ báo cáo về khoảnh khắc mà bộ xử lý tâm linh ghi nhận là cơn giận dữ tột cùng. [Root.GetLeaderName] khẳng định phản ứng cảm xúc đó đi kèm với một ý niệm duy nhất, được ghi lại là: §LHọ đã triệu hồi ta!§!"
 cstorms.2165.desc.gestalt: "$cstorms.2165.desc.intro$\n\nSau phát hiện này, ngân hàng dữ liệu của phi hành đoàn chúng ta đã bị làm sai lệch bởi một lực lượng không thể truy vết. Một số [controller.GetIndividualNamePlural] nhớ lại đã trải qua một đợt xung năng lượng ngắn ngủi nhưng làm tê liệt hệ thống, trong khi những kẻ khác bị phơi nhiễm trước những hình ảnh hỗn loạn và rời rạc, khiến bộ điều biến giọng nói phát ra âm thanh chói tai vượt quá 120 decibel."
 cstorms.2165.a: "Lên đường đến Viện Ái Quốc."
 cstorms.2170.name: "Di Sản Của Landeer"
 cstorms.2170.desc.def: "Vừa mới tái lập liên lạc với tàu khoa học §Y[Root.GetFleetName]§!, chúng ta đã phải nghe những tiếng thét xé lòng từ phi hành đoàn của tàu. Rất lâu sau đó, khi sự bình tĩnh tương đối được lặp lại, nguồn cơn của sự hỗn loạn mới được hé lộ: chính là thi thể người ngoài hành tinh mà họ đã mang lên tàu.\n\nBản thân thi thể đó dường như đang tác động một thứ quyền năng kỳ lạ lên tâm trí họ. Các vật thể nhỏ bay lên không trung và bắt đầu quay quanh xác chết. Nhiều đoạn vách ngăn bên trong bị vặn vẹo và nứt toác dưới áp lực khủng khiếp.\n\n§Y[Root.GetLeaderName]§! đã kịp thời tỉnh lại từ trạng thái bất động mê man để tống khứ thi thể ra khỏi tàu. Và chính phản xạ nhanh nhạy của [Leader.GetHerHis] cũng đã giúp tàu khoa học thoát khỏi một cơn bão vũ trụ bất ngờ bùng phát. Nếu [Leader.GetHeShe] không làm vậy, nghĩa địa vũ trụ hẳn đã đón nhận thêm một con tàu mới.\n\nKhi [Root.GetLeaderName] kể lại trải nghiệm của [Leader.GetHerHis], [Leader.GetHeShe] còn lưu ý thêm một điều khác: bất kể nguồn gốc quyền năng kỳ lạ của thi thể là gì, nó cũng khiến một mô thức rất đặc thù xuất hiện trên màn hình chỉ huy của con tàu. Đây là một nỗ lực giao tiếp? Một tiếng thét từ cõi chết?\n\nHiện tại, chúng ta chưa có câu trả lời."
 cstorms.2170.desc.gestalt: "Những hình ảnh hỗn loạn làm hư hại một số [controller.GetIndividualNamePlural] thám hiểm của chúng ta đã được giải mã. Chúng tạo thành hình ảnh của một môi trường sống cổ đại. [controller.GetScientistCapital] bị ám ảnh bởi hình ảnh và âm thanh của một cá nhân đang phải chịu đựng sự đối xử ngày càng tàn độc. Cơ thể người đó bị thiêu đốt, các cơ quan nội tạng bị nung chín.\n\nMột vài [controller.GetIndividualNamePlural] đã kịp thoát khỏi cuộc tấn công thị giác - thính giác này. Họ cho biết một số vật thể nhỏ bắt đầu bay lơ lửng trên quỹ đạo sát thi thể. Hài cốt hữu cơ bằng cách nào đó đã tự phát triển một trường hấp dẫn của riêng mình.\n\nLực lượng bí ẩn này ngày càng mạnh lên cho đến khi các đoạn vách ngăn bên trong bị vặn vẹo và xé rách bởi áp lực. Đúng lúc đó, hệ thống an toàn của chúng ta tái kích hoạt, và thi thể đã bị phóng trả lại không gian.\n\nNgay sau đó, một cơn bão vũ trụ bùng nổ trong hệ sao. Tàu của chúng ta chỉ vừa kịp thoát ra ngoài nguyên vẹn.\n\nBất kể điều gì đã diễn ra ở đó, nó đã để lại nhiều câu hỏi hơn là câu trả lời."

# Special Project: Assembling the Past
 cstorms.2180.name: "Tàn Dư Hy Vọng"
 cstorms.2180.desc: "Sau trải nghiệm của [FromFrom.Leader.GetName] tại hệ sao §Y[planet_assembling_the_past.System.GetName]§!, các nhà khoa học của chúng ta càng thêm quyết tâm khám phá những gì chính xác đã xảy ra với Công Ước adAkkaria. Dữ liệu thu thập được trong quá trình thám hiểm [planet_windswept_fates.GetName] và bãi tha ma hạm đội cho thấy thiên hà từng rải rác những trạm tuyên truyền của adAkkaria.\n\nHơn thế nữa, sau hàng loạt cuộc thảo luận kéo dài, họ cũng nghi ngờ rằng mô thức quan sát được trong sự cố chập mạch của [Root.GetName] chính là một tập hợp chỉ dẫn phương hướng tới một hệ sao chưa từng được phát hiện trước đây!\n\nMột dự án đặc biệt đã được thiết lập để điều tra hệ sao mới này."
 project_adakkaria_tracing_history: "Viện Ái Quốc Vì Lòng Nhân Từ Tối Cao"
 project_adakkaria_tracing_history_DESC: "Tọa độ chỉ tới một hành tinh trong hệ sao [planet_assembling_the_past.System.GetName]. Một tàu thám hiểm nên được phái đi để điều tra hành tinh này có thể có mối liên hệ gì với Công Ước adAkkaria."

 NAME_adSalivul: "adSalivul"
 NAME_Patriotic_Institute_of_Exalted_Benevolence: "Viện Ái Quốc Vì Lòng Nhân Từ Tối Cao"

 cstorms.2185.name: "Viện Ái Quốc Vì Lòng Nhân Từ Tối Cao"
 cstorms.2185.desc: "Ban đầu chúng ta e sợ rằng cuộc điều tra vào hệ sao [From.solar_system.GetName] đã đi vào ngõ cụt. Các chỉ dẫn hướng tới một hành tinh đang phải gánh chịu những từ trường bất ổn nghiêm trọng đến mức cảnh quan của nó gần như bị san phẳng. Khó có khả năng bất cứ thứ gì có giá trị lại có thể tồn tại sau một cuộc tàn phá như vậy.\n\nTuy nhiên, quay quanh hành tinh lại là một môi trường sống cổ đại mang những nét kiến trúc tương đồng với trạm phát thanh adAkkaria. Dù đã bị khóa kín hoàn toàn từ bên ngoài, chúng ta vẫn có thể tạo ra một tín hiệu mở cửa dựa trên thông tin phục hồi từ cơ sở dữ liệu của adAkkaria.\n\nĐã qua hàng vạn kỷ kể từ lần cuối có ai đó đặt chân lên trạm này. Không thể biết điều gì đang chờ đón bên trong."
 cstorms.2185.a: "Lục soát môi trường sống."

# The Patriotic Institute of Exalted Benevolence
 site_adakkaria_the_patriotic_institute: "Viện Ái Quốc Vì Lòng Nhân Từ Tối Cao"
 site_adakkaria_the_patriotic_institute_intro: "Bản phát sóng lúc lâm chung của §SalAtta Landeer§! đã dẫn lối chúng ta tới đây, một môi trường sống cổ đại quay quanh một thế giới chết. Việc tiến vào thành phố đòi hỏi sự cẩn trọng, nhưng chúng ta không thể do dự. Những bí ẩn của Công Ước adAkkaria đang chờ được khai mở."
 cstorms.2200.name: "Cánh Cổng Bị Phong Tỏa"
 cstorms.2200.desc: "Viện Ái Quốc được xây dựng sâu bên trong lòng một tiểu hành tinh giàu kim loại, được bảo vệ bởi các hệ thống phòng thủ tự động và các bãi mìn dày đặc. Sau khi vô hiệu hóa các mối đe dọa, đội khảo sát của chúng ta đã tìm thấy lối vào chính của cơ sở.\n\nCác cánh cửa áp suất khổng lồ mang biểu tượng của Công Ước, nhưng bên dưới là những dòng chữ cảnh báo nghiêm ngặt về ô nhiễm tâm linh và sinh học."
 cstorms.2205.name: "Phòng Thí Nghiệm Đen Tối"
 cstorms.2205.desc.intro: "Phải mất nhiều ngày để băng qua và lập chỉ mục cho thành phố trên trạm, đồng thời tìm ra thiết bị giám sát của nó. Trạm an ninh hóa ra lại bị ngăn cách hoàn toàn khỏi phần còn lại của môi trường sống, đòi hỏi một mã truy cập hoàn toàn khác biệt.\n\nTại đây chúng ta tìm thấy vô số hàng màn hình vẫn còn kết nối với hệ thống đại giám sát. Những màn hình còn hoạt động hiển thị mọi ngóc ngách của trạm, song chúng cũng bị ảnh hưởng bởi các sự cố chập điện."
 cstorms.2205.desc.mach: "$cstorms.2205.desc.intro$\n\nCác drone của chúng ta báo cáo mối lo ngại khi chứng kiến những xáo trộn này, vì nó gợi nhắc chúng về cuộc chạm trán trước đó với Công Ước adAkkaria tại nghĩa địa hải quân cổ đại.\n\n$cstorms.2205.desc.outro$"
 cstorms.2205.desc.def: "$cstorms.2205.desc.intro$\n\n[Root.GetLeaderName] báo cáo cảm thấy bồn chồn khi chứng kiến những xáo trộn này, vì nó gợi nhắc [Leader.GetHerHim] về cuộc chạm trán trước đó của chúng ta với Công Ước adAkkaria tại nghĩa địa hải quân.\n\n$cstorms.2205.desc.outro$"
 cstorms.2205.desc.outro: "Nhưng đáng lo ngại nhất là việc chúng ta phát hiện ra trung tâm an ninh: theo các thông báo báo động hiển thị trên màn hình, môi trường sống này từng được cài đặt chế độ tự hủy!\n\nCác [Root.Owner.GetEngineerPlural] của chúng ta phỏng đoán rằng bất kỳ sự cố nào đang quấy nhiễu thành phố đã ngăn lệnh tự hủy được thực thi. Chúng ta nhanh chóng vô hiệu hóa quy trình tự hủy và giao cho các [Root.Owner.GetLinguists] nhiệm vụ giải mã bất kỳ nhật ký nào có thể thu hồi được tại đây. Thật kỳ lạ, các báo cáo của trạm đã chấm dứt gần một năm trước khi những ghi chép cuối cùng thu được từ Trạm Tuyên Truyền xuất hiện."
 cstorms.2210.name: "Danh Sách Thí Nghiệm"
 cstorms.2210.desc: "Các [Root.Owner.GetLinguists] của chúng ta không mất nhiều thời gian để khám phá ra mục đích của môi trường sống quay quanh [From.Planet.GetName]: nhật ký và tin nhắn từ cả người dân lẫn nhân viên đều mô tả các cuộc điều tra về năng lực tâm linh mới xuất hiện của các công dân adAkkaria. Mọi người sống ở đây đều nhận được lời mời từ 'Ban Lãnh Đạo Tối Cao' của Công Ước để tận hưởng một cuộc sống xa hoa và tự do thể hiện bản thân trên môi trường sống. Đổi lại, họ đồng ý tham gia vào các thí nghiệm đang diễn ra của trạm.\n\nPhần lớn công dân đều hào hứng tham gia chương trình. Nhật ký an ninh cho thấy nhiều người là cựu chiến binh tàn tật. Họ được hứa hẹn chăm sóc y tế, hỗ trợ tài chính và ân xá cho bất kỳ vấn đề pháp lý tồn đọng nào có thể mắc phải.\n\nHơn thế nữa, danh sách nhân sự của trạm có một cái tên rất quen thuộc: §SalAtta Landeer§!, một nhà khoa học kiêm cựu chiến binh thương tật, người mà thi thể bị cắt cụt đã được chúng ta thu hồi tại nghĩa địa hải quân."
 cstorms.2210.a: "Cuối cùng cũng có tiến triển."
 cstorms.2215.name: "Lời Từ Các Đối Tượng"
 cstorms.2215.desc: "Chúng ta đã giải mã được một trong những bức thông điệp cuối cùng được gửi đi từ môi trường sống:\n\n§gThông điệp - Ngày 02100363 - Người gửi: §SsiDani Itempeer§! - Người nhận: siZul Itempeer§!\n§LChào anh! Em vẫn còn sống! Xin lỗi vì sự chậm trễ. Kể từ khi... môi trường sống hoạt động kỳ lạ nên việc gửi tin nhắn rất khó khăn. Họ nói việc đó không liên quan gì đến chuyện kia, nhưng chúng em nghĩ rốt cuộc anh ấy có thiên phú tâm linh. Còn về phần em, em đã nói với anh là em không thực sự tiến bộ được gì, với tất cả những lần trước... Vì vậy họ đề nghị thử một cái gì đó triệt để hơn: ... các cơn bão vũ trụ. Em biết anh đang nghĩ gì, nhưng nó chỉ là một ngón tay thôi và có lẽ nó thậm chí sẽ mọc lại. Nhưng những cảm giác mà em đã mở khóa khi... !\nYêu thương, siDani\n- TRUYỀN PHÁT§! §YĐÃ KIỂM DUYỆT ( Có thắc mắc? Hãy hỏi giám sát viên của bạn )§!\n\n§gThông điệp - Ngày 02100365 - Người gửi: §ShaToor Gailon§! - Người nhận: aeDal Asduur§!§L\naeDal thân mến,\nCuộc sống đối xử với tôi rất tốt. Tôi đã gặp một vài cựu chiến binh khác. Chúng tôi không nói chuyện. Nhưng tất cả chúng tôi đều hiểu. Thật tuyệt khi không phải nói chuyện.\nHôm nay tôi chỉ cần nghĩ đến việc nhấc một chiếc cốc lên, và nó đã làm được. Tôi vẫn nhớ phần chi bên phải của mình, nhưng có lẽ cuộc sống mới này sẽ không tồi tệ như tôi từng sợ. Tôi nghe họ nói về việc gửi tôi đến... Rõ ràng tôi là một thần đồng tâm linh... Tôi... muốn được triển khai nhiệm vụ một lần nữa.\nTôi hy vọng sẽ về nhà vào Ngày Ái Quốc. Hãy gặp nhau nhé.\nThân ái, haToor\n- TRUYỀN PHÁT§! §YĐÃ KIỂM DUYỆT ( Có thắc mắc? Hãy hỏi giám sát viên của bạn )§!\n\n§gThông điệp - Ngày 02100367 - Người gửi: §SenRida Direen§! - Người nhận: onRida Direen§!\n§LE TÔI ĐÃ DẬP TẮT LỬA BẰNG TÂM TRÍ CỦA MÌNH RỒI!!!!\nMột trong những đối tượng khác đã trở nên cuồng loạn vì lý do nào đó và gây ra hỏa hoạn trong nhà ăn. Mọi người đều hoảng loạn nhưng chúng tôi không thể đi đâu được! Tôi cũng SIÊU sợ hãi nhưng rồi có điều gì đó xảy ra bên trong tôi và tôi chỉ việc làm cho nó biến mất!\nTÔI ĐÃ CỨU MỌI NGƯỜI!! Hãy nói với các trưởng lão rằng tôi không hoàn toàn là một kẻ vô vọng, được chứ!\n- TRUYỀN PHÁT§! §RĐÃ CHẶN ( HÃY BÁO CÁO VỚI GIÁM SÁT VIÊN CỦA BẠN NGAY LẬP TỨC )§!\n\nĐáng chú ý là bức điện thứ hai: thi thể của §ShaToor Gailon§! đã được phát hiện trong chuyến thám hiểm khảo cổ của chúng ta trên thế giới của [Root.Owner.GetPreFTLLowerPlural]."
 cstorms.2215.a: "Làm việc xuất sắc!"
 cstorms.2220.name: "Hậu Quả Lỗi Hệ Thống"
 cstorms.2220.desc: "Những tin nhắn này có niên đại vài ngày trước cuộc sơ tán môi trường sống:\n\n§gTin nhắn - Ngày 02100359 - Người gửi: Tiến Sĩ Tối Cao - Người nhận: Đô Đốc Đáng Kính§!\n§LTin nhắn gần đây của ngài đã gây ra một số lo ngại tại đây. Ngài có thể vui lòng giải thích lý do tại sao sau khi đã hỗ trợ chúng tôi suốt ngần ấy năm mà không hề phàn nàn, ngài lại đột ngột đe dọa đóng cửa chúng tôi?\n- TRUYỀN PHÁT§! §GĐÃ GỬI§!\n\n§gTin nhắn - Ngày 02100360 - Người gửi: Đô Đốc Đáng Kính - Người nhận: Tiến Sĩ Tối Cao§!\n§LÔng đang đùa tôi đấy à. Suốt nhiều tháng qua chúng tôi đã gửi cho ông hàng loạt cảnh báo, nhưng tôi đoán việc quay quanh một thế giới thất thường hẳn đã gây ra chứng mất trí nhớ rất tiện lợi. Ông nhận thức rõ rằng UniCom đang đe dọa sự tồn vong của chúng ta, đúng chứ? Và khi cuộc chiến này đang leo thang, tôi không thể tiếp tục biện minh cho việc tiêu tốn nguồn lực cắt cổ chỉ để các đối tượng của ông ngồi nhìn gia súc cả ngày. Tôi cần những kết quả hữu hình, có thể áp dụng được. NGAY BÂY GIỜ.\n- TRUYỀN PHÁT§! §GĐÃ NHẬN§!\n\n§gTin nhắn - Ngày 02100360 - Người gửi: Tiến Sĩ Tối Cao - Người nhận: Đô Đốc Đáng Kính§!\n§LXin thứ lỗi cho chúng tôi, chúng tôi chưa từng nhận được các tin nhắn trước đó của ngài. Trạm của chúng tôi liên tục bị quấy nhiễu bởi các sự cố kỹ thuật, và điều đó hẳn đã ảnh hưởng đến các buổi truyền phát của chúng tôi. Dù thế nào đi nữa, chúng tôi cần thêm thời gian. Chúng tôi có các quy trình và giao thức sẵn có, chúng tôi không thể cứ thế từ bỏ chúng!\n- TRUYỀN PHÁT§! §GĐÃ GỬI§!\n\n§gTin nhắn - Ngày 02100361 - Người gửi: Đô Đốc Đáng Kính - Người nhận: Tiến Sĩ Tối Cao§!\n§LÔng có một tuần, nếu không chúng tôi sẽ tiến hành đóng cửa ngay lập tức. Không nếu, không nhưng, không có cơ hội thứ hai, KẾT QUẢ!\n- TRUYỀN PHÁT§! §GĐÃ NHẬN§!\n\n§gTin nhắn - Ngày 02100368 - Người gửi: Tiến Sĩ Tối Cao - Người nhận: Đô Đốc Đáng Kính§!\n§LĐính kèm theo đây ngài sẽ tìm thấy bản báo cáo về những thành tựu gần đây của chúng tôi. Những đoạn phim này chứng minh rằng các cơn bão vũ trụ có thể bị tác động bởi các đối tượng sở hữu thiên phú tâm linh của chúng tôi. Điều này có thể đem lại các ứng dụng quân sự kinh ngạc. Nếu có đủ thời gian, chúng tôi có thể tăng cường biểu hiện tâm linh của họ mà không cần phải đặt họ vào những tổn thương thể xác và tinh thần.\n- TRUYỀN PHÁT§! §RTHẤT BẠI (Nguyên nhân: Ma Trận Truyền Phát Bị Hư Hại)§!"
 cstorms.2220.a: "Tin nhắn cuối cùng đó chưa bao giờ được gửi đi."
 cstorms.2225.name: "Số Phận Chưa Trọn Vẹn"
 cstorms.2225.desc: "Đây là tin nhắn cuối cùng được phục hồi:§L\n\nKính gửi các đồng nghiệp,\n\nTôi gửi lời tới các bạn với một trái tim trĩu nặng. Bộ Chỉ Huy Tối Cao đã quyết định chấm dứt mọi hoạt động bên trong Viện Ái Quốc Vì Lòng Nhân Từ Tối Cao.\n\nĐiều này không nên được xem là sự phán xét dành cho các bạn hay công việc của chúng ta tại đây. Được phụng sự cùng từng người trong số các bạn là một niềm vinh hạnh to lớn. Tôi biết các bạn sẽ có nhiều thắc mắc, nhưng nói tóm lại, kỳ vọng của Bộ Chỉ Huy Tối Cao đã không còn đồng nhất với các mục tiêu nghiên cứu của chúng ta.\n\nVề phần các công dân của chúng ta, Bộ Chỉ Huy Tối Cao đã mời họ tham gia chương trình tại $building_adakkaria_patriotic_institute$ trên adSul. Các bạn sẽ tìm thấy danh sách nhân sự đầy đủ được đính kèm bên dưới. Xin vui lòng thông báo cho các đối tượng đóng gói đồ đạc của họ. Các tàu con thoi sẽ khởi hành vào sáng mai.\n\nChúc các bạn mọi điều tốt đẹp nhất.\n\nTiến Sĩ Tối Cao của Lòng Nhân Từ Tối Cao, akSilba Kandar§!"
 cstorms.2225.a: "Hồ sơ ghi chép đã chấm dứt sau sự kiện này."

# Special Project: Eye of the Convention / The Void Calls
 cstorms.2240.name: "Tâm Điểm Công Ước"
 cstorms.2240.desc: "Tọa độ đã hé lộ một hệ sao từng bị che giấu khỏi các máy quét của chúng ta. Đã đến lúc ghé thăm Công Ước adAkkaria - trước khi có ai khác làm điều đó.\n\nMột dự án đặc biệt mới đã được ban bố."
 cstorms.2245.name: "Hư Không Vẫy Gọi"
 cstorms.2245.desc: "Chỉ vài khoảnh khắc sau khi rời khỏi môi trường sống, [event_target:leader_patriotic_institute.GetName] đã đưa ra một quyết định đột ngột và đáng kinh ngạc. Như thể bị điều khiển bởi một thế lực bên ngoài, [event_target:leader_patriotic_institute.GetHeShe] đã ra lệnh cho con tàu mở một kênh liên lạc trên tần số thường gắn liền với các hiện tượng tâm linh diện rộng hoặc sự quét qua của một cơn bão vũ trụ mong manh.\n\nKênh liên lạc được hướng thẳng tới cùng tọa độ với hệ sao quê nhà của Công Ước adAkkaria. Chỉ mất một khoảnh khắc ngắn ngủi để tín hiệu gọi của chúng ta được phản hồi."
 cstorms.2245.desc.gestalt: "Khoảnh khắc sau khi rời khỏi môi trường sống, ý thức tập thể của chúng ta bị quấy rầy bởi một rung động bất thường, như thể có thứ gì đó đang cố gắng giao tiếp với chúng ta qua một khoảng cách bao la. Tín hiệu bắt nguồn từ cùng tọa độ với hệ sao quê nhà của Công Ước adAkkaria, tồn tại trên một tần số thường liên quan đến các sự kiện tâm linh diện rộng hoặc sự lướt qua của một cơn bão vũ trụ mong manh.\n\nTín hiệu phản hồi của chúng ta ngay lập tức nhận được hồi đáp."
 cstorms.2250.name: "Bão Tố Vẫy Gọi"
 cstorms.2250.desc: "Chúng ta đã làm mọi cách có thể, nhưng việc tiếp cận adSul hóa ra lại là một thử thách lớn hơn nhiều so với dự tính. Toàn bộ hệ sao đang bị nhấn chìm bởi một cơn bão vũ trụ có thành phần chưa xác định, khiến chúng ta không thể tiếp cận gần hơn tới hành tinh.\n\nCòn về cơn bão, nó dường như đang... truyền tín hiệu gọi chúng ta?"

# The Storm
 cstorms.2260.name: "Cơn Bão"
 cstorms.2260.desc: "HÃY GỌI TÊN CHÚNG TA\n\nHÃY GỌI TÊN CHÚNG TA\n\nHÃY | GỌI | TÊN | CHÚNG TA"
 cstorms.2260.a: "Các bạn là ai?"
 cstorms.2260.b: "Chuyện gì đã xảy ra ở đây?"
 cstorms.2260.c: "Tên sao?"
 cstorms.2260.a.resp: "TỒN TẠI | KHÔNG TỒN TẠI | PHI TỒN TẠI\n\nGIÔNG TỐ CUỒNG NỘ VÀ PHẪN NỘ GẦM VANG\n\nĐAU ĐỚN VÀ THỊNH NỘ VÀ ĐAU THƯƠNG VÀ SỢ HÃI\n\nHÃY GỌI TÊN CHÚNG TA"
 cstorms.2260.b.resp: "KÍCH ĐỘNG | GỢI LÊN | TRIỆU HỒI\n\nHÃY GỌI TÊN CHÚNG TA"
 cstorms.2265.name: "$cstorms.2260.name$"
 cstorms.2265.desc: "CHÚNG TA KHÔNG THỂ SUY NGHĨ | NÓI | ƯỚC NGUYỆN | MƠ MỘNG\n\nTÊN CỦA CHÚNG TA TRIỆU HỒI CHÚNG TA | TRẢ LẠI CHÚNG TA BẢN THỂ | CHÚNG TA BỊ LÃNG QUÊN\n\nHÃY GỌI TÊN CHÚNG TA"
 cstorms.2265.c.resp: "$cstorms.2265.desc$"
 cstorms.2265.d: "Chúng ta có thể tìm thấy tên của các bạn ở đâu?"
 cstorms.2265.e: "Hãy cho chúng ta thấy lễ kỷ niệm này."
 cstorms.2270.name: "$cstorms.2260.name$"
 cstorms.2270.desc: "ĐÓ LÀ MỘT LỄ KỶ NIỆM\n\nNÓ LÀ LỄ KỶ NIỆM\n\nĐAU ĐỚN | THỊNH NỘ | ĐAU THƯƠNG | SỢ HÃI\n\nLỄ KỶ NIỆM\n\nHÃY GỌI TÊN CHÚNG TA"

 NAME_adSul: "adSul"

 project_adakkaria_benevolent_grounds: "Vùng Đất Nhân Từ"
 project_adakkaria_benevolent_grounds_DESC: "Chúng ta đã phục hồi được tọa độ hành tinh quê hương của Công Ước adAkkaria.\n\nViệc thám hiểm hệ sao và hành tinh có thể cuối cùng sẽ vén màn số phận của nền văn minh adAkkaria."

# Celebration
 site_adakkaria_celebration: "Lễ Kỷ Niệm"
 site_adakkaria_celebration_intro: "Sau cuộc giao tiếp với cơn bão vũ trụ, một phần nhỏ của adSul đã hiển lộ trước mắt chúng ta. Giữa những đám mây tàn dư sừng sững một khu phức hợp đồ sộ. Bị bỏ hoang, nhưng kỳ lạ thay dường như không hề hấn gì trước hàng vạn kỷ trôi qua, các bản quét cho thấy dấu hiệu vật chất hữu cơ bên trong.\n\nTrỗi dậy trước tòa nhà khổng lồ là một loạt các biểu ngữ mang theo một lời tuyên ngôn duy nhất: Đã Đến Thời Khắc Cho Lễ Kỷ Niệm."

 cstorms.2285.name: "Hư Vô Cưỡng Chế"
 cstorms.2285.desc: "Những đại sảnh trống trải của Lễ Kỷ Niệm chẳng phơi bày điều gì khác ngoài lớp bụi bặm của thời gian. Những tấm áp phích tuyên truyền, vĩnh viễn tôn vinh lòng quả cảm của Công Ước adAkkaria, là tất cả những gì còn sót lại của đế chế từng một thời phồn vinh và đáng sợ này.\n\nTuy nhiên, các nỗ lực ngôn ngữ của chúng ta đã sớm gặt hái thành quả; an ninh nơi đây chỉ mang tính hình thức và máy chủ trung tâm đã dễ dàng giao nộp những bí mật của nó.\n\nNhững nhật ký chúng ta phục hồi được ghi nhận các hoạt động náo nhiệt kéo dài cho tới tận buổi phát sóng cuối cùng của Trạm Tuyên Truyền.\n\nKể từ ngày hôm đó, Công Ước Nhân Từ adAkkaria đơn giản là biến mất hoàn toàn."
 cstorms.2290.name: "Hạ Xuống Nơi Bị Nguyền Rủa"
 cstorms.2290.desc: "Với một thoáng âu lo và tò mò, chúng ta tiến sâu vào các tầng ngầm bên dưới khu phức hợp. Một mạng lưới phòng thí nghiệm rộng lớn, được quy hoạch tỉ mỉ đón chào chúng ta. Đội ngũ chia làm hai nửa: một nửa được phái đi điều tra các phòng thí nghiệm để hiểu sâu hơn về mục đích của Lễ Kỷ Niệm. Nửa còn lại tiếp tục hạ sâu xuống dưới.\n\nCác bản quét của chúng ta kiên quyết khẳng định có vật chất hữu cơ, và không mất nhiều thời gian để tìm ra lý do: các tầng dưới của Lễ Kỷ Niệm dành riêng cho các buồng giam quan sát. Di cốt ướp xác của các công dân adAkkaria vẫn bị giam cầm trong những khoang chật hẹp này. Một giao diện kỹ thuật số cạnh mỗi buồng ghi rõ tên của từng cư dân, giai đoạn thử nghiệm mà họ phải trải qua, và ghi chú của người quan sát.\n\nTrong khi đó, chúng ta đã phục hồi được thông điệp sau:\n§LĐợt thử nghiệm của chúng ta tại hệ sao Haliios là một thảm họa hoàn toàn và triệt để. Việc triển khai ban đầu đối tượng mang tên §ShaToor Gailon§! đã diễn ra đúng như kế hoạch. Ngay khi chúng ta đối đầu với lực lượng man di Solphani, đối tượng đã mất kiểm soát. Dẫu trận cuồng phong đã quét sạch các đạo quân nguyên thủy, quân đội của chúng ta cũng bị tàn phá nặng nề.\n\nCần phải hiểu rằng hơn hết thảy, các đối tượng này rất hèn hạ và rối loạn tâm thần. Vật Triệu Hồi trực tuyến càng sớm thì càng tốt.§!"
 cstorms.2290.a: "Họ đang làm gì ở đây?"
 cstorms.2290.a.gen: "Biết bao cái chết, thật kích thích."
 cstorms.2295.name: "Một Kiểu Lễ Kỷ Niệm"
 cstorms.2295.desc.start.authgen: "Các thí nghiệm do Công Ước adAkkaria thực hiện thật đáng kinh ngạc. Mỗi tù nhân được chỉ định một giai đoạn thử nghiệm, và khi giai đoạn tăng lên, mức độ tàn bạo của các phương pháp thử nghiệm cũng tăng theo. Điều này dường như không làm bận lòng các nhà nghiên cứu, những người thường xuyên thảo luận về các vấn đề gia đình hoặc sở thích cá nhân xen lẫn với những ghi chép rùng rợn về việc lột da, thiêu đốt và mổ xẻ."
 cstorms.2295.desc.start.default: "Các thí nghiệm do Công Ước adAkkaria thực hiện thật tàn độc vô nhân đạo. Mỗi tù nhân được chỉ định một giai đoạn thử nghiệm, và khi giai đoạn tăng lên, mức độ dã man của các phương pháp thử nghiệm cũng leo thang. Điều này dường như không hề làm bận lòng các nhà nghiên cứu, những người thản nhiên bàn luận về các vấn đề gia đình hoặc sở thích cá nhân xen lẫn giữa những dòng ghi chú man rợ về lột da, thiêu đốt và mổ phanh thây."
 cstorms.2295.desc.end.default: "Chỉ vài khoảnh khắc sau quan sát của chúng ta, [Root.GetLeaderName] đã ngã quỵ. Giữa những tiếng khóc thét vì đau đớn, [Root.GetLeaderName] thét lên rằng có thứ gì đó đang phá tung tâm trí của [Leader.GetHerHis]!\n\nDù hiện tại đã ổn định, dường như có một thực thể xâm lấn đang tìm cách truyền dẫn vào [Leader.GetHerHim] một cái nhìn sâu sắc triệt để. [Root.GetLeaderName] tha thiết muốn thử lại lần nữa, tin rằng trải nghiệm này cuối cùng có thể tạo ra một hiệu ứng sâu sắc."
 cstorms.2295.desc.end.psionic: "Khi [Leader.GetHeShe] quan sát những thi thể này, [Root.GetLeaderName] bắt đầu nghe thấy những lời thì thầm kỳ lạ, một giọng nói vô hình cất lên với nỗi khát khao mãnh liệt:\n§LChúng tôi từng trung thành! Chúng tôi ca tụng Công Ước, và tin vào sứ mệnh của nó.\nCác cơn bão không ngừng gọi tên chúng tôi. Chúng nuốt chửng chúng tôi, khao khát chúng tôi!\nChúng tôi làm mọi điều họ yêu cầu. Chúng tôi tài năng và ngoan cường!\nHọ gọi chúng tôi là ác quỷ, họ gọi chúng tôi là kẻ phản bội, họ sát hại bạn bè chúng tôi!\n\nĐÂY ĐÁNG LẼ PHẢI LÀ MỘT LỄ KỶ NIỆM§!\n\nNhững lời thì thầm dẫn chúng ta tới một hành lang mang nhãn 'Giai Đoạn Cuối Cùng'. Nhưng các biện pháp an ninh tiên tiến hơn tại chỗ không cho phép xâm nhập."
 cstorms.2295.desc.end.psionic_individual_robot: "Khi [Leader.GetHeShe] phân tích những thi thể này, [Root.GetLeaderName] bắt đầu phát hiện ra một luồng truyền phát tâm linh có thể phân tích cú pháp:\n§LChúng tôi từng trung thành! Chúng tôi ca tụng Công Ước, và tin vào sứ mệnh của nó.\nCác cơn bão không ngừng gọi tên chúng tôi. Chúng nuốt chửng chúng tôi, khao khát chúng tôi!\nChúng tôi làm mọi điều họ yêu cầu. Chúng tôi tài năng và ngoan cường!\nHọ gọi chúng tôi là ác quỷ, họ gọi chúng tôi là kẻ phản bội, họ sát hại bạn bè chúng tôi!\n\nĐÂY ĐÁNG LẼ PHẢI LÀ MỘT LỄ KỶ NIỆM§!\n\nLuồng truyền phát dẫn chúng ta tới một hành lang mang nhãn 'Giai Đoạn Cuối Cùng'. Nhưng các biện pháp an ninh tiên tiến hơn tại chỗ không cho phép xâm nhập."
 cstorms.2295.desc.end.psionic_gestalt: "Khi khảo sát các thi thể, một giọng nói mới tràn qua tập thể, truyền qua [Root.GetLeaderName] như một hình thức giao tiếp:\n§LChúng tôi từng trung thành! Chúng tôi ca tụng Công Ước, và tin vào sứ mệnh của nó.\nCác cơn bão không ngừng gọi tên chúng tôi. Chúng nuốt chửng chúng tôi, khao khát chúng tôi!\nChúng tôi làm mọi điều họ yêu cầu. Chúng tôi tài năng và ngoan cường!\nHọ gọi chúng tôi là ác quỷ, họ gọi chúng tôi là kẻ phản bội, họ sát hại bạn bè chúng tôi!\n\nĐÂY ĐÁNG LẼ PHẢI LÀ MỘT LỄ KỶ NIỆM§!\n\nGiọng nói dẫn chúng ta tới một hành lang mang nhãn 'Giai Đoạn Cuối Cùng'. Nhưng các biện pháp an ninh tiên tiến hơn tại chỗ không cho phép xâm nhập."
 cstorms.2295.desc.end.gestalt: "Nhiều biến dạng kỳ lạ hơn xảy ra bên trong các tiến trình nhận thức của [controller.GetIndividualNamePlural], làm bùng phát những ý nghĩ không thuộc về chúng ta. Thông qua chúng, chúng ta biết được rằng các đối tượng thử nghiệm của Viện đã giao tiếp với nhau bằng những phương thức phi vật chất, một sự truyền tải gần như tức thời tương tự như một tâm trí bầy đàn sơ khai.\n\nDù không thể giải mã chính xác từng câu chữ, mục đích của cuộc thảo luận là rõ ràng: một cuộc nổi dậy đang âm ỉ bên trong Lễ Kỷ Niệm."
