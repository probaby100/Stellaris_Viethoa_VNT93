 d_stormfall_electric: "Mạng Lưới Thu Bắt Bão"
 d_stormfall_electric_desc: "Năng lượng nguyên sơ của một cơn bão, được dẫn thẳng vào các khối pin lưu trữ năng lượng của chúng ta."
 d_stormfall_magnetic: "Lò Rèn Từ Trường"
