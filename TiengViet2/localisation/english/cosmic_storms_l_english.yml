 situation_initiate_storm_desc_supercharge: "Chúng ta đã bắt đầu nạp siêu năng lượng cho §H[target.GetName]§! để gieo mầm một §Y$default_storm$§!."
 situation_initiate_storm_desc_overfeed: "Chúng ta đã bắt đầu làm quá bão hòa §H[target.GetName]§! để gieo mầm một §Y$default_storm$§!."
 situation_initiate_storm_desc_irradiate: "Chúng ta đang thao túng gió sao của §H[target.GetName]§! để gieo mầm một §Y$solar_storm$§!."
 situation_initiate_storm_desc_sever: "Chúng ta đang cắt đứt các trường electron xung quanh §H[target.GetName]§! để gieo mầm một §Y$electric_storm$§!."
 situation_initiate_storm_desc_magnetize: "Chúng ta đang thao túng các ion xung quanh §H[target.GetName]§! để gieo mầm một §Y$magnetic_storm$§!."
 situation_initiate_storm_desc_agitate: "Chúng ta đang khuấy động các phân tử xung quanh §H[target.GetName]§! để gieo mầm một §Y$particle_storm$§!."
 situation_initiate_storm_desc_destabilize: "Chúng ta đang làm mất ổn định trường trọng lực của §H[target.GetName]§! để gieo mầm một §Y$gravity_storm$§!."
