 crisis_analysis_unbidden_modifier: "$crisis_analysis_khan_modifier$"
 resolution_custodian_democratic_proceedings: "Thủ Tục Dân Chủ"
 resolution_custodian_democratic_proceedings_desc: "Bằng cách chia sẻ một phần quyền hạn của Người Quản Thủ với các thành viên hội đồng, chúng ta có thể ủy thác các nhiệm vụ hành chính và tin tưởng họ sẽ tinh giản các quy trình của viện nguyên lão."
 resolution_custodian_repeal_democratic_proceedings: "Bãi Bỏ Thủ Tục Dân Chủ"
 resolution_custodian_repeal_democratic_proceedings_desc: "Đôi khi nhanh hơn không phải lúc nào cũng tốt hơn, và có những giá trị dân chủ được tìm thấy trong các phiên họp nguyên lão kéo dài hơn, mang lại nhiều không gian tranh luận hơn."
 resolution_crisis_analysis_khan: "$crisis_analysis$: Đại Khả Hãn"
 resolution_crisis_analysis_khan_desc: "Khả Hãn là một nhà lãnh đạo quân sự đáng sợ, nhưng quân đội của hắn vẫn chỉ là một đám ô hợp, chỉ bù đắp cho sự thiếu kỷ luật bằng sự tàn bạo thuần túy."
 resolution_crisis_analysis_tempest: "$crisis_analysis$: Bão Xám"
 resolution_crisis_analysis_tempest_desc: "Những đám mây nanite của Bão Xám rất đáng sợ, nhưng tuân theo một lập trình cụ thể. Nếu chúng ta có thể bẻ khóa các thuật toán của chúng, chúng ta có thể đánh bại chúng."
 resolution_crisis_analysis_voidworms: "$crisis_analysis$: Trùng Hư Không"
 resolution_crisis_analysis_voidworms_desc: "Lũ trùng hư không gớm ghiếc chẳng qua chỉ là dã thú. Sẽ không mất nhiều công sức để đưa ra một chiến lược đối phó hiệu quả."
 resolution_crisis_analysis_cetana: "$crisis_analysis$: Nữ Hoàng Người Máy"
 resolution_crisis_analysis_cetana_desc: "Cetana là một kẻ thù xảo quyệt, nhưng đằng sau nụ cười bí ẩn của bà ta là những dòng mã lạnh như băng. Nữ Hoàng Người Máy có thể không đổ máu, nhưng chúng ta hoàn toàn có thể đánh bại bà ta."
 resolution_crisis_analysis_prethoryn: "$crisis_analysis$: Bầy Đàn Prethoryn"
 resolution_crisis_analysis_prethoryn_desc: "Theo một nghĩa nào đó, cơn đói khát không bao giờ nguôi thúc đẩy loài Prethoryn khiến chúng trở nên dễ đoán. Chúng hung dữ, nhưng không phải là bất khả chiến bại."
 resolution_crisis_analysis_contingency: "$crisis_analysis$: Giao Thức Dự Phòng (The Contingency)"
 resolution_crisis_analysis_contingency_desc: "Logic vô hồn của Contingency thật rợn người, nhưng tàu chiến của chúng đã được thiết kế từ hàng triệu năm trước. Chắc chắn chúng ta có thể tìm ra phương thức để đánh bại chúng."
 resolution_crisis_analysis_unbidden: "$crisis_analysis$: Kẻ Xâm Lược Dị Chiều"
 resolution_crisis_analysis_unbidden_desc: "Sự phụ thuộc của lũ Unbidden đê tiện và đồng loại vào vũ khí năng lượng cùng lá chắn có thể sẽ chính là nguyên nhân dẫn đến sự diệt vong của chúng."
 resolution_repeal_crisis_analysis: "Bãi Bỏ $crisis_analysis$"
 resolution_repeal_crisis_analysis_desc: "Chúng ta không cần phải duy trì các ủy ban chiến lược nữa."
 cancel_crisis_resolution: "Bất kỳ nghị quyết §H$crisis_analysis$§! nào đang hoạt động đều bị hủy bỏ"
 ongoing_crisis: "Đang có một cuộc khủng hoảng diễn ra"
