# Paladin Traits

 leader_trait_paladin: "Paladin"
 leader_trait_paladin_desc: "Nhà lãnh đạo này gánh vác trọng trách của Paladin. Qua lời nói và hành động, họ hiện thân cho chính lòng can trường, là những dũng sĩ tiên phong của một thiên hà tự do."
 leader_trait_paladin_effect: "Nhà lãnh đạo này không tốn §YPhí Duy Trì§! và không chiếm dụng §YGiới Hạn Lãnh Đạo§!"

 leader_trait_paladin_ace: "Phi Công Át Chủ"
 leader_trait_paladin_ace_desc: "Với những quyết định chớp nhoáng và phản xạ xuất thần, Paladin này là chuyên gia luồn kim để giáng đòn chí mạng vào trái tim kẻ thù."
 leader_trait_paladin_strategist: "Bậc Thầy Chiến Lược"
 leader_trait_paladin_strategist_desc: "Điềm tĩnh và sâu sát, Paladin giỏi tính toán này là chuyên gia vạch ra các kế hoạch phát huy tối đa thế mạnh của các đồng đội."
 leader_trait_paladin_strategist_tt: "Hạm đội trong hệ sao:$TABBED_NEW_LINE$- Tốc độ bắn của tàu: §G+30%§!"
 PALADIN_STRATEGIST_AURA: "Hiệu Lệnh $leader_trait_paladin_strategist$"
 leader_trait_paladin_ambusher: "Biệt Kích"
 leader_trait_paladin_ambusher_desc: "Kiên nhẫn và chuẩn xác, Paladin tập trung cao độ này là chuyên gia tung ra đòn đánh quyết định."
 leader_trait_paladin_logistician: "Bậc Thầy Hậu Cần"
 leader_trait_paladin_logistician_desc: "Trí tuệ nhạy bén và quá trình rèn luyện khoa học giúp Paladin này giải quyết các vấn đề hậu cần và bảo trì, ngay cả giữa sức nóng của trận chiến."
 leader_trait_paladin_logistician_tt: "Hạm đội trong hệ sao:$TABBED_NEW_LINE$- Phí duy trì tàu: §G-15%§!"
 PALADIN_LOGISTICIAN_AURA: "Tối Ưu Hóa $leader_trait_paladin_logistician$"
 leader_trait_paladin_defender: "Hộ Vệ"
 leader_trait_paladin_defender_desc: "Paladin kiên cường và bất khuất này tin tưởng vào con tàu và thủy thủ đoàn để đứng vững trước những hiểm nguy áp đảo, và luôn sẵn sàng che chắn cho bất kỳ đồng minh nào cần giúp đỡ."
 leader_trait_paladin_spearhead: "Tiên Phong"
 leader_trait_paladin_spearhead_desc: "Paladin dũng cảm này không ngần ngại chiến đấu nơi tiền tuyến, phối hợp cùng đồng minh hạ gục cả những kẻ thù đáng sợ nhất."
 leader_trait_paladin_knight: "Hiệp Sĩ"
 leader_trait_paladin_knight_desc: "Paladin này đã lập lời thề can trường. Kỹ năng vô song trong chiến trận của họ chỉ có thể sánh bằng ý chí sắt đá không gì lay chuyển."

