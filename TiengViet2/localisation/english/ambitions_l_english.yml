 integrity: "Can Trường"
 integrity_name: "$integrity$:"
 integrity_value: "£integrity£ $VAL|0$"
 integrity_gaining: "Hoàn thành §HMục Tiêu Tham Vọng§! để nhận thêm £integrity£ §YCan Trường§!."
 integrity_desc: "Điểm Can Trường phản ánh quyết tâm của chúng ta trong việc bảo vệ thiên hà khỏi sự hủy diệt và bạo tàn."
 integrity_crisis_objective: "Mục Tiêu Tham Vọng"
 integrity_crisis_objective_gained: "Điểm Can Trường nhận được"
 integrity_crisis_objective_reward: "$REWARD$"
 integrity_crisis_objective_progress: "Chúng ta đã nhận được £integrity£ $AMOUNT$ từ Mục Tiêu Tham Vọng này."
 integrity_crisis_level_locked: "Yêu cầu để mở khóa cấp độ này:\n"
 integrity_crisis_level_unlocked: "Tại $LEVEL$, bạn nhận được các phần thưởng:\n"
 integrity_crisis_level_desc: "Để thăng tiến qua các cấp độ Tham Vọng, hãy tích lũy điểm Can Trường."
 integrity_crisis_level_unlock: "Có £integrity£ §Y$CURRENCY$§! Can Trường"
 integrity_current_value: "Giá Trị Hiện Tại: §Y$VALUE|0$§!"
 integrity_crisis_description_title: "Người Hộ Vệ Thiên Hà"
 integrity_crisis_description: "Những người trong cộng đồng thiên hà dõi theo dòng chảy lịch sử từ lâu đã dự đoán về một cuộc §RKhủng Hoảng§! sắp ập tới — một hiểm họa sinh tồn đối với toàn bộ sinh mệnh có tri giác, đòi hỏi sự đồng lòng hướng tới mục đích chung và sự hy sinh chưa từng có để vượt qua. Nếu như nó thực sự có thể vượt qua được.\n\nNhững dự đoán phổ biến về bản chất của cuộc khủng hoảng này đa dạng và kỳ lạ như một cuộc xâm lăng của kẻ phàm ăn ngoài thiên hà, hay các trí tuệ máy móc trong thiên hà nổi dậy làm loạn, hoặc một cuộc chiến kế vị từ một chiều không gian khác tràn sang, và...\n\nGiờ đây đã rõ ràng rằng trọng trách bảo vệ thiên hà sẽ thuộc về §Gchúng ta§!.\n\nBất kể những nỗi kinh hoàng và những kẻ bạo chúa nào trỗi dậy, chúng sẽ nhận ra rằng mái nhà của chúng ta được bảo vệ kiên cố. Chẳng bao lâu nữa, tất cả sẽ biết rằng góc vũ trụ này sẽ không bao giờ bị khuất phục!"
 integrity_crisis_howto_title: "Phụng Sự Và Hy Sinh"
 integrity_crisis_howto: "Theo đuổi §HMục Tiêu Tham Vọng§! tạo ra £integrity£ §HCan Trường§!, một minh chứng cho sự tận tâm giúp tập hợp các quốc gia tự do trong thiên hà đứng sau chúng ta để bảo vệ sự sống và tự do."

#Objectives

 crisobj_defensive_pacts_name: "Thiết Lập Liên Minh"
 crisobj_defensive_pacts_desc: "Sức mạnh nằm ở sự đoàn kết. Đại nghiệp của chúng ta là chính nghĩa, nhưng chính nghĩa không có đồng minh sẽ không thể trường tồn. Chúng ta không thể bảo vệ một thiên hà không muốn được bảo vệ, vì vậy chúng ta phải tìm kiếm những người cùng chia sẻ giá trị và sẽ kề vai chiến đấu bên ta, đồng tâm hiệp lực.\n\nKý kết §YHiệp Ước Phòng Thủ§! hoặc trao §YTư Cách Thành Viên Liên Kết Liên Bang§! để nhận phần thưởng Can Trường §Yhàng năm§! này."
 crisobj_federated_name: "Gia Nhập Liên Bang"
 crisobj_federated_desc: "Mối liên kết của một liên bang không dễ bị phá vỡ. Sự hợp tác và hòa hợp với các đế chế cùng chí hướng sẽ đưa tất cả chúng ta bước vào một kỷ nguyên thịnh vượng mới.\n\nGia nhập hoặc Thành lập một §YLiên Bang§! để nhận phần thưởng Can Trường §Yhàng năm§! này."
 crisobj_not_in_aggressive_war_name: "Không Tham Gia Chiến Tranh Xâm Lược"
 crisobj_not_in_aggressive_war_desc: "Chúng ta là người hộ vệ, không phải kẻ xâm lược; chỉ khi đứng vững lập trường chúng ta mới giành được sự tin cậy của thiên hà.\n\nKhông §YTấn Công§! hoặc không tham gia vào phe §YTấn Công§! trong bất kỳ cuộc chiến nào để nhận phần thưởng Can Trường §Yhàng tháng§! này."
 crisobj_galcom_activity_name: "Đóng Góp Cho Cộng Đồng Thiên Hà"
 crisobj_galcom_activity_desc: "Khuôn khổ dân chủ của Cộng Đồng Thiên Hà là phương tiện tốt nhất của chúng ta để rèn giũa sự đoàn kết. Thông qua đó, chúng ta có thể trở thành một tấm khiên duy nhất, đủ mạnh mẽ để chống lại bất kỳ mối đe dọa nào, nhưng vẫn tôn trọng quyền tự chủ của các thành viên.\n\nỦng hộ các §YNghị Quyết§! được thông qua thành công tại Cộng Đồng Thiên Hà để nhận phần thưởng Can Trường này."
 crisobj_destroy_crisis_ships_name: "Tiêu Diệt Tàu Khủng Hoảng"
 crisobj_destroy_crisis_ships_desc: "Vũ lực chỉ nên là biện pháp cuối cùng, nhưng tuyệt đối không có sự khoan nhượng dành cho những kẻ thù của thiên hà.\n\nTiêu diệt các tàu thuộc sở hữu của một phe §YKhủng Hoảng§! để nhận phần thưởng Can Trường này."
 crisobj_destroy_crisis_countries_name: "Đánh Bại Các Khủng Hoảng"
 crisobj_destroy_crisis_countries_desc: "Chúng ta không mưu cầu chiến tranh, nhưng sẽ không tha thứ cho những kẻ đe dọa thiên hà. Nếu bị ép buộc, chúng ta sẽ đảm bảo những kẻ tàn phá này chỉ còn được nhớ đến như một bài học cảnh tỉnh.\n\nTiêu diệt các §YĐế Chế Khủng Hoảng§! để nhận phần thưởng Can Trường này."

#Perks

 triggered_opinion_ap_defender_of_the_galaxy_1: "$menp_defender_opinion_1$"
 triggered_opinion_ap_defender_of_the_galaxy_2: "$menp_defender_opinion_2$"
 triggered_opinion_ap_defender_of_the_galaxy_3: "$menp_defender_opinion_3$"

 menp_defender_objectives: "Can Trường"
 menp_defender_objectives_desc: "Điểm Can Trường đạt được thông qua hành động kiên định bảo vệ thiên hà. Nó không phải là thứ được ban phát, mà phải tự mình giành lấy, bằng chứng cho thấy chúng ta hành động không phải vì tư lợi, mà vì sự chở che cho muôn loài."
 unlocks_defender_objectives: "Cho phép tích lũy £integrity£ §Y$menp_defender_objectives$§! bằng cách hoàn thành §HMục Tiêu Tham Vọng§!"
 menp_defender_opinion_1: "Tấm Lòng Cao Thượng"
 menp_defender_opinion_1_desc: "Để dẫn dắt, chúng ta phải được muôn loài biết đến, không phải thông qua sợ hãi, mà thông qua hy vọng. Chúng ta sẽ đầu tư vào hoạt động tiếp cận nhằm nâng đỡ, truyền tin và xây dựng lòng tin giữa các vì sao."
 unlocks_defender_opinion_1: "Tăng £opinion£ §YĐánh Giá§! của các đế chế có khả năng ngoại giao thông thường thêm §G+40§!"
 menp_defender_galcom_1: "Diễn Giả Đầy Cảm Hứng"
 menp_defender_galcom_1_desc: "Một bài diễn thuyết chỉ hay khi diễn giả xuất sắc. Chúng ta phải uốn nắn ngôn từ để chạm đến trái tim và khối óc của các đồng sự — dẫu cho họ có vẻ xa lạ với chúng ta đến mức nào."
 menp_defender_federation_1: "Đồng Minh Kiên Trung"
 menp_defender_federation_1_desc: "Bộ máy hành chính liên bang là một công cụ mạnh mẽ có thể được tận dụng vì lợi ích của toàn thể đồng minh chúng ta."
 menp_defender_crisis_damage_1: "Bất Khuất"
 menp_defender_crisis_damage_1_desc: "Ý chí của chúng ta vững vàng, và chúng ta sẽ không lùi bước trước một cuộc chiến vì sợ hãi bị tổn thương."
 unlocks_defender_crisis_damage_1: "Sát thương lên các phe Khủng Hoảng: §G+15%§!"
 menp_defender_galcom_2: "Lãnh Tụ Chính Trị"
 menp_defender_galcom_2_desc: "Tầm ảnh hưởng của chúng ta ngày càng lớn, và cùng với đó là khả năng thúc đẩy thay đổi trong Cộng Đồng Thiên Hà. Các đồng minh tin tưởng chúng ta, và chúng ta phải nỗ lực để xứng đáng với niềm tin đó."
 menp_defender_galcom_2_structures: "Mở khóa khả năng xây dựng một số §YCấu Trúc§! tại các Hệ Sao §YĐồng Minh§!.\n"
 menp_defender_federation_2: "Huynh Đệ Tương Trợ"
 menp_defender_federation_2_desc: "Chúng ta bảo vệ thiên hà, nhưng thật yên lòng khi biết rằng những người khác cũng bảo vệ chúng ta. Bằng cách nương tựa vào nhau, tất cả chúng ta đều trở nên mạnh mẽ hơn."
 unlocks_defender_federation_2: "Kinh Nghiệm Liên Bang Hàng Tháng: §G+2§!"
 menp_defender_crisis_damage_2: "Nhiệt Huyết Tận Tụy"
 menp_defender_crisis_damage_2_desc: "Thiên hà đặt niềm tin vào chúng ta, và chúng ta sẽ không để họ phải thất vọng."
 unlocks_defender_crisis_damage_2: "Sát thương lên các phe Khủng Hoảng: §G+15%§!"
 menp_defender_opinion_2: "Những Chiến Binh Tiên Phong Của Thiên Hà"
 menp_defender_opinion_2_desc: "Biểu tượng từ lâu đã định hình vận mệnh của các đế chế. Để xua tan mọi nghi ngờ còn sót lại về mục đích của mình, chúng ta phải tạo dựng những biểu tượng rõ ràng mà toàn bộ thiên hà có thể tề tựu xung quanh."
 unlocks_defender_opinion_2: "Tăng £opinion£ §YĐánh Giá§! của các đế chế có khả năng ngoại giao thông thường lên tổng cộng §G+100§!\nMở khóa nghị quyết §YSáng Kiến Hiệp Sĩ Paladin§! trong Cộng Đồng Thiên Hà."
 menp_defender_research_1: "Sáng Kiến Đại Não"
 menp_defender_research_1_desc: "Tri thức có thể là sức mạnh, nhưng sức mạnh thực sự nằm ở sự trao đổi tri thức. Bằng cách chia sẻ hiểu biết với các đồng minh, chúng ta chứng minh rằng sức mạnh không nhất thiết phải gây chia rẽ. Khi được sử dụng khôn ngoan, nó gắn kết chúng ta vì mục đích chung."
 menp_defender_defense_1: "Trạm Không Gian Gia Cố"
 menp_defender_defense_1_desc: "Hạm đội là vũ khí chính của chúng ta, nhưng không phải là duy nhất. Kẻ thù có thể bị chặn đứng trên đe sắt của các trạm không gian để búa tạ của hạm đội chúng ta giáng xuống tiêu diệt chúng."
 menp_defender_defense_1_tt: "$defensive_stations_hull_mult$: §G+15%§!\n$defensive_stations_armor_mult$: §G+10%§!\n$defensive_stations_shield_hardening_add$: §G+15%§!"
 menp_defender_crisis_damage_3: "Tôn Kính Liệt Sĩ"
 menp_defender_crisis_damage_3_desc: "Tìm kiếm cái chết không phải là đức tính tốt, nhưng chấp nhận hy sinh vì một đại nghĩa chính là vinh dự. Chiến thắng trong công cuộc bảo vệ thiên hà đòi hỏi sự hy sinh, và những ai dâng hiến mạng sống vì kẻ khác sẽ không bao giờ bị lãng quên."
 unlocks_defender_crisis_damage_3: "Sát thương lên các phe Khủng Hoảng: §G+25%§!"
 menp_defender_opinion_3: "Ngọn Hải Đăng Đoàn Kết"
 menp_defender_opinion_3_desc: "Chúng ta đã chứng minh được mình trước con mắt của thiên hà. Cư dân trên vô số thế giới khắc sâu trong tim rằng chúng ta sẽ chiến đấu đến hơi thở cuối cùng để bảo vệ họ."
 unlocks_defender_opinion_3: "Tăng £opinion£ §YĐánh Giá§! của các đế chế có khả năng ngoại giao thông thường lên tổng cộng §G+200§!\nMở khóa các nghị quyết §YHiệp Sĩ Paladin§! mới trong Cộng Đồng Thiên Hà."
 menp_defender_custodian: "Trọng Trách Tối Cao"
 menp_defender_custodian_desc: "Quyền năng phi thường đi kèm với trách nhiệm phi thường. Áo choàng của Người Quản Thủ là gánh nặng được mang vì lợi ích chung. Những quyền hạn này tuyệt đối không bao giờ được sử dụng cho tham vọng cá nhân, mà là để khơi dậy những lý tưởng cao đẹp nhất của thiên hà."
 unlocks_defender_custodian: "Mở khóa 4 §YNghị Quyết§! Quản Thủ đặc biệt trong §Y[GetGalCommunityOrGalImperium]§!."
 menp_defender_defense_2: "Quyết Tâm Sắt Đá"
 menp_defender_defense_2_desc: "Đứng trước sự hủy diệt chắc chắn, chúng ta không đứng vững vì chúng ta mạnh mẽ hơn. Chúng ta đứng vững vì chúng ta bắt buộc phải làm vậy."
 menp_defender_crisis_damage_4: "Bằng Mọi Giá"
 menp_defender_crisis_damage_4_desc: "Có những quy tắc chiến tranh mà chúng ta đã phá vỡ, với sự hiểu biết đầy đủ về cái giá phải trả. Khi cuộc khủng hoảng hiện tại kết thúc, chúng ta sẽ chịu sự phán xét. Cho đến lúc đó, chúng ta làm những gì phải làm để đảm bảo thiên hà vẫn còn tồn tại để phán xét chúng ta."
 unlocks_defender_crisis_damage_4: "Sát thương lên các phe Khủng Hoảng: §G+35%§!"
 menp_defender_galcom_3: "Chiến Lược Hòa Nhịp"
 menp_defender_galcom_3_desc: "Phòng thủ luôn bị bao phủ trong bức màn bí mật, nhưng trong tình thế của chúng ta, thiên hà phải liên kết lại để tìm ra phương cách tốt nhất nhằm đẩy lùi những kẻ thù không đội trời chung."
 unlocks_defender_galcom_3: "Mở khóa các §YNghị Quyết§! Phân Tích Khủng Hoảng đặc biệt trong §Y[GetGalCommunityOrGalImperium]§!."
 final_price_doctrine: "Cái Giá Cuối Cùng"
 final_price_doctrine_desc: "Các chiến binh của chúng ta thấu hiểu bổn phận của mình, và tên tuổi của họ sẽ mãi mãi được khắc ghi trong lịch sử thiên hà sau khi họ trả cái giá đắt nhất để cứu rỗi tất cả chúng ta."
 force_preservation_doctrine: "Bảo Toàn Lực Lượng"
 force_preservation_doctrine_desc: "Luôn có thời gian và địa điểm thích hợp để hy sinh mạng sống phục vụ một lý tưởng. Cho đến khi thời khắc đó đến, chúng ta không thể lãng phí sinh mạng của nhân dân mình."
 menp_defender_research_2: "Không Giữ Bí Mật"
 menp_defender_research_2_desc: "Sự bí mật ích kỷ thôi thúc chúng ta che giấu tiến bộ công nghệ không thể dung thứ được nữa. Đồng minh của chúng ta càng mạnh thì chúng ta càng mạnh."
 menp_defender_defense_3: "Những Người Hộ Vệ Thiên Hà"
 menp_defender_defense_3_desc: "Chúng ta sẽ chiến đấu vì từng ngôi sao. Chúng ta sẽ chiến đấu vì từng thế giới. Chúng ta sẽ chiến đấu vì từng sinh mạng. Chúng ta sẽ chiến đấu vì từng tấc đất của mái nhà chúng ta!"

#Resolutions

 resolution_custodian_expand_gdf_2: "Lực Lượng Phòng Thủ Siêu Quốc Gia"
 resolution_custodian_expand_gdf_2_desc: "Lực Lượng Phòng Thủ Thiên Hà là cơ hội tốt nhất để chúng ta sống sót trước những nỗi kinh hoàng có thể đe dọa thiên hà. Vượt lên trên những cuộc cãi vã vặt vãnh của [global_event_country.GetCommunityOrImperium], đây là lực lượng quân sự đáng tin cậy nhất trong thiên hà."
 resolution_custodian_gdf_drills: "Tập Trận Quân Sự Chung"
 resolution_custodian_gdf_drills_desc: "Các cuộc diễn tập phối hợp giữa các thành viên của [global_event_country.GetCommunityOrImperium] sẽ giúp hình thành một mặt trận thống nhất chống lại những kẻ bạo chúa và xâm lăng tiềm tàng. Cùng nhau, chúng ta sẽ là bất khả chiến bại."
 resolution_custodian_council: "Trao Quyền Cho Hội Đồng"
 resolution_custodian_council_desc: "Gánh nặng lãnh đạo thật nặng nề, nhưng bằng cách hợp tác với các thành viên khác của [global_event_country.GetCommunityOrImperium], chúng ta có thể phân bổ những nguồn lực phi thường để giúp đỡ các thành viên của Hội Đồng Thiên Hà để họ lần lượt giúp đỡ tất cả mọi người."
 resolution_custodian_council_tooltip: "Thành Viên Hội Đồng:$TABBED_NEW_LINE$- $MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+10%§!$TABBED_NEW_LINE$- $mod_country_unity_produces_mult$: §G+10%§!$TABBED_NEW_LINE$- $mod_gdf_ship_cost_mult$: §G-5%§!$TABBED_NEW_LINE$- $MOD_DIPLO_WEIGHT_MULT$: §R-20%§!"
 resolution_custodian_reduce_council_power: "Bãi Bỏ $resolution_custodian_council$"
 resolution_custodian_reduce_council_power_desc: "Bãi bỏ nghị quyết §Y$resolution_custodian_council$§!"

 resolution_custodian_gdf_3: "$resolution_custodian_expand_gdf_2$"
 resolution_custodian_gdf_4: "$resolution_custodian_gdf_drills$"

