 resolution_category_paladins: "Sáng Kiến Hiệp Sĩ Paladin"
 resolution_paladin_focus_teamwork: "Trọng Tâm Paladin: Hiệp Lực"
 resolution_paladin_focus_teamwork_desc: "Các Paladin cần thực hành phối hợp tác chiến cùng nhau để vượt qua mối đe dọa nghiêm trọng nhất."
 resolution_paladin_focus_teamwork_tt: "$only_one_paladin_focus$\n\nMở khóa hành động tàu §H$paladin_teamwork$§! cho §YPaladin§!:\n\n$paladin_teamwork_ship_button$"
 resolution_paladin_focus_leadership: "Trọng Tâm Paladin: Năng Lực Lãnh Đạo"
 resolution_paladin_focus_leadership_desc: "Các Paladin không chỉ là những chỉ huy. Họ là những tấm gương mẫu mực dẫn dắt bằng mưu lược và lòng quả cảm sắt đá, tập hợp đồng minh và đứng vững ở nơi hiểm nguy nhất."
 resolution_paladin_focus_leadership_tt: "$only_one_paladin_focus$\n\nMở khóa hành động tàu §H$paladin_leadership$§! cho §YPaladin§!:\n\n$paladin_leadership_ship_button$"
 resolution_paladin_focus_last_resort: "Trọng Tâm Paladin: Thử Nghiệm Thực Địa"
 resolution_paladin_focus_last_resort_desc: "Những vũ khí được giao phó cho các Paladin của chúng ta chưa qua thử nghiệm, đầy hiểm nguy và quá có sức hủy diệt để triển khai rộng rãi. Chúng ta triển khai chúng lúc này vì tình thế không còn lựa chọn nào khác, tin tưởng các Paladin của chúng ta sẽ sử dụng chúng một cách đầy danh dự."
 resolution_paladin_focus_last_resort_tt: "$only_one_paladin_focus$\n\nMở khóa hành động tàu §H$paladin_field_testing$§! cho §YPaladin§!:\n\n$paladin_field_testing_ship_button$"
 only_one_paladin_focus: "§RChỉ có thể thông qua một Nghị Quyết §YTrọng Tâm§! Paladin.§!"
 resolution_paladin_training_teamwork: "Huấn Luyện Paladin: Hiệp Đồng"
 resolution_paladin_training_teamwork_desc: "Dù mỗi Paladin đều hùng mạnh khi tác chiến đơn độc, sức mạnh thực sự của họ nằm ở sự đoàn kết. Khi họ chiến đấu cùng nhau, lòng dũng cảm của họ làm được nhiều hơn là truyền cảm hứng. Nó trở thành một sức mạnh không thể ngăn cản."
 resolution_paladin_training_teamwork_tt: "$only_one_paladin_training$\n\nCác §YPaladin§! trong cùng một hệ sao trao cho nhau hiệu ứng bổ trợ sau:\n- $MOD_SHIP_DAMAGE_REDUCTION_MULT$: §G2.5%§!\n- $MOD_SHIP_FIRE_RATE_MULT$: §G2.5%§!"
 resolution_paladin_training_defense: "Huấn Luyện Paladin: Phòng Thủ"
 resolution_paladin_training_defense_desc: "Một Paladin ngã xuống có thể truyền cảm hứng, nhưng một Paladin còn sống sẽ bảo vệ muôn loài. Sự sinh tồn của họ không phải là vấn đề cảm xúc, mà là chiến lược. Chúng ta sẽ dành mọi nguồn lực cần thiết để giữ họ trên tiền tuyến."
 resolution_paladin_training_defense_tt: "$only_one_paladin_training$\n\nĐặc tính Lãnh đạo §YPaladin§! nay tăng thêm:\n$MOD_SHIP_EVASION_MULT$: §G25%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_PERC$: §G20%§!"
 resolution_paladin_training_offense: "Huấn Luyện Paladin: Tấn Công"
 resolution_paladin_training_offense_desc: "Hòa bình đôi khi đòi hỏi sức mạnh vượt ngoài sự kiềm chế. Các Paladin tấn công không phải trong sự giận dữ, mà để gìn giữ những gì bắt buộc phải trường tồn."
 resolution_paladin_training_offense_tt: "$only_one_paladin_training$\n\nĐặc tính Lãnh đạo §YPaladin§! nay tăng thêm:\n$MOD_SHIP_WEAPON_DAMAGE$: §G30%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$: §G25%§!"
 only_one_paladin_training: "§RChỉ có thể thông qua một Nghị Quyết §YHuấn Luyện§! Paladin.§!"
 resolution_paladin_direct_command: "Chỉ Huy Trực Tiếp"
 resolution_paladin_direct_command_desc: "Mối hiểm họa đe dọa chúng ta đòi hỏi những biện pháp phi thường. Chúng ta phải tập hợp các Paladin dưới quyền chỉ huy của Người Quản Thủ."
 resolution_repeal_paladin_direct_command: "Bãi Bỏ Chỉ Huy Trực Tiếp"
 resolution_repeal_paladin_direct_command_desc: "Thời khắc khủng hoảng đã qua đi, và cùng với đó, nhu cầu về một quyền chỉ huy phi thường cũng chấm dứt. Các Paladin giờ đây sẽ trở lại chuỗi quyền lực tiêu chuẩn, trọng trách của họ đã hoàn thành."
 resolution_paladin_direct_command_tooltip: "Toàn bộ §YPaladin§! sẽ được điều khiển trực tiếp bởi Người Quản Thủ"

 gal_com_too_early: "Còn quá sớm để thảo luận điều này."

#Special Projects and event chains

 defender_of_the_galaxy_chain_title: "Người Hộ Vệ Thiên Hà"
 defender_of_the_galaxy_chain_desc: "Thiên hà là một nơi tuyệt mỹ, xứng đáng được gìn giữ. Một nơi của vô vàn giống loài, hy vọng và ước mơ, mỗi một trong số đó đều xứng đáng được chở che. Chúng ta không mưu cầu quyền lực, chỉ mưu cầu hòa bình. Nhưng hòa bình phải được bảo vệ. Trước những kẻ muốn xâm chiếm, hủy diệt hoặc làm tha hóa, chúng ta sẽ đứng vững. Và chừng nào chúng ta còn đứng vững, thiên hà cũng sẽ trường tồn."
 ambition_level_reached: "Đã Đạt Cấp Độ Tham Vọng"

 defender_of_the_galaxy_ending_chain_title: "Đòn Phủ Đầu"
 defender_of_the_galaxy_ending_chain_desc: "Chúng ta sẽ thật ngu ngốc nếu phớt lờ những dấu hiệu. Có những thế lực tà ác trong thiên hà này muốn phá hủy tất cả những gì chúng ta nỗ lực bảo vệ. Chúng ta không thể ngồi chờ cơn bão ập đến. Chúng ta phải sẵn sàng hành động.\n\nHãy để những kẻ đe dọa thiên hà này biết rằng: chúng ta sẽ tìm ra chúng.\n\n§HMỤC TIÊU§!:\n- Tiêu diệt toàn bộ Đế Chế Khủng Hoảng\n- Đánh bại hai đợt Khủng Hoảng Cuối Game\n- Sau đó Chấm dứt Quyền Quản Thủ của bạn"
 crisis_defeated: "Khủng Hoảng Bị Đánh Bại"

 DEFENDER_CRISIS_SPECIAL_PROJECT_1: "Ngoại Giao Tinh Tế"
 DEFENDER_CRISIS_SPECIAL_PROJECT_1_DESC: "Không ai bảo vệ thiên hà một mình.\n\nTrước khi có thể hành động, chúng ta phải giành được lòng tin của những người mà chúng ta hy vọng bảo vệ. Lòng tin đó bắt đầu từ sự trung thực, kiềm chế và ngoại giao.\n\nChúng ta sẽ đào tạo một thế hệ đặc phái viên mới để chứng minh qua lời nói và hành động rằng chúng ta ở đây là để giúp đỡ. Chỉ khi cùng nhau, chúng ta mới có thể xây dựng các liên minh đủ mạnh mẽ để vượt qua những gì phía trước."
 DEFENDER_CRISIS_SPECIAL_PROJECT_2: "Nguồn Cảm Hứng"
 DEFENDER_CRISIS_SPECIAL_PROJECT_2_DESC: "Lòng tin phải tự mình giành lấy. Niềm tin phải được vun đắp.\n\nGiờ đây khi thiên hà sát cánh bên ta, chúng ta phải trao cho muôn dân một điều gì đó để họ tin tưởng, những biểu tượng có thể đứng vững ngay cả trong giờ phút đen tối nhất. Không chỉ là những lá cờ hay khẩu hiệu đơn thuần, mà là những biểu trưng của lòng dũng cảm, sự đoàn kết và lời hứa sắt đá rằng chúng ta sẽ đứng chắn giữa họ và cơn bão táp.\n\nHãy để mọi sinh mệnh có tri giác nhìn vào những biểu tượng này và nhớ rằng: họ không hề đơn độc."
 DEFENDER_CRISIS_SPECIAL_PROJECT_4: "Giành Quyền Chủ Động"
 DEFENDER_CRISIS_SPECIAL_PROJECT_4_DESC: "Thiên hà ẩn chứa những mối đe dọa quá lớn để có thể phớt lờ. Chúng ta không thể khoanh tay chờ đợi bóng tối tự lộ diện. Với sự thận trọng và chu đáo, chúng ta sẽ bắt đầu một loạt các chiến dịch có độ rủi ro cao để khám phá những nguy hiểm phía trước.\n\n§RĐiều này sẽ kích hoạt Khủng Hoảng Cuối Game§!"
 DEFENDER_CRISIS_SPECIAL_PROJECT_5: "Thừa Thắng Xông Lên"
 DEFENDER_CRISIS_SPECIAL_PROJECT_5_DESC: "Những nỗ lực ban đầu của chúng ta đã được chứng minh là cần thiết, và dẫu đã thành công, đó vẫn chưa phải là hồi kết.\n\nThiên hà bao la và đầy rẫy hiểm nguy. Chúng ta phải tiếp tục cuộc tìm kiếm để đảm bảo không một mối đe dọa nào lọt khỏi tầm mắt.\n\nNhững thử nghiệm này đầy hiểm họa, nhưng nếu cái ác vẫn còn lẩn khuất trong bóng tối, chúng ta không có lựa chọn nào khác ngoài việc đối mặt với nó.\n\n§RĐiều này sẽ kích hoạt Khủng Hoảng Cuối Game thứ hai§!"

 PALADIN_SHIP_PROJECT: "Chiến Hạm Paladin"
 PALADIN_SHIP_PROJECT_DESC: "Nghệ thuật kết hợp cùng công nghệ để tạo nên những biểu tượng của tự do rực sáng giữa màn đêm bóng tối."

 MISSION_BE_ON_GALCOM: "Thành Viên Cộng Đồng"
 MISSION_JOIN_GALACTIC_COMMUNITY: "$BE_ON_GALCOM$"
 BE_ON_GALCOM: "Trở thành một phần của Cộng Đồng Thiên Hà"
 MISSION_BE_ON_GALCOM_DESC: "Nếu chúng ta muốn lèo lái bộ máy dân chủ của thiên hà, trước tiên chúng ta cần đảm bảo một vị trí trên bàn đàm phán."
 MISSION_BE_ON_GALACTIC_COUNCIL: "Nghị Viên Thiên Hà"
 BE_ON_GALACTIC_COUNCIL: "Có Chỗ Trong Hội Đồng Thiên Hà"
 MISSION_BE_ON_GALACTIC_COUNCIL_DESC: "Việc thành lập một hội đồng thiên hà là bước đi cần thiết để thiết lập các quy trình vì an ninh thiên hà.\n\nĐể được bầu làm §HThành Viên Hội Đồng§!, chúng ta phải:$TABBED_NEW_LINE$- Thông qua Nghị Quyết $resolution_galacticreforms_form_council$ trong §HCộng Đồng Thiên Hà§!$TABBED_NEW_LINE$- Đảm bảo rằng chúng ta nằm trong số ba đế chế hàng đầu trong cộng đồng, xếp hạng theo §HTrọng Lượng Ngoại Giao§!"
 MISSION_BE_CUSTODIAN: "Đứng Đầu Trong Hàng Đồng Nhiêu"
 BE_CUSTODIAN: "Được Bầu Làm Người Quản Thủ Thiên Hà"
 MISSION_BE_CUSTODIAN_DESC: "Trách nhiệm Quản Thủ là một gánh nặng. Một gánh nặng mà chúng ta sẽ gánh vác để phục vụ Thiên Hà.\n\nĐể trở thành §HNgười Quản Thủ§!, chúng ta phải:$TABBED_NEW_LINE$- Thông qua Nghị Quyết §H$resolution_galacticreforms_nominate_custodian$: [Root.GetName]§! trong §HCộng Đồng Thiên Hà§!"


#Events

 ambition.100.name: "Lá Chắn Thiên Hà"
 ambition.100.desc: "Thiên hà của chúng ta mong manh hơn vẻ bề ngoài. Nguy hiểm bủa vây từ mọi hướng: những kẻ săn mồi lẩn khuất trong hư không, hải tặc nơi các hệ sao bị lãng quên, những cuộc chiến nảy sinh từ kiêu ngạo và sợ hãi. Và quá thường xuyên, những kẻ nắm giữ quyền lực để hành động lại chọn cách im lặng.\n\nChúng ta sẽ không ngồi yên. Đây không phải lời tuyên bố thống trị, mà là lời cam kết phụng sự bảo hộ. Thông qua hành động thận trọng và mục đích chung, chúng ta sẽ đảm bảo thiên hà có một tương lai xứng đáng để bảo vệ."
 ambition.100.a: "Chúng ta sẽ làm những gì bắt buộc phải làm."

 ambition.105.name: "Bổn Phận Vô Tận"
 ambition.105.desc: "Hợp nhất thiên hà sẽ không thể đạt được chỉ bằng vũ lực hay ý chí đơn độc. Nó sẽ cần đến lòng tin, sự đối thoại và tinh thần sẵn sàng gánh vác những gánh nặng mà không ai khác dám gánh. Từng liên minh được thiết lập, từng cuộc khủng hoảng được hóa giải, là một bước nhỏ hướng tới một tương lai kiên cường hơn.\n\nChúng ta tìm kiếm không phải để cai trị, mà để dẫn dắt: đưa ra một bàn tay vững vàng khi người khác chùn bước. Công việc của chúng ta không mệt mỏi, và thường không nhận được lời cảm ơn, nhưng bổn phận này chính là sứ mệnh của chúng ta. Cùng nhau, chúng ta sẽ định hình một thiên hà trường tồn."
 ambition.105.a: "Chúng ta sống để phụng sự thiên hà."

 ambition.110.name: "Biểu Tượng Tự Do"
 ambition.110.desc: "Trong những thời khắc bất định, các biểu tượng vô cùng quan trọng. Thiên hà không chỉ cần sự bảo vệ, nó cần nguồn cảm hứng. Khi các mối đe dọa ngày càng táo tợn hơn và con đường phía trước mịt mờ tăm tối, kế hoạch của chúng ta đang dần thành hình: một đội tiên phong gồm những cá nhân xuất chúng, được tuyển chọn từ mọi ngóc ngách của không gian đã biết, những người sẽ hiện thân cho các lý tưởng mà chúng ta chiến đấu để bảo vệ.\n\nNhững Hiệp Sĩ Paladin này sẽ không chỉ đơn thuần chỉ huy hạm đội hay điều phối các nỗ lực cứu trợ. Họ phải là minh chứng sống động cho quyết tâm chung của chúng ta. Những người anh hùng, không phải của riêng một giống loài, mà của tất cả."
 ambition.110.a: "Họ sẽ là ánh sáng dẫn đường cho thiên hà."

 ambition.115.name: "Những Người Bảo Vệ Mang Lời Thề"
 ambition.115.desc: "Thiên hà đã cất lời, không phải trong sợ hãi, mà trong sự tin tưởng. Chúng ta đã được chọn làm Người Quản Thủ và được trao cho những quyền hạn vượt ra ngoài ranh giới của sự ủy quyền thông thường. Những đặc quyền phi thường này, dẫu sinh ra từ sự bức thiết, không phải là danh dự mà chúng ta mưu cầu. Chúng là những gánh nặng mà chúng ta chấp nhận, vì lợi ích của tất cả.\n\nChúng ta không sử dụng quyền uy này để ra lệnh, mà để phụng sự. Cho đến khi hòa bình không còn chỉ là một khoảng lặng giữa các cuộc chiến tranh, cho đến khi hiểm họa không còn rình rập ngoài các vì sao, chúng ta sẽ giữ trọn lời thề. Sẽ đến lúc phải từ bỏ những quyền lực này. Nhưng cho đến lúc đó, chúng ta sẽ sử dụng chúng với sự kiềm chế, mục đích rõ ràng và lòng quyết tâm kiên định."
 ambition.115.a: "Chúng ta xin thề điều này."

 ambition.120.name: "Những Người Hộ Vệ Thiên Hà"
 ambition.120.desc: "Chúng ta biết ngày này rồi sẽ đến. Bất chấp mọi nỗ lực hợp nhất và nâng tầm, thiên hà giờ đây phải đối mặt với một cuộc thanh toán mang tính sống còn. Kẻ thù này không hề biết đến khoan nhượng, không có thỏa hiệp. Nó đe dọa tất cả, và do đó chúng ta phải đứng lên vì tất cả.\n\nTừng liên minh được trui rèn và từng gian khổ trải qua đã đưa chúng ta đến khoảnh khắc này. Chúng ta không đứng trên thiên hà; chúng ta đứng lên vì thiên hà. Chống lại sự diệt vong, chống lại sự tuyệt vọng, chúng ta vươn mình. Không phải như những kẻ chinh phục, mà như những người hộ vệ.\n\nHôm nay, trong tất cả những ngày, chúng ta tuyệt đối không được chùn bước."
 ambition.120.a: "Vì Thiên Hà!"

 ambition.125.name: "Không Thể Chê Trách"
 ambition.125.desc: "Một thế hệ đại sứ mới nay đang sải bước trong các hành lang của Viện Nguyên Lão. Được đào tạo cẩn trọng, kiên nhẫn vô hạn và hết lòng tận tụy với đại nghĩa, họ phát biểu không chỉ bằng tài hùng biện, mà bằng sự chân thành, thể hiện cam kết của chúng ta về sự đoàn kết và hòa bình. Công việc của họ có thể không chiếm lĩnh các dòng tít đầu trang, nhưng họ là những nghệ nhân tỉ mỉ và chính xác của nền hòa bình và hợp tác lâu dài.\n\nTừng lời nói, từng cử chỉ, đều được hiệu chỉnh để củng cố một chân lý: chúng ta không tìm kiếm sự thống trị, chỉ tìm kiếm sự ổn định. Chúng ta không có gì phải che giấu, và do đó, không có gì phải sợ hãi."
 ambition.125.a: "Không có chiến thắng ngoại giao nào là quá nhỏ bé."

 ambition.130.name: "Khí Giới Biểu Tượng"
 ambition.130.desc: "Một biểu tượng không tự nhiên sinh ra, nó được tạo tác một cách cẩn trọng và có chủ đích. Nếu các anh hùng của chúng ta trở thành những ngọn hải đăng hy vọng, chiến hạm của họ phải phản ánh vai trò đó. Không chỉ là những tàu chiến đơn thuần; chúng phải là ngọn hải đăng dẫn lối chúng ta qua màn đêm u tối.\n\nThân tàu màu trắng và vàng, tượng mũi tàu sáng lấp lánh, cùng một thiết kế vừa thanh lịch vừa uy nghiêm. Bên dưới lớp vỏ là những gì tinh hoa nhất mà công nghệ của chúng ta có thể mang lại, không tiếc chi phí. Những con tàu này không chỉ mang theo hỏa lực, mà còn mang lại sự an tâm. Chúng là lực lượng tiên phong của một tầm nhìn: đoàn kết, sức mạnh và lòng kiên định không gì lay chuyển trước nguy cơ hủy diệt."
 ambition.130.a: "Họ sẽ thổi bùng ngọn lửa hy vọng."

 ambition.135.name: "Thứ Rình Rập"
 ambition.135.desc: "Các cuộc điều tra của chúng ta đã mang lại kết quả nghiệt ngã và không thể chối cãi. Trên khắp các đài quan sát không gian sâu, các trạm nghe lén mật và các kho dữ liệu cổ xưa, các dấu hiệu đều hội tụ: có thứ gì đó đang đến.\n\nĐây không phải là báo động giả, không phải một dị thường bị hiểu sai. Mối đe dọa là có thật, cận kề, và ở quy mô vượt khỏi năng lực phòng thủ thông thường. Chúng ta không còn thời gian để do dự. Mọi sự chuẩn bị mà chúng ta đã thực hiện giờ đây phải được hoàn tất. Thời khắc đã muộn mằn, nhưng chúng ta không hề bất ngờ. Hãy để chúng đến."
 ambition.135.a: "Nỗi sợ hãi sẽ phải học cách sợ hãi chúng ta."

 ambition.140.name: "Luôn Luôn Có Hai"
 ambition.140.desc: "Sự cảnh giác của chúng ta một lần nữa đã được chứng minh là đúng đắn. Ngay cả khi thiên hà gồng mình chống lại một mối đe dọa sinh tồn, chúng ta đã phát hiện ra sự rục rịch của một hiểm họa khác. Nó ẩn mình ngay ngoài tầm mắt, nhưng bằng chứng là không thể nhầm lẫn: mối nguy hiểm là có thật, và nó đang tiến tới.\n\nTuy nhiên lần này, chúng ta không bị bất ngờ. Chúng ta sẽ lại nắm quyền chủ động, tấn công trước khi nó có thể tập hợp toàn bộ sức mạnh. Trận chiến phía trước sẽ vô cùng tàn khốc, nhưng với yếu tố bất ngờ đứng về phía chúng ta, chúng ta không hề đối mặt với nó mà không có sự chuẩn bị. Hãy để các vì sao làm chứng: chúng ta sẽ không chùn bước. Không phải lúc này, không bao giờ."
 ambition.140.a: "Bổn phận không bao giờ kết thúc."

 ambition.200.name: "Sáng Kiến Hiệp Sĩ Paladin"
 ambition.200.desc: "Với việc thông qua nghị quyết, Sáng Kiến Hiệp Sĩ Paladin không còn là một ý niệm lý thuyết mà đã trở thành một dự án được phê chuẩn chính thức. Điều này đánh dấu sự khởi đầu của một nỗ lực phối hợp giữa các quốc gia thành viên nhằm phát triển học thuyết, nhân sự và các tiêu chuẩn vật tư cần thiết cho việc hiện thực hóa sáng kiến.\n\nTrong khi các thành viên của [global_event_country.GetCommunityOrImperium] sẽ đảm nhận việc tuyển mộ các Paladin của riêng họ, chúng ta vẫn phải giám sát quá trình phát triển một dòng chiến hạm tối tân hoàn toàn mới để họ sử dụng."
 ambition.200.a: "Hãy bắt tay vào việc thôi."
 ambition.205.name: "Chiến Hạm Paladin Đã Sẵn Sàng"
 ambition.205.desc: "Quá trình phát triển các chiến hạm Paladin đã hoàn tất. Một sự giao thoa giữa nét thanh lịch và sức mạnh uy vũ, chúng đứng sừng sững như những biểu tượng cho quyết tâm của chúng ta. Dẫu được trang bị vũ trang cho chiến tranh, mục đích của chúng là hòa bình, và chúng đóng vai trò như một lời hứa: rằng chúng ta sẽ có mặt ở đó, bất cứ nơi nào hiểm nguy nhất."
 ambition.205.a: "Giờ là lúc đóng một chiếc!"
 ambition.210.name: "Đề Cử Một Paladin"
 ambition.210.desc: "Chúng ta đã hoàn thành việc lắp ráp một chiến hạm Paladin. Thân tàu mạ vàng tỏa sáng êm dịu dưới ánh sao, và động cơ gầm vang đầy uy lực. Gần như là một tội lỗi khi gửi một tác phẩm nghệ thuật như vậy vào chiến trận.\n\nGiờ đây, chúng ta phải trao gửi nó cho một dũng sĩ xứng đáng với trọng trách, một người có lòng quyết tâm phản chiếu sức mạnh của con tàu, và lòng dũng cảm sẽ dẫn lối nó tiến thẳng vào trung tâm của bất kỳ bóng tối nào đang đón đợi."
 ambition.210.a: "Chỉ những kẻ cao quý nhất mới được phụng sự."
 ambition.216.name: "Nhánh Chuyên Môn Paladin"
 ambition.216.desc: "[Root.GetName], Paladin vừa được đề cử của chúng ta, đã thể hiện năng khiếu tuyệt vời trong vai trò §Y[Root.GetPaladinSubclass]§!. Chúng ta có thể định hướng [Root.GetHimHer] sang một chuyên môn khác, nhưng sẽ đòi hỏi những nỗ lực đáng kể không chỉ để huấn luyện họ mà còn định hình lại hình ảnh trước công chúng cho phù hợp với câu chuyện mới."
 ambition.216.a: "Không cần can thiệp."
 ambition.216.b: "Huấn luyện [Root.GetHimHer] thành một §Y$leader_trait_paladin_ace$§!"
 ambition.216.c: "Huấn luyện [Root.GetHimHer] thành một §Y$leader_trait_paladin_strategist$§!"
 ambition.216.d: "Huấn luyện [Root.GetHimHer] thành một §Y$leader_trait_paladin_ambusher$§!"
 ambition.216.e: "Huấn luyện [Root.GetHimHer] thành một §Y$leader_trait_paladin_logistician$§!"
 ambition.216.f: "Huấn luyện [Root.GetHimHer] thành một §Y$leader_trait_paladin_defender$§!"
 ambition.216.g: "Huấn luyện [Root.GetHimHer] thành một §Y$leader_trait_paladin_spearhead$§!"
 ambition.216.h: "Huấn luyện [Root.GetHimHer] thành một §Y$leader_trait_paladin_knight$§!"
 ambition.225.name: "Giải Tán Lực Lượng Paladin"
 ambition.225.desc: "Khi các mối đe dọa trước mắt đối với sự ổn định của thiên hà đã được kiềm chế và nhiệm vụ đã hoàn thành, sáng kiến Paladin đã đi đến hồi kết tự nhiên của nó. Theo các điều khoản được ủy nhiệm, đơn vị sẽ giải ngũ. Các chiến hạm của họ sẽ ngừng hoạt động, cơ cấu chỉ huy của họ sẽ giải thể.\n\nCác Paladin chỉ để lại ký ức về sự phụng sự dâng hiến trong giờ khắc hiểm nghèo của thiên hà. Hành động của họ đã giành được sự kính trọng vượt qua mọi biên giới, và việc giải tán họ không phải là sự phản ánh của thất bại, mà là của thành công. Hòa bình, rốt cuộc, không cần đến những dũng sĩ tiên phong."
 ambition.225.a: "Vinh danh những bậc quả cảm."
 ambition.230.name: "Kiểm Soát Trực Tiếp"
 ambition.230.desc: "Trước tình hình chiến sự leo thang và nhu cầu phối hợp quân sự thống nhất ngày càng gia tăng, Tiên Phong Paladin đã chính thức được đặt dưới quyền chỉ huy của Người Quản Thủ. Dẫu nhiệm vụ ban đầu của họ nhấn mạnh tính độc lập và sự hợp tác sâu rộng, hoàn cảnh hiện tại đòi hỏi một chuỗi thẩm quyền trực tiếp hơn.\n\nQuyết định này không được đưa ra một cách xem nhẹ. Các Paladin vẫn là những nhân vật được kính trọng, nhưng giờ đây họ phục vụ trong hệ thống thứ bậc đã được thiết lập của lực lượng chiến lược của chúng ta. Khi chúng ta cần họ hơn bao giờ hết, các chiến dịch của họ sẽ tiếp tục nhưng như một lực lượng phối hợp thay vì các đặc vụ tự hành. Sứ mệnh không hề thay đổi."
 ambition.230.a: "Một sự cần thiết đáng tiếc."
 ambition.235.name: "Từ Bỏ Quyền Kiểm Soát"
 ambition.235.desc: "Khi cuộc khủng hoảng trước mắt đã lắng xuống và quyền chỉ huy tập trung không còn được coi là cần thiết, quyền kiểm soát hoạt động của Tiên Phong Paladin đã được trả lại về khuôn khổ ban đầu. Sự giám sát trực tiếp của Người Quản Thủ đã kết thúc, và các Paladin sẽ một lần nữa hành động dưới quyền của các thành viên Hội Đồng Thiên Hà.\n\nSự khôi phục quyền tự chủ này tái khẳng định cam kết của chúng ta về tính minh bạch và lòng tin đa phương. Các Paladin vẫn là biểu tượng của sự đoàn kết, không phải sự phục tùng. Họ không được phục vụ bất kỳ một thế lực đơn lẻ nào, mà là ý chí tập thể."
 ambition.235.a: "Vạn tuế các Paladin!"
 ambition.325.name: "Hòa Bình Rốt Cuộc Đã Tới"
 ambition.325.desc: "Các mối đe dọa đã qua đi. Thiên hà, từng đứng bên bờ vực thẳm, nay đang bước vào thời kỳ hồi sinh trong sự thận trọng. Không còn trọng trách nào cần hoàn thành, chúng ta đã thực hiện bước đi cuối cùng: quyền lực của Người Quản Thủ đã được giao nộp lại. Những gì bắt đầu như một phản ứng trước khủng hoảng đã kết thúc như một hành động của lòng tin.\n\nCác liên minh chúng ta đã xây dựng, tấm gương chúng ta đã nêu lên. Đó sẽ là di sản của chúng ta. Khi lựa chọn dẫn dắt mà không cai trị, chở che mà không chiếm hữu, chúng ta đã giữ vững các nguyên tắc của mình. Các vì sao đã an toàn, vào lúc này, và điều đó là quá đủ."
 ambition.325.a: "Chúng ta có thể nghỉ ngơi được rồi."

