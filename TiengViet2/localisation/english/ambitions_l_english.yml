 no_defender_of_the_galaxy: "$TRIGGER_FAIL$Người Hộ Vệ Thiên Hà không thể trở thành Hoàng Đế Thiên Hà"

 resolution_custodian_paladin_initiative: "Sáng Kiến Hiệp Sĩ Paladin"
 resolution_custodian_paladin_initiative_desc: "Thiên hà cần nguồn cảm hứng, những hình tượng gần gũi để mang lại bộ mặt thân thiện cho các hạm đội của chúng ta và dẫn dắt lực lượng tới chiến thắng."
 resolution_custodian_paladin_initiative_tooltip: "Mở khóa Dự Án Đặc Biệt §Y$PALADIN_SHIP_PROJECT$§! cho phép chúng ta triển khai những người hùng truyền cảm hứng trên các chiến hạm đặc biệt."

 resolution_needs_gdf: "$TRIGGER_FAIL$Yêu cầu thông qua nghị quyết §HLực Lượng Phòng Thủ Thiên Hà§!"

 resolution_custodian_disband_paladin_initiative: "Giải Tán Các Hiệp Sĩ Paladin"
 resolution_custodian_disband_paladin_initiative_desc: "Thời kỳ của các anh hùng đã qua đi. Chúng ta cảm ơn các Paladin vì sự cống hiến của họ, và biết rằng họ sẽ luôn sẵn sàng chiến đấu vì sự an toàn của chúng ta nếu nhu cầu lại phát sinh."

 resolution_category_crisis_analysis: "$crisis_analysis$"
 crisis_analysis: "Phân Tích Khủng Hoảng"
 crisis_analysis_upkeep_modifier: "Chi Phí Duy Trì $crisis_analysis$"
