 # Intemporal Orb
 INTEMPORAL_ORB_CAT:0 "Khối Cầu"
 INTEMPORAL_ORB_CAT_DESC:0 "Chúng ta đã phát hiện nguồn năng lượng tập trung mạnh mẽ dưới dạng một khối cầu. Nên tiến hành điều tra."

 ## Event: Concentrated Energy
 anomaly.7105.name:0 "Năng Lượng Đậm Đặc"
 anomaly.7105.desc:0 "Nguồn gốc của các chỉ số năng lượng bất thường được ghi nhận trên [From.GetName] được xác nhận là một khối cầu nhỏ màu xanh lam. Các [Owner.GetScientistPlural] báo cáo rằng các cảm biến bắt được các tachyon có phân cực đảo ngược.\n\nCác biểu tượng được khắc vào mặt đất xung quanh vật thể, có lẽ do một nền văn minh cổ xưa hơn để lại. Vẫn chưa rõ liệu chúng mang ý nghĩa chỉ dẫn hay cảnh báo.\n\nToàn bộ văn khắc còn lâu mới dịch xong, nhưng các biểu tượng riêng lẻ dường như liên quan đến việc đo lường thời gian và vị trí tương đối của các thiên thể trong hệ sao [Solar_System.GetName]."
 anomaly.7105.a.standard:0 "Nghiên cứu khối cầu."
 anomaly.7105.a.devouring:0 "Ăn khối cầu."
 anomaly.7105.b:0 "Quá nguy hiểm, hãy rời đi!"

 ## Event: Local Time Reversal
 anomaly.7110.name:0 "Đảo Ngược Thời Gian Cục Bộ"
 anomaly.7110.desc:0 "Khối cầu năng lượng màu xanh lam lần đầu được phát hiện trên [FromFrom.GetName] đã biến mất. Một cuộc quét địa điểm không cho thấy bất kỳ dấu vết nào của khối cầu kỳ lạ. Đáng hoang mang hơn nữa là việc xóa sạch các dấu vết trên mặt đất: cứ như thể chúng chưa từng ở đó.\n\nDựa trên các chỉ số tachyon bất thường mà chúng ta phát hiện tại địa điểm, các [Owner.GetScientistPlural] đưa ra giả thuyết rằng cả khối cầu và các dòng chữ đều đang dịch chuyển ngược dòng thời gian."

 ## Event: Timeless
 anomaly.7115.name:0 "Thời Gian Trôi Như Dòng Sông"
 ### Regular empires are non-gestalt empires with a non-robot scientist
 anomaly.7115.desc.regular:0 "Trong khi làm việc tại địa điểm trên [FromFrom.GetName], [Root.GetLeaderName] đã vô tình chạm vào khối cầu màu xanh lam.\n\n[leader.GetHeSheCap] sau đó mô tả một viễn cảnh thời gian trải dài như một dòng sông chảy vào tương lai và quá khứ vô tận. Trước mặt [leader.GetHimHer], năng lượng màu xanh lam phóng ra từ dòng thời gian và được hấp thụ vào cơ thể của [leader.GetHisHer]. Mặc dù sự cố được các [Owner.GetScientistPlural] khác đo lường chính xác là chỉ kéo dài chưa đầy một giây, [leader.GetHeShe] đã trải nghiệm nó trong hơn một giờ.\n\nSau khi linh ảnh kết thúc, [Root.GetLeaderName] chắc chắn rằng thời gian sẽ không còn ảnh hưởng đến [leader.GetHimHer] nữa. Với cả một cuộc đời vô tận phía trước, [leader.GetHeShe] muốn dùng thời gian bất tận của [leader.GetHisHer] để tự mình khám phá vũ trụ."
 ### Scientist is already immortal
 anomaly.7115.desc.immortal:0 "Trong khi làm việc tại địa điểm trên [FromFrom.GetName], [Owner.GetScientist] cấp dưới [intemporal_leader.GetName] đã vô tình chạm vào khối cầu màu xanh lam.\n\n[intemporal_leader.GetHeSheCap] sau đó miêu tả một viễn tượng thời gian trải dài như dòng sông vươn tới tương lai và quá khứ vô tận. Trước mặt [intemporal_leader.GetHimHer], năng lượng màu xanh uốn lượn thoát ra khỏi dòng thời gian và được hấp thụ vào cơ thể của [intemporal_leader.GetHisHer]. Mặc dù sự việc được các [Owner.GetScientistPlural] khác đo đạc chính xác là diễn ra chưa đầy một giây, [intemporal_leader.GetHeShe] đã trải nghiệm nó hơn một giờ.\n\nSau khi linh tượng kết thúc, [intemporal_leader.GetName] tin chắc rằng thời gian sẽ không còn tác động lên [intemporal_leader.GetHimHer] nữa. Với cuộc đời vô tận phía trước, [intemporal_leader.GetHeShe] muốn sử dụng thời gian bất tận của [intemporal_leader.GetHisHer] để tự mình khám phá vũ trụ."
 ### Empire is a gestalt consciousness (hive or machine intelligence)
 anomaly.7115.desc.hive:0 "Trong khi làm việc tại địa điểm trên [FromFrom.GetName], [Root.GetLeaderName] đã vô tình chạm vào khối cầu màu xanh lam.\n\n[leader.GetHeSheCap] nhận được một viễn tượng thời gian trải dài như dòng sông vươn tới tương lai và quá khứ vô tận. Trước mặt [leader.GetHimHer], năng lượng màu xanh phóng ra từ dòng thời gian và được cơ thể của [leader.GetHisHer] hấp thụ. Mặc dù sự việc được các [Owner.GetScientistPlural] khác đo đạc chính xác là diễn ra chưa đầy một giây, [leader.GetHeShe] đã trải nghiệm nó hơn một giờ.\n\nSau khi linh tượng kết thúc, chúng ta tin chắc rằng thời gian sẽ không còn ảnh hưởng đến [Root.GetLeaderName] nữa. Với cuộc đời vô tận phía trước, chúng ta có thể dùng thời gian bất tận của [leader.GetHisHer] để tự mình khám phá vũ trụ."
 ### Empire is devouring swarm
 anomaly.7115.desc.devouring:0 "[Root.GetLeaderName] đã ăn khối cầu màu xanh lam trên [FromFrom.GetName].\n\n[leader.GetHeSheCap] nhận được một viễn tượng thời gian trải dài như dòng sông vươn tới tương lai và quá khứ vô tận. Trước mặt [leader.GetHimHer], năng lượng màu xanh phóng ra từ dòng thời gian và được hấp thụ vào cơ thể của [leader.GetHisHer]. Mặc dù sự việc được các [Owner.GetScientistPlural] khác đo đạc chính xác là diễn ra chưa đầy một giây, [leader.GetHeShe] đã trải nghiệm nó hơn một giờ.\n\nSau khi linh tượng kết thúc, chúng ta tin chắc rằng thời gian sẽ không còn ảnh hưởng đến [Root.GetLeaderName] nữa. Với cuộc đời vô tận phía trước, chúng ta có thể dùng thời gian bất tận của [leader.GetHisHer] để tự mình khám phá vũ trụ."

 anomaly.7115.a:0 "Được thôi, chúc thượng lộ bình an!"
 anomaly.7115.a.regular.tt:0 "[intemporal_leader.GetName] nhận một phi thuyền nhỏ để tự mình du hành các vì sao.\nPhải chỉ định một §HNhà Khoa Học§! mới để chỉ huy [From.GetName]."
 anomaly.7115.a.immortal.tt:0 "[intemporal_leader.GetName] nhận một phi thuyền nhỏ để tự mình du hành các vì sao."
 anomaly.7115.b.regular:0 "Không, hãy ở lại vị trí của bạn."
 anomaly.7115.b.immortal:0 "Không, bạn đã được thăng chức."
 anomaly.7115.b.regular.tt:0 "[intemporal_leader.GetName] tiếp tục tại nhiệm."
 anomaly.7115.b.immortal.tt:0 "[intemporal_leader.GetName] sẵn sàng nhận nhiệm vụ như một §HNhà Khoa Học§! mới."

 ## Event: The Return
 anomaly.7120.name:0 "Sự Trở Về"
 anomaly.7120.desc.regular:0 "Các cuộc quét tầm xa đã bắt được một con tàu đang tiếp cận gần [Root.Capital.GetName]. Khi nó tiến lại gần hơn, rõ ràng thiết kế của con tàu trùng khớp với tàu của chính chúng ta từ một thế kỷ trước.\n\nSau khi mở kênh liên lạc, chúng ta phát hiện con tàu được điều khiển bởi [intemporal_explorer.GetName], [Owner.GetScientist] người từng bị tách khỏi dòng thời gian bởi một khối cầu năng lượng màu xanh lam.\n\n[intemporal_explorer.GetHeSheCap] lẩm bẩm về những ngôi sao neutron va chạm và các giếng trọng lực không-thời gian nghịch đảo, trước khi đưa con tàu quay trở lại bóng tối hư không. Đáng chú ý là các nhà vật lý của chúng ta đã xác nhận rằng phần lớn thông tin này không chỉ có thể kiểm chứng được, mà thực sự mang tính đột phá.\n\n[intemporal_explorer.GetName] dường như không hề thay đổi về mặt thể chất trước sự trôi qua của thời gian, nhưng ngay cả công nghệ hiện tại của chúng ta cũng không thể giải thích chức năng của khối cầu. Trừ khi gặp phải sự hủy diệt chí tử, [intemporal_explorer.GetHeShe] sẽ tiếp tục khám phá vũ trụ cho đến ngày tận thế."
 anomaly.7120.desc.hive:0 "Các cuộc quét tầm xa phát hiện một con tàu đang tiến gần [Root.Capital.GetName]. Khi nó đến gần hơn, rõ ràng thiết kế của con tàu khớp với tàu của chúng ta từ một thế kỷ trước. Chúng ta phát hiện ra rằng con tàu được điều khiển bởi [intemporal_explorer.GetName], [Owner.GetScientist] người từng bị tách khỏi dòng thời gian bởi một khối cầu năng lượng xanh lam.\n\nMột lần nữa hội ngộ cùng chúng ta, tri thức tuôn chảy từ [Owner.GetScientist] vào tâm trí tập thể: những ấn tượng cảm giác về các ngôi sao neutron va chạm và các giếng trọng lực không-thời gian nghịch đảo. Khi việc truyền tải hoàn tất, con tàu tiếp tục lao vào bóng tối. Đáng chú ý là các [Owner.GetScientistPlural] vật lý của chúng ta đã xác nhận rằng phần lớn dữ liệu này không chỉ có thể kiểm chứng, mà thực sự mang tính đột phá.\n\n[intemporal_explorer.GetName] dường như không hề thay đổi về mặt thể chất theo thời gian, nhưng ngay cả công nghệ hiện tại của chúng ta cũng không thể giải thích chức năng của khối cầu. Trừ phi bị hủy diệt hoàn toàn, [intemporal_explorer.GetHeShe] sẽ tiếp tục khám phá vũ trụ cho đến ngày tận thế."

 DATA_DIAMOND_CAT:0 "Lớp Băng Mỏng"
 DATA_DIAMOND_CAT_DESC:0 "Lớp băng nông trên bề mặt [From.GetName] bao phủ một mỏ tinh thể lớn bất thường. Chúng ta cũng đang phát hiện sự hiện diện của một tín hiệu mờ nhạt."
 DATA_DIAMOND_PROJECT:0 "Nghiên Cứu Mỏ Tinh Thể [From.GetName]"
 DATA_DIAMOND_PROJECT_DESC:0 "Những tín hiệu gây mất phương hướng phát ra từ tinh thể trên [From.GetName] là một điều gây tò mò. Khuyến nghị nên nghiên cứu thêm."
 anomaly.3145.name:0 "Ảo Giác Khoan Băng"
 anomaly.3145.desc:0 "Sau khi chuẩn bị khoan vào lớp băng trên [From.GetName], [Root.GetLeaderName] đã trải qua những cảm giác mãnh liệt. Dù không bị tổn hại về thể chất, họ báo cáo ban đầu bị choáng ngợp bởi những ảo giác thị giác và khứu giác rời rạc khắc họa một chủng tộc người ngoài hành tinh chưa từng biết.\n\nMột dự án đặc biệt đã được chuẩn bị để điều tra sâu hơn mỏ tinh thể kỳ lạ này."
 anomaly.3145.a:0 "Thật đáng bối rối."
 anomaly.3150.name:0 "Kim Cương Dữ Liệu"
 anomaly.3150.desc:0 "Bên dưới lớp băng, bản thân khối tinh thể chiếm phần lớn khối lượng của hành tinh. Các mẫu vật phân tích chỉ ra rằng một mạng tinh thể nhân tạo có mật độ cực cao được sử dụng để lưu trữ dữ liệu. Các ước tính cho thấy dung lượng tri thức được lưu trữ vượt trội hơn gấp nhiều lần so với toàn bộ cơ sở dữ liệu tập thể của chúng ta.\n\nRất có thể những người xây dựng nên tinh thể này đã sử dụng sự cộng hưởng tâm linh để ghi dữ liệu. [Root.GetLeaderName] tò mò đến mức họ đã xin phép được giám sát việc xây dựng một trạm nghiên cứu tự động trên bề mặt."
 anomaly.3150.a:0 "Nghiên cứu nó từ quỹ đạo là đủ rồi."
 anomaly.3150.b:0 "Chúc may mắn dưới đó, [Root.GetLeaderName]."
 anomaly.3150.c:0 "Khai thác tinh thể để lấy tài nguyên."
 anomaly.3165.name:0 "Thật Uổng Phí Nếu Bỏ Đi"
 anomaly.3165.desc:0 "Gần đến lúc hoàn thành trạm nghiên cứu tự động, có một sự đột biến đột ngột trong hoạt động của tinh thể khiến [Root.GetLeaderName] tử nạn. Không lâu sau đó, chúng ta nhận được một thông điệp tự động tuyên bố là đến từ [leader.GetHimHer].\n\nMặc dù hệ thần kinh trên cơ thể của họ đã hư hỏng không thể cứu vãn, tâm trí của họ đã bị mắc kẹt bên trong tinh thể. Tận dụng tối đa hoàn cảnh mới của [leader.GetHisHer], [leader.GetSheHe] đã đề nghị hỗ trợ bất kỳ nghiên cứu nào trong tương lai về cơ sở dữ liệu tinh thể này."
 anomaly.3165.a:0 "Một kết cục vừa buồn vừa vui."
 anomaly.3150.a.tooltip:0 "Một mỏ nghiên cứu nhỏ sẽ được thêm vào [FromFromFrom.GetName]."
 anomaly.3150.b.tooltip:0 "Một mỏ nghiên cứu lớn sẽ được thêm vào [FromFromFrom.GetName], nhưng điều này có thể gây nguy hiểm cho [Root.GetLeaderName]."
 anomaly.3150.c.tooltip:0 "Một mỏ tinh thể hiếm sẽ được thêm vào [FromFromFrom.GetName]. Chúng ta có thể khai thác nó nếu có công nghệ phù hợp."

 ###Event: Holding Pattern

 #Modifiers
 reassured_tracking: "Hệ Thống Theo Dõi Trấn An"
 reassured_tracking_desc: "Một hệ thống theo dõi tập trung đang giám sát dân chúng. Mặc dù sự lo âu tập thể vẫn còn dai dẳng, việc biết rằng chính quyền đang hành động giúp thuộc địa duy trì được sự ổn định."
 collective_autophobia: "Chứng Sợ Cô Đơn Tập Thể"
 collective_autophobia_desc: "Nỗi sợ hãi tập thể về việc bị mất tích đã bóp nghẹt thuộc địa này. Sự thôi thúc muốn ở gần sát bên nhau đã làm chậm lại các hoạt động thường nhật."
 freed_stasis_criminals: "Tội Phạm Đình Trệ Được Trả Tự Do"
 freed_stasis_criminals_desc: "Phần lớn các tù nhân được thả là những tội phạm cộm cán. Cú sốc văn hóa mà họ đang trải qua khiến việc tái hòa nhập gặp khó khăn và tỷ lệ tội phạm đã tăng vọt."
 freed_stasis_dissidents: "Những Kẻ Bất Đồng Chính Kiến Được Trả Tự Do"
 freed_stasis_dissidents_desc: "Phần lớn các tù nhân là những người bất đồng chính kiến. Họ đang nhiệt tình chia sẻ nghệ thuật và văn hóa của mình với thuộc địa."

 #Events
 colony.9900.name: "Điểm Danh Buổi Sáng Bị Bỏ Lỡ"
 colony.9900.desc: "Gần đây, nhiều [Owner.GetColonistPlural] đã mất tích trên [Root.GetName]. Quy luật duy nhất có thể nhận thấy là mỗi người đều ở một mình vào thời điểm họ biến mất. Khi tin tức bắt đầu lan truyền, nỗi sợ hãi tập thể khi đi lại không có người hộ tống đã bao trùm lấy thuộc địa. Tình trạng bất an này đang gây ra những vấn đề đáng kể cho các hoạt động thường ngày của chúng ta."
 colony.9900.a: "Triển khai các quy trình theo dõi."
 colony.9900.a.tooltip: "§Y100§! £pop£ §HDân cư§! đã mất tích khỏi [Root.GetName]. Một hệ thống theo dõi đắt tiền sẽ được sử dụng để giúp chúng ta giải mã bí ẩn này."
 colony.9900.b: "Không cần phải hoảng sợ."
 colony.9900.b.tooltip: "§Y100§! £pop£ §HDân cư§! đã mất tích khỏi [Root.GetName]."
 colony.9905.name: "Lần Quét May Mắn"
 colony.9905.desc.a: "Nhờ việc triển khai hệ thống theo dõi trên [Root.GetName], chúng ta đã có một manh mối quan trọng.\n\nNgay khi một trong những [Owner.GetColonistPlural] gần đây nhất của chúng ta biến mất, chúng ta đã lập tức theo dõi bằng một đợt quét tọa độ phát tín hiệu cuối cùng của họ. Dấu vết suy biến của các hạt mang điện tích đã được tìm thấy trong mỗi trường hợp.\n\nChúng ta đã thiết lập một dự án đặc biệt để xác định bản chất thực sự của các hạt này và sự liên quan của chúng đến các [Owner.GetColonistPlural] mất tích của chúng ta."
 colony.9905.desc.b: "Chúng ta đã có một bước đột phá may mắn trên [Root.GetName]! Chúng ta đã phát hiện ra vị trí của [Owner.GetColonistPlural] mất tích gần đây nhất. Một cuộc quét chi tiết khu vực đã hé lộ dấu vết phân rã của các hạt tích điện.\n\nChúng ta đã thiết lập một dự án đặc biệt để xác định bản chất thực sự của các hạt này và sự can dự của chúng đối với các [Owner.GetColonistPlural] mất tích của chúng ta."
 colony.9905.a: "Điều tra ngọn ngành sự việc này."
 colony.9905.a.tooltip: "Một dân cư khác mất tích khỏi [Root.GetName]."
 colony.9910.name: "Chế Độ Đợi"
 colony.9910.desc: "Lấy các hạt tàn dư làm tham chiếu, một cuộc quét trên toàn hệ sao đã phát hiện bằng chứng về các hạt này bên trong mặt trăng của [Root.GetName].\n\nViệc tìm kiếm trên bề mặt mặt trăng đã phát hiện một vài cửa khóa khí nhỏ bị chôn vùi dưới nhiều thế kỷ bụi bặm. Bên trong là một khu phức hợp bị bỏ hoang gồm các văn phòng hành chính, máy dịch chuyển vật chất tầm xa và hệ thống điều khiển trường lực kết nối với mạng lưới các khoang đình trệ cực kỳ tiên tiến.\n\nBị đóng băng trong các khoang là nhiều cá thể, bao gồm cả những người thực dân mất tích của chúng ta. Hầu như không còn nghi ngờ gì nữa, cơ sở này từng hoạt động như một nhà tù. Chúng ta vẫn chưa xác định được lý do tại sao họ bị bắt và làm thế nào để giải thoát cho họ."
 colony.9910.a: "Xuất sắc"
 colony.9915.name: "Thoát Khỏi Mặt Trăng"
 colony.9915.desc: "Không hề có một âm mưu nào, các [Owner.GetColonistPlural] mất tích của chúng ta bị giam giữ đơn thuần là do một sự cố kỹ thuật.\n\nMột lỗi máy tính đã kích hoạt lại hệ thống dịch chuyển cũ kỹ của nhà tù và nhận diện ngẫu nhiên các [Owner.GetColonistPlural] của chúng ta là có tội. Các kiến trúc sư của cơ sở đã sử dụng các khoang này cho cả mục đích giam giữ tù nhân lẫn tái giáo dục. Việc giải thoát người của chúng ta tương đối dễ dàng, nhưng nhiều tù nhân nguyên bản vẫn còn kẹt trong các trường đình trệ. Hoàn toàn có thể trả tự do cho họ, mặc dù việc thiếu hồ sơ nhà tù đồng nghĩa với việc chúng ta không thể biết hết quá khứ tội phạm của họ.\n\nNgoài ra, chúng ta có thể khôi phục lại nhà tù, trao quyền kiểm soát hệ thống dịch chuyển cho các cai ngục đặc biệt."
 colony.9915.a: "Một thiết bị hữu ích cho những [Owner.GetColonistPlural] ngỗ nghịch."
 colony.9915.a.tooltip: "Những [Owner.GetColonistPlural] mất tích của chúng ta sẽ quay trở lại. Chúng ta sẽ có được một nhà tù đình trệ có thể hoạt động."
 colony.9915.b: "Không một ai đáng phải ở trong một nhà tù như thế này."
 colony.9915.b.tooltip: "Những [Owner.GetColonistPlural] mất tích của chúng ta sẽ quay về và chúng ta sẽ đóng cửa nhà tù. Các tù nhân còn lại sẽ được thả, điều này có thể gây ra những tác động tiêu cực cho thuộc địa."
 colony.9915.c: "Thiết lập một chương trình phóng thích từng bước."
 colony.9915.c.tooltip: "Chúng ta sẽ sàng lọc và hỗ trợ các cá nhân khi họ rời khỏi nhà tù, tạo điều kiện cho một quá trình chuyển đổi suôn sẻ hơn cho thuộc địa."
 colony.9915.d: "Những bữa ăn đóng gói sẵn ư? Tuyệt vời."
 colony.9915.d.tooltip: "Những [Owner.GetColonistPlural] mất tích của chúng ta sẽ trở về. Chúng ta sẽ chuyển đổi nhà tù thành nhà máy thực phẩm, cho phép bầy đàn đánh chén những tù nhân trong khoang đình trệ."
 colony.9920.name: "Những Kẻ Hàng Xóm Xấu Xa"
 colony.9920.desc: "Hầu hết các tù nhân được thả trên [Root.GetName] đều là những tên tội phạm cộm cán. Việc nhóm người này đột ngột được trả tự do đã gây ra nhiều vấn đề cho thuộc địa."
 colony.9920.a: "Thật đáng tiếc."
 colony.9925.name: "Một Tập Hợp Hỗn Tạp"
 colony.9925.desc: "Các tù nhân được trả tự do trên [Root.GetName] là sự pha trộn giữa tội phạm cộm cán và những người bất đồng chính kiến: nghệ sĩ, nhà văn và nhạc sĩ.\n\nTrong khi các tù nhân văn hóa vui vẻ chia sẻ kiến thức của họ với chúng ta, thì nhiều tên tội phạm do không còn lựa chọn nào khác đã quay trở lại con đường cũ."
 colony.9925.a: "Đã ghi nhận."
 colony.9930.name: "Những Người Hàng Xóm Tốt"
 colony.9930.desc: "Gần như tất cả tù nhân được thả trên [Root.GetName] đều là những người bất đồng chính kiến: nghệ sĩ, nhà văn và nhạc sĩ.\n\nHọ đang vui vẻ chia sẻ văn hóa và kiến thức của mình với chúng ta sau khi được trao trả tự do."
 colony.9930.a: "Xuất sắc."

