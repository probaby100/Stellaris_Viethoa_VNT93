## Event Chain: Rapid Desertification
 RAPID_DESERTIFICATION_CAT: "Sa Mạc Hóa Nhanh Chóng"
 RAPID_DESERTIFICATION_CAT_DESC: "Hình ảnh chụp từ trên không về thảm thực vật đang suy giảm nhanh chóng của [From.Planet.GetName] có thể cho thấy sự hiện diện của một dạng sống chưa xác định đang cư trú trên bề mặt."
 anomaly.7135.name: "Nhận Diện Hệ Động Vật Ngoại Lai"
 anomaly.7135.desc: "Chúng ta đã tìm thấy sự sống trên [desertling_planet.GetName]. Những đàn thú có vú nhỏ không có tri giác rộng lớn đang lang thang khắp toàn bộ bề mặt hành tinh.\n\nQuần thể của chúng, được các nhà khoa học đặt tên là 'desertling', đang gia tăng với tốc độ đáng báo động. Hành tinh này đã vượt quá sức chứa, và hệ sinh thái đang suy thoái nhanh chóng."
 anomaly.7135.a: "Điều tra lý do tại sao điều này lại xảy ra vào lúc này."
 anomaly.7135.b: "Tốt nhất là không can thiệp."
 anomaly.7135.b.tooltip: "Chúng ta sẽ giám sát tình hình từ xa."
 RAPID_DESERTIFICATION_PROJECT: "Hệ Sinh Thái Bị Đè Nặng"
 RAPID_DESERTIFICATION_PROJECT_DESC: "Hành tinh [desertling_planet.Planet.GetName] đang bị quá tải bởi một đàn động vật có vú lan rộng nhanh chóng. Với các nguồn lực thích hợp, các nhà khoa học của chúng ta có thể thu thập thêm hiểu biết về nguồn gốc và khả năng của loài không có tri giác này."
 anomaly.7140.name: "Loài Xâm Lấn"
 anomaly.7140.desc: "Trong khi nghiên cứu các sinh vật desertling trên [desertling_planet.GetName], các nhà khoa học của chúng ta đã có một quan sát then chốt. Bất chấp sự phổ biến khắp nơi của loài này, hoàn toàn không có hồ sơ hóa thạch tương ứng nào. Những kẻ xâm nhập sinh thái này đã gây ra thiệt hại môi trường nghiêm trọng trong một khoảng thời gian tương đối ngắn, và rất có thể đã được vận chuyển đến đây bởi một tác nhân bên ngoài.\n\nNhu cầu can thiệp cấp bách đã trở nên hoàn toàn rõ ràng. Nếu không hành động, những sinh vật này sẽ phá hủy những gì còn lại của hệ sinh thái tự nhiên của hành tinh này."
 anomaly.7140.a: "Chúng ta sẽ nhận nuôi càng nhiều sinh vật này càng tốt."
 anomaly.7140.a.tooltip: "Chúng ta sẽ chịu trách nhiệm cho hành động của chúng."
 anomaly.7140.b: "Ban hành các biện pháp kiểm soát số lượng động vật."
 anomaly.7140.b.tooltip: "Các chỉnh sửa di truyền chọn lọc có thể được dùng để hạn chế sự phát triển..."
 anomaly.7140.c: "Tiêu diệt lũ dã thú."
 anomaly.7140.c.tooltip: "Hành tinh phải được bảo vệ bằng mọi giá."
 anomaly.7140.d: "Chúng ta sẽ bắt một số con làm gia súc."
 anomaly.7140.d.tooltip: "Chúng ta sẽ lấy hai nô lệ cho mỗi thuộc địa."
 POPULATION_CONTROL_PROJECT: "Kiểm Soát Quần Thể"
 POPULATION_CONTROL_PROJECT_DESC: "Để cứu vãn trạng thái sinh thái của [desertling_planet.GetName], sự phát triển dân số theo cấp số nhân của hệ động vật xâm lấn phải bị ngăn chặn. Các nhà khoa học của chúng ta cần thời gian và tài nguyên để tìm ra giải pháp khả thi."
 anomaly.7145.name: "Biến Cố Tuyệt Chủng"
 anomaly.7145.base: "đã khuất phục trước sự tàn phá của những loài động vật có vú sinh sản theo cấp số nhân. Sự im lặng sâu thẳm bao trùm cảnh quan hoang tàn nay, nơi mọi dấu vết của thảm thực vật đã bị ngấu nghiến đến tận gốc rễ.\n\nBản thân các loài động vật có vú ăn tạp nằm bất động, hoặc chết vì đói, hoặc bị đồng loại ăn thịt khi nạn đói tiếp diễn."
 anomaly.7145.desc: "Chúng ta nhận được tin rằng [desertling_planet.GetName], $anomaly.7145.base$"
 anomaly.7145.b.desc: "Chúng ta nhận được tin rằng [desertling_planet.GetName] $anomaly.7145.base$"
 anomaly.7145.a: "Ít nhất thì nỗi đau khổ giờ đây đã kết thúc."
 anomaly.7145.b: "Thuộc địa của chúng ta đã bị phá hủy."
 anomaly.7150.name: "Thiên Nhiên Hồi Sinh"
 anomaly.7150.desc: "Sau một nỗ lực gian khổ nhằm triệt sản và biến đổi gen loài desertling trên [desertling_planet.GetName], quần thể của chúng cuối cùng đã giảm xuống mức bền vững.\n\nKhông còn số lượng động vật gặm cỏ áp đảo, một trạng thái cân bằng mong manh đã xuất hiện. Thiên nhiên đang tự phục hồi nhanh chóng, khi những mảng cỏ tươi non bắt đầu nảy mầm trên sa mạc từng cằn cỗi."
 anomaly.7150.a: "Một thiên đường ẩn giấu."
 anomaly.7155.name: "Sa Mạc Đỏ"
 anomaly.7155.desc: "Cuối cùng, những con gặm nhấm cuối cùng đã gục chết trên [desertling_planet.GetName]. Chính lớp cát đã bị nhuộm đỏ bởi nỗ lực to lớn của chúng ta nhằm cứu hành tinh khỏi sự xâm lấn của chúng, nhưng những chồi non xanh tươi mới đã bắt đầu đâm chồi. Chúng ta đã hành động vừa đúng lúc."
 anomaly.7155.a: "Việc này buộc phải làm."
 colony.7160.name: "Quốc Bảo"
 colony.7160.desc: "Khi chúng ta mở cửa các thuộc địa của mình cho loài desertling, không ai có thể ngờ tới kết quả này. Những sinh vật nhỏ bé này đã thích nghi một cách hoàn hảo vào lối sống của chúng ta, trở thành những người bạn đồng hành được yêu mến trong các gia đình trên khắp lãnh thổ của chúng ta.\n\nSự hòa nhập nhanh chóng của chúng đã dẫn đến suy đoán rằng những sinh vật này hẳn đã từng được thuần hóa trước đây. Bất kể nguyên nhân nào dẫn đến sự thân thiện bẩm sinh của chúng, tin đồn đó chỉ càng làm tăng thêm sự say mê xung quanh những sinh vật phi thường này."
 colony.7160.a: "Theo một cách nào đó, chúng đã cứu rỗi chúng ta."
 colony.7165.name: "Những Sinh Vật Rắc Rối"
 colony.7165.desc: "Tin xấu đã ập đến. Một vài con desertling đã trốn thoát trong quá trình vận chuyển, hình thành nên một cộng đồng mở rộng nhanh chóng ngoài tự nhiên. Tình hình phải được xử lý nhanh chóng để tránh sự sụp đổ môi trường."
 colony.7165.a: "Săn lùng lũ dã thú!"
 colony.7165.b: "Xây dựng một khu bảo tồn có tường bao quanh."
 colony.7170.name: "Quần Thể Thú Có Vú Đã Ổn Định"
 colony.7170.desc: "Chúng ta đã đạt được thành công vừa phải trong việc kiềm chế sự xâm nhập tràn lan của desertling. Đáng tiếc là chúng ta không thể tiêu diệt tận gốc những con thú thoắt ẩn thoắt hiện này. Điều quan trọng là phải tiếp tục theo dõi tình hình, vì nó có thể chạm ngưỡng nguy hiểm bất cứ lúc nào."
 colony.7170.a: "Cuộc săn lùng tiếp tục."
 colony.7175.name: "Sự Xâm Lấn Không Thể Kiểm Soát"
 colony.7175.desc: "Nỗ lực của chúng ta nhằm kiểm soát sự xâm lấn của desertling đã trở nên vô ích. Những sinh vật phàm ăn này đã đào sâu vào lòng đất, mở rộng các tổ lớn của chúng nhanh hơn tốc độ chúng ta có thể tiêu diệt chúng. Trận chiến coi như thất bại trừ khi chúng ta cho phép quân đội sử dụng kho vũ khí khổng lồ gồm chất nổ và khí độc, một hành động có thể đe dọa sự an toàn của mọi người trên bề mặt."
 colony.7175.a: "Lũ thú vật này sẽ ở lại đây lâu dài..."
 colony.7175.b: "Chúng ta sẽ KHÔNG chịu thua một lũ gặm nhấm tầm thường."
 colony.7175.b.tooltip: "Chúng ta sẽ hủy diệt toàn bộ hành tinh nếu cần thiết."

