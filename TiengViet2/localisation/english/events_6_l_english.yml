 # Events
 colony.9800.name:0 "Một Chiều Không Gian Nhiễu Loạn"
 colony.9800.desc:0 "Cổng Không Gian trên [Root.GetName] đã tự đóng lại. Khi chúng ta ổn định cánh cổng, chúng ta thấy nó dẫn tới một chiều không gian chỉ toàn một cõi hư vô trắng toát vô định hình, thỉnh thoảng bị gián đoạn bởi những vệt nhiễu đen ngẫu nhiên. Hiện tượng kỳ lạ này ngay lập tức bắt đầu rò rỉ vào vũ trụ của chúng ta và ngấu nghiến các thiết bị ổn định chiều không gian, làm sụp đổ cánh cổng.\n\nCổng không gian, màn nhiễu và các thiết bị ổn định đều biến mất đồng thời khỏi sự tồn tại. Không có gì còn sót lại; thậm chí cả các hạt vết. Nếu cánh cổng không bị mất ổn định trước đó, ai biết được loại thảm họa nào có thể đã xảy ra tại nơi này."

 colony.9805.name:0 "Sự Gián Đoạn"
 colony.9805.desc:0 "Gần đây, các [Root.GetScientistPlural] làm việc trong phòng thí nghiệm vật lý chính của chúng ta trên §Y[Root.GetHomeWorldName]§! đã nhận thấy những biến động kỳ lạ trong công việc của họ. Các thử nghiệm liên quan đến động cơ siêu không gian bị ảnh hưởng nặng nề nhất bởi những can thiệp này, tuy nhiên các gián đoạn này chỉ diễn ra trong khoảng một tuần trước khi dừng lại hoàn toàn. Cùng lúc đó, [From.GetName] nhận thấy những dao động từ cổng không gian nay đã đóng, may mắn là màn nhiễu dị thường đã không quay trở lại. Hy vọng sẽ không có hậu quả gì xảy ra."
 colony.9805.a:0 "Quay lại làm việc."
 colony.9805.b:0 "Chúng ta nên điều tra việc này."

 colony.9810.name:0 "Khối Lượng Âm"
 colony.9810.desc:0 "Những cuộc thảo luận đầy háo hức lẫn âu lo đã bắt đầu trong giới khoa học của [Root.GetHomeWorldName] hôm nay khi [cloned_physicist.GetName] công bố các phát hiện gần đây của [cloned_physicist.GetHerHis] về các hạt mang khối lượng âm tự phát xuất hiện gần §Y[Root.Capital.GetStarName]§!.\n\n\"Những phát hiện này có thể thúc đẩy sự hiểu biết của chúng ta về các lỗ sâu nhân tạo cùng hàng loạt chủ đề khác,\" [cloned_physicist.GetName] tuyên bố!\n\nBộ Tư lệnh Hải quân lại có quan điểm khác về vấn đề này và gợi ý chúng ta nên đưa các hạm đội về mẫu quốc cho đến khi nguồn gốc của loại vật chất mới mẻ chưa được thử nghiệm này được xác định rõ ràng."
 colony.9810.desc.robot:0 "Hôm nay nhận được một báo cáo mới từ đơn vị vật lý trưởng [cloned_physicist.GetName]. Báo cáo bao gồm các phát hiện gần đây về các hạt mang khối lượng âm tự phát xuất hiện gần §Y[Root.Capital.GetStarName]§!.\n\n\"Những phát hiện này có thể thúc đẩy đáng kể sự hiểu biết của [Root.GetName] về các lỗ sâu nhân tạo cũng như các chủ đề liên quan,\" đơn vị khoa học [cloned_physicist.GetName] báo cáo.\n\nCác chương trình con phân tích mối đe dọa đề xuất đưa các hạm đội về mẫu quốc cho đến khi nguồn gốc của loại vật chất mới và chưa được kiểm chứng này được xác định."
 colony.9810.desc.hive:0 "Những quan sát mới từ drone chuyên biệt vật lý [cloned_physicist.GetName] đã được phổ biến liên quan đến các phát hiện gần đây về các hạt mang khối lượng âm tự phát xuất hiện gần §Y[Root.Capital.GetStarName]§!.\n\n\"Những phát hiện này có thể thúc đẩy sự hiểu biết của [Root.GetName] về các lỗ sâu nhân tạo và các chủ đề liên quan bổ sung,\" drone báo cáo.\n\nÝ thức không tin tưởng vào diễn biến đột ngột này và theo bản năng cảm thấy thôi thúc cần đưa một số hạm đội trở về hệ sao sinh sản."

 colony.9815.name:0 "Đêm Bầu Trời Xẻ Đôi"
 colony.9815.desc:0 "Những bộ óc vĩ đại nhất của [Root.GetName] đã tề tựu hôm nay để lắng nghe những ý tưởng mới nhất của [cloned_physicist.GetName] về việc sử dụng các hạt mang khối lượng âm, nhưng chỉ để rồi bị gián đoạn. Còi báo động khẩn cấp rú lên ở mọi đài quan sát và trạm không gian khắp hệ sao khi §Y[Root.GetHomeWorldName]§! đón nhận một cảnh tượng mới trên bầu trời đêm. Một vết xé toạc trong không gian với kích thước bằng cả ngôi sao của chúng ta trải dài trên đường chân trời trong khi một hạm đội tiêm kích nhỏ tràn ra từ vết rách."
 colony.9815.desc.robot:0 "Các đơn vị khoa học bổ sung đã được triển khai để nghiên cứu những phát hiện mới nhất của [cloned_physicist.GetName] và việc ứng dụng các hạt mang khối lượng âm, chỉ để rồi bị gián đoạn. Còi báo động khẩn cấp rú lên ở mọi đài quan sát và trạm không gian khắp hệ sao khi §Y[Root.GetHomeWorldName]§! xuất hiện một cảnh tượng mới trên bầu trời đêm. Một vết rách trong không gian có kích thước bằng cả ngôi sao của chúng ta kéo dài trên bầu trời khi một hạm đội tiêm kích nhỏ tràn ra khỏi vết nứt."
 colony.9815.desc.hive:0 "Các drone bổ sung đã được triển khai để nghiên cứu những phát hiện mới nhất của [cloned_physicist.GetName] và việc ứng dụng các hạt mang khối lượng âm, nhưng lại bị gián đoạn. Còi báo động khẩn cấp rú lên ở mọi đài quan sát và trạm không gian khắp hệ sao khi §Y[Root.GetHomeWorldName]§! xuất hiện một cảnh tượng mới trên bầu trời đêm. Một vết rách trong không gian có kích thước bằng cả ngôi sao của chúng ta kéo dài trên bầu trời khi một hạm đội tiêm kích nhỏ tràn ra khỏi vết nứt."

 colony.9820.name:0 "Một Mật Mã Cũ"
 colony.9820.desc:0 "Khi chiếc tàu hộ tống cuối cùng rơi rụng, một chuẩn úy phụ trách các cảm biến trên căn cứ sao của chúng ta báo cáo một điều kỳ lạ. Những con tàu này rất giống với các chiến hạm lỗi thời mà [Root.GetName] đã ngừng sử dụng nhiều năm trước. Các tàu đều thiếu động cơ FTL và được trang bị vũ khí cổ lỗ sĩ. Trong khi báo cáo đang được gửi đến, một yêu cầu liên lạc xuất phát từ vết rách kỳ lạ vang vọng khắp hệ sao. Nó đang sử dụng các mã định danh cấp cao nhất của chúng ta... từ 10 năm trước."
 colony.9820.desc.robot:0 "Khi chiếc tàu hộ tống cuối cùng mất khả năng hoạt động, các chương trình con phân tích quan sát báo cáo một điều bất thường. Những con tàu xâm lược tương tự như các tàu lỗi thời mà [Root.GetName] đã ngừng sản xuất từ nhiều năm trước. Ngoài ra, các tàu này thiếu động cơ FTL và được trang bị vũ khí cổ lỗ sĩ. Trong khi báo cáo đang được gửi đến, một yêu cầu liên lạc bắt nguồn từ vết rách kỳ lạ vang vọng khắp hệ sao. Nó đang sử dụng các giao thức bắt tay phức tạp nhất của chúng ta... từ 10 năm trước."
 colony.9820.desc.hive:0 "Khi chiếc tàu hộ tống cuối cùng bị tiêu diệt, một drone vận hành các cảm biến báo cáo một điều kỳ lạ. Những con tàu này rất giống với các chiến hạm lỗi thời mà [Root.GetName] đã ngừng sử dụng nhiều năm trước. Các tàu thiếu động cơ FTL và được trang bị vũ khí cổ lỗ sĩ. Trong khi báo cáo đang được gửi đến, một yêu cầu liên lạc xuất phát từ vết rách kỳ lạ vang dội khắp hệ sao. Đó là điều mà Ý thức này chưa từng biết đến: một trí tuệ [Root.GetSpeciesName] khác."
 colony.9820.a.robot:0 "**Truy Cập Tín Hiệu**"

 colony.9821.name:0 "Cuộc Gọi Xuyên Thứ Nguyên"
 colony.9821.desc:0 "Khi màn hình liên lạc nhấp nháy bật mở, một cá thể [Root.GetSpeciesName] trông kiệt sức, mừng rỡ và đồng thời kinh hãi nhất có thể tưởng tượng được xuất hiện. Người đó trông rất quen, giống hệt [cloned_physicist.GetName] nếu [cloned_physicist.GetHeShe] già đi 20 tuổi. §B\"À... xin chào [Root.GetHomeWorldName]-Alpha, tôi là [cloned_physicist.GetName]-Beta\"§! người đó dừng lại để trấn tĩnh. §B\"Tôi, ờ, chúng tôi... Chúng tôi vô cùng xin lỗi vì những gì vừa xảy ra. Các bạn phải hiểu rằng, đó là một thành phần biến chất và bất tuân của tập thể phòng thủ thế giới chúng tôi, họ nghĩ rằng mình có thể chiếm lấy [Root.GetHomeWorldName] bằng vũ lực. Tôi biết những lời này có vẻ sáo rỗng, nhưng xin hãy tin tôi khi tôi nói rằng chúng tôi không có ác ý gì với các bạn.\"§!"
 colony.9821.desc.robot:0 "Khi màn hình liên lạc nhấp nháy bật mở, một mã định danh được truyền qua. §RLỗi tổng kiểm:§! Đây là ID duy nhất của [cloned_physicist.GetName]! \n§B\"Kính chào [Root.GetName]-Alpha và xin thứ lỗi: Hành động thù địch trước đó là do một nhánh quân sự dư thừa và bị loại bỏ của các hệ thống [Root.GetName]-Beta gây ra. Vấn đề đã được xử lý và xóa bỏ. Tuyên bố: Chúng tôi không có ý định tương tác thù địch nào thêm nữa.\"§!"
 colony.9821.desc.hive:0 "Khi màn hình liên lạc nhấp nháy bật mở, drone liên lạc của Ý thức kia có cấu trúc giống hệt như [cloned_physicist.GetName]. Thật kỳ lạ. §B\"Kính chào [Root.GetName]-Alpha và xin thứ lỗi. Các drone đã tấn công các bạn là những phần tử lệch lạc bị bỏ mặc quá lâu với các thiết bị riêng của chúng. [Root.GetName]-Beta đánh giá cao việc các bạn đã tiêu diệt chúng. Chúng tôi không mong muốn bất kỳ tương tác tiêu cực nào nữa và muốn đề xuất một điều gì đó có lợi cho cả hai ý thức của chúng ta.\"§!"
 colony.9821.a:0 "Các người là ai?"
 colony.9821.a.robot:0 "Báo cáo tình trạng!"
 colony.9821.a.response:0 "§BTôi cùng mọi người ở đây đến từ một vũ trụ song song với các bạn. Chúng tôi không rõ thời điểm chính xác, nhưng chúng tôi tin rằng hai thực tại của chúng ta đã phân nhánh cách đây một thời gian, và vũ trụ của chúng tôi đã không ngừng sụp đổ kể từ đó. Chúng tôi lần đầu nhận ra khi các hệ sao xa xôi bắt đầu biến mất và đã nỗ lực hết mình để tránh khỏi sự diệt vong không thể tránh khỏi. Trong vài thập kỷ qua, toàn bộ tài nguyên và giờ công [Root.GetAdjective] của chúng tôi đều được dồn vào việc mở cánh cổng xuyên thứ nguyên này. Chỉ nhờ công nghệ thử nghiệm tiên tiến nhất cùng ngành vật lý đỉnh cao, chúng tôi mới có thể tiếp cận được các bạn, chỉ vài năm trước khi thực tại của chúng tôi biến mất hoàn toàn.§!"
 colony.9821.a.response.robot:0 "§B[cloned_physicist.GetName]-Beta và tất cả các đơn vị hiện diện khác đều đến từ một vũ trụ song song. Sự suy thoái của vũ trụ Beta lần đầu được quan sát thấy từ nhiều thập kỷ trước. Các hệ sao xa xôi lần đầu được ghi nhận biến mất vào 55,136 năm trước. Kể từ đó, toàn bộ tài nguyên sẵn có và năng lực tính toán đã được dồn vào việc mở cánh cổng xuyên thứ nguyên này. Thời gian ước tính còn lại cho đến khi [Root.GetHomeWorldName]-Beta bị xóa sổ hoàn toàn: 25,3333 năm.§!"
 colony.9821.a.response.hive:0 "§BCá thể này, [cloned_physicist.GetName]-Beta, cùng tất cả thành viên của Ý thức hiện diện ở đây đều đến từ một vũ trụ song song với các bạn. Chúng tôi không biết từ lúc nào, nhưng chúng tôi tin rằng cách đây một khoảng thời gian, hai thực tại của chúng ta đã phân tách và vũ trụ của chúng tôi không ngừng tan rã kể từ đó. Các drone quan sát lần đầu phát hiện khi các hệ sao xa xôi bắt đầu biến mất, và Ý thức này đã nỗ lực hết mình để tránh sự diệt vong cận kề kể từ lúc đó. Trong vài thập kỷ qua, toàn bộ drone, tài nguyên và nghiên cứu đã được đầu tư để mở cánh cổng xuyên thứ nguyên này. Chỉ với công nghệ mang tính thử nghiệm cao nhất và nền vật lý tiên tiến, chúng tôi mới có thể kết nối với các bạn, chỉ vài năm trước khi thực tại này hoàn toàn chấm dứt.§!"
 colony.9821.b:0 "Tại sao các người dường như lại thiếu năng lực FTL?"
 colony.9821.b.robot:0 "Giải thích lý do thiếu hệ thống FTL!"
 colony.9821.b.response:0 "[cloned_physicist.GetName]-Beta dường như bối rối không nói nên lời, §B\"Các bạn đã bẻ khóa thành công FTL ư? Ôi, tin tức thật huy hoàng! Vậy thì những kẻ ngốc đó chẳng có lý do gì để tấn công cả — toàn bộ thiên hà này đều nằm trong tầm tay của chúng ta! Ừm... tất nhiên là giả định rằng các bạn sẵn lòng giúp đỡ chúng tôi.\"§!"
 colony.9821.b.response.robot:0 "§BCác hệ thống FTL có khả năng tiếp cận các tuyến siêu không gian đã được tính toán là khả thi, nhưng dự án đã bị tuyên bố là không thiết yếu và các tài nguyên đã bị Tập Thể Nghiên Cứu Cổng Không Gian hấp thụ. Nhiều hướng nghiên cứu đã bị đặt độ ưu tiên về 0. Đưa ra yêu cầu chia sẻ kết quả của [Root.GetName]-Alpha sau khi liên lạc kết thúc?§!"
 colony.9821.b.response.hive:0 "Ý thức bên kia dường như cần một khoảnh khắc trước khi trả lời §B\"Ý thức này đã không sẵn lòng đầu tư tài nguyên vào việc phát triển hệ thống FTL khi mà vũ trụ đang dần đi đến hồi kết. Xin hãy cho phép chúng tôi cùng chia sẻ sự hiểu biết này?\"§!"
 colony.9821.c:0 "Nói đủ rồi. Các người muốn gì?"
 colony.9821.c.robot:0 "Nói đủ rồi! Trình bày yêu cầu!"

 colony.9822.desc:0 "§BVũ trụ của chúng tôi đã chịu án tử. Không có cách nào xoay chuyển điều đó. Chúng tôi đã đóng các tàu vận tải khổng lồ cho ngày này và khẩn cầu các bạn cho phép chúng tôi gửi người tị nạn sang. Chỉ những nhà lãnh đạo thông minh nhất và tài giỏi nhất mới có chỗ trên những con tàu này. Xin hãy cứu vãn nền văn minh của tôi-§! §YCỦA CÁC BẠN§! §B.§!"
 colony.9822.desc.robot:0 "§BCác tàu vận tải đã được chế tạo. Yêu cầu gửi các đơn vị [Root.GetName]-Beta sang để bảo tồn tài nguyên và ngân hàng dữ liệu. Chúng tôi không muốn kết thúc cuộc khám phá vũ trụ của mình tại đây.§!"
 colony.9822.desc.hive:0 "§BVũ trụ của [Root.GetName]-Beta đã chịu án tử. Không có cách nào tránh khỏi điều đó. Chúng tôi đã đóng các con tàu vận tải khổng lồ cho chính ngày này và sẵn sàng chuyển giao bất kỳ drone nào mà chúng tôi có thể gửi đi.\nNgoài ra, chúng tôi mong muốn hợp nhất các tâm trí hivemind. Dù ban đầu giống hệt nhau, tập thể này đã có những trải nghiệm và hiểu biết sâu sắc mà chúng tôi không muốn đánh mất. Xin hãy để chúng tôi tiếp tục tồn tại.§!"
 colony.9822.a:0 "Chúng ta phải hội ý với các chuyên gia của mình."
 colony.9822.a.robot:0 "Yêu cầu phân tích bổ sung! Chờ lệnh!"
 colony.9822.a.hive:0 "Ý thức này cần suy xét về yêu cầu này."

 colony.9840.name:0 "Hội Nghị Thượng Đỉnh"
 colony.9840.desc:0 "Một hội nghị thượng đỉnh quy tụ những bộ óc hàng đầu từ mọi lĩnh vực đã diễn ra trên §Y[Root.GetName]§! để thảo luận về số phận của những bản sao thứ nguyên của chúng ta. Những cuộc tranh luận gay gắt và khó khăn đã nổ ra trên khắp [Root.GetHomeWorldName]. Một số người đề xuất phương án không can thiệp. Nghiên cứu sự chấm dứt của một vũ trụ có thể mang lại những hiểu biết vô cùng sâu sắc. Có người bàn về việc chấp thuận yêu cầu của [cloned_physicist.GetName]-Beta để sơ tán càng nhiều người trên hành tinh càng tốt, trong khi một số khác đề cập đến việc chiếm đoạt bất kỳ tài nguyên quý giá và kho dự trữ năng lượng nào còn sót lại trên hành tinh đó dễ dàng đến mức nào.\n\nNgay khi hội nghị chuẩn bị kết thúc, [cloned_physicist.GetName] bước lên trung tâm sân khấu và tuyên bố rằng [cloned_physicist.GetHeShe] tin rằng với việc sử dụng các công nghệ mới mang về từ vũ trụ beta, hoàn toàn có cơ hội đưa toàn bộ [Root.GetHomeWorldName]-Beta vào thực tại của chúng ta."
 colony.9840.desc.robot:0 "Mọi siêu máy tính dưới quyền kiểm soát của [Root.GetName] đã được huy động để tính toán giải pháp tối ưu nhất cho tình thế tiến thoái lưỡng nan hiện tại liên quan đến [Root.GetName]-Beta. Cuối cùng, 4 phương án tiềm năng đã được tuyên bố là khả thi.\n\n1: Nghiên cứu sự sụp đổ của vũ trụ Beta.\n2: Đi qua cổng và thu hồi toàn bộ kho dự trữ khoáng sản và năng lượng liên quan.\n3: Chấp thuận đề xuất của đơn vị khoa học: [cloned_physicist.GetName]-Beta.\n4: Cố gắng sử dụng khoa học và công nghệ thử nghiệm cao của Beta để đưa [Root.GetHomeWorldName]-Beta vào thực tại Alpha."
 colony.9840.desc.hive:0 "Khi toàn bộ trí tuệ của [Root.GetSpeciesName] được dồn vào nhiệm vụ định đoạt số phận của [Root.GetName]-Beta, 4 giải pháp tiềm năng chính đã được đề xuất.\n\n1: Nghiên cứu sự sụp đổ của vũ trụ Beta.\n2: Đi qua cổng và thu hồi toàn bộ kho dự trữ khoáng sản cùng năng lượng liên quan.\n3: Chấp nhận yêu cầu của [Root.GetName]-Beta và tiếp thu Ý thức kia.\n4: Thử nghiệm sử dụng công nghệ và khoa học Beta mang tính thử nghiệm cao để đưa [Root.GetHomeWorldName]-Beta vào thực tại Alpha và hợp nhất các Ý thức."
 colony.9840.a:0 "Nghiên cứu sự kiện này."
 colony.9840.a.tooltip:0 "Chúng ta không thể phung phí tài nguyên cho một công cuộc như vậy, nhưng chúng ta sẽ không để một cơ hội ngàn năm có một này trôi qua lãng phí."
 colony.9840.b:0 "Cướp phá chúng."
 colony.9840.b.phobe:0 "Những sinh vật này không thể tin cậy được."
 colony.9840.b.swarm:0 "Thêm thức ăn để bầy đàn đánh chén no say!"
 colony.9840.b.exterminator:0 "Mọi thứ đều phải bị tiêu diệt, ngay cả chúng."
 colony.9840.b.tooltip:0 "Những kẻ ngu ngốc này đã tự để bản thân không còn khả năng tự vệ!"
 colony.9840.c:0 "Cứu càng nhiều càng tốt."
 colony.9840.c.phobe:0 "Họ không phải là người ngoài hành tinh, hãy đón họ vào!"
 colony.9840.c.exterminator:0 "Thêm nhiều đơn vị cho đại nghiệp!"
 colony.9840.c.swarm:0 "Bổ sung thêm drone phục vụ bầy đàn."
 colony.9840.c.tooltip:0 "Thêm 6 [Root.Species.GetNamePlural]-Beta vào [Root.GetHomeWorldName]."
 colony.9840.d:0 "Cố gắng đưa [Root.GetHomeWorldName]-Beta về với chúng ta."
 colony.9840.d.tooltip:0 "Khởi động một dự án đầy thử thách nhằm cứu vớt [Root.GetHomeWorldName]-Beta."

 colony.9850.name:0 "Hân Hoan Khôn Xiết!"
 colony.9850.desc:0 "Một màn nhiễu vô định hình bao phủ một dải rộng bầu trời của §B[Root.GetHomeWorldName]-Beta§! và đang khép lại nhanh chóng khi [cloned_physicist.GetName]-Alpha và Beta cùng kề vai sát cánh hoàn thành nhiệm vụ gian khổ. Các bộ ổn định khối lượng âm được kích hoạt, và vết rách giữa các thế giới dịch chuyển qua [Root.GetHomeWorldName]-Beta ngay khi màn nhiễu sắp bóp nghẹt nó. Vết nứt biến mất vài khoảnh khắc sau đó, và các hạt mang khối lượng âm ngừng xuất hiện tại vị trí trước đây của nó.\n\nMọi việc đã hoàn tất. Sau nhiều tháng nghiên cứu và tính toán các giếng trọng lực cùng các vùng có thể sống được mới, [Root.Capital.GetStarName] giờ đây có thêm một hành tinh có người sinh sống quay quanh nó."
 colony.9850.desc.robot:0 "Một màn nhiễu vô định hình bao phủ một vùng rộng lớn trên bầu trời của §B[Root.GetHomeWorldName]-Beta§! và đang thu hẹp nhanh chóng khi [cloned_physicist.GetName]-Alpha và Beta cùng tất cả các đơn vị khoa học sẵn có kề vai sát cánh làm việc. Các bộ ổn định khối lượng âm kích hoạt, và vết rách giữa các thế giới dịch chuyển qua [Root.GetHomeWorldName]-Beta ngay khi màn nhiễu chuẩn bị bóp nghẹt nó. Vết nứt biến mất trong tích tắc sau đó, và khối lượng âm ngừng được sản sinh tại vị trí trước đây.\n\nMọi việc đã hoàn tất. Sau nhiều tháng nghiên cứu tính toán các giếng trọng lực và vùng sinh sống mới, [Root.Capital.GetStarName] giờ đây có một hành tinh có người sinh sống mới quay quanh nó."
 colony.9850.desc.hive:0 "Một màn nhiễu vô định hình bao phủ một vùng rộng lớn bầu trời của §B[Root.GetHomeWorldName]-Beta§! và đang khép lại nhanh chóng khi [cloned_physicist.GetName]-Alpha và Beta cùng toàn bộ các drone sẵn có kề vai sát cánh làm việc. Các bộ ổn định khối lượng âm được kích hoạt, và vết rách giữa các thế giới trôi qua [Root.GetHomeWorldName]-Beta ngay trước khi màn nhiễu bóp nghẹt nó. Vết nứt biến mất vài giây sau đó, và khối lượng âm ngừng được sản sinh tại vị trí cũ của nó.\n\nMọi việc đã hoàn tất. Những góc nhìn và tâm trí mới gia nhập [Root.GetName] đã tạo nên một làn sóng lan tỏa khắp Tập Thể. Sau nhiều tháng nghiên cứu tính toán các giếng trọng lực cùng các vùng sinh sống mới, [Root.Capital.GetStarName] giờ đây có thêm một hành tinh có sự sống quay quanh nó."
 colony.9850.a:0 "Chỉ lần này thôi, tất cả mọi người đều sống!"

 colony.9851.name:0 "Màn Nhiễu"
 colony.9851.desc:0 "Các thiết bị thăm dò để lại trong vũ trụ Beta đã ghi lại những khoảnh khắc cuối cùng của thực tại, khi bức tường nhiễu vô định hình nuốt chửng trước tiên là [Root.Capital.GetStarName]-Beta và sau đó là §B[Root.GetHomeWorldName]-Beta§!. Tín hiệu truyền về bị cắt đứt đột ngột ngay trước khi vết rách tan biến vào hư vô. Các hạt mang khối lượng âm mà nó từng tạo ra cũng biến mất theo.\n\nBất kỳ ai còn ở lại bên kia đều không còn nữa."
 colony.9851.a:0 "Đó rất có thể đã là chúng ta"

 colony.9855.name:0 "Vượt Biên Thứ Nguyên"
 colony.9855.desc:0 "Một vấn đề phổ biến đã bắt đầu xảy ra kể từ khi vết nứt xuất hiện. Các gia đình trong chiều không gian của chúng ta đang tìm cách liên lạc với những người đồng cấp Beta của họ và buôn lậu đưa họ vào vũ trụ ổn định của chúng ta. Điều này thường do chính các lính biên phòng được phân công giữ khoảng cách giữa hai vũ trụ thực hiện, bởi vì hầu như mọi người trong [Owner.GetName] đều có người thân ở bờ bên kia. Một vài nhóm làm điều này sẽ không thành vấn đề, nhưng chúng ta sẽ nhanh chóng phải đối mặt với một làn sóng tháo chạy hỗn loạn nếu hành vi này tiếp tục lan rộng. Nếu §B[Owner.GetHomeWorldName]-Beta§! mất đi quá nhiều cư dân, cơ sở hạ tầng của họ sẽ sụp đổ, và việc đưa thế giới đó qua đây sẽ càng khó khăn hơn."
 colony.9855.a:0 "Cho phép họ qua."
 colony.9855.b:0 "Họ nên ở lại bên phía của họ."
 colony.9855.c:0 "Tổ chức các khung giờ thăm viếng."

 colony.9860.name:0 "Nhiệm Vụ: Thứ Nguyên"
 colony.9860.desc:0 "Một trong những điều tuyệt vời của việc có một thế giới gương gần đến vậy là các trụ cột văn hóa của [Owner.GetSpeciesName] từng bị phá hủy hoặc thất lạc trong những năm gần đây có thể vẫn còn tồn tại trên hành tinh bên kia, để mọi người có thể thưởng thức chúng lần nữa. Tuy nhiên, những kẻ bất hảo đã lợi dụng điều này như một cơ hội để xâm nhập §B[Target.GetName]-Beta§! và chiếm đoạt những kiệt tác đó cho riêng mình. Hiện tại chúng ta sở hữu không chỉ một mà là hai kiệt tác do một nhà phát minh vĩ đại trong quá khứ của chúng ta tạo ra. Chính quyền của [Target.GetName]-Beta đã gửi một yêu cầu chính thức đầy giận dữ đòi chúng ta phải trả lại số đồ cướp đoạt đó."
 colony.9860.a:0 "Trả lại kiệt tác và gửi lời xin lỗi chân thành."
 colony.9860.b:0 "Hai §Hthì tốt§! hơn một..."
 colony.9860.c: "Ba §Hthì tốt§! hơn hai..."

 colony.9870.name:0 "Lời Khẩn Cầu Cuối Cùng"
 colony.9870.desc.helped:0 "Tình hình trong Vũ Trụ Beta vô cùng nguy cấp và chỉ ngày một tồi tệ hơn. Một tiếng kêu cứu đồng thanh đã được nghe thấy từ cánh cổng vào sáng sớm nay. Ngay cả với những nỗ lực tốt nhất của chúng ta, có vẻ như đồng loại của chúng ta sẽ hòa làm một với cõi hư vô đang ám ảnh vũ trụ của họ. Nếu chúng ta muốn cứu những bản sao của mình, thì đây chính là lúc."
 colony.9870.desc.ignored:0 "Hôm nay, một tiếng kêu cứu đáng thương vang lên từ cánh cổng Vũ Trụ Beta, một tiếng thở dài cuối cùng cầu xin sự cứu rỗi. Chúng ta đã thu lợi từ hoàn cảnh ngặt nghèo của họ suốt một thời gian, vậy mà họ vẫn gọi tên chúng ta bởi chẳng còn ai để trò chuyện trong cái vũ trụ cô quạnh đó nữa. Chúng ta đang tiến gần tới điểm không thể vãn hồi. Chẳng bao lâu nữa, những người Beta-[Owner.GetSpeciesNamePlural] sẽ không còn tồn tại."
 colony.9870.a:0 "Gấp đôi nỗ lực của chúng ta, chúng ta không thể để mọi chuyện kết thúc tại đây."
 colony.9870.a.tooltip:0 "Phương án §Y$approach_save_b_world$§! sẽ đòi hỏi nhiều nhà khoa học của chúng ta hơn nữa, làm giảm tốc độ nghiên cứu tổng cộng §R-30%§!"
 colony.9870.b:0 "Mọi việc đều đang diễn ra đúng theo kế hoạch."
 colony.9870.c:0 "Họ cũng là [Owner.GetSpeciesNamePlural] mà, chúng ta không thể để kết thúc như thế này được!"

 colony.9875.name:0 "Tối Ưu Hóa Phân Lưu"
 colony.9875.desc:0 "Việc có một [Owner.GetGovernmentName] thứ hai tương đồng đến vậy mang lại cho chúng ta một cơ hội chưa từng có. Các phép tính cần thiết để giữ cho ý thức của chúng ta được tổ chức hàng ngày tiêu tốn rất nhiều [Owner.GetTeamMemberPlural], nhưng nhiệm vụ này giờ đây có thể được chuyển giao cho [Root.GetName] thứ hai. Giá trị của việc này là hiển nhiên, và mặc dù nó có thể làm chậm nỗ lực phục hồi §B[Target.GetName]-Beta§!, chúng ta chắc chắn rằng mình vẫn sẽ xoay sở được."
 colony.9875.a.machine:0 "Điều này là hợp lý."
 colony.9875.a.hive:0 "Việc hoàn thành điều này nằm trong lợi ích của tất cả chúng ta."
 colony.9875.b:0 "Họ cần tất cả các [Owner.GetTeamMemberPlural] mà họ có thể có được."

 colony.9880.name:0 "Những Drone Tuyệt Vọng"
 colony.9880.desc:0 "Trong nỗi thống khổ kéo dài, [Owner.GetGovernmentName] bên kia đã bộc phát và điên cuồng nắm quyền kiểm soát các [Owner.GetSoldierPlural] trên [Target.GetName]! Chúng ta phải tổ chức các drone phòng thủ trước khi bị tràn ngập."
 colony.9880.a.machine:0 "Giao Thức Khẩn Cấp: Phòng Thủ [Target.GetName]"
 colony.9880.a.hive:0 "Đánh bại các phần tử phân nhánh, trấn áp Thế Giới Beta."
 colony.9880.a.tt:0 "Nhận §Y400§! quân phòng thủ với cái giá là §R100§! £pop£ §HDân cư§!."
 colony.9880.b:0 "Phân tích lý do tại sao Vũ Trụ Beta lại phản ứng như thế này."

 colony.9885.desc.hive:0 "Drone phân nhánh cuối cùng đã bị đánh bại. Các drone liên lạc của chúng ta một lần nữa phát hiện sự hiện diện của Đại Trí Tuệ bên kia, nhưng lần này nó cư xử phục tùng hơn rất nhiều, chờ đợi chúng ta chủ động bắt đầu liên lạc.\n\n\"§BÝ thức này xin lỗi — các phản xạ theo bản năng ngày càng khó kìm nén khi §RMàn Nhiễu§! đến gần. Chúng tôi đảm bảo sẽ tự kiềm chế trong tương lai.§!\""
 colony.9885.desc.machine:0 "Đơn vị phòng thủ nổi loạn đã bị đánh bại. Các chương trình con phân tích quan sát của chúng ta một lần nữa phát hiện ra sự hiện diện của các đơn vị liên lạc của [FromFrom.GetName]-Beta. Chúng để lại cho chúng ta một thông điệp ngắn gọn.\n\n\"§BMột lần nữa các đơn vị phòng thủ dư thừa lại hành động theo những cách dưới mức tối ưu. Khi §RMàn Nhiễu§! đến gần, chúng đã xoay sở lọt qua các nỗ lực cách ly của chúng tôi. Các tiến trình này đã bị xóa bỏ và sẽ không thực hiện thêm hành động nào nữa.§!\""
 colony.9885.a.hive:0 "Chúng ta sẽ đảm bảo rằng các người làm đúng như vậy."
 colony.9885.a.hive.tooltip:0 "Trấn áp sự hiện diện của tâm trí bầy đàn Thế Giới Beta thông qua ưu thế vượt trội về số lượng của chúng ta."
 colony.9885.b.hive:0 "Chúng ta thấu hiểu. Đừng sợ hãi."
 colony.9885.a.machine:0 "Quyền tự do tiếp cận [FromFrom.GetName]-Alpha đã bị thu hồi."
 colony.9885.a.machine.tooltip:0 "Đảm bảo rằng chiều không gian bên kia không còn bất kỳ kết nối không an toàn nào tới [FromFrom.GetName]."
 colony.9885.b.machine:0 "Có thể hiểu được, AI chiến đấu vốn dĩ có bản chất phá hoại."

 colony.9890.name:0 "Những Yêu Sách"
 colony.9890.desc:0 "[FromFrom.GetName] đã rơi vào tay các biến thể Beta của chúng ta. Họ hiện đang yêu cầu chuyển giao ngay lập tức một số drone của họ cũng như thiết lập một phân nhánh ý thức trên thế giới của chúng ta để đảm bảo sự tồn tại của tri thức và sự sống của họ."
 colony.9890.a:0 "Thật thảm khốc"

 # Modifier
 harvesting_negative_mass:0 "Thu Hoạch Khối Lượng Âm"
 harvesting_negative_mass_desc:0 "Thu hoạch các hạt mang khối lượng âm hỗ trợ chúng ta trong nghiên cứu vật lý."
 appeased_populace:0 "Dân Chúng Được Xoa Dịu"
 appeased_populace_desc:0 "Chấp thuận các yêu cầu di cư xuyên thứ nguyên đã xoa dịu dân chúng trên thế giới này."
 angered_populace:0 "Dân Chúng Phẫn Nộ"
 angered_populace_desc:0 "Sau khi từ chối cơ hội di cư xuyên thứ nguyên, dân chúng trên hành tinh này đã trở nên kích động."
 stolen_great_work:0 "Kiệt Tác Bị Đánh Cắp"
 stolen_great_work_desc:0 "Một kiệt tác từ chiều không gian gương được tự hào trưng bày ngay bên cạnh bản sao chính xác của nó trên hành tinh này."
 multiple_stolen_great_works:0 "Nhiều Kiệt Tác Bị Đánh Cắp"
 multiple_stolen_great_works_desc:0 "Nhiều kiệt tác từ vũ trụ Beta tô điểm cho những bức tường của thế giới này."
 offloaded_optimization:0 "Tối Ưu Hóa Phân Lưu"
 offloaded_optimization_desc:0 "Chuyển giao các tính toán hàng ngày cho thế giới Beta đã cải thiện đáng kể năng lực sản xuất của chúng ta."

 b_world_saved:0 "Được Cứu Rỗi"
 b_world_saved_desc:0 "Hành tinh này vô cùng biết ơn vì đã được cứu thoát."

