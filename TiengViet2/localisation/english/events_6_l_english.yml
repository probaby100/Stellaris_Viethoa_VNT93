 d_desertling_infestation: "Hệ Động Vật Xâm Lấn"
 d_desertling_infestation_desc: "Một loài động vật có vú ngoài hành tinh xâm lấn."
 d_red_desert: "Sa Mạc Đỏ"
 d_red_desert_desc: "Những sa mạc bao la nhuốm đỏ bởi những hy sinh đẫm máu diễn ra tại đây."
 d_alien_sanctuary: "Khu Bảo Tồn Động Vật Hoang Dã Ngoại Lai"
 d_alien_sanctuary_desc: "Một khu bảo tồn được xây dựng cho hệ động vật ngoài hành tinh nơi du khách có thể tương tác với các loài sinh vật phi thường."

 rodent_war: "Tận Diệt Cực Đoan"
 rodent_war_desc: "Chúng ta đã giao nhiệm vụ cho quân đội diệt trừ hệ động vật ngoài hành tinh xâm lấn đã đào sâu vào thế giới này."
 alien_infestation: "Xâm Nhiễm Ngoại Lai"
 alien_infestation_desc: "Thế giới này đã bị xâm nhập bởi hệ động vật ngoài hành tinh lan truyền nhanh chóng."
 adopted_aliens: "Thuần Hóa Động Vật Ngoại Lai"
 adopted_aliens_desc: "Thế giới này đã tham gia vào một dự án nhận nuôi thú cưng ngoài hành tinh trong nỗ lực chung nhằm thuần hóa chúng."
 national_pets: "Mối Gắn Kết Kỳ Lạ"
 national_pets_desc: "Những sinh vật desertling mà chúng ta quyết định nhận nuôi đã được tuyên bố là thuần hóa hoàn toàn và được người dân trên khắp đất nước yêu mến."

 trait_presapient_unintelligent: "Kém Thông Minh"
 trait_presapient_unintelligent_desc: "§HChủng loài này không thể hoàn thành ngay cả những nhiệm vụ đơn giản nhất. Kỹ năng duy nhất của chúng là tốc độ sinh sản nhanh đến khó tin.§!"

 rapid_desertification_species: "Desertling"

# Closing Aperture
 BREACHSEALER_CAT: "Phát Hiện Vết Rách Vũ Trụ"
 BREACHSEALER_CAT_DESC: "Hệ sao Seddom mờ ảo chứa một vết rách trong kết cấu của vũ trụ. Kỳ lạ hơn nữa, bản thân vết rách đang dần thu nhỏ lại, như thể có thứ gì đó hoặc ai đó đang nỗ lực hàn gắn nó."
 anomaly.7200.name: "Khép Lại Vết Nứt"
 anomaly.7200.desc: "Seddom là một cảnh tượng kỳ quái. Các hành tinh xoáy tròn chìm trong bóng tối; gần đó là một vết rách ngay trong kết cấu của vũ trụ chúng ta, một miệng vực vũ trụ nuốt chửng chính ánh sáng rực rỡ của ngôi sao trong hệ.\n\nBất chấp sự sắp xếp dường như tự nhiên của các tiểu hành tinh, phân tích sâu hơn đã tiết lộ rằng chúng được sắp xếp với độ chính xác toán học. Hàng thiên niên kỷ trước, một thế lực phi thường nào đó đã điều phối các thiên thể quỹ đạo của hệ này thành một cấu trúc chuyên biệt, một cấu trúc không chỉ giảm thiểu tác động của vết rách mà còn ngăn không cho nó lan ra thiên hà rộng lớn hơn.\n\nChúng ta đến đây vào một thời khắc tốt lành — một công trình vĩ đại sắp hoàn thành. Sự phục hồi của hệ sao này sắp diễn ra."
 anomaly.7200.a: "Cảm ơn vì đã sửa chữa thiên hà của chúng tôi."

# Geocentric Experiment
 NAME_Orrery_Site: "Địa Điểm Thiên Nghi"
 GEOCENTRIC_EXPERIMENT_CAT: "Thiên Nghi"
 GEOCENTRIC_EXPERIMENT_CAT_DESC: "Các chỉ số trọng lực kỳ lạ đã được phát hiện trên khắp hệ sao [from.Solar_System.GetName], phát xung từ vành đai tiểu hành tinh bên trong đến hành tinh hoang vắng tại trung tâm của hệ."
 anomaly.8000.name: "$GEOCENTRIC_EXPERIMENT_CAT$"
 anomaly.8000.desc: "Sự ổn định trọng lực của hệ sao [from.Solar_System.GetName] được duy trì bởi các bộ phát §Y$sr_dark_matter$§! được đặt bên trong vành đai tiểu hành tinh. Những bộ phát này được điều khiển bởi một siêu máy tính đặt trên hành tinh trung tâm. Các ghi chép từ máy tính trung tâm này cho thấy toàn bộ hệ sao từng là một địa điểm thử nghiệm thao túng trọng lực, được thiết lập bởi một nền văn minh cổ đại."
 anomaly.8000.tt: "Thêm §Y$d_physics_1$§! và §Y$d_dark_matter_deposit_1$§! vào mỗi §YTiểu Hành Tinh $GRAVITY_STABILIZER$§!"

 anomaly.8000.b: "Tháo dỡ máy móc."
 anomaly.8000.b.tt: "§RĐây là một ý tưởng tồi tệ§!"

 GRAVITY_STABILIZER: "Thiết Bị Thao Túng Trọng Lực"
 NAME_GRAVITY_STABILIZER_I: "$GRAVITY_STABILIZER$ I"
 NAME_GRAVITY_STABILIZER_II: "$GRAVITY_STABILIZER$ II"
 NAME_GRAVITY_STABILIZER_III: "$GRAVITY_STABILIZER$ III"
 NAME_GRAVITY_STABILIZER_IIII: "$GRAVITY_STABILIZER$ IIII"

 d_geocentric_experiment: "Siêu Máy Tính Thiên Nghi"
 d_geocentric_experiment_desc: "Siêu máy tính đã giữ cho Thiên Nghi không bị sụp đổ trọng lực."

 # Mysterious Rocks Formation
 MYSTERIOUS_ROCK_CAT: "Kiến Tạo Đá Bí Ẩn"
 MYSTERIOUS_ROCK_CAT_DESC: "Trong khi khảo sát [From.GetName], chúng ta đã phát hiện một kiến tạo đá kỳ dị trên nơi vốn được cho là chỉ là một hành tinh cằn cỗi."
 anomaly.2000.name: "Những Tảng Đá Kỳ Dị"
 anomaly.2000.start.desc: "Việc tiếp tục khám phá [From.GetName] đã mang lại nhiều câu hỏi hơn là câu trả lời. Bề mặt rải rác những bức tượng sống động đến kỳ lạ, nét mặt của chúng hóa đá trong nỗi thống khổ thầm lặng."
 anomaly.2000.default.desc: "$anomaly.2000.start.desc$\n\nCác nhà khoa học của chúng ta chia rẽ; một số tin rằng những hình dạng này từng là các sinh vật sống, bị biến thành đá bởi một thế lực chưa biết. Những người khác cho rằng chúng đại diện cho các vị thần, được thờ phụng bởi một nền văn minh đã bị lãng quên từ lâu. Một số ít thận trọng hơn tin rằng những bức tượng không phải là sự tôn kính, mà là một lời cảnh báo: một thông điệp nghiệt ngã gửi đến bất kỳ ai dám quấy rầy hành tinh này."
 anomaly.2000.hive.desc: "$anomaly.2000.start.desc$\n\nNhiều luồng suy nghĩ khác nhau tràn ngập ý thức tập thể của chúng ta: một số hình dạng này có thể từng là những sinh vật sống, bị một thế lực chưa biết hóa thành đá. Hoặc có lẽ chúng đại diện cho các vị thần được tôn thờ bởi một nền văn minh đã chìm vào quên lãng từ lâu. Có thể những bức tượng này không phải là sự tôn vinh, mà là một lời cảnh báo: một thông điệp u ám gửi tới bất kỳ ai dám quấy rầy hành tinh này."
 anomaly.2000.a: "Tiếp tục nghiên cứu."
 anomaly.2000.b: "Ngừng cuộc điều tra."
 anomaly.2005.desc: "Cuộc điều tra sâu hơn của phi hành đoàn trên [From.GetName] đã xác định các bức tượng là tàn tích của một chủng loài cổ xưa có nét tương đồng mạnh mẽ với người Lithoid. Bất kỳ bản chất nào từng gắn kết hình thái của họ đã suy thoái từ lâu. Giờ đây, phơi mình trước các yếu tố tự nhiên, chúng dần bị xói mòn thành bụi mịn tán xạ những tàn dư lịch sử vào những cơn gió không ngừng nghỉ của [From.GetName]."
 anomaly.2005.a: "Thật quyến rũ."
 anomaly.2006.desc: "Các nỗ lực tiếp theo của phi hành đoàn trên tàu [From.GetName] đã bị đột ngột chặn đứng khi một cơn gió giật bất ngờ quét qua địa điểm nghiên cứu. Những pho tượng đá giòn tan đã vỡ vụn thành cát bụi, xóa sạch mọi dấu vết của điều bí ẩn mà chúng từng mang lại. Không còn bằng chứng nào sót lại để phân tích và không thể rút ra kết luận rõ ràng, chúng ta có rất ít lựa chọn ngoài việc ngừng cuộc điều tra."
 anomaly.2006.a: "Thật đáng tiếc."
 GROTESQUE_ROCK_PROJECT: "Khám Phá Kiến Tạo Đá Kỳ Dị"
 GROTESQUE_ROCK_PROJECT_DESC: "Chúng ta đã tình cờ phát hiện một kiến tạo đá kỳ dị trên bề mặt của [From.GetName]. Cần nghiên cứu thêm để xác định lý do tại sao nó lại tồn tại trên hành tinh cằn cỗi này."

## Icy Flowers
 ICY_FLOWERS_CAT: "Một Khám Phá Lạnh Giá"
 ICY_FLOWERS_CAT_DESC: "Nhiều lần cố gắng quét lớp băng dày bao phủ [From.GetName] đã dẫn đến dữ liệu thất thường và các mô thức nhiễu bất ngờ. Thứ gì đó bên dưới lớp băng liên tục làm gián đoạn thiết bị của chúng ta. Khuyến nghị nên điều tra thêm."
 anomaly.2010.name: "Thiên Đường Thực Vật"
 anomaly.2010.desc: "Khai quật bên dưới lớp vỏ băng giá của [From.GetName] đã hé lộ một hang động ngầm khổng lồ. Đáng chú ý là nhà kính ẩn giấu này lại là một hệ sinh thái thịnh vượng, một thảm động thực vật tươi tốt phát triển trong sự cô lập, được lớp băng bảo vệ khỏi môi trường khắc nghiệt trên bề mặt hành tinh. Hang động duy trì một vi khí hậu ổn định, rất có thể được nuôi dưỡng bởi các miệng phun địa nhiệt."
 anomaly.2010.a: "Còn nhiều điều để khám phá ở đây."
 anomaly.2010.b: "Hủy bỏ dự án."
 anomaly.2015.name: "Thách Thức Mọi Xác Suất"
 anomaly.2015.desc: "Sâu hơn bên trong hang động, chúng ta bắt gặp một cánh đồng hoa trải rộng ngút ngàn. Ngay khi sự quan sát chủ động bắt đầu, toàn bộ cánh đồng đồng loạt bừng nở, tràn ngập căn phòng trong ánh sáng phát quang sinh học rực rỡ. Phân tích thực vật học cho thấy loài hoa này chỉ nở 100 triệu năm một lần, được kích hoạt bởi sự hội tụ chính xác của các yếu tố môi trường.\n\nViệc chúng ta đến đúng vào thời điểm diễn ra một sự kiện như vậy là điều thách thức mọi xác suất, nhưng dù là sự trùng hợp ngẫu nhiên hay điều gì đó sâu xa hơn, đây chắc chắn là một trải nghiệm phi thường."
 anomaly.2015.a: "Một khám phá đáng kinh ngạc."
 anomaly.2020.name: "Bí Mật Không Thể Khám Phá"
 anomaly.2020.desc: "Khi tiếp tục đi sâu hơn vào hang động, hoạt động địa chấn bất ngờ làm mất ổn định cấu trúc. Một cơn rung chấn kiến tạo đột ngột lan truyền qua các bức tường, đe dọa gây ra sự sụp đổ sắp xảy ra. Đối mặt với điều kiện xấu đi nhanh chóng, chúng ta đã khởi động các quy trình sơ tán khẩn cấp. Những bí mật bên trong hang động đành phải bỏ ngỏ không thể khám phá."
 anomaly.2020.a: "Thật đáng tiếc"
 BOTANICAL_GARDEN_PROJECT: "Khám Phá Thiên Đường Thực Vật"
 BOTANICAL_GARDEN_PROJECT_DESC: "Có một hang động ngầm rộng lớn bên dưới lớp vỏ băng giá của [From.GetName]. Chúng ta muốn cử một đoàn thám hiểm để nghiên cứu sâu hơn về môi trường phi thường này."

## A Court of Blossoms
colony.10000.name: "Những Dấu Chân Kỳ Lạ"
colony.10000.desc: "Các báo cáo đã được gửi về từ những trạm nông nghiệp hẻo lánh của chúng ta trên [Root.GetName]. Một số [Owner.GetFarmerPlural] đã biến mất không dấu vết, trang trại của họ không hề bị xáo trộn một cách kỳ lạ, ngoại trừ sự xuất hiện của những dấu chân khổng lồ trên lớp đất xung quanh.\n\nCác dấu vết này không giống bất cứ thứ gì được kiểm tra trong cuộc khảo sát hành tinh: bốn chân, ngón chân rộng có móng vuốt, và đủ sâu để cho thấy một sinh vật có khối lượng đáng kể. Những người thực dân lo lắng rằng chúng ta có thể đang phải đối mặt với một loài săn mồi chưa từng biết."

colony.10000.a: "Điều tra sâu hơn!"
colony.10000.b: "Đoán mò vô căn cứ. Quay lại làm việc đi."

colony.10005.name: "Một Quái Thú Đã Chết"
colony.10005.desc: "Chuyến thám hiểm vào nơi hoang dã tỏ ra vô cùng gian khổ, nhưng cuối cùng đã đơm hoa kết trái. Sau nhiều ngày lần theo dấu vết của sinh vật, đội của chúng ta đã đến một hiện trường tàn phá: xác chết của con quái thú phơi bày bộ xương ngoài bằng chitin dày cộm, các gờ gai nhọn trên sống lưng, và một chiếc đuôi phân đốt kết thúc bằng một ngòi độc cong duy nhất. Cơ thể bị đục thủng bởi nhiều vết thương sâu.\n\nPhía sau nó, ẩn mình dưới một tán cây ngụy trang bằng dây leo phát quang sinh học cực kỳ hiệu quả, các thiết bị của chúng ta phát hiện một khu vườn cổ xưa. Những cột đá cẩm thạch quấn đầy dây thường xuân, những con đường bằng đá obsidian nhẵn bóng. Đội của chúng ta thận trọng tiếp cận cho đến khi thoáng thấy những người chăm sóc khu vườn: một chủng tộc dạng người, dáng vẻ thanh nhã, làn da phát sáng mờ ảo. Bất chấp vẻ ngoài hòa hợp, hoa và dây leo đã tạo nên một tấm màn che chắn hiệu quả. Chúng ta sẽ cần phải xuyên qua lớp vỏ bọc lấp lánh này để tiếp cận những kẻ sống bên kia."

colony.10005.a: "Cố gắng xuyên qua lớp ngụy trang."

colony.10010.name: "Những Vụ Mất Tích Tiếp Diễn"
colony.10010.desc: "Tần suất xảy ra các vụ việc ngày càng leo thang. Lần này, những dấu chân không chỉ đi ngang qua các nông trang; chúng xé toạc thẳng qua chúng. Toàn bộ các công trình đã bị giật sập với một lực kinh hoàng. Dấu vết vật lộn cho thấy các nạn nhân bị bắt sống và không hề ra đi trong yên lặng.\n\nNhững người thực dân không còn chỉ bất an; họ đang kinh hãi tột độ. Nhiều gia đình đã từ bỏ mảnh đất của mình để chạy về trung tâm thuộc địa."

colony.10010.a: "Đã đến lúc tìm ra thủ phạm."
colony.10010.b: "Bạo lực là một phần của cuộc sống."

colony.10015.name: "Triều Đình Hoa Nở"
colony.10015.desc: "Ta chào mừng các bạn, hỡi những lữ khách, nhân danh Triều Đình Hoa Nở. Ta là Vua Tamperion, hay như tộc nhân thường gọi ta, kẻ có 'Trái Tim Vàng', trị vì không phải bằng quyền lực vũ lực, mà bằng di sản và nghi lễ. Ta đóng vai trò là người quản hộ thế giới này và là người dẫn đường cho thần dân của ta, tộc Anathari. Các bạn có giật mình khi nghe chính ngôn ngữ của mình không? Đừng sợ. Chúng ta đã nghiên cứu các bạn kể từ khi các bạn quyết định chọn [Root.GetName] làm nhà. Các bạn hẳn là một dân tộc hùng mạnh, nếu đã xoay sở xuyên thủng được tấm màn ngụy trang của chúng ta. Chúng ta rất vinh dự được gặp các bạn."

colony.10015.a.question: "Triều Đình Hoa Nở là gì?"
colony.10015.a.answer: "Chúng ta là triều đình của sự nở hoa và thịnh vượng vĩnh cửu. Văn hóa của chúng ta tự hào không được định hình bởi vũ khí hay sự thống trị, mà bởi sự hòa hợp, đạt được thông qua sự hiểu biết lẫn nhau và lòng nhân ái bên trong mỗi cá nhân chúng ta. Tại Triều Đình Hoa Nở, truyền thống không phải là tàn tích, mà là luật lệ của chúng ta. Chia sẻ những câu chuyện, bài hát và mùa màng với chúng ta là để có được một cái nhìn thoáng qua về lối sống của chúng ta trong sự trao đổi thấu hiểu lẫn nhau."

colony.10015.b.question: "Các bạn có thể cho chúng tôi biết điều gì về con quái vật?"
colony.10015.b.answer: "Sinh vật mà các bạn bắt gặp, vị hộ vệ vĩ đại, từng là người bảo vệ của chúng ta. Nhưng theo thời gian, nó đã bị thiêu rụi bởi một dịch bệnh từ bên trong, gieo rắc bởi một chủng đông trùng hạ thảo thần kinh làm tổ bên trong não bộ của nó, làm rỗng tâm trí và làm tha hóa mục đích của nó. Chúng ta đã kết thúc sự đau khổ của nó không phải trong giận dữ, mà trong đau buồn. Nó không phải là một con thú ngoại lai, mà là một phần máu thịt của chúng ta."

colony.10015.c.question: "Các bạn muốn gì ở chúng tôi?"
colony.10015.c.answer: "Các bạn có thể thấy phong tục của chúng ta kỳ lạ. Những nghi thức, lễ tế, bài thánh ca, sự cộng sinh với thảm thực vật biết suy nghĩ và mơ ước. Nhưng hãy hiểu điều này: sự chung sống với chúng ta không được ban phát miễn phí. Những ai từ chối học hỏi sẽ phải gánh chịu hậu quả. Đây là lời đề nghị của chúng ta. Nó không phải là sự phục tùng hay kiểm soát, mà là sự thấu hiểu và chấp nhận lẫn nhau. Một sự hân hoan, nếu các bạn muốn. Đó là bản chất thuần khiết nhất của những gì chúng ta định nghĩa là sự hòa hợp giữa các dân tộc. Nếu các bạn bước đi trên con đường đó cùng chúng ta, các bạn sẽ không phải bước đi đơn độc."

colony.10015.a: "Chúng tôi ở đây để học hỏi."
colony.10015.b: "Chúng tôi ở đây để thiết lập thuộc địa."

colony.10016.name: "$colony.10015.name$"
colony.10016.desc: "Thay mặt toàn thể Triều Đình Hoa Nở, ta xin gửi lời cảm ơn chân thành nhất vì sự hợp tác của các bạn. Hãy yên tâm, người các bạn cử đến với chúng ta sẽ được chào đón như người một nhà, và họ sẽ không thiếu thốn bất cứ thứ gì."
colony.10016.a: "Rất tốt."

colony.10017.name: "$colony.10015.name$"
colony.10017.desc: "Cứ thế đi. Quyết định của các bạn đã đưa ra, và quyết định của chúng ta cũng vậy. Ta đã đưa ra lời khuyên, nhưng giờ đây các bạn phải gánh chịu hoa trái từ sự lựa chọn của mình."
colony.10017.a: "Chúng ta sẽ chuẩn bị sẵn sàng cho bất cứ điều gì tiếp theo."

colony.10020.name: "Một Cuộc Tấn Công Bất Ngờ"
colony.10020.desc: "Không hề có một lời cảnh báo nào. Vua Tamperion bước ra từ trung tâm khu vườn, khoác trên mình bộ giáp nghi lễ dệt từ những dây leo sống và hoa phát quang sinh học. Với từng bước đi khoan thai dọc theo ranh giới thuộc địa, chính thế giới này đã thức tỉnh. Dây leo trườn lên từ lòng đất, trong khi những cánh hoa bung nở sắc như lưỡi dao. Không khí đặc quánh lại bởi lớp phấn hoa vàng óng, mịn màng và phát sáng. Nó ngấm vào các lỗ thông gió và buồng phổi. Chỉ trong vài giờ, nó đã cướp đi sinh mạng của nhiều người, gây ra co giật, điên loạn, và cuối cùng là cái chết.\n\nChỉ có sự can thiệp của các hệ thống phòng thủ tự động của thuộc địa cuối cùng mới hạ gục được ông ta. Vua Tamperion gục ngã không một lời trăng trối; các nhân chứng nói rằng ánh mắt cuối cùng của ông không hề mang lòng hận thù, mà là một sự thất vọng sâu sắc và trang nghiêm.\n\nNơi Triều Đình Hoa Nở từng ngự trị, các trinh sát của chúng ta chỉ còn tìm thấy rừng rậm. Cứ như thể vương quốc đã tự thu mình trở lại vào lòng đất, mang theo những bí mật và nỗi đau buồn của nó."

colony.10020.a: "Một kết cục cay đắng."

colony.10025.name: "Một Người Trong Số Họ"
colony.10025.desc: "Chúng ta đã đắm mình vào các tập tục của người Anathari. Khi tham gia vào các nghi thức tế lễ và hòa nhịp với các nghi thức kỳ lạ của họ, các khuôn mẫu xuất hiện trong khi ý nghĩa bén rễ sâu xa.\n\nTrong các buổi lễ ban đêm chung tập trung vào các chu kỳ trường thọ và sinh sản, người Anathari bắt đầu hé lộ những mảnh lịch sử bị chôn giấu. Tộc người kể về một dịch bệnh cổ xưa và dai dẳng từng bao phủ hành tinh và hiện vẫn đang nắm quyền kiểm soát người Anathari."

colony.10025.a: "Có nhiều điều cần phải thảo luận."

colony.10026.name: "Vua Tamperion"
colony.10026.desc: "Đã từng có một thời, rất lâu trước khi giống loài của các bạn đặt chân lên mảnh đất này, khi chúng ta, người Anathari, phụng sự như những người quản gia cao quý. Chúng ta định hình thế giới này theo nhịp thở của nó, dẫn dắt các hệ sinh thái, cân bằng các dòng hải lưu, chăm sóc thế giới sống như người ta chăm sóc một khu vườn với lòng kiên nhẫn vô tận. Tuy nhiên, sự cân bằng không thể tồn tại mãi mà không gặp phải thách thức."

colony.10026.a.question: "Ai hay cái gì đã phá vỡ sự cân bằng này?"
colony.10026.a.answer: "Từ bên dưới gốc rễ của lịch sử trỗi dậy một thực thể mà chúng ta gọi là 'Kẻ Bất Tử Bóng Đêm', một thế lực không sinh ra cũng chẳng bị ràng buộc. Ban đầu chúng ta tin rằng nó đến trong hòa bình, vì vậy chúng ta đã mở rộng cánh cửa đón chào nó, mời nó vào để giao lưu trao đổi. Nhưng một khi đã ở bên trong biên giới của chúng ta, nó đã giải phóng toàn bộ sức mạnh lên chúng ta, nô dịch chúng ta trong chớp mắt. Giờ đây chúng ta đang mục rỗng từ bên trong. Chậm rãi, chúng ta đang tàn lụi dần."

colony.10026.b.question: "Chúng tôi đóng vai trò gì trong chuyện này?"
colony.10026.b.answer: "Các bạn, những [Owner.GetSpeciesNamePlural], mang trong mình một sức mạnh mà chúng ta đã đánh mất từ lâu. Một sức sống không bị ràng buộc bởi lịch sử của chúng ta. Và vì vậy, ta cầu xin các bạn không phải với tư cách của một vị quân vương, mà như một tàn tích của tất cả những gì từng tồn tại, các bạn sẽ giúp đỡ chúng ta chứ? Nguồn gốc của sự hiện diện này gia tăng theo từng chu kỳ trôi qua, và ta không chắc người Anathari còn có thể chịu đựng được tai ương này bao lâu nữa."

colony.10026.c.question: "Các bạn cần chúng tôi làm gì?"
colony.10026.c.answer: "Kẻ Bất Tử Bóng Đêm cần phải bị đối mặt. Cách đây rất lâu, một người anh hùng vĩ đại đã thử và bỏ mạng. Dẫu vậy khi hấp hối, nàng đã xé rách một mảnh tinh túy của nó. Có lẽ các bạn có thể giải mã nó và định vị bản thể đối ứng của nó ở đâu đó trên [Root.GetName]. Công nghệ của các bạn có thể đủ mạnh để phá vỡ lớp ngụy trang của nó.\n\nChỉ khi đoàn kết, chúng ta mới có hy vọng sống sót. Hãy nhớ điều này: thất bại không chỉ đồng nghĩa với sự sụp đổ của Anathari, hay sự kết thúc của thuộc địa các bạn. Nếu không được ngăn chặn, sự hiện diện này có thể nuốt chửng chính hành tinh này."

colony.10026.a: "Chúng ta phải ngăn chặn Kẻ Bất Tử Bóng Đêm này."
colony.10026.b: "Chúng ta không thể tin tưởng tên vua tự xưng này."

colony.10027.name: "Mầm Mống Hoài Nghi"
colony.10027.desc: "Những gì bắt đầu như một cuộc giao lưu hòa bình đã mang những chiều hướng tinh vi hơn và đáng lo ngại hơn. Việc tham gia vào các nghi thức Anathari đã dẫn đến việc báo cáo bị trì hoãn, ký ức bị phân mảnh và giấc ngủ bị thay đổi. Vua Tamperion vẫn lịch thiệp, nhưng ngày càng lảng tránh khi được hỏi về mục đích sâu xa hơn của các nghi lễ này. Những lời giải thích của ông, dù đầy chất thơ, thường né tránh việc thẩm vấn trực tiếp. Ngay cả danh hiệu của ông, 'Trái Tim Vàng', cũng không hề xuất hiện trong bất kỳ học thuyết Anathari nào được ghi lại. Một số người hiện cho rằng các nghi lễ không chỉ đóng vai trò như sự gắn kết văn hóa, mà còn là công cụ điều chỉnh tâm lý.\n\nBất kể phương pháp là gì, kết quả là không thể nhầm lẫn: chúng ta đang dần hòa hợp với Tamperion và tộc nhân của ông ta. Khi ông nói về Kẻ Bất Tử Bóng Đêm, cảm giác ít giống như một lời khẩn cầu từ người ngoài và giống như một nghĩa vụ thiêng liêng phải giúp đỡ những đồng minh thân thiết nhất của chúng ta, người Anathari."

colony.10027.a: "Dĩ nhiên chúng tôi sẽ giúp các bạn."
colony.10027.b: "Đủ rồi cái trò vô nghĩa này!"

colony.10030.name: "Những Gì Nằm Bên Kia Cái Chết"
colony.10030.desc: "Hành động của chúng ta diễn ra chớp nhoáng. Một đội đột kích dân quân đã xâm nhập vào Triều Đình Hoa Nở. Vua Tamperion đang thiền định trong vườn khi chúng ta tấn công. Nhưng nhà vua không dễ dàng bị hạ gục. Các nhân chứng mô tả một màn phô diễn cơn thịnh nộ thực vật kinh hoàng, dây leo phun trào từ đá tảng, các cấu trúc hoa cào xé xuyên qua thép. Vào thời điểm nhà vua bị hạ gục, khu vườn đã ướt đẫm máu phát quang và tro tàn.\n\nNhững gì còn lại bên dưới khu vườn khiến chúng ta kinh ngạc, vì đó là một kho báu sinh học: tri thức cổ đại, kỹ thuật thực vật, và các kho dự trữ nguồn gen từ vô số chu kỳ thu hoạch. Đất đai, nay không còn bị ràng buộc bởi những người chăm sóc cổ xưa của nó, phì nhiêu màu mỡ hơn bất kỳ nơi nào từng được tìm thấy trên hành tinh. Chúng ta có thể đang bước vào một thời kỳ hoàng kim của sự trù phú."

colony.10030.a: "Đó là cách duy nhất."

A_CRYPTIC_ESSENCE_PROJECT: "Nghiên Cứu Tinh Túy"
A_CRYPTIC_ESSENCE_PROJECT_DESC: "Vua Tamperion đã giao phó cho chúng ta một mảnh vỡ của Kẻ Bất Tử Bóng Đêm. Bằng cách nghiên cứu tinh túy của nó, chúng ta có thể khám phá ra vị trí hang ổ của nó và phương thức phá vỡ sự kìm kẹp của nó đối với người Anathari."

THE_CRYPTIC_ESSENCE_PROJECT: "$A_CRYPTIC_ESSENCE_PROJECT$"
THE_CRYPTIC_ESSENCE_PROJECT_DESC: "$A_CRYPTIC_ESSENCE_PROJECT_DESC$"

colony.10035.name: "Kẻ Bất Tử Bóng Đêm"
colony.10035.desc: "Các nhà khoa học đã giải mã thành công tinh túy và định vị Kẻ Bất Tử Bóng Đêm tại một đỉnh núi hoang vắng. Ngay sau đó, một đội thám hiểm đã đến cao nguyên của ngọn núi, phát hiện địa điểm đã bị chiếm cứ.\n\nTại tâm điểm sừng sững kiến trúc sư của các thử thách: Kẻ Bất Tử Bóng Đêm. Một thực thể có nguồn gốc không thể hiểu nổi, hình thái của nó là một sự kết hợp không ổn định của plasma, khói, xương và vật chất hoạt động tâm linh. Giọng nói của nó bỏ qua âm thanh, hiển hiện trực tiếp trong cấu trúc thần kinh của mọi thành viên có mặt.\n\n'Các ngươi đến để phục tùng ta sao, hỡi lũ [Owner.GetSpeciesNamePluralInsult] nhỏ bé?' nó ngân vang chậm rãi, giọng nói trong ý nghĩ của nó đượm vẻ giễu cợt. 'Người Anathari là tài sản quý giá nhất của ta. Nhưng ta cho các ngươi một cơ hội. Hãy bước vào các thử thách và chứng minh bản thân xứng đáng với sự tôn trọng của ta.'"

colony.10035.a: "Chúng ta chấp nhận thử thách của ngươi."
colony.10035.a.tt: "Bắt đầu Thử Thách Lòng Dũng Cảm."
colony.10035.b: "Chúng ta từ chối thử thách. Tấn công ngay lập tức."

colony.10040.name: "Thử Thách Lòng Dũng Cảm"
colony.10040.desc: "Một người thực dân đơn độc được chuyển dịch đến một hang động sâu trong lòng núi, với Kẻ Bất Tử Bóng Đêm dẫn đường. Một con quái thú gớm ghiếc đang chờ sẵn trong góc tối tăm nhất. Thực thể giống như một loài giáp xác có kích thước không tưởng, mai của nó lấp lánh các khoáng chất kỳ lạ và hợp kim cổ đại. Nó hành động như thể đang bảo vệ lãnh địa của mình, di chuyển với sự phối hợp kỳ quái gợi ý một mức độ trí thông minh đáng ngạc nhiên."

colony.10040.a: "Cố gắng tiêu diệt con thú."
colony.10040.a.militarist: "Giết nó bằng lửa."
colony.10040.b: "Cố gắng lừa con thú."

colony.10045.name: "Vượt Qua Thử Thách Lòng Dũng Cảm"
colony.10045.desc: "Thép chạm trán lớp mai giáp trong hang động tối tăm như mực khi người thực dân được chọn lao vào vực thẳm.\n\nCon Giáp Xác khổng lồ phản ứng ngay lập tức, móng vuốt của nó chém xuyên qua đá, thân hình đồ sộ của nó làm rung chuyển ngọn núi. Nhưng người thực dân đã sẵn sàng. Dụ nó vào các hành lang hẹp hơn, họ nhử các chuyển động của sinh vật, giáng đòn vào các khớp nối và các hạch cảm giác đã được xác định từ trước.\n\nKhi bụi lắng xuống, sinh vật nằm bất động, cơn co giật cuối cùng của nó vang vọng qua ngọn núi như sấm rền. Người thực dân bước ra, người dính đầy máu và bụi đất, nhưng vẫn sống sót.\n\nKẻ Bất Tử Bóng Đêm khẽ gật đầu chậm rãi, như thể đánh giá cao hành động liều lĩnh của người thực dân. Thử thách lòng dũng cảm đã hoàn thành."

colony.10045.a: "Hãy để chúng ta tiếp tục..."
colony.10045.a.tt: "Bắt đầu Thử Thách Trí Tuệ."

colony.10046.name: "$colony.10045.name$"
colony.10046.desc: "Giao tranh trực diện chưa bao giờ là một chiến lược khả thi. Người thực dân quan sát chuyển động của loài giáp xác, sự ác cảm của nó với ánh sáng, sự siêu nhạy cảm với các rung động, và quan trọng nhất là sự mù lòa của nó. Nó chỉ phản ứng với âm thanh. Mọi chuyển động đều là phản xạ trước tiếng vọng và đòn đánh. Người thực dân đã lập một kế hoạch, không phải là đối đầu, mà là đánh lạc hướng.\n\nNgười thực dân ném một loạt viên đá vào cột trụ trung tâm của căn phòng. Khi âm thanh vang vọng, con quái thú phản ứng ngay lập tức, lao thẳng vào nơi phát ra tiếng ồn.\n\nCột trụ trung tâm vỡ vụn, làm sập trần phòng. Người thực dân tìm thấy nơi trú ẩn trong một hốc tường hẹp, được che chắn khỏi một phần đá rơi. Con giáp xác bị chôn vùi dưới hàng tấn đá, bị mắc kẹt và im bặt hoàn toàn.\n\nKẻ Bất Tử Bóng Đêm dường như đánh giá cao sự thông minh và mưu trí của người thực dân. Thử thách lòng dũng cảm đã hoàn thành xuất sắc."

colony.10047.name: "Thất Bại Trong Thử Thách Lòng Dũng Cảm"
colony.10047.desc: "Móng vuốt của con quái thú nhanh như chớp và phát ra tiếng vo ve yếu ớt trong bóng tối của hang động, mỗi chuyển động chỉ là một vệt mờ, mỗi cú đánh đi kèm với một xung tần số thấp khiến đá rung chuyển.\n\nNgười thực dân di chuyển cẩn thận, cân nhắc các lựa chọn. Một đòn nhử, một sự dụ dỗ, một nỗ lực tấn công, hay có lẽ là một sự đánh lạc hướng. Nhưng sinh vật thích nghi nhanh hơn dự kiến. Những cú đánh tiếp theo của nó đã trúng đích, và hang động bừng sáng trong cơn cuồng nộ phát quang sinh học.\n\nKhi bụi tan, người thực dân đã chết. Chúng ta đã thất bại trong thử thách."

colony.10047.a: "Một nỗ lực dũng cảm."

colony.10050.name: "Thử Thách Trí Tuệ"
colony.10050.desc: "Một âm thanh, thoạt đầu run rẩy và ngập ngừng, bắt đầu hình thành bên trong căn phòng. Chẳng mấy chốc, cứ như thể chính những tảng đá đang cất lời:\n\n§H'Ta sinh ra trong tĩnh lặng, chẳng bởi chinh phạt hay luật điều,\nMột hiệp ước không lời, xóa mờ mối thù xưa cũ tiêu điều.\nChẳng động cơ nào thôi thúc, không tâm trí nào truyền trao,\nNhưng bàn tay vô hình của ta giữ vững muôn vì sao.\nHiếm ai thấy ta tới, nhưng thấu trọn đổi thay,\nMột cõi an định nơi hỗn mang từng ngự trị tháng ngày.'§!"

colony.10050.a: "Câu trả lời là 'Thăng Hoa'."
colony.10050.b: "Câu trả lời là 'Hòa Hợp Thiên Hà'."

colony.10055.name: "Thất Bại Trong Thử Thách Trí Tuệ"
colony.10055.desc: "Khi những lời đó vừa rời khỏi [Owner.Species.GetMouthName] của người thực dân, ánh sáng mờ dần. Giọng nói của Kẻ Bất Tử Bóng Đêm cắt ngang sự tĩnh lặng: '[Owner.GetSpeciesNameInsult],' nó nói, 'không phải mọi thứ đều có thể trả lời bằng sự thèm khát quyền lực thuần túy.'\n\nTrong khoảnh khắc đó, người thực dân bị tấn công. Không vũ khí hay ngọn lửa nào nhấn chìm họ, chỉ có áp lực và sự im lặng. Họ gục ngã không một tiếng động, và căn phòng nuốt chửng toàn bộ thi thể. Chúng ta đã thất bại trong thử thách."

colony.10060.name: "Vượt Qua Thử Thách Trí Tuệ"
colony.10060.desc: "Người thực dân ngập ngừng sau khi nói ra, hy vọng mình đã đưa ra câu trả lời đúng. Căn phòng rung lên tán đồng, và Kẻ Bất Tử Bóng Đêm dường như gần như hài lòng.\n\n'Ngươi đã hiểu,' những lời của nó vang lên. 'Không phải mọi thử thách đều là về sức mạnh hay quyền lực. Một số chỉ đòi hỏi lòng can đảm để mở rộng tâm trí.'\n\nÁnh sáng dịu nhẹ tràn ngập căn phòng khi câu đố tan biến. Thử thách đã thành công, và con đường phía trước đang chờ đợi."

colony.10060.a: "Chúng ta phải tiến bước..."
colony.10060.a.tt: "Bắt đầu Thử Thách Hy Sinh."

colony.10065.name: "Thử Thách Hy Sinh"
colony.10065.desc: "Một người thực dân bước tới đối mặt với thử thách, và được đưa lên đứng trên một bục cao rộng lớn, tối tăm. Ở trung tâm: hai chiếc ghế bằng đá obsidian và một chiếc bàn thấp, dài. Một vũ khí duy nhất được đặt trên đó, một lưỡi đao cong thanh nhã. Khi người thực dân cầm nó lên bằng một [Owner.Species.GetHandName], nó phát ra tiếng vo ve mờ nhạt đầy sức mạnh.\n\nTrên một chiếc ghế có Vua Tamperion đang ngồi, bị trói không phải bằng dây thừng, mà bằng những sợi dây phát sáng của lực nguyên tố. Biểu cảm của ông không thể đoán được, không biểu lộ sự sợ hãi cũng chẳng bình an, chỉ có sự tĩnh lặng. Chiếc ghế còn lại trống không.\n\nSau đó giọng nói lại vang lên trong tâm trí người thực dân một lần nữa.\n\n'Lưỡi đao này đã nếm máu của cả vua chúa lẫn những kẻ hèn nhát,' Kẻ Bất Tử Bóng Đêm thì thầm. 'Để vượt qua thử thách này, một mạng sống phải bị tước đoạt. Hãy lấy trái tim của thủ lĩnh Anathari, hoặc hy sinh chính mình; sự lựa chọn là của ngươi. Chọn sai... và thử thách sẽ chấm dứt.'"

colony.10065.a: "Vĩnh biệt, hỡi nhà vua."
colony.10065.b: "Chúng tôi sẽ chấp nhận hy sinh."

colony.10070.name: "Vượt Qua Thử Thách Hy Sinh"
colony.10070.desc: "Người thực dân đứng trước thân hình bị trói của Vua Tamperion, im lặng, bất động. Trên chiếc bàn bằng đá obsidian, lưỡi đao đang chờ đợi. Kẻ Bất Tử Bóng Đêm không đưa ra chỉ dẫn nào.\n\nNgười thực dân cầm lấy lưỡi đao và đâm thẳng vào ngực Tamperion, nhanh gọn và dứt khoát. Ông không hề kêu la. Chỉ có một tiếng chuông kim loại êm dịu, giống như tiếng chuông xa xăm vang vọng.\n\nVua Tamperion ngước nhìn lên, ánh mắt bình thản. Lưỡi đao, ngập sâu đến tận chuôi, không hề đâm vào da thịt, mà là một thứ hoàn toàn khác. Ngực ông phát sáng mờ ảo, đập theo ánh sáng vàng rực. Vua Tamperion quả thực có 'Trái Tim Vàng'...\n\nNhững sợi trói quanh nhà vua tan biến và bục cao mờ dần. Kẻ Bất Tử Bóng Đêm cất lời một lần nữa trong tâm trí chúng ta: 'Các ngươi có thể tiến bước.'"

colony.10070.a: "Đó là một kết quả đáng kinh ngạc."

colony.10075.name: "Thất Bại Trong Thử Thách Hy Sinh"
colony.10075.desc: "Người thực dân nhìn Vua Tamperion, lưỡi đao cầm trên tay. Vua Tamperion ngồi yên, ánh nhìn dịu dàng của ông không hề van xin cũng chẳng cho phép. Người thực dân do dự, rồi tự hướng lưỡi đao vào chính mình.\n\nMột hơi thở gấp gáp, và người thực dân gục xuống, lưỡi đao kêu loảng xoảng rơi trên sàn đá obsidian. Sự lựa chọn đã rõ ràng: tha mạng cho thủ lĩnh Anathari và tự mình gánh vác gánh nặng.\n\nNhưng những lời của Kẻ Bất Tử Bóng Đêm vang lên không hề tức giận cũng chẳng đắc thắng: 'Lòng trắc ẩn không phải là sự xá tội. Lưỡi đao này chưa bao giờ dành cho chính bản thân ngươi.'\n\nMột giọt nước mắt thầm lặng lăn dài trên má Vua Tamperion. Với những ý định tốt đẹp nhất, chúng ta đã định đoạt số phận của thần dân ông...\nThử thách kết thúc, không phải trong vinh quang, mà trong đau buồn. Người thực dân đã chết, và con đường phía trước đã bị phong tỏa."

colony.10080.name: "Khát Vọng Sâu Kín"
colony.10080.desc: "Kẻ Bất Tử Bóng Đêm đứng trước chúng ta, không hề thay đổi, không thể thấu suốt. Hình thái của nó là một bóng đen in trên nền đá, rộng lớn nhưng mờ ảo, như thể nó thuộc về một thực tại chỉ giao nhau một nửa với thực tại của chúng ta. Nó không phát ra âm thanh. Thay vào đó, sự hiện diện của nó nở rộ trong tâm trí chúng ta, mỗi ý nghĩ được truyền tải không phải bằng lời nói mà như những điều tất yếu.\n\nVào trong sự tĩnh lặng, Kẻ Bất Tử Bóng Đêm truyền đi một suy nghĩ, nhẹ nhàng và gần như hài lòng: 'Các ngươi đã giành được ân huệ của ta, những [Owner.GetSpeciesNamePlural] nhỏ bé. Các ngươi đã làm ta ấn tượng. Giờ hãy nói đi, điều các ngươi khao khát là gì?'"

colony.10080.a: "Hãy rời khỏi hành tinh này. Mãi mãi."
colony.10080.b: "Tiêu diệt người Anathari."

colony.10081.name: "Một Thành Công Hoành Tráng"
colony.10081.desc: "Có một khoảng dừng. Một sự im lặng trải dài qua suy nghĩ và thời gian, nhưng sau đó là một sự đồng thuận thì thầm. 'Người Anathari không còn là điều ta phải dõi theo nữa,' Kẻ Bất Tử Bóng Đêm cất lời. 'Giờ các ngươi đã bị ràng buộc.' Với lời nói đó, nó biến mất. Không ánh sáng hay âm thanh, chỉ có sự thay đổi trong không khí, và cảm giác rằng một thứ gì đó bao la đã rời đi.\n\nTrong các chu kỳ tiếp theo sau cuộc tiếp xúc đầu tiên, sự hội tụ liên loài giữa những người thực dân và người Anathari ngày càng tăng cường. Mùa màng bội thu trên diện rộng, và các thành phố mọc lên hòa hợp với vùng đất. Hệ thực vật và công nghệ sóng bước bên nhau. Lần đầu tiên sau nhiều thế kỷ, [Root.GetName] phát triển rực rỡ, bầu không khí không còn bị đè nặng bởi xung đột, mà được hiệu chỉnh lại cho hòa bình."

colony.10081.a: "Một thành công vĩ đại."

colony.10082.name: "Cơn Mưa Cánh Hoa Vàng"
colony.10082.desc: "'Như ngươi mong muốn.'\n\nKẻ Bất Tử Bóng Đêm rút khỏi suy nghĩ của chúng ta, và cùng với đó, một điều gì đó cốt lõi đã thay đổi. Những người thực dân cảm thấy một cảm giác cồn cào sâu sắc, bất an dọc theo sống lưng. Trên khắp hành tinh, người Anathari bắt đầu gục ngã. Không có tiếng thét nào được báo cáo, không có sự giằng xé, chỉ có tiếng xào xạc khẽ khàng của những bộ y phục gập lại thành bụi đất, như những cánh hoa rơi trong tiếng thì thầm của làn gió nhẹ.\n\nTrong căn phòng, Vua Tamperion nán lại thêm một khoảnh khắc. Đôi mắt ông chớp chớp trong sự phản bội và thất vọng tột cùng đối với chủng loài [Owner.GetSpeciesNamePlural]. Ông không giơ tay, không cất lời van nài. Một bông hoa vàng duy nhất rơi từ tay áo ông xuống sàn hang động. Và rồi ông cũng biến mất. Không có sự thương tiếc, cũng chẳng có sự nhẹ nhõm. Chỉ có sự vắng mặt của những gì từng tồn tại, một dân tộc, một bài ca, một nền văn minh, bị quét sạch khỏi [Root.GetName].\n\nKẻ Bất Tử Bóng Đêm có vẻ hài lòng."

colony.10082.a: "Chúng ta chưa bao giờ cần đến họ."

colony.10085.name: "Một Thất Bại Nặng Nề"
colony.10085.desc: "Những người thực dân đã bước đi trên con đường đến với Anathari, nhưng cuối cùng, chừng đó vẫn là chưa đủ. Các thử thách đã thất bại. Kẻ Bất Tử Bóng Đêm sẽ vẫn ở lại, sự hiện diện của nó bao trùm khắp vùng đất như một tai ương.\n\nVua Tamperion sẽ cần phải trở về Triều Đình Hoa Nở, không phải với tư cách một người bạn, mà như một kẻ tôi tớ một lần nữa cho Kẻ Bất Tử Bóng Đêm. Một vị vua tan nát trong một vương quốc sụp đổ. Những người thực dân của chúng ta sẽ được phép ở lại hành tinh, được dung thứ, nhưng không bao giờ được tin tưởng lần nữa.\n\n'Các ngươi đã tìm cách giải thoát cho họ, lũ [Owner.GetSpeciesNamePluralInsult],' Kẻ Bất Tử Bóng Đêm vang lên trong đầu chúng ta. 'Nhưng các ngươi không xứng đáng.'"

colony.10085.a: "Chẳng còn gì để mất nữa. Chuẩn bị tấn công."
colony.10085.b: "Tiêu diệt người Anathari. Chúng tôi sẽ trở thành những kẻ nô lệ trung thành của ngươi."
colony.10085.c: "Rút lui về thuộc địa."

colony.10086.name: "Chiến Tranh Là Câu Trả Lời Duy Nhất"
colony.10086.desc: "Chúng ta biết sức mạnh của Kẻ Bất Tử Bóng Đêm là vô cùng to lớn. Cuộc tấn công của chúng ta diễn ra ngay lập tức và khốc liệt. Hang động rung chuyển dữ dội khi Kẻ Bất Tử Bóng Đêm thét lên một tiếng chói tai cuộn trào.\n\nMặc dù lực lượng của chúng ta chịu tổn thất nặng nề, chúng ta đã xoay sở trói buộc được Kẻ Bất Tử Bóng Đêm. Hang động gầm rú, và không khí nứt toác như xương gãy. Rồi Kẻ Bất Tử Bóng Đêm biến mất.\n\nSau đó, Vua Tamperion đã gặp gỡ những người sống sót. Ông tiến đến gần những người thực dân và cúi đầu thật sâu. Bất chấp tất cả những gì đã mất mát, cơn ác mộng cuối cùng đã qua đi."

colony.10086.a: "Dù sao thì chúng ta cũng đã cứu được hành tinh."

colony.10087.name: "Con Đường Của Những Kẻ Tôi Tớ"
colony.10087.desc: "Trên khắp hành tinh, người Anathari lảo đảo gục ngã. Thịt da, xương tủy, ký ức: tất cả những gì họ từng là bắt đầu tan biến. Vua Tamperion là người cuối cùng. Khi thời khắc của ông đến, ông không hề cất lời. Những người thực dân báo cáo sự kết thúc của ông như một tia sáng lóe lên cùng một vầng hào quang của những cánh hoa vàng.\n\nTất cả những gì còn lại là Kẻ Bất Tử Bóng Đêm. Chúng ta cảm thấy nó lắng xuống những khoảng trống rỗng trong tâm trí chúng ta. Một thứ gì đó tăm tối và cổ xưa luồn lách vào bên trong chúng ta. Một sự chuyển giao, chậm rãi và tuyệt đối. Từ Kẻ Bất Tử Bóng Đêm sang chúng ta, từ những gì từng tồn tại sang những gì giờ đây đang là.\n\nNhững người thực dân của chúng ta không còn chỉ là [Owner.GetSpeciesNamePlural] nữa, mà là một thứ gì đó khác. Một thứ... hoàn toàn mới."

colony.10087.a: "Chúng ta chấp nhận số phận của mình."

colony.10090.name: "Mọi Sự Sống Đều Phải Chấm Dứt"
colony.10090.desc: "Một thực thể khổng lồ trỗi dậy từ bóng tối, không phải dã thú cũng chẳng phải cỗ máy, mà là một thứ gì đó kỳ dị hơn, hình thái của nó biến đổi giữa các khối hình học nóng chảy và bóng đêm sôi sục. Nó không hề có ý định giao tiếp. Nó chỉ đơn giản là nuốt chửng.\n\nCác tòa nhà sụp đổ xuống đất. Những người thực dân bị xé toạc, tan biến vào không khí hoặc bị nghiền nát dưới áp lực vô hình. Trong vòng vài giờ, chẳng còn lại gì ngoài một tiếng vo ve trầm đục vang vọng khắp bình nguyên đổ nát.\n\nRồi, cũng nhanh như khi xuất hiện, con quái thú biến mất, để lại một vệt chết chóc và tàn phá trên một hành tinh bị thiêu rụi."

colony.10090.a: "Sức mạnh thật khủng khiếp..."
colony.10090.a.tt: "50% dân số trên [Root.GetName] đã thiệt mạng, và nửa còn lại bị tàn phá nặng nề."

colony.10095.name: "Trùng Hợp Hay Định Mệnh?"
colony.10095.desc: "Các đội tuần tra báo cáo tìm thấy những thi thể kỳ dị trong những cánh rừng bao quanh [Root.GetName]. Làn da cháy sém, xương cốt đen kịt, và nét mặt đông cứng trong nỗi kinh hoàng nguyên thủy. Không tìm thấy vũ khí nào, và cũng không có dấu hiệu của bất kỳ cuộc xung đột nào. Thảm thực vật gần đó có dấu hiệu tiếp xúc với nhiệt độ cực cao và những dị thường trọng lực cục bộ ngắn ngủi.\n\nNhưng bất cứ thứ gì từng săn lùng ở đó giờ đã biến mất, và hành tinh đang hồi đáp. Thảm thực vật khô héo đang bừng nở rực rỡ dồi dào, và hệ động vật địa phương đã trở lại với sự hòa hợp đầy thận trọng. Lớp đất màu mỡ dường như đã sẵn sàng cho những vụ mùa bội thu chưa từng thấy trước đây.\n\nHiện tại, thuộc địa đã an toàn."

colony.10095.a: "Một kết cục may mắn."

