 situation_negative_mass_desc:0 "Chúng ta đang đối mặt với một tình huống tồi tệ bên trong 'Vũ Trụ Beta' và giờ đây phải quyết định đứng ngoài quan sát hay chìa tay giúp đỡ chiều không gian đang cận kề cái chết này."
 approach_save_b_world:0 "Đưa [Target.GetName]-Beta về vũ trụ của chúng ta"
