 job_stratovent_refiner_upg: "Thợ Tinh Chế Lỗ Phun Mở Rộng"
 job_stratovent_refiner_upg_plural: "Các Thợ Tinh Chế Lỗ Phun Mở Rộng"
 job_stratovent_refiner_upg_desc: "Các nhà nghiên cứu chuyên nghiên cứu hệ động vật không gian và các hiện tượng khí quyển độc đáo từ các lỗ phun bình lưu mở rộng."
 job_stratovent_refiner_minerals: "Thợ Tinh Chế Lỗ Phun Sụp Đổ"
