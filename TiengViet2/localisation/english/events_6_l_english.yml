 d_astrogarbage_collector: "Đơn Vị Rác Vũ Trụ"
 d_astrogarbage_collector_desc: "Bằng cách giảm lượng mảnh vỡ trên quỹ đạo, thế giới này hy vọng sẽ duy trì được khả năng du hành không gian."
 d_sprawling_landfill_blocker: "Bãi Rác Lan Rộng"
 d_sprawling_landfill_blocker_desc: "Những đồi rác vô tận, nhanh chóng tràn ra khỏi các khu vực được chỉ định."
 trash_rings: "Vành Đai Rác Thải"
 trash_rings_desc: "Hành tinh này được bao quanh bởi các vành đai lỏng lẻo tạo bởi các mảnh vỡ không gian nhân tạo."
 ground_locked: "Bị Kẹt Dưới Mặt Đất"
 ground_locked_desc: "Sau những vụ va chạm nghiêm trọng của các mảnh vụn không gian ở quỹ đạo thấp của hành tinh, không một con tàu nào có thể đi qua cho đến khi có thông báo mới."
 clear_skies: "Bầu Trời Xanh Trong"
 clear_skies_desc: "Bầu trời của thế giới này gần đây đã được dọn sạch các mảnh vụn không gian nguy hiểm, cho phép mọi người tự do đi lại ra vào tùy thích."
 shooting_stars: "Mưa Sao Băng"
 shooting_stars_desc: "Thế giới này trải qua những trận mưa sao băng định kỳ khi các mảnh vụn không gian bốc cháy trên quỹ đạo."

 ### MYRMEKU
 # Event Chain
 myrmeku_chain_title: "Hoạt Động Của Myrmeku"
 myrmeku_chain_desc: "Những đàn côn trùng nhỏ bé đã bừng tỉnh hoạt động, tràn quét khắp bề mặt cảnh quan [myrmeku_planet.GetName]."
 # Deposit and Job
 d_myrmeku_power_farms: "Nông Trại Năng Lượng Myrmeku"
 d_myrmeku_power_farms_desc: "Những loài côn trùng nhỏ bé này tạo ra nguồn năng lượng để chúng ta khai thác."
 job_myrmeku_power_farmer: "Kỹ Thuật Viên Năng Lượng Myrmeku"
 job_myrmeku_power_farmer_plural: "Các Kỹ Thuật Viên Năng Lượng Myrmeku"
 job_myrmeku_power_farmer_desc: "Các kỹ thuật viên khai thác năng lượng từ các bầy đàn Myrmeku."
 mod_job_myrmeku_power_farmer_add: "Việc Làm $job_myrmeku_power_farmer$"
 mod_job_myrmeku_power_farmer_per_pop: "§G+1§! Việc Làm $job_myrmeku_power_farmer$ mỗi $VALUE$ Dân Cư"
 mod_job_myrmeku_power_farmer_per_pop_short: "\n§G+1§! [technician.GetIcon] mỗi $VALUE$ £pop£"
 job_myrmeku_power_farmer_gestalt: "Drone Năng Lượng Myrmeku"
 job_myrmeku_power_farmer_gestalt_plural: "Các Drone Năng Lượng Myrmeku"
 job_myrmeku_power_farmer_gestalt_desc: "Các drone kỹ thuật khai thác năng lượng từ các bầy đàn Myrmeku."
 mod_job_myrmeku_power_farmer_gestalt_add: "Việc Làm $job_myrmeku_power_farmer_gestalt$"
 mod_job_myrmeku_power_farmer_gestalt_per_pop: "§G+1§! Việc Làm $job_myrmeku_power_farmer_gestalt$ mỗi $VALUE$ Dân Cư"
 mod_job_myrmeku_power_farmer_gestalt_per_pop_short: "\n§G+1§! [technician_drone.GetIcon] mỗi $VALUE$ £pop£"
 # Planet Modifiers
 planet_myrmeku_attacks: "Những Cuộc Tấn Công Của Myrmeku"
 planet_myrmeku_attacks_desc: "Các [Owner.GetColonistPluralCapital] đã bị tấn công bởi những loài côn trùng nhỏ bé."
 planet_myrmeku_seal_colony: "$planet_myrmeku_attacks$"
 planet_myrmeku_seal_colony_desc: "Đã có biện pháp chăm sóc đặc biệt để niêm phong mọi tòa nhà khỏi hệ động vật địa phương."
 planet_myrmeku_upgrade_robots: "$planet_myrmeku_attacks$"
 planet_myrmeku_upgrade_robots_desc: "Các [Owner.GetColonistPluralCapital] được thiết kế với lớp bảo vệ bổ sung cho các bộ phận cơ khí bên trong."
 planet_myrmeku_pest_control: "$planet_myrmeku_attacks$"
 planet_myrmeku_pest_control_desc: "Việc tiêu diệt các tổ côn trùng trên bề mặt đã được đặt làm ưu tiên hàng đầu."
 planet_myrmeku_lured: "Phân Tán Tài Nguyên"
 planet_myrmeku_lured_desc: "Vật liệu cách điện của chip bộ nhớ đã được phân phối trên khắp địa hình."
 # Special Project
 MYRMEKU_STUDY_PROJECT: "Nghiên Cứu Myrmeku"
 MYRMEKU_STUDY_PROJECT_DESC: "Một cuộc nghiên cứu về loài Myrmeku trên [myrmeku_planet.GetName] để xác định xem liệu hoạt động mạnh mẽ của chúng có thể biến thành thứ hữu ích hay không."

 # Events
 colony.9350.name: "Hoạt Động Của Myrmeku"
 colony.9350.desc: "Kể từ khi định cư trên §Y[Root.GetName]§!, chúng ta đã ghi nhận sự gia tăng hoạt động của loài chân khớp. Cụ thể, loài côn trùng nhỏ bé xây dựng bầy đàn được định danh là \"Myrmeku\" đã trở nên năng suất bất ngờ.\n\nCác tổ ngầm dưới lòng đất của chúng trải rộng khắp lục địa với số lượng lớn, nhưng cho đến nay chúng chưa từng gây ra vấn đề gì. Chưa rõ liệu chúng đang tìm kiếm thứ gì đó trên mặt đất hay đang trốn chạy khỏi điều gì bên dưới."
 colony.9350.a.mem_vault: "Cập nhật \"Myrmeku\" vào Hầm Tri Thức." # Civic Vaults of Knowledge
 colony.9350.a.exp_prot: "Một chủng loài đầy hấp dẫn." # Civic Exploration Protocols

 colony.9355.name: "[Owner.GetColonistPluralCapital] Bị Tấn Công"
 colony.9355.desc: "Các [Owner.GetColonistPlural] của chúng ta trên §Y[Root.GetName]§! đã bị tấn công dữ dội! Đi quá gần một tổ Myrmeku, họ đã bị bao vây. Khi những loài côn trùng nhỏ bé chui vào các khe hở trong khung của [Owner.GetColonistPlural], các nạn nhân đã nhanh chóng bị áp đảo hoàn toàn.\n\nNhững [Owner.GetColonistPlural] ngã xuống đã bị tháo rời ngay lập tức, nhưng không thu thập được dữ liệu mang tính kết luận nào về mục đích của loài côn trùng này. Bề mặt lởm chởm của bộ xương ngoài có từ tính của Myrmeku làm hỏng các mạch điện bên trong của chúng ta, và khi hai con Myrmeku chạm vào nhau, chúng tạo ra một tia lửa điện nhỏ; cả hai yếu tố này đều có thể gây ra những sự cố thảm khốc.\n\nViệc mất mát các [Owner.GetColonistPlural] theo cách này đã làm chậm tốc độ phát triển của [Root.GetPlanetMoon]. Chúng ta phải làm điều gì đó."
 colony.9355.a: "Tìm một giải pháp."

 colony.9360.name: "Kẻ Ăn Ký Ức"
 colony.9360.desc: "Với tốc độ đáng kinh ngạc, loài Myrmeku đã xây dựng một số cấu trúc trải dài gần khu định cư của chúng ta. Các cuộc tấn công của chúng không còn giới hạn ở chu vi bên ngoài nữa, mà đã bắt đầu xuất hiện bên trong các công trình nhà ở.\n\nSố lượng lớn các đối tượng thu được để mổ xẻ đã hé lộ lý do đáng lo ngại tại sao Myrmeku lại quan tâm đến chúng ta: Loài côn trùng này tiêu thụ vật liệu cách điện của các §Ychip bộ nhớ§! của chúng ta.\n\nĐiều này chỉ gây tử vong cho nạn nhân trong ngắn hạn, vì các mạch bộ nhớ có thể được thay thế và các bản sao lưu được khôi phục. Tuy nhiên, việc thay thế các bộ phận đồng nghĩa với việc trì hoãn việc chế tạo các [Owner.GetColonistPlural] mới."
 colony.9360.a: "Niêm phong thuộc địa của chúng ta."
 colony.9360.a.tt: "Tập trung vào việc bảo vệ an toàn cho các tòa nhà.\n\nBộ điều chỉnh §Y$planet_myrmeku_attacks$§! được cập nhật thành\nTốc Độ Lắp Ráp Dân Cư Cơ Khí: §R-10%§!\nTốc Độ Xây Dựng Cơ Sở Hạ Tầng Hành Tinh: §R-10%§!"
 colony.9360.b: "Nâng cấp cơ thể chúng ta."
 colony.9360.b.tt: "Tập trung vào việc bảo vệ an toàn cho các [Owner.GetColonistPlural].\n\nBộ điều chỉnh §Y$planet_myrmeku_attacks$§! được cập nhật thành\nTốc Độ Lắp Ráp Dân Cư Cơ Khí: §R-10%§!\nChi Phí Duy Trì Robot: §R+10%§!"
 colony.9360.c: "Tiêu diệt các tổ Myrmeku."
 colony.9360.c.tt: "Cách phòng thủ tốt nhất là tấn công hiệu quả.\n\nBộ điều chỉnh §Y$planet_myrmeku_attacks$§! được cập nhật thành\nTốc Độ Lắp Ráp Dân Cư Cơ Khí: §R-30%§!\n\n"
 colony.9360.d.org_repro: "Thu hoạch loài côn trùng này." # Civic Organic Reprocessing
 colony.9360.d.tt: "Chúng ta tìm ra công dụng cho mọi sự sống hữu cơ.\n\nBộ điều chỉnh §Y$planet_myrmeku_attacks$§! được cập nhật thành\nTốc Độ Lắp Ráp Dân Cư Cơ Khí: §R-30%§!\n\n"
 colony.9360.e.purifier: "Thanh lọc hành tinh khỏi sự sống." # Civic Determined Exterminator
 colony.9360.e.tt: "Điều này sẽ giết chết loài Myrmeku."

 colony.9365.desc: "Kiểm Soát Sinh Vật Gây Hại"
 colony.9365.desc.seal_colony: "Các công trình thuộc địa trên §Y[Root.GetName]§! đã được niêm phong hoàn toàn để ngăn chặn côn trùng Myrmeku lọt vào.\n\nLối vào của cả các tòa nhà mới và hiện có đều được trang bị các dải kim loại có thể từ hóa để bẫy Myrmeku, nhưng các [Owner.GetColonistPlural] vẫn tiếp tục bị thiệt hại do các cuộc tấn công ngoài thực địa."
 colony.9365.desc.upgrade_robots: "Các bộ nâng cấp nhằm bọc chip bộ nhớ của chúng ta trong một lớp vỏ bảo vệ bổ sung đã được phát triển và thử nghiệm trên thực địa.\n\nThật không may, hàm của Myrmeku đủ khỏe để cắn thủng bất kỳ vật liệu sẵn có nào, nếu có đủ thời gian và số lượng."
 colony.9365.desc.pest_control: "Để tiêu diệt Myrmeku, các đội tuần tra đã được cử đi để quét tìm các tổ. Việc phá hủy các cấu trúc trên mặt đất bằng lửa và chất nổ rất dễ dàng, nhưng các tổ ngầm dưới lòng đất bị chôn vùi quá sâu khiến việc diệt trừ tận gốc là bất khả thi.\n\nChúng ta thậm chí đã mất thêm nhiều [Owner.GetColonistPlural] trong suốt chiến dịch."
 colony.9365.desc.harvest: "Để kiểm soát Myrmeku, các cỗ máy thu hoạch sinh học đã được thiết lập gần các tổ của chúng. Các cấu trúc trên mặt đất dễ dàng được thu hoạch, nhưng các tổ dưới lòng đất lại bị chôn vùi quá sâu để có thể khai thác triệt để.\n\nChúng ta đã mất thêm nhiều [Owner.GetColonistPlural] trong suốt chiến dịch."
 colony.9365.a: "Cần có một giải pháp tốt hơn."

 colony.9370.name: "Phương Án Hạt Nhân"
 colony.9370.desc: "Mọi thứ đã được chuẩn bị sẵn sàng cho việc thanh trừng sự sống sinh học trên §Y[Root.GetName]§!.\n\nQuan sát [Root.GetPlanetMoon] từ quỹ đạo trong suốt sự kiện sẽ mang lại cho chúng ta cơ hội chiêm ngưỡng sự suy giảm mức độ phức tạp hữu cơ trên bề mặt."
 colony.9370.a: "Thật thanh tao."

 colony.9375.name: "Đề Xuất Của Chương Trình Con Phân Tích"
 colony.9375.desc: "Những nỗ lực cho đến nay vẫn chưa chấm dứt được vấn đề Myrmeku. Lũ côn trùng vẫn bò khắp [Root.GetName] với số lượng áp đảo, gây khó khăn cho việc đi lại và các hoạt động ngoài thuộc địa. Chương trình con phân tích của chúng ta đã hoàn tất việc mô phỏng các tương lai tiềm năng với những phương án tiếp cận sau.\n\nPhương án A: Đánh lạc hướng Myrmeku bằng cách thả dù vật liệu cách điện bộ nhớ ra xa thuộc địa của chúng ta và tái chế các [Owner.GetColonistPlural] đã ngã xuống.\n\nPhương án B: Nghiên cứu Myrmeku để xem liệu chúng ta có thể tìm ra cách biến hoạt động mạnh mẽ của chúng thành thứ hữu ích hay không."
 colony.9375.a: "Đánh lạc hướng chúng."
 colony.9375.a.tt: "Bộ điều chỉnh §Y$planet_myrmeku_attacks$§! được cập nhật thành\nChi Phí Duy Trì Robot: §R+5%§!\n\n"
 colony.9375.b: "Nghiên cứu chúng."

 colony.9380.name: "Kết Quả Đầy Sức Nặng"
 colony.9380.desc: "Nghiên cứu của chúng ta về Myrmeku đã kết thúc. Khi các nam châm được hiệu chuẩn được đặt xung quanh lối vào các tổ của chúng, từ tính trong bộ xương ngoài của côn trùng đã tạo ra điện năng mà chúng ta có thể khai thác.\n\nNghiên cứu cũng chỉ ra rằng Myrmeku di chuyển theo từ trường địa phương, do đó việc lắp đặt một lớp vỏ bảo vệ khử từ xung quanh chip bộ nhớ của chúng ta là đủ để bảo vệ chúng."
 colony.9380.a: "Thật xuất sắc."

## Event: Glacial Crisis
 colony.7230.name: "Khủng Hoảng Băng Hà"
 colony.7230.desc: "Báo cáo khí hậu mới nhất từ [planet.GetName] đã đưa ra một kết luận đáng quan ngại. Thật khó hiểu, nhiệt độ bề mặt trên hành tinh băng giá này đã tăng lên với tốc độ đáng báo động.\n\nNếu chúng ta không xác định được nguyên nhân khiến hệ sinh thái suy thoái nhanh chóng, tình hình có thể dẫn đến sự tan chảy thảm khốc của các dòng sông băng rộng lớn trên hành tinh."
 colony.7230.a: "Tìm hiểu lý do hành tinh nóng lên."
 colony.7230.a.tooltip: "Nguyên nhân có thể là gì?"
 colony.7230.b: "Chẳng có gì đáng phải lo lắng."
 colony.7235.name: "Những Vết Nứt Trong Băng"
 colony.7235.desc: "Sự gia tăng nhiệt độ trên [flooding_planet.GetName] đang tăng tốc mạnh mẽ. Điều này đã gây ra những vết rạn nứt đáng kể bên trong các lớp băng bề mặt, hé lộ một đại dương rộng lớn dưới bề mặt.\n\nMay mắn thay, các cuộc điều tra của chúng ta đã xác định được nguyên nhân tiềm tàng cho hiện tượng này. Do sự hiện diện của chúng ta, lá chắn khí quyển độc đáo bảo vệ hành tinh đã bắt đầu cho thấy sự mong manh nghiêm trọng và có thể sụp đổ. Thực hiện các biện pháp nghiêm ngặt để hạn chế sản xuất sẽ giảm thiểu tối đa tác động sinh thái của chúng ta. Chừng đó có thể đủ để giải quyết vấn đề."
 colony.7235.a: "Điều chỉnh lại các mục tiêu sản xuất của chúng ta."
 colony.7235.b: "Đã đến lúc kỷ băng hà phải kết thúc."
 colony.7235.b.tooltip: "Tăng cường động cơ hết công suất!"
 colony.7240.name: "Tan Băng Toàn Cầu"
 colony.7240.desc: "Nỗ lực của chúng ta nhằm hạn chế lượng khí thải trên [flooding_planet.GetName] đã không mang lại kết quả khả quan. Chúng ta chỉ thành công ở mức tối thiểu trong việc giải quyết cuộc khủng hoảng sinh thái đang diễn ra, và các vùng trũng địa lý đang bị đe dọa do mực nước biển dâng cao.\n\nHiện tại, các trung tâm dân cư của chúng ta vẫn được che chắn khỏi tác động ngay tức thì, nhưng gần như chắc chắn không thể tránh khỏi sự tan băng trên toàn hành tinh."
 colony.7240.a: "Cố gắng giảm thiểu thiệt hại."
 colony.7240.b: "Tuyên bố tình trạng khẩn cấp!"
 colony.7240.b.tooltip: "Dừng toàn bộ hoạt động sản xuất cho đến khi tìm ra giải pháp."
 colony.7245.name: "Vùng Đồng Lũ Mênh Mông"
 colony.7245.desc: "Hậu quả từ việc chúng ta lơ là giải quyết tình trạng sinh thái đang suy thoái nhanh chóng của [flooding_planet.GetName], tình hình đã biến tướng thành một thảm họa chưa từng có.\n\nSự tan rã của các dải băng khổng lồ đã tạo ra những đại dương bao la, để lại sự tàn phá và xáo trộn nặng nề. Bằng cách xây dựng các đê ngăn lũ, chúng ta có thể bảo vệ các thành phố còn lại, nhưng nhiều hậu quả khôn lường hơn nữa vẫn còn rập rình phía chân trời."
 colony.7245.a: "Hành tinh đang bị ngập lụt!"
 colony.7247.name: "Bí Mật Của Lớp Băng Vĩnh Cửu"
 colony.7247.desc: "Khi sự tan chảy của hành tinh [flooding_planet.GetName] tiếp diễn, một khám phá hấp dẫn đã được thực hiện bên dưới lớp băng vĩnh cửu. Một kho chứa khoáng sản và tài nguyên quý hiếm cực kỳ phong phú ở vùng cực đang nằm chờ đợi, vẫy gọi chúng ta bằng sự giàu có khôn xiết và tiềm năng chưa được khai phá."
 colony.7247.a: "Trúng số độc đắc rồi. Bắt đầu khoan ngay!"
 colony.7247.b: "Lớp băng vĩnh cửu đã chịu đựng quá đủ rồi."
 colony.7247.b.tooltip: "Chúng ta không thể mạo hiểm làm tình hình thêm tồi tệ."
 colony.7250.name: "Mầm Bệnh Rã Đông"
 colony.7250.desc: "Một diễn biến đáng lo ngại đã xảy ra tại trạm khai thác vùng cực của chúng ta trên [flooding_planet.GetName]. Các công nhân đột ngột rơi vào trạng thái bất tỉnh, đòi hỏi phải thiết lập một vùng cấm nghiêm ngặt vì sự an toàn của họ.\n\nCác cuộc điều tra ban đầu cho thấy sự xuất hiện của một loại virus ngủ đông, thức giấc khi môi trường băng giá bị xáo trộn. Bản chất thực sự và các đặc tính của mầm bệnh vừa thức giấc này vẫn còn chưa chắc chắn, khiến chúng ta phải đối mặt với vô số câu hỏi chưa có lời đáp. Mức độ lây truyền và mối nguy hiểm tiềm tàng mà nó gây ra cho người dân vẫn chưa được xác định."
 colony.7250.a: "Không được mạo hiểm. Khử trùng khu vực ngay lập tức."
 colony.7250.b: "Tiếp tục duy trì việc cách ly."
 colony.7255.name: "Của Cải Vùng Cực"
 colony.7255.desc: "Trong lòng sâu hun hút của vùng cực trên [flooding_planet.GetName], một đội khai thác đã tạo nên một phát hiện mang tầm vóc lịch sử. Ẩn mình bên dưới những lớp băng tuyết, những khối tinh thể khổng lồ gợi nhớ đến những dòng sông băng hùng vĩ đã được tìm thấy.\n\nNhững kiến tạo phi thường này, được rèn giũa dưới áp lực khủng khiếp qua vô vàn thời đại, là minh chứng cho tiềm năng vô hạn mà chúng ta vẫn chưa khai phá hết."
 colony.7255.a: "Một phát hiện thật đáng kinh ngạc."
 colony.7260.name: "Khí Hậu Ổn Định Trở Lại"
 colony.7260.desc: "Chúng ta đã đạt được một bước đột phá về môi trường.\n\nCác sản phẩm phụ tưởng chừng vô hại sinh ra qua quá trình đốt cháy nhiên liệu của chúng ta lại ẩn chứa một tác dụng phụ nguy hiểm khi tiếp xúc với các đám mây vi khuẩn của [flooding_planet.GetName]. Giờ đây chúng ta biết rằng những đám mây này đóng vai trò then chốt trong việc duy trì nhịp sinh học tự nhiên của hành tinh bằng cách hoạt động như một lá chắn mặt trời. Khi vi khuẩn dần suy giảm, chúng ta đã vô tình làm trầm trọng thêm tác động từ lượng khí thải của mình.\n\nĐược trang bị kiến thức mới này, các biện pháp kiên quyết đã nhanh chóng được ban hành để khôi phục lại trạng thái cân bằng."
 colony.7260.a: "Cuối cùng, khí hậu đã ổn định trở lại."
 colony.7265.name: "Hồi Kết Kỷ Băng Hà"
 colony.7265.desc: "Một kỷ nguyên khí hậu mới bắt đầu khi những tàn tích cuối cùng của các dòng sông băng trên [flooding_planet.GetName] chìm vào lòng đại dương. Sự biến mất của lớp băng vĩnh cửu đã làm lộ ra một vương quốc dưới nước rộng lớn, chứa đầy các tài nguyên chưa được khai thác."
 colony.7265.a: "Đến lúc đi nghỉ mát ở bãi biển rồi."
 PLANET_MELTDOWN_PROJECT: "Khủng Hoảng Khí Hậu"
 PLANET_MELTDOWN_PROJECT_DESC: "Khí hậu trên [flooding_planet.GetName] đang xấu đi nhanh chóng. Hy vọng chúng ta có thể tìm ra lý do trước khi quá muộn để đảo ngược tiến trình này."
 MELTING_RESEARCH_PROJECT: "Bề Mặt Đang Tan Chảy"
 MELTING_RESEARCH_PROJECT_DESC: "Nhiệt độ trên [flooding_planet.GetName] đã tăng lên nhanh một cách đáng báo động. Các [Root.GetScientistPlural] của chúng ta cần mở rộng phạm vi nghiên cứu để giải quyết các vấn đề mới sinh ra từ tình hình hiện tại."

 active_melting: "Nước Biển Dâng Cao"
 active_melting_desc: "Bề mặt băng giá của hành tinh này đang tan chảy với tốc độ đáng báo động."
 boosted_melting: "Hiệu Ứng Quả Cầu Tuyết"
 boosted_melting_desc: "Chúng ta đã gia tăng lượng khí thải công nghiệp để đẩy nhanh quá trình tan chảy các chỏm băng của hành tinh."
 halted_production: "Tạm Dừng Sản Xuất"
 halted_production_desc: "Chúng ta đã hạn chế tác động công nghiệp của mình nhằm bảo vệ môi trường mỏng manh của hành tinh này."
 ecological_emergency: "Khẩn Cấp Sinh Thái"
 ecological_emergency_desc: "Hành tinh này đã hoàn toàn ngừng sản xuất cho đến khi các nghiên cứu môi trường kết thúc."
 ancient_plague: "Virus Cổ Đại"
 ancient_plague_desc: "Thế giới này đã trở thành con mồi cho một mầm bệnh cổ xưa vừa thức giấc từ lớp băng vĩnh cửu bị tan chảy."
 cruel_actions: "Biện Pháp Phòng Ngừa Tàn Nhẫn"
 cruel_actions_desc: "Nhân danh sự an toàn, chúng ta đã tiêu diệt những người thực dân bị lây nhiễm bởi một bệnh dịch cổ xưa."

 d_floodplains: "Vùng Đồng Lũ Mở Rộng"
 d_floodplains_desc: "Những vùng đất rộng lớn của thế giới này bị ngập lụt do mực nước biển dâng nhanh."
 d_crystalline_glacier: "Cánh Đồng Băng Tinh Thể"
 d_crystalline_glacier_desc: "Những tinh thể màu xanh lam băng giá này từng là trái tim của những dòng sông băng nguyên thủy."
 d_mineral_seabed: "Đáy Biển Giàu Khoáng Sản"
 d_mineral_seabed_desc: "Đáy biển rải rác những khoáng sản chất lượng cao."

 mineral_diver: "$job_mineral_diver$"
 job_mineral_diver: "Thợ Lặn Biển Sâu"
 job_mineral_diver_plural: "Các Thợ Lặn Biển Sâu"
 job_mineral_diver_desc: "Các chuyên gia biển sâu thu hồi các khoáng sản chìm dưới đáy đại dương."
