 stratovent_world_chain_title: "Các Lỗ Phun Bình Lưu"
 stratovent_world_chain_desc: "Chúng ta có cơ hội tiếp cận một nguồn tài nguyên tiềm năng vô cùng màu mỡ trên hành tinh này dưới dạng các lỗ phun khí quyển độc nhất vô nhị."

 # Arc Sites
 broken_world_digsite:0 "Những Cánh Cổng Vỡ"
 broken_world_digsite_desc:0 "Chúng ta đã bắt được những tín hiệu kỳ lạ từ một công trình kiến trúc mái vòm bị vỡ nát trên bề mặt [From.Planet.GetName]. Bên dưới đó dường như ẩn chứa một mạng lưới tàn tích sâu thẳm."
 site_tombworld_weapon_cache:0 "Kho Vũ Khí"
 site_tombworld_weapon_cache_desc:0 "Một hầm chứa kiên cố cỡ lớn đã được tìm thấy bên dưới đống hoang tàn của [From.Planet.GetName]. Nó dường như được niêm phong từ trước cuộc đại thảm họa tuyệt diệt thế giới này."
 # Messages

 MESSAGE_HYPERDRIVE_SECURED_TITLE:0 "Đã Thu Hồi Động Cơ Siêu Không Gian"
 MESSAGE_HYPERDRIVE_SECURED:0 "Đội đổ bộ của chúng ta đã khống chế thành công lũ sinh vật chân khớp và thu hồi nguyên vẹn lõi động cơ siêu không gian cổ đại."

 # Modifiers
 the_lonely_bot_welcome:0 "Bàn Tay Giúp Đỡ"
 the_lonely_bot_welcome_desc:0 "Chú robot nhỏ bé sinh sống trên hành tinh này đã nỗ lực hết mình để giúp đỡ các cư dân thuộc địa xây dựng cơ sở hạ tầng ban đầu."

 eldritch_horror_mod:0 "Tri Thức Cổ Quái"
 eldritch_horror_mod_desc:0 "Những tri thức cấm kỵ được ban tặng cho đế chế bởi một thực thể cổ quái ngoài chiều không gian."

 crystalline_architecture_mod:0 "Kiến Trúc Tinh Thể"
 crystalline_architecture_mod_desc:0 "Những cải tiến trong bố cục thiết kế tinh thể đã giải phóng thêm không gian sinh sống và tối ưu hóa hệ thống dẫn truyền năng lượng."

 nanite_swarm_modifier:0 "Bầy Đàn Nanite"
 nanite_swarm_modifier_desc:0 "Hành tinh này bị xâm nhiễm bởi một bầy nanite ngoài hành tinh hung hãn, gây nguy hiểm cho bất kỳ ai đặt chân lên bề mặt."
 tamed_nanite_swarm_modifier:0 "Bầy Đàn Nanite Đã Thuần Hóa"
 tamed_nanite_swarm_modifier_desc:0 "Một bầy nanite tự tiến hóa đã được thuần hóa trên thế giới này, hỗ trợ đắc lực cho các hoạt động xây dựng và cải tạo môi trường."

 new_resonance_music_art:0 "Âm Nhạc Và Nghệ Thuật Cộng Hưởng"
 new_resonance_study:0 "Nghiên Cứu Sự Cộng Hưởng Mới"

 turtle_world_modifier:0 "Những Hòn Đảo Di Chuyển"
 turtle_world_modifier_desc:0 "Những thứ ban đầu được coi là các hòn đảo trên hành tinh này thực chất là những sinh vật Nemma khổng lồ trôi nổi trên đại dương."
 turtle_world_modifier_alone:0 "Trên Lưng Nemma"
 turtle_world_modifier_alone_desc:0 "$turtle_world_modifier_desc$ Cư dân đã học cách chung sống hòa thuận và định cư ngay trên lưng những sinh vật hiền lành này."
 turtle_world_slaves_modifier:0 "Nemma Bị Nô Dịch"
 turtle_world_slaves_modifier_desc:0 "Thế giới này đã nô dịch loài Nemma khổng lồ bản địa, biến chúng thành những quái thú thồ hàng và nền móng công nghiệp cơ giới."
 embraced_turtle_slavery_modifier:0 "Cưỡng Chế Nô Dịch Nemma"
 embraced_turtle_slavery_modifier_desc:0 "Bằng cách tận dụng triệt để chế độ nô dịch Nemma trên thế giới này, chúng ta đã tối đa hóa hiệu suất lao động và mở rộng không gian xây dựng."

 asteroid_relay_stations:0 "Trạm Tiếp Sóng Tiểu Hành Tinh"
 asteroid_relay_stations_desc:0 "Đế chế này đã bắt đầu bố trí các cảm biến tinh vi bên trong các tiểu hành tinh rải rác, mở rộng tầm phủ sóng tình báo."
 asteroid_encryption:0 "Mã Hóa Tiểu Hành Tinh"
 asteroid_encryption_desc:0 "Sử dụng thuật toán mã hóa cổ xưa được phát hiện bên trong một trạm tiếp sóng bỏ hoang để gia tăng độ bảo mật liên lạc."
 # Names

 gas_cascade_sad:0 "Tận Diệt Vô Ý"
 gas_cascade_sad_desc:0 "Đế chế này đang trong thời kỳ tang tóc sau khi vô tình gây ra sự tuyệt chủng của một loài vi sinh vật mong manh trên hành tinh khí."
 gas_cascade_happy:0 "Sự Thanh Thản Đạo Đức"
 gas_cascade_happy_desc:0 "Sau khi gây ra một vụ tuyệt chủng hàng loạt, đế chế này đã tìm lại được niềm an ủi và sự thanh thản bằng cách phục hồi thành công sinh quyển thế giới."

 unexplained_insights:0 "Hiểu Biết Khó Giải Thích"
 unexplained_insights_desc:0 "Đế chế này đã nhận được những bản hướng dẫn chính xác về cách thức và thời điểm phân công các nhà nghiên cứu, dường như được gửi đến từ tương lai."
 closed_loop:0 "Vòng Lặp Khép Kín"
 closed_loop_desc:1 "Đế chế này đã hoàn thành việc đóng kín vòng lặp thời gian và cảm thấy nhẹ nhõm khi không có nghịch lý thời gian nào phá hủy thực tại."

 asteroid_thrusters:0 "Bộ Đẩy Tiểu Hành Tinh"
 asteroid_thrusters_desc:0 "Sử dụng những bộ đẩy cổ xưa được chế tạo riêng cho tiểu hành tinh, đế chế này đã tối ưu hóa hiệu suất di chuyển và định vị trong không gian."

