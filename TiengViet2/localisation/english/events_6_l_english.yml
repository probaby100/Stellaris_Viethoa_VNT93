 job_mineral_diver_drone: "Drone Dưới Nước"
 job_mineral_diver_drone_plural: "Các Drone Dưới Nước"
 job_mineral_diver_drone_desc: "Các drone khai khoáng có thể chịu được áp lực cực lớn để thu thập các khoáng sản chìm dưới đáy đại dương."
