 # Fumongus Anomaly
 fungal_emitters_category:0 "Tín Hiệu Phát Kỳ Lạ"
 fungal_emitters_category_desc:0 "Những luồng phát xạ tín hiệu bất thường đang truyền ra từ mạng lưới hang động ngầm dưới lòng đất của [From.GetName]."

 anomaly.6755.name:0 "Nấm Phát Xạ"
 anomaly.6755.desc:0 "Bên dưới bề mặt [From.GetName] sinh sống một loài nấm hết sức kỳ dị. Thay vì chỉ phát tán bào tử thông thường, chúng còn phát ra các xung sóng điện từ được điều chế vô cùng tinh vi, gửi tín hiệu vào vũ trụ sâu thẳm."
 anomaly.6755.a:0 "Chúng ta sẽ cố gắng xác định điểm đến của tín hiệu."
 anomaly.6755.b:0 "Mang chúng về để bán."
 anomaly.6755.c:0 "Chúng ta không có thời gian cho việc này."
 anomaly.6760.intro:0 "Bên dưới bề mặt [From.GetName] sinh sống một loài nấm quen thuộc, dường như có mối liên hệ với các mẫu vật nấm phát xạ mà chúng ta từng bắt gặp trước đây."
 anomaly.6760.desc:0 "$anomaly.6760.intro$\n\nCác nhà khoa học của chúng ta giả thuyết rằng những cây nấm này thực chất là các nút chuyển tiếp của một mạng lưới liên lạc liên sao rộng lớn bằng sợi nấm."
 anomaly.6760.a:0 "Chuẩn bị một dự án để tiến hành điều tra."
 anomaly.6760.b:0 "Chỉ cần mang dữ liệu về."
 anomaly.6765.desc:0 "$anomaly.6760.intro$\n\nKể từ khi chúng ta tháo dỡ mạng lưới trước đó, các cây nấm ở đây dường như đang cố gắng phát tín hiệu tìm kiếm các nút mạng đã mất tích."
 anomaly.6770.name:0 "Dõi Theo Dấu Vết Nấm"
 anomaly.6770.intro:0 "Việc lần theo tín hiệu do hệ sợi nấm phát ra hóa ra là một thử thách vô cùng phức tạp đối với các thiết bị định vị của chúng ta."
 anomaly.6770.desc:0 "$anomaly.6770.intro$ Nhà khoa học đầy hoài nghi của chúng ta cuối cùng đã xác định được một tọa độ cụ thể nằm sâu trong một hệ sao lân cận."
 anomaly.6770.a:0 "Lập biểu đồ lộ trình!"
 anomaly.6780.desc:0 "$anomaly.6770.intro$ Bất chấp những nỗ lực tối đa của [Root.GetLeaderName], các tín hiệu yếu ớt đã biến mất hoàn toàn vào bức xạ nền của thiên hà trước khi nguồn gốc của chúng có thể được định vị chính xác."
 anomaly.6785.name:0 "Nhân Rộng Mạng Lưới Nấm"
 anomaly.6785.desc:0 "Việc cấy ghép các bào tử đột biến vào các quần thể nấm hiện có đã tạo ra một bước đột phá kỳ diệu: toàn bộ mạng lưới giờ đây có thể truyền tải dữ liệu sinh học tức thời giữa các thế giới cách xa hàng năm ánh sáng."

 FOLLOWING_FUNGI_PROJECT:0 "Dấu Vết Nấm"
 FOLLOWING_FUNGI_PROJECT_DESC:0 "Một dị thường trên [From.GetName] đã tiết lộ sự tồn tại của một mạng lưới nấm liên lạc cổ xưa. Chúng ta cần cử một tàu khoa học lần theo các xung tín hiệu này để tìm ra nguồn phát chính."
 MUSHROOMING_NETWORK_PROJECT:0 "Cấy Ghép Bào Tử"
 MUSHROOMING_NETWORK_PROJECT_DESC:0 "Việc phát hiện ra các bào tử đột biến mang lại cơ hội duy nhất để hòa nhập mạng lưới nấm vào hệ thống liên lạc thuộc địa của chúng ta."

 fumongus_chain_title:0 "$FOLLOWING_FUNGI_PROJECT$"
 fumongus_chain_desc:0 "$anomaly.6770.desc$"
 fumongus_poi_1:0 "$FOLLOWING_FUNGI_PROJECT$"
 fumongus_1_desc:0 "$anomaly.6770.desc$"

 ### Fumongus Colony Events
 #Events

 colony.2060.name:0 "Hái Nấm"
 colony.2060.desc:0 "Một cuộc khảo sát sinh thái định kỳ tại thuộc địa của chúng ta trên [Root.GetName] đã phát hiện ra các ổ nấm ngầm kỳ lạ phát triển dọc theo hệ thống cống ngầm của các thành phố."
 colony.2060.a:0 "Tiêu hủy chúng đi."
 colony.2060.b:0 "Xem xét kỹ lưỡng hơn."
 colony.2060.c:0 "... Chúng có liên quan đến nấm Fumongus!"
 colony.2065.name:0 "Bào Tử Có Tai"
 colony.2065.desc:0 "Chúng ta vừa nhận được những báo cáo đáng lo ngại từ [Root.GetName]: các xung điện từ phát ra từ nấm ngầm dường như đang biến đổi theo các cuộc trò chuyện của cư dân trong khu vực định cư lân cận."
 colony.2065.a:0 "Chúng ta cần phải biết nhiều hơn."
 colony.2065.b:0 "Quá nguy hiểm. Hãy tiêu diệt chúng."
 colony.2070.intro:0 "Phân tích cẩn trọng hệ sợi nấm và các tín hiệu mà nó thu nhận cho thấy cấu trúc này đang đóng vai trò như một thiết bị nghe lén sinh học cực kỳ tinh vi."
 colony.2070.name:0 "Có Ai Đó Đang Lắng Nghe"
 colony.2070.desc:0 "$colony.2070.intro$\n\nChúng ta không thể chắc chắn tuyệt đối, nhưng xem xét các hướng phát sóng, có vẻ như một thế lực vô danh nào đó đang sử dụng hệ sợi nấm để thu thập tình báo về thuộc địa của chúng ta."
 colony.2070.a:0 "Hãy bắt đầu chiến dịch tung tin giả!"
 colony.2075.name:0 "Không Ai Lắng Nghe"
 colony.2075.desc:0 "$colony.2070.intro$\n\nXem xét nhiều yếu tố và tính chất phân rã của các xung tín hiệu, dường như đây chỉ là một cơ chế phòng vệ tự nhiên bị hiểu lầm chứ không có ai thực sự đứng sau lắng nghe cả."
 colony.2075.a:0 "Chúng ta có thể học được gì từ hiện tượng này?"
 colony.2080.name:0 "Kết Nối Bào Tử"
 colony.2080.desc:0 "Bất kể những nghi ngờ nào chúng ta từng có về mối liên hệ của loài nấm này với các mạng lưới khác trong thiên hà, giờ đây tất cả đã được giải tỏa: mạng lưới sợi nấm này thực sự là một phần của một thực thể liên sao rộng lớn hơn nhiều."
 colony.2080.a:0 "Hãy xem liệu chúng ta có thể củng cố mạng lưới hay không."
 colony.2080.b:0 "Sử dụng nó để giám sát chặt chẽ hơn thuộc địa."
 colony.2080.c:0 "Chúng ta đã tháo dỡ mạng lưới, nhưng chúng ta vẫn có thể nghiên cứu các tàn tích."
 colony.2085.name:0 "Bất Ổn Trên [Root.GetName]"
 colony.2085.desc:0 "Tin tức về dự án sử dụng hệ sợi nấm địa phương để giám sát cư dân thuộc địa đã bị rò rỉ ra ngoài. Các cuộc biểu tình dữ dội đã bùng phát trên [Root.GetName], đòi hỏi quyền riêng tư và chấm dứt dự án."
 colony.2085.a:0 "Người dân nói đúng. Hủy bỏ dự án."
 colony.2085.b:0 "Nếu họ không có gì để che giấu, họ không có gì phải sợ."
 colony.2090.name:0 "Bào Tử Là Tai Mắt Của Chúng Ta"
 colony.2090.desc:0 "Chúng ta đã nhân rộng thành công hệ sợi nấm trên [Root.GetName], và mạng lưới giám sát sinh học này hoạt động vô cùng hiệu quả. Bất kỳ âm mưu nổi loạn hay mầm mống bất ổn nào đều bị phát hiện ngay từ trong trứng nước."
 colony.2095.name:0 "Nấm Thất Bại"
 colony.2095.desc:0 "Những nỗ lực kích thích sự lan rộng của hệ sợi nấm trên [Root.GetName] đã thất bại do sự đào thải sinh học của thổ nhưỡng địa phương. Các khối nấm đang tàn lụi nhanh chóng."
 colony.2095.a:0 "Thu hoạch chúng."
 colony.2095.b:0 "Nghiên cứu chúng."

 terra.15.name:0 "Thiết Bị Cải Tạo Dư Thừa"
 terra.15.desc:0 "Sau khi hoàn tất quá trình địa khai hóa §Y[From.GetName]§!, các [Owner.GetTerraformerPlural] của chúng ta nhận thấy một lượng lớn máy móc và vật liệu xây dựng hạng nặng vẫn còn nguyên vẹn. Chúng có thể được tái cấu trúc thành các cơ sở hạ tầng hữu ích cho hành tinh."
 terra.15.a:0 "Chúng ta có thể cần thêm chỗ ở."
 terra.15.b:0 "Xây dựng thêm một số xưởng đúc."
 terra.15.c:0 "Mở rộng khả năng năng lượng của thế giới này."
 terra.15.c.tooltip:0 "Thêm §G2§! §Y$district_generator_plural$§! vào Hành Tinh."
 terra.15.d:0 "Không bao giờ là thừa mỏ khoáng sản cả."
 terra.15.d.tooltip:0 "Thêm §G2§! §Y$district_mining_plural$§! vào Hành Tinh."
 terra.15.e:0 "Thêm nhiều trang trại cho [From.GetName]."
 terra.15.e.tooltip:0 "Thêm §G2§! §Y$district_farming_plural$§! vào Hành Tinh."
 terra.15.f:0 "Chỉ cần tháo dỡ các thiết bị."
 terra.20.name:0 "Vẻ Đẹp Nhân Tạo"
 terra.20.desc:0 "Quá trình địa khai hóa trên §Y[From.GetName]§! đã hoàn tất nhanh hơn nhiều so với dự kiến. Các [Root.GetTerraformerPlural] của chúng ta đã tạo nên một thế giới có phong cảnh hoàn mỹ và tráng lệ đến mức kỳ ảo."
 terra.20.a:0 "Kỳ diệu thay!"
 terra.20.b:0 "Nó có nhất thiết phải trông nhân tạo đến thế không?"
 terra.25.name:0 "Biến Chứng Địa Khai Hóa"
 terra.25.desc:0 "Dự án địa khai hóa kéo dài của chúng ta trên §Y[From.GetName]§! đã bất ngờ gặp phải một biến chứng địa chấn nghiêm trọng, để lại một vết nứt khổng lồ độc hại trên bề mặt được gọi là §YVết Tích Địa Khai Hóa§!."
 terra.25.a:0 "Đừng để chuyện này tái diễn nữa."
 terra.30.name:0 "Học Hỏi Từ Sai Lầm"
 terra.30.desc:0 "Các [Owner.GetTerraformerPlural] của chúng ta hiện đã dọn sạch các tàn dư địa khai hóa trên §Y[Root.GetName]§!. Quá trình xử lý sự cố này đã mang lại cho chúng ta nhiều hiểu biết quý giá về địa vật lý."
 terra.30.a:0 "Ít nhất cũng có điều tốt đẹp rút ra từ chuyện này."
 terra.35.name:0 "[Root.GetHomeWorldName] II"
 terra.35.desc:0 "Chúng ta không chỉ thành công trong việc địa khai hóa §Y[From.GetName]§!, mà các [Root.GetTerraformerPlural] còn tạo hình địa hình của [From.GetPlanetMoon] này giống hệt như thế giới quê hương [Root.GetHomeWorldName] của chúng ta!"
 terra.35.a:0 "[From.GetPlanetMoon] này sẽ được gọi là [Root.GetHomeWorldName] II."
 terra.35.a.tooltip:0 "Đặt tên cho §Y[From.GetName]§! thành §Y$terra.35.name$§!."
 terra.35.b:0 "Một bước phát triển đầy may mắn."
 terra.40.name:0 "Nước Cờ Hành Tinh"
 terra.40.desc:0 "Một tình huống độc nhất vô nhị đã nảy sinh trên §Y[From.GetName]§!. Các [Root.GetTerraformerPlural] nhận thấy hoàn toàn có thể khóa thủy triều [From.GetPlanetMoon] này một cách có chủ đích, tạo ra một bán cầu ban ngày vĩnh cửu vô cùng thuận lợi cho năng lượng mặt trời."
 terra.40.a:0 "Để cho [From.GetPlanetMoon] tự quay trở lại, rủi ro là quá lớn."
 terra.40.b:0 "Hãy làm điều đó."
 terra.40.b.tooltip:0 "Mở khóa một §YQuyết Định Thuộc Địa§! đặc biệt trên [From.GetPlanetMoon]."
 terra.45.name:0 "Dư Thừa Dẫn Đến Thành Công"
 terra.45.desc:0 "Khi quá trình địa khai hóa §Y[From.GetName]§! đang dần ổn định, [From.GetPlanetMoon] này biểu hiện một sự trù phú tài nguyên vượt bậc ngoài mong đợi của các [Root.GetTerraformerPlural]."
 terra.45.a:0 "Chúng ta có thể sử dụng thêm $district_generator_plural$."
 terra.45.b:0 "Hãy xem liệu chúng ta có thể phát triển thêm không gian cho $district_mining_plural$ không."
 terra.45.c:0 "Thế giới này có thể sử dụng thêm $district_farming_plural$."
 terra.50.name:0 "Nhất Thể"
 terra.50.desc:0 "Trong khi biến đổi §Y[From.GetName]§! thành thế giới [This.GetAAnPlanetClass] [This.GetClassAdj], các [Root.GetTerraformerPlural] không chỉ kết nối hệ động vật địa phương vào tâm trí tập thể, mà thông qua các đột biến kỳ lạ khi tiếp xúc với khí địa khai hóa, họ còn kết nối chính tâm trí tập thể với bản thân thế giới này. Tập thể giờ đây có cơ hội trở nên trọn vẹn theo một ý nghĩa chân thực hơn bao giờ hết."
 terra.50.a:0 "Vâng, tâm trí mong muốn điều đó."
 terra.50.b:0 "Không, đây không phải là chủ đích dành cho thế giới này."
 terra.55.name:0 "Tổ Chức Hoàn Hảo"
 terra.55.desc:0 "Việc vượt qua tự nhiên không phải là điều gì mới mẻ đối với thuộc địa này, nhưng mức độ trật tự được thiết lập trên §Y[From.GetName]§! sau quá trình địa khai hóa thực sự là một kỳ tích. Từng dòng sông, ngọn núi trên [From.GetPlanetMoon] đều được các [Root.GetUnitDronePlural] sắp đặt chính xác đến từng milimét."
 terra.60.name:1 "Khai Quật [GetPreFTLUpperPlural]"
 terra.60.desc:1 "Trong khi làm giàu đất và tạo bầu khí quyển cho §Y[From.GetName]§!, các [Root.GetTerraformerPlural] của chúng ta đã phát hiện ra một điều đáng kinh ngạc. Sâu trong các mạng lưới hang động ngầm của §Y[From.GetName]§!, một quần thể [GetPreFTLLowerPlural] nguyên thủy đang sinh sống trên [From.GetPlanetMoon] này mà chúng ta không hề hay biết."
 terra.60.a:0 "Thật kỳ lạ."
 terra.60.b:0 "Vậy là lũ sâu bọ giờ đây đang lẩn trốn dưới lòng đất."
 terra.60.c:0 "Thật tốt khi thấy vũ trụ này không hề thiếu vắng sự sống."
 terra.55.a:0 "Thật vừa lòng."
 terra.65.name:0 "Tì Vết Hữu Ích"
 terra.65.desc:0 "Thứ mà các [Root.GetTerraformerPlural] của chúng ta ban đầu lầm tưởng là một lỗi địa khai hóa nghiêm trọng trên §Y[From.GetName]§! hóa ra lại là một sự kết hợp khoáng vật hết sức độc đáo, mang lại cho [From.GetPlanetMoon] này một vẻ đẹp lộng lẫy và giàu tài nguyên."
 terra.65.a:0 "Xuất sắc."
 terra.70.name:0 "Những Đột Biến Bất Ngờ"
 terra.70.desc:0 "Các [Root.GetTerraformerPlural] của chúng ta có cả tin tốt lẫn tin bất ngờ về [From.GetName]. Quá trình địa khai hóa đã làm biến đổi một số loài sinh vật địa phương trên [From.GetPlanetMoon], ban cho chúng những khả năng thích nghi phi thường."
 terra.70.a:0 "Ít nhất thì chúng dường như không cảm thấy khó chịu."
 terra.75.name:0 "Thiên Đường Tọa Lạc Tại [From.GetName]"
 terra.75.desc_regular:0 "Trong số các [Root.GetTerraformerPlural] được phân công đến §Y[From.GetName]§!, có những người từng hoài niệm về phong cảnh thiên nhiên của quê hương [Root.GetHomeWorldName]. Họ đã biến niềm khao khát của loài [Root.GetSpeciesNamePlural] thành một kiệt tác thực sự: [From.GetName] giờ đây đã trở thành một Thế Giới Gaia hoàn hảo trên [From.GetPlanetMoon] này!"
 terra.75.desc_spirit:0 "Các nhà địa khai hóa của chúng ta đã vượt lên chính mình trên [Root.GetName]. Bằng niềm tin tôn giáo mãnh liệt, các [Root.GetTerraformerPlural] đã biến §Y[From.GetName]§! thành một thánh địa thiêng liêng rực rỡ."
 terra.75.a:0 "Nó thật đẹp đẽ."
 terra.75.b:0 "Nó chỉ là một Thế Giới Gaia bình thường thôi sao?"
 terra.80.name:0 "Thực Vật Phóng Xạ"
 terra.80.desc:0 "Trong khi làm sạch bức xạ độc hại trên §Y[From.GetName]§!, các [Root.GetTerraformerPlural] của chúng ta đã phát hiện ra một giống thực vật kỳ lạ phát triển mạnh mẽ nhờ chính bức xạ hạt nhân."
 terra.80.a:0 "Chúng ta đã phá hủy môi trường sống của chúng, giờ chúng ta phải bảo tồn chúng."
 terra.80.a.tooltip:0 "400 £pop£ §HDân Cư Hấp Thu Xạ§! tiền văn minh sẽ được chuyển tới khu bảo tồn trên §Y[This.GetName]§!."
 terra.80.b:0 "Tại sao không để chúng gia nhập cùng chúng ta?"
 terra.80.c.indifferent:0 "Thu hoạch vật liệu di truyền của chúng."
 terra.80.c.xenophile:0 "Nghiên cứu sinh học của chúng."
 terra.80.c.cantuse:0 "Dù không thể áp dụng trực tiếp cho chúng ta, vật liệu di truyền của chúng vẫn là một tài sản khoa học quý giá."
 terra.80.c.tooltip:0 "Mở khóa đặc tính §Y$trait_plantoid_radiotrophic$§!."
 terra.80.d:0 "Tại sao chúng ta phải bận tâm về loài cỏ dại này. Hãy hoàn tất việc địa khai hóa."
 terra.85.name:0 "Sự Đón Nhận Nồng Nhiệt"
 terra.85.desc:0 "Sau nhiều năm thích nghi và điều chỉnh, những sinh vật thực vật hấp thu xạ từ §Y[FromFromFrom.GetName]§! đã chính thức hòa nhập vào xã hội của chúng ta như những công dân bình đẳng."
 terra.85.a:0 "Chào mừng!"
 terra.85.a.tooltip:0 "§G600§! £pop£ §HDân Cư Hấp Thu Xạ§! sẽ được bổ sung vào đế chế của chúng ta."
 terra.90.name:0 "Kho Vũ Khí"
 terra.90.desc:0 "Khôi phục một Thế Giới Mộ Địa luôn là công việc gian nan trên §Y[From.GetName]§!, nhưng các [Root.GetTerraformerPlural] của chúng ta vừa tình cờ khai quật được một boong-ke quân sự cổ đại còn nguyên vẹn nằm sâu dưới lớp tro bụi phóng xạ."
 terra.90.a:0 "Thật tò mò."
 terra.95.name:0 "Đưa Quá Khứ Ra Ánh Sáng"
 terra.95.desc:0 "Kho vũ khí ngầm trên [From.Planet.GetName] không hề dễ dàng tiếp cận, nhưng các đội cứu hộ của chúng ta cuối cùng đã phá vỡ được các lớp cửa bọc thép kiên cố."
 terra.100.name:0 "Kho Binh Khí"
 terra.100.desc:0 "Các [Owner.GetLinguists] của chúng ta đã hoàn tất việc dịch thuật các biểu tượng và bảng hiệu bên ngoài boong-ke, xác nhận đây thực sự là một kho lưu trữ vũ khí của nền văn minh cổ đại."
 terra.105.name:0 "Dịch Sai"
 terra.105.desc.generic:0 "Có vẻ như các [Owner.GetLinguists] của chúng ta đã dịch sai một từ then chốt. Nơi này không phải là một kho vũ khí quân sự, mà là một viện bảo tàng nghệ thuật và văn hóa vĩ đại được bảo quản cẩn mật!"
 terra.105.desc.earth:0 "Có vẻ như các [Owner.GetLinguists] của chúng ta đã dịch sai ngữ nghĩa cổ xưa. Nơi này thực chất là một kho lưu trữ văn hóa và truyền thông đồ sộ từ thời kỳ tiền vũ trụ!"
 terra.105.a:0 "Vuốt ve bức tượng."
 terra.105.b:0 "Lập danh mục lưu trữ phương tiện truyền thông ngoại tinh."
 terra.105.c:0 "Chúng ta được hứa hẹn về vũ khí, hãy nung chảy thư viện và đúc thành súng ống!"

 #Deposit

 d_fungal_study_zone:0 "Khu Vực Nghiên Cứu Nấm"
 d_fungal_study_zone_desc:0 "Những cây nấm 'theo dõi' được tìm thấy ở đây là nguồn dữ liệu vô tận cho các nhà sinh học và chuyên gia truyền tin của chúng ta."
 d_terraforming_blocker:0 "£blocker£ Tàn Dư Địa Khai Hóa"
 d_terraforming_blocker_desc:0 "Kết quả của một dự án địa khai hóa thành công một phần, cần phải được dọn dẹp để giải phóng mặt bằng."
 d_dayside_farm:0 "Trang Trại Năng Lượng Mặt Trời Bán Cầu Ngày"
 d_dayside_farm_desc:1 "Thế giới này đã bố trí toàn bộ mạng lưới điện mặt trời trên bán cầu ban ngày vĩnh cửu, tối đa hóa sản lượng năng lượng."
 d_radiotrophic_preserve:0 "Khu Bảo Tồn Thực Vật Hấp Thu Xạ"
 d_radiotrophic_preserve_desc:0 "Một khu vực biệt lập được duy trì mức bức xạ và áp suất lý tưởng cho sự phát triển của các loài thực vật hấp thu xạ bản địa."

 #Modifier

 fumongus_monitor_pops:0 "Mạng Lưới Sợi Nấm Địa Phương"
 fumongus_monitor_pops_desc:0 "Chúng ta đã khai thác mạng lưới nấm ngầm để theo dõi và duy trì trật tự xã hội trên thuộc địa này."
 disinformation_protocols:0 "Giao Thức Tung Tin Giả"

 UBUME_BABY_CAT:0 "Mảnh Vỡ Kỳ Lạ"
 UBUME_BABY_CAT_DESC:0 "Các máy quét đã phát hiện một bãi phế tích trôi dạt không rõ nguồn gốc trong không gian sâu."

 anomaly.6791.name:0 "Con Tàu Ma"
 anomaly.6791.desc: "Kết quả quét bãi phế tích trong hệ sao $NAME_Hillos$ đã tiết lộ một con tàu vũ trụ cổ đại trôi dạt vô định giữa không gian tĩnh lặng."
 anomaly.6791.a:0 "Thật ma quái."

 anomaly.6792.name: "Đứa Con Của Tàu $NAME_Hillos_ship$"
 anomaly.6792.desc: "Nhóm khoa học của chúng ta kết luận rằng con tàu bị bỏ hoang trong hệ sao $NAME_Hillos$ thực chất là xác của một tàu mẹ sinh học khổng lồ, và tàu $NAME_Hillos_ship$ chính là sinh vật non nớt còn sống sót bên trong."
 anomaly.6792.alt.desc: "Nhóm khoa học của chúng ta kết luận rằng con tàu trôi dạt trong hệ sao $NAME_Hillos$ mang theo mầm mống của một sinh vật ngoài không gian non trẻ, sinh ra từ xác của tàu $NAME_Hillos_ship$."
 anomaly.6792.alt_hive_robot.desc: "Đánh giá của chúng ta về con tàu trong hệ sao $NAME_Hillos$ cho thấy một cấu trúc sinh học độc nhất vô nhị. Các [Owner.GetTelepathPlural] nhận định đây là ấu trùng của một thực thể không gian liên quan đến tàu $NAME_Hillos_ship$."
 anomaly.6792.a:0 "Một số phận đáng buồn."
 anomaly.6792.b:0 "Thật bực bội."

 anomaly.6793.name:0 "Tiếng Xì Xào Tâm Linh"
 anomaly.6793.desc: "Chúng ta phát hiện ra những dao động tâm linh bất thường phát ra từ xác tàu $NAME_Hillos_ship$ trong hệ sao $NAME_Hillos$, như thể có một ý thức đang cố gắng giao tiếp."
 anomaly.6793.desc.hive_robot: "Chúng ta phát hiện ra những xung sóng kỳ lạ phát ra từ tàu $NAME_Hillos_ship$ trong hệ sao $NAME_Hillos$. Các [Root.GetTelepathPlural] đang cố gắng giải mã hiện tượng này."

 anomaly.6794.name:0 "Xem Ai Đang Lên Tiếng"
 anomaly.6794.desc: "Sau nhiều tháng nghiên cứu đầy đau đớn, các nhà ngoại cảm của chúng ta cuối cùng đã hiểu được thông điệp mà sinh vật trên tàu $NAME_Hillos_ship$ trong hệ sao $NAME_Hillos$ đang cố gắng truyền tải. Nó đang cất tiếng khóc đòi mẹ - chính là sinh vật mẹ khổng lồ đã chết trong hệ sao $NAME_Hillos$."
 anomaly.6794.desc.hive_robot: "Sau nhiều tháng nghiên cứu sâu rộng, các [Root.GetTelepathPlural] của chúng ta đã xác định được bản chất của tín hiệu phát ra từ tàu $NAME_Hillos_ship$ trong hệ sao $NAME_Hillos$. Đó là một tiếng gọi sinh học tìm kiếm tàu mẹ đã bị hủy diệt trong hệ sao $NAME_Hillos$."
 anomaly.6794.a:0 "Thứ lỗi cho tôi. Các tuyến lệ của tôi đang hoạt động quá mức."
 anomaly.6794.a.hive_robot: "Một thực thể đầy tò mò."

 anomaly.6795.desc: "Chúng ta vừa nhận được tin từ một trong những chuyên gia ngoại cảm hàng đầu tại hệ sao $NAME_Hillos$: thực thể non trẻ trên tàu $NAME_Hillos_ship$ đã tìm thấy niềm an ủi trong tâm thức của các nhà nghiên cứu, chấp nhận họ như gia đình mới của nó trong hệ sao $NAME_Hillos$."
 anomaly.6795.desc.hive_robot: "Sau nhiều tháng nghiên cứu liên tục, các [Root.GetTelepathPlural] của chúng ta đã tích hợp thành công cấu trúc thần kinh của sinh vật non trẻ trên tàu $NAME_Hillos_ship$ trong hệ sao $NAME_Hillos$, cho phép nó giao tiếp trôi chảy và ổn định."
 anomaly.6795.a:0 "Một kết thúc có hậu."

#The Mask of Transformation

 mask_of_transformation:0 "Mặt Nạ Biến Đổi"
 site_transformation_dig:0 "Thông Điệp Dưới Tán Cây"
 site_transformation_intro:0 "Các nhà khoa học của chúng ta đã phát hiện ra một điều bất thường bên dưới tán rừng rậm rạp của [From.Planet.GetName]. Những hoa văn địa lý nhân tạo dường như đang truyền tải một thông điệp bí ẩn."

 ancrel.15010.name:0 "Thông Điệp Dưới Tán Cây"
 ancrel.15010.desc:0 "Các nhà khoa học của chúng ta phát hiện ra những hoa văn khổng lồ được khắc sâu vào đất đá bên dưới tán rừng của [From.Planet.GetName]. Chúng dường như chỉ dẫn tới một địa điểm cổ xưa bí mật."

 ancrel.15000.name:0 "Chào Mừng Đến Với Rừng Rậm"
 ancrel.15000.desc:0 "Trước tán rừng bất khả xâm phạm trên [From.Planet.GetName], các đội khai quật sẽ phải dùng máy cắt laser và máy bay không người lái để dọn đường tiếp cận tọa độ mục tiêu."
 ancrel.15000.a:0 "Đã hiểu."

 ancrel.15001.name:0 "Biến Đổi Tâm Linh"
 ancrel.15001.desc:0 "Phân tích mẫu đất hé lộ rằng [From.Planet.GetName] từng trải qua một làn sóng biến đổi tâm linh mãnh liệt. Đất đá và thảm thực vật nơi đây mang dấu vết của một nền văn minh đã cố gắng vượt qua giới hạn thể xác."
 ancrel.15001.a:0 "Thật hấp dẫn."

 ancrel.15002.name:0 "Hang Động"
 ancrel.15002.desc:1 "Cuối cùng cũng tiếp cận được tọa độ được chỉ dẫn, các nhà khảo cổ đã tìm thấy một lối vào hang động ngầm khổng lồ, được niêm phong bởi những phiến đá chạm khắc kỳ lạ."
 ancrel.15002.a:0 "Tiến hành đào bới!"

 ancrel.15003.name:0 "Cột Trụ"
 ancrel.15003.desc:0 "Một thông điệp hân hoan từ nhóm nghiên cứu trên [From.Planet.GetName]! Sâu trong hang động, họ đã tìm thấy một cột trụ năng lượng cổ xưa vẫn đang tỏa sáng lung linh."
 ancrel.15003.a:0 "Tiến hành với sự thận trọng."
 ancrel.15003.b:0 "Chúng ta phải khám phá nguồn gốc của quyền năng này."

 ancrel.15004.name:0 "Mặt Nạ Biến Đổi"
 ancrel.15004.desc:0 "Một bước đột phá từ đội ngũ khoa học trên [From.Planet.GetName]! Trên đỉnh cột trụ là một cổ vật hình chiếc mặt nạ tinh xảo, tỏa ra nguồn năng lượng tâm linh biến đổi khôn lường."
 ancrel.15004.a:0 "Thật không thể tin được."

 ancrel.15005.name:0 "Vỡ Vụn!"
 ancrel.15005.desc:0 "Sự thất vọng bao trùm trên [From.Planet.GetName] khi nhóm nghiên cứu vô tình làm chiếc mặt nạ cổ vỡ tan thành nhiều mảnh trong quá trình di dời. Tuy nhiên, các mảnh vụn tinh thể vẫn giữ được giá trị nghiên cứu đáng kể."
 ancrel.15005.a:0 "Thật bực bội, nhưng cũng có chút lợi lộc."

 ancrel.15006.name:0 "Bị Phục Kích!"
 ancrel.15006.desc:0 "Bản truyền tin khẩn cấp từ nhóm khoa học trên [From.Planet.GetName]! Đội khảo cổ do [Root.GetLeaderName] dẫn đầu đã bị phục kích bởi những sinh vật rừng rậm hung dữ khi đang cố gắng thu hồi cổ vật."
 ancrel.15006.a:0 "Đáng lo ngại."

 ancrel.15007.name:0 "Tìm Lại Được"
 ancrel.15007.desc:0 "Chúng ta vừa nhận được cập nhật từ đoàn thám hiểm trên [From.Planet.GetName]: sau cuộc hỗn chiến, cổ vật đã được bảo vệ thành công và các mẫu sinh vật ngoại tinh kỳ lạ đã được bắt giữ để nghiên cứu."
 ancrel.15007.a:0 "Chú vượn đó vẫn ổn cả!"

 ancrel.15008.name:0 "Bữa Tiệc Rừng Rậm"
 ancrel.15008a.desc:0 "Những thời khắc gian nan của nhóm nghiên cứu trên [From.Planet.GetName] cuối cùng đã qua đi. Đội khảo cổ đã tổ chức một bữa tiệc ăn mừng bên ngọn lửa trại giữa khu rừng nguyên sinh."
 ancrel.15008b.desc:0 "Những thời khắc gian nan của nhóm nghiên cứu trên [From.Planet.GetName] cuối cùng đã qua đi. Đội khảo cổ đã tổ chức một bữa tiệc ăn mừng bên ngọn lửa trại giữa khu rừng nguyên sinh hoang dã."
 ancrel.15008.a:0 "Quay lại làm việc thôi."

 engineered_nature:0 "Thiên Nhiên Nhân Tạo"
 engineered_nature_desc:0 "[Root.GetPlanetMoon] này đã được tinh chỉnh nhân tạo để đạt đến độ cân bằng sinh thái hoàn hảo, mang lại năng suất nông nghiệp vượt trội."
 second_home:0 "Ngôi Nhà Thứ Hai"
 second_home_desc:0 "[Root.GetPlanetMoon] này mang một sự tương đồng kỳ lạ với thế giới quê hương của chúng ta, đem lại sự an tâm tuyệt đối cho cư dân."
 intentionally_tidally_locked:0 "Chủ Động Khóa Thủy Triều"
 intentionally_tidally_locked_desc:0 "Trong quá trình địa khai hóa, thế giới này đã được chủ động khóa thủy triều để tối đa hóa sản lượng khai thác năng lượng mặt trời."
 perfect_organization_modifier:0 "Tổ Chức Hoàn Hảo"
 perfect_organization_modifier_desc:0 "Mọi thứ được tổ chức hoàn mỹ trên [Root.GetPlanetMoon] này, tối ưu hóa mọi luồng di chuyển và sản xuất của thuộc địa."
 imperfect_organization_modifier:0 "Tổ Chức Bất Toàn"
 imperfect_organization_modifier_desc:0 "Thế giới này từng được quy hoạch trật tự tuyệt đối, nhiều đến mức sự hỗn loạn nảy sinh đã tạo nên một nét đặc sắc mới lạ."
 paradise_made:0 "Thiên Đường Kiến Tạo"
 paradise_made_desc:0 "[Root.GetPlanetMoon] này đã được địa khai hóa để trở thành một thiên đường sinh thái thực sự, làm say đắm bất kỳ ai đặt chân tới."

 #lostsoulanomaly

 lost_soul_cat:0 "Linh Hồn Lạc Lối"
 lost_soul_cat_desc:0 "Chúng ta đã tìm thấy một robot hai chân bị hư hỏng nặng đang trôi dạt trong khoảng không vô tận của vũ trụ."

 anomaly.6786.name:0 "Linh Hồn Lạc Lối"
 anomaly.6786.desc:0 "Chúng ta đã phát hiện một robot hai chân trôi nổi ngoài không gian. Hệ thống năng lượng của nó đã cạn kiệt từ lâu, nhưng bộ nhớ lõi dường như vẫn còn nguyên vẹn."
 anomaly.6786.a:0 "Quét robot."
 anomaly.6786.a.tooltip:0 "§LĐể xem ngươi còn nhớ những gì, hỡi lữ khách vũ trụ.§!"
 anomaly.6786.b:0 "Bỏ mặc nó."
 anomaly.6786.b.tooltip:0 "§LTạm biệt nhé, đống sắt vụn.§!"

 anomaly.6787.name:0 "Linh Hồn Cổ Xưa"
 anomaly.6787.desc:0 "Thông qua nỗ lực bền bỉ, chúng ta đã tìm ra cách khôi phục các tệp nhật ký của chú robot. Nó lưu giữ hải trình của một nền văn minh đã lụi tàn từ hàng triệu năm trước."

 #TEMPORAL PRISM

 TEMPORAL_PRISM_CAT:0 "Dao Động Thời Gian Bất Thường"
 TEMPORAL_PRISM_CAT_DESC:0 "Những dao động bất thường trong kết cấu không-thời gian đã được phát hiện xung quanh [From.GetName]."

 anomaly.6788.name:0 "Lăng Kính Thời Gian"
 anomaly.6788.desc:1 "Phân tích của chúng ta về những biến động thời gian trong hệ sao [From.GetStarName] cho thấy tàu [Root.GetName] đang chứng kiến những phản chiếu quang học của quá khứ và tương lai cùng lúc hội tụ qua một vết nứt không gian."

 #snek

 colony.8099.name:0 "Lũ Rắn Xảo Quyệt"
 colony.8099.desc:0 "Chúng ta đã phát hiện những đàn sinh vật dạng rắn khổng lồ đang đào bới ngoi lên từ lòng đất của thuộc địa [root.GetName], đe dọa các khu dân cư."
 colony.8099.a:0 "Huy động các nhà khoa học và binh sĩ."

 colony.9100.name:0 "Mưu Mô Trườn Bò"
 colony.9100.desc:0 "Các cư dân thuộc địa trên [root.GetName] báo cáo rằng một số loài rắn kỳ lạ đang lén lút tiếp cận các trạm biến áp và đường dây điện ngầm."
 colony.9100.a:0 "Quan sát những sinh vật kỳ lạ này."
 colony.9100.b:0 "Dùng lửa tống khứ chúng khỏi thuộc địa."

 colony.9101.desc:0 "Lũ rắn dường như bị thu hút bởi các nguồn năng lượng điện trên [root.GetName]. Chúng nuốt chửng năng lượng và dường như ngày càng trở nên thông minh hơn."
 colony.9102.desc:0 "Lũ rắn trên [root.GetName] đã trở nên bớt hung hãn hơn, bắt đầu biểu hiện các hành vi xã hội phức tạp và thậm chí là cố gắng giao tiếp bằng các xung điện tử."

 colony.9103.name:0 "Tiếng Rít Độc Hiểm"
 colony.9103.desc:0 "Đúng như chúng ta quan sát về lũ rắn xâm nhập trên [root.GetName], chúng đã bắt đầu đục khoét các cơ sở hạ tầng trọng yếu."
 colony.9103.desc.science:1 "Đúng như chúng ta quan sát về lũ rắn xâm nhập trên [root.GetName], các nhà khoa học nhận định chúng đang tiến hóa với tốc độ phi mã nhờ hấp thụ điện trường."
 colony.9103.desc.soldier:0 "Đúng như chúng ta quan sát về lũ rắn xâm nhập trên [root.GetName], quân đội báo cáo rằng lớp vảy của chúng đã bắt đầu chống chịu được hỏa lực thông thường."
 colony.9103.a:0 "Để chúng ăn nguồn điện của chúng ta. Kích hoạt trạm ngầm."
 colony.9103.b:0 "Huy động quân xung kích. Tấn công bằng súng phun lửa."

 colony.9104.name:0 "Thế Giới Ngầm"
 colony.9104.desc:1 "Lũ rắn trên [root.GetName] đã biến đổi một số đường hầm mỏ thành tổ ấm kiên cố của chúng."
 colony.9104.desc.science:1 "Lũ rắn trên [root.GetName] đã biến đổi một số khu mỏ thành những tổ hợp công nghệ sinh học sơ khai."
 colony.9104.desc.soldier:1 "Lũ rắn trên [root.GetName] đã củng cố các hầm mỏ thành những pháo đài ngầm khó lòng xâm phạm."
 colony.9104.a:0 "Ngắt kết nối các thiết bị khai thác còn lại."
 colony.9104.b:0 "Đó là hậu quả của việc không sử dụng đủ hỏa lực."

 colony.9105.name:0 "Thảm Họa Xâm Nhiễm"
 colony.9105.desc:0 "Sự tàn phá không ngừng nghỉ từ những kẻ xâm lược dạng rắn đã gây thiệt hại nặng nề cho thuộc địa [root.GetName]. Cơ sở hạ tầng ngầm gần như tê liệt hoàn toàn."

 colony.9106.name:0 "Khai Sáng Và Món Quà"
 colony.9106.desc:0 "Lũ rắn trên [root.GetName] giờ đây đang sử dụng các thiết bị khai khoáng để đào bới các vỉa quặng quý hiếm và mang tặng cho các cư dân thuộc địa như một cử chỉ hòa bình!"
 colony.9106.desc.science:0 "Lũ rắn trên [root.GetName] nay đã thuần thục việc vận hành máy móc khai khoáng, đào sâu vào lớp vỏ hành tinh và khám phá ra những mỏ khoáng chất khổng lồ."
 colony.9106.a:0 "Những đường hầm mới của lũ rắn đã làm lộ ra... khoáng sản!"

 colony.9107.name:0 "Con Tàu Của Lũ Rắn"
 colony.9107.desc:0 "Lũ rắn trên [root.GetName] đã kiên nhẫn chờ đợi và bí mật lắp ráp một con tàu vũ trụ thô sơ từ các phế liệu kim loại thu thập được. Giờ đây, chúng đang chuẩn bị rời khỏi hành tinh để tiến vào vũ trụ."
 colony.9107.a:0 "Hãy để những sinh vật này có được con tàu và rời đi."
 colony.9107.a.tooltip:1 "Khi những sinh vật bò sát siêu thông minh này dấn thân vào vũ trụ, chúng ta sẽ chúc phúc cho hành trình của chúng."
 colony.9107.b:0 "Tiêu diệt con tàu của lũ rắn."
 colony.9107.b.tooltip:1 "Những sinh vật bò sát siêu thông minh này đã di dời tổ của chúng lên con tàu; tiêu diệt nó sẽ chấm dứt vĩnh viễn mối đe dọa."

 colony.9108.name:0 "Vươn Tới Các Vì Saorrr"
 colony.9108.desc:0 "Một con tàu đơn độc đã vượt qua mọi trạm dò quét của chúng ta trên [root.GetName] và phóng vút vào không gian sâu, để lại lời chào bằng tiếng rít cảm ơn."
 colony.9108.a:0 "Tạm biệt nhé, những chú rắn."
#  colony.9108.a.tooltip:0 "§LYour story has been... uplifting.§!"

 colony.9109.name:1 "Lịch Sử Tiếng Rít"
 colony.9109.desc:0 "Một vụ nổ khổng lồ đã kích nổ bên ngoài các khu định cư lớn nhất trên [root.GetName]. Con tàu của lũ rắn đã nổ tung trên bệ phóng, chôn vùi toàn bộ giống loài chúng vào dĩ vãng."
 colony.9109.a:0 "Tạm biệt nhé, những chú rắn."
#  colony.9109.a.tooltip:0 "§LYour long tale has ended. You're... history.§!"

 #VENDING MACHINE

 VENDING_MACHINE_CAT:0 "Một Lời Mời"
 VENDING_MACHINE_CAT_DESC:0 "Một trạm phát tín hiệu quay quanh [From.GetName], vẫy gọi các con tàu đi ngang qua bằng một thông điệp quảng cáo thương mại kỳ lạ."

 anomaly.7000.name:0 "Khối Đá Bí Ẩn"
 anomaly.7000.desc:0 "Khối kiến trúc nguyên khối mà chúng ta tìm thấy trên [From.GetName] có kích thước khổng lồ, trông như một cỗ máy bán hàng tự động liên sao cổ đại!"

 anomaly.7000.a:0 "Kích hoạt cỗ máy."
 anomaly.7000.b:0 "Tốt nhất là để nó yên."

 anomaly.7010.name:0 "Cỗ Máy Thức Tỉnh"
 anomaly.7010.desc.base:0 "Cỗ máy cựa mình, những cơ cấu cổ xưa lách cách bên trong khối kim loại dày đặc khi một khoang chứa hình trụ trượt ra ngoài. "
 anomaly.7010.a:0 "Đăng ký bản quyền đồ uống. Bán nó cho toàn thiên hà."
 anomaly.7010.desc.full:0 "Khoang chứa này chứa một loại đồ uống cổ đại, vẫn còn sủi bọt một cách thần kỳ sau hàng thiên niên kỷ! Mùi thơm ngào ngạt lan tỏa khắp phòng thí nghiệm."
 anomaly.7010.desc.full.megacorp:0 "$anomaly.7010.desc.base$$anomaly.7010.desc.full$ Các chuyên gia thương mại của chúng ta nhận ra ngay tiềm năng lợi nhuận khổng lồ từ công thức nước giải khát vũ trụ này."
 anomaly.7010.desc.full.nonbio:0 "$anomaly.7010.desc.base$$anomaly.7010.desc.full$ Dù chúng ta không tiêu thụ đồ uống hữu cơ, các [Owner.GetScientistPlural] vẫn có thể phân tích thành phần để thu được §YHiểu Biết Xã Hội§! sâu sắc."
 anomaly.7010.desc.full.bio:0 "$anomaly.7010.desc.base$$anomaly.7010.desc.full$ Các [Owner.GetScientistPlural] của chúng ta đã nếm thử và xác nhận đây là loại thức uống ngon nhất từng được tạo ra trong lịch sử thiên hà!"
 anomaly.7010.desc.empty:0 "$anomaly.7010.desc.base$Khoang chứa hoàn toàn trống rỗng, những giọt chất lỏng cuối cùng dường như đã bốc hơi từ hàng ngàn năm trước."
 anomaly.7010.desc.rot.bio:0 "$anomaly.7010.desc.base$Khoang chứa một thứ chất lỏng đã ôi thiu độc hại. Các [Owner.GetScientistPlural] phải vội vã niêm phong để tránh lây nhiễm khí độc."
 anomaly.7010.desc.rot.nonbio:0 "$anomaly.7010.desc.base$Khoang chứa một khối chất hữu cơ phân hủy mục rữa. Các [Owner.GetScientistPlural] ghi nhận thành phần hóa học của chất thải này."

 #GREED IS BAD
 colony.9050.name:0 "Những Vỉa Khoáng Sản Bất Ngờ"
 colony.9050.desc:0 "Các cuộc khảo sát địa chất trên [Root.GetName] đã làm lộ ra những vỉa khoáng sản vô cùng trù phú, nhưng chúng nằm ở độ sâu cực lớn đòi hỏi phải đầu tư ngân sách đặc biệt để tiếp cận."
 colony.9050.a:0 "Không cấp ngân sách. Bắt đầu đào bới thủ công."
 colony.9050.b:0 "Đã phê duyệt ngân sách. Hãy thăm dò sâu hơn."
 colony.9055.name:0 "Mạch Khoáng Tầng Sâu"
 colony.9055.desc:0 "Thăm dò lòng đất của [Root.GetName] là một quá trình tẻ nhạt: máy quét của chúng ta không phản hồi tốt với cấu tạo địa chất, và sự dịch chuyển của các tầng địa chất buộc chúng ta phải hiệu chuẩn lại liên tục. Dẫu vậy, chúng ta đã phát hiện thêm nhiều mạch quặng chất lượng cao có thể khai thác. Độ sâu của chúng khiến khâu hậu cần khai khoáng phức tạp hơn bình thường, nhưng chừng đó không đủ để cản bước chúng ta. Hiện không có gì bảo đảm rằng các đợt thăm dò tiếp theo sẽ tìm ra thêm các mạch khoáng sản khác."
 colony.9055.a:0 "Bắt đầu hoạt động khai thác mỏ."
 colony.9055.b:0 "Chắc chắn vẫn còn nhiều hơn thế."
 colony.9060.name:0 "Quá Ít, Quá Sâu"
 colony.9060.desc:0 "Các nỗ lực thăm dò gần đây nhất trên [Root.GetName] không mang lại kết quả khả quan. Bất kỳ khoáng chất nào chúng ta dò được đều chôn vùi quá sâu, trữ lượng quá nhỏ và nằm trong nền địa chất không ổn định. Chi phí dự kiến để khai thác các mạch này sẽ vượt quá lợi nhuận thu về. Dù vậy, những phát hiện trước đây của chúng ta đã đại diện cho một nguồn tài nguyên khổng lồ, đủ để chúng ta bận rộn trong nhiều thập kỷ, thậm chí hàng thế kỷ."
 colony.9060.a:0 "Rất tốt. Hãy bắt tay vào làm việc."
 colony.9065.name:0 "Thêm Quặng Khoáng"
 colony.9065.desc:1 "Dù khoáng sản trên [Root.GetName] có chôn sâu đến đâu, chúng ta cũng sẽ tìm ra và khai thác bằng được. Đó là việc chúng ta làm. Những kẻ khác có thể bỏ cuộc khi đối mặt với địa tầng bất ổn, độ sâu không tưởng hay khâu hậu cần duy trì các đường hầm vận chuyển, nhưng chúng ta thì không. Lòng đất chính là nhà của chúng ta, và nếu biết tìm đúng chỗ, nó sẽ chu cấp dồi dào. Càng xuống sâu, chất lượng và số lượng quặng càng cao. Các mẫu vật mới nhất thậm chí còn hé lộ sự hiện diện của các tinh thể quý hiếm ở tầng sâu hơn."
 colony.9065.a:0 "Chúng ta đã tìm thấy đủ rồi. Bắt đầu khai thác."
 colony.9065.b:0 "Những tinh thể đó sẽ thuộc về chúng ta!"
 colony.9070.name:0 "Tinh Thể Rực Lửa"
 colony.9070.desc:1 "Các đoàn thám hiểm khảo sát của chúng ta trên [Root.GetName] vừa chạm tới một độ sâu mới. Đúng như dự đoán, chúng ta bắt gặp những cụm tinh thể rực sáng với các sắc thái sống động của màu cam, vàng và đỏ khi có ánh sáng chiếu qua. Đôi lúc, cảnh tượng trông như thể có một chậu than rực lửa đang thắp sáng các hang động nơi chúng được tìm thấy, đổ bóng chập chờn lên vách đá. Chúng ta cũng có một quan sát đầy khó hiểu: dường như qua hàng thiên niên kỷ, các tinh thể này đang chậm rãi di chuyển về phía tâm hành tinh. Chúng ta tin chắc rằng sẽ còn tìm thấy nhiều hơn nữa nếu tiếp tục đào sâu hơn về phía lõi."
 colony.9070.a:0 "Các công tác thăm dò này quá tốn kém."
 colony.9070.b:0 "Vậy thì chúng ta sẽ tiếp tục đào sâu xuống."
 colony.9075.name:0 "Cái Giá Của Lòng Tham"
 colony.9075.intro:0 "Khi các nhà khảo sát đào sâu hơn nữa để tìm quặng trên [Root.GetName], ngày càng nhiều tinh thể rải rác trên đường đi của họ. Cuối cùng, họ chạm tới một hang động khổng lồ nằm sát lõi của [Root.GetName], và chúng ta mất liên lạc. Điều cuối cùng chúng ta biết là họ đang trong quá trình lắp đặt đèn chiếu sáng cùng các cảm biến để nghiên cứu hang động. Rồi những tiếng thét. Đau đớn. Cái chết. Hủy diệt.\n\nNguyên nhân nhanh chóng sáng tỏ khi các nhà khảo sát địa chất khác phát hiện nhiều sóng dội đường hầm đang lao với tốc độ khủng khiếp về phía các thuộc địa của chúng ta. Không lâu sau, giữa những cơn địa chấn và rung chuyển dữ dội, chúng ta bị tấn công bởi một thực thể tinh thể có kích thước khổng lồ. Nó không khác gì các tinh thể ngoài không gian, nhưng cực kỳ hung hãn và có khả năng dùng năng lực tái tạo của loài mình để định hình lại cơ thể trong chớp mắt.\n\n"
 colony.9075.outro:1 "Trong khi lõi của thực thể tinh thể vẫn bị chôn sâu dưới lòng đất, nó đã sinh ra các chi giống như xúc tu đào xuyên qua mặt đất nhằm tấn công chúng ta hoặc hấp thụ thêm tinh thể để phát triển. Các dự báo vô cùng ảm đạm và chúng ta có thể đang chứng kiến sự kết thúc của thuộc địa trên [Root.GetName]."
 colony.9075.desc.a:0 "$colony.9075.intro$ Mọi nỗ lực triển khai tín hiệu vô tuyến mà chúng ta thường dùng để xoa dịu các tinh thể không gian đều đã thất bại. $colony.9075.outro$" #Pacified Crystals
 colony.9075.desc.b:0 "$colony.9075.intro$ Đối đầu với một thực thể như vậy ngoài không gian — nơi tàu bè của chúng ta có thể phát huy tốc độ và hỏa lực — là một chuyện, nhưng chiến đấu với chúng trên bề mặt hành tinh lại hoàn toàn là chuyện khác. $colony.9075.outro$" #Regular
 NAME_Crystal_Kraken:0 "Hiểm Họa Tinh Thể"
 crystal_kraken_army:0 "Thực Thể Tinh Thể Lòng Đất"
 crystal_kraken_army_desc: "Nó đã say ngủ dưới lớp vỏ hành tinh qua nhiều thời đại, cho đến khi cơn đói cồn cào thôi thúc nó xé toạc hang ổ cổ xưa của mình."
 crystal_kraken:0 "Hiểm Họa Tinh Thể"
 NAME_Crystal_Shard:0 "Mảnh Tinh Thể"
 colony.9080.name:0 "Thực Thể Tinh Thể Bị Đánh Bại"
 colony.9080.desc:1 "Sau một chiến dịch gian khổ, thực thể tinh thể ngự trị tại tâm hành tinh cuối cùng đã bị đánh bại. Trận chiến quyết định diễn ra sâu dưới lòng đất, trong hang động chứa lõi của con quái thú tinh thể khổng lồ, và chỉ sau khi chúng ta đập tan được lõi đó, quái thú mới ngừng chiến đấu. Các chi của nó rã rời, mất đi tính liên kết ở cấp độ phân tử và rải bụi tinh thể khắp hành tinh. Vô số đường hầm do xúc tu tinh thể để lại sẽ hỗ trợ chúng ta rất nhiều trong nỗ lực khai thác các khoáng sản đặc biệt phong phú tạo nên thế giới này. Về nguồn gốc của chính thực thể này, chúng ta còn lại nhiều câu hỏi, nhưng có lẽ chúng ta vừa thu được một số hiểu biết sâu sắc về cách mà các thực thể tinh thể du hành không gian được tạo ra."
 colony.9080.a:0 "Cuối cùng cũng chiến thắng."
 d_crystal_kraken_body:0 "Tàn Tích Tinh Thể"
 d_crystal_kraken_body_desc:0 "Phần hài cốt vỡ vụn của thực thể tinh thể từng cư ngụ dưới lớp vỏ của thế giới này. Nhiều xúc tu của nó đều đã biến thành các mạch khoáng sản giàu có."
 d_crystal_kraken_body_bombed:1 "Tàn Tích Tinh Thể Vỡ Vụn"
 d_crystal_kraken_body_bombed_desc:0 "$d_crystal_kraken_body_desc$"
 colony.9085.name:0 "Những Hiện Tượng Bất Thường"
 colony.9085.desc:1 "Các hoạt động khai thác mỏ của chúng ta trên [Root.GetName] đã gặp phải những khó khăn bất ngờ. Từ những cơn rung chấn nhẹ cho đến các mạch tinh thể dịch chuyển, dường như có điều gì đó đang diễn ra. Dù có đầy đủ kinh nghiệm đào hầm, chúng ta vẫn không biết đó là gì. Những tình huống này khiến công việc khó có thể diễn ra trong điều kiện an toàn, và chúng ta đã mất đi trang thiết bị, nhân mạng cùng quặng mỏ trong những tai nạn và sập hầm không thể lường trước. Có lẽ tốt nhất là nên tạm dừng các hoạt động khai thác dưới một độ sâu nhất định?"
 colony.9085.a:0 "Chắc chẳng có gì đâu."
 colony.9085.b:0 "An toàn là trên hết."

 #### Rage Sage

 site_rage_sage_dig:0 "Mầm Mống Hủy Diệt"
 seeds_of_destruction_intro:0 "Chúng ta đã phát hiện một phi thuyền người ngoài hành tinh cổ xưa nằm vùi một nửa trong miệng hố va chạm của tiểu hành tinh. Băng giá đã lan rộng khắp phần lớn thân tàu, nhưng chúng ta vẫn có thể dễ dàng tiếp cận cửa khóa khí... và tìm kiếm bất kỳ bí mật nào ẩn giấu phía sau."

 ancrel.14001.name:0 "Cuồng Nộ Trong Lồng"
 ancrel.14001.desc:0 "Khi mở cửa khóa khí của phi thuyền ngoài hành tinh, sự thối rữa và mục nát đã chờ đón chúng ta ở phía bên kia. Cuộc điều tra sơ bộ đã phơi bày một cảnh tượng tàn sát đẫm máu. Sau khi khám nghiệm những thi thể bị xé nát của phi hành đoàn, chúng ta chắc chắn rằng họ đã tự xé xác lẫn nhau từng mảnh một. Chúng ta có thể quay lưng bỏ đi... nhưng khi đó chúng ta sẽ không bao giờ biết được lý do tại sao bi kịch này lại xảy ra."
 ancrel.14002.name:0 "Phòng Thí Nghiệm Tinh Vi"
 ancrel.14002.desc:0 "Đào sâu hơn, chúng ta đã phát hiện phòng thí nghiệm khoa học của con tàu. Nguồn năng lượng tối thiểu bao phủ khung cảnh trong ánh sáng tử ngoại nhạt nhòa. Một bụi cây tím rậm rạp đang giải phóng những đám mây bào tử dày đặc. Vị bác sĩ trên tàu đã sử dụng phòng thí nghiệm và trục thông gió để nhấn chìm toàn bộ con tàu trong một màn sương gây say mê độc hại."
 ancrel.14003.name:0 "Gạt Công Tắc!"
 ancrel.14003.desc:0 "Chúng ta tin rằng mình miễn nhiễm với toàn bộ tác động của làn sương gây say mê. Nếu có thể đưa động cơ con tàu hoạt động trở lại, chúng ta có thể phóng con tàu lên và đưa về quê nhà để nghiên cứu. Việc này sẽ tốn thời gian, nhưng phòng thí nghiệm dược phẩm tinh vi này có thể cung cấp các liệu pháp tăng cường sinh hóa hữu ích cho binh sĩ của đế chế."
 ancrel.14003.a:0 "Khởi động lò phản ứng ngay bây giờ!"
 ancrel.14003.b:0 "Chạy chẩn đoán và tiến hành sửa chữa."
 ancrel.14004.name:0 "Cơn Bộc Phát Cực Lạc"
 ancrel.14004.desc:0 "Chúng ta đã ngu ngốc nghĩ rằng mình miễn nhiễm với làn sương, nhưng các kỹ sư đang rơi vào trạng thái cực lạc ngây ngất. Họ nhảy múa dọc các hành lang của con tàu, hát những bài ca lạc điệu. Chúng ta sẽ cần thanh lọc bầu không khí và khống chế các kỹ sư trước khi có thể phóng con tàu. Sự chậm trễ này sẽ tiêu tốn thời gian của chúng ta."
 ancrel.14004.a:0 "Khống chế những kỹ sư đang đắm chìm trong cực lạc."
 ancrel.14005.name:0 "Cơn Bộc Phát Cuồng Nộ"
 ancrel.14005.desc:1 "Chúng ta đã ngu ngốc nghĩ rằng mình miễn nhiễm với làn sương, nhưng các nhà khoa học đang trải qua những cơn cuồng nộ loạn thần. Những cuộc ẩu đả đã nổ ra trên khắp con tàu. Chúng ta sẽ cần thanh lọc bầu khí quyển và khuất phục các nạn nhân của màn sương trước khi có thể phóng con tàu. Sự chậm trễ này sẽ tiêu tốn thời gian của chúng ta."
 ancrel.14005.a:0 "Khuất phục những nhà khoa học điên loạn."
 ancrel.14006.name:0 "Sự Cám Dỗ Của Công Nghệ"
 ancrel.14006.desc:0 "Chúng ta đã cất cánh! Dù nguy hiểm, làn sương gây say mê của phi thuyền ngoài hành tinh có thể tăng cường hiệu quả chiến đấu và lòng trung thành của binh sĩ đế chế. Tuy nhiên, câu hỏi vẫn còn đó: liệu chúng ta có nên để chính binh sĩ của mình tiếp xúc với chất độc hại này? Hay chúng ta nên từ chối và rút ra bài học từ những sai lầm bi thảm của họ?"
 ancrel.14006.a:0 "Khai thác công nghệ đầy hứa hẹn này."
 ancrel.14006.a.tooltip:0 "Chiến thắng đang chờ đợi! Binh sĩ của chúng ta nên sẵn sàng chấp nhận rủi ro này."
 ancrel.14006.b:0 "Từ bỏ công nghệ nguy hiểm này."
 ancrel.14006.b.tooltip:0 "Có những bí mật mà chúng ta vốn không nên biết."

 on_crashed_ship_cat:0 "Địa Điểm Rơi"
 on_crashed_ship_desc:0 "Chúng ta đã phát hiện một phi thuyền người ngoài hành tinh cổ xưa nằm vùi một nửa trong miệng hố va chạm của tiểu hành tinh."

 anomaly.7030.name:0 "Địa Điểm Rơi"
 anomaly.7030.desc:0 "Chúng ta đã phát hiện một phi thuyền người ngoài hành tinh cổ xưa bị vùi một nửa trong miệng hố va chạm của tiểu hành tinh. Vỏ ngoài của tàu khoa học này trang bị một dàn cảm biến mở rộng và không có vũ khí. Bên ngoài không bị hư hại gì trước khi va chạm. Chúng ta có thể phỏng đoán rằng thảm họa này là kết quả của một sai lầm chết người do chính phi hành đoàn gây ra."
 anomaly.7030.desc.a:0 "Thật bi thảm."

 #SPACE SHANTY (by Brian Campbell), Melody: "Fish in the Sea"

 site_space_shanty_dig:0 "Thông Điệp Trong Chai"
 space_shanty_intro:0 "Chúng ta đã tìm thấy xác của một phi thuyền cổ xưa với thiết kế bất thường. Thay vì sử dụng động cơ đẩy tương tự như các con tàu hiện đại, con tàu này dựa vào những cánh buồm lớn giương ra trong chân không vũ trụ. Có lẽ con tàu đã thu hoạch năng lượng mặt trời và trôi dạt theo những luồng gió sao sinh ra từ ánh sáng các vì tinh tú. Các nhà khảo cổ học của chúng ta rất háo hức muốn khám phá những bí mật ẩn giấu bên trong con tàu này."
 space_shanty_intro_bio: "Tàn tích trôi dạt của một thực thể cổ xưa vừa được phát hiện ở nơi thẳm sâu của không gian. Hình thái của nó không giống bất kỳ con tàu sống nào chúng ta từng biết; nó sở hữu những cánh buồm màng rộng lớn, từng có thể giương lên đón những cơn gió vũ trụ, tắm mình trong bức xạ của những vì sao xa xôi như một leviathan thiên thể vĩ đại lướt trên những dòng hải lưu vô hình.\n\nGiờ đây, nó chỉ còn là một lớp vỏ khô héo, khung xương nứt nẻ lộ ra ngoài, những cánh buồm từng óng ánh nay chỉ còn là những mảnh vụn rách rưới. Liệu sinh vật này được chế tạo, tiến hóa, hay là sự kết hợp của cả hai vẫn chưa thể chắc chắn. Các nhà sinh học khảo cổ đang nóng lòng nghiên cứu hài cốt của nó, lắng nghe những âm vang từ chuyến hành trình cuối cùng, và biết đâu đấy, có thể học được khúc ca mà nó từng cất lên cùng các vì sao."

 ancrel.15021.name:0 "Thông Điệp Trong Chai"
 ancrel.15021.desc:0 "Đúng như dự đoán, nội thất của con tàu 'chạy buồm mặt trời' này mang vẻ cổ kính tương xứng. Cầu chỉ huy trông giống như boong của một con tàu buồm cổ trên các đại dương hành tinh.\n\nLớp lát boong tàu dường như bằng kim loại, nhưng hầu hết các bề mặt đều được bọc gỗ chạm khắc, tương phản với chất liệu giống như thủy tinh trên các cửa sổ quan sát và màn hình dữ liệu.\n\nKhi khởi động máy tính của tàu, chúng ta đã tìm thấy một tập tin dữ liệu chứa một bài hát cổ của những người đi biển. Theo các nhà khảo cổ, giai điệu này từng được gọi là 'hải trình ca' hay 'khúc hát thủy thủ không gian'. Chúng ta đang cố gắng chép lại lời bài hát."
 ancrel.15022.name:0 "Khúc Hát Thủy Thủ Không Gian"
 ancrel.15022.desc:0 "Ngay sau khi chúng ta hoàn tất việc phục hồi và tái kích hoạt các tệp dữ liệu, một giai điệu âm nhạc rộn rã đã vang vọng khắp con tàu, hòa cùng giọng hát tự động điều chỉnh của các thủy thủ cổ đại. Bản ghi lời như sau:\n\n'Hỡi những chàng trai trẻ du hành không gian, hãy lắng nghe tôi!\nTôi sẽ hát cho các bạn nghe khúc ca về loài cá từ biển khơi!\n\nTrời nổi gió rồi các chàng trai, bão tố nổi lên rồi,\nKhi cơn gió thổi bùng, chúng ta sát cánh bên nhau,\nThổi gió về cõi xa xăm, hây! Thổi đi hỡi những cơn gió!\nTiến ra thiên hà bao la, con tàu lướt đi vững vàng.\n\nGió mặt trời đã nổi lên\nĐưa chúng ta đi thật xa\nXuyên qua các hải trình vũ trụ\nVà vươn tới muôn vì sao!\n\nTrời nổi gió rồi các chàng trai, bão tố nổi lên rồi,\nKhi cơn gió thổi bùng, chúng ta sát cánh bên nhau,\nThổi gió về cõi xa xăm, hây! Thổi đi hỡi những cơn gió!\nTiến ra thiên hà bao la, con tàu lướt đi vững vàng!'"
 ancrel.15023.name:0 "Quái Thú Vũ Trụ"
 ancrel.15023.desc:0 "Khi thám hiểm con tàu, các nỗ lực tiếp tục cấp điện và khôi phục tệp dữ liệu đã mở khóa thêm nhiều khổ thơ của khúc hát thủy thủ không gian cổ xưa. Màn hình ba chiều của tàu chiếu rực rỡ hình ảnh các thủy thủ và lữ khách vũ trụ đang cùng nhau hát ca nhảy múa:\n\n'Rồng Lớn bỗng xuất hiện\nTìm kiếm mái nhà xưa\nXuyên qua không gian đến một nơi\nNằm dưới ngàn con sóng và bọt biển!\n\n'Trời nổi gió rồi các chàng trai, bão tố nổi lên rồi,\nKhi cơn gió thổi bùng, chúng ta sát cánh bên nhau,\nThổi gió về cõi xa xăm, hây! Thổi đi hỡi những cơn gió!\nTiến ra thiên hà bao la, con tàu lướt đi vững vàng.\n\n'Tiyanki trồi lên\nVị vua của không gian sâu thẳm\nĐua tốc độ cùng tàu ta\nTrong cuộc rượt đuổi siêu không gian!\n\n(lặp lại điệp khúc)\n\n'Leviathan xuất hiện\nXúc tu vươn ra siết chặt\nBóp nghẹt con tàu chúng ta\nKhiến ta run rẩy hụt hơi!\n\n(lặp lại điệp khúc)'"
 ancrel.15024.name:0 "Thức Uống Nồng Độ Cao"
 ancrel.15024.desc:0 "Các nhà khảo cổ của chúng ta đã khai quật được một kho chứa thức uống nồng độ cao. Lẽ nào các thủy thủ xưa đã tiêu thụ thứ chất lỏng hôi hám này? Chúng ta chắc chắn sẽ không nuốt những chất lỏng kỳ dị này. Cuộc thám hiểm con tàu tự thân nó đã đủ say mê rồi!\n\n'Kìa những người Lithoid\nĐược đẽo gọt từ đá tảng\nNhững tảng đá này càng táo bạo hơn\nKhi chúng không còn đơn độc!\n\n(điệp khúc)\n\n'Kìa những kẻ Necroid\nThật đáng sợ và hùng mạnh\nCác bạn không thể giết được họ đâu,\nHọ sẽ lại hồi sinh thôi!\n\n(điệp khúc)\n\n'Kìa bầy đàn robot\nHãy sẵn sàng tháo chạy\nĐánh một, mười, một tá,\n1101!\n\n(điệp khúc)'"
 ancrel.15025.name:0 "Tháo Dây Buộc Tàu!"
 ancrel.15025.desc:1 "Cuộc khám phá của chúng ta đã hé mở một góc lịch sử cổ đại, phô bày nhiệt huyết và lòng dũng cảm của các nhà thám hiểm tiền nhân. Rõ ràng vị thuyền trưởng đã dùng 'hải trình ca vũ trụ' này để khích lệ và phối hợp hành động cho toàn bộ thủy thủ đoàn. Thậm chí có lẽ họ còn cùng nhau đồng ca! Các nhà khảo cổ đề xuất màn trình diễn này nên được bảo tồn trong một bảo tàng.\n\nVề giai điệu cổ xưa, chúng ta đã chép lại toàn bộ lời ca tìm được và lưu vào cơ sở dữ liệu. Giờ đây, các 'thủy thủ' của chúng ta cũng có thói quen hát các phiên bản khúc hát vũ trụ của riêng họ, giúp nâng cao sĩ khí và hiệu suất làm việc.\n\n'Chúng ta trỗi dậy từ đại dương\nVà vươn tới trời xanh\nChúng ta đang xây dựng một đế chế\nSẽ không bao giờ tàn lụi!\n\n'Trời nổi gió rồi các chàng trai, bão tố nổi lên rồi,\nKhi cơn gió thổi bùng, chúng ta sát cánh bên nhau,\nThổi gió về cõi xa xăm, hây! Thổi đi hỡi những cơn gió,\nTiến ra thiên hà bao la, con tàu lướt đi vững vàng!'\n\nĐã đến lúc cởi dây neo khỏi con tàu cổ này, 'tháo dây buộc tàu' để căng buồm đón gió mặt trời. Vững vàng tay lái tiến ra khơi!"
 ancrel.15022.a:0 "Dịch thêm lời bài hát."
 ancrel.15023.a:0 "Dịch thêm lời bài hát nữa!"
 ancrel.15024.a:0 "Chúng ta muốn nghe thêm lời ca!"
 ancrel.15025.a:0 "Ghi nhớ lời bài hát và định ra hải trình tiếp theo!"

 on_solar_sails_cat:0 "Trên Những Cánh Buồm Mặt Trời"
 on_solar_sails_cat_desc:0 "Chúng ta đã tìm thấy xác của một phi thuyền cổ xưa với thiết kế bất thường. Chúng ta không hoàn toàn chắc chắn hệ thống đẩy của nó hoạt động ra sao."

 anomaly.7020.name:0 "Trên Những Cánh Buồm Mặt Trời"
 anomaly.7020.desc:0 "Chúng ta đã tìm thấy xác của một phi thuyền cổ xưa mang thiết kế độc đáo. Thay vì sử dụng động cơ đẩy tương tự như các con tàu hiện đại, cỗ tàu này dựa vào những cánh buồm lớn giương ra trong chân không vũ trụ. Có lẽ con tàu đã thu hoạch năng lượng mặt trời và trôi theo gió mặt trời do ánh sao tạo nên."
 anomaly.7020.a:0 "Chúng ta nên đào sâu hơn."

 harmonious_crew:0 "Thủy Thủ Đoàn Hòa Hợp"


