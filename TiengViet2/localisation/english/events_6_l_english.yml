 d_stasis_prison:0 "Nhà Tù Đình Trệ"
 d_stasis_prison_desc:0 "Bên trong mặt trăng của hành tinh này, một khu phức hợp nhà tù bỏ hoang được kết nối với mạng lưới các khoang đình trệ tiên tiến. Các tù nhân bị đóng băng bên trong không thể trốn thoát."
 d_prisoner_intergration: "Hòa Nhập Có Cấu Trúc"
 d_prisoner_intergration_desc: "Giải thoát các tù nhân đình trệ cùng một lúc sẽ là một sai lầm. Bằng cách xem xét từng trường hợp cụ thể, chúng ta có thể đảm bảo tốt hơn rằng mỗi cá nhân đều có thể hòa nhập hoàn toàn vào xã hội của chúng ta."
 d_meals_in_pods: "Bữa Ăn Trong Khoang"
 d_meals_in_pods_desc: "Những kẻ bị đóng băng trong trạng thái đình trệ trở thành những bữa ăn đóng gói sẵn tuyệt hảo."

 #Special Project
 STASIS_PRISON_PROJECT: "Bí Ẩn Hạt Phân Tử"
 STASIS_PRISON_PROJECT_DESC: "Các [Owner.GetColonistPluralCap] trên [Root.GetName] liên tục biến mất. Một bước đột phá trong cuộc điều tra đã chỉ ra sự hiện diện của dư lượng hạt mang điện tích độc nhất. Chúng ta sẽ sử dụng mọi thông tin có được để định vị các [Owner.GetColonistPlural] mất tích."

