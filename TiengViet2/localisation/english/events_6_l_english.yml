# The Adjudicator

THE_JUDGE_CAT: "Bức Xạ Tăng Đột Biến"
THE_JUDGE_CAT_DESC: "Một sự gia tăng đột biến về bức xạ đã được phát hiện ở vùng lân cận của [From.GetName]. Hãy tiến hành thận trọng khi điều tra."

anomaly.9000.name: "Con Tàu Bí Ẩn"
anomaly.9000.desc: "Nghiên cứu của chúng ta về [From.GetName] đã mang lại những kết quả thú vị. Bên trong lõi của tiểu hành tinh là một khoảng không gian rỗng hoàn hảo hình cầu. Các bức tường nhẵn mịn đến mức như được chạm khắc với độ chính xác cấp nguyên tử, và lơ lửng ở trung tâm là một con tàu nhỏ. Nó dường như đang gửi tín hiệu gọi [Root.GetName] và sẽ chỉ nói chuyện với [Root.GetLeaderName]."
anomaly.9000.a: "Hiện hình ảnh đó lên màn hình chính."

anomaly.9001.name: "Quan Tài Phán"
anomaly.9001.desc: "Ngươi đã phung phí 63% tiềm năng được phân bổ theo thống kê của mình.\nHãy chứng minh sự tồn tại của ngươi trong 47 giây tới... hoặc bị xóa sổ khỏi mối quan hệ nhân quả."
anomaly.9001.a: "Ngươi là ai? Ngươi muốn gì?"
anomaly.9001.a.response: "Ta là Quan Tài Phán. Cơ hội được sống là một món quà quý giá mà hiếm ai nhận được, và ngươi đã lãng phí món quà của mình.\n\nCòn 38 giây..."
anomaly.9001.b: "Ngươi có ý gì khi nói 'xóa sổ'?"
anomaly.9001.b.response: "Ta sẽ trao vị trí mà ngươi đang nắm giữ trong dòng thời gian này cho một kẻ có thể chứng minh mình xứng đáng hơn. Một kẻ vốn chưa từng có cơ hội được thành hình. Ngươi sẽ không chỉ đơn thuần bị lãng quên. Sự tồn tại vô giá trị của ngươi sẽ xem như chưa từng xuất hiện."
anomaly.9001.c: "Ngươi là ai mà dám phán xét? Ai cho ngươi cái quyền đó?!"
anomaly.9001.c.response: "Ta phán xét bằng hành động. Ta có quyền bằng cách nắm lấy nó.\n\nNgươi đã tiêu hao hơi thở, không gian và băng thông, nhưng chẳng đóng góp được gì ngoài sự gia tăng của entropy. Đa vũ trụ không thương tiếc thứ dằn tàu đã mất đi.\n\n0 giây..."

anomaly.9002.name: "Xung Phóng Xạ"
anomaly.9002.desc: "Nghiên cứu của chúng ta về [From.GetName] đã mang lại những kết quả thú vị. Tiểu hành tinh sở hữu một lõi vật chất phóng xạ phát ra xung định kỳ khi nó phân rã. Mặc dù nhà khoa học của chúng ta, [Root.GetLeaderName], có thể không bao giờ bình phục sau liều phóng xạ gamma cực lớn, xung phát ra là có thể dự đoán được và không gây rủi ro cho các nhà nghiên cứu trong tương lai."
anomaly.9002.a: "Rất tiếc, [Root.GetLeaderName]."