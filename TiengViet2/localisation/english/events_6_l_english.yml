 # Traits

 trait_notofthisworld:0 "Đến Từ Thế Giới Khác"
 trait_notofthisworld_desc:0 "§BChủng loài này không thuộc về vũ trụ này và đang dần dần suy biến§!."
 trait_robot_notofthisworld:0 "Đến Từ Thế Giới Khác"
 trait_robot_notofthisworld_desc:0 "§BNhững cỗ máy này không thuộc về vũ trụ này và đang dần dần suy biến§!."
 TRAIT_NOTOFTHISWORLD_EFFECT:0 "Mỗi $pop_group_unit$ £pop£ §HDân cư§! làm việc ở mức nô lệ trở lên tạo ra 0.5 £physics_research£ §YĐiểm Nghiên Cứu Vật Lý§! mỗi tháng."

 # Event Chain
 negative_mass_title: "Khối Lượng Âm"
 negative_mass_desc: "Khối Lượng Âm gần đây đã xuất hiện xung quanh quê nhà của chúng ta. Hiện tượng kỳ lạ này chắc chắn sẽ không phải là điềm báo cho điều gì đó có thể làm lung lay tận gốc rễ xã hội chúng ta."

 # Singing Planet

 SINGING_PLANET_CAT:0 "Những Chỉ Số Kỳ Lạ"
 SINGING_PLANET_CAT_DESC:0 "Hành tinh này phát ra những làn sóng từ trường kỳ lạ, hoàn toàn không giống bất cứ thứ gì chúng ta từng thấy cho đến nay, gần như thể nó đang cố gắng liên lạc với chúng ta. Việc điều tra hiện tượng bất thường này là hoàn toàn hợp lý — chúng ta có thể vừa bắt gặp một ví dụ phi thường về sự sống ở quy mô hành tinh."

 anomaly.7101.name:0 "Hành Tinh Ca Hát"
 anomaly.7101.standard.desc:0 "Điều mà ban đầu chúng ta cho là một nỗ lực giao tiếp có chủ ý hóa ra lại là một hiện tượng tự nhiên bất thường nhưng hoàn toàn tự phát. Các sóng từ trường do hành tinh tạo ra, nếu được xử lý và tinh chỉnh thích hợp, có thể nghe hơi giống tiếng nói hoặc thậm chí là tiếng hát, nhưng chúng hoàn toàn không được tạo ra bởi một sinh vật có tư duy. Tuy nhiên, một số nhà khoa học của chúng ta thấy nó khá bắt tai.\n\nCó thể tận dụng hiện tượng này bằng cách tiếp đón các nghệ sĩ hoặc nhân vật quan trọng tại một trạm vũ trụ được xây dựng chỉ để đón nhận các tín hiệu này và phát chúng như một giai điệu thư giãn."
 anomaly.7101.a:0 "Thật quyến rũ."
 anomaly.7101.machines.desc:0 "Hành tinh này đang phát ra một loạt tín hiệu mà các drone thám hiểm của chúng ta suy đoán có thể có nguồn gốc nhân tạo. Sau khi kiểm tra kỹ lưỡng hơn, các tín hiệu hóa ra chỉ là một hiện tượng tự nhiên gây ra bởi những làn sóng từ trường bất thường nhưng vô hại. Phát hiện này không mang lại bất kỳ lợi ích ngay lập tức nào cho tập thể, nhưng với tính độc đáo của chúng, việc nghiên cứu chúng có thể cung cấp cho chúng ta một số dữ liệu nghiên cứu về lâu dài."
 anomaly.7101.b:0 "Ghi chép lại."
 anomaly.7101.hive.desc:0 "Hành tinh này đang phát ra một loạt tín hiệu mà các drone thám hiểm của chúng ta suy đoán có thể có nguồn gốc nhân tạo. Sau khi kiểm tra kỹ hơn, chúng hóa ra không gì khác hơn là một hiện tượng tự nhiên, mang đặc tính bất thường là tăng cường sự gắn kết của các drone với tâm trí tập thể. Dường như những drone tiếp xúc với sóng từ trường của hành tinh phản ứng tốt hơn với ý chí của bầy đàn."
 anomaly.7101.c:0 "Mọi thứ vì bầy đàn."
 anomaly.7101.c.desc:0 "Bầy đàn có thể nhân rộng các sóng từ trường này và dùng chúng để củng cố ý chí của mình."

 # Ancient Manufactorium

 colony.9200.name:0 "Hầm Chứa Ẩn Giấu" #starting the event
 colony.9200.desc:0 "Trong một đợt trinh sát tiêu chuẩn trên [Root.GetName], đơn vị khám phá hành tinh đã tình cờ phát hiện một cánh cửa đồ sộ dường như dẫn thẳng vào bên trong một dãy núi. Có vẻ như từ trường mạnh do một thiết bị tàng hình nào đó tạo ra đã giấu nó khỏi các cảm biến trên tàu của chúng ta, và lối vào được ngụy trang vẫn hoàn toàn vô hình trước các tàu thăm dò nghiên cứu tự hành đang lập bản đồ bề mặt.\n\nMặt khác, các thử nghiệm chuyên sâu hơn đã chỉ ra rằng việc cung cấp một dòng năng lượng ổn định sẽ giúp cánh cửa hoạt động trở lại, cuối cùng cho phép chúng ta mở nó ra và xem những gì ẩn chứa bên trong."
 colony.9200.a:0 "Cung cấp năng lượng." #go on with chain
 colony.9200.a.desc:0 "Thiết lập mạng lưới điện có thể mất một thời gian và sẽ tiếp tục tiêu hao năng lượng trong suốt quá trình khám phá hầm chứa."

 colony.9201.name:0 "Bóng Tối Đón Chờ" #entered the vault
 colony.9201.desc:0 "Khi năng lượng chảy qua các mạch điện, lối vào đã khởi động, và với một vài điều chỉnh nhỏ, chúng ta nhanh chóng phát hiện ra cách vận hành cánh cửa. Nghiên cứu địa hình bổ sung đã hé lộ bên trong là một hầm ngầm rộng lớn. Cơ sở hạ tầng của người ngoài hành tinh bao phủ từng centimet vuông của các bức tường — ngay cả những cột trụ khổng lồ nâng đỡ trần hang cũng phát ra những tín hiệu năng lượng mờ nhạt. Dựa trên các chỉ số năng lượng và sự tương đồng mơ hồ với công nghệ của chúng ta, có vẻ đây là một cơ sở chế tạo dưới lòng đất."
 colony.9201.a:0 "Chúng ta sẽ tìm hiểu những bí mật của nó." #go forward
 colony.9201.a.desc:0 "Xét đến quy mô của chiến dịch này, sẽ cần rất nhiều tài nguyên, nhân lực và một khoảng thời gian chưa thể xác định để nghiên cứu thấu đáo. Dự kiến sẽ có các báo cáo và cập nhật định kỳ về tiến độ công việc."
 colony.9201.b:0 "Chúng ta không thể mạo hiểm, hãy đặt chất nổ." #opt out
 colony.9201.b.desc:0 "Chúng ta sẽ niêm phong lối vào và phá hủy nơi này. Ai biết được thứ gì có thể đang ẩn nấp bên trong hầm chứa này."

 colony.9202.name:0 "Vụ Nổ Núi!" #opted out - explosion and crater
 colony.9202.desc:0 "Những ai ở xa hầm chứa đều có thể cảm nhận được mặt đất rung chuyển. Những người ở gần hơn có thể chứng kiến một mảng sườn núi khổng lồ văng tung lên không trung, tạo ra một miệng hố va chạm khổng lồ chứa đầy đá tảng, mảnh vỡ vụn và những cỗ máy bị vặn vẹo. Phỏng đoán nhanh về điều có thể đã sai sót dẫn đến kết luận rằng một phản ứng dây chuyền đã kích hoạt bên trong hầm chứa khi vụ nổ ban đầu phá vỡ cánh cửa.\n\nDù sao đi nữa, một miệng hố nghi ngút khói là tất cả những gì còn sót lại của hầm ngầm này."
 colony.9202.a:0 "Như thế này an toàn hơn."

 colony.9210.name:0 "Mất Tích!" #first problem
 colony.9210.desc:0 "Giai đoạn nghiên cứu ban đầu trên [Root.GetName] phần lớn tập trung vào việc lập bản đồ lối vào. Căn phòng đầu tiên bên trong hầm là một đại sảnh khổng lồ, ăn sâu vào lòng núi, với nhiều hành lang phân nhánh đâm sâu hơn nữa vào các tầng sâu thẳm. Nhiều tấm phù điêu hoa mỹ trang trí các cột đá đục đẽo, mỗi tấm miêu tả chủng tộc người ngoài hành tinh được cho là đã xây dựng nơi này. Chúng ta không thể giải mã ngôn ngữ của họ, nhưng câu chuyện được kể lại qua các tác phẩm nghệ thuật đó tập trung vào chiến tranh, đấu tranh và các dự án vĩ đại.\n\nĐáng lo ngại hơn là việc mất tích của cả một đội xây dựng; sau khi báo cáo về sự hiện diện của những âm thanh kỳ lạ trong bóng tối, đội này đơn giản là bốc hơi không dấu vết. Tình hình đang có nguy cơ vượt khỏi tầm kiểm soát và đòi hỏi những hành động quyết đoán hơn."
 colony.9210.a:0 "Tăng gấp đôi lực lượng an ninh và tìm kiếm họ." #casual
 colony.9210.a.desc:0 "Chúng ta sẽ thành lập một đội tìm kiếm, nhưng rất nhiều công dân đã dự đoán điều tồi tệ nhất. Chúng ta cũng sẽ tăng gấp đôi lính gác để ngăn chặn các sự cố tiếp theo."
 colony.9210.b:0 "Cử tất cả mọi người vào, tìm họ bằng được!" #egalitarian
 colony.9210.b.desc:0 "Chúng ta không thể để họ chết! Chúng ta sẽ lập một đội tình nguyện để tìm kiếm những người mất tích!"
 colony.9210.c:0 "Lập đội tìm kiếm, và đưa những người còn lại trở lại làm việc." #authoritarian
 colony.9210.c.desc:0 "Đã dự liệu trước rằng điều tương tự có thể xảy ra. Chúng ta sẽ cố gắng tìm những công nhân mất tích, nhưng chúng ta không thể trì hoãn hoạt động của mình — chúng ta sẵn sàng trả giá."
 colony.9210.d:0 "Thật đáng lo ngại. Hãy cử thêm drone hộ vệ." #gestalt
 colony.9210.d.desc:0 "Các đơn vị mất tích sẽ được thay thế bằng các đơn vị mới. Nghiên cứu phải được tiếp tục."

 colony.9211.name:0 "Đã Tìm Thấy Công Nhân" #casual - pop dies and negative modifier
 colony.9211.desc:0 "Một trong những đội an ninh của chúng ta báo cáo rằng các công nhân mất tích đã được tìm thấy. Hóa ra hầm chứa này vẫn còn những cạm bẫy và thiết bị hoạt động, được lập trình để bẫy những vị khách không mời bên trong những \"chiếc hộp\" tạo bởi các bức tường di động và tách rời.\n\nNhững người công nhân xấu số đều đã thiệt mạng bên trong bẫy. Người dân của chúng ta vô cùng phẫn nộ trước kết quả này, nhưng ít nhất giờ đây chúng ta đã biết cần phải đề phòng điều gì."
 colony.9211.a:0 "Thật khủng khiếp."

 colony.9212.name:0 "Giải Cứu Công Nhân" #egalitarian - pop survives, negative modifier only
 colony.9212.desc:0 "Nhờ có đội tìm kiếm đông đảo, không mất nhiều thời gian để tìm ra những công nhân mất tích. Những người cuối cùng được phát hiện bị mắc kẹt trong một cấu trúc giống nhà tù hình vuông làm từ những bức tường khớp nối tự chuyển động. Dường như hệ thống an ninh bên trong hầm chứa vẫn đang hoạt động. Với điều này, chúng ta sẽ chuẩn bị tốt hơn để đối phó với những cạm bẫy tương tự trong tương lai. Dẫu vậy, người dân vẫn tức giận vì các công nhân ngay từ đầu đã không được trang bị các biện pháp an toàn thỏa đáng."
 colony.9212.a:0 "Chúng ta đã may mắn."

 colony.9213.name:0 "Đã Tìm Thấy Công Nhân" #authoritarian - pop dies, no negative modifier
 colony.9213.desc:0 "Những công nhân mất tích được tìm thấy trong một cạm bẫy kỳ quái giam hãm họ giữa bốn bức tường di động. Thật không may, những cá thể này không còn ích lợi gì cho đế chế nữa, nhưng ít nhất sự hy sinh của họ đã hé lộ sự tồn tại của cái bẫy. Công việc giờ đây tiếp tục không bị cản trở, và lực lượng lao động tại công trường cảm thấy nhẹ nhõm phần nào khi biết rằng họ an toàn — ít nhất là vào lúc này."
 colony.9213.a:0 "Họ vốn biết rõ mối nguy hiểm."

 colony.9214.name:0 "Đã Tìm Thấy Drone" #gestalt - pop dies
 colony.9214.desc:0 "Các drone mất tích được tìm thấy trong một cạm bẫy khéo léo gồm các bức tường chuyển động liên kết với nhau để tạo ra các không gian giam giữ khép kín. Thật không may, tất cả drone của chúng ta đều hư hỏng vượt mức có thể tái sử dụng. Kể từ giờ, các drone khảo sát của chúng ta sẽ sử dụng kiến thức này để vô hiệu hóa những cạm bẫy loại này. Công việc tiếp tục mà không có thêm bất kỳ sự gián đoạn nào."
 colony.9214.a:0 "Thật đáng tiếc. Tiếp tục."

 colony.9220.name:0 "Đại Sảnh Tưởng Niệm" #first opportunity
 colony.9220.desc:0 "Chúng ta đào sâu vào các hành lang tại [Root.GetName] và phát hiện một đại sảnh lớn, nơi kỳ lạ là không có những cỗ máy đường ống bao phủ mọi hành lang và bức tường khác. Có vẻ như bất kỳ ai đã xây dựng nơi này đều dành sự chăm sóc đặc biệt cho nó — có rất nhiều bức tượng ở đây trong tình trạng hoàn hảo, khắc họa những cá thể hai chân. Với một vài dấu vết chi tiết, chúng hầu như có một diện mạo đồng nhất. Thật không may, không có bằng chứng nào về công năng của sảnh này, ngoại trừ việc nó có lẽ là một đài tưởng niệm để tri ân các nhân vật lịch sử."
 colony.9220.a:0 "Lập danh mục phát hiện." #casual
 colony.9220.a.desc:0 "Đó chỉ là một tác phẩm nghệ thuật cổ vô dụng, không có giá trị thực sự."
 colony.9220.b:0 "Đây là tay nghề thủ công tinh xảo." #master crafters
 colony.9220.b.desc:0 "Một số thợ thủ công của chúng ta kinh ngạc trước công trình do những người ngoài hành tinh đó tạo ra. Họ tìm thấy dấu ấn của vẻ đẹp và sự hòa hợp cổ xưa trong nghệ thuật của họ."
 colony.9220.c:0 "Công trình bằng đá thật tráng lệ." #sub dwellers
 colony.9220.c.desc:0 "Người dân của chúng ta nhận thấy tác phẩm bằng đá có chất lượng tuyệt hảo đến kinh ngạc, điều này mang lại cảm giác vô cùng dễ chịu tại một nơi xa lạ như thế này."
 colony.9220.d:0 "Chúng thật đẹp đẽ!" #dwarf
 colony.9220.d.desc:0 "Nơi này trông gần như tác phẩm do những thợ đẽo đá và nghệ nhân vĩ đại nhất của chúng ta tạo nên. Liệu đây chỉ là một sự trùng hợp thuần túy?"

 colony.9230.name:0 "Động Đất Sắp Xảy Ra!" #earthquake
 colony.9230.desc:0 "Máy đo địa chấn của chúng ta đã phát hiện một trận động đất sắp ập đến trên [Root.GetName]. Hầu hết các công nhân đã tìm được nơi an toàn, nhưng một nhóm đang ở trong một đại sảnh xa xôi có nguy cơ bị sụp đổ. Họ báo cáo có hai cỗ máy cổ đại khác biệt ở đó — một cỗ máy cồng kềnh gắn liền với mặt đất, và cỗ máy kia gắn vào tường qua một loạt đường ống. Chúng ta không thể biết liệu chúng có điều gì quan trọng đối với cơ sở này hay không. Các công nhân ước tính rằng có thể dùng một trong những cỗ máy đó để gia cố trần và tường chống lại cơn địa chấn."
 colony.9230.a:0 "Sử dụng đường ống gắn tường." #casual 1
 colony.9230.b:0 "Sử dụng cỗ máy cồng kềnh." #casual 2
 colony.9230.c:0 "Dựa vào chuyên môn của họ." #builders
 colony.9230.d:0 "Bầy đàn sẽ tìm ra giải pháp." #hive divided attention

 colony.9231.name:0 "Bình An Vô Sự" #casual 1 more upkeep
 colony.9231.desc:0 "Các công nhân của chúng ta đã tháo dỡ cỗ máy thành công và gia cố vững chắc cho các cột trụ nâng đỡ và trần nhà. Tuy nhiên, nỗ lực này đã làm lộ ra hệ thống đường ống chằng chịt trong tường, từ đó phát ra những tiếng rít xì xào. Ngay lúc này, không thể đánh giá được các tổn thất tiềm ẩn."
 colony.9231.a:0 "Thành công."

 colony.9232.name:0 "An Toàn Thỏa Đáng" #casual 2 less produce
 colony.9232.desc:0 "Các công nhân của chúng ta đã tháo dỡ cỗ máy và sử dụng thành công để củng cố sức chịu lực của các cột chống cũ và trần nhà — nhưng cái giá thực sự là gì? Việc dỡ bỏ cỗ máy cồng kềnh đã tạo ra một cái hố sâu hoắm trên sàn dẫn sâu hơn vào bên trong hệ thống máy móc. Những tổn thất tiềm ẩn của hành động này, vào lúc này, hoàn toàn chưa rõ."
 colony.9232.a:0 "Thành công."

 colony.9233.name:0 "Thi Công Vội Vã" #builders - bad thing averted
 colony.9233.desc:0 "Các công nhân của chúng ta đã có thể đánh giá đúng tình hình và xoay sở sửa chữa cũng như gia cố các cột chống mà không làm phá hủy các máy móc cổ đại."
 colony.9233.a:0 "Tốt."

 colony.9234.name:0 "Cách Tiếp Cận Mới" #divided attention - bad thing averted
 colony.9234.desc:0 "Thu thập các ấn tượng cảm giác từ nhiều drone khác nhau, một giải pháp tốt hơn đã được tìm thấy: đại sảnh đã được gia cố đến mức độ an toàn với cái giá phải trả là một vài drone lao dịch."
 colony.9234.a:0 "Học hỏi. Thích nghi. Vượt qua."

 colony.9240.name:0 "Sự Thấu Hiểu" #guardians
 colony.9240.desc:0 "Cuộc khám phá của chúng ta trên [Root.GetName] cuối cùng đã mang lại một số hiểu biết sâu sắc. Đánh giá ban đầu của chúng ta hóa ra là chính xác. Hầm chứa thực chất là một xưởng đúc khổng lồ. Phân tích sâu hơn về ngôn ngữ ngoài hành tinh hé lộ rằng nó được gọi là Lò Luyện Vương Giả. Tuy nhiên, Lò Luyện chưa bao giờ được đưa vào vận hành — những người xây dựng rõ ràng đã thiếu công nghệ để hoàn thành dự án này.\n\nChúng ta hoàn toàn có thể hoàn tất công việc của họ miễn là có thể tiến vào trung tâm của xưởng đúc. Mặc dù lối đi bị chặn bởi những cánh cửa nặng nề, các kỹ sư của chúng ta khẳng định họ có thể vượt qua. Tuy nhiên, vì các cánh cửa không có bất kỳ cơ chế khóa hoặc mở rõ ràng nào, chúng ta sẽ cần phải dùng đến một mức độ vũ lực nhất định trước khi có thể tiến bước."
 colony.9240.a:0 "Mở cửa một cách nhẹ nhàng." #casual 1
 colony.9240.a.desc:0 "Chúng ta sẽ cố gắng bẩy cửa bằng các công cụ điện và máy móc hạng nặng. Với một chút may mắn, chúng ta sẽ vào được bên trong mà không gặp thêm rắc rối nào."
 colony.9240.b:0 "Phá cửa bằng chất nổ." #casual 2
 colony.9240.b.desc:0 "Đôi khi bạo lực là cách tiếp cận tốt nhất. Đặt chất nổ và giải quyết xong cho rồi."
 colony.9240.c:0 "Kiểm tra kỹ hơn các cánh cửa." #spiritualist
 colony.9240.c.desc:0 "Đừng vội vàng. Chúng ta đã từng chạm trán nhiều cạm bẫy trước đây. Đôi khi tốt hơn hết là không nên lao vào những giải pháp quá hiển nhiên."
 colony.9240.d:0 "Tìm kiếm các lối đi khác." #meritocracy
 colony.9240.d.desc:0 "Chúng ta rất giỏi trong việc giải quyết vấn đề bằng những cách khác thường, vì vậy chúng ta có thể tìm được cách khác để vào trong."
 colony.9240.e:0 "Khoan xuyên qua cánh cửa." #gestalt
 colony.9240.e.desc:0 "Các drone của chúng ta sẽ cắt xuyên qua cánh cửa một cách dễ dàng. Sẽ mất một thời gian, nhưng chúng ta có thừa thời gian trong vũ trụ này."

 colony.9241.name:0 "Khí Độc!" #casual 1 pop dies
 colony.9241.desc:0 "Sau khi cạy mở các cánh cửa, máy móc bao phủ các bức tường bắt đầu rò rỉ khí độc hại. Thật không may, điều này xảy ra quá nhanh, và hậu quả là có thêm nhiều thương vong. Toàn bộ cơ sở cần phải được sơ tán, và sẽ phải để trống một thời gian trước khi chúng ta có thể tái nhập an toàn."

 colony.9242.name:0 "Vụ Nổ!" #casual 2 lowered production
 colony.9242.desc:0 "Mở cửa bằng thuốc nổ thật dễ dàng, nhưng điều chúng ta không lường trước được là luồng khí tràn vào hành lang sau vụ nổ. Hóa ra thứ khí này cực kỳ dễ cháy và đã phá hủy một số máy móc hiện diện ở đó. May mắn thay, không có ai trong khu vực vụ nổ, do đó không có thương vong."

 colony.9243.name:0 "Thiền Định" #spiritualist bad thing averted
 colony.9243.desc:0 "Dù là nhờ may mắn hay có sự can thiệp của thần thánh, chính cánh cửa chặn đường phía trước đã phản hồi lại các nghi thức buổi sáng của chúng ta: một sự cộng hưởng hài hòa mờ nhạt đã được phát hiện, một sự cộng hưởng mà cuối cùng chúng ta có thể thao túng được. Một bộ cử chỉ chính xác được thực hiện trước một dấu hiệu nhỏ che giấu ống kính máy ảnh đã giúp chúng ta có được lối vào thông suốt."
 colony.9243.a:0 "Một món quà từ đấng linh thiêng."

 colony.9244.name:0 "Con Đường Thứ Ba" #meritocracy bad thing averted
 colony.9244.desc:0 "Sau nghiên cứu bổ sung, chúng ta nhanh chóng nhận ra một bộ phận trong cánh cửa đóng vai trò như một camera an ninh hoặc máy quét. Xâm nhập vào nó là một nhiệm vụ khó khăn hơn, nhưng chúng ta đã có thể giải mã chương trình và các chức năng cơ bản của nó — nhờ đó mở được cánh cửa mà không gặp thêm rắc rối nào."
 colony.9244.a:0 "Làm tốt lắm."

 colony.9245.name:0 "Khí Ga" #gestalt bad thing averted
 colony.9245.desc:0 "Dường như trong khi khoan xuyên qua cánh cửa, các drone của chúng ta đã kích hoạt một cơ chế phòng thủ giải phóng vũ khí khí độc bên trong hành lang. May mắn thay, Tập Thể đã có thể thực hiện các biện pháp phòng ngừa thích hợp, và chẳng mấy chốc khí ga đã tiêu tan. Các drone đã quay trở lại làm việc."
 colony.9245.a:0 "Tiếp tục."

 colony.9250.name:0 "Trái Tim Của Lò Đúc" #starting the project
 colony.9250.desc:1 "Trái tim của xưởng đúc trên [Root.GetName] là một mạng lưới chằng chịt các đường ống, băng chuyền, và những thứ dường như là các trạm làm việc. Một cuộc khảo sát nhanh cho thấy nguồn năng lượng, bộ phận bảo trì, và các hệ thống then chốt đều đang thiếu hụt. Cũng có lý do để tin rằng việc khám phá hầm chứa của chúng ta đã gây ra một số tác động đến hoạt động bên trong của xưởng đúc. Chúng ta có thể cố gắng sửa chữa nó, mặc dù sẽ tốn nhiều thời gian. Ngoài ra, chúng ta luôn có thể lập một bãi phế liệu và tháo dỡ toàn bộ cỗ máy."
 colony.9250.a:0 "Sửa chữa nó." #casual
 colony.9250.a.desc:0 "Chúng ta sẽ đấu nối máy móc vào mạng lưới điện hành tinh và sửa chữa nó."
 colony.9250.b:0 "Sửa chữa và học hỏi." #technocracy + 1 engineering output
 colony.9250.b.desc:0 "Sửa chữa máy móc là chưa đủ — chúng ta cần học cách thức nó hoạt động."
 colony.9250.c:0 "Sửa chữa nó là nghĩa vụ của chúng ta." #philosopher king + 1 society output
 colony.9250.c.desc:0 "Xưởng đúc này sẽ phục vụ đế chế và cung cấp cho chúng ta kiến thức tiềm năng về những cư dân nguyên bản của nó."
 colony.9250.d:0 "Nó sẽ phục vụ bầy đàn." #natural neural network + 1 society output
 colony.9250.d.desc:0 "Xưởng đúc này sẽ phục vụ bầy đàn và cung cấp cho chúng ta kiến thức tiềm năng về những cư dân nguyên bản của nó."
 colony.9250.e:0 "Sửa chữa và học hỏi." #introspective + 1 engineering output
 colony.9250.e.desc:0 "Sửa chữa máy móc là chưa đủ — chúng ta cần học cách thức nó hoạt động."
 colony.9250.f:0 "Tháo dỡ." #opting out - creation of salvage yards
 colony.9250.f.desc:0 "Bãi phế liệu sẽ bắt đầu quá trình tháo dỡ máy móc chậm rãi."

 colony.9251.name:0 "Tiếp Nạp Năng Lượng" #special project finished
 colony.9251.desc:0 "Năng lượng tuôn chảy qua những cỗ máy đói khát trên [Root.GetName]. Với một tiếng gầm đinh tai nhức óc, các đường ống bắt đầu vận chuyển các khoáng sản hóa lỏng, làm bừng sáng và hâm nóng toàn bộ cơ sở. Các nguyên liệu thô được chuyển đến các trạm làm việc nơi người vận hành có thể định hình chúng thành các hợp kim có hình dạng và mật độ mong muốn. Có vẻ như mọi bộ phận của xưởng đúc đều được chế tạo chỉ cho mục đích duy nhất này. Ngay cả các cột trụ cũng có nhiều nhiệm vụ hơn là chỉ nâng đỡ trần nhà."
 colony.9251.a:0 "Tiếp tục đi."

 colony.9260.name:0 "Điều Kiện Làm Việc" #working conditions
 colony.9260.desc:0 "Có một số lo ngại rằng khí độc đang tích tụ trong gian phòng chính của hầm ngầm [Root.GetName]. Khí này không gây chết người, nhưng có thể gây nguy hiểm cho bất kỳ ai vận hành các trạm làm việc. Nếu muốn tận dụng tối đa nơi này, chúng ta nên thiết lập một số biện pháp an toàn."
 colony.9260.a:0 "Chỉ cần luân chuyển người vận hành." #casual 1 - lowered happiness for working pops
 colony.9260.a.desc:0 "Chúng ta sẽ luân chuyển người vận hành trước khi họ phát ốm. Thỉnh thoảng có thể xuất hiện cơn đau đầu nhẹ."
 colony.9260.b:0 "Quy định giờ làm việc." #casual 2 - lowered production
 colony.9260.b.desc:0 "Chúng ta sẽ quy định giờ nghỉ giải lao, cho phép khí độc tiêu tan để nơi làm việc an toàn hơn."
 colony.9260.c:0 "Sử dụng nô lệ." #slaver guilds - bad outcome averted
 colony.9260.c.desc:0 "Ai thèm quan tâm đến nô lệ chứ? Chúng ta luôn có thể cho họ quần áo tốt hơn, và họ sẽ vui vẻ mạo hiểm sức khỏe của mình."
 colony.9260.d:0 "Ban hành các quy định lao động nghiêm ngặt." #shared burdens - bad outcome averted
 colony.9260.d.desc:1 "Luân chuyển công nhân, quy định thời gian và bảo hộ tại chỗ — chúng ta phải giảm thiểu các mối nguy hiểm mà không làm cản trở năng suất."
 colony.9260.e:0 "Luân chuyển drone." #gestalt - bad outcome averted
 colony.9260.e.desc:0 "Mỗi drone làm việc cho ý thức cho đến khi chúng hoàn thành mục đích của mình."

 colony.9270.name:0 "Trung Tâm Tái Chế" #recycling
 colony.9270.desc:0 "Xưởng đúc [Root.GetName] có một khoang xử lý tái chế chuyên dụng sử dụng chất thải sau sản xuất để nâng cao hiệu quả sản xuất. Sẽ có lợi cho chúng ta nếu đưa nó hoạt động trở lại."
 colony.9270.a:0 "Đưa nó vào vận hành." #casual
 colony.9270.a.desc:0 "Chúng ta sẽ đưa trung tâm tái chế hoạt động trực tuyến."
 colony.9270.b:0 "Sử dụng thiết kế của chúng ta." #environmentalist/zerowaste/ascetic - lower upkeep
 colony.9270.b.desc:0 "Mô thức tái chế của chúng ta vượt trội hơn nhiều. Chúng ta có thể tích hợp chúng vào máy móc."
 colony.9270.c:0 "Tăng cường sản xuất hợp kim." #barbaric despoilers and purifiers - increased production
 colony.9270.c.desc:0 "Chúng ta có thể tái sử dụng khoang tái chế thành trung tâm tinh chế khoáng sản. Điều này sẽ nâng cao năng suất của chúng ta."

 colony.9280.name:0 "Nhiều Hơn Hay Ít Hơn?" #increase production and upkeep
 colony.9280.desc:0 "Công việc tại xưởng đúc [Root.GetName] gần như đã hoàn tất, nhưng vẫn còn những điểm chúng ta có thể cải thiện so với thiết kế và quy trình ban đầu. Người ta ước tính rằng bằng cách tăng lượng khoáng sản đầu vào, chúng ta có thể tăng sản lượng hợp kim."
 colony.9280.a:0 "Đừng ép máy móc ngoài hành tinh hoạt động quá tải." #casual - don't use the opportunity
 colony.9280.a.desc:0 "Chúng ta sẽ không tận dụng cơ hội này."
 colony.9280.b:0 "Làm đi." #casual - use the opportunity, upkeep and production up
 colony.9280.b.desc:0 "Chúng ta sẽ tăng sản lượng, nhưng cũng tăng lượng khoáng sản bảo trì."
 colony.9280.c:0 "Chúng ta không thể dùng vật chất hữu cơ sao?" #catalytic processing - change some minerals upkeep to food upkeep
 colony.9280.c.desc:0 "Chúng ta có thể thay thế một phần lượng khoáng sản tiếp nhận bằng vật chất hữu cơ, nhưng sẽ không thể áp dụng hoàn toàn."
 colony.9280.d:0 "Nó giống như công nghệ cũ của chúng ta." #remnants - better ratio for increasing the production vs upkeep
 colony.9280.d.desc:0 "Chúng ta từng cai trị một đế chế rộng lớn và sở hữu công nghệ vô song. Một số công nghệ mới được tái phát hiện gần đây có thể giúp chúng ta nâng cao năng lực sản xuất của xưởng đúc."

 colony.9290.name:0 "Lễ Khánh Thành Trọng Thể" #ending, final touches
 colony.9290.desc:0 "Đã hoàn thành! Xưởng đúc trên [Root.GetName] đã hoạt động hết công suất, có lẽ không giống như những Người Xây Dựng ban đầu đã thiết kế, nhưng nó vẫn là một cảnh tượng ngoạn mục và là một phương thức cực kỳ hiệu quả để sản xuất hợp kim. Tất cả những gì còn lại là gặt hái những phần thưởng từ lòng quyết tâm và sự khéo léo của chúng ta."
 colony.9290.a:0 "Một ngày tuyệt vời!" #casual, some happiness empirewide for 2 years
 colony.9290.b:0 "Thế còn những Người Xây Dựng thì sao?" #memorialists - add chronicler job
 colony.9290.b.desc:0 "Chúng ta chưa bao giờ thực sự tìm hiểu được điều gì đã xảy ra với những người xây dựng. Họ dường như chỉ đơn giản biến mất, chỉ để lại những thông tin mơ hồ về chính họ. Chúng ta cần thu thập mọi thứ có thể và ghi chép lại — bảo tồn nó."
 colony.9290.c:0 "Chúng ta cần một người giám sát." #aristocratic elite - appoint noble job to oversee the factory
 colony.9290.c.desc:0 "Tầng lớp tinh hoa của chúng ta thường giám sát những doanh nghiệp như vậy — chúng ta nên bổ nhiệm một quý tộc lỗi lạc phụ trách xưởng đúc mới."
 colony.9290.d:0 "Bổ nhiệm một giám đốc điều hành." #megacorp - appoint executive job to oversee the factory
 colony.9290.d.desc:1 "Các nhà quản lý của chúng ta giám sát một doanh nghiệp như vậy là điều hợp lý — chúng ta nên bổ nhiệm một $job_executive_with_icon$ để phụ trách xưởng đúc mới." # appoint an Executive to take care of...
 colony.9290.e:0 "Tốt." #gestalt - nothing, just start working

 colony.9295.name:0 "Những Vũng Kim Loại"
 colony.9295.desc:0 "Sau một trận mưa gần đây, những người thực dân nhận thấy các vũng kim loại xuất hiện trên bề mặt của [Root.GetName]. Những vũng này có độ nhớt đặc quánh, giống như kim loại lỏng."
 colony.9295.a:0 "Đừng đụng vào chúng. Chúng có thể có độc!"
 colony.9295.b:0 "Điều tra sâu hơn!"
 colony.9296.name:0 "Chất Nhầy Bạc"
 colony.9296.desc:0 "Những vũng kim loại nhớt dính trên [Root.GetName] đang ngày một lớn hơn. Những dải đất khổng lồ giờ đây bị bao phủ bởi lớp chất nhầy màu bạc. Chúng dường như phát triển mạnh mẽ sau những cơn mưa lớn."
 colony.9296.a:0 "Mặc đồ bảo hộ và điều tra!"
 colony.9299.name:0 "Độ Nhớt Khó Nắm Bắt"
 colony.9299.desc:0 "Những vũng kim loại nhớt dính trên [Root.GetName] đang làm khó các nhà khoa học của thuộc địa. Cho đến nay nguồn gốc của chúng vẫn chưa được xác định, và chúng kháng cự lại sự thăm dò của chúng ta. Các thiết bị đo đạc đang chật vật giải mã thành phần hóa học của chúng. Chúng ta còn nhiều thử nghiệm phải tiến hành nếu muốn có câu trả lời."
 colony.9299.a:0 "Tiếp tục cố gắng!"
 colony.9297.name:0 "Những Vũng Nước Biến Mất"
 colony.9297.desc:0 "Chúng đã biến mất! Những vũng kim loại nhớt dính trên [Root.GetName] đã không còn. Cứ như thể chúng vừa bốc hơi vậy. Chúng ta không biết liệu chúng có quay trở lại hay không và khi nào..."
 colony.9297.a:0 "Đôi khi những thứ này tự nó được giải quyết..."
 colony.9298.name:0 "Chất Nhầy Bạc Trở Lại"
 colony.9298.desc:0 "Chúng đã trở lại! Những vũng kim loại nhớt dính trên [Root.GetName] đã tái xuất hiện. Bản chất của chúng tiếp tục đánh đố những người thực dân trên [Root.GetName]. Chúng ta vừa được trao một cơ hội khác. Chúng ta nên điều tra chúng trong lúc còn có thể."
 colony.9298.a:0 "Một cơ hội thứ hai..."
 colony.9300.name:0 "Đơn Giản Thôi, Thưa Ngài Lãnh Tụ!"
 colony.9300.desc:0 "Một nguyên tố mới vừa được phát hiện trên [Root.GetName]! Sau một bước đột phá trong vụ những vũng kim loại nhớt dính, chúng ta phát hiện các vũng này bao gồm một nguyên tố hóa học độc nhất vô nhị. Nguyên tố này, mà chúng ta tạm gọi là [Root.GetName]onium, hiện diện trong không khí trên [Root.GetName], nhưng khi gặp lượng giáng thủy cao, nó chuyển sang trạng thái nhớt dính mà chúng ta đã thấy trên bề mặt hành tinh. Sự xuất hiện của chúng mang tính chu kỳ, rất giống các vũng nước cấu thành từ monoxit dihyđro.\n\nMột phát hiện đầy hấp dẫn. Hiểu biết của chúng ta về các nguyên tố tiếp tục được mở rộng." #This string contains a linguistic joke of appending 'onium' to the end of a planet name to create a new chemical element, e.g. 'Earthonium'. I think it's amusing in English, but I'm unsure how it will be read in other languages.

 colony.9300.a:0 "Chúng ta vẫn còn nhiều điều phải học hỏi."
 FASCINATING_METEOROLOGY_PROJECT:0 "Khí Tượng Học Kỳ Thú"
 FASCINATING_METEOROLOGY_PROJECT_DESC:0 "Nghiên cứu về khí tượng học kỳ thú của [Root.GetName] có thể mang lại giá trị vô giá cho sự phát triển khoa học của chúng ta."
 colony.9301.name:0 "Hiểu Biết Vô Giá"
 colony.9301.desc:0 "Chúng ta đã thu được những hiểu biết vô giá về hệ thống thời tiết độc đáo của [Root.GetName]. Ngoài việc mở rộng hiểu biết về các nguyên tố hóa học, nghiên cứu gần đây của chúng ta còn có những tác động tích cực đối với việc sản xuất lương thực."
 colony.9301.a:0 "Một kết luận tích cực."
 puddle_technician: "$job_puddle_technician$"
 job_puddle_technician:0 "Kỹ Thuật Viên Vũng Kim Loại"
 job_puddle_technician_plural:0 "Các Kỹ Thuật Viên Vũng Kim Loại"
 job_puddle_technician_desc:0 "Đa dạng hóa sản xuất lương thực là một nỗ lực rất đáng giá."
 mod_job_puddle_technician_add:0 "Việc Làm $job_puddle_technician$"
 d_metallic_puddles:0 "Những Vũng Kim Loại"
 d_metallic_puddles_desc:0 "Đặc điểm khí tượng hiếm có cho phép các Kỹ Thuật Viên Vũng Kim Loại thu hoạch lương thực và hợp kim đồng thời."
#  d_metallic_puddles_gestalt:0 "$d_metallic_puddles$"
#  d_metallic_puddles_gestalt_desc:0 "Rare meteorology allows Puddle Technicians to harvest food and alloys simultaneously."
 puddle_technician_drone: "$job_puddle_technician_drone$"
 job_puddle_technician_drone:0 "Drone Kỹ Thuật Viên Vũng Kim Loại"
 job_puddle_technician_drone_plural:0 "Các Drone Kỹ Thuật Viên Vũng Kim Loại"
 job_puddle_technician_drone_desc:0 "Tận dụng khí tượng độc đáo để thu hoạch thêm tài nguyên sẽ mang lại lợi ích cho tập thể."
 mod_job_puddle_technician_drone_add:0 "Việc Làm $job_puddle_technician_drone$"

 d_ancient_manufactorium_working:0 "Xưởng Chế Tạo Đang Hoạt Động"
 d_ancient_manufactorium_working_desc:0 "Một Xưởng Chế Tạo ngoài hành tinh, hoạt động hết công suất và sản xuất các tài nguyên quý giá cho đế chế."
 d_ancient_manufactorium_scrapyard:0 "Bãi Phế Liệu Xưởng Chế Tạo"
 d_ancient_manufactorium_scrapyard_desc:0 "Các bãi tháo dỡ chuyên dụng đang tháo rời máy móc cũ và biến phế liệu thành các vật liệu hữu ích."
 d_ancient_manufactorium_vaultexploration:0 "Hầm Ngầm Dãy Núi"
 d_ancient_manufactorium_vaultexploration_desc:0 "Khu phức hợp ngầm khổng lồ này hiện đang được khám phá bởi các đơn vị nghiên cứu chuyên trách, gây căng thẳng cho lưới điện hành tinh."
 d_ancient_manufactorium_crater:2 "Hầm Ngầm Bị Phá Hủy"
 d_ancient_manufactorium_crater_desc:2 "Tất cả những gì còn lại của hầm ngầm là một miệng hố đầy máy móc và gạch vụn. Mặc dù phần lớn giờ đây đã vô dụng, nó vẫn giúp tiếp cận dễ dàng với các vật liệu có thể tái chế."

 job_manufactorium_specialist:0 "Người Vận Hành"
 job_manufactorium_specialist_plural:0 "Những Người Vận Hành"
 job_manufactorium_specialist_desc:0 "Những công nhân lành nghề này vận hành máy móc cổ đại tinh xảo, tạo ra tài nguyên với chi phí chỉ bằng một phần nhỏ so với bình thường."
 mod_job_manufactorium_specialist_add:0 "Việc Làm $job_manufactorium_specialist$"

 job_manufactorium_complex_drone:0 "Drone Vận Hành"
 job_manufactorium_complex_drone_plural:0 "Các Drone Vận Hành"
 job_manufactorium_complex_drone_desc:0 "Những drone chuyên biệt cao độ này vận hành máy móc cổ đại tinh vi, tạo ra tài nguyên với một phần nhỏ chi phí thông thường."
 mod_job_manufactorium_complex_drone_add:0 "Việc Làm $job_manufactorium_complex_drone$"

 manufactorium_scraper: "$job_manufactorium_scraper$"
 job_manufactorium_scraper:0 "Thợ Tháo Dỡ"
 job_manufactorium_scraper_plural:0 "Những Thợ Tháo Dỡ"
 job_manufactorium_scraper_desc:0 "Tháo dỡ máy móc cổ đại là một nhiệm vụ mạo hiểm nhưng rất bõ công. Những công nhân này sẽ có rất nhiều việc phải làm, xét theo quy mô của cơ sở."
 mod_job_manufactorium_scraper_add:0 "Việc Làm $job_manufactorium_scraper$"

 job_manufactorium_scraper_drone:0 "Drone Tháo Dỡ"
 job_manufactorium_scraper_drone_plural:0 "Các Drone Tháo Dỡ"
 job_manufactorium_scraper_drone_desc:0 "Tháo dỡ các cỗ máy cổ đại là một nhiệm vụ rủi ro nhưng bổ ích. Những drone này sẽ có rất nhiều việc phải làm, xét theo quy mô của cơ sở."
 mod_job_manufactorium_scraper_drone_add:0 "Việc Làm $job_manufactorium_scraper_drone$"

 job_manufactorium_researcher:0 "Đội Nghiên Cứu Hầm Ngầm"
