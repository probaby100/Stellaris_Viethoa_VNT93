 ## Event: Junkyard Orbit
 colony.9310.name: "Quỹ Đạo Bãi Rác"
 colony.9310.desc: "Báo cáo mới nhất từ [planet.GetName] cho chúng ta biết rằng chúng ta đã tính toán sai khả năng quản lý chất thải của hành tinh. Các bãi rác khổng lồ đã hợp nhất lại để tạo thành một vùng đất hoang tàn không thể vượt qua, trải dài đến tận rìa các trung tâm dân cư của hành tinh.\n\nCư dân địa phương đã bắt đầu vận chuyển các lô rác lớn lên quỹ đạo, nhưng chỉ như một 'biện pháp tạm thời'."
 colony.9310.a: "Thật đáng báo động."
 colony.9310.a.tooltip: "Dọn dẹp mớ hỗn độn của họ. Ngay lập tức."
 colony.9315.name: "Bị Mảnh Vụn Che Khuất"
 colony.9315.desc: "Đã xảy ra một vụ tai nạn.\n\nDo một lỗi nghiêm trọng, một vài khoang chứa rác trên quỹ đạo [planet.GetName] đã va chạm với nhau, khiến một lượng lớn mảnh vỡ lao vào tầng khí quyển thấp. Điều này đã hạn chế khả năng du hành không gian của hành tinh, và theo ước tính, tình hình có thể tồi tệ hơn nữa khi rác vũ trụ tiếp tục vỡ vụn ra. Tuy nhiên, việc phát động một chiến dịch thu gom các mảnh vỡ có thể sẽ kéo dài và tốn kém."
 colony.9315.a: "Dọn dẹp quỹ đạo."
 colony.9315.a.tooltip: "Triển khai các đơn vị đặc biệt."
 colony.9315.b: "Vũ trụ rộng lớn. Một chút rác chẳng có gì đáng lo."
 colony.9315.b.tooltip: "Có những vấn đề cấp bách hơn trong thiên hà."
 colony.9315.c: "Tuyên bố tình trạng khủng hoảng."
 colony.9315.c.tooltip: "Chúng ta PHẢI làm mọi thứ trong quyền hạn của mình để thu gom các mảnh vỡ."
 colony.9320.name: "Hoàn Tất Thu Gom Quỹ Đạo"
 colony.9320.desc: "Một ngày trọng đại trên [planet.GetName] khi những người thu gom rác vũ trụ đã hoàn thành ca làm việc cuối cùng của họ. Kể từ ngày hôm nay, các vành đai rác bao quanh [planet.GetName] đã giảm xuống ở mức quy mô không còn là mối đe dọa lớn đối với các con tàu đi qua nữa.\n\nTrong những ngày tới, công việc sẽ tiếp tục ở quy mô nhỏ hơn. Có thể không thể làm sạch hoàn toàn quỹ đạo, nhưng ít nhất điều tồi tệ nhất đã qua đi."
 colony.9320.a: "Cuối cùng mọi thứ có thể trở lại bình thường."
 colony.9325.name: "Bị Kẹt Dưới Mặt Đất"
 colony.9325.desc: "Sau khi gạt bỏ những lo ngại về một số bãi rác không gian mất kiểm soát trên quỹ đạo quanh [Planet.GetName], tình hình đã leo thang nghiêm trọng.\n\nĐúng như các nhà khoa học thuộc địa nhận định, các mảnh rác không gian riêng lẻ đã va chạm vào nhau tạo thành một quầng rác vi mô bao quanh hành tinh. Điều này khiến việc vận chuyển tài nguyên và con người ra vào thuộc địa trở nên vô cùng khó khăn mà không phải đối mặt với nguy cơ thiệt hại thứ cấp."
 colony.9325.a: "Rắc rối rồi."
 colony.9330.name: "Mưa Sao Băng"
 colony.9330.desc: "Sau khi gạt bỏ những lo ngại về một số rác không gian mất kiểm soát trên quỹ đạo quanh [Planet.GetName], vấn đề dường như đã tự giải quyết.\n\nHàng ngàn 'ngôi sao băng' đã bắt đầu đồng loạt rơi xuống khi lực hút hấp dẫn mạnh mẽ của hành tinh kéo rác lại đủ gần để bốc cháy trong bầu khí quyển. Những cuộc tụ tập về đêm đã trở thành phổ biến khi mọi người đổ xô đến để chứng kiến màn trình diễn độc nhất vô nhị này."
 colony.9330.a: "Đến lúc ngắm sao giải trí rồi."
 colony.9335.name: "Bầu Trời Xanh Trong"
 colony.9335.desc: "Một lễ kỷ niệm lịch sử đã bùng nổ trên [planet.GetName] khi ca làm việc cuối cùng của những người thu gom rác vũ trụ kết thúc.\n\nKể từ ngày này, các vành đai rác từng bao quanh hành tinh không còn được phát hiện nữa. Nhờ thành công này, những người thu gom đã nhận được sự ủng hộ nhiệt liệt để tiếp tục hoạt động, đảm bảo bầu trời trong xanh cho các thế hệ mai sau."
 colony.9335.a: "Một ngày trọng đại."
 orbital_cleanup: "Dọn Dẹp Quỹ Đạo"
 orbital_cleanup_DESC: "Quỹ đạo của [Root.GetName] ngập tràn các mảnh vụn không gian sau một vụ va chạm ở tầng khí quyển thấp. Nó phải được dọn sạch trước khi hiệu ứng dây chuyền khiến hành tinh này hoàn toàn không thể tiếp cận."
 orbital_cleanup_intense: "Dọn Dẹp Quỹ Đạo Cường Độ Cao"
 orbital_cleanup_intense_DESC: "Quỹ đạo của [Root.GetName] ngập tràn các mảnh vụn không gian sau một vụ va chạm ở tầng khí quyển thấp. Nó phải được dọn dẹp triệt để nhằm đảm bảo một tương lai an toàn cho cư dân, bất kể chi phí ra sao."
