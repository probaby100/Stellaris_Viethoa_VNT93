l_english:

 # Anomaly Category
 the_lonely_bot_category:0 "Dấu Vết Sự Sống Cổ Đại"
 the_lonely_bot_category_desc:0 "[Root.GetName] mang những dấu vết cho thấy nơi đây từng là quê hương của một nền văn minh cổ đại."
 NANO_SWARM_CAT:0 "Sa Mạc Hoang Vu"
 NANO_SWARM_CAT_DESC:0 "[Root.GetName] sở hữu những vùng nước đáng kể, thế nhưng các khối lục địa của nó lại là những sa mạc không có sự sống. Cần tiến hành nghiên cứu sâu hơn."
 STAR_RESONANCE_CAT:0 "Cộng Hưởng Kỳ Lạ"
 STAR_RESONANCE_DESC:0 "Các nhà khoa học của chúng ta phát hiện điều ban đầu có vẻ là sự cố cảm biến gần vành nhật hoa của [root.GetName], tuy nhiên hiện tượng vẫn còn đó sau khi khởi động lại hệ thống. Rất đáng để tiến hành xem xét kỹ lưỡng hơn."
 ALPHA_CENTAURI_CAT:0 "Trạng Thái Đứng Yên"
 ALPHA_CENTAURI_CAT_DESC:0 "Quỹ đạo kỳ lạ của [From.GetName] quanh ngôi sao lùn đỏ khiến hành tinh này bị khóa thủy triều, rất đáng để tiến hành điều tra sâu hơn."
 FROZEN_SPRINGS_CAT:0 "Nguồn Nhiệt Bí Ẩn"
 FROZEN_SPRINGS_CAT_desc:0 "Trong khi khảo sát [From.GetName], đội ngũ khoa học đã phát hiện các tín hiệu nhiệt bất thường phát ra từ sâu bên dưới bề mặt băng giá của hành tinh."

 # Deposits
 d_hab_lonely_bot_deposit:0 "Robot Bí Ẩn"
 d_hab_lonely_bot_deposit_desc:0 "Một chú robot nhỏ bé, cổ xưa và đầy bí ẩn, đang giám sát một nhà máy có từ thời kỳ của nền văn minh trước đó."
 d_hab_lonely_bot_deposit_2:0 "$d_hab_lonely_bot_deposit$"
 d_hab_lonely_bot_deposit_2_desc:0 "$d_hab_lonely_bot_deposit_desc$"
 d_hab_lonely_bot_deposit_3:0 "$d_hab_lonely_bot_deposit$"
 d_hab_lonely_bot_deposit_3_desc:0 "$d_hab_lonely_bot_deposit_desc$"

 d_house_turtle:0 "Nemma Vị Thành Niên"
 d_house_turtle_desc:0 "Một cá thể Nemma non nớt do chúng ta nhân giống, nay đã đủ lớn để gánh vác một phần các cơ sở công nghiệp của chúng ta."
 d_turtle_miner:0 "Hoạt Động Khai Khoáng Nemma"
 d_turtle_miner_desc:0 "Sự cân bằng cẩn trọng giữa dược phẩm và chất ức chế cơn đau cho phép chúng ta khoan vào cơ thể các cá thể Nemma trong khi vẫn cư trú ngay trên mình chúng."
 d_turtle_corpse:0 "Xác Nemma"
 d_turtle_corpse_desc:0 "Xác trôi nổi của loài Nemma khổng lồ từng sinh sống tại đây vẫn có thể nhìn thấy từ quỹ đạo. Sinh vật lưỡng cư dạng bò sát này giờ đây chẳng qua chỉ là một hòn đảo bồng bềnh."

 d_nano_corpses:0 "Tàn Tích Bầy Đàn Nanite"
 d_nano_corpses_desc:0 "Một lớp bụi mịn là tất cả những gì còn sót lại của bầy đàn nanite khổng lồ từng tiến hóa trên — và bao phủ khắp — Parvus III."
 # Jobs
 job_robot_caretaker:0 "Người Chăm Sóc Robot"
 job_robot_caretaker_plural:0 "Những Người Chăm Sóc Robot"
 job_robot_caretaker_desc:0 "Một người chăm sóc bảo dưỡng chú robot vốn đã trở thành linh vật biểu trưng của hành tinh."
 mod_job_robot_caretaker_add:0 "Nghề $job_robot_caretaker$"
 turtle_miner: "$job_turtle_miner$"
 job_turtle_miner:0 "Thợ Mỏ Nemma"
 job_turtle_miner_plural:0 "Những Thợ Mỏ Nemma"
 job_turtle_miner_desc:0 "Sử dụng những mũi khoan công suất lớn, chúng ta có thể thu hoạch cả lớp vỏ khoáng sản lẫn nội tạng hữu cơ từ loài Nemma khổng lồ bản địa."
 job_turtle_miner_gestalt:0 "Drone Khai Khoáng Nemma"
 job_turtle_miner_gestalt_plural:0 "Các Drone Khai Khoáng Nemma"
 job_turtle_miner_gestalt_desc:0 "Sử dụng những mũi khoan công suất lớn, chúng ta có thể thu hoạch cả lớp vỏ khoáng sản lẫn nội tạng hữu cơ từ loài Nemma khổng lồ bản địa."
 miner_is_turtle_miner_tt: "$job_miner_plural_with_icon$ được chuyển đổi thành [miner.GetIcon] $job_turtle_miner_plural$"
 mod_job_turtle_miner_add:0 "Nghề $job_turtle_miner$"
 mod_job_turtle_miner_gestalt_add:0 "Nghề $job_turtle_miner_gestalt$"
 mod_job_turtle_miner_per_pop:1 "§G+1§! Nghề $job_turtle_miner$ mỗi $VALUE$ Dân Cư"
 mod_job_turtle_miner_per_pop_short:0 "\n§G+1§! £job_turtle_miner£ mỗi $VALUE$ £pop£"
 mod_job_turtle_miner_gestalt_per_pop:0 "§G+1§! Nghề $job_turtle_miner_gestalt$ mỗi $VALUE$ Dân Cư"
 mod_job_turtle_miner_gestalt_per_pop_short:0 "\n§G+1§! £job_turtle_miner_gestalt£ mỗi $VALUE$ £pop£"

 # Projects
 LONELY_BOT_PROJECT:0 "Khôi Phục Nhà Máy"
 LONELY_BOT_PROJECT_DESC:0 "Nhà máy trên [Root.GetName] đã suy tàn suốt hàng thế kỷ, và đang chạm tới bờ vực có thể đổ sụp bất cứ lúc nào. Vì nó từng đóng vai trò rất quan trọng trong những ngày đầu của thuộc địa trên hành tinh, các cư dân thuộc địa đã tìm đến và thỉnh cầu chúng ta ra tay phục hồi công trình này về lại thời kỳ huy hoàng trước đây.\n\nPhần thưởng: £alloys£ §GHợp Kim§!"

 LONELY_BOT_MISSING_PROJECT:0 "Robot Mất Tích"
 LONELY_BOT_MISSING_PROJECT_DESC:0 "Chú robot sinh sống trên hành tinh này gần đây đã biến mất - cùng với khá nhiều người định cư của chúng ta. Các kỹ sư đang cố gắng dò theo tín hiệu từ xa của nó về tận ngọn nguồn, để xem liệu chúng ta có thể tìm lại những người định cư và chú robot hay không."

 breed_turtle_world_project:0 "Khởi Động Chương Trình Nhân Giống Nemma"
 breed_turtle_world_project_DESC:0 "Bằng cách nghiên cứu loài Nemma trước rồi vận dụng chuyên môn động vật học, chúng ta có thể khuyến khích những cá thể thuần phục, ngoan ngoãn sinh sôi nảy nở trong phạm vi sức chứa của môi trường sống."
 enslave_turtle_world_project:0 "Bắt Đầu Nô Dịch Loài Nemma"
 enslave_turtle_world_project_DESC:0 "Các loại dược phẩm tiên tiến và thiết bị cấy ghép điều khiển học sẽ biến loài Nemma trở nên dễ bảo và dễ uốn nắn hơn. Chẳng bao lâu nữa, chúng sẽ trở thành những sinh vật thồ hàng khổng lồ vô giá."
 mine_turtle_world_project:0 "Bắt Đầu Hoạt Động Khai Khoáng Nemma"
 mine_turtle_world_project_DESC:1 "Sau khi nghiên cứu cẩn trọng sinh học của loài Nemma, các [Root.owner.GetScientistPlural] của chúng ta có thể thu hoạch thành công các khoáng sản hữu ích từ lớp vỏ của những loài bò sát khổng lồ này."
 kill_turtle_world_project:0 "Tận Diệt Loài Nemma"
 kill_turtle_world_project_DESC:0 "Chúng ta sẽ quét sạch mối đe dọa Nemma khỏi hành tinh này bằng mọi giá."
 study_turtle_world_project:0 "Nghiên Cứu Loài Nemma"
 study_turtle_world_project_DESC:0 "Chúng ta sẽ phó thác số phận của loài Nemma cho các [Owner.GetScientistPlural] xuất sắc nhất của mình và tìm kiếm các giải pháp thích hợp."

 STUDY_NANITE_SWARM:0 "Nghiên Cứu Bầy Đàn Nanite"
 STUDY_NANITE_SWARM_DESC:0 "Bầy đàn nanite trên [nanite_swarm_planet.GetName] vừa là một kỳ quan công nghệ vừa là một mối hiểm họa. Việc lập bản đồ nguồn gốc của nanite cũng như mối quan hệ của chúng với hệ sinh thái độc nhất vô nhị của hành tinh mang lại thử thách đầy hào hứng cho các [Root.Owner.GetScientistPlural] của chúng ta, đồng thời có tiềm năng nâng cao hiểu biết của chúng ta về trí tuệ máy móc."
 DESTROY_SWARM:0 "Tiêu Diệt Bầy Đàn"
 DESTROY_SWARM_DESC:0 "Hạ lệnh oanh tạc bầy đàn từ quỹ đạo. Nếu có bất kỳ bí mật nào đáng để khám phá, chúng ta sẽ thu thập chúng từ xác của lũ bọ này."

 TAME_THE_SWARM:0 "Thuần Hóa Bầy Đàn"
 TAME_THE_SWARM_DESC:0 "Kiến thức tiên tiến của chúng ta về Trí tuệ Nhân tạo có thể được sử dụng để tái lập trình và thuần hóa nanite. Chúng có thể trở thành tài sản đắc lực trong việc xây dựng các công trình trên hành tinh - và với mối liên kết của chúng với hệ sinh thái thế giới này, hoàn toàn khả thi để chỉ thị cho nanite tạo dựng một quê hương thứ hai."
 TAME_THE_SWARM_DESC_ARTIFICIAL:0 "Kiến thức tiên tiến của chúng ta về Trí tuệ Nhân tạo có thể được sử dụng để tái lập trình và thuần hóa nanite. Chúng có thể trở thành tài sản đắc lực trong việc xây dựng các công trình trên hành tinh - và với mối liên kết của chúng với hệ sinh thái thế giới này, hoàn toàn khả thi để chỉ thị cho nanite tạo dựng một thiên đường."

 ENLIGHTEN_RADIO:0 "Khai Sáng Thực Vật Hấp Thu Xạ"
 ENLIGHTEN_RADIO_DESC:0 "Những loài thực vật có thể sinh tồn và phát triển trên những thế giới ngập tràn bức xạ này có thể là sự bổ sung tuyệt vời cho đế chế của chúng ta. Nhưng trước đó, chúng ta sẽ cần phải nâng cao trí tuệ của chúng và truyền dạy hàng nghìn năm tiến bộ chỉ trong vài tháng."

 GAS_RESTORATION:0 "Dự Án Phục Hồi [From.GetName]"
 GAS_RESTORATION_DESC:0 "Chuộc lại lỗi lầm là một đặc quyền dành cho những kẻ nắm giữ quyền lực, và trong tình huống này, chúng ta phải chuộc lỗi một cách sâu sắc. Thảm họa trên [From.GetName] thật kinh hoàng, và hy vọng duy nhất của chúng ta là các nhà khoa học có thể đảo ngược cực của các máy quét sâu và có khả năng thắp lại tia sáng sự sống bên trong hành tinh khí khổng lồ."

 RESCUE_STORM:0 "Giải Cứu Tàu [Root.GetName]"
 RESCUE_STORM_DESC:0 "Tàu [Root.GetName] đang bị mắc kẹt trong một cơn bão trên [FromFrom.GetName]. Hy vọng duy nhất của họ là chúng ta điều động một tàu mới đến và đưa họ ra trước khi bão cuốn họ đi."

 STUDY_SLEEPING_CRYSTAL:0 "Nghiên Cứu Tiểu Hành Tinh Kỳ Lạ"
 STUDY_SLEEPING_CRYSTAL_DESC:0 "[From.GetName] là một tiểu hành tinh kỳ lạ dường như có khả năng tự quay và né tránh các trạm khai thác mỏ của chúng ta theo một cách khó hiểu. Chúng ta cần phái một tàu khoa học đến đó để tìm hiểu xem chuyện gì đang xảy ra."

 CRACK_THE_EGG:0 "Làm Nứt Vỏ Trứng"
 CRACK_THE_EGG_DESC:0 "Quả trứng khổng lồ mà chúng ta phát hiện trong hệ sao [Solar_System.GetName] vừa bắt đầu nứt ra. Đây là cơ hội tuyệt vời để nghiên cứu sinh vật này ở cự ly gần - hoặc ăn nó."
 # Decisions
 decision_crystalline_refugees:0 "Định Cư Cho Người Tị Nạn Tinh Thể"
 decision_crystalline_refugees_desc:0 "Tìm mái nhà cho những người tị nạn $NAME_Central_Crystal_Species$, sau khi bị buộc phải rời khỏi quê hương $NAME_Central_Crystal_Country$ vì thảm họa ập xuống thế giới của họ."
 decision_crystalling_refugees_effect_tt:0 "§G500§! £pop£ §H$NAME_Central_Crystal_Species$ Dân Cư§! sẽ di cư đến §Y[Root.GetName]§!."

 decision_crystalline_architecture:0 "Kiến Trúc Tinh Thể"
 decision_crystalline_architecture_desc:0 "Một đội ngũ kỹ sư do $NAME_Central_Crystal_Country$ phái đến sẽ cải thiện cấu trúc bố trí của trạm môi trường sống."

 decision_expand_dayside:0 "Mở Rộng Cơ Sở Hạ Tầng Bán Cầu Ban Ngày"
 decision_expand_dayside_desc:0 "Bằng cách tận dụng tình huống độc nhất của [Root.GetName], chúng ta có thể thiết lập vô số tấm pin mặt trời trên bán cầu ban ngày vĩnh cửu của nó, gia tăng đáng kể sản lượng năng lượng của chúng ta."

 decision_introduce_chaos:0 "Đưa Vào Yếu Tố Hỗn Loạn"
 decision_introduce_chaos_desc:0 "Thế giới này quá đỗi hoàn hảo đối với chúng ta - các cư dân thuộc địa của chúng ta đang suy sụp tinh thần ngay trên đường phố. Lựa chọn khả dĩ duy nhất là đưa vào một vài yếu tố bất toàn."

 # Enigmatic Robot

 anomaly.2080.name:0 "Robot Bí Ẩn"
 anomaly.2580.desc:0 "Khi các nhà khoa học của chúng ta tìm hiểu về nền văn minh trước đó trên [From.GetName], họ đã phát hiện một chú robot nhỏ kỳ lạ đang cố gắng ẩn mình. Sau khi kiểm tra kỹ lưỡng hơn sinh vật này, chúng tôi phát hiện ra rằng nó dường như đang giám sát một nhà máy đổ nát trong khu vực, dốc lòng giữ cho nó hoạt động."

# The Inhabitants of Parvus III

 anomaly.6700.name:0 "Thoát Chết Trong Gang Tấc"
 anomaly.6700.desc:0 "Khi phi hành đoàn của tàu [Root.GetName] thám hiểm những đụn cát cằn cỗi trên §H[nanite_swarm_planet.GetName]§!, những báo cáo ban đầu đúng như dự kiến: đây là một vùng đất hoang bất thường không có dấu hiệu của sự sống trên mặt nước. Thế nhưng sinh vật thủy sinh của hành tinh này đã tiến hóa vượt xa mức mà chúng ta kỳ vọng một số loài có thể tiến lên đất liền.\n\nNgoài ra, phi hành đoàn còn phát hiện ra những thứ thoạt nhìn như các công trình kiến trúc cổ xưa bị cát bao phủ. Ngay sau khi họ bắt đầu đào vào các công trình này, những bầy nanite nhỏ xuất hiện và bắt đầu tấn công các nhà nghiên cứu. Có vẻ như các công trình này không phải được tạo thành từ cát, mà từ hàng tỷ cỗ máy nano siêu vi!\n\nMột khi đã bị kích hoạt, những bầy đàn này nhanh chóng nhân lên, đánh thức ngày càng nhiều khối thể đang ngủ say. [Root.GetLeaderName] đã ra lệnh khẩn cấp sơ tán khỏi hành tinh, giúp tàu [Root.GetName] vừa đủ thời gian thoát khỏi bầu khí quyển trong khi một cơn bão nanite đuổi sát nút phía sau. Bầy đàn còn lại giờ đây dường như đang bị kích động dữ dội và không có dấu hiệu dịu đi."
 anomaly.6700.a:0 "Tìm hiểu xem chuyện gì đã xảy ra ở đây."

 anomaly.6705.name:0 "Về Nguồn Gốc Của Nanite"
 anomaly.6705.desc.start:0 "Tàu [root.GetName] đã hoàn thành việc nghiên cứu các nanite bản địa trên §H[nanite_swarm_planet.GetName]§!, và kết quả thật đáng kinh ngạc. Hàng nghìn năm trước, một con tàu đến từ nền văn minh tiên tiến đã rơi xuống đây. Trên con tàu đó chở theo hàng chục mẫu thiết kế robot khác nhau."
 anomaly.6705.desc.L:0 "Kỳ lạ thay, có vẻ như những cỗ máy này có thể từng là công cụ của những Người Xây Cổng bí ẩn, dù có niên đại cổ xưa hơn bất kỳ Cổng L nào chúng ta từng tìm thấy."
 anomaly.6705.desc.noL:0 "Bất kể ai đã chế tạo ra những cỗ máy này, họ đều nắm giữ công nghệ thực sự tiên tiến, đi trước thời đại của chúng ta rất xa."
 anomaly.6705.desc.end:0 "\nNhững cỗ máy robot hoạt động độc lập và cố gắng bảo vệ hành tinh theo chương trình của chúng. Khi không có những người sáng tạo kiềm tỏa, một cuộc chiến đã nhanh chóng nổ ra giữa các cỗ máy.\n\nKẻ chiến thắng trong cuộc xung đột này là một hệ thống nanite siêu thích ứng, có khả năng tự nhân bản và tiến hóa nhanh chóng để hòa nhập vào sinh quyển hành tinh. Cỗ máy này đã tự phong mình làm chủ nhân của thế giới bề mặt, phân rã mọi thứ từ thảm thực vật bản địa cho đến các cỗ máy robot đối thủ trước đây.\n\nChúng ta đang chứng kiến hậu quả của cuộc đại chiến này: một hành tinh không hề thiếu vắng sự sống, mà thay vào đó đang nuôi dưỡng loài săn mồi đỉnh cao đã tiến hóa hoàn thiện."
 anomaly.6705.a:0 "Thuần hóa Bầy Đàn."
 anomaly.6705.b:0 "Nghiên cứu thêm về Bầy Đàn."
 anomaly.6705.b.tooltip:0 "Chỉ đạo các [Root.Owner.GetScientistPlural] của chúng ta giải mã bí mật của loài nanite đã tiến hóa trên [nanite_swarm_planet.GetName]"
 anomaly.6705.c:0 "Tiêu diệt Bầy Đàn."

 anomaly.6710.name:0 "Hệ Thống Miễn Dịch Nhân Tạo"
 anomaly.6710.desc.start:0 "Cư dân trên §H[nanite_swarm_planet.GetName]§! không ngừng gây kinh ngạc. Bất kỳ tàu thăm dò nào chúng ta gửi xuống khí quyển đều bị bầy đàn nhanh chóng phân tích và tháo rời, và ngay sau đó phần còn lại của tổ bầy cũng học được cách tiêu diệt drone của chúng ta một cách hiệu quả nhất - ngay cả ở phía bên kia bán cầu của hành tinh. Bầy đàn thể hiện sự gia tăng rõ rệt trong khả năng thấu hiểu công nghệ của chúng ta."
 anomaly.6710.desc.normal:0 "Một số [Root.Owner.GetScientistPlural] của chúng ta lập luận rằng hành vi này chứng minh bầy đàn là một thực thể có tri giác - hoặc tập hợp các thực thể - và thậm chí có thể được coi là một dạng sinh vật sống.\n\nĐã đến lúc đưa ra quyết định: chúng ta để mặc chúng, tiêu diệt chúng, hay tìm cách chiếm đoạt các thực thể này vì lợi ích của riêng mình?"
 anomaly.6710.desc.gestalt:0 "Đây là những hành vi của một tâm trí bầy đàn đang thành hình, và nếu để mặc cho phát triển tự do, bầy đàn nanite có thể đạt được tri giác. Chúng ta có nên để nó ở trạng thái này, hay tiêu diệt trước khi nó trở thành một mối đe dọa? Liệu chúng ta có thể chiếm đoạt thực thể này phục vụ lợi ích của mình?"

 anomaly.6710.a:0 "Thuần hóa Bầy Đàn."
 anomaly.6710.b:0 "Tiêu diệt Bầy Đàn."
 anomaly.6710.c:0 "Đây không chỉ là những cỗ máy tự động đơn thuần, mà là những sinh vật sống!"

 anomaly.6715.name:0 "Phì Nhiêu Nanite"
 anomaly.6715.desc:0 "Mặc dù bầy đàn nanite trên §H[nanite_swarm_planet.GetName]§! rất đáng kinh ngạc khi hợp thành một khối tập thể, nhưng với tư cách cá thể riêng lẻ thì chúng lại khá mong manh. Bằng cách chiết xuất một vài cá thể từ bầu khí quyển của hành tinh và sử dụng công nghệ AI tiên tiến của chúng ta, chúng ta đã xoay sở tái lập trình hệ thống liên lạc của các cỗ máy. Sau đó, khi chúng ta đưa các nanite đã tái lập trình trở lại bầy đàn, những sửa đổi này đã lan rộng khắp toàn cầu chỉ trong chớp mắt.\n\nSau khi đã kiểm soát được mạng lưới, mệnh lệnh đầu tiên của chúng ta là tái thiết lập một sinh quyển ổn định trên §H[nanite_swarm_planet.GetName]§! - một sinh quyển được tối ưu hóa cho loài [Root.Owner.GetSpeciesNamePlural]. Hành tinh này giờ đây đã sẵn sàng và đang chờ đợi chúng ta, và bầy nanite sẵn sàng giúp đỡ bất kỳ công việc nào mà các cư dân thuộc địa của chúng ta giao phó."
 anomaly.6715.a:0 "Khởi động động cơ tàu thuộc địa!"

 anomaly.6720.name:0 "Không Kẻ Nào Thắng Nổi Oanh Tạc Quỹ Đạo"
 anomaly.6720.desc:0 "Bụi cát đang lắng xuống sau khi hạm đội [root.fleet.GetName] hoàn tất đợt oanh tạc quỹ đạo nhằm vào §H[nanite_swarm_planet.GetName]§!. Bầy đàn nanite đã bị xóa sổ hoàn toàn, chỉ để lại một lớp bột mịn bao phủ bề mặt thế giới sa mạc."

 anomaly.6725.name:0 "Chuẩn Bị Chưa Thấu Đáo"
 anomaly.6725.desc:0 "Những biện pháp phòng ngừa và trang thiết bị đặc biệt của chúng ta vẫn chưa đủ. Không lâu sau khi thiết lập một tiền đồn thuộc địa trên §H[nanite_swarm_planet.GetName]§!, bầy đàn nanite đã tràn ngập tiền đồn, nuốt chửng máy móc và xé toạc các mái vòm sinh thái trước khi các thuộc địa có thể di tản.\n\nHành tinh này rõ ràng vẫn còn quá nguy hiểm để định cư vào lúc này."
 anomaly.6725.a:0 "Chết tiệt lũ nanite!"

 parvus_III_chain_title: "Cư Dân Của Parvus III"
 parvus_III_chain_desc: "Parvus III không hề có sự sống hữu cơ, nhưng nơi đây vẫn luôn rộn ràng những hoạt động sôi nổi. Những sinh vật này là gì, và liệu có thể tìm ra lời giải thích hợp lý cho chúng?"

# Color of Science

 anomaly.6740.name:0 "Màu Sắc Của Khoa Học"
 anomaly.6740.desc:0 "Nguyên nhân gây ra hiện tượng cộng hưởng bức xạ mặt trời được quan sát thấy quanh vành nhật hoa của §Y[From.GetName]§! hóa ra là một khối cấu trúc tinh thể bất thường có khả năng chịu đựng sức nóng khủng khiếp!\n\nSau khi mang tinh thể lên tàu, các [Root.Owner.GetScientistPlural] của chúng ta đã giật mình nhận ra rằng hiện tượng cộng hưởng kỳ lạ này có thể tái lập được. Đầu tiên, họ cho tinh thể tiếp xúc với cùng loại bức xạ mặt trời từ [From.GetName], tạo ra kết quả giống hệt hiện tượng được ghi nhận ban đầu. Nó cũng dường như tạo ra sự cộng hưởng với mọi sóng năng lượng mà chúng ta truyền qua nó, hình thành nên những màu sắc và âm thanh mới chưa từng được loài [Owner.GetSpeciesNamePlural] chứng kiến trước đây!\n\nNhững tần số như vậy có thể thay đổi cách chúng ta nhìn nhận vũ trụ. Mặt khác, chúng ta có thể phát triển các ứng dụng nghiên cứu cho một cấu trúc tinh thể có khả năng sống sót qua sức nóng dữ dội của một ngôi sao."
 anomaly.6740.a:0 "Gửi các tần số mới này về cho giới nghệ sĩ của chúng ta."
 anomaly.6740.a.gestalt:0 "Thu thập các tần số mới này để phân tích sâu hơn."
 anomaly.6740.b:0 "Thu hoạch tinh thể để cách nhiệt cho vũ khí năng lượng của chúng ta."

# Alpha Centauri Anomaly

 anomaly.6745.name:0 "[From.GetName]"
 anomaly.6745.desc:0 "Suốt bao thế hệ kể từ khi loài [Root.Owner.GetSpeciesNamePlural] của chúng ta lần đầu ngước nhìn các vì sao, [From.GetName] đã luôn là một nguồn cảm hứng bất tận. Nay khi đã tiếp cận được nó, việc tận mắt chứng kiến thế giới này mang lại cho chúng ta niềm xúc động khôn nguôi."
 anomaly.6745.a:0 "Cảm ơn vì đã truyền cảm hứng cho chúng tôi, [From.GetName]."
 anomaly.6745.b:0 "Lại thêm một ngoại hành tinh nữa được ghi danh vào danh sách ngày một dài của chúng ta."
 anomaly.6750.name:0 "[From.GetName]"
 anomaly.6750.desc:0 "Hành tinh bị khóa thủy triều này dường như sở hữu tất cả các khối nền tảng cần thiết cho một thế giới có thể sinh sống được. Có lẽ có thứ gì đó có thể được xây dựng tại đây."

# Target Practice Anomaly

 anomaly.6800.name:0 "Bắn Tập"
 anomaly.6800.desc:0 "Các cảm biến của chúng ta phát hiện ra rằng những mảnh vỡ tàu trên [From.GetName] đã tới được nơi này theo một phương thức vô cùng hiếm gặp. Những con tàu dường như đã bị bắn hạ từ cự ly cách xa nhiều năm ánh sáng bởi một loại vũ khí động năng siêu thanh từ thời cổ đại."
 anomaly.6800.a:0 "Trục vớt bộ đẩy đó!"
 anomaly.6800.b:1 "Chúng ta sẽ không lãng phí số hợp kim đó."

# ASR: Asteroid Sensor Relay

 anomaly.6805.name:0 "Trạm Tiếp Sóng Cảm Biến Tiểu Hành Tinh"
 anomaly.6805.desc:0 "Với hy vọng tìm thấy tài nguyên quý hiếm bên trong [From.GetName], các [Owner.GetScientistPlural] của chúng ta đã tình cờ phát hiện ra một trạm tiếp sóng cảm biến cổ xưa được giấu kín sâu trong lòng đá. Dù đã ngừng hoạt động từ lâu, bộ nhớ của nó vẫn lưu giữ nhiều thuật toán mã hóa tối tân."
 anomaly.6805.a:0 "Thu hồi các Cảm biến."
 anomaly.6805.b:0 "Ngoại suy phần mềm mã hóa của họ."

 anomaly.6810.name:0 "Xâm Nhiễm"
 anomaly.6810.desc:0 "Chúng ta đã lầm. Trạm vũ trụ quay quanh [From.GetName] không hề bị bỏ hoang; trái lại, nó đang lúc nhúc những sinh vật chân khớp khổng lồ ngoài hành tinh! Tàu thăm dò chúng ta phóng vào trạm đã bị chúng xé nát ngay lập tức."
 anomaly.6810.a:0 "Cử một đội đổ bộ, lũ chân khớp khổng lồ ngoài hành tinh không phải trò đùa đâu!"
 anomaly.6810.b:0 "Có lẽ tốt nhất là chúng ta nên để yên cho chúng."
 anomaly.6810.c:0 "§BThử liên lạc với những người bạn chân khớp này.§!"
 anomaly.6810.d:0 "§BXả khí tống khứ chúng ra ngoài không gian.§!"
 anomaly.6810.d.tooltip:0 "Vận dụng kiến thức tiên tiến của chúng ta về trạm môi trường sống để làm nứt vỡ bầu khí quyển của trạm vũ trụ."
 anomaly.6810.e.evopred: "§BThu thập bộ gen của chúng!§!"
 anomaly.6815.name:0 "Những Sinh Vật Chân Khớp Khổng Lồ Ngoài Hành Tinh"
 anomaly.6815.desc:0 "Ồ, xin chào các bạn! Rất tiếc vì đã phá hủy tàu thăm dò của các bạn lúc nãy. Chẳng qua là chúng tôi đang tiến hành một số thí nghiệm hết sức nhạy cảm ở đây, và chúng tôi lo sợ những can thiệp bên ngoài sẽ làm sai lệch kết quả mà thôi."
 anomaly.6815.a:0 "Chờ đã, vậy ra các bạn không phải là một bầy ký sinh thù địch?"
 anomaly.6820.desc:1 "Điều gì lại khiến các bạn nghĩ như vậy chứ? Chúng tôi là một phân đội của Hội Giám Tuyển, được điều động tới đây để nghiên cứu các đặc điểm độc nhất vô nhị của hệ sao này. Nếu các bạn muốn chia sẻ những kiến thức mà hội chúng tôi vẫn thường cung cấp, các bạn chỉ cần hỏi thôi mà!"
 anomaly.6820.a:0 "Chúc các bạn may mắn với những thí nghiệm của mình."

# Crystal Growths Anomaly

 anomaly.6825.name:0 "Các Mầm Tinh Thể"
 anomaly.6825.desc.start:0 "Những dạng sống sinh sống trên [From.GetName] hoàn toàn không giống với bất cứ thứ gì chúng ta từng dự liệu. Các [owner.GetScientistPlural] của chúng ta báo cáo lại rằng tiểu hành tinh này có các mầm tinh thể phát triển. Những mầm phát triển này hóa ra có khả năng tự duy trì sự sống bằng cách hấp thụ bức xạ môi trường của hệ sao [From.System.GetName] và kết hợp nó với thành phần khoáng vật của tiểu hành tinh."
 anomaly.6825.desc.nofood:0 "Bản thân các tinh thể này chủ yếu được cấu tạo từ sucrose và rất dễ vỡ."
 anomaly.6825.desc.food:0 "Bản thân các tinh thể này chủ yếu được cấu tạo từ sucrose và rất có thể mang giá trị thực phẩm tiềm năng."
 anomaly.6825.b:0 "Các bạn bảo là ăn được ư?"
 anomaly.6835.name:0 "Tiếng Gọi Của Tinh Thể"
 anomaly.6835.desc:0 "Sau khi ăn đường tinh thể không gian suốt vài năm qua, rõ ràng là nhu cầu đối với món ngon này của người dân chúng ta ngày một gia tăng. Các [Root.GetScientistPlural] của chúng ta tin rằng có thể tìm thấy thêm nhiều tiểu hành tinh phù hợp trong hệ sao để gieo cấy các mầm tinh thể mới."
 anomaly.6835.a:0 "Tìm kiếm thêm tiểu hành tinh để mở rộng trang trại tinh thể."
 anomaly.6835.a.tooltip:0 "Tối đa §Y3§! tiểu hành tinh ngẫu nhiên giờ đây sẽ sản xuất §G3§! £food£ Lương thực."
 anomaly.6835.b:0 "Đừng mở rộng các trang trại tinh thể."

# Too Few Sheep Asteroid Anomaly

 anomaly.6840.name:0 "Quá Ít Cừu"
 anomaly.6840.desc:0 "[From.GetName] là một hành tinh khí khổng lồ kỳ lạ. Kiến thức vật lý thiên văn của chúng ta cho thấy một hành tinh như thế này lẽ ra phải sở hữu các vành đai hành tinh, nhưng nó lại hoàn toàn không có. Phân tích sâu hơn cho thấy các tiểu hành tinh lẽ ra phải tạo nên các vành đai đó thực chất đã bị mắc kẹt tại các điểm Lagrange ổn định quanh hành tinh."
 anomaly.6840.a:0 "Chúng ta cần số khoáng sản đó ngay bây giờ."
 anomaly.6840.b:0 "Điều tốt đẹp sẽ đến với những ai biết kiên nhẫn."

# Cascading Catastrophe

 anomaly.6845.name:0 "Thảm Họa Dây Chuyền"
 anomaly.6845.desc:0 "Chúng ta thực sự đã phát hiện ra sự sống trên [From.GetName], nhưng cũng do hành động của chúng ta mà sự sống này đã bị tuyệt diệt. Các sinh vật vi mô sống trong các tầng mây của hành tinh khí khổng lồ này đã không thể chịu nổi các chấn động phát ra từ máy quét của chúng ta, dẫn đến một phản ứng dây chuyền làm sụp đổ toàn bộ hệ sinh thái của chúng."
 anomaly.6845.a:0 "Liệu còn có thể làm được gì không?"
 anomaly.6850.name:0 "Đảo Ngược Cực Quét Sâu"
 anomaly.6850.desc:0 "Đã hoàn thành! Thật kỳ diệu, một khi các [Owner.GetScientistPlural] của chúng ta lắp đặt những sửa đổi thích hợp trên con tàu của mình, họ đã có thể tái hiện lại phản ứng dây chuyền ban đầu. Lần này hiệu ứng hoàn toàn khác biệt, và sự sống bắt đầu bùng nổ trở lại trên khắp [FromFromFrom.GetName] như một làn sóng vĩ đại."
 anomaly.6850.desc.valuesothers:0 "Quá trình này đã dạy cho chúng ta rất nhiều điều về vũ trụ, nhưng có lẽ nhiều hơn cả là về chính bản thân chúng ta."
 anomaly.6850.desc.novaluesothers:0 "Trong tương lai, chúng ta sẽ phải cẩn trọng hơn khi chiếu các thiết bị quét vào những thế giới chưa từng khám phá."
 anomaly.6850.a:0 "Tin tức thật tuyệt vời!"

# Caught in the Eye

 anomaly.6855.name:0 "Bị Hút Vào Tầm Mắt"
 anomaly.6855.desc.regular:0 "Tín hiệu cuối cùng nhận được từ [Root.GetName] không hơn gì mớ âm thanh tĩnh điện hỗn loạn. Họ từng nghiên cứu những cơn bão cục bộ kỳ lạ trên [From.GetName] và gửi về những báo cáo sơ bộ đáng kinh ngạc. Cơn bão phản ứng lại các tàu thăm dò được gửi vào, tạo ra các túi chân không để né tránh chúng rồi từ từ thẩm thấu ngược lại về phía các drone. Tàu [Root.GetName] từng lên kế hoạch thử nghiệm vô số tần số quét vào cơn bão trước khi chúng ta mất liên lạc. Con tàu khoa học dường như đã chìm sâu vào hành tinh khí khổng lồ và hiện đang ở trạng thái ngủ say."
 anomaly.6855.desc.gestalt:0 "Các tín hiệu từ [Root.GetName] đột ngột bị cắt đứt khỏi ý thức. Các [Owner.GetScientistPlural] dường như không chết, chỉ là không thể giao tiếp với chúng ta. Họ từng nghiên cứu những cơn bão cục bộ kỳ lạ trên [From.GetName] và gửi về những báo cáo sơ bộ đáng kinh ngạc. Cơn bão phản ứng lại các tàu thăm dò được gửi vào, tạo ra các túi chân không để né tránh chúng rồi từ từ thẩm thấu ngược lại về phía các drone. Kế hoạch của [Root.GetName] là thử nghiệm vô số tần số quét vào cơn bão trước khi liên lạc bị cắt đứt. Con tàu khoa học dường như đã chìm vào hành tinh khí khổng lồ và hiện đang ngủ say."
 anomaly.6855.a:0 "Chúng ta cần phải giải cứu [Root.GetName]!"
 anomaly.6855.b:0 "Khoan đã, [From.GetName] giờ đây thậm chí còn THÚ VỊ hơn."
 anomaly.6855.b.tooltip:0 "Bỏ rơi [Root.GetName] và nghiên cứu các phản ứng."
 anomaly.6860.name:0 "Biến Động Tần Số Khiên Chắn"
 anomaly.6860.desc:0 "Sau nhiều tháng lao động, các [Owner.GetScientistPlural] của chúng ta cuối cùng đã xoay sở biến đổi khiên chắn của tàu [FromFrom.GetName] theo cách khiến cơn bão [FromFromFrom.GetName] nới lỏng sự kìm kẹp đối với con tàu bị mắc kẹt. Liên lạc với tàu [trapped_in_storm.GetName] nhanh chóng được tái lập, và kỳ lạ thay, không một ai trên tàu [FromFrom.GetName] nhớ về khoảng thời gian họ bị giam cầm bên trong cơn bão."
 anomaly.6860.a:0 "Quay lại làm việc thôi."

# Express Mail

 anomaly.6865.name:0 "Chuyển Phát Nhanh"
 anomaly.6865.desc:1 "Khi [Root.GetName] tiếp cận đủ gần để quét khoang hàng, mọi người ban đầu cho rằng các cảm biến đang trục trặc. Khoang này được chế tạo bằng chính xác cùng loại [Owner.GetBioAlloy] mà chính chúng ta sử dụng cho các cấu trúc không gian. Khả năng một loài sinh vật ngoài hành tinh nào đó nghĩ ra đúng loại hợp chất này là điều không tưởng, thế nhưng sau khi hiệu chỉnh lại máy quét, kết quả tương tự vẫn xuất hiện.\n\nKhi mở khoang hàng ra, thứ duy nhất chào đón chúng ta là một tập hợp các tài liệu mô tả chi tiết chính xác nơi chúng ta nên phân công từng [Owner.GetScientistPlural] và họ nên được yêu cầu nghiên cứu điều gì. Các chỉ dẫn kết thúc vào một ngày cố định, được lên lịch diễn ra chính xác 10 năm kể từ bây giờ."
 anomaly.6865.a:0 "Gửi các ghi chép về [Owner.Capital.GetName]."
 anomaly.6865.b:1 "Chuyện này khiến chúng ta lạnh gáy."
 anomaly.6870.name:0 "Khép Kín Vòng Lặp"
 anomaly.6870.desc:1 "Sau nhiều năm phát triển đầy bất an, một vết rách trong kết cấu không gian đã xuất hiện ngay phía trên [Root.Capital.GetName]. Đúng như dự đoán rùng mình từ quá khứ, chiếc khoang hàng mà chúng ta vừa chuẩn bị theo đúng hướng dẫn đã lao vào vết rách và biến mất vào dòng thời gian."
 anomaly.6870.a:0 "Hãy để bản thân chúng ta trong quá khứ đối phó với chuyện này."

# Convenient Mining

 anomaly.6875.name:0 "Khai Khoáng Thuận Tiện"
 anomaly.6875.desc:0 "Tiểu hành tinh quanh [From.GetName] có quỹ đạo ổn định hoàn hảo đến mức dễ hiểu vì sao các [Owner.GetScientistPlural] của chúng ta lại kinh ngạc khi thấy việc thiết lập một trạm khai thác ở đây lại thuận tiện và nhanh chóng đến thế. Vị trí của nó như thể được sắp đặt sẵn cho chúng ta vậy."
 anomaly.6875.a:0 "Thật là chu đáo."
 anomaly.6880.name:0 "Hiện Tượng Tự Quay Khó Hiểu"
 anomaly.6880.desc:0 "Chỉ một ngày sau khi hoàn thành trạm khai thác trên tiểu hành tinh bị giữ chân, khối đá bất ngờ bắt đầu tự quay dữ dội, phá hủy trạm khai thác trong quá trình đó nhưng đồng thời cũng làm lộ ra nhiều lớp khoáng sản phong phú hơn nữa."
 anomaly.6880.a:0 "Xây dựng lại lần nữa!"
 anomaly.6880.b:0 "Tại sao nó lại làm như vậy?"
 anomaly.6885.name:0 "Tinh Thể Khó Chịu"
 anomaly.6885.desc:0 "Còi báo động vang lên khắp hệ sao [Solar_System.GetName] khi hàng loạt bầy dã thú tinh thể lao ra từ nơi ẩn náu bên trong tiểu hành tinh, ngay tại nơi chúng ta vừa mới tiến hành khoan vào."
 anomaly.6890.name:0 "Tổ Tinh Thể Ngủ Say"
 anomaly.6890.desc:0 "Tiểu hành tinh bị giữ chân thực chất là tổ của một sinh vật tinh thể. Thật may mắn là chúng ta đã không tiếp tục khai thác sâu hơn, vì có vẻ như chúng ta suýt nữa đã chọc giận sinh vật đang ngủ đông bên trong. Nếu tiếp cận cẩn trọng, chúng ta có thể nghiên cứu nó an toàn."
 anomaly.6890.a:0 "Chúng ta có thể học hỏi được điều gì từ nó?"

# Toxic Biological Industry

 anomaly.6895.name:0 "Công Nghiệp Sinh Học Độc Hại"
 anomaly.6895.desc.catano:0 "Các dấu hiệu sự sống quan sát được bên trong bầu khí quyển độc hại của [From.GetName] thực chất là những cỗ máy cơ khí bán hữu cơ khổng lồ! Tổ hợp công nghiệp ngoài hành tinh này dường như là tàn tích còn sót lại từ một kỷ nguyên đã chìm vào quên lãng."
 anomaly.6895.desc.catayes:0 "Các dấu hiệu sự sống quan sát được bên trong bầu khí quyển độc hại của [From.GetName] thực chất là những cỗ máy cơ khí bán hữu cơ khổng lồ! Cũng giống như chúng ta, có vẻ như cơ sở này đã vận hành bằng cách xúc tác các hợp chất hữu cơ thành tài nguyên công nghiệp."
 anomaly.6895.b:0 "Thu hoạch những bộ phận chúng ta có thể."
 anomaly.6895.c:0 "Thu hoạch tất cả mọi thứ."
 anomaly.6895.d:0 "Hãy để những kẻ ngốc đang ngủ say tiếp tục nằm yên."

# Cool Thoughts

 anomaly.6900.name:0 "Những Ý Nghĩ Băng Giá"
 anomaly.6900.desc:0 "Chúng ta không chỉ phát hiện các dạng sống dưới bề mặt. Chúng ta đã phát hiện ra chúng trên toàn bộ thế giới! Hành tinh băng giá này được đan xen bởi những ống siêu vi liên kết với nhau như một cỗ máy tính thô sơ. Dù cấu trúc có phần nguyên thủy, quy mô khổng lồ của nó đồng nghĩa với việc nó có thể sánh ngang một số siêu máy tính của [Owner.Capital.GetName] về mặt công suất. Ngay cả bây giờ, cỗ máy tính dường như vẫn đang hoạt động - các [Owner.GetScientistPlural] của chúng ta có thể giao tiếp với nó, nhưng vì nó hoạt động quá chậm chạp, chúng ta sẽ chỉ có thể hỏi nó một câu hỏi duy nhất."
 anomaly.6900.a:0 "Ngươi có thể giải những phép tính này không?"
 anomaly.6900.a.tooltip:0 "Sử dụng thế giới này để hỗ trợ tính toán các bế tắc vật lý thiên văn hiện tại của chúng ta."
 anomaly.6900.b:0 "Ai đã tạo ra ngươi?"
 anomaly.6900.c:0 "Ai đã đến trước chúng ta?"
 anomaly.6900.d:0 "Chúng ta là ai?"
 anomaly.6900.evopred: "Thứ gì là ngon lành nhất?"
 anomaly.6900.e:0 "Tốt nhất là quan sát nó từ xa."

# Don't Count Your Planets

 anomaly.6905.name:0 "Đừng Đếm Số Hành Tinh"
 anomaly.6905.desc:0 "Các [Owner.GetScientistPlural] của chúng ta vừa có một phát hiện còn kinh hãi hơn. Dãy núi mà họ quét được trước đó thực chất là lớp vỏ sần sùi của một quả trứng vũ trụ khổng lồ!"
 anomaly.6905.a:0 "Nghiên cứu nó từ xa."
 anomaly.6905.b:0 "Đập vỡ nó ra!"
 anomaly.6905.c:0 "Đại tiệc."
 anomaly.6910.name:0 "Món Trứng Cuộn Thiên Hà"
 anomaly.6910.desc.start:0 "Bên trong [FromFromFrom.GetName] không giống như những gì chúng ta mong đợi. Chúng ta không tìm thấy ấu trùng quái thú khổng lồ nào cả, thay vào đó chỉ là một khối noãn hoàng khổng lồ giàu dưỡng chất."
 anomaly.6910.desc.hatchling:0 "Dù tương tự như loài nghiệt chủng hư không mà nền văn minh của chúng ta từng chạm trán trước đây, nhưng quả trứng này đã nuôi dưỡng một tạo vật thậm chí còn vĩ đại hơn nhiều."
 anomaly.6910.b.evopred: "Thưởng thức noãn hoàng!"
 anomaly.6915.name:0 "Lòng Biết Ơn"
 anomaly.6915.desc.regular:0 "§R\"NÓ ĐÃ SỐNG! NÓ ĐÃ TÁI SINH! Chúng ta chẳng qua chỉ là cát bụi nhỏ bé so với một tạo vật như vậy; những tranh đoạt phù du giữa các đế chế có nghĩa lý gì trước sự vĩ đại nhường-\"§!\n\nBản truyền tin cuối cùng của tàu [Root.GetName] bị cắt đứt tại đó, và khi chúng ta sử dụng các đầu dò để quét tàn tích của [FromFromFrom.GetName], chúng ta chỉ tìm thấy một lớp vỏ rỗng. Có vẻ như sinh vật này chẳng có mấy lòng biết ơn đối với những kẻ đã giải phóng nó."
 anomaly.6915.desc.gestalt:0 "Các [Owner.GetScientistPlural] của chúng ta được phái đến hệ sao [Solar_System.GetName] đều hoảng loạn phản ứng ngay trước khi mất liên lạc với [Owner.GetBrainName], chỉ kịp thông báo cho chúng ta rằng §R\"Nó đã thoát ra ngoài.\"§! Bản truyền tin cuối cùng của tàu [Root.GetName] bị ngắt quãng khi quả trứng bắt đầu nứt vỡ, và khi chúng ta dùng các đầu dò để quét tàn tích của [FromFromFrom.GetName], chúng ta chỉ thấy một lớp vỏ rỗng. Dường như sinh vật này chẳng mảy may có chút lòng biết ơn nào đối với kẻ đã giải phóng nó."
 anomaly.6915.b.evopred: "Thu thập những gì còn lại."

# Heat from Below

 anomaly.3140.name:0 "Nguồn Nhiệt Từ Lòng Đất"
 anomaly.3140.desc:0 "Sau khi thăm dò bên dưới bề mặt, chúng ta đã kết luận rằng tín hiệu nhiệt bất thường trên [From.GetName] xuất phát từ các suối thủy nhiệt. Những mạch nước ngầm này có mặt trên khắp hành tinh băng giá, tạo ra các túi nước ấm giàu khoáng chất bên dưới lớp băng vĩnh cửu."
 anomaly.3140.a:0 "Đáng chú ý. Nhưng chúng ta không cần lãng phí thêm tài nguyên vào việc này nữa."
 anomaly.3141.name:0 "Độ Sâu Của Sự Sống Ngoại Tinh"
 anomaly.3141.desc:0 "Cuộc khám phá tiếp tục của phi hành đoàn tàu [From.GetName] đã tiết lộ rằng nguồn nước nóng từ sâu trong lớp vỏ hành tinh ngập tràn các dạng sống vi sinh kỳ lạ! Vùng đất băng giá mà chúng ta từng nghĩ là hoang tàn thực chất lại đang nuôi dưỡng một hệ sinh thái ngầm vô cùng phong phú."

 colony.5000.name:0 "Người Bạn Bất Ngờ"
 colony.5000.desc:0 "Sinh vật kỳ lạ trên [Root.GetName] đã tỏ ra hết sức chào đón những người định cư của chúng ta ngay từ khi họ đặt chân lên hành tinh. Dù ban đầu nhiều cư dân chưa tin tưởng chú robot nhỏ này, nhưng thái độ nhiệt thành và sự giúp đỡ không mệt mỏi của nó trong việc xây dựng [Root.GetName] đã nhanh chóng chiếm trọn cảm tình của tất cả mọi người."
 colony.5000.a:0 "Thật tử tế khi sinh vật nhỏ bé này giúp đỡ chúng ta nhiều như vậy."

 colony.5005.name:0 "Nhà Máy Cổ Đại"
 colony.5005.desc:0 "Nhà máy do chú robot nhỏ trên [Root.GetName] giám sát đã đóng vai trò rất quan trọng trong những năm đầu khai phá thuộc địa. Giờ đây, khi các cư dân định cư đã dần ổn định cuộc sống, họ nhận thấy các dây chuyền cổ xưa này đang dần mục ruỗng và có nguy cơ sụp đổ hoàn toàn."
 colony.5005.a:0 "Hãy xem liệu chúng ta có thể giúp đỡ nó hay không."

 colony.5006.name:0 "Nhà Máy Đổ Sụp"
 colony.5006.desc:0 "Sau nhiều năm dần mục ruỗng, nhà máy vĩ đại trên [Root.GetName] cuối cùng đã đổ sụp hoàn toàn thành đống đổ nát. Sau khi thu dọn hiện trường công trình cổ xưa này, các cư dân thuộc địa phát hiện ra chú robot nhỏ bé cũng đã ngừng hoạt động, vĩnh viễn nằm im dưới đống gạch đá."
 colony.5006.a:0 "Không còn linh vật nữa rồi."

 colony.5010.name:0 "Nhà Máy Được Phục Hồi"
 colony.5010.desc:0 "Các kỹ sư của chúng ta từng chắc mẩm họ đã thất bại trong việc sửa chữa nhà máy cổ đại trên [Root.GetName] khi tất cả các thiết bị bất thần dừng hoạt động. Thế nhưng, sau một khoảng lặng ngắn ngủi, toàn bộ hệ thống đã tự khởi động lại trơn tru, công suất vận hành thậm chí còn vượt xa những tính toán ban đầu!"
 colony.5010.a:0 "Kết thúc có hậu là tốt rồi."
 colony.5010.tt:0 "Đặc Trưng Thuộc Địa §Y$d_hab_lonely_bot_deposit$§! giờ đây cũng sản xuất §G1§! £volatile_motes£ §YHạt Bất Ổn§! và §G1§! £exotic_gases£ §YKhí Hiếm§!."

 colony.5015.name:0 "Robot Mất Tích"
 colony.5015.desc:0 "Chúng ta vừa nhận được một bản báo cáo khẩn từ cư dân trên [Root.GetName], dường như chú robot bí ẩn lại gây ra rắc rối mới. Gần đây nó đột nhiên biến mất, và cùng lúc đó, một số lượng lớn các cư dân định cư của chúng ta cũng bặt vô âm tín."
 colony.5015.a:0 "Hy vọng chúng ta có thể giải quyết chuyện này càng sớm càng tốt."

 colony.5020.name:0 "Tàn Tích"
 colony.5020.desc:0 "Sau nhiều tuần nỗ lực truy tìm các tín hiệu từ chú robot trên [Root.GetName], các kỹ sư của chúng ta cuối cùng đã phát hiện một trục đứng cổ xưa dẫn sâu vào lòng đất. Sâu bên dưới lòng đất, họ bắt gặp một cấu trúc cổ đại nơi hầu hết những người mất tích đang bị giam giữ trong trạng thái ngủ đông stasis, cùng với tàn tích của chú robot nhỏ.\n\nSau khi đánh thức các cư dân thuộc địa, chúng ta được biết rằng tất cả bọn họ đều là thành viên của một giáo phái ngầm vô tình lạc vào đống phế tích, và toàn bộ công trình suýt nữa đã sập xuống đầu họ khi chú robot nhỏ xuất hiện để ứng cứu. Cả các kỹ sư lẫn bản thân những người sống sót đều không rõ chính xác bằng cách nào họ lại rơi vào trạng thái ngủ đông, hay chú robot đã làm gì để ngăn chặn cấu trúc sụp đổ.\n\nCác kỹ sư của chúng ta rất muốn tháo dỡ cỗ máy bí ẩn này giờ đây khi nó đã ngừng hoạt động để xem chúng ta có thể học hỏi được gì từ công nghệ của nó. Mặt khác, cư dân trên [Root.GetName] lại tha thiết cầu xin chúng ta xem liệu có thể sửa chữa và khôi phục chú sinh vật nhỏ bé trở lại như xưa hay không."
 colony.5020.a:0 "Vậy thì hãy trả lại chú linh vật nhỏ cho người dân."
 colony.5020.tt:0 "Đặc Trưng Hành Tinh §Y$d_hab_lonely_bot_deposit$§! giờ đây cũng cung cấp một vị trí việc làm £job_robot_caretaker£ §YNgười Chăm Sóc Robot§!."
 colony.5020.b:0 "Lệnh cho các kỹ sư tháo dỡ nó ra xem nó cất giấu những bí mật gì."

 ancrel.11000.name:0 "Tầng Đầu Tiên"
 ancrel.11000.desc:0 "Tàn tích dường như đã tồn tại hàng thế kỷ, nếu không muốn nói là hàng thiên niên kỷ. Khi các nhà nghiên cứu của chúng ta tiến vào sâu hơn, họ phát hiện đây là một công trình nhiều tầng, dường như dẫn sâu hơn nữa vào lòng đất.\n\nTầng đầu tiên này chứa đầy hàng trăm thi thể được bảo quản hoàn hảo của một giống loài vô danh, tất cả đều chết vì những vết thương do chính tay họ tự gây ra. Tất cả đều hướng mặt về cánh cổng dẫn đến tầng tiếp theo."
 ancrel.11000.a:0 "Các tầng khác đang ẩn giấu điều gì cho chúng ta?"

 ancrel.11005.name:0 "Tầng Thứ Hai"
 ancrel.11005.desc:0 "Trong khi tầng đầu tiên dường như bao gồm những người sùng đạo bình thường, tầng thứ hai rõ ràng bao gồm các cá thể [Root.GetAdj] được huấn luyện bài bản. Những sinh vật này được bọc trong các bộ giáp hạng nặng cổ xưa và nắm chặt vũ khí của họ, dường như đã chiến đấu đến hơi thở cuối cùng trước cánh cổng tiếp theo.\n\nThật kỳ lạ, không có vết tích đạn bắn hay thiệt hại trên các bức tường xung quanh họ. Vũ khí của họ nguyên vẹn, và chỉ có máu của chính họ vương vãi khắp căn phòng."
 ancrel.11005.a:0 "Lại thêm một cảnh tượng tàn bạo nữa."

 ancrel.11010.name:0 "Tầng Thứ Ba"
 ancrel.11010.desc:0 "Khi cánh cổng dẫn vào tầng thứ ba cuối cùng mở ra, các nhà khoa học của chúng ta được chào đón bởi hàng chục nhà khoa học đã chết, thi thể của họ chất đống quanh một thiết bị phức tạp nằm ở trung tâm căn phòng.\n\nCỗ máy vẫn đang kêu vo vo yếu ớt, dường như đang duy trì một kết nối nào đó với tầng cuối cùng. Một bảng điều khiển gần đó cảnh báo về một 'Thực thể' đang bị giam cầm phía dưới."
 ancrel.11010.a:0 "Các nhà khoa học của chúng ta sẵn sàng kiểm tra tầng cuối cùng."

 ancrel.11015.name:0 "Tầng Cuối Cùng"
 ancrel.11015.desc:0 "Ngay khi cánh cổng cuối cùng mở ra, những làn sóng xung kích tâm linh dữ dội quét qua căn phòng, làm quá tải các cảm biến trên khắp hệ sao [Root.System.GetName]. Ở trung tâm căn phòng là một cỗ máy khổng lồ, giữ chặt một vết rách không-thời gian đang co giật.\n\nTừ sâu trong vết nứt, một tiếng thì thầm vang lên trong tâm trí của mọi sinh vật trong khu vực: một lời van nài được tự do, đổi lại quyền năng vô hạn."
 ancrel.11015.a:0 "Hãy thử can thiệp vào cỗ máy này xem chúng ta có thể làm được gì."

 ancrel.11020.name:0 "Thực Thể Cổ Xưa"
 ancrel.11020.desc:1 "Khi họ bắt đầu can thiệp vào cỗ máy, họ nhận ra sự trói buộc đối với vết rách đang yếu dần. Bầu không khí trong hệ sao [From.System.GetName] trở nên ngột ngạt và một bóng đen khổng lồ bắt đầu thành hình bên trong vết nứt.\n\nCỗ máy có thể bị phá hủy hoàn toàn để đóng vĩnh viễn vết rách, hoặc chúng ta có thể vô hiệu hóa các biện pháp kiềm tỏa để xem thứ gì đang chờ đợi bên kia."
 ancrel.11020.a:0 "Phá hủy cỗ máy trước khi nó gây thêm thảm họa!"
 ancrel.11020.b:0 "THẢ NÓ RA!"
 ancrel.11020.tt:1 "Một §Y$NAME_Eldritch_Horror$§! sẽ được giải phóng tại §Y[eldritch_location.GetName]§!."


 ancrel.11025.desc:0 "CUỐI CÙNG THÌ...\n\nHÃY QUỲ XUỐNG HỠI LŨ PHÀM NHÂN, BÒ TRƯỜNG TRƯỚC MẶT TA, VÀ TA SẼ BAN CHO CÁC NGƯƠI MỘT CÁI CHẾT KHÔNG ĐAU ĐỚN!"
 ancrel.11025.a:0 "Hỡi Đấng Tối Cao! Xin hãy che chở cho bầy chiên lạc lối!"
 ancrel.11025.a.tt:0 "§Y[Root.GetName]§! sẽ xây dựng lại căn cứ sao của mình tại §Y[eldritch_location.GetName]§! và nhận được sự bảo hộ cổ xưa."
 ancrel.11025.b:0 "Thật sai lầm khi giải thoát cho ngươi."
 ancrel.11025.b.tt:0 "§Y[Root.GetName]§! sẽ trở nên thù địch với §Y$NAME_Eldritch_Horror$§!."

 ancrel.11027.desc:0 "VẬY LÀ CÁC NGƯƠI ĐÃ CHỌN CON ĐƯỜNG CỦA SỰ KHÔN NGOAN.\nMỌI THỨ SẼ DIỄN RA ĐÚNG NHƯ KẾ HOẠCH CỦA TA."
 ancrel.11027.a:0 "Sẽ đúng như ý nguyện của Ngài, Hỡi Đấng Tối Cao."

 ancrel.11030.desc:0 "VẬY LÀ CÁC NGƯƠI ĐÃ CHỌN CÁI CHẾT."
 ancrel.11030.a:0 "Ngắt đường truyền."

 ancrel.11035.name:0 "Hạm Đội Mất Tích Tại [eldritch_location.GetName]"
 ancrel.11035.desc:0 "Chúng ta đã mất toàn bộ liên lạc với hạm đội của mình khi nó tiến vào [eldritch_location.GetName]. Tín hiệu cuối cùng ghi nhận sự bóp méo không-thời gian dữ dội trước khi mọi thứ rơi vào im lặng vĩnh viễn."
 ancrel.11035.a:0 "Thật là một bi kịch."

 central.5.name:0 "Tín Hiệu Từ Trung Tâm Thiên Hà"
 central.5.desc:0 "Một tín hiệu mạnh mẽ được dội lại khắp thiên hà từ vùng lõi thiên hà bí ẩn. Sau khi giải mã các lớp sóng điều chế phức tạp, các chuyên viên truyền tin của chúng ta xác nhận đây là một kênh liên lạc trực tiếp hướng về phía đế chế chúng ta."
 central.5.a:0 "Kết nối tín hiệu."

 central.10.desc:0 "Xin chào, hỡi các bạn - những sinh linh còn trẻ trung và mới mẻ đối với thiên hà này."
 central.10.a:0 "Xin chào các b-"

 central.15.desc:0 "..........."
 central.15.a:0 "Họ vừa ngắt kết nối đấy à?"

 central.20.name:0 "$NAME_Central_Crystal_Country$"
 central.20.1.desc:0 "Các bạn còn điều gì muốn thảo luận với chúng tôi nữa không?"
 central.20.2.desc:0 "Các bạn đang diện kiến Chỉ Huy của Vành Đai Ngoài. Hãy trình bày lý do các bạn tìm đến đây."
 central.20.a:0 "Các bạn có thể kể thêm về quê hương của mình không?"
 central.20.a.response:0 "Quê hương của chúng tôi đẹp tựa một giấc mơ, và nếu chúng tôi kể cho các bạn nghe về nó, các bạn có lẽ sẽ không thể nào tin nổi. Đó là một cõi giới của ánh sáng tinh thể thuần khiết."
 central.20.b:0 "Tại sao bây giờ các bạn mới xuất hiện?"
 central.20.b.response:0 "Chúng tôi từ lâu đã dõi theo các chủng tộc khác trong thiên hà từ xa. Khi các biến động lớn bắt đầu rung chuyển thiên hà, chúng tôi nhận thấy đã đến lúc phải mở lại cánh cửa tiếp xúc."
 central.20.c:0 "Có điều gì các bạn đang tìm kiếm, hay cần chúng tôi giúp đỡ không?"
 central.20.c.response:0 "Không, thời khắc cho điều đó vẫn chưa tới. Hãy quay lại sau, khi thiên hà đã sẵn sàng hơn."
 central.20.d:0 "Đó là tất cả."

 central.21.desc:0 "Hãy rời đi, hỡi lũ khủng bố, chúng ta không còn điều gì để nói với các ngươi nữa."
 central.21.a:0 "..."

 central.50.desc:0 "Một số thành phần bất trị trong xã hội của chúng tôi đang kêu gọi di cư sang các vùng đất của các bạn. Liệu đế chế của các bạn có sẵn lòng đón nhận họ không?"
 central.50.a:0 "Chúng tôi sẽ cố gắng tìm nơi định cư cho họ."
 central.50.a.tt:0 "Trong §Y10 năm§! tới, chúng ta sẽ có thể ban hành quyết định §Y$decision_crystalline_refugees$§!."
 central.50.b:0 "Lãnh thổ của chúng tôi không còn chỗ trống."

 central.quest.transmission.end:0 "Còn điều gì khác mà các bạn muốn thảo luận không?"
 crystalline_hostility_trigger_tt:0 "£trigger_no£ §Y$NAME_Central_Crystal_Country$§! không thù địch với chúng ta."

 central.51.desc:0 "Thật tốt khi nghe điều đó. Chúng tôi hy vọng họ sẽ phát triển tốt đẹp trong vòng tay của các bạn.\n\n$central.quest.transmission.end$"
 central.51.a:0 "Vâng, chúng tôi còn một điều khác muốn hỏi."
 central.51.b:0 "Không, đó là tất cả."

 central.52.desc:0 "Chúng tôi rất tiếc khi nghe điều đó. Chúng tôi sẽ tìm kiếm nơi khác cho họ.\n\n$central.quest.transmission.end$"

 central.60.desc:0 "Gần đây chúng tôi đã gặp phải một tai ương nhỏ tại một trong những tiền đồn của mình, dẫn đến sự thiếu hụt nghiêm trọng về vật liệu xây dựng. Liệu các bạn có thể hỗ trợ chúng tôi một phần tài nguyên?"
 central.60.a:1 "Chúng tôi sẽ dành riêng một số vật liệu cho nhân dân của các bạn."
 central.60.a.tt:0 "Trong §Y10 năm§! tới, chúng ta sẽ có thể ban hành quyết định §Y$decision_crystalline_architecture$§!."
 central.60.b:0 "Chúng tôi không có dư dả để chia sẻ."

 central.61.desc:0 "Chúng tôi rất vui khi biết các bạn sẵn lòng giúp đỡ. Chúng tôi sẽ cử một phái đoàn kỹ sư $NAME_Central_Crystal_Species$ đến hỗ trợ các dự án xây dựng của các bạn để đền đáp.\n\n$central.quest.transmission.end$"

 central.62.desc:0 "Chúng tôi rất tiếc khi biết các bạn không thể giúp đỡ. Chúng tôi sẽ cố gắng tự mình xoay sở.\n\n$central.quest.transmission.end$"

 central.70.desc:0 "Một trong những nhà khoa học hàng đầu của chúng tôi đặc biệt quan tâm đến phương pháp nghiên cứu của đế chế các bạn và bày tỏ nguyện vọng muốn phục vụ dưới trướng của các bạn. Các bạn có sẵn lòng tiếp nhận họ không?"
 central.70.a:0 "Chúng tôi có một vị trí rất phù hợp cho họ."
 central.70.a.tt:0 "Một §YNhà Khoa Học§! §H$NAME_Central_Crystal_Species$§! sẽ gia nhập đội ngũ lãnh tụ của §Y[Root.GetName]§!."
 central.70.b:0 "Hiện tại chúng tôi không có vị trí nào trống cho họ."

 central.71.desc:0 "Tin tuyệt vời. Hy vọng họ sẽ mang lại nhiều đóng góp hữu ích cho các dự án nghiên cứu của các bạn.\n\n$central.quest.transmission.end$"

 central.72.desc:0 "Họ sẽ đơn giản là phải tìm việc khác để bận rộn thôi.\n\n$central.quest.transmission.end$"

 colony.9000.name:0 "Mặt Đất Rung Chuyển"
 colony.9000.desc:0 "Thuộc địa của chúng ta trên [Root.GetName] vừa gặp phải một hiện tượng địa chất kỳ lạ: những hòn đảo ngoài khơi dường như đang §Ytự di chuyển§!. Các báo cáo ban đầu cho thấy những khối đất này thực chất là các sinh vật sống khổng lồ."
 colony.9000.a:0 "Tiếp tục theo dõi."
 colony.9000.a.turtle:0 "Chúng trông có vẻ... quen thuộc."

 colony.9005.name:0 "Một Phát Hiện Táo Bạo"
 colony.9005.desc:0 "Khi thuộc địa của chúng ta trên [Root.GetName] ngày càng phát triển, những thanh niên của loài [Root.Owner.GetSpeciesNamePlural] đã bắt đầu biến những sinh vật khổng lồ này thành một trò tiêu khiển mạo hiểm: họ trèo lên mai của chúng và xây dựng các căn lều tạm bợ ngay trên lưng sinh vật."
 colony.9005.desc.gestalt:0 "Trong khi thuộc địa của chúng ta trên [Root.GetName] đang phát triển phồn thịnh, các đơn vị drone nhận thấy các sinh vật khổng lồ này có cấu trúc sinh học đặc biệt ổn định, có thể được khai thác làm nền tảng mở rộng thêm không gian sống cho loài [Root.Owner.GetSpeciesNamePlural]."
 colony.9005.a:0 "Cần phải có hành động cụ thể."
 colony.9005.b:0 "Cứ để giới trẻ vui đùa."
 colony.9005.b.gestalt:0 "Chúng ta sẽ tránh làm kinh động thêm các sinh vật này."

 colony.9010.name:0 "Lực Lượng Đặc Nhiệm Nemma"
 colony.9010.desc:0 "Sau khi giao nhiệm vụ cho các nhà sinh học và kỹ sư giỏi nhất của chúng ta nghiên cứu các sinh vật Nemma trên [Root.GetName], họ đã đệ trình bốn phương án hành động chính."
 colony.9010.a:0 "Nhân giống thêm Nemma và bảo vệ chúng để có thêm không gian sinh sống."
 colony.9010.b:0 "Nô dịch loài Nemma để biến chúng thành những quái thú thuần phục."
 colony.9010.c:0 "Đủ rồi! Hãy gây mê lũ Nemma và bắt đầu khoan vào mai của chúng."
 colony.9010.d:0 "Tận diệt lũ sinh vật này."

 colony.9015.name:0 "Mở Rộng Quần Đảo"
 colony.9015.desc:0 "Sau các thử nghiệm ban đầu với cá thể trưởng thành, các nhà sinh học của chúng ta khẳng định rằng hoàn toàn có thể kích thích loài Nemma sinh sản để tạo ra các hòn đảo sống mới trên [Root.GetName], mở rộng đáng kể diện tích đất đai cho người dân."
 colony.9015.a:0 "Tốt nhất là chúng ta nên bắt đầu nhân giống ngay!"

 colony.9020.name:0 "Phép Màu Của Sự Sống"
 colony.9020.desc:0 "Chương trình nhân giống của chúng ta trên [Root.GetName] đã đơm hoa kết trái! Một cá thể Nemma non nớt khỏe mạnh đã chào đời và đang nhanh chóng phát triển kích thước giữa đại dương."
 colony.9020.desc.full:0 "$colony.9020.desc$\n\nTuy nhiên, đây sẽ phải là cá thể cuối cùng; đại dương của thế giới này không thể chịu tải thêm bất kỳ sinh vật khổng lồ nào nữa."
 colony.9020.a:0 "Thật tuyệt vời! Hãy bắt đầu nhân giống thêm một con nữa!"
 colony.9020.b:0 "Mọi người đã làm việc rất xuất sắc."
 colony.9020.b.gestalt:0 "Đây là một kết thúc mỹ mãn cho dự án."

 colony.9025.name:0 "Quá Tải Dân Số"
 colony.9025.desc:0 "Đáng buồn thay, nỗ lực gần đây nhất nhằm bổ sung thêm một cá thể Nemma vào [Root.GetName] đã thất bại do áp lực môi trường quá lớn. Các [Root.Owner.GetScientistPlural] của chúng ta khuyến cáo nên tạm dừng việc nhân giống."
 colony.9025.a:0 "Hãy thử lại lần nữa."

 colony.9030.name:0 "Cưỡng Chế Phục Tùng"
 colony.9030.desc:0 "Các [Root.Owner.GetScientistPlural] kỹ thuật sinh học ngoại tinh của chúng ta đã cấy ghép thành công các vi mạch điều khiển thần kinh vào loài Nemma. Giờ đây, những gã khổng lồ này hoàn toàn ngoan ngoãn tuân theo mọi mệnh lệnh."
 colony.9030.a:0 "Làm tốt lắm, giờ thì công việc thực sự có thể bắt đầu."

 colony.9035.name:0 "Những Kẻ Bảo Vệ Nemma"
 colony.9035.desc:0 "Hôm nay, các cuộc bạo động đã nổ ra trên [Root.GetName] khi một bộ phận cư dân kịch liệt phản đối việc nô dịch và khoan đục vào cơ thể loài Nemma hiền lành."
 colony.9035.a:0 "Chuyển sang chương trình nhân giống thay vì nô dịch."
 colony.9035.b:0 "Bắt giữ những kẻ kích động và đưa họ đi lao động xử lý rác thải."

 colony.9040.name:0 "Khai Thác Lớp Vỏ"
 colony.9040.desc:0 "Các kỹ sư và nhà hóa sinh của chúng ta đã làm nên điều kỳ diệu! Nhờ các chất gây tê liều cao, các giàn khoan có thể liên tục thu hoạch khoáng sản quý từ lớp mai đá của Nemma mà không làm chết sinh vật."

 colony.9045.name:0 "Tận Diệt Lũ Bò Sát Khổng Lồ"
 colony.9045.desc:0 "Chiến dịch thanh trừng loài Nemma trên [Root.GetName] đã hoàn tất - tất cả các cá thể đã bị tiêu diệt và xác của chúng đang được trục vớt làm phân bón."
 colony.9045.a:0 "Cách duy nhất để đối phó với những con thú vô tri này."

 colony.9950.name: "Các Lỗ Phun Bình Lưu"
 colony.9950.desc: "Khi các nỗ lực thuộc địa hóa quan trọng trên §Y[planet.GetName]§! đã hoàn tất, sự chú ý của chính quyền [Root.Owner.GetName] đã chuyển sang các lỗ phun khí quyển bất thường được các [Owner.GetScientistPlural] ghi nhận trước đây."
 colony.9950.a: "Nghiên cứu các lỗ phun khí."
 colony.9950.b: "Không có thời gian cho việc này."

 colony.9955.name: "Đã Nghiên Cứu Các Lỗ Phun Bình Lưu"
 colony.9955.desc: "Chúng ta đã xác định rằng các lỗ phun trên §Y[planet.GetName]§! thải ra những luồng khí hiếm vô cùng độc đáo, vừa có giá trị nghiên cứu khoa học vừa có tiềm năng kinh tế to lớn."
 colony.9955.a: "Khai thác cho du lịch và nghiên cứu."
 colony.9955.b: "Chuyển hướng sang tinh chế tài nguyên."

 colony.9960.name: "Nền Tảng Quan Sát Lỗ Phun Bình Lưu"
 colony.9960.desc: "Những cơ hội du lịch độc nhất vô nhị trên §Y[planet.GetName]§! đã thu hút sự chú ý của nhiều tập đoàn giải trí. Họ đề xuất xây dựng các đài quan sát lơ lửng trên tầng bình lưu."
 colony.9960.a: "Xây dựng các đài quan sát."
 colony.9960.b: "Tài nguyên cần được sử dụng ở nơi khác."

 colony.9965.name: "Mở Rộng Lỗ Phun Bình Lưu"
 colony.9965.desc: "Các kỹ sư của chúng ta gợi ý rằng các túi khí ngầm bên dưới §Y[Planet.GetName]§! có thể được giải phóng bằng các khối bộc phá kiểm soát, gia tăng đáng kể sản lượng khí khai thác."
 colony.9965.a: "Kích nổ bộc phá!"
 colony.9965.b: "Rủi ro là quá lớn."
 colony.9965.c: "Hiệp hội sẽ xử lý việc này."

 colony.9970.name: "Mở Rộng Lỗ Phun Thành Công"
 colony.9970.desc: "Dự án mở rộng lỗ phun khí trên §Y[planet.GetName]§! đã thành công rực rỡ! Sản lượng khí quý hiếm tuôn trào lên tầng bình lưu đã vượt xa mọi dự toán ban đầu."

 colony.9975.name: "Mở Rộng Lỗ Phun Thất Bại"
 colony.9975.desc: "Những tính toán sai lầm trong việc định lượng bộc phá đã khiến nhiều lỗ phun bị sụp đổ hoàn toàn, làm chôn vùi vĩnh viễn các túi khí bên dưới những tầng đá nát vụn."

 nemma_world_chain_title: "Thế Giới Nemma"
 nemma_world_chain_desc: "Loài Nemma khổng lồ sinh sống trên một trong những thế giới của chúng ta và chúng ta phải quyết định cách thức tốt nhất để tương tác với các sinh vật này."

 stratovent_researcher: "$job_stratovent_researcher$"
