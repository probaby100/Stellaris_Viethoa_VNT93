 INFILTRATION_LEVEL_DELAYED_BODY:0 "§E§YMức độ Xâm nhập§! quyết định loại chiến dịch nào mà mạng lưới tình báo hiện tại có thể thực hiện, đồng thời làm tăng §Ythông tin tình báo§! mà chúng ta có về đế chế này.\n\nKhi Mức độ Xâm nhập tăng lên, các đặc vụ của bạn sẽ mất nhiều thời gian hơn để mở rộng mạng lưới tình báo.§!"
