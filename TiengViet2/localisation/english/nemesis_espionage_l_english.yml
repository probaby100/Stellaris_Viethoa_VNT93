 galcom_movement_pacifist:0 "Phong trào Chống Phổ biến Phản Vật chất"
 galcom_movement_egalitarian:0 "Ân xá Liên sao"
 galcom_movement_authoritarian:0 "Tổ chức Công dân Tuân thủ Pháp luật"
 galcom_movement_spiritualist:0 "Tổ chức Thần học Toàn năng"
 galcom_movement_materialist:0 "Tổ chức Thúc đẩy Kinh tế Thẩm thấu"

 envoy_events.205.name:0 "Lỗi lầm của Đại sứ"
 envoy_events.205.desc:1 "[envoy_country.GetSpeciesNamePlural] bày tỏ sự không hài lòng sâu sắc đối với những hành động của [event_envoy.GetAmbassadorOrNot] phe ta, [event_envoy.GetName], tại [event_envoy.GetEnvoyLocation]. Rõ ràng, những hành vi của [event_envoy.GetHerHis] đã xúc phạm [envoy_country.GetSpeciesNamePlural] ở địa phương, khiến các cơ quan chính phủ phải cử vệ sĩ để bảo vệ sự an toàn cá nhân cho [event_envoy.GetHerHis]. Do chúng ta không có tính đa sầu đa cảm giống như [envoy_country.GetAdj], nên không rõ [event_envoy.GetSheHe] đã làm gì, nhưng đã có vô số các cuộc biểu tình chống lại [event_envoy.GetHerHim] cũng như chống lại \"sự kiêu ngạo vô lối của [Root.GetAdj]\" ở nơi mà [event_envoy.GetSheHe] dự kiến sẽ diễn thuyết.\n\n[envoy_country.GetName] yêu cầu phe ta phải triệu hồi [event_envoy.GetName] và cử một Đại sứ mới thay thế vị trí của [event_envoy.GetHerHis]. Họ ám chỉ rằng nếu chúng ta từ chối, hậu quả ngoại giao là điều khó tránh khỏi."
 envoy_events.205.A:0 "[event_envoy.GetSheHeCap] nên ở lại."
 envoy_events.205.A.xenophobe:0 "Tính giả tạo của lũ người ngoài hành tinh chẳng liên quan gì đến chúng ta cả."

