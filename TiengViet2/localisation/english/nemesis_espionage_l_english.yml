 tech_planetary_infrastructure_1_wilderness_desc:0 "$tech_planetary_infrastructure_1_desc$"
 tech_planetary_infrastructure_1_nomads:0 "$tech_planetary_infrastructure_1$"
 tech_planetary_infrastructure_1_nomads_desc:0 "$tech_planetary_infrastructure_1_desc$"
 tech_planetary_infrastructure_2:0 "Cơ sở hạ tầng Durasteel"
 tech_planetary_infrastructure_2_desc:0 "Sự phát triển của luyện kim học cho phép chúng ta chế tạo những cấu trúc lớn hơn và bền hơn, từ đó cải thiện đáng kể cơ sở hạ tầng của thuộc địa."
