 tech_planetary_infrastructure_2_nomads_desc:0 "$tech_planetary_infrastructure_2_desc$"
 tech_capital_productivity_1:0 "Cải thiện Sản xuất"
 tech_capital_productivity_1_desc:0 "Khi hành tinh của chúng ta ngày càng phát triển, sản lượng cũng đã tăng lên đáng kể."
 tech_capital_productivity_1_effect:0 "Công trình Thủ phủ:\n   $MOD_POP_BONUS_WORKFORCE_MULT$: §G+10%§!"
 tech_capital_productivity_2:0 "Hiệu ứng Quy mô"
 tech_capital_productivity_2_desc:0 "Mật độ dân số tăng lên tạo cơ hội cho chúng ta cải thiện năng suất hơn nữa."
 tech_capital_productivity_2_effect:0 "Công trình Thủ phủ Nâng cấp:\n   $MOD_POP_BONUS_WORKFORCE_MULT$: §G+20%§!"
 tech_capital_productivity_3:0 "Tối đa hóa Năng suất"
 tech_capital_productivity_3_desc:0 "Sự tiến bộ không ngừng của công nghệ đã đưa những hành tinh phát triển nhất của chúng ta đạt đến mức năng suất chưa từng có."
 tech_capital_productivity_3_effect:0 "Công trình Thủ phủ Chính:\n   $MOD_POP_BONUS_WORKFORCE_MULT$: §G+30%§!"

 edict_enhanced_surveillance:0 "Tăng cường Giám sát"
 edict_enhanced_surveillance_desc:0 "Những mối đe dọa đáng sợ đang nhòm ngó, chờ đợi lúc chúng ta lơ là cảnh giác. Cần phải đầu tư nhiều nguồn lực hơn cho cơ quan an ninh mật nội bộ để tự bảo vệ tốt hơn."
 edict_bureau_of_espionage:0 "Cục Điệp báo"
 edict_bureau_of_espionage_desc:0 "Việc mở rộng các hoạt động tình báo và ưu tiên phát triển công nghệ giải mã là yếu tố then chốt cho sự thịnh vượng của đế chế."
 edict_observation_instinct:0 "Bản năng Quan sát"
 edict_observation_instinct_desc:0 "Các nguồn lực bổ sung sẽ được dùng để hỗ trợ mở rộng khả năng quan sát của chúng ta."
 edict_covert_analysis_algorithm:0 "Thuật toán Phân tích Bí mật"
 edict_covert_analysis_algorithm_desc:0 "Một phần đáng kể khả năng xử lý sẽ được phân bổ cho lĩnh vực điều tra và phân tích."
 edict_tracking_implants:0 "Cấy ghép Theo dõi"
 edict_tracking_implants_desc:0 "Việc theo dõi vị trí và hành động thông qua thiết bị cấy ghép dưới da bắt buộc có thể tăng cường đáng kể an ninh nội bộ của đế chế. Những công dân trung thành không nên giấu giếm bất cứ điều gì với chính phủ."
 edict_thought_enforcement:0 "$tech_thought_enforcement$"
 edict_thought_enforcement_desc:0 "Những nhà ngoại cảm có thể theo dõi những công dân có tư tưởng sai lệch và kịp thời chấn chỉnh khi phát hiện."
 edict_thought_enforcement_effect:1 "Mã hóa: §G+1§!\nĐộ hạnh phúc: §R-10%§!\nSức hút của Hệ tư tưởng Chính thống: §G+25%§!\n$job_telepath_plural$ cung cấp §G-30§! Tội phạm"
 edict_thought_enforcement_gestalt:0 "$tech_thought_enforcement_gestalt$"
 edict_thought_enforcement_gestalt_desc:0 "Các cá thể ngoại cảm giám sát những xung động bất thường trong ý thức tập thể của chúng ta, chấn chỉnh sự sai lệch trước khi chúng trở thành ý thức."
 edict_thought_enforcement_gestalt_effect:0 "Mã hóa: §G+1§!\n$MOD_PLANET_STABILITY_ADD$: §R-5§!\n$mod_planet_jobs_upkeep_mult$: §G-10%§!\n$job_telepath_drone_plural$ cung cấp §G-30§! $MOD_PLANET_CRIME_NO_HAPPINESS_ADD$"

 edict_synaptic_reinforcement:0 "Gia cố Khớp thần kinh"
 edict_synaptic_reinforcement_desc:0 "Bằng cách gia tăng các kết nối khớp thần kinh của cá thể bảo trì, khả năng hỗ trợ cho các cá thể xung quanh của chúng sẽ được tăng cường."
 edict_synaptic_reinforcement_tooltip:0 "Mỗi §Y$building_hive_node$§! sẽ nhận được 1 vị trí §Y[maintenance_drone.GetName]§!, nhưng phí duy trì sẽ tăng thêm £energy£§R+2§!."
 edict_industrial_maintenance:0 "Bảo trì Công nghiệp"
 edict_industrial_maintenance_desc:0 "Cá thể bảo trì công nghiệp được ủy quyền đóng vai trò quản lý các khu vực xung quanh mỗi khu công nghiệp."
 edict_industrial_maintenance_tooltip:0 "Mỗi §Y$district_industrial_plural$§! sẽ nhận được 1 vị trí §Y[maintenance_drone.GetName]§!, nhưng phí duy trì sẽ tăng thêm £energy£§R+2§!."

## Espionage Assets
 asset_header:0 "Chỉ điểm"
 asset_bureaucrat:0 "Quan liêu"
 asset_bureaucrat_desc:0 "Một kẻ quan liêu bất mãn, bị cám dỗ bởi lời hứa hão huyền về một cuộc sống tốt đẹp hơn nên đã phục vụ cho chúng ta."
 asset_clerk:0 "Nhân viên văn phòng"
 asset_clerk_desc:0 "Một nhân viên kinh doanh bình thường không hài lòng với công việc của mình, khao khát cuộc sống có chút sóng gió."
 asset_economist:0 "Nhà kinh tế học"
 asset_economist_desc:0 "Một nhà kinh tế học đã nhận hối lộ và giờ đây duy trì liên lạc thông qua việc tống tiền."
 asset_scientist:0 "Nhà khoa học"
 asset_scientist_desc:0 "Chúng ta đã đánh vào lòng kiêu hãnh của nhà khoa học này, khiến họ tin rằng đất nước của họ không coi trọng họ đúng mức."
 asset_junior_officer:0 "Sĩ quan cấp thấp"
 asset_junior_officer_desc:0 "Một sĩ quan bị cấp trên phớt lờ. Chúng ta đã cho họ sự công nhận mà họ mong muốn."
 asset_criminal_underling:0 "Tội phạm cấp thấp"
 asset_criminal_underling_desc:0 "Một tên tội phạm nhỏ bé, vô danh trong mắt những kẻ đồng cấp. Đặc vụ của chúng ta đã nhắm vào lòng tham và sự tự phụ của hắn."
 asset_attache:0 "Tùy viên"
 asset_attache_desc:0 "Một kẻ tiểu tốt, nửa vời, phục vụ cho một văn phòng nhỏ của bộ ngoại giao. Hắn sẵn sàng chia sẻ những thông tin không nên chia sẻ."
 asset_laborer:0 "Công nhân"
 asset_laborer_desc:0 "Một người bị áp bức và bóc lột nặng nề trong làn sóng nổi loạn."
 asset_hacker:0 "Tin tặc"
 asset_hacker_desc:0 "Một tin tặc siêu đẳng bị chính phủ truy nã. Hiện tại, hắn làm việc cho chúng ta để đổi lấy tiền thù lao và sự bảo vệ."
 asset_arms_smuggler:0 "Kẻ buôn lậu vũ khí"
 asset_arms_smuggler_desc:0 "Một tên tội phạm chuyên kiếm nguồn hàng quân sự."
 asset_agitator:0 "Kẻ xúi giục"
 asset_agitator_desc:0 "Một người theo chủ nghĩa lạc quan ngây thơ, tin chắc rằng mình có thể làm cho thế giới tốt đẹp hơn. Chỉ cần ủng hộ quan điểm của họ là có thể dễ dàng kiểm soát họ."
 asset_newscaster:0 "Phát thanh viên"
 asset_newscaster_desc:0 "Một giọng nói đầy thiện cảm trên các phương tiện truyền thông, sẵn sàng truyền bá thông điệp của chúng ta để đổi lấy thông tin."
 asset_pop_icon:0 "Ngôi sao"
 asset_pop_icon_desc:0 "Một ngôi sao giải trí đã hết thời, giờ đây sẵn sàng làm bất cứ điều gì để trở lại dưới ánh đèn sân khấu."
 asset_academic:0 "Học giả"
 asset_academic_desc:0 "Một học giả bị ô nhục đang tìm cách chuộc lại danh tiếng của mình."
 asset_veteran:0 "Cựu chiến binh"
 asset_veteran_desc:0 "Một cựu chiến binh bị thương, sa lầy trong sự thoái thác của bộ máy quan liêu. Chúng ta đến để giúp đỡ họ."
 asset_internal_organs:0 "Cơ quan nội tạng"
 asset_internal_organs_desc:0 "Nếu có thể tiến hành giải phẫu đối thủ và có được dữ liệu chức năng trực tiếp, điều này sẽ mang lại lợi ích về mọi mặt cho các chiến dịch điệp báo của chúng ta."

 asset_synapse_drone:0 "Cá thể khớp thần kinh"
 asset_synapse_drone_desc:0 "Đặc vụ có thể sử dụng cá thể khớp thần kinh bất thường này để tiếp nhận suy nghĩ của ý thức tổ ong."
 asset_ephapse_relay:0 "Chất dẫn truyền khớp thần kinh"
 asset_ephapse_relay_desc:0 "Chất dẫn truyền khớp thần kinh dị dạng này có thể được sử dụng để thay đổi thông tin mà tổ ong nhận được."
 asset_labor_drone:0 "Cá thể lao động"
 asset_labor_drone_desc:0 "Việc chỉnh sửa cá thể này cho phép người điều khiển của chúng ta ra những lệnh đơn giản cho nó."
 asset_research_drone:0 "Cá thể nghiên cứu"
 asset_research_drone_desc:0 "Một đột biến nhỏ khiến kết nối của cá thể nghiên cứu này với ý thức bầy đàn trở nên kém an toàn hơn bao giờ hết."
 asset_warrior_drone:0 "Cá thể chiến đấu"
 asset_warrior_drone_desc:0 "Đặc vụ của chúng ta đã tìm ra cách ra lệnh cho cá thể chiến đấu này phục vụ cho chúng ta."
 asset_behavioral_regulator:0 "Bộ điều chỉnh hành vi"
 asset_behavioral_regulator_desc:0 "Là một phần của hệ thống phòng thủ ý thức tổ ong, cá thể này có thể nhận diện những cá thể bất thường và tiêu diệt chúng. Tuy nhiên, cá thể này hiện đã nằm trong sự kiểm soát của chúng ta."
 asset_pheromone_emitter:0 "Máy phát pheromone"
 asset_pheromone_emitter_desc:0 "Máy phát pheromone này sẽ ảnh hưởng đến tất cả các cá thể xung quanh."
 asset_resource_distribution_node:0 "Nút phân phối tài nguyên"
 asset_resource_distribution_node_desc:0 "Việc phân bổ tài nguyên của ý thức tổ ong được xử lý bởi một mạng lưới gồm các nút phân phối tài nguyên."
 asset_cortex_node:0 "Nút vỏ não"
 asset_cortex_node_desc:0 "Là kho lưu trữ dữ liệu của tổ ong, việc kiểm soát một nút vỏ não cho phép đặc vụ của chúng ta đánh cắp hoặc sửa đổi dữ liệu."
 asset_subspace_tendril:0 "Xúc tu không gian con"
 asset_subspace_tendril_desc:0 "Khi hạm đội của tổ ong di chuyển giữa các vì sao, những xúc tu này được sử dụng để giao tiếp với nhau."

 asset_coordination_system:0 "Hệ thống phối hợp"
 asset_coordination_system_desc:0 "Hệ thống này đóng vai trò trung gian giữa các nút chính của hành tinh và các cá thể [coordinator.GetName] trong khu vực."
 asset_engagement_protocol:0 "Giao thức tiếp xúc"
 asset_engagement_protocol_desc:0 "Hầu hết các liên lạc với trí thông minh khác đều được hệ thống này xử lý."
 asset_logistics_system:0 "Hệ thống hậu cần"
 asset_logistics_system_desc:0 "Thông qua hệ thống hậu cần, có thể theo dõi tài nguyên của địa phương."
 asset_research_database:0 "Cơ sở dữ liệu nghiên cứu"
 asset_research_database_desc:0 "Cơ sở dữ liệu này theo dõi tiến độ và nhu cầu của các cơ sở nghiên cứu trên một hành tinh."
 asset_war_algorithm:0 "Thuật toán chiến tranh"
 asset_war_algorithm_desc:0 "Hệ thống này chứa các kế hoạch tác chiến và mô phỏng vô số cuộc xung đột tiềm tàng tại các khu vực cục bộ."
 asset_command_relay:0 "Trạm tiếp sóng chỉ huy"
 asset_command_relay_desc:0 "Một trạm tiếp sóng chuyển tiếp lệnh từ các hệ thống khác đến các thiết bị không người lái trong một khu vực nhất định."
 asset_dispatch_uplink:0 "Đường truyền đường lên phân phối"
 asset_dispatch_uplink_desc:0 "Đường truyền lên này được sử dụng để truyền lệnh giữa các nút ở khoảng cách xa."
 asset_resource_pylon:0 "Tháp tài nguyên"
 asset_resource_pylon_desc:0 "Tài nguyên tập trung tại các tháp này để phân phối."
 asset_memory_cache:0 "Bộ nhớ đệm"
 asset_memory_cache_desc:0 "Dữ liệu nghiên cứu của địa phương được lưu trữ trong các hệ thống này trước khi truyền đến cơ quan tình báo chính."
 asset_weapons_platform:0 "Nền tảng vũ khí"
 asset_weapons_platform_desc:0 "Đặc vụ của chúng ta đã tìm ra một điểm yếu, cho phép họ kiểm soát một phần trận địa vũ khí phòng thủ."

