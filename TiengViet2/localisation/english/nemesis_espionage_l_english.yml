 gestalts_are_boring:0 "[This.GetName] thiếu tính cách để có thể vướng vào bê bối"
 saturated_with_scandals:2 "$TRIGGER_FAIL$ [Root.Target.GetName] đã bị bủa vây bởi các vụ bê bối.\nChúng ta cần phải đợi thêm §Y[Root.operation_diplomatic_incident_timer]§! để thử lại"

 envoy_events.225.name:0 "Bê bối Tình ái"
 envoy_events.225.desc:0 "Đoàn ngoại giao của [Root.GetAdj] vô cùng sốc khi nghe những tin tức mới nhất từ [scandal_empire.GetName]. [event_envoy.GetAmbassadorOrNot][event_envoy.GetName], người vẫn luôn làm nhiệm vụ ở địa phương, đã khiến [event_envoy.GetHerselfHimself] vướng vào rắc rối pháp lý nghiêm trọng với [scandal_empire.GetAdj]. [event_envoy.GetSheHeCap] hiện đang dính líu vào một vụ bê bối tình ái, liên quan đến một loạt các tội ác cực kỳ nghiêm trọng, thậm chí còn liên quan đến một vụ giết người tàn bạo.\n\nCùng với những diễn biến của sự việc — và dĩ nhiên là những tin đồn đang lan truyền rộng rãi trong cộng đồng [scandal_empire.GetSpeciesNamePlural] — có vẻ như tội ác của [event_envoy.GetName] là không thể chối cãi. Chính quyền [scandal_empire.GetAdj] đang yêu cầu tước quyền miễn trừ ngoại giao của [event_envoy.GetHerHis] để [event_envoy.GetSheHe] có thể bị xét xử trước pháp luật và công lý vì những gì [event_envoy.GetHerHis] đã gây ra."
 envoy_events.225.A:0 "Tước quyền miễn trừ."
 envoy_events.225.A.tooltip:0 "§Y[event_envoy.GetName]§! sẽ bị xóa khỏi §H$RECRUITABLE_LEADERS$§! của chúng ta."
 envoy_events.225.B:0 "Triệu hồi [event_envoy.GetName] vì sự an toàn của [event_envoy.GetHerHis]."
 opinion_envoy_murder_scandal:0 "Bao che cho kẻ giết người"

 envoy_events.230.name:0 "[Root.GetName] bị bắt giữ"
 envoy_events.230.desc:0 "Ngay khi vừa bước vào [Root.envoy_location_country.GetName], Đại sứ [Root.GetName] đã bị bắt giữ vì vô số các hành vi vi phạm pháp luật. Công văn của [Root.envoy_location_country.GetAdj] rất súc tích: \"Chúng tôi cảm ơn các vị vì đã giao nộp tội phạm, công lý sẽ được thực thi.\""
 envoy_events.230.A:0 "Cứ vậy đi."

 operation.8200.name:0 "Tìm kiếm Mục tiêu"
 operation.8200.desc:0 "Đặc vụ của chúng ta đang đầu tư vào một số nhân vật ngoại giao chủ chốt tại §H[Root.Target.GetName]§! với hy vọng tìm ra điểm yếu để sử dụng cho tương lai."
 operation.8205.name:1 "Đào sâu vào Bê bối"
 operation.8205.desc:0 "Trong bộ máy quan liêu ngoại giao của §H[Root.Target.GetAdj]§!, chúng ta đã lọc ra được một vài cá thể có tiềm năng dính líu tới bê bối. Chúng ta đã phát hiện ra bê bối tiềm ẩn của một số cá thể trong đó, và đặc vụ của chúng ta đang dốc toàn lực để đảm bảo mọi chuyện sẽ đi theo đúng hướng mà chúng ta mong muốn."
 operation.8210.name:0 "Cập nhật: Chiến dịch [This.GetName]"
 operation.8210.desc:0 "Đã xác định được mục tiêu phù hợp cho §HChiến dịch [This.GetName]§! và lập một bộ hồ sơ chi tiết. Đặc vụ của chúng ta đang túc trực chờ lệnh, sẵn sàng tung hê bê bối bất cứ lúc nào."
 operation.8210.desc.no_go:0 "Đặc vụ của chúng ta tại §H[Root.Target.GetName]§! báo về một tin xấu: hiện tại họ không thể chọn được mục tiêu phù hợp cho §HChiến dịch [This.GetName]§!. Có vẻ như [Root.Target.GetGovernmentName] có sức chịu đựng bê bối vô cùng lớn, bất cứ vết nhơ nào mà chúng ta đào bới được đều chẳng thể gây ra sự chú ý gì trong công chúng."
 operation.8225.name:0 "Sự cao cả và Trong sạch"
 operation.8225.desc:0 "Đặc vụ của chúng ta tại §H[Root.Target.GetName]§! đã mang về tin xấu: mặc dù đã chuẩn bị kỹ lưỡng mọi bề, nhưng mục tiêu trọng điểm của họ lại không hề cắn câu, vì thế họ cũng chẳng có cách nào dựng lên vụ bê bối nào. Dù nghe có vẻ khó tin, nhưng phái đoàn ngoại giao [Root.Target.GetAdj] thật sự chẳng có lấy một vết nhơ nào để có thể soi mói."
 operation.8230.name:0 "Bê bối do chính tay ta gây ra"
 operation.8230.desc.base:0 "Đặc vụ của chúng ta tại §H[Root.Target.GetName]§! đã báo cáo, §HChiến dịch [This.GetName]§! đã đạt được những thành công rực rỡ:"
 operation.8230.desc.salacious_affair:0 "$operation.8230.desc.base$ Qua một chiến dịch mạo hiểm, chúng ta đã gài bẫy một trong những Đặc phái viên của đối phương đang đóng quân tại §H[offended_party.GetName]§!, khiến cho hắn bị vướng vào vô vàn tội danh. Sự việc này đã làm cho họ cảm thấy cực kỳ mất mặt, đồng thời đẩy mối quan hệ của họ với [offended_party.GetSpeciesNamePlural] vào thế rất căng thẳng. Kết quả là, §Hvị thế ngoại giao§! của đất nước này đã bị lung lay."
 operation.8230.desc.salacious_affair_self:0 "$operation.8230.desc.base$ Qua một chiến dịch mạo hiểm, chúng ta đã khiến cho một trong những Đặc phái viên của đối phương đang đóng quân tại §HĐế chế của chúng ta§! bị vướng vào một loạt các tội danh vô cùng nghiêm trọng. Sự việc này đã làm cho họ cực kỳ bẽ mặt, và sự phẫn nộ giả tạo của chúng ta lại càng đổ thêm dầu vào lửa cho sự mất mặt đó. Kết quả là, §Hvị thế ngoại giao§! của đất nước này đã bị lung lay."
 operation.8230.desc.insulting_envoy:0 "$operation.8230.desc.base$ Bằng một vài thao tác khéo léo, chúng ta đã thành công bôi nhọ mối quan hệ giữa [Root.Target.GetAdj] với §H[offended_party.GetName]§!. Một trong những Đặc phái viên của họ đã rơi vào cái bẫy mà chúng ta đã giăng sẵn, vô tình nói ra những nhận xét thật lòng của họ về đồng nghiệp, khiến cho dư luận vô cùng khinh bỉ. Kết quả là, §Hvị thế ngoại giao§! của đất nước này đã bị lung lay."
 operation.8230.desc.insulting_envoy_self:0 "$operation.8230.desc.base$ Bằng một vài thao tác khéo léo, chúng ta đã thành công bôi nhọ mối quan hệ giữa [Root.Target.GetAdj] với §Hchính đất nước chúng ta§!. Một Đặc phái viên của họ đã sập bẫy do chúng ta giăng ra, và vô tình nói ra những suy nghĩ của mình về các nhà ngoại giao nước ta - một điều mà dư luận cho là vô cùng thiếu khôn ngoan. Kết quả là, §Hvị thế ngoại giao§! của [Root.Target.GetAdj] đã bị lung lay."
 operation.8230.desc.galactic_comedy:0 "$operation.8230.desc.base$ Bằng cách công khai việc che giấu tội lỗi của một Đặc phái viên nào đó, chúng ta đã thành công đẩy họ vào tình cảnh mất mặt chưa từng có. Kết quả là, §Hvị thế ngoại giao§! của đất nước này đã bị lung lay."
 operation.8230.desc.lobbying:1 "$operation.8230.desc.base$ Chúng ta đã thành công phanh phui một vụ bê bối vận động hành lang. Bằng một lá đơn tố cáo nặc danh, chúng ta đã vạch trần việc một Đặc phái viên của họ làm việc tại Cộng đồng Ngân hà đã nhận hối lộ để lên tiếng ủng hộ cho §H[Root.Target.GetOppositionGalcomLobbyists]§!, tổ chức có lợi ích đi ngược hoàn toàn với [Root.Target.GetAdj]. Kết quả là, §Hvị thế ngoại giao§! của đất nước này đã bị lung lay."
 operation.8230.desc.elope:0 "$operation.8230.desc.base$ Có vẻ như một trong những Đặc phái viên của họ đã phải lòng một người ngoài hành tinh - một tội lỗi tày đình đối với giống loài đó. Bằng cách dẫn dắt khéo léo, chúng ta đã giúp hắn qua mặt được lực lượng an ninh của [Root.Target.GetAdj], đồng thời thuyết phục hắn thành công việc bỏ trốn cùng với bạn tình đến một xã hội cởi mở và bao dung hơn.\n\nSự việc này đã gây ra hàng loạt §Hsự nghi ngờ đầy khó chịu§! trong công chúng, đồng thời đẩy [Root.Target.GetGovernmentName] vào một tình thế ngoại giao vô cùng khó khăn."
 operation.8230.desc.wayward:0 "$operation.8230.desc.base$ Bằng vài lời thuyết phục nhẹ nhàng và sử dụng thiết bị ghi âm một cách tinh vi, chúng ta đã thành công phanh phui việc một trong những Đặc phái viên của họ đã đi chệch xa các tiêu chuẩn do [Root.Target.GetAdj] đề ra đến mức nào.\n\nSự việc này đã dấy lên hàng loạt §Hsự nghi ngờ đầy khó chịu§! trong công chúng, và khiến cho vị thế ngoại giao của [Root.Target.GetAdj] trở nên vô cùng khó khăn."
 operation.8230.desc.substances:0 "$operation.8230.desc.base$ Hành vi lạm dụng chất kích thích của một Đặc phái viên của họ đã bị phanh phui, khiến cho những tay trùm ma túy khét tiếng có cơ hội gây ảnh hưởng không đáng có đến khả năng ra quyết định của họ. Kết quả là, §Hvị thế ngoại giao§! của đất nước này đã bị lung lay."
 diplo_incident_succeeded:0 "Uy tín của đoàn ngoại giao §Y[Root.Target.GetName]§! đã bị vỡ vụn."

 envoy_events.210.name:0 "Nhập gia tùy tục"
 envoy_events.210.desc.start:0 "[event_envoy.GetName], Đặc phái viên mà chúng ta cử đến [envoy_country.GetName], có vẻ như đã bị họ đồng hóa đôi chút."
 envoy_events.210.desc.end:0 "Sự việc này đã thúc đẩy kiến nghị triệu hồi [event_envoy.GetHerHim], để [event_envoy.GetSheHe] có thể quay trở lại với những chuẩn mực hành vi chính thống của [Root.GetAdj]. Tuy nhiên, một luồng ý kiến khác lại cho rằng, việc có một nhân viên ngoại giao có khả năng thấu hiểu đối thủ khác biệt hoàn toàn với chúng ta sẽ mang lại lợi thế trong những tình huống ngoại giao căng thẳng."
 envoy_events.210.desc.authoritarian:0 "$envoy_events.210.desc.start$ Trong vài tháng qua, [event_envoy.GetSheHe] thường xuyên bày tỏ sự tán dương đối với thể chế nhà nước của [envoy_country.GetAdj], hoàn toàn đối lập với sự cứng nhắc và thiếu tự do của [Root.GetGovernmentName].\n\"Tôi đã tận mắt chứng kiến chính phủ của họ luôn lắng nghe tiếng nói của nhân dân,\" theo nguồn tin, [event_envoy.GetSheHe] gần đây có nói. \"Trên thực tế, bản thân tôi khó có thể tưởng tượng ra một thể chế nào tốt hơn thế.\"\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.egalitarian:0 "$envoy_events.210.desc.start$ Trong vài tháng qua, [event_envoy.GetSheHe] thường xuyên bày tỏ sự tán dương đối với thể chế nhà nước của [envoy_country.GetAdj], hoàn toàn đối lập với sự thiếu quyết đoán của [Root.GetGovernmentName].\n\"Nếu cái giá của một chính phủ hoạt động hiệu quả chỉ là một chút tự do nhỏ nhoi, thì có lẽ cái giá đó là có thể chấp nhận được,\" theo nguồn tin, [event_envoy.GetSheHe] gần đây có nói như vậy.\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.xenophile:0 "$envoy_events.210.desc.start$ Kỳ lạ thay, [event_envoy.GetSheHe] đã tiếp nhận sự thiếu tin tưởng của [envoy_country.GetAdj] đối với người ngoài hành tinh, và kêu gọi áp dụng các biện pháp ngăn chặn sự lạm dụng lòng hiếu khách đối với các giống loài khác của [Root.GetAdj]. Khi bị chất vấn, [event_envoy.GetSheHe] đã trả lời rằng, sau khi nhìn thấy những lợi ích của một xã hội trật tự tại [envoy_country.Capital.GetName], việc phải quay trở lại [Root.Capital.GetName] hỗn loạn và vô pháp vô thiên thực sự là một điều khó khăn.\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.xenophobe:0 "$envoy_events.210.desc.start$ [event_envoy.GetSheHe] đã vứt bỏ sự thiếu tin tưởng của [Root.GetAdj] đối với người ngoài hành tinh, và bằng cách tham gia điên cuồng vào các buổi tiệc tùng của [envoy_country.GetSpeciesNamePlural] để thỏa mãn ham muốn nhục dục nguyên thủy của [event_envoy.GetHerHis]. Khi bị chất vấn, [event_envoy.GetSheHe] đã trả lời:\n\"Làm sao tôi có thể từ chối những [envoy_country.GetSpeciesNamePluralCompliment] [envoy_country.GetSpeciesAdj] vô cùng xinh đẹp được chứ?\"\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.materialist:0 "$envoy_events.210.desc.start$ Đáng lo ngại thay, [event_envoy.GetSheHeCap] dường như đã tiếp nhận chủ nghĩa duy tâm của [envoy_country.GetAdj], và gạt bỏ sự hoài nghi của [Root.GetAdj] đối với những thứ đó. Khi bị chất vấn, [event_envoy.GetSheHe] đã biện minh:\n\"Khi Thần dụ đã hiển thị cho tôi, làm sao tôi có thể nghi ngờ nó được?\"\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.spiritualist:0 "$envoy_events.210.desc.start$ [event_envoy.GetSheHeCap] dường như đã khinh miệt niềm tin của người dân chúng ta đối với các vấn đề thần thánh, và ngày càng tán thành hệ tư tưởng của [envoy_country.GetAdj], bao gồm việc tích lũy tài sản cá nhân và cho phép trí tuệ nhân tạo được tự do, v.v. Khi bị chất vấn, [event_envoy.GetSheHe] đã phản bác lại:\n\"[Root.GetName] của chúng ta đã đắm chìm trong quá khứ quá lâu rồi, đã đến lúc phải dang rộng vòng tay đón lấy tương lai.\"\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.pacifist:0 "$envoy_events.210.desc.start$ [event_envoy.GetSheHe] đã vứt bỏ chủ nghĩa hòa bình của [Root.GetAdj], và trở thành người ủng hộ kiên quyết cho việc tăng cường chi tiêu quân sự cũng như các chính sách ngoại giao mang tính tấn công, đồng thời công khai tán dương chủ nghĩa quân phiệt của [envoy_country.GetAdj].\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.militarist:0 "$envoy_events.210.desc.start$ Trong vài tháng qua, [event_envoy.GetSheHe] ngày càng dùng những lời lẽ chỉ trích gay gắt đối với chủ nghĩa quân phiệt của [Root.GetAdj], và tán dương cách giải quyết vấn đề \"lương thiện hơn\" của [envoy_country.GetAdj]. Khi bị chất vấn, [event_envoy.GetSheHe] đã phản bác lại:\n\"Chúng ta không thể mãi mãi đóng vai những kẻ man rợ tàn bạo trong thiên hà. Nếu muốn nhận được nhiều sự tán dương hơn từ các nền văn minh, chúng ta phải học cách kiềm chế bản năng của mình.\"\n\n$envoy_events.210.desc.end$"
 envoy_events.210.A:0 "Cứ để [event_envoy.GetSheHeCap] tiếp tục giữ vị trí của [event_envoy.GetHerHis] đi."
 faction_upset:0 "Phẫn nộ"

 envoy_events.215.name:0 "Lạm dụng Chất Kích thích"
 envoy_events.215.desc:0 "Phái đoàn đại sứ của chúng ta đã lo lắng về tình trạng công việc của [event_envoy.GetName], Đặc phái viên mà chúng ta cử đến [event_envoy.GetEnvoyLocation], trong một thời gian rồi. Và giờ đây, những bằng chứng được phơi bày cho thấy [event_envoy.GetSheHe] dường như đã trở thành một kẻ nghiện ma túy, đó là một loại thuốc từ người ngoài hành tinh có nguồn gốc từ [provider_country.GetName], và nó đã được chứng minh là cực kỳ gây nghiện đối với [Root.GetSpeciesNamePlural].\n\nMặc dù việc buôn bán loại thuốc này tại [provider_country.GetSpeciesNamePlural] là vi phạm pháp luật nghiêm trọng, nhưng thị trường chợ đen do những tay trùm ma túy tàn nhẫn điều hành lại thu về lợi nhuận khổng lồ mỗi ngày và làm ăn vô cùng phát đạt. Những tay trùm ma túy này có vẻ đã giới thiệu loại thuốc này cho [event_envoy.GetHerHim] như một loại thuốc kích dục cực mạnh, khiến [event_envoy.GetName] bị chúng đùa giỡn trong lòng bàn tay, và buộc phải răm rắp nghe lời chúng để đổi lấy thuốc thỏa mãn cơn nghiện của [event_envoy.GetHerHis]."
 envoy_events.215.A:0 "Sa thải [event_envoy.GetHerHim]."
 envoy_events.215.A.tooltip:0 "§Y[event_envoy.GetName]§! sẽ bị thay thế khẩn cấp. Tuy nhiên, thực tế sẽ chứng minh rằng chúng ta không thể nào che đậy được vết nhơ của phái đoàn ngoại giao."

 envoy_events.220.name:0 "Bị Xúc phạm"
 envoy_events.220.desc.start:0 "Việc rò rỉ đoạn ghi âm cuộc trò chuyện riêng tư của một Đặc phái viên của chúng ta đã khiến cho [offended_party.GetName] nổi cơn thịnh nộ. Trong đoạn ghi âm có một đoạn đáng tiếc, [event_envoy.GetAmbassadorOrNotCap] [event_envoy.GetName] có vẻ đã gọi những người chủ nhà của [event_envoy.GetHerHis] là \"lũ [offended_party.GetSpeciesNamePluralInsult] kinh tởm\""
 envoy_events.220.desc.end:0 "[offended_party.GetRulerTitle] của [offended_party.GetAdj] bày tỏ sự thất vọng, và cho rằng việc đặt một người không phù hợp như vậy vào một vị trí như thế là điều \"đáng lo ngại\"."
 envoy_events.220.desc.hum:0 "$envoy_events.220.desc.start$, trông có vẻ khó mà có khả năng biểu đạt cảm xúc.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.mam:0 "$envoy_events.220.desc.hum$"
 envoy_events.220.desc.fun:0 "$envoy_events.220.desc.start$, chỉ cần nhìn vẻ ngoài cũng biết là bào tử của chúng rất thích bay lượn khắp nơi.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.avi:0 "$envoy_events.220.desc.start$, dù là ngoại hình hay nhân cách cũng đều giống súc vật.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.plant:0 "$envoy_events.220.desc.start$, mặt dày hơn cả gốc cây.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.art:0 "$envoy_events.220.desc.start$, trí thông minh còn thấp hơn cả phần lớn lũ ruồi nhặng.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.rep:0 "$envoy_events.220.desc.start$, làm cho [event_envoy.GetHerHim] sợ hãi toát mồ hôi lạnh.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.mol:0 "$envoy_events.220.desc.start$, làm ô nhiễm vạn vật bằng chất nhầy kinh tởm.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.lit:0 "$envoy_events.220.desc.start$, trí thông minh chẳng khác gì những hòn sỏi trong vườn.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.nec:0 "$envoy_events.220.desc.start$, bốc mùi như đống rác chất đống từ tháng trước đến giờ.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.aqu:0 "$envoy_events.220.desc.start$, chỉ biết lầm bầm dưới đáy tàu.\n\n$envoy_events.220.desc.end$"
 envoy_events.220.desc.robot:0 "$envoy_events.220.desc.start$, hiệu suất bộ xử lý còn kém hơn cả đồ gia dụng tầm trung.\n\n$envoy_events.220.desc.end$"

 ESPIONAGE_INTEL_GAINED_TITLE:0 "Tin Tình báo do Điệp viên Hai mang Thu thập được"
 ESPIONAGE_INTEL_GAINED_DESC:0 "Sau khi các hoạt động điệp báo tại $COUNTRY|Y$ thất bại, điệp viên hai mang của chúng ta đã cung cấp cho chúng ta những thông tin tình báo vô cùng hữu ích."

