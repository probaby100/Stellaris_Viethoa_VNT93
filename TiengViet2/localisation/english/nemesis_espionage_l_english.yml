 operation.8000.name:0 "Đẩy mạnh Kế hoạch"
 operation.8000.desc:0 "Đặc vụ của chúng ta đang lập danh sách những người có khả năng trở thành điệp viên nằm vùng tại §H[root.target.GetName]§!. Họ hy vọng sẽ cài cắm những điệp viên này vào các vị trí thích hợp, sao cho thường ngày họ có vẻ vô hại nhưng lại có thể sẵn sàng tấn công bất cứ lúc nào trong một khoảng thời gian dài."
 operation.8001.name:0 "Xác định Điệp viên Nằm vùng Tiềm năng"
 operation.8001.desc:0 "Một loạt các mục tiêu đã được xác định, và đặc vụ của chúng ta đã âm thầm lẻn vào vị trí. Ngay khi nhận được tín hiệu của chúng ta, họ sẽ bắt đầu kích động."
 operation.8002.name:0 "Đã Cài cắm Điệp viên Nằm vùng Thành công"
 operation.8002.desc.start:0 "Báo cáo từ §HChiến dịch [This.GetName]§! cho thấy mọi thứ đang diễn ra suôn sẻ:"
 operation.8002.desc.boring:0 "$operation.8002.desc.start$ Điệp viên của chúng ta đã trà trộn thành công vào mọi ngóc ngách của xã hội [root.target.GetAdj], trà trộn vào những nơi kín đáo và giả vờ là một người dân bình thường. $operation.8002.desc.end$"
 operation.8002.desc.materialist:0 "$operation.8002.desc.start$ Dòng tiền bí ẩn không rõ nguồn gốc đã mang lại cho điệp viên của chúng ta nguồn tài chính khổng lồ cùng với những lá thư giới thiệu giả mạo, giúp họ giành được vị trí quản lý cấp trung tại nhiều công ty hàng đầu của [root.target.GetAdj]. $operation.8002.desc.end$"
 operation.8002.desc.megacorp:0 "$operation.8002.desc.start$ Dòng tiền bí ẩn không rõ nguồn gốc đã mang lại cho điệp viên của chúng ta nguồn tài chính khổng lồ cùng với những lá thư giới thiệu giả mạo, giúp họ tiến vào hàng ngũ lãnh đạo cấp trung của một số Doanh nghiệp Toàn cầu của [root.target.GetAdj]. $operation.8002.desc.end$"
 operation.8002.desc.spiritualist:0 "$operation.8002.desc.start$ Mặc dù việc học hỏi đủ kiến thức về tôn giáo [root.target.GetAdj] là một thách thức vô cùng lớn, nhưng đặc vụ của chúng ta đã thành công xâm nhập vào cơ quan giáo hội của họ, và đây là cơ quan có ảnh hưởng nhất trong [root.target.GetGovernmentName]. $operation.8002.desc.end$"
 operation.8002.desc.authoritarian.imperial:0 "$operation.8002.desc.start$ Bằng cách đưa ra nhiều lời thề trung thành giả tạo, cùng với hàng loạt các cuộc điều tra lý lịch ngụy tạo, đặc vụ của chúng ta đã có được một chức quan trong hệ thống chính phủ của hoàng gia đối phương. $operation.8002.desc.end$"
 operation.8002.desc.authoritarian.non_imperial:0 "$operation.8002.desc.start$ Bằng cách đưa ra nhiều lời thề trung thành giả tạo, cùng với hàng loạt các cuộc điều tra lý lịch ngụy tạo, cuối cùng đặc vụ của chúng ta đã có được một chức quan trong hệ thống chính phủ của đảng cầm quyền. $operation.8002.desc.end$"
 operation.8002.desc.militarist:0 "$operation.8002.desc.start$ Sau khi tận dụng mọi mánh khóe và dùng nhiều cách để che đậy cẩn thận, cuối cùng chúng ta cũng đã gài được một số đặc vụ vào các vị trí sĩ quan cấp thấp trong quân đội [root.target.GetAdj]. $operation.8002.desc.end$"
 operation.8002.desc.hive:0 "$operation.8002.desc.start$ Bằng cách sử dụng công nghệ Pheromone mới nhất và một lượng lớn chất ức chế thần kinh, chúng ta đã xoay sở tạo ra được một vài \"điểm mù\" ngay trong [root.target.GetGovernmentName]. Nhờ đó, chúng ta có thể giấu nhẹm các đặc vụ của mình và bắt đầu lôi kéo những [root.target.GetIndividualNamePlural] người [root.target.GetAdj]. $operation.8002.desc.end$"
 operation.8002.desc.hive_on_hive:0 "$operation.8002.desc.start$ Chúng ta đã thành công lôi kéo một vài cá thể [root.target.GetGestaltEntityName] người [root.target.GetAdj], nhờ đó chúng có thể bí mật tuồn tin cho chúng ta trong khi vẫn giả vờ làm việc bình thường. $operation.8002.desc.end.gestalt$"
 operation.8002.desc.machine:0 "$operation.8002.desc.start$ Đội chuyên gia tin tặc của chúng ta đã kích hoạt một loạt cửa hậu ẩn giấu bên trong [root.target.GetGovernmentName] và cài đặt chúng thành công vào các phần mềm quan trọng nhưng ít người biết đến, yếu tố cốt lõi trong hoạt động của [root.target.GetAdj]. $operation.8002.desc.end.gestalt$"
 operation.8002.desc.machine_on_machine:0 "$operation.8002.desc.start$ Đội chuyên gia tin tặc của chúng ta đã kích hoạt một loạt cửa hậu ẩn giấu bên trong [root.target.GetGovernmentName] và cài đặt chúng thành công vào các phần mềm quan trọng nhưng ít người biết đến, yếu tố cốt lõi trong hoạt động của [root.target.GetAdj]. $operation.8002.desc.end.gestalt$"
 operation.8002.desc.end:0 "\n\nKể từ giờ, chúng sẽ có thể cập nhật cho chúng ta về §Hnhững diễn biến mới nhất§! của [root.target.GetName], và đảm bảo rằng chúng ta có §Hkhả năng lâu dài§! để tổ chức các chiến dịch nếu muốn."
 operation.8002.desc.end.gestalt:0 "\n\nThông qua những điệp viên này, chúng ta có thể nắm bắt được §Hnhững diễn biến mới nhất§! của [root.target.GetName] theo thời gian thực và đảm bảo §Hkhả năng lâu dài§! để tổ chức các chiến dịch nếu muốn."
 operation.8002.b:0 "Chúng ta thậm chí còn có thể đi xa hơn nữa."

 sleeper_cell_operation_success:0 "Điệp viên nằm vùng"
 sleeper_cell_operation_success_desc:0 "Chúng ta đã cài cắm thành công những điệp viên nằm vùng chuyên cung cấp tin tức mới nhất, họ luôn sẵn sàng hành động theo chỉ thị của chúng ta."
 operation_sleeper_cells_dont_stack_this:1 "$TRIGGER_FAIL$§RChúng ta đã cài cắm thành công điệp viên nằm vùng tại [root.target.GetName]. Họ sẽ duy trì hoạt động cho đến §Y[Root.sleeper_cell_success]§!§!"

 envoy_events.200.name:0 "Nhà Vận động Hành lang"
 envoy_events.200.desc:1 "Có những âm thanh bất hòa lẫn trong Cộng đồng Ngân hà, không phải ai cũng thân thiện và chắc chắn có những kẻ mà lợi ích của chúng đi ngược lại với lợi ích của [Root.GetAdj]. Điều tồi tệ hơn là đặc phái viên [event_envoy.GetName] dường như đang lắng nghe một vài giọng điệu sai trái đó. Khi tham dự một vài cuộc họp do §H[Root.GetOppositionGalcomLobbyists]§! tổ chức, thái độ của [event_envoy.GetSheHe] đã trở nên vô cùng đáng ngờ. Giờ thì mọi chuyện đã sáng tỏ, một khoản tiền lớn từ một tổ chức nào đó đã được chuyển vào tài khoản của [event_envoy.GetHerHim].\n\nCác đồng nghiệp của [event_envoy.GetName] đã yêu cầu triệu hồi [event_envoy.GetSheHe] và tiến hành bỏ phiếu bất tín nhiệm. Tuy nhiên, một số cố vấn gian xảo hơn lại gợi ý rằng chúng ta nên thỏa thuận với [event_envoy.GetHerHim], giữ nguyên chức vụ hiện tại để đổi lấy cơ hội thu thập thông tin tình báo."
 envoy_events.200.A:0 "Có to tát gì đâu?"

 beholden_to_special_interests:0 "Tập trung vào lợi ích đặc biệt"
 beholden_to_special_interests_desc:0 "Đặc phái viên của chúng ta dường như đã trở nên giàu có nhờ những khoản đóng góp từ một số nhóm vận động hành lang, nhưng họ vẫn đang mang lại lợi ích cho chúng ta."

