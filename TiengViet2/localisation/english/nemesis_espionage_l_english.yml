 ESPIONAGE_ASSET_SPECIES:0 "Giống loài: $SPECIES|Y$"
 ESPIONAGE_ASSET_STATIC_DESC:0 "§E§YChỉ điểm§! là đặc vụ hữu ích trong một số chiến dịch, và cung cấp một mức tăng trưởng nhất định khi thực hiện một số loại chiến dịch cụ thể. Đôi khi, khi một chiến dịch bị bại lộ, bạn có thể che đậy dấu vết của mình bằng cách hy sinh các chỉ điểm.§!"
 ESPIONAGE_NO_AVAILABLE_ASSET_STATIC_DESC:0 "§HKhông có chỉ điểm§!\n§RKhông có chỉ điểm khả dụng.§!\n\nBạn có thể thu được chỉ điểm thông qua sự kiện hoặc chiến dịch §YChiêu mộ Chỉ điểm§!."
