 ESPIONAGE_DAILY_NETWORK_VALUE_DELAYED:1 "§E§HMức độ Xâm nhập§! của chúng ta đối với đế chế này sẽ thay đổi mỗi ngày theo mức này.\n\nMạng lưới tình báo chỉ có thể phát triển sau khi được phân công một §YĐặc phái viên§! làm người đứng đầu.\n\nQuốc gia có §Y$EMPIRE_SIZE$§! càng cao hoặc §YMức độ mã hóa tương đối§! của chúng ta đối với họ càng lớn thì càng dễ xâm nhập.§!"
