 tech_thought_enforcement:0 "Kiểm soát Tư tưởng"
 tech_thought_enforcement_desc:0 "Những nhà ngoại cảm có thể theo dõi những công dân có tư tưởng sai lệch, và sau một số nghiên cứu về công nghệ thần giao cách cảm, họ cũng có thể điều chỉnh những tư tưởng sai lệch mà họ phát hiện thấy ở công dân."
 tech_thought_enforcement_effect:1 "§HMở khóa Sắc lệnh:§! $edict_thought_enforcement$"
 tech_thought_enforcement_gestalt:0 "Dự đoán Tư tưởng"
 tech_thought_enforcement_gestalt_desc:0 "Thông qua các nghiên cứu sâu hơn, các cá thể ngoại cảm của chúng ta có thể nhận diện những xung động bất thường trước khi chúng trở thành ý thức và điều chỉnh những sự bất thường này khi cần thiết."
 tech_thought_enforcement_gestalt_effect:0 "§HMở khóa Sắc lệnh:§! $edict_thought_enforcement_gestalt$"
 tech_tracking_implants:0 "Cấy ghép Theo dõi"
 tech_tracking_implants_desc:0 "Những tiến bộ hơn nữa trong lĩnh vực cấy ghép dưới da cho phép chúng ta biết được vị trí và hành động của các mục tiêu được cấy ghép."
 tech_tracking_implants_effect:1 "§HMở khóa Sắc lệnh:§! $edict_tracking_implants$"
 tech_encryption_1:1 "Tường lửa Lượng tử"
 tech_encryption_1_desc:1 "Những đột phá mới trong lĩnh vực máy tính cho phép chúng ta có thêm những phương pháp mới để bảo vệ dữ liệu khỏi sự nhòm ngó."
 tech_encryption_2:1 "Lưu trữ Sụp đổ Đồng thời"
 tech_encryption_2_desc:1 "Những bước tiến xa hơn trong lĩnh vực trạng thái vướng mắc không ổn định cho phép chúng ta có thêm những phương pháp mới để bảo vệ dữ liệu khỏi sự xâm nhập bất hợp pháp."
 tech_encryption_3:1 "Khóa Thời gian Âm"
 tech_encryption_3_desc:1 "Gần đây, chúng ta đã phát hiện ra một hiện tượng vật lý kỳ lạ trong lĩnh vực mã hóa, cho phép chúng ta nhập một khóa đặc biệt trước khi tạo ra nó."
 tech_decryption_1:1 "Tin tặc Lượng tử"
 tech_decryption_1_desc:1 "Các cơ chế mã hóa nguyên thủy không có cơ hội chiến thắng trước công nghệ giải mã hiện đại."
 tech_decryption_2:1 "Kỹ nghệ Xã hội Mô phỏng"
 tech_decryption_2_desc:1 "Mắt xích yếu nhất trong bất kỳ cơ chế an ninh nào chắc chắn là con người. Thông qua mô phỏng máy tính, chúng ta có thể xây dựng mô hình về điểm yếu của họ, từ đó khám phá ra những phương pháp hoàn toàn mới để qua mặt hệ thống an ninh - hoặc lừa dối họ để che đậy."
 tech_decryption_3:1 "Lập bản đồ Chuẩn không gian"
 tech_decryption_3_desc:1 "Đặc vụ của chúng ta có thể truy xuất dữ liệu trong ánh xạ thực tế lân cận, nhờ đó không phải mạo hiểm kích hoạt báo động trong thực tế để thu thập thông tin tình báo."
 tech_planetary_infrastructure_1:0 "Cơ sở hạ tầng Plasteel"
 tech_planetary_infrastructure_1_desc:0 "Hợp kim siêu cứng cho phép chúng ta xây dựng các công trình đúc sẵn, cung cấp cơ sở hạ tầng tốt hơn cho thuộc địa của chúng ta."
