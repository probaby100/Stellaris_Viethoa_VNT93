 espionage_operation_roll_header:2 "§H$ARCHAEOLOGICAL_SITE_BREAKTHROUGH$§!\nGiá trị này phản ánh cơ hội chiến dịch của bạn đạt được bước đột phá đáng kể trong giai đoạn này.\n\nMỗi khi kết thúc một giai đoạn chiến dịch, trò chơi sẽ tự động gieo xúc xắc (kết quả dao động từ §Y1§! đến §Y10§!). Kết quả xúc xắc sẽ được cộng với §YGia tăng kỹ năng§! và số lượng §YManh mối§!, sau đó trừ đi §YĐộ khó§!."
