 operation_diplomatic_incident:0 "Gây ra sự cố ngoại giao"
 operation_diplomatic_incident_desc:0 "Chúng ta sẽ tận dụng triệt để những liên kết ngoại giao yếu kém giữa hai nước để tạo ra sự khó xử giữa hai nước."
 operation_diplomatic_incident_on_success:0 "$IF_SUCCESSFUL|E$\nTạo ra tình huống khó xử trong một dịp ngoại giao đối với một đặc phái viên của [root.target.GetName]."
 operation_target_seditionists:0 "Đế chế: Theo dõi thế lực lật đổ"
 operation_target_seditionists_desc:0 "Đặc vụ của chúng ta sẽ dùng mọi biện pháp có thể để ngăn chặn các đặc phái viên của đế chế mục tiêu thông qua vận động hành lang làm suy yếu uy quyền của Đế chế."
 operation_target_seditionists_on_success:0 "$IF_SUCCESSFUL|E$\nLàm suy yếu những nỗ lực làm giảm uy quyền Đế chế của [root.target.GetName]."
 operation_weaken_galactic_empire:1 "Đế chế: Làm suy yếu uy quyền Đế chế"
 operation_weaken_galactic_empire_desc:0 "Đặc vụ của chúng ta sẽ thâm nhập vào trung tâm của Đế chế, làm suy yếu sự kiểm soát của Đế chế Ngân hà đối với thiên hà."
 operation_weaken_galactic_empire_on_success:0 "$IF_SUCCESSFUL|E$\nLàm giảm uy quyền Đế chế."
 operation_spark_rebellion:1 "Đế chế: Kích động nổi loạn"
 operation_spark_rebellion_desc:1 "Đế chế Ngân hà đang ở bên bờ vực nguy hiểm của một cuộc nổi loạn công khai. Đặc vụ của chúng ta sẽ nắm bắt cơ hội để làm mọi cách nhằm phát động một cuộc khởi nghĩa trên toàn thiên hà chống lại sự chuyên chế bạo ngược của Đế chế.\n\n§RNếu uy quyền Đế chế phục hồi lên trên §Y80§! khi kết thúc một giai đoạn, chiến dịch sẽ bị hủy bỏ.§!"
 operation_spark_rebellion_on_success:0 "$IF_SUCCESSFUL|E$\nThành lập Nghĩa quân và tuyên chiến với Đế chế Ngân hà."

