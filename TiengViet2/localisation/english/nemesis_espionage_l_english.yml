 operation_gather_information:0 "Thu thập thông tin"
 operation_gather_information_desc:3 "Đặc vụ của chúng ta sẽ biên soạn thông tin về §Y[This.Target.GetName]§! và sau khi hoàn thành sẽ gửi một báo cáo §Ytình báo§!. Điều này sẽ vạch trần những điểm yếu của đối phương, trong một khoảng thời gian nhất định làm tăng §YMức độ Xâm nhập tối đa§! của chúng ta.\n\nPhân công một §YChỉ điểm§! thực hiện hành động này có thể đi ngược lại lợi ích của họ."
 operation_gather_information_no_dlc_desc:2 "Đặc vụ của chúng ta sẽ biên soạn thông tin về §Y[This.Target.GetName]§! và sau khi hoàn thành sẽ gửi một báo cáo §Ytình báo§!. Điều này sẽ vạch trần những điểm yếu của đối phương, trong một khoảng thời gian nhất định làm tăng §YMức độ Xâm nhập tối đa§! của chúng ta."
 operation_gather_information_on_success:1 "$IF_SUCCESSFUL|E$\nNhận được thông tin tình báo và Mức độ Xâm nhập tối đa của [root.target.GetName]."
