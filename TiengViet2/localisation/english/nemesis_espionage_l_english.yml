 operation_steal_technology:0 "Đánh cắp công nghệ"
 operation_steal_technology_desc:0 "Đặc vụ của chúng ta sẽ thâm nhập vào các phòng thí nghiệm và hệ thống nghiên cứu, cung cấp cho các nhà khoa học của chúng ta những thành quả mà họ đang tìm kiếm."
 operation_steal_technology_on_success:0 "$IF_SUCCESSFUL|E$\nNhận được một công nghệ chưa biết ngẫu nhiên hoặc tiến độ nghiên cứu của một công nghệ nào đó."
 operation_steal_technology_enigmatic_engineering:0 "$TRIGGER_FAIL$§RChúng ta không thể bẻ khóa công nghệ và phương pháp nghiên cứu của họ.§!"
 operation_steal_technology_too_recent:1 "$TRIGGER_FAIL$ §RChúng ta phải đợi ít nhất §Y[Root.recently_stole_technology]§! mới có thể tiếp tục nhắm vào các cơ sở nghiên cứu của họ.§!"
 operation_acquire_asset:0 "Chiêu mộ chỉ điểm"
 operation_acquire_asset_desc:1 "Chúng ta có thể dụ dỗ hoặc ép buộc các đặc vụ và chỉ điểm khác hữu ích cho hoạt động tình báo của chúng ta, chiêu mộ họ với một mức giá nhất định.\n\nPhân công một §YChỉ điểm§! thực hiện hành động này có thể đi ngược lại lợi ích của họ."
 operation_acquire_asset_on_success:0 "$IF_SUCCESSFUL|E$\nNhận được một chỉ điểm hoạt động trong mạng lưới tình báo."
 operation_sleeper_cells:0 "Chuẩn bị cài cắm điệp viên"
 operation_sleeper_cells_desc:0 "Nhân viên tình báo của chúng ta hiện cần được phái đi làm các nhiệm vụ khẩn cấp hơn, nhưng thông qua sự chuẩn bị kỹ lưỡng, chúng ta có thể giữ lại phần lớn mạng lưới tình báo để dự phòng cho tương lai."
 operation_sleeper_cells_on_success:0 "$IF_SUCCESSFUL|E$\nĐình chỉ mọi hoạt động trong mạng lưới tình báo này, cho phép phân công lại $role_spymaster$ đến nơi khác, đồng thời duy trì $INFILTRATION_LEVEL$ không bị suy giảm."
 operation_sabotage_starbase:1 "Phá hoại cơ sở Căn cứ Sao"
 operation_sabotage_starbase_desc:0 "Căn cứ Sao là trung tâm của bất kỳ đế chế nào. Nếu có chuyện gì đáng tiếc xảy ra ở đó thì..."
 operation_sabotage_starbase_orbring_desc:0 "Căn cứ Sao và Căn cứ Vành đai là trung tâm của bất kỳ đế chế nào. Nếu có chuyện gì đáng tiếc xảy ra ở đó thì..."
 operation_sabotage_starbase_on_success:1 "$IF_SUCCESSFUL|E$\nPhá hủy ngẫu nhiên một mô-đun hoặc công trình tại một Căn cứ Sao cụ thể. Xưởng đóng tàu sẽ không bị phá hủy."
 operation_sabotage_starbase_no_targets:1 "$TRIGGER_FAIL$§RChúng ta chỉ có thể nhắm mục tiêu vào các mô-đun Căn cứ Sao và các công trình không phải là Xưởng đóng tàu.§!"
 operation_smear_campaign:0 "Chiến dịch bôi nhọ"
 operation_smear_campaign_desc:1 "Những đặc vụ được đào tạo bài bản có thể phát tán sự thật, phiên bản của riêng chúng ta, và thậm chí chia rẽ cả những mối quan hệ đồng minh bền chặt nhất."
 operation_smear_campaign_on_success:0 "$IF_SUCCESSFUL|E$\nLàm giảm quan hệ ngoại giao của [root.target.GetName] với một đế chế khác."
 operation_extort_favors:0 "Tống tiền đổi lấy ủng hộ"
 operation_extort_favors_desc:0 "Một đòn kết hợp giữa tống tiền và đe dọa có thể thiết lập tầm ảnh hưởng hữu ích cho các nhà ngoại giao của chúng ta."
 operation_extort_favors_on_success:0 "$IF_SUCCESSFUL|E$\nNhận được ủng hộ ngoại giao của [root.target.GetName], ít nhất là 1."
 operation_arm_privateers:0 "Vũ trang tư lậu"
 operation_arm_privateers_desc:2 "Đặc vụ của chúng ta có thể cung cấp vũ khí và tàu thuyền không thể truy xuất nguồn gốc cho các thế lực lật đổ bên trong đế chế mục tiêu, tạo mọi điều kiện thuận lợi để chúng gieo rắc hỗn loạn và hủy diệt."
 operation_arm_privateers_on_success:0 "$IF_SUCCESSFUL|E$\nLàm xuất hiện một hạm đội hải tặc thù địch trong lãnh hải của [root.target.GetAdj]."
 operation_arm_privateers_existing_activity:1 "$TRIGGER_FAIL$§RHải tặc đã trên đường đến §Y[root.target.GetName]§!. Chúng ta phải đợi §Y[Root.Target.target_of_operation_arm_privateers]§! trước khi có thể tìm kiếm cơ hội khác.§!"
 operation_crisis_beacon:0 "Đèn hiệu Thảm họa"
 operation_crisis_beacon_desc:1 "Họ nói rằng, bất cứ ai muốn trốn thoát khỏi hàm răng của bầy dã thú đáng sợ, điều quan trọng không phải là chạy nhanh đến mức nào, mà là chạy cùng ai. Một vài mồi nhử thả ở thủ đô mục tiêu của chúng ta có thể giúp làm được điều này..."
 operation_crisis_beacon_on_success:0 "$IF_SUCCESSFUL|E$\nDụ dỗ hạm đội của phe Thảm họa đến thủ đô của [root.target.GetAdj]."
 operation_crisis_beacon_too_recent:0 "$TRIGGER_FAIL$§RChúng ta phải đợi ít nhất §Y4 năm§! mới có thể tiếp tục dụ dỗ thế lực Thảm họa.§!"
