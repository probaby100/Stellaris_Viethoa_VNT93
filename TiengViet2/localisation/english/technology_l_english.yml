 # ###################################
 # Categories
 # ###################################

 materials:0 "Khoa Học Vật Liệu"
 materials_desc:0 "Sáng tạo và tinh chỉnh vật liệu nhằm nâng cao tính ứng dụng và độ bền."
 propulsion:0 "Động Lực Đẩy"
 propulsion_desc:1 "Nghiên cứu về lực đẩy và quỹ đạo đường đạn."
 voidcraft:0 "Kỹ Thuật Không Gian"
 voidcraft_desc:0 "Không gian là biên giới cuối cùng. Làm chủ không gian là làm chủ tương lai."
 robotics:0 "Khoa Học Robot"
 robotics_desc:0 "Cơ giới hóa toàn diện trên mọi phương diện."
 industry:0 "Kỹ Thuật Công Nghiệp"
 industry_desc:0 "Sự sáng tạo và năng suất vượt bậc."
 field_manipulation:0 "Thao Túng Lực Trường"
 field_manipulation_desc:0 "Bẻ cong các lực cơ bản theo ý chí của chúng ta."
 particles:0 "Vật Lý Hạt"
 particles_desc:0 "Cô lập và ứng dụng vật chất cùng các hiện tượng dạng hạt."
 computing:0 "Kỹ Thuật Điện Toán"
 computing_desc:0 "Khoa học về các thuật toán ứng dụng."
 metaphysics:0 "Hình Nhi Thượng Học"
 metaphysics_desc:0 "Vượt xa mọi giới hạn nhận thức."
 statecraft:0 "Nghệ Thuật Trị Quốc"
 statecraft_desc:0 "Nghệ thuật xây dựng một xã hội thịnh vượng và vững mạnh."
 biology:0 "Sinh Học"
 biology_desc:0 "Khoa học về sự sống, trong muôn vàn hình thái và sự phức tạp khôn lường."
 military_theory:0 "Lý Luận Quân Sự"
 military_theory_desc:0 "Nghệ thuật chiến tranh và những khía cạnh trọng yếu liên quan."
 new_worlds:0 "Lý Thuyết Khai Khẩn"
 new_worlds_desc:0 "Các giao thức thuộc địa hóa và quy trình huấn luyện đội ngũ tiên phong."
 psionics:0 "Lý Thuyết Tâm Linh"
 psionics_desc:0 "Tâm thức ngự trị trên vật chất."

