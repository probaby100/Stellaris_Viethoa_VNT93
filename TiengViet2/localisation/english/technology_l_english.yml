 tech_repeatable_command_limit_desc:0 "Tăng cường đội ngũ trợ lý tham mưu cho các chỉ huy của chúng ta sẽ gia tăng số lượng tàu họ có thể dẫn dắt trong một hạm đội duy nhất."

