 tech_battleship_hull_1:0 "Thân Thiết Giáp Hạm Cải Tiến"
 tech_battleship_hull_1_desc:0 "Tiến bộ trong kỹ thuật đóng tàu sẽ cho phép chế tạo các thiết giáp hạm vững chắc và bền bỉ hơn."
 tech_battleship_hull_2:0 "Thân Thiết Giáp Hạm Tiên Tiến"
 tech_battleship_hull_2_desc:0 "Thế hệ thân thiết giáp hạm mới nhất sở hữu trường toàn vẹn cấu trúc tối ưu và các vách ngăn kiên cố hơn."
 tech_battleship_build_speed:0 "Khuôn Mẫu Thiết Giáp Hạm Chuẩn Hóa"
 tech_battleship_build_speed_desc:0 "Thiết lập các tiêu chuẩn mới trong thiết kế và chế tạo các thiết giáp hạm khổng lồ sẽ gia tăng đáng kể tốc độ lắp ráp của chúng."

