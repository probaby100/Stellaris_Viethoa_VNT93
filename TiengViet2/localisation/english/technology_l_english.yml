 tech_cruiser_hull_2:0 "Thân Tàu Tuần Dương Tiên Tiến"
 tech_cruiser_hull_2_desc:0 "Thế hệ thân tàu tuần dương mới nhất sở hữu trường toàn vẹn cấu trúc tối ưu và các vách ngăn kiên cố hơn."
