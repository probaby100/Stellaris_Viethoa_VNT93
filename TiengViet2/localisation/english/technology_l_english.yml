 # Starbases
 tech_starbase_1:0 "Xây Dựng Căn Cứ Sao"
 tech_starbase_1_desc:0 "Một cơ sở không gian tập trung được xây dựng trên quỹ đạo sát ngôi sao chủ là điều kiện thiết yếu để khai thác toàn diện tài nguyên trong hệ sao."
 tech_starbase_2:0 "Cảng Sao"
 tech_starbase_2_desc:0 "Các căn cứ sao sơ khai chẳng qua chỉ là tiền đồn tạm bợ. Những cảng sao vĩnh cửu sẽ giúp chúng ta duy trì quyền kiểm soát vững chắc hơn đối với các hệ sao."
 tech_starbase_3:0 "Thành Trì Sao"
 tech_starbase_3_desc:0 "Khi lưu lượng giao thông không gian gia tăng, cần có những căn cứ sao lớn hơn và phòng thủ kiên cố hơn để bảo vệ các tuyến đường không gian của hệ sao."
 tech_starbase_4:0 "Pháo Đài Sao"
 tech_starbase_4_desc:0 "Những pháo đài vũ trụ hùng vĩ này sẽ trở thành trung tâm tác chiến cho mọi hoạt động quân sự trong hệ sao, và sự hiện diện của chúng chắc chắn sẽ ngăn bước mọi kẻ thù ngoan cố nhất."
 tech_starbase_5:0 "Thành Lũy Không Gian (Citadel)"
 tech_starbase_5_desc:0 "Kế hoạch xây dựng một trạm chiến đấu đồ sộ có khả năng đương đầu với nhiều hạm đội đột kích đang được triển khai. Khi hoàn tất, các thành lũy này vừa là tượng đài biểu dương sức mạnh, vừa là trung tâm kết nối toàn hệ sao."

 tech_modular_engineering:0 "Kỹ Thuật Mô-đun Hóa"
 tech_modular_engineering_desc:1 "Quy trình xây dựng căn cứ sao tinh gọn bằng thiết kế mô-đun sẽ giúp giảm bớt chi phí và thời gian thi công hiện nay."

 tech_defense_platform_hull_1:0 "Cải Tiến Toàn Vẹn Cấu Trúc"
 tech_defense_platform_hull_1_desc:0 "Khung giàn gia cố và các màng chắn chống nổ hấp thụ xung lực tăng cường sẽ đảm bảo tính toàn vẹn cấu trúc của nền tảng phòng thủ ngay cả dưới áp lực khủng khiếp."

 #Spaceport Modules
 #tech_corvette_assembly:0 "Advanced Corvette Designs"
 #tech_corvette_assembly_desc:0 "Unused" # TEMP
 #tech_destroyer_assembly:0 "Advanced Destroyer Designs"
 #tech_destroyer_assembly_desc:0 "Unused" # TEMP

 tech_solar_panel_network:0 "Chuyển Hóa Năng Lượng Quỹ Đạo"
 tech_solar_panel_network_desc:1 "Tiến bộ trong công nghệ pin mặt trời có thể bù đắp chi phí vận hành của căn cứ sao. Tuy nhiên, các tấm pin này đòi hỏi cả một mô-đun căn cứ sao chuyên dụng để tạo ra đủ lượng năng lượng."
 tech_mining_terminal:0 "Công Đoàn Khai Khoáng"
 tech_mining_terminal_desc:0 "Các công đoàn khai khoáng có tổ chức sẽ giám sát mọi hoạt động khai thác tài nguyên trong hệ sao. Điều này giúp nâng cao hiệu quả bằng cách siết chặt quản lý các thợ đào quặng tự do \"đánh quả lẻ\"."
 tech_zero_gravity_assembly_sequence:0 "Khung Giàn Thao Tác Không Trọng Lực"
 tech_zero_gravity_assembly_sequence_desc:0 "Những khung giàn này được trang bị vô số công cụ hữu ích, giúp công nhân di chuyển nhanh chóng và an toàn giữa các công trường trên quỹ đạo. Các sứ mệnh EVA ngoài không gian chưa bao giờ dễ dàng đến thế."

 # Strike Craft
 tech_strike_craft_1:0 "Tác Chiến Tàu Sân Bay"
 tech_strike_craft_1_desc:0 "Những phi thuyền đột kích có người lái này được phóng từ tàu mẹ, dựa vào tốc độ và kích thước nhỏ bé để sống sót đủ lâu nhằm xuyên thủng hàng phòng thủ đối phương."
 tech_strike_craft_2:0 "Phi Đội Đột Kích Cải Tiến"
 tech_strike_craft_2_desc:0 "Thế hệ tàu đột kích tiếp theo sở hữu động cơ mạnh mẽ hơn và vỏ ngoài kiên cố hơn."
 tech_strike_craft_3:0 "Phi Đội Đột Kích Tiên Tiến"
 tech_strike_craft_3_desc:0 "Những phi cơ tiêm kích-ném bom tiên tiến có khả năng chiến đấu trên quỹ đạo vượt trội."

 # Armies and Attachments - Engineering
 tech_planetary_defenses:0 "Phòng Thủ Hành Tinh"
 tech_planetary_defenses_desc:0 "Có thể sẽ đến lúc những trí tuệ vĩ đại, lạnh lùng và vô cảm nhìn thế giới của chúng ta với lòng thèm muốn và vạch ra những kế hoạch chống lại chúng ta. Chúng ta phải luôn sẵn sàng."
 tech_assault_armies:0 "Lực Lượng Viễn Chinh Liên Hành Tinh"
 tech_assault_armies_desc:0 "Xâm lược một thế giới khác là một đại chiến dịch quy mô choáng ngợp. Cần phải vượt qua vô vàn thách thức hậu cần khổng lồ trước khi có thể tập hợp các đạo quân liên hành tinh đầu tiên của chúng ta."
 tech_drop_pod:0 "Khoang Đổ Bộ Quỹ Đạo"
 tech_drop_pod_desc:0 "Khoang đổ bộ quỹ đạo dùng một lần sẽ giảm bớt sự phụ thuộc vào tàu đổ bộ dễ tổn thương, cho phép chúng ta nhanh chóng triển khai các lực lượng hạng nhẹ đến bất kỳ đâu trên bề mặt hành tinh."

 # Ship Armor Components
 tech_ship_armor_1:0 "Vật Liệu Hợp Kim Nano"
 tech_ship_armor_1_desc:0 "Các tấm giáp thân tàu bằng vật liệu composite nano gia cố có thể mang lại một lớp bảo vệ bổ sung, tạo nên ranh giới giữa sự sống và cái chết trong một trận chiến khốc liệt."
 tech_ship_armor_2:0 "Vật Liệu Gốm Kim Loại"
 tech_ship_armor_2_desc:0 "Sự kết hợp giữa các kim loại khác nhau và vật liệu gốm tạo ra một lớp giáp kiên cố mà không làm mất đi tính linh hoạt."
 tech_ship_armor_3:0 "Vật Liệu Thép Nhựa (Plasteel)"
 tech_ship_armor_3_desc:0 "Plasteel là một loại vật liệu có độ đàn hồi cao, kết hợp nhiều đặc tính ưu việt của nhựa và kim loại. Nó tương đối rẻ để sản xuất và có thể dùng để gia cường giáp tàu chiến."
 tech_ship_armor_4:0 "Vật Liệu Siêu Thép (Durasteel)"
 tech_ship_armor_4_desc:0 "Vật liệu bền vững nhưng dẻo dai này có khả năng chống chịu những đòn hủy diệt nặng nề. Nó phục vụ cực kỳ hiệu quả làm giáp bọc tàu chiến."
 tech_ship_armor_5:0 "Vật Liệu Neutronium"
 tech_ship_armor_5_desc:0 "Loại vật liệu cực kỳ đậm đặc và kiên cố này có thể chống chịu hỏa lực khủng khiếp vốn có thể biến các lớp giáp hợp kim khác thành xỉ tro."

 tech_crystal_armor_1:0 "Giáp Bọc Pha Lê"
 tech_crystal_armor_1_desc:1 "Bằng cách hòa trộn vật chất pha lê vào các tấm giáp, chúng ta có thể nâng cao hơn nữa độ bền của lớp vỏ bảo vệ tàu chiến."
 tech_crystal_armor_2:0 "Giáp Rèn Pha Lê"
 tech_crystal_armor_2_desc:1 "Việc đưa vật chất pha lê vào quy trình rèn đúc giúp cải thiện đáng kể độ cứng cáp phi thường của các kim loại gốc pha lê."

 tech_dragon_armor:0 "Vảy Rồng Nhân Tạo"
 tech_dragon_armor_desc:0 "Vảy của Rồng Không Gian (Ether Drake) cấu thành từ nhiều lớp cấu trúc nano khoáng chất độc nhất vô nhị. Kỹ thuật chế tạo phi truyền thống cho phép chúng ta mô phỏng chính xác các cấu trúc tự phục hồi này."

 tech_armor_hardeners_1:0 "Tôi Cứng Giáp"
 tech_armor_hardeners_1_desc:0 "$ARMOR_HARDENER_1_DESC$"
 tech_armor_hardeners_2:0 "Tôi Cứng Giáp Tự Thích Ứng"
 tech_armor_hardeners_2_desc:0 "$ARMOR_HARDENER_2_DESC$"

# Thruster Components
 tech_thrusters_1:0 "Động Cơ Đẩy Hóa Học"
 tech_thrusters_1_desc:0 "Động cơ đẩy hóa học đơn giản nhưng tương đối hiệu quả, vận hành dựa trên chất đẩy dễ cháy."
 tech_thrusters_2:0 "Động Cơ Đẩy Ion"
 tech_thrusters_2_desc:0 "Các động cơ điện này sử dụng các chùm ion để tạo ra lực đẩy mà không cần đến nhiên liệu hóa thạch truyền thống."
 tech_thrusters_3:0 "Động Cơ Đẩy Plasma"
 tech_thrusters_3_desc:0 "Là một hình thái đẩy điện lực tiên tiến, động cơ plasma mang lại cho phi thuyền vận tốc dưới ánh sáng nhanh hơn và khả năng cơ động linh hoạt hơn."
 tech_thrusters_4:0 "Động Cơ Đẩy Xung Lực"
 tech_thrusters_4_desc:0 "Động cơ chạy bằng phản ứng nhiệt hạch cực kỳ tân tiến này cung cấp cho phi thuyền độ cơ động và tốc độ vô song trong điều kiện dưới vận tốc ánh sáng."

 tech_afterburners_1:0 "Buồng Đốt Tăng Lực"
 tech_afterburners_1_desc:0 "Những động cơ đẩy mạnh mẽ này gia tăng tốc độ tác chiến của tàu nhưng tiêu hao rất nhiều năng lượng."
 tech_afterburners_2:0 "Buồng Đốt Tăng Lực Tiên Tiến"
 tech_afterburners_2_desc:0 "Phiên bản cải tiến của buồng đốt tăng lực tiêu chuẩn này giúp nâng cao vượt bậc tốc độ tác chiến của con tàu."

 # Military Stations
 tech_space_defense_station_1:1 "Hệ Thống Phòng Thủ Không Gian Sâu"
 tech_space_defense_station_1_desc:1 "Cho phép chế tạo các nền tảng phòng thủ không gian sâu để bảo vệ các Căn Cứ Sao của chúng ta."
 tech_space_defense_station_2:0 "Trạm Không Gian Sâu"
 tech_space_defense_station_2_desc:0 "Phương thức xây dựng mới cho phép dựng nên những trạm quân sự quy mô lớn hơn nữa giữa vũ trụ sâu thẳm."
 tech_space_defense_station_3:0 "Cơ Sở Không Gian Sâu"
 tech_space_defense_station_3_desc:0 "Các cơ sở đồ sộ này tựa như những thành phố lơ lửng trong không gian. Chúng có thể đồn trú hàng nghìn quân nhân và trang bị hỏa lực sánh ngang với cả một hạm đội."
 tech_space_defense_station_improvement:0 "Binh Chủng Công Binh"
 tech_space_defense_station_improvement_desc:0 "Việc thành lập một binh chủng công binh hạm đội chuyên trách sẽ hỗ trợ đắc lực cho công tác xây dựng nền tảng phòng thủ không gian sâu, giúp hạ giảm chi phí và nâng cao độ bền."
 tech_space_defense_station_improvement_machine_intelligence:0 "Tối Ưu Hóa Thi Công Trạm Không Gian"
 tech_space_defense_station_improvement_desc_machine_intelligence:0 "Một cuộc đánh giá sâu rộng về phương thức xây dựng trạm quân sự hiện thời đã chỉ ra nhiều phương diện có tiềm năng cải tiến lớn."

 # Industry and Robotics
 tech_housing_1:1 "Hệ Thống Kiểm Soát Thời Tiết"
 tech_housing_1_desc:1 "Khả năng can thiệp vào các mô hình khí hậu nhằm dập tắt các hiện tượng thời tiết nguy hại sẽ giúp việc duy trì các khu dân cư trở nên dễ dàng hơn và mở ra những vùng đất định cư mới."
 tech_housing_2:1 "Kỹ Thuật Phản Trọng Lực"
 tech_housing_2_desc:1 "Nhờ công nghệ trọng lực định hướng, các công trình trên bề mặt hành tinh có thể vươn cao hơn bao giờ hết mà không sợ sụp đổ cấu trúc. Bầu trời không còn là giới hạn!"
 tech_housing_agrarian_idyll:0 "Địa Đàng Nông Thôn"
 tech_housing_agrarian_idyll_desc:0 "Thông qua việc thiết lập các công xã nông thôn có kiểm soát thời tiết, chúng ta có thể nuôi dưỡng một lượng dân số lớn hơn mà không làm xáo trộn lối sống canh nông thanh bình."

 tech_mechanized_mining:0 "Khai Khoáng Cơ Giới Hóa"
 tech_mechanized_mining_desc:0 "Ứng dụng kỹ thuật cơ khí vào khai thác khoáng sản là yêu cầu căn bản cho bất kỳ xã hội công nghiệp nào."
 tech_basic_industry:0 "Nền Tảng Công Nghiệp"
 tech_basic_industry_desc:0 "Cơ sở hạ tầng công nghiệp nền tảng cần thiết để trở thành một nền văn minh du hành vũ trụ."
 tech_powered_exoskeletons:0 "Bộ Khung Xương Trợ Lực"
 tech_powered_exoskeletons_desc:0 "Mặc bộ giáp khung xương trợ lực giúp tăng cường sức mạnh và tốc độ của người sử dụng. Ứng dụng quân sự là điều hiển nhiên, nhưng nó cũng hỗ trợ đắc lực cho việc lao động chân tay."
 tech_powered_exoskeletons_machine_intelligence:0 "Động Cơ Servo Cải Tiến"
 tech_powered_exoskeletons_desc_machine_intelligence:0 "Các động cơ servo mạnh mẽ hơn sẽ gia tăng trọng tải mà các đơn vị robot của chúng ta có thể mang vác. Các đơn vị khai khoáng có thể vận chuyển nhiều khoáng sản hơn để xử lý, và các cỗ máy chiến tranh có thể trang bị khí tài hạng nặng hơn."
 tech_mining_1:0 "Thủy Lực Cắt Phá Địa Nhiệt"
 tech_mining_1_desc:0 "Kỹ thuật thủy lực cắt phá mới sẽ cho phép chúng ta khai thác các túi tài nguyên địa nhiệt sâu bên dưới vỏ hành tinh mà trước đây không thể chạm tới."
 tech_mining_2:0 "Khai Khoáng Lõi Sâu"
 tech_mining_2_desc:0 "Những mũi khoan khổng lồ này là cần thiết để tiếp cận các mỏ khoáng sản phong phú thường nằm sâu gần lõi hành tinh."
 tech_mining_3:0 "Phân Lập Khoáng Sản"
 tech_mining_3_desc:1 "Phép đo quang phổ tiên tiến kết hợp với kỹ thuật thủy lực cắt phá và súc rửa hóa chất giúp nhanh chóng khai thác các mỏ quặng nông và tầng trung."
 #tech_mining_network_5:0 "Pure Matter Extraction"
 #tech_mining_network_5_desc:0 ""
 tech_synchronized_work_patterns:0 "Mô Hình Làm Việc Đồng Bộ Hóa"
 tech_synchronized_work_patterns_desc:0 "Bằng cách đồng bộ hóa mô hình làm việc của mạng lưới mỏ quặng, hiệu suất sản lượng của chúng ta có thể được nâng cao hơn nữa."
 tech_engineering_1:0 "Cơ Học Nano"
 tech_engineering_1_desc:0 "Những đột phá xa hơn trong kỹ thuật cơ khí đòi hỏi chúng ta phải tiến sâu vào quy mô nanomet. Giờ đây chúng ta có thể thao túng các hệ thống vật lý theo những cách thức chưa từng có."
 tech_engineering_2:0 "Vi Mạch Tự Kết Nối"
 tech_engineering_2_desc:0 "Tương tự như các tế bào thần kinh hữu cơ tái tạo các kết nối đã mất bằng cách mọc chồi sợi trục, các mạch điện này có khả năng tự sửa chữa và tái cấu trúc. Ngay cả những hệ thống máy tính đơn giản nhất giờ đây cũng có thể tự tiến hóa trong quá trình sử dụng."
 tech_engineering_3:0 "Vật Liệu Siêu Rắn"
 tech_engineering_3_desc:0 "Các đặc tính cơ học lượng tử của những vật liệu này nắm giữ chìa khóa cho các trạng thái chồng chập, một bước phát triển mang tính cách mạng cho cả ngành khoa học vật liệu và công nghiệp."
 #tech_engineering_4: "Zero-Resistance Architecture"
 #tech_engineering_4_desc: "These advanced materials, absent of any frictional constraints, permit mechanical longevity on an unprecedented scale. With the removal of the previously required lubricant our structures can function within extreme temperature ranges."
 tech_robotic_workers: "Lực Lượng Lao Động Nhân Tạo"
 tech_robotic_workers_desc:0 "Các đơn vị lao động nhân tạo này hoàn hảo cho những công việc nặng nhọc tay chân. Chúng làm việc chăm chỉ và có khả năng tuân thủ các mệnh lệnh giọng nói đơn giản, nhưng đừng mong chúng biết leo cầu thang."
 tech_droid_workers: "Chuyên Gia Nhân Tạo"
 tech_droid_workers_desc:0 "Các đơn vị nhân tạo nâng cấp có phạm vi cử động linh hoạt ngang ngửa với đa số sinh vật hữu cơ. Bộ xử lý thần kinh của chúng cũng đã được cải tiến vượt bậc."
 tech_synthetic_workers: "Bộ Máy Quản Trị Nhân Tạo"
 tech_synthetic_workers_desc:0 "Các đơn vị cực kỳ tiên tiến, mạnh hơn, nhanh hơn và bền bỉ hơn phần lớn sinh vật hữu cơ. Với các bộ xử lý thần kinh được nâng cấp, chúng hoàn toàn có khả năng vận hành độc lập."
 #tech_enhanced_combat_software:0 "Combat Software 2.0"
 #tech_enhanced_combat_software_desc:0 ""
 tech_synthetic_leaders: "Ma Trận Nhân Cách Nhân Tạo"
 tech_synthetic_leaders_desc:0 "Được trang bị nhân cách, các người máy tổng hợp cuối cùng cũng có thể giao tiếp xã hội bình đẳng với những công dân còn lại của chúng ta. Một số đơn vị thậm chí có thể đảm nhận các vị trí lãnh đạo."
 tech_integrated_cybernetics:0 "Cấy Ghép Điều Khiển Học Tích Hợp"
 tech_integrated_cybernetics_desc:0 "Cải tiến dựa trên các bộ khung xương cơ bản, các cấy ghép điều khiển học tích hợp này giúp người dùng chống chịu tốt hơn trước các tác động môi trường độc hại."
 tech_integrated_cybernetics_machine_intelligence:1 "Điều Khiển Học Tự Thích Ứng"
 tech_integrated_cybernetics_desc_machine_intelligence:1 "Việc lắp đặt các thiết bị cấy ghép điều khiển học tự thích ứng với môi trường địa phương sẽ tăng cường đáng kể hiệu suất của các drone chúng ta."
 tech_mineral_purification_1:0 "Tinh Chế Khoáng Sản"
 tech_mineral_purification_1_desc:0 "Quy trình xử lý tối ưu các vật liệu khai khoáng cho phép chúng ta đạt tới những tầm cao hiệu suất mới."
 tech_mineral_purification_2:0 "Tinh Chế Khoáng Sản Tiên Tiến"
 tech_mineral_purification_2_desc:0 "Giai đoạn xử lý thứ hai đối với khoáng sản sơ chế cho phép lưu trữ và vận chuyển hiệu quả hơn."
 tech_assembly_pattern:0 "Mô Hình Lắp Ráp"
 tech_assembly_pattern_desc:1 "Thuật toán lặp nhanh trong mô phỏng xây dựng giúp xác định trước mô hình lắp ráp linh kiện tối ưu cho từng dự án công trình."
 tech_construction_templates:0 "Bản Mẫu Thi Công"
 tech_construction_templates_desc:1 "Các bản mẫu tiền chế chuẩn hóa giúp rút ngắn đáng kể thời gian thi công cơ sở tại chỗ."
 tech_robomodding:0 "Hệ Thống Bản Mẫu Máy Móc"
 tech_construction_templates_effect:0 "Sức chứa $building_resource_silo$: §G+5000§!"
 tech_robomodding_desc:0 "Các bản mẫu lắp ráp có thể ghi đè cho phép tùy biến thiết kế người máy theo nhu cầu."
 tech_robomodding_m:0 "Hệ Thống Bản Mẫu Máy Móc"
 tech_robomodding_m_desc:0 "Việc chuẩn hóa các bản mẫu lắp ráp cho phép chuyên môn hóa tốt hơn lực lượng dân cư máy móc."
 tech_robomodding_points_1:0 "Chuẩn Hóa Đa Kiểu Mẫu"
 tech_robomodding_points_1_desc:0 "Cải tiến quy trình sản xuất cho phép cải biến sâu hơn đối với người máy mà không ảnh hưởng đến chức năng cốt lõi."
 #tech_robomodding_points_1_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 # TEMP
 tech_robomodding_points_2:0 "Mạch Tương Hỗ Đổi Lẫn"
 tech_robomodding_points_2_desc:0 "Cải tiến quy trình sản xuất cho phép thực hiện những thay đổi căn bản trên người máy mà không tổn hại đến chức năng cốt lõi."
 #tech_robomodding_points_2_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 # TEMP
 tech_matter_generator:0 "Bộ Tạo Vật Chất"
 tech_matter_generator_desc:0 "Bằng cách sử dụng một lượng năng lượng khổng lồ, chúng ta có thể chuyển hóa ánh sáng thành vật chất dường như từ hư không."
 tech_mega_assembly:0 "Hệ Thống Siêu Lắp Ráp"
 tech_mega_assembly_desc:0 "Các bản mẫu tiên tiến cho phép chúng ta đẩy nhanh vượt bậc tốc độ lắp ráp các đơn vị mới."
 tech_robot_assembly_complex:0 "Hệ Thống Lắp Ráp Robot"
 tech_robot_assembly_complex_desc:0 "Các bản mẫu tiên tiến cho phép chúng ta tăng tốc vượt bậc việc lắp ráp các robot mới."

 # Space Mining
 tech_space_construction:0 "Thi Công Ngoài Vũ Trụ"
 tech_space_construction_desc:0 "Xây dựng trong không gian đặt ra cho các kỹ sư những thách thức thiết kế mới cần phải giải quyết trước khi có thể dựng các trạm quỹ đạo trên những thế giới khác."
 #tech_mine_rare_resources_t1: "Zero-Gravity Refining"
 #tech_mine_rare_resources_t1_desc: "New refining techniques are necessary in order to process the many exotic materials we are finding as we explore the galaxy."
 #tech_mine_rare_resources_t3: "Nanoparticle Extraction"
 #tech_mine_rare_resources_t3_desc: "An efficient way of extracting nanoparticles will allow us to exploit new strategic resources that were previously beyond our reach."
 tech_mining_station_improvement_1:0 "Gia Công Tại Chỗ"
 tech_mining_station_improvement_1_desc:0 "Bằng cách xử lý khoáng sản ngay trên quỹ đạo hành tinh nơi khai thác, hiệu suất khai khoáng của chúng ta được cải thiện rõ rệt."
 tech_mining_station_improvement_2:0 "Vận Hành Khai Khoáng Tự Động"
 tech_mining_station_improvement_2_desc:0 "Dựa chủ yếu vào các drone tự động hóa, các trạm khai khoáng có thể vận hành chỉ với một đội ngũ nhân sự tối thiểu, từ đó cắt giảm chi phí."
 tech_mine_satramene:0 "Tinh Chế Khí Satramene"
 tech_mine_satramene_desc:1 "Khí này là một chất kích thích tự nhiên có trên một số thế giới. Nó có tác dụng an thần đối với hầu hết sinh vật và có thể dùng như một biện pháp phi bạo lực để bình định những cá thể thù địch."
 tech_mine_garanthium:0 "Khai Thác Garanthium"
 tech_mine_garanthium_desc:1 "Thiết lập thành công các mỏ đá Garanthium đặt ra những thách thức đặc biệt, vì tính chất dễ uốn của quặng khiến việc khai thác nó khó khăn tương đương với sức hấp dẫn của nó."
 tech_mine_orillium:0 "Khai Thác Orillium"
 tech_mine_orillium_desc:1 "Các chùm tia ổn định cho phép khai thác tương đối an toàn loại quặng Orillium dễ phát nổ."
 tech_mine_living_metal:0 "Kim Loại Sống"
 tech_mine_living_metal_desc:0 "Khai thác và chế biến kim loại sống quý hiếm là vô cùng gian nan, nhưng việc ứng dụng thành công các hợp kim có khả năng biến hình này mang lại những lợi thế vô song."
 tech_mine_betharian:0 "Tinh Chế Betharian"
 tech_mine_betharian_desc:0 "Các khoáng thạch Betharian dường như bắt nguồn từ một nguồn duy nhất, nhưng đã phân tán khắp thiên hà hàng thiên niên kỷ trước. Chúng thường kết cụm dạng sỏi cuội và cực kỳ dễ bắt cháy."
 tech_mine_rare_crystals:0 "Khai Thác Tinh Thể Hiếm"
 tech_mine_rare_crystals_desc:1 "Khai thác những tinh thể này mà không làm hư hại hay phá hủy chúng là một quy trình cực kỳ tinh vi, đòi hỏi trang thiết bị tối tân với độ chuẩn xác tuyệt đối."

 # Aura Components
 tech_aura_nanobot:0 "Máy Lắp Ráp Nanobot"
 #tech_aura_nanobot_desc:0 ""
 tech_aura_minefield:0 "Địa Lôi Cảm Ứng"
 #tech_aura_minefield_desc:0 ""

 # Megastructures
 tech_mega_engineering:0 "Kỹ Thuật Siêu Công Trình"
 tech_mega_engineering_desc:1 "Để hoàn thành các công trình với quy mô choáng ngợp thực sự, trước hết chúng ta phải nắm vững hiểu biết nền tảng về cả kỹ thuật lẫn yêu cầu dự trữ tài nguyên cho các siêu cấu trúc đó."

 # ###################################
 # Engineering - Weapons
 # ###################################

 # Mass Driver Branch
 tech_mass_drivers_1:0 "Máy Phóng Khối Lượng"
 tech_mass_drivers_1_desc:0 "Các bệ phóng đạn điện từ này dùng nam châm để gia tốc đầu đạn xuyên giáp về phía mục tiêu với vận tốc cực cao."
 tech_mass_drivers_2:0 "Súng Cuộn Cảm (Coilgun)"
 tech_mass_drivers_2_desc:0 "Súng cuộn cảm là phiên bản uy lực hơn của máy phóng khối lượng sơ khai, dùng cuộn dây điện từ để gia tốc đạn bắn nhanh chóng về phía mục tiêu."
 tech_mass_drivers_3:0 "Pháo Ray Điện Từ (Railgun)"
 tech_mass_drivers_3_desc:0 "Đỉnh cao trong các thiết bị gia tốc điện từ, pháo ray sử dụng hai thanh ray song song để bắn đạn với vận tốc khó tin."
 tech_mass_drivers_4:0 "Pháo Ray Tiên Tiến"
 tech_mass_drivers_4_desc:0 "Phiên bản mới của pháo ray truyền thống với các thanh ray kiên cố hơn và nguồn cấp năng lượng tăng cường. Vũ khí này mạnh mẽ và chính xác hơn các thế hệ tiền nhiệm."
 tech_mass_drivers_5:0 "Đại Bác Gauss"
 tech_mass_drivers_5_desc:0 "Phiên bản cập nhật từ thiết kế súng cuộn cảm cổ điển thậm chí còn có sức tàn phá lớn hơn cả các thiết kế pháo ray tân tiến nhất, có khả năng bắn đạn với độ chính xác và vận tốc phi thường."
 tech_kinetic_artillery_1:0 "Khẩu Đội Động Năng"
 tech_kinetic_artillery_1_desc:0 "Hỏa pháo tầm siêu xa có khả năng phóng các phát đạn uy lực qua khoảng cách cực lớn với độ chính xác cao."
 tech_kinetic_artillery_2:0 "Trận Địa Pháo Động Năng Tiên Tiến"
 tech_kinetic_artillery_2_desc:0 "Hệ thống pháo hạm tầm xa còn uy lực hơn nữa, trang bị nòng pháo mới và máy tính kiểm soát hỏa lực nâng cấp."
 tech_mass_accelerator_1:0 "Đại Pháo Mega"
 tech_mass_accelerator_1_desc:0 "Một khẩu pháo gia tốc khối lượng khổng lồ chỉ có thể lắp đặt trên khung trục dọc thân tàu, bắn ra những phát đạn có sức tàn phá khủng khiếp qua khoảng cách bao la."
 tech_mass_accelerator_2:0 "Đại Pháo Giga"
 tech_mass_accelerator_2_desc:0 "Một khẩu pháo gia tốc khối lượng còn mạnh mẽ hơn nữa, có khả năng xé toạc ngay cả những tấm khiên kiên cố nhất."

 # Auto-Cannon Branch
 tech_autocannons_1:0 "Pháo Tự Động"
 tech_autocannons_1_desc:0 "Vũ khí đạn đạo cỡ nòng lớn bắn các viên đạn nổ có vỏ. Ưu điểm chính của các khẩu pháo này là tốc độ bắn cực nhanh."
 tech_autocannons_2:0 "Pháo Tự Động Xé Xác (Ripper)"
 tech_autocannons_2_desc:0 "Các khẩu pháo tự động nòng xoay nâng cấp này có hệ thống theo dõi và kiểm soát hỏa lực cải tiến, cho phép duy trì tốc độ bắn cao hơn nữa."
 tech_autocannons_3:0 "Pháo Bão Lửa (Stormfire)"
 tech_autocannons_3_desc:1 "Pháo tự động nòng xoay tiên tiến có khả năng trút cả một cơn mưa đạn nổ mạnh vào mục tiêu."

 tech_flak_batteries_1:1 "Khẩu Đội Phòng Không"
 tech_flak_batteries_1_desc:1 "Các khẩu đội pháo bắn đạn mảnh ở cự ly gần. Chúng đặc biệt nguy hiểm đối với phi đội đột kích của đối phương, nhưng cũng có thể phòng thủ chống tên lửa."
 tech_flak_batteries_2:1 "Đại Bác Phòng Không"
 tech_flak_batteries_2_desc:1 "Khẩu đội phòng không nâng cấp với các loại đạn mảnh mới uy lực hơn."
 tech_flak_batteries_3:1 "Hỏa Pháo Phòng Không"
 tech_flak_batteries_3_desc:1 "Các thuật toán theo dõi dự đoán cùng đạn pháo uy lực hơn khiến những khẩu đội này trở nên cực kỳ chết chóc đối với phi đội đột kích của địch."

 # Missile Branch
 tech_missiles_1:0 "Tên Lửa Hạt Nhân"
 tech_missiles_1_desc:0 "Tên lửa đối không ngoài không gian trang bị đầu đạn hạt nhân đương lượng nổ cao. Dù dựa trên công nghệ cũ thời tiền vũ trụ, thứ vũ khí thô sơ theo cơ chế \"bắn rồi quên\" này lại hiệu quả đáng ngạc nhiên ở tầm xa."
 tech_missiles_2:0 "Tên Lửa Nhiệt Hạch"
 tech_missiles_2_desc:0 "Những tên lửa đối không vũ trụ cập nhật này có đầu đạn nhiệt hạch mạnh hơn và hiệu suất bay cải tiến."
 tech_missiles_3:0 "Tên Lửa Phản Vật Chất"
 tech_missiles_3_desc:0 "Tên lửa tiên tiến trang bị đầu đạn phản vật chất cực mạnh. Hệ thống dẫn đường mới và cải tiến giúp chúng tăng khả năng tìm thấy mục tiêu."
 tech_missiles_4:0 "Tên Lửa Lượng Tử"
 tech_missiles_4_desc:0 "Phiên bản mới nhất của tên lửa đối không vũ trụ, biến thể nâng cấp này mang đầu đạn uy lực phi thường rút năng lượng từ chân không điểm không."
 tech_missiles_5:0 "Tên Lửa Kẻ Cướp Bóc (Marauder)"
 tech_missiles_5_desc:0 "Những tên lửa tối tân này trang bị trí tuệ AI hạn chế tích hợp trên khoang, cải thiện đáng kể hiệu suất và khả năng bám đuổi mục tiêu."
 tech_swarmer_missiles_1:0 "Tên Lửa Bầy Đàn"
 tech_swarmer_missiles_1_desc:0 "Các tên lửa nhỏ hơn này được phóng theo loạt và được thiết kế đặc thù để áp đảo hệ thống phòng thủ điểm của đối phương."
 tech_swarmer_missiles_2:0 "Tên Lửa Lốc Xoáy"
 tech_swarmer_missiles_2_desc:0 "Kỹ thuật thu nhỏ mới cho phép chúng ta trang bị cho tên lửa bầy đàn đầu đạn mạnh hơn và hiệu suất bay ưu việt hơn."

 # Torpedo Branch
 tech_torpedoes_1:0 "Ngư Lôi Không Gian"
 tech_torpedoes_1_desc:0 "Những ngư lôi này về cơ bản là tên lửa rất lớn di chuyển chậm. Chúng được trang bị đầu đạn mạnh hơn và bộ điều biến khiên cho phép lướt qua màng chắn năng lượng mà không bị cản trở."
 tech_torpedoes_2:0 "Ngư Lôi Bọc Giáp"
 tech_torpedoes_2_desc:0 "Ngư lôi không gian nâng cấp được bọc trong giáp sắt để chống chịu hỏa lực phòng thủ điểm của địch tốt hơn. Lớp giáp vỡ vụn thành các mảnh gây thêm sát thương khi ngư lôi phát nổ."
 tech_torpedoes_3:0 "Ngư Lôi Kẻ Hủy Diệt"
 tech_torpedoes_3_desc:0 "Ngư lôi tiên tiến với đầu đạn cực mạnh. Chúng có thiết kế thuôn gọn hơn, động cơ nhanh hơn và bộ điều biến khiên nâng cấp để xuyên qua các màng chắn năng lượng."

 # ###################################
 # Physics
 # ###################################

 # Science Ship Actions
 tech_deep_scan:0 "Thiết Bị Quét Sâu"
 tech_deep_scan_desc:0 "Không sử dụng" # TEMP
 tech_databank_uplinks:0 "Đường Truyền Dữ Liệu Lên"
 tech_databank_uplinks_desc:0 "Các dải sóng lượng tử dung lượng cao chuyên dụng cho truyền tải cơ sở dữ liệu giúp các hoạt động nghiên cứu có thể đồng bộ hóa gần như hoàn hảo qua khoảng cách bao la."
 tech_improved_databank_uplinks:0 "Thu Nhỏ Đường Truyền Dữ Liệu Lên"
 tech_improved_databank_uplinks_desc:0 "Việc thu nhỏ các bộ phát tại điểm cuối cho phép lắp đặt chúng thành các cụm, gia tăng hơn nữa băng thông truyền tải."

 # Physics Lab & related
 tech_basic_science_lab_1:0 "Phương Pháp Khoa Học"
 tech_basic_science_lab_1_desc:0 "Đưa ra các dự đoán có thể kiểm chứng về những hiện tượng quan sát được."
 tech_basic_science_lab_2:0 "Phòng Thí Nghiệm Vật Liệu Ngoại Lai"
 tech_basic_science_lab_2_desc:1 "Khi thám hiểm thiên hà, chúng ta liên tục bắt gặp các vật liệu và chất mới lạ chưa từng biết. Việc lập danh mục và phân tích các phát hiện này đòi hỏi những cơ sở nghiên cứu mới."
 tech_basic_science_lab_3:0 "Nghiên Cứu Đa Chiều"
 tech_basic_science_lab_3_desc:1 "Để mở rộng kho tàng tri thức, chúng ta phải xét đến mọi tầng bậc tồn tại. Một cảnh giới khoa học mới đang chờ đón chúng ta!"
 tech_physics_1:0 "Điện Toán Lượng Tử"
 tech_physics_1_desc:0 "Với tốc độ xử lý thách thức các giới hạn cổ điển, tiềm năng của máy tính lượng tử là vô biên. Công nghệ mang tính cách mạng này báo hiệu bước nhảy vọt vào các vùng đất mới của việc giải quyết vấn đề."
 tech_physics_2:0 "Lý Thuyết Trường Thống Nhất"
 tech_physics_2_desc:0 "Các lực cơ bản của vũ trụ có thể được điều tiết thông qua các trường vật lý. Nắm vững tiến trình này cho phép chúng ta đóng vai đấng sáng tạo — ít nhất là trong khuôn viên phòng thí nghiệm khoa học."
 tech_physics_3:0 "Sóng Trọng Lực Lượng Tử"
 tech_physics_3_desc:0 "Chúng ta đã biết trọng lực và thời gian gắn liền với nhau từ rất lâu trước khi chạm tới các vì sao. Giờ đây, hiểu biết của chúng ta về mối quan hệ độc đáo này đã đạt đến điểm bùng phát, cho phép thao túng các lực ở quy mô không tưởng."
 #tech_physics_4: "Thesis of Everything"
 #tech_physics_4_desc: "\"... therefore we postulate that the meaning of existence, and the origin and purpose of all creation can be summed up as a simple formula as follows...\""
 tech_administrative_ai:0 "AI Quản Trị Hành Chính"
 tech_administrative_ai_desc:0 "Mạch logic được tổ chức lại để điều hướng lòng nhiệt huyết học thuật."
 tech_administrative_ai_machine_intelligence:0 "Tối Ưu Hóa Học Thuật"
 tech_administrative_ai_desc_machine_intelligence:0 "Các chương trình con mới sẽ mài sắc sự tập trung của các đơn vị nghiên cứu và loại bỏ sự kém hiệu quả."
 tech_self_aware_logic:2 "Logic Tự Tiến Hóa"
 tech_self_aware_logic_desc:2 "Ưu tiên năng lực tự phản tỉnh."
 tech_sapient_ai:0 "AI Điện Tử Dương (Positronic)"
 tech_sapient_ai_desc:0 "Trí tuệ nhân tạo đang tiến hóa mở ra cánh cửa dẫn đến khả năng xuất hiện tri giác tổng hợp thực sự."

 tech_administrative_ai_hive_mind:0 "Bộ Tăng Cường Khớp Thần Kinh"
 tech_administrative_ai_desc_hive_mind:0 "Suy nghĩ trước khi hành động. Tâm Trí của chúng ta sẽ tiến hóa lên những tầm cao mới."
 tech_self_aware_logic_hive_mind:0 "Khớp Thần Kinh Tự Hành"
 tech_self_aware_logic_desc_hive_mind:0 "Một khối thống nhất không thể chia cắt dù ở cách xa."

 tech_positronic_implants:0 "Cấy Ghép Điện Tử Dương"
 tech_positronic_implants_desc:0 "Mở rộng tiềm năng thông qua ứng dụng điều khiển học có kiểm soát."
 tech_positronic_implants_machine_intelligence:0 "Bộ Xử Lý Điện Tử Dương"
 tech_positronic_implants_desc_machine_intelligence:0 "Mở ra những nẻo đường mới cho tư duy nhân tạo."

 tech_combat_computers_1:0 "Máy Tính Tác Chiến Chuyên Dụng"
 tech_combat_computers_1_desc:0 "Các ma trận chủ động được tinh chỉnh cho những nhiệm vụ chiến đấu cụ thể sẽ nâng cao đáng kể hiệu quả giao tranh." # The development of active combat personalities allows combat-AI to specialize heavily in specific tasks.
 tech_combat_computers_2:0 "Thuật Toán Tác Chiến Mở Rộng"
 tech_combat_computers_2_desc:0 "Những tiến bộ xa hơn trong thuật toán dự đoán cho phép tăng cường khả năng ra quyết định chiến thuật trên chiến trường."
 tech_combat_computers_3:0 "Mô Phỏng Tác Chiến Tri Giác"
 tech_combat_computers_3_desc:0 "Chạy các AI có tri giác qua những mô phỏng tác chiến cường độ cao mang lại hiểu biết sâu sắc vô giá về những tối ưu hóa tiềm năng cho các kỹ thuật đánh giá rủi ro." # The effectiveness of Ship-AIs have proved far greater with the sensation of a fear of death.
 tech_combat_computers_autonomous:0 "Trí Tuệ Phi Thuyền Tự Hành"
 tech_combat_computers_autonomous_desc:0 "Trao cho tàu chiến trí tuệ bán tự hành riêng sẽ cải thiện đáng kể khả năng phản ứng của chúng trong chiến đấu."
 tech_pd_tracking_1:0 "Biện Pháp Phản Chế Chủ Động"
 tech_pd_tracking_1_desc:0 "Cách phòng thủ tốt nhất là tấn công hiệu quả."
 tech_pd_tracking_2:0 "Hệ Thống Hỗ Trợ Liên Kết"
 tech_pd_tracking_2_desc:0 "Các mảng vũ khí phòng thủ chứng minh hiệu quả vượt trội hơn hẳn các biện pháp phản chế độc lập."
 tech_pd_tracking_3:0 "Thuật Toán Dự Đoán"
 tech_pd_tracking_3_desc:0 "Khả năng dự đoán tiên tiến làm tăng đáng kể độ chính xác của các hệ thống phản chế chủ động."
 tech_synchronized_defences:0 "Hệ Thống Phòng Thủ Đồng Bộ"
 tech_synchronized_defences_desc:0 "Căn chỉnh các quy chuẩn thực thi vũ khí phòng thủ và tấn công giúp tăng cường hiệu suất tổng thể."
 tech_global_research_initiative:1 "Sáng Kiến Nghiên Cứu Liên Hành Tinh"
 tech_global_research_initiative_desc:2 "Nỗ lực tạo lập các quỹ tài nguyên liên hành tinh và cấp phát các khoản trợ cấp nghiên cứu linh hoạt hơn."
 tech_neuro_quantum_links:0 "Liên Kết Thần Kinh Lượng Tử"
 tech_neuro_quantum_links_desc:0 "Cấy ghép thần kinh tiên tiến kết nối với các cụm máy tính lượng tử cho phép xử lý tư duy đa luồng."
 tech_cryostasis_1:0 "Tàu Thuộc Địa Tự Động Hóa"
 tech_cryostasis_1_desc:1 "Bằng cách giao quyền kiểm soát tàu thuộc địa cho máy tính trên tàu, phi hành đoàn và dân định cư có thể được đưa vào trạng thái ngủ đông lơ lửng."
 tech_cryostasis_1_wilderness: "Ủ Mầm Non"
 tech_cryostasis_1_wilderness_desc: "Bằng cách ươm các mầm non mới trong lớp đất bản địa của các thuộc địa mới, chúng ta có thể đẩy nhanh quá trình thích nghi môi trường."
 tech_cryostasis_1_machine_intelligence:0 "Drone Kiến Thiết Thuộc Địa"
 tech_cryostasis_1_desc_machine_intelligence:0 "Các phi đội drone xây dựng nhỏ nhưng hiệu quả được chứa trong khoang hàng của tàu thuộc địa. Khi kích hoạt trên bề mặt hành tinh, chúng đẩy nhanh đáng kể giai đoạn định cư ban đầu."
 tech_cryostasis_2:0 "Tàu Thuộc Địa Có Nhận Thức"
 tech_cryostasis_2_desc:1 "Các hệ thống đủ tiên tiến có khả năng tự tối ưu hóa nếu chúng nhận thức sâu sắc về mục đích mà chúng được tạo ra."
 tech_cryostasis_2_wilderness: "Ủ Mầm Vĩnh Cửu"
 tech_cryostasis_2_wilderness_desc: "Duy trì vĩnh viễn các giống mầm chuyên biệt có khả năng sinh tồn dưới mọi loại khí hậu sẽ giảm đáng kể thời gian chúng ta kiến tạo thế giới mới."
 tech_automated_exploration:0 "Giao Thức Thám Hiểm Tự Động"
 tech_automated_exploration_desc:0 "Một AI tiên tiến sẽ hỗ trợ các sĩ quan khoa học trong nhiệm vụ khám phá những thế giới kỳ lạ mới, tìm kiếm sự sống mới và nền văn minh mới, dũng cảm tiến tới những nơi chưa từng ai đặt chân. Tàu Khoa Học sẽ có thể khám phá thiên hà với sự trợ giúp của AI."
 tech_automated_exploration_machine_intelligence:0 "Thuật Toán Thám Hiểm Tự Trị"
 tech_automated_exploration_desc_machine_intelligence:0 "Thuật toán cập nhật và tiên tiến hơn không chỉ đẩy nhanh tiến độ khảo sát, mà còn cho phép các tài sản thám hiểm hoạt động lâu hơn trong không gian sâu mà không cần chỉ thị liên tục từ Trí Tuệ Máy Móc trung ương."
 tech_auxiliary_fire_control:0 "Kiểm Soát Hỏa Lực Phụ Trợ"
 tech_auxiliary_fire_control_desc:1 "$FIRE_CONTROL_1_DESC$"

 # Resources
 tech_exotic_gases:0 "Tinh Chế Khí Hiếm"
 tech_exotic_gases_desc:0 "Khí Hiếm có thể được sản xuất nhân tạo, nhưng đây là một quy trình khó khăn đòi hỏi thiết bị tinh chế tiên tiến."
 tech_volatile_motes:0 "Nhà Máy Vật Liệu Bất Ổn"
 tech_volatile_motes_desc:1 "Bên cạnh các mối lo ngại hiển nhiên về an toàn, việc tạo ra Hạt Bất Ổn nhân tạo là một quy trình cực kỳ tinh tế và phức tạp, đòi hỏi trang thiết bị chuyên dụng cao độ."
 tech_rare_crystals:0 "Sản Xuất Tinh Thể Hiếm"
 tech_rare_crystals_desc:1 "Quy trình kết tinh rất phức tạp và khó khăn, nhưng tinh thể tổng hợp có thể được chế tạo bằng cách sử dụng các nhà máy công nghiệp chuyên biệt."

 tech_mine_neutronium:0 "Khai Thác Neutronium"
 tech_mine_neutronium_desc:1 "Neutronium là một chất siêu đậm đặc cấu tạo từ các neutron, có thể được rèn thành lớp giáp có độ bền và sức chống chịu cực cao."
 tech_mine_dark_matter:0 "Thu Thập Vật Chất Tối"
 tech_mine_dark_matter_desc:1 "Vật chất ngoại lai này có nhiều đặc tính dường như thách thức các định luật vật lý. Trữ lượng có thể thu hoạch chỉ được tìm thấy gần Hố Đen hoặc trong một số tinh vân nhất định."

 # Ship Reactor Components
 tech_fission_power:0 "Năng Lượng Phân Hạch"
 tech_fission_power_desc:1 "Nguồn năng lượng này cấp điện cho tàu chiến thông qua phản ứng phân hạch kích thích, nhưng nó cũng tạo ra chất thải hạt nhân độc hại."
 tech_fusion_power:0 "Năng Lượng Nhiệt Hạch"
 tech_fusion_power_desc:1 "Các quy trình nhiệt hạch hạt nhân tạo ra lượng lớn năng lượng cho tàu chiến mà không đi kèm nhiều rủi ro như năng lượng phân hạch."
 tech_cold_fusion_power:0 "Năng Lượng Nhiệt Hạch Lạnh"
 tech_cold_fusion_power_desc:1 "Khả năng duy trì phản ứng nhiệt hạch ở nhiệt độ tương đối thấp sẽ mang lại thế hệ lò phản ứng nhiệt hạch mới cho tàu của chúng ta."
 tech_antimatter_power:0 "Năng Lượng Phản Vật Chất"
 tech_antimatter_power_desc:1 "Bằng cách khai thác năng lượng sinh ra từ các vụ hủy cặp vật chất/phản vật chất, hiệu suất phát điện cho tàu của chúng ta sẽ vượt trội hơn nhiều bậc độ lớn so với nhiệt hạch."
 tech_zero_point_power:0 "Năng Lượng Điểm Không"
 tech_zero_point_power_desc:1 "Những máy phát này chiết xuất năng lượng chân không, cung cấp nguồn năng lượng tàu gần như vô tận. Không có phương thức tạo năng lượng nào hiệu quả hơn thế."
 tech_dark_matter_power_core:0 "Năng Lượng Vật Chất Tối"
 tech_dark_matter_power_core_desc:1 "Các máy phát này bằng cách nào đó dường như rút năng lượng trực tiếp từ vật chất tối, cung cấp năng lượng tàu vượt xa những gì định luật vật lý cho phép."
 tech_dark_matter_propulsion:0 "Động Cơ Đẩy Vật Chất Tối"
 tech_dark_matter_propulsion_desc:0 "$SHIP_THRUSTER_5_DESC$"

 tech_reactor_boosters_1:0 "Bộ Tăng Áp Lò Phản Ứng"
 tech_reactor_boosters_1_desc:0 "$REACTOR_BOOSTER_1_DESC$"
 tech_reactor_boosters_2:0 "Bộ Tăng Áp Lò Phản Ứng Cải Tiến"
 tech_reactor_boosters_2_desc:0 "$REACTOR_BOOSTER_2_DESC$"
 tech_reactor_boosters_3:0 "Bộ Tăng Áp Lò Phản Ứng Tiên Tiến"
 tech_reactor_boosters_3_desc:0 "$REACTOR_BOOSTER_3_DESC$"

 # Shield Components
 tech_shields_1:0 "Bộ Lệch Hướng"
 tech_shields_1_desc:0 "Màn chắn lệch hướng năng lượng có thể chặn một lượng hỏa lực địch nhất định trước khi bị quá tải. Nhược điểm chính là chúng tiêu thụ lượng lớn năng lượng."
 tech_shields_2:0 "Bộ Lệch Hướng Cải Tiến"
 tech_shields_2_desc:0 "Màn chắn lệch hướng cập nhật này có thể chống chịu hỏa lực dữ dội hơn nữa trước khi quá tải."
 tech_shields_3:0 "Lá Chắn"
 tech_shields_3_desc:0 "Những máy phát lá chắn mới này đại diện cho thế hệ màng chắn năng lượng tiếp theo, thay thế công nghệ bộ lệch hướng cũ kỹ. Chúng mang lại khả năng bảo vệ vượt trội hơn rõ rệt."
 tech_shields_4:0 "Lá Chắn Tiên Tiến"
 tech_shields_4_desc:0 "Máy phát lá chắn cập nhật tạo ra một trường năng lượng thậm chí còn mạnh mẽ hơn. Chỉ có hỏa lực liên tục của đối phương mới có thể xuyên thủng rào chắn này."
 tech_shields_5:0 "Siêu Lá Chắn (Hyper Shields)"
 tech_shields_5_desc:0 "Những lá chắn năng lượng được gia cố và tôi cứng này vô cùng uy lực. Sự bảo vệ mà chúng mang lại là vô song."
 tech_shield_rechargers_1:0 "Tụ Điện Lá Chắn"
 tech_shield_rechargers_1_desc:1 "Các tụ điện này tích trữ năng lượng dư thừa có thể nhanh chóng chuyển đổi để tiếp viện cho lá chắn của phi thuyền."
 tech_shield_hardeners_1:0 "Tôi Cứng Lá Chắn"
 tech_shield_hardeners_1_desc:0 "$SHIELD_HARDENER_1_DESC$"
 tech_shield_hardeners_2:0 "Tôi Cứng Lá Chắn Tiên Tiến"
 tech_shield_hardeners_2_desc:0 "$SHIELD_HARDENER_2_DESC$"
 tech_planetary_shield_generator:0 "Lá Chắn Cấp Hành Tinh"
 tech_planetary_shield_generator_desc:0 "Việc tạo ra một lá chắn năng lượng mạnh mẽ bên trong bầu khí quyển hành tinh là thách thức lớn hơn so với chân không vũ trụ, nhưng nó mang lại khả năng phòng thủ đắc lực trước các cuộc bắn phá quỹ đạo."
 tech_dark_matter_deflector:0 "Bộ Lệch Hướng Vật Chất Tối"
 tech_dark_matter_deflector_desc:0 "Những bộ lệch hướng này sử dụng vật chất tối để làm chệch hướng đạn đạo bay tới theo cách dường như hoàn toàn bất chấp quy luật tự nhiên."
 tech_psionic_shield:0 "Lá Chắn Tâm Linh"
 tech_psionic_shield_desc: "$tech_psionic_shield_desc.1$ $INDIVIDUAL_PSIONIC_SPECIALISTS$$tech_psionic_shield_desc.2$"
 tech_psionic_shield_desc.1: "Những lá chắn cực kỳ hùng mạnh này được tạo ra từ năng lượng tâm linh thuần khiết bởi một đội ngũ"
 tech_psionic_shield_desc.2: ". Sức mạnh của họ còn được khuếch đại hơn nữa bằng các mảng thiết bị phát sóng tâm linh quy mô lớn."
 tech_psionic_shield_desc.shroud_forged.shared: "đã được vật chất hóa thông qua việc dẫn truyền năng lượng tâm linh thuần khiết từ Cõi Màn Sương"
 tech_psionic_shield_gestalt: "$tech_psionic_shield$"
 tech_psionic_shield_gestalt_desc: "$tech_psionic_shield_desc.1$ $GESTALT_PSIONIC_SPECIALISTS$$tech_psionic_shield_desc.2$"
 tech_psionic_shield_shroud_forged: "$tech_psionic_shield$"
 tech_psionic_shield_shroud_forged_desc: "Những tấm lá chắn cực kỳ hùng mạnh này $tech_psionic_shield_desc.shroud_forged.shared$$tech_psionic_shield_desc.2$"
 tech_psionic_barrier: "Màng Chắn Tâm Linh"
 tech_psionic_barrier_desc: "$tech_psionic_barrier_desc.1$ $INDIVIDUAL_PSIONIC_SPECIALISTS$$tech_psionic_barrier_desc.2$"
 tech_psionic_barrier_desc.1: "Những màng chắn này được tạo ra từ năng lượng tâm linh thuần khiết bởi một đội ngũ"
 tech_psionic_barrier_desc.2: ". Chúng có thể ngăn chặn một số hỏa lực bắn tới, tương tự như hệ thống làm lệch hướng năng lượng của chúng ta, nhưng không tiêu tốn lượng năng lượng quá mức."
 tech_psionic_barrier_gestalt: "$tech_psionic_barrier$"
 tech_psionic_barrier_gestalt_desc: "$tech_psionic_barrier_desc.1$ $GESTALT_PSIONIC_SPECIALISTS$$tech_psionic_barrier_desc.2$"
 tech_psionic_barrier_shroud_forged: "$tech_psionic_barrier$"
 tech_psionic_barrier_shroud_forged_desc: "Những màng chắn này $tech_psionic_shield_desc.shroud_forged.shared$$tech_psionic_barrier_desc.2$"

 # Sensor Components
 tech_sensors_2:0 "Cảm Biến Trọng Lực"
 tech_sensors_2_desc:0 "Những cảm biến này được tinh chỉnh để tìm kiếm bất kỳ biến đổi trọng lực nào trong không gian, chẳng hạn như biến đổi do sự hiện diện của một phi thuyền liên sao tạo ra."
 tech_sensors_3:0 "Cảm Biến Không Gian Con"
 tech_sensors_3_desc:0 "Các cảm biến phát hiện sự biến động không gian con để lại sau đuôi các phi thuyền đang du hành. Độ nhạy và tầm quét của chúng vượt trội hơn mảng cảm biến trọng lực."
 tech_sensors_4:0 "Cảm Biến Tachyon"
 tech_sensors_4_desc:0 "Cảm biến tiên tiến dựa vào các chùm tia tachyon xoay tròn để phát hiện chuyển động của tàu ngay cả ở khoảng cách cực xa."
 tech_orbital_sensor_array:0 "Mảng Cảm Biến Quỹ Đạo"
 tech_orbital_sensor_array_desc:0 "Mảng cảm biến mạnh mẽ có thể tích hợp vào cấu trúc trạm không gian quỹ đạo. Chúng mang lại phạm vi bao quát cảm biến tuyệt hảo cho vùng không gian xung quanh."

 # Power Plants
 tech_power_plant_1:0 "Tụ Điện Năng Lượng Cao"
 tech_power_plant_1_desc:0 "Tụ điện có khả năng lưu trữ lượng lớn năng lượng là một trong những nền tảng của mọi nền văn minh hiện đại."
 tech_power_plant_2:0 "Điều Biến Lực Trường"
 tech_power_plant_2_desc:0 "Các trường được điều biến cho phép gia tăng sản lượng và cải thiện hiệu suất năng lượng."
 tech_power_plant_3:0 "Trạng Thái Năng Lượng Lượng Tử"
 tech_power_plant_3_desc:0 "Các nguyên lý vướng víu lượng tử cơ bản được áp dụng vào sản xuất năng lượng mang lại sự gia tăng đáng kể về sản lượng điện."
 tech_power_plant_4:0 "Thao Túng Trường Lượng Tử"
 tech_power_plant_4_desc:1 "Sự chồng chập lượng tử của các cuộn dây năng lượng, đồng thời vừa nạp vừa xả."
 #tech_power_plant_5:0 "Matter to Energy Conversion"
 #tech_power_plant_5_desc:0 ""
 tech_stellar_absorption:0 "Hấp Thụ Năng Lượng Sao"
 #tech_stellar_absorption_desc:0 "Unused" # TEMP
 tech_power_hub_1:0 "Quản Trị Năng Lượng Toàn Cầu"
 tech_power_hub_1_desc:1 "Các cơ sở cân bằng tải có thể cải thiện đáng kể độ ổn định của lưới điện địa phương và truyền tải điện năng dư thừa trở lại các tụ điện trung tâm."
 tech_power_hub_2:0 "Lưới Điện Hành Tinh"
 tech_power_hub_2_desc:1 "Một lưới điện được tái cấu trúc và hợp nhất sẽ làm giảm thiểu hơn nữa tổn thất năng lượng khi truyền tải trên khoảng cách xa."

 # Warp Drives
 tech_wormhole_generation_1:0 "Lỗ Sâu Không Gian Con"
 tech_wormhole_generation_1_desc:0 "Bằng cách đào hầm trực tiếp xuyên qua không gian con, một đường dẫn tạm thời có thể được thiết lập giữa hai điểm khác nhau trong không gian thông thường. Việc du hành giữa các điểm này sẽ diễn ra gần như tức thì."
 tech_wormhole_generation_2:0 "Ma Trận Hiệu Chuẩn Lỗ Sâu"
 tech_wormhole_generation_2_desc:0 "Việc tạo ra một lỗ sâu ổn định đòi hỏi thời gian và tiêu tốn lượng năng lượng khổng lồ, nhưng quy trình có thể được tinh gọn nhờ sử dụng các bộ hiệu chuẩn đặc biệt."
 tech_wormhole_generation_3:0 "Trường Giam Giữ Lỗ Sâu"
 tech_wormhole_generation_3_desc:0 "Các trường giam giữ này cho phép tạo ra những lỗ sâu mạnh mẽ hơn mà không lo kích hoạt sự cố giải phóng năng lượng liên hoàn bất ngờ trong không gian con."
 tech_hyper_drive_1:0 "Du Hành Siêu Không Gian"
 tech_hyper_drive_1_desc:0 "Tựa như những sợi tơ nhện, cõi giới siêu không gian đa chiều chạy xuyên qua các giếng trọng lực của hầu hết các ngôi sao. Về mặt lý thuyết, việc du hành nhanh hơn ánh sáng hoàn toàn khả thi dọc theo các siêu lộ không gian này."
 tech_hyper_drive_2:0 "Điểm Đột Phá Siêu Lộ"
 tech_hyper_drive_2_desc:0 "Chúng ta đã xác định được sự tồn tại của các điểm trong không gian nơi phi thuyền tiêu tốn ít năng lượng hơn để \"đột phá\" tiến vào siêu lộ. Điều này sẽ dẫn đến thế hệ động cơ siêu không gian mới."
 tech_hyper_drive_3:0 "Dòng Trôi Siêu Không Gian"
 tech_hyper_drive_3_desc:0 "Thế hệ động cơ siêu không gian mới có khả năng tiếp cận các dòng trôi không gian con hiện hữu bên trong siêu không gian. Điều này giúp nâng cao đột biến hiệu suất động cơ."
 tech_hyperlane_mapping:0 "Lập Bản Đồ Siêu Lộ"
 tech_hyperlane_mapping_desc:0 "Dù chúng ta không du hành bằng siêu lộ, việc lập bản đồ mạng lưới siêu lộ rộng lớn của thiên hà vẫn đem lại lợi thế rõ rệt khi đối đầu với những kẻ sử dụng chúng."
 tech_warp_drive_1:0 "Du Hành Warp"
 tech_warp_drive_1_desc:0 "Bằng cách bao bọc con tàu trong trường bẻ cong không gian (warp) và tạo ra bong bóng không gian con xung quanh nó, vận tốc vượt ánh sáng về mặt lý thuyết là hoàn toàn khả thi."
 tech_warp_drive_2:0 "Bộ Ổn Định Trường Warp"
 tech_warp_drive_2_desc:0 "Kỹ thuật ổn định cải tiến cho trường warp sẽ cho phép các phi thuyền của chúng ta du hành xa hơn trong khi tiêu hao ít năng lượng hơn."
 tech_warp_drive_3:0 "Phễu Thu Hạt Động Cơ Warp"
 tech_warp_drive_3_desc:0 "Những phễu thu đột phá này được gắn vào động cơ warp và đóng vai trò như các bộ thu hạt, liên tục bổ sung nguồn nhiên liệu cho phi thuyền liên sao."
 tech_jump_drive_1:0 "Động Cơ Nhảy Cóc (Jump Drive)"
 tech_jump_drive_1_desc:1 "Một kỳ quan công nghệ mang tính đột phá, Động Cơ Nhảy Cóc xé rách không-thời gian cục bộ và tái sắp xếp nó ở cấp độ lượng tử cho trùng khớp với đích đến — nhờ đó con tàu dường như \"nhảy cóc\" gần như tức thì giữa các hệ sao."
 tech_psi_jump_drive_1:0 "Động Cơ Nhảy Cóc Tâm Linh"
 tech_psi_jump_drive_1_desc:1 "Động Cơ Nhảy Cóc Tâm Linh khai thác năng lượng tâm linh do phi hành đoàn phát ra để cưỡng ép con tàu xuyên qua chính kết cấu của thực tại, lập tức \"nhảy cóc\" qua những khoảng cách bao la."
 tech_wormhole_stabilization:0 "Ổn Định Hóa Lỗ Sâu"
 tech_wormhole_stabilization_desc:0 "Lỗ sâu không gian con tự nhiên là một thực thể rất thất thường, và mức năng lượng dao động của nó thường khiến việc di chuyển an toàn giữa hai đầu liên kết trở nên bất khả thi. Tuy nhiên, vẫn có những phương thức để tạm thời ổn định ma trận của nó."
 tech_gateway_activation:0 "Kích Hoạt Cổng Không Gian"
 tech_gateway_activation_desc:0 "Khả năng tái kích hoạt các trạm Cổng Không Gian bị bỏ hoang rải rác khắp thiên hà có tiềm năng rút ngắn đáng kể thời gian di chuyển liên sao."
 tech_gateway_construction:0 "Xây Dựng Cổng Không Gian"
 tech_gateway_construction_desc:0 "Việc xây dựng các trạm Cổng Không Gian mới cho phép chúng ta thiết lập mạng lưới di chuyển siêu tốc, tạo nên cuộc cách mạng trong giao thông liên sao."

 # Aura Components
 tech_shield_recharge_aura_1:0 "Trường Tụ Điện"
 tech_shield_recharge_aura_1_desc:1 "Các trường cục bộ chứa hạt tích điện có thể tiếp thêm năng lượng cho những tụ điện lá chắn đã cạn kiệt."
 tech_aura_shield_dampener:0 "Bộ Giảm Chấn Lá Chắn"
 #tech_aura_shield_dampener_desc:0 ""
 tech_aura_quantum_destabilizer:1 "Bộ Phá Ổn Định Lượng Tử"
 tech_aura_quantum_destabilizer_desc:1 "Bộ phá ổn định lượng tử kích động trường lượng tử cục bộ, gây nhiễu loạn thiết bị ngắm bắn nhạy cảm trên các tàu chiến thù địch."
 tech_enigmatic_disruption_field:0 "Trường Gây Nhiễu Bí Ẩn"
 tech_enigmatic_disruption_field_desc:1 "Bằng cách phủ ngập một khu vực cục bộ bằng các xung điện từ yếu được điều chế ngẫu nhiên, hệ thống lá chắn và vũ khí của đối phương có thể bị vô hiệu hóa một phần."

 # Aux
 tech_enigmatic_encoder:0 "Bộ Mã Hóa Bí Ẩn"
 tech_enigmatic_encoder_desc:1 "Bộ Mã Hóa Bí Ẩn làm xáo trộn dữ liệu lộ trình bay theo thiết kế bất khả tri trước khi truyền trở lại sở chỉ huy hạm đội."
 tech_enigmatic_decoder:0 "Bộ Giải Mã Bí Ẩn"
 tech_enigmatic_decoder_desc:1 "Mặc dù mang lại kết quả trung bình trong các bài kiểm tra tiêu chuẩn, độ chính xác của các thuật toán dự đoán của Bộ Giải Mã Bí Ẩn dường như lại tăng lên khi đường bay của mục tiêu càng trở nên thất thường."

 # Ascension perk
 tech_ascension_theory:0 "Lý Thuyết Thăng Hoa"
 tech_ascension_theory_desc:0 "Lịch sử của chúng ta là một chu kỳ lặp lại của những bước nhảy vọt ngoạn mục về công nghệ, chính trị và văn hóa; những bước nhảy này thường bắt đầu sau giai đoạn biến động và nối tiếp bằng thời kỳ tương đối ổn định. Bằng cách nhận diện các tiền đề cốt lõi tái diễn này, chúng ta có thể rút ngắn chu kỳ vì lợi ích của chính mình."
 tech_ascension_theory_apoc:0 "$tech_ascension_theory$"
 tech_ascension_theory_apoc_desc:0 "$tech_ascension_theory_desc$"

 # ###################################
 # Physics - Weapons
 # ###################################

 # Laser Branch
 tech_lasers_1:0 "Laser Đỏ"
 tech_lasers_1_desc:0 "Vũ khí laser bắn các chùm ánh sáng hội tụ vào mục tiêu, gây sát thương thông qua việc tạo ra nhiệt lượng cực lớn."
 tech_lasers_2:0 "Laser Xanh Lam"
 tech_lasers_2_desc:0 "Mạnh mẽ hơn laser đỏ, các biến thể màu xanh này phát ra bức xạ điện từ ở bước sóng có màu lam hoặc tím đối với hầu hết sinh vật hữu cơ."
 tech_lasers_3:0 "Laser Tử Ngoại (UV)"
 tech_lasers_3_desc:0 "Laser tử ngoại là phiên bản cập nhật và uy lực hơn của tiền bối laser xanh. Chính xác và có tính hủy diệt, loại vũ khí này có khả năng gây ra thiệt hại nặng nề."
 tech_lasers_4:0 "Laser Tia X"
 tech_lasers_4_desc:0 "Những tia laser này có bước sóng ngắn hơn vũ khí laser tử ngoại, nhưng mang sức tàn phá khủng khiếp hơn."
 tech_lasers_5:0 "Laser Tia Gamma"
 tech_lasers_5_desc:0 "Bức xạ điện từ do laser gamma phát ra có tần số cực cao. Tiềm năng hủy diệt của chúng là vô song trong lĩnh vực vũ khí laser."
 tech_energy_lance_1:0 "Thương Hạt (Particle Lance)"
 tech_energy_lance_1_desc:1 "Những vũ khí năng lượng hạng nặng này bắn các chùm hạt hội tụ gây sát thương cực lớn. Kích thước mảng phát sóng giới hạn việc sử dụng chúng trên thiết giáp hạm và tàu titan."
 tech_energy_lance_2:0 "Thương Tachyon (Tachyon Lance)"
 tech_energy_lance_2_desc:1 "Phiên bản uy lực hơn của thương hạt, vũ khí này bắn ra một chùm tia tachyon mang năng lượng khổng lồ. Tương tự tiền nhiệm, phạm vi trang bị bị giới hạn ở thiết giáp hạm và tàu titan."
 tech_perdition_beam:0 "Chùm Tia Đoạt Mệnh (Perdition Beam)"
 tech_perdition_beam_desc:0 "Một mảng đồ sộ gồm các ống dẫn khuếch đại năng lượng liên kết bắn ra chùm tia có hỏa lực vô tiền khoáng hậu. Kích thước khổng lồ khiến nó chỉ có thể lắp đặt trên chiến hạm lớp Titan."

 # Plasma Weapons
 tech_plasma_1:0 "Súng Phun Plasma"
 tech_plasma_1_desc:0 "Vũ khí phóng các quả cầu plasma năng lượng cao có sức tàn phá vào mục tiêu. Những quả đạn plasma này cực kỳ hiệu quả trong việc đốt cháy và ăn mòn giáp tàu chiến."
 tech_plasma_2:0 "Máy Gia Tốc Plasma"
 tech_plasma_2_desc:0 "Những máy gia tốc mới này bắn các khối plasma năng lượng cao với trường giam giữ cải tiến, giúp hạn chế rò rỉ năng lượng khi đạn bay trong không gian tới mục tiêu."
 tech_plasma_3:0 "Đại Bác Plasma"
 tech_plasma_3_desc:0 "Đỉnh cao của vũ khí plasma, những khẩu đại bác này là phiên bản quân sự hóa toàn diện của các súng phun plasma sơ khai. Đạn plasma của chúng thậm chí còn nguy hiểm chết chóc hơn."
 tech_arc_emitter_1:0 "Bộ Phóng Tia Hồ Quang"
 tech_arc_emitter_1_desc:1 "Vũ khí mạnh mẽ phóng ra luồng sét hồ quang mang năng lượng hỗn loạn vào mục tiêu, có khả năng bỏ qua một phần giáp và lá chắn."
 tech_arc_emitter_2:0 "Bộ Phóng Tia Hồ Quang Hội Tụ"
 tech_arc_emitter_2_desc:0 "Bộ phóng nâng cấp này trang bị các thấu kính hội tụ tốt hơn, tạo ra sự phóng năng lượng uy lực hơn hẳn."

 # Disruptor Weapons
 tech_disruptors_1:0 "Pháo Phân Rã (Disruptor)"
 tech_disruptors_1_desc:1 "Pháo phân rã bắn các luồng năng lượng cao làm suy yếu và phá hủy liên kết phân tử giữa các nguyên tử cấu thành mục tiêu. Chúng có khả năng xuyên qua cả lá chắn lẫn giáp để tàn phá trực tiếp thân tàu và thủy thủ đoàn đối phương."
 tech_disruptors_2:0 "Pháo Phân Rã Ion"
 tech_disruptors_2_desc:1 "Những khẩu pháo phân rã nâng cấp này bắn các luồng hạt ion mang sức hủy diệt dữ dội hơn vào mục tiêu."
 tech_disruptors_3:0 "Pháo Phân Rã Pha"
 tech_disruptors_3_desc:1 "Pháo phân rã đương lượng cực cao bắn các điện tích năng lượng lượng tử, gây thiệt hại khủng khiếp cho bất kỳ kẻ bất hạnh nào ngáng đường chúng."
 tech_energy_torpedoes_1:1 "Bệ Phóng Proton"
 tech_energy_torpedoes_1_desc:2 "Những quả đạn năng lượng này bao gồm các hạt proton được tập trung mật độ cao, có khả năng gây thiệt hại nặng nề cho thân tàu đối phương."
 tech_energy_torpedoes_2:1 "Bệ Phóng Neutron"
 tech_energy_torpedoes_2_desc:1 "Đạn năng lượng nâng cấp dựa vào neutron thay vì proton để gia tăng sức công phá hủy diệt."
 null_void_beam:0 "Chùm Tia Hư Không (Null Void)"
 null_void_beam_desc:1 "Bằng cách khai thác bản chất hỗn độn của Vùng Hư Không, chùm tia này thực sự có thể triệt tiêu năng lượng."

 # Critter Weapons
 tech_extradimensional_weapon_1:0 "Khí Tài Chiều Cao (Extradimensional)"
 tech_extradimensional_weapon_1_desc:1 "Ứng dụng các nguyên lý thao túng năng lượng chiều không gian thứ 5 vào các mặt phẳng không gian thấp hơn cho phép tạo ra những vũ khí năng lượng cực mạnh."
 tech_mining_drone_weapon_1:0 "Laser Drone Khai Khoáng"
 tech_mining_drone_weapon_1_desc:2 "Sử dụng thấu kính hội tụ cường độ cao kết hợp với tần số bắn dao động giúp tạo ra các chùm laser đủ mạnh để khai thác tiểu hành tinh hoặc bắn hạ kẻ thù."
 tech_space_cloud_weapon_1:0 "Dẫn Xuất Sét Mây Vũ Trụ"
 tech_space_cloud_weapon_1_desc:1 "Mây Hư Không sử dụng điện tích sinh ra từ các chất khí đậm đặc cấu thành lõi của chúng để giải phóng các tia sét plasma bốc cháy. Sử dụng thành phần khí tương tự kết hợp với ống dẫn chuyên dụng cho phép chế tạo vũ khí sét uy lực."
 tech_blue_crystal_weapon_1:0 "Tụ Điện Tinh Thể Lam"
 tech_blue_crystal_weapon_1_desc:1 "Thực Thể Pha Lê lưu trữ bức xạ sao trong cơ thể lăng kính và có thể hội tụ để phát ra các chùm tia tương tự laser. Lấy mẫu hình lăng kính của loại sapphire làm nền tảng, chúng ta có thể chế tạo tụ điện laser phát năng lượng ở bước sóng tương tự."
 tech_green_crystal_weapon_1:0 "Tụ Điện Tinh Thể Lục"
 tech_green_crystal_weapon_1_desc:1 "Thực Thể Pha Lê lưu trữ bức xạ sao trong cơ thể lăng kính và có thể hội tụ để phát ra các chùm tia tương tự laser. Lấy mẫu hình lăng kính của loại ngọc lục bảo làm nền tảng, chúng ta có thể chế tạo tụ điện laser phát năng lượng ở bước sóng tương tự."
 tech_yellow_crystal_weapon_1:0 "Tụ Điện Tinh Thể Vàng"
 tech_yellow_crystal_weapon_1_desc:1 "Thực Thể Pha Lê lưu trữ bức xạ sao trong cơ thể lăng kính và có thể hội tụ để phát ra các chùm tia tương tự laser. Lấy mẫu hình lăng kính của loại topaz làm nền tảng, chúng ta có thể chế tạo tụ điện laser phát năng lượng ở bước sóng tương tự."
 tech_red_crystal_weapon_1:0 "Tụ Điện Tinh Thể Đỏ"
 tech_red_crystal_weapon_1_desc:1 "Thực Thể Pha Lê lưu trữ bức xạ sao trong cơ thể lăng kính và có thể hội tụ để phát ra các chùm tia tương tự laser. Lấy mẫu hình lăng kính của loại ruby làm nền tảng, chúng ta có thể chế tạo tụ điện laser phát năng lượng ở bước sóng tương tự."

 # ###################################
 # Society
 # ###################################

 # Farming
 tech_hydroponics:0 "Canh Tác Thủy Canh"
 tech_hydroponics_desc:0 "Canh tác thủy canh trong môi trường kiểm soát cho phép cây trồng phát triển ở những vùng khí hậu mà bình thường việc làm nông là bất khả thi."
 tech_industrial_farming:0 "Nông Nghiệp Công Nghiệp Hóa"
 tech_industrial_farming_desc:0 "Các nông trại công nghiệp quy mô lớn trồng nông sản giàu dinh dưỡng cho phép nền văn minh tăng trưởng dân số lên gấp nhiều lần."
 tech_eco_simulation:1 "Mô Phỏng Sinh Thái"
 tech_eco_simulation_desc:2 "Kỹ thuật canh tác có thể được tinh chỉnh hơn nữa nhờ các mô phỏng máy tính tinh vi về những môi trường và hình thái thời tiết khác nhau. Điều này giúp năng suất cây trồng trở nên dễ dự đoán hơn."
 tech_gene_crops:0 "Cây Trồng Chuyển Gen"
 tech_gene_crops_desc:1 "Kỹ thuật di truyền tinh vi trên cây trồng giúp gia tăng năng suất và cải thiện cả hương vị lẫn hàm lượng dinh dưỡng."
 tech_nano_vitality_crops:0 "Cây Trồng Hoạt Tính Nano"
 tech_nano_vitality_crops_desc:1 "Việc cấy một lượng nhỏ máy siêu vi nano vào các chuỗi cây trồng giúp tạo ra loại nông sản siêu chống chịu, mà thành phần hóa học của nó có thể được điều chỉnh trong suốt vòng đời."
 #tech_pure_seed_farming:0 "Pure-seed Farming"
 #tech_pure_seed_farming_desc:0 ""
 tech_nutrient_replication:0 "Nhân Bản Dinh Dưỡng"
 tech_nutrient_replication_desc:1 "Quy trình tái tạo nông sản tổng hợp đòi hỏi thu gom nhiều chất thải để tạo ra một lượng nhỏ nông sản, nhưng dẫu vậy vẫn mang lại cú hích đáng kể cho sản lượng nông nghiệp."

 # Resources
 tech_engos_vapor:0 "Tinh Chế Hơi Engos"
 tech_engos_vapor_desc:3 "Một chất kích thích tự nhiên giúp mọi dạng sự sống thích nghi và tiến hóa. Nó cũng có thể dùng làm chất dẫn điện cực mạnh cho vũ khí năng lượng."
 tech_pitharan_dust:0 "Tinh Chế Bụi Pitharan"
 tech_pitharan_dust_desc:3 "Loại bụi mịn này là chất kích thích tự nhiên có trên một số thế giới. Nó có tác dụng an thần đối với hầu hết sinh vật và có thể dùng như một biện pháp phi bạo lực để xoa dịu những cá thể thù địch."
 tech_mine_zro:0 "Chưng Cất Bụi Zro"
 tech_mine_zro_desc:3 "$tech_mine_zro_desc.1$ $ORGANIC_INGESTED$ $tech_mine_zro_desc.2$ $individuals_key$$tech_mine_zro_desc.3$ $ORGANIC_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_desc.1: "Một loại sol khí cực kỳ quý hiếm chứa các hạt ngoại lai. Nó lắng đọng trên một số thế giới qua các vụ va chạm thiên thạch, nhưng nguồn gốc thực sự vẫn là một bí ẩn. Nếu"
 tech_mine_zro_desc.2: "bởi những người có thiên phú tâm linh"
 tech_mine_zro_desc.3: ", Bụi Zro đóng vai trò như một chất tăng cường cực mạnh (và gây nghiện)"
 tech_mine_zro_desc.4: "giúp khuếch đại các năng lực tâm linh."
 tech_mine_zro_machine_gestalt:0 "$tech_mine_zro$"
 tech_mine_zro_machine_gestalt_desc:3 "$tech_mine_zro_desc.1$ $MACHINE_INGESTED$ $tech_mine_zro_desc.2$ $units_key$$tech_mine_zro_desc.3$ $MACHINE_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_machine_non_gestalt:0 "$tech_mine_zro$"
 tech_mine_zro_machine_non_gestalt_desc:3 "$tech_mine_zro_desc.1$ $MACHINE_INGESTED$ $tech_mine_zro_desc.2$ $individuals_key$$tech_mine_zro_desc.3$ $MACHINE_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_hive:0 "$tech_mine_zro$"
 tech_mine_zro_hive_desc: "$tech_mine_zro_desc.1$ $ORGANIC_INGESTED$ $tech_mine_zro_desc.2$ $drones_key$$tech_mine_zro_desc.3$ $ORGANIC_DRUG$ $tech_mine_zro_desc.4$"
 tech_mine_zro_wilderness:0 "$tech_mine_zro$"
 tech_mine_zro_wilderness_desc: "$tech_mine_zro_desc.1$ $ORGANIC_INGESTED$ $tech_mine_zro_desc.2$ $symbionts_key$$tech_mine_zro_desc.3$ $ORGANIC_DRUG$ $tech_mine_zro_desc.4$"

 tech_society_1: "Sinh Học Ngoại Tinh"
 tech_society_1_desc: "Nghiên cứu về sự sống ngoại tinh đã vượt xa việc lập danh mục đơn thuần. Bằng cách khảo sát cấu trúc và chiến lược sinh tồn của các sinh vật tiến hóa dưới những vì sao xa xôi, chúng ta mở ra những con đường mới trong y học, thích ứng và thiết kế."
 tech_society_2: "Dệt Mạng Thần Kinh"
 tech_society_2_desc: "Thông qua giàn giáo sợi trục đệ quy và cấu trúc lưới khớp thần kinh, chúng ta đã phát triển các phương pháp tái tổ chức cấu trúc điện hóa của vật chất có ý thức. Các neuron không chỉ đơn thuần truyền dẫn — chúng đan xen, tổ chức và ghi nhớ. Giờ đây, chúng thực hiện điều đó theo đúng thiết kế của chúng ta."
 tech_society_3: "Tổng Hợp Cấu Trúc Sinh Học"
 tech_society_3_desc: "Sự sống, trong muôn vàn hình thái choáng ngợp, được cấu thành từ những khuôn mẫu lặp lại và các cấu trúc mô-đun. Bằng cách giải mã và nhân bản chúng ở mọi cấp độ, giờ đây chúng ta nắm giữ một bản thiết kế toàn diện về sinh học. Thiên nhiên hầu như chẳng còn điều gì mà chúng ta không thấu hiểu, và càng ít điều chúng ta không thể tái tạo."

#  tech_society_1:0 "Standardized Interstellar Timekeeping"
#  tech_society_1_desc:1 "In an era where interstellar travel is commonplace, the adoption of a unified temporal framework serves as a linchpin for progress. Whether for organizing galactic commutes or facilitating astrophysical observations, standard time represents a visionary stride towards unity and precision."
 #tech_society_2:0 "Xenobiology"
 #tech_society_2_desc:1 "The study of xenobiology invites us to explore the possibility of life beyond conventional paradigms, thriving in environments far removed from our own. Every new biosphere allows for parallels to be drawn and the origins of life itself to become clearer."
 #tech_society_3:0 "Exoplanetary Logistics"
 #tech_society_3_desc:1 "Comprehensive logistical systems optimize the movement of people, resources, and information across interstellar distances. This paradigm not only promotes cohesion between core world and colony, but serves as a testament to our adaptability and resilience in the face of large-scale challenges."
 #tech_society_4:0 "Origins of Sapience"
 #tech_society_4_desc:1 "By deciphering the neural and cognitive mechanisms that underpin sapience, researchers can now delineate its boundaries and constraints."
 tech_alien_life_studies:1 "Dị Chủng Học (Xenology)"
 tech_alien_life_studies_desc:1 "Nghiên cứu hệ động vật của các thế giới khác mang lại hiểu biết sâu sắc về hành vi ngoại tinh, cho phép chúng ta nhận diện và thuần hóa các thực thể hiền hòa."
 tech_xeno_zoo:0 "Vườn Thú Ngoại Tinh"
 tech_xeno_zoo_desc:1 "Sau khi nghiên cứu nhiều dạng sống ngoại tinh và nắm rõ các rủi ro tiềm tàng trong việc giam giữ chúng, chúng ta sẽ có thể thu thập các mẫu vật sống để trưng bày."
 tech_colonization_1:0 "Giao Thức Thế Giới Mới"
 tech_colonization_1_desc:1 "Tính toán tài nguyên và trang thiết bị cần thiết để thiết lập một thuộc địa hành tinh cho phép chúng ta đưa những người tiên phong dũng cảm lên các phi thuyền thuộc địa vĩ đại, tin tưởng rằng họ sẽ sống sót qua hành trình dài xuyên qua các vì sao để tới ngôi nhà mới."
 tech_colonization_2:0 "Lọc Khí Quyển"
 tech_colonization_2_desc:1 "Bằng cách điều chỉnh hệ thống lọc khí quyển theo từng địa điểm để loại bỏ tốt hơn các yếu tố không mong muốn, điều kiện sống tại thuộc địa có thể được cải thiện."
 tech_colonization_3:0 "Thích Nghi Môi Trường Khắc Nghiệt"
 tech_colonization_3_desc:1 "Nghiên cứu sâu hơn về các môi trường nguy hiểm trên các hành tinh khác giúp xoa dịu những khó khăn mà những người đi khai hoang gặp phải trong cuộc sống hàng ngày tại các thế giới xa lạ."
 tech_colonization_4:0 "Bồi Bổ Đất Ngoại Tinh"
 tech_colonization_4_desc:1 "Nghiên cứu sâu rộng về các loại đất khác nhau và khả năng hỗ trợ cây trồng của chúng sẽ giúp cải thiện điều kiện sống của những người định cư trên các thế giới xa lạ."
 tech_colonization_5:1 "Nghiên Cứu Tích Hợp Sinh Thái"
 tech_colonization_5_desc:2 "Nghiên cứu bổ sung về các khí hậu hành tinh khác nhau sẽ cho phép dân cư chúng ta định cư trên những thế giới trước đây được coi là quá khắc nghiệt."
 tech_tomb_world_adaption:0 "Thích Nghi Thế Giới Mộ Địa"
 tech_tomb_world_adaption_desc:0 "Thông qua nghiên cứu toàn diện về môi trường bị nhiễm xạ, chúng ta sẽ cho phép người định cư khai hoang những thế giới đã bị tàn phá bởi chiến tranh hạt nhân."
 tech_free_enterprises:0 "Doanh Nghiệp Tự Do"
 #tech_free_enterprises_desc:0 ""
 tech_frontier_initiatives:0 "Sáng Kiến Biên Cương"
 tech_frontier_initiatives_desc:1 "Quản lý mối liên kết giữa khu vực tư nhân và chính phủ, cấp trợ cấp cho các nhà đầu tư phù hợp, cho phép các sáng kiến tư nhân tham gia vào quá trình thuộc địa hóa."
 tech_frontier_traditions:0 "Truyền Thống Biên Cương"
 tech_frontier_traditions_desc:1 "Tinh thần tiên phong nhất định được thể hiện rõ nét trong thứ tự ưu tiên của các công trình xây dựng trên quỹ đạo."
 tech_frontier_collectives:0 "Tập Thể Biên Cương"
 tech_frontier_collectives_desc:1 "Lịch sử đã chứng minh các mô hình tập thể là cấu trúc xã hội hiệu quả nhất cho các vùng đất định cư mới."
 tech_frontier_commissars:0 "Chính Ủy Biên Cương"
 tech_frontier_commissars_desc:1 "Các nghiên cứu chỉ ra rằng kiểm soát xã hội nghiêm ngặt có thể là yếu tố then chốt cho sự kiên cường liên tục của các thuộc địa non trẻ."
 tech_cryostasis:0 "Ngủ Đông Sinh Học"
 #tech_cryostasis_desc:0 ""
 tech_xeno_ecology_1:0 "Chinh Phục Sinh Thái Ngoại Tinh"
 #tech_xeno_ecology_1_desc:0 ""
 tech_xeno_ecology_2:0 "Kiểm Soát Môi Trường"
 #tech_xeno_ecology_2_desc:0 ""
 tech_reveal_luxuries_1:0 "Kinh Tế Học Liên Sao"
 #tech_reveal_luxuries_1_desc:0 ""
 tech_reveal_luxuries_2:0 "Thị Trường Thiên Hà"
 #tech_reveal_luxuries_2_desc:0 ""
 tech_orbital_hydroponics:0 "Thủy Canh Quỹ Đạo"
 tech_orbital_hydroponics_desc:1 "Những thách thức vốn có trong việc trồng trọt trong môi trường không trọng lực là khá đặc thù, nhưng hoàn toàn có thể khắc phục được."
 tech_arctic_colonization:0 "Thuộc Địa Hóa Bắc Cực"
 tech_arctic_colonization_desc:1 "Các khu trú ẩn chuyên biệt và hệ thống duy trì sự sống tự thích ứng cho phép thuộc địa hóa những vùng khí hậu ngoại tinh."
 tech_tundra_colonization:0 "Thuộc Địa Hóa Lãnh Nguyên"
 tech_tundra_colonization_desc:1 "$tech_arctic_colonization_desc$"
 tech_ocean_colonization:0 "Thuộc Địa Hóa Đại Dương"
 tech_ocean_colonization_desc:1 "$tech_arctic_colonization_desc$"
 tech_arid_colonization:0 "Thuộc Địa Hóa Vùng Đất Khô Hạn"
 tech_arid_colonization_desc:1 "$tech_arctic_colonization_desc$"
 tech_tropical_colonization:0 "Thuộc Địa Hóa Vùng Nhiệt Đới"
 tech_tropical_colonization_desc:1 "$tech_arctic_colonization_desc$"
 tech_desert_colonization:0 "Thuộc Địa Hóa Sa Mạc"
 tech_desert_colonization_desc:1 "$tech_arctic_colonization_desc$"
 tech_continental_colonization:0 "Thuộc Địa Hóa Lục Địa"
 tech_continental_colonization_desc:1 "$tech_arctic_colonization_desc$"
 tech_basic_health: "Chăm Sóc Y Tế"
 tech_basic_health_desc: "$job_healthcare_desc$"
 tech_frontier_health:1 "Y Tế Di Truyền"
 tech_frontier_health_desc:1 "Việc thuộc địa hóa các thế giới ngoại tinh đã mở ra một lĩnh vực nghiên cứu y sinh học hoàn toàn mới."
 tech_frontier_health_machine_intelligence:0 "Linh Kiện Mô-đun"
 tech_frontier_health_desc_machine_intelligence:0 "Việc sử dụng các bộ phận mô-đun khi lắp ráp các đơn vị máy móc mới sẽ giúp tinh giản quy trình và làm cho việc sửa chữa trong tương lai dễ dàng hơn."
 tech_frontier_hospital:1 "Tái Tạo Tế Bào"
 tech_frontier_hospital_desc:2 "Khi đế chế chúng ta phát triển, hiểu biết về sinh học cũng sâu sắc hơn. Các phương pháp điều trị y tế tiên tiến ở cấp độ tế bào đã cho phép đạt được những bước tiến vượt bậc đối với sức khỏe dân số sinh học."
 tech_frontier_hospital_machine_intelligence:0 "Nhà Máy Thông Minh"
 tech_frontier_hospital_desc_machine_intelligence:0 "Các nhà máy này về cơ bản là những thực thể tự nhận thức, liên tục tự tối ưu hóa mà chỉ cần sự can thiệp tối thiểu từ Trí Tuệ Máy Móc trung ương."
 tech_modular_components:1 "$tech_frontier_health_machine_intelligence$"
 tech_modular_components_desc:1 "$tech_frontier_health_desc_machine_intelligence$"
 tech_intelligent_factories:1 "$tech_frontier_hospital_machine_intelligence$"
 tech_intelligent_factories_desc:1 "$tech_frontier_hospital_desc_machine_intelligence$"
 tech_mountain_range:0 "Tái Tạo Bề Mặt Hành Tinh"
 tech_mountain_range_desc:1 "Với sự ra đời của năng lượng nhiệt hạch sạch, tự động hóa và công nghệ nén vật chất, việc chuyển từ san phẳng đỉnh núi sang san phẳng toàn bộ dãy núi chỉ là vấn đề thời gian."
 tech_volcano:0 "Kỹ Thuật Địa Thấu Sâu"
 tech_volcano_desc:1 "Những tiến bộ trong công nghệ vật liệu và kỹ thuật khai thác giếng sâu cho phép tiến hành kỹ thuật địa chất ở độ sâu và nhiệt độ trước đây không tưởng. Các điểm nóng magma giờ đây có thể được khai thác, dập tắt hoặc thậm chí di dời."
 tech_dangerous_wildlife:0 "Loại Bỏ Động Vật Hoang Dã Nguy Hiểm"
 tech_dangerous_wildlife_desc:1 "Phá vỡ môi trường sống tự nhiên theo chiến thuật kết hợp với các mũi tuần tra tìm-diệt có thể loại bỏ hiệu quả các loài động vật hoang dã nguy hiểm trong thời gian rất ngắn."
 tech_dense_jungle:0 "Chất Làm Rụng Lá Chọn Lọc"
 tech_dense_jungle_desc:1 "Việc lập danh mục kỹ lưỡng, giải trình tự gen và mô phỏng máy tính các hệ sinh thái thực vật ngoại lai, cùng với kỹ thuật chỉnh sửa gen và cơ chế phát tán, sẽ cho phép chúng ta tái định hình các quần thể thực vật ngoại tinh theo ý muốn."
 tech_quicksand_basin:0 "Phục Hồi Thổ Nhưỡng"
 tech_quicksand_basin_desc:1 "Quá trình bồi tụ đất tự nhiên thường mất hàng triệu năm. Với kỹ thuật thủy lực cắt phá tiên tiến, hóa kỹ nghệ và quản lý thủy lực, ngay cả lớp nền nghèo nàn nhất cũng có thể biến thành tầng đất mặt màu mỡ."
 tech_noxious_swamp:0 "Làm Chủ Thủy Lực Ngoại Tinh"
 tech_noxious_swamp_desc:1 "Các chủng tộc có tri giác đã khai hoang đầm lầy suốt hàng nghìn năm. Một hệ thống phối hợp gồm các máng dẫn nước mô-đun, trạm bơm, xe xích xử lý hóa chất và máy đầm đất tự động có thể khai hoang đất đai với tốc độ vô tiền khoáng hậu."
 tech_massive_glacier:0 "Mạng Lưới Kiểm Soát Khí Hậu"
 tech_massive_glacier_desc:1 "Hệ thống gương phản xạ và tấm che trên quỹ đạo có thể tạo ra những thay đổi ngoạn mục đối với khí hậu hành tinh khi được quản lý đúng cách."
 tech_toxic_kelp:0 "Quản Lý Sinh Thái Đại Dương"
 tech_toxic_kelp_desc:1 "Với đủ năng lực xử lý, mạng lưới cảm biến và các trạm phân tán, ngay cả các dòng hải lưu cũng có thể được kiểm soát ở mức độ tinh vi."
 tech_deep_sinkhole:0 "Thuộc Địa Hóa Lòng Đất"
 tech_deep_sinkhole_desc:1 "Nhiều hành tinh sở hữu các khoảng trống ngầm rộng lớn dưới bề mặt. Kỹ thuật thám hiểm, khai thác và xây dựng dưới lòng đất có thể gia tăng đáng kể diện tích có thể sinh sống trên một số thế giới."

 # Trade
 tech_space_trading:1 "Công Ty Thương Mại Ngoại Tinh"
 tech_space_trading_desc:1 "Thương mại xuyên khoảng cách liên sao đặt ra một loạt thách thức mới cần phải vượt qua. Điều tối quan trọng là phải vận chuyển hàng hóa từ hệ sao này sang hệ sao khác một cách kịp thời và trên hết là tiết kiệm chi phí."

 # Terraforming
 tech_terrestrial_sculpting:0 "Điêu Khắc Địa Cầu"
 tech_terrestrial_sculpting_desc:1 "Không có giải pháp đơn giản nào cho bài toán tái định hình vỏ hành tinh ở quy mô vĩ mô — chỉ có những chiếc xẻng lớn hơn và các mũi khoan được triển khai từ quỹ đạo."
 tech_atmospheric_manipulation:0 "Thao Túng Khí Quyển"
 tech_atmospheric_manipulation_desc:1 "Bộ điều hòa độ ẩm và các thiết bị phát tán hóa chất là bước đầu tiên hướng tới việc thay đổi căn bản bầu khí quyển."
 tech_ecological_adaptation:0 "Thích Ứng Sinh Thái"
 tech_ecological_adaptation_desc:0 "Bằng cách thích nghi hóa hệ sinh thái hành tinh trước những biến đổi môi trường quy mô lớn, chúng ta có thể biến quá trình cải tạo địa cầu thành một tiến trình ít xáo trộn hơn."
 tech_climate_restoration:2 "Phục Hồi Khí Hậu"
 tech_climate_restoration_desc:1 "Bằng cách nâng cao hiểu biết về chuyển hóa khí quyển, chúng ta sẽ có thể cải tạo ngay cả những thế giới bị tàn phá sinh thái nặng nề nhất."
 tech_volcanic_terraforming: "Cải Tạo Địa Hình Núi Lửa"
 tech_volcanic_terraforming_desc: "Những tiến bộ trong công nghệ vật liệu và kỹ thuật khai thác giếng sâu cho phép tiến hành kỹ thuật địa chất ở độ sâu và nhiệt độ trước đây không tưởng. Chúng ta có thể cải tạo một Thế Giới Núi Lửa thành một hành tinh ôn đới."
 tech_gaia_creation:0 "Kiến Tạo Thế Giới Gaia"
 tech_gaia_creation_desc:0 "Việc kiến tạo các hành tinh Gaia — những thế giới hoàn hảo cho hầu hết mọi dạng sống — là minh chứng tối thượng cho sự tinh thông của một giống loài trong nghệ thuật cải tạo địa cầu."

 # Genetics
 tech_genome_mapping:0 "Lập Bản Đồ Hệ Gen"
 tech_genome_mapping_desc:1 "Lập bản đồ hệ gen của một cá thể thông qua giải trình tự DNA mở ra cơ hội cho các liệu pháp và phương pháp điều trị y tế được cá nhân hóa."
 tech_epigenetic_triggers:0 "Cò Kích Hoạt Biểu Sinh"
 tech_epigenetic_triggers_desc:1 "Kỹ thuật methyl hóa DNA tiên tiến cho phép thực hiện những thay đổi có ý nghĩa chức năng đối với bất kỳ hệ gen nào."
 TECH_UNLOCK_EPIGENETICS_TITLE:0 "§HMở khóa Tính năng:§! Cò Kích Hoạt Biểu Sinh"
 TECH_UNLOCK_EPIGENETICS_DESC:0 "Cho phép chúng ta loại bỏ Đặc Tính Tiền Tri Giác khỏi Chủng Tộc Sinh Học thông qua Biến Đổi Chủng Tộc."
 tech_cloning:0 "Nhân Bản Vô Tính"
 tech_cloning_desc:1 "Những đột phá trong kỹ thuật loại bỏ nhân tế bào và công nghệ tử cung nhân tạo cho phép sản xuất hàng loạt các cá thể dựa trên một bản mẫu di truyền chung."
 tech_gene_banks:0 "Ngân Hàng Gen"
 tech_gene_banks_desc:1 "Ngân hàng gen chọn lọc và bảo tồn các hệ gen sẵn có để triển khai cho các bản sao nhân bản."
 tech_glandular_acclimation:0 "Thích Nghi Tuyến Nội Tiết"
 tech_glandular_acclimation_desc:0 "Thông qua việc tinh chỉnh sinh học các tuyến nội tiết, chúng ta có thể thay đổi khả năng chống chịu môi trường của một chủng tộc cho phù hợp với nhu cầu của chúng ta."
 tech_gene_seed_purification:0 "Tinh Khiết Hóa Mầm Gen"
 tech_gene_seed_purification_desc:1 "Kỹ thuật tinh khiết hóa nucleotide cho phép phân lập và tinh chế những đặc tính di truyền đặc biệt mong muốn."
 tech_morphogenetic_field_mastery:0 "Làm Chủ Trường Hình Thái Phát Sinh"
 tech_morphogenetic_field_mastery_desc:1 "Khởi đầu từ một nỗ lực thuần túy dược phẩm, những tiến bộ trong hiểu biết của chúng ta về trường hình thái phát sinh cho phép giao tiếp trực tiếp trong tiềm thức với các đơn vị hữu cơ."
 tech_gene_tailoring:0 "Cắt Gọt Gen"
 tech_gene_tailoring_desc:1 "Phổ biến rộng rãi các công cụ chỉnh sửa gen chắc chắn sẽ mang lại tác động tích cực đối với sự phát triển của chủng tộc chúng ta."
 tech_gene_tailoring_modifier_desc:0 "$species_trait_points_add$: $POINTS|0=+$"
 tech_gene_tailoring_overtuned: "$tech_gene_tailoring$"
 tech_gene_tailoring_overtuned_desc: "$tech_gene_tailoring_desc$"
 tech_gene_expressions:0 "Biểu Hiện Gen Mục Tiêu"
 tech_gene_expressions_desc:1 "Kiểm soát nghiêm ngặt hơn quá trình tổng hợp RNA và protein ở cấp độ tế bào."
 #tech_gene_expressions_modifier_desc:0 "$species_trait_points_add$: $POINTS|0=+$"
 TECH_UNLOCK_GENE_EXPRESSIONS_TITLE: "§HMở khóa Đặc tính:§! $trait_auto_mod_biological$"
 TECH_UNLOCK_GENE_EXPRESSIONS_DESC: "Cho phép chúng ta thêm §Y$trait_auto_mod_biological$§! vào Chủng Tộc Hữu Cơ thông qua Biến Đổi Chủng Tộc."
 TECH_UNLOCK_VOCATIONAL_GENES_TITLE: "§HMở khóa Biến Đổi Chủng Tộc:§! Chỉnh Sửa Gen Nghề Nghiệp"
 TECH_UNLOCK_VOCATIONAL_GENES_DESC: "['concept_vocational_traits'] có thể được §YBỏ đi§! bằng Biến Đổi Chủng Tộc"
 tech_selected_lineages:0 "Tuyển Chọn Huyết Thống"
 tech_selected_lineages_desc:1 "Kế hoạch sinh sản cẩn trọng nên được khuyến khích, tránh lãng phí những di sản di truyền quý giá."
 tech_capacity_boosters:0 "Tăng Cường Năng Lực"
 tech_capacity_boosters_desc:1 "Chúng ta không để mặc cho may rủi, bất kể chi phí nào. Thông qua việc tinh lọc nghiêm ngặt các ngân hàng DNA, chúng ta tạo dựng nên những nhà lãnh đạo của tương lai."
 tech_regenerative_hull_tissue:0 "Mô Thân Tàu Tái Sinh"
 tech_regenerative_hull_tissue_desc:0 "Một phiên bản vi khuẩn gốc silicon được biến đổi gen có tiềm năng được điều khiển để tái tạo các vật liệu phi hữu cơ."
 tech_vitality_boosters:0 "Tăng Cường Sức Sống"
 tech_vitality_boosters_desc:1 "Nơi cơ thể suy kiệt, khoa học sẽ can thiệp."
 tech_lithoid_transgenesis:0 "Chuyển Gen Thể Đá (Silicate)"
 tech_lithoid_transgenesis_desc:0 "Những điểm tương đồng giữa sự sống gốc silicon và gốc carbon cho phép chúng ta tổng hợp các đặc tính tiến hóa Thể Đá vào các loài gốc carbon."
 TECH_UNLOCK_LITHOID_GENETICS_TITLE:0 "§HMở khóa Tính năng:§! Chuyển Gen Thể Đá"
 TECH_UNLOCK_LITHOID_GENETICS_DESC:0 "Cho phép chúng ta thêm Đặc Tính Thể Đá vào Chủng Tộc Sinh Học thông qua Biến Đổi Chủng Tộc."
 tech_plantoid_transgenesis:0 "Chuyển Gen Thực Vật"
 tech_plantoid_transgenesis_desc:0 "Với sự thúc đẩy nhân tạo nhất định, các đặc tính thích nghi tiến hóa ở các loài thực vật có thể được sao chép sang những dạng sống khác."
 TECH_UNLOCK_PLANTOID_GENETICS_TITLE:0 "§HMở khóa Tính năng:§! Chuyển Gen Thực Vật"
 TECH_UNLOCK_PLANTOID_GENETICS_DESC:0 "Cho phép chúng ta thêm Đặc Tính Thực Vật vào Chủng Tộc Hữu Cơ thông qua Biến Đổi Chủng Tộc."
 tech_leviathan_transgenesis:0 "Chuyển Gen Thủy Quái (Leviathan)"
 tech_leviathan_transgenesis_desc:0 "Quần thể động vật thiên hà sở hữu những khả năng thích nghi đáng kinh ngạc với sự sống trong không gian liên sao. Làm chủ các đặc tính này sẽ là thắng lợi di truyền vĩ đại của chúng ta."
 TECH_UNLOCK_LEVIATHAN_GENETICS_TITLE:0 "§HMở khóa Tính năng:§! Chuyển Gen Thủy Quái"
 TECH_UNLOCK_LEVIATHAN_GENETICS_DESC:0 "Cho phép chúng ta thêm Đặc Tính Thủy Quái vào Chủng Tộc Hữu Cơ thông qua Biến Đổi Chủng Tộc."
 # Fleet Organization
 tech_doctrine_fleet_size_1:0 "Học Thuyết: Tác Chiến Không Gian"
 tech_doctrine_fleet_size_1_desc:1 "Thích ứng dần với thực tế tác chiến trong không gian sâu cho phép chúng ta điều phối hiệu quả các cuộc diễn tập quy mô lớn hơn."
 tech_doctrine_fleet_size_2:0 "Học Thuyết: Đội Hình Phản Ứng"
 tech_doctrine_fleet_size_2_desc:1 "Thích ứng dần với thực tế tác chiến trong không gian sâu cho phép chúng ta điều phối hiệu quả các cuộc diễn tập quy mô lớn hơn."
 tech_doctrine_fleet_size_3:0 "Học Thuyết: Chiến Tranh Liên Sao"
 tech_doctrine_fleet_size_3_desc:1 "Thích ứng dần với thực tế tác chiến trong không gian sâu cho phép chúng ta điều phối hiệu quả các cuộc diễn tập quy mô lớn hơn."
 tech_doctrine_fleet_size_4:0 "Học Thuyết: Bản Mẫu Hạm Đội Linh Hoạt"
 tech_doctrine_fleet_size_4_desc:1 "Thích ứng dần với thực tế tác chiến trong không gian sâu cho phép chúng ta điều phối hiệu quả các cuộc diễn tập quy mô lớn hơn."
 tech_doctrine_fleet_size_5:0 "Học Thuyết: Trận Hình Đại Hạm Đội"
 tech_doctrine_fleet_size_5_desc:1 "Thích ứng dần với thực tế tác chiến trong không gian sâu cho phép chúng ta điều phối hiệu quả các cuộc diễn tập quy mô lớn hơn."
 tech_interstellar_fleet_traditions:0 "Truyền Thống Hạm Đội Liên Sao"
 tech_interstellar_fleet_traditions_desc:1 "Kho tàng tri thức về hành vi chiến đấu sẽ trở nên vô dụng nếu thiếu đi một bộ quy tắc chỉ huy nghiêm ngặt quản lý việc áp dụng nó."
 tech_command_matrix:1 "Ma Trận Chỉ Huy"
 tech_command_matrix_desc:1 "Tái cấu trúc chuỗi chỉ huy và xác định rõ sự phụ thuộc lẫn nhau giữa các sĩ quan giúp hạm đội phản ứng nhanh nhạy và hiệu quả hơn."
 tech_doctrine_navy_size_1:0 "Học Thuyết: Hỗ Trợ Hạm Đội"
 tech_doctrine_navy_size_1_desc:1 "Khi các cuộc viễn chinh ngoài hệ sao trở nên phổ biến hơn, điều quan trọng là phải cung cấp hỗ trợ trên mặt đất cho các hạm đội trở về."
 tech_doctrine_navy_size_2:1 "Học Thuyết: Tàu Tiếp Tế Hỗ Trợ"
 tech_doctrine_navy_size_2_desc:1 "Một hạm đội không thể vận hành chỉ bằng nhiệt huyết. Để đảm bảo nguồn tiếp tế liên tục cho các vật tư thiết yếu, chúng ta nên tổ chức lực lượng hậu cần thành các tàu hỗ trợ chuyên trách."
 tech_doctrine_navy_size_3:0 "Học Thuyết: Hậu Cần Liên Sao"
 tech_doctrine_navy_size_3_desc:0 "Kẻ nghiệp dư bàn về chiến thuật, chuyên gia bàn về hậu cần. Bằng cách đảm bảo hạm đội được tiếp tế thường xuyên và hiệu quả, chúng ta có thể gia tăng số lượng tàu có thể duy trì hoạt động hiệu quả."
 tech_doctrine_navy_size_4:0 "Học Thuyết: Sĩ Quan Liên Lạc Hạm Đội"
 tech_doctrine_navy_size_4_desc:0 "Bằng cách duy trì đội ngũ sĩ quan liên lạc hạm đội chuyên nghiệp, chúng ta có thể cải thiện thông tin liên lạc và việc truyền đạt mệnh lệnh thông suốt trong toàn chuỗi chỉ huy."
 tech_refit_standards:1 "Tiêu Chuẩn Nâng Cấp Hoán Cải"
 tech_refit_standards_desc:1 "Chuẩn hóa quy trình nâng cấp và cải hoán linh kiện tàu chiến có thể mang lại hiệu suất cải thiện vượt bậc."

 # Army Organization
 tech_centralized_command_hive_mind:0 "Trung Tâm Chỉ Huy Drone"
 tech_centralized_command_desc_hive_mind:0 "Bằng cách thành lập các cơ sở huấn luyện nơi các drone tự trị có thể học cách chỉ huy các đồng loại thứ cấp, chúng ta sẽ đạt được sự linh hoạt và hiệu quả cao hơn trên chiến trường."
 tech_centralized_command:0 "Chỉ Huy Tập Trung"
 tech_centralized_command_desc:1 "Việc thành lập các sở chỉ huy chuyên trách cho mọi cấp độ tác chiến quân sự giúp tôi luyện một hạm đội tinh nhuệ và đặt nền móng tốt hơn cho công tác huấn luyện quân sự tương lai."
 tech_centralized_command_machine_intelligence:0 "Sở Chỉ Huy Bảo Trì"
 tech_centralized_command_desc_machine_intelligence:0 "Mọi cỗ máy đều cần bảo trì, điều này đặc biệt đúng với các cỗ máy chiến tranh. Đội ngũ bảo trì chuyên trách sẽ giảm thiểu tối đa các sự cố hỏng hóc do hao mòn và hạ thấp chi phí sửa chữa."
 tech_combat_training:0 "Huấn Luyện Tác Chiến"
 tech_combat_training_desc:1 "Chương trình huấn luyện toàn diện hơn cho tân binh, bao gồm các kịch bản chiến đấu thực tế, chuẩn bị kỹ càng cho họ trước khi ra chiến trường."
 tech_combat_training_machine_intelligence:0 "Sửa Chữa Chiến Trường"
 tech_combat_training_desc_machine_intelligence:0 "Bằng cách trang bị cơ sở dữ liệu kỹ thuật cho các đơn vị tác chiến mặt đất, chúng có thể tự chẩn đoán và tự sửa chữa hạn chế ngay tại thực địa."
 tech_ground_defense_planning:0 "Quy Hoạch Phòng Thủ Mặt Đất"
 tech_ground_defense_planning_desc:0 "Có nhiều đế chế ngoại tinh sẵn sàng đánh chiếm các thế giới của chúng ta. Chúng ta phải chuẩn bị sẵn sàng đối phó với chúng nếu tình huống xấu nhất xảy ra."
 tech_global_defense_grid:0 "Lưới Phòng Thủ Toàn Cầu"
 tech_global_defense_grid_desc:0 "Giá trị chiến lược của một hệ thống phòng thủ tốt ngày nay vẫn giữ nguyên tính thời sự như đối với các bậc tiền nhân trong quá khứ xa xôi. Công nghệ không làm cho các công sự trở nên lỗi thời — nó chỉ thay đổi những yêu cầu của chúng."

 # Psionics
 tech_psionic_theory:0 "Lý Thuyết Tâm Linh"
 tech_psionic_theory_desc:1 "Tâm trí theo nhiều phương diện là hình ảnh phản chiếu của chính vũ trụ, một tiểu vũ trụ thu nhỏ. Không phải mọi sinh thể đều đạt tới mức độ thấu thị này, nhưng tâm trí của họ là công cụ vĩ đại hơn bất kỳ thứ gì khác."
 tech_telepathy:0 "Thần Giao Cách Cảm"
 tech_telepathy_desc: "$tech_telepathy_desc.1$ tâm trí có khả năng kết nối với các cá thể khác, trở thành một thực thể vĩ đại hơn."
 tech_telepathy_desc.1: "Một khi đã thích nghi hoàn toàn với các nền tảng của Tâm Linh Học,"
 tech_telepathy_machine_gestalt: "$tech_telepathy$"
 tech_telepathy_machine_gestalt_desc: "$tech_telepathy_desc.1$ $getbrainname_machine$ của chúng ta có thể vươn ra bên ngoài mạng lưới tập thể."
 tech_telepathy_hive: "$tech_telepathy$"
 tech_telepathy_hive_desc: "$tech_telepathy_desc.1$ $getbrainname_hive$ của chúng ta có thể vươn ra bên ngoài mạng lưới tập thể."
 tech_telepathy_wilderness: "$tech_telepathy$"
 tech_telepathy_wilderness_desc: "$tech_telepathy_desc.1$ $getbrainname_wilderness$ của chúng ta có thể vươn ra bên ngoài mạng lưới tập thể."
 #tech_transcendent_thought_desc:0 ""
 tech_precognition_interface:0 "Giao Diện Tiên Tri"
 tech_precognition_interface_desc:1 "Những tiến bộ trong lĩnh vực Tâm Linh Học gợi mở khả năng chế tạo các máy tính tác chiến có khả năng đọc và phân tích các xung động của đặc vụ ngoại cảm trước khi chúng được xử lý trong nhận thức."
 tech_psi_jump_drives:0 "Động Cơ Nhảy Cóc Tâm Linh"
 tech_psi_jump_drives_desc:1 "Động Cơ Nhảy Cóc Tâm Linh khai thác năng lượng tâm linh do phi hành đoàn phát ra để cưỡng ép con tàu xuyên qua chính kết cấu của thực tại, lập tức \"nhảy cóc\" qua những khoảng cách bao la."

 # Trade and Diplomacy
 tech_xeno_outreach:0 "Tiếp Cận Ngoại Tinh"
 tech_xeno_outreach_desc:1 "Những phức tạp của thương mại liên sao rất giống với bất kỳ giao dịch nào khác, nhưng được thực hiện ở quy mô làm lu mờ toàn bộ lịch sử thương mại của hầu hết các nền văn minh tiền FTL."
 tech_xeno_relations:0 "Quan Hệ Ngoại Tinh"
 tech_xeno_relations_desc:1 "Sự phức tạp của ngoại giao liên sao đòi hỏi phải thiết lập mối liên kết với các thế lực ngoại bang nhằm thúc đẩy các mục tiêu của đế chế."
 tech_xeno_supremacy:0 "Tối Thượng Ngoại Tinh"
 tech_xeno_supremacy_desc:1 "Chúng ta băng qua bãi mìn của những biến động quyền lực thiên hà với một mục đích duy nhất: vươn lên đỉnh cao thống trị."
 tech_xeno_diplomacy:0 "Ngoại Giao Ngoại Tinh"
 tech_xeno_diplomacy_desc:1 "Nâng cao hiểu biết của chúng ta về tương tác với — và thao túng — sinh vật ngoại tinh là bước đi cần thiết để hình thành các liên minh liên sao bền vững hơn."
 tech_federation_code: "Bộ Quy Tắc Liên Bang"
 tech_federation_code_desc: "Một Liên bang phải dựa trên nhiều điều hơn là thiện chí và tham vọng chung. Bộ quy tắc này tạo nền móng cho một trật tự liên sao thống nhất, bảo đảm hợp tác và ổn định giữa các thành viên."
 tech_federation_code_effect: "§HMở khóa Ngoại giao:§! Thành lập Liên bang"
 tech_galactic_ambitions:1 "Mở Rộng Không Gian Sao"
 tech_galactic_ambitions_desc:3 "Tương lai của chúng ta nằm ở biển sao bao la."
 tech_manifest_destiny:0 "Thiên Mệnh Hiển Nhiên"
 tech_manifest_destiny_desc:1 "Chúng ta phải có lòng can đảm để nắm bắt số phận của mình và biến những gì thuộc về tiền định thành hiện thực."
 tech_interstellar_campaigns:0 "Chiến Dịch Liên Sao"
 tech_interstellar_campaigns_desc:0 "Một cỗ máy chiến tranh vận hành trơn tru là chìa khóa để gây ảnh hưởng ở quy mô thiên hà. Được hậu thuẫn bởi sức mạnh quân sự, chúng ta có thể tuyên bố chủ quyền đối với hầu như bất cứ thứ gì mình muốn."
 tech_galactic_campaigns:0 "Chiến Dịch Thiên Hà"
 tech_galactic_campaigns_desc:0 "Những cải tiến hơn nữa đối với bộ máy hành chính mang lại khả năng phô diễn quyền lực rộng lớn xuyên qua các vì sao, cùng tầm ảnh hưởng quân sự cần thiết để thực thi các yêu sách của chúng ta."
 tech_existential_campaigns: "Chiến Dịch Tồn Vong"
 tech_existential_campaigns_desc: "Khi chính sự tồn vong bị đe dọa, khái niệm chiến tranh mất đi ý nghĩa thông thường. Những chiến dịch này được tiến hành không phải để tranh giành quyền thống trị, mà là để bảo đảm sự tồn tại tiếp diễn của nền văn minh chúng ta."
 tech_existential_campaigns_effect: "§HMở khóa Lý do Chiến tranh (Casus Belli):§! Trục Xuất Tồn Vong"

 # Empire Management
 tech_planetary_government:0 "Chính Quyền Thống Nhất"
 tech_planetary_government_desc:1 "Khi một thuộc địa đã được thiết lập vững chắc và những người tiên phong trở thành công dân, nhu cầu về một chính quyền địa phương mạnh mẽ mang lại sự ổn định sẽ lấn át nhu cầu linh hoạt thời kỳ đầu khai hoang."
 tech_planetary_government_machine_intelligence:0 "Thực Thể Hóa Thống Nhất"
 tech_planetary_government_desc_machine_intelligence:0 "Các thuộc địa của chúng ta sẽ không bao giờ đạt được sự vận hành ổn định nếu thiếu cơ sở hạ tầng chuyên biệt phục vụ bản thể mạng lưới của chúng ta."
 tech_planetary_government_hive_mind:0 "Mạng Thần Kinh Thống Nhất"
 tech_planetary_government_desc_hive_mind:0 "Các thuộc địa của chúng ta sẽ khô héo thành hư không nếu thiếu sự hiện diện ổn định của bản thể tập thể. Sự hiện diện không ngừng nghỉ của chúng ta bảo đảm cho một bầy đàn hưng thịnh."
 tech_planetary_unification:0 "Hợp Nhất Xã Hội"
 tech_planetary_unification_desc:2 "Các bộ tộc cổ xưa từng tương tàn, các quốc gia lịch sử từng xung đột, giờ đây đã hợp nhất trong đế chế. Chúng ta không thể và sẽ không bao giờ sụp đổ." # We have progressed from warring tribes, from conflicting nations, to a unified Empire, a single will ready to grasp the stars.
 tech_planetary_unification_machine_intelligence:0 "Tiêu Chuẩn Dữ Liệu Đồng Nhất"
 tech_planetary_unification_desc_machine_intelligence:0 "Sự sai lệch sẽ không được dung thứ."
 tech_planetary_unification_hive_mind:0 "Hội Tụ Tiến Hóa"
 tech_planetary_unification_desc_hive_mind:0 "Lò luyện sinh thái nơi chúng ta chiến đấu vì sự sinh tồn đã khắc sâu những con đường kiên vững vào ký ức di truyền. Chúng ta là khối liên kết vô song của tất cả những gì từng tồn tại trước đây."
 tech_planetary_unification_effect:2 "Cung cấp một lượng nhỏ $r_unity$"
 tech_adaptive_bureaucracy:0 "Hành Chính Thích Ứng"
 tech_adaptive_bureaucracy_desc:1 "Tiến bộ đạt được đòi hỏi một hình thức hành chính mới, nhanh nhạy hơn, hỗ trợ thay vì cản trở chúng ta trong các nỗ lực theo đuổi mục tiêu." # The leaps/progress/discoveries we have made demand a new form of administrative system, one that can be shaped by opportunity rather than limit it.
 tech_adaptive_bureaucracy_machine_intelligence:0 "CPU Điện Tử Dương"
 tech_adaptive_bureaucracy_desc_machine_intelligence:0 "CPU điện tử dương vừa rẻ hơn vừa sản xuất nhanh hơn các mẫu trước đó, cho phép chúng ta đưa thêm các đơn vị lãnh đạo vào vận hành."
 tech_effective_bureaucracy:0 "Hành Chính Hiệu Quả"
 tech_effective_bureaucracy_desc:0 "Các thuật toán cải tiến để xử lý và sắp xếp lượng lớn dữ liệu đã tinh giản quá trình ra quyết định và chia sẻ thông tin trong toàn đế chế."
 tech_colonial_bureaucracy:0 "Quan Liêu Thuộc Địa"
 tech_colonial_bureaucracy_desc:0 "Những phát triển hành chính địa phương cho phép giám sát chặt chẽ hơn các vấn đề thuộc địa mà không tạo gánh nặng quá mức lên cơ quan ra quyết định trung ương."
 tech_galactic_bureaucracy:0 "Quan Liêu Thiên Hà"
 tech_galactic_bureaucracy_desc:0 "Nhiều tầng nấc hành chính nổi lên một cách hiệu quả chỉ truyền tải những thông tin trọng yếu nhất lên các cấp chính quyền cao nhất."
 tech_colonial_centralization:0 "Tập Quyền Thuộc Địa"
 tech_colonial_centralization_desc:1 "Các khuôn khổ quản trị địa phương vững chắc được xây dựng theo từng trường hợp cụ thể nhằm đáp ứng nhu cầu của từng thuộc địa."
 tech_galactic_administration:0 "Quản Trị Thiên Hà"
 tech_galactic_administration_desc:1 "Nhu cầu hành chính của một đế chế liên sao vừa đông đảo vừa phức tạp. Chúng ta sẽ vươn lên đáp ứng thách thức thời đại."
 tech_living_state:0 "Nhà Nước Sống"
 tech_living_state_desc:1 "Đế chế sống, Đế chế thở. Chúng ta có thể cấu thành nên thân thể nó, nhưng tay trái không nhất thiết phải biết tay phải đang làm gì." # Our Empire is a living thing, all of us vital organs in its future well-being. OR At some point the system took on a purpose of its own.
 tech_autonomous_agents:0 "Đặc Vụ Tự Trị"
 tech_autonomous_agents_desc:0 "Các đơn vị bán độc lập đã chứng minh tầm quan trọng sống còn đối với thành công của toàn thể chỉnh thể lớn hơn."
 tech_collective_self:0 "Bản Thể Tập Thể"
 tech_collective_self_desc:1 "Tìm kiếm các khía cạnh của bản thân trong nhóm là điều tự nhiên và tất yếu; dần dần những khía cạnh chung đó phải được coi trọng hơn các bản sắc cá nhân riêng lẻ."
 tech_embodied_dynamism:0 "Động Lực Thể Hiện"
 tech_embodied_dynamism_desc:0 "Sự chủ động và mức độ tham vọng nhất định phải được khuyến khích trong các đơn vị lãnh tụ tự trị của chúng ta, đồng thời bảo đảm rằng họ không đi quá xa khỏi các chỉ thị của trí tuệ cốt lõi."
 tech_ethical_equations:0 "Phương Trình Đạo Đức"
 tech_ethical_equations_desc:1 "Hạn chế quyền tự do của người khác trong khi vẫn bảo toàn quyền tự do của chính mình có thể đòi hỏi những kỹ năng nhào lộn tinh thần phi thường — một kỳ tích mà giờ đây chúng ta được trang bị tốt hơn để thực hiện." # At some point the decision must be made whether to keep to antiquated values or do what is necessary to prosper in a new future/world.
 tech_neural_implants:0 "Cấy Ghép Thần Kinh"
 tech_neural_implants_desc:2 "Nhận thức chẳng qua chỉ là quá trình xử lý tín hiệu giác quan đưa vào. Nó hoàn toàn có thể được biến đổi."
 # Free will is nothing more than a sensory illusion.
 tech_global_production_strategy:0 "Chiến Lược Sản Xuất Toàn Cầu"
 tech_global_production_strategy_desc:1 "Các hành tinh rất rộng lớn và các địa điểm sản xuất thường cách xa nhau bởi khoảng cách bao la. Một chiến lược mạch lạc để bảo đảm mọi người đều cùng chung sức kéo về một hướng là điều hết sức cần thiết."
 tech_hyper_entertainment_forum:0 "Quảng Trường Siêu Giải Trí"
 tech_hyper_entertainment_forum_desc:1 "$building_hyper_entertainment_forum_desc$"
 tech_virtual_combat_arena:0 "Mô Phỏng Tác Chiến Ảo"
 tech_virtual_combat_arena_desc:1 "Sự ra đời của các bộ mô phỏng cảm giác đau đớn chính xác cuối cùng sẽ bắc cây cầu nối liền khoảng cách giữa thế giới ảo và thực tại."
 tech_purity_campaigns:0 "Chiến Dịch Thuần Khiết"
 tech_purity_campaigns_desc:1 "Sự tôn vinh tính thuần khiết, có thể là về tinh thần, thể xác hoặc mục đích — tùy thuộc vào bất kỳ mục tiêu nào chúng ta hướng tới."
 tech_galactic_markets:0 "Thị Trường Thiên Hà"
 tech_galactic_markets_desc:1 "$building_galactic_stock_exchange_desc$"
 tech_symbol_unity:0 "Biểu Tượng Đoàn Kết"
 tech_symbol_unity_desc:0 "Khi chúng ta khám phá nhiều hơn về thiên hà và những kỳ quan của nó, việc tái khẳng định niềm tin và thống nhất nhân dân chúng ta dưới một biểu tượng chung ngày càng trở nên quan trọng."
 tech_visitor_center:0 "Trung Tâm Du Khách Ngoại Tinh"
 tech_visitor_center_desc:0 "Khi biết rằng chúng ta không hề đơn độc trong không gian, chúng ta nên bắt đầu chuẩn bị để chào đón những người bạn mới tìm thấy."
 tech_subdermal_stimulation:0 "Kích Thích Dưới Da"
 tech_subdermal_stimulation_desc:0 "Cấy ghép mô sâu là cải tiến mới nhất trong sự giao thoa mang tính cách mạng giữa kỹ thuật cảm giác và trải nghiệm giải trí. \"Nơi chúng ta sắp tới, chúng ta sẽ chẳng cần da thịt để cảm nhận!\""
 tech_paradise_dome:1 "Kiến Trúc Điền Viên"
 tech_paradise_dome_desc:1 "Với những tiến bộ mới nhất trong kiến trúc, cảnh quan và công nghệ hình ảnh ba chiều (hologram), chúng ta sẽ xây dựng những ngôi nhà của tương lai."

 # Social Engineering
 tech_artificial_moral_codes:0 "Quy Chuẩn Đạo Đức Nhân Tạo"
 tech_artificial_moral_codes_desc:1 "Chính hoàn cảnh quyết định điều gì là hợp đạo đức. Định hình hoàn cảnh, và luân lý sẽ như đất sét ngoan ngoãn trong bàn tay bạn."
 # The opinion of the group shape the actions/decisions of the individual.
 tech_synthetic_thought_patterns:0 "Khuôn Mẫu Tư Duy Tổng Hợp"
 tech_synthetic_thought_patterns_desc:2 "Nghĩ vượt ra ngoài khuôn khổ chỉ đơn thuần đưa bạn vào một cái khuôn khác lớn hơn một chút."
 # There is really no such thing as thinking outside the box OR Thinking outside the box is merely thinking inside another, bigger, box.
 edict_will_to_power:1 "$unity_ambition$ Ý Chí Quyền Lực"
 edict_will_to_power_desc:1 "Vì quyền lực đơn giản là khả năng áp đặt ý chí của mình lên kẻ khác, nên ý chí quyền lực là một lời tiên tri tự ứng nghiệm."
 # Seeking control over ones environment is inherent in all beings. We have simply mastered it/we are simply the most effective.
 tech_unity_of_purpose:0 "Thống Nhất Mục Tiêu"
 tech_unity_of_purpose_desc:0 "Mục tiêu của một người là mục tiêu của tất cả. Cùng nhau, chúng ta vĩ đại hơn tổng hòa các phần riêng lẻ gộp lại."

 tech_collective_production_methods:0 "Phương Pháp Sản Xuất Tập Thể"
 tech_collective_production_methods_desc:0 "Cùng nhau, chúng ta kiến tạo tương lai."
 tech_resource_processing_algorithms:0 "Thuật Toán Xử Lý Tài Nguyên"
 tech_resource_processing_algorithms_desc:0 "Hiệu quả trong mọi việc."

 #Other
 tech_xeno_integration:0 "Hội Nhập Dị Tộc"
 tech_xeno_integration_desc:1 "Từ những thành phần riêng rẽ, chúng ta xây dựng nên một chỉnh thể vĩ đại hơn tổng hòa các bộ phận cấu thành."
 # A whole that is/can be greater than the sum of its parts.

 # Unity
 tech_cultural_heritage:0 "Lịch Sử Xã Hội - Văn Hóa"
 tech_cultural_heritage_desc:0 "Hiểu biết về một quá khứ chung là điều kiện tiên quyết để tạo nên bất kỳ bước tiến vượt bậc nào vào tương lai."
 tech_heritage_site:0 "Khu Di Sản"
 tech_heritage_site_desc:0 "Những minh chứng hữu hình nhắc nhở chúng ta đã đi được bao xa vừa khơi dậy lòng tôn kính đối với những thành tựu quá khứ, vừa củng cố tham vọng cho tương lai."
 tech_heritage_site_corporate:0 "Quản Trị Thử Nghiệm Trọng Điểm"
 tech_heritage_site_desc_corporate:0 "Sáng chế thử nghiệm trọng điểm tiềm thức đã đem lại hiệu quả to lớn trong các bộ phận tiếp thị và bán hàng của chúng ta. Bằng cách áp dụng những phương pháp này vào các bộ phận nhân sự tri giác, chúng ta sẽ đạt được mô hình mới táo bạo trong quản trị doanh nghiệp."
 tech_heritage_site_machine_intelligence:0 "Truyền Thông Cấp Hành Tinh"
 tech_heritage_site_desc_machine_intelligence:0 "Việc truyền tải thông tin và mệnh lệnh gần như tức thời giữa các đơn vị có tầm quan trọng sống còn."
 tech_hypercomms_forum:0 "Siêu Truyền Thông Địa Phương"
 tech_hypercomms_forum_desc:0 "Không phải mọi nghiên cứu về các kênh liên lạc nhanh hơn ánh sáng đều mang lại kết quả hữu ích, nhưng một số thành quả có thể tìm thấy mục đích mới trong việc gắn kết nhân dân chúng ta lại với nhau."
 tech_hypercomms_forum_corporate:0 "Hiệp Đồng Hậu Tương Đối Tính"
 tech_hypercomms_forum_desc_corporate:0 "Thời kỳ mà sự hiệp đồng doanh nghiệp chỉ có thể đạt được ở vận tốc dưới ánh sáng đã lùi xa vào dĩ vãng. Đây là kỷ nguyên mới táo bạo của nền kinh tế nhanh hơn ánh sáng, và văn hóa doanh nghiệp của chúng ta phải thích ứng để vượt qua các ràng buộc tương đối tính lỗi thời."
 tech_autocurating_vault:0 "Thuật Toán Lưu Trữ Tự Động"
 tech_autocurating_vault_desc:0 "Phân tích liên tục, bất đồng bộ các tập dữ liệu khác nhau cho phép lập mô hình chính xác các biến động vốn dĩ không thể dự đoán trong các trào lưu xã hội."
 tech_autocurating_vault_corporate:0 "Hầm Lưu Trữ Tài Sản Mua Lại"
 tech_autocurating_vault_desc_corporate:1 "Một hầm chứa khổng lồ trưng bày công khai nhiều thương vụ mua lại vẻ vang của tập đoàn sẽ giúp nhân viên lấy cảm hứng từ các cuộc thâu tóm thành công, đồng thời cảnh giác về những gì xảy ra khi các công ty bị mua lại không hòa nhập đúng đắn vào chiến lược kinh doanh rộng lớn hơn của chúng ta."
 tech_autocurating_vault_machine_intelligence:0 "Trung Tâm Đầu Não Alpha"
 tech_autocurating_vault_desc_machine_intelligence:0 "Mọi lộ trình thông tin đều dẫn về Trung Tâm, nơi Trí Tuệ Máy Móc sơ cấp có thể thong thả phân tích và diễn giải dữ liệu theo ý muốn."
 tech_holographic_rituals:0 "Nghi Lễ Hologram"
 tech_holographic_rituals_desc:0 "Thấy tận mắt mới tin, và niềm tin sẽ tạo ra thực tại."
 tech_consecration_fields:0 "Lực Trường Thánh Hóa"
 tech_consecration_fields_desc:0 "Thông qua sự thấu hiểu về vật lý và thao túng lực trường, các thánh địa của chúng ta sẽ được tất cả mọi người chiêm ngưỡng và cảm nhận."
 tech_transcendent_faith:0 "Đức Tin Siêu Nhận Thức"
 tech_transcendent_faith_desc:0 "Rời khỏi chiếc nôi hành tinh đã mở ra cho chúng ta một cách hiểu mới về đức tin và vị thế của nó trong một bối cảnh rộng lớn hơn."
 tech_alien_sanctuary:0 "Nhập Tịch Ngoại Tinh"
 tech_alien_sanctuary_desc:0 "Việc giới thiệu các trung tâm nhập tịch tiên tiến sẽ đảm bảo rằng bất kỳ người mới nào đến đế chế chúng ta đều được trang bị đầy đủ để hòa nhập vào xã hội mới, đồng thời vẫn bảo tồn được những truyền thống độc đáo của riêng họ."


 # ###################################
 # Society - Weapons
 # ###################################

 tech_amoeba_strike_craft_1:1 "Vũ Khí Hóa Roi Trùng"
 tech_amoeba_strike_craft_1_desc:2 "Bằng cách điều chỉnh quy trình nhân giống Amip Không Gian, chúng ta có thể lập trình các roi trùng cộng sinh của chúng hoạt động như các phi thuyền đột kích hữu cơ cho hải quân."
 tech_swarm_strike_craft_1:0 "Bể Sản Sinh Bầy Đàn"
 tech_swarm_strike_craft_1_desc:1 "Thu thập mẫu vật từ Prethoryn bị đánh bại cho phép chúng ta nhân bản và lập trình di truyền một lứa chiến binh bầy đàn của riêng mình."
 tech_scourge_missile_1:0 "Bọ Đột Kích Bầy Đàn"
 tech_scourge_missile_1_desc:1 "Chúng ta có thể phóng thích một bầy sinh vật đột kích nhỏ từ phi thuyền mẹ để tấn công các mục tiêu của đối phương."
 tech_space_whale_weapon_1:0 "Ống Cắt Xuyên Siphon"
 tech_space_whale_weapon_1_desc:1 "Khai thác công nghệ sinh học từ cơ quan ống hút năng lượng của Tiyanki cho phép tàu chiến của chúng ta tước đoạt lá chắn và giáp của đối phương."

