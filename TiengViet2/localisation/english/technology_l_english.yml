 tech_curator_lab_desc:1 "Các cơ sở nghiên cứu kết hợp phương pháp luận tiên tiến của Hội Giám Tuyển giúp tăng tốc đáng kể các đột phá khoa học."
 tech_archeology_lab:0 "Phòng Thí Nghiệm Khảo Cổ Giám Tuyển"
 tech_archeology_lab_desc:1 "Phòng thí nghiệm trên tàu trang bị dụng cụ khảo cổ tiên tiến, bao gồm một cơ sở dữ liệu khổng lồ do Hội Giám Tuyển cung cấp, nơi các phát hiện mới có thể dễ dàng được tra cứu đối chiếu."
