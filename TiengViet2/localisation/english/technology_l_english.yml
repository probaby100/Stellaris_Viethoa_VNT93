 # Repeatable techs
 # ###################################

 # Engineering
 tech_repeatable_improved_tile_mineral_output:0 "Mô Hình Khai Thác"
 tech_repeatable_improved_tile_mineral_output_desc:2 "Những thay đổi trong cách đánh giá trữ lượng khoáng sản tương quan với nhau giúp hình thành các mô hình khoan đục hiệu quả hơn."
 tech_repeatable_improved_military_station_damage:0 "Mô Hình Bắn Đồng Bộ"
 tech_repeatable_improved_military_station_damage_desc:1 "Liên kết chéo các hệ thống vũ khí để bắn theo loạt so le giúp cải thiện sản lượng sát thương thực tế của các Trạm Quân Sự theo thời gian."
 tech_repeatable_improved_military_station_health:0 "Gia Cố Lớp Lõi"
 tech_repeatable_improved_military_station_health_desc:1 "Các lớp giáp bổ sung bên trong cấu trúc giúp nâng cao khả năng chống chịu của các Trạm Quân Sự."
 tech_repeatable_improved_ship_health:0 "Độ Toàn Vẹn Thân Tàu"
 tech_repeatable_improved_ship_health_desc:1 "Tăng cường phân chia khoang ngăn trên tàu cho phép tàu chiến chống chịu nhiều sát thương hơn trước khi độ toàn vẹn thân tàu rơi xuống mức nguy kịch."
 tech_repeatable_improved_armor_output:0 "Nén Vật Chất"
 tech_repeatable_improved_armor_output_desc:1 "Nén các vật liệu phù hợp thành các dạng siêu đậm đặc là phương thức rẻ tiền và hiệu quả để nâng cao khả năng hấp thụ các tác động từ vũ khí quân dụng."
 tech_repeatable_weapon_type_explosive_damage:0 "Kiểm Soát Đương Lượng Nhiệt Động"
 tech_repeatable_weapon_type_explosive_damage_desc:1 "Với phản ứng hóa học được kiểm soát chặt chẽ bởi các bộ vi xử lý trên tên lửa, sức công phá của đầu đạn có thể được tinh chỉnh để đạt hiệu quả tối đa theo điều kiện tại chỗ lúc va chạm."
 tech_repeatable_weapon_type_explosive_fire_rate:0 "Bộ Điểm Hỏa Thu Nhỏ"
 tech_repeatable_weapon_type_explosive_fire_rate_desc:1 "Những tiến bộ trong kỹ thuật thu nhỏ cho phép nạp và phóng nhanh hơn các tải trọng đẩy bằng tên lửa."
 tech_repeatable_weapon_type_kinetic_damage:0 "Đạn Dược Mật Độ Cao"
 tech_repeatable_weapon_type_kinetic_damage_desc:1 "Các đầu đạn siêu đậm đặc có thể xuyên thủng ngay cả những tấm lá chắn năng lượng mạnh nhất."
 tech_repeatable_weapon_type_kinetic_fire_rate:0 "Hiệu Suất Tiếp Đạn"
 tech_repeatable_weapon_type_kinetic_fire_rate_desc:1 "Những tiến bộ kỹ thuật nhỏ kết hợp với quy trình thao tác đạn dược cải tiến trên tàu mang lại sự gia tăng rõ rệt về tốc độ bắn."

 #Physics
 tech_repeatable_improved_tile_energy_output:0 "Ứng Dụng Siêu Dẫn"
 tech_repeatable_improved_tile_energy_output_desc:1 "Những cải tiến nhỏ về hiệu suất truyền tải cộng lại thành sự sụt giảm đáng kể trong tổng lượng hao hụt năng lượng."
 tech_repeatable_improved_shield_output:0 "Hài Hòa Lá Chắn"
 tech_repeatable_improved_shield_output_desc:1 "Cơ chế cơ bản của lá chắn tàu chiến rất phức tạp, nhưng chúng có thể được điều chỉnh và cải thiện theo vô số cách thức."
 tech_repeatable_weapon_type_energy_damage:0 "Mảng Hội Tụ"
 tech_repeatable_weapon_type_energy_damage_desc:1 "Hoàn thiện nhịp bắn của vũ khí laser là một nhiệm vụ có thể khiến giới tinh hoa kỹ thuật của bất kỳ hành tinh nào bận rộn trong nhiều thế kỷ."
 tech_repeatable_weapon_type_energy_fire_rate:0 "Chất Làm Mát Siêu Tốc"
 tech_repeatable_weapon_type_energy_fire_rate_desc:1 "Những phát triển mới trong kỹ thuật làm mát thường xuyên xuất hiện, cải thiện độ ổn định và hiệu suất của các hệ thống vũ khí, giữ cho chúng không làm nổ tung các con tàu mang chúng."
 tech_repeatable_weapon_type_strike_craft_fire_damage:0 "Bộ Đánh Chặn Khớp Thần Kinh"
 tech_repeatable_weapon_type_strike_craft_fire_damage_desc:1 "Tăng tốc độ mà các phi công chiến đấu xử lý và hành động dựa trên dữ liệu định vị đối phương sẽ nâng tầm các phi đội đột kích lên vài nấc trong chuỗi thức ăn chiến trường."
 tech_repeatable_weapon_type_strike_craft_fire_rate:1 "Huấn Luyện Phi Công Lặp"
 tech_repeatable_weapon_type_strike_craft_fire_rate_desc:2 "Bằng cách thu thập và phân tích dữ liệu hiệu suất của các phi công đi trước, chúng ta đã cải thiện theo cấp số nhân các phương pháp huấn luyện phi công. Mỗi thế hệ sau sẽ nhanh nhẹn hơn thế hệ trước."
 tech_repeatable_improved_planet_sensor_range:0 "Bộ Tăng Cường Tín Hiệu Hành Tinh"
 tech_repeatable_improved_planet_sensor_range_desc:1 "Khi các hạm đội của chúng ta ngày càng tiến xa hơn khỏi quê hương tổ tiên, công nghệ cảm biến của chúng ta liên tục vượt qua các giới hạn cũ."
 tech_repeatable_reduced_building_cost:0 "Phân Tích Trọng Lực"
 tech_repeatable_reduced_building_cost_desc:1 "Các mô hình điện toán ngày càng mạnh mẽ cho phép chúng ta điều chỉnh từng dự án xây dựng phù hợp với điều kiện trọng lực cục bộ và toàn hành tinh." #by adapting each construction-project to local gravitational conditions we can save on materials used
 tech_repeatable_reduced_building_time:0 "Thuật Toán Lắp Ráp"
 tech_repeatable_reduced_building_time_desc:1 "Ứng dụng lý thuyết trò chơi và câu đố có tiềm năng tối ưu hóa vượt bậc việc lắp ráp và thi công mô-đun." # through the use of advanced puzzle-logic we can make sure each building is assembled in the optimal order and pattern

 #Society:
 tech_repeatable_improved_tile_food_output:0 "Cây Trồng Chuyển Gen Tinh Lọc"
 tech_repeatable_improved_tile_food_output_desc:1 "Cây trồng chuyển gen cung cấp các yếu tố dinh dưỡng của nhiều loại cây lương thực tiêu chuẩn trong một gói tiện lợi duy nhất."
 tech_repeatable_improved_sector_cap:0 "Giao Thức Liên Lạc"
 tech_repeatable_improved_sector_cap_desc:1 "Các kênh liên lạc FTL cải tiến cho phép đưa ra chỉ đạo hành chính mạch lạc hơn."
 tech_repeatable_improved_core_system_cap:0 "Hiệu Quả Hành Chính"
 tech_repeatable_improved_core_system_cap_desc:1 "Tái cấu trúc mạng lưới quản lý liên kết các thế giới cốt lõi với thủ đô có thể giúp giảm bớt căng thẳng hành chính và các nút thắt cổ chai thông tin thường nảy sinh trong một đế chế non trẻ."
 tech_repeatable_improved_leader_cap:0 "Quản Trị Nguồn Lực Tri Giác"
 tech_repeatable_improved_leader_cap_desc:1 "Khái niệm quản lý các cá thể như nguồn tài nguyên bên trong các hệ thống sản xuất lớn hơn bắt buộc phải trở nên linh hoạt hơn khi bản chất tiềm tàng của các cá thể được quản lý ngày càng phong phú."
 tech_repeatable_reduced_leader_cost:0 "Thu Hút Nhân Tài"
 tech_repeatable_reduced_leader_cost_desc:1 "Các chương trình tuyên truyền và sự điều chỉnh tinh tế các hồ sơ kinh tế giúp hạ giảm chi phí tuyển dụng các Lãnh Tụ hàng đầu."
 tech_repeatable_reduced_leader_cost_machine_intelligence:0 "Cơ Chế Bảo Vệ Nhân Cách"
 tech_repeatable_reduced_leader_cost_desc_machine_intelligence:0 "Một ma trận nhân cách mới khởi động luôn có nguy cơ rơi vào trạng thái điên loạn hoặc ám ảnh vô bổ, dẫn đến việc phải hiệu chỉnh mã tốn kém và mất thời gian. Các biện pháp bảo vệ tốt hơn sẽ làm giảm rủi ro này."
 tech_repeatable_improved_edict_length:0 "Phát Sóng Tuyên Cáo"
 tech_repeatable_improved_edict_length_desc:1 "Các chiến dịch thông tin chủ động hơn giúp nâng cao khả năng tiếp nhận Sắc Lệnh của quần chúng."
 tech_repeatable_improved_army_damage:0 "Huấn Luyện Khắc Nghiệt"
 tech_repeatable_improved_army_damage_desc:1 "Cải tiến liên tục chế độ rèn luyện thể lực tiêu chuẩn cho bộ binh đã chứng minh giúp họ tác chiến hiệu quả hơn trong đối đầu trực diện."
 tech_repeatable_improved_army_health:0 "Liệu Pháp Tăng Sinh Tế Bào"
 tech_repeatable_improved_army_health_desc:1 "Áp dụng định kỳ các phương pháp điều trị kích thích sinh học liều lượng nhẹ giúp bộ binh duy trì thể trạng đỉnh cao ngay cả trong những chiến dịch kéo dài."
 tech_repeatable_improved_leader_life_span:0 "Liệu Pháp Hồi Sinh"
 tech_repeatable_improved_leader_life_span_desc:1 "Các phương pháp điều trị tái tạo tế bào tiên tiến có thể kéo dài đáng kể tuổi thọ tự nhiên của các cá thể."
 tech_repeatable_improved_starbase_capacity:0 "Khuôn Khổ Hậu Cần Không Gian"
 tech_repeatable_improved_starbase_capacity_desc:1 "Hệ thống liên lạc tự trị được tối ưu hóa giữa các căn cứ sao giúp giảm tải áp lực điều phối trung tâm."
 tech_repeatable_improved_slave_mineral_output:0 "Ý Thức Tuân Lệnh"
 tech_repeatable_improved_slave_mineral_output_desc:1 "Áp dụng các kỹ thuật kỷ luật và điều hòa hành vi nghiêm ngặt giúp nâng cao năng suất của lao động nô lệ."
 tech_repeatable_naval_cap:0 "Quy Trình Quản Lý Hạm Đội"
 tech_repeatable_naval_cap_desc:0 "Các quy trình quản lý hạm đội cải tiến sẽ giải phóng các nguồn tài nguyên cần thiết để duy trì một hạm đội lớn hơn."
