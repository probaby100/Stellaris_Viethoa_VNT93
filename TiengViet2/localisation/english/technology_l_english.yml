 tech_titan_hull_1:0 "Thân Tàu Titan Cải Tiến"
 tech_titan_hull_1_desc:0 "Tiến bộ trong kỹ thuật đóng tàu sẽ cho phép chế tạo các tàu Titan vững chắc và bền bỉ hơn."
 tech_titan_hull_2:0 "Thân Tàu Titan Tiên Tiến"
 tech_titan_hull_2_desc:0 "Thế hệ thân tàu Titan mới nhất sở hữu trường toàn vẹn cấu trúc tối ưu và các vách ngăn kiên cố hơn."
