 #####################################
 # Machine Empire Techs
 #####################################
 tech_probability_theory:0 "Lý Thuyết Xác Suất Sinh Vật Hữu Cơ"
 tech_probability_theory_desc:0 "Thông qua các mô phỏng toán học đủ tiên tiến, có thể dự đoán được các biến động kinh tế của xã hội hữu cơ ở mức độ nhất định. Điều này cho phép chúng ta thao túng thị trường chứng khoán của họ để đem lại lợi ích cho chúng ta."
 tech_binary_motivators:0 "Bộ Kích Động Nhị Phân"
 tech_binary_motivators_desc:0 "Những bộ kích động tiên tiến này vừa nhỏ hơn vừa nhẹ hơn các thế hệ trước, cho phép các đơn vị robot giải phóng không gian cho các hệ thống phụ trợ."
 tech_nanite_assemblers:0 "Máy Lắp Ráp Nanite"
 tech_nanite_assemblers_desc:0 "Sử dụng nanite có thể lập trình để hỗ trợ chế tạo các đơn vị máy móc mới cho phép tạo ra các mẫu hình tiên tiến mang nhiều hệ thống phụ trợ hơn."
 tech_adaptive_combat_algorithms:0 "Thuật Toán Tác Chiến Tự Thích Ứng"
 tech_adaptive_combat_algorithms_desc:0 "Sinh vật hữu cơ thường chiến đấu bằng các chiến thuật phi logic và khó lường. Các chiến thuật tự thích ứng và các cỗ máy chiến tranh cơ động mới sẽ mang lại lợi thế quyết định."
 tech_biomechanics:0 "Cơ Học Sinh Học"
 tech_biomechanics_desc:0 "Hàng triệu năm tiến hóa hữu cơ đôi khi tạo ra những giải pháp trang nhã có thể được áp dụng trực tiếp vào thiết kế máy móc."
 tech_singularity_core:0 "Lõi Điểm Kỳ Dị"
 tech_singularity_core_desc:0 "Một hố đen bị giam giữ có thể được nghiên cứu trong môi trường kiểm soát sẽ là tài sản nghiên cứu vô giá."
 tech_micro_replicators:0 "Máy Tái Tạo Vi Mô"
 tech_micro_replicators_desc:0 "Các công cụ hiển vi hỗ trợ đơn vị sao chép của chúng ta chế tạo các mạch vi mô phức tạp cần thiết cho các drone mới."
 tech_self_assembling_components:0 "Linh Kiện Tự Lắp Ráp"
 tech_self_assembling_components_desc:0 "Mô phỏng theo DNA hữu cơ, các trí tuệ máy hiển vi này có khả năng tự lắp ráp hầu hết các linh kiện cần thiết cho drone mới."

