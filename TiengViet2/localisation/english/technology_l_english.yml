 # Engineering
 # ###################################

 # Ship sizes
 tech_space_exploration:0 "Thám Hiểm Không Gian"
 tech_space_exploration_desc:0 "Bước đột phá trong du hành nhanh hơn ánh sáng mở ra kỷ nguyên mới cho công cuộc khám phá vũ trụ. Các sứ mệnh có người lái đến các hệ sao khác giờ đây không chỉ khả thi, mà còn là điều thiết yếu."
 tech_corvettes:0 "Tàu Hộ Tống"
 tech_corvettes_desc:0 "Đột phá về FTL cho phép ứng dụng khung vỏ tàu con thoi mặt đất-vũ trụ truyền thống vào mục đích quân sự, chế tạo nên các tàu chiến tương đối nhỏ gọn, cơ động, tốc độ cao nhưng hỏa lực còn hạn chế."
 tech_destroyers:0 "Tàu Khu Trục"
 tech_destroyers_desc:0 "Tuy lớn hơn Tàu Hộ Tống, cấu hình thân Tàu Khu Trục vẫn giữ được sự linh hoạt đáng nể của một tàu pháo cơ động."
 tech_cruisers:0 "Tàu Tuần Dương"
 tech_cruisers_desc:0 "Ban đầu được phát triển dưới dạng cấu hình thân tàu thuộc địa thử nghiệm thế hệ mới, thiết kế với nhiều điểm gá vũ khí khiến nó trở nên lý tưởng để trang bị khí tài hạng nặng."
 tech_battleships:0 "Thiết Giáp Hạm"
 tech_battleships_desc:0 "Là lớp tàu lớn nhất trong số các chiến hạm tiêu chuẩn, Thiết Giáp Hạm theo truyền thống được bọc giáp dày đặc và mang theo nhiều khẩu đội pháo hùng mạnh."
 tech_titans:0 "Tàu Titan"
 tech_titans_desc:1 "Thiết kế tàu chiến ở quy mô này cho phép kết hợp hỏa lực hủy diệt phi thường với các hệ thống hỗ trợ tối tân. Cấu hình Titan có thể đóng vai trò soái hạm đa năng, vừa tăng cường sức mạnh cho các tàu xung quanh vừa khống chế kẻ địch."
 tech_colossus:0 "Pháo Đài Hủy Diệt Hành Tinh (Colossus)"
 tech_colossus_desc:1 "Tiến bộ trong siêu kỹ thuật đã xóa nhòa ranh giới giữa thực tế và viễn tưởng dưới hình thái các chiến hạm Colossus. Những nền tảng vũ khí đơn lẻ khổng lồ này có thể biến đổi tận gốc hoặc xóa sổ cả một thế giới chỉ bằng một nút bấm."

 # Ships upgrades
 tech_corvette_hull_1:0 "Thân Tàu Hộ Tống Cải Tiến"
 tech_corvette_hull_1_desc:0 "Tiến bộ trong kỹ thuật đóng tàu sẽ cho phép chế tạo các tàu hộ tống vững chắc và bền bỉ hơn."
 tech_corvette_hull_2:0 "Thân Tàu Hộ Tống Tiên Tiến"
 tech_corvette_hull_2_desc:0 "Thế hệ thân tàu hộ tống mới nhất sở hữu trường toàn vẹn cấu trúc tối ưu và các vách ngăn kiên cố hơn."
 tech_corvette_build_speed:0 "Khuôn Mẫu Tàu Hộ Tống Chuẩn Hóa"
 tech_corvette_build_speed_desc:0 "Thiết lập các tiêu chuẩn mới cho thiết kế và chế tạo tàu hộ tống sẽ cải thiện đáng kể hiệu suất dây chuyền sản xuất."

